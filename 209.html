<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Elevator Visual</title>
  <style>
    ::-webkit-scrollbar {
      width: 0.625rem;
      height: 0.625rem;
    }

    ::-webkit-scrollbar-thumb {
      background: #111;
      border-radius: 0.3125rem;
      box-shadow: inset 0.125rem 0.125rem 0.125rem rgba(255, 255, 255, 0.25),
        inset -0.125rem -0.125rem 0.125rem rgba(0, 0, 0, 0.25);
      cursor: default;
    }

    ::-webkit-scrollbar-track {
      background: #333;
    }

    ::selection {
      background: #fff;
      color: #333;
    }

    html,
    body {
      height: 100vh;
      height: 100dvh;
      margin: 0;
      overflow: hidden;
    }

    body {
      display: grid;
      grid-template-rows: calc(100dvh - 4rem) 4rem;
      font-family: system-ui, sans-serif;
      background: #000;
    }

    canvas,
    .editor,
    #controls {
      grid-row: 1;
      grid-column: 1;
    }

    canvas {
      --canvas-z-index: -1;
      width: 100%;
      height: auto;
      object-fit: contain;
      background: black;
      touch-action: none;
      z-index: var(--canvas-z-index);
    }

    .editor,
    .overlay,
    #error {
      font-family: 'Courier New', Courier, monospace;
      background: repeating-linear-gradient(0deg, #000a, #1119, #000a .25rem);
      padding: 1em;
    }

    .editor {
      color: #fefefe;
      tab-size: 2;
      border: none;
      resize: none;
    }

    .editor:focus {
      outline: none;
    }

    #error {
      grid-row: 2;
      grid-column: 1;
      margin: 0;
      padding-block: 0;
      padding-top: .5em;
      color: firebrick;
      overflow: auto;
      text-wrap: pretty;
    }

    #indicator {
      visibility: hidden;
      position: absolute;
      top: calc(var(--top, 0px) - var(--scroll-top, 0px));
      width: 0;
      height: 0;
      border-top: 10px solid transparent;
      border-bottom: 10px solid transparent;
      border-left: 10px solid firebrick;
      transform: translateY(-25%);
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      margin: 0;
    }

    .editor,
    .overlay {
      font-size: 1rem;
      line-height: 1.2;
      white-space: pre;
    }

    #controls {
      position: fixed;
      top: 1em;
      right: 2em;
      z-index: 100;
    }

    .controls {
      position: relative;
      display: flex;
      gap: 1.5em;
      padding: .5em 1.25em;
      background: #1111;
      border-radius: 4px;
    }

    .controls::before,
    .controls::after {
      content: '';
      position: absolute;
      z-index: -1;
      inset: 0;
      transform: scale(.95);
      border-radius: inherit;
      opacity: 0;
    }

    .controls::before {
      background: #aef;
      animation: pulse 2s infinite;
    }

    .controls::after {
      background: #fefefe66;
      transition: transform 200ms ease-in-out;
    }

    .controls:hover::before,
    .controls:hover::after {
      opacity: 1;
    }

    .controls:hover::before {
      transform: scale(.98);
      filter: blur(2px);
    }

    .controls:hover::after {
      transform: scale(1.025, 1.1);
    }

    .controls:hover {
      background: #111f;
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.0125);
      }

      100% {
        transform: scale(1);
      }
    }

    .hidden {
      display: none !important;
    }

    .opaque {
      opacity: 1 !important;
      background: #111 !important;
    }

    input {
      all: unset;
      opacity: .2;
      filter: saturate(0) invert(1);
      cursor: pointer;
      transition: opacity 200ms ease-in-out;
      padding: .25em .5em;
    }

    input:hover {
      opacity: 1;
    }

    .icon {
      text-align: center;
      line-height: 1;
    }

    #btnToggleView {
      width: 1.25em;
    }

    #btnToggleView::after {
      content: '👁';
    }

    #btnToggleView:checked::after {
      content: '✏️';
    }

    #btnToggleResolution::after {
      content: '1️⃣';
    }

    #btnToggleResolution:checked::after {
      content: '2️⃣';
    }

    #btnReset::after {
      content: '⏮️';
    }

    #btnPlayStop::after {
      content: '▶️';
    }

    #btnPlayStop:checked::after {
      content: '⏸️';
    }

    .lil-gui {
      --background-color: rgba(20, 20, 25, 0.85);
      --text-color: #e0e0e0;
      --title-background-color: #1a1a24;
      --widget-color: #2a2a38;
      --hover-color: #3a3a4c;
      --focus-color: #4a4a60;
      --number-color: #00e5ff;
      --string-color: #80ffea;
      font-family: system-ui, -apple-system, sans-serif;
      z-index: 1000 !important;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <textarea id="codeEditor" class="editor" spellcheck="false" autocorrect="off" autocapitalize="off" translate="no" oninput="render()"></textarea>
  <pre id="error"></pre>
  <div id="indicator"></div>
  <div id="controls">
    <div class="controls">
      <input id="btnToggleView" class="icon" type="checkbox" name="toggleView" onclick="toggleView()">
      <input id="btnToggleResolution" class="icon" type="checkbox" name="toggleResolution" onchange="toggleResolution()">
      <input id="btnReset" class="icon" type="checkbox" name="reset" onclick="reset()">
      <input id="btnPlayStop" class="icon" type="checkbox" name="playStop" onclick="togglePlayStop()">
    </div>
  </div>

  <script type="x-shader/x-fragment">#version 300 es
/*********
* made by Matthias Hurrle (@atzedent)
* Enhanced with custom presets, interactive controls, and greenscreen background
*/
precision highp float;
out vec4 O;
uniform float time;
uniform vec2 resolution;
uniform vec2 wheel;
uniform vec2 move;
uniform float zoom;

uniform bool u_greenscreen;
uniform vec3 u_bgColor;
uniform vec3 u_color1;
uniform vec3 u_color2;
uniform vec3 u_specularColor;
uniform float u_scale;
uniform float u_distortion;
uniform int u_animMode;

#define FC gl_FragCoord.xy
#define R resolution
#define N normalize
#define S smoothstep
#define MN min(R.x,R.y)

float rnd(vec2 a) {
	vec3 p=fract(vec3(a.xyx)*.1031);
	p+=dot(p,p.yzx+33.33);
	return fract((p.x+p.y)*p.z);
}
float noise(vec2 p, float t) {
	vec2 i=floor(p), f=fract(p);
	float d=.25;
	for (float y=-2.; y<=2.; y++) {
		for (float x=-2.; x<=2.; x++) {
			vec2 n=vec2(x,y);
			float r=rnd(i+n);
			p=vec2(r,fract(r+x*y));
			p=.5+.5*sin(t+6.3*p);
			d=min(d,length(n+p-f));
		}
	}
	return d;
}
float fbm(vec2 p, float tt) {
	float t=.0, a=.5;
	mat2 m=mat2(cos(tt*.01-vec4(0,11,33,0)));
	for (int i; i++<2;) {
		t+=a*noise(p,tt);
		p*=2.*m;
		a/=2.;
	}
	return t;
}
vec3 render(vec2 uv, float animTime) {
	float t=animTime*.2;
	vec2 q=vec2(noise(uv*u_scale+t,t),noise(uv-t,t*1.5))*u_distortion;
	float h=fbm(uv*(u_scale*0.6)-q,t);
	vec3 n=N(-vec3(
		fbm((vec2(.015,0))*10.+q,t)-h,
		fbm((uv+vec2(0,.015))*1.5+q,t)-h,
		-.06-.02*sin(sin(animTime))
	)),
	l=N(vec3(.1,.5,1));
	float d=clamp(dot(n,l),.0,1.), spe=pow(d,8.);
	vec3 col=u_color1*S(.7,.2,h);
	col=mix(col,u_color2,S(.7,.5,h));
	col+=spe*1.5*u_specularColor;
	col*=S(-.5,1.5,d);
	col=tanh(col);
	return col;
}
void main() {
	// Center UV coordinates
	vec2 uv = (FC - R * 0.5) / MN;

	// Apply zoom and mouse drag position
	float currentZoom = (zoom <= 0.0) ? 1.0 : zoom;
	uv *= currentZoom;
	uv -= move / MN;

	// Animation Mode modifications
	float animTime = time;
	if (u_animMode == 1) { // Subtle Wave
		uv += vec2(sin(time * 0.5), cos(time * 0.4)) * 0.05;
	} else if (u_animMode == 2) { // Orbital Drift
		float a = time * 0.15;
		uv = mat2(cos(a), -sin(a), sin(a), cos(a)) * uv;
	} else if (u_animMode == 3) { // Cosmic Surge
		uv *= (1.0 + 0.12 * sin(time * 0.7));
	} else if (u_animMode == 4) { // Static (No Movement)
		animTime = 10.0;
	}

	vec3 sceneCol = mix(vec3(0), render(uv*.5+sin(uv*vec2(10,30))*3e-3, animTime), min(animTime*.3,1.));
	
	// Vignette calculation
	vec2 c = FC / R;
	c *= 1. - c.yx;
	float vig = c.x * c.y * 25.;
	vig = pow(vig, .125);
	
	if (u_greenscreen) {
		float brightness = max(sceneCol.r, max(sceneCol.g, sceneCol.b));
		if (brightness < 0.04) {
			sceneCol = u_bgColor;
		} else {
			float mask = smoothstep(0.02, 0.12, brightness);
			sceneCol = mix(u_bgColor, sceneCol * vig, mask);
		}
	} else {
		sceneCol *= vig;
	}

	O = vec4(sceneCol, 1.0);
}</script>

  <script type="module">
    import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

    let editMode = false;
    let playOnLoad = true;
    let resolution = .5;
    let renderDelay = 1000;
    let startTime = 0;
    let elapsedTime = 0;
    let accumulatedTime = 0;
    let lastTime = 0;
    let interactionFrameRequested = false;
    let dpr = Math.max(1, resolution * window.devicePixelRatio);
    let frm, source, editor, renderer, pointers, gui;
    let isUIHidden = false;

    // Helper to convert hex to RGB vec3
    function hexToRgb(hex) {
      let c = hex.replace('#', '');
      if (c.length === 3) c = c.split('').map(x => x + x).join('');
      const num = parseInt(c, 16);
      return [((num >> 16) & 255) / 255, ((num >> 8) & 255) / 255, (num & 255) / 255];
    }

    // Preset Definitions
    const COLOR_PRESETS = {
      'Cyber Turquoise': {
        color1: '#0d1a33',
        color2: '#1ab3cc',
        specularColor: '#80f2ff'
      },
      'Liquid Gold': {
        color1: '#261405',
        color2: '#ffaa00',
        specularColor: '#ffe066'
      },
      'Neon Synthwave': {
        color1: '#1a002b',
        color2: '#ff007f',
        specularColor: '#00f0ff'
      },
      'Emerald Bio-Fluid': {
        color1: '#031f11',
        color2: '#10e674',
        specularColor: '#a3ffd1'
      },
      'Platinum Chrome': {
        color1: '#121214',
        color2: '#c0c0d0',
        specularColor: '#ffffff'
      }
    };

    const ANIMATION_PRESETS = {
      'Smooth Flow': 0,
      'Subtle Wave': 1,
      'Orbital Drift': 2,
      'Cosmic Surge': 3,
      'Static (No Movement)': 4
    };

    // Settings Object
    const settings = {
      colorScheme: 'Cyber Turquoise',
      color1: '#0d1a33',
      color2: '#1ab3cc',
      specularColor: '#80f2ff',

      greenscreen: false,
      bgColor: '#00ff00',

      animationPreset: 'Smooth Flow',
      animSpeed: 1.0,

      dpr: dpr,
      scale: 10.0,
      distortion: 0.1,

      clickToRandomize: true,
      resetView: () => {
        pointers.reset();
        renderInteractionFrame();
      }
    };

    window.onload = init;

    function resize() {
      const { innerWidth: width, innerHeight: height } = window;
      canvas.width = width * settings.dpr;
      canvas.height = height * settings.dpr;

      if (renderer) {
        renderer.updateScale(settings.dpr);
        renderInteractionFrame();
      }
    }

    window.toggleView = function toggleView() {
      editor.hidden = btnToggleView.checked;
      canvas.style.setProperty('--canvas-z-index', btnToggleView.checked ? 0 : -1);
    };

    window.reset = function reset() {
      let shader = source;
      editor.text = shader ? shader.textContent : renderer.defaultSource;
      renderThis();
    };

    window.toggleResolution = function toggleResolution() {
      resolution = btnToggleResolution.checked ? .5 : 1;
      settings.dpr = Math.max(1, resolution * window.devicePixelRatio);
      pointers.updateScale(settings.dpr);
      resize();
    };

    function update() {
      renderer.updateMouse(pointers.first);
      renderer.updatePointerCount(pointers.count);
      renderer.updatePointerCoords(pointers.coords);
      renderer.updateMove(pointers.move);
      renderer.updateZoom(pointers.zoomed);
      renderer.updateWheel(pointers.wheel);
    }

    function loop(now) {
      if (lastTime === 0) lastTime = now;
      const delta = (now - lastTime) * 1e-3;
      lastTime = now;

      // Accumulate time scaled by animation speed
      if (settings.animationPreset !== 'Static (No Movement)') {
        accumulatedTime += delta * settings.animSpeed;
      }

      update();
      renderer.render(accumulatedTime);
      frm = requestAnimationFrame(loop);
    }

    async function renderThis() {
      editor.clearError();
      const result = renderer.test(editor.text);

      if (result) {
        editor.setError(result);
      } else {
        renderer.updateShader(editor.text);
      }
      const wasPlaying = !!frm;
      cancelAnimationFrame(frm);
      frm = null;

      if (wasPlaying || playOnLoad) {
        play();
      } else {
        renderer.render(accumulatedTime);
      }
    }

    const play = () => {
      if (frm) return;
      lastTime = performance.now();
      loop(performance.now());
      btnPlayStop.checked = true;
    };

    const stop = () => {
      cancelAnimationFrame(frm);
      frm = null;
      btnPlayStop.checked = false;
    };

    window.togglePlayStop = function togglePlayStop() {
      if (btnPlayStop.checked) {
        playOnLoad = true;
        play();
      } else {
        playOnLoad = false;
        stop();
      }
    };

    const debounce = (fn, delay) => {
      let timerId;
      return (...args) => {
        clearTimeout(timerId);
        timerId = setTimeout(() => fn.apply(this, args), delay);
      };
    };
    window.render = debounce(renderThis, renderDelay);

    function renderInteractionFrame() {
      if (frm || interactionFrameRequested || !renderer || !pointers) return;
      interactionFrameRequested = true;
      requestAnimationFrame(() => {
        interactionFrameRequested = false;
        if (frm) return;
        update();
        renderer.render(accumulatedTime);
      });
    }

    function setupGUI() {
      gui = new GUI({ title: 'Scene Controls' });

      // Greenscreen Controls
      const fGreen = gui.addFolder('Background & Keying');
      fGreen.add(settings, 'greenscreen').name('Green Screen').onChange(renderInteractionFrame);
      fGreen.addColor(settings, 'bgColor').name('Background Color').onChange(renderInteractionFrame);

      // Color Scheme & Colors
      const fColor = gui.addFolder('Color Schemes');
      const schemeController = fColor.add(settings, 'colorScheme', Object.keys(COLOR_PRESETS)).name('Preset').onChange((val) => {
        if (COLOR_PRESETS[val]) {
          settings.color1 = COLOR_PRESETS[val].color1;
          settings.color2 = COLOR_PRESETS[val].color2;
          settings.specularColor = COLOR_PRESETS[val].specularColor;
          gui.controllers.forEach(c => c.updateDisplay());
          renderInteractionFrame();
        }
      });
      fColor.addColor(settings, 'color1').name('Shadow Color').onChange(() => {
        settings.colorScheme = 'Custom';
        schemeController.updateDisplay();
        renderInteractionFrame();
      });
      fColor.addColor(settings, 'color2').name('Accent Color').onChange(() => {
        settings.colorScheme = 'Custom';
        schemeController.updateDisplay();
        renderInteractionFrame();
      });
      fColor.addColor(settings, 'specularColor').name('Specular Highlight').onChange(() => {
        settings.colorScheme = 'Custom';
        schemeController.updateDisplay();
        renderInteractionFrame();
      });

      // Animation Controls
      const fAnim = gui.addFolder('Animation');
      fAnim.add(settings, 'animationPreset', Object.keys(ANIMATION_PRESETS)).name('Motion Mode').onChange(renderInteractionFrame);
      fAnim.add(settings, 'animSpeed', 0.0, 3.0, 0.1).name('Speed').onChange(renderInteractionFrame);

      // Rendering & DPR
      const fRender = gui.addFolder('Render Settings');
      fRender.add(settings, 'dpr', 0.5, 2.0, 0.25).name('Pixel Ratio (DPR)').onChange((val) => {
        pointers.updateScale(val);
        resize();
      });
      fRender.add(settings, 'scale', 2.0, 25.0, 0.5).name('Noise Scale').onChange(renderInteractionFrame);
      fRender.add(settings, 'distortion', 0.02, 0.4, 0.01).name('Distortion').onChange(renderInteractionFrame);
      fRender.add(settings, 'resetView').name('Reset Drag / Zoom');

      // Randomization mode
      const fRandom = gui.addFolder('Interactivity');
      fRandom.add(settings, 'clickToRandomize').name('Click to Randomize');
    }

    function randomizeScene() {
      // Randomize colors
      const hue1 = Math.random();
      const hue2 = (hue1 + 0.3 + Math.random() * 0.4) % 1.0;
      
      const hslToHex = (h, s, l) => {
        const a = s * Math.min(l, 1 - l);
        const f = n => {
          const k = (n + h * 12) % 12;
          const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
          return Math.round(255 * color).toString(16).padStart(2, '0');
        };
        return `#${f(0)}${f(8)}${f(4)}`;
      };

      settings.color1 = hslToHex(hue1, 0.6 + Math.random() * 0.4, 0.1 + Math.random() * 0.2);
      settings.color2 = hslToHex(hue2, 0.7 + Math.random() * 0.3, 0.4 + Math.random() * 0.4);
      settings.specularColor = hslToHex((hue2 + 0.1) % 1.0, 0.5 + Math.random() * 0.5, 0.7 + Math.random() * 0.3);
      settings.colorScheme = 'Custom';

      // Randomize parameters
      settings.scale = +(5.0 + Math.random() * 15.0).toFixed(1);
      settings.distortion = +(0.05 + Math.random() * 0.25).toFixed(2);
      settings.animSpeed = +(0.5 + Math.random() * 1.5).toFixed(1);

      // Randomize animation preset (pick non-static usually)
      const presets = Object.keys(ANIMATION_PRESETS);
      settings.animationPreset = presets[Math.floor(Math.random() * (presets.length - 1))];

      // Update GUI
      gui.controllers.forEach(c => c.updateDisplay());
      gui.folders.forEach(f => f.controllers.forEach(c => c.updateDisplay()));

      renderInteractionFrame();
    }

    function toggleUI() {
      isUIHidden = !isUIHidden;
      document.getElementById('controls').classList.toggle('hidden', isUIHidden);
      if (gui) gui.domElement.style.display = isUIHidden ? 'none' : '';
      if (isUIHidden) {
        editor.hidden = true;
      } else {
        editor.hidden = btnToggleView.checked;
      }
    }

    function init() {
      source = document.querySelector("script[type='x-shader/x-fragment']");

      document.title = "Elevator Visual";

      renderer = new Renderer(canvas, settings.dpr);
      pointers = new PointerHandler(canvas, settings.dpr, randomizeScene, () => settings.clickToRandomize);
      editor   = new Editor(codeEditor, error, indicator);
      editor.text = source.textContent;
      renderer.setup();
      renderer.init();

      setupGUI();

      if (!editMode) {
        btnToggleView.checked = true;
        toggleView();
      }
      if (resolution === .5) {
        btnToggleResolution.checked = true;
        toggleResolution();
      }
      canvas.addEventListener('shader-error', e => editor.setError(e.detail));
      pointers.onchange = renderInteractionFrame;
      resize();

      if (renderer.test(source.textContent) === null) {
        renderer.updateShader(source.textContent);
      }
      elapsedTime = 0;
      accumulatedTime = 0;
      startTime = performance.now();
      renderThis();
      window.onresize = resize;

      window.addEventListener("keydown", e => {
        // Prevent hotkeys when user is editing shader text
        if (document.activeElement === editor.textarea) return;

        if (e.key === "h" || e.key === "H") {
          e.preventDefault();
          toggleUI();
        } else if (e.key === "L" && e.ctrlKey) {
          e.preventDefault();
          btnToggleView.checked = !btnToggleView.checked;
          toggleView();
        } else if (e.key === " " && editor.hidden) {
          e.preventDefault();
          btnPlayStop.checked = !btnPlayStop.checked;
          togglePlayStop();
        }
      });
    }

    class Renderer {
      #vertexSrc = "#version 300 es\nprecision highp float;\nin vec4 position;\nvoid main(){gl_Position=position;}";
      #fragmtSrc = "#version 300 es\nprecision highp float;\nout vec4 O;\nuniform float time;\nuniform vec2 resolution;\nvoid main() {\n\tvec2 uv=gl_FragCoord.xy/resolution;\n\tO=vec4(uv,sin(time)*.5+.5,1);\n}";
      #vertices = [-1, 1, -1, -1, 1, 1, 1, -1];
      constructor(canvas, scale) {
        this.canvas = canvas;
        this.scale = scale;
        this.gl = canvas.getContext("webgl2");
        this.gl.viewport(0, 0, canvas.width * scale, canvas.height * scale);
        this.shaderSource = this.#fragmtSrc;
        this.mouseMove = [0, 0];
        this.mouseCoords = [0, 0];
        this.pointerCoords = [0, 0];
        this.nbrOfPointers = 0;
        this.zoom = 1.0;
        this.wheel = [0, 0];
        this.startRandom = Math.random();
      }
      get defaultSource() { return this.#fragmtSrc; }
      updateShader(source) {
        this.reset();
        this.shaderSource = source;
        this.setup();
        this.init();
      }
      updateMove(deltas) {
        this.mouseMove = deltas;
      }
      updateZoom(zoom) {
        this.zoom = zoom;
      }
      updateWheel(wheel) {
        this.wheel = wheel;
      }
      updateMouse(coords) {
        this.mouseCoords = coords;
      }
      updatePointerCoords(coords) {
        this.pointerCoords = coords;
      }
      updatePointerCount(nbr) {
        this.nbrOfPointers = nbr;
      }
      updateScale(scale) {
        this.scale = scale;
        this.gl.viewport(0, 0, this.canvas.width * scale, this.canvas.height * scale);
      }
      compile(shader, source) {
        const gl = this.gl;
        gl.shaderSource(shader, source);
        gl.compileShader(shader);

        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
          console.error(gl.getShaderInfoLog(shader));
          this.canvas.dispatchEvent(new CustomEvent('shader-error', { detail: gl.getShaderInfoLog(shader) }));
        }
      }
      test(source) {
        let result = null;
        const gl = this.gl;
        const shader = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);

        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
          result = gl.getShaderInfoLog(shader);
        }
        if (!gl.getShaderParameter(shader, gl.DELETE_STATUS)) {
          gl.deleteShader(shader);
        }
        return result;
      }
      reset() {
        const { gl, program, vs, fs } = this;
        if (!program || gl.getProgramParameter(program, gl.DELETE_STATUS)) return;
        if (!gl.getShaderParameter(vs, gl.DELETE_STATUS)) {
          gl.detachShader(program, vs);
          gl.deleteShader(vs);
        }
        if (!gl.getShaderParameter(fs, gl.DELETE_STATUS)) {
          gl.detachShader(program, fs);
          gl.deleteShader(fs);
        }
        gl.deleteProgram(program);
      }
      setup() {
        const gl = this.gl;
        this.vs = gl.createShader(gl.VERTEX_SHADER);
        this.fs = gl.createShader(gl.FRAGMENT_SHADER);
        this.compile(this.vs, this.#vertexSrc);
        this.compile(this.fs, this.shaderSource);
        this.program = gl.createProgram();
        gl.attachShader(this.program, this.vs);
        gl.attachShader(this.program, this.fs);
        gl.linkProgram(this.program);

        if (!gl.getProgramParameter(this.program, gl.LINK_STATUS)) {
          console.error(gl.getProgramInfoLog(this.program));
        }
      }
      init() {
        const { gl, program } = this;
        this.buffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, this.buffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(this.#vertices), gl.STATIC_DRAW);

        const position = gl.getAttribLocation(program, "position");

        gl.enableVertexAttribArray(position);
        gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);

        program.resolution = gl.getUniformLocation(program, "resolution");
        program.time = gl.getUniformLocation(program, "time");
        program.daytime = gl.getUniformLocation(program, "daytime");
        program.move = gl.getUniformLocation(program, "move");
        program.touch = gl.getUniformLocation(program, "touch");
        program.pointerCount = gl.getUniformLocation(program, "pointerCount");
        program.pointers = gl.getUniformLocation(program, "pointers");
        program.zoom = gl.getUniformLocation(program, "zoom");
        program.wheel = gl.getUniformLocation(program, "wheel"); 
        program.startRandom = gl.getUniformLocation(program, "startRandom");

        program.u_greenscreen = gl.getUniformLocation(program, "u_greenscreen");
        program.u_bgColor = gl.getUniformLocation(program, "u_bgColor");
        program.u_color1 = gl.getUniformLocation(program, "u_color1");
        program.u_color2 = gl.getUniformLocation(program, "u_color2");
        program.u_specularColor = gl.getUniformLocation(program, "u_specularColor");
        program.u_scale = gl.getUniformLocation(program, "u_scale");
        program.u_distortion = gl.getUniformLocation(program, "u_distortion");
        program.u_animMode = gl.getUniformLocation(program, "u_animMode");
      }
      render(now = 0) {
        const { gl, program, buffer, canvas, mouseMove, mouseCoords, pointerCoords, nbrOfPointers, zoom, wheel, startRandom } = this;
        const daytime = new Date();
        if (!program || gl.getProgramParameter(program, gl.DELETE_STATUS)) return;

        gl.clearColor(0, 0, 0, 1);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.useProgram(program);
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.uniform2f(program.resolution, canvas.width, canvas.height);
        gl.uniform1f(program.time, now);
        gl.uniform4f(program.daytime, daytime.getHours(), daytime.getMinutes(), daytime.getSeconds(), daytime.getMilliseconds());
        gl.uniform2f(program.move, ...mouseMove);
        gl.uniform2f(program.touch, ...mouseCoords);
        gl.uniform1i(program.pointerCount, nbrOfPointers);
        gl.uniform2fv(program.pointers, pointerCoords);
        gl.uniform1f(program.zoom, zoom);
        gl.uniform2f(program.wheel, ...wheel);
        gl.uniform1f(program.startRandom, startRandom);

        // Custom Settings Uniforms
        gl.uniform1i(program.u_greenscreen, settings.greenscreen ? 1 : 0);
        gl.uniform3fv(program.u_bgColor, hexToRgb(settings.bgColor));
        gl.uniform3fv(program.u_color1, hexToRgb(settings.color1));
        gl.uniform3fv(program.u_color2, hexToRgb(settings.color2));
        gl.uniform3fv(program.u_specularColor, hexToRgb(settings.specularColor));
        gl.uniform1f(program.u_scale, settings.scale);
        gl.uniform1f(program.u_distortion, settings.distortion);
        gl.uniform1i(program.u_animMode, ANIMATION_PRESETS[settings.animationPreset] ?? 0);

        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      }
      clear() {
        const { gl } = this;
        gl.clear(gl.COLOR_BUFFER_BIT);
      }
    }

    class PointerHandler {
      constructor(element, scale, onClickCallback, getClickRandomizeState) {
        this.scale = scale;
        this.active = false;
        this.onchange = null;
        this.pointers = new Map();
        this.lastCoords = [0, 0];
        this.moves = [0, 0];
        this.zoom = 1.0;
        this.wheelDelta = 0;
        this.wheelOffset = 0;
        this.ex = 0;
        this.ey = 0;
        
        let startX = 0;
        let startY = 0;

        const emit = () => {
          if (typeof this.onchange === 'function') {
            this.onchange();
          }
        };

        const map = (element, scale, x, y) => [x * scale, element.height - y * scale];

        element.addEventListener("pointerdown", (e) => {
          this.active = true;
          startX = e.clientX;
          startY = e.clientY;
          this.pointers.set(e.pointerId, map(element, this.getScale(), e.clientX, e.clientY));
          this.ex = e.clientX;
          this.ey = e.clientY;
          emit();
        });

        element.addEventListener("pointerup", (e) => {
          const dist = Math.hypot(e.clientX - startX, e.clientY - startY);
          if (dist < 6 && typeof onClickCallback === 'function' && getClickRandomizeState()) {
            onClickCallback();
          }
          if (this.count === 1) {
            this.lastCoords = this.first;
          }
          this.pointers.delete(e.pointerId);
          this.active = this.pointers.size > 0;
          emit();
        });

        element.addEventListener("pointerleave", (e) => {
          if (this.count === 1) {
            this.lastCoords = this.first;
          }
          this.pointers.delete(e.pointerId);
          this.active = this.pointers.size > 0;
          emit();
        });

        element.addEventListener("pointermove", (e) => {
          if (!this.active) return;
          const mapped = map(element, this.getScale(), e.clientX, e.clientY);
          this.lastCoords = mapped;
          this.pointers.set(e.pointerId, mapped);
          this.moves = [this.moves[0] + (e.clientX - this.ex) * this.scale * 2.0, this.moves[1] + (this.ey - e.clientY) * this.scale * 2.0];
          this.ex = e.clientX;
          this.ey = e.clientY;
          emit();
        });

        element.addEventListener("wheel", (e) => {
          e.preventDefault();
          const zoomFactor = Math.pow(1.0015, e.deltaY);
          this.zoom = Math.max(0.1, Math.min(10.0, this.zoom * zoomFactor));

          if (this.wheelDelta * e.deltaY < 0) {
            this.wheelDelta = e.deltaY;
          } else {
            this.wheelDelta = lerp(this.wheelDelta, e.deltaY, .05);
          }
          this.wheelOffset += this.wheelDelta;
          emit();
        }, { passive: false });
      }

      getScale() {
        return this.scale;
      }
      updateScale(scale) { this.scale = scale; }
      reset() {
        this.pointers.clear();
        this.active = false;
        this.lastCoords = [0, 0];
        this.moves = [0, 0];
        this.zoom = 1.0;
        this.wheelDelta = 0;
        this.wheelOffset = 0;
      }
      get count() {
        return this.pointers.size;
      }
      get move() {
        return this.moves;
      }
      get zoomed() {
        return this.zoom;
      }
      get wheel() {
        return [this.wheelDelta, this.wheelOffset] || [0, 0];
      }
      get coords() {
        return this.pointers.size > 0 ? Array.from(this.pointers.values()).map((p) => [...p]).flat() : [0, 0];
      }
      get first() {
        return this.pointers.values().next().value || this.lastCoords;
      }
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    class Editor {
      constructor(textarea, errorfield, errorindicator) {
        this.textarea = textarea;
        this.errorfield = errorfield;
        this.errorindicator = errorindicator;
        textarea.addEventListener('keydown', this.handleKeydown.bind(this));
        textarea.addEventListener('scroll', this.handleScroll.bind(this));
      }
      get hidden() { return this.textarea.classList.contains('hidden'); }
      set hidden(value) { value ? this.#hide() : this.#show(); }
      get text() { return this.textarea.value; }
      set text(value) { this.textarea.value = value; }
      get scrollTop() { return this.textarea.scrollTop; }
      set scrollTop(value) { this.textarea.scrollTop = value; }
      setError(message) {
        this.errorfield.innerHTML = message;
        this.errorfield.classList.add('opaque');
        const match = message.match(/ERROR: \d+:(\d+):/);
        const lineNumber = match ? parseInt(match[1]) : 0;
        const overlay = document.createElement('pre');

        overlay.classList.add('overlay');
        overlay.textContent = '\n'.repeat(lineNumber);

        document.body.appendChild(overlay);

        const offsetTop = parseInt(getComputedStyle(overlay).height);

        this.errorindicator.style.setProperty('--top', offsetTop + 'px');
        this.errorindicator.style.visibility = 'visible';

        document.body.removeChild(overlay);
      }
      clearError() {
        this.errorfield.textContent = '';
        this.errorfield.classList.remove('opaque');
        this.errorfield.blur();
        this.errorindicator.style.visibility = 'hidden';
      }
      focus() {
        this.textarea.focus();
      }
      #hide() {
        for (const el of [this.errorindicator, this.errorfield, this.textarea]) {
          el.classList.add('hidden');
        }
      }
      #show() {
        for (const el of [this.errorindicator, this.errorfield, this.textarea]) {
          el.classList.remove('hidden');
        }
        this.focus();
      }
      handleScroll() {
        this.errorindicator.style.setProperty('--scroll-top', `${this.textarea.scrollTop}px`);
      }
      handleKeydown(event) {
        if (event.key === "Tab") {
          event.preventDefault();
          this.handleTabKey(event.shiftKey);
        } else if (event.key === "Enter") {
          event.preventDefault();
          this.handleEnterKey();
        }
      }
      handleTabKey(shiftPressed) {
        if (this.#getSelectedText() !== "") {
          if (shiftPressed) {
            this.#unindentSelectedText();
            return;
          }
          this.#indentSelectedText();
        } else {
          this.#indentAtCursor();
        }
      }
      #getSelectedText() {
        const editor = this.textarea;
        const start = editor.selectionStart;
        const end = editor.selectionEnd;
        return editor.value.substring(start, end);
      }
      #indentAtCursor() {
        const editor = this.textarea;
        const cursorPos = editor.selectionStart;

        document.execCommand('insertText', false, '\t');
        editor.selectionStart = editor.selectionEnd = cursorPos + 1;
      }
      #indentSelectedText() {
        const editor = this.textarea;
        const cursorPos = editor.selectionStart;
        const selectedText = this.#getSelectedText();
        const lines = selectedText.split('\n');
        const indentedText = lines.map(line => '\t' + line).join('\n');

        document.execCommand('insertText', false, indentedText);
        editor.selectionStart = cursorPos;
      }
      #unindentSelectedText() {
        const editor = this.textarea;
        const cursorPos = editor.selectionStart;
        const selectedText = this.#getSelectedText();
        const lines = selectedText.split('\n');
        const indentedText = lines.map(line => line.replace(/^\t/, '').replace(/^ /, '')).join('\n');

        document.execCommand('insertText', false, indentedText);
        editor.selectionStart = cursorPos;
      }
      handleEnterKey() {
        const editor = this.textarea;
        const visibleTop = editor.scrollTop;
        const cursorPosition = editor.selectionStart;

        let start = cursorPosition - 1;
        while (start >= 0 && editor.value[start] !== '\n') {
          start--;
        }

        let newLine = '';
        while (start < cursorPosition - 1 && (editor.value[start + 1] === ' ' || editor.value[start + 1] === '\t')) {
          newLine += editor.value[start + 1];
          start++;
        }

        document.execCommand('insertText', false, '\n' + newLine);
        editor.selectionStart = editor.selectionEnd = cursorPosition + 1 + newLine.length;
        editor.scrollTop = visibleTop;
        const lineHeight = editor.scrollHeight / editor.value.split('\n').length;
        const line = editor.value.substring(0, cursorPosition).split('\n').length;

        const visibleBottom = editor.scrollTop + editor.clientHeight;
        const lineTop = lineHeight * (line - 1);
        const lineBottom = lineHeight * (line + 2);

        if (lineTop < visibleTop) editor.scrollTop = lineTop;
        if (lineBottom > visibleBottom) editor.scrollTop = lineBottom - editor.clientHeight;
      }
    }
  </script>
