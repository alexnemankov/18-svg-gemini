  <script type="module">
    import * as THREE from 'three';
    import GUI from 'lil-gui';

    // =========================================================================================
    // POST PROCESSOR SUITE (Inlined from postprocessing/PostProcessor.js for file:// execution)
    // =========================================================================================
    const orthoVertexShader = `
    precision highp float;
    in vec3 position;
    out vec2 vUv;
    void main() {
      vUv = position.xy * 0.5 + 0.5;
      gl_Position = vec4(position, 1.0);
    }
    `;

    const brightFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float bloomThreshold;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float luminance = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float knee = 0.1;
      float soft = luminance - bloomThreshold + knee;
      soft = clamp(soft, 0.0, 2.0 * knee);
      soft = (soft * soft) / (4.0 * knee + 0.00001);
      float contribution = max(soft, luminance - bloomThreshold);
      contribution /= max(luminance, 0.00001);
      fragColor = vec4(color.rgb * contribution, color.a);
    }
    `;

    const blur13ShaderChunk = `
    vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
      vec2 resolution = vec2(textureSize(image, 0));
      vec4 color = vec4(0.0);
      vec2 off1 = vec2(1.411764705882353) * direction;
      vec2 off2 = vec2(3.2941176470588234) * direction;
      vec2 off3 = vec2(5.176470588235294) * direction;
      color += texture(image, uv) * 0.1964825501511404;
      color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
      color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
      return color;
    }
    `;

    const blurFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 direction;
    in vec2 vUv;
    out vec4 color;
    ${blur13ShaderChunk}
    void main() {
      color = blur13(inputTexture, vUv, direction);
    }
    `;

    const finalFragmentShader = `
    precision highp float;
    uniform vec2 resolution;
    uniform sampler2D inputTexture;
    uniform sampler2D blur0Texture;
    uniform sampler2D blur1Texture;
    uniform sampler2D blur2Texture;
    uniform sampler2D blur3Texture;
    uniform sampler2D blur4Texture;
    uniform bool bloomEnabled;
    uniform float bloomStrength;
    uniform float vignetteBoost;
    uniform float vignetteReduction;
    uniform float noiseIntensity;
    uniform float time;
    in vec2 vUv;
    out vec4 fragColor;

    float vignette(vec2 uv, float boost, float reduction) {
      vec2 position = vUv - 0.5;
      return boost - length(position) * reduction;
    }

    float hash1(uint n) {
      n = (n << 13U) ^ n;
      n = n * (n * n * 15731U + 789221U) + 1376312589U;
      return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
    }

    float noise(in vec2 uv, in float timeVal) {
      uvec2 p = uvec2(uv);
      return hash1(p.x + 1920U * p.y + (1920U * 1080U) * uint(timeVal));
    }

    void main() {
      vec4 color = texture(inputTexture, vUv);

      if (bloomEnabled && bloomStrength > 0.001) {
        vec4 b0 = texture(blur0Texture, vUv);
        vec4 b1 = texture(blur1Texture, vUv);
        vec4 b2 = texture(blur2Texture, vUv);
        vec4 b3 = texture(blur3Texture, vUv);
        vec4 b4 = texture(blur4Texture, vUv);

        vec4 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
        color += bloomSum * bloomStrength;
      }

      color.rgb *= vignette(vUv, vignetteBoost, vignetteReduction);
      color.rgb += noiseIntensity * noise(gl_FragCoord.xy, time);
      fragColor = vec4(color.rgb, 1.0);
    }
    `;

    const chromaticAberrationShaderChunk = `
    vec2 barrelDistortion(vec2 coord, float amt) {
      vec2 cc = coord - 0.5;
      float dist = dot(cc, cc);
      return coord + cc * dist * amt;
    }
    float sat(float t) { return clamp(t, 0.0, 1.0); }
    float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
    float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
    vec4 spectrum_offset(float t) {
      float lo = step(t, 0.5);
      float hi = 1.0 - lo;
      float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
      vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
      return pow(ret, vec4(1.0 / 2.2));
    }
    const float max_distort = 2.2;
    const int num_iter = 8;
    const float reci_num_iter_f = 1.0 / float(num_iter);
    vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
      vec4 sumcol = vec4(0.0);
      vec4 sumw = vec4(0.0);
      for (int i = 0; i < num_iter; ++i) {
        float t = float(i) * reci_num_iter_f;
        vec4 w = spectrum_offset(t);
        sumw += w;
        sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
      }
      return sumcol / sumw;
    }
    `;

    const colorFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float chromaticAberrationAmount;
    uniform float minInputLevel;
    uniform float maxInputLevel;
    uniform float gammaLevel;
    uniform float fisheyeStrength;
    uniform float fisheyeRadius;
    uniform float time;
    in vec2 vUv;
    out vec4 fragColor;

    ${chromaticAberrationShaderChunk}

    vec2 applyFisheye(vec2 uv, float strength, float radius) {
      if (abs(strength) < 0.0001) return uv;
      vec2 p = uv - 0.5;
      float d = length(p);
      if (d > radius * 1.5) return uv;
      float r = d / max(radius, 0.001);
      float theta = atan(p.y, p.x);
      float rDist = r + strength * (r * r * r);
      return 0.5 + vec2(cos(theta), sin(theta)) * (rDist * radius);
    }

    vec3 gammaCorrect(vec3 color, vec3 gamma) {
      return pow(max(color, vec3(0.0)), 1.0 / gamma);
    }
    vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
      return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
    }
    vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
      return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
    }
    void main() {
      vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
      fragColor = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
      fragColor.rgb = finalLevels(fragColor.rgb, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
      fragColor.a = 1.0;
    }
    `;

    const copyFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      fragColor = texture(inputTexture, vUv);
    }
    `;

    function createFBO(w, h, options = {}) {
      return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
        wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
        wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
        minFilter: options.minFilter || THREE.LinearFilter,
        magFilter: options.magFilter || THREE.LinearFilter,
        format: options.format || THREE.RGBAFormat,
        type: options.type || THREE.HalfFloatType,
        stencilBuffer: options.stencilBuffer || false,
        depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : true,
        samples: options.samples || 0,
      });
    }

    class ShaderPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbo = createFBO(1, 1, options);
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
        this.texture = this.fbo.texture;
      }
      render(renderer, toScreen = false) {
        if (!toScreen) {
          renderer.setRenderTarget(this.fbo);
        }
        renderer.render(this.orthoScene, this.orthoCamera);
        if (!toScreen) {
          renderer.setRenderTarget(null);
        }
      }
      setSize(width, height) {
        this.fbo.setSize(Math.max(1, width), Math.max(1, height));
        this.orthoQuad.scale.set(width, height, 1);
      }
    }

    class ShaderPingPongPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
        this.currentFBO = 0;
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
      }
      render(renderer) {
        renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
        renderer.render(this.orthoScene, this.orthoCamera);
        renderer.setRenderTarget(null);
        this.currentFBO = 1 - this.currentFBO;
      }
      get current() { return this.fbos[this.currentFBO]; }
      get texture() { return this.current.texture; }
      setSize(width, height) {
        const w = Math.max(1, width);
        const h = Math.max(1, height);
        this.orthoQuad.scale.set(w, h, 1);
        this.fbos[0].setSize(w, h);
        this.fbos[1].setSize(w, h);
      }
    }

    class BloomPass {
      constructor(strength = 0.8, radius = 0.5, threshold = 0.2, levels = 5) {
        this.strength = strength;
        this.radius = radius;
        this.threshold = threshold;
        this.enabled = true;
        this.levels = levels;

        this.brightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            bloomThreshold: { value: this.threshold },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: brightFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.brightPass = new ShaderPass(this.brightShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.blurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            direction: { value: new THREE.Vector2(0, 1) },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: blurFragmentShader,
          glslVersion: THREE.GLSL3,
        });

        this.blurPasses = [];
        for (let i = 0; i < this.levels; i++) {
          this.blurPasses.push(new ShaderPingPongPass(this.blurShader, {
            format: THREE.RGBAFormat,
            type: THREE.HalfFloatType,
          }));
        }
      }

      setSize(w, h) {
        let tw = Math.max(1, w);
        let th = Math.max(1, h);
        this.brightPass.setSize(tw, th);
        for (let i = 0; i < this.levels; i++) {
          tw = Math.max(1, Math.round(tw / 2));
          th = Math.max(1, Math.round(th / 2));
          this.blurPasses[i].setSize(tw, th);
        }
      }

      set source(texture) {
        this.brightShader.uniforms.inputTexture.value = texture;
      }

      render(renderer) {
        if (!this.enabled || this.strength <= 0.001) return;

        this.brightShader.uniforms.bloomThreshold.value = this.threshold;
        this.brightPass.render(renderer);

        const baseOffset = Math.max(0.1, this.radius * 2.0);
        const u = this.blurShader.uniforms;

        for (let j = 0; j < this.levels; j++) {
          const blurPass = this.blurPasses[j];
          const stepOffset = baseOffset * (1.0 + j * 0.5);

          u.direction.value.set(stepOffset, 0);
          u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
          blurPass.render(renderer);

          u.direction.value.set(0, stepOffset * 0.5);
          u.inputTexture.value = blurPass.current.texture;
          blurPass.render(renderer);
        }
      }
    }

    class PostProcessor {
      constructor(renderer, params = {}) {
        this.renderer = renderer;

        this.settings = {
          enabled: params.enabled !== undefined ? params.enabled : true,
          bloomEnabled: params.bloomEnabled !== undefined ? params.bloomEnabled : true,
          bloomStrength: params.bloomStrength !== undefined ? params.bloomStrength : 0.6,
          bloomRadius: params.bloomRadius !== undefined ? params.bloomRadius : 0.4,
          bloomThreshold: params.bloomThreshold !== undefined ? params.bloomThreshold : 0.2,

          fisheyeStrength: params.fisheyeStrength !== undefined ? params.fisheyeStrength : 0.0,
          fisheyeRadius: params.fisheyeRadius !== undefined ? params.fisheyeRadius : 1.0,
          chromaticAberration: params.chromaticAberration !== undefined ? params.chromaticAberration : 0.02,
          vignetteBoost: params.vignetteBoost !== undefined ? params.vignetteBoost : 1.0,
          vignetteReduction: params.vignetteReduction !== undefined ? params.vignetteReduction : 0.35,
          noiseIntensity: params.noiseIntensity !== undefined ? params.noiseIntensity : 0.015,

          gamma: params.gamma !== undefined ? params.gamma : 1.0,
          minInputLevel: params.minInputLevel !== undefined ? params.minInputLevel : 0.0,
          maxInputLevel: params.maxInputLevel !== undefined ? params.maxInputLevel : 1.0,
        };

        this.sceneTarget = createFBO(1, 1, { type: THREE.HalfFloatType });

        this.bloomPass = new BloomPass(
          this.settings.bloomStrength,
          this.settings.bloomRadius,
          this.settings.bloomThreshold,
          5
        );

        this.finalShader = new THREE.RawShaderMaterial({
          uniforms: {
            resolution: { value: new THREE.Vector2(1, 1) },
            bloomEnabled: { value: this.settings.bloomEnabled },
            bloomStrength: { value: this.settings.bloomStrength },
            vignetteBoost: { value: this.settings.vignetteBoost },
            vignetteReduction: { value: this.settings.vignetteReduction },
            noiseIntensity: { value: this.settings.noiseIntensity },
            inputTexture: { value: null },
            blur0Texture: { value: null },
            blur1Texture: { value: null },
            blur2Texture: { value: null },
            blur3Texture: { value: null },
            blur4Texture: { value: null },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: finalFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.finalPass = new ShaderPass(this.finalShader);

        this.rgbShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: this.finalPass.texture },
            fisheyeStrength: { value: this.settings.fisheyeStrength },
            fisheyeRadius: { value: this.settings.fisheyeRadius },
            chromaticAberrationAmount: { value: this.settings.chromaticAberration },
            minInputLevel: { value: this.settings.minInputLevel },
            maxInputLevel: { value: this.settings.maxInputLevel },
            gammaLevel: { value: this.settings.gamma },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: colorFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.rgbPass = new ShaderPass(this.rgbShader);

        this.copyPass = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: copyFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.copyPass = new ShaderPass(this.copyPass);
      }

      updateSettings() {
        this.bloomPass.enabled = this.settings.bloomEnabled;
        this.bloomPass.strength = this.settings.bloomStrength;
        this.bloomPass.radius = this.settings.bloomRadius;
        this.bloomPass.threshold = this.settings.bloomThreshold;

        this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
        this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
        this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
        this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
        this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;

        this.rgbShader.uniforms.fisheyeStrength.value = this.settings.fisheyeStrength;
        this.rgbShader.uniforms.fisheyeRadius.value = this.settings.fisheyeRadius;
        this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
        this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
        this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
        this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
      }

      setSize(w0, h0, dpr = 1) {
        const w = Math.max(1, Math.floor(w0 * dpr));
        const h = Math.max(1, Math.floor(h0 * dpr));
        this.sceneTarget.setSize(w, h);
        this.finalPass.setSize(w, h);
        this.finalShader.uniforms.resolution.value.set(w, h);
        this.bloomPass.setSize(w, h);
        this.rgbPass.setSize(w, h);
        this.copyPass.setSize(w, h);
      }

      renderScene(scene, camera) {
        if (!this.settings.enabled) {
          this.renderer.render(scene, camera);
          return;
        }
        this.renderer.setRenderTarget(this.sceneTarget);
        this.renderer.render(scene, camera);
        this.renderer.setRenderTarget(null);
        this.render(this.sceneTarget.texture);
      }

      render(sourceTexture) {
        if (!this.settings.enabled) {
          this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
          this.copyPass.render(this.renderer, true);
          return;
        }

        this.updateSettings();

        this.bloomPass.source = sourceTexture;
        this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
        this.bloomPass.render(this.renderer);

        this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
        this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
        this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
        this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
        this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

        const randomTime = Math.random() * 100000;
        this.finalPass.shader.uniforms.time.value = randomTime;
        this.rgbPass.shader.uniforms.time.value = randomTime;

        this.finalPass.render(this.renderer);
        this.rgbPass.render(this.renderer, true);
      }

      attachGUI(gui, title = "Post-Processing Suite") {
        const root = gui.addFolder(title);
        root.add(this.settings, "enabled").name("Enable Suite");

        const bloom = root.addFolder("Bloom");
        bloom.add(this.settings, "bloomEnabled").name("Enable Bloom").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomStrength", 0, 3.0, 0.05).name("Strength").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomRadius", 0, 2.0, 0.05).name("Radius").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomThreshold", 0, 1.0, 0.01).name("Threshold").onChange(() => this.updateSettings());

        const lens = root.addFolder("Lens, Optics & Fisheye");
        lens.add(this.settings, "fisheyeStrength", -1.0, 1.5, 0.01).name("Fisheye Distortion").onChange(() => this.updateSettings());
        lens.add(this.settings, "fisheyeRadius", 0.2, 2.0, 0.05).name("Fisheye Radius").onChange(() => this.updateSettings());
        lens.add(this.settings, "chromaticAberration", 0, 0.2, 0.005).name("Chromatic Aberration").onChange(() => this.updateSettings());
        lens.add(this.settings, "vignetteBoost", 0, 2.0, 0.05).name("Vignette Boost").onChange(() => this.updateSettings());
        lens.add(this.settings, "vignetteReduction", 0, 2.0, 0.05).name("Vignette Falloff").onChange(() => this.updateSettings());
        lens.add(this.settings, "noiseIntensity", 0, 0.1, 0.005).name("Film Grain").onChange(() => this.updateSettings());
        lens.add(this.settings, "gamma", 0.2, 2.0, 0.05).name("Gamma").onChange(() => this.updateSettings());
        lens.add(this.settings, "minInputLevel", 0, 0.5, 0.01).name("Black Level").onChange(() => this.updateSettings());
        lens.add(this.settings, "maxInputLevel", 0.5, 1.0, 0.01).name("White Level").onChange(() => this.updateSettings());

        return root;
      }
    }

    /* ---- COLOR PRESETS ---- */
    const colorSchemes = {
      'Original (Deep Cosmic)': {
        bg: '#031927',
        c1: '#ffffff',
        c2: '#aaaaaa',
        alpha: 0.05
      },
      'Black & White': {
        bg: '#000000',
        c1: '#ffffff',
        c2: '#cccccc',
        alpha: 0.05
      },
      'White & Black': {
        bg: '#ffffff',
        c1: '#0a0a0a',
        c2: '#333333',
        alpha: 0.05
      },
      'Cyber Neon': {
        bg: '#0c0714',
        c1: '#00ffff',
        c2: '#ff007f',
        alpha: 0.045
      },
      'Solar Amber': {
        bg: '#140800',
        c1: '#ffb703',
        c2: '#fb5607',
        alpha: 0.045
      }
    };

    /* ---- SETTINGS ---- */
    const settings = {
      colorScheme: 'Original (Deep Cosmic)',
      greenscreen: false,
      bgColor: '#031927',
      particleColor: '#ffffff',
      particleColor2: '#aaaaaa',
      particleAlpha: 0.05,
      particleSize: 1.0,

      particleCount: 1000,
      particleSpeed: 0.3,
      velocityDamping: 0.9,
      forceJitter: 1.0,
      spawnShape: 'Ring',
      spawnRadius: 50,

      animationPreset: 'Static',
      animSpeed: 1.0,

      dpr: Math.min(window.devicePixelRatio || 1, 2),
      zoom: 1.0,
      panX: 0,
      panY: 0,

      clickToRandomize: true
    };

    /* ---- WEBGL & OFFSCREEN CANVAS SETUP ---- */
    const webglCanvas = document.getElementById('webgl-canvas');
    const renderer = new THREE.WebGLRenderer({
      canvas: webglCanvas,
      antialias: false,
      powerPreference: 'high-performance'
    });

    const postProcessor = new PostProcessor(renderer, {
      enabled: true,
      bloomStrength: 0.65,
      bloomRadius: 0.45,
      bloomThreshold: 0.22,
      chromaticAberration: 0.02,
      vignetteBoost: 1.0,
      vignetteReduction: 0.35,
      noiseIntensity: 0.015
    });

    // Intermediate 2D canvas rendered to WebGL texture
    const intermediateCanvas = document.createElement('canvas');
    const intermediateCtx = intermediateCanvas.getContext('2d');
    const canvasTexture = new THREE.CanvasTexture(intermediateCanvas);
    canvasTexture.minFilter = THREE.LinearFilter;
    canvasTexture.magFilter = THREE.LinearFilter;
    canvasTexture.generateMipmaps = false;

    // Persistent simulation canvas for generative trail accumulation
    const simCanvas = document.createElement('canvas');
    const simContext = simCanvas.getContext('2d');

    const simWidth = 2000;
    const simHeight = 2000;
    simCanvas.width = simWidth;
    simCanvas.height = simHeight;

    let particles = [];
    const getRandomFloat = (min, max) => (Math.random() * (max - min) + min);

    function hexToRgb(hex) {
      let c = hex.replace('#', '');
      if (c.length === 3) {
        c = c.split('').map(x => x + x).join('');
      }
      const num = parseInt(c, 16);
      return {
        r: (num >> 16) & 255,
        g: (num >> 8) & 255,
        b: num & 255
      };
    }

    function getParticleRgba(hex1, hex2, ratio, alpha) {
      const c1 = hexToRgb(hex1);
      const c2 = hexToRgb(hex2);
      const r = Math.round(c1.r + (c2.r - c1.r) * ratio);
      const g = Math.round(c1.g + (c2.g - c1.g) * ratio);
      const b = Math.round(c1.b + (c2.b - c1.b) * ratio);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    /* ---- PARTICLE CLASS ---- */
    function Particle(x, y, colorRatio) {
      this.x = x;
      this.y = y;
      this.colorRatio = colorRatio !== undefined ? colorRatio : Math.random();

      this.vel = {
        x: getRandomFloat(-20, 20) / 100,
        y: getRandomFloat(-20, 20) / 100,
        min: getRandomFloat(2, 10),
        max: getRandomFloat(10, 100) / 10
      };
    }

    Particle.prototype.render = function(ctx) {
      ctx.beginPath();
      ctx.fillStyle = getParticleRgba(settings.particleColor, settings.particleColor2, this.colorRatio, settings.particleAlpha);
      ctx.arc(this.x, this.y, settings.particleSize, 0, Math.PI * 2);
      ctx.fill();
    };

    Particle.prototype.update = function(speedMultiplier) {
      const forceDirection = {
        x: getRandomFloat(-1, 1) * settings.forceJitter,
        y: getRandomFloat(-1, 1) * settings.forceJitter
      };

      if (Math.abs(this.vel.x + forceDirection.x) < this.vel.max) {
        this.vel.x += forceDirection.x;
      }
      if (Math.abs(this.vel.y + forceDirection.y) < this.vel.max) {
        this.vel.y += forceDirection.y;
      }

      this.x += this.vel.x * settings.particleSpeed * speedMultiplier;
      this.y += this.vel.y * settings.particleSpeed * speedMultiplier;

      if (Math.abs(this.vel.x) > this.vel.min) {
        this.vel.x *= settings.velocityDamping;
      }
      if (Math.abs(this.vel.y) > this.vel.min) {
        this.vel.y *= settings.velocityDamping;
      }

      this.testBorder();
    };

    Particle.prototype.testBorder = function() {
      if (this.x > simWidth) {
        this.x = 0;
      } else if (this.x < 0) {
        this.x = simWidth;
      }
      if (this.y > simHeight) {
        this.y = 0;
      } else if (this.y < 0) {
        this.y = simHeight;
      }
    };

    /* ---- SIMULATION MANAGEMENT ---- */
    function resetSimulation() {
      simContext.clearRect(0, 0, simWidth, simHeight);
      particles = [];

      const cx = simWidth * 0.5;
      const cy = simHeight * 0.5;
      const count = settings.particleCount;
      const radius = settings.spawnRadius;

      for (let i = 0; i < count; i++) {
        let px = cx;
        let py = cy;
        const colorRatio = i / count;

        switch (settings.spawnShape) {
          case 'Ring': {
            const angle = Math.random() * Math.PI * 2;
            px = cx + Math.cos(angle) * radius;
            py = cy + Math.sin(angle) * radius;
            break;
          }
          case 'Circle': {
            const angle = Math.random() * Math.PI * 2;
            const r = Math.sqrt(Math.random()) * radius;
            px = cx + Math.cos(angle) * r;
            py = cy + Math.sin(angle) * r;
            break;
          }
          case 'Points': {
            const seed = (Math.floor(Math.random() * 5) / 5) * Math.PI * 2;
            const subR = Math.random() * 15;
            px = cx + Math.cos(seed) * radius + Math.cos(Math.random() * Math.PI * 2) * subR;
            py = cy + Math.sin(seed) * radius + Math.sin(Math.random() * Math.PI * 2) * subR;
            break;
          }
          case 'Spiral': {
            const theta = Math.random() * Math.PI * 6;
            const r = (theta / (Math.PI * 6)) * radius;
            px = cx + Math.cos(theta) * r;
            py = cy + Math.sin(theta) * r;
            break;
          }
          case 'Cross': {
            const axis = Math.random() > 0.5;
            const offset = (Math.random() - 0.5) * radius * 2;
            px = cx + (axis ? offset : (Math.random() - 0.5) * 8);
            py = cy + (!axis ? offset : (Math.random() - 0.5) * 8);
            break;
          }
          case 'Center':
          default: {
            const r = Math.random() * 10;
            const angle = Math.random() * Math.PI * 2;
            px = cx + Math.cos(angle) * r;
            py = cy + Math.sin(angle) * r;
            break;
          }
        }

        particles.push(new Particle(px, py, colorRatio));
      }
    }

    function applyDPR() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const dpr = settings.dpr;

      intermediateCanvas.width = Math.round(w * dpr);
      intermediateCanvas.height = Math.round(h * dpr);

      renderer.setPixelRatio(1);
      renderer.setSize(w, h, false);
      postProcessor.setSize(w, h, dpr);
    }

    function resetView() {
      settings.zoom = 1.0;
      settings.panX = 0;
      settings.panY = 0;
      updateGuiDisplay();
    }

    function applyColorScheme(schemeName) {
      if (colorSchemes[schemeName]) {
        const s = colorSchemes[schemeName];
        settings.bgColor = s.bg;
        settings.particleColor = s.c1;
        settings.particleColor2 = s.c2;
        settings.particleAlpha = s.alpha;
        updateGuiDisplay();
      }
    }

    /* ---- PROCEDURAL RANDOM VARIATION ---- */
    function randomizeThemeAndParams() {
      const proceduralThemes = [
        { name: 'Original (Deep Cosmic)', bg: '#031927', c1: '#ffffff', c2: '#aaaaaa', alpha: 0.05 },
        { name: 'Black & White', bg: '#000000', c1: '#ffffff', c2: '#cccccc', alpha: 0.05 },
        { name: 'White & Black', bg: '#ffffff', c1: '#0a0a0a', c2: '#333333', alpha: 0.05 },
        { name: 'Cyber Neon', bg: '#0c0714', c1: '#00ffff', c2: '#ff007f', alpha: 0.045 },
        { name: 'Solar Amber', bg: '#140800', c1: '#ffb703', c2: '#fb5607', alpha: 0.045 },
        { name: 'Emerald Abyss', bg: '#021612', c1: '#00f5d4', c2: '#70e000', alpha: 0.045 },
        { name: 'Amethyst Dream', bg: '#13031f', c1: '#e0aaff', c2: '#7b2cbf', alpha: 0.045 },
        { name: 'Crimson Dusk', bg: '#1a0006', c1: '#ff4d6d', c2: '#ffb3c1', alpha: 0.045 },
        { name: 'Glacier Blue', bg: '#030c14', c1: '#caf0f8', c2: '#48cae4', alpha: 0.045 }
      ];

      const theme = proceduralThemes[Math.floor(Math.random() * proceduralThemes.length)];
      settings.colorScheme = theme.name in colorSchemes ? theme.name : 'Custom';
      settings.bgColor = theme.bg;
      settings.particleColor = theme.c1;
      settings.particleColor2 = theme.c2;
      settings.particleAlpha = theme.alpha;

      const shapes = ['Ring', 'Circle', 'Points', 'Spiral', 'Cross', 'Center'];
      settings.spawnShape = shapes[Math.floor(Math.random() * shapes.length)];
      settings.spawnRadius = Math.round(getRandomFloat(25, 160));
      settings.particleCount = Math.round(getRandomFloat(600, 2000));
      settings.particleSpeed = parseFloat(getRandomFloat(0.18, 0.55).toFixed(2));
      settings.velocityDamping = parseFloat(getRandomFloat(0.88, 0.96).toFixed(2));
      settings.particleSize = parseFloat(getRandomFloat(0.8, 1.8).toFixed(1));

      const anims = ['Static', 'Gentle Drift', 'Breathing Pulse', 'Orbital Glide', 'Cosmic Spiral'];
      settings.animationPreset = anims[Math.floor(Math.random() * anims.length)];

      // Randomize subtle bloom variations
      if (postProcessor) {
        postProcessor.settings.bloomStrength = parseFloat(getRandomFloat(0.4, 0.9).toFixed(2));
        postProcessor.settings.bloomRadius = parseFloat(getRandomFloat(0.3, 0.6).toFixed(2));
        postProcessor.updateSettings();
      }

      resetSimulation();
      updateGuiDisplay();
    }

    /* ---- LIL-GUI SETUP ---- */
    const gui = new GUI({ title: 'Particle Settings' });

    function updateGuiDisplay() {
      function updateFolder(folder) {
        if (folder.controllers) {
          folder.controllers.forEach(c => c.updateDisplay());
        }
        if (folder.folders) {
          folder.folders.forEach(f => updateFolder(f));
        }
      }
      updateFolder(gui);
    }

    const fPresets = gui.addFolder('Presets & Animation');
    fPresets.add(settings, 'colorScheme', [
      'Original (Deep Cosmic)',
      'Black & White',
      'White & Black',
      'Cyber Neon',
      'Solar Amber',
      'Custom'
    ]).name('Color Scheme').onChange(applyColorScheme);

    fPresets.add(settings, 'greenscreen').name('Greenscreen (#00ff00)');

    fPresets.add(settings, 'animationPreset', [
      'Static',
      'Gentle Drift',
      'Breathing Pulse',
      'Orbital Glide',
      'Cosmic Spiral'
    ]).name('Animation');

    fPresets.add(settings, 'animSpeed', 0.1, 3.0, 0.1).name('Animation Speed');

    const fColor = gui.addFolder('Colors & Appearance');
    fColor.addColor(settings, 'bgColor').name('Background Color').onChange(() => {
      settings.colorScheme = 'Custom';
      updateGuiDisplay();
    });
    fColor.addColor(settings, 'particleColor').name('Primary Color');
    fColor.addColor(settings, 'particleColor2').name('Secondary Color');
    fColor.add(settings, 'particleAlpha', 0.005, 0.25, 0.005).name('Opacity (Alpha)');
    fColor.add(settings, 'particleSize', 0.2, 4.0, 0.1).name('Particle Size');

    const fPhysics = gui.addFolder('Physics & Geometry');
    fPhysics.add(settings, 'particleCount', 100, 3000, 50).name('Particle Count').onFinishChange(resetSimulation);
    fPhysics.add(settings, 'particleSpeed', 0.05, 1.5, 0.01).name('Particle Speed');
    fPhysics.add(settings, 'velocityDamping', 0.80, 0.99, 0.01).name('Damping');
    fPhysics.add(settings, 'forceJitter', 0.1, 3.0, 0.1).name('Chaos / Jitter');
    fPhysics.add(settings, 'spawnShape', ['Ring', 'Circle', 'Points', 'Spiral', 'Cross', 'Center']).name('Spawn Shape').onFinishChange(resetSimulation);
    fPhysics.add(settings, 'spawnRadius', 5, 300, 1).name('Spawn Radius').onFinishChange(resetSimulation);

    const fView = gui.addFolder('View & Performance');
    fView.add(settings, 'dpr', 0.5, 3.0, 0.25).name('DPR (Pixel Ratio)').onChange(applyDPR);
    fView.add(settings, 'zoom', 0.1, 10.0, 0.05).name('Zoom').listen();
    fView.add(settings, 'panX').name('Pan X').listen();
    fView.add(settings, 'panY').name('Pan Y').listen();
    fView.add({ reset: resetView }, 'reset').name('Reset View');

    const fActions = gui.addFolder('Interaction & Actions');
    fActions.add(settings, 'clickToRandomize').name('Click to Randomize');
    fActions.add({ randomize: randomizeThemeAndParams }, 'randomize').name('Randomize Now');
    fActions.add({ restart: resetSimulation }, 'restart').name('Clear & Restart');

    // Attach PostProcessor controls to lil-gui
    postProcessor.attachGUI(gui, 'Post-Processing');

    /* ---- KEYBOARD SHORTCUT (H to toggle UI) ---- */
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        if (gui.domElement.style.display === 'none') {
          gui.domElement.style.display = '';
        } else {
          gui.domElement.style.display = 'none';
        }
      }
    });

    /* ---- MOUSE / TOUCH INTERACTION (DRAG & ZOOM) ---- */
    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let hasMoved = false;
    let clickStartTime = 0;

    webglCanvas.addEventListener('pointerdown', (e) => {
      if (e.target !== webglCanvas || e.button !== 0) return;
      isDragging = true;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      hasMoved = false;
      clickStartTime = performance.now();
      try { webglCanvas.setPointerCapture(e.pointerId); } catch (_) {}
    });

    webglCanvas.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - dragStartX;
      const dy = e.clientY - dragStartY;
      if (Math.hypot(dx, dy) > 4) {
        hasMoved = true;
      }
      settings.panX += dx;
      settings.panY += dy;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
    });

    webglCanvas.addEventListener('pointerup', (e) => {
      if (!isDragging) return;
      isDragging = false;
      try { webglCanvas.releasePointerCapture(e.pointerId); } catch (_) {}
      const elapsed = performance.now() - clickStartTime;
      if (!hasMoved && elapsed < 350) {
        if (settings.clickToRandomize) {
          randomizeThemeAndParams();
        } else {
          resetSimulation();
        }
      }
    });

    webglCanvas.addEventListener('pointercancel', () => {
      isDragging = false;
    });

    webglCanvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
      const oldZoom = settings.zoom;
      const newZoom = Math.min(Math.max(oldZoom * zoomFactor, 0.1), 10.0);

      const mouseX = e.clientX - window.innerWidth / 2;
      const mouseY = e.clientY - window.innerHeight / 2;

      settings.panX = mouseX - (mouseX - settings.panX) * (newZoom / oldZoom);
      settings.panY = mouseY - (mouseY - settings.panY) * (newZoom / oldZoom);
      settings.zoom = newZoom;

      updateGuiDisplay();
    }, { passive: false });

    // Touch Support for pinch zoom
    let touchStartDist = 0;
    let touchStartZoom = 1;

    window.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        touchStartDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        touchStartZoom = settings.zoom;
      }
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2 && touchStartDist > 0) {
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const newZoom = Math.min(Math.max(touchStartZoom * (dist / touchStartDist), 0.1), 10.0);
        settings.zoom = newZoom;
        updateGuiDisplay();
      }
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) {
        touchStartDist = 0;
      }
    }, { passive: true });

    window.addEventListener('resize', () => {
      applyDPR();
    });

    /* ---- ANIMATION LOOP ---- */
    let animTime = 0;
    let lastFrameTime = performance.now();

    function loop(now) {
      const dt = Math.min((now - lastFrameTime) / 1000, 0.1);
      lastFrameTime = now;

      animTime += dt * settings.animSpeed;

      // 1. Update and render particles onto persistent simulation canvas
      const pLen = particles.length;
      for (let i = 0; i < pLen; i++) {
        particles[i].update(settings.animSpeed);
        particles[i].render(simContext);
      }

      // 2. Compute camera animation transform
      let animOffsetX = 0;
      let animOffsetY = 0;
      let animRot = 0;
      let animZoomFactor = 1.0;

      switch (settings.animationPreset) {
        case 'Gentle Drift':
          animOffsetX = Math.sin(animTime * 0.25) * 35;
          animOffsetY = Math.cos(animTime * 0.20) * 25;
          break;
        case 'Breathing Pulse':
          animRot = Math.sin(animTime * 0.12) * 0.015;
          animZoomFactor = 1.0 + Math.sin(animTime * 0.35) * 0.07;
          break;
        case 'Orbital Glide':
          animOffsetX = Math.cos(animTime * 0.18) * 40;
          animOffsetY = Math.sin(animTime * 0.18) * 40;
          animRot = animTime * 0.025;
          break;
        case 'Cosmic Spiral':
          animOffsetX = Math.sin(animTime * 0.14) * 25;
          animOffsetY = Math.cos(animTime * 0.18) * 20;
          animRot = animTime * 0.018;
          animZoomFactor = 1.0 + Math.sin(animTime * 0.22) * 0.05;
          break;
        case 'Static':
        default:
          break;
      }

      // 3. Clear and draw to intermediate 2D canvas
      intermediateCtx.save();
      const dpr = settings.dpr;
      const w = window.innerWidth;
      const h = window.innerHeight;

      // Background fill (Greenscreen or Custom/Preset bgColor)
      intermediateCtx.fillStyle = settings.greenscreen ? '#00ff00' : settings.bgColor;
      intermediateCtx.fillRect(0, 0, intermediateCanvas.width, intermediateCanvas.height);

      // DPR scale
      intermediateCtx.scale(dpr, dpr);

      // Camera view transforms
      const centerX = w * 0.5 + settings.panX + animOffsetX;
      const centerY = h * 0.5 + settings.panY + animOffsetY;
      intermediateCtx.translate(centerX, centerY);
      intermediateCtx.rotate(animRot);

      const effectiveZoom = settings.zoom * animZoomFactor;
      intermediateCtx.scale(effectiveZoom, effectiveZoom);
      intermediateCtx.translate(-simWidth * 0.5, -simHeight * 0.5);

      // Draw accumulated generative particle filaments
      intermediateCtx.drawImage(simCanvas, 0, 0);

      intermediateCtx.restore();

      // 4. Pass texture through PostProcessor pipeline to visible WebGL canvas
      canvasTexture.needsUpdate = true;
      postProcessor.render(canvasTexture);

      requestAnimationFrame(loop);
    }

    /* ---- START ---- */
    applyDPR();
    resetSimulation();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
