    function hexToRgb(hex) {
      const clean = hex.replace('#', '');
      const bigint = parseInt(clean, 16);
      if (clean.length === 3) {
        const r = ((bigint >> 8) & 0xf) * 17;
        const g = ((bigint >> 4) & 0xf) * 17;
        const b = (bigint & 0xf) * 17;
        return [r / 255, g / 255, b / 255];
      }
      const r = (bigint >> 16) & 255;
      const g = (bigint >> 8) & 255;
      const b = bigint & 255;
      return [r / 255, g / 255, b / 255];
    }

    /* =========================================================================

    /* =========================================================================
       GLSL ES 3.00 SHADERS
       ========================================================================= */
    const vertexShaderSource = `#version 300 es
    precision highp float;
    in vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }`;

    const fragmentShaderSource = `#version 300 es
    /*********
    * made by Matthias Hurrle (@atzedent)
    * Tip: For syntax highlighting, paste the code here:
    * https://shadered.org/app?fork=4Y3P9GQID0
    */ 
    precision highp float;
    out vec4 O;

    // Standard uniforms matching original shader
    uniform float time;
    uniform vec2 resolution;
    uniform vec2 move;
    uniform float zoom;
    uniform float pointerCount;

    // Interactive View & Panning uniforms
    uniform vec2 u_pan;
    uniform float u_zoomOffset;

    // Procedural geometry & optics modulation
    uniform float u_linkR1;
    uniform float u_linkR2;
    uniform float u_linkH;
    uniform float u_rippleAmp;
    uniform float u_floorDist;
    uniform float u_glowIntensity;
    uniform float u_refraction;
    uniform float u_fresnelPower;
    uniform float u_specularPower;

    // Post-processing & Aesthetics
    uniform float u_brightness;
    uniform float u_contrast;
    uniform float u_vignette;
    uniform float u_invert;

    // Palette & Color uniforms
    uniform float u_paletteBlend;
    uniform vec3 u_palGlass;
    uniform vec3 u_palGlow;
    uniform vec3 u_palFresnel;
    uniform vec3 u_floorCol1;
    uniform vec3 u_floorCol2;
    uniform vec3 u_floorBase;
    uniform vec3 u_bgColor;

    #define FC gl_FragCoord.xy
    #define R resolution
    #define T time
    #define N normalize
    #define S smoothstep
    #define MN min(R.x,R.y)
    // fast (unprecise) 2D rotation
    #define rot(a) mat2(cos((a)-vec4(0,11,33,0)))
    // Rotates the camera
    void cam(inout vec3 p) {
      p.yx*=rot(-.42);
      p.yz*=rot(cos(1.6+move.y*6.3/MN));
      p.xz*=rot(T*.2-move.x*6.3/MN);
    }
    // Returns the signed distance function of a single chain link
    float link(vec3 p, float r1, float r2, float h) {
      // add ripples
      p+=sin(p*vec3(80,1,1))*u_rippleAmp;
      // elongate along y-axis
      p.y-=clamp(p.y,-h,h);
      // torus
      vec2 c=vec2(length(p.xy)-r1, p.z);
      return length(c)-r2;
    }
    // Returns the distance to the scene at point p and its associated object-id
    vec2 map(vec3 p) {
      // spacing of the domain repetition
      const float n=4.5;
      // pre-calculate floor with original point
      float floor=-(p.z-u_floorDist);
      // animate camera around chain
      cam(p);
      // flip axis for second link and move apart a fair bit
      vec3 u=p.zyx+vec3(0,2.25,0);
      // calculate domain repetition for each of the two links
      p.y-=clamp(round(p.y/n),-3.,3.)*n;
      u.y-=clamp(round(u.y/n),-3.,3.)*n;
      // distance calculation
      float
      d=abs(link(p,u_linkR1,u_linkR2,u_linkH))-.04,
      e=abs(link(u,u_linkR1,u_linkR2,u_linkH))-.04;
      // union of floor and links
      vec2 a=vec2(floor,0), b=vec2(min(d,e),1);
      a=a.x<b.x?a:b;
      return a;
    }
    // Returns the normal of the surface at the given point
    vec3 norm(vec3 p) {
      float h=1e-2; vec2 k=vec2(-1,1);
      return N(
        k.xyy*map(p+k.xyy*h).x+
        k.yxy*map(p+k.yxy*h).x+
        k.yyx*map(p+k.yyx*h).x+
        k.xxx*map(p+k.xxx*h).x
      );
    }
    // Returns a pseudo random number for a given point (white noise)
    float rnd(vec2 p) {
      p=fract(p*vec2(12.9898,78.233));
      p+=dot(p,p+34.56);
      return fract(p.x*p.y);
    }
    // Returns the shadow value of the given point with the given light position
    float shadow(vec3 p, vec3 lp) {
      float shd=1., maxd=length(lp-p);
      vec3 l=normalize(lp-p);
      for (float i=1e-2; i<maxd;) {
        float d=map(p+l*i).x;
        if (d<1e-2) {
          shd=.0;
          break;
        }
        shd=min(shd,64.*d/i);
        i+=d;
      }
      return shd;
    }
    // Returns a scratch pattern at the given point
    float scratch(vec2 uv) {
      float x=uv.x+T*1e1,
      rx=rnd(vec2(x)),
      l=step(1.-7e-4,sin(x*1e3*(rx*1e-2+1e-2))),
      y=uv.y+T*9e-4,
      ry=rnd(vec2(y));
      l*=sin(y*1e3*ry);
      return clamp(1.-l,.0,1.);
    }
    // render the scene
    vec3 scene() {
      // normalize the canvas dimensions (-.5/.5) and apply pan translation
      vec2 uv=(FC-.5*R)/MN - u_pan;
      // shortest or longest component of the unit vector depending on orientation
      float mn=R.x>R.y?max(abs(uv.x),abs(uv.y)):min(abs(uv.x),abs(uv.y));
      // initialize the color vector
      vec3 col=vec3(0),
      // place the camera at two units in front of the scene and allow smooth zooming
      p=vec3(0,0,-2.-2.*S(10.,-10.,10.*clamp(zoom,-1.,1.))+u_zoomOffset),
      // construct a fish-eye lense
      rd=N(vec3(uv,.7+S(.0,3.2,max(dot(mn,mn),.0))));
      // keep track of distance, glow, side...
      float dd=.0, at=.0, side=1., e=1., bnz=.0, k=mix(.7,1.,rnd(uv+T*.01));
      // raymarching loop
      for (int i; i++<80;) {
        // get distance and material
        vec2 d=map(p);
        // multiply distance by side (inside or outside the link)
        d.x*=side;
        // ray has hit a surface
        if (abs(d.x)<1e-3) {
          // calculate surface normal, place light and normalize light vector
          vec3 n=norm(p)*side, lp=vec3(16,2,-20), l=N(lp-p);
          // invert light vector if inside a link
          if (dot(l,n)<.0) l=-l;
          // calculate diffuse light, fresnel, specular light and shadows
          float dif=clamp(dot(l,n),.0,1.), fres=pow(clamp(1.+dot(rd,n),.0,1.),u_fresnelPower),
          spec=d.y<1.?.0:pow(clamp(dot(reflect(rd,n),l),.0,1.),u_specularPower),
          // calculate shadow only once (the first time)
          shd=bnz++<1.?shadow(p+n*5e-2,lp):1.;

          vec3 glassTint = mix(vec3(.4,.9,1.), u_palGlass, u_paletteBlend);
          vec3 fresnelTint = mix(vec3(.4,.9,1.), u_palFresnel, u_paletteBlend);

          // add diffuse light dpending on the material (harder if it is a link)
          col+=pow(dif,d.y<1.?5.:15.)*.85*glassTint;
          // darken by a factor indicating the level of transparancy
          col*=e;
          // add specular light
          col+=1e2*spec;
          // add a shimmer to surfaces at a shallow angle
          col+=3.*fres*fresnelTint;
          // reduce the factor so that lower layers can be darkened
          e*=.95;
          // darken and add some grain
          col*=.75*k;
          // shade floor
          if (d.y<1.) {
            // add the chain's shadow
            col*=shd;
            // add movement to the right
            p.x-=T*5.;
            // generate a pattern
            float w=sin(p.x)-cos(p.y);
            float w1=S(1.,1.5,w);
            float w2=S(1.,1.2,w);
            float w3=S(.5,3.2,w);

            vec3 origFloor = vec3(w1+w2, w1+w3, w1);
            vec3 palFloor = u_floorBase + u_floorCol1*(w1+w2) + u_floorCol2*w3;
            col += mix(origFloor, palFloor, u_paletteBlend);

            // add scratch effect
            col+=step(scratch(uv),1.-7e-7)*.2;
            // exit the raymarcher since we already hit the floor
            break;
          }
          // flip sides since we will transition from outside to inside or vice versa
          side=-side;
          // refract the ray according to the side
          vec3 rdo=refract(rd,n,1.+side*u_refraction);
          // instead of refraction calculate the reflection if the surface is at a shallow angle
          if (dot(rdo,rdo)==.0) rdo=reflect(rd,n);
          // set the ray direction according to the pre-calculated ray
          rd=rdo;
          // offset the distance to avoid artifacts
          d.x=5e-2;
        }
        // keep track of the overall distance the ray travelled through the scene
        dd+=d.x;
        // accumulate glow for the glass effect
        at+=.05*(.05/dd*k);
        // advance the ray
        p+=rd*d.x;
      }
      // increase the glow
      at*=5.;
      // add the glow and tint it
      vec3 glowTint = mix(vec3(.4,.9,1.), u_palGlow, u_paletteBlend);
      col+=at*at*at*at*u_glowIntensity*glowTint;
      // return the color of the scene
      return col;
    }
    // The main entry of the fragment shader
    void main() {
      // calculate the output color
      vec3 col=scene();
      // calculate a vignette and add it to the output color
      vec2 uv=FC/R*2.-1.;
      uv*=.95;
      uv*=uv*uv*uv*uv;
      float v=pow(dot(uv,uv),.8);
      vec3 bgCol = mix(vec3(0), u_bgColor, u_paletteBlend);
      col=mix(col,bgCol,clamp(v*u_vignette, 0.0, 1.0));
      // calculate the animation time for the intro
      float t=min(time*.3,1.);
      // animate from black
      col=mix(bgCol,col,t);
      // animate from monochrome
      vec3 monoTint = mix(vec3(.8,.9,1.), u_palGlow, u_paletteBlend);
      col=mix(vec3(dot(col,vec3(.21,.71,.07)))*monoTint,col,pow(t,5.));

      // Brightness and contrast
      col = ((col - 0.5) * u_contrast + 0.5) * u_brightness;

      if (u_invert > 0.5) {
        col = 1.0 - col;
      }

      // output the final color
      O=vec4(clamp(col, 0.0, 1.0),1);
    }`;

    /* =========================================================================
       WEBGL2 ENGINE INITIALIZATION
       ========================================================================= */
    const canvas = document.getElementById('glcanvas');
    const gl = canvas.getContext('webgl2', {
      alpha: false,
      antialias: false,
      depth: false,
      stencil: false,
      preserveDrawingBuffer: true,
      powerPreference: 'high-performance'
    });

    if (!gl) {
      alert('WebGL 2.0 is not supported by your browser or graphics hardware.');
      throw new Error('WebGL 2.0 unavailable');
    }

    function createShader(gl, type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        const info = gl.getShaderInfoLog(shader);
        gl.deleteShader(shader);
        throw new Error('Shader compilation error: ' + info);
      }
      return shader;
    }

    function createProgram(gl, vsSource, fsSource) {
      const vs = createShader(gl, gl.VERTEX_SHADER, vsSource);
      const fs = createShader(gl, gl.FRAGMENT_SHADER, fsSource);
      const program = gl.createProgram();
      gl.attachShader(program, vs);
      gl.attachShader(program, fs);
      gl.linkProgram(program);
      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        const info = gl.getProgramInfoLog(program);
        gl.deleteProgram(program);
        throw new Error('Program link error: ' + info);
      }
      return program;
    }

    const program = createProgram(gl, vertexShaderSource, fragmentShaderSource);

    // Full-screen triangle covering [-1, 1]x[-1, 1]
    const quadVertices = new Float32Array([
      -1, -1,
       3, -1,
      -1,  3
    ]);

    const vao = gl.createVertexArray();
    gl.bindVertexArray(vao);
    const vbo = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
    gl.bufferData(gl.ARRAY_BUFFER, quadVertices, gl.STATIC_DRAW);

    const posAttr = gl.getAttribLocation(program, 'a_position');
    gl.enableVertexAttribArray(posAttr);
    gl.vertexAttribPointer(posAttr, 2, gl.FLOAT, false, 0, 0);

    // Uniform Locations
    const uniforms = {
      time: gl.getUniformLocation(program, 'time'),
      resolution: gl.getUniformLocation(program, 'resolution'),
      move: gl.getUniformLocation(program, 'move'),
      zoom: gl.getUniformLocation(program, 'zoom'),
      pointerCount: gl.getUniformLocation(program, 'pointerCount'),
      u_pan: gl.getUniformLocation(program, 'u_pan'),
      u_zoomOffset: gl.getUniformLocation(program, 'u_zoomOffset'),
      u_linkR1: gl.getUniformLocation(program, 'u_linkR1'),
      u_linkR2: gl.getUniformLocation(program, 'u_linkR2'),
      u_linkH: gl.getUniformLocation(program, 'u_linkH'),
      u_rippleAmp: gl.getUniformLocation(program, 'u_rippleAmp'),
      u_floorDist: gl.getUniformLocation(program, 'u_floorDist'),
      u_glowIntensity: gl.getUniformLocation(program, 'u_glowIntensity'),
      u_refraction: gl.getUniformLocation(program, 'u_refraction'),
      u_fresnelPower: gl.getUniformLocation(program, 'u_fresnelPower'),
      u_specularPower: gl.getUniformLocation(program, 'u_specularPower'),
      u_brightness: gl.getUniformLocation(program, 'u_brightness'),
      u_contrast: gl.getUniformLocation(program, 'u_contrast'),
      u_vignette: gl.getUniformLocation(program, 'u_vignette'),
      u_invert: gl.getUniformLocation(program, 'u_invert'),
      u_paletteBlend: gl.getUniformLocation(program, 'u_paletteBlend'),
      u_palGlass: gl.getUniformLocation(program, 'u_palGlass'),
      u_palGlow: gl.getUniformLocation(program, 'u_palGlow'),
      u_palFresnel: gl.getUniformLocation(program, 'u_palFresnel'),
      u_floorCol1: gl.getUniformLocation(program, 'u_floorCol1'),
      u_floorCol2: gl.getUniformLocation(program, 'u_floorCol2'),
      u_floorBase: gl.getUniformLocation(program, 'u_floorBase'),
      u_bgColor: gl.getUniformLocation(program, 'u_bgColor')
    };

    /* =========================================================================
       INTERACTIVE PAN, ZOOM, AND ORBIT STATE
       ========================================================================= */
    let currentZoom = 0.0;
    let targetZoom = 0.0;

    let moves = [0.0, 0.0];
    let targetMoves = [0.0, 0.0];

    let panX = 0.0;
    let panY = 0.0;
    let targetPanX = 0.0;
    let targetPanY = 0.0;

    let timeSec = 0.0;
    let lastTimestamp = performance.now();

    // Mouse / Pointer Interaction tracking
    let isPointerDown = false;
    let activePointerButton = 0;
    let startPointerX = 0;
    let startPointerY = 0;
    let lastPointerX = 0;
    let lastPointerY = 0;
    let totalDragDist = 0;
    let pointerDownTime = 0;

    // Multi-touch tracking for pinch-to-zoom
    const activeTouches = new Map();
    let initialPinchDistance = 0;
    let initialPinchZoom = 0.0;

    /* =========================================================================
       RESIZING & FRAMED 4:5 PRINT MODE
       ========================================================================= */
    function resizeCanvas() {
      const dpr = params.renderScale;
      let displayWidth, displayHeight;

      if (params.framedMode) {
        // 4:5 Art Print Aspect Ratio
        const maxW = window.innerWidth - 64;
        const maxH = window.innerHeight - 64;
        const targetAspect = 4 / 5;

        if (maxW / maxH > targetAspect) {
          displayHeight = maxH;
          displayWidth = maxH * targetAspect;
        } else {
          displayWidth = maxW;
          displayHeight = maxW / targetAspect;
        }
        document.body.classList.add('mode-framed');
      } else {
        displayWidth = window.innerWidth;
        displayHeight = window.innerHeight;
        document.body.classList.remove('mode-framed');
      }

      const renderWidth = Math.round(displayWidth * dpr);
      const renderHeight = Math.round(displayHeight * dpr);

      if (canvas.width !== renderWidth || canvas.height !== renderHeight) {
        canvas.width = renderWidth;
        canvas.height = renderHeight;
        canvas.style.width = displayWidth + 'px';
        canvas.style.height = displayHeight + 'px';
        gl.viewport(0, 0, renderWidth, renderHeight);
      }
    }

    window.addEventListener('resize', resizeCanvas);

    /* =========================================================================
       WHEEL ZOOM & PAN EVENT LISTENERS
       ========================================================================= */
    // Mouse Wheel: Zoom smoothly in/out
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomStep = Math.sign(e.deltaY) * -0.15;
      targetZoom = Math.min(Math.max(targetZoom + zoomStep, -2.5), 3.0);
      params.zoom = +targetZoom.toFixed(2);
      if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
    }, { passive: false });

    // Pointer down: initiate drag / record start for click detection
    canvas.addEventListener('pointerdown', (e) => {
      if (e.target !== canvas) return;
      isPointerDown = true;
      activePointerButton = e.button;
      startPointerX = e.clientX;
      startPointerY = e.clientY;
      lastPointerX = e.clientX;
      lastPointerY = e.clientY;
      totalDragDist = 0;
      pointerDownTime = performance.now();
      canvas.setPointerCapture(e.pointerId);

      activeTouches.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (activeTouches.size === 2) {
        const pts = Array.from(activeTouches.values());
        initialPinchDistance = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        initialPinchZoom = targetZoom;
      }
    });

    // Pointer move: Drag object across screen or rotate camera
    window.addEventListener('pointermove', (e) => {
      if (!isPointerDown) return;

      if (activeTouches.has(e.pointerId)) {
        activeTouches.set(e.pointerId, { x: e.clientX, y: e.clientY });
      }

      // Handle two-finger pinch-to-zoom
      if (activeTouches.size === 2) {
        const pts = Array.from(activeTouches.values());
        const currentDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        if (initialPinchDistance > 10) {
          const ratio = currentDist / initialPinchDistance;
          targetZoom = Math.min(Math.max(initialPinchZoom + (ratio - 1.0) * 2.0, -2.5), 3.0);
          params.zoom = +targetZoom.toFixed(2);
          if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
        }
        return;
      }

      const dx = e.clientX - lastPointerX;
      const dy = e.clientY - lastPointerY;
      lastPointerX = e.clientX;
      lastPointerY = e.clientY;
      totalDragDist += Math.hypot(dx, dy);

      if (totalDragDist > 4) {
        canvas.classList.add('dragging');
      }

      const rect = canvas.getBoundingClientRect();
      const minDim = Math.min(rect.width, rect.height);

      // Determine Pan vs Orbit based on button, shift key, or mode
      const isPan = (activePointerButton === 2) || (activePointerButton === 1) || e.shiftKey || (params.dragMode === 'Pan (Translate)');

      if (isPan) {
        // Drag object across screen (translation)
        targetPanX += dx / minDim;
        targetPanY -= dy / minDim;
        params.panX = +targetPanX.toFixed(3);
        params.panY = +targetPanY.toFixed(3);
      } else {
        // Orbit camera around chain (matching original moves)
        targetMoves[0] += dx * 1.5;
        targetMoves[1] += dy * 1.5;
        params.orbitX = +targetMoves[0].toFixed(1);
        params.orbitY = +targetMoves[1].toFixed(1);
      }

      if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
    });

    // Pointer up: detect click vs drag
    window.addEventListener('pointerup', (e) => {
      if (!isPointerDown) return;
      activeTouches.delete(e.pointerId);
      isPointerDown = false;
      canvas.classList.remove('dragging');

      const clickDuration = performance.now() - pointerDownTime;
      // If it was a clean click without significant drag
      if (totalDragDist < 6 && clickDuration < 350) {
        if (params.clickToRandomize) {
          randomizeScene();
        }
      }
    });

    window.addEventListener('pointercancel', (e) => {
      activeTouches.delete(e.pointerId);
      isPointerDown = false;
      canvas.classList.remove('dragging');
    });

    // Prevent context menu on right click to allow smooth right-click panning
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());

    // Keyboard Shortcuts
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;

      const key = e.key.toLowerCase();
      if (e.key === ' ' || e.code === 'Space') {
        e.preventDefault();
        randomizeScene();
      } else if (key === 'p') {
        params.paused = !params.paused;
        if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
      } else if (key === 'h') {
        params.hideUI = !params.hideUI;
        document.body.classList.toggle('hidden-ui', params.hideUI);
        if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
      } else if (key === 'r') {
        randomizeScene();
      }
    });

    /* =========================================================================
       PALETTE MANAGEMENT
       ========================================================================= */
    function applyPalette(schemeName) {
      params.colorScheme = schemeName;
      const scheme = COLOR_SCHEMES[schemeName] || COLOR_SCHEMES['Original'];
      params.paletteBlend = scheme.blend;
      document.body.style.backgroundColor = scheme.bg;
      if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    function uploadPaletteUniforms(schemeName) {
      const scheme = COLOR_SCHEMES[schemeName] || COLOR_SCHEMES['Original'];
      
      const rgbGlass = hexToRgb(scheme.glass);
      const rgbGlow = hexToRgb(scheme.glow);
      const rgbFresnel = hexToRgb(scheme.fresnel);
      const rgbFloor1 = hexToRgb(scheme.floor1);
      const rgbFloor2 = hexToRgb(scheme.floor2);
      const rgbFloorBase = hexToRgb(scheme.floorBase);
      const rgbBg = hexToRgb(scheme.bg);

      gl.uniform3f(uniforms.u_palGlass, rgbGlass[0], rgbGlass[1], rgbGlass[2]);
      gl.uniform3f(uniforms.u_palGlow, rgbGlow[0], rgbGlow[1], rgbGlow[2]);
      gl.uniform3f(uniforms.u_palFresnel, rgbFresnel[0], rgbFresnel[1], rgbFresnel[2]);
      gl.uniform3f(uniforms.u_floorCol1, rgbFloor1[0], rgbFloor1[1], rgbFloor1[2]);
      gl.uniform3f(uniforms.u_floorCol2, rgbFloor2[0], rgbFloor2[1], rgbFloor2[2]);
      gl.uniform3f(uniforms.u_floorBase, rgbFloorBase[0], rgbFloorBase[1], rgbFloorBase[2]);
      gl.uniform3f(uniforms.u_bgColor, rgbBg[0], rgbBg[1], rgbBg[2]);
    }

    /* =========================================================================
       RANDOMIZATION & PROCEDURAL GENERATION
       ========================================================================= */
    function randomizeScene() {
      // Pick random palette from 19 schemes (excluding Original to produce immediate visual change)
      const schemeKeys = Object.keys(COLOR_SCHEMES).filter(k => k !== 'Original');
      const chosenScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      applyPalette(chosenScheme);

      // Re-roll geometric parameters
      params.linkR1 = +(0.55 + Math.random() * 0.35).toFixed(2);
      params.linkR2 = +(0.2 + Math.random() * 0.16).toFixed(2);
      params.linkH = +(0.45 + Math.random() * 0.65).toFixed(2);
      params.rippleAmp = +(0.002 + Math.random() * 0.012).toFixed(4);
      params.floorDist = +(10.0 + Math.random() * 5.0).toFixed(1);

      // Re-roll optical and lighting properties
      params.glowIntensity = +(0.7 + Math.random() * 0.9).toFixed(2);
      params.refraction = +(0.15 + Math.random() * 0.25).toFixed(2);
      params.fresnelPower = +(3.0 + Math.random() * 4.0).toFixed(1);
      params.specularPower = +[32, 64, 128, 256][Math.floor(Math.random() * 4)];

      // Re-roll motion & speed
      params.speed = +(0.6 + Math.random() * 0.8).toFixed(2);

      // Re-roll random camera rotation and subtle zoom
      targetMoves[0] += (Math.random() - 0.5) * 400;
      targetMoves[1] += (Math.random() - 0.5) * 300;
      params.orbitX = +targetMoves[0].toFixed(1);
      params.orbitY = +targetMoves[1].toFixed(1);

      targetZoom = +((Math.random() - 0.5) * 0.8).toFixed(2);
      params.zoom = targetZoom;

      if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    function resetView() {
      targetZoom = 0.0;
      targetMoves[0] = 0.0;
      targetMoves[1] = 0.0;
      targetPanX = 0.0;
      targetPanY = 0.0;

      params.zoom = 0.0;
      params.orbitX = 0.0;
      params.orbitY = 0.0;
      params.panX = 0.0;
      params.panY = 0.0;

      if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    function resetDefaults() {
      resetView();
      timeSec = 0.0;

      params.colorScheme = 'Original';
      params.paletteBlend = 0.0;
      params.invert = false;
      params.speed = 1.0;
      params.paused = false;
      params.autoRotate = false;
      params.dragMode = 'Orbit (Rotate)';

      params.linkR1 = 0.7;
      params.linkR2 = 0.3;
      params.linkH = 0.77;
      params.rippleAmp = 0.005;
      params.floorDist = 12.0;

      params.glowIntensity = 1.0;
      params.refraction = 0.25;
      params.fresnelPower = 5.0;
      params.specularPower = 128.0;

      params.brightness = 1.0;
      params.contrast = 1.0;
      params.vignette = 1.0;

      applyPalette('Original');
      if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    function savePNG() {
      canvas.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
        const themeSlug = params.colorScheme.toLowerCase().replace(/[^a-z0-9]+/g, '-');
        a.download = `glass-chains-${themeSlug}-${timestamp}.png`;
        a.href = url;
        a.click();
        URL.revokeObjectURL(url);
      }, 'image/png');
    }

    /* =========================================================================
       LIL-GUI CONTROLS
       ========================================================================= */
    let gui;
    if (typeof lil !== 'undefined' && lil.GUI) {
      gui = new lil.GUI({ title: 'Glass Chain Links' });

      // Theme & Color Schemes Folder
      const themeFolder = gui.addFolder('Theme & Color Palette');
      themeFolder.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES))
        .name('Color Scheme')
        .onChange(v => applyPalette(v));
      themeFolder.add(params, 'paletteBlend', 0.0, 1.0, 0.01)
        .name('Palette Blend')
        .listen();
      themeFolder.add(params, 'invert').name('Invert Negative');

      // Navigation & Drag / Zoom Folder
      const viewFolder = gui.addFolder('Navigation & View');
      viewFolder.add(params, 'zoom', -2.5, 3.0, 0.05).name('Wheel Zoom').listen().onChange(v => {
        targetZoom = v;
      });
      viewFolder.add(params, 'dragMode', ['Orbit (Rotate)', 'Pan (Translate)']).name('Left Drag Mode');
      viewFolder.add(params, 'orbitX', -1500, 1500, 1.0).name('Orbit X').listen().onChange(v => {
        targetMoves[0] = v;
      });
      viewFolder.add(params, 'orbitY', -1500, 1500, 1.0).name('Orbit Y').listen().onChange(v => {
        targetMoves[1] = v;
      });
      viewFolder.add(params, 'panX', -3.0, 3.0, 0.01).name('Pan X').listen().onChange(v => {
        targetPanX = v;
      });
      viewFolder.add(params, 'panY', -3.0, 3.0, 0.01).name('Pan Y').listen().onChange(v => {
        targetPanY = v;
      });
      viewFolder.add(params, 'autoRotate').name('Auto Orbit');
      viewFolder.add(params, 'resetView').name('↺ Reset View');

      // Chain Geometry Folder
      const geomFolder = gui.addFolder('Chain Geometry');
      geomFolder.add(params, 'linkR1', 0.35, 1.3, 0.01).name('Major Radius');
      geomFolder.add(params, 'linkR2', 0.1, 0.5, 0.01).name('Tube Radius');
      geomFolder.add(params, 'linkH', 0.2, 1.6, 0.01).name('Elongation (H)');
      geomFolder.add(params, 'rippleAmp', 0.0, 0.03, 0.001).name('Surface Ripples');
      geomFolder.add(params, 'floorDist', 8.0, 20.0, 0.5).name('Floor Distance');

      // Optics & Shading Folder
      const opticsFolder = gui.addFolder('Glass Optics & Light');
      opticsFolder.add(params, 'glowIntensity', 0.0, 3.0, 0.05).name('Glow Power');
      opticsFolder.add(params, 'refraction', 0.05, 0.6, 0.01).name('Refraction Index');
      opticsFolder.add(params, 'fresnelPower', 1.0, 10.0, 0.2).name('Fresnel Falloff');
      opticsFolder.add(params, 'specularPower', 16.0, 256.0, 8.0).name('Specular Shine');

      // Motion & Aesthetics Folder
      const motionFolder = gui.addFolder('Motion & Aesthetics');
      motionFolder.add(params, 'speed', -3.0, 3.0, 0.05).name('Animation Speed');
      motionFolder.add(params, 'paused').name('Pause Motion (P)').listen();
      motionFolder.add(params, 'brightness', 0.4, 2.0, 0.05).name('Brightness');
      motionFolder.add(params, 'contrast', 0.4, 2.0, 0.05).name('Contrast');
      motionFolder.add(params, 'vignette', 0.0, 2.0, 0.05).name('Vignette Intensity');
      motionFolder.add(params, 'renderScale', [0.5, 0.75, 1.0, 1.5, 2.0]).name('Render DPI').onChange(resizeCanvas);

      // Display & Interaction Settings Folder
      const settingsFolder = gui.addFolder('Settings & Modes');
      settingsFolder.add(params, 'clickToRandomize').name('Click to Randomize');
      settingsFolder.add(params, 'framedMode').name('Framed 4:5 Print').onChange(resizeCanvas).listen();
      settingsFolder.add(params, 'hideUI').name('Hide Interface (H)').onChange(v => {
        document.body.classList.toggle('hidden-ui', v);
      }).listen();

      // Quick Actions Folder
      const actionsFolder = gui.addFolder('Quick Actions');
      actionsFolder.add(params, 'randomize').name('🎲 Randomize Scene (Space)');
      actionsFolder.add(params, 'resetDefaults').name('↺ Reset Defaults');
      actionsFolder.add(params, 'savePNG').name('📸 Capture PNG');

      themeFolder.open();
    }

    /* =========================================================================
       MAIN ANIMATION & RENDER LOOP
       ========================================================================= */
    resizeCanvas();

    function renderFrame(now) {
      requestAnimationFrame(renderFrame);

      const deltaMs = now - lastTimestamp;
      const deltaSec = deltaMs / 1000.0;
      lastTimestamp = now;

      // Update time with animation speed
      if (!params.paused) {
        timeSec += deltaSec * params.speed;
        if (params.autoRotate) {
          targetMoves[0] += deltaSec * 35.0 * params.speed;
          params.orbitX = +targetMoves[0].toFixed(1);
        }
      }

      // Smooth inertia lerping for zoom, orbit, and pan
      currentZoom += (targetZoom - currentZoom) * 0.12;
      moves[0] += (targetMoves[0] - moves[0]) * 0.14;
      moves[1] += (targetMoves[1] - moves[1]) * 0.14;
      panX += (targetPanX - panX) * 0.14;
      panY += (targetPanY - panY) * 0.14;

      // Calculate zoom extension offset when zoom is beyond [-1, 1]
      let zoomOffset = 0.0;
      if (currentZoom > 1.0) {
        zoomOffset = (currentZoom - 1.0) * 1.5;
      } else if (currentZoom < -1.0) {
        zoomOffset = (currentZoom + 1.0) * 1.5;
      }

      // Activate Shader Program
      gl.useProgram(program);

      // Core uniform inputs matching original shader
      gl.uniform1f(uniforms.time, timeSec);
      gl.uniform2f(uniforms.resolution, canvas.width, canvas.height);
      gl.uniform2f(uniforms.move, moves[0], moves[1]);
      gl.uniform1f(uniforms.zoom, currentZoom);
      gl.uniform1f(uniforms.pointerCount, isPointerDown ? 1.0 : 0.0);

      // Interactive view & pan uniforms
      gl.uniform2f(uniforms.u_pan, panX, panY);
      gl.uniform1f(uniforms.u_zoomOffset, zoomOffset);

      // Procedural parameters
      gl.uniform1f(uniforms.u_linkR1, params.linkR1);
      gl.uniform1f(uniforms.u_linkR2, params.linkR2);
      gl.uniform1f(uniforms.u_linkH, params.linkH);
      gl.uniform1f(uniforms.u_rippleAmp, params.rippleAmp);
      gl.uniform1f(uniforms.u_floorDist, params.floorDist);
      gl.uniform1f(uniforms.u_glowIntensity, params.glowIntensity);
      gl.uniform1f(uniforms.u_refraction, params.refraction);
      gl.uniform1f(uniforms.u_fresnelPower, params.fresnelPower);
      gl.uniform1f(uniforms.u_specularPower, params.specularPower);

      // Aesthetics & Post-processing
      gl.uniform1f(uniforms.u_brightness, params.brightness);
      gl.uniform1f(uniforms.u_contrast, params.contrast);
      gl.uniform1f(uniforms.u_vignette, params.vignette);
      gl.uniform1f(uniforms.u_invert, params.invert ? 1.0 : 0.0);
      gl.uniform1f(uniforms.u_paletteBlend, params.paletteBlend);

      // Upload active color palette
      uploadPaletteUniforms(params.colorScheme);

      // Render fullscreen triangle
      gl.bindVertexArray(vao);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }

    requestAnimationFrame(renderFrame);
  </script>
</body>
