<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procedural Waves 3D</title>
  <style>
    body {
      overflow: hidden;
      margin: 0;
      background-color: #ffffff;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
  <script async src="https://ga.jspm.io/npm:es-module-shims@1.5.1/dist/es-module-shims.js" crossorigin="anonymous"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from "three";
    import { SimplexNoise } from "three/addons/math/SimplexNoise.js";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { GUI } from "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js";

    // --- Scene Setup ---
    console.clear();

    const scene = new THREE.Scene();
    const defaultBgColor = 'white';
    scene.background = new THREE.Color(defaultBgColor);

    const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 2, 6);

    const light = new THREE.DirectionalLight('white', 10);
    light.position.set(0, 10, 0);
    scene.add(light);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setAnimationLoop(animationLoop);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 0, 0);

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- Geometry & Waves ---
    const geometry = new THREE.PlaneGeometry(10, 8, 250, 250);
    const pos = geometry.getAttribute('position');
    const simplex = new SimplexNoise();

    const material = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      roughness: 1.0,
      metalness: 1.0,
      wireframe: false
    });

    const waves = new THREE.Mesh(geometry, material);
    waves.rotation.x = -Math.PI / 2;
    scene.add(waves);

    // --- Preset Color Schemes ---
    const colorSchemes = {
      'Original (White & Metallic)': {
        waveColor: '#ffffff',
        bgColor: '#ffffff',
        lightColor: '#ffffff',
        lightIntensity: 10,
        roughness: 1.0,
        metalness: 1.0,
        wireframe: false
      },
      'Deep Ocean Cyan': {
        waveColor: '#00d2ff',
        bgColor: '#030f1e',
        lightColor: '#ffffff',
        lightIntensity: 10,
        roughness: 0.2,
        metalness: 0.8,
        wireframe: false
      },
      'Sunset Cyberpunk': {
        waveColor: '#ff2a6d',
        bgColor: '#0d0221',
        lightColor: '#ffb703',
        lightIntensity: 12,
        roughness: 0.3,
        metalness: 0.7,
        wireframe: false
      },
      'Emerald Matrix': {
        waveColor: '#00ff88',
        bgColor: '#02140a',
        lightColor: '#a0ffe0',
        lightIntensity: 10,
        roughness: 0.1,
        metalness: 0.9,
        wireframe: false
      },
      'Lava Core': {
        waveColor: '#ff4500',
        bgColor: '#1a0500',
        lightColor: '#ffaa00',
        lightIntensity: 14,
        roughness: 0.2,
        metalness: 0.8,
        wireframe: false
      }
    };

    // --- Preset Animations ---
    const animationPresets = [
      'Static Camera (Classic)',
      'Slow Ocean Drift',
      'Harmonic Pulsing',
      'Vortex Ripple',
      'Calm Horizon'
    ];

    // --- GUI Parameters ---
    const params = {
      // Background & Greenscreen
      greenScreen: false,
      bgColor: colorSchemes['Original (White & Metallic)'].bgColor,

      // Color & Material
      colorScheme: 'Original (White & Metallic)',
      waveColor: colorSchemes['Original (White & Metallic)'].waveColor,
      roughness: colorSchemes['Original (White & Metallic)'].roughness,
      metalness: colorSchemes['Original (White & Metallic)'].metalness,
      wireframe: false,

      // Lighting
      lightColor: colorSchemes['Original (White & Metallic)'].lightColor,
      lightIntensity: colorSchemes['Original (White & Metallic)'].lightIntensity,

      // Animation & Motion
      animationPreset: 'Static Camera (Classic)',
      animSpeed: 1.0,
      waveHeight: 1.0,
      noiseScaleX: 3.0,
      noiseScaleY: 2.0,
      waveFreq: 4.0,

      // System / Performance / Mode
      dpr: Math.min(window.devicePixelRatio, 2),
      randomizerOnClick: false
    };

    // Helper function to update scene visual properties
    function updateColors() {
      if (params.greenScreen) {
        scene.background.set('#00ff00');
      } else {
        scene.background.set(params.bgColor);
      }
      material.color.set(params.waveColor);
      material.roughness = params.roughness;
      material.metalness = params.metalness;
      material.wireframe = params.wireframe;

      light.color.set(params.lightColor);
      light.intensity = params.lightIntensity;
    }

    function applyColorScheme(schemeName) {
      const scheme = colorSchemes[schemeName];
      if (!scheme) return;

      params.waveColor = scheme.waveColor;
      params.bgColor = scheme.bgColor;
      params.lightColor = scheme.lightColor;
      params.lightIntensity = scheme.lightIntensity;
      params.roughness = scheme.roughness;
      params.metalness = scheme.metalness;
      params.wireframe = scheme.wireframe;

      updateColors();
      gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    // --- Setup GUI ---
    const gui = new GUI({ title: 'Scene Controls' });

    // Display & Greenscreen
    const fDisplay = gui.addFolder('Display & Render');
    fDisplay.add(params, 'greenScreen').name('Greenscreen (#00ff00)').onChange(updateColors);
    fDisplay.addColor(params, 'bgColor').name('Background Color').onChange(updateColors);
    fDisplay.add(params, 'dpr', 0.5, 3.0, 0.1).name('DPR (Pixel Ratio)').onChange(val => {
      renderer.setPixelRatio(val);
    });

    // Preset & Colors
    const fColors = gui.addFolder('Presets & Colors');
    fColors.add(params, 'colorScheme', Object.keys(colorSchemes)).name('Color Scheme').onChange(applyColorScheme);
    fColors.addColor(params, 'waveColor').name('Wave Color').onChange(updateColors);
    fColors.addColor(params, 'lightColor').name('Light Color').onChange(updateColors);
    fColors.add(params, 'lightIntensity', 0, 30, 0.5).name('Light Intensity').onChange(updateColors);
    fColors.add(params, 'roughness', 0, 1, 0.05).name('Roughness').onChange(updateColors);
    fColors.add(params, 'metalness', 0, 1, 0.05).name('Metalness').onChange(updateColors);
    fColors.add(params, 'wireframe').name('Wireframe').onChange(updateColors);

    // Animation & Motion
    const fAnim = gui.addFolder('Animation & Motion');
    fAnim.add(params, 'animationPreset', animationPresets).name('Animation Preset');
    fAnim.add(params, 'animSpeed', 0, 3.0, 0.1).name('Speed Multiplier');
    fAnim.add(params, 'waveHeight', 0.1, 3.0, 0.1).name('Wave Height');
    fAnim.add(params, 'noiseScaleX', 0.5, 10.0, 0.1).name('Noise Scale X');
    fAnim.add(params, 'noiseScaleY', 0.5, 10.0, 0.1).name('Noise Scale Y');
    fAnim.add(params, 'waveFreq', 0.5, 10.0, 0.1).name('Wave Frequency');

    // Interactive Modes
    const fMode = gui.addFolder('Interactive Mode');
    fMode.add(params, 'randomizerOnClick').name('Click Randomizer Mode');

    // Toggle UI visibility with "H" key
    window.addEventListener('keydown', (e) => {
      if (e.key.toLowerCase() === 'h') {
        gui._hidden ? gui.show() : gui.hide();
      }
    });

    // Randomize parameters on scene click
    function randomizeScene() {
      const randomHex = () => '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0');

      params.waveColor = randomHex();
      params.bgColor = randomHex();
      params.lightColor = randomHex();
      params.lightIntensity = 5 + Math.random() * 20;
      params.roughness = Math.round(Math.random() * 100) / 100;
      params.metalness = Math.round(Math.random() * 100) / 100;
      params.wireframe = Math.random() > 0.85;

      params.waveHeight = 0.5 + Math.random() * 2.0;
      params.noiseScaleX = 1.0 + Math.random() * 6.0;
      params.noiseScaleY = 1.0 + Math.random() * 6.0;
      params.waveFreq = 1.0 + Math.random() * 7.0;
      params.animSpeed = 0.5 + Math.random() * 1.5;

      updateColors();
      gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    // Pointer events to detect clean clicks vs camera drags
    let pointerDownTime = 0;
    let pointerDownPos = { x: 0, y: 0 };

    window.addEventListener('pointerdown', (e) => {
      if (gui.domElement.contains(e.target)) return;
      pointerDownTime = performance.now();
      pointerDownPos = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('pointerup', (e) => {
      if (gui.domElement.contains(e.target)) return;
      const duration = performance.now() - pointerDownTime;
      const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);

      if (params.randomizerOnClick && duration < 300 && dist < 6) {
        randomizeScene();
      }
    });

    // --- Animation Loop ---
    let accumulatedTime = 0;
    let lastT = 0;
    const initialCameraPos = camera.position.clone();

    function animationLoop(t) {
      const delta = (t - lastT) * 0.001;
      lastT = t;
      accumulatedTime += (delta > 0.1 ? 0.016 : delta) * params.animSpeed * 1000;

      const time = accumulatedTime;

      // Animation Preset Behaviors
      if (params.animationPreset === 'Static Camera (Classic)') {
        for (let i = 0; i < pos.count; i++) {
          const x = pos.getX(i);
          const y = pos.getY(i);
          let z = params.waveHeight * simplex.noise3d(x / params.noiseScaleX, y / params.noiseScaleY, time / 5000);
          z = z * Math.sin(params.waveFreq * y);
          pos.setZ(i, z);
        }
      } else if (params.animationPreset === 'Slow Ocean Drift') {
        const driftX = Math.sin(time * 0.0003) * 1.5;
        const driftZ = Math.cos(time * 0.0003) * 0.5;
        camera.position.x = initialCameraPos.x + driftX;
        camera.position.z = initialCameraPos.z + driftZ;

        for (let i = 0; i < pos.count; i++) {
          const x = pos.getX(i);
          const y = pos.getY(i);
          let z = params.waveHeight * simplex.noise3d((x + time * 0.0002) / params.noiseScaleX, y / params.noiseScaleY, time / 4000);
          z = z * Math.sin(params.waveFreq * y + time * 0.001);
          pos.setZ(i, z);
        }
      } else if (params.animationPreset === 'Harmonic Pulsing') {
        const pulse = 1.0 + 0.3 * Math.sin(time * 0.0015);
        for (let i = 0; i < pos.count; i++) {
          const x = pos.getX(i);
          const y = pos.getY(i);
          let z = params.waveHeight * pulse * simplex.noise3d(x / params.noiseScaleX, y / params.noiseScaleY, time / 4500);
          z = z * Math.sin(params.waveFreq * y * pulse);
          pos.setZ(i, z);
        }
      } else if (params.animationPreset === 'Vortex Ripple') {
        for (let i = 0; i < pos.count; i++) {
          const x = pos.getX(i);
          const y = pos.getY(i);
          const r = Math.sqrt(x * x + y * y);
          let z = params.waveHeight * simplex.noise3d(x / params.noiseScaleX, y / params.noiseScaleY, time / 5000);
          z = z * Math.sin(params.waveFreq * r - time * 0.002);
          pos.setZ(i, z);
        }
      } else if (params.animationPreset === 'Calm Horizon') {
        for (let i = 0; i < pos.count; i++) {
          const x = pos.getX(i);
          const y = pos.getY(i);
          let z = (params.waveHeight * 0.5) * simplex.noise3d(x / (params.noiseScaleX * 1.5), y / (params.noiseScaleY * 1.5), time / 8000);
          z = z * Math.sin((params.waveFreq * 0.5) * y);
          pos.setZ(i, z);
        }
      }

      pos.needsUpdate = true;
      geometry.computeVertexNormals();

      controls.update();
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
