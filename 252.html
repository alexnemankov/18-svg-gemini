<!DOCTYPE html>

        }
    }

</head>

<body>

<script type="module">

import * as THREE from "three";
import GUI from "lil-gui";


// ============================================================
// Presets Definitions
// ============================================================

const colorPresets = {

    },
    "Cyber Neon": {

        outputScale: 900.0
    },
    "Solar Flare": {
        lightColor: { r: 1.0, g: 0.58, b: 0.12 },
        spectralPhaseR: 0.2,
        spectralPhaseG: 1.4,
        spectralPhaseB: 3.8,
        lightIntensity: 3.2,
        outputScale: 850.0
    },
    "Emerald Matrix": {
        lightColor: { r: 0.15, g: 1.0, b: 0.55 },

        spectralPhaseG: 0.8,
        spectralPhaseB: 2.2,
        lightIntensity: 3.0,
        outputScale: 950.0
    },
    "Astral Amethyst": {
        lightColor: { r: 0.65, g: 0.35, b: 1.0 },
        spectralPhaseR: 2.1,
        spectralPhaseG: 4.2,
        spectralPhaseB: 0.3,
        lightIntensity: 3.4,
        outputScale: 1100.0
    }
};

const animationPresets = {
    "Cosmic Voyage": {
        travelRate: 0.26,
        mirrorSpeed: 0.07,
        speed: 1.0
    },
    "Hyperspace Glide": {
        travelRate: 0.42,
        mirrorSpeed: 0.03,
        speed: 1.0
    },
    "Quantum Pulsation": {
        travelRate: 0.08,
        mirrorSpeed: 0.14,
        speed: 1.0
    },
    "Abyssal Slumber": {
        travelRate: 0.05,
        mirrorSpeed: 0.02,
        speed: 0.7
    },
    "Static Architecture": {
        travelRate: 0.0,
        mirrorSpeed: 0.0,
        speed: 0.0
    }
};


// ============================================================
// Scene parameters
// ============================================================

const params = {
    // Preset selections
    colorScheme: "Cyan & Amber Flux",
    animationPreset: "Cosmic Voyage",

    // Interactive & Viewport
    greenscreen: false,
    clickRandomize: true,
    speed: 1.0,
    dpr: Math.min(window.devicePixelRatio || 1, 1.5),
    zoom: 1.0,
    offsetX: 0.0,
    offsetY: 0.0,

    // Animation
    travelRate: 0.26,
    mirrorSpeed: 0.07,

    // Camera
    cameraFadeNear: 0.4,
    cameraFadeFar: 2.0,
    startDepth: 2.1,

    // Geometry
    traceFactor: 0.2,

    primaryPeriod: 15.2,
    primaryOffset: 9.9,

    secondaryPeriod: 6.7,
    secondaryOffset: 5.1,

    detailScale: 22.0,
    detailAmount: 1.5,

    verticalOffset: 12.9,

    angularPeriod: 0.628,
    angularHalfPeriod: 0.314,

    // Mirror deformation
    mirrorPhaseX: 0.063,
    mirrorPhaseY: 0.212,
    mirrorPhaseZ: 1.046,

    // Spectral color
    spectralPhaseR: 0.9,
    spectralPhaseG: 2.8,
    spectralPhaseB: 5.2,

    lightColor: {
        r: 1.7 / 3.0,
        g: 1.6 / 3.0,
        b: 1.0
    },

    lightIntensity: 3.0,

    // Output
    outputScale: 1000.0,

    // Performance
    traceSteps: 54,
    foldSteps: 3
};


// ============================================================
// Renderer
// ============================================================

const renderer = new THREE.WebGLRenderer({
    antialias: false,
    alpha: false,
    premultipliedAlpha: false,
    depth: false,
    stencil: false,
    powerPreference: "high-performance"
});

renderer.setClearColor(0x000000, 1);
renderer.setPixelRatio(params.dpr);
renderer.toneMapping = THREE.NoToneMapping;

document.body.appendChild(renderer.domElement);


// ============================================================
// Scene & Camera
// ============================================================

const scene = new THREE.Scene();

const camera = new THREE.OrthographicCamera(
    -1,
    1,
    1,
    -1,
    0,
    1
);


// ============================================================
// Uniforms
// ============================================================

const uniforms = {
    uResolution: {
        value: new THREE.Vector2(1, 1)
    },

    uOffset: {
        value: new THREE.Vector2(params.offsetX, params.offsetY)
    },

    uZoom: {
        value: params.zoom
    },

    uTime: {
        value: 0
    },

    uGreenScreen: {
        value: params.greenscreen
    },

    uTravelRate: {
        value: params.travelRate
    },

    uMirrorSpeed: {
        value: params.mirrorSpeed
    },

    uCameraFadeNear: {
        value: params.cameraFadeNear
    },

    uCameraFadeFar: {
        value: params.cameraFadeFar
    },

    uStartDepth: {
        value: params.startDepth
    },

    uTraceFactor: {
        value: params.traceFactor
    },

    uPrimaryPeriod: {
        value: params.primaryPeriod
    },

    uPrimaryOffset: {
        value: params.primaryOffset
    },

    uSecondaryPeriod: {
        value: params.secondaryPeriod
    },

    uSecondaryOffset: {
        value: params.secondaryOffset
    },

    uDetailScale: {
        value: params.detailScale
    },

    uDetailAmount: {
        value: params.detailAmount
    },

    uVerticalOffset: {
        value: params.verticalOffset
    },

    uAngularPeriod: {
        value: params.angularPeriod
    },

    uAngularHalfPeriod: {
        value: params.angularHalfPeriod
    },

    uMirrorPhase: {
        value: new THREE.Vector3(
            params.mirrorPhaseX,
            params.mirrorPhaseY,
            params.mirrorPhaseZ
        )
    },

    uSpectralPhase: {
        value: new THREE.Vector3(
            params.spectralPhaseR,
            params.spectralPhaseG,
            params.spectralPhaseB
        )
    },

    uLightColor: {
        value: new THREE.Vector3(
            params.lightColor.r,
            params.lightColor.g,
            params.lightColor.b
        )
    },

    uLightIntensity: {
        value: params.lightIntensity
    },

    uOutputScale: {
        value: params.outputScale
    },

    uTraceSteps: {
        value: params.traceSteps
    },

    uFoldSteps: {
        value: params.foldSteps
    }
};


// ============================================================
// Vertex shader
// ============================================================

const vertexShader = /* glsl */ `

void main()
{
    gl_Position = vec4(
        position.xy,
        0.0,
        1.0
    );
}

`;


// ============================================================
// Fragment shader
// ============================================================

const fragmentShader = /* glsl */ `

precision highp float;
precision highp int;


// ============================================================
// Uniforms
// ============================================================

uniform vec2 uResolution;
uniform vec2 uOffset;
uniform float uZoom;
uniform float uTime;
uniform bool uGreenScreen;

uniform float uTravelRate;
uniform float uMirrorSpeed;

uniform float uCameraFadeNear;
uniform float uCameraFadeFar;
uniform float uStartDepth;

uniform float uTraceFactor;

uniform float uPrimaryPeriod;
uniform float uPrimaryOffset;

uniform float uSecondaryPeriod;
uniform float uSecondaryOffset;

uniform float uDetailScale;
uniform float uDetailAmount;

uniform float uVerticalOffset;

uniform float uAngularPeriod;
uniform float uAngularHalfPeriod;

uniform vec3 uMirrorPhase;
uniform vec3 uSpectralPhase;

uniform vec3 uLightColor;
uniform float uLightIntensity;

uniform float uOutputScale;

uniform int uTraceSteps;
uniform int uFoldSteps;


// ============================================================
// Compile-time limits
// ============================================================

const int MAX_TRACE_STEPS = 128;
const int MAX_FOLD_STEPS = 8;


// ============================================================
// Geometry helpers
// ============================================================

vec3 applyAngularFold(vec3 position)
{
    float radius =
        length(position.xz);

    float angle =
        atan(
            position.z,
            position.x
        );

    float sector =
        mod(
            angle,
            uAngularPeriod
        )
        -
        uAngularHalfPeriod;

    position.x =
        radius;

    position.z =
        radius *
        sector;

    return position;
}


float crossSectionDistance(
    vec3 position
)
{
    return length(
        position.yz
    );
}


// ============================================================
// Coordinate deformation
// ============================================================

vec3 transformSample(
    vec3 position,
    float sceneTime
)
{
    position.y +=
        uVerticalOffset;

    vec3 mirrorAxis =
        normalize(
            sin(
                sceneTime *
                uMirrorSpeed
                +
                uMirrorPhase
            )
        );

    position =
        reflect(
            position,
            mirrorAxis
        );

    position +=
        sin(
            position *
            uDetailScale
        )
        /
        max(
            uDetailAmount,
            0.0001
        );

    position =
        applyAngularFold(
            position
        );

    position.y =
        mod(
            position.y,
            max(
                uPrimaryPeriod,
                0.0001
            )
        )
        -
        uPrimaryOffset;

    return position;
}


// ============================================================
// Distance field
// ============================================================

float evaluateField(
    vec3 position,
    float sceneTime
)
{
    float distanceValue =
        crossSectionDistance(
            position
        );

    for (
        int foldIndex = 0;
        foldIndex < MAX_FOLD_STEPS;
        ++foldIndex
    )
    {
        if (
            foldIndex >=
            uFoldSteps
        )
        {
            break;
        }

        position =
            position.zxy;

        position =
            applyAngularFold(
                position
            );

        position.y =
            mod(
                position.y
                +
                sceneTime *
                uTravelRate,

                max(
                    uSecondaryPeriod,
                    0.0001
                )
            )
            -
            uSecondaryOffset;

        distanceValue =
            min(
                distanceValue,

                crossSectionDistance(
                    position
                )
            );
    }

    return distanceValue;
}


// ============================================================
// Light integration
// ============================================================

vec3 integrateLight(
    vec3 rayDirection,
    float sceneTime
)
{
    vec3 lightSum =
        vec3(0.0);

    float depth =
        uStartDepth;

    for (
        int stepIndex = 0;
        stepIndex < MAX_TRACE_STEPS;
        ++stepIndex
    )
    {
        if (
            stepIndex >=
            uTraceSteps
        )
        {
            break;
        }

        vec3 samplePosition =
            rayDirection *
            depth;

        samplePosition =
            transformSample(
                samplePosition,
                sceneTime
            );

        float fieldDistance =
            evaluateField(
                samplePosition,
                sceneTime
            );

        depth +=
            fieldDistance *
            uTraceFactor;

        float cameraFade =
            smoothstep(
                uCameraFadeNear,
                uCameraFadeFar,
                depth
            );

        vec3 spectralWave =
            exp(
                sin(
                    depth
                    +
                    uSpectralPhase
                )
            );

        vec3 emission =
            uLightColor
            *
            uLightIntensity
            *
            spectralWave;

        lightSum +=
            emission
            *
            cameraFade
            /
            max(
                fieldDistance,
                0.0001
            );
    }

    return lightSum;
}


// ============================================================
// Camera
// ============================================================

vec3 createViewRay(
    vec2 pixel
)
{
    vec2 centered =
        (pixel - 0.5 * uResolution.xy - uOffset)
        /
        max(uZoom, 0.0001);

    vec3 rayVector =
        vec3(
            1.0 - uResolution.y,
            2.0 * centered.x,
            2.0 * centered.y
        );

    return normalize(
        rayVector
    );
}


// ============================================================
// Main
// ============================================================

void main()
{
    vec3 rayDirection =
        createViewRay(
            gl_FragCoord.xy
        );

    vec3 radiance =
        integrateLight(
            rayDirection,
            uTime
        );

    vec3 finalColor =
        tanh(
            radiance
            /
            max(
                uOutputScale,
                0.0001
            )
        );

    if (uGreenScreen)
    {
        float brightness =
            max(
                finalColor.r,
                max(
                    finalColor.g,
                    finalColor.b
                )
            );

        float alpha =
            smoothstep(
                0.01,
                0.28,
                brightness
            );

        vec3 greenBg =
            vec3(0.0, 1.0, 0.0);

        finalColor =
            mix(
                greenBg,
                finalColor,
                alpha
            );
    }

    gl_FragColor =
        vec4(
            finalColor,
            1.0
        );
}

`;


// ============================================================
// Fullscreen geometry
// ============================================================

const geometry =
    new THREE.PlaneGeometry(
        2,
        2,
        1,
        1
    );

const material =
    new THREE.ShaderMaterial({
        uniforms,
        vertexShader,
        fragmentShader,
        depthTest: false,
        depthWrite: false,
        transparent: false,
        toneMapped: false
    });

const fullscreenQuad =
    new THREE.Mesh(
        geometry,
        material
    );

fullscreenQuad.frustumCulled = false;

scene.add(fullscreenQuad);


// ============================================================
// Resize
// ============================================================

const drawingBufferSize =
    new THREE.Vector2();

function resize()
{
    const width =
        Math.max(
            window.innerWidth,
            1
        );

    const height =
        Math.max(
            window.innerHeight,
            1
        );

    renderer.setPixelRatio(
        params.dpr
    );

    renderer.setSize(
        width,
        height,
        false
    );

    renderer.getDrawingBufferSize(
        drawingBufferSize
    );

    uniforms
        .uResolution
        .value
        .copy(
            drawingBufferSize
        );
}

window.addEventListener(
    "resize",
    resize
);

resize();


// ============================================================
// GUI & Helpers
// ============================================================

function updateAllControllers(guiInstance)
{
    if (!guiInstance) return;
    if (guiInstance.controllers)
    {
        guiInstance.controllers.forEach(c => c.updateDisplay());
    }
    if (guiInstance.folders)
    {
        guiInstance.folders.forEach(f => updateAllControllers(f));
    }
}

function updateSpectralPhase()
{
    uniforms
        .uSpectralPhase
        .value
        .set(
            params.spectralPhaseR,
            params.spectralPhaseG,
            params.spectralPhaseB
        );
}

function updateMirrorPhase()
{
    uniforms
        .uMirrorPhase
        .value
        .set(
            params.mirrorPhaseX,
            params.mirrorPhaseY,
            params.mirrorPhaseZ
        );
}

function applyColorPreset(name)
{
    const preset = colorPresets[name];
    if (!preset) return;

    params.colorScheme = name;
    params.lightColor.r = preset.lightColor.r;
    params.lightColor.g = preset.lightColor.g;
    params.lightColor.b = preset.lightColor.b;
    params.spectralPhaseR = preset.spectralPhaseR;
    params.spectralPhaseG = preset.spectralPhaseG;
    params.spectralPhaseB = preset.spectralPhaseB;
    params.lightIntensity = preset.lightIntensity;
    params.outputScale = preset.outputScale;

    uniforms.uLightColor.value.set(
        params.lightColor.r,
        params.lightColor.g,
        params.lightColor.b
    );
    updateSpectralPhase();
    uniforms.uLightIntensity.value = params.lightIntensity;
    uniforms.uOutputScale.value = params.outputScale;

    updateAllControllers(gui);
}

function applyAnimationPreset(name)
{
    const preset = animationPresets[name];
    if (!preset) return;

    params.animationPreset = name;
    params.travelRate = preset.travelRate;
    params.mirrorSpeed = preset.mirrorSpeed;
    params.speed = preset.speed;

    uniforms.uTravelRate.value = params.travelRate;
    uniforms.uMirrorSpeed.value = params.mirrorSpeed;

    updateAllControllers(gui);
}

function randomizeParameters()
{
    const hue = Math.random();
    const sat = 0.8 + Math.random() * 0.2;
    const light = 0.45 + Math.random() * 0.2;
    const color = new THREE.Color().setHSL(hue, sat, light);

    params.lightColor.r = color.r;
    params.lightColor.g = color.g;
    params.lightColor.b = color.b;

    params.spectralPhaseR = parseFloat(((Math.random() * 2 - 1) * Math.PI * 2).toFixed(3));
    params.spectralPhaseG = parseFloat(((Math.random() * 2 - 1) * Math.PI * 2).toFixed(3));
    params.spectralPhaseB = parseFloat(((Math.random() * 2 - 1) * Math.PI * 2).toFixed(3));

    params.primaryPeriod = parseFloat((6.0 + Math.random() * 20.0).toFixed(2));
    params.primaryOffset = parseFloat((-10.0 + Math.random() * 20.0).toFixed(2));

    params.secondaryPeriod = parseFloat((4.0 + Math.random() * 12.0).toFixed(2));
    params.secondaryOffset = parseFloat((-8.0 + Math.random() * 16.0).toFixed(2));

    params.detailScale = parseFloat((12.0 + Math.random() * 30.0).toFixed(1));
    params.detailAmount = parseFloat((0.8 + Math.random() * 2.5).toFixed(2));

    params.verticalOffset = parseFloat((-15.0 + Math.random() * 30.0).toFixed(1));

    const ang = parseFloat((0.35 + Math.random() * 0.75).toFixed(3));
    params.angularPeriod = ang;
    params.angularHalfPeriod = parseFloat((ang * 0.5).toFixed(3));

    params.mirrorPhaseX = parseFloat(((Math.random() * 2 - 1) * 3.14).toFixed(3));
    params.mirrorPhaseY = parseFloat(((Math.random() * 2 - 1) * 3.14).toFixed(3));
    params.mirrorPhaseZ = parseFloat(((Math.random() * 2 - 1) * 3.14).toFixed(3));

    params.lightIntensity = parseFloat((2.2 + Math.random() * 2.0).toFixed(2));
    params.outputScale = parseFloat((700.0 + Math.random() * 700.0).toFixed(0));

    params.travelRate = parseFloat((0.1 + Math.random() * 0.3).toFixed(3));
    params.mirrorSpeed = parseFloat((0.02 + Math.random() * 0.08).toFixed(3));

    params.colorScheme = "Custom";
    params.animationPreset = "Custom";

    uniforms.uLightColor.value.set(
        params.lightColor.r,
        params.lightColor.g,
        params.lightColor.b
    );
    updateSpectralPhase();
    uniforms.uLightIntensity.value = params.lightIntensity;
    uniforms.uOutputScale.value = params.outputScale;

    uniforms.uPrimaryPeriod.value = params.primaryPeriod;
    uniforms.uPrimaryOffset.value = params.primaryOffset;
    uniforms.uSecondaryPeriod.value = params.secondaryPeriod;
    uniforms.uSecondaryOffset.value = params.secondaryOffset;
    uniforms.uDetailScale.value = params.detailScale;
    uniforms.uDetailAmount.value = params.detailAmount;
    uniforms.uVerticalOffset.value = params.verticalOffset;
    uniforms.uAngularPeriod.value = params.angularPeriod;
    uniforms.uAngularHalfPeriod.value = params.angularHalfPeriod;

    updateMirrorPhase();
    uniforms.uTravelRate.value = params.travelRate;
    uniforms.uMirrorSpeed.value = params.mirrorSpeed;

    updateAllControllers(gui);
}

function bindNumber(
    folder,
    property,
    uniform,
    min,
    max,
    step,
    label,
    onCustomChange
)
{
    return folder
        .add(
            params,
            property,
            min,
            max,
            step
        )
        .name(label)
        .onChange(
            value => {
                if (uniform && uniforms[uniform])
                {
                    uniforms[uniform].value = value;
                }
                if (onCustomChange)
                {
                    onCustomChange(value);
                }
            }
        );
}


// ============================================================
// Initialize GUI
// ============================================================

const gui = new GUI({ title: "Inside Quantum Core" });


// Presets folder
const presetsFolder = gui.addFolder("Presets");

presetsFolder
    .add(
        params,
        "colorScheme",
        [
            "Cyan & Amber Flux",
            "Cyber Neon",
            "Solar Flare",
            "Emerald Matrix",
            "Astral Amethyst",
            "Custom"
        ]
    )
    .name("Color Scheme")
    .onChange(value => {
        if (value !== "Custom")
        {
            applyColorPreset(value);
        }
    });

presetsFolder
    .add(
        params,
        "animationPreset",
        [
            "Cosmic Voyage",
            "Hyperspace Glide",
            "Quantum Pulsation",
            "Abyssal Slumber",
            "Static Architecture",
            "Custom"
        ]
    )
    .name("Animation")
    .onChange(value => {
        if (value !== "Custom")
        {
            applyAnimationPreset(value);
        }
    });


// Scene & Display folder
const displayFolder = gui.addFolder("Scene & Display");

displayFolder
    .add(params, "greenscreen")
    .name("Greenscreen (#00ff00)")
    .onChange(val => {
        uniforms.uGreenScreen.value = val;
        document.body.style.background = val ? "#00ff00" : "#000000";
        renderer.setClearColor(val ? 0x00ff00 : 0x000000, 1);
    });

displayFolder
    .add(params, "clickRandomize")
    .name("Click to Randomize");

displayFolder
    .add(params, "speed", 0.0, 5.0, 0.01)
    .name("Animation Speed")
    .onChange(() => {
        params.animationPreset = "Custom";
        updateAllControllers(gui);
    });

displayFolder
    .add(params, "dpr", 0.5, 3.0, 0.1)
    .name("DPR (Pixel Ratio)")
    .onChange(resize);

displayFolder
    .add(params, "zoom", 0.05, 10.0, 0.01)
    .name("Zoom")
    .onChange(val => {
        uniforms.uZoom.value = val;
    });

displayFolder
    .add(params, "offsetX", -2000, 2000, 1)
    .name("Offset X")
    .onChange(val => {
        uniforms.uOffset.value.x = val;
    });

displayFolder
    .add(params, "offsetY", -2000, 2000, 1)
    .name("Offset Y")
    .onChange(val => {
        uniforms.uOffset.value.y = val;
    });

displayFolder
    .add({
        resetView: () => {
            params.zoom = 1.0;
            params.offsetX = 0.0;
            params.offsetY = 0.0;
            uniforms.uZoom.value = 1.0;
            uniforms.uOffset.value.set(0.0, 0.0);
            updateAllControllers(gui);
        }
    }, "resetView")
    .name("Reset View");


// Camera folder
const cameraFolder = gui.addFolder("Camera");

bindNumber(cameraFolder, "cameraFadeNear", "uCameraFadeNear", 0.0, 5.0, 0.01, "Fade Near");
bindNumber(cameraFolder, "cameraFadeFar", "uCameraFadeFar", 0.01, 10.0, 0.01, "Fade Far");
bindNumber(cameraFolder, "startDepth", "uStartDepth", 0.01, 10.0, 0.01, "Start Depth");


// Animation folder
const animationFolder = gui.addFolder("Motion");

bindNumber(
    animationFolder,
    "travelRate",
    "uTravelRate",
    -2.0,
    2.0,
    0.001,
    "Travel Rate",
    () => {
        params.animationPreset = "Custom";
        updateAllControllers(gui);
    }
);

bindNumber(
    animationFolder,
    "mirrorSpeed",
    "uMirrorSpeed",
    0.0,
    1.0,
    0.001,
    "Mirror Speed",
    () => {
        params.animationPreset = "Custom";
        updateAllControllers(gui);
    }
);


// Geometry folder
const geometryFolder = gui.addFolder("Geometry");

bindNumber(geometryFolder, "primaryPeriod", "uPrimaryPeriod", 0.1, 40.0, 0.01, "Primary Period");
bindNumber(geometryFolder, "primaryOffset", "uPrimaryOffset", -20.0, 20.0, 0.01, "Primary Offset");
bindNumber(geometryFolder, "secondaryPeriod", "uSecondaryPeriod", 0.1, 30.0, 0.01, "Secondary Period");
bindNumber(geometryFolder, "secondaryOffset", "uSecondaryOffset", -15.0, 15.0, 0.01, "Secondary Offset");
bindNumber(geometryFolder, "detailScale", "uDetailScale", 0.1, 60.0, 0.1, "Detail Scale");
bindNumber(geometryFolder, "detailAmount", "uDetailAmount", 0.05, 6.0, 0.01, "Detail Amount");
bindNumber(geometryFolder, "verticalOffset", "uVerticalOffset", -30.0, 30.0, 0.01, "Vertical Offset");
bindNumber(geometryFolder, "angularPeriod", "uAngularPeriod", 0.05, 2.0, 0.001, "Angular Period");
bindNumber(geometryFolder, "angularHalfPeriod", "uAngularHalfPeriod", 0.0, 1.0, 0.001, "Angular Half Period");


// Material folder
const materialFolder = gui.addFolder("Material");

bindNumber(materialFolder, "traceFactor", "uTraceFactor", 0.001, 1.0, 0.001, "Trace Factor");
bindNumber(materialFolder, "lightIntensity", "uLightIntensity", 0.0, 10.0, 0.01, "Light Intensity", () => {
    params.colorScheme = "Custom";
    updateAllControllers(gui);
});
bindNumber(materialFolder, "outputScale", "uOutputScale", 50.0, 3000.0, 1.0, "Output Scale", () => {
    params.colorScheme = "Custom";
    updateAllControllers(gui);
});


// Colors folder
const colorsFolder = gui.addFolder("Colors");

colorsFolder
    .addColor(params, "lightColor")
    .name("Light Color")
    .onChange(value => {
        uniforms.uLightColor.value.set(
            value.r,
            value.g,
            value.b
        );
        params.colorScheme = "Custom";
        updateAllControllers(gui);
    });


// Spectral folder
const spectralFolder = gui.addFolder("Spectral");

spectralFolder
    .add(params, "spectralPhaseR", -6.283, 6.283, 0.001)
    .name("Phase R")
    .onChange(() => {
        updateSpectralPhase();
        params.colorScheme = "Custom";
        updateAllControllers(gui);
    });

spectralFolder
    .add(params, "spectralPhaseG", -6.283, 6.283, 0.001)
    .name("Phase G")
    .onChange(() => {
        updateSpectralPhase();
        params.colorScheme = "Custom";
        updateAllControllers(gui);
    });

spectralFolder
    .add(params, "spectralPhaseB", -6.283, 6.283, 0.001)
    .name("Phase B")
    .onChange(() => {
        updateSpectralPhase();
        params.colorScheme = "Custom";
        updateAllControllers(gui);
    });


// Mirror folder
const mirrorFolder = gui.addFolder("Mirror");

mirrorFolder
    .add(params, "mirrorPhaseX", -3.2, 3.2, 0.001)
    .name("Phase X")
    .onChange(updateMirrorPhase);

mirrorFolder
    .add(params, "mirrorPhaseY", -3.2, 3.2, 0.001)
    .name("Phase Y")
    .onChange(updateMirrorPhase);

mirrorFolder
    .add(params, "mirrorPhaseZ", -3.2, 3.2, 0.001)
    .name("Phase Z")
    .onChange(updateMirrorPhase);


// Performance folder
const performanceFolder = gui.addFolder("Performance");

performanceFolder
    .add(params, "traceSteps", 1, 128, 1)
    .name("Trace Steps")
    .onChange(value => {
        uniforms.uTraceSteps.value = Math.round(value);
    });

performanceFolder
    .add(params, "foldSteps", 0, 8, 1)
    .name("Fold Steps")
    .onChange(value => {
        uniforms.uFoldSteps.value = Math.round(value);
    });

gui.close();


// ============================================================
// Interactive Dragging, Wheel Zoom & Scene Click
// ============================================================

let isPointerDown = false;
let startPointerX = 0;
let startPointerY = 0;
let pointerDragDistance = 0;

window.addEventListener(
    "pointerdown",
    e => {
        if (e.target.closest && e.target.closest(".lil-gui")) return;

        isPointerDown = true;
        startPointerX = e.clientX;
        startPointerY = e.clientY;
        pointerDragDistance = 0;
    }
);

window.addEventListener(
    "pointermove",
    e => {
        if (!isPointerDown) return;

        const dx = e.clientX - startPointerX;
        const dy = e.clientY - startPointerY;

        startPointerX = e.clientX;
        startPointerY = e.clientY;

        pointerDragDistance += Math.hypot(dx, dy);

        params.offsetX += dx * params.dpr;
        params.offsetY -= dy * params.dpr;

        uniforms.uOffset.value.set(
            params.offsetX,
            params.offsetY
        );

        updateAllControllers(gui);
    }
);

window.addEventListener(
    "pointerup",
    e => {
        if (!isPointerDown) return;
        isPointerDown = false;

        if (e.target.closest && e.target.closest(".lil-gui")) return;

        if (pointerDragDistance < 5 && params.clickRandomize)
        {
            randomizeParameters();
        }
    }
);

window.addEventListener(
    "wheel",
    e => {
        if (e.target.closest && e.target.closest(".lil-gui")) return;

        e.preventDefault();
        const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
        params.zoom = Math.min(
            Math.max(params.zoom * zoomFactor, 0.05),
            10.0
        );

        uniforms.uZoom.value = params.zoom;
        updateAllControllers(gui);
    },
    { passive: false }
);


// ============================================================
// UI Toggle (H Key)
// ============================================================

let isGuiVisible = true;

window.addEventListener("keydown", e => {
    if (e.key === "h" || e.key === "H")
    {
        isGuiVisible = !isGuiVisible;
        gui.show(isGuiVisible);
    }
});


// ============================================================
// Animation Loop
// ============================================================

let elapsedTime = 0;
let previousTime = performance.now();

document.addEventListener(
    "visibilitychange",
    () => {
        previousTime = performance.now();
    }
);

renderer.setAnimationLoop(currentTime => {
    const deltaTime = Math.min(
        Math.max((currentTime - previousTime) * 0.001, 0),
        0.05
    );
    previousTime = currentTime;

    if (!document.hidden)
    {
        elapsedTime += deltaTime * params.speed;
    }

    uniforms.uTime.value = elapsedTime;

    renderer.render(scene, camera);
});

</script>
