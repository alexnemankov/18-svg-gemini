    // --- Mathematical Generators for Diwali Rangoli Motifs ---
    function generateMandalaPositions(symmetry, petalFreq, complexity, shapeType = 'Diwali Diyas & Flames') {
      const positions = new Float32Array(MANDALA_COUNT * 3);
      const radialDists = new Float32Array(MANDALA_COUNT);
      const layers = new Float32Array(MANDALA_COUNT);
      const phases = new Float32Array(MANDALA_COUNT);
      const sizes = new Float32Array(MANDALA_COUNT);

      let idx = 0;
      const goldenAngle = Math.PI * (3 - Math.sqrt(5));

      // Layer 0: Core Bindu (Warm glowing hearth / sacred central altar) ~7,000 points
      const countCore = 7000;
      for (let i = 0; i < countCore; i++) {
        const t = i / countCore;
        const r = Math.pow(t, 0.65) * 1.35;
        const theta = i * goldenAngle + (Math.random() - 0.5) * 0.08;
        const x = Math.cos(theta) * r;
        const z = Math.sin(theta) * r;
        const y = Math.exp(-r * 2.2) * 0.45 + (Math.random() - 0.5) * 0.04;

        positions[idx * 3] = x;
        positions[idx * 3 + 1] = y;
        positions[idx * 3 + 2] = z;

        radialDists[idx] = r / 10.5;
        layers[idx] = 0;
        phases[idx] = Math.random() * Math.PI * 2;
        sizes[idx] = 1.0 + Math.random() * 0.8;
        idx++;
      }

      // Layer 1: Inner Floral & Decorative Reservoir Tier (~15,000 points)
      const countL1 = 15000;
      for (let i = 0; i < countL1; i++) {
        const sector = Math.floor(Math.random() * symmetry);
        const baseAngle = (sector / symmetry) * Math.PI * 2;
        const localTheta = (Math.random() - 0.5) * (Math.PI / symmetry) * 1.95;
        const theta = baseAngle + localTheta;
        const u = Math.random();

        let r, x, z, y;
        if (shapeType === 'Diwali Diyas & Flames') {
          // Inner Diya oil reservoir petals with soft domed basin
          const cup = Math.cos(localTheta * symmetry * 0.5);
          r = 1.35 + (Math.pow(Math.max(0, cup), 1.6) * 1.9 + 0.1) * u;
          y = Math.sin(u * Math.PI) * 0.32;
        } else if (shapeType === 'Sacred Lotus (Padma)') {
          // Inner blooming lotus petals curving upward
          const petal = Math.pow(Math.max(0, Math.cos(localTheta * symmetry * 0.5)), 1.2);
          r = 1.3 + (petal * 2.1 + 0.15) * u;
          y = Math.sin(u * Math.PI) * 0.38;
        } else if (shapeType === 'Peacock Plumes (Mayur)') {
          // Fan-shaped crest feathers
          const plume = Math.cos(localTheta * symmetry * 0.5);
          r = 1.4 + (plume * 1.8 + 0.2) * u;
          y = Math.sin(theta * 3.0) * 0.18;
        } else if (shapeType === 'Mangal Kalash & Leaves') {
          // Kalash belly and vessel curves
          const pot = 1.0 + 0.35 * Math.sin(u * Math.PI);
          r = 1.3 + pot * u * 1.8;
          y = Math.cos(u * Math.PI) * 0.25;
        } else if (shapeType === 'Deepavali Chakra Star') {
          // 8-point geometric star core
          const star = 1.0 / (Math.abs(Math.cos(localTheta * symmetry)) + 0.35);
          r = 1.35 + Math.min(2.0, star * 0.7) * u;
          y = (Math.random() - 0.5) * 0.08;
        } else if (shapeType === 'Sikku Kolam Knotwork') {
          // Inner looping knot lemniscates
          const knot = Math.sin(theta * symmetry * 1.5) * 0.45;
          r = 1.8 + knot + (u - 0.5) * 0.5;
          y = Math.cos(theta * symmetry) * 0.12;
        } else if (shapeType === 'Marigold Toran Garland') {
          // Rosette flower petal clusters
          const flower = Math.cos(localTheta * symmetry * 2.0);
          r = 1.4 + (flower * 1.6 + 0.2) * u;
          y = Math.sin(u * Math.PI * 2) * 0.15;
        } else {
          // Classic Sacred Mandala
          const petalShape = Math.cos(localTheta * symmetry * 0.5);
          r = 1.35 + (Math.pow(petalShape, 1.4) * 1.85 + 0.15) * u;
          y = Math.sin(u * Math.PI) * 0.28;
        }

        x = Math.cos(theta) * r;
        z = Math.sin(theta) * r;

        positions[idx * 3] = x;
        positions[idx * 3 + 1] = y;
        positions[idx * 3 + 2] = z;

        radialDists[idx] = r / 10.5;
        layers[idx] = 1;
        phases[idx] = Math.random() * Math.PI * 2;
        sizes[idx] = 1.1 + Math.random() * 0.7;
        idx++;
      }

      // Layer 2: Mid Diwali Motifs (Diyas, Peacock Eyes, Kalash Mango Leaves, Star Rays) ~18,000 points
      const countL2 = 18000;
      for (let i = 0; i < countL2; i++) {
        const sector = Math.floor(Math.random() * symmetry);
        const baseAngle = (sector / symmetry) * Math.PI * 2;
        const localTheta = (Math.random() - 0.5) * (Math.PI / symmetry) * 1.9;
        const theta = baseAngle + localTheta;
        const u = Math.random();

        let r, x, z, y;
        if (shapeType === 'Diwali Diyas & Flames') {
          // Sculpted clay Diya lamp with nozzle & pointing flickering flame
          const diyaAngle = baseAngle;
          const isFlame = Math.random() > 0.42;
          if (isFlame) {
            // Pointed flame tip extending outward
            const flameLen = u * 1.55;
            r = 3.6 + flameLen;
            const flameWidth = Math.sin(u * Math.PI) * 0.32;
            const flameTheta = diyaAngle + (Math.random() - 0.5) * flameWidth;
            x = Math.cos(flameTheta) * r;
            z = Math.sin(flameTheta) * r;
            y = 0.25 + Math.sin(u * Math.PI) * 0.48; // elevated radiant flame!
          } else {
            // Clay lamp bowl
            r = 3.0 + u * 0.8;
            x = Math.cos(theta) * r;
            z = Math.sin(theta) * r;
            y = 0.05 + (Math.random() - 0.5) * 0.06;
          }
        } else if (shapeType === 'Sacred Lotus (Padma)') {
          // Tier 2 Lotus Petals with pointed cusps
          const petal = Math.pow(Math.max(0, Math.cos(localTheta * symmetry * 0.5)), 1.5);
          r = 3.2 + (petal * 2.3 + 0.2) * u;
          x = Math.cos(theta) * r;
          z = Math.sin(theta) * r;
          y = Math.sin(u * Math.PI) * 0.25;
        } else if (shapeType === 'Peacock Plumes (Mayur)') {
          // Peacock eyelet (Chandrika) & radiating barbs
          const eyeR = 4.2;
          const isEye = Math.random() > 0.45;
          if (isEye) {
            const ring = Math.random();
            const angle = Math.random() * Math.PI * 2;
            const eyeOffset = ring * 0.75;
            const centerX = Math.cos(baseAngle) * eyeR;
            const centerZ = Math.sin(baseAngle) * eyeR;
            x = centerX + Math.cos(angle) * eyeOffset;
            z = centerZ + Math.sin(angle) * eyeOffset;
            r = Math.sqrt(x * x + z * z);
            y = 0.15 * (1.0 - ring);
          } else {
            r = 2.8 + u * 2.4;
            const barbSweep = Math.sin((r - 2.8) * 1.2) * 0.25;
            const barbTheta = theta + barbSweep;
            x = Math.cos(barbTheta) * r;
            z = Math.sin(barbTheta) * r;
            y = 0.05;
          }
        } else if (shapeType === 'Mangal Kalash & Leaves') {
          // Radiating lanceolate mango leaves
          const leafShape = Math.sin(localTheta * symmetry * 0.5);
          r = 3.0 + (Math.abs(leafShape) * 2.2 + 0.3) * u;
          x = Math.cos(theta) * r;
          z = Math.sin(theta) * r;
          y = Math.sin(u * Math.PI) * 0.3;
        } else if (shapeType === 'Deepavali Chakra Star') {
          // 16-point geometric star rays
          const starRay = 0.7 * Math.cos(theta * symmetry * 2) + 0.3 * Math.sin(theta * symmetry);
          r = 3.3 + starRay * 1.5 + u * 0.7;
          x = Math.cos(theta) * r;
          z = Math.sin(theta) * r;
          y = Math.cos(theta * symmetry * 2) * 0.18;
        } else if (shapeType === 'Sikku Kolam Knotwork') {
          // Interlacing Sikku ribbon knot
          const knot = Math.sin(theta * symmetry) * Math.cos(theta * petalFreq * 2.0);
          r = 3.5 + knot * 1.3 + (u - 0.5) * 0.4;
          x = Math.cos(theta) * r;
          z = Math.sin(theta) * r;
          y = Math.sin(theta * symmetry * 2) * 0.15;
        } else if (shapeType === 'Marigold Toran Garland') {
          // Swag arches with flower clusters
          const swag = Math.pow(Math.sin(localTheta * symmetry * 0.5), 2.0);
          r = 3.2 + swag * 1.8 + (u - 0.5) * 0.45;
          x = Math.cos(theta) * r;
          z = Math.sin(theta) * r;
          y = Math.sin(theta * symmetry) * 0.15;
        } else {
          // Classic Sacred Mandala
          const starMod = 0.65 * Math.cos(theta * symmetry) + 0.35 * Math.sin(theta * symmetry * petalFreq);
          r = 3.2 + starMod * 1.1 + u * 0.85;
          x = Math.cos(theta) * r;
          z = Math.sin(theta) * r;
          y = Math.cos(theta * symmetry * 2) * 0.15;
        }

        positions[idx * 3] = x;
        positions[idx * 3 + 1] = y;
        positions[idx * 3 + 2] = z;

        radialDists[idx] = r / 10.5;
        layers[idx] = 2;
        phases[idx] = Math.random() * Math.PI * 2;
        sizes[idx] = 0.95 + Math.random() * 0.85;
        idx++;
      }

      // Layer 3: Concentric Beaded Chakra Rings & Pearl Garlands (~14,000 points)
      const countL3 = 14000;
      const numRings = 6;
      for (let i = 0; i < countL3; i++) {
        const ringId = i % numRings;
        const ringR = 5.2 + ringId * 0.55 * complexity;
        const theta = (i / (countL3 / numRings)) * Math.PI * 2 + (ringId % 2 === 0 ? 0 : Math.PI / symmetry);
        const wave = Math.sin(theta * symmetry * (shapeType.includes('Star') ? 4 : 3)) * 0.09;
        const r = ringR + wave;
        const x = Math.cos(theta) * r;
        const z = Math.sin(theta) * r;
        const y = Math.sin(theta * symmetry) * 0.12;

        positions[idx * 3] = x;
        positions[idx * 3 + 1] = y;
        positions[idx * 3 + 2] = z;

        radialDists[idx] = r / 10.5;
        layers[idx] = 3;
        phases[idx] = Math.random() * Math.PI * 2;
        sizes[idx] = 1.0 + Math.random() * 0.6;
        idx++;
      }

      // Layer 4: Outer Perimeter / Radiating Diyas / Toran Arch Tips (remainder to MANDALA_COUNT)
      const countL4 = MANDALA_COUNT - idx;
      for (let i = 0; i < countL4; i++) {
        const sector = Math.floor(Math.random() * symmetry);
        const baseAngle = (sector / symmetry) * Math.PI * 2;
        const localTheta = (Math.random() - 0.5) * (Math.PI / symmetry) * 1.85;
        const theta = baseAngle + localTheta;
        const u = Math.random();

        let r, x, z, y;
        if (shapeType === 'Diwali Diyas & Flames') {
          // Outer perimeter ring of glowing Diya lamps radiating outward
          const tip = Math.pow(Math.max(0, Math.cos(localTheta * symmetry * 0.5)), 2.0);
          r = 7.4 + tip * 2.6 * u;
          x = Math.cos(theta) * r;
          z = Math.sin(theta) * r;
          y = Math.sin(u * Math.PI) * 0.35; // rising outer flame tips!
        } else if (shapeType === 'Sacred Lotus (Padma)') {
          // Grand blooming outer lotus petals
          const petal = Math.pow(Math.max(0, Math.cos(localTheta * symmetry * 0.5)), 2.2);
          r = 7.2 + petal * 2.7 * complexity * u;
          x = Math.cos(theta) * r;
          z = Math.sin(theta) * r;
          y = Math.sin(u * Math.PI) * 0.22;
        } else if (shapeType === 'Peacock Plumes (Mayur)') {
          // Outer sweeping plume crests
          const plume = Math.pow(Math.max(0, Math.cos(localTheta * symmetry * 0.5)), 1.8);
          r = 7.3 + plume * 2.8 * u;
          x = Math.cos(theta) * r;
          z = Math.sin(theta) * r;
          y = Math.sin(u * Math.PI) * 0.2;
        } else if (shapeType === 'Mangal Kalash & Leaves') {
          // Auspicious perimeter Diya wreath
          const arch = Math.pow(Math.max(0, Math.cos(localTheta * symmetry * 0.5)), 2.0);
          r = 7.3 + arch * 2.6 * complexity * u;
          x = Math.cos(theta) * r;
          z = Math.sin(theta) * r;
          y = Math.sin(u * Math.PI) * 0.2;
        } else if (shapeType === 'Deepavali Chakra Star') {
          // Outer star finials & flame crown tips
          const starTip = Math.pow(Math.max(0, Math.cos(localTheta * symmetry)), 2.5);
          r = 7.2 + starTip * 2.8 * complexity * u;
          x = Math.cos(theta) * r;
          z = Math.sin(theta) * r;
          y = Math.sin(u * Math.PI) * 0.3;
        } else if (shapeType === 'Sikku Kolam Knotwork') {
          // Outer interlocking knot loop borders
          const loop = Math.abs(Math.sin(localTheta * symmetry));
          r = 7.4 + loop * 2.4 * u;
          x = Math.cos(theta) * r;
          z = Math.sin(theta) * r;
          y = Math.cos(theta * symmetry) * 0.15;
        } else if (shapeType === 'Marigold Toran Garland') {
          // Grand scalloped floral swag arches
          const arch = Math.pow(Math.sin(localTheta * symmetry * 0.5), 2.0);
          r = 7.2 + arch * 2.7 * complexity * u;
          x = Math.cos(theta) * r;
          z = Math.sin(theta) * r;
          y = Math.sin(u * Math.PI) * 0.2;
        } else {
          // Classic Sacred Mandala
          const tipEnvelope = Math.pow(Math.max(0, Math.cos(localTheta * symmetry * 0.5)), 2.2);
          r = 7.2 + tipEnvelope * (2.8 * complexity) * u;
          x = Math.cos(theta) * r;
          z = Math.sin(theta) * r;
          y = Math.sin(u * Math.PI) * 0.18;
        }

        positions[idx * 3] = x;
        positions[idx * 3 + 1] = y;
        positions[idx * 3 + 2] = z;

        radialDists[idx] = Math.min(1.0, r / 10.5);
        layers[idx] = 4;
        phases[idx] = Math.random() * Math.PI * 2;
        sizes[idx] = 1.1 + Math.random() * 0.9;
        idx++;
      }

      return { positions, radialDists, layers, phases, sizes };
    }

    // Generate dispersed cosmic galaxy spiral coordinates for mandala assembly & dissolution
    function generateDispersePositions() {
      const disperse = new Float32Array(MANDALA_COUNT * 3);
      for (let i = 0; i < MANDALA_COUNT; i++) {
        const r = 2.5 + Math.pow(Math.random(), 0.7) * 22.0;
        const theta = Math.random() * Math.PI * 2 + r * 0.65;
        const y = (Math.random() - 0.5) * 7.5 * (1.0 - r / 26.0);
        disperse[i * 3] = Math.cos(theta) * r;
        disperse[i * 3 + 1] = y;
        disperse[i * 3 + 2] = Math.sin(theta) * r;
      }
      return disperse;
    }

    // --- Mandala Geometry & Custom Shaders ---
    const initialMandalaData = generateMandalaPositions(params.symmetry, params.petalFreq, params.complexity, params.diwaliShape);
    const dispersePositions = generateDispersePositions();

    const mandalaGeometry = new THREE.BufferGeometry();
    mandalaGeometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(initialMandalaData.positions), 3));
    mandalaGeometry.setAttribute('aTargetA', new THREE.BufferAttribute(new Float32Array(initialMandalaData.positions), 3));
    mandalaGeometry.setAttribute('aTargetB', new THREE.BufferAttribute(new Float32Array(initialMandalaData.positions), 3));
    mandalaGeometry.setAttribute('aDisperse', new THREE.BufferAttribute(dispersePositions, 3));
    mandalaGeometry.setAttribute('aRadialDist', new THREE.BufferAttribute(initialMandalaData.radialDists, 1));
    mandalaGeometry.setAttribute('aLayer', new THREE.BufferAttribute(initialMandalaData.layers, 1));
    mandalaGeometry.setAttribute('aPhase', new THREE.BufferAttribute(initialMandalaData.phases, 1));
    mandalaGeometry.setAttribute('aSize', new THREE.BufferAttribute(initialMandalaData.sizes, 1));

    const mandalaMaterial = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0.0 },
        uAssemble: { value: 1.0 },
        uMorph: { value: 0.0 },
        uPixelRatio: { value: params.dpr },
        uSizeMultiplier: { value: params.particleSize },
        uWaveIntensity: { value: params.waveIntensity },
        uShimmerSpeed: { value: params.shimmerSpeed },
        uColorCore: { value: new THREE.Color(params.colorCore) },
        uColorMid: { value: new THREE.Color(params.colorMid) },
        uColorOuter: { value: new THREE.Color(params.colorOuter) },
        uColorAccent: { value: new THREE.Color(params.colorAccent) },
        uLightIntensity: { value: params.globalLight },
        uExposure: { value: params.exposure }
      },
      vertexShader: `
        uniform float uTime;
        uniform float uAssemble;
        uniform float uMorph;
        uniform float uPixelRatio;
        uniform float uSizeMultiplier;
        uniform float uWaveIntensity;
        uniform float uShimmerSpeed;

        attribute vec3 aTargetA;
        attribute vec3 aTargetB;
        attribute vec3 aDisperse;
        attribute float aRadialDist;
        attribute float aLayer;
        attribute float aPhase;
        attribute float aSize;

        varying vec3 vColor;
        varying float vAlpha;
        varying float vRadialDist;

        uniform vec3 uColorCore;
        uniform vec3 uColorMid;
        uniform vec3 uColorOuter;
        uniform vec3 uColorAccent;
        uniform float uLightIntensity;
        uniform float uExposure;

        void main() {
          vRadialDist = aRadialDist;

          // Smooth geometric morphing between Target A and Target B
          vec3 assembled = mix(aTargetA, aTargetB, uMorph);

          // Subtle organic breathing & undulating harmonics
          float breathe = 1.0 + sin(uTime * 1.3 - aRadialDist * 3.14159) * 0.035;
          assembled.xz *= breathe;
          assembled.y += sin(uTime * 2.2 + aRadialDist * 6.28318 + aPhase) * (0.13 * uWaveIntensity);

          // Assembly with radial crystallization ripple
          float delay = aRadialDist * 0.45;
          float localAssemble = clamp((uAssemble - delay) / (1.0 - delay + 0.0001), 0.0, 1.0);
          localAssemble = smoothstep(0.0, 1.0, localAssemble);

          vec3 pos = mix(aDisperse, assembled, localAssemble);

          // Twinkling & shimmering phase
          float shimmer = sin(uTime * (3.0 * uShimmerSpeed) + aPhase * 10.0) * 0.3 + 0.7;

          // Dynamic radial color palette
          vec3 col;
          if (aRadialDist < 0.25) {
            float t = aRadialDist / 0.25;
            col = mix(uColorCore, uColorMid, smoothstep(0.0, 1.0, t));
          } else if (aRadialDist < 0.65) {
            float t = (aRadialDist - 0.25) / 0.40;
            col = mix(uColorMid, uColorOuter, smoothstep(0.0, 1.0, t));
          } else {
            float t = (aRadialDist - 0.65) / 0.35;
            col = mix(uColorOuter, uColorAccent, smoothstep(0.0, 1.0, t));
          }

          // Subtle harmonic chromatic wave across rings
          float chromWave = sin(uTime * 0.7 + aRadialDist * 4.8) * 0.15;
          col = mix(col, uColorAccent, clamp(chromWave, 0.0, 0.28));

          // Center points glow brighter and warmer
          float centerRadiance = 1.0 + pow(max(0.0, 1.0 - aRadialDist), 1.8) * 1.7;
          vColor = col * centerRadiance * shimmer;

          vAlpha = mix(0.35, 1.0, localAssemble);

          vec4 mvPos = modelViewMatrix * vec4(pos, 1.0);
          gl_Position = projectionMatrix * mvPos;

          float pSize = aSize * (1.15 + (1.0 - aRadialDist) * 0.85) * shimmer;
          gl_PointSize = pSize * uPixelRatio * uSizeMultiplier * (145.0 / -mvPos.z);
          gl_PointSize = clamp(gl_PointSize, 1.0, 64.0);
        }
      `,
      fragmentShader: `
        varying vec3 vColor;
        varying float vAlpha;
        varying float vRadialDist;

        uniform float uLightIntensity;
        uniform float uExposure;

        void main() {
          vec2 coord = gl_PointCoord - vec2(0.5);
          float d = length(coord);
          if (d > 0.5) discard;

          float core = exp(-d * 14.0);
          float halo = exp(-d * 3.8);
          float glow = core * 0.85 + halo * 0.35;

          vec3 finalColor = vColor * (core * 1.5 + halo * 0.9) * uLightIntensity * uExposure;
          gl_FragColor = vec4(finalColor, glow * vAlpha);
        }
      `,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const mandalaPoints = new THREE.Points(mandalaGeometry, mandalaMaterial);
    scene.add(mandalaPoints);

    // --- Floating Embers / Sparks (Detaching from pattern and drifting upwards) ---
    const emberGeometry = new THREE.BufferGeometry();
    const emberPositions = new Float32Array(EMBER_COUNT * 3);
    const emberOrigins = new Float32Array(EMBER_COUNT * 3);
    const emberPhases = new Float32Array(EMBER_COUNT);
    const emberSpeeds = new Float32Array(EMBER_COUNT);
    const emberSizes = new Float32Array(EMBER_COUNT);

    for (let i = 0; i < EMBER_COUNT; i++) {
      const r = Math.pow(Math.random(), 0.6) * 9.5;
      const theta = Math.random() * Math.PI * 2;
      const x = Math.cos(theta) * r;
      const z = Math.sin(theta) * r;
      const y = (Math.random() - 0.5) * 0.2;

      emberOrigins[i * 3] = x;
      emberOrigins[i * 3 + 1] = y;
      emberOrigins[i * 3 + 2] = z;

      emberPositions[i * 3] = x;
      emberPositions[i * 3 + 1] = y + Math.random() * 8.0;
      emberPositions[i * 3 + 2] = z;

      emberPhases[i] = Math.random() * Math.PI * 2;
      emberSpeeds[i] = 0.4 + Math.random() * 0.9;
      emberSizes[i] = 1.0 + Math.random() * 1.5;
    }

    emberGeometry.setAttribute('position', new THREE.BufferAttribute(emberPositions, 3));
    emberGeometry.setAttribute('aOrigin', new THREE.BufferAttribute(emberOrigins, 3));
    emberGeometry.setAttribute('aPhase', new THREE.BufferAttribute(emberPhases, 1));
    emberGeometry.setAttribute('aSpeed', new THREE.BufferAttribute(emberSpeeds, 1));
    emberGeometry.setAttribute('aSize', new THREE.BufferAttribute(emberSizes, 1));

    const emberMaterial = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0.0 },
        uPixelRatio: { value: params.dpr },
        uEmberSpeed: { value: params.emberSpeed },
        uColorCore: { value: new THREE.Color(params.colorCore) },
        uColorAccent: { value: new THREE.Color(params.colorAccent) },
        uLightIntensity: { value: params.globalLight },
        uExposure: { value: params.exposure }
      },
      vertexShader: `
        uniform float uTime;
        uniform float uPixelRatio;
        uniform float uEmberSpeed;
        uniform vec3 uColorCore;
        uniform vec3 uColorAccent;
        uniform float uLightIntensity;
        uniform float uExposure;

        attribute vec3 aOrigin;
        attribute float aPhase;
        attribute float aSpeed;
        attribute float aSize;

        varying vec3 vColor;
        varying float vAlpha;

        void main() {
          float maxHeight = 8.5;
          float t = uTime * 0.45 * aSpeed * uEmberSpeed + aPhase;
          float yOffset = mod(t, maxHeight);

          float swirlRadius = 0.25 + (yOffset / maxHeight) * 0.9;
          float angle = aPhase + yOffset * 1.2;
          vec3 pos = aOrigin;
          pos.x += cos(angle) * swirlRadius;
          pos.z += sin(angle) * swirlRadius;
          pos.y += yOffset;

          float life = yOffset / maxHeight;
          float alpha = smoothstep(0.0, 0.12, life) * (1.0 - smoothstep(0.68, 1.0, life));

          vec3 col = mix(uColorCore, uColorAccent, smoothstep(0.1, 0.75, life));
          float shimmer = sin(uTime * 4.0 + aPhase * 8.0) * 0.35 + 0.65;

          vColor = col * shimmer * 1.8;
          vAlpha = alpha * 0.85;

          vec4 mvPos = modelViewMatrix * vec4(pos, 1.0);
          gl_Position = projectionMatrix * mvPos;

          gl_PointSize = aSize * shimmer * uPixelRatio * (120.0 / -mvPos.z);
          gl_PointSize = clamp(gl_PointSize, 1.0, 48.0);
        }
      `,
      fragmentShader: `
        varying vec3 vColor;
        varying float vAlpha;
        uniform float uLightIntensity;
        uniform float uExposure;

        void main() {
          vec2 coord = gl_PointCoord - vec2(0.5);
          float d = length(coord);
          if (d > 0.5) discard;

          float core = exp(-d * 12.0);
          float halo = exp(-d * 3.5);
          float glow = core * 0.8 + halo * 0.3;

          vec3 finalColor = vColor * (core * 1.4 + halo * 0.8) * uLightIntensity * uExposure;
          gl_FragColor = vec4(finalColor, glow * vAlpha);
        }
      `,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const emberPoints = new THREE.Points(emberGeometry, emberMaterial);
    scene.add(emberPoints);

    // --- Volumetric Atmospheric Haze / Mist ---
    const hazeGeometry = new THREE.BufferGeometry();
    const hazePositions = new Float32Array(HAZE_COUNT * 3);
    const hazeSizes = new Float32Array(HAZE_COUNT);
    const hazePhases = new Float32Array(HAZE_COUNT);

    for (let i = 0; i < HAZE_COUNT; i++) {
      const r = 0.5 + Math.pow(Math.random(), 0.85) * 10.0;
      const theta = Math.random() * Math.PI * 2;
      hazePositions[i * 3] = Math.cos(theta) * r;
      hazePositions[i * 3 + 1] = (Math.random() - 0.4) * 1.8;
      hazePositions[i * 3 + 2] = Math.sin(theta) * r;

      hazeSizes[i] = 25.0 + Math.random() * 45.0;
      hazePhases[i] = Math.random() * Math.PI * 2;
    }

    hazeGeometry.setAttribute('position', new THREE.BufferAttribute(hazePositions, 3));
    hazeGeometry.setAttribute('aSize', new THREE.BufferAttribute(hazeSizes, 1));
    hazeGeometry.setAttribute('aPhase', new THREE.BufferAttribute(hazePhases, 1));

    const hazeMaterial = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0.0 },
        uPixelRatio: { value: params.dpr },
        uColorHaze: { value: new THREE.Color(params.colorHaze) },
        uColorMid: { value: new THREE.Color(params.colorMid) },
        uLightIntensity: { value: params.globalLight },
        uExposure: { value: params.exposure }
      },
      vertexShader: `
        uniform float uTime;
        uniform float uPixelRatio;
        attribute float aSize;
        attribute float aPhase;
        varying vec2 vUv;
        varying float vAlpha;

        void main() {
          vec3 pos = position;
          float angle = aPhase + uTime * 0.06;
          pos.x += cos(angle) * 0.35;
          pos.z += sin(angle) * 0.35;
          pos.y += sin(uTime * 0.2 + aPhase) * 0.2;

          vec4 mvPos = modelViewMatrix * vec4(pos, 1.0);
          gl_Position = projectionMatrix * mvPos;

          vAlpha = 0.045 + sin(uTime * 0.3 + aPhase) * 0.015;
          gl_PointSize = aSize * uPixelRatio * (160.0 / -mvPos.z);
          gl_PointSize = clamp(gl_PointSize, 8.0, 180.0);
        }
      `,
      fragmentShader: `
        uniform vec3 uColorHaze;
        uniform vec3 uColorMid;
        uniform float uLightIntensity;
        uniform float uExposure;
        varying float vAlpha;

        void main() {
          vec2 coord = gl_PointCoord - vec2(0.5);
          float d = length(coord);
          if (d > 0.5) discard;

          float softMist = smoothstep(0.5, 0.0, d);
          vec3 col = mix(uColorHaze, uColorMid, 0.35);
          vec3 finalColor = col * uLightIntensity * uExposure;

          gl_FragColor = vec4(finalColor, softMist * vAlpha);
        }
      `,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const hazePoints = new THREE.Points(hazeGeometry, hazeMaterial);
    scene.add(hazePoints);

    // --- Renderer Initialization & Antialias Setting Support ---
    function initRenderer(antialias) {
      if (renderer) {
        const oldDom = renderer.domElement;
        renderer.dispose();
        if (oldDom && oldDom.parentNode) {
          oldDom.parentNode.removeChild(oldDom);
        }
      }

      renderer = new THREE.WebGLRenderer({
        antialias: antialias,
        powerPreference: 'high-performance'
      });

      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(params.dpr);

      if (params.greenscreen) {
        scene.background = new THREE.Color(0x00ff00);
        renderer.setClearColor(0x00ff00, 1.0);
      } else {
        scene.background = new THREE.Color(params.bgColor);
        renderer.setClearColor(params.bgColor, 1.0);
      }

      container.appendChild(renderer.domElement);

      // Re-link OrbitControls
      if (controls) controls.dispose();
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.screenSpacePanning = true; // Allows smooth dragging across the screen
      controls.minDistance = 2.0;
      controls.maxDistance = 65.0;

      // Initialize or update PostProcessor Suite (Anamorphic default is strictly OFF!)
      if (!postProcessor) {
        postProcessor = new PostProcessor(renderer, {
          enabled: true,
          antialias: antialias,
          bloomEnabled: true,
          bloomStrength: 1.15,
          bloomRadius: 0.55,
          bloomThreshold: 0.18,
          raysEnabled: true,
          raysStrength: 0.75,
          raysThreshold: 0.14,
          raysColorHex: params.colorCore,
          anamorphicEnabled: false, // Default is strictly OFF
          chromaticAberration: 0.012,
          vignetteBoost: 1.1,
          vignetteReduction: 0.7,
          noiseIntensity: 0.01
        });
      } else {
        postProcessor.renderer = renderer;
        postProcessor.setAntialias(antialias);
      }
      postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);

      setupInteractionEvents(renderer.domElement);
    }

    // --- Responsive Framing for Landscape and Portrait Formats ---
    function handleResize() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      const aspect = width / height;

      camera.aspect = aspect;

      if (aspect < 1.0) {
        camera.fov = Math.min(80, 52 / aspect);
      } else {
        camera.fov = 50;
      }
      camera.updateProjectionMatrix();

      renderer.setSize(width, height);
      if (postProcessor) {
        postProcessor.setSize(width, height, params.dpr);
      }
      mandalaMaterial.uniforms.uPixelRatio.value = params.dpr;
      emberMaterial.uniforms.uPixelRatio.value = params.dpr;
      hazeMaterial.uniforms.uPixelRatio.value = params.dpr;
    }

    window.addEventListener('resize', handleResize);

    // --- Color Scheme Application (with smooth GSAP transition) ---
    function applyColorScheme(schemeName, duration = 1.2) {
      const scheme = COLOR_SCHEMES[schemeName];
      if (!scheme) return;

      params.colorScheme = schemeName;
      params.colorCore = scheme.core;
      params.colorMid = scheme.mid;
      params.colorOuter = scheme.outer;
      params.colorAccent = scheme.accent;
      params.colorHaze = scheme.haze;
      params.bgColor = scheme.bg;

      if (!params.greenscreen) {
        gsap.to(scene.background, {
          r: new THREE.Color(scheme.bg).r,
          g: new THREE.Color(scheme.bg).g,
          b: new THREE.Color(scheme.bg).b,
          duration: duration,
          ease: 'power2.out'
        });
      }

      gsap.to(mandalaMaterial.uniforms.uColorCore.value, {
        r: new THREE.Color(scheme.core).r,
        g: new THREE.Color(scheme.core).g,
        b: new THREE.Color(scheme.core).b,
        duration: duration,
        ease: 'power2.out'
      });
      gsap.to(mandalaMaterial.uniforms.uColorMid.value, {
        r: new THREE.Color(scheme.mid).r,
        g: new THREE.Color(scheme.mid).g,
        b: new THREE.Color(scheme.mid).b,
        duration: duration,
        ease: 'power2.out'
      });
      gsap.to(mandalaMaterial.uniforms.uColorOuter.value, {
        r: new THREE.Color(scheme.outer).r,
        g: new THREE.Color(scheme.outer).g,
        b: new THREE.Color(scheme.outer).b,
        duration: duration,
        ease: 'power2.out'
      });
      gsap.to(mandalaMaterial.uniforms.uColorAccent.value, {
        r: new THREE.Color(scheme.accent).r,
        g: new THREE.Color(scheme.accent).g,
        b: new THREE.Color(scheme.accent).b,
        duration: duration,
        ease: 'power2.out'
      });

      gsap.to(emberMaterial.uniforms.uColorCore.value, {
        r: new THREE.Color(scheme.core).r,
        g: new THREE.Color(scheme.core).g,
        b: new THREE.Color(scheme.core).b,
        duration: duration,
        ease: 'power2.out'
      });
      gsap.to(emberMaterial.uniforms.uColorAccent.value, {
        r: new THREE.Color(scheme.accent).r,
        g: new THREE.Color(scheme.accent).g,
        b: new THREE.Color(scheme.accent).b,
        duration: duration,
        ease: 'power2.out'
      });

      gsap.to(hazeMaterial.uniforms.uColorHaze.value, {
        r: new THREE.Color(scheme.haze).r,
        g: new THREE.Color(scheme.haze).g,
        b: new THREE.Color(scheme.haze).b,
        duration: duration,
        ease: 'power2.out'
      });
      gsap.to(hazeMaterial.uniforms.uColorMid.value, {
        r: new THREE.Color(scheme.mid).r,
        g: new THREE.Color(scheme.mid).g,
        b: new THREE.Color(scheme.mid).b,
        duration: duration,
        ease: 'power2.out'
      });

      // Update light source colors
      gsap.to(coreLight.color, {
        r: new THREE.Color(scheme.core).r,
        g: new THREE.Color(scheme.core).g,
        b: new THREE.Color(scheme.core).b,
        duration: duration
      });
      gsap.to(ambientLight.color, {
        r: new THREE.Color(scheme.haze).r,
        g: new THREE.Color(scheme.haze).g,
        b: new THREE.Color(scheme.haze).b,
        duration: duration
      });
      gsap.to(celestialLight.color, {
        r: new THREE.Color(scheme.accent).r,
        g: new THREE.Color(scheme.accent).g,
        b: new THREE.Color(scheme.accent).b,
        duration: duration
      });

      updateGuiDisplays();
    }

    // --- Seamless Geometric Morphing Transition ---
    let isMorphing = false;
    function morphToNewGeometry(symmetry, petalFreq, complexity, shapeType = params.diwaliShape, duration = 1.8) {
      if (isMorphing) return;
      isMorphing = true;

      const newData = generateMandalaPositions(symmetry, petalFreq, complexity, shapeType);

      const targetA = mandalaGeometry.attributes.aTargetA.array;
      const targetB = mandalaGeometry.attributes.aTargetB.array;
      const currentPositions = mandalaGeometry.attributes.position.array;

      for (let i = 0; i < currentPositions.length; i++) {
        targetA[i] = targetB[i];
        targetB[i] = newData.positions[i];
      }

      mandalaGeometry.attributes.aTargetA.needsUpdate = true;
      mandalaGeometry.attributes.aTargetB.needsUpdate = true;

      mandalaGeometry.attributes.aRadialDist.copyArray(newData.radialDists);
      mandalaGeometry.attributes.aRadialDist.needsUpdate = true;
      mandalaGeometry.attributes.aSize.copyArray(newData.sizes);
      mandalaGeometry.attributes.aSize.needsUpdate = true;

      mandalaMaterial.uniforms.uMorph.value = 0.0;
      gsap.to(mandalaMaterial.uniforms.uMorph, {
        value: 1.0,
        duration: duration,
        ease: 'power2.inOut',
        onComplete: () => {
          isMorphing = false;
        }
      });
    }

    // --- Procedural Scene Randomizer (on Scene Click or GUI Button) ---
    // IMPORTANT: Post-processing settings are strictly preserved and NEVER shuffled!
    function triggerProceduralVariation() {
      // 1. Pick a random color scheme from 19 schemes
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      applyColorScheme(randomScheme, 1.4);

      // 2. Re-roll Diwali shape & sacred geometry parameters
      const diwaliShapes = DIWALI_SHAPES;
      params.diwaliShape = diwaliShapes[Math.floor(Math.random() * diwaliShapes.length)];

      const symmetries = [6, 8, 10, 12, 14, 16];
      params.symmetry = symmetries[Math.floor(Math.random() * symmetries.length)];
      params.petalFreq = 1 + Math.floor(Math.random() * 4);
      params.complexity = 0.75 + Math.random() * 0.55;
      params.particleSize = 1.1 + Math.random() * 0.6;
      params.waveIntensity = 0.6 + Math.random() * 0.8;

      mandalaMaterial.uniforms.uSizeMultiplier.value = params.particleSize;
      mandalaMaterial.uniforms.uWaveIntensity.value = params.waveIntensity;

      // 3. Smoothly morph geometry into the new Diwali shape
      morphToNewGeometry(params.symmetry, params.petalFreq, params.complexity, params.diwaliShape, 1.8);

      // 4. Update UI controls (geometry & colors only, post-processing settings remain untouched!)
      updateGuiDisplays();
    }

    // --- Interaction Detection (Differentiate Click vs. Orbit Drag) ---
    let pointerDownPos = { x: 0, y: 0 };
    let pointerDownTime = 0;

    function setupInteractionEvents(domElement) {
      domElement.addEventListener('pointerdown', (e) => {
        pointerDownPos = { x: e.clientX, y: e.clientY };
        pointerDownTime = performance.now();
      });

      domElement.addEventListener('pointerup', (e) => {
        const dx = e.clientX - pointerDownPos.x;
        const dy = e.clientY - pointerDownPos.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const duration = performance.now() - pointerDownTime;

        if (dist < 5 && duration < 350) {
          if (params.randomizeOnClick) {
            triggerProceduralVariation();
          }
        }
      });
    }

    // --- lil-gui Control Panel Construction ---
    const gui = new GUI({ title: 'Ранголи из светящихся точек' });

    function updateGuiDisplays() {
      function traverse(g) {
        if (!g) return;
        // Skip refreshing post-processing folder during procedural scene shuffle
        if (g._title && g._title.includes('Пост-процессинг')) return;
        if (g.controllers) g.controllers.forEach(c => c.updateDisplay());
        if (g.folders) g.folders.forEach(f => traverse(f));
      }
      traverse(gui);
    }

    // 🎨 Color & Palettes Folder
    const fColor = gui.addFolder('🎨 Цветовая схема');
    fColor.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Пресет палитры').onChange(name => {
      applyColorScheme(name, 1.2);
    });
    fColor.add(params, 'greenscreen').name('Greenscreen (#00ff00)').onChange(val => {
      if (val) {
        scene.background = new THREE.Color(0x00ff00);
        renderer.setClearColor(0x00ff00, 1.0);
      } else {
        scene.background = new THREE.Color(params.bgColor);
        renderer.setClearColor(params.bgColor, 1.0);
      }
    });
    fColor.addColor(params, 'bgColor').name('Фон сцены').onChange(val => {
      if (!params.greenscreen) {
        scene.background.set(val);
        renderer.setClearColor(val, 1.0);
      }
    });
    fColor.addColor(params, 'colorCore').name('Цвет центра (Core)').onChange(val => {
      mandalaMaterial.uniforms.uColorCore.value.set(val);
      emberMaterial.uniforms.uColorCore.value.set(val);
      coreLight.color.set(val);
    });
    fColor.addColor(params, 'colorMid').name('Цвет узора (Mid)').onChange(val => {
      mandalaMaterial.uniforms.uColorMid.value.set(val);
      hazeMaterial.uniforms.uColorMid.value.set(val);
    });
    fColor.addColor(params, 'colorOuter').name('Цвет лепестков (Outer)').onChange(val => {
      mandalaMaterial.uniforms.uColorOuter.value.set(val);
    });
    fColor.addColor(params, 'colorAccent').name('Цвет искр (Accent)').onChange(val => {
      mandalaMaterial.uniforms.uColorAccent.value.set(val);
      emberMaterial.uniforms.uColorAccent.value.set(val);
      celestialLight.color.set(val);
    });
    fColor.addColor(params, 'colorHaze').name('Цвет дымки (Haze)').onChange(val => {
      hazeMaterial.uniforms.uColorHaze.value.set(val);
      ambientLight.color.set(val);
    });

    // 🕉 Mandala & Diwali Shapes Folder
    const fMandala = gui.addFolder('🕉 Узор и символы Дивали');
    fMandala.add(params, 'diwaliShape', DIWALI_SHAPES).name('Форма узора (Diwali)').onChange(val => {
      morphToNewGeometry(params.symmetry, params.petalFreq, params.complexity, val);
    });
    fMandala.add(params, 'symmetry', [6, 8, 10, 12, 14, 16]).name('Симметрия (Folds)').onChange(val => {
      morphToNewGeometry(parseInt(val), params.petalFreq, params.complexity, params.diwaliShape);
    });
    fMandala.add(params, 'petalFreq', 1, 5, 1).name('Частота лепестков').onChange(val => {
      morphToNewGeometry(params.symmetry, val, params.complexity, params.diwaliShape);
    });
    fMandala.add(params, 'complexity', 0.5, 1.8, 0.05).name('Сложность колец').onChange(val => {
      morphToNewGeometry(params.symmetry, params.petalFreq, val, params.diwaliShape);
    });
    fMandala.add(params, 'assembleFactor', 0.0, 1.0, 0.01).name('Сборка мандалы').onChange(val => {
      mandalaMaterial.uniforms.uAssemble.value = val;
    }).listen();
    fMandala.add(params, 'autoAssembleCycle').name('Авто-растворение / цикл');
    fMandala.add(params, 'particleSize', 0.5, 3.0, 0.05).name('Размер точек').onChange(val => {
      mandalaMaterial.uniforms.uSizeMultiplier.value = val;
    });
    fMandala.add(params, 'waveIntensity', 0.0, 2.5, 0.05).name('Волны глубины').onChange(val => {
      mandalaMaterial.uniforms.uWaveIntensity.value = val;
    });

    // 🎬 Animations & Camera Motion Folder
    const fAnim = gui.addFolder('🎬 Анимация и камера');
    fAnim.add(params, 'animationMode', ANIMATION_MODES).name('Режим анимации');
    fAnim.add(params, 'speed', 0.0, 3.0, 0.05).name('Скорость анимации');
    fAnim.add(params, 'emberSpeed', 0.1, 3.0, 0.05).name('Скорость искр').onChange(val => {
      emberMaterial.uniforms.uEmberSpeed.value = val;
    });

    // 💡 Lighting & Exposure Folder
    const fLight = gui.addFolder('💡 Свет и экспозиция');
    fLight.add(params, 'exposure', 0.2, 3.0, 0.05).name('Экспозиция (Exposure)').onChange(val => {
      if (postProcessor) {
        postProcessor.settings.exposure = val;
        postProcessor.updateSettings();
      }
      mandalaMaterial.uniforms.uExposure.value = val;
      emberMaterial.uniforms.uExposure.value = val;
      hazeMaterial.uniforms.uExposure.value = val;
    });
    fLight.add(params, 'globalLight', 0.1, 3.0, 0.05).name('Общая яркость').onChange(val => {
      mandalaMaterial.uniforms.uLightIntensity.value = val;
      emberMaterial.uniforms.uLightIntensity.value = val;
      hazeMaterial.uniforms.uLightIntensity.value = val;
    });
    // Core Point Light Controls
    fLight.add(params, 'coreLightIntensity', 0.0, 8.0, 0.1).name('Яркость центрального света').onChange(val => {
      coreLight.intensity = val;
    });
    fLight.add(params, 'coreLightDistance', 2.0, 35.0, 0.5).name('Радиус центр. света').onChange(val => {
      coreLight.distance = val;
    });
    fLight.addColor(params, 'coreLightColor').name('Цвет центр. света').onChange(val => {
      coreLight.color.set(val);
      if (postProcessor) {
        postProcessor.settings.raysColor.set(val);
        postProcessor.updateSettings();
      }
    });
    // Ambient Light Controls
    fLight.add(params, 'ambientIntensity', 0.0, 2.5, 0.05).name('Рассеянный свет (Ambient)').onChange(val => {
      ambientLight.intensity = val;
    });
    fLight.addColor(params, 'ambientColor').name('Цвет рассеянного света').onChange(val => {
      ambientLight.color.set(val);
    });
    // Celestial Light Controls
    fLight.add(params, 'celestialIntensity', 0.0, 4.0, 0.1).name('Верхний свет (Celestial)').onChange(val => {
      celestialLight.intensity = val;
    });
    fLight.addColor(params, 'celestialColor').name('Цвет верхнего света').onChange(val => {
      celestialLight.color.set(val);
    });
    fLight.add(params, 'celestialPosY', 4.0, 30.0, 0.5).name('Высота верхнего света').onChange(val => {
      celestialLight.position.y = val;
    });

    // ⚙️ Rendering & Settings Folder
    const fSettings = gui.addFolder('⚙️ Настройки и рендеринг');
    fSettings.add(params, 'dpr', 0.5, 3.0, 0.25).name('DPR (Pixel Ratio)').onChange(val => {
      renderer.setPixelRatio(val);
      if (postProcessor) {
        postProcessor.setSize(window.innerWidth, window.innerHeight, val);
      }
      mandalaMaterial.uniforms.uPixelRatio.value = val;
      emberMaterial.uniforms.uPixelRatio.value = val;
      hazeMaterial.uniforms.uPixelRatio.value = val;
    });
    fSettings.add(params, 'antialias').name('Three.js Antialias').onChange(val => {
      initRenderer(val);
    });
    fSettings.add(params, 'randomizeOnClick').name('Рандомизация по клику');
    fSettings.add({ randomize: triggerProceduralVariation }, 'randomize').name('🎲 Случайный узор');

    // Attach PostProcessor Suite to GUI
    initRenderer(params.antialias);
    postProcessor.attachGUI(gui, "✨ Пост-процессинг (Post-Processing)");

    // Toggle UI visibility with "H" key
    let isGuiVisible = true;
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        isGuiVisible = !isGuiVisible;
        if (isGuiVisible) {
          gui.show();
        } else {
          gui.hide();
        }
      }
    });

    handleResize();

    // --- Master Render & Animation Loop ---
    let clock = new THREE.Clock();
    let animTime = 0.0;
    let assembleTimer = 0.0;

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const scaledDelta = delta * params.speed;
      animTime += scaledDelta;

      // Update shader uniforms
      mandalaMaterial.uniforms.uTime.value = animTime;
      emberMaterial.uniforms.uTime.value = animTime;
      hazeMaterial.uniforms.uTime.value = animTime;

      // Auto Assembly / Dissolution Cycle
      if (params.autoAssembleCycle) {
        assembleTimer += scaledDelta;
        const cycleProgress = (assembleTimer % params.assembleCyclePeriod) / params.assembleCyclePeriod;
        const rawFactor = Math.sin(cycleProgress * Math.PI * 2);
        const assembleVal = THREE.MathUtils.clamp((rawFactor * 0.7 + 0.6), 0.0, 1.0);
        params.assembleFactor = THREE.MathUtils.lerp(params.assembleFactor, assembleVal, 0.05);
        mandalaMaterial.uniforms.uAssemble.value = params.assembleFactor;
      }

      // 1. Process user interactions (mouse wheel zoom, drag rotation, screen-space panning)
      controls.update();

      // 2. Camera Animation Modes with Strict Zoom & Angle Preservation:
      // - Zooming with wheel modifies user distance and NEVER snaps back to preset zooms!
      // - Dragging to change camera angle updates user orientation and animation continues from there!
      // - Right-drag / middle-drag pans the object across screen seamlessly!
      if (params.animationMode !== 'Static Zen (No Camera Motion)' && params.speed > 0.001) {
        const offset = new THREE.Vector3().subVectors(camera.position, controls.target);
        const spherical = new THREE.Spherical().setFromVector3(offset);

        const mode = params.animationMode;
        if (mode === 'Slow Cosmic Orbit') {
          spherical.theta += 0.0018 * params.speed;
        } else if (mode === 'Meditative Breathing Drift') {
          spherical.theta += Math.sin(animTime * 0.35) * 0.0015 * params.speed;
          spherical.phi = THREE.MathUtils.clamp(
            spherical.phi + Math.cos(animTime * 0.28) * 0.0008 * params.speed,
            0.15,
            Math.PI / 2 - 0.05
          );
        } else if (mode === 'Ascension Spiral') {
          spherical.theta += 0.0016 * params.speed;
          spherical.phi = THREE.MathUtils.clamp(
            spherical.phi - Math.sin(animTime * 0.22) * 0.0006 * params.speed,
            0.22,
            Math.PI / 2 - 0.08
          );
        } else if (mode === 'Mandala Bloom & Pulse') {
          spherical.theta += 0.0008 * params.speed;
        } else if (mode === 'Sacred Symmetry Wave') {
          spherical.theta += Math.sin(animTime * 0.42) * 0.0012 * params.speed;
        } else if (mode === 'Golden Ember Flight') {
          spherical.theta += 0.0014 * params.speed;
          spherical.phi = THREE.MathUtils.clamp(
            spherical.phi + Math.sin(animTime * 0.3) * 0.0007 * params.speed,
            0.32,
            Math.PI / 2 - 0.08
          );
        } else if (mode === 'Eternal Cycle (Assemble & Dissolve)') {
          spherical.theta += 0.0019 * params.speed;
        }

        offset.setFromSpherical(spherical);
        camera.position.addVectors(controls.target, offset);
        camera.lookAt(controls.target);
      }

      // Render via PostProcessor Suite (with God Rays centered on the central Diya flame)
      if (postProcessor && postProcessor.settings.enabled) {
        postProcessor.setMoonScreenPosition(camera, coreLight.position);
        postProcessor.renderScene(scene, camera);
      } else {
        renderer.render(scene, camera);
      }
    }

    animate();
  </script>
</body>
</html>
