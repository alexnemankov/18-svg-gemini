  <style>

    body { position: fixed; inset: 0; overscroll-behavior: none; }

<body>
<script type="module">
/*
 * CHROMA / COSMIC LIQUID
 * One HTML file. Open directly or serve with any static server / Vite.
 * Three.js and lil-gui are downloaded; all artwork is generated below.
 * No images, video, textures, simulation history, or repeating animation timeline.
 */
let THREE;
for (const source of [
  'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.min.js',
  'https://unpkg.com/three@0.180.0/build/three.module.js'
]) {
  try { THREE = await import(/* @vite-ignore */ source); break; }
  catch (error) { console.warn('Three.js source unavailable:', source, error); }
}
if (!THREE) throw new Error('Unable to load Three.js. An internet connection is required on first load.');

let GUI;
for (const source of [
  'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js',
  'https://cdn.jsdelivr.net/npm/lil-gui@0.19.1/dist/lil-gui.esm.min.js'
]) {
  try { GUI = (await import(/* @vite-ignore */ source)).default; break; }
  catch (error) { console.warn('Settings source unavailable:', source, error); }
}
if (!GUI) throw new Error('Unable to load lil-gui.');

const SETTINGS = Object.freeze({
  flowSpeed: 0.42,
  warpStrength: 1.0,
  iridescence: 1.0,
  glowIntensity: 0.78,
  minResolutionScale: 0.55
});

// 11 harmony families + 8 supplied palettes = 19 entries. Inversion supplies
// both requested achromatic directions without duplicating dropdown entries.
const SCHEMES = {
  'Original': null,
  'Monochromatic': ['#031a29','#075d88','#00a6c9','#b6ffff','#10739b'],
  'Analogous': ['#12215c','#355ee8','#00e5ff','#00ffc8','#126bff'],
  'Complementary': ['#062737','#00e5ff','#b6ffff','#ff7838','#7d250a'],
  'Split-complementary': ['#072233','#00e5ff','#b6ffff','#ff40ce','#ffe96b'],
  'Triadic': ['#092534','#00e5ff','#ff40ce','#ffe96b','#126bff'],
  'Tetradic': ['#082638','#00e5ff','#643bff','#ff7d38','#a6ff35'],
  'Double split-complementary': ['#00e5ff','#126bff','#ff40ce','#ff7ebf','#a6ff35','#ffe96b'],
  'Achromatic': ['#080808','#424242','#969696','#ffffff','#969696','#424242'],
  'Achromatic + Accent': ['#080808','#444444','#aaaaaa','#ffffff','#b0b0b0','#444444','#ff3030'],
  'Neutral + accent': ['#16181c','#4b5059','#9a9ea3','#e4dfd5','#b5b0a8','#565b63','#ff7048'],
  'Amber / Ember': ['#F6AA1C','#BC3908','#941B0C','#F6AA1C','#220901'],
  'Tidal / Obsidian': ['#63D1CF','#5BC0BE','#4BAD9E','#4BAD9E','#0B132B','#000000'],
  'Orchid / Smoke': ['#AA60C8','#D69ADE','#C9A3C6','#CFB5C2','#0D001D','#120A12'],
  'Saffron / Lagoon': ['#FEF1BE','#FFBA00','#008189','#00474D','#061210'],
  'Chartreuse / Jade': ['#D4FFB0','#7FFF00','#00B894','#0A3322','#05140A'],
  'Tangerine / Plum': ['#FFE8CC','#FF8C00','#C7501A','#3D1050','#0E0618'],
  'Lavender / Ultraviolet': ['#E8E0FF','#B38FFF','#6A3DE8','#1A1250','#090612'],
  'Cyan / Fuchsia': ['#E0FBFF','#00F0FF','#D40078','#1E0A3D','#05020F']
};
const ANIMATIONS = ['Static','Gentle orbit','Lateral drift','Pendulum',
  'Floating tide','Figure eight','Slow precession','Breathing'];
const config = {
  scheme: 'Original', color: '#00e5ff', accent: '#ff3030', invert: false,
  hue: 0, saturation: 1, background: '#000000', greenScreen: false,
  cosmicBackground: true, nebula: 1,
  animation: 'Gentle orbit', speed: 1, cameraSpeed: 1, cameraAmount: 1,
  morph: 1, warp: 1, bodyWidth: 1, dripLength: 1, detail: 1,
  glow: SETTINGS.glowIntensity, seed: 636,
  zoom: 1, panX: 0, panY: 0, yaw: 0, pitch: 0, roll: 0,
  dragAction: 'Move liquid', clickRandomize: true,
  pixelRatio: Math.min(window.devicePixelRatio || 1, 1.5),
  antialias: true, adaptiveResolution: false,
  randomize: () => randomizeScene(),
  resetView: () => {
    Object.assign(config,{zoom:1,panX:0,panY:0,yaw:0,pitch:0,roll:0});
    if(config.animation==='Static') Object.assign(cameraState,{x:0,y:0,yaw:0,pitch:0,roll:0,dolly:1});
    refreshPanel();
  }
};

const renderer = new THREE.WebGLRenderer({
  antialias: true, alpha: false, depth: false, stencil: false,
  powerPreference: 'high-performance'
});
renderer.setClearColor(0x000000, 1);
renderer.autoClear = false;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
renderer.domElement.setAttribute('aria-label', 'Slowly flowing iridescent cosmic liquid');
renderer.domElement.setAttribute('role', 'img');
document.body.appendChild(renderer.domElement);

const uniforms = {
  uTime: { value: 0 },
  uDeltaTime: { value: 1 / 60 },
  uResolution: { value: new THREE.Vector2() },
  uMouse: { value: new THREE.Vector2(-5, -5) },
  uPointerStrength: { value: 0 },
  uFlowSpeed: { value: SETTINGS.flowSpeed },
  uWarpStrength: { value: SETTINGS.warpStrength },
  uIridescence: { value: SETTINGS.iridescence },
  uGlowIntensity: { value: SETTINGS.glowIntensity }
};
const paletteTexture = new THREE.DataTexture(new Uint8Array(256*4),256,1,THREE.RGBAFormat);
paletteTexture.minFilter = THREE.LinearMipmapLinearFilter;
paletteTexture.magFilter = THREE.LinearFilter;
paletteTexture.generateMipmaps = true;
paletteTexture.wrapS = THREE.RepeatWrapping;
Object.assign(uniforms, {
  uPalette: { value: paletteTexture }, uUsePalette: { value: 0 },
  uPaletteMean: { value: new THREE.Vector3(0.5,0.5,0.5) },
  uHue: { value: 0 }, uSaturation: { value: 1 }, uInvert: { value: 0 },
  uBackground: { value: new THREE.Vector3() }, uGreenScreen: { value: 0 },
  uNebula: { value: 1 }, uSeed: { value: 0 }, uMorph: { value: 1 },
  uBodyWidth: { value: 1 }, uDripLength: { value: 1 }, uDetail: { value: 1 },
  uZoom: { value: 1 }, uPan: { value: new THREE.Vector2() },
  uViewMatrix: { value: new THREE.Matrix3() }
});
const vertexShader = /* glsl */`
  varying vec2 vUv;
  void main() {
    vUv = uv;
    gl_Position = vec4(position.xy, 0.0, 1.0);
  }
`;

const common = /* glsl */`
  precision highp float;
  varying vec2 vUv;
  uniform float uTime, uDeltaTime, uFlowSpeed, uWarpStrength;
  uniform float uIridescence, uGlowIntensity, uPointerStrength;
  uniform vec2 uResolution, uMouse;
  uniform sampler2D uPalette;
  uniform float uUsePalette, uHue, uSaturation, uInvert, uGreenScreen, uNebula;
  uniform float uSeed, uMorph, uBodyWidth, uDripLength, uDetail, uZoom;
  uniform vec3 uBackground, uPaletteMean;
  uniform vec2 uPan;
  uniform mat3 uViewMatrix;
  const float TAU = 6.28318530718;

  float hash21(vec2 p) {
    p += vec2(uSeed*0.731,uSeed*0.317);
    vec3 p3 = fract(vec3(p.xyx) * 0.1031);
    p3 += dot(p3, p3.yzx + 33.33);
    return fract((p3.x + p3.y) * p3.z);
  }
  vec2 hash22(vec2 p) {
    return vec2(hash21(p), hash21(p + vec2(139.7, 83.1)));
  }

  // Value and its analytic spatial gradient. The gradient gives a cheap,
  // smooth divergence-free curl field without finite-difference sampling.
  vec3 noiseD(vec2 p) {
    vec2 i = floor(p), f = fract(p);
    vec2 u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
    vec2 du = 30.0 * f * f * (f * (f - 2.0) + 1.0);
    float a = hash21(i), b = hash21(i + vec2(1, 0));
    float c = hash21(i + vec2(0, 1)), d = hash21(i + vec2(1, 1));
    float k = a - b - c + d;
    return vec3(a + (b-a)*u.x + (c-a)*u.y + k*u.x*u.y,
      du * (vec2(b-a, c-a) + k*u.yx));
  }
  float noise(vec2 p) { return noiseD(p).x; }
  mat2 rotate(float a) { float s = sin(a), c = cos(a); return mat2(c, -s, s, c); }
  float fbm(vec2 p) {
    float n = 0.0, a = 0.53;
    for (int i = 0; i < 4; i++) {
      n += a * noise(p);
      p = mat2(1.62, 1.17, -1.17, 1.62) * p + 7.19;
      a *= 0.48;
    }
    return n;
  }
  vec2 artCoordinates(vec2 uv) {
    float aspect = uResolution.x / uResolution.y;
    float span = max(aspect / 1.783, 0.61);
    float center = mix(0.64, 0.50, smoothstep(0.65, 1.55, aspect));
    vec2 screen = (uv-0.5)*vec2(span,-1.0)-uPan;
    vec3 origin = uViewMatrix*vec3(0,0,1.5);
    vec3 ray = uViewMatrix*vec3(screen/uZoom,-1.5);
    float intersection = -origin.z/min(ray.z,-0.04);
    return origin.xy+ray.xy*intersection+vec2(center,0.5);
  }
  vec3 gradeColor(vec3 color) {
    vec3 axis = normalize(vec3(1.0));
    color = color*cos(uHue) + cross(axis,color)*sin(uHue)
          + axis*dot(axis,color)*(1.0-cos(uHue));
    float gray = dot(color,vec3(0.2126,0.7152,0.0722));
    return max(mix(vec3(gray),color,uSaturation),0.0);
  }
  vec3 schemeColor(float phase) {
    float footprint = fwidth(phase);
    vec3 c = texture2D(uPalette,vec2(phase,0.5)).rgb;
    c = mix(c,uPaletteMean,smoothstep(0.20,0.65,footprint));
    return mix(c,vec3(1.0)-c,uInvert);
  }
  // Palette expresses approximate wavelength interference in three overlapping
  // response lobes. A second harmonic opens up pinks and yellow-green fringes.
  vec3 spectrum(float phase) {
    float footprint = fwidth(phase)*TAU;
    float attenuation = exp(-0.5*footprint*footprint);
    vec3 c = 0.5 + 0.5*cos(TAU*(phase + vec3(0.02, 0.35, 0.67)))*attenuation;
    c = pow(c, vec3(1.12, 0.88, 0.8));
    c += 0.12 * (0.5 + 0.5*cos(TAU*(phase*2.0 + vec3(0.1, 0.3, 0.6)))*attenuation*attenuation);
    return mix(vec3(dot(c, vec3(0.2126, 0.7152, 0.0722))), c, uIridescence);
  }
`;

const backgroundShader = common + /* glsl */`
  float stars(vec2 p, float scale, float threshold) {
    vec2 cell = floor(p*scale);
    vec2 local = fract(p*scale) - 0.12 - 0.76*hash22(cell);
    float seed = hash21(cell + 53.7);
    float radius = mix(0.027, 0.095, pow(seed, 8.0));
    float aa = max(fwidth(local.x), fwidth(local.y));
    return (1.0-smoothstep(radius, radius+aa, length(local)))
      * step(threshold, seed) * (0.25 + seed*0.65);
  }
  void main() {
    if (uGreenScreen > 0.5) { gl_FragColor = vec4(0,1,0,1); return; }
    if (uNebula < 0.001) { gl_FragColor = vec4(uBackground,1); return; }
    vec2 p = artCoordinates(vUv);
    float t = uTime*uFlowSpeed;
    vec2 q = vec2(p.x*1.78, p.y);
    vec2 drift = vec2(sin(t*0.017), cos(t*0.013))*0.025;
    float region = exp(-pow((p.x-0.98)/0.19, 2.0)-pow((p.y-0.88)/0.58, 2.0));
    region += 0.11*exp(-pow((p.x-0.04)/0.13, 2.0)-pow((p.y-0.94)/0.23, 2.0));
    vec2 w = q*5.5 + drift;
    float cloud = fbm(w + 2.6*vec2(fbm(w+7.0), fbm(w-13.0)));
    float dust = noise(q*480.0 + 3.0*fbm(q*30.0));
    vec3 nebula = mix(vec3(0.045, 0.065, 0.23), vec3(0.06, 0.42, 0.61), cloud);
    nebula = mix(nebula, vec3(0.37, 0.08, 0.31), smoothstep(0.58, 0.82, fbm(w*1.7+16.0)));
    nebula *= region * pow(cloud, 2.7) * 1.05;
    nebula += region*pow(cloud, 5.0)*pow(dust, 11.0)*vec3(0.5, 0.85, 1.0)*2.5;
    float star = stars(q, 210.0, 0.993) + stars(q+7.1, 391.0, 0.998)*0.5;
    star *= 0.06 + region*0.62;
    vec3 color = nebula + star*vec3(0.60, 0.80, 1.0);
    color += region*pow(dust, 35.0)*vec3(0.06, 0.24, 0.35);
    color = gradeColor(color);
    if (uUsePalette > 0.5) {
      float brightness = max(color.r,max(color.g,color.b));
      color = gradeColor(schemeColor(cloud*0.6))*brightness;
    }
    gl_FragColor = vec4(uBackground+color*uNebula*(1.0-uBackground), 1.0);
  }
`;

const liquidShader = common + /* glsl */`
  float smin(float a, float b, float k) {
    float h = max(k-abs(a-b), 0.0)/k;
    return min(a,b) - h*h*k*0.25;
  }
  float taperedSegment(vec2 p, vec2 a, vec2 b, float ra, float rb) {
    vec2 ab = b-a;
    float h = clamp(dot(p-a, ab)/dot(ab, ab), 0.0, 1.0);
    return length(p-a-ab*h) - mix(ra, rb, h);
  }
  float drip(vec2 p, float x, float start, float end, float width, float seed, float t) {
    end = start + (end-start)*uDripLength;
    end += 0.035*sin(t*(0.11+seed*0.017)+seed*4.7)
         + 0.014*sin(t*0.071+seed*8.3);
    float h = clamp((p.y-start)/(end-start), 0.0, 1.0);
    float sway = 0.004*sin(t*0.19+seed*5.1+h*2.0)*h*h;
    float cx = x + sway + 0.004*sin(h*3.0+seed)*h;
    float r = width*(0.16+0.84*exp(-h*7.0));
    r += width*0.13*exp(-pow((h-0.975)*30.0, 2.0));
    return length(vec2(p.x-cx, p.y-clamp(p.y, start, end)))-r;
  }
  float silhouette(vec2 p, float t) {
    // Art-directed backbone: an asymmetric, folded sheet, open to black space.
    // Low-frequency deformation preserves the large masses and attached drips.
    vec2 w = p;
    w += vec2(noise(p*6.2+vec2(t*0.018, 4.0)), noise(p*7.1+vec2(13.0, -t*0.014)))*0.026-0.013;
    w.x += 0.009*sin(p.y*17.0+t*0.10);
    w.y += 0.008*sin(p.x*23.0-t*0.13);
    float d = taperedSegment(w, vec2(0.15,-0.14), vec2(0.20,0.11), 0.08,0.047);
    d = smin(d,taperedSegment(w,vec2(0.20,0.11),vec2(0.25,0.29),0.047,0.052),0.065);
    d = smin(d,taperedSegment(w,vec2(0.25,0.29),vec2(0.35,0.34),0.052,0.056),0.068);
    d = smin(d,taperedSegment(w,vec2(0.35,0.34),vec2(0.41,0.21),0.056,0.044),0.065);
    d = smin(d,taperedSegment(w,vec2(0.41,0.21),vec2(0.45,0.015),0.044,0.081),0.07);
    d = smin(d,taperedSegment(w,vec2(0.45,0.015),vec2(0.56,-0.10),0.081,0.09),0.08);
    d = smin(d,taperedSegment(w,vec2(0.37,0.34),vec2(0.52,0.43),0.046,0.068),0.06);
    d = smin(d,taperedSegment(w,vec2(0.52,0.43),vec2(0.64,0.54),0.068,0.12),0.10);
    d = smin(d,taperedSegment(w,vec2(0.64,0.54),vec2(0.68,0.38),0.12,0.068),0.08);
    d = smin(d,taperedSegment(w,vec2(0.68,0.38),vec2(0.83,0.36),0.068,0.059),0.07);
    d = smin(d,taperedSegment(w,vec2(0.83,0.36),vec2(0.95,0.20),0.059,0.07),0.08);
    d = smin(d,taperedSegment(w,vec2(0.95,0.20),vec2(1.03,-0.08),0.07,0.11),0.07);
    d = smin(d,taperedSegment(w,vec2(0.65,-0.12),vec2(0.78,0.04),0.055,0.038),0.06);
    d = smin(d,taperedSegment(w,vec2(0.78,0.04),vec2(0.94,0.025),0.038,0.058),0.06);
    d = smin(d,taperedSegment(w,vec2(0.80,0.39),vec2(0.76,0.59),0.083,0.103),0.09);
    d = smin(d,taperedSegment(w,vec2(0.76,0.59),vec2(0.62,0.73),0.103,0.072),0.08);
    d = smin(d,taperedSegment(w,vec2(0.62,0.73),vec2(0.545,0.89),0.072,0.025),0.065);
    d = smin(d,taperedSegment(w,vec2(0.545,0.89),vec2(0.548,1.13),0.025,0.012),0.04);
    d -= (uBodyWidth-1.0)*0.035;
    d = smin(d,drip(p,0.593,0.77,1.07,0.027,1.0,t),0.025);
    d = smin(d,drip(p,0.659,0.715,0.95,0.021,2.0,t),0.022);
    d = smin(d,drip(p,0.744,0.645,0.91,0.016,3.0,t),0.025);
    d = smin(d,drip(p,0.803,0.535,0.80,0.019,4.0,t),0.027);
    d = smin(d,drip(p,0.841,0.43,0.64,0.012,5.0,t),0.023);
    d = smin(d,drip(p,0.877,0.335,0.585,0.018,6.0,t),0.027);
    return d;
  }
  vec2 vortex(vec2 p, vec2 center, float strength, float radius) {
    vec2 d = p-center;
    float a = strength*exp(-dot(d,d)/radius);
    return center + rotate(a)*d;
  }
  vec2 flowField(vec2 p, float t) {
    vec3 a = noiseD(p*2.4 + vec2(sin(t*0.041),cos(t*0.037))*0.5);
    vec3 b = noiseD(p*5.2 + vec2(cos(t*0.029),sin(t*0.033))*0.4 + 19.0);
    return vec2(a.z, -a.y)*0.24 + vec2(b.z,-b.y)*0.075;
  }
  vec2 advect(vec2 p, float t) {
    vec2 q = p;
    q = vortex(q,vec2(0.63+0.025*sin(t*0.10),0.48),2.7+0.25*sin(t*0.071),0.055);
    q = vortex(q,vec2(0.84,0.24+0.016*cos(t*0.083)),-2.3,0.042);
    q = vortex(q,vec2(0.33,0.27),1.8,0.025);
    // Fixed-step backtracing through a continuously evolving velocity field.
    // No framebuffer decay: marbling remains detailed after indefinite playback.
    for (int i=0; i<4; i++) {
      vec2 velocity = flowField(q*1.8, t+float(i)*0.7);
      q -= velocity*0.105*uWarpStrength;
    }
    vec2 mouse = artCoordinates(uMouse);
    vec2 delta = q-mouse;
    q += vec2(-delta.y,delta.x)*exp(-dot(delta,delta)*65.0)*0.13*uPointerStrength;
    return q;
  }
  // Pixel footprint damps unresolved interference rather than letting the
  // finest layers alias or shimmer when the canvas resolution changes.
  float filteredWave(float phase) {
    float footprint = fwidth(phase);
    return sin(phase) * exp(-0.5*footprint*footprint);
  }
  vec2 evolvingForm(vec2 p, float t) {
    // The entire material shares this smooth, time-varying deformation.
    // Different temporal frequencies change folds, channels, lobes and drips.
    float s = uSeed*0.17;
    vec2 broad = vec2(
      sin(p.y*5.8+t*0.43+s) + 0.42*sin(p.x*8.1-t*0.31+s*1.7),
      sin(p.x*6.3-t*0.37+s*0.7) + 0.40*cos(p.y*7.2+t*0.29));
    vec2 folds = vec2(noise(p*4.2+vec2(t*0.11,s)),
                       noise(p*4.7+vec2(s,-t*0.13)))-0.5;
    return p + (broad*0.050+folds*0.060)*uMorph;
  }
  void main() {
    float t = uTime*uFlowSpeed;
    vec2 p = evolvingForm(artCoordinates(vUv),t);
    float d = silhouette(p,t);
    float aa = max(fwidth(d), 0.00035);
    float mask = 1.0-smoothstep(-aa,aa,d);
    float halo = exp(-max(d,0.0)*125.0)*0.27*uGlowIntensity*(1.0-uGreenScreen);
    if (d > 0.055) discard;

    vec2 q = advect(p,t)*vec2(1.50,1.0);
    vec2 a = vec2(fbm(q*3.2+vec2(0.07*t,7.1)),fbm(q*3.2+vec2(5.7,-0.053*t)));
    vec2 b = vec2(fbm(q*4.1+a*3.8+vec2(2.1,-0.025*t)),
                  fbm(q*4.1+a*3.8+vec2(12.7,0.031*t)));
    vec2 marble = q + (a-0.5)*0.52*uWarpStrength + (b-0.5)*0.24;
    float base = fbm(marble*5.1+b*1.6);
    float phase = marble.y*0.75 + marble.x*0.26 + base*0.91;
    phase += 0.009*noise(marble*29.0+b*5.0);
    float regions = smoothstep(0.33,0.65,fbm(q*3.7+23.1));

    vec3 broad = spectrum(phase*4.7 + b.x*0.32);
    float wave = filteredWave(phase*TAU*43.0*uDetail + b.y*4.0);
    vec3 threads = spectrum(phase*21.0*uDetail + b.x*0.35);
    vec3 color = mix(broad,threads,0.18+0.67*regions);
    float fine = filteredWave(phase*TAU*115.0*uDetail + base*9.0);
    color *= 0.91+0.10*wave+0.065*fine*regions;
    color = mix(color,vec3(0.18,0.49,0.64),0.17);

    // Distance shading gives the membrane a rolled, translucent edge.
    float inside = max(-d,0.0);
    float rim = exp(-abs(d)*520.0);
    float pearl = exp(-inside*43.0);
    float folds = smoothstep(0.12,0.73,base);
    float light = 0.61+0.43*folds;
    light *= 0.33+0.67*smoothstep(-0.08,0.39,p.y);

    float softPearl = (1.0-regions)*smoothstep(0.36,0.88,p.y)*0.28;
    color = mix(color,vec3(0.42,0.77,0.84),softPearl);
    color += pearl*vec3(0.13,0.36,0.44)*(0.60+0.4*b.y);
    color = mix(color,vec3(0.64,0.97,1.0),rim*0.52*uGlowIntensity);
    float sheen = pow(max(0.0,filteredWave(phase*TAU*7.3+0.7)),14.0);
    color += sheen*vec3(0.20,0.27,0.30)*0.19;
    // The narrow drips naturally inherit this same continuous pigment field.
    vec3 haloColor = vec3(0.035,0.27,0.78)*halo;
    if (uUsePalette > 0.5) {
      vec3 pigment = schemeColor(phase*4.7+b.x*0.32);

      color = pigment*(0.46+0.64*light)*(0.91+0.09*wave);
      vec3 edgePigment = schemeColor(0.49);
      color = mix(color,edgePigment,rim*0.50*uGlowIntensity);

      haloColor = edgePigment*halo*0.65;
    } else if (uInvert > 0.5) {

    }
    color = gradeColor(color);
    haloColor = gradeColor(haloColor);
    color += (hash21(gl_FragCoord.xy)-0.5)/500.0;
    float alpha = max(mask,halo);
    gl_FragColor = vec4((color*mask+haloColor*(1.0-mask))/max(alpha,0.0001),alpha);
  }
`;

// Fullscreen shader silhouettes do not benefit from polygon MSAA alone.
// Derivative filtering above handles spectral detail; FXAA handles final edges.
const renderTarget = new THREE.WebGLRenderTarget(1,1,{
  depthBuffer:false, stencilBuffer:false,
  minFilter:THREE.LinearFilter, magFilter:THREE.LinearFilter

const fxaaMaterial = new THREE.ShaderMaterial({
  uniforms: { tScene:{value:renderTarget.texture}, uTexel:{value:new THREE.Vector2(1,1)} },
  vertexShader, depthTest:false, depthWrite:false,
  fragmentShader: /* glsl */`
    precision highp float;
    varying vec2 vUv;
    uniform sampler2D tScene;
    uniform vec2 uTexel;
    void main() {
      vec3 nw=texture2D(tScene,vUv+vec2(-1,1)*uTexel).rgb;
      vec3 ne=texture2D(tScene,vUv+vec2(1,1)*uTexel).rgb;
      vec3 sw=texture2D(tScene,vUv+vec2(-1,-1)*uTexel).rgb;
      vec3 se=texture2D(tScene,vUv+vec2(1,-1)*uTexel).rgb;
      vec3 center=texture2D(tScene,vUv).rgb;
      vec3 luma=vec3(0.299,0.587,0.114);
      float a=dot(nw,luma),b=dot(ne,luma),c=dot(sw,luma),d=dot(se,luma);
      float mid=dot(center,luma);
      float lo=min(mid,min(min(a,b),min(c,d)));
      float hi=max(mid,max(max(a,b),max(c,d)));
      if (hi-lo < max(0.025,hi*0.09)) { gl_FragColor=vec4(center,1); return; }
      vec2 dir=vec2(-((a+b)-(c+d)),(a+c)-(b+d));
      float reduce=max((a+b+c+d)*0.03125,0.0078125);
      dir=clamp(dir/(min(abs(dir.x),abs(dir.y))+reduce),vec2(-6),vec2(6))*uTexel;
      vec3 rgbA=0.5*(texture2D(tScene,vUv-dir/6.0).rgb+texture2D(tScene,vUv+dir/6.0).rgb);
      vec3 rgbB=rgbA*0.5+0.25*(texture2D(tScene,vUv-dir*0.5).rgb+texture2D(tScene,vUv+dir*0.5).rgb);
      float lumB=dot(rgbB,luma);
      gl_FragColor=vec4(lumB<lo || lumB>hi ? rgbA : rgbB,1);
    }
  `
});
const postScene = new THREE.Scene();
postScene.add(new THREE.Mesh(geometry,fxaaMaterial));

function rgb(hex) {
  const n=parseInt(hex.replace('#',''),16);
  return [(n>>16)&255,(n>>8)&255,n&255];
}
function hsl(hex) {
  return new THREE.Color().setStyle(hex,THREE.LinearSRGBColorSpace).getHSL({});
}
function hexFromHSL(h,s,l) {
  return '#'+new THREE.Color().setHSL((h%1+1)%1,s,l,THREE.LinearSRGBColorSpace)
    .getHexString(THREE.LinearSRGBColorSpace);
}
function refreshPanel() {
  gui?.controllersRecursive().forEach(controller=>controller.updateDisplay());
}
function uploadPalette() {
  const pixels=paletteTexture.image.data;
  const colors=paletteStops.map(rgb);
  const mean=[0,0,0];
  for(let i=0;i<256;i++) {
    const p=i/256*colors.length;
    const a=colors[Math.floor(p)%colors.length], b=colors[(Math.floor(p)+1)%colors.length];
    const f=p-Math.floor(p), blend=f*f*(3-2*f);
    for(let channel=0;channel<3;channel++) {
      const value=Math.round(a[channel]+(b[channel]-a[channel])*blend);
      pixels[i*4+channel]=value; mean[channel]+=value/(256*255);
    }
    pixels[i*4+3]=255;
  }
  uniforms.uPaletteMean.value.set(...mean);
  paletteTexture.needsUpdate=true;
  uniforms.uUsePalette.value=config.scheme==='Original'?0:1;
  paletteControls.forEach((controller,index)=> {
    controller.show(index<paletteStops.length && config.scheme!=='Original');
    config['stop'+index]=paletteStops[index] || '#000000';
  });
}
function buildPalette() {
  const source=SCHEMES[config.scheme] || ['#00e5ff','#126bff','#ff40ce','#a6ff35','#b6ffff'];
  const anchor=hsl(source[0]), color=hsl(config.color);
  const shift=color.h-anchor.h;
  const neutral=config.scheme==='Achromatic' || config.scheme==='Achromatic + Accent' || config.scheme==='Neutral + accent';
  paletteStops=source.map(stop=> {
    if(neutral || Math.abs(shift)<0.000001) return stop;
    const c=hsl(stop);
    return hexFromHSL(c.h+shift,c.s,c.l);
  });
  if(neutral && config.invert) {
    paletteStops=paletteStops.map(stop=>'#'+rgb(stop).map(channel=>(255-channel).toString(16).padStart(2,'0')).join(''));
  }
  if(config.scheme.includes('Accent') || config.scheme==='Neutral + accent') {
    paletteStops[paletteStops.length-1]=config.accent;
  }
  uploadPalette();
}
function applyScheme(resetColor=true) {
  if(resetColor) config.color=SCHEMES[config.scheme]?.[0] || '#00e5ff';
  if(config.scheme.startsWith('Achromatic')) config.background=config.invert?'#ffffff':'#000000';
  buildPalette(); syncUniforms(); refreshPanel();
}
function syncUniforms() {

  uniforms.uHue.value=(config.hue+baseHue)*Math.PI/180;
  uniforms.uSaturation.value=config.saturation;
  const neutral=config.scheme.startsWith('Achromatic') || config.scheme==='Neutral + accent';
  uniforms.uInvert.value=config.invert && !neutral?1:0;
  uniforms.uBackground.value.set(...rgb(config.background).map(value=>value/255));
  uniforms.uGreenScreen.value=config.greenScreen?1:0;
  uniforms.uNebula.value=config.cosmicBackground?config.nebula:0;
  uniforms.uSeed.value=config.seed*0.137;
  uniforms.uMorph.value=config.morph;
  uniforms.uBodyWidth.value=config.bodyWidth;
  uniforms.uDripLength.value=config.dripLength;
  uniforms.uDetail.value=config.detail;
  uniforms.uWarpStrength.value=config.warp;
  uniforms.uGlowIntensity.value=config.glow;
}
function randomizeScene() {
  const random=(lo,hi)=>lo+Math.random()*(hi-lo);
  const schemes=Object.keys(SCHEMES);
  Object.assign(config,{
    scheme:schemes[Math.floor(random(0,schemes.length))],
    seed:Math.floor(random(1,9999)), morph:random(0.65,1.8),
    warp:random(0.65,1.45), bodyWidth:random(0.7,1.3),
    dripLength:random(0.65,1.55), detail:random(0.65,1.4),
    glow:random(0.4,1.05), speed:random(0.65,1.3),

    ? colors.reduce((a,b)=>rgb(a).reduce((s,v)=>s+v,0)<rgb(b).reduce((s,v)=>s+v,0)?a:b)

function resize() {

  const ratio=Math.min(config.pixelRatio*resolutionScale,hardwareLimit);

  renderTarget.setSize(uniforms.uResolution.value.x,uniforms.uResolution.value.y);
  fxaaMaterial.uniforms.uTexel.value.set(1/uniforms.uResolution.value.x,1/uniforms.uResolution.value.y);
}

function artSpan() { return Math.max((window.innerWidth/window.innerHeight)/1.783,0.61); }
function pointerDown(event) {

  drag={id:event.pointerId,x:event.clientX,y:event.clientY,startX:event.clientX,startY:event.clientY,
    moved:false,orbit:event.button===2 || config.dragAction==='Orbit view',

}
function pointerMove(event) {

  pointerLastMoved=performance.now();
  if(!drag || drag.id!==event.pointerId) return;
  const dx=event.clientX-drag.x, dy=event.clientY-drag.y;
  if(Math.hypot(event.clientX-drag.startX,event.clientY-drag.startY)>5) drag.moved=true;
  if(drag.moved) {
    if(drag.orbit) {
      config.yaw=THREE.MathUtils.clamp(config.yaw+dx*0.15,-40,40);
      config.pitch=THREE.MathUtils.clamp(config.pitch-dy*0.15,-35,35);
    } else {
      config.panX=THREE.MathUtils.clamp(config.panX+dx/window.innerWidth*artSpan(),-3,3);
      config.panY=THREE.MathUtils.clamp(config.panY+dy/window.innerHeight,-3,3);

function pointerUp(event) {

function wheel(event) {

function updateView(delta) {

    case 'Lateral drift':

    case 'Pendulum':
      cameraGoal.roll=Math.sin(t*0.75)*0.045*a; cameraGoal.yaw=Math.sin(t*0.53)*0.07*a; break;
    case 'Floating tide':
      cameraGoal.y=Math.sin(t*0.71)*0.040*a; cameraGoal.pitch=Math.cos(t*0.57)*0.065*a; break;
    case 'Figure eight':
      cameraGoal.x=Math.sin(t*0.64)*0.055*a; cameraGoal.y=Math.sin(t*1.28)*0.025*a;

    config.yaw*Math.PI/180+cameraState.yaw,config.roll*Math.PI/180+cameraState.roll,'YXZ');

  uniforms.uZoom.value=config.zoom*cameraState.dolly;
  uniforms.uPan.value.set(config.panX+cameraState.x,config.panY+cameraState.y);
}

function visibilityChange() {
  lastTime=performance.now(); sampleTime=0; sampleCount=0;
  if(document.hidden) cancelAnimationFrame(frame);
  else if(!disposed && !contextLost) { cancelAnimationFrame(frame); frame=requestAnimationFrame(animate); }
}
function onContextLost(event) {
  event.preventDefault(); contextLost=true; drag=null; cancelAnimationFrame(frame);
}
function onContextRestored() {
  contextLost=false;
  backgroundMaterial.needsUpdate=true; liquidMaterial.needsUpdate=true; fxaaMaterial.needsUpdate=true;
  paletteTexture.needsUpdate=true;
  resize(); lastTime=performance.now();
  if(!document.hidden && !disposed) { cancelAnimationFrame(frame); frame=requestAnimationFrame(animate); }
}
function animate(now) {
  if(disposed || document.hidden || contextLost) return;
  const rawDelta=Math.max((now-lastTime)/1000,0.001);
  const delta=Math.min(rawDelta,0.05);
  lastTime=now; runtime+=delta;
  elapsed+=delta*config.speed;
  cameraClock+=delta*config.speed*config.cameraSpeed;
  uniforms.uTime.value=elapsed; uniforms.uDeltaTime.value=delta;
  updateView(config.speed===0?0:delta);
  const ease=1-Math.exp(-delta*3.0);
  uniforms.uMouse.value.lerp(pointerTarget,ease);
  const pointerActive=now-pointerLastMoved<1800 && !drag?1:0;
  uniforms.uPointerStrength.value+=(pointerActive-uniforms.uPointerStrength.value)*ease;
  renderer.setRenderTarget(config.antialias?renderTarget:null);
  renderer.render(backgroundScene,camera);
  renderer.render(liquidScene,camera);
  if(config.antialias) { renderer.setRenderTarget(null); renderer.render(postScene,camera); }

  if(config.adaptiveResolution && runtime>3) {
    sampleTime+=Math.min(rawDelta,0.15); sampleCount++;
    if(sampleTime>=2 && sampleCount>=20) {
      slowWindows=sampleTime/sampleCount>0.026?slowWindows+1:0;
      if(slowWindows>=2 && resolutionScale>SETTINGS.minResolutionScale) {
        resolutionScale=Math.max(SETTINGS.minResolutionScale,resolutionScale*0.86);
        resize(); slowWindows=0;
      }
      sampleTime=0; sampleCount=0;
    }
  }
  frame=requestAnimationFrame(animate);
}

// All registrations have a matching cleanup, including pointer capture, GUI,
// postprocessing resources, and context / back-forward-cache lifecycle events.
const removers=[];
function listen(target,event,callback,options) {
  target.addEventListener(event,callback,options);
  removers.push(()=>target.removeEventListener(event,callback,options));
}
function dispose() {
  if(disposed) return;
  disposed=true; cancelAnimationFrame(frame);
  if(drag && renderer.domElement.hasPointerCapture(drag.id)) renderer.domElement.releasePointerCapture(drag.id);
  drag=null; removers.forEach(remove=>remove()); gui.destroy();
  geometry.dispose(); backgroundMaterial.dispose(); liquidMaterial.dispose();
  fxaaMaterial.dispose(); renderTarget.dispose(); paletteTexture.dispose();
  renderer.dispose(); renderer.domElement.remove();
}
function onPageHide(event) { if(event.persisted) cancelAnimationFrame(frame); else dispose(); }
function onPageShow(event) {
  if(event.persisted && !disposed && !contextLost && !document.hidden) {
    cancelAnimationFrame(frame); lastTime=performance.now(); frame=requestAnimationFrame(animate);
  }
}
