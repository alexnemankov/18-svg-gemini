<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#332000">
  <meta name="description" content="Chromatic Cascade — a seamless, sixteen-second study of prismatic light.">
  <title>Chromatic Cascade</title>
  <style>
    :root { color-scheme: dark; background: #332000; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { position: fixed; inset: 0; overscroll-behavior: none; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  </style>
</head>
<body>
  <canvas aria-label="Chromatic Cascade: slowly breathing spectral light passing through vertical translucent shutters"></canvas>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.181.2/build/three.module.js';
    import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

    // The light remains a single procedural pass. View transforms are composed
    // with the animated camera; animation never writes back to the user's view.
    const settings = {
      loopSeconds: 16,
      scheme: 'Original',
      invertMonochrome: false,
      backgroundColor: '#332000',
      greenscreen: false,
      coreColor: '#e0d4d4',
      shadowColor: '#4a0630',
      lowerShadowColor: '#5c0018',
      ember: '#e85029', rose: '#f56eb3', peach: '#ff8266',
      gold: '#e0a604', lime: '#759c01', emerald: '#00823d',
      teal: '#00827a', cyan: '#00b8e8', blue: '#057aeb', violet: '#63337a',
      animation: 'Prismatic cascade',
      speed: 1,
      motion: 1,
      cameraMotion: 1,
      zoom: 1,
      angle: 0,
      orbitAngle: 12,
      panX: 0,
      panY: 0,
      panels: 21,
      slope: 0.218,
      seed: 0,
      waveAmplitude: 0.017,
      spectralDisplacement: 0.012,
      whiteBandWidth: 1,
      diffusion: 1,
      segmentation: 0.88,
      colorIntensity: 1,
      interference: 0.65,
      pixelRatio: Math.min(window.devicePixelRatio || 1, 1.75),
      randomizeOnClick: true
    };

    const colorKeys = ['ember', 'rose', 'peach', 'gold', 'lime', 'emerald', 'teal', 'cyan', 'blue', 'violet'];
    const palette = (background, colors, core = '#eeeae4', shadow = '#17121e', lower = shadow) =>
      ({ background, colors, core, shadow, lower });
    // Sample in authored order: repeated colors and every supplied stop remain
    // part of the light field. No luminance sorting or discarded palette colors.
    const suppliedPalette = (hexes) => {
      const colors = hexes.map(hex => '#' + hex);
      return palette(colors.at(-1), colors.slice(0, -1), colors[0], colors.at(-1), colors.at(-2));
    };
    const schemes = {
      'Original': palette(settings.backgroundColor, colorKeys.map(key => settings[key]), settings.coreColor, settings.shadowColor, settings.lowerShadowColor),
      'Monochromatic': palette('#061020', ['#14294d', '#274c85', '#4475b8', '#759bd4', '#527cc1', '#204e92'], '#e1edff', '#101a37', '#081d3e'),
      'Analogous': palette('#100c23', ['#7950b4', '#b26bc7', '#cb9ce0', '#8698cf', '#4bb6be', '#167c9b'], '#e9dcf3', '#252044', '#102b3c'),
      'Complementary': palette('#17101c', ['#633e9a', '#a073cf', '#d5b4e8', '#e7b778', '#e7a335', '#694b8d'], '#f4e5db', '#2d173a', '#422414'),
      'Split-complementary': palette('#170f21', ['#724492', '#ba75ba', '#dfb1cf', '#cad075', '#9bbd59', '#ed9d55'], '#f2e7dc', '#301c36', '#3d2b1d'),
      'Triadic': palette('#131321', ['#7162ac', '#b192d1', '#e3af8a', '#eabf5f', '#63b8ac', '#3e899d'], '#f1e8e1', '#28203e', '#173436'),
      'Tetradic': palette('#101821', ['#45838f', '#81b6b9', '#ce9dba', '#d5788f', '#ecab75', '#7eae8b'], '#efeadf', '#27243b', '#2d3125'),
      'Double split-complementary': palette('#17131e', ['#73598b', '#b394bc', '#d8a3b3', '#c8ba7c', '#8dbf9d', '#75b5be'], '#f2e8df', '#302337', '#243831'),
      'Achromatic': palette('#080808', ['#282828', '#555555', '#888888', '#b8b8b8', '#e4e4e4', '#727272'], '#f0f0f0', '#141414', '#0a0a0a'),
      'Achromatic + Accent': palette('#080808', ['#292929', '#626262', '#aaaaaa', '#d0d0d0', '#dfdfdf', '#e52b35', '#858585'], '#f0f0f0', '#171717', '#0b0b0b'),
      'Neutral + accent': palette('#18191b', ['#393b3b', '#686b68', '#aaa89e', '#c2bcb0', '#a9b3aa', '#b9b9b0', '#d7663c', '#aebbb7', '#74817f', '#4d565b'], '#e5e0d4', '#27292a', '#30302d'),
      'Amber / Ember': suppliedPalette(['F6AA1C', 'BC3908', '941B0C', 'F6AA1C', '220901']),
      'Tidal / Teal': suppliedPalette(['63D1CF', '5BC0BE', '4BAD9E', '4BAD9E', '0B132B', '000000']),
      'Orchid / Mauve': suppliedPalette(['AA60C8', 'D69ADE', 'C9A3C6', 'CFB5C2', '0D001D', '120A12']),
      'Saffron / Lagoon': suppliedPalette(['FEF1BE', 'FFBA00', '008189', '00474D', '061210']),
      'Lime / Jade': suppliedPalette(['D4FFB0', '7FFF00', '00B894', '0A3322', '05140A']),
      'Apricot / Aubergine': suppliedPalette(['FFE8CC', 'FF8C00', 'C7501A', '3D1050', '0E0618']),
      'Lavender / Indigo': suppliedPalette(['E8E0FF', 'B38FFF', '6A3DE8', '1A1250', '090612']),
      'Ice / Fuchsia': suppliedPalette(['E0FBFF', '00F0FF', 'D40078', '1E0A3D', '05020F'])
    };

    // Seven slowly evolving treatments plus a fully still optical/camera state.
    const animations = {
      'Prismatic cascade': { wave: 1, breath: 1, drift: 1, texture: 1, direction: 1, harmonic: 1 },
      'Pearl breathing': { wave: 0.35, breath: 2.2, drift: 0.4, texture: 0.55, direction: 1, harmonic: 1 },
      'Spectral tide': { wave: 0.8, breath: 0.7, drift: 2.1, texture: 0.8, direction: -1, harmonic: 1 },
      'Shutter resonance': { wave: 1.25, breath: 0.75, drift: 0.7, texture: 0.65, direction: 1, harmonic: 2 },
      'Opaline drift': { wave: 0.55, breath: 1.5, drift: 0.65, texture: 1.3, direction: -1, harmonic: 1 },
      'Slow orbit': { wave: 0.7, breath: 0.85, drift: 0.8, texture: 0.7, direction: 1, harmonic: 1 },
      'Floating camera': { wave: 0.65, breath: 0.8, drift: 0.7, texture: 0.7, direction: 1, harmonic: 1 },
      'Static': { wave: 0, breath: 0, drift: 0, texture: 0, direction: 1, harmonic: 1 }
    };

    const canvas = document.querySelector('canvas');
    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: false,
      alpha: false,
      depth: false,
      stencil: false,
      powerPreference: 'high-performance'
    });
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.NoToneMapping;

    const uniforms = {
      uPhase: { value: 0 },
      uResolution: { value: new THREE.Vector2() },
      uAspect: { value: 0.75 },
      uPanels: { value: 21 },
      uWaveAmplitude: { value: settings.waveAmplitude },
      uDispersion: { value: settings.spectralDisplacement },
      uBandWidth: { value: settings.whiteBandWidth },
      uDiffusion: { value: settings.diffusion },
      uSegmentation: { value: settings.segmentation },
      uColorIntensity: { value: settings.colorIntensity },
      uInterference: { value: settings.interference },
      uSpectrum: { value: colorKeys.map(key => new THREE.Color(settings[key])) },
      uCore: { value: new THREE.Color(settings.coreColor) },
      uShadow: { value: new THREE.Color(settings.shadowColor) },
      uLowerShadow: { value: new THREE.Color(settings.lowerShadowColor) },
      uBackground: { value: new THREE.Color(settings.backgroundColor) },
      uGreen: { value: false },
      uZoom: { value: 1 },
      uPan: { value: new THREE.Vector2() },
      uAngle: { value: 0 },
      uTilt: { value: new THREE.Vector2() },
      uMotion: { value: new THREE.Vector4(1, 1, 1, 1) },
      uDirection: { value: 1 },
      uHarmonic: { value: 1 },
      uSlope: { value: settings.slope },
      uSeed: { value: 0 }
    };

    const material = new THREE.ShaderMaterial({
      uniforms,
      depthTest: false,
      depthWrite: false,
      vertexShader: /* glsl */`
        varying vec2 vUv;
        void main() {
          vUv = position.xy * 0.5 + 0.5;
          gl_Position = vec4(position.xy, 0.0, 1.0);
        }
      `,
      fragmentShader: /* glsl */`
        precision highp float;
        varying vec2 vUv;
        uniform float uPhase;
        uniform vec2 uResolution;
        uniform float uAspect;
        uniform float uPanels;
        uniform float uWaveAmplitude;
        uniform float uDispersion;
        uniform float uBandWidth;
        uniform float uDiffusion;
        uniform float uSegmentation;
        uniform float uColorIntensity;
        uniform float uInterference;
        uniform vec3 uSpectrum[10];
        uniform vec3 uCore;
        uniform vec3 uShadow;
        uniform vec3 uLowerShadow;
        uniform vec3 uBackground;
        uniform bool uGreen;
        uniform float uZoom;
        uniform vec2 uPan;
        uniform float uAngle;
        uniform vec2 uTilt;
        uniform vec4 uMotion;
        uniform float uDirection;
        uniform float uHarmonic;
        uniform float uSlope;
        uniform float uSeed;
        const float TAU = 6.283185307179586;

        float bell(float distance, float width) {
          float d = distance / max(width, 0.001);
          return exp(-0.5 * d * d);
        }

        float hash(vec2 p) {
          return fract(52.9829189 * fract(dot(p, vec2(0.06711056, 0.00583715))));
        }

        // Overlapping spectral lobes, rather than equally spaced rainbow stops.
        vec3 spectrum(float x, float height, float phase) {
          float drift = uDispersion * uMotion.z * (sin(phase - 3.8 * x) +
                        0.32 * sin(2.0 * phase + 5.0 * x));
          float s = x + drift;
          vec3 c = uSpectrum[0];
          c = mix(c, uSpectrum[1],
                  bell(s - 0.045, 0.15) * smoothstep(0.16, 0.38, height));
          c = mix(c, uSpectrum[2], smoothstep(0.10, 0.29, s));
          c = mix(c, uSpectrum[3], smoothstep(0.23, 0.40, s));
          c = mix(c, uSpectrum[4], smoothstep(0.33, 0.47, s));
          c = mix(c, uSpectrum[5], smoothstep(0.42, 0.54, s));
          c = mix(c, uSpectrum[6], smoothstep(0.52, 0.68, s));
          c = mix(c, uSpectrum[7], smoothstep(0.64, 0.81, s));
          c = mix(c, uSpectrum[8], smoothstep(0.78, 0.94, s));
          c = mix(c, uSpectrum[9], smoothstep(0.91, 1.05, s));
          return c;
        }

        vec3 atmosphere(vec2 p) {
          vec3 top = uBackground * mix(1.45, 0.8, smoothstep(-0.15, 0.85, p.x));
          top *= 1.0 - 0.10 * p.y;
          vec3 bottom = mix(uShadow, uLowerShadow,
                            smoothstep(0.0, 0.85, p.x));
          return mix(top, bottom, smoothstep(0.49, 0.94, p.y));
        }

        // Evaluate a continuous light field at each shutter's refracted position.
        // The progressive delays are phase offsets, so velocity also loops exactly.
        vec4 opticalChannel(vec2 p, float index, float phase) {
          float column = index / uPanels;
          float x = mix(p.x, column, uSegmentation);
          float localPhase = phase * uHarmonic - column * TAU * 0.88 * uDirection + uSeed * 0.13;
          float wave = sin(localPhase);
          float response = 0.72 * wave + 0.20 * sin(2.0 * localPhase - 0.6)
                         + 0.08 * sin(3.0 * localPhase + 0.9);
          float recovery = sin(phase + column * 4.4 + 1.2);
          float breath = 0.5 + 0.5 * sin(phase - 1.0);
          float transmission = 0.985 + 0.015 * cos(index * 2.39 + uSeed)
                             + uMotion.x * 0.018 * sin(localPhase - 0.45);

          // Keep the diagonal legible in wide views while preserving light scale.
          float landscape = smoothstep(0.9, 2.0, uAspect);
          float center = mix(0.505, 0.445, landscape)
                       + (uSlope + landscape * 0.052) * x;
          center += 0.006 * sin(x * 4.5 + 0.3 + uSeed * 0.3)
                  + uWaveAmplitude * uMotion.x * (0.72 * response + 0.28 * recovery);
          float width = mix(0.105, 0.025, pow(clamp(x, 0.0, 1.0), 0.87));
          width *= uBandWidth * (1.0 + uMotion.y * (0.055 * sin(localPhase - 0.4)
                                    + 0.035 * sin(2.0 * phase + x * 4.0)));
          float top = mix(-0.015, 0.01, landscape) + (0.407 + uSlope) * column;
          top += uWaveAmplitude * uMotion.x * 0.24 * response;

          vec2 optical = vec2(p.x * min(uAspect, 1.6), p.y);
          float interference = sin(optical.x * 7.0 + optical.y * 4.0
                                 + 0.65 * sin(phase))
                             * cos(optical.y * 8.0 - optical.x * 3.0
                                 + 0.55 * cos(phase));
          float y = p.y + 0.0018 * uInterference * uMotion.w * interference;
          float distance = y - center;
          // Premultiplied foreground, independent of its background. This lets
          // the dark atmosphere be replaced with clean green without brown spill.
          vec3 color = vec3(0.0);
          float opacity = 0.0;

          // A soft rectangular cutoff makes the architecture of the staircase.
          float aperture = smoothstep(top - 0.012, top + 0.09 * uDiffusion, y);
          float depth = smoothstep(top - 0.02, top + 0.23, y);
          float upperMask = aperture * (0.055 + 0.945 * depth);
          upperMask *= 1.0 - smoothstep(center, center + width * 1.6, y);
          float spectralCoordinate = x - 1.15 * (y - (center - width * 1.7));
          vec3 upper = spectrum(spectralCoordinate, y, phase);

          // The yellow fringe and delayed turquoise response belong to the same
          // ribbon: they follow its changing width instead of moving separately.
          float gold = bell(x - 0.43, 0.19) * bell(distance + width * 1.45, width * 0.63);
          upper = mix(upper, uSpectrum[3], gold * 0.65);
          color = mix(color, upper * uColorIntensity * transmission, upperMask * 0.94);
          opacity = mix(opacity, 1.0, upperMask * 0.94);

          float blueWidth = mix(0.19, 0.028, pow(clamp(x, 0.0, 1.0), 0.85));
          blueWidth *= 1.0 + uMotion.y * 0.05 * sin(localPhase - 0.8);
          float blueCenter = center + width * 1.47;
          float blue = bell(y - blueCenter, blueWidth);
          blue *= smoothstep(-width, width * 0.7, distance);
          float coolDepth = smoothstep(blueCenter + blueWidth * 0.2,
                                       blueCenter + blueWidth * 1.8, y);
          vec3 cyan = mix(uSpectrum[7], uSpectrum[8],
                          smoothstep(0.2, 1.0, x));
          cyan = mix(cyan, uSpectrum[8] * 0.27, coolDepth);
          float cyanResponse = 1.0 + uMotion.x * 0.035 * sin(localPhase - 0.65);
          color = mix(color, cyan * cyanResponse * uColorIntensity, blue * 0.98);
          opacity = mix(opacity, 1.0, blue * 0.98);

          // The pearl core and its broader, weaker halo are analytic scattering
          // profiles. The maximum stays below display white, with no hard clipping.
          vec3 pearl = uCore;
          float warmHalo = bell(distance + width * 0.4, width * 1.85);
          float haloLimit = 1.0 - smoothstep(width * 0.75, width * 1.9, distance);
          color = mix(color, pearl, warmHalo * haloLimit * 0.075 * uDiffusion);
          opacity = mix(opacity, 1.0, warmHalo * haloLimit * 0.075 * uDiffusion);
          float coreDistance = abs(distance) / (width * (0.94 + 0.025 * breath * uMotion.y));
          float core = exp(-0.5 * pow(coreDistance, 2.8));
          pearl *= 1.0 + uMotion.y * 0.018 * sin(localPhase - 0.2);
          color = mix(color, pearl, core * 0.975);
          opacity = mix(opacity, 1.0, core * 0.975);
          return vec4(color, opacity);
        }

        void main() {
          vec2 viewport = vec2(vUv.x, 1.0 - vUv.y);
          vec2 view = (viewport - 0.5) * vec2(uAspect, 1.0) - uPan;
          float ca = cos(uAngle), sa = sin(uAngle);
          view = mat2(ca, -sa, sa, ca) * view / uZoom;
          // Inverse plane projection gives the orbit a restrained optical depth.
          float perspective = max(0.3, 1.0 + view.x * sin(uTilt.x) * 0.32
                                                 + view.y * sin(uTilt.y) * 0.32);
          view /= vec2(cos(uTilt.x), cos(uTilt.y)) * perspective;
          vec2 p = view / vec2(uAspect, 1.0) + 0.5;
          vec2 feather = fwidth(p) * 0.75;
          float bounds = smoothstep(0.0, feather.x, p.x) * (1.0 - smoothstep(1.0 - feather.x, 1.0, p.x))
                       * smoothstep(0.0, feather.y, p.y) * (1.0 - smoothstep(1.0 - feather.y, 1.0, p.y));
          p = clamp(p, 0.0, 1.0);
          float phase = TAU * fract(uPhase);
          float shutter = p.x * uPanels;
          float index = min(floor(shutter), uPanels - 1.0);
          vec4 field = opticalChannel(p, index, phase);

          // Subpixel edge diffusion: adjacent panels touch, without dark outlines.
          float edgeWidth = min(0.045, 0.75 * uPanels / uResolution.x);
          float edge = fract(shutter);
          if (edge < edgeWidth && index > 0.0) {
            vec4 neighbor = opticalChannel(p, index - 1.0, phase);
            field = mix(neighbor, field, 0.5 + 0.5 * smoothstep(0.0, edgeWidth, edge));
          } else if (edge > 1.0 - edgeWidth && index < uPanels - 1.0) {
            vec4 neighbor = opticalChannel(p, index + 1.0, phase);
            field = mix(field, neighbor, 0.5 * smoothstep(1.0 - edgeWidth, 1.0, edge));
          }

          float coverage = uGreen ? smoothstep(0.06, 0.95, field.a) : field.a;
          vec3 foreground = field.rgb / max(field.a, 0.00001);
          vec3 background = uGreen ? vec3(0.0, 1.0, 0.0) : uBackground;
          vec3 atmosphereColor = atmosphere(p);
          if (!uGreen) background = mix(background, atmosphereColor, bounds);
          coverage *= bounds;
          vec3 color = mix(background, foreground, coverage);
          gl_FragColor = vec4(color, 1.0);
          #include <colorspace_fragment>
          // Stable, one-code-value triangular dither in display space. No flicker.
          float grain = hash(gl_FragCoord.xy) - hash(gl_FragCoord.yx + 37.0);
          // Exact solid key pixels remain #00ff00; never dither the key color.
          gl_FragColor.rgb += grain * (0.65 / 255.0) * (uGreen ? coverage : bounds);
        }
      `
    });

    // One oversized triangle avoids a seam and covers every viewport shape.
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.Float32BufferAttribute([
      -1, -1, 0, 3, -1, 0, -1, 3, 0
    ], 3));
    const scene = new THREE.Scene();
    const camera = new THREE.Camera();
    const screen = new THREE.Mesh(geometry, material);
    screen.frustumCulled = false;
    scene.add(screen);

    const defaults = { ...settings };
    const toHex = color => '#' + color.getHexString(THREE.SRGBColorSpace);
    function invertNeutral(hex) {
      const channels = hex.slice(1).match(/../g).map(value => parseInt(value, 16));
      // Keep the red accent red when reversing the black/white relationship.
      if (Math.max(...channels) - Math.min(...channels) > 12) return hex;
      return '#' + channels.map(value => (255 - value).toString(16).padStart(2, '0')).join('');
    }

    function applyScheme() {
      const scheme = schemes[settings.scheme];
      const monochrome = settings.scheme === 'Achromatic' || settings.scheme === 'Achromatic + Accent';
      const convert = hex => monochrome && settings.invertMonochrome ? invertNeutral(hex) : hex;
      const colors = scheme.colors.map(hex => new THREE.Color(convert(hex)));
      colorKeys.forEach((key, index) => {
        const position = index / (colorKeys.length - 1) * (colors.length - 1);
        const a = Math.floor(position);
        settings[key] = toHex(colors[a].clone().lerp(colors[Math.min(a + 1, colors.length - 1)], position - a));
      });
      settings.backgroundColor = convert(scheme.background);
      settings.coreColor = convert(scheme.core);
      settings.shadowColor = convert(scheme.shadow);
      settings.lowerShadowColor = convert(scheme.lower);
      invertController.enable(monochrome);
      syncSettings();
      refreshControls();
    }

    function syncSettings() {
      colorKeys.forEach((key, index) => uniforms.uSpectrum.value[index].set(settings[key]));
      uniforms.uCore.value.set(settings.coreColor);
      uniforms.uShadow.value.set(settings.shadowColor);
      uniforms.uLowerShadow.value.set(settings.lowerShadowColor);
      uniforms.uBackground.value.set(settings.backgroundColor);
      uniforms.uGreen.value = settings.greenscreen;
      uniforms.uWaveAmplitude.value = settings.waveAmplitude;
      uniforms.uDispersion.value = settings.spectralDisplacement;
      uniforms.uBandWidth.value = settings.whiteBandWidth;
      uniforms.uDiffusion.value = settings.diffusion;
      uniforms.uSegmentation.value = settings.segmentation;
      uniforms.uColorIntensity.value = settings.colorIntensity;
      uniforms.uInterference.value = settings.interference;
      uniforms.uSlope.value = settings.slope;
      uniforms.uSeed.value = settings.seed;
      updatePanelCount();
      document.documentElement.style.backgroundColor = settings.greenscreen ? '#00ff00' : settings.backgroundColor;
    }

    function updatePanelCount() {
      uniforms.uPanels.value = Math.round(THREE.MathUtils.clamp(
        settings.panels * Math.sqrt(uniforms.uAspect.value / 0.75), 8, 64));
    }

    function refreshControls() {
      gui.controllersRecursive().forEach(controller => controller.updateDisplay());
    }

    const randomBetween = (min, max) => min + Math.random() * (max - min);
    const pick = values => values[Math.floor(Math.random() * values.length)];
    function randomize() {
      settings.scheme = pick(Object.keys(schemes).filter(name => name !== settings.scheme));
      settings.invertMonochrome = Math.random() < 0.5;
      settings.animation = pick(Object.keys(animations).filter(name => name !== 'Static'));
      settings.panels = Math.round(randomBetween(14, 34));
      settings.slope = randomBetween(0.12, 0.32);
      settings.seed = Math.round(randomBetween(1, 1000));
      settings.whiteBandWidth = randomBetween(0.7, 1.35);
      settings.waveAmplitude = randomBetween(0.009, 0.025);
      settings.spectralDisplacement = randomBetween(0.006, 0.021);
      settings.segmentation = randomBetween(0.68, 1);
      settings.diffusion = randomBetween(0.7, 1.4);
      settings.interference = randomBetween(0.3, 1.2);
      settings.colorIntensity = randomBetween(0.85, 1.1);
      settings.motion = randomBetween(0.55, 1.25);
      settings.speed = randomBetween(0.35, 1.05);
      applyScheme();
    }

    const actions = {
      randomize,
      resetView() {
        Object.assign(settings, { zoom: 1, angle: 0, orbitAngle: 12, panX: 0, panY: 0 });
        refreshControls();
      },
      resetAll() {
        Object.assign(settings, defaults);
        elapsed = 0;
        syncSettings();
        resize();
        invertController.disable();
        refreshControls();
      }
    };

    // Stock lil-gui appearance. No help text, custom panel CSS, or overlays.
    const gui = new GUI({ title: 'Chromatic Cascade' });
    gui.add(settings, 'scheme', Object.keys(schemes)).name('Color scheme').onChange(applyScheme);
    const invertController = gui.add(settings, 'invertMonochrome').name('Invert monochrome').onChange(applyScheme).disable();
    gui.add(settings, 'animation', Object.keys(animations)).name('Animation');
    gui.add(settings, 'speed', 0, 2, 0.01).name('Animation speed');
    gui.add(settings, 'randomizeOnClick').name('Randomize on click');
    gui.add(actions, 'randomize').name('New variation');

    const backgroundFolder = gui.addFolder('Background');
    backgroundFolder.add(settings, 'greenscreen').name('Greenscreen');
    backgroundFolder.addColor(settings, 'backgroundColor').name('Background color');
    backgroundFolder.close();

    const colorFolder = gui.addFolder('Light colors');
    colorKeys.forEach(key => colorFolder.addColor(settings, key).name(key.charAt(0).toUpperCase() + key.slice(1)));
    colorFolder.addColor(settings, 'coreColor').name('Pearl core');
    colorFolder.addColor(settings, 'shadowColor').name('Lower shadow');
    colorFolder.addColor(settings, 'lowerShadowColor').name('Far shadow');
    colorFolder.add(settings, 'colorIntensity', 0.25, 1.5, 0.01).name('Color intensity');
    colorFolder.close();

    const viewFolder = gui.addFolder('Camera');
    viewFolder.add(settings, 'zoom', 0.25, 5, 0.01).name('Zoom').listen();
    viewFolder.add(settings, 'angle', -180, 180, 0.1).name('View angle').listen();
    viewFolder.add(settings, 'orbitAngle', -60, 60, 0.1).name('Orbit angle');
    viewFolder.add(settings, 'panX', -3, 3, 0.001).name('Position X').listen();
    viewFolder.add(settings, 'panY', -3, 3, 0.001).name('Position Y').listen();
    viewFolder.add(settings, 'cameraMotion', 0, 2, 0.01).name('Camera motion');
    viewFolder.add(actions, 'resetView').name('Reset camera');
    viewFolder.close();

    const opticalFolder = gui.addFolder('Optical field');
    opticalFolder.add(settings, 'panels', 10, 42, 1).name('Shutter count');
    opticalFolder.add(settings, 'slope', 0.08, 0.34, 0.001).name('Cascade slope');
    opticalFolder.add(settings, 'whiteBandWidth', 0.45, 1.6, 0.01).name('Pearl width');
    opticalFolder.add(settings, 'segmentation', 0, 1, 0.01).name('Shutter refraction');
    opticalFolder.add(settings, 'diffusion', 0.35, 1.6, 0.01).name('Light diffusion');
    opticalFolder.add(settings, 'motion', 0, 1.8, 0.01).name('Motion strength');
    opticalFolder.add(settings, 'waveAmplitude', 0, 0.03, 0.001).name('Cascade wave');
    opticalFolder.add(settings, 'spectralDisplacement', 0, 0.035, 0.001).name('Spectral drift');
    opticalFolder.add(settings, 'interference', 0, 1.5, 0.01).name('Interference');
    opticalFolder.add(settings, 'seed', 0, 1000, 1).name('Variation seed');
    opticalFolder.close();

    const renderFolder = gui.addFolder('Rendering');
    renderFolder.add(settings, 'pixelRatio', 0.5, 3, 0.05).name('Pixel ratio (DPR)').onChange(resize);
    renderFolder.add(actions, 'resetAll').name('Reset all');
    renderFolder.close();
    gui.onChange(syncSettings);

    function resize() {
      const width = Math.max(1, window.innerWidth);
      const height = Math.max(1, window.innerHeight);
      // Honor the selected DPR directly, independently of the device default.
      renderer.setPixelRatio(settings.pixelRatio);
      renderer.setSize(width, height, false);
      renderer.getDrawingBufferSize(uniforms.uResolution.value);
      uniforms.uAspect.value = width / height;
      updatePanelCount();
    }

    function updateView(phase) {
      const treatment = animations[settings.animation];
      const staticMode = settings.animation === 'Static';
      const strength = staticMode ? 0 : settings.motion;
      uniforms.uPhase.value = staticMode ? 0 : phase;
      uniforms.uMotion.value.set(treatment.wave, treatment.breath, treatment.drift, treatment.texture).multiplyScalar(strength);
      uniforms.uDirection.value = treatment.direction;
      uniforms.uHarmonic.value = treatment.harmonic;

      const t = (phase - Math.floor(phase)) * Math.PI * 2;
      const amplitude = staticMode ? 0 : settings.cameraMotion;
      let x = 0, y = 0, roll = 0, zoom = 1, yaw = 0, pitch = 0;
      if (settings.animation === 'Slow orbit') {
        x = 0.024 * Math.cos(t) * amplitude;
        y = 0.018 * Math.sin(t) * amplitude;
        roll = 0.035 * Math.sin(t) * amplitude;
        yaw = THREE.MathUtils.degToRad(settings.orbitAngle) + 0.09 * Math.sin(t) * amplitude;
        pitch = 0.055 * Math.cos(t) * amplitude;
        zoom = 1 + 0.025 * Math.sin(t - 0.6) * amplitude;
      } else if (settings.animation === 'Floating camera') {
        x = 0.03 * Math.sin(t) * amplitude;
        y = 0.023 * Math.sin(t * 2 + 0.7) * amplitude;
        zoom = 1 + 0.025 * Math.cos(t) * amplitude;
      } else if (settings.animation === 'Opaline drift') {
        y = 0.012 * Math.sin(t) * amplitude;
        roll = 0.012 * Math.sin(t + 0.8) * amplitude;
      }
      uniforms.uZoom.value = settings.zoom * zoom;
      uniforms.uAngle.value = THREE.MathUtils.degToRad(settings.angle) + roll;
      uniforms.uPan.value.set(settings.panX + x, settings.panY + y);
      uniforms.uTilt.value.set(yaw, pitch);
    }

    // Camera offsets are separate from the user's zoom/angle/position. The
    // wheel and drag therefore keep working during every animation preset.
    canvas.addEventListener('wheel', event => {
      event.preventDefault();
      const unit = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? window.innerHeight : 1;
      settings.zoom = THREE.MathUtils.clamp(settings.zoom * Math.exp(-event.deltaY * unit * 0.001), 0.25, 5);
    }, { passive: false });

    let gesture = null;
    const activePointers = new Set();
    canvas.addEventListener('pointerdown', event => {
      if (event.button !== 0) return;
      activePointers.add(event.pointerId);
      canvas.setPointerCapture(event.pointerId);
      if (activePointers.size > 1) {
        if (gesture) gesture.cancelled = true;
        return;
      }
      gesture = { id: event.pointerId, startX: event.clientX, startY: event.clientY,
                  x: event.clientX, y: event.clientY, dragged: false, cancelled: false };
      canvas.style.cursor = 'grabbing';
    });
    canvas.addEventListener('pointermove', event => {
      if (!gesture || gesture.id !== event.pointerId || gesture.cancelled) return;
      if (Math.hypot(event.clientX - gesture.startX, event.clientY - gesture.startY) > 5) gesture.dragged = true;
      if (gesture.dragged) {
        settings.panX = THREE.MathUtils.clamp(settings.panX + (event.clientX - gesture.x) / window.innerHeight, -3, 3);
        settings.panY = THREE.MathUtils.clamp(settings.panY + (event.clientY - gesture.y) / window.innerHeight, -3, 3);
      }
      gesture.x = event.clientX;
      gesture.y = event.clientY;
    });
    function endGesture(event) {
      activePointers.delete(event.pointerId);
      if (!gesture || gesture.id !== event.pointerId) return;
      const click = event.type === 'pointerup' && !gesture.cancelled && !gesture.dragged;
      gesture = null;
      canvas.style.cursor = 'grab';
      if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
      if (click && settings.randomizeOnClick) randomize();
    }
    canvas.addEventListener('pointerup', endGesture);
    canvas.addEventListener('pointercancel', endGesture);
    canvas.addEventListener('lostpointercapture', endGesture);

    window.addEventListener('keydown', event => {
      if (event.repeat || event.ctrlKey || event.metaKey || event.altKey) return;
      if (event.code === 'KeyH' || event.key.toLowerCase() === 'h') {
        gui.show(gui._hidden);
      }
    });

    let elapsed = 0;
    let previousTime = null;
    let frame;
    let contextLost = false;
    function animate(now) {
      if (contextLost || document.hidden) return;
      // Integrate speed changes without jumping to another point in the loop.
      if (previousTime !== null && settings.animation !== 'Static') {
        elapsed = (elapsed + (now - previousTime) / 1000 * settings.speed) % settings.loopSeconds;
      }
      previousTime = now;
      updateView(elapsed / settings.loopSeconds);
      renderer.render(scene, camera);
      frame = requestAnimationFrame(animate);
    }

    window.addEventListener('resize', resize, { passive: true });
    document.addEventListener('visibilitychange', () => {
      cancelAnimationFrame(frame);
      previousTime = null;
      if (!document.hidden && !contextLost) frame = requestAnimationFrame(animate);
    });
    canvas.addEventListener('webglcontextlost', event => {
      event.preventDefault();
      contextLost = true;
      cancelAnimationFrame(frame);
    });
    canvas.addEventListener('webglcontextrestored', () => {
      contextLost = false;
      previousTime = null;
      resize();
      if (!document.hidden) frame = requestAnimationFrame(animate);
    });

    syncSettings();
    resize();
    frame = requestAnimationFrame(animate);
  </script>
</body>
</html>
