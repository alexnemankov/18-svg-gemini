<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>600 - Orthogonal Circuit Labyrinth</title>

  <!-- p5.js v2.3.3 from official recommended CDN -->
  <script src="https://cdn.jsdelivr.net/npm/p5@2.3.3/lib/p5.min.js"></script>
  <!-- lil-gui for modern interactive controls -->
  <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.19/dist/lil-gui.umd.min.js"></script>

  <style>
    /* ============================================================
       CSS Reset & Viewport UX
       ============================================================ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #dcdcdc;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "JetBrains Mono", monospace;
    }

    /* Edge-to-Edge Fullscreen Canvas */
    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      margin: 0;
      padding: 0;
      border: none;
      outline: none;
    }

    canvas {
      display: block;
      width: 100vw !important;
      height: 100vh !important;
      outline: none;
      border: none;
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }

    /* ============================================================
       lil-gui Custom Glassmorphic Dark Aesthetic
       ============================================================ */
    .lil-gui {
      --background-color: rgba(12, 15, 22, 0.88) !important;
      --text-color: #e2e8f0 !important;
      --title-background-color: rgba(20, 25, 36, 0.95) !important;
      --widget-color: rgba(32, 38, 54, 0.75) !important;
      --hover-color: rgba(50, 60, 85, 0.9) !important;
      --focus-color: #00f0ff !important;
      --number-color: #38bdf8 !important;
      --string-color: #4ade80 !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "JetBrains Mono", monospace !important;
      border-radius: 10px !important;
      backdrop-filter: blur(20px) !important;
      -webkit-backdrop-filter: blur(20px) !important;
      border: 1px solid rgba(255, 255, 255, 0.12) !important;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.65) !important;
      margin-top: 14px;
      margin-right: 14px;
      z-index: 1000;
    }

    .lil-gui .title {
      font-weight: 700 !important;
      letter-spacing: 0.08em !important;
      text-transform: uppercase !important;
      font-size: 11px !important;
    }
  </style>
</head>
<body>

  <div id="canvas-container"></div>

  <script>
    // ============================================================
    // p5.js Port (top -> topIdx) - Orthogonal Circuit Labyrinth
    // ============================================================

    // 19 Curated Color Schemes Pattern
    const COLOR_SCHEMES = {
      'Original': {

      },
      'Achromatic + Accent': {

        bg: '#080808',
        tracks: ['#242424', '#484848', '#707070', '#9c9c9c', '#d0d0d0', '#ff1e44', '#e60026', '#ff3355'],
        node: '#ff1e44',
        glow: 'rgba(255, 30, 68, 0.65)',

      },
      'Neutral + accent': {
        name: 'Neutral + accent (Slate & Electric Gold)',
        bg: '#121110',
        tracks: ['#2c2824', '#4a443c', '#786e62', '#b0a596', '#ded6cb', '#ffb703', '#00f0ff'],
        node: '#ffb703',
        glow: 'rgba(255, 183, 3, 0.6)',
        isDark: true
      },
      'Palette 12: F6AA1C, BC3908, 941B0C': {
        name: 'Palette 12: (F6AA1C, BC3908, 941B0C, F6AA1C, 220901)',
        bg: '#220901',

        isDark: true
      },
      'Palette 13: 63D1CF, 5BC0BE, 4BAD9E': {
        name: 'Palette 13: (63D1CF, 5BC0BE, 4BAD9E, 4BAD9E, 0B132B, 000000)',

        tracks: ['#63d1cf', '#5bc0be', '#4bad9e', '#378a7c', '#0b132b', '#7ef5f3'],
        node: '#63d1cf',
        glow: 'rgba(99, 209, 207, 0.6)',
        isDark: true
      },
      'Palette 14: AA60C8, D69ADE, C9A3C6': {
        name: 'Palette 14: (AA60C8, D69ADE, C9A3C6, CFB5C2, 0D001D, 120A12)',
        bg: '#0d001d',
        tracks: ['#aa60c8', '#d69ade', '#c9a3c6', '#cfb5c2', '#7b2cbf', '#f0c6fa'],
        node: '#d69ade',
        glow: 'rgba(214, 154, 222, 0.6)',
        isDark: true
      },
      'Palette 15: FEF1BE, FFBA00, 008189': {
        name: 'Palette 15: (FEF1BE, FFBA00, 008189, 00474D, 061210)',
        bg: '#061210',
        tracks: ['#fef1be', '#ffba00', '#008189', '#00474d', '#00adb5', '#ffe066'],
        node: '#ffba00',
        glow: 'rgba(255, 186, 0, 0.6)',
        isDark: true
      },
      'Palette 16: D4FFB0, 7FFF00, 00B894': {
        name: 'Palette 16: (D4FFB0, 7FFF00, 00B894, 0A3322, 05140A)',
        bg: '#05140a',
        tracks: ['#d4ffb0', '#7fff00', '#00b894', '#0a3322', '#00e676', '#69f0ae'],
        node: '#7fff00',
        glow: 'rgba(127, 255, 0, 0.6)',
        isDark: true
      },
      'Palette 17: FFE8CC, FF8C00, C7501A': {
        name: 'Palette 17: (FFE8CC, FF8C00, C7501A, 3D1050, 0E0618)',
        bg: '#0e0618',
        tracks: ['#ffe8cc', '#ff8c00', '#c7501a', '#3d1050', '#e85d04', '#ffa94d'],
        node: '#ff8c00',
        glow: 'rgba(255, 140, 0, 0.6)',
        isDark: true
      },
      'Palette 18: E8E0FF, B38FFF, 6A3DE8': {
        name: 'Palette 18: (E8E0FF, B38FFF, 6A3DE8, 1A1250, 090612)',
        bg: '#090612',
        tracks: ['#e8e0ff', '#b38fff', '#6a3de8', '#1a1250', '#9b5de5', '#c4a3ff'],
        node: '#b38fff',
        glow: 'rgba(179, 143, 255, 0.6)',
        isDark: true
      },
      'Palette 19: E0FBFF, 00F0FF, D40078': {
        name: 'Palette 19: (E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)',
        bg: '#05020f',
        tracks: ['#e0fbff', '#00f0ff', '#d40078', '#1e0a3d', '#ff2a8d', '#7df9ff'],
        node: '#00f0ff',
        glow: 'rgba(0, 240, 255, 0.65)',
        isDark: true
      }
    };

    // ============================================================
    // Global Interactive State & Parameters
    // ============================================================
    const settings = {
      // 19 Curated Color Schemes
      colorScheme: 'Original',

      // Animation & Timing
      animSpeed: 1.0,
      growthSpeed: 1.0,
      driftSpeed: 1.0,
      isPlaying: true,

      // Geometry & Runners (Original defaults: m=25, swMult=1.0, nodeSize=5, dots)
      m: 25,
      strokeWeightMult: 1.0,
      nodeSize: 5.0,
      nodeStyle: 'Dots',     // 'Dots', 'Rings', 'Diamonds', 'Squares', 'Crosshairs', 'None'
      highlightHead: false,
      glowEnabled: false,
      glowIntensity: 0,
      showGrid: false,

      // Interaction & UX
      clickToRandomize: true,
      zoom: 1.0,

      // Actions
      regenerate: () => randomizeAll(),
      resetCamera: () => resetView(),
      resetToOriginal: () => resetToOriginalAnimation(),
      clearAndRestart: () => reseedScene(true),
      saveSnapshot: () => saveCanvas('circuit_labyrinth_' + Date.now(), 'png')
    };

    // Core original algorithm variables
    let m = 25;
    let n = 3000;

    let b = new Array(m); // boolean[]
    let x = Array.from({ length: m }, () => new Float32Array(n)); // float[m][n]
    let y = Array.from({ length: m }, () => new Float32Array(n)); // float[m][n]
    let l = new Array(m).fill(0);
    let sw = new Array(m).fill(0);
    let d = new Array(m).fill(0);
    let da = new Array(m).fill(0);
    let ds = new Array(m).fill(0);
    let topIdx = new Array(m).fill(0); // int[] (NICHT "top")

    let s = new Array(m).fill(0);
    let sb = new Array(m).fill(0);
    let sc = new Array(m).fill(0);

    // Camera Pan & Zoom Transform State
    let panX = 0, panY = 0;
    let targetPanX = 0, targetPanY = 0;
    let zoomLevel = 1.0, targetZoom = 1.0;
    let isDragging = false;
    let dragStartX = 0, dragStartY = 0;
    let startPanX = 0, startPanY = 0;
    let totalDragDistance = 0;

    let gui = null;

    // ============================================================
    // Runner Lifecycle & Growth Engine
    // ============================================================
    function initRunner(i, isRespawn = false) {
      b[i] = (random(1) > 0.5);

      l[i] = int(random(1, 6)) * 20; // 20, 40, 60, 80, 100
      d[i] = map(l[i], 10, 100, 5, 10);
      da[i] = d[i];
      ds[i] = map(l[i], 10, 100, 1.15, 0.15);

      x[i][0] = random(l[i] + 5, width - l[i] - 5);
      y[i][0] = height;

      sw[i] = random(0.25, 4.0);
      topIdx[i] = 1;
      s[i] = 0.0;
      sb[i] = int(l[i]);
      sc[i] = 0;
    }

    function reallocateArrays(newM) {
      m = newM;
      b = new Array(m);
      x = Array.from({ length: m }, () => new Float32Array(n));
      y = Array.from({ length: m }, () => new Float32Array(n));
      l = new Array(m).fill(0);
      sw = new Array(m).fill(0);
      d = new Array(m).fill(0);
      da = new Array(m).fill(0);
      ds = new Array(m).fill(0);
      topIdx = new Array(m).fill(0);
      s = new Array(m).fill(0);
      sb = new Array(m).fill(0);
      sc = new Array(m).fill(0);
    }

    function reseedScene(runVorlauf = true) {
      if (m !== settings.m) {
        reallocateArrays(settings.m);
      }

      for (let i = 0; i < m; i++) {
        initRunner(i, false);
      }

      if (runVorlauf) {
        // Vorlauf / Aufbau (wie Processing-setup)
        for (let i = 0; i < m; i++) {
          for (let k = 0; k < 200; k++) {
            if (y[i][topIdx[i] - 1] > 0.85 * height) {
              growRunner(i);
            }
          }
        }
      }
    }

    function growRunner(i) {
      let curTop = topIdx[i];
      if (curTop <= 0) {
        curTop = 1;
        topIdx[i] = 1;
      }
      let prev = curTop - 1;
      let px = x[i][prev];
      let py = y[i][prev];
      let stepL = l[i];

      if (b[i] === true) {
        if (px < stepL + 5) {
          x[i][curTop] = px + stepL;
          y[i][curTop] = py;
        } else if (px > (width - stepL - 5)) {
          x[i][curTop] = px - stepL;
          y[i][curTop] = py;
        } else {
          if (random(1) > 0.5) {
            x[i][curTop] = px + stepL;
            y[i][curTop] = py;
          } else {
            x[i][curTop] = px - stepL;
            y[i][curTop] = py;
          }
        }
        b[i] = !b[i];
      } else {
        x[i][curTop] = px;
        y[i][curTop] = py - stepL + 1;
        b[i] = !b[i];
      }

      topIdx[i]++;

      // High-performance circular/sliding buffer to maintain infinite continuity without NaN
      if (topIdx[i] >= n - 1) {
        let prune = 600;
        x[i].copyWithin(0, prune, topIdx[i]);
        y[i].copyWithin(0, prune, topIdx[i]);
        topIdx[i] -= prune;
      }
    }

    // ============================================================
    // p5.js Core Lifecycle
    // ============================================================
    function setup() {
      const container = document.getElementById('canvas-container');
      const w = container.clientWidth || windowWidth;
      const h = container.clientHeight || windowHeight;
      const cnv = createCanvas(w, h);
      cnv.parent('canvas-container');

      strokeCap(ROUND);
      strokeJoin(ROUND);

      reseedScene(true);
      initGUI();
    }

    function windowResized() {
      const container = document.getElementById('canvas-container');
      const w = container.clientWidth || windowWidth;
      const h = container.clientHeight || windowHeight;
      resizeCanvas(w, h);
    }

    function draw() {
      const currentScheme = COLOR_SCHEMES[settings.colorScheme] || COLOR_SCHEMES['Original'];
      document.body.style.backgroundColor = currentScheme.bg;
      background(currentScheme.bg);

      // Smooth camera interpolation
      panX = lerp(panX, targetPanX, 0.16);
      panY = lerp(panY, targetPanY, 0.16);
      zoomLevel = lerp(zoomLevel, targetZoom, 0.16);
      settings.zoom = parseFloat(zoomLevel.toFixed(2));

      push();
      // Apply Camera Transform
      translate(width / 2 + panX, height / 2 + panY);
      scale(zoomLevel);
      translate(-width / 2, -height / 2);

      // Optional Faint Circuit Grid
      if (settings.showGrid) {
        drawCircuitGrid(currentScheme);
      }

      // Configure Glow Context
      if (settings.glowEnabled && settings.glowIntensity > 0) {
        drawingContext.shadowBlur = settings.glowIntensity;
        drawingContext.shadowColor = currentScheme.glow;
      } else {
        drawingContext.shadowBlur = 0;
      }

      // ------------------------------------------------------------
      // Zeichnen / Render Circuit Tracks
      // ------------------------------------------------------------
      for (let j = 0; j < m; j++) {
        let ad = map(l[j], 10, 50, 0.85, 1.15);
        let curStrokeWeight = sw[j] * settings.strokeWeightMult;
        strokeWeight(curStrokeWeight);

        // Palette track color
        let trackColor;
        if (settings.colorScheme === 'Original') {
          trackColor = color(10 + 5 * j);
        } else {
          let colHex = currentScheme.tracks[j % currentScheme.tracks.length];
          trackColor = color(colHex);
        }

        stroke(trackColor);
        fill(currentScheme.node || trackColor);

        let curTop = topIdx[j];
        let curS = s[j];
        let xj = x[j];
        let yj = y[j];

        // Draw segments & nodes
        for (let i = 0; i < curTop; i++) {
          if (((sc[j] + i) % curTop) !== (curTop - 1)) {
            let x1 = xj[(sc[j] + i)];
            let y1 = yj[(sc[j] + i)] + curS;
            let x2 = xj[(sc[j] + i + 1)];
            let y2 = yj[(sc[j] + i + 1)] + curS;

            line(x1, y1, x2, y2);

            let nSize = settings.nodeSize;
            if (nSize > 0) {
              renderNode(x1, y1, nSize, settings.nodeStyle);
              renderNode(x2, y2, nSize, settings.nodeStyle);
            }
          }
        }

        // Highlight head vertex
        if (settings.highlightHead && curTop > 0) {
          let headX = xj[curTop - 1];
          let headY = yj[curTop - 1] + curS;
          push();
          fill(currentScheme.node || trackColor);
          stroke(255, 230);
          strokeWeight(1.2);
          ellipse(headX, headY, settings.nodeSize * 1.5, settings.nodeSize * 1.5);
          pop();
        }

        // Downward drift update
        if (settings.isPlaying && settings.animSpeed > 0) {
          s[j] += ad * settings.driftSpeed * settings.animSpeed;
          // Smooth normalization to avoid large integer drift and prevent abrupt visual jumps
          if (s[j] > 3000) {
            for (let k = 0; k < curTop; k++) {
              yj[k] += s[j];
            }
            s[j] = 0;
          }
        }
      }

      // ------------------------------------------------------------
      // Wachstum / Growth Update
      // ------------------------------------------------------------
      if (settings.isPlaying && settings.animSpeed > 0) {
        for (let i = 0; i < m; i++) {
          if (d[i] <= 0) {
            d[i] = da[i];
            growRunner(i);
          } else {
            d[i] -= ds[i] * settings.growthSpeed * settings.animSpeed;
          }

          // Eternal living ecology: respawn runners that have drifted completely past screen bounds
          let curTop = topIdx[i];
          if (curTop > 0) {
            let tailY = y[i][0] + s[i];
            let headY = y[i][curTop - 1] + s[i];
            if (tailY > height + 350 && headY > height + 200) {
              initRunner(i, true);
            } else if (headY < -height * 1.5) {
              initRunner(i, true);
            }
          }
        }
      }

      pop();
    }

    // ============================================================
    // Node Geometry Renderers
    // ============================================================
    function renderNode(x, y, size, style) {
      if (style === 'None') return;

      if (style === 'Dots') {
        ellipse(x, y, size, size);
      } else if (style === 'Rings') {
        push();
        noFill();
        strokeWeight(1.3);
        ellipse(x, y, size * 1.2, size * 1.2);
        pop();
      } else if (style === 'Diamonds') {
        push();
        translate(x, y);
        rotate(QUARTER_PI);
        rectMode(CENTER);
        rect(0, 0, size * 0.9, size * 0.9);
        pop();
      } else if (style === 'Squares') {
        rectMode(CENTER);
        rect(x, y, size * 0.9, size * 0.9);
      } else if (style === 'Crosshairs') {
        push();
        strokeWeight(1.2);
        line(x - size * 0.8, y, x + size * 0.8, y);
        line(x, y - size * 0.8, x, y + size * 0.8);
        pop();
      }
    }

    function drawCircuitGrid(scheme) {
      push();
      strokeWeight(0.5);
      stroke(scheme.isDark ? 'rgba(255, 255, 255, 0.035)' : 'rgba(0, 0, 0, 0.045)');
      const step = 40;
      for (let gx = 0; gx <= width; gx += step) {
        line(gx, 0, gx, height);
      }
      for (let gy = 0; gy <= height; gy += step) {
        line(0, gy, width, gy);
      }
      pop();
    }

    // ============================================================
    // Interactive Zoom with Wheel & Pan with Drag
    // ============================================================
    function mouseWheel(event) {
      // Do not zoom when hovering over GUI
      if (event.target && event.target.closest && event.target.closest('.lil-gui')) {
        return;
      }

      const zoomFactor = event.deltaY < 0 ? 1.09 : 0.91;
      const newZoom = constrain(targetZoom * zoomFactor, 0.2, 10.0);

      // Cursor-anchored smooth zoom
      const mx = mouseX - width / 2;
      const my = mouseY - height / 2;
      targetPanX = mx - (mx - targetPanX) * (newZoom / targetZoom);
      targetPanY = my - (my - targetPanY) * (newZoom / targetZoom);
      targetZoom = newZoom;

      return false; // Prevent browser page scroll
    }

    function mousePressed(event) {
      if (event.target && event.target.closest && event.target.closest('.lil-gui')) {
        return;
      }
      isDragging = true;
      dragStartX = mouseX;
      dragStartY = mouseY;
      startPanX = targetPanX;
      startPanY = targetPanY;
      totalDragDistance = 0;
    }

    function mouseDragged(event) {
      if (!isDragging) return;
      if (event.target && event.target.closest && event.target.closest('.lil-gui')) {
        return;
      }
      const dx = mouseX - dragStartX;
      const dy = mouseY - dragStartY;
      totalDragDistance = Math.hypot(dx, dy);
      targetPanX = startPanX + dx;
      targetPanY = startPanY + dy;
    }

    function mouseReleased(event) {
      if (!isDragging) return;
      isDragging = false;

      // Pure click detection (distance moved < 6px)
      if (totalDragDistance < 6) {
        if (settings.clickToRandomize) {
          randomizeAll();
        }
      }
    }

    // Multi-touch Pan & Pinch-to-Zoom Support for Mobile/Touchscreens
    let touchStartDist = 0;
    let touchStartZoom = 1.0;

    window.addEventListener('touchstart', (e) => {
      if (e.target && e.target.closest && e.target.closest('.lil-gui')) return;
      if (e.touches.length === 1) {
        isDragging = true;
        dragStartX = e.touches[0].clientX;
        dragStartY = e.touches[0].clientY;
        startPanX = targetPanX;
        startPanY = targetPanY;
        totalDragDistance = 0;
      } else if (e.touches.length === 2) {
        isDragging = false;
        touchStartDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        touchStartZoom = targetZoom;
      }
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (e.target && e.target.closest && e.target.closest('.lil-gui')) return;
      if (e.touches.length === 1 && isDragging) {
        const dx = e.touches[0].clientX - dragStartX;
        const dy = e.touches[0].clientY - dragStartY;
        totalDragDistance = Math.hypot(dx, dy);
        targetPanX = startPanX + dx;
        targetPanY = startPanY + dy;
        e.preventDefault();
      } else if (e.touches.length === 2) {
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        if (touchStartDist > 0) {
          targetZoom = constrain(touchStartZoom * (dist / touchStartDist), 0.2, 10.0);
        }
        e.preventDefault();
      }
    }, { passive: false });

    window.addEventListener('touchend', (e) => {
      if (isDragging && totalDragDistance < 8 && e.touches.length === 0) {
        if (settings.clickToRandomize) {
          randomizeAll();
        }
      }
      if (e.touches.length === 0) {
        isDragging = false;
      }
    });

    // Spacebar to Randomize & Keyboard Shortcuts
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
      if (e.code === 'Space') {
        e.preventDefault();
        randomizeAll();
      } else if (e.code === 'KeyR') {
        resetView();
      } else if (e.code === 'KeyP') {
        settings.isPlaying = !settings.isPlaying;
        updateGuiDisplays();
      }
    });

    function resetView() {
      targetPanX = 0;
      targetPanY = 0;
      targetZoom = 1.0;
    }

    // ============================================================
    // Procedural Randomization Engine
    // ============================================================
    function randomizeAll() {
      // 1. Pick a new color scheme from the 19 preconfigured schemes
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      let nextScheme = settings.colorScheme;
      while (nextScheme === settings.colorScheme && schemeKeys.length > 1) {
        nextScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      }
      settings.colorScheme = nextScheme;

      // 2. Re-roll motion and speed parameters
      settings.animSpeed = parseFloat((0.7 + Math.random() * 1.3).toFixed(2));
      settings.growthSpeed = parseFloat((0.8 + Math.random() * 0.8).toFixed(2));
      settings.driftSpeed = parseFloat((0.7 + Math.random() * 0.9).toFixed(2));

      // 3. Re-roll geometric structure & styling
      settings.strokeWeightMult = parseFloat((0.7 + Math.random() * 1.6).toFixed(2));
      settings.nodeSize = parseFloat((3 + Math.random() * 5.5).toFixed(1));

      const styles = ['Dots', 'Rings', 'Diamonds', 'Squares', 'Crosshairs'];
      settings.nodeStyle = styles[Math.floor(Math.random() * styles.length)];

      const isDark = COLOR_SCHEMES[settings.colorScheme].isDark;
      if (isDark) {
        settings.glowEnabled = Math.random() > 0.15;
        settings.glowIntensity = Math.floor(8 + Math.random() * 16);
      } else {
        settings.glowEnabled = false;
        settings.glowIntensity = 0;
      }

      // 4. Re-roll runner count
      settings.m = Math.floor(22 + Math.random() * 20);

      // 5. Re-seed scene and prewarm
      reseedScene(true);

      // 6. Update GUI display controllers
      updateGuiDisplays();
    }

    function resetToOriginalAnimation() {
      settings.colorScheme = 'Original';
      settings.animSpeed = 1.0;
      settings.growthSpeed = 1.0;
      settings.driftSpeed = 1.0;
      settings.isPlaying = true;
      settings.m = 25;
      settings.strokeWeightMult = 1.0;
      settings.nodeSize = 5.0;
      settings.nodeStyle = 'Dots';
      settings.highlightHead = false;
      settings.glowEnabled = false;
      settings.glowIntensity = 0;
      settings.showGrid = false;
      resetView();
      reseedScene(true);
      updateGuiDisplays();
    }

    function updateGuiDisplays(folder = gui) {
      if (!folder) return;
      if (folder.controllers) {
        folder.controllers.forEach(c => {
          try { c.updateDisplay(); } catch (e) {}
        });
      }
      if (folder.folders) {
        folder.folders.forEach(f => updateGuiDisplays(f));
      }
    }

    // ============================================================
    // lil-gui Interactive Control Panel
    // ============================================================
    function initGUI() {
      gui = new lil.GUI({ title: '600 // CIRCUIT LABYRINTH' });

      // Theme & Palette Folder (19 Schemes)
      const fPalette = gui.addFolder('Color Schemes (19)');
      fPalette.add(settings, 'colorScheme', Object.keys(COLOR_SCHEMES))
        .name('Active Scheme')
        .onChange(() => {
          const isDark = COLOR_SCHEMES[settings.colorScheme].isDark;
          if (!isDark) {
            settings.glowEnabled = false;
          }
          updateGuiDisplays();
        });

      fPalette.add(settings, 'glowEnabled').name('Glow Bloom');
      fPalette.add(settings, 'glowIntensity', 0, 35, 1).name('Glow Blur');
      fPalette.add(settings, 'showGrid').name('Grid Matrix');

      // Motion & Speed Folder
      const fMotion = gui.addFolder('Animation & Speed');
      fMotion.add(settings, 'animSpeed', 0.0, 3.5, 0.05).name('Global Speed');
      fMotion.add(settings, 'growthSpeed', 0.1, 3.0, 0.05).name('Growth Rate');
      fMotion.add(settings, 'driftSpeed', 0.0, 3.0, 0.05).name('Drift Speed');
      fMotion.add(settings, 'isPlaying').name('Playing / Running');

      // Geometry & Runners Folder
      const fGeom = gui.addFolder('Circuit Geometry');
      fGeom.add(settings, 'm', 10, 60, 1).name('Runner Count').onFinishChange(() => reseedScene(true));
      fGeom.add(settings, 'strokeWeightMult', 0.2, 3.5, 0.1).name('Trace Width');
      fGeom.add(settings, 'nodeSize', 0, 14, 0.5).name('Node Radius');
      fGeom.add(settings, 'nodeStyle', ['Dots', 'Rings', 'Diamonds', 'Squares', 'Crosshairs', 'None']).name('Node Style');
      fGeom.add(settings, 'highlightHead').name('Glowing Head');

      // Interaction & UX Folder
      const fUX = gui.addFolder('Interaction & View');
      fUX.add(settings, 'clickToRandomize').name('Click to Randomize');
      fUX.add(settings, 'zoom', 0.2, 10.0, 0.01).name('Zoom Level').listen().onChange(val => {
        targetZoom = val;
      });

      // Actions Folder
      const fActions = gui.addFolder('Actions');
      fActions.add(settings, 'resetToOriginal').name('⏮ Original Animation');
      fActions.add(settings, 'regenerate').name('🎲 Reseed & Randomize');
      fActions.add(settings, 'resetCamera').name('🎯 Reset View');
      fActions.add(settings, 'clearAndRestart').name('🔄 Clear & Restart');
      fActions.add(settings, 'saveSnapshot').name('📷 Capture PNG');

      fPalette.open();
    }
  </script>
</body>
