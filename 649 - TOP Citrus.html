<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#8cd3ef">
  <meta name="description" content="A living summer photograph. Procedural lemon slices, sparkling water, and slowly moving sunlight, rendered in real time.">
  <title>Sunlit Citrus</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { background: #8cd3ef; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
    canvas.dragging { cursor: grabbing; }
    #fallback { display: none; position: fixed; inset: 0; padding: 12vw; place-content: center;
      color: #286076; background: #c4eaf5; font: 18px/1.6 system-ui, sans-serif; }
    #fallback.visible { display: grid; }
  </style>
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
      "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
    } }
  </script>
</head>
<body>
  <canvas aria-label="Translucent fresh lemon slices floating in sparkling blue water beneath moving sunlight"></canvas>
  <div id="fallback" role="status">This scene needs WebGL 2 and an internet connection to load Three.js. Please open it in a current browser.</div>
  <script type="module">
    // One file, no image textures. Three.js and lil-gui are pinned CDN dependencies.
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
    import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
    import GUI from 'lil-gui';

    const canvas = document.querySelector('canvas');
    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: 'high-performance' });
    } catch (error) {
      document.querySelector('#fallback').classList.add('visible');
      throw error;
    }
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;
    renderer.setClearColor(0x89cce9, 1);

    const TAU = Math.PI * 2;
    const LOOP = 60;
    const mobile = matchMedia('(max-width: 700px)').matches;
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
    const settings = {
      scheme: 'Original', invert: false, greenscreen: false,
      flesh: '#fff184', peel: '#f5c711', pith: '#fff9df', water: '#8fd9ed',
      background: '#68b7da', accent: '#ffffff',
      pixelRatio: Math.min(devicePixelRatio || 1, mobile ? 1.5 : 2),
      animation: 'Living photograph', animationSpeed: 1, motionAmount: 1,
      cameraAmount: 1, respectReducedMotion: true,
      zoom: 1, positionX: 0, positionY: 0, azimuth: 0, elevation: 0,
      dragTarget: 'Slice under pointer', sliceSize: 1, spread: 1, bubbleSize: 1,
      variationSeed: 649, randomizeOnClick: true,
      randomize: () => randomizeScene(), resetView: () => resetView()
    };
    // Roles: flesh, peel, pith, water light, background, accent.
    // The last eight entries retain every supplied palette color, including duplicates.
    const schemes = {
      'Original': ['FFF184', 'F5C711', 'FFF9DF', '8FD9ED', '68B7DA', 'FFFFFF'],
      'Monochromatic': ['83CEE8', '2377A3', 'DEF7FF', '83CEE8', '123A56', 'B9E8F8'],
      'Analogous': ['D7F06D', '65B867', 'FFFFD9', '53BFC1', '194E65', 'D9F6BC'],
      'Complementary': ['FFBC58', 'E37B28', 'FFEAC9', '659BD4', '153B72', '8FD8FF'],
      'Split-complementary': ['FFD166', 'EFAE24', 'FFF3CE', '6CC6BA', '543E85', 'BB91E8'],
      'Triadic': ['F9D65B', 'EE7A58', 'FFF1C8', '7FC5E1', '46306B', 'DF7FB6'],
      'Tetradic': ['FFD166', 'F07A88', 'FFF1D6', '70D5C4', '354875', 'B5A0ED'],
      'Double split-complementary': ['F4C66D', 'E78C7B', 'F5EBCF', '81C7B8', '454B7C', 'B8A1D8'],
      'Achromatic': ['FFFFFF', '777777', '242424', '858585', '050505', 'FFFFFF'],
      'Achromatic + Accent': ['F5F5F5', 'EF233C', '242424', '777777', '080808', 'EF233C'],
      'Neutral + accent': ['DDD4C4', 'C67542', 'F4EFE6', 'A6B0AB', '303A3B', 'EA7950'],
      'Ember': ['F6AA1C', 'BC3908', '941B0C', 'F6AA1C', '220901', 'F6AA1C'],
      'Tidal teal': ['63D1CF', '5BC0BE', '4BAD9E', '4BAD9E', '0B132B', '000000'],
      'Orchid': ['AA60C8', 'D69ADE', 'C9A3C6', 'CFB5C2', '0D001D', '120A12'],
      'Lagoon gold': ['FEF1BE', 'FFBA00', 'FEF1BE', '008189', '061210', '00474D'],
      'Chlorophyll': ['D4FFB0', '7FFF00', 'D4FFB0', '00B894', '05140A', '0A3322'],
      'Tangerine dusk': ['FFE8CC', 'FF8C00', 'FFE8CC', 'C7501A', '0E0618', '3D1050'],
      'Violet moon': ['E8E0FF', 'B38FFF', 'E8E0FF', '6A3DE8', '090612', '1A1250'],
      'Electric tide': ['E0FBFF', '00F0FF', 'E0FBFF', 'D40078', '05020F', '1E0A3D']
    };
    const animations = {
      'Living photograph': { drift: 1, tilt: 1, turn: 1, orbit: 0, glide: 0, breath: 0 },
      'Gentle drift':      { drift: 2.3, tilt: .7, turn: .6, orbit: 0, glide: 0, breath: 0 },
      'Lazy current':      { drift: 3.6, tilt: .8, turn: 1.5, orbit: 0, glide: 0, breath: 0 },
      'Citrus waltz':      { drift: 1.8, tilt: 1.1, turn: 3, orbit: 0, glide: 0, breath: 0 },
      'Buoyant sway':      { drift: 1.2, tilt: 2.4, turn: 1, orbit: 0, glide: 0, breath: .035 },
      'Sunlit orbit':      { drift: 1.1, tilt: 1, turn: .8, orbit: 1, glide: 0, breath: .025 },
      'Macro glide':       { drift: .7, tilt: .7, turn: .7, orbit: .25, glide: 1, breath: .065 },
      'Static': null
    };
    let motionProfile = animations[settings.animation];
    let needsRender = true;
    let paletteMix = 0, backgroundMix = 0, customColors = false;
    const themeUniforms = {
      uPaletteMix: { value: 0 }, uBackgroundMix: { value: 0 },
      uFlesh: { value: new THREE.Color(settings.flesh) },
      uPeel: { value: new THREE.Color(settings.peel) },
      uPith: { value: new THREE.Color(settings.pith) },
      uWaterLight: { value: new THREE.Color(settings.water) },
      uBackground: { value: new THREE.Color(settings.background) },
      uAccent: { value: new THREE.Color(settings.accent) },
      uMonochrome: { value: 0 }, uInverted: { value: 0 }
    };
    const resolution = new THREE.Vector2();
    const viewSize = new THREE.Vector2();
    const time = { value: 0 }; // Radians, periodic at 2 PI. Every animation reads this phase.
    const camera = new THREE.OrthographicCamera(-8, 8, 5, -5, 0.1, 80);
    camera.position.set(0, 0, 25);
    camera.lookAt(0, 0, 0);
    const screenCamera = camera.clone();
    const cameraRight = new THREE.Vector3(1, 0, 0);
    const cameraUp = new THREE.Vector3(0, 1, 0);
    const arrangementOffset = new THREE.Vector3();
    const cameraFocus = new THREE.Vector3();
    const waterScene = new THREE.Scene();
    const citrusScene = new THREE.Scene();
    const finalScene = new THREE.Scene();
    const targetOptions = { type: THREE.HalfFloatType, minFilter: THREE.LinearFilter,
      magFilter: THREE.LinearFilter, depthBuffer: true, stencilBuffer: false };
    const waterTarget = new THREE.WebGLRenderTarget(1, 1, targetOptions);
    const citrusTarget = new THREE.WebGLRenderTarget(1, 1, targetOptions);
    const coverageTarget = new THREE.WebGLRenderTarget(1, 1, targetOptions);
    const transparentBackground = { value: 0 };

    // Shared deterministic GLSL. No advancing noise coordinates: time describes a circle.
    const common = /* glsl */`
      #define PI 3.141592653589793
      #define TAU 6.283185307179586
      uniform float uTime;
      uniform float uPaletteMix;
      uniform float uBackgroundMix;
      uniform float uMonochrome;
      uniform float uInverted;
      uniform vec3 uFlesh, uPeel, uPith, uWaterLight, uBackground, uAccent;
      float citrusLuminance(vec3 color) { return dot(color, vec3(.2126, .7152, .0722)); }
      vec3 themedSurface(vec3 original, vec3 tint) {
        float light = clamp(citrusLuminance(original), 0.0, 2.0);
        vec3 shaded = tint * (.35 + light * .9);
        shaded += vec3(.035) * smoothstep(.5, 1.6, light);
        return mix(original, shaded, uPaletteMix);
      }
      float hash21(vec2 p) {
        vec3 p3 = fract(vec3(p.xyx) * .1031);
        p3 += dot(p3, p3.yzx + 33.33);
        return fract((p3.x + p3.y) * p3.z);
      }
      vec2 hash22(vec2 p) { return vec2(hash21(p), hash21(p + 27.91)); }
      float noise(vec2 p) {
        vec2 i = floor(p), f = fract(p);
        f = f * f * (3.0 - 2.0 * f);
        return mix(mix(hash21(i), hash21(i + vec2(1, 0)), f.x),
          mix(hash21(i + vec2(0, 1)), hash21(i + 1.0), f.x), f.y);
      }
      float fbm(vec2 p) {
        return .55 * noise(p) + .28 * noise(p * 2.03 + 7.1) + .17 * noise(p * 4.09 + 19.7);
      }
      float smin(float a, float b, float k) {
        float h = max(k - abs(a - b), 0.0) / k;
        return min(a, b) - h * h * k * .25;
      }
      vec3 juiceCells(vec2 p) {
        vec2 id = floor(p), f = fract(p), nearest = vec2(0);
        float first = 100.0, second = 100.0;
        for (int y = -1; y <= 1; y++) {
          for (int x = -1; x <= 1; x++) {
            vec2 cell = vec2(float(x), float(y));
            vec2 d = cell + .18 + .64 * hash22(id + cell) - f;
            float dist = dot(d, d);
            if (dist < first) { second = first; first = dist; nearest = d; }
            else { second = min(second, dist); }
          }
        }
        vec3 normal = normalize(vec3(nearest * vec2(.8, .38), .62));
        float light = dot(normal, normalize(vec3(-.6, .7, 1.0)));
        return vec3(sqrt(first), sqrt(second) - sqrt(first), light);
      }
      vec2 loopFlow() { return vec2(cos(uTime), sin(uTime)); }
      float cellEdge(vec2 p) {
        vec2 id = floor(p), f = fract(p);
        float first = 100.0, second = 100.0;
        for (int y = -1; y <= 1; y++) {
          for (int x = -1; x <= 1; x++) {
            vec2 offset = vec2(float(x), float(y));
            vec2 point = .5 + .39 * sin(TAU * hash22(id + offset) + vec2(0.9, 1.4));
            vec2 d = offset + point - f;
            float dist = dot(d, d);
            if (dist < first) { second = first; first = dist; }
            else { second = min(second, dist); }
          }
        }
        return (sqrt(second) - sqrt(first));
      }
      vec2 causticField(vec2 p) {
        vec2 f = loopFlow();
        p = p * .47;
        p += .65 * vec2(sin(p.y * 1.93 + f.x * .65), cos(p.x * 1.77 + f.y * .65));
        p += .23 * vec2(sin(p.y * 3.3 - f.y * .5), sin(p.x * 2.6 + f.x * .6));
        float d = cellEdge(p + f * .14);
        float width = .024 + .016 * noise(p * 3.0);
        float core = exp(-d * d / (width * width));
        float halo = exp(-d * d / .014);
        return vec2(core, halo);
      }
    `;
    const planeVertex = /* glsl */`
      varying vec2 vUv;
      varying vec2 vWorld;
      void main() {
        vUv = uv;
        vec4 world = modelMatrix * vec4(position, 1.0);
        vWorld = world.xy;
        gl_Position = projectionMatrix * viewMatrix * world;
      }
    `;
    const planeGeometry = new THREE.PlaneGeometry(1, 1);
    const waterMaterial = new THREE.ShaderMaterial({
      uniforms: { ...themeUniforms, uTime: time, uResolution: { value: resolution } },
      vertexShader: planeVertex,
      fragmentShader: common + /* glsl */`
        uniform vec2 uResolution;
        varying vec2 vUv;
        varying vec2 vWorld;
        void main() {
          vec2 p = vWorld;
          vec2 f = loopFlow();
          vec2 bend = .18 * vec2(sin(p.y * .73 + f.x), cos(p.x * .82 + f.y));
          float depth = fbm(p * .24 + bend + f * .08);
          float sun = exp(-length((vUv - vec2(.79, .95)) * vec2(1.5, 1.2)) * 2.0);
          vec3 col = mix(vec3(.045, .27, .48), vec3(.20, .55, .76), depth);
          col = mix(col, vec3(.60, .78, .88), sun * .65);
          col += .025 * sin(p.x * .45 + p.y * .6 + f.x);
          vec3 tintedWater = mix(uBackground, uWaterLight, depth * .58 + sun * .30);
          col = mix(col, tintedWater, uBackgroundMix);
          vec2 light = causticField(p + bend);
          vec2 light2 = causticField(p * 1.62 + vec2(13.4, 5.2));
          float caustic = light.x * 1.6 + light.y * .15 + light2.x * .065;
          vec3 causticTint = mix(vec3(.87, 1.02, 1.08), mix(uWaterLight, vec3(1.0), .68), uBackgroundMix);
          if (uMonochrome > .5 && uInverted > .5) col *= 1.0 - min(caustic * .52, .90);
          else col += causticTint * caustic;
          float streak = pow(max(0.0, sin(p.x * .6 + p.y * .75 + sin(p.y * 1.2 + f.x) * .6)), 38.0);
          col += streak * .08;
          col += mix(vec3(.50, .55, .51), uWaterLight * .3, uBackgroundMix) * pow(sun, 4.0);
          if (uMonochrome > .5) col = vec3(citrusLuminance(col));
          gl_FragColor = vec4(col, 1.0);
        }
      `,
      depthTest: false, depthWrite: false
    });
    const waterPlane = new THREE.Mesh(planeGeometry, waterMaterial);
    waterPlane.position.z = -8;
    waterScene.add(waterPlane);

    function texturePlane(texture, z, clearAlpha = { value: 0 }) {
      const material = new THREE.ShaderMaterial({
        uniforms: { uTexture: { value: texture }, uClearAlpha: clearAlpha },
        vertexShader: `varying vec2 vUv; void main() {
          vUv = uv; gl_Position = vec4(position.xy * 2.0, .999, 1.0); }`,
        fragmentShader: `uniform sampler2D uTexture; uniform float uClearAlpha; varying vec2 vUv;
          void main() { vec4 color = texture2D(uTexture, vUv);
            gl_FragColor = vec4(color.rgb, color.a * (1.0 - uClearAlpha)); }`,
        depthTest: false, depthWrite: false
      });
      const mesh = new THREE.Mesh(planeGeometry, material);
      mesh.position.z = z;
      mesh.renderOrder = -10;
      return mesh;
    }
    const waterBackground = texturePlane(waterTarget.texture, -7, transparentBackground);
    const photograph = texturePlane(citrusTarget.texture, -7);
    citrusScene.add(waterBackground);
    finalScene.add(photograph);

    const lemonVertex = /* glsl */`
      varying vec2 vDisk;
      varying vec3 vWorld;
      varying vec3 vNormal;
      varying vec2 vUv;
      void main() {
        vDisk = uv * 2.0 - 1.0;
        vUv = uv;
        vec4 world = modelMatrix * vec4(position, 1.0);
        vWorld = world.xyz;
        vNormal = normalize(mat3(modelMatrix) * normal);
        gl_Position = projectionMatrix * viewMatrix * world;
      }
    `;
    const lemonFragment = common + /* glsl */`
      uniform float uSeed;
      uniform float uSegments;
      uniform float uDepth;
      uniform sampler2D uWater;
      uniform vec2 uResolution;
      varying vec2 vDisk;
      varying vec3 vWorld;
      varying vec3 vNormal;
      varying vec2 vUv;
      void main() {
        vec2 q = vDisk;
        vec2 coreOffset = vec2(sin(uSeed * 8.1), cos(uSeed * 3.7)) * .018;
        vec2 fleshPoint = q - coreOffset;
        float r = length(q);
        float a = atan(fleshPoint.y, fleshPoint.x);
        float fr = length(fleshPoint);
        float warpedAngle = a + .035 * sin(a * 3.0 + uSeed) + .016 * sin(fr * 11.0 + a * 5.0) + .006 * sin(fr * 31.0 + a * 7.0);
        float sector = (warpedAngle + PI) / TAU * uSegments;
        float id = floor(sector);
        float f = fract(sector);
        float random = hash21(vec2(id, uSeed));
        float outer = .795 + .017 * sin(id * 7.1 + uSeed) + .008 * sin(a * 21.0 + uSeed);
        float inner = .060 + .016 * sin(a * uSegments + .7);
        float angularDistance = fr * sin(min(f, 1.0 - f) * TAU / uSegments);
        float membraneWidth = .0065 + .004 * random + .009 * pow(fr / .85, 5.0);
        float boundary = smin(outer - fr, angularDistance - membraneWidth, .040);
        boundary = smin(boundary, fr - inner, .035);
        float aa = max(fwidth(boundary), .0008);
        float isFlesh = smoothstep(-aa, aa, boundary);

        // Pulp vesicles: narrow cells follow diverging radial fibres, with branching
        // at different lengths, so they read as juice sacs rather than concentric rings.
        float bend = noise(vec2(a * 17.0 + uSeed, fr * 18.0));
        float fibrePhase = a * 192.0 + bend * 6.0 + sin(fr * 19.0 + id) * 1.2;
        float fibres = pow(.5 + .5 * sin(fibrePhase), 13.0);
        float finePhase = a * 485.0 + sin(fr * 32.0 + a * 22.0) * 2.0 + bend * 8.0;
        float fine = pow(.5 + .5 * sin(finePhase), 24.0);
        float vesicle = noise(vec2(a * 115.0 + bend * 1.4, fr * 27.0));
        float cellular = noise(vec2(a * 225.0 + bend, fr * 58.0));
        vec3 sacs = juiceCells(vec2(a * 48.0 + bend * .6, fr * 18.0 + uSeed));
        float sacMembrane = 1.0 - smoothstep(.015, .10, sacs.y);
        float tissue = fbm(q * 18.0 + uSeed * 3.0);
        float cloudy = fbm(q * 5.0 + uSeed);
        float lightEdge = exp(-max(boundary, 0.0) * 90.0);
        float transmission = .5 + .5 * sin(a * 2.0 + fr * 3.0 + uSeed);
        vec3 pulp = mix(vec3(.88, .57, .009), vec3(1.24, 1.02, .11), tissue * .66 + random * .18);
        float sacBody = 1.0 - smoothstep(.10, .72, sacs.x);
        pulp *= .48 + vesicle * .17 + cellular * .06 + sacs.z * .43 + sacBody * .19;
        pulp += vec3(.13, .15, .022) * fibres * (.25 + vesicle * .75);
        pulp += vec3(.12, .14, .025) * fine * smoothstep(.12, .55, fr) * .25;
        pulp += vec3(.18, .18, .035) * pow(cloudy, 2.0);
        pulp += vec3(.13, .12, .028) * sacMembrane;
        pulp += vec3(.24, .24, .08) * pow(max(sacs.z, 0.0), 18.0);
        pulp = mix(pulp, vec3(1.55, 1.37, .48), lightEdge * .40);
        pulp += vec3(.20, .20, .005) * transmission;
        // Backlit, almost translucent ends of the juice vesicles.
        float glints = pow(vesicle, 10.0) * 2.0 + pow(cellular, 18.0) * .6;
        pulp += glints * vec3(.75, .70, .20);

        // Fine, warm pith with a slight cool cast from the surrounding water.
        float pithGrain = noise(q * 145.0 + uSeed) * .6 + noise(q * 350.0) * .4;
        vec3 pith = vec3(.95, 1.02, .80) * (.94 + pithGrain * .09);
        float pithShade = smoothstep(.83, .965, r) * (.5 - .5 * dot(normalize(q + .001), normalize(vec2(.7, .9))));
        pith = mix(pith, vec3(.55, .77, .76), pithShade * .30);
        pith += .15 * exp(-pow((r - .85) / .025, 2.0));
        vec3 col = mix(pith, pulp, isFlesh);
        float center = 1.0 - smoothstep(.025, .08 + .012 * sin(a * 8.0), fr);
        col = mix(col, vec3(1.10, 1.15, .83), center * .72);

        // Porous flavedo, tiny oil glands, and a thin wet highlight on the cut edge.
        float peelStart = .948 + .005 * sin(a * 37.0 + uSeed) + .002 * sin(a * 83.0);
        float peel = smoothstep(peelStart - .003, peelStart + .003, r);
        float pores = noise(q * 220.0 + uSeed);
        float glands = pow(noise(q * 92.0), 4.0);
        vec3 rind = mix(vec3(.89, .57, .006), vec3(1.55, 1.17, .015), pores);
        rind += vec3(.34, .30, .08) * glands;
        rind *= .91 + .12 * sin(a * 113.0 + sin(a * 21.0) * 2.0);
        col = mix(col, rind, peel);
        col += vec3(1.0, .95, .57) * exp(-pow((r - .991) / .0035, 2.0)) * .65;

        vec2 caustic = causticField(vWorld.xy + vec2(.07, -.04));
        col += vec3(1.0, 1.0, .70) * caustic.x * (.16 + isFlesh * .12);
        col += vec3(.09, .11, .07) * caustic.y;
        vec3 wetNormal = normalize(vNormal + vec3(sin(fibrePhase) * .14, cos(finePhase) * .10, 0.0) * isFlesh);
        vec3 light = normalize(vec3(.4, .65, 1.8));
        float spec = pow(max(dot(wetNormal, normalize(light + vec3(0, 0, 1))), 0.0), 130.0);
        col += vec3(.54, .58, .28) * spec * (.14 + fine * .26 + peel * .6);
        float sheen = exp(-dot((q - vec2(.30, .52)) * vec2(2.0, 5.0), (q - vec2(.30, .52)) * vec2(2.0, 5.0)));
        col += vec3(.28, .26, .09) * sheen;
        vec3 materialTint = mix(uPith, uFlesh, isFlesh);
        materialTint = mix(materialTint, uPeel, peel);
        col = themedSurface(col, materialTint);
        vec2 screen = gl_FragCoord.xy / uResolution;
        vec3 water = texture2D(uWater, screen + q * .002).rgb;
        col = mix(col, water, uDepth * .09 * (1.0 - uPaletteMix * .7));
        if (uMonochrome > .5) col = vec3(citrusLuminance(col));
        gl_FragColor = vec4(col, 1.0);
      }
    `;
    const rindFragment = common + /* glsl */`
      uniform float uSeed;
      varying vec3 vWorld;
      varying vec3 vNormal;
      varying vec2 vUv;
      void main() {
        float pores = noise(vUv * vec2(380.0, 20.0) + uSeed);
        float light = .70 + .40 * max(0.0, dot(normalize(vNormal), normalize(vec3(.4, .8, 1.0))));
        vec3 col = mix(vec3(.67, .39, .002), vec3(1.25, .91, .015), pores) * light;
        col += vec3(.55, .66, .51) * pow(max(0.0, vNormal.z), 3.0) * .3;
        vec2 c = causticField(vWorld.xy);
        col += c.x * vec3(.85, .85, .54) * .6;
        col = themedSurface(col, uPeel);
        if (uMonochrome > .5) col = vec3(citrusLuminance(col));
        gl_FragColor = vec4(col, 1.0);
      }

    updateTheme();

    const raycaster = new THREE.Raycaster();
    const pointerNDC = new THREE.Vector2();
    const dragDelta = new THREE.Vector3();
    let drag = null;
    canvas.addEventListener('wheel', event => {
      event.preventDefault();
      const unit = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? innerHeight : 1;
      settings.zoom = THREE.MathUtils.clamp(settings.zoom * Math.exp(-event.deltaY * unit * .001), .25, 5);
      needsRender = true;
    }, { passive: false });
    canvas.addEventListener('contextmenu', event => event.preventDefault());
    canvas.addEventListener('pointerdown', event => {
      if (drag || (event.button !== 0 && event.button !== 2)) return;
      const orbit = event.button === 2 || event.altKey || event.shiftKey;
      pointerNDC.set(event.clientX / innerWidth * 2 - 1, 1 - event.clientY / innerHeight * 2);
      raycaster.setFromCamera(pointerNDC, camera);
      const hits = raycaster.intersectObjects(slices.map(slice => slice.group), true);
      const target = !orbit && settings.dragTarget === 'Slice under pointer' && hits.length
        ? slices[hits[0].object.userData.sliceIndex] : null;
      drag = { id: event.pointerId, startX: event.clientX, startY: event.clientY,
        x: event.clientX, y: event.clientY, moved: false, orbit, target, button: event.button };
      canvas.setPointerCapture(event.pointerId);
    });
    canvas.addEventListener('pointermove', event => {
      if (!drag || drag.id !== event.pointerId) return;
      if (!drag.moved && Math.hypot(event.clientX - drag.startX, event.clientY - drag.startY) < 5) return;
      drag.moved = true;
      canvas.classList.add('dragging');
      const dx = event.clientX - drag.x, dy = event.clientY - drag.y;
      if (drag.orbit) {
        settings.azimuth = THREE.MathUtils.clamp(settings.azimuth + dx * .13, -55, 55);
        settings.elevation = THREE.MathUtils.clamp(settings.elevation + dy * .13, -55, 55);
      } else {
        const x = dx / innerWidth * viewSize.x / camera.zoom;
        const y = -dy / innerHeight * viewSize.y / camera.zoom;
        if (drag.target) {
          dragDelta.copy(cameraRight).multiplyScalar(x).addScaledVector(cameraUp, y);
          drag.target.offset.add(dragDelta);
        } else {
          settings.positionX += x; settings.positionY += y;
        }
      }
      drag.x = event.clientX; drag.y = event.clientY;
      needsRender = true;
    });
    function releasePointer(event, allowRandomize) {
      if (!drag || drag.id !== event.pointerId) return;
      const click = !drag.moved && !drag.orbit && drag.button === 0 &&
        Math.hypot(event.clientX - drag.startX, event.clientY - drag.startY) < 5;
      drag = null;
      canvas.classList.remove('dragging');
      if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
      if (allowRandomize && click && settings.randomizeOnClick) randomizeScene();
      refreshPanel();
    }
    canvas.addEventListener('pointerup', event => releasePointer(event, true));
    canvas.addEventListener('pointercancel', event => releasePointer(event, false));
    canvas.addEventListener('lostpointercapture', () => { drag = null; canvas.classList.remove('dragging'); });
    let uiVisible = true;
    addEventListener('keydown', event => {
      if (event.code !== 'KeyH' || event.repeat || event.ctrlKey || event.metaKey || event.altKey) return;
      const editing = event.target instanceof HTMLElement &&
        (event.target.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(event.target.tagName));
      if (editing) return;
      uiVisible = !uiVisible;
      uiVisible ? gui.show() : gui.hide();
    });

    window.citrus = Object.freeze({ loopDuration: LOOP, renderer, composer, settings, gui,
      schemes: Object.keys(schemes), animations: Object.keys(animations),
      renderAt(seconds) { update(((seconds % LOOP) + LOOP) % LOOP / LOOP * TAU); render(); },
      get phase() { return time.value; } });
    requestAnimationFrame(frame);
    addEventListener('pagehide', (event) => {
      if (event.persisted) return;
      renderer.setAnimationLoop(null);
      waterTarget.dispose(); citrusTarget.dispose(); coverageTarget.dispose(); composer.dispose();
      gui.destroy();
      const geometries = new Set(), materials = new Set();
      for (const scene of [waterScene, citrusScene, finalScene]) scene.traverse(object => {
        if (object.geometry) geometries.add(object.geometry);
        if (object.material) materials.add(object.material);
      });
      geometries.forEach(geometry => geometry.dispose());
      materials.forEach(material => material.dispose());
      renderer.dispose();
    }, { once: true });
  </script>
</body>
</html>
