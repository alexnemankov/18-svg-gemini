<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #D7D6DA;
      user-select: none;
      -webkit-user-select: none;

      display: block;
    }

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
      "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
    }
  }
  </script>

<script type="module">
  import * as THREE from 'three';
  import GUI from 'lil-gui';

  // --- Vertex & Fragment Shaders ---
  const vertexSphereShader = `
    uniform float uTime;
    uniform float mouse;
    uniform float uIdleDeform;
    uniform float uNoiseScale;
    uniform float uNoiseSpeed;
    uniform float uDisplacement;
    varying vec2 vUv;
    float PI = 3.14159265359;

    float mod289(float x){return x - floor(x * (1.0 / 289.0)) * 289.0;}
    vec4 mod289(vec4 x){return x - floor(x * (1.0 / 289.0)) * 289.0;}
    vec4 perm(vec4 x){return mod289(((x * 34.0) + 1.0) * x);}

    float noise(vec3 p){
        vec3 a = floor(p);
        vec3 d = p - a;
        d = d * d * (3.0 - 2.0 * d);

        vec4 b = a.xxyy + vec4(0.0, 1.0, 0.0, 1.0);
        vec4 k1 = perm(b.xyxy);
        vec4 k2 = perm(k1.xyxy + b.zzww);

        vec4 c = k2 + a.zzzz;
        vec4 k3 = perm(c);
        vec4 k4 = perm(c + 1.0);

        vec4 o1 = fract(k3 * (1.0 / 41.0));
        vec4 o2 = fract(k4 * (1.0 / 41.0));

        vec4 o3 = o2 * d.z + o1 * (1.0 - d.z);
        vec2 o4 = o3.yw * d.x + o3.xz * (1.0 - d.x);

        return o4.y * d.y + o4.x * (1.0 - d.y);
    }

    void main(){
      float deform = mouse + uIdleDeform;
      float noisy = deform * pow(noise(normal * uNoiseScale + uTime * uNoiseSpeed), 2.0);
      vec3 newPosition = position + noisy * normal * uDisplacement;
      vec4 mvPosition = modelViewMatrix * vec4(newPosition, 1.0);
      vUv = uv;
      gl_Position = projectionMatrix * mvPosition;
    }
  `;

  const fragmentSphereShader = `
    uniform float uTime;
    uniform sampler2D uTexture;
    uniform vec3 uColorTint;
    uniform float uBrightness;
    varying vec2 vUv;

    void main () {
      vec4 color = texture2D(uTexture, vUv);
      gl_FragColor = vec4(color.rgb * uBrightness * uColorTint, 1.0);
    }
  `;

  const vertexFloorShader = `
    uniform float uTime;
    uniform float mouse;
    uniform float uIdleDeform;
    uniform float uFloorPosScale;
    uniform float uNoiseSpeed;
    uniform float uDisplacement;
    varying vec2 vUv;
    float PI = 3.14159265359;

    float mod289(float x){return x - floor(x * (1.0 / 289.0)) * 289.0;}
    vec4 mod289(vec4 x){return x - floor(x * (1.0 / 289.0)) * 289.0;}
    vec4 perm(vec4 x){return mod289(((x * 34.0) + 1.0) * x);}

    float noise(vec3 p){
        vec3 a = floor(p);
        vec3 d = p - a;
        d = d * d * (3.0 - 2.0 * d);

        vec4 b = a.xxyy + vec4(0.0, 1.0, 0.0, 1.0);
        vec4 k1 = perm(b.xyxy);
        vec4 k2 = perm(k1.xyxy + b.zzww);

        vec4 c = k2 + a.zzzz;
        vec4 k3 = perm(c);
        vec4 k4 = perm(c + 1.0);

        vec4 o1 = fract(k3 * (1.0 / 41.0));
        vec4 o2 = fract(k4 * (1.0 / 41.0));

        vec4 o3 = o2 * d.z + o1 * (1.0 - d.z);
        vec2 o4 = o3.yw * d.x + o3.xz * (1.0 - d.x);

        return o4.y * d.y + o4.x * (1.0 - d.y);
    }

    void main(){
      float deform = mouse + uIdleDeform;
      float noisy = deform * pow(noise(normal + (position.y * position.x) * uFloorPosScale + uTime * uNoiseSpeed), 2.0);
      vec3 newPosition = position + noisy * 2.0 * normal * uDisplacement;
      vec4 mvPosition = modelViewMatrix * vec4(newPosition, 1.0);
      vUv = uv;
      gl_Position = projectionMatrix * mvPosition;
    }
  `;

  const fragmentFloorShader = `
    uniform float uTime;
    uniform sampler2D uTexture;
    uniform vec3 uColorTint;
    uniform float uBrightness;
    uniform float uOpacity;
    varying vec2 vUv;

    void main () {
      vec4 color = texture2D(uTexture, vUv);
      gl_FragColor = vec4(color.rgb * uBrightness * uColorTint, uOpacity);
    }
  `;

  // --- Color Utilities ---
  function hexToRgb(hex) {
    hex = hex.replace('#', '').trim();
    if (hex.length === 3) {
      hex = hex.split('').map(c => c + c).join('');
    }
    const num = parseInt(hex, 16);
    return {
      r: (num >> 16) & 255,
      g: (num >> 8) & 255,
      b: num & 255
    };
  }

  function interpolateRgb(c1, c2, f) {
    return {
      r: Math.floor(c1.r + (c2.r - c1.r) * f),
      g: Math.floor(c1.g + (c2.g - c1.g) * f),
      b: Math.floor(c1.b + (c2.b - c1.b) * f)
    };
  }

  function makeGradientFromRgb(colors) {
    const g = [];
    const segments = colors.length - 1;
    const segLength = 256 / segments;
    for (let i = 0; i < 256; i++) {
      const seg = Math.min(Math.floor(i / segLength), segments - 1);
      const f = (i - seg * segLength) / segLength;
      g[i] = interpolateRgb(colors[seg], colors[seg + 1], f);
    }
    return g;
  }

  // --- Preconfigured Color Schemes ---
  const SCHEMES = {

    },

    },
    'Split-complementary': {

    },
    'Triadic': {

    'Tetradic': {

    },
    'Achromatic (white and black)': {
      colors: ['#FFFFFF', '#B5B5B5', '#666666', '#2A2A2A', '#000000']
    },
    'Achromatic + Accent (black and white + red)': {

    },

    },
    'Neutral + accent': {
      colors: ['#1C1917', '#57534E', '#A8A29E', '#FF5400', '#FAFAF9']
    },
    'Palette (F6AA1C, BC3908, 941B0C, F6AA1C, 220901)': {
      colors: ['#F6AA1C', '#BC3908', '#941B0C', '#F6AA1C', '#220901']
    },
    'Palette (63D1CF, 5BC0BE, 4BAD9E, 4BAD9E, 0B132B, 000000)': {
      colors: ['#63D1CF', '#5BC0BE', '#4BAD9E', '#0B132B', '#000000']
    },
    'Palette (AA60C8, D69ADE, C9A3C6, CFB5C2, 0D001D, 120A12)': {
      colors: ['#AA60C8', '#D69ADE', '#C9A3C6', '#CFB5C2', '#0D001D']
    },
    'Palette (FEF1BE, FFBA00, 008189, 00474D, 061210)': {
      colors: ['#FEF1BE', '#FFBA00', '#008189', '#00474D', '#061210']
    },
    'Palette (D4FFB0, 7FFF00, 00B894, 0A3322, 05140A)': {
      colors: ['#D4FFB0', '#7FFF00', '#00B894', '#0A3322', '#05140A']
    },
    'Palette (FFE8CC, FF8C00, C7501A, 3D1050, 0E0618)': {
      colors: ['#FFE8CC', '#FF8C00', '#C7501A', '#3D1050', '#0E0618']
    },
    'Palette (E8E0FF, B38FFF, 6A3DE8, 1A1250, 090612)': {
      colors: ['#E8E0FF', '#B38FFF', '#6A3DE8', '#1A1250', '#090612']
    },
    'Palette (E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)': {
      colors: ['#E0FBFF', '#00F0FF', '#D40078', '#1E0A3D', '#05020F']
    }
  };

  // --- Parameters & Settings ---
  const params = {
    // Colors & Theme
    colorScheme: 'Original',
    animateColors: true,
    brightness: 1.0,
    colorTint: '#ffffff',
    color1: '#FF0055',
    color2: '#FF9900',
    color3: '#FFFF00',
    color4: '#00FFCC',
    color5: '#0066FF',
    // Background & Greenscreen
    greenScreen: false,
    backgroundColor: '#D7D6DA',
    // Transform & Navigation
    zoom: 1.0,
    objectX: 0,
    objectY: 0,
    // Geometry & Noise
    sphereSize: 192,
    sphereDisplacement: 100,
    sphereNoiseScale: 2.0,
    idleDeform: 0.1,
    mouseSensitivity: 1.0,
    showFloor: true,
    floorDisplacement: 300,
    floorOpacity: 1.0,
    // Motion
    speed: 0.1,
    noiseSpeed: 10.0,
    plasmaSpeed: 1.0,
    // Randomizer
    clickToRandomize: true
  };

  // --- Mouse & Pointer Tracking Class ---
  class Mouse {
    constructor(sketch) {
      this.sketch = sketch;
      this.mouse = new THREE.Vector3();
      this.lastX = 0;
      this.lastY = 0;
      this.speed = 0;
      this.setupEvents();
    }
    
    setupEvents() {
      window.addEventListener('pointermove', this.onPointerMove.bind(this), false);
    }

    onPointerMove(e) {
      this.mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      this.mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      this.mouse.z = 0;
      
      this.speed = Math.sqrt((e.pageX - this.lastX) ** 2 + (e.pageY - this.lastY) ** 2) * 0.1;
      this.lastX = e.pageX;
      this.lastY = e.pageY;
    }
  }

  // --- Plasma Procedural Texture Class ---
  class Plasma {
    constructor(ctx, s, sketch) {
      this.ctx = ctx;
      this.size = s;
      this.sketch = sketch;
      this.mapSize = this.size * 2;
      this.initialize();
    }
    
    initialize() {
      this.prevDirection = 1;
      this.dx1 = 0;
      this.dy1 = 0;
      this.dx2 = 0;
      this.dy2 = 0;
      this.heightMap1 = [];
      this.heightMap2 = [];
      this.palette = [];
      this.palettes = [this.makeRandomPalette(), this.makeRandomPalette()];
      this.image = this.ctx.createImageData(this.size, this.size);
      
      this.getImageData();
      this.getHeightMap();
    }

    getImageData() {
      for (let i = 0; i < this.image.data.length; i += 4) {
        this.image.data[i + 0] = 0;
        this.image.data[i + 1] = 0;
        this.image.data[i + 2] = 0;
        this.image.data[i + 3] = 255;
      }
    }

    distance(x, y) {
      return Math.sqrt(x * x + y * y);
    }

    randomColor() {
      return {
        r: Math.floor(Math.random() * 255),
        g: Math.floor(Math.random() * 255),
        b: Math.floor(Math.random() * 255)
      };
    }

    makeRandomPalette() {
      const c1 = this.randomColor();
      const c2 = this.randomColor();
      const c3 = this.randomColor();
      const c4 = this.randomColor();
      const c5 = this.randomColor();
      return makeGradientFromRgb([c1, c2, c3, c4, c5]);
    }

    getCurrentRgbPalette() {
      return [
        hexToRgb(params.color1),
        hexToRgb(params.color2),
        hexToRgb(params.color3),
        hexToRgb(params.color4),
        hexToRgb(params.color5)
      ];
    }

    updatePalette(time) {
      if (params.colorScheme === 'Original') {
        const inter = (Math.cos(time) + 1) / 2;
        const direction = Math.sin(time) >= 0 ? -1 : 1;
        
        if (this.prevDirection !== direction) {
          this.prevDirection = direction;
          if (direction === -1) {
            this.palettes[0] = this.makeRandomPalette();
          } else {
            this.palettes[1] = this.makeRandomPalette();
          }
        }
        
        for (let i = 0; i < 256; i++) {
          this.palette[i] = interpolateRgb(this.palettes[0][i], this.palettes[1][i], inter);
        }
      } else {
        const colors = this.getCurrentRgbPalette();
        if (params.animateColors) {
          const inter = (Math.cos(time) + 1) / 2;
          const palA = makeGradientFromRgb(colors);
          const palB = makeGradientFromRgb([colors[1], colors[2], colors[3], colors[4], colors[0]]);
          for (let i = 0; i < 256; i++) {
            this.palette[i] = interpolateRgb(palA[i], palB[i], inter);
          }
        } else {
          this.palette = makeGradientFromRgb(colors);
        }
      }
    }

    getHeightMap() {
      for (let x = 0; x < this.mapSize; x++) {
        for (let y = 0; y < this.mapSize; y++) {
          const i  = x * this.mapSize + y;
          const cx = x - this.mapSize / 2;
          const cy = y - this.mapSize / 2;
          const d  = this.distance(cx, cy);
          const s  = (Math.PI * 2) / (this.mapSize / 2);
          const r  = Math.sin(d * s);
          const n  = (r + 1) / 2;
          this.heightMap1[i] = Math.floor(n * 128);
        }
      }
      
      for (let x = 0; x < this.mapSize; x++) {
        for (let y = 0; y < this.mapSize; y++) {
          const i  = x * this.mapSize + y;
          const cx = x - this.mapSize / 2;
          const cy = y - this.mapSize / 2;
          const d1 = this.distance(cx, cy) * 0.1;
          const d2 = this.distance(cx, cy) * 0.02;
          const s  = Math.sin(d1);
          const c  = Math.cos(d2);
          const h  = s + c;
          const n  = (h + 2) / 4;
          this.heightMap2[i] = Math.floor(n * 127);
        }
      }
    }

    moveHeightMap(time) {
      const t = time * params.plasmaSpeed;
      this.dx1 = Math.floor((((Math.cos(t * 0.5) + 1) / 2) * this.mapSize) / 2);
      this.dy1 = Math.floor((((Math.sin(t * 0.2) + 1) / 2) * this.mapSize) / 2);
      this.dx2 = Math.floor((((Math.cos(t * 0.3) + 1) / 2) * this.mapSize) / 2);
      this.dy2 = Math.floor((((Math.sin(t * 0.4) + 1) / 2) * this.mapSize) / 2);
    }

    updateImageData() {
      for (let x = 0; x < this.size; x++) {
        for (let y = 0; y < this.size; y++) {
          const i = (x + this.dy1) * this.mapSize + (y + this.dx1);
          const k = (x + this.dy2) * this.mapSize + (y + this.dx2);
          const j = (x * this.size + y) * 4;
          const h = Math.min(255, Math.max(0, this.heightMap1[i] + this.heightMap2[k]));
          const c = this.palette[h] || { r: 128, g: 128, b: 128 };
          
          this.image.data[j]     = c.r;
          this.image.data[j + 1] = c.g;
          this.image.data[j + 2] = c.b;
        }
      }
    }

    drawImageData() {
      this.ctx.putImageData(this.image, 0, 0);
    }

    render(time) {
      this.ctx.clearRect(0, 0, this.size, this.size);
      this.moveHeightMap(time);
      this.updatePalette(time * 2);
      this.updateImageData();
      this.drawImageData();
    }
  }

  // --- Shape Class ---
  class Shape {
    constructor(sketch, x, y, z) {
      this.sketch = sketch;
      this.beta = 0;
      this.position = new THREE.Vector3(x, y, z);
      this.setupSizes();
      this.initialize();
    }

    setupSizes() {
      this.floorSize = Math.max(this.sketch.width * 5, this.sketch.height * 5);
      if (!params.sphereSize) {
        params.sphereSize = this.sketch.width < 768 ? 120 : 192;
      }
    }
    
    initialize() {
      this.createTexture();
      
      // Floor plane
      this.floorGeometry = new THREE.PlaneGeometry(this.floorSize, this.floorSize, 128, 128);
      this.floorMaterial = new THREE.ShaderMaterial({
        side: THREE.DoubleSide,
        transparent: true,
        uniforms: {
          uTime: { value: 0 },
          mouse: { value: 0 },
          uIdleDeform: { value: params.idleDeform },
          uFloorPosScale: { value: 1.0 },
          uNoiseSpeed: { value: params.noiseSpeed },
          uDisplacement: { value: params.floorDisplacement },
          uTexture: { value: this.returnTexture() },
          uColorTint: { value: new THREE.Color(params.colorTint) },
          uBrightness: { value: params.brightness },
          uOpacity: { value: params.floorOpacity }
        },
        vertexShader: vertexFloorShader,
        fragmentShader: fragmentFloorShader
      });

      this.floorMesh = new THREE.Mesh(this.floorGeometry, this.floorMaterial);
      this.floorMesh.position.set(0, -this.sketch.height / 3, 0);
      this.floorMesh.rotation.x = Math.PI / 2;
      this.floorMesh.visible = params.showFloor;
      this.sketch.scene.add(this.floorMesh);
       
      // Sphere
      this.sphereGeometry = new THREE.SphereGeometry(params.sphereSize, 64, 64);
      this.sphereMaterial = new THREE.ShaderMaterial({
        side: THREE.DoubleSide,
        uniforms: {
          uTime: { value: 0 },
          mouse: { value: 0 },
          uIdleDeform: { value: params.idleDeform },
          uNoiseScale: { value: params.sphereNoiseScale },
          uNoiseSpeed: { value: params.noiseSpeed },
          uDisplacement: { value: params.sphereDisplacement },
          uTexture: { value: this.returnTexture() },
          uColorTint: { value: new THREE.Color(params.colorTint) },
          uBrightness: { value: params.brightness }
        },
        vertexShader: vertexSphereShader,
        fragmentShader: fragmentSphereShader
      });
      
      this.sphereMeshV = new THREE.Vector3();
      this.sphereMeshP = new THREE.Vector3(0, 0, 0);

      this.sphereMesh = new THREE.Mesh(this.sphereGeometry, this.sphereMaterial);
      this.sphereMesh.position.set(this.sphereMeshP.x, this.sphereMeshP.y, this.sphereMeshP.z);
      this.sphereMesh.rotation.y = -Math.PI / 2; 
      this.sketch.scene.add(this.sphereMesh);
    }
    
    createTexture() {
      this.canvas = document.createElement('canvas');
      this.ctx = this.canvas.getContext('2d');
      this.length = 256;
      this.canvas.width = this.length;
      this.canvas.height = this.length;
      
      this.plasma = new Plasma(this.ctx, this.length, this.sketch);
      this.plasma.render(0);
      this.texture = new THREE.CanvasTexture(this.canvas);
      this.texture.needsUpdate = true;
    }
    
    returnTexture() {
      return this.texture;
    }
    
    updateTexture(time) {
      this.plasma.render(time * 10);
    }
    
    render(time) {
      // Smoothly spring towards user drag position
      const target = new THREE.Vector3(params.objectX, params.objectY, 0);
      this.sphereMeshV.subVectors(target, this.sphereMeshP).multiplyScalar(0.08);
      this.sphereMeshP.add(this.sphereMeshV);
      this.sphereMesh.position.set(this.sphereMeshP.x, this.sphereMeshP.y, this.sphereMeshP.z);
      
      this.beta -= (this.beta - this.sketch.mouse.speed * params.mouseSensitivity) * 0.05;
      this.sketch.mouse.speed *= 0.99;

      this.texture.needsUpdate = true;
      this.updateTexture(time);
      
      // Update sphere shader uniforms
      this.sphereMesh.material.uniforms.uTime.value = time;
      this.sphereMesh.material.uniforms.mouse.value = this.beta;
      this.sphereMesh.material.uniforms.uIdleDeform.value = params.idleDeform;
      this.sphereMesh.material.uniforms.uNoiseScale.value = params.sphereNoiseScale;
      this.sphereMesh.material.uniforms.uNoiseSpeed.value = params.noiseSpeed;
      this.sphereMesh.material.uniforms.uDisplacement.value = params.sphereDisplacement;
      this.sphereMesh.material.uniforms.uBrightness.value = params.brightness;
      this.sphereMesh.material.uniforms.uColorTint.value.set(params.colorTint);

      // Update floor shader uniforms
      this.floorMesh.visible = params.showFloor;
      this.floorMesh.material.uniforms.uTime.value = time;
      this.floorMesh.material.uniforms.mouse.value = this.beta;
      this.floorMesh.material.uniforms.uIdleDeform.value = params.idleDeform;
      this.floorMesh.material.uniforms.uNoiseSpeed.value = params.noiseSpeed;
      this.floorMesh.material.uniforms.uDisplacement.value = params.floorDisplacement;
      this.floorMesh.material.uniforms.uBrightness.value = params.brightness;
      this.floorMesh.material.uniforms.uOpacity.value = params.floorOpacity;
      this.floorMesh.material.uniforms.uColorTint.value.set(params.colorTint);
    }
  }

  // --- Main Sketch Class ---
  class Sketch {
    constructor() {
      this.createCanvas();
      this.setupEvents();
      this.time = new THREE.Clock(true);
      this.mouse = new Mouse(this);
      this.initialize();
      this.setupInteraction();
    }
    
    createCanvas() {
      this.canvas = document.createElement('canvas');
      this.canvas.style.position = 'fixed';
      this.canvas.style.top = '0';
      this.canvas.style.left = '0';
      this.canvas.style.width = '100%';
      this.canvas.style.height = '100%';
      this.canvas.style.zIndex = '0';
      this.canvas.style.outline = 'none';
      document.body.appendChild(this.canvas);

      // Robust renderer instantiation with fallbacks
      const configs = [
        { canvas: this.canvas, antialias: true, alpha: true, powerPreference: 'high-performance' },
        { canvas: this.canvas, antialias: true, alpha: true, powerPreference: 'default' },
        { canvas: this.canvas, antialias: false, alpha: true, powerPreference: 'default' },
        { canvas: this.canvas, antialias: false, alpha: false, failIfMajorPerformanceCaveat: false },
        { antialias: false, alpha: true }
      ];

      for (const cfg of configs) {
        try {
          this.renderer = new THREE.WebGLRenderer(cfg);
          if (this.renderer && this.renderer.getContext()) {
            break;
          }
        } catch (e) {
          // Continue to next fallback
        }
      }

      if (!this.renderer || !this.renderer.getContext()) {
        const gl = this.canvas.getContext('webgl2') 
                || this.canvas.getContext('webgl') 
                || this.canvas.getContext('experimental-webgl');
        if (gl) {
          this.renderer = new THREE.WebGLRenderer({ canvas: this.canvas, context: gl });
        }
      }

      if (this.renderer && this.renderer.domElement && !this.renderer.domElement.parentNode) {
        document.body.appendChild(this.renderer.domElement);
      }
    }
    
    setupEvents() {
      window.addEventListener('resize', this.onResize.bind(this), false);
    }
    
    onResize() {
      this.width = window.innerWidth;
      this.height = window.innerHeight;

      const fovRadian = (50 / 2) * (Math.PI / 180);
      this.dist = this.height / 2 / Math.tan(fovRadian);

      if (this.camera) {
        this.camera.aspect = this.width / this.height;
        this.camera.far = this.dist * 10;
        this.camera.updateProjectionMatrix();
      }

      if (this.renderer) {
        this.renderer.setSize(this.width, this.height);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      }
    }
    
    initialize() {
      if (this.animationId) {
        cancelAnimationFrame(this.animationId);
      }
      
      this.width = Math.ceil(window.innerWidth);
      this.height = Math.ceil(window.innerHeight);

      this.scene = new THREE.Scene();
      
      this.setupCanvas();
      this.setupCamera();
      this.setupLight();
      this.setupShape();
      
      this.draw();
    }
    
    setupCanvas() {
      if (this.renderer) {
        this.renderer.setSize(this.width, this.height);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      }
      this.updateBackground();
    }

    updateBackground() {
      const col = params.greenScreen ? '#00ff00' : params.backgroundColor;
      if (this.renderer) {
        this.renderer.setClearColor(col, 1.0);
      }
      document.body.style.backgroundColor = col;
    }
    
    setupCamera() {
      const fov = 50;
      const fovRadian = (fov / 2) * (Math.PI / 180);
      
      this.dist = this.height / 2 / Math.tan(fovRadian);
      this.camera = new THREE.PerspectiveCamera(
        fov,
        this.width / this.height,
        0.01,
        this.dist * 10
      );
      
      this.cameraV = new THREE.Vector3();
      this.cameraP = new THREE.Vector3(0, 0, this.dist);

      this.camera.position.set(this.cameraP.x, this.cameraP.y, this.cameraP.z);
      this.camera.lookAt(new THREE.Vector3());
      
      this.scene.add(this.camera);
    }
    
    updateCamera(time) {
      const targetX = this.mouse.mouse.x * 200;
      const targetY = Math.max(this.mouse.mouse.y * 200, -200);
      this.cameraP.x += (targetX - this.cameraP.x) * 0.05;
      this.cameraP.y += (targetY - this.cameraP.y) * 0.05;

      const targetDist = this.dist / Math.max(params.zoom, 0.01);
      this.camera.position.set(
        this.cameraP.x,
        this.cameraP.y,
        targetDist
      );

      this.camera.lookAt(new THREE.Vector3(0, 0, 0));
    }
    
    setupLight() {
      this.directionalLight = new THREE.DirectionalLight(0xffffff);
      this.scene.add(this.directionalLight);

      this.spotLight = new THREE.SpotLight(0xffffff);
      this.spotLightV = new THREE.Vector3();
      this.spotLightP = new THREE.Vector3(0, 0, this.dist * 0.1);

      this.spotLight.position.set(this.spotLightP.x, this.spotLightP.y, this.spotLightP.z);
      this.spotLight.lookAt(new THREE.Vector3());

      this.scene.add(this.spotLight);
    }

    updateLight() {
      this.spotLight.position.set(
        this.cameraP.x,
        this.cameraP.y + 200,
        this.dist
      );
      this.spotLight.lookAt(new THREE.Vector3(0, 0, 0));
    }
    
    setupShape() {
      this.shape = new Shape(this, 0, 0, 0);
    }

    setupInteraction() {
      let isPointerDown = false;
      let pointerStartX = 0;
      let pointerStartY = 0;
      let lastClientX = 0;
      let lastClientY = 0;
      let hasDragged = false;
      let pointerDownTime = 0;

      // Zoom with wheel
      window.addEventListener('wheel', (e) => {
        if (e.target.closest && e.target.closest('.lil-gui')) return;
        e.preventDefault();
        const zoomFactor = Math.exp(-e.deltaY * 0.0018);
        params.zoom = Math.max(0.18, Math.min(5.0, params.zoom * zoomFactor));
        if (controllers.zoom) controllers.zoom.updateDisplay();
      }, { passive: false });

      // Drag object & Click to Randomize
      window.addEventListener('pointerdown', (e) => {
        if (e.target.closest && e.target.closest('.lil-gui')) return;
        isPointerDown = true;
        pointerStartX = e.clientX;
        pointerStartY = e.clientY;
        lastClientX = e.clientX;
        lastClientY = e.clientY;
        hasDragged = false;
        pointerDownTime = performance.now();
      });

      window.addEventListener('pointermove', (e) => {
        if (!isPointerDown) return;
        const dx = e.clientX - lastClientX;
        const dy = e.clientY - lastClientY;
        lastClientX = e.clientX;
        lastClientY = e.clientY;

        const moveDist = Math.hypot(e.clientX - pointerStartX, e.clientY - pointerStartY);
        if (moveDist > 4) {
          hasDragged = true;
        }

        if (hasDragged) {
          params.objectX += dx / params.zoom;
          params.objectY -= dy / params.zoom;
          if (controllers.objectX) controllers.objectX.updateDisplay();
          if (controllers.objectY) controllers.objectY.updateDisplay();
        }
      });

      window.addEventListener('pointerup', (e) => {
        if (!isPointerDown) return;
        isPointerDown = false;

        const duration = performance.now() - pointerDownTime;
        if (!hasDragged && duration < 350) {
          if (params.clickToRandomize) {
            this.randomizeScene();
          }
        }
      });
    }

    randomizeScene() {
      // 1. Pick a random color scheme
      const schemeKeys = Object.keys(SCHEMES);
      const randomKey = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      params.colorScheme = randomKey;
      applyScheme(randomKey);

      // If greenscreen is off, randomize background color
      if (!params.greenScreen) {
        const bgPresets = [
          '#D7D6DA', '#12131C', '#0A0A10', '#1A1829', 
          '#0B132B', '#1E1E24', '#2B2D42', '#0D1B2A', 
          '#F0EFEB', '#EAE2B7'
        ];
        params.backgroundColor = bgPresets[Math.floor(Math.random() * bgPresets.length)];
        this.updateBackground();
      }

      // 2. Re-roll geometric parameters
      params.sphereNoiseScale = parseFloat((1.0 + Math.random() * 3.5).toFixed(2));
      params.sphereDisplacement = Math.round(50 + Math.random() * 150);
      params.sphereSize = Math.round(140 + Math.random() * 100);
      params.floorDisplacement = Math.round(150 + Math.random() * 350);
      params.idleDeform = parseFloat((0.05 + Math.random() * 0.35).toFixed(2));

      if (this.shape && this.shape.sphereMesh) {
        this.shape.sphereMesh.geometry.dispose();
        this.shape.sphereMesh.geometry = new THREE.SphereGeometry(params.sphereSize, 64, 64);
      }

      // 3. Re-roll motion parameters
      params.speed = parseFloat((0.05 + Math.random() * 0.15).toFixed(3));
      params.noiseSpeed = parseFloat((4.0 + Math.random() * 16.0).toFixed(1));
      params.plasmaSpeed = parseFloat((0.5 + Math.random() * 2.0).toFixed(2));

      // 4. Refresh GUI controls
      updateAllGuiControllers();
    }

    draw() {
      const time = this.time.getElapsedTime();
      
      this.shape.render(time * params.speed);

      this.updateCamera(time);
      this.updateLight(time);
      
      if (this.renderer) {
        this.renderer.render(this.scene, this.camera);
      }
      
      this.animationId = requestAnimationFrame(this.draw.bind(this));
    }
  }

  // --- Initialize App & GUI ---
  const controllers = {};

  function applyScheme(schemeName) {
    if (SCHEMES[schemeName]) {
      const cols = SCHEMES[schemeName].colors;
      params.color1 = cols[0];
      params.color2 = cols[1];
      params.color3 = cols[2];
      params.color4 = cols[3];
      params.color5 = cols[4];
    }
  }

  function updateAllGuiControllers() {
    for (const key in controllers) {
      if (controllers[key] && typeof controllers[key].updateDisplay === 'function') {
        controllers[key].updateDisplay();
      }
    }
  }

  function startApp() {
    const sketch = new Sketch();

    // Create lil-gui without custom styling
    const gui = new GUI({ title: 'Plasma Sphere Controls' });

    // 1. Theme & Color Folder
    const fTheme = gui.addFolder('Theme & Color');
    controllers.colorScheme = fTheme.add(params, 'colorScheme', Object.keys(SCHEMES).concat(['Custom'])).name('Color Scheme').onChange((val) => {
      if (val !== 'Custom') {
        applyScheme(val);
        updateAllGuiControllers();
      }
    });
    controllers.animateColors = fTheme.add(params, 'animateColors').name('Animate Palette');
    controllers.brightness = fTheme.add(params, 'brightness', 0.1, 2.5, 0.05).name('Brightness');
    controllers.colorTint = fTheme.addColor(params, 'colorTint').name('Color Tint');

    const fCustomColors = fTheme.addFolder('Custom Palette Colors');
    function onCustomColorTweak() {
      params.colorScheme = 'Custom';
      controllers.colorScheme.updateDisplay();
    }
    controllers.color1 = fCustomColors.addColor(params, 'color1').name('Color 1').onChange(onCustomColorTweak);
    controllers.color2 = fCustomColors.addColor(params, 'color2').name('Color 2').onChange(onCustomColorTweak);
    controllers.color3 = fCustomColors.addColor(params, 'color3').name('Color 3').onChange(onCustomColorTweak);
    controllers.color4 = fCustomColors.addColor(params, 'color4').name('Color 4').onChange(onCustomColorTweak);
    controllers.color5 = fCustomColors.addColor(params, 'color5').name('Color 5').onChange(onCustomColorTweak);

    // 2. Background & Greenscreen
    const fBg = gui.addFolder('Background & Greenscreen');
    controllers.greenScreen = fBg.add(params, 'greenScreen').name('Green Screen (#00ff00)').onChange(() => {
      sketch.updateBackground();
    });
    controllers.backgroundColor = fBg.addColor(params, 'backgroundColor').name('Background Color').onChange(() => {
      if (!params.greenScreen) sketch.updateBackground();
    });

    // 3. Transform & Zoom (Wheel + Drag)
    const fTransform = gui.addFolder('Transform & Zoom');
    controllers.zoom = fTransform.add(params, 'zoom', 0.2, 5.0, 0.01).name('Zoom');
    controllers.objectX = fTransform.add(params, 'objectX', -800, 800, 1).name('Position X');
    controllers.objectY = fTransform.add(params, 'objectY', -800, 800, 1).name('Position Y');
    fTransform.add({ resetTransform: () => {
      params.zoom = 1.0;
      params.objectX = 0;
      params.objectY = 0;
      updateAllGuiControllers();
    }}, 'resetTransform').name('Reset Pos & Zoom');

    // 4. Geometry & Deformation
    const fGeo = gui.addFolder('Geometry & Noise');
    controllers.sphereSize = fGeo.add(params, 'sphereSize', 80, 320, 1).name('Sphere Radius').onChange((val) => {
      if (sketch.shape && sketch.shape.sphereMesh) {
        sketch.shape.sphereMesh.geometry.dispose();
        sketch.shape.sphereMesh.geometry = new THREE.SphereGeometry(val, 64, 64);
      }
    });
    controllers.sphereDisplacement = fGeo.add(params, 'sphereDisplacement', 0, 250, 1).name('Sphere Deform');
    controllers.sphereNoiseScale = fGeo.add(params, 'sphereNoiseScale', 0.5, 6.0, 0.1).name('Noise Frequency');
    controllers.idleDeform = fGeo.add(params, 'idleDeform', 0.0, 0.6, 0.01).name('Idle Deform');
    controllers.mouseSensitivity = fGeo.add(params, 'mouseSensitivity', 0.0, 3.0, 0.1).name('Mouse Reactive');

    // 5. Floor Settings
    const fFloor = gui.addFolder('Floor Settings');
    controllers.showFloor = fFloor.add(params, 'showFloor').name('Show Floor');
    controllers.floorDisplacement = fFloor.add(params, 'floorDisplacement', 0, 600, 10).name('Floor Waves');
    controllers.floorOpacity = fFloor.add(params, 'floorOpacity', 0.0, 1.0, 0.05).name('Floor Opacity');

    // 6. Motion Parameters
    const fMotion = gui.addFolder('Motion Parameters');
    controllers.speed = fMotion.add(params, 'speed', 0.01, 0.3, 0.01).name('Time Scale');
    controllers.noiseSpeed = fMotion.add(params, 'noiseSpeed', 1.0, 30.0, 0.5).name('Noise Speed');
    controllers.plasmaSpeed = fMotion.add(params, 'plasmaSpeed', 0.1, 4.0, 0.1).name('Plasma Speed');

    // 7. Procedural Variation & Click to Randomize
    const fRandom = gui.addFolder('Procedural Variation');
    controllers.clickToRandomize = fRandom.add(params, 'clickToRandomize').name('Click to Randomize');
    fRandom.add({ randomizeNow: () => sketch.randomizeScene() }, 'randomizeNow').name('🎲 Randomize Scene');

    // Keyboard shortcut: "H" key to toggle UI visibility
    let isGuiVisible = true;
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        isGuiVisible = !isGuiVisible;
        gui.domElement.style.display = isGuiVisible ? '' : 'none';
      }
    });
  }

  if (document.readyState === 'loading') {
    window.addEventListener('DOMContentLoaded', startApp);
  } else {
    startApp();
  }
</script>
</body>
