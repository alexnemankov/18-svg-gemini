<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geometric Radial Resonance</title>
  <style>
    @property --amplitude {
      syntax: "<length>";
      initial-value: 0px;
      inherits: false;
    }

    @property --scale {
      syntax: "<number>";
      initial-value: 1;
      inherits: false;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d0f1e;
      user-select: none;
      -webkit-user-select: none;
    }

    #viewport {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: grab;
      overflow: hidden;
      position: relative;
    }

    #viewport:active {
      cursor: grabbing;
    }

    #pan-zoom-container {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      transform-origin: center center;
      will-change: transform;
    }

    .container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 0;
      height: 0;
      pointer-events: none;
    }

    .circle {
      position: absolute;
      width: 100px;
      height: 100px;
      border-radius: 9999999px;
      pointer-events: none;
      will-change: transform, background;
      mix-blend-mode: lighten;
      transform-origin: center center;
      background: radial-gradient(
        circle at 50% 0%,
        #131937,
        #2b3e8c,
        #6a8eff
      );
    }
  </style>
</head>
<body>
  <div id="viewport">
    <div id="pan-zoom-container">
      <div class="container" id="circleContainer">
        <!-- Circles generated dynamically via JS based on circleCount -->
      </div>
    </div>
  </div>

  <script type="module">
    import GUI from "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js";

    // --- COLOR PALETTE PRESETS ---
    const COLOR_PRESETS = {
      "Cosmic Indigo": {
        background: "#0d0f1e",
        innerColor: "#131937",
        midColor: "#2b3e8c",
        outerColor: "#6a8eff",
        blendMode: "lighten"
      },
      "Solar Flare": {
        background: "#0f0506",
        innerColor: "#3d0c0c",
        midColor: "#d93806",
        outerColor: "#ffb326",
        blendMode: "screen"
      },
      "Emerald Aurora": {
        background: "#03130e",
        innerColor: "#052c1e",
        midColor: "#0ea36c",
        outerColor: "#2bfca0",
        blendMode: "screen"
      },
      "Midnight Amethyst": {
        background: "#100518",
        innerColor: "#27093d",
        midColor: "#9b1ece",
        outerColor: "#f55be4",
        blendMode: "lighten"
      },
      "Obsidian Platinum": {
        background: "#09090b",
        innerColor: "#181920",
        midColor: "#666b7a",
        outerColor: "#e2e6ff",
        blendMode: "screen"
      }
    };

    // --- STATE & PARAMETERS ---
    const params = {
      // Presets
      colorPreset: "Cosmic Indigo",
      animationPreset: "Breathing Mandala",
      randomOnClick: true,
      randomize: () => randomizeScene(),

      // Colors
      greenscreen: false,
      background: COLOR_PRESETS["Cosmic Indigo"].background,
      innerColor: COLOR_PRESETS["Cosmic Indigo"].innerColor,
      midColor: COLOR_PRESETS["Cosmic Indigo"].midColor,
      outerColor: COLOR_PRESETS["Cosmic Indigo"].outerColor,
      blendMode: COLOR_PRESETS["Cosmic Indigo"].blendMode,

      // Motion
      speed: 1.0,
      amplitudeMin: 100,
      amplitudeMax: 175,
      scaleMin: 1.0,
      scaleMax: 2.8,
      baseOffset: 30,
      rotationSpeed: 0.2,

      // Geometry
      circleCount: 6,
      circleSize: 100,

      // View / Rendering
      dpr: 1.0,
      zoom: 1.0,
      resetView: () => resetTransform()
    };

    // --- DOM REFERENCES ---
    const viewport = document.getElementById("viewport");
    const panZoomContainer = document.getElementById("pan-zoom-container");
    const circleContainer = document.getElementById("circleContainer");

    // --- PAN & ZOOM STATE ---
    let panX = 0;
    let panY = 0;
    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let dragStartPanX = 0;
    let dragStartPanY = 0;
    let totalDragDistance = 0;

    function updateTransform() {
      const dprScale = params.dpr;
      panZoomContainer.style.transform = `translate(${panX}px, ${panY}px) scale(${params.zoom * dprScale})`;
    }

    function resetTransform() {
      panX = 0;
      panY = 0;
      params.zoom = 1.0;
      updateTransform();
      if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    // --- REBUILD CIRCLES ---
    let circleElements = [];
    function rebuildCircles() {
      circleContainer.innerHTML = "";
      circleElements = [];
      const count = Math.max(3, Math.floor(params.circleCount));
      const stepAngle = 360 / count;

      for (let i = 0; i < count; i++) {
        const circle = document.createElement("div");
        circle.className = "circle";
        circle.dataset.baseAngle = (i * stepAngle).toString();
        circleContainer.appendChild(circle);
        circleElements.push(circle);
      }
      updateCircleStyles();
    }

    function updateCircleStyles() {
      const gradient = `radial-gradient(circle at 50% 0%, ${params.innerColor}, ${params.midColor} 45%, ${params.outerColor} 90%)`;
      const sizePx = `${params.circleSize}px`;

      circleElements.forEach(circle => {
        circle.style.width = sizePx;
        circle.style.height = sizePx;
        circle.style.background = gradient;
        circle.style.mixBlendMode = params.blendMode;
      });

      if (params.greenscreen) {
        document.body.style.background = "#00ff00";
      } else {
        document.body.style.background = params.background;
      }
    }

    function applyColorPreset(presetName) {
      const p = COLOR_PRESETS[presetName];
      if (!p) return;
      params.background = p.background;
      params.innerColor = p.innerColor;
      params.midColor = p.midColor;
      params.outerColor = p.outerColor;
      params.blendMode = p.blendMode;
      updateCircleStyles();
      if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    // --- PROCEDURAL RANDOMIZER ---
    function hslToHex(h, s, l) {
      l /= 100;
      const a = (s * Math.min(l, 1 - l)) / 100;
      const f = n => {
        const k = (n + h / 30) % 12;
        const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
        return Math.round(255 * color).toString(16).padStart(2, "0");
      };
      return `#${f(0)}${f(8)}${f(4)}`;
    }

    function randomizeScene() {
      // Pick a random base hue
      const baseHue = Math.floor(Math.random() * 360);
      const hueShift1 = (baseHue + Math.floor(Math.random() * 60) - 30 + 360) % 360;
      const hueShift2 = (baseHue + Math.floor(Math.random() * 120) - 60 + 360) % 360;

      const bgL = 4 + Math.random() * 6;
      const innerL = 10 + Math.random() * 12;
      const midL = 30 + Math.random() * 25;
      const outerL = 65 + Math.random() * 25;

      params.colorPreset = "Custom";
      params.background = hslToHex(baseHue, 30 + Math.random() * 30, bgL);
      params.innerColor = hslToHex(baseHue, 60 + Math.random() * 30, innerL);
      params.midColor = hslToHex(hueShift1, 70 + Math.random() * 30, midL);
      params.outerColor = hslToHex(hueShift2, 80 + Math.random() * 20, outerL);

      const blendModes = ["lighten", "screen", "difference", "color-dodge", "plus-lighter"];
      params.blendMode = blendModes[Math.floor(Math.random() * blendModes.length)];

      const animationNames = [
        "Breathing Mandala",
        "Orbital Vortex",
        "Radial Pulse",
        "Harmonic Bloom",
        "Static Pose"
      ];
      params.animationPreset = animationNames[Math.floor(Math.random() * animationNames.length)];

      params.speed = parseFloat((0.4 + Math.random() * 1.6).toFixed(2));
      params.amplitudeMin = Math.floor(40 + Math.random() * 100);
      params.amplitudeMax = Math.floor(params.amplitudeMin + 50 + Math.random() * 150);
      params.scaleMin = parseFloat((0.6 + Math.random() * 0.8).toFixed(2));
      params.scaleMax = parseFloat((params.scaleMin + 1.0 + Math.random() * 2.0).toFixed(2));
      params.baseOffset = Math.floor(Math.random() * 360);
      params.rotationSpeed = parseFloat((0.05 + Math.random() * 0.6).toFixed(2));

      params.circleCount = Math.floor(4 + Math.random() * 8);
      params.circleSize = Math.floor(70 + Math.random() * 90);

      rebuildCircles();
      updateCircleStyles();

      if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    // --- ANIMATION ENGINE ---
    let startTime = performance.now();
    let accumulatedTime = 0;
    let lastTimestamp = performance.now();

    function cubicBezierSmooth(t) {
      // Smooth sigmoid-like S-curve approximating bezier(0.8, 0, 0.2, 1)
      return t < 0.5
        ? 4 * t * t * t
        : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    function animate(currentTime) {
      const dt = (currentTime - lastTimestamp) / 1000;
      lastTimestamp = currentTime;

      accumulatedTime += dt * params.speed;
      const t = accumulatedTime;

      const count = circleElements.length;
      const stepAngle = 360 / count;

      for (let i = 0; i < count; i++) {
        const circle = circleElements[i];
        const baseAngle = i * stepAngle;

        let amplitude = params.amplitudeMax;
        let scale = params.scaleMax;
        let currentOffset = params.baseOffset;
        let rotationAngle = 17;

        switch (params.animationPreset) {
          case "Breathing Mandala": {
            // Smooth natural rhythmic breathing
            const rawProgress = (Math.sin(t * 1.5) + 1) / 2;
            const smoothedProgress = cubicBezierSmooth(rawProgress);
            amplitude = params.amplitudeMin + (params.amplitudeMax - params.amplitudeMin) * smoothedProgress;
            scale = params.scaleMin + (params.scaleMax - params.scaleMin) * smoothedProgress;
            currentOffset = params.baseOffset + Math.sin(t * params.rotationSpeed) * 25;
            rotationAngle = 17 + Math.cos(t * 0.5) * 10;
            break;
          }

          case "Orbital Vortex": {
            // Continuous hypnotic orbital drift
            currentOffset = params.baseOffset + t * 25 * params.rotationSpeed;
            const wave = (Math.sin(t * 1.2 + i * 0.3) + 1) / 2;
            amplitude = params.amplitudeMin + (params.amplitudeMax - params.amplitudeMin) * (0.7 + 0.3 * wave);
            scale = params.scaleMin + (params.scaleMax - params.scaleMin) * (0.8 + 0.2 * Math.cos(t * 1.4 + i * 0.4));
            rotationAngle = 17 + t * 15;
            break;
          }

          case "Radial Pulse": {
            // Expanding harmonic wave pulsation
            const cycle = (t * 1.0) % (Math.PI * 2);
            const pulse = Math.pow(Math.sin(cycle * 0.5), 2);
            amplitude = params.amplitudeMin + (params.amplitudeMax - params.amplitudeMin) * pulse;
            scale = params.scaleMin + (params.scaleMax - params.scaleMin) * (0.6 + 0.4 * Math.sin(cycle));
            currentOffset = params.baseOffset;
            rotationAngle = 17;
            break;
          }

          case "Harmonic Bloom": {
            // Petal phase-offset harmonic wave
            const phase = (i / count) * Math.PI * 2;
            const wave = (Math.sin(t * 1.4 + phase) + 1) / 2;
            amplitude = params.amplitudeMin + (params.amplitudeMax - params.amplitudeMin) * wave;
            scale = params.scaleMin + (params.scaleMax - params.scaleMin) * (1 - wave * 0.5);
            currentOffset = params.baseOffset + t * 10 * params.rotationSpeed;
            rotationAngle = 17 + Math.sin(t + phase) * 20;
            break;
          }

          case "Static Pose":
          default: {
            // Serene geometric state without movement
            amplitude = (params.amplitudeMin + params.amplitudeMax) / 2;
            scale = (params.scaleMin + params.scaleMax) / 2;
            currentOffset = params.baseOffset;
            rotationAngle = 17;
            break;
          }
        }

        const totalAngleDeg = baseAngle + currentOffset;
        const totalAngleRad = (totalAngleDeg * Math.PI) / 180;

        const posX = Math.cos(totalAngleRad) * amplitude;
        const posY = -Math.sin(totalAngleRad) * amplitude;
        const rotDeg = -totalAngleDeg + rotationAngle;

        circle.style.transform = `translate(${posX}px, ${posY}px) scale(${scale}) rotate(${rotDeg}deg)`;
      }

      requestAnimationFrame(animate);
    }

    // --- INTERACTIVE DRAG & ZOOM & CLICK EVENTS ---
    viewport.addEventListener("mousedown", (e) => {
      if (e.target.closest(".lil-gui")) return;
      isDragging = true;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      dragStartPanX = panX;
      dragStartPanY = panY;
      totalDragDistance = 0;
    });

    window.addEventListener("mousemove", (e) => {
      if (!isDragging) return;
      const dx = e.clientX - dragStartX;
      const dy = e.clientY - dragStartY;
      totalDragDistance += Math.hypot(dx, dy);
      panX = dragStartPanX + dx;
      panY = dragStartPanY + dy;
      updateTransform();
    });

    window.addEventListener("mouseup", (e) => {
      if (!isDragging) return;
      isDragging = false;
      const clickDist = Math.hypot(e.clientX - dragStartX, e.clientY - dragStartY);
      if (clickDist < 5 && params.randomOnClick) {
        if (!e.target.closest(".lil-gui")) {
          randomizeScene();
        }
      }
    });

    // Touch Support
    let touchStartDist = 0;
    let initialZoom = 1.0;

    viewport.addEventListener("touchstart", (e) => {
      if (e.target.closest(".lil-gui")) return;
      if (e.touches.length === 1) {
        isDragging = true;
        dragStartX = e.touches[0].clientX;
        dragStartY = e.touches[0].clientY;
        dragStartPanX = panX;
        dragStartPanY = panY;
        totalDragDistance = 0;
      } else if (e.touches.length === 2) {
        isDragging = false;
        touchStartDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        initialZoom = params.zoom;
      }
    }, { passive: false });

    window.addEventListener("touchmove", (e) => {
      if (e.touches.length === 1 && isDragging) {
        const dx = e.touches[0].clientX - dragStartX;
        const dy = e.touches[0].clientY - dragStartY;
        totalDragDistance += Math.hypot(dx, dy);
        panX = dragStartPanX + dx;
        panY = dragStartPanY + dy;
        updateTransform();
      } else if (e.touches.length === 2 && touchStartDist > 0) {
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const factor = dist / touchStartDist;
        params.zoom = Math.min(Math.max(initialZoom * factor, 0.2), 5.0);
        updateTransform();
        if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
      }
    }, { passive: false });

    window.addEventListener("touchend", (e) => {
      if (isDragging && e.touches.length === 0) {
        isDragging = false;
        if (totalDragDistance < 5 && params.randomOnClick) {
          if (!e.target.closest(".lil-gui")) {
            randomizeScene();
          }
        }
      }
      if (e.touches.length < 2) {
        touchStartDist = 0;
      }
    });

    // Wheel Zoom
    viewport.addEventListener("wheel", (e) => {
      if (e.target.closest(".lil-gui")) return;
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
      params.zoom = Math.min(Math.max(params.zoom * zoomFactor, 0.2), 5.0);
      updateTransform();
      if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
    }, { passive: false });

    // --- GUI SETUP ---
    const gui = new GUI({ title: "Scene Controls" });

    // Keyboard 'H' to toggle UI
    window.addEventListener("keydown", (e) => {
      if (e.key === "h" || e.key === "H") {
        if (gui._hidden) {
          gui.show();
        } else {
          gui.hide();
        }
      }
    });

    // Preset & Procedural Folder
    const fPresets = gui.addFolder("Presets & Variation");
    fPresets.add(params, "colorPreset", [
      "Cosmic Indigo",
      "Solar Flare",
      "Emerald Aurora",
      "Midnight Amethyst",
      "Obsidian Platinum"
    ]).name("Color Theme").onChange(val => {
      applyColorPreset(val);
    });

    fPresets.add(params, "animationPreset", [
      "Breathing Mandala",
      "Orbital Vortex",
      "Radial Pulse",
      "Harmonic Bloom",
      "Static Pose"
    ]).name("Animation");

    fPresets.add(params, "randomOnClick").name("Random on Click");
    fPresets.add(params, "randomize").name("🎲 Random Variation");

    // Colors Folder
    const fColors = gui.addFolder("Color Palette");
    fColors.add(params, "greenscreen").name("Green Screen (#00ff00)").onChange(val => {
      updateCircleStyles();
    });
    fColors.addColor(params, "background").name("Background").onChange(() => updateCircleStyles());
    fColors.addColor(params, "innerColor").name("Inner Core").onChange(() => updateCircleStyles());
    fColors.addColor(params, "midColor").name("Mid Aura").onChange(() => updateCircleStyles());
    fColors.addColor(params, "outerColor").name("Outer Glow").onChange(() => updateCircleStyles());
    fColors.add(params, "blendMode", [
      "lighten",
      "screen",
      "difference",
      "color-dodge",
      "plus-lighter",
      "normal"
    ]).name("Blend Mode").onChange(() => updateCircleStyles());

    // Motion Folder
    const fMotion = gui.addFolder("Motion Dynamics");
    fMotion.add(params, "speed", 0.0, 5.0, 0.05).name("Speed");
    fMotion.add(params, "amplitudeMin", 10, 300, 1).name("Min Amplitude");
    fMotion.add(params, "amplitudeMax", 50, 500, 1).name("Max Amplitude");
    fMotion.add(params, "scaleMin", 0.2, 3.0, 0.05).name("Min Scale");
    fMotion.add(params, "scaleMax", 0.5, 6.0, 0.05).name("Max Scale");
    fMotion.add(params, "baseOffset", 0, 360, 1).name("Angle Offset");
    fMotion.add(params, "rotationSpeed", 0.0, 2.0, 0.05).name("Rotation Flow");

    // Geometry Folder
    const fGeometry = gui.addFolder("Geometry");
    fGeometry.add(params, "circleCount", 3, 24, 1).name("Circle Count").onChange(() => rebuildCircles());
    fGeometry.add(params, "circleSize", 30, 300, 1).name("Circle Size").onChange(() => updateCircleStyles());

    // View & Display Folder
    const fDisplay = gui.addFolder("Display & View");
    fDisplay.add(params, "dpr", [0.5, 0.75, 1.0, 1.25, 1.5, 2.0, 3.0]).name("DPR (Pixel Ratio)").onChange(() => updateTransform());
    fDisplay.add(params, "zoom", 0.2, 5.0, 0.05).name("Zoom").onChange(() => updateTransform());
    fDisplay.add(params, "resetView").name("Reset Pan & Zoom");

    // --- INITIALIZATION ---
    rebuildCircles();
    updateCircleStyles();
    updateTransform();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
