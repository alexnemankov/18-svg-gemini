<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Strange Tubes #2</title>
  <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      text-shadow: 1px 1px 1px #000;
      overflow: hidden;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: -1;
      width: 100%;
      height: 100%;
    }

    header {
      position: absolute;
      width: 100%;
      text-align: center;
      pointer-events: none;
    }

    header h1 {
      font-size: 2rem;
      margin: 0.5em 0 0.2em;
    }

    a {
      font-size: 0.9rem;
      color: #bbb;
      text-decoration: none;
      border-bottom: 0.15rem solid transparent;
      transition: all 0.4s;
      pointer-events: auto;
    }
    a:hover {
      color: #fff;
      border-bottom-color: rgba(255, 255, 255, 0.7);
    }
  </style>

  <!-- External Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/simplex-noise/2.4.0/simplex-noise.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chroma-js/2.1.2/chroma.min.js"></script>
</head>
<body>
  <header>
    <h1>Strange Tubes #2</h1>
    <a href="https://codepen.io/collection/AGZywR" target="_blank">ThreeJS Collection</a>
  </header>

  <script type="module">
    import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

    const simplex = new SimplexNoise();

    function App(conf) {
      conf = {
        fov: 75,
        cameraZ: 130,
        background: '#000000',
        greenscreen: false,
        tubeRadius: 2.5,
        resY: 7,
        resX: 4,
        noiseCoef: 40,
        timeCoef: 50,
        mouseCoef: 50,
        heightCoef: 25,
        ambientColor: '#111111',
        lightIntensity: 2.5,
        metalness: 0.9,
        roughness: 0.15,
        light1Color: '#ff7700',
        light2Color: '#ff0066',
        light3Color: '#00ffd5',
        light4Color: '#aa00ff',
        colorScheme: 'Img1 Neon Chrome (Default)',
        animationPreset: 'Static (No Movement)',
        animSpeed: 1.0,
        dpr: Math.min(window.devicePixelRatio || 1, 2),
        ...conf
      };

      let renderer, scene, camera, cameraCtrl;
      let width, height, cx, cy, wWidth, wHeight;
      const TMath = THREE.MathUtils || THREE.Math;

      let ambientLight, light1, light2, light3, light4;
      let objects = [], noiseConf = {};
      let cscale;
      let gui;
      let accumulatedTime = 0;
      let lastTimestamp = performance.now();

      const mouse = new THREE.Vector2();

      const colorSchemes = {
        'Img1 Neon Chrome (Default)': {
          bg: '#000000',
          l1: '#ff7700',
          l2: '#ff0066',
          l3: '#00ffd5',
          l4: '#aa00ff',
          scale: ['#111111', '#555555', '#bbbbbb', '#ffffff']
        },
        'Bioluminescent Emerald': {
          bg: '#02140e',
          l1: '#00ff88',
          l2: '#00bfff',
          l3: '#005533',
          l4: '#adff2f',
          scale: ['#003322', '#009955', '#00ff88', '#ffffff']
        },
        'Cosmic Sunset Glow': {
          bg: '#08000a',
          l1: '#ff4500',
          l2: '#ff007f',
          l3: '#ffaa00',
          l4: '#8a2be2',
          scale: ['#200030', '#8a2be2', '#ff007f', '#ffffff']
        },
        'Solar Flare & Gold': {
          bg: '#0a0805',
          l1: '#ffd700',
          l2: '#ff4500',
          l3: '#ff8c00',
          l4: '#e6005c',
          scale: ['#301000', '#ff4500', '#ffd700', '#ffffff']
        },
        'Greenscreen Dream': {
          bg: '#00ff00',
          l1: '#ff00ff',
          l2: '#00ffff',
          l3: '#ffff00',
          l4: '#9900ff',
          scale: ['#330033', '#ff00ff', '#00ffff', '#ffffff']
        }
      };

      init();

      function init() {
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(conf.dpr);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);

        camera = new THREE.PerspectiveCamera(conf.fov, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, conf.cameraZ);

        cameraCtrl = new THREE.OrbitControls(camera, document.body);
        cameraCtrl.enableZoom = true;
        cameraCtrl.zoomSpeed = 1.2;
        cameraCtrl.enablePan = true;
        cameraCtrl.enableRotate = true;

        updateSize();
        window.addEventListener('resize', updateSize, false);

        document.addEventListener('mousemove', e => {
          mouse.x = (e.clientX / width) * 2 - 1;
          mouse.y = -(e.clientY / height) * 2 + 1;
        });

        window.addEventListener('keydown', e => {
          if (e.key === 'h' || e.key === 'H') {
            if (gui) {
              if (gui._hidden) {
                gui.show();
              } else {
                gui.hide();
              }
            }
          }
        });

        updateCScale(chroma('#ffffff'));
        initScene();
        initGui();
        applyColorScheme(conf.colorScheme);

        requestAnimationFrame(animate);
      }

      function initGui() {
        gui = new GUI({ title: 'Scene Settings' });

        ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'wheel', 'touchstart', 'touchend', 'touchmove', 'click'].forEach(eventType => {
          gui.domElement.addEventListener(eventType, e => {
            e.stopPropagation();
          });
        });

        const bgFolder = gui.addFolder('Background & Display');
        
        bgFolder.add(conf, 'greenscreen').name('Greenscreen (#00ff00)').onChange(val => {
          if (val) {
            scene.background = new THREE.Color('#00ff00');
          } else {
            scene.background = new THREE.Color(conf.background);
          }
        });

        bgFolder.addColor(conf, 'background').name('Background Color').onChange(val => {
          if (!conf.greenscreen) {
            scene.background = new THREE.Color(val);
          }
        });

        bgFolder.add(conf, 'dpr', 0.5, 3.0, 0.1).name('Pixel Ratio (DPR)').onChange(val => {
          renderer.setPixelRatio(val);
        });

        const matFolder = gui.addFolder('Material & Specular');
        matFolder.add(conf, 'metalness', 0.0, 1.0, 0.05).name('Metalness').onChange(val => {
          objects.forEach(obj => obj.material.metalness = val);
        });
        matFolder.add(conf, 'roughness', 0.01, 1.0, 0.05).name('Roughness (Gloss)').onChange(val => {
          objects.forEach(obj => obj.material.roughness = val);
        });

        const colorFolder = gui.addFolder('Colors & Themes');
        colorFolder.add(conf, 'colorScheme', Object.keys(colorSchemes)).name('Color Presets').onChange(val => {
          applyColorScheme(val);
        });

        colorFolder.add(conf, 'lightIntensity', 0.5, 6.0, 0.1).name('Light Intensity').onChange(val => {
          if (light1) light1.intensity = val;
          if (light2) light2.intensity = val;
          if (light3) light3.intensity = val;
          if (light4) light4.intensity = val;
        });

        colorFolder.addColor(conf, 'light1Color').name('Light 1 (Top Left)').onChange(val => light1.color.set(val));
        colorFolder.addColor(conf, 'light2Color').name('Light 2 (Bottom Left)').onChange(val => light2.color.set(val));
        colorFolder.addColor(conf, 'light3Color').name('Light 3 (Top Right)').onChange(val => light3.color.set(val));
        colorFolder.addColor(conf, 'light4Color').name('Light 4 (Bottom Right)').onChange(val => light4.color.set(val));
        colorFolder.add({ randomize: () => updateColors() }, 'randomize').name('Randomize Colors');

        const animFolder = gui.addFolder('Animation');
        animFolder.add(conf, 'animationPreset', [
          'Static (No Movement)',
          'Smooth Orbit',
          'Gentle Wave Float',
          'Breathing Dolly',
          'Spiral Sweeper'
        ]).name('Camera Animation');

        animFolder.add(conf, 'animSpeed', 0.0, 3.0, 0.1).name('Animation Speed');
        animFolder.add(conf, 'noiseCoef', 10, 150, 1).name('Noise Frequency');
        animFolder.add(conf, 'heightCoef', 0, 80, 1).name('Wave Height');

        document.body.addEventListener('click', e => {
          if (e.target.tagName !== 'A' && !e.target.closest('.lil-gui')) {
            updateColors();
          }
        });
      }

      function applyColorScheme(schemeName) {
        const scheme = colorSchemes[schemeName];
        if (!scheme) return;

        conf.background = scheme.bg;
        if (conf.greenscreen) {
          scene.background = new THREE.Color('#00ff00');
        } else {
          scene.background = new THREE.Color(scheme.bg);
        }

        conf.light1Color = scheme.l1;
        conf.light2Color = scheme.l2;
        conf.light3Color = scheme.l3;
        conf.light4Color = scheme.l4;

        if (light1) light1.color.set(scheme.l1);
        if (light2) light2.color.set(scheme.l2);
        if (light3) light3.color.set(scheme.l3);
        if (light4) light4.color.set(scheme.l4);

        cscale = chroma.scale(scheme.scale);
        for (let i = 0; i < objects.length; i++) {
          objects[i].material.color.set(cscale(TMath.randFloat(0, 1)).hex());
        }

        gui && gui.controllersRecursive().forEach(c => c.updateDisplay());
      }

      function initScene() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(conf.greenscreen ? '#00ff00' : conf.background);
        initLights();
        initObjects();
      }

      function initLights() {
        ambientLight = new THREE.AmbientLight(conf.ambientColor);
        scene.add(ambientLight);

        const z = 60;
        const lightDistance = 600;
        light1 = new THREE.PointLight(conf.light1Color, conf.lightIntensity, lightDistance);
        light1.position.set(-wWidth * 0.35, wHeight * 0.3, z);
        scene.add(light1);

        light2 = new THREE.PointLight(conf.light2Color, conf.lightIntensity, lightDistance);
        light2.position.set(-wWidth * 0.35, -wHeight * 0.3, z);
        scene.add(light2);

        light3 = new THREE.PointLight(conf.light3Color, conf.lightIntensity, lightDistance);
        light3.position.set(wWidth * 0.35, wHeight * 0.3, z);
        scene.add(light3);

        light4 = new THREE.PointLight(conf.light4Color, conf.lightIntensity, lightDistance);
        light4.position.set(wWidth * 0.35, -wHeight * 0.3, z);
        scene.add(light4);
      }

      function initObjects() {
        updateNoise();
        const nx = Math.round(wWidth / conf.resX) + 1;
        const ny = Math.round(wHeight / conf.resY) + 1;
        objects = [];
        let tube, color;
        for (let j = 0; j < ny; j++) {
          color = cscale(TMath.randFloat(0, 1)).hex();
          tube = new Tube(-wWidth / 2, -wHeight / 2 + j * conf.resY, wWidth, nx, conf.tubeRadius, color, noiseConf, conf.metalness, conf.roughness);
          objects.push(tube);
          scene.add(tube.mesh);
        }
      }

      function updateNoise() {
        noiseConf.coef = conf.noiseCoef * 0.00012;
        noiseConf.height = conf.heightCoef;
        noiseConf.time = accumulatedTime * conf.timeCoef * 0.000002;
        noiseConf.mouseX = mouse.x / 2;
        noiseConf.mouseY = mouse.y / 2;
        noiseConf.mouse = mouse.x + mouse.y;
      }

      function updateColors() {
        const color = chroma.random();
        updateCScale(color);
        for (let i = 0; i < objects.length; i++) {
          objects[i].material.color = new THREE.Color(cscale(TMath.randFloat(0, 1)).hex());
        }
        conf.light1Color = chroma.random().hex();
        conf.light2Color = chroma.random().hex();
        conf.light3Color = chroma.random().hex();
        conf.light4Color = chroma.random().hex();

        light1.color = new THREE.Color(conf.light1Color);
        light2.color = new THREE.Color(conf.light2Color);
        light3.color = new THREE.Color(conf.light3Color);
        light4.color = new THREE.Color(conf.light4Color);

        gui && gui.controllersRecursive().forEach(c => c.updateDisplay());
      }

      function updateCScale(color) {
        const colors = [
          color.set('hsl.s', TMath.randFloat(0, 1)).set('hsl.l', TMath.randFloat(0, 0.3)).hex(),
          color.set('hsl.s', TMath.randFloat(0, 1)).set('hsl.l', 0.3 + TMath.randFloat(0, 0.4)).hex(),
          color.set('hsl.s', TMath.randFloat(0, 1)).set('hsl.l', 0.7 + TMath.randFloat(0, 0.3)).hex(),
          0xffffff,
        ];
        cscale = chroma.scale(colors);
      }

      function animate(now) {
        requestAnimationFrame(animate);

        const delta = (now - lastTimestamp);
        lastTimestamp = now;

        if (conf.animSpeed > 0) {
          accumulatedTime += delta * conf.animSpeed;
        }

        animateCamera();
        animateObjects();
        animateLights();

        if (cameraCtrl) cameraCtrl.update();
        renderer.render(scene, camera);
      }

      function animateCamera() {
        if (conf.animSpeed === 0) return;
        if (conf.animationPreset === 'Static (No Movement)') return;

        const t = accumulatedTime * 0.0003;
        const target = cameraCtrl ? cameraCtrl.target : new THREE.Vector3(0, 0, 0);
        const dist = camera.position.distanceTo(target) || 130;

        switch (conf.animationPreset) {
          case 'Smooth Orbit':
            camera.position.x = target.x + Math.sin(t) * dist;
            camera.position.z = target.z + Math.cos(t) * dist;
            camera.lookAt(target);
            break;

          case 'Gentle Wave Float':
            camera.position.x = target.x + Math.sin(t * 0.8) * 40;
            camera.position.y = target.y + Math.cos(t * 0.6) * 35;
            camera.lookAt(target);
            break;

          case 'Breathing Dolly':
            const distMod = dist + Math.sin(t * 0.7) * 15;
            const dir = new THREE.Vector3().subVectors(camera.position, target).normalize();
            if (dir.lengthSq() === 0) dir.set(0, 0, 1);
            camera.position.copy(target).addScaledVector(dir, distMod);
            camera.lookAt(target);
            break;

          case 'Spiral Sweeper':
            camera.position.x = target.x + Math.sin(t * 0.5) * dist;
            camera.position.y = target.y + Math.sin(t * 0.25) * 30;
            camera.position.z = target.z + Math.cos(t * 0.5) * dist;
            camera.lookAt(target);
            break;

          default:
            break;
        }
      }

      function animateObjects() {
        updateNoise();
        for (let i = 0; i < objects.length; i++) {
          objects[i].update();
        }
      }

      function animateLights() {
        const time = accumulatedTime * 0.001;
        const dx = wWidth / 2;
        const dy = wHeight / 2;
        light1.position.x = Math.sin(time * 0.1) * dx;
        light1.position.y = Math.cos(time * 0.2) * dy;
        light2.position.x = Math.cos(time * 0.3) * dx;
        light2.position.y = Math.sin(time * 0.4) * dy;
        light3.position.x = Math.sin(time * 0.5) * dx;
        light3.position.y = Math.sin(time * 0.6) * dy;
        light4.position.x = Math.sin(time * 0.7) * dx;
        light4.position.y = Math.cos(time * 0.8) * dy;
      }

      function updateSize() {
        width = window.innerWidth;
        cx = width / 2;
        height = window.innerHeight;
        cy = height / 2;
        if (renderer && camera) {
          renderer.setSize(width, height);
          camera.aspect = width / height;
          camera.updateProjectionMatrix();
          const wsize = getRendererSize();
          wWidth = wsize[0];
          wHeight = wsize[1];
        }
      }

      function getRendererSize() {
        const cam = new THREE.PerspectiveCamera(camera.fov, camera.aspect);
        const vFOV = (cam.fov * Math.PI) / 180;
        const height = 2 * Math.tan(vFOV / 2) * Math.abs(conf.cameraZ);
        const width = height * cam.aspect;
        return [width, height];
      }
    }

    /**
     * Custom curve
     */
    class CustomCurve extends THREE.Curve {
      constructor(x, y, l, noise) {
        super();
        this.x = x;
        this.y = y;
        this.l = l;
        this.noise = noise;
        this.yn = this.y * this.noise.coef;
      }

      getPoint(t, optionalTarget) {
        let x = this.x + t * this.l;
        let xn = x * this.noise.coef;
        let noise1 = simplex.noise2D(xn + this.noise.time + this.noise.mouseX / 2, this.yn - this.noise.time + this.noise.mouseY / 2);
        let noise2 = simplex.noise2D(this.yn + this.noise.time, xn - this.noise.time);
        let z = noise2 * this.noise.height;
        let y = this.y + noise1 * this.noise.height;
        const point = optionalTarget || new THREE.Vector3();
        return point.set(x, y, z);
      }
    }

    /**
     * Tube class
     */
    class Tube {
      constructor(x, y, l, segments, radius, color, noise, metalness = 0.9, roughness = 0.15) {
        this.segments = segments;
        this.radialSegments = 8;
        this.radius = radius;

        this.curve = new CustomCurve(x, y, l, noise);
        this.geometry = new THREE.TubeBufferGeometry(this.curve, segments, radius, this.radialSegments, false);
        this.material = new THREE.MeshStandardMaterial({
          color,
          metalness,
          roughness
        });
        this.mesh = new THREE.Mesh(this.geometry, this.material);
      }
      update() {
        this.frames = this.curve.computeFrenetFrames(this.segments, false);
        this.geometry.tangents = this.frames.tangents;
        this.geometry.normals = this.frames.normals;
        this.geometry.binormals = this.frames.binormals;

        this.pArray = this.geometry.attributes.position.array;
        this.nArray = this.geometry.attributes.normal.array;
        this.P = new THREE.Vector3();
        this.normal = new THREE.Vector3();
        for (let i = 0; i < this.segments; i++) {
          this.updateSegment(i);
        }
        this.updateSegment(this.segments);

        this.geometry.attributes.position.needsUpdate = true;
        this.geometry.attributes.normal.needsUpdate = true;
      }
      updateSegment(i) {
        this.P = this.curve.getPointAt(i / this.segments, this.P);
        const N = this.frames.normals[i];
        const B = this.frames.binormals[i];
        for (let j = 0; j <= this.radialSegments; j++) {
          let v = j / this.radialSegments * Math.PI * 2;
          let sin = Math.sin(v);
          let cos = - Math.cos(v);
          this.normal.x = (cos * N.x + sin * B.x);
          this.normal.y = (cos * N.y + sin * B.y);
          this.normal.z = (cos * N.z + sin * B.z);
          this.normal.normalize();
          let index = (i * (this.radialSegments + 1) + j) * 3;
          this.nArray[index] = this.normal.x;
          this.nArray[index + 1] = this.normal.y;
          this.nArray[index + 2] = this.normal.z;
          this.pArray[index] = this.P.x + this.radius * this.normal.x;
          this.pArray[index + 1] = this.P.y + this.radius * this.normal.y;
          this.pArray[index + 2] = this.P.z + this.radius * this.normal.z;
        }
      }
    }

    App();
  </script>
</body>
</html>
