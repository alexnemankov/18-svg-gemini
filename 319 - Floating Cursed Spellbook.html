<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Floating Cursed Spellbook</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #080410;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas#webgl-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "three/examples/jsm/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js",
        "postprocessing/PostProcessor.js": "./postprocessing/PostProcessor.js"
      }
    }
  </script>
</head>
<body>
  <canvas id="webgl-canvas"></canvas>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import GUI from 'lil-gui';

    // =========================================================================================
    // POST PROCESSOR SUITE (Inlined from postprocessing/PostProcessor.js for standalone usage)
    // =========================================================================================
    const orthoVertexShader = `
    precision highp float;
    in vec3 position;
    out vec2 vUv;
    void main() {
      vUv = position.xy * 0.5 + 0.5;
      gl_Position = vec4(position, 1.0);
    }
    `;

    const brightFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float bloomThreshold;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float luminance = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float knee = 0.1;
      float soft = luminance - bloomThreshold + knee;
      soft = clamp(soft, 0.0, 2.0 * knee);
      soft = (soft * soft) / (4.0 * knee + 0.00001);
      float contribution = max(soft, luminance - bloomThreshold);
      contribution /= max(luminance, 0.00001);
      fragColor = vec4(color.rgb * contribution, color.a);
    }
    `;

    const blur13ShaderChunk = `
    vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
      vec2 resolution = vec2(textureSize(image, 0));
      vec4 color = vec4(0.0);
      vec2 off1 = vec2(1.411764705882353) * direction;
      vec2 off2 = vec2(3.2941176470588234) * direction;
      vec2 off3 = vec2(5.176470588235294) * direction;
      color += texture(image, uv) * 0.1964825501511404;
      color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
      color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
      return color;
    }
    `;

    const blurFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 direction;
    in vec2 vUv;
    out vec4 color;
    ${blur13ShaderChunk}
    void main() {
      color = blur13(inputTexture, vUv, direction);
    }
    `;

    const godRaysDepthMaskShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float threshold;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float lum = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float factor = smoothstep(threshold, threshold + 0.15, lum);
      fragColor = vec4(vec3(factor), 1.0);
    }
    `;

    const godRaysGenerateShader = `
    precision highp float;
    #define TAPS_PER_PASS 6.0

    uniform sampler2D inputTexture;
    uniform vec3 vSunPositionScreenSpace;
    uniform float fStepSize;
    uniform float distanceAttenuation;
    uniform float maxDensity;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec2 delta = vSunPositionScreenSpace.xy - vUv;
      float dist = length(delta);
      vec2 stepv = fStepSize * delta / max(dist, 0.0001);
      float iters = dist / max(fStepSize, 0.00001);

      vec2 uv = vUv;
      float col = 0.0;
      float f = min(1.0, max(vSunPositionScreenSpace.z, 0.0));

      float atten = 1.0 / (1.0 + pow(dist, distanceAttenuation));

      if (0.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (1.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (2.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (3.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (4.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (5.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;

      float finalVal = min(col / TAPS_PER_PASS * atten, maxDensity);
      fragColor = vec4(vec3(finalVal), 1.0);
    }
    `;

    const anamorphicBrightShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float threshold;
    uniform float smoothWidth;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float v = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float alpha = smoothstep(threshold, threshold + smoothWidth, v);
      fragColor = mix(vec4(0.0), color, alpha);
    }
    `;

    const anamorphicBlurShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 resolution;
    uniform float samples;
    uniform float intensity;
    uniform vec3 tintColor;
    uniform float bloomRadius;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      int halfSamples = max(1, int(samples) / 2);
      float fHalfSamples = float(halfSamples);
      vec2 invSize = 1.0 / resolution;
      vec4 total = vec4(0.0);

      for (int i = -64; i <= 64; i++) {
        if (i < -halfSamples || i > halfSamples) continue;
        float softness = 1.0 - abs(float(i)) / fHalfSamples;
        softness = pow(softness, 2.0);
        vec2 shiftedUV = vec2(vUv.x + invSize.x * float(i) * (4.0 + bloomRadius * 8.0), vUv.y);
        shiftedUV = clamp(shiftedUV, 0.001, 0.999);
        total += texture(inputTexture, shiftedUV) * softness;
      }

      fragColor = (total / (samples / 3.0)) * vec4(tintColor, 1.0) * intensity;
    }
    `;

    const finalFragmentShader = `
    precision highp float;
    uniform vec2 resolution;
    uniform sampler2D inputTexture;
    uniform sampler2D blur0Texture;
    uniform sampler2D blur1Texture;
    uniform sampler2D blur2Texture;
    uniform sampler2D blur3Texture;
    uniform sampler2D blur4Texture;
    uniform sampler2D raysTexture;
    uniform sampler2D anamorphicTexture;
    uniform bool bloomEnabled;
    uniform float bloomStrength;
    uniform bool raysEnabled;
    uniform float raysStrength;
    uniform vec3 raysColor;
    uniform bool anamorphicEnabled;
    uniform float vignetteBoost;
    uniform float vignetteReduction;
    uniform float noiseIntensity;
    uniform float time;
    in vec2 vUv;
    out vec4 fragColor;

    float vignette(vec2 uv, float boost, float reduction) {
      vec2 position = vUv - 0.5;
      return boost - length(position) * reduction;
    }

    float hash1(uint n) {
      n = (n << 13U) ^ n;
      n = n * (n * n * 15731U + 789221U) + 1376312589U;
      return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
    }

    float noise(in vec2 uv, in float timeVal) {
      uvec2 p = uvec2(uv);
      return hash1(p.x + 1920U * p.y + (1920U * 1080U) * uint(timeVal));
    }

    void main() {
      vec4 color = texture(inputTexture, vUv);

      if (bloomEnabled && bloomStrength > 0.001) {
        vec4 b0 = texture(blur0Texture, vUv);
        vec4 b1 = texture(blur1Texture, vUv);
        vec4 b2 = texture(blur2Texture, vUv);
        vec4 b3 = texture(blur3Texture, vUv);
        vec4 b4 = texture(blur4Texture, vUv);

        vec4 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
        color += bloomSum * bloomStrength;
      }

      if (raysEnabled && raysStrength > 0.001) {
        vec4 r = texture(raysTexture, vUv);
        color.rgb += r.rgb * raysColor * raysStrength;
      }

      if (anamorphicEnabled) {
        vec4 a = texture(anamorphicTexture, vUv);
        color.rgb += a.rgb;
      }

      color.rgb *= vignette(vUv, vignetteBoost, vignetteReduction);
      color.rgb += noiseIntensity * noise(gl_FragCoord.xy, time);
      fragColor = vec4(color.rgb, 1.0);
    }
    `;

    const chromaticAberrationShaderChunk = `
    vec2 barrelDistortion(vec2 coord, float amt) {
      vec2 cc = coord - 0.5;
      float dist = dot(cc, cc);
      return coord + cc * dist * amt;
    }
    float sat(float t) { return clamp(t, 0.0, 1.0); }
    float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
    float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
    vec4 spectrum_offset(float t) {
      float lo = step(t, 0.5);
      float hi = 1.0 - lo;
      float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
      vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
      return pow(ret, vec4(1.0 / 2.2));
    }
    const float max_distort = 2.2;
    const int num_iter = 8;
    const float reci_num_iter_f = 1.0 / float(num_iter);
    vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
      vec4 sumcol = vec4(0.0);
      vec4 sumw = vec4(0.0);
      for (int i = 0; i < num_iter; ++i) {
        float t = float(i) * reci_num_iter_f;
        vec4 w = spectrum_offset(t);
        sumw += w;
        sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
      }
      return sumcol / sumw;
    }
    `;

    const colorFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float chromaticAberrationAmount;
    uniform float minInputLevel;
    uniform float maxInputLevel;
    uniform float gammaLevel;
    uniform float exposure;
    uniform float fisheyeStrength;
    uniform float fisheyeRadius;
    uniform float time;
    uniform int visionMode;
    uniform float thermalSensitivity;
    uniform float nightVisionNoise;
    uniform float nightVisionGain;
    uniform float crtIntensity;
    in vec2 vUv;
    out vec4 fragColor;

    ${chromaticAberrationShaderChunk}

    vec2 applyFisheye(vec2 uv, float strength, float radius) {
      if (abs(strength) < 0.0001) return uv;
      vec2 p = uv - 0.5;
      float d = length(p);
      if (d > radius * 1.5) return uv;
      float r = d / max(radius, 0.001);
      float theta = atan(p.y, p.x);
      float rDist = r + strength * (r * r * r);
      return 0.5 + vec2(cos(theta), sin(theta)) * (rDist * radius);
    }

    vec3 ACESFilmicToneMapping(vec3 color) {
      float a = 2.51;
      float b = 0.03;
      float c = 2.43;
      float d = 0.59;
      float e = 0.14;
      return clamp((color * (a * color + b)) / (color * (c * color + d) + e), 0.0, 1.0);
    }

    vec3 gammaCorrect(vec3 color, vec3 gamma) {
      return pow(max(color, vec3(0.0)), 1.0 / gamma);
    }
    vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
      return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
    }
    vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
      return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
    }

    vec3 applyNightVision(vec3 color, vec2 uv, float timeVal, float noiseAmt, float gain, float crt) {
      float lum = dot(color, vec3(0.299, 0.587, 0.114));
      float amplified = pow(lum * gain, 0.72);
      vec3 phosphorColor = mix(vec3(0.02, 0.12, 0.03), vec3(0.18, 1.0, 0.32), clamp(amplified, 0.0, 1.0));
      phosphorColor += vec3(0.7, 1.0, 0.8) * max(0.0, amplified - 0.75) * 1.8;
      vec2 p = uv - 0.5;
      float tubeDist = length(p);
      float tubeMask = smoothstep(0.72, 0.44, tubeDist);
      float n = fract(sin(dot(uv * 280.0 + timeVal * 0.05, vec2(12.9898, 78.233))) * 43758.5453);
      float scanline = sin(uv.y * 650.0) * crt;
      phosphorColor += (n - 0.5) * noiseAmt * 2.0 + scanline;
      return clamp(phosphorColor * tubeMask, 0.0, 1.0);
    }

    vec3 ironbow(float t) {
      t = clamp(t, 0.0, 1.0);
      vec3 c0 = vec3(0.02, 0.01, 0.18);
      vec3 c1 = vec3(0.22, 0.02, 0.48);
      vec3 c2 = vec3(0.82, 0.05, 0.25);
      vec3 c3 = vec3(1.0, 0.62, 0.02);
      vec3 c4 = vec3(1.0, 1.0, 0.92);
      if (t < 0.25) return mix(c0, c1, t * 4.0);
      if (t < 0.50) return mix(c1, c2, (t - 0.25) * 4.0);
      if (t < 0.75) return mix(c2, c3, (t - 0.50) * 4.0);
      return mix(c3, c4, (t - 0.75) * 4.0);
    }

    vec3 applyThermal(vec3 color, vec2 uv, float sensitivity, float crt, bool whiteHot) {
      float lum = dot(color, vec3(0.299, 0.587, 0.114));
      float heat = clamp(lum * sensitivity, 0.0, 1.0);
      float sensorRaster = sin(uv.y * 900.0) * (crt * 0.3);
      heat = clamp(heat + sensorRaster, 0.0, 1.0);
      if (whiteHot) {
        return vec3(pow(heat, 0.85));
      } else {
        return ironbow(heat);
      }
    }

    void main() {
      vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
      vec4 col = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
      vec3 finalCol = col.rgb;
      
      if (visionMode == 1) {
        finalCol = applyNightVision(finalCol, uv, time, nightVisionNoise, nightVisionGain, crtIntensity);
      } else if (visionMode == 2) {
        finalCol = applyThermal(finalCol, uv, thermalSensitivity, crtIntensity, false);
      } else if (visionMode == 3) {
        finalCol = applyThermal(finalCol, uv, thermalSensitivity, crtIntensity, true);
      } else {
        vec3 exposedColor = finalCol * exposure;
        vec3 toneMappedColor = ACESFilmicToneMapping(exposedColor);
        finalCol = finalLevels(toneMappedColor, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
      }

      fragColor = vec4(finalCol, 1.0);
    }
    `;

    const copyFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      fragColor = texture(inputTexture, vUv);
    }
    `;

    function createFBO(w, h, options = {}) {
      return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
        wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
        wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
        minFilter: options.minFilter || THREE.LinearFilter,
        magFilter: options.magFilter || THREE.LinearFilter,
        format: options.format || THREE.RGBAFormat,
        type: options.type || THREE.HalfFloatType,
        stencilBuffer: options.stencilBuffer || false,
        depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : true,
        samples: options.samples || 0,
      });
    }

    class ShaderPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbo = createFBO(1, 1, options);
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
        this.texture = this.fbo.texture;
      }
      render(renderer, toScreen = false) {
        if (!toScreen) {
          renderer.setRenderTarget(this.fbo);
        }
        renderer.render(this.orthoScene, this.orthoCamera);
        if (!toScreen) {
          renderer.setRenderTarget(null);
        }
      }
      setSize(width, height) {
        this.fbo.setSize(Math.max(1, width), Math.max(1, height));
        this.orthoQuad.scale.set(width, height, 1);
      }
    }

    class ShaderPingPongPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
        this.currentFBO = 0;
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
      }
      render(renderer) {
        renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
        renderer.render(this.orthoScene, this.orthoCamera);
        renderer.setRenderTarget(null);
        this.currentFBO = 1 - this.currentFBO;
      }
      get current() { return this.fbos[this.currentFBO]; }
      get texture() { return this.current.texture; }
      setSize(width, height) {
        const w = Math.max(1, width);
        const h = Math.max(1, height);
        this.orthoQuad.scale.set(w, h, 1);
        this.fbos[0].setSize(w, h);
        this.fbos[1].setSize(w, h);
      }
    }

    class BloomPass {
      constructor(strength = 0.8, radius = 0.5, threshold = 0.2, levels = 5) {
        this.strength = strength;
        this.radius = radius;
        this.threshold = threshold;
        this.enabled = true;
        this.levels = levels;

        this.brightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            bloomThreshold: { value: this.threshold },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: brightFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.brightPass = new ShaderPass(this.brightShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.blurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            direction: { value: new THREE.Vector2(0, 1) },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: blurFragmentShader,
          glslVersion: THREE.GLSL3,
        });

        this.blurPasses = [];
        for (let i = 0; i < this.levels; i++) {
          this.blurPasses.push(new ShaderPingPongPass(this.blurShader, {
            format: THREE.RGBAFormat,
            type: THREE.HalfFloatType,
          }));
        }
      }

      setSize(w, h) {
        let tw = Math.max(1, w);
        let th = Math.max(1, h);
        this.brightPass.setSize(tw, th);
        for (let i = 0; i < this.levels; i++) {
          tw = Math.max(1, Math.round(tw / 2));
          th = Math.max(1, Math.round(th / 2));
          this.blurPasses[i].setSize(tw, th);
        }
      }

      set source(texture) {
        this.brightShader.uniforms.inputTexture.value = texture;
      }

      render(renderer) {
        if (!this.enabled || this.strength <= 0.001) return;

        this.brightShader.uniforms.bloomThreshold.value = this.threshold;
        this.brightPass.render(renderer);

        const baseOffset = Math.max(0.1, this.radius * 2.0);
        const u = this.blurShader.uniforms;

        for (let j = 0; j < this.levels; j++) {
          const blurPass = this.blurPasses[j];
          const stepOffset = baseOffset * (1.0 + j * 0.5);

          u.direction.value.set(stepOffset, 0);
          u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
          blurPass.render(renderer);

          u.direction.value.set(0, stepOffset * 0.5);
          u.inputTexture.value = blurPass.current.texture;
          blurPass.render(renderer);
        }
      }
    }

    const VISION_MODE_MAP = {
      'Normal (Cinematic)': 0,
      'Night Vision (Phosphor)': 1,
      'Thermal (Ironbow)': 2,
      'Thermal (White-Hot)': 3,
    };

    class PostProcessor {
      constructor(renderer, params = {}) {
        this.renderer = renderer;

        this.settings = {
          enabled: params.enabled !== undefined ? params.enabled : true,
          bloomEnabled: params.bloomEnabled !== undefined ? params.bloomEnabled : true,
          bloomStrength: params.bloomStrength !== undefined ? params.bloomStrength : 1.2,
          bloomRadius: params.bloomRadius !== undefined ? params.bloomRadius : 0.6,
          bloomThreshold: params.bloomThreshold !== undefined ? params.bloomThreshold : 0.15,

          raysEnabled: params.raysEnabled !== undefined ? params.raysEnabled : false,
          raysStrength: params.raysStrength !== undefined ? params.raysStrength : 0.85,
          raysDensity: params.raysDensity !== undefined ? params.raysDensity : 1.0,
          raysMaxDensity: params.raysMaxDensity !== undefined ? params.raysMaxDensity : 0.5,
          raysDistanceAttenuation: params.raysDistanceAttenuation !== undefined ? params.raysDistanceAttenuation : 2.0,
          raysThreshold: params.raysThreshold !== undefined ? params.raysThreshold : 0.12,
          raysColor: params.raysColor ? (params.raysColor.isColor ? params.raysColor.clone() : new THREE.Color(params.raysColor)) : new THREE.Color(0xf6aa1c),
          raysColorHex: params.raysColorHex || (typeof params.raysColor === 'string' ? params.raysColor : '#f6aa1c'),

          anamorphicEnabled: params.anamorphicEnabled !== undefined ? params.anamorphicEnabled : false,
          anamorphicIntensity: params.anamorphicIntensity !== undefined ? params.anamorphicIntensity : (params.anamorphicStrength !== undefined ? params.anamorphicStrength * 2.5 : 5.0),
          anamorphicThreshold: params.anamorphicThreshold !== undefined ? params.anamorphicThreshold : 0.3,
          anamorphicSamples: params.anamorphicSamples !== undefined ? params.anamorphicSamples : 64,
          anamorphicRadius: params.anamorphicRadius !== undefined ? params.anamorphicRadius : 0.0,
          anamorphicSmoothWidth: params.anamorphicSmoothWidth !== undefined ? params.anamorphicSmoothWidth : 0.05,
          anamorphicColor: params.anamorphicColor ? (params.anamorphicColor.isColor ? params.anamorphicColor.clone() : new THREE.Color(params.anamorphicColor)) : new THREE.Color(0x7a8aff),
          anamorphicColorHex: params.anamorphicColorHex || '#7a8aff',

          visionMode: params.visionMode !== undefined ? params.visionMode : 'Normal (Cinematic)',
          thermalSensitivity: params.thermalSensitivity !== undefined ? params.thermalSensitivity : 1.4,
          nightVisionGain: params.nightVisionGain !== undefined ? params.nightVisionGain : 2.1,
          nightVisionNoise: params.nightVisionNoise !== undefined ? params.nightVisionNoise : 0.05,
          crtIntensity: params.crtIntensity !== undefined ? params.crtIntensity : 0.0,

          fisheyeStrength: params.fisheyeStrength !== undefined ? params.fisheyeStrength : 0.0,
          fisheyeRadius: params.fisheyeRadius !== undefined ? params.fisheyeRadius : 1.0,
          chromaticAberration: params.chromaticAberration !== undefined ? params.chromaticAberration : 0.02,
          vignetteBoost: params.vignetteBoost !== undefined ? params.vignetteBoost : 1.1,
          vignetteReduction: params.vignetteReduction !== undefined ? params.vignetteReduction : 0.65,
          noiseIntensity: params.noiseIntensity !== undefined ? params.noiseIntensity : 0.015,

          gamma: params.gamma !== undefined ? params.gamma : 1.0,
          minInputLevel: params.minInputLevel !== undefined ? params.minInputLevel : 0.0,
          maxInputLevel: params.maxInputLevel !== undefined ? params.maxInputLevel : 1.0,
          exposure: params.exposure !== undefined ? params.exposure : 1.0,
        };

        this.sceneTarget = createFBO(1, 1, { type: THREE.HalfFloatType });

        this.bloomPass = new BloomPass(
          this.settings.bloomStrength,
          this.settings.bloomRadius,
          this.settings.bloomThreshold,
          5
        );

        this.moonScreenPos = new THREE.Vector3(0.5, 0.7, 1.0);
        this.moonInFront = true;

        this.godRaysMaskShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            threshold: { value: this.settings.raysThreshold },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: godRaysDepthMaskShader,
          glslVersion: THREE.GLSL3,
        });
        this.godRaysMaskPass = new ShaderPass(this.godRaysMaskShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.godRaysGenShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            vSunPositionScreenSpace: { value: this.moonScreenPos },
            fStepSize: { value: 1.0 },
            distanceAttenuation: { value: this.settings.raysDistanceAttenuation },
            maxDensity: { value: this.settings.raysMaxDensity },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: godRaysGenerateShader,
          glslVersion: THREE.GLSL3,
        });
        this.godRaysPingPong = new ShaderPingPongPass(this.godRaysGenShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.anamorphicBrightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            threshold: { value: this.settings.anamorphicThreshold },
            smoothWidth: { value: this.settings.anamorphicSmoothWidth },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: anamorphicBrightShader,
          glslVersion: THREE.GLSL3,
        });
        this.anamorphicBrightPass = new ShaderPass(this.anamorphicBrightShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.anamorphicBlurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            resolution: { value: new THREE.Vector2(1, 1) },
            samples: { value: this.settings.anamorphicSamples },
            intensity: { value: this.settings.anamorphicIntensity },
            tintColor: { value: this.settings.anamorphicColor },
            bloomRadius: { value: this.settings.anamorphicRadius },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: anamorphicBlurShader,
          glslVersion: THREE.GLSL3,
        });
        this.anamorphicBlurPass = new ShaderPass(this.anamorphicBlurShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.finalShader = new THREE.RawShaderMaterial({
          uniforms: {
            resolution: { value: new THREE.Vector2(1, 1) },
            bloomEnabled: { value: this.settings.bloomEnabled },
            bloomStrength: { value: this.settings.bloomStrength },
            raysEnabled: { value: this.settings.raysEnabled },
            raysStrength: { value: this.settings.raysStrength },
            raysColor: { value: this.settings.raysColor },
            anamorphicEnabled: { value: this.settings.anamorphicEnabled },
            vignetteBoost: { value: this.settings.vignetteBoost },
            vignetteReduction: { value: this.settings.vignetteReduction },
            noiseIntensity: { value: this.settings.noiseIntensity },
            inputTexture: { value: null },
            blur0Texture: { value: null },
            blur1Texture: { value: null },
            blur2Texture: { value: null },
            blur3Texture: { value: null },
            blur4Texture: { value: null },
            raysTexture: { value: null },
            anamorphicTexture: { value: null },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: finalFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.finalPass = new ShaderPass(this.finalShader);

        this.rgbShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: this.finalPass.texture },
            fisheyeStrength: { value: this.settings.fisheyeStrength },
            fisheyeRadius: { value: this.settings.fisheyeRadius },
            chromaticAberrationAmount: { value: this.settings.chromaticAberration },
            minInputLevel: { value: this.settings.minInputLevel },
            maxInputLevel: { value: this.settings.maxInputLevel },
            gammaLevel: { value: this.settings.gamma },
            exposure: { value: this.settings.exposure },
            visionMode: { value: VISION_MODE_MAP[this.settings.visionMode] ?? 0 },
            thermalSensitivity: { value: this.settings.thermalSensitivity },
            nightVisionGain: { value: this.settings.nightVisionGain },
            nightVisionNoise: { value: this.settings.nightVisionNoise },
            crtIntensity: { value: this.settings.crtIntensity },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: colorFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.rgbPass = new ShaderPass(this.rgbShader);

        this.copyShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: copyFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.copyPass = new ShaderPass(this.copyShader);
      }

      updateSettings() {
        this.bloomPass.enabled = this.settings.bloomEnabled;
        this.bloomPass.strength = this.settings.bloomStrength;
        this.bloomPass.radius = this.settings.bloomRadius;
        this.bloomPass.threshold = this.settings.bloomThreshold;

        this.godRaysMaskShader.uniforms.threshold.value = this.settings.raysThreshold;
        this.godRaysGenShader.uniforms.distanceAttenuation.value = this.settings.raysDistanceAttenuation;
        this.godRaysGenShader.uniforms.maxDensity.value = this.settings.raysMaxDensity;

        this.anamorphicBrightShader.uniforms.threshold.value = this.settings.anamorphicThreshold;
        this.anamorphicBrightShader.uniforms.smoothWidth.value = this.settings.anamorphicSmoothWidth;
        this.anamorphicBlurShader.uniforms.samples.value = this.settings.anamorphicSamples;
        this.anamorphicBlurShader.uniforms.intensity.value = this.settings.anamorphicIntensity;
        this.anamorphicBlurShader.uniforms.tintColor.value.copy(this.settings.anamorphicColor);
        this.anamorphicBlurShader.uniforms.bloomRadius.value = this.settings.anamorphicRadius;

        this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
        this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
        this.finalShader.uniforms.raysEnabled.value = this.settings.raysEnabled && this.moonInFront;
        this.finalShader.uniforms.raysStrength.value = this.settings.raysStrength;
        this.finalShader.uniforms.raysColor.value.copy(this.settings.raysColor);
        this.finalShader.uniforms.anamorphicEnabled.value = this.settings.anamorphicEnabled;
        this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
        this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
        this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;

        this.rgbShader.uniforms.fisheyeStrength.value = this.settings.fisheyeStrength;
        this.rgbShader.uniforms.fisheyeRadius.value = this.settings.fisheyeRadius;
        this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
        this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
        this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
        this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
        this.rgbShader.uniforms.exposure.value = this.settings.exposure;
        this.rgbShader.uniforms.visionMode.value = VISION_MODE_MAP[this.settings.visionMode] ?? 0;
        this.rgbShader.uniforms.thermalSensitivity.value = this.settings.thermalSensitivity;
        this.rgbShader.uniforms.nightVisionGain.value = this.settings.nightVisionGain;
        this.rgbShader.uniforms.nightVisionNoise.value = this.settings.nightVisionNoise;
        this.rgbShader.uniforms.crtIntensity.value = this.settings.crtIntensity;
      }

      setSize(w0, h0, dpr = 1) {
        const w = Math.max(1, Math.floor(w0 * dpr));
        const h = Math.max(1, Math.floor(h0 * dpr));
        this.sceneTarget.setSize(w, h);
        this.finalPass.setSize(w, h);
        this.finalShader.uniforms.resolution.value.set(w, h);
        this.bloomPass.setSize(w, h);

        const grW = Math.max(1, Math.round(w / 2));
        const grH = Math.max(1, Math.round(h / 2));
        this.godRaysMaskPass.setSize(grW, grH);
        this.godRaysPingPong.setSize(grW, grH);

        const anW = Math.max(1, Math.round(w / 4));
        const anH = Math.max(1, Math.round(h / 4));
        this.anamorphicBrightPass.setSize(anW, anH);
        this.anamorphicBlurPass.setSize(anW, anH);
        this.anamorphicBlurShader.uniforms.resolution.value.set(anW, anH);

        this.rgbPass.setSize(w, h);
        this.copyPass.setSize(w, h);
      }

      setMoonScreenPosition(camera, moonWorldPos) {
        if (!this._camDir) {
          this._camDir = new THREE.Vector3();
          this._toMoon = new THREE.Vector3();
          this._ndc = new THREE.Vector3();
        }
        camera.getWorldDirection(this._camDir);
        this._toMoon.copy(moonWorldPos).sub(camera.position).normalize();
        const dot = this._camDir.dot(this._toMoon);

        if (dot <= 0.02) {
          this.moonInFront = false;
          this.finalShader.uniforms.raysEnabled.value = false;
          return;
        }

        this.moonInFront = true;
        const fade = THREE.MathUtils.clamp((dot - 0.02) / 0.15, 0.0, 1.0);

        this._ndc.copy(moonWorldPos).project(camera);
        const screenX = this._ndc.x * 0.5 + 0.5;
        const screenY = this._ndc.y * 0.5 + 0.5;
        const screenZ = fade;

        this.moonScreenPos.set(screenX, screenY, screenZ);
        this.godRaysGenShader.uniforms.vSunPositionScreenSpace.value.set(screenX, screenY, screenZ);
      }

      renderScene(scene, camera) {
        if (!this.settings.enabled) {
          this.renderer.render(scene, camera);
          return;
        }
        this.renderer.setRenderTarget(this.sceneTarget);
        this.renderer.render(scene, camera);
        this.renderer.setRenderTarget(null);
        this.render(this.sceneTarget.texture);
      }

      render(sourceTexture) {
        if (!this.settings.enabled) {
          this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
          this.copyPass.render(this.renderer, true);
          return;
        }

        this.updateSettings();

        this.bloomPass.source = sourceTexture;
        this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
        this.bloomPass.render(this.renderer);

        this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
        this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
        this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
        this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
        this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

        if (this.settings.raysEnabled && this.settings.raysStrength > 0.001 && this.moonInFront) {
          this.godRaysMaskShader.uniforms.inputTexture.value = sourceTexture;
          this.godRaysMaskShader.uniforms.threshold.value = this.settings.raysThreshold;
          this.godRaysMaskPass.render(this.renderer);

          const filterLen = this.settings.raysDensity;
          const tapsPerPass = 6.0;

          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -1.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysMaskPass.texture;
          this.godRaysPingPong.render(this.renderer);

          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -2.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysPingPong.texture;
          this.godRaysPingPong.render(this.renderer);

          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -3.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysPingPong.texture;
          this.godRaysPingPong.render(this.renderer);

          this.finalPass.shader.uniforms.raysTexture.value = this.godRaysPingPong.texture;
          this.finalPass.shader.uniforms.raysEnabled.value = true;
        } else {
          this.finalPass.shader.uniforms.raysEnabled.value = false;
        }

        if (this.settings.anamorphicEnabled && this.settings.anamorphicIntensity > 0.001) {
          this.anamorphicBrightShader.uniforms.inputTexture.value = sourceTexture;
          this.anamorphicBrightShader.uniforms.threshold.value = this.settings.anamorphicThreshold;
          this.anamorphicBrightShader.uniforms.smoothWidth.value = this.settings.anamorphicSmoothWidth;
          this.anamorphicBrightPass.render(this.renderer);

          this.anamorphicBlurShader.uniforms.inputTexture.value = this.anamorphicBrightPass.texture;
          this.anamorphicBlurShader.uniforms.samples.value = this.settings.anamorphicSamples;
          this.anamorphicBlurShader.uniforms.intensity.value = this.settings.anamorphicIntensity;
          this.anamorphicBlurShader.uniforms.tintColor.value.copy(this.settings.anamorphicColor);
          this.anamorphicBlurShader.uniforms.bloomRadius.value = this.settings.anamorphicRadius;
          this.anamorphicBlurPass.render(this.renderer);

          this.finalPass.shader.uniforms.anamorphicTexture.value = this.anamorphicBlurPass.texture;
          this.finalPass.shader.uniforms.anamorphicEnabled.value = true;
        } else {
          this.finalPass.shader.uniforms.anamorphicEnabled.value = false;
        }

        const randomTime = Math.random() * 100000;
        this.finalPass.shader.uniforms.time.value = randomTime;
        this.rgbPass.shader.uniforms.time.value = randomTime;

        this.finalPass.render(this.renderer);
        this.rgbPass.render(this.renderer, true);
      }

    // --- Procedural Canvas Texture Generation ---
    function createLeatherCanvas(colorHex) {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');
      
      ctx.fillStyle = colorHex;
      ctx.fillRect(0, 0, 1024, 1024);
      
      const imgData = ctx.getImageData(0, 0, 1024, 1024);
      const data = imgData.data;
      for (let i = 0; i < data.length; i += 4) {
        const noise = (Math.random() - 0.5) * 32;
        data[i] = Math.max(0, Math.min(255, data[i] + noise));
        data[i + 1] = Math.max(0, Math.min(255, data[i + 1] + noise * 0.85));
        data[i + 2] = Math.max(0, Math.min(255, data[i + 2] + noise * 0.7));
      }
      ctx.putImageData(imgData, 0, 0);
      
      const grad = ctx.createRadialGradient(512, 512, 180, 512, 512, 700);
      grad.addColorStop(0, 'rgba(0,0,0,0)');
      grad.addColorStop(1, 'rgba(0,0,0,0.68)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 1024, 1024);
      
      ctx.strokeStyle = 'rgba(212, 175, 55, 0.4)';
      ctx.lineWidth = 14;
      ctx.strokeRect(55, 55, 914, 914);
      ctx.lineWidth = 3;
      ctx.strokeRect(78, 78, 868, 868);
      
      const corners = [[85, 85], [939, 85], [85, 939], [939, 939]];
      corners.forEach(([cx, cy]) => {
        ctx.beginPath();
        ctx.arc(cx, cy, 32, 0, Math.PI * 2);
        ctx.stroke();
      });
      return canvas;
    }

    function createLeatherEmissiveCanvas() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');
      
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, 1024, 1024);
      
      ctx.save();
      ctx.translate(512, 512);
      ctx.strokeStyle = '#ffffff';
      ctx.fillStyle = '#ffffff';
      ctx.lineWidth = 4;
      
      ctx.beginPath(); ctx.arc(0, 0, 270, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, 245, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, 160, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, 75, 0, Math.PI * 2); ctx.stroke();
      
      ctx.beginPath();
      const points = 7;
      const step = 3;
      const R = 240;
      for (let i = 0; i <= points; i++) {
        const a = ((i * step) % points) * (Math.PI * 2 / points) - Math.PI / 2;
        const x = Math.cos(a) * R;
        const y = Math.sin(a) * R;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
      
      ctx.font = '22px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const runes = ['ᚠ','ᚢ','ᚦ','ᚨ','ᚱ','ᚲ','ᚷ','ᚹ','ᚺ','ᚾ','ᛁ','ᛃ','ᛇ','ᛈ','ᛉ','ᛊ','ᛏ','ᛒ','ᛖ','ᛗ','ᛚ','ᛜ','ᛞ','ᛟ'];
      for (let i = 0; i < runes.length; i++) {
        const a = (i / runes.length) * Math.PI * 2;
        ctx.save();
        ctx.rotate(a);
        ctx.fillText(runes[i], 0, -202);
        ctx.restore();
      }
      
      for (let i = 0; i < 28; i++) {
        const a = (i / 28) * Math.PI * 2;
        ctx.save();
        ctx.rotate(a);
        ctx.beginPath();
        ctx.moveTo(0, -245);
        ctx.lineTo(0, -265);
        ctx.stroke();
        ctx.restore();
      }
      
      ctx.beginPath();
      ctx.arc(0, 0, 32, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000000';
      ctx.beginPath();
      ctx.arc(0, 0, 14, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.restore();
      
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 3;
      ctx.strokeRect(65, 65, 894, 894);
      return canvas;
    }

    // --- State & Parameters ---
    const defaultSchemeKey = 'Monochromatic';
    const initScheme = COLOR_SCHEMES[defaultSchemeKey];

    const params = {
      colorScheme: defaultSchemeKey,
      greenscreen: false,
      coverColor: initScheme.cover,
      parchmentColor: initScheme.parchment,
      runeColor: initScheme.rune,
      accentColor: initScheme.accent,
      lightColor: initScheme.light,
      bgColor: initScheme.bg,
      
      animation: 'Gentle Levitation',
      animSpeed: 1.0,
      flipSpeed: 1.0,
      breathingFreq: 2.4,
      
      bendIntensity: 1.25,
      spineSweep: 0.85,
      flutter: 0.65,
      emissiveIntensity: 2.4,
      particles: true,
      
      dpr: Math.min(window.devicePixelRatio || 1, 2.0),

    };

    // --- Three.js Setup ---

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(params.dpr);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(params.bgColor);
    scene.fog = new THREE.FogExp2(params.bgColor, 0.05);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 3.4, 5.8);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.enableZoom = true;
    controls.enablePan = true;
    controls.screenSpacePanning = true;
    controls.minDistance = 1.5;
    controls.maxDistance = 25.0;
    controls.target.set(0, 0.2, 0);

    // --- Initialize Custom PostProcessor Pipeline ---
    const postProcessor = new PostProcessor(renderer, {
      enabled: true,
      bloomEnabled: true,
      bloomStrength: 1.0,
      bloomRadius: 0.55,
      bloomThreshold: 0.2,
      raysEnabled: false,
      anamorphicEnabled: false,
      chromaticAberration: 0.012,
      vignetteBoost: 1.1,
      vignetteReduction: 0.55,
      noiseIntensity: 0.015,
      gamma: 1.0,
      exposure: 1.05
    });
    postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);

    // --- Lighting ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xffffff, 1.2);
    keyLight.position.set(4, 8, 5);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.width = 1024;
    keyLight.shadow.mapSize.height = 1024;
    scene.add(keyLight);

    bookLight.position.set(0, 1.2, 0.2);
    scene.add(bookLight);

    // --- Texture Instances ---
    let leatherTexture = new THREE.CanvasTexture(createLeatherCanvas(params.coverColor));
    let leatherEmissiveTexture = new THREE.CanvasTexture(createLeatherEmissiveCanvas());
    let parchmentTexture = new THREE.CanvasTexture(createParchmentCanvas(params.parchmentColor));
    let parchmentEmissiveTexture = new THREE.CanvasTexture(createParchmentEmissiveCanvas());
    let bookEdgesTexture = new THREE.CanvasTexture(createBookEdgesCanvas());
    let magicRingTexture = new THREE.CanvasTexture(createMagicRingCanvas());

    [leatherTexture, leatherEmissiveTexture, parchmentTexture, parchmentEmissiveTexture, bookEdgesTexture, magicRingTexture].forEach(tex => {
      tex.wrapS = THREE.ClampToEdgeWrapping;
      tex.wrapT = THREE.ClampToEdgeWrapping;
      tex.generateMipmaps = true;
    });

    // --- Materials ---
    const coverMaterial = new THREE.MeshStandardMaterial({
      map: leatherTexture,
      emissiveMap: leatherEmissiveTexture,

      emissiveIntensity: params.emissiveIntensity,

      roughness: 0.65,
      metalness: 0.1
    });

    // --- Book Geometry Construction ---
    const grimoireGroup = new THREE.Group();
    scene.add(grimoireGroup);

    const PAGE_WIDTH = 1.95;
    const PAGE_HEIGHT = 2.85;
    const BOOK_DEPTH = 0.38;
    const OPEN_ANGLE = 0.18;

    const coverGeom = new THREE.BoxGeometry(PAGE_WIDTH + 0.14, PAGE_HEIGHT + 0.18, 0.045);
    coverGeom.translate((PAGE_WIDTH + 0.14) / 2, 0, 0);

    const rightCover = new THREE.Mesh(coverGeom, coverMaterial);
    rightCover.rotation.y = OPEN_ANGLE;
    rightCover.position.set(0, 0, -0.05);
    rightCover.castShadow = true;
    rightCover.receiveShadow = true;
    grimoireGroup.add(rightCover);

    const leftCoverGeom = coverGeom.clone();
    leftCoverGeom.scale(-1, 1, 1);
    const leftCover = new THREE.Mesh(leftCoverGeom, coverMaterial);
    leftCover.rotation.y = -OPEN_ANGLE;
    leftCover.position.set(0, 0, -0.05);
    leftCover.castShadow = true;
    leftCover.receiveShadow = true;
    grimoireGroup.add(leftCover);

    // Dedicated leather material for spine (without the large central cover seal)
    const spineMaterial = new THREE.MeshStandardMaterial({
      map: leatherTexture,
      roughness: 0.55,
      metalness: 0.25,
      bumpMap: leatherTexture,
      bumpScale: 0.025
    });

    // Upright vertical cylinder arc for spine along Y axis (open-ended half-cylinder curving backwards in -Z)
    const spineGeom = new THREE.CylinderGeometry(0.18, 0.18, PAGE_HEIGHT + 0.18, 32, 1, true, Math.PI * 0.5, Math.PI);
    const spineMesh = new THREE.Mesh(spineGeom, spineMaterial);
    spineMesh.rotation.set(0, 0, 0);
    spineMesh.position.set(0, 0, -0.05);
    grimoireGroup.add(spineMesh);

    // Spine Raised Ribs (Gold bands wrapping the spine in the -Z half-plane)
    for (let r = -1.1; r <= 1.1; r += 0.55) {
      const ribGeom = new THREE.TorusGeometry(0.185, 0.016, 8, 24, Math.PI);
      const rib = new THREE.Mesh(ribGeom, brassMaterial);
      rib.rotation.x = -Math.PI / 2;
      rib.position.set(0, r, -0.05);
      grimoireGroup.add(rib);
    }

    function createCornerBracket() {
      const g = new THREE.BoxGeometry(0.24, 0.24, 0.055);
      return new THREE.Mesh(g, brassMaterial);
    }
    const corners = [
      [PAGE_WIDTH + 0.06, (PAGE_HEIGHT + 0.16) / 2, 0, OPEN_ANGLE],
      [PAGE_WIDTH + 0.06, -(PAGE_HEIGHT + 0.16) / 2, 0, OPEN_ANGLE],
      [-(PAGE_WIDTH + 0.06), (PAGE_HEIGHT + 0.16) / 2, 0, -OPEN_ANGLE],
      [-(PAGE_WIDTH + 0.06), -(PAGE_HEIGHT + 0.16) / 2, 0, -OPEN_ANGLE]
    ];
    corners.forEach(([x, y, z, rotY]) => {
      const c = createCornerBracket();
      c.position.set(x, y, z);
      c.rotation.y = rotY;
      grimoireGroup.add(c);
    });

    const stackGeom = new THREE.BoxGeometry(PAGE_WIDTH, PAGE_HEIGHT, BOOK_DEPTH * 0.45);
    stackGeom.translate(PAGE_WIDTH / 2, 0, BOOK_DEPTH * 0.225);

    const stackMaterials = [
      stackSideMaterial,
      stackSideMaterial,
      stackSideMaterial,
      stackSideMaterial,
      stackTopMaterial,
      coverMaterial
    ];

    const rightStack = new THREE.Mesh(stackGeom, stackMaterials);
    rightStack.rotation.y = OPEN_ANGLE;
    rightStack.position.set(0, 0, -0.03);
    grimoireGroup.add(rightStack);

    const leftStackGeom = stackGeom.clone();
    leftStackGeom.scale(-1, 1, 1);
    const leftStack = new THREE.Mesh(leftStackGeom, stackMaterials);
    leftStack.rotation.y = -OPEN_ANGLE;
    leftStack.position.set(0, 0, -0.03);
    grimoireGroup.add(leftStack);

    // --- Flipping Pages with Custom Vertex Shader ---
    const pageVertexShader = `
      uniform float uTime;
      uniform float uFlipProgress;
      uniform float uBendIntensity;
      uniform float uSpineSweep;
      uniform float uFlutter;
      uniform float uPageWidth;
      uniform float uPageHeight;

      varying vec2 vUv;
      varying vec3 vNormal;
      varying vec3 vWorldPosition;

      vec3 deformPage(vec3 pos, float progress) {
        float u = clamp(pos.x / uPageWidth, 0.0, 1.0);
        float v = pos.y / uPageHeight;

        float thetaStart = 0.18;
        float thetaEnd = 3.14159265 - 0.18;
        float baseAngle = mix(thetaStart, thetaEnd, progress);

        float midFlip = sin(progress * 3.14159265);
        float lag = midFlip * pow(u, 1.3) * 0.75 * uBendIntensity;
        float angle = baseAngle - lag;

        float spineSweepAngle = sin(u * 3.14159265) * cos(v * 2.8) * 0.28 * uSpineSweep * midFlip;
        angle += spineSweepAngle;

        float lift = midFlip * sin(u * 3.14159265 * 0.88) * 0.42 * uBendIntensity;
        float flutterWave = sin(uTime * 6.5 + u * 5.0 + v * 4.0) * pow(u, 1.7) * 0.035 * uFlutter;

        float r = u * uPageWidth;
        vec3 deformed;
        deformed.x = r * cos(angle);
        deformed.z = r * sin(angle) + lift + flutterWave;
        deformed.y = pos.y + sin(u * 3.14159265) * cos(v * 3.14159265) * 0.03 * midFlip;

        return deformed;
      }

      void main() {
        vUv = uv;

        vec3 p = position;
        vec3 defP = deformPage(p, uFlipProgress);

        float eps = 0.015;
        vec3 pX = deformPage(p + vec3(eps, 0.0, 0.0), uFlipProgress);
        vec3 pY = deformPage(p + vec3(0.0, eps, 0.0), uFlipProgress);

        vec3 tX = normalize(pX - defP);
        vec3 tY = normalize(pY - defP);
        vec3 norm = normalize(cross(tX, tY));

        vNormal = normalMatrix * norm;

        vec4 worldPos = modelMatrix * vec4(defP, 1.0);
        vWorldPosition = worldPos.xyz;
        gl_Position = projectionMatrix * viewMatrix * worldPos;
      }
    `;

    const pageFragmentShader = `
      uniform sampler2D uMap;
      uniform sampler2D uEmissiveMap;
      uniform vec3 uParchmentColor;
      uniform vec3 uRuneColor;
      uniform float uEmissiveIntensity;
      uniform float uBreathingFreq;
      uniform float uTime;
      uniform float uOpacity;
      uniform vec3 uLightPos;
      uniform vec3 uLightColor;

      varying vec2 vUv;
      varying vec3 vNormal;
      varying vec3 vWorldPosition;

      void main() {
        if (uOpacity < 0.005) discard;

        vec2 uvCoord = gl_FrontFacing ? vUv : vec2(1.0 - vUv.x, vUv.y);
        
        vec4 texColor = texture2D(uMap, uvCoord);
        vec4 emissiveTex = texture2D(uEmissiveMap, uvCoord);

        vec3 N = normalize(vNormal);
        if (!gl_FrontFacing) N = -N;

        vec3 lightDir = normalize(uLightPos - vWorldPosition);
        float diff = max(dot(N, lightDir), 0.0);
        float ambient = 0.38;

        float breathing = 0.8 + 0.35 * sin(uTime * uBreathingFreq) + 0.15 * sin(uTime * uBreathingFreq * 2.3 + 0.7);
        vec3 runeGlow = uRuneColor * uEmissiveIntensity * breathing * emissiveTex.r;

        vec3 diffuse = texColor.rgb * (diff * uLightColor + ambient);
        vec3 finalColor = diffuse + runeGlow;

        gl_FragColor = vec4(finalColor, uOpacity);
      }
    `;

    const NUM_FLIPPING_PAGES = 7;
    const flippingPages = [];

    const pagePlaneGeom = new THREE.PlaneGeometry(PAGE_WIDTH, PAGE_HEIGHT, 42, 24);
    pagePlaneGeom.translate(PAGE_WIDTH / 2, 0, 0);

    for (let i = 0; i < NUM_FLIPPING_PAGES; i++) {
      const pageMat = new THREE.ShaderMaterial({
        vertexShader: pageVertexShader,
        fragmentShader: pageFragmentShader,
        uniforms: {
          uTime: { value: 0 },
          uFlipProgress: { value: 0 },
          uOpacity: { value: 1.0 },
          uBendIntensity: { value: params.bendIntensity },
          uSpineSweep: { value: params.spineSweep },
          uFlutter: { value: params.flutter },
          uPageWidth: { value: PAGE_WIDTH },
          uPageHeight: { value: PAGE_HEIGHT },
          uMap: { value: parchmentTexture },
          uEmissiveMap: { value: parchmentEmissiveTexture },
          uParchmentColor: { value: new THREE.Color(params.parchmentColor) },
          uRuneColor: { value: new THREE.Color(params.runeColor) },
          uEmissiveIntensity: { value: params.emissiveIntensity },
          uBreathingFreq: { value: params.breathingFreq },
          uLightPos: { value: bookLight.position },
          uLightColor: { value: new THREE.Color(params.lightColor) }
        },
        side: THREE.DoubleSide,
        transparent: true,
        depthWrite: false
      });

      const pageMesh = new THREE.Mesh(pagePlaneGeom, pageMat);
      pageMesh.position.set(0, 0, 0.08);
      grimoireGroup.add(pageMesh);
      flippingPages.push(pageMesh);
    }

    // --- Floating Magic Ring Floor Aura ---
    const magicRingGeom = new THREE.PlaneGeometry(7.0, 7.0);
    const magicRingMat = new THREE.MeshBasicMaterial({
      map: magicRingTexture,
      color: new THREE.Color(params.runeColor),
      transparent: true,
      opacity: 0.45,
      blending: THREE.AdditiveBlending,
      side: THREE.DoubleSide,
      depthWrite: false
    });
    const magicRingMesh = new THREE.Mesh(magicRingGeom, magicRingMat);
    magicRingMesh.rotation.x = -Math.PI / 2;
    magicRingMesh.position.y = -1.6;
    scene.add(magicRingMesh);

    // --- Arcane Floating Dust Motes / Particles ---
    const PARTICLE_COUNT = 240;
    const particleGeom = new THREE.BufferGeometry();
    const particlePositions = new Float32Array(PARTICLE_COUNT * 3);
    const particleSeeds = new Float32Array(PARTICLE_COUNT * 3);

    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const radius = 0.5 + Math.random() * 2.8;
      const angle = Math.random() * Math.PI * 2;
      const y = (Math.random() - 0.4) * 3.5;

      particlePositions[i * 3] = Math.cos(angle) * radius;
      particlePositions[i * 3 + 1] = y;
      particlePositions[i * 3 + 2] = Math.sin(angle) * radius;

      particleSeeds[i * 3] = Math.random() * 10;
      particleSeeds[i * 3 + 1] = 0.2 + Math.random() * 0.8;
      particleSeeds[i * 3 + 2] = angle;
    }
    particleGeom.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));

    const particleMat = new THREE.PointsMaterial({
      color: new THREE.Color(params.runeColor),
      size: 0.055,
      transparent: true,
      opacity: 0.75,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const particles = new THREE.Points(particleGeom, particleMat);
    scene.add(particles);

    // --- Update & Color Synchronization ---
    function updateColors() {
      leatherTexture.image = createLeatherCanvas(params.coverColor);
      leatherTexture.needsUpdate = true;

      parchmentTexture.image = createParchmentCanvas(params.parchmentColor);
      parchmentTexture.needsUpdate = true;

      const runeCol = new THREE.Color(params.runeColor);
      const accentCol = new THREE.Color(params.accentColor);
      const lightCol = new THREE.Color(params.lightColor);
      const bgCol = new THREE.Color(params.greenscreen ? '#00ff00' : params.bgColor);

      coverMaterial.emissive.copy(runeCol);
      coverMaterial.emissiveIntensity = params.emissiveIntensity;

      brassMaterial.color.copy(accentCol);

      stackTopMaterial.emissive.copy(runeCol);
      stackTopMaterial.emissiveIntensity = params.emissiveIntensity;

      bookLight.color.copy(lightCol);
      magicRingMat.color.copy(runeCol);
      particleMat.color.copy(runeCol);

      if (params.greenscreen) {
        scene.background = new THREE.Color('#00ff00');
        scene.fog.density = 0.0;
      } else {
        scene.background = bgCol;
        scene.fog.color = bgCol;
        scene.fog.density = 0.05;
      }

      flippingPages.forEach(p => {
        p.material.uniforms.uRuneColor.value.copy(runeCol);
        p.material.uniforms.uParchmentColor.value.copy(new THREE.Color(params.parchmentColor));
        p.material.uniforms.uLightColor.value.copy(lightCol);
        p.material.uniforms.uEmissiveIntensity.value = params.emissiveIntensity;
      });
    }

    function applyColorScheme() {
      const scheme = COLOR_SCHEMES[params.colorScheme];
      if (!scheme) return;
      params.coverColor = scheme.cover;
      params.parchmentColor = scheme.parchment;
      params.runeColor = scheme.rune;
      params.accentColor = scheme.accent;
      params.lightColor = scheme.light;
      params.bgColor = scheme.bg;

      updateColors();
      themeFolder.controllersRecursive().forEach(c => c.updateDisplay());
    }

    function toggleGreenscreen() {
      if (params.greenscreen) {
        scene.background = new THREE.Color('#00ff00');
        scene.fog.density = 0.0;
      } else {
        scene.background = new THREE.Color(params.bgColor);
        scene.fog.color = new THREE.Color(params.bgColor);
        scene.fog.density = 0.05;
      }
    }

    function updateShaderUniforms() {
      flippingPages.forEach(p => {
        p.material.uniforms.uBendIntensity.value = params.bendIntensity;
        p.material.uniforms.uSpineSweep.value = params.spineSweep;
        p.material.uniforms.uFlutter.value = params.flutter;
        p.material.uniforms.uBreathingFreq.value = params.breathingFreq;
        p.material.uniforms.uEmissiveIntensity.value = params.emissiveIntensity;
      });
      particles.visible = params.particles;
    }

    // --- Procedural Scene Randomizer ---
    // Note: Postprocessing settings are strictly preserved and NOT shuffled or changed
    function randomizeScene() {
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      params.colorScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      const scheme = COLOR_SCHEMES[params.colorScheme];

      params.coverColor = scheme.cover;
      params.parchmentColor = scheme.parchment;
      params.runeColor = scheme.rune;
      params.accentColor = scheme.accent;
      params.lightColor = scheme.light;
      params.bgColor = scheme.bg;

      params.bendIntensity = THREE.MathUtils.randFloat(0.65, 1.85);
      params.spineSweep = THREE.MathUtils.randFloat(0.35, 1.45);
      params.flutter = THREE.MathUtils.randFloat(0.35, 1.35);
      params.emissiveIntensity = THREE.MathUtils.randFloat(1.6, 3.8);
      params.breathingFreq = THREE.MathUtils.randFloat(1.2, 4.2);
      params.flipSpeed = THREE.MathUtils.randFloat(0.55, 1.75);

      const animList = [
        'Gentle Levitation',
        'Arcane Turntable',
        'Mystic Drift',
        'Cursed Surge',
        'Reading Stance',
        'Celestial Wobble',
        'Ethereal Float'
      ];
      params.animation = animList[Math.floor(Math.random() * animList.length)];

      updateColors();
      updateShaderUniforms();

      // Only update scene controllers; do not modify or touch postprocessing settings
      themeFolder.controllersRecursive().forEach(c => c.updateDisplay());
      animFolder.controllersRecursive().forEach(c => c.updateDisplay());
      magicFolder.controllersRecursive().forEach(c => c.updateDisplay());
    }

    // --- lil-gui Interface Setup ---
    const gui = new GUI({ title: 'Cursed Spellbook Controls' });

    // 1. Attach PostProcessor Settings Folder
    postProcessor.attachGUI(gui, "Post-Processing Suite");

    // 2. Scene Theming Folder
    const themeFolder = gui.addFolder('Theme & Palette');
    themeFolder.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Color Scheme').onChange(applyColorScheme);
    themeFolder.add(params, 'greenscreen').name('Greenscreen (#00ff00)').onChange(toggleGreenscreen);
    themeFolder.addColor(params, 'coverColor').name('Grimoire Leather').onChange(updateColors);
    themeFolder.addColor(params, 'parchmentColor').name('Parchment').onChange(updateColors);
    themeFolder.addColor(params, 'runeColor').name('Runic Glow').onChange(updateColors);
    themeFolder.addColor(params, 'accentColor').name('Brass & Accents').onChange(updateColors);
    themeFolder.addColor(params, 'lightColor').name('Occult Light').onChange(updateColors);
    themeFolder.addColor(params, 'bgColor').name('Background').onChange(updateColors);

    // 3. Animation Controls Folder
    const animFolder = gui.addFolder('Motion & Animations');
    animFolder.add(params, 'animation', [
      'Gentle Levitation',
      'Arcane Turntable',
      'Mystic Drift',
      'Cursed Surge',
      'Reading Stance',
      'Celestial Wobble',
      'Ethereal Float',
      'Static (No Movement)'
    ]).name('Animation Preset');
    animFolder.add(params, 'animSpeed', 0.1, 3.0, 0.1).name('Animation Speed');
    animFolder.add(params, 'flipSpeed', 0.2, 3.0, 0.1).name('Flip Pace');
    animFolder.add(params, 'breathingFreq', 0.5, 6.0, 0.1).name('Breathing Rate').onChange(updateShaderUniforms);

    // 4. Grimoire Procedural Magic Folder
    const magicFolder = gui.addFolder('Grimoire Sorcery');
    magicFolder.add(params, 'bendIntensity', 0.2, 2.5, 0.05).name('Page Curvature').onChange(updateShaderUniforms);
    magicFolder.add(params, 'spineSweep', 0.0, 2.0, 0.05).name('Spine Curvature').onChange(updateShaderUniforms);
    magicFolder.add(params, 'flutter', 0.0, 2.0, 0.05).name('Page Flutter').onChange(updateShaderUniforms);
    magicFolder.add(params, 'emissiveIntensity', 0.2, 5.0, 0.1).name('Rune Emissive').onChange(updateColors);
    magicFolder.add(params, 'particles').name('Arcane Motes').onChange(updateShaderUniforms);

    // 5. System & Interaction Folder
    const sysFolder = gui.addFolder('Interaction & System');
    sysFolder.add(params, 'dpr', 0.5, 2.5, 0.25).name('Pixel Ratio (DPR)').onChange(v => {
      renderer.setPixelRatio(v);
      postProcessor.setSize(window.innerWidth, window.innerHeight, v);
    });
    sysFolder.add(params, 'clickRandomize').name('Click to Randomize');

    // Hide / Show UI with 'H' key
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        if (gui._hidden) {
          gui.show();
        } else {
          gui.hide();
        }
      }
    });

    // Pointer click detection (differentiates click from orbit drag/zoom)
    let pointerDownPos = { x: 0, y: 0 };
    let pointerDownTime = 0;

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.lil-gui')) return;
      pointerDownPos = { x: e.clientX, y: e.clientY };
      pointerDownTime = performance.now();
    });

    window.addEventListener('pointerup', (e) => {
      if (e.target.closest('.lil-gui')) return;
      const dx = e.clientX - pointerDownPos.x;
      const dy = e.clientY - pointerDownPos.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const duration = performance.now() - pointerDownTime;

      if (dist < 6 && duration < 350 && params.clickRandomize) {
        randomizeScene();
      }
    });

    // Resize Handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);
    });

    // --- Main Animation Loop ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const time = clock.getElapsedTime() * params.animSpeed;

      // 1. Book Motion Presets
      switch (params.animation) {
        case 'Gentle Levitation':
          grimoireGroup.position.set(0, Math.sin(time * 1.2) * 0.16, 0);
          grimoireGroup.rotation.set(
            Math.sin(time * 0.85) * 0.08,
            Math.sin(time * 0.45) * 0.12,
            Math.cos(time * 0.7) * 0.06
          );
          break;

        case 'Arcane Turntable':
          grimoireGroup.position.set(0, Math.sin(time * 1.1) * 0.12, 0);
          grimoireGroup.rotation.set(
            0.12,
            time * 0.35,
            Math.cos(time * 0.6) * 0.04
          );
          break;

        case 'Mystic Drift':
          grimoireGroup.position.set(
            Math.sin(time * 0.6) * 0.35,
            Math.cos(time * 1.2) * 0.18,
            Math.sin(time * 0.8) * 0.25
          );
          grimoireGroup.rotation.set(
            Math.sin(time * 0.7) * 0.1,
            Math.cos(time * 0.5) * 0.2,
            Math.sin(time * 0.9) * 0.08
          );
          break;

        case 'Cursed Surge':
          const surge = Math.pow(Math.max(0.0, Math.sin(time * 1.3)), 1.6) * 0.32;
          grimoireGroup.position.set(0, surge, 0);
          grimoireGroup.rotation.set(
            0.1 + Math.sin(time * 1.3) * 0.08,
            Math.sin(time * 0.6) * 0.1,
            Math.cos(time * 1.3) * 0.05
          );
          break;

        case 'Reading Stance':
          grimoireGroup.position.set(0, Math.sin(time * 0.8) * 0.06, 0);
          grimoireGroup.rotation.set(0.48, 0, 0);
          break;

        case 'Celestial Wobble':
          grimoireGroup.position.set(0, Math.sin(time * 0.9) * 0.14, 0);
          grimoireGroup.rotation.set(
            Math.sin(time * 0.8) * 0.16,
            time * 0.15,
            Math.cos(time * 0.8) * 0.16
          );
          break;

        case 'Ethereal Float':
          grimoireGroup.position.set(
            Math.sin(time * 0.35) * 0.2,
            Math.sin(time * 0.5) * 0.14,
            Math.cos(time * 0.4) * 0.18
          );
          grimoireGroup.rotation.set(
            Math.sin(time * 0.4) * 0.07,
            Math.sin(time * 0.25) * 0.15,
            Math.cos(time * 0.35) * 0.05
          );
          break;

        case 'Static (No Movement)':
        default:
          grimoireGroup.position.set(0, 0, 0);
          grimoireGroup.rotation.set(0.12, 0, 0);
          break;
      }

      // 2. Continuous Cascading Page Flips with Gentle Opacity Transition
      flippingPages.forEach((page, i) => {
        const cyclePeriod = 1.0;
        const progressRaw = ((time * params.flipSpeed * 0.32 + i / NUM_FLIPPING_PAGES) % cyclePeriod) / cyclePeriod;
        const eased = progressRaw * progressRaw * (3.0 - 2.0 * progressRaw);

        // Gentle opacity transition:
        // Smoothly fades in as it lifts from the right (0.0 to 0.20)
        // Solid opacity during main flight across (0.20 to 0.80)
        // Smoothly fades out as it lands into the left (0.80 to 1.0)
        let opacity = 1.0;
        if (progressRaw < 0.20) {
          opacity = THREE.MathUtils.smoothstep(progressRaw, 0.0, 0.20);
        } else if (progressRaw > 0.80) {
          opacity = 1.0 - THREE.MathUtils.smoothstep(progressRaw, 0.80, 1.0);
        }

        page.material.uniforms.uFlipProgress.value = eased;
        page.material.uniforms.uTime.value = time;
        page.material.uniforms.uOpacity.value = opacity;
        page.material.depthWrite = (opacity > 0.95);
        page.visible = (opacity > 0.005);

        page.position.z = 0.06 + Math.sin(progressRaw * Math.PI) * 0.04 + (i - NUM_FLIPPING_PAGES / 2) * 0.003;
      });

      // 3. Dynamic Runic Breathing & Light Modulation
      const breathing = 0.8 + 0.35 * Math.sin(time * params.breathingFreq) + 0.15 * Math.sin(time * params.breathingFreq * 2.3 + 0.7);
      bookLight.intensity = 2.4 * breathing;
      magicRingMat.opacity = 0.3 + 0.25 * breathing;
      magicRingMesh.rotation.z = time * 0.12;

      // 4. Arcane Particles Upward Spiral Drift
      if (params.particles) {
        const positions = particleGeom.attributes.position.array;
        for (let i = 0; i < PARTICLE_COUNT; i++) {
          const idx = i * 3;
          const speed = particleSeeds[idx + 1];
          positions[idx + 1] += speed * delta * 0.45;

          const curAngle = particleSeeds[idx + 2] + time * speed * 0.3;
          const r = Math.sqrt(positions[idx] * positions[idx] + positions[idx + 2] * positions[idx + 2]);
          positions[idx] = Math.cos(curAngle) * r;
          positions[idx + 2] = Math.sin(curAngle) * r;

          if (positions[idx + 1] > 2.2) {
            positions[idx + 1] = -1.6;
          }
        }
        particleGeom.attributes.position.needsUpdate = true;
      }

      controls.update();
      postProcessor.renderScene(scene, camera);
    }

    animate();
  </script>
</body>
