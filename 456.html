    const orthoVertexShader = `
precision highp float;
in vec3 position;
out vec2 vUv;
void main() {
  vUv = position.xy * 0.5 + 0.5;
  gl_Position = vec4(position.xy, 0.0, 1.0);

    const brightFragmentShader = `
precision highp float;
uniform sampler2D inputTexture;
uniform float bloomThreshold;
in vec2 vUv;
out vec4 fragColor;

vec3 sanitize(vec3 v) {
  if (isnan(v.x) || isinf(v.x)) v.x = 0.0;
  if (isnan(v.y) || isinf(v.y)) v.y = 0.0;
  if (isnan(v.z) || isinf(v.z)) v.z = 0.0;
  return clamp(v, vec3(0.0), vec3(65000.0));
}

void main() {
  vec4 raw = texture(inputTexture, vUv);
  vec3 color = sanitize(raw.rgb);
  float luminance = max(0.0, dot(color, vec3(0.2126, 0.7152, 0.0722)));
  float knee = 0.1;
  float soft = luminance - bloomThreshold + knee;
  soft = clamp(soft, 0.0, 2.0 * knee);
  soft = (soft * soft) / (4.0 * knee + 0.00001);
  float contribution = max(soft, luminance - bloomThreshold);
  contribution /= max(luminance, 0.0001);
  vec3 result = color * contribution;
  fragColor = vec4(sanitize(result), clamp(raw.a, 0.0, 1.0));
}
`;

    const blur13ShaderChunk = `
vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
  vec2 resolution = vec2(textureSize(image, 0));
  vec4 color = vec4(0.0);
  vec2 off1 = vec2(1.411764705882353) * direction;
  vec2 off2 = vec2(3.2941176470588234) * direction;
  vec2 off3 = vec2(5.176470588235294) * direction;
  color += texture(image, uv) * 0.1964825501511404;
  color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
  color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
  color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
  color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
  color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
  color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
  return color;
}
`;

    const blurFragmentShader = `

${blur13ShaderChunk}

    const godRaysGenerateShader = `
precision highp float;
#define TAPS_PER_PASS 6.0

uniform sampler2D inputTexture;
uniform vec3 vSunPositionScreenSpace;
uniform float fStepSize;
uniform float distanceAttenuation;
uniform float maxDensity;
in vec2 vUv;
out vec4 fragColor;

void main() {
  vec2 delta = vSunPositionScreenSpace.xy - vUv;
  float dist = length(delta);
  vec2 stepv = fStepSize * delta / max(dist, 0.0001);
  float iters = dist / max(fStepSize, 0.00001);

  vec2 uv = vUv;
  float col = 0.0;
  float f = min(1.0, max(vSunPositionScreenSpace.z, 0.0));
  float atten = 1.0 / (1.0 + pow(dist, distanceAttenuation));

  if (0.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
  uv += stepv;
  if (1.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
  uv += stepv;
  if (2.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
  uv += stepv;
  if (3.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
  uv += stepv;
  if (4.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
  uv += stepv;
  if (5.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;

  float finalVal = min(col / TAPS_PER_PASS * atten, maxDensity);
  fragColor = vec4(vec3(finalVal), 1.0);
}
`;

    const anamorphicBrightShader = `
precision highp float;
uniform sampler2D inputTexture;
uniform float threshold;
uniform float smoothWidth;
in vec2 vUv;
out vec4 fragColor;

void main() {
  vec4 color = texture(inputTexture, vUv);
  float v = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
  float alpha = smoothstep(threshold, threshold + smoothWidth, v);
  fragColor = mix(vec4(0.0), color, alpha);
}
`;

    const anamorphicBlurShader = `
precision highp float;
uniform sampler2D inputTexture;
uniform vec2 resolution;
uniform float samples;
uniform float intensity;
uniform vec3 tintColor;
uniform float bloomRadius;
in vec2 vUv;
out vec4 fragColor;

void main() {
  int halfSamples = max(1, int(samples) / 2);
  float fHalfSamples = float(halfSamples);
  vec2 invSize = 1.0 / resolution;
  vec4 total = vec4(0.0);

  for (int i = -64; i <= 64; i++) {
    if (i < -halfSamples || i > halfSamples) continue;
    float softness = 1.0 - abs(float(i)) / fHalfSamples;
    softness = pow(softness, 2.0);
    vec2 shiftedUV = vec2(vUv.x + invSize.x * float(i) * (4.0 + bloomRadius * 8.0), vUv.y);
    shiftedUV = clamp(shiftedUV, 0.001, 0.999);
    total += texture(inputTexture, shiftedUV) * softness;
  }

  fragColor = (total / (samples / 3.0)) * vec4(tintColor, 1.0) * intensity;
}
`;

    const finalFragmentShader = `
precision highp float;
uniform vec2 resolution;
uniform sampler2D inputTexture;
uniform sampler2D blur0Texture;
uniform sampler2D blur1Texture;
uniform sampler2D blur2Texture;
uniform sampler2D blur3Texture;
uniform sampler2D blur4Texture;
uniform sampler2D raysTexture;
uniform sampler2D anamorphicTexture;
uniform bool bloomEnabled;
uniform float bloomStrength;
uniform bool raysEnabled;
uniform float raysStrength;
uniform vec3 raysColor;
uniform bool anamorphicEnabled;
uniform float vignetteBoost;
uniform float vignetteReduction;
uniform float noiseIntensity;
uniform float time;
in vec2 vUv;
out vec4 fragColor;

vec3 sanitize(vec3 v) {
  if (isnan(v.x) || isinf(v.x)) v.x = 0.0;
  if (isnan(v.y) || isinf(v.y)) v.y = 0.0;
  if (isnan(v.z) || isinf(v.z)) v.z = 0.0;
  return clamp(v, vec3(0.0), vec3(65000.0));
}

float vignette(vec2 uv, float boost, float reduction) {
  vec2 position = vUv - 0.5;
  return boost - length(position) * reduction;
}

float hash1(uint n) {
  n = (n << 13U) ^ n;
  n = n * (n * n * 15731U + 789221U) + 1376312589U;
  return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
}

float noise(in vec2 uv, in float timeVal) {
  uvec2 p = uvec2(uv);
  return hash1(p.x + 1920U * p.y + (1920U * 1080U) * (uint(timeVal) % 65536U));
}

void main() {
  vec4 raw = texture(inputTexture, vUv);
  vec3 color = sanitize(raw.rgb);

  if (bloomEnabled && bloomStrength > 0.001) {
    vec3 b0 = sanitize(texture(blur0Texture, vUv).rgb);
    vec3 b1 = sanitize(texture(blur1Texture, vUv).rgb);
    vec3 b2 = sanitize(texture(blur2Texture, vUv).rgb);
    vec3 b3 = sanitize(texture(blur3Texture, vUv).rgb);
    vec3 b4 = sanitize(texture(blur4Texture, vUv).rgb);
    vec3 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
    color += bloomSum * bloomStrength;
  }

  if (raysEnabled && raysStrength > 0.001) {
    vec3 r = sanitize(texture(raysTexture, vUv).rgb);
    color += r * raysColor * raysStrength;
  }

  if (anamorphicEnabled) {
    vec3 a = sanitize(texture(anamorphicTexture, vUv).rgb);
    color += a;
  }

  float vig = max(0.0, vignette(vUv, vignetteBoost, vignetteReduction));
  color *= vig;
  color += max(0.0, noiseIntensity) * noise(gl_FragCoord.xy, time);
  fragColor = vec4(sanitize(color), 1.0);
}
`;

    const chromaticAberrationShaderChunk = `
vec2 barrelDistortion(vec2 coord, float amt) {
  vec2 cc = coord - 0.5;
  float dist = dot(cc, cc);
  return coord + cc * dist * amt;
}
float sat(float t) { return clamp(t, 0.0, 1.0); }
float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
vec4 spectrum_offset(float t) {
  float lo = step(t, 0.5);
  float hi = 1.0 - lo;
  float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
  vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
  return pow(ret, vec4(1.0 / 2.2));
}
const float max_distort = 2.2;
const int num_iter = 8;
const float reci_num_iter_f = 1.0 / float(num_iter);
vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
  vec4 sumcol = vec4(0.0);
  vec4 sumw = vec4(0.0);
  for (int i = 0; i < num_iter; ++i) {
    float t = float(i) * reci_num_iter_f;
    vec4 w = spectrum_offset(t);
    sumw += w;
    sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
  }
  return sumcol / sumw;
}
`;

    const colorFragmentShader = `
precision highp float;
uniform sampler2D inputTexture;
uniform float chromaticAberrationAmount;
uniform float minInputLevel;
uniform float maxInputLevel;
uniform float gammaLevel;
uniform float exposure;
uniform float fisheyeStrength;
uniform float fisheyeRadius;
uniform float time;
uniform int visionMode;
uniform float thermalSensitivity;
uniform float nightVisionNoise;
uniform float nightVisionGain;
uniform float crtIntensity;
in vec2 vUv;
out vec4 fragColor;

${chromaticAberrationShaderChunk}

vec2 applyFisheye(vec2 uv, float strength, float radius) {
  if (abs(strength) < 0.0001) return uv;
  vec2 p = uv - 0.5;
  float d = length(p);
  if (d > radius * 1.5) return uv;
  float r = d / max(radius, 0.001);
  float theta = atan(p.y, p.x);
  float rDist = r + strength * (r * r * r);
  return 0.5 + vec2(cos(theta), sin(theta)) * (rDist * radius);
}

vec3 ACESFilmicToneMapping(vec3 color) {
  color = max(vec3(0.0), color);
  float a = 2.51;
  float b = 0.03;
  float c = 2.43;
  float d = 0.59;
  float e = 0.14;
  vec3 denom = max(color * (c * color + d) + e, vec3(0.0001));
  return clamp((color * (a * color + b)) / denom, 0.0, 1.0);
}

vec3 gammaCorrect(vec3 color, vec3 gamma) {
  return pow(max(color, vec3(0.0)), 1.0 / max(gamma, vec3(0.001)));
}
vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
  return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
}
vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
  return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
}

vec3 applyNightVision(vec3 color, vec2 uv, float timeVal, float noiseAmt, float gain, float crt) {
  float lum = dot(color, vec3(0.299, 0.587, 0.114));
  float amplified = pow(lum * gain, 0.72);
  vec3 phosphorColor = mix(vec3(0.02, 0.12, 0.03), vec3(0.18, 1.0, 0.32), clamp(amplified, 0.0, 1.0));
  phosphorColor += vec3(0.7, 1.0, 0.8) * max(0.0, amplified - 0.75) * 1.8;
  vec2 p = uv - 0.5;
  float tubeDist = length(p);
  float tubeMask = smoothstep(0.72, 0.44, tubeDist);
  float n = fract(sin(dot(uv * 280.0 + timeVal * 0.05, vec2(12.9898, 78.233))) * 43758.5453);
  float scanline = sin(uv.y * 650.0) * crt;
  phosphorColor += (n - 0.5) * noiseAmt * 2.0 + scanline;
  return clamp(phosphorColor * tubeMask, 0.0, 1.0);
}

vec3 ironbow(float t) {
  t = clamp(t, 0.0, 1.0);
  vec3 c0 = vec3(0.02, 0.01, 0.18);
  vec3 c1 = vec3(0.22, 0.02, 0.48);
  vec3 c2 = vec3(0.82, 0.05, 0.25);
  vec3 c3 = vec3(1.0, 0.62, 0.02);
  vec3 c4 = vec3(1.0, 1.0, 0.92);
  if (t < 0.25) return mix(c0, c1, t * 4.0);
  if (t < 0.50) return mix(c1, c2, (t - 0.25) * 4.0);
  if (t < 0.75) return mix(c2, c3, (t - 0.50) * 4.0);
  return mix(c3, c4, (t - 0.75) * 4.0);
}

vec3 applyThermal(vec3 color, vec2 uv, float sensitivity, float crt, bool whiteHot) {
  float lum = dot(color, vec3(0.299, 0.587, 0.114));
  float heat = clamp(lum * sensitivity, 0.0, 1.0);
  float sensorRaster = sin(uv.y * 900.0) * (crt * 0.3);
  heat = clamp(heat + sensorRaster, 0.0, 1.0);
  if (whiteHot) {
    return vec3(pow(heat, 0.85));
  } else {
    return ironbow(heat);
  }
}

void main() {
  vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
  vec4 col = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
  vec3 finalCol = col.rgb;
  if (isnan(finalCol.x) || isinf(finalCol.x)) finalCol.x = 0.0;
  if (isnan(finalCol.y) || isinf(finalCol.y)) finalCol.y = 0.0;
  if (isnan(finalCol.z) || isinf(finalCol.z)) finalCol.z = 0.0;
  finalCol = clamp(finalCol, vec3(0.0), vec3(65000.0));

  if (visionMode == 1) {
    finalCol = applyNightVision(finalCol, uv, time, nightVisionNoise, nightVisionGain, crtIntensity);
  } else if (visionMode == 2) {
    finalCol = applyThermal(finalCol, uv, thermalSensitivity, crtIntensity, false);
  } else if (visionMode == 3) {
    finalCol = applyThermal(finalCol, uv, thermalSensitivity, crtIntensity, true);
  } else {
    vec3 exposedColor = finalCol * exposure;
    vec3 toneMappedColor = ACESFilmicToneMapping(exposedColor);
    finalCol = finalLevels(toneMappedColor, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
    if (crtIntensity > 0.0001) {
      float scanline = sin(uv.y * 900.0 + time * 2.0) * crtIntensity;
      finalCol -= scanline;
    }
  }

  fragColor = vec4(finalCol, 1.0);
}
`;

    // High quality FXAA Antialiasing Shader
    const fxaaFragmentShader = `
precision highp float;
uniform sampler2D inputTexture;
uniform vec2 resolution;
in vec2 vUv;
out vec4 fragColor;

#define FXAA_REDUCE_MIN   (1.0/128.0)
#define FXAA_REDUCE_MUL   (1.0/8.0)
#define FXAA_SPAN_MAX     8.0

void main() {
  vec2 inverseVP = 1.0 / resolution;
  vec3 rgbNW = texture(inputTexture, vUv + (vec2(-1.0, -1.0) * inverseVP)).rgb;
  vec3 rgbNE = texture(inputTexture, vUv + (vec2(1.0, -1.0) * inverseVP)).rgb;
  vec3 rgbSW = texture(inputTexture, vUv + (vec2(-1.0, 1.0) * inverseVP)).rgb;
  vec3 rgbSE = texture(inputTexture, vUv + (vec2(1.0, 1.0) * inverseVP)).rgb;
  vec3 rgbM  = texture(inputTexture, vUv).rgb;

  vec3 luma = vec3(0.299, 0.587, 0.114);
  float lumaNW = dot(rgbNW, luma);
  float lumaNE = dot(rgbNE, luma);
  float lumaSW = dot(rgbSW, luma);
  float lumaSE = dot(rgbSE, luma);
  float lumaM  = dot(rgbM,  luma);

  float lumaMin = min(lumaM, min(min(lumaNW, lumaNE), min(lumaSW, lumaSE)));
  float lumaMax = max(lumaM, max(max(lumaNW, lumaNE), max(lumaSW, lumaSE)));

  vec2 dir;
  dir.x = -((lumaNW + lumaNE) - (lumaSW + lumaSE));
  dir.y =  ((lumaNW + lumaSW) - (lumaNE + lumaSE));

  float dirReduce = max((lumaNW + lumaNE + lumaSW + lumaSE) * (0.25 * FXAA_REDUCE_MUL), FXAA_REDUCE_MIN);
  float rcpDirMin = 1.0 / (min(abs(dir.x), abs(dir.y)) + dirReduce);

  dir = min(vec2(FXAA_SPAN_MAX), max(vec2(-FXAA_SPAN_MAX), dir * rcpDirMin)) * inverseVP;

  vec3 rgbA = 0.5 * (
    texture(inputTexture, vUv + dir * (1.0/3.0 - 0.5)).rgb +
    texture(inputTexture, vUv + dir * (2.0/3.0 - 0.5)).rgb);
  vec3 rgbB = rgbA * 0.5 + 0.25 * (
    texture(inputTexture, vUv + dir * (0.0/3.0 - 0.5)).rgb +
    texture(inputTexture, vUv + dir * (3.0/3.0 - 0.5)).rgb);

  float lumaB = dot(rgbB, luma);

  if ((lumaB < lumaMin) || (lumaB > lumaMax)) {
    fragColor = vec4(rgbA, 1.0);
  } else {
    fragColor = vec4(rgbB, 1.0);
  }
}
`;

    function createFBO(w, h, options = {}) {
      return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
        wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
        wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
        minFilter: options.minFilter || THREE.LinearFilter,
        magFilter: options.magFilter || THREE.LinearFilter,
        format: options.format || THREE.RGBAFormat,
        type: options.type || THREE.HalfFloatType,
        stencilBuffer: options.stencilBuffer || false,
        depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : false,
        samples: options.samples || 0,
      });
    }

    class ShaderPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.shader.depthTest = false;
        this.shader.depthWrite = false;
        this.orthoScene = new THREE.Scene();
        this.fbo = createFBO(1, 1, options);
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
        this.texture = this.fbo.texture;
      }
      render(renderer, toScreen = false) {
        if (!toScreen) {
          renderer.setRenderTarget(this.fbo);
        }
        renderer.render(this.orthoScene, this.orthoCamera);
        if (!toScreen) {
          renderer.setRenderTarget(null);
        }
      }
      setSize(width, height) {
        this.fbo.setSize(Math.max(1, width), Math.max(1, height));
      }
    }

    class ShaderPingPongPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.shader.depthTest = false;
        this.shader.depthWrite = false;
        this.orthoScene = new THREE.Scene();
        this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
        this.currentFBO = 0;
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
      }
      render(renderer) {
        renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
        renderer.render(this.orthoScene, this.orthoCamera);
        renderer.setRenderTarget(null);
        this.currentFBO = 1 - this.currentFBO;
      }
      get current() { return this.fbos[this.currentFBO]; }
      get texture() { return this.current.texture; }
      setSize(width, height) {
        const w = Math.max(1, width);
        const h = Math.max(1, height);
        this.fbos[0].setSize(w, h);
        this.fbos[1].setSize(w, h);
      }
    }

    class BloomPass {
      constructor(strength = 0.8, radius = 0.5, threshold = 0.2, levels = 5) {
        this.strength = strength;
        this.radius = radius;
        this.threshold = threshold;
        this.enabled = true;
        this.levels = levels;

        this.brightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            bloomThreshold: { value: this.threshold },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: brightFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.brightPass = new ShaderPass(this.brightShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.blurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            direction: { value: new THREE.Vector2(0, 1) },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: blurFragmentShader,
          glslVersion: THREE.GLSL3,
        });

        this.blurPasses = [];
        for (let i = 0; i < this.levels; i++) {
          this.blurPasses.push(new ShaderPingPongPass(this.blurShader, {
            format: THREE.RGBAFormat,
            type: THREE.HalfFloatType,
          }));
        }
      }

      setSize(w, h) {
        let tw = Math.max(1, w);
        let th = Math.max(1, h);
        this.brightPass.setSize(tw, th);
        for (let i = 0; i < this.levels; i++) {
          tw = Math.max(1, Math.round(tw / 2));
          th = Math.max(1, Math.round(th / 2));
          this.blurPasses[i].setSize(tw, th);
        }
      }

      set source(texture) {
        this.brightShader.uniforms.inputTexture.value = texture;
      }

      render(renderer) {
        if (!this.enabled || this.strength <= 0.001) return;

        this.brightShader.uniforms.bloomThreshold.value = this.threshold;
        this.brightPass.render(renderer);

        const baseOffset = Math.max(0.1, this.radius * 2.0);
        const u = this.blurShader.uniforms;

        for (let j = 0; j < this.levels; j++) {
          const blurPass = this.blurPasses[j];
          const stepOffset = baseOffset * (1.0 + j * 0.5);

          u.direction.value.set(stepOffset, 0);
          u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
          blurPass.render(renderer);

          u.direction.value.set(0, stepOffset * 0.5);
          u.inputTexture.value = blurPass.current.texture;
          blurPass.render(renderer);
        }
      }
    }

    const VISION_MODE_MAP = {
      'Normal (Cinematic)': 0,
      'Night Vision (Phosphor)': 1,
      'Thermal (Ironbow)': 2,
      'Thermal (White-Hot)': 3,
    };

    const ANTIALIAS_MODES = [
      'None (Off)',
      'FXAA (Fast Approximate)',
      'MSAA 2x',
      'MSAA 4x (Standard)',
      'MSAA 8x (Ultra)',
      'MSAA 4x + FXAA (Hybrid)'
    ];

    class PostProcessor {
      constructor(renderer, params = {}) {
        this.renderer = renderer;

        this.settings = {
          enabled: params.enabled !== undefined ? params.enabled : true,
          antialiasMode: params.antialiasMode || 'MSAA 4x (Standard)',
          samples: 4,
          useFXAA: false,

          // 1. Bloom Engine
          bloomEnabled: params.bloomEnabled !== undefined ? params.bloomEnabled : true,
          bloomStrength: params.bloomStrength !== undefined ? params.bloomStrength : 1.15,
          bloomRadius: params.bloomRadius !== undefined ? params.bloomRadius : 0.55,
          bloomThreshold: params.bloomThreshold !== undefined ? params.bloomThreshold : 0.18,

          // 2. Godrays
          raysEnabled: params.raysEnabled !== undefined ? params.raysEnabled : true,
          raysStrength: params.raysStrength !== undefined ? params.raysStrength : 0.7,
          raysDensity: params.raysDensity !== undefined ? params.raysDensity : 1.0,
          raysMaxDensity: params.raysMaxDensity !== undefined ? params.raysMaxDensity : 0.5,
          raysDistanceAttenuation: params.raysDistanceAttenuation !== undefined ? params.raysDistanceAttenuation : 2.0,
          raysThreshold: params.raysThreshold !== undefined ? params.raysThreshold : 0.14,
          raysColor: params.raysColor ? (params.raysColor.isColor ? params.raysColor.clone() : new THREE.Color(params.raysColor)) : new THREE.Color(0xf6aa1c),
          raysColorHex: params.raysColorHex || '#f6aa1c',

          // 3. Anamorphic Flare (Default is OFF)
          anamorphicEnabled: params.anamorphicEnabled !== undefined ? params.anamorphicEnabled : false,
          anamorphicIntensity: params.anamorphicIntensity !== undefined ? params.anamorphicIntensity : 4.5,
          anamorphicThreshold: params.anamorphicThreshold !== undefined ? params.anamorphicThreshold : 0.35,
          anamorphicSamples: params.anamorphicSamples !== undefined ? params.anamorphicSamples : 64,
          anamorphicRadius: params.anamorphicRadius !== undefined ? params.anamorphicRadius : 0.0,
          anamorphicSmoothWidth: params.anamorphicSmoothWidth !== undefined ? params.anamorphicSmoothWidth : 0.05,
          anamorphicColor: params.anamorphicColor ? (params.anamorphicColor.isColor ? params.anamorphicColor.clone() : new THREE.Color(params.anamorphicColor)) : new THREE.Color(0xffbb44),
          anamorphicColorHex: params.anamorphicColorHex || '#ffbb44',

          // 4. Special Vision Modes
          visionMode: params.visionMode !== undefined ? params.visionMode : 'Normal (Cinematic)',
          thermalSensitivity: params.thermalSensitivity !== undefined ? params.thermalSensitivity : 1.4,
          nightVisionGain: params.nightVisionGain !== undefined ? params.nightVisionGain : 2.1,
          nightVisionNoise: params.nightVisionNoise !== undefined ? params.nightVisionNoise : 0.05,
          crtIntensity: params.crtIntensity !== undefined ? params.crtIntensity : 0.0,

          // 5. Lens Optics & Film Grain
          fisheyeStrength: params.fisheyeStrength !== undefined ? params.fisheyeStrength : 0.0,
          fisheyeRadius: params.fisheyeRadius !== undefined ? params.fisheyeRadius : 1.0,
          chromaticAberration: params.chromaticAberration !== undefined ? params.chromaticAberration : 0.015,
          vignetteBoost: params.vignetteBoost !== undefined ? params.vignetteBoost : 1.1,
          vignetteReduction: params.vignetteReduction !== undefined ? params.vignetteReduction : 0.55,
          noiseIntensity: params.noiseIntensity !== undefined ? params.noiseIntensity : 0.012,

          // 6. Color Grading & Levels
          gamma: params.gamma !== undefined ? params.gamma : 1.0,
          minInputLevel: params.minInputLevel !== undefined ? params.minInputLevel : 0.0,
          maxInputLevel: params.maxInputLevel !== undefined ? params.maxInputLevel : 1.0,
          exposure: params.exposure !== undefined ? params.exposure : 1.0,
        };

        const maxSamples = (this.renderer && this.renderer.capabilities) ? (this.renderer.capabilities.maxSamples || 8) : 8;
        this.sceneTarget = createFBO(1, 1, { type: THREE.HalfFloatType, samples: Math.min(4, maxSamples), depthBuffer: true });

        this.bloomPass = new BloomPass(
          this.settings.bloomStrength,
          this.settings.bloomRadius,
          this.settings.bloomThreshold,
          5
        );

        this.moonScreenPos = new THREE.Vector3(0.5, 0.7, 1.0);
        this.moonInFront = true;

        this.godRaysMaskShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            threshold: { value: this.settings.raysThreshold },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: godRaysDepthMaskShader,
          glslVersion: THREE.GLSL3,
        });
        this.godRaysMaskPass = new ShaderPass(this.godRaysMaskShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.godRaysGenShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            vSunPositionScreenSpace: { value: this.moonScreenPos },
            fStepSize: { value: 1.0 },
            distanceAttenuation: { value: this.settings.raysDistanceAttenuation },
            maxDensity: { value: this.settings.raysMaxDensity },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: godRaysGenerateShader,
          glslVersion: THREE.GLSL3,
        });
        this.godRaysPingPong = new ShaderPingPongPass(this.godRaysGenShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.anamorphicBrightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            threshold: { value: this.settings.anamorphicThreshold },
            smoothWidth: { value: this.settings.anamorphicSmoothWidth },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: anamorphicBrightShader,
          glslVersion: THREE.GLSL3,
        });
        this.anamorphicBrightPass = new ShaderPass(this.anamorphicBrightShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.anamorphicBlurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            resolution: { value: new THREE.Vector2(1, 1) },
            samples: { value: this.settings.anamorphicSamples },
            intensity: { value: this.settings.anamorphicIntensity },
            tintColor: { value: this.settings.anamorphicColor },
            bloomRadius: { value: this.settings.anamorphicRadius },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: anamorphicBlurShader,
          glslVersion: THREE.GLSL3,
        });
        this.anamorphicBlurPass = new ShaderPass(this.anamorphicBlurShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.finalShader = new THREE.RawShaderMaterial({
          uniforms: {
            resolution: { value: new THREE.Vector2(1, 1) },
            bloomEnabled: { value: this.settings.bloomEnabled },
            bloomStrength: { value: this.settings.bloomStrength },
            raysEnabled: { value: this.settings.raysEnabled },
            raysStrength: { value: this.settings.raysStrength },
            raysColor: { value: this.settings.raysColor },
            anamorphicEnabled: { value: this.settings.anamorphicEnabled },
            vignetteBoost: { value: this.settings.vignetteBoost },
            vignetteReduction: { value: this.settings.vignetteReduction },
            noiseIntensity: { value: this.settings.noiseIntensity },
            inputTexture: { value: null },
            blur0Texture: { value: null },
            blur1Texture: { value: null },
            blur2Texture: { value: null },
            blur3Texture: { value: null },
            blur4Texture: { value: null },
            raysTexture: { value: null },
            anamorphicTexture: { value: null },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: finalFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.finalPass = new ShaderPass(this.finalShader);

        this.rgbShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: this.finalPass.texture },
            fisheyeStrength: { value: this.settings.fisheyeStrength },
            fisheyeRadius: { value: this.settings.fisheyeRadius },
            chromaticAberrationAmount: { value: this.settings.chromaticAberration },
            minInputLevel: { value: this.settings.minInputLevel },
            maxInputLevel: { value: this.settings.maxInputLevel },
            gammaLevel: { value: this.settings.gamma },
            exposure: { value: this.settings.exposure },
            visionMode: { value: VISION_MODE_MAP[this.settings.visionMode] ?? 0 },
            thermalSensitivity: { value: this.settings.thermalSensitivity },
            nightVisionGain: { value: this.settings.nightVisionGain },
            nightVisionNoise: { value: this.settings.nightVisionNoise },
            crtIntensity: { value: this.settings.crtIntensity },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: colorFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.rgbPass = new ShaderPass(this.rgbShader);

        this.fxaaShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            resolution: { value: new THREE.Vector2(1, 1) },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: fxaaFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.fxaaPass = new ShaderPass(this.fxaaShader);

        this.copyShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: copyFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.copyPass = new ShaderPass(this.copyShader);

        this.setAntialiasMode(this.settings.antialiasMode);
      }

      setAntialiasMode(mode) {
        this.settings.antialiasMode = mode;
        let samples = 0;
        let useFXAA = false;
        const maxSamples = (this.renderer && this.renderer.capabilities) ? (this.renderer.capabilities.maxSamples || 8) : 8;

        if (mode === 'MSAA 2x') {
          samples = Math.min(2, maxSamples);
        } else if (mode === 'MSAA 4x (Standard)' || mode === 'MSAA 4x') {
          samples = Math.min(4, maxSamples);
        } else if (mode === 'MSAA 8x (Ultra)' || mode === 'MSAA 8x') {
          samples = Math.min(8, maxSamples);
        } else if (mode === 'FXAA (Fast Approximate)' || mode === 'FXAA') {
          samples = 0;
          useFXAA = true;
        } else if (mode === 'MSAA 4x + FXAA (Hybrid)') {
          samples = Math.min(4, maxSamples);
          useFXAA = true;
        } else {
          samples = 0;
          useFXAA = false;
        }

        this.settings.samples = samples;
        this.settings.useFXAA = useFXAA;

        if (this.sceneTarget.samples !== samples) {
          const oldTarget = this.sceneTarget;
          this.sceneTarget = createFBO(oldTarget.width, oldTarget.height, {
            type: THREE.HalfFloatType,
            samples: samples,
            depthBuffer: true,
          });
          oldTarget.dispose();
        }
      }

      updateSettings() {
        this.bloomPass.enabled = this.settings.bloomEnabled;
        this.bloomPass.strength = this.settings.bloomStrength;
        this.bloomPass.radius = this.settings.bloomRadius;
        this.bloomPass.threshold = this.settings.bloomThreshold;

        this.godRaysMaskShader.uniforms.threshold.value = this.settings.raysThreshold;
        this.godRaysGenShader.uniforms.distanceAttenuation.value = this.settings.raysDistanceAttenuation;
        this.godRaysGenShader.uniforms.maxDensity.value = this.settings.raysMaxDensity;

        this.anamorphicBrightShader.uniforms.threshold.value = this.settings.anamorphicThreshold;
        this.anamorphicBrightShader.uniforms.smoothWidth.value = this.settings.anamorphicSmoothWidth;
        this.anamorphicBlurShader.uniforms.samples.value = this.settings.anamorphicSamples;
        this.anamorphicBlurShader.uniforms.intensity.value = this.settings.anamorphicIntensity;
        this.anamorphicBlurShader.uniforms.tintColor.value.copy(this.settings.anamorphicColor);
        this.anamorphicBlurShader.uniforms.bloomRadius.value = this.settings.anamorphicRadius;

        this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
        this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
        this.finalShader.uniforms.raysEnabled.value = this.settings.raysEnabled && this.moonInFront;
        this.finalShader.uniforms.raysStrength.value = this.settings.raysStrength;
        this.finalShader.uniforms.raysColor.value.copy(this.settings.raysColor);
        this.finalShader.uniforms.anamorphicEnabled.value = this.settings.anamorphicEnabled;
        this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
        this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
        this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;

        this.rgbShader.uniforms.fisheyeStrength.value = this.settings.fisheyeStrength;
        this.rgbShader.uniforms.fisheyeRadius.value = this.settings.fisheyeRadius;
        this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
        this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
        this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
        this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
        this.rgbShader.uniforms.exposure.value = this.settings.exposure;
        this.rgbShader.uniforms.visionMode.value = VISION_MODE_MAP[this.settings.visionMode] ?? 0;
        this.rgbShader.uniforms.thermalSensitivity.value = this.settings.thermalSensitivity;
        this.rgbShader.uniforms.nightVisionGain.value = this.settings.nightVisionGain;
        this.rgbShader.uniforms.nightVisionNoise.value = this.settings.nightVisionNoise;
        this.rgbShader.uniforms.crtIntensity.value = this.settings.crtIntensity;
      }

      setSize(w0, h0, dpr = 1) {
        const w = Math.max(1, Math.floor(w0 * dpr));
        const h = Math.max(1, Math.floor(h0 * dpr));
        this.sceneTarget.setSize(w, h);
        this.finalPass.setSize(w, h);
        this.finalShader.uniforms.resolution.value.set(w, h);
        this.bloomPass.setSize(w, h);

        const grW = Math.max(1, Math.round(w / 2));
        const grH = Math.max(1, Math.round(h / 2));
        this.godRaysMaskPass.setSize(grW, grH);
        this.godRaysPingPong.setSize(grW, grH);

        const anW = Math.max(1, Math.round(w / 4));
        const anH = Math.max(1, Math.round(h / 4));
        this.anamorphicBrightPass.setSize(anW, anH);
        this.anamorphicBlurPass.setSize(anW, anH);
        this.anamorphicBlurShader.uniforms.resolution.value.set(anW, anH);

        this.rgbPass.setSize(w, h);
        this.fxaaPass.setSize(w, h);
        this.fxaaShader.uniforms.resolution.value.set(w, h);
        this.copyPass.setSize(w, h);
      }

      setMoonScreenPosition(camera, worldPos) {
        if (!this._camDir) {
          this._camDir = new THREE.Vector3();
          this._toTarget = new THREE.Vector3();
          this._ndc = new THREE.Vector3();
        }
        camera.getWorldDirection(this._camDir);
        this._toTarget.copy(worldPos).sub(camera.position).normalize();
        const dot = this._camDir.dot(this._toTarget);

        if (dot <= 0.02) {
          this.moonInFront = false;
          this.finalShader.uniforms.raysEnabled.value = false;
          return;
        }

        this.moonInFront = true;
        const fade = THREE.MathUtils.clamp((dot - 0.02) / 0.15, 0.0, 1.0);

        this._ndc.copy(worldPos).project(camera);
        const screenX = this._ndc.x * 0.5 + 0.5;
        const screenY = this._ndc.y * 0.5 + 0.5;
        const screenZ = fade;

        this.moonScreenPos.set(screenX, screenY, screenZ);
        this.godRaysGenShader.uniforms.vSunPositionScreenSpace.value.set(screenX, screenY, screenZ);
      }

      renderScene(scene, camera) {
        if (!this.settings.enabled) {
          this.renderer.setRenderTarget(this.sceneTarget);
          this.renderer.render(scene, camera);
          this.renderer.setRenderTarget(null);
          this.copyPass.shader.uniforms.inputTexture.value = this.sceneTarget.texture;
          this.copyPass.render(this.renderer, true);
          return;
        }
        this.renderer.setRenderTarget(this.sceneTarget);
        this.renderer.render(scene, camera);
        this.renderer.setRenderTarget(null);
        this.render(this.sceneTarget.texture);
      }

      render(sourceTexture) {
        if (!this.settings.enabled) {
          this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
          this.copyPass.render(this.renderer, true);
          return;
        }

        this.updateSettings();

        // 1. Bloom
        this.bloomPass.source = sourceTexture;
        this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
        this.bloomPass.render(this.renderer);

        this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
        this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
        this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
        this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
        this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

        // 2. Godrays
        if (this.settings.raysEnabled && this.settings.raysStrength > 0.001 && this.moonInFront) {
          this.godRaysMaskShader.uniforms.inputTexture.value = sourceTexture;
          this.godRaysMaskShader.uniforms.threshold.value = this.settings.raysThreshold;
          this.godRaysMaskPass.render(this.renderer);

          const filterLen = this.settings.raysDensity;
          const tapsPerPass = 6.0;

          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -1.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysMaskPass.texture;
          this.godRaysPingPong.render(this.renderer);

          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -2.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysPingPong.texture;
          this.godRaysPingPong.render(this.renderer);

          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -3.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysPingPong.texture;
          this.godRaysPingPong.render(this.renderer);

          this.finalPass.shader.uniforms.raysTexture.value = this.godRaysPingPong.texture;
          this.finalPass.shader.uniforms.raysEnabled.value = true;
        } else {
          this.finalPass.shader.uniforms.raysEnabled.value = false;
        }

        // 3. Anamorphic Flare
        if (this.settings.anamorphicEnabled && this.settings.anamorphicIntensity > 0.001) {
          this.anamorphicBrightShader.uniforms.inputTexture.value = sourceTexture;
          this.anamorphicBrightShader.uniforms.threshold.value = this.settings.anamorphicThreshold;
          this.anamorphicBrightShader.uniforms.smoothWidth.value = this.settings.anamorphicSmoothWidth;
          this.anamorphicBrightPass.render(this.renderer);

          this.anamorphicBlurShader.uniforms.inputTexture.value = this.anamorphicBrightPass.texture;
          this.anamorphicBlurShader.uniforms.samples.value = this.settings.anamorphicSamples;
          this.anamorphicBlurShader.uniforms.intensity.value = this.settings.anamorphicIntensity;
          this.anamorphicBlurShader.uniforms.tintColor.value.copy(this.settings.anamorphicColor);
          this.anamorphicBlurShader.uniforms.bloomRadius.value = this.settings.anamorphicRadius;
          this.anamorphicBlurPass.render(this.renderer);

          this.finalPass.shader.uniforms.anamorphicTexture.value = this.anamorphicBlurPass.texture;
          this.finalPass.shader.uniforms.anamorphicEnabled.value = true;
        } else {
          this.finalPass.shader.uniforms.anamorphicEnabled.value = false;
        }

        const randomTime = Math.random() * 100000;
        this.finalPass.shader.uniforms.time.value = randomTime;
        this.rgbPass.shader.uniforms.time.value = randomTime;

        this.finalPass.render(this.renderer);

        // If FXAA is active, render RGB pass to FBO, then FXAA pass to screen
        if (this.settings.useFXAA) {
          this.rgbPass.render(this.renderer, false);
          this.fxaaPass.shader.uniforms.inputTexture.value = this.rgbPass.texture;
          this.fxaaPass.render(this.renderer, true);
        } else {
          this.rgbPass.render(this.renderer, true);
        }
      }

      attachGUI(gui, title = "✨ Post-Processing Suite") {
        const root = gui.addFolder(title);
        root.add(this.settings, "enabled").name("Enable Post-Process");
        root.add(this.settings, "antialiasMode", ANTIALIAS_MODES).name("Antialiasing Mode").onChange((v) => this.setAntialiasMode(v));

        // 1. Vision Modes
        const vision = root.addFolder("Thermal & Night Vision");
        vision.add(this.settings, "visionMode", Object.keys(VISION_MODE_MAP)).name("Vision Mode").onChange(() => this.updateSettings());
        vision.add(this.settings, "nightVisionGain", 0.5, 5.0, 0.1).name("NVG Amplification").onChange(() => this.updateSettings());
        vision.add(this.settings, "nightVisionNoise", 0.0, 0.3, 0.01).name("NVG Sensor Noise").onChange(() => this.updateSettings());
        vision.add(this.settings, "thermalSensitivity", 0.5, 3.5, 0.05).name("Thermal Sensitivity").onChange(() => this.updateSettings());
        vision.add(this.settings, "crtIntensity", 0.0, 0.1, 0.005).name("CRT Scanlines").onChange(() => this.updateSettings());

        // 2. Godrays
        const rays = root.addFolder("Three.js Godrays");
        rays.add(this.settings, "raysEnabled").name("Enable Godrays").onChange(() => this.updateSettings());
        rays.add(this.settings, "raysStrength", 0, 3.0, 0.05).name("Intensity").onChange(() => this.updateSettings());
        rays.add(this.settings, "raysDensity", 0.1, 2.5, 0.05).name("Density (Spread)").onChange(() => this.updateSettings());

    // --- Bokeh Particles (Clusters in Deep Background) ---
    function createBokehTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      const cx = 64, cy = 64, r = 58;

      const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
      grad.addColorStop(0.0, 'rgba(255, 255, 255, 0.45)');
      grad.addColorStop(0.7, 'rgba(255, 255, 255, 0.6)');
      grad.addColorStop(0.88, 'rgba(255, 255, 255, 0.95)');
      grad.addColorStop(0.96, 'rgba(255, 255, 255, 1.0)');
      grad.addColorStop(1.0, 'rgba(255, 255, 255, 0.0)');

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fill();

      const texture = new THREE.CanvasTexture(canvas);
      texture.generateMipmaps = true;
      return texture;
    }

    // --- Procedural 3D Marigold Geometry ---
    function createMarigoldGeometry() {
      const positions = [];
      const normals = [];
      const uvs = [];
      const colors = [];
      const indices = [];

      const baseCol = new THREE.Color(0.85, 0.35, 0.05);
      const tipCol = new THREE.Color(1.0, 0.85, 0.2);

      const rings = [
        { count: 14, r: 0.44, z: -0.06, tilt: -0.22, length: 0.22, width: 0.12, curve: 0.06 },
        { count: 12, r: 0.36, z: 0.03, tilt: 0.15, length: 0.20, width: 0.11, curve: 0.08 },
        { count: 10, r: 0.27, z: 0.11, tilt: 0.35, length: 0.18, width: 0.09, curve: 0.07 },
        { count: 8,  r: 0.18, z: 0.17, tilt: 0.55, length: 0.15, width: 0.08, curve: 0.06 },
        { count: 6,  r: 0.09, z: 0.21, tilt: 0.75, length: 0.12, width: 0.06, curve: 0.04 }
      ];

      let vertOffset = 0;

      rings.forEach((ring, ringIdx) => {
        for (let i = 0; i < ring.count; i++) {
          const angle = (i / ring.count) * Math.PI * 2 + (ringIdx * 0.38);
          const cosA = Math.cos(angle);
          const sinA = Math.sin(angle);

          const dirX = cosA;
          const dirY = sinA;
          const perpX = -sinA;
          const perpY = cosA;

          const rootX = dirX * ring.r;
          const rootY = dirY * ring.r;
          const rootZ = ring.z;

          const tipDist = ring.r + ring.length;
          const tipX = dirX * tipDist;
          const tipY = dirY * tipDist;
          const tipZ = ring.z + Math.sin(ring.tilt) * ring.length;

          const midDist = ring.r + ring.length * 0.55;
          const midX = dirX * midDist;
          const midY = dirY * midDist;
          const midZ = ring.z + Math.sin(ring.tilt * 0.7) * ring.length * 0.55 + ring.curve;

          const halfW = ring.width * 0.5;

          positions.push(rootX, rootY, rootZ);
          normals.push(dirX * 0.2, dirY * 0.2, 0.95);
          uvs.push(0.5, 0.0);
          colors.push(baseCol.r, baseCol.g, baseCol.b);

          positions.push(midX + perpX * halfW, midY + perpY * halfW, midZ);
          normals.push(dirX * 0.4 + perpX * 0.3, dirY * 0.4 + perpY * 0.3, 0.85);
          uvs.push(0.0, 0.5);
          const midCol = baseCol.clone().lerp(tipCol, 0.55);
          colors.push(midCol.r, midCol.g, midCol.b);

          positions.push(midX - perpX * halfW, midY - perpY * halfW, midZ);
          normals.push(dirX * 0.4 - perpX * 0.3, dirY * 0.4 - perpY * 0.3, 0.85);
          uvs.push(1.0, 0.5);
          colors.push(midCol.r, midCol.g, midCol.b);

          positions.push(tipX, tipY, tipZ);
          normals.push(dirX * 0.6, dirY * 0.6, 0.55);
          uvs.push(0.5, 1.0);
          colors.push(tipCol.r, tipCol.g, tipCol.b);

          indices.push(vertOffset, vertOffset + 1, vertOffset + 3);
          indices.push(vertOffset, vertOffset + 3, vertOffset + 2);

          vertOffset += 4;
        }
      });

      const centerVertStart = vertOffset;
      positions.push(0, 0, 0.24);
      normals.push(0, 0, 1);
      uvs.push(0.5, 0.5);
      colors.push(baseCol.r * 0.8, baseCol.g * 0.8, baseCol.b * 0.8);
      vertOffset++;

      const coreCount = 10;
      for (let c = 0; c < coreCount; c++) {
        const a = (c / coreCount) * Math.PI * 2;
        positions.push(Math.cos(a) * 0.07, Math.sin(a) * 0.07, 0.22);
        normals.push(Math.cos(a) * 0.4, Math.sin(a) * 0.4, 0.85);
        uvs.push(0.5 + Math.cos(a) * 0.2, 0.5 + Math.sin(a) * 0.2);
        colors.push(tipCol.r * 0.9, tipCol.g * 0.9, tipCol.b * 0.5);
        vertOffset++;

        const nextC = (c + 1) % coreCount;
        indices.push(centerVertStart, centerVertStart + 1 + c, centerVertStart + 1 + nextC);
      }

      const geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geom.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
      geom.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geom.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      geom.setIndex(indices);
      geom.computeVertexNormals();

      return geom;
    }

    function createLeafGeometry() {
      const geom = new THREE.BufferGeometry();
      const positions = [
        0, 0, 0,
        0.09, 0.16, 0.03,
        -0.09, 0.16, 0.03,
        0, 0.38, 0.01
      ];
      const normals = [
        0, 0, 1,
        0.2, 0.2, 0.9,
        -0.2, 0.2, 0.9,
        0, 0.4, 0.9
      ];
      const indices = [0, 1, 3, 0, 3, 2];
      geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geom.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
      geom.setIndex(indices);
      geom.computeVertexNormals();
      return geom;
    }

    function createPetalGeometry() {
      const geom = new THREE.BufferGeometry();
      const positions = [
        0, 0, 0,
        0.08, 0.13, 0.03,
        -0.08, 0.13, 0.03,
        0, 0.28, 0.02
      ];
      const indices = [0, 1, 3, 0, 3, 2];
      geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geom.setIndex(indices);
      geom.computeVertexNormals();
      return geom;
    }

    // --- Catenary Swags & Garlands Layout ---
    const swagCurves = [
      new THREE.CatmullRomCurve3([
        new THREE.Vector3(-9.8, 5.0, 0.4),
        new THREE.Vector3(-6.5, 3.4, 1.0),
        new THREE.Vector3(-3.2, 2.0, 1.3),
        new THREE.Vector3(0.0, 3.0, 0.9),
        new THREE.Vector3(2.4, 4.6, 0.6)
      ]),
      new THREE.CatmullRomCurve3([
        new THREE.Vector3(-2.2, 4.7, 0.6),
        new THREE.Vector3(0.5, 3.1, 0.9),
        new THREE.Vector3(3.8, 1.9, 1.4),
        new THREE.Vector3(6.8, 3.3, 1.1),
        new THREE.Vector3(10.0, 5.0, 0.4)
      ]),
      new THREE.CatmullRomCurve3([
        new THREE.Vector3(-11.0, 5.8, -1.5),
        new THREE.Vector3(-5.5, 4.1, -1.1),
        new THREE.Vector3(0.0, 3.2, -0.9),
        new THREE.Vector3(5.5, 4.1, -1.1),
        new THREE.Vector3(11.0, 5.8, -1.5)
      ]),
      new THREE.CatmullRomCurve3([
        new THREE.Vector3(-8.5, 6.4, -0.2),
        new THREE.Vector3(-4.0, 5.2, 0.0),
        new THREE.Vector3(0.0, 4.6, 0.2),
        new THREE.Vector3(4.0, 5.2, 0.0),
        new THREE.Vector3(8.5, 6.4, -0.2)
      ]),
      new THREE.CatmullRomCurve3([
        new THREE.Vector3(-7.5, 4.6, 0.5),
        new THREE.Vector3(-7.5, 3.4, 0.6),
        new THREE.Vector3(-7.5, 2.3, 0.6)
      ]),
      new THREE.CatmullRomCurve3([
        new THREE.Vector3(-2.2, 4.5, 0.6),
        new THREE.Vector3(-2.2, 3.2, 0.7),
        new THREE.Vector3(-2.2, 2.0, 0.7)
      ]),
      new THREE.CatmullRomCurve3([
        new THREE.Vector3(2.2, 4.5, 0.6),
        new THREE.Vector3(2.2, 3.2, 0.7),
        new THREE.Vector3(2.2, 2.0, 0.7)
      ]),
      new THREE.CatmullRomCurve3([
        new THREE.Vector3(7.5, 4.6, 0.5),
        new THREE.Vector3(7.5, 3.4, 0.6),
        new THREE.Vector3(7.5, 2.3, 0.6)
      ])
    ];

    // --- Build Flowers and Leaves Instances ---
    const flowerGeom = createMarigoldGeometry();
    const leafGeom = createLeafGeometry();

    const flowerMaterial = new THREE.MeshStandardMaterial({
      roughness: 0.5,
      metalness: 0.05,
      vertexColors: true
    });

    const leavesMaterial = new THREE.MeshStandardMaterial({
      color: new THREE.Color(params.leavesColor),
      roughness: 0.65,
      metalness: 0.1,
      side: THREE.DoubleSide
    });

    const flowersData = [];
    const leavesData = [];

    swagCurves.forEach((curve, swagIdx) => {
      const isDrop = swagIdx >= 4;
      const steps = isDrop ? 12 : (swagIdx === 2 ? 38 : 32);
      const flowersPerRing = isDrop ? 2 : 3;

      for (let i = 0; i <= steps; i++) {
        const s = i / steps;
        const pt = curve.getPointAt(s);
        const tangent = curve.getTangentAt(s);

        const up = new THREE.Vector3(0, 1, 0);
        const normal = new THREE.Vector3().crossVectors(tangent, up).normalize();
        if (normal.lengthSq() < 0.001) normal.set(1, 0, 0);
        const binormal = new THREE.Vector3().crossVectors(tangent, normal).normalize();

        for (let r = 0; r < flowersPerRing; r++) {
          const angle = (r / flowersPerRing) * Math.PI * 2 + (i * 0.85);
          const rad = isDrop ? 0.32 : 0.42;

          const offset = new THREE.Vector3()
            .addScaledVector(normal, Math.cos(angle) * rad)
            .addScaledVector(binormal, Math.sin(angle) * rad);

          const pos = pt.clone().add(offset);
          const lookDir = offset.clone().normalize();
          const flowerQuat = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 0, 1), lookDir);

          pos.x += (Math.random() - 0.5) * 0.1;
          pos.y += (Math.random() - 0.5) * 0.1;
          pos.z += (Math.random() - 0.5) * 0.1;

          const scale = (Math.random() * 0.22 + 0.88) * (isDrop ? 0.85 : 1.0);
          const colType = Math.random() < 0.55 ? 1 : (Math.random() < 0.75 ? 2 : 3);

          flowersData.push({
            basePos: pos.clone(),
            baseQuat: flowerQuat.clone(),
            scale: scale,
            swagIdx: swagIdx,
            paramS: s,
            colType: colType
          });

          if (Math.random() < 0.35) {
            const leafAngle = angle + (Math.random() - 0.5) * 0.5;
            const leafOffset = new THREE.Vector3()
              .addScaledVector(normal, Math.cos(leafAngle) * (rad + 0.18))
              .addScaledVector(binormal, Math.sin(leafAngle) * (rad + 0.18));
            const leafPos = pt.clone().add(leafOffset);
            const leafDir = leafOffset.clone().normalize();
            const leafQuat = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), leafDir);

            leavesData.push({
              basePos: leafPos.clone(),
              baseQuat: leafQuat.clone(),
              scale: Math.random() * 0.3 + 0.85,
              swagIdx: swagIdx,
              paramS: s
            });
          }
        }
      }
    });

    const flowerMesh = new THREE.InstancedMesh(flowerGeom, flowerMaterial, flowersData.length);
    scene.add(flowerMesh);

    const leafMesh = new THREE.InstancedMesh(leafGeom, leavesMaterial, leavesData.length);
    scene.add(leafMesh);

    const dummy = new THREE.Object3D();
    flowersData.forEach((f, idx) => {
      dummy.position.copy(f.basePos);
      dummy.quaternion.copy(f.baseQuat);
      dummy.scale.setScalar(f.scale);
      dummy.updateMatrix();
      flowerMesh.setMatrixAt(idx, dummy.matrix);
    });
    flowerMesh.instanceMatrix.needsUpdate = true;

    leavesData.forEach((l, idx) => {
      dummy.position.copy(l.basePos);
      dummy.quaternion.copy(l.baseQuat);
      dummy.scale.setScalar(l.scale);
      dummy.updateMatrix();
      leafMesh.setMatrixAt(idx, dummy.matrix);
    });
    leafMesh.instanceMatrix.needsUpdate = true;

    // --- Intertwined Golden Threads & Fairy Lights ---
    const threadMaterial = new THREE.MeshStandardMaterial({
      color: new THREE.Color(params.threadColor),
      metalness: 0.92,
      roughness: 0.22
    });

    const fairyGeom = new THREE.SphereGeometry(0.048, 8, 8);
    const fairyMaterial = new THREE.MeshStandardMaterial({
      color: new THREE.Color(0xffffff),
      emissive: new THREE.Color(params.fairyColor),
      emissiveIntensity: params.fairyIntensity,
      roughness: 0.2,
      metalness: 0.1
    });

    const fairyLightsData = [];
    const threadObjects = [];

    swagCurves.slice(0, 4).forEach((curve, swagIdx) => {
      const coils = swagIdx === 2 ? 42 : 36;
      const numPts = coils * 6;
      const spiralPts = [];
      const sValues = [];

      for (let i = 0; i <= numPts; i++) {
        const s = i / numPts;
        const pt = curve.getPointAt(s);
        const tangent = curve.getTangentAt(s);

        const up = new THREE.Vector3(0, 1, 0);
        const normal = new THREE.Vector3().crossVectors(tangent, up).normalize();
        if (normal.lengthSq() < 0.001) normal.set(1, 0, 0);
        const binormal = new THREE.Vector3().crossVectors(tangent, normal).normalize();

        const angle = s * coils * Math.PI * 2;
        const rad = 0.44;

        const offset = new THREE.Vector3()
          .addScaledVector(normal, Math.cos(angle) * rad)
          .addScaledVector(binormal, Math.sin(angle) * rad);

        const spiralPt = pt.clone().add(offset);
        spiralPts.push(spiralPt);
        sValues.push(s);

        if (i % 5 === 0) {
          fairyLightsData.push({
            basePos: spiralPt.clone(),
            swagIdx: swagIdx,
            paramS: s,
            flickerPhase: Math.random() * Math.PI * 2,
            flickerSpeed: Math.random() * 1.5 + 0.8
          });
        }
      }

      const spiralCurve = new THREE.CatmullRomCurve3(spiralPts);
      const tubeGeom = new THREE.TubeGeometry(spiralCurve, numPts, 0.024, 5, false);

      const posAttr = tubeGeom.attributes.position;
      const basePositions = new Float32Array(posAttr.array);
      const vertS = new Float32Array(posAttr.count);

      for (let v = 0; v < posAttr.count; v++) {
        const ratio = v / (posAttr.count - 1);
        vertS[v] = ratio;
      }

      tubeGeom.userData = {
        basePositions: basePositions,
        vertS: vertS,
        swagIdx: swagIdx
      };

      const tubeMesh = new THREE.Mesh(tubeGeom, threadMaterial);
      scene.add(tubeMesh);
      threadObjects.push(tubeMesh);
    });

    const fairyMesh = new THREE.InstancedMesh(fairyGeom, fairyMaterial, fairyLightsData.length);
    scene.add(fairyMesh);

    fairyLightsData.forEach((fl, idx) => {
      dummy.position.copy(fl.basePos);
      dummy.scale.setScalar(1.0);
      dummy.updateMatrix();
      fairyMesh.setMatrixAt(idx, dummy.matrix);
    });
    fairyMesh.instanceMatrix.needsUpdate = true;

    // --- Falling Marigold Petals System ---
    const petalCount = 110;
    const petalGeom = createPetalGeometry();
    const petalMaterial = new THREE.MeshStandardMaterial({
      color: new THREE.Color(params.flowerColor1),
      roughness: 0.55,
      metalness: 0.05,
      side: THREE.DoubleSide
    });

    const petalMesh = new THREE.InstancedMesh(petalGeom, petalMaterial, petalCount);
    scene.add(petalMesh);

    const petalData = [];
    for (let i = 0; i < petalCount; i++) {
      petalData.push({
        x: (Math.random() - 0.5) * 19.0,
        y: Math.random() * 11.0 - 5.0,
        z: (Math.random() - 0.5) * 6.5,
        speed: Math.random() * 0.022 + 0.012,
        rotX: Math.random() * Math.PI * 2,
        rotY: Math.random() * Math.PI * 2,
        rotZ: Math.random() * Math.PI * 2,
        rotSpeedX: (Math.random() - 0.5) * 1.5,
        rotSpeedY: (Math.random() - 0.5) * 1.2,
        rotSpeedZ: (Math.random() - 0.5) * 1.8,
        phase: Math.random() * Math.PI * 2,
        scale: Math.random() * 0.4 + 0.8
      });
    }

    // --- Color Application & Smooth Transitions ---
    function updateColors(schemeName, animate = true) {
      const scheme = colorSchemes[schemeName];
      if (!scheme) return;

      params.colorScheme = schemeName;
      params.flowerColor1 = scheme.flowerPrimary;
      params.flowerColor2 = scheme.flowerSecondary;
      params.flowerColor3 = scheme.flowerTertiary;
      params.leavesColor = scheme.leaves;
      params.threadColor = scheme.goldThread;
      params.fairyColor = scheme.fairyLight;
      params.diyaColor = scheme.diyaLight;
      params.rimColor = scheme.rimLight;
      params.ambientColor = scheme.ambientLight;
      params.bokehColor = scheme.bokeh;
      params.bgColor = scheme.background;
      document.body.style.backgroundColor = params.bgColor;

      if (!params.greenScreen) {
        if (animate && window.gsap) {
          gsap.to(scene.background, {
            r: new THREE.Color(params.bgColor).r,
            g: new THREE.Color(params.bgColor).g,
            b: new THREE.Color(params.bgColor).b,
            duration: 1.0
          });
          gsap.to(scene.fog.color, {
            r: new THREE.Color(params.bgColor).r,
            g: new THREE.Color(params.bgColor).g,
            b: new THREE.Color(params.bgColor).b,
            duration: 1.0
          });
        } else {
          scene.background.set(params.bgColor);
          scene.fog.color.set(params.bgColor);
        }
        renderer.setClearColor(params.bgColor, 1.0);
      }

      if (animate && window.gsap) {
        gsap.to(ambientLight.color, { ...new THREE.Color(params.ambientColor), duration: 0.9 });
        gsap.to(diyaMainLight.color, { ...new THREE.Color(params.diyaColor), duration: 0.9 });
        gsap.to(diyaLeftLight.color, { ...new THREE.Color(params.diyaColor), duration: 0.9 });
        gsap.to(diyaRightLight.color, { ...new THREE.Color(params.diyaColor), duration: 0.9 });
        gsap.to(rimLight.color, { ...new THREE.Color(params.rimColor), duration: 0.9 });
        gsap.to(threadMaterial.color, { ...new THREE.Color(params.threadColor), duration: 0.9 });
        gsap.to(leavesMaterial.color, { ...new THREE.Color(params.leavesColor), duration: 0.9 });
        gsap.to(fairyMaterial.emissive, { ...new THREE.Color(scheme.fairyLight), duration: 0.9 });
        gsap.to(bokehMaterial.color, { ...new THREE.Color(params.bokehColor), duration: 0.9 });
        gsap.to(petalMaterial.color, { ...new THREE.Color(params.flowerColor1), duration: 0.9 });
      } else {
        ambientLight.color.set(params.ambientColor);
        diyaMainLight.color.set(params.diyaColor);
        diyaLeftLight.color.set(params.diyaColor);
        diyaRightLight.color.set(params.diyaColor);
        rimLight.color.set(params.rimColor);
        threadMaterial.color.set(params.threadColor);
        leavesMaterial.color.set(params.leavesColor);
        fairyMaterial.emissive.set(scheme.fairyLight);
        bokehMaterial.color.set(params.bokehColor);
        petalMaterial.color.set(params.flowerColor1);
      }

      const c1 = new THREE.Color(params.flowerColor1);
      const c2 = new THREE.Color(params.flowerColor2);
      const c3 = new THREE.Color(params.flowerColor3);

      flowersData.forEach((f, idx) => {
        let col = f.colType === 1 ? c1 : (f.colType === 2 ? c2 : c3);
        const variedCol = col.clone();
        const hsl = {};
        variedCol.getHSL(hsl);
        variedCol.setHSL(hsl.h + (Math.random() - 0.5) * 0.04, hsl.s, hsl.l + (Math.random() - 0.5) * 0.06);
        flowerMesh.setColorAt(idx, variedCol);
      });
      flowerMesh.instanceColor.needsUpdate = true;
    }
    updateColors('Original', false);

    // --- Background Color & Green Screen Support ---
    function updateBackgroundColor(c) {
      params.bgColor = c;
      document.body.style.backgroundColor = c;
      if (!params.greenScreen) {
        scene.background.set(c);
        renderer.setClearColor(c, 1.0);
        if (scene.fog) scene.fog.color.set(c);
      }
    }

    function updateGreenScreen() {
      if (params.greenScreen) {
        document.body.style.backgroundColor = '#00ff00';
        scene.background = new THREE.Color(0x00ff00);
        renderer.setClearColor(0x00ff00, 1.0);
        scene.fog.density = 0.0;
        bokehPoints.visible = false;
      } else {
        document.body.style.backgroundColor = params.bgColor;
        scene.background = new THREE.Color(params.bgColor);
        renderer.setClearColor(params.bgColor, 1.0);
        scene.fog.density = 0.024;
        scene.fog.color.set(params.bgColor);
        bokehPoints.visible = true;
      }
    }

    // --- Antialiasing & Renderer Recreation ---
    function recreateRenderer() {
      const width = window.innerWidth;
      const height = window.innerHeight;

      renderer.dispose();
      if (renderer.domElement && renderer.domElement.parentElement) {
        renderer.domElement.parentElement.removeChild(renderer.domElement);
      }

      renderer = new THREE.WebGLRenderer({
        antialias: params.antialias,
        powerPreference: 'high-performance'
      });
      renderer.setSize(width, height);
      renderer.setPixelRatio(params.dpr);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = params.exposure;

      container.appendChild(renderer.domElement);

      controls.dispose();
      setupOrbitControls();
      updateGreenScreen();

      if (postProcessor) {
        postProcessor.renderer = renderer;
        postProcessor.setSize(width, height, params.dpr);
      }
    }

    // --- Procedural Randomization on Scene Click ---
    // (NOTE: Does NOT shuffle or change any Postprocessing settings)
    function randomizeScene() {
      const schemeKeys = Object.keys(colorSchemes);
      const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];

      params.animSpeed = THREE.MathUtils.randFloat(0.7, 1.45);
      params.windSway = THREE.MathUtils.randFloat(0.65, 1.8);
      params.petalFallSpeed = THREE.MathUtils.randFloat(0.7, 1.6);
      params.exposure = THREE.MathUtils.randFloat(0.9, 1.35);
      params.diyaIntensity = THREE.MathUtils.randFloat(2.8, 5.5);
      params.fairyIntensity = THREE.MathUtils.randFloat(1.8, 4.2);

      const animKeys = cameraAnimations;
      params.cameraAnimation = animKeys[Math.floor(Math.random() * animKeys.length)];

      updateColors(randomScheme, true);
      renderer.toneMappingExposure = params.exposure;

      // Notice: postProcessor.settings is strictly NOT touched or randomized!
      // All bloom, anamorphic, chromatic aberration, and antialias settings stay as set by user.

      if (gui) {
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      }
    }

    // Intentional click detection (distinguishing drag from click)
    let pointerDownPos = { x: 0, y: 0 };
    let pointerDownTime = 0;

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.lil-gui')) return;
      pointerDownPos = { x: e.clientX, y: e.clientY };
      pointerDownTime = performance.now();
    });

    window.addEventListener('pointerup', (e) => {
      if (e.target.closest('.lil-gui')) return;
      const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
      const time = performance.now() - pointerDownTime;

      if (dist < 6 && time < 350) {
        if (params.randomizeOnClick) {
          randomizeScene();
        }
      }
    });

    // --- lil-gui Setup (Original Unmodified Styles) ---
    const gui = new GUI({ title: 'Marigold & Lights' });

    // 1. Color Schemes & Themes
    const folderColor = gui.addFolder('🎨 Color & Theme');
    folderColor.add(params, 'colorScheme', Object.keys(colorSchemes)).name('Color Scheme').onChange(val => {
      updateColors(val, true);
      if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
    });
    folderColor.add(params, 'greenScreen').name('Green Screen (#00ff00)').onChange(updateGreenScreen);
    folderColor.addColor(params, 'bgColor').name('Background Color').onChange(c => updateBackgroundColor(c));
    folderColor.addColor(params, 'flowerColor1').name('Flower Primary').onChange(() => updateColors(params.colorScheme, false));
    folderColor.addColor(params, 'flowerColor2').name('Flower Secondary').onChange(() => updateColors(params.colorScheme, false));
    folderColor.addColor(params, 'flowerColor3').name('Flower Accent').onChange(() => updateColors(params.colorScheme, false));
    folderColor.addColor(params, 'leavesColor').name('Foliage Color').onChange(c => leavesMaterial.color.set(c));
    folderColor.addColor(params, 'threadColor').name('Gold Thread Color').onChange(c => threadMaterial.color.set(c));
    folderColor.addColor(params, 'bokehColor').name('Bokeh Color').onChange(c => bokehMaterial.color.set(c));

    // 2. Animation & Camera
    const folderAnim = gui.addFolder('🎬 Animation & Camera');
    folderAnim.add(params, 'cameraAnimation', cameraAnimations).name('Animation Mode');
    folderAnim.add(params, 'animSpeed', 0.1, 3.0, 0.05).name('Animation Speed');
    folderAnim.add(params, 'windSway', 0.0, 2.5, 0.05).name('Wind Sway');
    folderAnim.add(params, 'petalFallSpeed', 0.1, 3.0, 0.05).name('Petal Fall Speed');
    folderAnim.add(params, 'randomizeOnClick').name('Randomize on Click');

    // 3. Lighting & Exposure
    const folderLight = gui.addFolder('💡 Lighting & Exposure');
    folderLight.add(params, 'exposure', 0.2, 3.0, 0.05).name('Exposure').onChange(v => renderer.toneMappingExposure = v);
    folderLight.add(params, 'diyaIntensity', 0.0, 10.0, 0.1).name('Diya Uplight Intensity');
    folderLight.addColor(params, 'diyaColor').name('Diya Uplight Color').onChange(c => {
      diyaMainLight.color.set(c);
      diyaLeftLight.color.set(c);
      diyaRightLight.color.set(c);
    });
    folderLight.add(params, 'fairyIntensity', 0.0, 8.0, 0.1).name('Fairy Lights Intensity').onChange(v => fairyMaterial.emissiveIntensity = v);
    folderLight.addColor(params, 'fairyColor').name('Fairy Lights Color').onChange(c => fairyMaterial.emissive.set(c));
    folderLight.add(params, 'ambientIntensity', 0.0, 3.0, 0.05).name('Ambient Light Intensity').onChange(v => ambientLight.intensity = v);
    folderLight.addColor(params, 'ambientColor').name('Ambient Light Color').onChange(c => ambientLight.color.set(c));
    folderLight.add(params, 'rimIntensity', 0.0, 8.0, 0.1).name('Rim Light Intensity').onChange(v => rimLight.intensity = v);
    folderLight.addColor(params, 'rimColor').name('Rim Light Color').onChange(c => rimLight.color.set(c));
    folderLight.add(params, 'bokehBrightness', 0.0, 3.0, 0.1).name('Bokeh Brightness').onChange(v => bokehMaterial.opacity = 0.55 * v);

    // 4. Attach Full PostProcessor Suite
    postProcessor.attachGUI(gui, '✨ Post-Processing Suite');

    // 5. Rendering & Quality
    const folderRender = gui.addFolder('⚙️ Rendering & Quality');
    folderRender.add(params, 'antialiasMode', ANTIALIAS_MODES).name('Antialiasing Mode').onChange(v => {
      postProcessor.setAntialiasMode(v);
      if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
    });
    folderRender.add(params, 'antialias').name('Hardware Antialias').onChange(recreateRenderer);
    folderRender.add(params, 'dpr', 0.5, 3.0, 0.25).name('Pixel Ratio (DPR)').onChange(v => {
      renderer.setPixelRatio(v);
      postProcessor.setSize(window.innerWidth, window.innerHeight, v);
    });

    // Hide/Show GUI with 'H' key
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        if (gui && gui.domElement) {
          gui.domElement.style.display = gui.domElement.style.display === 'none' ? '' : 'none';
        }
      }
    });

    // Resize Handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);
    });

    // --- Animation Loop ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const dt = clock.getDelta();
      const time = clock.getElapsedTime() * params.animSpeed;

      // 1. Camera Animation (preserving user zoom and orbit angle)
      const mode = params.cameraAnimation;
      const speed = params.animSpeed;

      if (mode !== 'Static (No Camera Move)') {
        const offset = new THREE.Vector3().subVectors(camera.position, controls.target);
        const currentDist = offset.length();

        if (mode === 'Temple Breeze Orbit') {
          const dTheta = 0.065 * dt * speed;
          offset.applyAxisAngle(new THREE.Vector3(0, 1, 0), dTheta);
          offset.setLength(currentDist);
          camera.position.copy(controls.target).add(offset);
        } else if (mode === 'Dusk Bokeh Orbit') {
          const dTheta = Math.cos(time * 0.45) * 0.05 * dt * speed;
          offset.applyAxisAngle(new THREE.Vector3(0, 1, 0), dTheta);
          offset.setLength(currentDist);
          camera.position.copy(controls.target).add(offset);
        } else if (mode === 'Gentle Sway & Breathe') {
          const swayX = Math.cos(time * 0.5) * 0.22 * dt;
          const swayY = Math.sin(time * 0.7) * 0.16 * dt;
          controls.target.x += swayX;
          controls.target.y += swayY;
          camera.position.x += swayX;
          camera.position.y += swayY;
        } else if (mode === 'Slow Cinematic Glide') {
          const glideX = Math.sin(time * 0.35) * 0.38 * dt;
          controls.target.x += glideX;
          camera.position.x += glideX;
        } else if (mode === 'Diya Glow Pulse') {
          const driftY = Math.sin(time * 0.8) * 0.2 * dt;
          controls.target.y += driftY;
          camera.position.y += driftY;
        } else if (mode === 'Petal Cascade Focus') {
          const descendY = -Math.cos(time * 0.45) * 0.3 * dt;
          controls.target.y += descendY;
          camera.position.y += descendY;
        } else if (mode === 'Golden Hour Shimmer') {
          const figX = Math.cos(time * 0.4) * 0.25 * dt;
          const figY = Math.sin(time * 0.8) * 0.18 * dt;
          controls.target.x += figX;
          controls.target.y += figY;
          camera.position.x += figX;
          camera.position.y += figY;
        }
      }

      controls.update();

      // 2. Diya Uplights Flicker
      const flameFlicker = 1.0 + 0.12 * Math.sin(time * 8.7) * Math.cos(time * 13.3) + 0.05 * Math.sin(time * 21.1);
      diyaMainLight.intensity = params.diyaIntensity * flameFlicker;
      diyaLeftLight.intensity = params.diyaIntensity * 0.7 * (1.0 + 0.1 * Math.sin(time * 11.2));
      diyaRightLight.intensity = params.diyaIntensity * 0.7 * (1.0 + 0.1 * Math.cos(time * 9.8));

      // 3. Wind Sway Animation on Garlands (Flowers & Leaves)
      const swayAmp = params.windSway;

      flowersData.forEach((f, idx) => {
        const isDrop = f.swagIdx >= 4;
        const sag = isDrop ? f.paramS : Math.sin(Math.PI * f.paramS);

        const swayX = Math.sin(time * 1.15 + f.swagIdx * 1.2) * 0.24 * sag * swayAmp;
        const swayY = -Math.pow(Math.sin(time * 1.15 + f.swagIdx * 1.2), 2) * 0.1 * sag * swayAmp;
        const swayZ = Math.cos(time * 0.85 + f.swagIdx * 1.4) * 0.32 * sag * swayAmp;
        const ripple = Math.sin(time * 2.6 - f.paramS * 6.5 + f.swagIdx) * 0.04 * sag * swayAmp;

        dummy.position.set(f.basePos.x + swayX + ripple * 0.4, f.basePos.y + swayY, f.basePos.z + swayZ + ripple);
        dummy.quaternion.copy(f.baseQuat);
        dummy.rotation.x += swayZ * 0.25;
        dummy.rotation.y += swayX * 0.3;
        dummy.rotation.z += ripple * 0.4;
        dummy.scale.setScalar(f.scale);
        dummy.updateMatrix();
        flowerMesh.setMatrixAt(idx, dummy.matrix);
      });
      flowerMesh.instanceMatrix.needsUpdate = true;

      leavesData.forEach((l, idx) => {
        const isDrop = l.swagIdx >= 4;
        const sag = isDrop ? l.paramS : Math.sin(Math.PI * l.paramS);

        const swayX = Math.sin(time * 1.15 + l.swagIdx * 1.2) * 0.24 * sag * swayAmp;
        const swayY = -Math.pow(Math.sin(time * 1.15 + l.swagIdx * 1.2), 2) * 0.1 * sag * swayAmp;
        const swayZ = Math.cos(time * 0.85 + l.swagIdx * 1.4) * 0.32 * sag * swayAmp;

        dummy.position.set(l.basePos.x + swayX, l.basePos.y + swayY, l.basePos.z + swayZ);
        dummy.quaternion.copy(l.baseQuat);
        dummy.scale.setScalar(l.scale);
        dummy.updateMatrix();
        leafMesh.setMatrixAt(idx, dummy.matrix);
      });
      leafMesh.instanceMatrix.needsUpdate = true;

      // 4. Sway Golden Spiral Threads
      threadObjects.forEach(thread => {
        const geom = thread.geometry;
        const posAttr = geom.attributes.position;
        const baseArr = geom.userData.basePositions;
        const vertS = geom.userData.vertS;
        const sIdx = geom.userData.swagIdx;

        for (let v = 0; v < posAttr.count; v++) {
          const s = vertS[v];
          const sag = Math.sin(Math.PI * s);

          const swayX = Math.sin(time * 1.15 + sIdx * 1.2) * 0.24 * sag * swayAmp;
          const swayY = -Math.pow(Math.sin(time * 1.15 + sIdx * 1.2), 2) * 0.1 * sag * swayAmp;
          const swayZ = Math.cos(time * 0.85 + sIdx * 1.4) * 0.32 * sag * swayAmp;

          posAttr.setXYZ(v, baseArr[v * 3] + swayX, baseArr[v * 3 + 1] + swayY, baseArr[v * 3 + 2] + swayZ);
        }
        posAttr.needsUpdate = true;
      });

      // 5. Fairy Lights Sway & Twinkle
      fairyLightsData.forEach((fl, idx) => {
        const sag = Math.sin(Math.PI * fl.paramS);
        const swayX = Math.sin(time * 1.15 + fl.swagIdx * 1.2) * 0.24 * sag * swayAmp;
        const swayY = -Math.pow(Math.sin(time * 1.15 + fl.swagIdx * 1.2), 2) * 0.1 * sag * swayAmp;
        const swayZ = Math.cos(time * 0.85 + fl.swagIdx * 1.4) * 0.32 * sag * swayAmp;

        dummy.position.set(fl.basePos.x + swayX, fl.basePos.y + swayY, fl.basePos.z + swayZ);

        const twinkle = 0.75 + 0.35 * Math.sin(time * 3.8 * fl.flickerSpeed + fl.flickerPhase) * Math.cos(time * 2.2 + fl.flickerPhase);
        dummy.scale.setScalar(twinkle);
        dummy.updateMatrix();
        fairyMesh.setMatrixAt(idx, dummy.matrix);
      });
      fairyMesh.instanceMatrix.needsUpdate = true;

      // Update Point Lights along garlands
      for (let i = 0; i < garlandPointLights.length; i++) {
        const pl = garlandPointLights[i];
        const tOffset = i * 1.5;
        pl.position.set(
          Math.sin(time * 0.4 + tOffset) * 5.0,
          3.2 + Math.cos(time * 0.6 + tOffset) * 0.8,
          0.8 + Math.sin(time * 0.5 + tOffset) * 0.5
        );
        pl.intensity = 1.0 + 0.4 * Math.sin(time * 5.0 + tOffset);
      }

      // 6. Bokeh Particles Drift
      if (bokehPoints.visible) {
        const bPos = bokehGeometry.attributes.position;
        for (let i = 0; i < bokehCount; i++) {
          const bp = bokehBasePos[i];
          const bx = bp.x + Math.sin(time * 0.35 * bp.speed + bp.phase) * 0.35;
          const by = bp.y + Math.cos(time * 0.45 * bp.speed + bp.phase) * 0.25;
          bPos.setXYZ(i, bx, by, bp.z);
        }
        bPos.needsUpdate = true;
      }

      // 7. Falling Petals Motion
      const fallSpeed = params.petalFallSpeed * params.animSpeed;
      for (let i = 0; i < petalCount; i++) {
        const p = petalData[i];

        p.y -= p.speed * fallSpeed * dt * 60;
        p.rotX += p.rotSpeedX * dt * params.animSpeed;
        p.rotY += p.rotSpeedY * dt * params.animSpeed;
        p.rotZ += p.rotSpeedZ * dt * params.animSpeed;
        p.x += Math.sin(time * 1.4 + p.phase) * 0.015 + (params.windSway * 0.004);

        if (p.y < -6.8) {
          p.y = 5.2 + Math.random() * 2.8;
          p.x = (Math.random() - 0.5) * 19.0;
          p.z = (Math.random() - 0.5) * 6.5;
        }

        dummy.position.set(p.x, p.y, p.z);
        dummy.rotation.set(
          p.rotX + Math.sin(time * 2.2 + p.phase) * 0.3,
          p.rotY,
          p.rotZ + Math.cos(time * 1.8 + p.phase) * 0.3
        );
        dummy.scale.setScalar(p.scale);
        dummy.updateMatrix();
        petalMesh.setMatrixAt(i, dummy.matrix);
      }
      petalMesh.instanceMatrix.needsUpdate = true;

      // Render through PostProcessor Suite
      postProcessor.setMoonScreenPosition(camera, new THREE.Vector3(0, 3.2, 0.5));
      postProcessor.renderScene(scene, camera);
    }

    animate();
  </script>
</body>
