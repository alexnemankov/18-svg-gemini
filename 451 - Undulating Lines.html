      'Cyber Neon (#E0FBFF)': {

    // ==========================================
    // 8 PRECONFIGURED CAMERA ANIMATIONS
    // ==========================================
    const ANIMATION_PRESETS = [
      'Static (No Motion)',
      'Slow Gentle Orbit',
      'Slow Figure-8',
      'Breathing Dolly & Tilt',
      'Spherical Spiral',
      'Horizontal Drift',
      'Gentle Elevation Wave',
      'Cinematic Arc Pan'
    ];

    // ==========================================
    // PARAMETERS OBJECT FOR lil-gui
    // ==========================================
    const params = {
      // Color & Theme
      colorScheme: 'Original',
      greenScreen: false,
      bgColor: '#ffffff',
      primaryColor: '#000000',
      secondaryColor: '#181818',
      accentColor: '#333333',

      // Camera & Motion
      animation: 'Slow Gentle Orbit',
      speed: 1.0,
      clusterRotationSpeed: 1.0,
      waveFrequency: 0.1,
      waveAmplitude: 2.2,
      dragMode: 'Orbit (Left Click)',

      // Lighting & Exposure
      exposure: 1.0,
      masterLightIntensity: 1.0,

      ambientEnabled: true,
      ambientColor: '#ffffff',
      ambientIntensity: 0.5,

      dirEnabled: true,
      dirColor: '#ffffff',
      dirIntensity: 0.6,
      dirPosX: 200,
      dirPosY: 300,
      dirPosZ: 200,

      pointEnabled: true,
      pointColor: '#ffffff',
      pointIntensity: 0.8,
      pointDist: 600,
      pointPosX: 0,
      pointPosY: 100,
      pointPosZ: 150,

      // Display & Geometry
      dpr: Math.min(window.devicePixelRatio || 1, 2),
      antialias: true,
      pointSize: 3.0,
      sizeAttenuation: false,

      // Procedural Variation
      clickToRandomize: true
    };

    // ==========================================
    // PROCEDURAL DOT TEXTURE GENERATOR
    // ==========================================
    function createDotTexture() {
      const c = document.createElement('canvas');
      c.width = 64;
      c.height = 64;
      const ctx = c.getContext('2d');

      const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
      grad.addColorStop(0.0, 'rgba(255, 255, 255, 1.0)');
      grad.addColorStop(0.35, 'rgba(255, 255, 255, 0.95)');
      grad.addColorStop(0.7, 'rgba(255, 255, 255, 0.35)');
      grad.addColorStop(1.0, 'rgba(255, 255, 255, 0.0)');

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(32, 32, 32, 0, Math.PI * 2);
      ctx.fill();

      const texture = new THREE.CanvasTexture(c);
      texture.generateMipmaps = true;
      return texture;
    }

    // ==========================================
    // SCENE INITIALIZATION
    // ==========================================
    let ww = window.innerWidth;
    let wh = window.innerHeight;

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(45, ww / wh, 0.1, 3000);
    camera.position.set(0, 0, 200);

    let renderer = new THREE.WebGLRenderer({
      canvas: document.querySelector('canvas'),
      antialias: params.antialias,
      alpha: true,
      powerPreference: 'high-performance'
    });
    renderer.setSize(ww, wh);
    renderer.setPixelRatio(params.dpr);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = params.exposure;

    // Controls
    let controls;
    function initControls(domEl) {
      controls = new OrbitControls(camera, domEl);
      controls.enableDamping = false;
      controls.screenSpacePanning = true;
      controls.enablePan = true;
      controls.panSpeed = 1.0;
      controls.enableZoom = true;
      controls.zoomSpeed = 1.0;
      controls.enableRotate = true;
      controls.rotateSpeed = 1.0;
      updateDragMode();
    }
    initControls(renderer.domElement);

    function updateDragMode() {
      if (params.dragMode === 'Pan / Move (Left Click)') {
        controls.mouseButtons = {
          LEFT: THREE.MOUSE.PAN,
          MIDDLE: THREE.MOUSE.DOLLY,
          RIGHT: THREE.MOUSE.ROTATE
        };
      } else {
        controls.mouseButtons = {
          LEFT: THREE.MOUSE.ROTATE,
          MIDDLE: THREE.MOUSE.DOLLY,
          RIGHT: THREE.MOUSE.PAN
        };
      }
    }

    // Lights
    const ambientLight = new THREE.AmbientLight(params.ambientColor, params.ambientIntensity);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(params.dirColor, params.dirIntensity);
    dirLight.position.set(params.dirPosX, params.dirPosY, params.dirPosZ);
    scene.add(dirLight);

    const pointLight = new THREE.PointLight(params.pointColor, params.pointIntensity, params.pointDist);
    pointLight.position.set(params.pointPosX, params.pointPosY, params.pointPosZ);
    scene.add(pointLight);

    // Objects
    const container = new THREE.Object3D();
    scene.add(container);

    const objectLines = new THREE.Object3D();
    scene.add(objectLines);

    // Points Material with Dynamic Custom Lighting Hook
    const fallbackTexture = createDotTexture();
    const mat = new THREE.PointsMaterial({
      color: 0xffffff,
      map: fallbackTexture,
      size: params.pointSize,
      sizeAttenuation: params.sizeAttenuation,
      transparent: true,
      alphaTest: 0.1,
      depthWrite: false,
      blending: THREE.NormalBlending,
      vertexColors: true
    });

    // Attempt to load external texture with automatic fallback to high-res procedural dot
    try {
      const loader = new THREE.TextureLoader();
      loader.crossOrigin = 'Anonymous';
      loader.load(
        'https://s3-us-west-2.amazonaws.com/s.cdpn.io/127738/dotTexture.png',
        (tex) => {
          mat.map = tex;
          mat.needsUpdate = true;
        },
        undefined,
        () => {
          // Gracefully retain high-res canvas texture
        }
      );
    } catch (e) {}

    // Lighting Shader Injection on PointsMaterial
    mat.onBeforeCompile = (shader) => {
      shader.uniforms.uAmbientColor = { value: new THREE.Color(params.ambientColor) };
      shader.uniforms.uAmbientIntensity = { value: params.ambientIntensity };
      shader.uniforms.uAmbientEnabled = { value: params.ambientEnabled ? 1.0 : 0.0 };

      shader.uniforms.uDirColor = { value: new THREE.Color(params.dirColor) };
      shader.uniforms.uDirIntensity = { value: params.dirIntensity };
      shader.uniforms.uDirPos = { value: new THREE.Vector3(params.dirPosX, params.dirPosY, params.dirPosZ) };
      shader.uniforms.uDirEnabled = { value: params.dirEnabled ? 1.0 : 0.0 };

      shader.uniforms.uPointColor = { value: new THREE.Color(params.pointColor) };
      shader.uniforms.uPointIntensity = { value: params.pointIntensity };
      shader.uniforms.uPointPos = { value: new THREE.Vector3(params.pointPosX, params.pointPosY, params.pointPosZ) };
      shader.uniforms.uPointDist = { value: params.pointDist };
      shader.uniforms.uPointEnabled = { value: params.pointEnabled ? 1.0 : 0.0 };

      shader.uniforms.uMasterIntensity = { value: params.masterLightIntensity };

      shader.vertexShader = shader.vertexShader.replace(
        '#include <common>',
        `#include <common>
         varying vec3 vWorldPos;
        `
      );
      shader.vertexShader = shader.vertexShader.replace(
        '#include <begin_vertex>',
        `#include <begin_vertex>
         vWorldPos = (modelMatrix * vec4(transformed, 1.0)).xyz;
        `
      );

      shader.fragmentShader = shader.fragmentShader.replace(
        '#include <common>',
        `#include <common>
         varying vec3 vWorldPos;
         uniform vec3 uAmbientColor;
         uniform float uAmbientIntensity;
         uniform float uAmbientEnabled;
         uniform vec3 uDirColor;
         uniform float uDirIntensity;
         uniform vec3 uDirPos;
         uniform float uDirEnabled;
         uniform vec3 uPointColor;
         uniform float uPointIntensity;
         uniform vec3 uPointPos;
         uniform float uPointDist;
         uniform float uPointEnabled;
         uniform float uMasterIntensity;
        `
      );

      shader.fragmentShader = shader.fragmentShader.replace(
        '#include <premultiplied_alpha_fragment>',
        `#include <premultiplied_alpha_fragment>
         vec3 lightAccum = vec3(0.0);
         if (uAmbientEnabled > 0.5) {
           lightAccum += uAmbientColor * uAmbientIntensity;
         }
         if (uDirEnabled > 0.5) {
           vec3 lDir = normalize(uDirPos);
           vec2 coord = gl_PointCoord * 2.0 - 1.0;
           float r2 = dot(coord, coord);
           vec3 normal = vec3(coord, sqrt(max(0.0, 1.0 - r2)));
           float diff = max(dot(normal, lDir), 0.2);
           lightAccum += uDirColor * (uDirIntensity * diff);
         }
         if (uPointEnabled > 0.5) {
           vec3 pVec = uPointPos - vWorldPos;
           float pDist = length(pVec);
           float atten = clamp(1.0 - (pDist / uPointDist), 0.0, 1.0);
           lightAccum += uPointColor * (uPointIntensity * atten * atten);
         }
         gl_FragColor.rgb *= lightAccum * uMasterIntensity;
        `
      );

      mat.userData.shader = shader;
    };

    function syncShaderLights() {
      const s = mat.userData.shader;
      if (!s) return;
      s.uniforms.uAmbientColor.value.set(params.ambientColor);
      s.uniforms.uAmbientIntensity.value = params.ambientIntensity;
      s.uniforms.uAmbientEnabled.value = params.ambientEnabled ? 1.0 : 0.0;

      s.uniforms.uDirColor.value.set(params.dirColor);
      s.uniforms.uDirIntensity.value = params.dirIntensity;
      s.uniforms.uDirPos.value.set(params.dirPosX, params.dirPosY, params.dirPosZ);
      s.uniforms.uDirEnabled.value = params.dirEnabled ? 1.0 : 0.0;

      s.uniforms.uPointColor.value.set(params.pointColor);
      s.uniforms.uPointIntensity.value = params.pointIntensity;
      s.uniforms.uPointPos.value.set(params.pointPosX, params.pointPosY, params.pointPosZ);
      s.uniforms.uPointDist.value = params.pointDist;
      s.uniforms.uPointEnabled.value = params.pointEnabled ? 1.0 : 0.0;

      s.uniforms.uMasterIntensity.value = params.masterLightIntensity;
    }

    // ==========================================
    // PROCEDURAL WAVE LINES GEOMETRY
    // ==========================================
    const lines = [];
    const amountLines = 500;

    function Line() {
      this.length = Math.floor(Math.random() * 100 + 250);
      this.speed = Math.random() * 400 + 200;
      this.phase = Math.random() * Math.PI * 2;

      const positions = new Float32Array(this.length * 3);
      const colors = new Float32Array(this.length * 3);

      const halfLen = this.length * 0.5;
      for (let i = 0; i < this.length; i++) {
        positions[i * 3 + 0] = (i - halfLen) * 0.4;
        positions[i * 3 + 1] = 0;
        positions[i * 3 + 2] = 0;

        colors[i * 3 + 0] = 0;
        colors[i * 3 + 1] = 0;
        colors[i * 3 + 2] = 0;
      }

      this.geometry = new THREE.BufferGeometry();
      this.geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      this.geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      this.mesh = new THREE.Points(this.geometry, mat);
      this.mesh.rotation.x = Math.random() * Math.PI;
      this.mesh.rotation.y = Math.random() * Math.PI;
      this.mesh.rotation.z = Math.random() * Math.PI;
    }

    Line.prototype.update = function (a, amp, freq) {
      const pos = this.geometry.attributes.position.array;
      const count = this.length;
      const s = this.speed;
      const f = freq || 0.1;
      const amplitude = amp !== undefined ? amp : 2.2;

      for (let i = 0; i < count; i++) {
        pos[i * 3 + 1] = Math.sin(a / s + i * f) * amplitude;
      }
      this.geometry.attributes.position.needsUpdate = true;
    };

    Line.prototype.updateColors = function (c1, c2, c3) {
      const colAttr = this.geometry.attributes.color;
      const arr = colAttr.array;
      const count = this.length;
      const tempCol = new THREE.Color();

      for (let i = 0; i < count; i++) {
        const t = i / (count - 1);
        if (t < 0.5) {
          tempCol.copy(c1).lerp(c2, t * 2.0);
        } else {
          tempCol.copy(c2).lerp(c3, (t - 0.5) * 2.0);
        }
        arr[i * 3 + 0] = tempCol.r;
        arr[i * 3 + 1] = tempCol.g;
        arr[i * 3 + 2] = tempCol.b;
      }
      colAttr.needsUpdate = true;
    };

    function updateAllLineColors() {
      const c1 = new THREE.Color(params.primaryColor);
      const c2 = new THREE.Color(params.secondaryColor);
      const c3 = new THREE.Color(params.accentColor);

      for (let i = 0; i < amountLines; i++) {
        lines[i].updateColors(c1, c2, c3);
      }
    }

    function updateBackground() {
      if (params.greenScreen) {
        renderer.setClearColor(0x00ff00, 1.0);
        scene.background = new THREE.Color(0x00ff00);
        document.body.style.backgroundColor = '#00ff00';
      } else {
        renderer.setClearColor(params.bgColor, 1.0);
        scene.background = new THREE.Color(params.bgColor);
        document.body.style.backgroundColor = params.bgColor;
      }
    }

    function applyColorScheme(schemeName) {
      const scheme = COLOR_SCHEMES[schemeName] || COLOR_SCHEMES['Original'];
      params.colorScheme = scheme.name;
      params.bgColor = scheme.bg;
      params.primaryColor = scheme.primary;
      params.secondaryColor = scheme.secondary;
      params.accentColor = scheme.accent;

      updateBackground();
      updateAllLineColors();
      syncGuiControllers();
    }

    // ==========================================
    // ANTIALIAS SWITCHER
    // ==========================================
    function setAntialias(enabled) {
      params.antialias = enabled;
      const oldCanvas = renderer.domElement;
      const newCanvas = document.createElement('canvas');
      oldCanvas.parentNode.replaceChild(newCanvas, oldCanvas);

      renderer.dispose();

      renderer = new THREE.WebGLRenderer({
        canvas: newCanvas,
        antialias: enabled,
        alpha: true,
        powerPreference: 'high-performance'
      });

      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(params.dpr);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = params.exposure;

      updateBackground();

      controls.dispose();
      initControls(newCanvas);
      setupCanvasEvents(newCanvas);
    }

    // ==========================================
    // CAMERA ANIMATION & PRESERVATION LOGIC
    // ==========================================
    let isInteracting = false;
    let animTime = 0;

    function updateCameraAnimation(dt) {
      if (params.animation === 'Static (No Motion)') {
        controls.update();
        return;
      }

      // If user is actively dragging the camera with pointer,
      // allow direct unhindered user control
      if (isInteracting) {
        controls.update();
        return;
      }

      animTime += dt * params.speed;

      // Extract current spherical coordinates relative to target
      // This preserves user-set zoom distance and custom dragged angles!
      const offset = new THREE.Vector3().subVectors(camera.position, controls.target);
      const spherical = new THREE.Spherical().setFromVector3(offset);

      switch (params.animation) {
        case 'Slow Gentle Orbit':
          spherical.theta += 0.2 * dt;
          break;

        case 'Slow Figure-8':
          spherical.theta += Math.cos(animTime * 0.5) * 0.35 * dt;
          spherical.phi += Math.sin(animTime * 1.0) * 0.22 * dt;
          break;

        case 'Breathing Dolly & Tilt':
          // Subtle rhythmic expansion/contraction around the user's chosen zoom
          spherical.radius *= (1.0 + Math.sin(animTime * 0.8) * 0.001);
          spherical.phi += Math.sin(animTime * 0.5) * 0.15 * dt;
          break;

        case 'Spherical Spiral':
          spherical.theta += 0.22 * dt;
          spherical.phi += Math.sin(animTime * 0.35) * 0.25 * dt;
          break;

        case 'Horizontal Drift':
          spherical.theta += Math.sin(animTime * 0.6) * 0.3 * dt;
          break;

        case 'Gentle Elevation Wave':
          spherical.phi += Math.sin(animTime * 0.7) * 0.28 * dt;
          break;

        case 'Cinematic Arc Pan':
          spherical.theta += 0.14 * dt;
          spherical.phi += Math.cos(animTime * 0.25) * 0.15 * dt;
          break;
      }

      // Safe clamp for phi to prevent camera flipping at poles
      spherical.phi = THREE.MathUtils.clamp(spherical.phi, 0.08, Math.PI - 0.08);

      offset.setFromSpherical(spherical);
      camera.position.copy(controls.target).add(offset);
      controls.update();
    }

    // ==========================================
    // PROCEDURAL RANDOMIZER
    // ==========================================
    function randomizeScene() {
      // 1. Randomize color scheme
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const randomKey = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      params.colorScheme = randomKey;
      const s = COLOR_SCHEMES[randomKey];
      params.bgColor = s.bg;
      params.primaryColor = s.primary;
      params.secondaryColor = s.secondary;
      params.accentColor = s.accent;
      updateBackground();
      updateAllLineColors();

      // 2. Randomize geometric parameters
      params.waveAmplitude = +(Math.random() * 3.5 + 1.2).toFixed(2);
      params.waveFrequency = +(Math.random() * 0.14 + 0.05).toFixed(3);
      params.pointSize = +(Math.random() * 3.5 + 1.5).toFixed(1);
      mat.size = params.pointSize;
      mat.needsUpdate = true;

      params.clusterRotationSpeed = +(Math.random() * 2.2 - 1.1).toFixed(2);
      if (Math.abs(params.clusterRotationSpeed) < 0.2) params.clusterRotationSpeed = 0.6;

      // 3. Randomize motion parameters
      params.speed = +(Math.random() * 1.5 + 0.5).toFixed(2);
      params.animation = ANIMATION_PRESETS[Math.floor(Math.random() * ANIMATION_PRESETS.length)];

      // 4. Randomize lighting & exposure
      params.exposure = +(Math.random() * 0.7 + 0.75).toFixed(2);
      renderer.toneMappingExposure = params.exposure;

      params.masterLightIntensity = +(Math.random() * 0.6 + 0.8).toFixed(2);
      params.dirIntensity = +(Math.random() * 0.8 + 0.5).toFixed(2);
      dirLight.intensity = params.dirIntensity;
      params.pointIntensity = +(Math.random() * 1.0 + 0.6).toFixed(2);
      pointLight.intensity = params.pointIntensity;

      syncShaderLights();
      syncGuiControllers();
    }

    // ==========================================
    // POINTER & CLICK HANDLING
    // ==========================================
    let pointerDownPos = { x: 0, y: 0, time: 0 };

    function setupCanvasEvents(canvasEl) {
      canvasEl.addEventListener('pointerdown', (e) => {
        if (e.target.closest('.lil-gui')) return;
        pointerDownPos.x = e.clientX;
        pointerDownPos.y = e.clientY;
        pointerDownPos.time = performance.now();
        isInteracting = true;
      });

      window.addEventListener('pointerup', (e) => {
        isInteracting = false;
        if (e.target.closest && e.target.closest('.lil-gui')) return;

        const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
        const elapsed = performance.now() - pointerDownPos.time;

        // If pointer barely moved and click was fast, trigger scene re-roll
        if (dist < 6 && elapsed < 350 && params.clickToRandomize) {
          randomizeScene();
        }
      });
    }
    setupCanvasEvents(renderer.domElement);

    // ==========================================
    // lil-gui CONFIGURATION
    // ==========================================
    const gui = new GUI({ title: 'Scene Controls' });

    function syncGuiControllers() {
      if (typeof gui.controllersRecursive === 'function') {
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      } else {
        const updateRecursive = (g) => {
          if (g.controllers) g.controllers.forEach(c => c.updateDisplay());
          if (g.folders) g.folders.forEach(f => updateRecursive(f));
        };
        updateRecursive(gui);
      }
    }

    // Theme & Color Folder
    const fTheme = gui.addFolder('Color & Scheme');
    fTheme.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Palette Scheme').onChange(v => applyColorScheme(v));
    fTheme.add(params, 'greenScreen').name('Green Screen (#00ff00)').onChange(() => updateBackground());
    fTheme.addColor(params, 'bgColor').name('Background Color').onChange(() => updateBackground());
    fTheme.addColor(params, 'primaryColor').name('Primary Color').onChange(() => updateAllLineColors());
    fTheme.addColor(params, 'secondaryColor').name('Secondary Color').onChange(() => updateAllLineColors());
    fTheme.addColor(params, 'accentColor').name('Accent Color').onChange(() => updateAllLineColors());

    // Animation & Motion Folder
    const fAnim = gui.addFolder('Animation & Motion');
    fAnim.add(params, 'animation', ANIMATION_PRESETS).name('Camera Motion');
    fAnim.add(params, 'speed', 0, 4.0, 0.05).name('Animation Speed');
    fAnim.add(params, 'clusterRotationSpeed', -3.0, 3.0, 0.05).name('Cluster Spin');
    fAnim.add(params, 'waveFrequency', 0.02, 0.3, 0.005).name('Wave Frequency');
    fAnim.add(params, 'waveAmplitude', 0.5, 6.0, 0.1).name('Wave Amplitude');

    // Camera & Interaction Folder
    const fCam = gui.addFolder('Camera & Interaction');
    fCam.add(params, 'dragMode', ['Orbit (Left Click)', 'Pan / Move (Left Click)']).name('Drag Mode').onChange(() => updateDragMode());
    fCam.add({ reset: () => {
      controls.target.set(0, 0, 0);
      camera.position.set(0, 0, 200);
      camera.lookAt(0, 0, 0);
    }}, 'reset').name('Reset Camera View');

    // Lighting & Exposure Folder
    const fLight = gui.addFolder('Lighting & Exposure');
    fLight.add(params, 'exposure', 0.1, 3.0, 0.05).name('Tone Exposure').onChange(v => {
      renderer.toneMappingExposure = v;
    });
    fLight.add(params, 'masterLightIntensity', 0, 3.0, 0.05).name('Master Light Mult').onChange(() => syncShaderLights());

    const fAmb = fLight.addFolder('Ambient Light');
    fAmb.add(params, 'ambientEnabled').name('Enabled').onChange(v => {
      ambientLight.visible = v;
      syncShaderLights();
    });
    fAmb.addColor(params, 'ambientColor').name('Color').onChange(v => {
      ambientLight.color.set(v);
      syncShaderLights();
    });
    fAmb.add(params, 'ambientIntensity', 0, 3.0, 0.05).name('Intensity').onChange(v => {
      ambientLight.intensity = v;
      syncShaderLights();
    });

    const fDir = fLight.addFolder('Directional Light');
    fDir.add(params, 'dirEnabled').name('Enabled').onChange(v => {
      dirLight.visible = v;
      syncShaderLights();
    });
    fDir.addColor(params, 'dirColor').name('Color').onChange(v => {
      dirLight.color.set(v);
      syncShaderLights();
    });
    fDir.add(params, 'dirIntensity', 0, 3.0, 0.05).name('Intensity').onChange(v => {
      dirLight.intensity = v;
      syncShaderLights();
    });
    fDir.add(params, 'dirPosX', -500, 500, 10).name('Pos X').onChange(v => { dirLight.position.x = v; syncShaderLights(); });
    fDir.add(params, 'dirPosY', -500, 500, 10).name('Pos Y').onChange(v => { dirLight.position.y = v; syncShaderLights(); });
    fDir.add(params, 'dirPosZ', -500, 500, 10).name('Pos Z').onChange(v => { dirLight.position.z = v; syncShaderLights(); });

    const fPoint = fLight.addFolder('Point Light');
    fPoint.add(params, 'pointEnabled').name('Enabled').onChange(v => {
      pointLight.visible = v;
      syncShaderLights();
    });
    fPoint.addColor(params, 'pointColor').name('Color').onChange(v => {
      pointLight.color.set(v);
      syncShaderLights();
    });
    fPoint.add(params, 'pointIntensity', 0, 5.0, 0.1).name('Intensity').onChange(v => {
      pointLight.intensity = v;
      syncShaderLights();
    });
    fPoint.add(params, 'pointDist', 100, 1500, 50).name('Distance').onChange(v => {
      pointLight.distance = v;
      syncShaderLights();
    });
    fPoint.add(params, 'pointPosX', -400, 400, 10).name('Pos X').onChange(v => { pointLight.position.x = v; syncShaderLights(); });
    fPoint.add(params, 'pointPosY', -400, 400, 10).name('Pos Y').onChange(v => { pointLight.position.y = v; syncShaderLights(); });
    fPoint.add(params, 'pointPosZ', -400, 400, 10).name('Pos Z').onChange(v => { pointLight.position.z = v; syncShaderLights(); });

    // Display & Quality Folder
    const fDisp = gui.addFolder('Display & Geometry');
    fDisp.add(params, 'dpr', 0.5, 3.0, 0.1).name('Pixel Ratio (DPR)').onChange(v => {
      renderer.setPixelRatio(v);
    });
    fDisp.add(params, 'antialias').name('Antialiasing').onChange(v => setAntialias(v));
    fDisp.add(params, 'pointSize', 1.0, 10.0, 0.2).name('Point Size').onChange(v => {
      mat.size = v;
      mat.needsUpdate = true;
    });
    fDisp.add(params, 'sizeAttenuation').name('Size Attenuation').onChange(v => {
      mat.sizeAttenuation = v;
      mat.needsUpdate = true;
    });

    // Procedural Re-roll Folder
    const fProc = gui.addFolder('Procedural Variation');
    fProc.add(params, 'clickToRandomize').name('Click to Randomize');
    fProc.add({ randomize: randomizeScene }, 'randomize').name('Randomize Now');

    // Keyboard Shortcut 'H' to Hide/Show UI
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        if (e.target && e.target.tagName === 'INPUT') return;
        if (typeof gui.show === 'function' && typeof gui.hide === 'function') {
          if (gui._hidden) {
            gui.show();
          } else {
            gui.hide();
          }
        } else {
          gui.domElement.style.display = gui.domElement.style.display === 'none' ? '' : 'none';
        }
      }
    });

    // ==========================================
    // MAIN INITIALIZATION & RENDER LOOP
    // ==========================================
    function init() {
      for (let i = 0; i < amountLines; i++) {
        const line = new Line();
        lines.push(line);
        objectLines.add(line.mesh);
      }

      applyColorScheme('Original');
      updateBackground();

      window.addEventListener('resize', onResize);
      requestAnimationFrame(render);
    }

    let lastTime = performance.now();
    let accumulatedTime = 0;

    function render(now) {
      requestAnimationFrame(render);

      const dt = Math.min((now - lastTime) / 1000, 0.1);
      const dtMs = now - lastTime;
      lastTime = now;

      accumulatedTime += dtMs * params.speed;

      // Rotate cluster in 3D space
      objectLines.rotation.y += params.clusterRotationSpeed * 0.00015 * params.speed;
      objectLines.rotation.x -= params.clusterRotationSpeed * 0.00015 * params.speed;

      // Update undulating waves
      for (let i = 0; i < amountLines; i++) {
        lines[i].update(accumulatedTime, params.waveAmplitude, params.waveFrequency);
      }

      // Update camera animation while preserving user zoom and custom camera angle
      updateCameraAnimation(dt);

      renderer.render(scene, camera);
    }

    function onResize() {
      ww = window.innerWidth;
      wh = window.innerHeight;
      camera.aspect = ww / wh;
      camera.updateProjectionMatrix();
      renderer.setSize(ww, wh);
    }

    init();
  </script>
</body>
</html>
