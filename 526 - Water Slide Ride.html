const GLSL_UNIFORMS = /* glsl */`
uniform float uTime;

const GLSL_NOISE = /* glsl */`
float hash12(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}
float vnoise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash12(i), hash12(i + vec2(1.0, 0.0)), u.x),
             mix(hash12(i + vec2(0.0, 1.0)), hash12(i + vec2(1.0, 1.0)), u.x), u.y);
}
`;

const GLSL_FUNCS = /* glsl */`
vec2 hash22(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973));
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.xx + p3.yz) * p3.zy);
}
float worley(vec2 p, vec2 period) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  float d = 8.0;
  for (int y = -1; y <= 1; y++) {
    for (int x = -1; x <= 1; x++) {
      vec2 g = vec2(float(x), float(y));
      vec2 r = g + hash22(mod(i + g, period)) - f;
      d = min(d, dot(r, r));
    }
  }
  return sqrt(d);
}
vec3 hueColor(float h) {
  vec3 c = clamp(abs(mod(h * 6.0 + vec3(0.0, 4.0, 2.0), 6.0) - 3.0) - 1.0, 0.0, 1.0);
  return pow(mix(vec3(1.0), c, 0.78), vec3(2.2));
}
float causticPat(vec2 m, vec2 tile, float t) {
  vec2 p = mod(m, tile) / tile * TAU;
  vec2 i = p;
  float c = 1.0;
  const float inten = 0.005;
  for (int n = 0; n < 4; n++) {
    float tt = t * (1.0 - 3.5 / float(n + 1));
    i = p + vec2(cos(tt - i.x) + sin(tt + i.y), sin(tt - i.y) + cos(tt + i.x));
    c += 1.0 / length(vec2(250.0 / (sin(i.x + tt) / inten), 250.0 / (cos(i.y + tt) / inten)));
  }
  c /= 4.0;
  c = 1.17 - pow(c, 1.4);
  return pow(abs(c), 8.0);
}
float fogFactor(float d) {
  float x = d * uFogDensity;
  return 1.0 - exp(-x * x);
}
vec3 skyRad(vec3 d) {
  float e = d.y;
  vec3 zen = vec3(0.16, 0.34, 0.85) * 1.5;
  vec3 hor = vec3(0.78, 0.86, 0.96) * 1.7;
  vec3 col = mix(hor, zen, smoothstep(0.0, 0.75, e));
  vec2 hz = normalize(d.xz + vec2(1e-4));
  float tree = 0.05 + 0.12 * vnoise(hz * 3.0 + 11.0) + 0.06 * vnoise(hz * 11.0 + 3.0);
  float g = 1.0 - smoothstep(tree - 0.05, tree + 0.05, e);
  col = mix(col, vec3(0.05, 0.085, 0.04), g);
  col = mix(col, vec3(0.045, 0.04, 0.035), 1.0 - smoothstep(-0.5, -0.05, e));
  float sd = max(dot(d, uSunDir), 0.0);
  col += vec3(1.0, 0.86, 0.66) * (pow(sd, 6.0) * 1.2 + pow(sd, 48.0) * 9.0) * (1.0 - g * 0.85);
  return col * uDaylight;
}
vec3 wallRadiance(float th, float s, vec3 outW, float aa) {
  float circ = TAU * uRadius;
  float x = th / TAU;
  int st = int(uStyle + 0.5);
  vec3 alb = uColA;
  vec3 emi = vec3(0.0);
  float trans = uTrans;
  float mott = vnoise(vec2(x * circ * 5.0, s * 5.0)) * 0.6 + vnoise(vec2(x * circ * 23.0, s * 2.5)) * 0.4;
  vec3 sky = skyRad(outW);
  if (st == 2) {
    float v = fract(x * 3.0 + s / 2.8);
    float d = abs(v - 0.5);
    float w = aa * 0.6 + 0.004;
    float m = smoothstep(0.25 - w, 0.25 + w, d);
    alb = mix(uColA, uColB, m) * (0.9 + 0.2 * mott);
  } else if (st == 3) {
    alb = uColA * (0.7 + 0.6 * mott);
    float rs = s / 2.0;
    float id = floor(rs + 0.5);
    float dd = abs(rs - id) * 2.0;
    float sig = 0.03 + aa * 1.5;
    float ring = exp(-dd * dd / (sig * sig));
    float chase = 0.5 + 0.5 * sin(id * 0.25 - uTime * 2.0);
    vec3 lc = mix(uLed, uColB, 0.5 + 0.5 * sin(id * 0.37 + uTime * 0.5));
    emi += lc * ring * (0.8 + 1.8 * chase) * (0.03 / sig) * 2.0;
    emi += lc * exp(-dd * 3.0) * 0.04 * (0.5 + chase);
    vec2 cell = vec2(x * circ * 3.0, s * 3.0);
    vec2 ci = floor(cell);
    vec2 cf = fract(cell) - 0.5;
    float h = hash12(ci + uSeedC);
    vec2 off = vec2(hash12(ci + 7.13), hash12(ci + 3.71)) - 0.5;
    float sd = length(cf - off * 0.6) / 3.0;
    float sw = 0.006 + aa * 0.8;
    float star = step(0.86, h) * (1.0 - smoothstep(0.0, sw, sd));
    emi += mix(uLed, vec3(1.0), 0.6) * star * (0.7 + 0.6 * sin(uTime * 2.3 + h * 40.0)) * 2.0 * (0.006 / sw);
    trans = 0.0;
  } else if (st == 4) {
    float rowS = s / 3.0;
    float row = floor(rowS);
    vec2 g = vec2(x * 6.0 + mod(row, 2.0) * 0.5, rowS);
    vec2 c = (fract(g) - 0.5) * vec2(circ / 6.0, 3.0);
    float d = length(c);
    float win = 1.0 - smoothstep(0.2, 0.2 + aa + 0.003, d);
    alb = uColA * (0.9 + 0.2 * mott) * (1.0 - win);
    emi += sky * vec3(0.9, 0.97, 1.05) * win;
  } else if (st == 5) {
    float id = floor(s / 2.4);
    alb = hueColor(fract(id * 0.083 + uSeedC * 0.01)) * (0.88 + 0.24 * mott);
    trans *= 0.85 + 0.3 * mott;
  } else if (st == 6) {
    float fd = abs(fract(s / 4.8 + 0.5) - 0.5) * 4.8;
    float band = 1.0 - smoothstep(0.05, 0.05 + aa + 0.002, fd);
    float nx = floor(circ * 14.0);
    float dp = worley(vec2((x + 0.5) * nx, mod(s, 64.0) * 10.0), vec2(nx, 640.0));
    float drop = (1.0 - smoothstep(0.1, 0.16, dp)) * (1.0 - smoothstep(0.004, 0.012, aa));
    alb = mix(uColA, uColB, band);
    trans *= (1.0 - band) * (1.0 - drop * 0.4);
    emi += sky * drop * 0.12 * (1.0 - band);
  } else if (st == 7) {
    float d = abs(fract(x * 6.0) - 0.5);
    float w = aa / max(circ / 6.0, 0.01) + 0.004;
    float m = 1.0 - smoothstep(0.18 - w, 0.18 + w, d);
    alb = mix(uColA, uColB, m) * (0.9 + 0.2 * mott);
  } else if (st == 8) {
    float rowS = s / 0.55;
    float row = floor(rowS);
    vec2 g = vec2(x * 9.0 + mod(row, 2.0) * 0.5, rowS);
    vec2 c = (fract(g) - 0.5) * vec2(circ / 9.0, 0.55);
    float dot0 = 1.0 - smoothstep(0.075, 0.075 + aa + 0.002, length(c));
    alb = mix(uColA, uColB, dot0) * (0.9 + 0.2 * mott);
    trans = mix(uTrans, 0.05, dot0);
  } else if (st == 9) {
    alb = uColA * (0.7 + 0.6 * mott);
    float v = fract(x * 4.0 + s / 3.2);
    float dm = abs(v - 0.5) * circ / 4.0;
    float sig = 0.012 + aa * 1.5;
    float strip = exp(-dm * dm / (sig * sig));
    float pulse = 0.35 + 0.65 * pow(0.5 + 0.5 * sin(s * 1.6 - uTime * 5.0), 3.0);
    vec3 lc = mix(uLed, uColB, 0.5 + 0.5 * sin(s * 0.15 + uTime * 0.3));
    emi += lc * strip * pulse * 2.5 * (0.012 / sig);
    trans = 0.0;
  } else {
    alb = uColA * (0.88 + 0.24 * mott);
    if (st == 1) trans *= 0.75 + 0.5 * mott;
  }
  float f = fract(s / 2.4);
  float seamD = min(f, 1.0 - f) * 2.4;
  float seam = 1.0 - smoothstep(0.004, 0.004 + aa + 0.002, seamD);
  if (st != 3 && st != 6 && st != 9) alb *= 1.0 - seam * 0.5;
  float jd = min(abs(s - uSRange.x), abs(s - uSRange.y));
  float joint = 1.0 - smoothstep(0.02, 0.02 + aa + 0.003, jd);
  alb *= 1.0 - joint * 0.7;
  return alb * (uAmb + sky * trans) + emi;
}
vec3 tubeHit(float th0, float s0, vec3 d, vec3 T, vec3 U, vec3 R) {
  float dt = dot(d, T);
  vec2 p = vec2(dot(d, R), dot(d, U));
  float pl = max(length(p), 0.02);
  float beta = atan(p.y, p.x + 1e-6);
  float th1 = 2.0 * beta - th0;
  th1 = mod(th1 + PI, TAU) - PI;
  float chord = max(2.0 * uRadius * abs(sin((th1 - th0) * 0.5)), 0.05);
  float along = clamp(chord * dt / pl, -80.0, 80.0);
  return vec3(th1, s0 + along, sqrt(chord * chord + along * along));
}
`;

const WALL_VS = /* glsl */`
${GLSL_UNIFORMS}

attribute vec3 aRight;
attribute vec3 aData;

varying vec3 vNw;
varying vec3 vUpW;
varying vec3 vRightW;
varying float vTh;
varying float vS;

void main() {
  vec4 mv = modelViewMatrix * vec4(position, 1.0);
  vViewPos = mv.xyz;
  mat3 m = mat3(modelMatrix);
  vNw = normalize(m * normal);
  vUpW = normalize(m * aUp);
  vRightW = normalize(m * aRight);

const WALL_FS = /* glsl */`
${GLSL_UNIFORMS}
${GLSL_NOISE}
${GLSL_FUNCS}
varying vec3 vViewPos;
varying vec3 vNw;
varying vec3 vUpW;
varying vec3 vRightW;
varying float vTh;
varying float vS;
varying float vBank;
void main() {
  vec3 N = normalize(vNw);
  vec3 UW = normalize(vUpW);
  vec3 RW = normalize(vRightW);
  vec3 TW = normalize(cross(UW, RW));
  mat3 invView = transpose(mat3(viewMatrix));
  vec3 Vw = normalize(invView * vViewPos);
  float aa = max(fwidth(vS), fwidth(vTh) * uRadius) + 0.0015;

  vec3 col = wallRadiance(vTh, vS, -N, aa);

  float ndv = clamp(dot(-Vw, N), 0.0, 1.0);
  float F = (0.04 + 0.96 * pow(1.0 - ndv, 5.0)) * uGloss;
  vec3 Rw = reflect(Vw, N);
  float dn = dot(Rw, N);
  if (dn < 0.02) Rw = normalize(Rw + N * (0.02 - dn));
  vec3 hit = tubeHit(vTh, vS, Rw, TW, UW, RW);
  vec3 outH = -UW * cos(hit.x) + RW * sin(hit.x);
  vec3 refl = wallRadiance(hit.x, hit.y, outH, 0.12 + hit.z * 0.03);
  refl = mix(refl, uFogColor, fogFactor(hit.z));

  float dTh = abs(vTh - vBank);
  float wet = 1.0 - smoothstep(uWaterHalf * 0.95, uWaterHalf * 1.7, dTh);
  col = mix(col, refl, clamp(F * (1.0 + 0.9 * wet), 0.0, 1.0));

  float wm = 1.0 - smoothstep(uWaterHalf * 0.8, uWaterHalf * 1.02, dTh);
  if (wm > 0.001) {
    vec2 m = vec2(vTh * uRadius, (vS - uFlowOff) * 0.55);
    float t = uTime * 0.7 + 23.0;
    vec2 tileA = vec2(0.5, 0.5);
    vec2 tileB = vec2(0.77, 0.77);
    float cB = causticPat(m * 1.13 + vec2(0.31, 0.17), tileB, t * 0.83 + 7.0);
    vec3 cA = vec3(causticPat(m + vec2(0.006, 0.0), tileA, t),
                   causticPat(m, tileA, t),
                   causticPat(m - vec2(0.006, 0.0), tileA, t));
    vec3 c = cA * (0.55 + 0.9 * cB);
    float cfade = 1.0 - smoothstep(0.012, 0.05, aa);
    vec3 light = uAmb * 2.5 + uColA * uTrans * uDaylight * 0.6 + vec3(0.03) * uDaylight;
    col = col * mix(1.0, 0.72, wm) + wm * light * (c * 1.8 * cfade + 0.12 * (1.0 - cfade));
  }

  col = mix(col, uFogColor, fogFactor(length(vViewPos)));
  gl_FragColor = vec4(col, 1.0);
}
`;

const WATER_VS = /* glsl */`
${GLSL_UNIFORMS}
${GLSL_NOISE}
attribute vec3 aCenter;
attribute vec3 aUp;
attribute vec3 aRight;
attribute vec3 aData;
varying vec3 vViewPos;
varying vec3 vNw;
varying vec3 vUpW;
varying vec3 vRightW;
varying float vTh;
varying float vS;
varying float vA;
void main() {
  float a = aData.x;
  float q = aData.y - uFlowOff;
  float side = a > 0.0 ? 17.0 : 3.0;
  float wob = (vnoise(vec2(q * 0.55, side)) - 0.5) * 0.6 + (vnoise(vec2(q * 1.7 + uTime * 0.5, side + 9.0)) - 0.5) * 0.3;
  float th = bankAngle(aData.z) + a * uWaterHalf * (1.0 + wob * 0.35 * abs(a));
  vec3 radial = -aUp * cos(th) + aRight * sin(th);
  float swell = vnoise(vec2(q * 1.2, a * 2.0 + uTime * 0.3)) - 0.5;
  float depth = 0.012 + (0.065 + 0.014 * swell) * (1.0 - a * a);
  vec3 pos = aCenter + radial * (uRadius - depth);
  vec4 mv = modelViewMatrix * vec4(pos, 1.0);
  vViewPos = mv.xyz;
  mat3 m = mat3(modelMatrix);
  vNw = normalize(m * (-radial));
  vUpW = normalize(m * aUp);
  vRightW = normalize(m * aRight);
  vTh = th;
  vS = aData.y;
  vA = a;
  gl_Position = projectionMatrix * mv;
}
`;

const WATER_FS = /* glsl */`
${GLSL_UNIFORMS}
uniform float uWaves;
uniform float uFoam;
uniform float uDepthTint;
uniform float uRefract;
uniform vec3 uWaterColor;
uniform sampler2D tRefr;
uniform sampler2D tDepth;
uniform vec2 uScreen;
uniform vec2 uProjScale;
uniform float uNear;
uniform float uFar;
${GLSL_NOISE}
${GLSL_FUNCS}
varying vec3 vViewPos;
varying vec3 vNw;
varying vec3 vUpW;
varying vec3 vRightW;
varying float vTh;
varying float vS;
varying float vA;

float gDetail = 1.0;

float waterH(vec2 p) {
  vec2 w = vec2(vnoise(p * vec2(1.3, 0.5) + vec2(0.0, uTime * 0.45)),
                vnoise(p * vec2(1.1, 0.45) + vec2(5.2, -uTime * 0.35))) - 0.5;
  p += w * vec2(0.35, 0.8);
  float h = vnoise(vec2(p.x * 2.0, p.y * 0.7 + uTime * 0.3)) * 0.5;
  h += vnoise(vec2(p.x * 4.2 + 3.1, p.y * 1.6 + uTime * 0.9)) * 0.25;
  h += vnoise(vec2(p.x * 8.5 - 1.7, p.y * 3.6 - uTime * 1.2)) * 0.14;
  h += vnoise(vec2(p.x * 17.0 + 7.3, p.y * 7.5 + uTime * 1.8)) * 0.075 * gDetail;
  h += vnoise(vec2(p.x * 34.0 - 2.1, p.y * 16.0 - uTime * 2.6)) * 0.04 * gDetail * gDetail;
  return h;
}

float sceneDist(vec2 uv) {
  float z = texture2D(tDepth, uv).r * 2.0 - 1.0;
  return 2.0 * uNear * uFar / (uFar + uNear - z * (uFar - uNear));
}

void main() {
  vec3 UW = normalize(vUpW);
  vec3 RW = normalize(vRightW);
  vec3 TW = normalize(cross(UW, RW));
  vec3 N0 = normalize(vNw);
  vec3 BW = normalize(cross(TW, N0));
  float fa = abs(vA);
  float across = vA * uWaterHalf * uRadius;
  vec2 p = vec2(across, vS - uFlowOff);
  float fp = max(fwidth(p.y), fwidth(p.x));
  gDetail = 1.0 - smoothstep(0.015, 0.06, fp);

  float e = 0.012;
  float h0 = waterH(p);
  vec2 g = vec2(waterH(p + vec2(e, 0.0)) - h0, waterH(p + vec2(0.0, e)) - h0) / e;
  g *= 0.055 * uWaves * (0.7 + 0.6 * fa);
  vec3 N = normalize(N0 - BW * g.x - TW * g.y);

  mat3 invView = transpose(mat3(viewMatrix));
  vec3 Vw = normalize(invView * vViewPos);
  float ndv = clamp(dot(-Vw, N), 0.0, 1.0);
  float F = 0.02 + 0.98 * pow(1.0 - ndv, 5.0);

  vec3 Rw = reflect(Vw, N);
  float dn = dot(Rw, N0);
  if (dn < 0.03) Rw = normalize(Rw + N0 * (0.03 - dn));
  vec3 hit = tubeHit(vTh, vS, Rw, TW, UW, RW);
  vec3 outH = -UW * cos(hit.x) + RW * sin(hit.x);
  vec3 refl = wallRadiance(hit.x, hit.y, outH, 0.01 + hit.z * 0.004);
  refl = mix(refl, uFogColor, fogFactor(hit.z));

  vec2 suv = gl_FragCoord.xy / uScreen;
  float wz = -vViewPos.z;
  float rayScale = length(vViewPos) / max(wz, 1e-3);
  float thick0 = max(sceneDist(suv) - wz, 0.0) * rayScale;
  vec3 Nv = mat3(viewMatrix) * N;
  vec3 N0v = mat3(viewMatrix) * N0;
  vec2 dv = (Nv.xy - N0v.xy) * min(thick0, 0.4) * 1.5 * uRefract;
  vec2 ruv = clamp(suv + dv * uProjScale * 0.5 / max(wz, 0.05), vec2(0.001), vec2(0.999));
  float rz = sceneDist(ruv);
  if (rz < wz) { ruv = suv; rz = sceneDist(suv); }
  float thick = max(rz - wz, 0.0) * rayScale;

  vec2 px = (1.0 + min(thick, 0.5) * 5.0) / uScreen * 2.0;
  vec3 refr = texture2D(tRefr, ruv).rgb * 0.4;
  refr += texture2D(tRefr, ruv + vec2(px.x, px.y * 0.4)).rgb * 0.15;
  refr += texture2D(tRefr, ruv - vec2(px.x, px.y * 0.4)).rgb * 0.15;
  refr += texture2D(tRefr, ruv + vec2(-px.x * 0.4, px.y)).rgb * 0.15;
  refr += texture2D(tRefr, ruv + vec2(px.x * 0.4, -px.y)).rgb * 0.15;

  vec3 sigma = -log(clamp(uWaterColor, vec3(0.02), vec3(0.98))) * uDepthTint * 2.5;
  vec3 absorb = exp(-sigma * thick);
  vec3 lightIn = uAmb * 1.6 + uDaylight * uTrans * uColA * 0.12 + 0.004;
  vec3 inscat = uWaterColor * lightIn;
  vec3 transmitted = refr * absorb + inscat * (1.0 - absorb);

  vec2 fq = vec2(across, p.y);
  float turb = vnoise(fq * vec2(3.0, 0.8) + vec2(0.0, uTime * 0.3)) * 0.6
             + vnoise(fq * vec2(7.0, 2.0) - vec2(0.0, uTime * 0.5)) * 0.4;
  float edgeMask = smoothstep(0.7, 0.98, fa + (turb - 0.5) * 0.3);
  float patchMask = smoothstep(0.66, 0.86, turb + (h0 - 0.5) * 0.3) * 0.55;
  float fy = mod(fq.y, 64.0);
  float laceFade = 1.0 - smoothstep(0.0012, 0.004, fp);
  float laceFade2 = 1.0 - smoothstep(0.0006, 0.002, fp);
  float lace = smoothstep(0.3, 0.62, worley(vec2(fq.x * 110.0, fy * 85.0 + uTime * 0.6), vec2(1e4, 5440.0)));
  float lace2 = smoothstep(0.28, 0.6, worley(vec2(fq.x * 240.0 + 3.7, fy * 190.0 - uTime * 0.9), vec2(1e4, 12160.0)));
  float foamTex = mix(0.55, lace * mix(1.0, lace2, 0.6 * laceFade2), laceFade);
  float foam = clamp((edgeMask + patchMask) * uFoam, 0.0, 1.0) * mix(0.25, 1.0, foamTex);
  foam = clamp(foam * 1.3, 0.0, 1.0);
  vec3 foamCol = vec3(0.95, 0.98, 1.0) * (lightIn * 1.5 + 0.015 * uDaylight) + refl * 0.12;

  float fogW = fogFactor(length(vViewPos));
  vec3 reflF = mix(refl, uFogColor, fogW);
  vec3 foamF = mix(foamCol, uFogColor, fogW);
  vec3 col = mix(transmitted, reflF, F);
  col = mix(col, foamF, foam);

  float cut = 1.0 - smoothstep(0.9, 1.0, fa + (turb - 0.5) * 0.1);
  gl_FragColor = vec4(col * cut, cut);
}
`;

const VignetteShader = {

// ============================================================
// Renderer, Scene, Camera, Post-processing
// ============================================================
const renderer = new THREE.WebGLRenderer({
  antialias: PARAMS.performance.antialias,
  powerPreference: 'high-performance'
});
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = PARAMS.lighting.exposure;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(PARAMS.camera.fov, window.innerWidth / window.innerHeight, NEAR, FAR);
camera.layers.enable(LAYER_WATER);

// Refraction target
const refrTarget = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, depthBuffer: true });
refrTarget.texture.minFilter = THREE.LinearFilter;
refrTarget.texture.magFilter = THREE.LinearFilter;
refrTarget.texture.generateMipmaps = false;
refrTarget.depthTexture = new THREE.DepthTexture(1, 1);
G.tRefr.value = refrTarget.texture;
G.tDepth.value = refrTarget.depthTexture;
const _bufSize = new THREE.Vector2();

let currentDPR = PARAMS.performance.dpr;
renderer.setPixelRatio(currentDPR);
renderer.setSize(window.innerWidth, window.innerHeight);

let composerTarget = new THREE.WebGLRenderTarget(1, 1, {
  type: THREE.HalfFloatType,
  samples: PARAMS.performance.antialias ? 4 : 0
});
const composer = new EffectComposer(renderer, composerTarget);
composer.setPixelRatio(currentDPR);
composer.setSize(window.innerWidth, window.innerHeight);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight),
  PARAMS.post.bloomStrength, PARAMS.post.bloomRadius, PARAMS.post.bloomThreshold);
composer.addPass(bloomPass);
const vignettePass = new ShaderPass(VignetteShader);
composer.addPass(vignettePass);
composer.addPass(new OutputPass());

// ============================================================
// Real Scene Light Sources
// ============================================================
const ambientLight = new THREE.AmbientLight(PARAMS.lighting.ambientColor, PARAMS.lighting.ambientIntensity);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(PARAMS.lighting.sunColor, PARAMS.lighting.sunIntensity);
scene.add(sunLight);

const pointLight = new THREE.PointLight(PARAMS.lighting.pointColor, PARAMS.lighting.pointIntensity, PARAMS.lighting.pointDistance);
scene.add(pointLight);

const hemiLight = new THREE.HemisphereLight(PARAMS.lighting.hemiSkyColor, PARAMS.lighting.hemiGroundColor, PARAMS.lighting.hemiIntensity);
scene.add(hemiLight);

// ============================================================
// Seeded RNG
// ============================================================
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ============================================================
// Track Generator
// ============================================================
const ctrl = [];
let ctrlBase = 0;
const gen = { rng: null, x: 0, y: 0, z: 0, yaw: 0, pitch: 0, turn: 0, remain: 0, targetTurn: 0, targetPitch: 0, lastDir: 0 };

function genReset(seed) {
  gen.rng = mulberry32(seed * 9973 + 17);
  gen.x = 0; gen.y = 0; gen.z = CTRL_STEP;
  gen.yaw = 0; gen.pitch = -0.05; gen.turn = 0;
  gen.remain = 28; gen.targetTurn = 0; gen.targetPitch = -0.05; gen.lastDir = 0;
  ctrl.length = 0; ctrlBase = 0;
  ctrl.push([gen.x, gen.y, gen.z]);
}

function pickMode() {
  const rnd = gen.rng;
  const P = PARAMS.geometry;
  const dir = (gen.lastDir !== 0 && rnd() < 0.62) ? -gen.lastDir : (rnd() < 0.5 ? -1 : 1);
  const r = rnd();
  const maxTurn = 1 / 6.2;
  if (r < P.helixChance) {
    const R = 6.5 + rnd() * 3.5;
    gen.targetTurn = dir * Math.min(P.turns / R, maxTurn);
    gen.remain = TAU * (0.8 + rnd() * 1.4) * R;
    gen.targetPitch = -(0.08 + rnd() * 0.07);
    gen.lastDir = dir;
  } else if (r < P.helixChance + (1 - P.helixChance) * 0.6) {
    const R = 9 + rnd() * 20;
    gen.targetTurn = dir * Math.min(P.turns / R, maxTurn);
    gen.remain = (0.6 + rnd() * 1.9) * R;
    gen.targetPitch = -(0.03 + rnd() * 0.08);
    gen.lastDir = dir;
  } else {
    gen.targetTurn = (rnd() - 0.5) * 0.01;
    gen.remain = 8 + rnd() * 22;
    gen.targetPitch = -(0.02 + rnd() * 0.12);
  }
}

function genStep() {
  if (gen.remain <= 0) pickMode();
  const ds = CTRL_STEP;
  gen.turn += THREE.MathUtils.clamp(gen.targetTurn - gen.turn, -0.036, 0.036);
  gen.pitch += THREE.MathUtils.clamp(gen.targetPitch - gen.pitch, -0.02, 0.02);
  gen.yaw += gen.turn * ds;
  const cp = Math.cos(gen.pitch);
  gen.x += -Math.sin(gen.yaw) * cp * ds;
  gen.y += Math.sin(gen.pitch) * ds;
  gen.z += -Math.cos(gen.yaw) * cp * ds;
  gen.remain -= ds;
  ctrl.push([gen.x, gen.y, gen.z]);
}

function ctrlAt(k) { return ctrl[k - ctrlBase]; }
function ensureCtrl(k) { while (ctrlBase + ctrl.length <= k) genStep(); }

const _p = [0, 0, 0], _d1 = [0, 0, 0], _d2 = [0, 0, 0];
function evalSeg(k, t) {
  const p0 = ctrlAt(k - 1), p1 = ctrlAt(k), p2 = ctrlAt(k + 1), p3 = ctrlAt(k + 2);
  for (let c = 0; c < 3; c++) {
    const a = p0[c], b = p1[c], cc = p2[c], d = p3[c];
    const A = 2 * a - 5 * b + 4 * cc - d;
    const B = -a + 3 * b - 3 * cc + d;
    _p[c] = 0.5 * (2 * b + (-a + cc) * t + A * t * t + B * t * t * t);
    _d1[c] = 0.5 * ((-a + cc) + 2 * A * t + 3 * B * t * t);
    _d2[c] = 0.5 * (2 * A + 6 * B * t);
  }
}

// ============================================================
// Chunks (Track Sections)
// ============================================================
const chunks = [];
let nextCtrl = 1;
let lastSample = null;
let styleRng = mulberry32(1);
let prevStyleKey = null;
const SKY_AVG = new THREE.Color(0.55, 0.66, 0.85);
const _col = new THREE.Color();

function pickStyle() {
  const keys = Object.keys(STYLE_DEFS).filter((k) => PARAMS.styles[k]);
  if (!keys.length) keys.push('solid');
  let key = keys[Math.floor(styleRng() * keys.length)];
  let tries = 0;
  while (keys.length > 1 && key === prevStyleKey && tries++ < 10) key = keys[Math.floor(styleRng() * keys.length)];
  prevStyleKey = key;
  const def = STYLE_DEFS[key];
  const pal = def.palettes[Math.floor(styleRng() * def.palettes.length)];
  return { key, def, pal };
}

function makeChunkUniforms() {
  return {
    uStyle: { value: 0 },
    uColA: { value: new THREE.Color() },
    uColB: { value: new THREE.Color() },
    uLed: { value: new THREE.Color() },
    uTrans: { value: 0 },
    uAmb: { value: new THREE.Color() },
    uGloss: { value: 0.5 },
    uSeedC: { value: 0 },
    uSRange: { value: new THREE.Vector2() },
  };
}

function updateChunkAmbient(ch) {
  const u = ch.u;
  const d = PARAMS.lighting.daylight * (PARAMS.lighting.sunIntensity / 1.2);
  const a = u.uAmb.value;
  a.copy(u.uColA.value).multiply(SKY_AVG).multiplyScalar(u.uTrans.value * 0.7 * d * PARAMS.lighting.ambientIntensity);
  if (LIGHT_TUBES.has(ch.styleKey)) {
    _col.copy(u.uLed.value).add(u.uColB.value).multiplyScalar(0.035 * (PARAMS.lighting.pointIntensity / 1.5));
    a.add(_col).addScalar(0.003 * d);
  } else if (ch.styleKey === 'portholes') {
    _col.copy(SKY_AVG).multiplyScalar(0.06 * d);
    a.add(_col).addScalar(0.02 * d);
  } else {
    a.addScalar(0.022 * d);
  }
  ch.fog.copy(a).multiplyScalar(1.5).addScalar(0.002);
}

function buildChunkGeometry(ch) {
  const M = PARAMS.performance.tubeDetail;
  const r = PARAMS.geometry.radius;
  const n = ch.n;
  const ox = ch.origin.x, oy = ch.origin.y, oz = ch.origin.z;

  const vc = n * (M + 1);
  const pos = new Float32Array(vc * 3), nor = new Float32Array(vc * 3);
  const up = new Float32Array(vc * 3), ri = new Float32Array(vc * 3), dat = new Float32Array(vc * 3);
  let v = 0;
  for (let i = 0; i < n; i++) {
    const i3 = i * 3;
    const cx = ch.pos[i3] - ox, cy = ch.pos[i3 + 1] - oy, cz = ch.pos[i3 + 2] - oz;
    const ux = ch.U[i3], uy = ch.U[i3 + 1], uz = ch.U[i3 + 2];
    const rx = ch.R[i3], ry = ch.R[i3 + 1], rz = ch.R[i3 + 2];
    const s = ch.S[i], k = ch.K[i];
    for (let j = 0; j <= M; j++) {
      const th = -Math.PI + TAU * j / M;
      const c = Math.cos(th), sn = Math.sin(th);
      const dx = -ux * c + rx * sn, dy = -uy * c + ry * sn, dz = -uz * c + rz * sn;
      const v3 = v * 3;
      pos[v3] = cx + dx * r; pos[v3 + 1] = cy + dy * r; pos[v3 + 2] = cz + dz * r;
      nor[v3] = -dx; nor[v3 + 1] = -dy; nor[v3 + 2] = -dz;
      up[v3] = ux; up[v3 + 1] = uy; up[v3 + 2] = uz;
      ri[v3] = rx; ri[v3 + 1] = ry; ri[v3 + 2] = rz;
      dat[v3] = th; dat[v3 + 1] = s; dat[v3 + 2] = k;
      v++;
    }
  }
  const IdxW = vc > 65535 ? Uint32Array : Uint16Array;
  const idx = new IdxW((n - 1) * M * 6);
  let p = 0;
  for (let i = 0; i < n - 1; i++) {
    for (let j = 0; j < M; j++) {
      const a = i * (M + 1) + j, b = a + M + 1;
      idx[p++] = a; idx[p++] = b; idx[p++] = a + 1;
      idx[p++] = a + 1; idx[p++] = b; idx[p++] = b + 1;
    }
  }
  const wallGeo = new THREE.BufferGeometry();
  wallGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  wallGeo.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  wallGeo.setAttribute('aUp', new THREE.BufferAttribute(up, 3));
  wallGeo.setAttribute('aRight', new THREE.BufferAttribute(ri, 3));
  wallGeo.setAttribute('aData', new THREE.BufferAttribute(dat, 3));
  wallGeo.setIndex(new THREE.BufferAttribute(idx, 1));
  wallGeo.computeBoundingSphere();

  const W = WATER_SEG;
  const wc = n * (W + 1);
  const wpos = new Float32Array(wc * 3), wup = new Float32Array(wc * 3), wri = new Float32Array(wc * 3), wdat = new Float32Array(wc * 3);
  v = 0;
  for (let i = 0; i < n; i++) {
    const i3 = i * 3;
    const cx = ch.pos[i3] - ox, cy = ch.pos[i3 + 1] - oy, cz = ch.pos[i3 + 2] - oz;
    for (let j = 0; j <= W; j++) {
      const v3 = v * 3;
      wpos[v3] = cx; wpos[v3 + 1] = cy; wpos[v3 + 2] = cz;
      wup[v3] = ch.U[i3]; wup[v3 + 1] = ch.U[i3 + 1]; wup[v3 + 2] = ch.U[i3 + 2];
      wri[v3] = ch.R[i3]; wri[v3 + 1] = ch.R[i3 + 1]; wri[v3 + 2] = ch.R[i3 + 2];
      wdat[v3] = -1 + 2 * j / W; wdat[v3 + 1] = ch.S[i]; wdat[v3 + 2] = ch.K[i];
      v++;
    }
  }
  const IdxR = wc > 65535 ? Uint32Array : Uint16Array;
  const widx = new IdxR((n - 1) * W * 6);
  p = 0;
  for (let i = 0; i < n - 1; i++) {
    for (let j = 0; j < W; j++) {
      const a = i * (W + 1) + j, b = a + W + 1;
      widx[p++] = a; widx[p++] = b; widx[p++] = a + 1;
      widx[p++] = a + 1; widx[p++] = b; widx[p++] = b + 1;
    }
  }
  const waterGeo = new THREE.BufferGeometry();
  const wposAttr = new THREE.BufferAttribute(wpos, 3);
  waterGeo.setAttribute('position', wposAttr);
  waterGeo.setAttribute('aCenter', wposAttr);
  waterGeo.setAttribute('aUp', new THREE.BufferAttribute(wup, 3));
  waterGeo.setAttribute('aRight', new THREE.BufferAttribute(wri, 3));
  waterGeo.setAttribute('aData', new THREE.BufferAttribute(wdat, 3));
  waterGeo.setIndex(new THREE.BufferAttribute(widx, 1));

  return { wallGeo, waterGeo };
}

function buildChunk() {
  const segs = Math.max(5, Math.round(PARAMS.geometry.sectionLength / CTRL_STEP));
  ensureCtrl(nextCtrl + segs + 2);
  const n = segs * SUB + 1;
  const ch = {
    n,
    pos: new Float64Array(n * 3),
    T: new Float32Array(n * 3), U: new Float32Array(n * 3), R: new Float32Array(n * 3),
    S: new Float64Array(n), K: new Float32Array(n),
    ctrlStart: nextCtrl,
    origin: new THREE.Vector3(),
    fog: new THREE.Color(),
  };
  let s = lastSample ? lastSample.s : 0;
  let kf = lastSample ? lastSample.k : 0;
  let idx = 0, px = 0, py = 0, pz = 0;
  for (let seg = 0; seg < segs; seg++) {
    const k = nextCtrl + seg;
    const iMax = seg === segs - 1 ? SUB : SUB - 1;
    for (let i = 0; i <= iMax; i++) {
      evalSeg(k, i / SUB);
      const x = _p[0], y = _p[1], z = _p[2];
      const len = Math.hypot(_d1[0], _d1[1], _d1[2]) || 1;
      const tx = _d1[0] / len, ty = _d1[1] / len, tz = _d1[2] / len;
      let ux = -ty * tx, uy = 1 - ty * ty, uz = -ty * tz;
      const ul = Math.hypot(ux, uy, uz) || 1;
      ux /= ul; uy /= ul; uz /= ul;
      const rx = ty * uz - tz * uy, ry = tz * ux - tx * uz, rz = tx * uy - ty * ux;
      const kr = (_d2[0] * rx + _d2[1] * ry + _d2[2] * rz) / (len * len);
      if (idx > 0) {
        const ds = Math.hypot(x - px, y - py, z - pz);
        s += ds;
        kf += (kr - kf) * (1 - Math.exp(-ds / 2.2));
      } else if (!lastSample) {
        kf = kr;
      }
      const i3 = idx * 3;
      ch.pos[i3] = x; ch.pos[i3 + 1] = y; ch.pos[i3 + 2] = z;
      ch.T[i3] = tx; ch.T[i3 + 1] = ty; ch.T[i3 + 2] = tz;
      ch.U[i3] = ux; ch.U[i3 + 1] = uy; ch.U[i3 + 2] = uz;
      ch.R[i3] = rx; ch.R[i3 + 1] = ry; ch.R[i3 + 2] = rz;
      ch.S[idx] = s; ch.K[idx] = kf;
      px = x; py = y; pz = z;
      idx++;
    }
  }
  ch.startS = ch.S[0];
  ch.endS = ch.S[n - 1];
  ch.origin.set(ch.pos[0], ch.pos[1], ch.pos[2]);
  nextCtrl += segs;
  lastSample = { s: ch.S[n - 1], k: ch.K[n - 1] };

  const st = pickStyle();
  ch.styleKey = st.key;
  const u = makeChunkUniforms();
  u.uStyle.value = st.def.id;

  if (PARAMS.colors.scheme === 'Original') {
    u.uColA.value.set(st.pal[0]);
    u.uColB.value.set(st.pal[1] || st.pal[0]);
    u.uLed.value.set(st.pal[2] || st.pal[1] || st.pal[0]);
  } else {
    u.uColA.value.set(PARAMS.colors.wallA);
    u.uColB.value.set(PARAMS.colors.wallB);
    u.uLed.value.set(PARAMS.colors.led);
  }

  u.uTrans.value = st.def.trans;
  u.uGloss.value = st.def.gloss;
  u.uSeedC.value = styleRng() * 100;
  u.uSRange.value.set(ch.startS, ch.endS);
  ch.u = u;
  updateChunkAmbient(ch);

  ch.wallMat = new THREE.ShaderMaterial({
    uniforms: { ...G, ...u }, vertexShader: WALL_VS, fragmentShader: WALL_FS, side: THREE.DoubleSide,
  });
  ch.waterMat = new THREE.ShaderMaterial({
    uniforms: { ...G, ...u }, vertexShader: WATER_VS, fragmentShader: WATER_FS, side: THREE.DoubleSide,
    transparent: true, depthWrite: false, premultipliedAlpha: true,
  });
  const geos = buildChunkGeometry(ch);
  ch.wall = new THREE.Mesh(geos.wallGeo, ch.wallMat);
  ch.water = new THREE.Mesh(geos.waterGeo, ch.waterMat);
  ch.water.frustumCulled = false;
  ch.water.renderOrder = 1;
  ch.water.layers.set(LAYER_WATER);
  ch.group = new THREE.Group();
  ch.group.position.copy(ch.origin);
  ch.group.add(ch.wall, ch.water);
  scene.add(ch.group);
  chunks.push(ch);
}

function disposeChunk(ch) {
  scene.remove(ch.group);
  ch.wall.geometry.dispose();
  ch.water.geometry.dispose();
  ch.wallMat.dispose();
  ch.waterMat.dispose();
}

function trimCtrl() {
  if (!chunks.length) return;
  const drop = (chunks[0].ctrlStart - 1) - ctrlBase;
  if (drop > 0) { ctrl.splice(0, drop); ctrlBase += drop; }
}

function rebuildAllMeshes() {
  for (const ch of chunks) {
    ch.wall.geometry.dispose();
    ch.water.geometry.dispose();
    const geos = buildChunkGeometry(ch);
    ch.wall.geometry = geos.wallGeo;
    ch.water.geometry = geos.waterGeo;
  }
}

// ============================================================
// Path Sampling
// ============================================================
function makeSample() {
  return { pos: new THREE.Vector3(), T: new THREE.Vector3(), U: new THREE.Vector3(), R: new THREE.Vector3(), k: 0 };
}

function findChunk(s) {
  for (let i = 0; i < chunks.length; i++) {
    if (s <= chunks[i].endS) return chunks[i];
  }
  return chunks[chunks.length - 1];
}

function samplePath(s, out) {
  const c = findChunk(s);
  const S = c.S;
  let lo = 0, hi = c.n - 1;
  while (hi - lo > 1) {
    const mid = (lo + hi) >> 1;
    if (S[mid] <= s) lo = mid; else hi = mid;
  }
  const span = S[hi] - S[lo];
  const t = THREE.MathUtils.clamp(span > 0 ? (s - S[lo]) / span : 0, 0, 1);
  const a = lo * 3, b = hi * 3;
  out.pos.set(
    c.pos[a] + (c.pos[b] - c.pos[a]) * t,
    c.pos[a + 1] + (c.pos[b + 1] - c.pos[a + 1]) * t,
    c.pos[a + 2] + (c.pos[b + 2] - c.pos[a + 2]) * t);
  out.T.set(c.T[a] + (c.T[b] - c.T[a]) * t, c.T[a + 1] + (c.T[b + 1] - c.T[a + 1]) * t, c.T[a + 2] + (c.T[b + 2] - c.T[a + 2]) * t).normalize();
  out.U.set(c.U[a] + (c.U[b] - c.U[a]) * t, c.U[a + 1] + (c.U[b + 1] - c.U[a + 1]) * t, c.U[a + 2] + (c.U[b + 2] - c.U[a + 2]) * t).normalize();
  out.R.set(c.R[a] + (c.R[b] - c.R[a]) * t, c.R[a + 1] + (c.R[b + 1] - c.R[a + 1]) * t, c.R[a + 2] + (c.R[b + 2] - c.R[a + 2]) * t).normalize();
  out.k = c.K[lo] + (c.K[hi] - c.K[lo]) * t;
  return c;
}

function bankOf(k) {
  return THREE.MathUtils.clamp(-Math.atan(G.uBankGain.value * k), -1.25, 1.25);
}

function radialDir(S, b, out) {
  return out.copy(S.U).multiplyScalar(-Math.cos(b)).addScaledVector(S.R, Math.sin(b));
}

// ============================================================
// Spray Droplets
// ============================================================
const dropPos = new Float64Array(DROPS * 3);
const dropVel = new Float64Array(DROPS * 3);
const dropLife = new Float32Array(DROPS).fill(1);
const dropMax = new Float32Array(DROPS).fill(1);
const dropSize = new Float32Array(DROPS);
const dropGeo = new THREE.BufferGeometry();
const dropPosAttr = new THREE.BufferAttribute(new Float32Array(DROPS * 3), 3).setUsage(THREE.DynamicDrawUsage);
const dropInfoAttr = new THREE.BufferAttribute(new Float32Array(DROPS * 2), 2).setUsage(THREE.DynamicDrawUsage);
dropGeo.setAttribute('position', dropPosAttr);
dropGeo.setAttribute('aInfo', dropInfoAttr);
const dropMat = new THREE.ShaderMaterial({
  uniforms: { uScale: { value: 500 }, uColor: { value: new THREE.Color() } },
  vertexShader: DROP_VS, fragmentShader: DROP_FS,
  transparent: true, depthWrite: false, premultipliedAlpha: true,
});
const drops = new THREE.Points(dropGeo, dropMat);
drops.frustumCulled = false;
drops.renderOrder = 2;
drops.visible = PARAMS.performance.spray;
drops.layers.set(LAYER_WATER);
scene.add(drops);
let dropCursor = 0, spawnAcc = 0;

function killDrops() { dropLife.fill(1); dropMax.fill(1); }

function spawnDrop() {
  const i = dropCursor;
  dropCursor = (dropCursor + 1) % DROPS;
  samplePath(sCam + 0.9 + Math.random() * 1.0, SC);
  const side = Math.random() < 0.5 ? -1 : 1;
  const b = camBank + side * (0.18 + Math.random() * 0.35);
  const cb = Math.cos(b), sb = Math.sin(b);
  const r = PARAMS.geometry.radius - 0.05;
  const fwd = speed * (0.8 + Math.random() * 0.35);
  const lift = 0.7 + Math.random() * 1.5;
  const lat = side * (0.2 + Math.random() * 0.8);
  const comps = ['x', 'y', 'z'];
  for (let c = 0; c < 3; c++) {
    const key = comps[c];
    const radial = -SC.U[key] * cb + SC.R[key] * sb;
    const tang = SC.U[key] * sb + SC.R[key] * cb;
    dropPos[i * 3 + c] = SC.pos[key] + radial * r;
    dropVel[i * 3 + c] = SC.T[key] * fwd - radial * lift + tang * lat;
  }
  dropLife[i] = 0;
  dropMax[i] = 0.3 + Math.random() * 0.5;
  dropSize[i] = 0.0012 + Math.random() * 0.0026;
}

function updateDrops(dt) {
  if (!drops.visible) return;
  if (dt > 0) {
    spawnAcc += dt * 160;
    while (spawnAcc >= 1) { spawnDrop(); spawnAcc -= 1; }
  }
  const cp = camera.position;
  const pa = dropPosAttr.array, ia = dropInfoAttr.array;
  for (let i = 0; i < DROPS; i++) {
    const i3 = i * 3, i2 = i * 2;
    if (dropLife[i] >= dropMax[i]) { ia[i2] = 0; ia[i2 + 1] = 0; pa[i3] = 0; pa[i3 + 1] = 0; pa[i3 + 2] = 0; continue; }
    dropVel[i3 + 1] -= 9.81 * dt;
    dropPos[i3] += dropVel[i3] * dt;
    dropPos[i3 + 1] += dropVel[i3 + 1] * dt;
    dropPos[i3 + 2] += dropVel[i3 + 2] * dt;
    dropLife[i] += dt;
    const x = Math.min(dropLife[i] / dropMax[i], 1);
    pa[i3] = dropPos[i3] - cp.x;
    pa[i3 + 1] = dropPos[i3 + 1] - cp.y;
    pa[i3 + 2] = dropPos[i3 + 2] - cp.z;
    ia[i2] = Math.sqrt(Math.max(Math.sin(x * Math.PI), 0));
    ia[i2 + 1] = dropSize[i];
  }
  drops.position.copy(cp);
  dropPosAttr.needsUpdate = true;
  dropInfoAttr.needsUpdate = true;
  dropMat.uniforms.uColor.value.copy(G.uFogColor.value).multiplyScalar(1.2).addScalar(0.04);
}

// ============================================================
// Ride & Camera State
// ============================================================
let sCam = 2;
let speed = PARAMS.animation.speed;
let flowOff = 0;
let simTime = 0;
let camBank = 0;
const SA = makeSample(), SB = makeSample(), SC = makeSample();
const _radial = new THREE.Vector3(), _eye = new THREE.Vector3(), _target = new THREE.Vector3();
const _up = new THREE.Vector3(), _tmp = new THREE.Vector3(), _dir = new THREE.Vector3(), _right = new THREE.Vector3();

// Persistent Camera & Interaction Offsets
const cameraState = {
  userZoom: 1.0,
  userYaw: 0.0,
  userPitch: 0.0,
  panX: 0.0,
  panY: 0.0,
  staticCamPos: new THREE.Vector3(),
  staticTarget: new THREE.Vector3(),
  staticSetupDone: false
};

function resetTrack() {
  for (const ch of chunks) disposeChunk(ch);
  chunks.length = 0;
  const seed = Math.max(1, Math.floor(PARAMS.geometry.seed));
  genReset(seed);
  styleRng = mulberry32(seed * 31 + 5);
  prevStyleKey = null;
  lastSample = null;
  nextCtrl = 1;
  sCam = 2;
  speed = PARAMS.animation.speed;
  flowOff = 0;
  camBank = 0;
  cameraState.staticSetupDone = false;
  buildChunk();
  while (chunks[chunks.length - 1].endS < sCam + AHEAD) buildChunk();
  const ch = findChunk(sCam);
  if (!PARAMS.background.greenscreen) {
    G.uFogColor.value.copy(ch.fog);
  }
  killDrops();
}

function maintainChunks() {
  while (chunks[chunks.length - 1].endS < sCam + AHEAD) buildChunk();
  while (chunks.length > 2 && chunks[0].endS < sCam - BEHIND) {
    disposeChunk(chunks.shift());
    trimCtrl();
  }
}

function setupStaticCamera() {
  samplePath(sCam + 14, SC);
  cameraState.staticCamPos.copy(SC.pos).addScaledVector(SC.R, 3.2).addScaledVector(SC.U, 1.9).addScaledVector(SC.T, -2.8);
  cameraState.staticTarget.copy(SC.pos);
  cameraState.staticSetupDone = true;
}

function updateCamera(dt) {
  const P = PARAMS.camera;
  const r = PARAMS.geometry.radius;
  const anim = PARAMS.animation.mode;

  samplePath(sCam, SA);
  const bt = bankOf(SA.k) * 0.92;
  camBank += (bt - camBank) * (1 - Math.exp(-dt * 3.0));

  if (anim === 'Static / Stationary Overlook') {
    if (!cameraState.staticSetupDone) setupStaticCamera();
    _eye.copy(cameraState.staticCamPos);
    _target.copy(cameraState.staticTarget);
    _up.set(0, 1, 0);
  } else if (anim === 'Gentle Orbit') {
    cameraState.staticSetupDone = false;
    const orbitR = 4.0;
    const ang = simTime * 0.25 + cameraState.userYaw;
    const pitch = THREE.MathUtils.clamp(0.35 + cameraState.userPitch, -1.25, 1.25);
    _eye.set(
      SA.pos.x + orbitR * Math.cos(ang) * Math.cos(pitch),
      SA.pos.y + orbitR * Math.sin(pitch) + 0.35,
      SA.pos.z + orbitR * Math.sin(ang) * Math.cos(pitch)
    );
    _target.copy(SA.pos);
    _up.set(0, 1, 0);
  } else if (anim === 'Third-Person Follow Cam') {
    cameraState.staticSetupDone = false;
    samplePath(Math.max(0.5, sCam - 3.2), SB);
    _eye.copy(SB.pos).addScaledVector(SB.U, 0.9).addScaledVector(SB.T, -0.6);
    samplePath(sCam + 3.5, SC);
    _target.copy(SC.pos);
    _up.copy(SA.U);
  } else if (anim === 'Cinematic Drone Flyover') {
    cameraState.staticSetupDone = false;
    samplePath(sCam + 7.0, SB);
    _eye.copy(SA.pos).add(new THREE.Vector3(
      Math.cos(simTime * 0.15) * 4.5,
      5.8 + Math.sin(simTime * 0.2) * 1.2,
      Math.sin(simTime * 0.15) * 4.5
    ));
    _target.copy(SB.pos);
    _up.set(0, 1, 0);
  } else if (anim === 'Spiral Swirl Orbit') {
    cameraState.staticSetupDone = false;
    const ang = simTime * 0.35 + cameraState.userYaw;
    const dist = 3.2;
    _eye.copy(SA.pos)
      .addScaledVector(SA.R, Math.cos(ang) * dist)
      .addScaledVector(SA.U, Math.sin(ang) * dist);
    samplePath(sCam + 3.8, SB);
    _target.copy(SB.pos);
    _up.copy(SA.U);
  } else if (anim === 'Side-by-Side Dolly') {
    cameraState.staticSetupDone = false;
    _eye.copy(SA.pos).addScaledVector(SA.R, 2.5).addScaledVector(SA.U, 0.4);
    samplePath(sCam + 4.5, SB);
    _target.copy(SB.pos);
    _up.copy(SA.U);
  } else if (anim === 'Low Water Skim') {
    cameraState.staticSetupDone = false;
    const b = camBank + Math.sin(simTime * 0.8) * 0.03;
    const eyeH = 0.06 + Math.sin(simTime * 1.4) * 0.015;
    radialDir(SA, b, _radial);
    _eye.copy(SA.pos).addScaledVector(_radial, r - eyeH);
    samplePath(sCam + P.lookAhead, SB);
    radialDir(SB, bankOf(SB.k) * 0.92, _tmp);
    _target.copy(SB.pos).addScaledVector(_tmp, r - eyeH);
    _up.copy(_radial).multiplyScalar(-P.roll).addScaledVector(SA.U, 1 - P.roll).normalize();
  } else {
    // 'First-Person Glide (Default)'
    cameraState.staticSetupDone = false;
    const sw = P.sway;
    const b = camBank + (Math.sin(simTime * 0.53) * 0.05 + Math.sin(simTime * 1.37 + 1.3) * 0.02) * sw;
    const eyeH = Math.min(P.eyeHeight, r * 0.8);
    radialDir(SA, b, _radial);
    _eye.copy(SA.pos).addScaledVector(_radial, r - eyeH);

    samplePath(sCam + P.lookAhead, SB);
    radialDir(SB, bankOf(SB.k) * 0.92, _tmp);
    _target.copy(SB.pos).addScaledVector(_tmp, r - eyeH * 0.85);
    _target.addScaledVector(SB.U, Math.sin(simTime * 0.9) * 0.035 * sw);

    _up.copy(_radial).multiplyScalar(-P.roll).addScaledVector(SA.U, 1 - P.roll).normalize();
  }

  // Adjust camera angle via user drag if not orbit mode (orbit incorporates user yaw/pitch directly)
  if (anim !== 'Gentle Orbit' && anim !== 'Spiral Swirl Orbit') {
    _dir.subVectors(_target, _eye);
    const dist = Math.max(_dir.length(), 0.1);
    _dir.normalize();
    _dir.applyAxisAngle(_up, cameraState.userYaw);
    _right.crossVectors(_dir, _up).normalize();
    _dir.applyAxisAngle(_right, cameraState.userPitch);
    _target.copy(_eye).addScaledVector(_dir, dist);
  }

  // Drag object / screen pan offset across screen
  if (cameraState.panX !== 0 || cameraState.panY !== 0) {
    _dir.subVectors(_target, _eye).normalize();
    _right.crossVectors(_dir, _up).normalize();
    _eye.addScaledVector(_right, cameraState.panX);
    _eye.addScaledVector(_up, cameraState.panY);
    _target.addScaledVector(_right, cameraState.panX);
    _target.addScaledVector(_up, cameraState.panY);
  }

  camera.position.copy(_eye);
  camera.up.copy(_up);
  camera.lookAt(_target);

  // Position point light with rider / camera
  if (pointLight) {
    pointLight.position.copy(_eye);
  }
}

function updateFog(dt) {
  if (PARAMS.background.greenscreen) {
    G.uFogColor.value.set('#00ff00');
    renderer.setClearColor(0x00ff00, 1);
    return;
  }
  const ch = findChunk(sCam);
  if (ch) {
    if (PARAMS.colors.scheme === 'Original') {
      G.uFogColor.value.lerp(ch.fog, 1 - Math.exp(-dt * 1.5));
    } else {
      const schemeDef = COLOR_SCHEMES[PARAMS.colors.scheme];
      if (schemeDef) {
        _col.set(schemeDef.fog);
        G.uFogColor.value.lerp(_col, 1 - Math.exp(-dt * 1.5));
      }
    }
  }
  renderer.setClearColor(G.uFogColor.value, 1);
}

function updateSun() {
  const e = THREE.MathUtils.degToRad(PARAMS.lighting.sunElevation);
  const a = THREE.MathUtils.degToRad(PARAMS.lighting.sunAzimuth);
  const dir = new THREE.Vector3(Math.cos(e) * Math.sin(a), Math.sin(e), Math.cos(e) * Math.cos(a)).normalize();
  G.uSunDir.value.copy(dir);
  if (sunLight) {
    sunLight.position.copy(dir).multiplyScalar(100);
    sunLight.intensity = PARAMS.lighting.sunIntensity;
    sunLight.color.set(PARAMS.lighting.sunColor);
  }
}

function updateAllAmbient() {
  G.uDaylight.value = PARAMS.lighting.daylight;
  for (const ch of chunks) updateChunkAmbient(ch);
}

function updateAllLights() {
  updateSun();
  if (ambientLight) {
    ambientLight.intensity = PARAMS.lighting.ambientIntensity;
    ambientLight.color.set(PARAMS.lighting.ambientColor);
  }
  if (pointLight) {
    pointLight.intensity = PARAMS.lighting.pointIntensity;
    pointLight.color.set(PARAMS.lighting.pointColor);
    pointLight.distance = PARAMS.lighting.pointDistance;
  }
  if (hemiLight) {
    hemiLight.intensity = PARAMS.lighting.hemiIntensity;
    hemiLight.color.set(PARAMS.lighting.hemiSkyColor);
    hemiLight.groundColor.set(PARAMS.lighting.hemiGroundColor);
  }
  renderer.toneMappingExposure = PARAMS.lighting.exposure;
  updateAllAmbient();
}

// ============================================================
// Background & Color Palette Management
// ============================================================
function updateBackground() {
  if (PARAMS.background.greenscreen) {
    document.body.style.background = '#00ff00';
    renderer.setClearColor(0x00ff00, 1);
    G.uFogColor.value.set('#00ff00');
  } else {
    document.body.style.background = PARAMS.background.color;
    _col.set(PARAMS.background.color);
    renderer.setClearColor(_col, 1);
    G.uFogColor.value.set(PARAMS.background.color);
  }
}

function applyColorsToChunks() {
  for (const ch of chunks) {
    if (PARAMS.colors.scheme === 'Original') {
      const def = STYLE_DEFS[ch.styleKey] || STYLE_DEFS.solid;
      const pal = def.palettes[0];
      ch.u.uColA.value.set(pal[0]);
      ch.u.uColB.value.set(pal[1] || pal[0]);
      ch.u.uLed.value.set(pal[2] || pal[1] || pal[0]);
    } else {
      ch.u.uColA.value.set(PARAMS.colors.wallA);
      ch.u.uColB.value.set(PARAMS.colors.wallB);
      ch.u.uLed.value.set(PARAMS.colors.led);
    }
    updateChunkAmbient(ch);
  }
}

function applyColorScheme(name) {
  const scheme = COLOR_SCHEMES[name];
  if (!scheme) return;
  PARAMS.colors.scheme = name;
  PARAMS.colors.wallA = scheme.wallA;
  PARAMS.colors.wallB = scheme.wallB;
  PARAMS.colors.led = scheme.led;
  PARAMS.water.color = scheme.water;
  G.uWaterColor.value.set(scheme.water);

  if (!PARAMS.background.greenscreen) {
    PARAMS.background.color = scheme.bg;
    updateBackground();
  }

  if (scheme.lightSun) {
    PARAMS.lighting.sunColor = scheme.lightSun;
    if (sunLight) sunLight.color.set(scheme.lightSun);
  }
  if (scheme.lightPoint) {
    PARAMS.lighting.pointColor = scheme.lightPoint;
    if (pointLight) pointLight.color.set(scheme.lightPoint);
  }

  applyColorsToChunks();
  updateAllGuiControllers();
}

// ============================================================
// Procedural Theme / Geometry Randomizer (Click-to-Randomize)
// ============================================================
function randomizeScene() {
  const schemeKeys = Object.keys(COLOR_SCHEMES);
  const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
  applyColorScheme(randomScheme);

  PARAMS.geometry.seed = 1 + Math.floor(Math.random() * 9998);
  PARAMS.geometry.radius = +(0.58 + Math.random() * 0.42).toFixed(2);
  PARAMS.geometry.turns = +(0.5 + Math.random() * 1.1).toFixed(2);
  PARAMS.geometry.helixChance = +(0.1 + Math.random() * 0.6).toFixed(2);
  PARAMS.geometry.sectionLength = Math.round(30 + Math.random() * 80);
  G.uRadius.value = PARAMS.geometry.radius;

  PARAMS.animation.speed = +(4.5 + Math.random() * 7.5).toFixed(1);
  PARAMS.animation.flow = +(1.1 + Math.random() * 0.9).toFixed(2);
  PARAMS.animation.banking = +(0.6 + Math.random() * 0.9).toFixed(2);

  PARAMS.water.width = +(0.65 + Math.random() * 0.5).toFixed(2);
  PARAMS.water.depthTint = +(0.5 + Math.random() * 1.5).toFixed(2);
  PARAMS.water.refraction = +(0.6 + Math.random() * 1.4).toFixed(2);
  PARAMS.water.foam = +(0.15 + Math.random() * 0.6).toFixed(2);
  PARAMS.water.waves = +(0.5 + Math.random() * 1.5).toFixed(2);
  G.uWaterHalf.value = PARAMS.water.width;
  G.uDepthTint.value = PARAMS.water.depthTint;
  G.uRefract.value = PARAMS.water.refraction;
  G.uFoam.value = PARAMS.water.foam;
  G.uWaves.value = PARAMS.water.waves;

  PARAMS.lighting.sunElevation = Math.round(15 + Math.random() * 65);
  PARAMS.lighting.sunAzimuth = Math.round(Math.random() * 360);
  PARAMS.lighting.daylight = +(0.75 + Math.random() * 0.75).toFixed(2);
  PARAMS.post.bloomStrength = +(0.2 + Math.random() * 0.7).toFixed(2);
  bloomPass.strength = PARAMS.post.bloomStrength;

  updateAllLights();
  resetTrack();
  updateAllGuiControllers();
}

// ============================================================
// Resize / DPR / Antialiasing
// ============================================================
function updatePointScale() {
  dropMat.uniforms.uScale.value = renderer.domElement.height / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) * 0.5));
  G.uProjScale.value.set(camera.projectionMatrix.elements[0], camera.projectionMatrix.elements[5]);
}

function resizeRefraction() {
  renderer.getDrawingBufferSize(_bufSize);
  G.uScreen.value.copy(_bufSize);
  const k = PARAMS.performance.refractionScale;
  refrTarget.setSize(Math.max(1, Math.floor(_bufSize.x * k)), Math.max(1, Math.floor(_bufSize.y * k)));
}

function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setSize(w, h);
  resizeRefraction();
  updatePointScale();
}

function setDPR(d) {
  currentDPR = THREE.MathUtils.clamp(d, 0.5, 3.0);
  PARAMS.performance.dpr = currentDPR;
  renderer.setPixelRatio(currentDPR);
  composer.setPixelRatio(currentDPR);
  onResize();
}

function updateAntialias(enabled) {
  PARAMS.performance.antialias = enabled;
  composerTarget.samples = enabled ? 4 : 0;
  composer.renderTarget1.samples = enabled ? 4 : 0;
  composer.renderTarget2.samples = enabled ? 4 : 0;
  onResize();
}

function renderRefraction() {
  camera.layers.set(0);
  renderer.setRenderTarget(refrTarget);
  renderer.clear();
  renderer.render(scene, camera);
  renderer.setRenderTarget(null);
  camera.layers.enable(LAYER_WATER);
}
window.addEventListener('resize', onResize);

// ============================================================
// Interactive Controls (Wheel Zoom & Drag Across Screen)
// ============================================================
let isPointerDown = false;
let startX = 0, startY = 0;
let lastX = 0, lastY = 0;
let dragDist = 0;
let pointerButton = 0;

window.addEventListener('wheel', (e) => {
  e.preventDefault();
  const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
  cameraState.userZoom = THREE.MathUtils.clamp(cameraState.userZoom * zoomFactor, 0.2, 5.0);
  PARAMS.interaction.userZoom = cameraState.userZoom;
  camera.zoom = cameraState.userZoom;
  camera.updateProjectionMatrix();
  updatePointScale();
  updateAllGuiControllers();
}, { passive: false });

window.addEventListener('pointerdown', (e) => {
  if (e.target.closest && e.target.closest('.lil-gui')) return;
  isPointerDown = true;
  pointerButton = e.button;
  startX = e.clientX;
  startY = e.clientY;
  lastX = e.clientX;
  lastY = e.clientY;
  dragDist = 0;
});

window.addEventListener('pointermove', (e) => {
  if (!isPointerDown) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  dragDist += Math.hypot(dx, dy);
  lastX = e.clientX;
  lastY = e.clientY;

  const isPan = (pointerButton === 2 || pointerButton === 1 || e.shiftKey || PARAMS.interaction.dragMode === 'pan');
  if (isPan) {
    const panSpeed = 0.0035 / cameraState.userZoom;
    cameraState.panX -= dx * panSpeed;
    cameraState.panY += dy * panSpeed;
    PARAMS.interaction.panX = cameraState.panX;
    PARAMS.interaction.panY = cameraState.panY;
  } else {
    const rotSpeed = 0.005;
    cameraState.userYaw -= dx * rotSpeed;
    cameraState.userPitch = THREE.MathUtils.clamp(cameraState.userPitch - dy * rotSpeed, -Math.PI * 0.42, Math.PI * 0.42);
  }
});

window.addEventListener('pointerup', (e) => {
  if (!isPointerDown) return;
  isPointerDown = false;
  if (dragDist < 6 && pointerButton === 0 && PARAMS.interaction.clickRandomize) {
    randomizeScene();
  }
});

window.addEventListener('contextmenu', (e) => {
  if (!e.target.closest('.lil-gui')) e.preventDefault();
});

// UI Hide/Show toggle with 'H' key
window.addEventListener('keydown', (e) => {
  if (e.key === 'h' || e.key === 'H') {
    if (gui.domElement.style.display === 'none') {
      gui.domElement.style.display = '';
      gui.show();
    } else {
      gui.domElement.style.display = 'none';
      gui.hide();
    }
  }
});

// Initialization & Animation Loop
// ============================================================

const clock = new THREE.Clock();
document.addEventListener('visibilitychange', () => { if (!document.hidden) clock.getDelta(); });

let frameAvg = 1 / 60, fpsTimer = 0, fpsFrames = 0;

renderer.setAnimationLoop(() => {
  const rawDt = clock.getDelta();
  const dt = Math.min(rawDt, 0.05);
  const running = !PARAMS.animation.paused;

  fpsTimer += rawDt; fpsFrames++;
  if (fpsTimer >= 0.5) {
    PARAMS.performance.fps = Math.round(fpsFrames / fpsTimer);
    fpsTimer = 0; fpsFrames++;
  }

  if (running) {
    simTime += dt;
    const anim = PARAMS.animation.mode;
    if (anim !== 'Static / Stationary Overlook') {
      samplePath(sCam, SA);
      const slope = SA.T.y;
      const target = PARAMS.animation.speed * PARAMS.animation.speedMultiplier * (1 + THREE.MathUtils.clamp((-slope - 0.07) * 2.5, -0.3, 0.6));
      speed += (target - speed) * (1 - Math.exp(-dt * 0.8));
      sCam += speed * dt;
    }
    flowOff += PARAMS.animation.speed * PARAMS.animation.speedMultiplier * PARAMS.animation.flow * dt;
  }
  maintainChunks();

  G.uTime.value = simTime;
  G.uFlowOff.value = flowOff;
  const vw = speed * PARAMS.animation.flow * PARAMS.animation.speedMultiplier;
  G.uBankGain.value = PARAMS.animation.banking * vw * vw / 9.81;

  updateCamera(dt);
  updateFog(dt);
  updateDrops(running ? dt : 0);
  renderRefraction();
  composer.render();
});
