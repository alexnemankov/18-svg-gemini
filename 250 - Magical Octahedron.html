<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Magical Octahedron</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #000000;
        }

        body {
            overscroll-behavior: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: grab;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        canvas.is-dragging {
            cursor: grabbing;
        }

        .lil-gui.root {
            --width: 310px;
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
            "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
        }
    }
    </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import GUI from 'lil-gui';

// ============================================================
// Color Schemes & Animation Presets
// ============================================================

const colorSchemes = {
    'Frost Crystal': {
        fractalTint: '#ffffff',
        frontEdge: '#b8e6ff',
        backEdge: '#a8d1ff',
        background: '#000000'
    },
    'Cyber Astral': {
        fractalTint: '#ff007f',
        frontEdge: '#00f0ff',
        backEdge: '#7928ca',
        background: '#05050d'
    },
    'Solar Flare': {
        fractalTint: '#ffaa00',
        frontEdge: '#ffe066',
        backEdge: '#ff3300',
        background: '#0d0402'
    },
    'Ethereal Emerald': {
        fractalTint: '#00ffaa',
        frontEdge: '#64ffda',
        backEdge: '#008855',
        background: '#020c08'
    },
    'Quantum Void': {
        fractalTint: '#b388ff',
        frontEdge: '#ffffff',
        backEdge: '#512da8',
        background: '#000000'
    }
};

const animationPresets = [
    'Cosmic Orbit',
    'Hypnotic Infinity',
    'Dimensional Drift',
    'Quantum Pulsar',
    'Static Zen'
];

// ============================================================
// Main scene parameters
// ============================================================

const params = {
    colorScheme: 'Frost Crystal',
    animationPreset: 'Cosmic Orbit',
    randomizeOnClick: true,
    greenScreen: false,
    geometry: {
        radius: 2.06,
        height: 1.16
    },
    camera: {
        distance: 4.7,
        fov: 1.45
    },
    animation: {
        speed: 1.0,
        rotationSpeed: 0.18,
        colorSpeed: 0.24
    },
    fractal: {
        domainScale: 67.1,
        pathScale: 0.048,
        glowDensity: 7.9,
        volumeOpacity: 0.72,
        orbBoost: 25.2,
        edgeGlow: 3.025,
        backEdgeGlow: 0.38,
        volumeSteps: 68
    },
    colors: {
        fractalTint: '#ffffff',
        frontEdge: '#b8e6ff',
        backEdge: '#a8d1ff',
        background: '#000000'
    },
    interaction: {
        dragMode: 'Rotate',
        dragSensitivity: 0.0045,
        panSensitivity: 0.003,
        zoomSensitivity: 0.0015,
        inertia: 0.94,
        panX: 0.0,
        panY: 0.0
    },
    performance: {
        dpr: Math.min(window.devicePixelRatio || 1, 2)
    }
};

// ============================================================
// Renderer and fullscreen scene
// ============================================================

const renderer = new THREE.WebGLRenderer({
    antialias: false,
    alpha: false,
    powerPreference: 'high-performance'
});

renderer.setPixelRatio(params.performance.dpr);
renderer.setSize(window.innerWidth, window.innerHeight, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.domElement.setAttribute('aria-label', 'Interactive light fractal octahedron');
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const drawingBufferSize = new THREE.Vector2();

function hexToRawColor(hex, target) {
    const value = Number.parseInt(hex.replace('#', ''), 16);
    target.setRGB(
        ((value >> 16) & 255) / 255,
        ((value >> 8) & 255) / 255,
        (value & 255) / 255,
        THREE.LinearSRGBColorSpace
    );
}

const frontEdgeColor = new THREE.Color();
const backEdgeColor = new THREE.Color();
const backgroundColor = new THREE.Color();
const fractalTintColor = new THREE.Color();

function updateColorUniforms() {
    hexToRawColor(params.colors.fractalTint, fractalTintColor);
    hexToRawColor(params.colors.frontEdge, frontEdgeColor);
    hexToRawColor(params.colors.backEdge, backEdgeColor);
    if (params.greenScreen) {
        hexToRawColor('#00ff00', backgroundColor);
    } else {
        hexToRawColor(params.colors.background, backgroundColor);
    }
}

updateColorUniforms();

const uniforms = {
    uTime: { value: 0 },
    uResolution: { value: new THREE.Vector2(1, 1) },
    uPan: { value: new THREE.Vector2(0, 0) },

    uOctahedronRadius: { value: params.geometry.radius },
    uOctahedronHeight: { value: params.geometry.height },

    uCameraDistance: { value: params.camera.distance },
    uCameraFov: { value: params.camera.fov },
    uInteractionScale: { value: 1.0 },

    uDomainScale: { value: params.fractal.domainScale },
    uPathScale: { value: params.fractal.pathScale },

    uColorSpeed: { value: params.animation.colorSpeed },
    uManualRotation: { value: new THREE.Vector2(0, 0) },

    uGlowDensity: { value: params.fractal.glowDensity },
    uVolumeOpacity: { value: params.fractal.volumeOpacity },
    uOrbBoost: { value: params.fractal.orbBoost },
    uEdgeGlow: { value: params.fractal.edgeGlow },
    uBackEdgeGlow: { value: params.fractal.backEdgeGlow },
    uVolumeSteps: { value: params.fractal.volumeSteps },

    uFractalTint: { value: fractalTintColor },
    uFrontEdgeColor: { value: frontEdgeColor },
    uBackEdgeColor: { value: backEdgeColor },
    uBackgroundColor: { value: backgroundColor }
};

const vertexShader = /* glsl */ `
void main() {
    gl_Position = vec4(position.xy, 0.0, 1.0);
}
`;

const fragmentShader = /* glsl */ `
precision highp float;
precision highp int;

uniform float uTime;
uniform vec2 uResolution;
uniform vec2 uPan;

uniform float uOctahedronRadius;
uniform float uOctahedronHeight;

uniform float uCameraDistance;
uniform float uCameraFov;
uniform float uInteractionScale;

uniform float uDomainScale;
uniform float uPathScale;

uniform float uColorSpeed;
uniform vec2 uManualRotation;

uniform float uGlowDensity;
uniform float uVolumeOpacity;
uniform float uOrbBoost;
uniform float uEdgeGlow;
uniform float uBackEdgeGlow;
uniform int uVolumeSteps;

uniform vec3 uFractalTint;
uniform vec3 uFrontEdgeColor;
uniform vec3 uBackEdgeColor;
uniform vec3 uBackgroundColor;

const int MAX_VOLUME_STEPS = 128;

float saturate(float x) {
    return clamp(x, 0.0, 1.0);
}

mat2 rot(float a) {
    float s = sin(a);
    float c = cos(a);

    return mat2(
         c, -s,
         s,  c
    );
}

vec3 getPathPosition(float z) {
    return vec3(
        12.0 * cos(z * vec2(0.1, 0.39)),
        z
    );
}

bool clipPlane(
    vec3 n,
    vec3 ro,
    vec3 rd,
    float radius,
    inout float tMin,
    inout float tMax
) {
    float denom = dot(n, rd);
    float numer = radius - dot(n, ro);

    if (abs(denom) < 1e-5) {
        return numer >= 0.0;
    }

    float t = numer / denom;

    if (denom < 0.0) {
        tMin = max(tMin, t);
    } else {
        tMax = min(tMax, t);
    }

    return tMin <= tMax;
}

vec2 rayOctahedron(vec3 ro, vec3 rd, float radius) {
    vec3 localRo = vec3(
        ro.x,
        ro.y / uOctahedronHeight,
        ro.z
    );

    vec3 localRd = vec3(
        rd.x,
        rd.y / uOctahedronHeight,
        rd.z
    );

    float tMin = -1e9;
    float tMax = 1e9;

    if (!clipPlane(vec3( 1.0,  1.0,  1.0), localRo, localRd, radius, tMin, tMax)) return vec2(-1.0);
    if (!clipPlane(vec3( 1.0,  1.0, -1.0), localRo, localRd, radius, tMin, tMax)) return vec2(-1.0);
    if (!clipPlane(vec3( 1.0, -1.0,  1.0), localRo, localRd, radius, tMin, tMax)) return vec2(-1.0);
    if (!clipPlane(vec3( 1.0, -1.0, -1.0), localRo, localRd, radius, tMin, tMax)) return vec2(-1.0);

    if (!clipPlane(vec3(-1.0,  1.0,  1.0), localRo, localRd, radius, tMin, tMax)) return vec2(-1.0);
    if (!clipPlane(vec3(-1.0,  1.0, -1.0), localRo, localRd, radius, tMin, tMax)) return vec2(-1.0);
    if (!clipPlane(vec3(-1.0, -1.0,  1.0), localRo, localRd, radius, tMin, tMax)) return vec2(-1.0);
    if (!clipPlane(vec3(-1.0, -1.0, -1.0), localRo, localRd, radius, tMin, tMax)) return vec2(-1.0);

    if (tMax < max(tMin, 0.0)) {
        return vec2(-1.0);
    }

    return vec2(tMin, tMax);
}

float octahedronCoord(vec3 p) {
    return
        abs(p.x) +
        abs(p.y) / uOctahedronHeight +
        abs(p.z);
}

vec3 octahedronNormal(vec3 p) {
    vec3 localNormal = vec3(
        p.x < 0.0 ? -1.0 : 1.0,
        p.y < 0.0 ? -1.0 : 1.0,
        p.z < 0.0 ? -1.0 : 1.0
    );

    vec3 worldNormal = vec3(
        localNormal.x,
        localNormal.y / uOctahedronHeight,
        localNormal.z
    );

    return normalize(worldNormal);
}

void sampleLayer(
    vec3 p,
    float animTime,
    float phase,
    out float tunnelGlow,
    out float orbGlow
) {
    vec3 q = p * uDomainScale;

    float domainZ =
        q.z * 0.16 +
        animTime +
        phase;

    vec3 rawPath = getPathPosition(domainZ);

    vec3 pathCenter = vec3(
        uPathScale * rawPath.x,
        uPathScale * rawPath.y,
        p.z + 0.06 * sin(domainZ * 0.07 + phase)
    );

    float baseRadius =
        0.26 +
        0.14 * cos(domainZ * 0.72 + phase);

    float tunnelStructure = min(
        length(
            p.xy -
            pathCenter.xy -
            vec2(0.14, 0.0)
        ),
        length((p - pathCenter).xy)
    );

    float largeScoops =
        abs(
            dot(
                sin(0.8 * q + phase),
                vec3(0.52)
            )
        ) / 0.1;

    float detailTexture =
        abs(
            dot(
                sin(animTime + 16.0 * p + phase),
                vec3(0.53)
            )
        ) / 3.7;

    float tunnelDist =
        baseRadius
        - tunnelStructure
        + 0.016 * largeScoops
        - 0.175 * detailTexture;

    tunnelGlow =
        6.7 /
        (0.085 + abs(tunnelDist));

    float wave = sin(uTime * 0.7 + phase);

    vec3 orbCenter = vec3(
        pathCenter.x +
        0.07 * wave,

        pathCenter.y +
        0.11 * sin(
            uTime * 0.9 +
            phase * 1.3
        ),

        0.42 * sin(
            animTime * 0.32 +
            1.6 +
            phase
        )
    );

    float orbDist =
        length(p - orbCenter) -
        0.022;

    orbGlow =
        -0.9 /
        (0.43 + max(orbDist, 0.0));
}

void sampleFractal(
    vec3 p,
    float animTime,
    float colorTime,
    float stepIndex,
    out vec3 emission,
    out float density
) {
    float tunnelA;
    float tunnelB;
    float tunnelC;

    float orbA;
    float orbB;
    float orbC;

    sampleLayer(
        p,
        animTime,
        0.0,
        tunnelA,
        orbA
    );

    sampleLayer(
        p.yzx,
        animTime,
        2.1,
        tunnelB,
        orbB
    );

    sampleLayer(
        p.zxy,
        animTime,
        4.2,
        tunnelC,
        orbC
    );

    float tunnelSum =
        0.40 * tunnelA +
        0.33 * tunnelB +
        0.27 * tunnelC;

    float orbSum =
        0.40 * orbA +
        0.34 * orbB +
        0.26 * orbC;

    vec3 q = p * uDomainScale;

    float globalDetail =
        abs(
            dot(
                sin(
                    q * 0.11 +
                    q.yzx * 0.07 +
                    q.zxy * 0.05 +
                    animTime
                ),
                vec3(0.3333)
            )
        ) / 0.3333;

    float colorDetail =
        abs(
            dot(
                sin(
                    q * 0.11 +
                    q.yzx * 0.07 +
                    q.zxy * 0.05 +
                    colorTime
                ),
                vec3(0.3333)
            )
        ) / 0.3333;

    float octCoord = octahedronCoord(p);

    float edgeFill =
        1.0 -
        smoothstep(
            uOctahedronRadius * 0.965,
            uOctahedronRadius,
            octCoord
        );

    float core =
        saturate(
            1.0 -
            octCoord /
            uOctahedronRadius
        );

    float volumeFill =
        0.40 +
        0.60 * pow(
            max(core, 0.0),
            0.45
        );

    float baseFill =
        0.75 +
        0.55 * globalDetail;

    density =
        (
            0.060 * baseFill +
            0.085 * tunnelSum +
            0.100 * orbSum
        ) *
        volumeFill *
        edgeFill;

    density = max(density, 0.0);

    vec3 palette =
        1.0 +
        cos(
            stepIndex * 0.7 +
            colorDetail * 1.4 +
            vec3(6.0, 1.0, 2.0)
        );

    emission =
        palette *
        uFractalTint *
        (
            0.20 * baseFill +
            0.28 * tunnelSum +
            uOrbBoost * 0.085 * orbSum
        ) *
        volumeFill *
        edgeFill;
}

vec3 renderVolume(vec3 ro, vec3 rd, vec2 hit) {
    float animTime =
        uTime * 4.0 +
        5.0 +
        5.0 * sin(uTime * 0.3);

    float colorTime =
        uTime * uColorSpeed +
        5.0;

    float tNear = max(hit.x, 0.0);
    float tFar = hit.y;

    float rayLength =
        max(
            tFar - tNear,
            0.0001
        );

    float stepSize =
        rayLength /
        float(max(uVolumeSteps, 1));

    float t =
        tNear +
        stepSize * 0.5;

    vec3 color = vec3(0.0);
    float transmittance = 1.0;

    for (int i = 0; i < MAX_VOLUME_STEPS; i++) {
        if (
            i >= uVolumeSteps ||
            t > tFar ||
            transmittance < 0.005
        ) {
            break;
        }

        vec3 p = ro + rd * t;

        vec3 emission;
        float density;

        float stepIndex =
            float(i) +
            43.0;

        sampleFractal(
            p,
            animTime,
            colorTime,
            stepIndex,
            emission,
            density
        );

        float opticalDepth =
            density *
            uGlowDensity *
            uVolumeOpacity *
            stepSize;

        float alpha =
            1.0 -
            exp(
                -max(
                    opticalDepth,
                    0.0
                )
            );

        color +=
            transmittance *
            emission *
            alpha;

        transmittance *=
            1.0 - alpha;

        t += stepSize;
    }

    vec3 frontPos =
        ro +
        rd * tNear;

    vec3 frontNormal =
        octahedronNormal(frontPos);

    float frontFresnel =
        pow(
            1.0 -
            saturate(
                dot(
                    frontNormal,
                    -rd
                )
            ),
            4.0
        );

    color +=
        uEdgeGlow *
        frontFresnel *
        uFrontEdgeColor;

    vec3 backPos =
        ro +
        rd * tFar;

    vec3 backNormal =
        octahedronNormal(backPos);

    float backFresnel =
        pow(
            1.0 -
            saturate(
                dot(
                    backNormal,
                    rd
                )
            ),
            3.0
        );

    color +=
        transmittance *
        uBackEdgeGlow *
        backFresnel *
        uBackEdgeColor;

    return color;
}

void main() {
    vec2 uv =
        (
            2.0 * gl_FragCoord.xy -
            uResolution.xy
        ) /
        uResolution.y;

    uv -= uPan;

    float safeScale = max(uInteractionScale, 0.05);

    vec3 rayOrigin =
        vec3(
            0.0,
            -0.9,
            uCameraDistance
        ) /
        safeScale;

    vec3 lookTarget = vec3(0.0);

    vec3 forward =
        normalize(
            lookTarget -
            rayOrigin
        );

    vec3 right =
        normalize(
            cross(
                forward,
                vec3(0.0, 1.0, 0.0)
            )
        );

    vec3 up =
        cross(
            right,
            forward
        );

    vec3 rayDir =
        normalize(
            forward * uCameraFov +
            uv.x * right +
            uv.y * up
        );

    float yaw = uManualRotation.x;
    float pitch = uManualRotation.y;

    // Apply pitch before yaw so vertical drag stays consistent
    // at every horizontal orientation.
    rayOrigin.yz *= rot(-pitch);
    rayDir.yz *= rot(-pitch);

    rayOrigin.xz *= rot(-yaw);
    rayDir.xz *= rot(-yaw);

    vec2 hit =
        rayOctahedron(
            rayOrigin,
            rayDir,
            uOctahedronRadius
        );

    if (hit.y <= 0.0) {
        gl_FragColor = vec4(uBackgroundColor, 1.0);
        return;
    }

    vec3 color =
        renderVolume(
            rayOrigin,
            rayDir,
            hit
        );

    color =
        tanh(
            color *
            color *
            0.05
        );

    color =
        pow(
            max(
                color,
                vec3(0.0)
            ),
            vec3(0.4545)
        );

    gl_FragColor = vec4(color, 1.0);
}
`;

const material = new THREE.ShaderMaterial({
    uniforms,
    vertexShader,
    fragmentShader,
    depthTest: false,
    depthWrite: false,
    transparent: false
});

const geometry = new THREE.PlaneGeometry(2, 2);
const fullscreenQuad = new THREE.Mesh(geometry, material);
fullscreenQuad.frustumCulled = false;
scene.add(fullscreenQuad);

// ============================================================
// Interaction: drag rotation, panning, zoom, pinch scaling
// ============================================================

const canvas = renderer.domElement;
const pointers = new Map();

const interactionState = {
    yaw: 0,
    pitch: 0,
    velocityX: 0,
    velocityY: 0,
    dragging: false,
    pinching: false,
    lastX: 0,
    lastY: 0,
    lastMoveTime: performance.now(),
    pinchStartDistance: 0,
    pinchStartScale: 1,
    scale: 1.0
};

let pointerDownPos = { x: 0, y: 0 };
let pointerDownTime = 0;
let isPanning = false;

function getPointerDistance() {
    const values = Array.from(pointers.values());
    if (values.length < 2) return 0;

    const dx = values[1].x - values[0].x;
    const dy = values[1].y - values[0].y;
    return Math.hypot(dx, dy);
}

function beginPinch() {
    interactionState.pinching = true;
    interactionState.dragging = false;
    interactionState.velocityX = 0;
    interactionState.velocityY = 0;
    interactionState.pinchStartDistance = Math.max(getPointerDistance(), 1);
    interactionState.pinchStartScale = interactionState.scale;
    canvas.classList.add('is-dragging');
}

function handlePointerDown(event) {
    if (event.target !== canvas) return;

    try {
        canvas.setPointerCapture(event.pointerId);
    } catch (e) {}

    pointers.set(event.pointerId, {
        x: event.clientX,
        y: event.clientY
    });

    pointerDownPos = { x: event.clientX, y: event.clientY };
    pointerDownTime = performance.now();

    isPanning = (
        params.interaction.dragMode === 'Pan' ||
        event.button === 2 ||
        event.button === 1 ||
        event.shiftKey
    );

    if (pointers.size === 1) {
        interactionState.dragging = true;
        interactionState.pinching = false;
        interactionState.lastX = event.clientX;
        interactionState.lastY = event.clientY;
        interactionState.lastMoveTime = performance.now();
        interactionState.velocityX = 0;
        interactionState.velocityY = 0;
        canvas.classList.add('is-dragging');
    } else if (pointers.size === 2) {
        beginPinch();
    }
}

function handlePointerMove(event) {
    if (!pointers.has(event.pointerId)) return;

    pointers.set(event.pointerId, {
        x: event.clientX,
        y: event.clientY
    });

    if (pointers.size >= 2) {
        if (!interactionState.pinching) beginPinch();

        const currentDistance = Math.max(getPointerDistance(), 1);
        const ratio = currentDistance / interactionState.pinchStartDistance;

        interactionState.scale = THREE.MathUtils.clamp(
            interactionState.pinchStartScale * ratio,
            0.2,
            5.0
        );

        uniforms.uInteractionScale.value = interactionState.scale;
        return;
    }

    if (!interactionState.dragging) return;

    const now = performance.now();
    const dt = Math.max((now - interactionState.lastMoveTime) * 0.001, 1 / 240);
    const dx = event.clientX - interactionState.lastX;
    const dy = event.clientY - interactionState.lastY;

    if (isPanning) {
        const panSensitivity = params.interaction.panSensitivity / Math.max(interactionState.scale, 0.1);
        params.interaction.panX += dx * panSensitivity;
        params.interaction.panY -= dy * panSensitivity;
        uniforms.uPan.value.set(params.interaction.panX, params.interaction.panY);
    } else {
        const sensitivity = params.interaction.dragSensitivity;
        interactionState.yaw -= dx * sensitivity;
        interactionState.pitch += dy * sensitivity;

        interactionState.velocityX = -dx * sensitivity / dt;
        interactionState.velocityY = dy * sensitivity / dt;
    }

    interactionState.lastX = event.clientX;
    interactionState.lastY = event.clientY;
    interactionState.lastMoveTime = now;
}

function handlePointerEnd(event) {
    if (pointers.has(event.pointerId)) {
        pointers.delete(event.pointerId);
    }

    if (canvas.hasPointerCapture(event.pointerId)) {
        try {
            canvas.releasePointerCapture(event.pointerId);
        } catch (e) {}
    }

    const moveDist = Math.hypot(event.clientX - pointerDownPos.x, event.clientY - pointerDownPos.y);
    const duration = performance.now() - pointerDownTime;

    if (moveDist < 6 && duration < 300 && pointers.size === 0) {
        if (params.randomizeOnClick) {
            randomizeScene();
        }
    }

    if (pointers.size === 1) {
        const remaining = pointers.values().next().value;
        interactionState.pinching = false;
        interactionState.dragging = true;
        interactionState.lastX = remaining.x;
        interactionState.lastY = remaining.y;
        interactionState.lastMoveTime = performance.now();
        interactionState.velocityX = 0;
        interactionState.velocityY = 0;
    } else if (pointers.size === 0) {
        interactionState.pinching = false;
        interactionState.dragging = false;
        canvas.classList.remove('is-dragging');
    }
}

function handleWheel(event) {
    event.preventDefault();
    const zoomFactor = Math.exp(-event.deltaY * params.interaction.zoomSensitivity);
    interactionState.scale = THREE.MathUtils.clamp(
        interactionState.scale * zoomFactor,
        0.2,
        5.0
    );
    uniforms.uInteractionScale.value = interactionState.scale;
}

canvas.addEventListener('pointerdown', handlePointerDown, { passive: true });
canvas.addEventListener('pointermove', handlePointerMove, { passive: true });
canvas.addEventListener('pointerup', handlePointerEnd, { passive: true });
canvas.addEventListener('pointercancel', handlePointerEnd, { passive: true });
canvas.addEventListener('wheel', handleWheel, { passive: false });
canvas.addEventListener('contextmenu', (e) => e.preventDefault());

function applyColorScheme(name) {
    const scheme = colorSchemes[name];
    if (!scheme) return;
    params.colors.fractalTint = scheme.fractalTint;
    params.colors.frontEdge = scheme.frontEdge;
    params.colors.backEdge = scheme.backEdge;
    if (!params.greenScreen) {
        params.colors.background = scheme.background;
    }
    updateColorUniforms();
    gui.controllersRecursive().forEach(c => c.updateDisplay());
}

function randomizeScene() {
    const hue1 = Math.random();
    const hue2 = (hue1 + 0.35 + Math.random() * 0.3) % 1.0;
    const colA = new THREE.Color().setHSL(hue1, 0.85 + Math.random() * 0.15, 0.55 + Math.random() * 0.25);
    const colB = new THREE.Color().setHSL(hue2, 0.9 + Math.random() * 0.1, 0.65 + Math.random() * 0.2);
    const colC = new THREE.Color().setHSL((hue1 + 0.55) % 1.0, 0.75, 0.45);

    params.colors.fractalTint = '#' + colA.getHexString();
    params.colors.frontEdge = '#' + colB.getHexString();
    params.colors.backEdge = '#' + colC.getHexString();
    if (!params.greenScreen) {
        const bgCol = new THREE.Color().setHSL(hue1, 0.6, 0.015 + Math.random() * 0.035);
        params.colors.background = '#' + bgCol.getHexString();
    }

    params.geometry.radius = +(1.5 + Math.random() * 1.4).toFixed(2);
    params.geometry.height = +(0.8 + Math.random() * 0.9).toFixed(2);
    uniforms.uOctahedronRadius.value = params.geometry.radius;
    uniforms.uOctahedronHeight.value = params.geometry.height;

    params.fractal.domainScale = +(35.0 + Math.random() * 65.0).toFixed(1);
    params.fractal.pathScale = +(0.025 + Math.random() * 0.065).toFixed(3);
    params.fractal.glowDensity = +(5.0 + Math.random() * 9.0).toFixed(2);
    params.fractal.volumeOpacity = +(0.45 + Math.random() * 0.5).toFixed(2);
    params.fractal.orbBoost = +(12.0 + Math.random() * 32.0).toFixed(1);
    params.fractal.edgeGlow = +(1.8 + Math.random() * 4.0).toFixed(2);
    params.fractal.backEdgeGlow = +(0.18 + Math.random() * 0.55).toFixed(2);

    uniforms.uDomainScale.value = params.fractal.domainScale;
    uniforms.uPathScale.value = params.fractal.pathScale;
    uniforms.uGlowDensity.value = params.fractal.glowDensity;
    uniforms.uVolumeOpacity.value = params.fractal.volumeOpacity;
    uniforms.uOrbBoost.value = params.fractal.orbBoost;
    uniforms.uEdgeGlow.value = params.fractal.edgeGlow;
    uniforms.uBackEdgeGlow.value = params.fractal.backEdgeGlow;

    params.animation.speed = +(0.6 + Math.random() * 0.9).toFixed(2);
    params.animation.rotationSpeed = +((Math.random() - 0.5) * 0.4).toFixed(3);
    params.animation.colorSpeed = +(0.15 + Math.random() * 0.35).toFixed(3);
    uniforms.uColorSpeed.value = params.animation.colorSpeed;

    params.animationPreset = animationPresets[Math.floor(Math.random() * animationPresets.length)];

    updateColorUniforms();
    gui.controllersRecursive().forEach(c => c.updateDisplay());
}

// ============================================================
// Resize and animation
// ============================================================

function resize() {
    const width = window.innerWidth;
    const height = window.innerHeight;

    renderer.setSize(width, height, false);
    renderer.getDrawingBufferSize(drawingBufferSize);
    uniforms.uResolution.value.copy(drawingBufferSize);
}

window.addEventListener('resize', resize, { passive: true });
resize();

let elapsedTime = 0;
let previousTime = performance.now();

function animate(now) {
    requestAnimationFrame(animate);

    if (document.hidden) {
        previousTime = now;
        return;
    }

    const deltaTime = Math.min((now - previousTime) * 0.001, 0.05);
    previousTime = now;
    elapsedTime += deltaTime * params.animation.speed;

    // Compute Preset Motion Trajectories
    let autoYaw = 0;
    let autoPitch = 0;

    switch (params.animationPreset) {
        case 'Cosmic Orbit':
            autoYaw = elapsedTime * params.animation.rotationSpeed;
            autoPitch = Math.sin(elapsedTime * 0.4) * 0.12;
            break;
        case 'Hypnotic Infinity':
            autoYaw = Math.sin(elapsedTime * 0.5) * 0.7;
            autoPitch = Math.sin(elapsedTime * 1.0) * 0.35;
            break;
        case 'Dimensional Drift':
            autoYaw = elapsedTime * params.animation.rotationSpeed * 0.75;
            autoPitch = Math.cos(elapsedTime * 0.35) * 0.45;
            break;
        case 'Quantum Pulsar':
            autoYaw = Math.sin(elapsedTime * 0.2) * 0.25;
            autoPitch = Math.cos(elapsedTime * 0.25) * 0.12;
            break;
        case 'Static Zen':
            autoYaw = 0;
            autoPitch = 0;
            break;
    }

    if (!interactionState.dragging && !interactionState.pinching) {
        interactionState.yaw += interactionState.velocityX * deltaTime;
        interactionState.pitch += interactionState.velocityY * deltaTime;

        const damping = Math.pow(
            params.interaction.inertia,
            deltaTime * 60.0
        );

        interactionState.velocityX *= damping;
        interactionState.velocityY *= damping;

        if (Math.abs(interactionState.velocityX) < 0.00001) {
            interactionState.velocityX = 0;
        }

        if (Math.abs(interactionState.velocityY) < 0.00001) {
            interactionState.velocityY = 0;
        }
    }

    uniforms.uManualRotation.value.set(
        interactionState.yaw + autoYaw,
        interactionState.pitch + autoPitch
    );

    uniforms.uTime.value = elapsedTime;
    renderer.render(scene, camera);
}

requestAnimationFrame(animate);

window.addEventListener('beforeunload', () => {
    geometry.dispose();
    material.dispose();
    renderer.dispose();
});
