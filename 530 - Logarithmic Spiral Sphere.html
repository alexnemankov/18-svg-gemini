const ANIMATION_PRESETS = {
  'Static (No Camera Movement)': {
    getPose: (t, d) => ({
      pos: new THREE.Vector3(0, 0, d),
      target: new THREE.Vector3(0, 0, 0)
    })
  },
  'Slow Orbit': {
    getPose: (t, d) => {
      const angle = t * 0.12;
      const elev = Math.sin(t * 0.05) * 0.22 + 0.38;
      const r = d * Math.cos(elev);
      return {
        pos: new THREE.Vector3(
          Math.sin(angle) * r,
          Math.sin(elev) * d * 0.85,
          Math.cos(angle) * r
        ),
        target: new THREE.Vector3(0, 0, 0)
      };
    }
  },
  'Floating Drift': {
    getPose: (t, d) => {
      const swayX = Math.sin(t * 0.09) * 3.8;
      const swayY = Math.cos(t * 0.07) * 2.4 + 1.8;
      const swayZ = Math.sin(t * 0.05) * 2.2;
      return {
        pos: new THREE.Vector3(swayX, swayY, d + swayZ),
        target: new THREE.Vector3(swayX * 0.2, swayY * 0.2, 0)
      };
    }
  },
  'Mandala Zenith (Top-Down Float)': {
    getPose: (t, d) => {
      const ang = t * 0.08;
      const drift = Math.sin(t * 0.11) * 1.5;
      return {
        pos: new THREE.Vector3(
          Math.sin(ang) * drift,
          d * 0.95 + Math.cos(t * 0.09) * 1.6,
          Math.cos(ang) * drift
        ),
        target: new THREE.Vector3(0, 0, 0)
      };
    }
  },
  'Cinematic Low Sweep': {
    getPose: (t, d) => {
      const sweep = Math.sin(t * 0.1);
      const ang = sweep * 0.85;
      return {
        pos: new THREE.Vector3(
          Math.sin(ang) * d * 0.78,
          -3.2 + sweep * 1.6,
          Math.cos(ang) * d * 0.78
        ),
        target: new THREE.Vector3(0, 1.2, 0)
      };
    }
  },
  'Spiral Dive & Rise': {
    getPose: (t, d) => {
      const ang = t * 0.13;
      const height = Math.sin(t * 0.16) * (d * 0.42);
      const r = Math.sqrt(Math.max(d * d - height * height, 15));
      return {
        pos: new THREE.Vector3(
          Math.sin(ang) * r,
          height,
          Math.cos(ang) * r
        ),
        target: new THREE.Vector3(0, 0, 0)
      };
    }
  },
  'Hypnotic Pendulum': {
    getPose: (t, d) => {
      const pend = Math.sin(t * 0.18) * 0.45;
      return {
        pos: new THREE.Vector3(
          Math.sin(pend) * d,
          Math.cos(pend * 2.0) * 2.0 + 1.2,
          Math.cos(pend) * d
        ),
        target: new THREE.Vector3(0, 0, 0)
      };
    }
  },
  'Vortex Breathing': {
    getPose: (t, d) => {
      const pulse = Math.sin(t * 0.14);
      const ang = t * 0.06;
      const dist = d * (0.82 + 0.28 * pulse);
      return {
        pos: new THREE.Vector3(
          Math.sin(ang) * 2.2,
          Math.cos(ang) * 1.6 + 1.8,
          dist
        ),
        target: new THREE.Vector3(0, 0, 0)
      };
    }
  }
};

function createRenderer(antialias) {
  const r = new THREE.WebGLRenderer({
    antialias: antialias,
    powerPreference: 'high-performance'
  });
  r.setPixelRatio(PARAMS.performance.dpr);
  r.setSize(window.innerWidth, window.innerHeight);
  r.toneMapping = THREE.ACESFilmicToneMapping;
  r.toneMappingExposure = PARAMS.lighting.exposure * PARAMS.lighting.sceneLightIntensity;
  r.shadowMap.enabled = true;
  r.shadowMap.type = THREE.PCFSoftShadowMap;
  return r;
}

// ============================================================================
// GEOMETRY GENERATION & LOGARITHMIC PACKING
// ============================================================================
let instancedMesh = null;
let tierParams = [];

const dummyMatrix = new THREE.Matrix4();
const dummyPos = new THREE.Vector3();
const dummyQuat = new THREE.Quaternion();
const dummyScale = new THREE.Vector3();
const dummyEuler = new THREE.Euler();

function rebuildGeometry() {
  if (instancedMesh) {
    scene.remove(instancedMesh);
    instancedMesh.geometry.dispose();
    instancedMesh = null;
  }

  const totalInstances = PARAMS.geometry.spokes * PARAMS.geometry.tiers;

  let geom;
  switch (PARAMS.geometry.shape) {
    case 'Jewels':
      geom = new THREE.IcosahedronGeometry(1, 1);
      break;
    case 'Torus Rings':
      geom = new THREE.TorusGeometry(1, 0.35, 16, 32);
      break;
    case 'Luminous Discs':
      geom = new THREE.CylinderGeometry(1, 1, 0.22, 32);
      break;
    case 'Crystal Beads':
      geom = new THREE.OctahedronGeometry(1, 0);
      break;
    case 'Spheres':
    default:
      geom = new THREE.SphereGeometry(1, 32, 24);
      break;
  }

  instancedMesh = new THREE.InstancedMesh(geom, sculptureMaterial, totalInstances);
  instancedMesh.castShadow = true;
  instancedMesh.receiveShadow = true;
  instancedMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);

  // Precalculate logarithmic spiral rings
  tierParams = [];
  const num = PARAMS.geometry.spokes;
  const rad = (Math.PI * 2) / num;
  const initDist = PARAMS.geometry.initDist;
  const r0 = initDist * Math.tan(rad / 2);
  const hyp = Math.sqrt(initDist * initDist + r0 * r0);
  const scaleRatio = (hyp + r0) / (hyp - r0);

  for (let i = 0; i < PARAMS.geometry.tiers; i++) {
    const p = Math.pow(scaleRatio, i * PARAMS.geometry.spacingScale);
    tierParams.push({
      dist: initDist * p,
      radius: r0 * p,
      tierIndex: i
    });
  }

  scene.add(instancedMesh);
  updateColors();
}

function updateColors() {
  if (PARAMS.colors.greenscreen) {
    scene.background = new THREE.Color('#00ff00');
    floorMesh.visible = false;
    if (vignettePass) vignettePass.uniforms.enabled.value = 0.0;
  } else {
    scene.background = new THREE.Color(PARAMS.colors.background);
    floorMesh.visible = true;
    if (vignettePass) vignettePass.uniforms.enabled.value = PARAMS.post.vignette ? 1.0 : 0.0;
  }

  coreMat.color.set(PARAMS.colors.core);
  coreMat.emissive.set(PARAMS.colors.glow);
  coreLight.color.set(PARAMS.colors.glow);
}

function applyColorScheme(name) {
  const scheme = COLOR_SCHEMES[name];
  if (!scheme) return;
  PARAMS.colors.primary = scheme.primary;
  PARAMS.colors.secondary = scheme.secondary;
  PARAMS.colors.core = scheme.core;
  PARAMS.colors.glow = scheme.glow;
  PARAMS.colors.background = scheme.background;
  updateColors();
  updateAllGuiDisplays();
}

// ============================================================================
// POST-PROCESSING PIPELINE
// ============================================================================
const VignetteShader = {
  uniforms: {
    tDiffuse: { value: null },
    strength: { value: PARAMS.post.vignetteStrength },
    softness: { value: 0.65 },
    enabled: { value: 1.0 }
  },
  vertexShader: /* glsl */`
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse;
    uniform float strength;
    uniform float softness;
    uniform float enabled;
    varying vec2 vUv;
    void main() {
      vec4 col = texture2D(tDiffuse, vUv);
      if (enabled > 0.5) {
        vec2 uv = (vUv - 0.5) * 2.0;
        float d = length(uv);
        float v = smoothstep(softness, 1.45, d);
        col.rgb *= (1.0 - v * strength);
      }
      gl_FragColor = col;
    }
  `
};

let composer, renderPass, bloomPass, vignettePass, outputPass;

function initComposer() {
  composer = new EffectComposer(renderer);
  renderPass = new RenderPass(scene, camera);
  composer.addPass(renderPass);

  bloomPass = new UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight),
    PARAMS.post.bloomStrength,
    PARAMS.post.bloomRadius,
    PARAMS.post.bloomThreshold
  );
  bloomPass.enabled = PARAMS.post.bloom;
  composer.addPass(bloomPass);

  vignettePass = new ShaderPass(VignetteShader);
  vignettePass.uniforms.enabled.value = (PARAMS.post.vignette && !PARAMS.colors.greenscreen) ? 1.0 : 0.0;
  vignettePass.uniforms.strength.value = PARAMS.post.vignetteStrength;
  composer.addPass(vignettePass);

  outputPass = new OutputPass();
  composer.addPass(outputPass);
}

initComposer();

// ============================================================================
// PERFORMANCE & ANTIALIAS SWITCHING
// ============================================================================
function applyDPR(val) {
  PARAMS.performance.dpr = val;
  renderer.setPixelRatio(val);
  composer.setPixelRatio(val);
  composer.setSize(window.innerWidth, window.innerHeight);
}

function setAntialias(val) {
  PARAMS.performance.antialias = val;
  const oldCanvas = renderer.domElement;
  const parent = oldCanvas.parentNode;

  renderer.dispose();

  renderer = createRenderer(val);
  parent.replaceChild(renderer.domElement, oldCanvas);
  attachPointerListeners(renderer.domElement);
  initComposer();
}

function randomizeScene() {
  const schemeKeys = Object.keys(COLOR_SCHEMES);
  const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
  PARAMS.colors.scheme = randomScheme;
  applyColorScheme(randomScheme);

  const spokesOptions = [10, 12, 14, 16, 18, 20, 24];
  PARAMS.geometry.spokes = spokesOptions[Math.floor(Math.random() * spokesOptions.length)];
  PARAMS.geometry.tiers = Math.floor(THREE.MathUtils.randFloat(8, 13));
  PARAMS.geometry.spacingScale = THREE.MathUtils.randFloat(0.72, 0.94);
  PARAMS.geometry.domeHeight = THREE.MathUtils.randFloat(0.0, 4.2);
  PARAMS.geometry.waveHeight = THREE.MathUtils.randFloat(0.2, 2.6);
  PARAMS.geometry.waveFrequency = THREE.MathUtils.randFloat(1.0, 3.6);
  PARAMS.geometry.minRadiusRatio = THREE.MathUtils.randFloat(0.08, 0.35);

  const shapes = ['Spheres', 'Jewels', 'Torus Rings', 'Luminous Discs', 'Crystal Beads'];
  PARAMS.geometry.shape = shapes[Math.floor(Math.random() * shapes.length)];

  PARAMS.animation.speed = THREE.MathUtils.randFloat(0.05, 0.15);
  PARAMS.animation.rotSpeed = THREE.MathUtils.randFloat(0.5, 1.8);
  PARAMS.animation.pulseSpeed = THREE.MathUtils.randFloat(0.7, 1.9);
  PARAMS.animation.waveSpeed = THREE.MathUtils.randFloat(0.6, 2.2);

  PARAMS.material.metalness = THREE.MathUtils.randFloat(0.25, 0.88);
  PARAMS.material.roughness = THREE.MathUtils.randFloat(0.06, 0.42);
  PARAMS.material.clearcoat = THREE.MathUtils.randFloat(0.3, 1.0);

  PARAMS.lighting.keyLightIntensity = THREE.MathUtils.randFloat(1.2, 2.4);
  PARAMS.lighting.fillLightIntensity = THREE.MathUtils.randFloat(0.5, 1.6);
  PARAMS.lighting.coreLightIntensity = THREE.MathUtils.randFloat(1.4, 2.8);

  rebuildGeometry();
  applyMaterialParams();
  applyLighting();
  updateAllGuiDisplays();
}

// SCULPTURE UPDATE KINETIC LOOP
// ============================================================================
function updateSculpture(t) {
  if (!instancedMesh) return;

  const num = PARAMS.geometry.spokes;
  const tiers = PARAMS.geometry.tiers;
  const rad = (Math.PI * 2) / num;

  const cPri = new THREE.Color(PARAMS.colors.primary);
  const cSec = new THREE.Color(PARAMS.colors.secondary);
  const cCore = new THREE.Color(PARAMS.colors.core);
  const tempCol = new THREE.Color();

  let idx = 0;
  for (let j = 0; j < num; j++) {
    for (let i = 0; i < tiers; i++) {
      const tp = tierParams[i];
      if (!tp) continue;

      const dir = (i % 2 === 0) ? 1 : -1;
      const ringRot = t * PARAMS.animation.rotSpeed * dir;
      const angle = j * rad + ringRot;

      const px = Math.cos(angle) * tp.dist;
      const py = Math.sin(angle) * tp.dist;

      const pulsePhase = t * PARAMS.animation.pulseSpeed + i * PARAMS.animation.ringPhase;
      const pulse = (j % 2 === 0)
        ? Math.abs(Math.sin(pulsePhase))
        : Math.abs(Math.cos(pulsePhase));

      const rScale = tp.radius * (PARAMS.geometry.minRadiusRatio + (1.0 - PARAMS.geometry.minRadiusRatio) * pulse);

      const normDist = i / Math.max(tiers - 1, 1);
      const dome = PARAMS.geometry.domeHeight * Math.cos(normDist * Math.PI * 0.5);
      const wave = PARAMS.geometry.waveHeight *
        Math.sin(normDist * Math.PI * PARAMS.geometry.waveFrequency - t * PARAMS.animation.waveSpeed) *
        Math.cos(j * 0.5);
      const pz = dome + wave;

      dummyPos.set(px, py, pz);

      dummyEuler.set(
        t * 0.35 * dir + i * 0.25,
        angle + t * 0.2,
        t * 0.5 * (j % 2 === 0 ? 1 : -1)
      );
      dummyQuat.setFromEuler(dummyEuler);

      dummyScale.set(rScale, rScale, rScale);

      dummyMatrix.compose(dummyPos, dummyQuat, dummyScale);
      instancedMesh.setMatrixAt(idx, dummyMatrix);

      if (normDist < 0.35) {
        tempCol.copy(cCore).lerp(cPri, normDist / 0.35);
      } else {
        tempCol.copy(cPri).lerp(cSec, (normDist - 0.35) / 0.65);
      }
      if (j % 2 === 1) {
        tempCol.lerp(cSec, 0.32);
      }
      tempCol.multiplyScalar(0.75 + 0.35 * pulse);

      instancedMesh.setColorAt(idx, tempCol);
      idx++;
    }
  }

  instancedMesh.instanceMatrix.needsUpdate = true;
  if (instancedMesh.instanceColor) {
    instancedMesh.instanceColor.needsUpdate = true;
  }

  if (centralCore) {
    const corePulse = 1.0 + 0.22 * Math.sin(t * 2.5);
    const coreR = (tierParams[0] ? tierParams[0].radius : 0.4) * 1.45 * corePulse;
    centralCore.scale.set(coreR, coreR, coreR);
    centralCore.position.set(0, 0, PARAMS.geometry.domeHeight * 1.02);
  }

  if (coreLight) {
    coreLight.intensity = PARAMS.lighting.coreLightIntensity * PARAMS.lighting.sceneLightIntensity * (1.0 + 0.35 * Math.sin(t * 2.5));
    coreLight.position.set(0, 0, PARAMS.geometry.domeHeight * 1.05);
  }
}

// ============================================================================
// CAMERA RIG & ORBIT ANIMATION MATRIX
// ============================================================================
function updateCameraRig(animTime) {
  camera.fov = PARAMS.camera.fov;
  camera.updateProjectionMatrix();

  const preset = ANIMATION_PRESETS[PARAMS.animation.preset] || ANIMATION_PRESETS['Slow Orbit'];
  const pose = preset.getPose(animTime, PARAMS.camera.distance);

  const relPos = pose.pos.clone().sub(pose.target);

  // 1. Zoom with wheel: scales distance permanently during animation
  relPos.multiplyScalar(PARAMS.camera.userZoom);

  // 2. Camera angle change during orbit: yaw & pitch
  relPos.applyAxisAngle(new THREE.Vector3(0, 1, 0), PARAMS.camera.userAngleYaw);
  const rightAxis = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), PARAMS.camera.userAngleYaw);
  relPos.applyAxisAngle(rightAxis, PARAMS.camera.userAnglePitch);

  // 3. Pan / Drag object across screen
  const camTarget = pose.target.clone();
  const panOffset = new THREE.Vector3(PARAMS.camera.userPanX, PARAMS.camera.userPanY, 0);
  panOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), PARAMS.camera.userAngleYaw);

  camTarget.add(panOffset);
  const finalCamPos = camTarget.clone().add(relPos);

  camera.position.copy(finalCamPos);
  camera.lookAt(camTarget);
}

// ============================================================================
// POINTER & TOUCH INTERACTIONS (ZOOM, DRAG, ORBIT, CLICK RANDOMIZE)
// ============================================================================
let isPointerDown = false;
let pointerButton = 0;
let pointerStartX = 0;
let pointerStartY = 0;
let lastPointerX = 0;
let lastPointerY = 0;
let pointerDownTime = 0;
let hasDragged = false;

function onPointerDown(e) {
  if (e.button !== 0 && e.button !== 1 && e.button !== 2) return;
  isPointerDown = true;
  pointerButton = e.button;
  pointerStartX = e.clientX;
  pointerStartY = e.clientY;
  lastPointerX = e.clientX;
  lastPointerY = e.clientY;
  pointerDownTime = performance.now();
  hasDragged = false;
  try { renderer.domElement.setPointerCapture(e.pointerId); } catch (_) {}
}

function onPointerMove(e) {
  if (!isPointerDown) return;
  const dx = e.clientX - lastPointerX;
  const dy = e.clientY - lastPointerY;
  lastPointerX = e.clientX;
  lastPointerY = e.clientY;

  if (Math.hypot(e.clientX - pointerStartX, e.clientY - pointerStartY) > 5) {
    hasDragged = true;
  }

  let isOrbit = false;
  if (pointerButton === 2 || (pointerButton === 0 && e.shiftKey)) {
    isOrbit = true;
  } else if (pointerButton === 1) {
    isOrbit = false;
  } else if (pointerButton === 0) {
    isOrbit = (PARAMS.camera.dragMode === 'Rotate (Camera Angle)');
  }

  if (isOrbit) {
    PARAMS.camera.userAngleYaw += dx * 0.006;
    PARAMS.camera.userAnglePitch = THREE.MathUtils.clamp(
      PARAMS.camera.userAnglePitch + dy * 0.006,
      -Math.PI * 0.48,
      Math.PI * 0.48
    );
  } else {
    const dist = PARAMS.camera.distance * PARAMS.camera.userZoom;
    const vHeight = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5)) * dist;
    const factor = vHeight / window.innerHeight;
    PARAMS.camera.userPanX += dx * factor;
    PARAMS.camera.userPanY -= dy * factor;
  }
  updateAllGuiDisplays();
}

function onPointerUp(e) {
  if (!isPointerDown) return;
  isPointerDown = false;
  try { renderer.domElement.releasePointerCapture(e.pointerId); } catch (_) {}

  const duration = performance.now() - pointerDownTime;
  if (!hasDragged && duration < 320 && pointerButton === 0) {
    if (PARAMS.interaction.clickToRandomize) {
      randomizeScene();
    }
  }
}

function onWheel(e) {
  e.preventDefault();
  const zoomFactor = e.deltaY < 0 ? 0.92 : 1.08;
  PARAMS.camera.userZoom = THREE.MathUtils.clamp(PARAMS.camera.userZoom * zoomFactor, 0.15, 6.0);
  updateAllGuiDisplays();
}

function attachPointerListeners(canvas) {
  window.addEventListener('contextmenu', (e) => {
    if (e.target === canvas) e.preventDefault();
  });
  canvas.addEventListener('pointerdown', onPointerDown);
  canvas.addEventListener('pointermove', onPointerMove);
  canvas.addEventListener('pointerup', onPointerUp);
  canvas.addEventListener('pointercancel', onPointerUp);
  canvas.addEventListener('wheel', onWheel, { passive: false });
}

attachPointerListeners(renderer.domElement);

  if (folder.folders) {
    for (const f of folder.folders) updateAllGuiDisplays(f);
  }
}

fCam.add(PARAMS.camera, 'userPanY', -35, 35, 0.1).name('Pan Y');

// 8. Performance & Antialiasing
const fPerf = gui.addFolder('Performance');

gui.folders.forEach(f => f.close());

// ============================================================================
// HIDE / SHOW UI WITH "H" KEY
// ============================================================================
let guiVisible = true;
window.addEventListener('keydown', (e) => {
  if (e.key === 'h' || e.key === 'H') {
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
    guiVisible = !guiVisible;
    if (typeof gui.show === 'function' && typeof gui.hide === 'function') {
      if (guiVisible) gui.show(); else gui.hide();
    } else {
      gui.domElement.style.display = guiVisible ? '' : 'none';
    }
  }
});

// ============================================================================
// WINDOW RESIZE HANDLER
// ============================================================================
window.addEventListener('resize', () => {
  const width = window.innerWidth;
  const height = window.innerHeight;
  camera.aspect = width / height;
  camera.updateProjectionMatrix();
  renderer.setSize(width, height);
  composer.setSize(width, height);
});

// Build initial geometry
rebuildGeometry();
applyLighting();

// ============================================================================
// AUTO INFINITE ANIMATION LOOP
// ============================================================================
const clock = new THREE.Clock();
let sculptureTime = 0.0;
let cameraTime = 0.0;

renderer.setAnimationLoop(() => {
  const delta = Math.min(clock.getDelta(), 0.06);

  if (!PARAMS.animation.paused) {
    const dir = PARAMS.animation.reverse ? -1 : 1;
    sculptureTime += delta * PARAMS.animation.speed * dir * 10.0;
    cameraTime += delta * (PARAMS.animation.reverse ? -1 : 1);
  }

  updateSculpture(sculptureTime);
  updateCameraRig(cameraTime);

  composer.render();
});
