<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uniform Circular Motion - Particle Vortex</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body, html {
      overflow: hidden;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #080713;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
      }
    }
  </script>
</head>
<body>
  <canvas id="canv"></canvas>

  <script type="module">
    import * as THREE from 'three';
    import GUI from 'lil-gui';

    // =========================================================================================
    // POST PROCESSOR SUITE (Inlined from postprocessing/PostProcessor.js for Standalone Execution)
    // =========================================================================================
    const orthoVertexShader = `
    precision highp float;
    in vec3 position;
    out vec2 vUv;
    void main() {
      vUv = position.xy * 0.5 + 0.5;
      gl_Position = vec4(position, 1.0);
    }
    `;

    const brightFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float bloomThreshold;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      // Calculate relative luminance (Rec. 709)
      float luminance = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      // Soft knee thresholding
      float knee = 0.1;
      float soft = luminance - bloomThreshold + knee;
      soft = clamp(soft, 0.0, 2.0 * knee);
      soft = (soft * soft) / (4.0 * knee + 0.00001);
      float contribution = max(soft, luminance - bloomThreshold);
      contribution /= max(luminance, 0.00001);
      fragColor = vec4(color.rgb * contribution, color.a);
    }
    `;

    const blur13ShaderChunk = `
    vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
      vec2 resolution = vec2(textureSize(image, 0));
      vec4 color = vec4(0.0);
      vec2 off1 = vec2(1.411764705882353) * direction;
      vec2 off2 = vec2(3.2941176470588234) * direction;
      vec2 off3 = vec2(5.176470588235294) * direction;
      color += texture(image, uv) * 0.1964825501511404;
      color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
      color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
      return color;
    }
    `;

    const blurFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 direction;
    in vec2 vUv;
    out vec4 color;
    ${blur13ShaderChunk}
    void main() {
      color = blur13(inputTexture, vUv, direction);
    }
    `;

    const finalFragmentShader = `
    precision highp float;
    uniform vec2 resolution;
    uniform sampler2D inputTexture;
    uniform sampler2D blur0Texture;
    uniform sampler2D blur1Texture;
    uniform sampler2D blur2Texture;
    uniform sampler2D blur3Texture;
    uniform sampler2D blur4Texture;
    uniform bool bloomEnabled;
    uniform float bloomStrength;
    uniform float vignetteBoost;
    uniform float vignetteReduction;
    uniform float noiseIntensity;
    uniform float time;
    in vec2 vUv;
    out vec4 fragColor;

    float vignette(vec2 uv, float boost, float reduction) {
      vec2 position = vUv - 0.5;
      return boost - length(position) * reduction;
    }

    float hash1(uint n) {
      n = (n << 13U) ^ n;
      n = n * (n * n * 15731U + 789221U) + 1376312589U;
      return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
    }

    float noise(in vec2 uv, in float timeVal) {
      uvec2 p = uvec2(uv);
      return hash1(p.x + 1920U * p.y + (1920U * 1080U) * uint(timeVal));
    }

    void main() {
      vec4 color = texture(inputTexture, vUv);

      if (bloomEnabled && bloomStrength > 0.001) {
        vec4 b0 = texture(blur0Texture, vUv);
        vec4 b1 = texture(blur1Texture, vUv);
        vec4 b2 = texture(blur2Texture, vUv);
        vec4 b3 = texture(blur3Texture, vUv);
        vec4 b4 = texture(blur4Texture, vUv);

        vec4 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
        color += bloomSum * bloomStrength;
      }

      color.rgb *= vignette(vUv, vignetteBoost, vignetteReduction);
      color.rgb += noiseIntensity * noise(gl_FragCoord.xy, time);
      fragColor = vec4(color.rgb, 1.0);
    }
    `;

    const chromaticAberrationShaderChunk = `
    vec2 barrelDistortion(vec2 coord, float amt) {
      vec2 cc = coord - 0.5;
      float dist = dot(cc, cc);
      return coord + cc * dist * amt;
    }
    float sat(float t) { return clamp(t, 0.0, 1.0); }
    float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
    float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
    vec4 spectrum_offset(float t) {
      float lo = step(t, 0.5);
      float hi = 1.0 - lo;
      float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
      vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
      return pow(ret, vec4(1.0 / 2.2));
    }
    const float max_distort = 2.2;
    const int num_iter = 8;
    const float reci_num_iter_f = 1.0 / float(num_iter);
    vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
      vec4 sumcol = vec4(0.0);
      vec4 sumw = vec4(0.0);
      for (int i = 0; i < num_iter; ++i) {
        float t = float(i) * reci_num_iter_f;
        vec4 w = spectrum_offset(t);
        sumw += w;
        sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
      }
      return sumcol / sumw;
    }
    `;

    const colorFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float chromaticAberrationAmount;
    uniform float minInputLevel;
    uniform float maxInputLevel;
    uniform float gammaLevel;
    uniform float fisheyeStrength;
    uniform float fisheyeRadius;
    uniform float time;
    in vec2 vUv;
    out vec4 fragColor;

    ${chromaticAberrationShaderChunk}

    vec2 applyFisheye(vec2 uv, float strength, float radius) {
      if (abs(strength) < 0.0001) return uv;
      vec2 p = uv - 0.5;
      float d = length(p);
      if (d > radius * 1.5) return uv;
      float r = d / max(radius, 0.001);
      float theta = atan(p.y, p.x);
      float rDist = r + strength * (r * r * r);
      return 0.5 + vec2(cos(theta), sin(theta)) * (rDist * radius);
    }

    vec3 gammaCorrect(vec3 color, vec3 gamma) {
      return pow(max(color, vec3(0.0)), 1.0 / gamma);
    }
    vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
      return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
    }
    vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
      return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
    }
    void main() {
      vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
      fragColor = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
      fragColor.rgb = finalLevels(fragColor.rgb, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
      fragColor.a = 1.0;
    }
    `;

    const copyFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      fragColor = texture(inputTexture, vUv);
    }
    `;

    function createFBO(w, h, options = {}) {
      return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
        wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
        wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
        minFilter: options.minFilter || THREE.LinearFilter,
        magFilter: options.magFilter || THREE.LinearFilter,
        format: options.format || THREE.RGBAFormat,
        type: options.type || THREE.HalfFloatType,
        stencilBuffer: options.stencilBuffer || false,
        depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : true,
        samples: options.samples || 0,
      });
    }

    class ShaderPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbo = createFBO(1, 1, options);
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
        this.texture = this.fbo.texture;
      }
      render(renderer, toScreen = false) {
        if (!toScreen) {
          renderer.setRenderTarget(this.fbo);
        }
        renderer.render(this.orthoScene, this.orthoCamera);
        if (!toScreen) {
          renderer.setRenderTarget(null);
        }
      }
      setSize(width, height) {
        this.fbo.setSize(Math.max(1, width), Math.max(1, height));
        this.orthoQuad.scale.set(width, height, 1);
      }
    }

    class ShaderPingPongPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
        this.currentFBO = 0;
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
      }
      render(renderer) {
        renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
        renderer.render(this.orthoScene, this.orthoCamera);
        renderer.setRenderTarget(null);
        this.currentFBO = 1 - this.currentFBO;
      }
      get current() { return this.fbos[this.currentFBO]; }
      get texture() { return this.current.texture; }
      setSize(width, height) {
        const w = Math.max(1, width);
        const h = Math.max(1, height);
        this.orthoQuad.scale.set(w, h, 1);
        this.fbos[0].setSize(w, h);
        this.fbos[1].setSize(w, h);
      }
    }

    class BloomPass {
      constructor(strength = 0.8, radius = 0.5, threshold = 0.2, levels = 5) {
        this.strength = strength;
        this.radius = radius;
        this.threshold = threshold;
        this.enabled = true;
        this.levels = levels;

        this.brightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            bloomThreshold: { value: this.threshold },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: brightFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.brightPass = new ShaderPass(this.brightShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.blurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            direction: { value: new THREE.Vector2(0, 1) },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: blurFragmentShader,
          glslVersion: THREE.GLSL3,
        });

        this.blurPasses = [];
        for (let i = 0; i < this.levels; i++) {
          this.blurPasses.push(new ShaderPingPongPass(this.blurShader, {
            format: THREE.RGBAFormat,
            type: THREE.HalfFloatType,
          }));
        }
      }

      setSize(w, h) {
        let tw = Math.max(1, w);
        let th = Math.max(1, h);
        this.brightPass.setSize(tw, th);
        for (let i = 0; i < this.levels; i++) {
          tw = Math.max(1, Math.round(tw / 2));
          th = Math.max(1, Math.round(th / 2));
          this.blurPasses[i].setSize(tw, th);
        }
      }

      set source(texture) {
        this.brightShader.uniforms.inputTexture.value = texture;
      }

      render(renderer) {
        if (!this.enabled || this.strength <= 0.001) return;

        this.brightShader.uniforms.bloomThreshold.value = this.threshold;
        this.brightPass.render(renderer);

        const baseOffset = Math.max(0.1, this.radius * 2.0);
        const u = this.blurShader.uniforms;

        for (let j = 0; j < this.levels; j++) {
          const blurPass = this.blurPasses[j];
          const stepOffset = baseOffset * (1.0 + j * 0.5);

          // Horizontal blur pass
          u.direction.value.set(stepOffset, 0);
          u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
          blurPass.render(renderer);

          // Vertical blur pass
          u.direction.value.set(0, stepOffset * 0.5);
          u.inputTexture.value = blurPass.current.texture;
          blurPass.render(renderer);
        }
      }
    }

    class PostProcessor {
      constructor(renderer, params = {}) {
        this.renderer = renderer;

        this.settings = {
          enabled: params.enabled !== undefined ? params.enabled : true,
          bloomEnabled: params.bloomEnabled !== undefined ? params.bloomEnabled : true,
          bloomStrength: params.bloomStrength !== undefined ? params.bloomStrength : 0.8,
          bloomRadius: params.bloomRadius !== undefined ? params.bloomRadius : 0.5,
          bloomThreshold: params.bloomThreshold !== undefined ? params.bloomThreshold : 0.2,
          fisheyeStrength: params.fisheyeStrength !== undefined ? params.fisheyeStrength : 0.0,
          fisheyeRadius: params.fisheyeRadius !== undefined ? params.fisheyeRadius : 1.0,
          chromaticAberration: params.chromaticAberration !== undefined ? params.chromaticAberration : 0.04,
          vignetteBoost: params.vignetteBoost !== undefined ? params.vignetteBoost : 1.0,
          vignetteReduction: params.vignetteReduction !== undefined ? params.vignetteReduction : 0.5,
          noiseIntensity: params.noiseIntensity !== undefined ? params.noiseIntensity : 0.02,
          gamma: params.gamma !== undefined ? params.gamma : 1.0,
          minInputLevel: params.minInputLevel !== undefined ? params.minInputLevel : 0.0,
          maxInputLevel: params.maxInputLevel !== undefined ? params.maxInputLevel : 1.0,
        };

        this.sceneTarget = createFBO(1, 1, { type: THREE.HalfFloatType });

        this.bloomPass = new BloomPass(
          this.settings.bloomStrength,
          this.settings.bloomRadius,
          this.settings.bloomThreshold,
          5
        );

        this.finalShader = new THREE.RawShaderMaterial({
          uniforms: {
            resolution: { value: new THREE.Vector2(1, 1) },
            bloomEnabled: { value: this.settings.bloomEnabled },
            bloomStrength: { value: this.settings.bloomStrength },
            vignetteBoost: { value: this.settings.vignetteBoost },
            vignetteReduction: { value: this.settings.vignetteReduction },
            noiseIntensity: { value: this.settings.noiseIntensity },
            inputTexture: { value: null },
            blur0Texture: { value: null },
            blur1Texture: { value: null },
            blur2Texture: { value: null },
            blur3Texture: { value: null },
            blur4Texture: { value: null },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: finalFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.finalPass = new ShaderPass(this.finalShader);

        this.rgbShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: this.finalPass.texture },
            fisheyeStrength: { value: this.settings.fisheyeStrength },
            fisheyeRadius: { value: this.settings.fisheyeRadius },
            chromaticAberrationAmount: { value: this.settings.chromaticAberration },
            minInputLevel: { value: this.settings.minInputLevel },
            maxInputLevel: { value: this.settings.maxInputLevel },
            gammaLevel: { value: this.settings.gamma },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: colorFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.rgbPass = new ShaderPass(this.rgbShader);

        this.copyShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: copyFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.copyPass = new ShaderPass(this.copyShader);
      }

      updateSettings() {
        this.bloomPass.enabled = this.settings.bloomEnabled;
        this.bloomPass.strength = this.settings.bloomStrength;
        this.bloomPass.radius = this.settings.bloomRadius;
        this.bloomPass.threshold = this.settings.bloomThreshold;

        this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
        this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
        this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
        this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
        this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;

        this.rgbShader.uniforms.fisheyeStrength.value = this.settings.fisheyeStrength;
        this.rgbShader.uniforms.fisheyeRadius.value = this.settings.fisheyeRadius;
        this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
        this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
        this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
        this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
      }

      setSize(w0, h0, dpr = 1) {
        const w = Math.max(1, Math.floor(w0 * dpr));
        const h = Math.max(1, Math.floor(h0 * dpr));
        this.sceneTarget.setSize(w, h);
        this.finalPass.setSize(w, h);
        this.finalShader.uniforms.resolution.value.set(w, h);
        this.bloomPass.setSize(w, h);
        this.rgbPass.setSize(w, h);
        this.copyPass.setSize(w, h);
      }

      renderScene(scene, camera) {
        if (!this.settings.enabled) {
          this.renderer.render(scene, camera);
          return;
        }
        this.renderer.setRenderTarget(this.sceneTarget);
        this.renderer.render(scene, camera);
        this.renderer.setRenderTarget(null);
        this.render(this.sceneTarget.texture);
      }

      render(sourceTexture) {
        if (!this.settings.enabled) {
          this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
          this.copyPass.render(this.renderer, true);
          return;
        }

        this.updateSettings();

        this.bloomPass.source = sourceTexture;
        this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
        this.bloomPass.render(this.renderer);

        this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
        this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
        this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
        this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
        this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

        const randomTime = Math.random() * 100000;
        this.finalPass.shader.uniforms.time.value = randomTime;
        this.rgbPass.shader.uniforms.time.value = randomTime;

        this.finalPass.render(this.renderer);
        this.rgbPass.render(this.renderer, true);
      }

      attachGUI(gui, title = "Post-Processing Suite") {
        const root = gui.addFolder(title);
        root.add(this.settings, "enabled").name("Enable Suite");

        const bloom = root.addFolder("Bloom");
        bloom.add(this.settings, "bloomEnabled").name("Enable Bloom").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomStrength", 0, 3.0, 0.05).name("Strength").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomRadius", 0, 2.0, 0.05).name("Radius").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomThreshold", 0, 1.0, 0.01).name("Threshold").onChange(() => this.updateSettings());

        const lens = root.addFolder("Lens, Optics & Fisheye");
        lens.add(this.settings, "fisheyeStrength", -1.0, 1.5, 0.01).name("Fisheye Distortion").onChange(() => this.updateSettings());
        lens.add(this.settings, "fisheyeRadius", 0.2, 2.0, 0.05).name("Fisheye Radius").onChange(() => this.updateSettings());
        lens.add(this.settings, "chromaticAberration", 0, 0.2, 0.005).name("Chromatic Aberration").onChange(() => this.updateSettings());
        lens.add(this.settings, "vignetteBoost", 0, 2.0, 0.05).name("Vignette Boost").onChange(() => this.updateSettings());
        lens.add(this.settings, "vignetteReduction", 0, 2.0, 0.05).name("Vignette Falloff").onChange(() => this.updateSettings());
        lens.add(this.settings, "noiseIntensity", 0, 0.1, 0.005).name("Film Grain").onChange(() => this.updateSettings());
        lens.add(this.settings, "gamma", 0.2, 2.0, 0.05).name("Gamma").onChange(() => this.updateSettings());
        lens.add(this.settings, "minInputLevel", 0, 0.5, 0.01).name("Black Level").onChange(() => this.updateSettings());
        lens.add(this.settings, "maxInputLevel", 0.5, 1.0, 0.01).name("White Level").onChange(() => this.updateSettings());

        return root;
      }
    }

    // =========================================================================================
    // COLOR SCHEMES & CONFIGURATION
    // =========================================================================================
    const COLOR_SCHEMES = {
      'Cosmic Indigo (Original)': {
        bg: '#080713',
        color1: '#821a78',
        color2: '#4a1564',

        blendMode: 'lighter'
      },
      'Black & White': {

        blendMode: 'lighter'
      },
      'White & Black': {

        blendMode: 'source-over'
      },
      'Cyberpunk Neon': {

      },

      },

      },

        bg: '#07020d',

        blendMode: 'lighter'
      }
    };

    const ANIMATION_PRESETS = [
      'Cosmic Orbit (Default)',
      'Static (No Camera)',
      'Slow Spiral Drift',
      'Wave Resonance',
      'Pulsar Breathing',
      'Infinity Flow',
      'Nebula Roll',
      'Galactic Tilt & Yaw'
    ];

    const params = {
      // Color & Theme
      scheme: 'Cosmic Indigo (Original)',
      greenScreen: false,
      bgColor: '#080713',
      color1: '#821a78',
      color2: '#4a1564',
      color3: '#142055',
      particleBlendMode: 'lighter',
      trailOpacity: 0.55,

      // Animation & Camera Preset
      animation: 'Cosmic Orbit (Default)',
      speed: 1.0,
      animSpeed: 1.0,

      // Particle Geometry & Physics
      particleCount: 650,
      radiusScale: 1.0,
      particleSize: 1.0,
      tiltY: 0.4,
      forceMultiplier: 1.0,
      flow: 20,

      // Procedural Re-roll on click
      clickToRandomize: true,

      // Display & Viewport
      dpr: Math.min(window.devicePixelRatio || 1, 2),
      zoom: 1.0,
      panX: 0,
      panY: 0,

      resetView: () => {
        params.zoom = 1.0;
        params.panX = 0;
        params.panY = 0;
        updateGuiDisplays();
      },
      randomizeNow: () => {
        randomizeScene();
      }
    };

    // =========================================================================================
    // RENDERING PIPELINE: OFFSCREEN CANVAS 2D + THREE.JS POSTPROCESSOR
    // =========================================================================================
    const visibleCanvas = document.getElementById('canv');
    const renderer = new THREE.WebGLRenderer({
      canvas: visibleCanvas,
      antialias: false,
      powerPreference: 'high-performance'
    });

    const postProcessor = new PostProcessor(renderer, {
      enabled: true,
      bloomEnabled: true,
      bloomStrength: 0.85,
      bloomRadius: 0.45,
      bloomThreshold: 0.15,
      chromaticAberration: 0.02,
      vignetteBoost: 1.0,
      vignetteReduction: 0.35,
      noiseIntensity: 0.01
    });

    const offscreenCanvas = document.createElement('canvas');
    const ctx = offscreenCanvas.getContext('2d');
    const canvasTexture = new THREE.CanvasTexture(offscreenCanvas);
    canvasTexture.minFilter = THREE.LinearFilter;
    canvasTexture.magFilter = THREE.LinearFilter;
    canvasTexture.generateMipmaps = false;

    let width = window.innerWidth;
    let height = window.innerHeight;
    let midX = width / 2;
    let midY = height / 2;
    let baseForce = Math.max(width, height) * 0.09;

    let parts = [];
    let flowProgress = 50;
    const initialBegin = 50;

    // Interaction State
    let mouseX = null;
    let mouseY = null;
    let isPointerDown = false;
    let hasDragged = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let initialPanX = 0;
    let initialPanY = 0;

    // Color conversion helper
    function hexToRgb(hex) {
      hex = hex.replace(/^#/, '');
      if (hex.length === 3) {
        hex = hex.split('').map(x => x + x).join('');
      }
      const num = parseInt(hex, 16);
      return {
        r: (num >> 16) & 255,
        g: (num >> 8) & 255,
        b: num & 255
      };
    }

    function lerpColor(c1, c2, t) {
      return {
        r: Math.round(c1.r + (c2.r - c1.r) * t),
        g: Math.round(c1.g + (c2.g - c1.g) * t),
        b: Math.round(c1.b + (c2.b - c1.b) * t)
      };
    }

    function getParticleColor(ratio, pRandom) {
      const rgb1 = hexToRgb(params.color1);
      const rgb2 = hexToRgb(params.color2);
      const rgb3 = hexToRgb(params.color3);

      let blended;
      const combinedRatio = (ratio * 0.7 + pRandom * 0.3);
      if (combinedRatio < 0.5) {
        blended = lerpColor(rgb1, rgb2, combinedRatio * 2);
      } else {
        blended = lerpColor(rgb2, rgb3, (combinedRatio - 0.5) * 2);
      }

      if (params.scheme === 'White & Black' && !params.greenScreen) {
        return `rgba(${blended.r}, ${blended.g}, ${blended.b}, 0.85)`;
      }
      return `rgb(${blended.r}, ${blended.g}, ${blended.b})`;
    }

    // Particle Class
    class Particle {
      constructor() {
        this.pRandom = Math.random();
        this.deg = Math.floor(Math.random() * 360);
        this.baseRad = Math.random() * width * 0.5;
        this.x = this.distX = Math.floor(Math.random() * width);
        this.y = this.distY = Math.floor(Math.random() * height);
        this.baseSize = 1 + Math.floor(Math.random() * (this.baseRad * 0.055));
        this.color = getParticleColor(this.deg / 360, this.pRandom);
      }

      updateColor() {
        this.color = getParticleColor(this.deg / 360, this.pRandom);
      }
    }

    function initParticles() {
      parts = [];
      for (let i = 0; i < params.particleCount; i++) {
        parts.push(new Particle());
      }
      flowProgress = initialBegin;
      const interval = setInterval(() => {
        flowProgress--;
        if (flowProgress <= params.flow) {
          flowProgress = params.flow;
          clearInterval(interval);
        }
      }, 20);
    }

    function updateAllParticleColors() {
      for (let i = 0; i < parts.length; i++) {
        parts[i].updateColor();
      }
    }

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      midX = width / 2;
      midY = height / 2;
      baseForce = Math.max(width, height) * 0.09;

      const dpr = params.dpr;
      renderer.setPixelRatio(dpr);
      renderer.setSize(width, height, false);

      offscreenCanvas.width = Math.max(1, Math.round(width * dpr));
      offscreenCanvas.height = Math.max(1, Math.round(height * dpr));

      postProcessor.setSize(width, height, dpr);
    }

    function applyScheme(schemeName) {
      const s = COLOR_SCHEMES[schemeName];
      if (!s) return;
      params.scheme = schemeName;
      params.bgColor = s.bg;
      params.color1 = s.color1;
      params.color2 = s.color2;
      params.color3 = s.color3;
      params.particleBlendMode = s.blendMode;
      updateAllParticleColors();
      updateGuiDisplays();
    }

    // Camera animation calculations
    let animationTime = 0;
    function computeCameraAnimation(time) {
      let animOffsetX = 0;
      let animOffsetY = 0;
      let animRotate = 0;
      let animZoom = 1.0;
      let animTiltMod = 1.0;

      const t = time * 0.001 * params.animSpeed;

      switch (params.animation) {
        case 'Cosmic Orbit (Default)':
          animRotate = Math.sin(t * 0.35) * 0.12;
          animOffsetX = Math.cos(t * 0.25) * 25;
          animOffsetY = Math.sin(t * 0.3) * 15;
          animZoom = 1.0 + Math.sin(t * 0.2) * 0.04;
          break;

        case 'Static (No Camera)':
          animOffsetX = 0;
          animOffsetY = 0;
          animRotate = 0;
          animZoom = 1.0;
          break;

        case 'Slow Spiral Drift':
          animOffsetX = Math.cos(t * 0.3) * 45;
          animOffsetY = Math.sin(t * 0.3) * 28;
          animRotate = (t * 0.08) % (Math.PI * 2);
          animZoom = 1.0 + Math.sin(t * 0.15) * 0.06;
          break;

        case 'Wave Resonance':
          animOffsetY = Math.sin(t * 0.5) * 35;
          animRotate = Math.sin(t * 0.25) * 0.08;
          animZoom = 1.0 + Math.sin(t * 0.4) * 0.05;
          animTiltMod = 1.0 + Math.sin(t * 0.6) * 0.2;
          break;

        case 'Pulsar Breathing':
          animZoom = 1.0 + Math.sin(t * 0.45) * 0.14;
          animOffsetX = Math.sin(t * 0.2) * 15;
          animOffsetY = Math.cos(t * 0.2) * 10;
          break;

        case 'Infinity Flow':
          animOffsetX = Math.sin(t * 0.3) * 50;
          animOffsetY = Math.sin(t * 0.6) * 30;
          animRotate = Math.cos(t * 0.3) * 0.07;
          animZoom = 1.0 + Math.cos(t * 0.3) * 0.05;
          break;

        case 'Nebula Roll':
          animRotate = (t * 0.12) % (Math.PI * 2);
          animZoom = 1.0 + Math.cos(t * 0.25) * 0.05;
          animOffsetX = Math.cos(t * 0.15) * 15;
          animOffsetY = Math.sin(t * 0.15) * 15;
          break;

        case 'Galactic Tilt & Yaw':
          animOffsetX = Math.cos(t * 0.35) * 35;
          animOffsetY = Math.sin(t * 0.45) * 25;
          animRotate = Math.sin(t * 0.3) * 0.1;
          animTiltMod = 1.0 + Math.sin(t * 0.4) * 0.25;
          break;
      }

      return { animOffsetX, animOffsetY, animRotate, animZoom, animTiltMod };
    }

    function randomizeScene() {
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const chosenScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      applyScheme(chosenScheme);

      const animKeys = ANIMATION_PRESETS;
      params.animation = animKeys[Math.floor(Math.random() * animKeys.length)];

      params.speed = parseFloat((0.5 + Math.random() * 1.8).toFixed(2));
      params.animSpeed = parseFloat((0.6 + Math.random() * 1.0).toFixed(2));
      params.tiltY = parseFloat((0.2 + Math.random() * 0.5).toFixed(2));
      params.radiusScale = parseFloat((0.7 + Math.random() * 0.7).toFixed(2));
      params.particleSize = parseFloat((0.6 + Math.random() * 0.9).toFixed(2));
      params.forceMultiplier = parseFloat((0.7 + Math.random() * 0.9).toFixed(2));
      params.flow = Math.floor(15 + Math.random() * 25);
      params.trailOpacity = parseFloat((0.35 + Math.random() * 0.4).toFixed(2));

      const newCount = Math.floor(450 + Math.random() * 450);
      params.particleCount = newCount;

      initParticles();
      updateGuiDisplays();
    }

    // =========================================================================================
    // MAIN LOOP & RENDER
    // =========================================================================================
    let lastTime = performance.now();

    function render(currentTime) {
      requestAnimationFrame(render);

      const delta = Math.min((currentTime - lastTime) / 16.666, 3.0);
      lastTime = currentTime;
      animationTime += delta * 16.666;

      const dpr = params.dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      // Background clearing
      ctx.globalCompositeOperation = 'source-over';
      if (params.greenScreen) {
        ctx.fillStyle = '#00ff00';
        ctx.fillRect(0, 0, width, height);
      } else {
        const bgRgb = hexToRgb(params.bgColor);
        ctx.fillStyle = `rgba(${bgRgb.r}, ${bgRgb.g}, ${bgRgb.b}, ${params.trailOpacity})`;
        ctx.fillRect(0, 0, width, height);
      }

      // Camera transforms
      const { animOffsetX, animOffsetY, animRotate, animZoom, animTiltMod } = computeCameraAnimation(animationTime);
      const totalZoom = params.zoom * animZoom;
      const totalPanX = params.panX + animOffsetX;
      const totalPanY = params.panY + animOffsetY;

      // Particle blend mode
      if (params.greenScreen) {
        ctx.globalCompositeOperation = 'source-over';
      } else {
        ctx.globalCompositeOperation = params.particleBlendMode;
      }

      let transformedMx = null;
      let transformedMy = null;
      if (mouseX !== null && mouseY !== null) {
        const cx = mouseX - (midX + totalPanX);
        const cy = mouseY - (midY + totalPanY);
        const cosR = Math.cos(-animRotate);
        const sinR = Math.sin(-animRotate);
        const unrotX = cx * cosR - cy * sinR;
        const unrotY = cx * sinR + cy * cosR;
        transformedMx = (unrotX / totalZoom) + midX;
        transformedMy = (unrotY / totalZoom) + midY;
      }

      let bounds = baseForce * params.forceMultiplier;
      if (isPointerDown) {
        bounds *= 2;
      }

      const effectiveTilt = params.tiltY * animTiltMod;
      const currentFlow = flowProgress;

      ctx.save();
      ctx.translate(midX + totalPanX, midY + totalPanY);
      ctx.scale(totalZoom, totalZoom);
      ctx.rotate(animRotate);
      ctx.translate(-midX, -midY);

      const n = parts.length;
      for (let i = 0; i < n; i++) {
        const p = parts[i];
        const radAngle = (Math.PI / 180) * p.deg;
        const currentRad = p.baseRad * params.radiusScale;

        p.distX = midX + currentRad * Math.cos(radAngle);
        p.distY = midY + currentRad * Math.sin(radAngle) * effectiveTilt;

        if (transformedMx !== null && transformedMy !== null) {
          const react = ((bounds * 0.5) + Math.random() * (bounds * 0.9));
          const dx = p.distX - transformedMx;
          const dy = p.distY - transformedMy;

          if (dx > 0 && dx < bounds && dy > 0 && dy < bounds) {
            p.distX += react;
            p.distY += react;
          } else if (dx > 0 && dx < bounds && dy < 0 && dy > -bounds) {
            p.distX += react;
            p.distY -= react;
          } else if (dx < 0 && dx > -bounds && dy > 0 && dy < bounds) {
            p.distX -= react;
            p.distY += react;
          } else if (dx < 0 && dx > -bounds && dy < 0 && dy > -bounds) {
            p.distX -= react;
            p.distY -= react;
          }
        }

        p.x += ((p.distX - p.x) / currentFlow);
        p.y += ((p.distY - p.y) / currentFlow);

        let s = (p.baseSize * params.particleSize) * (p.y * 1.5 / height);
        if (s < 0.1) s = 0.1;

        ctx.beginPath();
        ctx.fillStyle = p.color;
        ctx.arc(p.x, p.y, s, 0, Math.PI * 2, true);
        ctx.fill();

        let vary = p.baseSize < 2 ? 4 : p.baseSize < 3 ? 3 : p.baseSize < 4 ? 2 : 1;
        vary *= (p.y / (height * 0.9)) * params.speed * delta;
        p.deg = (p.deg + vary) % 360;
      }

      ctx.restore();

      // Submit 2D canvas texture to Three.js PostProcessor
      canvasTexture.needsUpdate = true;
      postProcessor.render(canvasTexture);
    }

    // =========================================================================================
    // INTERACTIONS & GUI
    // =========================================================================================
    function setupInteractions() {
      window.addEventListener('wheel', (e) => {
        if (e.target.closest('.lil-gui')) return;
        e.preventDefault();
        const zoomFactor = Math.exp(-e.deltaY * 0.0015);
        const newZoom = Math.min(Math.max(params.zoom * zoomFactor, 0.15), 10.0);

        const cx = e.clientX;
        const cy = e.clientY;
        const wx = (cx - (midX + params.panX)) / params.zoom + midX;
        const wy = (cy - (midY + params.panY)) / params.zoom + midY;

        params.panX = cx - midX - (wx - midX) * newZoom;
        params.panY = cy - midY - (wy - midY) * newZoom;
        params.zoom = newZoom;

        updateGuiDisplays();
      }, { passive: false });

      window.addEventListener('pointerdown', (e) => {
        if (e.target.closest('.lil-gui')) return;

        isPointerDown = true;
        hasDragged = false;
        dragStartX = e.clientX;
        dragStartY = e.clientY;
        initialPanX = params.panX;
        initialPanY = params.panY;
        mouseX = e.clientX;
        mouseY = e.clientY;
      });

      window.addEventListener('pointermove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;

        if (isPointerDown) {
          const dx = e.clientX - dragStartX;
          const dy = e.clientY - dragStartY;
          if (!hasDragged && Math.hypot(dx, dy) > 4) {
            hasDragged = true;
          }
          if (hasDragged) {
            params.panX = initialPanX + dx;
            params.panY = initialPanY + dy;
            updateGuiDisplays();
          }
        }
      });

      window.addEventListener('pointerup', (e) => {
        if (e.target.closest('.lil-gui')) {
          isPointerDown = false;
          return;
        }

        if (isPointerDown && !hasDragged) {
          if (params.clickToRandomize) {
            randomizeScene();
          }
        }
        isPointerDown = false;
        hasDragged = false;
      });

      window.addEventListener('pointerleave', () => {
        mouseX = null;
        mouseY = null;
        isPointerDown = false;
      });

      window.addEventListener('resize', resize);
    }

    let gui;
    function updateGuiDisplays() {
      if (gui && typeof gui.controllersRecursive === 'function') {
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      }
    }

    function setupGUI() {
      gui = new GUI({ title: 'Vortex Settings' });

      // Presets & Modes
      const fPresets = gui.addFolder('Presets & Modes');
      fPresets.add(params, 'scheme', Object.keys(COLOR_SCHEMES)).name('Color Scheme').onChange(v => applyScheme(v));
      fPresets.add(params, 'animation', ANIMATION_PRESETS).name('Animation');
      fPresets.add(params, 'greenScreen').name('Green Screen (#00ff00)');
      fPresets.add(params, 'clickToRandomize').name('Click to Randomize');
      fPresets.add(params, 'randomizeNow').name('🎲 Randomize Now');

      // Post-Processing Suite Integration
      postProcessor.attachGUI(gui, 'Post-Processing Suite');

      // Colors & Shading
      const fColors = gui.addFolder('Custom Colors & Blending');
      fColors.addColor(params, 'bgColor').name('Background').onChange(() => updateAllParticleColors());
      fColors.addColor(params, 'color1').name('Color 1').onChange(() => updateAllParticleColors());
      fColors.addColor(params, 'color2').name('Color 2').onChange(() => updateAllParticleColors());
      fColors.addColor(params, 'color3').name('Color 3').onChange(() => updateAllParticleColors());
      fColors.add(params, 'particleBlendMode', ['lighter', 'source-over', 'screen', 'multiply']).name('Blend Mode');
      fColors.add(params, 'trailOpacity', 0.05, 1.0, 0.01).name('Trail Persistence');

      // Motion & Speed
      const fMotion = gui.addFolder('Motion & Speed');
      fMotion.add(params, 'speed', 0.1, 5.0, 0.1).name('Particle Speed');
      fMotion.add(params, 'animSpeed', 0.1, 3.0, 0.1).name('Camera Speed');
      fMotion.add(params, 'flow', 5, 60, 1).name('Flow Easing');

      // Geometry & Physics
      const fGeometry = gui.addFolder('Geometry & Physics');
      fGeometry.add(params, 'particleCount', 100, 1500, 25).name('Particle Count').onChange(() => initParticles());
      fGeometry.add(params, 'radiusScale', 0.3, 2.5, 0.05).name('Ring Radius');
      fGeometry.add(params, 'tiltY', 0.1, 1.0, 0.02).name('Vertical Tilt');
      fGeometry.add(params, 'particleSize', 0.2, 3.0, 0.1).name('Particle Scale');
      fGeometry.add(params, 'forceMultiplier', 0.1, 3.0, 0.1).name('Mouse Repulsion');

      // View & Rendering
      const fView = gui.addFolder('Viewport & Camera');
      fView.add(params, 'dpr', 0.5, 3.0, 0.25).name('Pixel Ratio (DPR)').onChange(() => resize());
      fView.add(params, 'zoom', 0.2, 5.0, 0.05).name('Zoom');
      fView.add(params, 'panX', -1000, 1000, 1).name('Pan X');
      fView.add(params, 'panY', -1000, 1000, 1).name('Pan Y');
      fView.add(params, 'resetView').name('Reset Camera');

      // Key shortcut 'H' to toggle GUI
      window.addEventListener('keydown', (e) => {
        if (e.key === 'h' || e.key === 'H') {
          gui._hidden ? gui.show() : gui.hide();
        }
      });
    }

    // Startup
    resize();
    initParticles();
    setupInteractions();
    setupGUI();
    requestAnimationFrame(render);
  </script>
</body>
</html>
