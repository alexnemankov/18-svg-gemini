<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procedural Curl Noise Flow</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #082852;
      overflow: hidden;
      overscroll-behavior: none;
      user-select: none;
      -webkit-user-select: none;
    }

    #loading {
      background: black;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      visibility: visible;
      opacity: 1;
      transition: visibility 1.6s, opacity 1.6s;
      pointer-events: none;
    }

    #loading .circle {
      width: 50px;
      height: 50px;
      background: white;
      border-radius: 50%;
      opacity: 0;
      transform: scale(0, 0);
      animation: circle-animation 1.6s ease-in-out 0s infinite normal none;
    }

    #loading.loaded {
      visibility: hidden;
      opacity: 0;
    }

    #container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      overflow: hidden;
    }

    #container canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 0;
      outline: none;
    }

    @keyframes circle-animation {
      0% {
        opacity: 0;
        transform: scale(0, 0);
      }
      50% {
        opacity: 1;
        transform: scale(1, 1);
      }
      100% {
        opacity: 0;
        transform: scale(0, 0);
      }
    }
  </style>

  <!-- Simplex noise library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/simplex-noise/2.4.0/simplex-noise.min.js"></script>
</head>
<body>
  <div id="loading">
    <div class="circle"></div>
  </div>
  <div id="container"></div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.121.1/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.121.1/examples/jsm/controls/OrbitControls.js';
    import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';
    import Stats from 'https://cdn.jsdelivr.net/npm/three@0.121.1/examples/jsm/libs/stats.module.js';

    // 19 preconfigured color schemes
    const COLOR_SCHEMES = {
      'Original': {
        type: 'cosine',
        a: [0.5, 0.5, 0.5],
        b: [0.5, 0.5, 0.5],
        c: [2.0, 1.0, 0.0],
        d: [0.5, 0.20, 0.25],
        bg: '#082852'
      },
      'Monochromatic': {
        type: 'palette',
        colors: ['#001a33', '#004080', '#0073e6', '#3399ff', '#80bfff', '#cce6ff', '#001a33'],
        bg: '#020b14'
      },
      'Analogous': {
        type: 'palette',
        colors: ['#03045e', '#0077b6', '#00b4d8', '#48cae4', '#90e0ef', '#52b788', '#03045e'],
        bg: '#05131e'
      },
      'Complementary': {
        type: 'palette',
        colors: ['#0f2042', '#1f4068', '#f58b54', '#e43f5a', '#ffffff', '#0f2042'],
        bg: '#0b111e'
      },
      'Split-complementary': {
        type: 'palette',
        colors: ['#1e085a', '#3f1a8c', '#ffd166', '#06d6a0', '#118ab2', '#1e085a'],
        bg: '#0e0422'
      },
      'Triadic': {
        type: 'palette',
        colors: ['#ff0055', '#ffaa00', '#00e5ff', '#7000ff', '#ff0055'],
        bg: '#140018'
      },
      'Tetradic': {
        type: 'palette',
        colors: ['#e63946', '#f4a261', '#2a9d8f', '#264653', '#8338ec', '#e63946'],
        bg: '#0f171c'
      },
      'Double split-complementary': {
        type: 'palette',
        colors: ['#7209b7', '#f72585', '#4cc9f0', '#4895ef', '#3f37c9', '#7209b7'],
        bg: '#0d061a'
      },
      'Achromatic': {
        type: 'palette',
        colors: ['#000000', '#262626', '#666666', '#cccccc', '#ffffff', '#666666', '#000000'],
        bg: '#0a0a0a'
      },
      'Achromatic + Accent': {
        type: 'palette',
        colors: ['#000000', '#222222', '#777777', '#ffffff', '#ff0033', '#777777', '#000000'],
        bg: '#0a0a0a'
      },
      'Neutral + Accent': {
        type: 'palette',
        colors: ['#1c1d21', '#393d3f', '#626868', '#d0d0d0', '#00f5d4', '#d0d0d0', '#1c1d21'],
        bg: '#111215'
      },
      'Palette 1 (F6AA1C, BC3908...)': {
        type: 'palette',
        colors: ['#F6AA1C', '#BC3908', '#941B0C', '#F6AA1C', '#220901', '#F6AA1C'],
        bg: '#220901'
      },
      'Palette 2 (63D1CF, 5BC0BE...)': {
        type: 'palette',
        colors: ['#63D1CF', '#5BC0BE', '#4BAD9E', '#4BAD9E', '#0B132B', '#000000', '#63D1CF'],
        bg: '#0B132B'
      },
      'Palette 3 (AA60C8, D69ADE...)': {
        type: 'palette',
        colors: ['#AA60C8', '#D69ADE', '#C9A3C6', '#CFB5C2', '#0D001D', '#120A12', '#AA60C8'],
        bg: '#0D001D'
      },
      'Palette 4 (FEF1BE, FFBA00...)': {
        type: 'palette',
        colors: ['#FEF1BE', '#FFBA00', '#008189', '#00474D', '#061210', '#FEF1BE'],
        bg: '#061210'
      },
      'Palette 5 (D4FFB0, 7FFF00...)': {
        type: 'palette',
        colors: ['#D4FFB0', '#7FFF00', '#00B894', '#0A3322', '#05140A', '#D4FFB0'],
        bg: '#05140A'
      },
      'Palette 6 (FFE8CC, FF8C00...)': {
        type: 'palette',
        colors: ['#FFE8CC', '#FF8C00', '#C7501A', '#3D1050', '#0E0618', '#FFE8CC'],
        bg: '#0E0618'
      },
      'Palette 7 (E8E0FF, B38FFF...)': {
        type: 'palette',
        colors: ['#E8E0FF', '#B38FFF', '#6A3DE8', '#1A1250', '#090612', '#E8E0FF'],
        bg: '#090612'
      },
      'Palette 8 (E0FBFF, 00F0FF...)': {
        type: 'palette',
        colors: ['#E0FBFF', '#00F0FF', '#D40078', '#1E0A3D', '#05020F', '#E0FBFF'],
        bg: '#05020F'
      }
    };

    /** Helper to generate 256x1 gradient canvas texture */
    function createPaletteTexture(colors) {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 1;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createLinearGradient(0, 0, 256, 0);
      colors.forEach((c, idx) => {
        grad.addColorStop(idx / (colors.length - 1), c);
      });
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 256, 1);

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.ClampToEdgeWrapping;
      texture.minFilter = THREE.LinearFilter;
      texture.magFilter = THREE.LinearFilter;
      return texture;
    }

    /** Vertex shader source */
    const vertexShaderSource = `
      varying vec2 vUv;
      varying vec3 vPosition;
      varying vec3 vNormal;

      void main() {
        vUv = uv;
        vPosition = position;
        vNormal = normalize(normalMatrix * normal);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `;

    /** Fragment shader source */
    const fragmentShaderSource = `
      uniform float uTime;
      uniform float uDashSpeed;
      uniform float uDashFreq;
      uniform float uDashThreshold;

      uniform int uUseCosine;
      uniform vec3 uPalA;
      uniform vec3 uPalB;
      uniform vec3 uPalC;
      uniform vec3 uPalD;
      uniform sampler2D uPaletteMap;

      uniform vec3 uColorTint;
      uniform float uSaturation;
      uniform float uBrightness;

      // Lighting uniforms
      uniform float uExposure;
      uniform float uLightIntensity;
      uniform vec3 uDirLightColor;
      uniform float uDirLightIntensity;
      uniform vec3 uDirLightPos;
      uniform vec3 uAmbientColor;
      uniform float uAmbientIntensity;
      uniform vec3 uPointLightColor;
      uniform float uPointLightIntensity;
      uniform vec3 uPointLightPos;

      varying vec2 vUv;
      varying vec3 vPosition;
      varying vec3 vNormal;

      vec3 pal( in float t, in vec3 a, in vec3 b, in vec3 c, in vec3 d ) {
        return a + b * cos( 6.28318530718 * (c * t + d) );
      }

      vec3 adjustSaturation(vec3 color, float sat) {
        float gray = dot(color, vec3(0.299, 0.587, 0.114));
        return mix(vec3(gray), color, sat);
      }

      void main () {
        float dash = sin(vUv.x * uDashFreq - uTime * uDashSpeed);
        if (dash < uDashThreshold) discard;

        float t = distance(vPosition, vec3(0.0, 0.0, 0.0)) - uTime * 0.5;
        vec3 baseCol;
        if (uUseCosine == 1) {
          baseCol = pal(t, uPalA, uPalB, uPalC, uPalD);
        } else {
          baseCol = texture2D(uPaletteMap, vec2(fract(t), 0.5)).rgb;
        }

        baseCol *= uColorTint;
        baseCol = adjustSaturation(baseCol, uSaturation);
        baseCol *= uBrightness;

        // Diffuse & ambient lighting calculation
        vec3 N = normalize(vNormal);

        // Ambient component
        vec3 ambient = uAmbientColor * uAmbientIntensity;

        // Directional light
        vec3 Ldir = normalize(uDirLightPos);
        float diffDir = max(dot(N, Ldir), 0.0) * 0.7 + 0.3;
        vec3 dirLighting = uDirLightColor * uDirLightIntensity * diffDir;

        // Point light
        vec3 Lpoint = normalize(uPointLightPos - vPosition);
        float diffPoint = max(dot(N, Lpoint), 0.0);
        vec3 pointLighting = uPointLightColor * uPointLightIntensity * diffPoint;

        vec3 totalLight = (ambient + dirLighting + pointLighting) * uLightIntensity;
        vec3 finalColor = baseCol * totalLight * uExposure;

        gl_FragColor = vec4(finalColor, 1.0);
      }
    `;

    class Sketch {
      constructor() {
        this.width = window.innerWidth;
        this.height = window.innerHeight;

        // Procedural & configuration settings
        this.settings = {
          // Colors & Theme
          colorScheme: 'Original',
          greenscreen: false,
          backgroundColor: '#082852',
          colorTint: '#ffffff',
          saturation: 1.0,
          brightness: 1.0,

          // Animation & Motion
          cameraAnimation: 'Gentle Orbit',
          animationSpeed: 1.0,
          dashSpeed: 5.0,
          dashFreq: 50.0,
          dashThreshold: 0.5,

          // Lighting & Exposure
          exposure: 1.0,
          sceneLightIntensity: 1.0,
          dirLightIntensity: 1.0,
          dirLightColor: '#ffffff',
          ambientIntensity: 0.6,
          ambientColor: '#ffffff',
          pointLightIntensity: 1.0,
          pointLightColor: '#ffffff',

          // Geometry & Curl parameters
          tubeCount: 220,
          tubeRadius: 0.003,
          noiseScale: 3.0,
          stepCount: 500,
          curlStep: 0.001,

          // Controls & Navigation
          mouseLeftAction: 'Rotate Camera',
          clickToRandomize: true,

          // Renderer
          dpr: Math.min(window.devicePixelRatio || 1, 2),
          antialias: true
        };

        this.animTimer = 0;
        this.userDistance = 1.0;
        const SimplexClass = (typeof SimplexNoise !== 'undefined') ? SimplexNoise : (typeof window !== 'undefined' && window.SimplexNoise ? window.SimplexNoise : null);
        if (SimplexClass) {
          this.simplex = new SimplexClass();
        } else {
          this.simplex = {
            noise3D: (x, y, z) => Math.sin(x * 1.5 + Math.cos(y * 1.5 + z * 1.5))
          };
        }

        this.initRenderer();
        this.statsInit();
        this.initScene();
        this.setupCamera();
        this.setupLights();
        this.setupMaterial();
        this.rebuildShapes();
        this.setupEvents();
        this.setupGui();

        this.render = this.render.bind(this);
        this.clock = new THREE.Clock(true);
        this.render();
      }

      initRenderer() {
        this.renderer = new THREE.WebGLRenderer({
          antialias: this.settings.antialias,
          alpha: true
        });
        this.renderer.setSize(this.width, this.height);
        this.renderer.setPixelRatio(this.settings.dpr);
        this.updateBackground();

        this.renderer.domElement.style.position = 'fixed';
        this.renderer.domElement.style.top = '0';
        this.renderer.domElement.style.left = '0';
        this.renderer.domElement.style.zIndex = '0';
        this.renderer.domElement.style.outline = 'none';

        document.getElementById('container').appendChild(this.renderer.domElement);
      }

      statsInit() {
        try {
          if (typeof Stats !== 'undefined') {
            this.stats = new Stats();
            this.stats.setMode(0);
            this.stats.domElement.style.position = 'absolute';
            this.stats.domElement.style.left = '0';
            this.stats.domElement.style.top = '0';
            document.getElementById('container').appendChild(this.stats.domElement);
          }
        } catch (e) {
          console.warn('Stats initialization skipped:', e);
        }
      }

      initScene() {
        this.scene = new THREE.Scene();
        this.tubeGroup = new THREE.Group();
        this.scene.add(this.tubeGroup);
      }

      setupCamera() {
        const fov = 70;
        this.camera = new THREE.PerspectiveCamera(fov, this.width / this.height, 0.001, 1000);
        this.camera.position.set(0, 0, 1);
        this.camera.lookAt(new THREE.Vector3(0, 0, 0));
        this.scene.add(this.camera);

        this.controls = new OrbitControls(this.camera, this.renderer.domElement);
        this.setupControlsConfig();
        this.userDistance = this.camera.position.distanceTo(this.controls.target);
      }

      setupControlsConfig() {
        this.controls.enableDamping = true;
        this.controls.dampingFactor = 0.05;
        this.controls.screenSpacePanning = true;
        this.controls.enableZoom = true;
        this.controls.enablePan = true;
        this.controls.enableRotate = true;

        if (this.settings.mouseLeftAction === 'Drag / Pan Object') {
          this.controls.mouseButtons.LEFT = THREE.MOUSE.PAN;
        } else {
          this.controls.mouseButtons.LEFT = THREE.MOUSE.ROTATE;
        }
        this.controls.mouseButtons.RIGHT = THREE.MOUSE.PAN;
        this.controls.mouseButtons.MIDDLE = THREE.MOUSE.DOLLY;

        this.controls.addEventListener('start', () => {
          this.isUserInteracting = true;
        });
        this.controls.addEventListener('end', () => {
          this.isUserInteracting = false;
        });
      }

      setupLights() {
        this.directionalLight = new THREE.DirectionalLight(this.settings.dirLightColor, this.settings.dirLightIntensity);
        this.directionalLight.position.set(2, 3, 2);
        this.scene.add(this.directionalLight);

        this.ambientLight = new THREE.AmbientLight(this.settings.ambientColor, this.settings.ambientIntensity);
        this.scene.add(this.ambientLight);

        this.pointLight = new THREE.PointLight(this.settings.pointLightColor, this.settings.pointLightIntensity, 10);
        this.pointLight.position.set(0, 1.5, 1.5);
        this.scene.add(this.pointLight);
      }

      setupMaterial() {
        this.paletteTexture = createPaletteTexture(COLOR_SCHEMES['Original'].colors || ['#ffffff', '#000000']);

        this.material = new THREE.ShaderMaterial({
          side: THREE.DoubleSide,
          uniforms: {
            uTime: { value: 0 },
            uDashSpeed: { value: this.settings.dashSpeed },
            uDashFreq: { value: this.settings.dashFreq },
            uDashThreshold: { value: this.settings.dashThreshold },

            uUseCosine: { value: 1 },
            uPalA: { value: new THREE.Vector3(0.5, 0.5, 0.5) },
            uPalB: { value: new THREE.Vector3(0.5, 0.5, 0.5) },
            uPalC: { value: new THREE.Vector3(2.0, 1.0, 0.0) },
            uPalD: { value: new THREE.Vector3(0.5, 0.20, 0.25) },
            uPaletteMap: { value: this.paletteTexture },

            uColorTint: { value: new THREE.Color(this.settings.colorTint) },
            uSaturation: { value: this.settings.saturation },
            uBrightness: { value: this.settings.brightness },

            uExposure: { value: this.settings.exposure },
            uLightIntensity: { value: this.settings.sceneLightIntensity },
            uDirLightColor: { value: new THREE.Color(this.settings.dirLightColor) },
            uDirLightIntensity: { value: this.settings.dirLightIntensity },
            uDirLightPos: { value: this.directionalLight.position },
            uAmbientColor: { value: new THREE.Color(this.settings.ambientColor) },
            uAmbientIntensity: { value: this.settings.ambientIntensity },
            uPointLightColor: { value: new THREE.Color(this.settings.pointLightColor) },
            uPointLightIntensity: { value: this.settings.pointLightIntensity },
            uPointLightPos: { value: this.pointLight.position }
          },
          vertexShader: vertexShaderSource,
          fragmentShader: fragmentShaderSource
        });

        this.applyColorScheme(this.settings.colorScheme);
      }

      applyColorScheme(schemeKey) {
        const scheme = COLOR_SCHEMES[schemeKey];
        if (!scheme) return;

        if (scheme.type === 'cosine') {
          this.material.uniforms.uUseCosine.value = 1;
          this.material.uniforms.uPalA.value.set(...scheme.a);
          this.material.uniforms.uPalB.value.set(...scheme.b);
          this.material.uniforms.uPalC.value.set(...scheme.c);
          this.material.uniforms.uPalD.value.set(...scheme.d);
        } else {
          this.material.uniforms.uUseCosine.value = 0;
          if (this.paletteTexture) this.paletteTexture.dispose();
          this.paletteTexture = createPaletteTexture(scheme.colors);
          this.material.uniforms.uPaletteMap.value = this.paletteTexture;
        }

        if (!this.settings.greenscreen) {
          this.settings.backgroundColor = scheme.bg || '#082852';
          this.updateBackground();
        }
      }

      updateBackground() {
        const hex = this.settings.greenscreen ? '#00ff00' : this.settings.backgroundColor;
        const color = new THREE.Color(hex);
        this.renderer.setClearColor(color, 1.0);
        document.body.style.backgroundColor = hex;
      }

      updateLights() {
        this.directionalLight.color.set(this.settings.dirLightColor);
        this.directionalLight.intensity = this.settings.dirLightIntensity;
        this.ambientLight.color.set(this.settings.ambientColor);
        this.ambientLight.intensity = this.settings.ambientIntensity;
        this.pointLight.color.set(this.settings.pointLightColor);
        this.pointLight.intensity = this.settings.pointLightIntensity;

        this.material.uniforms.uExposure.value = this.settings.exposure;
        this.material.uniforms.uLightIntensity.value = this.settings.sceneLightIntensity;
        this.material.uniforms.uDirLightColor.value.set(this.settings.dirLightColor);
        this.material.uniforms.uDirLightIntensity.value = this.settings.dirLightIntensity;
        this.material.uniforms.uAmbientColor.value.set(this.settings.ambientColor);
        this.material.uniforms.uAmbientIntensity.value = this.settings.ambientIntensity;
        this.material.uniforms.uPointLightColor.value.set(this.settings.pointLightColor);
        this.material.uniforms.uPointLightIntensity.value = this.settings.pointLightIntensity;
      }

      computeCurl(x, y, z) {
        const eps = 0.0001;
        const curl = new THREE.Vector3();

        // Rate of change in YZ plane
        let n1 = this.simplex.noise3D(x, y + eps, z);
        let n2 = this.simplex.noise3D(x, y - eps, z);
        let a = (n1 - n2) / (2 * eps);
        n1 = this.simplex.noise3D(x, y, z + eps);
        n2 = this.simplex.noise3D(x, y, z - eps);
        let b = (n1 - n2) / (2 * eps);
        curl.x = a - b;

        // Rate of change in XZ plane
        n1 = this.simplex.noise3D(x, y, z + eps);
        n2 = this.simplex.noise3D(x, y, z - eps);
        a = (n1 - n2) / (2 * eps);
        n1 = this.simplex.noise3D(x + eps, y, z);
        n2 = this.simplex.noise3D(x - eps, y, z);
        b = (n1 - n2) / (2 * eps);
        curl.y = a - b;

        // Rate of change in XY plane
        n1 = this.simplex.noise3D(x + eps, y, z);
        n2 = this.simplex.noise3D(x - eps, y, z);
        a = (n1 - n2) / (2 * eps);
        n1 = this.simplex.noise3D(x, y + eps, z);
        n2 = this.simplex.noise3D(x, y - eps, z);
        b = (n1 - n2) / (2 * eps);
        curl.z = a - b;

        return curl;
      }

      getCurve(start) {
        const scale = this.settings.noiseScale;
        const stepCount = this.settings.stepCount;
        const curlStep = this.settings.curlStep;
        const points = [];

        points.push(start);
        let curPoint = start.clone();

        for (let i = 0; i < stepCount; i++) {
          const v = this.computeCurl(curPoint.x / scale, curPoint.y / scale, curPoint.z / scale);
          curPoint.addScaledVector(v, curlStep);
          points.push(curPoint.clone());
        }

        return points;
      }

      rebuildShapes() {
        while (this.tubeGroup.children.length > 0) {
          const mesh = this.tubeGroup.children[0];
          if (mesh.geometry) mesh.geometry.dispose();
          this.tubeGroup.remove(mesh);
        }

        this.material.uniforms.uDashFreq.value = this.settings.dashFreq;
        this.material.uniforms.uDashSpeed.value = this.settings.dashSpeed;

        const count = this.settings.tubeCount;
        const radius = this.settings.tubeRadius;

        for (let i = 0; i < count; i++) {
          const start = new THREE.Vector3(
            Math.random() - 0.5,
            Math.random() - 0.5,
            Math.random() - 0.5
          );
          const curvePoints = this.getCurve(start);
          const path = new THREE.CatmullRomCurve3(curvePoints);
          const geom = new THREE.TubeBufferGeometry(path, 16, radius, 6, false);
          const mesh = new THREE.Mesh(geom, this.material);
          this.tubeGroup.add(mesh);
        }
      }

      recreateRenderer(antialias) {
        const container = document.getElementById('container');
        const oldCanvas = this.renderer.domElement;

        const camPos = this.camera.position.clone();
        const camTarget = this.controls.target.clone();

        this.controls.dispose();
        this.renderer.dispose();
        if (oldCanvas && oldCanvas.parentNode) {
          oldCanvas.parentNode.removeChild(oldCanvas);
        }

        this.renderer = new THREE.WebGLRenderer({
          antialias: antialias,
          alpha: true
        });
        this.renderer.setSize(this.width, this.height);
        this.renderer.setPixelRatio(this.settings.dpr);
        this.updateBackground();

        this.renderer.domElement.style.position = 'fixed';
        this.renderer.domElement.style.top = '0';
        this.renderer.domElement.style.left = '0';
        this.renderer.domElement.style.zIndex = '0';
        this.renderer.domElement.style.outline = 'none';

        container.appendChild(this.renderer.domElement);

        this.controls = new OrbitControls(this.camera, this.renderer.domElement);
        this.camera.position.copy(camPos);
        this.controls.target.copy(camTarget);
        this.setupControlsConfig();
        this.setupCanvasEvents();
      }

      applyCameraAnimation(dt) {
        if (this.settings.cameraAnimation === 'Static (No Camera Move)') {
          return;
        }

        const offset = new THREE.Vector3().copy(this.camera.position).sub(this.controls.target);
        const currentDist = offset.length();
        if (currentDist < 0.0001) return;

        const spherical = new THREE.Spherical().setFromVector3(offset);

        if (this.isUserInteracting) {
          this.userDistance = currentDist;
          return;
        }

        if (Math.abs(currentDist - this.userDistance) > 0.001) {
          this.userDistance = currentDist;
        }

        this.animTimer += dt * this.settings.animationSpeed;
        const speed = this.settings.animationSpeed;

        switch (this.settings.cameraAnimation) {
          case 'Gentle Orbit': {
            spherical.theta += 0.22 * dt * speed;
            break;
          }
          case 'Slow Figure-8': {
            spherical.theta += 0.18 * dt * speed;
            const phiDelta = Math.sin(this.animTimer * 0.7) * 0.002 * speed;
            spherical.phi = THREE.MathUtils.clamp(spherical.phi + phiDelta, 0.2, Math.PI - 0.2);
            break;
          }
          case 'Vertical Bob & Sway': {
            spherical.theta += Math.sin(this.animTimer * 0.5) * 0.003 * speed;
            const phiDelta = Math.cos(this.animTimer * 0.8) * 0.0025 * speed;
            spherical.phi = THREE.MathUtils.clamp(spherical.phi + phiDelta, 0.2, Math.PI - 0.2);
            break;
          }
          case 'Spiral Drift': {
            spherical.theta += 0.25 * dt * speed;
            const phiDelta = Math.sin(this.animTimer * 0.35) * 0.003 * speed;
            spherical.phi = THREE.MathUtils.clamp(spherical.phi + phiDelta, 0.2, Math.PI - 0.2);
            break;
          }
          case 'Breathing Dolly': {
            spherical.theta += 0.08 * dt * speed;
            const pulse = 1.0 + Math.sin(this.animTimer * 1.2) * 0.08;
            spherical.radius = this.userDistance * pulse;
            break;
          }
          case 'Cinematic Sweep': {
            spherical.theta += 0.16 * dt * speed;
            const phiDelta = Math.sin(this.animTimer * 0.4) * 0.002 * speed;
            spherical.phi = THREE.MathUtils.clamp(spherical.phi + phiDelta, 0.2, Math.PI - 0.2);
            break;
          }
          case 'Elliptical Flyaround': {
            spherical.theta += 0.24 * dt * speed;
            const ellipsePulse = 1.0 + Math.cos(spherical.theta * 2.0) * 0.12;
            spherical.radius = this.userDistance * ellipsePulse;
            break;
          }
        }

        offset.setFromSpherical(spherical);
        this.camera.position.copy(this.controls.target).add(offset);
        this.camera.lookAt(this.controls.target);
      }

      randomizeScene() {
        // 1. Pick a random color scheme from 19 schemes
        const schemeNames = Object.keys(COLOR_SCHEMES);
        const randomScheme = schemeNames[Math.floor(Math.random() * schemeNames.length)];
        this.settings.colorScheme = randomScheme;
        this.applyColorScheme(randomScheme);

        if (!this.settings.greenscreen) {
          const scheme = COLOR_SCHEMES[randomScheme];
          this.settings.backgroundColor = scheme.bg || '#082852';
          this.updateBackground();
        }

        // 2. Re-roll geometric parameters
        this.settings.tubeCount = Math.floor(THREE.MathUtils.randFloat(150, 280));
        this.settings.tubeRadius = parseFloat(THREE.MathUtils.randFloat(0.002, 0.005).toFixed(4));
        this.settings.noiseScale = parseFloat(THREE.MathUtils.randFloat(1.8, 4.8).toFixed(2));
        this.settings.stepCount = Math.floor(THREE.MathUtils.randFloat(350, 650));
        this.settings.curlStep = parseFloat(THREE.MathUtils.randFloat(0.0007, 0.0016).toFixed(4));
        this.settings.dashFreq = parseFloat(THREE.MathUtils.randFloat(30.0, 75.0).toFixed(1));
        this.settings.dashSpeed = parseFloat(THREE.MathUtils.randFloat(2.5, 7.5).toFixed(1));

        // 3. Re-roll motion parameters
        this.settings.animationSpeed = parseFloat(THREE.MathUtils.randFloat(0.7, 1.7).toFixed(2));
        const animations = [
          'Static (No Camera Move)',
          'Gentle Orbit',
          'Slow Figure-8',
          'Vertical Bob & Sway',
          'Spiral Drift',
          'Breathing Dolly',
          'Cinematic Sweep',
          'Elliptical Flyaround'
        ];
        this.settings.cameraAnimation = animations[Math.floor(Math.random() * animations.length)];

        // 4. Re-roll lighting parameters
        this.settings.exposure = parseFloat(THREE.MathUtils.randFloat(0.85, 1.35).toFixed(2));
        this.settings.dirLightIntensity = parseFloat(THREE.MathUtils.randFloat(0.7, 1.4).toFixed(2));
        this.settings.ambientIntensity = parseFloat(THREE.MathUtils.randFloat(0.4, 0.8).toFixed(2));
        this.settings.pointLightIntensity = parseFloat(THREE.MathUtils.randFloat(0.6, 1.5).toFixed(2));
        this.updateLights();

        // 5. Re-seed SimplexNoise and rebuild geometry
        const Simplex = (typeof SimplexNoise !== 'undefined') ? SimplexNoise : (typeof window !== 'undefined' && window.SimplexNoise ? window.SimplexNoise : null);
        if (Simplex) {
          this.simplex = new Simplex(Math.random);
        }
        this.rebuildShapes();

        // 6. Recursively update all GUI displays
        const updateFolder = (folder) => {
          if (folder.controllers) folder.controllers.forEach(c => c.updateDisplay());
          if (folder.folders) folder.folders.forEach(f => updateFolder(f));
        };
        updateFolder(this.gui);
      }

      setupCanvasEvents() {
        const canvas = this.renderer.domElement;
        let pointerDownPos = { x: 0, y: 0 };
        let pointerDownTime = 0;

        canvas.addEventListener('pointerdown', (e) => {
          pointerDownPos = { x: e.clientX, y: e.clientY };
          pointerDownTime = Date.now();
        });

        canvas.addEventListener('pointerup', (e) => {
          const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
          const duration = Date.now() - pointerDownTime;

          // Detect clean click without drag on scene
          if (dist < 6 && duration < 300 && this.settings.clickToRandomize) {
            this.randomizeScene();
          }
        });
      }

      setupEvents() {
        this.setupCanvasEvents();

        window.addEventListener('resize', () => {
          this.width = window.innerWidth;
          this.height = window.innerHeight;
          this.camera.aspect = this.width / this.height;
          this.camera.updateProjectionMatrix();
          this.renderer.setSize(this.width, this.height);
        });

        window.addEventListener('wheel', () => {
          setTimeout(() => {
            if (this.camera && this.controls) {
              this.userDistance = this.camera.position.distanceTo(this.controls.target);
            }
          }, 30);
        }, { passive: true });

        // Toggle UI visibility with 'H' key
        let uiVisible = true;
        window.addEventListener('keydown', (e) => {
          if (e.key === 'h' || e.key === 'H') {
            uiVisible = !uiVisible;
            if (this.gui) {
              this.gui.domElement.style.display = uiVisible ? '' : 'none';
            }
            if (this.stats) {
              this.stats.domElement.style.display = uiVisible ? '' : 'none';
            }
          }
        });
      }

      setupGui() {
        this.gui = new GUI({ title: 'Scene Settings' });

        // Colors & Theme Folder
        const colorFolder = this.gui.addFolder('Colors & Theme');
        colorFolder.add(this.settings, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Color Scheme').onChange(val => {
          this.applyColorScheme(val);
        });
        colorFolder.add(this.settings, 'greenscreen').name('Green Screen (#00ff00)').onChange(() => {
          this.updateBackground();
        });
        colorFolder.addColor(this.settings, 'backgroundColor').name('Background Color').onChange(() => {
          this.updateBackground();
        });
        colorFolder.addColor(this.settings, 'colorTint').name('Color Tint').onChange(val => {
          this.material.uniforms.uColorTint.value.set(val);
        });
        colorFolder.add(this.settings, 'saturation', 0.0, 2.0, 0.05).name('Saturation').onChange(val => {
          this.material.uniforms.uSaturation.value = val;
        });
        colorFolder.add(this.settings, 'brightness', 0.0, 2.0, 0.05).name('Brightness').onChange(val => {
          this.material.uniforms.uBrightness.value = val;
        });

        // Animation & Motion Folder
        const motionFolder = this.gui.addFolder('Animation & Motion');
        motionFolder.add(this.settings, 'cameraAnimation', [
          'Static (No Camera Move)',
          'Gentle Orbit',
          'Slow Figure-8',
          'Vertical Bob & Sway',
          'Spiral Drift',
          'Breathing Dolly',
          'Cinematic Sweep',
          'Elliptical Flyaround'
        ]).name('Camera Animation');
        motionFolder.add(this.settings, 'animationSpeed', 0.0, 3.0, 0.05).name('Animation Speed');
        motionFolder.add(this.settings, 'dashSpeed', 0.0, 15.0, 0.1).name('Dash Speed').onChange(val => {
          this.material.uniforms.uDashSpeed.value = val;
        });
        motionFolder.add(this.settings, 'dashFreq', 10.0, 120.0, 1.0).name('Dash Frequency').onChange(val => {
          this.material.uniforms.uDashFreq.value = val;
        });

        // Lighting & Exposure Folder
        const lightFolder = this.gui.addFolder('Lighting & Exposure');
        lightFolder.add(this.settings, 'exposure', 0.1, 3.0, 0.05).name('Scene Exposure').onChange(val => {
          this.material.uniforms.uExposure.value = val;
        });
        lightFolder.add(this.settings, 'sceneLightIntensity', 0.1, 3.0, 0.05).name('Scene Light Intensity').onChange(val => {
          this.material.uniforms.uLightIntensity.value = val;
        });
        lightFolder.add(this.settings, 'dirLightIntensity', 0.0, 3.0, 0.05).name('Dir Light Intensity').onChange(() => {
          this.updateLights();
        });
        lightFolder.addColor(this.settings, 'dirLightColor').name('Dir Light Color').onChange(() => {
          this.updateLights();
        });
        lightFolder.add(this.settings, 'ambientIntensity', 0.0, 2.0, 0.05).name('Ambient Intensity').onChange(() => {
          this.updateLights();
        });
        lightFolder.addColor(this.settings, 'ambientColor').name('Ambient Color').onChange(() => {
          this.updateLights();
        });
        lightFolder.add(this.settings, 'pointLightIntensity', 0.0, 3.0, 0.05).name('Point Light Intensity').onChange(() => {
          this.updateLights();
        });
        lightFolder.addColor(this.settings, 'pointLightColor').name('Point Light Color').onChange(() => {
          this.updateLights();
        });

        // Geometry & Noise Folder
        const geomFolder = this.gui.addFolder('Geometry & Noise');
        geomFolder.add(this.settings, 'tubeCount', 50, 350, 10).name('Tube Count').onFinishChange(() => {
          this.rebuildShapes();
        });
        geomFolder.add(this.settings, 'tubeRadius', 0.001, 0.008, 0.0005).name('Tube Radius').onFinishChange(() => {
          this.rebuildShapes();
        });
        geomFolder.add(this.settings, 'noiseScale', 1.0, 8.0, 0.1).name('Noise Scale').onFinishChange(() => {
          this.rebuildShapes();
        });
        geomFolder.add(this.settings, 'stepCount', 200, 900, 50).name('Curve Steps').onFinishChange(() => {
          this.rebuildShapes();
        });
        geomFolder.add(this.settings, 'curlStep', 0.0005, 0.003, 0.0001).name('Curl Step Rate').onFinishChange(() => {
          this.rebuildShapes();
        });
        geomFolder.add({ rebuild: () => this.rebuildShapes() }, 'rebuild').name('Re-roll Geometry');

        // Controls & Navigation Folder
        const controlFolder = this.gui.addFolder('Controls & Navigation');
        controlFolder.add(this.settings, 'mouseLeftAction', ['Rotate Camera', 'Drag / Pan Object']).name('Left Mouse Action').onChange(val => {
          if (val === 'Drag / Pan Object') {
            this.controls.mouseButtons.LEFT = THREE.MOUSE.PAN;
          } else {
            this.controls.mouseButtons.LEFT = THREE.MOUSE.ROTATE;
          }
        });
        controlFolder.add(this.settings, 'clickToRandomize').name('Click Scene Randomizes');
        controlFolder.add({
          resetView: () => {
            this.camera.position.set(0, 0, 1);
            this.controls.target.set(0, 0, 0);
            this.controls.update();
            this.userDistance = 1.0;
          }
        }, 'resetView').name('Reset Camera View');

        // Renderer Folder
        const renderFolder = this.gui.addFolder('Renderer');
        renderFolder.add(this.settings, 'dpr', 0.5, 3.0, 0.1).name('Pixel Ratio (DPR)').onChange(val => {
          this.renderer.setPixelRatio(val);
          this.renderer.setSize(this.width, this.height);
        });
        renderFolder.add(this.settings, 'antialias').name('Antialias').onChange(val => {
          this.recreateRenderer(val);
        });
      }

      render() {
        if (this.stats) this.stats.begin();

        const dt = this.clock.getDelta();
        const elapsedTime = this.clock.getElapsedTime();

        // Update shader uTime
        this.material.uniforms.uTime.value = elapsedTime;

        // Apply camera animation (preserving user zoom and orientation deltas)
        this.applyCameraAnimation(dt);

        this.controls.update();
        this.renderer.render(this.scene, this.camera);

        if (this.stats) this.stats.end();
        requestAnimationFrame(this.render);
      }
    }

    window.addEventListener('load', () => {
      const loading = document.getElementById('loading');
      if (loading) loading.classList.add('loaded');
      new Sketch();
    });
  </script>
</body>
</html>
