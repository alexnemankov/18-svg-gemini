<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doyle Spiral - Conformal Möbius Geometry</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #E9F0C9;
      margin: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    #canv {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      cursor: grab;
      touch-action: none;
    }

    #canv.is-dragging {
      cursor: grabbing;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
    }
  }
  </script>
</head>
<body>
  <canvas id="canv"></canvas>

  <script type="module">
    import * as THREE from 'three';
    import GUI from 'lil-gui';

    // =========================================================================================
    // POST PROCESSOR SUITE (Inlined from postprocessing/PostProcessor.js for Standalone Execution)
    // =========================================================================================
    const orthoVertexShader = `
    precision highp float;
    in vec3 position;
    out vec2 vUv;
    void main() {
      vUv = position.xy * 0.5 + 0.5;
      gl_Position = vec4(position, 1.0);
    }
    `;

    const brightFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float bloomThreshold;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float luminance = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float knee = 0.1;
      float soft = luminance - bloomThreshold + knee;
      soft = clamp(soft, 0.0, 2.0 * knee);
      soft = (soft * soft) / (4.0 * knee + 0.00001);
      float contribution = max(soft, luminance - bloomThreshold);
      contribution /= max(luminance, 0.00001);
      fragColor = vec4(color.rgb * contribution, color.a);
    }
    `;

    const blur13ShaderChunk = `
    vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
      vec2 resolution = vec2(textureSize(image, 0));
      vec4 color = vec4(0.0);
      vec2 off1 = vec2(1.411764705882353) * direction;
      vec2 off2 = vec2(3.2941176470588234) * direction;
      vec2 off3 = vec2(5.176470588235294) * direction;
      color += texture(image, uv) * 0.1964825501511404;
      color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
      color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
      return color;
    }
    `;

    const blurFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 direction;
    in vec2 vUv;
    out vec4 color;
    ${blur13ShaderChunk}
    void main() {
      color = blur13(inputTexture, vUv, direction);
    }
    `;

    const finalFragmentShader = `
    precision highp float;
    uniform vec2 resolution;
    uniform sampler2D inputTexture;
    uniform sampler2D blur0Texture;
    uniform sampler2D blur1Texture;
    uniform sampler2D blur2Texture;
    uniform sampler2D blur3Texture;
    uniform sampler2D blur4Texture;
    uniform bool bloomEnabled;
    uniform float bloomStrength;
    uniform float vignetteBoost;
    uniform float vignetteReduction;
    uniform float noiseIntensity;
    uniform float time;
    in vec2 vUv;
    out vec4 fragColor;

    float vignette(vec2 uv, float boost, float reduction) {
      vec2 position = vUv - 0.5;
      return boost - length(position) * reduction;
    }

    float hash1(uint n) {
      n = (n << 13U) ^ n;
      n = n * (n * n * 15731U + 789221U) + 1376312589U;
      return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
    }

    float noise(in vec2 uv, in float timeVal) {
      uvec2 p = uvec2(uv);
      return hash1(p.x + 1920U * p.y + (1920U * 1080U) * uint(timeVal));
    }

    void main() {
      vec4 color = texture(inputTexture, vUv);

      if (bloomEnabled && bloomStrength > 0.001) {
        vec4 b0 = texture(blur0Texture, vUv);
        vec4 b1 = texture(blur1Texture, vUv);
        vec4 b2 = texture(blur2Texture, vUv);
        vec4 b3 = texture(blur3Texture, vUv);
        vec4 b4 = texture(blur4Texture, vUv);

        vec4 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
        color += bloomSum * bloomStrength;
      }

      color.rgb *= vignette(vUv, vignetteBoost, vignetteReduction);
      color.rgb += noiseIntensity * noise(gl_FragCoord.xy, time);
      fragColor = vec4(color.rgb, 1.0);
    }
    `;

    const chromaticAberrationShaderChunk = `
    vec2 barrelDistortion(vec2 coord, float amt) {
      vec2 cc = coord - 0.5;
      float dist = dot(cc, cc);
      return coord + cc * dist * amt;
    }
    float sat(float t) { return clamp(t, 0.0, 1.0); }
    float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
    float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
    vec4 spectrum_offset(float t) {
      float lo = step(t, 0.5);
      float hi = 1.0 - lo;
      float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
      vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
      return pow(ret, vec4(1.0 / 2.2));
    }
    const float max_distort = 2.2;
    const int num_iter = 8;
    const float reci_num_iter_f = 1.0 / float(num_iter);
    vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
      vec4 sumcol = vec4(0.0);
      vec4 sumw = vec4(0.0);
      for (int i = 0; i < num_iter; ++i) {
        float t = float(i) * reci_num_iter_f;
        vec4 w = spectrum_offset(t);
        sumw += w;
        sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
      }
      return sumcol / sumw;
    }
    `;

    const colorFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float chromaticAberrationAmount;
    uniform float minInputLevel;
    uniform float maxInputLevel;
    uniform float gammaLevel;
    uniform float fisheyeStrength;
    uniform float fisheyeRadius;
    uniform float time;
    in vec2 vUv;
    out vec4 fragColor;

    ${chromaticAberrationShaderChunk}

    vec2 applyFisheye(vec2 uv, float strength, float radius) {
      if (abs(strength) < 0.0001) return uv;
      vec2 p = uv - 0.5;
      float d = length(p);
      if (d > radius * 1.5) return uv;
      float r = d / max(radius, 0.001);
      float theta = atan(p.y, p.x);
      float rDist = r + strength * (r * r * r);
      return 0.5 + vec2(cos(theta), sin(theta)) * (rDist * radius);
    }

    vec3 gammaCorrect(vec3 color, vec3 gamma) {
      return pow(max(color, vec3(0.0)), 1.0 / gamma);
    }
    vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
      return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
    }
    vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
      return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
    }
    void main() {
      vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
      fragColor = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
      fragColor.rgb = finalLevels(fragColor.rgb, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
      fragColor.a = 1.0;
    }
    `;

    const copyFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      fragColor = texture(inputTexture, vUv);
    }
    `;

    function createFBO(w, h, options = {}) {
      return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
        wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
        wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
        minFilter: options.minFilter || THREE.LinearFilter,
        magFilter: options.magFilter || THREE.LinearFilter,
        format: options.format || THREE.RGBAFormat,
        type: options.type || THREE.HalfFloatType,
        stencilBuffer: options.stencilBuffer || false,
        depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : true,
        samples: options.samples || 0,
      });
    }

    class ShaderPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbo = createFBO(1, 1, options);
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
        this.texture = this.fbo.texture;
      }
      render(renderer, toScreen = false) {
        if (!toScreen) {
          renderer.setRenderTarget(this.fbo);
        }
        renderer.render(this.orthoScene, this.orthoCamera);
        if (!toScreen) {
          renderer.setRenderTarget(null);
        }
      }
      setSize(width, height) {
        this.fbo.setSize(Math.max(1, width), Math.max(1, height));
        this.orthoQuad.scale.set(width, height, 1);
      }
    }

    class ShaderPingPongPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
        this.currentFBO = 0;
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
      }
      render(renderer) {
        renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
        renderer.render(this.orthoScene, this.orthoCamera);
        renderer.setRenderTarget(null);
        this.currentFBO = 1 - this.currentFBO;
      }
      get current() { return this.fbos[this.currentFBO]; }
      get texture() { return this.current.texture; }
      setSize(width, height) {
        const w = Math.max(1, width);
        const h = Math.max(1, height);
        this.orthoQuad.scale.set(w, h, 1);
        this.fbos[0].setSize(w, h);
        this.fbos[1].setSize(w, h);
      }
    }

    class BloomPass {
      constructor(strength = 0.8, radius = 0.5, threshold = 0.2, levels = 5) {
        this.strength = strength;
        this.radius = radius;
        this.threshold = threshold;
        this.enabled = true;
        this.levels = levels;

        this.brightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            bloomThreshold: { value: this.threshold },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: brightFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.brightPass = new ShaderPass(this.brightShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.blurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            direction: { value: new THREE.Vector2(0, 1) },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: blurFragmentShader,
          glslVersion: THREE.GLSL3,
        });

        this.blurPasses = [];
        for (let i = 0; i < this.levels; i++) {
          this.blurPasses.push(new ShaderPingPongPass(this.blurShader, {
            format: THREE.RGBAFormat,
            type: THREE.HalfFloatType,
          }));
        }
      }

      setSize(w, h) {
        let tw = Math.max(1, w);
        let th = Math.max(1, h);
        this.brightPass.setSize(tw, th);
        for (let i = 0; i < this.levels; i++) {
          tw = Math.max(1, Math.round(tw / 2));
          th = Math.max(1, Math.round(th / 2));
          this.blurPasses[i].setSize(tw, th);
        }
      }

      set source(texture) {
        this.brightShader.uniforms.inputTexture.value = texture;
      }

      render(renderer) {
        if (!this.enabled || this.strength <= 0.001) return;

        this.brightShader.uniforms.bloomThreshold.value = this.threshold;
        this.brightPass.render(renderer);

        const baseOffset = Math.max(0.1, this.radius * 2.0);
        const u = this.blurShader.uniforms;

        for (let j = 0; j < this.levels; j++) {
          const blurPass = this.blurPasses[j];
          const stepOffset = baseOffset * (1.0 + j * 0.5);

          u.direction.value.set(stepOffset, 0);
          u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
          blurPass.render(renderer);

          u.direction.value.set(0, stepOffset * 0.5);
          u.inputTexture.value = blurPass.current.texture;
          blurPass.render(renderer);
        }
      }
    }

    class PostProcessor {
      constructor(renderer, params = {}) {
        this.renderer = renderer;

        this.settings = {
          enabled: params.enabled !== undefined ? params.enabled : true,
          bloomEnabled: params.bloomEnabled !== undefined ? params.bloomEnabled : true,
          bloomStrength: params.bloomStrength !== undefined ? params.bloomStrength : 0.8,
          bloomRadius: params.bloomRadius !== undefined ? params.bloomRadius : 0.5,
          bloomThreshold: params.bloomThreshold !== undefined ? params.bloomThreshold : 0.2,

          fisheyeStrength: params.fisheyeStrength !== undefined ? params.fisheyeStrength : 0.0,
          fisheyeRadius: params.fisheyeRadius !== undefined ? params.fisheyeRadius : 1.0,
          chromaticAberration: params.chromaticAberration !== undefined ? params.chromaticAberration : 0.04,
          vignetteBoost: params.vignetteBoost !== undefined ? params.vignetteBoost : 1.0,
          vignetteReduction: params.vignetteReduction !== undefined ? params.vignetteReduction : 0.5,
          noiseIntensity: params.noiseIntensity !== undefined ? params.noiseIntensity : 0.02,

          gamma: params.gamma !== undefined ? params.gamma : 1.0,
          minInputLevel: params.minInputLevel !== undefined ? params.minInputLevel : 0.0,
          maxInputLevel: params.maxInputLevel !== undefined ? params.maxInputLevel : 1.0,
        };

        this.sceneTarget = createFBO(1, 1, { type: THREE.HalfFloatType });

        this.bloomPass = new BloomPass(
          this.settings.bloomStrength,
          this.settings.bloomRadius,
          this.settings.bloomThreshold,
          5
        );

        this.finalShader = new THREE.RawShaderMaterial({
          uniforms: {
            resolution: { value: new THREE.Vector2(1, 1) },
            bloomEnabled: { value: this.settings.bloomEnabled },
            bloomStrength: { value: this.settings.bloomStrength },
            vignetteBoost: { value: this.settings.vignetteBoost },
            vignetteReduction: { value: this.settings.vignetteReduction },
            noiseIntensity: { value: this.settings.noiseIntensity },
            inputTexture: { value: null },
            blur0Texture: { value: null },
            blur1Texture: { value: null },
            blur2Texture: { value: null },
            blur3Texture: { value: null },
            blur4Texture: { value: null },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: finalFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.finalPass = new ShaderPass(this.finalShader);

        this.rgbShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: this.finalPass.texture },
            fisheyeStrength: { value: this.settings.fisheyeStrength },
            fisheyeRadius: { value: this.settings.fisheyeRadius },
            chromaticAberrationAmount: { value: this.settings.chromaticAberration },
            minInputLevel: { value: this.settings.minInputLevel },
            maxInputLevel: { value: this.settings.maxInputLevel },
            gammaLevel: { value: this.settings.gamma },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: colorFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.rgbPass = new ShaderPass(this.rgbShader);

        this.copyShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: copyFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.copyPass = new ShaderPass(this.copyShader);
      }

      updateSettings() {
        this.bloomPass.enabled = this.settings.bloomEnabled;
        this.bloomPass.strength = this.settings.bloomStrength;
        this.bloomPass.radius = this.settings.bloomRadius;
        this.bloomPass.threshold = this.settings.bloomThreshold;

        this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
        this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
        this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
        this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
        this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;

        this.rgbShader.uniforms.fisheyeStrength.value = this.settings.fisheyeStrength;
        this.rgbShader.uniforms.fisheyeRadius.value = this.settings.fisheyeRadius;
        this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
        this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
        this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
        this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
      }

      setSize(w0, h0, dpr = 1) {
        const w = Math.max(1, Math.floor(w0 * dpr));
        const h = Math.max(1, Math.floor(h0 * dpr));
        this.sceneTarget.setSize(w, h);
        this.finalPass.setSize(w, h);
        this.finalShader.uniforms.resolution.value.set(w, h);
        this.bloomPass.setSize(w, h);
        this.rgbPass.setSize(w, h);
        this.copyPass.setSize(w, h);
      }

      renderScene(scene, camera) {
        if (!this.settings.enabled) {
          this.renderer.render(scene, camera);
          return;
        }
        this.renderer.setRenderTarget(this.sceneTarget);
        this.renderer.render(scene, camera);
        this.renderer.setRenderTarget(null);
        this.render(this.sceneTarget.texture);
      }

      render(sourceTexture) {
        if (!this.settings.enabled) {
          this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
          this.copyPass.render(this.renderer, true);
          return;
        }

        this.updateSettings();

        this.bloomPass.source = sourceTexture;
        this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
        this.bloomPass.render(this.renderer);

        this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
        this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
        this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
        this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
        this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

        const randomTime = Math.random() * 100000;
        this.finalPass.shader.uniforms.time.value = randomTime;
        this.rgbPass.shader.uniforms.time.value = randomTime;

        this.finalPass.render(this.renderer);
        this.rgbPass.render(this.renderer, true);
      }

      attachGUI(gui, title = "Post-Processing Suite") {
        const root = gui.addFolder(title);
        root.add(this.settings, "enabled").name("Enable Suite");

        const bloom = root.addFolder("Bloom");
        bloom.add(this.settings, "bloomEnabled").name("Enable Bloom").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomStrength", 0, 3.0, 0.05).name("Strength").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomRadius", 0, 2.0, 0.05).name("Radius").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomThreshold", 0, 1.0, 0.01).name("Threshold").onChange(() => this.updateSettings());

        const lens = root.addFolder("Lens, Optics & Fisheye");
        lens.add(this.settings, "fisheyeStrength", -1.0, 1.5, 0.01).name("Fisheye Distortion").onChange(() => this.updateSettings());
        lens.add(this.settings, "fisheyeRadius", 0.2, 2.0, 0.05).name("Fisheye Radius").onChange(() => this.updateSettings());
        lens.add(this.settings, "chromaticAberration", 0, 0.2, 0.005).name("Chromatic Aberration").onChange(() => this.updateSettings());
        lens.add(this.settings, "vignetteBoost", 0, 2.0, 0.05).name("Vignette Boost").onChange(() => this.updateSettings());
        lens.add(this.settings, "vignetteReduction", 0, 2.0, 0.05).name("Vignette Falloff").onChange(() => this.updateSettings());
        lens.add(this.settings, "noiseIntensity", 0, 0.1, 0.005).name("Film Grain").onChange(() => this.updateSettings());
        lens.add(this.settings, "gamma", 0.2, 2.0, 0.05).name("Gamma").onChange(() => this.updateSettings());
        lens.add(this.settings, "minInputLevel", 0, 0.5, 0.01).name("Black Level").onChange(() => this.updateSettings());
        lens.add(this.settings, "maxInputLevel", 0.5, 1.0, 0.01).name("White Level").onChange(() => this.updateSettings());

        return root;
      }
    }

    // ============================================================
    // Complex Number Operations & Möbius Transformation
    // ============================================================
    function cmul(w, z) {
      return [
        w[0] * z[0] - w[1] * z[1],
        w[0] * z[1] + w[1] * z[0]
      ];
    }

    function csub(w, z) {
      return [w[0] - z[0], w[1] - z[1]];
    }

    function modulus(p) {
      return Math.sqrt(p[0] * p[0] + p[1] * p[1]);
    }

    function crecip(z) {
      const d = z[0] * z[0] + z[1] * z[1];
      return [z[0] / d, -z[1] / d];
    }

    function cpow(z, n) {
      const mod = Math.pow(modulus(z), n);
      const arg = Math.atan2(z[1], z[0]) * n;
      return [mod * Math.cos(arg), mod * Math.sin(arg)];
    }

    function möb(p) {
      const x = p[0];
      const y = p[1];
      const denom = (x + 1) * (x + 1) + y * y;
      return [(x * x - 1 + y * y) / denom, 2 * y / denom];
    }

    // ============================================================
    // Doyle Spiral Mathematical Solver (Robin Houston)
    // ============================================================
    function doyle(p, q) {
      const pow = Math.pow;
      const sin = Math.sin;
      const cos = Math.cos;
      const pi = Math.PI;

      function _d(z, t, p, q) {
        const w = pow(z, p / q);
        const s = (p * t + 2 * pi) / q;
        return (
          pow(z * cos(t) - w * cos(s), 2) +
          pow(z * sin(t) - w * sin(s), 2)
        );
      }

      function ddz_d(z, t, p, q) {
        const w = pow(z, p / q);
        const s = (p * t + 2 * pi) / q;
        const ddz_w = (p / q) * pow(z, (p - q) / q);
        return (
          2 * (w * cos(s) - z * cos(t)) * (ddz_w * cos(s) - cos(t)) +
          2 * (w * sin(s) - z * sin(t)) * (ddz_w * sin(s) - sin(t))
        );
      }

      function ddt_d(z, t, p, q) {
        const w = pow(z, p / q);
        const s = (p * t + 2 * pi) / q;
        const dds_t = p / q;
        return (
          2 * (z * cos(t) - w * cos(s)) * (-z * sin(t) + w * sin(s) * dds_t) +
          2 * (z * sin(t) - w * sin(s)) * (z * cos(t) - w * cos(s) * dds_t)
        );
      }

      function _s(z, t, p, q) {
        return pow(z + pow(z, p / q), 2);
      }

      function ddz_s(z, t, p, q) {
        const w = pow(z, p / q);
        const ddz_w = (p / q) * pow(z, (p - q) / q);
        return 2 * (w + z) * (ddz_w + 1);
      }

      function _r(z, t, p, q) {
        return _d(z, t, p, q) / _s(z, t, p, q);
      }

      function ddz_r(z, t, p, q) {
        return (
          ddz_d(z, t, p, q) * _s(z, t, p, q) -
          _d(z, t, p, q) * ddz_s(z, t, p, q)
        ) / pow(_s(z, t, p, q), 2);
      }

      function ddt_r(z, t, p, q) {
        return (
          ddt_d(z, t, p, q) * _s(z, t, p, q)
        ) / pow(_s(z, t, p, q), 2);
      }

      const epsilon = 1e-10;

      function _f(z, t) {
        return _r(z, t, 0, 1) - _r(z, t, p, q);
      }

      function ddz_f(z, t) {
        return ddz_r(z, t, 0, 1) - ddz_r(z, t, p, q);
      }

      function ddt_f(z, t) {
        return ddt_r(z, t, 0, 1) - ddt_r(z, t, p, q);
      }

      function _g(z, t) {
        return _r(z, t, 0, 1) - _r(pow(z, p / q), (p * t + 2 * pi) / q, 0, 1);
      }

      function ddz_g(z, t) {
        return ddz_r(z, t, 0, 1) - ddz_r(pow(z, p / q), (p * t + 2 * pi) / q, 0, 1) * (p / q) * pow(z, (p - q) / q);
      }

      function ddt_g(z, t) {
        return ddt_r(z, t, 0, 1) - ddt_r(pow(z, p / q), (p * t + 2 * pi) / q, 0, 1) * (p / q);
      }

      function find_root(z, t) {
        for (let iter = 0; iter < 100; iter++) {
          const v_f = _f(z, t);
          const v_g = _g(z, t);
          if (-epsilon < v_f && v_f < epsilon && -epsilon < v_g && v_g < epsilon) {
            return { ok: true, z: z, t: t, r: Math.sqrt(_r(z, t, 0, 1)) };
          }

          const a = ddz_f(z, t);
          const b = ddt_f(z, t);
          const c = ddz_g(z, t);
          const d = ddt_g(z, t);
          const det = a * d - b * c;
          if (-epsilon < det && det < epsilon) {
            return { ok: false };
          }

          z -= (d * v_f - b * v_g) / det;
          t -= (a * v_g - c * v_f) / det;

          if (z < epsilon) {
            return { ok: false };
          }
        }
        return { ok: false };
      }

      let root = find_root(2, 0);
      if (!root.ok) {
        const guesses = [[1.5, 0.2], [2.5, -0.2], [1.2, 0.1], [3.0, 0.0], [1.8, -0.1]];
        for (let k = 0; k < guesses.length; k++) {
          root = find_root(guesses[k][0], guesses[k][1]);
          if (root.ok) break;
        }
      }

      if (!root.ok) {
        return {
          a: [1.3284, 0.5898],
          b: [1.0261, 0.2241],
          r: 0.1983,
          mod_a: 1.4533,
          arg_a: 0.4178
        };
      }

      const a = [root.z * cos(root.t), root.z * sin(root.t)];
      const coroot = { z: pow(root.z, p / q), t: (p * root.t + 2 * pi) / q };
      const b = [coroot.z * cos(coroot.t), coroot.z * sin(coroot.t)];
      return { a: a, b: b, r: root.r, mod_a: root.z, arg_a: root.t };
    }

    // ============================================================
    // Spiral Rendering Function
    // ============================================================
    function spiral(r, st, delta, gamma, opts) {
      const rd = crecip(delta);
      const md = modulus(delta);
      const mrd = 1 / md;
      let colidx = opts.i;
      const cols = opts.fill;
      const min_d = opts.min_d;
      const max_d = opts.max_d;
      const dg = cmul(delta, gamma);
      const dog = cmul(delta, crecip(gamma));
      const god = cmul(gamma, crecip(delta));

      let q = st;
      let mod_q = modulus(q);

      while (mod_q > min_d) {
        q = cmul(q, rd);
        mod_q *= mrd;
        colidx = (colidx + cols.length - 1) % cols.length;
      }

      while (mod_q < max_d) {
        const quad = [möb(q)];
        if (modulus(quad[0]) <= 5) {
          if (colidx === 0) quad.push(möb(cmul(q, dog)));
          quad.push(möb(cmul(q, delta)));
          if (colidx === 2) quad.push(möb(cmul(q, dg)));
          quad.push(möb(cmul(q, gamma)));
          if (colidx === 1) quad.push(möb(cmul(q, god)));

          if (quad.length === 4 && modulus(csub(quad[0], quad[2])) <= 5) {
            ctx.fillStyle = cols[colidx];
            ctx.beginPath();
            ctx.moveTo(quad[0][0], quad[0][1]);
            ctx.lineTo(quad[1][0], quad[1][1]);
            ctx.lineTo(quad[2][0], quad[2][1]);
            ctx.lineTo(quad[3][0], quad[3][1]);
            ctx.closePath();
            ctx.fill();

            if (opts.stroke) {
              ctx.strokeStyle = opts.strokeColor;
              ctx.lineWidth = opts.lineWidth;
              ctx.stroke();
            }
          }
        }

        q = cmul(q, delta);
        mod_q *= md;
        colidx = (colidx + 1) % cols.length;
      }
    }

    // ============================================================
    // Animation Calculations & Main Frame Render
    // ============================================================
    function calculateAnimationParams(rawT, timeSec) {
      const spd = settings.speed;
      const dir = settings.reverse ? -1 : 1;
      let t = 0;
      let scaleMod = 1.0;
      let rotMod = 0;
      let driftX = 0;
      let driftY = 0;

      switch (settings.animation) {
        case 'Infinite Zoom-In':
          t = dir * (rawT % 3);
          scaleMod = 1.0;
          rotMod = 0;
          break;

        case 'Infinite Zoom-Out':
          t = -dir * (rawT % 3);
          scaleMod = 1.0;
          rotMod = 0;
          break;

        case 'Harmonic Breathing':
          t = Math.sin(timeSec * spd * 1.2 * dir) * 0.85;
          scaleMod = 1.0 + 0.16 * Math.sin(timeSec * spd * 1.6);
          rotMod = 0.18 * Math.cos(timeSec * spd * 0.8 * dir);
          break;

        case 'Hypnotic Precession':
          t = dir * ((rawT * 0.6) % 3);
          scaleMod = 1.0 + 0.08 * Math.sin(timeSec * spd * 1.4);
          rotMod = (timeSec * spd * 0.35 * dir) % (Math.PI * 2);
          break;

        case 'Möbius Phase Shift':
          t = 0.6 * Math.sin(timeSec * spd * 1.5 * dir) + 0.3 * Math.cos(timeSec * spd * 0.7);
          scaleMod = 1.0 + 0.14 * Math.cos(timeSec * spd * 1.8);
          rotMod = 0.25 * Math.sin(timeSec * spd * 1.1 * dir);
          break;

        case 'Zen Wave':
          t = dir * ((rawT * 0.35) % 3);
          scaleMod = 0.96 + 0.09 * Math.sin(timeSec * spd * 0.9);
          rotMod = Math.sin(timeSec * spd * 0.6 * dir) * 0.22;
          driftX = Math.sin(timeSec * spd * 0.7) * 20;
          driftY = Math.cos(timeSec * spd * 0.5) * 20;
          break;

        case 'Kaleidoscopic Oscillation':
          t = Math.sin(timeSec * spd * 2.0 * dir) * 1.4;
          scaleMod = 1.0 + 0.2 * Math.sin(timeSec * spd * 2.4);
          rotMod = Math.sin(timeSec * spd * 1.3 * dir) * 0.45;
          break;

        case 'Static (No Movement)':
        default:
          t = 0.0;
          scaleMod = 1.0;
          rotMod = 0;
          break;
      }

      return { t, scaleMod, rotMod, driftX, driftY };
    }

    function renderScene(animParams) {
      const dpr = settings.dpr;
      ctx.setTransform(1, 0, 0, 1, 0, 0);

      // Background Fill (Respects Greenscreen)
      const currentBg = settings.greenScreen ? '#00ff00' : settings.background;
      ctx.fillStyle = currentBg;
      ctx.fillRect(0, 0, offscreenCanvas.width, offscreenCanvas.height);
      document.body.style.background = currentBg;

      // Transform Coordinates
      const centerX = Math.round(offscreenCanvas.width / 2 + (settings.panX + animParams.driftX) * dpr);
      const centerY = Math.round(offscreenCanvas.height / 2 + (settings.panY + animParams.driftY) * dpr);

      ctx.save();
      ctx.translate(centerX, centerY);

      const baseScale = Math.min(offscreenCanvas.width, offscreenCanvas.height) * 0.45 * settings.zoom * animParams.scaleMod;
      ctx.scale(baseScale, baseScale);
      ctx.rotate(settings.baseRotation + animParams.rotMod);

      let start = cpow(root.a, animParams.t);
      const fillCols = [settings.color1, settings.color2, settings.color3];
      const strokeLineWidth = (settings.outlineWidth / baseScale) * dpr;

      for (let i = 0; i < settings.q; i++) {
        spiral(root.r, start, root.a, root.b, {
          fill: fillCols,
          i: (5 * i) % fillCols.length,
          min_d: settings.minD,
          max_d: settings.maxD,
          stroke: settings.showOutlines,
          strokeColor: settings.outlineColor,
          lineWidth: strokeLineWidth
        });
        start = cmul(start, root.b);
      }

      ctx.restore();

      // Pass texture through PostProcessor pipeline
      canvasTexture.needsUpdate = true;
      postProcessor.render(canvasTexture);
    }

    let firstTimestamp = null;
    let lastTime = 0;
    let accumulatedTime = 0;

    function run(timestamp) {
      if (firstTimestamp === null) {
        firstTimestamp = timestamp;
        lastTime = timestamp;
      }

      const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
      lastTime = timestamp;

      accumulatedTime += dt * settings.speed;

      const rawT = (accumulatedTime * 1000) / settings.rep;
      const animParams = calculateAnimationParams(rawT, accumulatedTime);

      renderScene(animParams);
      window.requestAnimationFrame(run);
    }

    window.requestAnimationFrame(run);

    // ============================================================
    // Interaction: Pan & Zoom
    // ============================================================
    let isDragging = false;
    let startPointerX = 0;
    let startPointerY = 0;
    let lastPointerX = 0;
    let lastPointerY = 0;
    let totalDragDist = 0;

    const activePointers = new Map();

    visibleCanvas.addEventListener('pointerdown', (e) => {
      activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (activePointers.size === 1) {
        isDragging = true;
        startPointerX = e.clientX;
        startPointerY = e.clientY;
        lastPointerX = e.clientX;
        lastPointerY = e.clientY;
        totalDragDist = 0;
        visibleCanvas.classList.add('is-dragging');
        visibleCanvas.setPointerCapture(e.pointerId);
      }
    });

    visibleCanvas.addEventListener('pointermove', (e) => {
      if (!activePointers.has(e.pointerId)) return;
      activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (activePointers.size === 1 && isDragging) {
        const dx = e.clientX - lastPointerX;
        const dy = e.clientY - lastPointerY;
        settings.panX += dx;
        settings.panY += dy;
        totalDragDist += Math.hypot(dx, dy);
        lastPointerX = e.clientX;
        lastPointerY = e.clientY;
        updateControllers(['panX', 'panY']);
      } else if (activePointers.size === 2) {
        const pts = Array.from(activePointers.values());
        const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        if (visibleCanvas._lastPinchDist) {
          const ratio = dist / visibleCanvas._lastPinchDist;
          settings.zoom = Math.min(Math.max(0.1, settings.zoom * ratio), 15.0);
          updateControllers(['zoom']);
        }
        visibleCanvas._lastPinchDist = dist;
      }
    });

    function endPointer(e) {
      if (activePointers.has(e.pointerId)) {
        activePointers.delete(e.pointerId);
      }
      visibleCanvas._lastPinchDist = null;

      if (activePointers.size === 0) {
        visibleCanvas.classList.remove('is-dragging');
        if (isDragging) {
          isDragging = false;
          if (totalDragDist < 6 && settings.clickToRandomize) {
            triggerRandomize();
          }
        }
      }
    }

    visibleCanvas.addEventListener('pointerup', endPointer);
    visibleCanvas.addEventListener('pointercancel', endPointer);

    // ============================================================
    // Procedural Scene Randomizer (Click-to-Randomize)
    // ============================================================
    const validPairs = [
      { p: 9, q: 36 },
      { p: 8, q: 32 },
      { p: 6, q: 24 },
      { p: 10, q: 40 },
      { p: 7, q: 28 },
      { p: 9, q: 27 },
      { p: 8, q: 24 },
      { p: 12, q: 36 }
    ];

    function hslToHex(h, s, l) {
      h = ((h % 360) + 360) % 360;
      s = Math.max(0, Math.min(100, s)) / 100;
      l = Math.max(0, Math.min(100, l)) / 100;
      const c = (1 - Math.abs(2 * l - 1)) * s;
      const x = c * (1 - Math.abs((h / 60) % 2 - 1));
      const m = l - c / 2;
      let r = 0, g = 0, b = 0;
      if (0 <= h && h < 60) { r = c; g = x; b = 0; }
      else if (60 <= h && h < 120) { r = x; g = c; b = 0; }
      else if (120 <= h && h < 180) { r = 0; g = c; b = x; }
      else if (180 <= h && h < 240) { r = 0; g = x; b = c; }
      else if (240 <= h && h < 300) { r = x; g = 0; b = c; }
      else if (300 <= h && h < 360) { r = c; g = 0; b = x; }
      const toHex = n => {
        const hx = Math.round((n + m) * 255).toString(16);
        return hx.length === 1 ? '0' + hx : hx;
      };
      return '#' + toHex(r) + toHex(g) + toHex(b);
    }

    function triggerRandomize() {
      // Pick random scheme or procedurally generate
      const schemeKeys = Object.keys(colorSchemes);
      const usePreset = Math.random() > 0.35;

      if (usePreset) {
        const randScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
        settings.scheme = randScheme;
        const s = colorSchemes[randScheme];
        settings.background = s.background;
        settings.color1 = s.color1;
        settings.color2 = s.color2;
        settings.color3 = s.color3;
        settings.outlineColor = s.outlineColor;
      } else {
        settings.scheme = 'Custom';
        const baseHue = Math.floor(Math.random() * 360);
        const darkTheme = Math.random() > 0.4;
        settings.background = darkTheme ? hslToHex(baseHue, 40, 6) : hslToHex(baseHue, 35, 94);
        settings.color1 = hslToHex((baseHue + 40 + Math.random() * 60) % 360, 85, 55);
        settings.color2 = hslToHex((baseHue + 160 + Math.random() * 60) % 360, 75, 45);
        settings.color3 = hslToHex((baseHue + 280 + Math.random() * 60) % 360, 60, 70);
        settings.outlineColor = darkTheme ? '#ffffff' : '#000000';
      }

      // Re-roll geometry
      const pair = validPairs[Math.floor(Math.random() * validPairs.length)];
      settings.p = pair.p;
      settings.q = pair.q;
      settings.baseRotation = Math.random() * Math.PI * 2;
      recalculateDoyle();

      // Re-roll animation
      const randAnim = animationPresets[Math.floor(Math.random() * animationPresets.length)];
      settings.animation = randAnim;
      settings.speed = parseFloat((0.5 + Math.random() * 1.5).toFixed(2));

      // Randomize post-processing slightly
      if (postProcessor) {
        postProcessor.settings.bloomStrength = parseFloat((0.4 + Math.random() * 0.8).toFixed(2));
        postProcessor.settings.bloomRadius = parseFloat((0.3 + Math.random() * 0.5).toFixed(2));
        postProcessor.settings.bloomThreshold = parseFloat((0.15 + Math.random() * 0.2).toFixed(2));
        postProcessor.updateSettings();
      }

      updateControllers();
    }

      .onChange(() => {
        settings.scheme = 'Custom';
        controllers.scheme.setValue('Custom');
      });

    controllers.color2 = fTheme.addColor(settings, 'color2')
      .name('Color 2')
      .onChange(() => {
        settings.scheme = 'Custom';
        controllers.scheme.setValue('Custom');
      });

    controllers.color3 = fTheme.addColor(settings, 'color3')
      .name('Color 3')
      .onChange(() => {
        settings.scheme = 'Custom';
        controllers.scheme.setValue('Custom');
      });

    controllers.showOutlines = fTheme.add(settings, 'showOutlines').name('Show Outlines');
    controllers.outlineColor = fTheme.addColor(settings, 'outlineColor').name('Outline Color');
    controllers.outlineWidth = fTheme.add(settings, 'outlineWidth', 0.2, 4.0, 0.1).name('Outline Width');

    // Post-Processing Suite Folder
    postProcessor.attachGUI(gui, 'Post-Processing (PostProcessor.js)');

    // Animation Folder
    const fAnim = gui.addFolder('Animation');
    controllers.animation = fAnim.add(settings, 'animation', animationPresets).name('Preset');
    controllers.speed = fAnim.add(settings, 'speed', 0.0, 3.0, 0.05).name('Animation Speed');
    controllers.reverse = fAnim.add(settings, 'reverse').name('Reverse Direction');

    // Geometry Folder
    const fGeom = gui.addFolder('Doyle Geometry');
    controllers.q = fGeom.add(settings, 'q', 12, 48, 1).name('Spiral Arms (q)').onChange(recalculateDoyle);
    controllers.p = fGeom.add(settings, 'p', 4, 16, 1).name('Spiral Step (p)').onChange(recalculateDoyle);
    controllers.baseRotation = fGeom.add(settings, 'baseRotation', 0, Math.PI * 2, 0.01).name('Base Rotation');
    controllers.rep = fGeom.add(settings, 'rep', 200, 2000, 10).name('Period (ms)');

    // Camera & View Folder
    const fView = gui.addFolder('Camera & View');
    controllers.dpr = fView.add(settings, 'dpr', 0.5, 3.0, 0.25)
      .name('DPR (Pixel Ratio)')
      .onChange(resizeCanvas);

    controllers.zoom = fView.add(settings, 'zoom', 0.1, 10.0, 0.05).name('Zoom');
    controllers.panX = fView.add(settings, 'panX', -800, 800, 1).name('Pan X');
    controllers.panY = fView.add(settings, 'panY', -800, 800, 1).name('Pan Y');
    fView.add(settings, 'resetView').name('Reset View');

    // Interactivity Folder
    const fInteract = gui.addFolder('Interactivity');
    controllers.clickToRandomize = fInteract.add(settings, 'clickToRandomize').name('Click to Randomize');
    fInteract.add(settings, 'randomizeScene').name('Randomize Now 🎲');

    function updateControllers(keys) {
      if (!keys) {
        for (const k in controllers) {
          if (controllers[k] && controllers[k].updateDisplay) {
            controllers[k].updateDisplay();
          }
        }
        if (gui && typeof gui.controllersRecursive === 'function') {
          gui.controllersRecursive().forEach(c => c.updateDisplay());
        }
      } else {
        for (const k of keys) {
          if (controllers[k] && controllers[k].updateDisplay) {
            controllers[k].updateDisplay();
          }
        }
      }
    }

    // ============================================================
    // Keyboard Shortcut: Toggle UI with 'H' Key
    // ============================================================
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        if (gui.domElement.style.display === 'none') {
          gui.show();
          gui.domElement.style.display = '';
        } else {
          gui.hide();
          gui.domElement.style.display = 'none';
        }
      }
    });
  </script>
</body>
</html>
