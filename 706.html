<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#241b1d" />
  <title>Chromatic Liquid Light Fields</title>
  <style>
    :root { color-scheme: dark; }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #241b1d; }
    body { position: fixed; inset: 0; overscroll-behavior: none; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  </style>
</head>
<body>
  <canvas id="light-fields" aria-label="Animated cyan and violet liquid light installation"></canvas>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.181.2/build/three.module.js';
    import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

    // All art parameters are independent of screen resolution and elapsed frames.
    // They can be modified here or from window.ChromaticLiquidLight.settings.
    const settings = {
      loopSeconds: 16,
      motion: 1.0,
      gradientTravel: 1.0,
      glow: 1.0,
      grain: 0.65,
      brightness: 1.0,
      pixelRatio: Math.min(window.devicePixelRatio || 1, 1.65),
      speed: 1.0,
      animation: 'Liquid drift',
      cameraMotion: 1.0,
      zoom: 1.0,
      angle: 0,
      panX: 0,
      panY: 0,
      scheme: 'Original',
      lightBackground: false,
      backgroundColor: '#241b1d',
      greenscreen: false,
      randomizeOnClick: true,
      shadowColor: '#55208c',
      bodyColor: '#883ed1',
      veilColor: '#a862e8',
      blendColor: '#7a87e0',
      coreColor: '#49d2f0',
      highlightColor: '#66dbf5',
      accentFocus: 1,
      seed: 0,
      variation: 0,
      thickness: 1,
      spread: 1,
      flowStrength: 1,
    };

    const colorKeys = ['shadowColor', 'bodyColor', 'veilColor', 'blendColor', 'coreColor', 'highlightColor'];
    const palette = (background, colors, focus = 1) => ({ background, colors, focus });
    // Preserve all supplied colors, including repeated stops. Resample their
    // luminance order into the six optical layers of this particular scene.
    function suppliedPalette(hexes) {
      const colors = hexes.map(hex => '#' + hex);
      const background = colors.pop();
      const luminance = hex => {
        const rgb = hex.match(/[a-f\d]{2}/gi).map(channel => parseInt(channel, 16) / 255);
        return rgb[0] * .2126 + rgb[1] * .7152 + rgb[2] * .0722;
      };
      colors.sort((a, b) => luminance(a) - luminance(b));
      const stops = Array.from({ length: 6 }, (_, index) => {
        const t = index / 5 * (colors.length - 1);
        const a = colors[Math.floor(t)].slice(1);
        const b = colors[Math.min(Math.floor(t) + 1, colors.length - 1)].slice(1);
        return '#' + [0, 2, 4].map(offset => Math.round(
          parseInt(a.slice(offset, offset + 2), 16) * (1 - t % 1) +
          parseInt(b.slice(offset, offset + 2), 16) * (t % 1)
        ).toString(16).padStart(2, '0')).join('');
      });
      return palette(background, stops);
    }
    const schemes = {
      'Original': palette('#241b1d', ['#55208c', '#883ed1', '#a862e8', '#7a87e0', '#49d2f0', '#66dbf5']),
      'Monochromatic': palette('#0b1020', ['#142c62', '#2356a5', '#5289d3', '#7ba4de', '#a1ccfa', '#deefff']),
      'Analogous': palette('#100c23', ['#472568', '#7547b2', '#a986d9', '#697cce', '#58c2da', '#b6edf4']),
      'Complementary': palette('#17101c', ['#43276c', '#8050bb', '#b098d4', '#c39b83', '#f1b74f', '#ffe0a0']),
      'Split-complementary': palette('#180e21', ['#54246b', '#9650b5', '#c58bcf', '#9fac85', '#b9d768', '#ffc785']),
      'Triadic': palette('#171021', ['#49316e', '#8250b1', '#bf91d1', '#75aab1', '#58c5be', '#ffc589']),
      'Tetradic': palette('#101821', ['#294d63', '#537a99', '#a791c4', '#cc83a2', '#ec9a72', '#d4e998']),
      'Double split-complementary': palette('#17131e', ['#523e74', '#87699e', '#cf9ab7', '#b5bd8d', '#80d1bf', '#f4ce8a']),
      'Achromatic': palette('#080808', ['#292929', '#646464', '#999999', '#bbbbbb', '#e5e5e5', '#ffffff']),
      'Achromatic + Accent': palette('#080808', ['#292929', '#646464', '#aaaaaa', '#d0d0d0', '#e52b35', '#ff6570'], 3),
      'Neutral + accent': palette('#18191b', ['#353638', '#696762', '#b1aaa0', '#c4beb3', '#d7663c', '#ffb77c'], 3),
      'Amber / Ember': suppliedPalette(['F6AA1C', 'BC3908', '941B0C', 'F6AA1C', '220901']),
      'Tidal / Teal': suppliedPalette(['63D1CF', '5BC0BE', '4BAD9E', '4BAD9E', '0B132B', '000000']),
      'Orchid / Mauve': suppliedPalette(['AA60C8', 'D69ADE', 'C9A3C6', 'CFB5C2', '0D001D', '120A12']),
      'Saffron / Lagoon': suppliedPalette(['FEF1BE', 'FFBA00', '008189', '00474D', '061210']),
      'Lime / Jade': suppliedPalette(['D4FFB0', '7FFF00', '00B894', '0A3322', '05140A']),
      'Apricot / Aubergine': suppliedPalette(['FFE8CC', 'FF8C00', 'C7501A', '3D1050', '0E0618']),
      'Lavender / Indigo': suppliedPalette(['E8E0FF', 'B38FFF', '6A3DE8', '1A1250', '090612']),
      'Ice / Fuchsia': suppliedPalette(['E0FBFF', '00F0FF', 'D40078', '1E0A3D', '05020F']),
    };
    const animationNames = ['Static', 'Liquid drift', 'Slow orbit', 'Breathing', 'Lateral tide', 'Vertical float', 'Figure eight', 'Gentle roll'];

    const VERTEX_SHADER = /* glsl */ `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = vec4(position.xy, 0.0, 1.0);
      }
    `;

    const FRAGMENT_SHADER = /* glsl */ `
      precision highp float;
      varying vec2 vUv;

      uniform vec2 uResolution;
      uniform float uPhase;
      uniform float uMotion;
      uniform float uGradientTravel;
      uniform float uGlow;
      uniform float uGrain;
      uniform float uBrightness;
      uniform vec3 uPalette[6];
      uniform vec3 uBackground;
      uniform bool uGreenscreen;
      uniform vec2 uPan;
      uniform float uZoom;
      uniform float uAngle;
      uniform float uSeed;
      uniform float uVariation;
      uniform float uThickness;
      uniform float uSpread;
      uniform float uFlowStrength;
      uniform float uAccentFocus;
      float fieldAlpha;

      #define PI 3.1415926535897932384626433832795
      #define TAU 6.283185307179586476925286766559

      float hash21(vec2 p) {
        p = fract(p * vec2(123.34, 456.21));
        p += dot(p, p + 34.345);
        return fract(p.x * p.y);
      }

      float noise2(vec2 p) {
        vec2 i = floor(p);
        vec2 f = fract(p);
        vec2 w = f * f * (3.0 - 2.0 * f);
        float a = hash21(i);
        float b = hash21(i + vec2(1., 0.));
        float c = hash21(i + vec2(0., 1.));
        float d = hash21(i + vec2(1., 1.));
        return mix(mix(a, b, w.x), mix(c, d, w.x), w.y);
      }

      mat2 rotation(float angle) {
        float s = sin(angle), c = cos(angle);
        return mat2(c, -s, s, c);
      }

      // Elliptical, signed field. Normalized distance is intentional: it allows
      // optical diffusion to scale with each luminous region's local thickness.
      vec2 layoutOffset(vec2 origin) {
        return uVariation * (vec2(
          noise2(origin * 3.0 + vec2(uSeed, 7.3)),
          noise2(origin * 3.0 + vec2(19.7, uSeed))
        ) - 0.5);
      }

      float ellipseD(vec2 p, vec2 origin, vec2 radius, float angle) {
        vec2 q = rotation(angle) * (p - origin - layoutOffset(origin));
        return length(q / (radius * vec2(1.0, uThickness))) - 1.0;
      }

      float softMin(float a, float b, float k) {
        float h = max(k - abs(a - b), 0.0) / k;
        return min(a, b) - h * h * k * 0.25;
      }

      float unitMask(float d, float inside, float outside) {
        return 1.0 - smoothstep(inside, outside, d);
      }

      // Time dependence ONLY enters through integer-frequency harmonics of
      // uPhase. Both the value and its derivative match at 0 and 16 seconds.
      vec2 fluidWarp(vec2 p, float phase, float strength) {
        float a = 5.25 * p.x + 3.1 * p.y + phase;
        float b = -3.4 * p.x + 5.45 * p.y - 2.0 * phase + 1.1;
        float c = 8.4 * p.x - 4.0 * p.y + 3.0 * phase - 0.8;

        // Approximate a low-energy divergence-free curl field, augmented with
        // a smaller harmonic for evolving large-scale shape changes.
        vec2 curlA = vec2(3.1 * cos(a), -5.25 * cos(a));
        vec2 curlB = vec2(5.45 * cos(b), 3.4 * cos(b));
        vec2 detail = vec2(sin(c), cos(c));
        return strength * uFlowStrength * (0.0026 * curlA + 0.0019 * curlB + 0.0037 * detail);
      }

      vec2 cubicCurve(vec2 a, vec2 b, vec2 c, vec2 d, float t) {
        float u = 1.0 - t;
        return u*u*u*a + 3.0*u*u*t*b + 3.0*u*t*t*c + t*t*t*d;
      }

      // Approximate variable-width cubic Bézier SDF by nearest-point sampling.
      // Returns normalized signed distance and a continuous color coordinate.
      vec2 ribbonD(vec2 p, float phase) {
        float wave = sin(phase - 0.30);
        float late = sin(phase - 0.82) + 0.20 * sin(2.0 * phase + 0.25);
        vec2 a = vec2(0.90, 0.274) + vec2(-0.011, 0.008) * wave * uMotion;
        vec2 b = vec2(0.79, 0.336) + vec2(-0.028, 0.005) * late * uMotion;
        vec2 c = vec2(0.32, 0.347) + vec2(0.014, -0.025) * wave * uMotion;
        vec2 d = vec2(0.40, 0.405) + vec2(0.010, 0.010) * late * uMotion;
        a += layoutOffset(a);
        b += layoutOffset(b);
        c += layoutOffset(c);
        d += layoutOffset(d);
        float dClosest = 1e4;
        vec2 prev = a;
        for (int i = 1; i <= 11; i++) {
          float t = float(i) / 11.0;
          vec2 curr = cubicCurve(a, b, c, d, t);
          vec2 edge = curr - prev;
          float h = clamp(dot(p - prev, edge) / max(dot(edge, edge), 1e-7), 0.0, 1.0);
          vec2 closest = prev + h * edge;
          float localT = (float(i - 1) + h) / 11.0;
          float width = mix(0.044, 0.049, sin(localT * PI)) * uThickness;
          width *= 1.0 + 0.16 * sin(5.7 * localT + phase) * uMotion;
          float di = length(p - closest) / max(width, 0.015) - 1.0;
          if (di < dClosest) {
            dClosest = di;
          }
          prev = curr;
        }
        // Nearest arc parameters jump where the ribbon bends back on itself.
        // Project onto its overall direction so color stays smooth there.
        vec2 axis = d - a;
        float colorT = dot(p - a, axis) / max(dot(axis, axis), 1e-7);
        return vec2(dClosest, colorT);
      }

      // A defocused projector: chromatic halo, periwinkle envelope, luminous
      // cyan core. Internal color boundaries move separately from silhouettes.
      vec3 addPool(
        vec3 background, float d, float cyanD, float brightness,
        float tint, float phase, vec2 p, float detailStrength
      ) {
        vec3 violetShadow = uPalette[0];
        vec3 violet = uPalette[1];
        vec3 lavender = uPalette[2];
        vec3 periwinkle = uPalette[3];
        vec3 cyan = uPalette[4];
        vec3 paleAqua = uPalette[5];

        float halo = unitMask(d, -0.1, 0.82);
        float veil = unitMask(d, -0.36, 0.50);
        float body = unitMask(d, -0.54, 0.30);
        float pigment = unitMask(d, -0.73, 0.20);

        float tide = 0.5 + 0.5 * sin(
          p.x * 10.0 - p.y * 8.0 + phase + 0.7 * sin(2.0 * phase + p.y * 4.0)
        );
        float interference = sin(p.x * 7.5 + p.y * 8.4 - phase + 0.8 * sin(2.0 * phase));
        interference *= 0.5 + 0.5 * sin(4.7 * p.x - 5.9 * p.y + 2.0 * phase);
        float modulation = uGradientTravel * detailStrength * (
          0.055 * (tide - 0.5) + 0.023 * interference
        );

        float core = unitMask(cyanD + modulation, -0.54, 0.39) * pigment * tint;
        float brightCore = unitMask(cyanD + modulation, -0.69, -0.02) * pigment * tint;
        core = pow(core, uAccentFocus);
        brightCore = pow(brightCore, uAccentFocus);
        float outerLift = 0.25 * halo * uGlow * brightness;

        // Track the field's coverage separately from its color. Empty pixels
        // stay exactly #00ff00 in keying mode, even with grain or brightness.
        float transmission = (1.0 - clamp(outerLift * 0.45, 0.0, 1.0));
        transmission *= (1.0 - veil * brightness * 0.40);
        transmission *= (1.0 - body * brightness * 0.70);
        transmission *= (1.0 - pigment * brightness * 0.43);
        transmission *= (1.0 - pigment * brightness * (0.24 + 0.07 * tide));
        transmission *= (1.0 - core * brightness * 0.90);
        transmission *= (1.0 - brightCore * brightness * (0.22 + 0.07 * tide));
        fieldAlpha = 1.0 - (1.0 - fieldAlpha) * transmission;

        vec3 c = background;
        c += violetShadow * outerLift * 0.45;
        c = mix(c, violetShadow, veil * brightness * 0.40);
        c = mix(c, violet, body * brightness * 0.70);
        c = mix(c, lavender, pigment * brightness * 0.43);
        c = mix(c, periwinkle, pigment * brightness * (0.24 + 0.07 * tide));
        c = mix(c, cyan, core * brightness * 0.90);
        c = mix(c, paleAqua, brightCore * brightness * (0.22 + 0.07 * tide));
        return c;
      }

      void main() {
        fieldAlpha = 0.0;
        vec2 screen = vec2(vUv.x, 1.0 - vUv.y); // canonical top-left origin
        float aspect = uResolution.x / max(uResolution.y, 1.0);
        // Inverse camera transform in viewport-height units keeps rotation
        // round on every aspect ratio, and dragging follows the pointer.
        vec2 view = (screen - 0.5) * vec2(aspect, 1.0) - uPan;
        screen = 0.5 + (rotation(uAngle) * view / uZoom) / vec2(aspect, 1.0);
        float canonicalAspect = 848.0 / 1264.0;
        float aspectRatio = aspect / canonicalAspect;

        // Extend the environment on landscape monitors instead of stretching
        // all the soft formations across the full screen. Preserve the scene's
        // composition on portrait, including narrow mobile portrait displays.
        vec2 p = screen;
        p.x = 0.5 + (screen.x - 0.5) * (1.0 + 0.43 * max(aspectRatio - 1.0, 0.0));
        p.y = 0.5 + (screen.y - 0.5) * max(1.0, 1.0 / aspectRatio);
        p.x = 0.5 + (p.x - 0.5) / uSpread;

        float phase = uPhase;
        float upperMotion = sin(phase - 0.37) + 0.18 * sin(2.0 * phase + 0.7);
        float centerMotion = sin(phase - 0.8) + 0.17 * sin(3.0 * phase + 0.2);
        float lowerMotion = sin(phase - 1.65) + 0.13 * sin(2.0 * phase + 0.3);

        // Background spatial noise follows a closed trajectory in noise space.
        float atmosphere = noise2(p * 2.1 + 0.22 * vec2(cos(phase), sin(phase)));
        float lowCloud = noise2(p * 4.0 - 0.18 * vec2(sin(phase), cos(phase)));
        vec3 background = uBackground;
        background += (uPalette[0] - uBackground) * 0.13 * clamp(p.y * 0.66, 0.0, 1.0);
        background += vec3(0.010 * (atmosphere - 0.5) + 0.005 * (lowCloud - 0.5));

        vec2 warp = fluidWarp(p, phase, uMotion);
        vec2 pu = p + warp;
        vec2 pc = p + 0.80 * warp + fluidWarp(p + vec2(.1,.3), phase + 0.42, 0.35 * uMotion);
        vec2 pl = p + 0.88 * warp + fluidWarp(p - vec2(.2,.1), phase - 0.6, 0.5 * uMotion);

        // A. Soft upper-left violet pool and its fainter underside.
        vec2 leftCenter = vec2(.210, .232) + uMotion * vec2(-.010, .005) * upperMotion;
        float upperLeft = ellipseD(pu, leftCenter, vec2(.205, .052), -0.11);
        upperLeft = softMin(upperLeft,
          ellipseD(pu, vec2(.197,.282), vec2(.139,.025), -0.03), 0.35);
        float violetInterior = ellipseD(pu, leftCenter + vec2(.006,.004), vec2(.165,.033), -0.09);
        vec3 color = addPool(vec3(0.0), upperLeft, violetInterior,
          0.80, 0.0, phase, p, 0.55);

        // B. Bright upper-right cyan pool with an asymmetric lilac tail.
        vec2 rightC = vec2(.707,.242) + uMotion * vec2(-.018,.009) * upperMotion;
        float upperRight = ellipseD(pu, rightC, vec2(.218,.062), -0.06);
        upperRight = softMin(upperRight,
          ellipseD(pu, vec2(.853,.261) + uMotion * vec2(-.014,.010) * upperMotion,
                   vec2(.139,.050), 0.16), 0.42);
        float rightCyan = ellipseD(pc,
          vec2(.681,.240) + uMotion * vec2(-.021,.003) * upperMotion,
          vec2(.176,.054), -0.10);
        color = addPool(color, upperRight, rightCyan,
          1.0, 0.92, phase, p, 0.75);

        // C. A luminous moving S-curve, with a diffused violet underside.
        vec2 centralRibbon = ribbonD(pc, phase);
        float central = centralRibbon.x;
        central = softMin(central,
          ellipseD(pc,
            vec2(.530,.378) + uMotion * vec2(-.012,.011) * centerMotion,
            vec2(.205,.051), -0.13), 0.31);
        float ribbonUnderside = ellipseD(pc,
          vec2(.500,.427) + uMotion * vec2(.010,.005) * centerMotion,
          vec2(.168,.038), -0.10);
        central = softMin(central, ribbonUnderside + 0.12, 0.24);
        float ribbonCyan = ellipseD(pc,
          vec2(.576,.368) + uMotion * vec2(-.019,.009) * centerMotion,
          vec2(.225,.053), -0.19);
        ribbonCyan += 0.055 * sin(4.0 * centralRibbon.y + phase - 0.6) * uGradientTravel;
        color = addPool(color, central, ribbonCyan,
          0.97, 0.90, phase, p, 0.92);

        // D. Small light island cropped by the left boundary, near 57% height.
        float lowerLeft = ellipseD(pl,
          vec2(.119,.574) + uMotion * vec2(.010,-.005) * lowerMotion,
          vec2(.240,.071), -0.06);
        lowerLeft = softMin(lowerLeft,
          ellipseD(pl, vec2(.243,.607), vec2(.116,.042), 0.12), 0.25);
        float lowerLeftCyan = ellipseD(pl,
          vec2(.111,.566) + uMotion * vec2(.009,-.004) * lowerMotion,
          vec2(.191,.054), -0.04);
        color = addPool(color, lowerLeft, lowerLeftCyan,
          0.94, 0.98, phase, p, 0.72);

        // E. Lower field: irregular connected caustic pools, not one ellipse.
        vec2 lc = uMotion * vec2(.014, -.007) * lowerMotion;
        float lower = ellipseD(pl, vec2(.505,.760) + lc, vec2(.333,.142), 0.035);
        lower = softMin(lower,
          ellipseD(pl, vec2(.741,.710) + vec2(-.010,.006) * lowerMotion * uMotion,
            vec2(.318,.135), -0.19), 0.43);
        lower = softMin(lower,
          ellipseD(pl, vec2(.438,.852) + 0.8 * lc, vec2(.396,.150), -0.07), 0.50);
        lower = softMin(lower,
          ellipseD(pl, vec2(.686,.894) - 0.4 * lc, vec2(.402,.149), 0.06), 0.48);
        lower = softMin(lower,
          ellipseD(pl, vec2(.925,.565) + vec2(-.007,.007) * lowerMotion * uMotion,
            vec2(.165,.062), -0.22), 0.34);
        lower = softMin(lower,
          ellipseD(pl, vec2(.303,.719) + vec2(.008,.004) * lowerMotion * uMotion,
            vec2(.186,.079), 0.15), 0.32);

        float lowerWave = 0.018 * sin(phase - 1.2 + pl.x * 5.3) * uMotion;
        lower += lowerWave * smoothstep(.56,.96,pl.y);

        // Animated cyan core travels with a delayed tide through the field.
        vec2 coreMove = uMotion * vec2(.022,-.010) * lowerMotion;
        float lowerCyan = ellipseD(pl,
          vec2(.647,.698) + coreMove, vec2(.346,.141), -0.12);
        lowerCyan = softMin(lowerCyan,
          ellipseD(pl, vec2(.438,.756) + 0.8 * coreMove,
            vec2(.280,.115), -0.17), 0.27);
        lowerCyan = softMin(lowerCyan,
          ellipseD(pl, vec2(.894,.635) + 0.4 * coreMove,
            vec2(.179,.082), -0.18), 0.29);
        lowerCyan += 0.027 * sin(phase - 0.7 + pl.x * 7.0) * uGradientTravel;
        color = addPool(color, lower, lowerCyan,
          0.96, 0.97, phase, p, 1.0);

        // Low-intensity detached spectral fragments. Their faintness matters.
        float fragments = ellipseD(pu, vec2(.960,.158), vec2(.093,.030), -0.10);
        fragments = softMin(fragments,
          ellipseD(pu, vec2(.525,.075), vec2(.120,.018), .06), .22);
        fragments = softMin(fragments,
          ellipseD(pu, vec2(.702,.112), vec2(.073,.015), -.05), .18);
        fragments = softMin(fragments,
          ellipseD(pu, vec2(-.014,.422), vec2(.077,.030), 0.02), .22);
        float fragmentAlpha = unitMask(fragments,-.34,.59);
        vec3 fragmentColor = mix(uPalette[0], uPalette[1], 0.55) * (0.71 + 0.07 * sin(phase - .8));
        color = mix(color, fragmentColor, fragmentAlpha * 0.48);
        fieldAlpha = mix(fieldAlpha, 1.0, fragmentAlpha * 0.48);

        // Optical diffusion near bright fields is already built into SDF masks.
        // Apply just a restrained lilac light-spill modulation at their edges.
        float brightnessFactor = dot(color, vec3(.20,.66,.14));
        float lum = clamp(brightnessFactor, 0.0, 1.0);
        color += 0.014 * uGlow * uPalette[0] * smoothstep(.14,.44,lum) * fieldAlpha;

        // Film grain is stable in device pixels, so it never flickers, drifts,
        // or prevents exact loop closure. Tiny dither prevents banding.
        float pixelNoise = hash21(floor(gl_FragCoord.xy)) - .5;
        float grainWeight = mix(1.0,0.47,smoothstep(.10,.67,lum));
        color += pixelNoise * (0.028 * uGrain * grainWeight + 1.0 / 255.0) * fieldAlpha;
        color *= uBrightness;
        color = clamp(color, vec3(0.0), vec3(0.98));
        vec3 backdrop = uGreenscreen ? vec3(0.0, 1.0, 0.0) : clamp(background, 0.0, 1.0);
        gl_FragColor = vec4(clamp(color + backdrop * (1.0 - fieldAlpha), 0.0, 1.0), 1.0);
      }
    `;

    const canvas = document.getElementById('light-fields');
    const renderer = new THREE.WebGLRenderer({
      canvas, alpha: false, antialias: false, depth: false, stencil: false,
      powerPreference: 'high-performance', preserveDrawingBuffer: false,
    });
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.NoToneMapping;
    renderer.setClearColor(0x241b1d, 1);

    const uniforms = {
      uResolution: { value: new THREE.Vector2(1, 1) },
      uPhase: { value: 0 },
      uMotion: { value: settings.motion },
      uGradientTravel: { value: settings.gradientTravel },
      uGlow: { value: settings.glow },
      uGrain: { value: settings.grain },
      uBrightness: { value: settings.brightness },
      uPalette: { value: colorKeys.map(() => new THREE.Vector3()) },
      uBackground: { value: new THREE.Vector3() },
      uGreenscreen: { value: false },
      uPan: { value: new THREE.Vector2() },
      uZoom: { value: 1 },
      uAngle: { value: 0 },
      uSeed: { value: 0 },
      uVariation: { value: 0 },
      uThickness: { value: 1 },
      uSpread: { value: 1 },
      uFlowStrength: { value: 1 },
      uAccentFocus: { value: 1 },
    };
    const material = new THREE.ShaderMaterial({
      vertexShader: VERTEX_SHADER,
      fragmentShader: FRAGMENT_SHADER,
      uniforms,
      depthTest: false,
      depthWrite: false,
    });
    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const fullscreenQuad = new THREE.Mesh(new THREE.PlaneGeometry(2,2), material);
    fullscreenQuad.frustumCulled = false;
    scene.add(fullscreenQuad);

    function resize() {
      renderer.setPixelRatio(settings.pixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight, false);
      uniforms.uResolution.value.set(renderer.domElement.width, renderer.domElement.height);
      renderFrame(elapsed);
    }

    let elapsed = 0;
    let lastNow = performance.now();
    let rafId = 0;
    let disposed = false;
    let uiVisible = true;
    let frozenCamera = { x: 0, y: 0, zoom: 1, angle: 0 };
    let lastCamera = { ...frozenCamera };
    const clamp = (value, min, max) => Math.max(min, Math.min(max, value));

    function cameraOffset(seconds) {
      if (settings.animation === 'Static') return { ...frozenCamera };
      const t = seconds * Math.PI * 2 / settings.loopSeconds * 0.25;
      const amount = settings.cameraMotion;
      const view = { x: 0, y: 0, zoom: 1, angle: 0 };
      switch (settings.animation) {
        case 'Slow orbit':
          view.x = .04 * Math.cos(t) * amount;
          view.y = .025 * Math.sin(t) * amount;
          view.angle = .09 * Math.sin(t) * amount;
          break;
        case 'Breathing':
          view.zoom = Math.exp(.07 * Math.sin(t) * amount);
          view.y = .01 * Math.sin(t) * amount;
          break;
        case 'Lateral tide':
          view.x = .06 * Math.sin(t) * amount;
          view.angle = .025 * Math.sin(t) * amount;
          break;
        case 'Vertical float':
          view.y = .045 * Math.sin(t) * amount;
          view.zoom = Math.exp(.025 * Math.sin(2 * t) * amount);
          break;
        case 'Figure eight':
          view.x = .045 * Math.sin(t) * amount;
          view.y = .024 * Math.sin(2 * t) * amount;
          view.angle = .05 * Math.sin(t) * amount;
          break;
        case 'Gentle roll':
          view.angle = .12 * Math.sin(t) * amount;
          view.zoom = Math.exp(.025 * Math.sin(2 * t) * amount);
          break;
      }
      return view;
    }

    function setRGB(vector, hex) {
      const value = parseInt(hex.slice(1), 16);
      // These shader colors are already display RGB; avoid Three's automatic
      // sRGB-to-linear conversion so GUI hex colors match the actual canvas.
      vector.set((value >> 16 & 255) / 255, (value >> 8 & 255) / 255, (value & 255) / 255);
    }

    function renderFrame(seconds) {
      const phase = seconds / settings.loopSeconds * Math.PI * 2 + settings.seed * .618;
      uniforms.uPhase.value = ((phase % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
      uniforms.uMotion.value = settings.motion;
      uniforms.uGradientTravel.value = settings.gradientTravel;
      uniforms.uGlow.value = settings.glow;
      uniforms.uGrain.value = settings.grain;
      uniforms.uBrightness.value = settings.brightness;
      uniforms.uGreenscreen.value = settings.greenscreen;
      uniforms.uSeed.value = settings.seed;
      uniforms.uVariation.value = settings.variation;
      uniforms.uThickness.value = settings.thickness;
      uniforms.uSpread.value = settings.spread;
      uniforms.uFlowStrength.value = settings.flowStrength;
      uniforms.uAccentFocus.value = settings.accentFocus;
      colorKeys.forEach((key, index) => setRGB(uniforms.uPalette.value[index], settings[key]));
      setRGB(uniforms.uBackground.value, settings.backgroundColor);
      lastCamera = cameraOffset(seconds);
      uniforms.uPan.value.set(settings.panX + lastCamera.x, settings.panY + lastCamera.y);
      uniforms.uZoom.value = settings.zoom * lastCamera.zoom;
      uniforms.uAngle.value = settings.angle * Math.PI / 180 + lastCamera.angle;
      renderer.render(scene, camera);
    }

    function animate(now) {
      if (disposed) return;
      const delta = Math.max(0, (now - lastNow) * .001);
      lastNow = now;
      if (settings.animation !== 'Static') elapsed += delta * settings.speed;
      renderFrame(elapsed);
      rafId = requestAnimationFrame(animate);
    }

    const gui = new GUI({ title: 'Liquid light', width: 310 });
    const schemeController = gui.add(settings, 'scheme', Object.keys(schemes)).name('Color scheme').onChange(applyScheme);
    const inversionController = gui.add(settings, 'lightBackground').name('Light background').onChange(applyScheme);
    gui.add(settings, 'greenscreen').name('Greenscreen');
    gui.add(settings, 'randomizeOnClick').name('Click to randomize');
    const actions = {
      randomize,
      resetView() {
        settings.zoom = 1;
        settings.angle = settings.panX = settings.panY = 0;
        refreshGUI();
        renderFrame(elapsed);
      },
    };
    gui.add(actions, 'randomize').name('New variation');

    const animationFolder = gui.addFolder('Animation');
    animationFolder.add(settings, 'animation', animationNames).name('Motion').onChange(() => {
      frozenCamera = { ...lastCamera };
    });
    animationFolder.add(settings, 'speed', 0, 2, .01).name('Speed');
    animationFolder.add(settings, 'cameraMotion', 0, 1.5, .01).name('Camera motion');
    animationFolder.add(settings, 'motion', 0, 1.6, .01).name('Liquid motion');
    animationFolder.add(settings, 'gradientTravel', 0, 1.6, .01).name('Color travel');

    const viewFolder = gui.addFolder('View');
    viewFolder.add(settings, 'zoom', .15, 8, .01).name('Zoom');
    viewFolder.add(settings, 'angle', -180, 180, .1).name('Angle');
    viewFolder.add(settings, 'panX', -3, 3, .001).name('Position X');
    viewFolder.add(settings, 'panY', -3, 3, .001).name('Position Y');
    viewFolder.add(actions, 'resetView').name('Reset view');
    viewFolder.close();

    const colorFolder = gui.addFolder('Palette');
    const colorLabels = ['Halo', 'Body', 'Veil', 'Blend', 'Core', 'Highlight'];
    colorKeys.forEach((key, index) => colorFolder.addColor(settings, key).name(colorLabels[index]));
    colorFolder.add(settings, 'accentFocus', 1, 5, .1).name('Accent focus');
    colorFolder.close();

    const backgroundFolder = gui.addFolder('Background');
    backgroundFolder.addColor(settings, 'backgroundColor').name('Color');
    backgroundFolder.close();

    const fieldFolder = gui.addFolder('Field');
    fieldFolder.add(settings, 'seed', 0, 999, 1).name('Layout seed');
    fieldFolder.add(settings, 'variation', 0, .25, .001).name('Layout variation');
    fieldFolder.add(settings, 'thickness', .65, 1.4, .01).name('Thickness');
    fieldFolder.add(settings, 'spread', .7, 1.4, .01).name('Spread');
    fieldFolder.add(settings, 'flowStrength', .2, 2, .01).name('Flow strength');
    fieldFolder.close();

    const renderFolder = gui.addFolder('Rendering');
    renderFolder.add(settings, 'pixelRatio', .5, 3, .05).name('Pixel ratio (DPR)').onChange(resize);
    renderFolder.add(settings, 'brightness', .25, 1.5, .01).name('Brightness');
    renderFolder.add(settings, 'glow', 0, 1.8, .01).name('Glow');
    renderFolder.add(settings, 'grain', 0, 1.5, .01).name('Grain');
    renderFolder.close();
    gui.onChange(() => renderFrame(elapsed));

    function refreshGUI() {
      gui.controllersRecursive().forEach(controller => controller.updateDisplay());
      inversionController.show(settings.scheme.startsWith('Achromatic'));
    }

    function applyScheme() {
      const selected = schemes[settings.scheme];
      const inverted = settings.lightBackground && settings.scheme.startsWith('Achromatic');
      selected.colors.forEach((hex, index) => {
        if (inverted && !(settings.scheme === 'Achromatic + Accent' && index >= 4)) {
          hex = '#' + (0xffffff ^ parseInt(hex.slice(1), 16)).toString(16).padStart(6, '0');
        }
        settings[colorKeys[index]] = hex;
      });
      settings.backgroundColor = inverted ? '#f7f7f7' : selected.background;
      settings.accentFocus = selected.focus;
      refreshGUI();
      renderFrame(elapsed);
    }

    function randomize() {
      const random = (min, max) => min + Math.random() * (max - min);
      const names = Object.keys(schemes).filter(name => name !== settings.scheme);
      settings.scheme = names[Math.floor(Math.random() * names.length)];
      settings.lightBackground = Math.random() < .5;
      settings.seed = Math.floor(random(1, 1000));
      settings.variation = random(.055, .20);
      settings.thickness = random(.78, 1.25);
      settings.spread = random(.84, 1.2);
      settings.flowStrength = random(.55, 1.65);
      settings.motion = random(.55, 1.25);
      settings.gradientTravel = random(.55, 1.35);
      settings.speed = random(.35, .85);
      settings.glow = random(.65, 1.3);
      settings.cameraMotion = random(.35, .95);
      // Keep a deliberately static view static; otherwise roll a gentle mode.
      if (settings.animation !== 'Static') {
        settings.animation = animationNames[1 + Math.floor(Math.random() * (animationNames.length - 1))];
      }
      applyScheme();
    }

    function onWheel(event) {
      event.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const delta = event.deltaY * (event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? rect.height : 1);
      const oldZoom = settings.zoom;
      settings.zoom = clamp(oldZoom * Math.exp(-clamp(delta, -250, 250) * .0015), .15, 8);
      const ratio = settings.zoom / oldZoom;
      const x = (event.clientX - rect.left - rect.width / 2) / rect.height;
      const y = (event.clientY - rect.top - rect.height / 2) / rect.height;
      settings.panX += (x - settings.panX - lastCamera.x) * (1 - ratio);
      settings.panY += (y - settings.panY - lastCamera.y) * (1 - ratio);
      refreshGUI();
      renderFrame(elapsed);
    }

    let pointer = null;
    function onPointerDown(event) {
      if (pointer || !event.isPrimary || (event.button !== 0 && event.button !== 2)) return;
      pointer = {
        id: event.pointerId, x: event.clientX, y: event.clientY,
        startX: event.clientX, startY: event.clientY, dragged: false,
        rotate: event.button === 2 || event.shiftKey, button: event.button,
      };
      canvas.setPointerCapture(event.pointerId);
      canvas.style.cursor = 'grabbing';
    }
    function onPointerMove(event) {
      if (!pointer || pointer.id !== event.pointerId) return;
      if (!pointer.dragged && Math.hypot(event.clientX - pointer.startX, event.clientY - pointer.startY) <= 5) return;
      pointer.dragged = true;
      const dx = event.clientX - pointer.x, dy = event.clientY - pointer.y;
      if (pointer.rotate) {
        settings.angle = ((settings.angle + dx * .25 + 180) % 360 + 360) % 360 - 180;
      } else {
        const height = canvas.getBoundingClientRect().height;
        settings.panX += dx / height;
        settings.panY += dy / height;
      }
      pointer.x = event.clientX;
      pointer.y = event.clientY;
      refreshGUI();
      renderFrame(elapsed);
    }
    function releasePointer() {
      if (!pointer) return;
      const id = pointer.id;
      pointer = null;
      if (canvas.hasPointerCapture(id)) canvas.releasePointerCapture(id);
      canvas.style.cursor = 'grab';
    }
    function onPointerUp(event) {
      if (!pointer || pointer.id !== event.pointerId) return;
      const click = !pointer.dragged && pointer.button === 0 && !pointer.rotate &&
        Math.hypot(event.clientX - pointer.startX, event.clientY - pointer.startY) <= 5;
      releasePointer();
      if (click && settings.randomizeOnClick) randomize();
    }
    function onContextMenu(event) { event.preventDefault(); }
    function onKeyDown(event) {
      if (event.repeat || event.ctrlKey || event.metaKey || event.altKey || event.key.toLowerCase() !== 'h') return;
      if (event.target instanceof Element && event.target.closest('input, textarea, select, [contenteditable="true"]')) return;
      uiVisible = !uiVisible;
      gui.show(uiVisible);
    }

    const canvasEvents = {
      wheel: onWheel, pointerdown: onPointerDown, pointermove: onPointerMove,
      pointerup: onPointerUp, pointercancel: releasePointer,
      lostpointercapture: releasePointer, contextmenu: onContextMenu,
    };
    Object.entries(canvasEvents).forEach(([type, handler]) => canvas.addEventListener(type, handler, { passive: false }));
    canvas.style.cursor = 'grab';
    window.addEventListener('keydown', onKeyDown);
    window.addEventListener('resize', resize, { passive: true });
    applyScheme();
    resize();
    rafId = requestAnimationFrame(animate);

    // Deterministic frame export also respects current color and view settings.
    window.ChromaticLiquidLight = Object.freeze({
      settings, gui, randomize,
      drawAt(seconds) {
        if (disposed) return;
        cancelAnimationFrame(rafId);
        elapsed = Math.max(0, seconds);
        renderFrame(elapsed);
      },
      resume() {
        if (disposed) return;
        cancelAnimationFrame(rafId);
        lastNow = performance.now();
        rafId = requestAnimationFrame(animate);
      },
      dispose() {
        if (disposed) return;
        disposed = true;
        cancelAnimationFrame(rafId);
        releasePointer();
        window.removeEventListener('resize', resize);
        window.removeEventListener('keydown', onKeyDown);
        Object.entries(canvasEvents).forEach(([type, handler]) => canvas.removeEventListener(type, handler));
        gui.destroy();
        fullscreenQuad.geometry.dispose();
        material.dispose();
        renderer.dispose();
      },
    });
  </script>
</body>
</html>
