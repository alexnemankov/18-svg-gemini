                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

            },

            },
            'Palette (FEF1BE, FFBA00, 008189, 00474D, 061210)': {

            },
            'Palette (D4FFB0, 7FFF00, 00B894, 0A3322, 05140A)': {

                warpColor: '#d4ffb0',

            },
            'Palette (FFE8CC, FF8C00, C7501A, 3D1050, 0E0618)': {
                passColor: '#ff8c00',
                defectColor: '#c7501a',
                warpColor: '#ffe8cc',

                bgColor: '#0e0618',
                accentColor: '#ff8c00'
            },
            'Palette (E8E0FF, B38FFF, 6A3DE8, 1A1250, 090612)': {
                passColor: '#b38fff',
                defectColor: '#6a3de8',
                warpColor: '#e8e0ff',
                weftColor: '#1a1250',
                bgColor: '#090612',
                accentColor: '#b38fff'
            },
            'Palette (E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)': {
                passColor: '#00f0ff',
                defectColor: '#d40078',
                warpColor: '#e0fbff',
                weftColor: '#1e0a3d',
                bgColor: '#05020f',
                accentColor: '#00f0ff'
            }
        };

        const ANIMATIONS = [
            'Static (No Camera Motion)',
            'Inspection Scan (Horizontal Sweep)',
            'Tension Pulse (Loom Breathing)',
            'Turntable Orbit (Continuous 360)',
            'Microscope Focus (Depth Travel)',
            'Loom Shuttle (Figure-8 Flow)',
            'Weft Wave (Roll & Pitch Glide)',
            'Laser Line Elevator (Vertical Scan)'
        ];

        const SETTINGS = {
            // General
            colorScheme: 'Complementary (Machine Vision Pass/Defect)',
            animation: 'Inspection Scan (Horizontal Sweep)',
            animationSpeed: 1.0,
            streamSpeed: 3.5,
            randomizeOnClick: true,

            // Weave Structure & Interference
            warpCount: 88.0,
            weftCount: 44.0,
            warpThickness: 0.38,
            weftThickness: 0.38,
            defectRate: 0.28,
            laserScan: true,
            laserSpeed: 1.2,
            laserIntensity: 1.5,
            moireInterference: 1.0,

            // Geometry & Curvature
            curveSoftness: 5.5,
            curveWidth: 0.42,
            curveDepth: 0.95,
            height: 1.35,
            wallTilt: 0.0,
            fov: 105.0,

            // Post-Processing
            dpr: Math.min(window.devicePixelRatio || 1.0, 2.0),
            bloomStrength: 0.45,
            bloomRadius: 0.85,
            chromaticAberration: 0.0035,
            edgeBlurStrength: 0.008,

            // Camera & Navigation
            zoom: 1.0,
            objectX: 0.0,
            objectY: 0.0,
            cameraY: 0.0,
            cameraSpinSpeed: 0.0,

            // Colors
            passColor: COLOR_SCHEMES['Complementary (Machine Vision Pass/Defect)'].passColor,
            defectColor: COLOR_SCHEMES['Complementary (Machine Vision Pass/Defect)'].defectColor,
            warpColor: COLOR_SCHEMES['Complementary (Machine Vision Pass/Defect)'].warpColor,
            weftColor: COLOR_SCHEMES['Complementary (Machine Vision Pass/Defect)'].weftColor,
            bgColor: COLOR_SCHEMES['Complementary (Machine Vision Pass/Defect)'].bgColor,
            accentColor: COLOR_SCHEMES['Complementary (Machine Vision Pass/Defect)'].accentColor,

            // Greenscreen
            greenScreen: false,
            greenScreenColor: '#00ff00'
        };

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(SETTINGS.bgColor);

        const camera = new THREE.PerspectiveCamera(SETTINGS.fov, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, SETTINGS.cameraY, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(SETTINGS.dpr);
        document.body.appendChild(renderer.domElement);

        document.getElementById('loading').style.display = 'none';

        // HIGH-RESOLUTION INSPECTION & DEFECT MASK TEXTURE (CanvasTexture)
        const canvasTexture = document.createElement('canvas');
        canvasTexture.width = 1024;
        canvasTexture.height = 1024;
        const ctx = canvasTexture.getContext('2d');

        function generateDataTexture() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, 1024, 1024);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 22px monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            const chars = '01X!#%+*?ABCDEF89KNOTDEFECT';
            const cell = 32;
            for (let x = 0; x < 1024; x += cell) {
                for (let y = 0; y < 1024; y += cell) {
                    const rnd = Math.random();
                    if (rnd > 0.4) {
                        // Inspection defect stamps & binary noise
                        if (rnd > 0.88) {
                            ctx.fillStyle = '#ffffff';
                            ctx.beginPath();
                            ctx.arc(x + cell / 2, y + cell / 2, 7, 0, Math.PI * 2);
                            ctx.fill();
                        } else {
                            ctx.fillStyle = `rgb(${Math.floor(rnd * 255)}, ${Math.floor(rnd * 255)}, ${Math.floor(rnd * 255)})`;
                            const char = chars[Math.floor(Math.random() * chars.length)];
                            ctx.fillText(char, x + cell / 2, y + cell / 2);
                        }
                    }
                }
            }
        }
        generateDataTexture();

        const dataTexture = new THREE.CanvasTexture(canvasTexture);
        dataTexture.wrapS = THREE.RepeatWrapping;
        dataTexture.wrapT = THREE.RepeatWrapping;
        dataTexture.minFilter = THREE.LinearMipmapLinearFilter;
        dataTexture.magFilter = THREE.LinearFilter;
        dataTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();

        const tunnelGroup = new THREE.Group();
        scene.add(tunnelGroup);

        // WEAVE INSPECTION SHADER MATERIAL
        const wallVertexShader = `
            varying vec2 vUv;
            varying vec3 vPosition;
            uniform float uCurveSoftness;

            void main() {
                vUv = uv;
                vec3 pos = position;

                float angle = atan(pos.z, pos.x);
                float normX = cos(angle);
                float n = max(1.0, uCurveSoftness);

                float absZ = pow(max(0.00001, 1.0 - pow(abs(normX), n)), 1.0 / n) * 100.0;
                pos.z = sign(sin(angle)) * absZ;

                vPosition = pos;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
            }
        `;

        const wallFragmentShader = `
            varying vec2 vUv;
            varying vec3 vPosition;

            uniform float uTime;
            uniform float uSpeed;
            uniform float uWarpCount;
            uniform float uWeftCount;
            uniform float uWarpThickness;
            uniform float uWeftThickness;
            uniform float uDefectRate;
            uniform float uMoireInterference;
            uniform float uLaserScan;
            uniform float uLaserSpeed;
            uniform float uLaserIntensity;

            uniform vec3 uPassColor;
            uniform vec3 uDefectColor;
            uniform vec3 uWarpColor;
            uniform vec3 uWeftColor;
            uniform vec3 uBgColor;
            uniform vec3 uAccentColor;
            uniform sampler2D uDataTexture;

            float hash12(vec2 p) {
                vec3 p3  = fract(vec3(p.xyx) * 0.1031);
                p3 += dot(p3, p3.yzx + 33.33);
                return fract((p3.x + p3.y) * p3.z);
            }

            vec3 getWeaveSurface(vec3 pos, float isReflection) {
                // 1. Orthogonal coordinate calculation
                float angle = atan(pos.z, pos.x);
                float normAngle = (angle + 3.14159265359) / 6.28318530718;

                // Motion
                float streamAngle = normAngle + uTime * uSpeed * 0.004;

                // 2. Vertical Warp Band Set: floor(angle * N)
                float warpCoord = streamAngle * uWarpCount;
                float warpId = floor(warpCoord);
                float warpFrac = fract(warpCoord) - 0.5;
                float warpDist = abs(warpFrac);
                float warpAa = fwidth(warpCoord) * 0.75 + 0.02;
                float warpProfile = smoothstep(uWarpThickness * 0.5 + warpAa, uWarpThickness * 0.5 - warpAa, warpDist);

                // 3. Horizontal Weft Band Set (Radial trackId bands): floor((pos.y + 40.0) / trackHeight)
                float totalHeight = 80.0;
                float trackHeight = totalHeight / max(1.0, uWeftCount);
                float weftY = pos.y + 40.0;
                float weftId = floor(weftY / trackHeight);
                float weftCenter = (weftId + 0.5) * trackHeight;
                float weftDist = abs(weftY - weftCenter);
                float weftThick = trackHeight * uWeftThickness * 0.5;
                float weftAa = fwidth(weftY) * 0.75 + 0.02;
                float weftProfile = smoothstep(weftThick + weftAa, weftThick - weftAa, weftDist);

                // 4. Multiply masks together -> Moiré / Interference of woven grid
                float intersectionMask = warpProfile * weftProfile;
                float gridUnion = max(warpProfile, weftProfile);

                // 5. Plain Weave Alternating Over/Under Logic & XOR Defect sampling
                float warpBit = mod(warpId, 2.0);
                float weftBit = mod(weftId, 2.0);
                float xorMismatch = abs(warpBit - weftBit); // 0 when agreeing, 1 when XOR

                // Sample data texture only at intersections as a defect / knot mask
                vec2 knotCell = vec2(warpId * 0.03125, weftId * 0.03125);
                float knotDataSample = texture2D(uDataTexture, knotCell).r;
                float randomDefect = hash12(vec2(warpId, weftId * 13.37));

                // A knot defect occurs if XOR logic triggers or defect texture threshold exceeds tolerance
                bool isDefect = (xorMismatch > 0.5 && randomDefect < (uDefectRate * 1.5)) || (knotDataSample > (1.0 - uDefectRate * 0.65));

                // Color assignment: Green where warp/weft agree ("pass"), Red where they XOR ("defect")
                vec3 knotColor = isDefect ? uDefectColor : uPassColor;

                // Subtle weave shading & fiber thread tint
                vec3 threadBody = mix(uWarpColor, uWeftColor, step(0.5, mod(warpId + weftId, 2.0)));
                float threadShading = (1.0 - warpDist * 0.8) * (1.0 - (weftDist / max(0.01, weftThick)) * 0.4);

                // Light table background
                vec3 finalSurface = uBgColor;

                // Optical calibration background grid on light table
                float lightTableGrid = step(0.96, fract(streamAngle * 16.0)) + step(0.96, fract(weftY / 4.0));
                finalSurface = mix(finalSurface, finalSurface * 0.92, lightTableGrid * 0.25);

                // Compose thread grid
                vec3 threadColor = mix(threadBody * 0.9, threadBody * 1.15, threadShading);
                finalSurface = mix(finalSurface, threadColor, gridUnion * 0.85);

                // Highlight intersections with Pass / Defect machine-vision glow
                if (intersectionMask > 0.01) {
                    float knotGlow = smoothstep(0.0, 1.0, intersectionMask);
                    vec3 highlight = knotColor * (1.2 + 0.6 * knotDataSample);
                    finalSurface = mix(finalSurface, highlight, knotGlow * 0.9);
                }

                // 6. Laser Inspection Line Scan
                if (uLaserScan > 0.5) {
                    float laserY = sin(uTime * uLaserSpeed * 1.2) * 36.0;
                    float laserDist = abs(pos.y - laserY);
                    float laserBeam = exp(-laserDist * 1.1) * uLaserIntensity;
                    float laserCore = smoothstep(0.35, 0.0, laserDist) * 2.0;

                    // Laser illuminates nodes under the inspection line
                    vec3 laserColor = mix(uPassColor, uAccentColor, 0.5);
                    finalSurface += laserColor * (laserBeam * 0.4 + laserCore * 0.6);

                    // Extra intense inspection pulse at defect crossings under laser
                    if (isDefect && intersectionMask > 0.1) {
                        float defectPulse = exp(-laserDist * 0.4) * intersectionMask;
                        finalSurface += uDefectColor * defectPulse * 1.8;
                    }
                }

                // 7. Light-table edge vignette & depth fade
                if (isReflection == 1.0) {
                    float fade = smoothstep(-38.0, -12.0, pos.y);
                    finalSurface = mix(uBgColor, finalSurface * 0.45, fade);
                } else {
                    float fade = smoothstep(40.0, 18.0, pos.y);
                    finalSurface = mix(uBgColor, finalSurface, fade);
                }

                return finalSurface;
            }

            void main() {
                float floorLevel = -12.0;
                vec3 col;

                if (vPosition.y > floorLevel) {
                    col = getWeaveSurface(vPosition, 0.0);
                } else {
                    vec3 reflectedPos = vPosition;
                    reflectedPos.y = floorLevel + (floorLevel - vPosition.y);
                    col = getWeaveSurface(reflectedPos, 1.0);
                    // Light-table glossy reflection tint
                    col = mix(col, uBgColor * 0.85, 0.25);
                }

                // Crisp light-table horizon seam
                float horizonSeam = smoothstep(0.4, 0.0, abs(vPosition.y - floorLevel));
                col = mix(col, uPassColor * 0.5 + uBgColor * 0.5, horizonSeam * 0.3);

                gl_FragColor = vec4(col, 1.0);
            }
        `;

        const uniforms = {
            uTime: { value: 0.0 },
            uSpeed: { value: SETTINGS.streamSpeed * SETTINGS.animationSpeed },
            uWarpCount: { value: SETTINGS.warpCount },
            uWeftCount: { value: SETTINGS.weftCount },
            uWarpThickness: { value: SETTINGS.warpThickness },
            uWeftThickness: { value: SETTINGS.weftThickness },
            uDefectRate: { value: SETTINGS.defectRate },
            uMoireInterference: { value: SETTINGS.moireInterference },
            uCurveSoftness: { value: SETTINGS.curveSoftness },
            uLaserScan: { value: SETTINGS.laserScan ? 1.0 : 0.0 },
            uLaserSpeed: { value: SETTINGS.laserSpeed },
            uLaserIntensity: { value: SETTINGS.laserIntensity },
            uPassColor: { value: new THREE.Color(SETTINGS.passColor) },
            uDefectColor: { value: new THREE.Color(SETTINGS.defectColor) },
            uWarpColor: { value: new THREE.Color(SETTINGS.warpColor) },
            uWeftColor: { value: new THREE.Color(SETTINGS.weftColor) },
            uBgColor: { value: new THREE.Color(SETTINGS.bgColor) },
            uAccentColor: { value: new THREE.Color(SETTINGS.accentColor) },
            uDataTexture: { value: dataTexture }
        };

        const material = new THREE.ShaderMaterial({
            vertexShader: wallVertexShader,
            fragmentShader: wallFragmentShader,
            uniforms,
            side: THREE.BackSide,
            transparent: false
        });

        const geometry = new THREE.CylinderGeometry(100, 100, 80, 160, 1, true);
        const wall = new THREE.Mesh(geometry, material);
        tunnelGroup.add(wall);

        // PARTICLES (Laser Inspection Sparkles / Floating Dust)
        const particleCount = 1500;
        const particleGeometry = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        const particleSpeeds = new Float32Array(particleCount);

        for (let i = 0; i < particleCount; i++) {
            const angle = Math.random() * Math.PI * 2;
            const radius = 98.0 + Math.random() * 1.8;
            const y = -11.0 + Math.random() * 49.0;

            particlePositions[i * 3] = Math.cos(angle) * radius;
            particlePositions[i * 3 + 1] = y;
            particlePositions[i * 3 + 2] = Math.sin(angle) * radius;
            particleSpeeds[i] = 0.4 + Math.random() * 1.6;
        }

        particleGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        particleGeometry.setAttribute('aSpeed', new THREE.BufferAttribute(particleSpeeds, 1));

        const particleUniforms = {
            uTime: { value: 0.0 },
            uSpeed: { value: SETTINGS.streamSpeed * SETTINGS.animationSpeed },
            uCurveSoftness: { value: SETTINGS.curveSoftness },
            uParticleColor: { value: new THREE.Color(SETTINGS.passColor) }
        };

        const particleMaterial = new THREE.ShaderMaterial({
            uniforms: particleUniforms,
            vertexShader: `
                uniform float uTime;
                uniform float uSpeed;
                uniform float uCurveSoftness;
                attribute float aSpeed;
                varying float vAlpha;

                void main() {
                    vec3 pos = position;

                    float angle = atan(pos.z, pos.x);
                    float radius = length(pos.xz);
                    float currentAngle = angle - uTime * uSpeed * 0.008 * aSpeed;

                    float normX = cos(currentAngle);
                    float n = max(1.0, uCurveSoftness);
                    float absZ = pow(max(0.00001, 1.0 - pow(abs(normX), n)), 1.0 / n) * radius;

                    pos.x = cos(currentAngle) * radius;
                    pos.z = sign(sin(currentAngle)) * absZ;

                    vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                    gl_PointSize = (12.0 / -mvPosition.z);
                    gl_Position = projectionMatrix * mvPosition;

                    vAlpha = smoothstep(38.0, 24.0, pos.y) * smoothstep(-12.0, -6.0, pos.y);
                }
            `,
            fragmentShader: `
                uniform vec3 uParticleColor;
                varying float vAlpha;

                void main() {
                    vec2 xy = gl_PointCoord.xy - vec2(0.5);
                    float d = length(xy);
                    if (d > 0.5) discard;

                    float glow = 1.0 - (d * 2.0);
                    gl_FragColor = vec4(uParticleColor, vAlpha * glow * 0.7);
                }
            `,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const particles = new THREE.Points(particleGeometry, particleMaterial);
        tunnelGroup.add(particles);

        // POST-PROCESSING COMPOSER & PASSES
        const composer = new EffectComposer(renderer);
        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);

        const PeripheralBlurShader = {
            uniforms: {
                tDiffuse: { value: null },
                uStrength: { value: SETTINGS.edgeBlurStrength },
                uAspect: { value: window.innerWidth / window.innerHeight }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D tDiffuse;
                uniform float uStrength;
                uniform float uAspect;
                varying vec2 vUv;

                void main() {
                    vec2 center = vec2(0.5, 0.5);
                    vec2 uvCorrection = vec2(uAspect, 1.0);
                    float dist = length((vUv - center) * uvCorrection);
                    float blurMask = smoothstep(0.18, 0.75, dist);

                    if (blurMask <= 0.0) {
                        gl_FragColor = texture2D(tDiffuse, vUv);
                        return;
                    }

                    const int SAMPLES = 24;
                    const float GOLDEN_ANGLE = 2.39996323;
                    vec4 color = vec4(0.0);
                    float radius = uStrength * blurMask;

                    for (int i = 0; i < SAMPLES; i++) {
                        float r = sqrt(float(i) + 0.5) / sqrt(float(SAMPLES));
                        float theta = float(i) * GOLDEN_ANGLE;
                        vec2 offset = vec2(cos(theta), sin(theta)) * r * radius;
                        offset.x /= uAspect;
                        color += texture2D(tDiffuse, vUv + offset);
                    }
                    gl_FragColor = color / float(SAMPLES);
                }
            `
        };
        const peripheralBlurPass = new ShaderPass(PeripheralBlurShader);
        composer.addPass(peripheralBlurPass);

        const ChromaticAberrationShader = {
            uniforms: {
                tDiffuse: { value: null },
                uAmount: { value: SETTINGS.chromaticAberration }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D tDiffuse;
                uniform float uAmount;
                varying vec2 vUv;

                void main() {
                    vec2 offset = uAmount * (vec2(0.5) - vUv);
                    vec4 cr = texture2D(tDiffuse, vUv + offset);
                    vec4 cga = texture2D(tDiffuse, vUv);
                    vec4 cb = texture2D(tDiffuse, vUv - offset);
                    gl_FragColor = vec4(cr.r, cga.g, cb.b, cga.a);
                }
            `
        };
        const caPass = new ShaderPass(ChromaticAberrationShader);
        composer.addPass(caPass);

        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            SETTINGS.bloomStrength,
            SETTINGS.bloomRadius,
            0.15
        );
        composer.addPass(bloomPass);

        // TRANSFORMS & BACKGROUND UPDATES
        const updateBackground = () => {
            const activeBg = SETTINGS.greenScreen ? SETTINGS.greenScreenColor : SETTINGS.bgColor;
            uniforms.uBgColor.value.set(activeBg);
            scene.background.set(activeBg);
            document.body.style.backgroundColor = activeBg;
        };

        const updateColors = () => {
            uniforms.uPassColor.value.set(SETTINGS.passColor);
            uniforms.uDefectColor.value.set(SETTINGS.defectColor);
            uniforms.uWarpColor.value.set(SETTINGS.warpColor);
            uniforms.uWeftColor.value.set(SETTINGS.weftColor);
            uniforms.uAccentColor.value.set(SETTINGS.accentColor);
            particleUniforms.uParticleColor.value.set(SETTINGS.passColor);
            updateBackground();
        };

        const applyColorScheme = (name) => {
            const scheme = COLOR_SCHEMES[name];
            if (!scheme) return;
            SETTINGS.colorScheme = name;
            SETTINGS.passColor = scheme.passColor;
            SETTINGS.defectColor = scheme.defectColor;
            SETTINGS.warpColor = scheme.warpColor;
            SETTINGS.weftColor = scheme.weftColor;
            SETTINGS.bgColor = scheme.bgColor;
            SETTINGS.accentColor = scheme.accentColor;
            updateColors();
            gui.controllersRecursive().forEach(c => c.updateDisplay());
        };

        const updateObjectTransform = () => {
            tunnelGroup.position.x = SETTINGS.objectX;
            tunnelGroup.position.y = SETTINGS.objectY;
            tunnelGroup.scale.set(
                SETTINGS.curveWidth * SETTINGS.zoom,
                SETTINGS.height * SETTINGS.zoom,
                SETTINGS.curveDepth * SETTINGS.zoom
            );
            tunnelGroup.rotation.z = SETTINGS.wallTilt * Math.PI / 180;
        };

        // PROCEDURAL RANDOMIZATION FUNCTION
        const randomizeScene = () => {
            // Pick a random scheme or procedural harmony
            const schemeKeys = Object.keys(COLOR_SCHEMES);
            const randomSchemeName = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
            applyColorScheme(randomSchemeName);

            // Re-roll geometric & motion parameters
            SETTINGS.warpCount = Math.floor(THREE.MathUtils.randFloat(32, 140));
            SETTINGS.weftCount = Math.floor(THREE.MathUtils.randFloat(20, 80));
            SETTINGS.warpThickness = THREE.MathUtils.randFloat(0.2, 0.55);
            SETTINGS.weftThickness = THREE.MathUtils.randFloat(0.2, 0.55);
            SETTINGS.defectRate = THREE.MathUtils.randFloat(0.1, 0.5);
            SETTINGS.curveSoftness = THREE.MathUtils.randFloat(2.0, 8.5);
            SETTINGS.curveWidth = THREE.MathUtils.randFloat(0.25, 0.65);
            SETTINGS.curveDepth = THREE.MathUtils.randFloat(0.6, 1.4);
            SETTINGS.wallTilt = THREE.MathUtils.randFloat(-25, 25);
            SETTINGS.streamSpeed = THREE.MathUtils.randFloat(1.5, 6.5);
            SETTINGS.bloomStrength = THREE.MathUtils.randFloat(0.2, 0.8);
            SETTINGS.chromaticAberration = THREE.MathUtils.randFloat(0.001, 0.008);

            // Pick a random animation preset
            SETTINGS.animation = ANIMATIONS[Math.floor(Math.random() * ANIMATIONS.length)];

            // Push updates to shaders and materials
            uniforms.uWarpCount.value = SETTINGS.warpCount;
            uniforms.uWeftCount.value = SETTINGS.weftCount;
            uniforms.uWarpThickness.value = SETTINGS.warpThickness;
            uniforms.uWeftThickness.value = SETTINGS.weftThickness;
            uniforms.uDefectRate.value = SETTINGS.defectRate;
            uniforms.uCurveSoftness.value = SETTINGS.curveSoftness;
            particleUniforms.uCurveSoftness.value = SETTINGS.curveSoftness;
            bloomPass.strength = SETTINGS.bloomStrength;
            caPass.uniforms.uAmount.value = SETTINGS.chromaticAberration;

            // Generate fresh defect pattern
            generateDataTexture();
            dataTexture.needsUpdate = true;

            updateObjectTransform();
            gui.controllersRecursive().forEach(c => c.updateDisplay());
        };

        // LIL-GUI INITIALIZATION
        const gui = new GUI({ title: 'Weave Inspection Line' });

        const fPresets = gui.addFolder('Presets & Animation');
        fPresets.add(SETTINGS, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Color Scheme').onChange(applyColorScheme);
        fPresets.add(SETTINGS, 'animation', ANIMATIONS).name('Animation Mode');
        fPresets.add(SETTINGS, 'animationSpeed', 0.1, 3.0).name('Anim Speed').onChange(v => {
            uniforms.uSpeed.value = SETTINGS.streamSpeed * v;
            particleUniforms.uSpeed.value = SETTINGS.streamSpeed * v;
        });
        fPresets.add(SETTINGS, 'streamSpeed', 0.0, 10.0).name('Stream Speed').onChange(v => {
            uniforms.uSpeed.value = v * SETTINGS.animationSpeed;
            particleUniforms.uSpeed.value = v * SETTINGS.animationSpeed;
        });
        fPresets.add(SETTINGS, 'randomizeOnClick').name('Randomize On Click');
        fPresets.add({ randomize: randomizeScene }, 'randomize').name('🎲 Randomize Scene');

        const fStructure = gui.addFolder('Weave Grid & Defects');
        fStructure.add(SETTINGS, 'warpCount', 10, 200, 1).name('Warp Bands (N)').onChange(v => uniforms.uWarpCount.value = v);
        fStructure.add(SETTINGS, 'weftCount', 10, 120, 1).name('Weft Tracks').onChange(v => uniforms.uWeftCount.value = v);
        fStructure.add(SETTINGS, 'warpThickness', 0.05, 0.95).name('Warp Thickness').onChange(v => uniforms.uWarpThickness.value = v);
        fStructure.add(SETTINGS, 'weftThickness', 0.05, 0.95).name('Weft Thickness').onChange(v => uniforms.uWeftThickness.value = v);
        fStructure.add(SETTINGS, 'defectRate', 0.0, 1.0).name('Defect Rate').onChange(v => uniforms.uDefectRate.value = v);
        fStructure.add(SETTINGS, 'laserScan').name('Inspection Laser').onChange(v => uniforms.uLaserScan.value = v ? 1.0 : 0.0);
        fStructure.add(SETTINGS, 'laserSpeed', 0.1, 4.0).name('Laser Scan Speed').onChange(v => uniforms.uLaserSpeed.value = v);
        fStructure.add(SETTINGS, 'laserIntensity', 0.2, 4.0).name('Laser Intensity').onChange(v => uniforms.uLaserIntensity.value = v);

        const fGeometry = gui.addFolder('Geometry & Shape');
        fGeometry.add(SETTINGS, 'curveSoftness', 1.0, 10.0).name('Curve Softness').onChange(v => {
            uniforms.uCurveSoftness.value = v;
            particleUniforms.uCurveSoftness.value = v;
        });
        fGeometry.add(SETTINGS, 'curveWidth', 0.1, 3.0).name('Curve Width').onChange(updateObjectTransform);
        fGeometry.add(SETTINGS, 'curveDepth', 0.1, 3.0).name('Curve Depth').onChange(updateObjectTransform);
        fGeometry.add(SETTINGS, 'height', 0.2, 3.0).name('Wall Height').onChange(updateObjectTransform);
        fGeometry.add(SETTINGS, 'wallTilt', -180, 180).name('Wall Tilt (deg)').onChange(updateObjectTransform);
        fGeometry.add(SETTINGS, 'zoom', 0.15, 5.0).name('Zoom').onChange(updateObjectTransform);
        fGeometry.add(SETTINGS, 'objectX', -100.0, 100.0).name('Object X').onChange(updateObjectTransform);
        fGeometry.add(SETTINGS, 'objectY', -60.0, 60.0).name('Object Y').onChange(updateObjectTransform);
        fGeometry.add(SETTINGS, 'fov', 30, 140).name('Camera FOV').onChange(v => {
            camera.fov = v;
            camera.updateProjectionMatrix();
        });

        const fColors = gui.addFolder('Colors & Light Table');
        fColors.addColor(SETTINGS, 'passColor').name('Pass (Agree)').onChange(updateColors);
        fColors.addColor(SETTINGS, 'defectColor').name('Defect (XOR)').onChange(updateColors);
        fColors.addColor(SETTINGS, 'warpColor').name('Warp Threads').onChange(updateColors);
        fColors.addColor(SETTINGS, 'weftColor').name('Weft Threads').onChange(updateColors);
        fColors.addColor(SETTINGS, 'bgColor').name('Light Table BG').onChange(updateColors);
        fColors.addColor(SETTINGS, 'accentColor').name('Laser Accent').onChange(updateColors);
        fColors.add(SETTINGS, 'greenScreen').name('Green Screen').onChange(updateBackground);
        fColors.addColor(SETTINGS, 'greenScreenColor').name('Green Color').onChange(updateBackground);

        const fEffects = gui.addFolder('Post-Processing & Quality');
        fEffects.add(SETTINGS, 'dpr', 0.25, 3.0, 0.05).name('Pixel Ratio (DPR)').onChange(v => {
            renderer.setPixelRatio(v);
            composer.setPixelRatio(v);
        });
        fEffects.add(SETTINGS, 'bloomStrength', 0.0, 4.0).name('Bloom Strength').onChange(v => bloomPass.strength = v);
        fEffects.add(SETTINGS, 'bloomRadius', 0.0, 2.0).name('Bloom Radius').onChange(v => bloomPass.radius = v);
        fEffects.add(SETTINGS, 'chromaticAberration', 0.0, 0.03).name('RGB Shift').onChange(v => caPass.uniforms.uAmount.value = v);
        fEffects.add(SETTINGS, 'edgeBlurStrength', 0.0, 0.04).name('Edge Blur').onChange(v => peripheralBlurPass.uniforms.uStrength.value = v);

        // KEYBOARD SHORTCUT: Toggle GUI with 'H'
        window.addEventListener('keydown', (e) => {
            if (e.key === 'h' || e.key === 'H') {
                gui._hidden ? gui.show() : gui.hide();
            }
        });

        // INTERACTIVE POINTER & ZOOM DRAG CONTROLS
        const dragState = {
            active: false,
            pointerId: null,
            startX: 0,
            startY: 0,
            objectX: 0,
            objectY: 0,
            totalTravel: 0
        };

        renderer.domElement.addEventListener('wheel', (event) => {
            event.preventDefault();
            const zoomFactor = event.deltaY > 0 ? 0.92 : 1.08;
            SETTINGS.zoom = THREE.MathUtils.clamp(SETTINGS.zoom * zoomFactor, 0.15, 5.0);
            updateObjectTransform();
            gui.controllersRecursive().find(controller => controller.property === 'zoom')?.updateDisplay();
        }, { passive: false });

        renderer.domElement.addEventListener('pointerdown', (event) => {
            if (event.button !== 0) return;
            dragState.active = true;
            dragState.pointerId = event.pointerId;
            dragState.startX = event.clientX;
            dragState.startY = event.clientY;
            dragState.objectX = SETTINGS.objectX;
            dragState.objectY = SETTINGS.objectY;
            dragState.totalTravel = 0;
            renderer.domElement.setPointerCapture(event.pointerId);
        });

        renderer.domElement.addEventListener('pointermove', (event) => {
            if (!dragState.active || event.pointerId !== dragState.pointerId) return;
            const dx = event.clientX - dragState.startX;
            const dy = event.clientY - dragState.startY;
            dragState.totalTravel += Math.hypot(dx, dy);

            const worldUnitsPerPixel = 0.12 / SETTINGS.zoom;
            SETTINGS.objectX = dragState.objectX + dx * worldUnitsPerPixel;
            SETTINGS.objectY = dragState.objectY - dy * worldUnitsPerPixel;
            updateObjectTransform();
        });

        const endDrag = (event) => {
            if (!dragState.active || event.pointerId !== dragState.pointerId) return;
            const wasClick = dragState.totalTravel < 6;
            dragState.active = false;
            dragState.pointerId = null;
            renderer.domElement.releasePointerCapture(event.pointerId);

            gui.controllersRecursive().forEach(controller => {
                if (controller.property === 'objectX' || controller.property === 'objectY') {
                    controller.updateDisplay();
                }
            });

            // Click-to-randomize if user performed a simple click without dragging
            if (wasClick && SETTINGS.randomizeOnClick) {
                randomizeScene();
            }
        };

        renderer.domElement.addEventListener('pointerup', endDrag);
        renderer.domElement.addEventListener('pointercancel', endDrag);

        // ANIMATION LOOP
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const t = clock.getElapsedTime();
            const animSpeed = SETTINGS.animationSpeed;

            uniforms.uTime.value = t;
            particleUniforms.uTime.value = t;

            // Apply 8 preconfigured animation trajectories
            switch (SETTINGS.animation) {
                case 'Static (No Camera Motion)':
                    camera.position.set(0, SETTINGS.cameraY, 0);
                    camera.rotation.set(0, 0, 0);
                    break;

                case 'Inspection Scan (Horizontal Sweep)':
                    camera.position.x = Math.sin(t * 0.4 * animSpeed) * 8.0;
                    camera.position.y = SETTINGS.cameraY + Math.cos(t * 0.25 * animSpeed) * 1.5;
                    camera.position.z = 0;
                    camera.rotation.y = Math.sin(t * 0.3 * animSpeed) * 0.08;
                    camera.rotation.z = 0;
                    break;

                case 'Tension Pulse (Loom Breathing)':
                    const pulse = Math.sin(t * 0.6 * animSpeed);
                    camera.position.set(0, SETTINGS.cameraY, pulse * 4.0);
                    camera.rotation.set(0, 0, 0);
                    uniforms.uCurveSoftness.value = SETTINGS.curveSoftness + pulse * 1.2;
                    break;

                case 'Turntable Orbit (Continuous 360)':
                    camera.position.set(0, SETTINGS.cameraY, 0);
                    camera.rotation.y = t * 0.15 * animSpeed;
                    camera.rotation.z = 0;
                    break;

                case 'Microscope Focus (Depth Travel)':
                    camera.position.x = 0;
                    camera.position.y = SETTINGS.cameraY;
                    camera.position.z = Math.sin(t * 0.5 * animSpeed) * 16.0;
                    camera.rotation.set(0, 0, 0);
                    break;

                case 'Loom Shuttle (Figure-8 Flow)':
                    camera.position.x = Math.sin(t * 0.5 * animSpeed) * 12.0;
                    camera.position.y = SETTINGS.cameraY + Math.sin(t * 1.0 * animSpeed) * 4.0;
                    camera.position.z = Math.cos(t * 0.5 * animSpeed) * 6.0;
                    camera.rotation.y = Math.sin(t * 0.5 * animSpeed) * 0.12;
                    camera.rotation.z = Math.cos(t * 0.5 * animSpeed) * 0.03;
                    break;

                case 'Weft Wave (Roll & Pitch Glide)':
                    camera.position.x = Math.sin(t * 0.3 * animSpeed) * 6.0;
                    camera.position.y = SETTINGS.cameraY + Math.sin(t * 0.6 * animSpeed) * 3.0;
                    camera.position.z = 0;
                    camera.rotation.x = Math.sin(t * 0.4 * animSpeed) * 0.05;
                    camera.rotation.z = Math.cos(t * 0.35 * animSpeed) * 0.06;
                    break;

                case 'Laser Line Elevator (Vertical Scan)':
                    camera.position.x = 0;
                    camera.position.y = SETTINGS.cameraY + Math.sin(t * 0.45 * animSpeed) * 12.0;
                    camera.position.z = 0;
                    camera.rotation.set(0, 0, 0);
                    break;
            }

            composer.render();
        }

        updateColors();
        updateObjectTransform();
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
            peripheralBlurPass.uniforms.uAspect.value = window.innerWidth / window.innerHeight;
        });
    </script>
</body>
