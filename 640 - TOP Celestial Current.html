<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020713">
  <meta name="description" content="An endless river of silver-blue stardust. Procedural Three.js particles, flowing filaments, and photographic bokeh.">
  <link rel="icon" href="data:,">
  <title>Celestial Current</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #020713; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
    canvas.dragging { cursor: grabbing; }
    .unavailable { position: fixed; inset: 0; display: grid; place-content: center; padding: 2rem; color: #b5d5ed; font: 15px/1.7 system-ui, sans-serif; text-align: center; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
        "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
      }
    }
  </script>
</head>
<body>
<script type="module">
/*
 * CELESTIAL CURRENT
 * All geometry, light, bokeh, and atmosphere are procedural; no image assets.
 * One file, no build step. Open directly with an internet connection, or serve:
 *   npx --yes --package vite vite --host 127.0.0.1
 * Then open http://localhost:5173/640.html. Three.js is CDN-pinned above;
 * Vite is only an optional development server, with no local dependencies.
 * Positions animate on the GPU. No particle buffers change during playback.
 * Wheel: zoom. Drag: pan. Right-drag or shift-drag: camera angle. H: UI.
 */
let renderer, composer, bloom, output, backgroundPass, gui, animationFrame;
const resources = [];
const listeners = new AbortController();
let disposed = false;

try {
  const [THREE, { EffectComposer }, { RenderPass }, { UnrealBloomPass }, { OutputPass }, { ShaderPass }, { default: GUI }] = await Promise.all([
    import('three'),
    import('three/addons/postprocessing/EffectComposer.js'),
    import('three/addons/postprocessing/RenderPass.js'),
    import('three/addons/postprocessing/UnrealBloomPass.js'),
    import('three/addons/postprocessing/OutputPass.js'),
    import('three/addons/postprocessing/ShaderPass.js'),
    import('lil-gui')
  ]);

  const mobile = matchMedia('(max-width: 760px)').matches;
  const modestDevice = navigator.hardwareConcurrency > 0 && navigator.hardwareConcurrency <= 4;
  const quality = mobile || modestDevice ? 0.65 : 1;
  const settings = {
    waveCount: quality < 1 ? 80000 : 124000,
    dustCount: quality < 1 ? 4500 : 8500,
    bokehCount: quality < 1 ? 190 : 300,
    pixelRatio: Math.min(devicePixelRatio || 1, quality < 1 ? 1.35 : 1.65),
    bloom: quality < 1 ? 0.24 : 0.30,
    palette: 'Original', background: '#020713', greenscreen: false, invert: false,
    color1: '#4d9de6', color2: '#aaddff', color3: '#f2f9ff',
    color4: '#ffecd0', color5: '#f2f9ff', color6: '#f2f9ff',
    animationSpeed: 1, cameraAnimation: 'Static', cameraSpeed: 1, motionAmount: 1,
    zoom: 1, panX: 0, panY: 0, yaw: 0, tilt: 0, roll: 0,
    seed: 0, ribbonWidth: 1, waveAmplitude: 1, turbulence: 1,
    slope: 0.35, curvature: 0.34, flowSpeed: 1, particleSize: 1,
    brightness: 1, bokeh: 1, atmosphere: 1,
    clickRandomize: true
  };

  // Inversion supplies both achromatic polarities without adding extra presets.
  const palettes = {
    'Original': { colors: ['4d9de6','aaddff','f2f9ff','ffecd0'], bg: '020713' },
    'Monochromatic': { colors: ['14437e','2879bf','75b8ef','b5e5ff','f2f8ff','75c5ff'], bg: '020713' },
    'Analogous': { colors: ['263cb4','6773ee','acb5ff','6bcbea','57e1d0','d3fff4'], bg: '040a18' },
    'Complementary': { colors: ['247BD1','75C5FF','d2f2ff','ffb352','f18a38','ffedcb'], bg: '060c17' },
    'Split-complementary': { colors: ['488ceb','9bdfff','7ae5d0','ffe2a1','ef9890','f8e9d8'], bg: '060c16' },
    'Triadic': { colors: ['8d81ef','d4caff','5fd8c1','bcffe4','f3a56e','ffe5ae'], bg: '080913' },
    'Tetradic': { colors: ['6cc5f4','d6f3ff','f4c36c','f198a6','aa91e9','eee0ff'], bg: '080b13' },
    'Double split-complementary': { colors: ['f5b77d','ffe7b1','75d6ae','a8eef1','ab9fe9','f1b3d5'], bg: '080b14' },
    'Achromatic': { colors: ['555555','999999','dddddd','ffffff','bbbbbb','eeeeee'], bg: '000000', achromatic: true },
    'Achromatic + Accent': { colors: ['777777','cccccc','ffffff','dddddd','ff2020','ff2020'], bg: '000000', achromatic: true, accent: true },
    'Neutral + accent': { colors: ['8d8b83','b5ad9e','e5dece','f8f4e9','94a8ac','dba66f'], bg: '111516' },
    'Amber / Ember': { colors: ['F6AA1C','BC3908','941B0C','F6AA1C','220901'], bg: '220901' },
    'Sea Glass': { colors: ['63D1CF','5BC0BE','4BAD9E','4BAD9E','0B132B','000000'], bg: '000000' },
    'Orchid / Mauve': { colors: ['AA60C8','D69ADE','C9A3C6','CFB5C2','0D001D','120A12'], bg: '120A12' },
    'Saffron / Petrol': { colors: ['FEF1BE','FFBA00','008189','00474D','061210'], bg: '061210' },
    'Chartreuse / Jade': { colors: ['D4FFB0','7FFF00','00B894','0A3322','05140A'], bg: '05140A' },
    'Apricot / Aubergine': { colors: ['FFE8CC','FF8C00','C7501A','3D1050','0E0618'], bg: '0E0618' },
    'Lavender / Indigo': { colors: ['E8E0FF','B38FFF','6A3DE8','1A1250','090612'], bg: '090612' },
    'Cyan / Fuchsia': { colors: ['E0FBFF','00F0FF','D40078','1E0A3D','05020F'], bg: '05020F' }
  };
  // Preserve the original linear-light hues, including the subtle champagne accent.
  palettes.Original.colors = [[0.075,0.34,0.79], [0.40,0.74,1], [0.89,0.95,1], [1,0.84,0.58]]
    .map(c => new THREE.Color().setRGB(...c).getHexString());
  palettes.Original.colors.forEach((c, i) => { settings['color' + (i + 1)] = '#' + c; });
  const cameraAnimations = ['Static', 'Slow orbit', 'Lateral drift', 'Vertical float',
    'Breathing', 'Figure eight', 'Gentle roll', 'Depth glide'];

  renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false, powerPreference: 'high-performance' });
  renderer.setPixelRatio(settings.pixelRatio);
  renderer.setSize(innerWidth, innerHeight);
  // Render light against black, then composite the exact background after bloom.
  renderer.setClearColor(0x000000, 1);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.12;
  renderer.domElement.setAttribute('aria-label', 'A slowly flowing river of blue and silver cosmic dust with soft floating bokeh');
  renderer.domElement.setAttribute('role', 'img');
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const particleGroup = new THREE.Group();
  scene.add(particleGroup);
  const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 80);
  camera.position.z = 20;
  const halfHeight = Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5)) * camera.position.z;
  const uniforms = {
    uTime: { value: 0 }, uFlowTime: { value: 0 },
    uFrame: { value: new THREE.Vector2(halfHeight * camera.aspect, halfHeight) },
    uResolution: { value: new THREE.Vector2(innerWidth, innerHeight) },
    uPixelRatio: { value: settings.pixelRatio },
    uPointLimit: { value: renderer.getContext().getParameter(renderer.getContext().ALIASED_POINT_SIZE_RANGE)[1] },
    uPalette: { value: Array.from({ length: 6 }, (_, i) => new THREE.Color(settings['color' + (i + 1)])) },
    uPaletteCount: { value: 4 }, uOriginal: { value: true },
    uSeed: { value: 0 }, uRibbonWidth: { value: 1 }, uWaveAmplitude: { value: 1 },
    uTurbulence: { value: 1 }, uSlope: { value: 0.35 }, uCurvature: { value: 0.34 },
    uPointScale: { value: 1 }, uBrightness: { value: 1 },
    uBokeh: { value: 1 }, uAtmosphere: { value: 1 }
  };

  // A repeatable initial distribution makes the composition independent of refresh.
  let randomState = 674139;
  function random() {
    randomState |= 0;
    randomState = randomState + 0x6D2B79F5 | 0;
    let t = Math.imul(randomState ^ randomState >>> 15, 1 | randomState);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  }
  const gaussian = () => Math.sqrt(-2 * Math.log(Math.max(0.00001, random()))) * Math.cos(6.2831853 * random());

  const fieldGLSL = /* glsl */`
    uniform float uTime;
    uniform vec2 uFrame;
    uniform vec2 uResolution;
    uniform float uPixelRatio;
    uniform float uPointLimit;
    uniform vec3 uPalette[6];
    uniform float uPaletteCount;
    uniform bool uOriginal;
    uniform float uSeed, uRibbonWidth, uWaveAmplitude, uTurbulence;
    uniform float uSlope, uCurvature, uFlowTime, uPointScale;
    uniform float uBrightness, uBokeh, uAtmosphere;
    float hash(vec3 p) {
      p = fract(p * 0.3183099 + vec3(0.13, 0.71, 0.37));
      p *= 17.0;
      return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
    }
    float noise(vec3 p) {
      vec3 i = floor(p), f = fract(p);
      f = f * f * (3.0 - 2.0 * f);
      return mix(mix(mix(hash(i), hash(i + vec3(1,0,0)), f.x),
                     mix(hash(i + vec3(0,1,0)), hash(i + vec3(1,1,0)), f.x), f.y),
                 mix(mix(hash(i + vec3(0,0,1)), hash(i + vec3(1,0,1)), f.x),
                     mix(hash(i + vec3(0,1,1)), hash(i + vec3(1,1,1)), f.x), f.y), f.z);
    }
    float river(float x, float t) {
      return -0.20 + uSlope * x + uCurvature * x * x
        + uWaveAmplitude * (0.085 * sin(7.0 * x + 0.8 + uSeed * 0.01 - t * 0.065)
        + 0.032 * sin(12.0 * x + 1.5 + uSeed * 0.017 + t * 0.043)
        + 0.045 * sin(x * 2.8 + t * 0.052));
    }
    vec3 stardustColor(float seed) {
      if (uOriginal) {
        vec3 color = mix(uPalette[0], uPalette[1], smoothstep(0.08, 0.54, seed));
        color = mix(color, uPalette[2], smoothstep(0.51, 0.84, seed));
        return mix(color, uPalette[3], smoothstep(0.92, 0.98, seed));
      }
      float h = clamp(seed, 0.0, 0.99999) * (uPaletteCount - 1.0);
      if (h < 1.0) return mix(uPalette[0], uPalette[1], h);
      if (h < 2.0) return mix(uPalette[1], uPalette[2], h - 1.0);
      if (h < 3.0) return mix(uPalette[2], uPalette[3], h - 2.0);
      if (h < 4.0) return mix(uPalette[3], uPalette[4], h - 3.0);
      return mix(uPalette[4], uPalette[5], h - 4.0);
    }
  `;

  const waveVertex = /* glsl */`
    ${fieldGLSL}
    attribute vec4 aFlow; // seed, filament ID, size, radiance
    attribute vec2 aDrift; // drift speed, color
    varying vec3 vColor;
    varying float vLight;
    varying float vSpark;
    void main() {
      float seed = aFlow.x;
      float f = aFlow.y;
      float t = uTime;
      // Recycle only in the invisible margins; both sides fade well offscreen.
      float x = mod(position.x + uFlowTime * aDrift.x + 1.65, 3.3) - 1.65;
      float phase = f * 2.399963 + uSeed * 0.27;
      float n = noise(vec3(x * 2.2, f * 0.21 + uSeed * 0.01, t * 0.035));
      float width = uRibbonWidth * (0.72 + 0.20 * sin(x * 4.1 + 0.6) + 0.16 * sin(x * 8.2 - t * 0.04));
      float filament = sin(phase) * 0.12 + 0.075 * sin(x * (4.5 + sin(phase) * 1.8) + phase + t * 0.065);
      filament += 0.035 * sin(x * 11.0 + phase * 1.4 - t * 0.08);
      float y = river(x, t) + filament * width + position.y * width;
      y += (n - 0.5) * (0.055 + abs(position.y) * 0.2) * uTurbulence;
      y += 0.006 * sin(seed * 120.0 + t * 0.11);
      float z = position.z + 0.3 * sin(x * 3.0 + phase + t * 0.05);
      vec3 p = vec3(x * uFrame.x, y * uFrame.y, z);
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_Position = projectionMatrix * mv;
      float perspective = 20.0 / -mv.z;
      float viewportScale = clamp(uResolution.y / 940.0, 0.68, 1.6);
      gl_PointSize = clamp(aFlow.z * uPixelRatio * perspective * viewportScale * uPointScale, 1.0, uPointLimit);
      float envelope = 1.0 - smoothstep(1.29, 1.60, abs(x));
      float shimmer = 0.79 + 0.21 * sin(t * (0.24 + seed * 0.3) + seed * 150.0);
      float density = 0.65 + 0.48 * noise(vec3(x * 4.5, f * 0.4, t * 0.024));
      float focus = exp(-abs(z) * 0.13);
      vLight = aFlow.w * envelope * shimmer * density * focus * uBrightness;
      vColor = stardustColor(aDrift.y);
      vSpark = step(0.982, seed);
    }
  `;
  const waveFragment = /* glsl */`
    precision highp float;
    varying vec3 vColor;
    varying float vLight;
    varying float vSpark;
    void main() {
      vec2 p = gl_PointCoord * 2.0 - 1.0;
      float r2 = dot(p, p);
      if (r2 > 1.0) discard;
      float core = exp(-r2 * 17.0);
      float halo = exp(-r2 * 4.2) * 0.17;
      float crosslight = exp(-abs(p.x * p.y) * 170.0) * exp(-r2 * 5.0) * 0.10 * vSpark;
      float light = (core + halo + crosslight) * (1.0 - smoothstep(0.65, 1.0, r2));
      gl_FragColor = vec4(vColor * vLight, light);
    }
  `;

  function points(count, vertexShader, fragmentShader, fill) {
    const positions = new Float32Array(count * 3);
    const flow = new Float32Array(count * 4);
    const drift = new Float32Array(count * 2);
    for (let i = 0; i < count; i++) fill(i, positions, flow, drift);
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('aFlow', new THREE.BufferAttribute(flow, 4));
    geometry.setAttribute('aDrift', new THREE.BufferAttribute(drift, 2));
    const material = new THREE.ShaderMaterial({
      uniforms, vertexShader, fragmentShader,
      transparent: true, blending: THREE.AdditiveBlending,
      depthWrite: false, depthTest: false
    });
    const cloud = new THREE.Points(geometry, material);
    cloud.frustumCulled = false; // CPU bounds cannot describe GPU displacement.
    particleGroup.add(cloud);
    resources.push(geometry, material);
    return cloud;
  }

  // Narrow filament cores sit inside a wider, much fainter veil of scattered dust.
  points(settings.waveCount, waveVertex, waveFragment, (i, p, a, d) => {
    const j = i * 3, k = i * 4, l = i * 2;
    const seed = random();
    const veil = random() < 0.33;
    p[j] = (random() * 2 - 1) * 1.65;
    p[j + 1] = gaussian() * (veil ? 0.23 : 0.018 + random() * 0.014);
    p[j + 2] = gaussian() * (veil ? 2.8 : 1.1);
    a[k] = seed;
    a[k + 1] = Math.floor(random() * 46);
    const bright = random();
    a[k + 2] = seed > 0.982 ? 5.0 + random() * 5.5 : 1.0 + Math.pow(random(), 3.2) * 3.5;
    a[k + 3] = (veil ? 0.13 : 0.30) + Math.pow(bright, 4) * (veil ? 0.8 : 2.4);
    d[l] = 0.004 + random() * 0.004;
    d[l + 1] = random();
  });

  const dustVertex = /* glsl */`
    ${fieldGLSL}
    attribute vec4 aFlow;
    attribute vec2 aDrift;
    varying vec3 vColor;
    varying float vLight;
    varying float vSpark;
    void main() {
      float seed = aFlow.x;
      vec3 p = position;
      p.x += sin(uTime * 0.023 + seed * 70.0) * 0.012;
      p.y += cos(uTime * 0.018 + seed * 90.0) * 0.014;
      vec4 mv = modelViewMatrix * vec4(p.xy * uFrame, p.z, 1.0);
      gl_Position = projectionMatrix * mv;
      gl_PointSize = clamp(aFlow.z * uPixelRatio * 20.0 / -mv.z * uPointScale, 1.0, uPointLimit);
      vColor = stardustColor(aDrift.y);
      vLight = aFlow.w * (0.72 + 0.28 * sin(seed * 90.0 + uTime * aDrift.x)) * uBrightness;
      vSpark = 0.0;
    }
  `;
  points(settings.dustCount, dustVertex, waveFragment, (i, p, a, d) => {
    const j = i * 3, k = i * 4, l = i * 2;
    const x = (random() * 2 - 1) * 1.5;
    p[j] = x;
    // Most dust follows the current, with sparse points in the darker margins.
    p[j + 1] = random() < 0.75 ? -0.20 + 0.35 * x + 0.34 * x * x + gaussian() * 0.38 : random() * 2.6 - 1.3;
    p[j + 2] = random() * 12 - 8;
    a[k] = random();
    a[k + 2] = 0.8 + Math.pow(random(), 3) * 3.0;
    a[k + 3] = 0.04 + Math.pow(random(), 5) * 0.55;
    d[l] = 0.12 + random() * 0.25;
    d[l + 1] = random();
  });

  const bokehVertex = /* glsl */`
    ${fieldGLSL}
    attribute vec4 aFlow;
    attribute vec2 aDrift;
    varying vec3 vColor;
    varying float vOpacity;
    varying float vFocus;
    void main() {
      float seed = aFlow.x;
      vec3 p = position;
      float parallax = 0.012 + aFlow.y * 0.018;
      p.x += parallax * sin(uTime * 0.025 + seed * 91.0);
      p.y += parallax * cos(uTime * 0.019 + seed * 47.0);
      // Depth-corrected framing keeps even the largest foreground discs onscreen.
      float depth = (20.0 - p.z) / 20.0;
      vec4 mv = modelViewMatrix * vec4(p.xy * uFrame * depth, p.z, 1.0);
      gl_Position = projectionMatrix * mv;
      float viewportScale = clamp(uResolution.y / 940.0, 0.64, 1.6);
      gl_PointSize = clamp(aFlow.z * uPixelRatio * viewportScale * uPointScale * 20.0 / -mv.z, 1.0, uPointLimit);
      vColor = stardustColor(aDrift.y);
      vOpacity = aFlow.w * (0.87 + 0.13 * sin(uTime * 0.09 + seed * 44.0)) * uBokeh * uBrightness;
      vFocus = aDrift.x;
    }
  `;
  const bokehFragment = /* glsl */`
    precision highp float;
    varying vec3 vColor;
    varying float vOpacity;
    varying float vFocus;
    void main() {
      vec2 p = gl_PointCoord * 2.0 - 1.0;
      float r = length(p);
      if (r > 1.0) discard;
      // A soft optical disc plus a diffuse skirt, rather than a hard-edged dot.
      float disc = 1.0 - smoothstep(0.32, 0.87, r);
      float skirt = exp(-r * r * 5.0) * 0.25;
      float lens = exp(-pow((r - 0.54) * 8.0, 2.0)) * 0.06;
      float core = exp(-r * r * 19.0);
      float profile = mix(disc * 0.68 + skirt + lens, core + skirt, vFocus);
      profile *= 1.0 - smoothstep(0.80, 1.0, r);
      gl_FragColor = vec4(vColor * vOpacity, profile);
    }
  `;
  points(settings.bokehCount, bokehVertex, bokehFragment, (i, p, a, d) => {
    const j = i * 3, k = i * 4, l = i * 2;
    const seed = random(), size = random(), accent = random() > 0.80;
    p[j] = random() * 2.24 - 1.12;
    p[j + 1] = random() * 2.3 - 1.15;
    p[j + 2] = random() * 13 - 6;
    a[k] = seed;
    a[k + 1] = size;
    a[k + 2] = accent ? 9 + random() * 26 : 10 + Math.pow(size, 1.8) * 105;
    a[k + 3] = accent ? 0.6 + random() * 1.8 : 0.035 + random() * 0.19;
    d[l] = accent ? 0.75 : random() * 0.3;
    d[l + 1] = random() > 0.76 ? 0.96 : random() * 0.85;
  });

  // Faint, low-frequency light scattering; the actual ribbon is entirely points.
  const atmosphereMaterial = new THREE.ShaderMaterial({
    uniforms,
    depthTest: false, depthWrite: false,
    vertexShader: /* glsl */`
      varying vec2 vUv;
      void main() { vUv = uv; gl_Position = vec4(position.xy, 1.0, 1.0); }
    `,
    fragmentShader: /* glsl */`
      ${fieldGLSL}
      varying vec2 vUv;
      void main() {
        vec2 p = vUv * 2.0 - 1.0;
        float n = noise(vec3(p * vec2(3.0, 3.8), uTime * 0.009));
        float detail = noise(vec3(p * 9.0 + n * 2.0, uTime * 0.013));
        float distanceToRiver = p.y - river(p.x, uTime);
        float mist = exp(-distanceToRiver * distanceToRiver * 6.0);
        float clouds = pow(n * 0.7 + detail * 0.3, 2.5);
        vec3 base = mix(uPalette[0], uPalette[1], 0.3) * 0.025 * mist * clouds * uAtmosphere;
        float vignette = 1.0 - 0.35 * smoothstep(0.35, 1.65, length(p * vec2(0.8, 1.0)));
        gl_FragColor = vec4(base * vignette, 1.0);
      }
    `
  });
  const atmosphereGeometry = new THREE.PlaneGeometry(2, 2);
  const atmosphere = new THREE.Mesh(atmosphereGeometry, atmosphereMaterial);
  atmosphere.frustumCulled = false;
  atmosphere.renderOrder = -1;
  scene.add(atmosphere);
  resources.push(atmosphereGeometry, atmosphereMaterial);

  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), settings.bloom, 0.55, 0.85);
  composer.addPass(bloom);
  output = new OutputPass();
  composer.addPass(output);
  backgroundPass = new ShaderPass({
    uniforms: {
      tDiffuse: { value: null }, uBackground: { value: new THREE.Vector3() },
      uInvert: { value: false }, uAccent: { value: false }
    },
    vertexShader: /* glsl */`
      varying vec2 vUv;
      void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
    `,
    fragmentShader: /* glsl */`
      uniform sampler2D tDiffuse;
      uniform vec3 uBackground;
      uniform bool uInvert, uAccent;
      varying vec2 vUv;
      void main() {
        vec3 emission = clamp(texture2D(tDiffuse, vUv).rgb, 0.0, 1.0);
        float coverage = max(emission.r, max(emission.g, emission.b));
        vec3 ink = emission / max(coverage, 0.00001);
        float chroma = max(ink.r, max(ink.g, ink.b)) - min(ink.r, min(ink.g, ink.b));
        if (uInvert && (!uAccent || chroma < 0.18)) ink = vec3(1.0) - ink;
        // Compositing happens after tone mapping and bloom. In greenscreen mode
        // an empty pixel is exactly (0,1,0), unaffected by exposure or the glow.
        gl_FragColor = vec4(mix(uBackground, ink, coverage), 1.0);
      }
    `
  });
  composer.addPass(backgroundPass);

  const originalCamera = { x: 0, y: 0, yaw: 0, tilt: 0, roll: 0, zoom: 1 };
  const automatic = { ...originalCamera };
  const targetMotion = { ...originalCamera };
  const cameraComponents = Object.keys(automatic);
  const right = new THREE.Vector3(), up = new THREE.Vector3();
  const orbitPosition = new THREE.Vector3();
  let cameraClock = 0;
  const radians = THREE.MathUtils.degToRad;
  const clamp = THREE.MathUtils.clamp;

  function cameraMotion(t, result) {
    Object.assign(result, originalCamera);
    const a = settings.motionAmount;
    switch (settings.cameraAnimation) {
      case 'Slow orbit':
        result.yaw = Math.sin(t * 0.065) * 9 * a;
        result.tilt = Math.sin(t * 0.047) * 4 * a;
        break;
      case 'Lateral drift':
        result.x = Math.sin(t * 0.045) * 0.045 * a;
        result.yaw = Math.sin(t * 0.045) * 2.5 * a;
        break;
      case 'Vertical float':
        result.y = Math.sin(t * 0.048) * 0.035 * a;
        result.tilt = Math.sin(t * 0.032) * 2.5 * a;
        break;
      case 'Breathing':
        result.zoom = Math.exp(Math.sin(t * 0.045) * 0.07 * a);
        break;
      case 'Figure eight':
        result.x = Math.sin(t * 0.042) * 0.035 * a;
        result.y = Math.sin(t * 0.084) * 0.022 * a;
        result.yaw = Math.sin(t * 0.042) * 3.5 * a;
        break;
      case 'Gentle roll':
        result.roll = Math.sin(t * 0.038) * 3.5 * a;
        result.tilt = Math.sin(t * 0.051) * 1.8 * a;
        break;
      case 'Depth glide':
        result.zoom = Math.exp(Math.sin(t * 0.037) * 0.055 * a);
        result.yaw = Math.sin(t * 0.049) * 6 * a;
        result.tilt = Math.sin(t * 0.031) * 3 * a;
        break;
    }
    return result;
  }
  function updateCamera(dt) {
    cameraMotion(cameraClock, targetMotion);
    const smoothing = 1 - Math.exp(-dt * 3);
    for (const key of cameraComponents) {
      automatic[key] = THREE.MathUtils.lerp(automatic[key], targetMotion[key], smoothing);
    }
    const yaw = radians(settings.yaw + automatic.yaw);
    const tilt = radians(clamp(settings.tilt + automatic.tilt, -65, 65));
    orbitPosition.set(20 * Math.sin(yaw) * Math.cos(tilt), 20 * Math.sin(tilt), 20 * Math.cos(yaw) * Math.cos(tilt));
    camera.position.copy(orbitPosition);
    camera.up.set(0, 1, 0);
    camera.lookAt(0, 0, 0);
    camera.rotateZ(radians(settings.roll + automatic.roll));
    camera.zoom = settings.zoom * automatic.zoom;
    camera.updateProjectionMatrix();
    camera.updateMatrixWorld();
    right.setFromMatrixColumn(camera.matrixWorld, 0);
    up.setFromMatrixColumn(camera.matrixWorld, 1);
    // The translation is expressed in viewport fractions, so drag remains aligned
    // with the screen at any user angle, camera animation, aspect ratio, or zoom.
    particleGroup.position.copy(right).multiplyScalar((settings.panX + automatic.x) * halfHeight * camera.aspect * 2 / camera.zoom);
    particleGroup.position.addScaledVector(up, (settings.panY + automatic.y) * halfHeight * 2 / camera.zoom);
    uniforms.uPointScale.value = settings.particleSize * camera.zoom;
  }

  let colorControllers = [], inversionController;
  function refreshControls() {
    if (!gui) return;
    gui.controllersRecursive().forEach(controller => controller.updateDisplay());
    const palette = palettes[settings.palette];
    colorControllers.forEach((controller, i) => controller.show(i < palette.colors.length));
    inversionController?.enable(!!palette.achromatic);
  }
  function syncTheme() {
    const palette = palettes[settings.palette];
    uniforms.uPaletteCount.value = palette.colors.length;
    uniforms.uOriginal.value = settings.palette === 'Original';
    for (let i = 0; i < 6; i++) uniforms.uPalette.value[i].set(settings['color' + (i + 1)]);
    const background = new THREE.Color(settings.greenscreen ? '#00ff00' : settings.background).convertLinearToSRGB();
    backgroundPass.uniforms.uBackground.value.set(background.r, background.g, background.b);
    backgroundPass.uniforms.uInvert.value = !!palette.achromatic && settings.invert;
    backgroundPass.uniforms.uAccent.value = !!palette.accent;
    atmosphere.visible = !settings.greenscreen && settings.atmosphere > 0;
  }
  function choosePalette() {
    const palette = palettes[settings.palette];
    for (let i = 0; i < 6; i++) settings['color' + (i + 1)] = '#' + palette.colors[Math.min(i, palette.colors.length - 1)];
    settings.invert = false;
    settings.background = '#' + palette.bg;
    syncTheme();
    refreshControls();
  }
  function applyInversion() {
    if (palettes[settings.palette].achromatic) settings.background = settings.invert ? '#ffffff' : '#000000';
    syncTheme();
    refreshControls();
  }
  const randomBetween = (min, max) => min + Math.random() * (max - min);
  function randomize() {
    const names = Object.keys(palettes);
    const alternatives = names.filter(name => name !== settings.palette);
    settings.palette = alternatives[Math.floor(Math.random() * alternatives.length)];
    choosePalette();
    if (palettes[settings.palette].achromatic && Math.random() < 0.5) {
      settings.invert = true;
      applyInversion();
    }
    settings.seed = Math.floor(Math.random() * 10000);
    settings.ribbonWidth = randomBetween(0.65, 1.55);
    settings.waveAmplitude = randomBetween(0.6, 1.65);
    settings.turbulence = randomBetween(0.5, 1.75);
    settings.slope = randomBetween(0.18, 0.48);
    settings.curvature = randomBetween(0.16, 0.42);
    settings.flowSpeed = randomBetween(0.6, 1.5);
    settings.animationSpeed = randomBetween(0.55, 1.25);
    settings.cameraSpeed = randomBetween(0.55, 1.2);
    settings.motionAmount = randomBetween(0.6, 1.3);
    settings.cameraAnimation = cameraAnimations[Math.floor(Math.random() * cameraAnimations.length)];
    settings.particleSize = randomBetween(0.85, 1.25);
    settings.brightness = randomBetween(0.8, 1.3);
    settings.bokeh = randomBetween(0.5, 1.25);
    settings.bloom = randomBetween(0.18, 0.38);
    syncTheme();
    refreshControls();
  }
  function resetView() {
    Object.assign(settings, { zoom: 1, panX: 0, panY: 0, yaw: 0, tilt: 0, roll: 0 });
    refreshControls();
  }
  function setPixelRatio() {
    uniforms.uPixelRatio.value = settings.pixelRatio;
    renderer.setPixelRatio(settings.pixelRatio);
    composer.setPixelRatio(settings.pixelRatio);
    resize();
  }

  // Standard lil-gui appearance; no custom panel styling or on-screen instructions.
  gui = new GUI({ title: 'Celestial Current' });
  const themeFolder = gui.addFolder('Color & background');
  themeFolder.add(settings, 'palette', Object.keys(palettes)).name('Color scheme').onChange(choosePalette);
  inversionController = themeFolder.add(settings, 'invert').name('White background').onChange(applyInversion);
  themeFolder.addColor(settings, 'background').name('Background').onChange(syncTheme);
  themeFolder.add(settings, 'greenscreen').name('Greenscreen').onChange(syncTheme);
  const colorsFolder = themeFolder.addFolder('Particle colors').close();
  for (let i = 1; i <= 6; i++) {
    colorControllers.push(colorsFolder.addColor(settings, 'color' + i).name('Color ' + i).onChange(syncTheme));
  }
  const animationFolder = gui.addFolder('Animation');
  animationFolder.add(settings, 'animationSpeed', 0, 3, 0.01).name('Animation speed');
  animationFolder.add(settings, 'cameraAnimation', cameraAnimations).name('Camera motion');
  animationFolder.add(settings, 'cameraSpeed', 0.1, 2, 0.01).name('Camera speed');
  animationFolder.add(settings, 'motionAmount', 0, 2, 0.01).name('Motion amount');
  const viewFolder = gui.addFolder('View').close();
  viewFolder.add(settings, 'zoom', 0.25, 4, 0.01).name('Zoom');
  viewFolder.add(settings, 'panX', -2, 2, 0.001).name('Horizontal position');
  viewFolder.add(settings, 'panY', -2, 2, 0.001).name('Vertical position');
  viewFolder.add(settings, 'yaw', -60, 60, 0.1).name('Camera yaw');
  viewFolder.add(settings, 'tilt', -50, 50, 0.1).name('Camera tilt');
  viewFolder.add(settings, 'roll', -180, 180, 0.1).name('Camera roll');
  viewFolder.add({ resetView }, 'resetView').name('Reset view');
  const waveFolder = gui.addFolder('Particle wave').close();
  waveFolder.add(settings, 'seed', 0, 9999, 1).name('Seed');
  waveFolder.add(settings, 'ribbonWidth', 0.3, 2, 0.01).name('Ribbon width');
  waveFolder.add(settings, 'waveAmplitude', 0.2, 2, 0.01).name('Wave amplitude');
  waveFolder.add(settings, 'turbulence', 0, 2, 0.01).name('Turbulence');
  waveFolder.add(settings, 'slope', -0.5, 0.65, 0.01).name('Slope');
  waveFolder.add(settings, 'curvature', -0.5, 0.6, 0.01).name('Curvature');
  waveFolder.add(settings, 'flowSpeed', 0, 2, 0.01).name('Current speed');
  waveFolder.add(settings, 'particleSize', 0.5, 2, 0.01).name('Particle size');
  waveFolder.add(settings, 'brightness', 0.2, 2, 0.01).name('Brightness');
  waveFolder.add(settings, 'bokeh', 0, 2, 0.01).name('Bokeh');
  waveFolder.add(settings, 'atmosphere', 0, 2, 0.01).name('Atmosphere').onChange(syncTheme);
  const renderFolder = gui.addFolder('Rendering').close();
  renderFolder.add(settings, 'pixelRatio', 0.5, 3, 0.05).name('DPR (Pixel Ratio)').onChange(setPixelRatio);
  renderFolder.add(settings, 'bloom', 0, 0.8, 0.01).name('Bloom');
  gui.add(settings, 'clickRandomize').name('Randomize on click');
  gui.add({ randomize }, 'randomize').name('New variation');
  syncTheme();
  refreshControls();

  const canvas = renderer.domElement;
  let drag = null;
  canvas.addEventListener('contextmenu', event => event.preventDefault(), { signal: listeners.signal });
  canvas.addEventListener('pointerdown', event => {
    if (drag || (event.button !== 0 && event.button !== 2)) return;
    drag = { id: event.pointerId, x: event.clientX, y: event.clientY,
      startX: event.clientX, startY: event.clientY, distance: 0,
      rotate: event.button === 2 || event.shiftKey, time: performance.now() };
    canvas.setPointerCapture(event.pointerId);
    canvas.classList.add('dragging');
  }, { signal: listeners.signal });
  canvas.addEventListener('pointermove', event => {
    if (!drag || event.pointerId !== drag.id) return;
    const dx = event.clientX - drag.x, dy = event.clientY - drag.y;
    drag.distance = Math.max(drag.distance, Math.hypot(event.clientX - drag.startX, event.clientY - drag.startY));
    drag.x = event.clientX; drag.y = event.clientY;
    if (drag.rotate) {
      settings.yaw = clamp(settings.yaw - dx * 0.15, -60, 60);
      settings.tilt = clamp(settings.tilt + dy * 0.15, -50, 50);
    } else {
      settings.panX = clamp(settings.panX + dx / innerWidth, -2, 2);
      settings.panY = clamp(settings.panY - dy / innerHeight, -2, 2);
    }
    refreshControls();
  }, { signal: listeners.signal });
  function endDrag(event) {
    if (!drag || event.pointerId !== drag.id) return;
    const click = event.type === 'pointerup' && !drag.rotate && drag.distance < 5 && performance.now() - drag.time < 600;
    drag = null;
    canvas.classList.remove('dragging');
    if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
    if (click && settings.clickRandomize) randomize();
  }
  canvas.addEventListener('pointerup', endDrag, { signal: listeners.signal });
  canvas.addEventListener('pointercancel', endDrag, { signal: listeners.signal });
  canvas.addEventListener('lostpointercapture', endDrag, { signal: listeners.signal });
  canvas.addEventListener('wheel', event => {
    event.preventDefault();
    const delta = event.deltaY * (event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? innerHeight : 1);
    settings.zoom = clamp(settings.zoom * Math.exp(-clamp(delta, -200, 200) * 0.0012), 0.25, 4);
    refreshControls();
  }, { passive: false, signal: listeners.signal });
  let uiHidden = false;
  window.addEventListener('keydown', event => {
    if (event.repeat || event.ctrlKey || event.metaKey || event.altKey) return;
    if (event.code === 'KeyH') {
      uiHidden = !uiHidden;
      gui.show(!uiHidden);
    }
  }, { signal: listeners.signal });

  function resize() {
    const width = Math.max(1, innerWidth), height = Math.max(1, innerHeight);
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
    uniforms.uFrame.value.set(halfHeight * camera.aspect, halfHeight);
    uniforms.uResolution.value.set(width, height);
    renderer.setSize(width, height);
    composer.setSize(width, height);
  }
  window.addEventListener('resize', resize, { passive: true, signal: listeners.signal });

  // Integrating delta time avoids a jump when a hidden tab returns to the screen.
  let lastTime = performance.now(), elapsed = 0, flowTime = 0;
  function animate(now) {
    if (disposed || document.hidden || renderer.getContext().isContextLost()) return;
    const dt = Math.max(0, Math.min((now - lastTime) / 1000, 0.05));
    lastTime = now;
    const motionDelta = dt * settings.animationSpeed;
    elapsed += motionDelta;
    flowTime += motionDelta * settings.flowSpeed;
    cameraClock += motionDelta * settings.cameraSpeed;
    uniforms.uTime.value = elapsed;
    uniforms.uFlowTime.value = flowTime;
    uniforms.uSeed.value = settings.seed;
    uniforms.uRibbonWidth.value = settings.ribbonWidth;
    uniforms.uWaveAmplitude.value = settings.waveAmplitude;
    uniforms.uTurbulence.value = settings.turbulence;
    uniforms.uSlope.value = settings.slope;
    uniforms.uCurvature.value = settings.curvature;
    uniforms.uBrightness.value = settings.brightness;
    uniforms.uBokeh.value = settings.bokeh;
    uniforms.uAtmosphere.value = settings.atmosphere;
    bloom.strength = settings.bloom;
    updateCamera(dt);
    composer.render(dt);
    animationFrame = requestAnimationFrame(animate);
  }
  function resume() {
    cancelAnimationFrame(animationFrame);
    if (!document.hidden && !disposed) {
      lastTime = performance.now();
      animationFrame = requestAnimationFrame(animate);
    }
  }
  document.addEventListener('visibilitychange', resume, { signal: listeners.signal });
  renderer.domElement.addEventListener('webglcontextlost', event => {
    event.preventDefault();
    cancelAnimationFrame(animationFrame);
  }, { signal: listeners.signal });
  renderer.domElement.addEventListener('webglcontextrestored', resume, { signal: listeners.signal });

  function cleanup() {
    if (disposed) return;
    disposed = true;
    cancelAnimationFrame(animationFrame);
    listeners.abort();
    for (const resource of resources) resource.dispose();
    bloom.dispose();
    output.dispose();
    backgroundPass.dispose();
    composer.dispose();
    gui.destroy();
    renderer.dispose();
  }
  window.addEventListener('pagehide', event => {
    if (event.persisted) cancelAnimationFrame(animationFrame);
    else cleanup();
  }, { signal: listeners.signal });
  window.addEventListener('pageshow', resume, { signal: listeners.signal });
  resize();
  resume();
} catch (error) {
  cancelAnimationFrame(animationFrame);
  listeners.abort();
  for (const resource of resources) resource.dispose();
  bloom?.dispose();
  output?.dispose();
  backgroundPass?.dispose();
  composer?.dispose();
  gui?.destroy();
  renderer?.dispose();
  renderer?.domElement.remove();
  const message = document.createElement('div');
  message.className = 'unavailable';
  message.textContent = 'This scene needs WebGL 2 and an internet connection to load Three.js. Please enable hardware acceleration and reload.';
  document.body.appendChild(message);
  console.error('Celestial Current:', error);
}
</script>
</body>
</html>
