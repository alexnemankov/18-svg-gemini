  <!-- vertexShader -->
  <script id="js-vertex-shader" type="x-shader/x-vertex">
  attribute vec3 position;

  void main() {
    gl_Position = vec4(position, 1.0);
  }
  </script>

  <!-- fragmentShader -->
  <script id="js-fragment-shader" type="x-shader/x-fragment">
  precision highp float;

  uniform vec2 resolution;
  uniform float time;
  uniform float xScale;
  uniform float yScale;
  uniform float distortion;
  uniform float thickness;
  uniform float harmonic;
  uniform float glowStrength;

  // View & Camera transforms
  uniform vec2 pan;
  uniform float zoom;
  uniform vec2 cameraAngle;

  // Color scheme
  uniform vec3 color1;
  uniform vec3 color2;
  uniform vec3 color3;
  uniform vec3 glowColor;
  uniform vec3 backgroundColor;
  uniform bool greenscreen;

  // Lighting & Exposure
  uniform float exposure;
  uniform float masterLightIntensity;
  uniform vec3 ambientColor;
  uniform float ambientIntensity;
  uniform vec3 dirLightColor;
  uniform float dirLightIntensity;
  uniform vec3 dirLightDir;
  uniform vec3 pointLight1Color;
  uniform float pointLight1Intensity;
  uniform vec3 pointLight1Pos;
  uniform vec3 pointLight2Color;
  uniform float pointLight2Intensity;
  uniform vec3 pointLight2Pos;

  void main() {
    // Screen-space coordinates centered at origin
    vec2 p = (gl_FragCoord.xy * 2.0 - resolution) / min(resolution.x, resolution.y);

    // Apply persistent user pan and wheel zoom
    p = (p - pan) / zoom;

    // Apply camera rotation (Yaw)
    float cosY = cos(cameraAngle.x);
    float sinY = sin(cameraAngle.x);
    mat2 rotYaw = mat2(cosY, -sinY, sinY, cosY);
    p = rotYaw * p;

    // Apply camera tilt / pitch with perspective warping
    float cosP = cos(cameraAngle.y);
    float sinP = sin(cameraAngle.y);
    p.y = p.y / max(0.2, cosP - p.x * sinP * 0.35);

    // Chromatic dispersion distance calculation
    float d = length(p) * distortion;

    float rx = p.x * (1.0 + d);
    float gx = p.x;
    float bx = p.x * (1.0 - d);

    // Multi-harmonic sine wave synthesis
    float waveR = sin((rx + time) * xScale) * yScale + sin((rx * 2.2 - time * 0.7)) * harmonic;
    float waveG = sin((gx + time) * xScale) * yScale + sin((gx * 2.2 - time * 0.7)) * harmonic;
    float waveB = sin((bx + time) * xScale) * yScale + sin((bx * 2.2 - time * 0.7)) * harmonic;

    float distR = abs(p.y + waveR);
    float distG = abs(p.y + waveG);
    float distB = abs(p.y + waveB);

    // Inverse distance glow core
    float r = thickness / (distR + 0.002);
    float g = thickness / (distG + 0.002);
    float b = thickness / (distB + 0.002);

    // Composite primary wave color
    vec3 waveColor = r * color1 + g * color2 + b * color3;

    // Core glow highlight
    float coreDist = min(distR, min(distG, distB));
    float core = (thickness * 0.6) / (coreDist + 0.005);
    waveColor += core * glowColor * glowStrength;

    // Virtual 3D surface normal and lights
    float slope = -cos((gx + time) * xScale) * xScale * yScale;
    vec3 N = normalize(vec3(-slope, 1.0, 0.5));
    vec3 V = vec3(0.0, 0.0, 1.0);
    vec3 pos = vec3(p.x, p.y, -coreDist * 1.5);

    // 1. Ambient Light
    vec3 amb = ambientColor * ambientIntensity;

    // 2. Directional Light
    vec3 L_dir = normalize(-dirLightDir);
    float diffDir = max(0.0, dot(N, L_dir));
    vec3 H_dir = normalize(L_dir + V);
    float specDir = pow(max(0.0, dot(N, H_dir)), 20.0);
    vec3 dirLit = dirLightColor * dirLightIntensity * (diffDir * 0.65 + specDir * 0.45);

    // 3. Point Light 1
    vec3 toPt1 = pointLight1Pos - pos;
    float dPt1 = length(toPt1);
    vec3 L_pt1 = normalize(toPt1);
    float att1 = 1.0 / (1.0 + 0.3 * dPt1 * dPt1);
    float diff1 = max(0.0, dot(N, L_pt1));
    vec3 H_pt1 = normalize(L_pt1 + V);
    float spec1 = pow(max(0.0, dot(N, H_pt1)), 24.0);
    vec3 pt1Lit = pointLight1Color * pointLight1Intensity * att1 * (diff1 * 0.6 + spec1 * 0.5);

    // 4. Point Light 2
    vec3 toPt2 = pointLight2Pos - pos;
    float dPt2 = length(toPt2);
    vec3 L_pt2 = normalize(toPt2);
    float att2 = 1.0 / (1.0 + 0.3 * dPt2 * dPt2);
    float diff2 = max(0.0, dot(N, L_pt2));
    vec3 H_pt2 = normalize(L_pt2 + V);
    float spec2 = pow(max(0.0, dot(N, H_pt2)), 24.0);
    vec3 pt2Lit = pointLight2Color * pointLight2Intensity * att2 * (diff2 * 0.6 + spec2 * 0.5);

    vec3 totalLight = (amb + dirLit + pt1Lit + pt2Lit) * masterLightIntensity;

    // Light modulation on the wave
    vec3 litWave = waveColor * (0.6 + 0.4 * totalLight) + totalLight * 0.12 * (r + g + b);

    // Background determination: Greenscreen #00ff00 or custom background color
    vec3 bg = greenscreen ? vec3(0.0, 1.0, 0.0) : backgroundColor;

    // Glow mask for atmospheric blending
    float energy = max(litWave.r, max(litWave.g, litWave.b));
    float alpha = clamp(1.0 - exp(-energy * 1.8), 0.0, 1.0);

    vec3 finalColor = mix(bg, litWave, alpha);

    // Exposure tone mapping
    finalColor = vec3(1.0) - exp(-finalColor * exposure);

    // Strictly enforce clean #00ff00 greenscreen in non-wave background regions
    if (greenscreen) {
      finalColor = mix(vec3(0.0, 1.0, 0.0), finalColor, alpha);
    }

    gl_FragColor = vec4(finalColor, 1.0);
  }
  </script>

  // ============================================================================
  // Stage Class
  // ============================================================================
  class Stage {
    constructor() {
      this.canvas = document.getElementById('webgl-canvas');
      this.scene = null;
      this.camera = null;
      this.renderer = null;

      // Lights in Three.js scene
      this.ambientLight = null;
      this.dirLight = null;
      this.pointLight1 = null;
      this.pointLight2 = null;

      this.isInitialized = false;
    }

    init() {
      this._setScene();
      this._setRender();
      this._setCamera();
      this._setLights();
      this.isInitialized = true;
    }

    _setScene() {
      this.scene = new THREE.Scene();
    }

    _setRender() {
      if (this.renderer) {
        this.renderer.dispose();
      }
      this.renderer = new THREE.WebGLRenderer({
        canvas: this.canvas,
        antialias: PARAMS.performance.antialias,
        powerPreference: 'high-performance'
      });
      this.renderer.setPixelRatio(PARAMS.performance.dpr);
      this.renderer.setSize(window.innerWidth, window.innerHeight);
      this._updateClearColor();
    }

    _updateClearColor() {
      const col = PARAMS.colors.greenscreen ? 0x00ff00 : PARAMS.colors.background;
      this.renderer.setClearColor(new THREE.Color(col), 1.0);
    }

    _setCamera() {
      this.camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    }

    _setLights() {
      this.ambientLight = new THREE.AmbientLight(
        new THREE.Color(PARAMS.lighting.ambientColor),
        PARAMS.lighting.ambientIntensity
      );
      this.scene.add(this.ambientLight);

      this.dirLight = new THREE.DirectionalLight(
        new THREE.Color(PARAMS.lighting.dirLightColor),
        PARAMS.lighting.dirLightIntensity
      );
      this.dirLight.position.set(2.0, 3.0, 4.0);
      this.scene.add(this.dirLight);

      this.pointLight1 = new THREE.PointLight(
        new THREE.Color(PARAMS.lighting.pointLight1Color),
        PARAMS.lighting.pointLight1Intensity,
        10
      );
      this.pointLight1.position.set(-1.5, 0.5, 1.2);
      this.scene.add(this.pointLight1);

      this.pointLight2 = new THREE.PointLight(
        new THREE.Color(PARAMS.lighting.pointLight2Color),
        PARAMS.lighting.pointLight2Intensity,
        10
      );
      this.pointLight2.position.set(1.5, -0.5, 1.2);
      this.scene.add(this.pointLight2);
    }

    updateLights() {
      if (this.ambientLight) {
        this.ambientLight.color.set(PARAMS.lighting.ambientColor);
        this.ambientLight.intensity = PARAMS.lighting.ambientIntensity * PARAMS.lighting.masterIntensity;
      }
      if (this.dirLight) {
        this.dirLight.color.set(PARAMS.lighting.dirLightColor);
        this.dirLight.intensity = PARAMS.lighting.dirLightIntensity * PARAMS.lighting.masterIntensity;
      }
      if (this.pointLight1) {
        this.pointLight1.color.set(PARAMS.lighting.pointLight1Color);
        this.pointLight1.intensity = PARAMS.lighting.pointLight1Intensity * PARAMS.lighting.masterIntensity;
      }
      if (this.pointLight2) {
        this.pointLight2.color.set(PARAMS.lighting.pointLight2Color);
        this.pointLight2.intensity = PARAMS.lighting.pointLight2Intensity * PARAMS.lighting.masterIntensity;
      }
    }

    onResize() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      this.renderer.setSize(width, height);
      this.renderer.setPixelRatio(PARAMS.performance.dpr);
    }

    render() {
      this.renderer.render(this.scene, this.camera);
    }
  }

  // ============================================================================
  // Mesh Class (Full-Screen Quad with Multi-Pass Shader Material)
  // ============================================================================
  class Mesh {
    constructor(stage) {
      this.stage = stage;
      this.mesh = null;
      this.material = null;
      this.timeValue = 0.0;

      const dpr = PARAMS.performance.dpr;
      this.uniforms = {
        resolution: { value: new THREE.Vector2(window.innerWidth * dpr, window.innerHeight * dpr) },
        time: { value: 0.0 },
        xScale: { value: PARAMS.geometry.xScale },
        yScale: { value: PARAMS.geometry.yScale },
        distortion: { value: PARAMS.geometry.distortion },
        thickness: { value: PARAMS.geometry.thickness },
        harmonic: { value: PARAMS.geometry.harmonic },
        glowStrength: { value: PARAMS.geometry.glowStrength },

        pan: { value: new THREE.Vector2(PARAMS.camera.panX, PARAMS.camera.panY) },
        zoom: { value: PARAMS.camera.userZoom },
        cameraAngle: { value: new THREE.Vector2(PARAMS.camera.angleYaw, PARAMS.camera.anglePitch) },

        color1: { value: new THREE.Color(PARAMS.colors.color1) },
        color2: { value: new THREE.Color(PARAMS.colors.color2) },
        color3: { value: new THREE.Color(PARAMS.colors.color3) },
        glowColor: { value: new THREE.Color(PARAMS.colors.glow) },
        backgroundColor: { value: new THREE.Color(PARAMS.colors.background) },
        greenscreen: { value: PARAMS.colors.greenscreen },

        exposure: { value: PARAMS.lighting.exposure },
        masterLightIntensity: { value: PARAMS.lighting.masterIntensity },
        ambientColor: { value: new THREE.Color(PARAMS.lighting.ambientColor) },
        ambientIntensity: { value: PARAMS.lighting.ambientIntensity },
        dirLightColor: { value: new THREE.Color(PARAMS.lighting.dirLightColor) },
        dirLightIntensity: { value: PARAMS.lighting.dirLightIntensity },
        dirLightDir: { value: new THREE.Vector3(2.0, 3.0, 4.0).normalize() },
        pointLight1Color: { value: new THREE.Color(PARAMS.lighting.pointLight1Color) },
        pointLight1Intensity: { value: PARAMS.lighting.pointLight1Intensity },
        pointLight1Pos: { value: new THREE.Vector3(-1.5, 0.5, 1.2) },
        pointLight2Color: { value: new THREE.Color(PARAMS.lighting.pointLight2Color) },
        pointLight2Intensity: { value: PARAMS.lighting.pointLight2Intensity },
        pointLight2Pos: { value: new THREE.Vector3(1.5, -0.5, 1.2) }
      };
    }

    init() {
      const position = [
        -1.0, -1.0, 0.0,
         1.0, -1.0, 0.0,
        -1.0,  1.0, 0.0,
         1.0, -1.0, 0.0,
        -1.0,  1.0, 0.0,
         1.0,  1.0, 0.0
      ];

      const positions = new THREE.BufferAttribute(new Float32Array(position), 3);
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', positions);

      this.material = new THREE.RawShaderMaterial({
        vertexShader: document.getElementById('js-vertex-shader').textContent,
        fragmentShader: document.getElementById('js-fragment-shader').textContent,
        uniforms: this.uniforms,
        side: THREE.DoubleSide,
        depthTest: false,
        depthWrite: false
      });

      this.mesh = new THREE.Mesh(geometry, this.material);
      this.stage.scene.add(this.mesh);
    }

    updateUniforms() {
      const u = this.uniforms;
      u.xScale.value = PARAMS.geometry.xScale;
      u.yScale.value = PARAMS.geometry.yScale;
      u.distortion.value = PARAMS.geometry.distortion;
      u.thickness.value = PARAMS.geometry.thickness;
      u.harmonic.value = PARAMS.geometry.harmonic;
      u.glowStrength.value = PARAMS.geometry.glowStrength;

      u.color1.value.set(PARAMS.colors.color1);
      u.color2.value.set(PARAMS.colors.color2);
      u.color3.value.set(PARAMS.colors.color3);
      u.glowColor.value.set(PARAMS.colors.glow);
      u.backgroundColor.value.set(PARAMS.colors.background);
      u.greenscreen.value = PARAMS.colors.greenscreen;

      u.exposure.value = PARAMS.lighting.exposure;
      u.masterLightIntensity.value = PARAMS.lighting.masterIntensity;
      u.ambientColor.value.set(PARAMS.lighting.ambientColor);
      u.ambientIntensity.value = PARAMS.lighting.ambientIntensity;
      u.dirLightColor.value.set(PARAMS.lighting.dirLightColor);
      u.dirLightIntensity.value = PARAMS.lighting.dirLightIntensity;
      u.pointLight1Color.value.set(PARAMS.lighting.pointLight1Color);
      u.pointLight1Intensity.value = PARAMS.lighting.pointLight1Intensity;
      u.pointLight2Color.value.set(PARAMS.lighting.pointLight2Color);
      u.pointLight2Intensity.value = PARAMS.lighting.pointLight2Intensity;
    }

    onResize() {
      const dpr = PARAMS.performance.dpr;
      this.uniforms.resolution.value.set(window.innerWidth * dpr, window.innerHeight * dpr);
    }

    step(delta, totalTime) {
      this.timeValue += delta * PARAMS.motion.animationSpeed * PARAMS.motion.wavePhaseSpeed;
      this.uniforms.time.value = this.timeValue;

      // Calculate camera animation offsets based on selected mode
      let animX = 0;
      let animY = 0;
      let animYaw = 0;
      let animPitch = 0;
      let animDist = 0;

      const t = totalTime * PARAMS.motion.animationSpeed;

      switch (PARAMS.camera.animationMode) {
        case 'Harmonic Flow':
          animX = Math.sin(t * 0.3) * 0.15;
          animY = Math.cos(t * 0.25) * 0.08;
          animYaw = Math.sin(t * 0.2) * 0.08;
          break;
        case 'Slow Orbit Drift':
          animYaw = (t * 0.15) % (Math.PI * 2);
          animPitch = Math.sin(t * 0.1) * 0.12;
          break;
        case 'Sine Wave Pulse':
          animX = Math.sin(t * 0.2) * 0.25;
          animY = Math.sin(t * 0.4) * 0.12;
          animPitch = Math.cos(t * 0.3) * 0.06;
          break;
        case 'Panoramic Ridge Sweep':
          animX = Math.sin(t * 0.18) * 0.35;
          animYaw = Math.sin(t * 0.18) * 0.1;
          break;
        case 'Figure-8 Infinity':
          animX = Math.sin(t * 0.2) * 0.22;
          animY = Math.sin(t * 0.4) * 0.1;
          animYaw = Math.cos(t * 0.2) * 0.08;
          break;
        case 'Zenith Float':
          animPitch = Math.sin(t * 0.22) * 0.15;
          animYaw = Math.cos(t * 0.16) * 0.18;
          animY = Math.sin(t * 0.25) * 0.1;
          break;
        case 'Cosmic Spiral':
          animYaw = (t * 0.1) % (Math.PI * 2);
          animDist = Math.sin(t * 0.12) * 0.15;
          animPitch = Math.cos(t * 0.15) * 0.08;
          break;
        case 'Static View':
        default:
          animX = 0;
          animY = 0;
          animYaw = 0;
          animPitch = 0;
          animDist = 0;
          break;
      }

      // Preserve user zoom and combine with animation without resetting
      const totalZoom = Math.max(0.05, PARAMS.camera.userZoom * (1.0 + animDist));
      const totalPanX = PARAMS.camera.panX + animX;
      const totalPanY = PARAMS.camera.panY + animY;
      const totalYaw = PARAMS.camera.angleYaw + animYaw;
      const totalPitch = PARAMS.camera.anglePitch + animPitch;

      this.uniforms.zoom.value = totalZoom;
      this.uniforms.pan.value.set(totalPanX, totalPanY);
      this.uniforms.cameraAngle.value.set(totalYaw, totalPitch);
    }
  }

  // ============================================================================
  // Color Scheme Application
  // ============================================================================
  function applyColorScheme(schemeName) {
    const s = COLOR_SCHEMES[schemeName];
    if (!s) return;

    PARAMS.colors.scheme = schemeName;
    PARAMS.colors.color1 = s.color1;
    PARAMS.colors.color2 = s.color2;
    PARAMS.colors.color3 = s.color3;
    PARAMS.colors.glow = s.glow;
    PARAMS.colors.background = s.background;

    PARAMS.lighting.ambientColor = s.ambient;
    PARAMS.lighting.dirLightColor = s.dirLight;
    PARAMS.lighting.pointLight1Color = s.pt1;
    PARAMS.lighting.pointLight2Color = s.pt2;

    stage._updateClearColor();
    stage.updateLights();
    mesh.updateUniforms();

    if (gui) {
      gui.controllersRecursive().forEach((c) => c.updateDisplay());
    }
  }

  // ============================================================================
  // Procedural Variation Generator (Randomize on scene click)
  // ============================================================================
  function randomizeScene() {
    const schemeKeys = Object.keys(COLOR_SCHEMES);
    const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
    applyColorScheme(randomScheme);

    // Re-roll geometric parameters
    PARAMS.geometry.xScale = +(0.4 + Math.random() * 2.8).toFixed(2);
    PARAMS.geometry.yScale = +(0.15 + Math.random() * 0.7).toFixed(2);
    PARAMS.geometry.distortion = +(0.01 + Math.random() * 0.09).toFixed(3);
    PARAMS.geometry.thickness = +(0.025 + Math.random() * 0.065).toFixed(3);
    PARAMS.geometry.harmonic = +(Math.random() * 0.25).toFixed(2);
    PARAMS.geometry.glowStrength = +(0.6 + Math.random() * 1.6).toFixed(2);

    // Re-roll motion parameters
    PARAMS.motion.animationSpeed = +(0.5 + Math.random() * 1.5).toFixed(2);
    PARAMS.motion.wavePhaseSpeed = +(0.6 + Math.random() * 1.8).toFixed(2);

    // Re-roll lighting
    PARAMS.lighting.exposure = +(0.8 + Math.random() * 0.7).toFixed(2);
    PARAMS.lighting.masterIntensity = +(0.8 + Math.random() * 0.8).toFixed(2);
    PARAMS.lighting.ambientIntensity = +(0.3 + Math.random() * 0.7).toFixed(2);
    PARAMS.lighting.dirLightIntensity = +(0.8 + Math.random() * 1.2).toFixed(2);
    PARAMS.lighting.pointLight1Intensity = +(0.6 + Math.random() * 1.4).toFixed(2);
    PARAMS.lighting.pointLight2Intensity = +(0.6 + Math.random() * 1.4).toFixed(2);

    // Pick random animation preset
    const animPresets = ANIMATION_MODES;
    PARAMS.camera.animationMode = animPresets[Math.floor(Math.random() * animPresets.length)];

    stage.updateLights();
    mesh.updateUniforms();

    if (gui) {
      gui.controllersRecursive().forEach((c) => c.updateDisplay());
    }
  }

  // ============================================================================
  // Application Setup
  // ============================================================================
  const stage = new Stage();
  stage.init();

  const mesh = new Mesh(stage);
  mesh.init();

  // ============================================================================
  // lil-gui Controls Panel
  // ============================================================================
  gui = new GUI({ title: 'Chromatic Laser Wave' });

  // 1. Color Schemes & Appearance
  const fCol = gui.addFolder('Color Schemes');
  fCol.add(PARAMS.colors, 'scheme', Object.keys(COLOR_SCHEMES)).name('Preset Scheme').onChange(applyColorScheme);
  fCol.add(PARAMS.colors, 'greenscreen').name('Greenscreen #00ff00').onChange((v) => {
    stage._updateClearColor();
    mesh.updateUniforms();
  });
  fCol.addColor(PARAMS.colors, 'background').name('Background Color').onChange((v) => {
    stage._updateClearColor();
    mesh.updateUniforms();
  });
  fCol.addColor(PARAMS.colors, 'color1').name('Wave Color 1 (R)').onChange(() => mesh.updateUniforms());
  fCol.addColor(PARAMS.colors, 'color2').name('Wave Color 2 (G)').onChange(() => mesh.updateUniforms());
  fCol.addColor(PARAMS.colors, 'color3').name('Wave Color 3 (B)').onChange(() => mesh.updateUniforms());
  fCol.addColor(PARAMS.colors, 'glow').name('Glow Core Tint').onChange(() => mesh.updateUniforms());

  // 2. Camera & Animations (8 modes + persistent user zoom & angle)
  const fCam = gui.addFolder('Camera & Animation');
  fCam.add(PARAMS.camera, 'animationMode', ANIMATION_MODES).name('Animation Mode');
  const ctrlZoom = fCam.add(PARAMS.camera, 'userZoom', 0.1, 8.0, 0.01).name('Zoom Factor');
  const ctrlPanX = fCam.add(PARAMS.camera, 'panX', -5.0, 5.0, 0.01).name('Pan Screen X');
  const ctrlPanY = fCam.add(PARAMS.camera, 'panY', -5.0, 5.0, 0.01).name('Pan Screen Y');
  const ctrlYaw = fCam.add(PARAMS.camera, 'angleYaw', -Math.PI, Math.PI, 0.01).name('Orbit / Yaw Angle');
  const ctrlPitch = fCam.add(PARAMS.camera, 'anglePitch', -1.4, 1.4, 0.01).name('Pitch Angle');
  fCam.add({ resetView: () => {
    PARAMS.camera.userZoom = 1.0;
    PARAMS.camera.panX = 0.0;
    PARAMS.camera.panY = 0.0;
    PARAMS.camera.angleYaw = 0.0;
    PARAMS.camera.anglePitch = 0.0;
    gui.controllersRecursive().forEach((c) => c.updateDisplay());
  }}, 'resetView').name('Reset Drag / Zoom');

  // 3. Wave Geometry & Distortion
  const fGeo = gui.addFolder('Wave Geometry');
  fGeo.add(PARAMS.geometry, 'xScale', 0.1, 5.0, 0.01).name('Frequency (xScale)').onChange(() => mesh.updateUniforms());
  fGeo.add(PARAMS.geometry, 'yScale', 0.05, 1.2, 0.01).name('Amplitude (yScale)').onChange(() => mesh.updateUniforms());
  fGeo.add(PARAMS.geometry, 'distortion', 0.001, 0.2, 0.001).name('Chromatic Aberration').onChange(() => mesh.updateUniforms());
  fGeo.add(PARAMS.geometry, 'thickness', 0.01, 0.15, 0.001).name('Beam Thickness').onChange(() => mesh.updateUniforms());
  fGeo.add(PARAMS.geometry, 'harmonic', 0.0, 0.6, 0.01).name('Harmonic Undulation').onChange(() => mesh.updateUniforms());
  fGeo.add(PARAMS.geometry, 'glowStrength', 0.0, 3.0, 0.05).name('Core Glow Intensity').onChange(() => mesh.updateUniforms());

  // 4. Motion & Animation Speed
  const fMot = gui.addFolder('Motion & Speed');
  fMot.add(PARAMS.motion, 'animationSpeed', 0.0, 4.0, 0.05).name('Animation Speed');
  fMot.add(PARAMS.motion, 'wavePhaseSpeed', 0.1, 3.0, 0.05).name('Wave Phase Speed');

  // 5. Lighting & Exposure
  const fLight = gui.addFolder('Lighting & Exposure');
  fLight.add(PARAMS.lighting, 'masterIntensity', 0.0, 3.0, 0.05).name('Scene Light Intensity').onChange(() => {
    stage.updateLights();
    mesh.updateUniforms();
  });
  fLight.add(PARAMS.lighting, 'exposure', 0.2, 3.0, 0.05).name('Exposure').onChange(() => mesh.updateUniforms());
  fLight.add(PARAMS.lighting, 'ambientIntensity', 0.0, 2.0, 0.05).name('Ambient Intensity').onChange(() => {
    stage.updateLights();
    mesh.updateUniforms();
  });
  fLight.addColor(PARAMS.lighting, 'ambientColor').name('Ambient Color').onChange(() => {
    stage.updateLights();
    mesh.updateUniforms();
  });
  fLight.add(PARAMS.lighting, 'dirLightIntensity', 0.0, 3.0, 0.05).name('Dir Light Intensity').onChange(() => {
    stage.updateLights();
    mesh.updateUniforms();
  });
  fLight.addColor(PARAMS.lighting, 'dirLightColor').name('Dir Light Color').onChange(() => {
    stage.updateLights();
    mesh.updateUniforms();
  });
  fLight.add(PARAMS.lighting, 'pointLight1Intensity', 0.0, 3.0, 0.05).name('Point 1 Intensity').onChange(() => {
    stage.updateLights();
    mesh.updateUniforms();
  });
  fLight.addColor(PARAMS.lighting, 'pointLight1Color').name('Point 1 Color').onChange(() => {
    stage.updateLights();
    mesh.updateUniforms();
  });
  fLight.add(PARAMS.lighting, 'pointLight2Intensity', 0.0, 3.0, 0.05).name('Point 2 Intensity').onChange(() => {
    stage.updateLights();
    mesh.updateUniforms();
  });
  fLight.addColor(PARAMS.lighting, 'pointLight2Color').name('Point 2 Color').onChange(() => {
    stage.updateLights();
    mesh.updateUniforms();
  });

  // 6. Performance & Rendering
  const fPerf = gui.addFolder('Rendering & Performance');
  fPerf.add(PARAMS.performance, 'dpr', 0.5, 3.0, 0.1).name('DPR (Pixel Ratio)').onChange((v) => {
    stage.renderer.setPixelRatio(v);
    stage.onResize();
    mesh.onResize();
  });
  fPerf.add(PARAMS.performance, 'antialias').name('Antialiasing').onChange((val) => {
    PARAMS.performance.antialias = val;
    stage._setRender();
    mesh.onResize();
  });
  fPerf.add(PARAMS.interaction, 'randomizeOnClick').name('Randomize On Click');
  fPerf.add({ randomize: randomizeScene }, 'randomize').name('Randomize Variation');

  // Apply initial color scheme to sync scene, mesh uniforms, and control displays
  applyColorScheme('Original');

  // ============================================================================
  // Interactive Controls (Wheel Zoom, Drag Object, Orbit Angle, Click Re-roll)
  // ============================================================================
  const canvas = document.getElementById('webgl-canvas');
  let isPointerDown = false;
  let startPointerX = 0;
  let startPointerY = 0;
  let lastPointerX = 0;
  let lastPointerY = 0;
  let didMove = false;
  let pointerButton = 0;

  // Zoom with wheel without resetting camera animation
  window.addEventListener('wheel', (e) => {
    e.preventDefault();
    const zoomFactor = Math.exp(-e.deltaY * 0.0015);
    PARAMS.camera.userZoom = THREE.MathUtils.clamp(PARAMS.camera.userZoom * zoomFactor, 0.1, 8.0);
    ctrlZoom.updateDisplay();
  }, { passive: false });

  // Pointer down
  canvas.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.lil-gui')) return;

    isPointerDown = true;
    didMove = false;
    pointerButton = e.button;
    startPointerX = e.clientX;
    startPointerY = e.clientY;
    lastPointerX = e.clientX;
    lastPointerY = e.clientY;

    try {
      canvas.setPointerCapture(e.pointerId);
    } catch (err) {}
  });

  // Drag object across screen or rotate orbit angle
  canvas.addEventListener('pointermove', (e) => {
    if (!isPointerDown) return;

    const dx = e.clientX - lastPointerX;
    const dy = e.clientY - lastPointerY;

    if (Math.abs(e.clientX - startPointerX) > 4 || Math.abs(e.clientY - startPointerY) > 4) {
      didMove = true;
    }

    lastPointerX = e.clientX;
    lastPointerY = e.clientY;

    const isOrbit = (pointerButton === 2) || e.shiftKey || e.altKey;

    if (isOrbit) {
      // Right-drag or Shift-drag: change camera orbit angle during animation
      const angleSens = 0.005;
      PARAMS.camera.angleYaw = (PARAMS.camera.angleYaw - dx * angleSens) % (Math.PI * 2);
      PARAMS.camera.anglePitch = THREE.MathUtils.clamp(PARAMS.camera.anglePitch + dy * angleSens, -1.4, 1.4);
      ctrlYaw.updateDisplay();
      ctrlPitch.updateDisplay();
    } else {
      // Left-drag: drag object across screen
      const panSens = 2.0 / Math.min(window.innerWidth, window.innerHeight);
      PARAMS.camera.panX += dx * panSens;
      PARAMS.camera.panY -= dy * panSens;
      ctrlPanX.updateDisplay();
      ctrlPanY.updateDisplay();
    }
  });

  // Pointer up: detect click on scene to re-roll theme & parameters
  canvas.addEventListener('pointerup', (e) => {
    if (isPointerDown) {
      try {
        canvas.releasePointerCapture(e.pointerId);
      } catch (err) {}

      if (!didMove && pointerButton === 0 && PARAMS.interaction.randomizeOnClick && !e.target.closest('.lil-gui')) {
        randomizeScene();
      }
    }
    isPointerDown = false;
  });

  // Prevent context menu on right drag
  canvas.addEventListener('contextmenu', (e) => {
    e.preventDefault();
  });

  // Hide/Show GUI with "H" key
  let guiVisible = true;
  window.addEventListener('keydown', (e) => {
    if (e.key === 'h' || e.key === 'H') {
      guiVisible = !guiVisible;
      if (gui.domElement) {
        gui.domElement.style.display = guiVisible ? '' : 'none';
      }
    }
  });

  // Window resize handler
  window.addEventListener('resize', () => {
    stage.onResize();
    mesh.onResize();
  });

  // ============================================================================
  // Animation Loop (Auto Infinite Animation)
  // ============================================================================
  let lastTime = performance.now();
  let totalElapsed = 0.0;

  const animate = (currentTime) => {
    requestAnimationFrame(animate);

    const delta = Math.min((currentTime - lastTime) * 0.001, 0.1);
    lastTime = currentTime;
    totalElapsed += delta;

    mesh.step(delta, totalElapsed);
    stage.render();
  };

  requestAnimationFrame(animate);
  </script>
</body>
</html>
