    {
        "imports": {

            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",

    <canvas id="webgl-canvas"></canvas>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import GUI from 'lil-gui';

        // =========================================================================
        // POST PROCESSOR SUITE (From postprocessing/PostProcessor.js)
        // Modular Three.js Shader Post-Processing Pipeline
        // =========================================================================
        const orthoVertexShader = `
        precision highp float;
        in vec3 position;
        out vec2 vUv;
        void main() {
          vUv = position.xy * 0.5 + 0.5;
          gl_Position = vec4(position.xy, 0.0, 1.0);
        }
        `;

        const brightFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        uniform float bloomThreshold;
        in vec2 vUv;
        out vec4 fragColor;

        vec3 sanitize(vec3 v) {
          if (isnan(v.x) || isinf(v.x)) v.x = 0.0;
          if (isnan(v.y) || isinf(v.y)) v.y = 0.0;
          if (isnan(v.z) || isinf(v.z)) v.z = 0.0;
          return clamp(v, vec3(0.0), vec3(65000.0));
        }

        void main() {
          vec4 raw = texture(inputTexture, vUv);
          vec3 color = sanitize(raw.rgb);
          float luminance = max(0.0, dot(color, vec3(0.2126, 0.7152, 0.0722)));
          float knee = 0.1;
          float soft = luminance - bloomThreshold + knee;
          soft = clamp(soft, 0.0, 2.0 * knee);
          soft = (soft * soft) / (4.0 * knee + 0.00001);
          float contribution = max(soft, luminance - bloomThreshold);
          contribution /= max(luminance, 0.0001);
          vec3 result = color * contribution;
          fragColor = vec4(sanitize(result), clamp(raw.a, 0.0, 1.0));
        }
        `;

        const blur13ShaderChunk = `
        vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
          vec2 resolution = vec2(textureSize(image, 0));
          vec4 color = vec4(0.0);
          vec2 off1 = vec2(1.411764705882353) * direction;
          vec2 off2 = vec2(3.2941176470588234) * direction;
          vec2 off3 = vec2(5.176470588235294) * direction;
          color += texture(image, uv) * 0.1964825501511404;
          color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
          color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
          color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
          color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
          color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
          color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
          return color;
        }
        `;

        const blurFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        uniform vec2 direction;
        in vec2 vUv;
        out vec4 color;
        ${blur13ShaderChunk}

        vec4 sanitize(vec4 v) {
          if (isnan(v.x) || isinf(v.x)) v.x = 0.0;
          if (isnan(v.y) || isinf(v.y)) v.y = 0.0;
          if (isnan(v.z) || isinf(v.z)) v.z = 0.0;
          if (isnan(v.w) || isinf(v.w)) v.w = 0.0;
          return clamp(v, vec4(0.0), vec4(65000.0));
        }

        void main() {
          color = sanitize(blur13(inputTexture, vUv, direction));
        }
        `;

        const godRaysDepthMaskShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        uniform float threshold;
        in vec2 vUv;
        out vec4 fragColor;

        void main() {
          vec4 color = texture(inputTexture, vUv);
          float lum = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
          float factor = smoothstep(threshold, threshold + 0.15, lum);
          fragColor = vec4(vec3(factor), 1.0);
        }
        `;

        const godRaysGenerateShader = `
        precision highp float;
        #define TAPS_PER_PASS 6.0

        uniform sampler2D inputTexture;
        uniform vec3 vSunPositionScreenSpace;
        uniform float fStepSize;
        uniform float distanceAttenuation;
        uniform float maxDensity;
        in vec2 vUv;
        out vec4 fragColor;

        void main() {
          vec2 delta = vSunPositionScreenSpace.xy - vUv;
          float dist = length(delta);
          vec2 stepv = fStepSize * delta / max(dist, 0.0001);
          float iters = dist / max(fStepSize, 0.00001);

          vec2 uv = vUv;
          float col = 0.0;
          float f = min(1.0, max(vSunPositionScreenSpace.z, 0.0));
          float atten = 1.0 / (1.0 + pow(dist, distanceAttenuation));

          if (0.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
          uv += stepv;
          if (1.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
          uv += stepv;
          if (2.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
          uv += stepv;
          if (3.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
          uv += stepv;
          if (4.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
          uv += stepv;
          if (5.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;

          float finalVal = min(col / TAPS_PER_PASS * atten, maxDensity);
          fragColor = vec4(vec3(finalVal), 1.0);
        }
        `;

        const anamorphicBrightShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        uniform float threshold;
        uniform float smoothWidth;
        in vec2 vUv;
        out vec4 fragColor;

        void main() {
          vec4 color = texture(inputTexture, vUv);
          float v = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
          float alpha = smoothstep(threshold, threshold + smoothWidth, v);
          fragColor = mix(vec4(0.0), color, alpha);
        }
        `;

        const anamorphicBlurShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        uniform vec2 resolution;
        uniform float samples;
        uniform float intensity;
        uniform vec3 tintColor;
        uniform float bloomRadius;
        in vec2 vUv;
        out vec4 fragColor;

        void main() {
          int halfSamples = max(1, int(samples) / 2);
          float fHalfSamples = float(halfSamples);
          vec2 invSize = 1.0 / resolution;
          vec4 total = vec4(0.0);

          for (int i = -64; i <= 64; i++) {
            if (i < -halfSamples || i > halfSamples) continue;
            float softness = 1.0 - abs(float(i)) / fHalfSamples;
            softness = pow(softness, 2.0);
            vec2 shiftedUV = vec2(vUv.x + invSize.x * float(i) * (4.0 + bloomRadius * 8.0), vUv.y);
            shiftedUV = clamp(shiftedUV, 0.001, 0.999);
            total += texture(inputTexture, shiftedUV) * softness;
          }

          fragColor = (total / (samples / 3.0)) * vec4(tintColor, 1.0) * intensity;
        }
        `;

        const finalFragmentShader = `
        precision highp float;
        uniform vec2 resolution;
        uniform sampler2D inputTexture;
        uniform sampler2D blur0Texture;
        uniform sampler2D blur1Texture;
        uniform sampler2D blur2Texture;
        uniform sampler2D blur3Texture;
        uniform sampler2D blur4Texture;
        uniform sampler2D raysTexture;
        uniform sampler2D anamorphicTexture;
        uniform bool bloomEnabled;
        uniform float bloomStrength;
        uniform bool raysEnabled;
        uniform float raysStrength;
        uniform vec3 raysColor;
        uniform bool anamorphicEnabled;
        uniform float vignetteBoost;
        uniform float vignetteReduction;
        uniform float noiseIntensity;
        uniform float time;
        in vec2 vUv;
        out vec4 fragColor;

        vec3 sanitize(vec3 v) {
          if (isnan(v.x) || isinf(v.x)) v.x = 0.0;
          if (isnan(v.y) || isinf(v.y)) v.y = 0.0;
          if (isnan(v.z) || isinf(v.z)) v.z = 0.0;
          return clamp(v, vec3(0.0), vec3(65000.0));
        }

        float vignette(vec2 uv, float boost, float reduction) {
          vec2 position = vUv - 0.5;
          return boost - length(position) * reduction;
        }

        float hash1(uint n) {
          n = (n << 13U) ^ n;
          n = n * (n * n * 15731U + 789221U) + 1376312589U;
          return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
        }

        float noise(in vec2 uv, in float timeVal) {
          uvec2 p = uvec2(uv);
          return hash1(p.x + 1920U * p.y + (1920U * 1080U) * (uint(timeVal) % 65536U));
        }

        void main() {
          vec4 raw = texture(inputTexture, vUv);
          vec3 color = sanitize(raw.rgb);

          if (bloomEnabled && bloomStrength > 0.001) {
            vec3 b0 = sanitize(texture(blur0Texture, vUv).rgb);
            vec3 b1 = sanitize(texture(blur1Texture, vUv).rgb);
            vec3 b2 = sanitize(texture(blur2Texture, vUv).rgb);
            vec3 b3 = sanitize(texture(blur3Texture, vUv).rgb);
            vec3 b4 = sanitize(texture(blur4Texture, vUv).rgb);
            vec3 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
            color += bloomSum * bloomStrength;
          }

          if (raysEnabled && raysStrength > 0.001) {
            vec3 r = sanitize(texture(raysTexture, vUv).rgb);
            color += r * raysColor * raysStrength;
          }

          if (anamorphicEnabled) {
            vec3 a = sanitize(texture(anamorphicTexture, vUv).rgb);
            color += a;
          }

          float vig = max(0.0, vignette(vUv, vignetteBoost, vignetteReduction));
          color *= vig;
          color += max(0.0, noiseIntensity) * noise(gl_FragCoord.xy, time);
          fragColor = vec4(sanitize(color), 1.0);
        }
        `;

        const chromaticAberrationShaderChunk = `
        vec2 barrelDistortion(vec2 coord, float amt) {
          vec2 cc = coord - 0.5;
          float dist = dot(cc, cc);
          return coord + cc * dist * amt;
        }

        vec4 chromaticAberration(sampler2D tex, vec2 uv, float amount, vec2 dir) {
          if (amount <= 0.0001) {
            return texture(tex, uv);
          }
          vec2 rUv = barrelDistortion(uv, amount * 1.5);
          vec2 gUv = uv;
          vec2 bUv = barrelDistortion(uv, -amount * 1.5);

          float r = texture(tex, rUv).r;
          float g = texture(tex, gUv).g;
          float b = texture(tex, bUv).b;
          float a = texture(tex, uv).a;
          return vec4(r, g, b, a);
        }
        `;

        const colorFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        uniform float fisheyeStrength;
        uniform float fisheyeRadius;
        uniform float chromaticAberrationAmount;
        uniform float minInputLevel;
        uniform float maxInputLevel;
        uniform float gammaLevel;
        uniform float exposure;
        uniform int visionMode;
        uniform float thermalSensitivity;
        uniform float nightVisionGain;
        uniform float nightVisionNoise;
        uniform float crtIntensity;
        uniform float time;
        in vec2 vUv;
        out vec4 fragColor;

        ${chromaticAberrationShaderChunk}

        vec2 applyFisheye(vec2 uv, float strength, float radius) {
          if (abs(strength) < 0.001) return uv;
          vec2 p = uv - 0.5;
          float r = length(p) / max(0.001, radius);
          if (r > 1.0) return uv;
          float theta = atan(p.y, p.x);
          float distortion = pow(r, 1.0 + strength);
          return 0.5 + vec2(cos(theta), sin(theta)) * distortion * radius;
        }

        vec3 ACESFilmicToneMapping(vec3 color) {
          float a = 2.51;
          float b = 0.03;
          float c = 2.43;
          float d = 0.59;
          float e = 0.14;
          return clamp((color * (a * color + b)) / (color * (c * color + d) + e), 0.0, 1.0);
        }

        vec3 gammaCorrect(vec3 color, vec3 gamma) {
          return pow(color, 1.0 / gamma);
        }

        vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
          return clamp((color - minInput) / (maxInput - minInput), 0.0, 1.0);
        }

        vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
          return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
        }

        vec3 applyNightVision(vec3 color, vec2 uv, float timeVal, float noiseAmt, float gain, float crt) {
          float lum = dot(color, vec3(0.299, 0.587, 0.114));
          float amplified = pow(lum * gain, 0.72);
          vec3 phosphorColor = mix(vec3(0.02, 0.12, 0.03), vec3(0.18, 1.0, 0.32), clamp(amplified, 0.0, 1.0));
          phosphorColor += vec3(0.7, 1.0, 0.8) * max(0.0, amplified - 0.75) * 1.8;
          vec2 p = uv - 0.5;
          float tubeDist = length(p);
          float tubeMask = smoothstep(0.72, 0.44, tubeDist);
          float n = fract(sin(dot(uv * 280.0 + timeVal * 0.05, vec2(12.9898, 78.233))) * 43758.5453);
          float scanline = sin(uv.y * 650.0) * crt;
          phosphorColor += (n - 0.5) * noiseAmt * 2.0 + scanline;
          return clamp(phosphorColor * tubeMask, 0.0, 1.0);
        }

        vec3 ironbow(float t) {
          t = clamp(t, 0.0, 1.0);
          vec3 c0 = vec3(0.02, 0.01, 0.18);
          vec3 c1 = vec3(0.22, 0.02, 0.48);
          vec3 c2 = vec3(0.82, 0.05, 0.25);
          vec3 c3 = vec3(1.0, 0.62, 0.02);
          vec3 c4 = vec3(1.0, 1.0, 0.92);
          if (t < 0.25) return mix(c0, c1, t * 4.0);
          if (t < 0.50) return mix(c1, c2, (t - 0.25) * 4.0);
          if (t < 0.75) return mix(c2, c3, (t - 0.50) * 4.0);
          return mix(c3, c4, (t - 0.75) * 4.0);
        }

        vec3 applyThermal(vec3 color, vec2 uv, float sensitivity, float crt, bool whiteHot) {
          float lum = dot(color, vec3(0.299, 0.587, 0.114));
          float heat = clamp(lum * sensitivity, 0.0, 1.0);
          float sensorRaster = sin(uv.y * 900.0) * (crt * 0.3);
          heat = clamp(heat + sensorRaster, 0.0, 1.0);
          if (whiteHot) {
            return vec3(pow(heat, 0.85));
          } else {
            return ironbow(heat);
          }
        }

        void main() {
          vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
          vec4 col = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
          vec3 finalCol = col.rgb;
          if (isnan(finalCol.x) || isinf(finalCol.x)) finalCol.x = 0.0;
          if (isnan(finalCol.y) || isinf(finalCol.y)) finalCol.y = 0.0;
          if (isnan(finalCol.z) || isinf(finalCol.z)) finalCol.z = 0.0;
          finalCol = clamp(finalCol, vec3(0.0), vec3(65000.0));

          if (visionMode == 1) {
            finalCol = applyNightVision(finalCol, uv, time, nightVisionNoise, nightVisionGain, crtIntensity);
          } else if (visionMode == 2) {
            finalCol = applyThermal(finalCol, uv, thermalSensitivity, crtIntensity, false);
          } else if (visionMode == 3) {
            finalCol = applyThermal(finalCol, uv, thermalSensitivity, crtIntensity, true);
          } else {
            vec3 exposedColor = finalCol * exposure;
            vec3 toneMappedColor = ACESFilmicToneMapping(exposedColor);
            finalCol = finalLevels(toneMappedColor, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
            if (crtIntensity > 0.0001) {
              float scanline = sin(uv.y * 900.0 + time * 2.0) * crtIntensity;
              finalCol -= scanline;
            }
          }

          fragColor = vec4(finalCol, 1.0);
        }
        `;

        const copyFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        in vec2 vUv;
        out vec4 fragColor;
        void main() {
          fragColor = texture(inputTexture, vUv);
        }
        `;

        const fxaaFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        uniform vec2 resolution;
        in vec2 vUv;
        out vec4 fragColor;

        void main() {
          vec2 inverseVP = vec2(1.0 / resolution.x, 1.0 / resolution.y);
          vec3 rgbNW = texture(inputTexture, vUv + (vec2(-1.0, -1.0)) * inverseVP).rgb;
          vec3 rgbNE = texture(inputTexture, vUv + (vec2(1.0, -1.0)) * inverseVP).rgb;
          vec3 rgbSW = texture(inputTexture, vUv + (vec2(-1.0, 1.0)) * inverseVP).rgb;
          vec3 rgbSE = texture(inputTexture, vUv + (vec2(1.0, 1.0)) * inverseVP).rgb;
          vec3 rgbM  = texture(inputTexture, vUv).rgb;

          vec3 luma = vec3(0.299, 0.587, 0.114);
          float lumaNW = dot(rgbNW, luma);
          float lumaNE = dot(rgbNE, luma);
          float lumaSW = dot(rgbSW, luma);
          float lumaSE = dot(rgbSE, luma);
          float lumaM  = dot(rgbM,  luma);

          float lumaMin = min(lumaM, min(min(lumaNW, lumaNE), min(lumaSW, lumaSE)));
          float lumaMax = max(lumaM, max(max(lumaNW, lumaNE), max(lumaSW, lumaSE)));

          vec2 dir;
          dir.x = -((lumaNW + lumaNE) - (lumaSW + lumaSE));
          dir.y =  ((lumaNW + lumaSW) - (lumaNE + lumaSE));

          float dirReduce = max((lumaNW + lumaNE + lumaSW + lumaSE) * (0.25 * (1.0 / 8.0)), 1.0 / 128.0);
          float rcpDirMin = 1.0 / (min(abs(dir.x), abs(dir.y)) + dirReduce);

          dir = min(vec2(8.0, 8.0), max(vec2(-8.0, -8.0), dir * rcpDirMin)) * inverseVP;

          vec3 rgbA = 0.5 * (
              texture(inputTexture, vUv + dir * (1.0 / 3.0 - 0.5)).rgb +
              texture(inputTexture, vUv + dir * (2.0 / 3.0 - 0.5)).rgb);
          vec3 rgbB = rgbA * 0.5 + 0.25 * (
              texture(inputTexture, vUv + dir * -0.5).rgb +
              texture(inputTexture, vUv + dir * 0.5).rgb);

          float lumaB = dot(rgbB, luma);
          if ((lumaB < lumaMin) || (lumaB > lumaMax)) {
              fragColor = vec4(rgbA, 1.0);
          } else {
              fragColor = vec4(rgbB, 1.0);
          }
        }
        `;

        const smaaFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        uniform vec2 resolution;
        in vec2 vUv;
        out vec4 fragColor;

        void main() {
          vec2 invRes = 1.0 / resolution;
          vec4 center = texture(inputTexture, vUv);

          vec3 cU = texture(inputTexture, vUv + vec2(0.0, -1.0) * invRes).rgb;
          vec3 cD = texture(inputTexture, vUv + vec2(0.0, 1.0) * invRes).rgb;
          vec3 cL = texture(inputTexture, vUv + vec2(-1.0, 0.0) * invRes).rgb;
          vec3 cR = texture(inputTexture, vUv + vec2(1.0, 0.0) * invRes).rgb;

          vec3 cUL = texture(inputTexture, vUv + vec2(-1.0, -1.0) * invRes).rgb;
          vec3 cUR = texture(inputTexture, vUv + vec2(1.0, -1.0) * invRes).rgb;
          vec3 cDL = texture(inputTexture, vUv + vec2(-1.0, 1.0) * invRes).rgb;
          vec3 cDR = texture(inputTexture, vUv + vec2(1.0, 1.0) * invRes).rgb;

          vec3 lumaW = vec3(0.299, 0.587, 0.114);
          float lM = dot(center.rgb, lumaW);
          float lU = dot(cU, lumaW);
          float lD = dot(cD, lumaW);
          float lL = dot(cL, lumaW);
          float lR = dot(cR, lumaW);

          float gx = (lR - lL) * 2.0 + (dot(cUR, lumaW) - dot(cUL, lumaW)) + (dot(cDR, lumaW) - dot(cDL, lumaW));
          float gy = (lD - lU) * 2.0 + (dot(cDL, lumaW) - dot(cUL, lumaW)) + (dot(cDR, lumaW) - dot(cUR, lumaW));
          float edgeStrength = length(vec2(gx, gy));

          if (edgeStrength < 0.04) {
            fragColor = center;
            return;
          }

          vec2 dir = normalize(vec2(-gy, gx)) * invRes * clamp(edgeStrength * 1.5, 0.5, 1.5);
          vec4 sampleA = texture(inputTexture, vUv + dir * 0.5);
          vec4 sampleB = texture(inputTexture, vUv - dir * 0.5);
          vec4 sampleC = texture(inputTexture, vUv + dir * 1.0);
          vec4 sampleD = texture(inputTexture, vUv - dir * 1.0);

          vec4 blended = (center * 2.0 + sampleA + sampleB + (sampleC + sampleD) * 0.5) / 5.0;
          fragColor = vec4(blended.rgb, center.a);
        }
        `;

        function createFBO(w, h, options = {}) {
          return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
            wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
            wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
            minFilter: options.minFilter || THREE.LinearFilter,
            magFilter: options.magFilter || THREE.LinearFilter,
            format: options.format || THREE.RGBAFormat,
            type: options.type || THREE.HalfFloatType,
            stencilBuffer: options.stencilBuffer || false,
            depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : false,
            samples: options.samples !== undefined ? options.samples : 0,
          });
        }

        class ShaderPass {
          constructor(shader, options = {}) {
            this.shader = shader;
            this.shader.depthTest = false;
            this.shader.depthWrite = false;
            this.orthoScene = new THREE.Scene();
            this.fbo = createFBO(1, 1, options);
            this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
            this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);

            this.bloomPass.source = sourceTexture;

            this.bloomPass.render(this.renderer);

            this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
            this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
            this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
            this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
            this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

            if (this.settings.raysEnabled && this.settings.raysStrength > 0.001 && this.moonInFront) {

              const filterLen = this.settings.raysDensity;
              const tapsPerPass = 6.0;

              this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -1.0);
              this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysMaskPass.texture;
              this.godRaysPingPong.render(this.renderer);

              this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -2.0);
              this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysPingPong.texture;
              this.godRaysPingPong.render(this.renderer);

              this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -3.0);
              this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysPingPong.texture;
              this.godRaysPingPong.render(this.renderer);

              this.finalPass.shader.uniforms.raysTexture.value = this.godRaysPingPong.texture;

              this.finalPass.shader.uniforms.anamorphicTexture.value = this.anamorphicBlurPass.texture;
              this.finalPass.shader.uniforms.anamorphicEnabled.value = true;

                vec3 p5 = vec3(sin(t * 0.65 + 2.4) * 1.35, -0.68 + sin(t * 1.3) * 0.035, cos(t * 0.65 + 2.4) * 1.05);
                float d5 = length(p - p5) - uDropletScale * 0.17;

                vec3 p6 = vec3(-cos(t * 0.8 + 4.2) * 1.22, -0.68 + cos(t * 1.6) * 0.035, -sin(t * 0.8 + 4.2) * 1.15);
                float d6 = length(p - p6) - uDropletScale * 0.15;

                float k = uBlendRadius;
                float d = smin(d0, d1, k);
                d = smin(d, d2, k);
                d = smin(d, d3, k * 0.85);
                d = smin(d, d4, k * 0.8);
                d = smin(d, d5, k * 0.7);
                d = smin(d, d6, k * 0.7);

                if (d < 0.25) {
                    float rip = sin(p.x * 7.5 + t * 3.2) * cos(p.z * 7.5 + t * 2.8) * uRippleAmp * exp(-length(p.xz) * 1.2);
                    d += rip;
                }

                return d;
            }

            vec2 map(vec3 p) {
                float dLiquid = mapLiquid(p);
                float dFloor = p.y - (-0.75);

                if (dLiquid < dFloor) {
                    return vec2(dLiquid, 1.0);
                } else {
                    return vec2(dFloor, 2.0);
                }
            }

            vec3 calcNormal(vec3 p) {
                vec2 e = vec2(0.0015, -0.0015);
                return normalize(
                    e.xyy * map(p + e.xyy).x +
                    e.yyx * map(p + e.yyx).x +
                    e.yxy * map(p + e.yxy).x +
                    e.xxx * map(p + e.xxx).x
                );
            }

            vec3 toneMapACES(vec3 x) {
                float a = 2.51;
                float b = 0.03;
                float c = 2.43;
                float d = 0.59;
                float e = 0.14;
                return clamp((x * (a * x + b)) / (x * (c * x + d) + e), 0.0, 1.0);
            }

            void main() {
                vec2 ndc = vUv * 2.0 - 1.0;
                vec4 rayEye = uCameraInverseProjectionMatrix * vec4(ndc, -1.0, 1.0);
                rayEye = vec4(rayEye.xy, -1.0, 0.0);
                vec3 rayDir = normalize((uCameraMatrixWorld * rayEye).xyz);
                vec3 rayOrigin = (uCameraMatrixWorld * vec4(0.0, 0.0, 0.0, 1.0)).xyz;

                float t = 0.1;
                float maxDist = 24.0;
                float matId = 0.0;
                bool hit = false;
                vec3 p = rayOrigin;

                for (int i = 0; i < 90; i++) {
                    p = rayOrigin + rayDir * t;
                    vec2 res = map(p);
                    if (res.x < 0.0015) {
                        matId = res.y;
                        hit = true;
                        break;
                    }
                    t += res.x * 0.85;
                    if (t > maxDist) break;
                }

                vec3 col = vec3(0.0);

                if (hit) {
                    vec3 N = calcNormal(p);
                    vec3 V = -rayDir;
                    float NdotV = clamp(dot(N, V), 0.0, 1.0);

                    if (matId == 1.0) {
                        vec3 R = reflect(rayDir, N);

                        vec3 envCol;
                        if (R.y > 0.0) {
                            float skyGrad = pow(R.y, 0.7);
                            envCol = mix(uBgBottomColor * 1.3, uBgTopColor * 1.9, skyGrad);
                        } else {
                            float groundGrad = clamp(-R.y * 2.0, 0.0, 1.0);
                            envCol = mix(uBgBottomColor * 1.3, uColdShadowColor * 1.4, groundGrad);
                        }

                        float horizonBand = exp(-abs(R.y) * 16.0) * uHorizonDarkness;
                        envCol = mix(envCol, vec3(0.012, 0.018, 0.028), horizonBand);

                        vec3 Lkey = normalize(uKeyLightPos - p);
                        vec3 Hkey = normalize(Lkey + V);
                        float specKey = pow(max(dot(N, Hkey), 0.0), 140.0);
                        vec3 keyContrib = uKeyLightColor * uKeyLightIntensity * specKey * 2.8;

                        vec3 Lrim = normalize(uRimLightPos - p);
                        vec3 Hrim = normalize(Lrim + V);
                        float specRim = pow(max(dot(N, Hrim), 0.0), 75.0);
                        vec3 rimContrib = uRimLightColor * uRimLightIntensity * specRim * 1.9;

                        float fresnel = pow(1.0 - NdotV, uFresnelPower);
                        float iriPhase = (1.0 - NdotV) * uIriFreq + p.y * 2.4 + uTime * 0.45;

                        float w1 = pow(sin(iriPhase) * 0.5 + 0.5, 2.0);
                        float w2 = pow(sin(iriPhase + 2.094) * 0.5 + 0.5, 2.0);
                        float w3 = pow(sin(iriPhase + 4.188) * 0.5 + 0.5, 2.0);
                        vec3 iriColor = (uIriColor1 * w1 + uIriColor2 * w2 + uIriColor3 * w3) / (w1 + w2 + w3 + 1e-4);

                        vec3 chromeBase = uBaseMetalColor * envCol;
                        col = mix(chromeBase, iriColor * 1.45, fresnel * uIriStrength);
                        col += keyContrib + rimContrib;

                    } else {
                        vec3 Lkey = normalize(uKeyLightPos - p);

                        float shadow = 1.0;
                        float tSh = 0.03;
                        for (int s = 0; s < 22; s++) {
                            float h = mapLiquid(p + Lkey * tSh);
                            if (h < 0.001) { shadow = 0.0; break; }
                            shadow = min(shadow, 14.0 * h / tSh);
                            tSh += clamp(h, 0.03, 0.22);
                            if (tSh > 3.2) break;
                        }
                        shadow = clamp(shadow, 0.0, 1.0);

                        float ao = clamp(mapLiquid(p + vec3(0.0, 0.12, 0.0)) / 0.12, 0.0, 1.0);

                        float distFromCenter = length(p.xz);
                        vec3 floorLit = mix(uBgBottomColor * 0.9, uBgTopColor * 0.65, 0.35);
                        vec3 floorInShadow = uColdShadowColor * (1.0 - uShadowDarkness * 0.75);

                        vec3 floorCol = mix(floorInShadow, floorLit, shadow * ao);

                        float floorSpec = pow(max(dot(vec3(0.0, 1.0, 0.0), normalize(Lkey + V)), 0.0), 32.0) * 0.22;
                        floorCol += uKeyLightColor * floorSpec * shadow;

                        if (uGreenscreen) {
                            col = mix(floorCol, vec3(0.0, 1.0, 0.0), smoothstep(2.0, 4.5, distFromCenter));
                        } else {
                            float floorFade = smoothstep(2.0, 5.0, distFromCenter);
                            col = mix(floorCol, uBgBottomColor, floorFade);
                        }
                    }
                } else {
                    if (uGreenscreen) {
                        col = vec3(0.0, 1.0, 0.0);
                    } else {
                        float grad = clamp(rayDir.y * 0.85 + 0.35, 0.0, 1.0);
                        col = mix(uBgBottomColor, uBgTopColor, smoothstep(0.05, 0.95, grad));
                    }
                }

                if (uPostProcessActive) {
                    // Output linear HDR so PostProcessor bloom and anamorphic flaring can bloom specular peaks
                    gl_FragColor = vec4(col * uExposure, 1.0);
                } else {
                    // Fallback tone mapping and gamma correction when PostProcessor is disabled
                    col = pow(toneMapACES(col * uExposure), vec3(1.0 / 2.2));
                    gl_FragColor = vec4(col, 1.0);
                }
            }
        `;

        const quadGeometry = new THREE.PlaneGeometry(2, 2);
        const quadMaterial = new THREE.ShaderMaterial({

        // --- GSAP COLOR PALETTE MORPHING ---
        function applyColorScheme(schemeName, animate = true) {
            const target = COLOR_SCHEMES[schemeName];
            if (!target) return;
            params.colorScheme = schemeName;

            if (!animate || typeof gsap === 'undefined') {
                params.baseMetalColor = target.base;
                params.iriColor1 = target.iri1;
                params.iriColor2 = target.iri2;
                params.iriColor3 = target.iri3;
                params.bgTopColor = target.bgTop;
                params.bgBottomColor = target.bgBottom;
                params.coldShadowColor = target.shadow;
                syncParamsToUniforms();
                gui.controllersRecursive().forEach(c => {
                    if (!c._parent?.title?.includes('Post-Processing')) {
                        c.updateDisplay();
                    }
                });
                return;
            }

            const startColors = {
                base: new THREE.Color(params.baseMetalColor),
                iri1: new THREE.Color(params.iriColor1),
                iri2: new THREE.Color(params.iriColor2),
                iri3: new THREE.Color(params.iriColor3),
                bgTop: new THREE.Color(params.bgTopColor),
                bgBottom: new THREE.Color(params.bgBottomColor),
                shadow: new THREE.Color(params.coldShadowColor)
            };

            const endColors = {
                base: new THREE.Color(target.base),
                iri1: new THREE.Color(target.iri1),
                iri2: new THREE.Color(target.iri2),
                iri3: new THREE.Color(target.iri3),
                bgTop: new THREE.Color(target.bgTop),
                bgBottom: new THREE.Color(target.bgBottom),
                shadow: new THREE.Color(target.shadow)
            };

            const tweenObj = { p: 0 };
            gsap.to(tweenObj, {
                p: 1,
                duration: 0.9,
                ease: 'power2.out',
                onUpdate: () => {
                    const p = tweenObj.p;
                    params.baseMetalColor = '#' + startColors.base.clone().lerp(endColors.base, p).getHexString();
                    params.iriColor1 = '#' + startColors.iri1.clone().lerp(endColors.iri1, p).getHexString();
                    params.iriColor2 = '#' + startColors.iri2.clone().lerp(endColors.iri2, p).getHexString();
                    params.iriColor3 = '#' + startColors.iri3.clone().lerp(endColors.iri3, p).getHexString();
                    params.bgTopColor = '#' + startColors.bgTop.clone().lerp(endColors.bgTop, p).getHexString();
                    params.bgBottomColor = '#' + startColors.bgBottom.clone().lerp(endColors.bgBottom, p).getHexString();
                    params.coldShadowColor = '#' + startColors.shadow.clone().lerp(endColors.shadow, p).getHexString();

                    syncParamsToUniforms();
                    gui.controllersRecursive().forEach(c => {
                        if (!c._parent?.title?.includes('Post-Processing')) {
                            c.updateDisplay();
                        }
                    });
                }
            });
        }

        // --- PROCEDURAL SCENE RANDOMIZATION (DOES NOT TOUCH POSTPROCESSING SETTINGS) ---
        function randomizeScene() {
            // Re-rolls only scene, droplet geometry, lighting and palette.
            // Postprocessing settings remain strictly untouched.
            const schemeKeys = Object.keys(COLOR_SCHEMES);
            const pickedScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
            applyColorScheme(pickedScheme, true);

            gsap.to(params, {
                blendRadius: 0.28 + Math.random() * 0.38,
                motherRadius: 0.75 + Math.random() * 0.45,
                dropletScale: 0.65 + Math.random() * 0.55,
                squashFactor: 1.18 + Math.random() * 0.38,
                rippleAmp: 0.006 + Math.random() * 0.025,
                detachHeight: 0.65 + Math.random() * 0.55,

                iriStrength: 0.65 + Math.random() * 0.85,
                iriFreq: 3.2 + Math.random() * 5.5,
                fresnelPower: 2.2 + Math.random() * 3.2,
                horizonDarkness: 0.65 + Math.random() * 0.35,

                keyLightIntensity: 1.5 + Math.random() * 1.5,
                rimLightIntensity: 1.0 + Math.random() * 1.3,
                exposure: 0.92 + Math.random() * 0.35,
                animationSpeed: 0.75 + Math.random() * 0.7,

                duration: 1.0,
                ease: 'power2.out',
                onUpdate: () => {
                    syncParamsToUniforms();
                    gui.controllersRecursive().forEach(c => {
                        // Do not shuffle or touch postprocessing settings
                        if (!c._parent?.title?.includes('Post-Processing')) {
                            c.updateDisplay();
                        }
                    });
                }
            });
        }

        // --- DYNAMIC ANTIALIAS RECONFIGURATION ---
        function reconfigureRenderer(antialiasBool) {
            params.antialias = antialiasBool;
            const oldCanvas = renderer.domElement;
            const parent = oldCanvas.parentElement;

            renderer.dispose();
            renderer = new THREE.WebGLRenderer({
                antialias: antialiasBool,
                powerPreference: 'high-performance'
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(params.dpr);

            parent.replaceChild(renderer.domElement, oldCanvas);
            controls.domElement = renderer.domElement;
            controls.update();

            if (postProcessor) {
                postProcessor.renderer = renderer;
                postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);
            }

            attachPointerInteractions(renderer.domElement);

        // --- POINTER INTERACTIONS (CLICK TO RANDOMIZE + DRAGGING) ---
        function attachPointerInteractions(targetDom) {
            let pointerDownPos = { x: 0, y: 0 };
            let pointerDownTime = 0;
            let isDown = false;

            targetDom.addEventListener('pointerdown', (e) => {
                isDown = true;
                pointerDownPos = { x: e.clientX, y: e.clientY };
                pointerDownTime = performance.now();
            });

            targetDom.addEventListener('pointerup', (e) => {
                if (!isDown) return;
                isDown = false;
                const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
                const elapsed = performance.now() - pointerDownTime;

                if (dist < 6 && elapsed < 320) {
                    if (params.clickToRandomize) {
                        randomizeScene();
                    }
                }
            });
        }
        attachPointerInteractions(renderer.domElement);

        // --- WINDOW RESIZE ---
        window.addEventListener('resize', () => {
            const width = window.innerWidth;
            const height = window.innerHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
            quadMaterial.uniforms.uResolution.value.set(width, height);
            if (postProcessor) {
                postProcessor.setSize(width, height, params.dpr);
            }
        });

        // --- INFINITE RENDER & CAMERA ANIMATION LOOP ---
        const clock = new THREE.Clock();
        let shaderTime = 0;
        let animClock = 0;
        const spherical = new THREE.Spherical();

        function animate() {
            requestAnimationFrame(animate);

            const dt = Math.min(clock.getDelta(), 0.1);
            shaderTime += dt * params.animationSpeed;
            animClock += dt * params.animationSpeed;

            quadMaterial.uniforms.uTime.value = shaderTime;

            // Camera animations preserving user zoom radius and orbit angle
            const targetVec = controls.target;
            const camOffset = camera.position.clone().sub(targetVec);
            spherical.setFromVector3(camOffset);

            const anim = params.animation;
            if (anim === 'Gentle Low Orbit') {
                spherical.theta += 0.12 * dt * params.animationSpeed;
                camera.position.setFromSpherical(spherical).add(targetVec);
            } else if (anim === 'Horizon Drift') {
                spherical.theta += Math.cos(animClock * 0.42) * 0.08 * dt * params.animationSpeed;
                camera.position.setFromSpherical(spherical).add(targetVec);
            } else if (anim === 'Pearlescent Float') {
                const elevDelta = Math.sin(animClock * 0.55) * 0.0028 * params.animationSpeed;
                spherical.phi = THREE.MathUtils.clamp(spherical.phi + elevDelta, 0.2, Math.PI * 0.48);
                camera.position.setFromSpherical(spherical).add(targetVec);
            } else if (anim === 'Liquid Cradle') {
                spherical.theta += Math.sin(animClock * 0.45) * 0.07 * dt * params.animationSpeed;
                const phiDelta = Math.cos(animClock * 0.52) * 0.0022 * params.animationSpeed;
                spherical.phi = THREE.MathUtils.clamp(spherical.phi + phiDelta, 0.2, Math.PI * 0.48);
                camera.position.setFromSpherical(spherical).add(targetVec);
            } else if (anim === 'Close-Up Macro Drift') {
                spherical.theta += 0.05 * dt * params.animationSpeed;
                camera.position.setFromSpherical(spherical).add(targetVec);
            } else if (anim === 'Spiral Horizon') {
                spherical.theta += 0.095 * dt * params.animationSpeed;
                const phiDelta = Math.sin(animClock * 0.32) * 0.0025 * params.animationSpeed;
                spherical.phi = THREE.MathUtils.clamp(spherical.phi + phiDelta, 0.2, Math.PI * 0.48);
                camera.position.setFromSpherical(spherical).add(targetVec);
            } else if (anim === 'Zen Stillness') {
                spherical.theta += Math.sin(animClock * 0.22) * 0.016 * dt * params.animationSpeed;
                camera.position.setFromSpherical(spherical).add(targetVec);
            }

            controls.update();

            camera.updateMatrixWorld();
            quadMaterial.uniforms.uCameraMatrixWorld.value.copy(camera.matrixWorld);
            quadMaterial.uniforms.uCameraInverseProjectionMatrix.value.copy(camera.projectionMatrixInverse);

            // Update PostProcessor sun position for Godrays from Key Light
            if (postProcessor && postProcessor.setMoonScreenPosition) {
                postProcessor.setMoonScreenPosition(camera, quadMaterial.uniforms.uKeyLightPos.value);
            }

            // Sync post-processing active flag with material
            const isPpActive = (postProcessor && postProcessor.settings && postProcessor.settings.enabled);
            quadMaterial.uniforms.uPostProcessActive.value = isPpActive;

            // Render through PostProcessor pipeline
            if (isPpActive) {
                postProcessor.renderScene(scene, camera);
            } else {
                renderer.render(scene, camera);
            }
        }

        animate();
    </script>
</body>
</html>
