<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swarm Background - 3D Visualizer</title>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.140.0/build/three.module.js",
      "three/examples/jsm/": "https://unpkg.com/three@0.140.0/examples/jsm/",
      "three/addons/": "https://unpkg.com/three@0.140.0/examples/jsm/"
    }
  }
  </script>
  <style>
    body, html, #app {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050510;
    }

    body, html, #app, canvas {
      cursor: none !important;
    }

    #gui-panel, #gui-panel * {
      cursor: auto !important;
      pointer-events: auto !important;
      user-select: auto !important;
      -webkit-user-select: auto !important;
      touch-action: auto !important;
    }

    #gui-panel {
      position: fixed !important;
      top: 15px !important;
      right: 15px !important;
      width: 290px;
      background: rgba(24, 24, 28, 0.95);
      border: 1px solid #3a3a42;
      border-radius: 6px;
      padding: 14px;
      color: #dddddd;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 11px;
      z-index: 999999 !important;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
    }

    .gui-header {
      font-weight: 700;
      font-size: 12px;
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid #33333d;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .gui-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 9px;
    }

    .gui-row label {
      flex: 1;
      color: #bbbbbb;
      font-weight: 500;
    }

    .gui-select, .gui-btn, #gui-panel input[type="color"] {
      background: #2a2a32;
      color: #ffffff;
      border: 1px solid #444452;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 11px;
      outline: none;
      cursor: pointer !important;
      box-sizing: border-box;
    }

    .gui-select {
      width: 145px;
    }

    .gui-select option {
      background: #1a1a20;
      color: #ffffff;
    }

    .gui-btn {
      width: 100%;
      padding: 7px;
      background: #383845;
      font-weight: 600;
      transition: background 0.2s, border-color 0.2s;
      text-align: center;
    }

    .gui-btn:hover {
      background: #4a4a5a;
      border-color: #00f3ff;
    }

    #gui-panel input[type="range"] {
      width: 95px;
      cursor: pointer !important;
    }

    #gui-panel input[type="checkbox"] {
      cursor: pointer !important;
      width: 16px;
      height: 16px;
    }

    #app {
      overflow: hidden;
      touch-action: pan-up;
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      text-align: center;
      text-shadow: 0 0 5px #000000, 0 0 20px #000;
      user-select: none;
    }

    #hero {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      pointer-events: none;
    }

    #app h1 {
      --fontSize: 50px;
      --lineHeight: 70px;
      width: auto;
      height: calc(2 * var(--lineHeight));
      line-height: var(--lineHeight);
      margin: 0 auto;
      font-size: var(--fontSize);
    }

    #app a {
      margin-top: 10px;
      display: inline-block;
      text-decoration: none;
      color: #fff;
      pointer-events: auto;
    }

    #app canvas {
      display: block;
      position: fixed;
      z-index: 1;
      top: 0;
      left: 0;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="hero">
      <h1>SWARM<br/>BACKGROUND</h1>
      <a target="_blank" href="https://github.com/klevron/threejs-toys">github/threejs-toys</a>
    </div>
  </div>

  <!-- Custom Floating Settings Panel -->
  <div id="gui-panel">
    <div class="gui-header">
      <span>Swarm Controls</span>
      <span style="font-size:9px; color:#888; font-weight:normal;">Press 'H' to hide</span>
    </div>
    
    <div class="gui-row">
      <label for="greenscreen-toggle">Greenscreen (#00ff00)</label>
      <input type="checkbox" id="greenscreen-toggle" />
    </div>

    <div class="gui-row">
      <label for="bg-color-picker">Background Color</label>
      <input type="color" id="bg-color-picker" value="#050510" />
    </div>

    <div class="gui-row">
      <label for="color-scheme-select">Color Scheme</label>
      <select id="color-scheme-select" class="gui-select"></select>
    </div>

    <div class="gui-row">
      <label for="swarm-item-select">Swarm Item Shape</label>
      <select id="swarm-item-select" class="gui-select"></select>
    </div>

    <div class="gui-row" style="margin-top:4px; margin-bottom:12px;">
      <button id="upload-obj-btn" class="gui-btn">Upload Custom OBJ Item</button>
    </div>

    <div class="gui-row">
      <label for="animation-select">Camera Animation</label>
      <select id="animation-select" class="gui-select">
        <option value="Static (No Motion)">Static (No Motion)</option>
        <option value="Gentle Orbit" selected>Gentle Orbit</option>
        <option value="Floating Bob">Floating Bob</option>
        <option value="Spiral Drift">Spiral Drift</option>
        <option value="Infinity Loop">Infinity Loop</option>
      </select>
    </div>

    <div class="gui-row">
      <label for="speed-slider">Speed (<span id="speed-val">1.0</span>)</label>
      <input type="range" id="speed-slider" min="0" max="3" step="0.1" value="1.0" />
    </div>

    <div class="gui-row">
      <label for="dpr-slider">DPR (Pixel Ratio) (<span id="dpr-val">1.0</span>)</label>
      <input type="range" id="dpr-slider" min="0.5" max="3" step="0.1" value="1.0" />
    </div>
  </div>

  <input type="file" id="obj-upload" accept=".obj" style="display: none;" />

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
    import { OBJLoader } from 'three/examples/jsm/loaders/OBJLoader.js';
    import { swarmBackground } from 'https://unpkg.com/threejs-toys@0.0.8/build/threejs-toys.module.cdn.min.js';

    // Global Console Debugging Listeners
    window.addEventListener('error', (e) => {
      console.error('[Visualizer Error]', e.message, 'at', e.filename, 'line:', e.lineno);
    });

    window.addEventListener('click', (e) => {
      console.log('[Click Debug]', 'Target:', e.target.tagName, 'Class:', e.target.className, 'ID:', e.target.id, 'Pos:', [e.clientX, e.clientY]);
    });

    console.log('[Swarm Visualizer] Script starting...');

    // Standalone geometry merger
    function mergeGeometries(geos) {
      let totalPositions = 0;
      const nonIndexedGeos = geos.map(g => {
        const ni = g.index ? g.toNonIndexed() : g;
        if (!ni.attributes.normal) ni.computeVertexNormals();
        totalPositions += ni.attributes.position.array.length;
        return ni;
      });

      const mergedPos = new Float32Array(totalPositions);
      const mergedNorm = new Float32Array(totalPositions);
      let offset = 0;

      for (const g of nonIndexedGeos) {
        const pos = g.attributes.position.array;
        const norm = g.attributes.normal ? g.attributes.normal.array : new Float32Array(pos.length);
        mergedPos.set(pos, offset);
        mergedNorm.set(norm, offset);
        offset += pos.length;
      }

      const result = new THREE.BufferGeometry();
      result.setAttribute('position', new THREE.BufferAttribute(mergedPos, 3));
      result.setAttribute('normal', new THREE.BufferAttribute(mergedNorm, 3));
      result.center();
      return result;
    }

    // Helper to transform and clone geometry for merging
    function xGeo(geo, px=0, py=0, pz=0, rx=0, ry=0, rz=0, sx=1, sy=1, sz=1) {
      const g = geo.clone();
      g.scale(sx, sy, sz);
      if (rx) g.rotateX(rx);
      if (ry) g.rotateY(ry);
      if (rz) g.rotateZ(rz);
      if (px || py || pz) g.translate(px, py, pz);
      return g;
    }

    const appEl = document.getElementById('app');

    // Initialize Swarm Background
    const bg = swarmBackground({
      el: appEl,
      gpgpuSize: 256,
      color: [0x00f3ff, 0xff007f],
      geometry: 'custom'
    });

    const scene = bg.three.scene;
    const camera = bg.three.camera;
    const renderer = bg.three.renderer;

    camera.position.set(0, 0, 70);

    // OrbitControls attached strictly to canvas
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.enableZoom = true;
    controls.enablePan = true;
    controls.zoomSpeed = 1.0;
    controls.panSpeed = 1.0;

    // Find Swarm InstancedMesh
    let swarmMesh = null;
    scene.traverse((child) => {
      if (child.isInstancedMesh) {
        swarmMesh = child;
      }
    });

    const gpuUvAttr = swarmMesh ? swarmMesh.geometry.getAttribute('gpuUv') : null;

    function setSwarmItemGeometry(geo) {
      if (!swarmMesh || !geo) return;
      if (gpuUvAttr) {
        geo.setAttribute('gpuUv', gpuUvAttr);
      }
      swarmMesh.geometry = geo;
      console.log('[Swarm Visualizer] Swarm geometry updated successfully.');
    }

    function setBgColor(colorHex) {
      const threeColor = new THREE.Color(colorHex);
      scene.background = threeColor;
      renderer.setClearColor(threeColor, 1);
      document.body.style.backgroundColor = colorHex;
      if (appEl) appEl.style.backgroundColor = colorHex;
      console.log('[Swarm Visualizer] Background color set to:', colorHex);
    }

    // 1. Small Drone
    function createDroneGeometry() {
      const box = new THREE.BoxGeometry(0.35, 0.12, 0.35);
      const arm1 = xGeo(new THREE.BoxGeometry(1.1, 0.05, 0.06), 0, 0, 0, 0, Math.PI / 4, 0);
      const arm2 = xGeo(new THREE.BoxGeometry(1.1, 0.05, 0.06), 0, 0, 0, 0, -Math.PI / 4, 0);
      const rotorGeo = new THREE.CylinderGeometry(0.18, 0.18, 0.02, 8);
      const r1 = xGeo(rotorGeo, 0.38, 0.06, 0.38);
      const r2 = xGeo(rotorGeo, -0.38, 0.06, 0.38);
      const r3 = xGeo(rotorGeo, 0.38, 0.06, -0.38);
      const r4 = xGeo(rotorGeo, -0.38, 0.06, -0.38);
      return mergeGeometries([box, arm1, arm2, r1, r2, r3, r4]);
    }

    // 2. Bee
    function createBeeGeometry() {
      const head = xGeo(new THREE.SphereGeometry(0.18, 8, 8), 0, 0, 0.32);
      const thorax = xGeo(new THREE.SphereGeometry(0.25, 8, 8), 0, 0, 0);
      const abdomen = xGeo(new THREE.ConeGeometry(0.22, 0.45, 8), 0, -0.02, -0.35, Math.PI / 2);
      const leftWing = xGeo(new THREE.BoxGeometry(0.45, 0.02, 0.22), -0.25, 0.12, 0, 0.1, 0.2, 0.3);
      const rightWing = xGeo(new THREE.BoxGeometry(0.45, 0.02, 0.22), 0.25, 0.12, 0, 0.1, -0.2, -0.3);
      return mergeGeometries([head, thorax, abdomen, leftWing, rightWing]);
    }

    // 3. Bat
    function createBatGeometry() {
      const body = xGeo(new THREE.ConeGeometry(0.18, 0.5, 8), 0, 0, 0, Math.PI / 2);
      const head = xGeo(new THREE.SphereGeometry(0.16, 8, 8), 0, 0, 0.28);
      const leftEar = xGeo(new THREE.ConeGeometry(0.06, 0.15, 4), -0.08, 0.12, 0.3);
      const rightEar = xGeo(new THREE.ConeGeometry(0.06, 0.15, 4), 0.08, 0.12, 0.3);
      const leftWing = xGeo(new THREE.BoxGeometry(0.65, 0.02, 0.32), -0.35, 0.02, -0.05, 0, 0.3, 0.2);
      const rightWing = xGeo(new THREE.BoxGeometry(0.65, 0.02, 0.32), 0.35, 0.02, -0.05, 0, -0.3, -0.2);
      return mergeGeometries([body, head, leftEar, rightEar, leftWing, rightWing]);
    }

    // 4. Firefly
    function createFireflyGeometry() {
      const head = xGeo(new THREE.SphereGeometry(0.15, 8, 8), 0, 0, 0.25);
      const thorax = xGeo(new THREE.SphereGeometry(0.2, 8, 8), 0, 0, 0.05);
      const abdomen = xGeo(new THREE.SphereGeometry(0.28, 8, 8), 0, -0.04, -0.25, 0, 0, 0, 1, 1, 1.4);
      const leftWing = xGeo(new THREE.BoxGeometry(0.3, 0.02, 0.4), -0.15, 0.1, -0.08, 0.15, 0.2, 0.15);
      const rightWing = xGeo(new THREE.BoxGeometry(0.3, 0.02, 0.4), 0.15, 0.1, -0.08, 0.15, -0.2, -0.15);
      return mergeGeometries([head, thorax, abdomen, leftWing, rightWing]);
    }

    // 5. AI Neural Probe
    function createAIProbeGeometry() {
      const core = xGeo(new THREE.OctahedronGeometry(0.28, 1), 0, 0, 0);
      const ring = xGeo(new THREE.TorusGeometry(0.48, 0.035, 8, 20), 0, 0, 0, Math.PI / 2);
      const p1 = xGeo(new THREE.ConeGeometry(0.06, 0.2, 6), 0, 0, 0.52, Math.PI / 2);
      const p2 = xGeo(new THREE.ConeGeometry(0.06, 0.2, 6), 0, 0, -0.52, -Math.PI / 2);
      const p3 = xGeo(new THREE.ConeGeometry(0.06, 0.2, 6), 0.52, 0, 0, 0, 0, -Math.PI / 2);
      const p4 = xGeo(new THREE.ConeGeometry(0.06, 0.2, 6), -0.52, 0, 0, 0, 0, Math.PI / 2);
      return mergeGeometries([core, ring, p1, p2, p3, p4]);
    }

    // 6. Bird
    function createBirdGeometry() {
      const body = xGeo(new THREE.SphereGeometry(0.22, 8, 8), 0, 0, 0, 0, 0, 0, 1, 1, 1.8);
      const head = xGeo(new THREE.SphereGeometry(0.15, 8, 8), 0, 0.06, 0.32);
      const beak = xGeo(new THREE.ConeGeometry(0.05, 0.2, 6), 0, 0.04, 0.48, Math.PI / 2);
      const tail = xGeo(new THREE.BoxGeometry(0.2, 0.02, 0.35), 0, -0.02, -0.45);
      const leftWing = xGeo(new THREE.BoxGeometry(0.55, 0.02, 0.28), -0.28, 0.08, 0, 0.1, 0.25, 0.25);
      const rightWing = xGeo(new THREE.BoxGeometry(0.55, 0.02, 0.28), 0.28, 0.08, 0, 0.1, -0.25, -0.25);
      return mergeGeometries([body, head, beak, tail, leftWing, rightWing]);
    }

    // 7. Mosquito
    function createMosquitoGeometry() {
      const head = xGeo(new THREE.SphereGeometry(0.12, 8, 8), 0, 0, 0.22);
      const proboscis = xGeo(new THREE.CylinderGeometry(0.02, 0.01, 0.4, 6), 0, -0.05, 0.45, Math.PI / 2);
      const thorax = xGeo(new THREE.SphereGeometry(0.18, 8, 8), 0, 0, 0);
      const abdomen = xGeo(new THREE.CylinderGeometry(0.1, 0.05, 0.65, 8), 0, -0.08, -0.38, Math.PI / 2 - 0.2);
      const leftWing = xGeo(new THREE.BoxGeometry(0.45, 0.015, 0.15), -0.22, 0.15, -0.05, 0.2, 0.3, 0.35);
      const rightWing = xGeo(new THREE.BoxGeometry(0.45, 0.015, 0.15), 0.22, 0.15, -0.05, 0.2, -0.3, -0.35);
      const leg1 = xGeo(new THREE.CylinderGeometry(0.02, 0.01, 0.4, 4), -0.15, -0.18, 0.05, 0.4, 0, 0.4);
      const leg2 = xGeo(new THREE.CylinderGeometry(0.02, 0.01, 0.4, 4), 0.15, -0.18, 0.05, 0.4, 0, -0.4);
      return mergeGeometries([head, proboscis, thorax, abdomen, leftWing, rightWing, leg1, leg2]);
    }

    // 8. Starling
    function createStarlingGeometry() {
      const body = xGeo(new THREE.SphereGeometry(0.24, 8, 8), 0, 0, 0, 0, 0, 0, 0.9, 0.9, 1.7);
      const head = xGeo(new THREE.SphereGeometry(0.14, 8, 8), 0, 0.04, 0.3);
      const beak = xGeo(new THREE.ConeGeometry(0.04, 0.18, 6), 0, 0.03, 0.44, Math.PI / 2);
      const tail = xGeo(new THREE.ConeGeometry(0.15, 0.4, 4), 0, 0, -0.42, -Math.PI / 2);
      const leftWing = xGeo(new THREE.BoxGeometry(0.6, 0.02, 0.25), -0.3, 0.05, -0.02, 0.05, 0.3, 0.2);
      const rightWing = xGeo(new THREE.BoxGeometry(0.6, 0.02, 0.25), 0.3, 0.05, -0.02, 0.05, -0.3, -0.2);
      return mergeGeometries([body, head, beak, tail, leftWing, rightWing]);
    }

    // 9. Nanobot
    function createNanobotGeometry() {
      const core = xGeo(new THREE.CylinderGeometry(0.28, 0.28, 0.18, 6), 0, 0, 0);
      const lens = xGeo(new THREE.SphereGeometry(0.14, 8, 8), 0, 0.1, 0);
      const ring = xGeo(new THREE.TorusGeometry(0.38, 0.03, 8, 16), 0, 0, 0, Math.PI / 2);
      const leg1 = xGeo(new THREE.CylinderGeometry(0.03, 0.02, 0.4, 6), 0, -0.18, 0.28, 0.4, 0, 0);
      const leg2 = xGeo(new THREE.CylinderGeometry(0.03, 0.02, 0.4, 6), 0.24, -0.18, -0.14, -0.2, 0.4, 0.4);
      const leg3 = xGeo(new THREE.CylinderGeometry(0.03, 0.02, 0.4, 6), -0.24, -0.18, -0.14, -0.2, -0.4, -0.4);
      return mergeGeometries([core, lens, ring, leg1, leg2, leg3]);
    }

    // 10. Bacteria
    function createBacteriaGeometry() {
      const body = xGeo(new THREE.CylinderGeometry(0.22, 0.22, 0.7, 12), 0, 0, 0, Math.PI / 2);
      const cap1 = xGeo(new THREE.SphereGeometry(0.22, 8, 8), 0, 0, 0.35);
      const cap2 = xGeo(new THREE.SphereGeometry(0.22, 8, 8), 0, 0, -0.35);
      const f1 = xGeo(new THREE.CylinderGeometry(0.02, 0.01, 0.4, 4), 0.08, 0.05, -0.52, 0.4, 0.2, 0);
      const f2 = xGeo(new THREE.CylinderGeometry(0.02, 0.01, 0.4, 4), -0.08, -0.05, -0.52, -0.4, -0.2, 0);
      return mergeGeometries([body, cap1, cap2, f1, f2]);
    }

    // Preset Swarm Item Geometries
    const originalGeometry = swarmMesh ? swarmMesh.geometry : null;
    const swarmGeometries = {
      "Stealth Arrow (Default)": originalGeometry,
      "Bird": createBirdGeometry(),
      "Mosquitoes": createMosquitoGeometry(),
      "Starlings (Murmuration)": createStarlingGeometry(),
      "Nanobots": createNanobotGeometry(),
      "Bacteria": createBacteriaGeometry(),
      "Small Drone": createDroneGeometry(),
      "Bee": createBeeGeometry(),
      "Bat": createBatGeometry(),
      "Firefly": createFireflyGeometry(),
      "AI Neural Probe": createAIProbeGeometry(),
      "Crystal Octahedron": new THREE.OctahedronGeometry(0.8, 0).rotateX(Math.PI / 2),
      "Micro Cyber Cube": new THREE.BoxGeometry(0.8, 0.8, 0.8),
      "Neon Tetrahedron": new THREE.TetrahedronGeometry(0.9, 0).rotateX(Math.PI / 2),
      "Mini Shimmer Sphere": new THREE.SphereGeometry(0.6, 8, 8)
    };

    let uploadedGeometry = null;

    // 12 Rich Preset Color Schemes
    const colorSchemes = {
      "Neon Cyberpunk": {
        bg: '#050510',
        swarmColors: [0x00f3ff, 0xff007f, 0x7b00ff]
      },
      "Gold Luxury": {
        bg: '#0a0802',
        swarmColors: [0xffd700, 0xff7700, 0x8b4513]
      },
      "Bioluminescence": {
        bg: '#02111b',
        swarmColors: [0x0066ff, 0x00ffaa, 0x00ffff]
      },
      "Sunset Glow": {
        bg: '#120409',
        swarmColors: [0xff3366, 0xff6633, 0xffcc00]
      },
      "Deep Space Nebula": {
        bg: '#0f051d',
        swarmColors: [0x4b0082, 0xff00cc, 0x00d4ff]
      },
      "Toxic Matrix": {
        bg: '#001105',
        swarmColors: [0x00ff44, 0x33ff00, 0x00cc66]
      },
      "Volcanic Flame": {
        bg: '#120000',
        swarmColors: [0xff1100, 0xff6600, 0xffcc00]
      },
      "Ice & Frost": {
        bg: '#020b14',
        swarmColors: [0x00d4ff, 0x88f0ff, 0xffffff]
      },
      "Synthwave 80s": {
        bg: '#14001a',
        swarmColors: [0xff00ab, 0x9900ff, 0x00f6ff]
      },
      "Emerald Forest": {
        bg: '#011409',
        swarmColors: [0x00ff77, 0x00cc44, 0x66ffaa]
      },
      "Royal Velvet": {
        bg: '#120018',
        swarmColors: [0x9900ff, 0xffd700, 0xd400ff]
      },
      "Pure Greenscreen (Studio)": {
        bg: '#00ff00',
        swarmColors: [0x000000, 0x00f3ff, 0xff007f]
      }
    };

    // Settings State
    const settings = {
      greenscreen: false,
      bgColor: '#050510',
      colorScheme: 'Neon Cyberpunk',
      swarmItemPreset: 'Stealth Arrow (Default)',
      animationPreset: 'Gentle Orbit',
      animationSpeed: 1.0,
      dpr: Math.min(window.devicePixelRatio, 2)
    };

    // Populate Native Select Options
    const schemeSelect = document.getElementById('color-scheme-select');
    Object.keys(colorSchemes).forEach(name => {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name;
      schemeSelect.appendChild(opt);
    });

    const itemSelect = document.getElementById('swarm-item-select');
    Object.keys(swarmGeometries).forEach(name => {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name;
      itemSelect.appendChild(opt);
    });

    // Initial setup
    renderer.setPixelRatio(settings.dpr);
    setBgColor(settings.bgColor);

    function applyColorScheme(schemeName) {
      const scheme = colorSchemes[schemeName];
      if (!scheme) return;

      if (settings.greenscreen || schemeName === "Pure Greenscreen (Studio)") {
        setBgColor('#00ff00');
      } else {
        settings.bgColor = scheme.bg;
        setBgColor(settings.bgColor);
        document.getElementById('bg-color-picker').value = settings.bgColor;
      }

      bg.setColors(scheme.swarmColors);
      console.log('[Swarm Visualizer] Color scheme applied:', schemeName);
    }

    applyColorScheme(settings.colorScheme);

    // Form Event Listeners (Native HTML Controls)
    document.getElementById('greenscreen-toggle').addEventListener('change', (e) => {
      settings.greenscreen = e.target.checked;
      console.log('[UI Change] Greenscreen toggle:', settings.greenscreen);
      if (settings.greenscreen) {
        setBgColor('#00ff00');
      } else {
        setBgColor(settings.bgColor);
      }
    });

    document.getElementById('bg-color-picker').addEventListener('input', (e) => {
      settings.bgColor = e.target.value;
      console.log('[UI Change] BgColor picker:', settings.bgColor);
      if (!settings.greenscreen) {
        setBgColor(settings.bgColor);
      }
    });

    schemeSelect.addEventListener('change', (e) => {
      settings.colorScheme = e.target.value;
      console.log('[UI Change] Color Scheme dropdown selected:', settings.colorScheme);
      applyColorScheme(settings.colorScheme);
    });

    itemSelect.addEventListener('change', (e) => {
      settings.swarmItemPreset = e.target.value;
      console.log('[UI Change] Swarm Item Shape dropdown selected:', settings.swarmItemPreset);
      if (swarmGeometries[settings.swarmItemPreset]) {
        setSwarmItemGeometry(swarmGeometries[settings.swarmItemPreset]);
      }
    });

    document.getElementById('animation-select').addEventListener('change', (e) => {
      settings.animationPreset = e.target.value;
      console.log('[UI Change] Animation selected:', settings.animationPreset);
    });

    document.getElementById('speed-slider').addEventListener('input', (e) => {
      settings.animationSpeed = parseFloat(e.target.value);
      document.getElementById('speed-val').textContent = settings.animationSpeed.toFixed(1);
    });

    document.getElementById('dpr-slider').addEventListener('input', (e) => {
      settings.dpr = parseFloat(e.target.value);
      document.getElementById('dpr-val').textContent = settings.dpr.toFixed(1);
      renderer.setPixelRatio(settings.dpr);
    });

    // OBJ Upload Button Listener
    const fileInput = document.getElementById('obj-upload');
    document.getElementById('upload-obj-btn').addEventListener('click', () => {
      fileInput.click();
    });

    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        const contents = e.target.result;
        const loader = new OBJLoader();
        try {
          const obj = loader.parse(contents);
          let mergedGeo = null;

          obj.traverse((child) => {
            if (child.isMesh && child.geometry) {
              if (!mergedGeo) {
                mergedGeo = child.geometry.clone();
              }
            }
          });

          if (mergedGeo) {
            mergedGeo.center();
            mergedGeo.computeBoundingBox();
            const size = mergedGeo.boundingBox.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z) || 1;
            const scale = 1.2 / maxDim;
            mergedGeo.scale(scale, scale, scale);

            uploadedGeometry = mergedGeo;
            swarmGeometries["Uploaded OBJ Item"] = uploadedGeometry;
            
            // Add option to select if not present
            if (!itemSelect.querySelector('option[value="Uploaded OBJ Item"]')) {
              const opt = document.createElement('option');
              opt.value = "Uploaded OBJ Item";
              opt.textContent = "Uploaded OBJ Item";
              itemSelect.appendChild(opt);
            }
            itemSelect.value = "Uploaded OBJ Item";
            settings.swarmItemPreset = "Uploaded OBJ Item";
            setSwarmItemGeometry(uploadedGeometry);

            console.log('[OBJ Upload] Successfully uploaded and applied OBJ geometry.');
          }
        } catch (err) {
          console.error('[OBJ Upload Error]', err);
        }
      };
      reader.readAsText(file);
    });

    // Prevent Canvas / OrbitControls from capturing events on gui-panel
    const guiPanel = document.getElementById('gui-panel');
    ['pointerdown', 'mousedown', 'click'].forEach(evtType => {
      guiPanel.addEventListener(evtType, (e) => {
        e.stopPropagation();
      });
    });

    // Hide/Show GUI on 'H' keypress
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        const isHidden = guiPanel.style.display === 'none';
        guiPanel.style.display = isHidden ? '' : 'none';
        const hero = document.getElementById('hero');
        if (hero) hero.style.display = isHidden ? '' : 'none';
      }
    });

    console.log('[Swarm Visualizer] Custom UI Panel and Scene fully initialized.');

    // Animation Loop
    let time = 0;
    const initialCamRadius = 70;

    function animate() {
      requestAnimationFrame(animate);

      const delta = 0.01 * settings.animationSpeed;
      time += delta;

      // Camera Animation Presets
      if (settings.animationPreset === 'Gentle Orbit') {
        camera.position.x = Math.sin(time * 0.5) * initialCamRadius;
        camera.position.z = Math.cos(time * 0.5) * initialCamRadius;
        camera.lookAt(0, 0, 0);
      } else if (settings.animationPreset === 'Floating Bob') {
        camera.position.y = Math.sin(time * 1.2) * 15;
        camera.lookAt(0, 0, 0);
      } else if (settings.animationPreset === 'Spiral Drift') {
        const radius = initialCamRadius + Math.sin(time * 0.3) * 10;
        camera.position.x = Math.sin(time * 0.4) * radius;
        camera.position.z = Math.cos(time * 0.4) * radius;
        camera.position.y = Math.sin(time * 0.6) * 12;
        camera.lookAt(0, 0, 0);
      } else if (settings.animationPreset === 'Infinity Loop') {
        camera.position.x = Math.sin(time * 0.5) * initialCamRadius;
        camera.position.y = Math.sin(time * 1.0) * 20;
        camera.position.z = Math.cos(time * 0.5) * initialCamRadius;
        camera.lookAt(0, 0, 0);
      }

      controls.update();
    }

    animate();
  </script>
</body>
</html>
