        // --- Normal Map & Procedural Textures ---
        function createProceduralTextures() {
            const nCanvas = document.createElement('canvas');
            nCanvas.width = 512;
            nCanvas.height = 512;
            const nCtx = nCanvas.getContext('2d');

            const hCanvas = document.createElement('canvas');
            hCanvas.width = 512;
            hCanvas.height = 512;
            const hCtx = hCanvas.getContext('2d');
            hCtx.fillStyle = '#000000';
            hCtx.fillRect(0, 0, 512, 512);

            for (let i = 0; i < 350; i++) {
                const x = Math.random() * 512;
                const y = Math.random() * 512;
                const r = 2.0 + Math.random() * 7.5;
                const g = hCtx.createRadialGradient(x, y, 0, x, y, r);
                g.addColorStop(0, 'rgba(255, 255, 255, 0.9)');
                g.addColorStop(0.65, 'rgba(180, 180, 180, 0.4)');
                g.addColorStop(1, 'rgba(0, 0, 0, 0)');
                hCtx.fillStyle = g;
                hCtx.beginPath();
                hCtx.arc(x, y, r, 0, Math.PI * 2);
                hCtx.fill();

                if (Math.random() > 0.65) {
                    const len = 12 + Math.random() * 38;
                    const w = r * 0.45;
                    const sGrad = hCtx.createLinearGradient(x, y, x, y + len);
                    sGrad.addColorStop(0, 'rgba(180, 180, 180, 0.4)');
                    sGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                    hCtx.fillStyle = sGrad;
                    hCtx.fillRect(x - w / 2, y, w, len);
                }
            }

            const imgData = hCtx.getImageData(0, 0, 512, 512);
            const hData = imgData.data;
            const nImg = nCtx.createImageData(512, 512);
            const nData = nImg.data;
            const strength = 3.5;

            for (let y = 0; y < 512; y++) {
                for (let x = 0; x < 512; x++) {
                    const idx = (y * 512 + x) * 4;
                    const xL = ((x > 0 ? x - 1 : 511) + y * 512) * 4;
                    const xR = ((x < 511 ? x + 1 : 0) + y * 512) * 4;
                    const yU = (x + (y > 0 ? y - 1 : 511) * 512) * 4;
                    const yD = (x + (y < 511 ? y + 1 : 0) * 512) * 4;

                    const dx = (hData[xR] - hData[xL]) / 255 * strength;
                    const dy = (hData[yD] - hData[yU]) / 255 * strength;
                    const dz = 1.0;
                    const len = Math.hypot(dx, dy, dz);

                    nData[idx] = Math.floor(((-dx / len) * 0.5 + 0.5) * 255);
                    nData[idx + 1] = Math.floor(((dy / len) * 0.5 + 0.5) * 255);
                    nData[idx + 2] = Math.floor(((dz / len) * 0.5 + 0.5) * 255);
                    nData[idx + 3] = 255;
                }
            }
            nCtx.putImageData(nImg, 0, 0);

            wetNormalMap = new THREE.CanvasTexture(nCanvas);
            wetNormalMap.wrapS = THREE.RepeatWrapping;
            wetNormalMap.wrapT = THREE.RepeatWrapping;
            wetNormalMap.repeat.set(3, 3);

            const sCanvas = document.createElement('canvas');
            sCanvas.width = 128;
            sCanvas.height = 128;
            const sCtx = sCanvas.getContext('2d');
            const sGrad = sCtx.createRadialGradient(64, 64, 0, 64, 64, 62);
            sGrad.addColorStop(0, 'rgba(255, 255, 255, 0.45)');
            sGrad.addColorStop(0.35, 'rgba(230, 210, 255, 0.22)');
            sGrad.addColorStop(0.7, 'rgba(180, 160, 240, 0.05)');
            sGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            sCtx.fillStyle = sGrad;
            sCtx.fillRect(0, 0, 128, 128);
            steamTexture = new THREE.CanvasTexture(sCanvas);

            const dCanvas = document.createElement('canvas');
            dCanvas.width = 64;
            dCanvas.height = 64;
            const dCtx = dCanvas.getContext('2d');
            const dGrad = dCtx.createRadialGradient(32, 32, 0, 32, 32, 30);
            dGrad.addColorStop(0, 'rgba(255, 255, 255, 1.0)');
            dGrad.addColorStop(0.3, 'rgba(220, 240, 255, 0.85)');
            dGrad.addColorStop(0.7, 'rgba(160, 200, 255, 0.25)');
            dGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            dCtx.fillStyle = dGrad;
            dCtx.beginPath();
            dCtx.arc(32, 32, 30, 0, Math.PI * 2);
            dCtx.fill();
            dropletTexture = new THREE.CanvasTexture(dCanvas);
        }

        // --- Letter Shape Definitions (HALLOWEEN) ---
        function createGlyphShape(char) {
            const shape = new THREE.Shape();
            const h = 3.2;

            switch (char) {
                case 'H': {
                    const w = 2.2, bar = 0.60, midY = 1.3, midH = 0.6;
                    shape.moveTo(0, 0);
                    shape.lineTo(bar, 0);
                    shape.lineTo(bar, midY);
                    shape.lineTo(w - bar, midY);
                    shape.lineTo(w - bar, 0);
                    shape.lineTo(w, 0);
                    shape.lineTo(w, h);
                    shape.lineTo(w - bar, h);
                    shape.lineTo(w - bar, midY + midH);
                    shape.lineTo(bar, midY + midH);
                    shape.lineTo(bar, h);
                    shape.lineTo(0, h);
                    shape.closePath();
                    return { shape, width: w };
                }
                case 'A': {
                    const w = 2.2;
                    shape.moveTo(0, 0);
                    shape.lineTo(0.65, 0);
                    shape.lineTo(0.95, 1.15);
                    shape.lineTo(1.25, 1.15);
                    shape.lineTo(1.55, 0);
                    shape.lineTo(2.2, 0);
                    shape.lineTo(1.4, h);
                    shape.lineTo(0.8, h);
                    shape.closePath();

                    const hole = new THREE.Path();
                    hole.moveTo(1.0, 1.6);
                    hole.lineTo(1.2, 1.6);
                    hole.lineTo(1.1, 2.45);
                    hole.closePath();
                    shape.holes.push(hole);
                    return { shape, width: w };
                }
                case 'L': {
                    const w = 1.85, bar = 0.60;
                    shape.moveTo(0, 0);
                    shape.lineTo(w, 0);
                    shape.lineTo(w, 0.65);
                    shape.lineTo(bar, 0.65);
                    shape.lineTo(bar, h);
                    shape.lineTo(0, h);
                    shape.closePath();
                    return { shape, width: w };
                }
                case 'O': {
                    const w = 2.3, r = 0.85;
                    shape.moveTo(r, 0);
                    shape.lineTo(w - r, 0);
                    shape.quadraticCurveTo(w, 0, w, r);
                    shape.lineTo(w, h - r);
                    shape.quadraticCurveTo(w, h, w - r, h);
                    shape.lineTo(r, h);
                    shape.quadraticCurveTo(0, h, 0, h - r);
                    shape.lineTo(0, r);
                    shape.quadraticCurveTo(0, 0, r, 0);
                    shape.closePath();

                    const hole = new THREE.Path();
                    const hr = 0.45, hx = 0.65, hy = 0.65, hw = 1.0, hh = 1.9;
                    hole.moveTo(hx + hr, hy);
                    hole.lineTo(hx + hw - hr, hy);
                    hole.quadraticCurveTo(hx + hw, hy, hx + hw, hy + hr);
                    hole.lineTo(hx + hw, hy + hh - hr);
                    hole.quadraticCurveTo(hx + hw, hy + hh, hx + hw - hr, hy + hh);
                    hole.lineTo(hx + hr, hy + hh);
                    hole.quadraticCurveTo(hx, hy + hh, hx, hy + hh - hr);
                    hole.lineTo(hx, hy + hr);
                    hole.quadraticCurveTo(hx, hy, hx + hr, hy);
                    hole.closePath();
                    shape.holes.push(hole);
                    return { shape, width: w };
                }
                case 'W': {
                    const w = 2.65;
                    shape.moveTo(0, h);
                    shape.lineTo(0.5, 0);
                    shape.lineTo(1.0, 0);
                    shape.lineTo(1.32, 1.8);
                    shape.lineTo(1.65, 0);
                    shape.lineTo(2.15, 0);
                    shape.lineTo(w, h);
                    shape.lineTo(w - 0.55, h);
                    shape.lineTo(1.88, 1.0);
                    shape.lineTo(1.5, 2.5);
                    shape.lineTo(1.15, 2.5);
                    shape.lineTo(0.78, 1.0);
                    shape.lineTo(0.55, h);
                    shape.closePath();
                    return { shape, width: w };
                }
                case 'E': {
                    const w = 1.9, bar = 0.60;
                    shape.moveTo(0, 0);
                    shape.lineTo(w, 0);
                    shape.lineTo(w, 0.6);
                    shape.lineTo(bar, 0.6);
                    shape.lineTo(bar, 1.3);
                    shape.lineTo(w * 0.85, 1.3);
                    shape.lineTo(w * 0.85, 1.85);
                    shape.lineTo(bar, 1.85);
                    shape.lineTo(bar, 2.6);
                    shape.lineTo(w, 2.6);
                    shape.lineTo(w, h);
                    shape.lineTo(0, h);
                    shape.closePath();
                    return { shape, width: w };
                }
                case 'N': {
                    const w = 2.2, bar = 0.55;
                    shape.moveTo(0, 0);
                    shape.lineTo(0, h);
                    shape.lineTo(bar + 0.15, h);
                    shape.lineTo(w - bar, 0.95);
                    shape.lineTo(w - bar, h);
                    shape.lineTo(w, h);
                    shape.lineTo(w, 0);
                    shape.lineTo(w - bar - 0.15, 0);
                    shape.lineTo(bar, h - 0.95);
                    shape.lineTo(bar, 0);
                    shape.closePath();
                    return { shape, width: w };
                }
                default: {
                    shape.moveTo(0, 0);
                    shape.lineTo(2, 0);
                    shape.lineTo(2, h);
                    shape.lineTo(0, h);
                    shape.closePath();
                    return { shape, width: 2.0 };
                }
            }
        }

        // --- Build Typography Objects ---
        function buildTypography() {
            if (letterGroup) {
                scene.remove(letterGroup);
                letterGroup.traverse((c) => {
                    if (c.geometry) c.geometry.dispose();
                    if (c.material) {
                        if (Array.isArray(c.material)) c.material.forEach(m => m.dispose());
                        else c.material.dispose();
                    }
                });
            }

            letterGroup = new THREE.Group();
            outerLetters = [];
            innerNeons = [];

            const chars = ['H', 'A', 'L', 'L', 'O', 'W', 'E', 'E', 'N'];
            const glyphs = chars.map(c => createGlyphShape(c));

            const spacing = state.letterSpacing;
            let totalWidth = glyphs.reduce((sum, g) => sum + g.width, 0) + (chars.length - 1) * spacing;
            let curX = -totalWidth / 2;

            // Backing Beveled Channel Shell (Wet Chrome / Glass / Metal)
            const backplateDepth = state.letterExtrusion * 0.55;
            const backplateSettings = {
                steps: 1,
                depth: backplateDepth,
                bevelEnabled: true,
                bevelThickness: state.letterBevel,
                bevelSize: state.letterBevel * 0.7,
                bevelOffset: 0,
                bevelSegments: 3
            };

            // Neon Tube Extrusion (sits prominently on the front face)
            const neonSettings = {
                steps: 1,
                depth: 0.16,
                bevelEnabled: true,
                bevelThickness: 0.08,
                bevelSize: 0.06,
                bevelSegments: 3
            };

            const outerMat = createLetterMaterial();

            const neonMatOrange = new THREE.MeshStandardMaterial({
                color: state.neonPrimaryColor,
                emissive: state.neonPrimaryColor,
                emissiveIntensity: state.neonIntensity,
                roughness: 0.12,
                metalness: 0.05,
                toneMapped: false
            });

            const neonMatPurple = new THREE.MeshStandardMaterial({
                color: state.neonSecondaryColor,
                emissive: state.neonSecondaryColor,
                emissiveIntensity: state.neonIntensity,
                roughness: 0.12,
                metalness: 0.05,
                toneMapped: false
            });

            // Dark metallic mount rails behind neon
            const railGeo = new THREE.CylinderGeometry(0.045, 0.045, totalWidth + 1.8, 12);
            railGeo.rotateZ(Math.PI / 2);
            const railMat = new THREE.MeshStandardMaterial({
                color: 0x1c1b22,
                metalness: 0.95,
                roughness: 0.2
            });
            const topRail = new THREE.Mesh(railGeo, railMat);
            topRail.position.set(0, 2.5, -0.25);
            letterGroup.add(topRail);

            const btmRail = new THREE.Mesh(railGeo, railMat);
            btmRail.position.set(0, 0.7, -0.25);
            letterGroup.add(btmRail);

            glyphs.forEach((item, index) => {
                const charGroup = new THREE.Group();

                // 1. Backplate Channel Shell (reflects ambient neon and lights)
                const geom = new THREE.ExtrudeGeometry(item.shape, backplateSettings);
                const mesh = new THREE.Mesh(geom, outerMat);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                charGroup.add(mesh);
                outerLetters.push(mesh);

                // 2. Front Glowing Neon Tube (bold, clear, visible on front face)
                const neonGeom = new THREE.ExtrudeGeometry(item.shape, neonSettings);
                const isEven = (index % 2 === 0);
                const neonMesh = new THREE.Mesh(neonGeom, isEven ? neonMatOrange : neonMatPurple);
                neonMesh.scale.set(0.88, 0.88, 1.0);
                neonMesh.position.set(item.width * 0.06, 3.2 * 0.06, backplateDepth + 0.02);
                charGroup.add(neonMesh);
                innerNeons.push(neonMesh);

                charGroup.position.set(curX, -1.6, 0);
                letterGroup.add(charGroup);

                curX += item.width + spacing;
            });

            buildSurfaceDroplets(totalWidth);
            scene.add(letterGroup);
        }

        // --- Letter Surface Droplets (Instanced) ---
        function buildSurfaceDroplets(totalWidth) {
            if (dropletsMesh) {
                letterGroup.remove(dropletsMesh);
                dropletsMesh.geometry.dispose();
                dropletsMesh.material.dispose();
            }

            const dropCount = 360;
            const dropGeo = new THREE.SphereGeometry(0.042, 8, 8);
            dropGeo.scale(1.0, 1.4, 0.6);
            const dropMat = new THREE.MeshPhysicalMaterial({
                color: 0xffffff,
                transmission: 0.9,
                roughness: 0.05,
                ior: 1.33,
                clearcoat: 1.0,
                clearcoatRoughness: 0.04
            });

            dropletsMesh = new THREE.InstancedMesh(dropGeo, dropMat, dropCount);
            const dummy = new THREE.Object3D();

            for (let i = 0; i < dropCount; i++) {
                const x = (Math.random() - 0.5) * totalWidth * 0.96;
                const y = -1.6 + Math.random() * 3.2;
                const z = state.letterExtrusion * 0.55 + 0.08;
                const s = 0.5 + Math.random() * 1.3;

                dummy.position.set(x, y, z);
                dummy.scale.set(s, s, s);
                dummy.rotation.set(0, 0, (Math.random() - 0.5) * 0.2);
                dummy.updateMatrix();
                dropletsMesh.setMatrixAt(i, dummy.matrix);
            }
            dropletsMesh.instanceMatrix.needsUpdate = true;
            letterGroup.add(dropletsMesh);
        }

        // --- Letter Material Creation ---
        function createLetterMaterial() {
            if (state.letterMaterial === 'Wet Tinted Glass') {
                return new THREE.MeshPhysicalMaterial({
                    color: new THREE.Color(state.letterColor),
                    transmission: 0.85,
                    opacity: 1.0,
                    transparent: true,
                    roughness: state.letterRoughness,
                    ior: 1.5,
                    metalness: 0.1,
                    clearcoat: state.clearcoat,
                    clearcoatRoughness: state.clearcoatRoughness,
                    normalMap: wetNormalMap,
                    normalScale: new THREE.Vector2(1.2, 1.2)
                });
            } else if (state.letterMaterial === 'Wet Obsidian') {
                return new THREE.MeshPhysicalMaterial({
                    color: new THREE.Color(0x111118),
                    roughness: 0.06,
                    metalness: 0.35,
                    reflectivity: 0.95,
                    clearcoat: state.clearcoat,
                    clearcoatRoughness: state.clearcoatRoughness,
                    normalMap: wetNormalMap,
                    normalScale: new THREE.Vector2(1.4, 1.4)
                });
            } else if (state.letterMaterial === 'Glow Neon Metal') {
                return new THREE.MeshStandardMaterial({
                    color: new THREE.Color(state.letterColor),
                    metalness: 0.75,
                    roughness: 0.18,
                    emissive: new THREE.Color(state.neonPrimaryColor).multiplyScalar(0.2),
                    normalMap: wetNormalMap,
                    normalScale: new THREE.Vector2(1.0, 1.0)
                });
            } else {
                // Default: Wet Dark Chrome (high reflection of purple & orange rim lights)
                return new THREE.MeshPhysicalMaterial({
                    color: new THREE.Color(state.letterColor),
                    metalness: state.letterMetalness,
                    roughness: state.letterRoughness,
                    clearcoat: state.clearcoat,
                    clearcoatRoughness: state.clearcoatRoughness,
                    normalMap: wetNormalMap,
                    normalScale: new THREE.Vector2(1.3, 1.3)
                });
            }
        }

        // --- Rain Particle System ---
        function initRain() {
            if (rainSystem) {
                scene.remove(rainSystem);
                rainGeometry.dispose();
                rainSystem.material.dispose();
            }

            const count = state.rainCount;
            rainGeometry = new THREE.BufferGeometry();
            rainPositions = new Float32Array(count * 6);
            const colors = new Float32Array(count * 6);
            rainVelocities = new Float32Array(count);

            const baseCol = new THREE.Color(state.rainColor);
            const headCol = new THREE.Color(0xffffff).lerp(baseCol, 0.45);
            const tailCol = baseCol.clone().multiplyScalar(0.12);

            for (let i = 0; i < count; i++) {
                const x = (Math.random() - 0.5) * 44;
                const y = -2.8 + Math.random() * 26;
                const z = (Math.random() - 0.5) * 28;
                const len = 0.5 + Math.random() * 0.9;

                const i6 = i * 6;
                rainPositions[i6] = x;
                rainPositions[i6 + 1] = y;
                rainPositions[i6 + 2] = z;

                rainPositions[i6 + 3] = x + 0.10 * len;
                rainPositions[i6 + 4] = y + len;
                rainPositions[i6 + 5] = z - 0.04 * len;

                colors[i6] = headCol.r;
                colors[i6 + 1] = headCol.g;
                colors[i6 + 2] = headCol.b;

                colors[i6 + 3] = tailCol.r;
                colors[i6 + 4] = tailCol.g;
                colors[i6 + 5] = tailCol.b;

                rainVelocities[i] = (state.rainSpeed + (Math.random() - 0.5) * 8.0);
            }

            rainGeometry.setAttribute('position', new THREE.BufferAttribute(rainPositions, 3));
            rainGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const rainMat = new THREE.LineBasicMaterial({
                vertexColors: true,
                transparent: true,
                opacity: 0.52,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            rainSystem = new THREE.LineSegments(rainGeometry, rainMat);
            scene.add(rainSystem);
        }

        // --- Volumetric Steam & Fog Particles ---
        function initSteam() {
            steamGroup.forEach(mesh => {
                scene.remove(mesh);
                mesh.geometry.dispose();
                mesh.material.dispose();
            });
            steamGroup = [];

            const steamGeo = new THREE.PlaneGeometry(6.0, 6.0);
            const steamCount = 60;

            for (let i = 0; i < steamCount; i++) {
                const steamMat = new THREE.MeshBasicMaterial({
                    map: steamTexture,
                    transparent: true,
                    opacity: (0.04 + Math.random() * 0.10) * state.steamDensity * 6.5,
                    color: new THREE.Color(state.steamColor).lerp(new THREE.Color(state.rimPurpleColor), Math.random() * 0.45),
                    blending: THREE.AdditiveBlending,
                    depthWrite: false
                });

                const mesh = new THREE.Mesh(steamGeo, steamMat);
                mesh.position.set(
                    (Math.random() - 0.5) * 28,
                    -2.0 + Math.random() * 7.5,
                    -4.0 + Math.random() * 10
                );
                mesh.rotation.z = Math.random() * Math.PI * 2;
                mesh.userData = {
                    baseY: mesh.position.y,
                    speedX: (Math.random() - 0.5) * 0.35,
                    speedY: 0.15 + Math.random() * 0.35,
                    rotSpeed: (Math.random() - 0.5) * 0.2
                };

                const s = 0.8 + Math.random() * 1.5;
                mesh.scale.set(s, s, s);

                scene.add(mesh);
                steamGroup.push(mesh);
            }
        }

        // --- Wet Ground Plane ---
        function initGround() {
            if (floorMesh) {
                scene.remove(floorMesh);
                floorMesh.geometry.dispose();
                floorMesh.material.dispose();
            }

            const floorGeo = new THREE.PlaneGeometry(70, 70, 16, 16);
            floorGeo.rotateX(-Math.PI / 2);

            const floorMat = new THREE.MeshStandardMaterial({
                color: new THREE.Color(state.groundColor),
                roughness: 0.14,
                metalness: 0.88,
                normalMap: wetNormalMap,
                normalScale: new THREE.Vector2(0.7, 0.7)
            });

            floorMesh = new THREE.Mesh(floorGeo, floorMat);
            floorMesh.position.y = -2.8;
            floorMesh.receiveShadow = true;
            floorMesh.visible = state.floorVisible && !state.greenscreen;
            scene.add(floorMesh);
        }

        // --- Enhanced Lighting Setup ---
        function initLights() {
            // 1. Purple Rim/Backlight (Left/Rear)
            rimLightPurple = new THREE.SpotLight(
                state.rimPurpleColor,
                state.rimPurpleIntensity,
                55,
                Math.PI / 2.5,
                0.6,
                1.0
            );
            rimLightPurple.position.set(state.rimPurplePosX, state.rimPurplePosY, state.rimPurplePosZ);
            rimLightPurple.target.position.set(-2, 0, 0);
            scene.add(rimLightPurple);
            scene.add(rimLightPurple.target);

            // 2. Orange Rim/Backlight (Right/Rear)
            rimLightOrange = new THREE.SpotLight(
                state.rimOrangeColor,
                state.rimOrangeIntensity,
                55,
                Math.PI / 2.5,
                0.6,
                1.0
            );
            rimLightOrange.position.set(state.rimOrangePosX, state.rimOrangePosY, state.rimOrangePosZ);
            rimLightOrange.target.position.set(2, 0, 0);
            scene.add(rimLightOrange);
            scene.add(rimLightOrange.target);

            // 3. Three Dedicated Letter Front Accent Lights (Left, Center, Right)
            letterLightL = new THREE.PointLight(state.neonSecondaryColor, state.letterLightIntensity, 16, 1.2);
            letterLightL.position.set(-6.5, 0.5, 2.2);
            scene.add(letterLightL);

            letterLightC = new THREE.PointLight(state.neonPrimaryColor, state.letterLightIntensity * 1.15, 18, 1.2);
            letterLightC.position.set(0.0, 0.8, 2.4);
            scene.add(letterLightC);

            letterLightR = new THREE.PointLight(state.neonSecondaryColor, state.letterLightIntensity, 16, 1.2);
            letterLightR.position.set(6.5, 0.5, 2.2);
            scene.add(letterLightR);

            // 4. Top rim light for chamfer highlights
            topRimLight = new THREE.DirectionalLight(state.neonPrimaryColor, 2.8);
            topRimLight.position.set(0, 9, -3);
            scene.add(topRimLight);

            // 5. Front Key & Fill light (ensures letters and bevels are clearly visible)
            frontFillLight = new THREE.DirectionalLight(state.frontFillColor, state.frontFillIntensity);
            frontFillLight.position.set(0, 3.5, 12);
            scene.add(frontFillLight);

            // 6. Ambient Base Light
            ambientLight = new THREE.AmbientLight(state.ambientColor, state.ambientIntensity);
            scene.add(ambientLight);
        }

        // --- Update Lights from State ---
        function updateLights() {
            const mult = state.sceneLightIntensity;
            if (rimLightPurple) {
                rimLightPurple.color.set(state.rimPurpleColor);
                rimLightPurple.intensity = state.rimPurpleIntensity * mult;
                rimLightPurple.position.set(state.rimPurplePosX, state.rimPurplePosY, state.rimPurplePosZ);
            }
            if (rimLightOrange) {
                rimLightOrange.color.set(state.rimOrangeColor);
                rimLightOrange.intensity = state.rimOrangeIntensity * mult;
                rimLightOrange.position.set(state.rimOrangePosX, state.rimOrangePosY, state.rimOrangePosZ);
            }
            if (letterLightL) {
                letterLightL.color.set(state.neonSecondaryColor);
                letterLightL.intensity = state.letterLightIntensity * mult;
            }
            if (letterLightC) {
                letterLightC.color.set(state.neonPrimaryColor);
                letterLightC.intensity = state.letterLightIntensity * 1.15 * mult;
            }
            if (letterLightR) {
                letterLightR.color.set(state.neonSecondaryColor);
                letterLightR.intensity = state.letterLightIntensity * mult;
            }
            if (frontFillLight) {
                frontFillLight.color.set(state.frontFillColor);
                frontFillLight.intensity = state.frontFillIntensity * mult;
            }
            if (topRimLight) {
                topRimLight.color.set(state.neonPrimaryColor);
                topRimLight.intensity = 2.8 * mult;
            }
            if (ambientLight) {
                ambientLight.color.set(state.ambientColor);
                ambientLight.intensity = state.ambientIntensity * mult;
            }
            if (renderer) {
                renderer.toneMappingExposure = state.exposure;
            }
        }

        // --- Apply Color Scheme ---
        function applyColorScheme(name) {
            const p = COLOR_PALETTES[name];
            if (!p) return;

            state.colorScheme = name;
            state.neonPrimaryColor = p.neonPrimary;
            state.neonSecondaryColor = p.neonSecondary;
            state.rimPurpleColor = p.rimViolet;
            state.rimOrangeColor = p.rimOrange;
            state.letterColor = p.letterColor;
            state.rainColor = p.rainColor;
            state.steamColor = p.fogColor;
            state.groundColor = p.groundColor;

            updateGreenscreen(state.greenscreen);
            updateLights();
            buildTypography();
            initRain();
            initSteam();
            initGround();
            updateGuiControllers();
        }

        // --- Greenscreen Mode Toggle ---
        function updateGreenscreen(enabled) {
            state.greenscreen = enabled;
            if (enabled) {
                scene.background = new THREE.Color(0x00ff00);
                scene.fog = null;
                if (floorMesh) floorMesh.visible = false;
            } else {
                const p = COLOR_PALETTES[state.colorScheme] || COLOR_PALETTES['Original (Purple & Orange)'];
                scene.background = new THREE.Color(p.bgColor);
                scene.fog = new THREE.FogExp2(p.fogColor, state.fogDensity);
                if (floorMesh) floorMesh.visible = state.floorVisible;
            }
        }

        // --- Procedural Scene Randomizer on Click ---
        // Requirement: DO NOT shuffle or change Postprocessing settings when randomized!
        function randomizeScene() {
            const paletteKeys = Object.keys(COLOR_PALETTES);
            const randomPalette = paletteKeys[Math.floor(Math.random() * paletteKeys.length)];
            const randomAnim = ANIMATION_MODES[Math.floor(Math.random() * ANIMATION_MODES.length)];

            state.animation = randomAnim;
            state.speed = +(0.65 + Math.random() * 0.8).toFixed(2);
            state.rainSpeed = +(16.0 + Math.random() * 14.0).toFixed(1);
            state.rainCount = Math.floor(2400 + Math.random() * 1600);
            state.fogDensity = +(0.02 + Math.random() * 0.025).toFixed(3);
            state.steamDensity = +(0.1 + Math.random() * 0.15).toFixed(2);

            state.letterExtrusion = +(0.65 + Math.random() * 0.4).toFixed(2);
            state.letterBevel = +(0.10 + Math.random() * 0.08).toFixed(2);
            state.letterSpacing = +(0.42 + Math.random() * 0.18).toFixed(2);

            const matStyles = ['Wet Dark Chrome', 'Wet Tinted Glass', 'Wet Obsidian', 'Glow Neon Metal'];
            state.letterMaterial = matStyles[Math.floor(Math.random() * matStyles.length)];
            state.letterRoughness = +(0.06 + Math.random() * 0.2).toFixed(2);
            state.letterMetalness = +(0.7 + Math.random() * 0.28).toFixed(2);

            state.exposure = +(1.15 + Math.random() * 0.4).toFixed(2);
            state.rimPurpleIntensity = +(5.0 + Math.random() * 4.0).toFixed(1);
            state.rimOrangeIntensity = +(5.5 + Math.random() * 4.0).toFixed(1);
            state.neonIntensity = +(3.2 + Math.random() * 2.2).toFixed(1);
            state.letterLightIntensity = +(3.8 + Math.random() * 2.0).toFixed(1);

            // PostProcessor settings remain intact as requested!
            applyColorScheme(randomPalette);
        }

        // --- Renderer Initialization ---
        function initRenderer(antialias = true) {
            state.antialias = antialias;
            const oldCanvas = canvas;

            renderer = new THREE.WebGLRenderer({
                canvas: oldCanvas,
                antialias: antialias,
                powerPreference: 'high-performance'
            });
            renderer.setPixelRatio(state.dpr);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = state.exposure;
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            // RoomEnvironment for rich wet specular reflections
            const pmremGenerator = new THREE.PMREMGenerator(renderer);
            pmremGenerator.compileEquirectangularShader();
            const envScene = new RoomEnvironment();
            scene.environment = pmremGenerator.fromScene(envScene, 0.04).texture;

            if (controls) {
                controls.dispose();
            }
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.screenSpacePanning = true;
            controls.enableZoom = true;
            controls.minDistance = 4;
            controls.maxDistance = 45;

            controls.addEventListener('start', () => {
                userInteracting = true;
                if (interactionTimeout) clearTimeout(interactionTimeout);
            });
            controls.addEventListener('end', () => {
                interactionTimeout = setTimeout(() => {
                    userInteracting = false;
                }, 2500);
            });

            if (postProcessor) {
                postProcessor.renderer = renderer;
                postProcessor.setSize(window.innerWidth, window.innerHeight, state.dpr);
                postProcessor.setAntialias(antialias);
            }
        }

        // --- UI Setup using lil-gui ---
        function initGui() {
            gui = new GUI({ title: 'HALLOWEEN Neon Settings' });

            // Presets & Modes
            const fPresets = gui.addFolder('Presets & Animations');
            fPresets.add(state, 'colorScheme', Object.keys(COLOR_PALETTES)).name('Color Scheme').onChange(v => applyColorScheme(v));
            fPresets.add(state, 'animation', ANIMATION_MODES).name('Animation Mode');
            fPresets.add(state, 'speed', 0.0, 3.0, 0.1).name('Animation Speed');
            fPresets.add(state, 'greenscreen').name('Greenscreen (#00ff00)').onChange(v => updateGreenscreen(v));
            fPresets.add(state, 'clickToRandomize').name('Click to Randomize');

            // Render & Controls
            const fRender = gui.addFolder('Render & Controls');
            fRender.add(state, 'dpr', 0.5, 3.0, 0.25).name('Pixel Ratio (DPR)').onChange(v => {
                renderer.setPixelRatio(v);
                postProcessor.setSize(window.innerWidth, window.innerHeight, v);
            });
            fRender.add(state, 'antialias').name('Antialias (MSAA)').onChange(v => initRenderer(v));
            fRender.add(state, 'dragMode', ['Orbit & Pan', 'Direct Pan Only']).name('Mouse Drag Mode').onChange(v => {
                if (v === 'Direct Pan Only') {
                    controls.mouseButtons.LEFT = THREE.MOUSE.PAN;
                } else {
                    controls.mouseButtons.LEFT = THREE.MOUSE.ROTATE;
                }
            });

            // Lighting & Exposure
            const fLight = gui.addFolder('Lighting & Exposure');
            fLight.add(state, 'exposure', 0.2, 3.0, 0.05).name('Scene Exposure').onChange(v => { renderer.toneMappingExposure = v; });
            fLight.add(state, 'sceneLightIntensity', 0.1, 3.0, 0.1).name('Master Intensity').onChange(() => updateLights());
            fLight.add(state, 'letterLightIntensity', 0, 10, 0.2).name('Front Letter Lights').onChange(() => updateLights());

            // Individual Lights Subfolders
            const fPurple = fLight.addFolder('Purple Rim Light');
            fPurple.add(state, 'rimPurpleIntensity', 0, 15, 0.2).name('Intensity').onChange(() => updateLights());
            fPurple.addColor(state, 'rimPurpleColor').name('Color').onChange(() => updateLights());
            fPurple.add(state, 'rimPurplePosX', -25, 25, 0.5).name('Pos X').onChange(() => updateLights());
            fPurple.add(state, 'rimPurplePosY', -10, 20, 0.5).name('Pos Y').onChange(() => updateLights());
            fPurple.add(state, 'rimPurplePosZ', -25, 10, 0.5).name('Pos Z').onChange(() => updateLights());
            fPurple.close();

            const fOrange = fLight.addFolder('Orange Rim Light');
            fOrange.add(state, 'rimOrangeIntensity', 0, 15, 0.2).name('Intensity').onChange(() => updateLights());
            fOrange.addColor(state, 'rimOrangeColor').name('Color').onChange(() => updateLights());
            fOrange.add(state, 'rimOrangePosX', -25, 25, 0.5).name('Pos X').onChange(() => updateLights());
            fOrange.add(state, 'rimOrangePosY', -10, 20, 0.5).name('Pos Y').onChange(() => updateLights());
            fOrange.add(state, 'rimOrangePosZ', -25, 10, 0.5).name('Pos Z').onChange(() => updateLights());
            fOrange.close();

            const fNeon = fLight.addFolder('Neon Typography Core');
            fNeon.add(state, 'neonIntensity', 0, 10, 0.1).name('Emissive Intensity').onChange(v => {
                innerNeons.forEach(m => { m.material.emissiveIntensity = v; });
            });
            fNeon.addColor(state, 'neonPrimaryColor').name('Primary Color').onChange(v => {
                innerNeons.forEach((m, idx) => {
                    if (idx % 2 === 0) {
                        m.material.color.set(v);
                        m.material.emissive.set(v);
                    }
                });
                topRimLight.color.set(v);
                if (letterLightC) letterLightC.color.set(v);
            });
            fNeon.addColor(state, 'neonSecondaryColor').name('Secondary Color').onChange(v => {
                innerNeons.forEach((m, idx) => {
                    if (idx % 2 !== 0) {
                        m.material.color.set(v);
                        m.material.emissive.set(v);
                    }
                });
                if (letterLightL) letterLightL.color.set(v);
                if (letterLightR) letterLightR.color.set(v);
            });
            fNeon.close();

            const fFill = fLight.addFolder('Fill & Ambient');
            fFill.add(state, 'frontFillIntensity', 0, 3, 0.05).name('Fill Intensity').onChange(() => updateLights());
            fFill.addColor(state, 'frontFillColor').name('Fill Color').onChange(() => updateLights());
            fFill.add(state, 'ambientIntensity', 0, 2, 0.05).name('Ambient Intensity').onChange(() => updateLights());
            fFill.addColor(state, 'ambientColor').name('Ambient Color').onChange(() => updateLights());
            fFill.close();

            // Materials & Wet Texture
            const fMat = gui.addFolder('Letter Materials & Wetness');
            fMat.add(state, 'letterMaterial', ['Wet Dark Chrome', 'Wet Tinted Glass', 'Wet Obsidian', 'Glow Neon Metal']).name('Material Style').onChange(() => buildTypography());
            fMat.addColor(state, 'letterColor').name('Base Color').onChange(() => buildTypography());
            fMat.add(state, 'letterRoughness', 0.01, 1.0, 0.02).name('Roughness').onChange(v => {
                outerLetters.forEach(m => { m.material.roughness = v; });
            });
            fMat.add(state, 'letterMetalness', 0.0, 1.0, 0.02).name('Metalness').onChange(v => {
                outerLetters.forEach(m => { m.material.metalness = v; });
            });
            fMat.add(state, 'clearcoat', 0.0, 1.0, 0.05).name('Wet Clearcoat').onChange(v => {
                outerLetters.forEach(m => { if (m.material.clearcoat !== undefined) m.material.clearcoat = v; });
            });
            fMat.close();

            // Rain & Steam
            const fWeather = gui.addFolder('Rain & Steam Particles');
            fWeather.add(state, 'rainCount', 500, 6000, 250).name('Raindrop Count').onChange(() => initRain());
            fWeather.add(state, 'rainSpeed', 5.0, 50.0, 1.0).name('Rain Speed');
            fWeather.addColor(state, 'rainColor').name('Rain Glow Color').onChange(() => initRain());
            fWeather.add(state, 'steamDensity', 0.0, 0.5, 0.02).name('Steam Density').onChange(() => initSteam());
            fWeather.addColor(state, 'steamColor').name('Steam Tint').onChange(() => initSteam());
            fWeather.add(state, 'floorVisible').name('Reflective Floor').onChange(v => {
                if (floorMesh && !state.greenscreen) floorMesh.visible = v;
            });
            fWeather.close();

            // Geometry Sliders
            const fGeo = gui.addFolder('Typography Geometry');
            fGeo.add(state, 'letterExtrusion', 0.2, 2.0, 0.05).name('Extrusion Depth').onChange(() => buildTypography());
            fGeo.add(state, 'letterBevel', 0.02, 0.25, 0.01).name('Bevel Size').onChange(() => buildTypography());
            fGeo.add(state, 'letterSpacing', 0.15, 1.0, 0.02).name('Kerning Spacing').onChange(() => buildTypography());
            fGeo.close();

            // Attach PostProcessor suite controls to lil-gui
            postProcessor.attachGUI(gui, "Post-Processing Suite");

            window.addEventListener('keydown', (e) => {
                if (e.key === 'h' || e.key === 'H') {
                    if (gui._hidden) gui.show();
                    else gui.hide();
                }
            });
        }

        function updateGuiControllers() {
            if (!gui) return;
            gui.controllersRecursive().forEach(c => c.updateDisplay());
        }

        // --- Handle Canvas Pointer Events ---
        function setupPointerEvents() {
            let startX = 0, startY = 0, startTime = 0;

            canvas.addEventListener('pointerdown', (e) => {
                startX = e.clientX;
                startY = e.clientY;
                startTime = performance.now();
            });

            canvas.addEventListener('pointerup', (e) => {
                const dist = Math.hypot(e.clientX - startX, e.clientY - startY);
                const timeDiff = performance.now() - startTime;

                if (dist < 6 && timeDiff < 350) {
                    if (state.clickToRandomize) {
                        randomizeScene();
                    }
                }
            });
        }

        // --- Camera Animation Modes ---
        function updateCameraAnimation(elapsedTime) {
            if (state.animation === 'Static (No Camera Move)' || userInteracting) {
                return;
            }

            const t = elapsedTime * 0.5 * state.speed;

            switch (state.animation) {
                case 'Slow Cinematic Drift': {
                    camera.position.x = Math.sin(t * 0.35) * 5.0;
                    camera.position.y = 0.5 + Math.cos(t * 0.25) * 0.9;
                    camera.position.z = 17.5 + Math.sin(t * 0.3) * 2.5;
                    camera.lookAt(Math.sin(t * 0.3) * 1.5, 0.1, 0);
                    break;
                }
                case 'Eerie Floating Hover': {
                    camera.position.x = Math.sin(t * 0.22) * 2.2;
                    camera.position.y = 1.0 + Math.sin(t * 0.6) * 1.6;
                    camera.position.z = 16.5 + Math.cos(t * 0.35) * 1.8;
                    camera.lookAt(0, 0.2, 0);
                    break;
                }
                case 'Orbital Showcase': {
                    const radius = 17.5;
                    camera.position.x = Math.sin(t * 0.22) * radius;
                    camera.position.z = Math.cos(t * 0.22) * radius;
                    camera.position.y = 0.8 + Math.sin(t * 0.15) * 1.4;
                    camera.lookAt(0, 0, 0);
                    break;
                }
                case 'Subtle Figure-8 Infinite': {
                    camera.position.x = Math.sin(t * 0.3) * 5.5;
                    camera.position.y = 0.6 + Math.sin(t * 0.6) * 1.3;
                    camera.position.z = 17.0 + Math.cos(t * 0.3) * 2.2;
                    camera.lookAt(0, 0, 0);
                    break;
                }
                case 'Neon Pulse & Sway': {
                    camera.position.x = Math.sin(t * 0.45) * 3.8;
                    camera.position.y = 0.6 + Math.cos(t * 0.5) * 1.1;
                    camera.position.z = 16.8 + Math.sin(t * 0.35) * 2.4;
                    camera.rotation.z = Math.sin(t * 0.25) * 0.04;
                    camera.lookAt(0, 0, 0);
                    break;
                }
                case 'Dramatic Low Angle Creep': {
                    camera.position.x = Math.sin(t * 0.25) * 4.2;
                    camera.position.y = -1.6 + Math.sin(t * 0.2) * 0.5;
                    camera.position.z = 14.8 + Math.cos(t * 0.2) * 1.6;
                    camera.lookAt(0, 0.9, 0);
                    break;
                }
                case 'Phantom Dolly Glide': {
                    camera.position.x = Math.sin(t * 0.18) * 2.5;
                    camera.position.y = 0.5 + Math.sin(t * 0.22) * 0.8;
                    camera.position.z = 13.5 + Math.sin(t * 0.28) * 5.0;
                    camera.lookAt(0, 0, 0);
                    break;
                }
            }
        }

        // --- Main Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            const elapsed = clock.getElapsedTime();
            const simDelta = delta * state.speed;

            // 1. Rain Motion
            if (rainSystem && rainPositions) {
                const count = state.rainCount;
                const pos = rainPositions;

                for (let i = 0; i < count; i++) {
                    const i6 = i * 6;
                    const dropSpeed = rainVelocities[i] * simDelta;

                    pos[i6 + 1] -= dropSpeed;
                    pos[i6 + 4] -= dropSpeed;

                    pos[i6] -= dropSpeed * 0.08;
                    pos[i6 + 3] -= dropSpeed * 0.08;

                    if (pos[i6 + 1] < -2.8) {
                        const newX = (Math.random() - 0.5) * 44;
                        const newY = 16 + Math.random() * 8;
                        const newZ = (Math.random() - 0.5) * 28;
                        const len = 0.5 + Math.random() * 0.9;

                        pos[i6] = newX;
                        pos[i6 + 1] = newY;
                        pos[i6 + 2] = newZ;

                        pos[i6 + 3] = newX + 0.10 * len;
                        pos[i6 + 4] = newY + len;
                        pos[i6 + 5] = newZ - 0.04 * len;
                    }
                }
                rainGeometry.attributes.position.needsUpdate = true;
            }

            // 2. Steam Motion & Pulsing
            steamGroup.forEach(mesh => {
                mesh.position.y += mesh.userData.speedY * simDelta;
                mesh.position.x += mesh.userData.speedX * simDelta;
                mesh.rotation.z += mesh.userData.rotSpeed * simDelta;

                if (mesh.position.y > 7.0) {
                    mesh.position.y = -2.5;
                    mesh.position.x = (Math.random() - 0.5) * 28;
                }
            });

            // 3. Neon Subtle Humming & Flicker
            if (innerNeons.length > 0) {
                const flicker = 1.0 + Math.sin(elapsed * 10.0) * 0.04 + (Math.random() > 0.985 ? -0.15 : 0.0);
                innerNeons.forEach(m => {
                    m.material.emissiveIntensity = state.neonIntensity * flicker;
                });
            }

            // 4. Subtle Letter Floating Hover
            if (letterGroup) {
                letterGroup.position.y = Math.sin(elapsed * 1.2 * state.speed) * 0.08;
                letterGroup.rotation.y = Math.sin(elapsed * 0.6 * state.speed) * 0.02;
            }

            // 5. Update Camera
            updateCameraAnimation(elapsed);
            controls.update();

            // 6. Set Light Position for PostProcessor Godrays
            postProcessor.setMoonScreenPosition(camera, new THREE.Vector3(0, 3.5, -4.5));

            // 7. Render Scene via PostProcessor Pipeline
            postProcessor.renderScene(scene, camera);
        }

        // --- Window Resize Handler ---
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            postProcessor.setSize(window.innerWidth, window.innerHeight, state.dpr);
        }

        // --- App Initialization ---
        function init() {
            canvas = document.getElementById('webgl-canvas');

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(46, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 0.6, 17.5);

            createProceduralTextures();

            // Setup PostProcessor Pipeline (Anamorphic default is OFF as requested)
            postProcessor = new PostProcessor(null, {
                enabled: true,
                antialias: state.antialias,
                bloomEnabled: true,
                bloomStrength: 1.4,
                bloomRadius: 0.65,
                bloomThreshold: 0.18,
                raysEnabled: true,
                raysStrength: 0.7,
                raysThreshold: 0.15,
                raysColor: state.rimOrangeColor,
                anamorphicEnabled: false, // Default is OFF
                chromaticAberration: 0.012,
                vignetteBoost: 1.15,
                vignetteReduction: 0.65,
                noiseIntensity: 0.015,
                exposure: 1.15
            });

            initRenderer(state.antialias);
            postProcessor.setSize(window.innerWidth, window.innerHeight, state.dpr);

            initLights();
            applyColorScheme(state.colorScheme);
            setupPointerEvents();
            initGui();

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        // Launch application
        init();
    </script>
