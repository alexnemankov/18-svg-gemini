<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>543 - Procedural Geometric XOR Matrix</title>
  <style>
    * {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
      overflow: hidden;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #000000;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
      }
    }
  </script>
</head>
<body>
  <script type="module">
    import GUI from 'lil-gui';

    const SCHEMES = [
      'Original',
      'Monochromatic',
      'Analogous',
      'Complementary',
      'Split-complementary',
      'Triadic',
      'Tetradic',
      'Double split-complementary',
      'Achromatic (black and white)',
      'Achromatic + Accent (B&W + red)',
      'Neutral + accent',
      'Palette 1 (F6AA1C, BC3908, 941B0C, F6AA1C, 220901)',
      'Palette 2 (63D1CF, 5BC0BE, 4BAD9E, 4BAD9E, 0B132B, 000000)',
      'Palette 3 (AA60C8, D69ADE, C9A3C6, CFB5C2, 0D001D, 120A12)',
      'Palette 4 (FEF1BE, FFBA00, 008189, 00474D, 061210)',
      'Palette 5 (D4FFB0, 7FFF00, 00B894, 0A3322, 05140A)',
      'Palette 6 (FFE8CC, FF8C00, C7501A, 3D1050, 0E0618)',
      'Palette 7 (E8E0FF, B38FFF, 6A3DE8, 1A1250, 090612)',
      'Palette 8 (E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)'
    ];

    const PALETTE_DATA = {
      'Palette 1 (F6AA1C, BC3908, 941B0C, F6AA1C, 220901)': {
        colors: ['#F6AA1C', '#BC3908', '#941B0C', '#F6AA1C', '#220901'],
        bg: '#220901'
      },
      'Palette 2 (63D1CF, 5BC0BE, 4BAD9E, 4BAD9E, 0B132B, 000000)': {
        colors: ['#63D1CF', '#5BC0BE', '#4BAD9E', '#4BAD9E', '#0B132B', '#000000'],
        bg: '#0B132B'
      },
      'Palette 3 (AA60C8, D69ADE, C9A3C6, CFB5C2, 0D001D, 120A12)': {
        colors: ['#AA60C8', '#D69ADE', '#C9A3C6', '#CFB5C2', '#0D001D', '#120A12'],
        bg: '#0D001D'
      },
      'Palette 4 (FEF1BE, FFBA00, 008189, 00474D, 061210)': {
        colors: ['#FEF1BE', '#FFBA00', '#008189', '#00474D', '#061210'],
        bg: '#061210'
      },
      'Palette 5 (D4FFB0, 7FFF00, 00B894, 0A3322, 05140A)': {
        colors: ['#D4FFB0', '#7FFF00', '#00B894', '#0A3322', '#05140A'],
        bg: '#05140A'
      },
      'Palette 6 (FFE8CC, FF8C00, C7501A, 3D1050, 0E0618)': {
        colors: ['#FFE8CC', '#FF8C00', '#C7501A', '#3D1050', '#0E0618'],
        bg: '#0E0618'
      },
      'Palette 7 (E8E0FF, B38FFF, 6A3DE8, 1A1250, 090612)': {
        colors: ['#E8E0FF', '#B38FFF', '#6A3DE8', '#1A1250', '#090612'],
        bg: '#090612'
      },
      'Palette 8 (E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)': {
        colors: ['#E0FBFF', '#00F0FF', '#D40078', '#1E0A3D', '#05020F'],
        bg: '#05020F'
      }
    };

    const NEUTRALS = ['#2c2825', '#48423c', '#736a61', '#9c9287', '#cfc7be', '#ebe5de'];

    const params = {
      // Color & Screen
      colorScheme: 'Original',
      achromaticVariant: 'White on Black', // 'White on Black' or 'Black on White'
      greenScreen: false,
      backgroundColor: '#000000',
      baseHue: 285,
      accentColor: '#ff0033',
      blendMode: 'xor',

      // Geometry
      gridCount: 4,
      strokeScale: 1.0,

      // Motion
      speed: 1.0,
      motionDirection: 'Down',

      // Transform
      zoom: 1.0,
      panX: 0,
      panY: 0,

      // Procedural Generation
      clickToRandomize: true
    };

    let canvas, ctx;
    let W, H;
    let pos = [];
    let animId = null;
    let lastTime = 0;
    let elapsed = 0;

    const rand = (min, max) => Math.floor(Math.random() * (max - min + 1) + min);

    function getDefaultBgForScheme(schemeName, h, achromVar) {
      if (PALETTE_DATA[schemeName]) {
        return PALETTE_DATA[schemeName].bg;
      }
      if (schemeName === 'Original') {
        return '#000000';
      }
      if (schemeName === 'Monochromatic') {
        return `hsl(${h}, 35%, 7%)`;
      }
      if (schemeName === 'Analogous') {
        return `hsl(${(h - 30 + 360) % 360}, 30%, 8%)`;
      }
      if (schemeName === 'Complementary') {
        return `hsl(${h}, 25%, 7%)`;
      }
      if (schemeName === 'Split-complementary') {
        return `hsl(${(h + 180) % 360}, 20%, 7%)`;
      }
      if (schemeName === 'Triadic') {
        return `hsl(${h}, 20%, 6%)`;
      }
      if (schemeName === 'Tetradic') {
        return `hsl(${h}, 20%, 6%)`;
      }
      if (schemeName === 'Double split-complementary') {
        return `hsl(${(h + 180) % 360}, 20%, 6%)`;
      }
      if (schemeName === 'Achromatic (black and white)') {
        return achromVar === 'Black on White' ? '#ffffff' : '#000000';
      }
      if (schemeName === 'Achromatic + Accent (B&W + red)') {
        return achromVar === 'Black on White' ? '#ffffff' : '#000000';
      }
      if (schemeName === 'Neutral + accent') {
        return '#191715';
      }
      return '#000000';
    }

    function getSchemeColor(isOuter) {
      const scheme = params.colorScheme;
      const h = params.baseHue;
      const achrom = params.achromaticVariant;

      if (scheme === 'Original') {
        if (isOuter) {
          return Math.random() > 0.9 ? `hsl(${rand(240, 330)}, 80%, 60%)` : '#000000';
        }
        return `hsl(${rand(240, 330)}, 80%, 60%)`;
      }

      if (scheme === 'Monochromatic') {
        if (isOuter) {
          const l = [20, 35, 55, 80][rand(0, 3)];
          const s = [40, 60, 80][rand(0, 2)];
          return `hsl(${h}, ${s}%, ${l}%)`;
        }
        const l = [45, 60, 75, 88][rand(0, 3)];
        const s = [70, 85, 100][rand(0, 2)];
        return `hsl(${h}, ${s}%, ${l}%)`;
      }

      if (scheme === 'Analogous') {
        const hues = [h, (h + 30) % 360, (h - 30 + 360) % 360, (h + 60) % 360];
        const selectedHue = hues[rand(0, hues.length - 1)];
        if (isOuter) {
          return `hsl(${selectedHue}, ${rand(50, 75)}%, ${rand(25, 55)}%)`;
        }
        return `hsl(${selectedHue}, ${rand(75, 95)}%, ${rand(55, 75)}%)`;
      }

      if (scheme === 'Complementary') {
        const hues = [h, (h + 180) % 360];
        const selectedHue = hues[rand(0, 1)];
        if (isOuter) {
          return `hsl(${selectedHue}, ${rand(60, 85)}%, ${rand(30, 60)}%)`;
        }
        return `hsl(${selectedHue}, ${rand(80, 100)}%, ${rand(50, 70)}%)`;
      }

      if (scheme === 'Split-complementary') {
        const hues = [h, (h + 150) % 360, (h + 210) % 360];
        const selectedHue = hues[rand(0, 2)];
        if (isOuter) {
          return `hsl(${selectedHue}, ${rand(55, 80)}%, ${rand(30, 55)}%)`;
        }
        return `hsl(${selectedHue}, ${rand(80, 100)}%, ${rand(50, 75)}%)`;
      }

      if (scheme === 'Triadic') {
        const hues = [h, (h + 120) % 360, (h + 240) % 360];
        const selectedHue = hues[rand(0, 2)];
        if (isOuter) {
          return `hsl(${selectedHue}, ${rand(60, 85)}%, ${rand(30, 55)}%)`;
        }
        return `hsl(${selectedHue}, ${rand(80, 100)}%, ${rand(50, 75)}%)`;
      }

      if (scheme === 'Tetradic') {
        const hues = [h, (h + 60) % 360, (h + 180) % 360, (h + 240) % 360];
        const selectedHue = hues[rand(0, 3)];
        if (isOuter) {
          return `hsl(${selectedHue}, ${rand(60, 85)}%, ${rand(30, 55)}%)`;
        }
        return `hsl(${selectedHue}, ${rand(80, 100)}%, ${rand(50, 75)}%)`;
      }

      if (scheme === 'Double split-complementary') {
        const hues = [
          (h - 30 + 360) % 360,
          (h + 30) % 360,
          (h + 150) % 360,
          (h + 210) % 360
        ];
        const selectedHue = hues[rand(0, 3)];
        if (isOuter) {
          return `hsl(${selectedHue}, ${rand(55, 80)}%, ${rand(30, 55)}%)`;
        }
        return `hsl(${selectedHue}, ${rand(80, 100)}%, ${rand(50, 75)}%)`;
      }

      if (scheme === 'Achromatic (black and white)') {
        if (achrom === 'Black on White') {
          const tones = ['#000000', '#1a1a1a', '#333333', '#555555', '#777777'];
          return tones[rand(0, tones.length - 1)];
        } else {
          const tones = ['#ffffff', '#eeeeee', '#cccccc', '#999999', '#666666'];
          return tones[rand(0, tones.length - 1)];
        }
      }

      if (scheme === 'Achromatic + Accent (B&W + red)') {
        const useAccent = Math.random() < 0.28;
        if (useAccent) {
          return params.accentColor || '#ff0033';
        }
        if (achrom === 'Black on White') {
          const tones = ['#000000', '#1a1a1a', '#333333', '#555555', '#888888'];
          return tones[rand(0, tones.length - 1)];
        } else {
          const tones = ['#ffffff', '#eeeeee', '#cccccc', '#999999', '#555555'];
          return tones[rand(0, tones.length - 1)];
        }
      }

      if (scheme === 'Neutral + accent') {
        const useAccent = Math.random() < 0.25;
        if (useAccent) {
          return params.accentColor || '#ff8800';
        }
        return NEUTRALS[rand(0, NEUTRALS.length - 1)];
      }

      if (PALETTE_DATA[scheme]) {
        const pal = PALETTE_DATA[scheme].colors;
        if (isOuter) {
          return pal[rand(0, pal.length - 1)];
        }
        return pal[rand(0, Math.min(3, pal.length - 1))];
      }

      return '#ffffff';
    }

    function updateBg() {
      const activeColor = params.greenScreen ? '#00ff00' : params.backgroundColor;
      document.body.style.backgroundColor = activeColor;
      if (canvas) {
        canvas.style.backgroundColor = activeColor;
      }
    }

    function initCanvas() {
      canvas = document.createElement('canvas');
      document.body.appendChild(canvas);
      ctx = canvas.getContext('2d');
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
      updateBg();
    }

    function buildShapes() {
      pos = [];
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;

      const num = params.gridCount;
      const s = W > H ? W / num : H / num;
      const s2 = s / num;

      for (let y = 0; y < num; y++) {
        for (let x = 0; x < num; x++) {
          const outerColor = getSchemeColor(true);
          const outerMod = rand(1, 5);
          const outerShape = rand(0, 13);
          const px = s * x;
          const py = s * y;

          pos.push({
            x: px,
            y: py,
            baseX: px,
            baseY: py,
            size: s,
            shape: outerShape,
            color: outerColor,
            mod: outerMod,
            isOuter: true,
            speedMul: rand(8, 12) / 10,
            phase: Math.random() * Math.PI * 2
          });

          for (let i = 0; i < num; i++) {
            for (let j = 0; j < num; j++) {
              const innerColor = getSchemeColor(false);
              const innerMod = rand(1, 5);
              const innerShape = rand(0, 13);
              const inX = s2 * j + s * x;
              const inY = s2 * i + s * y;

              pos.push({
                x: inX,
                y: inY,
                baseX: inX,
                baseY: inY,
                size: s2,
                shape: innerShape,
                color: innerColor,
                mod: innerMod,
                isOuter: false,
                speedMul: rand(9, 14) / 10,
                phase: Math.random() * Math.PI * 2
              });
            }
          }
        }
      }
    }

    function recolorExistingShapes() {
      for (let i = 0; i < pos.length; i++) {
        pos[i].color = getSchemeColor(pos[i].isOuter);
      }
    }

    function resetView() {
      const num = params.gridCount;
      const s = W > H ? W / num : H / num;
      const totalGrid = s * num;
      params.zoom = 1.0;
      params.panX = (W - totalGrid) / 2;
      params.panY = (H - totalGrid) / 2;
      gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    /**
     * Shape Drawing Functions
     */
    function fillCircle(r, col) {
      const s = r / 2;
      ctx.save();
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(s, s, Math.max(0.1, s), 0, Math.PI * 2, false);
      ctx.fill();
      ctx.restore();
    }

    function strokeCircle(r, col) {
      const s = r / 2;
      const lw = Math.max(0.5, (r / 5) * params.strokeScale);
      ctx.save();
      ctx.strokeStyle = col;
      ctx.lineWidth = lw;
      ctx.beginPath();
      ctx.arc(s, s, Math.max(0.1, s - lw / 2), 0, Math.PI * 2, false);
      ctx.stroke();
      ctx.restore();
    }

    function tileFillCircle(r, num, col, mod) {
      const s = r / num;
      ctx.save();
      ctx.fillStyle = col;
      for (let y = 0; y < num; y++) {
        for (let x = 0; x < num; x++) {
          const i = y * num + x;
          if (i % mod === 0) {
            ctx.beginPath();
            ctx.arc(s * x + s / 2, s * y + s / 2, Math.max(0.1, s / 2), 0, Math.PI * 2, false);
            ctx.fill();
          }
        }
      }
      ctx.restore();
    }

    function tileStrokeCircle(r, num, col, mod) {
      const s = r / num;
      const lw = Math.max(0.5, (r / num / 5) * params.strokeScale);
      ctx.strokeStyle = col;
      ctx.save();
      ctx.lineWidth = lw;
      for (let y = 0; y < num; y++) {
        for (let x = 0; x < num; x++) {
          const i = y * num + x;
          if (i % mod === 0) {
            ctx.beginPath();
            ctx.arc(s * x + s / 2, s * y + s / 2, Math.max(0.1, (s - lw) / 2), 0, Math.PI * 2, false);
            ctx.stroke();
          }
        }
      }
      ctx.restore();
    }

    function stackCircle(r, num, col) {
      const s = r / 2;
      const lw = Math.max(0.5, (r / 5) * params.strokeScale);
      ctx.save();
      ctx.strokeStyle = col;
      ctx.lineWidth = lw;
      for (let i = 2; i > 0; i--) {
        ctx.beginPath();
        ctx.arc(s, s, Math.max(0.1, s / i - lw / 2), 0, Math.PI * 2, false);
        ctx.stroke();
      }
      ctx.restore();
    }

    function fillRect(r, col) {
      ctx.save();
      ctx.fillStyle = col;
      ctx.fillRect(0, 0, r, r);
      ctx.restore();
    }

    function strokeRect(r, col) {
      const lw = Math.max(0.5, (r / 5) * params.strokeScale);
      ctx.save();
      ctx.strokeStyle = col;
      ctx.lineWidth = lw;
      ctx.strokeRect(lw / 2, lw / 2, Math.max(0.1, r - lw), Math.max(0.1, r - lw));
      ctx.restore();
    }

    function tileFillRect(r, num, col, mod) {
      const s = r / num;
      ctx.save();
      ctx.fillStyle = col;
      for (let y = 0; y < num; y++) {
        for (let x = 0; x < num; x++) {
          const i = y * num + x;
          if (i % mod === 0) {
            ctx.fillRect(x * s, y * s, s, s);
          }
        }
      }
      ctx.restore();
    }

    function tileStrokeRect(r, num, col, mod) {
      const s = r / num;
      const lw = Math.max(0.5, (s / 5) * params.strokeScale);
      ctx.save();
      ctx.strokeStyle = col;
      ctx.lineWidth = lw;
      for (let y = 0; y < num; y++) {
        for (let x = 0; x < num; x++) {
          const i = y * num + x;
          if (i % mod === 0) {
            ctx.strokeRect(s * x + lw / 2, s * y + lw / 2, Math.max(0.1, s - lw), Math.max(0.1, s - lw));
          }
        }
      }
      ctx.restore();
    }

    function stackStrokeRect(r, num, col) {
      const s = r / 2;
      const rad = (Math.PI * 2) / num;
      ctx.save();
      ctx.fillStyle = col;
      for (let j = 0; j < 2; j++) {
        ctx.save();
        ctx.translate(s, s);
        ctx.rotate((45 * j * Math.PI) / 180);
        ctx.translate(-s, -s);
        for (let i = 0; i < num; i++) {
          if (i === 0) {
            ctx.beginPath();
            ctx.moveTo(Math.cos(i * rad) * s + s, Math.sin(i * rad) * s + s);
          } else {
            ctx.lineTo(Math.cos(i * rad) * s + s, Math.sin(i * rad) * s + s);
          }
        }
        ctx.fill();
        ctx.restore();
      }
      ctx.restore();
    }

    function verLines(r, num, col) {
      const s = r / num;
      ctx.save();
      ctx.strokeStyle = col;
      ctx.lineWidth = Math.max(0.5, s * params.strokeScale);
      for (let i = 0; i < num; i++) {
        if (i % 2 === 0) {
          ctx.beginPath();
          ctx.moveTo(s * i + s / 2, 0);
          ctx.lineTo(s * i + s / 2, r);
          ctx.stroke();
        }
      }
      ctx.restore();
    }

    function horLines(r, num, col) {
      const s = r / num;
      ctx.save();
      ctx.strokeStyle = col;
      ctx.lineWidth = Math.max(0.5, s * params.strokeScale);
      for (let i = 0; i < num; i++) {
        if (i % 2 === 0) {
          ctx.beginPath();
          ctx.moveTo(0, s * i + s / 2);
          ctx.lineTo(r, s * i + s / 2);
          ctx.stroke();
        }
      }
      ctx.restore();
    }

    function crossLine(r, col) {
      const lw = Math.max(0.5, (r / 5) * params.strokeScale);
      ctx.save();
      ctx.strokeStyle = col;
      ctx.lineWidth = lw;
      ctx.beginPath();
      ctx.moveTo(lw, lw);
      ctx.lineTo(r - lw, r - lw);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(r - lw, lw);
      ctx.lineTo(lw, r - lw);
      ctx.stroke();
      ctx.restore();
    }

    function polygon(r, num, col) {
      const s = r / 2;
      const rad = (Math.PI * 2) / num;
      ctx.save();
      ctx.fillStyle = col;
      for (let i = 0; i < num; i++) {
        if (i === 0) {
          ctx.beginPath();
          ctx.moveTo(Math.cos(i * rad) * s + s, Math.sin(i * rad) * s + s);
        } else {
          ctx.lineTo(Math.cos(i * rad) * s + s, Math.sin(i * rad) * s + s);
        }
      }
      ctx.fill();
      ctx.restore();
    }

    function chooseShape(shapeNum, size, col, mod) {
      switch (shapeNum) {
        case 0: fillCircle(size, col); break;
        case 1: strokeCircle(size, col); break;
        case 2: tileFillCircle(size, 3, col, mod); break;
        case 3: tileStrokeCircle(size, 3, col, mod); break;
        case 4: stackCircle(size, 2, col); break;
        case 5: fillRect(size, col); break;
        case 6: strokeRect(size, col); break;
        case 7: tileFillRect(size, 3, col, mod); break;
        case 8: tileStrokeRect(size, 3, col, mod); break;
        case 9: stackStrokeRect(size, 4, col); break;
        case 10: verLines(size, 5, col); break;
        case 11: horLines(size, 3, col); break;
        case 12: crossLine(size, col); break;
        case 13: polygon(size, 4, col); break;
      }
    }

    /**
     * Animation Loop
     */
    function render(timestamp) {
      if (!lastTime) lastTime = timestamp;
      const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
      lastTime = timestamp;
      elapsed += dt;

      ctx.clearRect(0, 0, W, H);

      ctx.save();
      ctx.translate(params.panX, params.panY);
      ctx.scale(params.zoom, params.zoom);

      ctx.globalCompositeOperation = params.blendMode;

      const num = params.gridCount;
      const s = W > H ? W / num : H / num;
      const totalGrid = s * num;

      for (let i = 0; i < pos.length; i++) {
        const item = pos[i];

        ctx.save();
        ctx.translate(item.x, item.y);
        chooseShape(item.shape, item.size, item.color, item.mod);
        ctx.restore();

        if (params.motionDirection === 'Down') {
          if (i % 3 === 0) {
            item.y += params.speed * item.speedMul;
            if (item.y > totalGrid) {
              item.y = -item.size;
            }
          }
        } else if (params.motionDirection === 'Up') {
          if (i % 3 === 0) {
            item.y -= params.speed * item.speedMul;
            if (item.y < -item.size) {
              item.y = totalGrid;
            }
          }
        } else if (params.motionDirection === 'Oscillate') {
          if (i % 2 === 0) {
            item.y = item.baseY + Math.sin(elapsed * params.speed * 2.5 + item.phase) * (s * 0.2);
          }
        }
      }

      ctx.restore();
      animId = requestAnimationFrame(render);
    }

    /**
     * Procedural Randomizer on Click
     */
    function randomizeScene() {
      // 1. Pick a random scheme
      params.colorScheme = SCHEMES[Math.floor(Math.random() * SCHEMES.length)];

      // 2. Random base hue & accent
      params.baseHue = Math.floor(Math.random() * 360);
      params.accentColor = `hsl(${Math.floor(Math.random() * 360)}, 95%, 55%)`;

      // 3. Random achromatic variant
      params.achromaticVariant = Math.random() > 0.5 ? 'White on Black' : 'Black on White';

      // 4. Random grid count between 3 and 6
      params.gridCount = Math.floor(Math.random() * 4) + 3;

      // 5. Random speed and direction
      params.speed = +(Math.random() * 2.5 + 0.5).toFixed(1);
      params.motionDirection = ['Down', 'Up', 'Oscillate'][Math.floor(Math.random() * 3)];

      // 6. Random stroke scale
      params.strokeScale = +(Math.random() * 1.4 + 0.6).toFixed(1);

      // 7. Update background if not green screen
      const defaultBg = getDefaultBgForScheme(params.colorScheme, params.baseHue, params.achromaticVariant);
      params.backgroundColor = defaultBg;
      updateBg();

      // 8. Rebuild geometric shapes
      buildShapes();

      // 9. Update UI controllers
      gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    /**
     * Setup lil-gui Controls
     */
    const gui = new GUI({ title: 'Visual Controls' });

    // Color & Screen Folder
    const fColor = gui.addFolder('Colors & Themes');
    fColor.add(params, 'colorScheme', SCHEMES).name('Color Scheme').onChange((val) => {
      if (!params.greenScreen) {
        params.backgroundColor = getDefaultBgForScheme(val, params.baseHue, params.achromaticVariant);
        updateBg();
      }
      recolorExistingShapes();
      gui.controllersRecursive().forEach(c => c.updateDisplay());
    });

    fColor.add(params, 'achromaticVariant', ['White on Black', 'Black on White']).name('Achromatic Style').onChange((val) => {
      if (!params.greenScreen && (params.colorScheme.includes('Achromatic'))) {
        params.backgroundColor = getDefaultBgForScheme(params.colorScheme, params.baseHue, val);
        updateBg();
      }
      recolorExistingShapes();
      gui.controllersRecursive().forEach(c => c.updateDisplay());
    });

    fColor.add(params, 'greenScreen').name('Green Screen (#00ff00)').onChange(() => {
      updateBg();
    });

    fColor.addColor(params, 'backgroundColor').name('Background Color').onChange(() => {
      updateBg();
    });

    fColor.add(params, 'baseHue', 0, 360, 1).name('Base Hue (Harmonies)').onChange(() => {
      recolorExistingShapes();
    });

    fColor.addColor(params, 'accentColor').name('Accent Color').onChange(() => {
      recolorExistingShapes();
    });

    fColor.add(params, 'blendMode', ['xor', 'source-over', 'screen', 'difference', 'lighter']).name('Blend Mode');

    // Geometry Folder
    const fGeom = gui.addFolder('Geometry');
    fGeom.add(params, 'gridCount', 2, 8, 1).name('Grid Count').onChange(() => {
      buildShapes();
      resetView();
    });
    fGeom.add(params, 'strokeScale', 0.2, 3.0, 0.1).name('Stroke Width');

    // Motion Folder
    const fMotion = gui.addFolder('Motion');
    fMotion.add(params, 'speed', 0, 5, 0.1).name('Speed');
    fMotion.add(params, 'motionDirection', ['Down', 'Up', 'Oscillate', 'None']).name('Direction');

    // Camera / Pan & Zoom Folder
    const fView = gui.addFolder('View & Transform');
    const zoomCtrl = fView.add(params, 'zoom', 0.1, 8.0, 0.05).name('Zoom');
    const panXCtrl = fView.add(params, 'panX').name('Pan X');
    const panYCtrl = fView.add(params, 'panY').name('Pan Y');
    fView.add({ reset: resetView }, 'reset').name('Reset View');

    // Procedural Settings Folder
    const fProc = gui.addFolder('Procedural Mode');
    fProc.add(params, 'clickToRandomize').name('Click to Randomize');
    fProc.add({ randomize: randomizeScene }, 'randomize').name('Generate Variation');

    /**
     * Mouse & Touch Events: Zoom with Wheel, Drag across screen, Click to Randomize
     */
    let isDragging = false;
    let dragStartX = 0, dragStartY = 0;
    let startPanX = 0, startPanY = 0;
    let dragDist = 0;

    window.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      if (e.target && e.target.closest && e.target.closest('.lil-gui')) return;

      isDragging = true;
      dragDist = 0;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      startPanX = params.panX;
      startPanY = params.panY;
      document.body.style.cursor = 'grabbing';
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - dragStartX;
      const dy = e.clientY - dragStartY;
      dragDist = Math.hypot(dx, dy);

      params.panX = startPanX + dx;
      params.panY = startPanY + dy;

      panXCtrl.updateDisplay();
      panYCtrl.updateDisplay();
    });

    window.addEventListener('mouseup', (e) => {
      if (!isDragging) return;
      isDragging = false;
      document.body.style.cursor = 'grab';

      if (dragDist < 5 && params.clickToRandomize) {
        if (!e.target || !e.target.closest || !e.target.closest('.lil-gui')) {
          randomizeScene();
        }
      }
    });

    // Wheel Zoom centered around cursor
    window.addEventListener('wheel', (e) => {
      if (e.target && e.target.closest && e.target.closest('.lil-gui')) return;
      e.preventDefault();

      const mx = e.clientX;
      const my = e.clientY;

      const worldX = (mx - params.panX) / params.zoom;
      const worldY = (my - params.panY) / params.zoom;

      const zoomFactor = e.deltaY < 0 ? 1.09 : (1 / 1.09);
      const newZoom = Math.min(Math.max(params.zoom * zoomFactor, 0.1), 10.0);

      params.panX = mx - worldX * newZoom;
      params.panY = my - worldY * newZoom;
      params.zoom = newZoom;

      zoomCtrl.updateDisplay();
      panXCtrl.updateDisplay();
      panYCtrl.updateDisplay();
    }, { passive: false });

    // Touch Support
    let initialPinchDist = null;
    let initialPinchZoom = 1;
    let touchStartX = 0, touchStartY = 0;
    let touchStartPanX = 0, touchStartPanY = 0;
    let touchMoved = false;

    window.addEventListener('touchstart', (e) => {
      if (e.target && e.target.closest && e.target.closest('.lil-gui')) return;

      if (e.touches.length === 1) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        touchStartPanX = params.panX;
        touchStartPanY = params.panY;
        touchMoved = false;
      } else if (e.touches.length === 2) {
        initialPinchDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        initialPinchZoom = params.zoom;
      }
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (e.target && e.target.closest && e.target.closest('.lil-gui')) return;

      if (e.touches.length === 1 && initialPinchDist === null) {
        const dx = e.touches[0].clientX - touchStartX;
        const dy = e.touches[0].clientY - touchStartY;
        if (Math.hypot(dx, dy) > 5) touchMoved = true;
        params.panX = touchStartPanX + dx;
        params.panY = touchStartPanY + dy;
        panXCtrl.updateDisplay();
        panYCtrl.updateDisplay();
      } else if (e.touches.length === 2 && initialPinchDist !== null) {
        const currentDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
        const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;

        const worldX = (midX - params.panX) / params.zoom;
        const worldY = (midY - params.panY) / params.zoom;

        const scale = currentDist / initialPinchDist;
        const newZoom = Math.min(Math.max(initialPinchZoom * scale, 0.1), 10.0);

        params.panX = midX - worldX * newZoom;
        params.panY = midY - worldY * newZoom;
        params.zoom = newZoom;

        zoomCtrl.updateDisplay();
        panXCtrl.updateDisplay();
        panYCtrl.updateDisplay();
      }
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      if (e.touches.length === 0) {
        if (!touchMoved && initialPinchDist === null && params.clickToRandomize) {
          if (!e.target || !e.target.closest || !e.target.closest('.lil-gui')) {
            randomizeScene();
          }
        }
        initialPinchDist = null;
      }
    }, { passive: true });

    // Keyboard shortcut: Toggle UI with 'H' key
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA')) {
          return;
        }
        const isHidden = gui._hidden || gui.domElement.style.display === 'none';
        if (isHidden) {
          if (typeof gui.show === 'function') gui.show(true);
          gui.domElement.style.display = '';
          gui._hidden = false;
        } else {
          if (typeof gui.hide === 'function') gui.hide();
          gui.domElement.style.display = 'none';
          gui._hidden = true;
        }
      }
    });

    // Resize Handler
    window.addEventListener('resize', () => {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    });

    // Initialize
    initCanvas();
    buildShapes();
    resetView();
    requestAnimationFrame(render);
  </script>
</body>
</html>
