  <script>
    if (typeof window.chroma === 'undefined') {
      window.chroma = (function() {
        function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
        function parseHex(h) {
          h = String(h).replace('#', '');
          if (h.length === 3) h = h.split('').map(c => c + c).join('');
          let num = parseInt(h, 16) || 0;
          return [(num >> 16) & 255, (num >> 8) & 255, num & 255];
        }
        function rgbToHsl(r, g, b) {
          r /= 255; g /= 255; b /= 255;
          let max = Math.max(r, g, b), min = Math.min(r, g, b);
          let h = 0, s = 0, l = (max + min) / 2;
          if (max !== min) {
            let d = max - min;
            s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
            switch (max) {
              case r: h = (g - b) / d + (g < b ? 6 : 0); break;
              case g: h = (b - r) / d + 2; break;
              case b: h = (r - g) / d + 4; break;
            }
            h /= 6;
          }
          return [h * 360, s, l];
        }
        function hslToRgb(h, s, l) {
          h = (h % 360 + 360) % 360;
          let c = (1 - Math.abs(2 * l - 1)) * s;
          let x = c * (1 - Math.abs(((h / 60) % 2) - 1));
          let m = l - c / 2;
          let r = 0, g = 0, b = 0;
          if (h < 60) { r = c; g = x; }
          else if (h < 120) { r = x; g = c; }
          else if (h < 180) { g = c; b = x; }
          else if (h < 240) { g = x; b = c; }
          else if (h < 300) { r = x; b = c; }
          else { r = c; b = x; }
          return [Math.round((r + m) * 255), Math.round((g + m) * 255), Math.round((b + m) * 255)];
        }
        class Color {
          constructor(r, g, b, a = 1) {
            this.r = clamp(r, 0, 255);
            this.g = clamp(g, 0, 255);
            this.b = clamp(b, 0, 255);
            this.a = clamp(a, 0, 1);
          }
          get(prop) {
            if (prop === 'hsl.h') return rgbToHsl(this.r, this.g, this.b)[0];
            return 0;
          }
          set(prop, val) {
            if (prop === 'hsl.h') {
              let [, s, l] = rgbToHsl(this.r, this.g, this.b);
              let [nr, ng, nb] = hslToRgb(val, s, l);
              return new Color(nr, ng, nb, this.a);
            }
            return this;
          }
          alpha(a) { return new Color(this.r, this.g, this.b, a); }
          darken(d = 0.5) {
            let [h, s, l] = rgbToHsl(this.r, this.g, this.b);
            let [nr, ng, nb] = hslToRgb(h, s, clamp(l - d * 0.35, 0, 1));
            return new Color(nr, ng, nb, this.a);
          }
          brighten(b = 0.5) {
            let [h, s, l] = rgbToHsl(this.r, this.g, this.b);
            let [nr, ng, nb] = hslToRgb(h, s, clamp(l + b * 0.35, 0, 1));
            return new Color(nr, ng, nb, this.a);
          }
          saturate(s = 0.5) {
            let [h, curS, l] = rgbToHsl(this.r, this.g, this.b);
            let [nr, ng, nb] = hslToRgb(h, clamp(curS + s * 0.35, 0, 1), l);
            return new Color(nr, ng, nb, this.a);
          }
          desaturate(d = 0.5) {
            let [h, curS, l] = rgbToHsl(this.r, this.g, this.b);
            let [nr, ng, nb] = hslToRgb(h, clamp(curS - d * 0.35, 0, 1), l);
            return new Color(nr, ng, nb, this.a);
          }
          hex() {
            let toHex = n => Math.round(n).toString(16).padStart(2, '0');
            return '#' + toHex(this.r) + toHex(this.g) + toHex(this.b);
          }
          css(fmt) {
            if (fmt === 'rgba') return 'rgba(' + Math.round(this.r) + ',' + Math.round(this.g) + ',' + Math.round(this.b) + ',' + this.a.toFixed(3) + ')';
            return this.hex();
          }
        }
        return function chroma(a, b, c, d) {
          if (typeof a === 'string') {
            let [r, g, bl] = parseHex(a);
            return new Color(r, g, bl, 1);
          }
          return new Color(a, b, c, d !== undefined ? d : 1);
        };
      })();
    }

      };
    }

    // ============================================================

        this.anchorType = anchorType;

        // Base points generation preserving original harmonic geometry
        this.pts = [];
        const numPts = floor(random(3, 6));
        for (let i = 0; i < numPts; i++) {
          const dx = random(d * 0.45, d * 0.95);
          const dy = random(d * 0.45, d * 0.95);
          const angle = (i * TWO_PI) / numPts;
          const sx = Math.sign(sin(angle)) || (cos(angle) >= 0 ? 1 : -1);
          const sy = Math.sign(cos(angle)) || (sin(angle) >= 0 ? 1 : -1);

          this.pts.push({
            baseX: sx * dx,
            baseY: sy * dy,
            freqX: random(0.5, 1.8),
            freqY: random(0.5, 1.8),
            phaseX: random(TWO_PI),
            phaseY: random(TWO_PI),
            ampX: random(0.08, 0.22),
            ampY: random(0.08, 0.22)
          });
        }

        // Sway and rotation physics
        this.swayPhase = random(TWO_PI);
        this.swayFreq = random(0.2, 0.7);
        this.swayAmp = random(0.03, 0.12);

        // Precalculated ribbon layers with stable rolling dashed patterns
        this.initLayers();
      }

      initLayers() {
        this.layers = [];
        const nLayers = settings.splineLayers;
        const baseD = this.d;

        for (let i = 0; i < nLayers; i++) {
          const nDashes = floor(random(1, 4));
          const dashList = [];
          for (let k = 0; k < nDashes; k++) {
            dashList.push(floor(random(6, random(18, 160))));
          }

          this.layers.push({
            dashList: dashList,
            dashOffset: random(1000),
            rollDirection: random() < 0.5 ? 1 : -1,
            rollSpeedMul: random(0.6, 1.6),
            weight: random(12, 95),
            paletteSeed: random(),
            colorIdx: i,
            alpha: random(170, 245),
            pulsePhase: random(TWO_PI),
            pulseFreq: random(0.4, 1.4),
            dispD: random(0.015, 0.045) * minWH
          });
        }
      }

      update(dt, timeSec) {
        if (!settings.isPlaying || settings.animSpeed === 0) return;

        const rollMult = settings.animSpeed * settings.dashRollSpeed * 45 * dt;
        for (let layer of this.layers) {
          layer.dashOffset += layer.rollDirection * layer.rollSpeedMul * rollMult;
        }
      }

      show(timeSec) {
        push();
        translate(this.x, this.y);

        const sway = sin(timeSec * this.swayFreq + this.swayPhase) * this.swayAmp * settings.morphStrength;
        rotate(sway);

        noFill();
        strokeCap(SQUARE);
        strokeJoin(ROUND);

        for (let layer of this.layers) {
          const pal = getPaletteForLayer(layer.paletteSeed);
          const clr = getColorFromPalette(pal, layer.colorIdx, layer.alpha);
          
          const curWeight = layer.weight * settings.strokeScale * 
            (1 + 0.08 * sin(timeSec * layer.pulseFreq + layer.pulsePhase));

          drawingContext.setLineDash(layer.dashList);
          drawingContext.lineDashOffset = layer.dashOffset;
          strokeWeight(max(1, curWeight));
          stroke(clr);

          beginShape();
          // Loop with curveVertex wrapping around to form a seamless closed organic contour
          const totalIter = this.pts.length + 3;
          for (let i = 0; i < totalIter; i++) {
            const p = this.pts[i % this.pts.length];
            const morphX = sin(timeSec * p.freqX + p.phaseX) * (this.d * p.ampX * settings.morphStrength);
            const morphY = cos(timeSec * p.freqY + p.phaseY) * (this.d * p.ampY * settings.morphStrength);
            
            // Subtle layer separation
            const lOffX = (layer.colorIdx - this.layers.length / 2) * 1.5;
            const lOffY = (layer.colorIdx - this.layers.length / 2) * 1.5;

            splineVertex(p.baseX + morphX + lOffX, p.baseY + morphY + lOffY);
          }
          endShape(CLOSE);
        }

        pop();
      }
    }

    // ============================================================
    // CircleCluster Class (Animated Eccentric Rolling Dashed Rings)
    // ============================================================
    class CircleCluster {
      constructor(cx, cy, d) {
        this.cx = cx;
        this.cy = cy;
        this.d = d;

        // Floating ambient drift
        this.driftFreqX = random(0.2, 0.6);
        this.driftFreqY = random(0.2, 0.6);
        this.driftPhaseX = random(TWO_PI);
        this.driftPhaseY = random(TWO_PI);
        this.driftAmpX = random(12, 45);
        this.driftAmpY = random(12, 45);

        this.initRings();
      }

      initRings() {
        this.rings = [];
        const nRings = settings.circleLayers;
        const maxOffset = this.d * random(0.015, 0.035);

        for (let i = 0; i < nRings; i++) {
          const nDashes = floor(random(1, 4));
          const dashList = [];
          for (let k = 0; k < nDashes; k++) {
            dashList.push(floor(random(8, random(20, 180))));
          }

          this.rings.push({
            dashList: dashList,
            dashOffset: random(1000),
            rollDirection: random() < 0.5 ? 1 : -1,
            rollSpeedMul: random(0.5, 1.5),
            weight: random(14, 110),
            paletteSeed: random(),
            colorIdx: i,
            alpha: random(150, 230),
            offsetX: random(-maxOffset, maxOffset),
            offsetY: random(-maxOffset, maxOffset),
            orbitFreq: random(0.3, 0.8),
            orbitPhase: random(TWO_PI),
            diamScale: random(0.88, 1.15),
            breatheFreq: random(0.3, 1.1),
            breathePhase: random(TWO_PI),
            pulseFreq: random(0.5, 1.3)
          });
        }
      }

      update(dt, timeSec) {
        if (!settings.isPlaying || settings.animSpeed === 0) return;

        const rollMult = settings.animSpeed * settings.dashRollSpeed * 50 * dt;
        for (let ring of this.rings) {
          ring.dashOffset += ring.rollDirection * ring.rollSpeedMul * rollMult;
        }
      }

      show(timeSec) {
        push();
        noFill();
        strokeCap(SQUARE);
        strokeJoin(ROUND);

        const curCx = this.cx + sin(timeSec * this.driftFreqX + this.driftPhaseX) * (this.driftAmpX * settings.driftSpeed);
        const curCy = this.cy + cos(timeSec * this.driftFreqY + this.driftPhaseY) * (this.driftAmpY * settings.driftSpeed);

        for (let ring of this.rings) {
          const pal = getPaletteForLayer(ring.paletteSeed);
          const clr = getColorFromPalette(pal, ring.colorIdx, ring.alpha);

          const curWeight = ring.weight * settings.strokeScale * 
            (1 + 0.08 * cos(timeSec * ring.pulseFreq));

          const curD = this.d * ring.diamScale * 
            (1 + 0.06 * sin(timeSec * ring.breatheFreq + ring.breathePhase) * settings.morphStrength);

          const curOx = ring.offsetX * cos(timeSec * ring.orbitFreq + ring.orbitPhase);
          const curOy = ring.offsetY * sin(timeSec * ring.orbitFreq + ring.orbitPhase);

          drawingContext.setLineDash(ring.dashList);
          drawingContext.lineDashOffset = ring.dashOffset;
          strokeWeight(max(1, curWeight));
          stroke(clr);

          circle(curCx + curOx, curCy + curOy, curD);
        }

        pop();
      }
    }

    // ============================================================
    // Generative Composition & Initialization
    // ============================================================
    function getRandDiameter() {
      return random(minWH * 0.45, minWH * 0.78);
    }

    function initShapes() {
      shapes = [];
      const count = settings.shapeCount;

      // Authentic corner and edge anchors + floating procedural accents
      const candidateAnchors = [
        { x: 0, y: 0 },
        { x: width, y: 0 },
        { x: width, y: height },
        { x: 0, y: height },
        { x: width * 0.5, y: 0 },
        { x: width, y: height * 0.5 },
        { x: width * 0.5, y: height },
        { x: 0, y: height * 0.5 },
        { x: width * 0.25, y: height * 0.3 },
        { x: width * 0.75, y: height * 0.7 }
      ];

      shuffle(candidateAnchors, true);

      for (let i = 0; i < count; i++) {
        let anchor = candidateAnchors[i % candidateAnchors.length];
        let d = getRandDiameter();
        shapes.push(new Spline(anchor.x, anchor.y, d));
      }
    }

    function initCircles() {
      circleClusters = [];
      const numC = settings.circleCount;
      for (let j = 0; j < numC; j++) {
        const cx = random(-width * 0.15, width * 1.15);
        const cy = random(-height * 0.15, height * 1.15);
        const d = getRandDiameter() * 1.4;
        circleClusters.push(new CircleCluster(cx, cy, d));
      }
    }

    function rebuildBackgroundBuffer() {
      if (!bgBuffer) {
        bgBuffer = createGraphics(width, height);
      } else if (bgBuffer.width !== width || bgBuffer.height !== height) {
        bgBuffer.resizeCanvas(width, height);
      }

      const theme = getActiveTheme();
      bgBuffer.clear();
      bgBuffer.background(theme.bg);

      if (settings.bgPattern === 'Hatched Lines' || settings.bgPattern === 'Hybrid') {
        bgBuffer.stroke(theme.hatch);
        bgBuffer.strokeWeight(1.2);
        const d = settings.patternDensity;
        for (let y = d / 2; y < height - d / 3; y += d) {
          bgBuffer.line(0, y, width, y);
        }
      }

      if (settings.bgPattern === 'Dot Grid' || settings.bgPattern === 'Hybrid') {
        bgBuffer.stroke(theme.hatch);
        bgBuffer.strokeWeight(1.8);
        const d = settings.patternDensity;
        for (let y = d / 2; y < height - d; y += d) {
          for (let x = d / 3; x < width - d / 2; x += d) {
            bgBuffer.point(x, y);
          }
        }
      }
    }

    // ============================================================
    // Randomization & Visual Theme Generation
    // ============================================================
    function randomizeScene(newTheme = true) {
      if (newTheme) {
        const schemeKeys = Object.keys(COLOR_SCHEMES);
        const pickedScheme = random(schemeKeys);
        settings.colorScheme = pickedScheme;
        if (pickedScheme === 'Original') {
          settings.originalSubPaletteIndex = floor(random(ORIGINAL_PALETTES.length));
        }

        // Randomize background texture pattern
        const patterns = ['Hatched Lines', 'Dot Grid', 'Hybrid'];
        settings.bgPattern = random(patterns);
      }

      // Re-roll motion and geometry parameters
      settings.shapeCount = floor(random(4, 9));
      settings.circleCount = floor(random(2, 5));
      settings.splineLayers = floor(random(3, 6));
      settings.circleLayers = floor(random(3, 6));
      settings.strokeScale = random(0.75, 1.35);
      settings.morphStrength = random(0.7, 1.5);
      settings.dashRollSpeed = random(0.65, 1.6);
      settings.patternDensity = floor(random(22, 44));

      updateActivePaletteList();
      rebuildBackgroundBuffer();
      initShapes();
      initCircles();

      if (gui) {
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      }
    }

    function resetCamera() {
      targetPanX = 0;
      targetPanY = 0;
      targetZoomLevel = 1.0;
      settings.zoom = 1.0;
      if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    // ============================================================
    // p5.js Core Lifecycle
    // ============================================================
    function setup() {
      const container = document.getElementById('canvas-container');
      const w = container.clientWidth || windowWidth;
      const h = container.clientHeight || windowHeight;
      const cnv = createCanvas(w, h);
      cnv.parent('canvas-container');

      minWH = min(width, height);
      pixelDensity(min(window.devicePixelRatio || 1, 2));

      noFill();
      stroke(212);
      strokeWeight(2);
      strokeCap(SQUARE);
      strokeJoin(ROUND);

      updateActivePaletteList();
      rebuildBackgroundBuffer();
      initShapes();
      initCircles();

      buildGUI();
      setupInteractions();

      lastTime = millis();
    }

    function windowResized() {
      const container = document.getElementById('canvas-container');
      const w = container.clientWidth || windowWidth;
      const h = container.clientHeight || windowHeight;
      resizeCanvas(w, h);
      minWH = min(width, height);

      rebuildBackgroundBuffer();
      initShapes();
      initCircles();
    }

    function draw() {
      const now = millis();
      const dt = min((now - lastTime) / 1000, 0.1);
      lastTime = now;

      if (settings.isPlaying) {
        animClock += dt * settings.animSpeed;
      }

      // Smooth camera interpolation
      zoomLevel += (targetZoomLevel - zoomLevel) * 0.15;
      panX += (targetPanX - panX) * 0.15;
      panY += (targetPanY - panY) * 0.15;

      const theme = getActiveTheme();

      // Clear main screen
      background(theme.bg);

      // World space transform for zoom and pan
      push();
      translate(width / 2 + panX, height / 2 + panY);
      scale(zoomLevel);
      translate(-width / 2, -height / 2);

      // Render cached background texture
      if (bgBuffer) {
        image(bgBuffer, 0, 0);
      }

      // Update and render animated Splines
      for (let s of shapes) {
        s.update(dt, animClock);
        s.show(animClock);
      }

      // Update and render animated Circles
      for (let c of circleClusters) {
        c.update(dt, animClock);
        c.show(animClock);
      }

      pop();
    }

    // ============================================================
    // Interactive Gestures (Wheel Zoom & Drag Pan)
    // ============================================================
    function setupInteractions() {
      const container = document.getElementById('canvas-container');

      // Wheel Zoom Centered on Mouse Cursor
      window.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomFactor = e.deltaY < 0 ? 1.09 : 0.91;
        const mouseX = e.clientX;
        const mouseY = e.clientY;

        const newZoom = Math.min(Math.max(targetZoomLevel * zoomFactor, 0.2), 6.5);
        const worldX = (mouseX - (width / 2 + targetPanX)) / targetZoomLevel;
        const worldY = (mouseY - (height / 2 + targetPanY)) / targetZoomLevel;

        targetZoomLevel = newZoom;
        settings.zoom = newZoom;
        targetPanX = mouseX - width / 2 - worldX * targetZoomLevel;
        targetPanY = mouseY - height / 2 - worldY * targetZoomLevel;

        if (gui) {
          let zoomCtrl = gui.controllersRecursive().find(c => c.property === 'zoom');
          if (zoomCtrl) zoomCtrl.updateDisplay();
        }
      }, { passive: false });

      // Drag to Pan & Click to Randomize
      window.addEventListener('pointerdown', (e) => {
        if (e.target.closest('.lil-gui')) return;
        isDragging = true;
        hasDragged = false;
        dragStartX = e.clientX;
        dragStartY = e.clientY;
        startPanX = targetPanX;
        startPanY = targetPanY;
      });

      window.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        const dx = e.clientX - dragStartX;
        const dy = e.clientY - dragStartY;
        if (Math.hypot(dx, dy) > 6) {
          hasDragged = true;
        }
        targetPanX = startPanX + dx;
        targetPanY = startPanY + dy;
      });

      window.addEventListener('pointerup', (e) => {
        if (!isDragging) return;
        isDragging = false;
        if (!hasDragged && !e.target.closest('.lil-gui')) {
          // Clean Click detected on scene: procedural re-roll of theme and parameters!
          if (settings.clickToRandomize) {
            randomizeScene(true);
          }
        }
      });

      // Keyboard Controls
      window.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT') return;
        if (e.code === 'Space') {
          e.preventDefault();
          settings.isPlaying = !settings.isPlaying;
          if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
        } else if (e.code === 'KeyR') {
          e.preventDefault();
          randomizeScene(true);
        } else if (e.code === 'KeyC') {
          e.preventDefault();
          let keys = Object.keys(COLOR_SCHEMES);
          let nextIdx = (keys.indexOf(settings.colorScheme) + 1) % keys.length;
          settings.colorScheme = keys[nextIdx];
          updateActivePaletteList();
          rebuildBackgroundBuffer();
          if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
        } else if (e.code === 'KeyF') {
          e.preventDefault();
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(() => {});
          } else {
            document.exitFullscreen().catch(() => {});
          }
        } else if (e.code === 'KeyZ') {
          e.preventDefault();
          resetCamera();
        } else if (e.code === 'KeyS') {
          e.preventDefault();
          settings.savePNG();
        }
      });
    }

    // ============================================================
    // lil-gui Control Panel Construction
    // ============================================================
    function buildGUI() {
      gui = new lil.GUI({ title: 'Rolls Revisited // Pattern' });

      // Folder 1: Color Themes (19 Curated Schemes)
      const fTheme = gui.addFolder('Color Schemes (19 Schemes)');
      fTheme.add(settings, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Palette Scheme').onChange(() => {
        updateActivePaletteList();
        rebuildBackgroundBuffer();
      });
      fTheme.add(settings, 'bgMode', ['Auto Harmonized', 'Light Paper', 'Dark Ink']).name('Canvas Tone').onChange(() => {
        rebuildBackgroundBuffer();
      });
      fTheme.add(settings, 'clickToRandomize').name('Click Scene to Roll');
      fTheme.add(settings, 'regenerate').name('🎲 Randomize Scene');

      // Folder 2: Motion & Simulation Speed
      const fAnim = gui.addFolder('Motion & Dynamics');
      fAnim.add(settings, 'animSpeed', 0.0, 3.0, 0.05).name('Animation Speed');
      fAnim.add(settings, 'dashRollSpeed', 0.0, 3.0, 0.05).name('Dash Roll Rate');
      fAnim.add(settings, 'morphStrength', 0.0, 2.5, 0.05).name('Morph Amplitude');
      fAnim.add(settings, 'driftSpeed', 0.0, 2.5, 0.05).name('Floating Drift');
      fAnim.add(settings, 'isPlaying').name('Simulating');

      // Folder 3: Geometric Densities & Layers
      const fGeom = gui.addFolder('Geometric Elements');
      fGeom.add(settings, 'shapeCount', 2, 12, 1).name('Spline Ribbons').onChange(() => {
        initShapes();
      });
      fGeom.add(settings, 'circleCount', 1, 6, 1).name('Circle Clusters').onChange(() => {
        initCircles();
      });
      fGeom.add(settings, 'splineLayers', 1, 8, 1).name('Spline Layers').onChange(() => {
        for (let s of shapes) s.initLayers();
      });
      fGeom.add(settings, 'circleLayers', 1, 8, 1).name('Circle Rings').onChange(() => {
        for (let c of circleClusters) c.initRings();
      });
      fGeom.add(settings, 'strokeScale', 0.3, 2.2, 0.05).name('Stroke Thickness');

      // Folder 4: Background & Texture
      const fBackdrop = gui.addFolder('Backdrop & Grid');
      fBackdrop.add(settings, 'bgPattern', ['Hatched Lines', 'Dot Grid', 'Hybrid', 'None']).name('Backdrop Grid').onChange(() => {
        rebuildBackgroundBuffer();
      });
      fBackdrop.add(settings, 'patternDensity', 14, 60, 2).name('Grid Density').onChange(() => {
        rebuildBackgroundBuffer();
      });

      // Folder 5: Camera & Viewport
      const fView = gui.addFolder('Camera & Viewport');
      fView.add(settings, 'zoom', 0.2, 6.0, 0.05).name('Zoom Scale').listen().onChange((v) => {
        targetZoomLevel = v;
      });
      fView.add(settings, 'resetView').name('Reset View (Key Z)');
      fView.add(settings, 'savePNG').name('Save Image (Key S)');
    }
  </script>
