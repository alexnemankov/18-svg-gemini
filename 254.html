<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zdog Kinetic Hemisphere & Cone Sculpture</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    body {
      min-height: 100%;
      background: #FDB;
      user-select: none;
      -webkit-user-select: none;
    }
    .illo {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: grab;
      touch-action: none;
    }
    .illo:active {
      cursor: grabbing;
    }
  </style>
</head>
<body>
  <canvas class="illo"></canvas>

  <script src="https://unpkg.com/zdog@1/dist/zdog.dist.min.js"></script>
  <script type="importmap">
    {
      "imports": {
        "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
      }
    }
  </script>

  <script type="module">
    import GUI from 'lil-gui';

    const TAU = Zdog.TAU;

    // --- Color Scheme Presets ---
    const COLOR_SCHEMES = {
      'Warm Sunset (Original)': {
        bg: '#FDB',
        color0: '#663366', // eggplant
        color1: '#CC2255', // garnet
        color2: '#EE6622', // orange
        color3: '#EEAA00', // gold
        color4: '#EEDD00', // yellow
      },
      'Black & White': {
        bg: '#000000',
        color0: '#222222',
        color1: '#555555',
        color2: '#888888',
        color3: '#BBBBBB',
        color4: '#FFFFFF',
      },
      'White & Black': {
        bg: '#FFFFFF',
        color0: '#DDDDDD',
        color1: '#AAAAAA',
        color2: '#777777',
        color3: '#444444',
        color4: '#111111',
      },
      'Cyber Neon': {
        bg: '#0d0b18',
        color0: '#240046',
        color1: '#7b2cbf',
        color2: '#ff007f',
        color3: '#00f5d4',
        color4: '#fee440',
      },
      'Oceanic Aurora': {
        bg: '#051b1e',
        color0: '#064e3b',
        color1: '#047857',
        color2: '#06b6d4',
        color3: '#3b82f6',
        color4: '#a7f3d0',
      }
    };

    // --- Animation Presets ---
    const ANIM_PRESETS = [
      'Original Harmonic Keyframes',
      'Static (No Movement)',
      'Gentle Gyro Precession',
      'Petal Breathe & Sway',
      'Cosmic Tumble & Drift'
    ];

    // --- Application State Parameters ---
    const params = {
      // Color & Theme
      colorScheme: 'Warm Sunset (Original)',
      greenScreen: false,
      bgColor: COLOR_SCHEMES['Warm Sunset (Original)'].bg,
      color0: COLOR_SCHEMES['Warm Sunset (Original)'].color0,
      color1: COLOR_SCHEMES['Warm Sunset (Original)'].color1,
      color2: COLOR_SCHEMES['Warm Sunset (Original)'].color2,
      color3: COLOR_SCHEMES['Warm Sunset (Original)'].color3,
      color4: COLOR_SCHEMES['Warm Sunset (Original)'].color4,

      // Animation
      animPreset: 'Original Harmonic Keyframes',
      speed: 1.0,
      autoSpin: true,

      // Geometry & Model
      sceneSize: 48,
      rotorCount: 5,
      hemiDiameter: 13,
      coneLength: 6.5,
      shapeSpacing: 16,
      rotorTiltDeg: 30, // TAU/6
      strokeWidth: 0,

      // Transform, Zoom & Pan
      zoomMultiplier: 1.0,
      posX: 0,
      posY: 0,
      rotX: 0,
      rotY: 0,
      rotZ: 0,
      dragPrimaryAction: 'Rotate Scene',

      // Rendering & Interaction
      dpr: Math.min(window.devicePixelRatio || 1, 2),
      randomizeOnClick: true,
    };

    // --- Core Variables ---
    const canvas = document.querySelector('.illo');
    let illo;
    let gui;
    let baseZoom = 1;

    // Rotation & Movement tracking
    let userRot = { x: 0, y: 0, z: 0 };
    let gyroAngleY = 0;
    let tumbleAngle = 0;
    let ticker = 0;
    const cycleCount = 180;
    const keyframes = [
      { x: TAU * 0,   y: TAU * 0 },
      { x: TAU * 1/2, y: TAU * 1/2 },
      { x: TAU * 1,   y: TAU * 1 },
    ];
    const turnLimit = keyframes.length - 1;

    function init() {
      setupIllustration();
      buildScene();
      applyColors();
      setupGUI();
      setupEventListeners();
      handleResize();
      animate();
    }

    function setupIllustration() {
      illo = new Zdog.Illustration({
        element: canvas,
        dragRotate: false,
        centered: true,
        resize: false,
        pixelRatio: params.dpr,
      });
    }

    function buildScene() {
      // Clear existing elements in illustration
      while (illo.children.length > 0) {
        illo.children[0].remove();
      }

      const colorWheel = [
        params.color0,
        params.color1,
        params.color2,
        params.color3,
        params.color4,
      ];

      const strokeVal = params.strokeWidth > 0 ? params.strokeWidth : false;

      // Central Hemisphere (Top)
      const hemi = new Zdog.Hemisphere({
        addTo: illo,
        diameter: params.hemiDiameter,
        translate: { y: -params.shapeSpacing },
        rotate: { x: -TAU / 4 },
        color: params.color1,
        backface: params.color0,
        stroke: strokeVal,
      });

      // Central Cone (Bottom)
      const cone = new Zdog.Cone({
        addTo: illo,
        diameter: params.hemiDiameter,
        length: params.coneLength,
        translate: { y: params.shapeSpacing },
        rotate: { x: TAU / 4 },
        color: params.color1,
        backface: params.color0,
        stroke: strokeVal,
      });

      const count = Math.max(2, Math.round(params.rotorCount));
      const tiltRad = (params.rotorTiltDeg * Math.PI) / 180;

      [true, false].forEach(function(isHemi) {
        const shape = isHemi ? hemi : cone;

        for (let i = 0; i < count; i++) {
          const rotor1 = new Zdog.Anchor({
            addTo: illo,
            rotate: { y: (TAU / count) * i },
          });
          const rotor2 = new Zdog.Anchor({
            addTo: rotor1,
            rotate: { x: tiltRad },
          });

          shape.copy({
            addTo: rotor2,
            color: colorWheel[i % colorWheel.length],
            backface: colorWheel[(i + 7) % colorWheel.length],
            stroke: strokeVal,
          });
        }
      });
    }

    function applyColors() {
      const activeBg = params.greenScreen ? '#00ff00' : params.bgColor;
      document.body.style.background = activeBg;
      buildScene();
    }

    function applyPreset(presetName) {
      const preset = COLOR_SCHEMES[presetName];
      if (!preset) return;

      params.colorScheme = presetName;
      params.bgColor = preset.bg;
      params.color0 = preset.color0;
      params.color1 = preset.color1;
      params.color2 = preset.color2;
      params.color3 = preset.color3;
      params.color4 = preset.color4;

      applyColors();
      if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    function updateZoom() {
      illo.zoom = Math.max(0.1, baseZoom * params.zoomMultiplier);
    }

    function handleResize() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      illo.pixelRatio = params.dpr;
      illo.setSize(width, height);
      baseZoom = Math.floor(Math.min(width, height) / params.sceneSize);
      if (baseZoom < 1) baseZoom = 1;
      updateZoom();
    }

    function resetTransform() {
      params.posX = 0;
      params.posY = 0;
      params.rotX = 0;
      params.rotY = 0;
      params.rotZ = 0;
      params.zoomMultiplier = 1.0;
      userRot = { x: 0, y: 0, z: 0 };
      illo.translate.x = 0;
      illo.translate.y = 0;
      illo.translate.z = 0;
      updateZoom();
      if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    function randomizeScene() {
      // Pick random color palette or procedural hues
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const chosenScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      
      if (Math.random() > 0.4) {
        applyPreset(chosenScheme);
      } else {
        // Procedural vibrant palette
        const baseHue = Math.random() * 360;
        params.bgColor = `hsl(${Math.round((baseHue + 180) % 360)}, 30%, ${Math.random() > 0.5 ? 90 : 12}%)`;
        params.color0 = `hsl(${Math.round(baseHue)}, 70%, 25%)`;
        params.color1 = `hsl(${Math.round((baseHue + 40) % 360)}, 85%, 45%)`;
        params.color2 = `hsl(${Math.round((baseHue + 80) % 360)}, 90%, 55%)`;
        params.color3 = `hsl(${Math.round((baseHue + 130) % 360)}, 95%, 60%)`;
        params.color4 = `hsl(${Math.round((baseHue + 170) % 360)}, 95%, 65%)`;
        params.colorScheme = 'Custom Random';
      }

      // Re-roll geometric parameters
      params.rotorCount = Math.floor(Math.random() * 6) + 3; // 3 to 8
      params.hemiDiameter = parseFloat((Math.random() * 10 + 9).toFixed(1)); // 9 to 19
      params.coneLength = parseFloat((Math.random() * 8 + 4).toFixed(1)); // 4 to 12
      params.shapeSpacing = parseFloat((Math.random() * 14 + 11).toFixed(1)); // 11 to 25
      params.rotorTiltDeg = Math.floor(Math.random() * 45) + 15; // 15 to 60 deg
      params.strokeWidth = Math.random() > 0.7 ? parseFloat((Math.random() * 1.5).toFixed(1)) : 0;

      // Re-roll animation parameters
      params.animPreset = ANIM_PRESETS[Math.floor(Math.random() * ANIM_PRESETS.length)];
      params.speed = parseFloat((Math.random() * 1.2 + 0.5).toFixed(2));

      buildScene();
      applyColors();
      if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    function setupGUI() {
      gui = new GUI({ title: 'Zdog Sculpture Controls' });

      // Folder: Colors & Theme
      const fColors = gui.addFolder('Colors & Theme');
      fColors.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES))
        .name('Scheme Preset')
        .onChange(v => applyPreset(v));

      fColors.add(params, 'greenScreen')
        .name('Green Screen (#00ff00)')
        .onChange(() => applyColors());

      fColors.addColor(params, 'bgColor').name('Background Color').onChange(() => applyColors());
      fColors.addColor(params, 'color0').name('Color 1 (Eggplant/Base)').onChange(() => buildScene());
      fColors.addColor(params, 'color1').name('Color 2 (Garnet/Caps)').onChange(() => buildScene());
      fColors.addColor(params, 'color2').name('Color 3 (Orange)').onChange(() => buildScene());
      fColors.addColor(params, 'color3').name('Color 4 (Gold)').onChange(() => buildScene());
      fColors.addColor(params, 'color4').name('Color 5 (Yellow)').onChange(() => buildScene());

      // Folder: Animation
      const fAnim = gui.addFolder('Animation');
      fAnim.add(params, 'animPreset', ANIM_PRESETS).name('Animation Mode');
      fAnim.add(params, 'speed', 0.0, 4.0, 0.05).name('Animation Speed');
      fAnim.add(params, 'autoSpin').name('Auto Spin Active');

      // Folder: Geometry & Structure
      const fGeom = gui.addFolder('Geometry & Shape');
      fGeom.add(params, 'rotorCount', 2, 12, 1).name('Rotor Symmetry').onChange(() => buildScene());
      fGeom.add(params, 'hemiDiameter', 4, 30, 0.5).name('Hemisphere Size').onChange(() => buildScene());
      fGeom.add(params, 'coneLength', 2, 25, 0.5).name('Cone Length').onChange(() => buildScene());
      fGeom.add(params, 'shapeSpacing', 5, 40, 0.5).name('Shape Spacing').onChange(() => buildScene());
      fGeom.add(params, 'rotorTiltDeg', 0, 90, 1).name('Rotor Tilt (deg)').onChange(() => buildScene());
      fGeom.add(params, 'strokeWidth', 0, 4, 0.1).name('Stroke Width').onChange(() => buildScene());
      fGeom.add({ rebuild: () => buildScene() }, 'rebuild').name('Rebuild Geometry');

      // Folder: Transform & Navigation
      const fTrans = gui.addFolder('Transform & Navigation');
      fTrans.add(params, 'zoomMultiplier', 0.1, 8.0, 0.05).name('Zoom Level').onChange(() => updateZoom());
      fTrans.add(params, 'posX', -150, 150, 0.5).name('Position X').onChange(v => { illo.translate.x = v; });
      fTrans.add(params, 'posY', -150, 150, 0.5).name('Position Y').onChange(v => { illo.translate.y = v; });
      fTrans.add(params, 'rotX', -180, 180, 1).name('Rotate X (deg)').onChange(v => { userRot.x = (v * Math.PI) / 180; });
      fTrans.add(params, 'rotY', -180, 180, 1).name('Rotate Y (deg)').onChange(v => { userRot.y = (v * Math.PI) / 180; });
      fTrans.add(params, 'rotZ', -180, 180, 1).name('Rotate Z (deg)').onChange(v => { userRot.z = (v * Math.PI) / 180; });
      fTrans.add(params, 'dragPrimaryAction', ['Rotate Scene', 'Pan / Move Object']).name('Primary Drag');
      fTrans.add({ reset: () => resetTransform() }, 'reset').name('Reset Transform');

      // Folder: Rendering & Interaction
      const fRender = gui.addFolder('Rendering & Interaction');
      fRender.add(params, 'dpr', 0.5, 3.0, 0.1).name('Pixel Ratio (DPR)').onChange(v => {
        handleResize();
      });
      fRender.add(params, 'randomizeOnClick').name('Randomize on Click');
      fRender.add({ randomize: () => randomizeScene() }, 'randomize').name('Randomize Scene');
    }

    function setupEventListeners() {
      window.addEventListener('resize', handleResize);

      // Hide / Show UI with 'H' key
      window.addEventListener('keydown', (e) => {
        if (e.key === 'h' || e.key === 'H') {
          gui._hidden = !gui._hidden;
          gui.domElement.style.display = gui._hidden ? 'none' : '';
        }
      });

      // Mouse Wheel Zoom
      canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        const factor = e.deltaY < 0 ? 1.08 : 0.92;
        params.zoomMultiplier = Math.max(0.1, Math.min(10.0, params.zoomMultiplier * factor));
        updateZoom();
        if (gui) {
          gui.controllersRecursive().forEach(c => {
            if (c.property === 'zoomMultiplier') c.updateDisplay();
          });
        }
      }, { passive: false });

      // Context menu prevention for smooth right-drag pan
      canvas.addEventListener('contextmenu', (e) => e.preventDefault());

      // Drag & Click Navigation Handler
      let isPointerDown = false;
      let startX = 0;
      let startY = 0;
      let lastX = 0;
      let lastY = 0;
      let pointerDownTime = 0;
      let dragMode = 'rotate';

      canvas.addEventListener('pointerdown', (e) => {
        if (e.target.closest('.lil-gui')) return;

        isPointerDown = true;
        startX = e.clientX;
        startY = e.clientY;
        lastX = e.clientX;
        lastY = e.clientY;
        pointerDownTime = performance.now();

        // Check if secondary button, Shift key, or Primary Pan mode
        const isSecondary = e.button === 2 || e.button === 1 || e.shiftKey;
        if (params.dragPrimaryAction === 'Pan / Move Object') {
          dragMode = isSecondary ? 'rotate' : 'pan';
        } else {
          dragMode = isSecondary ? 'pan' : 'rotate';
        }

        try { canvas.setPointerCapture(e.pointerId); } catch(err) {}
      });

      canvas.addEventListener('pointermove', (e) => {
        if (!isPointerDown) return;

        const dx = e.clientX - lastX;
        const dy = e.clientY - lastY;
        lastX = e.clientX;
        lastY = e.clientY;

        if (dragMode === 'rotate') {
          userRot.y += dx * 0.008;
          userRot.x -= dy * 0.008;
          params.rotX = parseFloat(((userRot.x * 180 / Math.PI) % 360).toFixed(1));
          params.rotY = parseFloat(((userRot.y * 180 / Math.PI) % 360).toFixed(1));
        } else if (dragMode === 'pan') {
          const currentZoom = illo.zoom || 1;
          params.posX += dx / currentZoom;
          params.posY += dy / currentZoom;
          illo.translate.x = params.posX;
          illo.translate.y = params.posY;
        }

        if (gui) {
          gui.controllersRecursive().forEach(c => {
            if (['posX', 'posY', 'rotX', 'rotY'].includes(c.property)) c.updateDisplay();
          });
        }
      });

      canvas.addEventListener('pointerup', (e) => {
        if (!isPointerDown) return;
        isPointerDown = false;
        try { canvas.releasePointerCapture(e.pointerId); } catch(err) {}

        const dist = Math.hypot(e.clientX - startX, e.clientY - startY);
        const duration = performance.now() - pointerDownTime;

        // Clean click without significant drag
        if (dist < 6 && duration < 300 && e.button === 0 && params.randomizeOnClick) {
          randomizeScene();
        }
      });
    }

    let lastTime = 0;

    function animate(currentTime = 0) {
      requestAnimationFrame(animate);

      const delta = (currentTime - lastTime) * 0.001 || 0.016;
      lastTime = currentTime;
      const time = currentTime * 0.001;

      updateAnimation(time, delta);
      illo.updateRenderGraph();
    }

    function updateAnimation(time, delta) {
      if (!params.autoSpin && params.animPreset !== 'Static (No Movement)') {
        illo.rotate.x = userRot.x;
        illo.rotate.y = userRot.y;
        illo.rotate.z = userRot.z;
        return;
      }

      const speed = params.speed;

      switch (params.animPreset) {
        case 'Original Harmonic Keyframes': {
          if (speed > 0) {
            const progress = ticker / cycleCount;
            const tween = Zdog.easeInOut(progress % 1, 3);
            const turn = Math.floor(progress % turnLimit);
            const keyA = keyframes[turn];
            const keyB = keyframes[turn + 1];
            const thetaX = Zdog.lerp(keyA.x, keyB.x, tween);
            illo.rotate.x = userRot.x + Math.cos(thetaX) * (TAU / 12);
            illo.rotate.y = userRot.y + Zdog.lerp(keyA.y, keyB.y, tween);
            illo.rotate.z = userRot.z;
            ticker += speed;
          } else {
            illo.rotate.x = userRot.x;
            illo.rotate.y = userRot.y;
            illo.rotate.z = userRot.z;
          }
          break;
        }

        case 'Static (No Movement)': {
          illo.rotate.x = userRot.x;
          illo.rotate.y = userRot.y;
          illo.rotate.z = userRot.z;
          break;
        }

        case 'Gentle Gyro Precession': {
          if (speed > 0) {
            gyroAngleY += 0.006 * speed;
            illo.rotate.x = userRot.x + Math.sin(time * 0.4 * speed) * (TAU / 14);
            illo.rotate.y = userRot.y + gyroAngleY;
            illo.rotate.z = userRot.z + Math.cos(time * 0.3 * speed) * (TAU / 20);
          } else {
            illo.rotate.x = userRot.x;
            illo.rotate.y = userRot.y;
            illo.rotate.z = userRot.z;
          }
          break;
        }

        case 'Petal Breathe & Sway': {
          if (speed > 0) {
            illo.rotate.x = userRot.x + Math.sin(time * 0.5 * speed) * (TAU / 12);
            illo.rotate.y = userRot.y + Math.sin(time * 0.35 * speed) * (TAU / 6);
            illo.rotate.z = userRot.z + Math.cos(time * 0.45 * speed) * (TAU / 16);
          } else {
            illo.rotate.x = userRot.x;
            illo.rotate.y = userRot.y;
            illo.rotate.z = userRot.z;
          }
          break;
        }

        case 'Cosmic Tumble & Drift': {
          if (speed > 0) {
            tumbleAngle += 0.005 * speed;
            illo.rotate.x = userRot.x + Math.sin(time * 0.3 * speed) * (TAU / 6);
            illo.rotate.y = userRot.y + tumbleAngle;
            illo.rotate.z = userRot.z + Math.cos(time * 0.25 * speed) * (TAU / 10);
          } else {
            illo.rotate.x = userRot.x;
            illo.rotate.y = userRot.y;
            illo.rotate.z = userRot.z;
          }
          break;
        }
      }
    }

    // Launch Application
    init();
  </script>
</body>
</html>
