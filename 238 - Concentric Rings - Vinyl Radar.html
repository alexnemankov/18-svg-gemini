<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Concentric Rings - Vinyl / Radar</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f0402;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
    }
    canvas:active {
      cursor: grabbing;
    }
    .lil-gui.autoPlace {
      position: absolute;
      top: 10px;
      bottom: auto;
      right: 10px;
      max-height: calc(100vh - 20px);
      overflow-y: auto;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
      }
    }
  </script>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import GUI from 'lil-gui';

    // =========================================================================================
    // POST PROCESSOR SUITE (Inlined from postprocessing/PostProcessor.js for standalone usage)
    // =========================================================================================
    const orthoVertexShader = `
    precision highp float;
    in vec3 position;
    out vec2 vUv;
    void main() {
      vUv = position.xy * 0.5 + 0.5;
      gl_Position = vec4(position, 1.0);
    }
    `;

    const brightFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float bloomThreshold;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float luminance = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float knee = 0.1;
      float soft = luminance - bloomThreshold + knee;
      soft = clamp(soft, 0.0, 2.0 * knee);
      soft = (soft * soft) / (4.0 * knee + 0.00001);
      float contribution = max(soft, luminance - bloomThreshold);
      contribution /= max(luminance, 0.00001);
      fragColor = vec4(color.rgb * contribution, color.a);
    }
    `;

    const blur13ShaderChunk = `
    vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
      vec2 resolution = vec2(textureSize(image, 0));
      vec4 color = vec4(0.0);
      vec2 off1 = vec2(1.411764705882353) * direction;
      vec2 off2 = vec2(3.2941176470588234) * direction;
      vec2 off3 = vec2(5.176470588235294) * direction;
      color += texture(image, uv) * 0.1964825501511404;
      color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
      color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
      return color;
    }
    `;

    const blurFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 direction;
    in vec2 vUv;
    out vec4 color;
    ${blur13ShaderChunk}
    void main() {
      color = blur13(inputTexture, vUv, direction);
    }
    `;

    const finalFragmentShader = `
    precision highp float;
    uniform vec2 resolution;
    uniform sampler2D inputTexture;
    uniform sampler2D blur0Texture;
    uniform sampler2D blur1Texture;
    uniform sampler2D blur2Texture;
    uniform sampler2D blur3Texture;
    uniform sampler2D blur4Texture;
    uniform bool bloomEnabled;
    uniform float bloomStrength;
    uniform float vignetteBoost;
    uniform float vignetteReduction;
    uniform float noiseIntensity;
    uniform float time;
    in vec2 vUv;
    out vec4 fragColor;

    float vignette(vec2 uv, float boost, float reduction) {
      vec2 position = vUv - 0.5;
      return boost - length(position) * reduction;
    }

    float hash1(uint n) {
      n = (n << 13U) ^ n;
      n = n * (n * n * 15731U + 789221U) + 1376312589U;
      return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
    }

    float noise(in vec2 uv, in float timeVal) {
      uvec2 p = uvec2(uv);
      return hash1(p.x + 1920U * p.y + (1920U * 1080U) * uint(timeVal));
    }

    void main() {
      vec4 color = texture(inputTexture, vUv);

      if (bloomEnabled && bloomStrength > 0.001) {
        vec4 b0 = texture(blur0Texture, vUv);
        vec4 b1 = texture(blur1Texture, vUv);
        vec4 b2 = texture(blur2Texture, vUv);
        vec4 b3 = texture(blur3Texture, vUv);
        vec4 b4 = texture(blur4Texture, vUv);

        vec4 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
        color += bloomSum * bloomStrength;
      }

      color.rgb *= vignette(vUv, vignetteBoost, vignetteReduction);
      color.rgb += noiseIntensity * noise(gl_FragCoord.xy, time);
      fragColor = vec4(color.rgb, 1.0);
    }
    `;

    const chromaticAberrationShaderChunk = `
    vec2 barrelDistortion(vec2 coord, float amt) {
      vec2 cc = coord - 0.5;
      float dist = dot(cc, cc);
      return coord + cc * dist * amt;
    }
    float sat(float t) { return clamp(t, 0.0, 1.0); }
    float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
    float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
    vec4 spectrum_offset(float t) {
      float lo = step(t, 0.5);
      float hi = 1.0 - lo;
      float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
      vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
      return pow(ret, vec4(1.0 / 2.2));
    }
    const float max_distort = 2.2;
    const int num_iter = 8;
    const float reci_num_iter_f = 1.0 / float(num_iter);
    vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
      vec4 sumcol = vec4(0.0);
      vec4 sumw = vec4(0.0);
      for (int i = 0; i < num_iter; ++i) {
        float t = float(i) * reci_num_iter_f;
        vec4 w = spectrum_offset(t);
        sumw += w;
        sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
      }
      return sumcol / sumw;
    }
    `;

    const colorFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float chromaticAberrationAmount;
    uniform float minInputLevel;
    uniform float maxInputLevel;
    uniform float gammaLevel;
    uniform float fisheyeStrength;
    uniform float fisheyeRadius;
    uniform float time;
    in vec2 vUv;
    out vec4 fragColor;

    ${chromaticAberrationShaderChunk}

    vec2 applyFisheye(vec2 uv, float strength, float radius) {
      if (abs(strength) < 0.0001) return uv;
      vec2 p = uv - 0.5;
      float d = length(p);
      if (d > radius * 1.5) return uv;
      float r = d / max(radius, 0.001);
      float theta = atan(p.y, p.x);
      float rDist = r + strength * (r * r * r);
      return 0.5 + vec2(cos(theta), sin(theta)) * (rDist * radius);
    }

    vec3 gammaCorrect(vec3 color, vec3 gamma) {
      return pow(max(color, vec3(0.0)), 1.0 / gamma);
    }
    vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
      return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
    }
    vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
      return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
    }
    void main() {
      vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
      fragColor = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
      fragColor.rgb = finalLevels(fragColor.rgb, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
      fragColor.a = 1.0;
    }
    `;

    const copyFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      fragColor = texture(inputTexture, vUv);
    }
    `;

    function createFBO(w, h, options = {}) {
      return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
        wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
        wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
        minFilter: options.minFilter || THREE.LinearFilter,
        magFilter: options.magFilter || THREE.LinearFilter,
        format: options.format || THREE.RGBAFormat,
        type: options.type || THREE.HalfFloatType,
        stencilBuffer: options.stencilBuffer || false,
        depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : true,
        samples: options.samples || 0,
      });
    }

    class ShaderPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbo = createFBO(1, 1, options);
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
        this.texture = this.fbo.texture;
      }
      render(renderer, toScreen = false) {
        if (!toScreen) {
          renderer.setRenderTarget(this.fbo);
        }
        renderer.render(this.orthoScene, this.orthoCamera);
        if (!toScreen) {
          renderer.setRenderTarget(null);
        }
      }
      setSize(width, height) {
        this.fbo.setSize(Math.max(1, width), Math.max(1, height));
        this.orthoQuad.scale.set(width, height, 1);
      }
    }

    class ShaderPingPongPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
        this.currentFBO = 0;
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
      }
      render(renderer) {
        renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
        renderer.render(this.orthoScene, this.orthoCamera);
        renderer.setRenderTarget(null);
        this.currentFBO = 1 - this.currentFBO;
      }
      get current() { return this.fbos[this.currentFBO]; }
      get texture() { return this.current.texture; }
      setSize(width, height) {
        const w = Math.max(1, width);
        const h = Math.max(1, height);
        this.orthoQuad.scale.set(w, h, 1);
        this.fbos[0].setSize(w, h);
        this.fbos[1].setSize(w, h);
      }
    }

    class BloomPass {
      constructor(strength = 0.8, radius = 0.5, threshold = 0.2, levels = 5) {
        this.strength = strength;
        this.radius = radius;
        this.threshold = threshold;
        this.enabled = true;
        this.levels = levels;

        this.brightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            bloomThreshold: { value: this.threshold },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: brightFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.brightPass = new ShaderPass(this.brightShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.blurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            direction: { value: new THREE.Vector2(0, 1) },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: blurFragmentShader,
          glslVersion: THREE.GLSL3,
        });

        this.blurPasses = [];
        for (let i = 0; i < this.levels; i++) {
          this.blurPasses.push(new ShaderPingPongPass(this.blurShader, {
            format: THREE.RGBAFormat,
            type: THREE.HalfFloatType,
          }));
        }
      }

      setSize(w, h) {
        let tw = Math.max(1, w);
        let th = Math.max(1, h);
        this.brightPass.setSize(tw, th);
        for (let i = 0; i < this.levels; i++) {
          tw = Math.max(1, Math.round(tw / 2));
          th = Math.max(1, Math.round(th / 2));
          this.blurPasses[i].setSize(tw, th);
        }
      }

      set source(texture) {
        this.brightShader.uniforms.inputTexture.value = texture;
      }

      render(renderer) {
        if (!this.enabled || this.strength <= 0.001) return;

        this.brightShader.uniforms.bloomThreshold.value = this.threshold;
        this.brightPass.render(renderer);

        const baseOffset = Math.max(0.1, this.radius * 2.0);
        const u = this.blurShader.uniforms;

        for (let j = 0; j < this.levels; j++) {
          const blurPass = this.blurPasses[j];
          const stepOffset = baseOffset * (1.0 + j * 0.5);

          u.direction.value.set(stepOffset, 0);
          u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
          blurPass.render(renderer);

          u.direction.value.set(0, stepOffset * 0.5);
          u.inputTexture.value = blurPass.current.texture;
          blurPass.render(renderer);
        }
      }
    }

    class PostProcessor {
      constructor(renderer, params = {}) {
        this.renderer = renderer;

        this.settings = {
          enabled: params.enabled !== undefined ? params.enabled : true,
          bloomEnabled: params.bloomEnabled !== undefined ? params.bloomEnabled : true,
          bloomStrength: params.bloomStrength !== undefined ? params.bloomStrength : 1.973789,
          bloomRadius: params.bloomRadius !== undefined ? params.bloomRadius : 0.745481,
          bloomThreshold: params.bloomThreshold !== undefined ? params.bloomThreshold : 0.0,
          fisheyeStrength: params.fisheyeStrength !== undefined ? params.fisheyeStrength : -1.0,
          fisheyeRadius: params.fisheyeRadius !== undefined ? params.fisheyeRadius : 0.85,
          chromaticAberration: params.chromaticAberration !== undefined ? params.chromaticAberration : 0.011052,
          vignetteBoost: params.vignetteBoost !== undefined ? params.vignetteBoost : 1.4,
          vignetteReduction: params.vignetteReduction !== undefined ? params.vignetteReduction : 1.95,
          noiseIntensity: params.noiseIntensity !== undefined ? params.noiseIntensity : 0.05,
          gamma: params.gamma !== undefined ? params.gamma : 1.05,
          minInputLevel: params.minInputLevel !== undefined ? params.minInputLevel : 0.02,
          maxInputLevel: params.maxInputLevel !== undefined ? params.maxInputLevel : 1.0,
        };

        this.sceneTarget = createFBO(1, 1, { type: THREE.HalfFloatType });

        this.bloomPass = new BloomPass(
          this.settings.bloomStrength,
          this.settings.bloomRadius,
          this.settings.bloomThreshold,
          5
        );

        this.finalShader = new THREE.RawShaderMaterial({
          uniforms: {
            resolution: { value: new THREE.Vector2(1, 1) },
            bloomEnabled: { value: this.settings.bloomEnabled },
            bloomStrength: { value: this.settings.bloomStrength },
            vignetteBoost: { value: this.settings.vignetteBoost },
            vignetteReduction: { value: this.settings.vignetteReduction },
            noiseIntensity: { value: this.settings.noiseIntensity },
            inputTexture: { value: null },
            blur0Texture: { value: null },
            blur1Texture: { value: null },
            blur2Texture: { value: null },
            blur3Texture: { value: null },
            blur4Texture: { value: null },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: finalFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.finalPass = new ShaderPass(this.finalShader);

        this.rgbShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: this.finalPass.texture },
            fisheyeStrength: { value: this.settings.fisheyeStrength },
            fisheyeRadius: { value: this.settings.fisheyeRadius },
            chromaticAberrationAmount: { value: this.settings.chromaticAberration },
            minInputLevel: { value: this.settings.minInputLevel },
            maxInputLevel: { value: this.settings.maxInputLevel },
            gammaLevel: { value: this.settings.gamma },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: colorFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.rgbPass = new ShaderPass(this.rgbShader);

        this.copyShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: copyFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.copyPass = new ShaderPass(this.copyShader);
      }

      updateSettings() {
        this.bloomPass.enabled = this.settings.bloomEnabled;
        this.bloomPass.strength = this.settings.bloomStrength;
        this.bloomPass.radius = this.settings.bloomRadius;
        this.bloomPass.threshold = this.settings.bloomThreshold;

        this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
        this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
        this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
        this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
        this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;

        this.rgbShader.uniforms.fisheyeStrength.value = this.settings.fisheyeStrength;
        this.rgbShader.uniforms.fisheyeRadius.value = this.settings.fisheyeRadius;
        this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
        this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
        this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
        this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
      }

      setSize(w0, h0, dpr = 1) {
        const w = Math.max(1, Math.floor(w0 * dpr));
        const h = Math.max(1, Math.floor(h0 * dpr));
        this.sceneTarget.setSize(w, h);
        this.finalPass.setSize(w, h);
        this.finalShader.uniforms.resolution.value.set(w, h);
        this.bloomPass.setSize(w, h);
        this.rgbPass.setSize(w, h);
        this.copyPass.setSize(w, h);
      }

      renderScene(scene, camera) {
        if (!this.settings.enabled) {
          this.renderer.render(scene, camera);
          return;
        }
        this.renderer.setRenderTarget(this.sceneTarget);
        this.renderer.render(scene, camera);
        this.renderer.setRenderTarget(null);
        this.render(this.sceneTarget.texture);
      }

      render(sourceTexture) {
        if (!this.settings.enabled) {
          this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
          this.copyPass.render(this.renderer, true);
          return;
        }

        this.updateSettings();

        this.bloomPass.source = sourceTexture;
        this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
        this.bloomPass.render(this.renderer);

        this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
        this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
        this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
        this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
        this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

        const randomTime = Math.random() * 100000;
        this.finalPass.shader.uniforms.time.value = randomTime;
        this.rgbPass.shader.uniforms.time.value = randomTime;

        this.finalPass.render(this.renderer);
        this.rgbPass.render(this.renderer, true);
      }

      attachGUI(gui, title = "Post-Processing & Fisheye") {
        const root = gui.addFolder(title);
        root.add(this.settings, "enabled").name("Enable Suite").listen().onChange(() => this.updateSettings());

        const bloom = root.addFolder("Bloom");
        bloom.add(this.settings, "bloomEnabled").name("Enable Bloom").listen().onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomStrength", 0, 3.0, 0.05).name("Strength").listen().onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomRadius", 0, 2.0, 0.05).name("Radius").listen().onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomThreshold", 0, 1.0, 0.01).name("Threshold").listen().onChange(() => this.updateSettings());

        const lens = root.addFolder("Lens, Optics & Fisheye");
        lens.add(this.settings, "fisheyeStrength", -1.0, 1.5, 0.01).name("Fisheye Distortion").listen().onChange(() => this.updateSettings());
        lens.add(this.settings, "fisheyeRadius", 0.2, 2.0, 0.05).name("Fisheye Radius").listen().onChange(() => this.updateSettings());
        lens.add(this.settings, "chromaticAberration", 0, 0.2, 0.005).name("Chromatic Aberration").listen().onChange(() => this.updateSettings());
        lens.add(this.settings, "vignetteBoost", 0, 2.0, 0.05).name("Vignette Boost").listen().onChange(() => this.updateSettings());
        lens.add(this.settings, "vignetteReduction", 0, 2.0, 0.05).name("Vignette Falloff").listen().onChange(() => this.updateSettings());
        lens.add(this.settings, "noiseIntensity", 0, 0.1, 0.005).name("Film Grain").listen().onChange(() => this.updateSettings());
        lens.add(this.settings, "gamma", 0.2, 2.0, 0.05).name("Gamma").listen().onChange(() => this.updateSettings());
        lens.add(this.settings, "minInputLevel", 0, 0.5, 0.01).name("Black Level").listen().onChange(() => this.updateSettings());
        lens.add(this.settings, "maxInputLevel", 0.5, 1.0, 0.01).name("White Level").listen().onChange(() => this.updateSettings());

        return root;
      }
    }

    // =========================================================================================
    // COLOR SCHEMES PRESETS
    // =========================================================================================
    const COLOR_SCHEMES = {
      'Cyber Vinyl': {
        colorBg: '#070611',
        colorLine: '#2a1b4e',
        colorSignal: '#00f0ff',
        useColor2: true,
        colorSignal2: '#ff0077',
        useColor3: true,
        colorSignal3: '#ffe600'
      },
      'Tactical Radar': {
        colorBg: '#020d07',
        colorLine: '#0b3820',
        colorSignal: '#00ff66',
        useColor2: true,
        colorSignal2: '#50fa7b',
        useColor3: true,
        colorSignal3: '#00ffee'
      },
      'Obsidian & Gold': {
        colorBg: '#0a0805',
        colorLine: '#3d2f1d',
        colorSignal: '#ffd700',
        useColor2: true,
        colorSignal2: '#ff8800',
        useColor3: true,
        colorSignal3: '#fff4d0'
      },
      'Deep Abyss': {
        colorBg: '#030914',
        colorLine: '#0d2847',
        colorSignal: '#00d4ff',
        useColor2: true,
        colorSignal2: '#7b2cbf',
        useColor3: true,
        colorSignal3: '#00ffa3'
      },
      'Solar Flare': {
        colorBg: '#0f0402',
        colorLine: '#4a150e',
        colorSignal: '#ff3b00',
        useColor2: true,
        colorSignal2: '#ff0055',
        useColor3: true,
        colorSignal3: '#ffcc00'
      },
      'Black & White': {
        colorBg: '#050505',
        colorLine: '#2a2a2a',
        colorSignal: '#ffffff',
        useColor2: true,
        colorSignal2: '#888888',
        useColor3: true,
        colorSignal3: '#dddddd'
      },
      'White & Black': {
        colorBg: '#f5f5f7',
        colorLine: '#222226',
        colorSignal: '#000000',
        useColor2: true,
        colorSignal2: '#333338',
        useColor3: true,
        colorSignal3: '#555560'
      }
    };

    // =========================================================================================
    // APPLICATION PARAMETERS
    // =========================================================================================
    const params = {
      // Color Themes
      colorScheme: 'Solar Flare',
      colorBg: COLOR_SCHEMES['Solar Flare'].colorBg,
      greenScreen: false,
      colorLine: COLOR_SCHEMES['Solar Flare'].colorLine,
      colorSignal: COLOR_SCHEMES['Solar Flare'].colorSignal,
      useColor2: COLOR_SCHEMES['Solar Flare'].useColor2,
      colorSignal2: COLOR_SCHEMES['Solar Flare'].colorSignal2,
      useColor3: COLOR_SCHEMES['Solar Flare'].useColor3,
      colorSignal3: COLOR_SCHEMES['Solar Flare'].colorSignal3,

      // Concentric Geometry
      lineCount: 57,
      innerRadius: 3.214419,
      outerRadius: 66.78262,
      globalRotationSpeed: 0.272281,
      globalRotationAngle: 0.0,
      lineOpacity: 0.32979,

      // Wave Harmonics
      waveHeight: 1.154685,
      waveFreq: 5,
      waveSpeed: 2.228468,
      wavePhase: 0.338797,

      // Signals / Pulses
      signalCount: 81,
      speedGlobal: 1.535764,
      trailLength: 38,
      bidirectional: true,

      // Display & Timing
      dpr: 1,
      animationSpeed: 1,
      clickRandomize: true,

      // Animation Presets
      animationPreset: 'Static Radar (Top-Down)',

      // Camera Coordinates (Cartesian)
      camPosX: -15.4881,
      camPosY: 14.38662,
      camPosZ: -30.1698,
      targetX: 0.0,
      targetY: 0.0,
      targetZ: 0.0,
      fov: 48.0,

      // Camera Coordinates (Spherical Orbit)
      polarAngle: 67.01,
      azimuthAngle: -152.83,
      camDistance: 36.84,

      // Mouse & Drag View Controls
      rotateSpeed: 1.3,
      panSpeed: 1.0,
      zoomSpeed: 1.2,
      dampingFactor: 0.05,
      enableRotate: true,
      enablePan: true,
      enableZoom: true,
      autoRotate: false,
      autoRotateSpeed: 1.5,

      // Actions
      resetCamera: () => {
        resetCameraView();
      },
      randomize: () => {
        randomizeScene();
      }
    };

    const CONSTANTS = {
      segmentCount: 180,
      maxTrail: 150
    };

    // =========================================================================================
    // THREE.JS SETUP
    // =========================================================================================
    const canvas = document.getElementById('canvas');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(params.colorBg);
    scene.fog = new THREE.FogExp2(params.colorBg, 0.0035);

    const camera = new THREE.PerspectiveCamera(params.fov, window.innerWidth / window.innerHeight, 0.1, 2000);
    camera.position.set(params.camPosX, params.camPosY, params.camPosZ);

    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(params.dpr);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = params.dampingFactor;
    controls.rotateSpeed = params.rotateSpeed;
    controls.panSpeed = params.panSpeed;
    controls.zoomSpeed = params.zoomSpeed;
    controls.enableRotate = params.enableRotate;
    controls.enablePan = params.enablePan;
    controls.enableZoom = params.enableZoom;
    controls.autoRotate = params.autoRotate;
    controls.autoRotateSpeed = params.autoRotateSpeed;
    controls.target.set(params.targetX, params.targetY, params.targetZ);

    // Post-Processing Suite
    const postProcessor = new PostProcessor(renderer, {
      enabled: true,
      bloomStrength: 1.973789,
      bloomRadius: 0.745481,
      bloomThreshold: 0.0,
      fisheyeStrength: -1.0,
      fisheyeRadius: 0.85,
      chromaticAberration: 0.011052,
      vignetteBoost: 1.4,
      vignetteReduction: 1.95,
      noiseIntensity: 0.05,
      gamma: 1.05,
      minInputLevel: 0.02,
      maxInputLevel: 1.0
    });
    postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);

    // Shader Uniforms for Camera State
    const shaderUniforms = {
      uCameraPos: { value: new THREE.Vector3() },
      uCameraWorldMatrix: { value: new THREE.Matrix4() },
      uFov: { value: params.fov },
      iTime: { value: 0 }
    };

    const contentGroup = new THREE.Group();
    scene.add(contentGroup);

    // Center Spindle Hub for Vinyl / Radar feel
    const centerGeometry = new THREE.BufferGeometry();
    const centerPositions = new Float32Array(64 * 3);
    for (let i = 0; i < 64; i++) {
      const a = (i / 64) * Math.PI * 2;
      centerPositions[i * 3] = Math.cos(a) * 1.5;
      centerPositions[i * 3 + 1] = 0;
      centerPositions[i * 3 + 2] = Math.sin(a) * 1.5;
    }
    centerGeometry.setAttribute('position', new THREE.BufferAttribute(centerPositions, 3));
    const centerMaterial = new THREE.LineBasicMaterial({
      color: params.colorSignal,
      transparent: true,
      opacity: 0.8
    });
    const centerRing = new THREE.LineLoop(centerGeometry, centerMaterial);
    contentGroup.add(centerRing);

    function setBackgroundColor(value) {
      document.body.style.backgroundColor = value;
      scene.background.set(value);
      scene.fog.color.set(value);
      renderer.setClearColor(value, 1);

      const isLight = !params.greenScreen && (scene.background.r * 0.299 + scene.background.g * 0.587 + scene.background.b * 0.114) > 0.5;
      signalMaterial.blending = isLight ? THREE.NormalBlending : THREE.AdditiveBlending;
      signalMaterial.needsUpdate = true;
      scene.fog.density = isLight ? 0.0002 : 0.0035;

      if (isLight) {
        postProcessor.settings.bloomEnabled = false;
        postProcessor.settings.vignetteBoost = 1.0;
        postProcessor.settings.vignetteReduction = 0.2;
        postProcessor.settings.noiseIntensity = 0.015;
      } else {
        postProcessor.settings.bloomEnabled = true;
        postProcessor.settings.bloomStrength = 1.973789;
        postProcessor.settings.bloomRadius = 0.745481;
        postProcessor.settings.bloomThreshold = 0.0;
        postProcessor.settings.vignetteBoost = 1.4;
        postProcessor.settings.vignetteReduction = 1.95;
        postProcessor.settings.noiseIntensity = 0.05;
      }
      postProcessor.updateSettings();
    }

    function setGreenScreen(enabled) {
      setBackgroundColor(enabled ? '#00ff00' : params.colorBg);
    }

    // =========================================================================================
    // GEOMETRIC PATH & KINEMATICS ENGINE
    // Concentric rings at increasing radii; signals travel around circumference.
    // =========================================================================================
    function getPathPoint(t, ringIndex, time) {
      const normRing = ringIndex / Math.max(1, params.lineCount - 1);
      const radius = params.innerRadius + normRing * (params.outerRadius - params.innerRadius);
      const theta = t * Math.PI * 2.0;

      // Primary travelling harmonic wave
      const wave1 = Math.sin(theta * params.waveFreq + time * params.waveSpeed + ringIndex * params.wavePhase)
                  * params.waveHeight * (0.35 + 0.65 * normRing);

      // Secondary micro-groove ripple
      const wave2 = Math.cos(theta * (params.waveFreq * 0.5) - time * (params.waveSpeed * 0.7) + ringIndex * 0.15)
                  * (params.waveHeight * 0.35);

      const y = wave1 + wave2;
      const x = radius * Math.cos(theta);
      const z = radius * Math.sin(theta);

      return new THREE.Vector3(x, y, z);
    }

    // =========================================================================================
    // RINGS & SIGNALS BUILDERS
    // =========================================================================================
    let backgroundLines = [];
    let signals = [];

    const bgMaterial = new THREE.LineBasicMaterial({
      color: params.colorLine,
      transparent: true,
      opacity: params.lineOpacity,
      depthWrite: false
    });

    const signalMaterial = new THREE.LineBasicMaterial({
      vertexColors: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      depthTest: false,
      transparent: true
    });

    const signalColorObj1 = new THREE.Color(params.colorSignal);
    const signalColorObj2 = new THREE.Color(params.colorSignal2);
    const signalColorObj3 = new THREE.Color(params.colorSignal3);

    function pickSignalColor() {
      const choices = [signalColorObj1];
      if (params.useColor2) choices.push(signalColorObj2);
      if (params.useColor3) choices.push(signalColorObj3);
      return choices[Math.floor(Math.random() * choices.length)];
    }

    function rebuildLines() {
      backgroundLines.forEach((line) => {
        contentGroup.remove(line);
        line.geometry.dispose();
      });
      backgroundLines = [];

      for (let i = 0; i < params.lineCount; i++) {
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(CONSTANTS.segmentCount * 3);
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        const line = new THREE.LineLoop(geometry, bgMaterial);
        line.userData = { id: i };
        line.renderOrder = 0;
        contentGroup.add(line);
        backgroundLines.push(line);
      }

      rebuildSignals();
    }

    function rebuildSignals() {
      signals.forEach((signal) => {
        contentGroup.remove(signal.mesh);
        signal.mesh.geometry.dispose();
      });
      signals = [];

      for (let i = 0; i < params.signalCount; i++) {
        createSignal();
      }
    }

    function createSignal() {
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(CONSTANTS.maxTrail * 3);
      const colors = new Float32Array(CONSTANTS.maxTrail * 3);

      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const mesh = new THREE.Line(geometry, signalMaterial);
      mesh.frustumCulled = false;
      mesh.renderOrder = 1;
      contentGroup.add(mesh);

      const direction = params.bidirectional ? (Math.random() > 0.5 ? 1 : -1) : 1;

      signals.push({
        mesh,
        laneIndex: Math.floor(Math.random() * params.lineCount),
        speed: (0.15 + Math.random() * 0.45) * direction,
        progress: Math.random(),
        history: [],
        assignedColor: pickSignalColor()
      });
    }

    rebuildLines();

    // =========================================================================================
    // COLOR SCHEME APPLIER
    // =========================================================================================
    function applyColorScheme(schemeName) {
      const scheme = COLOR_SCHEMES[schemeName];
      if (!scheme) return;

      params.colorBg = scheme.colorBg;
      params.colorLine = scheme.colorLine;
      params.colorSignal = scheme.colorSignal;
      params.useColor2 = scheme.useColor2;
      params.colorSignal2 = scheme.colorSignal2;
      params.useColor3 = scheme.useColor3;
      params.colorSignal3 = scheme.colorSignal3;

      if (!params.greenScreen) {
        setBackgroundColor(params.colorBg);
      }
      bgMaterial.color.set(params.colorLine);
      signalColorObj1.set(params.colorSignal);
      signalColorObj2.set(params.colorSignal2);
      signalColorObj3.set(params.colorSignal3);
      centerMaterial.color.set(params.colorSignal);

      signals.forEach(s => {
        s.assignedColor = pickSignalColor();
      });

      gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    // =========================================================================================
    // PROCEDURAL RANDOMIZER
    // =========================================================================================
    function randomizeScene() {
      const schemeNames = Object.keys(COLOR_SCHEMES);
      const chosenScheme = schemeNames[Math.floor(Math.random() * schemeNames.length)];
      params.colorScheme = chosenScheme;
      applyColorScheme(chosenScheme);

      params.lineCount = Math.floor(THREE.MathUtils.randFloat(45, 110));
      params.innerRadius = THREE.MathUtils.randFloat(3.0, 16.0);
      params.outerRadius = THREE.MathUtils.randFloat(38.0, 68.0);
      params.globalRotationSpeed = THREE.MathUtils.randFloat(-0.8, 0.8);
      params.lineOpacity = THREE.MathUtils.randFloat(0.3, 0.7);

      params.waveHeight = THREE.MathUtils.randFloat(0.5, 3.2);
      params.waveFreq = Math.floor(THREE.MathUtils.randFloat(2, 9));
      params.waveSpeed = THREE.MathUtils.randFloat(0.8, 3.2);
      params.wavePhase = THREE.MathUtils.randFloat(0.1, 0.6);

      params.signalCount = Math.floor(THREE.MathUtils.randFloat(50, 140));
      params.speedGlobal = THREE.MathUtils.randFloat(0.5, 2.0);
      params.trailLength = Math.floor(THREE.MathUtils.randFloat(15, 45));

      postProcessor.settings.bloomStrength = THREE.MathUtils.randFloat(0.8, 2.2);
      postProcessor.settings.bloomRadius = THREE.MathUtils.randFloat(0.3, 0.8);
      postProcessor.settings.chromaticAberration = THREE.MathUtils.randFloat(0.01, 0.05);
      postProcessor.updateSettings();

      rebuildLines();
      gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    // =========================================================================================
    // CAMERA & ORBIT SYNCHRONIZATION HELPERS
    // =========================================================================================
    function updateCameraFromAngles() {
      const r = params.camDistance;
      const phi = THREE.MathUtils.degToRad(params.polarAngle);
      const theta = THREE.MathUtils.degToRad(params.azimuthAngle);

      camera.position.x = params.targetX + r * Math.sin(phi) * Math.sin(theta);
      camera.position.y = params.targetY + r * Math.cos(phi);
      camera.position.z = params.targetZ + r * Math.sin(phi) * Math.cos(theta);

      camera.lookAt(controls.target);
      controls.update();
      camera.updateMatrixWorld(true);

      params.camPosX = camera.position.x;
      params.camPosY = camera.position.y;
      params.camPosZ = camera.position.z;
    }

    function updateCameraFromPosition() {
      camera.position.set(params.camPosX, params.camPosY, params.camPosZ);
      controls.target.set(params.targetX, params.targetY, params.targetZ);
      camera.lookAt(controls.target);
      controls.update();
      camera.updateMatrixWorld(true);

      const offset = new THREE.Vector3().subVectors(camera.position, controls.target);
      params.camDistance = parseFloat(offset.length().toFixed(2));
      params.polarAngle = parseFloat(THREE.MathUtils.radToDeg(controls.getPolarAngle()).toFixed(2));
      params.azimuthAngle = parseFloat(THREE.MathUtils.radToDeg(controls.getAzimuthalAngle()).toFixed(2));
    }

    function resetCameraView() {
      params.camPosX = -15.4881;
      params.camPosY = 14.38662;
      params.camPosZ = -30.1698;
      params.targetX = 0.0;
      params.targetY = 0.0;
      params.targetZ = 0.0;
      params.fov = 48.0;
      camera.fov = 48.0;
      camera.updateProjectionMatrix();
      updateCameraFromPosition();
    }

    // =========================================================================================
    // LIL-GUI SETUP (Closed by default)
    // =========================================================================================
    const gui = new GUI({ title: 'Vinyl / Radar Settings' });

    // Presets & Themes Folder
    const fPresets = gui.addFolder('Presets & Animations');
    fPresets.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Color Theme').listen().onChange(applyColorScheme);
    fPresets.add(params, 'animationPreset', [
      'Static Radar (Top-Down)',
      'Vinyl Orbit (Turntable 3D)',
      'Tactical Pitch & Sweep',
      'Groove Flyover (Low Angle Glide)',
      'Cosmic Spiral Drift'
    ]).name('Camera Animation').listen().onChange((v) => {
      if (v === 'Static Radar (Top-Down)') {
        resetCameraView();
      }
    });
    fPresets.add(params, 'clickRandomize').name('Click Scene Randomize').listen();
    fPresets.add(params, 'randomize').name('Randomize Scene Now');

    // Colors Folder
    const fColors = gui.addFolder('Colors & Green Screen');
    fColors.addColor(params, 'colorBg').name('Background').listen().onChange((value) => {
      if (!params.greenScreen) setBackgroundColor(value);
    });
    fColors.add(params, 'greenScreen').name('Green Screen #00ff00').listen().onChange(setGreenScreen);
    fColors.addColor(params, 'colorLine').name('Concentric Lines').listen().onChange((value) => {
      bgMaterial.color.set(value);
    });
    fColors.add(params, 'lineOpacity', 0.05, 1.0, 0.01).name('Lines Opacity').listen().onChange((v) => {
      bgMaterial.opacity = v;
    });

    // Signal Colors Folder
    const fSignalColors = gui.addFolder('Signal Pulse Colors');
    fSignalColors.addColor(params, 'colorSignal').name('Main Pulse Color').listen().onChange((v) => {
      signalColorObj1.set(v);
      centerMaterial.color.set(v);
    });
    fSignalColors.add(params, 'useColor2').name('Enable Pulse Color 2').listen();
    fSignalColors.addColor(params, 'colorSignal2').name('Pulse Color 2').listen().onChange((v) => signalColorObj2.set(v));
    fSignalColors.add(params, 'useColor3').name('Enable Pulse Color 3').listen();
    fSignalColors.addColor(params, 'colorSignal3').name('Pulse Color 3').listen().onChange((v) => signalColorObj3.set(v));

    // Concentric Geometry Folder
    const fGeometry = gui.addFolder('Concentric Geometry');
    fGeometry.add(params, 'lineCount', 10, 180, 1).name('Ring Count').listen().onFinishChange(rebuildLines);
    fGeometry.add(params, 'innerRadius', 1.0, 30.0, 0.5).name('Inner Radius').listen();
    fGeometry.add(params, 'outerRadius', 20.0, 100.0, 0.5).name('Outer Radius').listen();
    fGeometry.add(params, 'globalRotationSpeed', -3.0, 3.0, 0.05).name('Groove Spin Speed').listen();

    // Wave Harmonics Folder
    const fWaves = gui.addFolder('Wave Harmonics');
    fWaves.add(params, 'waveHeight', 0.0, 6.0, 0.05).name('Wave Height').listen();
    fWaves.add(params, 'waveFreq', 1.0, 16.0, 0.5).name('Wave Frequency').listen();
    fWaves.add(params, 'waveSpeed', 0.0, 6.0, 0.1).name('Wave Speed').listen();
    fWaves.add(params, 'wavePhase', 0.0, 1.0, 0.01).name('Wave Ring Phase').listen();

    // Signals & Flow Folder
    const fSignals = gui.addFolder('Signal Trajectory & Trails');
    fSignals.add(params, 'signalCount', 0, 250, 1).name('Signal Count').listen().onFinishChange(rebuildSignals);
    fSignals.add(params, 'speedGlobal', 0.05, 4.0, 0.05).name('Signal Speed').listen();
    fSignals.add(params, 'trailLength', 2, CONSTANTS.maxTrail, 1).name('Trail Length').listen();
    fSignals.add(params, 'bidirectional').name('Bidirectional Flow').listen().onChange(rebuildSignals);

    // Performance & Display Folder
    const fPerf = gui.addFolder('Performance & Display');
    fPerf.add(params, 'dpr', 0.5, 3.0, 0.25).name('Pixel Ratio (DPR)').listen().onChange((v) => {
      renderer.setPixelRatio(v);
      renderer.setSize(window.innerWidth, window.innerHeight);
      postProcessor.setSize(window.innerWidth, window.innerHeight, v);
    });
    fPerf.add(params, 'animationSpeed', 0.0, 3.0, 0.05).name('Animation Speed').listen();

    // Camera Placement and Lens Settings Folder
    const fCam = gui.addFolder('Camera Placement and Lens Settings');
    fCam.add(params, 'camPosX', -150.0, 150.0, 0.5).name('Camera Pos X').listen().onChange(updateCameraFromPosition);
    fCam.add(params, 'camPosY', -150.0, 150.0, 0.5).name('Camera Pos Y').listen().onChange(updateCameraFromPosition);
    fCam.add(params, 'camPosZ', -150.0, 150.0, 0.5).name('Camera Pos Z').listen().onChange(updateCameraFromPosition);
    fCam.add(params, 'polarAngle', 1.0, 179.0, 0.5).name('Polar Pitch (°)').listen().onChange(updateCameraFromAngles);
    fCam.add(params, 'azimuthAngle', -180.0, 180.0, 0.5).name('Azimuth Yaw (°)').listen().onChange(updateCameraFromAngles);
    fCam.add(params, 'camDistance', 5.0, 250.0, 1.0).name('Camera Distance').listen().onChange(updateCameraFromAngles);
    fCam.add(params, 'targetX', -50.0, 50.0, 0.5).name('Target LookAt X').listen().onChange(updateCameraFromPosition);
    fCam.add(params, 'targetY', -50.0, 50.0, 0.5).name('Target LookAt Y').listen().onChange(updateCameraFromPosition);
    fCam.add(params, 'targetZ', -50.0, 50.0, 0.5).name('Target LookAt Z').listen().onChange(updateCameraFromPosition);
    fCam.add(params, 'fov', 15.0, 110.0, 1.0).name('Camera FOV').listen().onChange((v) => {
      camera.fov = v;
      camera.updateProjectionMatrix();
      shaderUniforms.uFov.value = v;
    });

    // Mouse & Drag View Interaction Settings
    const fMouse = fCam.addFolder('Mouse & Drag View Controls');
    fMouse.add(params, 'rotateSpeed', 0.1, 3.0, 0.1).name('Rotate Speed').onChange((v) => (controls.rotateSpeed = v));
    fMouse.add(params, 'panSpeed', 0.1, 3.0, 0.1).name('Pan Speed').onChange((v) => (controls.panSpeed = v));
    fMouse.add(params, 'zoomSpeed', 0.1, 3.0, 0.1).name('Zoom Speed').onChange((v) => (controls.zoomSpeed = v));
    fMouse.add(params, 'dampingFactor', 0.01, 0.2, 0.01).name('Damping Inertia').onChange((v) => (controls.dampingFactor = v));
    fMouse.add(params, 'enableRotate').name('Enable Mouse Orbit').onChange((v) => (controls.enableRotate = v));
    fMouse.add(params, 'enablePan').name('Enable Mouse Pan').onChange((v) => (controls.enablePan = v));
    fMouse.add(params, 'enableZoom').name('Enable Wheel Zoom').onChange((v) => (controls.enableZoom = v));
    fMouse.add(params, 'autoRotate').name('Auto-Rotate View').onChange((v) => (controls.autoRotate = v));
    fMouse.add(params, 'autoRotateSpeed', -10.0, 10.0, 0.5).name('Auto-Rotate Speed').onChange((v) => (controls.autoRotateSpeed = v));
    fMouse.add(params, 'resetCamera').name('Reset Camera View');

    // Post-Processing & Fisheye Folder
    postProcessor.attachGUI(gui, 'Post-Processing & Fisheye');

    // GUI closed by default as required
    gui.close();

    // Toggle GUI visibility with 'H' key
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        if (gui._hidden) {
          gui.show();
        } else {
          gui.hide();
        }
      }
    });

    // Click scene to randomize (with drag tolerance check)
    let pointerDownPos = { x: 0, y: 0 };
    let pointerDownTime = 0;

    window.addEventListener('pointerdown', (e) => {
      if (e.target !== canvas) return;
      pointerDownPos = { x: e.clientX, y: e.clientY };
      pointerDownTime = performance.now();
    });

    window.addEventListener('pointerup', (e) => {
      if (e.target !== canvas) return;
      const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
      const duration = performance.now() - pointerDownTime;
      if (dist < 6 && duration < 350) {
        if (params.clickRandomize) {
          randomizeScene();
        }
      }
    });

    // =========================================================================================
    // MAIN ANIMATION LOOP
    // =========================================================================================
    const clock = new THREE.Clock();
    let animTime = 0;

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const scaledDelta = delta * params.animationSpeed;
      animTime += scaledDelta;
      shaderUniforms.iTime.value = animTime;

      // Handle Presetupped Camera Animations
      if (params.animationPreset !== 'Static Radar (Top-Down)') {
        if (params.animationPreset === 'Vinyl Orbit (Turntable 3D)') {
          const orbitR = 80.0;
          const orbitSpeed = 0.22;
          camera.position.x = Math.sin(animTime * orbitSpeed) * orbitR;
          camera.position.z = Math.cos(animTime * orbitSpeed) * orbitR;
          camera.position.y = 46.0 + Math.sin(animTime * orbitSpeed * 0.6) * 12.0;
          controls.target.set(0, 0, 0);
        } else if (params.animationPreset === 'Tactical Pitch & Sweep') {
          const pitchAngle = Math.sin(animTime * 0.28) * 0.35 + 0.95;
          const yawAngle = Math.cos(animTime * 0.22) * 0.75;
          const r = 78.0;
          camera.position.x = r * Math.sin(pitchAngle) * Math.sin(yawAngle);
          camera.position.y = r * Math.cos(pitchAngle);
          camera.position.z = r * Math.sin(pitchAngle) * Math.cos(yawAngle);
          controls.target.set(0, 0, 0);
        } else if (params.animationPreset === 'Groove Flyover (Low Angle Glide)') {
          const flyR = 48.0 + Math.sin(animTime * 0.25) * 14.0;
          const flyAngle = animTime * 0.32;
          camera.position.x = Math.sin(flyAngle) * flyR;
          camera.position.z = Math.cos(flyAngle) * flyR;
          camera.position.y = 15.0 + Math.sin(animTime * 0.45) * 5.0;
          controls.target.set(Math.sin(flyAngle + 0.35) * 18.0, 0, Math.cos(flyAngle + 0.35) * 18.0);
        } else if (params.animationPreset === 'Cosmic Spiral Drift') {
          const spiralR = 68.0 + Math.sin(animTime * 0.2) * 18.0;
          const spiralAngle = animTime * 0.18;
          camera.position.x = Math.sin(spiralAngle) * spiralR;
          camera.position.z = Math.cos(spiralAngle) * spiralR;
          camera.position.y = 38.0 + Math.sin(animTime * 0.35) * 22.0;
          controls.target.set(0, Math.sin(animTime * 0.25) * 4.0, 0);
        }
      }

      // Slow global rotation of the concentric vinyl grooves / radar system
      params.globalRotationAngle += scaledDelta * params.globalRotationSpeed;
      contentGroup.rotation.y = params.globalRotationAngle;

      // Update Concentric Rings Geometry
      backgroundLines.forEach((line) => {
        const positions = line.geometry.attributes.position.array;
        const lineId = line.userData.id;
        for (let j = 0; j < CONSTANTS.segmentCount; j++) {
          const t = j / CONSTANTS.segmentCount;
          const vec = getPathPoint(t, lineId, animTime);
          positions[j * 3] = vec.x;
          positions[j * 3 + 1] = vec.y;
          positions[j * 3 + 2] = vec.z;
        }
        line.geometry.attributes.position.needsUpdate = true;
      });

      // Update Signal Pulses Travelling around Circumference
      signals.forEach((signal) => {
        signal.progress += signal.speed * 0.006 * params.speedGlobal * params.animationSpeed;

        if (signal.progress > 1.0) {
          signal.progress = signal.progress % 1.0;
        } else if (signal.progress < 0.0) {
          signal.progress = (signal.progress % 1.0) + 1.0;
        }

        const headPos = getPathPoint(signal.progress, signal.laneIndex, animTime);
        signal.history.unshift(headPos);

        const currentTrail = Math.min(params.trailLength, CONSTANTS.maxTrail);
        if (signal.history.length > currentTrail + 1) {
          signal.history.length = currentTrail + 1;
        }

        const positions = signal.mesh.geometry.attributes.position.array;
        const colors = signal.mesh.geometry.attributes.color.array;
        const drawCount = Math.max(1, signal.history.length);

        const isLight = !params.greenScreen && (scene.background.r + scene.background.g + scene.background.b) / 3 > 0.5;
        const bgR = isLight ? scene.background.r : 0;
        const bgG = isLight ? scene.background.g : 0;
        const bgB = isLight ? scene.background.b : 0;

        for (let i = 0; i < drawCount; i++) {
          const point = signal.history[i] || headPos;

          positions[i * 3] = point.x;
          positions[i * 3 + 1] = point.y;
          positions[i * 3 + 2] = point.z;

          let alpha = 1.0;
          if (currentTrail > 0) {
            alpha = Math.pow(Math.max(0.0, 1.0 - i / currentTrail), 1.4);
          }

          if (isLight) {
            colors[i * 3] = THREE.MathUtils.lerp(bgR, signal.assignedColor.r, alpha);
            colors[i * 3 + 1] = THREE.MathUtils.lerp(bgG, signal.assignedColor.g, alpha);
            colors[i * 3 + 2] = THREE.MathUtils.lerp(bgB, signal.assignedColor.b, alpha);
          } else {
            colors[i * 3] = signal.assignedColor.r * alpha;
            colors[i * 3 + 1] = signal.assignedColor.g * alpha;
            colors[i * 3 + 2] = signal.assignedColor.b * alpha;
          }
        }

        signal.mesh.geometry.setDrawRange(0, drawCount);
        signal.mesh.geometry.attributes.position.needsUpdate = true;
        signal.mesh.geometry.attributes.color.needsUpdate = true;
      });

      // OrbitControls & Perspective Camera Synchronization
      controls.update();
      camera.updateMatrixWorld(true);

      shaderUniforms.uCameraPos.value.copy(camera.position);
      shaderUniforms.uCameraWorldMatrix.value.copy(camera.matrixWorld);
      shaderUniforms.uFov.value = camera.fov;

      // Keep GUI sliders synchronized with real-time camera state
      const offset = new THREE.Vector3().subVectors(camera.position, controls.target);
      params.camDistance = parseFloat(offset.length().toFixed(2));
      params.polarAngle = parseFloat(THREE.MathUtils.radToDeg(controls.getPolarAngle()).toFixed(2));
      params.azimuthAngle = parseFloat(THREE.MathUtils.radToDeg(controls.getAzimuthalAngle()).toFixed(2));

      params.camPosX = camera.position.x;
      params.camPosY = camera.position.y;
      params.camPosZ = camera.position.z;
      params.targetX = controls.target.x;
      params.targetY = controls.target.y;
      params.targetZ = controls.target.z;
      params.fov = camera.fov;

      // Render Scene via PostProcessor or Direct WebGLRenderer
      if (postProcessor.settings.enabled) {
        postProcessor.renderScene(scene, camera);
      } else {
        renderer.render(scene, camera);
      }
    }

    // Window Resize Handling
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);
    });

    // Initialize Background & Optics
    setBackgroundColor(params.colorBg);

    // Start Animation Loop
    animate();
  </script>
</body>
</html>
