<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Glass Infographic Pie Chart - Abstract Financial Visualization</title>

  <!-- Import Map for Three.js, OrbitControls, and lil-gui -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
      }
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030712;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      cursor: grab;
    }
    #canvas-container:active {
      cursor: grabbing;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import GUI from 'lil-gui';

    // =========================================================================
    // POST PROCESSOR SUITE (Inlined from postprocessing/PostProcessor.js)
    // =========================================================================
    const orthoVertexShader = `
    precision highp float;
    in vec3 position;
    out vec2 vUv;
    void main() {
      vUv = position.xy * 0.5 + 0.5;
      gl_Position = vec4(position, 1.0);
    }
    `;

    const brightFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float bloomThreshold;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      vec4 color = texture(inputTexture, vUv);
      float luminance = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float knee = 0.1;
      float soft = luminance - bloomThreshold + knee;
      soft = clamp(soft, 0.0, 2.0 * knee);
      soft = (soft * soft) / (4.0 * knee + 0.00001);
      float contribution = max(soft, luminance - bloomThreshold);
      contribution /= max(luminance, 0.00001);
      fragColor = vec4(color.rgb * contribution, color.a);
    }
    `;

    const blur13ShaderChunk = `
    vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
      vec2 resolution = vec2(textureSize(image, 0));
      vec4 color = vec4(0.0);
      vec2 off1 = vec2(1.411764705882353) * direction;
      vec2 off2 = vec2(3.2941176470588234) * direction;
      vec2 off3 = vec2(5.176470588235294) * direction;
      color += texture(image, uv) * 0.1964825501511404;
      color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
      color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
      return color;
    }
    `;

    const blurFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 direction;
    in vec2 vUv;
    out vec4 color;
    ${blur13ShaderChunk}
    void main() {
      color = blur13(inputTexture, vUv, direction);
    }
    `;

    const godRaysDepthMaskShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float threshold;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      vec4 color = texture(inputTexture, vUv);
      float lum = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float factor = smoothstep(threshold, threshold + 0.15, lum);
      fragColor = vec4(vec3(factor), 1.0);
    }
    `;

    const godRaysGenerateShader = `
    precision highp float;
    #define TAPS_PER_PASS 6.0
    uniform sampler2D inputTexture;
    uniform vec3 vSunPositionScreenSpace;
    uniform float fStepSize;
    uniform float distanceAttenuation;
    uniform float maxDensity;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      vec2 delta = vSunPositionScreenSpace.xy - vUv;
      float dist = length(delta);
      vec2 stepv = fStepSize * delta / max(dist, 0.0001);
      float iters = dist / max(fStepSize, 0.00001);
      vec2 uv = vUv;
      float col = 0.0;
      float f = min(1.0, max(vSunPositionScreenSpace.z, 0.0));
      float atten = 1.0 / (1.0 + pow(dist, distanceAttenuation));
      if (0.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (1.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (2.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (3.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (4.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (5.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      float finalVal = min(col / TAPS_PER_PASS * atten, maxDensity);
      fragColor = vec4(vec3(finalVal), 1.0);
    }
    `;

    const anamorphicBrightShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float threshold;
    uniform float smoothWidth;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      vec4 color = texture(inputTexture, vUv);
      float v = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float alpha = smoothstep(threshold, threshold + smoothWidth, v);
      fragColor = mix(vec4(0.0), color, alpha);
    }
    `;

    const anamorphicBlurShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 resolution;
    uniform float samples;
    uniform float intensity;
    uniform vec3 tintColor;
    uniform float bloomRadius;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      int halfSamples = max(1, int(samples) / 2);
      float fHalfSamples = float(halfSamples);
      vec2 invSize = 1.0 / resolution;
      vec4 total = vec4(0.0);
      for (int i = -64; i <= 64; i++) {
        if (i < -halfSamples || i > halfSamples) continue;
        float softness = 1.0 - abs(float(i)) / fHalfSamples;
        softness = pow(softness, 2.0);
        vec2 shiftedUV = vec2(vUv.x + invSize.x * float(i) * (4.0 + bloomRadius * 8.0), vUv.y);
        shiftedUV = clamp(shiftedUV, 0.001, 0.999);
        total += texture(inputTexture, shiftedUV) * softness;
      }
      fragColor = (total / (samples / 3.0)) * vec4(tintColor, 1.0) * intensity;
    }
    `;

    const finalFragmentShader = `
    precision highp float;
    uniform vec2 resolution;
    uniform sampler2D inputTexture;
    uniform sampler2D blur0Texture;
    uniform sampler2D blur1Texture;
    uniform sampler2D blur2Texture;
    uniform sampler2D blur3Texture;
    uniform sampler2D blur4Texture;
    uniform sampler2D raysTexture;
    uniform sampler2D anamorphicTexture;
    uniform bool bloomEnabled;
    uniform float bloomStrength;
    uniform bool raysEnabled;
    uniform float raysStrength;
    uniform vec3 raysColor;
    uniform bool anamorphicEnabled;
    uniform float vignetteBoost;
    uniform float vignetteReduction;
    uniform float noiseIntensity;
    uniform float time;
    in vec2 vUv;
    out vec4 fragColor;

    float vignette(vec2 uv, float boost, float reduction) {
      vec2 position = vUv - 0.5;
      return boost - length(position) * reduction;
    }
    float hash1(uint n) {
      n = (n << 13U) ^ n;
      n = n * (n * n * 15731U + 789221U) + 1376312589U;
      return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
    }
    float noise(in vec2 uv, in float timeVal) {
      uvec2 p = uvec2(uv);
      return hash1(p.x + 1920U * p.y + (1920U * 1080U) * uint(timeVal));
    }

    void main() {
      vec4 color = texture(inputTexture, vUv);
      if (bloomEnabled && bloomStrength > 0.001) {
        vec4 b0 = texture(blur0Texture, vUv);
        vec4 b1 = texture(blur1Texture, vUv);
        vec4 b2 = texture(blur2Texture, vUv);
        vec4 b3 = texture(blur3Texture, vUv);
        vec4 b4 = texture(blur4Texture, vUv);
        vec4 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
        color += bloomSum * bloomStrength;
      }
      if (raysEnabled && raysStrength > 0.001) {
        vec4 r = texture(raysTexture, vUv);
        color.rgb += r.rgb * raysColor * raysStrength;
      }
      if (anamorphicEnabled) {
        vec4 a = texture(anamorphicTexture, vUv);
        color.rgb += a.rgb;
      }
      color.rgb *= vignette(vUv, vignetteBoost, vignetteReduction);
      color.rgb += noiseIntensity * noise(gl_FragCoord.xy, time);
      fragColor = vec4(color.rgb, 1.0);
    }
    `;

    const chromaticAberrationShaderChunk = `
    vec2 barrelDistortion(vec2 coord, float amt) {
      vec2 cc = coord - 0.5;
      float dist = dot(cc, cc);
      return coord + cc * dist * amt;
    }
    float sat(float t) { return clamp(t, 0.0, 1.0); }
    float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
    float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
    vec4 spectrum_offset(float t) {
      float lo = step(t, 0.5);
      float hi = 1.0 - lo;
      float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
      vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
      return pow(ret, vec4(1.0 / 2.2));
    }
    const float max_distort = 2.2;
    const int num_iter = 8;
    const float reci_num_iter_f = 1.0 / float(num_iter);
    vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
      vec4 sumcol = vec4(0.0);
      vec4 sumw = vec4(0.0);
      for (int i = 0; i < num_iter; ++i) {
        float t = float(i) * reci_num_iter_f;
        vec4 w = spectrum_offset(t);
        sumw += w;
        sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
      }
      return sumcol / sumw;
    }
    `;

    const colorFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float chromaticAberrationAmount;
    uniform float minInputLevel;
    uniform float maxInputLevel;
    uniform float gammaLevel;
    uniform float exposure;
    uniform float fisheyeStrength;
    uniform float fisheyeRadius;
    uniform float time;
    uniform int visionMode;
    uniform float thermalSensitivity;
    uniform float nightVisionNoise;
    uniform float nightVisionGain;
    uniform float crtIntensity;
    in vec2 vUv;
    out vec4 fragColor;

    ${chromaticAberrationShaderChunk}

    vec2 applyFisheye(vec2 uv, float strength, float radius) {
      if (abs(strength) < 0.0001) return uv;
      vec2 p = uv - 0.5;
      float d = length(p);
      if (d > radius * 1.5) return uv;
      float r = d / max(radius, 0.001);
      float theta = atan(p.y, p.x);
      float rDist = r + strength * (r * r * r);
      return 0.5 + vec2(cos(theta), sin(theta)) * (rDist * radius);
    }
    vec3 ACESFilmicToneMapping(vec3 color) {
      float a = 2.51;
      float b = 0.03;
      float c = 2.43;
      float d = 0.59;
      float e = 0.14;
      return clamp((color * (a * color + b)) / (color * (c * color + d) + e), 0.0, 1.0);
    }
    vec3 gammaCorrect(vec3 color, vec3 gamma) {
      return pow(max(color, vec3(0.0)), 1.0 / gamma);
    }
    vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
      return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
    }
    vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
      return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
    }

    void main() {
      vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
      vec4 col = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
      vec3 finalCol = col.rgb;
      vec3 exposedColor = finalCol * exposure;
      vec3 toneMappedColor = ACESFilmicToneMapping(exposedColor);
      finalCol = finalLevels(toneMappedColor, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
      fragColor = vec4(finalCol, 1.0);
    }
    `;

    const copyFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      fragColor = texture(inputTexture, vUv);
    }
    `;

    function createFBO(w, h, options = {}) {
      return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
        wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
        wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
        minFilter: options.minFilter || THREE.LinearFilter,
        magFilter: options.magFilter || THREE.LinearFilter,
        format: options.format || THREE.RGBAFormat,
        type: options.type || THREE.HalfFloatType,
        stencilBuffer: options.stencilBuffer || false,
        depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : true,
        samples: options.samples || 0,
      });
    }

    class ShaderPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbo = createFBO(1, 1, options);
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
        this.texture = this.fbo.texture;
      }
      render(renderer, toScreen = false) {
        if (!toScreen) renderer.setRenderTarget(this.fbo);
        renderer.render(this.orthoScene, this.orthoCamera);
        if (!toScreen) renderer.setRenderTarget(null);
      }
      setSize(width, height) {
        this.fbo.setSize(Math.max(1, width), Math.max(1, height));
        this.orthoQuad.scale.set(width, height, 1);
      }
    }

    class ShaderPingPongPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
        this.currentFBO = 0;
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
      }
      render(renderer) {
        renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
        renderer.render(this.orthoScene, this.orthoCamera);
        renderer.setRenderTarget(null);
        this.currentFBO = 1 - this.currentFBO;
      }
      get current() { return this.fbos[this.currentFBO]; }
      get texture() { return this.current.texture; }
      setSize(width, height) {
        const w = Math.max(1, width);
        const h = Math.max(1, height);
        this.orthoQuad.scale.set(w, h, 1);
        this.fbos[0].setSize(w, h);
        this.fbos[1].setSize(w, h);
      }
    }

    class BloomPass {
      constructor(strength = 0.8, radius = 0.5, threshold = 0.2, levels = 5) {
        this.strength = strength;
        this.radius = radius;
        this.threshold = threshold;
        this.enabled = true;
        this.levels = levels;

        this.brightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            bloomThreshold: { value: this.threshold },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: brightFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.brightPass = new ShaderPass(this.brightShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.blurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            direction: { value: new THREE.Vector2(0, 1) },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: blurFragmentShader,
          glslVersion: THREE.GLSL3,
        });

        this.blurPasses = [];
        for (let i = 0; i < this.levels; i++) {
          this.blurPasses.push(new ShaderPingPongPass(this.blurShader, {
            format: THREE.RGBAFormat,
            type: THREE.HalfFloatType,
          }));
        }
      }

      setSize(w, h) {
        let tw = Math.max(1, w);
        let th = Math.max(1, h);
        this.brightPass.setSize(tw, th);
        for (let i = 0; i < this.levels; i++) {
          tw = Math.max(1, Math.round(tw / 2));
          th = Math.max(1, Math.round(th / 2));
          this.blurPasses[i].setSize(tw, th);
        }
      }

      set source(texture) {
        this.brightShader.uniforms.inputTexture.value = texture;
      }

      render(renderer) {
        if (!this.enabled || this.strength <= 0.001) return;
        this.brightShader.uniforms.bloomThreshold.value = this.threshold;
        this.brightPass.render(renderer);

        const baseOffset = Math.max(0.1, this.radius * 2.0);
        const u = this.blurShader.uniforms;
        for (let j = 0; j < this.levels; j++) {
          const blurPass = this.blurPasses[j];
          const stepOffset = baseOffset * (1.0 + j * 0.5);

          u.direction.value.set(stepOffset, 0);
          u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
          blurPass.render(renderer);

          u.direction.value.set(0, stepOffset * 0.5);
          u.inputTexture.value = blurPass.current.texture;
          blurPass.render(renderer);
        }
      }
    }

    class PostProcessor {
      constructor(renderer, params = {}) {
        this.renderer = renderer;
        this.settings = {
          enabled: params.enabled !== undefined ? params.enabled : true,
          antialias: params.antialias !== undefined ? params.antialias : true,
          bloomEnabled: params.bloomEnabled !== undefined ? params.bloomEnabled : true,
          bloomStrength: params.bloomStrength !== undefined ? params.bloomStrength : 1.0,
          bloomRadius: params.bloomRadius !== undefined ? params.bloomRadius : 0.6,
          bloomThreshold: params.bloomThreshold !== undefined ? params.bloomThreshold : 0.2,

          raysEnabled: params.raysEnabled !== undefined ? params.raysEnabled : false,
          raysStrength: params.raysStrength !== undefined ? params.raysStrength : 0.7,
          raysDensity: params.raysDensity !== undefined ? params.raysDensity : 1.0,
          raysMaxDensity: params.raysMaxDensity !== undefined ? params.raysMaxDensity : 0.5,
          raysDistanceAttenuation: params.raysDistanceAttenuation !== undefined ? params.raysDistanceAttenuation : 2.0,
          raysThreshold: params.raysThreshold !== undefined ? params.raysThreshold : 0.15,
          raysColor: params.raysColor ? (params.raysColor.isColor ? params.raysColor.clone() : new THREE.Color(params.raysColor)) : new THREE.Color(0x38bdf8),
          raysColorHex: params.raysColorHex || '#38bdf8',

          anamorphicEnabled: params.anamorphicEnabled !== undefined ? params.anamorphicEnabled : false, // Default is OFF!
          anamorphicIntensity: params.anamorphicIntensity !== undefined ? params.anamorphicIntensity : 4.0,
          anamorphicThreshold: params.anamorphicThreshold !== undefined ? params.anamorphicThreshold : 0.35,
          anamorphicSamples: params.anamorphicSamples !== undefined ? params.anamorphicSamples : 64,
          anamorphicRadius: params.anamorphicRadius !== undefined ? params.anamorphicRadius : 0.0,
          anamorphicSmoothWidth: params.anamorphicSmoothWidth !== undefined ? params.anamorphicSmoothWidth : 0.05,
          anamorphicColor: params.anamorphicColor ? (params.anamorphicColor.isColor ? params.anamorphicColor.clone() : new THREE.Color(params.anamorphicColor)) : new THREE.Color(0x60a5fa),
          anamorphicColorHex: params.anamorphicColorHex || '#60a5fa',

          fisheyeStrength: params.fisheyeStrength !== undefined ? params.fisheyeStrength : 0.0,
          fisheyeRadius: params.fisheyeRadius !== undefined ? params.fisheyeRadius : 1.0,
          chromaticAberration: params.chromaticAberration !== undefined ? params.chromaticAberration : 0.008,
          vignetteBoost: params.vignetteBoost !== undefined ? params.vignetteBoost : 1.08,
          vignetteReduction: params.vignetteReduction !== undefined ? params.vignetteReduction : 0.65,
          noiseIntensity: params.noiseIntensity !== undefined ? params.noiseIntensity : 0.012,

          gamma: params.gamma !== undefined ? params.gamma : 1.0,
          minInputLevel: params.minInputLevel !== undefined ? params.minInputLevel : 0.0,
          maxInputLevel: params.maxInputLevel !== undefined ? params.maxInputLevel : 1.0,
          exposure: params.exposure !== undefined ? params.exposure : 1.0,
        };

        const maxSamples = (this.renderer && this.renderer.capabilities) ? (this.renderer.capabilities.maxSamples || 4) : 4;
        const targetSamples = this.settings.antialias ? Math.min(4, maxSamples) : 0;
        this.sceneTarget = createFBO(1, 1, { type: THREE.HalfFloatType, samples: targetSamples });

        this.bloomPass = new BloomPass(
          this.settings.bloomStrength,
          this.settings.bloomRadius,
          this.settings.bloomThreshold,
          5
        );

        this.moonScreenPos = new THREE.Vector3(0.5, 0.5, 1.0);
        this.moonInFront = true;

        this.godRaysMaskShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            threshold: { value: this.settings.raysThreshold },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: godRaysDepthMaskShader,
          glslVersion: THREE.GLSL3,
        });
        this.godRaysMaskPass = new ShaderPass(this.godRaysMaskShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.godRaysGenShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            vSunPositionScreenSpace: { value: this.moonScreenPos },
            fStepSize: { value: 1.0 },
            distanceAttenuation: { value: this.settings.raysDistanceAttenuation },
            maxDensity: { value: this.settings.raysMaxDensity },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: godRaysGenerateShader,
          glslVersion: THREE.GLSL3,
        });
        this.godRaysPingPong = new ShaderPingPongPass(this.godRaysGenShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.anamorphicBrightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            threshold: { value: this.settings.anamorphicThreshold },
            smoothWidth: { value: this.settings.anamorphicSmoothWidth },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: anamorphicBrightShader,
          glslVersion: THREE.GLSL3,
        });
        this.anamorphicBrightPass = new ShaderPass(this.anamorphicBrightShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.anamorphicBlurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            resolution: { value: new THREE.Vector2(1, 1) },
            samples: { value: this.settings.anamorphicSamples },
            intensity: { value: this.settings.anamorphicIntensity },
            tintColor: { value: this.settings.anamorphicColor },
            bloomRadius: { value: this.settings.anamorphicRadius },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: anamorphicBlurShader,
          glslVersion: THREE.GLSL3,
        });
        this.anamorphicBlurPass = new ShaderPass(this.anamorphicBlurShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.finalShader = new THREE.RawShaderMaterial({
          uniforms: {
            resolution: { value: new THREE.Vector2(1, 1) },
            bloomEnabled: { value: this.settings.bloomEnabled },
            bloomStrength: { value: this.settings.bloomStrength },
            raysEnabled: { value: this.settings.raysEnabled },
            raysStrength: { value: this.settings.raysStrength },
            raysColor: { value: this.settings.raysColor },
            anamorphicEnabled: { value: this.settings.anamorphicEnabled },
            vignetteBoost: { value: this.settings.vignetteBoost },
            vignetteReduction: { value: this.settings.vignetteReduction },
            noiseIntensity: { value: this.settings.noiseIntensity },
            inputTexture: { value: null },
            blur0Texture: { value: null },
            blur1Texture: { value: null },
            blur2Texture: { value: null },
            blur3Texture: { value: null },
            blur4Texture: { value: null },
            raysTexture: { value: null },
            anamorphicTexture: { value: null },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: finalFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.finalPass = new ShaderPass(this.finalShader);

        this.rgbShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: this.finalPass.texture },
            fisheyeStrength: { value: this.settings.fisheyeStrength },
            fisheyeRadius: { value: this.settings.fisheyeRadius },
            chromaticAberrationAmount: { value: this.settings.chromaticAberration },
            minInputLevel: { value: this.settings.minInputLevel },
            maxInputLevel: { value: this.settings.maxInputLevel },
            gammaLevel: { value: this.settings.gamma },
            exposure: { value: this.settings.exposure },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: colorFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.rgbPass = new ShaderPass(this.rgbShader);

        this.copyShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: copyFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.copyPass = new ShaderPass(this.copyShader);
      }

      updateSettings() {
        this.bloomPass.enabled = this.settings.bloomEnabled;
        this.bloomPass.strength = this.settings.bloomStrength;
        this.bloomPass.radius = this.settings.bloomRadius;
        this.bloomPass.threshold = this.settings.bloomThreshold;

        this.godRaysMaskShader.uniforms.threshold.value = this.settings.raysThreshold;
        this.godRaysGenShader.uniforms.distanceAttenuation.value = this.settings.raysDistanceAttenuation;
        this.godRaysGenShader.uniforms.maxDensity.value = this.settings.raysMaxDensity;

        this.anamorphicBrightShader.uniforms.threshold.value = this.settings.anamorphicThreshold;
        this.anamorphicBrightShader.uniforms.smoothWidth.value = this.settings.anamorphicSmoothWidth;
        this.anamorphicBlurShader.uniforms.samples.value = this.settings.anamorphicSamples;
        this.anamorphicBlurShader.uniforms.intensity.value = this.settings.anamorphicIntensity;
        this.anamorphicBlurShader.uniforms.tintColor.value.copy(this.settings.anamorphicColor);
        this.anamorphicBlurShader.uniforms.bloomRadius.value = this.settings.anamorphicRadius;

        this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
        this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
        this.finalShader.uniforms.raysEnabled.value = this.settings.raysEnabled;
        this.finalShader.uniforms.raysStrength.value = this.settings.raysStrength;
        this.finalShader.uniforms.raysColor.value.copy(this.settings.raysColor);
        this.finalShader.uniforms.anamorphicEnabled.value = this.settings.anamorphicEnabled;
        this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
        this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
        this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;

        this.rgbShader.uniforms.fisheyeStrength.value = this.settings.fisheyeStrength;
        this.rgbShader.uniforms.fisheyeRadius.value = this.settings.fisheyeRadius;
        this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
        this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
        this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
        this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
        this.rgbShader.uniforms.exposure.value = this.settings.exposure;
      }

      setSize(w0, h0, dpr = 1) {
        const w = Math.max(1, Math.floor(w0 * dpr));
        const h = Math.max(1, Math.floor(h0 * dpr));
        this.sceneTarget.setSize(w, h);
        this.finalPass.setSize(w, h);
        this.finalShader.uniforms.resolution.value.set(w, h);
        this.bloomPass.setSize(w, h);

        const grW = Math.max(1, Math.round(w / 2));
        const grH = Math.max(1, Math.round(h / 2));
        this.godRaysMaskPass.setSize(grW, grH);
        this.godRaysPingPong.setSize(grW, grH);

        const anW = Math.max(1, Math.round(w / 4));
        const anH = Math.max(1, Math.round(h / 4));
        this.anamorphicBrightPass.setSize(anW, anH);
        this.anamorphicBlurPass.setSize(anW, anH);
        this.anamorphicBlurShader.uniforms.resolution.value.set(anW, anH);

        this.rgbPass.setSize(w, h);
        this.copyPass.setSize(w, h);
      }

      setAntialias(enabled) {
        this.settings.antialias = !!enabled;
        const maxSamples = (this.renderer && this.renderer.capabilities) ? (this.renderer.capabilities.maxSamples || 4) : 4;
        const samples = this.settings.antialias ? Math.min(4, maxSamples) : 0;
        if (this.sceneTarget.samples !== samples) {
          const oldTarget = this.sceneTarget;
          this.sceneTarget = createFBO(oldTarget.width, oldTarget.height, {
            type: THREE.HalfFloatType,
            samples: samples,
          });
          oldTarget.dispose();
        }
      }

      renderScene(scene, camera) {
        if (!this.settings.enabled) {
          this.renderer.setRenderTarget(this.sceneTarget);
          this.renderer.render(scene, camera);
          this.renderer.setRenderTarget(null);
          this.copyPass.shader.uniforms.inputTexture.value = this.sceneTarget.texture;
          this.copyPass.render(this.renderer, true);
          return;
        }
        this.renderer.setRenderTarget(this.sceneTarget);
        this.renderer.render(scene, camera);
        this.renderer.setRenderTarget(null);
        this.render(this.sceneTarget.texture);
      }

      render(sourceTexture) {
        if (!this.settings.enabled) {
          this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
          this.copyPass.render(this.renderer, true);
          return;
        }

        this.updateSettings();

        // 1. Atmospheric Bloom
        this.bloomPass.source = sourceTexture;
        this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
        this.bloomPass.render(this.renderer);

        this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
        this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
        this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
        this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
        this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

        // 2. Godrays
        if (this.settings.raysEnabled && this.settings.raysStrength > 0.001) {
          this.godRaysMaskShader.uniforms.inputTexture.value = sourceTexture;
          this.godRaysMaskShader.uniforms.threshold.value = this.settings.raysThreshold;
          this.godRaysMaskPass.render(this.renderer);

          const filterLen = this.settings.raysDensity;
          const tapsPerPass = 6.0;

          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -1.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysMaskPass.texture;
          this.godRaysPingPong.render(this.renderer);

          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -2.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysPingPong.texture;
          this.godRaysPingPong.render(this.renderer);

          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -3.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysPingPong.texture;
          this.godRaysPingPong.render(this.renderer);

          this.finalPass.shader.uniforms.raysTexture.value = this.godRaysPingPong.texture;
          this.finalPass.shader.uniforms.raysEnabled.value = true;
        } else {
          this.finalPass.shader.uniforms.raysEnabled.value = false;
        }

        // 3. Anamorphic Flare
        if (this.settings.anamorphicEnabled && this.settings.anamorphicIntensity > 0.001) {
          this.anamorphicBrightShader.uniforms.inputTexture.value = sourceTexture;
          this.anamorphicBrightShader.uniforms.threshold.value = this.settings.anamorphicThreshold;
          this.anamorphicBrightShader.uniforms.smoothWidth.value = this.settings.anamorphicSmoothWidth;
          this.anamorphicBrightPass.render(this.renderer);

          this.anamorphicBlurShader.uniforms.inputTexture.value = this.anamorphicBrightPass.texture;
          this.anamorphicBlurShader.uniforms.samples.value = this.settings.anamorphicSamples;
          this.anamorphicBlurShader.uniforms.intensity.value = this.settings.anamorphicIntensity;
          this.anamorphicBlurShader.uniforms.tintColor.value.copy(this.settings.anamorphicColor);
          this.anamorphicBlurShader.uniforms.bloomRadius.value = this.settings.anamorphicRadius;
          this.anamorphicBlurPass.render(this.renderer);

          this.finalPass.shader.uniforms.anamorphicTexture.value = this.anamorphicBlurPass.texture;
          this.finalPass.shader.uniforms.anamorphicEnabled.value = true;
        } else {
          this.finalPass.shader.uniforms.anamorphicEnabled.value = false;
        }

        const randomTime = Math.random() * 100000;
        this.finalPass.shader.uniforms.time.value = randomTime;
        this.rgbPass.shader.uniforms.time.value = randomTime;

        this.finalPass.render(this.renderer);
        this.rgbPass.render(this.renderer, true);
      }

      attachGUI(gui, title = "Post-Processing (PostProcessor.js)") {
        const root = gui.addFolder(title);
        root.add(this.settings, "enabled").name("Enable Post-Process");
        root.add(this.settings, "antialias").name("MSAA Antialias").onChange((v) => this.setAntialias(v));

        // Bloom
        const bloom = root.addFolder("Atmospheric Bloom");
        bloom.add(this.settings, "bloomEnabled").name("Enable Bloom").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomStrength", 0, 3.0, 0.05).name("Strength").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomRadius", 0, 2.0, 0.05).name("Radius").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomThreshold", 0, 1.0, 0.01).name("Threshold").onChange(() => this.updateSettings());

        // Three.js Anamorphic Flare
        const anamorphic = root.addFolder("Anamorphic Streak Flare");
        anamorphic.add(this.settings, "anamorphicEnabled").name("Enable Anamorphic").onChange(() => this.updateSettings());
        anamorphic.add(this.settings, "anamorphicIntensity", 0, 10.0, 0.1).name("Intensity").onChange(() => this.updateSettings());
        anamorphic.add(this.settings, "anamorphicThreshold", 0.0, 0.9, 0.01).name("Threshold").onChange(() => this.updateSettings());
        anamorphic.add(this.settings, "anamorphicSamples", 2, 128, 1).name("Samples").onChange(() => this.updateSettings());
        anamorphic.add(this.settings, "anamorphicRadius", 0.0, 1.0, 0.01).name("Radius").onChange(() => this.updateSettings());
        anamorphic.addColor(this.settings, "anamorphicColorHex").name("Tint Color").onChange((v) => {
          this.settings.anamorphicColor.set(v);
          this.updateSettings();
        });

        // Lens & Film Grain
        const lens = root.addFolder("Optics & Tone");
        lens.add(this.settings, "chromaticAberration", 0, 0.1, 0.002).name("Chromatic Aberration").onChange(() => this.updateSettings());
        lens.add(this.settings, "vignetteBoost", 0, 2.0, 0.05).name("Vignette Boost").onChange(() => this.updateSettings());
        lens.add(this.settings, "vignetteReduction", 0, 2.0, 0.05).name("Vignette Falloff").onChange(() => this.updateSettings());
        lens.add(this.settings, "noiseIntensity", 0, 0.08, 0.002).name("Film Grain").onChange(() => this.updateSettings());
        lens.add(this.settings, "gamma", 0.2, 2.0, 0.05).name("Gamma").onChange(() => this.updateSettings());
        lens.add(this.settings, "exposure", 0.1, 3.0, 0.05).name("Post Exposure").onChange(() => this.updateSettings());

        return root;
      }

      glassTransmission: 0.94,
      glassThickness: 2.2,
      glassIor: 1.52,
      glassDispersion: 0.04,
      glassOpacity: 1.0,

      // Illumination & Exposure
      exposure: 1.1,
      ambientIntensity: 0.7,
      ambientColor: '#1e293b',
      keyIntensity: 2.8,
      keyColor: '#60a5fa',
      keyPosX: 8,
      keyPosY: 14,
      keyPosZ: 10,
      fillIntensity: 1.6,
      fillColor: '#38bdf8',
      fillPosX: -10,
      fillPosY: -6,
      fillPosZ: -8,
      rimIntensity: 2.2,
      rimColor: '#c084fc',
      coreGlowIntensity: 3.4,
      coreGlowColor: '#00f0ff',
      internalSubglowIntensity: 1.5,

      // Animation & Geometry
      animation: 'Assemble & Disperse Pulse',
      animationSpeed: 1.0,
      disperseDistance: 0.7,
      innerRadius: 1.35,
      outerRadius: 3.85,
      heightScale: 1.15,
      dpr: Math.min(window.devicePixelRatio || 1, 2.0),

      // Elements Visibility

    };

    // =========================================================================
    // INITIALIZATION & STUDIO ENVIRONMENT MAP GENERATION
    // =========================================================================
    const container = document.getElementById('canvas-container');

    let scene, camera, renderer, controls, gui, postProcessor;
    let sectorGroup, coreGroup, gridGroup, particleGroup, labelGroup;
    let keyLight, fillLight, rimLight, corePointLight, ambientLight;
    let sectorMeshes = [];
    let sectorInnerGlows = [];
    let sectorLabels = [];
    let clock = new THREE.Clock();
    let scanSweepRing = null;

    function generateStudioEnvMap(currentRenderer) {
      const pmremGenerator = new THREE.PMREMGenerator(currentRenderer);
      pmremGenerator.compileEquirectangularShader();

      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      // Gradient studio background
      const bgGrad = ctx.createLinearGradient(0, 0, 0, 512);
      bgGrad.addColorStop(0, '#0c1322');
      bgGrad.addColorStop(0.5, '#060912');
      bgGrad.addColorStop(1, '#020307');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, 1024, 512);

      // Overhead softbox highlight
      const topGrad = ctx.createRadialGradient(512, 100, 10, 512, 100, 280);
      topGrad.addColorStop(0, 'rgba(255, 255, 255, 1.0)');
      topGrad.addColorStop(0.3, 'rgba(210, 235, 255, 0.75)');
      topGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = topGrad;
      ctx.fillRect(0, 0, 1024, 300);

      // Left rim softbox (Cool Cyan)
      const leftGrad = ctx.createRadialGradient(200, 260, 5, 200, 260, 220);
      leftGrad.addColorStop(0, 'rgba(160, 225, 255, 0.85)');
      leftGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = leftGrad;
      ctx.fillRect(0, 100, 420, 360);

      // Right rim softbox (Warm Amber)
      const rightGrad = ctx.createRadialGradient(824, 260, 5, 824, 260, 220);
      rightGrad.addColorStop(0, 'rgba(255, 190, 150, 0.75)');
      rightGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = rightGrad;
      ctx.fillRect(624, 100, 400, 360);

      // Crisp studio strip lights for razor-sharp glass reflections
      ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
      ctx.fillRect(460, 30, 108, 30);
      ctx.fillStyle = 'rgba(180, 240, 255, 0.8)';
      ctx.fillRect(140, 170, 36, 170);
      ctx.fillStyle = 'rgba(255, 210, 180, 0.7)';
      ctx.fillRect(844, 170, 36, 170);

      const tex = new THREE.CanvasTexture(canvas);
      tex.mapping = THREE.EquirectangularReflectionMapping;
      const envMap = pmremGenerator.fromEquirectangular(tex).texture;
      pmremGenerator.dispose();
      return envMap;
    }

    function initRenderer() {
      if (renderer) {
        if (controls) controls.dispose();
        renderer.dispose();
        if (renderer.domElement && renderer.domElement.parentNode) {
          renderer.domElement.parentNode.removeChild(renderer.domElement);
        }
      }

      renderer = new THREE.WebGLRenderer({
        antialias: params.antialias,
        powerPreference: 'high-performance',
        alpha: true
      });
      renderer.setPixelRatio(params.dpr);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = params.exposure;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      // Generate studio environment map for realistic frosted glass refraction & reflections
      scene.environment = generateStudioEnvMap(renderer);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.enableZoom = true;
      controls.zoomSpeed = 1.1;
      controls.enablePan = true;
      controls.screenSpacePanning = true; // Dragging across screen smoothly pans scene
      controls.mouseButtons = {
        LEFT: THREE.MOUSE.ROTATE,
        MIDDLE: THREE.MOUSE.DOLLY,
        RIGHT: THREE.MOUSE.PAN
      };
      controls.minDistance = 3.5;
      controls.maxDistance = 38.0;
      controls.maxPolarAngle = Math.PI / 2 + 0.12;

      // Initialize PostProcessor Suite with Anamorphic default OFF
      postProcessor = new PostProcessor(renderer, {
        bloomEnabled: true,
        bloomStrength: 0.95,
        bloomThreshold: 0.22,
        bloomRadius: 0.6,
        raysEnabled: false,
        anamorphicEnabled: false, // DEFAULT IS OFF!
        chromaticAberration: 0.008,
        vignetteBoost: 1.08,
        vignetteReduction: 0.65,
        noiseIntensity: 0.012,
        antialias: params.antialias
      });
      postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);
    }

    function initScene() {
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 9.0, 12.0);

      sectorGroup = new THREE.Group();
      coreGroup = new THREE.Group();
      gridGroup = new THREE.Group();
      particleGroup = new THREE.Group();
      labelGroup = new THREE.Group();

      scene.add(gridGroup);
      scene.add(sectorGroup);
      scene.add(coreGroup);
      scene.add(particleGroup);
      scene.add(labelGroup);

      initLights();
      buildInfographicGrid();
      buildCoreHub();
      buildPieSectors();
      buildFloatingParticles();
      updateColorScheme(params.colorScheme);

      initRenderer();
    }

    // =========================================================================
    // LIGHTING SYSTEM
    // =========================================================================
    function initLights() {
      ambientLight = new THREE.AmbientLight(params.ambientColor, params.ambientIntensity);
      scene.add(ambientLight);

      keyLight = new THREE.DirectionalLight(params.keyColor, params.keyIntensity);
      keyLight.position.set(params.keyPosX, params.keyPosY, params.keyPosZ);
      keyLight.castShadow = true;
      keyLight.shadow.mapSize.width = 1024;
      keyLight.shadow.mapSize.height = 1024;
      keyLight.shadow.bias = -0.0001;
      scene.add(keyLight);

      fillLight = new THREE.DirectionalLight(params.fillColor, params.fillIntensity);
      fillLight.position.set(params.fillPosX, params.fillPosY, params.fillPosZ);
      scene.add(fillLight);

      rimLight = new THREE.PointLight(params.rimColor, params.rimIntensity, 28);
      rimLight.position.set(0, -4, -6);
      scene.add(rimLight);

      corePointLight = new THREE.PointLight(params.coreGlowColor, params.coreGlowIntensity, 14);
      corePointLight.position.set(0, 0.4, 0);
      scene.add(corePointLight);
    }

    function updateLights() {
      if (ambientLight) {
        ambientLight.color.set(params.ambientColor);
        ambientLight.intensity = params.ambientIntensity;
      }
      if (keyLight) {
        keyLight.color.set(params.keyColor);
        keyLight.intensity = params.keyIntensity;
        keyLight.position.set(params.keyPosX, params.keyPosY, params.keyPosZ);
      }
      if (fillLight) {
        fillLight.color.set(params.fillColor);
        fillLight.intensity = params.fillIntensity;
        fillLight.position.set(params.fillPosX, params.fillPosY, params.fillPosZ);
      }
      if (rimLight) {
        rimLight.color.set(params.rimColor);
        rimLight.intensity = params.rimIntensity;
      }
      if (corePointLight) {
        corePointLight.color.set(params.coreGlowColor);
        corePointLight.intensity = params.coreGlowIntensity;
      }
      if (renderer) {
        renderer.toneMappingExposure = params.exposure;
      }
    }

    // =========================================================================
    // INFOGRAPHIC GRID & SURROUNDING RADIUS RINGS
    // =========================================================================
    function buildInfographicGrid() {
      while (gridGroup.children.length > 0) {
        gridGroup.remove(gridGroup.children[0]);
      }

      // Concentric circular measurement rings
      const ringRadii = [2.2, 3.6, 5.0, 6.4, 8.0];
      const ringMat = new THREE.LineBasicMaterial({
        color: 0x1e3a5f,
        transparent: true,
        opacity: 0.35,
        blending: THREE.AdditiveBlending
      });

      ringRadii.forEach((r) => {
        const segments = 128;
        const pts = [];
        for (let i = 0; i <= segments; i++) {
          const theta = (i / segments) * Math.PI * 2;
          pts.push(new THREE.Vector3(Math.cos(theta) * r, -1.2, Math.sin(theta) * r));
        }
        const geom = new THREE.BufferGeometry().setFromPoints(pts);
        gridGroup.add(new THREE.Line(geom, ringMat));
      });

      // Polar degree ticks
      const tickMat = new THREE.LineBasicMaterial({
        color: 0x2563eb,
        transparent: true,
        opacity: 0.25,
        blending: THREE.AdditiveBlending
      });
      const numTicks = 36;
      for (let i = 0; i < numTicks; i++) {
        const theta = (i / numTicks) * Math.PI * 2;
        const innerR = (i % 3 === 0) ? 1.8 : 4.8;
        const outerR = (i % 3 === 0) ? 8.2 : 5.2;
        const pts = [
          new THREE.Vector3(Math.cos(theta) * innerR, -1.2, Math.sin(theta) * innerR),
          new THREE.Vector3(Math.cos(theta) * outerR, -1.2, Math.sin(theta) * outerR)
        ];
        const geom = new THREE.BufferGeometry().setFromPoints(pts);
        gridGroup.add(new THREE.Line(geom, tickMat));
      }

      // Grid helper floor
      const gridHelper = new THREE.GridHelper(26, 52, 0x1e3a5f, 0x091528);
      gridHelper.position.y = -1.21;
      gridHelper.material.transparent = true;
      gridHelper.material.opacity = 0.3;
      gridGroup.add(gridHelper);

      // Rotating Laser Scan Ring
      const scanGeom = new THREE.RingGeometry(1.2, 6.2, 64, 1, 0, Math.PI * 0.35);
      const scanMat = new THREE.MeshBasicMaterial({
        color: 0x00f0ff,
        transparent: true,
        opacity: 0.12,
        side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending
      });
      scanSweepRing = new THREE.Mesh(scanGeom, scanMat);
      scanSweepRing.rotation.x = -Math.PI / 2;
      scanSweepRing.position.y = -1.18;
      gridGroup.add(scanSweepRing);
    }

    // =========================================================================
    // CENTRAL INFOGRAPHIC CORE HUB
    // =========================================================================
    function buildCoreHub() {
      while (coreGroup.children.length > 0) {
        coreGroup.remove(coreGroup.children[0]);
      }

      // Inner glowing holographic cylinder
      const cylGeom = new THREE.CylinderGeometry(params.innerRadius * 0.72, params.innerRadius * 0.72, 1.8, 48, 1, true);
      const cylMat = new THREE.MeshPhysicalMaterial({
        color: 0xffffff,
        metalness: 0.1,
        roughness: 0.15,
        transmission: 0.88,
        thickness: 1.2,
        ior: 1.5,
        transparent: true,
        opacity: 0.85,
        side: THREE.DoubleSide
      });
      const cylMesh = new THREE.Mesh(cylGeom, cylMat);
      cylMesh.position.y = 0.3;
      coreGroup.add(cylMesh);

      // Core pulsating energy beacon
      const beaconGeom = new THREE.CylinderGeometry(params.innerRadius * 0.42, params.innerRadius * 0.42, 1.6, 32);
      const beaconMat = new THREE.MeshBasicMaterial({
        color: 0x00f0ff,
        transparent: true,
        opacity: 0.45,
        blending: THREE.AdditiveBlending
      });
      const beaconMesh = new THREE.Mesh(beaconGeom, beaconMat);
      beaconMesh.name = 'coreBeacon';
      beaconMesh.position.y = 0.3;
      coreGroup.add(beaconMesh);

      // Concentric floating holographic gimbal rings
      const coreRingsGroup = new THREE.Group();
      coreRingsGroup.name = 'coreRingsGroup';

      const ringConfigs = [
        { radius: params.innerRadius * 0.92, y: 1.0, rotSpeed: 0.8 },
        { radius: params.innerRadius * 0.84, y: 0.3, rotSpeed: -1.2 },
        { radius: params.innerRadius * 0.92, y: -0.4, rotSpeed: 0.6 }
      ];

      ringConfigs.forEach(cfg => {
        const ringGeom = new THREE.TorusGeometry(cfg.radius, 0.02, 16, 64);
        const ringMat = new THREE.MeshBasicMaterial({
          color: 0x38bdf8,
          transparent: true,
          opacity: 0.75,
          blending: THREE.AdditiveBlending
        });
        const ring = new THREE.Mesh(ringGeom, ringMat);
        ring.rotation.x = Math.PI / 2;
        ring.position.y = cfg.y;
        ring.userData = { rotSpeed: cfg.rotSpeed };
        coreRingsGroup.add(ring);
      });

      coreGroup.add(coreRingsGroup);
    }

    // =========================================================================
    // PIE CHART SECTORS (MATHEMATICALLY EXACT RADIAL FIT & FROSTED GLASS)
    // =========================================================================
    function createSectorShape(innerR, outerR, spanAngle) {
      const shape = new THREE.Shape();
      const segments = 48;
      const halfSpan = spanAngle * 0.5;
      const startTheta = -halfSpan;

      // Outer arc from -halfSpan to +halfSpan
      for (let i = 0; i <= segments; i++) {
        const theta = startTheta + (i / segments) * spanAngle;
        const x = Math.cos(theta) * outerR;
        const y = Math.sin(theta) * outerR;
        if (i === 0) shape.moveTo(x, y);
        else shape.lineTo(x, y);
      }

      // Inner reverse arc from +halfSpan to -halfSpan
      for (let i = segments; i >= 0; i--) {
        const theta = startTheta + (i / segments) * spanAngle;
        const x = Math.cos(theta) * innerR;
        const y = Math.sin(theta) * innerR;
        shape.lineTo(x, y);
      }

      shape.closePath();
      return shape;
    }

    function createBadgeTexture(sectorInfo, colorHex) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      // Rounded container with frosted glass card styling
      ctx.fillStyle = 'rgba(7, 13, 26, 0.88)';
      ctx.strokeStyle = colorHex;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.roundRect(10, 10, 492, 236, 24);
      ctx.fill();
      ctx.stroke();

      // Top glowing indicator and title
      ctx.fillStyle = colorHex;
      ctx.font = 'bold 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
      ctx.fillText(`${sectorInfo.icon}  ${sectorInfo.name}`, 36, 64);

      // Percentage Big Text
      ctx.font = 'bold 74px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
      ctx.fillText(`${sectorInfo.percent}%`, 36, 144);

      // Valuation & Growth
      ctx.fillStyle = '#94a3b8';
      ctx.font = '600 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
      ctx.fillText(`VAL: ${sectorInfo.ticker}`, 36, 196);

      ctx.fillStyle = '#34d399';
      ctx.fillText(`YOY: ${sectorInfo.growth}`, 290, 196);

      const texture = new THREE.CanvasTexture(canvas);
      texture.minFilter = THREE.LinearFilter;
      texture.magFilter = THREE.LinearFilter;
      return texture;
    }

    function buildPieSectors() {
      // Clear previous sectors & labels
      while (sectorGroup.children.length > 0) {
        const child = sectorGroup.children[0];
        if (child.geometry) child.geometry.dispose();
        sectorGroup.remove(child);
      }
      while (labelGroup.children.length > 0) {
        labelGroup.remove(labelGroup.children[0]);
      }
      sectorMeshes = [];
      sectorInnerGlows = [];
      sectorLabels = [];

      const currentScheme = COLOR_SCHEMES[params.colorScheme] || COLOR_SCHEMES['Original'];
      let cumulativeAngle = 0;
      const gapAngle = 0.032; // Precision micro-gap between sectors

      SECTOR_DATA.forEach((info, index) => {
        const sectorAngleSpan = (info.percent / 100) * (Math.PI * 2);
        const midAngle = cumulativeAngle + sectorAngleSpan * 0.5;
        cumulativeAngle += sectorAngleSpan;

        // Custom step height for financial value hierarchy
        const sectorDepth = (0.75 + (info.percent / 100) * 2.2) * params.heightScale;

        // 1. Frosted Tinted Glass Geometry (Centered at Angle 0 for flawless radial assembly)
        const shape = createSectorShape(params.innerRadius, params.outerRadius, sectorAngleSpan - gapAngle);
        const extrudeSettings = {
          depth: sectorDepth,
          bevelEnabled: true,
          bevelSegments: 5,
          steps: 1,
          bevelSize: 0.05,
          bevelThickness: 0.05
        };

        const geom = new THREE.ExtrudeGeometry(shape, extrudeSettings);
        // Center ONLY in Z (height of extrusion) so radial origin remains exactly (0,0)
        geom.translate(0, 0, -sectorDepth * 0.5);

        const sectorColor = currentScheme.sectors[index % currentScheme.sectors.length];

        const glassMat = new THREE.MeshPhysicalMaterial({
          color: new THREE.Color(sectorColor).lerp(new THREE.Color('#ffffff'), 0.25),
          attenuationColor: new THREE.Color(sectorColor),
          attenuationDistance: 1.6,
          roughness: params.glassRoughness,
          transmission: params.glassTransmission,
          thickness: params.glassThickness,
          ior: params.glassIor,
          dispersion: params.glassDispersion,
          metalness: 0.04,
          clearcoat: 1.0,
          clearcoatRoughness: 0.06,
          reflectivity: 0.8,
          specularIntensity: 1.0,
          transparent: true,
          opacity: params.glassOpacity,
          side: THREE.DoubleSide
        });

        // Sector Container: local origin is center of circle
        const sectorContainer = new THREE.Group();

        // Glass Mesh: rotated so 2D XY plane lies flat on 3D XZ plane
        const glassMesh = new THREE.Mesh(geom, glassMat);
        glassMesh.rotation.x = -Math.PI / 2;
        glassMesh.castShadow = true;
        glassMesh.receiveShadow = true;
        sectorContainer.add(glassMesh);

        // 2. Inner Luminescent Backlight Core (Inset emissive sub-slice)
        const innerShape = createSectorShape(params.innerRadius + 0.12, params.outerRadius - 0.12, sectorAngleSpan - gapAngle - 0.02);
        const innerExtrude = {
          depth: sectorDepth * 0.65,
          bevelEnabled: false,
          steps: 1
        };
        const innerGeom = new THREE.ExtrudeGeometry(innerShape, innerExtrude);
        innerGeom.translate(0, 0, -sectorDepth * 0.325);

        const innerMat = new THREE.MeshBasicMaterial({
          color: new THREE.Color(sectorColor),
          transparent: true,
          opacity: 0.38 * params.internalSubglowIntensity,
          blending: THREE.AdditiveBlending
        });
        const innerMesh = new THREE.Mesh(innerGeom, innerMat);
        innerMesh.rotation.x = -Math.PI / 2;
        sectorContainer.add(innerMesh);
        sectorInnerGlows.push(innerMat);

        // 3. Glowing Chamfer Edges (Cyber wireframe contours)
        const edgesGeom = new THREE.EdgesGeometry(geom, 24);
        const edgeMat = new THREE.LineBasicMaterial({
          color: new THREE.Color(sectorColor),
          transparent: true,
          opacity: 0.65,
          blending: THREE.AdditiveBlending
        });
        const edgesLine = new THREE.LineSegments(edgesGeom, edgeMat);
        edgesLine.rotation.x = -Math.PI / 2;
        sectorContainer.add(edgesLine);

        // Rotate sector container around Y axis to its exact midAngle
        sectorContainer.rotation.y = -midAngle;

        sectorContainer.userData = {
          index,
          info,
          midAngle,
          baseHeight: sectorDepth,
          color: sectorColor
        };

        sectorGroup.add(sectorContainer);
        sectorMeshes.push(sectorContainer);

        // 4. Floating 3D Financial Data Badges with dynamic leader lines
        const labelGroupItem = new THREE.Group();
        const badgeTex = createBadgeTexture(info, sectorColor);
        const badgeMat = new THREE.SpriteMaterial({
          map: badgeTex,
          transparent: true,
          opacity: 0.95,
          depthWrite: false
        });
        const badgeSprite = new THREE.Sprite(badgeMat);
        badgeSprite.scale.set(2.2, 1.1, 1.0);
        labelGroupItem.add(badgeSprite);

        // Dynamic 3-point leader line
        const lineGeom = new THREE.BufferGeometry();
        lineGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(3 * 3), 3));
        const lineMat = new THREE.LineBasicMaterial({
          color: new THREE.Color(sectorColor),
          transparent: true,
          opacity: 0.5,
          blending: THREE.AdditiveBlending
        });
        const leaderLine = new THREE.Line(lineGeom, lineMat);
        labelGroupItem.add(leaderLine);

        // Small glowing anchor dot on sector rim
        const dotGeom = new THREE.SphereGeometry(0.045, 16, 16);
        const dotMat = new THREE.MeshBasicMaterial({
          color: new THREE.Color(sectorColor),
          blending: THREE.AdditiveBlending
        });
        const anchorDot = new THREE.Mesh(dotGeom, dotMat);
        labelGroupItem.add(anchorDot);

        labelGroupItem.userData = {
          badgeSprite,
          leaderLine,
          anchorDot,
          midAngle,
          index
        };

        labelGroup.add(labelGroupItem);
        sectorLabels.push(labelGroupItem);
      });
    }

    // =========================================================================
    // FLOATING FINANCIAL DATA PARTICLES
    // =========================================================================
    function buildFloatingParticles() {
      while (particleGroup.children.length > 0) {
        particleGroup.remove(particleGroup.children[0]);
      }

      const count = 320;
      const positions = new Float32Array(count * 3);
      const speeds = new Float32Array(count);
      const angles = new Float32Array(count);
      const radii = new Float32Array(count);

      for (let i = 0; i < count; i++) {
        const r = 0.6 + Math.random() * 6.8;
        const theta = Math.random() * Math.PI * 2;
        const y = -1.0 + Math.random() * 4.5;

        positions[i * 3 + 0] = Math.cos(theta) * r;
        positions[i * 3 + 1] = y;
        positions[i * 3 + 2] = Math.sin(theta) * r;

        speeds[i] = 0.2 + Math.random() * 0.5;
        angles[i] = theta;
        radii[i] = r;
      }

      const geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));

      const pCanvas = document.createElement('canvas');
      pCanvas.width = 64;
      pCanvas.height = 64;
      const pCtx = pCanvas.getContext('2d');
      const grad = pCtx.createRadialGradient(32, 32, 0, 32, 32, 30);
      grad.addColorStop(0, 'rgba(255,255,255,1)');
      grad.addColorStop(0.3, 'rgba(100,220,255,0.8)');
      grad.addColorStop(1, 'rgba(0,100,255,0)');
      pCtx.fillStyle = grad;
      pCtx.beginPath();
      pCtx.arc(32, 32, 30, 0, Math.PI * 2);
      pCtx.fill();

      const pTex = new THREE.CanvasTexture(pCanvas);
      const pMat = new THREE.PointsMaterial({
        size: 0.12,
        map: pTex,
        transparent: true,
        opacity: 0.65,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      const pSystem = new THREE.Points(geom, pMat);
      pSystem.userData = { speeds, angles, radii };
      particleGroup.add(pSystem);
    }

    // =========================================================================
    // COLOR SCHEME UPDATE
    // =========================================================================
    function updateColorScheme(schemeName) {
      const scheme = COLOR_SCHEMES[schemeName] || COLOR_SCHEMES['Original'];

      if (params.greenscreen) {
        scene.background = new THREE.Color('#00ff00');
      } else {
        scene.background = new THREE.Color(scheme.bg);
      }

      params.ambientColor = scheme.ambient;
      params.keyColor = scheme.keyLight;
      params.fillColor = scheme.fillLight;
      params.rimColor = scheme.rimLight;
      params.coreGlowColor = scheme.coreGlow;

      updateLights();

      const beacon = coreGroup.getObjectByName('coreBeacon');
      if (beacon) beacon.material.color.set(scheme.coreGlow);

      const coreRings = coreGroup.getObjectByName('coreRingsGroup');
      if (coreRings) {
        coreRings.children.forEach(r => r.material.color.set(scheme.keyLight));
      }

      buildPieSectors();
    }

    // =========================================================================
    // ANIMATION & MOTION ENGINES (8 PRECONFIGURED MODES)
    // =========================================================================
    function updateAnimations(time, delta) {
      const spd = params.animationSpeed;
      const t = time * spd;

      // 1. Scan sweep ring rotation
      if (scanSweepRing) {
        scanSweepRing.rotation.z = -t * 0.4;
      }

      // 2. Core gimbal rings rotation
      const coreRings = coreGroup.getObjectByName('coreRingsGroup');
      if (coreRings) {
        coreRings.children.forEach(ring => {
          ring.rotation.z += delta * ring.userData.rotSpeed * spd;
        });
      }

      // 3. Floating data particles
      if (particleGroup.children.length > 0) {
        const pSys = particleGroup.children[0];
        const posAttr = pSys.geometry.attributes.position;
        const { speeds, angles, radii } = pSys.userData;

        for (let i = 0; i < posAttr.count; i++) {
          let y = posAttr.getY(i) + speeds[i] * delta * 0.8 * spd;
          if (y > 4.5) y = -1.0;
          posAttr.setY(i, y);

          angles[i] += delta * 0.08 * speeds[i] * spd;
          posAttr.setX(i, Math.cos(angles[i]) * radii[i]);
          posAttr.setZ(i, Math.sin(angles[i]) * radii[i]);
        }
        posAttr.needsUpdate = true;
      }

      // 4. Sector Motion Calculations
      sectorMeshes.forEach((sec, i) => {
        const midAngle = sec.userData.midAngle;
        let disperseOffset = 0;
        let elevationY = 0;

        switch (params.animation) {
          case 'Static (Pure Infographic Display)':
            // Flawless locked assembly, zero displacement
            disperseOffset = 0;
            elevationY = 0;
            break;

          case 'Assemble & Disperse Pulse':
            // Smooth harmonic rhythmic assembly and dispersion
            {
              const pulse = (Math.sin(t * 0.8) + 1) * 0.5;
              const easePulse = pulse * pulse * (3 - 2 * pulse); // Smoothstep ease
              disperseOffset = params.disperseDistance * easePulse;
              elevationY = Math.sin(t * 1.2 + i * 0.7) * 0.1 * easePulse;
            }
            break;

          case 'Orbital Sector Cascade':
            // Wave of elevation traveling around the circle
            {
              const wave = Math.sin(t * 1.4 - (i / sectorMeshes.length) * Math.PI * 2);
              elevationY = wave * 0.4;
              disperseOffset = (wave + 1) * 0.15 * params.disperseDistance;
            }
            break;

          case 'Exploded Hologram Matrix':
            // Maintained in expanded exploded view
            disperseOffset = params.disperseDistance * 1.2;
            elevationY = Math.sin(t * 0.7 + i * 1.1) * 0.2;
            break;

          case 'Rotational Financial Scan':
            // Sectors oscillate along micro-radial offsets
            disperseOffset = (0.3 + Math.sin(t * 1.1 + i * 0.8) * 0.25) * params.disperseDistance;
            elevationY = Math.cos(t * 0.8 + i) * 0.14;
            break;

          case 'Cinematic Helix Float':
            // Sectors elevate in proportion to portfolio allocation weight
            {
              const weightRatio = sec.userData.info.percent / 100;
              elevationY = Math.sin(t * 1.1 + i * 0.9) * 0.35 * (1.0 + weightRatio);
              disperseOffset = params.disperseDistance * (0.2 + weightRatio * 0.8);
            }
            break;

          case 'Breathing Glass Core':
            // Unified circle with subtle organic breathing expansion
            disperseOffset = Math.sin(t * 0.85) * 0.12 * params.disperseDistance;
            elevationY = Math.sin(t * 1.2 + i * 0.5) * 0.05;
            break;

          case 'Zenith Horizon Drift':
            // Gentle low-gravity undulating float
            elevationY = Math.sin(t * 0.5 + i * 0.7) * 0.26;
            disperseOffset = params.disperseDistance * 0.5 * (1 + Math.sin(t * 0.6 + i * 1.1) * 0.4);
            break;
        }

        // Apply radial position displacement
        sec.position.x = Math.cos(midAngle) * disperseOffset;
        sec.position.z = Math.sin(midAngle) * disperseOffset;
        sec.position.y = elevationY;
        sec.userData.currentDisperse = disperseOffset;
      });

      // 5. Update Dynamic Leader Lines and Floating Badges
      sectorLabels.forEach((lblItem, idx) => {
        const sec = sectorMeshes[idx];
        if (!sec) return;

        const { badgeSprite, leaderLine, anchorDot, midAngle } = lblItem.userData;
        const curDisperse = sec.userData.currentDisperse || 0;
        const currentSectorY = sec.position.y;

        // Anchor point on the sector's outer beveled rim
        const rimX = Math.cos(midAngle) * (params.outerRadius + curDisperse);
        const rimZ = Math.sin(midAngle) * (params.outerRadius + curDisperse);
        const rimY = currentSectorY + sec.userData.baseHeight * 0.35;

        anchorDot.position.set(rimX, rimY, rimZ);

        // Floating badge position
        const badgeRadius = params.outerRadius + 1.65 + curDisperse * 0.8;
        const badgeY = sec.userData.baseHeight * 0.5 + 0.75 + (idx % 2) * 0.6 + currentSectorY * 0.5;
        const badgeX = Math.cos(midAngle) * badgeRadius;
        const badgeZ = Math.sin(midAngle) * badgeRadius;

        badgeSprite.position.set(badgeX, badgeY, badgeZ);

        // Smooth 3-point leader curve
        const midPointX = (rimX + badgeX) * 0.5;
        const midPointY = (rimY + badgeY) * 0.5 + 0.2;
        const midPointZ = (rimZ + badgeZ) * 0.5;

        const linePos = leaderLine.geometry.attributes.position;
        linePos.setXYZ(0, rimX, rimY, rimZ);
        linePos.setXYZ(1, midPointX, midPointY, midPointZ);
        linePos.setXYZ(2, badgeX, badgeY - 0.25, badgeZ);
        linePos.needsUpdate = true;
      });

      // 6. Camera Slow Cinematic Orbit (When not in Static mode)
      if (controls) {
        controls.autoRotate = (params.animation !== 'Static (Pure Infographic Display)');
        controls.autoRotateSpeed = 0.45 * params.animationSpeed;
      }
    }

    // =========================================================================
    // PROCEDURAL RANDOMIZER (CLICK ON SCENE)
    // =========================================================================
    function triggerRandomization() {
      // Pick random scheme
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      params.colorScheme = randomScheme;

      // Randomize visual and geometry parameters
      params.disperseDistance = parseFloat((0.2 + Math.random() * 1.5).toFixed(2));
      params.heightScale = parseFloat((0.8 + Math.random() * 1.2).toFixed(2));
      params.glassRoughness = parseFloat((0.10 + Math.random() * 0.16).toFixed(2));
      params.glassTransmission = parseFloat((0.88 + Math.random() * 0.10).toFixed(2));
      params.glassThickness = parseFloat((1.4 + Math.random() * 1.6).toFixed(2));
      params.coreGlowIntensity = parseFloat((2.0 + Math.random() * 3.0).toFixed(2));
      params.animationSpeed = parseFloat((0.6 + Math.random() * 1.0).toFixed(2));

      // Random animation mode
      const randomAnim = ANIMATION_PRESETS[Math.floor(Math.random() * ANIMATION_PRESETS.length)];
      params.animation = randomAnim;

      // NOTE: PostProcessor settings (bloom, anamorphic, optics) are strictly PRESERVED as requested!
      updateColorScheme(params.colorScheme);

      // Refresh lil-gui controllers
      if (gui) {
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      }
    }

    // Pointer event tracking for click vs drag detection
    let pointerDownPos = { x: 0, y: 0 };
    let pointerDownTime = 0;

    window.addEventListener('pointerdown', (e) => {
      pointerDownPos = { x: e.clientX, y: e.clientY };
      pointerDownTime = performance.now();
    });

    window.addEventListener('pointerup', (e) => {
      const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
      const elapsed = performance.now() - pointerDownTime;

      // Only trigger if click was brief without significant mouse drag
      if (dist < 6 && elapsed < 350) {
        if (!e.target.closest('.lil-gui')) {
          if (params.clickToRandomize) {
            triggerRandomization();
          }
        }
      }
    });

    // =========================================================================
    // LIL-GUI INITIALIZATION
    // =========================================================================
    function initGUI() {
      gui = new GUI({ title: 'Glass Infographic Chart' });

      // Scene & Animation
      const fAnimation = gui.addFolder('Animation & Scene');
      fAnimation.add(params, 'animation', ANIMATION_PRESETS).name('Motion Mode');
      fAnimation.add(params, 'animationSpeed', 0.1, 3.0, 0.05).name('Speed Multiplier');
      fAnimation.add(params, 'disperseDistance', 0.0, 2.5, 0.05).name('Disperse Offset');
      fAnimation.add(params, 'greenscreen').name('Greenscreen (#00ff00)').onChange(v => {
        if (v) {
          scene.background = new THREE.Color('#00ff00');
        } else {
          const s = COLOR_SCHEMES[params.colorScheme] || COLOR_SCHEMES['Original'];
          scene.background = new THREE.Color(s.bg);
        }
      });
      fAnimation.add(params, 'dpr', 0.5, 3.0, 0.1).name('Pixel Ratio (DPR)').onChange(v => {
        if (renderer) renderer.setPixelRatio(v);
        if (postProcessor) postProcessor.setSize(window.innerWidth, window.innerHeight, v);
      });
      fAnimation.add(params, 'antialias').name('Antialias').onChange(v => {
        if (postProcessor) postProcessor.setAntialias(v);
      });
      fAnimation.add(params, 'clickToRandomize').name('Click Scene: Re-roll');

      // Colors & Palettes (19+ Preconfigured Schemes)
      const fColor = gui.addFolder('Color Schemes (19+ Presets)');
      fColor.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Palette Preset').onChange(v => {
        updateColorScheme(v);
      });
      fColor.add(params, 'glassRoughness', 0.0, 0.5, 0.01).name('Glass Frosting').onChange(v => {
        sectorMeshes.forEach(sec => {
          const mesh = sec.children[0];
          if (mesh && mesh.material) mesh.material.roughness = v;
        });
      });
      fColor.add(params, 'glassTransmission', 0.1, 1.0, 0.01).name('Glass Transmission').onChange(v => {
        sectorMeshes.forEach(sec => {
          const mesh = sec.children[0];
          if (mesh && mesh.material) mesh.material.transmission = v;
        });
      });
      fColor.add(params, 'glassThickness', 0.2, 4.0, 0.1).name('Glass Thickness').onChange(v => {
        sectorMeshes.forEach(sec => {
          const mesh = sec.children[0];
          if (mesh && mesh.material) mesh.material.thickness = v;
        });
      });
      fColor.add(params, 'glassIor', 1.0, 2.4, 0.02).name('Glass IOR').onChange(v => {
        sectorMeshes.forEach(sec => {
          const mesh = sec.children[0];
          if (mesh && mesh.material) mesh.material.ior = v;
        });
      });
      fColor.add(params, 'glassDispersion', 0.0, 0.2, 0.01).name('Glass Dispersion').onChange(v => {
        sectorMeshes.forEach(sec => {
          const mesh = sec.children[0];
          if (mesh && mesh.material) mesh.material.dispersion = v;
        });
      });

      // Illumination & Exposure
      const fLights = gui.addFolder('Illumination & Exposure');
      fLights.add(params, 'exposure', 0.2, 3.0, 0.05).name('Scene Exposure').onChange(v => {
        renderer.toneMappingExposure = v;
      });
      fLights.add(params, 'ambientIntensity', 0.0, 3.0, 0.1).name('Ambient Intensity').onChange(updateLights);
      fLights.addColor(params, 'ambientColor').name('Ambient Color').onChange(updateLights);

      // Key Light
      fLights.add(params, 'keyIntensity', 0.0, 6.0, 0.1).name('Key Light Intensity').onChange(updateLights);
      fLights.addColor(params, 'keyColor').name('Key Light Color').onChange(updateLights);
      fLights.add(params, 'keyPosX', -20, 20, 0.5).name('Key Pos X').onChange(updateLights);
      fLights.add(params, 'keyPosY', 0, 30, 0.5).name('Key Pos Y').onChange(updateLights);
      fLights.add(params, 'keyPosZ', -20, 20, 0.5).name('Key Pos Z').onChange(updateLights);

      // Fill Light
      fLights.add(params, 'fillIntensity', 0.0, 5.0, 0.1).name('Fill Light Intensity').onChange(updateLights);
      fLights.addColor(params, 'fillColor').name('Fill Light Color').onChange(updateLights);
      fLights.add(params, 'fillPosX', -20, 20, 0.5).name('Fill Pos X').onChange(updateLights);
      fLights.add(params, 'fillPosY', -20, 20, 0.5).name('Fill Pos Y').onChange(updateLights);
      fLights.add(params, 'fillPosZ', -20, 20, 0.5).name('Fill Pos Z').onChange(updateLights);

      // Rim Light & Core Glow
      fLights.add(params, 'rimIntensity', 0.0, 5.0, 0.1).name('Rim Light Intensity').onChange(updateLights);
      fLights.addColor(params, 'rimColor').name('Rim Light Color').onChange(updateLights);
      fLights.add(params, 'coreGlowIntensity', 0.0, 6.0, 0.1).name('Core Hub Glow').onChange(updateLights);
      fLights.addColor(params, 'coreGlowColor').name('Core Glow Color').onChange(updateLights);
      fLights.add(params, 'internalSubglowIntensity', 0.0, 3.0, 0.1).name('Sector Inner Glow').onChange(v => {
        sectorInnerGlows.forEach(mat => {
          mat.opacity = 0.38 * v;
        });
      });

      // Infographic Elements
      const fElements = gui.addFolder('Infographic Layers');
      fElements.add(params, 'heightScale', 0.4, 2.5, 0.05).name('Height Scale').onChange(() => {
        buildPieSectors();
      });
      fElements.add(params, 'innerRadius', 0.5, 2.5, 0.1).name('Hole Inner Radius').onChange(() => {
        buildCoreHub();
        buildPieSectors();
      });
      fElements.add(params, 'outerRadius', 2.5, 5.5, 0.1).name('Outer Radius').onChange(() => {
        buildPieSectors();
      });
      fElements.add(params, 'showLabels').name('Data Badges').onChange(v => {
        labelGroup.visible = v;
      });
      fElements.add(params, 'showCoreRings').name('Core Gimbal Rings').onChange(v => {
        coreGroup.visible = v;
      });
      fElements.add(params, 'showGridFloor').name('Radial Grid Floor').onChange(v => {
        gridGroup.visible = v;
      });
      fElements.add(params, 'showFloatingParticles').name('Data Particles').onChange(v => {
        particleGroup.visible = v;
      });

      // Attach PostProcessor Suite directly into lil-gui
      if (postProcessor) {
        postProcessor.attachGUI(gui, "Post-Processing (PostProcessor.js)");
      }

      fAnimation.open();
    }

    // Toggle UI visibility with 'H' key
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        if (gui) {
          gui.show(gui._hidden);
        }
      }
    });

    // Handle Window Resizing
    window.addEventListener('resize', () => {
      if (camera && renderer) {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        if (postProcessor) {
          postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);
        }
      }
    });

    // =========================================================================
    // MAIN LOOP
    // =========================================================================
    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const elapsedTime = clock.getElapsedTime();

      controls.update();
      updateAnimations(elapsedTime, delta);

      // Render through PostProcessor Pipeline
      if (postProcessor) {
        postProcessor.renderScene(scene, camera);
      } else {
        renderer.render(scene, camera);
      }
    }

    // Run application
    initScene();
    initGUI();
    animate();
  </script>
</body>
</html>
