<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eyes Pattern WebGL</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            width: 100%;
            height: 100%;
            user-select: none;
        }

        canvas#eyes-pattern {
            display: block;
            width: 100vw;
            height: 100vh;
            touch-action: none;
            cursor: grab;
        }

        canvas#eyes-pattern:active {
            cursor: grabbing;
        }

        .lil-gui {
            --width: 380px;
            max-width: 90%;
            --widget-height: 22px;
            font-size: 13px;
            --input-font-size: 13px;
            --padding: 10px;
            --spacing: 8px;
            --slider-knob-width: 6px;
            --background-color: rgba(10, 10, 18, 0.88);
            --widget-color: rgba(255, 255, 255, 0.15);
            --focus-color: rgba(255, 255, 255, 0.35);
            --hover-color: rgba(255, 255, 255, 0.25);
            --font-family: monospace;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <canvas id="eyes-pattern"></canvas>

    <script type="x-shader/x-vertex" id="vertShader">
        precision mediump float;

        varying vec2 vUv;
        attribute vec2 a_position;

        void main() {
            vUv = .5 * (a_position + 1.);
            gl_Position = vec4(a_position, 0.0, 1.0);
        }
    </script>

    <script type="x-shader/x-fragment" id="fragShader">
        precision mediump float;

        varying vec2 vUv;
        uniform float u_scale;
        uniform float u_time;
        uniform float u_speed;
        uniform float u_ratio;
        uniform float u_saturation;
        uniform float u_redness;
        uniform float u_blue_ratio;
        uniform float u_hue_shift;
        uniform float u_greenscreen;
        uniform vec2 u_offset;
        uniform vec2 u_pointer;

        #define TWO_PI 6.28318530718

        // =================================================
        // cell-related helpers
        vec2 hash(vec2 p) {
            p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)));
            return fract(sin(p)*18.5453);
        }
        // polynomial-based smooth minimum;
        // used for rounded Voronoi shaping
        float smin(float angle, float b, float k) {
            float h = clamp(.5 + .5 * (b - angle) / k, 0., 1.);
            return mix(b, angle, h) - k * h * (1. - h);
        }

        // =================================================
        // eye-related helpers
        float rand(vec2 n) {
            return fract(cos(dot(n, vec2(12.9898, 4.1414))) * 43758.5453);
        }
        float noise(vec2 n) {
            const vec2 d = vec2(0.0, 1.0);
            vec2 b = floor(n), f = smoothstep(vec2(0.0), vec2(1.0), fract(n));
            return mix(mix(rand(b), rand(b + d.yx), f.x), mix(rand(b + d.xy), rand(b + d.yy), f.x), f.y);
        }
        float fbm(vec2 n) {
            float total = 0.0, amplitude = .4;
            for (int i = 0; i < 4; i++) {
                total += noise(n) * amplitude;
                n += n;
                amplitude *= 0.6;
            }
            return total;
        }
        vec3 hsv2rgb(vec3 c) {
            vec4 K = vec4(1.0, 2.0 / 3.0, 1.0 / 3.0, 3.0);
            vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
            return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
        }

        // =================================================
        // vessels-related helpers
        mat2 rotate2D(float r) {
            return mat2(cos(r), sin(r), -sin(r), cos(r));
        }
        float vessels(vec2 uv, float t) {
            float S = 10.;
            vec2 n = vec2(0);
            vec2 N = vec2(0);
            mat2 m = rotate2D(1.);
            for (int j = 0; j < 15; j++) {
                uv *= m;
                n *= m;
                vec2 q = uv * S + float(j) + n + t;
                n += sin(q);
                N += cos(q) / S * (1. + .2);
                S *= 1.2;
            }
            return (N.x + N.y + .2);
        }

        // =================================================

        vec3 eye_pattern(vec2 uv, float tile_time, float pointer_angle, float pointer_distance) {

            // tiles coordinates
            vec2 i_uv = floor(uv);
            vec2 f_uv = fract(uv);

            // outputs
            vec2 randomizer = vec2(0.);
            vec3 distance = vec3(1.);
            float angle = 0.;

            // get Voronoi cell data
            for (int y = -1; y <= 1; y++) {
                for (int x = -1; x <= 1; x++) {
                    vec2 tile_offset = vec2(float(x), float(y));
                    vec2 blick_tile_offset = tile_offset;
                    vec2 o = hash(i_uv + tile_offset);
                    tile_offset += (.5 + (.25 + pointer_distance) * sin(tile_time + TWO_PI * o)) - f_uv;
                    blick_tile_offset += (.9 - f_uv);

                    float dist = dot(tile_offset, tile_offset);
                    float old_min_dist = distance.x;

                    distance.z = max(distance.x, max(distance.y, min(distance.z, dist)));
                    distance.y = max(distance.x, min(distance.y, dist));
                    distance.x = min(distance.x, dist);

                    if (old_min_dist > distance.x) {
                        angle = atan(tile_offset.x, tile_offset.y);
                        randomizer = o;
                    }
                }
            }

            distance = sqrt(distance);
            distance = sqrt(distance);
            float cell_shape = min(smin(distance.z, distance.y, .1) - distance.x, 1.);
            float cell_radius = distance.x;
            float eye_radius = 2. * cell_radius - .5 * cell_shape;

            // ============================================================

            float redness_angle = angle * 2. + randomizer.y;
            float eye_ball_redness = vessels(vec2(redness_angle * .2, cell_shape * 2.), .5 * u_time);
            eye_ball_redness *= pow(cell_radius, 1. / max(u_redness, 0.001));// more on edges
            eye_ball_redness *= (.5 + .5 * randomizer.y);// less for some cells
            eye_ball_redness *= smoothstep(3., 1.5, angle);// hide the seam
            eye_ball_redness *= smoothstep(-3., -2., angle);// hide the seam
            
            vec3 normal_eye_ball_color = vec3(1., 1. - eye_ball_redness, 1. - eye_ball_redness);
            vec3 chroma_green = vec3(0.0, 1.0, 0.0);
            vec3 eye_ball_color = mix(normal_eye_ball_color, chroma_green, u_greenscreen);

            // iris color
            float iris_color_1_hue = (1. - u_blue_ratio) * pow(randomizer.x, 3. - 2. * u_blue_ratio) + u_blue_ratio * pow(randomizer.x, 1.3 - u_blue_ratio);
            iris_color_1_hue = mix(.07, .59, iris_color_1_hue);
            iris_color_1_hue = fract(iris_color_1_hue + u_hue_shift);

            vec3 iris_color_1 = hsv2rgb(vec3(iris_color_1_hue, u_saturation, .5 + iris_color_1_hue * .4));
            vec3 iris_color_2 = hsv2rgb(vec3(fract(.67 * randomizer.x - .1 * randomizer.y + u_hue_shift), u_saturation * .8, .1 + .2 * randomizer.y));

            float outer_color_noise = fbm(vec2(angle * 4., cell_radius));
            vec3 color = iris_color_1;
            color = mix(color, iris_color_2, outer_color_noise);

            vec3 iris_center_color = hsv2rgb(vec3(fract(.2 - .1 * randomizer.y + u_hue_shift), u_saturation, .5));
            color = mix(iris_center_color, color, smoothstep(.05 + randomizer.y * .25, .45, cell_radius - .2 * pointer_distance));

            float white_incertion_noise = smoothstep(.4, 1., fbm(vec2(8. * angle, 10. * cell_shape)));
            white_incertion_noise *= (.9 + .5 * randomizer.x);
            color = mix(color, vec3(1.), white_incertion_noise);

            float dark_incertion_noise = smoothstep(.5, 1., fbm(vec2(3. * angle, 11. * cell_shape)));
            color = mix(color, vec3(0.), dark_incertion_noise);

            // dark pupil
            float pupil_shape = smoothstep(.35, .45, 1.2 * eye_radius - pointer_distance);
            color = mix(vec3(.0), color, pupil_shape);

            // darkness on the edge of iris
            color *= pow(smoothstep(1., .6, eye_radius), .3);

            // crop the iris
            float outer_shape = smoothstep(.9, 1., eye_radius);
            color = mix(color, eye_ball_color, outer_shape);

            float blick = smoothstep(1.6, .2, eye_radius + .1 * randomizer.y * sin(3. * u_time * randomizer.x));
            blick *= smoothstep(.5 - pointer_distance, .7, eye_radius - .2 * randomizer.y);
            blick *= (1. - sin(angle + pointer_angle));
            blick = step(1., blick);
            blick *= step(.5, fbm(2. * uv + vec2(0., .5 * u_time)));

            if (u_greenscreen > 0.5) {
                color = mix(color, chroma_green, outer_shape);
            } else {
                // dark cell border
                color -= .1 * pow(1. - cell_shape, 6.);
                color -= .4 * pow(1. - cell_shape, 100.);
            }

            float round_shadow = -sin(angle + pointer_angle);
            round_shadow *= smoothstep(.4, .5, cell_radius);
            round_shadow = .13 * mix(0., round_shadow, 1. - smoothstep(.1, .2, pointer_distance));
            color += round_shadow;

            color = mix(color, vec3(1.), blick);

            return color;
        }

        void main() {
            vec2 uv = vUv;
            uv.x *= u_ratio;

            vec2 _uv = (vUv - .5 + u_offset) / max(u_scale, 0.001) + .5;
            _uv.x *= u_ratio;

            float tile_floating_speed = u_speed * u_time;

            vec2 point = u_pointer;
            point.x *= u_ratio;
            point -= uv;
            float pointer_angle = atan(point.y, point.x);
            float pointer_distance = pow(1. - .5 * length(point), 2.);
            pointer_distance *= .2;

            vec3 color = eye_pattern(_uv, tile_floating_speed, pointer_angle, pointer_distance);

            gl_FragColor = vec4(color, 1.);
        }
    </script>

    <script type="module">
        import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

        const canvasEl = document.querySelector("#eyes-pattern");

        const mouseThreshold = 0.15;
        let dpr = Math.min(window.devicePixelRatio || 1, 2);

        const mouse = {
            x: 0.5 * window.innerWidth,
            y: 0.5 * window.innerHeight,
            tX: 0.5 * window.innerWidth,
            tY: 0.5 * window.innerHeight,
            rawX: 0.5 * window.innerWidth,
            rawY: 0.5 * window.innerHeight,
            isUserActive: false,
            lastUserTime: 0
        };

        const COLOR_PRESETS = {
            "Original Bio": {
                hueShift: 0.0,
                saturation: 0.7,
                blueRatio: 0.5,
                redness: 0.25
            },
            "Cyber Neon": {
                hueShift: 0.52,
                saturation: 0.95,
                blueRatio: 0.9,
                redness: 0.12
            },
            "Abyssal Void": {
                hueShift: 0.73,
                saturation: 0.85,
                blueRatio: 0.18,
                redness: 0.35
            },
            "Infernal Ember": {
                hueShift: 0.95,
                saturation: 0.95,
                blueRatio: 0.05,
                redness: 0.42
            },
            "Toxic Emerald": {
                hueShift: 0.28,
                saturation: 0.9,
                blueRatio: 0.3,
                redness: 0.2
            }
        };

        const ANIMATION_PRESETS = [
            "Static (No Movement)",
            "Hypnotic Wander",
            "Deep Pulse",
            "Surveillance Sweep",
            "Curious Organism"
        ];

        const params = {
            colorScheme: "Original Bio",
            hueShift: 0.0,
            saturation: 0.7,
            blueRatio: 0.5,
            redness: 0.25,
            greenScreen: false,

            animationPreset: "Hypnotic Wander",
            speed: 0.3,
            scale: 0.2,
            dpr: dpr,

            clickRandomize: true,

            panX: 0.0,
            panY: 0.0
        };

        let uniforms = {};
        let gl;
        let controllers = {};
        let gui;
        let baseScale = params.scale;

        // Initialize WebGL
        gl = initShader();
        createControls();
        resizeCanvas();
        window.addEventListener("resize", resizeCanvas);

        // Interaction State for Drag & Zoom
        let isDragging = false;
        let dragStartX = 0;
        let dragStartY = 0;
        let panStartX = 0;
        let panStartY = 0;

        canvasEl.addEventListener("pointerdown", (e) => {
            if (e.button !== 0 && e.pointerType === 'mouse') return;
            isDragging = true;
            dragStartX = e.clientX;
            dragStartY = e.clientY;
            panStartX = params.panX;
            panStartY = params.panY;
            mouse.isUserActive = true;
            mouse.lastUserTime = performance.now();
            updatePointer(e.clientX, e.clientY);
        });

        window.addEventListener("pointermove", (e) => {
            mouse.rawX = e.clientX;
            mouse.rawY = e.clientY;
            
            if (isDragging) {
                const deltaX = e.clientX - dragStartX;
                const deltaY = e.clientY - dragStartY;
                params.panX = panStartX - (deltaX / window.innerWidth) * params.scale;
                params.panY = panStartY + (deltaY / window.innerHeight) * params.scale;
                gl.uniform2f(uniforms.u_offset, params.panX, params.panY);
            }

            mouse.isUserActive = true;
            mouse.lastUserTime = performance.now();
            if (params.animationPreset === "Static (No Movement)" || isDragging) {
                updatePointer(e.clientX, e.clientY);
            }
        });

        window.addEventListener("pointerup", (e) => {
            if (isDragging) {
                const dragDist = Math.hypot(e.clientX - dragStartX, e.clientY - dragStartY);
                isDragging = false;
                
                // If pure click (no drag) and click randomize enabled
                if (dragDist < 6 && params.clickRandomize) {
                    randomizeScene();
                }
            }
        });

        // Wheel Zoom
        window.addEventListener("wheel", (e) => {
            e.preventDefault();
            const zoomFactor = e.deltaY < 0 ? 0.9 : 1.1;
            params.scale = Math.max(0.04, Math.min(0.9, params.scale * zoomFactor));
            baseScale = params.scale;
            gl.uniform1f(uniforms.u_scale, params.scale);
            if (controllers.scale) controllers.scale.updateDisplay();
        }, { passive: false });

        // Hotkey 'H' to toggle UI visibility
        window.addEventListener("keydown", (e) => {
            if (e.key === "h" || e.key === "H") {
                if (['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement?.tagName)) return;
                gui._hidden = !gui._hidden;
                gui.domElement.style.display = gui._hidden ? "none" : "";
            }
        });

        function updatePointer(eX, eY) {
            mouse.tX = eX;
            mouse.tY = eY;
        }

        function randomizeScene() {
            const presetKeys = Object.keys(COLOR_PRESETS);
            const randomPresetName = presetKeys[Math.floor(Math.random() * presetKeys.length)];
            const presetData = COLOR_PRESETS[randomPresetName];

            params.colorScheme = randomPresetName;
            params.hueShift = +(presetData.hueShift + (Math.random() * 0.1 - 0.05 + 1.0) % 1.0).toFixed(3);
            params.saturation = +(0.5 + Math.random() * 0.5).toFixed(2);
            params.blueRatio = +(Math.random()).toFixed(2);
            params.redness = +(0.1 + Math.random() * 0.35).toFixed(2);

            params.scale = +(0.08 + Math.random() * 0.28).toFixed(3);
            baseScale = params.scale;
            params.speed = +(0.15 + Math.random() * 0.55).toFixed(2);

            const randomAnimIndex = Math.floor(Math.random() * ANIMATION_PRESETS.length);
            params.animationPreset = ANIMATION_PRESETS[randomAnimIndex];

            // Apply uniforms
            gl.uniform1f(uniforms.u_scale, params.scale);
            gl.uniform1f(uniforms.u_speed, params.speed);
            gl.uniform1f(uniforms.u_saturation, params.saturation);
            gl.uniform1f(uniforms.u_redness, params.redness);
            gl.uniform1f(uniforms.u_blue_ratio, params.blueRatio);
            gl.uniform1f(uniforms.u_hue_shift, params.hueShift);

            // Update GUI controllers
            updateAllControllers();
        }

        function updateAllControllers() {
            for (const key in controllers) {
                if (controllers[key]) {
                    controllers[key].updateDisplay();
                }
            }
        }

        function applyColorScheme(name) {
            if (COLOR_PRESETS[name]) {
                const p = COLOR_PRESETS[name];
                params.hueShift = p.hueShift;
                params.saturation = p.saturation;
                params.blueRatio = p.blueRatio;
                params.redness = p.redness;

                gl.uniform1f(uniforms.u_hue_shift, params.hueShift);
                gl.uniform1f(uniforms.u_saturation, params.saturation);
                gl.uniform1f(uniforms.u_blue_ratio, params.blueRatio);
                gl.uniform1f(uniforms.u_redness, params.redness);

                updateAllControllers();
            }
        }

        function initShader() {
            const vsSource = document.getElementById("vertShader").innerHTML;
            const fsSource = document.getElementById("fragShader").innerHTML;

            const glContext = canvasEl.getContext("webgl") || canvasEl.getContext("experimental-webgl");

            if (!glContext) {
                alert("WebGL is not supported by your browser.");
                return null;
            }

            function createShader(gl, sourceCode, type) {
                const shader = gl.createShader(type);
                gl.shaderSource(shader, sourceCode);
                gl.compileShader(shader);

                if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                    console.error("Shader compile error: " + gl.getShaderInfoLog(shader));
                    gl.deleteShader(shader);
                    return null;
                }
                return shader;
            }

            const vertexShader = createShader(glContext, vsSource, glContext.VERTEX_SHADER);
            const fragmentShader = createShader(glContext, fsSource, glContext.FRAGMENT_SHADER);

            function createShaderProgram(gl, vShader, fShader) {
                const program = gl.createProgram();
                gl.attachShader(program, vShader);
                gl.attachShader(program, fShader);
                gl.linkProgram(program);

                if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
                    console.error("Shader link error: " + gl.getProgramInfoLog(program));
                    return null;
                }
                return program;
            }

            const shaderProgram = createShaderProgram(glContext, vertexShader, fragmentShader);

            function getUniforms(gl, program) {
                let u = {};
                let count = gl.getProgramParameter(program, gl.ACTIVE_UNIFORMS);
                for (let i = 0; i < count; i++) {
                    let name = gl.getActiveUniform(program, i).name;
                    u[name] = gl.getUniformLocation(program, name);
                }
                return u;
            }

            uniforms = getUniforms(glContext, shaderProgram);

            const vertices = new Float32Array([-1., -1., 1., -1., -1., 1., 1., 1.]);
            const vertexBuffer = glContext.createBuffer();
            glContext.bindBuffer(glContext.ARRAY_BUFFER, vertexBuffer);
            glContext.bufferData(glContext.ARRAY_BUFFER, vertices, glContext.STATIC_DRAW);

            glContext.useProgram(shaderProgram);

            const positionLocation = glContext.getAttribLocation(shaderProgram, "a_position");
            glContext.enableVertexAttribArray(positionLocation);
            glContext.bindBuffer(glContext.ARRAY_BUFFER, vertexBuffer);
            glContext.vertexAttribPointer(positionLocation, 2, glContext.FLOAT, false, 0, 0);

            // Set initial uniforms
            glContext.uniform1f(uniforms.u_scale, params.scale);
            glContext.uniform1f(uniforms.u_speed, params.speed);
            glContext.uniform1f(uniforms.u_saturation, params.saturation);
            glContext.uniform1f(uniforms.u_redness, params.redness);
            glContext.uniform1f(uniforms.u_blue_ratio, params.blueRatio);
            glContext.uniform1f(uniforms.u_hue_shift, params.hueShift);
            glContext.uniform1f(uniforms.u_greenscreen, params.greenScreen ? 1.0 : 0.0);
            glContext.uniform2f(uniforms.u_offset, params.panX, params.panY);

            return glContext;
        }

        function render(timeMs) {
            const timeSeconds = 0.001 * timeMs;

            // Handle Animation Presets
            const w = window.innerWidth;
            const h = window.innerHeight;
            const timeSinceUser = performance.now() - mouse.lastUserTime;

            if (params.animationPreset === "Static (No Movement)") {
                if (timeSinceUser > 1500) {
                    mouse.tX = 0.5 * w;
                    mouse.tY = 0.5 * h;
                }
            } else if (params.animationPreset === "Hypnotic Wander") {
                const autoX = (0.5 + 0.35 * Math.sin(timeSeconds * 0.45) * Math.cos(timeSeconds * 0.25)) * w;
                const autoY = (0.5 + 0.28 * Math.sin(timeSeconds * 0.35)) * h;
                if (timeSinceUser < 1500 && !isDragging) {
                    mouse.tX += (mouse.rawX - mouse.tX) * 0.05;
                    mouse.tY += (mouse.rawY - mouse.tY) * 0.05;
                } else {
                    mouse.tX = autoX;
                    mouse.tY = autoY;
                }
            } else if (params.animationPreset === "Deep Pulse") {
                const pulseScale = baseScale * (1.0 + 0.18 * Math.sin(timeSeconds * 0.6));
                gl.uniform1f(uniforms.u_scale, pulseScale);
                const autoX = (0.5 + 0.22 * Math.cos(timeSeconds * 0.3)) * w;
                const autoY = (0.5 + 0.22 * Math.sin(timeSeconds * 0.3)) * h;
                if (timeSinceUser < 1500 && !isDragging) {
                    mouse.tX += (mouse.rawX - mouse.tX) * 0.05;
                    mouse.tY += (mouse.rawY - mouse.tY) * 0.05;
                } else {
                    mouse.tX = autoX;
                    mouse.tY = autoY;
                }
            } else if (params.animationPreset === "Surveillance Sweep") {
                const sweepX = (0.5 + 0.42 * Math.sin(timeSeconds * 0.4)) * w;
                const sweepY = (0.5 + 0.18 * Math.sin(timeSeconds * 0.8)) * h;
                if (timeSinceUser < 1500 && !isDragging) {
                    mouse.tX += (mouse.rawX - mouse.tX) * 0.05;
                    mouse.tY += (mouse.rawY - mouse.tY) * 0.05;
                } else {
                    mouse.tX = sweepX;
                    mouse.tY = sweepY;
                }
            } else if (params.animationPreset === "Curious Organism") {
                const curX = (0.5 + 0.3 * Math.sin(timeSeconds * 0.25) + 0.12 * Math.sin(timeSeconds * 0.9)) * w;
                const curY = (0.5 + 0.25 * Math.cos(timeSeconds * 0.3) + 0.1 * Math.cos(timeSeconds * 0.75)) * h;
                if (timeSinceUser < 1500 && !isDragging) {
                    mouse.tX += (mouse.rawX - mouse.tX) * 0.05;
                    mouse.tY += (mouse.rawY - mouse.tY) * 0.05;
                } else {
                    mouse.tX = curX;
                    mouse.tY = curY;
                }
            }

            // Smooth pointer easing
            mouse.x += (mouse.tX - mouse.x) * mouseThreshold;
            mouse.y += (mouse.tY - mouse.y) * mouseThreshold;

            gl.uniform1f(uniforms.u_time, timeSeconds);
            gl.uniform2f(uniforms.u_pointer, mouse.x / w, 1.0 - mouse.y / h);

            gl.clearColor(0.0, 0.0, 0.0, 1.0);
            gl.clear(gl.COLOR_BUFFER_BIT);
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

            requestAnimationFrame(render);
        }

        function resizeCanvas() {
            const currentDpr = params.dpr || window.devicePixelRatio || 1;
            canvasEl.width = Math.floor(window.innerWidth * currentDpr);
            canvasEl.height = Math.floor(window.innerHeight * currentDpr);
            gl.viewport(0, 0, canvasEl.width, canvasEl.height);
            gl.uniform1f(uniforms.u_ratio, canvasEl.width / canvasEl.height);
        }

        function createControls() {
            gui = new GUI({ title: "Eyes Pattern Settings" });

            // Color Schemes & Appearance
            const colorFolder = gui.addFolder("Colors & Themes");
            
            controllers.colorScheme = colorFolder.add(params, "colorScheme", Object.keys(COLOR_PRESETS))
                .name("Color Scheme")
                .onChange(v => applyColorScheme(v));

            controllers.greenScreen = colorFolder.add(params, "greenScreen")
                .name("Green Screen (#00ff00)")
                .onChange(v => {
                    gl.uniform1f(uniforms.u_greenscreen, v ? 1.0 : 0.0);
                });

            controllers.hueShift = colorFolder.add(params, "hueShift", 0.0, 1.0, 0.01)
                .name("Hue Shift")
                .onChange(v => {
                    gl.uniform1f(uniforms.u_hue_shift, v);
                });

            controllers.saturation = colorFolder.add(params, "saturation", 0.0, 1.5, 0.01)
                .name("Saturation")
                .onChange(v => {
                    gl.uniform1f(uniforms.u_saturation, v);
                });

            controllers.blueRatio = colorFolder.add(params, "blueRatio", 0.0, 1.0, 0.01)
                .name("Iris Color Bias")
                .onChange(v => {
                    gl.uniform1f(uniforms.u_blue_ratio, v);
                });

            controllers.redness = colorFolder.add(params, "redness", 0.01, 0.6, 0.01)
                .name("Vein Redness")
                .onChange(v => {
                    gl.uniform1f(uniforms.u_redness, v);
                });

            // Motion & Animations
            const animFolder = gui.addFolder("Motion & Camera");

            controllers.animationPreset = animFolder.add(params, "animationPreset", ANIMATION_PRESETS)
                .name("Animation Mode")
                .onChange(v => {
                    if (v !== "Deep Pulse") {
                        gl.uniform1f(uniforms.u_scale, params.scale);
                    }
                });

            controllers.speed = animFolder.add(params, "speed", 0.0, 2.0, 0.02)
                .name("Speed")
                .onChange(v => {
                    gl.uniform1f(uniforms.u_speed, v);
                });

            controllers.scale = animFolder.add(params, "scale", 0.05, 0.7, 0.01)
                .name("Zoom Scale")
                .onChange(v => {
                    baseScale = v;
                    gl.uniform1f(uniforms.u_scale, v);
                });

            // Display & Generation
            const systemFolder = gui.addFolder("System & Interaction");

            controllers.dpr = systemFolder.add(params, "dpr", 0.5, 3.0, 0.25)
                .name("Pixel Ratio (DPR)")
                .onChange(() => {
                    resizeCanvas();
                });

            controllers.clickRandomize = systemFolder.add(params, "clickRandomize")
                .name("Randomize on Click");

            systemFolder.add({ randomize: () => randomizeScene() }, "randomize")
                .name("🎲 Re-roll Scene");

            colorFolder.open();
            animFolder.open();
        }

        // Start render loop
        requestAnimationFrame(render);
    </script>
</body>
</html>
