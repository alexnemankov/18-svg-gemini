      const rad = 110.0;
      microPositions[i * 3] = rad * Math.sin(phi) * Math.cos(theta);
      microPositions[i * 3 + 1] = Math.abs(rad * Math.cos(phi)) + 4.0;
      microPositions[i * 3 + 2] = -Math.abs(rad * Math.sin(phi) * Math.sin(theta)) - 15.0;
    }
    microStarsGeo.setAttribute('position', new THREE.BufferAttribute(microPositions, 3));
    const microStarsMat = new THREE.PointsMaterial({
      color: 0xd0e2ff,
      size: 1.2,
      transparent: true,
      opacity: 0.7,
      depthWrite: false
    });
    const microStars = new THREE.Points(microStarsGeo, microStarsMat);
    starsGroup.add(microStars);

    // --- GROUND PLANE ---
    const groundGroup = new THREE.Group();
    scene.add(groundGroup);

    const groundGeo = new THREE.PlaneGeometry(160, 160);
    groundGeo.rotateX(-Math.PI / 2);
    const groundMat = new THREE.MeshStandardMaterial({
      color: new THREE.Color(COLOR_SCHEMES['Original'].ground),
      roughness: 0.38,
      metalness: 0.22
    });
    const groundMesh = new THREE.Mesh(groundGeo, groundMat);
    groundMesh.position.y = -4.5;
    groundGroup.add(groundMesh);

    // --- FLOATING FESTIVE EMBERS ---
    const particleGroup = new THREE.Group();
    scene.add(particleGroup);

    const particleCount = 140;
    const particleGeo = new THREE.BufferGeometry();
    const particlePos = new Float32Array(particleCount * 3);
    const particleSpeeds = new Float32Array(particleCount);
    const particleSeeds = new Float32Array(particleCount);

    for (let i = 0; i < particleCount; i++) {
      particlePos[i * 3] = (Math.random() - 0.5) * 32.0;
      particlePos[i * 3 + 1] = -4.2 + Math.random() * 18.0;
      particlePos[i * 3 + 2] = -28.0 + Math.random() * 32.0;
      particleSpeeds[i] = 0.25 + Math.random() * 0.45;
      particleSeeds[i] = Math.random() * 100.0;
    }
    particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));

    const particleMat = new THREE.PointsMaterial({
      map: dustTex,
      color: 0xffcc77,
      size: 0.55,
      transparent: true,
      opacity: 0.75,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const particles = new THREE.Points(particleGeo, particleMat);
    particleGroup.add(particles);

    // --- GEOMETRIC GENERATOR FOR AKASH KANDIL ---
    function createAkashKandilGeometry(spikeHeight = 1.85, coreRadius = 1.05) {
      const baseGeo = new THREE.IcosahedronGeometry(coreRadius, 0);
      const nonIndexed = baseGeo.toNonIndexed();
      const posAttr = nonIndexed.attributes.position;
      const numFaces = posAttr.count / 3;

      const positions = [];
      const uvs = [];
      const edgePositions = [];
      const spikeTips = [];

      const vA = new THREE.Vector3();
      const vB = new THREE.Vector3();
      const vC = new THREE.Vector3();
      const centroid = new THREE.Vector3();
      const normal = new THREE.Vector3();
      const tip = new THREE.Vector3();

      for (let i = 0; i < numFaces; i++) {
        vA.fromBufferAttribute(posAttr, i * 3);
        vB.fromBufferAttribute(posAttr, i * 3 + 1);
        vC.fromBufferAttribute(posAttr, i * 3 + 2);

        centroid.copy(vA).add(vB).add(vC).divideScalar(3);
        normal.copy(centroid).normalize();
        tip.copy(centroid).addScaledVector(normal, spikeHeight);
        spikeTips.push(tip.clone());

        positions.push(
          vA.x, vA.y, vA.z,
          vB.x, vB.y, vB.z,
          tip.x, tip.y, tip.z
        );
        uvs.push(0, 0, 1, 0, 0.5, 1);

        positions.push(
          vB.x, vB.y, vB.z,
          vC.x, vC.y, vC.z,
          tip.x, tip.y, tip.z
        );
        uvs.push(0, 0, 1, 0, 0.5, 1);

        positions.push(
          vC.x, vC.y, vC.z,
          vA.x, vA.y, vA.z,
          tip.x, tip.y, tip.z
        );
        uvs.push(0, 0, 1, 0, 0.5, 1);

        edgePositions.push(vA.x, vA.y, vA.z, vB.x, vB.y, vB.z);
        edgePositions.push(vB.x, vB.y, vB.z, vC.x, vC.y, vC.z);
        edgePositions.push(vC.x, vC.y, vC.z, vA.x, vA.y, vA.z);

        edgePositions.push(vA.x, vA.y, vA.z, tip.x, tip.y, tip.z);
        edgePositions.push(vB.x, vB.y, vB.z, tip.x, tip.y, tip.z);
        edgePositions.push(vC.x, vC.y, vC.z, tip.x, tip.y, tip.z);
      }

      const facetGeo = new THREE.BufferGeometry();
      facetGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      facetGeo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      facetGeo.computeVertexNormals();

      const edgeGeo = new THREE.BufferGeometry();
      edgeGeo.setAttribute('position', new THREE.Float32BufferAttribute(edgePositions, 3));

      spikeTips.sort((a, b) => b.y - a.y);
      const topTip = spikeTips[0];
      const bottomTip = spikeTips[spikeTips.length - 1];
      const sideTips = spikeTips.slice(spikeTips.length - 6, spikeTips.length - 1);

      return { facetGeo, edgeGeo, topTip, bottomTip, sideTips };
    }

    const heroGeoData = createAkashKandilGeometry(1.85, 1.05);
    const smallGeoData = createAkashKandilGeometry(1.55, 0.90);

    const allMaterials = {
      heroFacetMats: [],
      heroGoldMats: [],
      rowFacetMats: [],
      rowGoldMats: [],
      tasselMats: [],
      bulbMats: [],
      projMats: []
    };

    // --- LANTERN BUILDER (With Luminous Silk Tassels & Rich Translucent Paper) ---
    const allLanterns = [];
    const heroLanterns = [];

    function buildLantern(config) {
      const isHero = config.isHero || false;
      const lanternRoot = new THREE.Group();
      lanternRoot.position.set(config.x, config.y, config.z);
      lanternRoot.scale.setScalar(config.scale);
      scene.add(lanternRoot);

      const geoData = isHero ? heroGeoData : smallGeoData;

      const bodyGroup = new THREE.Group();
      lanternRoot.add(bodyGroup);

      // Translucent Paper Facet Material: Rich saturated color without blinding blowout
      const facetMat = new THREE.MeshStandardMaterial({
        color: new THREE.Color(config.color),
        roughness: 0.42,
        metalness: 0.05,
        map: jaaliTexture,
        alphaMap: jaaliAlphaTexture,
        alphaTest: 0.16,
        side: THREE.DoubleSide,
        emissive: new THREE.Color(config.color),
        emissiveIntensity: 0.28,
        emissiveMap: jaaliTexture
      });
      if (isHero) allMaterials.heroFacetMats.push(facetMat);
      else allMaterials.rowFacetMats.push(facetMat);

      const facetMesh = new THREE.Mesh(geoData.facetGeo, facetMat);
      bodyGroup.add(facetMesh);

      // Golden Edge Ridges
      const goldMat = new THREE.LineBasicMaterial({
        color: new THREE.Color(COLOR_SCHEMES['Original'].ribs),
        linewidth: 2
      });
      if (isHero) allMaterials.heroGoldMats.push(goldMat);
      else allMaterials.rowGoldMats.push(goldMat);

      const edgeMesh = new THREE.LineSegments(geoData.edgeGeo, goldMat);
      bodyGroup.add(edgeMesh);

      // Hanging Cord
      const cordHeight = 36.0 - config.y;
      const cordGeo = new THREE.CylinderGeometry(0.012, 0.012, cordHeight, 6);
      cordGeo.translate(0, cordHeight / 2, 0);
      const cordMat = new THREE.MeshBasicMaterial({ color: 0xe0c058 });
      const cordMesh = new THREE.Mesh(cordGeo, cordMat);
      cordMesh.position.copy(geoData.topTip);
      bodyGroup.add(cordMesh);

      // Top Ornate Finial Cap
      const topCapGeo = new THREE.ConeGeometry(0.20, 0.42, 12);
      const topCapMat = new THREE.MeshStandardMaterial({
        color: new THREE.Color(COLOR_SCHEMES['Original'].ribs),
        metalness: 0.88,
        roughness: 0.22,
        emissive: new THREE.Color(0x7a5e00),
        emissiveIntensity: 0.15
      });
      const topCap = new THREE.Mesh(topCapGeo, topCapMat);
      topCap.position.copy(geoData.topTip);
      bodyGroup.add(topCap);

      // Bottom Ornate Finial Cap
      const botCapGeo = new THREE.ConeGeometry(0.24, 0.40, 14);
      botCapGeo.rotateX(Math.PI);
      const botCap = new THREE.Mesh(botCapGeo, topCapMat);
      botCap.position.copy(geoData.bottomTip);
      bodyGroup.add(botCap);

      // --- CASCADING SILK RIBBON TASSELS (FIXED: Vibrant, Luminous, Flowing) ---
      const tasselRoot = new THREE.Group();
      tasselRoot.position.copy(geoData.bottomTip);
      bodyGroup.add(tasselRoot);

      const ribbonMeshes = [];
      const ribbonCount = isHero ? 32 : 14;
      const ribbonLength = isHero ? 5.6 : 3.6;

      // Silk Ribbon Material: High vibrance, soft silk sheen & internal glow so it NEVER turns black!
      const tasselMat = new THREE.MeshStandardMaterial({
        color: new THREE.Color(config.tasselColor || config.color),
        emissive: new THREE.Color(config.tasselColor || config.color),
        emissiveIntensity: 0.36, // Guarantees luminous festive silk sheen!
        roughness: 0.30,
        metalness: 0.20,
        side: THREE.DoubleSide
      });
      allMaterials.tasselMats.push(tasselMat);

      // Gold tip bead material for the ends of ribbons
      const goldTipMat = new THREE.MeshStandardMaterial({
        color: new THREE.Color(0xffd700),
        emissive: new THREE.Color(0x997700),
        emissiveIntensity: 0.3,
        metalness: 0.9,
        roughness: 0.2
      });

      // Flared multi-layer arrangement
      for (let i = 0; i < ribbonCount; i++) {
        const layer = (i % 3);
        const ringRad = (layer === 0) ? 0.36 : ((layer === 1) ? 0.22 : 0.12);
        const flareAngle = (layer === 0) ? 0.14 : ((layer === 1) ? 0.08 : 0.02);
        const angle = (i / ribbonCount) * Math.PI * 2 + (Math.random() - 0.5) * 0.15;
        const rLen = ribbonLength * (0.85 + Math.random() * 0.28);
        const rWidth = (isHero ? 0.14 : 0.09) * (0.85 + Math.random() * 0.3);

        const rGeo = new THREE.PlaneGeometry(rWidth, rLen, 1, 10);
        rGeo.translate(0, -rLen / 2, 0);

        const rMesh = new THREE.Mesh(rGeo, tasselMat);
        rMesh.position.set(Math.cos(angle) * ringRad, -0.05, Math.sin(angle) * ringRad);
        rMesh.rotation.y = angle + Math.PI / 2;
        rMesh.rotation.z = Math.sin(angle) * flareAngle;
        tasselRoot.add(rMesh);

        // Little gold bead at the end of each ribbon
        const bead = new THREE.Mesh(new THREE.SphereGeometry(rWidth * 0.45, 6, 6), goldTipMat);
        bead.position.set(0, -rLen, 0);
        rMesh.add(bead);

        const origVerts = new Float32Array(rGeo.attributes.position.array);
        ribbonMeshes.push({
          mesh: rMesh,
          orig: origVerts,
          length: rLen,
          phase: angle + i * 0.35
        });
      }

      // Decorative mini-tassels on side star tips
      if (isHero) {
        geoData.sideTips.forEach((st, sIdx) => {
          const miniTassel = new THREE.Group();
          miniTassel.position.copy(st);
          bodyGroup.add(miniTassel);

          const mCap = new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 8), topCapMat);
          miniTassel.add(mCap);

          for (let m = 0; m < 4; m++) {
            const mLen = 1.4 + Math.random() * 0.5;
            const mGeo = new THREE.PlaneGeometry(0.07, mLen, 1, 6);
            mGeo.translate(0, -mLen / 2, 0);
            const mMesh = new THREE.Mesh(mGeo, tasselMat);
            const mAng = (m / 4) * Math.PI * 2;
            mMesh.position.set(Math.cos(mAng) * 0.08, -0.05, Math.sin(mAng) * 0.08);
            miniTassel.add(mMesh);

            const mBead = new THREE.Mesh(new THREE.SphereGeometry(0.035, 6, 6), goldTipMat);
            mBead.position.set(0, -mLen, 0);
            mMesh.add(mBead);

            ribbonMeshes.push({
              mesh: mMesh,
              orig: new Float32Array(mGeo.attributes.position.array),
              length: mLen,
              phase: sIdx + m * 0.7
            });
          }
        });
      }

      // Inner glowing core (bulb / diya) & Balanced PointLight
      let pointLight = null;
      let tasselLight = null;
      let bulbMesh = null;
      let projMesh = null;

      if (isHero) {
        const bulbMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(config.lightColor) });
        allMaterials.bulbMats.push(bulbMat);
        bulbMesh = new THREE.Mesh(new THREE.SphereGeometry(0.24, 16, 16), bulbMat);
        bodyGroup.add(bulbMesh);

        // Core light: Calibrated intensity to prevent blown out white faces!
        pointLight = new THREE.PointLight(new THREE.Color(config.lightColor), config.lightIntensity || 5.5, 24.0, 1.5);
        bodyGroup.add(pointLight);

        // Downward Tassel Light: Illuminates cascading silk ribbons warmly from above
        tasselLight = new THREE.PointLight(new THREE.Color(config.lightColor), 3.2, 10.0, 1.2);
        tasselLight.position.set(0, geoData.bottomTip.y - 0.25, 0);
        bodyGroup.add(tasselLight);

        // Projected starry caustics on the floor
        const projGeo = new THREE.PlaneGeometry(8.5 * config.scale, 8.5 * config.scale);
        projGeo.rotateX(-Math.PI / 2);
        const projMat = new THREE.MeshBasicMaterial({
          map: starProjectionTex,
          transparent: true,
          opacity: 0.65,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
          color: new THREE.Color(config.lightColor)
        });
        allMaterials.projMats.push(projMat);

        projMesh = new THREE.Mesh(projGeo, projMat);
        projMesh.position.set(config.x, -4.48, config.z);
        scene.add(projMesh);
      }

      const lanternObj = {
        root: lanternRoot,
        bodyGroup: bodyGroup,
        tasselRoot: tasselRoot,
        ribbonMeshes: ribbonMeshes,
        pointLight: pointLight,
        tasselLight: tasselLight,
        bulbMesh: bulbMesh,
        projMesh: projMesh,
        facetMat: facetMat,
        goldMat: goldMat,
        tasselMat: tasselMat,
        isHero: isHero,
        spinDir: config.spinDir || 1,
        spinSpeed: config.spinSpeed || 0.45,
        swayPhase: config.swayPhase || Math.random() * 10,
        swaySpeed: config.swaySpeed || 0.85,
        baseX: config.x,
        baseZ: config.z,
        baseScale: config.scale,
        lightIndex: config.lightIndex
      };

      allLanterns.push(lanternObj);
      if (isHero) heroLanterns.push(lanternObj);

      return lanternObj;
    }

    // --- SCENE COMPOSITION ---
    // 4 HERO LANTERNS (Foreground & Midground, center aisle completely free)
    const hero1 = buildLantern({
      isHero: true,
      x: -5.4,
      y: 3.6,
      z: -2.8,
      scale: 1.35,
      color: '#F6AA1C',
      tasselColor: '#F6AA1C',
      lightColor: params.light1Color,
      lightIntensity: params.light1Intensity,
      spinDir: 1,
      spinSpeed: 0.42,
      swayPhase: 0.2,
      lightIndex: 1
    });

    const hero2 = buildLantern({
      isHero: true,
      x: 5.6,
      y: 5.2,
      z: -5.2,
      scale: 1.45,
      color: '#E63946',
      tasselColor: '#E63946',
      lightColor: params.light2Color,
      lightIntensity: params.light2Intensity,
      spinDir: -1,
      spinSpeed: 0.38,
      swayPhase: 1.8,
      lightIndex: 2
    });

    const hero3 = buildLantern({
      isHero: true,
      x: -6.8,
      y: 1.5,
      z: -9.5,
      scale: 1.15,
      color: '#D62828',
      tasselColor: '#D90429',
      lightColor: params.light3Color,
      lightIntensity: params.light3Intensity,
      spinDir: 1,
      spinSpeed: 0.48,
      swayPhase: 3.4,
      lightIndex: 3
    });

    const hero4 = buildLantern({
      isHero: true,
      x: 5.2,
      y: 2.8,
      z: -12.5,
      scale: 1.10,
      color: '#FCBF49',
      tasselColor: '#F77F00',
      lightColor: params.light4Color,
      lightIntensity: params.light4Intensity,
      spinDir: -1,
      spinSpeed: 0.35,
      swayPhase: 4.9,
      lightIndex: 4
    });

    // RECEDING ROWS OF SMALLER LANTERNS
    const leftRowConfigs = [
      { x: -8.0,  y: 4.3, z: -16.5, scale: 0.85, color: '#F6AA1C' },
      { x: -9.2,  y: 2.4, z: -23.0, scale: 0.74, color: '#E63946' },
      { x: -10.5, y: 5.1, z: -30.5, scale: 0.65, color: '#D62828' },
      { x: -11.8, y: 3.2, z: -39.0, scale: 0.58, color: '#FCBF49' },
      { x: -13.0, y: 4.8, z: -48.0, scale: 0.52, color: '#F77F00' },
      { x: -14.2, y: 2.8, z: -58.0, scale: 0.46, color: '#F6AA1C' },
      { x: -15.5, y: 5.0, z: -69.0, scale: 0.40, color: '#E63946' }
    ];

    const rightRowConfigs = [
      { x: 8.0,   y: 4.6, z: -16.5, scale: 0.85, color: '#FCBF49' },
      { x: 9.2,   y: 2.2, z: -23.0, scale: 0.74, color: '#F77F00' },
      { x: 10.5,  y: 4.9, z: -30.5, scale: 0.65, color: '#F6AA1C' },
      { x: 11.8,  y: 3.3, z: -39.0, scale: 0.58, color: '#E63946' },
      { x: 13.0,  y: 5.1, z: -48.0, scale: 0.52, color: '#D62828' },
      { x: 14.2,  y: 2.7, z: -58.0, scale: 0.46, color: '#FCBF49' },
      { x: 15.5,  y: 4.8, z: -69.0, scale: 0.40, color: '#F77F00' }
    ];

    leftRowConfigs.forEach((cfg, idx) => {
      buildLantern({
        isHero: false,
        x: cfg.x,
        y: cfg.y,
        z: cfg.z,
        scale: cfg.scale,
        color: cfg.color,
        tasselColor: cfg.color,
        spinDir: idx % 2 === 0 ? 1 : -1,
        spinSpeed: 0.3 + (idx % 3) * 0.08,
        swayPhase: idx * 1.1
      });
    });

    rightRowConfigs.forEach((cfg, idx) => {
      buildLantern({
        isHero: false,
        x: cfg.x,
        y: cfg.y,
        z: cfg.z,
        scale: cfg.scale,
        color: cfg.color,
        tasselColor: cfg.color,
        spinDir: idx % 2 === 0 ? -1 : 1,
        spinSpeed: 0.32 + (idx % 3) * 0.07,
        swayPhase: idx * 1.3 + 0.5
      });
    });

    // --- COLOR SCHEME APPLICATION ---
    function applyColorScheme(schemeName, animate = false) {
      const scheme = COLOR_SCHEMES[schemeName] || COLOR_SCHEMES['Original'];
      params.colorScheme = schemeName;

      params.primaryColor = scheme.lanterns[0];
      params.secondaryColor = scheme.lanterns[1] || scheme.lanterns[0];
      params.accentColor = scheme.lanterns[2] || scheme.lanterns[0];
      params.ribColor = scheme.ribs;
      params.skyColor = scheme.bg;
      params.ambientLightColor = scheme.ambient;

      params.light1Color = scheme.lights[0];
      params.light2Color = scheme.lights[1] || scheme.lights[0];
      params.light3Color = scheme.lights[2] || scheme.lights[0];
      params.light4Color = scheme.lights[3] || scheme.lights[1] || scheme.lights[0];

      if (!params.greenscreen) {
        if (animate && window.gsap) {
          gsap.to(scene.background, {
            r: new THREE.Color(scheme.bg).r,
            g: new THREE.Color(scheme.bg).g,
            b: new THREE.Color(scheme.bg).b,
            duration: 0.9
          });
          gsap.to(skyMat.uniforms.topColor.value, {
            r: new THREE.Color(scheme.skyTop).r,
            g: new THREE.Color(scheme.skyTop).g,
            b: new THREE.Color(scheme.skyTop).b,
            duration: 0.9
          });
          gsap.to(skyMat.uniforms.horizonColor.value, {
            r: new THREE.Color(scheme.skyHorizon).r,
            g: new THREE.Color(scheme.skyHorizon).g,
            b: new THREE.Color(scheme.skyHorizon).b,
            duration: 0.9
          });
          gsap.to(groundMat.color, {
            r: new THREE.Color(scheme.ground).r,
            g: new THREE.Color(scheme.ground).g,
            b: new THREE.Color(scheme.ground).b,
            duration: 0.9
          });
          gsap.to(ambientLight.color, {
            r: new THREE.Color(scheme.ambient).r,
            g: new THREE.Color(scheme.ambient).g,
            b: new THREE.Color(scheme.ambient).b,
            duration: 0.9
          });
        } else {
          scene.background.set(scheme.bg);
          skyMat.uniforms.topColor.value.set(scheme.skyTop);
          skyMat.uniforms.horizonColor.value.set(scheme.skyHorizon);
          groundMat.color.set(scheme.ground);
          ambientLight.color.set(scheme.ambient);
        }
      }

      heroLanterns.forEach((hl, idx) => {
        const cHex = scheme.lanterns[idx % scheme.lanterns.length];
        const lHex = scheme.lights[idx % scheme.lights.length];
        const tHex = scheme.tassels[idx % scheme.tassels.length];
        const rHex = scheme.ribs;

        if (animate && window.gsap) {
          gsap.to(hl.facetMat.color, { r: new THREE.Color(cHex).r, g: new THREE.Color(cHex).g, b: new THREE.Color(cHex).b, duration: 0.8 });
          gsap.to(hl.facetMat.emissive, { r: new THREE.Color(cHex).r, g: new THREE.Color(cHex).g, b: new THREE.Color(cHex).b, duration: 0.8 });
          gsap.to(hl.goldMat.color, { r: new THREE.Color(rHex).r, g: new THREE.Color(rHex).g, b: new THREE.Color(rHex).b, duration: 0.8 });
          gsap.to(hl.tasselMat.color, { r: new THREE.Color(tHex).r, g: new THREE.Color(tHex).g, b: new THREE.Color(tHex).b, duration: 0.8 });
          gsap.to(hl.tasselMat.emissive, { r: new THREE.Color(tHex).r, g: new THREE.Color(tHex).g, b: new THREE.Color(tHex).b, duration: 0.8 });
          if (hl.pointLight) gsap.to(hl.pointLight.color, { r: new THREE.Color(lHex).r, g: new THREE.Color(lHex).g, b: new THREE.Color(lHex).b, duration: 0.8 });
          if (hl.tasselLight) gsap.to(hl.tasselLight.color, { r: new THREE.Color(lHex).r, g: new THREE.Color(lHex).g, b: new THREE.Color(lHex).b, duration: 0.8 });
          if (hl.bulbMesh) gsap.to(hl.bulbMesh.material.color, { r: new THREE.Color(lHex).r, g: new THREE.Color(lHex).g, b: new THREE.Color(lHex).b, duration: 0.8 });
          if (hl.projMesh) gsap.to(hl.projMesh.material.color, { r: new THREE.Color(lHex).r, g: new THREE.Color(lHex).g, b: new THREE.Color(lHex).b, duration: 0.8 });
        } else {
          hl.facetMat.color.set(cHex);
          hl.facetMat.emissive.set(cHex);
          hl.goldMat.color.set(rHex);
          hl.tasselMat.color.set(tHex);
          hl.tasselMat.emissive.set(tHex);
          if (hl.pointLight) hl.pointLight.color.set(lHex);
          if (hl.tasselLight) hl.tasselLight.color.set(lHex);
          if (hl.bulbMesh) hl.bulbMesh.material.color.set(lHex);
          if (hl.projMesh) hl.projMesh.material.color.set(lHex);
        }
      });

      allLanterns.forEach((l, idx) => {
        if (!l.isHero) {
          const cHex = scheme.lanterns[idx % scheme.lanterns.length];
          const tHex = scheme.tassels[idx % scheme.tassels.length];
          const rHex = scheme.ribs;
          if (animate && window.gsap) {
            gsap.to(l.facetMat.color, { r: new THREE.Color(cHex).r, g: new THREE.Color(cHex).g, b: new THREE.Color(cHex).b, duration: 0.8 });
            gsap.to(l.facetMat.emissive, { r: new THREE.Color(cHex).r, g: new THREE.Color(cHex).g, b: new THREE.Color(cHex).b, duration: 0.8 });
            gsap.to(l.goldMat.color, { r: new THREE.Color(rHex).r, g: new THREE.Color(rHex).g, b: new THREE.Color(rHex).b, duration: 0.8 });
            gsap.to(l.tasselMat.color, { r: new THREE.Color(tHex).r, g: new THREE.Color(tHex).g, b: new THREE.Color(tHex).b, duration: 0.8 });
            gsap.to(l.tasselMat.emissive, { r: new THREE.Color(tHex).r, g: new THREE.Color(tHex).g, b: new THREE.Color(tHex).b, duration: 0.8 });
          } else {
            l.facetMat.color.set(cHex);
            l.facetMat.emissive.set(cHex);
            l.goldMat.color.set(rHex);
            l.tasselMat.color.set(tHex);
            l.tasselMat.emissive.set(tHex);
          }
        }
      });

      if (window.gui) {
        window.gui.controllersRecursive().forEach(c => c.updateDisplay());
      }
    }

    // --- GREENSCREEN TOGGLE ---
    function setGreenscreen(enabled) {
      params.greenscreen = enabled;
      if (enabled) {
        scene.background = new THREE.Color(0x00ff00);
        skyGroup.visible = false;
        starsGroup.visible = false;
        groundGroup.visible = false;
        particleGroup.visible = false;
        heroLanterns.forEach(hl => { if (hl.projMesh) hl.projMesh.visible = false; });
        postProcessor.settings.enabled = false;
      } else {
        const curScheme = COLOR_SCHEMES[params.colorScheme] || COLOR_SCHEMES['Original'];
        scene.background = new THREE.Color(curScheme.bg);
        skyGroup.visible = true;
        starsGroup.visible = true;
        groundGroup.visible = true;
        particleGroup.visible = true;
        heroLanterns.forEach(hl => { if (hl.projMesh) hl.projMesh.visible = true; });
        postProcessor.settings.enabled = true;
      }
    }

    // --- PROCEDURAL RE-ROLL & VARIATION GENERATOR ---
    // STRICT REQUIREMENT: When clicking for random scene, DO NOT shuffle or change Postprocessing settings!
    function triggerProceduralRandomization() {
      const randScheme = SCHEME_NAMES[Math.floor(Math.random() * SCHEME_NAMES.length)];

      params.animationSpeed = parseFloat((0.65 + Math.random() * 0.75).toFixed(2));
      params.swayIntensity = parseFloat((0.75 + Math.random() * 0.95).toFixed(2));
      params.rotationSpeed = parseFloat((0.65 + Math.random() * 1.15).toFixed(2));
      params.tasselFlow = parseFloat((0.85 + Math.random() * 0.85).toFixed(2));

      params.light1Intensity = parseFloat((4.5 + Math.random() * 2.5).toFixed(1));
      params.light2Intensity = parseFloat((4.8 + Math.random() * 2.5).toFixed(1));
      params.light3Intensity = parseFloat((4.0 + Math.random() * 2.0).toFixed(1));
      params.light4Intensity = parseFloat((4.4 + Math.random() * 2.2).toFixed(1));

      // Notice: postProcessor.settings is strictly NOT touched or randomized!
      // All bloom, rays, anamorphic, chromatic aberration, and antialias settings stay as set by user.

      applyColorScheme(randScheme, true);

      allLanterns.forEach(l => {
        const targetScale = l.baseScale * (0.92 + Math.random() * 0.16);
        gsap.to(l.root.scale, {
          x: targetScale,
          y: targetScale,
          z: targetScale,
          duration: 1.2,
          ease: 'power2.out'
        });
      });

      if (window.gui) {
        window.gui.controllersRecursive().forEach(c => c.updateDisplay());
      }
    }

    // --- CAMERA ANIMATIONS ENGINE ---
    function getCameraModeOffset(mode, t) {
      const v = new THREE.Vector3(0, 0, 0);
      switch (mode) {
        case 'Static (No Camera Motion)':
          break;
        case 'Gentle Floating Orbit':
          break;
        case 'Temple Procession':
          v.z = Math.sin(t * 0.22) * 5.5;
          break;
        case 'Serene Elevation':
          v.y = Math.sin(t * 0.26) * 3.2;
          break;
        case 'Subtle Figure-Eight':
          v.x = Math.sin(t * 0.20) * 3.8;
          v.y = Math.sin(t * 0.40) * 1.6;
          v.z = Math.cos(t * 0.20) * 2.2;
          break;
        case 'Distant Horizon Pan':
          v.x = Math.sin(t * 0.16) * 6.5;
          break;
        case 'Breathing Spiral':
          v.y = Math.sin(t * 0.30) * 2.4;
          break;
        case 'Festival Night Breeze':
          v.x = (Math.sin(t * 0.22) + Math.cos(t * 0.38)) * 1.3;
          v.y = (Math.cos(t * 0.18) + Math.sin(t * 0.44)) * 0.9;
          break;
      }
      return v;
    }

    // --- SETUP LIL-GUI ---
    const gui = new GUI({ title: 'Небесные фонари акаш кандил' });
    window.gui = gui;

    // Folder 1: Visual Theme
    const fTheme = gui.addFolder('Visual Theme');
    fTheme.add(params, 'colorScheme', SCHEME_NAMES).name('Color Scheme').onChange(val => applyColorScheme(val, true));
    fTheme.add(params, 'greenscreen').name('Green Screen (#00ff00)').onChange(val => setGreenscreen(val));
    fTheme.add(params, 'randomizeOnClick').name('Click to Randomize');
    fTheme.add(params, 'randomizeNow').name('Randomize Now');

    // Folder 2: Animation & Camera Motion
    const fAnim = gui.addFolder('Camera & Animation');
    fAnim.add(params, 'cameraAnimation', ANIMATION_NAMES).name('Camera Motion');
    fAnim.add(params, 'animationSpeed', 0.1, 3.0, 0.05).name('Animation Speed');
    fAnim.add(params, 'swayIntensity', 0.0, 2.5, 0.05).name('Lantern Sway');
    fAnim.add(params, 'rotationSpeed', 0.0, 3.0, 0.05).name('Lantern Spin');
    fAnim.add(params, 'tasselFlow', 0.0, 2.5, 0.05).name('Tassel Breeze');

    // Folder 3: Lighting & Exposure
    const fLight = gui.addFolder('Lighting & Exposure');
    fLight.add(params, 'exposure', 0.2, 3.0, 0.05).name('Exposure').onChange(val => {
      params.exposure = val;
      postProcessor.settings.exposure = val;
    });
    fLight.add(params, 'ambientLightIntensity', 0.0, 3.0, 0.05).name('Ambient Light').onChange(val => { ambientLight.intensity = val; });
    fLight.addColor(params, 'ambientLightColor').name('Ambient Color').onChange(val => { ambientLight.color.set(val); });
    fLight.add(params, 'rimLightIntensity', 0.0, 3.0, 0.05).name('Moon / Rim Light').onChange(val => { dirLight.intensity = val; });

    const fHeroLights = fLight.addFolder('Hero Lantern Lights');
    fHeroLights.add(params, 'light1Intensity', 0.0, 20.0, 0.2).name('Hero 1 Intensity');
    fHeroLights.addColor(params, 'light1Color').name('Hero 1 Color').onChange(val => {
      if (hero1.pointLight) hero1.pointLight.color.set(val);
      if (hero1.tasselLight) hero1.tasselLight.color.set(val);
      if (hero1.bulbMesh) hero1.bulbMesh.material.color.set(val);
      if (hero1.projMesh) hero1.projMesh.material.color.set(val);
    });
    fHeroLights.add(params, 'light2Intensity', 0.0, 20.0, 0.2).name('Hero 2 Intensity');
    fHeroLights.addColor(params, 'light2Color').name('Hero 2 Color').onChange(val => {
      if (hero2.pointLight) hero2.pointLight.color.set(val);
      if (hero2.tasselLight) hero2.tasselLight.color.set(val);
      if (hero2.bulbMesh) hero2.bulbMesh.material.color.set(val);
      if (hero2.projMesh) hero2.projMesh.material.color.set(val);
    });
    fHeroLights.add(params, 'light3Intensity', 0.0, 20.0, 0.2).name('Hero 3 Intensity');
    fHeroLights.addColor(params, 'light3Color').name('Hero 3 Color').onChange(val => {
      if (hero3.pointLight) hero3.pointLight.color.set(val);
      if (hero3.tasselLight) hero3.tasselLight.color.set(val);
      if (hero3.bulbMesh) hero3.bulbMesh.material.color.set(val);
      if (hero3.projMesh) hero3.projMesh.material.color.set(val);
    });
    fHeroLights.add(params, 'light4Intensity', 0.0, 20.0, 0.2).name('Hero 4 Intensity');
    fHeroLights.addColor(params, 'light4Color').name('Hero 4 Color').onChange(val => {
      if (hero4.pointLight) hero4.pointLight.color.set(val);
      if (hero4.tasselLight) hero4.tasselLight.color.set(val);
      if (hero4.bulbMesh) hero4.bulbMesh.material.color.set(val);
      if (hero4.projMesh) hero4.projMesh.material.color.set(val);
    });
    fHeroLights.close();

    // Folder 4: PostProcessor Suite (Attached from PostProcessor.js)
    postProcessor.attachGUI(gui, '✨ Post-Processing Suite');

    // Folder 5: Rendering & Hardware Quality
    const fRender = gui.addFolder('Render Quality');
    fRender.add(params, 'antialiasMode', ANTIALIAS_MODES).name('Antialiasing Mode').onChange(v => {
      postProcessor.setAntialiasMode(v);
      gui.controllersRecursive().forEach(c => c.updateDisplay());
    });
    fRender.add(params, 'pixelRatio', 0.5, 3.0, 0.1).name('Pixel Ratio (DPR)').onChange(val => {
      renderer.setPixelRatio(val);
      postProcessor.setSize(window.innerWidth, window.innerHeight, val);
    });

    // Folder 6: Fine-tune Colors
    const fCustom = gui.addFolder('Fine-tune Colors');
    fCustom.addColor(params, 'primaryColor').name('Primary Paper').onChange(val => {
      hero1.facetMat.color.set(val);
      hero1.facetMat.emissive.set(val);
    });
    fCustom.addColor(params, 'secondaryColor').name('Secondary Paper').onChange(val => {
      hero2.facetMat.color.set(val);
      hero2.facetMat.emissive.set(val);
    });
    fCustom.addColor(params, 'accentColor').name('Accent Paper').onChange(val => {
      hero3.facetMat.color.set(val);
      hero3.facetMat.emissive.set(val);
    });
    fCustom.addColor(params, 'ribColor').name('Gold Ribs').onChange(val => {
      allMaterials.heroGoldMats.forEach(m => m.color.set(val));
      allMaterials.rowGoldMats.forEach(m => m.color.set(val));
    });
    fCustom.addColor(params, 'skyColor').name('Night Sky Base').onChange(val => {
      if (!params.greenscreen) scene.background.set(val);
    });
    fCustom.close();

    // Toggle UI with 'H' key
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        gui.show(gui._hidden);
      }
    });

    // Procedural Click Interaction (Distinguishes clicks from camera drags)
    let pointerDownPos = { x: 0, y: 0 };
    let pointerDownTime = 0;

    canvas.addEventListener('pointerdown', (e) => {
      pointerDownPos.x = e.clientX;
      pointerDownPos.y = e.clientY;
      pointerDownTime = performance.now();
    });

    canvas.addEventListener('pointerup', (e) => {
      const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
      const duration = performance.now() - pointerDownTime;
      if (dist < 6 && duration < 380 && params.randomizeOnClick) {
        triggerProceduralRandomization();
      }
    });

    // Resize Handler
    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();

      renderer.setSize(w, h);
      postProcessor.setSize(w, h, params.pixelRatio);
    });

    // --- MAIN ANIMATION LOOP ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const dt = Math.min(delta, 0.1);
      animTime += dt * params.animationSpeed;

      // 1. Camera Motion Processing (Smooth additive translation preserves user wheel zoom!)
      const targetOffset = getCameraModeOffset(params.cameraAnimation, animTime);
      currentModeOffset.lerp(targetOffset, 0.08);

      const deltaTarget = new THREE.Vector3().subVectors(currentModeOffset, prevModeOffset);
      controls.target.add(deltaTarget);
      camera.position.add(deltaTarget);
      prevModeOffset.copy(currentModeOffset);

      const isOrbitMode = (
        params.cameraAnimation === 'Gentle Floating Orbit' ||
        params.cameraAnimation === 'Breathing Spiral' ||
        params.cameraAnimation === 'Festival Night Breeze'
      );
      controls.autoRotate = isOrbitMode;
      if (params.cameraAnimation === 'Gentle Floating Orbit') {
        controls.autoRotateSpeed = 0.38 * params.animationSpeed;
      } else if (params.cameraAnimation === 'Breathing Spiral') {
        controls.autoRotateSpeed = 0.26 * params.animationSpeed;
      } else if (params.cameraAnimation === 'Festival Night Breeze') {
        controls.autoRotateSpeed = 0.13 * params.animationSpeed;
      } else {
        controls.autoRotateSpeed = 0.0;
      }

      controls.update();

      // 2. Distant Celestial Stars Twinkle
      const star1Twinkle = 1.0 + 0.12 * Math.sin(animTime * 3.5) + 0.06 * Math.cos(animTime * 7.1);
      star1.scale.set(4.5 * star1Twinkle, 4.5 * star1Twinkle, 1.0);
      starSpriteMat1.opacity = 0.88 + 0.12 * Math.sin(animTime * 3.5);

      const star2Twinkle = 1.0 + 0.14 * Math.sin(animTime * 4.2 + 2.0);
      star2.scale.set(3.2 * star2Twinkle, 3.2 * star2Twinkle, 1.0);
      starSpriteMat2.opacity = 0.82 + 0.18 * Math.cos(animTime * 4.2 + 2.0);

      // 3. Floating Dust Particles Drift
      const posAttr = particles.geometry.attributes.position;
      const pArr = posAttr.array;
      for (let i = 0; i < particleCount; i++) {
        pArr[i * 3 + 1] += particleSpeeds[i] * dt * params.animationSpeed * 1.2;
        pArr[i * 3] += Math.sin(animTime * 0.8 + particleSeeds[i]) * 0.015 * dt * 60;
        if (pArr[i * 3 + 1] > 16.0) {
          pArr[i * 3 + 1] = -4.3;
        }
      }
      posAttr.needsUpdate = true;

      // 4. Update Lanterns: Rotation, Pendulum Sway, Silk Ribbon Wave Physics & Lights
      allLanterns.forEach(l => {
        l.bodyGroup.rotation.y += dt * l.spinSpeed * l.spinDir * params.rotationSpeed;

        const swayAngleX = Math.sin(animTime * l.swaySpeed + l.swayPhase) * 0.07 * params.swayIntensity;
        const swayAngleZ = Math.cos(animTime * l.swaySpeed * 0.85 + l.swayPhase) * 0.05 * params.swayIntensity;
        l.bodyGroup.rotation.x = swayAngleX;
        l.bodyGroup.rotation.z = swayAngleZ;

        // Fluid wave deformation on silk ribbon tassels (Graceful fluttering in the breeze)
        const ribbonList = l.ribbonMeshes;
        const rLen = ribbonList.length;
        for (let r = 0; r < rLen; r++) {
          const item = ribbonList[r];
          const rPos = item.mesh.geometry.attributes.position;
          const rArr = rPos.array;
          const orig = item.orig;
          const totalVerts = rArr.length / 3;

          for (let j = 0; j < totalVerts; j++) {
            const origY = orig[j * 3 + 1];
            const frac = Math.min(1.0, Math.max(0.0, -origY / item.length));
            const weight = Math.pow(frac, 1.55);

            const waveX = Math.sin(animTime * 2.2 * params.animationSpeed + item.phase + frac * 4.2);
            const waveZ = Math.cos(animTime * 1.8 * params.animationSpeed + item.phase * 1.2 + frac * 3.2);

            rArr[j * 3] = orig[j * 3] + waveX * 0.32 * weight * params.tasselFlow * params.swayIntensity;
            rArr[j * 3 + 2] = orig[j * 3 + 2] + waveZ * 0.24 * weight * params.tasselFlow * params.swayIntensity;
          }
          rPos.needsUpdate = true;
        }

        // Hero Lantern Lights Flicker & Ground Projected Star Caustics
        if (l.isHero && l.pointLight) {
          let baseInt = params.light1Intensity;
          if (l.lightIndex === 2) baseInt = params.light2Intensity;
          else if (l.lightIndex === 3) baseInt = params.light3Intensity;
          else if (l.lightIndex === 4) baseInt = params.light4Intensity;

          const flicker = 1.0 + 0.06 * Math.sin(animTime * 7.7 + l.lightIndex * 3.0) +
                                0.03 * Math.cos(animTime * 14.1 + l.lightIndex);
          l.pointLight.intensity = baseInt * flicker;
          if (l.tasselLight) l.tasselLight.intensity = (baseInt * 0.6) * flicker;

          if (l.projMesh) {
            l.projMesh.rotation.y = l.bodyGroup.rotation.y;
            l.projMesh.position.x = l.baseX + swayAngleZ * 1.8;
            l.projMesh.position.z = l.baseZ - swayAngleX * 1.8;
            l.projMesh.material.opacity = 0.62 * flicker;
          }
        }
      });

      // 5. Render Scene through PostProcessor Suite
      postProcessor.setMoonScreenPosition(camera, new THREE.Vector3(0, 3.2, -4.0));
      postProcessor.renderScene(scene, camera);
    }

    // Initialize scene
    applyColorScheme('Original', false);
    animate();
  </script>
</body>
</html>
