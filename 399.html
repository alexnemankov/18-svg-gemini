  <title>Floral Tapestry - Generative Psychedelic Bloom</title>

  <!-- Import Map for Three.js and lil-gui -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
    }
  }
  </script>

  <script src="https://unpkg.com/vue@3.3.4/dist/vue.global.prod.js"></script>

  <style>
    :root {
      /* Scene Colors */
      --bg-color: #1a052e;
      --leaf-fill: hsla(278, 50%, 60%, 0.6);
      --float-fill: hsla(175.7, 100%, 35.1%, 0.65);
      --flower-fill: hsla(330, 80%, 55%, 0.7);
      --center-fill: #ffffff;
      --stroke-primary: #ffffff;
      --stroke-secondary: #00ffff;
      --stroke-dark: #000000;
      --accent-color: #00f5d4;

      /* Lighting & Exposure */
      --exposure: 1.0;
      --light-intensity: 1.0;
      --float-amp: 15px;
      --float-rot: 3deg;
      --speed-multiplier: 1.0;

      /* SVG Filter & Blend Configuration */
      --svg-blend-mode: hue;
      --svg-filter: invert(1);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-color);
      user-select: none;
      -webkit-user-select: none;
      cursor: grab;
      transition: background-color 0.3s ease;
    }

    body.grabbing {
      cursor: grabbing;
    }

    body.antialias-on {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      shape-rendering: geometricPrecision;
      text-rendering: optimizeLegibility;
    }

    body.antialias-off {
      -webkit-font-smoothing: none;
      -moz-osx-font-smoothing: none;
      shape-rendering: crispEdges;
    }

    /* Green Screen Mode */
    body.greenscreen-active {
      background-color: #00ff00 !important;
    }

    body.greenscreen-active #world-stage,
    body.greenscreen-active #app {
      background: transparent !important;
    }

    body.greenscreen-active svg {
      mix-blend-mode: normal !important;
      filter: none !important;
    }

    body.greenscreen-active #webgl-canvas {
      display: none !important;
    }

    /* Transform World Stage */
    #world-stage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      transform-style: preserve-3d;
      transform-origin: center center;
      pointer-events: auto;
      will-change: transform;
      filter: brightness(calc(var(--exposure) * var(--light-intensity))) contrast(calc(0.94 + var(--exposure) * 0.06));
    }

    /* WebGL Ambient Background Canvas */
    #webgl-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    /* Vue App Container */
    #app {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      z-index: 1;
      pointer-events: none;
    }

    /* SVG Generative Tapestry */
    svg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 115vw;
      height: 115vh;
      z-index: 1;
      mix-blend-mode: var(--svg-blend-mode);
      filter: var(--svg-filter);
      pointer-events: auto;
      will-change: transform;
      transition: filter 0.3s ease, mix-blend-mode 0.3s ease;
    }

    .bm {
      mix-blend-mode: color-dodge;
    }

    .bm2 {
      filter: contrast(1);
      mix-blend-mode: multiply;
    }

    /* Dynamic SVG Fills mapped to CSS variables */
    #svg_28, .flowerFill {
      fill: var(--flower-fill);
      transition: fill 0.3s ease;
    }

    #svg_36 {
      fill: var(--leaf-fill);
      transition: fill 0.3s ease;
    }

    #svg_27 {
      fill: var(--center-fill);
      transition: fill 0.3s ease;
    }

    #flower path[stroke="#fff"],
    #leaf path[stroke="#fff"],
    #flower line[stroke="#fff"] {
      stroke: var(--stroke-primary);
    }

    #flower line[stroke="#000"] {
      stroke: var(--stroke-dark);
    }

    #flower line[stroke="#0fff"] {
      stroke: var(--stroke-secondary);
    }

    .float {
      animation: float 6s ease-in-out alternate infinite;
      will-change: transform, fill;
    }

    @keyframes float {
      0%,
      100% {
        transform: translateY(0) rotate(0deg) scale(1);
        z-index: -20;
      }
      50% {
        transform: translateY(calc(var(--float-amp) * -1)) rotate(var(--float-rot)) scale(1.01);
        fill: var(--float-fill);
        z-index: 20;
      }
    }
  </style>
</head>

    /* ==========================================================================

    function applyColorScheme(name) {
      const scheme = COLOR_SCHEMES[name];
      if (!scheme) return;

      settings.colorScheme = name;
      settings.bgColor = scheme.background;
      settings.leafColor = scheme.leaf;
      settings.floatFillColor = scheme.floatFill;
      settings.flowerColor = scheme.flower;
      settings.centerColor = scheme.center;
      settings.strokePrimary = scheme.strokePrimary;
      settings.strokeSecondary = scheme.strokeSecondary;
      settings.strokeDark = scheme.strokeDark;
      settings.accentColor = scheme.accent;

      settings.ambientColor = scheme.ambientColor;
      settings.keyLightColor = scheme.keyLightColor;
      settings.pointLight1Color = scheme.pointLight1Color;
      settings.pointLight2Color = scheme.pointLight2Color;

      updateCSSVariables();
      updateLighting();
      gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    function updateCSSVariables() {
      const root = document.documentElement;
      const isGreen = settings.greenScreen;

      root.style.setProperty('--bg-color', isGreen ? '#00ff00' : settings.bgColor);
      root.style.setProperty('--leaf-fill', settings.leafColor);
      root.style.setProperty('--float-fill', settings.floatFillColor);
      root.style.setProperty('--flower-fill', settings.flowerColor);
      root.style.setProperty('--center-fill', settings.centerColor);
      root.style.setProperty('--stroke-primary', settings.strokePrimary);
      root.style.setProperty('--stroke-secondary', settings.strokeSecondary);
      root.style.setProperty('--stroke-dark', settings.strokeDark);
      root.style.setProperty('--accent-color', settings.accentColor);

      root.style.setProperty('--exposure', settings.exposure);
      root.style.setProperty('--light-intensity', settings.sceneLightIntensity);
      root.style.setProperty('--float-amp', settings.floatAmp + 'px');
      root.style.setProperty('--float-rot', settings.floatRot + 'deg');
      root.style.setProperty('--speed-multiplier', settings.speed);

      vueAnimationSpeed.value = settings.speed;

      if (isGreen) {
        document.body.classList.add('greenscreen-active');
        particlePoints.visible = false;
        ambientTorus.visible = false;
      } else {
        document.body.classList.remove('greenscreen-active');
        particlePoints.visible = true;
        ambientTorus.visible = true;
      }
    }

    function updateLighting() {
      renderer.toneMappingExposure = settings.exposure;

      ambientLight.color.set(settings.ambientColor);
      ambientLight.intensity = settings.ambientIntensity * settings.sceneLightIntensity;

      keyLight.color.set(settings.keyLightColor);
      keyLight.intensity = settings.keyLightIntensity * settings.sceneLightIntensity;

      pointLight1.color.set(settings.pointLight1Color);
      pointLight1.intensity = settings.pointLight1Intensity * settings.sceneLightIntensity;

      pointLight2.color.set(settings.pointLight2Color);
      pointLight2.intensity = settings.pointLight2Intensity * settings.sceneLightIntensity;

      particleMat.color.set(settings.accentColor);
      torusMat.color.set(settings.ambientColor);

      updateCSSVariables();
    }

    function updateAntialias(enabled) {
      settings.antialias = enabled;
      const oldCanvas = renderer.domElement;
      const parent = oldCanvas.parentElement;
      renderer.dispose();

      const newCanvas = document.createElement('canvas');
      newCanvas.id = 'webgl-canvas';
      parent.replaceChild(newCanvas, oldCanvas);

      renderer = new THREE.WebGLRenderer({
        canvas: newCanvas,
        antialias: settings.antialias,
        alpha: true,
        powerPreference: 'high-performance'
      });
      renderer.setPixelRatio(settings.dpr);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = settings.exposure;

      if (settings.antialias) {
        document.body.classList.add('antialias-on');
        document.body.classList.remove('antialias-off');
      } else {
        document.body.classList.add('antialias-off');
        document.body.classList.remove('antialias-on');
      }
    }

    function resetCameraView() {
      settings.zoom = 1.0;
      settings.panX = 0;
      settings.panY = 0;
      settings.rotX = 0;
      settings.rotY = 0;
      gui.controllersRecursive().forEach(c => {
        if (['zoom', 'panX', 'panY', 'rotX', 'rotY'].includes(c.property)) c.updateDisplay();
      });
    }

    /* ==========================================================================
       Procedural Variation & Re-roll Engine
       ========================================================================== */
    function randomizeScene(force = false) {
      if (!force && !settings.clickRandomize) return;

      // 1. Pick a random color scheme
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      applyColorScheme(randomScheme);

      // 2. Re-roll geometric parameters
      settings.rows = Math.floor(9 + Math.random() * 5);
      settings.flowers = Math.floor(9 + Math.random() * 5);
      settings.floatAmp = Math.floor(10 + Math.random() * 18);
      settings.floatRot = +(1.5 + Math.random() * 5).toFixed(1);

      vueRows.value = settings.rows;
      vueFlowers.value = settings.flowers;
      patternSeed.value++;

      // 3. Re-roll motion & animation
      const activeAnimations = ANIMATION_PRESETS.filter(p => p !== 'Static (No Camera Movement)');
      settings.animationPreset = activeAnimations[Math.floor(Math.random() * activeAnimations.length)];
      settings.speed = +(0.7 + Math.random() * 0.9).toFixed(2);

      // 4. Re-roll lighting dynamics
      settings.exposure = +(0.85 + Math.random() * 0.4).toFixed(2);
      settings.sceneLightIntensity = +(0.85 + Math.random() * 0.45).toFixed(2);

      updateLighting();
      gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    /* ==========================================================================
       Interactive Drag, Zoom & Click Detection
       ========================================================================== */
    let isPointerDown = false;
    let startPointerX = 0;
    let startPointerY = 0;
    let startPanX = 0;
    let startPanY = 0;
    let hasDragged = false;
    let pointerDownTime = 0;

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.lil-gui')) return;

      isPointerDown = true;
      startPointerX = e.clientX;
      startPointerY = e.clientY;
      startPanX = settings.panX;
      startPanY = settings.panY;
      hasDragged = false;
      pointerDownTime = performance.now();
      document.body.classList.add('grabbing');
    });

    window.addEventListener('pointermove', (e) => {
      if (!isPointerDown) return;
      const dx = e.clientX - startPointerX;
      const dy = e.clientY - startPointerY;

      if (Math.hypot(dx, dy) > 5) {
        hasDragged = true;
      }

      if (e.buttons === 2 || e.shiftKey) {
        // Orbit Tilt on Right Click / Shift Drag
        settings.rotY += (e.movementX || 0) * 0.35;
        settings.rotX -= (e.movementY || 0) * 0.35;
        settings.rotX = Math.max(-75, Math.min(75, settings.rotX));
      } else {
        // Drag Pan
        settings.panX = startPanX + dx;
        settings.panY = startPanY + dy;
      }

      gui.controllersRecursive().forEach(c => {
        if (['panX', 'panY', 'rotX', 'rotY'].includes(c.property)) c.updateDisplay();
      });
    });

    window.addEventListener('pointerup', (e) => {
      if (!isPointerDown) return;
      isPointerDown = false;
      document.body.classList.remove('grabbing');

      // Click to randomize scene
      const clickDuration = performance.now() - pointerDownTime;
      if (!hasDragged && clickDuration < 380 && settings.clickRandomize) {
        if (!e.target.closest('.lil-gui')) {
          randomizeScene();
        }
      }
    });

    // Zoom with Mouse Wheel
    window.addEventListener('wheel', (e) => {
      if (e.target.closest('.lil-gui')) return;
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
      settings.zoom = Math.min(Math.max(settings.zoom * zoomFactor, 0.2), 4.5);
      gui.controllersRecursive().forEach(c => {
        if (c.property === 'zoom') c.updateDisplay();
      });
    }, { passive: false });

    // Prevent context menu on 3D rotation drag

      if (!e.target.closest('.lil-gui')) e.preventDefault();
    });

    /* ==========================================================================
       60 FPS RAF Animation Loop
       ========================================================================== */
    let animTime = 0;
    let lastClock = performance.now();

    function renderLoop() {
      requestAnimationFrame(renderLoop);

      const now = performance.now();
      const dt = (now - lastClock) * 0.001;
      lastClock = now;

      if (!settings.paused) {
        animTime += dt * settings.speed;
      }

      // Smooth Camera Animation Presets
      let animPanX = 0;
      let animPanY = 0;
      let animRotX = 0;
      let animRotY = 0;
      let animZoom = 1.0;

      const t = animTime;

      switch (settings.animationPreset) {
        case 'Static (No Camera Movement)':
          break;

        case 'Gentle Botanical Drift':
          animPanX = Math.sin(t * 0.2) * 28;
          animPanY = Math.cos(t * 0.16) * 18;
          animRotY = Math.sin(t * 0.12) * 4;
          animRotX = Math.cos(t * 0.14) * 3;
          animZoom = 1.0 + Math.sin(t * 0.18) * 0.04;
          break;

        case 'Harmonic Lissajous Sway':
          animPanX = Math.sin(t * 0.22) * 38;
          animPanY = Math.sin(t * 0.44) * 22;
          animRotY = Math.sin(t * 0.22) * 6;
          animRotX = Math.cos(t * 0.22) * 4;
          animZoom = 1.0 + Math.sin(t * 0.22) * 0.03;
          break;

        case 'Zenith Horizon Orbit':
          animPanX = Math.cos(t * 0.18) * 50;
          animPanY = Math.sin(t * 0.18) * 24;
          animRotY = Math.sin(t * 0.18) * 8;
          animRotX = Math.cos(t * 0.12) * 5;
          animZoom = 1.02 + Math.sin(t * 0.15) * 0.05;
          break;

        case 'Hypnotic Petal Bloom':
          animPanX = Math.sin(t * 0.14) * 12;
          animPanY = Math.cos(t * 0.14) * 12;
          animRotY = Math.sin(t * 0.1) * 3;
          animRotX = Math.cos(t * 0.1) * 3;
          animZoom = 1.0 + Math.sin(t * 0.28) * 0.12;
          break;

        case 'Meadow Breeze Glide':
          animPanX = Math.sin(t * 0.26) * 55;
          animPanY = Math.abs(Math.sin(t * 0.26)) * 18 - 9;
          animRotY = Math.sin(t * 0.26) * 5;
          animRotX = Math.cos(t * 0.18) * 3;
          animZoom = 1.0 + Math.cos(t * 0.2) * 0.03;
          break;

        case 'Deep Floral Dolly':
          animPanX = Math.sin(t * 0.12) * 15;
          animPanY = Math.sin(t * 0.15) * 16;
          animRotY = Math.sin(t * 0.08) * 4;
          animRotX = Math.cos(t * 0.1) * 3;
          animZoom = 1.0 + Math.sin(t * 0.2) * 0.18;
          break;

        case 'Spiral Kaleidoscope Wave':
          animPanX = Math.sin(t * 0.2) * (20 + 10 * Math.sin(t * 0.05));
          animPanY = Math.cos(t * 0.2) * (20 + 10 * Math.sin(t * 0.05));
          animRotY = Math.sin(t * 0.16) * 7;
          animRotX = Math.cos(t * 0.16) * 6;
          animZoom = 1.04 + Math.sin(t * 0.25) * 0.06;
          break;
      }

      // Compute combined transform
      const finalPanX = settings.panX + animPanX;
      const finalPanY = settings.panY + animPanY;
      const finalZoom = settings.zoom * animZoom;
      const finalRotX = settings.rotX + animRotX;
      const finalRotY = settings.rotY + animRotY;

      stage.style.transform = `translate3d(${finalPanX.toFixed(2)}px, ${finalPanY.toFixed(2)}px, 0) scale(${finalZoom.toFixed(4)}) rotateX(${finalRotX.toFixed(2)}deg) rotateY(${finalRotY.toFixed(2)}deg)`;

      // Three.js Render Updates
      if (!settings.greenScreen) {
        particlePoints.rotation.y = t * 0.04;
        particlePoints.rotation.x = t * 0.02;

        ambientTorus.rotation.x = t * 0.15;
        ambientTorus.rotation.y = t * 0.25;

        // Dynamic light precession
        pointLight1.position.x = Math.sin(t * 0.4) * 45;
        pointLight1.position.y = Math.cos(t * 0.3) * 35;
        pointLight2.position.x = Math.cos(t * 0.35) * 50;
        pointLight2.position.y = Math.sin(t * 0.25) * 40;

        renderer.render(threeScene, threeCamera);
      }
    }

    // Initialize
    applyColorScheme('Original');
    updateCSSVariables();
    updateLighting();
    renderLoop();
  </script>
</body>
</html>
