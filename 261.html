<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Cosmic Particle Vortex</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      width: 100%;
      height: 100vh;
      margin: 0;
      overflow: hidden;
      background-color: #000;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
    }
    canvas:active {
      cursor: grabbing;
    }
  </style>
</head>
<body>
  <canvas id="canv"></canvas>

  <script type="module">
    import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

    // Canvas & 2D Context
    const canvas = document.getElementById('canv');
    const ctx = canvas.getContext('2d');

    // Pan & Zoom State
    const pan = { x: 0, y: 0 };
    let zoom = 1.0;
    let isDragging = false;
    let dragStart = { x: 0, y: 0 };
    let panStart = { x: 0, y: 0 };
    let totalDragDist = 0;

    // Time & PRG State
    let lastTimestamp = performance.now();
    let accumulatedTime = 0;
    let prgSeeds = {
      x: 123456789,
      y: 362436069,
      z: 521288629,
      w: 88675123
    };

    // Marsaglia's Xorshift128 PRG
    function createShift(x, y, z, w) {
      let _x = x || 123456789;
      let _y = y || 362436069;
      let _z = z || 521288629;
      let _w = w || 88675123;
      return function() {
        const s = _x ^ (_x << 11);
        _x = _y;
        _y = _z;
        _z = _w;
        _w = (_w ^ (_w >>> 19)) ^ (s ^ (s >>> 8));
        return _w;
      };
    }

    // 8 Preconfigured Color Schemes
    const COLOR_SCHEMES = {
      'Original Cosmic': {
        bg1: '#7c0432',
        bg2: '#0b0019',
        bg3: '#96053d',
        composite: 'lighter',
        particleMode: 'rainbow',
        col1: '#ff0066',
        col2: '#7928ca',
        col3: '#00dfd8',
        hueShift: 0,
        saturation: 75,
        lightness: 50,
        particleAlpha: 0.8
      },
      'Black & White': {
        bg1: '#000000',
        bg2: '#0c0d12',
        bg3: '#000000',
        composite: 'lighter',
        particleMode: 'mono',
        col1: '#ffffff',
        col2: '#d1d5db',
        col3: '#9ca3af',
        hueShift: 0,
        saturation: 0,
        lightness: 90,
        particleAlpha: 0.85
      },
      'White & Black': {
        bg1: '#ffffff',
        bg2: '#edf0f5',
        bg3: '#ffffff',
        composite: 'source-over',
        particleMode: 'mono',
        col1: '#050508',
        col2: '#1f242d',
        col3: '#374151',
        hueShift: 0,
        saturation: 0,
        lightness: 10,
        particleAlpha: 0.9
      },
      'Cyber Neon': {
        bg1: '#03001e',
        bg2: '#100028',
        bg3: '#050014',
        composite: 'lighter',
        particleMode: 'tri-neon',
        col1: '#00f2fe',
        col2: '#fe0979',
        col3: '#00ff87',
        hueShift: 0,
        saturation: 90,
        lightness: 55,
        particleAlpha: 0.85
      },
      'Solar Flare': {
        bg1: '#1a0500',
        bg2: '#2e0a00',
        bg3: '#140300',
        composite: 'lighter',
        particleMode: 'solar',
        col1: '#ffdd00',
        col2: '#ff5500',
        col3: '#ff1100',
        hueShift: 25,
        saturation: 95,
        lightness: 55,
        particleAlpha: 0.8
      },
      'Bioluminescent Abyss': {
        bg1: '#010c17',
        bg2: '#031f33',
        bg3: '#001021',
        composite: 'lighter',
        particleMode: 'abyss',
        col1: '#00ffd5',
        col2: '#00b4d8',
        col3: '#70e000',
        hueShift: 170,
        saturation: 85,
        lightness: 50,
        particleAlpha: 0.85
      },
      'Aurora Borealis': {
        bg1: '#04091c',
        bg2: '#081733',
        bg3: '#050e24',
        composite: 'lighter',
        particleMode: 'aurora',
        col1: '#05ffa1',
        col2: '#00e5ff',
        col3: '#b967ff',
        hueShift: 135,
        saturation: 85,
        lightness: 55,
        particleAlpha: 0.8
      },
      'Pastel Dream': {
        bg1: '#1b1429',
        bg2: '#281a3d',
        bg3: '#1e1430',
        composite: 'lighter',
        particleMode: 'pastel',
        col1: '#ffb7b2',
        col2: '#b5ead7',
        col3: '#e2f0cb',
        hueShift: 0,
        saturation: 60,
        lightness: 70,
        particleAlpha: 0.8
      }
    };

    // 8 Preconfigured Animation Modes
    const ANIMATION_MODES = [
      'Cosmic Drift (Default)',
      'Static (No Camera Movement)',
      'Infinite Hyperspace Tunnel',
      'Slow Orbital Pan',
      'Harmonic Pendulum',
      'Kaleidoscope Vortex',
      'Zen Floating Ocean',
      'Galactic Spiral Helix'
    ];

    // Master Settings & Parameters
    const params = {
      // Presets & Modes
      colorScheme: 'Original Cosmic',
      animationMode: 'Cosmic Drift (Default)',
      greenScreen: false,
      clickRandomize: true,

      // Animation & Timing
      speed: 1.0,
      zSpeed: 1.0,
      rotationSpeed: 1.0,
      wobbleAmount: 1.0,

      // Display & Geometry
      dpr: Math.min(window.devicePixelRatio || 1, 2),
      particleCount: 300,
      particleScale: 1.0,
      blendMode: 'lighter',
      starPoints: 10,
      arcBloom: 1.0,

      // Shading & Colors
      bg1: COLOR_SCHEMES['Original Cosmic'].bg1,
      bg2: COLOR_SCHEMES['Original Cosmic'].bg2,
      bg3: COLOR_SCHEMES['Original Cosmic'].bg3,
      particleCol1: COLOR_SCHEMES['Original Cosmic'].col1,
      particleCol2: COLOR_SCHEMES['Original Cosmic'].col2,
      particleCol3: COLOR_SCHEMES['Original Cosmic'].col3,
      hueShift: 0,
      saturation: 75,
      lightness: 50,
      particleAlpha: 0.8,
      customColors: false,

      // Transform Controls
      zoom: 1.0,
      panX: 0,
      panY: 0,

      // Action Triggers
      resetView: () => {
        pan.x = 0;
        pan.y = 0;
        zoom = 1.0;
        params.panX = 0;
        params.panY = 0;
        params.zoom = 1.0;
        syncGui();
      },
      randomizeScene: () => {
        randomizeParameters();
      }
    };

    // Apply a named color scheme
    function applyColorScheme(name) {
      const scheme = COLOR_SCHEMES[name];
      if (!scheme) return;
      params.colorScheme = name;
      params.bg1 = scheme.bg1;
      params.bg2 = scheme.bg2;
      params.bg3 = scheme.bg3;
      params.blendMode = scheme.composite;
      params.particleCol1 = scheme.col1;
      params.particleCol2 = scheme.col2;
      params.particleCol3 = scheme.col3;
      params.hueShift = scheme.hueShift;
      params.saturation = scheme.saturation;
      params.lightness = scheme.lightness;
      params.particleAlpha = scheme.particleAlpha;
      params.customColors = false;
      syncGui();
    }

    // Helper: Hex / Color to RGBA string
    function hexToRgba(hex, alpha) {
      if (hex.startsWith('hsl')) return hex;
      let c = hex.replace('#', '');
      if (c.length === 3) c = c.split('').map(x => x + x).join('');
      const num = parseInt(c, 16);
      const r = (num >> 16) & 255;
      const g = (num >> 8) & 255;
      const b = num & 255;
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    // Random Procedural Generator
    function randomizeParameters() {
      // Re-roll PRG seeds
      prgSeeds.x = Math.floor(Math.random() * 0xffffffff);
      prgSeeds.y = Math.floor(Math.random() * 0xffffffff);
      prgSeeds.z = Math.floor(Math.random() * 0xffffffff);
      prgSeeds.w = Math.floor(Math.random() * 0xffffffff);

      // Random Scheme & Animation
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      applyColorScheme(randomScheme);

      const randomAnim = ANIMATION_MODES[Math.floor(Math.random() * ANIMATION_MODES.length)];
      params.animationMode = randomAnim;

      // Randomize Motion & Geometry
      params.speed = parseFloat((0.6 + Math.random() * 1.0).toFixed(2));
      params.zSpeed = parseFloat((0.6 + Math.random() * 1.2).toFixed(2));
      params.rotationSpeed = parseFloat((0.5 + Math.random() * 1.2).toFixed(2));
      params.wobbleAmount = parseFloat((0.4 + Math.random() * 1.4).toFixed(2));

      params.particleCount = Math.floor(150 + Math.random() * 300);
      params.particleScale = parseFloat((0.7 + Math.random() * 0.9).toFixed(2));
      params.starPoints = Math.floor(4 + Math.random() * 12);
      params.arcBloom = parseFloat((0.5 + Math.random() * 1.5).toFixed(2));

      params.hueShift = Math.floor(Math.random() * 360);

      syncGui();
    }

    // GUI Initialization
    const gui = new GUI({ title: 'Cosmic Vortex Settings' });
    let guiHidden = false;

    // Build GUI folders
    const fPresets = gui.addFolder('Presets & Modes');
    fPresets.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Color Scheme').onChange(applyColorScheme);
    fPresets.add(params, 'animationMode', ANIMATION_MODES).name('Animation');
    fPresets.add(params, 'greenScreen').name('Green Screen (#00ff00)');
    fPresets.add(params, 'clickRandomize').name('Click to Randomize');
    fPresets.add(params, 'randomizeScene').name('🎲 Randomize Scene');

    const fMotion = gui.addFolder('Motion & Dynamics');
    fMotion.add(params, 'speed', 0.0, 3.0, 0.05).name('Animation Speed');
    fMotion.add(params, 'zSpeed', 0.0, 2.5, 0.05).name('Z-Travel Speed');
    fMotion.add(params, 'rotationSpeed', 0.0, 3.0, 0.05).name('Rotation Speed');
    fMotion.add(params, 'wobbleAmount', 0.0, 2.5, 0.05).name('Wobble / Pulse');

    const fDisplay = gui.addFolder('Geometry & Rendering');
    fDisplay.add(params, 'dpr', 0.5, 3.0, 0.25).name('DPR (Pixel Ratio)').onChange(resizeCanvas);
    fDisplay.add(params, 'particleCount', 50, 600, 10).name('Particle Count');
    fDisplay.add(params, 'particleScale', 0.2, 3.0, 0.05).name('Particle Scale');
    fDisplay.add(params, 'starPoints', 3, 20, 1).name('Star Rays');
    fDisplay.add(params, 'arcBloom', 0.0, 3.0, 0.1).name('Arc Bloom Size');
    fDisplay.add(params, 'blendMode', ['lighter', 'source-over', 'screen', 'multiply']).name('Blend Mode');

    const fColors = gui.addFolder('Colors & Shading');
    fColors.add(params, 'customColors').name('Enable Custom Colors');
    fColors.addColor(params, 'bg1').name('Background 1');
    fColors.addColor(params, 'bg2').name('Background 2');
    fColors.addColor(params, 'bg3').name('Background 3');
    fColors.addColor(params, 'particleCol1').name('Particle Col 1');
    fColors.addColor(params, 'particleCol2').name('Particle Col 2');
    fColors.addColor(params, 'particleCol3').name('Particle Col 3');
    fColors.add(params, 'hueShift', 0, 360, 1).name('Hue Shift');
    fColors.add(params, 'saturation', 0, 100, 1).name('Saturation %');
    fColors.add(params, 'lightness', 0, 100, 1).name('Lightness %');
    fColors.add(params, 'particleAlpha', 0.1, 1.0, 0.05).name('Particle Alpha');

    const fTransform = gui.addFolder('Camera & Transform');
    fTransform.add(params, 'zoom', 0.1, 10.0, 0.05).name('Zoom Level').onChange(v => { zoom = v; });
    fTransform.add(params, 'panX', -1000, 1000, 1).name('Pan X').onChange(v => { pan.x = v; });
    fTransform.add(params, 'panY', -1000, 1000, 1).name('Pan Y').onChange(v => { pan.y = v; });
    fTransform.add(params, 'resetView').name('Reset View (Pan/Zoom)');

    // Synchronize all controllers with state
    function syncGui() {
      gui.controllersRecursive().forEach(controller => controller.updateDisplay());
    }

    // Toggle UI with "H" key
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        guiHidden = !guiHidden;
        gui.show(!guiHidden);
      }
    });

    // Canvas Resizing with DPR
    function resizeCanvas() {
      const dpr = params.dpr;
      const w = window.innerWidth;
      const h = window.innerHeight;
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
    }
    window.addEventListener('resize', resizeCanvas, false);
    resizeCanvas();

    // Mouse & Touch Dragging (Pan)
    canvas.addEventListener('pointerdown', (e) => {
      isDragging = true;
      dragStart.x = e.clientX;
      dragStart.y = e.clientY;
      panStart.x = pan.x;
      panStart.y = pan.y;
      totalDragDist = 0;
      canvas.setPointerCapture(e.pointerId);
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - dragStart.x;
      const dy = e.clientY - dragStart.y;
      totalDragDist = Math.hypot(dx, dy);
      pan.x = panStart.x + dx;
      pan.y = panStart.y + dy;
      params.panX = Math.round(pan.x);
      params.panY = Math.round(pan.y);
      syncGui();
    });

    canvas.addEventListener('pointerup', (e) => {
      if (isDragging) {
        isDragging = false;
        canvas.releasePointerCapture(e.pointerId);
        // If click without significant drag (< 6px), trigger click randomization
        if (totalDragDist < 6 && params.clickRandomize) {
          randomizeParameters();
        }
      }
    });

    canvas.addEventListener('pointercancel', () => {
      isDragging = false;
    });

    // Zoom with Wheel
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.1 : 0.909;
      zoom = Math.max(0.1, Math.min(10.0, zoom * zoomFactor));
      params.zoom = parseFloat(zoom.toFixed(3));
      syncGui();
    }, { passive: false });

    // Render Function
    function render(currentTime) {
      window.requestAnimationFrame(render);

      const dt = Math.min((currentTime - lastTimestamp) / 1000, 0.1);
      lastTimestamp = currentTime;
      accumulatedTime += dt * params.speed;

      const t = accumulatedTime;
      const dpr = params.dpr;
      const width = window.innerWidth;
      const height = window.innerHeight;

      // Reset transform and clear
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      // Background Rendering
      if (params.greenScreen) {
        ctx.fillStyle = '#00ff00';
        ctx.fillRect(0, 0, width, height);
      } else {
        const bgGrad = ctx.createLinearGradient(0, 0, width, height);
        bgGrad.addColorStop(0.0, params.bg1);
        bgGrad.addColorStop(0.5, params.bg2);
        bgGrad.addColorStop(1.0, params.bg3);
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, width, height);
      }

      // Animation Motion Equations
      let yaw = 0;
      let pitch = 2.4;
      let roll = 0;
      let zTravel = t * 0.5 * params.zSpeed;
      const wob = params.wobbleAmount;
      const rot = params.rotationSpeed;

      switch (params.animationMode) {
        case 'Static (No Camera Movement)':
          yaw = 0;
          pitch = 2.4;
          roll = 0;
          zTravel = t * 0.3 * params.zSpeed;
          break;

        case 'Infinite Hyperspace Tunnel':
          yaw = 0;
          pitch = Math.PI * 0.5 + Math.sin(t * 0.3 * rot) * 0.05 * wob;
          roll = (t * 0.15 * rot) % (Math.PI * 2);
          zTravel = t * 0.8 * params.zSpeed;
          break;

        case 'Slow Orbital Pan':
          yaw = t * 0.25 * rot;
          pitch = 1.8 + Math.cos(t * 0.2 * rot) * 0.35 * wob;
          roll = Math.sin(t * 0.15) * 0.1 * wob;
          zTravel = t * 0.2 * params.zSpeed;
          break;

        case 'Harmonic Pendulum':
          yaw = Math.sin(t * 0.4 * rot) * 0.6 * wob;
          pitch = 2.4 + Math.cos(t * 0.6 * rot) * 0.3 * wob;
          roll = Math.sin(t * 0.25 * rot) * 0.2 * wob;
          zTravel = t * 0.4 * params.zSpeed;
          break;

        case 'Kaleidoscope Vortex':
          yaw = Math.sin(t * 0.2 * rot) * 0.3 * wob;
          pitch = 2.2 + Math.cos(t * 0.3 * rot) * 0.2 * wob;
          roll = (t * 0.35 * rot) % (Math.PI * 2);
          zTravel = t * 0.5 * params.zSpeed;
          break;

        case 'Zen Floating Ocean':
          yaw = Math.sin(t * 0.12 * rot) * 0.35 * wob;
          pitch = 2.4 + Math.sin(t * 0.15 * rot) * 0.25 * wob;
          roll = Math.cos(t * 0.1 * rot) * 0.15 * wob;
          zTravel = t * 0.2 * params.zSpeed;
          break;

        case 'Galactic Spiral Helix':
          yaw = t * 0.35 * rot;
          pitch = 2.0 + Math.sin(t * 0.3 * rot) * 0.45 * wob;
          roll = (-t * 0.2 * rot) % (Math.PI * 2);
          zTravel = t * 0.45 * params.zSpeed;
          break;

        case 'Cosmic Drift (Default)':
        default:
          yaw = t * 0.3 * rot;
          pitch = 2.4 + Math.sin(t * 0.2 * rot) * 0.15 * wob;
          roll = (t * 0.2 * rot) % (Math.PI * 2);
          zTravel = t * 0.5 * params.zSpeed;
          break;
      }

      const yawCos = Math.cos(yaw);
      const yawSin = Math.sin(yaw);
      const pitchCos = Math.cos(pitch);
      const pitchSin = Math.sin(pitch);

      // Center Coordinate Transform + Pan + Zoom
      const scBase = Math.max(width, height);
      ctx.translate(width * 0.5 + pan.x, height * 0.5 + pan.y);
      ctx.scale(scBase * zoom, scBase * zoom);

      // Composite Blend Mode
      ctx.globalCompositeOperation = params.greenScreen ? 'source-over' : params.blendMode;

      // 2D Canvas Roll
      ctx.rotate(roll);

      // Instantiate PRG with current seeds
      const rnd = createShift(prgSeeds.x, prgSeeds.y, prgSeeds.z, prgSeeds.w);
      const pCount = params.particleCount;
      const scheme = COLOR_SCHEMES[params.colorScheme] || COLOR_SCHEMES['Original Cosmic'];
      const pScale = params.particleScale;
      const pts = params.starPoints;
      const bloom = params.arcBloom;
      const baseAlpha = params.particleAlpha;

      for (let i = 0; i < pCount; i++) {
        const p = rnd();
        let x = (p & 0xff) / 128 - 1;
        let y = ((p >>> 8) & 0xff) / 128 - 1;
        let z = ((p >>> 16) & 0xff) / 128 - 1;

        // Z-Motion looping in [-1, 1]
        z += zTravel;
        z = ((z + 1) % 2 + 2) % 2 - 1;

        // Alpha fade calculation based on Z depth
        let a = (z + 1) * 0.5;
        let pAlpha;
        if (a < 0.9) {
          pAlpha = (a / 0.7) * baseAlpha;
        } else {
          a -= 0.9;
          pAlpha = (1 - a / 0.1) * baseAlpha;
        }
        if (pAlpha <= 0) continue;
        ctx.globalAlpha = Math.max(0, Math.min(1, pAlpha));

        // 3D Yaw (X/Y plane rotation)
        let cur = x * yawCos + y * yawSin;
        y = x * yawSin - y * yawCos;
        x = cur;

        // 3D Pitch (Y/Z plane rotation)
        cur = y * pitchCos + z * pitchSin;
        z = y * pitchSin - z * pitchCos;
        y = cur;

        // Camera distance shift
        z -= 0.65;
        if (z >= 0) continue; // Behind camera

        // Perspective Projection
        const sc = 0.1 / z;
        x *= sc;
        y *= sc;

        ctx.save();

        // Radial Gradient for particle
        const g1 = ctx.createRadialGradient(1, 1, 2, 1, 1, 1);

        if (params.customColors) {
          // Custom color interpolation
          const ratio = (i % 100) / 100;
          g1.addColorStop(0.0, hexToRgba(params.particleCol1, 0.8 * baseAlpha));
          g1.addColorStop(0.5, hexToRgba(params.particleCol2, 1.0 * baseAlpha));
          g1.addColorStop(1.0, hexToRgba(params.particleCol3, 0.8 * baseAlpha));
        } else {
          // Scheme-specific particle gradient
          const pMode = scheme.particleMode;
          if (pMode === 'rainbow') {
            const h = (i + params.hueShift) % 360;
            g1.addColorStop(0.0, `hsla(${h}, ${params.saturation}%, ${Math.max(10, params.lightness - 10)}%, 0.8)`);
            g1.addColorStop(0.5, `hsla(${h}, ${params.saturation}%, ${params.lightness}%, 1)`);
            g1.addColorStop(1.0, `hsla(${h}, ${params.saturation}%, ${Math.min(95, params.lightness + 10)}%, 0.8)`);
          } else if (pMode === 'mono') {
            const l = params.lightness;
            const s = params.saturation;
            g1.addColorStop(0.0, `hsla(0, ${s}%, ${l}%, 0.8)`);
            g1.addColorStop(0.5, `hsla(0, ${s}%, ${Math.min(100, l + 10)}%, 1)`);
            g1.addColorStop(1.0, `hsla(0, ${s}%, ${Math.max(0, l - 10)}%, 0.8)`);
          } else if (pMode === 'tri-neon') {
            const hues = [(185 + params.hueShift) % 360, (320 + params.hueShift) % 360, (140 + params.hueShift) % 360];
            const h = hues[i % 3];
            g1.addColorStop(0.0, `hsla(${h}, 90%, 45%, 0.8)`);
            g1.addColorStop(0.5, `hsla(${h}, 95%, 55%, 1)`);
            g1.addColorStop(1.0, `hsla(${h}, 100%, 65%, 0.8)`);
          } else if (pMode === 'solar') {
            const h = (20 + (i % 45) + params.hueShift) % 360;
            g1.addColorStop(0.0, `hsla(${h}, 95%, 45%, 0.8)`);
            g1.addColorStop(0.5, `hsla(${h}, 100%, 55%, 1)`);
            g1.addColorStop(1.0, `hsla(${h}, 100%, 70%, 0.8)`);
          } else if (pMode === 'abyss') {
            const h = (160 + (i % 60) + params.hueShift) % 360;
            g1.addColorStop(0.0, `hsla(${h}, 85%, 40%, 0.8)`);
            g1.addColorStop(0.5, `hsla(${h}, 90%, 50%, 1)`);
            g1.addColorStop(1.0, `hsla(${h}, 95%, 65%, 0.8)`);
          } else if (pMode === 'aurora') {
            const h = (130 + ((i * 4) % 150) + params.hueShift) % 360;
            g1.addColorStop(0.0, `hsla(${h}, 85%, 45%, 0.8)`);
            g1.addColorStop(0.5, `hsla(${h}, 90%, 55%, 1)`);
            g1.addColorStop(1.0, `hsla(${h}, 95%, 65%, 0.8)`);
          } else if (pMode === 'pastel') {
            const h = (i * 2 + params.hueShift) % 360;
            g1.addColorStop(0.0, `hsla(${h}, 60%, 65%, 0.8)`);
            g1.addColorStop(0.5, `hsla(${h}, 65%, 75%, 1)`);
            g1.addColorStop(1.0, `hsla(${h}, 70%, 85%, 0.8)`);
          } else {
            const h = (i + params.hueShift) % 360;
            g1.addColorStop(0.0, `hsla(${h}, ${params.saturation}%, ${params.lightness}%, 0.8)`);
            g1.addColorStop(0.5, `hsla(${h}, ${params.saturation}%, ${params.lightness}%, 1)`);
            g1.addColorStop(1.0, `hsla(${h}, ${params.saturation}%, ${params.lightness}%, 0.8)`);
          }
        }

        ctx.fillStyle = g1;
        ctx.translate(x, y);

        const starScale = sc * 0.017 * pScale;
        ctx.scale(starScale, starScale);

        // Draw geometric starburst blossom
        ctx.beginPath();
        ctx.moveTo(2, 0);
        const stepAngle = (Math.PI * 2) / pts;
        for (let j = 0; j < pts; j++) {
          ctx.rotate(stepAngle);
          ctx.lineTo((j % 2) + 1, 0);
        }
        if (bloom > 0.01) {
          ctx.arc(10 * bloom, 10 * bloom, 1 * bloom, 0, Math.PI * 2);
        }
        ctx.rotate(Math.PI * 0.2);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
      }
    }

    // Launch render loop
    window.requestAnimationFrame(render);
  </script>
</body>
</html>
