        function createRenderer(antialias) {
            if (renderer) {
                renderer.dispose();
                if (renderer.domElement && renderer.domElement.parentNode) {
                    renderer.domElement.parentNode.removeChild(renderer.domElement);
                }
            }
            renderer = new THREE.WebGLRenderer({
                antialias: antialias,
                powerPreference: 'high-performance',
                alpha: false
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(settings.dpr);
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = settings.exposure;
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            document.body.appendChild(renderer.domElement);

            if (controls) {
                controls.domElement = renderer.domElement;
            }
            if (postProcessor) {
                postProcessor.renderer = renderer;
                postProcessor.setAntialias(antialias);
                postProcessor.setSize(window.innerWidth, window.innerHeight, settings.dpr);
            }
        }

        // --- Screen-Space Background Backdrop ---
        function createBackdrop() {
            const bgGeom = new THREE.PlaneGeometry(2, 2);
            const bgMat = new THREE.ShaderMaterial({
                depthWrite: false,
                depthTest: false,
                uniforms: {
                    uColorInner: { value: new THREE.Color(settings.bgInner) },
                    uColorOuter: { value: new THREE.Color(settings.bgOuter) },
                    uGreenScreen: { value: settings.greenscreen },
                    uVignettePower: { value: 1.35 }
                },
                vertexShader: `
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        gl_Position = vec4(position.xy, 0.99999, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform vec3 uColorInner;
                    uniform vec3 uColorOuter;
                    uniform bool uGreenScreen;
                    uniform float uVignettePower;
                    varying vec2 vUv;

                    void main() {
                        if (uGreenScreen) {
                            gl_FragColor = vec4(0.0, 1.0, 0.0, 1.0);
                        } else {
                            vec2 coord = (vUv - 0.5) * vec2(1.25, 1.0);
                            float d = length(coord);
                            float factor = clamp(pow(d * 1.45, uVignettePower), 0.0, 1.0);
                            vec3 col = mix(uColorInner, uColorOuter, factor);
                            gl_FragColor = vec4(col, 1.0);
                        }
                    }
                `
            });
            bgMesh = new THREE.Mesh(bgGeom, bgMat);
            bgMesh.frustumCulled = false;
            bgMesh.renderOrder = -1000;
            scene.add(bgMesh);
        }

        // --- 3D Garland Strands & Bulbs ---
        function createTunnelGarlands() {
            const numStrands = 18;
            const bulbsPerStrandPeriod = 95;
            const totalPeriods = 3;
            const totalBulbs = numStrands * bulbsPerStrandPeriod * totalPeriods;

            const bulbPositions = new Float32Array(totalBulbs * 3);
            const aType = new Float32Array(totalBulbs);
            const aTwinkleFreq = new Float32Array(totalBulbs);
            const aTwinklePhase = new Float32Array(totalBulbs);
            const aBulbSize = new Float32Array(totalBulbs);
            const aSparkle = new Float32Array(totalBulbs);

            const wireVertices = [];
            let bulbIdx = 0;

            for (let period = -1; period <= 1; period++) {
                const zPeriodBase = period * TUNNEL_PERIOD;

                for (let s = 0; s < numStrands; s++) {
                    const baseTheta = (s / numStrands) * Math.PI * 2;
                    let prevPos = null;

                    for (let b = 0; b < bulbsPerStrandPeriod; b++) {
                        const localZRatio = b / bulbsPerStrandPeriod;
                        const z = zPeriodBase - TUNNEL_PERIOD * 0.5 + localZRatio * TUNNEL_PERIOD;

                        const theta = baseTheta + (z / TUNNEL_PERIOD) * (Math.PI * 4);
                        const rWave = Math.sin((z / TUNNEL_PERIOD) * (Math.PI * 4) + s * 0.4) * 1.6;
                        const baseRadius = 12.5 + rWave;

                        let x = Math.cos(theta) * baseRadius;
                        let y = Math.sin(theta) * baseRadius;

                        // Catenary sag for realistic hanging garlands
                        const sagRatio = (b % 7) / 6.0;
                        const sag = (1.0 - Math.pow(2.0 * sagRatio - 1.0, 2.0)) * 0.5;
                        y -= sag * 0.8;
                        x -= (x / baseRadius) * sag * 0.3;

                        const jX = Math.sin(b * 12.7 + s) * 0.12;
                        const jY = Math.cos(b * 8.3 + s) * 0.12;

                        const finalX = x + jX;
                        const finalY = y + jY;

                        bulbPositions[bulbIdx * 3 + 0] = finalX;
                        bulbPositions[bulbIdx * 3 + 1] = finalY;
                        bulbPositions[bulbIdx * 3 + 2] = z;

                        // 80% warm golden bulbs, 20% sparkling white bulbs
                        const isSparkle = Math.random() > 0.8 ? 1.0 : 0.0;
                        aType[bulbIdx] = isSparkle;
                        aTwinkleFreq[bulbIdx] = 1.0 + Math.random() * 2.2;
                        aTwinklePhase[bulbIdx] = Math.random() * Math.PI * 2;
                        aBulbSize[bulbIdx] = isSparkle ? (1.05 + Math.random() * 0.3) : (0.9 + Math.random() * 0.25);
                        aSparkle[bulbIdx] = isSparkle ? 1.0 : (Math.random() > 0.7 ? 0.4 : 0.0);

                        const currentPos = new THREE.Vector3(finalX, finalY, z);
                        if (prevPos && Math.abs(currentPos.z - prevPos.z) < 6.0) {
                            const steps = 3;
                            let subPrev = prevPos.clone();
                            for (let st = 1; st <= steps; st++) {
                                const stRatio = st / steps;
                                const subCurr = new THREE.Vector3().lerpVectors(prevPos, currentPos, stRatio);
                                const subSag = (1.0 - Math.pow(2.0 * stRatio - 1.0, 2.0)) * 0.2;
                                subCurr.y -= subSag;

                                wireVertices.push(subPrev.x, subPrev.y, subPrev.z);
                                wireVertices.push(subCurr.x, subCurr.y, subCurr.z);
                                subPrev = subCurr;
                            }
                        }
                        prevPos = currentPos;
                        bulbIdx++;
                    }
                }
            }

            // Bulb Geometry & Shader using NormalBlending for authentic translucent bokeh layering
            const bulbGeom = new THREE.BufferGeometry();
            bulbGeom.setAttribute('position', new THREE.BufferAttribute(bulbPositions, 3));
            bulbGeom.setAttribute('aType', new THREE.BufferAttribute(aType, 1));
            bulbGeom.setAttribute('aTwinkleFreq', new THREE.BufferAttribute(aTwinkleFreq, 1));
            bulbGeom.setAttribute('aTwinklePhase', new THREE.BufferAttribute(aTwinklePhase, 1));
            bulbGeom.setAttribute('aBulbSize', new THREE.BufferAttribute(aBulbSize, 1));
            bulbGeom.setAttribute('aSparkle', new THREE.BufferAttribute(aSparkle, 1));

            const bulbMat = new THREE.ShaderMaterial({
                transparent: true,
                depthWrite: false,
                blending: THREE.NormalBlending,
                uniforms: {
                    uTime: { value: 0 },
                    uFocusDistance: { value: settings.focusDistance },
                    uAperture: { value: settings.aperture },
                    uBokehScale: { value: settings.bokehScale },
                    uBulbSize: { value: settings.bulbSize },
                    uBokehRim: { value: settings.bokehRim },
                    uBulbGlowIntensity: { value: settings.bulbGlowIntensity },
                    uExposure: { value: settings.exposure },
                    uAmbientIntensity: { value: settings.ambientIntensity },
                    uAmbientColor: { value: new THREE.Color(settings.ambientColor) },
                    uPointLightIntensity: { value: settings.pointLightIntensity },
                    uPointLightColor: { value: new THREE.Color(settings.pointLightColor) },
                    uDirLightIntensity: { value: settings.dirLightIntensity },
                    uDirLightColor: { value: new THREE.Color(settings.dirLightColor) },
                    uBulbWarm: { value: new THREE.Color(settings.bulbWarm) },
                    uBulbWhite: { value: new THREE.Color(settings.bulbWhite) },
                    uBokehGlow: { value: new THREE.Color(settings.bokehGlow) }
                },
                vertexShader: getBulbVertexShader(),
                fragmentShader: getBulbFragmentShader()
            });

            bulbPoints = new THREE.Points(bulbGeom, bulbMat);
            bulbPoints.renderOrder = 10;
            scene.add(bulbPoints);

            // Garland Wire Lines
            const wireGeom = new THREE.BufferGeometry();
            wireGeom.setAttribute('position', new THREE.Float32BufferAttribute(wireVertices, 3));
            const wireMat = new THREE.ShaderMaterial({
                transparent: true,
                depthWrite: false,
                uniforms: {
                    uWireColor: { value: new THREE.Color(settings.wireColor) },
                    uAmbient: { value: new THREE.Color(settings.ambientColor) },
                    uOpacity: { value: 0.65 }
                },
                vertexShader: `
                    varying vec3 vViewPos;
                    void main() {
                        vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
                        vViewPos = -mvPos.xyz;
                        gl_Position = projectionMatrix * mvPos;
                    }
                `,
                fragmentShader: `
                    uniform vec3 uWireColor;
                    uniform vec3 uAmbient;
                    uniform float uOpacity;
                    varying vec3 vViewPos;
                    void main() {
                        float dist = length(vViewPos);
                        float fade = smoothstep(180.0, 30.0, dist);
                        vec3 col = mix(uWireColor, uAmbient, 0.35);
                        gl_FragColor = vec4(col, uOpacity * fade);
                    }
                `
            });
            wireLines = new THREE.LineSegments(wireGeom, wireMat);
            wireLines.renderOrder = 5;
            scene.add(wireLines);
        }

        // --- Volumetric Atmospheric Golden Dust / Motes ---
        function createAtmosphericDust() {
            const dustCount = 1100;
            const positions = new Float32Array(dustCount * 3);
            const aWobble = new Float32Array(dustCount * 3);
            const aPhase = new Float32Array(dustCount);
            const aDustSize = new Float32Array(dustCount);

            for (let i = 0; i < dustCount; i++) {
                // Keep dust motes in the perimeter volume, leaving central flight path clear
                const rad = 3.0 + Math.random() * 9.5;
                const ang = Math.random() * Math.PI * 2;
                positions[i * 3 + 0] = Math.cos(ang) * rad;
                positions[i * 3 + 1] = Math.sin(ang) * rad;
                positions[i * 3 + 2] = (Math.random() - 0.5) * (TUNNEL_PERIOD * 1.5);

                aWobble[i * 3 + 0] = 0.3 + Math.random() * 0.7;
                aWobble[i * 3 + 1] = 0.3 + Math.random() * 0.7;
                aWobble[i * 3 + 2] = 0.3 + Math.random() * 0.7;
                aPhase[i] = Math.random() * Math.PI * 2;
                aDustSize[i] = 12.0 + Math.random() * 16.0;
            }

            const dustGeom = new THREE.BufferGeometry();
            dustGeom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            dustGeom.setAttribute('aWobble', new THREE.BufferAttribute(aWobble, 3));
            dustGeom.setAttribute('aPhase', new THREE.BufferAttribute(aPhase, 1));
            dustGeom.setAttribute('aDustSize', new THREE.BufferAttribute(aDustSize, 1));

            const dustMat = new THREE.ShaderMaterial({
                transparent: true,
                depthWrite: false,
                blending: THREE.NormalBlending,
                uniforms: {
                    uTime: { value: 0 },
                    uDustColor: { value: new THREE.Color(settings.dustColor) },
                    uIntensity: { value: settings.bulbGlowIntensity }
                },
                vertexShader: `
                    uniform float uTime;
                    attribute vec3 aWobble;
                    attribute float aPhase;
                    attribute float aDustSize;
                    varying float vAlpha;

                    void main() {
                        vec3 pos = position;
                        pos.x += sin(uTime * aWobble.x + aPhase) * 0.55;
                        pos.y += cos(uTime * aWobble.y + aPhase * 1.3) * 0.55;
                        pos.z += sin(uTime * aWobble.z + aPhase * 0.7) * 0.35;

                        vec4 mvPos = modelViewMatrix * vec4(pos, 1.0);
                        float camDist = -mvPos.z;

                        gl_PointSize = clamp((aDustSize + sin(uTime * 1.6 + aPhase) * 6.0) * (50.0 / max(camDist, 2.0)), 2.0, 36.0);

                        float fade = smoothstep(140.0, 30.0, camDist) * smoothstep(1.5, 4.0, camDist);
                        vAlpha = fade * (0.25 + 0.5 * sin(uTime * 1.8 + aPhase));

                        gl_Position = projectionMatrix * mvPos;
                    }
                `,
                fragmentShader: `
                    uniform vec3 uDustColor;
                    uniform float uIntensity;
                    varying float vAlpha;

                    void main() {
                        vec2 coord = gl_PointCoord - vec2(0.5);
                        float dist = length(coord) * 2.0;
                        if (dist > 1.0) discard;

                        float glow = pow(max(0.0, 1.0 - dist), 2.0);
                        gl_FragColor = vec4(uDustColor, glow * vAlpha * uIntensity * 0.45);
                    }
                `
            });

            dustPoints = new THREE.Points(dustGeom, dustMat);
            dustPoints.renderOrder = 8;
            scene.add(dustPoints);
        }

        // --- Foreground Mega Bokeh (Translucent, soft optical bokeh orbs near the lens) ---
        function createForegroundBokeh() {
            const fgCount = 80;
            const positions = new Float32Array(fgCount * 3);
            const aType = new Float32Array(fgCount);
            const aTwinkleFreq = new Float32Array(fgCount);
            const aTwinklePhase = new Float32Array(fgCount);
            const aBulbSize = new Float32Array(fgCount);
            const aSparkle = new Float32Array(fgCount);

            for (let i = 0; i < fgCount; i++) {
                const rad = 2.8 + Math.random() * 5.0;
                const ang = Math.random() * Math.PI * 2;
                positions[i * 3 + 0] = Math.cos(ang) * rad;
                positions[i * 3 + 1] = Math.sin(ang) * rad;
                positions[i * 3 + 2] = (Math.random() - 0.5) * (TUNNEL_PERIOD * 1.5);

                aType[i] = Math.random() > 0.75 ? 1.0 : 0.0;
                aTwinkleFreq[i] = 0.8 + Math.random() * 1.2;
                aTwinklePhase[i] = Math.random() * Math.PI * 2;
                aBulbSize[i] = 1.6 + Math.random() * 1.8;
                aSparkle[i] = 0.2;
            }

            const fgGeom = new THREE.BufferGeometry();
            fgGeom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            fgGeom.setAttribute('aType', new THREE.BufferAttribute(aType, 1));
            fgGeom.setAttribute('aTwinkleFreq', new THREE.BufferAttribute(aTwinkleFreq, 1));
            fgGeom.setAttribute('aTwinklePhase', new THREE.BufferAttribute(aTwinklePhase, 1));
            fgGeom.setAttribute('aBulbSize', new THREE.BufferAttribute(aBulbSize, 1));
            fgGeom.setAttribute('aSparkle', new THREE.BufferAttribute(aSparkle, 1));

            const fgMat = new THREE.ShaderMaterial({
                transparent: true,
                depthWrite: false,
                blending: THREE.NormalBlending,
                uniforms: {
                    uTime: { value: 0 },
                    uFocusDistance: { value: settings.focusDistance },
                    uAperture: { value: settings.aperture },
                    uBokehScale: { value: settings.bokehScale * 1.2 },
                    uBulbSize: { value: settings.bulbSize * 1.4 },
                    uBokehRim: { value: settings.bokehRim * 1.15 },
                    uBulbGlowIntensity: { value: settings.bulbGlowIntensity * 0.8 },
                    uExposure: { value: settings.exposure },
                    uAmbientIntensity: { value: settings.ambientIntensity },
                    uAmbientColor: { value: new THREE.Color(settings.ambientColor) },
                    uPointLightIntensity: { value: settings.pointLightIntensity },
                    uPointLightColor: { value: new THREE.Color(settings.pointLightColor) },
                    uDirLightIntensity: { value: settings.dirLightIntensity },
                    uDirLightColor: { value: new THREE.Color(settings.dirLightColor) },
                    uBulbWarm: { value: new THREE.Color(settings.bulbWarm) },
                    uBulbWhite: { value: new THREE.Color(settings.bulbWhite) },
                    uBokehGlow: { value: new THREE.Color(settings.bokehGlow) }
                },
                vertexShader: getBulbVertexShader(),
                fragmentShader: getBulbFragmentShader()
            });

            fgBokehPoints = new THREE.Points(fgGeom, fgMat);
            fgBokehPoints.renderOrder = 20;
            scene.add(fgBokehPoints);
        }

        // --- GLSL Shaders for Controlled, Cinematic Bokeh with Real Light Response ---
        function getBulbVertexShader() {
            return `
                uniform float uTime;
                uniform float uFocusDistance;
                uniform float uAperture;
                uniform float uBokehScale;
                uniform float uBulbSize;

                attribute float aType;
                attribute float aTwinkleFreq;
                attribute float aTwinklePhase;
                attribute float aBulbSize;
                attribute float aSparkle;

                varying float vCoC;
                varying float vTwinkle;
                varying float vType;
                varying float vDistFade;
                varying float vCamDist;

                void main() {
                    vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
                    float camDist = -mvPos.z;
                    vCamDist = camDist;

                    // Optical Circle of Confusion (CoC)
                    float distFromFocus = abs(camDist - uFocusDistance);
                    float coc = (distFromFocus * uAperture) / max(camDist, 2.0);
                    vCoC = coc;

                    // Warm organic breathing twinkle + subtle sparkle
                    float sineTwinkle = sin(uTime * aTwinkleFreq + aTwinklePhase);
                    float sparkleBurst = pow(max(0.0, sin(uTime * (aTwinkleFreq * 2.0) + aTwinklePhase * 1.5)), 12.0) * aSparkle * 1.4;
                    vTwinkle = 0.75 + 0.25 * sineTwinkle + sparkleBurst;
                    vType = aType;

                    // Point Size with calibrated optical bokeh expansion
                    float pointBase = aBulbSize * uBulbSize;
                    float pSize = (pointBase * 14.0 + coc * uBokehScale * 1.2) * (100.0 / max(camDist, 2.5));
                    
                    if (camDist < uFocusDistance * 0.7) {
                        pSize += (uFocusDistance * 0.7 - camDist) * 7.0 * (uBokehScale / 30.0);
                    }

                    // Strict clamp to prevent massive overlapping white clusters
                    gl_PointSize = clamp(pSize, 2.0, 130.0);

                    // Smooth distance fade to keep the vanishing point clear and elegant
                    vDistFade = smoothstep(160.0, 45.0, camDist) * smoothstep(1.0, 3.2, camDist);

                    gl_Position = projectionMatrix * mvPos;
                }
            `;
        }

        function getBulbFragmentShader() {
            return `
                uniform vec3 uBulbWarm;
                uniform vec3 uBulbWhite;
                uniform vec3 uBokehGlow;
                uniform float uBokehRim;
                uniform float uBulbGlowIntensity;
                uniform float uExposure;
                uniform float uAmbientIntensity;
                uniform vec3 uAmbientColor;
                uniform float uPointLightIntensity;
                uniform vec3 uPointLightColor;
                uniform float uDirLightIntensity;
                uniform vec3 uDirLightColor;

                varying float vCoC;
                varying float vTwinkle;
                varying float vType;
                varying float vDistFade;
                varying float vCamDist;

                void main() {
                    vec2 coord = gl_PointCoord - vec2(0.5);
                    float dist = length(coord) * 2.0;
                    if (dist > 1.0) discard;

                    // Outer soft bokeh disc edge
                    float edgeAlpha = smoothstep(1.0, 0.86, dist);

                    // Optical bokeh outer rim (bright spherical aberration ring)
                    float rim = smoothstep(0.68, 0.98, dist) * uBokehRim;

                    // In-focus filament core (warm incandescent glow when in focus)
                    float inFocus = clamp(1.0 - vCoC * 0.2, 0.0, 1.0);
                    float core = pow(max(0.0, 1.0 - dist * 1.8), 3.0) * inFocus * 2.2;

                    // Disc interior body
                    float disc = 0.48 + rim * 0.42;

                    // Color: primary warm vs sparkle white, with bokeh glow edge tint
                    vec3 baseCol = mix(uBulbWarm, uBulbWhite, vType);
                    vec3 col = mix(baseCol, uBokehGlow, smoothstep(0.28, 0.96, dist) * 0.6);
                    
                    // Add incandescent filament core
                    col += vec3(1.0, 0.98, 0.92) * core;

                    // Apply full scene lighting response:
                    // 1. Bulb glow intensity & Exposure
                    col *= (uBulbGlowIntensity * 0.9);
                    col *= (uExposure * 0.95);

                    // 2. Ambient light contribution
                    col += uAmbientColor * (uAmbientIntensity * 0.22);

                    // 3. Central fairy glow point light contribution (attenuates with camera distance)
                    float pointAtten = 1.0 / (1.0 + vCamDist * 0.04);
                    col += uPointLightColor * (uPointLightIntensity * 0.25 * pointAtten);

                    // 4. Directional rim accent
                    col += uDirLightColor * (uDirLightIntensity * 0.18 * rim);

                    // Composite alpha for NormalBlending (prevents additive white glare)
                    float baseAlpha = (disc * 0.5 + rim * 0.45) * edgeAlpha;
                    float alpha = clamp((baseAlpha + core * 0.5) * vTwinkle * vDistFade, 0.0, 0.85);

                    gl_FragColor = vec4(col, alpha);
                }
            `;
        }

        // --- Color Scheme Updater ---
        function applyColorScheme(name) {
            const scheme = COLOR_SCHEMES[name];
            if (!scheme) return;

            settings.colorScheme = name;
            settings.bulbWarm = scheme.bulbWarm;
            settings.bulbWhite = scheme.bulbWhite;
            settings.bokehGlow = scheme.bokehGlow;
            settings.wireColor = scheme.wireColor;
            settings.dustColor = scheme.dustColor;
            settings.bgInner = scheme.bgInner;
            settings.bgOuter = scheme.bgOuter;
            settings.ambientColor = scheme.ambientLight;
            settings.dirLightColor = scheme.dirLight;
            settings.pointLightColor = scheme.pointLight;

            updateColors();
        }

        function updateColors() {
            // Background
            if (bgMesh && bgMesh.material) {
                bgMesh.material.uniforms.uColorInner.value.set(settings.bgInner);
                bgMesh.material.uniforms.uColorOuter.value.set(settings.bgOuter);
                bgMesh.material.uniforms.uGreenScreen.value = settings.greenscreen;
            }

            if (renderer) {
                if (settings.greenscreen) {
                    renderer.setClearColor(0x00ff00, 1.0);
                } else {
                    renderer.setClearColor(new THREE.Color(settings.bgOuter), 1.0);
                }
                renderer.toneMappingExposure = settings.exposure;
            }

            // Sync PostProcessor exposure
            if (postProcessor) {
                postProcessor.settings.exposure = settings.exposure;
                postProcessor.updateSettings();
            }

            // Fairy Bulbs
            if (bulbPoints && bulbPoints.material) {
                const u = bulbPoints.material.uniforms;
                u.uBulbWarm.value.set(settings.bulbWarm);
                u.uBulbWhite.value.set(settings.bulbWhite);
                u.uBokehGlow.value.set(settings.bokehGlow);
                u.uBulbGlowIntensity.value = settings.bulbGlowIntensity;
                u.uExposure.value = settings.exposure;
                u.uAmbientIntensity.value = settings.ambientIntensity;
                u.uAmbientColor.value.set(settings.ambientColor);
                u.uPointLightIntensity.value = settings.pointLightIntensity;
                u.uPointLightColor.value.set(settings.pointLightColor);
                u.uDirLightIntensity.value = settings.dirLightIntensity;
                u.uDirLightColor.value.set(settings.dirLightColor);
            }

            // Foreground Mega Bokeh
            if (fgBokehPoints && fgBokehPoints.material) {
                const u = fgBokehPoints.material.uniforms;
                u.uBulbWarm.value.set(settings.bulbWarm);
                u.uBulbWhite.value.set(settings.bulbWhite);
                u.uBokehGlow.value.set(settings.bokehGlow);
                u.uBulbGlowIntensity.value = settings.bulbGlowIntensity * 0.8;
                u.uExposure.value = settings.exposure;
                u.uAmbientIntensity.value = settings.ambientIntensity;
                u.uAmbientColor.value.set(settings.ambientColor);
                u.uPointLightIntensity.value = settings.pointLightIntensity;
                u.uPointLightColor.value.set(settings.pointLightColor);
                u.uDirLightIntensity.value = settings.dirLightIntensity;
                u.uDirLightColor.value.set(settings.dirLightColor);
            }

            // Dust
            if (dustPoints && dustPoints.material) {
                dustPoints.material.uniforms.uDustColor.value.set(settings.dustColor);
                dustPoints.material.uniforms.uIntensity.value = settings.bulbGlowIntensity;
            }

            // Wires
            if (wireLines && wireLines.material) {
                wireLines.material.uniforms.uWireColor.value.set(settings.wireColor);
                wireLines.material.uniforms.uAmbient.value.set(settings.ambientColor);
            }

            // Scene Lights
            if (ambientLight) {
                ambientLight.color.set(settings.ambientColor);
                ambientLight.intensity = settings.ambientIntensity;
            }
            if (dirLight) {
                dirLight.color.set(settings.dirLightColor);
                dirLight.intensity = settings.dirLightIntensity;
            }
            if (pointLight) {
                pointLight.color.set(settings.pointLightColor);
                pointLight.intensity = settings.pointLightIntensity;
            }
        }

        function syncUniforms() {
            if (bulbPoints && bulbPoints.material) {
                const u = bulbPoints.material.uniforms;
                u.uFocusDistance.value = settings.focusDistance;
                u.uAperture.value = settings.aperture;
                u.uBokehScale.value = settings.bokehScale;
                u.uBulbSize.value = settings.bulbSize;
                u.uBokehRim.value = settings.bokehRim;
                u.uBulbGlowIntensity.value = settings.bulbGlowIntensity;
                u.uExposure.value = settings.exposure;
                u.uAmbientIntensity.value = settings.ambientIntensity;
                u.uPointLightIntensity.value = settings.pointLightIntensity;
                u.uDirLightIntensity.value = settings.dirLightIntensity;
            }
            if (fgBokehPoints && fgBokehPoints.material) {
                const u = fgBokehPoints.material.uniforms;
                u.uFocusDistance.value = settings.focusDistance;
                u.uAperture.value = settings.aperture;
                u.uBokehScale.value = settings.bokehScale * 1.2;
                u.uBulbSize.value = settings.bulbSize * 1.4;
                u.uBokehRim.value = settings.bokehRim * 1.15;
                u.uBulbGlowIntensity.value = settings.bulbGlowIntensity * 0.8;
                u.uExposure.value = settings.exposure;
                u.uAmbientIntensity.value = settings.ambientIntensity;
                u.uPointLightIntensity.value = settings.pointLightIntensity;
                u.uDirLightIntensity.value = settings.dirLightIntensity;
            }
            if (dustPoints && dustPoints.material) {
                dustPoints.material.uniforms.uIntensity.value = settings.bulbGlowIntensity;
            }
            if (renderer) {
                renderer.toneMappingExposure = settings.exposure;
            }
            if (postProcessor) {
                postProcessor.settings.exposure = settings.exposure;
                postProcessor.updateSettings();
            }
        }

        // --- Procedural Click Randomizer ---
        // (CRITICAL REQUIREMENT: Do NOT shuffle or change Postprocessing settings on random scene re-roll!)
        function randomizeScene() {
            const schemeKeys = Object.keys(COLOR_SCHEMES);
            const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
            applyColorScheme(randomScheme);

            // Randomize motion preset
            settings.animationPreset = ANIMATION_PRESETS[Math.floor(Math.random() * ANIMATION_PRESETS.length)];
            settings.animationSpeed = parseFloat((0.6 + Math.random() * 0.9).toFixed(2));

            // Randomize optics & bokeh parameters within safe, aesthetic non-overblown ranges
            settings.focusDistance = parseFloat((10.0 + Math.random() * 9.0).toFixed(1));
            settings.aperture = parseFloat((0.8 + Math.random() * 0.9).toFixed(2));
            settings.bokehScale = parseFloat((20.0 + Math.random() * 18.0).toFixed(1));
            settings.bokehRim = parseFloat((0.7 + Math.random() * 0.8).toFixed(2));
            settings.bulbSize = parseFloat((0.85 + Math.random() * 0.45).toFixed(2));
            settings.bulbGlowIntensity = parseFloat((0.8 + Math.random() * 0.4).toFixed(2));

            // Randomize scene lighting intensities
            settings.exposure = parseFloat((0.85 + Math.random() * 0.35).toFixed(2));
            settings.ambientIntensity = parseFloat((0.5 + Math.random() * 0.5).toFixed(2));
            settings.pointLightIntensity = parseFloat((1.0 + Math.random() * 0.9).toFixed(2));
            settings.dirLightIntensity = parseFloat((0.7 + Math.random() * 0.7).toFixed(2));

            // Keep postProcessor exposure synchronized with scene exposure WITHOUT touching any post-process toggles/fx
            if (postProcessor) {
                postProcessor.settings.exposure = settings.exposure;
                postProcessor.updateSettings();
            }

            syncUniforms();
            updateColors();

            if (gui) {
                gui.controllersRecursive().forEach(c => {
                    // Do NOT touch or re-display PostProcessor controllers
                    if (c.property in settings) {
                        c.updateDisplay();
                    }
                });
            }
        }

        function setupClickRandomizer() {
            let pointerDownX = 0;
            let pointerDownY = 0;
            let pointerDownTime = 0;

            window.addEventListener('pointerdown', (e) => {
                if (e.target.closest('.lil-gui')) return;
                pointerDownX = e.clientX;
                pointerDownY = e.clientY;
                pointerDownTime = performance.now();
            });

            window.addEventListener('pointerup', (e) => {
                if (e.target.closest('.lil-gui')) return;
                const dist = Math.hypot(e.clientX - pointerDownX, e.clientY - pointerDownY);
                const duration = performance.now() - pointerDownTime;

                // Intentional click (< 6px movement and < 350ms duration) triggers randomizer
                if (dist < 6 && duration < 350 && settings.clickToRandomize) {
                    randomizeScene();
                }
            });
        }

        // --- Lil-GUI Setup ---
        let gui;
        function buildGUI() {
            gui = new GUI({ title: 'Fairy Lights Bokeh Tunnel' });

            // 1. Color Themes & Greenscreen
            const fTheme = gui.addFolder('Color Schemes & Background');
            fTheme.add(settings, 'colorScheme', Object.keys(COLOR_SCHEMES))
                .name('Color Scheme')
                .onChange(val => {
                    applyColorScheme(val);
                    gui.controllersRecursive().forEach(c => {
                        if (c.property in settings) c.updateDisplay();
                    });
                }).listen();

            fTheme.add(settings, 'greenscreen')
                .name('Enable Greenscreen (#00ff00)')
                .onChange(val => {
                    updateColors();
                }).listen();

            fTheme.addColor(settings, 'bulbWarm').name('Bulb Primary Color').onChange(updateColors).listen();
            fTheme.addColor(settings, 'bulbWhite').name('Bulb Sparkle / Secondary').onChange(updateColors).listen();
            fTheme.addColor(settings, 'bokehGlow').name('Bokeh Halo Tint').onChange(updateColors).listen();
            fTheme.addColor(settings, 'wireColor').name('Garland Wire Tint').onChange(updateColors).listen();
            fTheme.addColor(settings, 'dustColor').name('Atmospheric Dust Tint').onChange(updateColors).listen();
            fTheme.addColor(settings, 'bgInner').name('Background Center').onChange(updateColors).listen();
            fTheme.addColor(settings, 'bgOuter').name('Background Edge').onChange(updateColors).listen();

            // 2. Lighting & Exposure
            const fLights = gui.addFolder('Lighting & Exposure');
            fLights.add(settings, 'exposure', 0.1, 2.5, 0.05).name('Scene Exposure').onChange(val => {
                renderer.toneMappingExposure = val;
                if (postProcessor) {
                    postProcessor.settings.exposure = val;
                    postProcessor.updateSettings();
                }
                syncUniforms();
            }).listen();

            fLights.addColor(settings, 'ambientColor').name('Ambient Color').onChange(updateColors).listen();
            fLights.add(settings, 'ambientIntensity', 0.0, 2.5, 0.05).name('Ambient Intensity').onChange(updateColors).listen();

            fLights.addColor(settings, 'dirLightColor').name('Directional Rim Color').onChange(updateColors).listen();
            fLights.add(settings, 'dirLightIntensity', 0.0, 3.0, 0.05).name('Directional Rim Intensity').onChange(updateColors).listen();

            fLights.addColor(settings, 'pointLightColor').name('Central Fairy Glow Color').onChange(updateColors).listen();
            fLights.add(settings, 'pointLightIntensity', 0.0, 4.0, 0.1).name('Central Fairy Glow Intensity').onChange(updateColors).listen();

            fLights.add(settings, 'bulbGlowIntensity', 0.1, 2.5, 0.05).name('Fairy Bulbs Glow Intensity').onChange(syncUniforms).listen();

            // 3. Optics & Depth of Field (DoF)
            const fOptics = gui.addFolder('Optics & Depth of Field');
            fOptics.add(settings, 'focusDistance', 3.0, 35.0, 0.5).name('Focal Distance (DoF)').onChange(syncUniforms).listen();
            fOptics.add(settings, 'aperture', 0.2, 2.8, 0.05).name('Lens Aperture (Blur)').onChange(syncUniforms).listen();
            fOptics.add(settings, 'bokehScale', 5.0, 60.0, 1.0).name('Bokeh Disc Scale').onChange(syncUniforms).listen();
            fOptics.add(settings, 'bokehRim', 0.0, 2.0, 0.05).name('Bokeh Outer Rim Brightness').onChange(syncUniforms).listen();
            fOptics.add(settings, 'bulbSize', 0.4, 2.0, 0.05).name('Base Bulb Size').onChange(syncUniforms).listen();

            // 4. Animation & Camera Motion
            const fAnim = gui.addFolder('Animation & Motion');
            fAnim.add(settings, 'animationPreset', ANIMATION_PRESETS).name('Camera Motion').listen();
            fAnim.add(settings, 'animationSpeed', 0.0, 3.0, 0.05).name('Animation Speed').listen();

            // 5. System & Interaction
            const fSystem = gui.addFolder('System & Interaction');
            fSystem.add(settings, 'antialias').name('Antialias (Rebuild)').onChange(val => {
                createRenderer(val);
            });
            fSystem.add(settings, 'dpr', 0.5, 3.0, 0.25).name('DPR (Pixel Ratio)').onChange(val => {
                renderer.setPixelRatio(val);
                if (postProcessor) postProcessor.setSize(window.innerWidth, window.innerHeight, val);
            });
            fSystem.add(settings, 'clickToRandomize').name('Click Scene to Re-roll').listen();
            fSystem.add({ randomize: randomizeScene }, 'randomize').name('⚡ Randomize Theme Now');

            // 6. Integrated PostProcessor Suite Controls
            const fPost = postProcessor.attachGUI(gui, 'Post-Processing (PostProcessor.js)');

            fTheme.close();
            fLights.close();
            fOptics.close();
            fSystem.close();
            fPost.close();
        }

        // --- Window & Keyboard Events ---
        function setupWindowEvents() {
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                if (postProcessor) {
                    postProcessor.setSize(window.innerWidth, window.innerHeight, settings.dpr);
                }
            });

            // "H" key to toggle GUI visibility
            window.addEventListener('keydown', (e) => {
                if (e.key === 'h' || e.key === 'H') {
                    if (gui) {
                        gui._hidden ? gui.show() : gui.hide();
                    }
                }
            });
        }

        // --- Infinite Tunnel Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);

            const dt = clock.getDelta();
            const elapsedTime = clock.getElapsedTime();
            const motionTime = elapsedTime * settings.animationSpeed;

            // Advance shaders time uniform
            if (bulbPoints && bulbPoints.material) {
                bulbPoints.material.uniforms.uTime.value = elapsedTime;
            }
            if (fgBokehPoints && fgBokehPoints.material) {
                fgBokehPoints.material.uniforms.uTime.value = elapsedTime;
            }
            if (dustPoints && dustPoints.material) {
                dustPoints.material.uniforms.uTime.value = elapsedTime;
            }

            // Smooth camera animations
            if (settings.animationPreset !== 'Static Bokeh (No Camera Movement)') {
                const deltaZ = -dt * settings.animationSpeed * 10.5;

                // Move camera and target forward through the tunnel
                camera.position.z += deltaZ;
                controls.target.z += deltaZ;

                // Seamless infinite wrap within [-TUNNEL_PERIOD / 2, +TUNNEL_PERIOD / 2]
                if (camera.position.z < -TUNNEL_PERIOD * 0.5) {
                    camera.position.z += TUNNEL_PERIOD;
                    controls.target.z += TUNNEL_PERIOD;
                } else if (camera.position.z > TUNNEL_PERIOD * 0.5) {
                    camera.position.z -= TUNNEL_PERIOD;
                    controls.target.z -= TUNNEL_PERIOD;
                }

                let targetX = 0;
                let targetY = 0;

                switch (settings.animationPreset) {
                    case 'Cinematic Tunnel Flythrough':
                        targetX = Math.sin(motionTime * 0.35) * 1.8;
                        targetY = Math.cos(motionTime * 0.28) * 1.3;
                        break;
                    case 'Spiral Corkscrew Drift':
                        targetX = Math.sin(motionTime * 0.35) * 3.6;
                        targetY = Math.cos(motionTime * 0.35) * 3.6;
                        break;
                    case 'Floating Dream Sway':
                        targetX = Math.sin(motionTime * 0.22) * 2.8;
                        targetY = Math.cos(motionTime * 0.17) * 2.1;
                        break;
                    case 'Winding Festive Thread':
                        targetX = Math.sin(motionTime * 0.45) * 4.2;
                        targetY = Math.sin(motionTime * 0.9) * 1.8;
                        break;
                    case 'Hypnotic Pendulum':
                        {
                            const pAngle = Math.sin(motionTime * 0.32) * 0.55;
                            targetX = Math.sin(pAngle) * 6.2;
                            targetY = -Math.cos(pAngle) * 4.5 + 2.5;
                        }
                        break;
                    case 'Deep Lens Vortex':
                        targetX = Math.sin(motionTime * 0.25) * 1.9;
                        targetY = Math.cos(motionTime * 0.25) * 1.9;
                        break;
                    case 'Perimeter Garland Orbit':
                        targetX = Math.cos(motionTime * 0.14) * 8.2;
                        targetY = Math.sin(motionTime * 0.14) * 8.2;
                        break;
                }

                // Gentle lerp into trajectory
                camera.position.x += (targetX - camera.position.x) * 0.04;
                camera.position.y += (targetY - camera.position.y) * 0.04;
                controls.target.x += (targetX * 0.35 - controls.target.x) * 0.04;
                controls.target.y += (targetY * 0.35 - controls.target.y) * 0.04;

                // Sync lights with camera view
                if (pointLight) {
                    pointLight.position.set(camera.position.x, camera.position.y, camera.position.z - 12);
                }
                if (dirLight) {
                    dirLight.position.set(camera.position.x + 15, camera.position.y + 25, camera.position.z + 10);
                }
            } else {
                if (pointLight) {
                    pointLight.position.set(camera.position.x, camera.position.y, camera.position.z - 12);
                }
            }

            controls.update();

            // Render scene through PostProcessor pipeline
            if (postProcessor) {
                postProcessor.renderScene(scene, camera);
            } else {
                renderer.render(scene, camera);
            }
        }

        // Launch
        initScene();
        animate();
    </script>
