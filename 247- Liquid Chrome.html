<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liquid Chrome</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
            user-select: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: grab;
        }
        canvas:active {
            cursor: grabbing;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
            }
        }
    </script>
</head>
<body>
    <script type="module">
        import * as THREE from 'three';
        import GUI from 'lil-gui';

        // --- 5 Curated Color Schemes ---
        const COLOR_SCHEMES = {
            'Liquid Chrome': {
                colorDark: '#0a0a12',
                colorMid: '#d8e2ec',
                colorBg: '#000000'
            },
            'Cyberpunk Acid': {
                colorDark: '#1a0033',
                colorMid: '#00f5d4',
                colorBg: '#080014'
            },
            'Molten Gold': {
                colorDark: '#1f0d03',
                colorMid: '#ffc300',
                colorBg: '#0f0400'
            },
            'Rose Quartz': {
                colorDark: '#26001b',
                colorMid: '#ff70a6',
                colorBg: '#0d000a'
            },
            'Emerald Aurora': {
                colorDark: '#011c16',
                colorMid: '#38ef7d',
                colorBg: '#000d0a'
            }
        };

        const SCHEME_NAMES = ['Liquid Chrome', 'Cyberpunk Acid', 'Molten Gold', 'Rose Quartz', 'Emerald Aurora', 'Custom'];
        const ANIMATION_PRESETS = ['Gentle Flow', 'Deep Pulse', 'Vortex Spin', 'Liquid Ripple', 'Static Still'];

        // --- Configuration ---
        const CONFIG = {
            colorScheme: 'Liquid Chrome',
            animationPreset: 'Gentle Flow',
            clickRandomize: true,
            greenScreen: false,
            dpr: Math.min(window.devicePixelRatio || 1, 2),
            zoom: 1.0,
            offsetX: 0.0,
            offsetY: 0.0,
            animSpeed: 0.15,
            sharpness: 2.9,
            octavesA: 3,
            octavesB: 6,
            colorDark: COLOR_SCHEMES['Liquid Chrome'].colorDark,
            colorMid: COLOR_SCHEMES['Liquid Chrome'].colorMid,
            colorBg: COLOR_SCHEMES['Liquid Chrome'].colorBg,
            randomizePattern: () => {
                uniforms.u_seed.value = Math.random() * 1000.0;
            },
            randomizeAll: () => {
                triggerProceduralRandomize();
            },
            resetView: () => {
                CONFIG.zoom = 1.0;
                CONFIG.offsetX = 0.0;
                CONFIG.offsetY = 0.0;
                uniforms.u_zoom.value = 1.0;
                uniforms.u_offset.value.set(0.0, 0.0);
                updateGUI();
            }
        };

        // --- Scene Setup ---
        const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(CONFIG.dpr);
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        
        // Orthographic camera for fullscreen shader
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 10);
        camera.position.z = 1;

        // --- Shader Setup ---
        const uniforms = {
            u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
            u_time: { value: 0.0 },
            u_seed: { value: Math.random() * 1000.0 },
            u_zoom: { value: CONFIG.zoom },
            u_offset: { value: new THREE.Vector2(CONFIG.offsetX, CONFIG.offsetY) },
            u_rotation: { value: 0.0 },
            u_greenScreen: { value: 0.0 },
            
            u_animSpeed: { value: CONFIG.animSpeed },
            u_sharpness: { value: CONFIG.sharpness },
            u_octavesA: { value: CONFIG.octavesA },
            u_octavesB: { value: CONFIG.octavesB },
            
            u_colorDark: { value: new THREE.Color(CONFIG.colorDark) },
            u_colorMid: { value: new THREE.Color(CONFIG.colorMid) },
            u_colorBg: { value: new THREE.Color(CONFIG.colorBg) }
        };

        const vertexShader = `
            void main() {
                gl_Position = vec4(position, 1.0);
            }
        `;

        const fragmentShader = `
            uniform vec2 u_resolution;
            uniform float u_time;
            uniform float u_seed;
            uniform float u_zoom;
            uniform vec2 u_offset;
            uniform float u_rotation;
            uniform float u_greenScreen;
            
            uniform float u_animSpeed;
            uniform float u_sharpness;
            uniform int u_octavesA;
            uniform int u_octavesB;
            
            uniform vec3 u_colorDark;
            uniform vec3 u_colorMid;
            uniform vec3 u_colorBg;

            // --- MATH & UTILITIES ---
            mat2 getRotation(float a) {
                float s = sin(a), c = cos(a);
                return mat2(c, -s, s, c);
            }

            // Pseudo-random generators
            float prng1(float n) {
                return fract(sin(n * 1026.12967 + u_seed) * 43759.3053);
            }

            float prng2(vec2 p) {
                return fract(sin(dot(p, vec2(1.5898, 65.453)) + u_seed) * 43758.1253);
            }

            // --- PROCEDURAL NOISE ---
            float texNoise3D(vec3 p) {
                vec3 i = floor(p);
                vec3 f = fract(p);
                
                vec3 u = f * f * (3.0 - 2.0 * f);
                float n = i.x + i.y * 57.0 + 113.0 * i.z;

                float r1 = mix(prng1(n), prng1(n + 1.0), u.x);
                float r2 = mix(prng1(n + 57.0), prng1(n + 58.0), u.x);
                float r3 = mix(prng1(n + 113.0), prng1(n + 114.0), u.x);
                float r4 = mix(prng1(n + 170.0), prng1(n + 171.0), u.x);

                return mix(mix(r1, r2, u.y), mix(r3, r4, u.y), u.z);
            }

            vec3 evalNoise2D(vec2 p) {
                vec2 i = floor(p);
                vec2 f = fract(p);

                vec2 du = vec2(53.6, 13.2) * f * f * (f * (f - 2.0) + 1.0);
                vec2 u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);

                float a = prng2(i);
                float b = prng2(i + vec2(1.0, 0.0));
                float c = prng2(i + vec2(0.0, 1.0));
                float d = prng2(i + vec2(1.0, 1.0));

                float k0 = a;
                float k1 = b - a;
                float k2 = c - a;
                float k3 = a - b - c + d;

                float val = k0 + k1 * u.x + k2 * u.y + k3 * u.x * u.y;
                vec2 grad = du * vec2(k1 + k3 * u.y, k2 + k3 * u.x);

                return vec3(val, grad);
            }

            // --- FLUID DYNAMICS ---
            float buildBaseStructure(vec2 p) {
                float v = 0.0;
                float a = 0.5;
                vec2 sumGrad = vec2(0.0);

                for (int i = 0; i < 10; i++) {
                    if (i >= u_octavesB) break; 
                    vec3 n = evalNoise2D(p);
                    sumGrad += n.yz;
                    v += a * n.x / (1.0 + dot(sumGrad, sumGrad));
                    
                    a *= 0.75;
                    p *= 1.5;
                }
                return v;
            }

            float buildFluidFBM(vec2 p, float flowTime) {
                vec3 p1 = vec3(p * 0.1, 0.0);
                vec3 p2 = vec3(p * 0.1, 10.0);
                float warpAngle = 2.79 * texNoise3D(p1) + 0.75 * texNoise3D(p2);
                
                mat2 rotMap = getRotation(warpAngle);
                
                float v = 0.0;
                float a = 0.3;
                vec2 sumGrad = vec2(0.0);

                for (int i = 0; i < 10; i++) {
                    if (i >= u_octavesA) break;
                    vec3 n = evalNoise2D(p);
                    sumGrad += n.yz;
                    v += a * n.x / (1.0 + dot(sumGrad, sumGrad));
                    
                    a *= 0.89;
                    p *= 1.16;
                    p *= rotMap;
                    
                    p += flowTime * 0.2; 
                }
                return v;
            }

            // --- MAIN RENDER PASS ---
            void main() {
                vec2 fragCoord = gl_FragCoord.xy;
                float minDim = min(u_resolution.x, u_resolution.y);
                vec2 uv = (fragCoord - 0.5 * u_resolution.xy) / minDim;
                
                // Pan & Zoom transform
                uv = (uv - u_offset) / max(u_zoom, 0.001);
                
                // Optional Dynamic Rotation
                if (u_rotation != 0.0) {
                    uv = getRotation(u_rotation) * uv;
                }

                uv *= -2.0;

                float timeVal = u_time * u_animSpeed;
                float r = max(length(uv), 0.0001);
                
                vec2 field = vec2(r) + (1.0 / (r * 75.0)) - timeVal;
                
                float baseDisp = buildBaseStructure(field);
                float turb1 = 0.5 * buildFluidFBM(uv * 2.0 * baseDisp, timeVal);
                
                float ink = 0.5 * buildFluidFBM(uv * turb1 * 8.0, timeVal);
                float grain = 0.02 * prng2(uv);
                
                float signal = ink + grain;

                float grade = 1.0 - 1.2 * signal;
                grade *= u_sharpness;
                grade = grade / (1.0 + grade);
                grade = smoothstep(0.21, 0.88, grade);

                vec3 activeBg = mix(u_colorBg, vec3(0.0, 1.0, 0.0), u_greenScreen);

                vec3 finalCol = mix(
                    mix(u_colorDark, u_colorMid, smoothstep(0.0, 0.5, grade)),
                    activeBg,
                    smoothstep(0.4, 0.95, grade)
                );

                gl_FragColor = vec4(finalCol, 1.0);
            }
        `;

        const material = new THREE.ShaderMaterial({
            vertexShader,
            fragmentShader,
            uniforms,
            depthWrite: false,
            depthTest: false
        });

        // Fullscreen quad
        const geometry = new THREE.PlaneGeometry(2, 2);
        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        // --- Helpers ---
        function updateGUI() {
            if (typeof gui.controllersRecursive === 'function') {
                gui.controllersRecursive().forEach(c => c.updateDisplay());
            } else {
                const update = (g) => {
                    g.controllers.forEach(c => c.updateDisplay());
                    g.folders.forEach(f => update(f));
                };
                update(gui);
            }
        }

        function applyColorScheme(name) {
            if (COLOR_SCHEMES[name]) {
                CONFIG.colorScheme = name;
                CONFIG.colorDark = COLOR_SCHEMES[name].colorDark;
                CONFIG.colorMid = COLOR_SCHEMES[name].colorMid;
                CONFIG.colorBg = COLOR_SCHEMES[name].colorBg;
                uniforms.u_colorDark.value.set(CONFIG.colorDark);
                uniforms.u_colorMid.value.set(CONFIG.colorMid);
                uniforms.u_colorBg.value.set(CONFIG.colorBg);
                updateGUI();
            }
        }

        function triggerProceduralRandomize() {
            // Procedural aesthetic colors
            const baseHue = Math.random();
            const darkColor = new THREE.Color().setHSL((baseHue + 0.5 + (Math.random() - 0.5) * 0.2) % 1.0, 0.5 + Math.random() * 0.5, 0.04 + Math.random() * 0.06);
            const midColor = new THREE.Color().setHSL(baseHue, 0.7 + Math.random() * 0.3, 0.6 + Math.random() * 0.3);
            const bgColor = new THREE.Color().setHSL((baseHue + 0.5) % 1.0, 0.4 + Math.random() * 0.4, 0.01 + Math.random() * 0.03);

            CONFIG.colorScheme = 'Custom';
            CONFIG.colorDark = '#' + darkColor.getHexString();
            CONFIG.colorMid = '#' + midColor.getHexString();
            CONFIG.colorBg = '#' + bgColor.getHexString();

            CONFIG.sharpness = Number((1.5 + Math.random() * 4.0).toFixed(1));
            CONFIG.octavesA = Math.floor(2 + Math.random() * 5);
            CONFIG.octavesB = Math.floor(3 + Math.random() * 6);
            CONFIG.animSpeed = Number((0.08 + Math.random() * 0.3).toFixed(2));
            
            // Randomly select one of the motion presets
            const nonStaticPresets = ANIMATION_PRESETS.filter(p => p !== 'Static Still');
            CONFIG.animationPreset = nonStaticPresets[Math.floor(Math.random() * nonStaticPresets.length)];

            uniforms.u_seed.value = Math.random() * 1000.0;
            uniforms.u_sharpness.value = CONFIG.sharpness;
            uniforms.u_octavesA.value = CONFIG.octavesA;
            uniforms.u_octavesB.value = CONFIG.octavesB;
            uniforms.u_animSpeed.value = CONFIG.animSpeed;
            uniforms.u_colorDark.value.set(CONFIG.colorDark);
            uniforms.u_colorMid.value.set(CONFIG.colorMid);
            uniforms.u_colorBg.value.set(CONFIG.colorBg);

            updateGUI();
        }

        // --- GUI Setup ---
        const gui = new GUI({ title: 'Liquid Chrome Controls' });

        const folderPresets = gui.addFolder('Presets & Procedural');
        folderPresets.add(CONFIG, 'colorScheme', SCHEME_NAMES).name('Color Scheme').onChange(v => {
            if (v !== 'Custom') applyColorScheme(v);
        });
        folderPresets.add(CONFIG, 'animationPreset', ANIMATION_PRESETS).name('Animation Mode');
        folderPresets.add(CONFIG, 'clickRandomize').name('Click Scene to Randomize');
        folderPresets.add(CONFIG, 'randomizeAll').name('Randomize Scene');
        folderPresets.add(CONFIG, 'randomizePattern').name('Randomize Pattern');

        const folderView = gui.addFolder('View & Display');
        folderView.add(CONFIG, 'greenScreen').name('Green Screen (#00ff00)').onChange(v => {
            uniforms.u_greenScreen.value = v ? 1.0 : 0.0;
        });
        folderView.add(CONFIG, 'dpr', 0.5, 3.0, 0.25).name('Pixel Ratio (DPR)').onChange(v => {
            renderer.setPixelRatio(v);
            renderer.setSize(window.innerWidth, window.innerHeight);
            uniforms.u_resolution.value.set(window.innerWidth, window.innerHeight);
        });
        folderView.add(CONFIG, 'zoom', 0.1, 10.0, 0.05).name('Zoom').onChange(v => {
            uniforms.u_zoom.value = v;
        });
        folderView.add(CONFIG, 'resetView').name('Reset Pan / Zoom');

        const folderAnimation = gui.addFolder('Animation & Shape');
        folderAnimation.add(CONFIG, 'animSpeed', 0.0, 1.0, 0.01).name('Anim Speed').onChange(v => uniforms.u_animSpeed.value = v);
        folderAnimation.add(CONFIG, 'sharpness', 0.5, 10.0, 0.1).name('Sharpness').onChange(v => uniforms.u_sharpness.value = v);
        
        const folderGeometry = gui.addFolder('Noise Detail (Octaves)');
        folderGeometry.add(CONFIG, 'octavesA', 1, 10, 1).name('Octaves A (Fluid)').onChange(v => uniforms.u_octavesA.value = v);
        folderGeometry.add(CONFIG, 'octavesB', 1, 10, 1).name('Octaves B (Base)').onChange(v => uniforms.u_octavesB.value = v);

        const folderColors = gui.addFolder('Colors');
        folderColors.addColor(CONFIG, 'colorDark').name('Dark Color').onChange(v => {
            uniforms.u_colorDark.value.set(v);
            CONFIG.colorScheme = 'Custom';
            updateGUI();
        });
        folderColors.addColor(CONFIG, 'colorMid').name('Mid Color').onChange(v => {
            uniforms.u_colorMid.value.set(v);
            CONFIG.colorScheme = 'Custom';
            updateGUI();
        });
        folderColors.addColor(CONFIG, 'colorBg').name('Background').onChange(v => {
            uniforms.u_colorBg.value.set(v);
            CONFIG.colorScheme = 'Custom';
            updateGUI();
        });

        // --- Interaction: Pan, Zoom, Click Randomize ---
        let isPointerDown = false;
        const pointerStart = { x: 0, y: 0 };
        const offsetStart = { x: 0, y: 0 };
        let dragDistance = 0;

        window.addEventListener('pointerdown', (e) => {
            if (gui.domElement.contains(e.target)) return;
            isPointerDown = true;
            pointerStart.x = e.clientX;
            pointerStart.y = e.clientY;
            offsetStart.x = CONFIG.offsetX;
            offsetStart.y = CONFIG.offsetY;
            dragDistance = 0;
        });

        window.addEventListener('pointermove', (e) => {
            if (!isPointerDown) return;
            const dx = e.clientX - pointerStart.x;
            const dy = e.clientY - pointerStart.y;
            dragDistance = Math.hypot(dx, dy);

            const minDim = Math.min(window.innerWidth, window.innerHeight);
            CONFIG.offsetX = offsetStart.x + dx / minDim;
            CONFIG.offsetY = offsetStart.y - dy / minDim;
            uniforms.u_offset.value.set(CONFIG.offsetX, CONFIG.offsetY);
        });

        window.addEventListener('pointerup', (e) => {
            if (!isPointerDown) return;
            isPointerDown = false;

            // Trigger randomize if it was a quick click on canvas without dragging
            if (dragDistance < 6 && !gui.domElement.contains(e.target)) {
                if (CONFIG.clickRandomize) {
                    triggerProceduralRandomize();
                }
            }
        });

        window.addEventListener('wheel', (e) => {
            if (gui.domElement.contains(e.target)) return;
            e.preventDefault();
            const zoomFactor = Math.exp(-e.deltaY * 0.0015);
            CONFIG.zoom = Math.min(Math.max(CONFIG.zoom * zoomFactor, 0.1), 10.0);
            uniforms.u_zoom.value = CONFIG.zoom;
            updateGUI();
        }, { passive: false });

        // --- Key Handler (Toggle GUI with 'H') ---
        let guiVisible = true;
        window.addEventListener('keydown', (e) => {
            if (e.key === 'h' || e.key === 'H') {
                guiVisible = !guiVisible;
                gui.show(guiVisible);
            }
        });

        // --- Resize Handler ---
        window.addEventListener('resize', () => {
            const width = window.innerWidth;
            const height = window.innerHeight;
            renderer.setSize(width, height);
            uniforms.u_resolution.value.set(width, height);
        });

        // --- Animation Loop ---
        let animTime = 0;
        let lastTimestamp = performance.now();
        let spinAngle = 0;

        renderer.setAnimationLoop((timestamp) => {
            const delta = Math.min((timestamp - lastTimestamp) * 0.001, 0.1);
            lastTimestamp = timestamp;

            const mode = CONFIG.animationPreset;

            if (mode === 'Static Still') {
                // Static: no camera or fluid time advancement
                uniforms.u_animSpeed.value = 0.0;
                uniforms.u_rotation.value = 0.0;
                uniforms.u_sharpness.value = CONFIG.sharpness;
            } else if (mode === 'Gentle Flow') {
                animTime += delta;
                uniforms.u_animSpeed.value = CONFIG.animSpeed;
                uniforms.u_rotation.value = 0.0;
                uniforms.u_sharpness.value = CONFIG.sharpness;
            } else if (mode === 'Deep Pulse') {
                animTime += delta;
                uniforms.u_animSpeed.value = CONFIG.animSpeed * 0.85;
                const pulse = Math.sin(animTime * 0.8) * 0.45;
                uniforms.u_sharpness.value = Math.max(0.5, CONFIG.sharpness + pulse);
                uniforms.u_rotation.value = Math.sin(animTime * 0.25) * 0.04;
            } else if (mode === 'Vortex Spin') {
                animTime += delta;
                spinAngle += delta * 0.06;
                uniforms.u_animSpeed.value = CONFIG.animSpeed * 0.9;
                uniforms.u_rotation.value = spinAngle;
                uniforms.u_sharpness.value = CONFIG.sharpness;
            } else if (mode === 'Liquid Ripple') {
                animTime += delta * 1.25;
                uniforms.u_animSpeed.value = CONFIG.animSpeed * 1.15;
                const wobble = Math.sin(animTime * 1.1) * 0.07;
                uniforms.u_rotation.value = wobble;
                uniforms.u_sharpness.value = Math.max(0.5, CONFIG.sharpness + Math.cos(animTime * 0.7) * 0.3);
            }

            uniforms.u_time.value = animTime;
            renderer.render(scene, camera);
        });
    </script>
</body>
</html>
