<!DOCTYPE html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1748e8">
  <link rel="icon" href="data:,">
  <title>Botanical / Iridescence</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #1748e8; }
    canvas { display: block; width: 100%; height: 100%; position: fixed; inset: 0; touch-action: none; }

</head>
<body>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.min.js';
import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

// All motion, including the film texture, is a function of this one circle.
const LOOP_SECONDS = 16;
const TAU = Math.PI * 2;
const settings = {
  scheme: 'Original', background: '#1748e8', greenscreen: false, invert: false,
  color1: '#06097a', color2: '#2e06e8', color3: '#a806de',
  color4: '#fa4085', color5: '#ff7a47', color6: '#fab8b0',
  shadow: '#1b1707', accent: '#ff3030',
  animation: 'Botanical sway', speed: 1, wind: 1, flex: 1,
  dpr: Math.min(devicePixelRatio || 1, 1.75, Math.sqrt(4200000 / (innerWidth * innerHeight))),
  zoom: 1, yaw: 0, pitch: 0, positionX: 0, positionY: 0,
  drag: 'Move plant', clickRandomize: true,
  seed: 0, leafSize: 1, fullness: 1, curvature: 1
};
// The two achromatic presets each have both polarities, keeping 19 schemes.
const schemes = {
  'Original': { colors: ['06097A','2E06E8','A806DE','FA4085','FF7A47','FAB8B0'], background: '1748E8', shadow: '1B1707', mode: 0 },
  'Monochromatic': { colors: ['08172C','123C68','245E98','548AC2','9CC7E8','E0F2FF'], background: '081526' },
  'Analogous': { colors: ['180D38','47268C','8A38C7','D85CC3','F7A6C9','FFE0E6'], background: '1E1550' },
  'Complementary': { colors: ['102C50','176A93','28A7BC','E66C2C','FFA458','FFE0AD'], background: '102C50' },
  'Split-complementary': { colors: ['22143C','68318C','B345A1','30B9AD','A5D85B','E8F3BD'], background: '17162D' },
  'Triadic': { colors: ['172A71','4055CD','D74483','FF827C','E4B850','FFF0BA'], background: '15234C' },
  'Tetradic': { colors: ['272444','7354C5','31B8AF','D45C83','EAA356','FCE7CE'], background: '171E33' },
  'Double split-complementary': { colors: ['2B2045','725BC7','D456A7','2EBFB5','D4C85B','F5E0B6'], background: '152D38' },
  'Achromatic': { colors: ['080808','292929','555555','929292','CBCBCB','FAFAFA'], background: '000000', mode: 2 },
  'Achromatic + Accent': { colors: ['080808','292929','555555','929292','CBCBCB','FAFAFA'], background: '000000', accent: 'FF3030', mode: 3 },
  'Neutral + accent': { colors: ['242320','57534D','8D857A','B5AA98','D6CDBD','F1EADF'], background: 'DCD7CF', shadow: '27251F', accent: 'D45B39', mode: 4 },
  'Amber / Oxblood': { colors: ['F6AA1C','BC3908','941B0C','F6AA1C','220901'], background: '220901' },
  'Lagoon / Ink': { colors: ['63D1CF','5BC0BE','4BAD9E','4BAD9E','0B132B','000000'], background: '0B132B' },
  'Orchid / Aubergine': { colors: ['AA60C8','D69ADE','C9A3C6','CFB5C2','0D001D','120A12'], background: '0D001D' },
  'Saffron / Petrol': { colors: ['FEF1BE','FFBA00','008189','00474D','061210'], background: '061210' },
  'Chartreuse / Forest': { colors: ['D4FFB0','7FFF00','00B894','0A3322','05140A'], background: '05140A' },
  'Tangerine / Plum': { colors: ['FFE8CC','FF8C00','C7501A','3D1050','0E0618'], background: '0E0618' },
  'Lavender / Midnight': { colors: ['E8E0FF','B38FFF','6A3DE8','1A1250','090612'], background: '090612' },
  'Cyan / Fuchsia': { colors: ['E0FBFF','00F0FF','D40078','1E0A3D','05020F'], background: '05020F' }
};
const animations = ['Botanical sway', 'Breathing', 'Tidal sway', 'Leaf cascade', 'Pendulum', 'Slow orbit', 'Figure-eight drift', 'Rising current', 'Static'];
// Shaders operate in display RGB to preserve the original art direction.
function rgb(hex) {
  const n = parseInt(hex.replace('#', ''), 16);
  return new THREE.Vector3((n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255);
}
const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false, powerPreference: 'high-performance' });
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
renderer.setClearColor(new THREE.Color(0.09, 0.274, 0.91), 1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 70);
const target = new THREE.WebGLRenderTarget(1, 1, {
  minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
  depthBuffer: true, samples: Math.min(4, renderer.capabilities.maxSamples)
});
target.depthTexture = new THREE.DepthTexture(1, 1, THREE.UnsignedIntType);
const SHADOW_SIZE = Math.min(2048, renderer.capabilities.maxTextureSize);
const shadowTarget = new THREE.WebGLRenderTarget(SHADOW_SIZE, SHADOW_SIZE, {
  minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter
});
shadowTarget.depthTexture = new THREE.DepthTexture(SHADOW_SIZE, SHADOW_SIZE, THREE.UnsignedIntType);
const lightCamera = new THREE.OrthographicCamera(-9, 9, 10, -10, 0.5, 40);
lightCamera.position.set(-0.53, 0.66, 0.65).normalize().multiplyScalar(18).add(new THREE.Vector3(0, 0.5, 0));
lightCamera.lookAt(0, 0.5, 0);
lightCamera.updateMatrixWorld();
const lightMatrix = new THREE.Matrix4().multiplyMatrices(lightCamera.projectionMatrix, lightCamera.matrixWorldInverse);

const uniforms = {
  uPhase: { value: 0 },
  uShadowPass: { value: false },
  uLightMatrix: { value: lightMatrix },
  uShadow: { value: shadowTarget.depthTexture },
  uShadowCaster: { value: shadowTarget.texture },
  uShadowTexel: { value: new THREE.Vector2(1 / SHADOW_SIZE, 1 / SHADOW_SIZE) },
  uEye: { value: camera.position },
  uWind: { value: 1 }, uFlex: { value: 1 },
  uPalette: { value: Array.from({ length: 6 }, (_, i) => rgb(settings['color' + (i + 1)])) },
  uDark: { value: rgb(settings.shadow) }, uAccent: { value: rgb(settings.accent) },
  uSchemeMode: { value: 0 }, uInvert: { value: false }
};

// The same world-space wind field bends the trunk, petioles and leaf blades.
// Leaf-local flex is zero at the attachment, so the hierarchy cannot open up.
const windGLSL = /* glsl */`
  uniform float uPhase;
  uniform float uWind;
  uniform float uFlex;
  vec3 wind(vec3 p) {
    vec3 rest = p;
    float h = clamp((p.y + 7.5) / 15.0, 0.0, 1.0);
    float gust = sin(uPhase) + 0.23 * sin(2.0 * uPhase - 0.7);
    p.x += h * h * 0.23 * gust + h * 0.027 * sin(uPhase - p.y * 0.32);
    p.z += h * h * (0.15 * sin(uPhase + 0.8) + 0.025 * sin(3.0 * uPhase));
    p.y += 0.018 * h * sin(2.0 * uPhase - p.y * 0.18);
    return mix(rest, p, uWind);
  }
`;

const leafVertex = /* glsl */`
  attribute vec4 aLeaf;  // length, half-width, camber, phase offset
  attribute vec4 aShape; // asymmetry, tip drop, twist, identity
  uniform mat4 uLightMatrix;
  varying vec3 vWorld;
  varying vec3 vNormal;
  varying vec2 vLeaf;
  varying float vUpper;
  varying float vIdentity;
  varying float vCasterId;
  ${windGLSL}

  vec3 surface(float s, float angle) {
    float across = cos(angle);
    float envelope = pow(max(sin(3.14159265 * s), 0.0), 0.61);
    float width = envelope * (0.83 + 0.17 * s);
    float asymmetry = 1.0 + aShape.x * across * sin(3.14159265 * s);
    float y = across * aLeaf.y * width * asymmetry;
    y += aShape.x * aLeaf.x * (0.7 * s * s + 0.3 * sin(3.14159265 * s));
    float arch = aLeaf.x * (aLeaf.z * sin(3.14159265 * s) - aShape.y * s * s);
    float dome = aLeaf.y * width * (0.29 * (1.0 - across * across)
      + 0.037 * exp(-across * across * 105.0) + 0.075 * pow(across, 6.0));
    dome += aLeaf.y * width * 0.055 * across * sin(s * 7.0 + aShape.w);
    float thickness = aLeaf.x * 0.010 * envelope * sin(angle);
    float z = arch + dome + thickness;
    z += uFlex * aLeaf.x * 0.027 * s * s * sin(uPhase + aLeaf.w - s * 2.3);
    z += uFlex * aLeaf.x * 0.008 * s * s * across * across * sin(2.0 * uPhase + aLeaf.w - s * 4.0);
    float twist = aShape.z * s + uFlex * 0.037 * s * sin(uPhase + aLeaf.w - 0.9 * s);
    return vec3(aLeaf.x * s, y * cos(twist) - z * sin(twist), y * sin(twist) + z * cos(twist));
  }

  vec3 toWorld(float s, float a) {
    return wind((modelMatrix * instanceMatrix * vec4(surface(s, a), 1.0)).xyz);
  }

  void main() {
    float s = uv.x;
    float a = uv.y * 6.28318530718;
    vec3 p = toWorld(s, a);
    // Recompute the normal from the animated surface, including global wind.
    float lo = max(0.0001, s - 0.0006);
    float hi = min(0.9999, s + 0.0006);
    vec3 ds = toWorld(hi, a) - toWorld(lo, a);
    vec3 da = toWorld(s, a + 0.002) - toWorld(s, a - 0.002);
    vNormal = normalize(cross(da, ds));
    vWorld = p;
    vLeaf = vec2(s, cos(a));
    vUpper = smoothstep(-0.16, 0.16, sin(a));
    vIdentity = aShape.w;
    vCasterId = floor(aShape.w / 0.71 + 1.5);
    gl_Position = projectionMatrix * viewMatrix * vec4(p, 1.0);
  }
`;

const shadingGLSL = /* glsl */`
  uniform bool uShadowPass;
  uniform float uPhase;
  uniform sampler2D uShadow;
  uniform sampler2D uShadowCaster;
  uniform vec2 uShadowTexel;
  uniform mat4 uLightMatrix;
  uniform vec3 uEye;
  uniform vec3 uPalette[6];
  uniform vec3 uDark;
  uniform vec3 uAccent;
  uniform int uSchemeMode;
  uniform bool uInvert;
  varying vec3 vWorld;
  varying vec3 vNormal;
  varying float vCasterId;

  float shadowTap(vec2 uv, float receiverDepth, float bias) {
    if (any(lessThan(uv, vec2(0.0))) || any(greaterThan(uv, vec2(1.0)))) return 1.0;
    float casterId = floor(texture2D(uShadowCaster, uv).r * 255.0 + 0.5);
    // A thin leaf must not mistake its own opposite surface for an occluder.
    // IDs are sampled at the same texel as depth, without interpolating IDs.
    if (casterId < 0.5 || abs(casterId - vCasterId) < 0.5) return 1.0;
    float depth = texture2D(uShadow, uv).r;
    return smoothstep(-0.00010, 0.00010, depth - receiverDepth + bias);
  }

  float shadowAt(vec3 p, vec3 normal, float facing) {
    // Small world-space normal offset replaces the old, detached depth bias.
    vec4 q = uLightMatrix * vec4(p + normal * 0.006, 1.0);
    vec3 uvz = q.xyz / q.w * 0.5 + 0.5;
    if (any(lessThan(uvz, vec3(0.0))) || any(greaterThan(uvz, vec3(1.0)))) return 1.0;
    float bias = 0.00012 + 0.00018 * (1.0 - max(facing, 0.0));
    // A stable disk filter softens contact shadows without a square PCF grid.
    // Its radius is in world units, so changing shadow resolution preserves it.
    vec2 radius = uShadowTexel * (float(${SHADOW_SIZE}) * 0.0055);
    float visibility = 0.0;
    visibility += shadowTap(uvz.xy + vec2(-0.942016, -0.399062) * radius, uvz.z, bias);
    visibility += shadowTap(uvz.xy + vec2( 0.945586, -0.768907) * radius, uvz.z, bias);
    visibility += shadowTap(uvz.xy + vec2(-0.094184, -0.929389) * radius, uvz.z, bias);
    visibility += shadowTap(uvz.xy + vec2( 0.344959,  0.293878) * radius, uvz.z, bias);
    visibility += shadowTap(uvz.xy + vec2(-0.915886,  0.457714) * radius, uvz.z, bias);
    visibility += shadowTap(uvz.xy + vec2(-0.815442, -0.879125) * radius, uvz.z, bias);
    visibility += shadowTap(uvz.xy + vec2(-0.382775,  0.276768) * radius, uvz.z, bias);
    visibility += shadowTap(uvz.xy + vec2( 0.974844,  0.756484) * radius, uvz.z, bias);
    visibility += shadowTap(uvz.xy + vec2( 0.443233, -0.975116) * radius, uvz.z, bias);
    visibility += shadowTap(uvz.xy + vec2( 0.537430, -0.473734) * radius, uvz.z, bias);
    visibility += shadowTap(uvz.xy + vec2(-0.264969, -0.418930) * radius, uvz.z, bias);
    visibility += shadowTap(uvz.xy + vec2( 0.791975,  0.190902) * radius, uvz.z, bias);
    visibility += shadowTap(uvz.xy + vec2(-0.241888,  0.997065) * radius, uvz.z, bias);
    visibility += shadowTap(uvz.xy + vec2(-0.814100,  0.914376) * radius, uvz.z, bias);
    visibility += shadowTap(uvz.xy + vec2( 0.199841,  0.786414) * radius, uvz.z, bias);
    visibility += shadowTap(uvz.xy + vec2( 0.143832, -0.141008) * radius, uvz.z, bias);
    return visibility / 16.0;
  }

  // A deliberately restricted thin-film palette: blue / violet / coral / pearl.
  vec3 silk(float t) {
    if (uSchemeMode != 0) {
      vec3 c = mix(uPalette[0], uPalette[1], smoothstep(0.02, 0.24, t));
      c = mix(c, uPalette[2], smoothstep(0.23, 0.39, t));
      c = mix(c, uPalette[3], smoothstep(0.38, 0.55, t));
      c = mix(c, uPalette[4], smoothstep(0.53, 0.77, t));
      return mix(c, uPalette[5], smoothstep(0.75, 1.05, t));
    }
    vec3 c = mix(vec3(0.025, 0.035, 0.48), vec3(0.18, 0.025, 0.91), smoothstep(0.02, 0.24, t));
    c = mix(c, vec3(0.66, 0.025, 0.87), smoothstep(0.23, 0.39, t));
    c = mix(c, vec3(0.98, 0.25, 0.52), smoothstep(0.38, 0.51, t));
    c = mix(c, vec3(1.0, 0.48, 0.28), smoothstep(0.49, 0.62, t));
    c = mix(c, vec3(0.98, 0.72, 0.69), smoothstep(0.59, 0.81, t));
    return mix(c, vec3(0.79, 0.70, 0.84), smoothstep(0.84, 1.1, t));
  }

  vec3 illuminate(vec3 n, float upper, float identity, vec2 leafUV) {
    vec3 eye = normalize(uEye - vWorld);
    vec3 key = normalize(vec3(-0.53, 0.66, 0.65));
    float ndl = dot(n, key);
    float fresnel = pow(1.0 - max(dot(n, eye), 0.0), 3.0);
    float breathing = 0.018 * sin(uPhase - 0.6);
    float interference = dot(n, normalize(vec3(-0.81, 0.21, 0.61))) * 1.03;
    interference += 0.065 + fresnel * 0.13 + 0.065 * sin(identity * 2.8);
    interference += 0.07 * sin(dot(n, vec3(7.0, 2.5, 3.0)));
    vec3 lightColor = silk(interference);
    float diffuse = smoothstep(-0.18, 0.58, ndl);
    float shadow = shadowAt(vWorld, n, ndl);
    float lit = diffuse * mix(0.55, 1.0, shadow);
    vec3 dark = uDark;
    dark += (uSchemeMode == 0 ? vec3(0.009, 0.005, 0.013) : uPalette[1] * 0.014) * (0.5 + 0.5 * n.y);
    dark += silk(interference) * 0.018 * diffuse;
    vec3 color = mix(dark, lightColor * (0.87 + breathing + 0.13 * diffuse), upper * lit);

    // Broad, low-energy wax reflection; deliberately no chrome or bloom.
    float softbox = pow(max(dot(n, normalize(key + eye)), 0.0), 19.0);
    color += (uSchemeMode == 0 ? vec3(0.17, 0.095, 0.10) : uPalette[5] * 0.14) * softbox * upper * shadow;
    float blueFill = pow(max(dot(n, normalize(vec3(0.85, -0.1, 0.45))), 0.0), 3.0);
    color += (uSchemeMode == 0 ? vec3(0.012, 0.007, 0.10) : uPalette[2] * 0.07) * blueFill * upper;
    float rim = pow(1.0 - abs(dot(n, eye)), 7.0);
    float rimFacing = smoothstep(-0.4, 0.8, n.x - n.y * 0.3);
    color += rim * (uSchemeMode == 0 ? mix(vec3(0.15, 0.015, 0.40), vec3(0.01, 0.27, 0.64), rimFacing) : mix(uPalette[2], uPalette[4], rimFacing)) * 0.47;
    float warmRim = pow(1.0 - abs(dot(n, eye)), 12.0) * smoothstep(-0.2, 0.55, ndl);
    color += silk(0.63 + 0.18 * n.y) * warmRim * 0.78;

    // A fine midrib and barely perceptible oblique secondary veins.
    float midrib = exp(-abs(leafUV.y) * 180.0) * sin(leafUV.x * 3.14159265);
    float veins = pow(max(0.0, cos(leafUV.x * 89.0 - abs(leafUV.y) * 11.0)), 24.0);
    color += (midrib * 0.028 + veins * 0.003) * upper * lit * (uSchemeMode == 0 ? vec3(0.45, 0.26, 0.36) : uPalette[4]);
    if (uSchemeMode == 2 || uSchemeMode == 3) {
      float gray = dot(color, vec3(0.299, 0.587, 0.114));
      color = vec3(uInvert ? 1.0 - gray : gray);
    }
    if (uSchemeMode == 3 || uSchemeMode == 4) {
      float accentBand = smoothstep(0.48, 0.58, interference) * (1.0 - smoothstep(0.65, 0.74, interference));
      float accentMask = clamp(accentBand * upper * lit * 0.85 + warmRim * 0.55, 0.0, 0.9);
      color = mix(color, uAccent, accentMask);
    }
    return color;
  }
`;

const leafMaterial = new THREE.ShaderMaterial({
  uniforms, vertexShader: leafVertex,
  fragmentShader: /* glsl */`
    varying vec2 vLeaf;
    varying float vUpper;
    varying float vIdentity;
    ${shadingGLSL}
    void main() {
      if (uShadowPass) { gl_FragColor = vec4(vCasterId / 255.0, 0.0, 0.0, 1.0); return; }
      vec3 n = normalize(vNormal);
      gl_FragColor = vec4(illuminate(n, vUpper, vIdentity, vLeaf), 1.0);
    }
  `,
  side: THREE.DoubleSide
});

// A closed, two-sided, genuinely thick lamina, not a deformed flat plane.
const longitudinal = 72, radial = 40;
const positions = [], uvs = [], indices = [];
for (let i = 0; i <= longitudinal; i++) {
  for (let j = 0; j <= radial; j++) {
    // Tiny finite end sections avoid undefined normals at the two poles.
    const s = THREE.MathUtils.lerp(0.0001, 0.9999, i / longitudinal);
    positions.push(s, 0, 0);
    uvs.push(s, j / radial);
    if (i < longitudinal && j < radial) {
      const a = i * (radial + 1) + j, b = a + radial + 1;
      indices.push(a, a + 1, b, a + 1, b + 1, b);
    }
  }
}
const leafGeometry = new THREE.BufferGeometry();
leafGeometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
leafGeometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
leafGeometry.setIndex(indices);

const plantShape = { lean: 0.172, bend: 0.24, depth: 0.17, phase: 0 };
function stemAt(y) {
  return new THREE.Vector3(-0.83 + (y + 6.0) * plantShape.lean + plantShape.bend * Math.sin(y * 0.64 + plantShape.phase), y, plantShape.depth * Math.sin(y * 0.48));
}
function seededRandom(seed) {
  let state = seed >>> 0;
  return () => {
    state += 0x6D2B79F5;
    let n = state;
    n = Math.imul(n ^ n >>> 15, n | 1);
    n ^= n + Math.imul(n ^ n >>> 7, n | 61);
    return ((n ^ n >>> 14) >>> 0) / 4294967296;
  };
}

// Height, direction, rise, depth, blade length, half-width, roll.
// The choreography is composed, rather than a ring of identical radial leaves.
const leafDesign = [
  [-6.90, -1,  0.12,  0.10, 2.65, 0.88,  2.60],
  [-6.05,  1,  0.58, -0.48, 2.65, 0.88,  2.05],
  [-5.65, -1,  0.23, -0.32, 2.80, 0.83,  2.70],
  [-3.95, -1, -0.40,  0.58, 3.85, 1.12, -0.12],
  [-4.40,  1, -0.14, -0.64, 2.40, 0.82,  2.05],
  [-3.65, -1,  0.08, -0.30, 2.85, 0.91,  2.65],
  [-2.35,  1, -0.50,  0.65, 3.55, 1.02,  0.36],
  [-2.30, -0.3, 1.0,  0.46, 2.45, 0.80, -0.30],
  [-1.90, -1,  0.34, -0.42, 2.75, 0.88,  2.05],
  [-1.55,  1, -0.42, -0.32, 2.65, 0.83,  2.15],
  [ 0.05, -1,  0.04,  0.58, 3.35, 0.85, -0.56],
  [ 0.05,  1,  0.26, -0.57, 2.55, 0.68,  1.95],
  [ 1.30, -1,  0.26,  0.02, 2.95, 0.85,  0.64],
  [ 2.05,  1, -0.05,  0.34, 3.10, 0.90,  0.78],
  [ 2.35, -1,  0.36, -0.28, 2.70, 0.77,  2.05],
  [ 2.65,  1,  0.28, -0.19, 2.65, 0.76,  2.20],
  [ 3.50, -1, -0.04,  0.30, 2.85, 0.75, -0.72],
  [ 4.05, -1,  0.67, -0.15, 2.00, 0.72,  2.15],
  [ 4.65,  0.5, 1.00, 0.12, 2.65, 0.77,  0.58],
  [ 5.00, -0.4, 1.00, 0.08, 1.60, 0.39, -0.28],
  [-5.60, -1, -0.22, -0.68, 3.85, 0.80,  0.48],
  [-3.50, -1,  0.65, -0.86, 3.60, 0.73,  2.40],
  [ 5.53, 0.08,  1.0, 0.12, 0.72, 0.095, 0.3]
];

const leaves = new THREE.InstancedMesh(leafGeometry, leafMaterial, leafDesign.length);
// GPU deformations extend outside the undeformed placeholder bounds.
leaves.frustumCulled = false;

function makeTube(curve, r0, r1, segments = 32) {
  const p = [], n = [], uv = [], ix = [], sides = 12;
  const axis = new THREE.Vector3(0, 0, 1);
  for (let i = 0; i <= segments; i++) {
    const t = i / segments, c = curve.getPoint(t), tangent = curve.getTangent(t).normalize();
    const a = new THREE.Vector3().crossVectors(tangent, axis).normalize();
    const b = new THREE.Vector3().crossVectors(tangent, a).normalize();
    const radius = THREE.MathUtils.lerp(r0, r1, t);
    for (let j = 0; j <= sides; j++) {
      const angle = j / sides * TAU;
      const normal = a.clone().multiplyScalar(Math.cos(angle)).addScaledVector(b, Math.sin(angle));
      const v = c.clone().addScaledVector(normal, radius);
      p.push(v.x, v.y, v.z); n.push(normal.x, normal.y, normal.z); uv.push(t, j / sides);
      if (i < segments && j < sides) {
        const k = i * (sides + 1) + j;
        ix.push(k, k + sides + 1, k + 1, k + 1, k + sides + 1, k + sides + 2);
      }
    }
  }
  return { p, n, uv, ix };
}

function buildPlant() {
  const random = seededRandom(settings.seed);
  const jitter = () => settings.seed === 0 ? 0 : random() - 0.5;
  plantShape.lean = 0.172 + jitter() * 0.10;
  plantShape.bend = 0.24 + jitter() * 0.25;
  plantShape.depth = 0.17 + jitter() * 0.22;
  plantShape.phase = jitter() * 0.5;
  const leafData = [], shapeData = [], tubes = [], trunkPoints = [];
  for (let i = 0; i <= 36; i++) trunkPoints.push(stemAt(-8.4 + i / 36 * 14.0));
  tubes.push(makeTube(new THREE.CatmullRomCurve3(trunkPoints), 0.19, 0.014, 160));
  leafDesign.forEach((d, i) => {
  let [height, dx, dy, dz, length, width, roll] = d;
  height += i === 22 ? 0 : jitter() * 0.27;
  dx *= 1 + jitter() * 0.25;
  dy += jitter() * 0.24;
  dz += jitter() * 0.36;
  roll += jitter() * 0.55;
  length *= settings.leafSize * (1 + jitter() * 0.24);
  width *= settings.leafSize * settings.fullness * (1 + jitter() * 0.22);
  const root = stemAt(height);
  const direction = new THREE.Vector3(dx, dy, dz).normalize();
  const petioleLength = i === 22 ? 0.035 : i >= 20 ? 1.10 : 0.30 + 0.12 * (0.5 + 0.5 * Math.sin(i * 2.1));
  const attachment = root.clone().addScaledVector(direction, petioleLength);
  attachment.y += 0.11;
  const cross = new THREE.Vector3(-direction.y, direction.x, 0).normalize().applyAxisAngle(direction, roll);
  const normal = new THREE.Vector3().crossVectors(direction, cross).normalize();
  const matrix = new THREE.Matrix4().makeBasis(direction, cross, normal).setPosition(attachment);
  leaves.setMatrixAt(i, matrix);
  leafData.push(length, width, (0.155 + 0.065 * Math.sin(i * 1.7)) * settings.curvature, height * 0.24 + i * 0.37 + jitter() * 0.8);
  shapeData.push(0.16 * Math.sin(i * 2.37 + 0.3) + jitter() * 0.07, (0.14 + 0.075 * Math.sin(i * 1.21)) * settings.curvature, 0.28 * Math.sin(i * 1.6) + jitter() * 0.15, i * 0.71);
  const curve = new THREE.CubicBezierCurve3(
    root,
    root.clone().add(new THREE.Vector3(dx * 0.12, 0.18, dz * 0.12)),
    attachment.clone().addScaledVector(direction, -0.16),
    attachment

  });
for (const [name, data] of [['aLeaf', leafData], ['aShape', shapeData]]) {
  const existing = leafGeometry.getAttribute(name);
  if (existing) { existing.array.set(data); existing.needsUpdate = true; }
  else leafGeometry.setAttribute(name, new THREE.InstancedBufferAttribute(new Float32Array(data), 4));
}
leaves.instanceMatrix.needsUpdate = true;

// Merge all structural tubes into a single draw call.
const tubeP = [], tubeN = [], tubeUV = [], tubeIX = [];
for (const tube of tubes) {
  const offset = tubeP.length / 3;
  tubeP.push(...tube.p); tubeN.push(...tube.n); tubeUV.push(...tube.uv);
  for (const index of tube.ix) tubeIX.push(index + offset);
}
const geometry = new THREE.BufferGeometry();
geometry.setAttribute('position', new THREE.Float32BufferAttribute(tubeP, 3));
geometry.setAttribute('normal', new THREE.Float32BufferAttribute(tubeN, 3));
geometry.setAttribute('uv', new THREE.Float32BufferAttribute(tubeUV, 2));

}
const stemGeometry = buildPlant();
scene.add(leaves);
const stemMaterial = new THREE.ShaderMaterial({
  uniforms,
  vertexShader: /* glsl */`
    varying vec3 vWorld;
    varying vec3 vNormal;
    varying float vCasterId;
    ${windGLSL}
    void main() {
      vec3 p = (modelMatrix * vec4(position, 1.0)).xyz;
      vec3 n = normalize(mat3(modelMatrix) * normal);
      vec3 tangent = normalize(cross(n, vec3(0.001, 1.0, 0.001)));
      vec3 bitangent = cross(n, tangent);
      vWorld = wind(p);
      vCasterId = 254.0;
      vNormal = normalize(cross(wind(p + tangent * 0.005) - vWorld, wind(p + bitangent * 0.005) - vWorld));

  fragmentShader: /* glsl */`
    ${shadingGLSL}

    }

  side: THREE.DoubleSide

const stems = new THREE.Mesh(stemGeometry, stemMaterial);
stems.frustumCulled = false;
scene.add(stems);
function regeneratePlant() {
  const next = buildPlant();
  stems.geometry.dispose();
  stems.geometry = next;
}

// One restrained optical finish, with no external textures or image assets.
const finishScene = new THREE.Scene();
const finishCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const finishMaterial = new THREE.ShaderMaterial({
  depthTest: false, depthWrite: false,
  uniforms: {
    uImage: { value: target.texture },
    uSceneDepth: { value: target.depthTexture },
    uNearFar: { value: new THREE.Vector2(camera.near, camera.far) },
    uResolution: { value: new THREE.Vector2() },
    uPhase: uniforms.uPhase,
    uBackground: { value: rgb(settings.background) },
    uGreenscreen: { value: false },
    uMonochrome: { value: false }
  },
  vertexShader: /* glsl */`
    varying vec2 vUv;
    void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
  `,
  fragmentShader: /* glsl */`
    uniform sampler2D uImage;
    uniform sampler2D uSceneDepth;
    uniform vec2 uNearFar;
    uniform vec2 uResolution;
    uniform float uPhase;
    uniform vec3 uBackground;
    uniform bool uGreenscreen;
    uniform bool uMonochrome;
    varying vec2 vUv;
    float viewDepth(vec2 uv) {
      float depth = texture2D(uSceneDepth, uv).r;
      return uNearFar.x * uNearFar.y / (uNearFar.y - depth * (uNearFar.y - uNearFar.x));
    }
    float hash(vec2 p) {
      vec3 p3 = fract(vec3(p.xyx) * 0.1031);
      p3 += dot(p3, p3.yzx + 33.33);
      return fract((p3.x + p3.y) * p3.z);
    }
    void main() {
      vec2 uv = vUv;
      vec2 texel = 1.0 / uResolution;
      vec4 image = texture2D(uImage, uv);
      float coverage = image.a;
      vec3 color = image.rgb / max(coverage, 0.00001);
      // Keep optical channel offsets on the same surface. At an overlap,
      // sampling the leaf behind it would copy its color onto the front leaf.
      if (!uMonochrome) {
        vec2 redUV = uv + vec2(texel.x * 0.48, 0.0);
        vec2 blueUV = uv - vec2(texel.x * 0.48, 0.0);
        vec4 r = texture2D(uImage, redUV);
        vec4 b = texture2D(uImage, blueUV);
        float centerDepth = viewDepth(uv);
        float tolerance = max(0.01, centerDepth * 0.0005);
        if (r.a > 0.01 && abs(viewDepth(redUV) - centerDepth) < tolerance) color.r = r.r / r.a;
        if (b.a > 0.01 && abs(viewDepth(blueUV) - centerDepth) < tolerance) color.b = b.b / b.a;
      }

      float a = hash(p) - 0.5;
      float b = hash(p + 173.71) - 0.5;
      float c = hash(p - 92.37) - 0.5;
      float grain = 0.64 * a + 0.36 * (b * cos(16.0 * uPhase) + c * sin(16.0 * uPhase));
      float vignette = dot(uv - 0.5, uv - 0.5);
      color *= 1.015 - vignette * 0.075;
      color += grain * (0.057 - 0.015 * dot(color, vec3(0.299, 0.587, 0.114)));
      if (!uMonochrome) color += vec3(b, -a, c) * 0.002;
      vec3 background = uGreenscreen ? vec3(0.0, 1.0, 0.0) : uBackground * (1.015 - vignette * 0.075) + grain * 0.045;

});
finishScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), finishMaterial));

function refreshPanel() {
  for (const controller of gui.controllersRecursive()) controller.updateDisplay();
}
function applyBackground() {
  finishMaterial.uniforms.uBackground.value.copy(rgb(settings.background));
  finishMaterial.uniforms.uGreenscreen.value = settings.greenscreen;
}
function applyColors(edited = false) {
  const preset = schemes[settings.scheme];
  const mode = edited && settings.scheme === 'Original' ? 1 : (preset.mode ?? 1);
  const colors = Array.from({ length: 6 }, (_, i) => rgb(settings['color' + (i + 1)]));
  colors.sort((a, b) => (a.x - b.x) * 0.299 + (a.y - b.y) * 0.587 + (a.z - b.z) * 0.114);
  colors.forEach((color, i) => uniforms.uPalette.value[i].copy(color));
  uniforms.uDark.value.copy(rgb(settings.shadow));
  uniforms.uAccent.value.copy(rgb(settings.accent));
  uniforms.uSchemeMode.value = mode;
  uniforms.uInvert.value = settings.invert;
  finishMaterial.uniforms.uMonochrome.value = mode === 2 || mode === 3;
}
function applyScheme() {
  const preset = schemes[settings.scheme];
  for (let i = 0; i < 6; i++) settings['color' + (i + 1)] = '#' + preset.colors[Math.round(i * (preset.colors.length - 1) / 5)].toLowerCase();
  const darkest = preset.colors.slice().sort((a, b) => {
    const x = rgb(a), y = rgb(b);
    return (x.x - y.x) * 0.299 + (x.y - y.y) * 0.587 + (x.z - y.z) * 0.114;
  })[0];
  settings.shadow = '#' + (preset.shadow || darkest).toLowerCase();
  settings.accent = '#' + (preset.accent || 'FF3030').toLowerCase();
  settings.background = '#' + ((preset.mode === 2 || preset.mode === 3) && settings.invert ? 'ffffff' : preset.background.toLowerCase());
  applyColors();
  applyBackground();
  refreshPanel();
}

const gui = new GUI({ title: 'Botanical settings' });
gui.add(settings, 'scheme', Object.keys(schemes)).name('Color scheme').onChange(applyScheme);
gui.addColor(settings, 'background').name('Background').onChange(applyBackground);
gui.add(settings, 'greenscreen').name('Greenscreen').onChange(applyBackground);
gui.add(settings, 'invert').name('Invert black / white').onChange(() => {
  const mode = schemes[settings.scheme].mode;
  if (mode === 2 || mode === 3) {
    settings.background = settings.invert ? '#ffffff' : '#000000';
    applyBackground();
  }
  uniforms.uInvert.value = settings.invert;
  refreshPanel();
});
const motionFolder = gui.addFolder('Animation');
motionFolder.add(settings, 'animation', animations).name('Motion');
motionFolder.add(settings, 'speed', 0, 2.5, 0.05).name('Speed');
motionFolder.add(settings, 'wind', 0, 2, 0.05).name('Stem sway');
motionFolder.add(settings, 'flex', 0, 2, 0.05).name('Leaf flex');
const viewFolder = gui.addFolder('View');
viewFolder.add(settings, 'zoom', 0.25, 4, 0.01).name('Zoom');
viewFolder.add(settings, 'yaw', -180, 180, 0.1).name('Camera angle');
viewFolder.add(settings, 'pitch', -70, 70, 0.1).name('Camera elevation');
viewFolder.add(settings, 'positionX', -3, 3, 0.01).name('Position X');
viewFolder.add(settings, 'positionY', -3, 3, 0.01).name('Position Y');
viewFolder.add(settings, 'drag', ['Move plant', 'Orbit camera']).name('Drag action');
viewFolder.add({ reset() {
  Object.assign(settings, { zoom: 1, yaw: 0, pitch: 0, positionX: 0, positionY: 0 });
  refreshPanel();
} }, 'reset').name('Reset view');
viewFolder.close();
const colorFolder = gui.addFolder('Palette colors');
for (let i = 1; i <= 6; i++) colorFolder.addColor(settings, 'color' + i).name('Band ' + i).onChange(() => applyColors(true));
colorFolder.addColor(settings, 'shadow').name('Shadow').onChange(() => applyColors(true));
colorFolder.addColor(settings, 'accent').name('Accent').onChange(() => applyColors(true));
colorFolder.close();
const plantFolder = gui.addFolder('Plant variation');
plantFolder.add(settings, 'seed', 0, 999999, 1).name('Seed').onFinishChange(regeneratePlant);
plantFolder.add(settings, 'leafSize', 0.7, 1.4, 0.01).name('Leaf size').onFinishChange(regeneratePlant);
plantFolder.add(settings, 'fullness', 0.65, 1.4, 0.01).name('Leaf width').onFinishChange(regeneratePlant);
plantFolder.add(settings, 'curvature', 0.6, 1.5, 0.01).name('Curvature').onFinishChange(regeneratePlant);
plantFolder.close();
gui.add(settings, 'dpr', 0.25, 3, 0.05).name('DPR / Pixel ratio').onChange(resize);
gui.add(settings, 'clickRandomize').name('Randomize on click');
gui.add({ randomize: randomizeScene }, 'randomize').name('New variation');
applyScheme();

function randomizeScene() {
  const names = Object.keys(schemes).filter(name => name !== settings.scheme);
  settings.scheme = names[Math.floor(Math.random() * names.length)];
  const nextSeed = 1 + Math.floor(Math.random() * 999999);
  settings.seed = nextSeed === settings.seed ? nextSeed % 999999 + 1 : nextSeed;
  const random = seededRandom(settings.seed);
  settings.leafSize = +(0.88 + random() * 0.30).toFixed(2);
  settings.fullness = +(0.8 + random() * 0.4).toFixed(2);
  settings.curvature = +(0.8 + random() * 0.5).toFixed(2);
  settings.animation = animations[Math.floor(random() * 8)];
  settings.speed = +(0.45 + random() * 0.6).toFixed(2);
  settings.wind = +(0.55 + random() * 0.9).toFixed(2);
  settings.flex = +(0.7 + random() * 0.8).toFixed(2);
  settings.invert = random() > 0.5;
  regeneratePlant();
  applyScheme();
}

let uiVisible = true;
addEventListener('keydown', event => {
  if (event.key.toLowerCase() === 'h' && !event.repeat && !event.ctrlKey && !event.metaKey && !event.altKey) {
    event.preventDefault();
    uiVisible = !uiVisible;
    gui.show(uiVisible);
  }
}, { capture: true });

// Manual framing is stored separately from every animated camera offset.
// The canvas owns gestures; GUI interaction never triggers a scene variation.
const canvas = renderer.domElement;
canvas.addEventListener('wheel', event => {
  event.preventDefault();
  const units = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? innerHeight : 1;
  settings.zoom = THREE.MathUtils.clamp(settings.zoom * Math.exp(-event.deltaY * units * 0.0012), 0.25, 4);
  refreshPanel();
}, { passive: false });
canvas.addEventListener('contextmenu', event => event.preventDefault());
const pointers = new Map();
let gestureMoved = false, multiTouch = false;
function pan(dx, dy) {
  settings.positionX = THREE.MathUtils.clamp(settings.positionX + dx * 2 / innerWidth, -3, 3);
  settings.positionY = THREE.MathUtils.clamp(settings.positionY - dy * 2 / innerHeight, -3, 3);
}
canvas.addEventListener('pointerdown', event => {
  if (pointers.size === 0) { gestureMoved = false; multiTouch = false; }
  pointers.set(event.pointerId, { x: event.clientX, y: event.clientY, startX: event.clientX, startY: event.clientY, button: event.button });
  multiTouch ||= pointers.size > 1;
  canvas.setPointerCapture(event.pointerId);
});
canvas.addEventListener('pointermove', event => {
  const pointer = pointers.get(event.pointerId);
  if (!pointer) return;
  const dx = event.clientX - pointer.x, dy = event.clientY - pointer.y;
  if (Math.hypot(event.clientX - pointer.startX, event.clientY - pointer.startY) > 5) gestureMoved = true;
  if (pointers.size > 1) {
    const pair = [...pointers.values()].slice(0, 2);
    const before = Math.hypot(pair[0].x - pair[1].x, pair[0].y - pair[1].y);
    pointer.x = event.clientX; pointer.y = event.clientY;
    const after = Math.hypot(pair[0].x - pair[1].x, pair[0].y - pair[1].y);
    if (before > 1) settings.zoom = THREE.MathUtils.clamp(settings.zoom * after / before, 0.25, 4);
    pan(dx * 0.5, dy * 0.5);
  } else {
    if (settings.drag === 'Orbit camera' || pointer.button === 2 || event.shiftKey) {
      settings.yaw = THREE.MathUtils.euclideanModulo(settings.yaw - dx * 0.25 + 180, 360) - 180;
      settings.pitch = THREE.MathUtils.clamp(settings.pitch + dy * 0.2, -70, 70);
    } else pan(dx, dy);
    pointer.x = event.clientX; pointer.y = event.clientY;

});
function endPointer(event, cancelled = false) {

canvas.addEventListener('lostpointercapture', event => pointers.delete(event.pointerId));

let cameraDistance = 20;
function resize() {
  const w = innerWidth, h = innerHeight, aspect = w / h;
  renderer.setPixelRatio(Math.min(settings.dpr, renderer.capabilities.maxTextureSize / w, renderer.capabilities.maxTextureSize / h));
  renderer.setSize(w, h);
  camera.aspect = aspect;
  // Portrait retains the tall portrait; landscape becomes an intimate crop.
  const visibleHeight = aspect < 0.75 ? Math.max(15.0, 8.0 / aspect) : THREE.MathUtils.clamp(15.0 * Math.pow(0.75 / aspect, 0.65), 7.5, 15.0);
  cameraDistance = visibleHeight / (2 * Math.tan(THREE.MathUtils.degToRad(18)));
  camera.position.set(0.15, 0.65, cameraDistance);
  camera.lookAt(0.15, 0.65, 0);
  camera.updateProjectionMatrix();
  const size = renderer.getDrawingBufferSize(new THREE.Vector2());
  target.setSize(size.x, size.y);
  finishMaterial.uniforms.uResolution.value.copy(size);
}
addEventListener('resize', resize, { passive: true });
resize();

let elapsed = 0, previous = performance.now();
let visible = !document.hidden;
document.addEventListener('visibilitychange', () => {
  visible = !document.hidden;
  previous = performance.now();
});

function frame(now) {
  requestAnimationFrame(frame);
  if (!visible) return;
  elapsed += (now - previous) / 1000 * settings.speed;
  previous = now;
  const phase = ((elapsed % (LOOP_SECONDS * 4)) / LOOP_SECONDS) * TAU;
  renderPhase(phase);
}

function renderPhase(phase) {
  const masterPhase = phase;
  const still = settings.animation === 'Static';
  phase = still ? 0 : phase % TAU;
  const s = Math.sin(phase), c = Math.cos(phase);
  let yaw = 0, pitch = 0, roll = 0, dolly = 1, rise = 0;
  let wind = 1, flex = 1;
  switch (settings.animation) {
    case 'Botanical sway': yaw = 0.0012 * s; pitch = 0.0009 * Math.sin(phase + 0.6); dolly = 1 + 0.0014 * c; break;
    case 'Breathing': wind = 0.65; flex = 0.75; dolly = 1 + 0.018 * s; pitch = 0.012 * c; break;
    case 'Tidal sway': wind = 1.3; flex = 0.8; yaw = 0.09 * s; pitch = 0.025 * Math.sin(2 * phase); break;
    case 'Leaf cascade': wind = 0.6; flex = 1.65; break;
    case 'Pendulum': wind = 0.85; flex = 0.8; yaw = 0.06 * s; roll = 0.016 * s; break;
    case 'Slow orbit': wind = 0.8; yaw = (masterPhase * 0.25) % TAU; pitch = 0.035 * s; break;
    case 'Figure-eight drift': wind = 0.7; yaw = 0.12 * s; pitch = 0.05 * Math.sin(2 * phase); break;
    case 'Rising current': wind = 0.55; flex = 1.2; rise = 0.13 * s; pitch = 0.018 * c; break;
    case 'Static': wind = 0; flex = 0; break;
  }
  uniforms.uPhase.value = phase;
  uniforms.uWind.value = settings.wind * wind;
  uniforms.uFlex.value = settings.flex * flex;
  const azimuth = THREE.MathUtils.degToRad(settings.yaw) + yaw;
  const elevation = THREE.MathUtils.degToRad(settings.pitch) + pitch;
  const distance = cameraDistance / settings.zoom * dolly;
  const focus = new THREE.Vector3(0.15, 0.65 + rise, 0);
  camera.position.set(distance * Math.sin(azimuth) * Math.cos(elevation), distance * Math.sin(elevation), distance * Math.cos(azimuth) * Math.cos(elevation)).add(focus);
  camera.up.set(0, 1, 0);
  camera.lookAt(focus);
  camera.rotateZ(roll);
  const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
  const up = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);
  const halfHeight = distance * Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5));
  const shift = right.multiplyScalar(-settings.positionX * halfHeight * camera.aspect).addScaledVector(up, -settings.positionY * halfHeight);
  camera.position.add(shift);

  renderer.setClearColor(0x000000, 0);
  uniforms.uShadowPass.value = true;
  uniforms.uShadow.value = null;
  uniforms.uShadowCaster.value = null;
  renderer.setRenderTarget(shadowTarget);
  renderer.render(scene, lightCamera);
  uniforms.uShadowPass.value = false;
  uniforms.uShadow.value = shadowTarget.depthTexture;
  uniforms.uShadowCaster.value = shadowTarget.texture;
  renderer.setRenderTarget(target);
  renderer.render(scene, camera);
  renderer.setRenderTarget(null);
  renderer.render(finishScene, finishCamera);
}
requestAnimationFrame(frame);
</script>
