<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1c293f">
  <meta name="description" content="An endless study of scarlet, amber, and blue light refracting through frosted glass. Procedural Three.js and GLSL.">
  <link rel="icon" href="data:,">
  <title>Light, Held in Glass</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #1c293f; }
    /* Identity filter keeps WebGL in its own compositing surface under the GUI. */
    canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; filter: brightness(1); }
    canvas.dragging { cursor: grabbing; }
    .unavailable { position: fixed; inset: 0; display: grid; place-content: center; padding: 2rem; color: #ffe0a0; font: 15px/1.6 system-ui, sans-serif; text-align: center; }
  </style>
</head>
<body>
<script type="module">
  /*
   * LIGHT, HELD IN GLASS
   * Open this HTML directly, or serve it with any static server.
   * Only pinned Three.js and lil-gui libraries are downloaded; all light and texture
   * are generated here. No images, videos, postprocessing, or build step.
   * Every moving input is a harmonic of one 40-second phase, including
   * the noise domain. Film grain is fixed to the glass, so it also loops.
   */
  const LOOP_SECONDS = 40;
  let renderer;

  try {
    let THREE;
    try {
      THREE = await import('https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js');
    } catch {
      THREE = await import('https://unpkg.com/three@0.180.0/build/three.module.js');
    }

    let GUI;
    try {
      ({ default: GUI } = await import('https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js'));
    } catch {
      ({ default: GUI } = await import('https://cdn.jsdelivr.net/npm/lil-gui@0.19.1/dist/lil-gui.esm.min.js'));
    }

    const schemes = {
      'Original': ['1c293f', '30465f', '55718a', 'a40818', 'f01619', 'ff803f', 'ffc46c', 'ffe0a0'],
      'Monochromatic': ['111b32', '263b60', '5f80a0', '24437d', '4075b8', '81a9d2', 'bdd4ec', 'edf5ff'],
      'Analogous': ['210e2d', '493058', '866178', 'a40842', 'f02c47', 'ff7052', 'ffb185', 'ffe1b3'],
      'Complementary': ['102a39', '24536a', '5d8b9b', 'b12f16', 'f46229', 'ff9953', 'ffc780', 'ffebbf'],
      'Split-complementary': ['172d32', '2b6261', '7e8f91', '87275f', 'df4261', 'ff8b52', 'ffd08a', 'fff1c4'],
      'Triadic': ['171b38', '34466b', '7492a2', '9c235b', 'e64479', '61bca8', 'e5c572', 'fff0bd'],
      'Tetradic': ['221a39', '3a4667', '7992a5', 'a73354', 'ee5b68', '61b993', 'f9c979', 'fff1ce'],
      'Double split-complementary': ['1d223c', '475575', '8a9cb3', 'a64a83', 'ed786e', '76c1ac', 'ecc57c', 'f8e5b4'],
      'Achromatic': ['101010', '303030', '666666', '555555', '999999', 'b8b8b8', 'dedede', 'ffffff'],
      'Achromatic + Accent': ['101010', '303030', '666666', '555555', '999999', 'bbbbbb', 'dddddd', 'ffffff'],
      'Neutral + accent': ['25282c', '51585b', '969a94', '73685d', 'b4a591', 'dbccb6', 'e6d8c1', 'f5eddc'],
      'Amber / Ember': ['220901', '941b0c', 'bc3908', '941b0c', 'bc3908', 'f6aa1c', 'f6aa1c', 'f6aa1c'],
      'Sea Glass': ['000000', '0b132b', '4bad9e', '0b132b', '4bad9e', '5bc0be', '63d1cf', '63d1cf'],
      'Orchid / Mauve': ['0d001d', '120a12', 'c9a3c6', 'aa60c8', 'd69ade', 'cfb5c2', 'd69ade', 'cfb5c2'],
      'Saffron / Petrol': ['061210', '00474d', '008189', '00474d', '008189', 'ffba00', 'ffba00', 'fef1be'],
      'Chartreuse / Jade': ['05140a', '0a3322', '00b894', '0a3322', '00b894', '7fff00', 'd4ffb0', 'd4ffb0'],
      'Apricot / Aubergine': ['0e0618', '3d1050', 'c7501a', '3d1050', 'c7501a', 'ff8c00', 'ffe8cc', 'ffe8cc'],
      'Lavender / Indigo': ['090612', '1a1250', '6a3de8', '1a1250', '6a3de8', 'b38fff', 'e8e0ff', 'e8e0ff'],
      'Cyan / Fuchsia': ['05020f', '1e0a3d', 'd40078', '1e0a3d', 'd40078', '00f0ff', '00f0ff', 'e0fbff']
    };
    const animations = ['Static', 'Ambient drift', 'Glass breathing', 'Amber tide',
                        'Lateral glide', 'Slow orbit', 'Pendulum', 'Floating refraction'];
    const settings = {
      scheme: 'Original', color: '#ffffff', accent: '#ff253b', invert: false,
      background: '#1c293f', greenscreen: false,
      slate: '#30465f', steel: '#55718a', deepLight: '#a40818',
      mainLight: '#f01619', diffusion: '#ff803f', halo: '#ffc46c', highlight: '#ffe0a0',
      animation: 'Ambient drift', speed: 1, motion: 1,
      zoom: 1, x: 0, y: 0, angle: 0,
      pixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      curvature: 1, diffusionWidth: 1, warp: 1, grain: 1, seed: 0,
      clickRandomize: true,
      randomize: () => randomize(),
      resetView: () => { settings.zoom = 1; settings.x = 0; settings.y = 0; settings.angle = 0; gui.controllersRecursive().forEach(c => c.updateDisplay()); }
    };

    renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false, powerPreference: 'high-performance' });
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.NoToneMapping;
    renderer.setClearColor(0x1c293f, 1);
    renderer.domElement.setAttribute('role', 'img');
    renderer.domElement.setAttribute('aria-label', 'Slowly breathing scarlet and golden light dissolving into midnight blue.');
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 2);
    camera.position.z = 1;
    const uniforms = {
      uTime: { value: 0 },
      uResolution: { value: new THREE.Vector2(1, 1) },
      uPixelRatio: { value: 1 },
      uPalette: { value: Array.from({ length: 8 }, () => new THREE.Vector3()) },
      uTint: { value: new THREE.Vector3(1, 1, 1) },
      uAccent: { value: new THREE.Vector3(1, 0.145, 0.231) },
      uBackground: { value: new THREE.Vector3() },
      uKey: { value: 0 },
      uGray: { value: 0 },
      uAccentMode: { value: 0 },
      uInvert: { value: 0 },
      uView: { value: new THREE.Vector4(0, 0, 1, 0) },
      uShape: { value: new THREE.Vector4(1, 1, 1, 0) },
      uMotion: { value: 1 },
      uGrain: { value: 1 }
    };

    const material = new THREE.ShaderMaterial({
      uniforms,
      depthTest: false,
      depthWrite: false,
      toneMapped: false,
      vertexShader: /* glsl */`
        void main() {
          gl_Position = vec4(position.xy, 0.0, 1.0);
        }
      `,
      fragmentShader: /* glsl */`
        precision highp float;
        uniform float uTime;
        uniform vec2 uResolution;
        uniform float uPixelRatio;
        uniform vec3 uPalette[8];
        uniform vec3 uTint, uAccent, uBackground;
        uniform float uKey, uGray, uAccentMode, uInvert, uMotion, uGrain;
        uniform vec4 uView, uShape;
        const float TAU = 6.283185307179586;

        // Gradient simplex noise, used only at very low spatial frequencies.
        vec3 mod289(vec3 x) { return x - floor(x / 289.0) * 289.0; }
        vec2 mod289(vec2 x) { return x - floor(x / 289.0) * 289.0; }
        vec3 permute(vec3 x) { return mod289((x * 34.0 + 1.0) * x); }
        float simplex(vec2 v) {
          const vec4 C = vec4(0.211324865405187, 0.366025403784439,
                             -0.577350269189626, 0.024390243902439);
          vec2 i = floor(v + dot(v, C.yy));
          vec2 x0 = v - i + dot(i, C.xx);
          vec2 i1 = x0.x > x0.y ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
          vec4 x12 = x0.xyxy + C.xxzz;
          x12.xy -= i1;
          i = mod289(i);
          vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0))
                                      + i.x + vec3(0.0, i1.x, 1.0));
          vec3 m = max(0.5 - vec3(dot(x0, x0), dot(x12.xy, x12.xy),
                                dot(x12.zw, x12.zw)), 0.0);
          m = m * m; m = m * m;
          vec3 x = 2.0 * fract(p * C.www) - 1.0;
          vec3 h = abs(x) - 0.5;
          vec3 a = x - floor(x + 0.5);
          m *= 1.79284291400159 - 0.85373472095314 * (a * a + h * h);
          vec3 g;
          g.x = a.x * x0.x + h.x * x0.y;
          g.yz = a.yz * x12.xz + h.yz * x12.yw;
          return 130.0 * dot(m, g);
        }

        float fbm(vec2 p) {
          mat2 turn = mat2(0.8, -0.6, 0.6, 0.8);
          float n = 0.57 * simplex(p);
          p = turn * p * 1.93 + vec2(4.1, 7.2);
          n += 0.28 * simplex(p);
          p = turn * p * 1.97 + vec2(8.7, 2.8);
          return n + 0.15 * simplex(p);
        }

        float gaussian(float x, float width) {
          x /= width;
          return exp(-0.5 * x * x);
        }

        // A rounded intersection of two half-planes. Unlike a raw hyperbola,
        // this has only one branch and cannot reappear in the lower right.
        float lightEdge(vec2 p, float phase, float aspect) {
          vec2 corner = vec2(0.675 + 0.012 * sin(phase),
                             0.392 + 0.012 * sin(phase + 0.7));
          vec2 a = p - corner;
          float radius = 0.112 * uShape.x + 0.006 * sin(phase - 0.4) * uMotion;
          float root = sqrt((a.x - a.y) * (a.x - a.y) + radius);
          float implicitDistance = 0.5 * (a.x + a.y + root);
          vec2 gradient = 0.5 * vec2(1.0 + (a.x - a.y) / root,
                                    1.0 - (a.x - a.y) / root);
          // Normalize to screen-height units, preserving optical widths
          // across portrait, square, and landscape viewports.
          gradient.x /= aspect;
          return implicitDistance / max(length(gradient), 0.001);
        }

        void main() {
          vec2 uv = gl_FragCoord.xy / uResolution;
          uv.y = 1.0 - uv.y;
          float aspect = uResolution.x / uResolution.y;
          vec2 view = ((uv - 0.5) * vec2(aspect, 1.0) - uView.xy) / uView.z;
          float ca = cos(uView.w), sa = sin(uView.w);
          view = mat2(ca, -sa, sa, ca) * view;
          uv = view / vec2(aspect, 1.0) + 0.5;
          float frameDistance = min(min(uv.x, 1.0 - uv.x), min(uv.y, 1.0 - uv.y));
          float footprint = smoothstep(-0.24, -0.005, frameDistance);
          float phase = TAU * (uTime / 40.0);
          vec2 orbit = vec2(cos(phase), sin(phase));
          vec2 orbit2 = vec2(cos(2.0 * phase + 0.8), sin(2.0 * phase + 0.8));

          // Screen-anchored composition; aspect-correct glass deformation.
          vec2 glass = (uv - 0.5) * vec2(aspect, 1.0);
          vec2 drift = orbit * 0.19 * uMotion + vec2(uShape.w, uShape.w * 0.71);
          vec2 warp = vec2(
            fbm(glass * 1.48 + drift + vec2(2.3, 6.1)),
            fbm(glass * 1.35 + drift.yx + vec2(9.4, 1.7))
          );
          vec2 p = uv + warp * vec2(0.022 / max(aspect, 0.65), 0.023) * uShape.z;
          p += vec2(0.009 * sin(phase + uv.y * 2.0),
                    0.008 * (cos(phase + uv.x * 1.6) - cos(uv.x * 1.6))) * uMotion;
          float d = lightEdge(p, phase, aspect);

          vec3 navy = uBackground;
          vec3 slate = uPalette[1];
          vec3 steel = uPalette[2];
          vec3 crimson = uPalette[3];
          vec3 scarlet = uPalette[4];
          vec3 orange = uPalette[5];
          vec3 amber = uPalette[6];
          vec3 cream = uPalette[7];

          float atmosphere = fbm(glass * 1.1 + orbit * 0.12 + 5.0);
          vec3 color = mix(navy, slate, 1.0 - smoothstep(0.20, 1.02, p.y));
          color = mix(color, steel, (1.0 - smoothstep(0.02, 0.73, p.y)) * 0.91);
          color += atmosphere * vec3(0.012, 0.016, 0.021);

          // A broad diagonal penumbra, independent of the curved caustic.
          float redFront = 0.82 * p.x + 0.95 * p.y - 0.675;
          redFront += 0.025 * atmosphere + 0.010 * orbit2.x;
          float redField = (1.0 - smoothstep(-0.145, 0.155, redFront))
                           * (1.0 - smoothstep(0.63, 0.94, p.x));
          float redHeat = gaussian(p.y - 0.29, 0.19);
          vec3 red = mix(crimson, scarlet, redHeat);
          red *= 0.93 + 0.07 * smoothstep(0.0, 0.5, p.x);
          color = mix(color, red, redField);

          // Amber spreads along the exterior of the red field. Several wide
          // falloffs replace a bloom pass and keep the frame photographic.
          float upperLight = 1.0 - smoothstep(0.24, 0.66, p.y);
          float focal = smoothstep(-0.15, 0.67, p.x);
          float warmWidth = (0.105 + 0.006 * sin(phase + 1.1) * uMotion) * uShape.y;
          float halo = gaussian(d - 0.026, warmWidth);
          color = mix(color, orange, halo * upperLight * (0.22 + focal * 0.40));
          float gold = gaussian(d - 0.047, 0.072 * uShape.y);
          color = mix(color, amber, gold * upperLight * (0.10 + focal * 0.79));

          // The upper-center luminous column has a gently wandering center.
          float columnCenter = 0.626 + 0.017 * sin(phase + 0.3) - p.y * 0.17;
          float column = gaussian((p.x - columnCenter) * aspect,
                                   0.105 * pow(aspect, 0.58));
          column *= 1.0 - smoothstep(0.03, 0.51, p.y);
          color = mix(color, cream, column * 0.70);

          // Soft nested scattering: no hard line, no emissive neon tube.
          float edgeWidth = 0.007 + 0.005 * smoothstep(0.1, 0.8, p.x);
          float edge = gaussian(d, edgeWidth);
          float edgeHalo = gaussian(d, 0.030);
          float edgePower = mix(0.12, 0.52, focal) * upperLight;
          color = mix(color, amber, edgeHalo * edgePower * 0.38);
          color = mix(color, cream, edge * edgePower);
          color += vec3(0.042, 0.029, 0.012) * gaussian(d - 0.01, 0.15)
                   * upperLight * focal;

          // A barely visible secondary refraction, diffused into the blue.
          float shoulder = p.y - (0.456 + 0.026 * sin(p.x * 3.1 + phase));
          float ghost = gaussian(shoulder, 0.018)
                        * gaussian((p.x - 0.71) * aspect, 0.18) * 0.035;
          color += ghost * vec3(0.42, 0.36, 0.27);

          color *= 1.0 + 0.008 * sin(phase - 0.6);
          vec2 vignette = (uv - vec2(0.51, 0.39)) * vec2(0.9, 0.75);
          color *= 1.0 - 0.12 * dot(vignette, vignette);

          // Pixel-scale fixed film grain and triangular dither. All palette
          // values above are display-referred sRGB; write them exactly once,
          // without a second output transfer or a tone-mapping curve.
          vec2 pixel = gl_FragCoord.xy / max(uPixelRatio * 0.75, 1.0);
          float g1 = fract(52.9829189 * fract(dot(pixel, vec2(0.06711056, 0.00583715))));
          float g2 = fract(52.9829189 * fract(dot(pixel + 19.19, vec2(0.00583715, 0.06711056))));
          color += (g1 + g2 - 1.0) * 0.010 * uGrain;
          float luminance = dot(color, vec3(0.2126, 0.7152, 0.0722));
          color = mix(color, vec3(luminance), uGray);
          color = mix(color, 1.0 - color, uInvert);
          float accentMask = gaussian(d - 0.015, 0.055 * uShape.y) * upperLight * (0.25 + focal * 0.75);
          color = mix(color, uAccent, accentMask * uAccentMode * 0.70);
          color *= uTint;
          vec3 background = mix(uBackground, vec3(dot(uBackground, vec3(0.2126, 0.7152, 0.0722))), uGray);
          background = mix(background, 1.0 - background, uInvert);
          if (uKey > 0.5) {
            background = vec3(0.0, 1.0, 0.0);
            float lightCoverage = max(redField, upperLight * max(halo, column));
            footprint *= smoothstep(0.025, 0.88, lightCoverage);
          }
          gl_FragColor = vec4(mix(background, clamp(color, 0.0, 1.0), footprint), 1.0);
        }
      `
    });
    const geometry = new THREE.PlaneGeometry(2, 2);
    const plane = new THREE.Mesh(geometry, material);
    plane.frustumCulled = false;
    scene.add(plane);

    // Palette colors stay in display sRGB, matching the fragment shader.
    function setRGB(target, hex) {
      const n = Number.parseInt(hex.replace('#', ''), 16);
      target.set(((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255);
    }
    const colorProperties = ['background', 'slate', 'steel', 'deepLight', 'mainLight', 'diffusion', 'halo', 'highlight'];
    function syncColors() {
      colorProperties.forEach((property, index) => setRGB(uniforms.uPalette.value[index], settings[property]));
      setRGB(uniforms.uBackground.value, settings.background);
      setRGB(uniforms.uTint.value, settings.color);
      setRGB(uniforms.uAccent.value, settings.accent);
      uniforms.uGray.value = settings.scheme.startsWith('Achromatic') ? 1 : 0;
      uniforms.uAccentMode.value = settings.scheme === 'Achromatic + Accent' || settings.scheme === 'Neutral + accent' ? 1 : 0;
      uniforms.uInvert.value = settings.invert ? 1 : 0;
      uniforms.uKey.value = settings.greenscreen ? 1 : 0;
    }
    function applyScheme() {
      schemes[settings.scheme].forEach((hex, index) => { settings[colorProperties[index]] = '#' + hex; });
      settings.color = '#ffffff';
      settings.invert = false;
      settings.accent = settings.scheme === 'Neutral + accent' ? '#d9884e' : '#ff253b';
      syncColors();
      gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    function resize() {
      const ratio = settings.pixelRatio;
      renderer.setPixelRatio(ratio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.getDrawingBufferSize(uniforms.uResolution.value);
      uniforms.uPixelRatio.value = ratio;
    }
    window.addEventListener('resize', resize, { passive: true });
    resize();

    const gui = new GUI({ title: 'Light, Held in Glass' });
    gui.add(settings, 'scheme', Object.keys(schemes)).name('Color scheme').onChange(applyScheme);
    gui.add(settings, 'animation', animations).name('Animation');
    gui.add(settings, 'speed', 0, 3, 0.01).name('Animation speed');
    gui.add(settings, 'clickRandomize').name('Click to regenerate');
    gui.add(settings, 'randomize').name('New variation');

    const colors = gui.addFolder('Colors');
    colors.addColor(settings, 'color').name('Light tint').onChange(syncColors);
    colors.addColor(settings, 'accent').name('Accent').onChange(syncColors);
    colors.add(settings, 'invert').name('Invert light / dark').onChange(syncColors);
    colors.addColor(settings, 'background').name('Background').onChange(syncColors);
    colors.add(settings, 'greenscreen').name('Greenscreen #00ff00').onChange(syncColors);
    const palette = colors.addFolder('Palette colors');
    for (const [property, label] of [ ['slate', 'Shadow'], ['steel', 'Atmosphere'],
      ['deepLight', 'Deep light'], ['mainLight', 'Main light'], ['diffusion', 'Diffusion'],
      ['halo', 'Halo'], ['highlight', 'Highlight'] ]) {
      palette.addColor(settings, property).name(label).onChange(syncColors);
    }
    palette.close();

    const framing = gui.addFolder('View');
    framing.add(settings, 'zoom', 0.2, 5, 0.01).name('Zoom');
    framing.add(settings, 'x', -4, 4, 0.001).name('Position X');
    framing.add(settings, 'y', -4, 4, 0.001).name('Position Y');
    framing.add(settings, 'angle', -180, 180, 0.1).name('Camera angle');
    framing.add(settings, 'resetView').name('Reset view');
    framing.close();

    const light = gui.addFolder('Light & motion');
    light.add(settings, 'motion', 0, 2, 0.01).name('Motion strength');
    light.add(settings, 'curvature', 0.45, 1.8, 0.01).name('Curve shape');
    light.add(settings, 'diffusionWidth', 0.5, 1.8, 0.01).name('Light diffusion');
    light.add(settings, 'warp', 0, 2.5, 0.01).name('Glass distortion');
    light.add(settings, 'seed', 0, 100, 0.001).name('Variation seed');
    light.close();
    const quality = gui.addFolder('Rendering');
    quality.add(settings, 'pixelRatio', 0.5, 3, 0.05).name('DPR / Pixel Ratio').onChange(resize);
    quality.add(settings, 'grain', 0, 2, 0.01).name('Film grain');
    quality.close();
    syncColors();

    function randomize() {
      const names = Object.keys(schemes);
      settings.scheme = names[(names.indexOf(settings.scheme) + 1 + Math.floor(Math.random() * (names.length - 1))) % names.length];
      settings.animation = animations[1 + Math.floor(Math.random() * (animations.length - 1))];
      settings.speed = +(0.45 + Math.random() * 0.8).toFixed(2);
      settings.motion = +(0.5 + Math.random() * 0.9).toFixed(2);
      settings.curvature = +(0.6 + Math.random() * 0.95).toFixed(2);
      settings.diffusionWidth = +(0.65 + Math.random() * 0.85).toFixed(2);
      settings.warp = +(0.3 + Math.random() * 1.7).toFixed(2);
      settings.seed = +(Math.random() * 100).toFixed(3);
      applyScheme();
    }

    // Animated framing is always composed WITH the user's view, never
    // written back into it. Wheel, dragging and orbit angle remain persistent.
    function viewAt(time) {
      const phase = Math.PI * 2 * time / LOOP_SECONDS;
      const strength = settings.motion;
      let x = 0, y = 0, zoom = 1, angle = 0;
      switch (settings.animation) {
        case 'Glass breathing':
          zoom = Math.exp(0.065 * Math.sin(phase) * strength);
          break;
        case 'Amber tide':
          y = 0.045 * Math.sin(phase) * strength;
          angle = 0.018 * Math.sin(phase + 0.5) * strength;
          break;
        case 'Lateral glide':
          x = 0.065 * Math.sin(phase) * strength;
          y = 0.012 * Math.sin(2 * phase) * strength;
          break;
        case 'Slow orbit':
          x = 0.042 * Math.cos(phase) * strength;
          y = 0.032 * Math.sin(phase) * strength;
          angle = 0.075 * Math.sin(phase) * strength;
          zoom = Math.exp(0.025 * Math.sin(phase + 0.5) * strength);
          break;
        case 'Pendulum':
          angle = 0.10 * Math.sin(phase) * strength;
          x = 0.025 * Math.sin(phase) * strength;
          break;
        case 'Floating refraction':
          x = 0.035 * Math.sin(phase) * strength;
          y = 0.028 * Math.sin(2 * phase + 0.7) * strength;
          angle = 0.035 * Math.sin(phase + 1.1) * strength;
          zoom = Math.exp(0.04 * Math.sin(phase - 0.5) * strength);
          break;
      }
      return [settings.x + x, settings.y + y, settings.zoom * zoom,
              settings.angle * Math.PI / 180 + angle];
    }

    const canvas = renderer.domElement;
    const updateViewControls = () => framing.controllers.forEach(c => c.updateDisplay());
    const wrapAngle = degrees => ((degrees + 180) % 360 + 360) % 360 - 180;
    let gesture = null;
    canvas.addEventListener('pointerdown', event => {
      if (!event.isPrimary || (event.button !== 0 && event.button !== 2)) return;
      gesture = { id: event.pointerId, startX: event.clientX, startY: event.clientY,
        lastX: event.clientX, lastY: event.clientY, moved: false,
        rotate: event.button === 2 || event.shiftKey, primary: event.button === 0 };
      canvas.setPointerCapture(event.pointerId);
      canvas.classList.add('dragging');
    });
    canvas.addEventListener('pointermove', event => {
      if (!gesture || event.pointerId !== gesture.id) return;
      if (Math.hypot(event.clientX - gesture.startX, event.clientY - gesture.startY) > 5) gesture.moved = true;
      if (!gesture.moved) return;
      if (gesture.rotate) {
        settings.angle = wrapAngle(settings.angle + (event.clientX - gesture.lastX) * 0.22);
      } else {
        settings.x += (event.clientX - gesture.lastX) / window.innerHeight;
        settings.y += (event.clientY - gesture.lastY) / window.innerHeight;
      }
      gesture.lastX = event.clientX;
      gesture.lastY = event.clientY;
      updateViewControls();
    });
    function finishGesture(event, cancelled = false) {
      if (!gesture || event.pointerId !== gesture.id) return;
      const reroll = !cancelled && !gesture.moved && gesture.primary && !gesture.rotate && settings.clickRandomize;
      gesture = null;
      canvas.classList.remove('dragging');
      if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
      if (reroll) randomize();
    }
    canvas.addEventListener('pointerup', event => finishGesture(event));
    canvas.addEventListener('pointercancel', event => finishGesture(event, true));
    canvas.addEventListener('lostpointercapture', event => finishGesture(event, true));
    canvas.addEventListener('contextmenu', event => event.preventDefault());
    canvas.addEventListener('wheel', event => {
      event.preventDefault();
      const delta = event.deltaY * (event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? window.innerHeight : 1);
      const zoom = Math.max(0.2, Math.min(5, settings.zoom * Math.exp(-Math.max(-200, Math.min(200, delta)) * 0.0015)));
      const factor = zoom / settings.zoom;
      const [px, py] = viewAt(elapsed);
      const sx = (event.clientX - window.innerWidth * 0.5) / window.innerHeight;
      const sy = (event.clientY - window.innerHeight * 0.5) / window.innerHeight;
      settings.x += (sx - px) * (1 - factor);
      settings.y += (sy - py) * (1 - factor);
      settings.zoom = zoom;
      updateViewControls();
    }, { passive: false });
    let uiVisible = true;
    window.addEventListener('keydown', event => {
      const target = event.target;
      const editing = target instanceof HTMLElement && (target.isContentEditable || target.matches('input:not([type="checkbox"]):not([type="button"]), textarea, select'));
      if (event.code === 'KeyH' && !event.repeat && !event.ctrlKey && !event.metaKey && !event.altKey && !editing) {
        uiVisible = !uiVisible;
        gui.show(uiVisible);
      }
    });

    // Keep one render loop alive, including Static, so edits are immediate.
    // A static mode freezes both procedural evolution and camera movement.
    let animationId = 0;
    let previousTime = null;
    let elapsed = 0;
    let contextLost = false;

    function animate(now) {
      animationId = 0;
      if (document.hidden || contextLost) { previousTime = null; return; }
      if (previousTime !== null && settings.animation !== 'Static') {
        elapsed = (elapsed + (now - previousTime) / 1000 * settings.speed) % LOOP_SECONDS;
      }
      previousTime = now;
      uniforms.uTime.value = elapsed;
      uniforms.uView.value.set(...viewAt(elapsed));
      uniforms.uShape.value.set(settings.curvature, settings.diffusionWidth, settings.warp, settings.seed);
      uniforms.uMotion.value = settings.motion;
      uniforms.uGrain.value = settings.grain;
      renderer.render(scene, camera);
      animationId = requestAnimationFrame(animate);
    }
    function resume() {
      cancelAnimationFrame(animationId);
      previousTime = null;
      animationId = requestAnimationFrame(animate);
    }
    document.addEventListener('visibilitychange', resume);
    renderer.domElement.addEventListener('webglcontextlost', event => {
      event.preventDefault();
      contextLost = true;
      cancelAnimationFrame(animationId);
      previousTime = null;
    });
    renderer.domElement.addEventListener('webglcontextrestored', () => {
      contextLost = false;
      resize();
      resume();
    });
    resume();
  } catch (error) {
    console.error(error);
    renderer?.dispose();
    renderer?.domElement.remove();
    const message = document.createElement('div');
    message.className = 'unavailable';
    message.setAttribute('role', 'alert');
    message.textContent = 'This light study needs WebGL 2 and an internet connection to load Three.js.';
    document.body.appendChild(message);
  }
</script>
</body>
</html>
