<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fringe Scan - Structured Light 3D Profilometry</title>

    <!-- Three.js and lil-gui from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.19"></script>

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            cursor: grab;
        }

        body:active {
            cursor: grabbing;
        }

        body.greenscreen {
            background-color: #00ff00 !important;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <script>
        // =========================================================================
        // POST PROCESSOR SUITE (Inlined from postprocessing/PostProcessor.js)
        // =========================================================================
        const orthoVertexShader = `
        precision highp float;
        in vec3 position;
        out vec2 vUv;
        void main() {
          vUv = position.xy * 0.5 + 0.5;
          gl_Position = vec4(position, 1.0);
        }
        `;

        const brightFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        uniform float bloomThreshold;
        in vec2 vUv;
        out vec4 fragColor;

        void main() {
          vec4 color = texture(inputTexture, vUv);
          float luminance = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
          float knee = 0.1;
          float soft = luminance - bloomThreshold + knee;
          soft = clamp(soft, 0.0, 2.0 * knee);
          soft = (soft * soft) / (4.0 * knee + 0.00001);
          float contribution = max(soft, luminance - bloomThreshold);
          contribution /= max(luminance, 0.00001);
          fragColor = vec4(color.rgb * contribution, color.a);
        }
        `;

        const blur13ShaderChunk = `
        vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
          vec2 resolution = vec2(textureSize(image, 0));
          vec4 color = vec4(0.0);
          vec2 off1 = vec2(1.411764705882353) * direction;
          vec2 off2 = vec2(3.2941176470588234) * direction;
          vec2 off3 = vec2(5.176470588235294) * direction;
          color += texture(image, uv) * 0.1964825501511404;
          color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
          color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
          color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
          color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
          color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
          color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
          return color;
        }
        `;

        const blurFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        uniform vec2 direction;
        in vec2 vUv;
        out vec4 color;
        ${blur13ShaderChunk}
        void main() {
          color = blur13(inputTexture, vUv, direction);
        }
        `;

        const finalFragmentShader = `
        precision highp float;
        uniform vec2 resolution;
        uniform sampler2D inputTexture;
        uniform sampler2D blur0Texture;
        uniform sampler2D blur1Texture;
        uniform sampler2D blur2Texture;
        uniform sampler2D blur3Texture;
        uniform sampler2D blur4Texture;
        uniform bool bloomEnabled;
        uniform float bloomStrength;
        uniform float vignetteBoost;
        uniform float vignetteReduction;
        uniform float noiseIntensity;
        uniform float time;
        in vec2 vUv;
        out vec4 fragColor;

        float vignette(vec2 uv, float boost, float reduction) {
          vec2 position = vUv - 0.5;
          return boost - length(position) * reduction;
        }

        float hash1(uint n) {
          n = (n << 13U) ^ n;
          n = n * (n * n * 15731U + 789221U) + 1376312589U;
          return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
        }

        float noise(in vec2 uv, in float timeVal) {
          uvec2 p = uvec2(uv);
          return hash1(p.x + 1920U * p.y + (1920U * 1080U) * uint(timeVal));
        }

        void main() {
          vec4 color = texture(inputTexture, vUv);

          if (bloomEnabled && bloomStrength > 0.001) {
            vec4 b0 = texture(blur0Texture, vUv);
            vec4 b1 = texture(blur1Texture, vUv);
            vec4 b2 = texture(blur2Texture, vUv);
            vec4 b3 = texture(blur3Texture, vUv);
            vec4 b4 = texture(blur4Texture, vUv);

            vec4 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
            color += bloomSum * bloomStrength;
          }

          color.rgb *= vignette(vUv, vignetteBoost, vignetteReduction);
          color.rgb += noiseIntensity * noise(gl_FragCoord.xy, time);
          fragColor = vec4(color.rgb, 1.0);
        }
        `;

        const chromaticAberrationShaderChunk = `
        vec2 barrelDistortion(vec2 coord, float amt) {
          vec2 cc = coord - 0.5;
          float dist = dot(cc, cc);
          return coord + cc * dist * amt;
        }
        float sat(float t) { return clamp(t, 0.0, 1.0); }
        float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
        float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
        vec4 spectrum_offset(float t) {
          float lo = step(t, 0.5);
          float hi = 1.0 - lo;
          float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
          vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
          return pow(ret, vec4(1.0 / 2.2));
        }
        const float max_distort = 2.2;
        const int num_iter = 8;
        const float reci_num_iter_f = 1.0 / float(num_iter);
        vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
          vec4 sumcol = vec4(0.0);
          vec4 sumw = vec4(0.0);
          for (int i = 0; i < num_iter; ++i) {
            float t = float(i) * reci_num_iter_f;
            vec4 w = spectrum_offset(t);
            sumw += w;
            sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
          }
          return sumcol / sumw;
        }
        `;

        const colorFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        uniform float chromaticAberrationAmount;
        uniform float minInputLevel;
        uniform float maxInputLevel;
        uniform float gammaLevel;
        uniform float fisheyeStrength;
        uniform float fisheyeRadius;
        uniform float time;
        in vec2 vUv;
        out vec4 fragColor;

        ${chromaticAberrationShaderChunk}

        vec2 applyFisheye(vec2 uv, float strength, float radius) {
          if (abs(strength) < 0.0001) return uv;
          vec2 p = uv - 0.5;
          float d = length(p);
          if (d > radius * 1.5) return uv;
          float r = d / max(radius, 0.001);
          float theta = atan(p.y, p.x);
          float rDist = r + strength * (r * r * r);
          return 0.5 + vec2(cos(theta), sin(theta)) * (rDist * radius);
        }

        vec3 gammaCorrect(vec3 color, vec3 gamma) {
          return pow(max(color, vec3(0.0)), 1.0 / gamma);
        }
        vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
          return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
        }
        vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
          return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
        }
        void main() {
          vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
          fragColor = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
          fragColor.rgb = finalLevels(fragColor.rgb, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
          fragColor.a = 1.0;
        }
        `;

        const copyFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        in vec2 vUv;
        out vec4 fragColor;
        void main() {
          fragColor = texture(inputTexture, vUv);
        }
        `;

        function createFBO(w, h, options = {}) {
          return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
            wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
            wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
            minFilter: options.minFilter || THREE.LinearFilter,
            magFilter: options.magFilter || THREE.LinearFilter,
            format: options.format || THREE.RGBAFormat,
            type: options.type || THREE.HalfFloatType,
            stencilBuffer: options.stencilBuffer || false,
            depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : true,
            samples: options.samples || 0,
          });
        }

        class ShaderPass {
          constructor(shader, options = {}) {
            this.shader = shader;
            this.orthoScene = new THREE.Scene();
            this.fbo = createFBO(1, 1, options);
            this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
            this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
            this.orthoScene.add(this.orthoQuad);
            this.texture = this.fbo.texture;
          }
          render(renderer, toScreen = false) {
            if (!toScreen) {
              renderer.setRenderTarget(this.fbo);
            }
            renderer.render(this.orthoScene, this.orthoCamera);
            if (!toScreen) {
              renderer.setRenderTarget(null);
            }
          }
          setSize(width, height) {
            this.fbo.setSize(Math.max(1, width), Math.max(1, height));
            this.orthoQuad.scale.set(width, height, 1);
          }
        }

        class ShaderPingPongPass {
          constructor(shader, options = {}) {
            this.shader = shader;
            this.orthoScene = new THREE.Scene();
            this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
            this.currentFBO = 0;
            this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
            this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
            this.orthoScene.add(this.orthoQuad);
          }
          render(renderer) {
            renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
            renderer.render(this.orthoScene, this.orthoCamera);
            renderer.setRenderTarget(null);
            this.currentFBO = 1 - this.currentFBO;
          }
          get current() { return this.fbos[this.currentFBO]; }
          get texture() { return this.current.texture; }
          setSize(width, height) {
            const w = Math.max(1, width);
            const h = Math.max(1, height);
            this.orthoQuad.scale.set(w, h, 1);
            this.fbos[0].setSize(w, h);
            this.fbos[1].setSize(w, h);
          }
        }

        class BloomPass {
          constructor(strength = 0.8, radius = 0.5, threshold = 0.2, levels = 5) {
            this.strength = strength;
            this.radius = radius;
            this.threshold = threshold;
            this.enabled = true;
            this.levels = levels;

            this.brightShader = new THREE.RawShaderMaterial({
              uniforms: {
                inputTexture: { value: null },
                bloomThreshold: { value: this.threshold },
              },
              vertexShader: orthoVertexShader,
              fragmentShader: brightFragmentShader,
              glslVersion: THREE.GLSL3,
            });
            this.brightPass = new ShaderPass(this.brightShader, {
              format: THREE.RGBAFormat,
              type: THREE.HalfFloatType,
            });

            this.blurShader = new THREE.RawShaderMaterial({
              uniforms: {
                inputTexture: { value: null },
                direction: { value: new THREE.Vector2(0, 1) },
              },
              vertexShader: orthoVertexShader,
              fragmentShader: blurFragmentShader,
              glslVersion: THREE.GLSL3,
            });

            this.blurPasses = [];
            for (let i = 0; i < this.levels; i++) {
              this.blurPasses.push(new ShaderPingPongPass(this.blurShader, {
                format: THREE.RGBAFormat,
                type: THREE.HalfFloatType,
              }));
            }
          }

          setSize(w, h) {
            let tw = Math.max(1, w);
            let th = Math.max(1, h);
            this.brightPass.setSize(tw, th);
            for (let i = 0; i < this.levels; i++) {
              tw = Math.max(1, Math.round(tw / 2));
              th = Math.max(1, Math.round(th / 2));
              this.blurPasses[i].setSize(tw, th);
            }
          }

          set source(texture) {
            this.brightShader.uniforms.inputTexture.value = texture;
          }

          render(renderer) {
            if (!this.enabled || this.strength <= 0.001) return;

            this.brightShader.uniforms.bloomThreshold.value = this.threshold;
            this.brightPass.render(renderer);

            const baseOffset = Math.max(0.1, this.radius * 2.0);
            const u = this.blurShader.uniforms;

            for (let j = 0; j < this.levels; j++) {
              const blurPass = this.blurPasses[j];
              const stepOffset = baseOffset * (1.0 + j * 0.5);

              // Horizontal blur pass
              u.direction.value.set(stepOffset, 0);
              u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
              blurPass.render(renderer);

              // Vertical blur pass
              u.direction.value.set(0, stepOffset * 0.5);
              u.inputTexture.value = blurPass.current.texture;
              blurPass.render(renderer);
            }
          }
        }

        class PostProcessor {
          constructor(renderer, params = {}) {
            this.renderer = renderer;

            this.settings = {
              enabled: params.enabled !== undefined ? params.enabled : true,
              bloomEnabled: params.bloomEnabled !== undefined ? params.bloomEnabled : true,
              bloomStrength: params.bloomStrength !== undefined ? params.bloomStrength : 0.75,
              bloomRadius: params.bloomRadius !== undefined ? params.bloomRadius : 0.5,
              bloomThreshold: params.bloomThreshold !== undefined ? params.bloomThreshold : 0.2,
              fisheyeStrength: params.fisheyeStrength !== undefined ? params.fisheyeStrength : 0.0,
              fisheyeRadius: params.fisheyeRadius !== undefined ? params.fisheyeRadius : 1.0,
              chromaticAberration: params.chromaticAberration !== undefined ? params.chromaticAberration : 0.02,
              vignetteBoost: params.vignetteBoost !== undefined ? params.vignetteBoost : 1.05,
              vignetteReduction: params.vignetteReduction !== undefined ? params.vignetteReduction : 0.45,
              noiseIntensity: params.noiseIntensity !== undefined ? params.noiseIntensity : 0.015,
              gamma: params.gamma !== undefined ? params.gamma : 1.0,
              minInputLevel: params.minInputLevel !== undefined ? params.minInputLevel : 0.0,
              maxInputLevel: params.maxInputLevel !== undefined ? params.maxInputLevel : 1.0,
            };

            this.sceneTarget = createFBO(1, 1, { type: THREE.HalfFloatType });

            this.bloomPass = new BloomPass(
              this.settings.bloomStrength,
              this.settings.bloomRadius,
              this.settings.bloomThreshold,
              5
            );

            this.finalShader = new THREE.RawShaderMaterial({
              uniforms: {
                resolution: { value: new THREE.Vector2(1, 1) },
                bloomEnabled: { value: this.settings.bloomEnabled },
                bloomStrength: { value: this.settings.bloomStrength },
                vignetteBoost: { value: this.settings.vignetteBoost },
                vignetteReduction: { value: this.settings.vignetteReduction },
                noiseIntensity: { value: this.settings.noiseIntensity },
                inputTexture: { value: null },
                blur0Texture: { value: null },
                blur1Texture: { value: null },
                blur2Texture: { value: null },
                blur3Texture: { value: null },
                blur4Texture: { value: null },
                time: { value: 0 },
              },
              vertexShader: orthoVertexShader,
              fragmentShader: finalFragmentShader,
              glslVersion: THREE.GLSL3,
            });
            this.finalPass = new ShaderPass(this.finalShader);

            this.rgbShader = new THREE.RawShaderMaterial({
              uniforms: {
                inputTexture: { value: this.finalPass.texture },
                fisheyeStrength: { value: this.settings.fisheyeStrength },
                fisheyeRadius: { value: this.settings.fisheyeRadius },
                chromaticAberrationAmount: { value: this.settings.chromaticAberration },
                minInputLevel: { value: this.settings.minInputLevel },
                maxInputLevel: { value: this.settings.maxInputLevel },
                gammaLevel: { value: this.settings.gamma },
                time: { value: 0 },
              },
              vertexShader: orthoVertexShader,
              fragmentShader: colorFragmentShader,
              glslVersion: THREE.GLSL3,
            });
            this.rgbPass = new ShaderPass(this.rgbShader);

            this.copyShader = new THREE.RawShaderMaterial({
              uniforms: {
                inputTexture: { value: null },
              },
              vertexShader: orthoVertexShader,
              fragmentShader: copyFragmentShader,
              glslVersion: THREE.GLSL3,
            });
            this.copyPass = new ShaderPass(this.copyShader);
          }

          updateSettings() {
            this.bloomPass.enabled = this.settings.bloomEnabled;
            this.bloomPass.strength = this.settings.bloomStrength;
            this.bloomPass.radius = this.settings.bloomRadius;
            this.bloomPass.threshold = this.settings.bloomThreshold;

            this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
            this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
            this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
            this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
            this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;

            this.rgbShader.uniforms.fisheyeStrength.value = this.settings.fisheyeStrength;
            this.rgbShader.uniforms.fisheyeRadius.value = this.settings.fisheyeRadius;
            this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
            this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
            this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
            this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
          }

          setSize(w0, h0, dpr = 1) {
            const w = Math.max(1, Math.floor(w0 * dpr));
            const h = Math.max(1, Math.floor(h0 * dpr));
            this.sceneTarget.setSize(w, h);
            this.finalPass.setSize(w, h);
            this.finalShader.uniforms.resolution.value.set(w, h);
            this.bloomPass.setSize(w, h);
            this.rgbPass.setSize(w, h);
            this.copyPass.setSize(w, h);
          }

          renderScene(scene, camera) {
            if (!this.settings.enabled) {
              this.renderer.render(scene, camera);
              return;
            }
            this.renderer.setRenderTarget(this.sceneTarget);
            this.renderer.render(scene, camera);
            this.renderer.setRenderTarget(null);
            this.render(this.sceneTarget.texture);
          }

          render(sourceTexture) {
            if (!this.settings.enabled) {
              this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
              this.copyPass.render(this.renderer, true);
              return;
            }

            this.updateSettings();

            this.bloomPass.source = sourceTexture;
            this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
            this.bloomPass.render(this.renderer);

            this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
            this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
            this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
            this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
            this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

            const randomTime = Math.random() * 100000;
            this.finalPass.shader.uniforms.time.value = randomTime;
            this.rgbPass.shader.uniforms.time.value = randomTime;

            this.finalPass.render(this.renderer);
            this.rgbPass.render(this.renderer, true);
          }

          attachGUI(gui, title = "Post-Processing Suite") {
            const root = gui.addFolder(title);
            root.add(this.settings, "enabled").name("Enable Suite");

            const bloom = root.addFolder("Bloom");
            bloom.add(this.settings, "bloomEnabled").name("Enable Bloom").onChange(() => this.updateSettings());
            bloom.add(this.settings, "bloomStrength", 0, 3.0, 0.05).name("Strength").onChange(() => this.updateSettings());
            bloom.add(this.settings, "bloomRadius", 0, 2.0, 0.05).name("Radius").onChange(() => this.updateSettings());
            bloom.add(this.settings, "bloomThreshold", 0, 1.0, 0.01).name("Threshold").onChange(() => this.updateSettings());

            const lens = root.addFolder("Lens, Optics & Fisheye");
            lens.add(this.settings, "fisheyeStrength", -1.0, 1.5, 0.01).name("Fisheye Distortion").onChange(() => this.updateSettings());
            lens.add(this.settings, "fisheyeRadius", 0.2, 2.0, 0.05).name("Fisheye Radius").onChange(() => this.updateSettings());
            lens.add(this.settings, "chromaticAberration", 0, 0.2, 0.005).name("Chromatic Aberration").onChange(() => this.updateSettings());
            lens.add(this.settings, "vignetteBoost", 0, 2.0, 0.05).name("Vignette Boost").onChange(() => this.updateSettings());
            lens.add(this.settings, "vignetteReduction", 0, 2.0, 0.05).name("Vignette Falloff").onChange(() => this.updateSettings());
            lens.add(this.settings, "noiseIntensity", 0, 0.1, 0.005).name("Film Grain").onChange(() => this.updateSettings());
            lens.add(this.settings, "gamma", 0.2, 2.0, 0.05).name("Gamma").onChange(() => this.updateSettings());
            lens.add(this.settings, "minInputLevel", 0, 0.5, 0.01).name("Black Level").onChange(() => this.updateSettings());
            lens.add(this.settings, "maxInputLevel", 0.5, 1.0, 0.01).name("White Level").onChange(() => this.updateSettings());

            return root;
          }
        }

        // --- 1. COLOR SCHEMES DEFINITION (10 PRECONFIGURED HARMONIES) ---
        const COLOR_SCHEMES = {
            'Monochromatic (Laser Cyan)': {
                id: 0,
                base: [0.02, 0.06, 0.15],
                c1: [0.05, 0.4, 0.85],
                c2: [0.1, 0.75, 0.95],
                c3: [0.7, 0.95, 1.0],
                accent: [0.0, 1.0, 0.9],
                crest: [0.8, 0.98, 1.0]
            },
            'Analogous (Amber-Coral-Gold)': {
                id: 1,
                base: [0.12, 0.03, 0.01],
                c1: [0.95, 0.25, 0.08],
                c2: [1.0, 0.65, 0.12],
                c3: [1.0, 0.92, 0.35],
                accent: [1.0, 0.3, 0.05],

            },
            'Complementary (Cobalt vs Neon Orange)': {

                c1: [0.08, 0.22, 0.9],
                c2: [0.25, 0.55, 1.0],
                c3: [1.0, 0.5, 0.05],
                accent: [1.0, 0.6, 0.0],
                crest: [1.0, 0.85, 0.5]
            },
            'Split-Complementary (Indigo, Amber, Rose)': {
                id: 3,
                base: [0.04, 0.02, 0.12],
                c1: [0.15, 0.1, 0.75],
                c2: [0.95, 0.15, 0.45],
                c3: [1.0, 0.68, 0.12],
                accent: [1.0, 0.75, 0.1],
                crest: [1.0, 0.9, 0.8]
            },
            'Triadic (Laser Cyan, Magenta, Gold)': {
                id: 4,
                base: [0.05, 0.02, 0.08],

        // --- 2. PRECONFIGURED ANIMATION PRESETS (8 DISTINCT MODES) ---
        const ANIMATION_PRESETS = [

        // --- 3. PARAMETERS & GUI STATE ---
        const params = {

        // --- 4. THREE.JS SCENE & RENDERER INITIALIZATION ---
        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

        const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });

        // Active color scheme lookup
        function getSchemeVectors(name) {

            return {

        const currentSchemeVecs = getSchemeVectors(params.colorScheme);

        // --- 5. SHADER UNIFORMS ---
        const uniforms = {
            u_time: { value: 0.0 },
            u_resolution: { value: new THREE.Vector2(window.innerWidth * params.dpr, window.innerHeight * params.dpr) },
            u_cam_rot: { value: new THREE.Vector2(params.rotX, params.rotY) },
            u_pan: { value: new THREE.Vector2(params.panX, params.panY) },
            u_zoom: { value: params.zoom },
            u_perspective: { value: params.perspective },
            u_anim_speed: { value: params.speed },

            // Geometry
            u_crumple_depth: { value: params.crumpleDepth },
            u_crease_freq: { value: params.creaseFreq },
            u_fold: { value: new THREE.Vector3(params.foldX, params.foldY, params.foldZOffset) },
            u_fold_angle: { value: params.foldAngle },
            u_sheet_size: { value: params.sheetSize },
            u_sheet_thickness: { value: params.sheetThickness },

            // Fringe Scan & Color
            u_scheme_id: { value: currentSchemeVecs.schemeId },
            u_col_base: { value: currentSchemeVecs.base },
            u_col_c1: { value: currentSchemeVecs.c1 },
            u_col_c2: { value: currentSchemeVecs.c2 },
            u_col_c3: { value: currentSchemeVecs.c3 },
            u_col_accent: { value: currentSchemeVecs.accent },
            u_col_crest: { value: currentSchemeVecs.crest },

            u_band_freq: { value: params.bandFreq },
            u_band_sharpness: { value: params.bandSharpness },
            u_stepped_bands: { value: params.steppedBands },
            u_fringe_phase_speed: { value: params.fringePhaseSpeed },
            u_laser_beam: { value: params.laserScanBeam },
            u_laser_beam_speed: { value: params.laserBeamSpeed },
            u_crest_glow: { value: params.crestGlowIntensity },
            u_fringe_contrast: { value: params.fringeContrast },
            u_surface_gloss: { value: params.surfaceGloss },
            u_ambient_glow: { value: params.ambientGlow },
            u_invert_colors: { value: params.invertColors },

            // Green Screen
            u_green_screen: { value: params.greenScreen },
            u_green_threshold: { value: params.greenThreshold },
            u_green_feather: { value: params.greenFeather }
        };

        // --- 6. SHADER CODE ---
        const getFragmentShader = (useAA) => `
            #define MAX_RAY_STEPS 110
            #define HIT_THRESHOLD 0.0012
            #define MAX_TRACE_DIST 22.0
            #define PI 3.14159265359

            ${useAA ? '#define USE_AA' : ''}

            precision highp float;

            uniform float u_time;
            uniform vec2 u_resolution;
            uniform vec2 u_cam_rot;
            uniform vec2 u_pan;
            uniform float u_zoom;
            uniform float u_perspective;
            uniform float u_anim_speed;

            // Geometry Uniforms
            uniform float u_crumple_depth;
            uniform float u_crease_freq;
            uniform vec3 u_fold;
            uniform float u_fold_angle;
            uniform float u_sheet_size;
            uniform float u_sheet_thickness;

            // Fringe Scan Optics & Colors
            uniform int u_scheme_id;
            uniform vec3 u_col_base;
            uniform vec3 u_col_c1;
            uniform vec3 u_col_c2;
            uniform vec3 u_col_c3;
            uniform vec3 u_col_accent;
            uniform vec3 u_col_crest;

            uniform float u_band_freq;
            uniform float u_band_sharpness;
            uniform bool u_stepped_bands;
            uniform float u_fringe_phase_speed;
            uniform bool u_laser_beam;
            uniform float u_laser_beam_speed;
            uniform float u_crest_glow;
            uniform float u_fringe_contrast;
            uniform float u_surface_gloss;
            uniform float u_ambient_glow;
            uniform bool u_invert_colors;

            // Green Screen
            uniform bool u_green_screen;
            uniform float u_green_threshold;
            uniform float u_green_feather;

            // Globals
            mat2 g_camRotX;
            mat2 g_camRotY;
            mat2 g_rotFold;

            // 2D Rotation Helper
            mat2 rotate2D(float a) {
                float c = cos(a);
                float s = sin(a);
                return mat2(c, -s, s, c);
            }

            // Pseudo-random & Noise functions
            float hash21(vec2 p) {
                p = fract(p * vec2(234.34, 435.345));
                p += dot(p, p + 34.23);
                return fract(p.x * p.y);
            }

            float smoothNoise(vec2 p) {
                vec2 i = floor(p);
                vec2 f = fract(p);
                vec2 u = f * f * (3.0 - 2.0 * f);

                float a = hash21(i);
                float b = hash21(i + vec2(1.0, 0.0));
                float c = hash21(i + vec2(0.0, 1.0));
                float d = hash21(i + vec2(1.0, 1.0));

                return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
            }

            // High-detail Ridged FBM for crumpled sheet creases
            float ridgedFBM(vec2 p, out float outCrest) {
                float sum = 0.0;
                float amp = 1.0;
                float freq = 1.0;
                float crestAcc = 0.0;
                mat2 rot = mat2(1.6, 1.2, -1.2, 1.6);

                for (int i = 0; i < 5; i++) {
                    float n = smoothNoise(p * freq);
                    // abs(sin(fbm)) style sharp crease formulation
                    float crease = abs(sin(n * PI + float(i) * 0.73));
                    crease = pow(crease, 1.55);

                    // High frequency ridge crest tracker
                    float ridgeLine = pow(1.0 - abs(crease * 2.0 - 1.0), 3.0);
                    crestAcc += ridgeLine * (amp / (float(i) + 1.0));

                    sum += crease * amp;
                    freq *= 2.04;
                    amp *= 0.48;
                    p = rot * p * 0.97 + vec2(1.61, 3.47);
                }

                outCrest = clamp(crestAcc * 1.6, 0.0, 1.0);
                return sum * 0.58;
            }

            // Heightfield calculation with restricted 2D folding collapsing to sheet
            float getSheetHeight(vec2 xy, out float crestDetail) {
                // Restrict the abs-fold to two dominant axes (x, y) with near-zero z-offset
                vec2 folded = xy;
                vec2 foldVec = u_fold.xy;

                for (int k = 0; k < 3; k++) {
                    folded = abs(folded) - foldVec * (0.9 / float(k + 1));
                    folded = g_rotFold * folded;
                }

                // Macro shape wave curvature
                float macroWave = sin(xy.x * 0.75) * cos(xy.y * 0.75) * 0.28 +
                                  sin((xy.x + xy.y) * 0.45) * 0.15;

                float rawCrest;
                float foilCreases = ridgedFBM(folded * u_crease_freq + xy * 0.25, rawCrest);

                crestDetail = rawCrest;
                return (foilCreases + macroWave) * u_crumple_depth;
            }

            // Signed Distance Function of the Crumpled Foil Sheet
            float evaluateSceneSDF(vec3 p, out float outHeightNorm, out float outCrest) {
                // Translate pan
                vec3 localP = p;
                localP.xy -= u_pan;

                float crest;
                float sheetH = getSheetHeight(localP.xy, crest);
                outCrest = crest;

                // Normalized height across full depth
                float maxH = u_crumple_depth * 1.5 + 0.001;
                outHeightNorm = clamp((localP.z - sheetH + maxH) / (2.0 * maxH), 0.0, 1.0);

                // Distance to thin crumpled foil sheet surface
                float distToSheet = abs(localP.z - sheetH) - u_sheet_thickness;

                // Bounding sheet envelope (rectangular foil swatch with rounded corners)
                vec2 dBox = abs(localP.xy) - vec2(u_sheet_size);
                float bound2D = length(max(dBox, 0.0)) + min(max(dBox.x, dBox.y), 0.0) - 0.04;
                float boundZ = abs(localP.z) - (u_crumple_depth * 1.8 + 0.3);

                // Lipschitz under-relaxation for crisp convergence
                return max(max(distToSheet * 0.62, bound2D), boundZ);
            }

            // Fast normal calculation with accurate central finite differences
            vec3 estimateNormal(vec3 p) {
                vec2 e = vec2(0.004, 0.0);
                float dummyH, dummyC;
                float d = evaluateSceneSDF(p, dummyH, dummyC);
                return normalize(vec3(
                    evaluateSceneSDF(p + e.xyy, dummyH, dummyC) - evaluateSceneSDF(p - e.xyy, dummyH, dummyC),
                    evaluateSceneSDF(p + e.yxy, dummyH, dummyC) - evaluateSceneSDF(p - e.yxy, dummyH, dummyC),
                    evaluateSceneSDF(p + e.yyx, dummyH, dummyC) - evaluateSceneSDF(p - e.yyx, dummyH, dummyC)
                ));
            }

            // Multi-Color Palette Gradient Generator (Iso-Height Contour Banding)
            vec3 sampleColorLUT(float t) {
                t = clamp(t, 0.0, 1.0);
                if (u_invert_colors) t = 1.0 - t;

                if (u_scheme_id == 9) {
                    // Spectral Fringe Rainbow Metrology LUT
                    float x = t * 5.0;
                    vec3 col;
                    if (x < 1.0) col = mix(u_col_c1, vec3(0.0, 0.3, 1.0), x);
                    else if (x < 2.0) col = mix(vec3(0.0, 0.3, 1.0), vec3(0.0, 0.9, 0.9), x - 1.0);
                    else if (x < 3.0) col = mix(vec3(0.0, 0.9, 0.9), vec3(0.2, 0.95, 0.2), x - 2.0);
                    else if (x < 4.0) col = mix(vec3(0.2, 0.95, 0.2), vec3(1.0, 0.85, 0.0), x - 3.0);
                    else col = mix(vec3(1.0, 0.85, 0.0), vec3(1.0, 0.1, 0.2), x - 4.0);
                    return col;
                }

                if (u_scheme_id == 8) {
                    // Neutral + Accent: Dark titanium / slate grey base with bright neon laser accent bands
                    float stepVal = fract(t * 3.0);
                    vec3 neutralGrad = mix(u_col_base, u_col_c3, t);
                    float isAccent = smoothstep(0.78, 0.88, stepVal);
                    return mix(neutralGrad, u_col_accent, isAccent);
                }

                if (u_scheme_id == 7) {
                    // Achromatic: Silver / Carbon to Optic White
                    float bands = sin(t * PI * 2.0) * 0.5 + 0.5;
                    return mix(u_col_base, u_col_c3, pow(bands, 1.4));
                }

                // 4-Stop Smooth Color Harmony Interpolation
                float seg = t * 3.0;
                if (seg < 1.0) {
                    return mix(u_col_base, u_col_c1, seg);
                } else if (seg < 2.0) {
                    return mix(u_col_c1, u_col_c2, seg - 1.0);
                } else {
                    return mix(u_col_c2, u_col_c3, seg - 2.0);
                }
            }

            // Raymarching & Lighting Engine
            vec4 renderSceneRay(vec3 ro, vec3 rd, float jitter) {
                float totalDist = jitter * 0.05;
                vec3 accumulatedLight = vec3(0.0);
                float minSceneDist = 999.0;
                bool hitSurface = false;
                vec3 hitPoint = vec3(0.0);
                float hitHeight = 0.0;
                float hitCrest = 0.0;

                // Phase shifting structured light fringe offset
                float fringePhase = u_time * u_fringe_phase_speed * u_anim_speed;

                for (int step = 0; step < MAX_RAY_STEPS; step++) {
                    vec3 currentP = ro + rd * totalDist;
                    float hNorm, crest;
                    float sceneDist = evaluateSceneSDF(currentP, hNorm, crest);

                    if (sceneDist < minSceneDist) {
                        minSceneDist = sceneDist;
                    }

                    // Volumetric ridge crest glow & ambient scan illumination
                    if (sceneDist < 0.18) {
                        float prox = (1.0 - sceneDist / 0.18);
                        float glowAmount = pow(prox, 2.5) * (crest * 0.6 + 0.4);
                        vec3 glowCol = mix(u_col_accent, u_col_crest, crest);
                        accumulatedLight += glowCol * (glowAmount * u_crest_glow * 0.35);
                    }

                    // Surface Intersection
                    if (sceneDist < HIT_THRESHOLD) {
                        hitSurface = true;
                        hitPoint = currentP;
                        hitHeight = hNorm;
                        hitCrest = crest;
                        break;
                    }

                    totalDist += sceneDist * 0.85;

                    if (totalDist > MAX_TRACE_DIST) {
                        break;
                    }
                }

                if (!hitSurface) {
                    return vec4(accumulatedLight, 0.0);
                }

                // Surface Normal & Lighting
                vec3 normal = estimateNormal(hitPoint);

                // Structured Light Fringe Projection Profilometry Equation
                float rawFringe = fract(hitHeight * u_band_freq + fringePhase);

                if (u_stepped_bands) {
                    rawFringe = floor(rawFringe * 7.0) / 7.0;
                } else {
                    // Contoured cosine shaping for high dynamic range fringe lines
                    rawFringe = pow(rawFringe, u_band_sharpness * 1.5 + 0.5);
                }

                // Sample Base Fringe Color from LUT
                vec3 fringeColor = sampleColorLUT(rawFringe);

                // Sharp Fringe Contour Lines (Phase Transitions)
                float contourEdge = smoothstep(0.05, 0.0, abs(fract(hitHeight * u_band_freq + fringePhase) - 0.5) * 0.4);
                fringeColor = mix(fringeColor, u_col_accent * 1.3, contourEdge * 0.45);

                // Optical Scanner Lighting (Directional Scan Head + Specular Metrology Glints)
                vec3 lightDir = normalize(vec3(0.4, 0.6, 1.0));
                float diff = clamp(dot(normal, lightDir), 0.0, 1.0) * 0.7 + 0.3;

                vec3 viewDir = normalize(ro - hitPoint);
                vec3 halfVec = normalize(lightDir + viewDir);
                float spec = pow(clamp(dot(normal, halfVec), 0.0, 1.0), 32.0) * u_surface_gloss;

                // Curvature & Ridge Crest Glow Enhancement (Selling sharp crumpled foil scan edges)
                float ridgeHighlight = pow(hitCrest, 1.8) * 1.8;
                vec3 crestGlowColor = mix(u_col_accent, u_col_crest, hitCrest) * (ridgeHighlight * u_crest_glow * 8.0);

                // Structured Light Laser Scanning Line Beam (Moving active measurement plane)
                float laserLineIntensity = 0.0;
                if (u_laser_beam) {
                    float laserPos = sin(u_time * u_laser_beam_speed * u_anim_speed * 1.5) * (u_sheet_size * 0.95);
                    float distToLaser = abs((hitPoint.y - u_pan.y) - laserPos);
                    laserLineIntensity = exp(-distToLaser * distToLaser * 70.0) * 2.2;
                }
                vec3 laserColor = u_col_accent * (laserLineIntensity * 1.5);

                // Final Surface Shading Composition
                vec3 surfaceColor = fringeColor * diff * u_fringe_contrast;
                surfaceColor += vec3(spec);
                surfaceColor += crestGlowColor;
                surfaceColor += laserColor;
                surfaceColor += accumulatedLight;
                surfaceColor += u_col_base * u_ambient_glow;

                return vec4(surfaceColor, 1.0);
            }

            // Primary Pixel Rendering Function
            vec3 getPixelColor(vec2 fragCoord) {
                vec2 uv = (2.0 * fragCoord.xy - u_resolution.xy) / u_resolution.y;

                float jitter = hash21(uv + fract(u_time * 0.1)) * 0.08;

                // Camera Position & Ray Setup
                vec3 ro = vec3(0.0, 0.0, -u_zoom);
                vec3 rd = normalize(vec3(uv, u_perspective));

                // Apply Camera Pitch & Yaw
                ro.yz = g_camRotY * ro.yz;
                ro.xz = g_camRotX * ro.xz;
                rd.yz = g_camRotY * rd.yz;
                rd.xz = g_camRotX * rd.xz;

                vec4 res = renderSceneRay(ro, rd, jitter);
                vec3 col = res.rgb;

                // Tone mapping & Gamma
                col = col / (1.0 + col * 0.6);
                col = pow(col, vec3(0.92));

                if (u_green_screen) {
                    float brightness = max(max(col.r, col.g), col.b);
                    float keepFractal = smoothstep(u_green_threshold, u_green_threshold + u_green_feather, brightness + res.a * 0.3);
                    col = mix(vec3(0.0, 1.0, 0.0), col, keepFractal);
                }

                return col;
            }

            void main() {
                // Initialize Transformation Matrices
                g_camRotX = rotate2D(-u_cam_rot.x);
                g_camRotY = rotate2D(-u_cam_rot.y);
                g_rotFold = rotate2D(u_fold_angle);

                vec3 finalColor = vec3(0.0);

                #ifdef USE_AA
                    // 2x2 Sub-pixel Anti-Aliasing
                    for (int m = 0; m < 2; m++) {
                        for (int n = 0; n < 2; n++) {
                            vec2 offset = vec2(float(m), float(n)) * 0.5 - 0.25;
                            finalColor += getPixelColor(gl_FragCoord.xy + offset);
                        }
                    }
                    finalColor *= 0.25;
                #else
                    finalColor = getPixelColor(gl_FragCoord.xy);
                #endif

                gl_FragColor = vec4(finalColor, 1.0);
            }
        `;

        const vertexShader = `
            void main() {
                gl_Position = vec4(position, 1.0);
            }
        `;

        // Create Mesh & Material
        let material = new THREE.ShaderMaterial({
            vertexShader: vertexShader,
            fragmentShader: getFragmentShader(params.antiAlias),
            uniforms: uniforms
        });

        const geometry = new THREE.PlaneGeometry(2, 2);
        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        // --- 7. UNIFORM & PALETTE UPDATE FUNCTIONS ---
        function updateUniformColors(schemeName) {
            const sc = getSchemeVectors(schemeName);
            uniforms.u_scheme_id.value = sc.schemeId;
            uniforms.u_col_base.value.copy(sc.base);
            uniforms.u_col_c1.value.copy(sc.c1);
            uniforms.u_col_c2.value.copy(sc.c2);
            uniforms.u_col_c3.value.copy(sc.c3);
            uniforms.u_col_accent.value.copy(sc.accent);
            uniforms.u_col_crest.value.copy(sc.crest);
        }

        function updateUniforms() {
            uniforms.u_cam_rot.value.set(params.rotX, params.rotY);
            uniforms.u_pan.value.set(params.panX, params.panY);
            uniforms.u_zoom.value = params.zoom;
            uniforms.u_perspective.value = params.perspective;
            uniforms.u_anim_speed.value = params.speed;

            uniforms.u_crumple_depth.value = params.crumpleDepth;
            uniforms.u_crease_freq.value = params.creaseFreq;
            uniforms.u_fold.value.set(params.foldX, params.foldY, params.foldZOffset);
            uniforms.u_fold_angle.value = params.foldAngle;
            uniforms.u_sheet_size.value = params.sheetSize;
            uniforms.u_sheet_thickness.value = params.sheetThickness;

            updateUniformColors(params.colorScheme);

            uniforms.u_band_freq.value = params.bandFreq;
            uniforms.u_band_sharpness.value = params.bandSharpness;
            uniforms.u_stepped_bands.value = params.steppedBands;
            uniforms.u_fringe_phase_speed.value = params.fringePhaseSpeed;
            uniforms.u_laser_beam.value = params.laserScanBeam;
            uniforms.u_laser_beam_speed.value = params.laserBeamSpeed;
            uniforms.u_crest_glow.value = params.crestGlowIntensity;
            uniforms.u_fringe_contrast.value = params.fringeContrast;
            uniforms.u_surface_gloss.value = params.surfaceGloss;
            uniforms.u_ambient_glow.value = params.ambientGlow;
            uniforms.u_invert_colors.value = params.invertColors;

            uniforms.u_green_screen.value = params.greenScreen;
            uniforms.u_green_threshold.value = params.greenThreshold;
            uniforms.u_green_feather.value = params.greenFeather;
        }

        function setGreenScreen(enabled) {
            document.body.classList.toggle('greenscreen', enabled);
            renderer.setClearColor(enabled ? 0x00ff00 : 0x000000, 1);
            uniforms.u_green_screen.value = enabled;
            if (enabled) {
                postProcessor.settings.bloomThreshold = 0.8;
            } else {
                postProcessor.settings.bloomThreshold = 0.2;
            }
            postProcessor.updateSettings();
        }

        // --- 8. PROCEDURAL RANDOMIZER (CALLED ON CLICK & VIA GUI) ---
        function randomizeParameters() {
            const schemeKeys = Object.keys(COLOR_SCHEMES);
            params.colorScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];

            const animKeys = ANIMATION_PRESETS;
            params.animationPreset = animKeys[Math.floor(Math.random() * animKeys.length)];

            params.crumpleDepth = +(0.35 + Math.random() * 0.7).toFixed(2);
            params.creaseFreq = +(1.2 + Math.random() * 1.8).toFixed(2);
            params.foldX = +(0.4 + Math.random() * 1.0).toFixed(2);
            params.foldY = +(0.4 + Math.random() * 1.0).toFixed(2);
            params.foldAngle = +(Math.random() * 1.57).toFixed(2);
            params.bandFreq = +(8.0 + Math.random() * 18.0).toFixed(1);
            params.bandSharpness = +(0.4 + Math.random() * 0.8).toFixed(2);
            params.crestGlowIntensity = +(0.02 + Math.random() * 0.06).toFixed(3);
            params.steppedBands = Math.random() > 0.65;
            params.invertColors = Math.random() > 0.8;
            params.laserScanBeam = Math.random() > 0.2;

            updateUniforms();
            gui.controllersRecursive().forEach(c => c.updateDisplay());
        }

        // --- 9. LIL-GUI SETUP ---
        const gui = new lil.GUI({ title: 'Fringe Scan Controls' });

        // Render Quality Folder
        const renderFolder = gui.addFolder('Render Quality');
        renderFolder.add(params, 'dpr', [0.5, 0.75, 1.0, 1.25, 1.5, 2.0]).name('Pixel Ratio (DPR)').onChange(v => {
            renderer.setPixelRatio(v);
            uniforms.u_resolution.value.set(window.innerWidth * v, window.innerHeight * v);
            postProcessor.setSize(window.innerWidth, window.innerHeight, v);
        });
        renderFolder.add(params, 'antiAlias').name('Anti-Aliasing').onChange(v => {
            material.fragmentShader = getFragmentShader(v);
            material.needsUpdate = true;
        });

        // Green Screen Folder
        const greenFolder = gui.addFolder('Green Screen');
        greenFolder.add(params, 'greenScreen').name('Enable #00ff00').onChange(setGreenScreen);
        greenFolder.add(params, 'greenThreshold', 0.0, 0.15, 0.001).name('Cutoff Threshold').onChange(updateUniforms);
        greenFolder.add(params, 'greenFeather', 0.0, 0.25, 0.001).name('Edge Feather').onChange(updateUniforms);

        // Animation Folder (8 Presets + Speed + Auto)
        const animFolder = gui.addFolder('Animation & Motion');
        animFolder.add(params, 'animationPreset', ANIMATION_PRESETS).name('Preset').onChange(updateUniforms);
        animFolder.add(params, 'autoAnimation').name('Auto Animate').onChange(updateUniforms);
        animFolder.add(params, 'speed', 0.0, 2.0, 0.01).name('Animation Speed').onChange(updateUniforms);

        // Camera & View Folder (Pan, Zoom, Perspective)
        const camFolder = gui.addFolder('Camera & View');
        const zoomCtrl = camFolder.add(params, 'zoom', 1.5, 12.0, 0.05).name('Zoom Distance').onChange(updateUniforms);
        const panXCtrl = camFolder.add(params, 'panX', -3.0, 3.0, 0.01).name('Pan X').onChange(updateUniforms);
        const panYCtrl = camFolder.add(params, 'panY', -3.0, 3.0, 0.01).name('Pan Y').onChange(updateUniforms);
        camFolder.add(params, 'perspective', 0.8, 4.0, 0.05).name('Perspective Z').onChange(updateUniforms);
        camFolder.add({ reset: () => {
            params.zoom = 5.5;
            params.panX = 0.0;
            params.panY = 0.0;
            params.rotX = 0.35;
            params.rotY = 0.0;
            updateUniforms();
            gui.controllersRecursive().forEach(c => c.updateDisplay());
        }}, 'reset').name('Reset View');

        // Color & Structured Light Fringe Schemes (10 Presets)
        const colorFolder = gui.addFolder('Color & Fringe Profilometry');
        colorFolder.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Color Scheme').onChange(updateUniforms);
        colorFolder.add(params, 'bandFreq', 2.0, 35.0, 0.5).name('Fringe Band Frequency').onChange(updateUniforms);
        colorFolder.add(params, 'bandSharpness', 0.1, 2.0, 0.05).name('Band Sharpness').onChange(updateUniforms);
        colorFolder.add(params, 'steppedBands').name('Stepped Contours').onChange(updateUniforms);
        colorFolder.add(params, 'crestGlowIntensity', 0.0, 0.15, 0.002).name('Ridge Crest Glow').onChange(updateUniforms);
        colorFolder.add(params, 'laserScanBeam').name('Laser Sweep Line').onChange(updateUniforms);
        colorFolder.add(params, 'fringeContrast', 0.5, 2.5, 0.05).name('Fringe Contrast').onChange(updateUniforms);
        colorFolder.add(params, 'surfaceGloss', 0.0, 3.0, 0.1).name('Foil Specularity').onChange(updateUniforms);
        colorFolder.add(params, 'invertColors').name('Invert Color LUT').onChange(updateUniforms);

        // Crumpled Sheet Geometry Folder
        const sheetFolder = gui.addFolder('Crumpled Sheet Geometry');
        sheetFolder.add(params, 'crumpleDepth', 0.1, 1.5, 0.02).name('Crumple Depth').onChange(updateUniforms);
        sheetFolder.add(params, 'creaseFreq', 0.5, 4.0, 0.05).name('Crease Detail').onChange(updateUniforms);
        sheetFolder.add(params, 'foldX', 0.0, 2.5, 0.02).name('Fold Axis X').onChange(updateUniforms);
        sheetFolder.add(params, 'foldY', 0.0, 2.5, 0.02).name('Fold Axis Y').onChange(updateUniforms);
        sheetFolder.add(params, 'foldAngle', 0.0, 3.14, 0.02).name('Fold Rotation').onChange(updateUniforms);
        sheetFolder.add(params, 'sheetSize', 0.8, 3.0, 0.05).name('Sheet Size').onChange(updateUniforms);

        // PostProcessor Suite GUI Integration
        postProcessor.attachGUI(gui, "Post-Processing Suite (PostProcessor.js)");

        // Procedural Variation on Click Toggle
        const interactFolder = gui.addFolder('Interactive Procedural Generation');
        interactFolder.add(params, 'randomizeOnClick').name('Randomize on Click');
        interactFolder.add({ randomize: randomizeParameters }, 'randomize').name('Randomize Now 🎲');

        gui.open();

        // --- 10. KEYBOARD SHORTCUTS ("H" TO TOGGLE UI) ---
        window.addEventListener('keydown', (e) => {
            if (e.key === 'h' || e.key === 'H') {
                if (gui.domElement.style.display === 'none') {
                    gui.domElement.style.display = '';
                } else {
                    gui.domElement.style.display = 'none';
                }
            }
        });

        // --- 11. MOUSE & TOUCH INTERACTION (ROTATE, PAN, ZOOM & CLICK RANDOMIZATION) ---
        let isMouseDown = false;
        let mouseButton = 0; // 0 = left (rotate), 2 = right (pan)
        let mouseStart = { x: 0, y: 0 };
        let previousMousePos = { x: 0, y: 0 };
        let hasMoved = false;

        const targetRot = new THREE.Vector2(params.rotX, params.rotY);
        const currentRot = new THREE.Vector2(params.rotX, params.rotY);
        const targetPan = new THREE.Vector2(params.panX, params.panY);
        const currentPan = new THREE.Vector2(params.panX, params.panY);

        window.addEventListener('contextmenu', (e) => {
            if (e.target.tagName === 'CANVAS') {
                e.preventDefault();
            }
        });

        window.addEventListener('mousedown', (e) => {
            if (e.target.tagName !== 'CANVAS') return;
            isMouseDown = true;
            mouseButton = e.button;
            mouseStart.x = e.clientX;
            mouseStart.y = e.clientY;
            previousMousePos.x = e.clientX;
            previousMousePos.y = e.clientY;
            hasMoved = false;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isMouseDown) return;

            const deltaX = e.clientX - previousMousePos.x;
            const deltaY = e.clientY - previousMousePos.y;

            if (Math.hypot(e.clientX - mouseStart.x, e.clientY - mouseStart.y) > 5) {
                hasMoved = true;
            }

            if (mouseButton === 2 || e.shiftKey) {
                // Right-click or Shift+Left-click: Drag / Pan object across screen
                targetPan.x += (deltaX / window.innerHeight) * (params.zoom * 0.8);
                targetPan.y -= (deltaY / window.innerHeight) * (params.zoom * 0.8);
                params.panX = targetPan.x;
                params.panY = targetPan.y;
                panXCtrl.updateDisplay();
                panYCtrl.updateDisplay();
            } else if (mouseButton === 0) {
                // Left-click: Orbit / Rotate object
                targetRot.x += deltaX * 0.008;
                targetRot.y += deltaY * 0.008;
                params.rotX = targetRot.x;
                params.rotY = targetRot.y;
            }

            previousMousePos.x = e.clientX;
            previousMousePos.y = e.clientY;
        });

        window.addEventListener('mouseup', (e) => {
            if (isMouseDown && !hasMoved && mouseButton === 0 && e.target.tagName === 'CANVAS') {
                // User clicked without dragging: trigger procedural randomization if enabled
                if (params.randomizeOnClick) {
                    randomizeParameters();
                }
            }
            isMouseDown = false;
        });

        // Wheel to Zoom
        window.addEventListener('wheel', (e) => {
            if (e.target.tagName !== 'CANVAS') return;

            params.zoom += e.deltaY * 0.004;
            params.zoom = Math.max(1.5, Math.min(params.zoom, 12.0));
            zoomCtrl.updateDisplay();
            uniforms.u_zoom.value = params.zoom;
        }, { passive: true });

        // Touch Interaction Support (1-finger rotate / click, 2-finger pinch-zoom & pan)
        let touchStartDist = 0;
        let touchStartPos = { x: 0, y: 0 };
        let touchMoved = false;

        window.addEventListener('touchstart', (e) => {
            if (e.target.tagName !== 'CANVAS') return;
            if (e.touches.length === 1) {
                touchStartPos.x = e.touches[0].clientX;
                touchStartPos.y = e.touches[0].clientY;
                previousMousePos.x = e.touches[0].clientX;
                previousMousePos.y = e.touches[0].clientY;
                touchMoved = false;
            } else if (e.touches.length === 2) {
                touchStartDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
            }
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (e.target.tagName !== 'CANVAS') return;
            if (e.touches.length === 1) {
                const deltaX = e.touches[0].clientX - previousMousePos.x;
                const deltaY = e.touches[0].clientY - previousMousePos.y;

                if (Math.hypot(e.touches[0].clientX - touchStartPos.x, e.touches[0].clientY - touchStartPos.y) > 6) {
                    touchMoved = true;
                }

                targetRot.x += deltaX * 0.008;
                targetRot.y += deltaY * 0.008;
                params.rotX = targetRot.x;
                params.rotY = targetRot.y;

                previousMousePos.x = e.touches[0].clientX;
                previousMousePos.y = e.touches[0].clientY;
            } else if (e.touches.length === 2) {
                touchMoved = true;
                const currentDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                const pinchFactor = (touchStartDist - currentDist) * 0.01;
                params.zoom = Math.max(1.5, Math.min(params.zoom + pinchFactor, 12.0));
                zoomCtrl.updateDisplay();
                uniforms.u_zoom.value = params.zoom;
                touchStartDist = currentDist;
            }
        }, { passive: true });

        window.addEventListener('touchend', (e) => {
            if (!touchMoved && e.target.tagName === 'CANVAS' && params.randomizeOnClick) {
                randomizeParameters();
            }
        });

        // --- 12. WINDOW RESIZE HANDLING ---
        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            uniforms.u_resolution.value.set(window.innerWidth * params.dpr, window.innerHeight * params.dpr);
            postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);
        });

        // --- 13. ANIMATION LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();
            uniforms.u_time.value = elapsedTime;

            // Apply Preconfigured 8 Smooth Animation Modes
            if (params.autoAnimation) {
                const t = elapsedTime * params.speed;

                switch (params.animationPreset) {
                    case 'Static Scan (No Camera Movement)':
                        // Pure motionless camera with stationary inspection
                        break;

                    case 'Turntable 360 Inspection':
                        targetRot.x += 0.004 * params.speed * 3.0;
                        targetRot.y = 0.28 + Math.sin(t * 0.3) * 0.08;
                        break;

                    case 'Laser Pitch & Sweep':
                        targetRot.y = 0.3 + Math.sin(t * 0.7) * 0.35;
                        targetRot.x = Math.sin(t * 0.35) * 0.22;
                        break;

                    case 'Orbital Lissajous Wave':
                        targetRot.x = Math.sin(t * 0.45) * 0.48;
                        targetRot.y = 0.25 + Math.cos(t * 0.6) * 0.28;
                        break;

                    case 'Topographic Undulation':
                        targetRot.x = Math.sin(t * 0.28) * 0.25;
                        targetRot.y = 0.38 + Math.cos(t * 0.38) * 0.12;
                        break;

                    case 'Structured Light Glider':
                        targetRot.x = 0.55 + Math.sin(t * 0.35) * 0.35;
                        targetRot.y = 0.52 + Math.cos(t * 0.28) * 0.2;
                        break;

                    case 'Aerial Crease Survey':
                        targetRot.y = 0.85 + Math.sin(t * 0.32) * 0.22;
                        targetRot.x += 0.002 * params.speed * 3.0;
                        break;

                    case 'Metrology Precision Pan':
                        targetRot.x = Math.sin(t * 0.35) * 0.2;
                        targetRot.y = 0.35 + Math.cos(t * 0.45) * 0.15;
                        targetPan.x = Math.sin(t * 0.5) * 0.35;
                        targetPan.y = Math.cos(t * 0.35) * 0.2;
                        params.panX = targetPan.x;
                        params.panY = targetPan.y;
                        panXCtrl.updateDisplay();
                        panYCtrl.updateDisplay();
                        break;
                }
            }

            // Smooth Interpolation for Camera Rotation & Pan
            currentRot.lerp(targetRot, 0.08);
            currentPan.lerp(targetPan, 0.08);

            uniforms.u_cam_rot.value.copy(currentRot);
            uniforms.u_pan.value.copy(currentPan);

            // Render Scene through PostProcessor Pipeline
            postProcessor.renderScene(scene, camera);
        }

        // Initialize state
        setGreenScreen(params.greenScreen);
        updateUniforms();
        animate();
    </script>
</body>
</html>
