<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Russian Crude Oil — Global Export Flows</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0a0e12;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: background-color 0.3s ease;
            user-select: none;
            -webkit-user-select: none;
        }
        #chartdiv {
            width: 100vw;
            height: 100vh;
            background-color: #0a0e12;
            transition: background-color 0.3s ease;
        }
    </style>

    <!-- amCharts 5 Engine & Geospatial Data -->
    <script src="https://cdn.amcharts.com/lib/5/index.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/map.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/geodata/worldLow.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/themes/Animated.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/themes/Dark.js"></script>
</head>
<body>
    <div id="chartdiv"></div>

    <script type="module">
        import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

        const am5 = window.am5;
        const am5map = window.am5map;
        const am5themes_Animated = window.am5themes_Animated;
        const am5geodata_worldLow = window.am5geodata_worldLow;

        // =========================================================================
        // 1. 5 CURATED HIGH-CONTRAST THEMES (PER 74-MAP-DESCRIPTION.MD SPEC)
        // =========================================================================
        const themes = {
            'Crude & Tar (Default)': {
                deepCrude: '#0a0e12',
                slickColor: '#18221e',
                pipelineColor: '#2d3d34',
                amberColor: '#d98c11',
                sulfurColor: '#a89050',
                flareColor: '#ffd480',
                producerColor: '#735e16',
                importerColor: '#254536',
                shipColor: '#ffd480',
                shipGlowColor: '#d98c11'
            },
            'Cyberpunk Neon': {
                deepCrude: '#080914',
                slickColor: '#121324',
                pipelineColor: '#282a50',
                amberColor: '#ff007f',
                sulfurColor: '#ffea00',
                flareColor: '#00f5ff',
                producerColor: '#00ff66',
                importerColor: '#9b5de5',
                shipColor: '#00f5ff',
                shipGlowColor: '#ff007f'
            },
            'Tactical Radar': {
                deepCrude: '#040d08',
                slickColor: '#0b1e13',
                pipelineColor: '#163824',
                amberColor: '#00ff66',
                sulfurColor: '#aaffcc',
                flareColor: '#39ff14',
                producerColor: '#1f5933',
                importerColor: '#0f3d20',
                shipColor: '#39ff14',
                shipGlowColor: '#00ff66'
            },
            'Quantum Ice': {
                deepCrude: '#050d1a',
                slickColor: '#0f1d33',
                pipelineColor: '#1d375e',
                amberColor: '#00d4ff',
                sulfurColor: '#caf0f8',
                flareColor: '#ffffff',
                producerColor: '#185a9d',
                importerColor: '#0e3d6b',
                shipColor: '#ffffff',
                shipGlowColor: '#00d4ff'
            },
            'Solar Flare': {
                deepCrude: '#120806',
                slickColor: '#24120e',
                pipelineColor: '#4d2218',
                amberColor: '#ff4500',
                sulfurColor: '#ffd700',
                flareColor: '#ffff55',
                producerColor: '#8b2500',
                importerColor: '#4a180b',
                shipColor: '#ffff55',
                shipGlowColor: '#ff4500'
            }
        };

        const params = {
            theme: 'Crude & Tar (Default)',
            greenscreen: false,
            autoAnimate: true,
            animPreset: 'Smooth Planetary Spin',
            animSpeed: 1.0,
            zoomLevel: 1.5,
            shipSize: 3.0,
            shipGlow: 12.0,
            dpr: Math.min(window.devicePixelRatio || 1, 2.0),
            randomOnClick: true,

            // Active Theme Tokens
            deepCrude: themes['Crude & Tar (Default)'].deepCrude,
            slickColor: themes['Crude & Tar (Default)'].slickColor,
            pipelineColor: themes['Crude & Tar (Default)'].pipelineColor,
            amberColor: themes['Crude & Tar (Default)'].amberColor,
            sulfurColor: themes['Crude & Tar (Default)'].sulfurColor,
            flareColor: themes['Crude & Tar (Default)'].flareColor,
            producerColor: themes['Crude & Tar (Default)'].producerColor,
            importerColor: themes['Crude & Tar (Default)'].importerColor,
            shipColor: themes['Crude & Tar (Default)'].shipColor,
            shipGlowColor: themes['Crude & Tar (Default)'].shipGlowColor
        };

        // =========================================================================
        // 2. ROOT & AMCHARTS 5 SETUP
        // =========================================================================
        const root = am5.Root.new("chartdiv");

        const oilTheme = am5.Theme.new(root);
        oilTheme.rule("InterfaceColors").setAll({
            primaryButton: am5.color(0x18221e),
            primaryButtonHover: am5.color(0x2d3d34),
            primaryButtonDown: am5.color(0x0a0e12),
            primaryButtonActive: am5.color(0xd98c11),
            primaryButtonText: am5.color(0xffd480),
            secondaryButton: am5.color(0x18221e),
            secondaryButtonHover: am5.color(0x2d3d34),
            secondaryButtonDown: am5.color(0x0a0e12),
            secondaryButtonText: am5.color(0xffd480),
            background: am5.color(0x0a0e12),
            text: am5.color(0xffd480)
        });
        root.setThemes([am5themes_Animated.new(root), oilTheme]);

        root.container.set("background", am5.Rectangle.new(root, {
            fill: am5.color(params.deepCrude),
            fillOpacity: 1
        }));

        // Map Chart
        const chart = root.container.children.push(am5map.MapChart.new(root, {
            panX: "rotateX",
            panY: "rotateY",
            projection: am5map.geoOrthographic(),
            homeGeoPoint: { longitude: 65, latitude: 45 },
            homeRotationX: -65,
            homeRotationY: -45,
            homeZoomLevel: 1.5,
            minZoomLevel: 0.7,
            maxZoomLevel: 15,
            zoomLevel: 1.5,
            wheelY: "zoom"
        }));

        // Ocean Background Sphere
        const bgSeries = chart.series.push(am5map.MapPolygonSeries.new(root, {}));
        bgSeries.mapPolygons.template.setAll({
            fill: am5.color(params.deepCrude),
            fillOpacity: 1,
            strokeOpacity: 0
        });
        bgSeries.data.push({ geometry: am5map.getGeoRectangle(90, 180, -90, -180) });

        // Graticule Series
        const graticuleSeries = chart.series.push(am5map.GraticuleSeries.new(root, {}));
        graticuleSeries.mapLines.template.setAll({
            stroke: am5.color(params.pipelineColor),
            strokeOpacity: 0.25,
            strokeWidth: 0.5
        });

        // World Countries
        const polygonSeries = chart.series.push(am5map.MapPolygonSeries.new(root, {
            geoJSON: am5geodata_worldLow
        }));
        polygonSeries.mapPolygons.template.setAll({
            fill: am5.color(params.slickColor),
            stroke: am5.color(params.pipelineColor),
            strokeWidth: 0.5,
            strokeOpacity: 0.6
        });

        const producerIds = ["RU", "KZ"];
        const importerIds = ["CN", "IN", "TR", "HU", "SK", "CZ", "AE", "SG", "IT", "GR"];

        // =========================================================================
        // 3. MAP SANKEY SERIES (TIGHT TENSION + PRECISE BEZIER CURVATURE)
        // =========================================================================
        const sankeySeries = chart.series.push(am5map.MapSankeySeries.new(root, {
            polygonSeries: polygonSeries,
            maxWidth: 0.75,
            controlPointDistance: 0.18, // Tightly calibrated tension to prevent all overshoots
            resolution: 60,
            nodePadding: 0.1
        }));

        sankeySeries.mapPolygons.template.setAll({
            fill: am5.color(params.amberColor),
            fillOpacity: 0.40,
            strokeOpacity: 0,
            tooltipText: "[bold]{source}[/] → [bold]{target}[/]\n{value}k barrels/day"
        });

        sankeySeries.nodes.mapPolygons.template.setAll({
            fill: am5.color(params.amberColor),
            stroke: am5.color(params.flareColor),
            strokeWidth: 1.5,
            fillOpacity: 0.95,
            strokeOpacity: 1,
            tooltipText: "[bold]{name}[/]"
        });

        // Multi-Layer Glowing Energy Ship Bullets
        let bulletSprites = [];

        sankeySeries.bullets.push(function() {
            const container = am5.Container.new(root, {
                centerX: am5.p50,
                centerY: am5.p50,
                visible: false
            });

            // Outer Soft Halo
            const halo = container.children.push(am5.Circle.new(root, {
                radius: params.shipSize * 2.5,
                fill: am5.color(params.shipGlowColor),
                fillOpacity: Math.min(0.55, Math.max(0.1, params.shipGlow * 0.035)),
                strokeOpacity: 0
            }));

            // Inner Radiant Core
            const core = container.children.push(am5.Circle.new(root, {
                radius: params.shipSize,
                fill: am5.color(params.shipColor),
                stroke: am5.color(params.flareColor),
                strokeWidth: 0.75,
                shadowColor: am5.color(params.shipGlowColor),
                shadowBlur: params.shipGlow * 1.5,
                shadowOpacity: 1
            }));

            bulletSprites.push({ container, halo, core });

            return am5.Bullet.new(root, {
                locationX: 0,
                sprite: container
            });
        });

        // Geodesic Velocity Normalization
        sankeySeries.events.on("datavalidated", function() {
            let maxLength = 0;
            am5.array.each(sankeySeries.dataItems, function(dataItem) {
                const len = sankeySeries.getPathLength(dataItem);
                if (len > maxLength) maxLength = len;
            });

            const baseDuration = 8000;
            const minDuration = 2000;

            am5.array.each(sankeySeries.dataItems, function(dataItem) {
                const pathLength = sankeySeries.getPathLength(dataItem) || maxLength;
                const dur = maxLength > 0 ? Math.max(minDuration, (pathLength / maxLength) * baseDuration) : baseDuration;

                const bullets = dataItem.bullets;
                if (bullets) {
                    am5.array.each(bullets, function(bullet) {
                        const randomDur = dur * (0.8 + Math.random() * 0.4);
                        const delay = Math.random() * randomDur;
                        setTimeout(function() {
                            const sprite = bullet.get("sprite");
                            if (sprite) {
                                sprite.set("visible", true);
                            }
                            bullet.animate({
                                key: "locationX",
                                from: 0,
                                to: 1,
                                duration: randomDur,
                                easing: am5.ease.linear,
                                loops: Infinity
                            });
                        }, delay);
                    });
                }
            });

            applyCurrentColors();
        });

        // =========================================================================
        // 4. SANITIZED GEOGRAPHICAL ROUTING (ZERO LOOPS, ZERO PACIFIC HAIRPINS)
        // =========================================================================
        function flow(src, srcName, tgt, tgtName, value, wp) {
            const result = {
                sourceLongitude: src.lon, sourceLatitude: src.lat,
                targetLongitude: tgt.lon, targetLatitude: tgt.lat,
                source: srcName, target: tgtName, value: value
            };
            if (wp) result.waypoints = wp;
            return result;
        }

        // Hub Coordinates
        const primorsk     = { lon: 28.61, lat: 60.36 };
        const ustLuga      = { lon: 28.40, lat: 59.68 };
        const novorossiysk = { lon: 37.79, lat: 44.72 };
        const kozmino      = { lon: 133.00, lat: 42.74 };
        const murmansk     = { lon: 33.08, lat: 68.97 };
        const deKastri     = { lon: 140.78, lat: 51.46 };
        const almetyevsk   = { lon: 52.31, lat: 54.90 };
        const taishet      = { lon: 98.01, lat: 55.93 };
        const skovorodino  = { lon: 123.94, lat: 53.98 };

        const jamnagar     = { lon: 70.06, lat: 22.47 };
        const vadinar      = { lon: 69.72, lat: 22.43 };
        const paradip      = { lon: 86.67, lat: 20.26 };
        const zhoushan     = { lon: 122.20, lat: 29.98 };
        const qingdao      = { lon: 120.38, lat: 36.06 };
        const rizhao       = { lon: 119.52, lat: 35.41 };
        const dalian       = { lon: 121.65, lat: 38.92 };
        const daqing       = { lon: 125.01, lat: 46.59 };
        const aliaga       = { lon: 26.96, lat: 38.79 };
        const izmit        = { lon: 29.94, lat: 40.76 };
        const fujairah     = { lon: 56.36, lat: 25.13 };
        const singapore    = { lon: 103.74, lat: 1.27 };
        const szazhalom    = { lon: 18.91, lat: 47.32 };
        const bratislava   = { lon: 17.10, lat: 48.14 };
        const litvinov     = { lon: 13.60, lat: 50.59 };

        // Waypoints
        const wpDanish       = { longitude: 11.1,  latitude: 55.4 };
        const wpEnglishChan  = { longitude: -3.5,  latitude: 49.8 };
        const wpGibraltar    = { longitude: -5.6,  latitude: 35.95 };
        const wpSicily       = { longitude: 13.0,  latitude: 37.0 };
        const wpSuez         = { longitude: 32.3,  latitude: 30.5 };
        const wpRedSea       = { longitude: 38.0,  latitude: 22.0 };
        const wpBabElMandeb  = { longitude: 43.33, latitude: 12.58 };
        const wpArabianSea   = { longitude: 62.0,  latitude: 18.0 };
        const wpSriLanka     = { longitude: 80.5,  latitude: 5.7 };
        const wpMalacca      = { longitude: 101.0, latitude: 3.0 };
        const wpSouthChina   = { longitude: 113.0, latitude: 12.0 };
        const wpTaiwanStrait = { longitude: 118.5, latitude: 23.5 };
        const wpBosphorus    = { longitude: 29.1,  latitude: 41.25 };
        const wpDardanelles  = { longitude: 26.4,  latitude: 40.2 };

        // Pacific Local Corridors (Hugging Sea of Japan without overshooting)
        const wpTsushima     = { longitude: 129.0, latitude: 34.0 };
        const wpKoreaStrait  = { longitude: 128.5, latitude: 34.5 };
        const wpYellowSea    = { longitude: 124.0, latitude: 35.0 };

        const viaPacificZhoushan = [{ longitude: 130.5, latitude: 37.0 }, wpTsushima, { longitude: 125.0, latitude: 31.0 }];
        const viaPacificQingdao  = [{ longitude: 130.5, latitude: 37.0 }, wpKoreaStrait, wpYellowSea];
        const viaPacificRizhao   = [{ longitude: 130.5, latitude: 37.0 }, wpKoreaStrait, { longitude: 123.5, latitude: 34.5 }];
        const viaPacificDalian   = [{ longitude: 130.5, latitude: 37.0 }, wpKoreaStrait, { longitude: 124.0, latitude: 36.5 }, { longitude: 122.5, latitude: 38.2 }];
        const viaPacificSingapore= [{ longitude: 130.5, latitude: 37.0 }, wpTsushima, { longitude: 122.0, latitude: 25.0 }, { longitude: 116.0, latitude: 18.0 }, { longitude: 108.0, latitude: 6.0 }];
        const viaPacificIndia    = [{ longitude: 130.5, latitude: 37.0 }, wpTsushima, { longitude: 120.0, latitude: 22.0 }, { longitude: 113.0, latitude: 12.0 }, wpMalacca, wpSriLanka, { longitude: 65.0, latitude: 15.0 }];
        const viaSakhalinQingdao = [{ longitude: 138.0, latitude: 45.0 }, { longitude: 133.0, latitude: 39.0 }, wpKoreaStrait, wpYellowSea];

        // Arctic Northern Sea Route (NSR) — Monotonic Smooth Pacific Approach
        const viaArcticNSR_Zhoushan = [
            { longitude: 58.0,  latitude: 70.5 },  // Kara Gate
            { longitude: 103.0, latitude: 77.9 },  // Vilkitsky Strait
            { longitude: 130.0, latitude: 75.0 },  // Laptev Sea
            { longitude: 160.0, latitude: 72.0 },  // East Siberian Sea
            { longitude: 170.0, latitude: 66.0 },  // Bering Strait West
            { longitude: 168.0, latitude: 58.0 },  // Bering Sea West
            { longitude: 155.0, latitude: 50.0 },  // Kuril Pass Outer
            { longitude: 145.0, latitude: 38.0 },  // Pacific East of Honshu
            { longitude: 138.0, latitude: 32.0 },  // South of Japan
            { longitude: 128.0, latitude: 30.0 }   // East China Sea Approach
        ];

        const viaArcticNSR_Qingdao = [
            { longitude: 58.0,  latitude: 70.5 },
            { longitude: 103.0, latitude: 77.9 },
            { longitude: 130.0, latitude: 75.0 },
            { longitude: 160.0, latitude: 72.0 },
            { longitude: 170.0, latitude: 66.0 },
            { longitude: 168.0, latitude: 58.0 },
            { longitude: 155.0, latitude: 50.0 },
            { longitude: 145.0, latitude: 38.0 },
            { longitude: 138.0, latitude: 32.0 },
            { longitude: 128.0, latitude: 32.0 },
            { longitude: 123.5, latitude: 34.5 }
        ];

        // Overland Pipelines
        const viaDruzhba = [
            { longitude: 42.0, latitude: 53.0 },
            { longitude: 29.27, latitude: 52.05 }, // Mozyr
            { longitude: 24.02, latitude: 49.83 }  // Brody
        ];

        const viaESPOTrunk = [
            { longitude: 105.0, latitude: 56.5 },
            { longitude: 115.0, latitude: 56.0 },
            { longitude: 123.94, latitude: 53.98 }, // Skovorodino
            { longitude: 130.0, latitude: 48.0 }
        ];

        const viaBalticSuezIndia = [wpDanish, wpEnglishChan, wpGibraltar, wpSicily, wpSuez, wpRedSea, wpBabElMandeb, wpArabianSea];
        const viaBalticSuezChina = [wpDanish, wpEnglishChan, wpGibraltar, wpSuez, wpBabElMandeb, wpSriLanka, wpMalacca, wpSouthChina, wpTaiwanStrait];
        const viaBalticCape      = [wpDanish, wpEnglishChan, { longitude: -18, latitude: 25 }, { longitude: -15, latitude: 0 }, { longitude: 18.5, latitude: -34.5 }, { longitude: 28.0, latitude: -32.0 }, wpSriLanka];
        const viaBlackSeaIndia   = [wpBosphorus, wpDardanelles, wpSuez, wpRedSea, wpBabElMandeb, wpArabianSea];
        const viaBlackSeaTurkey  = [wpBosphorus, wpDardanelles];

        // Populate Cleaned Flow Dataset
        sankeySeries.data.setAll([
            // Baltic Sea Flows
            flow(primorsk, "Primorsk Port", jamnagar,  "Jamnagar (Reliance)", 850, viaBalticSuezIndia),
            flow(primorsk, "Primorsk Port", vadinar,   "Vadinar (Nayara)",    450, viaBalticSuezIndia),
            flow(primorsk, "Primorsk Port", zhoushan,  "Zhoushan Reserve",    650, viaBalticSuezChina),
            flow(primorsk, "Primorsk Port", qingdao,   "Qingdao Port",        500, viaBalticSuezChina),
            flow(primorsk, "Primorsk Port", fujairah,  "Fujairah STS",        300, [wpDanish, wpEnglishChan, wpGibraltar, wpSuez, wpBabElMandeb]),
            flow(ustLuga,  "Ust-Luga Port", jamnagar,  "Jamnagar (Cape VLCC)",400, viaBalticCape),

            // Black Sea Flows
            flow(novorossiysk, "Novorossiysk", jamnagar, "Jamnagar",          700, viaBlackSeaIndia),
            flow(novorossiysk, "Novorossiysk", vadinar,  "Vadinar",           380, viaBlackSeaIndia),
            flow(novorossiysk, "Novorossiysk", paradip,  "Paradip (IOC)",     300, [wpBosphorus, wpSuez, wpBabElMandeb, wpSriLanka]),
            flow(novorossiysk, "Novorossiysk", aliaga,   "Aliaga (STAR)",     220, viaBlackSeaTurkey),
            flow(novorossiysk, "Novorossiysk", izmit,    "Izmit (TUPRAS)",    180, [wpBosphorus]),
            flow(novorossiysk, "Novorossiysk", zhoushan, "Zhoushan",          400, [wpBosphorus, wpSuez, wpBabElMandeb, wpSriLanka, wpMalacca]),

            // Pacific ESPO Flows (Clean Local Routes)
            flow(kozmino, "Kozmino Port", zhoushan,  "Zhoushan Hub",          600, viaPacificZhoushan),
            flow(kozmino, "Kozmino Port", qingdao,   "Qingdao Refineries",    550, viaPacificQingdao),
            flow(kozmino, "Kozmino Port", rizhao,    "Rizhao Port",           350, viaPacificRizhao),
            flow(kozmino, "Kozmino Port", dalian,    "Dalian Port",           300, viaPacificDalian),
            flow(kozmino, "Kozmino Port", jamnagar,  "Jamnagar",              400, viaPacificIndia),
            flow(kozmino, "Kozmino Port", singapore, "Singapore Bunker",      200, viaPacificSingapore),
            flow(deKastri,"De-Kastri Port", qingdao, "Qingdao",               220, viaSakhalinQingdao),

            // Arctic Northern Sea Route Flows
            flow(murmansk, "Murmansk FSO", zhoushan, "Zhoushan (NSR Express)",350, viaArcticNSR_Zhoushan),
            flow(murmansk, "Murmansk FSO", qingdao,  "Qingdao (NSR)",         250, viaArcticNSR_Qingdao),
            flow(murmansk, "Murmansk FSO", jamnagar, "Jamnagar (Atlantic)",   450, [{ longitude: 0, latitude: 65 }, wpEnglishChan, wpGibraltar, wpSuez, wpBabElMandeb]),

            // Overland Pipelines
            flow(almetyevsk, "Almetyevsk (Druzhba)", szazhalom,  "Százhalombatta (MOL)", 180, viaDruzhba),
            flow(almetyevsk, "Almetyevsk (Druzhba)", bratislava, "Bratislava (Slovnaft)", 120, viaDruzhba),
            flow(almetyevsk, "Almetyevsk (Druzhba)", litvinov,   "Litvínov (ORLEN)",      80, viaDruzhba),
            flow(skovorodino,"Skovorodino (ESPO)",   daqing,     "Daqing Petrochemical",  600, [{ longitude: 124.5, latitude: 50.5 }]),
            flow(taishet,    "Taishet (ESPO)",       kozmino,    "Kozmino Marine Outlet", 1600, viaESPOTrunk)
        ]);

        // =========================================================================
        // 5. HEADERS
        // =========================================================================
        const titleCont = chart.children.push(am5.Container.new(root, {
            layout: root.verticalLayout,
            x: am5.p50,
            centerX: am5.p50,
            y: 0,
            position: "absolute",
            paddingTop: 16
        }));

        const titleLabel = titleCont.children.push(am5.Label.new(root, {
            text: "Russian Crude Oil — Global Export Flows",
            fontSize: 18,
            fontWeight: "600",
            fill: am5.color(params.amberColor),
            x: am5.p50,
            centerX: am5.p50
        }));

        const subtitleLabel = titleCont.children.push(am5.Label.new(root, {
            text: "Export Ports & Pipelines > Major Global Importers (thousands of barrels/day)",
            fontSize: 11,
            fill: am5.color(params.sulfurColor),
            x: am5.p50,
            centerX: am5.p50
        }));

        // =========================================================================
        // 6. 3D GLOBE / 2D FLAT MAP SWITCH
        // =========================================================================
        const switchCont = chart.children.push(am5.Container.new(root, {
            layout: root.horizontalLayout,
            x: 20,
            y: 20,
            position: "absolute"
        }));

        const switchLabel1 = switchCont.children.push(am5.Label.new(root, {
            centerY: am5.p50,
            text: "Globe",
            fill: am5.color(params.flareColor),
            fontSize: 13,
            fontWeight: "600"
        }));

        const switchButton = switchCont.children.push(am5.Button.new(root, {
            themeTags: ["switch"],
            centerY: am5.p50,
            icon: am5.Circle.new(root, {
                themeTags: ["icon"]
            })
        }));

        const switchLabel2 = switchCont.children.push(am5.Label.new(root, {
            centerY: am5.p50,
            text: "Flat Map",
            fill: am5.color(params.flareColor),
            fontSize: 13,
            fontWeight: "600"
        }));

        const morphDuration = 1400;
        const easing = am5.ease.inOut(am5.ease.cubic);

        function zoomToGlobe() {
            chart.set("projection", am5map.geoOrthographic());
            chart.set("panX", "rotateX");
            chart.set("panY", "rotateY");
            chart.animate({ key: "rotationX", to: -65, duration: morphDuration, easing });
            chart.animate({ key: "rotationY", to: -45, duration: morphDuration, easing });
            chart.animate({ key: "zoomLevel", to: 1.5, duration: morphDuration, easing });
            bgSeries.mapPolygons.template.set("fillOpacity", 1);
        }

        function zoomToMap() {
            chart.set("projection", am5map.geoMercator());
            chart.set("panX", "translateX");
            chart.set("panY", "translateY");
            chart.animate({ key: "rotationY", to: 0, duration: morphDuration, easing });
            setTimeout(function() {
                chart.zoomToGeoPoint({ longitude: 65, latitude: 35 }, 2.8, true, morphDuration);
            }, 100);
            bgSeries.mapPolygons.template.set("fillOpacity", 0);
        }

        switchButton.on("active", function() {
            chart.goHome(morphDuration);
            setTimeout(function() {
                chart.seriesContainer.animate({ key: "opacity", to: 0, duration: 300 });
            }, morphDuration - 300);
            setTimeout(function() {
                if (switchButton.get("active")) {
                    zoomToMap();
                } else {
                    zoomToGlobe();
                }
                chart.seriesContainer.animate({ key: "opacity", to: 1, duration: 300 });
            }, morphDuration);
        });

        const zoomControl = chart.set("zoomControl", am5map.ZoomControl.new(root, {}));
        zoomControl.homeButton.set("visible", true);
        zoomControl.homeButton.events.on("click", function() {
            chart.set("dx", 0);
            chart.set("dy", 0);
        });

        // =========================================================================
        // 7. RIGHT-CLICK 2-AXIS SCREEN SPACE DRAG TRANSLATION
        // =========================================================================
        window.addEventListener("contextmenu", function(e) {
            e.preventDefault();
        });

        let isRightDragging = false;
        let startX = 0, startY = 0;
        let initialDx = 0, initialDy = 0;

        window.addEventListener("mousedown", function(e) {
            if (e.button === 2) {
                isRightDragging = true;
                startX = e.clientX;
                startY = e.clientY;
                initialDx = chart.get("dx", 0);
                initialDy = chart.get("dy", 0);
            }
        });

        window.addEventListener("mousemove", function(e) {
            if (isRightDragging) {
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                chart.set("dx", initialDx + dx);
                chart.set("dy", initialDy + dy);
            }
        });

        window.addEventListener("mouseup", function(e) {
            if (e.button === 2) {
                isRightDragging = false;
            }
        });

        // =========================================================================
        // 8. MOTION ENGINE (5 CINEMATIC PRESETS + STATIC)
        // =========================================================================
        let lastFrameTime = performance.now();
        let animTime = 0;
        let isUserInteracting = false;
        let resumeTimeout = null;

        chart.chartContainer.events.on("pointerdown", function () {
            isUserInteracting = true;
            if (resumeTimeout) clearTimeout(resumeTimeout);
        });

        window.addEventListener("pointerup", function() {
            if (resumeTimeout) clearTimeout(resumeTimeout);
            resumeTimeout = setTimeout(function() {
                isUserInteracting = false;
            }, 1800);
        });

        function animateLoop(now) {
            const delta = (now - lastFrameTime) / 1000;
            lastFrameTime = now;
            const clampedDelta = Math.min(delta, 0.1);

            if (params.autoAnimate && !isUserInteracting && !switchButton.get("active")) {
                animTime += clampedDelta * params.animSpeed;

                if (params.animPreset === 'Smooth Planetary Spin') {
                    const curX = chart.get("rotationX", -65);
                    chart.set("rotationX", curX + clampedDelta * 3.5 * params.animSpeed);
                    chart.set("rotationY", -35);
                } else if (params.animPreset === 'Cinematic Orbit & Wobble') {
                    const curX = chart.get("rotationX", -65);
                    chart.set("rotationX", curX + clampedDelta * 3.0 * params.animSpeed);
                    chart.set("rotationY", -30 + Math.sin(animTime * 0.35) * 14);
                } else if (params.animPreset === 'Producer to Importer Tour') {
                    chart.set("rotationX", -65 - Math.sin(animTime * 0.15) * 50);
                    chart.set("rotationY", -30 + Math.cos(animTime * 0.15) * 15);
                } else if (params.animPreset === 'Equatorial Oceanic Drift') {
                    const curX = chart.get("rotationX", -65);
                    chart.set("rotationX", curX + clampedDelta * 2.0 * params.animSpeed);
                    const newZoom = 1.5 + Math.sin(animTime * 0.4) * 0.18;
                    chart.set("zoomLevel", newZoom);
                }
            }
            requestAnimationFrame(animateLoop);
        }
        requestAnimationFrame(animateLoop);

        // =========================================================================
        // 9. THEME LIVE SYNCHRONIZATION
        // =========================================================================
        function applyCurrentColors() {
            const activeBg = params.greenscreen ? '#00ff00' : params.deepCrude;
            document.body.style.backgroundColor = activeBg;
            const chartdiv = document.getElementById('chartdiv');
            if (chartdiv) {
                chartdiv.style.backgroundColor = activeBg;
            }

            const bgRect = root.container.get("background");
            if (bgRect) {
                bgRect.set("fill", am5.color(activeBg));
            }

            bgSeries.mapPolygons.template.set("fill", am5.color(params.deepCrude));
            bgSeries.mapPolygons.each(function(polygon) {
                polygon.set("fill", am5.color(params.deepCrude));
            });

            graticuleSeries.mapLines.template.set("stroke", am5.color(params.pipelineColor));
            graticuleSeries.mapLines.each(function(line) {
                line.set("stroke", am5.color(params.pipelineColor));
            });

            polygonSeries.mapPolygons.template.setAll({
                fill: am5.color(params.slickColor),
                stroke: am5.color(params.pipelineColor)
            });

            am5.array.each(polygonSeries.dataItems, function (di) {
                const id = di.get("id");
                const polygon = di.get("mapPolygon");
                if (polygon) {
                    if (id && producerIds.includes(id)) {
                        polygon.setAll({
                            fill: am5.color(params.producerColor),
                            stroke: am5.color(params.flareColor),
                            strokeWidth: 1.0
                        });
                    } else if (id && importerIds.includes(id)) {
                        polygon.setAll({
                            fill: am5.color(params.importerColor),
                            stroke: am5.color(params.pipelineColor)
                        });
                    } else {
                        polygon.setAll({
                            fill: am5.color(params.slickColor),
                            stroke: am5.color(params.pipelineColor)
                        });
                    }
                }
            });

            sankeySeries.mapPolygons.template.set("fill", am5.color(params.amberColor));
            sankeySeries.mapPolygons.each(function(polygon) {
                polygon.set("fill", am5.color(params.amberColor));
            });

            sankeySeries.nodes.mapPolygons.template.setAll({
                fill: am5.color(params.amberColor),
                stroke: am5.color(params.flareColor)
            });
            sankeySeries.nodes.mapPolygons.each(function(polygon) {
                polygon.setAll({
                    fill: am5.color(params.amberColor),
                    stroke: am5.color(params.flareColor)
                });
            });

            bulletSprites.forEach(b => {
                b.halo.setAll({
                    radius: params.shipSize * 2.5,
                    fill: am5.color(params.shipGlowColor),
                    fillOpacity: Math.min(0.55, Math.max(0.1, params.shipGlow * 0.035))
                });
                b.core.setAll({
                    radius: params.shipSize,
                    fill: am5.color(params.shipColor),
                    stroke: am5.color(params.flareColor),
                    shadowColor: am5.color(params.shipGlowColor),
                    shadowBlur: params.shipGlow * 1.5
                });
            });

            titleLabel.set("fill", am5.color(params.amberColor));
            subtitleLabel.set("fill", am5.color(params.sulfurColor));
            switchLabel1.set("fill", am5.color(params.flareColor));
            switchLabel2.set("fill", am5.color(params.flareColor));
        }

        function syncGui() {
            if (gui) {
                gui.controllersRecursive().forEach(c => c.updateDisplay());
            }
        }

        // =========================================================================
        // 10. PROCEDURAL THEME GENERATOR ON CANVAS CLICK
        // =========================================================================
        function randomHexColor(hMin, hMax, s = 90, l = 55) {
            const h = Math.floor(hMin + Math.random() * (hMax - hMin));
            const a = s * Math.min(l, 100 - l) / 10000;
            const f = n => {
                const k = (n + h / 30) % 12;
                const color = l / 100 - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
                return Math.round(255 * color).toString(16).padStart(2, '0');
            };
            return `#${f(0)}${f(8)}${f(4)}`;
        }

        function triggerProceduralRandomization() {
            const baseHue = Math.floor(Math.random() * 360);
            const secondaryHue = (baseHue + 45 + Math.floor(Math.random() * 50)) % 360;
            const contrastHue = (baseHue + 180 + Math.floor(Math.random() * 40)) % 360;

            params.amberColor = randomHexColor(baseHue, baseHue + 25, 95, 60);
            params.flareColor = randomHexColor(baseHue + 10, baseHue + 35, 95, 75);
            params.pipelineColor = randomHexColor(baseHue, baseHue + 25, 65, 30);
            params.producerColor = randomHexColor(contrastHue, contrastHue + 20, 85, 45);
            params.importerColor = randomHexColor(secondaryHue, secondaryHue + 20, 75, 35);
            params.deepCrude = randomHexColor(baseHue, baseHue + 20, 30, 7);
            params.slickColor = randomHexColor(baseHue, baseHue + 20, 25, 14);
            params.shipColor = params.flareColor;
            params.shipGlowColor = params.amberColor;

            params.animSpeed = +(0.7 + Math.random() * 1.5).toFixed(1);
            params.shipSize = +(2.0 + Math.random() * 2.5).toFixed(1);
            params.shipGlow = +(8.0 + Math.random() * 12.0).toFixed(1);
            params.theme = 'Custom / Procedural';

            applyCurrentColors();
            syncGui();
        }

        let pointerDownTime = 0;
        let pointerDownPos = { x: 0, y: 0 };

        window.addEventListener('pointerdown', (e) => {
            if (e.target.closest('.lil-gui') || e.target.closest('.am5-button')) return;
            pointerDownTime = Date.now();
            pointerDownPos = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('pointerup', (e) => {
            if (e.target.closest('.lil-gui') || e.target.closest('.am5-button')) return;
            const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
            const duration = Date.now() - pointerDownTime;
            if (dist < 6 && duration < 350 && params.randomOnClick) {
                triggerProceduralRandomization();
            }
        });

        // =========================================================================
        // 11. LIL-GUI CONTROL PANEL
        // =========================================================================
        const gui = new GUI({ title: 'OIL EXPORT FLOWS' });

        gui.add(params, 'theme', Object.keys(themes)).name('Color Scheme').onChange(val => {
            if (themes[val]) {
                Object.assign(params, themes[val]);
                applyCurrentColors();
                syncGui();
            }
        });
        gui.add(params, 'greenscreen').name('Greenscreen (#00ff00)').onChange(applyCurrentColors);

        const fMotion = gui.addFolder('Motion & Camera');
        fMotion.add(params, 'autoAnimate').name('Auto Animation');
        fMotion.add(params, 'animPreset', [
            'Smooth Planetary Spin',
            'Cinematic Orbit & Wobble',
            'Producer to Importer Tour',
            'Equatorial Oceanic Drift',
            'Static (No Camera Motion)'
        ]).name('Camera Preset');
        fMotion.add(params, 'animSpeed', 0.1, 5.0, 0.1).name('Animation Speed');
        fMotion.add(params, 'zoomLevel', 0.5, 15.0, 0.1).name('Zoom Level').onChange(val => {
            chart.set("zoomLevel", val);
        });

        const fShips = gui.addFolder('Ship Glowing Bullets');
        fShips.add(params, 'shipSize', 1.0, 10.0, 0.5).name('Ship Size').onChange(applyCurrentColors);
        fShips.add(params, 'shipGlow', 0.0, 25.0, 1.0).name('Glow Intensity').onChange(applyCurrentColors);
        fShips.addColor(params, 'shipColor').name('Ship Core Color').onChange(applyCurrentColors);
        fShips.addColor(params, 'shipGlowColor').name('Ship Halo Glow').onChange(applyCurrentColors);

        const fDisplay = gui.addFolder('System & Display');
        fDisplay.add(params, 'dpr', 0.5, 3.0, 0.25).name('Pixel Ratio (DPR)').onChange(val => {
            if (root.dom) {
                root.dom.style.transform = `scale(1)`;
            }
        });
        fDisplay.add(params, 'randomOnClick').name('Click to Randomize');

        const fColors = gui.addFolder('Custom Color Palette').close();
        fColors.addColor(params, 'amberColor').name('Flow Ribbons').onChange(applyCurrentColors);
        fColors.addColor(params, 'flareColor').name('Node Outlines').onChange(applyCurrentColors);
        fColors.addColor(params, 'pipelineColor').name('Graticule & Borders').onChange(applyCurrentColors);
        fColors.addColor(params, 'producerColor').name('Producer Land (RU)').onChange(applyCurrentColors);
        fColors.addColor(params, 'importerColor').name('Importer Land').onChange(applyCurrentColors);
        fColors.addColor(params, 'slickColor').name('Continental Land').onChange(applyCurrentColors);
        fColors.addColor(params, 'deepCrude').name('Ocean Deep').onChange(applyCurrentColors);

        // =========================================================================
        // 12. HOTKEYS & RESIZE
        // =========================================================================
        let isUiHidden = false;
        window.addEventListener('keydown', (e) => {
            if (e.key === 'h' || e.key === 'H') {
                isUiHidden = !isUiHidden;
                if (isUiHidden) {
                    gui.hide();
                    titleCont.hide();
                    switchCont.hide();
                    zoomControl.hide();
                } else {
                    gui.show();
                    titleCont.show();
                    switchCont.show();
                    zoomControl.show();
                }
            }
        });

        window.addEventListener('resize', () => {
            root.resize();
        });
    </script>
</body>
</html>
