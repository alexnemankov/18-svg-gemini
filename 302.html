    // --- OBSTACLE AVOIDANCE VECTOR CALCULATION ---
    function computeObstacleAvoidance(pos, moveDir) {
      const force = new THREE.Vector3(0, 0, 0);

      // Avoid all interactive props (hay bales, pumpkins, water trough)
      for (let prop of interactiveProps) {
        if (prop.position.y > 1.8) continue; // carried in air
        const pr = (prop.userData.radius || 1.1) + 1.35;
        const dx = pos.x - prop.position.x;
        const dz = pos.z - prop.position.z;
        const dist = Math.hypot(dx, dz);
        if (dist < pr && dist > 0.01) {
          const nx = dx / dist;
          const nz = dz / dist;
          const dot = -nz * moveDir.x + nx * moveDir.z;
          const sign = dot >= 0 ? 1 : -1;
          const tx = -nz * sign;
          const tz = nx * sign;
          const w = (pr - dist) / pr;
          force.x += (nx * 8.5 + tx * 11.0) * w;
          force.z += (nz * 8.5 + tz * 11.0) * w;
        }
      }

      // Avoid Barn Front Ramp
      if (pos.z < -1.5 && Math.abs(pos.x) < 4.8) {
        force.z += 10.0 * (-1.5 - pos.z);
      }

      // Avoid Left & Right Paddock Wings
      if (pos.z < -4.8 && Math.abs(pos.x) >= 4.8) {
        force.z += 9.0;
        force.x += pos.x < 0 ? 6.0 : -6.0;
      }

      return force;
    }

    // =========================================================================
    // BEAUTIFUL LOW-POLY CHICKEN WITH SMOOTH WALKING & PHYSICAL COLLIDERS
    // =========================================================================
    class Chicken {
      constructor(id, x, z) {
        this.id = id;
        this.radius = 0.68; // Physical collision radius
        this.position = new THREE.Vector3(x, 0, z);
        this.velocity = new THREE.Vector3(0, 0, 0);
        this.heading = Math.random() * Math.PI * 2;
        this.targetPos = new THREE.Vector3();
        this.walkDuration = 0;
        this.stayTimer = 1.0 + Math.random() * 2.0;

        this.maxSpeed = 2.4 + Math.random() * 0.8;
        this.rushSpeed = 6.2;

        // Springy Harmonic Squash & Stretch oscillator
        this.spring = {
          scaleY: 1.0,
          velY: 0.0,
          targetY: 1.0,
          k: CONFIG.springStiffness,
          damp: CONFIG.springDamping
        };

        // State Machine: 'STAY', 'WALK', 'RUSH', 'EATING', 'DRAGGED', 'BOUNCING'
        this.state = 'STAY';
        this.eatTimer = 0;
        this.peckStruck = false;
        this.targetFeed = null;
        this.verticalVelocity = 0;
        this.walkPhase = Math.random() * 10;
        this.flapPhase = 0;

        this.plumageMaterial = chickenBodyMaterial.clone();
        this.combMaterial = chickenCombMaterial.clone();
        this.beakMaterial = chickenBeakMaterial.clone();

        this.meshGroup = new THREE.Group();
        this.meshGroup.position.copy(this.position);
        this.meshGroup.userData = { isChicken: true, chicken: this };

        this.buildModel();
        const breedLvl = (CONFIG.upgrades && CONFIG.upgrades.chickenBreed) ? CONFIG.upgrades.chickenBreed : 1;
        this.applyBreedTheme(breedLvl);
        scene.add(this.meshGroup);
        this.pickNewWaypoint();
      }

      buildModel() {
        this.squashRoot = new THREE.Group();
        this.meshGroup.add(this.squashRoot);

        // 1. Plump Rounded Low-Poly Torso
        const bodyGeo = new THREE.SphereGeometry(0.78, 7, 5);
        bodyGeo.scale(0.88, 1.05, 1.25);
        this.bodyMesh = new THREE.Mesh(bodyGeo, this.plumageMaterial);
        this.bodyMesh.position.set(0, 0.95, 0);
        this.bodyMesh.rotation.x = -0.08;
        this.bodyMesh.castShadow = true;
        this.bodyMesh.receiveShadow = true;
        this.squashRoot.add(this.bodyMesh);
        draggableObjects.push(this.bodyMesh);

        // 2. Articulated Head & Neck
        this.headGroup = new THREE.Group();
        this.headGroup.position.set(0, 1.38, 0.52);
        this.squashRoot.add(this.headGroup);

        const neckGeo = new THREE.CylinderGeometry(0.24, 0.36, 0.45, 6);
        const neckMesh = new THREE.Mesh(neckGeo, this.plumageMaterial);
        neckMesh.position.set(0, -0.16, -0.08);
        neckMesh.rotation.x = 0.22;
        neckMesh.castShadow = true;
        this.headGroup.add(neckMesh);

        const headGeo = new THREE.DodecahedronGeometry(0.38, 0);
        this.headMesh = new THREE.Mesh(headGeo, this.plumageMaterial);
        this.headMesh.position.set(0, 0.12, 0);
        this.headMesh.castShadow = true;
        this.headGroup.add(this.headMesh);

        // 3. Beak (Upper & Lower)
        const beakUpperGeo = new THREE.ConeGeometry(0.18, 0.38, 4);
        this.beakMesh = new THREE.Mesh(beakUpperGeo, this.beakMaterial);
        this.beakMesh.rotation.x = Math.PI / 2 + 0.08;
        this.beakMesh.position.set(0, 0.08, 0.46);
        this.beakMesh.castShadow = true;
        this.headGroup.add(this.beakMesh);

        const beakLowerGeo = new THREE.ConeGeometry(0.13, 0.26, 4);
        const beakLower = new THREE.Mesh(beakLowerGeo, this.beakMaterial);
        beakLower.rotation.x = Math.PI / 2 - 0.06;
        beakLower.position.set(0, -0.02, 0.42);
        this.headGroup.add(beakLower);

        // 4. Stylized 3-Crested Rooster Comb
        this.combGroup = new THREE.Group();
        this.combGroup.position.set(0, 0.45, -0.02);

        const c1Geo = new THREE.ConeGeometry(0.1, 0.28, 4);
        const c1 = new THREE.Mesh(c1Geo, this.combMaterial);
        c1.position.set(0, -0.05, 0.16);
        c1.rotation.x = -0.15;
        c1.castShadow = true;
        this.combGroup.add(c1);

        const c2Geo = new THREE.ConeGeometry(0.12, 0.38, 4);
        const c2 = new THREE.Mesh(c2Geo, this.combMaterial);
        c2.position.set(0, 0.02, 0.0);
        c2.rotation.x = -0.25;
        c2.castShadow = true;
        this.combGroup.add(c2);

        const c3Geo = new THREE.ConeGeometry(0.1, 0.3, 4);
        const c3 = new THREE.Mesh(c3Geo, this.combMaterial);
        c3.position.set(0, -0.04, -0.15);
        c3.rotation.x = -0.4;
        c3.castShadow = true;
        this.combGroup.add(c3);
        this.headGroup.add(this.combGroup);

        // 5. Double Wattles under chin
        for (let s of [-1, 1]) {
          const wattleGeo = new THREE.ConeGeometry(0.09, 0.22, 4);
          const wattle = new THREE.Mesh(wattleGeo, this.combMaterial);
          wattle.position.set(s * 0.08, -0.16, 0.28);
          wattle.rotation.x = Math.PI;
          wattle.castShadow = true;
          this.headGroup.add(wattle);
        }

        // 6. Cute Expressive Eyes with specular glint
        for (let s of [-1, 1]) {
          const eyeGeo = new THREE.SphereGeometry(0.075, 6, 5);
          const eye = new THREE.Mesh(eyeGeo, chickenEyeMaterial);
          eye.position.set(s * 0.28, 0.18, 0.18);

          const glintGeo = new THREE.DodecahedronGeometry(0.028, 0);
          const glint = new THREE.Mesh(glintGeo, new THREE.MeshBasicMaterial({ color: 0xffffff }));
          glint.position.set(s * 0.03, 0.03, 0.05);
          eye.add(glint);
          this.headGroup.add(eye);
        }

        // 6b. Royal Golden Crown for Royal Phoenix Hen (Breed Tier 5)
        const crownGroup = new THREE.Group();
        crownGroup.position.set(0, 0.44, 0.02);
        crownGroup.rotation.x = -0.22;
        const crownMat = new THREE.MeshStandardMaterial({
          color: 0xfacc15,
          roughness: 0.28,
          metalness: 0.85,
          flatShading: true
        });
        const crownBaseGeo = new THREE.CylinderGeometry(0.18, 0.16, 0.09, 5);
        const crownBase = new THREE.Mesh(crownBaseGeo, crownMat);
        crownGroup.add(crownBase);

        for (let i = 0; i < 5; i++) {
          const tipAngle = (i / 5) * Math.PI * 2;
          const tipGeo = new THREE.ConeGeometry(0.06, 0.15, 4);
          const tip = new THREE.Mesh(tipGeo, crownMat);
          tip.position.set(Math.cos(tipAngle) * 0.15, 0.09, Math.sin(tipAngle) * 0.15);
          crownGroup.add(tip);
        }
        this.crownMesh = crownGroup;
        this.crownMesh.visible = false;
        this.headGroup.add(this.crownMesh);

        // 7. Faceted Wings
        this.wings = [];
        for (let s of [-1, 1]) {
          const wingPivot = new THREE.Group();
          wingPivot.position.set(s * 0.64, 1.05, 0.05);
          this.squashRoot.add(wingPivot);

          const wingGeo = new THREE.BoxGeometry(0.14, 0.58, 0.88);
          const wing = new THREE.Mesh(wingGeo, this.plumageMaterial);
          wing.position.set(s * 0.08, -0.18, 0.05);
          wing.rotation.z = s * -0.18;
          wing.rotation.y = s * 0.08;
          wing.castShadow = true;
          wingPivot.add(wing);

          this.wings.push({ pivot: wingPivot, side: s });
        }

        // 8. 3-Feather Stepped Tail Fan
        this.tailGroup = new THREE.Group();
        this.tailGroup.position.set(0, 1.15, -0.78);
        this.squashRoot.add(this.tailGroup);

        const tailCenterGeo = new THREE.BoxGeometry(0.18, 0.85, 0.35);
        const tailCenter = new THREE.Mesh(tailCenterGeo, this.plumageMaterial);
        tailCenter.position.set(0, 0.3, -0.15);
        tailCenter.rotation.x = -0.7;
        tailCenter.castShadow = true;
        this.tailGroup.add(tailCenter);

        for (let s of [-1, 1]) {
          const tailSideGeo = new THREE.BoxGeometry(0.14, 0.72, 0.3);
          const tailSide = new THREE.Mesh(tailSideGeo, this.plumageMaterial);
          tailSide.position.set(s * 0.16, 0.22, -0.12);
          tailSide.rotation.x = -0.62;
          tailSide.rotation.y = s * 0.32;
          tailSide.castShadow = true;
          this.tailGroup.add(tailSide);
        }

        // 9. Articulated Legs & 3-Toed Splayed Feet
        this.legs = [];
        for (let s of [-1, 1]) {
          const legPivot = new THREE.Group();
          legPivot.position.set(s * 0.3, 0.5, 0.05);
          this.squashRoot.add(legPivot);

          const thighGeo = new THREE.ConeGeometry(0.12, 0.25, 5);
          const thigh = new THREE.Mesh(thighGeo, this.plumageMaterial);
          thigh.position.y = -0.06;
          thigh.rotation.x = Math.PI;
          legPivot.add(thigh);

          const legGeo = new THREE.CylinderGeometry(0.045, 0.045, 0.42, 5);
          const leg = new THREE.Mesh(legGeo, this.beakMaterial);
          leg.position.y = -0.24;
          legPivot.add(leg);

          const footGroup = new THREE.Group();
          footGroup.position.set(0, -0.44, 0.08);

          const toeMidGeo = new THREE.BoxGeometry(0.06, 0.05, 0.28);
          const toeMid = new THREE.Mesh(toeMidGeo, this.beakMaterial);
          toeMid.position.z = 0.08;
          footGroup.add(toeMid);

          const toeL = new THREE.Mesh(toeMidGeo, this.beakMaterial);
          toeL.position.set(-0.06, 0, 0.06);
          toeL.rotation.y = 0.45;
          footGroup.add(toeL);

          const toeR = new THREE.Mesh(toeMidGeo, this.beakMaterial);
          toeR.position.set(0.06, 0, 0.06);
          toeR.rotation.y = -0.45;
          footGroup.add(toeR);

          const spurGeo = new THREE.BoxGeometry(0.05, 0.04, 0.12);
          const spur = new THREE.Mesh(spurGeo, this.beakMaterial);
          spur.position.z = -0.06;
          footGroup.add(spur);

          legPivot.add(footGroup);
          this.legs.push({ pivot: legPivot, side: s });
        }
      }

      applyBreedTheme(breedLvl) {
        const PROFILES = {
          1: { // Common Yard Hen
            plumageColor: 0xfff8ed,
            roughness: 0.82,
            metalness: 0.05,
            combColor: 0xdc2626,
            beakColor: 0xf59e0b,
            scale: new THREE.Vector3(1.0, 1.0, 1.0)
          },
          2: { // Heritage Red
            plumageColor: 0x9a3412,
            roughness: 0.65,
            metalness: 0.12,
            combColor: 0x881337,
            beakColor: 0xd97706,
            scale: new THREE.Vector3(1.06, 1.15, 1.06)
          },
          3: { // Fluffy Silkie
            plumageColor: 0xffffff,
            roughness: 0.98,
            metalness: 0.0,
            combColor: 0x1e293b,
            beakColor: 0x334155,
            scale: new THREE.Vector3(1.24, 0.96, 1.26)
          },
          4: { // Golden Wyandotte
            plumageColor: 0xf59e0b,
            roughness: 0.32,
            metalness: 0.68,
            combColor: 0xef4444,
            beakColor: 0xfacc15,
            scale: new THREE.Vector3(1.28, 1.25, 1.28)
          },
          5: { // Royal Phoenix Hen
            plumageColor: 0x4a044e,
            roughness: 0.22,
            metalness: 0.85,
            combColor: 0xff4500,
            beakColor: 0xfbbf24,
            scale: new THREE.Vector3(1.42, 1.38, 1.42)
          }
        };

        const prof = PROFILES[breedLvl] || PROFILES[1];
        this.plumageMaterial.color.setHex(prof.plumageColor);
        const tint = (Math.random() - 0.5) * 0.04;
        this.plumageMaterial.color.offsetHSL(0, tint, tint);
        this.plumageMaterial.roughness = prof.roughness;
        this.plumageMaterial.metalness = prof.metalness;

        if (this.combMaterial) {
          this.combMaterial.color.setHex(prof.combColor);
        }
        if (this.beakMaterial) {
          this.beakMaterial.color.setHex(prof.beakColor);
        }

        if (!this.baseScale) this.baseScale = new THREE.Vector3(1, 1, 1);
        this.baseScale.copy(prof.scale);
        if (this.squashRoot) {
          this.squashRoot.scale.copy(this.baseScale);
        }
        this.radius = 0.68 * this.baseScale.x;
        if (this.crownMesh) {
          this.crownMesh.visible = (breedLvl >= 5);
        }
        const speeds = [6.2, 8.2, 10.0, 11.5, 13.5];
        this.rushSpeed = speeds[breedLvl - 1] || 6.2;
      }

      applyForce(force) {
        this.velocity.add(force);
      }

      triggerSquash(targetY, forceVel = 0) {
        this.spring.targetY = targetY;
        if (forceVel !== 0) this.spring.velY = forceVel;
      }

      pickNewWaypoint() {
        // Safe sunny open yard strictly in front of the barn & barrier wings (z: -1.2 to 15.5, r < 16.5)
        let found = false;
        for (let attempt = 0; attempt < 25; attempt++) {
          const angle = (Math.random() * 0.70 + 0.15) * Math.PI;
          const r = 3.2 + Math.random() * 12.5;
          const x = Math.cos(angle) * r;
          const z = Math.sin(angle) * r;

          // Never pick waypoints into the side wings (x < -5.0 or x > 5.0 when z < 1.0)
          const isSidePaddock = (Math.abs(x) > 4.8 && z < 1.0);
          const isNearTrough = Math.hypot(x - 15.2, z - 7.5) < 3.5;

          if (z > -1.2 && !isSidePaddock && !isNearTrough && Math.hypot(x, z) < 16.5) {
            this.targetPos.set(x, 0, z);
            found = true;
            break;
          }
        }
        if (!found) {
          this.targetPos.set((Math.random() - 0.5) * 8.0, 0, 2.5 + Math.random() * 7.0);
        }
        this.walkDuration = 3.5 + Math.random() * 5.0;
      }

      update(dt, flock, feedPellets) {
        const scaledDt = dt * CONFIG.animationSpeed;
        if (scaledDt <= 0.0001) return;

        // 1. Spring Oscillator for Volume-Conserving Squash & Stretch (without trembling)
        const displacement = this.spring.scaleY - this.spring.targetY;
        if (Math.abs(displacement) > 0.003 || Math.abs(this.spring.velY) > 0.02) {
          const springForce = -this.spring.k * displacement - this.spring.damp * this.spring.velY;
          this.spring.velY += springForce * scaledDt;
          this.spring.scaleY += this.spring.velY * scaledDt;
          this.spring.targetY += (1.0 - this.spring.targetY) * Math.min(scaledDt * 7.0, 1.0);

          const sy = Math.max(0.45, Math.min(2.0, this.spring.scaleY));
          const sxz = 1.0 / Math.sqrt(sy);
          const bs = this.baseScale || { x: 1, y: 1, z: 1 };
          this.squashRoot.scale.set(sxz * bs.x, sy * bs.y, sxz * bs.z);
        } else {
          this.spring.scaleY = 1.0;
          this.spring.velY = 0.0;
          const bs = this.baseScale || { x: 1, y: 1, z: 1 };
          this.squashRoot.scale.set(bs.x, bs.y, bs.z);
        }

        // 2. State Machine: DRAGGED
        if (this.state === 'DRAGGED') {
          this.wings.forEach(w => {
            w.pivot.rotation.z = Math.sin(this.flapPhase * 25) * 0.8 * w.side;
          });
          this.legs.forEach(l => {
            l.pivot.rotation.x = Math.sin(this.flapPhase * 18 + l.side) * 0.7;
          });
          this.headGroup.rotation.x = -0.3 + Math.sin(this.flapPhase * 20) * 0.2;
          this.flapPhase += scaledDt;
          return;
        }

        // 3. State Machine: BOUNCING (Dropped Chicken Landing)
        if (this.state === 'BOUNCING') {
          this.verticalVelocity -= 26.0 * scaledDt;
          this.position.y += this.verticalVelocity * scaledDt;

          if (this.position.y <= 0) {
            this.position.y = 0;
            this.triggerSquash(0.55, -6.0);
            this.verticalVelocity = 0;
            this.state = 'STAY';
            this.stayTimer = 1.2;
          }
          this.meshGroup.position.copy(this.position);
          return;
        }

        // 4. Check for Tossed Feed Pellets
        let nearestFeed = null;
        let minDistSq = 18 * 18;
        for (let feed of feedPellets) {
          if (!feed.active) continue;
          const d2 = this.position.distanceToSquared(feed.position);
          if (d2 < minDistSq) {
            minDistSq = d2;
            nearestFeed = feed;
          }
        }

        if (nearestFeed && this.state !== 'EATING') {
          if (this.state !== 'RUSH') {
            this.triggerSquash(1.4, 4.5);
          }
          this.state = 'RUSH';
          this.targetFeed = nearestFeed;
        } else if (!nearestFeed && this.state === 'RUSH') {
          this.state = 'STAY';
          this.stayTimer = 1.2;
          this.targetFeed = null;
        }

        // 5. State Machine: RUSH
        if (this.state === 'RUSH' && this.targetFeed) {
          if (!this.targetFeed.active) {
            this.state = 'STAY';
            this.stayTimer = 1.2;
            this.targetFeed = null;
          } else {
            const toFeed = new THREE.Vector3().subVectors(this.targetFeed.position, this.position);
            toFeed.y = 0;
            const dist = toFeed.length();

            if (dist < 0.85) {
              this.state = 'EATING';
              this.eatTimer = 1.25;
              this.peckStruck = false;
              this.velocity.set(0, 0, 0);
              this.triggerSquash(0.75, -4.0);
            } else {
              toFeed.normalize().multiplyScalar(this.rushSpeed);

              // Active Obstacle Avoidance: smoothly steer AROUND props, pumpkins & trough
              const avoid = computeObstacleAvoidance(this.position, toFeed);
              toFeed.add(avoid);

              this.velocity.lerp(toFeed, Math.min(scaledDt * 6.0, 1.0));
              this.position.addScaledVector(this.velocity, scaledDt);

              const targetHeading = Math.atan2(this.velocity.x, this.velocity.z);
              let diff = targetHeading - this.heading;
              while (diff < -Math.PI) diff += Math.PI * 2;
              while (diff > Math.PI) diff -= Math.PI * 2;
              this.heading += diff * Math.min(scaledDt * 8.0, 1.0);
              this.meshGroup.rotation.y = this.heading;

              this.walkPhase += scaledDt * 14.0;
              this.meshGroup.rotation.z = Math.sin(this.walkPhase) * 0.08;
              for (let l of this.legs) {
                const legPhase = this.walkPhase + (l.side > 0 ? 0 : Math.PI);
                l.pivot.rotation.x = Math.sin(legPhase) * 0.65;
                l.pivot.position.y = 0.5 + Math.max(0, Math.sin(legPhase)) * 0.09;
              }
              for (let w of this.wings) {
                w.pivot.rotation.z = w.side * (-0.26 + Math.sin(this.walkPhase * 1.5) * 0.35);
              }
            }
          }
          return;
        }

        // 6. State Machine: EATING
        if (this.state === 'EATING') {
          this.eatTimer -= scaledDt;
          const t = 1.25 - this.eatTimer;

          if (t < 0.55) {
            const peckCycle = Math.sin(t * Math.PI * 6.5);
            this.headGroup.rotation.x = Math.max(0, peckCycle) * 1.35;

            if (peckCycle > 0.85 && !this.peckStruck) {
              this.peckStruck = true;
              this.triggerSquash(0.72, -5.0);

              const peckPos = this.position.clone();
              peckPos.y = 0.15;
              peckPos.add(new THREE.Vector3(Math.sin(this.heading) * 0.7, 0, Math.cos(this.heading) * 0.7));
              spawnCrumbs(peckPos, 5);

              if (this.targetFeed && this.targetFeed.active) {
                this.targetFeed.mesh.scale.multiplyScalar(0.75);
              }
            } else if (peckCycle < 0.2) {
              this.peckStruck = false;
            }
          } else if (t < 0.9) {
            const gulpT = (t - 0.55) / 0.35;
            this.headGroup.rotation.x = -0.35 * Math.sin(gulpT * Math.PI);
            this.headGroup.position.y = 1.38 + 0.12 * Math.sin(gulpT * Math.PI);
            this.triggerSquash(1.25, 3.5);
          } else {
            const happyT = (t - 0.9) / 0.35;
            this.tailGroup.rotation.y = Math.sin(happyT * Math.PI * 10) * 0.45;
            this.wings.forEach(w => {
              w.pivot.rotation.z = Math.sin(happyT * Math.PI * 8) * 0.3 * w.side;
            });
            this.headGroup.rotation.x = 0;
            this.headGroup.position.y = 1.38;
          }

          if (this.eatTimer <= 0) {
            if (this.targetFeed && this.targetFeed.active) {
              this.targetFeed.eat();
              CONFIG.chickensFed++;
              saveProgress();
              updateHUD('hud-card-fed');
              playSound('peck');

              this.feedEatenCount = (this.feedEatenCount || 0) + 1;
              const neededFeeds = (CONFIG.upgrades && CONFIG.upgrades.chickenBreed >= 3) ? 1 : 2;
              if (this.feedEatenCount >= neededFeeds) {
                this.feedEatenCount = 0;
                this.state = 'LAY_EGG';
                this.layEggTimer = 1.25;
                this.eggLaid = false;
                this.triggerSquash(1.4, 4.5);
                this.targetFeed = null;
                return;
              }
            }
            this.targetFeed = null;
            this.state = 'STAY';
            this.stayTimer = 1.8 + Math.random() * 2.0;
            this.triggerSquash(1.0, 0);
          }
          return;
        }

        // 6b. State Machine: LAY_EGG (Gamified Egg Laying Reward)
        if (this.state === 'LAY_EGG') {
          this.layEggTimer -= scaledDt;
          this.velocity.set(0, 0, 0);
          const t = 1.25 - this.layEggTimer;
          this.meshGroup.rotation.z = Math.sin(t * Math.PI * 5) * 0.12;
          this.tailGroup.rotation.y = Math.sin(t * Math.PI * 10) * 0.45;
          this.wings.forEach(w => {
            w.pivot.rotation.z = w.side * (-0.2 + Math.sin(t * Math.PI * 8) * 0.35);
          });
          if (this.layEggTimer <= 0.45 && !this.eggLaid) {
            this.eggLaid = true;
            const eggPos = this.position.clone();
            eggPos.add(new THREE.Vector3(-Math.sin(this.heading) * 0.65, 0, -Math.cos(this.heading) * 0.65));
            const eggGoldChance = UPGRADE_SPECS.eggAlchemy.getChance(CONFIG.upgrades.eggAlchemy);
            spawnEgg(eggPos, Math.random() < eggGoldChance);

            // Royal Phoenix Hen (Lvl 5): Bonus second egg!
            if (CONFIG.upgrades && CONFIG.upgrades.chickenBreed >= 5) {
              const eggPos2 = eggPos.clone().add(new THREE.Vector3(0.35, 0, 0.2));
              spawnEgg(eggPos2, Math.random() < eggGoldChance);
            }
          }
          if (this.layEggTimer <= 0) {
            this.eggLaid = false;
            this.state = 'STAY';
            this.stayTimer = 1.6;
            this.triggerSquash(1.0, 0);
          }
          return;
        }

        // Anti-Stuck Watchdog (Hops & Dodges sideways if blocked for > 0.6s)
        if (this.state === 'WALK' || this.state === 'RUSH') {
          if (!this.lastCheckPos) this.lastCheckPos = this.position.clone();
          this.stuckWatchTimer = (this.stuckWatchTimer || 0) + scaledDt;
          if (this.stuckWatchTimer > 0.35) {
            const movedDist = this.position.distanceTo(this.lastCheckPos);
            if (movedDist < 0.12 && this.velocity.length() > 0.4) {
              this.stuckTally = (this.stuckTally || 0) + 1;
              if (this.stuckTally >= 2) {
                this.verticalVelocity = 3.2;
                this.state = 'BOUNCING';
                this.triggerSquash(1.4, 4.0);
                playSound('boing');
                const dodgeAngle = this.heading + (Math.random() > 0.5 ? 1.6 : -1.6);
                this.velocity.set(Math.sin(dodgeAngle) * 3.5, 0, Math.cos(dodgeAngle) * 3.5);
                this.stuckTally = 0;
                if (this.targetFeed) this.targetFeed = null;
              }
            } else {
              this.stuckTally = 0;
            }
            this.lastCheckPos.copy(this.position);
            this.stuckWatchTimer = 0;
          }
        }

        // 7. State Machine: STAY (Stable, Grounded, Zero Trembling)
        if (this.state === 'STAY') {
          this.stayTimer -= scaledDt;
          this.velocity.set(0, 0, 0);

          // Completely stable stance
          this.meshGroup.rotation.z = 0;
          this.position.y = 0;
          this.headGroup.rotation.x = 0;
          this.headGroup.position.z = 0.52;
          this.headGroup.position.y = 1.38;
          this.tailGroup.rotation.y = 0;

          for (let l of this.legs) {
            l.pivot.rotation.x = 0;
            l.pivot.position.y = 0.5;
          }
          for (let w of this.wings) {
            w.pivot.rotation.z = w.side * -0.16;
          }

          // Gentle occasional ground peck
          if (this.stayTimer > 0.8 && this.stayTimer < 1.4) {
            const p = Math.sin((1.4 - this.stayTimer) / 0.6 * Math.PI);
            this.headGroup.rotation.x = p * 0.65;
            this.headGroup.position.z = 0.52 + p * 0.08;
          }

          if (this.stayTimer <= 0) {
            this.pickNewWaypoint();
            this.state = 'WALK';
          }
          return;
        }

        // 8. State Machine: WALK (Smooth Organic Stride towards Open Yard Waypoint)
        if (this.state === 'WALK') {
          this.walkDuration -= scaledDt;

          const toTarget = new THREE.Vector3().subVectors(this.targetPos, this.position);
          toTarget.y = 0;
          const distToTarget = toTarget.length();

          if (distToTarget < 1.0 || this.walkDuration <= 0) {
            this.state = 'STAY';
            this.stayTimer = 2.0 + Math.random() * 3.5;
            this.velocity.set(0, 0, 0);
            return;
          }

          const desired = toTarget.normalize().multiplyScalar(this.maxSpeed);

          // Active Obstacle Avoidance: smoothly steer AROUND props & trough
          const avoid = computeObstacleAvoidance(this.position, desired);
          desired.add(avoid);

          // Barn & Side Barrier Repulsion
          if (this.position.z < -1.2) {
            desired.z += 8.0 * (-1.2 - this.position.z);
          }
          if (this.position.x < -4.8 && this.position.z < 0.8) {
            desired.x += 7.0;
            desired.z += 5.0;
          }
          if (this.position.x > 4.8 && this.position.z < 0.8) {
            desired.x -= 7.0;
            desired.z += 5.0;
          }

          // Soft separation from other chickens
          for (let other of flock) {
            if (other === this) continue;
            const d = this.position.distanceTo(other.position);
            if (d > 0 && d < 2.0) {
              const push = new THREE.Vector3().subVectors(this.position, other.position);
              push.y = 0;
              push.normalize().multiplyScalar((2.0 - d) * 2.5);
              desired.add(push);
            }
          }

          this.velocity.lerp(desired, Math.min(scaledDt * 4.5, 1.0));
          this.position.addScaledVector(this.velocity, scaledDt);

          const speed = this.velocity.length();
          if (speed > 0.1) {
            const targetHeading = Math.atan2(this.velocity.x, this.velocity.z);
            let diff = targetHeading - this.heading;
            while (diff < -Math.PI) diff += Math.PI * 2;
            while (diff > Math.PI) diff -= Math.PI * 2;
            this.heading += diff * Math.min(scaledDt * 5.0, 1.0);
            this.meshGroup.rotation.y = this.heading;

            this.walkPhase += scaledDt * 8.5;
            const strideRatio = Math.min(speed / this.maxSpeed, 1.0);

            // Smooth waddle roll on Z
            this.meshGroup.rotation.z = Math.sin(this.walkPhase) * 0.05 * strideRatio;
            this.position.y = 0;

            // Leg stride
            for (let l of this.legs) {
              const legPhase = this.walkPhase + (l.side > 0 ? 0 : Math.PI);
              l.pivot.rotation.x = Math.sin(legPhase) * 0.45 * strideRatio;
              l.pivot.position.y = 0.5 + Math.max(0, Math.sin(legPhase)) * 0.06 * strideRatio;
            }

            // Head bob
            const bob = Math.sin(this.walkPhase * 2.0);
            this.headGroup.position.z = 0.52 + Math.max(0, bob) * 0.08 * strideRatio;
            this.headGroup.rotation.x = bob * 0.06 * strideRatio;

            // Wings & tail
            for (let w of this.wings) {
              w.pivot.rotation.z = w.side * (-0.16 + Math.sin(this.walkPhase) * 0.03 * strideRatio);
            }
            this.tailGroup.rotation.y = Math.sin(this.walkPhase) * 0.12 * strideRatio;
          }
        }
      }
    }

    // =========================================================================
    // PHYSICAL COLLISION RESOLVER (NO CLIPPING IN OBJECTS OR EACH OTHER)
    // =========================================================================
    function resolveChickenToChickenCollisions(flock) {
      const minDistance = 1.34;
      const minDistanceSq = minDistance * minDistance;

      for (let i = 0; i < flock.length; i++) {
        const c1 = flock[i];
        if (c1.state === 'DRAGGED') continue;

        for (let j = i + 1; j < flock.length; j++) {
          const c2 = flock[j];
          if (c2.state === 'DRAGGED') continue;

          const dx = c2.position.x - c1.position.x;
          const dz = c2.position.z - c1.position.z;
          const distSq = dx * dx + dz * dz;

          if (distSq < minDistanceSq && distSq > 0.0001) {
            const dist = Math.sqrt(distSq);
            const overlap = (minDistance - dist) * 0.5;
            const nx = dx / dist;
            const nz = dz / dist;

            c1.position.x -= nx * overlap;
            c1.position.z -= nz * overlap;
            c2.position.x += nx * overlap;
            c2.position.z += nz * overlap;

            if (c1.state === 'STAY' && c2.state === 'STAY') {
              continue;
            }

            const relVx = c2.velocity.x - c1.velocity.x;
            const relVz = c2.velocity.z - c1.velocity.z;
            const vNorm = relVx * nx + relVz * nz;
            if (vNorm < 0) {
              c1.velocity.x += nx * vNorm * 0.5;
              c1.velocity.z += nz * vNorm * 0.5;
              c2.velocity.x -= nx * vNorm * 0.5;
              c2.velocity.z -= nz * vNorm * 0.5;
            }
          }
        }
      }
    }

    function resolveObjectCollisions(chicken) {
      if (chicken.state === 'DRAGGED') return;
      const cr = chicken.radius;
      let collided = false;

      // 1. HARD BARN WALL EXCLUSION (x: [-5.8, 5.8], z: [-16.8, -6.8])
      if (chicken.position.z < -6.8 && Math.abs(chicken.position.x) < 5.8) {
        chicken.position.z = -6.8;
        if (chicken.velocity.z < 0) chicken.velocity.z = 1.2;
        collided = true;
      }

      // 2. LEFT SIDE BARRIER WING (x: <= -5.0, z: [-7.8, -5.2])
      // Strictly blocks chickens from walking into the left side gap
      if (chicken.position.x <= -5.0 && chicken.position.z < -5.2) {
        chicken.position.z = -5.2;
        if (chicken.velocity.z < 0) chicken.velocity.z = 1.2;
        chicken.velocity.x = 0.8;
        collided = true;
      }

      // 3. RIGHT SIDE BARRIER WING (x: >= 5.0, z: [-7.8, -5.2])
      // Strictly blocks chickens from walking into the right side gap
      if (chicken.position.x >= 5.0 && chicken.position.z < -5.2) {
        chicken.position.z = -5.2;
        if (chicken.velocity.z < 0) chicken.velocity.z = 1.2;
        chicken.velocity.x = -0.8;
        collided = true;
      }

      // 4. FRONT BARN RAMP BUFFER (Keeps chickens in open sunny yard z >= -2.6)
      if (chicken.position.z < -2.6 && Math.abs(chicken.position.x) < 4.8) {
        chicken.position.z = -2.6;
        if (chicken.velocity.z < 0) chicken.velocity.z = 1.2;
        collided = true;
      }

      // 5. All Props & Water Trough (Smooth Radial Push + Tangent Sliding Deflection)
      for (let prop of interactiveProps) {
        if (prop.position.y > 2.0) continue; // Lifted by user
        const propR = prop.userData.radius || 1.1;
        const totalR = cr + propR;
        const dx = chicken.position.x - prop.position.x;
        const dz = chicken.position.z - prop.position.z;
        const distSq = dx * dx + dz * dz;

        if (distSq < totalR * totalR && distSq > 0.0001) {
          const dist = Math.sqrt(distSq);
          const push = totalR - dist;
          const nx = dx / dist;
          const nz = dz / dist;
          chicken.position.x += nx * push;
          chicken.position.z += nz * push;

          // Tangent sliding vector: deflect velocity smoothly around the obstacle perimeter
          const tx = -nz;
          const tz = nx;
          const vDotT = chicken.velocity.x * tx + chicken.velocity.z * tz;
          const speed = Math.max(1.5, Math.abs(vDotT));
          const sign = (vDotT >= 0) ? 1 : -1;
          chicken.velocity.x = tx * sign * speed;
          chicken.velocity.z = tz * sign * speed;
          collided = true;
        }
      }

      // 4. Outer Fence Perimeter Boundary
      const distOrigin = Math.hypot(chicken.position.x, chicken.position.z);
      const maxFenceRadius = 19.5 - cr;
      if (distOrigin > maxFenceRadius) {
        const scale = maxFenceRadius / distOrigin;
        chicken.position.x *= scale;
        chicken.position.z *= scale;
        const nx = chicken.position.x / maxFenceRadius;
        const nz = chicken.position.z / maxFenceRadius;
        const vNorm = chicken.velocity.x * nx + chicken.velocity.z * nz;
        if (vNorm > 0) {
          chicken.velocity.x -= nx * vNorm;
          chicken.velocity.z -= nz * vNorm;
        }
        collided = true;
      }

      if (collided && chicken.state === 'WALK') {
        chicken.pickNewWaypoint();
      }
    }

    // =========================================================================
    // FEED PELLETS & PHYSICS TOSS SYSTEM
    // =========================================================================
    class FeedPellet {
      constructor() {
        this.position = new THREE.Vector3(0, -100, 0);
        this.velocity = new THREE.Vector3();
        this.active = false;
        this.life = 0;

        const geo = new THREE.DodecahedronGeometry(0.18, 0);
        this.mesh = new THREE.Mesh(geo, feedMaterial);
        this.mesh.castShadow = true;
        this.mesh.visible = false;
        scene.add(this.mesh);
      }

      spawn(origin, vel, isGolden = false) {
        this.position.copy(origin);
        this.velocity.copy(vel);
        this.active = true;
        this.isGolden = isGolden;
        this.life = 18.0;
        this.mesh.position.copy(this.position);
        this.mesh.visible = true;
        this.mesh.scale.set(isGolden ? 1.4 : 1, isGolden ? 1.4 : 1, isGolden ? 1.4 : 1);
        this.mesh.material = isGolden ? goldenEggMat : feedMaterial;
      }

      update(dt) {
        if (!this.active) return;
        const scaledDt = dt * CONFIG.animationSpeed;
        this.life -= scaledDt;

        if (this.life <= 0) {
          this.despawn();
          return;
        }

        this.velocity.y -= 24.0 * scaledDt;
        this.position.addScaledVector(this.velocity, scaledDt);

        if (this.position.y <= 0.12) {
          this.position.y = 0.12;
          if (Math.abs(this.velocity.y) > 0.8) {
            this.velocity.y = -this.velocity.y * CONFIG.feedBounce;
            this.velocity.x *= 0.65;
            this.velocity.z *= 0.65;
          } else {
            this.velocity.set(0, 0, 0);
          }
        }

        this.mesh.position.copy(this.position);
        this.mesh.rotation.x += scaledDt * 3.0;
        this.mesh.rotation.y += scaledDt * 2.0;
      }

      eat() {
        this.despawn();
      }

      despawn() {
        this.active = false;
        this.mesh.visible = false;
        this.position.set(0, -100, 0);
        this.mesh.position.copy(this.position);
      }
    }

    const feedPool = [];
    for (let i = 0; i < 80; i++) {
      feedPool.push(new FeedPellet());
    }

    function tossFeedPellets(targetPos, count = 8, spread = 2.5, isGolden = false) {
      for (let i = 0; i < count; i++) {
        const p = feedPool.find(f => !f.active);
        if (!p) break;

        const origin = new THREE.Vector3(
          targetPos.x + (Math.random() - 0.5) * 0.8,
          targetPos.y + 0.5 + Math.random() * 0.5,
          targetPos.z + (Math.random() - 0.5) * 0.8
        );

        const angle = Math.random() * Math.PI * 2;
        const horizSpeed = 1.0 + Math.random() * spread;
        const vel = new THREE.Vector3(
          Math.cos(angle) * horizSpeed,
          5.0 + Math.random() * 4.5,
          Math.sin(angle) * horizSpeed
        );

        p.spawn(origin, vel, isGolden);
      }
    }

    // =========================================================================
    // FLOCK INITIALIZATION (Min: 1, Max: 30 Chickens)
    // =========================================================================
    const chickens = [];
    function initFlock(count) {
      const targetCount = Math.max(1, Math.min(30, count));
      while (chickens.length > 0) {
        const c = chickens.pop();
        scene.remove(c.meshGroup);
        const idx = draggableObjects.indexOf(c.bodyMesh);
        if (idx !== -1) draggableObjects.splice(idx, 1);
      }

      for (let i = 0; i < targetCount; i++) {
        const angle = (0.2 + 0.6 * (i / Math.max(1, targetCount))) * Math.PI;
        const r = 4.5 + (i % 3) * 3.2;
        const x = Math.cos(angle) * r;
        const z = Math.sin(angle) * r + 1.5;
        const chicken = new Chicken(i, x, z);
        chickens.push(chicken);
      }
    }
    initFlock(CONFIG.chickenCount);
    updateAllChickensBreed();

    // =========================================================================
    // INTERACTION: MOUSE DRAG OBJECTS ACROSS SCREEN & TOSS FEED
    // =========================================================================
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const dragPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
    const planeIntersection = new THREE.Vector3();

    let isInteracting = false;
    let draggedChicken = null;
    let draggedProp = null;
    let dragOffset = new THREE.Vector3();
    let isTossingFeed = false;
    let lastTossTime = 0;

    function getPointerPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.clientX || (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
      const clientY = e.clientY || (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
      return {
        x: ((clientX - rect.left) / rect.width) * 2 - 1,
        y: -((clientY - rect.top) / rect.height) * 2 + 1
      };
    }

    window.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;

      const p = getPointerPos(e);
      mouse.x = p.x;
      mouse.y = p.y;
      raycaster.setFromCamera(mouse, camera);

      const hits = raycaster.intersectObjects(draggableObjects, false);
      if (hits.length > 0) {
        const hitMesh = hits[0].object;

        // 1. Collect Egg!
        if (hitMesh.userData && hitMesh.userData.isEgg && hitMesh.userData.egg) {
          hitMesh.userData.egg.collect();
          return;
        }

        isInteracting = true;
        controls.enabled = false;

        let parent = hitMesh.parent;
        while (parent && !parent.userData.isChicken && !parent.userData.isProp) {
          parent = parent.parent;
        }

        if (parent && parent.userData.isChicken) {
          draggedChicken = parent.userData.chicken;
          draggedChicken.state = 'DRAGGED';
          draggedChicken.triggerSquash(1.4, 4.0);
          playSound('boing');

          if (CONFIG.upgrades && CONFIG.upgrades.chickenBreed >= 4) {
            CONFIG.score += 25;
            saveProgress();
            updateHUD('hud-card-score');
            spawnFloatingText('+25 ⭐ ❤️', draggedChicken.position, '#facc15');
          } else {
            spawnFloatingText('❤️', draggedChicken.position, '#ef4444');
          }

          dragPlane.setFromNormalAndCoplanarPoint(new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, 2.5, 0));
          if (raycaster.ray.intersectPlane(dragPlane, planeIntersection)) {
            dragOffset.subVectors(draggedChicken.position, planeIntersection);
          }
          return;
        }

        if (parent && parent.userData.isProp) {
          draggedProp = parent;
          playSound('boing');
          dragPlane.setFromNormalAndCoplanarPoint(new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, draggedProp.position.y + 1.2, 0));
          if (raycaster.ray.intersectPlane(dragPlane, planeIntersection)) {
            dragOffset.subVectors(draggedProp.position, planeIntersection);
          }
          return;
        }
      }

      // Start Lo-Fi music on first user interaction if enabled
      if (CONFIG.musicEnabled && !lofiMusic.isPlaying) {
        lofiMusic.start();
      }

      dragPlane.setFromNormalAndCoplanarPoint(new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, 0, 0));
      if (raycaster.ray.intersectPlane(dragPlane, planeIntersection)) {
        if (planeIntersection.length() < 22.0) {
          isTossingFeed = true;
          controls.enabled = false;
          const goldRate = UPGRADE_SPECS.goldenSeed.getChance(CONFIG.upgrades.goldenSeed);
          const isGolden = e.shiftKey || (Math.random() < goldRate);
          tossFeedPellets(planeIntersection, 6, 2.8, isGolden);
          playSound('toss');
          lastTossTime = performance.now();
        }
      }
    });

    window.addEventListener('pointermove', (e) => {
      const p = getPointerPos(e);
      mouse.x = p.x;
      mouse.y = p.y;
      raycaster.setFromCamera(mouse, camera);

      // Track cursor on yard ground for Egg Magnet
      dragPlane.setFromNormalAndCoplanarPoint(new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, 0, 0));
      raycaster.ray.intersectPlane(dragPlane, planeIntersection);

      if (draggedChicken) {
        if (raycaster.ray.intersectPlane(dragPlane, planeIntersection)) {
          const targetPos = planeIntersection.clone().add(dragOffset);
          targetPos.y = Math.max(1.8, targetPos.y);
          const dist = Math.hypot(targetPos.x, targetPos.z);
          if (dist > 21.0) targetPos.multiplyScalar(21.0 / dist);

          draggedChicken.position.lerp(targetPos, 0.45);
          draggedChicken.meshGroup.position.copy(draggedChicken.position);
        }
      } else if (draggedProp) {
        if (raycaster.ray.intersectPlane(dragPlane, planeIntersection)) {
          const targetPos = planeIntersection.clone().add(dragOffset);
          targetPos.y = Math.max(1.5, targetPos.y);
          draggedProp.position.lerp(targetPos, 0.45);
        }
      } else if (isTossingFeed) {
        const now = performance.now();
        if (now - lastTossTime > 90) {
          if (planeIntersection.length() < 21.0) {
            const goldRate = UPGRADE_SPECS.goldenSeed.getChance(CONFIG.upgrades.goldenSeed);
            const isGolden = e.shiftKey || (Math.random() < goldRate);
            tossFeedPellets(planeIntersection, 3, 1.8, isGolden);
            playSound('toss');
            lastTossTime = now;
          }
        }
      }
    });

    function releaseDrag() {
      if (draggedChicken) {
        draggedChicken.state = 'BOUNCING';
        draggedChicken.verticalVelocity = -2.0;
        draggedChicken = null;
      }
      if (draggedProp) {
        draggedProp.userData.velY = -3.0;
        draggedProp = null;
      }
      isTossingFeed = false;
      isInteracting = false;
      controls.enabled = true;
    }

    window.addEventListener('pointerup', releaseDrag);

        stoneMaterial.color.set(scheme.fence).lerp(new THREE.Color(0x78909c), 0.55);

    // =========================================================================
    // CAMERA CHOREOGRAPHY LOGIC
    // =========================================================================
    const camTargetLerp = new THREE.Vector3(0, 1.8, 0);
    function updateCameraChoreography(time, dt) {
      if (isInteracting) return;

      const anim = CONFIG.activeAnimation;
      const speed = CONFIG.animationSpeed * 0.12;

      if (anim === 'Static (Free Camera / No Movement)') {
        return;
      }

      if (anim === 'Gentle Orbit (Slow 360° Coop Pan)') {
        const angle = time * speed;
        const radius = 32.0;
        const targetX = Math.cos(angle) * radius;
        const targetZ = Math.sin(angle) * radius;
        camera.position.x += (targetX - camera.position.x) * dt * 1.5;
        camera.position.y += (16.0 - camera.position.y) * dt * 1.5;
        camera.position.z += (targetZ - camera.position.z) * dt * 1.5;
        camTargetLerp.set(0, 1.8, 0);
      } else if (anim === 'Overhead Survey (Slow Bird\'s Eye Drift)') {
        const t = time * speed * 0.8;
        const targetX = Math.cos(t) * 12.0;
        const targetZ = Math.sin(t * 1.3) * 10.0;
        camera.position.x += (targetX - camera.position.x) * dt * 1.5;
        camera.position.y += (32.0 - camera.position.y) * dt * 1.5;
        camera.position.z += (targetZ - camera.position.z) * dt * 1.5;
        camTargetLerp.set(0, 0, 0);
      } else if (anim === 'Chicken Eye Follow (Low Tracking Shot)') {
        const t = time * speed * 1.2;
        const targetX = Math.cos(t) * 18.0;
        const targetZ = Math.sin(t) * 18.0;
        camera.position.x += (targetX - camera.position.x) * dt * 1.2;
        camera.position.y += (4.2 - camera.position.y) * dt * 1.2;
        camera.position.z += (targetZ - camera.position.z) * dt * 1.2;
        camTargetLerp.set(Math.cos(t + 0.4) * 5, 1.2, Math.sin(t + 0.4) * 5);
      } else if (anim === 'Sunset Drift (Smooth Side-to-Side Dolly)') {
        const t = time * speed * 1.4;
        const targetX = Math.sin(t) * 18.0;
        camera.position.x += (targetX - camera.position.x) * dt * 1.5;
        camera.position.y += (13.5 - camera.position.y) * dt * 1.5;
        camera.position.z += (25.0 - camera.position.z) * dt * 1.5;
        camTargetLerp.set(0, 2.0, -2.0);
      } else if (anim === 'Barnyard Spiral (Slow Ascending Spiral)') {
        const t = time * speed * 0.9;
        const r = 24.0 + Math.sin(t * 0.5) * 6.0;
        const h = 12.0 + Math.sin(t * 0.7) * 8.0;
        camera.position.x += (Math.cos(t) * r - camera.position.x) * dt * 1.2;
        camera.position.y += (h - camera.position.y) * dt * 1.2;
        camera.position.z += (Math.sin(t) * r - camera.position.z) * dt * 1.2;
        camTargetLerp.set(0, 1.5, 0);
      } else if (anim === 'Feed Time Focus (Gentle Breathing In & Out)') {
        const t = time * speed * 1.5;
        const r = 24.0 + Math.sin(t * 0.5) * 5.0;
        camera.position.x += (r * 0.7 - camera.position.x) * dt * 1.2;
        camera.position.y += (14.0 + Math.sin(t * 0.5) * 2.0 - camera.position.y) * dt * 1.2;
        camera.position.z += (r * 0.7 - camera.position.z) * dt * 1.2;
        camTargetLerp.set(0, 1.0, 0);
      } else if (anim === 'Roost Side-to-Side (Slow Isometric Pendulum)') {
        const t = time * speed * 0.9;
        const angle = Math.PI / 4 + Math.sin(t) * 0.28;
        const r = 30.0;
        camera.position.x += (Math.cos(angle) * r - camera.position.x) * dt * 1.2;
        camera.position.y += (18.0 - camera.position.y) * dt * 1.2;
        camera.position.z += (Math.sin(angle) * r - camera.position.z) * dt * 1.2;
        camTargetLerp.set(0, 2.0, 0);
      }

      controls.target.lerp(camTargetLerp, dt * 2.0);
    }

    // =========================================================================
    // MAIN RENDER & ANIMATION LOOP (Auto Infinite Animation)
    // =========================================================================
    const clock = new THREE.Clock();
    let autoFeederTimer = 0;

    function animate() {
      requestAnimationFrame(animate);

      const rawDt = clock.getDelta();
      const dt = Math.min(rawDt, 0.1);
      const elapsedTime = clock.getElapsedTime();

      // 1. Weathercock spinning
      weathercockGroup.rotation.y = Math.sin(elapsedTime * 0.4) * 0.6 + Math.sin(elapsedTime * 1.2) * 0.2;

      // 1b. Windmill sails continuous rotation & Sun glow orientation
      if (typeof windmillBladesGroup !== 'undefined' && windmillBladesGroup) {
        windmillBladesGroup.rotation.z += dt * CONFIG.animationSpeed * 1.3;
      }
      if (typeof sunHaloMesh !== 'undefined' && sunHaloMesh) {
        sunHaloMesh.quaternion.copy(camera.quaternion);
      }
      if (typeof sunCoreMesh !== 'undefined' && sunCoreMesh) {
        sunCoreMesh.rotation.y += dt * 0.25;
        sunCoreMesh.rotation.x += dt * 0.18;
      }

      // 2. Panoramic Low-Poly Clouds gentle orbital drift and soft bobbing
      clouds.forEach(cloud => {
        cloud.userData.orbitAngle += cloud.userData.driftSpeed * dt * CONFIG.animationSpeed * 0.5;
        cloud.position.x = Math.cos(cloud.userData.orbitAngle) * cloud.userData.orbitRadius;
        cloud.position.z = Math.sin(cloud.userData.orbitAngle) * cloud.userData.orbitRadius;
        cloud.position.y = cloud.userData.baseY + Math.sin(elapsedTime * cloud.userData.bobSpeed + cloud.userData.bobPhase) * 0.6;
        cloud.rotation.y = cloud.userData.orbitAngle;
      });

      // 2b. Gentle breeze sway across low-poly grass tufts
      if (typeof grassClumps !== 'undefined') {
        const swayTime = elapsedTime * CONFIG.animationSpeed;
        for (let i = 0; i < grassClumps.length; i++) {
          const g = grassClumps[i];
          g.rotation.z = g.userData.baseRotZ + Math.sin(swayTime * g.userData.swaySpeed + g.userData.phase) * 0.05;
        }
      }

      // 3. Update Draggable Props physics (Falling & Landing)
      interactiveProps.forEach(prop => {
        if (prop !== draggedProp && prop.userData.velY !== 0) {
          prop.userData.velY -= 22.0 * dt * CONFIG.animationSpeed;
          prop.position.y += prop.userData.velY * dt * CONFIG.animationSpeed;
          if (prop.position.y <= prop.userData.groundY) {
            prop.position.y = prop.userData.groundY;
            prop.userData.velY = 0;
          }
        }
      });

      // 4. Update Feed Pellets & Bursting Crumb Particles
      for (let feed of feedPool) {
        feed.update(dt);
      }
      for (let crumb of crumbPool) {
        crumb.update(dt);
      }

      // 4b. Update Gamified Eggs (Gentle Wobble & Physics)
      for (let i = activeEggs.length - 1; i >= 0; i--) {
        const egg = activeEggs[i];
        if (!egg.active) continue;
        if (egg.mesh.position.y > 0.35) {
          egg.velY -= 18.0 * dt * CONFIG.animationSpeed;
          egg.mesh.position.y += egg.velY * dt * CONFIG.animationSpeed;
          if (egg.mesh.position.y <= 0.35) {
            egg.mesh.position.y = 0.35;
            egg.velY = 0;
          }
        }
        egg.wobble += dt * 3.0;
        egg.mesh.rotation.y += dt * (egg.isGolden ? 1.5 : 0.4);
        if (egg.isGolden) {
          egg.mesh.position.y = 0.35 + Math.sin(egg.wobble * 2.0) * 0.05;
        }
      }

      // 4c. Update Floating Score Popups
      for (let i = activePopups.length - 1; i >= 0; i--) {
        const p = activePopups[i];
        p.age += dt;
        p.sprite.position.y += p.velY * dt;
        p.mat.opacity = Math.max(0, 1.0 - (p.age / p.maxAge));
        if (p.age >= p.maxAge) {
          scene.remove(p.sprite);
          p.texture.dispose();
          p.mat.dispose();
          activePopups.splice(i, 1);
        }
      }

      // 4d. Update Star Sparks
      for (let i = activeSparkles.length - 1; i >= 0; i--) {
        const sp = activeSparkles[i];
        sp.age += dt;
        sp.vel.y -= 14.0 * dt;
        sp.mesh.position.addScaledVector(sp.vel, dt);
        sp.mesh.rotation.x += dt * 8.0;
        sp.mesh.rotation.y += dt * 6.0;
        const scale = Math.max(0.01, 1.0 - (sp.age / sp.maxAge));
        sp.mesh.scale.setScalar(scale * 0.8);
        if (sp.age >= sp.maxAge || sp.mesh.position.y <= 0.05) {
          scene.remove(sp.mesh);
          activeSparkles.splice(i, 1);
        }
      }

      // 4e. Auto-Feeder Silo Upgrade Behavior
      if (CONFIG.upgrades && CONFIG.upgrades.autoFeeder > 0) {
        autoFeederTimer += dt * CONFIG.animationSpeed;
        const interval = UPGRADE_SPECS.autoFeeder.getInterval(CONFIG.upgrades.autoFeeder);
        if (autoFeederTimer >= interval) {
          autoFeederTimer = 0;
          const count = UPGRADE_SPECS.autoFeeder.getCount(CONFIG.upgrades.autoFeeder);
          const rx = (Math.random() - 0.5) * 11;
          const rz = 2.0 + Math.random() * 9;
          const isGold = Math.random() < UPGRADE_SPECS.goldenSeed.getChance(CONFIG.upgrades.goldenSeed);
          tossFeedPellets(new THREE.Vector3(rx, 0, rz), count, 2.2, isGold);
          playSound('toss');
          spawnFloatingText('🚜 Auto-Feed!', new THREE.Vector3(rx, 1.8, rz), '#60a5fa');
        }
      }

      // 4f. Harvester Magnet Upgrade Behavior
      if (CONFIG.upgrades && CONFIG.upgrades.eggMagnet > 0) {
        const magLvl = CONFIG.upgrades.eggMagnet;
        const pullDist = [0, 6.0, 12.0, 20.0, 25.0, 999][magLvl];
        const pullSpeed = [0, 3.0, 5.5, 8.5, 12.0, 16.0][magLvl];
        const autoCollectDist = magLvl >= 5 ? 999 : (magLvl >= 4 ? 8.0 : 0);

        for (let i = activeEggs.length - 1; i >= 0; i--) {
          const egg = activeEggs[i];
          if (!egg.active) continue;

          const target = (planeIntersection && planeIntersection.length() < 22)
            ? planeIntersection
            : new THREE.Vector3(0, 0, 5);
          const dist = Math.hypot(egg.mesh.position.x - target.x, egg.mesh.position.z - target.z);

          if (dist < autoCollectDist || magLvl >= 5) {
            egg.collect();
          } else if (dist < pullDist) {
            const dx = target.x - egg.mesh.position.x;
            const dz = target.z - egg.mesh.position.z;
            const angle = Math.atan2(dx, dz);
            egg.mesh.position.x += Math.sin(angle) * pullSpeed * dt;
            egg.mesh.position.z += Math.cos(angle) * pullSpeed * dt;
            egg.mesh.rotation.x += dt * 6.0;
            egg.mesh.rotation.z += dt * 6.0;
          }
        }
      }

      // 5. Update Chickens (Flocking, Behavior & Stride)
      for (let chicken of chickens) {
        chicken.update(dt, chickens, feedPool);
      }

      // 6. COLLISION RESOLUTION (Stable single pass: mutual separation + obstacle bounds)
      resolveChickenToChickenCollisions(chickens);
      for (let chicken of chickens) {
        resolveObjectCollisions(chicken);
        chicken.meshGroup.position.x = chicken.position.x;
        chicken.meshGroup.position.z = chicken.position.z;
      }

      // 7. Camera Choreography Preset Update
      updateCameraChoreography(elapsedTime, dt);

      // 8. Update Controls
      controls.update();

      // 9. Render via PostProcessor Suite
      postProcessor.renderScene(scene, camera);
    }

    animate();

    // =========================================================================
    // RESIZE LISTENER
    // =========================================================================
    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      postProcessor.setSize(w, h, CONFIG.dpr);
    });
  </script>
</body>
</html>
