<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Chicken Coop Physics Sandbox</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #c85a17;
    }
    #webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
      cursor: grab;
    }
    #webgl-canvas:active {
      cursor: grabbing;
    }
    .farm-hud {
      position: absolute;
      top: 20px;
      left: 20px;
      display: flex;
      gap: 12px;
      z-index: 100;
      pointer-events: none;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .hud-card {
      background: rgba(25, 20, 15, 0.68);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 24px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 7px;
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.3);
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .hud-card.pop {
      transform: scale(1.22);
    }
    .hud-icon {
      font-size: 18px;
    }

    /* Dedicated Left-Side Upgrades Shop */
    .upgrades-panel {
      position: absolute;
      top: 68px;
      left: 20px;
      width: 320px;
      z-index: 100;
      pointer-events: auto;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: rgba(22, 17, 13, 0.78);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 18px;
      padding: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
      color: #fff;
      max-height: calc(100vh - 85px);
      overflow-y: auto;
    }
    .upgrades-panel::-webkit-scrollbar {
      width: 4px;
    }
    .upgrades-panel::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }
    .upgrades-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding-bottom: 7px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .upgrades-title {
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #f6aa1c;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-reset-compact {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #94a3b8;
      border-radius: 12px;
      padding: 3px 8px;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
    }
    .btn-reset-compact:hover {
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(239, 68, 68, 0.4);
      color: #ef4444;
    }
    .upgrades-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    .upgrade-card {
      background: rgba(30, 24, 18, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 9px 11px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      position: relative;
      overflow: hidden;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .upgrade-card.purchased-anim {
      animation: purchasePulse 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes purchasePulse {
      0% { transform: scale(1); box-shadow: 0 0 0 rgba(245, 158, 11, 0); }
      40% { transform: scale(1.04); box-shadow: 0 0 24px rgba(245, 158, 11, 0.6); border-color: #f59e0b; }
      100% { transform: scale(1); box-shadow: 0 0 0 rgba(245, 158, 11, 0); }
    }
    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .card-info {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
    }
    .card-icon-badge {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
      transition: all 0.25s ease;
    }
    .card-titles {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .card-name {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-tier-tag {
      font-size: 11px;
      font-weight: 600;
      color: #f6aa1c;
      letter-spacing: 0.2px;
    }
    .card-desc {
      font-size: 11px;
      color: #cbd5e1;
      line-height: 1.25;
      padding: 1px 2px;
    }
    .card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 2px;
      padding-top: 4px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }
    .pips-container {
      display: flex;
      gap: 4px;
      align-items: center;
    }
    .level-pip {
      width: 14px;
      height: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.14);
      transition: all 0.25s ease;
    }
    .level-pip.active {
      background: #f59e0b;
      box-shadow: 0 0 6px rgba(245, 158, 11, 0.6);
    }
    .level-pip.unlocked-flash {
      animation: pipUnlock 0.5s ease;
    }
    @keyframes pipUnlock {
      0% { transform: scale(0.5); filter: brightness(3); }
      50% { transform: scale(1.6); filter: brightness(4); }
      100% { transform: scale(1); filter: brightness(1); }
    }
    .btn-buy-upgrade {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 12px;
      padding: 5px 11px;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 2px 8px rgba(217, 119, 6, 0.35);
      transition: all 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
      white-space: nowrap;
    }
    .btn-buy-upgrade:hover:not(:disabled) {
      transform: translateY(-1px) scale(1.03);
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.55);
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
    }
    .btn-buy-upgrade:active:not(:disabled) {
      transform: translateY(1px) scale(0.97);
    }
    .btn-buy-upgrade.locked {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.1);
      color: #94a3b8;
      box-shadow: none;
      cursor: not-allowed;
      opacity: 0.7;
    }
    .btn-buy-upgrade.max-tier {
      background: linear-gradient(135deg, #10b981, #059669);
      border-color: rgba(52, 211, 153, 0.5);
      color: #fff;
      cursor: default;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.35);
    }

    /* Unique Tier Themes */
    .tier-theme-0 .card-icon-badge {
      border-color: rgba(148, 163, 184, 0.25);
      color: #94a3b8;
    }
    .tier-theme-1 {
      border-color: rgba(205, 127, 50, 0.35);
    }
    .tier-theme-1 .card-icon-badge {
      border-color: rgba(205, 127, 50, 0.5);
      background: rgba(205, 127, 50, 0.15);
      box-shadow: 0 0 8px rgba(205, 127, 50, 0.2);
    }
    .tier-theme-1 .card-tier-tag { color: #d97706; }
    .tier-theme-1 .level-pip.active { background: #d97706; box-shadow: 0 0 6px rgba(217, 119, 6, 0.6); }

    .tier-theme-2 {
      border-color: rgba(203, 213, 225, 0.35);
    }
    .tier-theme-2 .card-icon-badge {
      border-color: rgba(203, 213, 225, 0.55);
      background: rgba(203, 213, 225, 0.15);
      box-shadow: 0 0 8px rgba(203, 213, 225, 0.25);
    }
    .tier-theme-2 .card-tier-tag { color: #e2e8f0; }
    .tier-theme-2 .level-pip.active { background: #cbd5e1; box-shadow: 0 0 6px rgba(203, 213, 225, 0.6); }

    .tier-theme-3 {
      border-color: rgba(245, 158, 11, 0.45);
    }
    .tier-theme-3 .card-icon-badge {
      border-color: rgba(245, 158, 11, 0.6);
      background: rgba(245, 158, 11, 0.18);
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.35);
    }
    .tier-theme-3 .card-tier-tag { color: #fbbf24; }
    .tier-theme-3 .level-pip.active { background: #f59e0b; box-shadow: 0 0 6px rgba(245, 158, 11, 0.7); }

    .tier-theme-4 {
      border-color: rgba(6, 182, 212, 0.5);
    }
    .tier-theme-4 .card-icon-badge {
      border-color: rgba(6, 182, 212, 0.65);
      background: rgba(6, 182, 212, 0.18);
      box-shadow: 0 0 12px rgba(6, 182, 212, 0.4);
    }
    .tier-theme-4 .card-tier-tag { color: #22d3ee; }
    .tier-theme-4 .level-pip.active { background: #06b6d4; box-shadow: 0 0 6px rgba(6, 182, 212, 0.8); }

    .tier-theme-5 {
      border-color: rgba(236, 72, 153, 0.55);
      background: linear-gradient(135deg, rgba(30, 24, 18, 0.75), rgba(236, 72, 153, 0.12));
      box-shadow: 0 0 16px rgba(234, 179, 8, 0.25);
    }
    .tier-theme-5 .card-icon-badge {
      border-color: rgba(234, 179, 8, 0.8);
      background: linear-gradient(135deg, rgba(236, 72, 153, 0.3), rgba(234, 179, 8, 0.3));
      box-shadow: 0 0 14px rgba(234, 179, 8, 0.5);
    }
    .tier-theme-5 .card-tier-tag { color: #f472b6; }
    .tier-theme-5 .level-pip.active { background: linear-gradient(90deg, #ec4899, #eab308); box-shadow: 0 0 8px rgba(234, 179, 8, 0.8); }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
    }
  }
  </script>
</head>
<body>
  <div id="farm-hud" class="farm-hud">
    <div class="hud-card" id="hud-card-eggs"><span class="hud-icon">🥚</span> <span id="hud-eggs">0</span></div>
    <div class="hud-card" id="hud-card-score"><span class="hud-icon">⭐</span> <span id="hud-score">0</span></div>
    <div class="hud-card" id="hud-card-fed"><span class="hud-icon">🌾</span> <span id="hud-fed">0</span></div>
  </div>

  <div id="upgrades-panel" class="upgrades-panel">
    <div class="upgrades-header">
      <span class="upgrades-title">🛒 Farm Upgrades</span>
      <button id="btn-reset-progress" class="btn-reset-compact" title="Reset All Progress">🔄 Reset</button>
    </div>
    <div class="upgrades-list">
      <div class="upgrade-card" id="card-hatchChicken"></div>
      <div class="upgrade-card" id="card-chickenBreed"></div>
      <div class="upgrade-card" id="card-goldenSeed"></div>
      <div class="upgrade-card" id="card-autoFeeder"></div>
      <div class="upgrade-card" id="card-eggAlchemy"></div>
      <div class="upgrade-card" id="card-eggMagnet"></div>
    </div>
  </div>
  <canvas id="webgl-canvas"></canvas>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import GUI from 'lil-gui';

    // =========================================================================
    // POST-PROCESSING SUITE (PostProcessor.js Pipeline)
    // =========================================================================
    const orthoVertexShader = `
    precision highp float;
    in vec3 position;
    out vec2 vUv;
    void main() {
      vUv = position.xy * 0.5 + 0.5;
      gl_Position = vec4(position, 1.0);
    }
    `;

    const brightFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float bloomThreshold;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float luminance = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float knee = 0.1;
      float soft = luminance - bloomThreshold + knee;
      soft = clamp(soft, 0.0, 2.0 * knee);
      soft = (soft * soft) / (4.0 * knee + 0.00001);
      float contribution = max(soft, luminance - bloomThreshold);
      contribution /= max(luminance, 0.00001);
      fragColor = vec4(color.rgb * contribution, color.a);
    }
    `;

    const blur13ShaderChunk = `
    vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
      vec2 resolution = vec2(textureSize(image, 0));
      vec4 color = vec4(0.0);
      vec2 off1 = vec2(1.411764705882353) * direction;
      vec2 off2 = vec2(3.2941176470588234) * direction;
      vec2 off3 = vec2(5.176470588235294) * direction;
      color += texture(image, uv) * 0.1964825501511404;
      color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
      color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
      return color;
    }
    `;

    const blurFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 direction;
    in vec2 vUv;
    out vec4 color;
    ${blur13ShaderChunk}
    void main() {
      color = blur13(inputTexture, vUv, direction);
    }
    `;

    const finalFragmentShader = `
    precision highp float;
    uniform vec2 resolution;
    uniform sampler2D inputTexture;
    uniform sampler2D blur0Texture;
    uniform sampler2D blur1Texture;
    uniform sampler2D blur2Texture;
    uniform sampler2D blur3Texture;
    uniform sampler2D blur4Texture;
    uniform bool bloomEnabled;
    uniform float bloomStrength;
    uniform float vignetteBoost;
    uniform float vignetteReduction;
    uniform float noiseIntensity;
    uniform float time;
    in vec2 vUv;
    out vec4 fragColor;

    float vignette(vec2 uv, float boost, float reduction) {
      vec2 position = vUv - 0.5;
      return boost - length(position) * reduction;
    }

    float hash1(uint n) {
      n = (n << 13U) ^ n;
      n = n * (n * n * 15731U + 789221U) + 1376312589U;
      return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
    }

    float noise(in vec2 uv, in float timeVal) {
      uvec2 p = uvec2(uv);
      return hash1(p.x + 1920U * p.y + (1920U * 1080U) * uint(timeVal));
    }

    void main() {
      vec4 color = texture(inputTexture, vUv);

      if (bloomEnabled && bloomStrength > 0.001) {
        vec4 b0 = texture(blur0Texture, vUv);
        vec4 b1 = texture(blur1Texture, vUv);
        vec4 b2 = texture(blur2Texture, vUv);
        vec4 b3 = texture(blur3Texture, vUv);
        vec4 b4 = texture(blur4Texture, vUv);

        vec4 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
        color += bloomSum * bloomStrength;
      }

      color.rgb *= vignette(vUv, vignetteBoost, vignetteReduction);
      color.rgb += noiseIntensity * noise(gl_FragCoord.xy, time);
      fragColor = vec4(color.rgb, 1.0);
    }
    `;

    const chromaticAberrationShaderChunk = `
    vec2 barrelDistortion(vec2 coord, float amt) {
      vec2 cc = coord - 0.5;
      float dist = dot(cc, cc);
      return coord + cc * dist * amt;
    }
    float sat(float t) { return clamp(t, 0.0, 1.0); }
    float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
    float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
    vec4 spectrum_offset(float t) {
      float lo = step(t, 0.5);
      float hi = 1.0 - lo;
      float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
      vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
      return pow(ret, vec4(1.0 / 2.2));
    }
    const float max_distort = 2.2;
    const int num_iter = 8;
    const float reci_num_iter_f = 1.0 / float(num_iter);
    vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
      vec4 sumcol = vec4(0.0);
      vec4 sumw = vec4(0.0);
      for (int i = 0; i < num_iter; ++i) {
        float t = float(i) * reci_num_iter_f;
        vec4 w = spectrum_offset(t);
        sumw += w;
        sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
      }
      return sumcol / sumw;
    }
    `;

    const colorFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float chromaticAberrationAmount;
    uniform float minInputLevel;
    uniform float maxInputLevel;
    uniform float gammaLevel;
    uniform float fisheyeStrength;
    uniform float fisheyeRadius;
    uniform float time;
    in vec2 vUv;
    out vec4 fragColor;

    ${chromaticAberrationShaderChunk}

    vec2 applyFisheye(vec2 uv, float strength, float radius) {
      if (abs(strength) < 0.0001) return uv;
      vec2 p = uv - 0.5;
      float d = length(p);
      if (d > radius * 1.5) return uv;
      float r = d / max(radius, 0.001);
      float theta = atan(p.y, p.x);
      float rDist = r + strength * (r * r * r);
      return 0.5 + vec2(cos(theta), sin(theta)) * (rDist * radius);
    }

    vec3 gammaCorrect(vec3 color, vec3 gamma) {
      return pow(max(color, vec3(0.0)), 1.0 / gamma);
    }
    vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
      return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
    }
    vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
      return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
    }
    void main() {
      vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
      fragColor = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
      fragColor.rgb = finalLevels(fragColor.rgb, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
      fragColor.a = 1.0;
    }
    `;

    const copyFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      fragColor = texture(inputTexture, vUv);
    }
    `;

    function createFBO(w, h, options = {}) {
      return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
        wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
        wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
        minFilter: options.minFilter || THREE.LinearFilter,
        magFilter: options.magFilter || THREE.LinearFilter,
        format: options.format || THREE.RGBAFormat,
        type: options.type || THREE.HalfFloatType,
        stencilBuffer: options.stencilBuffer || false,
        depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : true,
        samples: options.samples || 0,
      });
    }

    class ShaderPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbo = createFBO(1, 1, options);
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
        this.texture = this.fbo.texture;
      }
      render(renderer, toScreen = false) {
        if (!toScreen) renderer.setRenderTarget(this.fbo);
        renderer.render(this.orthoScene, this.orthoCamera);
        if (!toScreen) renderer.setRenderTarget(null);
      }
      setSize(width, height) {
        this.fbo.setSize(Math.max(1, width), Math.max(1, height));
        this.orthoQuad.scale.set(width, height, 1);
      }
    }

    class ShaderPingPongPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
        this.currentFBO = 0;
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
      }
      render(renderer) {
        renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
        renderer.render(this.orthoScene, this.orthoCamera);
        renderer.setRenderTarget(null);
        this.currentFBO = 1 - this.currentFBO;
      }
      get current() { return this.fbos[this.currentFBO]; }
      get texture() { return this.current.texture; }
      setSize(width, height) {
        const w = Math.max(1, width);
        const h = Math.max(1, height);
        this.orthoQuad.scale.set(w, h, 1);
        this.fbos[0].setSize(w, h);
        this.fbos[1].setSize(w, h);
      }
    }

    class BloomPass {
      constructor(strength = 1.25, radius = 0.9, threshold = 0.2, levels = 5) {
        this.strength = strength;
        this.radius = radius;
        this.threshold = threshold;
        this.enabled = true;
        this.levels = levels;

        this.brightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            bloomThreshold: { value: this.threshold },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: brightFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.brightPass = new ShaderPass(this.brightShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.blurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            direction: { value: new THREE.Vector2(0, 1) },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: blurFragmentShader,
          glslVersion: THREE.GLSL3,
        });

        this.blurPasses = [];
        for (let i = 0; i < this.levels; i++) {
          this.blurPasses.push(new ShaderPingPongPass(this.blurShader, {
            format: THREE.RGBAFormat,
            type: THREE.HalfFloatType,
          }));
        }
      }

      setSize(w, h) {
        let tw = Math.max(1, w);
        let th = Math.max(1, h);
        this.brightPass.setSize(tw, th);
        for (let i = 0; i < this.levels; i++) {
          tw = Math.max(1, Math.round(tw / 2));
          th = Math.max(1, Math.round(th / 2));
          this.blurPasses[i].setSize(tw, th);
        }
      }

      set source(texture) {
        this.brightShader.uniforms.inputTexture.value = texture;
      }

      render(renderer) {
        if (!this.enabled || this.strength <= 0.001) return;
        this.brightShader.uniforms.bloomThreshold.value = this.threshold;
        this.brightPass.render(renderer);

        const baseOffset = Math.max(0.1, this.radius * 2.0);
        const u = this.blurShader.uniforms;

        for (let j = 0; j < this.levels; j++) {
          const blurPass = this.blurPasses[j];
          const stepOffset = baseOffset * (1.0 + j * 0.5);

          u.direction.value.set(stepOffset, 0);
          u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
          blurPass.render(renderer);

          u.direction.value.set(0, stepOffset * 0.5);
          u.inputTexture.value = blurPass.current.texture;
          blurPass.render(renderer);
        }
      }
    }

    class PostProcessor {
      constructor(renderer, params = {}) {
        this.renderer = renderer;
        this.settings = {
          enabled: params.enabled !== undefined ? params.enabled : true,
          bloomEnabled: params.bloomEnabled !== undefined ? params.bloomEnabled : true,
          bloomStrength: params.bloomStrength !== undefined ? params.bloomStrength : 1.25,
          bloomRadius: params.bloomRadius !== undefined ? params.bloomRadius : 0.9,
          bloomThreshold: params.bloomThreshold !== undefined ? params.bloomThreshold : 0.2,
          fisheyeStrength: params.fisheyeStrength !== undefined ? params.fisheyeStrength : -0.13,
          fisheyeRadius: params.fisheyeRadius !== undefined ? params.fisheyeRadius : 1.0,
          chromaticAberration: params.chromaticAberration !== undefined ? params.chromaticAberration : 0.034,
          vignetteBoost: params.vignetteBoost !== undefined ? params.vignetteBoost : 1.0,
          vignetteReduction: params.vignetteReduction !== undefined ? params.vignetteReduction : 0.25,
          noiseIntensity: params.noiseIntensity !== undefined ? params.noiseIntensity : 0.03,
          gamma: params.gamma !== undefined ? params.gamma : 1.2,
          minInputLevel: params.minInputLevel !== undefined ? params.minInputLevel : 0.0,
          maxInputLevel: params.maxInputLevel !== undefined ? params.maxInputLevel : 1.0,
        };

        this.sceneTarget = createFBO(1, 1, { type: THREE.HalfFloatType });
        this.bloomPass = new BloomPass(
          this.settings.bloomStrength,
          this.settings.bloomRadius,
          this.settings.bloomThreshold,
          5
        );

        this.finalShader = new THREE.RawShaderMaterial({
          uniforms: {
            resolution: { value: new THREE.Vector2(1, 1) },
            bloomEnabled: { value: this.settings.bloomEnabled },
            bloomStrength: { value: this.settings.bloomStrength },
            vignetteBoost: { value: this.settings.vignetteBoost },
            vignetteReduction: { value: this.settings.vignetteReduction },
            noiseIntensity: { value: this.settings.noiseIntensity },
            inputTexture: { value: null },
            blur0Texture: { value: null },
            blur1Texture: { value: null },
            blur2Texture: { value: null },
            blur3Texture: { value: null },
            blur4Texture: { value: null },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: finalFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.finalPass = new ShaderPass(this.finalShader);

        this.rgbShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: this.finalPass.texture },
            fisheyeStrength: { value: this.settings.fisheyeStrength },
            fisheyeRadius: { value: this.settings.fisheyeRadius },
            chromaticAberrationAmount: { value: this.settings.chromaticAberration },
            minInputLevel: { value: this.settings.minInputLevel },
            maxInputLevel: { value: this.settings.maxInputLevel },
            gammaLevel: { value: this.settings.gamma },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: colorFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.rgbPass = new ShaderPass(this.rgbShader);

        this.copyShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: copyFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.copyPass = new ShaderPass(this.copyShader);
        this.updateSettings();
      }

      updateSettings() {
        this.bloomPass.enabled = this.settings.bloomEnabled;
        this.bloomPass.strength = this.settings.bloomStrength;
        this.bloomPass.radius = this.settings.bloomRadius;
        this.bloomPass.threshold = this.settings.bloomThreshold;

        this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
        this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
        this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
        this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
        this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;

        this.rgbShader.uniforms.fisheyeStrength.value = this.settings.fisheyeStrength;
        this.rgbShader.uniforms.fisheyeRadius.value = this.settings.fisheyeRadius;
        this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
        this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
        this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
        this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
      }

      setSize(w0, h0, dpr = 1) {
        const w = Math.max(1, Math.floor(w0 * dpr));
        const h = Math.max(1, Math.floor(h0 * dpr));
        this.sceneTarget.setSize(w, h);
        this.finalPass.setSize(w, h);
        this.finalShader.uniforms.resolution.value.set(w, h);
        this.bloomPass.setSize(w, h);
        this.rgbPass.setSize(w, h);
        this.copyPass.setSize(w, h);
      }

      renderScene(scene, camera) {
        if (!this.settings.enabled) {
          this.renderer.render(scene, camera);
          return;
        }
        this.renderer.setRenderTarget(this.sceneTarget);
        this.renderer.render(scene, camera);
        this.renderer.setRenderTarget(null);
        this.render(this.sceneTarget.texture);
      }

      render(sourceTexture) {
        if (!this.settings.enabled) {
          this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
          this.copyPass.render(this.renderer, true);
          return;
        }
        this.updateSettings();
        this.bloomPass.source = sourceTexture;
        this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
        this.bloomPass.render(this.renderer);

        this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
        this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
        this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
        this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
        this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

        const randomTime = Math.random() * 100000;
        this.finalPass.shader.uniforms.time.value = randomTime;
        this.rgbPass.shader.uniforms.time.value = randomTime;

        this.finalPass.render(this.renderer);
        this.rgbPass.render(this.renderer, true);
      }

      attachGUI(gui, title = "Post-Processing") {
        const root = gui.addFolder(title);
        root.add(this.settings, "enabled").name("Enable Effects");

        const bloom = root.addFolder("Bloom");
        bloom.add(this.settings, "bloomEnabled").name("Bloom Active").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomStrength", 0, 2.5, 0.05).name("Strength").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomRadius", 0, 1.5, 0.05).name("Radius").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomThreshold", 0, 1.0, 0.01).name("Threshold").onChange(() => this.updateSettings());

        const lens = root.addFolder("Lens & Camera");
        lens.add(this.settings, "fisheyeStrength", -0.8, 1.0, 0.01).name("Fisheye").onChange(() => this.updateSettings());
        lens.add(this.settings, "chromaticAberration", 0, 0.1, 0.002).name("Chromatic Aberration").onChange(() => this.updateSettings());
        lens.add(this.settings, "vignetteBoost", 0.5, 1.8, 0.05).name("Vignette Center").onChange(() => this.updateSettings());
        lens.add(this.settings, "vignetteReduction", 0, 1.5, 0.05).name("Vignette Edge").onChange(() => this.updateSettings());
        lens.add(this.settings, "noiseIntensity", 0, 0.08, 0.002).name("Film Grain").onChange(() => this.updateSettings());
        lens.add(this.settings, "gamma", 0.4, 2.2, 0.05).name("Gamma").onChange(() => this.updateSettings());
        return root;
      }
    }

    function createWheatThatchTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      // Light warm wheat base so color scheme tints multiply cleanly and vibrantly
      ctx.fillStyle = '#fff4db';
      ctx.fillRect(0, 0, 512, 512);

      // Layered horizontal thatch rows
      const rowH = 32;
      const rows = 512 / rowH;

      for (let r = 0; r < rows; r++) {
        const y = r * rowH;

        // Shadow under thatch row
        ctx.fillStyle = 'rgba(120, 80, 25, 0.35)';
        ctx.fillRect(0, y, 512, 3);

        // Sunlit tier highlight
        ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.fillRect(0, y + 3, 512, 3);

        // Fine wheat straw stalks
        const count = 48;
        for (let i = 0; i < count; i++) {
          const x = (i / count) * 512 + ((r * 13 + i * 7) % 9) - 4;
          const w = 4 + (i % 3) * 2;
          const h = rowH + ((i * 17 + r * 5) % 11) - 5;

          const tones = [
            'rgba(255, 230, 150, 0.75)',
            'rgba(235, 195, 110, 0.65)',
            'rgba(215, 170, 85, 0.55)',
            'rgba(255, 245, 190, 0.85)',
            'rgba(190, 145, 60, 0.45)'
          ];
          ctx.fillStyle = tones[(i + r * 3) % tones.length];

          // Straw blade
          ctx.beginPath();
          ctx.moveTo(x - w * 0.5, y + 3);
          ctx.lineTo(x + w * 0.5, y + 3);
          ctx.lineTo(x + w * 0.25, y + h);
          ctx.lineTo(x - w * 0.25, y + h);
          ctx.closePath();
          ctx.fill();

          // Delicate fiber stroke
          ctx.strokeStyle = 'rgba(100, 60, 15, 0.2)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(x, y + 3);
          ctx.lineTo(x + (i % 2 === 0 ? 1 : -1), y + h);
          ctx.stroke();
        }
      }

      // Subtle diagonal woven straw cross-lines
      ctx.strokeStyle = 'rgba(140, 90, 30, 0.12)';
      ctx.lineWidth = 1.2;
      for (let d = -512; d < 1024; d += 28) {
        ctx.beginPath();
        ctx.moveTo(d, 0);
        ctx.lineTo(d + 512, 512);
        ctx.stroke();
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(3, 3);
      return tex;

    // 8. STYLIZED LOW-POLY 3D GRASS CLUMPS WITH WILDFLOWERS
    function createGrassClump(x, z, scale = 1.0, withFlower = false) {
      const clump = new THREE.Group();
      clump.position.set(x, 0, z);
      clump.scale.set(scale, scale, scale);

      const bladeCount = 4 + Math.floor(Math.random() * 3);
      for (let i = 0; i < bladeCount; i++) {
        const bladeAngle = (i / bladeCount) * Math.PI * 2 + (Math.random() - 0.5) * 0.4;
        const bladeHeight = 0.8 + Math.random() * 0.6;
        const bladeTilt = 0.15 + Math.random() * 0.25;

        const bladeGeo = new THREE.ConeGeometry(0.08, bladeHeight, 3);
        bladeGeo.translate(0, bladeHeight * 0.5, 0);
        const blade = new THREE.Mesh(bladeGeo, grassMaterial);
        blade.position.set(Math.cos(bladeAngle) * 0.12, 0, Math.sin(bladeAngle) * 0.12);
        blade.rotation.y = bladeAngle;
        blade.rotation.x = bladeTilt;
        blade.castShadow = true;
        clump.add(blade);
      }

      if (withFlower) {
        const flowerMat = [flowerRedMat, flowerYellowMat, flowerWhiteMat][Math.floor(Math.random() * 3)];
        const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 1.1, 3), grassMaterial);
        stem.position.y = 0.55;
        clump.add(stem);

        const blossom = new THREE.Mesh(new THREE.DodecahedronGeometry(0.14, 0), flowerMat);
        blossom.position.y = 1.1;
        blossom.scale.set(1.2, 0.7, 1.2);
        blossom.castShadow = true;
        clump.add(blossom);
      }

      clump.userData = {
        baseRotZ: (Math.random() - 0.5) * 0.1,
        phase: Math.random() * Math.PI * 2,
        swaySpeed: 1.8 + Math.random() * 1.2
      };

      barnyardGroup.add(clump);
      return clump;
    }

    class CrumbParticle {
      constructor() {
        const geo = new THREE.DodecahedronGeometry(0.065, 0);
        this.mesh = new THREE.Mesh(geo, feedMaterial);
        this.mesh.visible = false;
        scene.add(this.mesh);
        this.velocity = new THREE.Vector3();
        this.active = false;
        this.life = 0;
        this.maxLife = 0.65;
      }

      spawn(pos) {
        this.mesh.position.copy(pos);
        const angle = Math.random() * Math.PI * 2;
        const speed = 1.2 + Math.random() * 2.2;
        this.velocity.set(
          Math.cos(angle) * speed,
          2.6 + Math.random() * 2.6,
          Math.sin(angle) * speed
        );
        this.life = this.maxLife;
        this.active = true;
        this.mesh.visible = true;
        this.mesh.scale.set(1, 1, 1);
      }

      update(dt) {
        if (!this.active) return;
        this.life -= dt * CONFIG.animationSpeed;
        if (this.life <= 0) {
          this.active = false;
          this.mesh.visible = false;
          return;
        }
        this.velocity.y -= 22.0 * dt * CONFIG.animationSpeed;
        this.mesh.position.addScaledVector(this.velocity, dt * CONFIG.animationSpeed);

        if (this.mesh.position.y <= 0.04) {
          this.mesh.position.y = 0.04;
          this.velocity.y = -this.velocity.y * 0.4;
          this.velocity.x *= 0.6;
          this.velocity.z *= 0.6;
        }
        const s = Math.max(0.1, this.life / this.maxLife);
        this.mesh.scale.set(s, s, s);
      }
    }

    function playSound(type) {
      if (!CONFIG.soundEnabled) return;
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;

        if (type === 'peck') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(320 + Math.random() * 80, now);
          osc.frequency.exponentialRampToValueAtTime(110, now + 0.04);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.045);
        } else if (type === 'eggPop') {
          [523.25, 659.25, 783.99].forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            const t = now + idx * 0.06;
            osc.frequency.setValueAtTime(freq, t);
            gain.gain.setValueAtTime(0.2, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(t);
            osc.stop(t + 0.2);
          });
        } else if (type === 'collect') {
          [784, 1046.5, 1318.5, 1568].forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            const t = now + idx * 0.05;
            osc.frequency.setValueAtTime(freq, t);
            gain.gain.setValueAtTime(0.22, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(t);
            osc.stop(t + 0.28);
          });
        } else if (type === 'toss') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(180, now);
          osc.frequency.exponentialRampToValueAtTime(560, now + 0.08);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.09);
        } else if (type === 'boing') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(260, now);
          osc.frequency.linearRampToValueAtTime(580, now + 0.12);
          osc.frequency.exponentialRampToValueAtTime(220, now + 0.28);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.32);
        }
      } catch (err) {}
    }

    // =========================================================================
    // PROCEDURAL LO-FI CHILLHOP MUSIC SYNTHESIZER
    // =========================================================================
    class LofiMusicEngine {
      constructor() {
        this.isPlaying = false;
        this.masterGain = null;
        this.warmFilter = null;
        this.vinylNode = null;
        this.timer = null;
        this.bpm = 72;
        this.beatDuration = 60 / this.bpm; // ~0.8333s
        this.barDuration = this.beatDuration * 4; // ~3.3333s
        this.currentBar = 0;
        this.nextBarTime = 0;

        // Chords (4-bar progression in key of C major / D minor)
        // 1. Dm9: D3, F3, A3, C4, E4
        // 2. G13: G2, F3, B3, E4, A4
        // 3. Cmaj9: C3, E3, G3, B3, D4
        // 4. Am7: A2, G3, C4, E4, G4
        this.progression = [
          { bass: 73.42, chord: [146.83, 174.61, 220.00, 261.63, 329.63] },
          { bass: 49.00, chord: [98.00, 174.61, 246.94, 329.63, 440.00] },
          { bass: 65.41, chord: [130.81, 164.81, 196.00, 246.94, 293.66] },
          { bass: 55.00, chord: [110.00, 196.00, 261.63, 329.63, 392.00] }
        ];
      }

      initNodes() {
        const ctx = getAudioContext();
        if (!ctx) return;
        if (!this.masterGain) {
          this.masterGain = ctx.createGain();
          this.masterGain.gain.setValueAtTime(CONFIG.musicEnabled ? CONFIG.musicVolume : 0, ctx.currentTime);
          this.masterGain.connect(ctx.destination);

          // Lo-fi lowpass master filter for warmth
          this.warmFilter = ctx.createBiquadFilter();
          this.warmFilter.type = 'lowpass';
          this.warmFilter.frequency.setValueAtTime(1450, ctx.currentTime);
          this.warmFilter.connect(this.masterGain);

          // Subtle vinyl crackle generator
          this.startVinylCrackle(ctx);
        }
      }

      startVinylCrackle(ctx) {
        const bufferSize = ctx.sampleRate * 2;
        const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          const white = Math.random() * 2 - 1;
          const pop = Math.random() < 0.0015 ? (Math.random() * 2 - 1) * 3 : 0;
          output[i] = (white * 0.15 + pop) * 0.1;
        }

        const whiteNoise = ctx.createBufferSource();
        whiteNoise.buffer = noiseBuffer;
        whiteNoise.loop = true;

        const filter = ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(900, ctx.currentTime);
        filter.Q.setValueAtTime(1.2, ctx.currentTime);

        const vGain = ctx.createGain();
        vGain.gain.setValueAtTime(0.04, ctx.currentTime);

        whiteNoise.connect(filter);
        filter.connect(vGain);
        vGain.connect(this.masterGain);
        whiteNoise.start();
        this.vinylNode = whiteNoise;
      }

      playRhodesChord(ctx, freqs, time, duration) {
        freqs.forEach((freq, idx) => {
          const osc1 = ctx.createOscillator();
          const osc2 = ctx.createOscillator();
          const gain = ctx.createGain();
          const noteFilter = ctx.createBiquadFilter();

          osc1.type = 'triangle';
          osc2.type = 'sine';

          osc1.frequency.setValueAtTime(freq, time);
          osc2.frequency.setValueAtTime(freq * 1.002, time);

          noteFilter.type = 'lowpass';
          noteFilter.frequency.setValueAtTime(950 + idx * 80, time);
          noteFilter.frequency.exponentialRampToValueAtTime(320, time + duration);

          const strum = time + idx * 0.025;
          gain.gain.setValueAtTime(0.0001, strum);
          gain.gain.linearRampToValueAtTime(0.09 / Math.sqrt(freqs.length), strum + 0.05);
          gain.gain.exponentialRampToValueAtTime(0.03, strum + 1.2);
          gain.gain.exponentialRampToValueAtTime(0.0001, strum + duration);

          osc1.connect(noteFilter);
          osc2.connect(noteFilter);
          noteFilter.connect(gain);
          gain.connect(this.warmFilter);

          osc1.start(strum);
          osc2.start(strum);
          osc1.stop(strum + duration + 0.1);
          osc2.stop(strum + duration + 0.1);
        });
      }

      playBassNote(ctx, freq, time, duration) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const bFilter = ctx.createBiquadFilter();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, time);

        bFilter.type = 'lowpass';
        bFilter.frequency.setValueAtTime(160, time);

        gain.gain.setValueAtTime(0.0001, time);
        gain.gain.linearRampToValueAtTime(0.24, time + 0.06);
        gain.gain.exponentialRampToValueAtTime(0.08, time + duration * 0.7);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + duration);

        osc.connect(bFilter);
        bFilter.connect(gain);
        gain.connect(this.warmFilter);

        osc.start(time);
        osc.stop(time + duration + 0.05);
      }

      playDrumHit(ctx, type, time) {
        if (type === 'kick') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(115, time);
          osc.frequency.exponentialRampToValueAtTime(42, time + 0.11);
          gain.gain.setValueAtTime(0.26, time);
          gain.gain.exponentialRampToValueAtTime(0.001, time + 0.13);
          osc.connect(gain);
          gain.connect(this.warmFilter);
          osc.start(time);
          osc.stop(time + 0.14);
        } else if (type === 'snare') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(210, time);
          osc.frequency.exponentialRampToValueAtTime(90, time + 0.07);
          gain.gain.setValueAtTime(0.12, time);
          gain.gain.exponentialRampToValueAtTime(0.001, time + 0.08);
          osc.connect(gain);
          gain.connect(this.warmFilter);
          osc.start(time);
          osc.stop(time + 0.09);

          const noiseBuffer = ctx.createBuffer(1, ctx.sampleRate * 0.06, ctx.sampleRate);
          const out = noiseBuffer.getChannelData(0);
          for (let i = 0; i < out.length; i++) out[i] = (Math.random() * 2 - 1) * 0.08;
          const noise = ctx.createBufferSource();
          noise.buffer = noiseBuffer;
          const nFilter = ctx.createBiquadFilter();
          nFilter.type = 'bandpass';
          nFilter.frequency.setValueAtTime(1800, time);
          const nGain = ctx.createGain();
          nGain.gain.setValueAtTime(0.14, time);
          nGain.gain.exponentialRampToValueAtTime(0.001, time + 0.06);
          noise.connect(nFilter);
          nFilter.connect(nGain);
          nGain.connect(this.warmFilter);
          noise.start(time);
        } else if (type === 'hihat') {
          const noiseBuffer = ctx.createBuffer(1, ctx.sampleRate * 0.035, ctx.sampleRate);
          const out = noiseBuffer.getChannelData(0);
          for (let i = 0; i < out.length; i++) out[i] = (Math.random() * 2 - 1) * 0.05;
          const noise = ctx.createBufferSource();
          noise.buffer = noiseBuffer;
          const nFilter = ctx.createBiquadFilter();
          nFilter.type = 'highpass';
          nFilter.frequency.setValueAtTime(6500, time);
          const nGain = ctx.createGain();
          nGain.gain.setValueAtTime(0.065, time);
          nGain.gain.exponentialRampToValueAtTime(0.001, time + 0.035);
          noise.connect(nFilter);
          nFilter.connect(nGain);
          nGain.connect(this.warmFilter);
          noise.start(time);
        }
      }

      scheduleBar(ctx, barIndex, startTime) {
        const barData = this.progression[barIndex % this.progression.length];
        const beat = this.beatDuration;

        this.playRhodesChord(ctx, barData.chord, startTime, this.barDuration * 0.92);
        this.playBassNote(ctx, barData.bass, startTime, beat * 1.5);
        this.playBassNote(ctx, barData.bass * (barIndex % 2 === 1 ? 1.122 : 1), startTime + beat * 2.5, beat * 1.2);

        this.playDrumHit(ctx, 'kick', startTime);
        this.playDrumHit(ctx, 'kick', startTime + beat * 2.5);
        this.playDrumHit(ctx, 'snare', startTime + beat);
        this.playDrumHit(ctx, 'snare', startTime + beat * 3);

        for (let i = 0; i < 8; i++) {
          const swing = (i % 2 === 1) ? 0.035 : 0;
          this.playDrumHit(ctx, 'hihat', startTime + i * (beat * 0.5) + swing);
        }
      }

      start() {
        if (this.isPlaying) return;
        this.initNodes();
        const ctx = getAudioContext();
        if (!ctx) return;
        this.isPlaying = true;
        this.nextBarTime = ctx.currentTime + 0.05;
        this.currentBar = 0;

        const loop = () => {
          if (!this.isPlaying) return;
          const now = ctx.currentTime;
          while (this.nextBarTime < now + 0.3) {
            this.scheduleBar(ctx, this.currentBar, this.nextBarTime);
            this.currentBar++;
            this.nextBarTime += this.barDuration;
          }
          this.timer = setTimeout(loop, 100);
        };
        loop();
      }

      stop() {
        this.isPlaying = false;
        if (this.timer) clearTimeout(this.timer);
      }

      setVolume(val) {
        CONFIG.musicVolume = val;
        if (this.masterGain) {
          const ctx = getAudioContext();
          if (ctx) {
            this.masterGain.gain.setTargetAtTime(CONFIG.musicEnabled ? val : 0, ctx.currentTime, 0.05);
          }
        }
      }

      toggle(enabled) {
        CONFIG.musicEnabled = enabled;
        if (enabled) {
          if (!this.isPlaying) this.start();
          this.setVolume(CONFIG.musicVolume);
        } else {
          if (this.masterGain) {
            const ctx = getAudioContext();
            if (ctx) {
              this.masterGain.gain.setTargetAtTime(0, ctx.currentTime, 0.05);
            }
          }
        }
      }
    }

          upgrades: CONFIG.upgrades
        };

      } catch (e) {}
    }

    function loadProgress() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const data = JSON.parse(raw);
          if (typeof data.score === 'number') CONFIG.score = data.score;
          if (typeof data.eggsCollected === 'number') CONFIG.eggsCollected = data.eggsCollected;
          if (typeof data.chickensFed === 'number') CONFIG.chickensFed = data.chickensFed;
          if (typeof data.chickenCount === 'number') CONFIG.chickenCount = Math.max(1, Math.min(30, data.chickenCount));
          if (data.upgrades) {
            Object.assign(CONFIG.upgrades, data.upgrades);
          }
        }

      const cost = spec.costs[curLvl];
      if (CONFIG.score < cost) {

        }
        return;
      }

      CONFIG.score -= cost;
      CONFIG.upgrades[key]++;
      saveProgress();
      updateHUD('hud-card-score');

        newPip.classList.add('unlocked-flash');

      const texture = new THREE.CanvasTexture(canvas);

      activePopups.push({

    function spawnEgg(pos, isGolden = false) {
      const mesh = new THREE.Mesh(eggGeo, isGolden ? goldenEggMat : normalEggMat);
      mesh.position.copy(pos);
      mesh.position.y = 0.5;
      mesh.rotation.x = 0.2 + (Math.random() - 0.5) * 0.3;
      mesh.rotation.z = 0.3 + (Math.random() - 0.5) * 0.3;
      mesh.castShadow = true;
      mesh.receiveShadow = true;

      const eggObj = {
        mesh,
        isGolden,
        active: true,
        velY: 1.6,
        wobble: Math.random() * Math.PI * 2,
        collect: function() {
          if (!this.active) return;
          this.active = false;
          scene.remove(this.mesh);
          const idx = activeEggs.indexOf(this);
          if (idx !== -1) activeEggs.splice(idx, 1);
          const dIdx = draggableObjects.indexOf(this.mesh);
          if (dIdx !== -1) draggableObjects.splice(dIdx, 1);

          const pts = this.isGolden ? 500 : 100;
          CONFIG.score += pts;

          playSound('collect');
