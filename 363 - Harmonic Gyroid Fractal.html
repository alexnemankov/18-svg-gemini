<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>363 - Procedural Harmonic Gyroid Fractal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      user-select: none;
      -webkit-user-select: none;
    }
    #canv {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
      cursor: grab;
    }
    #canv.grabbing {
      cursor: grabbing;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
      }
    }
  </script>
</head>
<body>
  <canvas id="canv"></canvas>

  <script type="module">
    import * as THREE from 'three';
    import GUI from 'lil-gui';

    // =========================================================================================
    // POST PROCESSOR SUITE (Inlined from postprocessing/PostProcessor.js for Standalone Execution)
    // =========================================================================================
    const orthoVertexShader = `
    precision highp float;
    in vec3 position;
    out vec2 vUv;
    void main() {
      vUv = position.xy * 0.5 + 0.5;
      gl_Position = vec4(position, 1.0);
    }
    `;

    const brightFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float bloomThreshold;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float luminance = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float knee = 0.1;
      float soft = luminance - bloomThreshold + knee;
      soft = clamp(soft, 0.0, 2.0 * knee);
      soft = (soft * soft) / (4.0 * knee + 0.00001);
      float contribution = max(soft, luminance - bloomThreshold);
      contribution /= max(luminance, 0.00001);
      fragColor = vec4(color.rgb * contribution, color.a);
    }
    `;

    const blur13ShaderChunk = `
    vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
      vec2 resolution = vec2(textureSize(image, 0));
      vec4 color = vec4(0.0);
      vec2 off1 = vec2(1.411764705882353) * direction;
      vec2 off2 = vec2(3.2941176470588234) * direction;
      vec2 off3 = vec2(5.176470588235294) * direction;
      color += texture(image, uv) * 0.1964825501511404;
      color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
      color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
      return color;
    }
    `;

    const blurFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 direction;
    in vec2 vUv;
    out vec4 color;
    ${blur13ShaderChunk}
    void main() {
      color = blur13(inputTexture, vUv, direction);
    }
    `;

    const godRaysDepthMaskShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float threshold;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float lum = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float factor = smoothstep(threshold, threshold + 0.15, lum);
      fragColor = vec4(vec3(factor), 1.0);
    }
    `;

    const godRaysGenerateShader = `
    precision highp float;
    #define TAPS_PER_PASS 6.0

    uniform sampler2D inputTexture;
    uniform vec3 vSunPositionScreenSpace;
    uniform float fStepSize;
    uniform float distanceAttenuation;
    uniform float maxDensity;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec2 delta = vSunPositionScreenSpace.xy - vUv;
      float dist = length(delta);
      vec2 stepv = fStepSize * delta / max(dist, 0.0001);
      float iters = dist / max(fStepSize, 0.00001);

      vec2 uv = vUv;
      float col = 0.0;
      float f = min(1.0, max(vSunPositionScreenSpace.z, 0.0));

      float atten = 1.0 / (1.0 + pow(dist, distanceAttenuation));

      if (0.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (1.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (2.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (3.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (4.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (5.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;

      float finalVal = min(col / TAPS_PER_PASS * atten, maxDensity);
      fragColor = vec4(vec3(finalVal), 1.0);
    }
    `;

    const anamorphicBrightShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float threshold;
    uniform float smoothWidth;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float v = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float alpha = smoothstep(threshold, threshold + smoothWidth, v);
      fragColor = mix(vec4(0.0), color, alpha);
    }
    `;

    const anamorphicBlurShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 resolution;
    uniform float samples;
    uniform float intensity;
    uniform vec3 tintColor;
    uniform float bloomRadius;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      int halfSamples = max(1, int(samples) / 2);
      float fHalfSamples = float(halfSamples);
      vec2 invSize = 1.0 / resolution;
      vec4 total = vec4(0.0);

      for (int i = -64; i <= 64; i++) {
        if (i < -halfSamples || i > halfSamples) continue;
        float softness = 1.0 - abs(float(i)) / fHalfSamples;
        softness = pow(softness, 2.0);
        vec2 shiftedUV = vec2(vUv.x + invSize.x * float(i) * (4.0 + bloomRadius * 8.0), vUv.y);
        shiftedUV = clamp(shiftedUV, 0.001, 0.999);
        total += texture(inputTexture, shiftedUV) * softness;
      }

      fragColor = (total / (samples / 3.0)) * vec4(tintColor, 1.0) * intensity;
    }
    `;

    const finalFragmentShader = `
    precision highp float;
    uniform vec2 resolution;
    uniform sampler2D inputTexture;
    uniform sampler2D blur0Texture;
    uniform sampler2D blur1Texture;
    uniform sampler2D blur2Texture;
    uniform sampler2D blur3Texture;
    uniform sampler2D blur4Texture;
    uniform sampler2D raysTexture;
    uniform sampler2D anamorphicTexture;
    uniform bool bloomEnabled;
    uniform float bloomStrength;
    uniform bool raysEnabled;
    uniform float raysStrength;
    uniform vec3 raysColor;
    uniform bool anamorphicEnabled;
    uniform float vignetteBoost;
    uniform float vignetteReduction;
    uniform float noiseIntensity;
    uniform float time;
    in vec2 vUv;
    out vec4 fragColor;

    float vignette(vec2 uv, float boost, float reduction) {
      vec2 position = vUv - 0.5;
      return boost - length(position) * reduction;
    }

    float hash1(uint n) {
      n = (n << 13U) ^ n;
      n = n * (n * n * 15731U + 789221U) + 1376312589U;
      return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
    }

    float noise(in vec2 uv, in float timeVal) {
      uvec2 p = uvec2(uv);
      return hash1(p.x + 1920U * p.y + (1920U * 1080U) * uint(timeVal));
    }

    void main() {
      vec4 color = texture(inputTexture, vUv);

      if (bloomEnabled && bloomStrength > 0.001) {
        vec4 b0 = texture(blur0Texture, vUv);
        vec4 b1 = texture(blur1Texture, vUv);
        vec4 b2 = texture(blur2Texture, vUv);
        vec4 b3 = texture(blur3Texture, vUv);
        vec4 b4 = texture(blur4Texture, vUv);

        vec4 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
        color += bloomSum * bloomStrength;
      }

      if (raysEnabled && raysStrength > 0.001) {
        vec4 r = texture(raysTexture, vUv);
        color.rgb += r.rgb * raysColor * raysStrength;
      }

      if (anamorphicEnabled) {
        vec4 a = texture(anamorphicTexture, vUv);
        color.rgb += a.rgb;
      }

      color.rgb *= vignette(vUv, vignetteBoost, vignetteReduction);
      color.rgb += noiseIntensity * noise(gl_FragCoord.xy, time);
      fragColor = vec4(color.rgb, 1.0);
    }
    `;

    const chromaticAberrationShaderChunk = `
    vec2 barrelDistortion(vec2 coord, float amt) {
      vec2 cc = coord - 0.5;
      float dist = dot(cc, cc);
      return coord + cc * dist * amt;
    }
    float sat(float t) { return clamp(t, 0.0, 1.0); }
    float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
    float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
    vec4 spectrum_offset(float t) {
      float lo = step(t, 0.5);
      float hi = 1.0 - lo;
      float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
      vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
      return pow(ret, vec4(1.0 / 2.2));
    }
    const float max_distort = 2.2;
    const int num_iter = 8;
    const float reci_num_iter_f = 1.0 / float(num_iter);
    vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
      vec4 sumcol = vec4(0.0);
      vec4 sumw = vec4(0.0);
      for (int i = 0; i < num_iter; ++i) {
        float t = float(i) * reci_num_iter_f;
        vec4 w = spectrum_offset(t);
        sumw += w;
        sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
      }
      return sumcol / sumw;
    }
    `;

    const colorFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float chromaticAberrationAmount;
    uniform float minInputLevel;
    uniform float maxInputLevel;
    uniform float gammaLevel;
    uniform float exposure;
    uniform float fisheyeStrength;
    uniform float fisheyeRadius;
    uniform float time;
    uniform int visionMode;
    uniform float thermalSensitivity;
    uniform float nightVisionNoise;
    uniform float nightVisionGain;
    uniform float crtIntensity;
    in vec2 vUv;
    out vec4 fragColor;

    ${chromaticAberrationShaderChunk}

    vec2 applyFisheye(vec2 uv, float strength, float radius) {
      if (abs(strength) < 0.0001) return uv;
      vec2 p = uv - 0.5;
      float d = length(p);
      if (d > radius * 1.5) return uv;
      float r = d / max(radius, 0.001);
      float theta = atan(p.y, p.x);
      float rDist = r + strength * (r * r * r);
      return 0.5 + vec2(cos(theta), sin(theta)) * (rDist * radius);
    }

    vec3 ACESFilmicToneMapping(vec3 color) {
      float a = 2.51;
      float b = 0.03;
      float c = 2.43;
      float d = 0.59;
      float e = 0.14;
      return clamp((color * (a * color + b)) / (color * (c * color + d) + e), 0.0, 1.0);
    }

    vec3 gammaCorrect(vec3 color, vec3 gamma) {
      return pow(max(color, vec3(0.0)), 1.0 / gamma);
    }
    vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
      return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
    }
    vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
      return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
    }

    vec3 applyNightVision(vec3 color, vec2 uv, float timeVal, float noiseAmt, float gain, float crt) {
      float lum = dot(color, vec3(0.299, 0.587, 0.114));
      float amplified = pow(lum * gain, 0.72);
      vec3 phosphorColor = mix(vec3(0.02, 0.12, 0.03), vec3(0.18, 1.0, 0.32), clamp(amplified, 0.0, 1.0));
      phosphorColor += vec3(0.7, 1.0, 0.8) * max(0.0, amplified - 0.75) * 1.8;
      vec2 p = uv - 0.5;
      float tubeDist = length(p);
      float tubeMask = smoothstep(0.72, 0.44, tubeDist);
      float n = fract(sin(dot(uv * 280.0 + timeVal * 0.05, vec2(12.9898, 78.233))) * 43758.5453);
      float scanline = sin(uv.y * 650.0) * crt;
      phosphorColor += (n - 0.5) * noiseAmt * 2.0 + scanline;
      return clamp(phosphorColor * tubeMask, 0.0, 1.0);
    }

    vec3 ironbow(float t) {
      t = clamp(t, 0.0, 1.0);
      vec3 c0 = vec3(0.02, 0.01, 0.18);
      vec3 c1 = vec3(0.22, 0.02, 0.48);
      vec3 c2 = vec3(0.82, 0.05, 0.25);
      vec3 c3 = vec3(1.0, 0.62, 0.02);
      vec3 c4 = vec3(1.0, 1.0, 0.92);
      if (t < 0.25) return mix(c0, c1, t * 4.0);
      if (t < 0.50) return mix(c1, c2, (t - 0.25) * 4.0);
      if (t < 0.75) return mix(c2, c3, (t - 0.50) * 4.0);
      return mix(c3, c4, (t - 0.75) * 4.0);
    }

    vec3 applyThermal(vec3 color, vec2 uv, float sensitivity, float crt, bool whiteHot) {
      float lum = dot(color, vec3(0.299, 0.587, 0.114));
      float heat = clamp(lum * sensitivity, 0.0, 1.0);
      float sensorRaster = sin(uv.y * 900.0) * (crt * 0.3);
      heat = clamp(heat + sensorRaster, 0.0, 1.0);
      if (whiteHot) {
        float grad = pow(heat, 0.85);
        return vec3(grad);
      } else {
        return ironbow(heat);
      }
    }

    void main() {
      vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
      vec4 col = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
      vec3 finalCol = col.rgb;

      if (visionMode == 1) {
        finalCol = applyNightVision(finalCol, uv, time, nightVisionNoise, nightVisionGain, crtIntensity);
      } else if (visionMode == 2) {
        finalCol = applyThermal(finalCol, uv, thermalSensitivity, crtIntensity, false);
      } else if (visionMode == 3) {
        finalCol = applyThermal(finalCol, uv, thermalSensitivity, crtIntensity, true);
      } else {
        vec3 exposedColor = finalCol * exposure;
        vec3 toneMappedColor = ACESFilmicToneMapping(exposedColor);
        finalCol = finalLevels(toneMappedColor, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
      }

      fragColor = vec4(finalCol, 1.0);
    }
    `;

    const copyFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      fragColor = texture(inputTexture, vUv);
    }
    `;

    function createFBO(w, h, options = {}) {
      return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
        wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
        wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
        minFilter: options.minFilter || THREE.LinearFilter,
        magFilter: options.magFilter || THREE.LinearFilter,
        format: options.format || THREE.RGBAFormat,
        type: options.type || THREE.HalfFloatType,
        stencilBuffer: options.stencilBuffer || false,
        depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : true,
        samples: options.samples || 0,
      });
    }

    class ShaderPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbo = createFBO(1, 1, options);
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
        this.texture = this.fbo.texture;
      }
      render(renderer, toScreen = false) {
        if (!toScreen) {
          renderer.setRenderTarget(this.fbo);
        }
        renderer.render(this.orthoScene, this.orthoCamera);
        if (!toScreen) {
          renderer.setRenderTarget(null);
        }
      }
      setSize(width, height) {
        this.fbo.setSize(Math.max(1, width), Math.max(1, height));
        this.orthoQuad.scale.set(width, height, 1);
      }
    }

    class ShaderPingPongPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
        this.currentFBO = 0;
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
      }
      render(renderer) {
        renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
        renderer.render(this.orthoScene, this.orthoCamera);
        renderer.setRenderTarget(null);
        this.currentFBO = 1 - this.currentFBO;
      }
      get current() { return this.fbos[this.currentFBO]; }
      get texture() { return this.current.texture; }
      setSize(width, height) {
        const w = Math.max(1, width);
        const h = Math.max(1, height);
        this.orthoQuad.scale.set(w, h, 1);
        this.fbos[0].setSize(w, h);
        this.fbos[1].setSize(w, h);
      }
    }

    class BloomPass {
      constructor(strength = 0.8, radius = 0.5, threshold = 0.2, levels = 5) {
        this.strength = strength;
        this.radius = radius;
        this.threshold = threshold;
        this.enabled = true;
        this.levels = levels;

        this.brightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            bloomThreshold: { value: this.threshold },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: brightFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.brightPass = new ShaderPass(this.brightShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.blurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            direction: { value: new THREE.Vector2(0, 1) },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: blurFragmentShader,
          glslVersion: THREE.GLSL3,
        });

        this.blurPasses = [];
        for (let i = 0; i < this.levels; i++) {
          this.blurPasses.push(new ShaderPingPongPass(this.blurShader, {
            format: THREE.RGBAFormat,
            type: THREE.HalfFloatType,
          }));
        }
      }

      setSize(w, h) {
        let tw = Math.max(1, w);
        let th = Math.max(1, h);
        this.brightPass.setSize(tw, th);
        for (let i = 0; i < this.levels; i++) {
          tw = Math.max(1, Math.round(tw / 2));
          th = Math.max(1, Math.round(th / 2));
          this.blurPasses[i].setSize(tw, th);
        }
      }

      set source(texture) {
        this.brightShader.uniforms.inputTexture.value = texture;
      }

      render(renderer) {
        if (!this.enabled || this.strength <= 0.001) return;

        this.brightShader.uniforms.bloomThreshold.value = this.threshold;
        this.brightPass.render(renderer);

        const baseOffset = Math.max(0.1, this.radius * 2.0);
        const u = this.blurShader.uniforms;

        for (let j = 0; j < this.levels; j++) {
          const blurPass = this.blurPasses[j];
          const stepOffset = baseOffset * (1.0 + j * 0.5);

          u.direction.value.set(stepOffset, 0);
          u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
          blurPass.render(renderer);

          u.direction.value.set(0, stepOffset * 0.5);
          u.inputTexture.value = blurPass.current.texture;
          blurPass.render(renderer);
        }
      }
    }

    const VISION_MODE_MAP = {
      'Normal (Cinematic)': 0,
      'Night Vision (Phosphor)': 1,
      'Thermal (Ironbow)': 2,
      'Thermal (White-Hot)': 3,
    };

    class PostProcessor {
      constructor(renderer, params = {}) {
        this.renderer = renderer;

        this.settings = {
          enabled: params.enabled !== undefined ? params.enabled : true,

          bloomEnabled: params.bloomEnabled !== undefined ? params.bloomEnabled : true,
          bloomStrength: params.bloomStrength !== undefined ? params.bloomStrength : 1.15,
          bloomRadius: params.bloomRadius !== undefined ? params.bloomRadius : 0.6,
          bloomThreshold: params.bloomThreshold !== undefined ? params.bloomThreshold : 0.18,

          raysEnabled: params.raysEnabled !== undefined ? params.raysEnabled : false,
          raysStrength: params.raysStrength !== undefined ? params.raysStrength : 0.75,
          raysDensity: params.raysDensity !== undefined ? params.raysDensity : 1.0,
          raysMaxDensity: params.raysMaxDensity !== undefined ? params.raysMaxDensity : 0.5,
          raysDistanceAttenuation: params.raysDistanceAttenuation !== undefined ? params.raysDistanceAttenuation : 2.0,
          raysThreshold: params.raysThreshold !== undefined ? params.raysThreshold : 0.15,
          raysColor: params.raysColor ? (params.raysColor.isColor ? params.raysColor.clone() : new THREE.Color(params.raysColor)) : new THREE.Color(0x3399cc),
          raysColorHex: params.raysColorHex || '#3399cc',

          anamorphicEnabled: params.anamorphicEnabled !== undefined ? params.anamorphicEnabled : false,
          anamorphicIntensity: params.anamorphicIntensity !== undefined ? params.anamorphicIntensity : 4.0,
          anamorphicThreshold: params.anamorphicThreshold !== undefined ? params.anamorphicThreshold : 0.35,
          anamorphicSamples: params.anamorphicSamples !== undefined ? params.anamorphicSamples : 48,
          anamorphicRadius: params.anamorphicRadius !== undefined ? params.anamorphicRadius : 0.0,
          anamorphicSmoothWidth: params.anamorphicSmoothWidth !== undefined ? params.anamorphicSmoothWidth : 0.05,
          anamorphicColor: params.anamorphicColor ? (params.anamorphicColor.isColor ? params.anamorphicColor.clone() : new THREE.Color(params.anamorphicColor)) : new THREE.Color(0x80d4ff),
          anamorphicColorHex: params.anamorphicColorHex || '#80d4ff',

          visionMode: params.visionMode !== undefined ? params.visionMode : 'Normal (Cinematic)',
          thermalSensitivity: params.thermalSensitivity !== undefined ? params.thermalSensitivity : 1.4,
          nightVisionGain: params.nightVisionGain !== undefined ? params.nightVisionGain : 2.1,
          nightVisionNoise: params.nightVisionNoise !== undefined ? params.nightVisionNoise : 0.05,
          crtIntensity: params.crtIntensity !== undefined ? params.crtIntensity : 0.0,

          fisheyeStrength: params.fisheyeStrength !== undefined ? params.fisheyeStrength : 0.0,
          fisheyeRadius: params.fisheyeRadius !== undefined ? params.fisheyeRadius : 1.0,
          chromaticAberration: params.chromaticAberration !== undefined ? params.chromaticAberration : 0.018,
          vignetteBoost: params.vignetteBoost !== undefined ? params.vignetteBoost : 1.1,
          vignetteReduction: params.vignetteReduction !== undefined ? params.vignetteReduction : 0.6,
          noiseIntensity: params.noiseIntensity !== undefined ? params.noiseIntensity : 0.012,

          gamma: params.gamma !== undefined ? params.gamma : 1.0,
          minInputLevel: params.minInputLevel !== undefined ? params.minInputLevel : 0.0,
          maxInputLevel: params.maxInputLevel !== undefined ? params.maxInputLevel : 1.0,
          exposure: params.exposure !== undefined ? params.exposure : 1.0,
        };

        this.sceneTarget = createFBO(1, 1, { type: THREE.HalfFloatType });
        this.bloomPass = new BloomPass(
          this.settings.bloomStrength,
          this.settings.bloomRadius,
          this.settings.bloomThreshold,
          5
        );

        this.moonScreenPos = new THREE.Vector3(0.5, 0.7, 1.0);
        this.moonInFront = true;

        this.godRaysMaskShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            threshold: { value: this.settings.raysThreshold },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: godRaysDepthMaskShader,
          glslVersion: THREE.GLSL3,
        });
        this.godRaysMaskPass = new ShaderPass(this.godRaysMaskShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.godRaysGenShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            vSunPositionScreenSpace: { value: this.moonScreenPos },
            fStepSize: { value: 1.0 },
            distanceAttenuation: { value: this.settings.raysDistanceAttenuation },
            maxDensity: { value: this.settings.raysMaxDensity },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: godRaysGenerateShader,
          glslVersion: THREE.GLSL3,
        });
        this.godRaysPingPong = new ShaderPingPongPass(this.godRaysGenShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.anamorphicBrightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            threshold: { value: this.settings.anamorphicThreshold },
            smoothWidth: { value: this.settings.anamorphicSmoothWidth },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: anamorphicBrightShader,
          glslVersion: THREE.GLSL3,
        });
        this.anamorphicBrightPass = new ShaderPass(this.anamorphicBrightShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.anamorphicBlurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            resolution: { value: new THREE.Vector2(1, 1) },
            samples: { value: this.settings.anamorphicSamples },
            intensity: { value: this.settings.anamorphicIntensity },
            tintColor: { value: this.settings.anamorphicColor },
            bloomRadius: { value: this.settings.anamorphicRadius },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: anamorphicBlurShader,
          glslVersion: THREE.GLSL3,
        });
        this.anamorphicBlurPass = new ShaderPass(this.anamorphicBlurShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.finalShader = new THREE.RawShaderMaterial({
          uniforms: {
            resolution: { value: new THREE.Vector2(1, 1) },
            bloomEnabled: { value: this.settings.bloomEnabled },
            bloomStrength: { value: this.settings.bloomStrength },
            raysEnabled: { value: this.settings.raysEnabled },
            raysStrength: { value: this.settings.raysStrength },
            raysColor: { value: this.settings.raysColor },
            anamorphicEnabled: { value: this.settings.anamorphicEnabled },
            vignetteBoost: { value: this.settings.vignetteBoost },
            vignetteReduction: { value: this.settings.vignetteReduction },
            noiseIntensity: { value: this.settings.noiseIntensity },
            inputTexture: { value: null },
            blur0Texture: { value: null },
            blur1Texture: { value: null },
            blur2Texture: { value: null },
            blur3Texture: { value: null },
            blur4Texture: { value: null },
            raysTexture: { value: null },
            anamorphicTexture: { value: null },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: finalFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.finalPass = new ShaderPass(this.finalShader);

        this.rgbShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: this.finalPass.texture },
            fisheyeStrength: { value: this.settings.fisheyeStrength },
            fisheyeRadius: { value: this.settings.fisheyeRadius },
            chromaticAberrationAmount: { value: this.settings.chromaticAberration },
            minInputLevel: { value: this.settings.minInputLevel },
            maxInputLevel: { value: this.settings.maxInputLevel },
            gammaLevel: { value: this.settings.gamma },
            exposure: { value: this.settings.exposure },
            visionMode: { value: VISION_MODE_MAP[this.settings.visionMode] ?? 0 },
            thermalSensitivity: { value: this.settings.thermalSensitivity },
            nightVisionGain: { value: this.settings.nightVisionGain },
            nightVisionNoise: { value: this.settings.nightVisionNoise },
            crtIntensity: { value: this.settings.crtIntensity },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: colorFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.rgbPass = new ShaderPass(this.rgbShader);

        this.copyShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: copyFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.copyPass = new ShaderPass(this.copyShader);
      }

      updateSettings() {
        this.bloomPass.enabled = this.settings.bloomEnabled;
        this.bloomPass.strength = this.settings.bloomStrength;
        this.bloomPass.radius = this.settings.bloomRadius;
        this.bloomPass.threshold = this.settings.bloomThreshold;

        this.godRaysMaskShader.uniforms.threshold.value = this.settings.raysThreshold;
        this.godRaysGenShader.uniforms.distanceAttenuation.value = this.settings.raysDistanceAttenuation;
        this.godRaysGenShader.uniforms.maxDensity.value = this.settings.raysMaxDensity;

        this.anamorphicBrightShader.uniforms.threshold.value = this.settings.anamorphicThreshold;
        this.anamorphicBrightShader.uniforms.smoothWidth.value = this.settings.anamorphicSmoothWidth;
        this.anamorphicBlurShader.uniforms.samples.value = this.settings.anamorphicSamples;
        this.anamorphicBlurShader.uniforms.intensity.value = this.settings.anamorphicIntensity;
        this.anamorphicBlurShader.uniforms.tintColor.value.copy(this.settings.anamorphicColor);
        this.anamorphicBlurShader.uniforms.bloomRadius.value = this.settings.anamorphicRadius;

        this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
        this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
        this.finalShader.uniforms.raysEnabled.value = this.settings.raysEnabled && this.moonInFront;
        this.finalShader.uniforms.raysStrength.value = this.settings.raysStrength;
        this.finalShader.uniforms.raysColor.value.copy(this.settings.raysColor);
        this.finalShader.uniforms.anamorphicEnabled.value = this.settings.anamorphicEnabled;
        this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
        this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
        this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;

        this.rgbShader.uniforms.fisheyeStrength.value = this.settings.fisheyeStrength;
        this.rgbShader.uniforms.fisheyeRadius.value = this.settings.fisheyeRadius;
        this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
        this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
        this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
        this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
        this.rgbShader.uniforms.exposure.value = this.settings.exposure;
        this.rgbShader.uniforms.visionMode.value = VISION_MODE_MAP[this.settings.visionMode] ?? 0;
        this.rgbShader.uniforms.thermalSensitivity.value = this.settings.thermalSensitivity;
        this.rgbShader.uniforms.nightVisionGain.value = this.settings.nightVisionGain;
        this.rgbShader.uniforms.nightVisionNoise.value = this.settings.nightVisionNoise;
        this.rgbShader.uniforms.crtIntensity.value = this.settings.crtIntensity;
      }

      setSize(w0, h0, dpr = 1) {
        const w = Math.max(1, Math.floor(w0 * dpr));
        const h = Math.max(1, Math.floor(h0 * dpr));
        this.sceneTarget.setSize(w, h);
        this.finalPass.setSize(w, h);
        this.finalShader.uniforms.resolution.value.set(w, h);
        this.bloomPass.setSize(w, h);

        const grW = Math.max(1, Math.round(w / 2));
        const grH = Math.max(1, Math.round(h / 2));
        this.godRaysMaskPass.setSize(grW, grH);
        this.godRaysPingPong.setSize(grW, grH);

        const anW = Math.max(1, Math.round(w / 4));
        const anH = Math.max(1, Math.round(h / 4));
        this.anamorphicBrightPass.setSize(anW, anH);
        this.anamorphicBlurPass.setSize(anW, anH);
        this.anamorphicBlurShader.uniforms.resolution.value.set(anW, anH);

        this.rgbPass.setSize(w, h);
        this.copyPass.setSize(w, h);
      }

      renderScene(scene, camera) {
        if (!this.settings.enabled) {
          this.renderer.render(scene, camera);
          return;
        }
        this.renderer.setRenderTarget(this.sceneTarget);
        this.renderer.render(scene, camera);
        this.renderer.setRenderTarget(null);
        this.render(this.sceneTarget.texture);
      }

      render(sourceTexture) {
        if (!this.settings.enabled) {
          this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
          this.copyPass.render(this.renderer, true);
          return;
        }

        this.updateSettings();

        this.bloomPass.source = sourceTexture;
        this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
        this.bloomPass.render(this.renderer);

        this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
        this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
        this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
        this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
        this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

        if (this.settings.raysEnabled && this.settings.raysStrength > 0.001 && this.moonInFront) {
          this.godRaysMaskShader.uniforms.inputTexture.value = sourceTexture;
          this.godRaysMaskShader.uniforms.threshold.value = this.settings.raysThreshold;
          this.godRaysMaskPass.render(this.renderer);

          const filterLen = this.settings.raysDensity;
          const tapsPerPass = 6.0;

          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -1.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysMaskPass.texture;
          this.godRaysPingPong.render(this.renderer);

          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -2.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysPingPong.texture;
          this.godRaysPingPong.render(this.renderer);

          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -3.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysPingPong.texture;
          this.godRaysPingPong.render(this.renderer);

          this.finalPass.shader.uniforms.raysTexture.value = this.godRaysPingPong.texture;
          this.finalPass.shader.uniforms.raysEnabled.value = true;
        } else {
          this.finalPass.shader.uniforms.raysEnabled.value = false;
        }

        if (this.settings.anamorphicEnabled && this.settings.anamorphicIntensity > 0.001) {
          this.anamorphicBrightShader.uniforms.inputTexture.value = sourceTexture;
          this.anamorphicBrightShader.uniforms.threshold.value = this.settings.anamorphicThreshold;
          this.anamorphicBrightShader.uniforms.smoothWidth.value = this.settings.anamorphicSmoothWidth;
          this.anamorphicBrightPass.render(this.renderer);

          this.anamorphicBlurShader.uniforms.inputTexture.value = this.anamorphicBrightPass.texture;
          this.anamorphicBlurShader.uniforms.samples.value = this.settings.anamorphicSamples;
          this.anamorphicBlurShader.uniforms.intensity.value = this.settings.anamorphicIntensity;
          this.anamorphicBlurShader.uniforms.tintColor.value.copy(this.settings.anamorphicColor);
          this.anamorphicBlurShader.uniforms.bloomRadius.value = this.settings.anamorphicRadius;
          this.anamorphicBlurPass.render(this.renderer);

          this.finalPass.shader.uniforms.anamorphicTexture.value = this.anamorphicBlurPass.texture;
          this.finalPass.shader.uniforms.anamorphicEnabled.value = true;
        } else {
          this.finalPass.shader.uniforms.anamorphicEnabled.value = false;
        }

        const randomTime = Math.random() * 100000;
        this.finalPass.shader.uniforms.time.value = randomTime;
        this.rgbPass.shader.uniforms.time.value = randomTime;

        this.finalPass.render(this.renderer);
        this.rgbPass.render(this.renderer, true);
      }

        anamorphic.addColor(this.settings, "anamorphicColorHex").name("Tint Color").onChange((v) => {

        lens.add(this.settings, "noiseIntensity", 0, 0.1, 0.005).name("Film Grain").onChange(() => this.updateSettings());

        index: 17,
        color1: '#E8E0FF',
        color2: '#B38FFF',
        color3: '#6A3DE8',
        bg: '#090612',
        keyLight: '#E8E0FF',
        rimLight: '#6A3DE8',
        ambient: '#1A1250'
      },
      'Palette (E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)': {
        index: 18,
        color1: '#E0FBFF',
        color2: '#00F0FF',
        color3: '#D40078',
        bg: '#05020F',
        keyLight: '#00F0FF',
        rimLight: '#D40078',
        ambient: '#1E0A3D'
      }
    };

    // =========================================================================================
    // 8 PRECONFIGURED ANIMATIONS (Smooth, slow, fitting fractal dynamics + static)
    // =========================================================================================
    const ANIMATION_PRESETS = [
      'Cosmic Flow (Drift & Breathe)',
      'Looming Gyro Vortex',
      'Harmonic Wave Resonator',
      'Zenith Orbit Loom',
      'Hypnotic Spiral Dive',
      'Ethereal Pulsing Glide',
      'Bioluminescent Float',
      'Static (No Camera Motion)'
    ];

    // ------------------------------------------------------------
    // Scene parameters & state
    // ------------------------------------------------------------
    const params = {
      // Animation
      animationPreset: 'Cosmic Flow (Drift & Breathe)',
      animationSpeed: 0.45,

      // Camera Pan & Zoom
      zoom: 1.0,
      panX: 0.0,
      panY: 0.0,
      resetView: () => resetViewport(),

      // Color & Palette
      scheme: 'Original',
      color1: COLOR_SCHEMES['Original'].color1,
      color2: COLOR_SCHEMES['Original'].color2,
      color3: COLOR_SCHEMES['Original'].color3,
      bgColor: COLOR_SCHEMES['Original'].bg,
      greenscreen: false,

      // Fractal Geometry
      tubeRadius: 15.0,
      twist: 0.004,
      octaveScale: 1.0,
      stepDivisor: 5.0,
      stepEpsilon: 0.01,
      glowIntensity: 1.0,
      glowSub: 0.8,

      // Lighting & Exposure
      sceneLightIntensity: 1.0,
      exposure: 800.0,

      // Key Light
      keyLightIntensity: 1.2,
      keyLightColor: '#ffffff',
      keyLightDirX: 0.5,
      keyLightDirY: 0.8,
      keyLightDirZ: -0.3,

      // Rim Light
      rimLightIntensity: 1.0,
      rimLightColor: '#80d0ff',

      // Ambient Light
      ambientLightIntensity: 0.7,
      ambientLightColor: '#202030',

      // Rendering & Performance
      dpr: Math.min(window.devicePixelRatio || 1, 2),
      antialias: true,

      // Procedural Variation
      clickToRandomize: true,
      randomizeNow: () => randomizeScene()
    };

    // ------------------------------------------------------------
    // Canvas & WebGL Renderer
    // ------------------------------------------------------------
    const canvas = document.getElementById('canv');

    let renderer = new THREE.WebGLRenderer({
      canvas: canvas,
      antialias: params.antialias,
      powerPreference: 'high-performance'
    });

    renderer.setPixelRatio(params.dpr);
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    renderer.setClearColor(params.bgColor, 1);

    // ------------------------------------------------------------
    // PostProcessor Pipeline
    // ------------------------------------------------------------
    const postProcessor = new PostProcessor(renderer, {
      enabled: true,
      bloomEnabled: true,
      bloomStrength: 1.0,
      bloomRadius: 0.55,
      bloomThreshold: 0.16,
      chromaticAberration: 0.015,
      vignetteBoost: 1.1,
      vignetteReduction: 0.6,
      noiseIntensity: 0.012,
      gamma: 1.0,
      minInputLevel: 0.0,
      maxInputLevel: 1.0
    });

    // ------------------------------------------------------------
    // Scene & Orthographic Screen Camera
    // ------------------------------------------------------------
    const scene = new THREE.Scene();
    const camera = new THREE.Camera();

    const resolution = new THREE.Vector2();
    renderer.getDrawingBufferSize(resolution);

    // ------------------------------------------------------------
    // Shader Uniforms
    // ------------------------------------------------------------
    const uniforms = {
      uTime: { value: 0 },
      uResolution: { value: resolution },
      uPan: { value: new THREE.Vector2(0, 0) },
      uZoom: { value: 1.0 },
      uCamRot: { value: new THREE.Matrix3() },

      // Geometry & Formula parameters
      uTubeRadius: { value: params.tubeRadius },
      uTwist: { value: params.twist },
      uOctaveScale: { value: params.octaveScale },
      uStepDivisor: { value: params.stepDivisor },
      uStepEpsilon: { value: params.stepEpsilon },
      uGlowIntensity: { value: params.glowIntensity },
      uGlowSub: { value: params.glowSub },
      uExposure: { value: params.exposure },

      // Color Schemes & Greenscreen
      uSchemeIndex: { value: 0 },
      uColor1: { value: new THREE.Color(params.color1) },
      uColor2: { value: new THREE.Color(params.color2) },
      uColor3: { value: new THREE.Color(params.color3) },
      uBgColor: { value: new THREE.Color(params.bgColor) },
      uGreenScreen: { value: false },

      // Lighting sources
      uSceneLightIntensity: { value: params.sceneLightIntensity },
      uKeyLightIntensity: { value: params.keyLightIntensity },
      uKeyLightColor: { value: new THREE.Color(params.keyLightColor) },
      uKeyLightDir: { value: new THREE.Vector3(params.keyLightDirX, params.keyLightDirY, params.keyLightDirZ) },
      uRimLightIntensity: { value: params.rimLightIntensity },
      uRimLightColor: { value: new THREE.Color(params.rimLightColor) },
      uAmbientLightIntensity: { value: params.ambientLightIntensity },
      uAmbientLightColor: { value: new THREE.Color(params.ambientLightColor) }
    };

    // ------------------------------------------------------------
    // GLSL 3.0 Fragment Shader
    // ------------------------------------------------------------
    const vertexShader = /* glsl */`
    precision highp float;
    in vec3 position;
    void main() {
      gl_Position = vec4(position, 1.0);
    }
    `;

    const fragmentShader = /* glsl */`
    precision highp float;

    uniform float uTime;
    uniform vec2 uResolution;
    uniform vec2 uPan;
    uniform float uZoom;
    uniform mat3 uCamRot;

    // Mathematical formula parameters
    uniform float uTubeRadius;
    uniform float uTwist;
    uniform float uOctaveScale;
    uniform float uStepDivisor;
    uniform float uStepEpsilon;
    uniform float uGlowIntensity;
    uniform float uGlowSub;
    uniform float uExposure;

    // Color & Harmony
    uniform int uSchemeIndex;
    uniform vec3 uColor1;
    uniform vec3 uColor2;
    uniform vec3 uColor3;
    uniform vec3 uBgColor;
    uniform bool uGreenScreen;

    // Lighting
    uniform float uSceneLightIntensity;
    uniform float uKeyLightIntensity;
    uniform vec3 uKeyLightColor;
    uniform vec3 uKeyLightDir;
    uniform float uRimLightIntensity;
    uniform vec3 uRimLightColor;
    uniform float uAmbientLightIntensity;
    uniform vec3 uAmbientLightColor;

    out vec4 fragColor;

    mat2 rotate2D(float a) {
      float c = cos(a);
      float s = sin(a);
      return mat2(c, -s, s, c);
    }

    vec3 hsv(float h, float s, float v) {
      vec4 K = vec4(1.0, 2.0 / 3.0, 1.0 / 3.0, 3.0);
      vec3 p = abs(fract(vec3(h) + K.xyz) * 6.0 - K.www);
      return v * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), s);
    }

    void main() {
      // 2D Screen UV with pan & zoom
      vec2 p = (gl_FragCoord.xy - uResolution * 0.5) / uResolution.y;
      p = (p - uPan) / max(uZoom, 0.001);

      // Camera ray in 3D space
      vec3 rd = normalize(uCamRot * vec3(p, 1.0));

      vec3 o = vec3(0.0);
      float z = 0.0;
      float d = 0.0;
      float accumulatedDensity = 0.0;

      // Raymarching the Gyroid Fractal Tube: i+++z<3e2
      for (int i = 0; i < 140; i++) {
        if (float(i) + z >= 300.0) break;

        vec3 q = z * rd;
        q.zx = abs(q.zx);
        q.yz *= rotate2D(q.z * uTwist);

        // Sinusoidal harmonic turbulence across coupled axes
        for (float s = 0.5; s < 22.0; s *= 2.0) {
          q += cos(q.yzx * (s * uOctaveScale) + uTime) / s;
        }

        d = uStepEpsilon + abs(length(q.yx) - uTubeRadius) / max(uStepDivisor, 0.1);
        z += d;

        // Sample scheme color
        vec3 sampleColor;
        if (uSchemeIndex == 0) {
          // Faithful tweet formula HSV depth gradient
          sampleColor = hsv(0.61 + z * 0.0015, 0.6, 0.9);
        } else if (uSchemeIndex == 8) {
          // Achromatic (black and white version)
          float lum = 0.5 + 0.5 * sin(z * 0.04 + length(q.yx) * 0.3);
          sampleColor = mix(uColor1, uColor2, lum);
        } else if (uSchemeIndex == 9) {
          // Achromatic + Accent (black and white + red)
          float lum = 0.5 + 0.5 * sin(z * 0.04);
          float accent = step(0.75, sin(z * 0.14 + q.z * 0.05));
          vec3 bw = mix(uColor1, uColor3, lum);
          sampleColor = mix(bw, uColor2, accent);
        } else if (uSchemeIndex == 10) {
          // Neutral + accent
          float pattern = sin(z * 0.05 + q.z * 0.02);
          float accentMask = smoothstep(0.45, 0.75, sin(z * 0.1 + length(q.yx) * 0.4));
          vec3 neutral = mix(uColor2, uColor3, 0.5 + 0.5 * pattern);
          sampleColor = mix(neutral, uColor1, accentMask);
        } else {
          // Harmonic & hex palette interpolation
          float phase = fract(z * 0.003 + length(q.yx) * 0.04);
          if (phase < 0.5) {
            sampleColor = mix(uColor1, uColor2, phase * 2.0);
          } else {
            sampleColor = mix(uColor2, uColor3, (phase - 0.5) * 2.0);
          }
        }

        // Directional pseudo-normal and lighting calculation
        vec3 pseudoNorm = normalize(vec3(q.x, q.y, 0.15 * sin(q.z * 0.08)));
        float diff = max(0.0, dot(pseudoNorm, normalize(uKeyLightDir)));
        float rim = pow(clamp(1.0 - abs(dot(rd, pseudoNorm)), 0.0, 1.0), 2.5);
        vec3 lightMod = (uKeyLightColor * (diff * uKeyLightIntensity) + 
                         uRimLightColor * (rim * uRimLightIntensity) + 
                         uAmbientLightColor * uAmbientLightIntensity) * uSceneLightIntensity;

        float glow = max(0.0, (uGlowIntensity / max(d, 0.0001)) - uGlowSub);
        o += sampleColor * lightMod * glow;
        accumulatedDensity += glow;
      }

      // Exact mathematical tone mapping: o = tanh(o / 8e2);
      vec3 mapped = tanh(clamp(o / max(uExposure, 1.0), 0.0, 20.0));

      // Background and Greenscreen compositing
      float presence = clamp(accumulatedDensity * 0.002, 0.0, 1.0);
      vec3 bgColor = uGreenScreen ? vec3(0.0, 1.0, 0.0) : uBgColor;
      vec3 finalColor = mix(bgColor, mapped, presence);

      if (!uGreenScreen && presence > 0.0) {
        finalColor = clamp(finalColor + uBgColor * 0.08, 0.0, 1.0);
      }

      fragColor = vec4(finalColor, 1.0);
    }
    `;

    // ------------------------------------------------------------
    // Fullscreen Render Mesh
    // ------------------------------------------------------------
    const material = new THREE.RawShaderMaterial({
      vertexShader: vertexShader,
      fragmentShader: fragmentShader,
      uniforms: uniforms,
      glslVersion: THREE.GLSL3,
      depthTest: false,
      depthWrite: false
    });

    const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
    scene.add(quad);

    // ------------------------------------------------------------
    // Animation Transforms
    // ------------------------------------------------------------
    const camRotMatrix = new THREE.Matrix3();
    const eulerHelper = new THREE.Euler(0, 0, 0, 'YXZ');
    const mat4Helper = new THREE.Matrix4();

    function getAnimationTransform(preset, t) {
      let rotX = 0, rotY = 0, rotZ = 0;
      let zoomMod = 1.0;
      let panModX = 0.0, panModY = 0.0;

      switch (preset) {
        case 'Cosmic Flow (Drift & Breathe)':
          rotX = Math.sin(t * 0.12) * 0.18;
          rotY = Math.cos(t * 0.15) * 0.22;
          rotZ = Math.sin(t * 0.08) * 0.10;
          zoomMod = 1.0 + Math.sin(t * 0.2) * 0.12;
          panModX = Math.sin(t * 0.1) * 0.08;
          panModY = Math.cos(t * 0.12) * 0.06;
          break;

        case 'Looming Gyro Vortex':
          rotX = Math.sin(t * 0.18) * 0.15;
          rotY = Math.cos(t * 0.14) * 0.15;
          rotZ = t * 0.08;
          zoomMod = 1.0 + Math.sin(t * 0.25) * 0.15;
          break;

        case 'Harmonic Wave Resonator':
          rotX = Math.cos(t * 0.1) * 0.25;
          rotY = Math.sin(t * 0.08) * 0.3;
          panModX = Math.sin(t * 0.22) * 0.15;
          panModY = Math.cos(t * 0.16) * 0.12;
          zoomMod = 1.0 + Math.sin(t * 0.18) * 0.1;
          break;

        case 'Zenith Orbit Loom':
          rotX = Math.sin(t * 0.15) * 0.3;
          rotY = Math.cos(t * 0.15) * 0.3;
          rotZ = Math.sin(t * 0.1) * 0.15;
          panModX = Math.cos(t * 0.15) * 0.18;
          panModY = Math.sin(t * 0.15) * 0.18;
          zoomMod = 1.0 + Math.cos(t * 0.2) * 0.14;
          break;

        case 'Hypnotic Spiral Dive':
          rotZ = -t * 0.12;
          rotX = Math.sin(t * 0.09) * 0.12;
          rotY = Math.cos(t * 0.11) * 0.12;
          zoomMod = 1.0 + Math.sin(t * 0.3) * 0.2;
          break;

        case 'Ethereal Pulsing Glide':
          rotX = Math.sin(t * 0.08) * 0.1;
          rotY = Math.sin(t * 0.06) * 0.12;
          zoomMod = 1.0 + Math.sin(t * 0.4) * 0.22;
          panModX = Math.sin(t * 0.14) * 0.1;
          panModY = -Math.cos(t * 0.14) * 0.1;
          break;

        case 'Bioluminescent Float':
          rotX = Math.cos(t * 0.07) * 0.15;
          rotY = Math.sin(t * 0.05) * 0.2;
          rotZ = Math.cos(t * 0.06) * 0.08;
          panModX = Math.sin(t * 0.09) * 0.12;
          panModY = Math.cos(t * 0.11) * 0.1;
          zoomMod = 1.0 + Math.sin(t * 0.15) * 0.08;
          break;

        case 'Static (No Camera Motion)':
        default:
          rotX = 0;
          rotY = 0;
          rotZ = 0;
          zoomMod = 1.0;
          panModX = 0;
          panModY = 0;
          break;
      }

      eulerHelper.set(rotX, rotY, rotZ, 'YXZ');
      mat4Helper.makeRotationFromEuler(eulerHelper);
      camRotMatrix.setFromMatrix4(mat4Helper);

      return { camRot: camRotMatrix, zoomMod, panModX, panModY };
    }

    // ------------------------------------------------------------
    // Color Scheme & Palette Handlers
    // ------------------------------------------------------------
    function applyColorScheme(name) {
      const sc = COLOR_SCHEMES[name];
      if (!sc) return;
      params.color1 = sc.color1;
      params.color2 = sc.color2;
      params.color3 = sc.color3;
      params.bgColor = sc.bg;
      params.keyLightColor = sc.keyLight;
      params.rimLightColor = sc.rimLight;
      params.ambientLightColor = sc.ambient;

      uniforms.uSchemeIndex.value = sc.index;
      uniforms.uColor1.value.set(sc.color1);
      uniforms.uColor2.value.set(sc.color2);
      uniforms.uColor3.value.set(sc.color3);
      uniforms.uBgColor.value.set(sc.bg);
      uniforms.uKeyLightColor.value.set(sc.keyLight);
      uniforms.uRimLightColor.value.set(sc.rimLight);
      uniforms.uAmbientLightColor.value.set(sc.ambient);

      if (renderer) {
        const clearCol = params.greenscreen ? '#00ff00' : params.bgColor;
        renderer.setClearColor(clearCol, 1);
      }
    }

    function updateColors() {
      uniforms.uColor1.value.set(params.color1);
      uniforms.uColor2.value.set(params.color2);
      uniforms.uColor3.value.set(params.color3);
      uniforms.uBgColor.value.set(params.bgColor);
      if (!params.greenscreen && renderer) {
        renderer.setClearColor(params.bgColor, 1);
      }
    }

    function updateGreenscreen(val) {
      params.greenscreen = val;
      uniforms.uGreenScreen.value = val;
      const clearCol = val ? '#00ff00' : params.bgColor;
      if (renderer) {
        renderer.setClearColor(clearCol, 1);
      }
    }

    function updateLighting() {
      uniforms.uSceneLightIntensity.value = params.sceneLightIntensity;
      uniforms.uExposure.value = params.exposure;
      uniforms.uKeyLightIntensity.value = params.keyLightIntensity;
      uniforms.uKeyLightColor.value.set(params.keyLightColor);
      uniforms.uKeyLightDir.value.set(params.keyLightDirX, params.keyLightDirY, params.keyLightDirZ);
      uniforms.uRimLightIntensity.value = params.rimLightIntensity;
      uniforms.uRimLightColor.value.set(params.rimLightColor);
      uniforms.uAmbientLightIntensity.value = params.ambientLightIntensity;
      uniforms.uAmbientLightColor.value.set(params.ambientLightColor);
    }

    function resetViewport() {
      params.zoom = 1.0;
      params.panX = 0.0;
      params.panY = 0.0;
      if (controllers.zoom) controllers.zoom.updateDisplay();
      if (controllers.panX) controllers.panX.updateDisplay();
      if (controllers.panY) controllers.panY.updateDisplay();
    }

    // ------------------------------------------------------------
    // Antialias & DPR Handlers
    // ------------------------------------------------------------
    function updateAntialias(val) {
      params.antialias = val;
      const oldCanvas = renderer.domElement;
      renderer.dispose();

      const newRenderer = new THREE.WebGLRenderer({
        antialias: val,
        powerPreference: 'high-performance'
      });

      newRenderer.domElement.id = 'canv';
      newRenderer.setPixelRatio(params.dpr);
      newRenderer.setSize(window.innerWidth, window.innerHeight, false);
      const clearCol = params.greenscreen ? '#00ff00' : params.bgColor;
      newRenderer.setClearColor(clearCol, 1);

      oldCanvas.parentNode.replaceChild(newRenderer.domElement, oldCanvas);
      renderer = newRenderer;
      renderer.getDrawingBufferSize(resolution);
      uniforms.uResolution.value.copy(resolution);
      postProcessor.renderer = newRenderer;
      postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);

      bindCanvasEvents(newRenderer.domElement);
    }

    function updateDPR(val) {
      params.dpr = val;
      renderer.setPixelRatio(val);
      renderer.setSize(window.innerWidth, window.innerHeight, false);
      renderer.getDrawingBufferSize(resolution);
      uniforms.uResolution.value.copy(resolution);
      postProcessor.setSize(window.innerWidth, window.innerHeight, val);
    }

    // ------------------------------------------------------------
    // Procedural Variation Generator
    // ------------------------------------------------------------
    function randomizeScene() {
      // 1. Pick a random color scheme from 19 schemes
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const chosenScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      params.scheme = chosenScheme;
      applyColorScheme(chosenScheme);

      // 2. Re-roll geometric parameters
      params.tubeRadius = +(10.0 + Math.random() * 12.0).toFixed(1);
      params.twist = +(0.0015 + Math.random() * 0.006).toFixed(4);
      if (Math.random() < 0.3) params.twist = -params.twist;
      params.octaveScale = +(0.7 + Math.random() * 0.9).toFixed(2);
      params.stepDivisor = +(3.5 + Math.random() * 3.5).toFixed(1);
      params.stepEpsilon = +(0.006 + Math.random() * 0.015).toFixed(3);
      params.glowIntensity = +(0.7 + Math.random() * 0.8).toFixed(2);
      params.glowSub = +(0.4 + Math.random() * 0.6).toFixed(2);

      // 3. Re-roll motion parameters
      const animPresets = ANIMATION_PRESETS.filter(p => p !== 'Static (No Camera Motion)');
      params.animationPreset = animPresets[Math.floor(Math.random() * animPresets.length)];
      params.animationSpeed = +(0.2 + Math.random() * 0.6).toFixed(2);

      // 4. Re-roll lighting parameters
      params.sceneLightIntensity = +(0.8 + Math.random() * 0.6).toFixed(2);
      params.exposure = +(600.0 + Math.random() * 450.0).toFixed(0);
      params.keyLightIntensity = +(0.8 + Math.random() * 1.0).toFixed(2);
      params.rimLightIntensity = +(0.7 + Math.random() * 1.0).toFixed(2);
      params.ambientLightIntensity = +(0.4 + Math.random() * 0.5).toFixed(2);

      params.keyLightDirX = +(-0.8 + Math.random() * 1.6).toFixed(2);
      params.keyLightDirY = +(0.2 + Math.random() * 0.8).toFixed(2);
      params.keyLightDirZ = +(-0.8 + Math.random() * 1.6).toFixed(2);

      // 5. Update shader uniforms
      uniforms.uTubeRadius.value = params.tubeRadius;
      uniforms.uTwist.value = params.twist;
      uniforms.uOctaveScale.value = params.octaveScale;
      uniforms.uStepDivisor.value = params.stepDivisor;
      uniforms.uStepEpsilon.value = params.stepEpsilon;
      uniforms.uGlowIntensity.value = params.glowIntensity;
      uniforms.uGlowSub.value = params.glowSub;
      uniforms.uExposure.value = params.exposure;
      uniforms.uSceneLightIntensity.value = params.sceneLightIntensity;
      uniforms.uKeyLightIntensity.value = params.keyLightIntensity;
      uniforms.uKeyLightDir.value.set(params.keyLightDirX, params.keyLightDirY, params.keyLightDirZ);
      uniforms.uRimLightIntensity.value = params.rimLightIntensity;
      uniforms.uAmbientLightIntensity.value = params.ambientLightIntensity;

      // 6. Update control panel without touching PostProcessor settings
      updateGuiDisplay();
    }

    // ------------------------------------------------------------
    // GUI Setup (lil-gui standard styling)
    // ------------------------------------------------------------
    const gui = new GUI({
      title: 'Gyroid Fractal Settings'
    });

    const controllers = {};

    function updateGuiDisplay() {
      gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    // 1. Animation Folder
    const animationFolder = gui.addFolder('Animation');
    controllers.animationPreset = animationFolder.add(params, 'animationPreset', ANIMATION_PRESETS).name('Preset');
    controllers.animationSpeed = animationFolder.add(params, 'animationSpeed', 0.0, 2.5, 0.01).name('Speed');

    // 2. Camera & Interactive View Folder
    const viewFolder = gui.addFolder('Camera & View');
    controllers.zoom = viewFolder.add(params, 'zoom', 0.1, 20.0, 0.05).name('Zoom');
    controllers.panX = viewFolder.add(params, 'panX', -6.0, 6.0, 0.05).name('Pan X');
    controllers.panY = viewFolder.add(params, 'panY', -6.0, 6.0, 0.05).name('Pan Y');
    viewFolder.add(params, 'resetView').name('Reset View');

    // 3. Color & Palette Folder (19 Schemes)
    const colorFolder = gui.addFolder('Color & Palette');
    controllers.scheme = colorFolder.add(params, 'scheme', Object.keys(COLOR_SCHEMES)).name('Palette').onChange(name => {
      applyColorScheme(name);
      updateGuiDisplay();
    });
    controllers.color1 = colorFolder.addColor(params, 'color1').name('Color 1').onChange(updateColors);
    controllers.color2 = colorFolder.addColor(params, 'color2').name('Color 2').onChange(updateColors);
    controllers.color3 = colorFolder.addColor(params, 'color3').name('Color 3').onChange(updateColors);
    controllers.bgColor = colorFolder.addColor(params, 'bgColor').name('Background Color').onChange(updateColors);
    controllers.greenscreen = colorFolder.add(params, 'greenscreen').name('Greenscreen (#00ff00)').onChange(updateGreenscreen);

    // 4. Fractal Geometry Folder
    const fractalFolder = gui.addFolder('Fractal Geometry');
    controllers.tubeRadius = fractalFolder.add(params, 'tubeRadius', 5.0, 30.0, 0.1).name('Tube Radius').onChange(v => {
      uniforms.uTubeRadius.value = v;
    });
    controllers.twist = fractalFolder.add(params, 'twist', -0.015, 0.015, 0.0005).name('Space Twist').onChange(v => {
      uniforms.uTwist.value = v;
    });
    controllers.octaveScale = fractalFolder.add(params, 'octaveScale', 0.2, 2.5, 0.01).name('Octave Scale').onChange(v => {
      uniforms.uOctaveScale.value = v;
    });
    controllers.stepDivisor = fractalFolder.add(params, 'stepDivisor', 1.0, 12.0, 0.1).name('Step Divisor').onChange(v => {
      uniforms.uStepDivisor.value = v;
    });
    controllers.stepEpsilon = fractalFolder.add(params, 'stepEpsilon', 0.002, 0.05, 0.001).name('Step Epsilon').onChange(v => {
      uniforms.uStepEpsilon.value = v;
    });
    controllers.glowIntensity = fractalFolder.add(params, 'glowIntensity', 0.1, 3.0, 0.05).name('Glow Intensity').onChange(v => {
      uniforms.uGlowIntensity.value = v;
    });
    controllers.glowSub = fractalFolder.add(params, 'glowSub', 0.0, 2.0, 0.05).name('Glow Subtraction').onChange(v => {
      uniforms.uGlowSub.value = v;
    });

    // 5. Lighting & Exposure Folder
    const lightingFolder = gui.addFolder('Lighting & Exposure');
    controllers.sceneLightIntensity = lightingFolder.add(params, 'sceneLightIntensity', 0.1, 3.0, 0.05).name('Scene Light Intensity').onChange(updateLighting);
    controllers.exposure = lightingFolder.add(params, 'exposure', 100.0, 2000.0, 10.0).name('Exposure').onChange(updateLighting);

    const keyLightFolder = lightingFolder.addFolder('Key Light');
    controllers.keyLightIntensity = keyLightFolder.add(params, 'keyLightIntensity', 0.0, 4.0, 0.05).name('Intensity').onChange(updateLighting);
    controllers.keyLightColor = keyLightFolder.addColor(params, 'keyLightColor').name('Color').onChange(updateLighting);
    controllers.keyLightDirX = keyLightFolder.add(params, 'keyLightDirX', -1.0, 1.0, 0.05).name('Direction X').onChange(updateLighting);
    controllers.keyLightDirY = keyLightFolder.add(params, 'keyLightDirY', -1.0, 1.0, 0.05).name('Direction Y').onChange(updateLighting);
    controllers.keyLightDirZ = keyLightFolder.add(params, 'keyLightDirZ', -1.0, 1.0, 0.05).name('Direction Z').onChange(updateLighting);

    const rimLightFolder = lightingFolder.addFolder('Rim Light');
    controllers.rimLightIntensity = rimLightFolder.add(params, 'rimLightIntensity', 0.0, 4.0, 0.05).name('Intensity').onChange(updateLighting);
    controllers.rimLightColor = rimLightFolder.addColor(params, 'rimLightColor').name('Color').onChange(updateLighting);

    const ambientLightFolder = lightingFolder.addFolder('Ambient Light');
    controllers.ambientLightIntensity = ambientLightFolder.add(params, 'ambientLightIntensity', 0.0, 3.0, 0.05).name('Intensity').onChange(updateLighting);
    controllers.ambientLightColor = ambientLightFolder.addColor(params, 'ambientLightColor').name('Color').onChange(updateLighting);

    // 6. Rendering & Performance Folder
    const renderFolder = gui.addFolder('Rendering & Performance');
    controllers.dpr = renderFolder.add(params, 'dpr', 0.5, 3.0, 0.25).name('Pixel Ratio (DPR)').onChange(updateDPR);
    controllers.antialias = renderFolder.add(params, 'antialias').name('Scene Antialias (AA)').onChange(updateAntialias);

    // 7. Procedural Variation Folder
    const procFolder = gui.addFolder('Procedural Variation');
    controllers.clickToRandomize = procFolder.add(params, 'clickToRandomize').name('Click Scene: Randomize');
    procFolder.add(params, 'randomizeNow').name('🎲 Re-roll Scene Now');

    // 8. Post-Processing Suite Folder
    postProcessor.attachGUI(gui, 'Post-Processing (PostProcessor.js)');

    gui.close();

    // ------------------------------------------------------------
    // Keyboard Toggle UI ("H" Key)
    // ------------------------------------------------------------
    window.addEventListener('keydown', (e) => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) return;
      if (e.key === 'h' || e.key === 'H') {
        if (gui._hidden) {
          gui.show();
        } else {
          gui.hide();
        }
      }
    });

    // ------------------------------------------------------------
    // Pointer Dragging, Wheel Zoom & Scene Click Handling
    // ------------------------------------------------------------
    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let pointerDownTime = 0;
    let hasDragged = false;

    function bindCanvasEvents(targetCanvas) {
      targetCanvas.addEventListener('pointerdown', (e) => {
        if (e.target.closest('.lil-gui')) return;
        isDragging = true;
        hasDragged = false;
        dragStartX = e.clientX;
        dragStartY = e.clientY;
        pointerDownTime = performance.now();
        targetCanvas.classList.add('grabbing');
      });

      window.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        const dx = e.clientX - dragStartX;
        const dy = e.clientY - dragStartY;
        if (Math.hypot(dx, dy) > 5) {
          hasDragged = true;
        }
        const factor = 2.0 / Math.max(params.zoom, 0.01) / window.innerHeight;
        params.panX += dx * factor;
        params.panY -= dy * factor;
        dragStartX = e.clientX;
        dragStartY = e.clientY;
        if (controllers.panX) controllers.panX.updateDisplay();
        if (controllers.panY) controllers.panY.updateDisplay();
      });

      window.addEventListener('pointerup', (e) => {
        if (!isDragging) return;
        isDragging = false;
        targetCanvas.classList.remove('grabbing');
        const duration = performance.now() - pointerDownTime;
        if (!hasDragged && duration < 350) {
          if (params.clickToRandomize && !e.target.closest('.lil-gui')) {
            randomizeScene();
          }
        }
      });

      targetCanvas.addEventListener('wheel', (e) => {
        if (e.target.closest('.lil-gui')) return;
        e.preventDefault();
        const factor = e.deltaY < 0 ? 1.1 : 0.91;
        params.zoom = Math.max(0.1, Math.min(25.0, params.zoom * factor));
        if (controllers.zoom) controllers.zoom.updateDisplay();
      }, { passive: false });
    }

    bindCanvasEvents(renderer.domElement);

    // ------------------------------------------------------------
    // Window Resize Handler
    // ------------------------------------------------------------
    function resize() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      const dpr = params.dpr;

      renderer.setSize(width, height, false);
      renderer.getDrawingBufferSize(resolution);
      uniforms.uResolution.value.copy(resolution);

      postProcessor.setSize(width, height, dpr);
    }

    window.addEventListener('resize', resize);
    resize();

    // ------------------------------------------------------------
    // Infinite Animation Loop
    // ------------------------------------------------------------
    const clock = new THREE.Clock();
    let totalAnimTime = 0;

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      totalAnimTime += delta * params.animationSpeed;

      uniforms.uTime.value = totalAnimTime;

      // Evaluate smooth camera animation
      const anim = getAnimationTransform(params.animationPreset, totalAnimTime);
      uniforms.uCamRot.value.copy(anim.camRot);
      uniforms.uPan.value.set(params.panX + anim.panModX, params.panY + anim.panModY);
      uniforms.uZoom.value = params.zoom * anim.zoomMod;

      // Render through PostProcessor pipeline
      postProcessor.renderScene(scene, camera);
    }

    animate();
  </script>
</body>
</html>
