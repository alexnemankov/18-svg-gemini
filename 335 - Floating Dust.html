<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cinematic Floating Dust Motes (Micro-Particles)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    :root {
      --anim-speed-factor: 1;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f0b06;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #viewport-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
    }
    #viewport-wrapper.grabbing {
      cursor: grabbing;
    }
    #webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
      mix-blend-mode: screen;
      z-index: 1;
    }
    #dust-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
      pointer-events: none;
      z-index: 2;
    }

    /* Staggered Vertical Translation CSS Keyframes */
    @keyframes floatV1 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-42px); }
      100% { transform: translateY(0px); }
    }
    @keyframes floatV2 {
      0% { transform: translateY(15px); }
      50% { transform: translateY(-65px); }
      100% { transform: translateY(15px); }
    }
    @keyframes floatV3 {
      0% { transform: translateY(-20px); }
      50% { transform: translateY(38px); }
      100% { transform: translateY(-20px); }
    }
    @keyframes floatV4 {
      0% { transform: translateY(0px); }
      33% { transform: translateY(-50px); }
      66% { transform: translateY(22px); }
      100% { transform: translateY(0px); }
    }
    @keyframes floatV5 {
      0% { transform: translateY(30px); }
      50% { transform: translateY(-80px); }
      100% { transform: translateY(30px); }
    }

    /* Staggered Horizontal Translation CSS Keyframes */
    @keyframes floatH1 {
      0% { transform: translateX(0px); }
      50% { transform: translateX(38px); }
      100% { transform: translateX(0px); }
    }
    @keyframes floatH2 {
      0% { transform: translateX(-24px); }
      50% { transform: translateX(42px); }
      100% { transform: translateX(-24px); }
    }
    @keyframes floatH3 {
      0% { transform: translateX(18px); }
      50% { transform: translateX(-32px); }
      100% { transform: translateX(18px); }
    }
    @keyframes floatH4 {
      0% { transform: translateX(0px); }
      33% { transform: translateX(45px); }
      66% { transform: translateX(-28px); }
      100% { transform: translateX(0px); }
    }
    @keyframes floatH5 {
      0% { transform: translateX(-35px); }
      50% { transform: translateX(25px); }
      100% { transform: translateX(-35px); }
    }

    /* Soft Opacity Breathing CSS Keyframes */
    @keyframes pulseOpacity1 {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.95; }
    }
    @keyframes pulseOpacity2 {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 0.25; }
    }
    @keyframes pulseOpacity3 {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.8; }
    }

    /* Volumetric Sunbeam Shimmer */
    @keyframes beamShimmer {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 0.85; }
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js",
      "postprocessing/PostProcessor.js": "./postprocessing/PostProcessor.js"
    }
  }
  </script>
</head>
<body>
  <div id="viewport-wrapper">
    <!-- WebGL Ambient Volumetric Light Field Overlay -->
    <canvas id="webgl-canvas"></canvas>

    <!-- Cinematic Vector Micro-Particles SVG World -->
    <svg id="dust-svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" shape-rendering="geometricPrecision">
      <defs>
        <!-- Bokeh Gaussian Blur Filters for Optical Depth-of-Field -->
        <filter id="bokeh-heavy" x="-80%" y="-80%" width="260%" height="260%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="14" id="blur-heavy" />
        </filter>
        <filter id="bokeh-medium" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="5.5" id="blur-med" />
        </filter>
        <filter id="bokeh-soft" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="1.8" id="blur-soft" />
        </filter>

        <!-- Specular Highlight & Glow Filter for Sparkling Dust Particles -->
        <filter id="mote-specular-glow" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="glow" id="blur-glow" />
          <feMerge>
            <feMergeNode in="glow" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>

        <!-- Dynamic Scene Gradients -->
        <radialGradient id="bg-ambient-gradient" cx="35%" cy="25%" r="75%">
          <stop offset="0%" stop-color="#3d2a14" stop-opacity="0.8" id="stop-bg-1" />
          <stop offset="50%" stop-color="#1c1309" stop-opacity="0.9" id="stop-bg-2" />
          <stop offset="100%" stop-color="#0f0b06" stop-opacity="1" id="stop-bg-3" />
        </radialGradient>

        <linearGradient id="light-beam-gradient" x1="15%" y1="0%" x2="85%" y2="100%">
          <stop offset="0%" stop-color="#fff4d4" stop-opacity="0.45" id="stop-beam-1" />
          <stop offset="35%" stop-color="#f6aa1c" stop-opacity="0.22" id="stop-beam-2" />
          <stop offset="70%" stop-color="#bc3908" stop-opacity="0.08" id="stop-beam-3" />
          <stop offset="100%" stop-color="#000000" stop-opacity="0" id="stop-beam-4" />
        </linearGradient>

        <linearGradient id="secondary-beam-gradient" x1="0%" y1="10%" x2="100%" y2="90%">
          <stop offset="0%" stop-color="#ffd899" stop-opacity="0.28" id="stop-sec-beam-1" />
          <stop offset="55%" stop-color="#f6aa1c" stop-opacity="0.12" id="stop-sec-beam-2" />
          <stop offset="100%" stop-color="#000000" stop-opacity="0" id="stop-sec-beam-3" />
        </linearGradient>

        <radialGradient id="sun-corona-gradient" cx="20%" cy="15%" r="45%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" id="stop-corona-1" />
          <stop offset="25%" stop-color="#ffd899" stop-opacity="0.45" id="stop-corona-2" />
          <stop offset="65%" stop-color="#f6aa1c" stop-opacity="0.12" id="stop-corona-3" />
          <stop offset="100%" stop-color="#000000" stop-opacity="0" id="stop-corona-4" />
        </radialGradient>

        <!-- Cinematic Optical Vignette -->
        <radialGradient id="cinematic-vignette" cx="50%" cy="50%" r="70%">
          <stop offset="45%" stop-color="#000000" stop-opacity="0" />
          <stop offset="80%" stop-color="#000000" stop-opacity="0.4" />
          <stop offset="100%" stop-color="#000000" stop-opacity="0.82" />
        </radialGradient>
      </defs>

      <!-- Background Canvas Fill Layer -->
      <rect id="scene-bg" x="-3000" y="-3000" width="8000" height="8000" fill="url(#bg-ambient-gradient)" />

      <!-- Interactive Scene World (Camera / Pan / Zoom Rig) -->
      <g id="world-rig">
        <!-- Volumetric Atmospheric Light Rays & Sun Corona Layer -->
        <g id="volumetric-light-layer" style="animation: beamShimmer 9s ease-in-out infinite alternate;">
          <!-- Primary God Ray -->
          <polygon id="primary-god-ray" points="150,-100 680,-100 1880,1180 1200,1180" fill="url(#light-beam-gradient)" />
          <!-- Secondary Shaft -->
          <polygon id="secondary-god-ray" points="-80,80 320,0 1560,1120 1100,1180" fill="url(#secondary-beam-gradient)" />
          <!-- Ambient Light Origin Flare -->
          <circle id="sun-corona" cx="380" cy="80" r="580" fill="url(#sun-corona-gradient)" />
        </g>

        <!-- Foreground Volumetric Caustic Slits -->
        <g id="caustic-slits" opacity="0.35">
          <polygon points="400,-50 480,-50 1480,1150 1400,1150" fill="url(#light-beam-gradient)" opacity="0.45" />
          <polygon points="560,-50 610,-50 1620,1150 1570,1150" fill="url(#light-beam-gradient)" opacity="0.3" />
        </g>

        <!-- Layer 1: Background Micro-Particles (Deep Field, tiny, dense, slow drift) -->
        <g id="layer-bg-motes"></g>

        <!-- Layer 2: Midground Focus Dust Motes (Crisp, sparkling specular highlights) -->
        <g id="layer-mid-motes" filter="url(#mote-specular-glow)"></g>

        <!-- Layer 3: Foreground Bokeh Dust Motes (Near camera, soft large translucent discs) -->
        <g id="layer-fg-motes"></g>

        <!-- Layer 4: Prismatic Lens Flare Diffraction Starlets -->
        <g id="layer-diffraction-stars"></g>
      </g>

      <!-- Optical Vignette Frame Overlay -->
      <rect id="vignette-overlay" x="-2000" y="-2000" width="6000" height="6000" fill="url(#cinematic-vignette)" pointer-events="none" />
    </svg>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import GUI from 'lil-gui';

    // =========================================================================
    // POST PROCESSOR SUITE (postprocessing/PostProcessor.js)
    // Inlined for full local file:// compatibility without CORS origin blocks
    // =========================================================================
    const orthoVertexShader = `
    precision highp float;
    in vec3 position;
    out vec2 vUv;
    void main() {
      vUv = position.xy * 0.5 + 0.5;
      gl_Position = vec4(position, 1.0);
    }
    `;

    const brightFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float bloomThreshold;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float luminance = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float knee = 0.1;
      float soft = luminance - bloomThreshold + knee;
      soft = clamp(soft, 0.0, 2.0 * knee);
      soft = (soft * soft) / (4.0 * knee + 0.00001);
      float contribution = max(soft, luminance - bloomThreshold);
      contribution /= max(luminance, 0.00001);
      fragColor = vec4(color.rgb * contribution, color.a);
    }
    `;

    const blur13ShaderChunk = `
    vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
      vec2 resolution = vec2(textureSize(image, 0));
      vec4 color = vec4(0.0);
      vec2 off1 = vec2(1.411764705882353) * direction;
      vec2 off2 = vec2(3.2941176470588234) * direction;
      vec2 off3 = vec2(5.176470588235294) * direction;
      color += texture(image, uv) * 0.1964825501511404;
      color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
      color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
      return color;
    }
    `;

    const blurFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 direction;
    in vec2 vUv;
    out vec4 color;
    ${blur13ShaderChunk}
    void main() {
      color = blur13(inputTexture, vUv, direction);
    }
    `;

    const finalFragmentShader = `
    precision highp float;
    uniform vec2 resolution;
    uniform sampler2D inputTexture;
    uniform sampler2D blur0Texture;
    uniform sampler2D blur1Texture;
    uniform sampler2D blur2Texture;
    uniform sampler2D blur3Texture;
    uniform sampler2D blur4Texture;
    uniform bool bloomEnabled;
    uniform float bloomStrength;
    uniform float vignetteBoost;
    uniform float vignetteReduction;
    uniform float noiseIntensity;
    uniform float time;
    in vec2 vUv;
    out vec4 fragColor;

    float vignette(vec2 uv, float boost, float reduction) {
      vec2 position = vUv - 0.5;
      return boost - length(position) * reduction;
    }

    float hash1(uint n) {
      n = (n << 13U) ^ n;
      n = n * (n * n * 15731U + 789221U) + 1376312589U;
      return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
    }

    float noise(in vec2 uv, in float timeVal) {
      uvec2 p = uvec2(uv);
      return hash1(p.x + 1920U * p.y + (1920U * 1080U) * uint(timeVal));
    }

    void main() {
      vec4 color = texture(inputTexture, vUv);

      if (bloomEnabled && bloomStrength > 0.001) {
        vec4 b0 = texture(blur0Texture, vUv);
        vec4 b1 = texture(blur1Texture, vUv);
        vec4 b2 = texture(blur2Texture, vUv);
        vec4 b3 = texture(blur3Texture, vUv);
        vec4 b4 = texture(blur4Texture, vUv);

        vec4 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
        color += bloomSum * bloomStrength;
      }

      color.rgb *= vignette(vUv, vignetteBoost, vignetteReduction);
      color.rgb += noiseIntensity * noise(gl_FragCoord.xy, time);
      fragColor = vec4(color.rgb, color.a);
    }
    `;

    const chromaticAberrationShaderChunk = `
    vec2 barrelDistortion(vec2 coord, float amt) {
      vec2 cc = coord - 0.5;
      float dist = dot(cc, cc);
      return coord + cc * dist * amt;
    }
    float sat(float t) { return clamp(t, 0.0, 1.0); }
    float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
    float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
    vec4 spectrum_offset(float t) {
      float lo = step(t, 0.5);
      float hi = 1.0 - lo;
      float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
      vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
      return pow(ret, vec4(1.0 / 2.2));
    }
    const float max_distort = 2.2;
    const int num_iter = 8;
    const float reci_num_iter_f = 1.0 / float(num_iter);
    vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
      vec4 sumcol = vec4(0.0);
      vec4 sumw = vec4(0.0);
      for (int i = 0; i < num_iter; ++i) {
        float t = float(i) * reci_num_iter_f;
        vec4 w = spectrum_offset(t);
        sumw += w;
        sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
      }
      return sumcol / sumw;
    }
    `;

    const colorFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float chromaticAberrationAmount;
    uniform float minInputLevel;
    uniform float maxInputLevel;
    uniform float gammaLevel;
    uniform float fisheyeStrength;
    uniform float fisheyeRadius;
    uniform float time;
    in vec2 vUv;
    out vec4 fragColor;

    ${chromaticAberrationShaderChunk}

    vec2 applyFisheye(vec2 uv, float strength, float radius) {
      if (abs(strength) < 0.0001) return uv;
      vec2 p = uv - 0.5;
      float d = length(p);
      if (d > radius * 1.5) return uv;
      float r = d / max(radius, 0.001);
      float theta = atan(p.y, p.x);
      float rDist = r + strength * (r * r * r);
      return 0.5 + vec2(cos(theta), sin(theta)) * (rDist * radius);
    }

    vec3 gammaCorrect(vec3 color, vec3 gamma) {
      return pow(max(color, vec3(0.0)), 1.0 / gamma);
    }
    vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
      return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
    }
    vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
      return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
    }
    void main() {
      vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
      fragColor = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
      fragColor.rgb = finalLevels(fragColor.rgb, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
    }
    `;

    const copyFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      fragColor = texture(inputTexture, vUv);
    }
    `;

    function createFBO(w, h, options = {}) {
      return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
        wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
        wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
        minFilter: options.minFilter || THREE.LinearFilter,
        magFilter: options.magFilter || THREE.LinearFilter,
        format: options.format || THREE.RGBAFormat,
        type: options.type || THREE.HalfFloatType,
        stencilBuffer: options.stencilBuffer || false,
        depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : true,
        samples: options.samples || 0,
      });
    }

    class ShaderPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbo = createFBO(1, 1, options);
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
        this.texture = this.fbo.texture;
      }
      render(renderer, toScreen = false) {
        if (!toScreen) {
          renderer.setRenderTarget(this.fbo);
        }
        renderer.render(this.orthoScene, this.orthoCamera);
        if (!toScreen) {
          renderer.setRenderTarget(null);
        }
      }
      setSize(width, height) {
        this.fbo.setSize(Math.max(1, width), Math.max(1, height));
        this.orthoQuad.scale.set(width, height, 1);
      }
    }

    class ShaderPingPongPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
        this.currentFBO = 0;
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
      }
      render(renderer) {
        renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
        renderer.render(this.orthoScene, this.orthoCamera);
        renderer.setRenderTarget(null);
        this.currentFBO = 1 - this.currentFBO;
      }
      get current() { return this.fbos[this.currentFBO]; }
      get texture() { return this.current.texture; }
      setSize(width, height) {
        const w = Math.max(1, width);
        const h = Math.max(1, height);
        this.orthoQuad.scale.set(w, h, 1);
        this.fbos[0].setSize(w, h);
        this.fbos[1].setSize(w, h);
      }
    }

    class BloomPass {
      constructor(strength = 0.8, radius = 0.5, threshold = 0.2, levels = 5) {
        this.strength = strength;
        this.radius = radius;
        this.threshold = threshold;
        this.enabled = true;
        this.levels = levels;

        this.brightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            bloomThreshold: { value: this.threshold },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: brightFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.brightPass = new ShaderPass(this.brightShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.blurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            direction: { value: new THREE.Vector2(0, 1) },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: blurFragmentShader,
          glslVersion: THREE.GLSL3,
        });

        this.blurPasses = [];
        for (let i = 0; i < this.levels; i++) {
          this.blurPasses.push(new ShaderPingPongPass(this.blurShader, {
            format: THREE.RGBAFormat,
            type: THREE.HalfFloatType,
          }));
        }
      }

      setSize(w, h) {
        let tw = Math.max(1, w);
        let th = Math.max(1, h);
        this.brightPass.setSize(tw, th);
        for (let i = 0; i < this.levels; i++) {
          tw = Math.max(1, Math.round(tw / 2));
          th = Math.max(1, Math.round(th / 2));
          this.blurPasses[i].setSize(tw, th);
        }
      }

      set source(texture) {
        this.brightShader.uniforms.inputTexture.value = texture;
      }

      render(renderer) {
        if (!this.enabled || this.strength <= 0.001) return;

        this.brightShader.uniforms.bloomThreshold.value = this.threshold;
        this.brightPass.render(renderer);

        const baseOffset = Math.max(0.1, this.radius * 2.0);
        const u = this.blurShader.uniforms;

        for (let j = 0; j < this.levels; j++) {
          const blurPass = this.blurPasses[j];
          const stepOffset = baseOffset * (1.0 + j * 0.5);

          u.direction.value.set(stepOffset, 0);
          u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
          blurPass.render(renderer);

          u.direction.value.set(0, stepOffset * 0.5);
          u.inputTexture.value = blurPass.current.texture;
          blurPass.render(renderer);
        }
      }
    }

    class PostProcessor {
      constructor(rendererInstance, configuration = {}) {
        this.renderer = rendererInstance;

        this.settings = {
          enabled: configuration.enabled !== undefined ? configuration.enabled : true,
          bloomEnabled: configuration.bloomEnabled !== undefined ? configuration.bloomEnabled : true,
          bloomStrength: configuration.bloomStrength !== undefined ? configuration.bloomStrength : 0.85,
          bloomRadius: configuration.bloomRadius !== undefined ? configuration.bloomRadius : 0.55,
          bloomThreshold: configuration.bloomThreshold !== undefined ? configuration.bloomThreshold : 0.22,
          fisheyeStrength: configuration.fisheyeStrength !== undefined ? configuration.fisheyeStrength : 0.0,
          fisheyeRadius: configuration.fisheyeRadius !== undefined ? configuration.fisheyeRadius : 1.0,
          chromaticAberration: configuration.chromaticAberration !== undefined ? configuration.chromaticAberration : 0.03,
          vignetteBoost: configuration.vignetteBoost !== undefined ? configuration.vignetteBoost : 1.0,
          vignetteReduction: configuration.vignetteReduction !== undefined ? configuration.vignetteReduction : 0.45,
          noiseIntensity: configuration.noiseIntensity !== undefined ? configuration.noiseIntensity : 0.015,
          gamma: configuration.gamma !== undefined ? configuration.gamma : 1.0,
          minInputLevel: configuration.minInputLevel !== undefined ? configuration.minInputLevel : 0.0,
          maxInputLevel: configuration.maxInputLevel !== undefined ? configuration.maxInputLevel : 1.0,
        };

        this.sceneTarget = createFBO(1, 1, { type: THREE.HalfFloatType });

        this.bloomPass = new BloomPass(
          this.settings.bloomStrength,
          this.settings.bloomRadius,
          this.settings.bloomThreshold,
          5
        );

        this.finalShader = new THREE.RawShaderMaterial({
          uniforms: {
            resolution: { value: new THREE.Vector2(1, 1) },
            bloomEnabled: { value: this.settings.bloomEnabled },
            bloomStrength: { value: this.settings.bloomStrength },
            vignetteBoost: { value: this.settings.vignetteBoost },
            vignetteReduction: { value: this.settings.vignetteReduction },
            noiseIntensity: { value: this.settings.noiseIntensity },
            inputTexture: { value: null },
            blur0Texture: { value: null },
            blur1Texture: { value: null },
            blur2Texture: { value: null },
            blur3Texture: { value: null },
            blur4Texture: { value: null },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: finalFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.finalPass = new ShaderPass(this.finalShader);

        this.rgbShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: this.finalPass.texture },
            fisheyeStrength: { value: this.settings.fisheyeStrength },
            fisheyeRadius: { value: this.settings.fisheyeRadius },
            chromaticAberrationAmount: { value: this.settings.chromaticAberration },
            minInputLevel: { value: this.settings.minInputLevel },
            maxInputLevel: { value: this.settings.maxInputLevel },
            gammaLevel: { value: this.settings.gamma },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: colorFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.rgbPass = new ShaderPass(this.rgbShader);

        this.copyShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: copyFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.copyPass = new ShaderPass(this.copyShader);
      }

      updateSettings() {
        this.bloomPass.enabled = this.settings.bloomEnabled;
        this.bloomPass.strength = this.settings.bloomStrength;
        this.bloomPass.radius = this.settings.bloomRadius;
        this.bloomPass.threshold = this.settings.bloomThreshold;

        this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
        this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
        this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
        this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
        this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;

        this.rgbShader.uniforms.fisheyeStrength.value = this.settings.fisheyeStrength;
        this.rgbShader.uniforms.fisheyeRadius.value = this.settings.fisheyeRadius;
        this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
        this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
        this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
        this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
      }

      setSize(w0, h0, dpr = 1) {
        const w = Math.max(1, Math.floor(w0 * dpr));
        const h = Math.max(1, Math.floor(h0 * dpr));
        this.sceneTarget.setSize(w, h);
        this.finalPass.setSize(w, h);
        this.finalShader.uniforms.resolution.value.set(w, h);
        this.bloomPass.setSize(w, h);
        this.rgbPass.setSize(w, h);
        this.copyPass.setSize(w, h);
      }

      renderScene(scene, camera) {
        if (!this.settings.enabled) {
          this.renderer.render(scene, camera);
          return;
        }
        this.renderer.setRenderTarget(this.sceneTarget);
        this.renderer.render(scene, camera);
        this.renderer.setRenderTarget(null);
        this.render(this.sceneTarget.texture);
      }

      render(sourceTexture) {
        if (!this.settings.enabled) {
          this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
          this.copyPass.render(this.renderer, true);
          return;
        }

        this.updateSettings();

        this.bloomPass.source = sourceTexture;
        this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
        this.bloomPass.render(this.renderer);

        this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
        this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
        this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
        this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
        this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

        const randomTime = Math.random() * 100000;
        this.finalPass.shader.uniforms.time.value = randomTime;
        this.rgbPass.shader.uniforms.time.value = randomTime;

        this.finalPass.render(this.renderer);
        this.rgbPass.render(this.renderer, true);
      }

    const threeVertexShader = `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = vec4(position, 1.0);
      }
    `;

    const threeFragmentShader = `
      precision highp float;
      varying vec2 vUv;
      uniform vec2 uResolution;
      uniform float uTime;
      uniform vec3 uPrimaryColor;
      uniform vec3 uSecondaryColor;
      uniform vec3 uAccentColor;
      uniform float uExposure;
      uniform float uLightIntensity;
      uniform float uGreenScreen;

      // Soft hash noise
      float hash(vec2 p) {
        return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
      }

      float noise(vec2 p) {
        vec2 i = floor(p);
        vec2 f = fract(p);
        vec2 u = f * f * (3.0 - 2.0 * f);
        return mix(mix(hash(i + vec2(0.0, 0.0)), hash(i + vec2(1.0, 0.0)), u.x),
                   mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);
      }

      void main() {
        if (uGreenScreen > 0.5) {
          gl_FragColor = vec4(0.0);
          return;
        }

        vec2 uv = vUv;
        // Volumetric ray projection across screen
        vec2 rayOrigin = vec2(0.2, 0.15);
        vec2 rayDir = uv - rayOrigin;
        float dist = length(rayDir);
        float angle = atan(rayDir.y, rayDir.x);

        // Shimmering caustic light noise
        float n = noise(vec2(angle * 6.0 + uTime * 0.15, dist * 2.0 - uTime * 0.2));
        float shaft = smoothstep(0.85, 0.2, abs(rayDir.y - rayDir.x * 0.65));
        shaft *= (0.6 + 0.4 * n);

        // Radial falloff
        float radial = exp(-dist * 1.8);
        vec3 col = mix(uSecondaryColor, uPrimaryColor, clamp(shaft * 1.4, 0.0, 1.0));
        col = mix(col, uAccentColor, n * 0.3);

        float alpha = (shaft * 0.22 + radial * 0.18) * uLightIntensity * uExposure;
        gl_FragColor = vec4(col * alpha, alpha);
      }
    `;

        circle.setAttribute('opacity', opacity);
        circle.setAttribute('filter', filterId);
        circle.classList.add('fg-mote-item');

        groupV.appendChild(circle);
        groupH.appendChild(groupV);
        layerFgMotes.appendChild(groupH);

        moteElements.push({
          circle,
          type: 'fg',
          baseRadius: r,
          baseOpacity: opacity,
          x, y
        });
      }

      // 4. Prismatic Diffraction Starlets
      const starCount = 14;
      for (let i = 0; i < starCount; i++) {
        const x = 300 + Math.random() * 1300;
        const y = 150 + Math.random() * 750;
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        g.setAttribute('transform', `translate(${x.toFixed(1)}, ${y.toFixed(1)})`);

        const p1 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        p1.setAttribute('x1', '-6'); p1.setAttribute('y1', '0'); p1.setAttribute('x2', '6'); p1.setAttribute('y2', '0');
        p1.setAttribute('stroke', params.accentColor);
        p1.setAttribute('stroke-width', '1.2');
        p1.setAttribute('stroke-linecap', 'round');

        const p2 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        p2.setAttribute('x1', '0'); p2.setAttribute('y1', '-6'); p2.setAttribute('x2', '0'); p2.setAttribute('y2', '6');
        p2.setAttribute('stroke', params.accentColor);
        p2.setAttribute('stroke-width', '1.2');
        p2.setAttribute('stroke-linecap', 'round');

        const core = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        core.setAttribute('cx', '0');
        core.setAttribute('cy', '0');
        core.setAttribute('r', '1.8');
        core.setAttribute('fill', '#ffffff');

        g.appendChild(p1);
        g.appendChild(p2);
        g.appendChild(core);
        g.style.animation = `pulseOpacity1 ${3 + Math.random() * 4}s ease-in-out infinite -${Math.random() * 5}s`;
        layerDiffractionStars.appendChild(g);
      }
    }

    // =========================================================================
    // COLOR APPLICATION & GRADIENT UPDATES
    // =========================================================================
    function applyScheme(schemeName) {
      if (!COLOR_SCHEMES[schemeName]) return;
      const s = COLOR_SCHEMES[schemeName];
      params.colorScheme = schemeName;
      params.primaryColor = s.primary;
      params.secondaryColor = s.secondary;
      params.accentColor = s.accent;
      params.beamColor = s.beam;
      params.backgroundColor = s.background;

      applyColors();
      updateGuiControllers();
    }

    function applyColors() {
      const isGreen = params.greenscreen;
      const bg = isGreen ? '#00ff00' : params.backgroundColor;

      document.body.style.backgroundColor = bg;
      sceneBg.setAttribute('fill', isGreen ? '#00ff00' : 'url(#bg-ambient-gradient)');

      if (isGreen) {
        vignetteOverlay.setAttribute('opacity', '0');
        volumetricLightLayer.setAttribute('opacity', '0.2');
        if (postProcessor) {
          postProcessor.settings.enabled = false;
          postProcessor.updateSettings();
        }
      } else {
        vignetteOverlay.setAttribute('opacity', '1');
        volumetricLightLayer.setAttribute('opacity', '1');
        if (postProcessor) {
          postProcessor.settings.enabled = true;
          postProcessor.updateSettings();
        }
      }

      // Update Radial Background Gradient
      const s1 = document.getElementById('stop-bg-1');
      const s2 = document.getElementById('stop-bg-2');
      const s3 = document.getElementById('stop-bg-3');
      if (s1 && s2 && s3) {
        s1.setAttribute('stop-color', params.secondaryColor);
        s2.setAttribute('stop-color', params.backgroundColor);
        s3.setAttribute('stop-color', params.backgroundColor);
      }

      // Update Volumetric Light Beam Gradients
      const b1 = document.getElementById('stop-beam-1');
      const b2 = document.getElementById('stop-beam-2');
      const b3 = document.getElementById('stop-beam-3');
      if (b1 && b2 && b3) {
        b1.setAttribute('stop-color', params.beamColor);
        b2.setAttribute('stop-color', params.primaryColor);
        b3.setAttribute('stop-color', params.secondaryColor);
      }

      const sb1 = document.getElementById('stop-sec-beam-1');
      const sb2 = document.getElementById('stop-sec-beam-2');
      if (sb1 && sb2) {
        sb1.setAttribute('stop-color', params.beamColor);
        sb2.setAttribute('stop-color', params.accentColor);
      }

      // Update Sun Corona Gradient
      const c1 = document.getElementById('stop-corona-1');
      const c2 = document.getElementById('stop-corona-2');
      const c3 = document.getElementById('stop-corona-3');
      if (c1 && c2 && c3) {
        c1.setAttribute('stop-color', params.beamColor);
        c2.setAttribute('stop-color', params.primaryColor);
        c3.setAttribute('stop-color', params.secondaryColor);
      }

      // Update Vector Motes Fills
      moteElements.forEach((m, idx) => {
        if (m.type === 'bg') {
          m.circle.setAttribute('fill', params.secondaryColor);
        } else if (m.type === 'mid') {
          m.circle.setAttribute('fill', idx % 3 === 0 ? params.accentColor : params.primaryColor);
        } else if (m.type === 'fg') {
          m.circle.setAttribute('fill', idx % 2 === 0 ? params.primaryColor : params.beamColor);
        }
      });

      // Update Three.js Uniforms
      if (threeMaterial) {
        threeMaterial.uniforms.uPrimaryColor.value.set(params.primaryColor);
        threeMaterial.uniforms.uSecondaryColor.value.set(params.secondaryColor);
        threeMaterial.uniforms.uAccentColor.value.set(params.accentColor);
        threeMaterial.uniforms.uGreenScreen.value = isGreen ? 1.0 : 0.0;
      }

      applyLighting();
    }

    function applyLighting() {
      const exp = params.exposure;
      const light = params.lightIntensity;
      const bloom = params.glowBloom;

      // Update SVG Filters
      const blurGlow = document.getElementById('blur-glow');
      if (blurGlow) blurGlow.setAttribute('stdDeviation', (2.5 * bloom).toFixed(1));

      const blurHeavy = document.getElementById('blur-heavy');
      if (blurHeavy) blurHeavy.setAttribute('stdDeviation', (14 * bloom).toFixed(1));

      const blurMed = document.getElementById('blur-med');
      if (blurMed) blurMed.setAttribute('stdDeviation', (5.5 * bloom).toFixed(1));

      // Update Sun Corona & Volumetric Beams Opacity
      const sunCorona = document.getElementById('sun-corona');
      if (sunCorona) sunCorona.setAttribute('opacity', (0.85 * light).toFixed(2));

      const primaryGodRay = document.getElementById('primary-god-ray');
      if (primaryGodRay) primaryGodRay.setAttribute('opacity', (0.95 * light).toFixed(2));

      // Global SVG brightness & contrast filter
      worldRig.style.filter = `brightness(${exp}) contrast(${0.92 + exp * 0.08})`;

      if (threeMaterial) {
        threeMaterial.uniforms.uExposure.value = exp;
        threeMaterial.uniforms.uLightIntensity.value = light;
      }
    }

    function applyDPR() {
      const dpr = params.dpr;
      if (renderer) {
        renderer.setPixelRatio(dpr);
        renderer.setSize(window.innerWidth, window.innerHeight);
      }
      if (postProcessor) {
        postProcessor.setSize(window.innerWidth, window.innerHeight, dpr);
      }
      if (threeMaterial) {
        threeMaterial.uniforms.uResolution.value.set(window.innerWidth * dpr, window.innerHeight * dpr);
      }
      const filters = svg.querySelectorAll('filter');
      const res = Math.round(768 * dpr);
      filters.forEach(f => {
        f.setAttribute('filterRes', `${res} ${res}`);
      });
    }

    function applyAnimationSpeed() {
      document.documentElement.style.setProperty('--anim-speed-factor', params.animationSpeed <= 0.001 ? '999999' : params.animationSpeed);
    }

    // =========================================================================
    // INTERACTIVE PAN & ZOOM CAMERA PHYSICS (WHEEL + DRAG)
    // =========================================================================
    let isPointerDown = false;
    let dragStartX = 0, dragStartY = 0;
    let panX = 0, panY = 0;
    let targetPanX = 0, targetPanY = 0;
    let zoom = 1.0;
    let targetZoom = 1.0;
    let hasMoved = false;
    let downTime = 0;

    viewportWrapper.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.lil-gui')) return;
      isPointerDown = true;
      hasMoved = false;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      downTime = performance.now();
      viewportWrapper.classList.add('grabbing');
    });

    window.addEventListener('pointermove', (e) => {
      if (!isPointerDown) return;
      const dx = e.clientX - dragStartX;
      const dy = e.clientY - dragStartY;
      if (Math.hypot(dx, dy) > 5) {
        hasMoved = true;
      }
      targetPanX += dx;
      targetPanY += dy;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
    });

    window.addEventListener('pointerup', (e) => {
      if (!isPointerDown) return;
      isPointerDown = false;
      viewportWrapper.classList.remove('grabbing');

      const duration = performance.now() - downTime;
      if (!hasMoved && duration < 380) {
        if (params.clickToRandomize && !e.target.closest('.lil-gui')) {
          randomizeScene();
        }
      }
    });

    window.addEventListener('wheel', (e) => {
      if (e.target.closest('.lil-gui')) return;
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.12 : 0.89;
      targetZoom = Math.max(0.2, Math.min(6.5, targetZoom * zoomFactor));
    }, { passive: false });

    function resetCameraTransform() {
      targetPanX = 0;
      targetPanY = 0;
      targetZoom = 1.0;
    }

    // =========================================================================
    // PROCEDURAL RANDOMIZATION ON SCENE CLICK
    // =========================================================================
    function randomizeScene() {
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const chosenScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      params.colorScheme = chosenScheme;

      const s = COLOR_SCHEMES[chosenScheme];
      params.primaryColor = s.primary;
      params.secondaryColor = s.secondary;
      params.accentColor = s.accent;
      params.beamColor = s.beam;
      params.backgroundColor = s.background;

      const anims = ANIMATION_PRESETS;
      params.animationMode = anims[Math.floor(Math.random() * anims.length)];
      params.animationSpeed = +(0.7 + Math.random() * 0.9).toFixed(2);
      params.exposure = +(0.85 + Math.random() * 0.45).toFixed(2);
      params.lightIntensity = +(0.9 + Math.random() * 0.5).toFixed(2);
      params.glowBloom = +(0.9 + Math.random() * 0.6).toFixed(2);

      if (postProcessor) {
        postProcessor.settings.bloomStrength = +(0.6 + Math.random() * 0.6).toFixed(2);
        postProcessor.settings.chromaticAberration = +(0.01 + Math.random() * 0.04).toFixed(3);
        postProcessor.updateSettings();
      }

      createDustMotes();
      applyColors();
      applyAnimationSpeed();
      updateGuiControllers();
    }

    function updateGuiControllers() {
      if (typeof gui.controllersRecursive === 'function') {
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      } else {
        const traverse = (folder) => {
          folder.controllers.forEach(c => c.updateDisplay());
          folder.folders.forEach(traverse);
        };
        traverse(gui);
      }
    }

    // =========================================================================
    // LIL-GUI CONTROL PANEL (DEFAULT UNSTYLED AS REQUESTED)
    // =========================================================================
    const gui = new GUI({ title: 'Cinematic Dust Motes' });

    // Folder 1: Color Schemes & Palette
    const fColor = gui.addFolder('Color & Palette');
    fColor.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Color Scheme').onChange(applyScheme);
    fColor.addColor(params, 'primaryColor').name('Primary Motes').onChange(applyColors);
    fColor.addColor(params, 'secondaryColor').name('Secondary Dust').onChange(applyColors);
    fColor.addColor(params, 'accentColor').name('Accent Glint').onChange(applyColors);
    fColor.addColor(params, 'beamColor').name('Light Beam').onChange(applyColors);
    fColor.addColor(params, 'backgroundColor').name('Background').onChange(applyColors);
    fColor.add(params, 'greenscreen').name('Greenscreen (#00ff00)').onChange(applyColors);

    // Folder 2: Optics & Illumination
    const fOptics = gui.addFolder('Optics & Illumination');
    fOptics.add(params, 'exposure', 0.2, 3.0, 0.05).name('Exposure').onChange(applyLighting);
    fOptics.add(params, 'lightIntensity', 0.2, 3.0, 0.05).name('Light Intensity').onChange(applyLighting);
    fOptics.add(params, 'glowBloom', 0.2, 2.5, 0.05).name('Glow Bloom').onChange(applyLighting);
    fOptics.add(params, 'antialias').name('Three.js Antialias').onChange((val) => {
      rebuildRenderer(val);
    });
    fOptics.add(params, 'dpr', 0.5, 3.0, 0.25).name('Pixel Ratio (DPR)').onChange(applyDPR);

    // Folder 3: Animation & Choreography
    const fMotion = gui.addFolder('Motion & Dynamics');
    fMotion.add(params, 'animationMode', ANIMATION_PRESETS).name('Camera Preset');
    fMotion.add(params, 'animationSpeed', 0.0, 3.0, 0.05).name('Animation Speed').onChange(applyAnimationSpeed);
    fMotion.add(params, 'moteDensity', 150, 700, 25).name('Mote Density').onChange(() => {
      createDustMotes();
      applyColors();
    });

    // Folder 4: Interaction & System Controls
    const fSystem = gui.addFolder('System Controls');
    fSystem.add(params, 'clickToRandomize').name('Click Scene: Re-roll');
    fSystem.add(params, 'randomizeNow').name('Randomize Now');
    fSystem.add(params, 'resetCamera').name('Reset Camera');

    // Toggle UI visibility with "H" key
    let isGuiVisible = true;
    window.addEventListener('keydown', (e) => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) return;
      if (e.key === 'h' || e.key === 'H') {
        isGuiVisible = !isGuiVisible;
        if (isGuiVisible) {
          gui.show();
        } else {
          gui.hide();
        }
      }
    });

    // Window Resize Handler
    function onWindowResize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      if (renderer) {
        renderer.setSize(w, h);
        renderer.setPixelRatio(params.dpr);
      }
      if (postProcessor) {
        postProcessor.setSize(w, h, params.dpr);
      }
      if (threeMaterial) {
        threeMaterial.uniforms.uResolution.value.set(w * params.dpr, h * params.dpr);
      }
    }
    window.addEventListener('resize', onWindowResize);

    // =========================================================================
    // MAIN INFINITE ANIMATION LOOP
    // =========================================================================
    const CENTER_X = 960;
    const CENTER_Y = 540;
    let lastTime = performance.now();
    let accumulatedTime = 0;

    function animate(currentTime) {
      requestAnimationFrame(animate);

      const dt = Math.min((currentTime - lastTime) / 1000, 0.1);
      lastTime = currentTime;
      accumulatedTime += dt * params.animationSpeed;

      // 1. Smooth Camera Physics Lerp
      panX += (targetPanX - panX) * 0.12;
      panY += (targetPanY - panY) * 0.12;
      zoom += (targetZoom - zoom) * 0.12;

      // 2. Camera Choreography Trajectory per Selected Preset
      let camOffsetX = 0;
      let camOffsetY = 0;
      let camZoom = 1.0;
      let camRot = 0;

      switch (params.animationMode) {
        case 'Static (Zero Movement)':
          camOffsetX = 0;
          camOffsetY = 0;
          camZoom = 1.0;
          camRot = 0;
          break;

        case 'Cinematic Dolly Float':
          camZoom = 1.0 + 0.05 * Math.sin(accumulatedTime * 0.45);
          camOffsetY = 12 * Math.sin(accumulatedTime * 0.3);
          camOffsetX = 8 * Math.cos(accumulatedTime * 0.25);
          break;

        case 'Weightless Updraft':
          camOffsetY = 24 * Math.sin(accumulatedTime * 0.4);
          camOffsetX = 10 * Math.sin(accumulatedTime * 0.25);
          camZoom = 1.0 + 0.03 * Math.cos(accumulatedTime * 0.35);
          break;

        case 'Deep Ambient Sway':
          camOffsetX = 32 * Math.sin(accumulatedTime * 0.28);
          camOffsetY = 14 * Math.cos(accumulatedTime * 0.32);
          camRot = 0.8 * Math.sin(accumulatedTime * 0.2);
          break;

        case 'Orbital Dust Waltz':
          camOffsetX = 28 * Math.cos(accumulatedTime * 0.3);
          camOffsetY = 18 * Math.sin(accumulatedTime * 0.3);
          camRot = 1.2 * Math.sin(accumulatedTime * 0.22);
          camZoom = 1.0 + 0.04 * Math.sin(accumulatedTime * 0.4);
          break;

        case 'Sunbeam Sweep':
          camOffsetX = 20 * Math.sin(accumulatedTime * 0.35);
          camOffsetY = 15 * Math.sin(accumulatedTime * 0.5);
          camZoom = 1.0 + 0.045 * Math.cos(accumulatedTime * 0.3);
          break;

        case 'Brownian Micro-Drift':
          camOffsetX = 12 * (Math.sin(accumulatedTime * 0.45) + 0.5 * Math.sin(accumulatedTime * 1.1));
          camOffsetY = 10 * (Math.cos(accumulatedTime * 0.4) + 0.5 * Math.cos(accumulatedTime * 0.95));
          camZoom = 1.0 + 0.025 * Math.sin(accumulatedTime * 0.6);
          break;

        case 'Twilight Diagonal Glide':
          camOffsetX = 35 * Math.sin(accumulatedTime * 0.25);
          camOffsetY = 22 * Math.sin(accumulatedTime * 0.25);
          camRot = 0.6 * Math.cos(accumulatedTime * 0.2);
          camZoom = 1.0 + 0.035 * Math.sin(accumulatedTime * 0.35);
          break;
      }

      // Apply Combined Matrix to World Rig
      const finalPanX = panX + camOffsetX;
      const finalPanY = panY + camOffsetY;
      const finalZoom = zoom * camZoom;
      const finalRot = camRot;

      worldRig.setAttribute(
        'transform',
        `translate(${CENTER_X + finalPanX}, ${CENTER_Y + finalPanY}) scale(${finalZoom}) rotate(${finalRot}) translate(${-CENTER_X}, ${-CENTER_Y})`
      );

      // 3. Render Three.js Atmospheric Overlay with PostProcessor Suite Pipeline
      if (postProcessor && threeScene && threeCamera && threeMaterial) {
        threeMaterial.uniforms.uTime.value = accumulatedTime;
        postProcessor.renderScene(threeScene, threeCamera);
      }
    }

    // =========================================================================
    // INITIALIZATION SEQUENCE
    // =========================================================================
    initThreeScene();
    createDustMotes();
    applyScheme(params.colorScheme);
    applyAnimationSpeed();
    applyDPR();

    // Kick off animation loop
    requestAnimationFrame(animate);
  </script>
</body>
</html>
