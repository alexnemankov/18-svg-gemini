<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fluid Interactive Grid</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050510;
    }
    #canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    #canvas:active {
      cursor: grabbing;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script type="module">
    import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let width = window.innerWidth;
    let height = window.innerHeight;

    // Presetupped Color Schemes
    const COLOR_SCHEMES = {
      'Cyber Neon': { bgColor: '#050510', dotColor: '#00f3ff', lineColor: '#ff007f' },
      'Ocean Deep': { bgColor: '#020d18', dotColor: '#40e0ff', lineColor: '#005580' },
      'Solar Flare': { bgColor: '#0c0402', dotColor: '#ffaa00', lineColor: '#ff3300' },
      'Emerald Matrix': { bgColor: '#021008', dotColor: '#00ff66', lineColor: '#006633' },
      'Amethyst Dreams': { bgColor: '#0a0314', dotColor: '#e066ff', lineColor: '#7000cc' }
    };

    // Presetupped Animations
    const ANIMATION_PRESETS = [
      'Static (No Auto Motion)',
      'Smooth Wave Orbital',
      'Expanding Vortex Pulse',
      'Harmonic Figure 8',
      'Sinusoidal Grid Scan'
    ];

    // Master Settings Parameters
    const params = {
      // Greenscreen & Color Controls
      greenscreen: false,
      colorScheme: 'Cyber Neon',
      bgColor: COLOR_SCHEMES['Cyber Neon'].bgColor,
      dotColor: COLOR_SCHEMES['Cyber Neon'].dotColor,
      lineColor: COLOR_SCHEMES['Cyber Neon'].lineColor,

      // Geometry & Physics Controls
      spacing: 30,
      dotRadius: 2.5,
      maxDistortion: 45,
      dampening: 0.08,
      friction: 0.92,
      connectLines: true,
      lineWidth: 0.8,

      // Motion & Speed Controls
      animPreset: 'Smooth Wave Orbital',
      animSpeed: 1.0,

      // Camera & Zoom & DPR Controls
      zoom: 1.0,
      panX: 0,
      panY: 0,
      dpr: Math.min(window.devicePixelRatio || 1, 2),

      // Click Randomizer Mode
      clickRandomizer: true,
      resetView: () => {
        params.zoom = 1.0;
        params.panX = 0;
        params.panY = 0;
        updateGUI();
      },
      randomizeNow: () => triggerRandomizer()
    };

    // Grid data structures
    let dots = [];
    let cols = 0;
    let rows = 0;

    function initGrid() {
      dots = [];
      const extraPadding = 400;
      const minX = -extraPadding;
      const maxX = width + extraPadding;
      const minY = -extraPadding;
      const maxY = height + extraPadding;

      cols = Math.floor((maxX - minX) / params.spacing) + 1;
      rows = Math.floor((maxY - minY) / params.spacing) + 1;

      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          const gx = minX + x * params.spacing;
          const gy = minY + y * params.spacing;
          dots.push({
            x: gx,
            y: gy,
            originalX: gx,
            originalY: gy,
            vx: 0,
            vy: 0
          });
        }
      }
    }

    function updateCanvasSize() {
      width = window.innerWidth;
      height = window.innerHeight;
      const dpr = params.dpr;
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      initGrid();
    }

    // Hex Color Helper
    function hexToRgb(hex) {
      if (!hex) return { r: 255, g: 255, b: 255 };
      let c = hex.replace('#', '');
      if (c.length === 3) c = c.split('').map(x => x + x).join('');
      const num = parseInt(c, 16);
      return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
    }

    // Interaction State (Dragging, Zooming, Hover, Click Randomizer)
    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let initialPanX = 0;
    let initialPanY = 0;
    let hasDragged = false;
    let mouseWorldX = width / 2;
    let mouseWorldY = height / 2;
    let isMouseOver = false;

    canvas.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      isDragging = true;
      hasDragged = false;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      initialPanX = params.panX;
      initialPanY = params.panY;
    });

    window.addEventListener('mousemove', (e) => {
      const screenX = e.clientX;
      const screenY = e.clientY;
      mouseWorldX = (screenX - (width / 2 + params.panX)) / params.zoom + width / 2;
      mouseWorldY = (screenY - (height / 2 + params.panY)) / params.zoom + height / 2;
      isMouseOver = true;

      if (isDragging) {
        const dx = e.clientX - dragStartX;
        const dy = e.clientY - dragStartY;
        if (Math.abs(dx) > 4 || Math.abs(dy) > 4) {
          hasDragged = true;
        }
        params.panX = initialPanX + dx;
        params.panY = initialPanY + dy;
        guiControllers.panX?.updateDisplay();
        guiControllers.panY?.updateDisplay();
      }
    });

    canvas.addEventListener('mouseleave', () => {
      isMouseOver = false;
    });

    window.addEventListener('mouseup', () => {
      if (isDragging) {
        if (!hasDragged && params.clickRandomizer) {
          triggerRandomizer();
        }
        isDragging = false;
      }
    });

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
      params.zoom = Math.max(0.2, Math.min(5.0, params.zoom * zoomFactor));
      guiControllers.zoom?.updateDisplay();
    }, { passive: false });

    // Keyboard "H" key to toggle UI
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        if (gui._hidden) {
          gui.show();
        } else {
          gui.hide();
        }
      }
    });

    // Procedural Theme & Parameter Randomizer
    function triggerRandomizer() {
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      params.colorScheme = randomScheme;
      const colors = COLOR_SCHEMES[randomScheme];
      params.bgColor = colors.bgColor;
      params.dotColor = colors.dotColor;
      params.lineColor = colors.lineColor;

      params.spacing = Math.floor(20 + Math.random() * 25);
      params.dotRadius = +(1.5 + Math.random() * 2.5).toFixed(1);
      params.maxDistortion = Math.floor(25 + Math.random() * 45);
      params.dampening = +(0.04 + Math.random() * 0.08).toFixed(2);
      params.friction = +(0.88 + Math.random() * 0.08).toFixed(2);
      params.lineWidth = +(0.4 + Math.random() * 1.0).toFixed(1);
      params.connectLines = Math.random() > 0.15;

      params.animPreset = ANIMATION_PRESETS[Math.floor(Math.random() * ANIMATION_PRESETS.length)];
      params.animSpeed = +(0.6 + Math.random() * 1.4).toFixed(1);

      initGrid();
      updateGUI();
    }

    // Lil-GUI Initialization
    const gui = new GUI({ title: 'Fluid Grid Settings' });
    const guiControllers = {};

    function updateGUI() {
      function updateFolder(instance) {
        instance.controllers.forEach(c => c.updateDisplay());
        instance.folders.forEach(f => updateFolder(f));
      }
      updateFolder(gui);
    }

    // Color & Theme Folder
    const fColor = gui.addFolder('Color & Theme');
    guiControllers.greenscreen = fColor.add(params, 'greenscreen').name('Green Screen (#00ff00)');
    guiControllers.colorScheme = fColor.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Color Scheme').onChange((val) => {
      if (COLOR_SCHEMES[val]) {
        params.bgColor = COLOR_SCHEMES[val].bgColor;
        params.dotColor = COLOR_SCHEMES[val].dotColor;
        params.lineColor = COLOR_SCHEMES[val].lineColor;
        updateGUI();
      }
    });
    guiControllers.bgColor = fColor.addColor(params, 'bgColor').name('Background Color');
    guiControllers.dotColor = fColor.addColor(params, 'dotColor').name('Dot Color');
    guiControllers.lineColor = fColor.addColor(params, 'lineColor').name('Line Color');

    // Animation & Motion Folder
    const fAnim = gui.addFolder('Animation & Motion');
    guiControllers.animPreset = fAnim.add(params, 'animPreset', ANIMATION_PRESETS).name('Animation Preset');
    guiControllers.animSpeed = fAnim.add(params, 'animSpeed', 0.1, 3.0, 0.1).name('Anim Speed');

    // Grid & Physics Folder
    const fGrid = gui.addFolder('Grid & Physics');
    guiControllers.spacing = fGrid.add(params, 'spacing', 15, 60, 1).name('Grid Spacing').onChange(initGrid);
    guiControllers.dotRadius = fGrid.add(params, 'dotRadius', 0.5, 8.0, 0.5).name('Dot Radius');
    guiControllers.maxDistortion = fGrid.add(params, 'maxDistortion', 10, 120, 1).name('Max Distortion');
    guiControllers.dampening = fGrid.add(params, 'dampening', 0.01, 0.3, 0.01).name('Dampening');
    guiControllers.friction = fGrid.add(params, 'friction', 0.8, 0.99, 0.01).name('Friction');
    guiControllers.connectLines = fGrid.add(params, 'connectLines').name('Connect Lines');
    guiControllers.lineWidth = fGrid.add(params, 'lineWidth', 0.1, 3.0, 0.1).name('Line Width');

    // View & Camera Folder
    const fView = gui.addFolder('View & Camera');
    guiControllers.zoom = fView.add(params, 'zoom', 0.2, 5.0, 0.05).name('Zoom (Wheel)');
    guiControllers.panX = fView.add(params, 'panX', -1000, 1000, 1).name('Pan X');
    guiControllers.panY = fView.add(params, 'panY', -1000, 1000, 1).name('Pan Y');
    guiControllers.dpr = fView.add(params, 'dpr', 0.5, 3.0, 0.1).name('DPR (Pixel Ratio)').onChange(updateCanvasSize);
    fView.add(params, 'resetView').name('Reset View');

    // Click Randomizer Mode Folder
    const fMode = gui.addFolder('Click Randomizer Mode');
    guiControllers.clickRandomizer = fMode.add(params, 'clickRandomizer').name('Randomize on Click');
    fMode.add(params, 'randomizeNow').name('Randomize Scene Now');

    // Handle Window Resize
    window.addEventListener('resize', updateCanvasSize);
    updateCanvasSize();

    // Main Render Animation Loop
    let time = 0;

    function animate() {
      requestAnimationFrame(animate);

      time += 0.015 * params.animSpeed;

      let forceX = width / 2;
      let forceY = height / 2;

      switch (params.animPreset) {
        case 'Static (No Auto Motion)':
          forceX = isMouseOver ? mouseWorldX : width / 2;
          forceY = isMouseOver ? mouseWorldY : height / 2;
          break;

        case 'Smooth Wave Orbital':
          forceX = width / 2 + Math.sin(time * 0.8) * (width * 0.32);
          forceY = height / 2 + Math.cos(time * 0.5) * (height * 0.24);
          break;

        case 'Expanding Vortex Pulse':
          const radius = (Math.min(width, height) * 0.25) * (1 + 0.35 * Math.sin(time * 1.2));
          forceX = width / 2 + Math.cos(time * 1.4) * radius;
          forceY = height / 2 + Math.sin(time * 1.4) * radius;
          break;

        case 'Harmonic Figure 8':
          forceX = width / 2 + Math.sin(time * 0.7) * (width * 0.36);
          forceY = height / 2 + Math.sin(time * 1.4) * (height * 0.22);
          break;

        case 'Sinusoidal Grid Scan':
          forceX = width / 2 + Math.sin(time * 0.5) * (width * 0.4);
          forceY = height / 2 + Math.cos(time * 1.1) * (height * 0.32);
          break;
      }

      if (params.animPreset !== 'Static (No Auto Motion)' && isMouseOver) {
        forceX = forceX * 0.6 + mouseWorldX * 0.4;
        forceY = forceY * 0.6 + mouseWorldY * 0.4;
      }

      ctx.save();
      ctx.scale(params.dpr, params.dpr);

      if (params.greenscreen) {
        ctx.fillStyle = '#00ff00';
        ctx.fillRect(0, 0, width, height);
      } else {
        ctx.fillStyle = params.bgColor;
        ctx.fillRect(0, 0, width, height);
      }

      ctx.translate(width / 2 + params.panX, height / 2 + params.panY);
      ctx.scale(params.zoom, params.zoom);
      ctx.translate(-width / 2, -height / 2);

      const dotRgb = hexToRgb(params.dotColor);
      const lineRgb = hexToRgb(params.lineColor);

      const maxForceDist = 170;

      for (let i = 0; i < dots.length; i++) {
        const dot = dots[i];

        const dx = forceX - dot.originalX;
        const dy = forceY - dot.originalY;
        const distance = Math.sqrt(dx * dx + dy * dy);

        if (distance < maxForceDist) {
          const force = (maxForceDist - distance) / maxForceDist;
          const angle = Math.atan2(dy, dx);
          const targetX = dot.originalX + Math.cos(angle) * force * params.maxDistortion;
          const targetY = dot.originalY + Math.sin(angle) * force * params.maxDistortion;

          dot.vx += (targetX - dot.x) * params.dampening;
          dot.vy += (targetY - dot.y) * params.dampening;
        } else {
          dot.vx += (dot.originalX - dot.x) * params.dampening;
          dot.vy += (dot.originalY - dot.y) * params.dampening;
        }

        dot.vx *= params.friction;
        dot.vy *= params.friction;

        dot.x += dot.vx;
        dot.y += dot.vy;
      }

      if (params.connectLines) {
        ctx.lineWidth = params.lineWidth;
        const lineMaxDist = params.spacing * 1.6;

        for (let i = 0; i < dots.length; i++) {
          const dot = dots[i];
          const distToForce = Math.sqrt((forceX - dot.x) ** 2 + (forceY - dot.y) ** 2);
          const gradient = 1 - Math.min(1, distToForce / 220);

          if ((i + 1) % cols !== 0) {
            const rightDot = dots[i + 1];
            const dist = Math.hypot(rightDot.x - dot.x, rightDot.y - dot.y);
            if (dist < lineMaxDist) {
              ctx.beginPath();
              ctx.strokeStyle = `rgba(${lineRgb.r}, ${lineRgb.g}, ${lineRgb.b}, ${0.1 + gradient * 0.35})`;
              ctx.moveTo(dot.x, dot.y);
              ctx.lineTo(rightDot.x, rightDot.y);
              ctx.stroke();
            }
          }

          if (i + cols < dots.length) {
            const bottomDot = dots[i + cols];
            const dist = Math.hypot(bottomDot.x - dot.x, bottomDot.y - dot.y);
            if (dist < lineMaxDist) {
              ctx.beginPath();
              ctx.strokeStyle = `rgba(${lineRgb.r}, ${lineRgb.g}, ${lineRgb.b}, ${0.1 + gradient * 0.35})`;
              ctx.moveTo(dot.x, dot.y);
              ctx.lineTo(bottomDot.x, bottomDot.y);
              ctx.stroke();
            }
          }
        }
      }

      for (let i = 0; i < dots.length; i++) {
        const dot = dots[i];
        const distToForce = Math.sqrt((forceX - dot.x) ** 2 + (forceY - dot.y) ** 2);
        const gradient = 1 - Math.min(1, distToForce / 220);

        const r = Math.min(255, Math.floor(dotRgb.r + gradient * 90));
        const g = Math.min(255, Math.floor(dotRgb.g + gradient * 90));
        const b = Math.min(255, Math.floor(dotRgb.b + gradient * 90));

        ctx.beginPath();
        ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
        ctx.arc(dot.x, dot.y, params.dotRadius + gradient * 2, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    animate();
  </script>
</body>
</html>
