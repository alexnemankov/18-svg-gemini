          if (scene.fog) scene.fog.density = 0;
        } else {
          const scheme = colorSchemes[params.colorScheme];
          const bgCol = scheme ? scheme.bg : params.fogColor;
          params.fogColor = bgCol;
          document.body.style.backgroundColor = bgCol;
          scene.background = new THREE.Color(bgCol);
          if (params.fogEnabled) {
            if (!scene.fog) scene.fog = new THREE.FogExp2(bgCol, params.fogDensity);
            scene.fog.color.set(bgCol);
            scene.fog.density = params.fogDensity;
          } else {
            scene.fog = null;
          }
        }
      });

      // 7. Atmospheric Mist & Fog Folder
      const fFog = gui.addFolder('Atmospheric Mist & Fog');
      fFog.add(params, 'fogEnabled').name('Enable Mist/Fog').onChange(val => {
        if (!params.greenscreen) {
          if (val) {
            if (!scene.fog) scene.fog = new THREE.FogExp2(params.fogColor, params.fogDensity);
            scene.fog.density = params.fogDensity;
            scene.fog.color.set(params.fogColor);
          } else {
            scene.fog = null;
          }
        }
      });
      fFog.add(params, 'fogDensity', 0.005, 0.15, 0.005).name('Mist Density').onChange(val => {
        if (scene.fog && !params.greenscreen) scene.fog.density = val;
      });
      fFog.addColor(params, 'fogColor').name('Mist Color').onChange(val => {
        if (!params.greenscreen) {
          if (scene.fog) scene.fog.color.set(val);
          scene.background.set(val);
          document.body.style.backgroundColor = val;
        }
      });

      fRender.add(params, 'dpr', 0.5, 3.0, 0.1).name('Pixel Ratio (DPR)').onChange(val => {
        renderer.setPixelRatio(val);
        if (postProcessor) {
          postProcessor.setSize(window.innerWidth, window.innerHeight, val);
        }
      });

      fRender.add(params, 'antialias').name('Antialias (default on)').onChange(val => {
        recreateRenderer(val);
      });

      // Attach Post-Processing Suite (PostProcessor.js)
      if (postProcessor) {
        postProcessor.attachGUI(gui, 'Post-Processing (PostProcessor.js)');
      }

      fRender.add(params, 'clickToRandomize').name('Click Scene: Randomize');
      fRender.add({ randomize: () => randomizeSceneVariation() }, 'randomize').name('Roll Random Variation');
    }

    function applyLightIntensities() {
      const master = params.masterLightIntensity;
      if (ambientLight) ambientLight.intensity = params.ambientIntensity * master;
      if (polypPointLight) polypPointLight.intensity = params.polypLightIntensity * master;
      if (bottomUpLight) bottomUpLight.intensity = params.bottomLightIntensity * master;
      if (rimLight) rimLight.intensity = params.rimLightIntensity * master;
      if (keyLight) keyLight.intensity = params.keyLightIntensity * master;
    }

    // =========================================================================
    // INFINITE ANIMATION LOOP
    // =========================================================================
    function animate() {
      requestAnimationFrame(animate);

      const dt = clock.getDelta();
      const elapsedTime = clock.getElapsedTime();
      const speed = params.animationSpeed;

      // Mouse velocity decay
      if (isMouseActive) {
        mouseDecayTimer -= dt;
        if (mouseDecayTimer <= 0) {
          mouseVelocity.multiplyScalar(0.88);
          if (mouseVelocity.lengthSq() < 0.0001) {
            isMouseActive = false;
          }
        }
      }

      // 1. Biological Heartbeat Pulse of Central Polyp
      const pulseTime = elapsedTime * 2.6 * params.pulseSpeed * speed;
      // Double systole-diastole organic heartbeat pulsation
      const systolic = Math.sin(pulseTime);
      const diastolic = 0.4 * Math.sin(pulseTime * 2.0 + 0.4);
      const heartbeat = (systolic + diastolic) * 0.15 * params.pulseIntensity;

      if (polypCoreMesh) {
        const coreScale = 1.0 + heartbeat * 0.8;
        polypCoreMesh.scale.set(coreScale, coreScale * 1.1, coreScale);
      }

      // Mantle bell biological undulation and skirt rippling
      if (polypMantleMesh && baseMantlePositions) {
        const mantlePositions = polypMantleMesh.geometry.attributes.position.array;
        const count = baseMantlePositions.length / 3;
        for (let i = 0; i < count; i++) {
          const i3 = i * 3;
          const bx = baseMantlePositions[i3];
          const by = baseMantlePositions[i3 + 1];
          const bz = baseMantlePositions[i3 + 2];

          // Height progress (1.25 down to 0.48)
          const v = Math.max(0, Math.min(1, (1.25 - by) / 0.77));
          if (v > 0.25) {
            const skirtFactor = Math.pow((v - 0.25) / 0.75, 1.6);
            const angle = Math.atan2(bz, bx);

            // Radial breathing pulsation + peristaltic contraction waves
            const contraction = 1.0 + (heartbeat * 0.45 + 0.04 * Math.sin(pulseTime * 1.4 - v * 4.5)) * skirtFactor;
            const waveY = Math.sin(angle * 8.0 + pulseTime * 2.0) * 0.02 * skirtFactor;

            mantlePositions[i3] = bx * contraction;
            mantlePositions[i3 + 1] = by + waveY;
            mantlePositions[i3 + 2] = bz * contraction;
          }
        }
        polypMantleMesh.geometry.attributes.position.needsUpdate = true;
        polypMantleMesh.geometry.computeVertexNormals();
      }

      // Visceral lobes breathing pulse
      if (vesicleMeshes && vesicleMeshes.length > 0) {
        vesicleMeshes.forEach((item, idx) => {
          const lobePulse = 1.0 + 0.18 * Math.sin(pulseTime * 1.2 + idx * 1.57);
          item.mesh.scale.set(0.9 * lobePulse, 1.4 * (1.6 - lobePulse * 0.6), 0.9 * lobePulse);
        });
      }

      if (polypPointLight) {
        polypPointLight.intensity = (params.polypLightIntensity + heartbeat * 2.0) * params.masterLightIntensity;
      }

      // 2. Pressure Gauge Needle Subtle Twitching
      if (pressureNeedle) {
        const gaugeJitter = Math.sin(elapsedTime * 4.0) * 0.08 + Math.sin(elapsedTime * 14.0) * 0.03;
        pressureNeedle.rotation.z = -0.4 + gaugeJitter;
      }

      // 3. Inverse Kinematics Tentacle Undulation
      updateTentacles(elapsedTime, dt);

      // 4. Bioluminescent Spores Convection & Mouse Turbulence
      updateSpores(elapsedTime, dt);

      // 5. Camera Motion Suite
      applyCameraAnimation(elapsedTime, dt);

      // 6. Smooth Controls Damping Update
      controls.update();

      // Update Three.js Godrays screen position from central polyp bioluminescent light
      if (postProcessor && postProcessor.settings.raysEnabled && polypPointLight) {
        postProcessor.setMoonScreenPosition(camera, polypPointLight.position);
      }

      // 7. Final Render Pipeline (PostProcessor.js Suite)
      if (postProcessor && postProcessor.settings.enabled) {
        postProcessor.renderScene(scene, camera);
      } else {
        renderer.render(scene, camera);
      }
    }

    // Start auto infinite animation loop
    animate();
  </script>
</body>
</html>
