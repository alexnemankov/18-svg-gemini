// Shaders: GLSL Code

const orthoVertexShader = `
precision highp float;
in vec3 position;
out vec2 vUv;
void main() {
  vUv = position.xy * 0.5 + 0.5;
  gl_Position = vec4(position, 1.0);
}
`;

const brightFragmentShader = `
precision highp float;
uniform sampler2D inputTexture;
uniform float bloomThreshold;
in vec2 vUv;
out vec4 fragColor;

void main() {
  vec4 color = texture(inputTexture, vUv);
  // Calculate relative luminance (Rec. 709)
  float luminance = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
  // Soft knee thresholding
  float knee = 0.1;
  float soft = luminance - bloomThreshold + knee;
  soft = clamp(soft, 0.0, 2.0 * knee);
  soft = (soft * soft) / (4.0 * knee + 0.00001);
  float contribution = max(soft, luminance - bloomThreshold);
  contribution /= max(luminance, 0.00001);
  fragColor = vec4(color.rgb * contribution, color.a);
}
`;

const blur13ShaderChunk = `
vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
  vec2 resolution = vec2(textureSize(image, 0));
  vec4 color = vec4(0.0);
  vec2 off1 = vec2(1.411764705882353) * direction;
  vec2 off2 = vec2(3.2941176470588234) * direction;
  vec2 off3 = vec2(5.176470588235294) * direction;
  color += texture(image, uv) * 0.1964825501511404;
  color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
  color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
  color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
  color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
  color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
  color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
  return color;
}
`;

const blurFragmentShader = `
precision highp float;
uniform sampler2D inputTexture;
uniform vec2 direction;
in vec2 vUv;
out vec4 color;
${blur13ShaderChunk}
void main() {
  color = blur13(inputTexture, vUv, direction);
}
`;

// Three.js Godrays Shaders (Crytek Sousa2008 / three/addons/shaders/GodRaysShader.js)
// -------------------------------------------------------------
const godRaysDepthMaskShader = `
precision highp float;
uniform sampler2D inputTexture;
uniform float threshold;
in vec2 vUv;
out vec4 fragColor;

void main() {
  vec4 color = texture(inputTexture, vUv);
  float lum = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
  float factor = smoothstep(threshold, threshold + 0.15, lum);
  fragColor = vec4(vec3(factor), 1.0);
}
`;

const godRaysGenerateShader = `
precision highp float;
#define TAPS_PER_PASS 6.0

uniform sampler2D inputTexture;
uniform vec3 vSunPositionScreenSpace;
uniform float fStepSize;
uniform float distanceAttenuation;
uniform float maxDensity;
in vec2 vUv;
out vec4 fragColor;

void main() {
  vec2 delta = vSunPositionScreenSpace.xy - vUv;
  float dist = length(delta);
  vec2 stepv = fStepSize * delta / max(dist, 0.0001);
  float iters = dist / max(fStepSize, 0.00001);

  vec2 uv = vUv;
  float col = 0.0;
  float f = min(1.0, max(vSunPositionScreenSpace.z, 0.0));

  float atten = 1.0 / (1.0 + pow(dist, distanceAttenuation));

  if (0.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
  uv += stepv;
  if (1.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
  uv += stepv;
  if (2.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
  uv += stepv;
  if (3.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
  uv += stepv;
  if (4.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
  uv += stepv;
  if (5.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;

  float finalVal = min(col / TAPS_PER_PASS * atten, maxDensity);
  fragColor = vec4(vec3(finalVal), 1.0);
}
`;

// -------------------------------------------------------------
// Three.js Anamorphic Flare Shaders (three/examples/webgpu_postprocessing_anamorphic.html)
// -------------------------------------------------------------
const anamorphicBrightShader = `
precision highp float;
uniform sampler2D inputTexture;
uniform float threshold;
uniform float smoothWidth;
in vec2 vUv;
out vec4 fragColor;

void main() {
  vec4 color = texture(inputTexture, vUv);
  float v = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
  float alpha = smoothstep(threshold, threshold + smoothWidth, v);
  fragColor = mix(vec4(0.0), color, alpha);
}
`;

const anamorphicBlurShader = `
precision highp float;
uniform sampler2D inputTexture;
uniform vec2 resolution;
uniform float samples;
uniform float intensity;
uniform vec3 tintColor;
uniform float bloomRadius;
in vec2 vUv;
out vec4 fragColor;

void main() {
  int halfSamples = max(1, int(samples) / 2);
  float fHalfSamples = float(halfSamples);
  vec2 invSize = 1.0 / resolution;
  vec4 total = vec4(0.0);

  for (int i = -64; i <= 64; i++) {
    if (i < -halfSamples || i > halfSamples) continue;
    float softness = 1.0 - abs(float(i)) / fHalfSamples;
    softness = pow(softness, 2.0);
    vec2 shiftedUV = vec2(vUv.x + invSize.x * float(i) * (4.0 + bloomRadius * 8.0), vUv.y);
    shiftedUV = clamp(shiftedUV, 0.001, 0.999);
    total += texture(inputTexture, shiftedUV) * softness;
  }

  fragColor = (total / (samples / 3.0)) * vec4(tintColor, 1.0) * intensity;
}
`;

const finalFragmentShader = `
precision highp float;
uniform vec2 resolution;
uniform sampler2D inputTexture;
uniform sampler2D blur0Texture;
uniform sampler2D blur1Texture;
uniform sampler2D blur2Texture;
uniform sampler2D blur3Texture;
uniform sampler2D blur4Texture;
uniform sampler2D raysTexture;
uniform sampler2D anamorphicTexture;
uniform bool bloomEnabled;
uniform float bloomStrength;
uniform bool raysEnabled;
uniform float raysStrength;
uniform vec3 raysColor;
uniform bool anamorphicEnabled;
uniform float vignetteBoost;
uniform float vignetteReduction;
uniform float noiseIntensity;
uniform float time;
in vec2 vUv;
out vec4 fragColor;

float vignette(vec2 uv, float boost, float reduction) {
  vec2 position = vUv - 0.5;
  return boost - length(position) * reduction;
}

float hash1(uint n) {
  n = (n << 13U) ^ n;
  n = n * (n * n * 15731U + 789221U) + 1376312589U;
  return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
}

float noise(in vec2 uv, in float timeVal) {
  uvec2 p = uvec2(uv);
  return hash1(p.x + 1920U * p.y + (1920U * 1080U) * uint(timeVal));
}

void main() {
  vec4 color = texture(inputTexture, vUv);

  if (bloomEnabled && bloomStrength > 0.001) {
    vec4 b0 = texture(blur0Texture, vUv);
    vec4 b1 = texture(blur1Texture, vUv);
    vec4 b2 = texture(blur2Texture, vUv);
    vec4 b3 = texture(blur3Texture, vUv);
    vec4 b4 = texture(blur4Texture, vUv);

    vec4 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
    color += bloomSum * bloomStrength;
  }

  // Three.js Godrays composite (additive with color tint & intensity attenuation)
  if (raysEnabled && raysStrength > 0.001) {
    vec4 r = texture(raysTexture, vUv);
    color.rgb += r.rgb * raysColor * raysStrength;
  }

  // Three.js Anamorphic bloom composite (high-pass streak filter)
  if (anamorphicEnabled) {
    vec4 a = texture(anamorphicTexture, vUv);
    color.rgb += a.rgb;
  }

  color.rgb *= vignette(vUv, vignetteBoost, vignetteReduction);
  color.rgb += noiseIntensity * noise(gl_FragCoord.xy, time);
  fragColor = vec4(color.rgb, 1.0);
}
`;

const chromaticAberrationShaderChunk = `
vec2 barrelDistortion(vec2 coord, float amt) {
  vec2 cc = coord - 0.5;
  float dist = dot(cc, cc);
  return coord + cc * dist * amt;
}
float sat(float t) { return clamp(t, 0.0, 1.0); }
float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
vec4 spectrum_offset(float t) {
  float lo = step(t, 0.5);
  float hi = 1.0 - lo;
  float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
  vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
  return pow(ret, vec4(1.0 / 2.2));
}
const float max_distort = 2.2;
const int num_iter = 8;
const float reci_num_iter_f = 1.0 / float(num_iter);
vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
  vec4 sumcol = vec4(0.0);
  vec4 sumw = vec4(0.0);
  for (int i = 0; i < num_iter; ++i) {
    float t = float(i) * reci_num_iter_f;
    vec4 w = spectrum_offset(t);
    sumw += w;
    sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
  }
  return sumcol / sumw;
}
`;

const colorFragmentShader = `
precision highp float;
uniform sampler2D inputTexture;
uniform float chromaticAberrationAmount;
uniform float minInputLevel;
uniform float maxInputLevel;
uniform float gammaLevel;
uniform float exposure;
uniform float fisheyeStrength;
uniform float fisheyeRadius;
uniform float time;
uniform int visionMode;
uniform float thermalSensitivity;
uniform float nightVisionNoise;
uniform float nightVisionGain;
uniform float crtIntensity;
in vec2 vUv;
out vec4 fragColor;

${chromaticAberrationShaderChunk}

vec2 applyFisheye(vec2 uv, float strength, float radius) {
  if (abs(strength) < 0.0001) return uv;
  vec2 p = uv - 0.5;
  float d = length(p);
  if (d > radius * 1.5) return uv;
  float r = d / max(radius, 0.001);
  float theta = atan(p.y, p.x);
  float rDist = r + strength * (r * r * r);
  return 0.5 + vec2(cos(theta), sin(theta)) * (rDist * radius);
}

vec3 ACESFilmicToneMapping(vec3 color) {
  float a = 2.51;
  float b = 0.03;
  float c = 2.43;
  float d = 0.59;
  float e = 0.14;
  return clamp((color * (a * color + b)) / (color * (c * color + d) + e), 0.0, 1.0);
}

vec3 gammaCorrect(vec3 color, vec3 gamma) {
  return pow(max(color, vec3(0.0)), 1.0 / gamma);
}
vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
  return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
}
vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
  return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
}

vec3 applyNightVision(vec3 color, vec2 uv, float timeVal, float noiseAmt, float gain, float crt) {
  float lum = dot(color, vec3(0.299, 0.587, 0.114));
  
  // High-gain night vision amplifier
  float amplified = pow(lum * gain, 0.72);
  
  // Phosphor green palette (P43 phosphor)
  vec3 phosphorColor = mix(vec3(0.02, 0.12, 0.03), vec3(0.18, 1.0, 0.32), clamp(amplified, 0.0, 1.0));
  // Saturated bright highlights
  phosphorColor += vec3(0.7, 1.0, 0.8) * max(0.0, amplified - 0.75) * 1.8;
  
  // Circular Dual-Tube NVG Mask
  vec2 p = uv - 0.5;
  float tubeDist = length(p);
  float tubeMask = smoothstep(0.72, 0.44, tubeDist);
  
  // Amplification grain & CRT scanlines (CRT lines are 0.0 by default)
  float n = fract(sin(dot(uv * 280.0 + timeVal * 0.05, vec2(12.9898, 78.233))) * 43758.5453);
  float scanline = sin(uv.y * 650.0) * crt;
  
  phosphorColor += (n - 0.5) * noiseAmt * 2.0 + scanline;
  return clamp(phosphorColor * tubeMask, 0.0, 1.0);
}

vec3 ironbow(float t) {
  t = clamp(t, 0.0, 1.0);
  vec3 c0 = vec3(0.02, 0.01, 0.18);
  vec3 c1 = vec3(0.22, 0.02, 0.48);
  vec3 c2 = vec3(0.82, 0.05, 0.25);
  vec3 c3 = vec3(1.0, 0.62, 0.02);
  vec3 c4 = vec3(1.0, 1.0, 0.92);
  
  if (t < 0.25) return mix(c0, c1, t * 4.0);
  if (t < 0.50) return mix(c1, c2, (t - 0.25) * 4.0);
  if (t < 0.75) return mix(c2, c3, (t - 0.50) * 4.0);
  return mix(c3, c4, (t - 0.75) * 4.0);
}

vec3 applyThermal(vec3 color, vec2 uv, float sensitivity, float crt, bool whiteHot) {
  float lum = dot(color, vec3(0.299, 0.587, 0.114));
  float heat = clamp(lum * sensitivity, 0.0, 1.0);
  float sensorRaster = sin(uv.y * 900.0) * (crt * 0.3);
  heat = clamp(heat + sensorRaster, 0.0, 1.0);
  
  if (whiteHot) {
    float grad = pow(heat, 0.85);
    return vec3(grad);
  } else {
    return ironbow(heat);
  }
}

void main() {
  vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
  vec4 col = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
  vec3 finalCol = col.rgb;
  
  if (visionMode == 1) {
    // Night Vision Mode
    finalCol = applyNightVision(finalCol, uv, time, nightVisionNoise, nightVisionGain, crtIntensity);
  } else if (visionMode == 2) {
    // Thermal Vision (Ironbow FLIR)
    finalCol = applyThermal(finalCol, uv, thermalSensitivity, crtIntensity, false);
  } else if (visionMode == 3) {
    // Thermal Vision (White-Hot FLIR)
    finalCol = applyThermal(finalCol, uv, thermalSensitivity, crtIntensity, true);
  } else {
    // Normal Mode: Camera Exposure and ACES Filmic tone mapping
    vec3 exposedColor = finalCol * exposure;
    vec3 toneMappedColor = ACESFilmicToneMapping(exposedColor);
    finalCol = finalLevels(toneMappedColor, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
  }

  fragColor = vec4(finalCol, 1.0);
}
`;

const copyFragmentShader = `
precision highp float;
uniform sampler2D inputTexture;
in vec2 vUv;
out vec4 fragColor;
void main() {
  fragColor = texture(inputTexture, vUv);
}
`;

// -------------------------------------------------------------
// Helper Classes (FBO & Passes)
// -------------------------------------------------------------
function createFBO(w, h, options = {}) {
  return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
    wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
    wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
    minFilter: options.minFilter || THREE.LinearFilter,
    magFilter: options.magFilter || THREE.LinearFilter,
    format: options.format || THREE.RGBAFormat,
    type: options.type || THREE.HalfFloatType,
    stencilBuffer: options.stencilBuffer || false,
    depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : true,
    samples: options.samples || 0,
  });
}

class ShaderPass {
  constructor(shader, options = {}) {
    this.shader = shader;
    this.orthoScene = new THREE.Scene();
    this.fbo = createFBO(1, 1, options);
    this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
    this.orthoScene.add(this.orthoQuad);
    this.texture = this.fbo.texture;
  }
  render(renderer, toScreen = false) {
    if (!toScreen) {
      renderer.setRenderTarget(this.fbo);
    }
    renderer.render(this.orthoScene, this.orthoCamera);
    if (!toScreen) {
      renderer.setRenderTarget(null);
    }
  }
  setSize(width, height) {
    this.fbo.setSize(Math.max(1, width), Math.max(1, height));
    this.orthoQuad.scale.set(width, height, 1);
  }
}

class ShaderPingPongPass {
  constructor(shader, options = {}) {
    this.shader = shader;
    this.orthoScene = new THREE.Scene();
    this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
    this.currentFBO = 0;
    this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
    this.orthoScene.add(this.orthoQuad);
  }
  render(renderer) {
    renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
    renderer.render(this.orthoScene, this.orthoCamera);
    renderer.setRenderTarget(null);
    this.currentFBO = 1 - this.currentFBO;
  }
  get current() { return this.fbos[this.currentFBO]; }
  get texture() { return this.current.texture; }
  setSize(width, height) {
    const w = Math.max(1, width);
    const h = Math.max(1, height);
    this.orthoQuad.scale.set(w, h, 1);
    this.fbos[0].setSize(w, h);
    this.fbos[1].setSize(w, h);
  }
}

class BloomPass {
  constructor(strength = 0.8, radius = 0.5, threshold = 0.2, levels = 5) {
    this.strength = strength;
    this.radius = radius;
    this.threshold = threshold;
    this.enabled = true;
    this.levels = levels;

    this.brightShader = new THREE.RawShaderMaterial({
      uniforms: {
        inputTexture: { value: null },
        bloomThreshold: { value: this.threshold },
      },
      vertexShader: orthoVertexShader,
      fragmentShader: brightFragmentShader,
      glslVersion: THREE.GLSL3,
    });
    this.brightPass = new ShaderPass(this.brightShader, {
      format: THREE.RGBAFormat,
      type: THREE.HalfFloatType,
    });

    this.blurShader = new THREE.RawShaderMaterial({
      uniforms: {
        inputTexture: { value: null },
        direction: { value: new THREE.Vector2(0, 1) },
      },
      vertexShader: orthoVertexShader,
      fragmentShader: blurFragmentShader,
      glslVersion: THREE.GLSL3,
    });

    this.blurPasses = [];
    for (let i = 0; i < this.levels; i++) {
      this.blurPasses.push(new ShaderPingPongPass(this.blurShader, {
        format: THREE.RGBAFormat,
        type: THREE.HalfFloatType,
      }));
    }
  }

  setSize(w, h) {
    let tw = Math.max(1, w);
    let th = Math.max(1, h);
    this.brightPass.setSize(tw, th);
    for (let i = 0; i < this.levels; i++) {
      tw = Math.max(1, Math.round(tw / 2));
      th = Math.max(1, Math.round(th / 2));
      this.blurPasses[i].setSize(tw, th);
    }
  }

  set source(texture) {
    this.brightShader.uniforms.inputTexture.value = texture;
  }

  render(renderer) {
    if (!this.enabled || this.strength <= 0.001) return;

    this.brightShader.uniforms.bloomThreshold.value = this.threshold;
    this.brightPass.render(renderer);

    const baseOffset = Math.max(0.1, this.radius * 2.0);
    const u = this.blurShader.uniforms;

    for (let j = 0; j < this.levels; j++) {
      const blurPass = this.blurPasses[j];
      const stepOffset = baseOffset * (1.0 + j * 0.5);

      // Horizontal blur pass
      u.direction.value.set(stepOffset, 0);
      u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
      blurPass.render(renderer);

      // Vertical blur pass
      u.direction.value.set(0, stepOffset * 0.5);
      u.inputTexture.value = blurPass.current.texture;
      blurPass.render(renderer);
    }
  }
}

const VISION_MODE_MAP = {
  'Normal (Cinematic)': 0,
  'Night Vision (Phosphor)': 1,
  'Thermal (Ironbow)': 2,
  'Thermal (White-Hot)': 3,
};

// -------------------------------------------------------------
// Main Export Class
// -------------------------------------------------------------
export class PostProcessor {
  constructor(renderer, params = {}) {
    this.renderer = renderer;

    this.settings = {
      // Global Switch
      enabled: params.enabled !== undefined ? params.enabled : true,

      // 1. Universal 3-Param Bloom Engine
      bloomEnabled: params.bloomEnabled !== undefined ? params.bloomEnabled : true,
      bloomStrength: params.bloomStrength !== undefined ? params.bloomStrength : 1.2,
      bloomRadius: params.bloomRadius !== undefined ? params.bloomRadius : 0.6,
      bloomThreshold: params.bloomThreshold !== undefined ? params.bloomThreshold : 0.15,

      // 2. Three.js Godrays Settings (Crytek multi-pass / webgl_postprocessing_godrays.html & GodRaysShader.js)
      raysEnabled: params.raysEnabled !== undefined ? params.raysEnabled : true,
      raysStrength: params.raysStrength !== undefined ? params.raysStrength : 0.85,
      raysDensity: params.raysDensity !== undefined ? params.raysDensity : 1.0,
      raysMaxDensity: params.raysMaxDensity !== undefined ? params.raysMaxDensity : 0.5,
      raysDistanceAttenuation: params.raysDistanceAttenuation !== undefined ? params.raysDistanceAttenuation : 2.0,
      raysThreshold: params.raysThreshold !== undefined ? params.raysThreshold : 0.12,
      raysColor: params.raysColor ? (params.raysColor.isColor ? params.raysColor.clone() : new THREE.Color(params.raysColor)) : new THREE.Color(0xf6aa1c),
      raysColorHex: params.raysColorHex || (typeof params.raysColor === 'string' ? params.raysColor : '#f6aa1c'),

      // 3. Three.js Anamorphic Flare Settings (webgpu_postprocessing_anamorphic.html)
      anamorphicEnabled: params.anamorphicEnabled !== undefined ? params.anamorphicEnabled : true,
      anamorphicIntensity: params.anamorphicIntensity !== undefined ? params.anamorphicIntensity : (params.anamorphicStrength !== undefined ? params.anamorphicStrength * 2.5 : 5.0),
      anamorphicThreshold: params.anamorphicThreshold !== undefined ? params.anamorphicThreshold : 0.3,
      anamorphicSamples: params.anamorphicSamples !== undefined ? params.anamorphicSamples : 64,
      anamorphicRadius: params.anamorphicRadius !== undefined ? params.anamorphicRadius : 0.0,
      anamorphicSmoothWidth: params.anamorphicSmoothWidth !== undefined ? params.anamorphicSmoothWidth : 0.05,
      anamorphicColor: params.anamorphicColor ? (params.anamorphicColor.isColor ? params.anamorphicColor.clone() : new THREE.Color(params.anamorphicColor)) : new THREE.Color(0x7a8aff),
      anamorphicColorHex: params.anamorphicColorHex || '#7a8aff',

      // 4. Special Vision Modes
      visionMode: params.visionMode !== undefined ? params.visionMode : 'Normal (Cinematic)',
      thermalSensitivity: params.thermalSensitivity !== undefined ? params.thermalSensitivity : 1.4,
      nightVisionGain: params.nightVisionGain !== undefined ? params.nightVisionGain : 2.1,
      nightVisionNoise: params.nightVisionNoise !== undefined ? params.nightVisionNoise : 0.05,
      crtIntensity: params.crtIntensity !== undefined ? params.crtIntensity : 0.0,

      // 5. Lens & Camera Optics
      fisheyeStrength: params.fisheyeStrength !== undefined ? params.fisheyeStrength : 0.0,
      fisheyeRadius: params.fisheyeRadius !== undefined ? params.fisheyeRadius : 1.0,
      chromaticAberration: params.chromaticAberration !== undefined ? params.chromaticAberration : 0.02,
      vignetteBoost: params.vignetteBoost !== undefined ? params.vignetteBoost : 1.1,
      vignetteReduction: params.vignetteReduction !== undefined ? params.vignetteReduction : 0.65,
      noiseIntensity: params.noiseIntensity !== undefined ? params.noiseIntensity : 0.015,

      // 6. Color Grading, Exposure & Tone
      gamma: params.gamma !== undefined ? params.gamma : 1.0,
      minInputLevel: params.minInputLevel !== undefined ? params.minInputLevel : 0.0,
      maxInputLevel: params.maxInputLevel !== undefined ? params.maxInputLevel : 1.0,
      exposure: params.exposure !== undefined ? params.exposure : 1.0,
    };

    this.sceneTarget = createFBO(1, 1, { type: THREE.HalfFloatType });

    this.bloomPass = new BloomPass(
      this.settings.bloomStrength,
      this.settings.bloomRadius,
      this.settings.bloomThreshold,
      5
    );

    this.moonScreenPos = new THREE.Vector3(0.5, 0.7, 1.0);
    this.moonInFront = true;

    // Three.js Godrays Passes
    this.godRaysMaskShader = new THREE.RawShaderMaterial({
      uniforms: {
        inputTexture: { value: null },
        threshold: { value: this.settings.raysThreshold },
      },
      vertexShader: orthoVertexShader,
      fragmentShader: godRaysDepthMaskShader,
      glslVersion: THREE.GLSL3,
    });
    this.godRaysMaskPass = new ShaderPass(this.godRaysMaskShader, {
      format: THREE.RGBAFormat,
      type: THREE.HalfFloatType,
    });

    this.godRaysGenShader = new THREE.RawShaderMaterial({
      uniforms: {
        inputTexture: { value: null },
        vSunPositionScreenSpace: { value: this.moonScreenPos },
        fStepSize: { value: 1.0 },
        distanceAttenuation: { value: this.settings.raysDistanceAttenuation },
        maxDensity: { value: this.settings.raysMaxDensity },
      },
      vertexShader: orthoVertexShader,
      fragmentShader: godRaysGenerateShader,
      glslVersion: THREE.GLSL3,
    });
    this.godRaysPingPong = new ShaderPingPongPass(this.godRaysGenShader, {
      format: THREE.RGBAFormat,
      type: THREE.HalfFloatType,
    });

    // Three.js Anamorphic Flare Passes
    this.anamorphicBrightShader = new THREE.RawShaderMaterial({
      uniforms: {
        inputTexture: { value: null },
        threshold: { value: this.settings.anamorphicThreshold },
        smoothWidth: { value: this.settings.anamorphicSmoothWidth },
      },
      vertexShader: orthoVertexShader,
      fragmentShader: anamorphicBrightShader,
      glslVersion: THREE.GLSL3,
    });
    this.anamorphicBrightPass = new ShaderPass(this.anamorphicBrightShader, {
      format: THREE.RGBAFormat,
      type: THREE.HalfFloatType,
    });

    this.anamorphicBlurShader = new THREE.RawShaderMaterial({
      uniforms: {
        inputTexture: { value: null },
        resolution: { value: new THREE.Vector2(1, 1) },
        samples: { value: this.settings.anamorphicSamples },
        intensity: { value: this.settings.anamorphicIntensity },
        tintColor: { value: this.settings.anamorphicColor },
        bloomRadius: { value: this.settings.anamorphicRadius },
      },
      vertexShader: orthoVertexShader,
      fragmentShader: anamorphicBlurShader,
      glslVersion: THREE.GLSL3,
    });
    this.anamorphicBlurPass = new ShaderPass(this.anamorphicBlurShader, {
      format: THREE.RGBAFormat,
      type: THREE.HalfFloatType,
    });

    this.finalShader = new THREE.RawShaderMaterial({
      uniforms: {
        resolution: { value: new THREE.Vector2(1, 1) },
        bloomEnabled: { value: this.settings.bloomEnabled },
        bloomStrength: { value: this.settings.bloomStrength },
        raysEnabled: { value: this.settings.raysEnabled },
        raysStrength: { value: this.settings.raysStrength },
        raysColor: { value: this.settings.raysColor },
        anamorphicEnabled: { value: this.settings.anamorphicEnabled },
        vignetteBoost: { value: this.settings.vignetteBoost },
        vignetteReduction: { value: this.settings.vignetteReduction },
        noiseIntensity: { value: this.settings.noiseIntensity },
        inputTexture: { value: null },
        blur0Texture: { value: null },
        blur1Texture: { value: null },
        blur2Texture: { value: null },
        blur3Texture: { value: null },
        blur4Texture: { value: null },
        raysTexture: { value: null },
        anamorphicTexture: { value: null },
        time: { value: 0 },
      },
      vertexShader: orthoVertexShader,
      fragmentShader: finalFragmentShader,
      glslVersion: THREE.GLSL3,
    });
    this.finalPass = new ShaderPass(this.finalShader);

    this.rgbShader = new THREE.RawShaderMaterial({
      uniforms: {
        inputTexture: { value: this.finalPass.texture },
        fisheyeStrength: { value: this.settings.fisheyeStrength },
        fisheyeRadius: { value: this.settings.fisheyeRadius },
        chromaticAberrationAmount: { value: this.settings.chromaticAberration },
        minInputLevel: { value: this.settings.minInputLevel },
        maxInputLevel: { value: this.settings.maxInputLevel },
        gammaLevel: { value: this.settings.gamma },
        exposure: { value: this.settings.exposure },
        visionMode: { value: VISION_MODE_MAP[this.settings.visionMode] ?? 0 },
        thermalSensitivity: { value: this.settings.thermalSensitivity },
        nightVisionGain: { value: this.settings.nightVisionGain },
        nightVisionNoise: { value: this.settings.nightVisionNoise },
        crtIntensity: { value: this.settings.crtIntensity },
        time: { value: 0 },
      },
      vertexShader: orthoVertexShader,
      fragmentShader: colorFragmentShader,
      glslVersion: THREE.GLSL3,
    });

    this.copyShader = new THREE.RawShaderMaterial({
      uniforms: {
        inputTexture: { value: null },
      },
      vertexShader: orthoVertexShader,
      fragmentShader: copyFragmentShader,
      glslVersion: THREE.GLSL3,
    });
    this.copyPass = new ShaderPass(this.copyShader);
  }

  updateSettings() {
    this.bloomPass.enabled = this.settings.bloomEnabled;
    this.bloomPass.strength = this.settings.bloomStrength;
    this.bloomPass.radius = this.settings.bloomRadius;
    this.bloomPass.threshold = this.settings.bloomThreshold;

    this.godRaysMaskShader.uniforms.threshold.value = this.settings.raysThreshold;
    this.godRaysGenShader.uniforms.distanceAttenuation.value = this.settings.raysDistanceAttenuation;
    this.godRaysGenShader.uniforms.maxDensity.value = this.settings.raysMaxDensity;

    this.anamorphicBrightShader.uniforms.threshold.value = this.settings.anamorphicThreshold;
    this.anamorphicBrightShader.uniforms.smoothWidth.value = this.settings.anamorphicSmoothWidth;
    this.anamorphicBlurShader.uniforms.samples.value = this.settings.anamorphicSamples;
    this.anamorphicBlurShader.uniforms.intensity.value = this.settings.anamorphicIntensity;
    this.anamorphicBlurShader.uniforms.tintColor.value.copy(this.settings.anamorphicColor);
    this.anamorphicBlurShader.uniforms.bloomRadius.value = this.settings.anamorphicRadius;

    this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
    this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
    this.finalShader.uniforms.raysEnabled.value = this.settings.raysEnabled && this.moonInFront;
    this.finalShader.uniforms.raysStrength.value = this.settings.raysStrength;
    this.finalShader.uniforms.raysColor.value.copy(this.settings.raysColor);
    this.finalShader.uniforms.anamorphicEnabled.value = this.settings.anamorphicEnabled;
    this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
    this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
    this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;

    this.rgbShader.uniforms.fisheyeStrength.value = this.settings.fisheyeStrength;
    this.rgbShader.uniforms.fisheyeRadius.value = this.settings.fisheyeRadius;
    this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
    this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
    this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
    this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
    this.rgbShader.uniforms.exposure.value = this.settings.exposure;
    this.rgbShader.uniforms.visionMode.value = VISION_MODE_MAP[this.settings.visionMode] ?? 0;
    this.rgbShader.uniforms.thermalSensitivity.value = this.settings.thermalSensitivity;
    this.rgbShader.uniforms.nightVisionGain.value = this.settings.nightVisionGain;
    this.rgbShader.uniforms.nightVisionNoise.value = this.settings.nightVisionNoise;
    this.rgbShader.uniforms.crtIntensity.value = this.settings.crtIntensity;
  }

  setSize(w0, h0, dpr = 1) {
    const w = Math.max(1, Math.floor(w0 * dpr));
    const h = Math.max(1, Math.floor(h0 * dpr));
    this.sceneTarget.setSize(w, h);
    this.finalPass.setSize(w, h);
    this.finalShader.uniforms.resolution.value.set(w, h);
    this.bloomPass.setSize(w, h);

    const grW = Math.max(1, Math.round(w / 2));
    const grH = Math.max(1, Math.round(h / 2));
    this.godRaysMaskPass.setSize(grW, grH);
    this.godRaysPingPong.setSize(grW, grH);

    const anW = Math.max(1, Math.round(w / 4));
    const anH = Math.max(1, Math.round(h / 4));
    this.anamorphicBrightPass.setSize(anW, anH);
    this.anamorphicBlurPass.setSize(anW, anH);
    this.anamorphicBlurShader.uniforms.resolution.value.set(anW, anH);

    this.rgbPass.setSize(w, h);
    this.copyPass.setSize(w, h);
  }

  setMoonScreenPosition(camera, moonWorldPos) {
    if (!this._camDir) {
      this._camDir = new THREE.Vector3();
      this._toMoon = new THREE.Vector3();
      this._ndc = new THREE.Vector3();
    }
    camera.getWorldDirection(this._camDir);
    this._toMoon.copy(moonWorldPos).sub(camera.position).normalize();
    const dot = this._camDir.dot(this._toMoon);

    if (dot <= 0.02) {
      this.moonInFront = false;
      this.finalShader.uniforms.raysEnabled.value = false;
      return;
    }

    this.moonInFront = true;
    const fade = THREE.MathUtils.clamp((dot - 0.02) / 0.15, 0.0, 1.0);

    this._ndc.copy(moonWorldPos).project(camera);
    const screenX = this._ndc.x * 0.5 + 0.5;
    const screenY = this._ndc.y * 0.5 + 0.5;
    const screenZ = fade;

    this.moonScreenPos.set(screenX, screenY, screenZ);
    this.godRaysGenShader.uniforms.vSunPositionScreenSpace.value.set(screenX, screenY, screenZ);
  }

  renderScene(scene, camera) {
    if (!this.settings.enabled) {
      this.renderer.render(scene, camera);
      return;
    }
    this.renderer.setRenderTarget(this.sceneTarget);
    this.renderer.render(scene, camera);
    this.renderer.setRenderTarget(null);
    this.render(this.sceneTarget.texture);
  }

  render(sourceTexture) {
    if (!this.settings.enabled) {
      this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
      this.copyPass.render(this.renderer, true);
      return;
    }

    this.updateSettings();

    // 1. Atmospheric Bloom
    this.bloomPass.source = sourceTexture;
    this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
    this.bloomPass.render(this.renderer);

    this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
    this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
    this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
    this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
    this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

    // 2. Three.js Godrays (3 Ping-Pong Passes: 6^3 = 216 effective samples)
    if (this.settings.raysEnabled && this.settings.raysStrength > 0.001 && this.moonInFront) {
      this.godRaysMaskShader.uniforms.inputTexture.value = sourceTexture;
      this.godRaysMaskShader.uniforms.threshold.value = this.settings.raysThreshold;
      this.godRaysMaskPass.render(this.renderer);

      const filterLen = this.settings.raysDensity;
      const tapsPerPass = 6.0;

      // Pass 1
      this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -1.0);
      this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysMaskPass.texture;
      this.godRaysPingPong.render(this.renderer);

      // Pass 2
      this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -2.0);
      this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysPingPong.texture;
      this.godRaysPingPong.render(this.renderer);

      // Pass 3
      this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -3.0);
      this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysPingPong.texture;
      this.godRaysPingPong.render(this.renderer);

      this.finalPass.shader.uniforms.raysTexture.value = this.godRaysPingPong.texture;
      this.finalPass.shader.uniforms.raysEnabled.value = true;
    } else {
      this.finalPass.shader.uniforms.raysEnabled.value = false;
    }

    // 3. Three.js Anamorphic Flare (High Pass + Quadratic Softness Horizontal Blur)
    if (this.settings.anamorphicEnabled && this.settings.anamorphicIntensity > 0.001) {
      this.anamorphicBrightShader.uniforms.inputTexture.value = sourceTexture;
      this.anamorphicBrightShader.uniforms.threshold.value = this.settings.anamorphicThreshold;
      this.anamorphicBrightShader.uniforms.smoothWidth.value = this.settings.anamorphicSmoothWidth;
      this.anamorphicBrightPass.render(this.renderer);

      this.anamorphicBlurShader.uniforms.inputTexture.value = this.anamorphicBrightPass.texture;
      this.anamorphicBlurShader.uniforms.samples.value = this.settings.anamorphicSamples;
      this.anamorphicBlurShader.uniforms.intensity.value = this.settings.anamorphicIntensity;
      this.anamorphicBlurShader.uniforms.tintColor.value.copy(this.settings.anamorphicColor);
      this.anamorphicBlurShader.uniforms.bloomRadius.value = this.settings.anamorphicRadius;
      this.anamorphicBlurPass.render(this.renderer);

      this.finalPass.shader.uniforms.anamorphicTexture.value = this.anamorphicBlurPass.texture;
      this.finalPass.shader.uniforms.anamorphicEnabled.value = true;
    } else {
      this.finalPass.shader.uniforms.anamorphicEnabled.value = false;
    }

    const randomTime = Math.random() * 100000;
    this.finalPass.shader.uniforms.time.value = randomTime;
    this.rgbPass.shader.uniforms.time.value = randomTime;

    this.finalPass.render(this.renderer);
    this.rgbPass.render(this.renderer, true);
  }

    // 4. Atmospheric Bloom

    return root;

        powerPreference: 'high-performance'

      renderer.toneMapping = THREE.ACESFilmicToneMapping;

      sporesGroup = new THREE.Group();
      lightsGroup = new THREE.Group();

      scene.add(specimenJarGroup);
      scene.add(polypGroup);
      scene.add(sporesGroup);
      scene.add(lightsGroup);

      // Initialize PostProcessor Suite from postprocessing/PostProcessor.js
      postProcessor = new PostProcessor(renderer, {
        enabled: true,
        bloomEnabled: true,
        bloomStrength: 0.95,
        bloomRadius: 0.55,

      });
      postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);
    }

    function recreateRenderer(enableAntialias) {
      const oldCanvas = renderer.domElement;
      renderer.dispose();

      renderer = new THREE.WebGLRenderer({
        antialias: enableAntialias,
        alpha: true,
        powerPreference: 'high-performance'
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(params.dpr);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = params.exposure;
      renderer.outputColorSpace = THREE.SRGBColorSpace;

      container.replaceChild(renderer.domElement, oldCanvas);

      // Preserve fog & background
      if (params.greenscreen) {
        scene.background = new THREE.Color('#00ff00');
        scene.fog = null;
        document.body.style.backgroundColor = '#00ff00';
      } else {
        scene.background = new THREE.Color(params.fogColor);
        scene.fog = params.fogEnabled ? new THREE.FogExp2(params.fogColor, params.fogDensity) : null;
        document.body.style.backgroundColor = params.fogColor;
      }

      // Re-link controls
      controls.domElement = renderer.domElement;
      controls.update();

      if (postProcessor) {
        postProcessor.renderer = renderer;
        postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);
      }

      // Re-generate Environment
      createEnvironment();

      // Re-bind listeners
      setupInputListeners();
    }

    // =========================================================================
    // PROCEDURAL THICKNESS & SCRATCH MAP FOR GLASS TRANSMISSION
    // =========================================================================
    function generateGlassThicknessTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      // Base glass thickness
      ctx.fillStyle = '#9e9e9e';
      ctx.fillRect(0, 0, 512, 512);

      // Meniscus density gradient at top and bottom rims
      const grad = ctx.createLinearGradient(0, 0, 0, 512);
      grad.addColorStop(0.0, 'rgba(255, 255, 255, 0.75)');
      grad.addColorStop(0.08, 'rgba(160, 160, 160, 0.1)');
      grad.addColorStop(0.92, 'rgba(160, 160, 160, 0.1)');
      grad.addColorStop(1.0, 'rgba(255, 255, 255, 0.85)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 512);

      // Subtle vertical lathe / glass-blowing striations
      ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
      for (let x = 0; x < 512; x += 4) {
        const thickness = 1 + Math.sin(x * 0.08) * 1.5;
        ctx.fillRect(x, 0, thickness, 512);
      }

      // Microscopic bubble inclusions & glass imperfections
      ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
      for (let i = 0; i < 75; i++) {
        const x = Math.random() * 512;
        const y = Math.random() * 512;
        const r = 0.8 + Math.random() * 2.2;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.ClampToEdgeWrapping;
      texture.needsUpdate = true;
      return texture;
    }

      dialFace.add(pressureNeedle);
    }

    // =========================================================================
    // BIOLUMINESCENT LIVING POLYP ANATOMY
    // Parametric undulating mantle bell, inner glowing bio-nucleus, visceral lobes & oral arms
    // =========================================================================
    function createPolypMantleGeometry(slices = 36, radialSegments = 36) {
      const positions = [];
      const uvs = [];
      const indices = [];

      for (let i = 0; i <= slices; i++) {
        const v = i / slices; // 0 = apex top, 1 = skirt rim
        // y extends from 1.25 down to 0.48
        const y = 1.25 - v * 0.77;

        // Organic bell contour:
        // Narrow top neck (v=0 -> 0.22) -> swelling bulbous mantle (v=0.22 -> 0.75) -> undulating skirt rim (v=0.75 -> 1.0)
        let r = 0;
        if (v < 0.22) {
          const t = v / 0.22;
          r = 0.10 + t * 0.22;
        } else if (v < 0.75) {
          const t = (v - 0.22) / 0.53;
          r = 0.32 + Math.sin(t * Math.PI) * 0.16;
        } else {
          const t = (v - 0.75) / 0.25;
          r = 0.38 + t * 0.14;
        }

        for (let j = 0; j <= radialSegments; j++) {
          const u = j / radialSegments;
          const angle = u * Math.PI * 2;

          // 8 organic longitudinal muscular costae (ribs)
          const rib = 1.0 + 0.08 * Math.cos(angle * 8.0) * Math.sin(v * Math.PI);

          // Scalloped ruffled lappets at the skirt margin
          const lappet = (v > 0.7) ? (v - 0.7) * 0.10 * Math.sin(angle * 16.0) : 0;

          const currentR = r * rib + lappet;
          const x = Math.cos(angle) * currentR;
          const z = Math.sin(angle) * currentR;
          const finalY = y + (v > 0.75 ? Math.sin(angle * 16.0) * 0.025 : 0);

          positions.push(x, finalY, z);
          uvs.push(u, v);
        }
      }

      const stride = radialSegments + 1;
      for (let i = 0; i < slices; i++) {
        for (let j = 0; j < radialSegments; j++) {
          const a = i * stride + j;
          const b = (i + 1) * stride + j;
          const c = (i + 1) * stride + (j + 1);
          const d = i * stride + (j + 1);

          indices.push(a, b, d);
          indices.push(b, c, d);
        }
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geo.setIndex(indices);
      geo.computeVertexNormals();
      return geo;
    }

    // =========================================================================
    // INVERSE-KINEMATICS TENTACLE CLUSTER
    // FABRIK solver driving organic undulation, spiraling curls, and tapered tubes
    // =========================================================================
    function createTentacleGeometry(numSlices, numRadial) {
      const totalVerts = numSlices * numRadial;
      const positions = new Float32Array(totalVerts * 3);
      const normals = new Float32Array(totalVerts * 3);
      const uvs = new Float32Array(totalVerts * 2);

      const indices = [];
      for (let i = 0; i < numSlices - 1; i++) {
        for (let j = 0; j < numRadial; j++) {
          const nextJ = (j + 1) % numRadial;
          const a = i * numRadial + j;
          const b = (i + 1) * numRadial + j;
          const c = (i + 1) * numRadial + nextJ;
          const d = i * numRadial + nextJ;

          indices.push(a, b, d);
          indices.push(b, c, d);
        }
      }

      for (let i = 0; i < numSlices; i++) {
        const v = i / (numSlices - 1);
        for (let j = 0; j < numRadial; j++) {
          const u = j / numRadial;
          const idx = (i * numRadial + j) * 2;
          uvs[idx] = u;
          uvs[idx + 1] = v;
        }
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('normal', new THREE.BufferAttribute(normals, 3));
      geo.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
      geo.setIndex(indices);
      return geo;
    }

    function updateTubeGeometry(geo, curvePoints, numSlices, numRadial, baseRadius, tipRadius, phase) {
      const posAttr = geo.attributes.position;
      const normAttr = geo.attributes.normal;
      const posArray = posAttr.array;
      const normArray = normAttr.array;
      const upVector = new THREE.Vector3(0, 1, 0);

      for (let i = 0; i < numSlices; i++) {
        const currPoint = curvePoints[i];
        const nextPoint = curvePoints[Math.min(i + 1, numSlices - 1)];
        const prevPoint = curvePoints[Math.max(i - 1, 0)];

        const tangent = new THREE.Vector3().subVectors(nextPoint, prevPoint).normalize();
        if (tangent.lengthSq() < 0.001) tangent.set(0, -1, 0);

        let normalVec = new THREE.Vector3().crossVectors(tangent, upVector).normalize();
        if (normalVec.lengthSq() < 0.001) normalVec.set(1, 0, 0);
        const binormalVec = new THREE.Vector3().crossVectors(tangent, normalVec).normalize();

        // Natural tapering with subtle muscular annular rings
        const t = i / (numSlices - 1);
        const r = (baseRadius * (1.0 - t * 0.88) + tipRadius * t) * (1.0 + 0.07 * Math.sin(t * 36.0 + phase));

        for (let j = 0; j < numRadial; j++) {
          const angle = (j / numRadial) * Math.PI * 2;
          const cosA = Math.cos(angle);
          const sinA = Math.sin(angle);

          const nx = normalVec.x * cosA + binormalVec.x * sinA;
          const ny = normalVec.y * cosA + binormalVec.y * sinA;
          const nz = normalVec.z * cosA + binormalVec.z * sinA;

          const idx = (i * numRadial + j) * 3;
          posArray[idx] = currPoint.x + nx * r;
          posArray[idx + 1] = currPoint.y + ny * r;
          posArray[idx + 2] = currPoint.z + nz * r;

          normArray[idx] = nx;
          normArray[idx + 1] = ny;
          normArray[idx + 2] = nz;
        }
      }

      posAttr.needsUpdate = true;
      normAttr.needsUpdate = true;
    }

    function createTentacleCluster() {
      tentacleMaterial = new THREE.MeshStandardMaterial({
        color: new THREE.Color(params.tentacleColor),
        emissive: new THREE.Color(params.biolumGlowColor),
        emissiveIntensity: 0.45,
        roughness: 0.32,
        metalness: 0.12
      });

      suckerMaterial = new THREE.MeshStandardMaterial({
        color: new THREE.Color(params.biolumGlowColor),
        emissive: new THREE.Color(params.biolumGlowColor),
        emissiveIntensity: 3.5,
        roughness: 0.1
      });

      const NUM_SLICES = 32;
      const NUM_RADIAL = 8;

      for (let i = 0; i < NUM_TENTACLES; i++) {
        const baseAngle = (i / NUM_TENTACLES) * Math.PI * 2;
        // Attached cleanly around the rim of the bell
        const rootRadius = 0.46;
        const rootPos = new THREE.Vector3(
          Math.cos(baseAngle) * rootRadius,
          0.48,
          Math.sin(baseAngle) * rootRadius
        );

        const isPrimary = (i % 2 === 0);
        const tentLen = isPrimary ? (params.tentacleLength * 1.25) : (params.tentacleLength * 0.75);

        const joints = [];
        for (let j = 0; j < JOINTS_PER_TENTACLE; j++) {
          const t = j / (JOINTS_PER_TENTACLE - 1);
          joints.push(new THREE.Vector3(
            rootPos.x * (1.0 + t * 0.3),
            rootPos.y - t * tentLen,
            rootPos.z * (1.0 + t * 0.3)
          ));
        }

        const geo = createTentacleGeometry(NUM_SLICES, NUM_RADIAL);
        const mesh = new THREE.Mesh(geo, tentacleMaterial);
        polypGroup.add(mesh);

        // Delicate photophores along the tentacle
        const photophoreCount = 7;
        const photophoreInst = new THREE.InstancedMesh(
          new THREE.SphereGeometry(0.016, 8, 8),
          suckerMaterial,
          photophoreCount
        );
        polypGroup.add(photophoreInst);

        tentacleData.push({
          index: i,
          isPrimary,
          baseAngle,
          rootPos,
          joints,
          mesh,
          geo,
          photophoreInst,
          photophoreCount,
          numSlices: NUM_SLICES,
          numRadial: NUM_RADIAL,
          targetPos: new THREE.Vector3(),
          phaseOffset: i * 0.42
        });
      }
    }

    // Inverse Kinematics FABRIK Solver + Serpentine Wave Undulation + Spiraling Curl
    function updateTentacles(time, dt) {
      const speed = params.animationSpeed * params.tentacleUndulation;

      // 1. Animate Oral Arms
      if (oralArmsData) {
        oralArmsData.forEach((arm) => {
          const p = arm.phase;
          for (let j = 1; j < arm.joints.length; j++) {
            const t = j / (arm.joints.length - 1);
            const waveX = Math.sin(time * 2.2 * speed - j * 0.5 + p) * 0.08 * t;
            const waveZ = Math.cos(time * 2.2 * speed - j * 0.5 + p) * 0.08 * t;
            arm.joints[j].x = Math.cos(arm.baseAngle) * 0.08 * (1.0 - t * 0.5) + waveX;
            arm.joints[j].y = 0.65 - t * 0.85 + Math.sin(time * 1.5 * speed + p) * 0.03 * t;
            arm.joints[j].z = Math.sin(arm.baseAngle) * 0.08 * (1.0 - t * 0.5) + waveZ;
          }

          const curve = new THREE.CatmullRomCurve3(arm.joints);
          const points = curve.getPoints(arm.numSlices - 1);
          updateTubeGeometry(arm.geo, points, arm.numSlices, arm.numRadial, 0.024, 0.004, p);
        });
      }

      // 2. Animate Main Tentacles with FABRIK + Dynamic Spiraling Curl
      tentacleData.forEach((tent) => {
        const p = tent.phaseOffset;
        const isPrimary = tent.isPrimary;
        const tentLen = (isPrimary ? params.tentacleLength * 1.25 : params.tentacleLength * 0.75);
        const segLen = (tentLen / (JOINTS_PER_TENTACLE - 1));

        // Dynamic Target Attractor
        const reachRadius = isPrimary
          ? (0.85 + 0.35 * Math.sin(time * 0.75 * speed + p))
          : (0.55 + 0.25 * Math.cos(time * 0.9 * speed + p));

        const reachY = isPrimary
          ? (-1.75 - 0.35 * Math.cos(time * 0.6 * speed + p * 1.2))
          : (-0.95 - 0.30 * Math.sin(time * 0.7 * speed + p * 1.5));

        const targetX = Math.cos(tent.baseAngle + Math.sin(time * 0.5 * speed + p) * 0.7) * reachRadius;
        const targetZ = Math.sin(tent.baseAngle + Math.sin(time * 0.5 * speed + p) * 0.7) * reachRadius;
        const targetY = reachY + Math.sin(time * 1.1 * speed + p * 2.0) * 0.25;

        const toTarget = new THREE.Vector3(targetX, targetY, targetZ);

        // Mouse turbulence force
        if (mouseVelocity.lengthSq() > 0.001) {
          const distToMouse = toTarget.distanceTo(mouseWorldPos);
          if (distToMouse < 2.2) {
            const pushFactor = (1.0 - distToMouse / 2.2) * 0.09 * params.sporeTurbulenceReactivity;
            toTarget.addScaledVector(mouseVelocity, pushFactor);
          }
        }

        // Boundary containment inside cylinder
        const rDist = Math.sqrt(toTarget.x * toTarget.x + toTarget.z * toTarget.z);
        if (rDist > 1.38) {
          toTarget.x = (toTarget.x / rDist) * 1.38;
          toTarget.z = (toTarget.z / rDist) * 1.38;
        }
        toTarget.y = Math.max(-2.1, Math.min(0.3, toTarget.y));

        tent.targetPos.copy(toTarget);

        // FABRIK IK Pass
        const joints = tent.joints;
        const numJoints = joints.length;

        // Backward reach (target to root)
        joints[numJoints - 1].copy(tent.targetPos);
        for (let j = numJoints - 2; j >= 0; j--) {
          const dir = new THREE.Vector3().subVectors(joints[j], joints[j + 1]).normalize();
          joints[j].copy(joints[j + 1]).addScaledVector(dir, segLen);
        }

        // Forward reach (root to target)
        joints[0].copy(tent.rootPos);
        for (let j = 1; j < numJoints; j++) {
          const dir = new THREE.Vector3().subVectors(joints[j], joints[j - 1]).normalize();
          joints[j].copy(joints[j - 1]).addScaledVector(dir, segLen);
        }

        // Organic Serpentine & Dynamic Spiraling Curls
        for (let j = 1; j < numJoints; j++) {
          const progress = j / (numJoints - 1);
          // Secondary wave
          const wave = Math.sin(time * 2.6 * speed - j * 0.4 + p) * 0.045 * progress;
          joints[j].x += Math.cos(tent.baseAngle + Math.PI / 2) * wave;
          joints[j].z += Math.sin(tent.baseAngle + Math.PI / 2) * wave;

          // Spiraling curl towards tip
          if (j > 8) {
            const curlProgress = (j - 8) / (numJoints - 8);
            const curlAngle = curlProgress * curlProgress * (1.4 + 0.5 * Math.sin(time * speed + p));
            joints[j].x += Math.cos(tent.baseAngle + curlAngle) * 0.08 * curlProgress;
            joints[j].z += Math.sin(tent.baseAngle + curlAngle) * 0.08 * curlProgress;
          }
        }

        // Smooth spline interpolation
        const curve = new THREE.CatmullRomCurve3(joints);
        const curvePoints = curve.getPoints(tent.numSlices - 1);

        // Dynamic buffer geometry update with graceful tapering
        updateTubeGeometry(tent.geo, curvePoints, tent.numSlices, tent.numRadial, 0.040, 0.005, p);

        // Update delicate embedded photophores
        const dummy = new THREE.Object3D();
        for (let s = 0; s < tent.photophoreCount; s++) {
          const sampleIdx = Math.floor(4 + s * 3.4);
          if (sampleIdx < curvePoints.length - 1) {
            const pt = curvePoints[sampleIdx];
            const nextPt = curvePoints[sampleIdx + 1];
            const tangent = new THREE.Vector3().subVectors(nextPt, pt).normalize();
            const normal = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();

            const t = sampleIdx / (tent.numSlices - 1);
            const tentRadius = (0.040 * (1.0 - t * 0.85) + 0.005 * t);

            // Place on the inner curve of the tentacle
            dummy.position.copy(pt).addScaledVector(normal, -tentRadius * 0.75);

            // Delicate proportional scale with progressive traveling pulse
            const pulse = 0.8 + 0.4 * Math.sin(time * 4.0 * speed - s * 0.7 + p);
            dummy.scale.setScalar(pulse * (1.0 - t * 0.4));
            dummy.updateMatrix();
            tent.photophoreInst.setMatrixAt(s, dummy.matrix);
          }
        }
        tent.photophoreInst.instanceMatrix.needsUpdate = true;
      });
    }

    // =========================================================================
    // BIOLUMINESCENT FLOATING SPORES & MOUSE TURBULENCE
    // =========================================================================
    function createBioluminescentSporesTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 64;
      canvas.height = 64;
      const ctx = canvas.getContext('2d');

      const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
      grad.addColorStop(0.0, 'rgba(255, 255, 255, 1.0)');
      grad.addColorStop(0.2, 'rgba(255, 255, 255, 0.9)');
      grad.addColorStop(0.45, 'rgba(128, 255, 240, 0.55)');
      grad.addColorStop(0.8, 'rgba(0, 180, 220, 0.18)');
      grad.addColorStop(1.0, 'rgba(0, 0, 0, 0.0)');

      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 64, 64);

      const texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;
      return texture;
    }

    function createBioluminescentSpores() {
      sporeGeometry = new THREE.BufferGeometry();

      sporePositions = new Float32Array(SPORE_COUNT * 3);
      sporeVelocities = new Float32Array(SPORE_COUNT * 3);
      sporeBaseColors = new Float32Array(SPORE_COUNT * 3);
      sporeSizes = new Float32Array(SPORE_COUNT);
      sporePhases = new Float32Array(SPORE_COUNT);

      const baseCol = new THREE.Color(params.sporeGlowColor);

      for (let i = 0; i < SPORE_COUNT; i++) {
        const i3 = i * 3;
        // Distribute within specimen jar fluid cylinder
        const r = Math.sqrt(Math.random()) * 1.45;
        const theta = Math.random() * Math.PI * 2;
        sporePositions[i3] = Math.cos(theta) * r;
        sporePositions[i3 + 1] = (Math.random() - 0.5) * 4.2;
        sporePositions[i3 + 2] = Math.sin(theta) * r;

        // Initial subtle drift velocity
        sporeVelocities[i3] = (Math.random() - 0.5) * 0.003;
        sporeVelocities[i3 + 1] = 0.001 + Math.random() * 0.003; // buoyant upward rise
        sporeVelocities[i3 + 2] = (Math.random() - 0.5) * 0.003;

        // Color variation
        const c = baseCol.clone().offsetHSL(
          (Math.random() - 0.5) * 0.08,
          (Math.random() - 0.5) * 0.1,
          (Math.random() - 0.5) * 0.15
        );
        sporeBaseColors[i3] = c.r;
        sporeBaseColors[i3 + 1] = c.g;
        sporeBaseColors[i3 + 2] = c.b;

        sporeSizes[i] = 12.0 + Math.random() * 24.0;
        sporePhases[i] = Math.random() * Math.PI * 2;
      }

      sporeGeometry.setAttribute('position', new THREE.BufferAttribute(sporePositions, 3));
      sporeGeometry.setAttribute('color', new THREE.BufferAttribute(sporeBaseColors, 3));

      sporeMaterial = new THREE.PointsMaterial({
        size: 0.14,
        vertexColors: true,
        map: createBioluminescentSporesTexture(),
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        sizeAttenuation: true
      });

      sporePoints = new THREE.Points(sporeGeometry, sporeMaterial);
      sporesGroup.add(sporePoints);
    }

    function updateSpores(time, dt) {
      const speed = params.animationSpeed;
      const positions = sporeGeometry.attributes.position.array;
      const reactivity = params.sporeTurbulenceReactivity;

      // Mouse speed in world coordinates
      const mouseSpeedSq = mouseVelocity.lengthSq();

      for (let i = 0; i < SPORE_COUNT; i++) {
        const i3 = i * 3;
        let px = positions[i3];
        let py = positions[i3 + 1];
        let pz = positions[i3 + 2];

        let vx = sporeVelocities[i3];
        let vy = sporeVelocities[i3 + 1];
        let vz = sporeVelocities[i3 + 2];

        const phase = sporePhases[i];

        // 1. Natural Preservative Fluid Convection & Buoyancy
        vy += (0.0003 + 0.0002 * Math.sin(time * 0.5 + phase)) * speed;

        // Circular swirl around central jar cylinder axis
        vx += -pz * 0.0018 * speed;
        vz += px * 0.0018 * speed;

        // Fluid micro-eddies
        vx += Math.sin(time * 0.8 * speed + py * 1.4 + phase) * 0.0008;
        vz += Math.cos(time * 0.8 * speed + px * 1.4 + phase) * 0.0008;

        // 2. Interactive Mouse Turbulence Vortex
        if (mouseSpeedSq > 0.0005) {
          const dx = px - mouseWorldPos.x;
          const dy = py - mouseWorldPos.y;
          const dz = pz - mouseWorldPos.z;
          const distSq = dx * dx + dy * dy + dz * dz;
          const maxDist = 1.8;

          if (distSq < maxDist * maxDist) {
            const dist = Math.sqrt(distSq);
            const factor = (1.0 - dist / maxDist);

            // Forward drag in direction of mouse motion
            vx += mouseVelocity.x * factor * 0.035 * reactivity;
            vy += mouseVelocity.y * factor * 0.035 * reactivity;

            // Fluid rotational swirl vortex (cross product around mouse vector)
            const swirlX = -dy * factor * 0.05 * reactivity;
            const swirlY = dx * factor * 0.05 * reactivity;
            vx += swirlX;
            vy += swirlY;
            vz += (Math.random() - 0.5) * factor * 0.04 * reactivity;
          }
        }

        // Viscous Fluid Damping
        vx *= 0.94;
        vy *= 0.94;
        vz *= 0.94;

        // Update positions
        px += vx;
        py += vy;
        pz += vz;

        // 3. Specimen Jar Cylinder Boundary Reflection
        const r = Math.sqrt(px * px + pz * pz);
        if (r > 1.48) {
          px = (px / r) * 1.48;
          pz = (pz / r) * 1.48;
          vx = -vx * 0.5;
          vz = -vz * 0.5;
        }

        // Vertical recirculation
        if (py > 2.15) {
          py = -2.15;
          const newR = Math.sqrt(Math.random()) * 1.35;
          const newA = Math.random() * Math.PI * 2;
          px = Math.cos(newA) * newR;
          pz = Math.sin(newA) * newR;
        } else if (py < -2.15) {
          py = 2.15;
        }

        // Save back
        positions[i3] = px;
        positions[i3 + 1] = py;
        positions[i3 + 2] = pz;

        sporeVelocities[i3] = vx;
        sporeVelocities[i3 + 1] = vy;
        sporeVelocities[i3 + 2] = vz;
      }

      sporeGeometry.attributes.position.needsUpdate = true;
    }

    // =========================================================================
    // ORBIT CONTROLS & CAMERA INTERACTION
    // Full support for wheel zoom and screen-space dragging across viewport
    // =========================================================================
    function setupControls() {
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;

      // Wheel Zoom
      controls.enableZoom = true;
      controls.zoomSpeed = 1.0;
      controls.minDistance = 2.0;
      controls.maxDistance = 14.0;

      // Screen-space Panning / Drag across screen
      controls.enablePan = true;
      controls.screenSpacePanning = true; // Drag directly across 2D screen plane!
      controls.panSpeed = 1.2;

      // Mouse button mappings (Left: Rotate, Middle: Zoom, Right: Pan)
      controls.mouseButtons = {
        LEFT: THREE.MOUSE.ROTATE,
        MIDDLE: THREE.MOUSE.DOLLY,
        RIGHT: THREE.MOUSE.PAN
      };

      controls.target.set(0, 0.2, 0);
      controls.update();
    }

    // =========================================================================
    // INPUT LISTENERS: MOUSE TURBULENCE & CLICK-TO-RANDOMIZE
    // =========================================================================
    function setupInputListeners() {
      const dom = renderer.domElement;

      dom.addEventListener('pointermove', (e) => {
        const rect = dom.getBoundingClientRect();
        const ndcX = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        const ndcY = -((e.clientY - rect.top) / rect.height) * 2 + 1;

        raycaster.setFromCamera(new THREE.Vector2(ndcX, ndcY), camera);
        const intersect = new THREE.Vector3();
        if (raycaster.ray.intersectPlane(mousePlane, intersect)) {
          prevMouseWorldPos.copy(mouseWorldPos);
          mouseWorldPos.copy(intersect);
          mouseVelocity.subVectors(mouseWorldPos, prevMouseWorldPos).multiplyScalar(16.0);
          isMouseActive = true;
          mouseDecayTimer = 0.6;
        }
      });

      dom.addEventListener('pointerdown', (e) => {
        pointerDownX = e.clientX;
        pointerDownY = e.clientY;
        pointerDownTime = performance.now();
      });

      dom.addEventListener('pointerup', (e) => {
        const dx = Math.abs(e.clientX - pointerDownX);
        const dy = Math.abs(e.clientY - pointerDownY);
        const dt = performance.now() - pointerDownTime;

        // Clean click detection (not a drag/pan)
        if (dx < 6 && dy < 6 && dt < 350) {
          if (params.clickToRandomize) {
            randomizeSceneVariation();
          }
        }
      });

      // Window resize
      window.addEventListener('resize', onWindowResize);

      // 'H' key to hide/show all UI
      window.addEventListener('keydown', (e) => {
        if (e.key === 'h' || e.key === 'H') {
          if (gui) {
            gui._hidden ? gui.show() : gui.hide();
          }
        }
      });
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // =========================================================================
    // 8 PRECONFIGURED SLOW SMOOTH CAMERA ANIMATIONS
    // =========================================================================
    function applyCameraAnimation(time, dt) {
      const speed = params.animationSpeed * 0.45;
      const preset = params.animationPreset;

      switch (preset) {
        case 'Static (No Camera Motion)':
          // Pure stationary camera, no autonomous orbit
          break;

        case 'Specimen Inspection Orbit': {
          currentAnimAngle += dt * speed * 0.7;
          const radius = 6.4;
          const camX = Math.sin(currentAnimAngle) * radius;
          const camZ = Math.cos(currentAnimAngle) * radius;
          const camY = 0.4 + 0.4 * Math.sin(currentAnimAngle * 0.5);

          camera.position.x = THREE.MathUtils.lerp(camera.position.x, camX, 0.04);
          camera.position.z = THREE.MathUtils.lerp(camera.position.z, camZ, 0.04);
          camera.position.y = THREE.MathUtils.lerp(camera.position.y, camY, 0.04);
          controls.target.set(0, 0.2, 0);
          break;
        }

        case 'Abyssal Breathing': {
          const dist = 6.2 + 1.8 * Math.sin(time * 0.45 * speed);
          const camY = 0.35 + 0.3 * Math.cos(time * 0.45 * speed);
          camera.position.z = THREE.MathUtils.lerp(camera.position.z, dist, 0.05);
          camera.position.y = THREE.MathUtils.lerp(camera.position.y, camY, 0.05);
          camera.position.x = THREE.MathUtils.lerp(camera.position.x, 0.4 * Math.sin(time * 0.2 * speed), 0.04);
          controls.target.set(0, 0.2, 0);
          break;
        }

        case 'Eldritch Float': {
          const lissX = 2.4 * Math.sin(time * 0.35 * speed);
          const lissY = 0.5 + 1.2 * Math.cos(time * 0.7 * speed);
          const lissZ = 5.6 + 0.9 * Math.cos(time * 0.35 * speed);

          camera.position.x = THREE.MathUtils.lerp(camera.position.x, lissX, 0.04);
          camera.position.y = THREE.MathUtils.lerp(camera.position.y, lissY, 0.04);
          camera.position.z = THREE.MathUtils.lerp(camera.position.z, lissZ, 0.04);
          controls.target.set(0, 0.3, 0);
          break;
        }

        case 'Polyp Focus Close-Up': {
          const focusX = 0.7 * Math.sin(time * 0.25 * speed);
          const focusY = 0.75 + 0.2 * Math.cos(time * 0.3 * speed);
          const focusZ = 3.3 + 0.3 * Math.sin(time * 0.2 * speed);

          camera.position.x = THREE.MathUtils.lerp(camera.position.x, focusX, 0.05);
          camera.position.y = THREE.MathUtils.lerp(camera.position.y, focusY, 0.05);
          camera.position.z = THREE.MathUtils.lerp(camera.position.z, focusZ, 0.05);
          controls.target.lerp(new THREE.Vector3(0, 0.72, 0), 0.05);
          break;
        }

        case 'Suspension Drift': {
          const driftY = -1.6 + 3.2 * (0.5 + 0.5 * Math.sin(time * 0.32 * speed));
          camera.position.y = THREE.MathUtils.lerp(camera.position.y, driftY, 0.04);
          camera.position.x = THREE.MathUtils.lerp(camera.position.x, 1.2 * Math.sin(time * 0.2 * speed), 0.04);
          camera.position.z = THREE.MathUtils.lerp(camera.position.z, 5.5, 0.04);
          controls.target.set(0, camera.position.y * 0.7, 0);
          break;
        }

        case 'Turbulent Awakening': {
          currentAnimAngle += dt * speed * 0.8;
          const spiralR = 5.2 + 0.8 * Math.sin(time * 0.4 * speed);
          const spiralY = 0.4 + 1.2 * Math.sin(time * 0.35 * speed);

          camera.position.x = THREE.MathUtils.lerp(camera.position.x, Math.cos(currentAnimAngle) * spiralR, 0.04);
          camera.position.z = THREE.MathUtils.lerp(camera.position.z, Math.sin(currentAnimAngle) * spiralR, 0.04);
          camera.position.y = THREE.MathUtils.lerp(camera.position.y, spiralY, 0.04);
          controls.target.set(0, 0.4 + 0.2 * Math.sin(time * 0.5), 0);
          break;
        }

        case 'Deep Sea Pendulum': {
          const pendAngle = 0.7 * Math.sin(time * 0.48 * speed);
          const pendX = Math.sin(pendAngle) * 6.2;
          const pendZ = Math.cos(pendAngle) * 6.2;
          const pendY = 0.35 + 0.5 * Math.cos(pendAngle * 2.0);

          camera.position.x = THREE.MathUtils.lerp(camera.position.x, pendX, 0.04);
          camera.position.z = THREE.MathUtils.lerp(camera.position.z, pendZ, 0.04);
          camera.position.y = THREE.MathUtils.lerp(camera.position.y, pendY, 0.04);
          controls.target.set(0, 0.2, 0);
          break;
        }
      }
    }

    // =========================================================================
    // COLOR SCHEME APPLICATION & GSAP TRANSITION
    // =========================================================================
    function applyColorScheme(schemeName, animate = true) {
      const scheme = colorSchemes[schemeName];
      if (!scheme) return;

      params.colorScheme = schemeName;

      if (!animate || typeof gsap === 'undefined') {
        // Direct assignment
        params.polypCoreColor = scheme.polypCore;
        params.polypMantleColor = scheme.polypMantle;
        params.tentacleColor = scheme.tentacles;
        params.biolumGlowColor = scheme.glow;
        params.sporeGlowColor = scheme.spores;
        params.fluidColor = scheme.fluid;
        params.glassColor = scheme.glass;
        params.hardwareColor = scheme.hardware;
        updateMaterialColors();
        return;
      }

      // Smooth organic morphing transition via GSAP
      const targetColors = {
        core: new THREE.Color(scheme.polypCore),
        mantle: new THREE.Color(scheme.polypMantle),
        tent: new THREE.Color(scheme.tentacles),
        glow: new THREE.Color(scheme.glow),
        spore: new THREE.Color(scheme.spores),
        fluid: new THREE.Color(scheme.fluid),
        glass: new THREE.Color(scheme.glass),
        hard: new THREE.Color(scheme.hardware),
        bg: new THREE.Color(scheme.bg)
      };

      const startColors = {
        coreR: polypCoreMaterial.color.r, coreG: polypCoreMaterial.color.g, coreB: polypCoreMaterial.color.b,
        mantleR: polypMantleMaterial.color.r, mantleG: polypMantleMaterial.color.g, mantleB: polypMantleMaterial.color.b,
        tentR: tentacleMaterial.color.r, tentG: tentacleMaterial.color.g, tentB: tentacleMaterial.color.b,
        glowR: polypPointLight.color.r, glowG: polypPointLight.color.g, glowB: polypPointLight.color.b,
        fluidR: innerFluidMaterial.color.r, fluidG: innerFluidMaterial.color.g, fluidB: innerFluidMaterial.color.b,
        glassR: outerGlassMaterial.color.r, glassG: outerGlassMaterial.color.g, glassB: outerGlassMaterial.color.b,
        hardR: hardwareMaterial.color.r, hardG: hardwareMaterial.color.g, hardB: hardwareMaterial.color.b
      };

      gsap.to(startColors, {
        coreR: targetColors.core.r, coreG: targetColors.core.g, coreB: targetColors.core.b,
        mantleR: targetColors.mantle.r, mantleG: targetColors.mantle.g, mantleB: targetColors.mantle.b,
        tentR: targetColors.tent.r, tentG: targetColors.tent.g, tentB: targetColors.tent.b,
        glowR: targetColors.glow.r, glowG: targetColors.glow.g, glowB: targetColors.glow.b,
        fluidR: targetColors.fluid.r, fluidG: targetColors.fluid.g, fluidB: targetColors.fluid.b,
        glassR: targetColors.glass.r, glassG: targetColors.glass.g, glassB: targetColors.glass.b,
        hardR: targetColors.hard.r, hardG: targetColors.hard.g, hardB: targetColors.hard.b,
        duration: 1.4,
        ease: 'power2.out',
        onUpdate: () => {
          polypCoreMaterial.color.setRGB(startColors.coreR, startColors.coreG, startColors.coreB);
          polypCoreMaterial.emissive.setRGB(startColors.glowR, startColors.glowG, startColors.glowB);

          polypMantleMaterial.color.setRGB(startColors.mantleR, startColors.mantleG, startColors.mantleB);
          polypMantleMaterial.emissive.setRGB(startColors.coreR, startColors.coreG, startColors.coreB);

          tentacleMaterial.color.setRGB(startColors.tentR, startColors.tentG, startColors.tentB);
          tentacleMaterial.emissive.setRGB(startColors.glowR, startColors.glowG, startColors.glowB);

          suckerMaterial.color.setRGB(startColors.glowR, startColors.glowG, startColors.glowB);
          suckerMaterial.emissive.setRGB(startColors.glowR, startColors.glowG, startColors.glowB);

          polypPointLight.color.setRGB(startColors.glowR, startColors.glowG, startColors.glowB);
          bottomUpLight.color.setRGB(startColors.tentR, startColors.tentG, startColors.tentB);

          innerFluidMaterial.color.setRGB(startColors.fluidR, startColors.fluidG, startColors.fluidB);
          innerFluidMaterial.attenuationColor.setRGB(startColors.fluidR, startColors.fluidG, startColors.fluidB);

          outerGlassMaterial.color.setRGB(startColors.glassR, startColors.glassG, startColors.glassB);
          outerGlassMaterial.attenuationColor.setRGB(startColors.fluidR, startColors.fluidG, startColors.fluidB);

          hardwareMaterial.color.setRGB(startColors.hardR, startColors.hardG, startColors.hardB);

          // Spore colors
          const colAttr = sporeGeometry.attributes.color;
          for (let i = 0; i < SPORE_COUNT; i++) {
            colAttr.array[i * 3] = targetColors.spore.r;
            colAttr.array[i * 3 + 1] = targetColors.spore.g;
            colAttr.array[i * 3 + 2] = targetColors.spore.b;
          }
          colAttr.needsUpdate = true;

          if (vesicleMaterial) {
            vesicleMaterial.color.setRGB(startColors.coreR, startColors.coreG, startColors.coreB);
            vesicleMaterial.emissive.setRGB(startColors.glowR, startColors.glowG, startColors.glowB);
          }
          if (oralArmsMaterial) {
            oralArmsMaterial.color.setRGB(startColors.mantleR, startColors.mantleG, startColors.mantleB);
            oralArmsMaterial.emissive.setRGB(startColors.glowR, startColors.glowG, startColors.glowB);
          }

          // Background & Atmospheric Fog
          if (!params.greenscreen) {
            params.fogColor = scheme.bg;
            document.body.style.backgroundColor = scheme.bg;
            if (scene.background) scene.background.set(scheme.bg);
            if (scene.fog) scene.fog.color.set(scheme.bg);
          }
        },
        onComplete: () => {
          params.polypCoreColor = '#' + targetColors.core.getHexString();
          params.polypMantleColor = '#' + targetColors.mantle.getHexString();
          params.tentacleColor = '#' + targetColors.tent.getHexString();
          params.biolumGlowColor = '#' + targetColors.glow.getHexString();
          params.sporeGlowColor = '#' + targetColors.spore.getHexString();
          params.fluidColor = '#' + targetColors.fluid.getHexString();
          params.glassColor = '#' + targetColors.glass.getHexString();
          params.hardwareColor = '#' + targetColors.hard.getHexString();
          if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
        }
      });
    }

    function updateMaterialColors() {
      const coreCol = new THREE.Color(params.polypCoreColor);
      const mantleCol = new THREE.Color(params.polypMantleColor);
      const tentCol = new THREE.Color(params.tentacleColor);
      const glowCol = new THREE.Color(params.biolumGlowColor);
      const sporeCol = new THREE.Color(params.sporeGlowColor);
      const fluidCol = new THREE.Color(params.fluidColor);
      const glassCol = new THREE.Color(params.glassColor);
      const hardCol = new THREE.Color(params.hardwareColor);

      if (polypCoreMaterial) {
        polypCoreMaterial.color.copy(coreCol);
        polypCoreMaterial.emissive.copy(glowCol);
      }
      if (polypMantleMaterial) {
        polypMantleMaterial.color.copy(mantleCol);
        polypMantleMaterial.emissive.copy(coreCol);
      }
      if (vesicleMaterial) {
        vesicleMaterial.color.copy(coreCol);
        vesicleMaterial.emissive.copy(glowCol);
      }
      if (oralArmsMaterial) {
        oralArmsMaterial.color.copy(mantleCol);
        oralArmsMaterial.emissive.copy(glowCol);
      }
      if (tentacleMaterial) {
        tentacleMaterial.color.copy(tentCol);
        tentacleMaterial.emissive.copy(glowCol);
      }
      if (suckerMaterial) {
        suckerMaterial.color.copy(glowCol);
        suckerMaterial.emissive.copy(glowCol);
      }
      if (polypPointLight) polypPointLight.color.copy(glowCol);
      if (innerFluidMaterial) {
        innerFluidMaterial.color.copy(fluidCol);
        innerFluidMaterial.attenuationColor.copy(fluidCol);
      }
      if (outerGlassMaterial) {
        outerGlassMaterial.color.copy(glassCol);
        outerGlassMaterial.attenuationColor.copy(fluidCol);
      }
      if (hardwareMaterial) hardwareMaterial.color.copy(hardCol);

      if (sporeGeometry) {
        const colAttr = sporeGeometry.attributes.color;
        for (let i = 0; i < SPORE_COUNT; i++) {
          colAttr.array[i * 3] = sporeCol.r;
          colAttr.array[i * 3 + 1] = sporeCol.g;
          colAttr.array[i * 3 + 2] = sporeCol.b;
        }
        colAttr.needsUpdate = true;
      }

      if (params.greenscreen) {
        document.body.style.backgroundColor = '#00ff00';
        scene.background = new THREE.Color('#00ff00');
        if (scene.fog) scene.fog.density = 0;
      } else {
        const scheme = colorSchemes[params.colorScheme];
        const bgCol = scheme ? scheme.bg : params.fogColor;
        params.fogColor = bgCol;
        document.body.style.backgroundColor = bgCol;
        scene.background = new THREE.Color(bgCol);
        if (params.fogEnabled) {
          if (!scene.fog) scene.fog = new THREE.FogExp2(bgCol, params.fogDensity);
          scene.fog.color.set(bgCol);
          scene.fog.density = params.fogDensity;
        } else {
          scene.fog = null;
        }
      }
    }

    // =========================================================================
    // RANDOMIZE SCENE PROCEDURAL VARIATION
    // Re-rolls visual theme, motion physics, and light parameters smoothly
    // =========================================================================
    function randomizeSceneVariation() {
      const schemeKeys = Object.keys(colorSchemes);
      const randomSchemeKey = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];

      // Re-roll motion & geometric dynamics
      const targetDynamics = {
        pulseSpeed: Number((0.6 + Math.random() * 1.6).toFixed(2)),
        pulseIntensity: Number((0.7 + Math.random() * 0.9).toFixed(2)),
        tentacleUndulation: Number((0.6 + Math.random() * 1.5).toFixed(2)),
        tentacleLength: Number((1.4 + Math.random() * 1.2).toFixed(2)),
        sporeTurbulenceReactivity: Number((0.8 + Math.random() * 1.4).toFixed(2)),
        exposure: Number((1.0 + Math.random() * 0.6).toFixed(2)),
        masterLightIntensity: Number((0.9 + Math.random() * 0.6).toFixed(2))
      };

      gsap.to(params, {
        pulseSpeed: targetDynamics.pulseSpeed,
        pulseIntensity: targetDynamics.pulseIntensity,
        tentacleUndulation: targetDynamics.tentacleUndulation,
        tentacleLength: targetDynamics.tentacleLength,
        sporeTurbulenceReactivity: targetDynamics.sporeTurbulenceReactivity,
        exposure: targetDynamics.exposure,
        masterLightIntensity: targetDynamics.masterLightIntensity,
        duration: 1.2,
        ease: 'power2.out',
        onUpdate: () => {
          renderer.toneMappingExposure = params.exposure;
          applyLightIntensities();
        }
      });

      applyColorScheme(randomSchemeKey, true);
    }
