<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#030305">
  <meta name="description" content="Prismatic dust: an infinite, procedural macro photograph of diamond glitter, spectral bokeh, and vintage cross-filter light.">
  <link rel="icon" href="data:,">
  <title>Prismatic Dust</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #030305; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
    canvas.dragging { cursor: grabbing; }
    .unavailable { position: fixed; inset: 0; display: grid; place-content: center; padding: 2rem; color: #e2e5ed; font: 16px/1.6 system-ui, sans-serif; text-align: center; }
  </style>
</head>
<body>
<script>
/*
 * PRISMATIC DUST — Three.js + original GLSL, no image/texture assets.
 * Open this file directly in a modern browser. Internet loads the pinned
 * Three.js and lil-gui modules. Every point, optical disc, and flare is generated.
 * Four optical layers accumulate in a linear HDR target; a fullscreen shader
 * adds lens dispersion, film response, fine grain, and a very gentle vignette.
 */
(async () => {
  'use strict';
  let renderer;
  try {
    let THREE;
    try {
      THREE = await import('https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js');
    } catch {
      THREE = await import('https://unpkg.com/three@0.180.0/build/three.module.js');
    }
    let GUI;
    try {
      ({ default: GUI } = await import('https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js'));
    } catch {
      ({ default: GUI } = await import('https://cdn.jsdelivr.net/npm/lil-gui@0.19.1/dist/lil-gui.esm.min.js'));
    }

    // Both achromatic schemes include an inversion switch, keeping exactly 19 presets.
    const schemes = {
      'Original': { colors: ['fff7e8', '22e6f2', '46ff91', 'ffd66b', 'f13ccf', '784dff'], bg: '030305', mode: 0 },
      'Monochromatic': { colors: ['e8f2ff', 'a9cfff', '5d98ed', '2856a6', '102b61'], bg: '030812' },
      'Analogous': { colors: ['a6fff0', '22e6f2', '3489f4', '784dff', 'c688ff'], bg: '040611' },
      'Complementary': { colors: ['fff0cb', 'ffb64d', 'ff782d', '22c6df', '3864bd'], bg: '070b12' },
      'Split-complementary': { colors: ['ffdab0', 'ff9b43', '37dac0', '5268ed', 'c6a8ff'], bg: '070612' },
      'Triadic': { colors: ['fff0bf', 'ffd66b', '22d9e8', 'ef54a9', 'b73f87'], bg: '0b0610' },
      'Tetradic': { colors: ['ff5263', 'ffd66b', '46ff91', '6c8cff', 'b984ff'], bg: '070710' },
      'Double split-complementary': { colors: ['ff8266', 'ffd66b', '6aeba5', '38b4ed', 'af79ef', 'f377bc'], bg: '08070d' },
      'Achromatic': { colors: ['ffffff', 'd5d5d5', '999999', '555555', '151515'], bg: '000000', mode: 2 },
      'Achromatic + Accent': { colors: ['ffffff', 'dddddd', '999999', '555555', 'ff253b'], bg: '000000', mode: 3 },
      'Neutral + accent': { colors: ['f4ecdc', 'c7bfb2', '9a9d9c', '636c70', 'd9884e'], bg: '101214', mode: 4 },
      'Amber / Ember': { colors: ['F6AA1C', 'BC3908', '941B0C', 'F6AA1C', '220901'], bg: '220901' },
      'Sea Glass': { colors: ['63D1CF', '5BC0BE', '4BAD9E', '4BAD9E', '0B132B', '000000'], bg: '000000' },
      'Orchid / Mauve': { colors: ['AA60C8', 'D69ADE', 'C9A3C6', 'CFB5C2', '0D001D', '120A12'], bg: '120A12' },
      'Saffron / Petrol': { colors: ['FEF1BE', 'FFBA00', '008189', '00474D', '061210'], bg: '061210' },
      'Chartreuse / Jade': { colors: ['D4FFB0', '7FFF00', '00B894', '0A3322', '05140A'], bg: '05140A' },
      'Apricot / Aubergine': { colors: ['FFE8CC', 'FF8C00', 'C7501A', '3D1050', '0E0618'], bg: '0E0618' },
      'Lavender / Indigo': { colors: ['E8E0FF', 'B38FFF', '6A3DE8', '1A1250', '090612'], bg: '090612' },
      'Cyan / Fuchsia': { colors: ['E0FBFF', '00F0FF', 'D40078', '1E0A3D', '05020F'], bg: '05020F' },
    };
    const animationModes = ['Static', 'Ambient drift', 'River glide', 'Orbit', 'Pendulum', 'Lens breathing', 'Parallax float', 'Slow spiral'];
    const settings = {
      scheme: 'Original', color: '#ffffff', accent: '#ff253b', invert: false,
      background: '#030305', greenscreen: false,
      palette1: '#fff7e8', palette2: '#22e6f2', palette3: '#46ff91',
      palette4: '#ffd66b', palette5: '#f13ccf', palette6: '#784dff',
      animation: 'Ambient drift', speed: 1, motion: 1, orbitTilt: 18,
      zoom: 1, angle: 0, panX: 0, panY: 0,
      pixelRatio: Math.min(window.devicePixelRatio || 1, 1.8), adaptiveDPR: true,
      spread: 1, slope: -.535, bokehSize: 1, sparkle: 1, flow: 1, density: 1,
      seed: 639271, randomizeOnClick: true,
    };

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
    renderer.setClearColor(0x030305, 1);
    renderer.toneMapping = THREE.NoToneMapping;
    renderer.autoClear = true;
    const canvas = renderer.domElement;
    canvas.setAttribute('role', 'img');
    canvas.setAttribute('aria-label', 'A slowly drifting diagonal river of microscopic silver glitter, rainbow lens bokeh, and brilliant cross-shaped photographic flares in deep black space.');
    document.body.appendChild(canvas);

    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 2);
    camera.position.z = 1;
    const pointer = new THREE.Vector2();
    const stillPointer = new THREE.Vector2();
    const uniforms = {
      uTime: { value: 0 },
      uResolution: { value: new THREE.Vector2(1, 1) },
      uAspect: { value: 1 },
      uPixelRatio: { value: 1 },
      uMouse: { value: new THREE.Vector2() },
      uView: { value: new THREE.Matrix3() },
      uInverseView: { value: new THREE.Matrix3() },
      uViewScale: { value: 1 },
      uSpread: { value: 1 }, uSlope: { value: -.535 },
      uBokehSize: { value: 1 }, uSparkle: { value: 1 }, uFlow: { value: 1 },
      uSeed: { value: 0 },
      uPalette: { value: Array.from({ length: 6 }, () => new THREE.Color()) },
      uPaletteCount: { value: 6 }, uColorMode: { value: 0 },
      uTint: { value: new THREE.Color(1, 1, 1) },
      uAccent: { value: new THREE.Color() },
      uBackground: { value: new THREE.Color() }, uInvert: { value: 0 },
    };

    const common = /* glsl */`
      uniform float uTime;
      uniform vec2 uResolution;
      uniform float uAspect;
      uniform float uPixelRatio;
      uniform vec2 uMouse;
      uniform mat3 uView;
      uniform mat3 uInverseView;
      uniform float uViewScale;
      uniform float uSpread;
      uniform float uSlope;
      uniform float uBokehSize;
      uniform float uSparkle;
      uniform float uFlow;
      uniform float uSeed;
      const float TAU = 6.28318530718;
      float hash21(vec2 p) {
        vec3 q = fract(vec3(p.xyx) * .1031);
        q += dot(q, q.yzx + 33.33);
        return fract((q.x + q.y) * q.z);
      }
      float hash31(vec3 p) {
        p = fract(p * .1031);
        p += dot(p, p.zyx + 31.32);
        return fract((p.x + p.y) * p.z);
      }
      float noise(vec2 p) {
        vec2 i = floor(p), f = fract(p);
        f = f * f * (3. - 2. * f);
        return mix(mix(hash21(i), hash21(i + vec2(1, 0)), f.x),
                   mix(hash21(i + vec2(0, 1)), hash21(i + 1.), f.x), f.y);
      }
      float fbm(vec2 p) {
        float n = .0, a = .5;
        for (int i = 0; i < 4; i++) {
          n += a * noise(p);
          p = mat2(.8, -.6, .6, .8) * p * 2.07 + 17.3;
          a *= .5;
        }
        return n;
      }
      vec3 spectrum(float x) {
        vec3 c = .5 + .5 * cos(TAU * (x + vec3(.0, -.32, -.65)));
        return pow(c, vec3(1.65));
      }
      mat2 rotate(float a) { return mat2(cos(a), -sin(a), sin(a), cos(a)); }
      float river(float x) {
        return .4785 + uSlope * (x - .5) + .009 * sin(x * 7. + .3)
          + .003 * sin(x * 24. - uTime * .021);
      }
      vec2 warpOptics(vec2 p) {
        p.y += (uSlope + .535) * (p.x - .5);
        return p;
      }
      vec2 viewPosition(vec2 p) { return (uView * vec3(p, 1.)).xy; }
      vec2 parallax(float depth) { return uMouse * vec2(.003 / uAspect, .003) * depth; }
    `;
    const fullscreenVertex = /* glsl */`
      varying vec2 vUv;
      void main() { vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }
    `;
    const plane = new THREE.PlaneGeometry(2, 2);
    function material(vertexShader, fragmentShader, additive = false) {
      return new THREE.ShaderMaterial({
        uniforms, vertexShader: common + vertexShader, fragmentShader: common + fragmentShader,
        depthTest: false, depthWrite: false, transparent: additive,
        blending: additive ? THREE.AdditiveBlending : THREE.NoBlending,
        toneMapped: false,
      });
    }
    function addMesh(geometry, mat, order) {
      const mesh = new THREE.Mesh(geometry, mat);
      mesh.frustumCulled = false;
      mesh.renderOrder = order;
      scene.add(mesh);
      return mesh;
    }

    // Almost-black emulsion, broad optical diffusion, and irregular river haze.
    addMesh(plane, material(fullscreenVertex, /* glsl */`
      varying vec2 vUv;
      void main() {
        vec2 uv = (uInverseView * vec3(vUv, 1.)).xy + parallax(.2);
        vec2 p = vec2(uv.x * uAspect, uv.y);
        float n = fbm(p * 4. + vec2(uTime * .007, -uTime * .003));
        float d = uv.y - river(uv.x);
        float band = exp(-pow(d / (.065 * uSpread), 2.));
        float broken = pow(fbm(p * vec2(19., 36.)), 2.);
        vec3 color = vec3(0.);
        color += vec3(.014, .016, .019) * band * broken;
        color += vec3(.001, .0008, .00075) * pow(n, 3.) * band;
        vec2 light = (uv - vec2(.414, .616)) * vec2(uAspect, 1.);
        color += vec3(.052, .044, .035) * exp(-dot(light, light) * 100.);
        gl_FragColor = vec4(color, 1.);
      }
    `), 0);

    // Reproducible, non-grid distributions. Object identity never changes per frame.
    let seed = 639271;
    function random() {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    }
    const gaussian = () => Math.sqrt(-2 * Math.log(Math.max(.00001, random()))) * Math.cos(2 * Math.PI * random());
    const axis = x => .746 - .535 * x + .009 * Math.sin(x * 7 + .3);
    function instances(rows) {
      const g = new THREE.InstancedBufferGeometry();
      g.index = plane.index;
      g.setAttribute('position', plane.attributes.position);
      g.setAttribute('uv', plane.attributes.uv);
      g.setAttribute('aData', new THREE.InstancedBufferAttribute(new Float32Array(rows.flatMap(r => r.slice(0, 4))), 4));
      g.setAttribute('aOptics', new THREE.InstancedBufferAttribute(new Float32Array(rows.flatMap(r => r.slice(4, 8))), 4));
      g.instanceCount = rows.length;
      return g;
    }

    const bokehVertex = /* glsl */`
      attribute vec4 aData;
      attribute vec4 aOptics;
      varying vec2 vLocal;
      varying vec4 vOptics;
      varying float vAlpha;
      void main() {
        float id = aOptics.x;
        float depth = aOptics.w;
        vec2 center = warpOptics(aData.xy);
        float t = uTime * uFlow * (.012 + .009 * depth);
        center += vec2(sin(t * .63 + id * 43.), cos(t * .47 + id * 27.))
                  * vec2(.010 / uAspect, .007) * (.3 + depth);
        center += parallax(depth);
        float breathing = 1. + .055 * sin(uTime * .07 + id * 37.);
        vec2 local = position.xy * 1.24;
        float portrait = min(1., .25 + uAspect * .75);
        // Rotate in aspect-correct space to keep circles round on narrow displays.
        vec2 offset = rotate((id - .5) * .48) * (local * vec2(aData.z, aData.z * aOptics.z))
          * vec2(1. / uAspect, 1.) * breathing * portrait * uBokehSize;
        gl_Position = vec4(viewPosition(center + offset) * 2. - 1., 0., 1.);
        vLocal = local;
        vOptics = aOptics;
        vAlpha = aData.w * (.76 + .24 * sin(uTime * (.08 + id * .06) + id * 52.));
      }
    `;
    const bokehFragment = /* glsl */`
      varying vec2 vLocal;
      varying vec4 vOptics;
      varying float vAlpha;
      void main() {
        vec2 p = vLocal;
        float id = vOptics.x;
        float kind = vOptics.y;
        float theta = id * 5. + .2 * sin(uTime * .017 + id * 8.);
        vec2 q = rotate(theta) * p;
        float r = length(p) + .022 * sin(atan(p.y, p.x) * 6. + id * 23.)
          + (noise(p * 5. + id * 19.) - .5) * .035;
        float edge = .075 + .17 * smoothstep(.3, 1., vOptics.w);
        float disc = 1. - smoothstep(.87 - edge, 1. + edge, r);
        float rim = exp(-pow((r - .91) / (.024 + edge * .35), 2.));
        float spectralPosition = q.x * .36 + q.y * .12 + id * 5. + uTime * .0018;
        vec3 prism = spectrum(spectralPosition);
        float bands = .72 + .28 * sin(q.x * 8. + q.y * 3. + id * 41.);
        float saturation = smoothstep(.18, .82, kind);
        saturation *= mix(.52, 1., smoothstep(.7, 1.2, vOptics.w));
        vec3 interior = prism * (.12 + .32 * bands);
        interior = mix(vec3(.13, .145, .16), interior, .25 + saturation * .75);
        // Refraction shifts each color's optical boundary, rather than painting a flat disc.
        vec3 dispersion = vec3(
          exp(-pow((length(p + vec2(.046, -.02)) - .91) / (edge + .025), 2.)),
          exp(-pow((r - .91) / (edge + .02), 2.)),
          exp(-pow((length(p - vec2(.041, -.02)) - .91) / (edge + .025), 2.)));
        float uneven = .46 + .54 * noise(p * 3. + id * 51.);
        float illumination = .52 + .48 * smoothstep(-.7, .8, q.y + q.x * .4);
        vec3 color = interior * disc * uneven * illumination;
        color += (.033 * prism + .035 * dispersion) * rim;
        // Some out-of-focus reflections retain a dark interior and partial spectral caustic.
        float crescent = exp(-pow((length(p - vec2(.18, -.09)) - .77) / .078, 2.));
        if (kind < .26) {
          color *= .57;
          color += spectrum(spectralPosition + .1) * crescent * disc * .12
            * smoothstep(-.2, .8, q.y);
        }
        float airy = exp(-dot(p, p) * 2.8) * .018;
        color += spectrum(id + .2) * airy;
        gl_FragColor = vec4(color * vAlpha, 1.);
      }
    `;

    const backBokeh = [], frontBokeh = [];
    for (let i = 0; i < 350; i++) {
      const x = random() * 1.14 - .07;
      const small = i < 250;
      const y = small ? axis(x) + gaussian() * .058 + .025 : random() * 1.2 - .1;
      const radius = small ? .003 + Math.pow(random(), 2.1) * .023 : .016 + Math.pow(random(), 1.5) * .064;
      const intensity = small ? .12 + random() * .7 : .035 + random() * .16;
      backBokeh.push([x, y, radius, intensity, random(), random(), .72 + random() * .45, .2 + random() * .7]);
    }
    const backMesh = addMesh(instances(backBokeh), material(bokehVertex, bokehFragment, true), 1);

    // Tiny reflective facets: a narrow spine plus ragged shoulders and sparse floating dust.
    const count = 84000;
    const positions = new Float32Array(count * 3);
    const attributes = new Float32Array(count * 4);
    for (let i = 0; i < count; i++) {
      const x = random() * 1.16 - .08;
      const dust = i % 11 === 0;
      const shoulder = i % 5 === 0;
      positions[i * 3] = x;
      positions[i * 3 + 1] = gaussian() * (dust ? .14 : shoulder ? .049 : .018)
        + (shoulder ? .018 : 0);
      positions[i * 3 + 2] = random();
      attributes.set([random(), random(), random(), dust ? 1 : 0], i * 4);
    }
    const glitterGeometry = new THREE.BufferGeometry();
    glitterGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    glitterGeometry.setAttribute('aFacet', new THREE.BufferAttribute(attributes, 4));
    const glitterMaterial = material(/* glsl */`
      attribute vec4 aFacet;
      varying vec3 vColor;
      varying float vBrightness;
      varying float vShape;
      void main() {
        float id = aFacet.x;
        float depth = position.z;
        // The wrap is outside the viewport, with a continuous soft envelope at its ends.
        float x = mod(position.x + .08 + uTime * uFlow * (.00085 + depth * .0007), 1.16) - .08;
        float raggedWidth = .65 + 1.1 * noise(vec2(x * 25., 7.3 + uSeed));
        float y = river(x) + position.y * raggedWidth * uSpread;
        y += .003 * sin(x * 19. + id * 37. + uTime * .08);
        y += .002 * sin(x * 53. - uTime * .045 + depth * 8.);
        vec2 pos = vec2(x, y) + parallax(.6 + depth * .4);
        gl_Position = vec4(viewPosition(pos) * 2. - 1., 0., 1.);
        float pixelScale = clamp(uResolution.y / uPixelRatio / 900., .65, 1.55);
        float size = .55 + 3.4 * pow(aFacet.y, 7.);
        size += aFacet.w * (1. + depth * 2.2);
        float physicalSize = size * uPixelRatio * pixelScale * uViewScale;
        gl_PointSize = max(2., physicalSize);
        float sparkle = pow(.5 + .5 * sin(uTime * (.35 + id * 1.1) + aFacet.z * 99.), 14.);
        float clusters = noise(vec2(x * 48., position.y * 115. + 12.));
        float exposure = .045 + pow(aFacet.z, 4.) * 1.4 + sparkle * uSparkle * 3. * pow(aFacet.y, 2.);
        exposure *= .15 + 2.3 * pow(clusters, 2.4);
        exposure *= min(1., physicalSize * physicalSize / 4.);
        exposure *= mix(1., .12, aFacet.w);
        exposure *= smoothstep(-.08, -.025, x) * (1. - smoothstep(1.025, 1.08, x));
        vec3 tint = spectrum(id * 9.1);
        tint = mix(tint, vec3(.83, .88, 1.), .58 + .35 * aFacet.y);
        vColor = tint;
        vBrightness = exposure;
        vShape = id * TAU;
      }
    `, /* glsl */`
      varying vec3 vColor;
      varying float vBrightness;
      varying float vShape;
      void main() {
        vec2 p = rotate(vShape) * (gl_PointCoord - .5) * 2.;
        float d = dot(p, p);
        float facet = 1. - smoothstep(.33, 1., abs(p.x) + abs(p.y) * .8);
        float core = exp(-d * 6.);
        gl_FragColor = vec4(vColor * (facet * .7 + core * .5) * vBrightness, 1.);
      }
    `, true);
    const glitter = new THREE.Points(glitterGeometry, glitterMaterial);
    glitter.frustumCulled = false;
    glitter.renderOrder = 2;
    scene.add(glitter);

    for (let i = 0; i < 57; i++) {
      const x = random() * 1.2 - .1;
      let y = random() * 1.24 - .12;
      // Keep the upper-right quiet and open, as in a real macro lens photograph.
      if (x > .55 && y > .58 && random() < .8) y -= .53;
      frontBokeh.push([x, y, .021 + Math.pow(random(), 1.6) * .08,
        .065 + random() * .23, random(), random(), .7 + random() * .55, 1.2 + random()]);
    }
    // A few carefully placed large spectral ghosts anchor the otherwise random field.
    frontBokeh.push(
      [.381, .610, .110, 1.20, .538, .8, 1.22, 1.5],
      [.646, .585, .094, .85, .187, .9, .95, 1.7],
      [.678, .236, .072, .55, .365, .6, 1.18, 1.8],
      [.858, .028, .109, .55, .74, .8, 1.09, 2.],
      [.305, .906, .073, .32, .52, .7, 1.3, 1.4],
      [.166, .068, .062, .29, .13, .1, .95, 1.6]
    );
    const frontMesh = addMesh(instances(frontBokeh), material(bokehVertex, bokehFragment, true), 3);

    // Analytic cross-filter response. No sprite textures and no screen-wide blur.
    const flares = [
      [.104, .913, .160, 1.00], [.218, .857, .107, .72],
      [.472, .882, .146, .91], [.550, .733, .160, 1.00],
      [.416, .622, .239, 1.63], [.035, .527, .091, .76],
      [.224, .523, .106, .81], [.364, .445, .140, 1.03],
      [.342, .368, .139, 1.00], [.271, .323, .133, .57],
      [.522, .262, .171, 1.16], [.785, .413, .120, .81],
      [.793, .111, .171, .92], [.941, .141, .144, .73],
      [.260, .153, .079, .34], [.749, .339, .053, .28],
    ].map(row => [...row, random(), .56 + random() * .11, random(), 0]);
    for (let i = 0; i < 18; i++) {
      const x = random();
      flares.push([x, axis(x) + gaussian() * .045, .026 + random() * .035,
        .11 + random() * .3, random(), .62, random(), 0]);
    }
    const flareMesh = addMesh(instances(flares), material(/* glsl */`
      attribute vec4 aData;
      attribute vec4 aOptics;
      varying vec2 vLocal;
      varying vec4 vFlare;
      varying float vScale;
      void main() {
        float id = aOptics.x;
        float t = uTime * .04 * uFlow;
        vec2 center = warpOptics(aData.xy) + vec2(sin(t + id * 31.) * .002 / uAspect,
          cos(t * .73 + id * 63.) * .002) + parallax(.75);
        float flicker = .54 + .30 * sin(uTime * (.15 + id * .12) + id * 51.);
        float flash = pow(.5 + .5 * sin(uTime * (.24 + id * .23) + id * 83.), 20.);
        float power = aData.w * (flicker + flash * .8) * uSparkle;
        vLocal = position.xy;
        vScale = aData.z * uViewScale;
        vFlare = vec4(power, aOptics.y, id, aOptics.z);
        vec2 offset = position.xy * aData.z * vec2(1. / uAspect, 1.);
        gl_Position = vec4(viewPosition(center + offset) * 2. - 1., 0., 1.);
      }
    `, /* glsl */`
      varying vec2 vLocal;
      varying vec4 vFlare;
      varying float vScale;
      void main() {
        vec2 p = rotate(.73 + .03 * sin(vFlare.z * 51.)) * vLocal;
        float r = length(p);
        float pixel = 1. / (uResolution.y * vScale);
        float width = max(pixel * .55, .0023);
        float rays = exp(-abs(p.x) / (width + abs(p.y) * .006)) * exp(-abs(p.y) * 5.0);
        rays += exp(-abs(p.y) / (width + abs(p.x) * .006)) * exp(-abs(p.x) * 5.0);
        float silk = exp(-abs(p.x) / (width * 4.5)) * exp(-abs(p.y) * 5.2);
        silk += exp(-abs(p.y) / (width * 4.5)) * exp(-abs(p.x) * 5.2);
        float core = exp(-r * r / .00085);
        float halation = exp(-r * 23.) * .55 + exp(-r * 7.) * .029;
        vec3 warm = vec3(1., .77, .52);
        vec3 chroma = mix(warm, spectrum(r * .8 + vFlare.z), .14 + .24 * r);
        vec3 light = chroma * (rays * .78 + silk * .065 + halation);
        light += vec3(1., .94, .83) * core * 6.5;
        light += vec3(1., .32, .12) * exp(-r * 37.) * .22;
        vec2 ghost = rotate(.026) * p;
        float ghostRays = exp(-abs(ghost.x + .006) / (width * 1.7)) * exp(-abs(ghost.y) * 4.4);
        ghostRays += exp(-abs(ghost.y - .006) / (width * 1.7)) * exp(-abs(ghost.x) * 4.4);
        light += chroma * ghostRays * .065;
        light *= vFlare.x * (1. - smoothstep(.72, 1., r));
        gl_FragColor = vec4(light, 1.);
      }
    `, true), 4);

    const hdr = renderer.extensions.has('EXT_color_buffer_float');
    const target = new THREE.WebGLRenderTarget(1, 1, {
      type: hdr ? THREE.HalfFloatType : THREE.UnsignedByteType,
      minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
      depthBuffer: false, stencilBuffer: false,
    });
    // ACES-like shoulder keeps the bright cores white without bleaching spectral color.
    const finalUniforms = { ...uniforms, uImage: { value: target.texture } };
    const finalMaterial = new THREE.ShaderMaterial({
      uniforms: finalUniforms, vertexShader: fullscreenVertex,
      fragmentShader: common + /* glsl */`
        uniform sampler2D uImage;
        uniform vec3 uPalette[6];
        uniform float uPaletteCount;
        uniform float uColorMode;
        uniform vec3 uTint;
        uniform vec3 uAccent;
        uniform vec3 uBackground;
        uniform float uInvert;
        varying vec2 vUv;
        vec3 film(vec3 x) {
          return clamp((x * (2.51 * x + .03)) / (x * (2.43 * x + .59) + .14), 0., 1.);
        }
        vec3 palette(float phase) {
          float t = fract(phase) * (uPaletteCount - 1.);
          int i = int(floor(t));
          return mix(uPalette[i], uPalette[min(i + 1, 5)], smoothstep(0., 1., fract(t)));
        }
        void main() {
          vec2 uv = vUv;
          vec2 delta = (uv - .5) / uResolution * .47;
          vec3 color = texture2D(uImage, uv).rgb;
          color.r = texture2D(uImage, uv + delta).r;
          color.b = texture2D(uImage, uv - delta).b;
          float vignette = 1. - .24 * smoothstep(.18, .83, length((uv - .5) * vec2(1., .87)));
          color = film(color * 1.38 * vignette);
          color = pow(color, vec3(1. / 2.2));
          float peak = max(color.r, max(color.g, color.b));
          float coverage = peak * smoothstep(.007, .035, peak);
          vec3 paint = color / max(.0001, peak);
          float hue = atan(1.73205 * (color.g - color.b), 2. * color.r - color.g - color.b + .00001) / TAU + .5;
          // Accent follows existing warm spectral reflections, preserving soft optical edges.
          float accents = smoothstep(.09, .30, color.r - max(color.g, color.b));
          if (uColorMode > .5 && uColorMode < 1.5) {
            paint = palette(hue);
            paint = mix(paint, uPalette[0], smoothstep(.82, 1., peak) * .7);
          } else if (uColorMode > 1.5 && uColorMode < 3.5) {
            paint = vec3(1. - uInvert);
            if (uColorMode > 2.5) paint = mix(paint, uAccent, accents);
          } else if (uColorMode > 3.5) {
            paint = mix(uPalette[2], uPalette[0], peak);
            paint = mix(paint, uAccent, accents);
          }
          paint *= uTint;
          float grainA = hash31(vec3(gl_FragCoord.xy, floor(uTime * 24.)));
          float grainB = hash31(vec3(gl_FragCoord.xy, floor(uTime * 24.) + 1.));
          float grain = mix(grainA, grainB, smoothstep(0., 1., fract(uTime * 24.))) - .5;
          // Only the optical layer receives grain. Uncovered chroma-key pixels stay exact.
          paint += grain * .009;
          color = mix(uBackground, clamp(paint, 0., 1.), coverage);
          gl_FragColor = vec4(color, 1.);
        }
      `,
      depthTest: false, depthWrite: false, toneMapped: false,
    });
    const outputScene = new THREE.Scene();
    const output = new THREE.Mesh(plane, finalMaterial);
    output.frustumCulled = false;
    outputScene.add(output);

    let quality = 1;
    let width = 0, height = 0;
    const drawingSize = new THREE.Vector2();
    function resize() {
      width = Math.max(1, window.innerWidth);
      height = Math.max(1, window.innerHeight);
      // Cap both DPI and total fill cost; adapt further when sustained rendering is slow.
      const ratio = settings.adaptiveDPR
        ? Math.min(settings.pixelRatio, Math.sqrt(3600000 / (width * height))) * quality
        : settings.pixelRatio;
      renderer.setPixelRatio(ratio);
      renderer.setSize(width, height);
      renderer.getDrawingBufferSize(drawingSize);
      target.setSize(drawingSize.x, drawingSize.y);
      uniforms.uResolution.value.copy(drawingSize);
      uniforms.uAspect.value = width / height;
      uniforms.uPixelRatio.value = ratio;
      updateDensity();
    }
    function updateDensity() {
      glitterGeometry.setDrawRange(0, Math.min(count, Math.floor(count * settings.density
        * Math.min(1, Math.max(.24, width * height / 1188096)))));
    }

    // Palette values and background are display-referred; HDR lighting is graded first.
    const displayColor = (targetColor, hex) => targetColor.set(hex).convertLinearToSRGB();
    let paletteEdited = false;
    function syncColors() {
      const scheme = schemes[settings.scheme];
      uniforms.uColorMode.value = paletteEdited ? 1 : (scheme.mode ?? 1);
      uniforms.uPaletteCount.value = paletteEdited ? 6 : scheme.colors.length;
      for (let i = 0; i < 6; i++) displayColor(uniforms.uPalette.value[i], settings['palette' + (i + 1)]);
      displayColor(uniforms.uTint.value, settings.color);
      displayColor(uniforms.uAccent.value, settings.accent);
      displayColor(uniforms.uBackground.value, settings.greenscreen ? '#00ff00' : settings.background);
      uniforms.uInvert.value = settings.invert ? 1 : 0;
    }
    function refreshPanel() { gui.controllersRecursive().forEach(controller => controller.updateDisplay()); }
    function applyScheme() {
      const scheme = schemes[settings.scheme];
      paletteEdited = false;
      settings.color = '#ffffff';
      settings.background = '#' + scheme.bg;
      for (let i = 0; i < 6; i++) settings['palette' + (i + 1)] = '#' + scheme.colors[Math.min(i, scheme.colors.length - 1)];
      settings.accent = settings.scheme === 'Neutral + accent' ? '#d9884e' : '#ff253b';
      if ((scheme.mode === 2 || scheme.mode === 3) && settings.invert) settings.background = '#ffffff';
      syncColors();
      refreshPanel();
    }
    function syncOptics() {
      uniforms.uSpread.value = settings.spread;
      uniforms.uSlope.value = settings.slope;
      uniforms.uBokehSize.value = settings.bokehSize;
      uniforms.uSparkle.value = settings.sparkle;
      uniforms.uFlow.value = settings.flow;
      updateDensity();
    }

    const originalFront = frontBokeh.map(row => row.slice());
    const originalFlares = flares.map(row => row.slice());
    function updateInstances(mesh, rows) {
      const data = mesh.geometry.getAttribute('aData');
      const optics = mesh.geometry.getAttribute('aOptics');
      for (let i = 0; i < rows.length; i++) {
        data.array.set(rows[i].slice(0, 4), i * 4);
        optics.array.set(rows[i].slice(4, 8), i * 4);
      }
      data.needsUpdate = optics.needsUpdate = true;
    }
    function regenerate() {
      seed = settings.seed >>> 0;
      uniforms.uSeed.value = (settings.seed % 997) / 13;
      for (let i = 0; i < count; i++) {
        positions[i * 3] = random() * 1.16 - .08;
        const dust = i % 11 === 0, shoulder = i % 5 === 0;
        positions[i * 3 + 1] = gaussian() * (dust ? .14 : shoulder ? .049 : .018) + (shoulder ? .018 : 0);
        positions[i * 3 + 2] = random();
        attributes.set([random(), random(), random(), dust ? 1 : 0], i * 4);
      }
      glitterGeometry.attributes.position.needsUpdate = true;
      glitterGeometry.attributes.aFacet.needsUpdate = true;
      for (let i = 0; i < backBokeh.length; i++) {
        const x = random() * 1.14 - .07, small = i < 250;
        backBokeh[i] = [x, small ? axis(x) + gaussian() * .058 + .025 : random() * 1.2 - .1,
          small ? .003 + Math.pow(random(), 2.1) * .023 : .016 + Math.pow(random(), 1.5) * .064,
          small ? .12 + random() * .7 : .035 + random() * .16,
          random(), random(), .72 + random() * .45, .2 + random() * .7];
      }
      for (let i = 0; i < frontBokeh.length; i++) {
        const anchor = originalFront[i];
        let x = i < 57 ? random() * 1.2 - .1 : anchor[0] + (random() - .5) * .17;
        let y = i < 57 ? random() * 1.24 - .12 : anchor[1] + (random() - .5) * .18;
        if (i < 57 && x > .55 && y > .58 && random() < .8) y -= .53;
        frontBokeh[i] = [x, y, anchor[2] * (.7 + random() * .6), anchor[3] * (.7 + random() * .6),
          random(), random(), .7 + random() * .55, 1.2 + random()];
      }
      for (let i = 0; i < flares.length; i++) {
        const base = originalFlares[i];
        const x = i < 16 ? base[0] + (random() - .5) * .15 : random();
        const y = i < 16 ? base[1] + (random() - .5) * .18 : axis(x) + gaussian() * .045;
        flares[i] = [x, y, base[2] * (.7 + random() * .6), base[3] * (.65 + random() * .7), random(), .62, random(), 0];
      }
      updateInstances(backMesh, backBokeh);
      updateInstances(frontMesh, frontBokeh);
      updateInstances(flareMesh, flares);
    }
    function randomizeTheme() {
      const names = Object.keys(schemes).filter(name => name !== settings.scheme);
      settings.scheme = names[Math.floor(Math.random() * names.length)];
      settings.seed = Math.floor(Math.random() * 1000000);
      settings.spread = .7 + Math.random() * 1.15;
      settings.slope = -.25 - Math.random() * .5;
      settings.bokehSize = .7 + Math.random() * .65;
      settings.sparkle = .65 + Math.random() * .9;
      settings.flow = .65 + Math.random() * .85;
      settings.density = .65 + Math.random() * .35;
      settings.motion = .5 + Math.random() * .8;
      settings.orbitTilt = 8 + Math.random() * 24;
      settings.speed = .55 + Math.random() * .65;
      settings.animation = animationModes[1 + Math.floor(Math.random() * 7)];
      regenerate();
      syncOptics();
      applyScheme();
    }

    // Stock lil-gui presentation; all on-screen content is settings, with no help overlays.
    const gui = new GUI({ title: 'Prismatic Dust' });
    gui.add(settings, 'scheme', Object.keys(schemes)).name('Color scheme').onChange(applyScheme);
    gui.addColor(settings, 'color').name('Color tint').onChange(syncColors);
    gui.addColor(settings, 'accent').name('Accent color').onChange(syncColors);
    gui.add(settings, 'invert').name('Invert achromatic').onChange(() => {
      const mode = schemes[settings.scheme].mode;
      if (mode === 2 || mode === 3) settings.background = settings.invert ? '#ffffff' : '#000000';
      syncColors(); refreshPanel();
    });
    gui.addColor(settings, 'background').name('Background color').onChange(syncColors);
    gui.add(settings, 'greenscreen').name('Green screen').onChange(syncColors);
    const paletteFolder = gui.addFolder('Palette colors').close();
    for (let i = 1; i <= 6; i++) {
      paletteFolder.addColor(settings, 'palette' + i).name('Color ' + i).onChange(() => {
        paletteEdited = true;
        syncColors();
        uniforms.uPaletteCount.value = 6;
      });
    }
    const motionFolder = gui.addFolder('Animation');
    motionFolder.add(settings, 'animation', animationModes).name('Animation').onChange(value => {
      if (value === 'Static') {
        for (const key of Object.keys(motionState)) motionState[key] = 0;
        uniforms.uMouse.value.set(0, 0);
      }
    });
    motionFolder.add(settings, 'speed', 0, 3, .01).name('Speed');
    motionFolder.add(settings, 'motion', 0, 2, .01).name('Camera motion');
    motionFolder.add(settings, 'orbitTilt', 0, 65, .1).name('Orbit tilt');
    const viewFolder = gui.addFolder('View');
    const zoomControl = viewFolder.add(settings, 'zoom', .2, 6, .01).name('Zoom');
    const angleControl = viewFolder.add(settings, 'angle', -180, 180, .1).name('Camera angle');
    const panXControl = viewFolder.add(settings, 'panX', -3, 3, .001).name('Position X');
    const panYControl = viewFolder.add(settings, 'panY', -3, 3, .001).name('Position Y');
    viewFolder.add({ reset: () => {
      Object.assign(settings, { zoom: 1, angle: 0, panX: 0, panY: 0 }); refreshPanel();
    } }, 'reset').name('Reset view');
    const opticsFolder = gui.addFolder('Optics').close();
    opticsFolder.add(settings, 'spread', .3, 2.5, .01).name('River width').onChange(syncOptics);
    opticsFolder.add(settings, 'slope', -.95, .6, .005).name('River slope').onChange(syncOptics);
    opticsFolder.add(settings, 'bokehSize', .3, 2, .01).name('Bokeh size').onChange(syncOptics);
    opticsFolder.add(settings, 'sparkle', .1, 2.5, .01).name('Sparkle').onChange(syncOptics);
    opticsFolder.add(settings, 'flow', 0, 2, .01).name('Particle drift').onChange(syncOptics);
    opticsFolder.add(settings, 'density', .15, 1, .01).name('Glitter density').onChange(syncOptics);
    const renderFolder = gui.addFolder('Rendering').close();
    function resetDPR() { quality = 1; resize(); }
    renderFolder.add(settings, 'pixelRatio', .5, 3, .1).name('DPR (Pixel Ratio)').onChange(resetDPR);
    renderFolder.add(settings, 'adaptiveDPR').name('Adaptive DPR').onChange(resetDPR);
    const variationFolder = gui.addFolder('Variation');
    variationFolder.add(settings, 'randomizeOnClick').name('Randomize on click');
    variationFolder.add(settings, 'seed', 0, 999999, 1).name('Seed').onFinishChange(regenerate);
    variationFolder.add({ randomizeTheme }, 'randomizeTheme').name('New visual theme');
    applyScheme();
    resize();
    window.addEventListener('resize', resize, { passive: true });
    let uiVisible = true;
    window.addEventListener('keydown', event => {
      if (event.repeat || event.ctrlKey || event.metaKey || event.altKey) return;
      if (event.key.toLowerCase() === 'h') {
        event.preventDefault();
        uiVisible = !uiVisible;
        gui.show(uiVisible);
      }
    }, { capture: true });

    let gesture = null;
    canvas.addEventListener('contextmenu', event => event.preventDefault());
    canvas.addEventListener('pointerdown', event => {
      if (!event.isPrimary || (event.button !== 0 && event.button !== 2)) return;
      gesture = { id: event.pointerId, x: event.clientX, y: event.clientY, distance: 0,
        rotate: event.button === 2 || event.shiftKey };
      canvas.setPointerCapture(event.pointerId);
      canvas.classList.add('dragging');
    });
    canvas.addEventListener('pointermove', event => {
      pointer.set(event.clientX / width * 2 - 1, 1 - event.clientY / height * 2);
      if (!gesture || gesture.id !== event.pointerId) return;
      const dx = event.clientX - gesture.x, dy = event.clientY - gesture.y;
      gesture.distance += Math.hypot(dx, dy);
      gesture.x = event.clientX; gesture.y = event.clientY;
      if (gesture.distance < 4) return;
      if (gesture.rotate) {
        settings.angle = THREE.MathUtils.euclideanModulo(settings.angle + dx * .16 + 180, 360) - 180;
        settings.orbitTilt = THREE.MathUtils.clamp(settings.orbitTilt + dy * .12, 0, 65);
        angleControl.updateDisplay();
        refreshPanel();
      } else {
        settings.panX = THREE.MathUtils.clamp(settings.panX + dx / height, -3, 3);
        settings.panY = THREE.MathUtils.clamp(settings.panY - dy / height, -3, 3);
        panXControl.updateDisplay(); panYControl.updateDisplay();
      }
    });
    function endGesture(event, cancelled = false) {
      if (!gesture || gesture.id !== event.pointerId) return;
      const click = !cancelled && gesture.distance < 4 && !gesture.rotate;
      gesture = null;
      canvas.classList.remove('dragging');
      if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
      if (click && settings.randomizeOnClick) randomizeTheme();
    }
    canvas.addEventListener('pointerup', event => endGesture(event));
    canvas.addEventListener('pointercancel', event => endGesture(event, true));
    canvas.addEventListener('lostpointercapture', event => endGesture(event, true));
    canvas.addEventListener('pointerleave', () => pointer.set(0, 0));
    canvas.addEventListener('wheel', event => {
      event.preventDefault();
      const delta = event.deltaY * (event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? height : 1);
      settings.zoom = THREE.MathUtils.clamp(settings.zoom * Math.exp(-THREE.MathUtils.clamp(delta, -250, 250) * .0015), .2, 6);
      zoomControl.updateDisplay();
    }, { passive: false });

    // Camera motion is an offset around the persistent manual framing, never its replacement.
    const motionState = { x: 0, y: 0, roll: 0, pitch: 0, yaw: 0, scale: 0 };
    const motionTarget = { ...motionState };
    let viewZoom = settings.zoom;
    function updateView(dt, time) {
      const t = time * .065, amount = settings.motion;
      Object.keys(motionTarget).forEach(key => { motionTarget[key] = 0; });
      switch (settings.animation) {
        case 'Ambient drift':
          motionTarget.x = .009 * Math.sin(t * .67);
          motionTarget.y = .006 * Math.sin(t * .43);
          motionTarget.roll = .008 * Math.sin(t * .37); break;
        case 'River glide':
          motionTarget.x = .033 * Math.sin(t * .45);
          motionTarget.y = -.018 * Math.sin(t * .45);
          motionTarget.roll = .012 * Math.sin(t * .31); break;
        case 'Orbit':
          motionTarget.x = .024 * Math.sin(t * .61);
          motionTarget.y = .015 * (Math.cos(t * .61) - 1.);
          motionTarget.roll = .055 * Math.sin(t * .61);
          motionTarget.pitch = THREE.MathUtils.degToRad(settings.orbitTilt) * Math.sin(t * .61);
          motionTarget.yaw = THREE.MathUtils.degToRad(settings.orbitTilt) * .65 * Math.cos(t * .61); break;
        case 'Pendulum':
          motionTarget.roll = .10 * Math.sin(t * .65);
          motionTarget.x = .016 * Math.sin(t * .65); break;
        case 'Lens breathing':
          motionTarget.scale = .045 * Math.sin(t * .6);
          motionTarget.y = .005 * Math.sin(t * .37); break;
        case 'Parallax float':
          motionTarget.x = .02 * Math.sin(t * .51);
          motionTarget.y = .017 * Math.sin(t * .73);
          motionTarget.pitch = .10 * Math.sin(t * .37);
          motionTarget.yaw = .12 * Math.sin(t * .41); break;
        case 'Slow spiral':
          motionTarget.x = .014 * Math.sin(t * .43);
          motionTarget.y = .014 * (Math.cos(t * .43) - 1.);
          motionTarget.roll = .08 * Math.sin(t * .31);
          motionTarget.scale = .035 * Math.sin(t * .53); break;
      }
      const ease = 1 - Math.exp(-dt * 2.5);
      for (const key of Object.keys(motionState)) motionState[key] += (motionTarget[key] * amount - motionState[key]) * ease;
      viewZoom += (settings.zoom - viewZoom) * (1 - Math.exp(-dt * 14));
      const zoom = viewZoom * Math.exp(motionState.scale);
      const angle = THREE.MathUtils.degToRad(settings.angle) + motionState.roll;
      const cs = Math.cos(angle), sn = Math.sin(angle);
      const cx = Math.cos(motionState.pitch), sx = Math.sin(motionState.pitch);
      const cy = Math.cos(motionState.yaw), sy = Math.sin(motionState.yaw);
      const aspect = uniforms.uAspect.value;
      const a = zoom * cs * cy, b = zoom * (cs * sy * sx - sn * cx) / aspect;
      const c = zoom * sn * cy * aspect, d = zoom * (sn * sy * sx + cs * cx);
      const x = .5 - .5 * (a + b) + (settings.panX + motionState.x) / aspect;
      const y = .5 - .5 * (c + d) + settings.panY + motionState.y;
      uniforms.uView.value.set(a, b, x, c, d, y, 0, 0, 1);
      uniforms.uInverseView.value.copy(uniforms.uView.value).invert();
      uniforms.uViewScale.value = zoom * Math.sqrt(Math.max(.05, cx * cy));
    }

    let frame = 0, last = performance.now(), elapsed = 0;
    let sampleTime = 0, sampleFrames = 0, settleFrames = 150;
    let running = false, contextLost = false;
    function tick(now) {
      if (!running) return;
      const dt = Math.min((now - last) / 1000, .05);
      last = now;
      elapsed += dt * settings.speed;
      uniforms.uTime.value = elapsed;
      const allowParallax = settings.animation !== 'Static';
      uniforms.uMouse.value.lerp(allowParallax ? pointer : stillPointer, 1 - Math.exp(-dt * 1.5));
      updateView(dt, elapsed);
      renderer.setRenderTarget(target);
      renderer.render(scene, camera);
      renderer.setRenderTarget(null);
      renderer.render(outputScene, camera);
      if (settleFrames > 0) settleFrames--;
      else {
        sampleTime += dt;
        sampleFrames++;
        if (sampleFrames === 120) {
          const average = sampleTime / sampleFrames;
          if (settings.adaptiveDPR && average > .025 && quality > .59) {
            quality = Math.max(.58, quality * .85);
            resize();
            settleFrames = 90;
          }
          sampleTime = 0;
          sampleFrames = 0;
        }
      }
      frame = requestAnimationFrame(tick);
    }
    function syncPlayback() {
      const shouldRun = !document.hidden && !contextLost;
      if (shouldRun && !running) {
        running = true;
        last = performance.now();
        frame = requestAnimationFrame(tick);
      } else if (!shouldRun && running) {
        running = false;
        cancelAnimationFrame(frame);
      }
    }
    document.addEventListener('visibilitychange', syncPlayback);
    canvas.addEventListener('webglcontextlost', event => {
      event.preventDefault();
      contextLost = true;
      syncPlayback();
    });
    canvas.addEventListener('webglcontextrestored', () => {
      contextLost = false;
      resize();
      syncPlayback();
    });
    syncPlayback();
  } catch (error) {
    console.error('Prismatic Dust could not start:', error);
    renderer?.dispose();
    renderer?.domElement.remove();
    const message = document.createElement('p');
    message.className = 'unavailable';
    message.textContent = 'This artwork needs WebGL 2 and an internet connection to load Three.js. Please enable hardware acceleration and reload.';
    document.body.appendChild(message);
  }
})();
</script>
</body>
</html>
