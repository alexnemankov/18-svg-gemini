    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",

  <body>
    <script type="module">
      import * as THREE from 'three';
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
      import GUI from 'lil-gui';

      // =========================================================================================
      // POST PROCESSOR SUITE (Three.js Shader Post-Processing Pipeline + Fisheye)
      // =========================================================================================
      const orthoVertexShader = `
        precision highp float;
        in vec3 position;
        out vec2 vUv;
        void main() {
          vUv = position.xy * 0.5 + 0.5;
          gl_Position = vec4(position, 1.0);
        }
      `;

      const brightFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        uniform float bloomThreshold;
        in vec2 vUv;
        out vec4 fragColor;

        void main() {
          vec4 color = texture(inputTexture, vUv);
          float luminance = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
          float knee = 0.1;
          float soft = luminance - bloomThreshold + knee;
          soft = clamp(soft, 0.0, 2.0 * knee);
          soft = (soft * soft) / (4.0 * knee + 0.00001);
          float contribution = max(soft, luminance - bloomThreshold);
          contribution /= max(luminance, 0.00001);
          fragColor = vec4(color.rgb * contribution, color.a);
        }
      `;

      const blur13ShaderChunk = `
        vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
          vec2 resolution = vec2(textureSize(image, 0));
          vec4 color = vec4(0.0);
          vec2 off1 = vec2(1.411764705882353) * direction;
          vec2 off2 = vec2(3.2941176470588234) * direction;
          vec2 off3 = vec2(5.176470588235294) * direction;
          color += texture(image, uv) * 0.1964825501511404;
          color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
          color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
          color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
          color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
          color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
          color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
          return color;
        }
      `;

      const blurFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        uniform vec2 direction;
        in vec2 vUv;
        out vec4 color;
        ${blur13ShaderChunk}
        void main() {
          color = blur13(inputTexture, vUv, direction);
        }
      `;

      const finalFragmentShader = `
        precision highp float;
        uniform vec2 resolution;
        uniform sampler2D inputTexture;
        uniform sampler2D blur0Texture;
        uniform sampler2D blur1Texture;
        uniform sampler2D blur2Texture;
        uniform sampler2D blur3Texture;
        uniform sampler2D blur4Texture;
        uniform bool bloomEnabled;
        uniform float bloomStrength;
        uniform float vignetteBoost;
        uniform float vignetteReduction;
        uniform float noiseIntensity;
        uniform float time;
        in vec2 vUv;
        out vec4 fragColor;

        float vignette(vec2 uv, float boost, float reduction) {
          vec2 position = vUv - 0.5;
          return boost - length(position) * reduction;
        }

        float hash1(uint n) {
          n = (n << 13U) ^ n;
          n = n * (n * n * 15731U + 789221U) + 1376312589U;
          return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
        }

        float noise(in vec2 uv, in float timeVal) {
          uvec2 p = uvec2(uv);
          return hash1(p.x + 1920U * p.y + (1920U * 1080U) * uint(timeVal));
        }

        void main() {
          vec4 color = texture(inputTexture, vUv);

          if (bloomEnabled && bloomStrength > 0.001) {
            vec4 b0 = texture(blur0Texture, vUv);
            vec4 b1 = texture(blur1Texture, vUv);
            vec4 b2 = texture(blur2Texture, vUv);
            vec4 b3 = texture(blur3Texture, vUv);
            vec4 b4 = texture(blur4Texture, vUv);

            vec4 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
            color += bloomSum * bloomStrength;
          }

          color.rgb *= vignette(vUv, vignetteBoost, vignetteReduction);
          color.rgb += noiseIntensity * noise(gl_FragCoord.xy, time);
          fragColor = vec4(color.rgb, 1.0);
        }
      `;

      const chromaticAberrationShaderChunk = `
        vec2 barrelDistortion(vec2 coord, float amt) {
          vec2 cc = coord - 0.5;
          float dist = dot(cc, cc);
          return coord + cc * dist * amt;
        }
        float sat(float t) { return clamp(t, 0.0, 1.0); }
        float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
        float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
        vec4 spectrum_offset(float t) {
          float lo = step(t, 0.5);
          float hi = 1.0 - lo;
          float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
          vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
          return pow(ret, vec4(1.0 / 2.2));
        }
        const float max_distort = 2.2;
        const int num_iter = 8;
        const float reci_num_iter_f = 1.0 / float(num_iter);
        vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
          vec4 sumcol = vec4(0.0);
          vec4 sumw = vec4(0.0);
          for (int i = 0; i < num_iter; ++i) {
            float t = float(i) * reci_num_iter_f;
            vec4 w = spectrum_offset(t);
            sumw += w;
            sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
          }
          return sumcol / sumw;
        }
      `;

      const colorFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        uniform float chromaticAberrationAmount;
        uniform float minInputLevel;
        uniform float maxInputLevel;
        uniform float gammaLevel;
        uniform float fisheyeStrength;
        uniform float fisheyeRadius;
        uniform float time;
        in vec2 vUv;
        out vec4 fragColor;

        ${chromaticAberrationShaderChunk}

        vec2 applyFisheye(vec2 uv, float strength, float radius) {
          if (abs(strength) < 0.0001) return uv;
          vec2 p = uv - 0.5;
          float d = length(p);
          if (d > radius * 1.5) return uv;
          float r = d / max(radius, 0.001);
          float theta = atan(p.y, p.x);
          float rDist = r + strength * (r * r * r);
          return 0.5 + vec2(cos(theta), sin(theta)) * (rDist * radius);
        }

        vec3 gammaCorrect(vec3 color, vec3 gamma) {
          return pow(max(color, vec3(0.0)), 1.0 / gamma);
        }
        vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
          return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
        }
        vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
          return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
        }

        void main() {
          vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
          if (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) {
            fragColor = vec4(0.0, 0.0, 0.0, 1.0);
            return;
          }
          fragColor = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
          fragColor.rgb = finalLevels(fragColor.rgb, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
          fragColor.a = 1.0;
        }
      `;

      const copyFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        in vec2 vUv;
        out vec4 fragColor;
        void main() {
          fragColor = texture(inputTexture, vUv);
        }
      `;

      function createFBO(w, h, options = {}) {
        return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
          wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
          wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
          minFilter: options.minFilter || THREE.LinearFilter,
          magFilter: options.magFilter || THREE.LinearFilter,
          format: options.format || THREE.RGBAFormat,
          type: options.type || THREE.HalfFloatType,
          stencilBuffer: options.stencilBuffer || false,
          depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : true,
          samples: options.samples || 0,
        });
      }

      class ShaderPass {
        constructor(shader, options = {}) {
          this.shader = shader;
          this.orthoScene = new THREE.Scene();
          this.fbo = createFBO(1, 1, options);
          this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
          this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
          this.orthoScene.add(this.orthoQuad);
          this.texture = this.fbo.texture;
        }
        render(renderer, toScreen = false) {
          if (!toScreen) {
            renderer.setRenderTarget(this.fbo);
          }
          renderer.render(this.orthoScene, this.orthoCamera);
          if (!toScreen) {
            renderer.setRenderTarget(null);
          }
        }
        setSize(width, height) {
          this.fbo.setSize(Math.max(1, width), Math.max(1, height));
          this.orthoQuad.scale.set(width, height, 1);
        }
      }

      class ShaderPingPongPass {
        constructor(shader, options = {}) {
          this.shader = shader;
          this.orthoScene = new THREE.Scene();
          this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
          this.currentFBO = 0;
          this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
          this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
          this.orthoScene.add(this.orthoQuad);
        }
        render(renderer) {
          renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
          renderer.render(this.orthoScene, this.orthoCamera);
          renderer.setRenderTarget(null);
          this.currentFBO = 1 - this.currentFBO;
        }
        get current() { return this.fbos[this.currentFBO]; }
        get texture() { return this.current.texture; }
        setSize(width, height) {
          const w = Math.max(1, width);
          const h = Math.max(1, height);
          this.orthoQuad.scale.set(w, h, 1);
          this.fbos[0].setSize(w, h);
          this.fbos[1].setSize(w, h);
        }
      }

      class BloomPass {
        constructor(strength = 0.8, radius = 0.5, threshold = 0.2, levels = 5) {
          this.strength = strength;
          this.radius = radius;
          this.threshold = threshold;
          this.enabled = true;
          this.levels = levels;

          this.brightShader = new THREE.RawShaderMaterial({
            uniforms: {
              inputTexture: { value: null },
              bloomThreshold: { value: this.threshold },
            },
            vertexShader: orthoVertexShader,
            fragmentShader: brightFragmentShader,
            glslVersion: THREE.GLSL3,
          });
          this.brightPass = new ShaderPass(this.brightShader, {
            format: THREE.RGBAFormat,
            type: THREE.HalfFloatType,
          });

          this.blurShader = new THREE.RawShaderMaterial({
            uniforms: {
              inputTexture: { value: null },
              direction: { value: new THREE.Vector2(0, 1) },
            },
            vertexShader: orthoVertexShader,
            fragmentShader: blurFragmentShader,
            glslVersion: THREE.GLSL3,
          });

          this.blurPasses = [];
          for (let i = 0; i < this.levels; i++) {
            this.blurPasses.push(new ShaderPingPongPass(this.blurShader, {
              format: THREE.RGBAFormat,
              type: THREE.HalfFloatType,
            }));
          }
        }

        setSize(w, h) {
          let tw = Math.max(1, w);
          let th = Math.max(1, h);
          this.brightPass.setSize(tw, th);
          for (let i = 0; i < this.levels; i++) {
            tw = Math.max(1, Math.round(tw / 2));
            th = Math.max(1, Math.round(th / 2));
            this.blurPasses[i].setSize(tw, th);
          }
        }

        set source(texture) {
          this.brightShader.uniforms.inputTexture.value = texture;
        }

        render(renderer) {
          if (!this.enabled || this.strength <= 0.001) return;

          this.brightShader.uniforms.bloomThreshold.value = this.threshold;
          this.brightPass.render(renderer);

          const baseOffset = Math.max(0.1, this.radius * 2.0);
          const u = this.blurShader.uniforms;

          for (let j = 0; j < this.levels; j++) {
            const blurPass = this.blurPasses[j];
            const stepOffset = baseOffset * (1.0 + j * 0.5);

            u.direction.value.set(stepOffset, 0);
            u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
            blurPass.render(renderer);

            u.direction.value.set(0, stepOffset * 0.5);
            u.inputTexture.value = blurPass.current.texture;
            blurPass.render(renderer);
          }
        }
      }

      class PostProcessor {
        constructor(renderer, params = {}) {
          this.renderer = renderer;

          this.settings = {
            enabled: params.enabled !== undefined ? params.enabled : false,
            bloomEnabled: params.bloomEnabled !== undefined ? params.bloomEnabled : true,
            bloomStrength: params.bloomStrength !== undefined ? params.bloomStrength : 0.8,
            bloomRadius: params.bloomRadius !== undefined ? params.bloomRadius : 0.5,
            bloomThreshold: params.bloomThreshold !== undefined ? params.bloomThreshold : 0.2,
            fisheyeStrength: params.fisheyeStrength !== undefined ? params.fisheyeStrength : 0.0,
            fisheyeRadius: params.fisheyeRadius !== undefined ? params.fisheyeRadius : 1.0,
            chromaticAberration: params.chromaticAberration !== undefined ? params.chromaticAberration : 0.04,
            vignetteBoost: params.vignetteBoost !== undefined ? params.vignetteBoost : 1.0,
            vignetteReduction: params.vignetteReduction !== undefined ? params.vignetteReduction : 0.5,
            noiseIntensity: params.noiseIntensity !== undefined ? params.noiseIntensity : 0.02,
            gamma: params.gamma !== undefined ? params.gamma : 1.0,
            minInputLevel: params.minInputLevel !== undefined ? params.minInputLevel : 0.0,
            maxInputLevel: params.maxInputLevel !== undefined ? params.maxInputLevel : 1.0,
          };

          this.sceneTarget = createFBO(1, 1, { type: THREE.HalfFloatType });

          this.bloomPass = new BloomPass(
            this.settings.bloomStrength,
            this.settings.bloomRadius,
            this.settings.bloomThreshold,
            5
          );

          this.finalShader = new THREE.RawShaderMaterial({
            uniforms: {
              resolution: { value: new THREE.Vector2(1, 1) },
              bloomEnabled: { value: this.settings.bloomEnabled },
              bloomStrength: { value: this.settings.bloomStrength },
              vignetteBoost: { value: this.settings.vignetteBoost },
              vignetteReduction: { value: this.settings.vignetteReduction },
              noiseIntensity: { value: this.settings.noiseIntensity },
              inputTexture: { value: null },
              blur0Texture: { value: null },
              blur1Texture: { value: null },
              blur2Texture: { value: null },
              blur3Texture: { value: null },
              blur4Texture: { value: null },
              time: { value: 0 },
            },
            vertexShader: orthoVertexShader,
            fragmentShader: finalFragmentShader,
            glslVersion: THREE.GLSL3,
          });
          this.finalPass = new ShaderPass(this.finalShader);

          this.rgbShader = new THREE.RawShaderMaterial({
            uniforms: {
              inputTexture: { value: this.finalPass.texture },
              fisheyeStrength: { value: this.settings.fisheyeStrength },
              fisheyeRadius: { value: this.settings.fisheyeRadius },
              chromaticAberrationAmount: { value: this.settings.chromaticAberration },
              minInputLevel: { value: this.settings.minInputLevel },
              maxInputLevel: { value: this.settings.maxInputLevel },
              gammaLevel: { value: this.settings.gamma },
              time: { value: 0 },
            },
            vertexShader: orthoVertexShader,
            fragmentShader: colorFragmentShader,
            glslVersion: THREE.GLSL3,
          });
          this.rgbPass = new ShaderPass(this.rgbShader);

          this.copyShader = new THREE.RawShaderMaterial({
            uniforms: {
              inputTexture: { value: null },
            },
            vertexShader: orthoVertexShader,
            fragmentShader: copyFragmentShader,
            glslVersion: THREE.GLSL3,
          });
          this.copyPass = new ShaderPass(this.copyShader);
        }

        updateSettings() {
          this.bloomPass.enabled = this.settings.bloomEnabled;
          this.bloomPass.strength = this.settings.bloomStrength;
          this.bloomPass.radius = this.settings.bloomRadius;
          this.bloomPass.threshold = this.settings.bloomThreshold;

          this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
          this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
          this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
          this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
          this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;

          this.rgbShader.uniforms.fisheyeStrength.value = this.settings.fisheyeStrength;
          this.rgbShader.uniforms.fisheyeRadius.value = this.settings.fisheyeRadius;
          this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
          this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
          this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
          this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
        }

        setSize(w0, h0, dpr = 1) {
          const w = Math.max(1, Math.floor(w0 * dpr));
          const h = Math.max(1, Math.floor(h0 * dpr));
          this.sceneTarget.setSize(w, h);
          this.finalPass.setSize(w, h);
          this.finalShader.uniforms.resolution.value.set(w, h);
          this.bloomPass.setSize(w, h);
          this.rgbPass.setSize(w, h);
          this.copyPass.setSize(w, h);
        }

        renderScene(scene, camera) {
          if (!this.settings.enabled) {
            this.renderer.render(scene, camera);
            return;
          }
          this.renderer.setRenderTarget(this.sceneTarget);
          this.renderer.render(scene, camera);
          this.renderer.setRenderTarget(null);
          this.render(this.sceneTarget.texture);
        }

        render(sourceTexture) {
          if (!this.settings.enabled) {
            this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
            this.copyPass.render(this.renderer, true);
            return;
          }

          this.updateSettings();

          this.bloomPass.source = sourceTexture;
          this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
          this.bloomPass.render(this.renderer);

          this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
          this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
          this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
          this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
          this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

          const randomTime = Math.random() * 100000;
          this.finalPass.shader.uniforms.time.value = randomTime;
          this.rgbPass.shader.uniforms.time.value = randomTime;

          this.finalPass.render(this.renderer);
          this.rgbPass.render(this.renderer, true);
        }

        attachGUI(gui, title = "Post-Processing Suite") {
          const root = gui.addFolder(title);
          root.add(this.settings, "enabled").name("Enable Suite");

          const bloom = root.addFolder("Bloom");
          bloom.add(this.settings, "bloomEnabled").name("Enable Bloom").onChange(() => this.updateSettings());
          bloom.add(this.settings, "bloomStrength", 0, 3.0, 0.05).name("Strength").onChange(() => this.updateSettings());
          bloom.add(this.settings, "bloomRadius", 0, 2.0, 0.05).name("Radius").onChange(() => this.updateSettings());
          bloom.add(this.settings, "bloomThreshold", 0, 1.0, 0.01).name("Threshold").onChange(() => this.updateSettings());

          const lens = root.addFolder("Lens, Optics & Fisheye");
          lens.add(this.settings, "fisheyeStrength", -1.0, 1.5, 0.01).name("Fisheye Distortion").onChange(() => this.updateSettings());
          lens.add(this.settings, "fisheyeRadius", 0.2, 2.0, 0.05).name("Fisheye Radius").onChange(() => this.updateSettings());
          lens.add(this.settings, "chromaticAberration", 0, 0.2, 0.005).name("Chromatic Aberration").onChange(() => this.updateSettings());
          lens.add(this.settings, "vignetteBoost", 0, 2.0, 0.05).name("Vignette Boost").onChange(() => this.updateSettings());
          lens.add(this.settings, "vignetteReduction", 0, 2.0, 0.05).name("Vignette Falloff").onChange(() => this.updateSettings());
          lens.add(this.settings, "noiseIntensity", 0, 0.1, 0.005).name("Film Grain").onChange(() => this.updateSettings());
          lens.add(this.settings, "gamma", 0.2, 2.0, 0.05).name("Gamma").onChange(() => this.updateSettings());
          lens.add(this.settings, "minInputLevel", 0, 0.5, 0.01).name("Black Level").onChange(() => this.updateSettings());
          lens.add(this.settings, "maxInputLevel", 0.5, 1.0, 0.01).name("White Level").onChange(() => this.updateSettings());

          return root;
        }
      }

      // =========================================================================================
      // 5 CURATED PRESET COLOR SCHEMES
      // =========================================================================================
      const COLOR_PALETTES = {

        },

        'Emerald & Matrix': {
          colorBg: '#040d08',
          colorLine: '#133020',
          colorSignal1: '#10b981',
          useColor2: true,
          colorSignal2: '#06b6d4',
          useColor3: true,
          colorSignal3: '#84cc16',
          useColor4: true,
          colorSignal4: '#34d399',
          useColor5: true,
          colorSignal5: '#e0f2fe',
          blendingMode: 'Additive',
          lineOpacity: 0.52
        },
        'Deep Space Quantum': {
          colorBg: '#070719',
          colorLine: '#1a1f3c',
          colorSignal1: '#38bdf8',
          useColor2: true,
          colorSignal2: '#a855f7',
          useColor3: true,
          colorSignal3: '#ec4899',
          useColor4: true,
          colorSignal4: '#3b82f6',
          useColor5: true,
          colorSignal5: '#ffffff',
          blendingMode: 'Additive',
          lineOpacity: 0.58
        }
      };

      // =========================================================================================
      // SETTINGS & STATE
      // =========================================================================================
      const settings = {
        // Presets & Themes
        theme: 'Amber & Alabaster (Premium Light)',
        animationPreset: 'Static View',
        clickToRandomize: true,

        // Colors & Materials
        colorBg: COLOR_PALETTES['Amber & Alabaster (Premium Light)'].colorBg,
        greenScreen: false,
        colorLine: COLOR_PALETTES['Amber & Alabaster (Premium Light)'].colorLine,
        lineOpacity: COLOR_PALETTES['Amber & Alabaster (Premium Light)'].lineOpacity,
        blendingMode: COLOR_PALETTES['Amber & Alabaster (Premium Light)'].blendingMode,

        // Signals Colors
        colorSignal1: COLOR_PALETTES['Amber & Alabaster (Premium Light)'].colorSignal1,
        useColor2: COLOR_PALETTES['Amber & Alabaster (Premium Light)'].useColor2,
        colorSignal2: COLOR_PALETTES['Amber & Alabaster (Premium Light)'].colorSignal2,
        useColor3: COLOR_PALETTES['Amber & Alabaster (Premium Light)'].useColor3,
        colorSignal3: COLOR_PALETTES['Amber & Alabaster (Premium Light)'].colorSignal3,
        useColor4: COLOR_PALETTES['Amber & Alabaster (Premium Light)'].useColor4,
        colorSignal4: COLOR_PALETTES['Amber & Alabaster (Premium Light)'].colorSignal4,
        useColor5: COLOR_PALETTES['Amber & Alabaster (Premium Light)'].useColor5,
        colorSignal5: COLOR_PALETTES['Amber & Alabaster (Premium Light)'].colorSignal5,

        // System & Speeds
        dpr: Math.min(window.devicePixelRatio || 1, 2.0),
        timeScale: 1.0,
        speedGlobal: 0.35,

        // Geometry & Layout
        lineCount: 80,
        spreadHeight: 32.0,
        spreadDepth: 8.0,
        curveLength: 50.0,
        straightLength: 100.0,
        curvePower: 0.85,
        waveSpeed: 2.2,
        waveHeight: 0.16,
        waveFreq: 0.12,
        globalRotation: 0,
        positionX: 0,
        positionY: 0,
        positionZ: 0,

        // Signal Dynamics
        signalCount: 95,
        trailLength: 5,

        // Camera Placement & Lens Settings
        camPosX: 0.0,
        camPosY: 0.0,
        camPosZ: 90.0,
        targetX: 0.0,
        targetY: 0.0,
        targetZ: 0.0,
        fov: 45.0,
        polarAngle: 90.0,
        azimuthAngle: 0.0,
        camDistance: 90.0,

        // Mouse & View Controls
        rotateSpeed: 1.0,
        panSpeed: 1.0,
        zoomSpeed: 1.0,
        dampingFactor: 0.05,
        enableRotate: true,
        enablePan: true,
        enableZoom: true,
        autoRotate: false,
        autoRotateSpeed: 1.0,
      };

      settings.positionX = (settings.curveLength - settings.straightLength) / 2;

      const CONSTANTS = {
        segmentCount: 160
      };

      // =========================================================================================
      // THREE.JS SCENE SETUP
      // =========================================================================================
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(settings.colorBg);
      scene.fog = new THREE.FogExp2(settings.colorBg, 0.0015);

      const perspectiveCamera = new THREE.PerspectiveCamera(settings.fov, window.innerWidth / window.innerHeight, 1, 2000);
      perspectiveCamera.position.set(settings.camPosX, settings.camPosY, settings.camPosZ);

      const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(settings.dpr);
      renderer.setClearColor(settings.colorBg, 1);
      document.body.appendChild(renderer.domElement);

      const controls = new OrbitControls(perspectiveCamera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = settings.dampingFactor;
      controls.target.set(settings.targetX, settings.targetY, settings.targetZ);
      controls.rotateSpeed = settings.rotateSpeed;
      controls.panSpeed = settings.panSpeed;
      controls.zoomSpeed = settings.zoomSpeed;
      controls.enableRotate = settings.enableRotate;
      controls.enablePan = settings.enablePan;
      controls.enableZoom = settings.enableZoom;
      controls.autoRotate = settings.autoRotate;
      controls.autoRotateSpeed = settings.autoRotateSpeed;
      controls.update();
      perspectiveCamera.updateMatrixWorld(true);

      const postProcessor = new PostProcessor(renderer, {
        enabled: false,
        bloomEnabled: true,
        bloomStrength: 0.85,
        bloomRadius: 0.65,
        bloomThreshold: 0.15,
        fisheyeStrength: 0.0,
        fisheyeRadius: 1.0,
        chromaticAberration: 0.03,
        vignetteBoost: 1.05,
        vignetteReduction: 0.45,
        noiseIntensity: 0.015,
        gamma: 1.0,
      });

      const contentGroup = new THREE.Group();
      contentGroup.position.set(settings.positionX, settings.positionY, settings.positionZ);
      scene.add(contentGroup);

      // =========================================================================================
      // MATERIALS & SHADERS
      // =========================================================================================
      function getBlendingEnum(mode) {
        if (mode === 'Normal') return THREE.NormalBlending;
        if (mode === 'Subtractive') return THREE.SubtractiveBlending;
        return THREE.AdditiveBlending;
      }

      const bgMaterial = new THREE.LineBasicMaterial({
        color: settings.colorLine,
        transparent: true,
        opacity: settings.lineOpacity,
        depthWrite: false,
        blending: getBlendingEnum(settings.blendingMode)
      });

      const signalMaterial = new THREE.LineBasicMaterial({
        vertexColors: true,
        blending: getBlendingEnum(settings.blendingMode),
        depthWrite: false,
        depthTest: true,
        transparent: true
      });

      const signalColorObjs = [
        new THREE.Color(settings.colorSignal1),
        new THREE.Color(settings.colorSignal2),
        new THREE.Color(settings.colorSignal3),
        new THREE.Color(settings.colorSignal4),
        new THREE.Color(settings.colorSignal5)
      ];

      function updateColorObjects() {
        signalColorObjs[0].set(settings.colorSignal1);
        signalColorObjs[1].set(settings.colorSignal2);
        signalColorObjs[2].set(settings.colorSignal3);
        signalColorObjs[3].set(settings.colorSignal4);
        signalColorObjs[4].set(settings.colorSignal5);
      }

      function updateBlendingMode(mode) {
        const blendEnum = getBlendingEnum(mode);
        bgMaterial.blending = blendEnum;
        signalMaterial.blending = blendEnum;
        bgMaterial.needsUpdate = true;
        signalMaterial.needsUpdate = true;
      }

      function setBackgroundColor(value) {
        document.body.style.backgroundColor = value;
        scene.background.set(value);
        scene.fog.color.set(value);
        renderer.setClearColor(value, 1);
      }

      function setGreenScreen(enabled) {
        settings.greenScreen = enabled;
        const color = enabled ? '#00ff00' : settings.colorBg;
        setBackgroundColor(color);
      }

      function pickSignalColor() {
        const choices = [signalColorObjs[0]];
        if (settings.useColor2) choices.push(signalColorObjs[1]);
        if (settings.useColor3) choices.push(signalColorObjs[2]);
        if (settings.useColor4) choices.push(signalColorObjs[3]);
        if (settings.useColor5) choices.push(signalColorObjs[4]);
        return choices[Math.floor(Math.random() * choices.length)];
      }

      // =========================================================================================
      // GEOMETRY & PATH CALCULATION
      // =========================================================================================
      function getPathPoint(t, lineIndex, time) {
        const totalLen = settings.curveLength + settings.straightLength;
        const currentX = -settings.curveLength + t * totalLen;
        let y = 0;
        let z = 0;
        const spreadFactor = (lineIndex / settings.lineCount - 0.5) * 2;

        if (currentX < 0) {
          const ratio = (currentX + settings.curveLength) / Math.max(0.001, settings.curveLength);
          let shapeFactor = (Math.cos(ratio * Math.PI) + 1) / 2;
          shapeFactor = Math.pow(Math.max(0, shapeFactor), settings.curvePower);

          y = spreadFactor * settings.spreadHeight * shapeFactor;
          z = spreadFactor * settings.spreadDepth * shapeFactor;

          const wave = Math.sin(time * settings.waveSpeed + currentX * settings.waveFreq + lineIndex * 0.3) * settings.waveHeight * shapeFactor * 10.0;
          y += wave;
        } else {
          const wave = Math.sin(time * settings.waveSpeed * 0.6 + currentX * settings.waveFreq * 0.5 + lineIndex * 0.15) * (settings.waveHeight * 1.5);
          y += wave;
        }

        return new THREE.Vector3(currentX, y, z);
      }

      let backgroundLines = [];
      let signals = [];

      function rebuildLines() {
        backgroundLines.forEach((line) => {
          contentGroup.remove(line);
          line.geometry.dispose();
        });
        backgroundLines = [];

        for (let i = 0; i < settings.lineCount; i++) {
          const geometry = new THREE.BufferGeometry();
          const positions = new Float32Array(CONSTANTS.segmentCount * 3);
          geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

          const line = new THREE.Line(geometry, bgMaterial);
          line.userData = { id: i };
          line.renderOrder = 0;
          contentGroup.add(line);
          backgroundLines.push(line);
        }
        rebuildSignals();
      }

      function rebuildSignals() {
        signals.forEach((signal) => {
          contentGroup.remove(signal.mesh);
          signal.mesh.geometry.dispose();
        });
        signals = [];

        for (let i = 0; i < settings.signalCount; i++) {
          createSignal();
        }
      }

      function createSignal() {
        const maxTrail = 160;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(maxTrail * 3);
        const colors = new Float32Array(maxTrail * 3);

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const mesh = new THREE.Line(geometry, signalMaterial);
        mesh.frustumCulled = false;
        mesh.renderOrder = 1;
        contentGroup.add(mesh);

        signals.push({
          mesh,
          laneIndex: Math.floor(Math.random() * settings.lineCount),
          speed: 0.25 + Math.random() * 0.65,
          progress: Math.random(),
          history: [],
          assignedColor: pickSignalColor()
        });
      }

      rebuildLines();

      // =========================================================================================
      // PALETTE & PRESET APPLICATION
      // =========================================================================================
      function applyPalette(paletteName) {
        if (!COLOR_PALETTES[paletteName]) return;
        const pal = COLOR_PALETTES[paletteName];
        settings.theme = paletteName;
        settings.colorBg = pal.colorBg;
        settings.colorLine = pal.colorLine;
        settings.colorSignal1 = pal.colorSignal1;
        settings.useColor2 = pal.useColor2;
        settings.colorSignal2 = pal.colorSignal2;
        settings.useColor3 = pal.useColor3;
        settings.colorSignal3 = pal.colorSignal3;
        settings.useColor4 = pal.useColor4;
        settings.colorSignal4 = pal.colorSignal4;
        settings.useColor5 = pal.useColor5;
        settings.colorSignal5 = pal.colorSignal5;
        settings.blendingMode = pal.blendingMode;
        settings.lineOpacity = pal.lineOpacity;

        if (!settings.greenScreen) {
          setBackgroundColor(settings.colorBg);
        }
        bgMaterial.color.set(settings.colorLine);
        bgMaterial.opacity = settings.lineOpacity;
        updateBlendingMode(settings.blendingMode);
        updateColorObjects();

        signals.forEach(s => {
          s.assignedColor = pickSignalColor();
        });

        if (gui) {
          gui.controllersRecursive().forEach(c => c.updateDisplay());
        }
      }

      // =========================================================================================
      // PROCEDURAL RANDOMIZER (Click on Scene)
      // =========================================================================================
      function randomRange(min, max) {
        return min + Math.random() * (max - min);
      }

      function randomChoice(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
      }

      function hslToHex(h, s, l) {
        const c = new THREE.Color();
        c.setHSL(h, s, l);
        return '#' + c.getHexString();
      }

      function randomizeScene() {
        const themes = Object.keys(COLOR_PALETTES);
        const usePresetTheme = Math.random() > 0.4;

        if (usePresetTheme) {
          applyPalette(randomChoice(themes));
        } else {
          // Generate procedural harmonic palette
          const isLight = Math.random() > 0.5;
          const baseHue = Math.random();
          const compHue = (baseHue + 0.5) % 1.0;
          const triHue1 = (baseHue + 0.33) % 1.0;
          const triHue2 = (baseHue + 0.66) % 1.0;

          if (isLight) {
            settings.colorBg = hslToHex(baseHue, 0.15, 0.94);
            settings.colorLine = hslToHex(baseHue, 0.15, 0.75);
            settings.blendingMode = 'Normal';
            settings.lineOpacity = parseFloat(randomRange(0.6, 0.85).toFixed(2));
          } else {
            settings.colorBg = hslToHex(baseHue, 0.35, 0.05);
            settings.colorLine = hslToHex(baseHue, 0.3, 0.18);
            settings.blendingMode = 'Additive';
            settings.lineOpacity = parseFloat(randomRange(0.4, 0.7).toFixed(2));
          }

          settings.colorSignal1 = hslToHex(baseHue, 0.95, 0.55);
          settings.colorSignal2 = hslToHex(compHue, 0.95, 0.6);
          settings.colorSignal3 = hslToHex(triHue1, 0.9, 0.65);
          settings.colorSignal4 = hslToHex(triHue2, 0.95, 0.58);
          settings.colorSignal5 = hslToHex((baseHue + 0.15) % 1.0, 0.8, 0.85);

          if (!settings.greenScreen) {
            setBackgroundColor(settings.colorBg);
          }
          bgMaterial.color.set(settings.colorLine);
          bgMaterial.opacity = settings.lineOpacity;
          updateBlendingMode(settings.blendingMode);
          updateColorObjects();
        }

        // Geometric & Motion Variation
        settings.lineCount = Math.floor(randomRange(40, 130));
        settings.spreadHeight = parseFloat(randomRange(18.0, 55.0).toFixed(1));
        settings.spreadDepth = parseFloat(randomRange(0.0, 30.0).toFixed(1));
        settings.curveLength = parseFloat(randomRange(30.0, 90.0).toFixed(1));
        settings.straightLength = parseFloat(randomRange(50.0, 150.0).toFixed(1));
        settings.curvePower = parseFloat(randomRange(0.4, 1.8).toFixed(2));
        settings.waveSpeed = parseFloat(randomRange(0.8, 4.0).toFixed(2));
        settings.waveHeight = parseFloat(randomRange(0.06, 0.35).toFixed(3));
        settings.waveFreq = parseFloat(randomRange(0.05, 0.25).toFixed(3));

        settings.signalCount = Math.floor(randomRange(50, 140));
        settings.speedGlobal = parseFloat(randomRange(0.2, 0.8).toFixed(2));
        settings.trailLength = Math.floor(randomRange(3, 14));

        settings.positionX = (settings.curveLength - settings.straightLength) / 2;
        contentGroup.position.x = settings.positionX;

        rebuildLines();

        if (gui) {
          gui.controllersRecursive().forEach(c => c.updateDisplay());
        }
      }

      // Pointer Tracking for Click vs Drag Detection
      let pointerDownPos = { x: 0, y: 0 };
      let pointerDownTime = 0;

      window.addEventListener('pointerdown', (e) => {
        if (e.target.closest('.lil-gui')) return;
        pointerDownPos.x = e.clientX;
        pointerDownPos.y = e.clientY;
        pointerDownTime = Date.now();
      });

      window.addEventListener('pointerup', (e) => {
        if (e.target.closest('.lil-gui')) return;
        const dx = e.clientX - pointerDownPos.x;
        const dy = e.clientY - pointerDownPos.y;
        const dist = Math.hypot(dx, dy);
        const dt = Date.now() - pointerDownTime;

        if (dist < 6 && dt < 300 && settings.clickToRandomize) {
          randomizeScene();
        }
      });

      // =========================================================================================
      // CAMERA SYNCHRONIZATION HELPERS
      // =========================================================================================
      function updateCameraFromAngles() {
        const r = settings.camDistance;
        const phi = THREE.MathUtils.degToRad(settings.polarAngle);
        const theta = THREE.MathUtils.degToRad(settings.azimuthAngle);

        perspectiveCamera.position.x = settings.targetX + r * Math.sin(phi) * Math.sin(theta);
        perspectiveCamera.position.y = settings.targetY + r * Math.cos(phi);
        perspectiveCamera.position.z = settings.targetZ + r * Math.sin(phi) * Math.cos(theta);

        controls.target.set(settings.targetX, settings.targetY, settings.targetZ);
        perspectiveCamera.lookAt(controls.target);
        controls.update();
        perspectiveCamera.updateMatrixWorld(true);

        settings.camPosX = perspectiveCamera.position.x;
        settings.camPosY = perspectiveCamera.position.y;
        settings.camPosZ = perspectiveCamera.position.z;
      }

      function updateCameraFromPosition() {
        perspectiveCamera.position.set(settings.camPosX, settings.camPosY, settings.camPosZ);
        controls.target.set(settings.targetX, settings.targetY, settings.targetZ);
        perspectiveCamera.lookAt(controls.target);
        controls.update();
        perspectiveCamera.updateMatrixWorld(true);

        const offset = new THREE.Vector3().subVectors(perspectiveCamera.position, controls.target);
        settings.camDistance = parseFloat(offset.length().toFixed(2));
        settings.polarAngle = parseFloat(THREE.MathUtils.radToDeg(controls.getPolarAngle()).toFixed(2));
        settings.azimuthAngle = parseFloat(THREE.MathUtils.radToDeg(controls.getAzimuthalAngle()).toFixed(2));
      }

      function resetCameraView() {
        settings.camPosX = 0.0;
        settings.camPosY = 0.0;
        settings.camPosZ = 90.0;
        settings.targetX = 0.0;
        settings.targetY = 0.0;
        settings.targetZ = 0.0;
        settings.fov = 45.0;
        perspectiveCamera.fov = 45.0;
        perspectiveCamera.updateProjectionMatrix();
        updateCameraFromPosition();
      }

      // =========================================================================================
      // GUI SETUP (LIL-GUI)
      // =========================================================================================
      const gui = new GUI({ title: 'Data Lines Controls' });

      // Folder 1: Presets & Themes
      const fPresets = gui.addFolder('Presets & Themes');
      fPresets.add(settings, 'theme', Object.keys(COLOR_PALETTES)).name('Color Scheme').onChange(applyPalette);
      fPresets.add(settings, 'animationPreset', [
        'Static View',
        'Smooth Orbit',
        'Stream Flyover',
        'Data Horizon',
        'Pulse Inspection'
      ]).name('Animation Preset');
      fPresets.add(settings, 'clickToRandomize').name('Click To Randomize');

      // Folder 2: Colors & Materials
      const fColors = gui.addFolder('Colors & Materials');
      fColors.addColor(settings, 'colorBg').name('Background').onChange((value) => {
        if (!settings.greenScreen) setBackgroundColor(value);
      });
      fColors.add(settings, 'greenScreen').name('Green Screen (#00ff00)').onChange(setGreenScreen);
      fColors.addColor(settings, 'colorLine').name('Line Color').onChange((value) => {
        bgMaterial.color.set(value);
      });
      fColors.add(settings, 'lineOpacity', 0.0, 1.0, 0.01).name('Line Opacity').onChange((value) => {
        bgMaterial.opacity = value;
      });
      fColors.add(settings, 'blendingMode', ['Normal', 'Additive', 'Subtractive']).name('Blending Mode').onChange(updateBlendingMode);

      // Folder 3: Signal Colors
      const fSignalColors = gui.addFolder('Signal Colors');
      fSignalColors.addColor(settings, 'colorSignal1').name('Main Signal Color').onChange(updateColorObjects);
      fSignalColors.add(settings, 'useColor2').name('Enable Color 2');
      fSignalColors.addColor(settings, 'colorSignal2').name('Signal Color 2').onChange(updateColorObjects);
      fSignalColors.add(settings, 'useColor3').name('Enable Color 3');
      fSignalColors.addColor(settings, 'colorSignal3').name('Signal Color 3').onChange(updateColorObjects);
      fSignalColors.add(settings, 'useColor4').name('Enable Color 4');
      fSignalColors.addColor(settings, 'colorSignal4').name('Signal Color 4').onChange(updateColorObjects);
      fSignalColors.add(settings, 'useColor5').name('Enable Color 5');
      fSignalColors.addColor(settings, 'colorSignal5').name('Signal Color 5').onChange(updateColorObjects);

      // Folder 4: System & Display
      const fSystem = gui.addFolder('System & Display');
      fSystem.add(settings, 'dpr', 0.5, 3.0, 0.1).name('Device Pixel Ratio').onChange((val) => {
        renderer.setPixelRatio(val);
        updateResolution();
      });
      fSystem.add(settings, 'timeScale', 0.0, 4.0, 0.05).name('Global Speed');
      fSystem.add(settings, 'speedGlobal', 0.0, 3.0, 0.05).name('Signal Speed');

      // Folder 5: Geometry & Flow
      const fGeo = gui.addFolder('Geometry & Flow');
      fGeo.add(settings, 'lineCount', 10, 300, 1).name('Line Count').onFinishChange(rebuildLines);
      fGeo.add(settings, 'spreadHeight', 5, 120, 0.5).name('Spread Height');
      fGeo.add(settings, 'spreadDepth', 0, 80, 0.5).name('Spread Depth');
      fGeo.add(settings, 'curveLength', 10, 200, 1).name('Curve Length').onChange(() => {
        settings.positionX = (settings.curveLength - settings.straightLength) / 2;
        contentGroup.position.x = settings.positionX;
      });
      fGeo.add(settings, 'straightLength', 10, 300, 1).name('Straight Length').onChange(() => {
        settings.positionX = (settings.curveLength - settings.straightLength) / 2;
        contentGroup.position.x = settings.positionX;
      });
      fGeo.add(settings, 'curvePower', 0.1, 3.5, 0.05).name('Curve Power');
      fGeo.add(settings, 'waveSpeed', 0.0, 8.0, 0.1).name('Wave Speed');
      fGeo.add(settings, 'waveHeight', 0.0, 2.0, 0.01).name('Wave Height');
      fGeo.add(settings, 'waveFreq', 0.01, 0.5, 0.01).name('Wave Frequency');
      fGeo.add(settings, 'globalRotation', -180, 180, 1).name('Rotation (Deg)').onChange((v) => {
        contentGroup.rotation.z = THREE.MathUtils.degToRad(v);
      });
      fGeo.add(settings, 'positionX', -200, 200, 1).name('Position X').onChange((v) => (contentGroup.position.x = v));
      fGeo.add(settings, 'positionY', -100, 100, 1).name('Position Y').onChange((v) => (contentGroup.position.y = v));
      fGeo.add(settings, 'positionZ', -100, 100, 1).name('Position Z').onChange((v) => (contentGroup.position.z = v));

      // Folder 6: Signals & Pulses
      const fSignals = gui.addFolder('Signals & Pulses');
      fSignals.add(settings, 'signalCount', 0, 300, 1).name('Signal Count').onFinishChange(rebuildSignals);
      fSignals.add(settings, 'trailLength', 0, 50, 1).name('Trail Length');

      // Folder 7: Camera Placement and Lens Settings
      const fCam = gui.addFolder('Camera Placement and Lens Settings');
      fCam.add(settings, 'camPosX', -400.0, 400.0, 0.5).name('Camera Pos X').listen().onChange(updateCameraFromPosition);
      fCam.add(settings, 'camPosY', -300.0, 300.0, 0.5).name('Camera Pos Y').listen().onChange(updateCameraFromPosition);
      fCam.add(settings, 'camPosZ', -400.0, 400.0, 0.5).name('Camera Pos Z').listen().onChange(updateCameraFromPosition);
      fCam.add(settings, 'polarAngle', 1.0, 179.0, 0.5).name('Polar Angle (Pitch °)').listen().onChange(updateCameraFromAngles);
      fCam.add(settings, 'azimuthAngle', -180.0, 180.0, 0.5).name('Azimuth Angle (Yaw °)').listen().onChange(updateCameraFromAngles);
      fCam.add(settings, 'camDistance', 5.0, 500.0, 1.0).name('Camera Distance').listen().onChange(updateCameraFromAngles);
      fCam.add(settings, 'targetX', -200.0, 200.0, 0.5).name('Target X (LookAt)').listen().onChange(updateCameraFromPosition);
      fCam.add(settings, 'targetY', -100.0, 100.0, 0.5).name('Target Y (LookAt)').listen().onChange(updateCameraFromPosition);
      fCam.add(settings, 'targetZ', -200.0, 200.0, 0.5).name('Target Z (LookAt)').listen().onChange(updateCameraFromPosition);
      fCam.add(settings, 'fov', 15.0, 120.0, 1.0).name('Camera FOV').listen().onChange((v) => {
        perspectiveCamera.fov = v;
        perspectiveCamera.updateProjectionMatrix();
      });

      // Mouse & Drag View Interaction Settings
      const fMouse = fCam.addFolder('Mouse & Drag View Controls');
      fMouse.add(settings, 'rotateSpeed', 0.1, 3.0, 0.1).name('Rotate / Drag Speed').onChange((v) => (controls.rotateSpeed = v));
      fMouse.add(settings, 'panSpeed', 0.1, 3.0, 0.1).name('Pan Speed').onChange((v) => (controls.panSpeed = v));
      fMouse.add(settings, 'zoomSpeed', 0.1, 3.0, 0.1).name('Zoom Speed').onChange((v) => (controls.zoomSpeed = v));
      fMouse.add(settings, 'dampingFactor', 0.01, 0.2, 0.01).name('Damping (Inertia)').onChange((v) => (controls.dampingFactor = v));
      fMouse.add(settings, 'enableRotate').name('Enable Mouse Orbit').onChange((v) => (controls.enableRotate = v));
      fMouse.add(settings, 'enablePan').name('Enable Mouse Pan').onChange((v) => (controls.enablePan = v));
      fMouse.add(settings, 'enableZoom').name('Enable Wheel Zoom').onChange((v) => (controls.enableZoom = v));
      fMouse.add(settings, 'autoRotate').name('Auto-Rotate View').onChange((v) => (controls.autoRotate = v));
      fMouse.add(settings, 'autoRotateSpeed', -10.0, 10.0, 0.5).name('Auto-Rotate Speed').onChange((v) => (controls.autoRotateSpeed = v));
      fMouse.add({ reset: resetCameraView }, 'reset').name('Reset Camera View');

      // Folder 8: Post-Processing & Fisheye
      postProcessor.attachGUI(gui, 'Post-Processing & Fisheye');

      // GUI closed by default
      gui.close();

      // Keyboard Toggle for GUI with 'H' key
      window.addEventListener('keydown', (e) => {
        if (e.key === 'h' || e.key === 'H') {
          if (gui._hidden) {
            gui.show();
          } else {
            gui.hide();
          }
        }
      });

      // =========================================================================================
      // RESIZE HANDLER
      // =========================================================================================
      function updateResolution() {
        const width = window.innerWidth;
        const height = window.innerHeight;
        perspectiveCamera.aspect = width / height;
        perspectiveCamera.updateProjectionMatrix();
        renderer.setSize(width, height);
        postProcessor.setSize(width, height, renderer.getPixelRatio());
      }

      window.addEventListener('resize', updateResolution);
      updateResolution();

      // =========================================================================================
      // MAIN ANIMATION LOOP
      // =========================================================================================
      const clock = new THREE.Clock();
      let animAngle = 0;

      function animate() {
        requestAnimationFrame(animate);

        const delta = clock.getDelta();
        const elapsedTime = clock.getElapsedTime() * settings.timeScale;

        // Handle Presetupped Camera Animations
        if (settings.animationPreset !== 'Static View') {
          animAngle += delta * settings.timeScale * 0.4;

          if (settings.animationPreset === 'Smooth Orbit') {
            const radius = 95.0;
            perspectiveCamera.position.x = controls.target.x + Math.sin(animAngle * 0.5) * radius;
            perspectiveCamera.position.z = controls.target.z + Math.cos(animAngle * 0.5) * radius;
            perspectiveCamera.position.y = controls.target.y + 22.0 + Math.sin(animAngle * 0.3) * 12.0;
          } else if (settings.animationPreset === 'Stream Flyover') {
            const tGlide = (Math.sin(animAngle * 0.35) + 1.0) * 0.5;
            const flyX = THREE.MathUtils.lerp(-settings.curveLength * 0.8, settings.straightLength * 0.7, tGlide);
            perspectiveCamera.position.set(
              flyX - 30.0,
              18.0 + Math.sin(animAngle * 0.6) * 8.0,
              45.0 + Math.cos(animAngle * 0.4) * 15.0
            );
            controls.target.set(flyX + 25.0, 0, 0);
          } else if (settings.animationPreset === 'Data Horizon') {
            perspectiveCamera.position.set(
              -settings.curveLength * 0.2 + Math.sin(animAngle * 0.3) * 25.0,
              8.0 + Math.sin(animAngle * 0.5) * 4.0,
              65.0 + Math.cos(animAngle * 0.35) * 20.0
            );
            controls.target.set(15.0, 2.0, 0.0);
          } else if (settings.animationPreset === 'Pulse Inspection') {
            perspectiveCamera.position.set(
              Math.sin(animAngle * 0.35) * 35.0,
              28.0 + Math.cos(animAngle * 0.4) * 14.0,
              75.0 + Math.sin(animAngle * 0.25) * 18.0
            );
            controls.target.set(Math.sin(animAngle * 0.35) * 15.0, Math.sin(animAngle * 0.5) * 6.0, 0.0);
          }
        }

        controls.update();
        perspectiveCamera.updateMatrixWorld(true);

        // Synchronize GUI parameters with OrbitControls state in real time
        const offset = new THREE.Vector3().subVectors(perspectiveCamera.position, controls.target);
        settings.camDistance = parseFloat(offset.length().toFixed(2));
        settings.polarAngle = parseFloat(THREE.MathUtils.radToDeg(controls.getPolarAngle()).toFixed(2));
        settings.azimuthAngle = parseFloat(THREE.MathUtils.radToDeg(controls.getAzimuthalAngle()).toFixed(2));

        settings.camPosX = parseFloat(perspectiveCamera.position.x.toFixed(2));
        settings.camPosY = parseFloat(perspectiveCamera.position.y.toFixed(2));
        settings.camPosZ = parseFloat(perspectiveCamera.position.z.toFixed(2));
        settings.targetX = parseFloat(controls.target.x.toFixed(2));
        settings.targetY = parseFloat(controls.target.y.toFixed(2));
        settings.targetZ = parseFloat(controls.target.z.toFixed(2));
        settings.fov = perspectiveCamera.fov;

        // Update Background Lines Geometry
        backgroundLines.forEach((line) => {
          const positions = line.geometry.attributes.position.array;
          const lineId = line.userData.id;
          for (let j = 0; j < CONSTANTS.segmentCount; j++) {
            const t = j / (CONSTANTS.segmentCount - 1);
            const vec = getPathPoint(t, lineId, elapsedTime);
            positions[j * 3] = vec.x;
            positions[j * 3 + 1] = vec.y;
            positions[j * 3 + 2] = vec.z;
          }
          line.geometry.attributes.position.needsUpdate = true;
        });

        // Update Moving Signals and Dynamic Trails
        signals.forEach((signal) => {
          signal.progress += signal.speed * 0.005 * settings.speedGlobal * settings.timeScale;

          if (signal.progress > 1.0) {
            signal.progress = 0;
            signal.laneIndex = Math.floor(Math.random() * settings.lineCount);
            signal.history = [];
            signal.assignedColor = pickSignalColor();
          }

          const pos = getPathPoint(signal.progress, signal.laneIndex, elapsedTime);
          signal.history.push(pos);

          if (signal.history.length > settings.trailLength + 1) {
            signal.history.shift();
          }

          const positions = signal.mesh.geometry.attributes.position.array;
          const colors = signal.mesh.geometry.attributes.color.array;
          const drawCount = Math.max(1, settings.trailLength);
          const currentLen = signal.history.length;

          for (let i = 0; i < drawCount; i++) {
            let index = currentLen - 1 - i;
            if (index < 0) index = 0;

            const point = signal.history[index] || new THREE.Vector3();

            positions[i * 3] = point.x;
            positions[i * 3 + 1] = point.y;
            positions[i * 3 + 2] = point.z;

            let alpha = 1.0;
            if (settings.trailLength > 0) {
              alpha = Math.max(0.0, 1.0 - i / settings.trailLength);
              alpha = Math.pow(alpha, 1.4);
            }

            colors[i * 3] = signal.assignedColor.r * alpha;
            colors[i * 3 + 1] = signal.assignedColor.g * alpha;
            colors[i * 3 + 2] = signal.assignedColor.b * alpha;
          }

          signal.mesh.geometry.setDrawRange(0, drawCount);
          signal.mesh.geometry.attributes.position.needsUpdate = true;
          signal.mesh.geometry.attributes.color.needsUpdate = true;
        });

        // Render Scene through PostProcessor or Direct WebGLRenderer
        if (postProcessor.settings.enabled) {
          postProcessor.renderScene(scene, perspectiveCamera);
        } else {
          renderer.render(scene, perspectiveCamera);
        }
      }

      animate();
    </script>
  </body>
</html>
