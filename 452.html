<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Monjori Visualizer - 452</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
    }
    #container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      cursor: grab;
    }
    #container:active {
      cursor: grabbing;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
    }
  }
  </script>
</head>
<body>
  <div id="container"></div>

  <script id="vertexShader" type="x-shader/x-vertex">
    varying vec2 vUv;
    varying vec3 vNormal;
    varying vec3 vWorldPos;

    void main() {
      vUv = uv;
      vNormal = normalize(normalMatrix * normal);
      vec4 worldPos = modelMatrix * vec4(position, 1.0);
      vWorldPos = worldPos.xyz;
      gl_Position = projectionMatrix * viewMatrix * worldPos;
    }
  </script>

  <script id="fragmentShader" type="x-shader/x-fragment">
    uniform vec2 resolution;
    uniform float time;
    uniform int isOriginal;
    uniform vec3 uColor1;
    uniform vec3 uColor2;
    uniform vec3 uColor3;
    uniform vec3 uColor4;
    uniform vec3 uColor5;

    uniform float exposure;
    uniform float masterLightIntensity;

    uniform vec3 ambientColor;
    uniform float ambientIntensity;

    uniform vec3 dir1Color;
    uniform float dir1Intensity;
    uniform vec3 dir1Dir;

    uniform vec3 dir2Color;
    uniform float dir2Intensity;
    uniform vec3 dir2Dir;

    uniform vec3 pointColor;
    uniform float pointIntensity;
    uniform vec3 pointPos;

    varying vec2 vUv;
    varying vec3 vNormal;
    varying vec3 vWorldPos;

    vec3 samplePalette(float t) {
      float val = clamp(t, 0.0, 1.0);
      if (val < 0.25) {
        return mix(uColor1, uColor2, val / 0.25);
      } else if (val < 0.5) {
        return mix(uColor2, uColor3, (val - 0.25) / 0.25);
      } else if (val < 0.75) {
        return mix(uColor3, uColor4, (val - 0.5) / 0.25);
      } else {
        return mix(uColor4, uColor5, (val - 0.75) / 0.25);
      }
    }

    void main() {
      vec2 p = -1.0 + 2.0 * vUv;
      float a = time * 40.0;
      float d, e, f, g = 1.0 / 40.0, h, i, r, q;
      e = 400.0 * (p.x * 0.5 + 0.5);
      f = 400.0 * (p.y * 0.5 + 0.5);
      i = 200.0 + sin(e * g + a / 150.0) * 20.0;
      d = 200.0 + cos(f * g / 2.0) * 18.0 + cos(e * g) * 7.0;
      r = sqrt(pow(abs(i - e), 2.0) + pow(abs(d - f), 2.0));
      q = f / (r + 0.0001);
      e = (r * cos(q)) - a / 2.0;
      f = (r * sin(q)) - a / 2.0;
      d = sin(e * g) * 176.0 + sin(e * g) * 164.0 + r;
      h = ((f + d) + a / 2.0) * g;
      i = cos(h + r * p.x / 1.3) * (e + e + a) + cos(q * g * 6.0) * (r + h / 3.0);
      h = sin(f * g) * 144.0 - sin(e * g) * 212.0 * p.x;
      h = (h + (f - e) * q + sin(r - (a + h) / 7.0) * 10.0 + i / 4.0) * g;
      
      float tanTerm = clamp(tan(r * g + h), -50.0, 50.0) * 184.0 * cos(r * g + h);
      i += cos(h * 2.3 * sin(a / 350.0 - q)) * 184.0 * sin(q - (r * 4.3 + a / 12.0) * g) + tanTerm;
      i = mod(i / 5.6, 256.0) / 64.0;
      if (i < 0.0) i += 4.0;
      if (i >= 2.0) i = 4.0 - i;
      d = r / 350.0;
      d += sin(d * d * 8.0) * 0.52;
      f = (sin(a * g) + 1.0) / 2.0;

      vec3 baseCol;
      if (isOriginal == 1) {
        baseCol = vec3(f * i / 1.6, i / 2.0 + d / 13.0, i) * d * p.x + vec3(i / 1.3 + d / 8.0, i / 2.0 + d / 18.0, i) * d * (1.0 - p.x);
        baseCol = max(baseCol, vec3(0.0));
      } else {
        float normVal1 = clamp((i / 2.0) * 0.65 + clamp(d, 0.0, 1.5) * 0.35, 0.0, 1.0);
        float normVal2 = clamp((i / 1.6) * 0.4 + f * 0.3 + abs(sin(d * 3.5)) * 0.3, 0.0, 1.0);
        vec3 cA = samplePalette(normVal1);
        vec3 cB = samplePalette(normVal2);
        float mixWeight = clamp(p.x * 0.5 + 0.5, 0.0, 1.0);
        baseCol = mix(cB, cA, mixWeight) * (0.45 + 1.2 * clamp(d, 0.0, 2.0));
      }

      // Normal setup (double-sided handling)
      vec3 norm = normalize(vNormal);
      if (!gl_FrontFacing) {
        norm = -norm;
      }

      // Lighting contributions
      vec3 lightTotal = ambientColor * ambientIntensity;

      // Key light
      vec3 l1Dir = normalize(dir1Dir);
      float diff1 = max(dot(norm, l1Dir), 0.0);
      lightTotal += dir1Color * (dir1Intensity * diff1);

      // Fill light
      vec3 l2Dir = normalize(dir2Dir);
      float diff2 = max(dot(norm, l2Dir), 0.0);
      lightTotal += dir2Color * (dir2Intensity * diff2);

      // Point light
      vec3 pVec = pointPos - vWorldPos;
      float pDist = length(pVec);
      vec3 pDir = normalize(pVec);
      float pAtten = 1.0 / (1.0 + 0.00008 * pDist * pDist);
      float diffP = max(dot(norm, pDir), 0.0);
      lightTotal += pointColor * (pointIntensity * diffP * pAtten);

      // Specular highlight
      vec3 viewDir = normalize(cameraPosition - vWorldPos);
      vec3 halfVec = normalize(l1Dir + viewDir);
      float spec = pow(max(dot(norm, halfVec), 0.0), 32.0) * 0.3 * dir1Intensity;

      vec3 finalColor = (baseCol * lightTotal + dir1Color * spec) * masterLightIntensity * exposure;
      gl_FragColor = vec4(finalColor, 1.0);
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import GUI from 'lil-gui';

    // --- 19 Preconfigured Color Schemes ---
    const COLOR_SCHEMES = [
      {
        name: "Original",
        c1: "#ff3366", c2: "#33ccff", c3: "#ffff33", c4: "#9933ff", c5: "#00ff99",
        bg: "#000000",
        isOriginal: true
      },
      {

        bg: "#040b17",
        isOriginal: false
      },
      {
        name: "Analogous",
        c1: "#e53e3e", c2: "#dd6b20", c3: "#d69e2e", c4: "#ed8936", c5: "#f6ad55",

        isOriginal: false
      },
      {

        c1: "#00b4d8", c2: "#0077b6", c3: "#ff7b00", c4: "#ff9e00", c5: "#ffb703",

        isOriginal: false
      },
      {
        name: "Split-complementary",
        c1: "#7209b7", c2: "#3a0ca3", c3: "#4cc9f0", c4: "#f72585", c5: "#ffb703",
        bg: "#0d041a",
        isOriginal: false
      },
      {
        name: "Triadic",
        c1: "#e63946", c2: "#f1faee", c3: "#a8dadc", c4: "#457b9d", c5: "#1d3557",
        bg: "#0b131e",
        isOriginal: false
      },
      {
        name: "Tetradic",
        c1: "#f72585", c2: "#7209b7", c3: "#4cc9f0", c4: "#06d6a0", c5: "#ffd166",
        bg: "#0c0517",
        isOriginal: false
      },
      {
        name: "Double split-complementary",
        c1: "#d90429", c2: "#ef233c", c3: "#2b2d42", c4: "#00b4d8", c5: "#80ed99",
        bg: "#0a0c14",
        isOriginal: false
      },
      {
        name: "Achromatic (black and white version, white and black)",
        c1: "#000000", c2: "#333333", c3: "#777777", c4: "#cccccc", c5: "#ffffff",
        bg: "#000000",
        isOriginal: false
      },
      {
        name: "Achromatic + Accent (black and white + red, white and black + red)",
        c1: "#000000", c2: "#444444", c3: "#ffffff", c4: "#ff0033", c5: "#990011",
        bg: "#080808",
        isOriginal: false
      },
      {
        name: "Neutral + accent",
        c1: "#1c1917", c2: "#44403c", c3: "#78716c", c4: "#d6d3d1", c5: "#10b981",
        bg: "#141210",
        isOriginal: false
      },
      {
        name: "Palette 1: (F6AA1C, BC3908, 941B0C, F6AA1C, 220901)",
        c1: "#F6AA1C", c2: "#BC3908", c3: "#941B0C", c4: "#F6AA1C", c5: "#220901",
        bg: "#150401",
        isOriginal: false
      },
      {
        name: "Palette 2: (63D1CF, 5BC0BE, 4BAD9E, 4BAD9E, 0B132B, 000000)",
        c1: "#63D1CF", c2: "#5BC0BE", c3: "#4BAD9E", c4: "#4BAD9E", c5: "#0B132B",
        bg: "#000000",
        isOriginal: false
      },
      {
        name: "Palette 3: (AA60C8, D69ADE, C9A3C6, CFB5C2, 0D001D, 120A12)",
        c1: "#AA60C8", c2: "#D69ADE", c3: "#C9A3C6", c4: "#CFB5C2", c5: "#0D001D",
        bg: "#120A12",
        isOriginal: false
      },
      {
        name: "Palette 4: (FEF1BE, FFBA00, 008189, 00474D, 061210)",
        c1: "#FEF1BE", c2: "#FFBA00", c3: "#008189", c4: "#00474D", c5: "#061210",
        bg: "#061210",
        isOriginal: false
      },
      {
        name: "Palette 5: (D4FFB0, 7FFF00, 00B894, 0A3322, 05140A)",
        c1: "#D4FFB0", c2: "#7FFF00", c3: "#00B894", c4: "#0A3322", c5: "#05140A",
        bg: "#05140A",
        isOriginal: false
      },
      {
        name: "Palette 6: (FFE8CC, FF8C00, C7501A, 3D1050, 0E0618)",
        c1: "#FFE8CC", c2: "#FF8C00", c3: "#C7501A", c4: "#3D1050", c5: "#0E0618",
        bg: "#0E0618",
        isOriginal: false
      },
      {
        name: "Palette 7: (E8E0FF, B38FFF, 6A3DE8, 1A1250, 090612)",
        c1: "#E8E0FF", c2: "#B38FFF", c3: "#6A3DE8", c4: "#1A1250", c5: "#090612",
        bg: "#090612",
        isOriginal: false
      },
      {
        name: "Palette 8: (E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)",
        c1: "#E0FBFF", c2: "#00F0FF", c3: "#D40078", c4: "#1E0A3D", c5: "#05020F",
        bg: "#05020F",
        isOriginal: false
      }
    ];

    // --- 8 Preconfigured Animations ---
    const ANIMATION_NAMES = [
      "Static (No Movement)",
      "Gentle Orbit",
      "Infinity Figure-8",
      "Breathing Dolly",
      "Pendulum Sway",
      "Spiral Drift",
      "Horizon Arc",
      "Zenith Float"
    ];

    // --- Available Geometries ---
    const GEOMETRY_NAMES = [
      "Plane",
      "Torus",
      "Sphere",
      "Torus Knot",
      "Cylinder",
      "Box",
      "Icosahedron",
      "Disc"
    ];

    // --- Parameters Configuration ---
    const params = {
      // Display & Canvas
      greenScreen: false,
      bgColor: "#000000",
      dpr: Math.min(window.devicePixelRatio || 1, 2.0),
      antialias: true,

      // Procedural Random on Click
      randomOnClick: true,

      // Color Theme
      colorScheme: COLOR_SCHEMES[0].name,
      isOriginal: true,
      color1: COLOR_SCHEMES[0].c1,
      color2: COLOR_SCHEMES[0].c2,
      color3: COLOR_SCHEMES[0].c3,
      color4: COLOR_SCHEMES[0].c4,
      color5: COLOR_SCHEMES[0].c5,

      // Camera & Animations
      cameraAnimation: ANIMATION_NAMES[1], // Gentle Orbit default
      animationSpeed: 1.0,
      waveSpeed: 1.0,
      zoom: 1.0,
      cameraPitch: 0.0,
      cameraYaw: 0.0,

      // Object Geometry & Drag Position
      geometryType: "Plane",
      geomScale: 1.0,
      autoRotateMesh: false,
      meshRotSpeedX: 0.2,
      meshRotSpeedY: 0.3,
      meshRotSpeedZ: 0.1,
      objectPosX: 0.0,
      objectPosY: 0.0,
      objectPosZ: 0.0,

      // Lighting & Exposure
      exposure: 1.0,
      masterLightIntensity: 1.0,

      ambientColor: "#ffffff",
      ambientIntensity: 0.85,

      dir1Color: "#ffffff",
      dir1Intensity: 0.8,
      dir1X: 30,
      dir1Y: 50,
      dir1Z: 40,

      dir2Color: "#55aaff",
      dir2Intensity: 0.4,
      dir2X: -40,
      dir2Y: -20,
      dir2Z: -30,

      pointColor: "#ffaa44",
      pointIntensity: 0.6,
      pointX: 0,
      pointY: 30,
      pointZ: 20
    };

    // --- Global App State ---
    let container, camera, scene, renderer, clock;
    let meshGroup, activeMesh, material, uniforms;
    let animTime = 0;
    let gui;
    const controllers = {};

    // Pointer Tracking for Drag vs Click
    let isPointerDown = false;
    let pointerButton = 0;
    let lastPointerX = 0, lastPointerY = 0;
    let totalPointerMove = 0;

    init();
    initGUI();
    animate();

    function init() {
      container = document.getElementById('container');
      clock = new THREE.Clock();

      scene = new THREE.Scene();

      // Perspective Camera setup
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 24);
      camera.lookAt(0, 0, 0);

      // Group holding the 3D object for intuitive screen dragging
      meshGroup = new THREE.Group();
      scene.add(meshGroup);

      // Shader Material and Uniforms
      uniforms = {
        resolution: { value: new THREE.Vector2(window.innerWidth * params.dpr, window.innerHeight * params.dpr) },
        time: { value: 1.0 },
        isOriginal: { value: params.isOriginal ? 1 : 0 },
        uColor1: { value: new THREE.Color(params.color1) },
        uColor2: { value: new THREE.Color(params.color2) },
        uColor3: { value: new THREE.Color(params.color3) },
        uColor4: { value: new THREE.Color(params.color4) },
        uColor5: { value: new THREE.Color(params.color5) },

        exposure: { value: params.exposure },
        masterLightIntensity: { value: params.masterLightIntensity },

        ambientColor: { value: new THREE.Color(params.ambientColor) },
        ambientIntensity: { value: params.ambientIntensity },

        dir1Color: { value: new THREE.Color(params.dir1Color) },
        dir1Intensity: { value: params.dir1Intensity },
        dir1Dir: { value: new THREE.Vector3(params.dir1X, params.dir1Y, params.dir1Z).normalize() },

        dir2Color: { value: new THREE.Color(params.dir2Color) },
        dir2Intensity: { value: params.dir2Intensity },
        dir2Dir: { value: new THREE.Vector3(params.dir2X, params.dir2Y, params.dir2Z).normalize() },

        pointColor: { value: new THREE.Color(params.pointColor) },
        pointIntensity: { value: params.pointIntensity },
        pointPos: { value: new THREE.Vector3(params.pointX, params.pointY, params.pointZ) }
      };

      material = new THREE.ShaderMaterial({
        uniforms: uniforms,
        vertexShader: document.getElementById('vertexShader').textContent,
        fragmentShader: document.getElementById('fragmentShader').textContent,
        side: THREE.DoubleSide
      });

      // Build active geometry & mesh
      updateGeometry();

      // WebGL Renderer
      renderer = new THREE.WebGLRenderer({ antialias: params.antialias });
      renderer.setPixelRatio(params.dpr);
      renderer.setSize(window.innerWidth, window.innerHeight);
      updateBackground();
      container.appendChild(renderer.domElement);

      // Event Listeners
      window.addEventListener('resize', onWindowResize, false);
      window.addEventListener('wheel', onWheel, { passive: false });
      window.addEventListener('pointerdown', onPointerDown, false);
      window.addEventListener('pointermove', onPointerMove, false);
      window.addEventListener('pointerup', onPointerUp, false);
      window.addEventListener('contextmenu', (e) => e.preventDefault());
      window.addEventListener('keydown', onKeyDown, false);
    }

    function createGeometry(type, scale) {
      switch (type) {
        case "Plane":
          return new THREE.PlaneGeometry(16 * scale, 12 * scale, 64, 64);
        case "Torus":
          return new THREE.TorusGeometry(5.5 * scale, 2.2 * scale, 48, 96);
        case "Sphere":
          return new THREE.SphereGeometry(6.0 * scale, 64, 64);
        case "Torus Knot":
          return new THREE.TorusKnotGeometry(4.8 * scale, 1.6 * scale, 128, 32);
        case "Cylinder":
          return new THREE.CylinderGeometry(4.5 * scale, 4.5 * scale, 10.0 * scale, 64);
        case "Box":
          return new THREE.BoxGeometry(7.5 * scale, 7.5 * scale, 7.5 * scale, 32, 32, 32);
        case "Icosahedron":
          return new THREE.IcosahedronGeometry(6.5 * scale, 3);
        case "Disc":
          return new THREE.CircleGeometry(7.0 * scale, 64);
        default:
          return new THREE.PlaneGeometry(16 * scale, 12 * scale, 64, 64);
      }
    }

    function updateGeometry() {
      if (activeMesh) {
        meshGroup.remove(activeMesh);
        if (activeMesh.geometry) activeMesh.geometry.dispose();
      }
      const geom = createGeometry(params.geometryType, params.geomScale);
      activeMesh = new THREE.Mesh(geom, material);
      meshGroup.add(activeMesh);
      meshGroup.position.set(params.objectPosX, params.objectPosY, params.objectPosZ);
    }

    function updateBackground() {
      if (params.greenScreen) {
        renderer.setClearColor(0x00ff00, 1.0);
        scene.background = new THREE.Color(0x00ff00);
        document.body.style.backgroundColor = '#00ff00';
      } else {
        const col = new THREE.Color(params.bgColor);
        renderer.setClearColor(col, 1.0);
        scene.background = col;
        document.body.style.backgroundColor = params.bgColor;
      }
    }

    function updateShaderColors() {
      uniforms.isOriginal.value = params.isOriginal ? 1 : 0;
      uniforms.uColor1.value.set(params.color1);
      uniforms.uColor2.value.set(params.color2);
      uniforms.uColor3.value.set(params.color3);
      uniforms.uColor4.value.set(params.color4);
      uniforms.uColor5.value.set(params.color5);

      uniforms.exposure.value = params.exposure;
      uniforms.masterLightIntensity.value = params.masterLightIntensity;

      uniforms.ambientColor.value.set(params.ambientColor);
      uniforms.ambientIntensity.value = params.ambientIntensity;

      uniforms.dir1Color.value.set(params.dir1Color);
      uniforms.dir1Intensity.value = params.dir1Intensity;
      uniforms.dir1Dir.value.set(params.dir1X, params.dir1Y, params.dir1Z).normalize();

      uniforms.dir2Color.value.set(params.dir2Color);
      uniforms.dir2Intensity.value = params.dir2Intensity;
      uniforms.dir2Dir.value.set(params.dir2X, params.dir2Y, params.dir2Z).normalize();

      uniforms.pointColor.value.set(params.pointColor);
      uniforms.pointIntensity.value = params.pointIntensity;
      uniforms.pointPos.value.set(params.pointX, params.pointY, params.pointZ);
    }

    function applyColorScheme(schemeName) {
      const scheme = COLOR_SCHEMES.find(s => s.name === schemeName) || COLOR_SCHEMES[0];
      params.colorScheme = scheme.name;
      params.isOriginal = scheme.isOriginal;
      params.color1 = scheme.c1;
      params.color2 = scheme.c2;
      params.color3 = scheme.c3;
      params.color4 = scheme.c4;
      params.color5 = scheme.c5;
      if (!params.greenScreen) {
        params.bgColor = scheme.bg;
        updateBackground();
      }
      updateShaderColors();
      updateAllGui();
    }

    function rebuildRenderer(antialias) {
      const oldCanvas = renderer.domElement;
      renderer.dispose();
      if (oldCanvas && oldCanvas.parentNode) {
        oldCanvas.parentNode.removeChild(oldCanvas);
      }
      renderer = new THREE.WebGLRenderer({ antialias: antialias });
      renderer.setPixelRatio(params.dpr);
      renderer.setSize(window.innerWidth, window.innerHeight);
      updateBackground();
      container.appendChild(renderer.domElement);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      uniforms.resolution.value.set(window.innerWidth * params.dpr, window.innerHeight * params.dpr);
    }

    function onWheel(e) {
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.08 : 0.925;
      params.zoom = Math.max(0.15, Math.min(15.0, params.zoom * factor));
      if (controllers.zoom) controllers.zoom.updateDisplay();
    }

    function onPointerDown(e) {
      if (e.target.closest('.lil-gui')) return;
      isPointerDown = true;
      pointerButton = e.button;
      lastPointerX = e.clientX;
      lastPointerY = e.clientY;
      totalPointerMove = 0;
    }

    function onPointerMove(e) {
      if (!isPointerDown) return;
      const dx = e.clientX - lastPointerX;
      const dy = e.clientY - lastPointerY;
      totalPointerMove += Math.hypot(dx, dy);
      lastPointerX = e.clientX;
      lastPointerY = e.clientY;

      if (pointerButton === 2 || (pointerButton === 0 && e.shiftKey)) {
        // Orbit camera angle adjustment during interaction
        params.cameraYaw += dx * 0.008;
        params.cameraPitch = Math.max(-1.45, Math.min(1.45, params.cameraPitch + dy * 0.008));
        if (controllers.cameraYaw) controllers.cameraYaw.updateDisplay();
        if (controllers.cameraPitch) controllers.cameraPitch.updateDisplay();
      } else if (pointerButton === 0) {
        // Left-Click Drag: Drag object across screen in camera projection plane
        const dist = camera.position.distanceTo(meshGroup.position);
        const factor = (dist * 0.0016) / Math.max(params.zoom, 0.2);
        const camRight = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
        const camUp = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);

        meshGroup.position.addScaledVector(camRight, dx * factor);
        meshGroup.position.addScaledVector(camUp, -dy * factor);

        params.objectPosX = meshGroup.position.x;
        params.objectPosY = meshGroup.position.y;
        params.objectPosZ = meshGroup.position.z;

        if (controllers.objectPosX) controllers.objectPosX.updateDisplay();
        if (controllers.objectPosY) controllers.objectPosY.updateDisplay();
        if (controllers.objectPosZ) controllers.objectPosZ.updateDisplay();
      }
    }

    function onPointerUp(e) {
      if (!isPointerDown) return;
      isPointerDown = false;

      // Click detection (moved less than 6px and not inside GUI)
      if (totalPointerMove < 6 && pointerButton === 0 && params.randomOnClick) {
        if (!e.target.closest('.lil-gui')) {
          triggerProceduralRandom();
        }
      }
    }

    function onKeyDown(e) {
      if (e.key === 'h' || e.key === 'H') {
        gui._hidden = !gui._hidden;
        if (gui.domElement) {
          gui.domElement.style.display = gui._hidden ? 'none' : '';
        }
      }
    }

    // --- Procedural Randomizer ---
    function triggerProceduralRandom() {
      // Pick random color scheme from the 19 preconfigured schemes
      const randomScheme = COLOR_SCHEMES[Math.floor(Math.random() * COLOR_SCHEMES.length)];
      params.colorScheme = randomScheme.name;
      params.isOriginal = randomScheme.isOriginal;
      params.color1 = randomScheme.c1;
      params.color2 = randomScheme.c2;
      params.color3 = randomScheme.c3;
      params.color4 = randomScheme.c4;
      params.color5 = randomScheme.c5;
      if (!params.greenScreen) {
        params.bgColor = randomScheme.bg;
        updateBackground();
      }

      // Re-roll geometry type and scale
      params.geometryType = GEOMETRY_NAMES[Math.floor(Math.random() * GEOMETRY_NAMES.length)];
      params.geomScale = parseFloat((0.75 + Math.random() * 0.65).toFixed(2));
      params.meshRotSpeedX = parseFloat(((Math.random() - 0.5) * 0.8).toFixed(2));
      params.meshRotSpeedY = parseFloat(((Math.random() - 0.5) * 0.8).toFixed(2));
      params.meshRotSpeedZ = parseFloat(((Math.random() - 0.5) * 0.8).toFixed(2));
      params.autoRotateMesh = (params.geometryType !== "Plane" && Math.random() > 0.4);
      updateGeometry();

      // Re-roll motion parameters
      params.animationSpeed = parseFloat((0.6 + Math.random() * 1.2).toFixed(2));
      params.waveSpeed = parseFloat((0.6 + Math.random() * 1.4).toFixed(2));

      // Re-roll camera animation & angles
      params.cameraAnimation = ANIMATION_NAMES[Math.floor(Math.random() * ANIMATION_NAMES.length)];
      params.cameraYaw = parseFloat(((Math.random() - 0.5) * Math.PI).toFixed(3));
      params.cameraPitch = parseFloat(((Math.random() - 0.5) * 0.8).toFixed(3));

      // Re-roll lighting & exposure
      params.exposure = parseFloat((0.8 + Math.random() * 0.5).toFixed(2));
      params.masterLightIntensity = parseFloat((0.8 + Math.random() * 0.5).toFixed(2));
      params.ambientIntensity = parseFloat((0.6 + Math.random() * 0.4).toFixed(2));
      params.dir1Intensity = parseFloat((0.5 + Math.random() * 0.7).toFixed(2));
      params.dir2Intensity = parseFloat((0.2 + Math.random() * 0.5).toFixed(2));
      params.pointIntensity = parseFloat((0.3 + Math.random() * 0.6).toFixed(2));

      updateShaderColors();
      updateAllGui();
    }

    function updateAllGui() {
      for (const key in controllers) {
        if (controllers[key] && typeof controllers[key].updateDisplay === 'function') {
          controllers[key].updateDisplay();
        }
      }
    }

    // --- lil-gui Control Panel ---
    function initGUI() {
      gui = new GUI({ title: 'Monjori Visualizer' });

      // Display & Canvas Folder
      const fDisplay = gui.addFolder('Display & View');
      controllers.greenScreen = fDisplay.add(params, 'greenScreen').name('Green Screen (#00ff00)').onChange(updateBackground);
      controllers.bgColor = fDisplay.addColor(params, 'bgColor').name('Background Color').onChange(updateBackground);
      controllers.dpr = fDisplay.add(params, 'dpr', 0.25, 3.0, 0.25).name('Pixel Ratio (DPR)').onChange(v => {
        renderer.setPixelRatio(v);
        renderer.setSize(window.innerWidth, window.innerHeight);
        uniforms.resolution.value.set(window.innerWidth * v, window.innerHeight * v);
      });
      controllers.antialias = fDisplay.add(params, 'antialias').name('Antialias').onChange(v => rebuildRenderer(v));
      controllers.randomOnClick = fDisplay.add(params, 'randomOnClick').name('Random On Click');
      fDisplay.add({ randomize: triggerProceduralRandom }, 'randomize').name('Randomize Scene Now');

      // Colors & Theme Folder
      const fColors = gui.addFolder('Colors & Themes');
      controllers.colorScheme = fColors.add(params, 'colorScheme', COLOR_SCHEMES.map(s => s.name)).name('Preset Scheme').onChange(applyColorScheme);
      controllers.isOriginal = fColors.add(params, 'isOriginal').name('Use Original Math').onChange(updateShaderColors);
      controllers.color1 = fColors.addColor(params, 'color1').name('Color 1').onChange(() => { params.isOriginal = false; updateShaderColors(); updateAllGui(); });
      controllers.color2 = fColors.addColor(params, 'color2').name('Color 2').onChange(() => { params.isOriginal = false; updateShaderColors(); updateAllGui(); });
      controllers.color3 = fColors.addColor(params, 'color3').name('Color 3').onChange(() => { params.isOriginal = false; updateShaderColors(); updateAllGui(); });
      controllers.color4 = fColors.addColor(params, 'color4').name('Color 4').onChange(() => { params.isOriginal = false; updateShaderColors(); updateAllGui(); });
      controllers.color5 = fColors.addColor(params, 'color5').name('Color 5').onChange(() => { params.isOriginal = false; updateShaderColors(); updateAllGui(); });

      // Camera & Animations Folder
      const fAnim = gui.addFolder('Camera & Animation');
      controllers.cameraAnimation = fAnim.add(params, 'cameraAnimation', ANIMATION_NAMES).name('Animation Mode');
      controllers.animationSpeed = fAnim.add(params, 'animationSpeed', 0.0, 4.0, 0.05).name('Anim Speed');
      controllers.waveSpeed = fAnim.add(params, 'waveSpeed', 0.1, 4.0, 0.05).name('Wave Speed');
      controllers.zoom = fAnim.add(params, 'zoom', 0.15, 10.0, 0.05).name('Zoom');
      controllers.cameraPitch = fAnim.add(params, 'cameraPitch', -1.45, 1.45, 0.01).name('Camera Pitch');
      controllers.cameraYaw = fAnim.add(params, 'cameraYaw', -Math.PI, Math.PI, 0.01).name('Camera Yaw');
      fAnim.add({
        resetCamera: () => {
          params.zoom = 1.0;
          params.cameraPitch = 0.0;
          params.cameraYaw = 0.0;
          updateAllGui();
        }
      }, 'resetCamera').name('Reset Camera');

      // Object Geometry & Drag Folder
      const fObj = gui.addFolder('Object Geometry & Drag');
      controllers.geometryType = fObj.add(params, 'geometryType', GEOMETRY_NAMES).name('Geometry').onChange(updateGeometry);
      controllers.geomScale = fObj.add(params, 'geomScale', 0.2, 3.0, 0.05).name('Scale').onChange(updateGeometry);
      controllers.autoRotateMesh = fObj.add(params, 'autoRotateMesh').name('Auto Spin Object');
      controllers.meshRotSpeedX = fObj.add(params, 'meshRotSpeedX', -2.0, 2.0, 0.05).name('Spin X');
      controllers.meshRotSpeedY = fObj.add(params, 'meshRotSpeedY', -2.0, 2.0, 0.05).name('Spin Y');
      controllers.meshRotSpeedZ = fObj.add(params, 'meshRotSpeedZ', -2.0, 2.0, 0.05).name('Spin Z');
      controllers.objectPosX = fObj.add(params, 'objectPosX', -50, 50, 0.1).name('Pos X').onChange(v => { meshGroup.position.x = v; });
      controllers.objectPosY = fObj.add(params, 'objectPosY', -50, 50, 0.1).name('Pos Y').onChange(v => { meshGroup.position.y = v; });
      controllers.objectPosZ = fObj.add(params, 'objectPosZ', -80, 80, 0.1).name('Pos Z').onChange(v => { meshGroup.position.z = v; });
      fObj.add({
        resetPos: () => {
          meshGroup.position.set(0, 0, 0);
          params.objectPosX = 0;
          params.objectPosY = 0;
          params.objectPosZ = 0;
          updateAllGui();
        }
      }, 'resetPos').name('Reset Position');

      // Lighting & Exposure Folder
      const fLight = gui.addFolder('Lighting & Exposure');
      controllers.exposure = fLight.add(params, 'exposure', 0.1, 3.0, 0.05).name('Exposure').onChange(updateShaderColors);
      controllers.masterLightIntensity = fLight.add(params, 'masterLightIntensity', 0.0, 3.0, 0.05).name('Scene Light Intensity').onChange(updateShaderColors);

      // Ambient Light
      const fAmb = fLight.addFolder('Ambient Light');
      controllers.ambientColor = fAmb.addColor(params, 'ambientColor').name('Color').onChange(updateShaderColors);
      controllers.ambientIntensity = fAmb.add(params, 'ambientIntensity', 0.0, 2.0, 0.05).name('Intensity').onChange(updateShaderColors);

      // Key Directional Light
      const fDir1 = fLight.addFolder('Key Light (Dir 1)');
      controllers.dir1Color = fDir1.addColor(params, 'dir1Color').name('Color').onChange(updateShaderColors);
      controllers.dir1Intensity = fDir1.add(params, 'dir1Intensity', 0.0, 3.0, 0.05).name('Intensity').onChange(updateShaderColors);
      controllers.dir1X = fDir1.add(params, 'dir1X', -100, 100, 1).name('Dir X').onChange(updateShaderColors);
      controllers.dir1Y = fDir1.add(params, 'dir1Y', -100, 100, 1).name('Dir Y').onChange(updateShaderColors);
      controllers.dir1Z = fDir1.add(params, 'dir1Z', -100, 100, 1).name('Dir Z').onChange(updateShaderColors);

      // Fill Directional Light
      const fDir2 = fLight.addFolder('Fill Light (Dir 2)');
      controllers.dir2Color = fDir2.addColor(params, 'dir2Color').name('Color').onChange(updateShaderColors);
      controllers.dir2Intensity = fDir2.add(params, 'dir2Intensity', 0.0, 3.0, 0.05).name('Intensity').onChange(updateShaderColors);
      controllers.dir2X = fDir2.add(params, 'dir2X', -100, 100, 1).name('Dir X').onChange(updateShaderColors);
      controllers.dir2Y = fDir2.add(params, 'dir2Y', -100, 100, 1).name('Dir Y').onChange(updateShaderColors);
      controllers.dir2Z = fDir2.add(params, 'dir2Z', -100, 100, 1).name('Dir Z').onChange(updateShaderColors);

      // Point Light
      const fPoint = fLight.addFolder('Point Light');
      controllers.pointColor = fPoint.addColor(params, 'pointColor').name('Color').onChange(updateShaderColors);
      controllers.pointIntensity = fPoint.add(params, 'pointIntensity', 0.0, 3.0, 0.05).name('Intensity').onChange(updateShaderColors);
      controllers.pointX = fPoint.add(params, 'pointX', -100, 100, 1).name('Pos X').onChange(updateShaderColors);
      controllers.pointY = fPoint.add(params, 'pointY', -100, 100, 1).name('Pos Y').onChange(updateShaderColors);
      controllers.pointZ = fPoint.add(params, 'pointZ', -100, 100, 1).name('Pos Z').onChange(updateShaderColors);

      fLight.close();
      fObj.close();
    }

    // --- Main Animation & Render Loop ---
    function animate() {
      requestAnimationFrame(animate);
      render();
    }

    function render() {
      const delta = clock.getDelta();
      const effectiveDelta = delta * params.animationSpeed;
      animTime += effectiveDelta;

      // Update shader dynamic time
      uniforms.time.value += effectiveDelta * 0.15 * params.waveSpeed;

      // Optional object spin
      if (params.autoRotateMesh && activeMesh) {
        activeMesh.rotation.x += effectiveDelta * params.meshRotSpeedX;
        activeMesh.rotation.y += effectiveDelta * params.meshRotSpeedY;
        activeMesh.rotation.z += effectiveDelta * params.meshRotSpeedZ;
      }

      // Base camera distance (scaled smoothly by user zoom)
      const baseDist = 24.0 / Math.max(params.zoom, 0.1);
      const lookTarget = new THREE.Vector3(0, 0, 0);

      let theta = params.cameraYaw;
      let phi = params.cameraPitch;

      // 8 Preconfigured Camera Animations (smooth, elegant, and slow)
      switch (params.cameraAnimation) {
        case "Static (No Movement)":
          // Remains still with user pitch and yaw applied
          break;

        case "Gentle Orbit":
          theta += animTime * 0.15;
          phi += 0.25;
          break;

        case "Infinity Figure-8":
          theta += Math.sin(animTime * 0.12) * 0.6;
          phi += Math.sin(animTime * 0.24) * 0.3 + 0.2;
          break;

        case "Breathing Dolly": {
          const osc = 1.0 + 0.16 * Math.sin(animTime * 0.25);
          const currentDist = baseDist * osc;
          const cp = Math.max(-1.5, Math.min(1.5, phi + 0.2));
          camera.position.set(
            currentDist * Math.cos(cp) * Math.sin(theta),
            currentDist * Math.sin(cp),
            currentDist * Math.cos(cp) * Math.cos(theta)
          );
          camera.lookAt(lookTarget);
          renderer.render(scene, camera);
          return;
        }

        case "Pendulum Sway":
          theta += Math.sin(animTime * 0.16) * 0.55;
          phi += Math.cos(animTime * 0.16) * 0.15 + 0.25;
          break;

        case "Spiral Drift":
          theta += animTime * 0.1;
          phi += Math.sin(animTime * 0.1) * 0.35 + 0.25;
          break;

        case "Horizon Arc":
          theta += Math.sin(animTime * 0.12) * 0.75;
          phi += (Math.cos(animTime * 0.12) * 0.5 + 0.5) * 0.2 + 0.1;
          break;

        case "Zenith Float":
          theta += animTime * 0.12;
          phi += Math.sin(animTime * 0.15) * 0.15 + 0.85;
          break;
      }

      // Clamp pitch to avoid gimbal lock / pole inversion
      const clampedPhi = Math.max(-1.52, Math.min(1.52, phi));

      camera.position.set(
        baseDist * Math.cos(clampedPhi) * Math.sin(theta),
        baseDist * Math.sin(clampedPhi),
        baseDist * Math.cos(clampedPhi) * Math.cos(theta)
      );
      camera.lookAt(lookTarget);

      renderer.render(scene, camera);
    }
  </script>
