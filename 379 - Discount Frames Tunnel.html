<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Discount Frames Tunnel</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.162.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.162.0/examples/jsm/",
      "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js",
      "postprocessing/PostProcessor.js": "./postprocessing/PostProcessor.js"
    }
  }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import GUI from 'lil-gui';

    // =========================================================================
    // POST PROCESSOR SUITE (Inlined from postprocessing/PostProcessor.js)
    // =========================================================================
    const orthoVertexShader = `
    precision highp float;
    in vec3 position;
    out vec2 vUv;
    void main() {
      vUv = position.xy * 0.5 + 0.5;
      gl_Position = vec4(position, 1.0);
    }
    `;

    const brightFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float bloomThreshold;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float luminance = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float knee = 0.1;
      float soft = luminance - bloomThreshold + knee;
      soft = clamp(soft, 0.0, 2.0 * knee);
      soft = (soft * soft) / (4.0 * knee + 0.00001);
      float contribution = max(soft, luminance - bloomThreshold);
      contribution /= max(luminance, 0.00001);
      fragColor = vec4(color.rgb * contribution, color.a);
    }
    `;

    const blur13ShaderChunk = `
    vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
      vec2 resolution = vec2(textureSize(image, 0));
      vec4 color = vec4(0.0);
      vec2 off1 = vec2(1.411764705882353) * direction;
      vec2 off2 = vec2(3.2941176470588234) * direction;
      vec2 off3 = vec2(5.176470588235294) * direction;
      color += texture(image, uv) * 0.1964825501511404;
      color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
      color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
      return color;
    }
    `;

    const blurFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 direction;
    in vec2 vUv;
    out vec4 color;
    ${blur13ShaderChunk}
    void main() {
      color = blur13(inputTexture, vUv, direction);
    }
    `;

    const godRaysDepthMaskShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float threshold;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float lum = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float factor = smoothstep(threshold, threshold + 0.15, lum);
      fragColor = vec4(vec3(factor), 1.0);
    }
    `;

    const godRaysGenerateShader = `
    precision highp float;
    #define TAPS_PER_PASS 6.0

    uniform sampler2D inputTexture;
    uniform vec3 vSunPositionScreenSpace;
    uniform float fStepSize;
    uniform float distanceAttenuation;
    uniform float maxDensity;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec2 delta = vSunPositionScreenSpace.xy - vUv;
      float dist = length(delta);
      vec2 stepv = fStepSize * delta / max(dist, 0.0001);
      float iters = dist / max(fStepSize, 0.00001);

      vec2 uv = vUv;
      float col = 0.0;
      float f = min(1.0, max(vSunPositionScreenSpace.z, 0.0));
      float atten = 1.0 / (1.0 + pow(dist, distanceAttenuation));

      if (0.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (1.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (2.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (3.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (4.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (5.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;

      float finalVal = min(col / TAPS_PER_PASS * atten, maxDensity);
      fragColor = vec4(vec3(finalVal), 1.0);
    }
    `;

    const anamorphicBrightShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float threshold;
    uniform float smoothWidth;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float v = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float alpha = smoothstep(threshold, threshold + smoothWidth, v);
      fragColor = mix(vec4(0.0), color, alpha);
    }
    `;

    const anamorphicBlurShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 resolution;
    uniform float samples;
    uniform float intensity;
    uniform vec3 tintColor;
    uniform float bloomRadius;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      int halfSamples = max(1, int(samples) / 2);
      float fHalfSamples = float(halfSamples);
      vec2 invSize = 1.0 / resolution;
      vec4 total = vec4(0.0);

      for (int i = -64; i <= 64; i++) {
        if (i < -halfSamples || i > halfSamples) continue;
        float softness = 1.0 - abs(float(i)) / fHalfSamples;
        softness = pow(softness, 2.0);
        vec2 shiftedUV = vec2(vUv.x + invSize.x * float(i) * (4.0 + bloomRadius * 8.0), vUv.y);
        shiftedUV = clamp(shiftedUV, 0.001, 0.999);
        total += texture(inputTexture, shiftedUV) * softness;
      }

      fragColor = (total / (samples / 3.0)) * vec4(tintColor, 1.0) * intensity;
    }
    `;

    const finalFragmentShader = `
    precision highp float;
    uniform vec2 resolution;
    uniform sampler2D inputTexture;
    uniform sampler2D blur0Texture;
    uniform sampler2D blur1Texture;
    uniform sampler2D blur2Texture;
    uniform sampler2D blur3Texture;
    uniform sampler2D blur4Texture;
    uniform sampler2D raysTexture;
    uniform sampler2D anamorphicTexture;
    uniform bool bloomEnabled;
    uniform float bloomStrength;
    uniform bool raysEnabled;
    uniform float raysStrength;
    uniform vec3 raysColor;
    uniform bool anamorphicEnabled;
    uniform float vignetteBoost;
    uniform float vignetteReduction;
    uniform float noiseIntensity;
    uniform float time;
    in vec2 vUv;
    out vec4 fragColor;

    float vignette(vec2 uv, float boost, float reduction) {
      vec2 position = vUv - 0.5;
      return boost - length(position) * reduction;
    }

    float hash1(uint n) {
      n = (n << 13U) ^ n;
      n = n * (n * n * 15731U + 789221U) + 1376312589U;
      return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
    }

    float noise(in vec2 uv, in float timeVal) {
      uvec2 p = uvec2(uv);
      return hash1(p.x + 1920U * p.y + (1920U * 1080U) * uint(timeVal));
    }

    void main() {
      vec4 color = texture(inputTexture, vUv);

      if (bloomEnabled && bloomStrength > 0.001) {
        vec4 b0 = texture(blur0Texture, vUv);
        vec4 b1 = texture(blur1Texture, vUv);
        vec4 b2 = texture(blur2Texture, vUv);
        vec4 b3 = texture(blur3Texture, vUv);
        vec4 b4 = texture(blur4Texture, vUv);

        vec4 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
        color += bloomSum * bloomStrength;
      }

      if (raysEnabled && raysStrength > 0.001) {
        vec4 r = texture(raysTexture, vUv);
        color.rgb += r.rgb * raysColor * raysStrength;
      }

      if (anamorphicEnabled) {
        vec4 a = texture(anamorphicTexture, vUv);
        color.rgb += a.rgb;
      }

      color.rgb *= vignette(vUv, vignetteBoost, vignetteReduction);
      color.rgb += noiseIntensity * noise(gl_FragCoord.xy, time);
      fragColor = vec4(color.rgb, 1.0);
    }
    `;

    const chromaticAberrationShaderChunk = `
    vec2 barrelDistortion(vec2 coord, float amt) {
      vec2 cc = coord - 0.5;
      float dist = dot(cc, cc);
      return coord + cc * dist * amt;
    }
    float sat(float t) { return clamp(t, 0.0, 1.0); }
    float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
    float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
    vec4 spectrum_offset(float t) {
      float lo = step(t, 0.5);
      float hi = 1.0 - lo;
      float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
      vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
      return pow(ret, vec4(1.0 / 2.2));
    }
    const float max_distort = 2.2;
    const int num_iter = 8;
    const float reci_num_iter_f = 1.0 / float(num_iter);
    vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
      vec4 sumcol = vec4(0.0);
      vec4 sumw = vec4(0.0);
      for (int i = 0; i < num_iter; ++i) {
        float t = float(i) * reci_num_iter_f;
        vec4 w = spectrum_offset(t);
        sumw += w;
        sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
      }
      return sumcol / sumw;
    }
    `;

    const colorFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float chromaticAberrationAmount;
    uniform float minInputLevel;
    uniform float maxInputLevel;
    uniform float gammaLevel;
    uniform float exposure;
    uniform float fisheyeStrength;
    uniform float fisheyeRadius;
    uniform float time;
    uniform int visionMode;
    uniform float thermalSensitivity;
    uniform float nightVisionNoise;
    uniform float nightVisionGain;
    uniform float crtIntensity;
    in vec2 vUv;
    out vec4 fragColor;

    ${chromaticAberrationShaderChunk}

    vec2 applyFisheye(vec2 uv, float strength, float radius) {
      if (abs(strength) < 0.0001) return uv;
      vec2 p = uv - 0.5;
      float d = length(p);
      if (d > radius * 1.5) return uv;
      float r = d / max(radius, 0.001);
      float theta = atan(p.y, p.x);
      float rDist = r + strength * (r * r * r);
      return 0.5 + vec2(cos(theta), sin(theta)) * (rDist * radius);
    }

    vec3 ACESFilmicToneMapping(vec3 color) {
      float a = 2.51;
      float b = 0.03;
      float c = 2.43;
      float d = 0.59;
      float e = 0.14;
      return clamp((color * (a * color + b)) / (color * (c * color + d) + e), 0.0, 1.0);
    }

    vec3 gammaCorrect(vec3 color, vec3 gamma) {
      return pow(max(color, vec3(0.0)), 1.0 / gamma);
    }
    vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
      return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
    }
    vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
      return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
    }

    vec3 applyNightVision(vec3 color, vec2 uv, float timeVal, float noiseAmt, float gain, float crt) {
      float lum = dot(color, vec3(0.299, 0.587, 0.114));
      float amplified = pow(lum * gain, 0.72);
      vec3 phosphorColor = mix(vec3(0.02, 0.12, 0.03), vec3(0.18, 1.0, 0.32), clamp(amplified, 0.0, 1.0));
      phosphorColor += vec3(0.7, 1.0, 0.8) * max(0.0, amplified - 0.75) * 1.8;
      vec2 p = uv - 0.5;
      float tubeDist = length(p);
      float tubeMask = smoothstep(0.72, 0.44, tubeDist);
      float n = fract(sin(dot(uv * 280.0 + timeVal * 0.05, vec2(12.9898, 78.233))) * 43758.5453);
      float scanline = sin(uv.y * 650.0) * crt;
      phosphorColor += (n - 0.5) * noiseAmt * 2.0 + scanline;
      return clamp(phosphorColor * tubeMask, 0.0, 1.0);
    }

    vec3 ironbow(float t) {
      t = clamp(t, 0.0, 1.0);
      vec3 c0 = vec3(0.02, 0.01, 0.18);
      vec3 c1 = vec3(0.22, 0.02, 0.48);
      vec3 c2 = vec3(0.82, 0.05, 0.25);
      vec3 c3 = vec3(1.0, 0.62, 0.02);
      vec3 c4 = vec3(1.0, 1.0, 0.92);
      if (t < 0.25) return mix(c0, c1, t * 4.0);
      if (t < 0.50) return mix(c1, c2, (t - 0.25) * 4.0);
      if (t < 0.75) return mix(c2, c3, (t - 0.50) * 4.0);
      return mix(c3, c4, (t - 0.75) * 4.0);
    }

    vec3 applyThermal(vec3 color, vec2 uv, float sensitivity, float crt, bool whiteHot) {
      float lum = dot(color, vec3(0.299, 0.587, 0.114));
      float heat = clamp(lum * sensitivity, 0.0, 1.0);
      float sensorRaster = sin(uv.y * 900.0) * (crt * 0.3);
      heat = clamp(heat + sensorRaster, 0.0, 1.0);
      if (whiteHot) {
        float grad = pow(heat, 0.85);
        return vec3(grad);
      } else {
        return ironbow(heat);
      }
    }

    void main() {
      vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
      vec4 col = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
      vec3 finalCol = col.rgb;
      
      if (visionMode == 1) {
        finalCol = applyNightVision(finalCol, uv, time, nightVisionNoise, nightVisionGain, crtIntensity);
      } else if (visionMode == 2) {
        finalCol = applyThermal(finalCol, uv, thermalSensitivity, crtIntensity, false);
      } else if (visionMode == 3) {
        finalCol = applyThermal(finalCol, uv, thermalSensitivity, crtIntensity, true);
      } else {
        vec3 exposedColor = finalCol * exposure;
        vec3 toneMappedColor = ACESFilmicToneMapping(exposedColor);
        finalCol = finalLevels(toneMappedColor, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
      }

      fragColor = vec4(finalCol, 1.0);
    }
    `;

    const copyFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      fragColor = texture(inputTexture, vUv);
    }
    `;

    function createFBO(w, h, options = {}) {
      return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
        wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
        wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
        minFilter: options.minFilter || THREE.LinearFilter,
        magFilter: options.magFilter || THREE.LinearFilter,
        format: options.format || THREE.RGBAFormat,
        type: options.type || THREE.HalfFloatType,
        stencilBuffer: options.stencilBuffer || false,
        depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : true,
        samples: options.samples || 0,
      });
    }

    class ShaderPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbo = createFBO(1, 1, options);
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
        this.texture = this.fbo.texture;
      }
      render(renderer, toScreen = false) {
        if (!toScreen) renderer.setRenderTarget(this.fbo);
        renderer.render(this.orthoScene, this.orthoCamera);
        if (!toScreen) renderer.setRenderTarget(null);
      }
      setSize(width, height) {
        this.fbo.setSize(Math.max(1, width), Math.max(1, height));
        this.orthoQuad.scale.set(width, height, 1);
      }
    }

    class ShaderPingPongPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
        this.currentFBO = 0;
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
      }
      render(renderer) {
        renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
        renderer.render(this.orthoScene, this.orthoCamera);
        renderer.setRenderTarget(null);
        this.currentFBO = 1 - this.currentFBO;
      }
      get current() { return this.fbos[this.currentFBO]; }
      get texture() { return this.current.texture; }
      setSize(width, height) {
        const w = Math.max(1, width);
        const h = Math.max(1, height);
        this.orthoQuad.scale.set(w, h, 1);
        this.fbos[0].setSize(w, h);
        this.fbos[1].setSize(w, h);
      }
    }

    class BloomPass {
      constructor(strength = 0.8, radius = 0.5, threshold = 0.2, levels = 5) {
        this.strength = strength;
        this.radius = radius;
        this.threshold = threshold;
        this.enabled = true;
        this.levels = levels;

        this.brightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            bloomThreshold: { value: this.threshold },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: brightFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.brightPass = new ShaderPass(this.brightPass || this.brightShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.blurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            direction: { value: new THREE.Vector2(0, 1) },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: blurFragmentShader,
          glslVersion: THREE.GLSL3,
        });

        this.blurPasses = [];
        for (let i = 0; i < this.levels; i++) {
          this.blurPasses.push(new ShaderPingPongPass(this.blurShader, {
            format: THREE.RGBAFormat,
            type: THREE.HalfFloatType,
          }));
        }
      }

      setSize(w, h) {
        let tw = Math.max(1, w);
        let th = Math.max(1, h);
        this.brightPass.setSize(tw, th);
        for (let i = 0; i < this.levels; i++) {
          tw = Math.max(1, Math.round(tw / 2));
          th = Math.max(1, Math.round(th / 2));
          this.blurPasses[i].setSize(tw, th);
        }
      }

      set source(texture) {
        this.brightShader.uniforms.inputTexture.value = texture;
      }

      render(renderer) {
        if (!this.enabled || this.strength <= 0.001) return;
        this.brightShader.uniforms.bloomThreshold.value = this.threshold;
        this.brightPass.render(renderer);

        const baseOffset = Math.max(0.1, this.radius * 2.0);
        const u = this.blurShader.uniforms;

        for (let j = 0; j < this.levels; j++) {
          const blurPass = this.blurPasses[j];
          const stepOffset = baseOffset * (1.0 + j * 0.5);

          u.direction.value.set(stepOffset, 0);
          u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
          blurPass.render(renderer);

          u.direction.value.set(0, stepOffset * 0.5);
          u.inputTexture.value = blurPass.current.texture;
          blurPass.render(renderer);
        }
      }
    }

    const VISION_MODE_MAP = {
      'Normal (Cinematic)': 0,
      'Night Vision (Phosphor)': 1,
      'Thermal (Ironbow)': 2,
      'Thermal (White-Hot)': 3,
    };

    class PostProcessor {
      constructor(renderer, params = {}) {
        this.renderer = renderer;

        this.settings = {
          enabled: params.enabled !== undefined ? params.enabled : true,

          bloomEnabled: params.bloomEnabled !== undefined ? params.bloomEnabled : true,
          bloomStrength: params.bloomStrength !== undefined ? params.bloomStrength : 1.4,
          bloomRadius: params.bloomRadius !== undefined ? params.bloomRadius : 0.65,
          bloomThreshold: params.bloomThreshold !== undefined ? params.bloomThreshold : 0.18,

          raysEnabled: params.raysEnabled !== undefined ? params.raysEnabled : false,
          raysStrength: params.raysStrength !== undefined ? params.raysStrength : 0.85,
          raysDensity: params.raysDensity !== undefined ? params.raysDensity : 1.0,
          raysMaxDensity: params.raysMaxDensity !== undefined ? params.raysMaxDensity : 0.5,
          raysDistanceAttenuation: params.raysDistanceAttenuation !== undefined ? params.raysDistanceAttenuation : 2.0,
          raysThreshold: params.raysThreshold !== undefined ? params.raysThreshold : 0.15,
          raysColor: params.raysColor ? (params.raysColor.isColor ? params.raysColor.clone() : new THREE.Color(params.raysColor)) : new THREE.Color(0x00f0ff),
          raysColorHex: params.raysColorHex || '#00f0ff',

          anamorphicEnabled: params.anamorphicEnabled !== undefined ? params.anamorphicEnabled : false,
          anamorphicIntensity: params.anamorphicIntensity !== undefined ? params.anamorphicIntensity : 2.5,
          anamorphicThreshold: params.anamorphicThreshold !== undefined ? params.anamorphicThreshold : 0.25,
          anamorphicSamples: params.anamorphicSamples !== undefined ? params.anamorphicSamples : 64,
          anamorphicRadius: params.anamorphicRadius !== undefined ? params.anamorphicRadius : 0.0,
          anamorphicSmoothWidth: params.anamorphicSmoothWidth !== undefined ? params.anamorphicSmoothWidth : 0.05,
          anamorphicColor: params.anamorphicColor ? (params.anamorphicColor.isColor ? params.anamorphicColor.clone() : new THREE.Color(params.anamorphicColor)) : new THREE.Color(0x00f0ff),
          anamorphicColorHex: params.anamorphicColorHex || '#00f0ff',

          visionMode: params.visionMode !== undefined ? params.visionMode : 'Normal (Cinematic)',
          thermalSensitivity: params.thermalSensitivity !== undefined ? params.thermalSensitivity : 1.4,
          nightVisionGain: params.nightVisionGain !== undefined ? params.nightVisionGain : 2.1,
          nightVisionNoise: params.nightVisionNoise !== undefined ? params.nightVisionNoise : 0.05,
          crtIntensity: params.crtIntensity !== undefined ? params.crtIntensity : 0.0,

          fisheyeStrength: params.fisheyeStrength !== undefined ? params.fisheyeStrength : 0.0,
          fisheyeRadius: params.fisheyeRadius !== undefined ? params.fisheyeRadius : 1.0,
          chromaticAberration: params.chromaticAberration !== undefined ? params.chromaticAberration : 0.015,
          vignetteBoost: params.vignetteBoost !== undefined ? params.vignetteBoost : 1.1,
          vignetteReduction: params.vignetteReduction !== undefined ? params.vignetteReduction : 0.65,
          noiseIntensity: params.noiseIntensity !== undefined ? params.noiseIntensity : 0.012,

          gamma: params.gamma !== undefined ? params.gamma : 1.0,
          minInputLevel: params.minInputLevel !== undefined ? params.minInputLevel : 0.0,
          maxInputLevel: params.maxInputLevel !== undefined ? params.maxInputLevel : 1.0,
          exposure: params.exposure !== undefined ? params.exposure : 1.05,
        };

        this.sceneTarget = createFBO(1, 1, { type: THREE.HalfFloatType });
        this.bloomPass = new BloomPass(
          this.settings.bloomStrength,
          this.settings.bloomRadius,
          this.settings.bloomThreshold,
          5
        );

        this.moonScreenPos = new THREE.Vector3(0.5, 0.5, 1.0);
        this.moonInFront = true;

        this.godRaysMaskShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            threshold: { value: this.settings.raysThreshold },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: godRaysDepthMaskShader,
          glslVersion: THREE.GLSL3,
        });
        this.godRaysMaskPass = new ShaderPass(this.godRaysMaskShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.godRaysGenShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            vSunPositionScreenSpace: { value: this.moonScreenPos },
            fStepSize: { value: 1.0 },
            distanceAttenuation: { value: this.settings.raysDistanceAttenuation },
            maxDensity: { value: this.settings.raysMaxDensity },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: godRaysGenerateShader,
          glslVersion: THREE.GLSL3,
        });
        this.godRaysPingPong = new ShaderPingPongPass(this.godRaysGenShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.anamorphicBrightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            threshold: { value: this.settings.anamorphicThreshold },
            smoothWidth: { value: this.settings.anamorphicSmoothWidth },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: anamorphicBrightShader,
          glslVersion: THREE.GLSL3,
        });
        this.anamorphicBrightPass = new ShaderPass(this.anamorphicBrightShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.anamorphicBlurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            resolution: { value: new THREE.Vector2(1, 1) },
            samples: { value: this.settings.anamorphicSamples },
            intensity: { value: this.settings.anamorphicIntensity },
            tintColor: { value: this.settings.anamorphicColor },
            bloomRadius: { value: this.settings.anamorphicRadius },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: anamorphicBlurShader,
          glslVersion: THREE.GLSL3,
        });
        this.anamorphicBlurPass = new ShaderPass(this.anamorphicBlurShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.finalShader = new THREE.RawShaderMaterial({
          uniforms: {
            resolution: { value: new THREE.Vector2(1, 1) },
            bloomEnabled: { value: this.settings.bloomEnabled },
            bloomStrength: { value: this.settings.bloomStrength },
            raysEnabled: { value: this.settings.raysEnabled },
            raysStrength: { value: this.settings.raysStrength },
            raysColor: { value: this.settings.raysColor },
            anamorphicEnabled: { value: this.settings.anamorphicEnabled },
            vignetteBoost: { value: this.settings.vignetteBoost },
            vignetteReduction: { value: this.settings.vignetteReduction },
            noiseIntensity: { value: this.settings.noiseIntensity },
            inputTexture: { value: null },
            blur0Texture: { value: null },
            blur1Texture: { value: null },
            blur2Texture: { value: null },
            blur3Texture: { value: null },
            blur4Texture: { value: null },
            raysTexture: { value: null },
            anamorphicTexture: { value: null },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: finalFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.finalPass = new ShaderPass(this.finalShader);

        this.rgbShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: this.finalPass.texture },
            fisheyeStrength: { value: this.settings.fisheyeStrength },
            fisheyeRadius: { value: this.settings.fisheyeRadius },
            chromaticAberrationAmount: { value: this.settings.chromaticAberration },
            minInputLevel: { value: this.settings.minInputLevel },
            maxInputLevel: { value: this.settings.maxInputLevel },
            gammaLevel: { value: this.settings.gamma },
            exposure: { value: this.settings.exposure },
            visionMode: { value: VISION_MODE_MAP[this.settings.visionMode] ?? 0 },
            thermalSensitivity: { value: this.settings.thermalSensitivity },
            nightVisionGain: { value: this.settings.nightVisionGain },
            nightVisionNoise: { value: this.settings.nightVisionNoise },
            crtIntensity: { value: this.settings.crtIntensity },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: colorFragmentShader,
          glslVersion: THREE.GLSL3,
        });

        this.copyShader = new THREE.RawShaderMaterial({
          uniforms: { inputTexture: { value: null } },
          vertexShader: orthoVertexShader,
          fragmentShader: copyFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.copyPass = new ShaderPass(this.copyShader);
      }

      updateSettings() {
        this.bloomPass.enabled = this.settings.bloomEnabled;
        this.bloomPass.strength = this.settings.bloomStrength;
        this.bloomPass.radius = this.settings.bloomRadius;
        this.bloomPass.threshold = this.settings.bloomThreshold;

        this.godRaysMaskShader.uniforms.threshold.value = this.settings.raysThreshold;
        this.godRaysGenShader.uniforms.distanceAttenuation.value = this.settings.raysDistanceAttenuation;
        this.godRaysGenShader.uniforms.maxDensity.value = this.settings.raysMaxDensity;

        this.anamorphicBrightShader.uniforms.threshold.value = this.settings.anamorphicThreshold;
        this.anamorphicBrightShader.uniforms.smoothWidth.value = this.settings.anamorphicSmoothWidth;
        this.anamorphicBlurShader.uniforms.samples.value = this.settings.anamorphicSamples;
        this.anamorphicBlurShader.uniforms.intensity.value = this.settings.anamorphicIntensity;
        this.anamorphicBlurShader.uniforms.tintColor.value.copy(this.settings.anamorphicColor);
        this.anamorphicBlurShader.uniforms.bloomRadius.value = this.settings.anamorphicRadius;

        this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
        this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
        this.finalShader.uniforms.raysEnabled.value = this.settings.raysEnabled;
        this.finalShader.uniforms.raysStrength.value = this.settings.raysStrength;
        this.finalShader.uniforms.raysColor.value.copy(this.settings.raysColor);
        this.finalShader.uniforms.anamorphicEnabled.value = this.settings.anamorphicEnabled;
        this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
        this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
        this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;

        this.rgbShader.uniforms.fisheyeStrength.value = this.settings.fisheyeStrength;
        this.rgbShader.uniforms.fisheyeRadius.value = this.settings.fisheyeRadius;
        this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
        this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
        this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
        this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
        this.rgbShader.uniforms.exposure.value = this.settings.exposure;
        this.rgbShader.uniforms.visionMode.value = VISION_MODE_MAP[this.settings.visionMode] ?? 0;
        this.rgbShader.uniforms.thermalSensitivity.value = this.settings.thermalSensitivity;
        this.rgbShader.uniforms.nightVisionGain.value = this.settings.nightVisionGain;
        this.rgbShader.uniforms.nightVisionNoise.value = this.settings.nightVisionNoise;
        this.rgbShader.uniforms.crtIntensity.value = this.settings.crtIntensity;
      }

      setSize(w0, h0, dpr = 1) {
        const w = Math.max(1, Math.floor(w0 * dpr));
        const h = Math.max(1, Math.floor(h0 * dpr));
        this.sceneTarget.setSize(w, h);
        this.finalPass.setSize(w, h);
        this.finalShader.uniforms.resolution.value.set(w, h);
        this.bloomPass.setSize(w, h);

        const grW = Math.max(1, Math.round(w / 2));
        const grH = Math.max(1, Math.round(h / 2));
        this.godRaysMaskPass.setSize(grW, grH);
        this.godRaysPingPong.setSize(grW, grH);

        const anW = Math.max(1, Math.round(w / 4));
        const anH = Math.max(1, Math.round(h / 4));
        this.anamorphicBrightPass.setSize(anW, anH);
        this.anamorphicBlurPass.setSize(anW, anH);
        this.anamorphicBlurShader.uniforms.resolution.value.set(anW, anH);

        this.rgbPass.setSize(w, h);
        this.copyPass.setSize(w, h);
      }

      renderScene(scene, camera) {
        if (!this.settings.enabled) {
          this.renderer.render(scene, camera);
          return;
        }
        this.renderer.setRenderTarget(this.sceneTarget);
        this.renderer.render(scene, camera);
        this.renderer.setRenderTarget(null);
        this.render(this.sceneTarget.texture);
      }

      render(sourceTexture) {
        if (!this.settings.enabled) {
          this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
          this.copyPass.render(this.renderer, true);
          return;
        }

        this.updateSettings();

        // 1. Bloom
        this.bloomPass.source = sourceTexture;
        this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
        this.bloomPass.render(this.renderer);

        this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
        this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
        this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
        this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
        this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

        // 2. Godrays
        if (this.settings.raysEnabled && this.settings.raysStrength > 0.001) {
          this.godRaysMaskShader.uniforms.inputTexture.value = sourceTexture;
          this.godRaysMaskShader.uniforms.threshold.value = this.settings.raysThreshold;
          this.godRaysMaskPass.render(this.renderer);

          const filterLen = this.settings.raysDensity;
          const tapsPerPass = 6.0;

          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -1.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysMaskPass.texture;
          this.godRaysPingPong.render(this.renderer);

          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -2.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysPingPong.texture;
          this.godRaysPingPong.render(this.renderer);

          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -3.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysPingPong.texture;
          this.godRaysPingPong.render(this.renderer);

          this.finalPass.shader.uniforms.raysTexture.value = this.godRaysPingPong.texture;
          this.finalPass.shader.uniforms.raysEnabled.value = true;
        } else {
          this.finalPass.shader.uniforms.raysEnabled.value = false;
        }

        // 3. Anamorphic Flare
        if (this.settings.anamorphicEnabled && this.settings.anamorphicIntensity > 0.001) {
          this.anamorphicBrightShader.uniforms.inputTexture.value = sourceTexture;
          this.anamorphicBrightShader.uniforms.threshold.value = this.settings.anamorphicThreshold;
          this.anamorphicBrightShader.uniforms.smoothWidth.value = this.settings.anamorphicSmoothWidth;
          this.anamorphicBrightPass.render(this.renderer);

          this.anamorphicBlurShader.uniforms.inputTexture.value = this.anamorphicBrightPass.texture;
          this.anamorphicBlurShader.uniforms.samples.value = this.settings.anamorphicSamples;
          this.anamorphicBlurShader.uniforms.intensity.value = this.settings.anamorphicIntensity;
          this.anamorphicBlurShader.uniforms.tintColor.value.copy(this.settings.anamorphicColor);
          this.anamorphicBlurShader.uniforms.bloomRadius.value = this.settings.anamorphicRadius;
          this.anamorphicBlurPass.render(this.renderer);

          this.finalPass.shader.uniforms.anamorphicTexture.value = this.anamorphicBlurPass.texture;
          this.finalPass.shader.uniforms.anamorphicEnabled.value = true;
        } else {
          this.finalPass.shader.uniforms.anamorphicEnabled.value = false;
        }

        const randomTime = Math.random() * 100000;
        this.finalPass.shader.uniforms.time.value = randomTime;
        this.rgbPass.shader.uniforms.time.value = randomTime;

        this.finalPass.render(this.renderer);
        this.rgbPass.render(this.renderer, true);
      }

        lens.add(this.settings, "maxInputLevel", 0.5, 1.0, 0.01).name("White Level").onChange(() => this.updateSettings());

        vision.add(this.settings, "visionMode", Object.keys(VISION_MODE_MAP)).name("Vision Mode").onChange(() => this.updateSettings());

    function applyScheme(schemeName) {
      const scheme = COLOR_SCHEMES[schemeName];
      if (!scheme) return;
      params.colorScheme = schemeName;
      params.primaryColor = scheme.primary;
      params.secondaryColor = scheme.secondary;
      params.accentColor = scheme.accent;
      params.glowColor = scheme.glow;
      params.bgColor = scheme.bg;
      updateSceneColors();
    }

    // --- INITIALIZE THREE.JS ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(params.bgColor);
    const fog = new THREE.FogExp2(params.bgColor, 0.012);
    scene.fog = fog;

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 350);
    camera.position.set(0, 0, 8);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(params.dpr);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    container.appendChild(renderer.domElement);

    // --- POST PROCESSOR INITIALIZATION ---
    const postProcessor = new PostProcessor(renderer, {
      bloomStrength: 1.15,
      bloomRadius: 0.55,
      bloomThreshold: 0.28,
      chromaticAberration: 0.012,
      vignetteBoost: 1.05,
      vignetteReduction: 0.65,
      noiseIntensity: 0.012,
      raysEnabled: false,
      anamorphicEnabled: false,
      anamorphicIntensity: 1.6,
      anamorphicColor: params.glowColor
    });
    postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);

    // --- CONTROLS ---
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.enableZoom = true;
    controls.enablePan = true;
    controls.enableRotate = true;
    controls.screenSpacePanning = true;
    controls.target.set(0, 0, -25);

    function updateControlMapping() {
      if (params.leftClickMode === 'Pan (Drag Screen)') {
        controls.mouseButtons = {
          LEFT: THREE.MOUSE.PAN,
          MIDDLE: THREE.MOUSE.DOLLY,
          RIGHT: THREE.MOUSE.ROTATE
        };
      } else {
        controls.mouseButtons = {
          LEFT: THREE.MOUSE.ROTATE,
          MIDDLE: THREE.MOUSE.DOLLY,
          RIGHT: THREE.MOUSE.PAN
        };
      }
    }
    updateControlMapping();

    // --- LIGHTING ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.35);
    scene.add(ambientLight);

    const strobeLight = new THREE.PointLight(0xffffff, 0, 180);
    strobeLight.position.set(0, 0, -20);
    scene.add(strobeLight);

    const pointLight1 = new THREE.PointLight(params.primaryColor, 3.5, 55);
    const pointLight2 = new THREE.PointLight(params.secondaryColor, 3.0, 55);
    scene.add(pointLight1);
    scene.add(pointLight2);

    const tunnelGroup = new THREE.Group();
    scene.add(tunnelGroup);

    // --- DYNAMIC DISCOUNT BADGE TEXTURES (-50%, SALE, % OFF, -70%) ---
    const DISCOUNT_LABELS = ['-50%', 'SALE', '-70%', '% OFF', 'PROMO', 'DEAL', '-40%', 'SPECIAL'];
    const discountTextures = [];
    const badgeMaterials = [];

    function updateDiscountBadgeTextures(primaryHex, accentHex) {
      for (let i = 0; i < DISCOUNT_LABELS.length; i++) {
        const text = DISCOUNT_LABELS[i];
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 160;
        const ctx = canvas.getContext('2d');

        // Dark acrylic coupon plate background
        ctx.fillStyle = '#06030c';
        ctx.beginPath();
        ctx.roundRect(8, 8, 496, 144, 20);
        ctx.fill();

        // Glowing outer coupon border
        ctx.strokeStyle = primaryHex;
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.roundRect(8, 8, 496, 144, 20);
        ctx.stroke();

        // Inner dashed coupon perforated line
        ctx.strokeStyle = accentHex;
        ctx.lineWidth = 3.5;
        ctx.setLineDash([14, 8]);
        ctx.beginPath();
        ctx.roundRect(22, 22, 468, 116, 12);
        ctx.stroke();
        ctx.setLineDash([]);

        // Ticket punch notches on left & right of the badge
        ctx.fillStyle = primaryHex;
        ctx.beginPath();
        ctx.arc(10, 80, 14, 0, Math.PI * 2);
        ctx.arc(502, 80, 14, 0, Math.PI * 2);
        ctx.fill();

        // Small sub-header
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = '700 20px "Arial", sans-serif';
        ctx.fillStyle = accentHex;
        ctx.fillText('★ EXCLUSIVE DISCOUNT ★', 256, 38);

        // Bold promotional discount typography
        ctx.font = '900 68px "Impact", "Arial Black", sans-serif';

        // Neon halo glow
        ctx.shadowColor = primaryHex;
        ctx.shadowBlur = 18;
        ctx.fillStyle = '#ffffff';
        ctx.fillText(text, 256, 92);

        ctx.shadowBlur = 6;
        ctx.fillStyle = accentHex;
        ctx.fillText(text, 256, 92);
        ctx.shadowBlur = 0;

        if (discountTextures[i]) {
          discountTextures[i].image = canvas;
          discountTextures[i].needsUpdate = true;
        } else {
          const tex = new THREE.CanvasTexture(canvas);
          tex.generateMipmaps = true;
          tex.minFilter = THREE.LinearMipmapLinearFilter;
          tex.anisotropy = 8;
          discountTextures[i] = tex;
        }

        if (badgeMaterials[i]) {
          badgeMaterials[i].map = discountTextures[i];
          badgeMaterials[i].needsUpdate = true;
        } else {
          badgeMaterials[i] = new THREE.MeshBasicMaterial({
            map: discountTextures[i],
            side: THREE.DoubleSide
          });
        }
      }
    }

    updateDiscountBadgeTextures(params.primaryColor, params.accentColor);

    // --- AUTHENTIC DISCOUNT GEOMETRIES ---
    // Generates genuine coupon voucher tickets, retail price tags, and sale badges
    function createDiscountFrameShape(style, w, h, thickness, cornerR, notchR) {
      const shape = new THREE.Shape();
      const hw = w * 0.5;
      const hh = h * 0.5;
      const cr = Math.min(cornerR, hw * 0.25, hh * 0.25);
      const nr = Math.min(notchR, hh * 0.35);

      if (style === 'Retail Price Tag') {
        // Classic store discount price tag: chamfered top shoulders + grommet eyelet hole
        const ch = Math.min(hw * 0.4, hh * 0.3);
        shape.moveTo(-hw + cr, -hh);
        shape.lineTo(hw - cr, -hh);
        shape.quadraticCurveTo(hw, -hh, hw, -hh + cr);
        shape.lineTo(hw, hh - ch);
        shape.lineTo(hw - ch, hh);
        shape.lineTo(-hw + ch, hh);
        shape.lineTo(-hw, hh - ch);
        shape.lineTo(-hw, -hh + cr);
        shape.quadraticCurveTo(-hw, -hh, -hw + cr, -hh);

        // Inner cutout: cleanly placed inside without touching the top grommet header
        const hole = new THREE.Path();
        const ihw = Math.max(0.4, hw - thickness);
        const topHoleY = hh - ch * 0.85 - thickness;
        const botHoleY = -hh + thickness;
        const ihh = (topHoleY - botHoleY) * 0.5;
        const cy = (topHoleY + botHoleY) * 0.5;
        const icr = Math.min(cr, ihw * 0.2, ihh * 0.2);

        hole.moveTo(-ihw + icr, cy + ihh);
        hole.lineTo(ihw - icr, cy + ihh);
        hole.quadraticCurveTo(ihw, cy + ihh, ihw, cy + ihh - icr);
        hole.lineTo(ihw, cy - ihh + icr);
        hole.quadraticCurveTo(ihw, cy - ihh, ihw - icr, cy - ihh);
        hole.lineTo(-ihw + icr, cy - ihh);
        hole.quadraticCurveTo(-ihw, cy - ihh, -ihw, cy - ihh + icr);
        hole.lineTo(-ihw, cy + ihh - icr);
        hole.quadraticCurveTo(-ihw, cy + ihh, -ihw + icr, cy + ihh);
        shape.holes.push(hole);

        // Punch grommet hole through solid top shoulder header
        const grommet = new THREE.Path();
        const gy = hh - ch * 0.42;
        grommet.absarc(0, gy, 0.38, 0, Math.PI * 2, false);
        shape.holes.push(grommet);

      } else if (style === 'Sale Badge') {
        // 45-degree beveled octagonal promotional plaque
        const ch = Math.min(hw * 0.25, hh * 0.25);
        shape.moveTo(-hw + ch, hh);
        shape.lineTo(hw - ch, hh);
        shape.lineTo(hw, hh - ch);
        shape.lineTo(hw, -hh + ch);
        shape.lineTo(hw - ch, -hh);
        shape.lineTo(-hw + ch, -hh);
        shape.lineTo(-hw, -hh + ch);
        shape.lineTo(-hw, hh - ch);
        shape.closePath();

        const hole = new THREE.Path();
        const ihw = Math.max(0.4, hw - thickness);
        const ihh = Math.max(0.4, hh - thickness);
        const ich = Math.max(0.08, ch - thickness * 0.45);
        hole.moveTo(-ihw + ich, ihh);
        hole.lineTo(ihw - ich, ihh);
        hole.lineTo(ihw, ihh - ich);
        hole.lineTo(ihw, -ihh + ich);
        hole.lineTo(ihw - ich, -ihh);
        hole.lineTo(-ihw + ich, -ihh);
        hole.lineTo(-ihw, -ihh + ich);
        hole.lineTo(-ihw, ihh - ich);
        hole.closePath();
        shape.holes.push(hole);

      } else {
        // 'Coupon Ticket': True INWARD semicircular voucher punch notches on left and right
        shape.moveTo(-hw + cr, hh);
        shape.lineTo(hw - cr, hh);
        shape.quadraticCurveTo(hw, hh, hw, hh - cr);

        // Right ticket notch: sweeps smoothly inward into the frame
        shape.lineTo(hw, nr);
        shape.absarc(hw, 0, nr, Math.PI * 0.5, Math.PI * 1.5, false);
        shape.lineTo(hw, -hh + cr);
        shape.quadraticCurveTo(hw, -hh, hw - cr, -hh);

        shape.lineTo(-hw + cr, -hh);
        shape.quadraticCurveTo(-hw, -hh, -hw, -hh + cr);

        // Left ticket notch: sweeps smoothly inward into the frame
        shape.lineTo(-hw, -nr);
        shape.absarc(-hw, 0, nr, -Math.PI * 0.5, Math.PI * 0.5, false);
        shape.lineTo(-hw, hh - cr);
        shape.quadraticCurveTo(-hw, hh, -hw + cr, hh);

        // Inner hole: sized so it NEVER pinches or intersects with the side notches
        const hole = new THREE.Path();
        const ihw = Math.max(0.4, hw - nr - thickness * 0.55);
        const ihh = Math.max(0.4, hh - thickness);
        const icr = Math.min(cr, ihw * 0.2, ihh * 0.2);

        hole.moveTo(-ihw + icr, ihh);
        hole.lineTo(ihw - icr, ihh);
        hole.quadraticCurveTo(ihw, ihh, ihw, ihh - icr);
        hole.lineTo(ihw, -ihh + icr);
        hole.quadraticCurveTo(ihw, -ihh, ihw - icr, -ihh);
        hole.lineTo(-ihw + icr, -ihh);
        hole.quadraticCurveTo(-ihw, -ihh, -ihw, -ihh + icr);
        hole.lineTo(-ihw, ihh - icr);
        hole.quadraticCurveTo(-ihw, ihh, -ihw + icr, ihh);

        shape.holes.push(hole);
      }

      return shape;
    }

    function createDiscountFrameGeometry(style, w, h, thickness, cornerR, notchR) {
      const shape = createDiscountFrameShape(style, w, h, thickness, cornerR, notchR);
      const geom = new THREE.ExtrudeGeometry(shape, {
        depth: 0.28,
        bevelEnabled: true,
        bevelSegments: 2,
        steps: 1,
        bevelSize: 0.07,
        bevelThickness: 0.07
      });
      geom.center();
      return geom;
    }

    // Inner glowing neon contour tube (strictly linear segments to avoid Catmull-Rom bulging overshoots)
    function createInnerNeonTubeGeometry(style, w, h, thickness) {
      const hw = Math.max(0.2, (w * 0.5) - thickness * 0.85);
      const hh = Math.max(0.2, (h * 0.5) - thickness * 0.85);
      let pts = [];

      if (style === 'Retail Price Tag') {
        const ch = Math.min(hw * 0.4, hh * 0.3);
        pts = [
          new THREE.Vector3(-hw, -hh, 0),
          new THREE.Vector3(hw, -hh, 0),
          new THREE.Vector3(hw, hh - ch, 0),
          new THREE.Vector3(hw - ch, hh, 0),
          new THREE.Vector3(-hw + ch, hh, 0),
          new THREE.Vector3(-hw, hh - ch, 0)
        ];
      } else if (style === 'Sale Badge') {
        const ch = Math.min(hw * 0.25, hh * 0.25);
        pts = [
          new THREE.Vector3(-hw + ch, hh, 0),
          new THREE.Vector3(hw - ch, hh, 0),
          new THREE.Vector3(hw, hh - ch, 0),
          new THREE.Vector3(hw, -hh + ch, 0),
          new THREE.Vector3(hw - ch, -hh, 0),
          new THREE.Vector3(-hw + ch, -hh, 0),
          new THREE.Vector3(-hw, -hh + ch, 0),
          new THREE.Vector3(-hw, hh - ch, 0)
        ];
      } else {
        pts = [
          new THREE.Vector3(-hw, hh, 0),
          new THREE.Vector3(hw, hh, 0),
          new THREE.Vector3(hw, -hh, 0),
          new THREE.Vector3(-hw, -hh, 0)
        ];
      }

      const path = new THREE.CurvePath();
      for (let i = 0; i < pts.length; i++) {
        const next = pts[(i + 1) % pts.length];
        path.add(new THREE.LineCurve3(pts[i], next));
      }

      return new THREE.TubeGeometry(path, 48, 0.045, 6, true);
    }

    // Perforated tear-strip line for discount coupon (contours ticket notches cleanly with zero gap/cutting)
    function createCouponDashedBorderGeometry(style, w, h, thickness, cornerR, notchR) {
      const hw = Math.max(0.1, (w * 0.5) - thickness * 0.45);
      const hh = Math.max(0.1, (h * 0.5) - thickness * 0.45);
      const z = 0.24;
      const pts = [];

      if (style === 'Retail Price Tag') {
        const ch = Math.min(hw * 0.4, hh * 0.3);
        pts.push(
          new THREE.Vector3(-hw, -hh, z),
          new THREE.Vector3(hw, -hh, z),
          new THREE.Vector3(hw, hh - ch, z),
          new THREE.Vector3(hw - ch, hh, z),
          new THREE.Vector3(-hw + ch, hh, z),
          new THREE.Vector3(-hw, hh - ch, z),
          new THREE.Vector3(-hw, -hh, z)
        );
      } else if (style === 'Sale Badge') {
        const ch = Math.min(hw * 0.25, hh * 0.25);
        pts.push(
          new THREE.Vector3(-hw + ch, hh, z),
          new THREE.Vector3(hw - ch, hh, z),
          new THREE.Vector3(hw, hh - ch, z),
          new THREE.Vector3(hw, -hh + ch, z),
          new THREE.Vector3(hw - ch, -hh, z),
          new THREE.Vector3(-hw + ch, -hh, z),
          new THREE.Vector3(-hw, -hh + ch, z),
          new THREE.Vector3(-hw, hh - ch, z),
          new THREE.Vector3(-hw + ch, hh, z)
        );
      } else {
        // Coupon Ticket: contour the semicircular ticket notches smoothly
        const nr = Math.min(notchR * 0.72, hh * 0.28);
        pts.push(new THREE.Vector3(-hw, hh, z));
        pts.push(new THREE.Vector3(hw, hh, z));
        pts.push(new THREE.Vector3(hw, nr, z));
        // Right notch arc points
        const segs = 8;
        for (let s = 1; s <= segs; s++) {
          const theta = Math.PI * 0.5 + (s / segs) * Math.PI;
          const arcX = hw - nr + Math.cos(theta) * nr;
          const arcY = Math.sin(theta) * nr;
          pts.push(new THREE.Vector3(arcX, arcY, z));
        }
        pts.push(new THREE.Vector3(hw, -nr, z));
        pts.push(new THREE.Vector3(hw, -hh, z));
        pts.push(new THREE.Vector3(-hw, -hh, z));
        pts.push(new THREE.Vector3(-hw, -nr, z));
        // Left notch arc points
        for (let s = 1; s <= segs; s++) {
          const theta = -Math.PI * 0.5 + (s / segs) * Math.PI;
          const arcX = -hw + nr + Math.cos(theta) * nr;
          const arcY = Math.sin(theta) * nr;
          pts.push(new THREE.Vector3(arcX, arcY, z));
        }
        pts.push(new THREE.Vector3(-hw, nr, z));
        pts.push(new THREE.Vector3(-hw, hh, z));
      }

      return new THREE.BufferGeometry().setFromPoints(pts);
    }

    // Top Header Discount Badge Geometry (holding -50%, SALE, % OFF label)
    const topBadgeGeom = new THREE.PlaneGeometry(3.2, 0.95);

    // BOLD, HIGH-IMPACT 3D NEON "%" (PERCENT) DISCOUNT SYMBOL
    // Mathematically exact forward slash / with top-left and bottom-right separate rings!
    function createBold3DPercentSymbol(accentMat, glowMat) {
      const group = new THREE.Group();

      // 1. Forward slash / : slants from bottom-left to top-right
      const slashAngle = -Math.PI * 0.27; // -48.6 degrees clockwise in Three.js

      // Outer glowing neon glass bar
      const barGeom = new THREE.CapsuleGeometry(0.13, 2.2, 12, 24);
      const barMesh = new THREE.Mesh(barGeom, accentMat);
      barMesh.rotation.z = slashAngle;
      group.add(barMesh);

      // Inner intense neon plasma core
      const coreBarGeom = new THREE.CapsuleGeometry(0.045, 2.2, 8, 16);
      const coreBarMesh = new THREE.Mesh(coreBarGeom, glowMat);
      coreBarMesh.rotation.z = slashAngle;
      group.add(coreBarMesh);

      // 2. Top-Left Circle (Upper-Left Quadrant Q2: x < 0, y > 0)
      const ringGeom = new THREE.TorusGeometry(0.38, 0.13, 16, 32);
      const coreRingGeom = new THREE.TorusGeometry(0.38, 0.045, 10, 24);

      const ring1Group = new THREE.Group();
      ring1Group.position.set(-0.78, 0.65, 0);
      const ring1 = new THREE.Mesh(ringGeom, accentMat);
      const ring1Core = new THREE.Mesh(coreRingGeom, glowMat);
      ring1Group.add(ring1);
      ring1Group.add(ring1Core);
      group.add(ring1Group);

      // 3. Bottom-Right Circle (Lower-Right Quadrant Q4: x > 0, y < 0)
      const ring2Group = new THREE.Group();
      ring2Group.position.set(0.78, -0.65, 0);
      const ring2 = new THREE.Mesh(ringGeom, accentMat);
      const ring2Core = new THREE.Mesh(coreRingGeom, glowMat);
      ring2Group.add(ring2);
      ring2Group.add(ring2Core);
      group.add(ring2Group);

      // 4. Outer glowing retail discount seal ring
      const haloGeom = new THREE.TorusGeometry(1.65, 0.03, 8, 36);
      const halo = new THREE.Mesh(haloGeom, accentMat);
      group.add(halo);

      return group;
    }

    // Helper to position % badge based on percentPlacement mode
    function updatePercentBadgeTransform(unit, i) {
      if (!unit || !unit.percentBadge) return;
      const hw = params.frameWidth * 0.5;
      const hh = params.frameHeight * 0.5;

      if (params.percentPlacement === 'Top Header Emblem') {
        // Mounted cleanly above the frame on top-right shoulder (zero overlap into aperture)
        unit.percentBadge.position.set(hw - 0.4, hh + 0.55, 0.26);
        unit.percentBadge.scale.set(0.46, 0.46, 0.46);
        unit.percentBadge.visible = params.showBadges;
      } else if (params.percentPlacement === 'Center Portal') {
        // Floating inside center of frame aperture
        unit.percentBadge.position.set(0, 0, 0);
        unit.percentBadge.scale.set(0.78, 0.78, 0.78);
        unit.percentBadge.visible = params.showBadges;
      } else if (params.percentPlacement === 'None (Frames Only)') {
        unit.percentBadge.visible = false;
      } else {
        // 'Flanking Sides' (Default: giant neon billboards outside the tunnel, zero frame overlap)
        const side = (i % 2 === 0) ? 1 : -1;
        unit.percentBadge.position.set(side * (hw + 2.0), Math.sin(i * 0.4) * 0.7, 0);
        unit.percentBadge.scale.set(0.95, 0.95, 0.95);
        unit.percentBadge.visible = params.showBadges;
      }
    }

    // --- TUNNEL FRAMES SETUP ---
    const TOTAL_FRAMES = 42;
    const FRAME_SPACING = 5.2;
    const TUNNEL_LENGTH = TOTAL_FRAMES * FRAME_SPACING;

    let frameGeometry = null;
    let neonTubeGeometry = null;
    let dashedBorderGeometry = null;

    const frameMaterial = new THREE.MeshStandardMaterial({
      color: new THREE.Color(params.primaryColor),
      emissive: new THREE.Color(params.primaryColor),
      emissiveIntensity: params.frameGlow,
      roughness: 0.22,
      metalness: 0.85
    });

    const neonCoreMaterial = new THREE.MeshBasicMaterial({
      color: new THREE.Color(params.glowColor)
    });

    const dashedLineMaterial = new THREE.LineDashedMaterial({
      color: new THREE.Color(params.accentColor),
      dashSize: 0.5,
      gapSize: 0.25,
      scale: 1
    });

    const cornerTagMaterial = new THREE.MeshStandardMaterial({
      color: new THREE.Color(params.secondaryColor),
      emissive: new THREE.Color(params.secondaryColor),
      emissiveIntensity: params.frameGlow * 1.3,
      roughness: 0.25,
      metalness: 0.75
    });

    const badgeMatAccent = new THREE.MeshStandardMaterial({
      color: new THREE.Color(params.accentColor),
      emissive: new THREE.Color(params.accentColor),
      emissiveIntensity: params.frameGlow * 1.1,
      roughness: 0.2,
      metalness: 0.8
    });

    const badgeMatGlow = new THREE.MeshStandardMaterial({
      color: new THREE.Color(params.glowColor),
      emissive: new THREE.Color(params.glowColor),
      emissiveIntensity: params.frameGlow * 1.3,
      roughness: 0.15,
      metalness: 0.9
    });

    const frameUnits = [];

    function rebuildFrameGeometries() {
      if (frameGeometry) frameGeometry.dispose();
      if (neonTubeGeometry) neonTubeGeometry.dispose();
      if (dashedBorderGeometry) dashedBorderGeometry.dispose();

      frameGeometry = createDiscountFrameGeometry(
        params.frameStyle,
        params.frameWidth,
        params.frameHeight,
        params.frameThickness,
        params.cornerRadius,
        params.notchRadius
      );
      neonTubeGeometry = createInnerNeonTubeGeometry(
        params.frameStyle,
        params.frameWidth,
        params.frameHeight,
        params.frameThickness
      );
      dashedBorderGeometry = createCouponDashedBorderGeometry(
        params.frameStyle,
        params.frameWidth,
        params.frameHeight,
        params.frameThickness,
        params.cornerRadius,
        params.notchRadius
      );

      for (let i = 0; i < frameUnits.length; i++) {
        const unit = frameUnits[i];
        unit.frameMesh.geometry = frameGeometry;
        unit.neonTubeMesh.geometry = neonTubeGeometry;
        unit.dashedLine.geometry = dashedBorderGeometry;
        unit.dashedLine.computeLineDistances();

        if (unit.topBadge) {
          unit.topBadge.position.set(
            0,
            params.frameHeight * 0.5 + 0.48,
            0.24
          );
        }

        updatePercentBadgeTransform(unit, i);
      }
    }

    function initTunnelFrames() {
      while (tunnelGroup.children.length > 0) {
        tunnelGroup.remove(tunnelGroup.children[0]);
      }
      frameUnits.length = 0;

      frameGeometry = createDiscountFrameGeometry(
        params.frameStyle,
        params.frameWidth,
        params.frameHeight,
        params.frameThickness,
        params.cornerRadius,
        params.notchRadius
      );
      neonTubeGeometry = createInnerNeonTubeGeometry(
        params.frameStyle,
        params.frameWidth,
        params.frameHeight,
        params.frameThickness
      );
      dashedBorderGeometry = createCouponDashedBorderGeometry(
        params.frameStyle,
        params.frameWidth,
        params.frameHeight,
        params.frameThickness,
        params.cornerRadius,
        params.notchRadius
      );

      for (let i = 0; i < TOTAL_FRAMES; i++) {
        const unitGroup = new THREE.Group();

        const frameMesh = new THREE.Mesh(frameGeometry, frameMaterial);
        unitGroup.add(frameMesh);

        const neonTubeMesh = new THREE.Mesh(neonTubeGeometry, neonCoreMaterial);
        unitGroup.add(neonTubeMesh);

        const dashedLine = new THREE.Line(dashedBorderGeometry, dashedLineMaterial);
        dashedLine.computeLineDistances();
        unitGroup.add(dashedLine);

        const topBadge = new THREE.Mesh(topBadgeGeom, badgeMaterials[i % badgeMaterials.length]);
        topBadge.position.set(
          0,
          params.frameHeight * 0.5 + 0.48,
          0.24
        );
        unitGroup.add(topBadge);

        const percentBadge = createBold3DPercentSymbol(badgeMatAccent, badgeMatGlow);
        unitGroup.add(percentBadge);

        const baseZ = 12 - i * FRAME_SPACING;
        unitGroup.position.set(0, 0, baseZ);
        unitGroup.rotation.z = i * params.twist;

        tunnelGroup.add(unitGroup);

        const unitObj = {
          group: unitGroup,
          frameMesh,
          neonTubeMesh,
          dashedLine,
          topBadge,
          percentBadge,
          index: i,
          baseZ
        };

        updatePercentBadgeTransform(unitObj, i);
        frameUnits.push(unitObj);
      }
    }

    initTunnelFrames();

    // --- PROMO PARTICLES ---
    function createParticleTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 64;
      canvas.height = 64;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
      grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
      grad.addColorStop(0.35, 'rgba(255, 255, 255, 0.85)');
      grad.addColorStop(0.7, 'rgba(255, 255, 255, 0.25)');
      grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 64, 64);
      return new THREE.CanvasTexture(canvas);
    }

    const particleTexture = createParticleTexture();
    const PARTICLE_COUNT = 380;
    const particleGeo = new THREE.BufferGeometry();
    const particlePositions = new Float32Array(PARTICLE_COUNT * 3);
    const particleColors = new Float32Array(PARTICLE_COUNT * 3);

    const c1 = new THREE.Color(params.primaryColor);
    const c2 = new THREE.Color(params.secondaryColor);
    const c3 = new THREE.Color(params.accentColor);

    for (let i = 0; i < PARTICLE_COUNT; i++) {
      particlePositions[i * 3 + 0] = (Math.random() - 0.5) * 24;
      particlePositions[i * 3 + 1] = (Math.random() - 0.5) * 16;
      particlePositions[i * 3 + 2] = -Math.random() * TUNNEL_LENGTH + 12;

      const mixC = Math.random() < 0.4 ? c1 : (Math.random() < 0.7 ? c2 : c3);
      particleColors[i * 3 + 0] = mixC.r;
      particleColors[i * 3 + 1] = mixC.g;
      particleColors[i * 3 + 2] = mixC.b;
    }

    particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
    particleGeo.setAttribute('color', new THREE.BufferAttribute(particleColors, 3));

    const particleMat = new THREE.PointsMaterial({
      size: 0.65,
      map: particleTexture,
      transparent: true,
      blending: THREE.AdditiveBlending,
      vertexColors: true,
      depthWrite: false
    });

    const particleSystem = new THREE.Points(particleGeo, particleMat);
    tunnelGroup.add(particleSystem);

    function updateParticleColors() {
      const colArr = particleGeo.attributes.color.array;
      const pc1 = new THREE.Color(params.primaryColor);
      const pc2 = new THREE.Color(params.secondaryColor);
      const pc3 = new THREE.Color(params.accentColor);
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const mc = Math.random() < 0.4 ? pc1 : (Math.random() < 0.7 ? pc2 : pc3);
        colArr[i * 3 + 0] = mc.r;
        colArr[i * 3 + 1] = mc.g;
        colArr[i * 3 + 2] = mc.b;
      }
      particleGeo.attributes.color.needsUpdate = true;
    }

    function updateSceneColors() {
      const currentBg = params.greenscreen ? '#00ff00' : params.bgColor;
      scene.background.set(currentBg);
      renderer.setClearColor(currentBg, 1);

      if (params.greenscreen) {
        scene.fog = null;
      } else {
        scene.fog = fog;
        fog.color.set(params.bgColor);
      }

      frameMaterial.color.set(params.primaryColor);
      frameMaterial.emissive.set(params.primaryColor);
      frameMaterial.emissiveIntensity = params.frameGlow;

      neonCoreMaterial.color.set(params.glowColor);
      dashedLineMaterial.color.set(params.accentColor);

      cornerTagMaterial.color.set(params.secondaryColor);
      cornerTagMaterial.emissive.set(params.secondaryColor);
      cornerTagMaterial.emissiveIntensity = params.frameGlow * 1.25;

      badgeMatAccent.color.set(params.accentColor);
      badgeMatAccent.emissive.set(params.accentColor);
      badgeMatAccent.emissiveIntensity = params.frameGlow;

      badgeMatGlow.color.set(params.glowColor);

      pointLight1.color.set(params.primaryColor);
      pointLight2.color.set(params.secondaryColor);

      updateParticleColors();
      updateDiscountBadgeTextures(params.primaryColor, params.accentColor);
    }

    applyScheme(params.colorScheme);

    // --- PROCEDURAL RANDOMIZER (WITHOUT TOUCHING POST-PROCESSING) ---
    function randomizeScene() {
      // 1. Random color scheme
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      applyScheme(randomScheme);

      // 2. Random animation preset
      const randomAnim = ANIMATION_PRESETS[Math.floor(Math.random() * ANIMATION_PRESETS.length)];
      params.animationPreset = randomAnim;

      // 3. Re-roll geometric & discount style parameters
      params.frameStyle = ['Coupon Ticket', 'Retail Price Tag', 'Sale Badge'][Math.floor(Math.random() * 3)];
      params.percentPlacement = ['Flanking Sides', 'Top Header Emblem', 'Center Portal'][Math.floor(Math.random() * 3)];
      params.frameWidth = parseFloat((8.5 + Math.random() * 3.5).toFixed(1));
      params.frameHeight = parseFloat((5.4 + Math.random() * 2.6).toFixed(1));
      params.frameThickness = parseFloat((0.45 + Math.random() * 0.4).toFixed(2));
      params.cornerRadius = parseFloat((0.3 + Math.random() * 0.6).toFixed(2));
      params.notchRadius = parseFloat((0.45 + Math.random() * 0.4).toFixed(2));
      params.twist = parseFloat(((Math.random() - 0.5) * 0.05).toFixed(3));

      // 4. Re-roll motion & promo parameters (NOT touching postprocessing!)
      params.speed = parseFloat((0.6 + Math.random() * 1.5).toFixed(2));
      params.flashIntensity = parseFloat((1.0 + Math.random() * 1.8).toFixed(2));
      params.flashFrequency = parseFloat((1.2 + Math.random() * 2.0).toFixed(2));
      params.frameGlow = parseFloat((1.2 + Math.random() * 1.5).toFixed(2));

      // 5. Rebuild geometries & materials
      rebuildFrameGeometries();
      updateSceneColors();

      // 6. Trigger immediate promo flash impact
      triggerInstantFlash();

      // 7. Update GUI display controllers for scene parameters only
      if (gui) {
        fColor.controllersRecursive().forEach(c => c.updateDisplay());
        fMotion.controllersRecursive().forEach(c => c.updateDisplay());
        fGeom.controllersRecursive().forEach(c => c.updateDisplay());
        fPromo.controllersRecursive().forEach(c => c.updateDisplay());
      }
    }

    let flashTimer = 0;
    let flashProgress = 1.0;

    function triggerInstantFlash() {
      flashProgress = 0.0;
    }

    // --- ANIMATION LOOP ---
    let clock = new THREE.Clock();
    let tunnelProgress = 0;

    function animate() {
      requestAnimationFrame(animate);

      const delta = Math.min(clock.getDelta(), 0.1);
      const time = clock.getElapsedTime();

      let currentFlightSpeed = params.speed * 11.0;
      let isStatic = false;

      if (params.animationPreset === 'Static (No Camera Motion)') {
        currentFlightSpeed = 0;
        isStatic = true;
      } else if (params.animationPreset === 'Reverse Glide') {
        currentFlightSpeed = -params.speed * 10.0;
      } else if (params.animationPreset === 'Energetic Flash Promo') {
        currentFlightSpeed = params.speed * 15.0;
      } else if (params.animationPreset === 'Breathing Float') {
        currentFlightSpeed = params.speed * 6.5;
      }

      if (!isStatic) {
        tunnelProgress += delta * currentFlightSpeed;
      }

      const flashInterval = params.animationPreset === 'Energetic Flash Promo'
        ? params.flashFrequency * 0.6
        : params.flashFrequency;

      flashTimer += delta;
      if (flashTimer >= flashInterval) {
        flashTimer = 0;
        flashProgress = 0.0;
      }

      if (flashProgress < 1.0) {
        flashProgress += delta * 2.2;
      }

      const flashWave = Math.min(1.0, flashProgress);
      const flashDecay = Math.exp(-flashWave * 5.0);
      const flashSpike = flashDecay * params.flashIntensity;

      strobeLight.intensity = flashSpike * 18.0;

      pointLight1.position.set(
        Math.sin(time * 1.5) * (params.frameWidth * 0.35),
        Math.cos(time * 1.2) * (params.frameHeight * 0.35),
        -15 + Math.sin(time * 0.8) * 12
      );
      pointLight2.position.set(
        -Math.sin(time * 1.3) * (params.frameWidth * 0.35),
        -Math.cos(time * 1.7) * (params.frameHeight * 0.35),
        -35 + Math.cos(time * 0.9) * 15
      );

      const waveZ = THREE.MathUtils.lerp(12, -TUNNEL_LENGTH + 12, flashWave);

      for (let i = 0; i < TOTAL_FRAMES; i++) {
        const unit = frameUnits[i];

        let z = ((unit.baseZ + tunnelProgress) % TUNNEL_LENGTH);
        if (z > 14) z -= TUNNEL_LENGTH;
        if (z < -TUNNEL_LENGTH + 14) z += TUNNEL_LENGTH;

        unit.group.position.z = z;
        unit.group.rotation.z = i * params.twist;

        if (params.animationPreset === 'Slow Cosmic Spiral') {
          unit.group.rotation.z += time * 0.25 * params.speed;
        } else if (params.animationPreset === 'Undulating Waves') {
          unit.group.position.y = Math.sin(time * 2.2 + i * 0.35) * 1.2;
          unit.group.position.x = Math.cos(time * 1.8 + i * 0.3) * 0.9;
        } else if (params.animationPreset === 'Gentle Sine Sway') {
          unit.group.position.x = Math.sin(time * 0.8) * 1.1;
          unit.group.position.y = Math.cos(time * 0.6) * 0.7;
        } else if (params.animationPreset === 'Breathing Float') {
          unit.group.position.y = Math.sin(time * 0.5 + i * 0.1) * 0.5;
          unit.group.rotation.z += Math.sin(time * 0.4) * 0.05;
        } else {
          unit.group.position.x = 0;
          unit.group.position.y = 0;
        }

        const distToWave = Math.abs(z - waveZ);
        let frameFlashFactor = 0;
        if (distToWave < 24.0) {
          frameFlashFactor = (1.0 - distToWave / 24.0) * flashSpike;
        }

        const scale = 1.0 + frameFlashFactor * 0.08;
        unit.group.scale.set(scale, scale, 1.0);

        // Animate 3D "%" percent badges
        if (unit.percentBadge && unit.percentBadge.visible) {
          if (params.percentPlacement === 'Center Portal') {
            unit.percentBadge.rotation.z = time * 0.4 + i * 0.15;
            unit.percentBadge.rotation.y = Math.sin(time * 1.1 + i) * 0.25;
          } else if (params.percentPlacement === 'Top Header Emblem') {
            unit.percentBadge.rotation.z = 0;
            unit.percentBadge.rotation.y = Math.sin(time * 1.6 + i * 0.4) * 0.2;
            unit.percentBadge.rotation.x = Math.cos(time * 1.2 + i * 0.4) * 0.1;
          } else {
            // Flanking Sides: face gently towards camera with floating motion
            unit.percentBadge.rotation.z = Math.sin(time * 0.8 + i * 0.25) * 0.12;
            unit.percentBadge.rotation.y = Math.sin(time * 1.2 + i * 0.25) * 0.3;
          }
        }

        // Top discount badge (-50%, SALE...) visibility
        if (unit.topBadge) {
          unit.topBadge.visible = params.showBadges;
        }
      }

      frameMaterial.emissiveIntensity = params.frameGlow * (1.0 + flashSpike * 1.2);
      cornerTagMaterial.emissiveIntensity = params.frameGlow * 1.25 * (1.0 + flashSpike * 1.4);

      particleSystem.visible = params.showParticles;
      if (params.showParticles) {
        const positions = particleGeo.attributes.position.array;
        for (let i = 0; i < PARTICLE_COUNT; i++) {
          if (!isStatic) {
            positions[i * 3 + 2] += delta * currentFlightSpeed * 0.6;
            if (positions[i * 3 + 2] > 14) {
              positions[i * 3 + 2] -= TUNNEL_LENGTH;
            } else if (positions[i * 3 + 2] < -TUNNEL_LENGTH + 14) {
              positions[i * 3 + 2] += TUNNEL_LENGTH;
            }
          }
        }
        particleGeo.attributes.position.needsUpdate = true;
      }

      controls.update();
      postProcessor.renderScene(scene, camera);
    }

    animate();

    // --- WINDOW RESIZE HANDLER ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(params.dpr);
      postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);
    });

    // --- LIL-GUI SETUP ---
    const gui = new GUI({ title: 'Neon Discount Tunnel' });

    // 1. Color Schemes & Greenscreen
    const fColor = gui.addFolder('Color & Themes');
    fColor.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES))
      .name('Scheme Preset')
      .onChange((val) => {
        applyScheme(val);
        fColor.controllersRecursive().forEach(c => c.updateDisplay());
      });

    fColor.add(params, 'greenscreen')
      .name('Greenscreen (#00ff00)')
      .onChange(() => {
        updateSceneColors();
      });

    fColor.addColor(params, 'primaryColor')
      .name('Primary Color')
      .onChange(() => updateSceneColors());

    fColor.addColor(params, 'secondaryColor')
      .name('Secondary Color')
      .onChange(() => updateSceneColors());

    fColor.addColor(params, 'accentColor')
      .name('Accent Color')
      .onChange(() => updateSceneColors());

    fColor.addColor(params, 'glowColor')
      .name('Glow Core Color')
      .onChange(() => {
        updateSceneColors();
        postProcessor.settings.anamorphicColor.set(params.glowColor);
        postProcessor.settings.anamorphicColorHex = params.glowColor;
        postProcessor.updateSettings();
      });

    fColor.addColor(params, 'bgColor')
      .name('Background Color')
      .onChange(() => updateSceneColors());

    // 2. Motion & Animations
    const fMotion = gui.addFolder('Animation');
    fMotion.add(params, 'animationPreset', ANIMATION_PRESETS)
      .name('Animation Mode');

    fMotion.add(params, 'speed', 0.0, 3.0, 0.05)
      .name('Animation Speed');

    fMotion.add(params, 'twist', -0.08, 0.08, 0.005)
      .name('Tunnel Twist');

    // 3. Frame Geometry
    const fGeom = gui.addFolder('Frame Geometry');
    fGeom.add(params, 'frameStyle', ['Coupon Ticket', 'Retail Price Tag', 'Sale Badge'])
      .name('Discount Style')
      .onChange(() => rebuildFrameGeometries());

    fGeom.add(params, 'frameWidth', 6.0, 15.0, 0.2)
      .name('Frame Width')
      .onChange(() => rebuildFrameGeometries());

    fGeom.add(params, 'frameHeight', 4.0, 10.0, 0.2)
      .name('Frame Height')
      .onChange(() => rebuildFrameGeometries());

    fGeom.add(params, 'frameThickness', 0.3, 1.2, 0.05)
      .name('Border Thickness')
      .onChange(() => rebuildFrameGeometries());

    fGeom.add(params, 'cornerRadius', 0.1, 1.2, 0.05)
      .name('Corner Radius')
      .onChange(() => rebuildFrameGeometries());

    fGeom.add(params, 'notchRadius', 0.2, 1.2, 0.05)
      .name('Ticket Notch Radius')
      .onChange(() => rebuildFrameGeometries());

    // 4. Promo Flashes & Glow
    const fPromo = gui.addFolder('Promo Strobe & Effects');
    fPromo.add(params, 'flashIntensity', 0.0, 3.5, 0.1)
      .name('Flash Intensity');

    fPromo.add(params, 'flashFrequency', 0.5, 4.0, 0.1)
      .name('Flash Interval (s)');

    fPromo.add(params, 'frameGlow', 0.2, 3.0, 0.1)
      .name('Frame Glow')
      .onChange(() => updateSceneColors());

    fPromo.add(params, 'percentPlacement', ['Flanking Sides', 'Top Header Emblem', 'Center Portal', 'None (Frames Only)'])
      .name('% Placement Mode')
      .onChange(() => {
        for (let i = 0; i < frameUnits.length; i++) {
          updatePercentBadgeTransform(frameUnits[i], i);
        }
      });

    fPromo.add(params, 'showBadges')
      .name('Show Discount Signs (%)');

    fPromo.add(params, 'showParticles')
      .name('Show Promo Sparks');

    // 5. Visuals & DPR
    const fRender = gui.addFolder('Rendering & DPR');
    fRender.add(params, 'dpr', 0.5, 3.0, 0.1)
      .name('Pixel Ratio (DPR)')
      .onChange((val) => {
        renderer.setPixelRatio(val);
        postProcessor.setSize(window.innerWidth, window.innerHeight, val);
      });

    // 6. Post-Processing Suite Integration
    postProcessor.attachGUI(gui, 'Post-Processing Suite');

    // 7. Interaction & Procedural Randomization
    const fInteract = gui.addFolder('Interaction');
    fInteract.add(params, 'clickRandomize')
      .name('Click to Randomize');

    fInteract.add(params, 'leftClickMode', ['Rotate (Orbit)', 'Pan (Drag Screen)'])
      .name('Left Mouse Drag')
      .onChange(() => updateControlMapping());

    fInteract.add({ randomize: () => randomizeScene() }, 'randomize')
      .name('🎲 Randomize Scene');

    fColor.open();
    fMotion.open();

    // --- HIDE/SHOW UI WITH "H" KEY ---
    let isGuiVisible = true;
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        isGuiVisible = !isGuiVisible;
        if (isGuiVisible) {
          gui.show();
          gui.domElement.style.display = '';
        } else {
          gui.hide();
          gui.domElement.style.display = 'none';
        }
      }
    });

    // --- CLICK ON SCENE TO RANDOMIZE ---
    let pointerStartX = 0;
    let pointerStartY = 0;
    let pointerStartTime = 0;

    window.addEventListener('pointerdown', (e) => {
      if (gui.domElement.contains(e.target)) return;
      pointerStartX = e.clientX;
      pointerStartY = e.clientY;
      pointerStartTime = performance.now();
    });

    window.addEventListener('pointerup', (e) => {
      if (gui.domElement.contains(e.target)) return;
      const moveDist = Math.hypot(e.clientX - pointerStartX, e.clientY - pointerStartY);
      const pressDuration = performance.now() - pointerStartTime;

      if (moveDist < 6 && pressDuration < 350) {
        if (params.clickRandomize) {
          randomizeScene();
        }
      }
    });
  </script>
</body>
</html>
