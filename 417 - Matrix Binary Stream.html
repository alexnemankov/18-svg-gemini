<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Matrix Binary Stream Loop - Three.js</title>

  <!-- Import Map for Three.js, OrbitControls, and lil-gui -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
      }
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #020803;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      cursor: grab;
    }
    #canvas-container:active {
      cursor: grabbing;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import GUI from 'lil-gui';

    // =========================================================================
    // POST PROCESSOR SUITE (Three.js Shader Post-Processing Pipeline)
    // Direct modular implementation of postprocessing/PostProcessor.js
    // =========================================================================
    const orthoVertexShader = `
      precision highp float;
      in vec3 position;
      out vec2 vUv;
      void main() {
        vUv = position.xy * 0.5 + 0.5;
        gl_Position = vec4(position, 1.0);
      }
    `;

    const brightFragmentShader = `
      precision highp float;
      uniform sampler2D inputTexture;
      uniform float bloomThreshold;
      in vec2 vUv;
      out vec4 fragColor;

      void main() {
        vec4 color = texture(inputTexture, vUv);
        float luminance = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
        float knee = 0.1;
        float soft = luminance - bloomThreshold + knee;
        soft = clamp(soft, 0.0, 2.0 * knee);
        soft = (soft * soft) / (4.0 * knee + 0.00001);
        float contribution = max(soft, luminance - bloomThreshold);
        contribution /= max(luminance, 0.00001);
        fragColor = vec4(color.rgb * contribution, color.a);
      }
    `;

    const blur13ShaderChunk = `
      vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
        vec2 resolution = vec2(textureSize(image, 0));
        vec4 color = vec4(0.0);
        vec2 off1 = vec2(1.411764705882353) * direction;
        vec2 off2 = vec2(3.2941176470588234) * direction;
        vec2 off3 = vec2(5.176470588235294) * direction;
        color += texture(image, uv) * 0.1964825501511404;
        color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
        color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
        color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
        color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
        color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
        color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
        return color;
      }
    `;

    const blurFragmentShader = `
      precision highp float;
      uniform sampler2D inputTexture;
      uniform vec2 direction;
      in vec2 vUv;
      out vec4 color;
      ${blur13ShaderChunk}
      void main() {
        color = blur13(inputTexture, vUv, direction);
      }
    `;

    const godRaysDepthMaskShader = `
      precision highp float;
      uniform sampler2D inputTexture;
      uniform float threshold;
      in vec2 vUv;
      out vec4 fragColor;

      void main() {
        vec4 color = texture(inputTexture, vUv);
        float lum = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
        float factor = smoothstep(threshold, threshold + 0.15, lum);
        fragColor = vec4(vec3(factor), 1.0);
      }
    `;

    const godRaysGenerateShader = `
      precision highp float;
      #define TAPS_PER_PASS 6.0

      uniform sampler2D inputTexture;
      uniform vec3 vSunPositionScreenSpace;
      uniform float fStepSize;
      uniform float distanceAttenuation;
      uniform float maxDensity;
      in vec2 vUv;
      out vec4 fragColor;

      void main() {
        vec2 delta = vSunPositionScreenSpace.xy - vUv;
        float dist = length(delta);
        vec2 stepv = fStepSize * delta / max(dist, 0.0001);
        float iters = dist / max(fStepSize, 0.00001);

        vec2 uv = vUv;
        float col = 0.0;
        float f = min(1.0, max(vSunPositionScreenSpace.z, 0.0));

        float atten = 1.0 / (1.0 + pow(dist, distanceAttenuation));

        if (0.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
        uv += stepv;
        if (1.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
        uv += stepv;
        if (2.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
        uv += stepv;
        if (3.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
        uv += stepv;
        if (4.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
        uv += stepv;
        if (5.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;

        float finalVal = min(col / TAPS_PER_PASS * atten, maxDensity);
        fragColor = vec4(vec3(finalVal), 1.0);
      }
    `;

    const anamorphicBrightShader = `
      precision highp float;
      uniform sampler2D inputTexture;
      uniform float threshold;
      uniform float smoothWidth;
      in vec2 vUv;
      out vec4 fragColor;

      void main() {
        vec4 color = texture(inputTexture, vUv);
        float v = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
        float alpha = smoothstep(threshold, threshold + smoothWidth, v);
        fragColor = mix(vec4(0.0), color, alpha);
      }
    `;

    const anamorphicBlurShader = `
      precision highp float;
      uniform sampler2D inputTexture;
      uniform vec2 resolution;
      uniform float samples;
      uniform float intensity;
      uniform vec3 tintColor;
      uniform float bloomRadius;
      in vec2 vUv;
      out vec4 fragColor;

      void main() {
        int halfSamples = max(1, int(samples) / 2);
        float fHalfSamples = float(halfSamples);
        vec2 invSize = 1.0 / resolution;
        vec4 total = vec4(0.0);

        for (int i = -64; i <= 64; i++) {
          if (i < -halfSamples || i > halfSamples) continue;
          float softness = 1.0 - abs(float(i)) / fHalfSamples;
          softness = pow(softness, 2.0);
          vec2 shiftedUV = vec2(vUv.x + invSize.x * float(i) * (4.0 + bloomRadius * 8.0), vUv.y);
          shiftedUV = clamp(shiftedUV, 0.001, 0.999);
          total += texture(inputTexture, shiftedUV) * softness;
        }

        fragColor = (total / (samples / 3.0)) * vec4(tintColor, 1.0) * intensity;
      }
    `;

    const finalFragmentShader = `
      precision highp float;
      uniform vec2 resolution;
      uniform sampler2D inputTexture;
      uniform sampler2D blur0Texture;
      uniform sampler2D blur1Texture;
      uniform sampler2D blur2Texture;
      uniform sampler2D blur3Texture;
      uniform sampler2D blur4Texture;
      uniform sampler2D raysTexture;
      uniform sampler2D anamorphicTexture;
      uniform bool bloomEnabled;
      uniform float bloomStrength;
      uniform bool raysEnabled;
      uniform float raysStrength;
      uniform vec3 raysColor;
      uniform bool anamorphicEnabled;
      uniform float vignetteBoost;
      uniform float vignetteReduction;
      uniform float noiseIntensity;
      uniform float time;
      in vec2 vUv;
      out vec4 fragColor;

      float vignette(vec2 uv, float boost, float reduction) {
        vec2 position = vUv - 0.5;
        return boost - length(position) * reduction;
      }

      float hash1(uint n) {
        n = (n << 13U) ^ n;
        n = n * (n * n * 15731U + 789221U) + 1376312589U;
        return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
      }

      float noise(in vec2 uv, in float timeVal) {
        uvec2 p = uvec2(uv);
        return hash1(p.x + 1920U * p.y + (1920U * 1080U) * uint(timeVal));
      }

      void main() {
        vec4 color = texture(inputTexture, vUv);

        if (bloomEnabled && bloomStrength > 0.001) {
          vec4 b0 = texture(blur0Texture, vUv);
          vec4 b1 = texture(blur1Texture, vUv);
          vec4 b2 = texture(blur2Texture, vUv);
          vec4 b3 = texture(blur3Texture, vUv);
          vec4 b4 = texture(blur4Texture, vUv);

          vec4 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
          color += bloomSum * bloomStrength;
        }

        if (raysEnabled && raysStrength > 0.001) {
          vec4 r = texture(raysTexture, vUv);
          color.rgb += r.rgb * raysColor * raysStrength;
        }

        if (anamorphicEnabled) {
          vec4 a = texture(anamorphicTexture, vUv);
          color.rgb += a.rgb;
        }

        color.rgb *= vignette(vUv, vignetteBoost, vignetteReduction);
        color.rgb += noiseIntensity * noise(gl_FragCoord.xy, time);
        fragColor = vec4(color.rgb, 1.0);
      }
    `;

    const chromaticAberrationShaderChunk = `
      vec2 barrelDistortion(vec2 coord, float amt) {
        vec2 cc = coord - 0.5;
        float dist = dot(cc, cc);
        return coord + cc * dist * amt;
      }
      float sat(float t) { return clamp(t, 0.0, 1.0); }
      float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
      float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
      vec4 spectrum_offset(float t) {
        float lo = step(t, 0.5);
        float hi = 1.0 - lo;
        float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
        vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
        return pow(ret, vec4(1.0 / 2.2));
      }
      const float max_distort = 2.2;
      const int num_iter = 8;
      const float reci_num_iter_f = 1.0 / float(num_iter);
      vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
        vec4 sumcol = vec4(0.0);
        vec4 sumw = vec4(0.0);
        for (int i = 0; i < num_iter; ++i) {
          float t = float(i) * reci_num_iter_f;
          vec4 w = spectrum_offset(t);
          sumw += w;
          sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
        }
        return sumcol / sumw;
      }
    `;

    const colorFragmentShader = `
      precision highp float;
      uniform sampler2D inputTexture;
      uniform float chromaticAberrationAmount;
      uniform float minInputLevel;
      uniform float maxInputLevel;
      uniform float gammaLevel;
      uniform float exposure;
      uniform float fisheyeStrength;
      uniform float fisheyeRadius;
      uniform float time;
      uniform int visionMode;
      uniform float thermalSensitivity;
      uniform float nightVisionNoise;
      uniform float nightVisionGain;
      uniform float crtIntensity;
      in vec2 vUv;
      out vec4 fragColor;

      ${chromaticAberrationShaderChunk}

      vec2 applyFisheye(vec2 uv, float strength, float radius) {
        if (abs(strength) < 0.0001) return uv;
        vec2 p = uv - 0.5;
        float d = length(p);
        if (d > radius * 1.5) return uv;
        float r = d / max(radius, 0.001);
        float theta = atan(p.y, p.x);
        float rDist = r + strength * (r * r * r);
        return 0.5 + vec2(cos(theta), sin(theta)) * (rDist * radius);
      }

      vec3 ACESFilmicToneMapping(vec3 color) {
        float a = 2.51;
        float b = 0.03;
        float c = 2.43;
        float d = 0.59;
        float e = 0.14;
        return clamp((color * (a * color + b)) / (color * (c * color + d) + e), 0.0, 1.0);
      }

      vec3 gammaCorrect(vec3 color, vec3 gamma) {
        return pow(max(color, vec3(0.0)), 1.0 / gamma);
      }
      vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
        return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
      }
      vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
        return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
      }

      vec3 applyNightVision(vec3 color, vec2 uv, float timeVal, float noiseAmt, float gain, float crt) {
        float lum = dot(color, vec3(0.299, 0.587, 0.114));
        float amplified = pow(lum * gain, 0.72);
        vec3 phosphorColor = mix(vec3(0.02, 0.12, 0.03), vec3(0.18, 1.0, 0.32), clamp(amplified, 0.0, 1.0));
        phosphorColor += vec3(0.7, 1.0, 0.8) * max(0.0, amplified - 0.75) * 1.8;
        vec2 p = uv - 0.5;
        float tubeDist = length(p);
        float tubeMask = smoothstep(0.72, 0.44, tubeDist);
        float n = fract(sin(dot(uv * 280.0 + timeVal * 0.05, vec2(12.9898, 78.233))) * 43758.5453);
        float scanline = sin(uv.y * 650.0) * crt;
        phosphorColor += (n - 0.5) * noiseAmt * 2.0 + scanline;
        return clamp(phosphorColor * tubeMask, 0.0, 1.0);
      }

      vec3 ironbow(float t) {
        t = clamp(t, 0.0, 1.0);
        vec3 c0 = vec3(0.02, 0.01, 0.18);
        vec3 c1 = vec3(0.22, 0.02, 0.48);
        vec3 c2 = vec3(0.82, 0.05, 0.25);
        vec3 c3 = vec3(1.0, 0.62, 0.02);
        vec3 c4 = vec3(1.0, 1.0, 0.92);
        if (t < 0.25) return mix(c0, c1, t * 4.0);
        if (t < 0.50) return mix(c1, c2, (t - 0.25) * 4.0);
        if (t < 0.75) return mix(c2, c3, (t - 0.50) * 4.0);
        return mix(c3, c4, (t - 0.75) * 4.0);
      }

      vec3 applyThermal(vec3 color, vec2 uv, float sensitivity, float crt, bool whiteHot) {
        float lum = dot(color, vec3(0.299, 0.587, 0.114));
        float heat = clamp(lum * sensitivity, 0.0, 1.0);
        float sensorRaster = sin(uv.y * 900.0) * (crt * 0.3);
        heat = clamp(heat + sensorRaster, 0.0, 1.0);
        if (whiteHot) {
          float grad = pow(heat, 0.85);
          return vec3(grad);
        } else {
          return ironbow(heat);
        }
      }

      void main() {
        vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
        vec4 col = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
        vec3 finalCol = col.rgb;

        if (visionMode == 1) {
          finalCol = applyNightVision(finalCol, uv, time, nightVisionNoise, nightVisionGain, crtIntensity);
        } else if (visionMode == 2) {
          finalCol = applyThermal(finalCol, uv, thermalSensitivity, crtIntensity, false);
        } else if (visionMode == 3) {
          finalCol = applyThermal(finalCol, uv, thermalSensitivity, crtIntensity, true);
        } else {
          vec3 exposedColor = finalCol * exposure;
          vec3 toneMappedColor = ACESFilmicToneMapping(exposedColor);
          finalCol = finalLevels(toneMappedColor, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
          if (crtIntensity > 0.0001) {
            float scanline = sin(uv.y * 900.0 + time * 2.0) * crtIntensity;
            finalCol -= scanline;
          }
        }

        fragColor = vec4(finalCol, 1.0);
      }
    `;

    const copyFragmentShader = `
      precision highp float;
      uniform sampler2D inputTexture;
      in vec2 vUv;
      out vec4 fragColor;
      void main() {
        fragColor = texture(inputTexture, vUv);
      }
    `;

    function createFBO(w, h, options = {}) {
      return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
        wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
        wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
        minFilter: options.minFilter || THREE.LinearFilter,
        magFilter: options.magFilter || THREE.LinearFilter,
        format: options.format || THREE.RGBAFormat,
        type: options.type || THREE.HalfFloatType,
        stencilBuffer: options.stencilBuffer || false,
        depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : true,
        samples: options.samples || 0,
      });
    }

    class ShaderPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbo = createFBO(1, 1, options);
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
        this.texture = this.fbo.texture;
      }
      render(renderer, toScreen = false) {
        if (!toScreen) {
          renderer.setRenderTarget(this.fbo);
        }
        renderer.render(this.orthoScene, this.orthoCamera);
        if (!toScreen) {
          renderer.setRenderTarget(null);
        }
      }
      setSize(width, height) {
        this.fbo.setSize(Math.max(1, width), Math.max(1, height));
        this.orthoQuad.scale.set(width, height, 1);
      }
    }

    class ShaderPingPongPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
        this.currentFBO = 0;
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
      }
      render(renderer) {
        renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
        renderer.render(this.orthoScene, this.orthoCamera);
        renderer.setRenderTarget(null);
        this.currentFBO = 1 - this.currentFBO;
      }
      get current() { return this.fbos[this.currentFBO]; }
      get texture() { return this.current.texture; }
      setSize(width, height) {
        const w = Math.max(1, width);
        const h = Math.max(1, height);
        this.orthoQuad.scale.set(w, h, 1);
        this.fbos[0].setSize(w, h);
        this.fbos[1].setSize(w, h);
      }
    }

    class BloomPass {
      constructor(strength = 0.8, radius = 0.5, threshold = 0.2, levels = 5) {
        this.strength = strength;
        this.radius = radius;
        this.threshold = threshold;
        this.enabled = true;
        this.levels = levels;

        this.brightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            bloomThreshold: { value: this.threshold },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: brightFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.brightPass = new ShaderPass(this.brightShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.blurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            direction: { value: new THREE.Vector2(0, 1) },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: blurFragmentShader,
          glslVersion: THREE.GLSL3,
        });

        this.blurPasses = [];
        for (let i = 0; i < this.levels; i++) {
          this.blurPasses.push(new ShaderPingPongPass(this.blurShader, {
            format: THREE.RGBAFormat,
            type: THREE.HalfFloatType,
          }));
        }
      }

      setSize(w, h) {
        let tw = Math.max(1, w);
        let th = Math.max(1, h);
        this.brightPass.setSize(tw, th);
        for (let i = 0; i < this.levels; i++) {
          tw = Math.max(1, Math.round(tw / 2));
          th = Math.max(1, Math.round(th / 2));
          this.blurPasses[i].setSize(tw, th);
        }
      }

      set source(texture) {
        this.brightShader.uniforms.inputTexture.value = texture;
      }

      render(renderer) {
        if (!this.enabled || this.strength <= 0.001) return;

        this.brightShader.uniforms.bloomThreshold.value = this.threshold;
        this.brightPass.render(renderer);

        const baseOffset = Math.max(0.1, this.radius * 2.0);
        const u = this.blurShader.uniforms;

        for (let j = 0; j < this.levels; j++) {
          const blurPass = this.blurPasses[j];
          const stepOffset = baseOffset * (1.0 + j * 0.5);

          u.direction.value.set(stepOffset, 0);
          u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
          blurPass.render(renderer);

          u.direction.value.set(0, stepOffset * 0.5);
          u.inputTexture.value = blurPass.current.texture;
          blurPass.render(renderer);
        }
      }
    }

    const VISION_MODE_MAP = {
      'Normal (Cinematic)': 0,
      'Night Vision (Phosphor)': 1,
      'Thermal (Ironbow)': 2,
      'Thermal (White-Hot)': 3,
    };

    class PostProcessor {
      constructor(renderer, params = {}) {
        this.renderer = renderer;

        this.settings = {
          enabled: params.enabled !== undefined ? params.enabled : true,
          antialias: params.antialias !== undefined ? params.antialias : true,

          bloomEnabled: params.bloomEnabled !== undefined ? params.bloomEnabled : true,
          bloomStrength: params.bloomStrength !== undefined ? params.bloomStrength : 1.5,
          bloomRadius: params.bloomRadius !== undefined ? params.bloomRadius : 0.65,
          bloomThreshold: params.bloomThreshold !== undefined ? params.bloomThreshold : 0.16,

          raysEnabled: params.raysEnabled !== undefined ? params.raysEnabled : false,
          raysStrength: params.raysStrength !== undefined ? params.raysStrength : 0.85,
          raysDensity: params.raysDensity !== undefined ? params.raysDensity : 1.0,
          raysMaxDensity: params.raysMaxDensity !== undefined ? params.raysMaxDensity : 0.5,
          raysDistanceAttenuation: params.raysDistanceAttenuation !== undefined ? params.raysDistanceAttenuation : 2.0,
          raysThreshold: params.raysThreshold !== undefined ? params.raysThreshold : 0.12,
          raysColor: params.raysColor ? (params.raysColor.isColor ? params.raysColor.clone() : new THREE.Color(params.raysColor)) : new THREE.Color(0x00ff66),
          raysColorHex: params.raysColorHex || '#00ff66',

          // Anamorphic flare default is strictly OFF
          anamorphicEnabled: params.anamorphicEnabled !== undefined ? params.anamorphicEnabled : false,
          anamorphicIntensity: params.anamorphicIntensity !== undefined ? params.anamorphicIntensity : 5.0,
          anamorphicThreshold: params.anamorphicThreshold !== undefined ? params.anamorphicThreshold : 0.35,
          anamorphicSamples: params.anamorphicSamples !== undefined ? params.anamorphicSamples : 64,
          anamorphicRadius: params.anamorphicRadius !== undefined ? params.anamorphicRadius : 0.0,
          anamorphicSmoothWidth: params.anamorphicSmoothWidth !== undefined ? params.anamorphicSmoothWidth : 0.05,
          anamorphicColor: params.anamorphicColor ? (params.anamorphicColor.isColor ? params.anamorphicColor.clone() : new THREE.Color(params.anamorphicColor)) : new THREE.Color(0x55ffff),
          anamorphicColorHex: params.anamorphicColorHex || '#55ffff',

          visionMode: params.visionMode !== undefined ? params.visionMode : 'Normal (Cinematic)',
          thermalSensitivity: params.thermalSensitivity !== undefined ? params.thermalSensitivity : 1.4,
          nightVisionGain: params.nightVisionGain !== undefined ? params.nightVisionGain : 2.1,
          nightVisionNoise: params.nightVisionNoise !== undefined ? params.nightVisionNoise : 0.05,
          crtIntensity: params.crtIntensity !== undefined ? params.crtIntensity : 0.0,

          fisheyeStrength: params.fisheyeStrength !== undefined ? params.fisheyeStrength : 0.0,
          fisheyeRadius: params.fisheyeRadius !== undefined ? params.fisheyeRadius : 1.0,
          chromaticAberration: params.chromaticAberration !== undefined ? params.chromaticAberration : 0.025,
          vignetteBoost: params.vignetteBoost !== undefined ? params.vignetteBoost : 1.12,
          vignetteReduction: params.vignetteReduction !== undefined ? params.vignetteReduction : 0.6,
          noiseIntensity: params.noiseIntensity !== undefined ? params.noiseIntensity : 0.012,

          gamma: params.gamma !== undefined ? params.gamma : 1.0,
          minInputLevel: params.minInputLevel !== undefined ? params.minInputLevel : 0.0,
          maxInputLevel: params.maxInputLevel !== undefined ? params.maxInputLevel : 1.0,
          exposure: params.exposure !== undefined ? params.exposure : 1.0,
        };

        const maxSamples = (this.renderer && this.renderer.capabilities) ? (this.renderer.capabilities.maxSamples || 4) : 4;
        const targetSamples = this.settings.antialias ? Math.min(4, maxSamples) : 0;
        this.sceneTarget = createFBO(1, 1, { type: THREE.HalfFloatType, samples: targetSamples });

        this.bloomPass = new BloomPass(
          this.settings.bloomStrength,
          this.settings.bloomRadius,
          this.settings.bloomThreshold,
          5
        );

        this.moonScreenPos = new THREE.Vector3(0.5, 0.5, 1.0);
        this.moonInFront = true;

        this.godRaysMaskShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            threshold: { value: this.settings.raysThreshold },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: godRaysDepthMaskShader,
          glslVersion: THREE.GLSL3,
        });
        this.godRaysMaskPass = new ShaderPass(this.godRaysMaskShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.godRaysGenShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            vSunPositionScreenSpace: { value: this.moonScreenPos },
            fStepSize: { value: 1.0 },
            distanceAttenuation: { value: this.settings.raysDistanceAttenuation },
            maxDensity: { value: this.settings.raysMaxDensity },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: godRaysGenerateShader,
          glslVersion: THREE.GLSL3,
        });
        this.godRaysPingPong = new ShaderPingPongPass(this.godRaysGenShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.anamorphicBrightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            threshold: { value: this.settings.anamorphicThreshold },
            smoothWidth: { value: this.settings.anamorphicSmoothWidth },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: anamorphicBrightShader,
          glslVersion: THREE.GLSL3,
        });
        this.anamorphicBrightPass = new ShaderPass(this.anamorphicBrightShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.anamorphicBlurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            resolution: { value: new THREE.Vector2(1, 1) },
            samples: { value: this.settings.anamorphicSamples },
            intensity: { value: this.settings.anamorphicIntensity },
            tintColor: { value: this.settings.anamorphicColor },
            bloomRadius: { value: this.settings.anamorphicRadius },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: anamorphicBlurShader,
          glslVersion: THREE.GLSL3,
        });
        this.anamorphicBlurPass = new ShaderPass(this.anamorphicBlurShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.finalShader = new THREE.RawShaderMaterial({
          uniforms: {
            resolution: { value: new THREE.Vector2(1, 1) },
            bloomEnabled: { value: this.settings.bloomEnabled },
            bloomStrength: { value: this.settings.bloomStrength },
            raysEnabled: { value: this.settings.raysEnabled },
            raysStrength: { value: this.settings.raysStrength },
            raysColor: { value: this.settings.raysColor },
            anamorphicEnabled: { value: this.settings.anamorphicEnabled },
            vignetteBoost: { value: this.settings.vignetteBoost },
            vignetteReduction: { value: this.settings.vignetteReduction },
            noiseIntensity: { value: this.settings.noiseIntensity },
            inputTexture: { value: null },
            blur0Texture: { value: null },
            blur1Texture: { value: null },
            blur2Texture: { value: null },
            blur3Texture: { value: null },
            blur4Texture: { value: null },
            raysTexture: { value: null },
            anamorphicTexture: { value: null },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: finalFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.finalPass = new ShaderPass(this.finalShader);

        this.rgbShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: this.finalPass.texture },
            fisheyeStrength: { value: this.settings.fisheyeStrength },
            fisheyeRadius: { value: this.settings.fisheyeRadius },
            chromaticAberrationAmount: { value: this.settings.chromaticAberration },
            minInputLevel: { value: this.settings.minInputLevel },
            maxInputLevel: { value: this.settings.maxInputLevel },
            gammaLevel: { value: this.settings.gamma },
            exposure: { value: this.settings.exposure },
            visionMode: { value: VISION_MODE_MAP[this.settings.visionMode] ?? 0 },
            thermalSensitivity: { value: this.settings.thermalSensitivity },
            nightVisionGain: { value: this.settings.nightVisionGain },
            nightVisionNoise: { value: this.settings.nightVisionNoise },
            crtIntensity: { value: this.settings.crtIntensity },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: colorFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.rgbPass = new ShaderPass(this.rgbShader);

        this.copyShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: copyFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.copyPass = new ShaderPass(this.copyShader);
      }

      updateSettings() {
        this.bloomPass.enabled = this.settings.bloomEnabled;
        this.bloomPass.strength = this.settings.bloomStrength;
        this.bloomPass.radius = this.settings.bloomRadius;
        this.bloomPass.threshold = this.settings.bloomThreshold;

        this.godRaysMaskShader.uniforms.threshold.value = this.settings.raysThreshold;
        this.godRaysGenShader.uniforms.distanceAttenuation.value = this.settings.raysDistanceAttenuation;
        this.godRaysGenShader.uniforms.maxDensity.value = this.settings.raysMaxDensity;

        this.anamorphicBrightShader.uniforms.threshold.value = this.settings.anamorphicThreshold;
        this.anamorphicBrightShader.uniforms.smoothWidth.value = this.settings.anamorphicSmoothWidth;
        this.anamorphicBlurShader.uniforms.samples.value = this.settings.anamorphicSamples;
        this.anamorphicBlurShader.uniforms.intensity.value = this.settings.anamorphicIntensity;
        this.anamorphicBlurShader.uniforms.tintColor.value.copy(this.settings.anamorphicColor);
        this.anamorphicBlurShader.uniforms.bloomRadius.value = this.settings.anamorphicRadius;

        this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
        this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
        this.finalShader.uniforms.raysEnabled.value = this.settings.raysEnabled && this.moonInFront;
        this.finalShader.uniforms.raysStrength.value = this.settings.raysStrength;
        this.finalShader.uniforms.raysColor.value.copy(this.settings.raysColor);
        this.finalShader.uniforms.anamorphicEnabled.value = this.settings.anamorphicEnabled;
        this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
        this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
        this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;

        this.rgbShader.uniforms.fisheyeStrength.value = this.settings.fisheyeStrength;
        this.rgbShader.uniforms.fisheyeRadius.value = this.settings.fisheyeRadius;
        this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
        this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
        this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
        this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
        this.rgbShader.uniforms.exposure.value = this.settings.exposure;
        this.rgbShader.uniforms.visionMode.value = VISION_MODE_MAP[this.settings.visionMode] ?? 0;
        this.rgbShader.uniforms.thermalSensitivity.value = this.settings.thermalSensitivity;
        this.rgbShader.uniforms.nightVisionGain.value = this.settings.nightVisionGain;
        this.rgbShader.uniforms.nightVisionNoise.value = this.settings.nightVisionNoise;
        this.rgbShader.uniforms.crtIntensity.value = this.settings.crtIntensity;
      }

      setSize(w0, h0, dpr = 1) {
        const w = Math.max(1, Math.floor(w0 * dpr));
        const h = Math.max(1, Math.floor(h0 * dpr));
        this.sceneTarget.setSize(w, h);
        this.finalPass.setSize(w, h);
        this.finalShader.uniforms.resolution.value.set(w, h);
        this.bloomPass.setSize(w, h);

        const grW = Math.max(1, Math.round(w / 2));
        const grH = Math.max(1, Math.round(h / 2));
        this.godRaysMaskPass.setSize(grW, grH);
        this.godRaysPingPong.setSize(grW, grH);

        const anW = Math.max(1, Math.round(w / 4));
        const anH = Math.max(1, Math.round(h / 4));
        this.anamorphicBrightPass.setSize(anW, anH);
        this.anamorphicBlurPass.setSize(anW, anH);
        this.anamorphicBlurShader.uniforms.resolution.value.set(anW, anH);

        this.rgbPass.setSize(w, h);
        this.copyPass.setSize(w, h);
      }

      setAntialias(enabled) {
        this.settings.antialias = !!enabled;
        const maxSamples = (this.renderer && this.renderer.capabilities) ? (this.renderer.capabilities.maxSamples || 4) : 4;
        const samples = this.settings.antialias ? Math.min(4, maxSamples) : 0;
        if (this.sceneTarget.samples !== samples) {
          const oldTarget = this.sceneTarget;
          this.sceneTarget = createFBO(oldTarget.width, oldTarget.height, {
            type: THREE.HalfFloatType,
            samples: samples,
          });
          oldTarget.dispose();
        }
      }

      renderScene(scene, camera) {
        if (!this.settings.enabled) {
          this.renderer.setRenderTarget(this.sceneTarget);
          this.renderer.render(scene, camera);
          this.renderer.setRenderTarget(null);
          this.copyPass.shader.uniforms.inputTexture.value = this.sceneTarget.texture;
          this.copyPass.render(this.renderer, true);
          return;
        }
        this.renderer.setRenderTarget(this.sceneTarget);
        this.renderer.render(scene, camera);
        this.renderer.setRenderTarget(null);
        this.render(this.sceneTarget.texture);
      }

      render(sourceTexture) {
        if (!this.settings.enabled) {
          this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
          this.copyPass.render(this.renderer, true);
          return;
        }

        this.updateSettings();

        // 1. Atmospheric Bloom
        this.bloomPass.source = sourceTexture;
        this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
        this.bloomPass.render(this.renderer);

        this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
        this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
        this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
        this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
        this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

        // 2. Godrays
        if (this.settings.raysEnabled && this.settings.raysStrength > 0.001 && this.moonInFront) {
          this.godRaysMaskShader.uniforms.inputTexture.value = sourceTexture;
          this.godRaysMaskShader.uniforms.threshold.value = this.settings.raysThreshold;
          this.godRaysMaskPass.render(this.renderer);

          const filterLen = this.settings.raysDensity;
          const tapsPerPass = 6.0;

          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -1.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysMaskPass.texture;
          this.godRaysPingPong.render(this.renderer);

          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -2.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysPingPong.texture;
          this.godRaysPingPong.render(this.renderer);

          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -3.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysPingPong.texture;
          this.godRaysPingPong.render(this.renderer);

          this.finalPass.shader.uniforms.raysTexture.value = this.godRaysPingPong.texture;
          this.finalPass.shader.uniforms.raysEnabled.value = true;
        } else {
          this.finalPass.shader.uniforms.raysEnabled.value = false;
        }

        // 3. Anamorphic Flare
        if (this.settings.anamorphicEnabled && this.settings.anamorphicIntensity > 0.001) {
          this.anamorphicBrightShader.uniforms.inputTexture.value = sourceTexture;
          this.anamorphicBrightShader.uniforms.threshold.value = this.settings.anamorphicThreshold;
          this.anamorphicBrightShader.uniforms.smoothWidth.value = this.settings.anamorphicSmoothWidth;
          this.anamorphicBrightPass.render(this.renderer);

          this.anamorphicBlurShader.uniforms.inputTexture.value = this.anamorphicBrightPass.texture;
          this.anamorphicBlurShader.uniforms.samples.value = this.settings.anamorphicSamples;
          this.anamorphicBlurShader.uniforms.intensity.value = this.settings.anamorphicIntensity;
          this.anamorphicBlurShader.uniforms.tintColor.value.copy(this.settings.anamorphicColor);
          this.anamorphicBlurShader.uniforms.bloomRadius.value = this.settings.anamorphicRadius;
          this.anamorphicBlurPass.render(this.renderer);

          this.finalPass.shader.uniforms.anamorphicTexture.value = this.anamorphicBlurPass.texture;
          this.finalPass.shader.uniforms.anamorphicEnabled.value = true;
        } else {
          this.finalPass.shader.uniforms.anamorphicEnabled.value = false;
        }

        const randomTime = Math.random() * 100000;
        this.finalPass.shader.uniforms.time.value = randomTime;
        this.rgbPass.shader.uniforms.time.value = randomTime;

        this.finalPass.render(this.renderer);
        this.rgbPass.render(this.renderer, true);
      }

      attachGUI(gui, title = "Post-Processing Suite") {
        const root = gui.addFolder(title);
        root.add(this.settings, "enabled").name("Enable Post-Process");
        root.add(this.settings, "antialias").name("MSAA Antialias").onChange((v) => this.setAntialias(v));

        const bloom = root.addFolder("Atmospheric Bloom");
        bloom.add(this.settings, "bloomEnabled").name("Enable Bloom").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomStrength", 0, 4.0, 0.05).name("Bloom Strength").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomRadius", 0, 2.0, 0.05).name("Bloom Radius").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomThreshold", 0, 1.0, 0.01).name("Bloom Threshold").onChange(() => this.updateSettings());

        const lens = root.addFolder("Lens, Optics & Film Grain");
        lens.add(this.settings, "chromaticAberration", 0, 0.15, 0.002).name("Chromatic Aberration").onChange(() => this.updateSettings());
        lens.add(this.settings, "fisheyeStrength", -1.0, 1.5, 0.01).name("Fisheye Distortion").onChange(() => this.updateSettings());
        lens.add(this.settings, "vignetteBoost", 0, 2.0, 0.05).name("Vignette Boost").onChange(() => this.updateSettings());
        lens.add(this.settings, "vignetteReduction", 0, 2.0, 0.05).name("Vignette Falloff").onChange(() => this.updateSettings());
        lens.add(this.settings, "noiseIntensity", 0, 0.1, 0.002).name("Film Grain").onChange(() => this.updateSettings());
        lens.add(this.settings, "gamma", 0.2, 2.0, 0.05).name("Gamma").onChange(() => this.updateSettings());
        lens.add(this.settings, "exposure", 0.2, 3.0, 0.05).name("Post Exposure").onChange(() => this.updateSettings());

        const anamorphic = root.addFolder("Three.js Anamorphic Flare");
        anamorphic.add(this.settings, "anamorphicEnabled").name("Enable Anamorphic").onChange(() => this.updateSettings());
        anamorphic.add(this.settings, "anamorphicIntensity", 0, 10.0, 0.1).name("Intensity").onChange(() => this.updateSettings());
        anamorphic.add(this.settings, "anamorphicThreshold", 0.0, 0.9, 0.01).name("Threshold").onChange(() => this.updateSettings());
        anamorphic.add(this.settings, "anamorphicSamples", 2, 128, 1).name("Samples").onChange(() => this.updateSettings());
        anamorphic.add(this.settings, "anamorphicRadius", 0.0, 1.0, 0.01).name("Bloom Radius").onChange(() => this.updateSettings());
        anamorphic.addColor(this.settings, "anamorphicColorHex").name("Tint Color").onChange((v) => {
          this.settings.anamorphicColor.set(v);
          this.updateSettings();
        });

        const rays = root.addFolder("Three.js Godrays");
        rays.add(this.settings, "raysEnabled").name("Enable Godrays").onChange(() => this.updateSettings());
        rays.add(this.settings, "raysStrength", 0, 3.0, 0.05).name("Intensity").onChange(() => this.updateSettings());
        rays.add(this.settings, "raysDensity", 0.1, 2.5, 0.05).name("Density (Spread)").onChange(() => this.updateSettings());
        rays.addColor(this.settings, "raysColorHex").name("Ray Tint").onChange((v) => {
          this.settings.raysColor.set(v);
          this.updateSettings();
        });

        const vision = root.addFolder("Thermal & Night Vision");
        vision.add(this.settings, "visionMode", Object.keys(VISION_MODE_MAP)).name("Vision Mode").onChange(() => this.updateSettings());
        vision.add(this.settings, "nightVisionGain", 0.5, 5.0, 0.1).name("NVG Gain").onChange(() => this.updateSettings());
        vision.add(this.settings, "crtIntensity", 0.0, 0.1, 0.005).name("CRT Scanlines").onChange(() => this.updateSettings());

        return root;
      }
    }

    // =========================================================================

    const ANIMATION_PRESETS = [

    // =========================================================================

    const params = {

    // Saved postprocessing states for greenscreen toggling

    // =========================================================================
    // GLYPH ATLAS TEXTURE GENERATOR
    // Ultra-sharp Japanese Matrix Katakana + Binary digits + System cyber runes
    // =========================================================================
    function createGlyphAtlasTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 2048;
      canvas.height = 2048;
      const ctx = canvas.getContext('2d');

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const glyphList = [
        '0', '1', '0', '1', '01', '10', '11', '00',
        'ｦ', 'ｱ', 'ｳ', 'ｴ', 'ｵ', 'ｶ', 'ｷ', 'ｹ',
        'ｺ', 'ｻ', 'ｼ', 'ｽ', 'ｾ', 'ｿ', 'ﾀ', 'ﾂ',
        'ﾃ', 'ﾅ', 'ﾆ', 'ﾇ', 'ﾈ', 'ﾊ', 'ﾋ', 'ﾎ',
        'ﾏ', 'ﾐ', 'ﾑ', 'ﾒ', 'ﾓ', 'ﾔ', 'ﾕ', 'ﾗ',
        'ﾘ', 'ﾜ', 'ﾝ', '0x', 'FF', '7F', '::', '//',
        '⌘', '⌥', '⎔', '◈', '⬡', '⚡', '⨁', '⨂',
        '∿', '⌖', '⌬', '⏣', '⌗', '⌑', '日', '月'
      ];

      const cellSize = 256;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = 'bold 150px Consolas, "MS Gothic", "Segoe UI Symbol", Meiryo, monospace';

      for (let i = 0; i < 64; i++) {
        const col = i % 8;
        const row = Math.floor(i / 8);
        const x = col * cellSize + cellSize / 2;
        const y = row * cellSize + cellSize / 2;

        const char = glyphList[i] || '0';

        // Subtle soft halo
        ctx.save();
        ctx.shadowColor = 'rgba(255, 255, 255, 0.6)';
        ctx.shadowBlur = 8;
        ctx.fillStyle = '#ffffff';
        ctx.fillText(char, x, y);
        ctx.restore();

        // Sharp high-contrast core
        ctx.save();
        ctx.fillStyle = '#ffffff';
        ctx.fillText(char, x, y);
        ctx.restore();
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.generateMipmaps = true;
      texture.minFilter = THREE.LinearMipmapLinearFilter;
      texture.magFilter = THREE.LinearFilter;
      texture.wrapS = THREE.ClampToEdgeWrapping;
      texture.wrapT = THREE.ClampToEdgeWrapping;
      texture.needsUpdate = true;
      return texture;
    }

    const glyphAtlasTexture = createGlyphAtlasTexture();

    // =========================================================================
    // SCENE, CAMERA & RENDERER SETUP
    // =========================================================================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(params.backgroundColor);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 300);
    const initialCamPos = new THREE.Vector3(0, 0, 42);
    camera.position.copy(initialCamPos);

    let renderer;
    let controls;
    let postProcessor;

    function initRenderer(withAntialias) {
      if (renderer) {
        renderer.dispose();
        if (renderer.domElement && renderer.domElement.parentNode) {
          renderer.domElement.parentNode.removeChild(renderer.domElement);
        }
      }

      renderer = new THREE.WebGLRenderer({
        antialias: withAntialias,
        powerPreference: 'high-performance',
        alpha: false
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(params.dpr);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = params.exposure;
      container.appendChild(renderer.domElement);

      if (controls) {
        controls.dispose();
      }
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.enableZoom = true;
      controls.zoomSpeed = 1.0;
      controls.enablePan = true;
      controls.panSpeed = 1.0;
      controls.screenSpacePanning = true;
      controls.minDistance = 6;
      controls.maxDistance = 120;
      controls.target.set(0, 0, 0);

      controls.mouseButtons = {
        LEFT: THREE.MOUSE.ROTATE,
        MIDDLE: THREE.MOUSE.DOLLY,
        RIGHT: THREE.MOUSE.PAN
      };
      controls.touches = {
        ONE: THREE.TOUCH.ROTATE,
        TWO: THREE.TOUCH.DOLLY_PAN
      };

      // Initialize or reconstruct PostProcessor suite
      if (!postProcessor) {
        postProcessor = new PostProcessor(renderer, {
          enabled: true,
          antialias: withAntialias,
          bloomEnabled: true,
          bloomStrength: 1.5,
          bloomRadius: 0.65,
          bloomThreshold: 0.16,
          // Anamorphic flare default is strictly OFF
          anamorphicEnabled: false,
          chromaticAberration: 0.025,
          vignetteBoost: 1.12,
          vignetteReduction: 0.6,
          noiseIntensity: 0.012
        });
      } else {
        postProcessor.renderer = renderer;
        postProcessor.setAntialias(withAntialias);
      }
      postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);
    }

    initRenderer(params.antialias);

    function resetCameraView() {
      camera.position.copy(initialCamPos);
      controls.target.set(0, 0, 0);
      controls.update();
    }

    // =========================================================================
    // LIGHTING SYSTEM
    // =========================================================================
    const ambientLight = new THREE.AmbientLight(params.ambientColor, params.ambientIntensity);
    scene.add(ambientLight);

    const topLight = new THREE.DirectionalLight(params.topLightColor, params.topLightIntensity);
    topLight.position.set(params.topLightPosX, params.topLightPosY, params.topLightPosZ);
    scene.add(topLight);

    const coreLight = new THREE.PointLight(params.coreLightColor, params.coreLightIntensity, params.coreLightDistance);
    coreLight.position.set(0, 0, 0);
    scene.add(coreLight);

    const bottomLight = new THREE.DirectionalLight(params.bottomLightColor, params.bottomLightIntensity);
    bottomLight.position.set(-5, -25, -10);
    scene.add(bottomLight);

    // =========================================================================
    // MATRIX BINARY & SYMBOL STREAM LOOP
    // Free space reserved for titles in the center (uVoidRadius)
    // =========================================================================
    const NUM_COLUMNS = 450;
    const GLYPHS_PER_COL = 48;
    const TOTAL_INSTANCES = NUM_COLUMNS * GLYPHS_PER_COL;
    const TOTAL_HEIGHT = 80.0;

    const quadGeo = new THREE.PlaneGeometry(1.05, 1.35);
    const instancedGeo = new THREE.InstancedBufferGeometry();
    instancedGeo.index = quadGeo.index;
    instancedGeo.attributes.position = quadGeo.attributes.position;
    instancedGeo.attributes.uv = quadGeo.attributes.uv;

    const aColPos = new Float32Array(TOTAL_INSTANCES * 3);
    const aGlyphIndex = new Float32Array(TOTAL_INSTANCES);
    const aGlyphOffsetY = new Float32Array(TOTAL_INSTANCES);
    const aColSpeed = new Float32Array(TOTAL_INSTANCES);
    const aColPhase = new Float32Array(TOTAL_INSTANCES);
    const aColGlitch = new Float32Array(TOTAL_INSTANCES);
    const aScale = new Float32Array(TOTAL_INSTANCES * 2);

    let instancePtr = 0;
    for (let c = 0; c < NUM_COLUMNS; c++) {
      const u = Math.random();
      const radius = 13.5 + 2.0 + Math.sqrt(u) * 34.0;
      const angle = Math.random() * Math.PI * 2.0;
      const colX = Math.cos(angle) * radius;
      const colZ = Math.sin(angle) * radius;
      const colY = (Math.random() - 0.5) * 12.0;

      const colSpeed = 0.75 + Math.random() * 0.7;
      const colPhase = Math.random() * TOTAL_HEIGHT;
      const colGlitch = Math.random() * 10.0;
      const colScaleX = 0.95 + Math.random() * 0.25;
      const colScaleY = 1.1 + Math.random() * 0.25;

      const spacing = TOTAL_HEIGHT / GLYPHS_PER_COL;

      for (let g = 0; g < GLYPHS_PER_COL; g++) {
        const idx3 = instancePtr * 3;
        const idx2 = instancePtr * 2;

        aColPos[idx3] = colX;
        aColPos[idx3 + 1] = colY;
        aColPos[idx3 + 2] = colZ;

        aGlyphIndex[instancePtr] = Math.floor(Math.random() * 64);
        aGlyphOffsetY[instancePtr] = (g - GLYPHS_PER_COL / 2) * spacing;
        aColSpeed[instancePtr] = colSpeed;
        aColPhase[instancePtr] = colPhase;
        aColGlitch[instancePtr] = colGlitch + g * 0.14;

        aScale[idx2] = colScaleX;
        aScale[idx2 + 1] = colScaleY;

        instancePtr++;
      }
    }

    instancedGeo.setAttribute('aColPos', new THREE.InstancedBufferAttribute(aColPos, 3));
    instancedGeo.setAttribute('aGlyphIndex', new THREE.InstancedBufferAttribute(aGlyphIndex, 1));
    instancedGeo.setAttribute('aGlyphOffsetY', new THREE.InstancedBufferAttribute(aGlyphOffsetY, 1));
    instancedGeo.setAttribute('aColSpeed', new THREE.InstancedBufferAttribute(aColSpeed, 1));
    instancedGeo.setAttribute('aColPhase', new THREE.InstancedBufferAttribute(aColPhase, 1));
    instancedGeo.setAttribute('aColGlitch', new THREE.InstancedBufferAttribute(aColGlitch, 1));
    instancedGeo.setAttribute('aScale', new THREE.InstancedBufferAttribute(aScale, 2));

    const streamUniforms = {
      uAtlas: { value: glyphAtlasTexture },
      uTime: { value: 0.0 },
      uSpeed: { value: params.animationSpeed },
      uTotalHeight: { value: TOTAL_HEIGHT },
      uVoidRadius: { value: params.voidRadius },
      uTiltAngle: { value: params.streamAngle },
      uGlitchSpeed: { value: params.glitchSpeed },
      uTrailLength: { value: params.trailLength },
      uGlowIntensity: { value: params.glowIntensity },
      uPrimaryColor: { value: new THREE.Color(params.primaryColor) },
      uSecondaryColor: { value: new THREE.Color(params.secondaryColor) },
      uAccentColor: { value: new THREE.Color(params.accentColor) }
    };

    const streamVertexShader = `
      precision highp float;

      attribute vec3 aColPos;
      attribute float aGlyphIndex;
      attribute float aGlyphOffsetY;
      attribute float aColSpeed;
      attribute float aColPhase;
      attribute float aColGlitch;
      attribute vec2 aScale;

      uniform float uTime;
      uniform float uSpeed;
      uniform float uTotalHeight;
      uniform float uVoidRadius;
      uniform float uTiltAngle;
      uniform float uGlitchSpeed;
      uniform float uTrailLength;

      varying vec2 vUv;
      varying vec2 vAtlasUv;
      varying float vBrightness;
      varying float vHeadFactor;

      float hash11(float p) {
        p = fract(p * 0.1031);
        p *= p + 33.33;
        p *= p + p;
        return fract(p);
      }

      void main() {
        vUv = uv;

        // Downward stream speed
        float fall = uTime * uSpeed * aColSpeed * 17.0;
        float halfH = uTotalHeight * 0.5;

        // Raw vertical position
        float rawY = aColPos.y + aGlyphOffsetY - fall;

        // Infinite loop wrap-around
        float streamY = mod(rawY + halfH, uTotalHeight) - halfH;

        // Diagonal Tilt
        vec3 streamPos = aColPos;
        streamPos.x += streamY * sin(uTiltAngle) * 0.6;
        streamPos.z += streamY * cos(uTiltAngle) * sin(uTiltAngle) * 0.4;
        streamPos.y = streamY;

        // Free central space for titles (smooth outward repulsion)
        float dCenter = length(streamPos.xz);
        if (dCenter < uVoidRadius) {
          vec2 dir = normalize(streamPos.xz + vec2(0.0001, 0.0001));
          streamPos.xz = dir * (uVoidRadius + (uVoidRadius - dCenter) * 0.22);
        }

        // Matrix Rain Drop pulse calculation:
        float colPeriod = uTotalHeight * 0.6;
        float dropHeadPos = mod(fall + aColPhase, colPeriod);
        float distFromHead = mod(aGlyphOffsetY - dropHeadPos, colPeriod);

        float brightness = 0.0;
        float headFactor = 0.0;

        if (distFromHead < 1.35 && distFromHead >= 0.0) {
          // Leading Head character (Blazing intense white-hot HDR emission)
          headFactor = 1.0;
          brightness = 3.6;
        } else if (distFromHead < uTrailLength) {
          // Cascading neon tail
          float t = 1.0 - (distFromHead / uTrailLength);
          brightness = pow(t, 1.35) * 2.1;
          headFactor = pow(t, 5.0) * 0.55;
        } else {
          // Dormant background code flicker
          brightness = 0.04 + 0.035 * sin(uTime * 3.5 + aColPhase);
        }

        vBrightness = brightness;
        vHeadFactor = headFactor;

        // Realtime dynamic glyph scrambling / glitching
        float glitchClock = floor(uTime * uGlitchSpeed * (9.0 + aColGlitch * 13.0));
        float rnd = hash11(aColGlitch * 143.7 + glitchClock);
        float finalGlyph = aGlyphIndex;
        if (rnd > 0.4) {
          finalGlyph = floor(hash11(rnd * 97.3 + glitchClock) * 64.0);
        }

        // Correct WebGL UV coordinates for 8x8 glyph atlas (CanvasTexture orientation)
        float col = mod(finalGlyph, 8.0);
        float row = floor(finalGlyph / 8.0);
        vAtlasUv = vec2((col + uv.x) / 8.0, (7.0 - row + uv.y) / 8.0);

        // Billboarding: Quad always faces the camera directly
        vec3 cameraRight = vec3(viewMatrix[0][0], viewMatrix[1][0], viewMatrix[2][0]);
        vec3 cameraUp = vec3(viewMatrix[0][1], viewMatrix[1][1], viewMatrix[2][1]);

        vec3 worldPos = streamPos + (position.x * cameraRight * aScale.x + position.y * cameraUp * aScale.y);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(worldPos, 1.0);
      }
    `;

    const streamFragmentShader = `
      precision highp float;

      uniform sampler2D uAtlas;
      uniform vec3 uPrimaryColor;
      uniform vec3 uSecondaryColor;
      uniform vec3 uAccentColor;
      uniform float uGlowIntensity;

      varying vec2 vUv;
      varying vec2 vAtlasUv;
      varying float vBrightness;
      varying float vHeadFactor;

      void main() {
        if (vBrightness <= 0.02) {
          discard;
        }

        // Sample crisp glyph texture
        float glyphMask = texture2D(uAtlas, vAtlasUv).r;
        if (glyphMask < 0.08) {
          discard;
        }

        // Color Gradient: Secondary (tail) -> Primary (stream body) -> Accent/White (head)
        vec3 streamCol = mix(uSecondaryColor, uPrimaryColor, clamp(vBrightness * 0.55, 0.0, 1.0));
        vec3 finalCol = mix(streamCol, uAccentColor, vHeadFactor);
        finalCol = mix(finalCol, vec3(1.0), vHeadFactor * 0.85);

        // HDR emission for Atmospheric Bloom in PostProcessor
        vec3 emission = finalCol * (vBrightness * glyphMask * uGlowIntensity);
        float alpha = glyphMask * clamp(vBrightness, 0.0, 1.0);

        gl_FragColor = vec4(emission, alpha);
      }
    `;

    const streamMaterial = new THREE.ShaderMaterial({
      vertexShader: streamVertexShader,
      fragmentShader: streamFragmentShader,
      uniforms: streamUniforms,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });

    const streamMesh = new THREE.Mesh(instancedGeo, streamMaterial);
    streamMesh.frustumCulled = false;
    scene.add(streamMesh);

    // =========================================================================
    // MINIMALIST TITLE ZONE CORNER BRACKETS [   ] (Subtle, sleek)
    // =========================================================================
    const titleGroup = new THREE.Group();
    scene.add(titleGroup);

    function createTitleZoneGuides(radius) {
      while (titleGroup.children.length > 0) {
        const obj = titleGroup.children[0];
        titleGroup.remove(obj);
        if (obj.geometry) obj.geometry.dispose();
        if (obj.material) obj.material.dispose();
      }

      if (!params.showTitleGuides) return;

      const reticleMat = new THREE.LineBasicMaterial({
        color: new THREE.Color(params.accentColor),
        transparent: true,
        opacity: 0.4,
        blending: THREE.AdditiveBlending
      });

      const halfW = radius * 0.75;
      const halfH = 5.0;
      const arm = 2.0;

      const corners = [
        [-halfW, halfH, 1, -1],
        [halfW, halfH, -1, -1],
        [-halfW, -halfH, 1, 1],
        [halfW, -halfH, -1, 1]
      ];

      corners.forEach(([cx, cy, sx, sy]) => {
        const points = [
          new THREE.Vector3(cx + sx * arm, cy, 0),
          new THREE.Vector3(cx, cy, 0),
          new THREE.Vector3(cx, cy + sy * arm, 0)
        ];
        const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
        titleGroup.add(new THREE.Line(lineGeo, reticleMat));
      });
    }

    createTitleZoneGuides(params.voidRadius);

    // Ambient floating micro-sparks outside the title void
    const DUST_COUNT = 900;
    const dustGeo = new THREE.BufferGeometry();
    const dustPositions = new Float32Array(DUST_COUNT * 3);

    for (let i = 0; i < DUST_COUNT; i++) {
      const u = Math.random();
      const r = params.voidRadius + 2.5 + Math.sqrt(u) * 30.0;
      const th = Math.random() * Math.PI * 2;
      dustPositions[i * 3] = Math.cos(th) * r;
      dustPositions[i * 3 + 1] = (Math.random() - 0.5) * TOTAL_HEIGHT;
      dustPositions[i * 3 + 2] = Math.sin(th) * r;
    }

    dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));

    const dustMat = new THREE.PointsMaterial({
      color: new THREE.Color(params.primaryColor),
      size: 1.2,
      transparent: true,
      opacity: 0.5,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const dustPoints = new THREE.Points(dustGeo, dustMat);
    scene.add(dustPoints);

    // =========================================================================
    // COLOR SCHEME UPDATE LOGIC
    // =========================================================================
    function applyColorScheme(schemeKey) {
      const scheme = COLOR_SCHEMES[schemeKey];
      if (!scheme) return;

      params.colorScheme = schemeKey;
      params.primaryColor = scheme.primary;
      params.secondaryColor = scheme.secondary;
      params.accentColor = scheme.accent;
      params.backgroundColor = scheme.bg;
      params.coreGlowColor = scheme.coreGlow;
      params.ambientColor = scheme.ambient;
      params.topLightColor = scheme.topLight;
      params.bottomLightColor = scheme.bottomLight;

      updateColorsInScene();
      createTitleZoneGuides(params.voidRadius);
    }

    function updateColorsInScene() {
      if (params.greenscreen) {
        scene.background = new THREE.Color('#00ff00');
        if (postProcessor) {
          savedVignetteReduction = postProcessor.settings.vignetteReduction;
          savedNoiseIntensity = postProcessor.settings.noiseIntensity;
          postProcessor.settings.vignetteReduction = 0.0;
          postProcessor.settings.noiseIntensity = 0.0;
          postProcessor.updateSettings();
        }
      } else {
        scene.background = new THREE.Color(params.backgroundColor);
        if (postProcessor) {
          postProcessor.settings.vignetteReduction = savedVignetteReduction;
          postProcessor.settings.noiseIntensity = savedNoiseIntensity;
          postProcessor.updateSettings();
        }
      }

      streamUniforms.uPrimaryColor.value.set(params.primaryColor);
      streamUniforms.uSecondaryColor.value.set(params.secondaryColor);
      streamUniforms.uAccentColor.value.set(params.accentColor);

      ambientLight.color.set(params.ambientColor);
      ambientLight.intensity = params.ambientIntensity;

      topLight.color.set(params.topLightColor);
      topLight.intensity = params.topLightIntensity;
      topLight.position.set(params.topLightPosX, params.topLightPosY, params.topLightPosZ);

      coreLight.color.set(params.coreGlowColor);
      coreLight.intensity = params.coreLightIntensity;
      coreLight.distance = params.coreLightDistance;

      bottomLight.color.set(params.bottomLightColor);
      bottomLight.intensity = params.bottomLightIntensity;

      dustMat.color.set(params.primaryColor);
    }

    // =========================================================================
    // RANDOM PROCEDURAL VARIATION ON CLICK
    // NOTE: PostProcessor settings are strictly PRESERVED and NOT shuffled or changed!
    // =========================================================================
    function randomizeScene() {
      // 1. Randomly pick color scheme from 19+ preconfigured presets
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const randomSchemeKey = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      applyColorScheme(randomSchemeKey);

      // 2. Re-roll geometric & motion parameters
      params.animationSpeed = 0.3 + Math.random() * 0.25;
      params.streamAngle = (Math.random() - 0.5) * 0.85;
      params.streamDirection = Math.abs(params.streamAngle) > 0.12 ? 'Diagonal' : 'Vertical';
      params.voidRadius = 11.0 + Math.random() * 8.0;
      params.glowIntensity = 1.4 + Math.random() * 0.8;
      params.glitchSpeed = 0.8 + Math.random() * 1.4;
      params.trailLength = 20.0 + Math.random() * 16.0;

      // 3. Randomize camera choreography
      const randomAnim = ANIMATION_PRESETS[Math.floor(Math.random() * ANIMATION_PRESETS.length)];
      params.cameraAnimation = randomAnim;

      // 4. Subtle lighting variation
      params.exposure = 1.0 + Math.random() * 0.35;
      renderer.toneMappingExposure = params.exposure;
      params.coreLightIntensity = 2.5 + Math.random() * 3.0;

      // Update stream uniforms
      streamUniforms.uSpeed.value = params.animationSpeed;
      streamUniforms.uTiltAngle.value = params.streamAngle;
      streamUniforms.uVoidRadius.value = params.voidRadius;
      streamUniforms.uGlowIntensity.value = params.glowIntensity;
      streamUniforms.uGlitchSpeed.value = params.glitchSpeed;
      streamUniforms.uTrailLength.value = params.trailLength;
      createTitleZoneGuides(params.voidRadius);

      // 5. Update only scene controllers in GUI (DO NOT touch Post-Processing Suite!)
      fTheme.controllersRecursive().forEach(c => c.updateDisplay());
      fStream.controllersRecursive().forEach(c => c.updateDisplay());
      fCamera.controllersRecursive().forEach(c => c.updateDisplay());
      fLight.controllersRecursive().forEach(c => c.updateDisplay());
      fRender.controllersRecursive().forEach(c => c.updateDisplay());
    }

    // Differentiate click from drag/pan
    let pointerDownTime = 0;
    let pointerDownPos = new THREE.Vector2();

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.lil-gui')) return;
      pointerDownTime = performance.now();
      pointerDownPos.set(e.clientX, e.clientY);
    });

    window.addEventListener('pointerup', (e) => {
      if (e.target.closest('.lil-gui')) return;
      const duration = performance.now() - pointerDownTime;
      const dist = pointerDownPos.distanceTo(new THREE.Vector2(e.clientX, e.clientY));

      if (dist < 6 && duration < 320) {
        if (params.randomizeOnClick) {
          randomizeScene();
        }
      }
    });

    // =========================================================================
    // LIL-GUI CONTROL PANEL (Standard lil-gui styles without modification)
    // =========================================================================
    const gui = new GUI({ title: 'Matrix Binary Stream Loop' });

    // Folder: Themes & Colors
    const fTheme = gui.addFolder('Theme & Colors');
    fTheme.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Preset Scheme').onChange(applyColorScheme);
    fTheme.add(params, 'greenscreen').name('Greenscreen (#00ff00)').onChange(updateColorsInScene);
    fTheme.addColor(params, 'primaryColor').name('Primary Stream').onChange(updateColorsInScene);
    fTheme.addColor(params, 'secondaryColor').name('Secondary Tail').onChange(updateColorsInScene);
    fTheme.addColor(params, 'accentColor').name('Head Accent').onChange((v) => {
      updateColorsInScene();
      createTitleZoneGuides(params.voidRadius);
    });
    fTheme.addColor(params, 'backgroundColor').name('Background').onChange(updateColorsInScene);
    fTheme.addColor(params, 'coreGlowColor').name('Core Void Glow').onChange(updateColorsInScene);

    // Folder: Stream Dynamics & Optics
    const fStream = gui.addFolder('Stream & Dynamics');
    fStream.add(params, 'animationSpeed', 0.05, 2.0, 0.05).name('Stream Speed').onChange((v) => {
      streamUniforms.uSpeed.value = v;
    });
    fStream.add(params, 'streamDirection', ['Vertical', 'Diagonal']).name('Stream Direction').onChange((v) => {
      if (v === 'Vertical') {
        params.streamAngle = 0.0;
      } else {
        params.streamAngle = 0.45;
      }
      streamUniforms.uTiltAngle.value = params.streamAngle;
      fStream.controllersRecursive().forEach(c => c.updateDisplay());
    });
    fStream.add(params, 'streamAngle', -0.85, 0.85, 0.02).name('Tilt Angle (rad)').onChange((v) => {
      streamUniforms.uTiltAngle.value = v;
      params.streamDirection = Math.abs(v) > 0.1 ? 'Diagonal' : 'Vertical';
      fStream.controllersRecursive().forEach(c => c.updateDisplay());
    });
    fStream.add(params, 'voidRadius', 6.0, 24.0, 0.2).name('Title Void Radius').onChange((v) => {
      streamUniforms.uVoidRadius.value = v;
      createTitleZoneGuides(v);
    });
    fStream.add(params, 'showTitleGuides').name('Show Title Guides').onChange(() => {
      createTitleZoneGuides(params.voidRadius);
    });
    fStream.add(params, 'glowIntensity', 0.5, 3.5, 0.05).name('Stream Emission').onChange((v) => {
      streamUniforms.uGlowIntensity.value = v;
    });
    fStream.add(params, 'glitchSpeed', 0.2, 3.0, 0.05).name('Glitch Frequency').onChange((v) => {
      streamUniforms.uGlitchSpeed.value = v;
    });
    fStream.add(params, 'trailLength', 8.0, 42.0, 1.0).name('Drop Trail Length').onChange((v) => {
      streamUniforms.uTrailLength.value = v;
    });

    // Folder: Camera & Animation Presets (8 Presets + Static)
    const fCamera = gui.addFolder('Camera Choreography');
    fCamera.add(params, 'cameraAnimation', ANIMATION_PRESETS).name('Animation Mode');
    fCamera.add(params, 'resetView').name('Reset Camera View');

    // Folder: Lighting & Exposure
    const fLight = gui.addFolder('Lighting & Exposure');
    fLight.add(params, 'exposure', 0.2, 3.0, 0.05).name('Tone Exposure').onChange((v) => {
      renderer.toneMappingExposure = v;
    });
    fLight.add(params, 'ambientIntensity', 0.0, 3.0, 0.05).name('Ambient Intensity').onChange(updateColorsInScene);
    fLight.addColor(params, 'ambientColor').name('Ambient Color').onChange(updateColorsInScene);
    fLight.add(params, 'topLightIntensity', 0.0, 5.0, 0.1).name('Top Light Int.').onChange(updateColorsInScene);
    fLight.addColor(params, 'topLightColor').name('Top Light Color').onChange(updateColorsInScene);
    fLight.add(params, 'topLightPosX', -40.0, 40.0, 1.0).name('Top Light X').onChange(updateColorsInScene);
    fLight.add(params, 'topLightPosY', 0.0, 60.0, 1.0).name('Top Light Y').onChange(updateColorsInScene);
    fLight.add(params, 'topLightPosZ', -40.0, 40.0, 1.0).name('Top Light Z').onChange(updateColorsInScene);
    fLight.add(params, 'coreLightIntensity', 0.0, 8.0, 0.1).name('Core Light Int.').onChange(updateColorsInScene);
    fLight.addColor(params, 'coreLightColor').name('Core Light Color').onChange(updateColorsInScene);
    fLight.add(params, 'coreLightDistance', 10.0, 100.0, 1.0).name('Core Light Range').onChange(updateColorsInScene);
    fLight.add(params, 'bottomLightIntensity', 0.0, 4.0, 0.1).name('Fill Light Int.').onChange(updateColorsInScene);
    fLight.addColor(params, 'bottomLightColor').name('Fill Light Color').onChange(updateColorsInScene);

    // Attach Post-Processing Suite (Universal Gaussian Bloom, Chromatic Aberration, Anamorphic Flare, Godrays)
    postProcessor.attachGUI(gui, "Post-Processing Suite");

    // Folder: Render & Performance
    const fRender = gui.addFolder('Render & Performance');
    fRender.add(params, 'dpr', 0.5, 3.0, 0.1).name('Pixel Ratio (DPR)').onChange((v) => {
      renderer.setPixelRatio(v);
      postProcessor.setSize(window.innerWidth, window.innerHeight, v);
    });
    fRender.add(params, 'antialias').name('Antialias (MSAA)').onChange((v) => {
      initRenderer(v);
    });
    fRender.add(params, 'randomizeOnClick').name('Click Scene: Re-Roll');

    // =========================================================================
    // HIDE / SHOW UI WITH "H" KEY
    // =========================================================================
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        gui._hidden ? gui.show() : gui.hide();
      }
    });

    // =========================================================================
    // WINDOW RESIZE HANDLER
    // =========================================================================
    window.addEventListener('resize', () => {
      const width = window.innerWidth;
      const height = window.innerHeight;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
      postProcessor.setSize(width, height, params.dpr);
    });

    // =========================================================================
    // MAIN ANIMATION LOOP
    // =========================================================================
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const time = clock.getElapsedTime();

      streamUniforms.uTime.value = time;

      // Animate ambient dust particles gently
      const dustAttr = dustGeo.attributes.position;
      const dustCount = dustAttr.count;
      for (let i = 0; i < dustCount; i++) {
        let py = dustAttr.getY(i);
        py -= delta * 5.0 * params.animationSpeed;
        if (py < -TOTAL_HEIGHT * 0.5) {
          py += TOTAL_HEIGHT;
        }
        dustAttr.setY(i, py);
      }
      dustAttr.needsUpdate = true;

      if (titleGroup.children.length > 0) {
        titleGroup.rotation.y = time * 0.08 * params.animationSpeed;
      }

      // Camera Animation Choreography (8 smooth slow modes + static)
      const animMode = params.cameraAnimation;
      const animSpeed = params.animationSpeed * 0.45;

      if (!controls.state || controls.state === -1) {
        if (animMode === 'Static Void (No Camera Movement)') {
          // Camera stationary, focused on central title clearing
        } else if (animMode === 'Vertical Descent (Slow Drift)') {
          const t = time * animSpeed;
          camera.position.y = Math.sin(t * 0.8) * 6.0;
          camera.position.z = 42.0 + Math.cos(t * 0.5) * 3.5;
          controls.target.y = Math.sin(t * 0.8) * 2.0;
        } else if (animMode === 'Diagonal Cyber Torrent') {
          streamUniforms.uTiltAngle.value = 0.42 + Math.sin(time * animSpeed * 0.5) * 0.12;
          const t = time * animSpeed;
          camera.position.x = Math.sin(t * 0.7) * 8.0;
          camera.position.y = Math.cos(t * 0.6) * 5.0;
          camera.position.z = 40.0 + Math.sin(t * 0.4) * 4.0;
        } else if (animMode === 'Orbital Panorama') {
          const t = time * animSpeed * 0.4;
          const orbRadius = 42.0;
          camera.position.x = Math.sin(t) * orbRadius;
          camera.position.z = Math.cos(t) * orbRadius;
          camera.position.y = Math.sin(t * 1.5) * 6.0;
          controls.target.set(0, 0, 0);
        } else if (animMode === 'Harmonic Sway') {
          const t = time * animSpeed;
          camera.position.x = Math.sin(t * 0.7) * 9.0;
          camera.position.y = Math.sin(t * 1.1) * 5.0;
          camera.position.z = 41.0 + Math.cos(t * 0.5) * 3.0;
          controls.target.set(Math.sin(t * 0.7) * 1.5, Math.sin(t * 1.1) * 1.0, 0);
        } else if (animMode === 'Deep Core Fly-Through') {
          const t = time * animSpeed * 2.2;
          const loopSpan = 60.0;
          const zPos = 48.0 - (t % loopSpan);
          camera.position.set(Math.sin(t * 0.2) * 1.5, Math.cos(t * 0.2) * 1.0, zPos);
          controls.target.set(0, 0, zPos - 20.0);
        } else if (animMode === 'Zenith Ascension') {
          const t = time * animSpeed * 0.35;
          camera.position.set(Math.sin(t) * 16.0, -18.0 + Math.sin(t * 1.5) * 2.5, Math.cos(t) * 28.0);
          controls.target.set(0, 6.0, 0);
        } else if (animMode === 'Helical Spiral') {
          const t = time * animSpeed * 0.5;
          const spiralRadius = 38.0;
          camera.position.x = Math.sin(t) * spiralRadius;
          camera.position.z = Math.cos(t) * spiralRadius;
          camera.position.y = Math.sin(t * 0.8) * 14.0;
          controls.target.set(0, 0, 0);
        }
      }

      controls.update();

      // Render through PostProcessor pipeline (Atmospheric Bloom, Chromatic Dispersion, Film Grain, Vignette)
      postProcessor.renderScene(scene, camera);
    }

    animate();
  </script>
</body>
</html>
