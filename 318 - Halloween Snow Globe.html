    // 10. Swirling Autumn Leaves Particles (Realistic 3D Curved Autumn Maple Leaf)
    function createAutumnLeafGeometry() {
      const shape = new THREE.Shape();
      // Stem base
      shape.moveTo(0.0, -0.065);
      shape.lineTo(-0.005, -0.045);

      // Basal left lobe
      shape.bezierCurveTo(-0.020, -0.042, -0.034, -0.025, -0.026, -0.008);
      shape.lineTo(-0.016, 0.002);

      // Main pointed left lobe
      shape.bezierCurveTo(-0.042, 0.010, -0.052, 0.032, -0.036, 0.045);
      shape.lineTo(-0.022, 0.050);

      // Central pointed tip
      shape.bezierCurveTo(-0.016, 0.066, -0.008, 0.080, 0.0, 0.090);

      // Central pointed tip (right side)
      shape.bezierCurveTo(0.008, 0.080, 0.016, 0.066, 0.022, 0.050);

      // Main pointed right lobe
      shape.lineTo(0.036, 0.045);
      shape.bezierCurveTo(0.052, 0.032, 0.042, 0.010, 0.016, 0.002);

      // Basal right lobe
      shape.lineTo(0.026, -0.008);
      shape.bezierCurveTo(0.034, -0.025, 0.020, -0.042, 0.005, -0.045);

      // Back to stem base
      shape.lineTo(0.0, -0.065);

      const geo = new THREE.ShapeGeometry(shape, 4);
      const pos = geo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i);
        const y = pos.getY(i);
        // Realistic 3D V-fold along the central spine + natural curl along length
        const fold = Math.pow(Math.abs(x) / 0.05, 1.2) * 0.014;
        const curl = (y > 0.01) ? Math.sin((y - 0.01) * 20.0) * 0.007 : -0.003;
        pos.setZ(i, fold + curl);
      }
      geo.center();
      geo.computeVertexNormals();
      return geo;
    }

    const leafCount = 220;
    const leafGeo = createAutumnLeafGeometry();

    const leafMat = new THREE.MeshStandardMaterial({
      roughness: 0.55,
      metalness: 0.08,
      side: THREE.DoubleSide
    });

    const leavesMesh = new THREE.InstancedMesh(leafGeo, leafMat, leafCount);
    leavesMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);

    const leafColors = new Float32Array(leafCount * 3);
    const leavesData = [];

    function initLeaves() {
      const c1 = new THREE.Color(params.leaves1);
      const c2 = new THREE.Color(params.leaves2);

      for (let i = 0; i < leafCount; i++) {
        const isPrimary = Math.random() > 0.45;
        const col = isPrimary ? c1.clone() : c2.clone();
        col.offsetHSL((Math.random() - 0.5) * 0.08, (Math.random() - 0.5) * 0.1, (Math.random() - 0.5) * 0.1);
        col.toArray(leafColors, i * 3);

        leavesData[i] = {
          radius: 0.35 + Math.random() * 1.55,
          angle: Math.random() * Math.PI * 2,
          y: 0.3 + Math.random() * 1.8,
          speed: 0.6 + Math.random() * 1.1,
          fallSpeed: 0.2 + Math.random() * 0.35,
          rotX: Math.random() * Math.PI * 2,
          rotY: Math.random() * Math.PI * 2,
          rotZ: Math.random() * Math.PI * 2,
          rotSpeedX: (Math.random() - 0.5) * 3.5,
          rotSpeedZ: (Math.random() - 0.5) * 3.5,
          scale: 0.65 + Math.random() * 0.65,
          isPrimary
        };
      }
      leavesMesh.instanceColor = new THREE.InstancedBufferAttribute(leafColors, 3);
      leavesMesh.instanceColor.needsUpdate = true;
    }
    initLeaves();
    scene.add(leavesMesh);

    // 11. Drifting Spectral Dust / Fluid Sparkles
    const dustCount = 220;
    const dustGeo = new THREE.BufferGeometry();
    const dustPos = new Float32Array(dustCount * 3);
    const dustData = [];

    for (let i = 0; i < dustCount; i++) {
      const u = Math.random();
      const v = Math.random();
      const theta = u * 2.0 * Math.PI;
      const phi = Math.acos(2.0 * v - 1.0);
      const r = Math.cbrt(Math.random()) * 1.95;
      const x = r * Math.sin(phi) * Math.cos(theta);
      const y = 1.25 + r * Math.cos(phi) * 0.85;
      const z = r * Math.sin(phi) * Math.sin(theta);

      dustPos[i * 3] = x;
      dustPos[i * 3 + 1] = Math.max(0.3, y);
      dustPos[i * 3 + 2] = z;

      dustData.push({
        phase: Math.random() * Math.PI * 2,
        driftSpeed: 0.2 + Math.random() * 0.4
      });
    }
    dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));

    const dustCanvas = document.createElement('canvas');
    dustCanvas.width = 32;
    dustCanvas.height = 32;
    const dCtx = dustCanvas.getContext('2d');
    const radGrad = dCtx.createRadialGradient(16, 16, 0, 16, 16, 16);
    radGrad.addColorStop(0, 'rgba(255, 255, 255, 1)');
    radGrad.addColorStop(0.4, 'rgba(255, 235, 200, 0.7)');
    radGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
    dCtx.fillStyle = radGrad;
    dCtx.fillRect(0, 0, 32, 32);
    const dustTexture = new THREE.CanvasTexture(dustCanvas);

    const dustMat = new THREE.PointsMaterial({
      size: 0.055,
      map: dustTexture,
      transparent: true,
      opacity: 0.65,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const dustPoints = new THREE.Points(dustGeo, dustMat);
    scene.add(dustPoints);

    // 12. Glass Sphere Dome (Rendered with Transmission & Refraction)
    const globeGeo = new THREE.SphereGeometry(2.25, 64, 48);
    const globeMesh = new THREE.Mesh(globeGeo, globeMat);
    globeMesh.position.set(0, 1.25, 0);
    globeMesh.renderOrder = 10;
    scene.add(globeMesh);

    // --- COLOR & PALETTE UPDATER ---
    function updateColors() {
      if (params.greenscreen) {
        scene.background = new THREE.Color(0x00ff00);
        scene.fog.color.setHex(0x00ff00);
        scene.fog.near = 1000;
        scene.fog.far = 2000;
        renderer.setClearColor(0x00ff00, 1);
        document.body.style.backgroundColor = '#00ff00';
      } else {
        scene.background = new THREE.Color(params.bgColor);
        scene.fog.color.set(params.fogColor);
        scene.fog.near = 7;
        scene.fog.far = 24;
        renderer.setClearColor(params.bgColor, 1);
        document.body.style.backgroundColor = params.bgColor;
      }

      groundMat.color.set(params.groundColor);
      houseMat.color.set(params.housesColor);
      roofMat.color.set(params.roofsColor);
      woodMat.color.set(params.woodColor);

      windowGlowMat.color.set(params.windowGlow);

      ghostMat.color.set(params.ghostColor);
      ghostMat.emissive.set(params.ghostColor);

      pumpkinMat.color.set(params.leaves1);

      baseMat.color.set(params.baseColor);
      baseTrimMat.color.set(params.baseTrimColor);

      globeMat.color.set(params.globeTint);
      globeMat.transmission = params.transmission;
      globeMat.roughness = params.glassRoughness;
      globeMat.ior = params.glassIor;

      dirLight.color.set(params.lightColor);
      dirLight.intensity = params.lightIntensity;
      ambientLight.intensity = params.ambientIntensity;
      pumpkinPointLight.color.set(params.windowGlow);
      pumpkinPointLight.intensity = params.pumpkinGlow;
      interiorRimLight.color.set(params.lightColor);

      postProcessor.settings.exposure = params.exposure;
      postProcessor.updateSettings();

      const c1 = new THREE.Color(params.leaves1);
      const c2 = new THREE.Color(params.leaves2);
      for (let i = 0; i < leafCount; i++) {
        const col = leavesData[i].isPrimary ? c1.clone() : c2.clone();
        col.offsetHSL((Math.random() - 0.5) * 0.08, (Math.random() - 0.5) * 0.1, (Math.random() - 0.5) * 0.1);
        col.toArray(leafColors, i * 3);
      }
      leavesMesh.instanceColor.needsUpdate = true;
    }

    function applyColorScheme(schemeName) {
      const s = COLOR_SCHEMES[schemeName];
      if (!s) return;
      params.colorScheme = schemeName;
      params.bgColor = s.bg;
      params.fogColor = s.fog;
      params.groundColor = s.ground;
      params.housesColor = s.houses;
      params.roofsColor = s.roof;
      params.woodColor = s.wood;
      params.windowGlow = s.windowGlow;
      params.ghostColor = s.ghost;
      params.leaves1 = s.leaves1;
      params.leaves2 = s.leaves2;
      params.baseColor = s.base;
      params.baseTrimColor = s.baseTrim;
      params.lightColor = s.lightColor;
      params.globeTint = s.globeTint;

      updateColors();
      if (gui) {
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      }
    }

    // --- PROCEDURAL RE-ROLL ON CLICK ---
    // Important: Re-rolls only scene theme, motion, and lights; DOES NOT shuffle or change PostProcessor settings!
    function rerollScene() {
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      applyColorScheme(randomScheme);

      // Re-roll motion and scene parameters ONLY (PostProcessor settings remain untouched!)
      params.speed = 0.8 + Math.random() * 0.8;
      params.leafSwirlSpeed = 0.7 + Math.random() * 1.0;
      params.ghostSpeed = 0.8 + Math.random() * 0.8;
      params.lightIntensity = 0.9 + Math.random() * 0.8;
      params.pumpkinGlow = 1.2 + Math.random() * 1.4;
      params.glassRoughness = 0.02 + Math.random() * 0.06;

      params.animation = ANIMATION_PRESETS[Math.floor(Math.random() * ANIMATION_PRESETS.length)];

      updateColors();
      if (gui) {
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      }
    }

    // Distinguish click from camera orbit/pan drag
    let downX = 0;
    let downY = 0;
    let downTime = 0;

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.lil-gui')) return;
      downX = e.clientX;
      downY = e.clientY;
      downTime = performance.now();
    });

    window.addEventListener('pointerup', (e) => {
      if (e.target.closest('.lil-gui')) return;
      const dx = e.clientX - downX;
      const dy = e.clientY - downY;
      const dist = Math.hypot(dx, dy);
      const duration = performance.now() - downTime;

      if (dist < 6 && duration < 400 && params.clickToReroll) {
        rerollScene();
      }
    });

    // --- LIL-GUI SETUP (Native default styling, unpkg esm) ---
    const gui = new GUI({ title: '🔮 Halloween Globe' });

    // 1. Scene & Camera Folder
    const fScene = gui.addFolder('Display & Camera');
    fScene.add(params, 'greenscreen').name('Green Screen (#00ff00)').onChange(updateColors);
    fScene.add(params, 'dpr', 0.5, 3.0, 0.25).name('Pixel Ratio (DPR)').onChange((v) => {
      renderer.setPixelRatio(v);
      postProcessor.setSize(window.innerWidth, window.innerHeight, v);
    });
    fScene.add(params, 'exposure', 0.2, 3.0, 0.05).name('Exposure').listen().onChange((v) => {
      postProcessor.settings.exposure = v;
      postProcessor.updateSettings();
    });
    fScene.add(params, 'lightIntensity', 0.2, 4.0, 0.1).name('Scene Light Intensity').onChange(updateColors);
    fScene.add(params, 'ambientIntensity', 0.0, 2.0, 0.05).name('Ambient Light').onChange(updateColors);
    fScene.add(params, 'animation', ANIMATION_PRESETS).name('Animation Mode');
    fScene.add(params, 'speed', 0.0, 3.0, 0.1).name('Animation Speed');
    fScene.add(params, 'clickToReroll').name('Click Scene to Re-roll');
    fScene.add(params, 'reroll').name('🎲 Re-roll Scene Now');

    // 2. Post-Processing Suite (Attached from PostProcessor.js)
    postProcessor.attachGUI(gui, 'Post Processor Settings');

    // 3. Color Schemes Folder (18 preconfigured schemes)
    const fColors = gui.addFolder('Color Schemes (18 Presets)');
    fColors.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Color Scheme').onChange(applyColorScheme);
    fColors.addColor(params, 'bgColor').name('Background').onChange(updateColors);
    fColors.addColor(params, 'fogColor').name('Fog Color').onChange(updateColors);
    fColors.addColor(params, 'groundColor').name('Ground Terrain').onChange(updateColors);
    fColors.addColor(params, 'housesColor').name('House Walls').onChange(updateColors);
    fColors.addColor(params, 'roofsColor').name('Roofs & Spires').onChange(updateColors);
    fColors.addColor(params, 'woodColor').name('Trees & Fences').onChange(updateColors);
    fColors.addColor(params, 'windowGlow').name('Window Glow').onChange(updateColors);
    fColors.addColor(params, 'ghostColor').name('Ghost Hue').onChange(updateColors);
    fColors.addColor(params, 'leaves1').name('Leaves (Primary)').onChange(updateColors);
    fColors.addColor(params, 'leaves2').name('Leaves (Secondary)').onChange(updateColors);
    fColors.addColor(params, 'baseColor').name('Pedestal Base').onChange(updateColors);
    fColors.addColor(params, 'baseTrimColor').name('Base Trim').onChange(updateColors);
    fColors.addColor(params, 'globeTint').name('Glass Globe Tint').onChange(updateColors);
    fColors.addColor(params, 'lightColor').name('Moonlight Color').onChange(updateColors);
    fColors.close();

    // 4. Globe Optical & Motion Settings
    const fGlobe = gui.addFolder('Globe & Dynamics');
    fGlobe.add(params, 'transmission', 0.8, 1.0, 0.01).name('Glass Transmission').onChange(updateColors);
    fGlobe.add(params, 'glassRoughness', 0.0, 0.25, 0.01).name('Glass Roughness').onChange(updateColors);
    fGlobe.add(params, 'glassIor', 1.0, 2.0, 0.01).name('Refraction (IOR)').onChange(updateColors);
    fGlobe.add(params, 'leafSwirlSpeed', 0.1, 3.0, 0.1).name('Leaf Swirl Speed');
    fGlobe.add(params, 'ghostSpeed', 0.1, 3.0, 0.1).name('Ghost Speed');
    fGlobe.add(params, 'pumpkinGlow', 0.0, 3.5, 0.1).name('Pumpkin Glow').onChange(updateColors);
    fGlobe.close();

    // Hide/show GUI with 'H' key
    window.addEventListener('keydown', (e) => {
      if (e.code === 'KeyH' || e.key === 'h' || e.key === 'H') {
        if (gui._hidden) {
          gui.show();
        } else {
          gui.hide();
        }
      }
    });

    // --- ANIMATION LOOP ---
    const clock = new THREE.Clock();
    const leafDummy = new THREE.Object3D();
    const finialWorldPos = new THREE.Vector3(0, 3.5, 0);
    const finialScreenPos = new THREE.Vector3();
    let totalTime = 0;

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta() * params.speed;
      totalTime += delta;

      // 1. Camera Animation Modes (Smooth & Slow)
      if (!isUserInteracting) {
        const ct = totalTime * 0.25;
        const targetPos = new THREE.Vector3(0, 1.25, 0);

        switch (params.animation) {
          case 'Static (No Camera Motion)':
            break;

          case 'Slow Cinematic Orbit': {
            const rad = 6.4;
            camera.position.x = Math.sin(ct * 0.5) * rad;
            camera.position.z = Math.cos(ct * 0.5) * rad;
            camera.position.y = 1.9 + Math.sin(ct * 0.3) * 0.45;
            controls.target.copy(targetPos);
            break;
          }

          case 'Gentle Floating Wobble': {
            camera.position.x = Math.sin(ct * 0.4) * 0.9;
            camera.position.y = 1.8 + Math.sin(ct * 0.6) * 0.5;
            camera.position.z = 6.2 + Math.cos(ct * 0.3) * 0.4;
            controls.target.copy(targetPos);
            break;
          }

          case 'Spooky Spiral Ascent': {
            const angle = ct * 0.45;
            const h = 1.4 + Math.sin(ct * 0.35) * 1.5;
            const r = 6.2 - (h - 1.4) * 0.4;
            camera.position.x = Math.sin(angle) * r;
            camera.position.z = Math.cos(angle) * r;
            camera.position.y = h;
            controls.target.copy(targetPos);
            break;
          }

          case 'Haunted Village Inspection': {
            const angle = Math.sin(ct * 0.35) * 0.65;
            camera.position.x = Math.sin(angle) * 4.4;
            camera.position.z = Math.cos(angle) * 4.4;
            camera.position.y = 1.35 + Math.sin(ct * 0.5) * 0.3;
            controls.target.set(Math.sin(ct * 0.2) * 0.25, 1.1, Math.cos(ct * 0.2) * 0.2);
            break;
          }

          case 'Pendulum Swing': {
            const swing = Math.sin(ct * 0.65) * 1.05;
            camera.position.x = Math.sin(swing) * 6.2;
            camera.position.z = Math.cos(swing) * 6.2;
            camera.position.y = 1.6 + (1 - Math.cos(swing)) * 0.8;
            controls.target.copy(targetPos);
            break;
          }

          case 'Mystic Breath & Dolly': {
            const dist = 5.8 + Math.sin(ct * 0.5) * 1.6;
            camera.position.x = Math.sin(ct * 0.25) * 1.1;
            camera.position.z = dist;
            camera.position.y = 1.9 + Math.cos(ct * 0.3) * 0.45;
            controls.target.copy(targetPos);
            break;
          }

          case 'Eerie Tilt & Pan': {
            camera.position.x = Math.sin(ct * 0.4) * 4.9;
            camera.position.y = 1.7 + Math.sin(ct * 0.8) * 0.85;
            camera.position.z = 4.4 + Math.cos(ct * 0.4) * 2.0;
            controls.target.copy(targetPos);
            break;
          }
        }
      }

      controls.update();

      // 2. Swirling Autumn Leaves Simulation
      for (let i = 0; i < leafCount; i++) {
        const d = leavesData[i];
        d.angle += d.speed * delta * params.leafSwirlSpeed;
        d.y -= d.fallSpeed * delta;
        d.rotX += d.rotSpeedX * delta;
        d.rotZ += d.rotSpeedZ * delta;

        const r = d.radius + Math.sin(d.y * 3.5 + d.angle) * 0.12;
        const lx = Math.sin(d.angle) * r;
        const lz = Math.cos(d.angle) * r;

        const dGlobe = Math.hypot(lx, d.y - 1.25, lz);
        if (dGlobe > 2.15 || d.y < 0.18) {
          d.y = 2.15;
          d.radius = 0.3 + Math.random() * 1.4;
        }

        leafDummy.position.set(lx, d.y, lz);
        leafDummy.rotation.set(d.rotX, d.angle + d.rotY, d.rotZ);
        leafDummy.scale.setScalar(d.scale);
        leafDummy.updateMatrix();
        leavesMesh.setMatrixAt(i, leafDummy.matrix);
      }
      leavesMesh.instanceMatrix.needsUpdate = true;

      // 3. Spectral Dust Gentle Drift
      const dPositions = dustGeo.attributes.position;
      for (let i = 0; i < dustCount; i++) {
        let dy = dPositions.getY(i);
        let dx = dPositions.getX(i);
        let dz = dPositions.getZ(i);

        dy += (Math.sin(totalTime * 0.6 + dustData[i].phase) * 0.0025 - 0.0008) * params.speed;
        dx += Math.sin(totalTime * 0.4 + dustData[i].phase) * 0.0012 * params.speed;
        dz += Math.cos(totalTime * 0.4 + dustData[i].phase) * 0.0012 * params.speed;

        if (dy < 0.25) dy = 2.15;
        if (dy > 2.2) dy = 0.25;

        dPositions.setXYZ(i, dx, dy, dz);
      }
      dPositions.needsUpdate = true;

      // 4. Ghost Flying Motion (Smooth Lissajous & Bobbing)
      ghosts.forEach((g) => {
        const gt = totalTime * g.speed * params.ghostSpeed + g.phase;
        const gx = g.center.x + Math.sin(gt) * g.radius;
        const gz = g.center.z + Math.cos(gt) * g.radius;
        const gy = g.center.y + Math.sin(gt * 2.0) * g.bobAmp;

        g.mesh.position.set(gx, gy, gz);
        g.mesh.rotation.y = -gt + Math.PI / 2;
        g.mesh.rotation.z = Math.sin(gt * 2) * 0.12;
      });

      // 5. Floating Enchanted Pumpkins Aerial Patrol
      pumpkins.forEach((p) => {
        const pt = totalTime * p.speed * params.ghostSpeed + p.phase;
        const px = p.center.x + Math.sin(pt) * p.radiusX;
        const pz = p.center.z + (p.isFigure8 ? Math.sin(pt * 2.0) : Math.cos(pt)) * p.radiusZ;
        const py = p.center.y + Math.sin(pt * 1.8) * p.bobAmp;

        p.mesh.position.set(px, py, pz);

        // Orient pumpkin facing its travel direction with natural flight banking
        const vx = Math.cos(pt) * p.radiusX;
        const vz = (p.isFigure8 ? Math.cos(pt * 2.0) * 2.0 : -Math.sin(pt)) * p.radiusZ;
        p.mesh.rotation.y = Math.atan2(vx, vz);
        p.mesh.rotation.z = -vx * 0.4;
        p.mesh.rotation.x = Math.sin(pt * 1.8) * 0.08;
      });

      // 6. Candle / Pumpkin Flickering Light
      const flicker = Math.sin(totalTime * 12.0) * 0.15 + Math.sin(totalTime * 7.0) * 0.1 + (Math.random() - 0.5) * 0.05;
      pumpkinPointLight.intensity = Math.max(0.2, params.pumpkinGlow * (1.0 + flicker));

      // 7. Update Godrays Light Screen Position
      postProcessor.setMoonScreenPosition(camera, finialWorldPos);

      // 8. Render Scene through PostProcessor Pipeline
      postProcessor.renderScene(scene, camera);
    }
    animate();

    // --- RESPONSIVE RESIZE ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);
    });
  </script>
</body>
</html>
