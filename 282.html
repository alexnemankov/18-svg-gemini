<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convective Shear Imaging</title>

    <!-- Import maps polyfill for module resolution -->
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
            }
        }
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
        }

        body.dragging {
            cursor: grabbing;
        }

        body.greenscreen {
            background-color: #00ff00 !important;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        /* lil-gui positioning & scroll */
        .lil-gui {
            user-select: auto;
            -webkit-user-select: auto;
            max-height: 94vh;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <script type="module">
        import * as THREE from 'three';
        import GUI from 'lil-gui';

        let gui;

        // =========================================================================
        // INLINED POST PROCESSOR SUITE (postprocessing/PostProcessor.js)
        // =========================================================================
        const orthoVertexShader = `
        precision highp float;
        in vec3 position;
        out vec2 vUv;
        void main() {
          vUv = position.xy * 0.5 + 0.5;
          gl_Position = vec4(position, 1.0);
        }
        `;

        const brightFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        uniform float bloomThreshold;
        in vec2 vUv;
        out vec4 fragColor;

        void main() {
          vec4 color = texture(inputTexture, vUv);
          float luminance = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
          float knee = 0.1;
          float soft = luminance - bloomThreshold + knee;
          soft = clamp(soft, 0.0, 2.0 * knee);
          soft = (soft * soft) / (4.0 * knee + 0.00001);
          float contribution = max(soft, luminance - bloomThreshold);
          contribution /= max(luminance, 0.00001);
          fragColor = vec4(color.rgb * contribution, color.a);
        }
        `;

        const blur13ShaderChunk = `
        vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
          vec2 resolution = vec2(textureSize(image, 0));
          vec4 color = vec4(0.0);
          vec2 off1 = vec2(1.411764705882353) * direction;
          vec2 off2 = vec2(3.2941176470588234) * direction;
          vec2 off3 = vec2(5.176470588235294) * direction;
          color += texture(image, uv) * 0.1964825501511404;
          color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
          color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
          color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
          color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
          color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
          color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
          return color;
        }
        `;

        const blurFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        uniform vec2 direction;
        in vec2 vUv;
        out vec4 color;
        ${blur13ShaderChunk}
        void main() {
          color = blur13(inputTexture, vUv, direction);
        }
        `;

        const finalFragmentShader = `
        precision highp float;
        uniform vec2 resolution;
        uniform sampler2D inputTexture;
        uniform sampler2D blur0Texture;
        uniform sampler2D blur1Texture;
        uniform sampler2D blur2Texture;
        uniform sampler2D blur3Texture;
        uniform sampler2D blur4Texture;
        uniform bool bloomEnabled;
        uniform float bloomStrength;
        uniform float vignetteBoost;
        uniform float vignetteReduction;
        uniform float noiseIntensity;
        uniform float time;
        in vec2 vUv;
        out vec4 fragColor;

        float vignette(vec2 uv, float boost, float reduction) {
          vec2 position = vUv - 0.5;
          return boost - length(position) * reduction;
        }

        float hash1(uint n) {
          n = (n << 13U) ^ n;
          n = n * (n * n * 15731U + 789221U) + 1376312589U;
          return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
        }

        float noise(in vec2 uv, in float timeVal) {
          uvec2 p = uvec2(uv);
          return hash1(p.x + 1920U * p.y + (1920U * 1080U) * uint(timeVal));
        }

        void main() {
          vec4 color = texture(inputTexture, vUv);

          if (bloomEnabled && bloomStrength > 0.001) {
            vec4 b0 = texture(blur0Texture, vUv);
            vec4 b1 = texture(blur1Texture, vUv);
            vec4 b2 = texture(blur2Texture, vUv);
            vec4 b3 = texture(blur3Texture, vUv);
            vec4 b4 = texture(blur4Texture, vUv);

            vec4 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
            color += bloomSum * bloomStrength;
          }

          color.rgb *= vignette(vUv, vignetteBoost, vignetteReduction);
          color.rgb += noiseIntensity * noise(gl_FragCoord.xy, time);
          fragColor = vec4(color.rgb, 1.0);
        }
        `;

        const chromaticAberrationShaderChunk = `
        vec2 barrelDistortion(vec2 coord, float amt) {
          vec2 cc = coord - 0.5;
          float dist = dot(cc, cc);
          return coord + cc * dist * amt;
        }
        float sat(float t) { return clamp(t, 0.0, 1.0); }
        float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
        float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
        vec4 spectrum_offset(float t) {
          float lo = step(t, 0.5);
          float hi = 1.0 - lo;
          float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
          vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
          return pow(ret, vec4(1.0 / 2.2));
        }
        const float max_distort = 2.2;
        const int num_iter = 8;
        const float reci_num_iter_f = 1.0 / float(num_iter);
        vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
          vec4 sumcol = vec4(0.0);
          vec4 sumw = vec4(0.0);
          for (int i = 0; i < num_iter; ++i) {
            float t = float(i) * reci_num_iter_f;
            vec4 w = spectrum_offset(t);
            sumw += w;
            sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
          }
          return sumcol / sumw;
        }
        `;

        const colorFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        uniform float chromaticAberrationAmount;
        uniform float minInputLevel;
        uniform float maxInputLevel;
        uniform float gammaLevel;
        uniform float fisheyeStrength;
        uniform float fisheyeRadius;
        uniform float time;
        in vec2 vUv;
        out vec4 fragColor;

        ${chromaticAberrationShaderChunk}

        vec2 applyFisheye(vec2 uv, float strength, float radius) {
          if (abs(strength) < 0.0001) return uv;
          vec2 p = uv - 0.5;
          float d = length(p);
          if (d > radius * 1.5) return uv;
          float r = d / max(radius, 0.001);
          float theta = atan(p.y, p.x);
          float rDist = r + strength * (r * r * r);
          return 0.5 + vec2(cos(theta), sin(theta)) * (rDist * radius);
        }

        vec3 gammaCorrect(vec3 color, vec3 gamma) {
          return pow(max(color, vec3(0.0)), 1.0 / gamma);
        }
        vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
          return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
        }
        vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
          return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
        }
        void main() {
          vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
          fragColor = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
          fragColor.rgb = finalLevels(fragColor.rgb, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
          fragColor.a = 1.0;
        }
        `;

        const copyFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        in vec2 vUv;
        out vec4 fragColor;
        void main() {
          fragColor = texture(inputTexture, vUv);
        }
        `;

        function createFBO(w, h, options = {}) {
          return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
            wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
            wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
            minFilter: options.minFilter || THREE.LinearFilter,
            magFilter: options.magFilter || THREE.LinearFilter,
            format: options.format || THREE.RGBAFormat,
            type: options.type || THREE.HalfFloatType,
            stencilBuffer: options.stencilBuffer || false,
            depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : true,
            samples: options.samples || 0,
          });
        }

        class ShaderPass {
          constructor(shader, options = {}) {
            this.shader = shader;
            this.orthoScene = new THREE.Scene();
            this.fbo = createFBO(1, 1, options);
            this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
            this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
            this.orthoScene.add(this.orthoQuad);
            this.texture = this.fbo.texture;
          }
          render(renderer, toScreen = false) {
            if (!toScreen) {
              renderer.setRenderTarget(this.fbo);
            }
            renderer.render(this.orthoScene, this.orthoCamera);
            if (!toScreen) {
              renderer.setRenderTarget(null);
            }
          }
          setSize(width, height) {
            this.fbo.setSize(Math.max(1, width), Math.max(1, height));
            this.orthoQuad.scale.set(width, height, 1);
          }
        }

        class ShaderPingPongPass {
          constructor(shader, options = {}) {
            this.shader = shader;
            this.orthoScene = new THREE.Scene();
            this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
            this.currentFBO = 0;
            this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
            this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
            this.orthoScene.add(this.orthoQuad);
          }
          render(renderer) {
            renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
            renderer.render(this.orthoScene, this.orthoCamera);
            renderer.setRenderTarget(null);
            this.currentFBO = 1 - this.currentFBO;
          }
          get current() { return this.fbos[this.currentFBO]; }
          get texture() { return this.current.texture; }
          setSize(width, height) {
            const w = Math.max(1, width);
            const h = Math.max(1, height);
            this.orthoQuad.scale.set(w, h, 1);
            this.fbos[0].setSize(w, h);
            this.fbos[1].setSize(w, h);
          }
        }

        class BloomPass {
          constructor(strength = 0.8, radius = 0.5, threshold = 0.2, levels = 5) {
            this.strength = strength;
            this.radius = radius;
            this.threshold = threshold;
            this.enabled = true;
            this.levels = levels;

            this.brightShader = new THREE.RawShaderMaterial({
              uniforms: {
                inputTexture: { value: null },
                bloomThreshold: { value: this.threshold },
              },
              vertexShader: orthoVertexShader,
              fragmentShader: brightFragmentShader,
              glslVersion: THREE.GLSL3,
            });
            this.brightPass = new ShaderPass(this.brightShader, {
              format: THREE.RGBAFormat,
              type: THREE.HalfFloatType,
            });

            this.blurShader = new THREE.RawShaderMaterial({
              uniforms: {
                inputTexture: { value: null },
                direction: { value: new THREE.Vector2(0, 1) },
              },
              vertexShader: orthoVertexShader,
              fragmentShader: blurFragmentShader,
              glslVersion: THREE.GLSL3,
            });

            this.blurPasses = [];
            for (let i = 0; i < this.levels; i++) {
              this.blurPasses.push(new ShaderPingPongPass(this.blurShader, {
                format: THREE.RGBAFormat,
                type: THREE.HalfFloatType,
              }));
            }
          }

          setSize(w, h) {
            let tw = Math.max(1, w);
            let th = Math.max(1, h);
            this.brightPass.setSize(tw, th);
            for (let i = 0; i < this.levels; i++) {
              tw = Math.max(1, Math.round(tw / 2));
              th = Math.max(1, Math.round(th / 2));
              this.blurPasses[i].setSize(tw, th);
            }
          }

          set source(texture) {
            this.brightShader.uniforms.inputTexture.value = texture;
          }

          render(renderer) {
            if (!this.enabled || this.strength <= 0.001) return;

            this.brightShader.uniforms.bloomThreshold.value = this.threshold;
            this.brightPass.render(renderer);

            const baseOffset = Math.max(0.1, this.radius * 2.0);
            const u = this.blurShader.uniforms;

            for (let j = 0; j < this.levels; j++) {
              const blurPass = this.blurPasses[j];
              const stepOffset = baseOffset * (1.0 + j * 0.5);

              u.direction.value.set(stepOffset, 0);
              u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
              blurPass.render(renderer);

              u.direction.value.set(0, stepOffset * 0.5);
              u.inputTexture.value = blurPass.current.texture;
              blurPass.render(renderer);
            }
          }
        }

        class PostProcessor {
          constructor(renderer, params = {}) {
            this.renderer = renderer;

            this.settings = {
              enabled: params.enabled !== undefined ? params.enabled : true,
              bloomEnabled: params.bloomEnabled !== undefined ? params.bloomEnabled : true,
              bloomStrength: params.bloomStrength !== undefined ? params.bloomStrength : 0.8,
              bloomRadius: params.bloomRadius !== undefined ? params.bloomRadius : 0.5,
              bloomThreshold: params.bloomThreshold !== undefined ? params.bloomThreshold : 0.2,

              fisheyeStrength: params.fisheyeStrength !== undefined ? params.fisheyeStrength : 0.0,
              fisheyeRadius: params.fisheyeRadius !== undefined ? params.fisheyeRadius : 1.0,
              chromaticAberration: params.chromaticAberration !== undefined ? params.chromaticAberration : 0.02,
              vignetteBoost: params.vignetteBoost !== undefined ? params.vignetteBoost : 1.0,
              vignetteReduction: params.vignetteReduction !== undefined ? params.vignetteReduction : 0.4,
              noiseIntensity: params.noiseIntensity !== undefined ? params.noiseIntensity : 0.015,

              gamma: params.gamma !== undefined ? params.gamma : 1.0,
              minInputLevel: params.minInputLevel !== undefined ? params.minInputLevel : 0.0,
              maxInputLevel: params.maxInputLevel !== undefined ? params.maxInputLevel : 1.0,
            };

            this.sceneTarget = createFBO(1, 1, { type: THREE.HalfFloatType });

            this.bloomPass = new BloomPass(
              this.settings.bloomStrength,
              this.settings.bloomRadius,
              this.settings.bloomThreshold,
              5
            );

            this.finalShader = new THREE.RawShaderMaterial({
              uniforms: {
                resolution: { value: new THREE.Vector2(1, 1) },
                bloomEnabled: { value: this.settings.bloomEnabled },
                bloomStrength: { value: this.settings.bloomStrength },
                vignetteBoost: { value: this.settings.vignetteBoost },
                vignetteReduction: { value: this.settings.vignetteReduction },
                noiseIntensity: { value: this.settings.noiseIntensity },
                inputTexture: { value: null },
                blur0Texture: { value: null },
                blur1Texture: { value: null },
                blur2Texture: { value: null },
                blur3Texture: { value: null },
                blur4Texture: { value: null },
                time: { value: 0 },
              },
              vertexShader: orthoVertexShader,
              fragmentShader: finalFragmentShader,
              glslVersion: THREE.GLSL3,
            });
            this.finalPass = new ShaderPass(this.finalShader);

            this.rgbShader = new THREE.RawShaderMaterial({
              uniforms: {
                inputTexture: { value: this.finalPass.texture },
                fisheyeStrength: { value: this.settings.fisheyeStrength },
                fisheyeRadius: { value: this.settings.fisheyeRadius },
                chromaticAberrationAmount: { value: this.settings.chromaticAberration },
                minInputLevel: { value: this.settings.minInputLevel },
                maxInputLevel: { value: this.settings.maxInputLevel },
                gammaLevel: { value: this.settings.gamma },
                time: { value: 0 },
              },
              vertexShader: orthoVertexShader,
              fragmentShader: colorFragmentShader,
              glslVersion: THREE.GLSL3,
            });
            this.rgbPass = new ShaderPass(this.rgbShader);

            this.copyShader = new THREE.RawShaderMaterial({
              uniforms: {
                inputTexture: { value: null },
              },
              vertexShader: orthoVertexShader,
              fragmentShader: copyFragmentShader,
              glslVersion: THREE.GLSL3,
            });
            this.copyPass = new ShaderPass(this.copyShader);
          }

          updateSettings() {
            this.bloomPass.enabled = this.settings.bloomEnabled;
            this.bloomPass.strength = this.settings.bloomStrength;
            this.bloomPass.radius = this.settings.bloomRadius;
            this.bloomPass.threshold = this.settings.bloomThreshold;

            this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
            this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
            this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
            this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
            this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;

            this.rgbShader.uniforms.fisheyeStrength.value = this.settings.fisheyeStrength;
            this.rgbShader.uniforms.fisheyeRadius.value = this.settings.fisheyeRadius;
            this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
            this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
            this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
            this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
          }

          setSize(w0, h0, dpr = 1) {
            const w = Math.max(1, Math.floor(w0 * dpr));
            const h = Math.max(1, Math.floor(h0 * dpr));
            this.sceneTarget.setSize(w, h);
            this.finalPass.setSize(w, h);
            this.finalShader.uniforms.resolution.value.set(w, h);
            this.bloomPass.setSize(w, h);
            this.rgbPass.setSize(w, h);
            this.copyPass.setSize(w, h);
          }

          renderScene(scene, camera) {
            if (!this.settings.enabled) {
              this.renderer.render(scene, camera);
              return;
            }
            this.renderer.setRenderTarget(this.sceneTarget);
            this.renderer.render(scene, camera);
            this.renderer.setRenderTarget(null);
            this.render(this.sceneTarget.texture);
          }

          render(sourceTexture) {
            if (!this.settings.enabled) {
              this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
              this.copyPass.render(this.renderer, true);
              return;
            }

            this.updateSettings();

            this.bloomPass.source = sourceTexture;
            this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
            this.bloomPass.render(this.renderer);

            this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
            this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
            this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
            this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
            this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

            const randomTime = Math.random() * 100000;
            this.finalPass.shader.uniforms.time.value = randomTime;
            this.rgbPass.shader.uniforms.time.value = randomTime;

            this.finalPass.render(this.renderer);
            this.rgbPass.render(this.renderer, true);
          }

          attachGUI(gui, title = "Post-Processing Suite") {
            const root = gui.addFolder(title);
            root.add(this.settings, "enabled").name("Enable Suite");

            const bloom = root.addFolder("Bloom");
            bloom.add(this.settings, "bloomEnabled").name("Enable Bloom").onChange(() => this.updateSettings());
            bloom.add(this.settings, "bloomStrength", 0, 3.0, 0.05).name("Strength").onChange(() => this.updateSettings());
            bloom.add(this.settings, "bloomRadius", 0, 2.0, 0.05).name("Radius").onChange(() => this.updateSettings());
            bloom.add(this.settings, "bloomThreshold", 0, 1.0, 0.01).name("Threshold").onChange(() => this.updateSettings());

            const lens = root.addFolder("Lens, Optics & Fisheye");
            lens.add(this.settings, "fisheyeStrength", -1.0, 1.5, 0.01).name("Fisheye Distortion").onChange(() => this.updateSettings());
            lens.add(this.settings, "fisheyeRadius", 0.2, 2.0, 0.05).name("Fisheye Radius").onChange(() => this.updateSettings());
            lens.add(this.settings, "chromaticAberration", 0, 0.2, 0.005).name("Chromatic Aberration").onChange(() => this.updateSettings());
            lens.add(this.settings, "vignetteBoost", 0, 2.0, 0.05).name("Vignette Boost").onChange(() => this.updateSettings());
            lens.add(this.settings, "vignetteReduction", 0, 2.0, 0.05).name("Vignette Falloff").onChange(() => this.updateSettings());
            lens.add(this.settings, "noiseIntensity", 0, 0.1, 0.005).name("Film Grain").onChange(() => this.updateSettings());
            lens.add(this.settings, "gamma", 0.2, 2.0, 0.05).name("Gamma").onChange(() => this.updateSettings());
            lens.add(this.settings, "minInputLevel", 0, 0.5, 0.01).name("Black Level").onChange(() => this.updateSettings());
            lens.add(this.settings, "maxInputLevel", 0.5, 1.0, 0.01).name("White Level").onChange(() => this.updateSettings());

            root.close();
            return root;
          }
        }

        // --- 1. PRECONFIGURED COLOR SCHEMES (10 HARMONIC SCHEMES) ---
        const COLOR_SCHEMES = {
            'Monochromatic': {
                base: '#03080e',
                mid: '#3d617d',
                highlight: '#e0f2fe',
                fringeA: '#0284c7',
                fringeB: '#7dd3fc',
                bg: '#010408'
            },
            'Analogous': {
                base: '#08120b',
                mid: '#2e7048',
                highlight: '#dcfce7',
                fringeA: '#10b981',
                fringeB: '#fbbf24',
                bg: '#030805'
            },
            'Complementary': {
                base: '#0f0a07',
                mid: '#64748b',
                highlight: '#fff7ed',
                fringeA: '#ea580c',
                fringeB: '#0284c7',
                bg: '#040302'
            },
            'Split-complementary': {
                base: '#0a0714',
                mid: '#475569',
                highlight: '#f8fafc',
                fringeA: '#f59e0b',
                fringeB: '#06b6d4',
                bg: '#030208'
            },
            'Triadic': {
                base: '#0f0612',
                mid: '#6b7280',
                highlight: '#fdf4ff',
                fringeA: '#a855f7',
                fringeB: '#06b6d4',
                bg: '#050108'
            },
            'Tetradic': {
                base: '#060f14',
                mid: '#526b7a',
                highlight: '#f0fdfa',
                fringeA: '#ec4899',
                fringeB: '#3b82f6',
                bg: '#01070a'
            },
            'Double split-complementary': {
                base: '#12080e',
                mid: '#71717a',
                highlight: '#fff1f2',
                fringeA: '#f43f5e',
                fringeB: '#84cc16',
                bg: '#060205'
            },
            'Achromatic (White on Black)': {
                base: '#080808',
                mid: '#5c5c5c',
                highlight: '#ffffff',
                fringeA: '#cccccc',
                fringeB: '#888888',
                bg: '#000000'
            },
            'Achromatic (Black on White)': {
                base: '#e2e8f0',
                mid: '#64748b',
                highlight: '#09090b',
                fringeA: '#18181b',
                fringeB: '#3f3f46',
                bg: '#f8fafc'
            },
            'Neutral + Accent': {
                base: '#0f172a',
                mid: '#334155',
                highlight: '#cbd5e1',
                fringeA: '#ff0055',
                fringeB: '#00f0ff',
                bg: '#050811'
            }
        };

        // --- 2. PRECONFIGURED ANIMATIONS (8 DISTINCT MODES) ---
        const ANIMATION_MODES = [
            'Thermal Updraft (Slow Rise)',
            'Vortex Shear (Spiral Orbit)',
            'Schlieren Drift (Horizontal Sweep)',
            'Turbulent Plume (Pulsing Convection)',
            'Oscillating Wave (Pendulum Drift)',
            'Deep Micro-Scan (Zooming Probe)',
            'Rotational Shear (Barrel Roll)',
            'Static (No Camera Motion)'
        ];

        // --- 3. GLOBAL STATE & PARAMETERS ---
        const params = {
            // Render & View
            dpr: 0.85,
            zoom: 1.0,
            panX: 0.0,
            panY: 0.0,
            greenScreen: false,
            backgroundColor: '#040302',
            clickRandomize: true,

            // Animation
            speed: 1.25,
            animationMode: 'Thermal Updraft (Slow Rise)',

            // Color Palette
            colorScheme: 'Complementary',
            colorBase: '#0f0a07',
            colorMid: '#64748b',
            colorHighlight: '#fff7ed',
            colorFringeA: '#ea580c',
            colorFringeB: '#0284c7',

            // Anisotropic Gradient Shear Physics
            shearY: 3.5,
            fractalScale: 1.0,
            smoothing: 1.55,

            // Schlieren Luminance-Gradient Optics
            fadeOuter: 2.56,
            fadeInner: 2.55,
            edgeGain: 12.0,
            kneePos: 0.38,
            kneeWidth: 0.12,
            exposure: 6000.0,

            // Action triggers
            randomizeNow: () => randomizeScene(),
            resetView: () => {
                params.zoom = 1.0;
                params.panX = 0.0;
                params.panY = 0.0;
                targetRotationX = 0;
                targetRotationY = 0;
                updateViewUniforms();
                gui?.controllersRecursive?.().forEach(c => c.updateDisplay());
            }
        };

        // --- 4. THREE.JS ENVIRONMENT SETUP ---
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        document.body.appendChild(renderer.domElement);

        const postProcessor = new PostProcessor(renderer, {
            enabled: true,
            bloomEnabled: true,
            bloomStrength: 0.65,
            bloomRadius: 0.45,
            bloomThreshold: 0.2,
            chromaticAberration: 0.02,
            vignetteBoost: 1.0,
            vignetteReduction: 0.35,
            noiseIntensity: 0.012,
            gamma: 1.0
        });

        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

        const hexToVector3 = (hex) => {
            const color = new THREE.Color(hex);
            return new THREE.Vector3(color.r, color.g, color.b);
        };

        const updateSize = () => {
            const pixelRatio = Math.min(window.devicePixelRatio * params.dpr, 2.5);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(pixelRatio);
            if (material) {
                material.uniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
            }
            if (typeof postProcessor !== 'undefined' && postProcessor) {
                postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);
            }
        };

        const applyBackground = () => {
            const color = params.greenScreen ? '#00ff00' : params.backgroundColor;
            document.body.classList.toggle('greenscreen', params.greenScreen);
            renderer.setClearColor(color, 1);
            if (material) {
                material.uniforms.uBackgroundColor.value.copy(hexToVector3(color));
                material.uniforms.uIsGreenScreen.value = params.greenScreen ? 1.0 : 0.0;
            }
        };

        const applyColorScheme = (name) => {
            const scheme = COLOR_SCHEMES[name];
            if (!scheme) return;
            params.colorBase = scheme.base;
            params.colorMid = scheme.mid;
            params.colorHighlight = scheme.highlight;
            params.colorFringeA = scheme.fringeA;
            params.colorFringeB = scheme.fringeB;
            if (!params.greenScreen) {
                params.backgroundColor = scheme.bg;
            }
            updateMaterialColors();
            applyBackground();
            gui?.controllersRecursive?.().forEach(c => c.updateDisplay());
        };

        const updateMaterialColors = () => {
            if (!material) return;
            material.uniforms.uColorBase.value.copy(hexToVector3(params.colorBase));
            material.uniforms.uColorMid.value.copy(hexToVector3(params.colorMid));
            material.uniforms.uColorHighlight.value.copy(hexToVector3(params.colorHighlight));
            material.uniforms.uColorFringeA.value.copy(hexToVector3(params.colorFringeA));
            material.uniforms.uColorFringeB.value.copy(hexToVector3(params.colorFringeB));
        };

        const updateViewUniforms = () => {
            if (!material) return;
            material.uniforms.uZoom.value = params.zoom;
            material.uniforms.uPan.value.set(params.panX, params.panY);
        };

        // --- 5. GLSL SHADER DEFINITIONS ---
        const vertexShader = `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = vec4(position, 1.0);
            }
        `;

        const fragmentShader = `
            precision highp float;

            uniform float uTime;
            uniform vec2 uResolution;
            uniform mat3 uRotation;
            uniform float uZoom;
            uniform vec2 uPan;
            uniform vec3 uBackgroundColor;
            uniform float uIsGreenScreen;

            // Palette & Schlieren Colors
            uniform vec3 uColorBase;
            uniform vec3 uColorMid;
            uniform vec3 uColorHighlight;
            uniform vec3 uColorFringeA;
            uniform vec3 uColorFringeB;

            // Anisotropic Gradient Shear Physics
            uniform float uShearY;
            uniform float uFractalScale;
            uniform float uSmoothing;

            // Optical Edge Response
            uniform float uFadeOuter;
            uniform float uFadeInner;
            uniform float uEdgeGain;
            uniform float uKneePos;
            uniform float uKneeWidth;
            uniform float uExposure;

            varying vec2 vUv;

            // Smooth minimum for seamless convective fluid blending
            float smin(float a, float b, float k) {
                float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
                return mix(b, a, h) - k * h * (1.0 - h);
            }

            // Anisotropic Convective Domain Warp
            // Stretches along the vertical Y axis (3-4x displacement) to develop sheared, plume-like filaments
            float evaluateScene(vec3 rayPosition, float currentTime, out vec3 secondaryPosition) {
                vec3 primaryPos = rayPosition * uFractalScale;
                vec3 secondaryPos = rayPosition * uFractalScale;

                for (float iteration = 2.3; iteration <= 6.0; iteration += 1.1) {
                    float secondaryScale = iteration * 0.3;
                    vec3 secDisp = sin(0.6 * currentTime + primaryPos.zxy * secondaryScale) * 0.4;
                    secDisp.y *= uShearY;
                    secondaryPos += secDisp;

                    vec3 priDisp = sin(currentTime + primaryPos.yzx * iteration) * 0.25;
                    priDisp.y *= uShearY;
                    primaryPos += priDisp;
                }

                secondaryPosition = secondaryPos;

                float sphereA = length(primaryPos + 1.0) - 2.0;
                float sphereB = length(secondaryPos - 1.3) - 2.9;
                float blendedSpheres = smin(sphereA, sphereB, uSmoothing);
                float fractalVolume = abs(blendedSpheres) * 0.1;

                return fractalVolume / uFractalScale;
            }

            float randomNoise(vec2 p) {
                return fract(sin(dot(p, vec2(12.8998, 78.233))) * 43758.5453);
            }

            vec3 customTanh(vec3 x) {
                vec3 e2x = exp(2.0 * clamp(x, -20.0, 20.0));
                return (e2x - 1.0) / (e2x + 1.0);
            }

            void main() {
                vec2 fragCoord = vUv * uResolution;
                vec2 uv = (fragCoord * 2.0 - uResolution.xy) / uResolution.y;
                uv = (uv - uPan) / max(uZoom, 0.05);

                float totalDistance = -0.015 * randomNoise(fragCoord);
                vec3 colorAccumulator = vec3(0.0);
                float prevDistance = 0.0;

                vec3 rayOrigin = vec3(0.0, 0.0, -4.5);
                vec3 rayDir = normalize(vec3(uv, 1.0));

                for (int step = 0; step < 90; step++) {
                    vec3 currentPos = rayOrigin + rayDir * totalDistance;

                    if (totalDistance > 10.0) break;

                    float distFromCenter = length(currentPos);

                    if (distFromCenter > uFadeOuter + 0.01) {
                        totalDistance += distFromCenter - uFadeOuter;
                        continue;
                    }

                    vec3 rotatedPos = uRotation * currentPos;
                    vec3 secondaryPos;
                    float sceneDistance = evaluateScene(rotatedPos, uTime, secondaryPos);
                    float stepSize = 0.012 + sceneDistance;
                    totalDistance += stepSize;

                    float radialFade = smoothstep(uFadeOuter, uFadeInner, distFromCenter);

                    // First derivative of sceneDistance between raymarch steps (abs(sceneDistance - prevDistance))
                    float dDist = abs(sceneDistance - prevDistance);
                    prevDistance = sceneDistance;

                    // Normalized gradient rate for edge detection
                    float grad = clamp((dDist / stepSize) * uEdgeGain, 0.0, 1.0);

                    // Near-grayscale luminance ramp
                    vec3 grayRamp = mix(uColorBase, uColorMid, smoothstep(0.02, 0.45, grad));
                    grayRamp = mix(grayRamp, uColorHighlight, smoothstep(0.45, 0.95, grad));

                    // Thin optical knife-edge color knee fringe
                    float kneeDist = abs(grad - uKneePos);
                    float kneeMask = smoothstep(uKneeWidth, 0.0, kneeDist);
                    vec3 colorKnee = mix(uColorFringeA, uColorFringeB, smoothstep(uKneePos - uKneeWidth, uKneePos + uKneeWidth, grad)) * (kneeMask * 3.2);

                    // Edge-detector composite: shear boundaries illuminate with knife-edge fringing
                    vec3 edgeColor = (grayRamp + colorKnee) * smoothstep(0.015, 0.14, grad);

                    colorAccumulator += (edgeColor / stepSize) * radialFade;

                    if (colorAccumulator.x > 25000.0 && colorAccumulator.y > 25000.0 && colorAccumulator.z > 25000.0) break;
                }

                float vignetteEffect = max(length(uv), 0.2);
                colorAccumulator = colorAccumulator / (uExposure * vignetteEffect);

                vec3 objectColor = customTanh(colorAccumulator);
                float luma = max(max(objectColor.r, objectColor.g), objectColor.b);
                float objectMask = smoothstep(0.015, 0.11, luma);

                vec3 finalColor;
                if (uIsGreenScreen > 0.5) {
                    finalColor = mix(vec3(0.0, 1.0, 0.0), objectColor, objectMask);
                } else {
                    finalColor = mix(uBackgroundColor, objectColor, objectMask);
                }

                gl_FragColor = vec4(finalColor, 1.0);
            }
        `;

        const geometry = new THREE.PlaneGeometry(2, 2);
        const material = new THREE.ShaderMaterial({
            vertexShader,
            fragmentShader,
            uniforms: {
                uTime: { value: 0.0 },
                uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
                uRotation: { value: new THREE.Matrix3() },
                uZoom: { value: params.zoom },
                uPan: { value: new THREE.Vector2(params.panX, params.panY) },
                uBackgroundColor: { value: hexToVector3(params.backgroundColor) },
                uIsGreenScreen: { value: 0.0 },

                uColorBase: { value: hexToVector3(params.colorBase) },
                uColorMid: { value: hexToVector3(params.colorMid) },
                uColorHighlight: { value: hexToVector3(params.colorHighlight) },
                uColorFringeA: { value: hexToVector3(params.colorFringeA) },
                uColorFringeB: { value: hexToVector3(params.colorFringeB) },

                uShearY: { value: params.shearY },
                uFractalScale: { value: params.fractalScale },
                uSmoothing: { value: params.smoothing },

                uFadeOuter: { value: params.fadeOuter },
                uFadeInner: { value: params.fadeInner },
                uEdgeGain: { value: params.edgeGain },
                uKneePos: { value: params.kneePos },
                uKneeWidth: { value: params.kneeWidth },
                uExposure: { value: params.exposure }
            }
        });

        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        window.addEventListener('resize', updateSize);
        updateSize();
        applyColorScheme(params.colorScheme);

        // --- 6. INTERACTION LOGIC (PAN, ZOOM, 3D ROTATION, RANDOMIZE ON CLICK) ---
        let isDragging = false;
        let isOrbitMode = false;
        let pointerStartPosition = { x: 0, y: 0 };
        let previousPointerPosition = { x: 0, y: 0 };
        let dragDistance = 0;

        let targetRotationX = 0;
        let targetRotationY = 0;
        let currentRotationX = 0;
        let currentRotationY = 0;

        const updateRotationMatrix = () => {
            const euler = new THREE.Euler(currentRotationX, currentRotationY, 0, 'YXZ');
            const rotationMatrix4 = new THREE.Matrix4().makeRotationFromEuler(euler);
            material.uniforms.uRotation.value.setFromMatrix4(rotationMatrix4);
        };

        updateRotationMatrix();

        window.addEventListener('pointerdown', (e) => {
            if (e.target.closest('.lil-gui')) return;

            isDragging = true;
            isOrbitMode = e.button === 2 || e.shiftKey || e.ctrlKey || e.altKey;
            pointerStartPosition = { x: e.clientX, y: e.clientY };
            previousPointerPosition = { x: e.clientX, y: e.clientY };
            dragDistance = 0;

            document.body.classList.add('dragging');
            window.setPointerCapture?.(e.pointerId);
        });

        window.addEventListener('pointermove', (e) => {
            if (!isDragging) return;

            const deltaX = e.clientX - previousPointerPosition.x;
            const deltaY = e.clientY - previousPointerPosition.y;
            dragDistance += Math.hypot(deltaX, deltaY);

            if (isOrbitMode) {
                // Orbit Rotation
                targetRotationY += deltaX * 0.008;
                targetRotationX += deltaY * 0.008;
            } else {
                // Pan Object across screen
                const panScale = 2.0 / window.innerHeight;
                params.panX += (deltaX * panScale) / params.zoom;
                params.panY -= (deltaY * panScale) / params.zoom;
                updateViewUniforms();
            }

            previousPointerPosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('pointerup', (e) => {
            if (isDragging) {
                isDragging = false;
                document.body.classList.remove('dragging');
                window.releasePointerCapture?.(e.pointerId);

                // If user clicked without dragging, trigger procedural randomization if enabled
                if (dragDistance < 6 && params.clickRandomize && !e.target.closest('.lil-gui')) {
                    randomizeScene();
                }
            }
        });

        window.addEventListener('pointercancel', () => {
            isDragging = false;
            document.body.classList.remove('dragging');
        });

        window.addEventListener('contextmenu', (e) => {
            if (!e.target.closest('.lil-gui')) {
                e.preventDefault();
            }
        });

        // Zoom with wheel
        window.addEventListener('wheel', (e) => {
            if (e.target.closest('.lil-gui')) return;
            e.preventDefault();
            const zoomFactor = Math.exp(-e.deltaY * 0.0012);
            params.zoom = THREE.MathUtils.clamp(params.zoom * zoomFactor, 0.15, 8.0);
            updateViewUniforms();
        }, { passive: false });

        // --- 7. PROCEDURAL MUTATION / RANDOMIZER ---
        const randomizeScene = () => {
            const schemeKeys = Object.keys(COLOR_SCHEMES);
            params.colorScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
            const scheme = COLOR_SCHEMES[params.colorScheme];

            params.colorBase = scheme.base;
            params.colorMid = scheme.mid;
            params.colorHighlight = scheme.highlight;
            params.colorFringeA = scheme.fringeA;
            params.colorFringeB = scheme.fringeB;
            if (!params.greenScreen) {
                params.backgroundColor = scheme.bg;
            }

            // Procedural geometric & optical shear parameters
            params.shearY = +(2.5 + Math.random() * 2.5).toFixed(2);
            params.fractalScale = +(0.75 + Math.random() * 0.55).toFixed(2);
            params.smoothing = +(1.0 + Math.random() * 1.0).toFixed(2);

            params.edgeGain = +(8.0 + Math.random() * 10.0).toFixed(1);
            params.kneePos = +(0.2 + Math.random() * 0.35).toFixed(3);
            params.kneeWidth = +(0.08 + Math.random() * 0.12).toFixed(3);

            // Re-roll motion mode
            const animKeys = ANIMATION_MODES.filter(m => m !== 'Static (No Camera Motion)');
            params.animationMode = animKeys[Math.floor(Math.random() * animKeys.length)];
            params.speed = +(0.9 + Math.random() * 0.9).toFixed(2);

            // Apply all updates to uniforms
            material.uniforms.uShearY.value = params.shearY;
            material.uniforms.uFractalScale.value = params.fractalScale;
            material.uniforms.uSmoothing.value = params.smoothing;

            material.uniforms.uEdgeGain.value = params.edgeGain;
            material.uniforms.uKneePos.value = params.kneePos;
            material.uniforms.uKneeWidth.value = params.kneeWidth;

            updateMaterialColors();
            applyBackground();

            // Refresh GUI controls
            gui?.controllersRecursive?.().forEach(c => c.updateDisplay());
        };

        // --- 8. LIL-GUI SETUP ---
        gui = new GUI({ title: 'Convective Shear Imaging' });

        // Folder: Render & View
        const folderView = gui.addFolder('Render & Viewport');
        folderView.add(params, 'dpr', 0.25, 2.0, 0.05).name('Pixel Ratio (DPR)').onChange(updateSize);
        folderView.add(params, 'zoom', 0.15, 8.0, 0.01).name('Zoom').onChange(updateViewUniforms);
        folderView.add(params, 'panX', -4.0, 4.0, 0.01).name('Pan X').onChange(updateViewUniforms);
        folderView.add(params, 'panY', -4.0, 4.0, 0.01).name('Pan Y').onChange(updateViewUniforms);
        folderView.add(params, 'clickRandomize').name('Click Scene to Randomize');
        folderView.add(params, 'randomizeNow').name('⚡ Randomize Parameters');
        folderView.add(params, 'resetView').name('↺ Reset View');

        // Folder: Animation & Camera Trajectory
        const folderAnim = gui.addFolder('Animation & Motion');
        folderAnim.add(params, 'animationMode', ANIMATION_MODES).name('Animation Mode');
        folderAnim.add(params, 'speed', 0.0, 3.5, 0.01).name('Speed');

        // Folder: Color Schemes & Palette
        const folderPalette = gui.addFolder('Color Harmonies');
        folderPalette.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Palette Scheme').onChange(applyColorScheme);
        folderPalette.add(params, 'greenScreen').name('Green Screen #00ff00').onChange(applyBackground);
        folderPalette.addColor(params, 'backgroundColor').name('Background Color').onChange(applyBackground);

        const folderCustomColors = folderPalette.addFolder('Custom Color Knots');
        folderCustomColors.addColor(params, 'colorBase').name('Base Slate').onChange(updateMaterialColors);
        folderCustomColors.addColor(params, 'colorMid').name('Midtone Gray').onChange(updateMaterialColors);
        folderCustomColors.addColor(params, 'colorHighlight').name('Highlight Luma').onChange(updateMaterialColors);
        folderCustomColors.addColor(params, 'colorFringeA').name('Knife-Edge Fringe A').onChange(updateMaterialColors);
        folderCustomColors.addColor(params, 'colorFringeB').name('Knife-Edge Fringe B').onChange(updateMaterialColors);
        folderCustomColors.close();

        // Folder: Anisotropic Gradient Shear Physics
        const folderShear = gui.addFolder('Anisotropic Shear Physics');
        folderShear.add(params, 'shearY', 1.0, 6.0, 0.05).name('Y-Shear Anisotropy').onChange(v => material.uniforms.uShearY.value = v);
        folderShear.add(params, 'fractalScale', 0.2, 3.0, 0.01).name('Domain Scale').onChange(v => material.uniforms.uFractalScale.value = v);
        folderShear.add(params, 'smoothing', 0.2, 3.5, 0.01).name('Fluid Smoothing').onChange(v => material.uniforms.uSmoothing.value = v);

        // Folder: Schlieren Luminance Optics
        const folderOptics = gui.addFolder('Schlieren Optics & Knife-Edge');
        folderOptics.add(params, 'edgeGain', 2.0, 30.0, 0.5).name('Gradient Sensitivity').onChange(v => material.uniforms.uEdgeGain.value = v);
        folderOptics.add(params, 'kneePos', 0.05, 0.9, 0.01).name('Color Knee Position').onChange(v => material.uniforms.uKneePos.value = v);
        folderOptics.add(params, 'kneeWidth', 0.02, 0.35, 0.01).name('Knee Bandwidth').onChange(v => material.uniforms.uKneeWidth.value = v);
        folderOptics.add(params, 'exposure', 1000.0, 15000.0, 100.0).name('Exposure Normalizer').onChange(v => material.uniforms.uExposure.value = v);
        folderOptics.add(params, 'fadeOuter', 1.0, 5.0, 0.05).name('Outer Bound Fade').onChange(v => material.uniforms.uFadeOuter.value = v);
        folderOptics.add(params, 'fadeInner', 0.5, 4.0, 0.05).name('Inner Bound Fade').onChange(v => material.uniforms.uFadeInner.value = v);

        // Folder: Post-Processing Suite
        postProcessor.attachGUI(gui, 'Post-Processing Suite');

        // --- 9. KEYBOARD SHORTCUTS ---
        window.addEventListener('keydown', (e) => {
            if (e.key === 'h' || e.key === 'H') {
                if (gui) {
                    gui._hidden ? gui.show() : gui.hide();
                }
            } else if (e.key === 'r' || e.key === 'R') {
                randomizeScene();
            }
        });

        // --- 10. ANIMATION & RENDER LOOP ---
        const clock = new THREE.Clock();
        let currentTime = 0;

        const animate = () => {
            requestAnimationFrame(animate);

            let delta = clock.getDelta();
            delta = Math.min(delta, 0.1);
            currentTime += delta * params.speed;

            // Apply preconfigured animation trajectories
            switch (params.animationMode) {
                case 'Thermal Updraft (Slow Rise)':
                    targetRotationY = Math.sin(currentTime * 0.35) * 0.45;
                    targetRotationX = -0.15 + Math.cos(currentTime * 0.25) * 0.12;
                    break;
                case 'Vortex Shear (Spiral Orbit)':
                    targetRotationY += delta * 0.38 * (params.speed > 0 ? 1 : 0);
                    targetRotationX = Math.sin(currentTime * 0.45) * 0.35;
                    break;
                case 'Schlieren Drift (Horizontal Sweep)':
                    targetRotationY = Math.sin(currentTime * 0.4) * 0.75;
                    targetRotationX = 0.05 * Math.cos(currentTime * 0.3);
                    break;
                case 'Turbulent Plume (Pulsing Convection)':
                    targetRotationY = Math.sin(currentTime * 0.6) * 0.3 + Math.sin(currentTime * 1.1) * 0.15;
                    targetRotationX = Math.cos(currentTime * 0.5) * 0.25;
                    break;
                case 'Oscillating Wave (Pendulum Drift)':
                    targetRotationY = Math.sin(currentTime * 0.55) * 0.65;
                    targetRotationX = Math.sin(currentTime * 0.28) * 0.22;
                    break;
                case 'Deep Micro-Scan (Zooming Probe)':
                    targetRotationY = Math.sin(currentTime * 0.2) * 0.25;
                    targetRotationX = Math.cos(currentTime * 0.18) * 0.18;
                    break;
                case 'Rotational Shear (Barrel Roll)':
                    targetRotationY += delta * 0.55 * (params.speed > 0 ? 1 : 0);
                    targetRotationX = 0.22;
                    break;
                case 'Static (No Camera Motion)':
                default:
                    // Keep camera stationary, fluid convection animates internally
                    break;
            }

            // Smooth interpolation for camera rotations
            if (!isDragging || isOrbitMode) {
                targetRotationX = Math.max(-Math.PI / 2.1, Math.min(Math.PI / 2.1, targetRotationX));
                currentRotationX += (targetRotationX - currentRotationX) * 0.08;
                currentRotationY += (targetRotationY - currentRotationY) * 0.08;
                updateRotationMatrix();
            }

            material.uniforms.uTime.value = currentTime;
            postProcessor.renderScene(scene, camera);
        };

        animate();
    </script>
</body>
</html>
