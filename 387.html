    // --- 3D Moravian / Bethlehem Star Geometry ---
    function createFacetedStarGeometry(points = 8, rOuter = 1.25, rInner = 0.48, depth = 0.42) {
      const geom = new THREE.BufferGeometry();
      const positions = [];
      const normals = [];
      const total = points * 2;
      const boundary = [];

      for (let i = 0; i < total; i++) {
        const angle = (i / total) * Math.PI * 2;
        let r = (i % 2 === 0) ? rOuter : rInner;
        if (i % 2 === 0 && (i === 0 || i === total / 2)) {
          r *= 1.28;
        }
        boundary.push(new THREE.Vector3(r * Math.sin(angle), r * Math.cos(angle), 0));
      }

      const topCenter = new THREE.Vector3(0, 0, depth);
      const bottomCenter = new THREE.Vector3(0, 0, -depth);

      function addTriangle(a, b, c) {
        positions.push(a.x, a.y, a.z, b.x, b.y, b.z, c.x, c.y, c.z);
        const cb = new THREE.Vector3().subVectors(c, b);
        const ab = new THREE.Vector3().subVectors(a, b);
        const n = new THREE.Vector3().crossVectors(ab, cb).normalize();
        normals.push(n.x, n.y, n.z, n.x, n.y, n.z, n.x, n.y, n.z);
      }

      for (let i = 0; i < total; i++) {
        const next = (i + 1) % total;
        addTriangle(topCenter, boundary[i], boundary[next]);
        addTriangle(bottomCenter, boundary[next], boundary[i]);
      }

      geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geom.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
      return geom;
    }

    const starGroup = new THREE.Group();
    starGroup.position.set(0, settings.treeHeight + 0.3, 0);
    scene.add(starGroup);

    const starMaterial = new THREE.MeshStandardMaterial({
      color: new THREE.Color(settings.starColor),
      emissive: new THREE.Color(settings.starGlow),
      emissiveIntensity: 0.5,
      roughness: 0.2,
      metalness: 0.9
    });

    const starMesh = new THREE.Mesh(createFacetedStarGeometry(), starMaterial);
    starGroup.add(starMesh);

    const gemGeo = new THREE.OctahedronGeometry(0.32, 1);
    const gemMat = new THREE.MeshBasicMaterial({
      color: 0xffffff,
      wireframe: true,
      transparent: true,
      opacity: 0.5
    });
    const gemMesh = new THREE.Mesh(gemGeo, gemMat);
    starGroup.add(gemMesh);

    const STAR_HALO_COUNT = 600;
    const starHaloGeo = new THREE.BufferGeometry();
    const starHaloPos = new Float32Array(STAR_HALO_COUNT * 3);
    const starHaloSize = new Float32Array(STAR_HALO_COUNT);
    const starHaloPhase = new Float32Array(STAR_HALO_COUNT);

    for (let i = 0; i < STAR_HALO_COUNT; i++) {
      const u = Math.random();
      const r = Math.pow(u, 1.8) * 2.8 + 0.1;
      let angle;
      if (Math.random() < 0.65) {
        const spikeIndex = Math.floor(Math.random() * 8);
        angle = (spikeIndex / 8) * Math.PI * 2 + (Math.random() - 0.5) * 0.08;
      } else {
        angle = Math.random() * Math.PI * 2;
      }
      starHaloPos[i * 3] = r * Math.cos(angle);
      starHaloPos[i * 3 + 1] = r * Math.sin(angle);
      starHaloPos[i * 3 + 2] = (Math.random() - 0.5) * 0.5;
      starHaloSize[i] = (Math.random() * 16 + 8) * (1.0 - r / 3.0);
      starHaloPhase[i] = Math.random() * Math.PI * 2;
    }

    starHaloGeo.setAttribute('position', new THREE.BufferAttribute(starHaloPos, 3));
    starHaloGeo.setAttribute('aSize', new THREE.BufferAttribute(starHaloSize, 1));
    starHaloGeo.setAttribute('aPhase', new THREE.BufferAttribute(starHaloPhase, 1));

    const starHaloMat = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0.0 },
        uColor: { value: new THREE.Color(settings.starColor) },
        uGlowColor: { value: new THREE.Color(settings.starGlow) },
        uTexture: { value: sparkleTexture }
      },
      vertexShader: `
        uniform float uTime;
        attribute float aSize;
        attribute float aPhase;
        varying float vAlpha;

        void main() {
          vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
          gl_Position = projectionMatrix * mvPosition;
          float pulse = 0.6 + 0.4 * sin(uTime * 3.5 + aPhase);
          gl_PointSize = clamp((aSize * pulse) * (90.0 / -mvPosition.z), 1.0, 30.0);
          vAlpha = pulse * 0.75;
        }
      `,
      fragmentShader: `
        uniform sampler2D uTexture;
        uniform vec3 uColor;
        uniform vec3 uGlowColor;
        varying float vAlpha;

        void main() {
          vec4 tex = texture2D(uTexture, gl_PointCoord);
          if (tex.a < 0.03) discard;
          vec3 col = mix(uGlowColor, uColor, tex.r);
          gl_FragColor = vec4(col * tex.rgb * 0.85, tex.a * vAlpha);
        }
      `,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });

    const starHaloPoints = new THREE.Points(starHaloGeo, starHaloMat);
    starGroup.add(starHaloPoints);

    // --- Particle System 1: The Ascending Helical Spiral Ribbons ---
    // Number of particles and ribbon width tuned so spiral ribbons are crisp and visible
    const SPIRAL_PARTICLE_COUNT = 22000;
    const spiralGeo = new THREE.BufferGeometry();

    const spBaseProgress = new Float32Array(SPIRAL_PARTICLE_COUNT);
    const spArmAngle = new Float32Array(SPIRAL_PARTICLE_COUNT);
    const spSpeedMult = new Float32Array(SPIRAL_PARTICLE_COUNT);
    const spRadiusNoise = new Float32Array(SPIRAL_PARTICLE_COUNT);
    const spSize = new Float32Array(SPIRAL_PARTICLE_COUNT);
    const spPhase = new Float32Array(SPIRAL_PARTICLE_COUNT);
    const spTwinkleFreq = new Float32Array(SPIRAL_PARTICLE_COUNT);
    const spColorMix = new Float32Array(SPIRAL_PARTICLE_COUNT);
    const spDummyPositions = new Float32Array(SPIRAL_PARTICLE_COUNT * 3);

    const NUM_SPIRAL_ARMS = 4;
    for (let i = 0; i < SPIRAL_PARTICLE_COUNT; i++) {
      spBaseProgress[i] = Math.random();
      const arm = Math.floor(Math.random() * NUM_SPIRAL_ARMS);
      spArmAngle[i] = (arm / NUM_SPIRAL_ARMS) * Math.PI * 2;
      spSpeedMult[i] = 0.9 + Math.random() * 0.2;
      // Controlled ribbon thickness: tight Gaussian so ribbons have sharp definition
      const r1 = Math.random();
      const r2 = Math.random();
      const gauss = Math.sqrt(-2.0 * Math.log(r1 + 0.0001)) * Math.cos(2.0 * Math.PI * r2);
      spRadiusNoise[i] = gauss * 0.14;
      spSize[i] = 12.0 + Math.random() * 16.0;
      spPhase[i] = Math.random() * Math.PI * 2;
      spTwinkleFreq[i] = 2.0 + Math.random() * 4.0;
      spColorMix[i] = Math.random();
    }

    spiralGeo.setAttribute('position', new THREE.BufferAttribute(spDummyPositions, 3));
    spiralGeo.setAttribute('aBaseProgress', new THREE.BufferAttribute(spBaseProgress, 1));
    spiralGeo.setAttribute('aArmAngleOffset', new THREE.BufferAttribute(spArmAngle, 1));
    spiralGeo.setAttribute('aSpeedMult', new THREE.BufferAttribute(spSpeedMult, 1));
    spiralGeo.setAttribute('aRadiusNoise', new THREE.BufferAttribute(spRadiusNoise, 1));
    spiralGeo.setAttribute('aSize', new THREE.BufferAttribute(spSize, 1));
    spiralGeo.setAttribute('aPhase', new THREE.BufferAttribute(spPhase, 1));
    spiralGeo.setAttribute('aTwinkleFreq', new THREE.BufferAttribute(spTwinkleFreq, 1));
    spiralGeo.setAttribute('aColorMix', new THREE.BufferAttribute(spColorMix, 1));

    const spiralMaterial = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0.0 },
        uTreeHeight: { value: settings.treeHeight },
        uBaseRadius: { value: settings.baseRadius },
        uConeTaper: { value: settings.coneTaper },
        uSpiralTurns: { value: settings.spiralTurns },
        uFlowSpeed: { value: settings.flowSpeed },
        uSparkleScale: { value: settings.sparkleScale },
        uColorPrimary: { value: new THREE.Color(settings.treePrimary) },
        uColorSecondary: { value: new THREE.Color(settings.treeSecondary) },
        uColorAccent: { value: new THREE.Color(settings.sparkleAccent) },
        uTexture: { value: sparkleTexture }
      },
      vertexShader: `
        uniform float uTime;
        uniform float uTreeHeight;
        uniform float uBaseRadius;
        uniform float uConeTaper;
        uniform float uSpiralTurns;
        uniform float uFlowSpeed;
        uniform float uSparkleScale;
        uniform vec3 uColorPrimary;
        uniform vec3 uColorSecondary;
        uniform vec3 uColorAccent;

        attribute float aBaseProgress;
        attribute float aArmAngleOffset;
        attribute float aSpeedMult;
        attribute float aRadiusNoise;
        attribute float aSize;
        attribute float aPhase;
        attribute float aTwinkleFreq;
        attribute float aColorMix;

        varying vec3 vColor;
        varying float vAlpha;

        void main() {
          // Seamless upward cycle using fract
          float s = fract(aBaseProgress + uTime * uFlowSpeed * aSpeedMult);
          float y = s * uTreeHeight;

          // Cone profile tapering to top
          float coneFactor = pow(max(1.0 - s, 0.0), uConeTaper);
          float r = uBaseRadius * coneFactor + aRadiusNoise * coneFactor;

          // Spiral angle with delicate organic wave
          float angle = s * uSpiralTurns * 6.2831853 + aArmAngleOffset;
          angle += sin(uTime * 1.5 + s * 10.0 + aPhase) * 0.06;

          vec3 pos = vec3(
            r * cos(angle),
            y + sin(angle * 2.0 + aPhase) * 0.08,
            r * sin(angle)
          );

          vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
          gl_Position = projectionMatrix * mvPosition;

          float twinkle = 0.55 + 0.45 * sin(uTime * aTwinkleFreq + aPhase);
          gl_PointSize = clamp((aSize * uSparkleScale * twinkle * (1.0 - s * 0.2)) * (75.0 / -mvPosition.z), 1.0, 32.0);

          vec3 col = mix(uColorPrimary, uColorSecondary, aColorMix);
          if (twinkle > 0.85) {
            col = mix(col, uColorAccent, (twinkle - 0.85) / 0.15);
          }
          vColor = col;
          vAlpha = smoothstep(0.0, 0.05, s) * smoothstep(1.0, 0.95, s) * twinkle;
        }
      `,
      fragmentShader: `
        uniform sampler2D uTexture;
        varying vec3 vColor;
        varying float vAlpha;

        void main() {
          vec4 tex = texture2D(uTexture, gl_PointCoord);
          if (tex.a < 0.03) discard;
          // Calibrated brightness to prevent over-saturation
          gl_FragColor = vec4(vColor * tex.rgb * 0.75, tex.a * vAlpha * 0.65);
        }
      `,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });

    const spiralPoints = new THREE.Points(spiralGeo, spiralMaterial);
    scene.add(spiralPoints);

    // --- Particle System 2: Delicate Volumetric Core Glitter ---
    // Lower count and low opacity so spiral ribbons are unobstructed
    const CORE_PARTICLE_COUNT = 8000;
    const coreGeo = new THREE.BufferGeometry();
    const coreNormHeight = new Float32Array(CORE_PARTICLE_COUNT);
    const coreRadiusFactor = new Float32Array(CORE_PARTICLE_COUNT);
    const coreAngle = new Float32Array(CORE_PARTICLE_COUNT);
    const coreSize = new Float32Array(CORE_PARTICLE_COUNT);
    const corePhase = new Float32Array(CORE_PARTICLE_COUNT);
    const coreColorMix = new Float32Array(CORE_PARTICLE_COUNT);
    const coreDummyPositions = new Float32Array(CORE_PARTICLE_COUNT * 3);

    for (let i = 0; i < CORE_PARTICLE_COUNT; i++) {
      coreNormHeight[i] = Math.random();
      coreRadiusFactor[i] = 0.2 + 0.75 * Math.sqrt(Math.random());
      coreAngle[i] = Math.random() * Math.PI * 2;
      coreSize[i] = 8.0 + Math.random() * 12.0;
      corePhase[i] = Math.random() * Math.PI * 2;
      coreColorMix[i] = Math.random();
    }

    coreGeo.setAttribute('position', new THREE.BufferAttribute(coreDummyPositions, 3));
    coreGeo.setAttribute('aNormHeight', new THREE.BufferAttribute(coreNormHeight, 1));
    coreGeo.setAttribute('aRadiusFactor', new THREE.BufferAttribute(coreRadiusFactor, 1));
    coreGeo.setAttribute('aAngle', new THREE.BufferAttribute(coreAngle, 1));
    coreGeo.setAttribute('aSize', new THREE.BufferAttribute(coreSize, 1));
    coreGeo.setAttribute('aPhase', new THREE.BufferAttribute(corePhase, 1));
    coreGeo.setAttribute('aColorMix', new THREE.BufferAttribute(coreColorMix, 1));

    const coreMaterial = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0.0 },
        uTreeHeight: { value: settings.treeHeight },
        uBaseRadius: { value: settings.baseRadius },
        uConeTaper: { value: settings.coneTaper },
        uSparkleScale: { value: settings.sparkleScale },
        uColorPrimary: { value: new THREE.Color(settings.treePrimary) },
        uColorSecondary: { value: new THREE.Color(settings.treeSecondary) },
        uTexture: { value: sparkleTexture }
      },
      vertexShader: `
        uniform float uTime;
        uniform float uTreeHeight;
        uniform float uBaseRadius;
        uniform float uConeTaper;
        uniform float uSparkleScale;
        uniform vec3 uColorPrimary;
        uniform vec3 uColorSecondary;

        attribute float aNormHeight;
        attribute float aRadiusFactor;
        attribute float aAngle;
        attribute float aSize;
        attribute float aPhase;
        attribute float aColorMix;

        varying vec3 vColor;
        varying float vAlpha;

        void main() {
          float s = aNormHeight;
          float y = s * uTreeHeight;
          float coneFactor = pow(max(1.0 - s, 0.0), uConeTaper);
          float r = uBaseRadius * coneFactor * aRadiusFactor;

          float angle = aAngle + uTime * 0.04 + sin(uTime * 0.3 + aPhase) * 0.06;
          vec3 pos = vec3(r * cos(angle), y + sin(uTime * 0.6 + aPhase) * 0.06, r * sin(angle));

          vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
          gl_Position = projectionMatrix * mvPosition;

          float twinkle = 0.5 + 0.5 * sin(uTime * 2.0 + aPhase);
          gl_PointSize = clamp((aSize * uSparkleScale * twinkle * (1.0 - s * 0.2)) * (60.0 / -mvPosition.z), 1.0, 20.0);

          vColor = mix(uColorPrimary, uColorSecondary, aColorMix);
          // Very gentle soft opacity to provide depth without solid washout
          vAlpha = smoothstep(0.0, 0.05, s) * smoothstep(1.0, 0.95, s) * twinkle * 0.35;
        }
      `,
      fragmentShader: `
        uniform sampler2D uTexture;
        varying vec3 vColor;
        varying float vAlpha;

        void main() {
          vec4 tex = texture2D(uTexture, gl_PointCoord);
          if (tex.a < 0.03) discard;
          gl_FragColor = vec4(vColor * tex.rgb * 0.5, tex.a * vAlpha * 0.4);
        }
      `,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });

    const corePoints = new THREE.Points(coreGeo, coreMaterial);
    scene.add(corePoints);

    // --- Particle System 3: Glowing Bokeh Orbs (Fairy Lights & Baubles) ---
    const BOKEH_COUNT = 320;
    const bokehGeo = new THREE.BufferGeometry();
    const bokehNormHeight = new Float32Array(BOKEH_COUNT);
    const bokehAngle = new Float32Array(BOKEH_COUNT);
    const bokehRadiusOffset = new Float32Array(BOKEH_COUNT);
    const bokehSize = new Float32Array(BOKEH_COUNT);
    const bokehPhase = new Float32Array(BOKEH_COUNT);
    const bokehColorMix = new Float32Array(BOKEH_COUNT);
    const bokehDummyPositions = new Float32Array(BOKEH_COUNT * 3);

    for (let i = 0; i < BOKEH_COUNT; i++) {
      bokehNormHeight[i] = 0.05 + 0.90 * Math.random();
      bokehAngle[i] = Math.random() * Math.PI * 2;
      bokehRadiusOffset[i] = 0.92 + Math.random() * 0.16;
      bokehSize[i] = 26.0 + Math.random() * 38.0;
      bokehPhase[i] = Math.random() * Math.PI * 2;
      bokehColorMix[i] = Math.random();
    }

    bokehGeo.setAttribute('position', new THREE.BufferAttribute(bokehDummyPositions, 3));
    bokehGeo.setAttribute('aNormHeight', new THREE.BufferAttribute(bokehNormHeight, 1));
    bokehGeo.setAttribute('aAngle', new THREE.BufferAttribute(bokehAngle, 1));
    bokehGeo.setAttribute('aRadiusOffset', new THREE.BufferAttribute(bokehRadiusOffset, 1));
    bokehGeo.setAttribute('aSize', new THREE.BufferAttribute(bokehSize, 1));
    bokehGeo.setAttribute('aPhase', new THREE.BufferAttribute(bokehPhase, 1));
    bokehGeo.setAttribute('aColorMix', new THREE.BufferAttribute(bokehColorMix, 1));

    const bokehMaterial = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0.0 },
        uTreeHeight: { value: settings.treeHeight },
        uBaseRadius: { value: settings.baseRadius },
        uConeTaper: { value: settings.coneTaper },
        uBokehScale: { value: settings.bokehScale },
        uColorBokeh: { value: new THREE.Color(settings.bokehLight) },
        uColorAccent: { value: new THREE.Color(settings.sparkleAccent) },
        uTexture: { value: bokehTexture }
      },
      vertexShader: `
        uniform float uTime;
        uniform float uTreeHeight;
        uniform float uBaseRadius;
        uniform float uConeTaper;
        uniform float uBokehScale;
        uniform vec3 uColorBokeh;
        uniform vec3 uColorAccent;

        attribute float aNormHeight;
        attribute float aAngle;
        attribute float aRadiusOffset;
        attribute float aSize;
        attribute float aPhase;
        attribute float aColorMix;

        varying vec3 vColor;
        varying float vAlpha;

        void main() {
          float s = aNormHeight;
          float y = s * uTreeHeight;
          float coneFactor = pow(max(1.0 - s, 0.0), uConeTaper);
          float r = uBaseRadius * coneFactor * aRadiusOffset;

          float angle = aAngle + uTime * 0.025 + sin(uTime * 0.2 + aPhase) * 0.03;
          vec3 pos = vec3(r * cos(angle), y + sin(uTime * 0.4 + aPhase) * 0.08, r * sin(angle));

          vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
          gl_Position = projectionMatrix * mvPosition;

          float pulse = 0.7 + 0.3 * sin(uTime * 1.5 + aPhase);
          gl_PointSize = clamp((aSize * uBokehScale * pulse) * (90.0 / -mvPosition.z), 1.0, 48.0);

          vColor = mix(uColorBokeh, uColorAccent, aColorMix * 0.5);
          vAlpha = 0.65 * pulse;
        }
      `,
      fragmentShader: `
        uniform sampler2D uTexture;
        varying vec3 vColor;
        varying float vAlpha;

        void main() {
          vec4 tex = texture2D(uTexture, gl_PointCoord);
          if (tex.a < 0.02) discard;
          gl_FragColor = vec4(vColor * tex.rgb * 0.8, tex.a * vAlpha * 0.7);
        }
      `,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });

    const bokehPoints = new THREE.Points(bokehGeo, bokehMaterial);
    scene.add(bokehPoints);

    // --- Particle System 4: Ambient Floating Stardust & Rising Sparkles ---
    const AMBIENT_COUNT = 1800;
    const ambientGeo = new THREE.BufferGeometry();
    const ambPos = new Float32Array(AMBIENT_COUNT * 3);
    const ambSpeed = new Float32Array(AMBIENT_COUNT);
    const ambSize = new Float32Array(AMBIENT_COUNT);
    const ambPhase = new Float32Array(AMBIENT_COUNT);

    for (let i = 0; i < AMBIENT_COUNT; i++) {
      const radius = 1.0 + Math.random() * 11.0;
      const angle = Math.random() * Math.PI * 2;
      ambPos[i * 3] = radius * Math.cos(angle);
      ambPos[i * 3 + 1] = Math.random() * (settings.treeHeight + 4.0) - 1.0;
      ambPos[i * 3 + 2] = radius * Math.sin(angle);
      ambSpeed[i] = 0.2 + Math.random() * 0.5;
      ambSize[i] = 10.0 + Math.random() * 18.0;
      ambPhase[i] = Math.random() * Math.PI * 2;
    }

    ambientGeo.setAttribute('position', new THREE.BufferAttribute(ambPos, 3));
    ambientGeo.setAttribute('aSpeed', new THREE.BufferAttribute(ambSpeed, 1));
    ambientGeo.setAttribute('aSize', new THREE.BufferAttribute(ambSize, 1));
    ambientGeo.setAttribute('aPhase', new THREE.BufferAttribute(ambPhase, 1));

    const ambientMaterial = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0.0 },
        uTreeHeight: { value: settings.treeHeight },
        uColor: { value: new THREE.Color(settings.sparkleAccent) },
        uTexture: { value: glowTexture }
      },
      vertexShader: `
        uniform float uTime;
        uniform float uTreeHeight;
        attribute float aSpeed;
        attribute float aSize;
        attribute float aPhase;
        varying float vAlpha;

        void main() {
          vec3 p = position;
          float ySpan = uTreeHeight + 5.0;
          p.y = mod(p.y + uTime * aSpeed * 0.35 + 1.0, ySpan) - 1.0;
          p.x += sin(uTime * 0.4 + aPhase) * 0.3;
          p.z += cos(uTime * 0.4 + aPhase) * 0.3;

          vec4 mvPosition = modelViewMatrix * vec4(p, 1.0);
          gl_Position = projectionMatrix * mvPosition;

          float twinkle = 0.4 + 0.6 * sin(uTime * 2.0 + aPhase);
          gl_PointSize = clamp((aSize * twinkle) * (70.0 / -mvPosition.z), 1.0, 24.0);
          vAlpha = twinkle * 0.5;
        }
      `,
      fragmentShader: `
        uniform sampler2D uTexture;
        uniform vec3 uColor;
        varying float vAlpha;

        void main() {
          vec4 tex = texture2D(uTexture, gl_PointCoord);
          if (tex.a < 0.02) discard;
          gl_FragColor = vec4(uColor * tex.rgb * 0.7, tex.a * vAlpha * 0.6);
        }
      `,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });

    const ambientPoints = new THREE.Points(ambientGeo, ambientMaterial);
    scene.add(ambientPoints);

    // --- Particle System 5: Ground Stardust Galaxy Ring ---
    const RING_COUNT = 1800;
    const ringGeo = new THREE.BufferGeometry();
    const ringRadius = new Float32Array(RING_COUNT);
    const ringAngle = new Float32Array(RING_COUNT);
    const ringSpeed = new Float32Array(RING_COUNT);
    const ringSize = new Float32Array(RING_COUNT);
    const ringPhase = new Float32Array(RING_COUNT);
    const ringDummyPositions = new Float32Array(RING_COUNT * 3);

    for (let i = 0; i < RING_COUNT; i++) {
      ringRadius[i] = 1.0 + Math.pow(Math.random(), 0.75) * (settings.baseRadius * 1.45);
      ringAngle[i] = Math.random() * Math.PI * 2;
      ringSpeed[i] = 0.025 + (1.0 / (ringRadius[i] + 0.5)) * 0.09;
      ringSize[i] = 10.0 + Math.random() * 18.0;
      ringPhase[i] = Math.random() * Math.PI * 2;
    }

    ringGeo.setAttribute('position', new THREE.BufferAttribute(ringDummyPositions, 3));
    ringGeo.setAttribute('aRadius', new THREE.BufferAttribute(ringRadius, 1));
    ringGeo.setAttribute('aAngle', new THREE.BufferAttribute(ringAngle, 1));
    ringGeo.setAttribute('aSpeed', new THREE.BufferAttribute(ringSpeed, 1));
    ringGeo.setAttribute('aSize', new THREE.BufferAttribute(ringSize, 1));
    ringGeo.setAttribute('aPhase', new THREE.BufferAttribute(ringPhase, 1));

    const ringMaterial = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0.0 },
        uColorPrimary: { value: new THREE.Color(settings.treePrimary) },
        uColorSecondary: { value: new THREE.Color(settings.treeSecondary) },
        uTexture: { value: sparkleTexture }
      },
      vertexShader: `
        uniform float uTime;
        uniform vec3 uColorPrimary;
        uniform vec3 uColorSecondary;

        attribute float aRadius;
        attribute float aAngle;
        attribute float aSpeed;
        attribute float aSize;
        attribute float aPhase;

        varying vec3 vColor;
        varying float vAlpha;

        void main() {
          float angle = aAngle + uTime * aSpeed;
          float r = aRadius + sin(angle * 3.0 + aPhase) * 0.12;
          float y = sin(angle * 2.0 + aPhase) * 0.10;

          vec3 pos = vec3(r * cos(angle), y, r * sin(angle));
          vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
          gl_Position = projectionMatrix * mvPosition;

          float twinkle = 0.5 + 0.5 * sin(uTime * 2.5 + aPhase);
          gl_PointSize = clamp((aSize * twinkle) * (70.0 / -mvPosition.z), 1.0, 24.0);

          vColor = mix(uColorPrimary, uColorSecondary, sin(angle + aPhase) * 0.5 + 0.5);
          vAlpha = twinkle * 0.5;
        }
      `,
      fragmentShader: `
        uniform sampler2D uTexture;
        varying vec3 vColor;
        varying float vAlpha;

        void main() {
          vec4 tex = texture2D(uTexture, gl_PointCoord);
          if (tex.a < 0.02) discard;
          gl_FragColor = vec4(vColor * tex.rgb * 0.7, tex.a * vAlpha * 0.6);
        }
      `,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });

    const ringPoints = new THREE.Points(ringGeo, ringMaterial);
    scene.add(ringPoints);

    // --- Update All Visual Elements ---
    function updateVisuals() {
      if (settings.greenscreen) {
        scene.background = new THREE.Color('#00ff00');
        renderer.setClearColor(0x00ff00, 1.0);
        document.body.style.backgroundColor = '#00ff00';
      } else {
        scene.background = new THREE.Color(settings.backgroundColor);
        renderer.setClearColor(settings.backgroundColor, 1.0);
        document.body.style.backgroundColor = settings.backgroundColor;
      }

      ambientLight.color.set(settings.ambientColor);
      ambientLight.intensity = settings.ambientIntensity;

      starPointLight.color.set(settings.starLightColor);
      starPointLight.intensity = settings.starLightIntensity;
      starPointLight.distance = settings.starLightDistance;
      starPointLight.position.set(0, settings.treeHeight + 0.3, 0);

      basePointLight.color.set(settings.baseLightColor);
      basePointLight.intensity = settings.baseLightIntensity;

      dirLight.color.set(settings.dirLightColor);
      dirLight.intensity = settings.dirLightIntensity;

      renderer.toneMappingExposure = settings.exposure;

      starGroup.position.set(0, settings.treeHeight + 0.3, 0);
      starMesh.scale.setScalar(settings.starScale);
      starHaloPoints.scale.setScalar(settings.starScale);
      gemMesh.scale.setScalar(settings.starScale);
      starMaterial.color.set(settings.starColor);
      starMaterial.emissive.set(settings.starGlow);

      starHaloMat.uniforms.uColor.value.set(settings.starColor);
      starHaloMat.uniforms.uGlowColor.value.set(settings.starGlow);

      spiralMaterial.uniforms.uTreeHeight.value = settings.treeHeight;
      spiralMaterial.uniforms.uBaseRadius.value = settings.baseRadius;
      spiralMaterial.uniforms.uConeTaper.value = settings.coneTaper;
      spiralMaterial.uniforms.uSpiralTurns.value = settings.spiralTurns;
      spiralMaterial.uniforms.uFlowSpeed.value = settings.flowSpeed;
      spiralMaterial.uniforms.uSparkleScale.value = settings.sparkleScale;
      spiralMaterial.uniforms.uColorPrimary.value.set(settings.treePrimary);
      spiralMaterial.uniforms.uColorSecondary.value.set(settings.treeSecondary);
      spiralMaterial.uniforms.uColorAccent.value.set(settings.sparkleAccent);

      coreMaterial.uniforms.uTreeHeight.value = settings.treeHeight;
      coreMaterial.uniforms.uBaseRadius.value = settings.baseRadius;
      coreMaterial.uniforms.uConeTaper.value = settings.coneTaper;
      coreMaterial.uniforms.uSparkleScale.value = settings.sparkleScale;
      coreMaterial.uniforms.uColorPrimary.value.set(settings.treePrimary);
      coreMaterial.uniforms.uColorSecondary.value.set(settings.treeSecondary);

      bokehMaterial.uniforms.uTreeHeight.value = settings.treeHeight;
      bokehMaterial.uniforms.uBaseRadius.value = settings.baseRadius;
      bokehMaterial.uniforms.uConeTaper.value = settings.coneTaper;
      bokehMaterial.uniforms.uBokehScale.value = settings.bokehScale;
      bokehMaterial.uniforms.uColorBokeh.value.set(settings.bokehLight);
      bokehMaterial.uniforms.uColorAccent.value.set(settings.sparkleAccent);

      ambientMaterial.uniforms.uTreeHeight.value = settings.treeHeight;
      ambientMaterial.uniforms.uColor.value.set(settings.sparkleAccent);

      ringMaterial.uniforms.uColorPrimary.value.set(settings.treePrimary);
      ringMaterial.uniforms.uColorSecondary.value.set(settings.treeSecondary);
    }

    function applyColorScheme(schemeKey) {
      const s = COLOR_SCHEMES[schemeKey];
      if (!s) return;
      settings.colorScheme = schemeKey;
      settings.treePrimary = s.treePrimary;
      settings.treeSecondary = s.treeSecondary;
      settings.sparkleAccent = s.sparkleAccent;
      settings.bokehLight = s.bokehLight;
      settings.starColor = s.starColor;
      settings.starGlow = s.starGlow;
      settings.backgroundColor = s.background;
      settings.starLightColor = s.lightStar || s.starColor;
      settings.baseLightColor = s.lightBase || s.treePrimary;
      settings.ambientColor = s.lightAmbient || '#261b0c';
      settings.dirLightColor = s.treePrimary;

      updateVisuals();
      if (gui) {
        gui.controllersRecursive().forEach(c => {
          if (c.property in settings) {
            c.updateDisplay();
          }
        });
      }
    }

    // --- Procedural Scene Randomizer (Upon Click) ---
    // Note: Per user specification, PostProcessor settings are NEVER touched or shuffled!
    function randomizeScene() {
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      applyColorScheme(randomScheme);

      // Re-roll geometric tree parameters
      settings.spiralTurns = Number((4.5 + Math.random() * 5.0).toFixed(1));
      settings.baseRadius = Number((4.2 + Math.random() * 1.8).toFixed(1));
      settings.treeHeight = Number((11.5 + Math.random() * 2.8).toFixed(1));
      settings.coneTaper = Number((0.72 + Math.random() * 0.28).toFixed(2));
      settings.sparkleScale = Number((0.8 + Math.random() * 0.5).toFixed(2));
      settings.bokehScale = Number((0.8 + Math.random() * 0.5).toFixed(2));
      settings.starScale = Number((0.85 + Math.random() * 0.45).toFixed(2));

      // Re-roll motion parameters
      settings.flowSpeed = Number((0.05 + Math.random() * 0.07).toFixed(3));
      settings.animationSpeed = Number((0.8 + Math.random() * 0.5).toFixed(2));

      // Randomly pick an animation mode
      const animations = [
        'Static (No Camera Motion)',
        'Majestic Orbit',
        'Ascending Spiral',
        'Star Focus Drift',
        'Breathing Dolly',
        'Gentle Sway (Pendulum)',
        'Low Angle Grandeur',
        'Cinematic Lissajous Drift'
      ];
      settings.cameraAnimation = animations[Math.floor(Math.random() * animations.length)];

      updateVisuals();
      if (gui) {
        gui.controllersRecursive().forEach(c => {
          if (c.property in settings) {
            c.updateDisplay();
          }
        });
      }
    }

    // --- Antialias Toggle & Renderer Rebuild ---
    function rebuildRenderer() {
      const oldCanvas = renderer.domElement;
      const newCanvas = document.createElement('canvas');
      newCanvas.id = 'webgl-canvas';
      oldCanvas.parentElement.replaceChild(newCanvas, oldCanvas);
      canvas = newCanvas;

      renderer.dispose();
      renderer = new THREE.WebGLRenderer({
        canvas: newCanvas,
        antialias: settings.antialias,
        powerPreference: 'high-performance'
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(settings.dpr);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = settings.exposure;

      postProcessor.renderer = renderer;
      postProcessor.setAntialias(settings.antialias);
      postProcessor.setSize(window.innerWidth, window.innerHeight, settings.dpr);

      controls.dispose();
      initControls(newCanvas);
      setupCanvasEvents(newCanvas);
      updateVisuals();
    }

    // --- Canvas Pointer / Click Detection (Distinguish Drag from Click) ---
    let pointerDownState = { x: 0, y: 0, time: 0 };

    function setupCanvasEvents(targetCanvas) {
      targetCanvas.addEventListener('pointerdown', (e) => {
        pointerDownState = {
          x: e.clientX,
          y: e.clientY,
          time: performance.now()
        };
      });

      targetCanvas.addEventListener('pointerup', (e) => {
        if (!settings.randomizeOnClick) return;
        const dx = e.clientX - pointerDownState.x;
        const dy = e.clientY - pointerDownState.y;
        const dt = performance.now() - pointerDownState.time;
        // True click: minimal displacement and short duration
        if (Math.hypot(dx, dy) < 6 && dt < 350) {
          randomizeScene();
        }
      });
    }

    setupCanvasEvents(canvas);

    // --- Window Resize ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      postProcessor.setSize(window.innerWidth, window.innerHeight, settings.dpr);
    });

    // --- Lil-GUI Configuration ---
    const gui = new GUI({ title: 'Tree Settings' });

    // 1. Color Themes
    const fColor = gui.addFolder('Color Themes & Background');
    fColor.add(settings, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Color Scheme').onChange(applyColorScheme);
    fColor.add(settings, 'greenscreen').name('Greenscreen (#00ff00)').onChange(updateVisuals);
    fColor.addColor(settings, 'backgroundColor').name('Background Color').onChange(updateVisuals);
    fColor.addColor(settings, 'treePrimary').name('Tree Primary').onChange(updateVisuals);
    fColor.addColor(settings, 'treeSecondary').name('Tree Secondary').onChange(updateVisuals);
    fColor.addColor(settings, 'sparkleAccent').name('Sparkle Accent').onChange(updateVisuals);
    fColor.addColor(settings, 'bokehLight').name('Bokeh Lights').onChange(updateVisuals);
    fColor.addColor(settings, 'starColor').name('Star Color').onChange(updateVisuals);
    fColor.addColor(settings, 'starGlow').name('Star Glow').onChange(updateVisuals);

    // 2. Animation & Camera
    const fAnim = gui.addFolder('Animation & Camera');
    const cameraAnimations = [
      'Static (No Camera Motion)',
      'Majestic Orbit',
      'Ascending Spiral',
      'Star Focus Drift',
      'Breathing Dolly',
      'Gentle Sway (Pendulum)',
      'Low Angle Grandeur',
      'Cinematic Lissajous Drift'
    ];
    fAnim.add(settings, 'cameraAnimation', cameraAnimations).name('Animation');
    fAnim.add(settings, 'animationSpeed', 0.0, 3.0, 0.05).name('Animation Speed');
    fAnim.add(settings, 'leftClickPan').name('Left Click: Drag Object').onChange(updateMouseButtons);

    // 3. Tree Geometry & FX
    const fTree = gui.addFolder('Tree Geometry & Dynamics');
    fTree.add(settings, 'spiralTurns', 3.0, 12.0, 0.1).name('Spiral Turns').onChange(updateVisuals);
    fTree.add(settings, 'baseRadius', 3.0, 8.0, 0.1).name('Base Radius').onChange(updateVisuals);
    fTree.add(settings, 'treeHeight', 8.0, 18.0, 0.1).name('Tree Height').onChange(updateVisuals);
    fTree.add(settings, 'coneTaper', 0.5, 1.4, 0.02).name('Cone Taper').onChange(updateVisuals);
    fTree.add(settings, 'flowSpeed', 0.01, 0.25, 0.005).name('Vortex Flow Speed').onChange(updateVisuals);
    fTree.add(settings, 'sparkleScale', 0.4, 2.5, 0.05).name('Sparkle Size').onChange(updateVisuals);
    fTree.add(settings, 'bokehScale', 0.4, 2.5, 0.05).name('Bokeh Size').onChange(updateVisuals);
    fTree.add(settings, 'starScale', 0.5, 2.5, 0.05).name('Star Scale').onChange(updateVisuals);

    // 4. Lighting & Exposure
    const fLight = gui.addFolder('Lighting & Exposure');
    fLight.add(settings, 'exposure', 0.1, 3.0, 0.05).name('Scene Exposure').onChange(updateVisuals);
    fLight.add(settings, 'ambientIntensity', 0.0, 3.0, 0.05).name('Ambient Intensity').onChange(updateVisuals);
    fLight.addColor(settings, 'ambientColor').name('Ambient Color').onChange(updateVisuals);
    fLight.add(settings, 'starLightIntensity', 0.0, 6.0, 0.1).name('Star Light Intensity').onChange(updateVisuals);
    fLight.addColor(settings, 'starLightColor').name('Star Light Color').onChange(updateVisuals);
    fLight.add(settings, 'starLightDistance', 5.0, 40.0, 1.0).name('Star Light Distance').onChange(updateVisuals);
    fLight.add(settings, 'baseLightIntensity', 0.0, 4.0, 0.1).name('Base Light Intensity').onChange(updateVisuals);
    fLight.addColor(settings, 'baseLightColor').name('Base Light Color').onChange(updateVisuals);
    fLight.add(settings, 'dirLightIntensity', 0.0, 3.0, 0.05).name('Dir Light Intensity').onChange(updateVisuals);
    fLight.addColor(settings, 'dirLightColor').name('Dir Light Color').onChange(updateVisuals);

    // 5. System & Interaction
    const fSystem = gui.addFolder('System & Settings');
    fSystem.add(settings, 'dpr', 0.5, 3.0, 0.1).name('Pixel Ratio (DPR)').onChange((val) => {
      renderer.setPixelRatio(val);
      postProcessor.setSize(window.innerWidth, window.innerHeight, val);
    });
    fSystem.add(settings, 'antialias').name('Antialias (MSAA)').onChange(rebuildRenderer);
    fSystem.add(settings, 'randomizeOnClick').name('Click Scene to Re-roll');
    fSystem.add({ randomize: randomizeScene }, 'randomize').name('🎲 Randomize Scene Now');

    // 6. Post-Processing Suite (PostProcessor.js)
    postProcessor.attachGUI(gui, 'Post-Processing (PostProcessor.js)');

    // --- Keydown 'H' to Hide/Show UI ---
    window.addEventListener('keydown', (e) => {
      if (e.code === 'KeyH' || e.key === 'h' || e.key === 'H') {
        if (typeof gui.show === 'function') {
          gui._hidden ? gui.show() : gui.hide();
        } else {
          gui.domElement.style.display = gui.domElement.style.display === 'none' ? '' : 'none';
        }
      }
    });

    // --- Infinite Animation Loop ---
    const clock = new THREE.Clock();
    let prevElapsedTime = 0;
    let accumulatedTime = 0;

    function animate() {
      requestAnimationFrame(animate);

      const currentElapsed = clock.getElapsedTime();
      const delta = currentElapsed - prevElapsedTime;
      prevElapsedTime = currentElapsed;

      accumulatedTime += delta * settings.animationSpeed;
      const t = accumulatedTime;

      // Update Particle Shaders
      spiralMaterial.uniforms.uTime.value = t;
      coreMaterial.uniforms.uTime.value = t;
      bokehMaterial.uniforms.uTime.value = t;
      ambientMaterial.uniforms.uTime.value = t;
      ringMaterial.uniforms.uTime.value = t;
      starHaloMat.uniforms.uTime.value = t;

      // Animate Apex Star
      starMesh.rotation.y = t * 0.6;
      starMesh.rotation.z = Math.sin(t * 0.7) * 0.12;
      gemMesh.rotation.y = -t * 1.2;
      gemMesh.rotation.x = t * 0.8;
      starHaloPoints.rotation.y = -t * 0.35;

      // Shimmering Star Light Pulsing
      const starPulse = 0.88 + 0.12 * Math.sin(t * 4.0);
      starPointLight.intensity = settings.starLightIntensity * starPulse;

      // Preconfigured Camera Animations
      const animMode = settings.cameraAnimation;
      if (animMode === 'Static (No Camera Motion)') {
        controls.update();
      } else if (animMode === 'Majestic Orbit') {
        const r = 21.0;
        const spd = t * 0.14;
        camera.position.x = Math.sin(spd) * r;
        camera.position.z = Math.cos(spd) * r;
        camera.position.y = settings.treeHeight * 0.45 + Math.sin(t * 0.1) * 1.2;
        controls.target.set(0, settings.treeHeight * 0.45, 0);
        controls.update();
      } else if (animMode === 'Ascending Spiral') {
        const spd = t * 0.18;
        const cycle = Math.sin(t * 0.09);
        const y = 2.5 + (settings.treeHeight * 0.7) * (0.5 + 0.5 * cycle);
        const r = 16.5 + 3.5 * (1.0 - (y / settings.treeHeight));
        camera.position.x = Math.sin(spd) * r;
        camera.position.z = Math.cos(spd) * r;
        camera.position.y = y;
        controls.target.set(0, y * 0.85, 0);
        controls.update();
      } else if (animMode === 'Star Focus Drift') {
        const r = 8.5;
        const spd = t * 0.22;
        const starY = settings.treeHeight + 0.3;
        camera.position.x = Math.sin(spd) * r;
        camera.position.z = Math.cos(spd) * r;
        camera.position.y = starY + Math.sin(t * 0.3) * 0.7;
        controls.target.set(0, starY, 0);
        controls.update();
      } else if (animMode === 'Breathing Dolly') {
        const r = 18.0 + 6.5 * Math.sin(t * 0.24);
        camera.position.x = Math.sin(t * 0.05) * 4.5;
        camera.position.z = r;
        camera.position.y = settings.treeHeight * 0.45 + Math.sin(t * 0.12) * 1.0;
        controls.target.set(0, settings.treeHeight * 0.45, 0);
        controls.update();
      } else if (animMode === 'Gentle Sway (Pendulum)') {
        const sway = Math.sin(t * 0.3);
        camera.position.x = sway * 12.0;
        camera.position.z = 20.0 + Math.cos(t * 0.3) * 2.0;
        camera.position.y = settings.treeHeight * 0.45 + Math.cos(t * 0.6) * 0.8;
        controls.target.set(0, settings.treeHeight * 0.45, 0);
        controls.update();
      } else if (animMode === 'Low Angle Grandeur') {
        const r = 16.0;
        const spd = t * 0.12;
        camera.position.x = Math.sin(spd) * r;
        camera.position.z = Math.cos(spd) * r;
        camera.position.y = 1.2 + Math.sin(t * 0.08) * 0.5;
        controls.target.set(0, settings.treeHeight * 0.6, 0);
        controls.update();
      } else if (animMode === 'Cinematic Lissajous Drift') {
        camera.position.x = Math.sin(t * 0.18) * 18.0;
        camera.position.z = Math.cos(t * 0.09) * 20.0;
        camera.position.y = settings.treeHeight * 0.45 + Math.sin(t * 0.18) * 3.5;
        controls.target.set(0, settings.treeHeight * 0.45 + Math.sin(t * 0.18) * 1.2, 0);
        controls.update();
      }

      // Render through PostProcessor pipeline
      if (postProcessor) {
        postProcessor.setMoonScreenPosition(camera, starGroup.position);
        postProcessor.renderScene(scene, camera);
      } else {
        renderer.render(scene, camera);
      }
    }

    // Start
    updateVisuals();
    animate();
  </script>
</body>
</html>
