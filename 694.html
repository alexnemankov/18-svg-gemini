<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="data:,">
  <meta name="description" content="An iridescent optical atmosphere, suspended in darkness. A seamless procedural light study.">
  <title>Iridescent Atmosphere</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    body { overscroll-behavior: none; }
    canvas { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
  </style>
</head>
<body>
  <canvas aria-label="A luminous iridescent orb with a copper crescent, blue atmosphere and soft pink light" role="img"></canvas>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js';
    import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

    const settings = {
      scheme: 'Original', customPalette: false, invert: false, tint: '#ffffff',
      color1: '#070605', color2: '#093f9f', color3: '#26b9df',
      color4: '#b79bdc', color5: '#f294bd', color6: '#ff6928', accent: '#ff3046',
      background: '#000000', greenscreen: false,
      pixelRatio: Math.min(devicePixelRatio || 1, 2),
      animation: 'Atmospheric flow', speed: 1, motionAmount: 1,
      zoom: 1, positionX: 0, positionY: 0, yaw: 0, pitch: 0, roll: 0,
      size: 1, intensity: 1, bloom: 0.20, grain: 0.03,
      rimWidth: 1, flowScale: 1, gradientCurve: 0.055, seed: 0,
      randomizeOnClick: true
    };
    // Exactly 19 schemes. Invert supplies both polarities of the achromatic schemes.
    const palettes = {
      'Original': ['070605', '093F9F', '26B9DF', 'B79BDC', 'F294BD', 'FF6928'],
      'Monochromatic': ['020A19', '10264A', '24518A', '4F87BF', 'A7CEEB', 'EDF7FF'],
      'Analogous': ['150520', '422066', '70428E', 'B75B9A', 'E98EA1', 'FFD2BF'],
      'Complementary': ['061521', '103E62', '147B9A', '56CBD1', 'F69543', 'FFE4AF'],
      'Split-complementary': ['110D2E', '39366F', '6B6BD0', '68C2C5', 'EBAC65', 'FFF0C9'],
      'Triadic': ['140C28', '583884', 'C06D99', '76BDB2', 'E4BB66', 'FFF0D0'],
      'Tetradic': ['111626', '31577E', '65B1B9', 'B286BF', 'ECA675', 'FFF0D4'],
      'Double split-complementary': ['141324', '58518C', '58A5B9', '93C8B7', 'D58C9D', 'FFE0B2'],
      'Achromatic': ['000000', '252525', '565656', '949494', 'D0D0D0', 'FFFFFF'],
      'Achromatic + Accent': ['000000', '252525', '686868', 'AAAAAA', 'E0E0E0', 'FFFFFF'],
      'Neutral + accent': ['171B1D', '42494A', '7C827E', 'B5B6AA', 'E8DDC5', 'E8A25E'],
      'Amber / Oxblood': ['F6AA1C', 'BC3908', '941B0C', 'F6AA1C', '220901'],
      'Lagoon / Midnight': ['63D1CF', '5BC0BE', '4BAD9E', '4BAD9E', '0B132B', '000000'],
      'Orchid / Ink': ['AA60C8', 'D69ADE', 'C9A3C6', 'CFB5C2', '0D001D', '120A12'],
      'Champagne / Teal': ['FEF1BE', 'FFBA00', '008189', '00474D', '061210'],
      'Chartreuse / Forest': ['D4FFB0', '7FFF00', '00B894', '0A3322', '05140A'],
      'Apricot / Aubergine': ['FFE8CC', 'FF8C00', 'C7501A', '3D1050', '0E0618'],
      'Lilac / Ultraviolet': ['E8E0FF', 'B38FFF', '6A3DE8', '1A1250', '090612'],
      'Ice / Fuchsia': ['E0FBFF', '00F0FF', 'D40078', '1E0A3D', '05020F']
    };
    const animations = ['Atmospheric flow', 'Light breathing', 'Chromatic tide', 'Lens drift',
      'Slow orbit', 'Elliptic orbit', 'Gentle approach', 'Crescent roll', 'Static'];
    const rgb = hex => {
      const value = parseInt(hex.replace('#', ''), 16);
      return new THREE.Vector3((value >> 16 & 255) / 255, (value >> 8 & 255) / 255, (value & 255) / 255);
    };
    const canvas = document.querySelector('canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false, powerPreference: 'low-power' });
    renderer.setClearColor(0x000000, 1);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;

    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const scene = new THREE.Scene();
    const geometry = new THREE.PlaneGeometry(2, 2);
    const vertexShader = /* glsl */`
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = vec4(position.xy, 0.0, 1.0);
      }
    `;
    const uniforms = {
      uResolution: { value: new THREE.Vector2() },
      uAspect: { value: 1 },
      uPhase: { value: 0 },
      uRadius: { value: 0.4 },
      uOffset: { value: new THREE.Vector2() },
      uView: { value: new THREE.Vector3() },
      uFlow: { value: new THREE.Vector2(1, 0.055) },
      uSeed: { value: 0 }, uRimWidth: { value: 1 }, uIntensity: { value: 1 }, uMotion: { value: 1 },
      uPaletteMode: { value: 0 }, uPalette: { value: Array.from({ length: 6 }, () => new THREE.Vector3()) },
      uAccentMode: { value: 0 }, uAccent: { value: rgb(settings.accent) },
      uTint: { value: new THREE.Color('#ffffff') },
      uBackground: { value: new THREE.Vector3() }, uInvert: { value: 0 },
      uBloom: { value: settings.bloom }, uGrain: { value: settings.grain }
    };

    const atmosphere = new THREE.ShaderMaterial({
      vertexShader,
      uniforms,
      depthTest: false,
      depthWrite: false,
      fragmentShader: /* glsl */`
        precision highp float;
        varying vec2 vUv;
        uniform vec2 uResolution;
        uniform float uAspect;
        uniform float uPhase;
        uniform float uRadius;
        uniform vec2 uOffset, uFlow;
        uniform vec3 uView, uPalette[6], uAccent, uTint;
        uniform float uSeed, uRimWidth, uIntensity, uPaletteMode, uAccentMode, uMotion;

        float hash(vec2 p) {
          vec3 p3 = fract(vec3(p.xyx) * 0.1031);
          p3 += dot(p3, p3.yzx + 33.33);
          return fract((p3.x + p3.y) * p3.z);
        }
        float noise(vec2 p) {
          vec2 i = floor(p), f = fract(p);
          f = f * f * (3.0 - 2.0 * f);
          return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x),
                     mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y);
        }
        float gaussian(float x, float width) {
          width *= uRimWidth;
          return exp(-0.5 * x * x / (width * width));
        }
        vec3 toLinear(vec3 c) {
          return mix(c / 12.92, pow((c + 0.055) / 1.055, vec3(2.4)), step(vec3(0.04045), c));
        }
        vec3 paletteAt(float t) {
          float x = clamp(t, 0.0, 1.0) * 5.0;
          if (x < 1.0) return mix(uPalette[0], uPalette[1], smoothstep(0.0, 1.0, x));
          if (x < 2.0) return mix(uPalette[1], uPalette[2], smoothstep(1.0, 2.0, x));
          if (x < 3.0) return mix(uPalette[2], uPalette[3], smoothstep(2.0, 3.0, x));
          if (x < 4.0) return mix(uPalette[3], uPalette[4], smoothstep(3.0, 4.0, x));
          return mix(uPalette[4], uPalette[5], smoothstep(4.0, 5.0, x));
        }
        void main() {
          vec2 screen = (vUv - 0.5) * vec2(uAspect, 1.0) / min(uAspect, 1.0);
          vec2 p = (screen - uOffset) / uRadius;
          float r = length(p);
          // Discard the distant halo to retain absolute black around the artwork.
          if (r > 1.0 + 0.49 * uRimWidth) { gl_FragColor = vec4(0); return; }

          vec2 cycle = mix(vec2(1.0, 0.0), vec2(cos(uPhase), sin(uPhase)), uMotion);
          float z = sqrt(max(0.0, 1.0 - r * r));
          // Virtual camera angles reproject the optical field, preserving the silhouette.
          vec3 surface = vec3(p, z);
          surface.xz = mat2(cos(uView.x), -sin(uView.x), sin(uView.x), cos(uView.x)) * surface.xz;
          surface.yz = mat2(cos(uView.y), -sin(uView.y), sin(uView.y), cos(uView.y)) * surface.yz;
          surface.xy = mat2(cos(uView.z), -sin(uView.z), sin(uView.z), cos(uView.z)) * surface.xy;
          vec2 q = surface.xy;
          float field = noise(q * 2.1 * uFlow.x + cycle * 0.28 + uSeed)
                      + 0.35 * noise(q * 4.3 * uFlow.x - cycle * 0.19 + uSeed) - 0.675;
          float up = q.y / max(length(q), 0.001);
          float crown = pow(max(up, 0.0), 9.0);
          float bottom = pow(max(-up, 0.0), 1.8);
          float sides = pow(1.0 - abs(up), 1.7);
          float breath = 1.0 + 0.065 * sin(uPhase) * uMotion;

          // Refraction only affects the light field: the circular silhouette never moves.
          float y = q.y + 0.017 * field
                  + 0.014 * sin(q.x * 2.4 + cycle.x) * cycle.y
                  + 0.009 * sin(uPhase * 2.0) * uMotion * (1.0 - min(r, 1.0));
          y += uFlow.y * q.x * q.x;

          vec3 color = vec3(0.028, 0.025, 0.021);
          color = mix(color, vec3(0.013, 0.035, 0.115), 1.0 - smoothstep(0.12, 0.60, y));
          color = mix(color, vec3(0.035, 0.30, 0.70), 1.0 - smoothstep(-0.02, 0.42, y));
          color = mix(color, vec3(0.10, 0.59, 0.82), 1.0 - smoothstep(-0.22, 0.25, y));
          color = mix(color, vec3(0.57, 0.68, 0.86), 1.0 - smoothstep(-0.40, -0.07, y));
          color = mix(color, vec3(0.76, 0.50, 0.82), 1.0 - smoothstep(-0.62, -0.27, y));
          color = mix(color, vec3(0.94, 0.54, 0.74), 1.0 - smoothstep(-0.85, -0.50, y));
          color = mix(color, vec3(1.0, 0.67, 0.53), 1.0 - smoothstep(-1.08, -0.78, y));

          // A view-angle-dependent, restrained thin-film response.
          vec3 interference = 0.5 + 0.5 * cos(vec3(0.0, 2.1, 4.2)
                            + (1.0 - z) * 7.0 + 0.18 * sin(uPhase) * uMotion + field * 0.18);
          color += (interference - 0.5) * 0.025 * (1.0 - smoothstep(-0.5, 0.3, y));
          color *= 1.0 + 0.018 * field;
          color += vec3(0.026, 0.012, 0.004) * gaussian(r - 0.94, 0.12) * smoothstep(0.15, 0.8, up);

          float aa = 1.0 / (min(uResolution.x, uResolution.y) * uRadius);
          float mask = 1.0 - smoothstep(0.971 - aa, 1.028 + aa, r);
          vec3 light = toLinear(max(color, 0.0)) * mask;

          // Nested optical bands blend into the atmosphere instead of tracing hard rings.
          float sideWindow = sides * (1.0 - smoothstep(0.23, 0.66, q.y));
          float shimmer = 0.008 * sin(uPhase + up * 3.0) * uMotion;
          light += vec3(0.025, 0.20, 0.14) * gaussian(r - (0.927 + shimmer), 0.051) * sideWindow;
          light += vec3(0.44, 0.37, 0.025) * gaussian(r - (0.981 + shimmer * 0.4), 0.033) * sideWindow;

          vec3 rim = mix(vec3(1.0, 0.19, 0.023), vec3(1.0, 0.045, 0.002), bottom);
          light += rim * gaussian(r - 1.002, 0.030 + 0.025 * bottom) * (0.35 + 0.40 * bottom) * breath;
          light += vec3(1.0, 0.25, 0.065) * gaussian(r - 1.01, 0.067) * (0.13 + 0.22 * crown) * breath;
          light += vec3(0.55, 0.055, 0.007) * gaussian(r - 1.02, 0.118) * (0.045 + 0.12 * bottom + 0.09 * crown);

          // The upper white-peach crescent and its broad copper corona.
          light += vec3(1.55, 1.05, 0.80) * gaussian(r - 0.989, 0.031) * crown * breath;
          light += vec3(0.77, 0.25, 0.085) * gaussian(r - 1.005, 0.063) * crown * breath;

          float luminance = dot(light, vec3(0.2126, 0.7152, 0.0722));
          vec3 themed = toLinear(paletteAt(pow(clamp(luminance, 0.0, 1.0), 0.4)))
                      * min(luminance * 5.0, 1.0) * (1.0 + max(luminance - 0.8, 0.0));
          light = mix(light, themed, uPaletteMode);
          light = mix(light, toLinear(uAccent) * (0.3 + luminance),
                      uAccentMode * gaussian(r - 0.99, 0.045) * 0.80);
          gl_FragColor = vec4(light * uTint * uIntensity, mask);
        }
      `
    });
    const quad = new THREE.Mesh(geometry, atmosphere);
    quad.frustumCulled = false;
    scene.add(quad);

    // Half-resolution, separable HDR bloom. Thresholding preserves the dark interior.
    const targetOptions = { type: THREE.HalfFloatType, depthBuffer: false, stencilBuffer: false };
    const image = new THREE.WebGLRenderTarget(1, 1, targetOptions);
    const bloomA = new THREE.WebGLRenderTarget(1, 1, targetOptions);
    const bloomB = new THREE.WebGLRenderTarget(1, 1, targetOptions);
    const blur = new THREE.ShaderMaterial({
      vertexShader, depthTest: false, depthWrite: false,
      uniforms: {
        uInput: { value: null }, uStep: { value: new THREE.Vector2() }, uExtract: { value: 0 }
      },
      fragmentShader: /* glsl */`
        precision highp float;
        varying vec2 vUv;
        uniform sampler2D uInput;
        uniform vec2 uStep;
        uniform float uExtract;
        vec3 sampleLight(vec2 uv) {
          vec3 c = texture2D(uInput, uv).rgb;
          float bright = max(c.r, max(c.g, c.b));
          return c * mix(1.0, smoothstep(0.32, 1.2, bright), uExtract);
        }
        void main() {
          vec3 c = sampleLight(vUv) * 0.227027;
          c += (sampleLight(vUv + uStep * 1.384615) + sampleLight(vUv - uStep * 1.384615)) * 0.316216;
          c += (sampleLight(vUv + uStep * 3.230769) + sampleLight(vUv - uStep * 3.230769)) * 0.070270;
          gl_FragColor = vec4(c, 1.0);
        }
      `
    });
    const composite = new THREE.ShaderMaterial({
      vertexShader, depthTest: false, depthWrite: false,
      uniforms: { uImage: { value: image.texture }, uBloomTexture: { value: bloomB.texture },
        uPhase: uniforms.uPhase, uBackground: uniforms.uBackground, uInvert: uniforms.uInvert,
        uBloom: uniforms.uBloom, uGrain: uniforms.uGrain },
      fragmentShader: /* glsl */`
        precision highp float;
        varying vec2 vUv;
        uniform sampler2D uImage, uBloomTexture;
        uniform float uPhase, uInvert, uBloom, uGrain;
        uniform vec3 uBackground;
        float grain(vec2 p) {
          vec3 p3 = fract(vec3(p.xyx) * 0.1031);
          p3 += dot(p3, p3.yzx + 33.33);
          return fract((p3.x + p3.y) * p3.z);
        }
        void main() {
          vec4 source = texture2D(uImage, vUv);
          vec3 light = source.rgb + texture2D(uBloomTexture, vUv).rgb * uBloom;
          gl_FragColor = vec4(light, 1.0);
          #include <tonemapping_fragment>
          #include <colorspace_fragment>
          // Grain is added in display space, gated to keep black pixels exactly black.
          float g1 = grain(gl_FragCoord.xy) - 0.5;
          float g2 = grain(gl_FragCoord.yx + 91.7) - 0.5;
          float g = g1 * (0.85 + 0.15 * cos(uPhase)) + g2 * 0.15 * sin(uPhase);
          float luminance = dot(gl_FragColor.rgb, vec3(0.2126, 0.7152, 0.0722));
          gl_FragColor.rgb += g * uGrain * smoothstep(0.0, 0.085, luminance);
          gl_FragColor.rgb = max(gl_FragColor.rgb, 0.0);
          // Composite after tone mapping, keeping the key color exactly #00ff00.
          float coverage = max(source.a, clamp(max(gl_FragColor.r, max(gl_FragColor.g, gl_FragColor.b)), 0.0, 1.0));
          vec3 orb = mix(gl_FragColor.rgb, vec3(coverage) - min(gl_FragColor.rgb, vec3(coverage)), uInvert);
          gl_FragColor = vec4(orb + uBackground * (1.0 - coverage), 1.0);
        }
      `
    });

    function updateColors() {
      const colors = Array.from({ length: 6 }, (_, i) => rgb(settings['color' + (i + 1)]));
      // A dark-to-light ramp keeps the atmosphere dimensional in every palette.
      colors.sort((a, b) => a.dot(new THREE.Vector3(0.2126, 0.7152, 0.0722))
                          - b.dot(new THREE.Vector3(0.2126, 0.7152, 0.0722)));
      colors.forEach((color, i) => uniforms.uPalette.value[i].copy(color));
      uniforms.uPaletteMode.value = settings.scheme === 'Original' && !settings.customPalette ? 0 : 1;
      uniforms.uAccentMode.value = ['Achromatic + Accent', 'Neutral + accent'].includes(settings.scheme) ? 1 : 0;
      uniforms.uAccent.value.copy(rgb(settings.accent));
      uniforms.uTint.value.set(settings.tint);
      uniforms.uInvert.value = settings.invert ? 1 : 0;
      const background = rgb(settings.background);
      if (settings.invert) background.set(1 - background.x, 1 - background.y, 1 - background.z);
      uniforms.uBackground.value.copy(settings.greenscreen ? rgb('#00ff00') : background);
    }
    function applyPalette() {
      const colors = palettes[settings.scheme];
      for (let i = 0; i < 6; i++) {
        settings['color' + (i + 1)] = '#' + colors[Math.round(i * (colors.length - 1) / 5)].toLowerCase();
      }
      settings.customPalette = false;
      settings.accent = settings.scheme === 'Neutral + accent' ? '#e8a25e' : '#ff3046';
      updateColors();
      refreshPanel();
    }
    function refreshPanel() { gui.controllersRecursive().forEach(controller => controller.updateDisplay()); }

    const gui = new GUI({ title: 'Iridescent Atmosphere' });
    gui.add(settings, 'scheme', Object.keys(palettes)).name('Color scheme').onChange(applyPalette);
    gui.add(settings, 'animation', animations).name('Animation');
    gui.add(settings, 'speed', 0, 3, 0.01).name('Animation speed');
    gui.add(settings, 'randomizeOnClick').name('Randomize on click');
    const actions = {
      randomize() {
        const random = (min, max) => Math.round((min + Math.random() * (max - min)) * 1000) / 1000;
        const names = Object.keys(palettes).filter(name => name !== settings.scheme);
        settings.scheme = names[Math.floor(Math.random() * names.length)];
        settings.animation = animations[Math.floor(Math.random() * (animations.length - 1))];
        settings.seed = (settings.seed + 1 + Math.floor(random(0, 999))) % 1001;
        settings.size = random(0.73, 1.12);
        settings.rimWidth = random(0.7, 1.5);
        settings.flowScale = random(0.65, 1.9);
        settings.gradientCurve = random(-0.22, 0.28);
        settings.motionAmount = random(0.5, 1.5);
        settings.speed = random(0.35, 1.2);
        settings.intensity = random(0.8, 1.25);
        settings.bloom = random(0.10, 0.38);
        applyPalette();
      },
      resetView() {
        Object.assign(settings, { zoom: 1, positionX: 0, positionY: 0, yaw: 0, pitch: 0, roll: 0 });
        refreshPanel();
      }
    };
    gui.add(actions, 'randomize').name('New variation');
    const colorFolder = gui.addFolder('Colors & background');
    colorFolder.add(settings, 'greenscreen').name('Greenscreen').onChange(updateColors);
    colorFolder.addColor(settings, 'background').name('Background').onChange(updateColors);
    colorFolder.add(settings, 'invert').name('Invert colors').onChange(updateColors);
    colorFolder.addColor(settings, 'tint').name('Tint').onChange(updateColors);
    colorFolder.addColor(settings, 'accent').name('Accent').onChange(updateColors);
    colorFolder.add(settings, 'customPalette').name('Custom palette').onChange(updateColors);
    for (let i = 1; i <= 6; i++) {
      colorFolder.addColor(settings, 'color' + i).name('Color ' + i).onChange(() => {
        settings.customPalette = true;
        updateColors();
        refreshPanel();
      });
    }
    colorFolder.close();
    const viewFolder = gui.addFolder('View');
    viewFolder.add(settings, 'zoom', 0.2, 5, 0.01).name('Zoom').listen();
    viewFolder.add(settings, 'positionX', -2, 2, 0.001).name('Position X').listen();
    viewFolder.add(settings, 'positionY', -2, 2, 0.001).name('Position Y').listen();
    viewFolder.add(settings, 'yaw', -180, 180, 0.1).name('Camera yaw').listen();
    viewFolder.add(settings, 'pitch', -85, 85, 0.1).name('Camera pitch').listen();
    viewFolder.add(settings, 'roll', -180, 180, 0.1).name('Camera roll').listen();
    viewFolder.add(actions, 'resetView').name('Reset view');
    viewFolder.close();
    const atmosphereFolder = gui.addFolder('Atmosphere');
    atmosphereFolder.add(settings, 'size', 0.4, 1.5, 0.01).name('Orb size');
    atmosphereFolder.add(settings, 'intensity', 0.2, 2, 0.01).name('Light intensity');
    atmosphereFolder.add(settings, 'rimWidth', 0.5, 2, 0.01).name('Rim softness');
    atmosphereFolder.add(settings, 'flowScale', 0.4, 3, 0.01).name('Optical depth');
    atmosphereFolder.add(settings, 'gradientCurve', -0.4, 0.4, 0.001).name('Gradient curvature');
    atmosphereFolder.add(settings, 'motionAmount', 0, 2, 0.01).name('Motion amount');
    atmosphereFolder.add(settings, 'seed', 0, 1000, 1).name('Variation seed');
    atmosphereFolder.add(settings, 'bloom', 0, 0.8, 0.01).name('Bloom');
    atmosphereFolder.add(settings, 'grain', 0, 0.08, 0.001).name('Film grain');
    atmosphereFolder.close();
    gui.add(settings, 'pixelRatio', 0.5, 3, 0.25).name('Pixel ratio (DPR)').onChange(resize);
    updateColors();

    let uiVisible = true;
    window.addEventListener('keydown', event => {
      if (event.key.toLowerCase() !== 'h' || event.repeat || event.ctrlKey || event.metaKey || event.altKey) return;
      uiVisible = !uiVisible;
      if (uiVisible) gui.show(); else gui.hide();
    }, { capture: true });

    // Manual view offsets remain independent of the animated view at all times.
    const clamp = THREE.MathUtils.clamp;
    const pointers = new Map();
    let gesture = null;
    const distance = () => {
      const [a, b] = [...pointers.values()];
      return a && b ? Math.hypot(a.x - b.x, a.y - b.y) : 0;
    };
    canvas.addEventListener('wheel', event => {
      event.preventDefault();
      const delta = event.deltaY * (event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? innerHeight : 1);
      settings.zoom = clamp(settings.zoom * Math.exp(-delta * 0.001), 0.2, 5);
    }, { passive: false });
    canvas.addEventListener('contextmenu', event => event.preventDefault());
    canvas.addEventListener('pointerdown', event => {
      if (![0, 2].includes(event.button)) return;
      canvas.setPointerCapture(event.pointerId);
      pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
      if (pointers.size === 1) gesture = {
        x: event.clientX, y: event.clientY, moved: false,
        orbit: event.button === 2 || event.altKey, button: event.button
      };
      else if (gesture) gesture.moved = true;
    });
    canvas.addEventListener('pointermove', event => {
      const pointer = pointers.get(event.pointerId);
      if (!pointer || !gesture) return;
      const dx = event.clientX - pointer.x, dy = event.clientY - pointer.y;
      const before = distance();
      pointer.x = event.clientX; pointer.y = event.clientY;
      const after = distance();
      if (Math.hypot(event.clientX - gesture.x, event.clientY - gesture.y) > 4) gesture.moved = true;
      if (!gesture.moved) return;
      if (pointers.size > 1) {
        if (before > 0) settings.zoom = clamp(settings.zoom * after / before, 0.2, 5);
        settings.positionX = clamp(settings.positionX + dx / Math.min(innerWidth, innerHeight) / 2, -2, 2);
        settings.positionY = clamp(settings.positionY - dy / Math.min(innerWidth, innerHeight) / 2, -2, 2);
      } else if (gesture.orbit) {
        settings.yaw = ((settings.yaw + dx * 0.25 + 540) % 360) - 180;
        settings.pitch = clamp(settings.pitch + dy * 0.2, -85, 85);
      } else {
        settings.positionX = clamp(settings.positionX + dx / Math.min(innerWidth, innerHeight), -2, 2);
        settings.positionY = clamp(settings.positionY - dy / Math.min(innerWidth, innerHeight), -2, 2);
      }
    });
    function endPointer(event) {
      if (!pointers.has(event.pointerId)) return;
      const click = event.type === 'pointerup' && pointers.size === 1 && gesture && !gesture.moved && gesture.button === 0;
      pointers.delete(event.pointerId);
      if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
      if (!pointers.size) gesture = null;
      if (click && settings.randomizeOnClick) actions.randomize();
    }
    canvas.addEventListener('pointerup', endPointer);
    canvas.addEventListener('pointercancel', endPointer);
    canvas.addEventListener('lostpointercapture', endPointer);

    const drawingSize = new THREE.Vector2();
    function resize() {
      const width = Math.max(1, window.innerWidth);
      const height = Math.max(1, window.innerHeight);
      renderer.setPixelRatio(settings.pixelRatio);
      renderer.setSize(width, height, false);
      renderer.getDrawingBufferSize(drawingSize);
      uniforms.uResolution.value.copy(drawingSize);
      uniforms.uAspect.value = width / height;
      image.setSize(drawingSize.x, drawingSize.y);
      bloomA.setSize(Math.max(1, Math.floor(drawingSize.x / 2)), Math.max(1, Math.floor(drawingSize.y / 2)));
      bloomB.setSize(bloomA.width, bloomA.height);
    }
    window.addEventListener('resize', resize, { passive: true });
    resize();

    const loopDuration = 24;
    let elapsed = 0;
    let previousTime;
    function render(now) {
      // Pause while hidden; every animated expression is periodic in this same phase.
      if (previousTime !== undefined && !document.hidden && settings.animation !== 'Static') {
        elapsed += Math.min((now - previousTime) / 1000, 0.1) * settings.speed;
      }
      previousTime = now;
      const phase = settings.animation === 'Static' ? 0 : 2 * Math.PI * (elapsed % loopDuration) / loopDuration;
      uniforms.uPhase.value = phase;
      const s = Math.sin(phase), c = Math.cos(phase), amount = settings.motionAmount;
      let yaw = 0, pitch = 0, roll = 0, x = 0, y = 0, scale = 1, intensity = 1;
      let curvature = settings.gradientCurve;
      switch (settings.animation) {
        case 'Light breathing': intensity = 1 + 0.09 * s * amount; scale = 1 + 0.018 * s * amount; break;
        case 'Chromatic tide': curvature += 0.13 * s * amount; pitch = 0.035 * s * amount; break;
        case 'Lens drift': x = 0.027 * s * amount; y = 0.018 * Math.sin(phase * 2) * amount; break;
        case 'Slow orbit': yaw = 0.26 * s * amount; pitch = 0.12 * c * amount; break;
        case 'Elliptic orbit': yaw = 0.20 * s * amount; pitch = 0.09 * c * amount; x = 0.025 * s * amount; y = 0.012 * c * amount; break;
        case 'Gentle approach': scale = 1 + 0.07 * s * amount; pitch = 0.025 * c * amount; break;
        case 'Crescent roll': roll = 0.14 * s * amount; curvature += 0.035 * c * amount; break;
      }
      uniforms.uRadius.value = 0.4 * settings.size * settings.zoom * scale;
      uniforms.uOffset.value.set(settings.positionX + x, settings.positionY + y);
      uniforms.uView.value.set(THREE.MathUtils.degToRad(settings.yaw) + yaw,
        THREE.MathUtils.degToRad(settings.pitch) + pitch, THREE.MathUtils.degToRad(settings.roll) + roll);
      uniforms.uFlow.value.set(settings.flowScale, curvature);
      uniforms.uSeed.value = settings.seed;
      uniforms.uRimWidth.value = settings.rimWidth;
      uniforms.uIntensity.value = settings.intensity * intensity;
      uniforms.uMotion.value = settings.motionAmount;
      uniforms.uBloom.value = settings.bloom;
      uniforms.uGrain.value = settings.grain;

      quad.material = atmosphere;
      renderer.setRenderTarget(image);
      renderer.render(scene, camera);

      quad.material = blur;
      blur.uniforms.uInput.value = image.texture;
      blur.uniforms.uExtract.value = 1;
      blur.uniforms.uStep.value.set(3 / bloomA.width, 0);
      renderer.setRenderTarget(bloomA);
      renderer.render(scene, camera);
      blur.uniforms.uInput.value = bloomA.texture;
      blur.uniforms.uExtract.value = 0;
      blur.uniforms.uStep.value.set(0, 3 / bloomA.height);
      renderer.setRenderTarget(bloomB);
      renderer.render(scene, camera);

      quad.material = composite;
      renderer.setRenderTarget(null);
      renderer.render(scene, camera);
    }
    document.addEventListener('visibilitychange', () => { previousTime = undefined; });
    renderer.setAnimationLoop(render);
    window.addEventListener('pagehide', () => renderer.setAnimationLoop(null));
    window.addEventListener('pageshow', () => { previousTime = undefined; renderer.setAnimationLoop(render); });
  </script>
</body>
</html>
