<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meteor Shower On Horizon</title>
  <style>
    * {
      font-family: "arial black", Helvetica, verdana, monospace, sans-serif;
      letter-spacing: 0.2rem;
      margin: 0;
      padding: 0;
      color: #fff;
      overflow: hidden;
      box-sizing: border-box;
    }

    body {
      position: relative;
      background: #000;
      user-select: none;
      -webkit-user-select: none;
      width: 100vw;
      height: 100vh;
    }

    canvas#canvas {
      display: block;
      background: #000;
      width: 100vw;
      height: 100vh;
      cursor: grab;
      touch-action: none;
    }

    #filter {
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 50%;
      background: rgba(0, 0, 0, 0.6);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="canvas">Canvas not supported.</canvas>
  <div id="filter"></div>

  <script type="module">
    import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

    (function () {
      'use strict';

      const canvas = document.getElementById('canvas');
      const filterDiv = document.getElementById('filter');

      if (!canvas || !canvas.getContext) {
        return;
      }

      const ctx = canvas.getContext('2d');
      let X = canvas.width = window.innerWidth;
      let Y = canvas.height = window.innerHeight;

      function rand(min, max) {
        return Math.floor(Math.random() * (max - min + 1) + min);
      }

      // 19 preconfigured color schemes
      const SCHEMES = [
        'Original',
        'Monochromatic',
        'Analogous',
        'Complementary',
        'Split-complementary',
        'Triadic',
        'Tetradic',
        'Double split-complementary',
        'Achromatic',
        'Achromatic + Accent',
        'Neutral + accent',
        'Palette 1 (F6AA1C, BC3908, 941B0C, F6AA1C, 220901)',
        'Palette 2 (63D1CF, 5BC0BE, 4BAD9E, 4BAD9E, 0B132B, 000000)',
        'Palette 3 (AA60C8, D69ADE, C9A3C6, CFB5C2, 0D001D, 120A12)',
        'Palette 4 (FEF1BE, FFBA00, 008189, 00474D, 061210)',
        'Palette 5 (D4FFB0, 7FFF00, 00B894, 0A3322, 05140A)',
        'Palette 6 (FFE8CC, FF8C00, C7501A, 3D1050, 0E0618)',
        'Palette 7 (E8E0FF, B38FFF, 6A3DE8, 1A1250, 090612)',
        'Palette 8 (E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)'
      ];

      const PALETTES = {
        'Palette 1 (F6AA1C, BC3908, 941B0C, F6AA1C, 220901)': [
          '#F6AA1C', '#BC3908', '#941B0C', '#F6AA1C', '#220901'
        ],
        'Palette 2 (63D1CF, 5BC0BE, 4BAD9E, 4BAD9E, 0B132B, 000000)': [
          '#63D1CF', '#5BC0BE', '#4BAD9E', '#4BAD9E', '#0B132B', '#000000'
        ],
        'Palette 3 (AA60C8, D69ADE, C9A3C6, CFB5C2, 0D001D, 120A12)': [
          '#AA60C8', '#D69ADE', '#C9A3C6', '#CFB5C2', '#0D001D', '#120A12'
        ],
        'Palette 4 (FEF1BE, FFBA00, 008189, 00474D, 061210)': [
          '#FEF1BE', '#FFBA00', '#008189', '#00474D', '#061210'
        ],
        'Palette 5 (D4FFB0, 7FFF00, 00B894, 0A3322, 05140A)': [
          '#D4FFB0', '#7FFF00', '#00B894', '#0A3322', '#05140A'
        ],
        'Palette 6 (FFE8CC, FF8C00, C7501A, 3D1050, 0E0618)': [
          '#FFE8CC', '#FF8C00', '#C7501A', '#3D1050', '#0E0618'
        ],
        'Palette 7 (E8E0FF, B38FFF, 6A3DE8, 1A1250, 090612)': [
          '#E8E0FF', '#B38FFF', '#6A3DE8', '#1A1250', '#090612'
        ],
        'Palette 8 (E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)': [
          '#E0FBFF', '#00F0FF', '#D40078', '#1E0A3D', '#05020F'
        ]
      };

      const params = {
        // Theme & color options
        colorScheme: 'Original',
        baseHue: rand(0, 360),
        accentColor: '#ff1744',
        useCustomColor: false,
        customColor: '#00ffff',
        blendMode: 'lighter',

        // Background & Greenscreen
        greenscreen: false,
        backgroundColor: '#000000',
        trailFade: 0.1,

        // Camera transform (zoom & drag)
        zoom: 1.0,
        panX: 0,
        panY: 0,

        // Particle dynamics & geometry
        shapeNum: X < 768 ? 500 : 1000,
        speed: 1.0,
        driftSpeed: 1.0,
        gravityStrength: 1.0,
        particleScale: 1.0,
        particleOpacity: 1.0,
        tailLength: 100,

        // Reflection filter
        filterEnabled: true,
        filterOpacity: 0.6,
        filterOnGreenscreen: false,

        // Procedural randomization
        clickRandomize: true
      };

      const shapes = [];

      function Shape(ctx, x, y, c) {
        this.ctx = ctx;
        this.c = c;
        this.colorStyle = '';
        this.init(x, y, c);
      }

      Shape.prototype.assignColor = function() {
        if (params.useCustomColor) {
          this.colorStyle = params.customColor;
          return;
        }

        const scheme = params.colorScheme;
        const hBase = params.baseHue;

        if (scheme === 'Original') {
          this.colorStyle = 'hsl(' + (this.c % 360) + ', 80%, 60%)';
        } else if (scheme === 'Monochromatic') {
          const l = rand(40, 85);
          const s = rand(65, 95);
          this.colorStyle = 'hsl(' + hBase + ', ' + s + '%, ' + l + '%)';
        } else if (scheme === 'Analogous') {
          const offset = [-30, 0, 30][rand(0, 2)] + rand(-10, 10);
          const h = (hBase + offset + 360) % 360;
          this.colorStyle = 'hsl(' + h + ', 85%, ' + rand(50, 75) + '%)';
        } else if (scheme === 'Complementary') {
          const offset = [0, 180][rand(0, 1)] + rand(-10, 10);
          const h = (hBase + offset + 360) % 360;
          this.colorStyle = 'hsl(' + h + ', 85%, ' + rand(50, 75) + '%)';
        } else if (scheme === 'Split-complementary') {
          const offset = [0, 150, 210][rand(0, 2)] + rand(-10, 10);
          const h = (hBase + offset + 360) % 360;
          this.colorStyle = 'hsl(' + h + ', 85%, ' + rand(50, 75) + '%)';
        } else if (scheme === 'Triadic') {
          const offset = [0, 120, 240][rand(0, 2)] + rand(-10, 10);
          const h = (hBase + offset + 360) % 360;
          this.colorStyle = 'hsl(' + h + ', 85%, ' + rand(50, 75) + '%)';
        } else if (scheme === 'Tetradic') {
          const offset = [0, 90, 180, 270][rand(0, 3)] + rand(-8, 8);
          const h = (hBase + offset + 360) % 360;
          this.colorStyle = 'hsl(' + h + ', 85%, ' + rand(50, 75) + '%)';
        } else if (scheme === 'Double split-complementary') {
          const offset = [-30, 30, 150, 210][rand(0, 3)] + rand(-8, 8);
          const h = (hBase + offset + 360) % 360;
          this.colorStyle = 'hsl(' + h + ', 85%, ' + rand(50, 75) + '%)';
        } else if (scheme === 'Achromatic') {
          const l = rand(30, 95);
          this.colorStyle = 'hsl(0, 0%, ' + l + '%)';
        } else if (scheme === 'Achromatic + Accent') {
          if (Math.random() < 0.22) {
            this.colorStyle = params.accentColor || '#ff1744';
          } else {
            const l = rand(30, 95);
            this.colorStyle = 'hsl(0, 0%, ' + l + '%)';
          }
        } else if (scheme === 'Neutral + accent') {
          if (Math.random() < 0.22) {
            this.colorStyle = params.accentColor || '#ff0055';
          } else {
            const neutralH = rand(25, 45);
            const neutralS = rand(10, 25);
            const neutralL = rand(40, 75);
            this.colorStyle = 'hsl(' + neutralH + ', ' + neutralS + '%, ' + neutralL + '%)';
          }
        } else if (PALETTES[scheme]) {
          const pal = PALETTES[scheme];
          this.colorStyle = pal[rand(0, pal.length - 1)];
        } else {
          this.colorStyle = 'hsl(' + (this.c % 360) + ', 80%, 60%)';
        }
      };

      Shape.prototype.init = function(x, y, c) {
        this.x = x;
        this.y = y;
        this.c = c;
        this.r = rand(1, 2);
        this.l = rand(10, params.tailLength);
        this.sl = this.l;
        this.ga = Math.random();
        this.v = {
          x: rand(-1, 1) * Math.random(),
          y: 0
        };
        this.assignColor();
      };

      Shape.prototype.draw = function() {
        const c = this.ctx;
        c.save();
        c.globalAlpha = this.ga * params.particleOpacity;
        c.globalCompositeOperation = params.blendMode;
        c.fillStyle = this.colorStyle;
        c.beginPath();
        c.arc(this.x, this.y, Math.max(0.1, this.r * params.particleScale), 0, Math.PI * 2, false);
        c.fill();
        c.restore();
      };

      Shape.prototype.updateParams = function() {
        const ratio = (this.sl > 0 ? (this.l / this.sl) : 1) * 1.1;
        this.r *= ratio;
        this.x += this.v.x * params.driftSpeed;
        this.v.y = ((Y / 2) - this.y) * params.gravityStrength;
        this.y += (this.v.y / 30) * params.speed;
        this.l -= 1;
        if (this.l < 0) {
          this.c += 10;
          this.init(rand(0, X), (Y / 2) * Math.random(), this.c);
        }
      };

      Shape.prototype.render = function() {
        this.updateParams();
        this.draw();
        ctx.save();
        ctx.translate(0, Y);
        ctx.scale(1, -1);
        this.draw();
        ctx.restore();
      };

      function updateAllParticleColors() {
        for (let i = 0; i < shapes.length; i++) {
          shapes[i].assignColor();
        }
      }

      function syncShapeCount() {
        while (shapes.length < params.shapeNum) {
          shapes.push(new Shape(ctx, rand(0, X), (Y / 2) * Math.random(), rand(0, 360)));
        }
        while (shapes.length > params.shapeNum) {
          shapes.pop();
        }
      }

      for (let i = 0; i < params.shapeNum; i++) {
        const s = new Shape(ctx, rand(0, X), (Y / 2) * Math.random(), rand(0, 360));
        shapes.push(s);
      }

      function clearToBackground() {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = 1;
        const bg = params.greenscreen ? '#00ff00' : params.backgroundColor;
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, X, Y);
        canvas.style.backgroundColor = bg;
      }

      function resetView() {
        params.zoom = 1.0;
        params.panX = 0;
        params.panY = 0;
        updateGuiDisplays();
      }

      function updateFilterPosition() {
        if (!filterDiv) return;
        if (!params.filterEnabled || (params.greenscreen && !params.filterOnGreenscreen)) {
          filterDiv.style.display = 'none';
          return;
        }
        filterDiv.style.display = 'block';
        const screenHorizon = params.panY + (Y / 2) * params.zoom;
        filterDiv.style.top = Math.max(0, screenHorizon) + 'px';
        filterDiv.style.height = Math.max(0, Y - screenHorizon) + 'px';
        filterDiv.style.backgroundColor = 'rgba(0, 0, 0, ' + params.filterOpacity + ')';
      }

      function render() {
        const currentBg = params.greenscreen ? '#00ff00' : params.backgroundColor;

        // 1. Trail fade
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = params.trailFade;
        ctx.fillStyle = currentBg;
        ctx.fillRect(0, 0, X, Y);

        // 2. Camera transform for entire scene (sky and reflection)
        ctx.setTransform(params.zoom, 0, 0, params.zoom, params.panX, params.panY);

        // 3. Render shapes
        for (let i = 0; i < shapes.length; i++) {
          shapes[i].render();
        }

        // 4. Match filter to horizon
        updateFilterPosition();

        requestAnimationFrame(render);
      }

      // Initial clear
      clearToBackground();
      render();

      /********************
        GUI Setup (lil-gui)
      ********************/
      const gui = new GUI({ title: 'Meteor Shower Settings' });

      // Procedural Variation Folder
      const fProcedural = gui.addFolder('Procedural Generation');
      fProcedural.add(params, 'clickRandomize').name('Click Scene to Randomize');
      fProcedural.add({ randomize: randomizeScene }, 'randomize').name('🎲 Randomize Theme & Scene');

      // Color Schemes Folder
      const fColor = gui.addFolder('Colors & Themes');
      fColor.add(params, 'colorScheme', SCHEMES).name('Color Scheme').onChange(() => {
        updateAllParticleColors();
      });
      fColor.add(params, 'baseHue', 0, 360, 1).name('Base Hue').onChange(() => {
        updateAllParticleColors();
      });
      fColor.addColor(params, 'accentColor').name('Accent Color').onChange(() => {
        updateAllParticleColors();
      });
      fColor.add(params, 'useCustomColor').name('Override Custom Color').onChange(() => {
        updateAllParticleColors();
      });
      fColor.addColor(params, 'customColor').name('Custom Color').onChange(() => {
        updateAllParticleColors();
      });
      fColor.add(params, 'blendMode', ['lighter', 'source-over', 'screen']).name('Blend Mode');

      // Background Folder
      const fBg = gui.addFolder('Background & Greenscreen');
      fBg.add(params, 'greenscreen').name('Greenscreen (#00ff00)').onChange(() => {
        clearToBackground();
      });
      fBg.addColor(params, 'backgroundColor').name('Background Color').onChange(() => {
        clearToBackground();
      });
      fBg.add(params, 'trailFade', 0.01, 0.5, 0.01).name('Trail Fade Rate');

      // Camera Controls Folder
      const fCamera = gui.addFolder('Zoom & Pan');
      fCamera.add(params, 'zoom', 0.1, 8.0, 0.05).name('Zoom').listen();
      fCamera.add(params, 'panX', -2000, 2000, 1).name('Pan X').listen();
      fCamera.add(params, 'panY', -2000, 2000, 1).name('Pan Y').listen();
      fCamera.add({ reset: resetView }, 'reset').name('Reset View');

      // Motion & Geometry Parameters
      const fMotion = gui.addFolder('Geometry & Motion');
      fMotion.add(params, 'shapeNum', 100, 2000, 50).name('Particle Count').onChange(syncShapeCount);
      fMotion.add(params, 'speed', 0.1, 4.0, 0.05).name('Fall Speed');
      fMotion.add(params, 'driftSpeed', 0.1, 4.0, 0.05).name('Drift Speed');
      fMotion.add(params, 'gravityStrength', 0.1, 3.0, 0.05).name('Horizon Pull');
      fMotion.add(params, 'particleScale', 0.2, 4.0, 0.1).name('Particle Size');
      fMotion.add(params, 'particleOpacity', 0.1, 1.0, 0.05).name('Opacity');
      fMotion.add(params, 'tailLength', 20, 250, 5).name('Lifespan');

      // Horizon Reflection Filter Folder
      const fFilter = gui.addFolder('Horizon Reflection Filter');
      fFilter.add(params, 'filterEnabled').name('Enable Filter');
      fFilter.add(params, 'filterOpacity', 0, 1, 0.05).name('Filter Opacity');
      fFilter.add(params, 'filterOnGreenscreen').name('Filter On Greenscreen');

      function updateGuiDisplays() {
        if (typeof gui.controllersRecursive === 'function') {
          gui.controllersRecursive().forEach(c => c.updateDisplay());
        } else {
          const updateFolder = (g) => {
            if (g.controllers) g.controllers.forEach(c => c.updateDisplay());
            if (g.folders) g.folders.forEach(f => updateFolder(f));
          };
          updateFolder(gui);
        }
      }

      const HEX_ACCENTS = ['#ff1744', '#ff5252', '#ff9100', '#ffd600', '#00e676', '#00e5ff', '#651fff', '#f50057', '#d500f9', '#00b0ff', '#ff3d00'];

      function randomizeScene() {
        params.colorScheme = SCHEMES[rand(0, SCHEMES.length - 1)];
        params.baseHue = rand(0, 360);
        params.useCustomColor = false;
        params.accentColor = HEX_ACCENTS[rand(0, HEX_ACCENTS.length - 1)];

        params.speed = Number((0.4 + Math.random() * 1.8).toFixed(2));
        params.driftSpeed = Number((0.2 + Math.random() * 2.0).toFixed(2));
        params.gravityStrength = Number((0.5 + Math.random() * 1.8).toFixed(2));
        params.particleScale = Number((0.5 + Math.random() * 2.0).toFixed(2));
        params.particleOpacity = Number((0.5 + Math.random() * 0.5).toFixed(2));
        params.trailFade = Number((0.05 + Math.random() * 0.18).toFixed(2));
        params.tailLength = rand(50, 160);

        params.shapeNum = rand(500, 1300);
        syncShapeCount();

        updateAllParticleColors();
        updateGuiDisplays();
      }

      /********************
        Interaction & Events
      ********************/

      // Hide / Show UI with "H" key
      let guiVisible = true;
      window.addEventListener('keydown', (e) => {
        if (e.key === 'h' || e.key === 'H') {
          if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA')) {
            return;
          }
          guiVisible = !guiVisible;
          if (guiVisible) {
            if (typeof gui.show === 'function') gui.show();
            if (gui.domElement) gui.domElement.style.display = '';
          } else {
            if (typeof gui.hide === 'function') gui.hide();
            if (gui.domElement) gui.domElement.style.display = 'none';
          }
        }
      });

      // Zoom with wheel centered at cursor
      canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
        const newZoom = Math.max(0.1, Math.min(8.0, params.zoom * zoomFactor));

        const mouseX = e.clientX;
        const mouseY = e.clientY;

        params.panX = mouseX - (mouseX - params.panX) * (newZoom / params.zoom);
        params.panY = mouseY - (mouseY - params.panY) * (newZoom / params.zoom);
        params.zoom = newZoom;

        updateGuiDisplays();
      }, { passive: false });

      // Drag scene across screen & detect click for procedural randomization
      let isPointerDown = false;
      let startPointerX = 0;
      let startPointerY = 0;
      let startPanX = 0;
      let startPanY = 0;
      let dragDistance = 0;

      canvas.addEventListener('pointerdown', (e) => {
        if (e.target && e.target.closest && e.target.closest('.lil-gui')) {
          return;
        }
        isPointerDown = true;
        startPointerX = e.clientX;
        startPointerY = e.clientY;
        startPanX = params.panX;
        startPanY = params.panY;
        dragDistance = 0;
        canvas.style.cursor = 'grabbing';
      });

      window.addEventListener('pointermove', (e) => {
        if (!isPointerDown) return;
        const dx = e.clientX - startPointerX;
        const dy = e.clientY - startPointerY;
        dragDistance = Math.hypot(dx, dy);
        params.panX = startPanX + dx;
        params.panY = startPanY + dy;
        updateGuiDisplays();
      });

      window.addEventListener('pointerup', (e) => {
        if (isPointerDown) {
          isPointerDown = false;
          canvas.style.cursor = 'grab';
          // If clicked without significant dragging and not on GUI, randomize scene
          if (dragDistance < 6 && (!e.target || !e.target.closest || !e.target.closest('.lil-gui'))) {
            if (params.clickRandomize) {
              randomizeScene();
            }
          }
        }
      });

      canvas.addEventListener('pointercancel', () => {
        isPointerDown = false;
        canvas.style.cursor = 'grab';
      });

      function onResize() {
        X = canvas.width = window.innerWidth;
        Y = canvas.height = window.innerHeight;
        clearToBackground();
      }

      window.addEventListener('resize', onResize);

    })();
  </script>
</body>
</html>
