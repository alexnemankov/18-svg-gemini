            }
        }

            },
            'Palette (E8E0FF, B38FFF, 6A3DE8, 1A1250, 090612)': {

                traceSecondary: '#b38fff',

            },
            'Palette (E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)': {
                substrateBase: '#05020f',

                traceSecondary: '#00f0ff',

            }
        };

        const ANIMATIONS = [
            'Static (No Camera Motion)',
            'AOI Optical Ring-Light Scan (Smooth 360°)',
            'Wafer Die Step-and-Repeat (Orthogonal Drift)',
            'Microscope Depth-of-Field Rack (Push/Pull Focus)',
            'Silkscreen Traverse (Horizontal Glide)',
            'Solder Bridge Diagnostic (Figure-8 Orbit)',
            'Gantry Tilt & Roll (Inspection Angulation)',
            'Vertical Via Stack Traverse (Climb Inspection)'
        ];

        const SETTINGS = {
            // General Preset & Animation
            colorScheme: 'Monochromatic',
            animation: 'AOI Optical Ring-Light Scan (Smooth 360°)',
            animationSpeed: 1.0,
            streamSpeed: 4.5,
            randomizeOnClick: true,

            // Manhattan Geometry & AOI Fault Parameters
            trackCount: 48.0,
            gridResolutionX: 42.0,
            jogFrequency: 1.2,
            traceWidth: 0.38,
            faultThreshold: 0.94,
            faultMarkerScale: 1.0,
            viaPadDensity: 0.65,
            substrateWeave: 0.22,
            ringLightIntensity: 0.45,

            // Shape & Curvature
            curveSoftness: 7.5,
            curveWidth: 0.36,
            curveDepth: 0.95,
            height: 1.32,
            wallTilt: 0.0,
            fov: 110.0,
            particleSize: 10.0,

            // Post-Processing
            dpr: Math.min(window.devicePixelRatio || 1.0, 2.0),
            bloomStrength: 0.28,
            bloomRadius: 0.85,
            chromaticAberration: 0.0035,
            edgeBlurStrength: 0.012,

            // Camera & Navigation
            zoom: 1.0,
            objectX: 0.0,
            objectY: 0.0,
            cameraY: 0.0,
            cameraSpinSpeed: 0.0,

            // Colors
            substrateBase: COLOR_SCHEMES['Monochromatic'].substrateBase,
            traceCopper: COLOR_SCHEMES['Monochromatic'].traceCopper,
            traceSecondary: COLOR_SCHEMES['Monochromatic'].traceSecondary,
            solderMask: COLOR_SCHEMES['Monochromatic'].solderMask,
            faultColor: COLOR_SCHEMES['Monochromatic'].faultColor,
            bgColor: COLOR_SCHEMES['Monochromatic'].bgColor,

            // Greenscreen
            greenScreen: false,
            greenScreenColor: '#00ff00'
        };

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(SETTINGS.bgColor, 0.002);
        scene.background = new THREE.Color(SETTINGS.bgColor);

        const camera = new THREE.PerspectiveCamera(SETTINGS.fov, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, SETTINGS.cameraY, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(SETTINGS.dpr);
        document.body.appendChild(renderer.domElement);

        document.getElementById('loading').style.display = 'none';

        // HIGH-RESOLUTION MANHATTAN ROUTED PCB / WAFER CANVAS TEXTURE
        // Grid-based random walks with strictly 90° turns, SMT pad matrices, fiducials, and AOI inspection graticules
        const canvasTexture = document.createElement('canvas');
        canvasTexture.width = 1024;
        canvasTexture.height = 1024;
        const ctx = canvasTexture.getContext('2d');

        function generateManhattanTexture() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, 1024, 1024);

            const grid = 32;
            const cols = 1024 / grid;
            const rows = 1024 / grid;

            // 1. Orthogonal Ground Planes & Silkscreen Boundary Grids
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= 1024; i += grid) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, 1024);
                ctx.moveTo(0, i);
                ctx.lineTo(1024, i);
                ctx.stroke();
            }

            // 2. Manhattan-Routed Traces (Grid-based random walks with only 90-degree turns)
            const traceCount = 90;
            ctx.lineCap = 'square';
            ctx.lineJoin = 'miter';

            for (let t = 0; t < traceCount; t++) {
                let gx = Math.floor(Math.random() * cols);
                let gy = Math.floor(Math.random() * rows);
                const steps = Math.floor(Math.random() * 8) + 4;
                const isBus = Math.random() > 0.65;
                const brightness = 0.4 + Math.random() * 0.55;

                ctx.strokeStyle = `rgba(255, 255, 255, ${brightness})`;
                ctx.lineWidth = isBus ? 3 : (Math.random() > 0.5 ? 2 : 1.5);

                ctx.beginPath();
                ctx.moveTo(gx * grid + grid / 2, gy * grid + grid / 2);

                for (let s = 0; s < steps; s++) {
                    // Manhattan step: pick strictly horizontal OR vertical axis
                    const moveHoriz = (s % 2 === 0);
                    const dist = (Math.floor(Math.random() * 4) + 1) * (Math.random() > 0.5 ? 1 : -1);

                    if (moveHoriz) {
                        gx = Math.max(1, Math.min(cols - 2, gx + dist));
                    } else {
                        gy = Math.max(1, Math.min(rows - 2, gy + dist));
                    }

                    ctx.lineTo(gx * grid + grid / 2, gy * grid + grid / 2);
                }
                ctx.stroke();

                // Draw Solder Via Pads at Terminations / Manhattan Corners
                ctx.fillStyle = `rgba(255, 255, 255, ${brightness + 0.1})`;
                ctx.beginPath();
                ctx.arc(gx * grid + grid / 2, gy * grid + grid / 2, isBus ? 4.5 : 3.2, 0, Math.PI * 2);
                ctx.fill();

                // Dark Via Drill Hole
                ctx.fillStyle = '#000000';
                ctx.beginPath();
                ctx.arc(gx * grid + grid / 2, gy * grid + grid / 2, isBus ? 1.8 : 1.2, 0, Math.PI * 2);
                ctx.fill();
            }

            // 3. IC Footprints (QFP / SMT Pad Matrices & BGA Arrays)
            const icCount = 14;
            for (let k = 0; k < icCount; k++) {
                const icX = (Math.floor(Math.random() * (cols - 8)) + 4) * grid;
                const icY = (Math.floor(Math.random() * (rows - 8)) + 4) * grid;
                const icW = (Math.floor(Math.random() * 3) + 2) * grid;
                const icH = (Math.floor(Math.random() * 3) + 2) * grid;

                // Silkscreen component outline
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
                ctx.lineWidth = 1.5;
                ctx.strokeRect(icX + 4, icY + 4, icW - 8, icH - 8);

                // Pin 1 Index Notch
                ctx.beginPath();
                ctx.arc(icX + 10, icY + 10, 2.5, 0, Math.PI * 2);
                ctx.stroke();

                // SMT Lead Pins around periphery
                ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
                for (let px = icX + 8; px < icX + icW - 8; px += 8) {
                    ctx.fillRect(px, icY - 2, 4, 6);
                    ctx.fillRect(px, icY + icH - 4, 4, 6);
                }
                for (let py = icY + 8; py < icY + icH - 8; py += 8) {
                    ctx.fillRect(icX - 2, py, 6, 4);
                    ctx.fillRect(icX + icW - 4, py, 6, 4);
                }
            }

            // 4. Optical Alignment Fiducials & AOI Inspection Graticules
            const fiducials = [
                { x: 48, y: 48 }, { x: 976, y: 48 },
                { x: 48, y: 976 }, { x: 976, y: 976 },
                { x: 512, y: 256 }, { x: 512, y: 768 }
            ];

            fiducials.forEach(f => {
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
                ctx.lineWidth = 1.5;

                // Crosshairs
                ctx.beginPath();
                ctx.moveTo(f.x - 14, f.y);
                ctx.lineTo(f.x + 14, f.y);
                ctx.moveTo(f.x, f.y - 14);
                ctx.lineTo(f.x, f.y + 14);
                ctx.stroke();

                // Target Rings
                ctx.beginPath();
                ctx.arc(f.x, f.y, 8, 0, Math.PI * 2);
                ctx.arc(f.x, f.y, 4, 0, Math.PI * 2);
                ctx.stroke();
            });

            // 5. AOI Inspection Identifiers & Engineering Stamp Marks
            ctx.font = 'bold 16px monospace';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';

            const labels = [
                'AOI-INSPECTION [PASS]', 'PCB-FAB LAYER 1', 'MANHATTAN TRACE 90°',
                'TEST POINT MATRIX', 'WAFER SCANNER 24A', 'ENIG GOLD PLATING',
                'TRACE GAP: 0.12mm', 'FAULT DETECTOR ACTIVE', 'GRID: 32 MIL', 'QC VERIFIED'
            ];

            for (let r = 0; r < 12; r++) {
                const lx = (Math.floor(Math.random() * 5) + 1) * 160;
                const ly = (Math.floor(Math.random() * 14) + 1) * 64;
                const text = labels[Math.floor(Math.random() * labels.length)];
                ctx.fillText(text, lx, ly);
            }
        }
        generateManhattanTexture();

        const dataTexture = new THREE.CanvasTexture(canvasTexture);
        dataTexture.wrapS = THREE.RepeatWrapping;
        dataTexture.wrapT = THREE.RepeatWrapping;
        dataTexture.minFilter = THREE.LinearMipmapLinearFilter;
        dataTexture.magFilter = THREE.LinearFilter;
        dataTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();

        const tunnelGroup = new THREE.Group();
        scene.add(tunnelGroup);

        // TRACE FAULT MAP SHADER MATERIAL
        const wallVertexShader = `
            varying vec2 vUv;
            varying vec3 vPosition;
            uniform float uCurveSoftness;

            void main() {
                vUv = uv;
                vec3 pos = position;

                float angle = atan(pos.z, pos.x);
                float normX = cos(angle);
                float n = max(1.0, uCurveSoftness);

                float absZ = pow(max(0.00001, 1.0 - pow(abs(normX), n)), 1.0 / n) * 100.0;
                pos.z = sign(sin(angle)) * absZ;

                vPosition = pos;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
            }
        `;

        const wallFragmentShader = `
            varying vec2 vUv;
            varying vec3 vPosition;

            uniform float uTime;
            uniform float uSpeed;
            uniform float uTrackCount;
            uniform float uGridResolutionX;
            uniform float uJogFrequency;
            uniform float uTraceWidth;
            uniform float uFaultThreshold;
            uniform float uFaultMarkerScale;
            uniform float uViaPadDensity;
            uniform float uSubstrateWeave;
            uniform float uRingLightIntensity;

            uniform vec3 uSubstrateBase;
            uniform vec3 uTraceCopper;
            uniform vec3 uTraceSecondary;
            uniform vec3 uSolderMask;
            uniform vec3 uFaultColor;
            uniform vec3 uBgColor;
            uniform sampler2D uDataTexture;

            float random(vec2 st) {
                return fract(sin(dot(st.xy, vec2(12.9898, 78.233))) * 43758.5453123);
            }

            // Manhattan Rectilinear Trace Layer
            // - Quantizes angle/position to a discrete grid
            // - Step-function jog allows strictly 90-degree axis-aligned turns
            // - Adds conditional rare saturated fault marker override
            vec3 getLineLayer(vec3 pos, float trackCount, float speedBase, float seed) {
                float trackHeight = 80.0 / max(1.0, trackCount);
                float approxTrackId = floor((pos.y + 40.0) / trackHeight);

                // Grid quantization for angle
                float angle = atan(pos.z, pos.x);
                float currentAngle = angle + uTime * uSpeed * 0.012 * speedBase;
                float gridX = uGridResolutionX;
                float cellX = floor(currentAngle * gridX);

                // Manhattan 90-degree jog: step function quantizes lateral transition
                float jogRand = random(vec2(cellX, approxTrackId + seed * 4.17));
                float jogStep = 0.0;
                if (jogRand > (1.0 - 0.35 * uJogFrequency)) {
                    jogStep = (random(vec2(cellX, seed + 9.8)) > 0.5) ? 1.0 : -1.0;
                }

                float trackId = approxTrackId + jogStep;
                float trackActive = random(vec2(trackId, seed));
                if (trackActive > 0.42) return vec3(0.0);

                float trackCenter = -40.0 + (trackId + 0.5) * trackHeight;
                float distY = abs(pos.y - trackCenter);

                float maxThickness = trackHeight * uTraceWidth;
                float thickness = maxThickness * mix(0.4, 1.0, random(vec2(trackId, seed + 1.0)));

                float aa = 0.035;
                float profile = smoothstep(thickness + aa, thickness - aa, distY);
                if (profile <= 0.0) return vec3(0.0);

                // Rectilinear step function: strictly axis-aligned segments (no smooth noise flow)
                float segRand = random(vec2(cellX, trackId * 2.3 + seed * 7.1));
                float isSegmentOn = step(0.28, segRand);

                // Manhattan 90-degree vertical connector bridge at jog transitions
                float cellFracX = fract(currentAngle * gridX);
                float vertBridge = 0.0;
                if (abs(jogStep) > 0.5) {
                    float bridgeDistX = abs(cellFracX - 0.5);
                    float bridgeProfileX = smoothstep(0.18, 0.05, bridgeDistX);
                    float bridgeDistY = abs(pos.y - (-40.0 + (approxTrackId + 0.5) * trackHeight + jogStep * trackHeight * 0.25));
                    float bridgeProfileY = smoothstep(trackHeight * 0.6, trackHeight * 0.4, bridgeDistY);
                    vertBridge = bridgeProfileX * bridgeProfileY;
                }

                float totalTraceMask = max(profile * isSegmentOn, vertBridge);
                if (totalTraceMask <= 0.0) return vec3(0.0);

                // Solder Via Pad at 90-degree corner/junction
                float viaRand = random(vec2(cellX, trackId + seed * 13.3));
                float viaGlow = 0.0;
                if (viaRand > (1.0 - uViaPadDensity * 0.4)) {
                    float viaDist = length(vec2((cellFracX - 0.5) * 1.8, (distY / thickness)));
                    float padRing = smoothstep(1.8, 1.2, viaDist) * smoothstep(0.3, 0.6, viaDist);
                    viaGlow = padRing * 0.8;
                }

                // Sample Manhattan canvas texture for microscopic silkscreen and sub-trace micro-routing
                float normAngle = (currentAngle + 3.14159265) / 6.2831853;
                vec2 textUv = vec2(normAngle * 16.0, (pos.y + 40.0) * 0.025);
                float microMask = texture2D(uDataTexture, textUv).r;
                float microBoost = mix(0.7, 1.8, microMask);

                // Core metallic trace radiance
                float core = smoothstep(thickness * 0.5, 0.0, distY);
                vec3 copperRadiance = uTraceCopper * (totalTraceMask * microBoost * 1.4 + viaGlow) + vec3(core * 0.6 * totalTraceMask);

                // Conditional Override: Sparse Saturated Fault Marker
                // If rare random check exceeds high threshold, force pure saturated fault color pop
                vec2 faultGrid = vec2(cellX, trackId);
                float faultCheck = random(faultGrid + vec2(seed * 19.1, 77.7));
                if (faultCheck > uFaultThreshold) {
                    vec2 cellUv = vec2(cellFracX - 0.5, (pos.y - trackCenter) / max(0.01, trackHeight));
                    float boxDist = max(abs(cellUv.x), abs(cellUv.y));
                    float targetBox = smoothstep(0.42 * uFaultMarkerScale, 0.36 * uFaultMarkerScale, boxDist) *
                                      smoothstep(0.28 * uFaultMarkerScale, 0.34 * uFaultMarkerScale, boxDist);

                    float crossX = smoothstep(0.06, 0.01, abs(cellUv.x)) * step(abs(cellUv.y), 0.45 * uFaultMarkerScale);
                    float crossY = smoothstep(0.06, 0.01, abs(cellUv.y)) * step(abs(cellUv.x), 0.45 * uFaultMarkerScale);
                    float faultGlyph = max(targetBox, max(crossX, crossY));

                    float blink = 0.75 + 0.25 * sin(uTime * 14.0 + faultCheck * 100.0);
                    if (faultGlyph > 0.1) {
                        return uFaultColor * faultGlyph * blink * 2.8;
                    }
                }

                return copperRadiance;
            }

            // Composite Circuit Inspection Surface
            vec3 getCompositeSurface(vec3 pos, float isReflection) {
                vec3 color = uSubstrateBase;

                float angle = atan(pos.z, pos.x);
                float baseAngle = angle + uTime * uSpeed * 0.004;
                float normAngle = (baseAngle + 3.14159265) / 6.2831853;
                vec2 bgUv = vec2(normAngle * 32.0, (pos.y + 40.0) * 0.05);

                // 1. Substrate FR-4 Fiberglass Weave / Solder Mask Grid Texture
                float weave = (sin(bgUv.x * 64.0) * sin(bgUv.y * 64.0)) * 0.5 + 0.5;
                color = mix(color, uSolderMask, weave * uSubstrateWeave);

                // 2. High-Density Manhattan PCB Texture Mask (SMT Pads, IC outlines, Graticules)
                float pcbMask = texture2D(uDataTexture, bgUv).r;
                float colId = floor(normAngle * 32.0 * 16.0);
                float rowId = floor((pos.y + 40.0) * 0.05 * 16.0);

                float visibility = step(0.35, random(vec2(colId, 44.4)));
                visibility *= step(0.2, random(vec2(colId, rowId)));

                // Logic pulse flicker across digital buses
                float busPulse = sin(uTime * 4.0 + random(vec2(colId, 12.3)) * 6.28) * 0.5 + 0.5;
                color += uTraceSecondary * pcbMask * visibility * (0.8 + 0.6 * busPulse);

                // 3. Rectilinear Manhattan Routing Line Layers (Multiple Track Frequencies)
                color += getLineLayer(pos, uTrackCount * 0.5, 0.8, 11.0);
                color += getLineLayer(pos, uTrackCount * 1.0, 1.2, 22.0);
                color += getLineLayer(pos, uTrackCount * 1.8, 1.8, 33.0);
                color += getLineLayer(pos, uTrackCount * 3.0, 2.5, 44.0);

                // 4. Optical Inspection Ring-Light Specular Flare
                vec3 normPos = normalize(pos);
                float ringFlare = pow(max(0.0, 1.0 - abs(normPos.y * 0.8)), 8.0) * uRingLightIntensity;
                color += uTraceCopper * ringFlare * 0.35;

                // Reflection attenuation and edge vignette fade
                if (isReflection == 1.0) {
                    float fade = smoothstep(-38.0, -12.0, pos.y);
                    color *= 0.45 * fade;
                } else {
                    float fade = smoothstep(40.0, 20.0, pos.y);
                    color *= fade;
                }

                return color;
            }

            void main() {
                vec3 color = uBgColor;
                float floorLevel = -12.0;

                if (vPosition.y > floorLevel) {
                    color += getCompositeSurface(vPosition, 0.0);
                } else {
                    vec3 reflectedPos = vPosition;
                    reflectedPos.y = floorLevel + (floorLevel - vPosition.y);
                    color += getCompositeSurface(reflectedPos, 1.0);
                    color += vec3(0.002, 0.008, 0.004);
                }

                // Inspection Chamber Horizon Line Glow
                float horizonGlow = smoothstep(0.6, 0.0, abs(vPosition.y - floorLevel));
                color += uTraceCopper * horizonGlow * 0.35;

                gl_FragColor = vec4(color, 1.0);
            }
        `;

        const uniforms = {
            uTime: { value: 0.0 },
            uSpeed: { value: SETTINGS.streamSpeed * SETTINGS.animationSpeed },
            uTrackCount: { value: SETTINGS.trackCount },
            uGridResolutionX: { value: SETTINGS.gridResolutionX },
            uJogFrequency: { value: SETTINGS.jogFrequency },
            uTraceWidth: { value: SETTINGS.traceWidth },
            uFaultThreshold: { value: SETTINGS.faultThreshold },
            uFaultMarkerScale: { value: SETTINGS.faultMarkerScale },
            uViaPadDensity: { value: SETTINGS.viaPadDensity },
            uSubstrateWeave: { value: SETTINGS.substrateWeave },
            uRingLightIntensity: { value: SETTINGS.ringLightIntensity },
            uCurveSoftness: { value: SETTINGS.curveSoftness },
            uSubstrateBase: { value: new THREE.Color(SETTINGS.substrateBase) },
            uTraceCopper: { value: new THREE.Color(SETTINGS.traceCopper) },
            uTraceSecondary: { value: new THREE.Color(SETTINGS.traceSecondary) },
            uSolderMask: { value: new THREE.Color(SETTINGS.solderMask) },
            uFaultColor: { value: new THREE.Color(SETTINGS.faultColor) },
            uBgColor: { value: new THREE.Color(SETTINGS.bgColor) },
            uDataTexture: { value: dataTexture }
        };

        const material = new THREE.ShaderMaterial({
            vertexShader: wallVertexShader,
            fragmentShader: wallFragmentShader,
            uniforms,
            side: THREE.BackSide,
            transparent: false
        });

        const geometry = new THREE.CylinderGeometry(100, 100, 80, 128, 1, true);
        const wall = new THREE.Mesh(geometry, material);
        tunnelGroup.add(wall);

        // MANHATTAN RECTILINEAR PARTICLES (Snapping Laser Packets / Inspection Optical Beams)
        const particleCount = 1800;
        const particleGeometry = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        const particleSpeeds = new Float32Array(particleCount);
        const particleSeeds = new Float32Array(particleCount);

        for (let i = 0; i < particleCount; i++) {
            const angle = Math.random() * Math.PI * 2;
            const radius = 98.6 + Math.random() * 1.0;
            const y = -11.0 + Math.random() * 48.0;

            particlePositions[i * 3] = Math.cos(angle) * radius;
            particlePositions[i * 3 + 1] = y;
            particlePositions[i * 3 + 2] = Math.sin(angle) * radius;
            particleSpeeds[i] = 0.6 + Math.random() * 2.2;
            particleSeeds[i] = Math.random() * 100.0;
        }

        particleGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        particleGeometry.setAttribute('aSpeed', new THREE.BufferAttribute(particleSpeeds, 1));
        particleGeometry.setAttribute('aSeed', new THREE.BufferAttribute(particleSeeds, 1));

        const particleUniforms = {
            uTime: { value: 0 },
            uSpeed: { value: SETTINGS.streamSpeed * SETTINGS.animationSpeed },
            uCurveSoftness: { value: SETTINGS.curveSoftness },
            uParticleSize: { value: SETTINGS.particleSize },
            uParticleColor: { value: new THREE.Color(SETTINGS.traceCopper) }
        };

        const particleMaterial = new THREE.ShaderMaterial({
            uniforms: particleUniforms,
            vertexShader: `
                uniform float uTime;
                uniform float uSpeed;
                uniform float uCurveSoftness;
                uniform float uParticleSize;
                attribute float aSpeed;
                attribute float aSeed;
                varying float vAlpha;

                void main() {
                    vec3 pos = position;

                    float angle = atan(pos.z, pos.x);
                    float radius = length(pos.xz);
                    float currentAngle = angle - uTime * uSpeed * 0.012 * aSpeed;

                    // Quantize particle motion to Manhattan right angles
                    float gridAngle = floor(currentAngle * 36.0) / 36.0;
                    float quantAngle = mix(currentAngle, gridAngle, 0.65);

                    float normX = cos(quantAngle);
                    float n = max(1.0, uCurveSoftness);
                    float absZ = pow(max(0.00001, 1.0 - pow(abs(normX), n)), 1.0 / n) * radius;

                    pos.x = cos(quantAngle) * radius;
                    pos.z = sign(sin(quantAngle)) * absZ;

                    vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                    gl_PointSize = (10.0 * uParticleSize / -mvPosition.z);
                    gl_Position = projectionMatrix * mvPosition;

                    vAlpha = smoothstep(38.0, 25.0, pos.y) * smoothstep(-12.0, -6.0, pos.y);
                }
            `,
            fragmentShader: `
                varying float vAlpha;
                uniform vec3 uParticleColor;

                void main() {
                    vec2 xy = gl_PointCoord.xy - vec2(0.5);
                    // Diamond/Square inspection optical packet silhouette
                    float squareDist = max(abs(xy.x), abs(xy.y));
                    if (squareDist > 0.5) discard;

                    float glow = 1.0 - (squareDist * 2.0);
                    gl_FragColor = vec4(uParticleColor, vAlpha * glow * 1.5);
                }
            `,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const particles = new THREE.Points(particleGeometry, particleMaterial);
        tunnelGroup.add(particles);

        tunnelGroup.scale.set(SETTINGS.curveWidth, SETTINGS.height, SETTINGS.curveDepth);
        tunnelGroup.rotation.z = SETTINGS.wallTilt * Math.PI / 180;
        tunnelGroup.position.set(SETTINGS.objectX, SETTINGS.objectY, 0);

        // POST-PROCESSING PIPELINE
        const composer = new EffectComposer(renderer);
        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);

        const PeripheralBlurShader = {
            uniforms: {
                tDiffuse: { value: null },
                uStrength: { value: SETTINGS.edgeBlurStrength },
                uAspect: { value: window.innerWidth / window.innerHeight }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D tDiffuse;
                uniform float uStrength;
                uniform float uAspect;
                varying vec2 vUv;

                void main() {
                    vec2 center = vec2(0.5, 0.5);
                    vec2 uvCorrection = vec2(uAspect, 1.0);
                    float dist = length((vUv - center) * uvCorrection);

                    float blurMask = smoothstep(0.15, 0.7, dist);

                    if (blurMask <= 0.0) {
                        gl_FragColor = texture2D(tDiffuse, vUv);
                        return;
                    }

                    const int SAMPLES = 32;
                    const float GOLDEN_ANGLE = 2.39996323;
                    vec4 color = vec4(0.0);
                    float radius = uStrength * blurMask;

                    for (int i = 0; i < SAMPLES; i++) {
                        float r = sqrt(float(i) + 0.5) / sqrt(float(SAMPLES));
                        float theta = float(i) * GOLDEN_ANGLE;
                        vec2 offset = vec2(cos(theta), sin(theta)) * r * radius;
                        offset.x /= uAspect;
                        color += texture2D(tDiffuse, vUv + offset);
                    }
                    gl_FragColor = color / float(SAMPLES);
                }
            `
        };
        const peripheralBlurPass = new ShaderPass(PeripheralBlurShader);
        composer.addPass(peripheralBlurPass);

        const ChromaticAberrationShader = {
            uniforms: {
                tDiffuse: { value: null },
                uAmount: { value: SETTINGS.chromaticAberration }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D tDiffuse;
                uniform float uAmount;
                varying vec2 vUv;

                void main() {
                    vec2 offset = uAmount * (vec2(0.5) - vUv);
                    vec4 cr = texture2D(tDiffuse, vUv + offset);
                    vec4 cga = texture2D(tDiffuse, vUv);
                    vec4 cb = texture2D(tDiffuse, vUv - offset);
                    gl_FragColor = vec4(cr.r, cga.g, cb.b, cga.a);
                }
            `
        };
        const caPass = new ShaderPass(ChromaticAberrationShader);
        composer.addPass(caPass);

        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            SETTINGS.bloomStrength,
            SETTINGS.bloomRadius,
            0.15
        );
        composer.addPass(bloomPass);

        // TRANSFORMS & BACKGROUND UPDATES
        const updateBackground = () => {
            const activeBg = SETTINGS.greenScreen ? SETTINGS.greenScreenColor : SETTINGS.bgColor;
            uniforms.uBgColor.value.set(activeBg);
            scene.background.set(activeBg);
            scene.fog.color.set(activeBg);
            document.body.style.backgroundColor = activeBg;
        };

        const updateColors = () => {
            uniforms.uSubstrateBase.value.set(SETTINGS.substrateBase);
            uniforms.uTraceCopper.value.set(SETTINGS.traceCopper);
            uniforms.uTraceSecondary.value.set(SETTINGS.traceSecondary);
            uniforms.uSolderMask.value.set(SETTINGS.solderMask);
            uniforms.uFaultColor.value.set(SETTINGS.faultColor);
            particleUniforms.uParticleColor.value.set(SETTINGS.traceCopper);
            updateBackground();
        };

        const applyColorScheme = (name) => {
            const scheme = COLOR_SCHEMES[name];
            if (!scheme) return;
            SETTINGS.colorScheme = name;
            SETTINGS.substrateBase = scheme.substrateBase;
            SETTINGS.traceCopper = scheme.traceCopper;
            SETTINGS.traceSecondary = scheme.traceSecondary;
            SETTINGS.solderMask = scheme.solderMask;
            SETTINGS.faultColor = scheme.faultColor;
            SETTINGS.bgColor = scheme.bgColor;
            updateColors();
            gui.controllersRecursive().forEach(c => c.updateDisplay());
        };

        const updateObjectTransform = () => {
            tunnelGroup.position.x = SETTINGS.objectX;
            tunnelGroup.position.y = SETTINGS.objectY;
            tunnelGroup.scale.set(
                SETTINGS.curveWidth * SETTINGS.zoom,
                SETTINGS.height * SETTINGS.zoom,
                SETTINGS.curveDepth * SETTINGS.zoom
            );
            tunnelGroup.rotation.z = SETTINGS.wallTilt * Math.PI / 180;
        };

        // PROCEDURAL RANDOMIZATION ON USER CLICK
        const randomizeScene = () => {
            // Pick a random scheme
            const schemeKeys = Object.keys(COLOR_SCHEMES);
            const randomSchemeName = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
            applyColorScheme(randomSchemeName);

            // Re-roll geometric & motion parameters
            SETTINGS.trackCount = Math.floor(THREE.MathUtils.randFloat(24, 72));
            SETTINGS.gridResolutionX = Math.floor(THREE.MathUtils.randFloat(28, 64));
            SETTINGS.jogFrequency = THREE.MathUtils.randFloat(0.5, 2.2);
            SETTINGS.traceWidth = THREE.MathUtils.randFloat(0.22, 0.55);
            SETTINGS.faultThreshold = THREE.MathUtils.randFloat(0.91, 0.97);
            SETTINGS.viaPadDensity = THREE.MathUtils.randFloat(0.3, 0.95);
            SETTINGS.substrateWeave = THREE.MathUtils.randFloat(0.1, 0.45);
            SETTINGS.ringLightIntensity = THREE.MathUtils.randFloat(0.2, 0.75);

            SETTINGS.curveSoftness = THREE.MathUtils.randFloat(3.0, 9.5);
            SETTINGS.curveWidth = THREE.MathUtils.randFloat(0.25, 0.55);
            SETTINGS.curveDepth = THREE.MathUtils.randFloat(0.65, 1.35);
            SETTINGS.wallTilt = THREE.MathUtils.randFloat(-15, 15);
            SETTINGS.streamSpeed = THREE.MathUtils.randFloat(2.5, 7.0);
            SETTINGS.bloomStrength = THREE.MathUtils.randFloat(0.12, 0.45);
            SETTINGS.chromaticAberration = THREE.MathUtils.randFloat(0.001, 0.006);

            // Pick a random animation preset
            SETTINGS.animation = ANIMATIONS[Math.floor(Math.random() * ANIMATIONS.length)];

            // Push updates to uniforms
            uniforms.uTrackCount.value = SETTINGS.trackCount;
            uniforms.uGridResolutionX.value = SETTINGS.gridResolutionX;
            uniforms.uJogFrequency.value = SETTINGS.jogFrequency;
            uniforms.uTraceWidth.value = SETTINGS.traceWidth;
            uniforms.uFaultThreshold.value = SETTINGS.faultThreshold;
            uniforms.uViaPadDensity.value = SETTINGS.viaPadDensity;
            uniforms.uSubstrateWeave.value = SETTINGS.substrateWeave;
            uniforms.uRingLightIntensity.value = SETTINGS.ringLightIntensity;
            uniforms.uCurveSoftness.value = SETTINGS.curveSoftness;
            uniforms.uSpeed.value = SETTINGS.streamSpeed * SETTINGS.animationSpeed;

            particleUniforms.uCurveSoftness.value = SETTINGS.curveSoftness;
            particleUniforms.uSpeed.value = SETTINGS.streamSpeed * SETTINGS.animationSpeed;

            bloomPass.strength = SETTINGS.bloomStrength;
            caPass.uniforms.uAmount.value = SETTINGS.chromaticAberration;

            // Regenerate procedural Manhattan PCB canvas texture
            generateManhattanTexture();
            dataTexture.needsUpdate = true;

            updateObjectTransform();
            gui.controllersRecursive().forEach(c => c.updateDisplay());
        };

        // LIL-GUI INITIALIZATION
        const gui = new GUI({ title: 'Trace Fault Map [AOI]' });

        const fPresets = gui.addFolder('Presets & Animation');
        fPresets.add(SETTINGS, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Color Scheme').onChange(applyColorScheme);
        fPresets.add(SETTINGS, 'animation', ANIMATIONS).name('Inspection Motion');
        fPresets.add(SETTINGS, 'animationSpeed', 0.1, 3.0).name('Anim Speed').onChange(v => {
            uniforms.uSpeed.value = SETTINGS.streamSpeed * v;
            particleUniforms.uSpeed.value = SETTINGS.streamSpeed * v;
        });
        fPresets.add(SETTINGS, 'streamSpeed', 0.0, 10.0).name('Scan Speed').onChange(v => {
            uniforms.uSpeed.value = v * SETTINGS.animationSpeed;
            particleUniforms.uSpeed.value = v * SETTINGS.animationSpeed;
        });
        fPresets.add(SETTINGS, 'randomizeOnClick').name('Randomize On Click');
        fPresets.add({ randomize: randomizeScene }, 'randomize').name('🎲 Randomize Scene');

        const fManhattan = gui.addFolder('Manhattan Routing & Faults');
        fManhattan.add(SETTINGS, 'trackCount', 12, 100, 1).name('Track Count').onChange(v => uniforms.uTrackCount.value = v);
        fManhattan.add(SETTINGS, 'gridResolutionX', 16, 96, 1).name('Manhattan Grid X').onChange(v => uniforms.uGridResolutionX.value = v);
        fManhattan.add(SETTINGS, 'jogFrequency', 0.0, 3.0).name('90° Jog Frequency').onChange(v => uniforms.uJogFrequency.value = v);
        fManhattan.add(SETTINGS, 'traceWidth', 0.1, 0.9).name('Trace Width').onChange(v => uniforms.uTraceWidth.value = v);
        fManhattan.add(SETTINGS, 'faultThreshold', 0.85, 0.99, 0.005).name('Fault Detect Rate').onChange(v => uniforms.uFaultThreshold.value = v);
        fManhattan.add(SETTINGS, 'faultMarkerScale', 0.5, 2.5).name('Fault Marker Size').onChange(v => uniforms.uFaultMarkerScale.value = v);
        fManhattan.add(SETTINGS, 'viaPadDensity', 0.0, 1.0).name('Via Pad Density').onChange(v => uniforms.uViaPadDensity.value = v);
        fManhattan.add(SETTINGS, 'ringLightIntensity', 0.0, 1.5).name('AOI Ring-Light').onChange(v => uniforms.uRingLightIntensity.value = v);
        fManhattan.add(SETTINGS, 'substrateWeave', 0.0, 1.0).name('FR-4 Weave Tint').onChange(v => uniforms.uSubstrateWeave.value = v);

        const fGeometry = gui.addFolder('Geometry & Shape');
        fGeometry.add(SETTINGS, 'curveSoftness', 1.0, 10.0).name('Curve Softness').onChange(v => {
            uniforms.uCurveSoftness.value = v;
            particleUniforms.uCurveSoftness.value = v;
        });
        fGeometry.add(SETTINGS, 'curveWidth', 0.1, 3.0).name('Wafer Width').onChange(updateObjectTransform);
        fGeometry.add(SETTINGS, 'curveDepth', 0.1, 3.0).name('Wafer Depth').onChange(updateObjectTransform);
        fGeometry.add(SETTINGS, 'height', 0.2, 3.0).name('Wall Height').onChange(updateObjectTransform);
        fGeometry.add(SETTINGS, 'wallTilt', -180, 180).name('Gantry Tilt (deg)').onChange(updateObjectTransform);
        fGeometry.add(SETTINGS, 'zoom', 0.15, 5.0).name('Zoom').onChange(updateObjectTransform);
        fGeometry.add(SETTINGS, 'objectX', -100.0, 100.0).name('Object X').onChange(updateObjectTransform);
        fGeometry.add(SETTINGS, 'objectY', -60.0, 60.0).name('Object Y').onChange(updateObjectTransform);
        fGeometry.add(SETTINGS, 'fov', 30, 140).name('Camera FOV').onChange(v => {
            camera.fov = v;
            camera.updateProjectionMatrix();
        });
        fGeometry.add(SETTINGS, 'particleSize', 1.0, 25.0).name('Packet Size').onChange(v => {
            particleUniforms.uParticleSize.value = v;
        });

        const fColors = gui.addFolder('Colors & Inspection Palette');
        fColors.addColor(SETTINGS, 'traceCopper').name('Trace Conductor').onChange(updateColors);
        fColors.addColor(SETTINGS, 'traceSecondary').name('Sub-Trace / Vias').onChange(updateColors);
        fColors.addColor(SETTINGS, 'solderMask').name('Solder Mask / Silkscreen').onChange(updateColors);
        fColors.addColor(SETTINGS, 'substrateBase').name('Substrate Core').onChange(updateColors);
        fColors.addColor(SETTINGS, 'faultColor').name('Fault Marker [POP]').onChange(updateColors);
        fColors.addColor(SETTINGS, 'bgColor').name('Chamber BG').onChange(updateColors);
        fColors.add(SETTINGS, 'greenScreen').name('Green Screen').onChange(updateBackground);
        fColors.addColor(SETTINGS, 'greenScreenColor').name('Green Color').onChange(updateBackground);

        const fEffects = gui.addFolder('Post-Processing & Quality');
        fEffects.add(SETTINGS, 'dpr', 0.25, 3.0, 0.05).name('Pixel Ratio (DPR)').onChange(v => {
            renderer.setPixelRatio(v);
            composer.setPixelRatio(v);
        });
        fEffects.add(SETTINGS, 'bloomStrength', 0.0, 2.5).name('Optics Bloom').onChange(v => bloomPass.strength = v);
        fEffects.add(SETTINGS, 'bloomRadius', 0.0, 2.0).name('Bloom Radius').onChange(v => bloomPass.radius = v);
        fEffects.add(SETTINGS, 'chromaticAberration', 0.0, 0.02).name('Lens Dispersion').onChange(v => caPass.uniforms.uAmount.value = v);
        fEffects.add(SETTINGS, 'edgeBlurStrength', 0.0, 0.04).name('Edge Vignette Blur').onChange(v => peripheralBlurPass.uniforms.uStrength.value = v);

        // KEYBOARD SHORTCUT: Toggle GUI with 'H'
        window.addEventListener('keydown', (e) => {
            if (e.key === 'h' || e.key === 'H') {
                gui._hidden ? gui.show() : gui.hide();
            }
        });

        // INTERACTIVE POINTER & ZOOM DRAG CONTROLS
        const dragState = {
            active: false,
            pointerId: null,
            startX: 0,
            startY: 0,
            objectX: 0,
            objectY: 0,
            totalTravel: 0
        };

        renderer.domElement.addEventListener('wheel', (event) => {
            event.preventDefault();
            const zoomFactor = event.deltaY > 0 ? 0.92 : 1.08;
            SETTINGS.zoom = THREE.MathUtils.clamp(SETTINGS.zoom * zoomFactor, 0.15, 5.0);
            updateObjectTransform();
            gui.controllersRecursive().find(controller => controller.property === 'zoom')?.updateDisplay();
        }, { passive: false });

        renderer.domElement.addEventListener('pointerdown', (event) => {
            if (event.button !== 0) return;
            dragState.active = true;
            dragState.pointerId = event.pointerId;
            dragState.startX = event.clientX;
            dragState.startY = event.clientY;
            dragState.objectX = SETTINGS.objectX;
            dragState.objectY = SETTINGS.objectY;
            dragState.totalTravel = 0;
            renderer.domElement.setPointerCapture(event.pointerId);
        });

        renderer.domElement.addEventListener('pointermove', (event) => {
            if (!dragState.active || event.pointerId !== dragState.pointerId) return;
            const dx = event.clientX - dragState.startX;
            const dy = event.clientY - dragState.startY;
            dragState.totalTravel += Math.hypot(dx, dy);

            const worldUnitsPerPixel = 0.12 / SETTINGS.zoom;
            SETTINGS.objectX = dragState.objectX + dx * worldUnitsPerPixel;
            SETTINGS.objectY = dragState.objectY - dy * worldUnitsPerPixel;
            updateObjectTransform();
        });

        const endDrag = (event) => {
            if (!dragState.active || event.pointerId !== dragState.pointerId) return;
            const wasClick = dragState.totalTravel < 6;
            dragState.active = false;
            dragState.pointerId = null;
            renderer.domElement.releasePointerCapture(event.pointerId);

            gui.controllersRecursive().forEach(controller => {
                if (controller.property === 'objectX' || controller.property === 'objectY') {
                    controller.updateDisplay();
                }
            });

            // Click-to-randomize if user performed a single click without dragging
            if (wasClick && SETTINGS.randomizeOnClick) {
                randomizeScene();
            }
        };

        renderer.domElement.addEventListener('pointerup', endDrag);
        renderer.domElement.addEventListener('pointercancel', endDrag);

        // ANIMATION LOOP
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const t = clock.getElapsedTime();
            const animSpeed = SETTINGS.animationSpeed;

            uniforms.uTime.value = t;
            particleUniforms.uTime.value = t;

            // Apply 8 preconfigured smooth inspection animations
            switch (SETTINGS.animation) {
                case 'Static (No Camera Motion)':
                    camera.position.set(0, SETTINGS.cameraY, 0);
                    camera.rotation.set(0, 0, 0);
                    break;

                case 'AOI Optical Ring-Light Scan (Smooth 360°)':
                    camera.position.set(0, SETTINGS.cameraY, 0);
                    camera.rotation.y = t * 0.14 * animSpeed;
                    camera.rotation.z = 0;
                    break;

                case 'Wafer Die Step-and-Repeat (Orthogonal Drift)':
                    camera.position.x = Math.sin(t * 0.35 * animSpeed) * 8.5;
                    camera.position.y = SETTINGS.cameraY + Math.cos(t * 0.22 * animSpeed) * 2.0;
                    camera.position.z = 0;
                    camera.rotation.y = Math.sin(t * 0.25 * animSpeed) * 0.08;
                    camera.rotation.z = 0;
                    break;

                case 'Microscope Depth-of-Field Rack (Push/Pull Focus)':
                    camera.position.x = 0;
                    camera.position.y = SETTINGS.cameraY;
                    camera.position.z = Math.sin(t * 0.4 * animSpeed) * 12.0;
                    camera.rotation.set(0, 0, 0);
                    break;

                case 'Silkscreen Traverse (Horizontal Glide)':
                    camera.position.x = Math.sin(t * 0.3 * animSpeed) * 11.0;
                    camera.position.y = SETTINGS.cameraY;
                    camera.position.z = Math.cos(t * 0.2 * animSpeed) * 3.0;
                    camera.rotation.y = Math.sin(t * 0.3 * animSpeed) * 0.05;
                    camera.rotation.z = 0;
                    break;

                case 'Solder Bridge Diagnostic (Figure-8 Orbit)':
                    camera.position.x = Math.sin(t * 0.38 * animSpeed) * 9.0;
                    camera.position.y = SETTINGS.cameraY + Math.sin(t * 0.76 * animSpeed) * 3.5;
                    camera.position.z = Math.cos(t * 0.38 * animSpeed) * 4.5;
                    camera.rotation.y = Math.sin(t * 0.38 * animSpeed) * 0.09;
                    camera.rotation.z = Math.cos(t * 0.38 * animSpeed) * 0.03;
                    break;

                case 'Gantry Tilt & Roll (Inspection Angulation)':
                    camera.position.x = Math.sin(t * 0.25 * animSpeed) * 6.0;
                    camera.position.y = SETTINGS.cameraY + Math.sin(t * 0.45 * animSpeed) * 2.2;
                    camera.position.z = 0;
                    camera.rotation.x = Math.sin(t * 0.3 * animSpeed) * 0.04;
                    camera.rotation.z = Math.cos(t * 0.25 * animSpeed) * 0.06;
                    break;

                case 'Vertical Via Stack Traverse (Climb Inspection)':
                    camera.position.x = 0;
                    camera.position.y = SETTINGS.cameraY + Math.sin(t * 0.35 * animSpeed) * 10.5;
                    camera.position.z = 0;
                    camera.rotation.set(0, 0, 0);
                    break;
            }

            composer.render();
        }

        updateColors();
        updateObjectTransform();
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
            peripheralBlurPass.uniforms.uAspect.value = window.innerWidth / window.innerHeight;
        });
    </script>
</body>
</html>
