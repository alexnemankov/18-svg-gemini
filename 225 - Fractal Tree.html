<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procedural Fractal Tree</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffaaaa;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
      cursor: grab;
    }
    canvas:active {
      cursor: grabbing;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.183.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.183.0/examples/jsm/",
        "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
      }
    }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import * as BGU from "three/addons/utils/BufferGeometryUtils.js";
    import GUI from "lil-gui";

    // --- Robust Mulberry32 Pseudo-Random Generator (always in [0, 1)) ---
    function createRng(seed) {
      let a = (Math.floor(Math.abs(seed)) || 123456) >>> 0;
      return function () {
        a = (a + 0x6D2B79F5) >>> 0;
        let t = a;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    // --- 5 Curated Color Presets ---
    const COLOR_PRESETS = {
      "Coral Sunset": {
        colorStart: "#ff4400",
        colorEnd: "#4488ff",
        bgColor: "#ffaaaa",
        groundColor: "#ffeebb",
        lightColor: "#ffffff",
        lightIntensity: 1.5 * Math.PI,
        ambientColor: "#ffffff",
        ambientIntensity: 0.5 * Math.PI
      },
      "Cyber Synthwave": {
        colorStart: "#ff007f",
        colorEnd: "#00f0ff",
        bgColor: "#0a0416",
        groundColor: "#230f40",
        lightColor: "#00ffff",
        lightIntensity: 1.6 * Math.PI,
        ambientColor: "#bd00ff",
        ambientIntensity: 0.6 * Math.PI
      },
      "Emerald Grove": {
        colorStart: "#059669",
        colorEnd: "#f59e0b",
        bgColor: "#022c22",
        groundColor: "#064e3b",
        lightColor: "#ecfdf5",
        lightIntensity: 1.4 * Math.PI,
        ambientColor: "#34d399",
        ambientIntensity: 0.5 * Math.PI
      },
      "Electric Amethyst": {
        colorStart: "#7c3aed",
        colorEnd: "#f43f5e",
        bgColor: "#110826",
        groundColor: "#2e1065",
        lightColor: "#fae8ff",
        lightIntensity: 1.5 * Math.PI,
        ambientColor: "#c084fc",
        ambientIntensity: 0.55 * Math.PI
      },
      "Solar Aurora": {
        colorStart: "#e11d48",
        colorEnd: "#22c55e",
        bgColor: "#04151f",
        groundColor: "#0c2d48",
        lightColor: "#fef08a",
        lightIntensity: 1.6 * Math.PI,
        ambientColor: "#38bdf8",
        ambientIntensity: 0.5 * Math.PI
      }
    };

    // --- 5 Smooth Slow Animation Presets ---
    const ANIMATION_PRESETS = [
      "Static (No Movement)",
      "Gentle Orbit",
      "Slow Elevating Spiral",
      "Canopy Drift",
      "Cinematic Sweep"
    ];

    // --- Application State / Parameters ---
    const params = {
      // Presets & Modes
      preset: "Coral Sunset",
      animationPreset: "Gentle Orbit",
      greenscreen: false,
      clickToRandomize: true,

      // Colors & Lighting
      colorStart: COLOR_PRESETS["Coral Sunset"].colorStart,
      colorEnd: COLOR_PRESETS["Coral Sunset"].colorEnd,
      bgColor: COLOR_PRESETS["Coral Sunset"].bgColor,
      groundColor: COLOR_PRESETS["Coral Sunset"].groundColor,
      lightColor: COLOR_PRESETS["Coral Sunset"].lightColor,
      lightIntensity: COLOR_PRESETS["Coral Sunset"].lightIntensity,
      ambientColor: COLOR_PRESETS["Coral Sunset"].ambientColor,
      ambientIntensity: COLOR_PRESETS["Coral Sunset"].ambientIntensity,

      // Fractal Geometry
      maxLayers: 8,
      branchAngle: 22.5,
      branchAngleSpread: 22.5,
      scaleDecay: 0.74,
      scaleRandomness: 0.05,
      maxSplit: 4,
      minSplit: 2,
      cylinderRadius: 0.025,
      cylinderSegments: 5,
      treeSeed: Math.floor(Math.random() * 1000000),
      wireframe: false,

      // Animation & Motion
      speed: 1.0,
      treeSway: true,
      swayIntensity: 1.0,

      // System & Camera
      dpr: Math.min(window.devicePixelRatio || 1, 2),

      // Action triggers
      randomize: () => randomizeScene(),
      rebuildTree: () => {
        params.treeSeed = Math.floor(Math.random() * 1000000);
        rebuildTreeMesh();
      },
      resetCamera: () => resetCameraView()
    };

    // --- Tree Structure Class ---
    class TreeStructure extends THREE.Mesh {
      constructor(options = {}) {
        super();
        this.maxLayers = options.maxLayers ?? 8;
        this.branchAngle = options.branchAngle ?? 22.5;
        this.branchAngleSpread = options.branchAngleSpread ?? 22.5;
        this.scaleDecay = options.scaleDecay ?? 0.74;
        this.scaleRandomness = options.scaleRandomness ?? 0.05;
        this.maxSplit = options.maxSplit ?? 4;
        this.minSplit = options.minSplit ?? 2;
        this.cylinderRadius = options.cylinderRadius ?? 0.025;
        this.cylinderSegments = options.cylinderSegments ?? 5;
        this.seed = options.seed ?? Math.floor(Math.random() * 1000000);

        this.colors = {
          colorStart: new THREE.Color(options.colorStart || "#ff4400"),
          colorEnd: new THREE.Color(options.colorEnd || "#4488ff"),
          colorMid: new THREE.Color()
        };

        this.mediators = {
          v: new THREE.Vector3(),
          n: new THREE.Vector3(1, 0, 0)
        };

        this.material = new THREE.MeshLambertMaterial({
          vertexColors: true,
          wireframe: false
        });

        this.castShadow = true;
        this.receiveShadow = true;

        this.rebuild();
      }

      buildStruct(pos, dir, scale, layer, rng) {
        if (layer >= this.maxLayers) return;

        const mat4 = new THREE.Matrix4().lookAt(
          new THREE.Vector3(),
          dir,
          new THREE.Vector3(0, 1, 0)
        );

        const rot = Math.PI * 2 * rng();
        const split = Math.floor(rng() * (this.maxSplit - this.minSplit + 1)) + this.minSplit;

        for (let i = 0; i < split; i++) {
          const a = 2.399963 * i + rot;
          const angleDeg = this.branchAngle + rng() * this.branchAngleSpread;
          const subDir = new THREE.Vector3()
            .setFromSphericalCoords(1, THREE.MathUtils.degToRad(angleDeg), a)
            .applyAxisAngle(this.mediators.n, -Math.PI * 0.5);

          const nextScale = scale * (this.scaleDecay - rng() * this.scaleRandomness);

          this.buildStruct(
            pos.clone().addScaledVector(dir, scale),
            subDir.clone().applyMatrix4(mat4),
            nextScale,
            layer + 1,
            rng
          );
        }

        const g = new THREE.CylinderGeometry(
          this.cylinderRadius,
          this.cylinderRadius,
          1,
          this.cylinderSegments
        )
          .translate(0, 0.5, 0)
          .scale(scale, scale, scale)
          .rotateX(Math.PI * 0.5);

        g.lookAt(dir);
        g.translate(pos.x, pos.y, pos.z);

        const colors = this.colors;
        const progress = this.maxLayers > 1 ? layer / (this.maxLayers - 1) : 0;
        colors.colorMid.lerpColors(colors.colorStart, colors.colorEnd, progress);

        const count = g.attributes.position.count;
        const colorArray = new Float32Array(count * 3);
        const r = colors.colorMid.r;
        const gc = colors.colorMid.g;
        const b = colors.colorMid.b;

        for (let i = 0; i < count; i++) {
          colorArray[i * 3] = r;
          colorArray[i * 3 + 1] = gc;
          colorArray[i * 3 + 2] = b;
        }
        g.setAttribute("color", new THREE.BufferAttribute(colorArray, 3));
        this.gs.push(g);
      }

      rebuild() {
        if (this.geometry) {
          this.geometry.dispose();
        }
        this.gs = [];
        const rng = createRng(this.seed);
        this.buildStruct(
          new THREE.Vector3(0, 0, 0),
          new THREE.Vector3(0, 1, 0),
          1,
          0,
          rng
        );

        if (this.gs.length > 0) {
          this.geometry = BGU.mergeGeometries(this.gs, false);
          for (let i = 0; i < this.gs.length; i++) {
            this.gs[i].dispose();
          }
          this.gs = [];
        }
      }

      updateColorsOnly() {
        this.rebuild();
      }
    }

    // --- Scene, Camera, Renderer Setup ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(params.bgColor);

    const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );
    const targetCenter = new THREE.Vector3(0, 1.6, 0);
    const defaultCamPos = new THREE.Vector3(0, 3.8, 6.8);
    camera.position.copy(defaultCamPos);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(params.dpr);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.enableZoom = true;
    controls.zoomSpeed = 1.0;
    controls.enablePan = true;
    controls.panSpeed = 1.0;
    controls.screenSpacePanning = true;
    controls.target.copy(targetCenter);
    controls.update();

    // --- Lighting ---
    const light = new THREE.DirectionalLight(params.lightColor, params.lightIntensity);
    light.position.set(10, 12, 10);
    light.castShadow = true;
    light.shadow.mapSize.setScalar(2048);
    light.shadow.camera.near = 0.5;
    light.shadow.camera.far = 35;
    light.shadow.camera.left = -8;
    light.shadow.camera.right = 8;
    light.shadow.camera.top = 8;
    light.shadow.camera.bottom = -8;
    light.shadow.bias = -0.0005;

    const ambientLight = new THREE.AmbientLight(params.ambientColor, params.ambientIntensity);
    scene.add(light, ambientLight);

    // --- Ground Mesh with Gradient Shader Fade ---
    const groundUniforms = {
      colorFade: { value: new THREE.Color(params.bgColor) }
    };

    const groundMaterial = new THREE.MeshLambertMaterial({
      color: params.groundColor,
      onBeforeCompile: (shader) => {
        shader.uniforms.colorFade = groundUniforms.colorFade;
        shader.fragmentShader = `
          uniform vec3 colorFade;
          ${shader.fragmentShader}
        `.replace(
          `#include <tonemapping_fragment>`,
          `
          gl_FragColor.rgb = mix(gl_FragColor.rgb, colorFade, smoothstep(0.05, 0.5, length(vUv - 0.5)));
          #include <tonemapping_fragment>
          `
        );
      }
    });
    groundMaterial.defines = { "USE_UV": "" };

    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(12, 72).rotateX(Math.PI * -0.5),
      groundMaterial
    );
    ground.receiveShadow = true;
    scene.add(ground);

    // --- Fractal Tree Mesh ---
    let treeStructure = new TreeStructure({
      maxLayers: params.maxLayers,
      branchAngle: params.branchAngle,
      branchAngleSpread: params.branchAngleSpread,
      scaleDecay: params.scaleDecay,
      scaleRandomness: params.scaleRandomness,
      maxSplit: params.maxSplit,
      minSplit: params.minSplit,
      cylinderRadius: params.cylinderRadius,
      cylinderSegments: params.cylinderSegments,
      seed: params.treeSeed,
      colorStart: params.colorStart,
      colorEnd: params.colorEnd
    });
    scene.add(treeStructure);

    // --- Update Helper Functions ---
    function updateBackgroundAndGround() {
      if (params.greenscreen) {
        scene.background.set("#00ff00");
        groundUniforms.colorFade.value.set("#00ff00");
        document.body.style.backgroundColor = "#00ff00";
      } else {
        scene.background.set(params.bgColor);
        groundUniforms.colorFade.value.set(params.bgColor);
        document.body.style.backgroundColor = params.bgColor;
      }
      groundMaterial.color.set(params.groundColor);
    }

    function updateLights() {
      light.color.set(params.lightColor);
      light.intensity = params.lightIntensity;
      ambientLight.color.set(params.ambientColor);
      ambientLight.intensity = params.ambientIntensity;
    }

    function rebuildTreeMesh() {
      treeStructure.maxLayers = params.maxLayers;
      treeStructure.branchAngle = params.branchAngle;
      treeStructure.branchAngleSpread = params.branchAngleSpread;
      treeStructure.scaleDecay = params.scaleDecay;
      treeStructure.seed = params.treeSeed;
      treeStructure.colors.colorStart.set(params.colorStart);
      treeStructure.colors.colorEnd.set(params.colorEnd);
      treeStructure.material.wireframe = params.wireframe;
      treeStructure.rebuild();
    }

    function applyColorPreset(name) {
      const p = COLOR_PRESETS[name];
      if (!p) return;
      params.colorStart = p.colorStart;
      params.colorEnd = p.colorEnd;
      params.bgColor = p.bgColor;
      params.groundColor = p.groundColor;
      params.lightColor = p.lightColor;
      params.lightIntensity = p.lightIntensity;
      params.ambientColor = p.ambientColor;
      params.ambientIntensity = p.ambientIntensity;

      treeStructure.colors.colorStart.set(params.colorStart);
      treeStructure.colors.colorEnd.set(params.colorEnd);
      treeStructure.updateColorsOnly();

      updateBackgroundAndGround();
      updateLights();
      refreshGUI();
    }

    function resetCameraView() {
      camera.position.copy(defaultCamPos);
      controls.target.copy(targetCenter);
      controls.update();
    }

    // --- Procedural Randomizer (Triggered on Scene Click) ---
    function randomizeScene() {
      const hStart = Math.random();
      const hEnd = (hStart + 0.3 + Math.random() * 0.4) % 1.0;
      const hBg = (hStart + 0.5) % 1.0;
      const hGround = (hStart + 0.15) % 1.0;

      const cStart = new THREE.Color().setHSL(hStart, 0.85 + Math.random() * 0.15, 0.5 + Math.random() * 0.2);
      const cEnd = new THREE.Color().setHSL(hEnd, 0.85 + Math.random() * 0.15, 0.5 + Math.random() * 0.2);
      const cBg = new THREE.Color().setHSL(hBg, 0.4 + Math.random() * 0.4, 0.15 + Math.random() * 0.65);
      const cGround = new THREE.Color().setHSL(hGround, 0.5 + Math.random() * 0.3, 0.3 + Math.random() * 0.5);

      params.colorStart = "#" + cStart.getHexString();
      params.colorEnd = "#" + cEnd.getHexString();
      params.bgColor = "#" + cBg.getHexString();
      params.groundColor = "#" + cGround.getHexString();

      // Geometric variations with guaranteed lush fractal canopy
      params.maxLayers = Math.floor(Math.random() * 2) + 8; // 8 to 9 layers
      params.branchAngle = Math.floor(Math.random() * 12) + 20; // 20 to 32 deg
      params.branchAngleSpread = Math.floor(Math.random() * 10) + 18; // 18 to 28 deg
      params.scaleDecay = Number((Math.random() * 0.05 + 0.72).toFixed(2));
      params.treeSeed = Math.floor(Math.random() * 1000000);

      // Motion variations
      params.speed = Number((Math.random() * 0.8 + 0.6).toFixed(2));
      const animKeys = ANIMATION_PRESETS;
      params.animationPreset = animKeys[Math.floor(Math.random() * animKeys.length)];

      rebuildTreeMesh();
      updateBackgroundAndGround();
      updateLights();
      refreshGUI();
    }

    // --- Pointer Events for Scene Click vs Drag ---
    let pointerDownPos = { x: 0, y: 0 };
    let pointerDownTime = 0;

    window.addEventListener("pointerdown", (e) => {
      pointerDownPos.x = e.clientX;
      pointerDownPos.y = e.clientY;
      pointerDownTime = performance.now();
    });

    window.addEventListener("pointerup", (e) => {
      if (!params.clickToRandomize) return;
      if (gui && gui.domElement && gui.domElement.contains(e.target)) return;

      const dx = e.clientX - pointerDownPos.x;
      const dy = e.clientY - pointerDownPos.y;
      const dist = Math.hypot(dx, dy);
      const dt = performance.now() - pointerDownTime;

      if (dist < 6 && dt < 400) {
        randomizeScene();
      }
    });

    // --- GUI Setup (lil-gui) ---
    const gui = new GUI({ title: "Tree Scene Controls" });

    const fPresets = gui.addFolder("Presets & Modes");
    fPresets.add(params, "preset", Object.keys(COLOR_PRESETS)).name("Color Scheme").onChange(applyColorPreset);
    fPresets.add(params, "animationPreset", ANIMATION_PRESETS).name("Animation");
    fPresets.add(params, "greenscreen").name("Greenscreen (#00ff00)").onChange(updateBackgroundAndGround);
    fPresets.add(params, "clickToRandomize").name("Click Scene to Re-roll");
    fPresets.add(params, "randomize").name("🎲 Randomize Scene");
    fPresets.open();

    const fColors = gui.addFolder("Colors & Lighting");
    fColors.addColor(params, "colorStart").name("Branch Base Color").onChange(() => {
      treeStructure.colors.colorStart.set(params.colorStart);
      treeStructure.updateColorsOnly();
    });
    fColors.addColor(params, "colorEnd").name("Branch Tip Color").onChange(() => {
      treeStructure.colors.colorEnd.set(params.colorEnd);
      treeStructure.updateColorsOnly();
    });
    fColors.addColor(params, "bgColor").name("Background Color").onChange(updateBackgroundAndGround);
    fColors.addColor(params, "groundColor").name("Ground Color").onChange(updateBackgroundAndGround);
    fColors.addColor(params, "lightColor").name("Sun Light Color").onChange(updateLights);
    fColors.add(params, "lightIntensity", 0.5, 10.0, 0.1).name("Sun Intensity").onChange(updateLights);
    fColors.addColor(params, "ambientColor").name("Ambient Color").onChange(updateLights);
    fColors.add(params, "ambientIntensity", 0.1, 5.0, 0.1).name("Ambient Intensity").onChange(updateLights);

    const fGeo = gui.addFolder("Fractal Geometry");
    fGeo.add(params, "maxLayers", 6, 9, 1).name("Branch Layers").onChange(() => {
      treeStructure.maxLayers = params.maxLayers;
      treeStructure.rebuild();
    });
    fGeo.add(params, "branchAngle", 15, 45, 1).name("Branch Angle (°)").onChange(() => {
      treeStructure.branchAngle = params.branchAngle;
      treeStructure.rebuild();
    });
    fGeo.add(params, "scaleDecay", 0.65, 0.80, 0.01).name("Scale Decay").onChange(() => {
      treeStructure.scaleDecay = params.scaleDecay;
      treeStructure.rebuild();
    });
    fGeo.add(params, "wireframe").name("Wireframe").onChange((val) => {
      treeStructure.material.wireframe = val;
    });
    fGeo.add(params, "rebuildTree").name("🔄 Rebuild Structure");

    const fMotion = gui.addFolder("Motion & Dynamics");
    fMotion.add(params, "speed", 0.0, 3.0, 0.05).name("Animation Speed");
    fMotion.add(params, "treeSway").name("Wind Sway");
    fMotion.add(params, "swayIntensity", 0.0, 2.0, 0.05).name("Sway Strength");

    const fSystem = gui.addFolder("System & Camera");
    fSystem.add(params, "dpr", 0.5, 3.0, 0.1).name("Pixel Ratio (DPR)").onChange((val) => {
      renderer.setPixelRatio(val);
    });
    fSystem.add(params, "resetCamera").name("Reset Camera View");

    function refreshGUI() {
      function traverse(folder) {
        if (folder.controllers) {
          folder.controllers.forEach((c) => c.updateDisplay && c.updateDisplay());
        }
        if (folder.folders) {
          folder.folders.forEach((sub) => traverse(sub));
        }
      }
      traverse(gui);
    }

    // --- Toggle UI with "H" Key ---
    window.addEventListener("keydown", (e) => {
      if (e.key === "h" || e.key === "H" || e.code === "KeyH") {
        if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT" || e.target.tagName === "TEXTAREA") return;
        if (typeof gui.show === "function" && typeof gui.hide === "function") {
          if (gui._hidden) {
            gui.show();
          } else {
            gui.hide();
          }
        } else if (gui.domElement) {
          gui.domElement.style.display = gui.domElement.style.display === "none" ? "" : "none";
        }
      }
    });

    // --- Responsive Resize ---
    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- Animation Loop ---
    let lastTime = performance.now();
    let accumulatedTime = 0;

    function animate(currentTime = performance.now()) {
      requestAnimationFrame(animate);

      const delta = Math.min((currentTime - lastTime) * 0.001, 0.1);
      lastTime = currentTime;
      accumulatedTime += delta * params.speed;
      const time = accumulatedTime;

      // Automated Camera Animation Modes (elevated and framed so entire tree is always visible)
      if (params.animationPreset === "Gentle Orbit") {
        const angle = time * 0.15;
        const radius = 7.2;
        camera.position.x = Math.sin(angle) * radius;
        camera.position.z = Math.cos(angle) * radius;
        camera.position.y = 3.5 + Math.sin(time * 0.2) * 0.6;
        camera.lookAt(targetCenter);
        controls.target.copy(targetCenter);
      } else if (params.animationPreset === "Slow Elevating Spiral") {
        const angle = time * 0.18;
        const radius = 7.0 + Math.sin(time * 0.12) * 0.8;
        const height = 3.2 + Math.sin(time * 0.15) * 1.5;
        camera.position.x = Math.sin(angle) * radius;
        camera.position.z = Math.cos(angle) * radius;
        camera.position.y = height;
        camera.lookAt(targetCenter);
        controls.target.copy(targetCenter);
      } else if (params.animationPreset === "Canopy Drift") {
        const t = time * 0.12;
        camera.position.x = Math.sin(t) * 6.5;
        camera.position.z = Math.cos(t * 0.8) * 6.8;
        camera.position.y = 3.0 + Math.cos(t * 1.2) * 1.0;
        camera.lookAt(targetCenter);
        controls.target.copy(targetCenter);
      } else if (params.animationPreset === "Cinematic Sweep") {
        const sweep = Math.sin(time * 0.1);
        camera.position.x = sweep * 6.5;
        camera.position.z = Math.cos(time * 0.1) * 6.5 + 1.0;
        camera.position.y = 2.5 + (sweep + 1.0) * 1.2;
        camera.lookAt(targetCenter);
        controls.target.copy(targetCenter);
      }

      // Wind Sway on Tree
      if (params.treeSway && treeStructure) {
        treeStructure.rotation.y = Math.sin(time * 0.25) * 0.08 * params.swayIntensity;
        treeStructure.rotation.z = Math.sin(time * 0.4) * 0.02 * params.swayIntensity;
      }

      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
