<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Echoing Mall Escalator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1a1e23;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
    }
  }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import GUI from 'lil-gui';

    // =========================================================================
    // POST PROCESSOR SUITE (Inlined from postprocessing/PostProcessor.js)
    // Standalone file:// protocol compatible, with bloom, godrays, anamorphic flare,
    // chromatic aberration, vignette, film grain, and vision modes.
    // =========================================================================
    const orthoVertexShader = `
    precision highp float;
    in vec3 position;
    out vec2 vUv;
    void main() {
      vUv = position.xy * 0.5 + 0.5;
      gl_Position = vec4(position, 1.0);
    }
    `;

    const brightFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float bloomThreshold;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      vec4 color = texture(inputTexture, vUv);
      float luminance = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float knee = 0.1;
      float soft = luminance - bloomThreshold + knee;
      soft = clamp(soft, 0.0, 2.0 * knee);
      soft = (soft * soft) / (4.0 * knee + 0.00001);
      float contribution = max(soft, luminance - bloomThreshold);
      contribution /= max(luminance, 0.00001);
      fragColor = vec4(color.rgb * contribution, color.a);
    }
    `;

    const blur13ShaderChunk = `
    vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
      vec2 resolution = vec2(textureSize(image, 0));
      vec4 color = vec4(0.0);
      vec2 off1 = vec2(1.411764705882353) * direction;
      vec2 off2 = vec2(3.2941176470588234) * direction;
      vec2 off3 = vec2(5.176470588235294) * direction;
      color += texture(image, uv) * 0.1964825501511404;
      color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
      color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
      return color;
    }
    `;

    const blurFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 direction;
    in vec2 vUv;
    out vec4 color;
    ${blur13ShaderChunk}
    void main() {
      color = blur13(inputTexture, vUv, direction);
    }
    `;

    const godRaysDepthMaskShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float threshold;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      vec4 color = texture(inputTexture, vUv);
      float lum = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float factor = smoothstep(threshold, threshold + 0.15, lum);
      fragColor = vec4(vec3(factor), 1.0);
    }
    `;

    const godRaysGenerateShader = `
    precision highp float;
    #define TAPS_PER_PASS 6.0
    uniform sampler2D inputTexture;
    uniform vec3 vSunPositionScreenSpace;
    uniform float fStepSize;
    uniform float distanceAttenuation;
    uniform float maxDensity;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      vec2 delta = vSunPositionScreenSpace.xy - vUv;
      float dist = length(delta);
      vec2 stepv = fStepSize * delta / max(dist, 0.0001);
      float iters = dist / max(fStepSize, 0.00001);
      vec2 uv = vUv;
      float col = 0.0;
      float f = min(1.0, max(vSunPositionScreenSpace.z, 0.0));
      float atten = 1.0 / (1.0 + pow(dist, distanceAttenuation));
      if (0.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (1.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (2.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (3.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (4.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (5.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      float finalVal = min(col / TAPS_PER_PASS * atten, maxDensity);
      fragColor = vec4(vec3(finalVal), 1.0);
    }
    `;

    const anamorphicBrightShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float threshold;
    uniform float smoothWidth;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      vec4 color = texture(inputTexture, vUv);
      float v = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float alpha = smoothstep(threshold, threshold + smoothWidth, v);
      fragColor = mix(vec4(0.0), color, alpha);
    }
    `;

    const anamorphicBlurShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 resolution;
    uniform float samples;
    uniform float intensity;
    uniform vec3 tintColor;
    uniform float bloomRadius;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      int halfSamples = max(1, int(samples) / 2);
      float fHalfSamples = float(halfSamples);
      vec2 invSize = 1.0 / resolution;
      vec4 total = vec4(0.0);
      for (int i = -64; i <= 64; i++) {
        if (i < -halfSamples || i > halfSamples) continue;
        float softness = 1.0 - abs(float(i)) / fHalfSamples;
        softness = pow(softness, 2.0);
        vec2 shiftedUV = vec2(vUv.x + invSize.x * float(i) * (4.0 + bloomRadius * 8.0), vUv.y);
        shiftedUV = clamp(shiftedUV, 0.001, 0.999);
        total += texture(inputTexture, shiftedUV) * softness;
      }
      fragColor = (total / (samples / 3.0)) * vec4(tintColor, 1.0) * intensity;
    }
    `;

    const finalFragmentShader = `
    precision highp float;
    uniform vec2 resolution;
    uniform sampler2D inputTexture;
    uniform sampler2D blur0Texture;
    uniform sampler2D blur1Texture;
    uniform sampler2D blur2Texture;
    uniform sampler2D blur3Texture;
    uniform sampler2D blur4Texture;
    uniform sampler2D raysTexture;
    uniform sampler2D anamorphicTexture;
    uniform bool bloomEnabled;
    uniform float bloomStrength;
    uniform bool raysEnabled;
    uniform float raysStrength;
    uniform vec3 raysColor;
    uniform bool anamorphicEnabled;
    uniform float vignetteBoost;
    uniform float vignetteReduction;
    uniform float noiseIntensity;
    uniform float time;
    in vec2 vUv;
    out vec4 fragColor;

    float vignette(vec2 uv, float boost, float reduction) {
      vec2 position = vUv - 0.5;
      return boost - length(position) * reduction;
    }

    float hash1(uint n) {
      n = (n << 13U) ^ n;
      n = n * (n * n * 15731U + 789221U) + 1376312589U;
      return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
    }

    float noise(in vec2 uv, in float timeVal) {
      uvec2 p = uvec2(uv);
      return hash1(p.x + 1920U * p.y + (1920U * 1080U) * uint(timeVal));
    }

    void main() {
      vec4 color = texture(inputTexture, vUv);

      if (bloomEnabled && bloomStrength > 0.001) {
        vec4 b0 = texture(blur0Texture, vUv);
        vec4 b1 = texture(blur1Texture, vUv);
        vec4 b2 = texture(blur2Texture, vUv);
        vec4 b3 = texture(blur3Texture, vUv);
        vec4 b4 = texture(blur4Texture, vUv);
        vec4 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
        color += bloomSum * bloomStrength;
      }

      if (raysEnabled && raysStrength > 0.001) {
        vec4 r = texture(raysTexture, vUv);
        color.rgb += r.rgb * raysColor * raysStrength;
      }

      if (anamorphicEnabled) {
        vec4 a = texture(anamorphicTexture, vUv);
        color.rgb += a.rgb;
      }

      color.rgb *= vignette(vUv, vignetteBoost, vignetteReduction);
      color.rgb += noiseIntensity * noise(gl_FragCoord.xy, time);
      fragColor = vec4(color.rgb, 1.0);
    }
    `;

    const chromaticAberrationShaderChunk = `
    vec2 barrelDistortion(vec2 coord, float amt) {
      vec2 cc = coord - 0.5;
      float dist = dot(cc, cc);
      return coord + cc * dist * amt;
    }
    float sat(float t) { return clamp(t, 0.0, 1.0); }
    float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
    float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
    vec4 spectrum_offset(float t) {
      float lo = step(t, 0.5);
      float hi = 1.0 - lo;
      float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
      vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
      return pow(ret, vec4(1.0 / 2.2));
    }
    const float max_distort = 2.2;
    const int num_iter = 8;
    const float reci_num_iter_f = 1.0 / float(num_iter);
    vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
      vec4 sumcol = vec4(0.0);
      vec4 sumw = vec4(0.0);
      for (int i = 0; i < num_iter; ++i) {
        float t = float(i) * reci_num_iter_f;
        vec4 w = spectrum_offset(t);
        sumw += w;
        sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
      }
      return sumcol / sumw;
    }
    `;

    const colorFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float chromaticAberrationAmount;
    uniform float minInputLevel;
    uniform float maxInputLevel;
    uniform float gammaLevel;
    uniform float exposure;
    uniform float fisheyeStrength;
    uniform float fisheyeRadius;
    uniform float time;
    uniform int visionMode;
    uniform float thermalSensitivity;
    uniform float nightVisionNoise;
    uniform float nightVisionGain;
    uniform float crtIntensity;
    in vec2 vUv;
    out vec4 fragColor;

    ${chromaticAberrationShaderChunk}

    vec2 applyFisheye(vec2 uv, float strength, float radius) {
      if (abs(strength) < 0.0001) return uv;
      vec2 p = uv - 0.5;
      float d = length(p);
      if (d > radius * 1.5) return uv;
      float r = d / max(radius, 0.001);
      float theta = atan(p.y, p.x);
      float rDist = r + strength * (r * r * r);
      return 0.5 + vec2(cos(theta), sin(theta)) * (rDist * radius);
    }

    vec3 ACESFilmicToneMapping(vec3 color) {
      float a = 2.51;
      float b = 0.03;
      float c = 2.43;
      float d = 0.59;
      float e = 0.14;
      return clamp((color * (a * color + b)) / (color * (c * color + d) + e), 0.0, 1.0);
    }

    vec3 gammaCorrect(vec3 color, vec3 gamma) {
      return pow(max(color, vec3(0.0)), 1.0 / gamma);
    }
    vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
      return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
    }
    vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
      return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
    }

    void main() {
      vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
      vec4 col = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
      vec3 finalCol = col.rgb;

      vec3 exposedColor = finalCol * exposure;
      vec3 toneMappedColor = ACESFilmicToneMapping(exposedColor);
      finalCol = finalLevels(toneMappedColor, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));

      fragColor = vec4(finalCol, 1.0);
    }
    `;

    const copyFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      fragColor = texture(inputTexture, vUv);
    }
    `;

    function createFBO(w, h, options = {}) {
      return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
        wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
        wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
        minFilter: options.minFilter || THREE.LinearFilter,
        magFilter: options.magFilter || THREE.LinearFilter,
        format: options.format || THREE.RGBAFormat,
        type: options.type || THREE.HalfFloatType,
        depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : true,
        samples: options.samples || 0,
      });
    }

    class ShaderPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbo = createFBO(1, 1, options);
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
        this.texture = this.fbo.texture;
      }
      render(renderer, toScreen = false) {
        if (!toScreen) renderer.setRenderTarget(this.fbo);
        renderer.render(this.orthoScene, this.orthoCamera);
        if (!toScreen) renderer.setRenderTarget(null);
      }
      setSize(width, height) {
        this.fbo.setSize(Math.max(1, width), Math.max(1, height));
        this.orthoQuad.scale.set(width, height, 1);
      }
    }

    class ShaderPingPongPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
        this.currentFBO = 0;
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
      }
      render(renderer) {
        renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
        renderer.render(this.orthoScene, this.orthoCamera);
        renderer.setRenderTarget(null);
        this.currentFBO = 1 - this.currentFBO;
      }
      get current() { return this.fbos[this.currentFBO]; }
      get texture() { return this.current.texture; }
      setSize(width, height) {
        const w = Math.max(1, width);
        const h = Math.max(1, height);
        this.orthoQuad.scale.set(w, h, 1);
        this.fbos[0].setSize(w, h);
        this.fbos[1].setSize(w, h);
      }
    }

    class BloomPass {
      constructor(strength = 1.3, radius = 0.65, threshold = 0.2, levels = 5) {
        this.strength = strength;
        this.radius = radius;
        this.threshold = threshold;
        this.enabled = true;
        this.levels = levels;

        this.brightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            bloomThreshold: { value: this.threshold },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: brightFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.brightPass = new ShaderPass(this.brightShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.blurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            direction: { value: new THREE.Vector2(0, 1) },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: blurFragmentShader,
          glslVersion: THREE.GLSL3,
        });

        this.blurPasses = [];
        for (let i = 0; i < this.levels; i++) {
          this.blurPasses.push(new ShaderPingPongPass(this.blurShader, {
            format: THREE.RGBAFormat,
            type: THREE.HalfFloatType,
          }));
        }
      }

      setSize(w, h) {
        let tw = Math.max(1, w);
        let th = Math.max(1, h);
        this.brightPass.setSize(tw, th);
        for (let i = 0; i < this.levels; i++) {
          tw = Math.max(1, Math.round(tw / 2));
          th = Math.max(1, Math.round(th / 2));
          this.blurPasses[i].setSize(tw, th);
        }
      }

      set source(texture) {
        this.brightShader.uniforms.inputTexture.value = texture;
      }

      render(renderer) {
        if (!this.enabled || this.strength <= 0.001) return;
        this.brightShader.uniforms.bloomThreshold.value = this.threshold;
        this.brightPass.render(renderer);

        const baseOffset = Math.max(0.1, this.radius * 2.0);
        const u = this.blurShader.uniforms;

        for (let j = 0; j < this.levels; j++) {
          const blurPass = this.blurPasses[j];
          const stepOffset = baseOffset * (1.0 + j * 0.5);

          u.direction.value.set(stepOffset, 0);
          u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
          blurPass.render(renderer);

          u.direction.value.set(0, stepOffset * 0.5);
          u.inputTexture.value = blurPass.current.texture;
          blurPass.render(renderer);
        }
      }
    }

    class PostProcessor {
      constructor(renderer, params = {}) {
        this.renderer = renderer;

        this.settings = {
          enabled: params.enabled !== undefined ? params.enabled : true,
          antialias: params.antialias !== undefined ? params.antialias : true,

          // 1. Bloom
          bloomEnabled: params.bloomEnabled !== undefined ? params.bloomEnabled : true,
          bloomStrength: params.bloomStrength !== undefined ? params.bloomStrength : 1.4,
          bloomRadius: params.bloomRadius !== undefined ? params.bloomRadius : 0.65,
          bloomThreshold: params.bloomThreshold !== undefined ? params.bloomThreshold : 0.18,

          // 2. Godrays
          raysEnabled: params.raysEnabled !== undefined ? params.raysEnabled : false,
          raysStrength: params.raysStrength !== undefined ? params.raysStrength : 0.6,
          raysDensity: params.raysDensity !== undefined ? params.raysDensity : 1.0,
          raysMaxDensity: params.raysMaxDensity !== undefined ? params.raysMaxDensity : 0.5,
          raysDistanceAttenuation: params.raysDistanceAttenuation !== undefined ? params.raysDistanceAttenuation : 2.0,
          raysThreshold: params.raysThreshold !== undefined ? params.raysThreshold : 0.15,
          raysColor: new THREE.Color(0xf6aa1c),
          raysColorHex: '#f6aa1c',

          // 3. Anamorphic Flare (Default is OFF per requirements!)
          anamorphicEnabled: params.anamorphicEnabled !== undefined ? params.anamorphicEnabled : false,
          anamorphicIntensity: params.anamorphicIntensity !== undefined ? params.anamorphicIntensity : 4.0,
          anamorphicThreshold: params.anamorphicThreshold !== undefined ? params.anamorphicThreshold : 0.35,
          anamorphicSamples: params.anamorphicSamples !== undefined ? params.anamorphicSamples : 64,
          anamorphicRadius: params.anamorphicRadius !== undefined ? params.anamorphicRadius : 0.0,
          anamorphicSmoothWidth: params.anamorphicSmoothWidth !== undefined ? params.anamorphicSmoothWidth : 0.05,
          anamorphicColor: new THREE.Color(0x7a8aff),
          anamorphicColorHex: '#7a8aff',

          // 4. Lens & Optics
          fisheyeStrength: 0.0,
          fisheyeRadius: 1.0,
          chromaticAberration: 0.008,
          vignetteBoost: 1.05,
          vignetteReduction: 0.55,
          noiseIntensity: 0.012,

          // 5. Grading
          gamma: 1.0,
          minInputLevel: 0.0,
          maxInputLevel: 1.0,
          exposure: 1.0,
        };

        const maxSamples = (this.renderer && this.renderer.capabilities) ? (this.renderer.capabilities.maxSamples || 4) : 4;
        const targetSamples = this.settings.antialias ? Math.min(4, maxSamples) : 0;
        this.sceneTarget = createFBO(1, 1, { type: THREE.HalfFloatType, samples: targetSamples });

        this.bloomPass = new BloomPass(
          this.settings.bloomStrength,
          this.settings.bloomRadius,
          this.settings.bloomThreshold,
          5
        );

        this.finalShader = new THREE.RawShaderMaterial({
          uniforms: {
            resolution: { value: new THREE.Vector2(1, 1) },
            bloomEnabled: { value: this.settings.bloomEnabled },
            bloomStrength: { value: this.settings.bloomStrength },
            raysEnabled: { value: false },
            raysStrength: { value: this.settings.raysStrength },
            raysColor: { value: this.settings.raysColor },
            anamorphicEnabled: { value: this.settings.anamorphicEnabled },
            vignetteBoost: { value: this.settings.vignetteBoost },
            vignetteReduction: { value: this.settings.vignetteReduction },
            noiseIntensity: { value: this.settings.noiseIntensity },
            inputTexture: { value: null },
            blur0Texture: { value: null },
            blur1Texture: { value: null },
            blur2Texture: { value: null },
            blur3Texture: { value: null },
            blur4Texture: { value: null },
            raysTexture: { value: null },
            anamorphicTexture: { value: null },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: finalFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.finalPass = new ShaderPass(this.finalShader);

        this.rgbShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: this.finalPass.texture },
            fisheyeStrength: { value: this.settings.fisheyeStrength },
            fisheyeRadius: { value: this.settings.fisheyeRadius },
            chromaticAberrationAmount: { value: this.settings.chromaticAberration },
            minInputLevel: { value: this.settings.minInputLevel },
            maxInputLevel: { value: this.settings.maxInputLevel },
            gammaLevel: { value: this.settings.gamma },
            exposure: { value: this.settings.exposure },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: colorFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.rgbPass = new ShaderPass(this.rgbShader);

        this.copyShader = new THREE.RawShaderMaterial({
          uniforms: { inputTexture: { value: null } },
          vertexShader: orthoVertexShader,
          fragmentShader: copyFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.copyPass = new ShaderPass(this.copyShader);
      }

      updateSettings() {
        this.bloomPass.enabled = this.settings.bloomEnabled;
        this.bloomPass.strength = this.settings.bloomStrength;
        this.bloomPass.radius = this.settings.bloomRadius;
        this.bloomPass.threshold = this.settings.bloomThreshold;

        this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
        this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
        this.finalShader.uniforms.anamorphicEnabled.value = this.settings.anamorphicEnabled;
        this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
        this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
        this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;

        this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
        this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
        this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
        this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
        this.rgbShader.uniforms.exposure.value = this.settings.exposure;
      }

      setSize(w0, h0, dpr = 1) {
        const w = Math.max(1, Math.floor(w0 * dpr));
        const h = Math.max(1, Math.floor(h0 * dpr));
        this.sceneTarget.setSize(w, h);
        this.finalPass.setSize(w, h);
        this.finalShader.uniforms.resolution.value.set(w, h);
        this.bloomPass.setSize(w, h);
        this.rgbPass.setSize(w, h);
        this.copyPass.setSize(w, h);
      }

      setAntialias(enabled) {
        this.settings.antialias = !!enabled;
        const maxSamples = (this.renderer && this.renderer.capabilities) ? (this.renderer.capabilities.maxSamples || 4) : 4;
        const samples = this.settings.antialias ? Math.min(4, maxSamples) : 0;
        if (this.sceneTarget.samples !== samples) {
          const oldTarget = this.sceneTarget;
          this.sceneTarget = createFBO(oldTarget.width, oldTarget.height, {
            type: THREE.HalfFloatType,
            samples: samples,
          });
          oldTarget.dispose();
        }
      }

      renderScene(scene, camera) {
        if (!this.settings.enabled) {
          this.renderer.render(scene, camera);
          return;
        }

        this.renderer.setRenderTarget(this.sceneTarget);
        this.renderer.render(scene, camera);
        this.renderer.setRenderTarget(null);

        this.updateSettings();

        // Bloom
        this.bloomPass.source = this.sceneTarget.texture;
        this.finalPass.shader.uniforms.inputTexture.value = this.sceneTarget.texture;
        this.bloomPass.render(this.renderer);

        this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
        this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
        this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
        this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
        this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

        const randomTime = Math.random() * 10000;
        this.finalPass.shader.uniforms.time.value = randomTime;
        this.rgbPass.shader.uniforms.time.value = randomTime;

        this.finalPass.render(this.renderer);
        this.rgbPass.render(this.renderer, true);
      }

      attachGUI(gui, title = "Post-Processing Suite") {
        const root = gui.addFolder(title);
        root.add(this.settings, "enabled").name("Enable Post-Process");
        root.add(this.settings, "antialias").name("MSAA Antialias").onChange((v) => this.setAntialias(v));

        // Bloom Controls
        const bloom = root.addFolder("Atmospheric Bloom");
        bloom.add(this.settings, "bloomEnabled").name("Enable Bloom").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomStrength", 0, 4.0, 0.05).name("Strength").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomRadius", 0, 2.0, 0.05).name("Radius").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomThreshold", 0, 1.0, 0.01).name("Threshold").onChange(() => this.updateSettings());

        // Anamorphic Flare
        const anamorphic = root.addFolder("Anamorphic Flare (Default Off)");
        anamorphic.add(this.settings, "anamorphicEnabled").name("Enable Flare").onChange(() => this.updateSettings());
        anamorphic.add(this.settings, "anamorphicIntensity", 0, 10.0, 0.1).name("Intensity").onChange(() => this.updateSettings());
        anamorphic.add(this.settings, "anamorphicThreshold", 0.0, 0.9, 0.01).name("Threshold").onChange(() => this.updateSettings());

        // Lens, Optics & Grain
        const lens = root.addFolder("Lens, Optics & Grain");
        lens.add(this.settings, "chromaticAberration", 0, 0.1, 0.002).name("Chromatic Aberration").onChange(() => this.updateSettings());
        lens.add(this.settings, "vignetteBoost", 0.5, 2.0, 0.05).name("Vignette Boost").onChange(() => this.updateSettings());
        lens.add(this.settings, "vignetteReduction", 0, 2.0, 0.05).name("Vignette Falloff").onChange(() => this.updateSettings());
        lens.add(this.settings, "noiseIntensity", 0, 0.08, 0.002).name("Film Grain").onChange(() => this.updateSettings());
        lens.add(this.settings, "gamma", 0.5, 1.8, 0.05).name("Gamma").onChange(() => this.updateSettings());

        return root;
      }

    // =========================================================================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(params.bgColor);
    scene.fog = new THREE.FogExp2(params.bgColor, params.fogDensity);

    // Exact framing matching img 2:
    const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 300);
    camera.position.set(6.5, 0.8, 22.0);

    const renderer = new THREE.WebGLRenderer({
      antialias: params.antialias,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(params.dpr);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = params.exposure;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.enableZoom = true;
    controls.enablePan = true;
    controls.screenSpacePanning = true;
    controls.target.set(0.2, 2.8, 0.0);
    controls.maxDistance = 120;
    controls.minDistance = 5;

    // Initialize PostProcessor Suite
    // (anamorphicEnabled: false by default per requirement)
    const postProcessor = new PostProcessor(renderer, {
      enabled: true,
      antialias: params.antialias,
      bloomEnabled: true,
      bloomStrength: 1.5,
      bloomRadius: 0.65,
      bloomThreshold: 0.16,

    keyLight.shadow.camera.near = 5;

        color: params.trussColor,
        roughness: 0.65,
        metalness: 0.2,
        flatShading: true
      }),
      trim: new THREE.MeshStandardMaterial({
        color: params.trimColor,
        roughness: 0.45,
        metalness: 0.4,
        flatShading: true
      }),
      steps: new THREE.MeshStandardMaterial({
        color: params.stepsColor,
        roughness: 0.4,
        metalness: 0.6,
        flatShading: true
      }),
      rail: new THREE.MeshStandardMaterial({
        color: params.railColor,
        roughness: 0.3,
        metalness: 0.2
      }),
      glass: new THREE.MeshPhysicalMaterial({
        color: 0x8aa0b5,
        transparent: true,
        opacity: 0.32,
        roughness: 0.1,
        metalness: 0.1,
        transmission: 0.75,
        ior: 1.45,
        side: THREE.DoubleSide,
        depthWrite: false
      }),
      arch: new THREE.MeshStandardMaterial({
        color: params.archColor,
        roughness: 0.75,
        metalness: 0.15,
        flatShading: true
      }),
      figure: new THREE.MeshStandardMaterial({
        color: params.figureColor,
        roughness: 0.8,
        metalness: 0.05,
        flatShading: true
      }),
      clouds: new THREE.MeshStandardMaterial({
        color: COLOR_SCHEMES['Original'].clouds,
        roughness: 0.9,
        metalness: 0.0,
        flatShading: true
      }),
      landingPlate: new THREE.MeshStandardMaterial({
        color: 0x6e7580,
        roughness: 0.5,
        metalness: 0.5,
        flatShading: true
      })
    };

    // =========================================================================
    // BILLOWING CUMULUS CLOUDS (Dense cluster behind escalator matching img 2)
    // =========================================================================
    const cloudsGroup = new THREE.Group();
    scene.add(cloudsGroup);

    function createFacetedCloud(radius = 3.8) {
      const group = new THREE.Group();
      const numPuffs = 6 + Math.floor(Math.random() * 4);
      for (let i = 0; i < numPuffs; i++) {
        const subRadius = radius * (0.6 + Math.random() * 0.5);
        const geom = new THREE.IcosahedronGeometry(subRadius, 1);
        const mesh = new THREE.Mesh(geom, materials.clouds);
        mesh.position.set(
          (Math.random() - 0.5) * radius * 1.5,
          (Math.random() - 0.5) * radius * 1.2,
          (Math.random() - 0.5) * radius * 1.2
        );
        mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
        group.add(mesh);
      }
      return group;
    }

    const cloudInstances = [];
    // Concentrate massive cloud bank directly behind escalator (X from -25 to 6, Y from -8 to 20, Z from -24 to -6)
    for (let i = 0; i < 36; i++) {
      const cloud = createFacetedCloud(3.2 + Math.random() * 2.8);
      const x = -24 + Math.random() * 32;
      const y = -10 + Math.random() * 26;
      const z = -26 + Math.random() * 16;
      cloud.position.set(x, y, z);
      cloudsGroup.add(cloud);
      cloudInstances.push({
        group: cloud,
        baseX: x,
        baseY: y,
        speedX: 0.03 + Math.random() * 0.04,
        rotSpeed: (Math.random() - 0.5) * 0.015,
        phase: Math.random() * Math.PI * 2
      });
    }

    // =========================================================================
    // ESCALATOR GEOMETRY (Matching exact proportions of img 2)
    // =========================================================================
    const ESC_CONFIG = {
      xStart: -12.5,
      yStart: -5.5,
      xInclineStart: -8.0,
      yInclineStart: -5.5,
      xInclineEnd: 6.8,
      yInclineEnd: 5.5,
      xEnd: 10.8,
      yEnd: 5.5,
      width: 3.1,
      railHeight: 1.15, // Natural waist height for riders
      trussDepth: 2.2
    };

    const escalatorGroup = new THREE.Group();
    scene.add(escalatorGroup);

    // 1. Lower Landing Steel Platform (Top surface sits flush at y = yStart)
    const lowerPlateGeo = new THREE.BoxGeometry(4.4, 0.16, ESC_CONFIG.width + 0.2);
    const lowerPlate = new THREE.Mesh(lowerPlateGeo, materials.landingPlate);
    lowerPlate.position.set(ESC_CONFIG.xStart + 0.5, ESC_CONFIG.yStart - 0.08, 0);
    lowerPlate.receiveShadow = true;
    lowerPlate.castShadow = true;
    escalatorGroup.add(lowerPlate);

    // Comb plate grooved detail at entry (flush with floor surface)
    const combGeo = new THREE.BoxGeometry(1.6, 0.04, ESC_CONFIG.width - 0.15);
    const combMesh = new THREE.Mesh(combGeo, materials.steps);
    combMesh.position.set(ESC_CONFIG.xInclineStart - 0.8, ESC_CONFIG.yStart - 0.02, 0);
    escalatorGroup.add(combMesh);

    // 2. Escalator Main Truss Body (Underbody sits cleanly beneath step treads and deck)
    function createTruss() {
      const shape = new THREE.Shape();
      const topOffset = -0.06; // Truss body begins just beneath the step surface

      shape.moveTo(ESC_CONFIG.xStart - 1.5, ESC_CONFIG.yStart + topOffset);
      shape.lineTo(ESC_CONFIG.xInclineStart, ESC_CONFIG.yStart + topOffset);
      shape.lineTo(ESC_CONFIG.xInclineEnd, ESC_CONFIG.yEnd + topOffset);
      shape.lineTo(ESC_CONFIG.xEnd, ESC_CONFIG.yEnd + topOffset);
      shape.lineTo(ESC_CONFIG.xEnd, ESC_CONFIG.yEnd - ESC_CONFIG.trussDepth);
      shape.lineTo(ESC_CONFIG.xInclineEnd + 0.3, ESC_CONFIG.yEnd - ESC_CONFIG.trussDepth);
      shape.lineTo(ESC_CONFIG.xInclineStart - 0.3, ESC_CONFIG.yStart - ESC_CONFIG.trussDepth);
      shape.lineTo(ESC_CONFIG.xStart - 1.5, ESC_CONFIG.yStart - ESC_CONFIG.trussDepth * 0.7);
      shape.closePath();

      const extrudeSettings = {
        steps: 1,
        depth: ESC_CONFIG.width,
        bevelEnabled: true,
        bevelThickness: 0.12,
        bevelSize: 0.12,
        bevelSegments: 2
      };

      const geom = new THREE.ExtrudeGeometry(shape, extrudeSettings);
      // Center along Z axis only so absolute X & Y profile remains exact
      geom.translate(0, 0, -ESC_CONFIG.width * 0.5);

      const mesh = new THREE.Mesh(geom, materials.truss);
      mesh.position.set(0, 0, 0);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }
    const trussMesh = createTruss();
    escalatorGroup.add(trussMesh);

    // Light trim bevel running along the top outer rim of the truss
    function createTrimRail(sideZ) {
      const trimCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(ESC_CONFIG.xStart - 1.2, ESC_CONFIG.yStart + 0.02, sideZ),
        new THREE.Vector3(ESC_CONFIG.xInclineStart, ESC_CONFIG.yStart + 0.02, sideZ),
        new THREE.Vector3(ESC_CONFIG.xInclineEnd, ESC_CONFIG.yEnd + 0.02, sideZ),
        new THREE.Vector3(ESC_CONFIG.xEnd, ESC_CONFIG.yEnd + 0.02, sideZ)
      ]);
      const trimGeo = new THREE.TubeGeometry(trimCurve, 32, 0.07, 6, false);
      const mesh = new THREE.Mesh(trimGeo, materials.trim);
      return mesh;
    }
    const halfW = ESC_CONFIG.width * 0.5;
    escalatorGroup.add(createTrimRail(halfW + 0.05));
    escalatorGroup.add(createTrimRail(-halfW - 0.05));

    // 3. Glass Balustrades & Rounded Rubber Handrails
    function createBalustrade(sideZ) {
      const balGroup = new THREE.Group();

      const glassShape = new THREE.Shape();
      glassShape.moveTo(ESC_CONFIG.xStart - 0.5, ESC_CONFIG.yStart + 0.02);
      glassShape.lineTo(ESC_CONFIG.xInclineStart, ESC_CONFIG.yStart + 0.02);
      glassShape.lineTo(ESC_CONFIG.xInclineEnd, ESC_CONFIG.yEnd + 0.02);
      glassShape.lineTo(ESC_CONFIG.xEnd - 0.2, ESC_CONFIG.yEnd + 0.02);
      glassShape.lineTo(ESC_CONFIG.xEnd - 0.2, ESC_CONFIG.yEnd + ESC_CONFIG.railHeight);
      glassShape.lineTo(ESC_CONFIG.xInclineEnd, ESC_CONFIG.yEnd + ESC_CONFIG.railHeight);
      glassShape.lineTo(ESC_CONFIG.xInclineStart, ESC_CONFIG.yStart + ESC_CONFIG.railHeight);
      glassShape.lineTo(ESC_CONFIG.xStart - 0.5, ESC_CONFIG.yStart + ESC_CONFIG.railHeight);
      glassShape.closePath();

      const glassGeo = new THREE.ShapeGeometry(glassShape);
      const glassMesh = new THREE.Mesh(glassGeo, materials.glass);
      glassMesh.position.z = sideZ;
      balGroup.add(glassMesh);

      // Handrail rubber curve at waist height
      const railCurvePoints = [
        new THREE.Vector3(ESC_CONFIG.xStart - 1.0, ESC_CONFIG.yStart + 0.35, sideZ),
        new THREE.Vector3(ESC_CONFIG.xStart - 0.8, ESC_CONFIG.yStart + ESC_CONFIG.railHeight, sideZ),
        new THREE.Vector3(ESC_CONFIG.xInclineStart, ESC_CONFIG.yStart + ESC_CONFIG.railHeight, sideZ),
        new THREE.Vector3(ESC_CONFIG.xInclineEnd, ESC_CONFIG.yEnd + ESC_CONFIG.railHeight, sideZ),
        new THREE.Vector3(ESC_CONFIG.xEnd + 0.1, ESC_CONFIG.yEnd + ESC_CONFIG.railHeight, sideZ),
        new THREE.Vector3(ESC_CONFIG.xEnd + 0.3, ESC_CONFIG.yEnd + 0.4, sideZ)
      ];
      const railCurve = new THREE.CatmullRomCurve3(railCurvePoints, false, 'centripetal', 0.1);
      const railGeo = new THREE.TubeGeometry(railCurve, 64, 0.11, 8, false);
      const railMesh = new THREE.Mesh(railGeo, materials.rail);
      balGroup.add(railMesh);

      return balGroup;
    }
    escalatorGroup.add(createBalustrade(halfW + 0.05));
    escalatorGroup.add(createBalustrade(-halfW - 0.05));

    // 4. Concrete Portal Arch at Top Landing (Matching img 2)
    function createTopPortal() {
      const archGroup = new THREE.Group();
      const archMat = materials.arch;

      const postWidth = 1.0;
      const postDepth = 1.1;
      const postHeight = 6.0;
      const span = ESC_CONFIG.width + 1.6;

      // Left Pillar
      const leftPillarGeo = new THREE.BoxGeometry(postDepth, postHeight, postWidth);
      const leftPillar = new THREE.Mesh(leftPillarGeo, archMat);
      leftPillar.position.set(0, postHeight * 0.5, span * 0.5);
      leftPillar.castShadow = true;
      leftPillar.receiveShadow = true;
      archGroup.add(leftPillar);

      // Right Pillar
      const rightPillar = leftPillar.clone();
      rightPillar.position.z = -span * 0.5;
      archGroup.add(rightPillar);

      // Angled Top Lintel (Beveled hexagonal portal matching img 2)
      const lintelShape = new THREE.Shape();
      const wH = span * 0.5 + postWidth * 0.5;
      lintelShape.moveTo(-wH, 0);
      lintelShape.lineTo(-wH * 0.65, 1.4);
      lintelShape.lineTo(wH * 0.65, 1.4);
      lintelShape.lineTo(wH, 0);
      lintelShape.lineTo(wH - postWidth, 0);
      lintelShape.lineTo(wH * 0.45, 0.9);
      lintelShape.lineTo(-wH * 0.45, 0.9);
      lintelShape.lineTo(-wH + postWidth, 0);
      lintelShape.closePath();

      const lintelGeo = new THREE.ExtrudeGeometry(lintelShape, { steps: 1, depth: postDepth, bevelEnabled: false });
      lintelGeo.center();
      const lintelMesh = new THREE.Mesh(lintelGeo, archMat);
      lintelMesh.rotation.y = Math.PI * 0.5;
      lintelMesh.position.set(0, postHeight + 0.65, 0);
      lintelMesh.castShadow = true;
      lintelMesh.receiveShadow = true;
      archGroup.add(lintelMesh);

      archGroup.position.set(ESC_CONFIG.xInclineEnd + 1.2, ESC_CONFIG.yEnd, 0);
      return archGroup;
    }
    const topPortal = createTopPortal();
    escalatorGroup.add(topPortal);

    // 5. MECHANICAL STEPS (Triangular ribbed treads that loop continuously)
    const NUM_STEPS = 40;
    const stepMeshes = [];

    // Parametric evaluation of step position
    function getEscalatorPathPosition(progress) {
      const p = Math.max(0, Math.min(1, progress));
      const x0 = ESC_CONFIG.xStart - 0.5;
      const x1 = ESC_CONFIG.xInclineStart;
      const x2 = ESC_CONFIG.xInclineEnd;
      const x3 = ESC_CONFIG.xEnd;

      const totalX = x3 - x0;
      const x = x0 + p * totalX;

      let y = ESC_CONFIG.yStart;
      if (x < x1) {
        y = ESC_CONFIG.yStart;
      } else if (x <= x2) {
        const u = (x - x1) / (x2 - x1);
        y = ESC_CONFIG.yInclineStart + u * (ESC_CONFIG.yInclineEnd - ESC_CONFIG.yInclineStart);
      } else {
        y = ESC_CONFIG.yEnd;
      }

      return { x, y, z: 0 };
    }

    const stepWidth = ESC_CONFIG.width - 0.35;
    const stepDepth = 0.52;
    const stepHeight = 0.38;

    const stepShape = new THREE.Shape();
    stepShape.moveTo(-stepDepth * 0.5, 0);
    stepShape.lineTo(stepDepth * 0.5, 0);
    stepShape.lineTo(stepDepth * 0.5, -stepHeight);
    stepShape.lineTo(-stepDepth * 0.5, -stepHeight);
    stepShape.closePath();

    const stepGeo = new THREE.ExtrudeGeometry(stepShape, {
      steps: 1,
      depth: stepWidth,
      bevelEnabled: true,
      bevelThickness: 0.02,
      bevelSize: 0.02,
      bevelSegments: 1
    });
    // Align step geometry so top tread surface is exactly at Y = 0 and body hangs downwards
    stepGeo.translate(0, 0, -stepWidth * 0.5);

    for (let i = 0; i < NUM_STEPS; i++) {
      const mesh = new THREE.Mesh(stepGeo, materials.steps);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      escalatorGroup.add(mesh);
      stepMeshes.push({
        mesh,
        baseOffset: i / NUM_STEPS
      });
    }

    // =========================================================================
    // SHOPPING BAGS FACTORY
    // =========================================================================
    function createShoppingBag(colorHex) {
      const bagGroup = new THREE.Group();

      // Hand grip is at local origin (0, 0, 0)
      // Tote bag body hangs downwards from y = -0.15 to y = -0.67
      const bagGeo = new THREE.BoxGeometry(0.44, 0.52, 0.26);
      const bagMat = new THREE.MeshStandardMaterial({
        color: colorHex,
        emissive: colorHex,
        emissiveIntensity: params.bagGlowIntensity,
        roughness: 0.2,
        metalness: 0.1,
        transparent: true,
        opacity: 0.95
      });
      const bagMesh = new THREE.Mesh(bagGeo, bagMat);
      bagMesh.position.y = -0.41;
      bagGroup.add(bagMesh);

      // Handle loop connecting top of bag (-0.15) to hand grip (0.02)
      const handleCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(-0.12, -0.15, 0),
        new THREE.Vector3(-0.10, 0.02, 0),
        new THREE.Vector3(0.10, 0.02, 0),
        new THREE.Vector3(0.12, -0.15, 0)
      ]);
      const handleGeo = new THREE.TubeGeometry(handleCurve, 12, 0.018, 6, false);
      const handleMesh = new THREE.Mesh(handleGeo, bagMat);
      bagGroup.add(handleMesh);

      bagGroup.userData = {
        material: bagMat,
        colorHex: colorHex
      };

      return bagGroup;
    }

    // =========================================================================
    // FALLING STAR STREAK TRAILS (Thick, luminous ribbon meshes matching img 2)
    // =========================================================================
    const TRAIL_HISTORY_MAX = 20;

    function createRibbonTrail(colorHex) {
      // Dynamic triangle strip mesh with tapering width and alpha fade
      const vertexCount = TRAIL_HISTORY_MAX * 2;
      const positions = new Float32Array(vertexCount * 3);
      const colors = new Float32Array(vertexCount * 3);

      const indices = [];
      for (let i = 0; i < TRAIL_HISTORY_MAX - 1; i++) {
        const i0 = i * 2;
        const i1 = i * 2 + 1;
        const i2 = (i + 1) * 2;
        const i3 = (i + 1) * 2 + 1;
        indices.push(i0, i1, i2);
        indices.push(i2, i1, i3);
      }

      const geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geom.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      geom.setIndex(indices);

      const mat = new THREE.MeshBasicMaterial({
        vertexColors: true,
        transparent: true,
        blending: THREE.AdditiveBlending,
        side: THREE.DoubleSide,
        depthWrite: false
      });

      const mesh = new THREE.Mesh(geom, mat);
      mesh.frustumCulled = false;
      scene.add(mesh);

      return {
        mesh,
        geom,
        mat,
        history: [],
        color: new THREE.Color(colorHex)
      };
    }

    // =========================================================================
    // LOW-POLY COMMUTER SHADOW FIGURES (Mannequins matching img 2)
    // =========================================================================
    function createLowPolyFigure() {
      const figGroup = new THREE.Group();
      const mat = materials.figure.clone();
      mat.transparent = true;
      mat.opacity = 1.0;

      // Torso / Overcoat
      const coatGeo = new THREE.CylinderGeometry(0.3, 0.42, 1.45, 6);
      const coatMesh = new THREE.Mesh(coatGeo, mat);
      coatMesh.position.y = 1.35;
      coatMesh.castShadow = true;
      figGroup.add(coatMesh);

      // Head (Faceted icosahedron)
      const headGeo = new THREE.IcosahedronGeometry(0.3, 1);
      const headMesh = new THREE.Mesh(headGeo, mat);
      headMesh.position.set(0.06, 2.3, 0);
      headMesh.castShadow = true;
      figGroup.add(headMesh);

      // Left & Right Arms
      const armGeo = new THREE.CylinderGeometry(0.1, 0.08, 0.95, 5);

      const leftArm = new THREE.Mesh(armGeo, mat);
      leftArm.position.set(0.05, 1.35, 0.48);
      leftArm.rotation.x = -0.15;
      leftArm.rotation.z = -0.12;
      figGroup.add(leftArm);

      const rightArm = new THREE.Mesh(armGeo, mat);
      rightArm.position.set(0.05, 1.35, -0.48);
      rightArm.rotation.x = 0.15;
      rightArm.rotation.z = -0.12;
      figGroup.add(rightArm);

      // Left & Right Legs
      const legGeo = new THREE.CylinderGeometry(0.13, 0.1, 1.1, 5);

      const leftLeg = new THREE.Mesh(legGeo, mat);
      leftLeg.position.set(0, 0.55, 0.22);
      figGroup.add(leftLeg);

      const rightLeg = new THREE.Mesh(legGeo, mat);
      rightLeg.position.set(0, 0.55, -0.22);
      figGroup.add(rightLeg);

      return {
        group: figGroup,
        material: mat,
        leftArm,
        rightArm,
        head: headMesh
      };
    }

    // Apply opacity and glowing bag emission smoothly
    function applyCommuterOpacity(c) {
      const op = THREE.MathUtils.clamp(c.opacity, 0.0, 1.0);
      c.figureMat.opacity = op;
      c.figure.group.visible = (op > 0.002);

      for (let b = 0; b < c.bags.length; b++) {
        const bag = c.bags[b];
        const bagMat = bag.mesh.userData.material;
        bagMat.opacity = op * 0.95;
        bagMat.emissiveIntensity = params.bagGlowIntensity * op;
        bag.mesh.visible = (op > 0.002);
      }
    }

    // =========================================================================
    // COMMUTERS SETUP (Staggered two columns along escalator, matching img 2)
    // =========================================================================
    const NUM_COMMUTERS = 15;
    const commuters = [];

    function setupCommuters() {
      commuters.forEach(c => {
        scene.remove(c.figure.group);
        c.bags.forEach(b => {
          scene.remove(b.mesh);
          scene.remove(b.trail.mesh);
        });
      });
      commuters.length = 0;

      const currentPalette = COLOR_SCHEMES[params.colorScheme].bags;

      for (let i = 0; i < NUM_COMMUTERS; i++) {
        const figure = createLowPolyFigure();
        scene.add(figure.group);

        // Stagger along escalator progression
        const progress = i / NUM_COMMUTERS;

        // In img 2, commuters stand in two rows (left side vs right side)
        const isLeftRow = (i % 2 === 0);
        const lateralZ = isLeftRow ? (0.45 + (i % 3) * 0.1) : (-0.45 - (i % 3) * 0.1);

        // Each commuter holds 1 to 3 vibrant glowing shopping bags
        const bagCount = 1 + (i % 3);
        const bags = [];

        for (let b = 0; b < bagCount; b++) {
          const colorHex = currentPalette[(i * 2 + b) % currentPalette.length];
          const bagMesh = createShoppingBag(colorHex);
          scene.add(bagMesh);

          const trail = createRibbonTrail(colorHex);

          // Placement relative to figure hands (held comfortably at sides and hip height)
          const side = (b === 0) ? (isLeftRow ? 0.46 : -0.46) : ((b === 1) ? (isLeftRow ? -0.46 : 0.46) : (isLeftRow ? 0.32 : -0.32));
          const forwardOffset = (b === 2) ? 0.22 : 0.06;
          const heightOffset = 1.15 + (b === 1 ? -0.05 : (b === 2 ? 0.08 : 0.0));

          bags.push({
            mesh: bagMesh,
            trail: trail,
            colorHex: colorHex,
            sideOffset: side,
            forwardOffset: forwardOffset,
            heightOffset: heightOffset
          });
        }

        // Smooth ease-in for figures appearing at bottom
        const initialOpacity = progress < 0.14 ? (progress / 0.14) * (progress / 0.14) * (3 - 2 * (progress / 0.14)) : 1.0;

        const commuterObj = {
          figure,
          figureMat: figure.material,
          bags,
          progress: progress,
          state: 'riding', // 'riding' | 'walking_off' | 'falling'
          lateralZ: lateralZ,
          fallPos: new THREE.Vector3(),
          fallVel: new THREE.Vector3(),
          fallRot: new THREE.Vector3(),
          fallTime: 0,
          opacity: initialOpacity
        };

        applyCommuterOpacity(commuterObj);
        commuters.push(commuterObj);
      }
    }

    setupCommuters();

    // =========================================================================
    // PROCEDURAL WEB AUDIO MECHANICAL ESCALATOR HUM
    // =========================================================================
    let audioCtx = null;
    let humOsc1 = null;
    let humOsc2 = null;
    let noiseNode = null;
    let masterGain = null;

    function initAudio() {
      if (audioCtx) return;
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();

        masterGain = audioCtx.createGain();
        masterGain.gain.setValueAtTime(params.audioMuted ? 0 : params.audioVolume, audioCtx.currentTime);
        masterGain.connect(audioCtx.destination);

        humOsc1 = audioCtx.createOscillator();
        humOsc1.type = 'sawtooth';
        humOsc1.frequency.setValueAtTime(58, audioCtx.currentTime);

        const filter1 = audioCtx.createBiquadFilter();
        filter1.type = 'lowpass';
        filter1.frequency.setValueAtTime(120, audioCtx.currentTime);

        const osc1Gain = audioCtx.createGain();
        osc1Gain.gain.setValueAtTime(0.4, audioCtx.currentTime);

        humOsc1.connect(filter1);
        filter1.connect(osc1Gain);
        osc1Gain.connect(masterGain);
        humOsc1.start();

        humOsc2 = audioCtx.createOscillator();
        humOsc2.type = 'sine';
        humOsc2.frequency.setValueAtTime(116, audioCtx.currentTime);

        const osc2Gain = audioCtx.createGain();
        osc2Gain.gain.setValueAtTime(0.25, audioCtx.currentTime);

        humOsc2.connect(osc2Gain);
        osc2Gain.connect(masterGain);
        humOsc2.start();

        const bufferSize = audioCtx.sampleRate * 2;
        const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          output[i] = Math.random() * 2 - 1;
        }

        noiseNode = audioCtx.createBufferSource();
        noiseNode.buffer = noiseBuffer;
        noiseNode.loop = true;

        const noiseFilter = audioCtx.createBiquadFilter();
        noiseFilter.type = 'bandpass';
        noiseFilter.frequency.setValueAtTime(320, audioCtx.currentTime);
        noiseFilter.Q.setValueAtTime(2.0, audioCtx.currentTime);

        const noiseGain = audioCtx.createGain();
        noiseGain.gain.setValueAtTime(0.12, audioCtx.currentTime);

        noiseNode.connect(noiseFilter);
        noiseFilter.connect(noiseGain);
        noiseGain.connect(masterGain);
        noiseNode.start();
      } catch (e) {
        console.warn('AudioContext not started:', e);
      }
    }

    function updateAudioVolume() {
      if (!audioCtx || !masterGain) return;
      const targetGain = params.audioMuted ? 0 : params.audioVolume;
      masterGain.gain.setTargetAtTime(targetGain, audioCtx.currentTime, 0.08);
    }

    // =========================================================================
    // COLOR SCHEME APPLICATION
    // =========================================================================
    function applyColorScheme(schemeName) {
      const scheme = COLOR_SCHEMES[schemeName];
      if (!scheme) return;

      params.colorScheme = schemeName;
      if (!params.greenScreen) {
        params.bgColor = scheme.bg;
        params.fogDensity = scheme.fogDensity;
        scene.background.set(scheme.bg);
        scene.fog.color.set(scheme.fog);
        scene.fog.density = scheme.fogDensity;
      }

      params.trussColor = scheme.truss;
      params.trimColor = scheme.trim;
      params.stepsColor = scheme.steps;
      params.railColor = scheme.rail;
      params.archColor = scheme.arch;
      params.figureColor = scheme.figure;

      materials.truss.color.set(scheme.truss);
      materials.trim.color.set(scheme.trim);
      materials.steps.color.set(scheme.steps);
      materials.rail.color.set(scheme.rail);
      materials.arch.color.set(scheme.arch);
      materials.figure.color.set(scheme.figure);
      commuters.forEach(c => {
        if (c.figureMat) c.figureMat.color.set(scheme.figure);
      });
      materials.clouds.color.set(scheme.clouds);

      params.ambientColor = scheme.ambient;
      params.keyColor = scheme.keyLight;
      params.fillColor = scheme.fillLight;
      params.rimColor = scheme.rimLight;
      params.underglowColor = scheme.underglow;

      ambientLight.color.set(scheme.ambient);
      keyLight.color.set(scheme.keyLight);
      fillLight.color.set(scheme.fillLight);
      rimLight.color.set(scheme.rimLight);
      underglowLight.color.set(scheme.underglow);

      commuters.forEach((c, idx) => {
        c.bags.forEach((b, bIdx) => {
          const col = scheme.bags[(idx * 2 + bIdx) % scheme.bags.length];
          b.colorHex = col;
          b.mesh.userData.material.color.set(col);
          b.mesh.userData.material.emissive.set(col);
          b.trail.color.set(col);
        });
      });
    }

    function toggleGreenScreen(enable) {
      params.greenScreen = enable;
      if (enable) {
        scene.background.set('#00ff00');
        scene.fog.density = 0;
        cloudsGroup.visible = false;
      } else {
        const scheme = COLOR_SCHEMES[params.colorScheme];
        scene.background.set(scheme.bg);
        scene.fog.color.set(scheme.fog);
        scene.fog.density = scheme.fogDensity;
        cloudsGroup.visible = true;
      }
    }

    // =========================================================================
    // 8 PRECONFIGURED CINEMATIC CAMERA ANIMATIONS
    // =========================================================================
    const CAMERA_PRESETS = {
      'Static (Mall View)': (time) => {
        // Classic fixed reference framing matching img 2
      },
      'Slow Orbit': (time) => {
        const radius = 24.0;
        const angle = time * 0.04;
        camera.position.x = Math.sin(angle) * radius;
        camera.position.z = Math.cos(angle) * radius;
        camera.position.y = 2.0 + Math.sin(time * 0.025) * 1.5;
        controls.target.set(0.2, 2.8, 0);
      },
      'Passenger Ascent Follow': (time) => {
        const loop = (time * 0.035) % 1;
        const p = getEscalatorPathPosition(loop);
        camera.position.x = p.x + 6.0;
        camera.position.y = p.y + 2.5;
        camera.position.z = p.z + 14.0;
        controls.target.set(p.x, p.y + 1.2, p.z);
      },
      'Abyss Edge (Top View)': (time) => {
        const sway = Math.sin(time * 0.04) * 1.2;
        camera.position.set(13.0 + sway, 11.5, 10.0);
        controls.target.set(11.0, 3.5, 0);
      },
      'Low Angle Hero': (time) => {
        const drift = Math.sin(time * 0.03) * 1.0;
        camera.position.set(-14.0, -4.0 + drift, 12.0);
        controls.target.set(1.5, 3.2, 0);
      },
      'Subtle Void Float': (time) => {
        camera.position.x = 6.5 + Math.sin(time * 0.05) * 1.8;
        camera.position.y = 0.8 + Math.cos(time * 0.04) * 1.2;
        camera.position.z = 22.0 + Math.sin(time * 0.03) * 1.5;
        controls.target.set(0.2, 2.8, 0);
      },
      'Side Profile Tracking': (time) => {
        const drift = Math.sin(time * 0.035) * 3.0;
        camera.position.set(drift, 1.8, 28.0);
        controls.target.set(drift, 1.8, 0);
      },
      'Falling Soul Descent': (time) => {
        const fallLoop = (time * 0.04) % 1;
        const camY = 8.0 - fallLoop * 16.0;
        camera.position.set(18.0, camY + 2.0, 9.0);
        controls.target.set(12.0, camY - 2.0, 0);
      }
    };

    // =========================================================================
    // PROCEDURAL SCENE RANDOMIZER ON CLICK
    // (Requirement: "when I click for random scene do not shuffle or change Postprocessing settings")
    // =========================================================================
    function randomizeScene() {
      // 1. Pick random color scheme
      const keys = Object.keys(COLOR_SCHEMES);
      const randomScheme = keys[Math.floor(Math.random() * keys.length)];
      applyColorScheme(randomScheme);

      // 2. Randomize scene motion & lighting (POST-PROCESSING SETTINGS ARE UNTOUCHED)
      params.animSpeed = 0.75 + Math.random() * 0.6;
      params.exposure = 0.95 + Math.random() * 0.4;
      renderer.toneMappingExposure = params.exposure;

      params.keyIntensity = 2.0 + Math.random() * 1.5;
      keyLight.intensity = params.keyIntensity;

      params.fillIntensity = 1.2 + Math.random() * 1.0;
      fillLight.intensity = params.fillIntensity;

      params.rimIntensity = 1.0 + Math.random() * 1.0;
      rimLight.intensity = params.rimIntensity;

      params.underglowIntensity = 1.2 + Math.random() * 1.5;
      underglowLight.intensity = params.underglowIntensity;

      params.bagGlowIntensity = 2.5 + Math.random() * 1.5;

      commuters.forEach(c => {
        c.bags.forEach(b => {
          b.mesh.userData.material.emissiveIntensity = params.bagGlowIntensity;
        });
      });

      // Update GUI controllers for scene parameters only
      if (gui) {
        gui.controllersRecursive().forEach(ctrl => {
          // Do not update postProcessor controllers
          if (ctrl.property !== 'bloomStrength' &&
              ctrl.property !== 'bloomRadius' &&
              ctrl.property !== 'bloomThreshold' &&
              ctrl.property !== 'anamorphicEnabled' &&
              ctrl.property !== 'anamorphicIntensity') {
            ctrl.updateDisplay();
          }
        });
      }
    }

    // Canvas click detection (discriminates click from OrbitControls drag)
    let pointerDownPos = { x: 0, y: 0 };
    let pointerDownTime = 0;

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.lil-gui')) return;
      pointerDownPos = { x: e.clientX, y: e.clientY };
      pointerDownTime = performance.now();
      if (!params.audioMuted && !audioCtx) {
        initAudio();
      }
    });

    window.addEventListener('pointerup', (e) => {
      if (e.target.closest('.lil-gui')) return;
      const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
      const elapsed = performance.now() - pointerDownTime;

      if (dist < 6 && elapsed < 350 && params.clickRandomize) {
        randomizeScene();
      }
    });

    // =========================================================================
    // LIL-GUI CONTROL PANEL (Standard styling, no custom styles)
    // =========================================================================
    const gui = new GUI({ title: 'The Echoing Mall Escalator' });

    // 1. Theme & Color Schemes
    const fTheme = gui.addFolder('Theme & Color Schemes');
    fTheme.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES))
      .name('Preset Scheme')
      .onChange(val => applyColorScheme(val));

    fTheme.add(params, 'greenScreen')
      .name('Green Screen (#00ff00)')
      .onChange(val => toggleGreenScreen(val));

    fTheme.addColor(params, 'bgColor').name('Background Color').onChange(val => {
      if (!params.greenScreen) {
        scene.background.set(val);
        scene.fog.color.set(val);
      }
    });

    fTheme.add(params, 'fogDensity', 0.0, 0.04, 0.001).name('Fog Density').onChange(val => {
      if (!params.greenScreen) scene.fog.density = val;
    });

    fTheme.addColor(params, 'trussColor').name('Escalator Truss').onChange(val => materials.truss.color.set(val));
    fTheme.addColor(params, 'trimColor').name('Truss Trim Bevel').onChange(val => materials.trim.color.set(val));
    fTheme.addColor(params, 'stepsColor').name('Step Treads').onChange(val => materials.steps.color.set(val));
    fTheme.addColor(params, 'railColor').name('Handrail Rubber').onChange(val => materials.rail.color.set(val));
    fTheme.addColor(params, 'archColor').name('Top Portal Arch').onChange(val => materials.arch.color.set(val));
    fTheme.addColor(params, 'figureColor').name('Shadow Figures').onChange(val => {
      materials.figure.color.set(val);
      commuters.forEach(c => {
        if (c.figureMat) c.figureMat.color.set(val);
      });
    });
    fTheme.open();

    // 2. Camera & Animation
    const fAnim = gui.addFolder('Camera & Animation');
    fAnim.add(params, 'cameraAnimation', Object.keys(CAMERA_PRESETS)).name('Camera Mode').onChange(mode => {
      if (mode === 'Static (Mall View)') {
        camera.position.set(6.5, 0.8, 22.0);
        controls.target.set(0.2, 2.8, 0.0);
      }
    });
    fAnim.add(params, 'animSpeed', 0.1, 3.0, 0.1).name('Animation Speed');
    fAnim.add(params, 'clickRandomize').name('Click Scene to Randomize');

    // 3. Performance & Antialias
    const fPerf = gui.addFolder('Graphics & Display');
    fPerf.add(params, 'dpr', [0.5, 0.75, 1.0, 1.25, 1.5, 2.0, 2.5]).name('Pixel Ratio (DPR)').onChange(val => {
      params.dpr = Number(val);
      renderer.setPixelRatio(params.dpr);
      renderer.setSize(window.innerWidth, window.innerHeight);
      postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);
    });

    fPerf.add(params, 'antialias').name('Antialias (Default On)').onChange(val => {
      params.antialias = val;
      postProcessor.setAntialias(val);
    });

    // 4. Lighting & Exposure
    const fLight = gui.addFolder('Lighting & Exposure');
    fLight.add(params, 'exposure', 0.2, 2.5, 0.05).name('Scene Exposure').onChange(val => {
      renderer.toneMappingExposure = val;
    });

    fLight.add(params, 'ambientIntensity', 0.0, 3.5, 0.1).name('Ambient Intensity').onChange(val => {
      ambientLight.intensity = val;
    });
    fLight.addColor(params, 'ambientColor').name('Ambient Color').onChange(val => ambientLight.color.set(val));

    fLight.add(params, 'keyIntensity', 0.0, 5.0, 0.1).name('Key Light Intensity').onChange(val => {
      keyLight.intensity = val;
    });
    fLight.addColor(params, 'keyColor').name('Key Light Color').onChange(val => keyLight.color.set(val));

    fLight.add(params, 'fillIntensity', 0.0, 4.0, 0.1).name('Fill Light Intensity').onChange(val => {
      fillLight.intensity = val;
    });
    fLight.addColor(params, 'fillColor').name('Fill Light Color').onChange(val => fillLight.color.set(val));

    fLight.add(params, 'rimIntensity', 0.0, 4.0, 0.1).name('Rim Light Intensity').onChange(val => {
      rimLight.intensity = val;
    });
    fLight.addColor(params, 'rimColor').name('Rim Light Color').onChange(val => rimLight.color.set(val));

    fLight.add(params, 'underglowIntensity', 0.0, 4.0, 0.1).name('Underglow Intensity').onChange(val => {
      underglowLight.intensity = val;
    });
    fLight.addColor(params, 'underglowColor').name('Underglow Color').onChange(val => underglowLight.color.set(val));

    fLight.add(params, 'bagGlowIntensity', 0.5, 6.0, 0.1).name('Bag Glow Strength').onChange(val => {
      commuters.forEach(c => {
        c.bags.forEach(b => {
          b.mesh.userData.material.emissiveIntensity = val;
        });
      });
    });

    // 5. Post-Processing Suite Integration
    postProcessor.attachGUI(gui, 'PostProcessor Pipeline');

    // 6. Sound Effects (Ambient Escalator Drone)
    const fAudio = gui.addFolder('Atmospheric Audio');
    fAudio.add(params, 'audioMuted').name('Mute Audio').onChange(val => {
      if (!val && !audioCtx) initAudio();
      updateAudioVolume();
    });
    fAudio.add(params, 'audioVolume', 0.0, 1.0, 0.05).name('Drone Volume').onChange(() => updateAudioVolume());
    fAudio.close();

    // Toggle UI with "H" key
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
      if (e.key === 'h' || e.key === 'H') {
        if (gui._hidden) {
          gui.show();
        } else {
          gui.hide();
        }
      }
    });

    // =========================================================================
    // MAIN ANIMATION LOOP (Continuous, infinite, glitch-free)
    // =========================================================================
    const clock = new THREE.Clock();
    let globalStepOffset = 0;

    function animate() {
      requestAnimationFrame(animate);

      const delta = Math.min(clock.getDelta(), 0.1) * params.animSpeed;
      const elapsedTime = clock.getElapsedTime() * params.animSpeed;

      // 1. Advance Mechanical Steps & Commuters with identical synchronized speed
      const stepDelta = delta * 0.04;
      globalStepOffset += stepDelta;
      for (let i = 0; i < NUM_STEPS; i++) {
        const item = stepMeshes[i];
        const loopVal = (globalStepOffset + item.baseOffset) % 1.0;
        const p = getEscalatorPathPosition(loopVal);
        item.mesh.position.set(p.x, p.y, p.z);
      }

      // 2. Animate Background Clouds
      if (cloudsGroup.visible) {
        for (let i = 0; i < cloudInstances.length; i++) {
          const c = cloudInstances[i];
          c.group.position.x = c.baseX + Math.sin(elapsedTime * c.speedX + c.phase) * 2.2;
          c.group.position.y = c.baseY + Math.cos(elapsedTime * c.speedX * 0.7 + c.phase) * 1.2;
          c.group.rotation.y += c.rotSpeed * delta;
        }
      }

      // 3. Animate Commuters & Falling Star Trails
      for (let i = 0; i < commuters.length; i++) {
        const c = commuters[i];

        if (c.state === 'riding') {
          // Locked in 100% mechanical synchronization with the escalator step speed
          c.progress += stepDelta;

          // Smooth opacity animation from 0 to 100% as the person appears at the bottom
          if (c.progress < 0.14) {
            const t = c.progress / 0.14;
            c.opacity = t * t * (3 - 2 * t);
          } else {
            c.opacity = 1.0;
          }

          const pos = getEscalatorPathPosition(Math.min(c.progress, 1.0));
          c.figure.group.position.set(pos.x, pos.y, c.lateralZ);

          const breath = Math.sin(elapsedTime * 2.2 + i);

          if (c.progress >= 1.0) {
            // Reached top landing comb plate, step through portal and begin walking off
            c.state = 'walking_off';
            c.progress = 1.0;
          } else {
            // Gentle idling weight shift (feet stay firmly on floor level)
            c.figure.group.position.y = pos.y + Math.max(0, breath) * 0.015;
            c.figure.head.rotation.x = 0.16 + breath * 0.02;
          }

          // Position shopping bags in hands at natural hip height
          for (let b = 0; b < c.bags.length; b++) {
            const bag = c.bags[b];
            const bagPos = new THREE.Vector3(
              c.figure.group.position.x + bag.forwardOffset,
              c.figure.group.position.y + bag.heightOffset + breath * 0.02,
              c.figure.group.position.z + bag.sideOffset
            );
            bag.mesh.position.copy(bagPos);
            // Ensure shopping bags are upright with handle at top, only swinging gently with walking/riding cadence
            bag.mesh.rotation.set(0, 0, Math.sin(elapsedTime * 2.0 + b) * 0.05);

            // Clear any lingering trail mesh vertices while riding
            if (bag.trail.history.length > 0) {
              bag.trail.history.length = 0;
              const posAttr = bag.trail.geom.attributes.position;
              posAttr.array.fill(0);
              posAttr.needsUpdate = true;
            }
          }

          applyCommuterOpacity(c);

        } else if (c.state === 'walking_off') {
          c.opacity = 1.0;
          // Walking forward across the top landing plate through the concrete portal
          c.figure.group.position.x += delta * 1.6;
          c.figure.group.position.y = ESC_CONFIG.yEnd;

          const walkCycle = Math.sin(elapsedTime * 6.0 + i);
          c.figure.leftArm.rotation.x = -0.15 + walkCycle * 0.22;
          c.figure.rightArm.rotation.x = 0.15 - walkCycle * 0.22;

          // Stepping off the sudden edge where there is no floor!
          if (c.figure.group.position.x >= ESC_CONFIG.xEnd + 0.3) {
            c.state = 'falling';
            c.fallTime = 0;
            c.fallPos.copy(c.figure.group.position);
            c.fallVel.set(1.2 + Math.random() * 0.6, 0.0, (Math.random() - 0.5) * 0.35);
            c.fallRot.set(0.7 + Math.random() * 0.4, (Math.random() - 0.5) * 0.5, (Math.random() - 0.5) * 0.4);
          }

          for (let b = 0; b < c.bags.length; b++) {
            const bag = c.bags[b];
            bag.mesh.position.set(
              c.figure.group.position.x + bag.forwardOffset,
              c.figure.group.position.y + bag.heightOffset,
              c.figure.group.position.z + bag.sideOffset
            );
            bag.mesh.rotation.set(0, 0, Math.sin(elapsedTime * 5.0 + b) * 0.08);
          }

          applyCommuterOpacity(c);

        } else if (c.state === 'falling') {
          // Free-falling into the bottomless foggy abyss
          c.fallTime += delta;
          const gravity = -11.5;
          c.fallVel.y += gravity * delta;

          c.fallPos.x += c.fallVel.x * delta;
          c.fallPos.y += c.fallVel.y * delta;
          c.fallPos.z += c.fallVel.z * delta;

          c.figure.group.position.copy(c.fallPos);
          c.figure.group.rotation.z += c.fallRot.x * delta;
          c.figure.group.rotation.y += c.fallRot.y * delta;

          // Update falling bags and generate luminous chevron / star trails
          for (let b = 0; b < c.bags.length; b++) {
            const bag = c.bags[b];
            const lagX = -0.4 * Math.min(c.fallTime, 1.2);
            const lagY = 0.6 * Math.min(c.fallTime, 1.5);
            const bPos = new THREE.Vector3(
              c.fallPos.x + bag.forwardOffset + lagX,
              c.fallPos.y + bag.heightOffset + lagY,
              c.fallPos.z + bag.sideOffset
            );
            bag.mesh.position.copy(bPos);
            bag.mesh.rotation.x += delta * 4.5;
            bag.mesh.rotation.y += delta * 2.8;

            // Record trail history
            bag.trail.history.unshift(bPos.clone());
            if (bag.trail.history.length > TRAIL_HISTORY_MAX) {
              bag.trail.history.pop();
            }

            // Construct 3D Ribbon Quad Strip for thick, glowing trail
            const posAttr = bag.trail.geom.attributes.position;
            const colAttr = bag.trail.geom.attributes.color;
            const hLen = bag.trail.history.length;

            for (let k = 0; k < TRAIL_HISTORY_MAX; k++) {
              const i0 = k * 2;
              const i1 = k * 2 + 1;

              if (k < hLen) {
                const pt = bag.trail.history[k];
                const progressK = k / hLen;
                const widthK = (1.0 - progressK) * 0.16 + 0.02; // Taper from head to tail

                // Offset perpendicular to fall trajectory
                posAttr.setXYZ(i0, pt.x, pt.y + widthK, pt.z + widthK * 0.4);
                posAttr.setXYZ(i1, pt.x, pt.y - widthK, pt.z - widthK * 0.4);

                const fade = Math.pow(1.0 - progressK, 1.5) * c.opacity;
                const r = bag.trail.color.r * fade * 2.2;
                const g = bag.trail.color.g * fade * 2.2;
                const bCol = bag.trail.color.b * fade * 2.2;

                colAttr.setXYZ(i0, r, g, bCol);
                colAttr.setXYZ(i1, r, g, bCol);
              } else {
                if (hLen > 0) {
                  const lastPt = bag.trail.history[hLen - 1];
                  posAttr.setXYZ(i0, lastPt.x, lastPt.y, lastPt.z);
                  posAttr.setXYZ(i1, lastPt.x, lastPt.y, lastPt.z);
                } else {
                  posAttr.setXYZ(i0, 0, 0, 0);
                  posAttr.setXYZ(i1, 0, 0, 0);
                }
                colAttr.setXYZ(i0, 0, 0, 0);
                colAttr.setXYZ(i1, 0, 0, 0);
              }
            }
            posAttr.needsUpdate = true;
            colAttr.needsUpdate = true;
          }

          // Fade out into the deep fog
          if (c.fallPos.y < -12.0) {
            c.opacity = Math.max(0.0, (c.fallPos.y - (-25.0)) / 13.0);
          }

          applyCommuterOpacity(c);

          // Reset commuter seamlessly to bottom of escalator
          if (c.fallPos.y < -25.0 || c.opacity <= 0.01) {
            c.state = 'riding';
            c.progress = 0.0;
            c.opacity = 0.0;
            c.figure.group.rotation.set(0, 0, 0);

            // Re-align lateral position
            const isLeftRow = (i % 2 === 0);
            c.lateralZ = isLeftRow ? (0.45 + (i % 3) * 0.1) : (-0.45 - (i % 3) * 0.1);

            for (let b = 0; b < c.bags.length; b++) {
              c.bags[b].mesh.rotation.set(0, 0, 0);
              c.bags[b].trail.history.length = 0;
              const posAttr = c.bags[b].trail.geom.attributes.position;
              posAttr.array.fill(0);
              posAttr.needsUpdate = true;
              const colAttr = c.bags[b].trail.geom.attributes.color;
              colAttr.array.fill(0);
              colAttr.needsUpdate = true;
            }

            const p0 = getEscalatorPathPosition(0.0);
            c.figure.group.position.set(p0.x, p0.y, c.lateralZ);
            applyCommuterOpacity(c);
          }
        }
      }

      // 4. Update Camera Animation
      const activeAnim = CAMERA_PRESETS[params.cameraAnimation];
      if (activeAnim) {
        activeAnim(elapsedTime);
      }

      controls.update();

      // Render through PostProcessor Suite Pipeline
      postProcessor.renderScene(scene, camera);
    }

    animate();

    // =========================================================================
    // WINDOW RESIZE HANDLING
    // =========================================================================
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);
    });
  </script>
</body>
</html>
