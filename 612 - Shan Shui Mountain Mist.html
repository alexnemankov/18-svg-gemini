    /* ============================================================
       CSS Reset & Full Viewport UX
       ============================================================ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #505052;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "JetBrains Mono", monospace;
    }

    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      margin: 0;
      padding: 0;
      border: none;
      outline: none;
    }

    canvas {
      display: block;
      width: 100vw !important;
      height: 100vh !important;
      outline: none;
      border: none;
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }

       lil-gui Custom Glassmorphic Dark Aesthetic

      --string-color: #4ade80 !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "JetBrains Mono", monospace !important;
      border-radius: 10px !important;
      backdrop-filter: blur(20px) !important;
      -webkit-backdrop-filter: blur(20px) !important;
      border: 1px solid rgba(255, 255, 255, 0.12) !important;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.65) !important;
      margin-top: 14px;
      margin-right: 14px;
      z-index: 1000;
    }

    .lil-gui .title {
      font-weight: 700 !important;

      text-transform: uppercase !important;

    // ============================================================
    // Global Settings & Parameters
    // ============================================================
    const settings = {
      // Visual Theme
      colorScheme: 'Original',

      // Animation & Speed
      animSpeed: 1.5,
      clickToRandomize: true,

      // Mountain Geometry & Physics
      numMountains: 2,
      numRidgeLines: 60,
      noiseScale: 0.01,
      gravity: 0.04,
      strokeWidthMultiplier: 1.0,
      lineDashes: true,

      // Clouds & Boulders
      cloudDensity: 4,
      cloudPasses: 1,
      enableBoulders: false,
      boulderChance: 0.005,

      // Camera
      zoom: 1.0,

      // Actions
      regenerate: () => restartScene(true),
      randomizeTheme: () => randomizeAll(),
      resetCamera: () => resetCameraView(),
      saveSnapshot: () => saveCanvas('sumi_e_mountains_' + Date.now(), 'png')
    };

    // State Variables
    let currentTheme;
    let pg; // Offscreen p5.Graphics buffer
    let initialPoints = [];
    let currentPointIndex = 0;
    let previousPointIndex = -1;
    let isDone = false;
    let mountainFrameCount = 0; // Frame counter per mountain, resets when mountain restarts
    let gen; // Generator for progressive rendering
    let mtnX, mtnY;
    let index = 0;

    // Camera Pan & Zoom Transform State
    let panX = 0, panY = 0;
    let targetPanX = 0, targetPanY = 0;
    let zoomLevel = 1.0, targetZoom = 1.0;
    let isDragging = false;
    let dragStartX = 0, dragStartY = 0;
    let startPanX = 0, startPanY = 0;
    let totalDragDistance = 0;

    let gui = null;

    // Helper: Hex string to [r, g, b]
    function hexToRgb(hex) {
      let c = hex.replace('#', '');
      if (c.length === 3) c = c.split('').map(x => x + x).join('');
      let num = parseInt(c, 16);
      return [(num >> 16) & 255, (num >> 8) & 255, num & 255];
    }

    // Apply color scheme
    function applyColorScheme(schemeKey) {
      settings.colorScheme = schemeKey;
      currentTheme = COLOR_SCHEMES[schemeKey] || COLOR_SCHEMES['Original'];
      document.body.style.backgroundColor = currentTheme.bgColor;
    }

    // ============================================================
    // Core Sumi-e Generator Logic
    // ============================================================

    function setup() {
      const container = document.getElementById('canvas-container');
      const w = container ? (container.clientWidth || windowWidth) : windowWidth;
      const h = container ? (container.clientHeight || windowHeight) : windowHeight;

      let cnv = createCanvas(w, h);
      cnv.parent('canvas-container');

      // Prevent right-click context menu on canvas for smooth interaction
      cnv.elt.oncontextmenu = (e) => e.preventDefault();

      pg = createGraphics(w, h);

      applyColorScheme(settings.colorScheme);
      restartScene(false);
      initGUI();
    }

    function windowResized() {
      const container = document.getElementById('canvas-container');
      const w = container ? (container.clientWidth || windowWidth) : windowWidth;
      const h = container ? (container.clientHeight || windowHeight) : windowHeight;
      resizeCanvas(w, h);
    }

    function restartScene(recreateBuffer = false) {
      if (recreateBuffer || !pg || pg.width !== width || pg.height !== height) {
        pg = createGraphics(width, height);
      }

      noiseSeed(Math.floor(Math.random() * 1000000));
      randomSeed(Math.floor(Math.random() * 1000000));

      currentPointIndex = 0;
      previousPointIndex = -1;
      mountainFrameCount = 0;
      isDone = false;
      index = 0;

      mtnX = [pg.width / 3, (2 * pg.width) / 3];
      mtnY = [pg.height / 20, pg.height / 2];

      pg.clear();
      generateInitialPoints();
      gen = drawScene();
    }

    function generateInitialPoints() {
      let numPoints = settings.numMountains; // default 2, configurable or randomized
      let minDistance = max(pg.width, pg.height) / 6;
      let attempts = 0;
      let maxAttempts = 1000;

      initialPoints = [];
      index = 0;

      while (initialPoints.length < numPoints && attempts < maxAttempts) {
        let px = (index < mtnX.length) ? mtnX[index] : random(pg.width * 0.15, pg.width * 0.85);
        let py = (index < mtnY.length) ? mtnY[index] : random(pg.height * 0.05, pg.height * 0.6);

        let newPoint = {
          x: px,
          y: py,
          vx: 0,
          vy: 0,
          previousX: 0,
        };
        index += 1;
        newPoint.previousX = newPoint.x;

        // Check if point is far enough from existing points
        let valid = true;
        for (let existingPoint of initialPoints) {
          let d = dist(newPoint.x, newPoint.y, existingPoint.x, existingPoint.y);
          if (d < minDistance) {
            valid = false;
            break;
          }
        }

        if (valid) {
          initialPoints.push(newPoint);
        }

        attempts++;
      }
      // Sort points by y position
      initialPoints = initialPoints.sort((a, b) => a.y - b.y);
    }

    function edgeBiasedRandom(centerMin = 0.3) {
      while (true) {
        const u = Math.random(); // candidate value in [0, 1]
        const y = Math.random(); // threshold in [0, 1]

        // Parabolic weight: max 1 at edges, min `centerMin` at center
        const w = centerMin + (1 - centerMin) * 4 * Math.pow(u - 0.5, 2);

        if (y < w) {
          return u; // accepted
        }
        // else: reject and try again
      }
    }

    function updateParticle(point) {
      if (point.y >= pg.height) return;

      // Calculate noise detail based on y position
      let yNorm = point.y / pg.height;
      let nDetail = map(yNorm, 0, 1, 0.01, 1.5);

      // Get noise values based on position and frame
      let noiseX = noise(
        point.x * settings.noiseScale,
        point.y * settings.noiseScale,
        mountainFrameCount * 0.01,
      );
      let noiseY = noise(
        point.x * settings.noiseScale + 100,
        point.y * settings.noiseScale + 100,
        mountainFrameCount * 0.01,
      );

      // Map noise to angle and magnitude
      let angle = map(noiseX, 0, 1, -PI, PI);
      let normalizedX = abs(noiseY - 0.5) * 2;
      normalizedX = normalizedX ** 2.5;
      normalizedX = (1 - normalizedX) * (noiseY > 0.5 ? 1 : -1);
      let magnitude = normalizedX * nDetail;

      // Apply noise-based force
      point.vx += cos(angle) * magnitude * 0.3;
      point.vy += sin(angle) * magnitude * 0.2;

      // Apply gravity
      point.vy += settings.gravity;

      // Update position
      point.x += point.vx;
      point.y += point.vy;

      // Apply damping
      point.vx *= 0.95;
      point.vy *= 0.95;
    }

    function handleMountainTransition() {
      // Check if point reached limits and switch to next
      let mPoint = initialPoints[currentPointIndex];
      if (!mPoint) {
        isDone = true;
        return false;
      }

      if (mPoint.x < -pg.width / 4 || mPoint.x > (pg.width * 5) / 4 || mPoint.y >= pg.height) {
        currentPointIndex = currentPointIndex + 1;
        if (currentPointIndex >= initialPoints.length) {
          isDone = true;
        }
      }

      // Check if this is a new point
      let isNewPoint = currentPointIndex !== previousPointIndex;

      // Reset frame counter when starting a new mountain
      if (isNewPoint) {
        mountainFrameCount = 0;
      }

      // Increment frame counter
      mountainFrameCount++;

      // Add semi-transparent white overlay between mountain layers
      // if (isNewPoint && currentPointIndex > 0) {
      //   fill(255, 255, 255, 255 * random(0.05, 0.1))
      //   noStroke()
      //   rect(0, 0, width, height)
      // }

      previousPointIndex = currentPointIndex;
      return isNewPoint;
    }

    function generateAngles(T, minAngle, maxAngle, numLines = 60) {
      let angles = [];
      for (let i = 0; i < numLines; i++) {
        let r = edgeBiasedRandom(0.2);
        let angle = map(r, 0, 1, minAngle, maxAngle);
        let a = angle < T ? map(angle, PI / 8, T, PI / 6, T) : angle;
        angles.push(a);
      }
      angles.sort((a, b) => a - b);
      return angles;
    }

    function maybeDrawBoulder(point, x, y, angle, T, maxAngle) {
      if (!settings.enableBoulders) return;
      if (angle < T || abs(angle - maxAngle) <= PI / 50) return;

      // Use noise to create clusters
      let noiseScaleVal = 10;
      let mountainOffset = currentPointIndex * 100;
      let noiseValue = noise(x * noiseScaleVal, y * noiseScaleVal, mountainOffset);

      // Threshold for clustering
      let noiseThreshold = 0.7;
      let noiseChance =
        noiseValue > noiseThreshold ?
        (noiseValue - noiseThreshold) / (1 - noiseThreshold) :
        0;

      // Combine noise-based chance with random chance
      let randomChance = settings.boulderChance;
      let totalChance = noiseChance * 0.1 + randomChance;

      if (random() < totalChance) {
        // Calculate size based on distance from origin
        let distFromOrigin = dist(point.x, point.y, x, y);
        let maxDist = sqrt(pg.width * pg.width + pg.height * pg.height);
        let normalizedDist = distFromOrigin / maxDist;
        let objectSize = map(normalizedDist, 0, 1, 0.3, 1.0);

        drawBoulder(x, y, objectSize);
      }
    }

    function drawSegmentedLine(
      point,
      angle,
      capturePath,
      T,
      midAngle,
      maxAngle,
      lineIndex,
    ) {
      if (settings.lineDashes) {
        pg.drawingContext.setLineDash([
          random(20, 40),
          random(5, 10),
          random(20, 40),
          random(5, 10),
          random(20, 40),
          random(5, 10),
        ]);
      } else {
        pg.drawingContext.setLineDash([]);
      }

      // Color calculation
      if (settings.colorScheme === 'Original') {
        // Color: black if angle < T, gray otherwise
        let dark = map(point.y, 0, (3 * pg.height) / 4, 255, 0);
        if (angle < T) {
          pg.stroke(dark + random(-30, 30));
        } else {
          pg.stroke(dark + 50 + random(-25, 25));
        }
      } else {
        let darkFactor = map(point.y, 0, (3 * pg.height) / 4, 1.0, 0.25, true);
        if (angle < T) {
          let c = currentTheme.mountainShadeDark;
          let jit = random(-18, 18);
          pg.stroke(
            constrain(c[0] * darkFactor + jit, 0, 255),
            constrain(c[1] * darkFactor + jit, 0, 255),
            constrain(c[2] * darkFactor + jit, 0, 255),
            230
          );
        } else {
          let c = currentTheme.mountainShadeLight;
          let jit = random(-20, 20);
          pg.stroke(
            constrain(c[0] * darkFactor + jit, 0, 255),
            constrain(c[1] * darkFactor + jit, 0, 255),
            constrain(c[2] * darkFactor + jit, 0, 255),
            240
          );
        }
      }

      let currentX = point.x;
      let currentY = point.y;
      let currentAngle = angle;
      let segmentIndex = 0;
      let totalLength = 0;
      let path = capturePath ? [{
        x: currentX,
        y: currentY
      }] : null;

      while (true) {
        // Check if starting point is outside canvas
        if (
          currentX < -pg.width / 4 ||
          currentX > (pg.width * 5) / 4 ||
          currentY < 0 ||
          currentY > pg.height
        ) {
          break;
        }
        let startsw = map(currentX, 0, pg.height, 0.5, 1, true);
        let sw = map(totalLength, 0, 250, 0.1 * startsw, 1.25 * startsw, true);
        if (angle < T) {
          sw = sw * 2;
        }
        pg.strokeWeight(sw * settings.strokeWidthMultiplier);

        // Calculate segment parameters based on distance from center
        let distToCenter = abs(currentAngle - midAngle);
        let minSegmentLength = map(distToCenter, 0, PI / 2, 10, 20);
        let maxSegmentLength = map(distToCenter, 0, PI / 2, 40, 80);
        let noiseRotationScale = map(distToCenter, 0, PI / 2, 0.1, 0.001);
        let rotationScale = map(distToCenter, 0, PI / 2, 5, 0.5);

        let segmentLength = random(minSegmentLength, maxSegmentLength);
        let nextX = currentX + cos(currentAngle) * segmentLength;
        let nextY = currentY + sin(currentAngle) * segmentLength;

        // Draw segment with random jitter
        let offsetX = random(-2, 6);
        let offsetY = random(-5, 5);
        pg.line(currentX, currentY, nextX + offsetX, nextY + offsetY);

        // Maybe draw boulder on white side
        if (settings.enableBoulders && angle >= T) {
          maybeDrawBoulder(
            point,
            nextX + offsetX,
            nextY + offsetY,
            angle,
            T,
            maxAngle,
          );
        }

        // Capture path point
        if (path) {
          path.push({
            x: nextX,
            y: nextY
          });
        }

        totalLength += segmentLength;
        currentX = nextX;
        currentY = nextY;

        // Apply noise-based rotation
        let noiseValue = noise(
          currentX * noiseRotationScale,
          currentY * noiseRotationScale,
          currentPointIndex * 0.1 + lineIndex * 0.01 + segmentIndex * 0.05,
        );
        let rotation =
          (map(noiseValue, 0, 1, -rotationScale, rotationScale) * PI) / 180;
        currentAngle += rotation;
        currentAngle = constrain(currentAngle, 0, PI);
        segmentIndex++;
      }

      return path;
    }

    function extendPathToEdge(path, angle, isRightEdge) {
      if (!path || path.length < 2) {
        return {
          x: (path && path[0]) ? path[0].x : 0,
          y: (path && path[0]) ? path[0].y : 0
        };
      }

      let last = path[path.length - 1];
      let dir = atan2(
        last.y - path[path.length - 2].y,
        last.x - path[path.length - 2].x,
      );

      let edgeX = isRightEdge ? (pg.width * 5) / 4 : -pg.width / 4;
      let edgeY = last.y;

      if (abs(cos(dir)) > 0.001) {
        edgeY = last.y + tan(dir) * (edgeX - last.x);
        if (edgeY < 0) {
          edgeY = 0;
          edgeX = last.x + (edgeY - last.y) / tan(dir);
        } else if (edgeY > pg.height) {
          edgeY = pg.height;
          edgeX = last.x + (edgeY - last.y) / tan(dir);
        }
      } else {
        edgeY = pg.height;
      }

      return {
        x: edgeX,
        y: edgeY
      };
    }

    function drawMountainPolygon(point, lowestPath, highestPath, angles) {
      // Extend paths to canvas edges
      let rightEdge = extendPathToEdge(lowestPath, angles[0], true);
      let leftEdge = extendPathToEdge(highestPath, angles[angles.length - 1], false);

      // Create polygon
      let polygon = [];
      polygon.push({
        x: point.x,
        y: point.y
      });
      for (let p of lowestPath) polygon.push(p);
      polygon.push({
        x: rightEdge.x,
        y: rightEdge.y
      });
      polygon.push({
        x: rightEdge.x,
        y: pg.height
      });
      polygon.push({
        x: leftEdge.x,
        y: pg.height
      });
      polygon.push({
        x: leftEdge.x,
        y: leftEdge.y
      });
      for (let i = highestPath.length - 1; i >= 0; i--) {
        polygon.push(highestPath[i]);
      }

      // Create conic gradient
      let lowestAngle = angles[0];
      let highestAngle = angles[angles.length - 1];
      let gradient;

      if (typeof pg.drawingContext.createConicGradient === 'function') {
        gradient = pg.drawingContext.createConicGradient(
          lowestAngle,
          point.x,
          point.y,
        );

        let angleRange = highestAngle - lowestAngle;
        let highestOffset = constrain(angleRange / (2 * PI), 0.01, 0.99);

        if (settings.colorScheme === 'Original') {
          gradient.addColorStop(0, "#000000");
          gradient.addColorStop(highestOffset, "#FFFFFF");
          gradient.addColorStop(1, "#000000");
        } else {
          gradient.addColorStop(0, currentTheme.mountainGrad0);
          gradient.addColorStop(highestOffset, currentTheme.mountainGradMid);
          gradient.addColorStop(1, currentTheme.mountainGrad1);
        }

        pg.drawingContext.fillStyle = gradient;
      } else {
        pg.fill(80);
      }

      pg.noStroke();
      pg.beginShape();
      for (let v of polygon) {
        pg.vertex(v.x, v.y);
      }
      pg.endShape(CLOSE);

      // Reset fill style
      pg.drawingContext.fillStyle = "rgba(0, 0, 0, 0)";
      pg.noFill();
    }

    function* drawClouds(density = 4, passes = 1, perFrame = 50) {
      // density: how many strokes per cell (1 = original-ish, 2 = twice as dense, etc.)
      // passes: how many times to redraw the whole cloud field (subtle build-up)
      // perFrame: how many cells to process before yielding

      const baseR = currentTheme.cloudRgb[0];
      const baseG = currentTheme.cloudRgb[1];
      const baseB = currentTheme.cloudRgb[2];
      const _step = 5;
      let counter = 0;

      for (let p = 0; p < passes; p++) {
        const begin = random(50); // each pass shifts the noise

        let i = 0;
        for (let x = 0; x < pg.width; x += _step) {
          let j = 0;

          for (let y = 0; y < (pg.height * 2) / 3; y += _step) {
            const alphaMax = map(y, 0, (pg.height * 2) / 3, 255, 0);
            let n = noise(begin + i, begin + j);
            let alphaBase = map(n, 0.3, 1, 0, alphaMax);
            alphaBase = constrain(alphaBase, 0, 255);

            if (alphaBase > 5) {
              // Draw several strokes in this cell to increase density
              for (let k = 0; k < density; k++) {
                const _alpha = alphaBase * random(0.5, 1.0);

                let brightnessJitter = random(-10, 10);
                if (random() < 0.05) {
                  brightnessJitter = random(-30, -80);
                }
                const r = constrain(baseR + brightnessJitter, 0, 255);
                const g = constrain(baseG + brightnessJitter, 0, 255);
                const b = constrain(baseB + brightnessJitter, 0, 255);

                pg.strokeWeight(random(0.5, 3));
                pg.stroke(r, g, b, _alpha);

                const len = random(10, 20);
                const angle = random(-PI / 10, PI / 10);

                const x1 = x + random(-5, 5);
                const y1 = y + random(-5, 5);
                const x2 = x1 + cos(angle) * len;
                const y2 = y1 + sin(angle) * len;
                pg.line(x1, y1, x2, y2);

                // occasional crosshatch stroke
                if (random() < 0.5) {
                  pg.stroke(r, g, b, _alpha * 0.4);
                  const angle2 = angle + random(-PI / 3, PI / 3);
                  const x3 = x1 + cos(angle2) * (len * 0.6);
                  const y3 = y1 + sin(angle2) * (len * 0.6);
                  pg.line(x1, y1, x3, y3);
                }
              }
            }

            j += 0.06;
            counter++;

            // Yield periodically to show progress
            if (counter % perFrame === 0) {
              yield 1;
            }
          }

          i += 0.01;
        }
      }
    }

    function drawGradientBackground() {
      // Create linear gradient from almost white at top to background color at middle
      let midPoint = pg.height / 2; // Middle of canvas

      let gradient = pg.drawingContext.createLinearGradient(0, 0, 0, midPoint);
      gradient.addColorStop(0, currentTheme.skyTop);
      gradient.addColorStop(1, currentTheme.skyMid);

      pg.drawingContext.fillStyle = gradient;
      pg.drawingContext.fillRect(0, 0, pg.width, midPoint);

      // Fill rest with background color
      pg.fill(currentTheme.skyBottom);
      pg.noStroke();
      pg.rect(0, midPoint, pg.width, pg.height - midPoint);

      // Reset fill style
      pg.drawingContext.fillStyle = "rgba(0, 0, 0, 0)";
    }

    function drawBoulder(x, y, size = 1.0) {
      if (!settings.enableBoulders) return;
      pg.push();
      pg.translate(x, y);
      pg.scale(1, -1);
      pg.rotate(random(-PI / 6, PI / 6));
      let baseSize = random(5, 30) * size;
      let deltas = [2 * size, 5 * size];
      let bc = currentTheme.boulderRgb || [100, 100, 100];
      pg.fill(
        constrain(bc[0] + random(-20, 20), 0, 255),
        constrain(bc[1] + random(-20, 20), 0, 255),
        constrain(bc[2] + random(-20, 20), 0, 255),
        200
      );
      pg.noStroke();
      // pg.stroke(random(60, 120))
      // pg.noFill()
      pg.beginShape();
      let angle = 0;
      for (; angle < PI; angle += random(PI / 10, PI / 5)) {
        let cx = baseSize * cos(angle);
        let cy = baseSize * sin(angle) * 0.5;
        pg.vertex(cx + random(...deltas), cy + random(...deltas));
      }
      // Now backwards from the last angle to 0
      for (; angle > 0; angle -= random(PI / 10, PI / 5)) {
        let cx = baseSize * cos(angle);
        let cy = baseSize * sin(angle) * 0.5;
        pg.vertex(cx - random(...deltas), cy - random(...deltas));
      }
      pg.endShape(CLOSE);
      pg.pop();
    }

    function* drawScene() {
      // Draw gradient background first
      drawGradientBackground();

      // Draw clouds progressively
      let cloudGen = drawClouds(settings.cloudDensity, settings.cloudPasses, round(pg.width / 4));
      for (let _ of cloudGen) {
        yield 1;
      }

      // Then draw mountains progressively
      while (!isDone) {
        // Get current point
        let mPoint = initialPoints[currentPointIndex];
        if (!mPoint) {
          isDone = true;
          break;
        }

        // Update particle physics
        updateParticle(mPoint);

        // Handle mountain transitions
        let isNewPoint = handleMountainTransition();

        // Get current point (may have changed)
        mPoint = initialPoints[currentPointIndex];
        if (!mPoint) {
          isDone = true;
          break;
        }

        // Calculate angle T and generate angles
        let T = PI / 2 + map(noise(mountainFrameCount * 0.02), 0, 1, -PI / 6, PI / 6);
        let minAngle = map(mountainFrameCount, 0, 400, PI / 3, PI / 9, true);
        let maxAngle = PI - minAngle / 2;
        let midAngle = (minAngle + maxAngle) / 2;
        let angles = generateAngles(T, minAngle, maxAngle, settings.numRidgeLines);

        // Capture paths on first frame
        let lowestPath = null;
        let highestPath = null;
        let capturePaths = isNewPoint;

        // Draw lines emanating from current point, yielding periodically
        for (let i = 0; i < angles.length; i++) {
          let a = angles[i];
          let isLowest = i === 0;
          let isHighest = i === angles.length - 1;

          let path = drawSegmentedLine(
            mPoint,
            a,
            capturePaths && (isLowest || isHighest),
            T,
            midAngle,
            maxAngle,
            i,
          );

          // Store captured paths
          if (capturePaths) {
            if (isLowest) {
              lowestPath = path;
            } else if (isHighest) {
              highestPath = path;
            }
          }
        }

        // Draw polygon on first frame
        if (capturePaths && lowestPath && highestPath) {
          drawMountainPolygon(mPoint, lowestPath, highestPath, angles);
        }

        if (mountainFrameCount % 4 === 0) {
          yield 1;
        }
      }

      yield 1;
    }

    // ============================================================
    // Main Display & Viewport Render Loop
    // ============================================================
    function draw() {
      // 1. Advance progressive generation based on animation speed
      if (!isDone && gen && settings.animSpeed > 0) {
        let stepsToRun = Math.max(1, Math.round(settings.animSpeed * 3));
        for (let s = 0; s < stepsToRun; s++) {
          let v = gen.next();
          if (v.done) {
            isDone = true;
            break;
          }
        }
      }

      // 2. Smooth camera pan and zoom interpolation
      panX = lerp(panX, targetPanX, 0.16);
      panY = lerp(panY, targetPanY, 0.16);
      zoomLevel = lerp(zoomLevel, targetZoom, 0.16);
      settings.zoom = parseFloat(zoomLevel.toFixed(2));

      // 3. Render viewport with camera transforms
      background(currentTheme.bgColor || '#505052');

      push();
      translate(width / 2 + panX, height / 2 + panY);
      scale(zoomLevel);
      translate(-pg.width / 2, -pg.height / 2);
      image(pg, 0, 0);
      pop();
    }

    // ============================================================
    // Interactive Controls (Zoom with Wheel & Pan with Drag)
    // ============================================================
    function mouseWheel(event) {
      if (event.target && event.target.closest && event.target.closest('.lil-gui')) {
        return;
      }

      const zoomFactor = event.deltaY < 0 ? 1.09 : 0.91;
      const newZoom = constrain(targetZoom * zoomFactor, 0.15, 12.0);

      // Cursor-anchored smooth zoom
      const mx = mouseX - width / 2;
      const my = mouseY - height / 2;
      targetPanX = mx - (mx - targetPanX) * (newZoom / targetZoom);
      targetPanY = my - (my - targetPanY) * (newZoom / targetZoom);
      targetZoom = newZoom;

      return false; // Prevent page scroll
    }

    function mousePressed(event) {
      if (event.target && event.target.closest && event.target.closest('.lil-gui')) {
        return;
      }
      isDragging = true;
      dragStartX = mouseX;
      dragStartY = mouseY;
      startPanX = targetPanX;
      startPanY = targetPanY;
      totalDragDistance = 0;
    }

    function mouseDragged(event) {
      if (!isDragging) return;
      if (event.target && event.target.closest && event.target.closest('.lil-gui')) {
        return;
      }
      const dx = mouseX - dragStartX;
      const dy = mouseY - dragStartY;
      totalDragDistance = Math.hypot(dx, dy);
      targetPanX = startPanX + dx;
      targetPanY = startPanY + dy;
    }

    function mouseReleased(event) {
      if (!isDragging) return;
      isDragging = false;

      // Pure click detection (distance moved < 6px) triggers procedural theme randomizer
      if (totalDragDistance < 6) {
        if (settings.clickToRandomize) {
          randomizeAll();
        }
      }
    }

    // Touch Support for Mobile & Tablet Devices
    function touchStarted(event) {
      if (event.target && event.target.closest && event.target.closest('.lil-gui')) {
        return;
      }
      if (touches.length === 1) {
        isDragging = true;
        dragStartX = touches[0].x;
        dragStartY = touches[0].y;
        startPanX = targetPanX;
        startPanY = targetPanY;
        totalDragDistance = 0;
      }
    }

    function touchMoved(event) {
      if (!isDragging) return;
      if (event.target && event.target.closest && event.target.closest('.lil-gui')) {
        return;
      }
      if (touches.length === 1) {
        const dx = touches[0].x - dragStartX;
        const dy = touches[0].y - dragStartY;
        totalDragDistance = Math.hypot(dx, dy);
        targetPanX = startPanX + dx;
        targetPanY = startPanY + dy;
        return false;
      }
    }

    function touchEnded(event) {
      if (!isDragging) return;
      isDragging = false;
      if (totalDragDistance < 8 && settings.clickToRandomize) {
        randomizeAll();
      }
    }

    function resetCameraView() {
      targetPanX = 0;
      targetPanY = 0;
      targetZoom = 1.0;
    }

    // Keyboard Shortcuts
    function keyPressed(e) {
      if (e && e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) {
        return;
      }

      // Key 'S' or 's': Save PNG snapshot
      if (keyCode === 83 || key === 's' || key === 'S') {
        saveCanvas('sumi_e_mountains_' + Date.now(), 'png');
      }
      // Spacebar: Randomize or regenerate
      if (keyCode === 32) {
        if (settings.clickToRandomize) {
          randomizeAll();
        } else {
          restartScene(true);
        }
        return false;
      }
      // Key 'R' or 'r': Reset camera view
      if (keyCode === 82 || key === 'r' || key === 'R') {
        resetCameraView();
      }
    }

    // ============================================================
    // Randomization Engine
    // ============================================================
    function randomizeAll() {
      const keys = Object.keys(COLOR_SCHEMES);
      const randomKey = keys[Math.floor(Math.random() * keys.length)];

      applyColorScheme(randomKey);

      // Randomize geometric parameters
      settings.noiseScale = parseFloat((random(0.006, 0.016)).toFixed(4));
      settings.gravity = parseFloat((random(0.02, 0.06)).toFixed(3));
      settings.numRidgeLines = Math.floor(random(45, 80));
      settings.numMountains = Math.floor(random(2, 4));
      settings.cloudDensity = Math.floor(random(3, 6));
      settings.strokeWidthMultiplier = parseFloat((random(0.7, 1.4)).toFixed(2));
      settings.enableBoulders = Math.random() < 0.35;
      settings.boulderChance = parseFloat((random(0.003, 0.015)).toFixed(4));

      // Update lil-gui controls display
      if (gui) {
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      }

      restartScene(true);
    }

    // ============================================================
    // lil-gui Controller Setup
    // ============================================================
    function initGUI() {
      if (gui) {
        gui.destroy();
      }

      gui = new lil.GUI({ title: 'Sumi-e Mountain Mist' });

      // Theme & Color Palette
      const fTheme = gui.addFolder('Palette & Theme');
      fTheme.add(settings, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Color Scheme').onChange((val) => {
        applyColorScheme(val);
        restartScene(false);
      });

      // Animation & Interaction
      const fAnim = gui.addFolder('Animation & Interaction');
      fAnim.add(settings, 'animSpeed', 0.1, 8.0, 0.1).name('Painting Speed');
      fAnim.add(settings, 'clickToRandomize').name('Click to Randomize');
      fAnim.add(settings, 'regenerate').name('↺ Regenerate');
      fAnim.add(settings, 'randomizeTheme').name('🎲 Randomize All');

      // Mountain Geometry & Physics
      const fGeo = gui.addFolder('Ridge Geometry');
      fGeo.add(settings, 'numMountains', 1, 5, 1).name('Mountains Count').onFinishChange(() => restartScene(false));
      fGeo.add(settings, 'numRidgeLines', 20, 100, 1).name('Ridge Line Count').onFinishChange(() => restartScene(false));
      fGeo.add(settings, 'noiseScale', 0.002, 0.025, 0.001).name('Noise Scale').onFinishChange(() => restartScene(false));
      fGeo.add(settings, 'gravity', 0.01, 0.10, 0.005).name('Gravity Force').onFinishChange(() => restartScene(false));
      fGeo.add(settings, 'strokeWidthMultiplier', 0.4, 2.5, 0.1).name('Stroke Width').onFinishChange(() => restartScene(false));
      fGeo.add(settings, 'lineDashes').name('Dashed Strokes').onChange(() => restartScene(false));

      // Clouds & Atmosphere
      const fClouds = gui.addFolder('Atmosphere & Mist');
      fClouds.add(settings, 'cloudDensity', 1, 8, 1).name('Cloud Density').onFinishChange(() => restartScene(false));
      fClouds.add(settings, 'cloudPasses', 1, 3, 1).name('Cloud Passes').onFinishChange(() => restartScene(false));
      fClouds.add(settings, 'enableBoulders').name('Enable Boulders').onChange(() => restartScene(false));
      fClouds.add(settings, 'boulderChance', 0.001, 0.03, 0.001).name('Boulder Chance').onFinishChange(() => restartScene(false));

      // Camera & Viewport
      const fCam = gui.addFolder('Camera & Viewport');
      fCam.add(settings, 'zoom', 0.2, 8.0, 0.01).name('Zoom Level').listen().onChange((val) => {
        targetZoom = val;
      });
      fCam.add(settings, 'resetCamera').name('Reset View');
      fCam.add(settings, 'saveSnapshot').name('📷 Save Snapshot');

      fTheme.open();
      fAnim.open();
    }
  </script>
</body>
