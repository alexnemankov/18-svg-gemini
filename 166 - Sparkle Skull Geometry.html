<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>166 - Sparkle Geometry & SVG Sampling</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
    }
  </style>

  <script type="x-shader/x-vertex" id="vertexshader">
    attribute float size;
    attribute vec3 color;
    attribute float fade;

    varying vec3 vColor;

    void main() {
      vColor = color;
      vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = size;
      gl_Position = projectionMatrix * mvPosition;
    }
  </script>

  <script type="x-shader/x-fragment" id="fragmentshader">
    uniform sampler2D pointTexture;
    varying vec3 vColor;
    void main() {
      gl_FragColor = vec4(vColor, 1.0);
      gl_FragColor = gl_FragColor * texture2D(pointTexture, gl_PointCoord);
    }
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
    }
  }
  </script>
</head>
<body>
  <input type="file" id="svg-file-input" accept=".svg" style="display: none;" />

  <script type="module">
    import * as THREE from 'three';
    import { TrackballControls } from 'three/addons/controls/TrackballControls.js';
    import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
    import { SVGLoader } from 'three/addons/loaders/SVGLoader.js';
    import { MeshSurfaceSampler } from 'three/addons/math/MeshSurfaceSampler.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { GUI } from 'lil-gui';

    console.clear();

    const colorPresets = {
      "Cyberpunk Neon": {
        c1: "#CFD6DE",
        c2: "#1EE3CF",
        c3: "#6B48FF",
        c4: "#125D98",
        galaxy: "#6B48FF",
        bg: "#000000"
      },
      "Golden Emerald": {
        c1: "#FFD700",
        c2: "#50C878",
        c3: "#00FF7F",
        c4: "#DAA520",
        galaxy: "#50C878",
        bg: "#020f08"
      },
      "Cosmic Aurora": {
        c1: "#FF007F",
        c2: "#7928CA",
        c3: "#00DFD8",
        c4: "#FF0080",
        galaxy: "#00DFD8",
        bg: "#090014"
      },
      "Solar Flare": {
        c1: "#FF4500",
        c2: "#FF8C00",
        c3: "#FFD700",
        c4: "#FF1493",
        galaxy: "#FF4500",
        bg: "#140400"
      },
      "Ghostly Silver": {
        c1: "#FFFFFF",
        c2: "#E0E6ED",
        c3: "#8A99AD",
        c4: "#4A5568",
        galaxy: "#8A99AD",
        bg: "#080c14"
      }
    };

    const params = {
      colorScheme: "Cyberpunk Neon",
      greenscreen: false,
      bgColor: "#000000",
      color1: "#CFD6DE",
      color2: "#1EE3CF",
      color3: "#6B48FF",
      color4: "#125D98",
      galaxyColor: "#6B48FF",
      bloomStrength: 0.6,
      pixelRatio: 2,
      animSpeed: 1.0,
      animationPreset: "Gentle Orbit",
      uploadSVG: () => document.getElementById("svg-file-input").click(),
      resetModel: () => loadDefaultSkull()
    };

    let colors = [
      new THREE.Color(params.color1),
      new THREE.Color(params.color2),
      new THREE.Color(params.color3),
      new THREE.Color(params.color4)
    ];

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(params.bgColor);

    const camera = new THREE.PerspectiveCamera(
      60,
      window.innerWidth / window.innerHeight,
      0.001,
      1000
    );
    camera.position.z = 2.7;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(params.pixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const renderScene = new RenderPass(scene, camera);

    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      1.5,
      0.4,
      0.85
    );
    bloomPass.threshold = 0;
    bloomPass.strength = params.bloomStrength;

    const composer = new EffectComposer(renderer);
    composer.setPixelRatio(params.pixelRatio);
    composer.addPass(renderScene);
    composer.addPass(bloomPass);

    const controls = new TrackballControls(camera, renderer.domElement);
    controls.noPan = false;
    controls.noZoom = false;
    controls.rotateSpeed = 1.5;
    controls.zoomSpeed = 1.2;
    controls.panSpeed = 0.8;
    controls.maxDistance = 6.0;
    controls.minDistance = 0.3;

    const group = new THREE.Group();
    scene.add(group);

    const sparkles = [];
    const sparklesGeometry = new THREE.BufferGeometry();
    const sparklesMaterial = new THREE.ShaderMaterial({
      uniforms: {
        pointTexture: {
          value: new THREE.TextureLoader().load(
            "https://assets.codepen.io/127738/dotTexture.png"
          )
        }
      },
      vertexShader: document.getElementById("vertexshader").textContent,
      fragmentShader: document.getElementById("fragmentshader").textContent,
      blending: THREE.AdditiveBlending,
      alphaTest: 1.0,
      transparent: true
    });
    const points = new THREE.Points(sparklesGeometry, sparklesMaterial);
    group.add(points);

    let sampler = null;
    const lines = [];
    let currentMesh = null;
    let defaultSkullObj = null;

    function updateColors() {
      colors[0].set(params.color1);
      colors[1].set(params.color2);
      colors[2].set(params.color3);
      colors[3].set(params.color4);

      lines.forEach((l, i) => {
        if (l.material) {
          l.material.color.copy(colors[i % 4]);
        }
      });

      updateGalaxyColors();
      updateBackground();
    }

    function updateBackground() {
      if (params.greenscreen) {
        scene.background = new THREE.Color("#00ff00");
        renderer.setClearColor("#00ff00", 1);
      } else {
        scene.background = new THREE.Color(params.bgColor);
        renderer.setClearColor(params.bgColor, 1);
      }
    }

    function applyColorScheme(schemeName) {
      const scheme = colorPresets[schemeName];
      if (!scheme) return;

      params.color1 = scheme.c1;
      params.color2 = scheme.c2;
      params.color3 = scheme.c3;
      params.color4 = scheme.c4;
      params.galaxyColor = scheme.galaxy;
      params.bgColor = scheme.bg;

      updateColors();

      gui.controllers.concat(gui.folders.flatMap(f => f.controllers)).forEach(c => c.updateDisplay());
    }

    function dots() {
      if (!currentMesh) return;

      lines.forEach((l) => {
        group.remove(l);
        if (l.geometry) l.geometry.dispose();
        if (l.material) l.material.dispose();
      });
      lines.length = 0;

      sparkles.length = 0;
      sparklesGeometry.setAttribute("position", new THREE.Float32BufferAttribute([], 3));
      sparklesGeometry.setAttribute("color", new THREE.Float32BufferAttribute([], 3));
      sparklesGeometry.setAttribute("size", new THREE.Float32BufferAttribute([], 1));

      sampler = new MeshSurfaceSampler(currentMesh).build();

      for (let i = 0; i < 8; i++) {
        const linesMaterial = new THREE.LineBasicMaterial({
          color: colors[i % 4],
          transparent: true,
          opacity: 1
        });
        const linesMesh = new THREE.Line(new THREE.BufferGeometry(), linesMaterial);
        linesMesh.coordinates = [];
        linesMesh.previous = null;
        lines.push(linesMesh);
        group.add(linesMesh);
      }
    }

    function loadDefaultSkull() {
      if (defaultSkullObj) {
        currentMesh = defaultSkullObj;
        dots();
        return;
      }
      const loader = new OBJLoader();
      loader.load(
        "https://assets.codepen.io/127738/skull_model.obj",
        (obj) => {
          defaultSkullObj = obj.children[0];
          defaultSkullObj.geometry.computeBoundingSphere();
          const radius = defaultSkullObj.geometry.boundingSphere ? defaultSkullObj.geometry.boundingSphere.radius : 1;
          if (radius > 0) {
            const scale = 1.0 / radius;
            defaultSkullObj.geometry.scale(scale, scale, scale);
            defaultSkullObj.geometry.center();
          }
          currentMesh = defaultSkullObj;
          dots();
        },
        (xhr) => console.log((xhr.loaded / xhr.total) * 100 + "% loaded"),
        (err) => console.log("An error happened", err)
      );
    }

    let safe = 0;
    const p1 = new THREE.Vector3();
    function nextDot(line) {
      if (!sampler) return;
      let ok = false;
      safe = 0;
      while (!ok && safe < 300) {
        sampler.sample(p1);
        if (line.previous && p1.distanceTo(line.previous) < 0.08) {
          line.coordinates.push(p1.x, p1.y, p1.z);
          line.previous = p1.clone();

          for (let i = 0; i < 2; i++) {
            const spark = new Sparkle();
            spark.setup(p1, line.material.color);
            sparkles.push(spark);
          }
          ok = true;
        } else if (!line.previous) {
          line.previous = p1.clone();
        }
        safe++;
      }
    }

    function updateSparklesGeometry() {
      let tempSparklesArraySizes = [];
      let tempSparklesArrayColors = [];
      sparkles.forEach((s) => {
        tempSparklesArraySizes.push(s.size);
        tempSparklesArrayColors.push(s.color.r, s.color.g, s.color.b);
      });
      sparklesGeometry.setAttribute(
        "color",
        new THREE.Float32BufferAttribute(tempSparklesArrayColors, 3)
      );
      sparklesGeometry.setAttribute(
        "size",
        new THREE.Float32BufferAttribute(tempSparklesArraySizes, 1)
      );
    }

    class Sparkle extends THREE.Vector3 {
      setup(origin, color) {
        this.x = origin.x;
        this.y = origin.y;
        this.z = origin.z;
        this.v = new THREE.Vector3();
        this.v.x = THREE.MathUtils.randFloat(0.001, 0.006);
        this.v.x *= Math.random() > 0.5 ? 1 : -1;
        this.v.y = THREE.MathUtils.randFloat(0.001, 0.006);
        this.v.y *= Math.random() > 0.5 ? 1 : -1;
        this.v.z = THREE.MathUtils.randFloat(0.001, 0.006);
        this.v.z *= Math.random() > 0.5 ? 1 : -1;

        this.size = Math.random() * 4 + 0.5 * params.pixelRatio;
        this.slowDown = 0.4 + Math.random() * 0.58;
        this.color = color;
      }
      update() {
        if (this.v.x > 0.001 || this.v.y > 0.001 || this.v.z > 0.001) {
          this.addScaledVector(this.v, params.animSpeed);
          this.v.multiplyScalar(Math.pow(this.slowDown, params.animSpeed));
        }
      }
    }

    class Star {
      setup(color) {
        this.r = Math.random() * 3 + 1;
        this.phi = Math.random() * Math.PI * 2;
        this.theta = Math.random() * Math.PI;
        this.v = new THREE.Vector2().random().subScalar(0.5).multiplyScalar(0.0007);

        this.x = this.r * Math.sin(this.phi) * Math.sin(this.theta);
        this.y = this.r * Math.cos(this.phi);
        this.z = this.r * Math.sin(this.phi) * Math.cos(this.theta);

        this.size = Math.random() * 4 + 0.5 * params.pixelRatio;
        this.color = color;
      }
      update() {
        this.phi += this.v.x * params.animSpeed;
        this.theta += this.v.y * params.animSpeed;
        this.x = this.r * Math.sin(this.phi) * Math.sin(this.theta);
        this.y = this.r * Math.cos(this.phi);
        this.z = this.r * Math.sin(this.phi) * Math.cos(this.theta);
      }
    }

    const stars = [];
    const galaxyGeometryVertices = [];
    const galaxyGeometryColors = [];
    const galaxyGeometrySizes = [];

    const baseGalaxyColor = new THREE.Color(params.galaxyColor);
    for (let i = 0; i < 1500; i++) {
      const star = new Star();
      const c = baseGalaxyColor.clone().multiplyScalar(Math.random() * 0.7 + 0.3);
      star.setup(c);
      galaxyGeometryVertices.push(star.x, star.y, star.z);
      galaxyGeometryColors.push(star.color.r, star.color.g, star.color.b);
      galaxyGeometrySizes.push(star.size);
      stars.push(star);
    }
    const starsGeometry = new THREE.BufferGeometry();
    starsGeometry.setAttribute(
      "size",
      new THREE.Float32BufferAttribute(galaxyGeometrySizes, 1)
    );
    starsGeometry.setAttribute(
      "color",
      new THREE.Float32BufferAttribute(galaxyGeometryColors, 3)
    );
    const galaxyPoints = new THREE.Points(starsGeometry, sparklesMaterial);
    scene.add(galaxyPoints);

    function updateGalaxyColors() {
      const gColor = new THREE.Color(params.galaxyColor);
      const colAttr = starsGeometry.getAttribute("color");
      const array = colAttr.array;
      stars.forEach((s, idx) => {
        const c = gColor.clone().multiplyScalar(Math.random() * 0.7 + 0.3);
        s.color = c;
        array[idx * 3] = c.r;
        array[idx * 3 + 1] = c.g;
        array[idx * 3 + 2] = c.b;
      });
      colAttr.needsUpdate = true;
    }

    // SVG Upload Handler
    document.getElementById("svg-file-input").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (evt) => {
        const svgContent = evt.target.result;
        const svgLoader = new SVGLoader();
        const svgData = svgLoader.parse(svgContent);
        const shapes = [];

        svgData.paths.forEach((path) => {
          const pathShapes = SVGLoader.createShapes(path);
          if (pathShapes && pathShapes.length > 0) {
            shapes.push(...pathShapes);
          } else if (path.subPaths) {
            path.subPaths.forEach(sub => {
              const pts = sub.getPoints();
              if (pts.length > 2) {
                shapes.push(new THREE.Shape(pts));
              }
            });
          }
        });

        if (shapes.length === 0) {
          alert("Unable to parse shapes from SVG file.");
          return;
        }

        const extrudeSettings = {
          depth: 0.15,
          bevelEnabled: true,
          bevelSegments: 2,
          steps: 1,
          bevelSize: 0.015,
          bevelThickness: 0.015
        };

        const geometry = new THREE.ExtrudeGeometry(shapes, extrudeSettings);
        geometry.scale(1, -1, 1);
        geometry.center();
        geometry.computeVertexNormals();
        geometry.computeBoundingSphere();

        const radius = geometry.boundingSphere ? geometry.boundingSphere.radius : 1;
        if (radius > 0) {
          const scale = 1.2 / radius;
          geometry.scale(scale, scale, scale);
          geometry.center();
        }

        const mat = new THREE.MeshBasicMaterial();
        currentMesh = new THREE.Mesh(geometry, mat);
        dots();
      };
      reader.readAsText(file);
    });

    // GUI Initialization
    const gui = new GUI({ title: "Settings" });

    const fColors = gui.addFolder("Color & Theme");
    fColors.add(params, "colorScheme", Object.keys(colorPresets)).name("Color Scheme").onChange(applyColorScheme);
    fColors.add(params, "greenscreen").name("Greenscreen (#00ff00)").onChange(updateBackground);
    fColors.addColor(params, "bgColor").name("Background").onChange(updateBackground);
    fColors.addColor(params, "color1").name("Line Color 1").onChange(updateColors);
    fColors.addColor(params, "color2").name("Line Color 2").onChange(updateColors);
    fColors.addColor(params, "color3").name("Line Color 3").onChange(updateColors);
    fColors.addColor(params, "color4").name("Line Color 4").onChange(updateColors);
    fColors.addColor(params, "galaxyColor").name("Galaxy Color").onChange(updateColors);
    fColors.add(params, "bloomStrength", 0, 3, 0.1).name("Bloom Strength").onChange((v) => { bloomPass.strength = v; });

    const fAnim = gui.addFolder("Animation");
    fAnim.add(params, "animationPreset", [
      "Gentle Orbit",
      "Floating Pitch & Yaw",
      "Breathing Zoom",
      "Cosmic Spiral Drift",
      "Static"
    ]).name("Preset Animation");
    fAnim.add(params, "animSpeed", 0.1, 3.0, 0.1).name("Animation Speed");

    const fRender = gui.addFolder("Render Settings");
    fRender.add(params, "pixelRatio", 0.5, 3.0, 0.1).name("Pixel Ratio (DPR)").onChange((dpr) => {
      renderer.setPixelRatio(dpr);
      composer.setPixelRatio(dpr);
    });

    const fModel = gui.addFolder("Custom Form");
    fModel.add(params, "uploadSVG").name("Upload SVG");
    fModel.add(params, "resetModel").name("Reset to Skull");

    window.addEventListener("keydown", (e) => {
      if (e.key === "h" || e.key === "H") {
        gui._hidden ? gui.show() : gui.hide();
      }
    });

    let _prev = 0;
    let animTime = 0;

    function render(a) {
      requestAnimationFrame(render);

      animTime += 0.01 * params.animSpeed;

      switch (params.animationPreset) {
        case "Gentle Orbit":
          group.rotation.y += 0.003 * params.animSpeed;
          break;
        case "Floating Pitch & Yaw":
          group.rotation.y = Math.sin(animTime * 0.5) * 0.3;
          group.rotation.x = Math.cos(animTime * 0.3) * 0.15;
          break;
        case "Breathing Zoom":
          group.rotation.y += 0.002 * params.animSpeed;
          camera.position.z = 2.7 + Math.sin(animTime * 0.8) * 0.4;
          break;
        case "Cosmic Spiral Drift":
          group.rotation.y += 0.004 * params.animSpeed;
          group.rotation.z = Math.sin(animTime * 0.4) * 0.12;
          group.position.y = Math.sin(animTime * 0.6) * 0.08;
          break;
        case "Static":
        default:
          break;
      }

      galaxyPoints.rotation.y += 0.0005 * params.animSpeed;

      if (a - _prev > 30 / params.animSpeed) {
        lines.forEach((l) => {
          if (sparkles.length < 35000) {
            nextDot(l);
            nextDot(l);
            nextDot(l);
            nextDot(l);
            nextDot(l);
            nextDot(l);
          }
          const tempVertices = new Float32Array(l.coordinates);
          l.geometry.setAttribute(
            "position",
            new THREE.BufferAttribute(tempVertices, 3)
          );
          l.geometry.computeBoundingSphere();
        });
        updateSparklesGeometry();
        _prev = a;
      }

      let tempSparklesArray = [];
      sparkles.forEach((s) => {
        s.update();
        tempSparklesArray.push(s.x, s.y, s.z);
      });

      sparklesGeometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(tempSparklesArray, 3)
      );

      let tempStarsArray = [];
      stars.forEach((s) => {
        s.update();
        tempStarsArray.push(s.x, s.y, s.z);
      });

      starsGeometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(tempStarsArray, 3)
      );

      controls.update();
      composer.render();
    }

    window.addEventListener("mousemove", onMouseMove);
    function onMouseMove(e) {
      if (params.animationPreset !== "Static") {
        const x = THREE.MathUtils.mapLinear(
          e.clientY,
          0,
          window.innerHeight,
          -0.3,
          0.3
        );
        const y = THREE.MathUtils.mapLinear(
          e.clientX,
          0,
          window.innerWidth,
          -0.3,
          0.3
        );
        gsap.to(group.rotation, {
          y: y,
          x: x,
          duration: 0.9,
          ease: "power1.out"
        });
      }
    }

    window.addEventListener("resize", onWindowResize);

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      composer.setSize(window.innerWidth, window.innerHeight);
      renderer.setSize(window.innerWidth, window.innerHeight);
      bloomPass.setSize(window.innerWidth, window.innerHeight);
    }

    loadDefaultSkull();
    requestAnimationFrame(render);
  </script>
</body>
</html>
