<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#EFEEF3">
<link rel="icon" href="data:,">
<title>Petal / Point</title>
<style>
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #efeef3;
  }
  #artwork {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
  #error {
    display: none;
    position: fixed;
    inset: 0;
    padding: 32px;
    place-content: center;
    background: #efeef3;
    color: #873e28;
    font: 16px/1.6 system-ui, sans-serif;
    white-space: pre-line;
  }
</style>
</head>
<body>
<div id="error" role="alert"></div>

<script>
(async function () {
  'use strict';

  async function loadLibrary(urls, ready) {
    if (ready()) return;

    for (const url of urls) {
      try {
        await new Promise((resolve, reject) => {
          const script = document.createElement('script');
          const timeout = setTimeout(() => {
            script.remove();
            reject(new Error('Library request timed out'));
          }, 12000);

          script.src = url;
          script.onload = () => {
            clearTimeout(timeout);
            resolve();
          };
          script.onerror = () => {
            clearTimeout(timeout);
            script.remove();
            reject(new Error('Library request failed'));
          };
          document.head.appendChild(script);
        });

        if (ready()) return;
      } catch (_) {
        // Try the next distributor of the same pinned library version.
      }
    }

    throw new Error('Could not load the required rendering libraries.');
  }

  try {
    await loadLibrary([
      'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js',
      'https://unpkg.com/three@0.160.1/build/three.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.1/three.min.js'
    ], () => Boolean(window.THREE));

    await loadLibrary([
      'https://cdn.jsdelivr.net/npm/lil-gui@0.19.1/dist/lil-gui.umd.min.js',
      'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.umd.min.js'
    ], () => Boolean(window.lil && window.lil.GUI));

    start();
  } catch (error) {
    const message = document.getElementById('error');
    message.style.display = 'grid';
    message.textContent =
      'Unable to start the artwork.\n' +
      'An internet connection and a browser with WebGL enabled are required.\n\n' +
      error.message;
    console.error(error);
  }

  function start() {
    const TAU = Math.PI * 2;

    const PARAMETERS = {
      loopDuration: 5,
      scaleRange: { sparse: 3.1, dense: 11.2 },
      maxPixelRatio: 3
    };

    // Palette order: outer edge, middle, center, rim, background,
    // optional inner highlight.
    const PALETTES = {
      'Original':
        ['FFC24F', 'FF792B', 'F43D25', '8D803C', 'EFEEF3', 'FFF1C3'],

      'Monochromatic':
        ['D1C4FF', '8761DB', '4B248B', '514167', 'F2EFF8', 'F4ECFF'],

      'Analogous':
        ['FFD36A', 'F58D46', 'D84B49', 'AA713D', 'FFF1E5', 'FFF3CA'],

      'Complementary':
        ['FFD677', 'F58032', 'D94A28', '287C8E', 'DFEFF3', 'FFF2C9'],

      'Split-complementary':
        ['FFD365', 'EF7F48', 'CA4246', '446E94', 'E4F2E8', 'FFF1CC'],

      'Triadic':
        ['FFCE65', 'EB7950', 'B84871', '4C8980', 'E5F1EA', 'FFF4D8'],

      'Tetradic':
        ['F6D673', 'E57F9B', '854EAD', '378F8B', 'E5F4F2', 'FFF6DE'],

      'Double split-complementary':
        ['F3BD77', 'CC737D', '7060AD', '4F987F', 'EBF3E7', 'FFF5DE'],

      'Achromatic':
        ['FFFFFF', 'BBBBBB', '444444', '777777', '000000', 'FFFFFF'],

      'Achromatic + Accent':
        ['FFFFFF', 'BBBBBB', 'EF3434', '777777', '000000', 'FFFFFF'],

      'Neutral + accent':
        ['F0D6A6', 'C4AA88', 'E6673C', '837A6F', 'EEEAE3', 'FFF7E7'],

      'Amber / Oxblood':
        ['F6AA1C', 'BC3908', '941B0C', 'F6AA1C', '220901'],

      'Lagoon / Ink':
        ['63D1CF', '5BC0BE', '4BAD9E', '4BAD9E', '0B132B', '000000'],

      'Orchid / Plum':
        ['AA60C8', 'D69ADE', 'C9A3C6', 'CFB5C2', '0D001D', '120A12'],

      'Saffron / Teal':
        ['FEF1BE', 'FFBA00', '008189', '00474D', '061210'],

      'Lime / Forest':
        ['D4FFB0', '7FFF00', '00B894', '0A3322', '05140A'],

      'Tangerine / Aubergine':
        ['FFE8CC', 'FF8C00', 'C7501A', '3D1050', '0E0618'],

      'Lavender / Midnight':
        ['E8E0FF', 'B38FFF', '6A3DE8', '1A1250', '090612'],

      'Cyan / Magenta':
        ['E0FBFF', '00F0FF', 'D40078', '1E0A3D', '05020F']
    };

    const ANIMATIONS = [
      'Original loop',
      'Gentle breathing',
      'Flower waltz',
      'Star tide',
      'Slow orbit',
      'Diagonal drift',
      'Petal promenade',
      'Ripple garden',
      'Checkerboard duet',
      'Diagonal cascade',
      'Pinwheel field',
      'Tide curtain',
      'Bloom / scatter / return',
      'Static'
    ];

    const FORMS = [
      'Original flower / star', 'Bloom cycle', 'Soft geometry',
      'Petal twist', 'Inhale / exhale', 'Rosette'
    ];
    const SCENES = ANIMATIONS.slice(7, 13);

    const settings = {
      palette: 'Original',
      invertBW: false,
      greenscreen: false,

      center: '#F43D25',
      middle: '#FF792B',
      edge: '#FFC24F',
      rim: '#8D803C',
      highlight: '#FFF1C3',
      background: '#EFEEF3',

      animation: 'Original loop',
      speed: 0.4,
      motion: 1,
      deformation: 1,
      form: FORMS[0],
      paused: false,
      reducedMotion: false,

      zoom: 1,
      angle: 0,
      panX: 0,
      panY: 0,

      density: 5.2,
      motifSize: 1,
      petalWidth: 0.18,
      starExponent: 0.66,
      morph: 0,

      depth: 0.055,
      rimStrength: 0.55,
      highlightStrength: 0.3,

      pixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      clickRandomize: false,

      randomize: () => randomizeTheme(),

      resetView: () => {
        settings.zoom = 1;
        settings.angle = 0;
        settings.panX = 0;
        settings.panY = 0;
        refreshPanel();
      }
    };

    const vertexShader = `
      void main() {
        gl_Position = vec4(position.xy, 0.0, 1.0);
      }
    `;

    const fragmentShader = `
      precision highp float;

      uniform vec2 uResolution;
      uniform vec2 uPan;

      uniform float uTime;
      uniform float uDensity;
      uniform float uAngle;
      uniform float uMorph;
      uniform float uForm;
      uniform float uPreviousForm;
      uniform float uFormBlend;
      uniform float uScene;
      uniform float uPreviousScene;
      uniform float uSceneBlend;
      uniform float uPhase;
      uniform float uMotion;
      uniform float uDeformation;

      // Per-cell values are shared by silhouette, pigment and surface normals.
      float localPhase;
      float localMorph;
      float localHighlight;

      const float TAU = 6.28318530718;

      mat2 turn(float angle) {
        float c = cos(angle), s = sin(angle);
        return mat2(c, -s, s, c);
      }

      // xy = cell offset, z = local rotation, w = size multiplier.
      vec4 cellPose(float scene, vec2 cell, out float phase) {
        phase = uPhase;
        vec4 pose = vec4(0.0, 0.0, 0.0, 1.0);
        float parity = mod(cell.x + cell.y, 2.0);
        if (scene > 0.5 && scene < 1.5) {
          phase -= length(cell) * 0.65;
          pose.z = 0.16 * sin(phase);
          pose.w = 0.92 + 0.08 * cos(phase);
        } else if (scene < 2.5 && scene > 1.5) {
          phase += parity * 3.14159265;
          pose.z = (1.0 - 2.0 * parity) * 0.22 * sin(uPhase);
        } else if (scene < 3.5 && scene > 2.5) {
          phase -= (cell.x + cell.y) * 0.70;
          pose.w = 0.90 + 0.10 * cos(phase - 0.35);
        } else if (scene < 4.5 && scene > 3.5) {
          phase += parity * 3.14159265;
          pose.z = (1.0 - 2.0 * parity) * 0.65 * sin(uPhase);
        } else if (scene < 5.5 && scene > 4.5) {
          phase -= cell.y * 0.65;
          pose.x = 0.075 * sin(phase);
          pose.z = 0.14 * sin(phase);
          pose.w = 0.82;
        } else if (scene > 5.5) {
          float scatter = pow(0.5 - 0.5 * cos(uPhase), 2.0);
          vec2 direction = vec2(sin(dot(cell, vec2(12.7, 31.1))),
                                cos(dot(cell, vec2(27.3, 17.7))));
          pose.xy = direction * 0.18 * scatter;
          pose.z = 0.6 * scatter * sin(dot(cell, vec2(5.3, 9.1)));
          pose.w = 1.0 - 0.86 * scatter;
          phase += 0.3 * sin(dot(cell, vec2(2.1, 4.7)));
        }
        return mix(vec4(0.0, 0.0, 0.0, 1.0), pose, uMotion);
      }

      uniform float uMotifSize;
      uniform float uPetalWidth;
      uniform float uStarExponent;

      uniform float uSurfaceDepth;
      uniform float uRimStrength;
      uniform float uHighlightStrength;

      uniform vec3 uCenter;
      uniform vec3 uMiddle;
      uniform vec3 uEdge;
      uniform vec3 uBackground;
      uniform vec3 uRim;
      uniform vec3 uHighlight;

      float formBoundary(vec2 p, float form) {
        float radius = length(p);

        vec2 direction = radius > 0.000001
          ? abs(p) / radius
          : vec2(1.0, 0.0);

        float m = max(direction.x, direction.y);

        float flower =
          0.25 * m +
          sqrt(max(
            uPetalWidth * uPetalWidth
            - 0.0625 * (1.0 - m * m),
            0.0
          ));

        float exponent = uStarExponent;

        float sum =
          pow(direction.x, exponent) +
          pow(direction.y, exponent);

        float star =
          0.43 / pow(max(sum, 0.0001), 1.0 / exponent);

        float original = mix(flower, star, localMorph);
        float wave = 0.5 - 0.5 * cos(localPhase);
        float theta = atan(p.y, p.x + 0.0000001);
        float target = original;

        if (form > 0.5 && form < 1.5) {
          // Three eased stages: round bud, flower, pointed star, bud.
          float stage = mod(localPhase / TAU, 1.0) * 3.0;
          float k = smoothstep(0.0, 1.0, fract(stage));
          float bud = 0.25;
          target = stage < 1.0 ? mix(bud, flower, k)
            : stage < 2.0 ? mix(flower, star, k) : mix(star, bud, k);
        } else if (form > 1.5 && form < 2.5) {
          float diamond = 0.40 / pow(
            pow(direction.x, 1.35) + pow(direction.y, 1.35), 1.0 / 1.35);
          float stage = mod(localPhase / TAU, 1.0) * 3.0;
          float k = smoothstep(0.0, 1.0, fract(stage));
          target = stage < 1.0 ? mix(0.34, diamond, k)
            : stage < 2.0 ? mix(diamond, star, k) : mix(star, 0.34, k);
        } else if (form > 2.5 && form < 3.5) {
          float twist = 0.55 * sin(localPhase) * smoothstep(0.0, 0.44, radius);
          float lobe = 0.5 + 0.5 * cos(4.0 * (theta - twist));
          target = 0.23 + 0.20 * pow(lobe, 0.65);
        } else if (form > 3.5 && form < 4.5) {
          float lobe = 0.5 + 0.5 * cos(4.0 * theta);
          target = mix(0.27, 0.18, wave)
            + mix(0.10, 0.25, wave) * pow(lobe, mix(1.8, 0.55, wave));
        } else if (form > 4.5) {
          float four = 0.5 + 0.5 * cos(4.0 * theta);
          float eight = 0.5 + 0.5 * cos(8.0 * theta);
          target = 0.25 + 0.18 * mix(four, eight, wave);
        }

        return form < 0.5 ? original
          : mix(original, target, uDeformation);
      }

      float boundary(vec2 p) {
        if (uFormBlend >= 1.0) return formBoundary(p, uForm);
        return mix(formBoundary(p, uPreviousForm),
                   formBoundary(p, uForm), uFormBlend);
      }

      // A normalized radial field stays continuous through the center.
      float field(vec2 p) {
        return (
          length(p) / max(boundary(p), 0.001) - 1.0
        ) * 0.20;
      }

      float heightAt(vec2 p) {
        float rho = length(p) / max(boundary(p), 0.001);
        return pow(max(1.0 - rho * rho, 0.0), 0.70);
      }

      void main() {
        float shortSide = min(uResolution.x, uResolution.y);

        vec2 screen =
          (gl_FragCoord.xy - 0.5 * uResolution) / shortSide;

        float c = cos(uAngle);
        float s = sin(uAngle);
        mat2 rotation = mat2(c, -s, s, c);

        vec2 lattice =
          rotation * (screen - uPan) * uDensity;

        vec2 cell = floor(lattice + 0.5);
        float oldPhase, newPhase;
        vec4 oldPose = cellPose(uPreviousScene, cell, oldPhase);
        vec4 newPose = cellPose(uScene, cell, newPhase);
        vec4 pose = mix(oldPose, newPose, uSceneBlend);
        localPhase = mix(oldPhase, newPhase, uSceneBlend);
        float sceneAmount = mix(step(0.5, uPreviousScene),
                               step(0.5, uScene), uSceneBlend);
        localMorph = mix(uMorph, 0.5 - 0.5 * cos(localPhase),
                         sceneAmount * uDeformation);
        localHighlight = sceneAmount * (0.5 + 0.5 * sin(localPhase - 0.65));

        // Moving cells shrink to keep their entire silhouette inside the tile.
        float safeSize = min(uMotifSize * pose.w,
          (0.495 - max(abs(pose.x), abs(pose.y))) / 0.46);
        vec2 p =
          turn(pose.z) * (fract(lattice + 0.5) - 0.5 - pose.xy)
          / max(safeSize, 0.01);

        // Controls keep every lobe below the half-cell boundary.
        float f = field(p);
        float pixel = max(fwidth(f), 0.00001);

        float coverage =
          1.0 - smoothstep(-0.5 * pixel, 0.5 * pixel, f);

        vec3 color = uBackground;

        if (coverage > 0.0) {
          float rho = clamp(
            length(p) / max(boundary(p), 0.001),
            0.0,
            1.0
          );

          vec3 pigment = mix(
            uCenter,
            uMiddle,
            smoothstep(0.16, 0.72, rho)
          );

          pigment = mix(
            pigment,
            uEdge,
            smoothstep(0.64, 1.0, rho)
          );

          float epsilon = max(
            uDensity / shortSide / max(safeSize, 0.01) * 0.65,
            0.0003
          );

          vec2 gradient = vec2(
            heightAt(p + vec2(epsilon, 0.0))
              - heightAt(p - vec2(epsilon, 0.0)),

            heightAt(p + vec2(0.0, epsilon))
              - heightAt(p - vec2(0.0, epsilon))
          ) / (2.0 * epsilon);

          vec3 normal = normalize(
            vec3(-gradient * uSurfaceDepth, 1.0)
          );

          // Very restrained moving illumination; time freezes in Static mode.
          vec2 lightXY = vec2(
            -0.38 + 0.015 * mix(sin(uTime * 0.12), sin(uPhase), sceneAmount),
             0.52
          );

          vec3 light = normalize(
            vec3(rotation * lightXY, 1.35)
          );

          float diffuse = max(dot(normal, light), 0.0);

          vec3 halfway = normalize(
            light + vec3(0.0, 0.0, 1.0)
          );

          float specular = pow(
            max(dot(normal, halfway), 0.0),
            24.0
          );

          pigment *= 0.92 + 0.08 * diffuse;

          pigment = mix(
            pigment,
            uHighlight,
            0.045 * specular + 0.055 * localHighlight
          );

          // Screen-pixel rim widths remain stable while zooming.
          float inside = -f / pixel;

          float rim =
            1.0 - smoothstep(0.15, 0.90, inside);

          float lip =
            smoothstep(0.45, 1.0, inside) *
            (1.0 - smoothstep(1.0, 1.75, inside));

          pigment = mix(
            pigment,
            uHighlight,
            lip * uHighlightStrength
          );

          pigment = mix(
            pigment,
            uRim,
            rim * uRimStrength
          );

          color = mix(uBackground, pigment, coverage);
        }

        gl_FragColor = vec4(color, 1.0);
      }
    `;

    const renderer = new THREE.WebGLRenderer({
      antialias: false,
      alpha: false,
      powerPreference: 'high-performance'
    });

    renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
    renderer.toneMapping = THREE.NoToneMapping;

    const canvas = renderer.domElement;
    canvas.id = 'artwork';
    canvas.setAttribute('role', 'img');
    canvas.setAttribute(
      'aria-label',
      'Animated procedural flowers and four-point stars'
    );

    document.body.appendChild(canvas);

    function setRGB(target, hex) {
      const value = parseInt(hex.replace('#', ''), 16);

      target.set(
        ((value >> 16) & 255) / 255,
        ((value >> 8) & 255) / 255,
        (value & 255) / 255
      );
    }

    const uniforms = {
      uResolution: { value: new THREE.Vector2() },
      uPan: { value: new THREE.Vector2() },
      uTime: { value: 0 },

      uDensity: { value: 3.1 },
      uAngle: { value: 0 },
      uMorph: { value: 0 },
      uForm: { value: 0 },
      uPreviousForm: { value: 0 },
      uFormBlend: { value: 1 },
      uScene: { value: 0 },
      uPreviousScene: { value: 0 },
      uSceneBlend: { value: 1 },
      uPhase: { value: 0 },
      uMotion: { value: 1 },
      uDeformation: { value: 1 },

      uMotifSize: { value: 1 },
      uPetalWidth: { value: 0.18 },
      uStarExponent: { value: 0.66 },

      uSurfaceDepth: { value: 0.055 },
      uRimStrength: { value: 0.55 },
      uHighlightStrength: { value: 0.3 },

      uCenter: { value: new THREE.Vector3() },
      uMiddle: { value: new THREE.Vector3() },
      uEdge: { value: new THREE.Vector3() },
      uBackground: { value: new THREE.Vector3() },
      uRim: { value: new THREE.Vector3() },
      uHighlight: { value: new THREE.Vector3() }
    };

    const material = new THREE.ShaderMaterial({
      uniforms,
      vertexShader,
      fragmentShader,
      extensions: { derivatives: true },
      depthTest: false,
      depthWrite: false
    });

    const geometry = new THREE.BufferGeometry();

    geometry.setAttribute(
      'position',
      new THREE.Float32BufferAttribute([
        -1, -1, 0,
         3, -1, 0,
        -1,  3, 0
      ], 3)
    );

    const scene = new THREE.Scene();
    const camera = new THREE.Camera();
    const mesh = new THREE.Mesh(geometry, material);

    mesh.frustumCulled = false;
    scene.add(mesh);

    function smootherstep(t) {
      return t * t * t * (t * (t * 6 - 15) + 10);
    }

    function choreography(phase) {
      const sparse = PARAMETERS.scaleRange.sparse;
      const dense = PARAMETERS.scaleRange.dense;
      const quarter = Math.PI / 2;
      const diagonal = Math.PI / 4;

      const poses = [
        [0.00, sparse,       0,                  0],
        [0.18, 5.4,          diagonal,           1],
        [0.37, dense,        quarter,            0],
        [0.54, dense * 0.96, quarter + diagonal, 1],
        [0.75, sparse,       quarter,            0],
        [0.88, sparse,       quarter + diagonal, 1],
        [1.00, sparse,       quarter,            0]
      ];

      for (let i = 0; i < poses.length - 1; i++) {
        const a = poses[i];
        const b = poses[i + 1];

        if (phase <= b[0]) {
          const t = THREE.MathUtils.clamp(
            (phase - a[0]) / (b[0] - a[0]),
            0,
            1
          );

          const k = smootherstep(t);

          return {
            density: Math.exp(
              Math.log(a[1]) * (1 - k) +
              Math.log(b[1]) * k
            ),
            angle: a[2] * (1 - k) + b[2] * k,
            morph: a[3] * (1 - k) + b[3] * k
          };
        }
      }

      return { density: sparse, angle: quarter, morph: 0 };
    }

    function motionPose(time) {
      const t = time * TAU / 18;
      const amount = settings.motion;
      const wave = 0.5 - 0.5 * Math.cos(t);

      let density = settings.density;
      let angle = 0;
      let morph = settings.morph;
      let x = 0;
      let y = 0;

      function deform(target) {
        morph += (target - morph) * settings.deformation;
      }

      switch (settings.animation) {
        case 'Original loop': {
          const cycles = time / PARAMETERS.loopDuration;
          const pose = choreography(cycles - Math.floor(cycles));

          density *= Math.pow(pose.density / 5.2, amount);

          angle = (
            pose.angle + Math.floor(cycles) * Math.PI / 2
          ) * amount;

          deform(pose.morph);
          break;
        }

        case 'Gentle breathing':
          density *= Math.exp(0.25 * amount * Math.sin(t));
          deform(wave);
          break;

        case 'Flower waltz':
          angle = amount * 0.32 * Math.sin(t);
          density *= Math.exp(0.14 * amount * Math.sin(t * 2));
          deform(0.15 * wave);
          break;

        case 'Star tide':
          angle = amount * 0.18 * Math.sin(t);
          density *= Math.exp(0.22 * amount * Math.sin(t));
          deform(0.72 + 0.28 * wave);
          break;

        case 'Slow orbit':
          angle = amount * t * 0.35;
          x = amount * 0.12 * (Math.cos(t) - 1);
          y = amount * 0.12 * Math.sin(t);
          density *= Math.exp(0.10 * amount * Math.sin(t));
          deform(wave);
          break;

        case 'Diagonal drift':
          x = amount * 0.17 * Math.sin(t);
          y = amount * 0.17 * Math.sin(t * 0.7);
          angle = Math.PI / 4 + amount * 0.10 * Math.sin(t * 0.5);
          deform(wave);
          break;

        case 'Petal promenade':
          x = amount * 0.22 * Math.sin(t);
          y = amount * 0.10 * Math.sin(t * 2);
          angle = amount * 0.24 * Math.sin(t * 0.5);
          density *= Math.exp(0.16 * amount * Math.sin(t));
          deform(wave);
          break;

        case 'Static':
          break;
      }

      return { density, angle, morph, x, y };
    }

    // Form and scene selections crossfade without resetting the shared clock.
    const transitions = {
      form: { current: 0, previous: 0, blend: 1 },
      scene: { current: 0, previous: 0, blend: 1 }
    };
    const viewTransition = {
      selection: settings.animation, from: null, last: null, elapsed: 0.8
    };

    function blendedMotionPose(time, dt, frozen) {
      const target = motionPose(time);
      if (viewTransition.selection !== settings.animation) {
        viewTransition.selection = settings.animation;
        viewTransition.from = viewTransition.last;
        viewTransition.elapsed = 0;
      }
      viewTransition.elapsed = frozen ? 0.8
        : Math.min(0.8, viewTransition.elapsed + dt);
      const from = viewTransition.from;
      const k = smootherstep(viewTransition.elapsed / 0.8);
      if (from && k < 1) {
        target.density = Math.exp(
          Math.log(from.density) * (1 - k) + Math.log(target.density) * k);
        const delta = Math.atan2(Math.sin(target.angle - from.angle),
                                 Math.cos(target.angle - from.angle));
        target.angle -= delta * (1 - k);
        for (const key of ['morph', 'x', 'y']) {
          target[key] = from[key] * (1 - k) + target[key] * k;
        }
      }
      viewTransition.last = { ...target };
      return target;
    }

    function updateTransition(state, next, dt) {
      if (state.current !== next) {
        state.previous = state.blend < 0.5 ? state.previous : state.current;
        state.current = next;
        state.blend = 0;
      }
      state.blend = Math.min(1, state.blend + dt / 0.8);
    }

    const gui = new lil.GUI({
      title: 'Petal / Point',
      width: 300
    });

    function refreshPanel() {
      gui.controllersRecursive().forEach(control => {
        control.updateDisplay();
      });
    }

    function applyPalette() {
      let colors = PALETTES[settings.palette].map(hex => '#' + hex);

      if (
        settings.invertBW &&
        settings.palette.startsWith('Achromatic')
      ) {
        colors = colors.map(hex => {
          const n = parseInt(hex.slice(1), 16);
          const r = (n >> 16) & 255;
          const g = (n >> 8) & 255;
          const b = n & 255;

          // Keep the red accent intact.
          if (r !== g || g !== b) return hex;

          const inverted = (255 - r)
            .toString(16)
            .padStart(2, '0');

          return '#' + inverted.repeat(3);
        });
      }

      settings.edge = colors[0];
      settings.middle = colors[1];
      settings.center = colors[2];
      settings.rim = colors[3];
      settings.background = colors[4];
      settings.highlight = colors[5] || colors[0];

      refreshPanel();
    }

    const colorsFolder = gui.addFolder('Colors');

    colorsFolder
      .add(settings, 'palette', Object.keys(PALETTES))
      .name('Color scheme')
      .onChange(applyPalette);

    colorsFolder
      .add(settings, 'invertBW')
      .name('Invert B/W')
      .onChange(applyPalette);

    colorsFolder
      .add(settings, 'greenscreen')
      .name('Greenscreen');

    for (const key of [
      'center',
      'middle',
      'edge',
      'rim',
      'highlight',
      'background'
    ]) {
      colorsFolder
        .addColor(settings, key)
        .name(key[0].toUpperCase() + key.slice(1));
    }

    const animationFolder = gui.addFolder('Animation');

    animationFolder
      .add(settings, 'animation', ANIMATIONS)
      .name('Animation');

    animationFolder
      .add(settings, 'form', FORMS)
      .name('Morph sequence');

    animationFolder.add(settings, 'paused').name('Pause');
    animationFolder.add(settings, 'reducedMotion').name('Reduced motion');

    animationFolder
      .add(settings, 'speed', 0, 2, 0.01)
      .name('Speed');

    animationFolder
      .add(settings, 'motion', 0, 1.5, 0.01)
      .name('Motion amount');

    animationFolder
      .add(settings, 'deformation', 0, 1, 0.01)
      .name('Morph range');

    const viewFolder = gui.addFolder('View');

    viewFolder
      .add(settings, 'zoom', 0.15, 8, 0.01)
      .name('Zoom')
      .listen();

    viewFolder
      .add(settings, 'angle', -180, 180, 0.1)
      .name('Angle (°)')
      .listen();

    viewFolder
      .add(settings, 'panX', -5, 5, 0.001)
      .name('Horizontal')
      .listen();

    viewFolder
      .add(settings, 'panY', -5, 5, 0.001)
      .name('Vertical')
      .listen();

    viewFolder
      .add(settings, 'resetView')
      .name('Reset view');

    const shapeFolder = gui.addFolder('Shape');

    shapeFolder
      .add(settings, 'density', 3, 12, 0.01)
      .name('Pattern density');

    shapeFolder
      .add(settings, 'motifSize', 0.6, 1.06, 0.01)
      .name('Motif size');

    shapeFolder
      .add(settings, 'petalWidth', 0.18, 0.21, 0.001)
      .name('Petal roundness');

    shapeFolder
      .add(settings, 'starExponent', 0.45, 0.9, 0.01)
      .name('Star curvature');

    shapeFolder
      .add(settings, 'morph', 0, 1, 0.01)
      .name('Base shape');

    shapeFolder
      .add(settings, 'depth', 0, 0.12, 0.001)
      .name('Surface depth');

    shapeFolder
      .add(settings, 'rimStrength', 0, 1, 0.01)
      .name('Rim strength');

    shapeFolder
      .add(settings, 'highlightStrength', 0, 0.7, 0.01)
      .name('Edge highlight');

    const renderingFolder = gui.addFolder('Rendering');

    renderingFolder
      .add(settings, 'pixelRatio', 0.5, 3, 0.1)
      .name('Pixel Ratio (DPR)')
      .onChange(resize);

    const variationsFolder = gui.addFolder('Variations');

    variationsFolder
      .add(settings, 'clickRandomize')
      .name('Randomize on click');

    variationsFolder
      .add(settings, 'randomize')
      .name('New variation');

    viewFolder.close();
    shapeFolder.close();
    renderingFolder.close();

    // Keep lil-gui's default appearance.
    let uiVisible = true;

    window.addEventListener('keydown', event => {
      if (
        event.key.toLowerCase() !== 'h' ||
        event.repeat ||
        event.ctrlKey ||
        event.metaKey ||
        event.altKey
      ) return;

      event.preventDefault();
      uiVisible = !uiVisible;
      gui.show(uiVisible);
    });

    function randomizeTheme() {
      const choose = array =>
        array[Math.floor(Math.random() * array.length)];

      const range = (lo, hi) =>
        lo + Math.random() * (hi - lo);

      const rounded = (value, digits = 3) =>
        Number(value.toFixed(digits));

      settings.palette = choose(Object.keys(PALETTES));
      settings.invertBW = Math.random() < 0.5;

      applyPalette();

      settings.animation = choose(
        ANIMATIONS.filter(name => name !== 'Static')
      );
      settings.form = choose(FORMS);

      settings.speed = rounded(range(0.20, 0.55), 2);
      settings.motion = rounded(range(0.35, 1), 2);
      settings.density = rounded(range(3.4, 9.5), 2);
      settings.motifSize = rounded(range(0.72, 1.04), 2);
      settings.petalWidth = rounded(range(0.18, 0.21));
      settings.starExponent = rounded(range(0.48, 0.85), 2);
      settings.morph = rounded(range(0, 0.35), 2);
      settings.deformation = rounded(range(0.5, 1), 2);
      settings.depth = rounded(range(0.025, 0.085));
      settings.rimStrength = rounded(range(0.25, 0.65), 2);

      // Preserve manual framing, greenscreen and rendering preferences.
      refreshPanel();
    }

    let animationTime = 0;
    let previousTime = null;
    let frame = 0;
    let contextLost = false;
    let pointer = null;

    // Wheel zoom is a persistent multiplier, independent of animated zoom.
    canvas.addEventListener('wheel', event => {
      event.preventDefault();

      const multiplier = event.deltaMode === 1
        ? 16
        : event.deltaMode === 2
          ? window.innerHeight
          : 1;

      const delta = event.deltaY * multiplier;
      const oldZoom = settings.zoom;

      const newZoom = THREE.MathUtils.clamp(
        oldZoom * Math.exp(-delta * 0.001),
        0.15,
        8
      );

      // Anchor the zoom at the pointer.
      const shortSide = Math.min(innerWidth, innerHeight);
      const sx = (event.clientX - innerWidth / 2) / shortSide;
      const sy = (innerHeight / 2 - event.clientY) / shortSide;
      const pose = viewTransition.last || motionPose(animationTime);
      const ratio = newZoom / oldZoom;

      settings.panX +=
        (1 - ratio) * (sx - settings.panX - pose.x);

      settings.panY +=
        (1 - ratio) * (sy - settings.panY - pose.y);

      settings.zoom = newZoom;
    }, { passive: false });

    canvas.addEventListener('pointerdown', event => {
      if (
        !event.isPrimary ||
        (event.button !== 0 && event.button !== 2)
      ) return;

      pointer = {
        id: event.pointerId,
        x: event.clientX,
        y: event.clientY,
        startX: event.clientX,
        startY: event.clientY,
        moved: false,
        rotating: event.button === 2 || event.altKey
      };

      canvas.setPointerCapture(event.pointerId);
    });

    canvas.addEventListener('pointermove', event => {
      if (!pointer || pointer.id !== event.pointerId) return;

      const dx = event.clientX - pointer.x;
      const dy = event.clientY - pointer.y;

      if (
        Math.hypot(
          event.clientX - pointer.startX,
          event.clientY - pointer.startY
        ) > 5
      ) {
        pointer.moved = true;
      }

      if (pointer.moved) {
        if (pointer.rotating) {
          settings.angle = (
            (settings.angle + dx * 0.3 + 180) % 360 + 360
          ) % 360 - 180;
        } else {
          const dimension = Math.min(innerWidth, innerHeight);

          settings.panX += dx / dimension;
          settings.panY -= dy / dimension;
        }
      }

      pointer.x = event.clientX;
      pointer.y = event.clientY;
    });

    canvas.addEventListener('pointerup', event => {
      if (!pointer || pointer.id !== event.pointerId) return;

      const shouldRandomize =
        !pointer.moved &&
        !pointer.rotating &&
        settings.clickRandomize;

      pointer = null;

      if (canvas.hasPointerCapture(event.pointerId)) {
        canvas.releasePointerCapture(event.pointerId);
      }

      if (shouldRandomize) randomizeTheme();
    });

    canvas.addEventListener('pointercancel', () => {
      pointer = null;
    });

    canvas.addEventListener('lostpointercapture', () => {
      pointer = null;
    });

    canvas.addEventListener('contextmenu', event => {
      event.preventDefault();
    });

    function resize() {
      settings.pixelRatio = THREE.MathUtils.clamp(
        settings.pixelRatio,
        0.5,
        PARAMETERS.maxPixelRatio
      );

      renderer.setPixelRatio(settings.pixelRatio);
      renderer.setSize(innerWidth, innerHeight);
      renderer.getDrawingBufferSize(uniforms.uResolution.value);
    }

    window.addEventListener('resize', resize, { passive: true });

    function animate(now) {
      if (contextLost) return;

      const dt = previousTime === null
        ? 0
        : Math.min((now - previousTime) / 1000, 0.1);

      previousTime = now;

      const frozen = settings.paused || settings.reducedMotion ||
        settings.animation === 'Static';

      if (!frozen) {
        animationTime += dt * settings.speed;
      }

      updateTransition(transitions.form, FORMS.indexOf(settings.form), frozen ? 0 : dt);
      updateTransition(transitions.scene, SCENES.indexOf(settings.animation) + 1, frozen ? 0 : dt);

      // Let an explicitly selected still form/scene appear even while paused.
      if (frozen) {
        for (const state of Object.values(transitions)) {
          state.previous = state.current;
          state.blend = 1;
        }
      }

      uniforms.uForm.value = transitions.form.current;
      uniforms.uPreviousForm.value = transitions.form.previous;
      uniforms.uFormBlend.value = smootherstep(transitions.form.blend);
      uniforms.uScene.value = transitions.scene.current;
      uniforms.uPreviousScene.value = transitions.scene.previous;
      uniforms.uSceneBlend.value = smootherstep(transitions.scene.blend);
      // The original presets retain their timing. New scenes loop in 18s at 1x.
      uniforms.uPhase.value = (animationTime % 18) * TAU / 18;
      uniforms.uMotion.value = Math.min(settings.motion, 1);
      uniforms.uDeformation.value = settings.deformation;

      const pose = blendedMotionPose(animationTime, dt, frozen);

      uniforms.uTime.value = animationTime;

      uniforms.uDensity.value = THREE.MathUtils.clamp(
        pose.density / settings.zoom,
        0.15,
        120
      );

      uniforms.uAngle.value =
        pose.angle + settings.angle * Math.PI / 180;

      uniforms.uMorph.value = THREE.MathUtils.clamp(
        pose.morph,
        0,
        1
      );

      uniforms.uPan.value.set(
        settings.panX + pose.x,
        settings.panY + pose.y
      );

      uniforms.uMotifSize.value = settings.motifSize;
      uniforms.uPetalWidth.value = settings.petalWidth;
      uniforms.uStarExponent.value = settings.starExponent;
      uniforms.uSurfaceDepth.value = settings.depth;
      uniforms.uRimStrength.value = settings.rimStrength;
      uniforms.uHighlightStrength.value = settings.highlightStrength;

      for (const key of [
        'center',
        'middle',
        'edge',
        'rim',
        'highlight',
        'background'
      ]) {
        const uniformName =
          'u' + key[0].toUpperCase() + key.slice(1);

        const hex =
          key === 'background' && settings.greenscreen
            ? '#00FF00'
            : settings[key];

        setRGB(uniforms[uniformName].value, hex);
      }

      renderer.render(scene, camera);
      frame = requestAnimationFrame(animate);
    }

    canvas.addEventListener('webglcontextlost', event => {
      event.preventDefault();
      contextLost = true;
      cancelAnimationFrame(frame);
    });

    canvas.addEventListener('webglcontextrestored', () => {
      contextLost = false;
      previousTime = null;
      resize();
      frame = requestAnimationFrame(animate);
    });

    document.addEventListener('visibilitychange', () => {
      previousTime = null;
    });

    window.addEventListener('pagehide', () => {
      cancelAnimationFrame(frame);
    });

    window.addEventListener('pageshow', event => {
      if (event.persisted && !contextLost) {
        previousTime = null;
        frame = requestAnimationFrame(animate);
      }
    });

    resize();
    frame = requestAnimationFrame(animate);
  }
})();
</script>
</body>
</html>
