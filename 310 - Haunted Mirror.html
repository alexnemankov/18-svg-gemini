<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Haunted Mirror with Parallax Void</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      user-select: none;
      -webkit-user-select: none;
    }
    #webgl-canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
      }
    }
  </script>
</head>
<body>
  <canvas id="webgl-canvas"></canvas>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import GUI from 'lil-gui';

    // =========================================================================================
    // POST PROCESSOR SUITE (Inlined from postprocessing/PostProcessor.js for standalone usage)
    // =========================================================================================
    const orthoVertexShader = `
    precision highp float;
    in vec3 position;
    out vec2 vUv;
    void main() {
      vUv = position.xy * 0.5 + 0.5;
      gl_Position = vec4(position, 1.0);
    }
    `;

    const brightFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float bloomThreshold;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float luminance = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float knee = 0.1;
      float soft = luminance - bloomThreshold + knee;
      soft = clamp(soft, 0.0, 2.0 * knee);
      soft = (soft * soft) / (4.0 * knee + 0.00001);
      float contribution = max(soft, luminance - bloomThreshold);
      contribution /= max(luminance, 0.00001);
      fragColor = vec4(color.rgb * contribution, color.a);
    }
    `;

    const blur13ShaderChunk = `
    vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
      vec2 resolution = vec2(textureSize(image, 0));
      vec4 color = vec4(0.0);
      vec2 off1 = vec2(1.411764705882353) * direction;
      vec2 off2 = vec2(3.2941176470588234) * direction;
      vec2 off3 = vec2(5.176470588235294) * direction;
      color += texture(image, uv) * 0.1964825501511404;
      color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
      color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
      return color;
    }
    `;

    const blurFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 direction;
    in vec2 vUv;
    out vec4 color;
    ${blur13ShaderChunk}
    void main() {
      color = blur13(inputTexture, vUv, direction);
    }
    `;

    const finalFragmentShader = `
    precision highp float;
    uniform vec2 resolution;
    uniform sampler2D inputTexture;
    uniform sampler2D blur0Texture;
    uniform sampler2D blur1Texture;
    uniform sampler2D blur2Texture;
    uniform sampler2D blur3Texture;
    uniform sampler2D blur4Texture;
    uniform bool bloomEnabled;
    uniform float bloomStrength;
    uniform float vignetteBoost;
    uniform float vignetteReduction;
    uniform float noiseIntensity;
    uniform float time;
    in vec2 vUv;
    out vec4 fragColor;

    float vignette(vec2 uv, float boost, float reduction) {
      vec2 position = vUv - 0.5;
      return boost - length(position) * reduction;
    }

    float hash1(uint n) {
      n = (n << 13U) ^ n;
      n = n * (n * n * 15731U + 789221U) + 1376312589U;
      return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
    }

    float noise(in vec2 uv, in float timeVal) {
      uvec2 p = uvec2(uv);
      return hash1(p.x + 1920U * p.y + (1920U * 1080U) * uint(timeVal));
    }

    void main() {
      vec4 color = texture(inputTexture, vUv);

      if (bloomEnabled && bloomStrength > 0.001) {
        vec4 b0 = texture(blur0Texture, vUv);
        vec4 b1 = texture(blur1Texture, vUv);
        vec4 b2 = texture(blur2Texture, vUv);
        vec4 b3 = texture(blur3Texture, vUv);
        vec4 b4 = texture(blur4Texture, vUv);

        vec4 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
        color += bloomSum * bloomStrength;
      }

      color.rgb *= vignette(vUv, vignetteBoost, vignetteReduction);
      color.rgb += noiseIntensity * noise(gl_FragCoord.xy, time);
      fragColor = vec4(color.rgb, 1.0);
    }
    `;

    const chromaticAberrationShaderChunk = `
    vec2 barrelDistortion(vec2 coord, float amt) {
      vec2 cc = coord - 0.5;
      float dist = dot(cc, cc);
      return coord + cc * dist * amt;
    }
    float sat(float t) { return clamp(t, 0.0, 1.0); }
    float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
    float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
    vec4 spectrum_offset(float t) {
      float lo = step(t, 0.5);
      float hi = 1.0 - lo;
      float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
      vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
      return pow(ret, vec4(1.0 / 2.2));
    }
    const float max_distort = 2.2;
    const int num_iter = 8;
    const float reci_num_iter_f = 1.0 / float(num_iter);
    vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
      vec4 sumcol = vec4(0.0);
      vec4 sumw = vec4(0.0);
      for (int i = 0; i < num_iter; ++i) {
        float t = float(i) * reci_num_iter_f;
        vec4 w = spectrum_offset(t);
        sumw += w;
        sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
      }
      return sumcol / sumw;
    }
    `;

    const colorFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float chromaticAberrationAmount;
    uniform float minInputLevel;
    uniform float maxInputLevel;
    uniform float gammaLevel;
    uniform float fisheyeStrength;
    uniform float fisheyeRadius;
    uniform float time;
    in vec2 vUv;
    out vec4 fragColor;

    ${chromaticAberrationShaderChunk}

    vec2 applyFisheye(vec2 uv, float strength, float radius) {
      if (abs(strength) < 0.0001) return uv;
      vec2 p = uv - 0.5;
      float d = length(p);
      if (d > radius * 1.5) return uv;
      float r = d / max(radius, 0.001);
      float theta = atan(p.y, p.x);
      float rDist = r + strength * (r * r * r);
      return 0.5 + vec2(cos(theta), sin(theta)) * (rDist * radius);
    }

    vec3 gammaCorrect(vec3 color, vec3 gamma) {
      return pow(max(color, vec3(0.0)), 1.0 / gamma);
    }
    vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
      return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
    }
    vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
      return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
    }
    void main() {
      vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
      fragColor = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
      fragColor.rgb = finalLevels(fragColor.rgb, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
      fragColor.a = 1.0;
    }
    `;

    const copyFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      fragColor = texture(inputTexture, vUv);
    }
    `;

    function createFBO(w, h, options = {}) {
      return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
        wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
        wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
        minFilter: options.minFilter || THREE.LinearFilter,
        magFilter: options.magFilter || THREE.LinearFilter,
        format: options.format || THREE.RGBAFormat,
        type: options.type || THREE.HalfFloatType,
        stencilBuffer: options.stencilBuffer || false,
        depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : true,
        samples: options.samples || 0,
      });
    }

    class ShaderPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbo = createFBO(1, 1, options);
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
        this.texture = this.fbo.texture;
      }
      render(renderer, toScreen = false) {
        if (!toScreen) {
          renderer.setRenderTarget(this.fbo);
        }
        renderer.render(this.orthoScene, this.orthoCamera);
        if (!toScreen) {
          renderer.setRenderTarget(null);
        }
      }
      setSize(width, height) {
        this.fbo.setSize(Math.max(1, width), Math.max(1, height));
        this.orthoQuad.scale.set(width, height, 1);
      }
    }

    class ShaderPingPongPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
        this.currentFBO = 0;
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
      }
      render(renderer) {
        renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
        renderer.render(this.orthoScene, this.orthoCamera);
        renderer.setRenderTarget(null);
        this.currentFBO = 1 - this.currentFBO;
      }
      get current() { return this.fbos[this.currentFBO]; }
      get texture() { return this.current.texture; }
      setSize(width, height) {
        const w = Math.max(1, width);
        const h = Math.max(1, height);
        this.orthoQuad.scale.set(w, h, 1);
        this.fbos[0].setSize(w, h);
        this.fbos[1].setSize(w, h);
      }
    }

    class BloomPass {
      constructor(strength = 0.8, radius = 0.5, threshold = 0.2, levels = 5) {
        this.strength = strength;
        this.radius = radius;
        this.threshold = threshold;
        this.enabled = true;
        this.levels = levels;

        this.brightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            bloomThreshold: { value: this.threshold },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: brightFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.brightPass = new ShaderPass(this.brightShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.blurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            direction: { value: new THREE.Vector2(0, 1) },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: blurFragmentShader,
          glslVersion: THREE.GLSL3,
        });

        this.blurPasses = [];
        for (let i = 0; i < this.levels; i++) {
          this.blurPasses.push(new ShaderPingPongPass(this.blurShader, {
            format: THREE.RGBAFormat,
            type: THREE.HalfFloatType,
          }));
        }
      }

      setSize(w, h) {
        let tw = Math.max(1, w);
        let th = Math.max(1, h);
        this.brightPass.setSize(tw, th);
        for (let i = 0; i < this.levels; i++) {
          tw = Math.max(1, Math.round(tw / 2));
          th = Math.max(1, Math.round(th / 2));
          this.blurPasses[i].setSize(tw, th);
        }
      }

      set source(texture) {
        this.brightShader.uniforms.inputTexture.value = texture;
      }

      render(renderer) {
        if (!this.enabled || this.strength <= 0.001) return;

        this.brightShader.uniforms.bloomThreshold.value = this.threshold;
        this.brightPass.render(renderer);

        const baseOffset = Math.max(0.1, this.radius * 2.0);
        const u = this.blurShader.uniforms;

        for (let j = 0; j < this.levels; j++) {
          const blurPass = this.blurPasses[j];
          const stepOffset = baseOffset * (1.0 + j * 0.5);

          u.direction.value.set(stepOffset, 0);
          u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
          blurPass.render(renderer);

          u.direction.value.set(0, stepOffset * 0.5);
          u.inputTexture.value = blurPass.current.texture;
          blurPass.render(renderer);
        }
      }
    }

    class PostProcessor {
      constructor(renderer, params = {}) {
        this.renderer = renderer;

        this.settings = {
          enabled: params.enabled !== undefined ? params.enabled : true,
          bloomEnabled: params.bloomEnabled !== undefined ? params.bloomEnabled : true,
          bloomStrength: params.bloomStrength !== undefined ? params.bloomStrength : 0.8,
          bloomRadius: params.bloomRadius !== undefined ? params.bloomRadius : 0.5,
          bloomThreshold: params.bloomThreshold !== undefined ? params.bloomThreshold : 0.2,

          fisheyeStrength: params.fisheyeStrength !== undefined ? params.fisheyeStrength : 0.0,
          fisheyeRadius: params.fisheyeRadius !== undefined ? params.fisheyeRadius : 1.0,
          chromaticAberration: params.chromaticAberration !== undefined ? params.chromaticAberration : 0.04,
          vignetteBoost: params.vignetteBoost !== undefined ? params.vignetteBoost : 1.0,
          vignetteReduction: params.vignetteReduction !== undefined ? params.vignetteReduction : 0.5,
          noiseIntensity: params.noiseIntensity !== undefined ? params.noiseIntensity : 0.02,

          gamma: params.gamma !== undefined ? params.gamma : 1.0,
          minInputLevel: params.minInputLevel !== undefined ? params.minInputLevel : 0.0,
          maxInputLevel: params.maxInputLevel !== undefined ? params.maxInputLevel : 1.0,
        };

        this.sceneTarget = createFBO(1, 1, { type: THREE.HalfFloatType });

        this.bloomPass = new BloomPass(
          this.settings.bloomStrength,
          this.settings.bloomRadius,
          this.settings.bloomThreshold,
          5
        );

        this.finalShader = new THREE.RawShaderMaterial({
          uniforms: {
            resolution: { value: new THREE.Vector2(1, 1) },
            bloomEnabled: { value: this.settings.bloomEnabled },
            bloomStrength: { value: this.settings.bloomStrength },
            vignetteBoost: { value: this.settings.vignetteBoost },
            vignetteReduction: { value: this.settings.vignetteReduction },
            noiseIntensity: { value: this.settings.noiseIntensity },
            inputTexture: { value: null },
            blur0Texture: { value: null },
            blur1Texture: { value: null },
            blur2Texture: { value: null },
            blur3Texture: { value: null },
            blur4Texture: { value: null },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: finalFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.finalPass = new ShaderPass(this.finalShader);

        this.rgbShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: this.finalPass.texture },
            fisheyeStrength: { value: this.settings.fisheyeStrength },
            fisheyeRadius: { value: this.settings.fisheyeRadius },
            chromaticAberrationAmount: { value: this.settings.chromaticAberration },
            minInputLevel: { value: this.settings.minInputLevel },
            maxInputLevel: { value: this.settings.maxInputLevel },
            gammaLevel: { value: this.settings.gamma },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: colorFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.rgbPass = new ShaderPass(this.rgbShader);

        this.copyShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: copyFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.copyPass = new ShaderPass(this.copyShader);
      }

      updateSettings() {
        this.bloomPass.enabled = this.settings.bloomEnabled;
        this.bloomPass.strength = this.settings.bloomStrength;
        this.bloomPass.radius = this.settings.bloomRadius;
        this.bloomPass.threshold = this.settings.bloomThreshold;

        this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
        this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
        this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
        this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
        this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;

        this.rgbShader.uniforms.fisheyeStrength.value = this.settings.fisheyeStrength;
        this.rgbShader.uniforms.fisheyeRadius.value = this.settings.fisheyeRadius;
        this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
        this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
        this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
        this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
      }

      setSize(w0, h0, dpr = 1) {
        const w = Math.max(1, Math.floor(w0 * dpr));
        const h = Math.max(1, Math.floor(h0 * dpr));
        this.sceneTarget.setSize(w, h);
        this.finalPass.setSize(w, h);
        this.finalShader.uniforms.resolution.value.set(w, h);
        this.bloomPass.setSize(w, h);
        this.rgbPass.setSize(w, h);
        this.copyPass.setSize(w, h);
      }

      renderScene(scene, camera) {
        if (!this.settings.enabled) {
          this.renderer.render(scene, camera);
          return;
        }
        this.renderer.setRenderTarget(this.sceneTarget);
        this.renderer.render(scene, camera);
        this.renderer.setRenderTarget(null);
        this.render(this.sceneTarget.texture);
      }

      render(sourceTexture) {
        if (!this.settings.enabled) {
          this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
          this.copyPass.render(this.renderer, true);
          return;
        }

        this.updateSettings();

        this.bloomPass.source = sourceTexture;
        this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
        this.bloomPass.render(this.renderer);

        this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
        this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
        this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
        this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
        this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

        const randomTime = Math.random() * 100000;
        this.finalPass.shader.uniforms.time.value = randomTime;
        this.rgbPass.shader.uniforms.time.value = randomTime;

        this.finalPass.render(this.renderer);
        this.rgbPass.render(this.renderer, true);
      }

      attachGUI(gui, title = "Post-Processing Suite") {
        const root = gui.addFolder(title);
        root.add(this.settings, "enabled").name("Enable Suite");

        const bloom = root.addFolder("Bloom");
        bloom.add(this.settings, "bloomEnabled").name("Enable Bloom").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomStrength", 0, 3.0, 0.05).name("Strength").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomRadius", 0, 2.0, 0.05).name("Radius").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomThreshold", 0, 1.0, 0.01).name("Threshold").onChange(() => this.updateSettings());

        const lens = root.addFolder("Lens, Optics & Tone");
        lens.add(this.settings, "fisheyeStrength", -1.0, 1.5, 0.01).name("Fisheye Distortion").onChange(() => this.updateSettings());
        lens.add(this.settings, "fisheyeRadius", 0.2, 2.0, 0.05).name("Fisheye Radius").onChange(() => this.updateSettings());
        lens.add(this.settings, "chromaticAberration", 0, 0.2, 0.005).name("Chromatic Aberration").onChange(() => this.updateSettings());
        lens.add(this.settings, "vignetteBoost", 0, 2.0, 0.05).name("Vignette Boost").onChange(() => this.updateSettings());
        lens.add(this.settings, "vignetteReduction", 0, 2.0, 0.05).name("Vignette Falloff").onChange(() => this.updateSettings());
        lens.add(this.settings, "noiseIntensity", 0, 0.1, 0.005).name("Film Grain").onChange(() => this.updateSettings());
        lens.add(this.settings, "gamma", 0.2, 2.0, 0.05).name("Gamma").onChange(() => this.updateSettings());
        lens.add(this.settings, "minInputLevel", 0, 0.5, 0.01).name("Black Level").onChange(() => this.updateSettings());
        lens.add(this.settings, "maxInputLevel", 0.5, 1.0, 0.01).name("White Level").onChange(() => this.updateSettings());

        return root;
      }
    }

    // --- COLOR SCHEMES CONFIGURATION (EXACTLY 18 PRECONFIGURED SCHEMES) ---

    // --- PROCEDURAL ANTIQUE RELIEF TEXTURE FOR CARVED FRAME ---
    function createAntiqueReliefTexture() {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 512;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#808080';
      ctx.fillRect(0, 0, 512, 512);

      for (let i = 0; i < 512; i += 16) {
        ctx.fillStyle = (i % 32 === 0) ? '#a8a8a8' : '#585858';
        ctx.fillRect(i, 0, 8, 512);
      }
      for (let y = 64; y < 512; y += 128) {
        for (let x = 64; x < 512; x += 128) {
          const grad = ctx.createRadialGradient(x, y, 4, x, y, 42);
          grad.addColorStop(0, '#ffffff');
          grad.addColorStop(0.4, '#404040');
          grad.addColorStop(0.8, '#a0a0a0');
          grad.addColorStop(1, '#808080');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(x, y, 42, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      const imgData = ctx.getImageData(0, 0, 512, 512);
      const d = imgData.data;
      for (let i = 0; i < d.length; i += 4) {
        const noise = (Math.random() - 0.5) * 32;
        d[i] = Math.min(255, Math.max(0, d[i] + noise));
        d[i+1] = Math.min(255, Math.max(0, d[i+1] + noise));
        d[i+2] = Math.min(255, Math.max(0, d[i+2] + noise));
      }
      ctx.putImageData(imgData, 0, 0);

      const texture = new THREE.CanvasTexture(c);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(4, 4);
      return texture;
    }

      shape.quadraticCurveTo(w * 0.88, h * 0.85, 0, h);

    const mirrorPortalGeo = new THREE.ShapeGeometry(innerAperture, 64);

    const minY = -mirrorHeight * 0.5;
    const maxY = mirrorHeight * 0.5;

    for (let i = 0; i < posAttr.count; i++) {
      const x = posAttr.getX(i);
      const y = posAttr.getY(i);
      uvs[i * 2] = (x - minX) / (maxX - minX);
      uvs[i * 2 + 1] = (y - minY) / (maxY - minY);
    }
    mirrorPortalGeo.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));

    const mirrorPortalUniforms = {

      uGlowColor: { value: new THREE.Color(settings.glowColor) },
      uParallaxIntensity: { value: settings.parallaxStrength }
    };

    const mirrorPortalMat = new THREE.ShaderMaterial({
      uniforms: mirrorPortalUniforms,
      vertexShader: `
        varying vec2 vUv;
        varying vec4 vScreenPos;
        varying vec3 vWorldNormal;
        varying vec3 vViewDir;

        void main() {
          vUv = uv;
          vec4 worldPos = modelMatrix * vec4(position, 1.0);
          vWorldNormal = normalize(mat3(modelMatrix) * normal);
          vViewDir = normalize(cameraPosition - worldPos.xyz);

          vec4 clipPos = projectionMatrix * viewMatrix * worldPos;
          vScreenPos = clipPos;
          gl_Position = clipPos;
        }
      `,
      fragmentShader: `
        uniform sampler2D uVoidTexture;
        uniform float uTime;
        uniform float uDistortion;
        uniform float uVortexStrength;
        uniform float uChromaticAberration;
        uniform vec3 uMirrorTint;
        uniform vec3 uGlowColor;
        uniform float uParallaxIntensity;

        varying vec2 vUv;
        varying vec4 vScreenPos;
        varying vec3 vWorldNormal;
        varying vec3 vViewDir;

        void main() {
          vec2 screenUv = (vScreenPos.xy / vScreenPos.w) * 0.5 + 0.5;
          vec3 viewNorm = normalize(vViewDir);
          vec2 parallaxOffset = vec2(-viewNorm.x, viewNorm.y) * (0.07 * uParallaxIntensity);

          vec2 baseUv = mix(screenUv, vUv, 0.42) + parallaxOffset;
          baseUv = (baseUv - vec2(0.5)) * 0.94 + vec2(0.5);

          vec2 toCenter = vUv - vec2(0.5, 0.48);
          float dist = length(toCenter);
          float angle = atan(toCenter.y, toCenter.x);
          float swirlFactor = sin(dist * 10.0 - uTime * 1.8) * (0.04 * uVortexStrength) * (1.0 - smoothstep(0.08, 0.85, dist));

          vec2 distortedUv = baseUv + vec2(cos(angle + swirlFactor), sin(angle + swirlFactor)) * (0.02 * uDistortion);

          float ripple = sin(vUv.x * 20.0 + uTime * 2.2) * cos(vUv.y * 20.0 + uTime * 1.9) * (0.0035 * uDistortion);
          distortedUv += ripple;
          distortedUv = clamp(distortedUv, 0.002, 0.998);

          vec2 caOffset = normalize(toCenter + 0.0001) * (uChromaticAberration * 0.009);
          float r = texture2D(uVoidTexture, clamp(distortedUv + caOffset, 0.002, 0.998)).r;
          float g = texture2D(uVoidTexture, clamp(distortedUv, 0.002, 0.998)).g;
          float b = texture2D(uVoidTexture, clamp(distortedUv - caOffset, 0.002, 0.998)).b;
          vec3 voidCol = vec3(r, g, b);

          float edgeDist = min(min(vUv.x, 1.0 - vUv.x), min(vUv.y, 1.0 - vUv.y));
          float edgeVignette = smoothstep(0.006, 0.07, edgeDist);

          float fresnel = pow(1.0 - max(dot(vWorldNormal, viewNorm), 0.0), 3.0);
          vec3 glassReflection = uGlowColor * fresnel * 0.55;

          float leftCandleGlint = exp(-distance(vUv, vec2(0.18, 0.48)) * 22.0) * 0.35;
          float rightCandleGlint = exp(-distance(vUv, vec2(0.82, 0.48)) * 22.0) * 0.35;
          vec3 candleHighlights = uGlowColor * (leftCandleGlint + rightCandleGlint);

          vec3 finalColor = mix(vec3(0.015, 0.01, 0.025), voidCol * uMirrorTint, edgeVignette);
          finalColor += glassReflection + candleHighlights;
          finalColor += uGlowColor * (1.0 - edgeVignette) * 0.35;

          gl_FragColor = vec4(finalColor, 1.0);
        }
      `,
      side: THREE.FrontSide
    });

    const mirrorPortalMesh = new THREE.Mesh(mirrorPortalGeo, mirrorPortalMat);
    mirrorPortalMesh.position.z = 0.04;
    mirrorGroup.add(mirrorPortalMesh);

    // --- MAIN SCENE ATMOSPHERE & MULTI-LIGHT SETUP ---
    const mainAmbientLight = new THREE.AmbientLight(0xffffff, 0.75);
    mainScene.add(mainAmbientLight);

    const mainDirLight = new THREE.DirectionalLight(0xffeedd, 2.2);
    mainDirLight.position.set(4, 5, 8);
    mainDirLight.castShadow = true;
    mainScene.add(mainDirLight);

    const fillLight = new THREE.DirectionalLight(0xccddff, 1.4);
    fillLight.position.set(-5, -2, 6);

    const topAccentLight = new THREE.DirectionalLight(new THREE.Color(settings.glowColor), 1.6);
    topAccentLight.position.set(0, 7, 4);
    mainScene.add(topAccentLight);

    const rimLight = new THREE.DirectionalLight(new THREE.Color(settings.glowColor), 1.2);
    rimLight.position.set(0, -4, -6);
    mainScene.add(rimLight);

    // Floating Dust Embers
    const emberCount = 200;
    const emberGeo = new THREE.BufferGeometry();
    const emberPositions = new Float32Array(emberCount * 3);
    for (let i = 0; i < emberCount * 3; i += 3) {
      emberPositions[i] = (Math.random() - 0.5) * 16;
      emberPositions[i + 1] = (Math.random() - 0.5) * 14;
      emberPositions[i + 2] = (Math.random() - 0.5) * 10 + 1;
    }
    emberGeo.setAttribute('position', new THREE.BufferAttribute(emberPositions, 3));
    const emberMat = new THREE.PointsMaterial({
      color: new THREE.Color(settings.glowColor),
      size: 0.07,
      transparent: true,
      opacity: 0.65,
      blending: THREE.AdditiveBlending
    });
    const emberParticles = new THREE.Points(emberGeo, emberMat);
    mainScene.add(emberParticles);

    // --- PARALLAX VOID SUB-SCENE ---
    // 1. Singularity Core
    const singularityGeo = new THREE.SphereGeometry(2.2, 48, 48);
    const singularityMat = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 },
        uCoreColor: { value: new THREE.Color(settings.voidCoreColor) },
        uGlowColor: { value: new THREE.Color(settings.glowColor) }
      },
      vertexShader: `
        varying vec3 vNormal;
        varying vec3 vPosition;
        void main() {
          vNormal = normalize(normalMatrix * normal);
          vPosition = position;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform float uTime;
        uniform vec3 uCoreColor;
        uniform vec3 uGlowColor;
        varying vec3 vNormal;
        varying vec3 vPosition;

        void main() {
          float pulse = sin(uTime * 3.0 + vPosition.y * 2.5) * 0.5 + 0.5;
          float rim = 1.0 - max(dot(vNormal, vec3(0.0, 0.0, 1.0)), 0.0);
          rim = pow(rim, 2.2);

          vec3 col = mix(vec3(0.01, 0.005, 0.02), uCoreColor * 1.5, rim + pulse * 0.25);
          col += uGlowColor * pow(rim, 3.5) * 2.5;

          gl_FragColor = vec4(col, 1.0);
        }
      `
    });
    const singularityMesh = new THREE.Mesh(singularityGeo, singularityMat);
    singularityMesh.position.set(0, 0, -6.5);
    voidScene.add(singularityMesh);

    // 2. Accretion Disk
    const accretionGeo = new THREE.RingGeometry(2.6, 9.2, 72);
    const accretionMat = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 },
        uColor: { value: new THREE.Color(settings.voidParticlesColor) },
        uGlow: { value: new THREE.Color(settings.glowColor) }
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform float uTime;
        uniform vec3 uColor;
        uniform vec3 uGlow;
        varying vec2 vUv;
        void main() {
          vec2 p = vUv - vec2(0.5);
          float r = length(p) * 2.0;
          float a = atan(p.y, p.x);
          float spiral = sin(a * 5.0 - r * 18.0 + uTime * 3.8);
          float alpha = smoothstep(0.32, 0.48, r) * (1.0 - smoothstep(0.85, 1.0, r));
          alpha *= (spiral * 0.4 + 0.6);
          vec3 c = mix(uColor * 2.0, uGlow * 2.5, spiral * 0.5 + 0.5);
          gl_FragColor = vec4(c, alpha * 0.9);
        }
      `,
      transparent: true,
      side: THREE.DoubleSide,
      blending: THREE.AdditiveBlending
    });
    const accretionMesh = new THREE.Mesh(accretionGeo, accretionMat);
    accretionMesh.position.set(0, 0, -6.5);
    accretionMesh.rotation.set(1.15, 0.25, 0);
    voidScene.add(accretionMesh);

    // 3. Concentric Armillary Gyroscope Rings
    const gyroGroup = new THREE.Group();
    gyroGroup.position.set(0, 0, -6.5);

    const ringMat = new THREE.MeshStandardMaterial({

    const gyroRing1 = new THREE.Mesh(new THREE.TorusGeometry(3.6, 0.08, 8, 64), ringMat);
    const gyroRing2 = new THREE.Mesh(new THREE.TorusGeometry(4.9, 0.08, 8, 64), ringMat);
    const gyroRing3 = new THREE.Mesh(new THREE.TorusGeometry(6.2, 0.08, 8, 64), ringMat);
    gyroGroup.add(gyroRing1, gyroRing2, gyroRing3);

    const icosaGeo = new THREE.IcosahedronGeometry(2.0, 0);
    const icosaMat = new THREE.MeshStandardMaterial({
      color: new THREE.Color(settings.voidCoreColor),
      wireframe: true,
      roughness: 0.15,

    });
    const icosaMesh = new THREE.Mesh(icosaGeo, icosaMat);
    gyroGroup.add(icosaMesh);

    const octaGeo = new THREE.OctahedronGeometry(1.15, 0);
    const octaMat = new THREE.MeshStandardMaterial({

    const octaMesh = new THREE.Mesh(octaGeo, octaMat);
    gyroGroup.add(octaMesh);

    voidScene.add(gyroGroup);

    // 4. Floating Crystals
    const shardGroup = new THREE.Group();
    const shardCount = 36;
    const shards = [];
    const shardMat = new THREE.MeshStandardMaterial({
      color: new THREE.Color(settings.voidArtifacts),
      metalness: 0.88,
      roughness: 0.22
    });

    for (let i = 0; i < shardCount; i++) {
      const scale = 0.4 + Math.random() * 0.7;
      const geo = (i % 3 === 0) 
        ? new THREE.OctahedronGeometry(scale, 0)
        : (i % 3 === 1) 
          ? new THREE.ConeGeometry(scale * 0.7, scale * 2.4, 5)
          : new THREE.DodecahedronGeometry(scale * 0.8, 0);

      const shard = new THREE.Mesh(geo, shardMat);
      const angle = (i / shardCount) * Math.PI * 2 + Math.random() * 0.5;
      const radius = 2.8 + Math.random() * 5.5;
      const zPos = -1.5 - Math.random() * 16;

      shard.position.set(
        Math.cos(angle) * radius,
        Math.sin(angle) * radius + (Math.random() - 0.5) * 2.5,
        zPos
      );

      shard.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
      shard.userData = {
        rotSpeedX: (Math.random() - 0.5) * 0.9,
        rotSpeedY: (Math.random() - 0.5) * 0.9,
        rotSpeedZ: (Math.random() - 0.5) * 0.9,
        orbitSpeed: (0.12 + Math.random() * 0.22) * (Math.random() > 0.5 ? 1 : -1),
        radius: radius,
        baseAngle: angle,
        baseY: shard.position.y,
        bobSpeed: 0.6 + Math.random() * 1.5
      };

      shardGroup.add(shard);
      shards.push(shard);
    }
    voidScene.add(shardGroup);

    // 5. Dynamic Cosmic Swirling Particle Vortex
    const vortexParticleCount = 4800;
    const vortexGeo = new THREE.BufferGeometry();
    const vortexPositions = new Float32Array(vortexParticleCount * 3);
    const vortexMeta = [];

    for (let i = 0; i < vortexParticleCount; i++) {
      const arm = i % 4;
      const t = Math.pow(Math.random(), 1.4);
      const radius = 0.8 + t * 11.5;
      const angle = (arm * (Math.PI * 0.5)) + (radius * 1.2) + (Math.random() - 0.5) * 0.45;
      const depth = -1 - t * 22;

      const x = Math.cos(angle) * radius;
      const y = Math.sin(angle) * radius;
      const z = depth;

      vortexPositions[i * 3] = x;
      vortexPositions[i * 3 + 1] = y;
      vortexPositions[i * 3 + 2] = z;

      vortexMeta.push({
        radius,
        baseAngle: angle,
        speed: (0.35 + (1.2 / (radius + 0.3)) * 1.8) * 0.5,
        driftZ: 0.25 + Math.random() * 0.6,
        arm
      });
    }

    vortexGeo.setAttribute('position', new THREE.BufferAttribute(vortexPositions, 3));
    const vortexMat = new THREE.PointsMaterial({

      opacity: 0.85,

    });
    const vortexMesh = new THREE.Points(vortexGeo, vortexMat);
    voidScene.add(vortexMesh);

    // --- APPLY COLOR THEME FUNCTION ---
    function applyColorScheme(schemeName) {
      const scheme = COLOR_SCHEMES[schemeName];
      if (!scheme) return;

      settings.frameColor = scheme.framePrimary;
      settings.frameAccentColor = scheme.frameAccent;
      settings.voidCoreColor = scheme.voidCore;
      settings.voidParticlesColor = scheme.voidParticles;
      settings.glowColor = scheme.glow;

      frameMat.color.set(settings.frameColor);
      bezelMat.color.set(settings.frameAccentColor);
      pearlMat.color.set(settings.frameAccentColor);
      gemMat.color.set(settings.voidCoreColor);
      gemMat.emissive.set(settings.voidCoreColor);
      octaMat.color.set(settings.frameAccentColor);
      ringMat.color.set(settings.frameAccentColor);
      shardMat.color.set(scheme.voidArtifacts);

      leftSconce.flame.material.color.set(settings.glowColor);
      rightSconce.flame.material.color.set(settings.glowColor);
      leftSconce.light.color.set(settings.glowColor);
      rightSconce.light.color.set(settings.glowColor);

      topAccentLight.color.set(settings.glowColor);
      rimLight.color.set(settings.glowColor);
      emberMat.color.set(settings.glowColor);
      deepStarMat.color.set(settings.glowColor);

      accretionMat.uniforms.uColor.value.set(settings.voidParticlesColor);
      accretionMat.uniforms.uGlow.value.set(settings.glowColor);
      icosaMat.color.set(settings.voidCoreColor);
      vortexMat.color.set(settings.voidParticlesColor);
      voidCoreLight.color.set(settings.voidCoreColor);
      voidAccentLight.color.set(settings.glowColor);

      mirrorPortalUniforms.uGlowColor.value.set(settings.glowColor);

      updateBackground();
      updateGuiDisplays();
    }

    function updateBackground() {

        mainScene.background = new THREE.Color(0x00ff00);
        renderer.setClearColor(0x00ff00, 1.0);
        mainScene.fog = null;
        postProcessor.settings.enabled = false;
      } else {
        const currentScheme = COLOR_SCHEMES[settings.colorScheme];
        const bgColor = new THREE.Color(currentScheme ? currentScheme.bg : '#0a0a10');
        mainScene.background = bgColor;
        renderer.setClearColor(bgColor, 1.0);
        mainScene.fog = new THREE.FogExp2(bgColor, 0.032);
        postProcessor.settings.enabled = true;

      postProcessor.updateSettings();

    // --- RANDOMIZE PROCEDURAL SCENE GENERATOR ---
    function randomizeScene() {
      const randomIndex = Math.floor(Math.random() * SCHEME_NAMES.length);
      settings.colorScheme = SCHEME_NAMES[randomIndex];

      const randomAnimIndex = Math.floor(Math.random() * ANIMATIONS.length);
      settings.animation = ANIMATIONS[randomAnimIndex];

      settings.animSpeed = +(0.6 + Math.random() * 1.4).toFixed(2);
      settings.parallaxStrength = +(0.8 + Math.random() * 1.4).toFixed(2);
      settings.voidDistortion = +(0.5 + Math.random() * 1.6).toFixed(2);
      settings.vortexStrength = +(0.6 + Math.random() * 1.5).toFixed(2);
      settings.chromaticAberration = +(0.5 + Math.random() * 1.7).toFixed(2);

      for (let i = 0; i < shards.length; i++) {
        const shard = shards[i];
        shard.userData.rotSpeedX = (Math.random() - 0.5) * 1.2;
        shard.userData.rotSpeedY = (Math.random() - 0.5) * 1.2;
        shard.userData.bobSpeed = 0.5 + Math.random() * 1.8;

    // Animation & Motion (8 Preconfigured Modes)
    const fAnim = gui.addFolder('Animations (8 Modes)');

    fAnim.add(settings, 'animSpeed', 0.1, 3.0, 0.05).name('Animation Speed');

    // Portal & Void Optics
    const fOptics = gui.addFolder('Parallax & Void Optics');
    fOptics.add(settings, 'parallaxStrength', 0.2, 3.0, 0.05).name('Parallax Depth');

    fOptics.add(settings, 'vortexStrength', 0.0, 2.5, 0.05).name('Vortex Swirl');
    fOptics.add(settings, 'chromaticAberration', 0.0, 3.0, 0.05).name('Chromatic Aberration');

    // Controls & Quality

    fControls.add(settings, 'dragMode', ['Rotate View', 'Drag / Pan Object']).name('Left-Drag Mode').onChange((val) => {

    fControls.add(settings, 'randomizeOnClick').name('Randomize On Click');

    // Post-Processing Suite Integration (PostProcessor.js)
    postProcessor.attachGUI(gui, 'Post-Processing Suite');

    // Procedural Action Buttons
    gui.add(settings, 'randomize').name('⚡ Procedural Re-Roll');
    gui.add(settings, 'resetCamera').name('↺ Reset View');

    function updateGuiDisplays() {
      gui.controllersRecursive().forEach(ctrl => ctrl.updateDisplay());
    }

    applyColorScheme(settings.colorScheme);

    // --- USER INTERACTION: "H" KEY TO HIDE/SHOW ALL UI ---
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        if (gui._hidden) {
          gui.show();
        } else {
          gui.hide();
        }
      }
    });

    // --- USER INTERACTION: CLICK DETECTION FOR PROCEDURAL RE-ROLL ---
    let pointerDownX = 0;
    let pointerDownY = 0;
    let pointerDownTime = 0;
    let isUserOrbiting = false;

    controls.addEventListener('start', () => {
      isUserOrbiting = true;
    });
    controls.addEventListener('end', () => {
      setTimeout(() => {
        isUserOrbiting = false;
      }, 750);
    });

    window.addEventListener('pointerdown', (e) => {
      pointerDownX = e.clientX;
      pointerDownY = e.clientY;
      pointerDownTime = performance.now();
    });

    window.addEventListener('pointerup', (e) => {
      const dx = e.clientX - pointerDownX;
      const dy = e.clientY - pointerDownY;
      const dt = performance.now() - pointerDownTime;

      if (Math.hypot(dx, dy) < 6 && dt < 400) {
        if (gui && gui.domElement && gui.domElement.contains(e.target)) return;

        if (settings.randomizeOnClick) {
          randomizeScene();
        }
      }
    });

    // --- WINDOW RESIZING ---
    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      voidCamera.aspect = w / h;
      voidCamera.updateProjectionMatrix();

      renderer.setSize(w, h);
      voidRenderTarget.setSize(Math.floor(w * settings.dpr), Math.floor(h * settings.dpr));
      postProcessor.setSize(w, h, settings.dpr);
    });

    // --- AUTO INFINITE ANIMATION LOOP ---
    const clock = new THREE.Clock();
    let animTime = 0;

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const dt = delta * settings.animSpeed;
      animTime += dt;

      // 1. Update Shader Uniforms
      mirrorPortalUniforms.uTime.value = animTime;
      mirrorPortalUniforms.uDistortion.value = settings.voidDistortion;
      mirrorPortalUniforms.uVortexStrength.value = settings.vortexStrength;
      mirrorPortalUniforms.uChromaticAberration.value = settings.chromaticAberration;
      mirrorPortalUniforms.uParallaxIntensity.value = settings.parallaxStrength;

      singularityMat.uniforms.uTime.value = animTime;
      accretionMat.uniforms.uTime.value = animTime;

      // 2. Animate Ornate Mirror Sconces & Flames
      const flickerLeft = Math.sin(animTime * 14.0) * 0.18 + Math.cos(animTime * 23.0) * 0.12;
      const flickerRight = Math.sin(animTime * 17.0) * 0.18 - Math.cos(animTime * 21.0) * 0.12;

      leftSconce.light.intensity = 1.8 + flickerLeft;
      rightSconce.light.intensity = 1.8 + flickerRight;
      leftSconce.flame.scale.set(1 + flickerLeft * 0.4, 1 + flickerLeft * 0.8, 1 + flickerLeft * 0.4);
      rightSconce.flame.scale.set(1 + flickerRight * 0.4, 1 + flickerRight * 0.8, 1 + flickerRight * 0.4);

      const gemPulse = 0.8 + Math.sin(animTime * 2.5) * 0.35;
      gemMat.emissiveIntensity = gemPulse;

      const emberPos = emberGeo.attributes.position.array;
      for (let i = 1; i < emberPositions.length; i += 3) {
        emberPos[i] += dt * 0.28;
        if (emberPos[i] > 7.0) emberPos[i] = -7.0;
      }
      emberGeo.attributes.position.needsUpdate = true;

      // 3. Animate Void Internal Dynamics
      gyroRing1.rotation.x = animTime * 0.28;
      gyroRing1.rotation.y = animTime * 0.20;
      gyroRing2.rotation.y = -animTime * 0.35;
      gyroRing2.rotation.z = animTime * 0.24;
      gyroRing3.rotation.z = animTime * 0.30;
      gyroRing3.rotation.x = -animTime * 0.18;

      icosaMesh.rotation.x = -animTime * 0.45;
      icosaMesh.rotation.y = animTime * 0.55;
      octaMesh.rotation.y = animTime * 0.85;

      accretionMesh.rotation.z = animTime * 0.38;

      for (let i = 0; i < shards.length; i++) {
        const shard = shards[i];
        const u = shard.userData;
        shard.rotation.x += u.rotSpeedX * dt;
        shard.rotation.y += u.rotSpeedY * dt;
        shard.rotation.z += u.rotSpeedZ * dt;

        const currentAngle = u.baseAngle + animTime * u.orbitSpeed;
        shard.position.x = Math.cos(currentAngle) * u.radius;
        shard.position.y = u.baseY + Math.sin(animTime * u.bobSpeed) * 0.5;
      }

      const vPositions = vortexGeo.attributes.position.array;
      for (let i = 0; i < vortexParticleCount; i++) {
        const meta = vortexMeta[i];
        meta.baseAngle += meta.speed * dt;

        const i3 = i * 3;
        vPositions[i3] = Math.cos(meta.baseAngle) * meta.radius;
        vPositions[i3 + 1] = Math.sin(meta.baseAngle) * meta.radius;

        vPositions[i3 + 2] += meta.driftZ * dt;
        if (vPositions[i3 + 2] > 0.5) {
          vPositions[i3 + 2] = -23.0;
        }
      }
      vortexGeo.attributes.position.needsUpdate = true;

      // 4. Smooth Cinematic Preconfigured Camera Animations
      if (settings.animation === 'Static (No Camera Movement)') {
        controls.update();
      } else {
        if (isUserOrbiting) {
          controls.update();
        } else {
          const t = animTime;
          let targetX = 0, targetY = 0, targetZ = 9.2;

          if (settings.animation === 'Gentle Orbit') {
            const r = 9.2;
            targetX = Math.sin(t * 0.22) * r;
            targetZ = Math.cos(t * 0.22) * r;
            targetY = Math.sin(t * 0.14) * 1.5;
          } else if (settings.animation === 'Hypnotic Sway') {
            targetX = Math.sin(t * 0.35) * 3.8;
            targetY = Math.cos(t * 0.25) * 1.8;
            targetZ = 8.5 + Math.cos(t * 0.3) * 1.0;
          } else if (settings.animation === 'Deep Dive') {
            targetX = Math.sin(t * 0.18) * 0.9;
            targetY = Math.cos(t * 0.18) * 0.6;
            targetZ = 6.8 + Math.sin(t * 0.28) * 3.2;
          } else if (settings.animation === 'Figure-Eight Infinity') {
            targetX = Math.sin(t * 0.32) * 4.2;
            targetY = Math.sin(t * 0.64) * 2.0;
            targetZ = 8.6 + Math.cos(t * 0.32) * 1.2;
          } else if (settings.animation === 'Eerie Tilt & Drift') {
            targetX = Math.cos(t * 0.18) * 2.6;
            targetY = Math.sin(t * 0.28) * 2.8;
            targetZ = 8.8 + Math.sin(t * 0.14) * 1.4;
          } else if (settings.animation === 'Mystical Spiral') {
            const r = 8.0 + Math.sin(t * 0.18) * 1.8;
            targetX = Math.sin(t * 0.26) * r;
            targetZ = Math.cos(t * 0.26) * r;
            targetY = Math.cos(t * 0.22) * 2.4;
          } else if (settings.animation === 'Void Pulse') {
            targetX = Math.sin(t * 0.2) * 1.6;
            targetY = Math.cos(t * 0.2) * 1.0;
            targetZ = 8.2 + Math.sin(t * 0.38) * 2.0;
          }

          camera.position.lerp(new THREE.Vector3(
            controls.target.x + targetX,
            controls.target.y + targetY,
            controls.target.z + targetZ
          ), 0.04);
          camera.lookAt(controls.target);
          controls.update();
        }
      }

      // 5. Parallax Void Camera Projection
      voidCamera.fov = camera.fov;
      voidCamera.aspect = camera.aspect;

      const mirrorPos = mirrorGroup.position;
      const camRel = new THREE.Vector3().subVectors(camera.position, mirrorPos);

      voidCamera.position.set(
        -camRel.x * 0.75 * settings.parallaxStrength,
        -camRel.y * 0.75 * settings.parallaxStrength,
        5.5 + camRel.z * 0.35
      );
      voidCamera.lookAt(0, 0, -6.5);
      voidCamera.updateProjectionMatrix();

      // 6. Multi-Pass Rendering: Render Void Sub-Scene to RenderTarget
      renderer.setRenderTarget(voidRenderTarget);
      renderer.clear();
      renderer.render(voidScene, voidCamera);
      renderer.setRenderTarget(null);

      // 7. Render Main Scene through PostProcessor Pipeline
      postProcessor.renderScene(mainScene, camera);
    }

    animate();
  </script>
</body>
