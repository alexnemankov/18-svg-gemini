<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procedural Particle Spiral</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
    }

    body {
      font-size: 62.5%;
      background: #000;
      overflow: hidden;
      color: #FFF;
      font-family: serif;
      overscroll-behavior: none;
    }

    #loading {
      background: black;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      visibility: visible;
      opacity: 1;
      transition: visibility 1.6s, opacity 1.6s;
    }

    #loading .circle {
      width: 50px;
      height: 50px;
      background: white;
      border-radius: 50%;
      opacity: 0;
      transform: scale(0, 0);
      animation: circle-animation 1.6s ease-in-out 0s infinite normal none;
    }

    #loading.loaded {
      visibility: hidden;
      opacity: 0;
    }

    #container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }

    #container .box {
      color: white;
      font-size: 3.2rem;
      position: fixed;
      z-index: 1;
      top: 50%;
      left: 10%;
      transform: translateY(-50%);
      overflow: hidden;
    }

    @keyframes circle-animation {
      0% {
        opacity: 0;
        transform: scale(0, 0);
      }
      50% {
        opacity: 1;
        transform: scale(1, 1);
      }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="circle"></div>
  </div>
  <div id="container">
    <div class="box"></div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.121.1/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.121.1/examples/jsm/controls/OrbitControls.js';
    import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

    // Vertex Shader
    const vertexParticleShader = `
      uniform float uTime;
      uniform float uTimeScale;
      uniform float uNumber;
      uniform float uWaveHeight;
      uniform float uRadiusScale;

      varying vec3 vPos;

      float radian = 0.017453292519944;
      attribute float number;

      void main(){
        vec3 pos = position;
        
        float r = (radian * pos.z) * uRadiusScale;
        float angle = radian * pos.z * abs(uNumber - uTime * uTimeScale);
        pos.x = cos(angle) * r;
        pos.y = sin(angle) * r;
        
        pos.z = sin(length(pos.xy) - uTime) * uWaveHeight;
        
        vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
        vPos = pos;
        
        gl_Position = projectionMatrix * mvPosition;
      }
    `;

    // Fragment Shader
    const fragmentParticleShader = `
      uniform float uTime;
      uniform float uColorSpeed;
      uniform float uColorFrequency;
      uniform int uColorMode; // 0: Cosine formula, 1: Palette ramp, 2: Custom color ramp
      uniform int uColorCount;
      uniform vec3 uColors[6];
      uniform vec3 uCustomColor;

      uniform vec3 uPalA;
      uniform vec3 uPalB;
      uniform vec3 uPalC;
      uniform vec3 uPalD;

      varying vec3 vPos;

      // Inigo Quilez cosine palette function
      vec3 pal(in float t, in vec3 a, in vec3 b, in vec3 c, in vec3 d) {
        return a + b * cos(6.28318530718 * (c * t + d));
      }

      vec3 getColorAt(int idx) {
        if (idx == 0) return uColors[0];
        if (idx == 1) return uColors[1];
        if (idx == 2) return uColors[2];
        if (idx == 3) return uColors[3];
        if (idx == 4) return uColors[4];
        return uColors[5];
      }

      vec3 samplePalette(float t) {
        if (uColorMode == 0) {
          return pal(t, uPalA, uPalB, uPalC, uPalD);
        }

        float cnt = float(uColorCount);
        float f = mod(t, 1.0) * cnt;
        int idx = int(floor(f));
        float frac = smoothstep(0.0, 1.0, fract(f));

        int nextIdx = idx + 1;
        if (nextIdx >= uColorCount) {
          nextIdx = 0;
        }

        vec3 c0 = getColorAt(idx);
        vec3 c1 = getColorAt(nextIdx);

        vec3 col = mix(c0, c1, frac);

        if (uColorMode == 2) {
          col = mix(col, uCustomColor, 0.7);
        }

        return col;
      }

      void main () {
        float len = length(vPos) * 2.0;
        float t = length(len - uTime * uColorSpeed) * uColorFrequency;
        vec3 color = samplePalette(t);
        gl_FragColor = vec4(color, 1.0);
      }
    `;

    // Palette Definitions
    const COLOR_SCHEMES = {
      'Original': {
        mode: 0,
        a: [0.5, 0.5, 0.5],
        b: [0.5, 0.5, 0.5],
        c: [1.0, 1.0, 1.0],
        d: [0.0, 0.10, 0.20]
      },
      'Monochromatic': {
        mode: 1,
        colors: ['#0f2b48', '#1a5276', '#2980b9', '#5dade2', '#aed6f1']
      },
      'Analogous': {
        mode: 1,
        colors: ['#00f5d4', '#00bbf9', '#4361ee', '#7209b7', '#3a0ca3']
      },
      'Complementary': {
        mode: 1,
        colors: ['#ff5400', '#ff8500', '#001219', '#0077b6', '#00b4d8']
      },
      'Split-complementary': {
        mode: 1,
        colors: ['#ff4d6d', '#ff758f', '#06d6a0', '#118ab2', '#073b4c']
      },
      'Triadic': {
        mode: 1,
        colors: ['#ff007f', '#ffaa00', '#00f0ff', '#7a04eb', '#ffe600']
      },
      'Tetradic': {
        mode: 1,
        colors: ['#9b5de5', '#f15bb5', '#fee440', '#00bbf9', '#00f5d4']
      },
      'Double split-complementary': {
        mode: 1,
        colors: ['#f72585', '#7209b7', '#3a0ca3', '#4cc9f0', '#4895ef']
      },
      'Achromatic (black and white)': {
        mode: 1,
        colors: ['#000000', '#222222', '#666666', '#aaaaaa', '#ffffff']
      },
      'Achromatic (white and black)': {
        mode: 1,
        colors: ['#ffffff', '#aaaaaa', '#666666', '#222222', '#000000']
      },
      'Achromatic + Accent (black and white + red)': {
        mode: 1,
        colors: ['#000000', '#444444', '#dddddd', '#ffffff', '#ff0033']
      },
      'Achromatic + Accent (white and black + red)': {
        mode: 1,
        colors: ['#ffffff', '#999999', '#222222', '#000000', '#ff1a1a']
      },
      'Neutral + accent': {
        mode: 1,
        colors: ['#1f1d1d', '#4a4238', '#8c7a6b', '#d3c5b4', '#ff8800']
      },
      'Palette 1 (F6AA1C, BC3908, 941B0C, F6AA1C, 220901)': {
        mode: 1,
        colors: ['#F6AA1C', '#BC3908', '#941B0C', '#F6AA1C', '#220901']
      },
      'Palette 2 (63D1CF, 5BC0BE, 4BAD9E, 4BAD9E, 0B132B, 000000)': {
        mode: 1,
        colors: ['#63D1CF', '#5BC0BE', '#4BAD9E', '#4BAD9E', '#0B132B', '#000000']
      },
      'Palette 3 (AA60C8, D69ADE, C9A3C6, CFB5C2, 0D001D, 120A12)': {
        mode: 1,
        colors: ['#AA60C8', '#D69ADE', '#C9A3C6', '#CFB5C2', '#0D001D', '#120A12']
      },
      'Palette 4 (FEF1BE, FFBA00, 008189, 00474D, 061210)': {
        mode: 1,
        colors: ['#FEF1BE', '#FFBA00', '#008189', '#00474D', '#061210']
      },
      'Palette 5 (D4FFB0, 7FFF00, 00B894, 0A3322, 05140A)': {
        mode: 1,
        colors: ['#D4FFB0', '#7FFF00', '#00B894', '#0A3322', '#05140A']
      },
      'Palette 6 (FFE8CC, FF8C00, C7501A, 3D1050, 0E0618)': {
        mode: 1,
        colors: ['#FFE8CC', '#FF8C00', '#C7501A', '#3D1050', '#0E0618']
      },
      'Palette 7 (E8E0FF, B38FFF, 6A3DE8, 1A1250, 090612)': {
        mode: 1,
        colors: ['#E8E0FF', '#B38FFF', '#6A3DE8', '#1A1250', '#090612']
      },
      'Palette 8 (E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)': {
        mode: 1,
        colors: ['#E0FBFF', '#00F0FF', '#D40078', '#1E0A3D', '#05020F']
      },
      'Custom': {
        mode: 2,
        colors: ['#00f0ff', '#7000ff', '#ff00aa', '#00ffaa', '#ffffff']
      }
    };

    /**
     * Shape class
     */
    class Shape {
      constructor(sketch) {
        this.sketch = sketch;
        this.initialize();
      }

      initialize() {
        this.number = this.sketch.params.number;
        this.particleGeometry = new THREE.BufferGeometry();
        this.positions = new Float32Array(this.number * 3);
        this.numbers = new Float32Array(this.number);

        for (let i = 0; i < this.number; i++) {
          this.positions.set([0, 0, i], i * 3);
          this.numbers.set([Math.random() * 2 - 1], i);
        }

        this.particleGeometry.setAttribute('position', new THREE.BufferAttribute(this.positions, 3));
        this.particleGeometry.setAttribute('number', new THREE.BufferAttribute(this.numbers, 1));

        const dummyVec3Array = [
          new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3(),
          new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3()
        ];

        this.particleMaterial = new THREE.ShaderMaterial({
          side: THREE.DoubleSide,
          uniforms: {
            uTime: { value: 0 },
            uTimeScale: { value: this.sketch.params.uTimeScale },
            uNumber: { value: this.sketch.params.uNumber },
            uWaveHeight: { value: this.sketch.params.waveHeight },
            uRadiusScale: { value: this.sketch.params.radiusScale },
            uColorSpeed: { value: this.sketch.params.colorSpeed },
            uColorFrequency: { value: this.sketch.params.colorFrequency },
            uColorMode: { value: 0 },
            uColorCount: { value: 5 },
            uColors: { value: dummyVec3Array },
            uCustomColor: { value: new THREE.Vector3() },
            uPalA: { value: new THREE.Vector3(0.5, 0.5, 0.5) },
            uPalB: { value: new THREE.Vector3(0.5, 0.5, 0.5) },
            uPalC: { value: new THREE.Vector3(1.0, 1.0, 1.0) },
            uPalD: { value: new THREE.Vector3(0.0, 0.10, 0.20) },
            uResolution: {
              value: new THREE.Vector2(this.sketch.width, this.sketch.height)
            }
          },
          blending: THREE.AdditiveBlending,
          transparent: true,
          vertexShader: vertexParticleShader,
          fragmentShader: fragmentParticleShader
        });

        this.particlePoint = new THREE.Line(this.particleGeometry, this.particleMaterial);
        this.sketch.scene.add(this.particlePoint);

        this.updateColors();
      }

      updateGeometryCount(newCount) {
        if (newCount === this.number && this.particleGeometry) return;
        this.number = newCount;
        if (this.particleGeometry) {
          this.particleGeometry.dispose();
        }
        this.positions = new Float32Array(this.number * 3);
        this.numbers = new Float32Array(this.number);
        for (let i = 0; i < this.number; i++) {
          this.positions.set([0, 0, i], i * 3);
          this.numbers.set([Math.random() * 2 - 1], i);
        }
        this.particleGeometry = new THREE.BufferGeometry();
        this.particleGeometry.setAttribute('position', new THREE.BufferAttribute(this.positions, 3));
        this.particleGeometry.setAttribute('number', new THREE.BufferAttribute(this.numbers, 1));
        this.particlePoint.geometry = this.particleGeometry;
      }

      updateColors() {
        const schemeName = this.sketch.params.colorScheme;
        const scheme = COLOR_SCHEMES[schemeName] || COLOR_SCHEMES['Original'];
        const uniforms = this.particleMaterial.uniforms;

        uniforms.uColorMode.value = scheme.mode;

        if (scheme.mode === 0) {
          uniforms.uPalA.value.set(...scheme.a);
          uniforms.uPalB.value.set(...scheme.b);
          uniforms.uPalC.value.set(...scheme.c);
          uniforms.uPalD.value.set(...scheme.d);
        } else {
          const colors = scheme.colors;
          uniforms.uColorCount.value = colors.length;
          for (let i = 0; i < 6; i++) {
            if (i < colors.length) {
              const c = new THREE.Color(colors[i]);
              uniforms.uColors.value[i].set(c.r, c.g, c.b);
            } else {
              uniforms.uColors.value[i].set(0, 0, 0);
            }
          }
        }

        const customC = new THREE.Color(this.sketch.params.customColor);
        uniforms.uCustomColor.value.set(customC.r, customC.g, customC.b);
      }

      updateParameters(time) {
        const u = this.particleMaterial.uniforms;
        u.uTime.value = time;
        u.uTimeScale.value = this.sketch.params.uTimeScale;
        u.uNumber.value = this.sketch.params.uNumber;
        u.uWaveHeight.value = this.sketch.params.waveHeight;
        u.uRadiusScale.value = this.sketch.params.radiusScale;
        u.uColorSpeed.value = this.sketch.params.colorSpeed;
        u.uColorFrequency.value = this.sketch.params.colorFrequency;
      }

      render(time) {
        this.updateParameters(time);
      }
    }

    /**
     * Sketch class
     */
    class Sketch {
      constructor() {
        this.setupParams();
        this.createCanvas();
        this.setupScene();
        this.setupCamera();
        this.setupControls();
        this.setupShape();
        this.setupGui();
        this.setupEvents();

        this.time = new THREE.Clock(true);
        this.draw();
      }

      setupParams() {
        this.params = {
          // Color & Theme
          colorScheme: 'Original',
          customColor: '#00f0ff',
          colorSpeed: 0.5,
          colorFrequency: 1.0,

          // Background
          greenScreen: false,
          backgroundColor: '#000000',
          blending: 'Additive',

          // Geometry & Motion
          number: 6000,
          uTimeScale: 0.001,
          uNumber: 120.0,
          waveHeight: 3.0,
          radiusScale: 0.05,

          // Interaction
          dragMode: 'Rotate / Orbit',
          clickToRandomize: true,

          // Action helpers
          resetCamera: () => this.resetCameraView(),
          randomizeNow: () => this.randomizeScene()
        };
      }

      createCanvas() {
        this.width = Math.ceil(window.innerWidth);
        this.height = Math.ceil(window.innerHeight);

        this.renderer = new THREE.WebGLRenderer({
          antialias: true,
          alpha: true
        });

        this.renderer.setSize(this.width, this.height);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        this.renderer.setClearColor(0x000000, 1.0);

        this.renderer.domElement.style.position = 'fixed';
        this.renderer.domElement.style.top = '0';
        this.renderer.domElement.style.left = '0';
        this.renderer.domElement.style.width = '100%';
        this.renderer.domElement.style.height = '100%';
        this.renderer.domElement.style.zIndex = '0';
        this.renderer.domElement.style.outline = 'none';

        document.getElementById('container').appendChild(this.renderer.domElement);
      }

      setupScene() {
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0x000000);
      }

      setupCamera() {
        const fov = 70;
        const fovRadian = (fov / 2) * (Math.PI / 180);
        this.dist = this.height / 2 / Math.tan(fovRadian);

        this.camera = new THREE.PerspectiveCamera(
          fov,
          this.width / this.height,
          0.01,
          this.dist * 5
        );

        this.defaultCameraPos = new THREE.Vector3(0, 0, this.dist * 0.008);
        this.camera.position.copy(this.defaultCameraPos);
        this.camera.lookAt(0, 0, 0);
        this.scene.add(this.camera);
      }

      setupControls() {
        this.controls = new OrbitControls(this.camera, this.renderer.domElement);
        this.controls.enableDamping = true;
        this.controls.dampingFactor = 0.05;
        this.controls.enableZoom = true;
        this.controls.zoomSpeed = 1.0;
        this.controls.enablePan = true;
        this.controls.panSpeed = 1.0;
        this.controls.screenSpacePanning = true;

        this.updateDragMode();
      }

      updateDragMode() {
        if (!this.controls) return;
        if (this.params.dragMode === 'Pan / Drag across screen') {
          this.controls.mouseButtons = {
            LEFT: THREE.MOUSE.PAN,
            MIDDLE: THREE.MOUSE.DOLLY,
            RIGHT: THREE.MOUSE.ROTATE
          };
        } else {
          this.controls.mouseButtons = {
            LEFT: THREE.MOUSE.ROTATE,
            MIDDLE: THREE.MOUSE.DOLLY,
            RIGHT: THREE.MOUSE.PAN
          };
        }
      }

      resetCameraView() {
        this.camera.position.copy(this.defaultCameraPos);
        this.camera.lookAt(0, 0, 0);
        this.controls.target.set(0, 0, 0);
        this.controls.update();
      }

      setupShape() {
        this.shapes = [];
        this.shape = new Shape(this);
        this.shapes.push(this.shape);
      }

      updateBackground() {
        const targetColor = this.params.greenScreen ? '#00ff00' : this.params.backgroundColor;
        const threeColor = new THREE.Color(targetColor);

        this.renderer.setClearColor(threeColor, 1.0);
        this.scene.background = threeColor;
        document.body.style.backgroundColor = targetColor;
      }

      updateBlending() {
        if (!this.shape || !this.shape.particleMaterial) return;
        if (this.params.blending === 'Additive') {
          this.shape.particleMaterial.blending = THREE.AdditiveBlending;
        } else {
          this.shape.particleMaterial.blending = THREE.NormalBlending;
        }
        this.shape.particleMaterial.needsUpdate = true;
      }

      setupGui() {
        this.gui = new GUI({ title: 'Scene Controls' });

        // Themes & Colors Folder
        const fTheme = this.gui.addFolder('Color & Scheme');
        fTheme.add(this.params, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Palette Scheme').onChange(() => {
          this.shape.updateColors();
        });
        fTheme.addColor(this.params, 'customColor').name('Custom Color').onChange(() => {
          if (this.params.colorScheme !== 'Custom') {
            this.params.colorScheme = 'Custom';
            this.syncGuiDisplays();
          }
          this.shape.updateColors();
        });
        fTheme.add(this.params, 'colorSpeed', 0.0, 3.0, 0.05).name('Color Speed');
        fTheme.add(this.params, 'colorFrequency', 0.1, 4.0, 0.05).name('Color Frequency');

        // Background Folder
        const fBg = this.gui.addFolder('Background & Display');
        fBg.add(this.params, 'greenScreen').name('Green Screen (#00ff00)').onChange((val) => {
          if (val && this.params.blending === 'Additive') {
            this.params.blending = 'Normal';
            this.updateBlending();
          } else if (!val && this.params.blending === 'Normal') {
            this.params.blending = 'Additive';
            this.updateBlending();
          }
          this.updateBackground();
          this.syncGuiDisplays();
        });
        fBg.addColor(this.params, 'backgroundColor').name('Background Color').onChange(() => {
          if (this.params.greenScreen) {
            this.params.greenScreen = false;
            this.syncGuiDisplays();
          }
          this.updateBackground();
        });
        fBg.add(this.params, 'blending', ['Additive', 'Normal']).name('Blend Mode').onChange(() => {
          this.updateBlending();
        });

        // Geometry & Motion Folder
        const fGeo = this.gui.addFolder('Geometry & Motion');
        fGeo.add(this.params, 'number', 500, 30000, 100).name('Point Count').onFinishChange((val) => {
          this.shape.updateGeometryCount(val);
        });
        fGeo.add(this.params, 'uTimeScale', 0.0001, 0.01, 0.0002).name('Motion Speed');
        fGeo.add(this.params, 'uNumber', 0.0, 360.0, 1.0).name('Geometry Twist');
        fGeo.add(this.params, 'waveHeight', 0.1, 10.0, 0.1).name('Wave Amplitude');
        fGeo.add(this.params, 'radiusScale', 0.01, 0.2, 0.005).name('Radius Scale');

        // Navigation & Camera Folder
        const fNav = this.gui.addFolder('Interaction & Camera');
        fNav.add(this.params, 'dragMode', ['Rotate / Orbit', 'Pan / Drag across screen']).name('Left Drag Mode').onChange(() => {
          this.updateDragMode();
        });
        fNav.add(this.params, 'clickToRandomize').name('Click Scene to Randomize');
        fNav.add(this.params, 'resetCamera').name('Reset Camera');
        fNav.add(this.params, 'randomizeNow').name('Randomize Scene Now');

        fTheme.open();
      }

      syncGuiDisplays() {
        if (!this.gui) return;
        if (typeof this.gui.controllersRecursive === 'function') {
          this.gui.controllersRecursive().forEach(c => c.updateDisplay());
        } else {
          const recurse = (g) => {
            if (g.controllers) g.controllers.forEach(c => c.updateDisplay());
            if (g.folders) g.folders.forEach(f => recurse(f));
          };
          recurse(this.gui);
        }
      }

      randomizeScene() {
        // Random scheme
        const schemeKeys = Object.keys(COLOR_SCHEMES).filter(k => k !== 'Custom');
        const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
        this.params.colorScheme = randomScheme;

        // Randomize motion and geometry parameters
        const counts = [3000, 5000, 6000, 8000, 12000, 16000];
        const newCount = counts[Math.floor(Math.random() * counts.length)];
        this.params.number = newCount;
        this.shape.updateGeometryCount(newCount);

        this.params.uTimeScale = +(0.0004 + Math.random() * 0.004).toFixed(5);
        this.params.uNumber = +(Math.random() * 340 + 20).toFixed(1);
        this.params.waveHeight = +(1.0 + Math.random() * 5.0).toFixed(2);
        this.params.radiusScale = +(0.02 + Math.random() * 0.08).toFixed(3);
        this.params.colorSpeed = +(0.2 + Math.random() * 1.6).toFixed(2);
        this.params.colorFrequency = +(0.4 + Math.random() * 2.0).toFixed(2);

        this.shape.updateColors();
        this.syncGuiDisplays();
      }

      setupEvents() {
        window.addEventListener('resize', this.onResize.bind(this), false);

        // Hide/Show GUI with 'H' or 'h'
        window.addEventListener('keydown', (e) => {
          if (e.key === 'h' || e.key === 'H') {
            if (this.gui) {
              if (this.gui._hidden || this.gui.domElement.style.display === 'none') {
                this.gui.show();
              } else {
                this.gui.hide();
              }
            }
          }
        });

        // Click on scene detection for procedural randomization
        let pointerDownPos = { x: 0, y: 0, time: 0 };
        const dom = this.renderer.domElement;

        dom.addEventListener('pointerdown', (e) => {
          pointerDownPos = { x: e.clientX, y: e.clientY, time: performance.now() };
        });

        dom.addEventListener('pointerup', (e) => {
          const dx = e.clientX - pointerDownPos.x;
          const dy = e.clientY - pointerDownPos.y;
          const dist = Math.hypot(dx, dy);
          const dt = performance.now() - pointerDownPos.time;

          // Pure click condition (short duration, minimal mouse movement)
          if (dist < 6 && dt < 300) {
            if (this.params.clickToRandomize) {
              this.randomizeScene();
            }
          }
        });
      }

      onResize() {
        this.width = Math.ceil(window.innerWidth);
        this.height = Math.ceil(window.innerHeight);

        this.camera.aspect = this.width / this.height;
        this.camera.updateProjectionMatrix();

        this.renderer.setSize(this.width, this.height);
        if (this.shape && this.shape.particleMaterial) {
          this.shape.particleMaterial.uniforms.uResolution.value.set(this.width, this.height);
        }
      }

      draw() {
        const time = this.time.getElapsedTime();

        if (this.controls) {
          this.controls.update();
        }

        for (let i = 0; i < this.shapes.length; i++) {
          this.shapes[i].render(time);
        }

        this.renderer.render(this.scene, this.camera);
        this.animationId = requestAnimationFrame(this.draw.bind(this));
      }
    }

    // Initialize on window load
    window.addEventListener('load', () => {
      const loading = document.getElementById('loading');
      if (loading) {
        loading.classList.add('loaded');
      }

      new Sketch();
    });
  </script>
</body>
</html>
