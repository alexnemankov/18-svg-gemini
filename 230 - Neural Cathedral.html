<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Neural Cathedral - Bioelectric Engine</title>
    <style>
        :root {
            --cyan: #00f0ff;
            --gold: #ffaa00;
            --magenta: #ff00aa;
            --bg-dark: #010204;
            --glass-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0.07) 45%, rgba(0, 240, 255, 0.08));
            --glass-border: rgba(255, 255, 255, 0.24);
            --glass-highlight: rgba(255, 255, 255, 0.42);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
            overflow: hidden;
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: white;
            user-select: none;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
            background: 
                radial-gradient(circle at center, transparent 40%, rgba(0, 0, 0, 0.85) 100%),
                repeating-linear-gradient(0deg, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 1px, transparent 1px, transparent 2px);
            box-shadow: inset 0 0 100px rgba(0,0,0,0.9);
            transition: opacity 0.3s ease;
        }

        .overlay.hidden-overlay {
            opacity: 0;
        }

        .hud-panel {
            position: absolute;
            z-index: 20;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            backdrop-filter: blur(28px) saturate(170%);
            -webkit-backdrop-filter: blur(28px) saturate(170%);
            box-shadow:
                0 18px 45px rgba(0, 0, 0, 0.38),
                inset 0 1px 0 var(--glass-highlight),
                inset 0 -1px 0 rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease, opacity 0.25s ease, transform 0.25s ease;
            pointer-events: auto;
            overflow: hidden;
        }

        #hud-left {
            top: clamp(12px, 3vw, 28px);
            left: clamp(12px, 3vw, 28px);
            padding: 14px;
            width: min(230px, calc(100vw - 24px));
        }

        #hud-right {
            bottom: clamp(12px, 3vw, 28px);
            right: clamp(12px, 3vw, 28px);
            padding: 10px 14px;
            min-width: 130px;
            text-align: right;
        }

        .hud-header {
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 8px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 11px;
            letter-spacing: 2.6px;
            color: var(--cyan);
            margin: 0 0 4px 0;
            font-weight: 700;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
        }

        .subtitle {
            font-size: 8px;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 1.4px;
        }

        .hud-row {
            display: flex;
            justify-content: space-between;
            gap: 18px;
            margin-bottom: 8px;
            font-size: 9px;
            letter-spacing: 0.8px;
        }

        .hud-label {
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
        }

        .hud-value {
            font-weight: 600;
            color: var(--cyan);
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.5);
            transition: color 0.3s, text-shadow 0.3s;
            font-variant-numeric: tabular-nums;
        }

        .value-active { color: var(--gold); text-shadow: 0 0 10px rgba(255, 170, 0, 0.6); }
        .value-refract { color: var(--magenta); text-shadow: 0 0 10px rgba(255, 0, 170, 0.6); }

        .btn-trigger {
            margin-top: 12px;
            width: 100%;
            padding: 9px 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.24);
            color: var(--cyan);
            font-size: 9px;
            letter-spacing: 2px;
            border-radius: 999px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3), 0 0 15px rgba(0, 240, 255, 0.1);
        }

        .btn-trigger:hover {
            background: rgba(0, 240, 255, 0.15);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
        }

        .btn-trigger.disabled {
            border-color: rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.3);
            background: transparent;
            box-shadow: none;
            cursor: not-allowed;
        }

        #cursor {
            position: fixed;
            top: 0; left: 0;
            width: 24px; height: 24px;
            border: 1px solid rgba(0, 240, 255, 0.8);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 9999;
            transition: width 0.2s, height 0.2s, background 0.2s, opacity 0.2s;
            mix-blend-mode: screen;
            box-shadow: 0 0 10px rgba(0,240,255,0.4);
        }
        #cursor.click {
            width: 12px; height: 12px;
            background: var(--cyan);
            border-color: transparent;
        }

        #loader {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-dark);
            z-index: 9000;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            transition: opacity 1s ease;
        }
        .spinner {
            width: 50px; height: 50px;
            border: 2px solid rgba(0,240,255,0.1);
            border-top-color: var(--cyan);
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            margin-bottom: 24px;
            box-shadow: 0 0 20px rgba(0,240,255,0.2);
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* lil-gui positioning & styling integration */
        .lil-gui {
            --background-color: rgba(10, 15, 25, 0.85);
            --text-color: #e0f4ff;
            --title-background-color: rgba(0, 240, 255, 0.15);
            --widget-color: rgba(255, 255, 255, 0.08);
            --hover-color: rgba(0, 240, 255, 0.25);
            --focus-color: rgba(0, 240, 255, 0.4);
            --number-color: #00f0ff;
            --string-color: #ffaa00;
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
            z-index: 25 !important;
            top: clamp(12px, 3vw, 28px) !important;
            right: clamp(12px, 3vw, 28px) !important;
        }

        .ui-hidden {
            opacity: 0 !important;
            pointer-events: none !important;
            transform: scale(0.96);
        }

        @media (max-width: 720px) {
            .overlay {
                background:
                    radial-gradient(circle at center, transparent 52%, rgba(0, 0, 0, 0.78) 100%),
                    repeating-linear-gradient(0deg, rgba(0,0,0,0.12) 0px, rgba(0,0,0,0.12) 1px, transparent 1px, transparent 2px);
                box-shadow: inset 0 0 60px rgba(0,0,0,0.82);
            }

            #hud-left {
                top: max(10px, env(safe-area-inset-top));
                left: 10px;
                right: auto;
                width: min(220px, calc(100vw - 20px));
                padding: 8px 9px;
                border-radius: 13px;
            }

            #hud-right {
                right: 10px;
                bottom: max(14px, env(safe-area-inset-bottom));
                padding: 8px 10px;
                min-width: 112px;
            }

            .lil-gui {
                top: auto !important;
                bottom: max(60px, env(safe-area-inset-bottom)) !important;
                right: 10px !important;
                max-width: 200px;
            }

            .hud-header {
                display: flex;
                align-items: baseline;
                justify-content: space-between;
                gap: 8px;
                padding-bottom: 5px;
                margin-bottom: 6px;
            }

            h1 {
                font-size: 9px;
                letter-spacing: 1.5px;
                margin-bottom: 0;
            }

            .subtitle {
                font-size: 6px;
                letter-spacing: 0.7px;
                text-align: right;
            }

            .hud-row {
                gap: 10px;
                margin-bottom: 4px;
                font-size: 7px;
                letter-spacing: 0.55px;
            }

            .btn-trigger {
                margin-top: 6px;
                padding: 6px 8px;
                font-size: 7px;
                letter-spacing: 1.2px;
            }

            #cursor {
                display: none;
            }
        }

        @media (max-width: 420px) {
            #hud-left {
                display: grid;
                grid-template-columns: 1fr 1fr;
                column-gap: 10px;
                row-gap: 0;
                width: min(236px, calc(100vw - 16px));
                left: 8px;
                top: max(8px, env(safe-area-inset-top));
                padding: 7px 8px;
            }

            .hud-header,
            .btn-trigger {
                grid-column: 1 / -1;
            }

            .hud-header {
                display: block;
            }

            .subtitle {
                display: none;
            }

            .hud-row {
                gap: 6px;
                margin-bottom: 4px;
            }

            .hud-label {
                max-width: 60px;
            }
        }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
                "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
            }
        }
    </script>
</head>
<body>

<div class="overlay" id="scene-overlay"></div>
<div id="cursor"></div>

<div id="loader">
    <div class="spinner"></div>
    <h1 style="color: rgba(255,255,255,0.6); font-size: 11px;">INITIALIZING BIOELECTRIC ENGINE</h1>
</div>

<div id="hud-left" class="hud-panel">
    <div class="hud-header">
        <h1 id="hud-title">Neural Cathedral</h1>
        <div class="subtitle" id="hud-subtitle">ID: NC-09 // BIOELECTRIC ENGINE</div>
    </div>
    <div class="hud-row">
        <span class="hud-label">Membrane V</span>
        <span class="hud-value" id="val-membrane">-70.0 mV</span>
    </div>
    <div class="hud-row">
        <span class="hud-label">Dendrite State</span>
        <span class="hud-value" id="val-dendrites">CALM</span>
    </div>
    <div class="hud-row">
        <span class="hud-label">Axon Load</span>
        <span class="hud-value" id="val-axon">02%</span>
    </div>
    <div class="hud-row">
        <span class="hud-label">Signal Phase</span>
        <span class="hud-value" id="val-state">RESTING</span>
    </div>
    <div class="hud-row">
        <span class="hud-label">Synaptic Coh</span>
        <span class="hud-value" id="val-sync">24%</span>
    </div>
    
    <button class="btn-trigger" id="btn-fire">Manual Override</button>
</div>

<div id="hud-right" class="hud-panel">
    <div class="hud-row">
        <span class="hud-label">Cam X</span>
        <span class="hud-value" id="val-cam-x">0.00</span>
    </div>
    <div class="hud-row">
        <span class="hud-label">Cam Y</span>
        <span class="hud-value" id="val-cam-y">0.00</span>
    </div>
    <div class="hud-row">
        <span class="hud-label">Cam Z</span>
        <span class="hud-value" id="val-cam-z">0.00</span>
    </div>
</div>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import GUI from 'lil-gui';

    // --- Cursor Follower ---
    const cursor = document.getElementById('cursor');
    document.addEventListener('mousemove', (e) => {
        cursor.style.left = e.clientX + 'px';
        cursor.style.top = e.clientY + 'px';
    });
    document.addEventListener('mousedown', () => cursor.classList.add('click'));
    document.addEventListener('mouseup', () => cursor.classList.remove('click'));

    // --- Shaders ---
    const shaderNoise = `
        vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
        vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
        float snoise(vec3 v) {
            const vec2  C = vec2(1.0/6.0, 1.0/3.0);
            const vec4  D = vec4(0.0, 0.5, 1.0, 2.0);
            vec3 i  = floor(v + dot(v, C.yyy));
            vec3 x0 = v - i + dot(i, C.xxx);
            vec3 g = step(x0.yzx, x0.xyz);
            vec3 l = 1.0 - g;
            vec3 i1 = min( g.xyz, l.zxy );
            vec3 i2 = max( g.xyz, l.zxy );
            vec3 x1 = x0 - i1 + C.xxx;
            vec3 x2 = x0 - i2 + C.yyy;
            vec3 x3 = x0 - D.yyy;
            i = mod289(i);
            vec4 p = permute( permute( permute(
                        i.z + vec4(0.0, i1.z, i2.z, 1.0 ))
                    + i.y + vec4(0.0, i1.y, i2.y, 1.0 ))
                    + i.x + vec4(0.0, i1.x, i2.x, 1.0 ));
            float n_ = 0.142857142857;
            vec3  ns = n_ * D.wyz - D.xzx;
            vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
            vec4 x_ = floor(j * ns.z);
            vec4 y_ = floor(j - 7.0 * x_ );
            vec4 x = x_ *ns.x + ns.yyyy;
            vec4 y = y_ *ns.x + ns.yyyy;
            vec4 h = 1.0 - abs(x) - abs(y);
            vec4 b0 = vec4( x.xy, y.xy );
            vec4 b1 = vec4( x.zw, y.zw );
            vec4 s0 = floor(b0)*2.0 + 1.0;
            vec4 s1 = floor(b1)*2.0 + 1.0;
            vec4 sh = -step(h, vec4(0.0));
            vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
            vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
            vec3 p0 = vec3(a0.xy,h.x);
            vec3 p1 = vec3(a0.zw,h.y);
            vec3 p2 = vec3(a1.xy,h.z);
            vec3 p3 = vec3(a1.zw,h.w);
            vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
            p0 *= norm.x;
            p1 *= norm.y;
            p2 *= norm.z;
            p3 *= norm.w;
            vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
            m = m * m;
            return 42.0 * dot( m*m, vec4( dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3) ) );
        }
    `;

    // --- Color Presets (5 original & scene-fitted palettes) ---
    const COLOR_PRESETS = {
        'Bioelectric Core': {
            cyan: '#00e5ff',
            blue: '#0033aa',
            gold: '#ffaa00',
            orange: '#ff4400',
            magenta: '#ff0066',
            violet: '#6600ff'
        },
        'Cyberpunk Synapse': {
            cyan: '#ff007f',
            blue: '#3a0066',
            gold: '#00f0ff',
            orange: '#ffe600',
            magenta: '#ff00aa',
            violet: '#7928ca'
        },
        'Solar Supernova': {
            cyan: '#ff9900',
            blue: '#661100',
            gold: '#ffee55',
            orange: '#ff2200',
            magenta: '#ff0055',
            violet: '#ffaa22'
        },
        'Bioluminescent Abyss': {
            cyan: '#00ffaa',
            blue: '#002b28',
            gold: '#73ff00',
            orange: '#00e5ff',
            magenta: '#00aa88',
            violet: '#105544'
        },
        'Astral Phantasm': {
            cyan: '#bd00ff',
            blue: '#24084c',
            gold: '#ff80df',
            orange: '#d946ef',
            magenta: '#f43f5e',
            violet: '#8b5cf6'
        }
    };

    // --- Configurations & State ---
    const CONFIG = {
        somaRadius: 4.0,
        dendriteTrees: 14,
        axonTrees: 4,
        maxDistDendrite: 35.0,
        maxDistAxon: 50.0,
        colors: {
            cyan: new THREE.Color(COLOR_PRESETS['Bioelectric Core'].cyan),
            blue: new THREE.Color(COLOR_PRESETS['Bioelectric Core'].blue),
            gold: new THREE.Color(COLOR_PRESETS['Bioelectric Core'].gold),
            orange: new THREE.Color(COLOR_PRESETS['Bioelectric Core'].orange),
            magenta: new THREE.Color(COLOR_PRESETS['Bioelectric Core'].magenta),
            violet: new THREE.Color(COLOR_PRESETS['Bioelectric Core'].violet)
        }
    };

    const PARAMS = {
        colorPreset: 'Bioelectric Core',
        greenScreen: false,
        colCyan: COLOR_PRESETS['Bioelectric Core'].cyan,
        colBlue: COLOR_PRESETS['Bioelectric Core'].blue,
        colGold: COLOR_PRESETS['Bioelectric Core'].gold,
        colOrange: COLOR_PRESETS['Bioelectric Core'].orange,
        colMagenta: COLOR_PRESETS['Bioelectric Core'].magenta,
        colViolet: COLOR_PRESETS['Bioelectric Core'].violet,
        animationMode: 'Orbit & Pulse',
        animSpeed: 1.0,
        pixelRatio: Math.min(window.devicePixelRatio, 2),
        autoInfiniteAnimation: true,
        randomizeOnClick: true,
        bloomStrength: 1.8,
        somaSize: 4.0,
        dendriteCount: 14,
        axonCount: 4
    };

    const STATE = {
        phase: 0,
        progress: 0,
        membraneV: -70.0,
        axonLoad: 2,
        sync: 24,
        isAnimating: false,
        uiVisible: true,
        restTimer: 0
    };

    // --- Shader Uniforms ---
    const uniforms = {
        uTime: { value: 0 },
        uPhase: { value: 0 },
        uProgress: { value: 0 },
        uColCyan: { value: CONFIG.colors.cyan },
        uColBlue: { value: CONFIG.colors.blue },
        uColGold: { value: CONFIG.colors.gold },
        uColOrange: { value: CONFIG.colors.orange },
        uColMagenta: { value: CONFIG.colors.magenta },
        uColViolet: { value: CONFIG.colors.violet },
        uSomaRadius: { value: CONFIG.somaRadius },
        uMaxDistDendrite: { value: CONFIG.maxDistDendrite },
        uMaxDistAxon: { value: CONFIG.maxDistAxon }
    };

    // --- Scene, Camera, Renderer ---
    const scene = new THREE.Scene();
    const darkBgColor = new THREE.Color(0x010204);
    const greenScreenColor = new THREE.Color(0x00ff00);
    scene.background = darkBgColor;
    scene.fog = new THREE.FogExp2(0x010204, 0.015);

    const desktopCameraPosition = new THREE.Vector3(30, 20, 40);
    const mobileCameraPosition = new THREE.Vector3(34, 24, 62);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 500);
    camera.position.copy(desktopCameraPosition);

    const renderer = new THREE.WebGLRenderer({
        antialias: false,
        powerPreference: "high-performance",
        preserveDrawingBuffer: true
    });
    renderer.setPixelRatio(PARAMS.pixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    document.body.appendChild(renderer.domElement);

    const composer = new EffectComposer(renderer);
    const renderPass = new RenderPass(scene, camera);
    composer.addPass(renderPass);
    
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), PARAMS.bloomStrength, 0.6, 0.1);
    composer.addPass(bloomPass);

    // --- OrbitControls (with drag & wheel zoom enabled) ---
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.6;
    controls.enableZoom = true;
    controls.enablePan = true;
    controls.screenSpacePanning = true;
    controls.panSpeed = 1.0;
    controls.minDistance = 10;
    controls.maxDistance = 140;
    controls.mouseButtons = {
        LEFT: THREE.MOUSE.ROTATE,
        MIDDLE: THREE.MOUSE.DOLLY,
        RIGHT: THREE.MOUSE.PAN
    };

    function isCompactViewport() {
        return window.innerWidth <= 720 || window.matchMedia('(pointer: coarse)').matches;
    }

    function applyResponsiveScene(resetCamera = false) {
        const width = window.innerWidth;
        const height = window.innerHeight;
        const compact = isCompactViewport();
        const targetPosition = compact ? mobileCameraPosition : desktopCameraPosition;

        camera.aspect = width / height;
        camera.fov = compact ? 52 : 45;
        camera.updateProjectionMatrix();

        renderer.setSize(width, height, false);
        composer.setSize(width, height);

        controls.minDistance = compact ? 15 : 10;
        controls.maxDistance = compact ? 150 : 140;

        if (resetCamera) {
            camera.position.copy(targetPosition);
        }
        controls.update();
    }

    applyResponsiveScene(true);

    // --- Materials ---
    const somaMaterial = new THREE.ShaderMaterial({
        uniforms: uniforms,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        side: THREE.DoubleSide,
        vertexShader: `
            ${shaderNoise}
            uniform float uTime;
            uniform int uPhase;
            uniform float uProgress;
            
            varying vec3 vNormal;
            varying vec3 vViewPosition;
            varying float vNoise;

            void main() {
                vec3 pos = position;
                float noise = snoise(pos * 0.5 + uTime * 0.3) * 0.5;
                float burst = 0.0;
                if(uPhase == 2) {
                    burst = sin(uProgress * 3.14159) * 0.4;
                }
                pos += normal * (noise + burst);
                vNoise = noise;
                vNormal = normalize(normalMatrix * normal);
                vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                vViewPosition = -mvPosition.xyz;
                gl_Position = projectionMatrix * mvPosition;
            }
        `,
        fragmentShader: `
            uniform int uPhase;
            uniform float uProgress;
            uniform float uTime;
            
            uniform vec3 uColCyan;
            uniform vec3 uColBlue;
            uniform vec3 uColGold;
            uniform vec3 uColMagenta;

            varying vec3 vNormal;
            varying vec3 vViewPosition;
            varying float vNoise;

            void main() {
                vec3 normal = normalize(vNormal);
                vec3 viewDir = normalize(vViewPosition);
                float fresnel = pow(1.0 - max(dot(normal, viewDir), 0.0), 2.5);
                vec3 color = mix(uColBlue * 0.2, uColCyan, fresnel);
                color += uColCyan * (vNoise * 0.5 + 0.5) * 0.3;
                if(uPhase == 2) {
                    float intensity = sin(uProgress * 3.14159);
                    color = mix(color, uColGold * 2.0 + uColCyan, intensity * fresnel * 2.0);
                    color += uColGold * intensity * (1.0 - fresnel);
                } else if(uPhase == 4) {
                    float intensity = 1.0 - uProgress;
                    color = mix(color, uColMagenta, intensity * fresnel * 1.5);
                }
                gl_FragColor = vec4(color, 0.8 * fresnel + 0.2);
            }
        `
    });

    const branchMaterial = new THREE.ShaderMaterial({
        uniforms: Object.assign({}, uniforms, { uIsAxon: { value: 0 } }),
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        vertexShader: `
            ${shaderNoise}
            uniform float uTime;
            varying vec3 vWorldPos;
            varying vec3 vNormal;
            varying vec3 vViewPosition;
            varying vec2 vUv;

            void main() {
                vUv = uv;
                vec3 pos = position;
                float wiggle = snoise(pos * 0.2 + uTime * 0.5) * 0.1;
                pos += normal * wiggle;
                vec4 worldPosition = modelMatrix * vec4(pos, 1.0);
                vWorldPos = worldPosition.xyz;
                vNormal = normalize(normalMatrix * normal);
                vec4 mvPosition = viewMatrix * worldPosition;
                vViewPosition = -mvPosition.xyz;
                gl_Position = projectionMatrix * mvPosition;
            }
        `,
        fragmentShader: `
            ${shaderNoise}
            uniform float uTime;
            uniform int uPhase;
            uniform float uProgress;
            uniform int uIsAxon;
            
            uniform vec3 uColCyan;
            uniform vec3 uColBlue;
            uniform vec3 uColGold;
            uniform vec3 uColOrange;
            uniform vec3 uColMagenta;
            uniform vec3 uColViolet;
            
            uniform float uSomaRadius;
            uniform float uMaxDistDendrite;
            uniform float uMaxDistAxon;

            varying vec3 vWorldPos;
            varying vec3 vNormal;
            varying vec3 vViewPosition;
            varying vec2 vUv;

            void main() {
                vec3 normal = normalize(vNormal);
                vec3 viewDir = normalize(vViewPosition);
                float edge = pow(1.0 - abs(vUv.y - 0.5) * 2.0, 2.0); 
                float fresnel = pow(1.0 - max(dot(normal, viewDir), 0.0), 2.0);
                float dist = length(vWorldPos);
                vec3 baseColor = mix(uColBlue * 0.1, uColCyan * 0.5, fresnel * edge);
                vec3 pulseColor = vec3(0.0);
                float flowNoise = snoise(vec3(vUv.x * 20.0 - uTime * 2.0, vUv.y * 10.0, uTime)) * 0.5 + 0.5;
                float axialFlow = 0.65 + 0.35 * sin(vUv.x * 34.0 - uTime * 8.0);
                if (uIsAxon == 0) {
                    if (uPhase == 1) {
                        float currentWaveDist = mix(uMaxDistDendrite, uSomaRadius, uProgress);
                        float head = 1.0 - smoothstep(0.0, 2.3, abs(dist - currentWaveDist));
                        float outerTrail = step(currentWaveDist, dist) * exp(-(dist - currentWaveDist) * 0.18);
                        float mergeGlow = (1.0 - smoothstep(uSomaRadius, uSomaRadius + 8.0, dist)) * smoothstep(0.65, 1.0, uProgress);
                        float pulse = max(head * 1.6, outerTrail * 0.65) + mergeGlow * 0.8;
                        pulseColor = uColGold * pulse * flowNoise * axialFlow * 3.2;
                    }
                } else {
                    if (uPhase == 3) {
                        float currentWaveDist = mix(uSomaRadius, uMaxDistAxon + 18.0, uProgress);
                        float head = 1.0 - smoothstep(0.0, 3.4, abs(dist - currentWaveDist));
                        float innerTrail = step(dist, currentWaveDist) * exp(-(currentWaveDist - dist) * 0.1);
                        float somaLaunch = (1.0 - smoothstep(uSomaRadius, uSomaRadius + 7.0, dist)) * (1.0 - smoothstep(0.0, 0.28, uProgress));
                        float pulse = max(head * 2.0, innerTrail * 0.9) + somaLaunch * 1.2;
                        pulseColor = (uColOrange + uColGold * 0.45) * pulse * flowNoise * axialFlow * 4.6;
                    }
                }
                if (uPhase == 4) {
                    float intensity = 1.0 - uProgress;
                    pulseColor += uColViolet * intensity * edge * 1.5;
                }
                gl_FragColor = vec4(baseColor + pulseColor, 1.0);
            }
        `
    });

    const axonMaterial = branchMaterial.clone();
    Object.keys(uniforms).forEach((key) => {
        axonMaterial.uniforms[key] = uniforms[key];
    });
    axonMaterial.uniforms.uIsAxon = { value: 1 };

    const synMat = new THREE.ShaderMaterial({
        uniforms: uniforms,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        vertexShader: `
            attribute float aSize;
            uniform float uTime;
            varying float vSize;
            void main() {
                vSize = aSize;
                vec3 pos = position;
                pos.y += sin(uTime * 2.0 + pos.x) * 0.5;
                vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                gl_PointSize = (20.0 + aSize * 15.0) * (100.0 / -mvPosition.z);
                gl_Position = projectionMatrix * mvPosition;
            }
        `,
        fragmentShader: `
            uniform int uPhase;
            uniform float uProgress;
            uniform vec3 uColCyan;
            uniform vec3 uColGold;
            uniform vec3 uColMagenta;
            varying float vSize;
            
            void main() {
                vec2 coord = gl_PointCoord - vec2(0.5);
                float dist = length(coord);
                if (dist > 0.5) discard;
                float alpha = (0.5 - dist) * 2.0;
                vec3 color = uColCyan * 0.5;
                if (uPhase == 1 || uPhase == 3) {
                    float spark = step(0.8, fract(vSize * 10.0 + uProgress * 5.0));
                    color = mix(color, uColGold, spark * 2.0);
                } else if (uPhase == 4) {
                    color = mix(color, uColMagenta, (1.0 - uProgress));
                }
                gl_FragColor = vec4(color, alpha);
            }
        `
    });

    const coreMat = new THREE.MeshBasicMaterial({
        color: CONFIG.colors.cyan,
        transparent: true,
        opacity: 0.15,
        blending: THREE.AdditiveBlending,
        wireframe: true
    });

    const dustMat = new THREE.PointsMaterial({
        color: CONFIG.colors.cyan,
        size: 0.25,
        transparent: true,
        opacity: 0.35,
        blending: THREE.AdditiveBlending,
        depthWrite: false
    });

    const networkGroup = new THREE.Group();
    scene.add(networkGroup);

    // Dust particles
    const dustGeo = new THREE.BufferGeometry();
    const dustCount = 900;
    const dustPos = new Float32Array(dustCount * 3);
    for(let i=0; i<dustCount * 3; i++) {
        dustPos[i] = (Math.random() - 0.5) * 160;
    }
    dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
    const dust = new THREE.Points(dustGeo, dustMat);
    scene.add(dust);

    // --- Procedural Generation Functions ---
    let synapsePositions = [];

    function addSynapse(pos) {
        synapsePositions.push(pos.x, pos.y, pos.z);
    }

    function buildBranch(startPt, dir, length, radius, level, maxLevels, isAxon) {
        const segments = 12;
        const points = [startPt.clone()];
        let cur = startPt.clone();
        let cDir = dir.clone();

        for(let i=0; i<segments; i++) {
            let curl = new THREE.Vector3(
                Math.random() - 0.5,
                Math.random() - 0.5,
                Math.random() - 0.5
            ).multiplyScalar(isAxon ? 0.3 : 0.8);
            cDir.add(curl).normalize();
            cur.add(cDir.clone().multiplyScalar(length / segments));
            points.push(cur.clone());
        }

        const curve = new THREE.CatmullRomCurve3(points);
        const tubeGeo = new THREE.TubeGeometry(curve, segments * 2, radius, 6, false);
        const mesh = new THREE.Mesh(tubeGeo, isAxon ? axonMaterial : branchMaterial);
        networkGroup.add(mesh);

        if (level < maxLevels) {
            const childCount = isAxon ? (Math.random() > 0.3 ? 1 : 2) : (Math.random() > 0.2 ? 2 : 3);
            for(let j=0; j<childCount; j++) {
                let splitDir = cDir.clone().add(new THREE.Vector3(
                    Math.random()-0.5, Math.random()-0.5, Math.random()-0.5
                ).multiplyScalar(0.8)).normalize();
                
                buildBranch(
                    cur, 
                    splitDir, 
                    length * (0.6 + Math.random()*0.3), 
                    radius * 0.65, 
                    level + 1, 
                    maxLevels, 
                    isAxon
                );
            }
        } else {
            addSynapse(cur);
        }
    }

    function rebuildNetwork() {
        // Dispose old meshes in networkGroup
        while(networkGroup.children.length > 0) {
            const obj = networkGroup.children[0];
            networkGroup.remove(obj);
            if (obj.geometry) obj.geometry.dispose();
        }
        synapsePositions = [];

        // Soma mesh
        const somaGeo = new THREE.IcosahedronGeometry(CONFIG.somaRadius, 32);
        const somaMesh = new THREE.Mesh(somaGeo, somaMaterial);
        networkGroup.add(somaMesh);
        
        // Inner Core wireframe
        const coreGeo = new THREE.IcosahedronGeometry(CONFIG.somaRadius * 0.8, 16);
        const coreMesh = new THREE.Mesh(coreGeo, coreMat);
        networkGroup.add(coreMesh);

        // Build Dendrites
        for(let i=0; i<CONFIG.dendriteTrees; i++) {
            let dir = new THREE.Vector3(Math.random()-0.5, Math.random()-0.5, Math.random()-0.5).normalize();
            if (dir.z > 0.3) dir.z -= 0.8;
            dir.normalize();
            let start = dir.clone().multiplyScalar(CONFIG.somaRadius - 0.5);
            buildBranch(start, dir, 12 + Math.random()*6, 0.4, 0, 2, false);
        }

        // Build Axons
        for(let i=0; i<CONFIG.axonTrees; i++) {
            let dir = new THREE.Vector3((Math.random()-0.5)*0.5, (Math.random()-0.5)*0.5, 1.0).normalize();
            let start = dir.clone().multiplyScalar(CONFIG.somaRadius - 0.5);
            buildBranch(start, dir, 26 + Math.random()*10, 0.6, 0, 2, true);
        }

        // Synapses Points
        const synGeo = new THREE.BufferGeometry();
        synGeo.setAttribute('position', new THREE.Float32BufferAttribute(synapsePositions, 3));
        const synSizes = new Float32Array(synapsePositions.length / 3);
        for(let i=0; i<synSizes.length; i++) synSizes[i] = Math.random();
        synGeo.setAttribute('aSize', new THREE.BufferAttribute(synSizes, 1));
        const synapses = new THREE.Points(synGeo, synMat);
        networkGroup.add(synapses);

        uniforms.uSomaRadius.value = CONFIG.somaRadius;
    }

    rebuildNetwork();

    // --- Color Scheme Application ---
    function applyColorPreset(presetName) {
        const preset = COLOR_PRESETS[presetName];
        if (!preset) return;
        PARAMS.colorPreset = presetName;
        PARAMS.colCyan = preset.cyan;
        PARAMS.colBlue = preset.blue;
        PARAMS.colGold = preset.gold;
        PARAMS.colOrange = preset.orange;
        PARAMS.colMagenta = preset.magenta;
        PARAMS.colViolet = preset.violet;
        updateColorsFromParams();
    }

    function updateColorsFromParams() {
        CONFIG.colors.cyan.set(PARAMS.colCyan);
        CONFIG.colors.blue.set(PARAMS.colBlue);
        CONFIG.colors.gold.set(PARAMS.colGold);
        CONFIG.colors.orange.set(PARAMS.colOrange);
        CONFIG.colors.magenta.set(PARAMS.colMagenta);
        CONFIG.colors.violet.set(PARAMS.colViolet);

        uniforms.uColCyan.value.copy(CONFIG.colors.cyan);
        uniforms.uColBlue.value.copy(CONFIG.colors.blue);
        uniforms.uColGold.value.copy(CONFIG.colors.gold);
        uniforms.uColOrange.value.copy(CONFIG.colors.orange);
        uniforms.uColMagenta.value.copy(CONFIG.colors.magenta);
        uniforms.uColViolet.value.copy(CONFIG.colors.violet);

        coreMat.color.copy(CONFIG.colors.cyan);
        dustMat.color.copy(CONFIG.colors.cyan);

        // Update CSS Root Variables for HUD
        document.documentElement.style.setProperty('--cyan', PARAMS.colCyan);
        document.documentElement.style.setProperty('--gold', PARAMS.colGold);
        document.documentElement.style.setProperty('--magenta', PARAMS.colMagenta);
    }

    // --- Green Screen Background Feature ---
    const sceneOverlay = document.getElementById('scene-overlay');

    function applyGreenScreen(enabled) {
        if (enabled) {
            scene.background = greenScreenColor;
            scene.fog.color.set(0x00ff00);
            scene.fog.density = 0.0;
            renderer.setClearColor(0x00ff00, 1.0);
            sceneOverlay.classList.add('hidden-overlay');
        } else {
            scene.background = darkBgColor;
            scene.fog.color.set(0x010204);
            scene.fog.density = 0.015;
            renderer.setClearColor(0x010204, 1.0);
            sceneOverlay.classList.remove('hidden-overlay');
        }
    }

    // --- Random Procedural Generator ---
    function hslToHex(h, s, l) {
        const rgb = new THREE.Color().setHSL(h, s, l);
        return '#' + rgb.getHexString();
    }

    function generateRandomVariation() {
        const baseHue = Math.random();
        const compHue = (baseHue + 0.5) % 1.0;
        const triHue = (baseHue + 0.33) % 1.0;
        const splitHue = (baseHue + 0.67) % 1.0;

        PARAMS.colorPreset = 'Custom Procedural';
        PARAMS.colCyan = hslToHex(baseHue, 0.95, 0.55);
        PARAMS.colBlue = hslToHex((baseHue + 0.08) % 1.0, 0.85, 0.2);
        PARAMS.colGold = hslToHex(compHue, 0.95, 0.55);
        PARAMS.colOrange = hslToHex(triHue, 0.95, 0.5);
        PARAMS.colMagenta = hslToHex(splitHue, 0.9, 0.55);
        PARAMS.colViolet = hslToHex((splitHue + 0.1) % 1.0, 0.85, 0.4);

        CONFIG.somaRadius = 3.2 + Math.random() * 2.2;
        CONFIG.dendriteTrees = 10 + Math.floor(Math.random() * 8);
        CONFIG.axonTrees = 3 + Math.floor(Math.random() * 4);
        PARAMS.somaSize = CONFIG.somaRadius;
        PARAMS.dendriteCount = CONFIG.dendriteTrees;
        PARAMS.axonCount = CONFIG.axonTrees;
        PARAMS.bloomStrength = 1.3 + Math.random() * 1.4;
        bloomPass.strength = PARAMS.bloomStrength;

        updateColorsFromParams();
        rebuildNetwork();

        // Trigger immediate impulse
        triggerImpulse();

        // Update GUI displays
        gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    // --- Firing Impulse Cycle ---
    const btnFire = document.getElementById('btn-fire');

    function triggerImpulse() {
        if (STATE.isAnimating && STATE.phase !== 0) return;
        STATE.isAnimating = true;
        STATE.phase = 1;
        STATE.progress = 0;
        btnFire.classList.add('disabled');
        btnFire.innerText = 'FIRING SEQUENCE...';
    }

    btnFire.addEventListener('click', (e) => {
        e.stopPropagation();
        triggerImpulse();
    });

    // --- Interactive Scene Click & Drag Handling ---
    let pointerDownPos = { x: 0, y: 0 };
    let pointerDownTime = 0;

    window.addEventListener('pointerdown', (e) => {
        pointerDownPos.x = e.clientX;
        pointerDownPos.y = e.clientY;
        pointerDownTime = performance.now();
    });

    window.addEventListener('pointerup', (e) => {
        // Prevent trigger if clicking on HUD or GUI
        if (e.target.closest('.hud-panel') || e.target.closest('.lil-gui')) return;

        const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
        const timeDiff = performance.now() - pointerDownTime;

        // If it's a short click (not a drag/orbit gesture)
        if (dist < 6 && timeDiff < 400) {
            if (PARAMS.randomizeOnClick) {
                generateRandomVariation();
            } else {
                triggerImpulse();
            }
        }
    });

    // --- UI Visibility Toggle ('H' key) ---
    function toggleUI() {
        STATE.uiVisible = !STATE.uiVisible;
        const hudLeft = document.getElementById('hud-left');
        const hudRight = document.getElementById('hud-right');
        const guiElement = gui.domElement;

        if (STATE.uiVisible) {
            hudLeft.classList.remove('ui-hidden');
            hudRight.classList.remove('ui-hidden');
            if (guiElement) guiElement.classList.remove('ui-hidden');
        } else {
            hudLeft.classList.add('ui-hidden');
            hudRight.classList.add('ui-hidden');
            if (guiElement) guiElement.classList.add('ui-hidden');
        }
    }

    window.addEventListener('keydown', (e) => {
        if (e.key === 'h' || e.key === 'H') {
            toggleUI();
        }
    });

    // --- lil-gui Setup ---
    const gui = new GUI({ title: 'Bioelectric Controls (Press H to Hide)', width: 280 });

    const fPresets = gui.addFolder('Presets & Themes');
    fPresets.add(PARAMS, 'colorPreset', [
        'Bioelectric Core',

        'Bioluminescent Abyss',

    ]).name('Color Scheme').onChange(applyColorPreset);

    fPresets.add(PARAMS, 'animationMode', [

    const fColors = gui.addFolder('Color Customization').close();

    fColors.addColor(PARAMS, 'colBlue').name('Base Deep Glow').onChange(updateColorsFromParams);
    fColors.addColor(PARAMS, 'colGold').name('Soma Merge Gold').onChange(updateColorsFromParams);
    fColors.addColor(PARAMS, 'colOrange').name('Axon Firing').onChange(updateColorsFromParams);
    fColors.addColor(PARAMS, 'colMagenta').name('Refractory Pulse').onChange(updateColorsFromParams);
    fColors.addColor(PARAMS, 'colViolet').name('Dissipation Rim').onChange(updateColorsFromParams);

    const fMotion = gui.addFolder('Motion & Performance');
    fMotion.add(PARAMS, 'animSpeed', 0.1, 3.0, 0.05).name('Animation Speed');
    fMotion.add(PARAMS, 'pixelRatio', 0.5, 3.0, 0.25).name('Pixel Ratio (DPR)').onChange(v => {

    fMotion.add(PARAMS, 'autoInfiniteAnimation').name('Auto-Loop Waves');

    });

    const fGeo = gui.addFolder('Procedural Geometry').close();
    fGeo.add(PARAMS, 'somaSize', 2.0, 7.0, 0.2).name('Soma Radius').onChange(v => {

    fGeo.add(PARAMS, 'dendriteCount', 6, 24, 1).name('Dendrite Count').onChange(v => {

    fGeo.add(PARAMS, 'axonCount', 2, 8, 1).name('Axon Count').onChange(v => {

    fGeo.add({ reroll: () => generateRandomVariation() }, 'reroll').name('🎲 Randomize Scene');

    // --- HUD Telemetry Updates ---
    const elMembrane = document.getElementById('val-membrane');
    const elDendrites = document.getElementById('val-dendrites');
    const elAxon = document.getElementById('val-axon');
    const elState = document.getElementById('val-state');
    const elSync = document.getElementById('val-sync');
    
    const elCamX = document.getElementById('val-cam-x');
    const elCamY = document.getElementById('val-cam-y');
    const elCamZ = document.getElementById('val-cam-z');

    function updateUI() {
        elCamX.innerText = camera.position.x.toFixed(2);
        elCamY.innerText = camera.position.y.toFixed(2);
        elCamZ.innerText = camera.position.z.toFixed(2);

        let targetMembrane = -70.0;
        let targetAxon = 2;
        let targetSync = 24 + Math.sin(uniforms.uTime.value * 2) * 5;
        
        let stateText = "RESTING";
        let denText = "CALM";

        elMembrane.className = "hud-value";
        elAxon.className = "hud-value";
        elState.className = "hud-value";

        switch(STATE.phase) {
            case 1:
                stateText = "INCOMING STIMULUS";
                denText = "ACTIVE LOAD";
                targetMembrane = -55.0; 
                targetSync = 45;
                elState.classList.add('value-active');
                break;
            case 2:
                stateText = "SOMA MERGE";
                denText = "CONVERGED";
                targetMembrane = +40.0;
                targetSync = 85;
                elMembrane.classList.add('value-active');
                elState.classList.add('value-active');
                break;
            case 3:
                stateText = "AXON OUTFLOW";
                targetMembrane = +20.0;
                targetAxon = 98;
                targetSync = 99;
                elAxon.classList.add('value-active');
                elState.classList.add('value-active');
                break;
            case 4:
                stateText = "REFRACTORY PERIOD";
                targetMembrane = -80.0;
                targetAxon = 15;
                targetSync = 15;
                elMembrane.classList.add('value-refract');
                elState.classList.add('value-refract');
                break;
        }

        STATE.membraneV += (targetMembrane - STATE.membraneV) * 0.15;
        STATE.axonLoad += (targetAxon - STATE.axonLoad) * 0.15;
        STATE.sync += (targetSync - STATE.sync) * 0.15;

        elMembrane.innerText = `${STATE.membraneV > 0 ? '+' : ''}${STATE.membraneV.toFixed(1)} mV`;
        elAxon.innerText = `${Math.round(STATE.axonLoad).toString().padStart(2, '0')}%`;
        elSync.innerText = `${Math.round(STATE.sync).toString().padStart(2, '0')}%`;
        elState.innerText = stateText;
        elDendrites.innerText = denText;
    }

    // --- Main Animation Loop ---
    const clock = new THREE.Clock();
    let animTime = 0;

    function animate() {
        requestAnimationFrame(animate);

        const rawDt = clock.getDelta();
        const dt = rawDt * PARAMS.animSpeed;
        animTime += dt;
        uniforms.uTime.value = animTime;

        // Apply selected animation choreographies
        switch(PARAMS.animationMode) {
            case 'Orbit & Pulse':
                controls.autoRotate = true;
                controls.autoRotateSpeed = 0.6 * PARAMS.animSpeed;
                break;
            case 'Deep Core Drift':
                controls.autoRotate = true;
                controls.autoRotateSpeed = 0.25 * PARAMS.animSpeed;
                const distRadius = 45 + Math.sin(animTime * 0.4) * 15;
                const camAngle = animTime * 0.15;
                camera.position.x = Math.cos(camAngle) * distRadius;
                camera.position.z = Math.sin(camAngle) * distRadius;
                camera.position.y = 20 + Math.sin(animTime * 0.3) * 8;
                break;
            case 'Synaptic Spiral':
                controls.autoRotate = false;
                const spiralR = 50 + Math.sin(animTime * 0.2) * 8;
                const spiralAngle = animTime * 0.3;
                camera.position.x = Math.cos(spiralAngle) * spiralR;
                camera.position.z = Math.sin(spiralAngle) * spiralR;
                camera.position.y = Math.sin(animTime * 0.4) * 25 + 10;
                break;
            case 'Axon Flow Track':
                controls.autoRotate = false;
                const trackAngle = Math.sin(animTime * 0.25) * 0.8 + 0.6;
                const trackDist = 48 + Math.cos(animTime * 0.3) * 12;
                camera.position.x = Math.sin(trackAngle) * trackDist;
                camera.position.z = Math.cos(trackAngle) * trackDist + 15;
                camera.position.y = 16 + Math.sin(animTime * 0.5) * 10;
                break;
            case 'Static (No Movement)':
                controls.autoRotate = false;
                break;
        }

        controls.update();

        dust.rotation.y = animTime * 0.02;
        dust.rotation.x = Math.sin(animTime * 0.01) * 0.05;

        // Neural impulse wave progression
        if (STATE.isAnimating) {
            let speed = 1.0;
            if (STATE.phase === 1) speed = 0.8;
            if (STATE.phase === 2) speed = 2.5;
            if (STATE.phase === 3) speed = 0.95;
            if (STATE.phase === 4) speed = 0.5;

            STATE.progress += dt * speed;

            if (STATE.progress >= 1.0) {
                STATE.progress = 0.0;
                STATE.phase++;
                
                if (STATE.phase === 2) {
                    bloomPass.strength = PARAMS.bloomStrength * 1.4;
                }

                if (STATE.phase > 4) {
                    STATE.phase = 0;
                    STATE.isAnimating = false;
                    btnFire.classList.remove('disabled');
                    btnFire.innerText = 'MANUAL OVERRIDE';
                    STATE.restTimer = 0;
                }
            }
        } else {
            bloomPass.strength += (PARAMS.bloomStrength - bloomPass.strength) * 0.05;

            // Auto-infinite looping firing waves
            if (PARAMS.autoInfiniteAnimation) {
                STATE.restTimer += dt;
                if (STATE.restTimer > 0.8) {
                    triggerImpulse();
                }
            }
        }

        uniforms.uPhase.value = STATE.phase;
        uniforms.uProgress.value = STATE.progress;

        updateUI();

        composer.render();
    }

    // Loader Dismissal
    setTimeout(() => {
        const loader = document.getElementById('loader');
        if (loader) {
            loader.style.opacity = '0';
            setTimeout(() => loader.style.display = 'none', 1000);
        }
    }, 1200);

    window.addEventListener('resize', () => {
        applyResponsiveScene();
    });

    animate();
</script>

</body>
</html>
