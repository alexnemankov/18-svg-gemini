<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HALLOWEEN - Spectral Ghost</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Boldonse&display=swap");

    @font-face {
      font-family: "PPSupplyMono";
      src: url("https://assets.codepen.io/7558/PPSupplyMono-Variable.woff2") format("woff2");
      font-weight: 100 900;
      font-style: normal;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #111;
      letter-spacing: -0.03em;
      transition: background-color 0.3s ease;
    }

    /* Preloader Styles */
    .preloader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0a0a0a 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10000;
      opacity: 1;
      transition: opacity 1s ease-out;
    }

    .preloader.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .preloader-content {
      text-align: center;
      color: #e0e0e0;
    }

    .ghost-loader {
      position: relative;
      width: 64px;
      height: 64px;
      margin: 0 auto 30px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .ghost-svg {
      filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.3));
      animation: ghostFloat 3s ease-in-out infinite;
    }

    .ghost-body {
      fill: white;
      opacity: 0.9;
    }

    .ghost-eye {
      fill: black;
      animation: eyePulse 2s ease-in-out infinite;
      transform-origin: center;
    }

    .left-eye {
      animation-delay: 0s;
    }

    .right-eye {
      animation-delay: 0.1s;
    }

    @keyframes ghostFloat {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-8px);
      }
    }

    @keyframes eyePulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.3);
      }
    }

    .loading-text {
      font-family: "PPSupplyMono", monospace;
      font-size: 12px;
      text-transform: uppercase;
      opacity: 1;
      margin-bottom: 12px;
      animation: textPulse 2s ease-in-out infinite;
    }

    @keyframes textPulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.1;
      }
    }

    .loading-progress {
      width: 96px;
      height: 1px;
      margin: 0 auto;
      border-radius: 1px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #00ff80, #00cc66);
      opacity: 0.1;
      width: 0%;
      transition: width 0.8s ease;
    }

    /* Main Content Styles */
    .content {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
      color: #e0e0e0;
      opacity: 0;
      transition: opacity 1.5s ease-in;
      pointer-events: none;
    }

    .content.fade-in {
      opacity: 1;
    }

    .quote-container {
      max-width: 95%;
      overflow: visible;
      padding: 20px 0;
    }

    .quote {
      font-family: "Boldonse", system-ui, sans-serif;
      font-size: 8vw;
      line-height: 1.25;
      font-weight: 400;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
      padding: 10px 0;
    }

    /* Canvas initially hidden */
    canvas {
      opacity: 0 !important;
      transition: opacity 2s ease-in;
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }

    canvas.fade-in {
      opacity: 1 !important;
    }
  </style>
</head>
<body>

<!-- Hidden file input for SVG upload -->
<input type="file" id="svg-upload-input" accept=".svg" style="display: none;" />

<!-- Preloader -->
<div id="preloader" class="preloader">
  <div class="preloader-content">
    <div class="ghost-loader">
      <svg class="ghost-svg" height="80" viewBox="0 0 512 512" width="80" xmlns="http://www.w3.org/2000/svg">
        <path class="ghost-body" d="m508.374 432.802s-46.6-39.038-79.495-275.781c-8.833-87.68-82.856-156.139-172.879-156.139-90.015 0-164.046 68.458-172.879 156.138-32.895 236.743-79.495 275.782-79.495 275.782-15.107 25.181 20.733 28.178 38.699 27.94 35.254-.478 35.254 40.294 70.516 40.294 35.254 0 35.254-35.261 70.508-35.261s37.396 45.343 72.65 45.343 37.389-45.343 72.651-45.343c35.254 0 35.254 35.261 70.508 35.261s35.27-40.772 70.524-40.294c17.959.238 53.798-2.76 38.692-27.94z" fill="white" />
        <circle class="ghost-eye left-eye" cx="208" cy="225" r="22" fill="black" />
        <circle class="ghost-eye right-eye" cx="297" cy="225" r="22" fill="black" />
      </svg>
    </div>
    <div class="loading-text">Summoning spirits</div>
    <div class="loading-progress">
      <div class="progress-bar"></div>
    </div>
  </div>
</div>

<!-- Main Content -->
<div class="content" id="main-content">
  <div class="quote-container">
    <h1 class="quote">HALLOWEEN</h1>
  </div>
</div>

<script type="module">
import * as THREE from "https://esm.sh/three";
import { GUI } from "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js";
import { SVGLoader } from "https://esm.sh/three/examples/jsm/loaders/SVGLoader.js";
import { EffectComposer } from "https://esm.sh/three/examples/jsm/postprocessing/EffectComposer.js";
import { RenderPass } from "https://esm.sh/three/examples/jsm/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "https://esm.sh/three/examples/jsm/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "https://esm.sh/three/examples/jsm/postprocessing/OutputPass.js";
import { ShaderPass } from "https://esm.sh/three/examples/jsm/postprocessing/ShaderPass.js";

// Preloader management
class PreloaderManager {
  constructor() {
    this.preloader = document.getElementById("preloader");
    this.mainContent = document.getElementById("main-content");
    this.progressBar = document.querySelector(".progress-bar");
    this.loadingSteps = 0;
    this.totalSteps = 5;
    this.isComplete = false;
  }

  updateProgress(step) {
    this.loadingSteps = Math.min(step, this.totalSteps);
    const percentage = (this.loadingSteps / this.totalSteps) * 100;
    this.progressBar.style.width = `${percentage}%`;
  }

  complete(canvas) {
    if (this.isComplete) return;
    this.isComplete = true;

    this.updateProgress(this.totalSteps);

    setTimeout(() => {
      this.preloader.classList.add("fade-out");
      this.mainContent.classList.add("fade-in");
      canvas.classList.add("fade-in");

      setTimeout(() => {
        this.preloader.style.display = "none";
      }, 1000);
    }, 1500);
  }
}

const preloader = new PreloaderManager();

document.body.style.transform = "translateZ(0)";
document.body.style.backfaceVisibility = "hidden";
document.body.style.perspective = "1000px";

preloader.updateProgress(1);

// Scene setup
const scene = new THREE.Scene();
scene.background = null;

const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);
const defaultZoom = 20;
camera.position.z = defaultZoom;

preloader.updateProgress(2);

// Color Schemes (5 Presets)
const colorSchemes = {
  "Halloween Cyber": {
    bodyColor: "#0f2027",
    glowColor: "#ff5500",
    eyeColor: "#00ff66",
    particleColor: "#ff7700"
  },
  "Ectoplasm Lime": {
    bodyColor: "#052411",
    glowColor: "#00ff44",
    eyeColor: "#00ffff",
    particleColor: "#02ff66"
  },
  "Blood Moon": {
    bodyColor: "#290409",
    glowColor: "#ff0033",
    eyeColor: "#ffaa00",
    particleColor: "#ff2200"
  },
  "Phantom Violet": {
    bodyColor: "#15032b",
    glowColor: "#a822ff",
    eyeColor: "#ff00aa",
    particleColor: "#bb33ff"
  },
  "Midnight Frost": {
    bodyColor: "#04182b",
    glowColor: "#00bfff",
    eyeColor: "#ffffff",
    particleColor: "#00e5ff"
  }
};

// Application State Parameters
const params = {
  // Color Scheme Preset
  colorScheme: "Halloween Cyber",

  // Custom Colors
  bodyColor: colorSchemes["Halloween Cyber"].bodyColor,
  glowColor: colorSchemes["Halloween Cyber"].glowColor,
  eyeColor: colorSchemes["Halloween Cyber"].eyeColor,
  particleColor: colorSchemes["Halloween Cyber"].particleColor,
  ghostOpacity: 0.88,
  emissiveIntensity: 5.8,

  // Settings
  greenscreen: false,
  dpr: Math.min(window.devicePixelRatio, 2),
  animSpeed: 1.0,
  animPreset: "Gentle Orbit",
  zoom: defaultZoom,

  // Behavior
  followSpeed: 0.075,
  wobbleAmount: 0.35,
  floatSpeed: 1.6,
  movementThreshold: 0.07,

  // Eye controls
  eyeGlowDecay: 0.95,
  eyeGlowResponse: 0.31,

  // Particles
  particleCount: 250,
  particleDecayRate: 0.005,
  createParticlesOnlyWhenMoving: true,
  particleCreationRate: 5,

  // Atmosphere
  revealRadius: 43,
  fadeStrength: 2.2,
  baseOpacity: 0.35,
  revealOpacity: 0.0,

  // Fireflies
  fireflyGlowIntensity: 2.6,
  fireflySpeed: 0.04,

  // Analog Decay
  analogIntensity: 0.6,
  analogGrain: 0.4,
  analogBleeding: 1.0,
  analogVSync: 1.0,
  analogScanlines: 1.0,
  analogVignette: 1.0,
  analogJitter: 0.4,
  limboMode: false
};

// Renderer
const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: "high-performance",
  alpha: true,
  premultipliedAlpha: false,
  stencil: false,
  depth: true,
  preserveDrawingBuffer: false
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(params.dpr);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

// Canvas styling
renderer.domElement.style.position = "absolute";
renderer.domElement.style.top = "0";
renderer.domElement.style.left = "0";
renderer.domElement.style.zIndex = "2";
renderer.domElement.style.pointerEvents = "auto";
renderer.domElement.style.background = "transparent";

// Post-processing setup
const composer = new EffectComposer(renderer);
const renderPass = new RenderPass(scene, camera);
composer.addPass(renderPass);

const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.3,
  1.25,
  0.0
);
composer.addPass(bloomPass);

preloader.updateProgress(3);

// Analog Decay Shader
const analogDecayShader = {
  uniforms: {
    tDiffuse: { value: null },
    uTime: { value: 0.0 },
    uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
    uAnalogGrain: { value: 0.4 },
    uAnalogBleeding: { value: 1.0 },
    uAnalogVSync: { value: 1.0 },
    uAnalogScanlines: { value: 1.0 },
    uAnalogVignette: { value: 1.0 },
    uAnalogJitter: { value: 0.4 },
    uAnalogIntensity: { value: 0.6 },
    uLimboMode: { value: 0.0 }
  },

  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,

  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform float uTime;
    uniform vec2 uResolution;
    uniform float uAnalogGrain;
    uniform float uAnalogBleeding;
    uniform float uAnalogVSync;
    uniform float uAnalogScanlines;
    uniform float uAnalogVignette;
    uniform float uAnalogJitter;
    uniform float uAnalogIntensity;
    uniform float uLimboMode;
    
    varying vec2 vUv;
    
    float random(vec2 st) {
      return fract(sin(dot(st.xy, vec2(12.9898, 78.233))) * 43758.5453123);
    }
    
    float gaussian(float z, float u, float o) {
      return (1.0 / (o * sqrt(2.0 * 3.1415))) * exp(-(((z - u) * (z - u)) / (2.0 * (o * o))));
    }
    
    vec3 grain(vec2 uv, float time, float intensity) {
      float seed = dot(uv, vec2(12.9898, 78.233));
      float noise = fract(sin(seed) * 43758.5453 + time * 2.0);
      noise = gaussian(noise, 0.0, 0.5 * 0.5);
      return vec3(noise) * intensity;
    }
    
    void main() {
      vec2 uv = vUv;
      float time = uTime * 1.8;
      
      vec2 jitteredUV = uv;
      if (uAnalogJitter > 0.01) {
        float jitterAmount = (random(vec2(floor(time * 60.0))) - 0.5) * 0.003 * uAnalogJitter * uAnalogIntensity;
        jitteredUV.x += jitterAmount;
        jitteredUV.y += (random(vec2(floor(time * 30.0) + 1.0)) - 0.5) * 0.001 * uAnalogJitter * uAnalogIntensity;
      }
      
      if (uAnalogVSync > 0.01) {
        float vsyncRoll = sin(time * 2.0 + uv.y * 100.0) * 0.02 * uAnalogVSync * uAnalogIntensity;
        float vsyncChance = step(0.95, random(vec2(floor(time * 4.0))));
        jitteredUV.y += vsyncRoll * vsyncChance;
      }
      
      vec4 color = texture2D(tDiffuse, jitteredUV);
      
      if (uAnalogBleeding > 0.01) {
        float bleedAmount = 0.012 * uAnalogBleeding * uAnalogIntensity;
        float offsetPhase = time * 1.5 + uv.y * 20.0;
        
        vec2 redOffset = vec2(sin(offsetPhase) * bleedAmount, 0.0);
        vec2 blueOffset = vec2(-sin(offsetPhase * 1.1) * bleedAmount * 0.8, 0.0);
        
        float r = texture2D(tDiffuse, jitteredUV + redOffset).r;
        float g = texture2D(tDiffuse, jitteredUV).g;
        float b = texture2D(tDiffuse, jitteredUV + blueOffset).b;
        
        color = vec4(r, g, b, color.a);
      }
      
      if (uAnalogGrain > 0.01) {
        vec3 grainEffect = grain(uv, time, 0.075 * uAnalogGrain * uAnalogIntensity);
        grainEffect *= (1.0 - color.rgb);
        color.rgb += grainEffect;
      }
      
      if (uAnalogScanlines > 0.01) {
        float scanlineFreq = 600.0 + uAnalogScanlines * 400.0;
        float scanlinePattern = sin(uv.y * scanlineFreq) * 0.5 + 0.5;
        float scanlineIntensity = 0.1 * uAnalogScanlines * uAnalogIntensity;
        color.rgb *= (1.0 - scanlinePattern * scanlineIntensity);
      }
      
      if (uAnalogVignette > 0.01) {
        vec2 vignetteUV = (uv - 0.5) * 2.0;
        float vignette = 1.0 - dot(vignetteUV, vignetteUV) * 0.3 * uAnalogVignette * uAnalogIntensity;
        color.rgb *= vignette;
      }
      
      if (uLimboMode > 0.5) {
        float gray = dot(color.rgb, vec3(0.299, 0.587, 0.114));
        color.rgb = vec3(gray);
      }
      
      gl_FragColor = color;
    }
  `
};

const analogDecayPass = new ShaderPass(analogDecayShader);
composer.addPass(analogDecayPass);

const outputPass = new OutputPass();
composer.addPass(outputPass);

// Atmosphere background mesh
const atmosphereGeometry = new THREE.PlaneGeometry(300, 300);
const atmosphereMaterial = new THREE.ShaderMaterial({
  uniforms: {
    ghostPosition: { value: new THREE.Vector3(0, 0, 0) },
    revealRadius: { value: params.revealRadius },
    fadeStrength: { value: params.fadeStrength },
    baseOpacity: { value: params.baseOpacity },
    revealOpacity: { value: params.revealOpacity },
    time: { value: 0 }
  },
  vertexShader: `
    varying vec2 vUv;
    varying vec3 vWorldPosition;
    void main() {
      vUv = uv;
      vec4 worldPos = modelMatrix * vec4(position, 1.0);
      vWorldPosition = worldPos.xyz;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform vec3 ghostPosition;
    uniform float revealRadius;
    uniform float fadeStrength;
    uniform float baseOpacity;
    uniform float revealOpacity;
    uniform float time;
    varying vec2 vUv;
    varying vec3 vWorldPosition;
    
    void main() {
      float dist = distance(vWorldPosition.xy, ghostPosition.xy);
      float dynamicRadius = revealRadius + sin(time * 2.0) * 5.0;
      float reveal = smoothstep(dynamicRadius * 0.2, dynamicRadius, dist);
      reveal = pow(reveal, fadeStrength);
      float opacity = mix(revealOpacity, baseOpacity, reveal);
      gl_FragColor = vec4(0.001, 0.001, 0.002, opacity);
    }
  `,
  transparent: true,
  depthWrite: false
});

const atmosphere = new THREE.Mesh(atmosphereGeometry, atmosphereMaterial);
atmosphere.position.z = -50;
atmosphere.renderOrder = -100;
scene.add(atmosphere);

// Lighting
const ambientLight = new THREE.AmbientLight(0x0a0a2e, 0.08);
scene.add(ambientLight);

const rimLight1 = new THREE.DirectionalLight(0x4a90e2, 1.8);
rimLight1.position.set(-8, 6, -4);
scene.add(rimLight1);

const rimLight2 = new THREE.DirectionalLight(0x50e3c2, 1.26);
rimLight2.position.set(8, -4, -6);
scene.add(rimLight2);

// Ghost Group
const ghostGroup = new THREE.Group();
scene.add(ghostGroup);

// Default Ghost Mesh
function createGhostGeometry() {
  const geom = new THREE.SphereGeometry(2, 40, 40);
  const posAttr = geom.getAttribute("position");
  const positions = posAttr.array;
  for (let i = 0; i < positions.length; i += 3) {
    if (positions[i + 1] < -0.2) {
      const x = positions[i];
      const z = positions[i + 2];
      const noise1 = Math.sin(x * 5) * 0.35;
      const noise2 = Math.cos(z * 4) * 0.25;
      const noise3 = Math.sin((x + z) * 3) * 0.15;
      positions[i + 1] = -2.0 + (noise1 + noise2 + noise3);
    }
  }
  geom.computeVertexNormals();
  return geom;
}

const ghostMaterial = new THREE.MeshStandardMaterial({
  color: new THREE.Color(params.bodyColor),
  transparent: true,
  opacity: params.ghostOpacity,
  emissive: new THREE.Color(params.glowColor),
  emissiveIntensity: params.emissiveIntensity,
  roughness: 0.02,
  metalness: 0.0,
  side: THREE.DoubleSide,
  alphaTest: 0.1
});

let ghostBody = new THREE.Mesh(createGhostGeometry(), ghostMaterial);
ghostGroup.add(ghostBody);

preloader.updateProgress(4);

// Eyes setup
function createEyes() {
  const eyeGroup = new THREE.Group();
  ghostGroup.add(eyeGroup);

  const socketGeometry = new THREE.SphereGeometry(0.45, 16, 16);
  const socketMaterial = new THREE.MeshBasicMaterial({ color: 0x000000 });

  const leftSocket = new THREE.Mesh(socketGeometry, socketMaterial);
  leftSocket.position.set(-0.7, 0.6, 1.9);
  leftSocket.scale.set(1.1, 1.0, 0.6);
  eyeGroup.add(leftSocket);

  const rightSocket = new THREE.Mesh(socketGeometry, socketMaterial);
  rightSocket.position.set(0.7, 0.6, 1.9);
  rightSocket.scale.set(1.1, 1.0, 0.6);
  eyeGroup.add(rightSocket);

  const eyeGeometry = new THREE.SphereGeometry(0.3, 12, 12);
  const leftEyeMaterial = new THREE.MeshBasicMaterial({
    color: new THREE.Color(params.eyeColor),
    transparent: true,
    opacity: 0
  });
  const leftEye = new THREE.Mesh(eyeGeometry, leftEyeMaterial);
  leftEye.position.set(-0.7, 0.6, 2.0);
  eyeGroup.add(leftEye);

  const rightEyeMaterial = new THREE.MeshBasicMaterial({
    color: new THREE.Color(params.eyeColor),
    transparent: true,
    opacity: 0
  });
  const rightEye = new THREE.Mesh(eyeGeometry, rightEyeMaterial);
  rightEye.position.set(0.7, 0.6, 2.0);
  eyeGroup.add(rightEye);

  const outerGlowGeometry = new THREE.SphereGeometry(0.525, 12, 12);

  const leftOuterGlowMaterial = new THREE.MeshBasicMaterial({
    color: new THREE.Color(params.eyeColor),
    transparent: true,
    opacity: 0,
    side: THREE.BackSide
  });
  const leftOuterGlow = new THREE.Mesh(outerGlowGeometry, leftOuterGlowMaterial);
  leftOuterGlow.position.set(-0.7, 0.6, 1.95);
  eyeGroup.add(leftOuterGlow);

  const rightOuterGlowMaterial = new THREE.MeshBasicMaterial({
    color: new THREE.Color(params.eyeColor),
    transparent: true,
    opacity: 0,
    side: THREE.BackSide
  });
  const rightOuterGlow = new THREE.Mesh(outerGlowGeometry, rightOuterGlowMaterial);
  rightOuterGlow.position.set(0.7, 0.6, 1.95);
  eyeGroup.add(rightOuterGlow);

  return {
    leftEyeMaterial,
    rightEyeMaterial,
    leftOuterGlowMaterial,
    rightOuterGlowMaterial
  };
}

const eyes = createEyes();

// Fireflies
const fireflies = [];
const fireflyGroup = new THREE.Group();
scene.add(fireflyGroup);

function createFireflies() {
  for (let i = 0; i < 20; i++) {
    const fireflyGeometry = new THREE.SphereGeometry(0.02, 2, 2);
    const fireflyMaterial = new THREE.MeshBasicMaterial({
      color: 0xffff44,
      transparent: true,
      opacity: 0.9
    });

    const firefly = new THREE.Mesh(fireflyGeometry, fireflyMaterial);
    firefly.position.set(
      (Math.random() - 0.5) * 40,
      (Math.random() - 0.5) * 30,
      (Math.random() - 0.5) * 20
    );

    const glowGeometry = new THREE.SphereGeometry(0.08, 8, 8);
    const glowMaterial = new THREE.MeshBasicMaterial({
      color: 0xffff88,
      transparent: true,
      opacity: 0.4,
      side: THREE.BackSide
    });

    const glow = new THREE.Mesh(glowGeometry, glowMaterial);
    firefly.add(glow);

    const fireflyLight = new THREE.PointLight(0xffff44, 0.8, 3, 2);
    firefly.add(fireflyLight);

    firefly.userData = {
      velocity: new THREE.Vector3(
        (Math.random() - 0.5) * params.fireflySpeed,
        (Math.random() - 0.5) * params.fireflySpeed,
        (Math.random() - 0.5) * params.fireflySpeed
      ),
      phase: Math.random() * Math.PI * 2,
      pulseSpeed: 2 + Math.random() * 3,
      glowMaterial: glowMaterial,
      fireflyMaterial: fireflyMaterial,
      light: fireflyLight
    };

    fireflyGroup.add(firefly);
    fireflies.push(firefly);
  }
}

createFireflies();

// Particles
const particles = [];
const particleGroup = new THREE.Group();
scene.add(particleGroup);

const particlePool = [];
const particleGeometries = [
  new THREE.SphereGeometry(0.05, 6, 6),
  new THREE.TetrahedronGeometry(0.04, 0),
  new THREE.OctahedronGeometry(0.045, 0)
];

const particleBaseMaterial = new THREE.MeshBasicMaterial({
  color: new THREE.Color(params.particleColor),
  transparent: true,
  opacity: 0,
  alphaTest: 0.1
});

function initParticlePool(count) {
  for (let i = 0; i < count; i++) {
    const geomIndex = Math.floor(Math.random() * particleGeometries.length);
    const geometry = particleGeometries[geomIndex];
    const material = particleBaseMaterial.clone();
    const particle = new THREE.Mesh(geometry, material);
    particle.visible = false;
    particleGroup.add(particle);
    particlePool.push(particle);
  }
}

initParticlePool(100);

function createParticle() {
  let particle;
  if (particlePool.length > 0) {
    particle = particlePool.pop();
    particle.visible = true;
  } else if (particles.length < params.particleCount) {
    const geomIndex = Math.floor(Math.random() * particleGeometries.length);
    const geometry = particleGeometries[geomIndex];
    const material = particleBaseMaterial.clone();
    particle = new THREE.Mesh(geometry, material);
    particleGroup.add(particle);
  } else {
    return null;
  }

  const pColor = new THREE.Color(params.particleColor);
  pColor.offsetHSL(Math.random() * 0.1 - 0.05, 0, 0);
  particle.material.color = pColor;

  particle.position.copy(ghostGroup.position);
  particle.position.z -= 0.8 + Math.random() * 0.6;

  const scatterRange = 3.5;
  particle.position.x += (Math.random() - 0.5) * scatterRange;
  particle.position.y += (Math.random() - 0.5) * scatterRange - 0.8;

  const sizeVar = 0.6 + Math.random() * 0.7;
  particle.scale.set(sizeVar, sizeVar, sizeVar);

  particle.userData.life = 1.0;
  particle.userData.decay = Math.random() * 0.003 + params.particleDecayRate;
  particle.userData.rotationSpeed = {
    x: (Math.random() - 0.5) * 0.015,
    y: (Math.random() - 0.5) * 0.015,
    z: (Math.random() - 0.5) * 0.015
  };
  particle.userData.velocity = {
    x: (Math.random() - 0.5) * 0.012,
    y: (Math.random() - 0.5) * 0.012 - 0.002,
    z: (Math.random() - 0.5) * 0.012 - 0.006
  };

  particle.material.opacity = Math.random() * 0.9;
  particles.push(particle);
  return particle;
}

// Update functions for materials & state
function updateColors() {
  ghostMaterial.color.set(params.bodyColor);
  ghostMaterial.emissive.set(params.glowColor);
  eyes.leftEyeMaterial.color.set(params.eyeColor);
  eyes.rightEyeMaterial.color.set(params.eyeColor);
  eyes.leftOuterGlowMaterial.color.set(params.eyeColor);
  eyes.rightOuterGlowMaterial.color.set(params.eyeColor);
  particleBaseMaterial.color.set(params.particleColor);
}

function applyColorScheme(schemeName) {
  const scheme = colorSchemes[schemeName];
  if (!scheme) return;
  params.bodyColor = scheme.bodyColor;
  params.glowColor = scheme.glowColor;
  params.eyeColor = scheme.eyeColor;
  params.particleColor = scheme.particleColor;
  updateColors();
  gui.controllers.forEach(c => c.updateDisplay());
}

function updateGreenscreen() {
  if (params.greenscreen) {
    document.body.style.backgroundColor = "#00ff00";
    renderer.setClearColor(0x00ff00, 1);
    atmosphere.visible = false;
  } else {
    document.body.style.backgroundColor = "#111111";
    renderer.setClearColor(0x000000, 0);
    atmosphere.visible = true;
  }
}

// SVG Upload Handler
const svgInput = document.getElementById("svg-upload-input");
svgInput.addEventListener("change", (event) => {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = (e) => {
    const contents = e.target.result;
    const loader = new SVGLoader();
    const svgData = loader.parse(contents);
    const shapes = [];

    svgData.paths.forEach((path) => {
      const pathShapes = SVGLoader.createShapes(path);
      shapes.push(...pathShapes);
    });

    if (shapes.length > 0) {
      const extrudeSettings = {
        depth: 0.6,
        bevelEnabled: true,
        bevelSegments: 3,
        steps: 1,
        bevelSize: 0.1,
        bevelThickness: 0.1
      };
      const geometry = new THREE.ExtrudeGeometry(shapes, extrudeSettings);
      geometry.center();

      geometry.computeBoundingBox();
      const box = geometry.boundingBox;
      const size = new THREE.Vector3();
      box.getSize(size);
      const maxDim = Math.max(size.x, size.y, size.z);
      if (maxDim > 0) {
        const scale = 4.5 / maxDim;
        geometry.scale(scale, -scale, scale);
      }

      ghostBody.geometry.dispose();
      ghostBody.geometry = geometry;
    }
  };
  reader.readAsText(file);
});

// GUI Setup using lil-gui
const gui = new GUI({ title: "Halloween Ghost Settings" });

// Presets & Color Folder
const presetsFolder = gui.addFolder("Presets & Colors");
presetsFolder
  .add(params, "colorScheme", Object.keys(colorSchemes))
  .name("Color Presets")
  .onChange((val) => applyColorScheme(val));

presetsFolder
  .addColor(params, "bodyColor")
  .name("Body Color")
  .onChange(() => updateColors());

presetsFolder
  .addColor(params, "glowColor")
  .name("Glow Color")
  .onChange(() => updateColors());

presetsFolder
  .addColor(params, "eyeColor")
  .name("Eye Color")
  .onChange(() => updateColors());

presetsFolder
  .addColor(params, "particleColor")
  .name("Particle Color")
  .onChange(() => updateColors());

presetsFolder
  .add(params, "emissiveIntensity", 1.0, 10.0, 0.1)
  .name("Glow Intensity")
  .onChange((val) => {
    ghostMaterial.emissiveIntensity = val;
  });

// Display & Camera Controls Folder
const displayFolder = gui.addFolder("Display & Camera");
displayFolder
  .add(params, "greenscreen")
  .name("Greenscreen (#00ff00)")
  .onChange(() => updateGreenscreen());

displayFolder
  .add(params, "dpr", 0.5, 3.0, 0.1)
  .name("DPR (Pixel Ratio)")
  .onChange((val) => renderer.setPixelRatio(val));

displayFolder
  .add(params, "zoom", 5, 50, 0.5)
  .name("Camera Zoom")
  .onChange((val) => {
    camera.position.z = val;
  });

// Animations Folder
const animFolder = gui.addFolder("Animations");
animFolder
  .add(params, "animPreset", [
    "Static (No Cam Move)",
    "Gentle Orbit",
    "Ethereal Figure-8",
    "Deep Breathing",
    "Haunted Spiral"
  ])
  .name("Animation Preset");

animFolder
  .add(params, "animSpeed", 0.1, 3.0, 0.1)
  .name("Animation Speed");

// Custom SVG Form Folder
const svgFolder = gui.addFolder("Custom SVG Form");
svgFolder
  .add({ upload: () => svgInput.click() }, "upload")
  .name("Upload SVG Form");

// Behavior Folder
const behaviorFolder = gui.addFolder("Behavior & Effects");
behaviorFolder.add(params, "followSpeed", 0.01, 0.2, 0.005).name("Follow Speed");
behaviorFolder.add(params, "wobbleAmount", 0, 1, 0.05).name("Wobble");

behaviorFolder
  .add(params, "limboMode")
  .name("Limbo Mode")
  .onChange((val) => {
    analogDecayPass.uniforms.uLimboMode.value = val ? 1.0 : 0.0;
  });

behaviorFolder
  .add(params, "analogIntensity", 0, 2, 0.1)
  .name("Analog Decay")
  .onChange((val) => {
    analogDecayPass.uniforms.uAnalogIntensity.value = val;
  });

gui.open();

// Hide / Show UI on "H" key press
window.addEventListener("keydown", (e) => {
  if (e.key === "h" || e.key === "H") {
    if (gui._hidden) {
      gui.show();
    } else {
      gui.hide();
    }
  }
});

// Interactive Drag & Zoom Controls
let isDragging = false;
let prevPointerPos = { x: 0, y: 0 };

window.addEventListener("pointerdown", (e) => {
  if (e.target === renderer.domElement) {
    isDragging = true;
    prevPointerPos = { x: e.clientX, y: e.clientY };
  }
});

window.addEventListener("pointermove", (e) => {
  if (isDragging) {
    const deltaX = (e.clientX - prevPointerPos.x) * 0.03;
    const deltaY = (e.clientY - prevPointerPos.y) * 0.03;

    ghostGroup.position.x += deltaX;
    ghostGroup.position.y -= deltaY;

    prevPointerPos = { x: e.clientX, y: e.clientY };
  }
});

window.addEventListener("pointerup", () => {
  isDragging = false;
});

// Mouse wheel zoom
window.addEventListener("wheel", (e) => {
  params.zoom = Math.min(Math.max(params.zoom + e.deltaY * 0.015, 5), 50);
  camera.position.z = params.zoom;
  gui.controllers.forEach(c => {
    if (c.property === "zoom") c.updateDisplay();
  });
}, { passive: true });

// Mouse Tracking for Ghost Following
const mouse = new THREE.Vector2();
const prevMouse = new THREE.Vector2();
const mouseSpeed = new THREE.Vector2();
let lastMouseUpdate = 0;
let isMouseMoving = false;
let mouseMovementTimer = null;

window.addEventListener("mousemove", (e) => {
  const now = performance.now();
  if (now - lastMouseUpdate > 16) {
    prevMouse.x = mouse.x;
    prevMouse.y = mouse.y;
    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    mouseSpeed.x = mouse.x - prevMouse.x;
    mouseSpeed.y = mouse.y - prevMouse.y;
    isMouseMoving = true;

    if (mouseMovementTimer) clearTimeout(mouseMovementTimer);
    mouseMovementTimer = setTimeout(() => {
      isMouseMoving = false;
    }, 80);

    lastMouseUpdate = now;
  }
});

// Window Resize
let resizeTimeout;
window.addEventListener("resize", () => {
  if (resizeTimeout) clearTimeout(resizeTimeout);
  resizeTimeout = setTimeout(() => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    composer.setSize(window.innerWidth, window.innerHeight);
    bloomPass.setSize(window.innerWidth, window.innerHeight);
    analogDecayPass.uniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
  }, 250);
});

// Animation Loop
let lastParticleTime = 0;
let time = 0;
let currentMovement = 0;
let lastFrameTime = 0;
let isInitialized = false;
let frameCount = 0;

function forceInitialRender() {
  for (let i = 0; i < 3; i++) composer.render();
  for (let i = 0; i < 10; i++) createParticle();
  composer.render();
  isInitialized = true;
  preloader.complete(renderer.domElement);
}

preloader.updateProgress(5);
setTimeout(forceInitialRender, 100);

function animate(timestamp) {
  requestAnimationFrame(animate);
  if (!isInitialized) return;

  const deltaTime = timestamp - lastFrameTime;
  lastFrameTime = timestamp;
  if (deltaTime > 100) return;

  const scaledDelta = (deltaTime / 16.67) * 0.01 * params.animSpeed;
  time += scaledDelta;
  frameCount++;

  // Camera Animation Presets
  const camTime = time * 0.8;
  if (params.animPreset === "Gentle Orbit") {
    camera.position.x = Math.sin(camTime * 0.3) * 4;
    camera.position.y = Math.cos(camTime * 0.2) * 2;
    camera.lookAt(0, 0, 0);
  } else if (params.animPreset === "Ethereal Figure-8") {
    camera.position.x = Math.sin(camTime * 0.4) * 5;
    camera.position.y = Math.sin(camTime * 0.8) * 2.5;
    camera.lookAt(0, 0, 0);
  } else if (params.animPreset === "Deep Breathing") {
    camera.position.z = params.zoom + Math.sin(camTime * 0.5) * 3;
    camera.position.y = Math.sin(camTime * 0.3) * 1.5;
    camera.lookAt(0, 0, 0);
  } else if (params.animPreset === "Haunted Spiral") {
    const r = 3 + Math.sin(camTime * 0.2) * 2;
    camera.position.x = Math.cos(camTime * 0.3) * r;
    camera.position.y = Math.sin(camTime * 0.3) * r;
    camera.lookAt(0, 0, 0);
  } else {
    // Static (No Cam Move)
    camera.position.x = 0;
    camera.position.y = 0;
    camera.position.z = params.zoom;
    camera.lookAt(0, 0, 0);
  }

  // Shader Uniform Updates
  atmosphereMaterial.uniforms.time.value = time;
  analogDecayPass.uniforms.uTime.value = time;
  analogDecayPass.uniforms.uLimboMode.value = params.limboMode ? 1.0 : 0.0;

  // Ghost Autonomous Self-Animation (independent of cursor)
  if (!isDragging) {
    const autoX = Math.sin(time * 0.8) * 5 + Math.sin(time * 1.5) * 2;
    const autoY = Math.cos(time * 0.6) * 3 + Math.sin(time * 1.1) * 1.5;
    const prevPos = ghostGroup.position.clone();

    ghostGroup.position.x += (autoX - ghostGroup.position.x) * params.followSpeed;
    ghostGroup.position.y += (autoY - ghostGroup.position.y) * params.followSpeed;

    const movementAmount = prevPos.distanceTo(ghostGroup.position);
    currentMovement = currentMovement * params.eyeGlowDecay + movementAmount * (1 - params.eyeGlowDecay);
  }

  atmosphereMaterial.uniforms.ghostPosition.value.copy(ghostGroup.position);

  // Floating Motion
  const float1 = Math.sin(time * params.floatSpeed * 1.5) * 0.03;
  const float2 = Math.cos(time * params.floatSpeed * 0.7) * 0.018;
  ghostGroup.position.y += float1 + float2;

  // Pulsing Glow
  const pulse = Math.sin(time * 1.6) * 0.6;
  const breathe = Math.sin(time * 0.6) * 0.12;
  ghostMaterial.emissiveIntensity = params.emissiveIntensity + pulse + breathe;

  // Fireflies Animation
  fireflies.forEach((firefly) => {
    const userData = firefly.userData;
    const pPhase = time + userData.phase;
    const fPulse = Math.sin(pPhase * userData.pulseSpeed) * 0.4 + 0.6;

    userData.glowMaterial.opacity = params.fireflyGlowIntensity * 0.4 * fPulse;
    userData.fireflyMaterial.opacity = params.fireflyGlowIntensity * 0.9 * fPulse;
    userData.light.intensity = params.fireflyGlowIntensity * 0.8 * fPulse;

    userData.velocity.x += (Math.random() - 0.5) * 0.001;
    userData.velocity.y += (Math.random() - 0.5) * 0.001;
    userData.velocity.z += (Math.random() - 0.5) * 0.001;
    userData.velocity.clampLength(0, params.fireflySpeed);

    firefly.position.add(userData.velocity);
    if (Math.abs(firefly.position.x) > 30) userData.velocity.x *= -0.5;
    if (Math.abs(firefly.position.y) > 20) userData.velocity.y *= -0.5;
    if (Math.abs(firefly.position.z) > 15) userData.velocity.z *= -0.5;
  });

  // Mesh Wobble & Tilt
  const tiltStrength = 0.1 * params.wobbleAmount;
  ghostBody.rotation.z = Math.sin(time * 1.4) * tiltStrength;
  ghostBody.rotation.x = Math.cos(time * 1.1) * tiltStrength;
  ghostBody.rotation.y = Math.sin(time * 1.4) * 0.05 * params.wobbleAmount;

  // Eye Glow Animation
  const autoGlow = 0.6 + 0.4 * Math.sin(time * 2.5);
  const targetGlow = currentMovement > 0.001 ? autoGlow : 0.4;
  const glowChangeSpeed = params.eyeGlowResponse;
  const newOpacity = eyes.leftEyeMaterial.opacity + (targetGlow - eyes.leftEyeMaterial.opacity) * glowChangeSpeed;

  eyes.leftEyeMaterial.opacity = newOpacity;
  eyes.rightEyeMaterial.opacity = newOpacity;
  eyes.leftOuterGlowMaterial.opacity = newOpacity * 0.35;
  eyes.rightOuterGlowMaterial.opacity = newOpacity * 0.35;

  // Continuous Particle Generation from Ghost Motion
  if (timestamp - lastParticleTime > 120) {
    for (let i = 0; i < params.particleCreationRate; i++) {
      createParticle();
    }
    lastParticleTime = timestamp;
  }

  // Particle Updates
  const particlesToUpdate = Math.min(particles.length, 60);
  for (let i = 0; i < particlesToUpdate; i++) {
    const index = (frameCount + i) % particles.length;
    if (index < particles.length) {
      const particle = particles[index];
      particle.userData.life -= particle.userData.decay;
      particle.material.opacity = particle.userData.life * 0.85;

      if (particle.userData.velocity) {
        particle.position.x += particle.userData.velocity.x;
        particle.position.y += particle.userData.velocity.y;
        particle.position.z += particle.userData.velocity.z;
        particle.position.x += Math.cos(time * 1.8 + particle.position.y) * 0.0008;
      }

      if (particle.userData.rotationSpeed) {
        particle.rotation.x += particle.userData.rotationSpeed.x;
        particle.rotation.y += particle.userData.rotationSpeed.y;
        particle.rotation.z += particle.userData.rotationSpeed.z;
      }

      if (particle.userData.life <= 0) {
        particle.visible = false;
        particle.material.opacity = 0;
        particlePool.push(particle);
        particles.splice(index, 1);
        i--;
      }
    }
  }

  composer.render();
}

// Initial fake event
const fakeEvent = new MouseEvent("mousemove", {
  clientX: window.innerWidth / 2,
  clientY: window.innerHeight / 2
});
window.dispatchEvent(fakeEvent);

animate(0);
</script>
