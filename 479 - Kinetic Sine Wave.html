<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Kinetic Sine Wave - 479</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000;
      user-select: none;
      -webkit-user-select: none;
    }
    #webgl-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: grab;
      touch-action: none;
    }
    #webgl-canvas:active {
      cursor: grabbing;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
    }
  }
  </script>
</head>
<body>
  <canvas id="webgl-canvas"></canvas>

  <!-- vertexShader -->
  <script id="js-vertex-shader" type="x-shader/x-vertex">
attribute vec3 position;

void main() {
  gl_Position = vec4(position, 1.0);
}
  </script>

  <!-- fragmentShader -->
  <script id="js-fragment-shader" type="x-shader/x-fragment">
precision highp float;

uniform vec2 resolution;
uniform float time;
uniform float xScale;
uniform float yScale;
uniform float distortion;

uniform vec2 offset;
uniform float zoom;
uniform float rotation;
uniform float glow;

uniform vec3 color1;
uniform vec3 color2;
uniform vec3 color3;
uniform vec3 colorAccent;
uniform vec3 bgColor;
uniform float greenscreen;

void main() {
  vec2 screenP = (gl_FragCoord.xy * 2.0 - resolution) / min(resolution.x, resolution.y);
  vec2 p = (screenP - offset) / max(zoom, 0.001);
  
  if (rotation != 0.0) {
    float c = cos(rotation);
    float s = sin(rotation);
    p = vec2(c * p.x - s * p.y, s * p.x + c * p.y);
  }
  
  float d = length(p) * distortion;
  
  float rx = p.x * (1.0 + d);
  float gx = p.x;
  float bx = p.x * (1.0 - d);

  float baseGlow = 0.05 * glow;

  float r = baseGlow / max(abs(p.y + sin((rx + time) * xScale) * yScale), 0.0005);
  float g = baseGlow / max(abs(p.y + sin((gx + time) * xScale) * yScale), 0.0005);
  float b = baseGlow / max(abs(p.y + sin((bx + time) * xScale) * yScale), 0.0005);
  
  vec3 waveColor = r * color1 + g * color2 + b * color3;
  
  // Highlight core overlap with accent color
  float overlap = min(r, min(g, b));
  waveColor += overlap * colorAccent * 0.45;

  vec3 finalColor;

  if (greenscreen > 0.5) {
    vec3 green = vec3(0.0, 1.0, 0.0);
    float intensity = smoothstep(0.05, 0.75, max(r, max(g, b)));
    finalColor = mix(green, waveColor, intensity);
  } else {
    float bgBrightness = dot(bgColor, vec3(0.299, 0.587, 0.114));
    if (bgBrightness < 0.45) {
      finalColor = bgColor + waveColor;
    } else {
      float totalIntensity = smoothstep(0.04, 0.85, max(r, max(g, b)));
      vec3 targetWave = (r * color1 + g * color2 + b * color3) / max(0.001, r + g + b);
      finalColor = mix(bgColor, targetWave, totalIntensity);
    }
  }

  gl_FragColor = vec4(finalColor, 1.0);
}
  </script>

  <script type="module">
    import * as THREE from 'three';
    import GUI from 'lil-gui';

    // =========================================================================
    // 19+ PRECONFIGURED COLOR SCHEMES
    // =========================================================================
    const COLOR_SCHEMES = {

      'Palette 5 (D4FFB0, 7FFF00, 00B894, 0A3322, 05140A)': {
        background: '#05140A',

      },
      'Palette 6 (FFE8CC, FF8C00, C7501A, 3D1050, 0E0618)': {
        background: '#0E0618',
        color1: '#FFE8CC',
        color2: '#FF8C00',
        color3: '#C7501A',
        accent: '#3D1050'
      },
      'Palette 7 (E8E0FF, B38FFF, 6A3DE8, 1A1250, 090612)': {
        background: '#090612',
        color1: '#E8E0FF',
        color2: '#B38FFF',
        color3: '#6A3DE8',
        accent: '#1A1250'
      },
      'Palette 8 (E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)': {
        background: '#05020F',
        color1: '#E0FBFF',
        color2: '#00F0FF',
        color3: '#D40078',
        accent: '#1E0A3D'
      }
    };

    // =========================================================================
    // 8 PRECONFIGURED MOTION PRESETS
    // =========================================================================
    const ANIMATION_PRESETS = [
      'Continuous Flow',
      'Harmonic Pulse',
      'Chromatic Surge',
      'Quantum Interference',
      'Pendulum Oscillation',
      'Hyperdrive Warp',
      'Ethereal Drift',
      'Chaotic Turbulence'
    ];

    // =========================================================================
    // INITIAL PARAMETERS
    // =========================================================================
    const initialScheme = COLOR_SCHEMES['Original'];

    const params = {
      // Theme & Color
      colorScheme: 'Original',
      greenscreen: false,
      backgroundColor: initialScheme.background,
      color1: initialScheme.color1,
      color2: initialScheme.color2,
      color3: initialScheme.color3,
      colorAccent: initialScheme.accent,
      glow: 1.0,

      // Wave Geometry
      xScale: 1.0,
      yScale: 0.5,
      distortion: 0.050,
      rotation: 0.0,

      // Motion & Animation
      animation: 'Continuous Flow',
      animationSpeed: 1.0,
      isPlaying: true,

      // Transform & Navigation
      zoom: 1.0,
      panX: 0.0,
      panY: 0.0,

      // Interaction
      randomizeOnClick: true,
      randomize: () => randomizeScene(),
      resetView: () => resetTransform()
    };

    // =========================================================================
    // STAGE CLASS
    // =========================================================================
    class Stage {
      constructor() {
        this.renderParam = {
          clearColor: initialScheme.background,
          width: window.innerWidth,
          height: window.innerHeight
        };

        this.cameraParam = {
          left: -1,
          right: 1,
          top: 1,
          bottom: -1,
          near: 0.1,
          far: 10
        };

        this.scene = null;
        this.camera = null;
        this.renderer = null;
        this.isInitialized = false;
      }

      init() {
        this._setScene();
        this._setRender();
        this._setCamera();
        this.isInitialized = true;
      }

      _setScene() {
        this.scene = new THREE.Scene();
      }

      _setRender() {
        this.renderer = new THREE.WebGLRenderer({
          canvas: document.getElementById("webgl-canvas"),
          antialias: true,
          powerPreference: "high-performance"
        });
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        this.renderer.setClearColor(new THREE.Color(this.renderParam.clearColor), 1.0);
        this.renderer.setSize(this.renderParam.width, this.renderParam.height);
      }

      _setCamera() {
        if (!this.isInitialized) {
          this.camera = new THREE.OrthographicCamera(
            this.cameraParam.left,
            this.cameraParam.right,
            this.cameraParam.top,
            this.cameraParam.bottom,
            this.cameraParam.near,
            this.cameraParam.far
          );
          this.camera.position.z = 1;
        }

        const windowWidth = window.innerWidth;
        const windowHeight = window.innerHeight;

        this.camera.updateProjectionMatrix();
        this.renderer.setSize(windowWidth, windowHeight);
      }

      _render() {
        this.renderer.render(this.scene, this.camera);
      }

      onResize() {
        this._setCamera();
      }

      onRaf() {
        this._render();
      }
    }

    // =========================================================================
    // MESH CLASS
    // =========================================================================
    class Mesh {
      constructor(stage) {
        this.stage = stage;
        this.mesh = null;

        const canvas = stage.renderer.domElement;
        this.uniforms = {
          resolution: { value: new THREE.Vector2(canvas.width, canvas.height) },
          time: { value: 0.0 },
          xScale: { value: params.xScale },
          yScale: { value: params.yScale },
          distortion: { value: params.distortion },
          offset: { value: new THREE.Vector2(params.panX, params.panY) },
          zoom: { value: params.zoom },
          rotation: { value: (params.rotation * Math.PI) / 180.0 },
          glow: { value: params.glow },
          color1: { value: new THREE.Color(params.color1) },
          color2: { value: new THREE.Color(params.color2) },
          color3: { value: new THREE.Color(params.color3) },
          colorAccent: { value: new THREE.Color(params.colorAccent) },
          bgColor: { value: new THREE.Color(params.backgroundColor) },
          greenscreen: { value: params.greenscreen ? 1.0 : 0.0 }
        };
      }

      init() {
        this._setMesh();
      }

      _setMesh() {
        const position = [
          -1.0, -1.0, 0.0,
           1.0, -1.0, 0.0,
          -1.0,  1.0, 0.0,
           1.0, -1.0, 0.0,
          -1.0,  1.0, 0.0,
           1.0,  1.0, 0.0
        ];

        const positions = new THREE.BufferAttribute(new Float32Array(position), 3);
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute("position", positions);

        const material = new THREE.RawShaderMaterial({
          vertexShader: document.getElementById("js-vertex-shader").textContent,
          fragmentShader: document.getElementById("js-fragment-shader").textContent,
          uniforms: this.uniforms,
          side: THREE.DoubleSide
        });

        this.mesh = new THREE.Mesh(geometry, material);
        this.stage.scene.add(this.mesh);
      }
    }

    // =========================================================================
    // APP INITIALIZATION & CONTROL STATE
    // =========================================================================
    const stage = new Stage();
    stage.init();

    const mesh = new Mesh(stage);
    mesh.init();

    function updateColors() {
      mesh.uniforms.color1.value.set(params.color1);
      mesh.uniforms.color2.value.set(params.color2);
      mesh.uniforms.color3.value.set(params.color3);
      mesh.uniforms.colorAccent.value.set(params.colorAccent);
      mesh.uniforms.bgColor.value.set(params.backgroundColor);
    }

    function updateBackground() {
      if (params.greenscreen) {
        stage.renderer.setClearColor(0x00ff00, 1.0);
        document.body.style.backgroundColor = '#00ff00';
        mesh.uniforms.greenscreen.value = 1.0;
      } else {
        stage.renderer.setClearColor(new THREE.Color(params.backgroundColor), 1.0);
        document.body.style.backgroundColor = params.backgroundColor;
        mesh.uniforms.greenscreen.value = 0.0;
      }
    }

    function applyColorScheme(schemeName) {
      const scheme = COLOR_SCHEMES[schemeName];
      if (!scheme) return;

      params.colorScheme = schemeName;
      params.backgroundColor = scheme.background;
      params.color1 = scheme.color1;
      params.color2 = scheme.color2;
      params.color3 = scheme.color3;
      params.colorAccent = scheme.accent;

      updateColors();
      updateBackground();
      updateGuiDisplay();
    }

    function resetTransform() {
      params.zoom = 1.0;
      params.panX = 0.0;
      params.panY = 0.0;
      mesh.uniforms.zoom.value = 1.0;
      mesh.uniforms.offset.value.set(0.0, 0.0);
      updateGuiDisplay();
    }

    function randomizeScene() {
      // 1. Pick a random color scheme from the 19 schemes
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      applyColorScheme(randomScheme);

      // 2. Re-roll geometric parameters
      params.xScale = +(0.5 + Math.random() * 2.8).toFixed(2);
      params.yScale = +(0.2 + Math.random() * 0.75).toFixed(2);
      params.distortion = +(0.012 + Math.random() * 0.12).toFixed(3);
      params.rotation = +((-45 + Math.random() * 90)).toFixed(1);
      params.glow = +(0.7 + Math.random() * 0.8).toFixed(2);

      // 3. Re-roll motion parameters
      params.animation = ANIMATION_PRESETS[Math.floor(Math.random() * ANIMATION_PRESETS.length)];
      params.animationSpeed = +(0.6 + Math.random() * 1.4).toFixed(2);

      // Update uniforms
      mesh.uniforms.xScale.value = params.xScale;
      mesh.uniforms.yScale.value = params.yScale;
      mesh.uniforms.distortion.value = params.distortion;
      mesh.uniforms.rotation.value = (params.rotation * Math.PI) / 180.0;
      mesh.uniforms.glow.value = params.glow;

      updateGuiDisplay();
    }

    // =========================================================================
    // LIL-GUI CONTROL PANEL
    // =========================================================================
    const gui = new GUI({ title: 'Kinetic Sine Wave - 479' });

    gui.add(params, 'randomizeOnClick').name('Randomize on Click');
    gui.add(params, 'randomize').name('🎲 Generate Variation');

    // Color & Theme Folder
    const fTheme = gui.addFolder('Colors & Theme');
    const cScheme = fTheme.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Color Scheme')
      .onChange(val => applyColorScheme(val));

    const cGreenscreen = fTheme.add(params, 'greenscreen').name('Greenscreen (#00ff00)')
      .onChange(() => updateBackground());

    const cBg = fTheme.addColor(params, 'backgroundColor').name('Background Color')
      .onChange(() => {
        params.colorScheme = 'Custom';
        cScheme.updateDisplay();
        updateBackground();
      });

    const c1 = fTheme.addColor(params, 'color1').name('Wave 1 (Red Band)')
      .onChange(() => {
        params.colorScheme = 'Custom';
        cScheme.updateDisplay();
        updateColors();
      });

    const c2 = fTheme.addColor(params, 'color2').name('Wave 2 (Green Band)')
      .onChange(() => {
        params.colorScheme = 'Custom';
        cScheme.updateDisplay();
        updateColors();
      });

    const c3 = fTheme.addColor(params, 'color3').name('Wave 3 (Blue Band)')
      .onChange(() => {
        params.colorScheme = 'Custom';
        cScheme.updateDisplay();
        updateColors();
      });

    const cAccent = fTheme.addColor(params, 'colorAccent').name('Accent Core')
      .onChange(() => {
        params.colorScheme = 'Custom';
        cScheme.updateDisplay();
        updateColors();
      });

    const cGlow = fTheme.add(params, 'glow', 0.1, 3.0, 0.05).name('Glow Intensity')
      .onChange(val => { mesh.uniforms.glow.value = val; });

    // Wave Geometry Folder
    const fGeometry = gui.addFolder('Wave Geometry');
    const cXScale = fGeometry.add(params, 'xScale', 0.1, 8.0, 0.01).name('Frequency (xScale)')
      .onChange(val => { mesh.uniforms.xScale.value = val; });

    const cYScale = fGeometry.add(params, 'yScale', 0.05, 2.0, 0.01).name('Amplitude (yScale)')
      .onChange(val => { mesh.uniforms.yScale.value = val; });

    const cDistortion = fGeometry.add(params, 'distortion', 0.001, 0.25, 0.001).name('Distortion')
      .onChange(val => { mesh.uniforms.distortion.value = val; });

    const cRotation = fGeometry.add(params, 'rotation', -180, 180, 0.5).name('Rotation (deg)')
      .onChange(val => { mesh.uniforms.rotation.value = (val * Math.PI) / 180.0; });

    // Animation & Motion Folder
    const fMotion = gui.addFolder('Animation & Motion');
    const cAnim = fMotion.add(params, 'animation', ANIMATION_PRESETS).name('Motion Preset');
    const cSpeed = fMotion.add(params, 'animationSpeed', 0.0, 5.0, 0.1).name('Speed Multiplier');
    const cPlay = fMotion.add(params, 'isPlaying').name('Play Animation');

    // Navigation Folder
    const fNav = gui.addFolder('Zoom & Pan');
    const cZoom = fNav.add(params, 'zoom', 0.1, 10.0, 0.01).name('Zoom')
      .onChange(val => { mesh.uniforms.zoom.value = val; });

    const cPanX = fNav.add(params, 'panX', -5.0, 5.0, 0.01).name('Pan X')
      .onChange(() => { mesh.uniforms.offset.value.set(params.panX, params.panY); });

    const cPanY = fNav.add(params, 'panY', -5.0, 5.0, 0.01).name('Pan Y')
      .onChange(() => { mesh.uniforms.offset.value.set(params.panX, params.panY); });

    fNav.add(params, 'resetView').name('Reset View');

    function updateGuiDisplay() {
      if (typeof gui.controllersRecursive === 'function') {
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      } else {
        const updateFolder = (folder) => {
          folder.controllers.forEach(c => c.updateDisplay());
          folder.folders.forEach(f => updateFolder(f));
        };
        updateFolder(gui);
      }
    }

    // =========================================================================
    // INTERACTION HANDLERS: DRAGGING, ZOOM & CLICK RANDOMIZATION
    // =========================================================================
    const canvas = document.getElementById("webgl-canvas");
    let isPointerDown = false;
    let hasDragged = false;
    let startX = 0, startY = 0;
    let startPanX = 0, startPanY = 0;

    canvas.addEventListener('pointerdown', (e) => {
      if (e.target.closest && e.target.closest('.lil-gui')) return;

      isPointerDown = true;
      hasDragged = false;
      startX = e.clientX;
      startY = e.clientY;
      startPanX = params.panX;
      startPanY = params.panY;

      try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!isPointerDown) return;

      const dx = e.clientX - startX;
      const dy = e.clientY - startY;

      if (Math.hypot(dx, dy) > 4) {
        hasDragged = true;
      }

      // Convert screen pixel delta to normalized WebGL coordinate delta
      const minDim = Math.min(window.innerWidth, window.innerHeight);
      params.panX = startPanX + (dx * 2.0) / minDim;
      params.panY = startPanY - (dy * 2.0) / minDim;

      mesh.uniforms.offset.value.set(params.panX, params.panY);
      cPanX.updateDisplay();
      cPanY.updateDisplay();
    });

    canvas.addEventListener('pointerup', (e) => {
      if (!isPointerDown) return;
      isPointerDown = false;

      try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}

      // Click without drag: trigger procedural variation
      if (!hasDragged && e.button === 0) {
        if (params.randomizeOnClick) {
          randomizeScene();
        }
      }
    });

    // Zoom with mouse wheel: smoothly scales params.zoom
    window.addEventListener('wheel', (e) => {
      if (e.target.closest && e.target.closest('.lil-gui')) return;
      e.preventDefault();

      const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
      params.zoom = Math.max(0.1, Math.min(20.0, params.zoom * zoomFactor));
      mesh.uniforms.zoom.value = params.zoom;
      cZoom.updateDisplay();
    }, { passive: false });

    // Toggle GUI visibility with 'H' key
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        if (gui._hidden) {
          gui.show();
        } else {
          gui.hide();
        }
      }
    });

    // Handle window resize
    window.addEventListener('resize', () => {
      stage.onResize();
      mesh.uniforms.resolution.value.set(
        stage.renderer.domElement.width,
        stage.renderer.domElement.height
      );
    });

    // =========================================================================
    // ANIMATION LOOP
    // =========================================================================
    let lastTime = performance.now();
    let virtualTime = 0.0;

    const animate = () => {
      requestAnimationFrame(animate);

      const now = performance.now();
      const delta = Math.min((now - lastTime) / 1000.0, 0.1);
      lastTime = now;

      if (params.isPlaying) {
        virtualTime += delta * params.animationSpeed;

        let effXScale = params.xScale;
        let effYScale = params.yScale;
        let effDistortion = params.distortion;
        let effRotation = (params.rotation * Math.PI) / 180.0;
        const timeStep = delta * params.animationSpeed * 1.5;

        switch (params.animation) {
          case 'Continuous Flow':
            mesh.uniforms.time.value += timeStep;
            break;
          case 'Harmonic Pulse':
            mesh.uniforms.time.value += timeStep;
            effXScale *= (1.0 + 0.22 * Math.sin(virtualTime * 2.2));
            effYScale *= (1.0 + 0.18 * Math.cos(virtualTime * 1.7));
            break;
          case 'Chromatic Surge':
            mesh.uniforms.time.value += timeStep;
            effDistortion *= (1.0 + 0.65 * Math.sin(virtualTime * 2.5));
            break;
          case 'Quantum Interference':
            mesh.uniforms.time.value += timeStep * (1.0 + 0.5 * Math.sin(virtualTime * 3.0));
            effXScale *= (1.0 + 0.3 * Math.sin(virtualTime * 3.8));
            break;
          case 'Pendulum Oscillation':
            mesh.uniforms.time.value += Math.sin(virtualTime * 1.8) * timeStep * 1.5;
            effRotation += Math.sin(virtualTime * 1.4) * 0.2;
            break;
          case 'Hyperdrive Warp':
            mesh.uniforms.time.value += timeStep * 2.5;
            effDistortion *= (1.0 + 0.45 * Math.sin(virtualTime * 5.0));
            break;
          case 'Ethereal Drift':
            mesh.uniforms.time.value += timeStep * 0.35;
            break;
          case 'Chaotic Turbulence':
            mesh.uniforms.time.value += timeStep * 1.8;
            effXScale *= (1.0 + 0.25 * Math.sin(virtualTime * 2.3) + 0.15 * Math.cos(virtualTime * 4.7));
            effYScale *= (1.0 + 0.2 * Math.cos(virtualTime * 3.1));
            effDistortion *= (1.0 + 0.35 * Math.sin(virtualTime * 3.7));
            break;
        }

        mesh.uniforms.xScale.value = effXScale;
        mesh.uniforms.yScale.value = effYScale;
        mesh.uniforms.distortion.value = effDistortion;
        mesh.uniforms.rotation.value = effRotation;
      }

      stage.onRaf();
    };

    animate();
  </script>
</body>
</html>
