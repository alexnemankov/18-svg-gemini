<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bokeh Background</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet">

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <style>
    body, html, #app {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      background-color: #000000;
      transition: background-color 0.3s ease;
    }

    body.greenscreen, body.greenscreen #app {
      background-color: #00ff00 !important;
      background: #00ff00 !important;
    }

    #app {
      overflow: hidden;
      touch-action: pan-up;
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      text-shadow: 0 0 5px #ffffff, 0 0 20px #000, 0 0 30px #000;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    #app h1 {
      font-size: 60px;
      text-transform: uppercase;
      margin: 0;
      user-select: none;
      pointer-events: none;
    }

    #app a {
      text-decoration: none;
      color: #fff;
    }

    #app canvas {
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }

    .lil-gui, .lil-gui * {
      cursor: auto !important;
    }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="webgl-canvas"></canvas>
    <div id="hero">
      <h1>Bokeh background</h1>
    </div>
  </div>

  <input type="file" id="svg-upload" accept=".svg" style="display: none;">

  <script type="module">
    import { Bokeh1Background } from 'https://cdn.jsdelivr.net/npm/threejs-components@0.0.2/build/backgrounds/bokeh1.cdn.min.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { SVGLoader } from 'three/addons/loaders/SVGLoader.js';
    import { GUI } from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';
    import * as THREE from 'three';

    // Initialize Bokeh1Background from threejs-components
    const canvasElement = document.getElementById('webgl-canvas');
    const bokeh1Background = Bokeh1Background(canvasElement);
    bokeh1Background.loadMap('https://cdn.jsdelivr.net/npm/threejs-components@0.0.2/build/assets/bokeh-particles2.png');

    // Attach OrbitControls to Bokeh1Background camera for wheel zoom & controls
    const camera = bokeh1Background.three.camera;
    const renderer = bokeh1Background.three.renderer;
    const particlesMesh = bokeh1Background.particles;

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.enableZoom = true;
    controls.zoomSpeed = 1.2;

    // Helper functions for hex color conversion
    function hexToNum(hexStr) {
      if (typeof hexStr === 'number') return hexStr;
      return parseInt(hexStr.replace('#', '0x'), 16);
    }
    function numToHex(num) {
      return '#' + (16777215 & num).toString(16).padStart(6, '0');
    }

    // 5 Popular & Original Presetupped Color Schemes
    const COLOR_SCHEMES = {
      'Magenta Sunset': [0x6d4862, 0xfd826c, 0x22ccc1],
      'Cyber Neon': [0xff007f, 0x00f3ff, 0x9d00ff],
      'Golden Amber': [0xffaa00, 0xff4500, 0xffe600],
      'Ocean Teal': [0x0077be, 0x00e5ff, 0x1de9b6],
      'Cosmic Aurora': [0xaa00ff, 0x3d5afe, 0x00e5ff]
    };

    let activeColors = [...COLOR_SCHEMES['Magenta Sunset']];
    bokeh1Background.setColors(activeColors);

    // Save initial instance matrices of Bokeh1Background particles
    const originalMatrices = [];
    const tempMatrix = new THREE.Matrix4();
    for (let i = 0; i < particlesMesh.count; i++) {
      particlesMesh.getMatrixAt(i, tempMatrix);
      originalMatrices.push(tempMatrix.clone());
    }

    // Default SVG Target Points Generator (Star / Flower outline)
    function generateDefaultSVGPoints() {
      const points = [];
      const count = particlesMesh.count;
      for (let i = 0; i < count; i++) {
        const theta = (i / count) * Math.PI * 2 * 6;
        const r = 0.55 * (1 + 0.35 * Math.sin(5 * theta / 6));
        const x = r * Math.cos(theta);
        const y = r * Math.sin(theta);
        const z = Math.sin(theta * 2) * 0.1;
        points.push(new THREE.Vector3(x, y, z));
      }
      return points;
    }

    let svgTargetPositions = generateDefaultSVGPoints();

    // Settings Configuration for lil-gui
    const settings = {
      greenscreen: false,
      colorScheme: 'Magenta Sunset',
      customColor1: numToHex(activeColors[0]),
      customColor2: numToHex(activeColors[1]),
      customColor3: numToHex(activeColors[2]),
      animation: 'Gentle Orbit',
      animationSpeed: 1.0,
      dpr: Math.min(window.devicePixelRatio, 2),
      formSVG: false,
      uploadSVG: () => document.getElementById('svg-upload').click()
    };

    const gui = new GUI({ title: 'Bokeh Settings' });

    // Green Screen (#00ff00)
    gui.add(settings, 'greenscreen').name('Green Screen (#00ff00)').onChange(val => {
      if (val) {
        document.body.classList.add('greenscreen');
        bokeh1Background.setBackgroundColor(0x00ff00);
        renderer.setClearColor(0x00ff00, 1.0);
      } else {
        document.body.classList.remove('greenscreen');
        bokeh1Background.three.scene.background = null;
        renderer.setClearColor(0x000000, 0.0);
      }
    });

    // Color Customization
    const colorFolder = gui.addFolder('Color Schemes & Custom');
    colorFolder.add(settings, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Preset Scheme').onChange(schemeName => {
      activeColors = [...COLOR_SCHEMES[schemeName]];
      bokeh1Background.setColors(activeColors);
      settings.customColor1 = numToHex(activeColors[0]);
      settings.customColor2 = numToHex(activeColors[1]);
      settings.customColor3 = numToHex(activeColors[2]);
      c1Ctrl.setValue(settings.customColor1);
      c2Ctrl.setValue(settings.customColor2);
      c3Ctrl.setValue(settings.customColor3);
    });

    const c1Ctrl = colorFolder.addColor(settings, 'customColor1').name('Color 1').onChange(() => updateCustomColors());
    const c2Ctrl = colorFolder.addColor(settings, 'customColor2').name('Color 2').onChange(() => updateCustomColors());
    const c3Ctrl = colorFolder.addColor(settings, 'customColor3').name('Color 3').onChange(() => updateCustomColors());

    function updateCustomColors() {
      activeColors = [
        hexToNum(settings.customColor1),
        hexToNum(settings.customColor2),
        hexToNum(settings.customColor3)
      ];
      bokeh1Background.setColors(activeColors);
    }

    // Animation & DPR Controls
    const animFolder = gui.addFolder('Animation & Render');
    animFolder.add(settings, 'animation', [
      'Static Float',
      'Gentle Orbit',
      'Breathing Zoom',
      'Harmonic Wave',
      'Spiral Drift'
    ]).name('Preset Animation');

    animFolder.add(settings, 'animationSpeed', 0.1, 3.0, 0.1).name('Animation Speed');

    animFolder.add(settings, 'dpr', 0.5, 3.0, 0.1).name('Pixel Ratio (DPR)').onChange(val => {
      bokeh1Background.three.maxPixelRatio = val;
      bokeh1Background.three.minPixelRatio = val;
      renderer.setPixelRatio(val);
    });

    // SVG Form & Custom Upload
    const svgFolder = gui.addFolder('SVG Form & Custom Upload');
    const formSvgCtrl = svgFolder.add(settings, 'formSVG').name('Form SVG Shape');
    svgFolder.add(settings, 'uploadSVG').name('Upload Custom SVG');

    // Parse SVG Upload
    document.getElementById('svg-upload').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (evt) => {
        const svgContent = evt.target.result;
        const loader = new SVGLoader();
        const svgData = loader.parse(svgContent);

        const extractedPoints = [];
        svgData.paths.forEach(path => {
          if (path.subPaths) {
            path.subPaths.forEach(sub => {
              const pts = sub.getPoints(14);
              pts.forEach(p => {
                extractedPoints.push(new THREE.Vector3(p.x, -p.y, 0));
              });
            });
          }
        });

        if (extractedPoints.length > 0) {
          const box = new THREE.Box3().setFromPoints(extractedPoints);
          const center = box.getCenter(new THREE.Vector3());
          const size = box.getSize(new THREE.Vector3());
          const maxDim = Math.max(size.x, size.y) || 1;
          const scale = 1.4 / maxDim;

          svgTargetPositions = extractedPoints.map(p => p.sub(center).multiplyScalar(scale));

          settings.formSVG = true;
          formSvgCtrl.setValue(true);
        }
      };
      reader.readAsText(file);
    });

    // Object Dragging across screen
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const dragPlane = new THREE.Plane();
    const dragStartPlane = new THREE.Vector3();
    const planeIntersect = new THREE.Vector3();
    const groupStartPos = new THREE.Vector3();
    let isDragging = false;

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.lil-gui')) return;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObject(particlesMesh);

      if (intersects.length > 0 || settings.formSVG) {
        isDragging = true;
        controls.enabled = false;
        dragPlane.setFromNormalAndCoplanarPoint(
          camera.getWorldDirection(dragPlane.normal).negate(),
          particlesMesh.position
        );
        raycaster.ray.intersectPlane(dragPlane, dragStartPlane);
        groupStartPos.copy(particlesMesh.position);
      }
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDragging) return;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      if (raycaster.ray.intersectPlane(dragPlane, planeIntersect)) {
        const offset = new THREE.Vector3().subVectors(planeIntersect, dragStartPlane);
        particlesMesh.position.copy(groupStartPos).add(offset);
      }
    });

    window.addEventListener('pointerup', () => {
      isDragging = false;
      controls.enabled = true;
    });

    // Press 'H' Key to Hide/Show UI
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        const isHidden = gui.domElement.style.display === 'none';
        gui.domElement.style.display = isHidden ? '' : 'none';
        const hero = document.getElementById('hero');
        if (hero) hero.style.display = isHidden ? '' : 'none';
      }
    });

    // Hook into Bokeh1Background animation render loop
    const clock = new THREE.Clock();
    const currentMat = new THREE.Matrix4();
    const dummyObj = new THREE.Object3D();
    const currPos = new THREE.Vector3();
    const currRot = new THREE.Quaternion();
    const currScale = new THREE.Vector3();

    bokeh1Background.three.onBeforeRender = (timeData) => {
      const speed = settings.animationSpeed;
      const elapsedTime = clock.getElapsedTime() * speed;

      // Update particle noise animation speed uniform
      if (particlesMesh.uniforms && particlesMesh.uniforms.uTimeScale) {
        particlesMesh.uniforms.uTimeScale.value = speed;
      }

      // 5 Camera Animation Presets
      if (settings.animation === 'Gentle Orbit') {
        camera.position.x = Math.sin(elapsedTime * 0.25) * 0.35;
        camera.position.y = Math.cos(elapsedTime * 0.25) * 0.35;
        camera.lookAt(0, 0, 0);
      } else if (settings.animation === 'Breathing Zoom') {
        camera.position.z = 1.0 + Math.sin(elapsedTime * 0.5) * 0.25;
      } else if (settings.animation === 'Harmonic Wave') {
        camera.position.x = Math.sin(elapsedTime * 0.3) * 0.3;
        camera.position.y = Math.sin(elapsedTime * 0.6) * 0.2;
      } else if (settings.animation === 'Spiral Drift') {
        camera.position.x = Math.sin(elapsedTime * 0.2) * 0.25;
        camera.position.y = Math.cos(elapsedTime * 0.2) * 0.25;
        camera.position.z = 1.0 + Math.sin(elapsedTime * 0.15) * 0.15;
      } else {
        // Static Float
      }

      controls.update();

      // SVG Form Particle Interpolation
      if (settings.formSVG && svgTargetPositions.length > 0) {
        for (let i = 0; i < particlesMesh.count; i++) {
          particlesMesh.getMatrixAt(i, currentMat);
          currentMat.decompose(currPos, currRot, currScale);

          const svgPt = svgTargetPositions[i % svgTargetPositions.length];
          const target = new THREE.Vector3(
            svgPt.x + Math.sin(elapsedTime * 2 + i) * 0.015,
            svgPt.y + Math.cos(elapsedTime * 2 + i) * 0.015,
            svgPt.z
          );

          currPos.lerp(target, 0.05 * Math.min(speed, 2.0));

          dummyObj.position.copy(currPos);
          dummyObj.quaternion.copy(currRot);
          dummyObj.scale.copy(currScale);
          dummyObj.updateMatrix();

          particlesMesh.setMatrixAt(i, dummyObj.matrix);
        }
        particlesMesh.instanceMatrix.needsUpdate = true;
      } else {
        // Lerp back to original random cloud matrices if SVG form turned off
        for (let i = 0; i < particlesMesh.count; i++) {
          particlesMesh.getMatrixAt(i, currentMat);
          currentMat.decompose(currPos, currRot, currScale);

          const origMat = originalMatrices[i];
          const origPos = new THREE.Vector3();
          const origRot = new THREE.Quaternion();
          const origScale = new THREE.Vector3();
          origMat.decompose(origPos, origRot, origScale);

          if (currPos.distanceTo(origPos) > 0.001) {
            currPos.lerp(origPos, 0.05 * Math.min(speed, 2.0));
            dummyObj.position.copy(currPos);
            dummyObj.quaternion.copy(origRot);
            dummyObj.scale.copy(origScale);
            dummyObj.updateMatrix();
            particlesMesh.setMatrixAt(i, dummyObj.matrix);
            particlesMesh.instanceMatrix.needsUpdate = true;
          }
        }
      }
    };
  </script>
</body>
</html>
