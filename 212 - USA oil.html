        // =========================================================================
        function smoothGeoPath(points, numPointsPerSegment = 24) {
            if (!points || points.length < 2) return points;
            if (points.length === 2) {
                const p0 = points[0], p1 = points[1];
                const res = [];
                for (let i = 0; i <= numPointsPerSegment; i++) {
                    const t = i / numPointsPerSegment;
                    res.push([
                        +(p0[0] + (p1[0] - p0[0]) * t).toFixed(4),
                        +(p0[1] + (p1[1] - p0[1]) * t).toFixed(4)
                    ]);
                }
                return res;
            }

            const smoothed = [];
            const pts = [points[0], ...points, points[points.length - 1]];

            for (let i = 0; i < pts.length - 3; i++) {
                const p0 = pts[i];
                const p1 = pts[i + 1];
                const p2 = pts[i + 2];
                const p3 = pts[i + 3];

                for (let j = 0; j < numPointsPerSegment; j++) {
                    const t = j / numPointsPerSegment;
                    const t2 = t * t;
                    const t3 = t2 * t;

                    // Catmull-Rom spline formulation
                    const f1 = -0.5 * t3 + t2 - 0.5 * t;
                    const f2 =  1.5 * t3 - 2.5 * t2 + 1.0;
                    const f3 = -1.5 * t3 + 2.0 * t2 + 0.5 * t;
                    const f4 =  0.5 * t3 - 0.5 * t2;

                    const lon = p0[0] * f1 + p1[0] * f2 + p2[0] * f3 + p3[0] * f4;
                    const lat = p0[1] * f1 + p1[1] * f2 + p2[1] * f3 + p3[1] * f4;

                    smoothed.push([+lon.toFixed(4), +lat.toFixed(4)]);
                }
            }
            smoothed.push([+points[points.length - 1][0].toFixed(4), +points[points.length - 1][1].toFixed(4)]);
            return smoothed;
        }

        // Clamped coordinate sampling function to guarantee zero undefined index errors
        function getRoutePoint(coords, progress) {
            if (!coords || coords.length === 0) return [0, 0, 0];
            if (coords.length === 1) return [coords[0][0], coords[0][1], 0];

            let p = progress % 1;
            if (p < 0) p += 1;
            if (isNaN(p)) p = 0;

            const maxIdx = coords.length - 1;
            const index = p * maxIdx;
            let i0 = Math.floor(index);
            let i1 = i0 + 1;
            if (i0 >= maxIdx) {
                i0 = maxIdx - 1;
                i1 = maxIdx;
            }
            if (i0 < 0) {
                i0 = 0;
                i1 = 1;
            }

            const p0 = coords[i0] || coords[0];
            const p1 = coords[i1] || coords[coords.length - 1];
            const fract = Math.max(0, Math.min(1, index - i0));

            const lon = +(p0[0] + (p1[0] - p0[0]) * fract).toFixed(4);
            const lat = +(p0[1] + (p1[1] - p0[1]) * fract).toFixed(4);

            const dx = (p1[0] - p0[0]) * Math.cos((lat * Math.PI) / 180);
            const dy = p1[1] - p0[1];
            const angle = Math.atan2(dy, dx) * (180 / Math.PI) + 90;

            return [lon, lat, angle];

                for (let d = 0; d < DOTS_PER_ROUTE; d++) {
                    const initProgress = ((d / DOTS_PER_ROUTE) + ((rIdx * 0.07) % (1 / DOTS_PER_ROUTE))) % 1.0;

                        longitude: startLon,
                        latitude: startLat,
                        isExport: route.isExport

                    particles.push({

        let rotationAnimation = null;

        let animTime = 0;
        let lastTime = performance.now();

        function startRotation() {
            if (rotationAnimation) {
                rotationAnimation.stop();
                rotationAnimation = null;
            }
            if (animRafId) {
                cancelAnimationFrame(animRafId);
                animRafId = null;
            }

            lastTime = performance.now();

            function mainLoop(now) {
                const dt = Math.min(0.1, Math.max(0.001, (now - lastTime) * 0.001));
                lastTime = now;

                // 1. Update Continuous Flow Particles (Moving glowing circles)
                const pCount = particles.length;
                const spd = params.rotationSpeed;

                for (let i = 0; i < pCount; i++) {
                    const p = particles[i];
                    p.progress = (p.progress + p.speed * spd * dt * 60) % 1.0;
                    if (p.progress < 0) p.progress += 1.0;

                    const [lon, lat] = getRoutePoint(p.coords, p.progress);

                    // Update MapPointSeries dataItem position
                    p.dataItem.set("longitude", lon);
                    p.dataItem.set("latitude", lat);
                }

                // 2. Update Globe / Map Camera Modes
                if (!isUserInteracting && !isRightDragging && params.autoRotate) {
                    animTime += dt * params.rotationSpeed;

                    if (params.animationPreset === 'Global Orbit (Infinite)') {
                        const curX = chart.get("rotationX", 0);
                        chart.set("rotationX", (curX + dt * params.rotationSpeed * 3) % 360);
                    } else if (params.animationPreset === 'Transatlantic Express (USA - Europe)') {
                        const osc = Math.sin(animTime * 0.2);
                        chart.set("rotationX", -40 + osc * 45);
                        if (!switchButton.get("active")) chart.set("rotationY", 28 + Math.cos(animTime * 0.3) * 6);
                    } else if (params.animationPreset === 'Transpacific Corridor (USA - Asia)') {
                        const osc = Math.sin(animTime * 0.18);
                        chart.set("rotationX", 180 + osc * 55);
                        if (!switchButton.get("active")) chart.set("rotationY", 24 + Math.cos(animTime * 0.25) * 5);
                    } else if (params.animationPreset === 'Americas Flow Tour (Canada - USA - Latin America)') {
                        const osc = Math.sin(animTime * 0.22);
                        chart.set("rotationX", -85 + Math.sin(animTime * 0.15) * 15);
                        if (!switchButton.get("active")) chart.set("rotationY", 15 + osc * 28);
                    } else if (params.animationPreset === 'Static Overview (No Camera Movement)') {
                        if (!switchButton.get("active")) {
                            chart.set("rotationX", -75);
                            chart.set("rotationY", 20);
                        } else {
                            chart.set("rotationX", 12);
                            chart.set("rotationY", 0);
                        }
                    }
                }

                animRafId = requestAnimationFrame(mainLoop);
            }

            animRafId = requestAnimationFrame(mainLoop);
        }

                        const container = bullet.get("sprite");
                        if (container && container.children) {
                            const isUS = dataItem.dataContext && dataItem.dataContext.isUS;
                            const isExp = dataItem.dataContext && dataItem.dataContext.isExport;
                            const nodeColor = isUS ? params.usLand : (isExp ? params.exportLand : params.importLand);
                            container.children.each(function(child) {
                                if (child && typeof child.set === 'function') {
                                    child.set("fill", am5.color(nodeColor));
                                }
                            });
                        }
                    });
                }
            });

            if (titleLabel) titleLabel.set("fill", am5.color(params.flareColor));
            if (subtitleLabel) subtitleLabel.set("fill", am5.color(params.sulfurColor));
            if (switchLabel1) switchLabel1.set("fill", am5.color(params.flareColor));
            if (switchLabel2) switchLabel2.set("fill", am5.color(params.flareColor));

            // Update HUD Legend
            if (legendItem1) legendItem1.circ.set("fill", am5.color(params.usLand));
            if (legendItem2) legendItem2.circ.set("fill", am5.color(params.exportLand));
            if (legendItem3) legendItem3.circ.set("fill", am5.color(params.importLand));
            if (legendItem4) legendItem4.circ.set("fill", am5.color(params.slickColor));

            styleUIButtons();
        }

        function styleUIButtons() {
            const buttonBgColor = am5.color(params.slickColor);
            const buttonStrokeColor = am5.color(params.pipelineColor);
            const buttonTextColor = am5.color(params.flareColor);
            const buttonHoverColor = am5.color(params.pipelineColor);
            
            const styleButton = (btn) => {
                if (!btn) return;
                const bg = btn.get("background");
                if (bg) {
                    bg.setAll({
                        fill: buttonBgColor,
                        stroke: buttonStrokeColor,
                        strokeWidth: 1
                    });
                    bg.states.create("hover", { fill: buttonHoverColor });
                    bg.states.create("down", { fill: buttonTextColor });
                }
                const label = btn.get("label");
                if (label) label.set("fill", buttonTextColor);
                const icon = btn.get("icon");
                if (icon) {
                    icon.set("stroke", buttonTextColor);
                    icon.set("fill", buttonTextColor);
                }
            };
            
            if (zoomControl) {
                styleButton(zoomControl.plusButton);
                styleButton(zoomControl.minusButton);
                styleButton(zoomControl.homeButton);
            }
            
            if (switchButton) {
                const sbg = switchButton.get("background");
                if (sbg) {
                    sbg.setAll({
                        fill: buttonBgColor,
                        stroke: buttonStrokeColor,
                        strokeWidth: 1
                    });
                }
                const sicon = switchButton.get("icon");
                if (sicon) {
                    sicon.setAll({
                        fill: buttonTextColor,
                        stroke: buttonTextColor
                    });
                }
            }
        }

        // =========================================================================
        // 12. PROCEDURAL RANDOMIZATION ON CLICK
        // =========================================================================
        function hslToHex(h, s, l) {
            l /= 100;
            const a = s * Math.min(l, 1 - l) / 100;
            const f = n => {
                const k = (n + h / 30) % 12;
                const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
                return Math.round(255 * color).toString(16).padStart(2, '0');
            };
            return `#${f(0)}${f(8)}${f(4)}`;
        }

        function randomizeScene() {
            const baseHue = Math.floor(Math.random() * 360);
            const compHue = (baseHue + 180 + Math.floor(Math.random() * 40 - 20)) % 360;
            const triadHue = (baseHue + 120 + Math.floor(Math.random() * 40 - 20)) % 360;

            params.deepCrude = hslToHex(baseHue, 30, 8);
            params.slickColor = hslToHex(baseHue, 20, 16);
            params.usLand = hslToHex((baseHue + 210) % 360, 85, 45);
            params.exportLand = hslToHex(compHue, 85, 48);
            params.importLand = hslToHex(triadHue, 80, 42);
            params.pipelineColor = hslToHex(baseHue, 30, 28);
            params.exportFlow = hslToHex(compHue, 95, 55);
            params.importFlow = hslToHex(triadHue, 95, 55);
            params.flareColor = hslToHex((baseHue + 45) % 360, 85, 75);
            params.sulfurColor = hslToHex((baseHue + 45) % 360, 65, 60);
            params.theme = 'Custom (Procedural)';

            params.rotationSpeed = +(0.6 + Math.random() * 1.6).toFixed(1);
            params.circleRadius = +(2.5 + Math.random() * 2.5).toFixed(1);
            params.glowRadius = +(4.0 + Math.random() * 6.0).toFixed(1);

            applyCurrentColors();
            startRotation();
            updateGuiDisplay();
        }

        let pDownPos = { x: 0, y: 0 };
        let pDownTime = 0;

        window.addEventListener("pointerdown", (e) => {
            if (e.button === 0) {
                pDownPos = { x: e.clientX, y: e.clientY };
                pDownTime = performance.now();
            }
        });

        window.addEventListener("pointerup", (e) => {
            if (e.button === 0) {
                const dx = Math.abs(e.clientX - pDownPos.x);
                const dy = Math.abs(e.clientY - pDownPos.y);
                const dt = performance.now() - pDownTime;

                if (params.clickToRandomize && dx < 6 && dy < 6 && dt < 350) {
                    if (!e.target.closest('.lil-gui')) {
                        randomizeScene();
                    }
                }
            }
        });

        // =========================================================================
        // 13. LIL-GUI CONTROL PANEL
        // =========================================================================
        const gui = new GUI({ title: 'USA Oil Routes Logistics' });

        gui.add(params, 'theme', Object.keys(themes)).name('Color Scheme').onChange(function(themeName) {
            const themeObj = themes[themeName];
            if (themeObj) {
                Object.assign(params, themeObj);
                updateGuiDisplay();
                applyCurrentColors();
            }
        });

        gui.add(params, 'animationPreset', [
            'Global Orbit (Infinite)',
            'Transatlantic Express (USA - Europe)',
            'Transpacific Corridor (USA - Asia)',
            'Americas Flow Tour (Canada - USA - Latin America)',
            'Static Overview (No Camera Movement)'
        ]).name('Camera Animation').onChange(function() {
            startRotation();
        });

        gui.add(params, 'greenscreen').name('Greenscreen (#00ff00)').onChange(applyCurrentColors);
        gui.add(params, 'clickToRandomize').name('Click to Randomize');

        gui.add(params, 'autoRotate').name('Auto Animate').onChange(function() {
            startRotation();
        });

        gui.add(params, 'rotationSpeed', 0.1, 5.0, 0.1).name('Animation Speed').onChange(function() {
            startRotation();
        });

        gui.add(params, 'dpr', 0.5, 3.0, 0.25).name('Pixel Ratio (DPR)').onChange(function(val) {
            applyDPR(val);
        });

        gui.add(params, 'flowWidth', 1.0, 5.0, 0.2).name('Flow Line Width').onChange(applyCurrentColors);

        // Glowing Circles Customization
        const particlesFolder = gui.addFolder('Flow Particles & Glow');
        particlesFolder.add(params, 'circleRadius', 1.0, 8.0, 0.1).name('Circle Size').onChange(applyCurrentColors);
        particlesFolder.add(params, 'glowRadius', 0.0, 20.0, 0.5).name('Glow Radius').onChange(applyCurrentColors);
        particlesFolder.add(params, 'glowOpacity', 0.05, 1.0, 0.05).name('Glow Intensity').onChange(applyCurrentColors);
        particlesFolder.open();

        let isUpdatingZoom = false;
        const zoomController = gui.add(params, 'zoomLevel', 0.5, 15.0, 0.01).name('Zoom Level').onChange(function(val) {
            isUpdatingZoom = true;
            chart.set("zoomLevel", val);
            isUpdatingZoom = false;
        });

        chart.on("zoomLevel", function(zoomLevel) {
            if (!isUpdatingZoom) {
                params.zoomLevel = zoomLevel;
                zoomController.updateDisplay();
            }
        });

        const colorsFolder = gui.addFolder('Country & Scene Colors');
        colorsFolder.addColor(params, 'usLand').name('USA (Main Hub)').onChange(applyCurrentColors);
        colorsFolder.addColor(params, 'exportLand').name('Export Destinations').onChange(applyCurrentColors);
        colorsFolder.addColor(params, 'importLand').name('Import Origins').onChange(applyCurrentColors);
        colorsFolder.addColor(params, 'slickColor').name('Other World Land').onChange(applyCurrentColors);
        colorsFolder.addColor(params, 'deepCrude').name('Ocean / Bg').onChange(applyCurrentColors);
        colorsFolder.addColor(params, 'exportFlow').name('US Export Flow Lines').onChange(applyCurrentColors);
        colorsFolder.addColor(params, 'importFlow').name('US Import Flow Lines').onChange(applyCurrentColors);
        colorsFolder.addColor(params, 'pipelineColor').name('Borders / Graticule').onChange(applyCurrentColors);
        colorsFolder.addColor(params, 'flareColor').name('Highlights / Text').onChange(applyCurrentColors);
        colorsFolder.open();

        function updateGuiDisplay() {
            gui.controllers.forEach(c => c.updateDisplay());
            gui.folders.forEach(f => {
                f.controllers.forEach(c => c.updateDisplay());
            });
        }

        // =========================================================================
        // 14. KEYBOARD HOTKEYS ('H' KEY TO TOGGLE UI)
        // =========================================================================
        let uiVisible = true;
        function toggleUI() {
            uiVisible = !uiVisible;
            if (uiVisible) {
                gui.show();
                zoomControl.set("visible", true);
                switchCont.set("visible", true);
                titleCont.set("visible", true);
                legendCont.set("visible", true);
            } else {
                gui.hide();
                zoomControl.set("visible", false);
                switchCont.set("visible", false);
                titleCont.set("visible", false);
                legendCont.set("visible", false);
            }
        }

        window.addEventListener('keydown', function(e) {
            if (e.key === 'h' || e.key === 'H') {
                toggleUI();
            }
        });

        // Initialize appearance & start globe rotation + particle engine
        chart.appear(1000, 100);
        setTimeout(function() {
            zoomToGlobe();
            applyCurrentColors();
        }, 1000);

    </script>
</body>
</html>
