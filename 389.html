      fTypo.add(params, 'lineGap', 0.4, 1.8, 0.05)
        .name('Line Clearance')
        .onChange(createTypography);

      fTypo.add(params, 'letterSpacing', 0.1, 0.6, 0.02)
        .name('Letter Spacing')
        .onChange(createTypography);

      fTypo.add(params, 'textCurvature', 0.0, 0.8, 0.02)
        .name('3D Arc Curvature')
        .onChange(createTypography);

      // FESTIVE EFFECTS (FIREWORKS & 3D FLAKES)
      const fFestive = gui.addFolder('Festive FX (Fireworks & 3D Flakes)');
      fFestive.add(params, 'fireworksEnabled').name('Fireworks Behind').onChange(v => {
        if (!params.greenscreen) fireworksGroup.visible = v;
      });
      fFestive.add(params, 'fireworksFrequency', 0.2, 3.0, 0.1).name('Fireworks Rate');
      fFestive.add(params, 'fireworksSize', 0.15, 0.8, 0.05).name('Fireworks Size');
      fFestive.add({ burstNow: () => {
        const fw = fireworkPool.find(f => !f.active) || fireworkPool[0];
        triggerFirework(fw);
      }}, 'burstNow').name('★ Launch Firework Now');
      
      fFestive.add(params, 'flakesEnabled').name('3D Flakes').onChange(v => {
        if (!params.greenscreen) flakesMesh.visible = v;
      });
      fFestive.add(params, 'flakesSpeed', 0.1, 3.0, 0.1).name('Flakes Speed');
      fFestive.add(params, 'flakesSize', 0.2, 2.0, 0.05).name('Flakes Scale');

      // TYPOGRAPHY COLORS & CHROME
      const fColors = gui.addFolder('Chrome Typography Colors');
      fColors.addColor(params, 'primaryColor')
        .name('Primary Color (Line 1)')
        .listen()
        .onChange(() => {
          updateMaterialProperties();
          updateEnvironment();
        });

      fColors.addColor(params, 'secondaryColor')
        .name('Secondary Color (Line 2)')
        .listen()
        .onChange(() => {
          updateMaterialProperties();
          updateEnvironment();
        });

      fColors.addColor(params, 'accentColor')
        .name('Accent & Bevel Edge')
        .listen()
        .onChange(() => {
          updateMaterialProperties();
          updateEnvironment();
        });

      fColors.add(params, 'metalness', 0.0, 1.0, 0.01)
        .name('Metalness')
        .onChange(updateMaterialProperties);

      fColors.add(params, 'roughness', 0.0, 1.0, 0.01)
        .name('Roughness')
        .onChange(updateMaterialProperties);

      fColors.add(params, 'clearcoat', 0.0, 1.0, 0.01)
        .name('Clearcoat')
        .onChange(updateMaterialProperties);

      // ANIMATION & MOTION
      const fMotion = gui.addFolder('Animation & Motion');
      fMotion.add(params, 'animation', ANIMATION_MODES).name('Animation Mode');
      fMotion.add(params, 'autoAnimate').name('Auto Animation');
      fMotion.add(params, 'animationSpeed', 0.0, 3.0, 0.05).name('Animation Speed');

      // CAMERA & CONTROLS
      const fControls = gui.addFolder('Camera & Controls');
      fControls.add(params, 'leftClickDragMode', ['Rotate (Orbit)', 'Pan (Drag across screen)'])
        .name('Left Drag Action')
        .onChange(updateControlMouseButtons);

      // LIGHTING & EXPOSURE
      const fLighting = gui.addFolder('Lighting & Softboxes');
      fLighting.add(params, 'exposure', 0.1, 3.0, 0.05)
        .name('Scene Exposure')
        .onChange(v => {
          if (postProcessor) {
            postProcessor.settings.exposure = v;
            postProcessor.updateSettings();
          }
        });

      fLighting.add(params, 'globalLightIntensity', 0.1, 3.0, 0.05)
        .name('Global Intensity')
        .onChange(updateLights);

      // Key Light
      const fKey = fLighting.addFolder('Key Light (Softbox 1)');
      fKey.close();
      fKey.add(params, 'keyLightIntensity', 0.0, 5.0, 0.1).name('Intensity').onChange(updateLights);
      fKey.addColor(params, 'keyLightColor').name('Color').onChange(() => { updateLights(); updateEnvironment(); });
      fKey.add(params, 'keyLightPosX', -30, 30, 1).name('Pos X').onChange(updateLights);
      fKey.add(params, 'keyLightPosY', -10, 30, 1).name('Pos Y').onChange(updateLights);
      fKey.add(params, 'keyLightPosZ', -30, 30, 1).name('Pos Z').onChange(updateLights);

      // Fill Light
      const fFill = fLighting.addFolder('Fill Light (Softbox 2)');
      fFill.close();
      fFill.add(params, 'fillLightIntensity', 0.0, 5.0, 0.1).name('Intensity').onChange(updateLights);
      fFill.addColor(params, 'fillLightColor').name('Color').onChange(() => { updateLights(); updateEnvironment(); });
      fFill.add(params, 'fillLightPosX', -30, 30, 1).name('Pos X').onChange(updateLights);
      fFill.add(params, 'fillLightPosY', -10, 30, 1).name('Pos Y').onChange(updateLights);
      fFill.add(params, 'fillLightPosZ', -30, 30, 1).name('Pos Z').onChange(updateLights);

      // Rim Light
      const fRim = fLighting.addFolder('Rim Light (Softbox 3)');
      fRim.close();
      fRim.add(params, 'rimLightIntensity', 0.0, 5.0, 0.1).name('Intensity').onChange(updateLights);
      fRim.addColor(params, 'rimLightColor').name('Color').onChange(() => { updateLights(); updateEnvironment(); });
      fRim.add(params, 'rimLightPosX', -30, 30, 1).name('Pos X').onChange(updateLights);
      fRim.add(params, 'rimLightPosY', -10, 30, 1).name('Pos Y').onChange(updateLights);
      fRim.add(params, 'rimLightPosZ', -30, 30, 1).name('Pos Z').onChange(updateLights);

      // Under Glow & Ambient
      const fGlow = fLighting.addFolder('UnderGlow & Ambient');
      fGlow.close();
      fGlow.add(params, 'underGlowIntensity', 0.0, 3.0, 0.1).name('Glow Intensity').onChange(updateLights);
      fGlow.addColor(params, 'underGlowColor').name('Glow Color').onChange(updateLights);
      fGlow.add(params, 'ambientLightIntensity', 0.0, 2.0, 0.05).name('Ambient Intensity').onChange(updateLights);
      fGlow.addColor(params, 'ambientLightColor').name('Ambient Color').onChange(updateLights);

      // SCENE & ENGINE SETTINGS
      const fSettings = gui.addFolder('Scene & Engine Settings');
      fSettings.add(params, 'randomizeOnClick').name('Randomize On Click');
      fSettings.add({ randomizeNow: randomizeScene }, 'randomizeNow').name('★ Re-Roll Scene Now');
      fSettings.add(params, 'showFloor').name('Floor / Plane').listen().onChange(v => {
        if (floorMesh) floorMesh.visible = v && !params.greenscreen;
      });
      fSettings.add(params, 'dpr', 0.5, 2.5, 0.1).name('Pixel Ratio (DPR)').onChange(v => {
        renderer.setPixelRatio(v);
        if (postProcessor) postProcessor.setSize(window.innerWidth, window.innerHeight, v);
      });
      fSettings.add(params, 'antialias').name('Antialias (MSAA)').onChange(v => {
        if (postProcessor) postProcessor.setAntialias(v);
      });

      // ATTACH POSTPROCESSOR SUITE GUI
      if (postProcessor) {
        postProcessor.attachGUI(gui, 'Post-Processing Suite');
      }
    }

    // -------------------------------------------------------------
    // ANIMATION LOOP (8 SMOOTH PRECONFIGURED MODES)
    // -------------------------------------------------------------
    let animTime = 0;

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      if (params.autoAnimate) {
        animTime += delta * params.animationSpeed;
      }

      controls.update();
      const t = animTime;

      // Update Festive Fireworks & 3D Flakes
      updateFireworks(delta);
      update3DFlakes(delta, t);

      switch (params.animation) {
        case 'Gentle Studio Float': {
          mainGroup.position.y = Math.sin(t * 0.7) * 0.16;
          mainGroup.rotation.y = Math.sin(t * 0.4) * 0.06;
          mainGroup.rotation.x = Math.sin(t * 0.3) * 0.02;
          mainGroup.rotation.z = 0;

          letterMeshes.forEach((item) => {
            const charWave = Math.sin(t * 0.9 + item.charIndex * 0.14) * 0.04;
            item.mesh.position.y = item.originalPos.y + charWave;
            item.mesh.position.x = item.originalPos.x;
            item.mesh.position.z = item.originalPos.z;
            item.mesh.rotation.copy(item.originalRot);
          });
          break;
        }

        case 'Luxury Showcase Turntable': {
          mainGroup.rotation.y = t * 0.22;
          mainGroup.position.y = Math.sin(t * 0.6) * 0.12;
          mainGroup.rotation.x = 0;
          mainGroup.rotation.z = 0;

          letterMeshes.forEach((item) => {
            item.mesh.position.copy(item.originalPos);
            item.mesh.rotation.copy(item.originalRot);
          });
          break;
        }

        case 'Cinematic Dolly & Orbit': {
          const camR = 19.0;
          const camAngle = t * 0.1;
          camera.position.x = Math.sin(camAngle) * camR;
          camera.position.z = Math.cos(camAngle) * camR;
          camera.position.y = -0.2 + Math.sin(t * 0.16) * 1.4;
          controls.target.set(0, -0.4, 0);

          mainGroup.position.set(0, 0, 0);
          mainGroup.rotation.set(0, 0, 0);

          letterMeshes.forEach((item) => {
            item.mesh.position.copy(item.originalPos);
            item.mesh.rotation.copy(item.originalRot);
          });
          break;
        }

        case 'Soft Light Wave & Tilt': {
          mainGroup.position.y = Math.sin(t * 0.6) * 0.1;
          mainGroup.rotation.x = Math.sin(t * 0.4) * 0.05;
          mainGroup.rotation.y = Math.cos(t * 0.5) * 0.07;
          mainGroup.rotation.z = Math.sin(t * 0.3) * 0.02;

          if (keyLight) {
            keyLight.position.x = params.keyLightPosX + Math.sin(t * 0.7) * 5.0;
            keyLight.position.y = params.keyLightPosY + Math.cos(t * 0.5) * 2.5;
          }

          letterMeshes.forEach((item) => {
            item.mesh.position.copy(item.originalPos);
            item.mesh.rotation.copy(item.originalRot);
          });
          break;
        }

        case 'Cascade Wave & Flex': {
          mainGroup.position.set(0, 0, 0);
          mainGroup.rotation.set(0, 0, 0);

          letterMeshes.forEach((item) => {
            const wave = Math.sin(t * 1.3 - item.charIndex * 0.2 - item.lineIndex * 0.5);
            item.mesh.position.y = item.originalPos.y + wave * 0.12;
            item.mesh.position.z = item.originalPos.z + Math.cos(t * 1.3 - item.charIndex * 0.2) * 0.06;
            item.mesh.rotation.set(
              item.originalRot.x + Math.cos(t * 1.3 - item.charIndex * 0.2) * 0.02,
              item.originalRot.y,
              item.originalRot.z + wave * 0.02
            );
          });
          break;
        }

        case 'Figure-8 Infinity Drift': {
          mainGroup.position.x = Math.sin(t * 0.45) * 0.6;
          mainGroup.position.y = Math.sin(t * 0.9) * 0.28;
          mainGroup.rotation.y = Math.sin(t * 0.45) * 0.1;
          mainGroup.rotation.x = Math.cos(t * 0.45) * 0.035;
          mainGroup.rotation.z = Math.sin(t * 0.9) * 0.025;

          letterMeshes.forEach((item) => {
            item.mesh.position.copy(item.originalPos);
            item.mesh.rotation.copy(item.originalRot);
          });
          break;
        }

        case 'Pulse & Refraction Sweep': {
          const pulse = 1.0 + Math.sin(t * 0.8) * 0.02;
          mainGroup.scale.set(pulse, pulse, pulse);
          mainGroup.position.y = Math.sin(t * 0.8) * 0.12;
          mainGroup.rotation.y = Math.sin(t * 0.35) * 0.05;

          if (rimLight) {
            rimLight.intensity = (params.rimLightIntensity * params.globalLightIntensity) *
              (1.0 + 0.3 * Math.sin(t * 1.4));
          }

          letterMeshes.forEach((item) => {
            item.mesh.position.copy(item.originalPos);
            item.mesh.rotation.copy(item.originalRot);
          });
          break;
        }

        case 'Static Showcase (No Camera Move)': {
          mainGroup.position.set(0, 0, 0);
          mainGroup.rotation.set(0, 0, 0);
          mainGroup.scale.set(1, 1, 1);

          letterMeshes.forEach((item) => {
            item.mesh.position.copy(item.originalPos);
            item.mesh.rotation.copy(item.originalRot);
          });

          if (keyLight) {
            keyLight.intensity = (params.keyLightIntensity * params.globalLightIntensity) *
              (1.0 + 0.02 * Math.sin(t * 0.8));
          }
          break;
        }
      }

      if (postProcessor && postProcessor.settings.enabled) {
        postProcessor.renderScene(scene, camera);
      } else {
        renderer.setRenderTarget(null);
        renderer.render(scene, camera);
      }
    }

    // -------------------------------------------------------------
    // BOOTSTRAP
    // -------------------------------------------------------------
    async function start() {
      initScene();
      setupGUI();

      try {
        loadedFont = await loadFont();
        createTypography();
      } catch (err) {
        console.error('Error loading font:', err);
      }

      animate();
    }

    start();
  </script>
