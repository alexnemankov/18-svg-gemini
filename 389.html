<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HAPPY NEW YEAR 2027 - Chrome Typography</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #05060a;
      user-select: none;
      -webkit-user-select: none;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { FontLoader } from 'three/addons/loaders/FontLoader.js';
    import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';
    import GUI from 'lil-gui';

    // =========================================================================
    // INLINE POSTPROCESSOR SUITE (Zero-CORS, Single-File Compatible)
    // =========================================================================
    const postOrthoVertexShader = `
    precision highp float;
    in vec3 position;
    out vec2 vUv;
    void main() {
      vUv = position.xy * 0.5 + 0.5;
      gl_Position = vec4(position, 1.0);
    }
    `;

    const postBrightFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float bloomThreshold;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float luminance = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float knee = 0.1;
      float soft = luminance - bloomThreshold + knee;
      soft = clamp(soft, 0.0, 2.0 * knee);
      soft = (soft * soft) / (4.0 * knee + 0.00001);
      float contribution = max(soft, luminance - bloomThreshold);
      contribution /= max(luminance, 0.00001);
      fragColor = vec4(color.rgb * contribution, color.a);
    }
    `;

    const postBlur13ShaderChunk = `
    vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
      vec2 resolution = vec2(textureSize(image, 0));
      vec4 color = vec4(0.0);
      vec2 off1 = vec2(1.411764705882353) * direction;
      vec2 off2 = vec2(3.2941176470588234) * direction;
      vec2 off3 = vec2(5.176470588235294) * direction;
      color += texture(image, uv) * 0.1964825501511404;
      color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
      color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
      return color;
    }
    `;

    const postBlurFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 direction;
    in vec2 vUv;
    out vec4 color;
    ${postBlur13ShaderChunk}
    void main() {
      color = blur13(inputTexture, vUv, direction);
    }
    `;

    const postGodRaysDepthMaskShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float threshold;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float lum = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float factor = smoothstep(threshold, threshold + 0.15, lum);
      fragColor = vec4(vec3(factor), 1.0);
    }
    `;

    const postGodRaysGenerateShader = `
    precision highp float;
    #define TAPS_PER_PASS 6.0

    uniform sampler2D inputTexture;
    uniform vec3 vSunPositionScreenSpace;
    uniform float fStepSize;
    uniform float distanceAttenuation;
    uniform float maxDensity;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec2 delta = vSunPositionScreenSpace.xy - vUv;
      float dist = length(delta);
      vec2 stepv = fStepSize * delta / max(dist, 0.0001);
      float iters = dist / max(fStepSize, 0.00001);

      vec2 uv = vUv;
      float col = 0.0;
      float f = min(1.0, max(vSunPositionScreenSpace.z, 0.0));
      float atten = 1.0 / (1.0 + pow(dist, distanceAttenuation));

      if (0.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (1.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (2.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (3.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (4.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (5.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;

      float finalVal = min(col / TAPS_PER_PASS * atten, maxDensity);
      fragColor = vec4(vec3(finalVal), 1.0);
    }
    `;

    const postAnamorphicBrightShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float threshold;
    uniform float smoothWidth;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float v = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float alpha = smoothstep(threshold, threshold + smoothWidth, v);
      fragColor = mix(vec4(0.0), color, alpha);
    }
    `;

    const postAnamorphicBlurShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 resolution;
    uniform float samples;
    uniform float intensity;
    uniform vec3 tintColor;
    uniform float bloomRadius;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      int halfSamples = max(1, int(samples) / 2);
      float fHalfSamples = float(halfSamples);
      vec2 invSize = 1.0 / resolution;
      vec4 total = vec4(0.0);

      for (int i = -64; i <= 64; i++) {
        if (i < -halfSamples || i > halfSamples) continue;
        float softness = 1.0 - abs(float(i)) / fHalfSamples;
        softness = pow(softness, 2.0);
        vec2 shiftedUV = vec2(vUv.x + invSize.x * float(i) * (4.0 + bloomRadius * 8.0), vUv.y);
        shiftedUV = clamp(shiftedUV, 0.001, 0.999);
        total += texture(inputTexture, shiftedUV) * softness;
      }

      fragColor = (total / (samples / 3.0)) * vec4(tintColor, 1.0) * intensity;
    }
    `;

    const postFinalFragmentShader = `
    precision highp float;
    uniform vec2 resolution;
    uniform sampler2D inputTexture;
    uniform sampler2D blur0Texture;
    uniform sampler2D blur1Texture;
    uniform sampler2D blur2Texture;
    uniform sampler2D blur3Texture;
    uniform sampler2D blur4Texture;
    uniform sampler2D raysTexture;
    uniform sampler2D anamorphicTexture;
    uniform bool bloomEnabled;
    uniform float bloomStrength;
    uniform bool raysEnabled;
    uniform float raysStrength;
    uniform vec3 raysColor;
    uniform bool anamorphicEnabled;
    uniform float vignetteBoost;
    uniform float vignetteReduction;
    uniform float noiseIntensity;
    uniform float time;
    in vec2 vUv;
    out vec4 fragColor;

    float vignette(vec2 uv, float boost, float reduction) {
      vec2 position = uv - 0.5;
      return boost - length(position) * reduction;
    }

    float hash1(uint n) {
      n = (n << 13U) ^ n;
      n = n * (n * n * 15731U + 789221U) + 1376312589U;
      return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
    }

    float noise(in vec2 uv, in float timeVal) {
      uvec2 p = uvec2(max(uv, vec2(0.0)));
      return hash1(p.x + 1920U * p.y + (1920U * 1080U) * uint(abs(timeVal) * 1000.0));
    }

    void main() {
      vec4 color = texture(inputTexture, vUv);

      if (bloomEnabled && bloomStrength > 0.001) {
        vec4 b0 = texture(blur0Texture, vUv);
        vec4 b1 = texture(blur1Texture, vUv);
        vec4 b2 = texture(blur2Texture, vUv);
        vec4 b3 = texture(blur3Texture, vUv);
        vec4 b4 = texture(blur4Texture, vUv);
        vec4 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
        color += bloomSum * bloomStrength;
      }

      if (raysEnabled && raysStrength > 0.001) {
        vec4 r = texture(raysTexture, vUv);
        color.rgb += r.rgb * raysColor * raysStrength;
      }

      if (anamorphicEnabled) {
        vec4 a = texture(anamorphicTexture, vUv);
        color.rgb += a.rgb;
      }

      color.rgb *= vignette(vUv, vignetteBoost, vignetteReduction);
      color.rgb += noiseIntensity * noise(gl_FragCoord.xy, time);
      fragColor = vec4(color.rgb, 1.0);
    }
    `;

    const postChromaticAberrationShaderChunk = `
    vec2 barrelDistortion(vec2 coord, float amt) {
      vec2 cc = coord - 0.5;
      float dist = dot(cc, cc);
      return coord + cc * dist * amt;
    }
    float sat(float t) { return clamp(t, 0.0, 1.0); }
    float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
    float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
    vec4 spectrum_offset(float t) {
      float lo = step(t, 0.5);
      float hi = 1.0 - lo;
      float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
      vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
      return pow(ret, vec4(1.0 / 2.2));
    }
    const float max_distort = 2.2;
    const int num_iter = 8;
    const float reci_num_iter_f = 1.0 / float(num_iter);
    vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
      vec4 sumcol = vec4(0.0);
      vec4 sumw = vec4(0.0);
      for (int i = 0; i < num_iter; ++i) {
        float t = float(i) * reci_num_iter_f;
        vec4 w = spectrum_offset(t);
        sumw += w;
        sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
      }
      return sumcol / sumw;
    }
    `;

    const postColorFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float chromaticAberrationAmount;
    uniform float minInputLevel;
    uniform float maxInputLevel;
    uniform float gammaLevel;
    uniform float exposure;
    uniform float fisheyeStrength;
    uniform float fisheyeRadius;
    uniform float time;
    uniform int visionMode;
    uniform float thermalSensitivity;
    uniform float nightVisionNoise;
    uniform float nightVisionGain;
    uniform float crtIntensity;
    in vec2 vUv;
    out vec4 fragColor;

    ${postChromaticAberrationShaderChunk}

    vec2 applyFisheye(vec2 uv, float strength, float radius) {
      if (abs(strength) < 0.0001) return uv;
      vec2 p = uv - 0.5;
      float d = length(p);
      if (d > radius * 1.5) return uv;
      float r = d / max(radius, 0.001);
      float theta = atan(p.y, p.x);
      float rDist = r + strength * (r * r * r);
      return 0.5 + vec2(cos(theta), sin(theta)) * (rDist * radius);
    }

    vec3 ACESFilmicToneMapping(vec3 color) {
      float a = 2.51;
      float b = 0.03;
      float c = 2.43;
      float d = 0.59;
      float e = 0.14;
      return clamp((color * (a * color + b)) / (color * (c * color + d) + e), 0.0, 1.0);
    }

    vec3 gammaCorrect(vec3 color, vec3 gamma) {
      return pow(max(color, vec3(0.0)), 1.0 / gamma);
    }
    vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
      return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
    }
    vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
      return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
    }

    vec3 applyNightVision(vec3 color, vec2 uv, float timeVal, float noiseAmt, float gain, float crt) {
      float lum = dot(color, vec3(0.299, 0.587, 0.114));
      float amplified = pow(lum * gain, 0.72);
      vec3 phosphorColor = mix(vec3(0.02, 0.12, 0.03), vec3(0.18, 1.0, 0.32), clamp(amplified, 0.0, 1.0));
      phosphorColor += vec3(0.7, 1.0, 0.8) * max(0.0, amplified - 0.75) * 1.8;
      vec2 p = uv - 0.5;
      float tubeDist = length(p);
      float tubeMask = smoothstep(0.72, 0.44, tubeDist);
      float n = fract(sin(dot(uv * 280.0 + timeVal * 0.05, vec2(12.9898, 78.233))) * 43758.5453);
      float scanline = sin(uv.y * 650.0) * crt;
      phosphorColor += (n - 0.5) * noiseAmt * 2.0 + scanline;
      return clamp(phosphorColor * tubeMask, 0.0, 1.0);
    }

    vec3 ironbow(float t) {
      t = clamp(t, 0.0, 1.0);
      vec3 c0 = vec3(0.02, 0.01, 0.18);
      vec3 c1 = vec3(0.22, 0.02, 0.48);
      vec3 c2 = vec3(0.82, 0.05, 0.25);
      vec3 c3 = vec3(1.0, 0.62, 0.02);
      vec3 c4 = vec3(1.0, 1.0, 0.92);
      if (t < 0.25) return mix(c0, c1, t * 4.0);
      if (t < 0.50) return mix(c1, c2, (t - 0.25) * 4.0);
      if (t < 0.75) return mix(c2, c3, (t - 0.50) * 4.0);
      return mix(c3, c4, (t - 0.75) * 4.0);
    }

    vec3 applyThermal(vec3 color, vec2 uv, float sensitivity, float crt, bool whiteHot) {
      float lum = dot(color, vec3(0.299, 0.587, 0.114));
      float heat = clamp(lum * sensitivity, 0.0, 1.0);
      float sensorRaster = sin(uv.y * 900.0) * (crt * 0.3);
      heat = clamp(heat + sensorRaster, 0.0, 1.0);
      if (whiteHot) return vec3(pow(heat, 0.85));
      return ironbow(heat);
    }

    void main() {
      vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
      vec4 col = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
      vec3 finalCol = col.rgb;
      if (visionMode == 1) {
        finalCol = applyNightVision(finalCol, uv, time, nightVisionNoise, nightVisionGain, crtIntensity);
      } else if (visionMode == 2) {
        finalCol = applyThermal(finalCol, uv, thermalSensitivity, crtIntensity, false);
      } else if (visionMode == 3) {
        finalCol = applyThermal(finalCol, uv, thermalSensitivity, crtIntensity, true);
      } else {
        vec3 exposedColor = finalCol * exposure;
        vec3 toneMappedColor = ACESFilmicToneMapping(exposedColor);
        finalCol = finalLevels(toneMappedColor, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
      }
      fragColor = vec4(finalCol, 1.0);
    }
    `;

    const postCopyFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      fragColor = texture(inputTexture, vUv);
    }
    `;

    function postCreateFBO(w, h, options = {}) {
      return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
        wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
        wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
        minFilter: options.minFilter || THREE.LinearFilter,
        magFilter: options.magFilter || THREE.LinearFilter,
        format: options.format || THREE.RGBAFormat,
        type: options.type || THREE.HalfFloatType,
        stencilBuffer: options.stencilBuffer || false,
        depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : true,
        samples: options.samples || 0,
      });
    }

    class PostShaderPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbo = postCreateFBO(1, 1, options);
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
        this.texture = this.fbo.texture;
      }
      render(renderer, toScreen = false) {
        if (!toScreen) renderer.setRenderTarget(this.fbo);
        renderer.render(this.orthoScene, this.orthoCamera);
        if (!toScreen) renderer.setRenderTarget(null);
      }
      setSize(width, height) {
        this.fbo.setSize(Math.max(1, width), Math.max(1, height));
        this.orthoQuad.scale.set(width, height, 1);
      }
    }

    class PostShaderPingPongPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbos = [postCreateFBO(1, 1, options), postCreateFBO(1, 1, options)];
        this.currentFBO = 0;
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
      }
      render(renderer) {
        renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
        renderer.render(this.orthoScene, this.orthoCamera);
        renderer.setRenderTarget(null);
        this.currentFBO = 1 - this.currentFBO;
      }
      get current() { return this.fbos[this.currentFBO]; }
      get texture() { return this.current.texture; }
      setSize(width, height) {
        const w = Math.max(1, width);
        const h = Math.max(1, height);
        this.orthoQuad.scale.set(w, h, 1);
        this.fbos[0].setSize(w, h);
        this.fbos[1].setSize(w, h);
      }
    }

    class PostBloomPass {
      constructor(strength = 0.8, radius = 0.5, threshold = 0.2, levels = 5) {
        this.strength = strength;
        this.radius = radius;
        this.threshold = threshold;
        this.enabled = true;
        this.levels = levels;

        this.brightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            bloomThreshold: { value: this.threshold },
          },
          vertexShader: postOrthoVertexShader,
          fragmentShader: postBrightFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.brightPass = new PostShaderPass(this.brightShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.blurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            direction: { value: new THREE.Vector2(0, 1) },
          },
          vertexShader: postOrthoVertexShader,
          fragmentShader: postBlurFragmentShader,
          glslVersion: THREE.GLSL3,
        });

        this.blurPasses = [];
        for (let i = 0; i < this.levels; i++) {
          this.blurPasses.push(new PostShaderPingPongPass(this.blurShader, {
            format: THREE.RGBAFormat,
            type: THREE.HalfFloatType,
          }));
        }
      }

      setSize(w, h) {
        let tw = Math.max(1, w);
        let th = Math.max(1, h);
        this.brightPass.setSize(tw, th);
        for (let i = 0; i < this.levels; i++) {
          tw = Math.max(1, Math.round(tw / 2));
          th = Math.max(1, Math.round(th / 2));
          this.blurPasses[i].setSize(tw, th);
        }
      }

      set source(texture) {
        this.brightShader.uniforms.inputTexture.value = texture;
      }

      render(renderer) {
        if (!this.enabled || this.strength <= 0.001) return;
        this.brightShader.uniforms.bloomThreshold.value = this.threshold;
        this.brightPass.render(renderer);

        const baseOffset = Math.max(0.1, this.radius * 2.0);
        const u = this.blurShader.uniforms;

        for (let j = 0; j < this.levels; j++) {
          const blurPass = this.blurPasses[j];
          const stepOffset = baseOffset * (1.0 + j * 0.5);

          u.direction.value.set(stepOffset, 0);
          u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
          blurPass.render(renderer);

          u.direction.value.set(0, stepOffset * 0.5);
          u.inputTexture.value = blurPass.current.texture;
          blurPass.render(renderer);
        }
      }
    }

    const POST_VISION_MODE_MAP = {
      'Normal (Cinematic)': 0,
      'Night Vision (Phosphor)': 1,
      'Thermal (Ironbow)': 2,
      'Thermal (White-Hot)': 3,
    };

    class PostProcessorSuite {
      constructor(renderer, params = {}) {
        this.renderer = renderer;

        this.settings = {
          enabled: params.enabled !== undefined ? params.enabled : true,
          antialias: params.antialias !== undefined ? params.antialias : true,
          bloomEnabled: params.bloomEnabled !== undefined ? params.bloomEnabled : true,
          bloomStrength: params.bloomStrength !== undefined ? params.bloomStrength : 1.2,
          bloomRadius: params.bloomRadius !== undefined ? params.bloomRadius : 0.6,
          bloomThreshold: params.bloomThreshold !== undefined ? params.bloomThreshold : 0.15,
          raysEnabled: params.raysEnabled !== undefined ? params.raysEnabled : false,
          raysStrength: params.raysStrength !== undefined ? params.raysStrength : 0.85,
          raysDensity: params.raysDensity !== undefined ? params.raysDensity : 1.0,
          raysMaxDensity: params.raysMaxDensity !== undefined ? params.raysMaxDensity : 0.5,
          raysDistanceAttenuation: params.raysDistanceAttenuation !== undefined ? params.raysDistanceAttenuation : 2.0,
          raysThreshold: params.raysThreshold !== undefined ? params.raysThreshold : 0.12,
          raysColor: params.raysColor ? (params.raysColor.isColor ? params.raysColor.clone() : new THREE.Color(params.raysColor)) : new THREE.Color(0xf6aa1c),
          raysColorHex: params.raysColorHex || '#f6aa1c',
          anamorphicEnabled: params.anamorphicEnabled !== undefined ? params.anamorphicEnabled : false, // Default is OFF
          anamorphicIntensity: params.anamorphicIntensity !== undefined ? params.anamorphicIntensity : 5.0,
          anamorphicThreshold: params.anamorphicThreshold !== undefined ? params.anamorphicThreshold : 0.3,
          anamorphicSamples: params.anamorphicSamples !== undefined ? params.anamorphicSamples : 64,
          anamorphicRadius: params.anamorphicRadius !== undefined ? params.anamorphicRadius : 0.0,
          anamorphicSmoothWidth: params.anamorphicSmoothWidth !== undefined ? params.anamorphicSmoothWidth : 0.05,
          anamorphicColor: params.anamorphicColor ? (params.anamorphicColor.isColor ? params.anamorphicColor.clone() : new THREE.Color(params.anamorphicColor)) : new THREE.Color(0x7a8aff),
          anamorphicColorHex: params.anamorphicColorHex || '#7a8aff',
          visionMode: params.visionMode !== undefined ? params.visionMode : 'Normal (Cinematic)',
          thermalSensitivity: params.thermalSensitivity !== undefined ? params.thermalSensitivity : 1.4,
          nightVisionGain: params.nightVisionGain !== undefined ? params.nightVisionGain : 2.1,
          nightVisionNoise: params.nightVisionNoise !== undefined ? params.nightVisionNoise : 0.05,
          crtIntensity: params.crtIntensity !== undefined ? params.crtIntensity : 0.0,
          fisheyeStrength: params.fisheyeStrength !== undefined ? params.fisheyeStrength : 0.0,
          fisheyeRadius: params.fisheyeRadius !== undefined ? params.fisheyeRadius : 1.0,
          chromaticAberration: params.chromaticAberration !== undefined ? params.chromaticAberration : 0.015,
          vignetteBoost: params.vignetteBoost !== undefined ? params.vignetteBoost : 1.05,
          vignetteReduction: params.vignetteReduction !== undefined ? params.vignetteReduction : 0.65,
          noiseIntensity: params.noiseIntensity !== undefined ? params.noiseIntensity : 0.012,
          gamma: params.gamma !== undefined ? params.gamma : 1.0,
          minInputLevel: params.minInputLevel !== undefined ? params.minInputLevel : 0.0,
          maxInputLevel: params.maxInputLevel !== undefined ? params.maxInputLevel : 1.0,
          exposure: params.exposure !== undefined ? params.exposure : 1.15,
        };

        const maxSamples = (this.renderer && this.renderer.capabilities) ? (this.renderer.capabilities.maxSamples || 4) : 4;
        const targetSamples = this.settings.antialias ? Math.min(4, maxSamples) : 0;
        this.sceneTarget = postCreateFBO(1, 1, { type: THREE.HalfFloatType, samples: targetSamples });

        this.bloomPass = new PostBloomPass(
          this.settings.bloomStrength,
          this.settings.bloomRadius,
          this.settings.bloomThreshold,
          5
        );

        this.moonScreenPos = new THREE.Vector3(0.5, 0.7, 1.0);
        this.moonInFront = true;

        this.godRaysMaskShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            threshold: { value: this.settings.raysThreshold },
          },
          vertexShader: postOrthoVertexShader,
          fragmentShader: postGodRaysDepthMaskShader,
          glslVersion: THREE.GLSL3,
        });
        this.godRaysMaskPass = new PostShaderPass(this.godRaysMaskShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.godRaysGenShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            vSunPositionScreenSpace: { value: this.moonScreenPos },
            fStepSize: { value: 1.0 },
            distanceAttenuation: { value: this.settings.raysDistanceAttenuation },
            maxDensity: { value: this.settings.raysMaxDensity },
          },
          vertexShader: postOrthoVertexShader,
          fragmentShader: postGodRaysGenerateShader,
          glslVersion: THREE.GLSL3,
        });
        this.godRaysPingPong = new PostShaderPingPongPass(this.godRaysGenShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.anamorphicBrightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            threshold: { value: this.settings.anamorphicThreshold },
            smoothWidth: { value: this.settings.anamorphicSmoothWidth },
          },
          vertexShader: postOrthoVertexShader,
          fragmentShader: postAnamorphicBrightShader,
          glslVersion: THREE.GLSL3,
        });
        this.anamorphicBrightPass = new PostShaderPass(this.anamorphicBrightShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.anamorphicBlurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            resolution: { value: new THREE.Vector2(1, 1) },
            samples: { value: this.settings.anamorphicSamples },
            intensity: { value: this.settings.anamorphicIntensity },
            tintColor: { value: this.settings.anamorphicColor },
            bloomRadius: { value: this.settings.anamorphicRadius },
          },
          vertexShader: postOrthoVertexShader,
          fragmentShader: postAnamorphicBlurShader,
          glslVersion: THREE.GLSL3,
        });
        this.anamorphicBlurPass = new PostShaderPass(this.anamorphicBlurShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.finalShader = new THREE.RawShaderMaterial({
          uniforms: {
            resolution: { value: new THREE.Vector2(1, 1) },
            bloomEnabled: { value: this.settings.bloomEnabled },
            bloomStrength: { value: this.settings.bloomStrength },
            raysEnabled: { value: this.settings.raysEnabled },
            raysStrength: { value: this.settings.raysStrength },
            raysColor: { value: this.settings.raysColor },
            anamorphicEnabled: { value: this.settings.anamorphicEnabled },
            vignetteBoost: { value: this.settings.vignetteBoost },
            vignetteReduction: { value: this.settings.vignetteReduction },
            noiseIntensity: { value: this.settings.noiseIntensity },
            inputTexture: { value: null },
            blur0Texture: { value: null },
            blur1Texture: { value: null },
            blur2Texture: { value: null },
            blur3Texture: { value: null },
            blur4Texture: { value: null },
            raysTexture: { value: null },
            anamorphicTexture: { value: null },
            time: { value: 0 },
          },
          vertexShader: postOrthoVertexShader,
          fragmentShader: postFinalFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.finalPass = new PostShaderPass(this.finalShader);

        this.rgbShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: this.finalPass.texture },
            fisheyeStrength: { value: this.settings.fisheyeStrength },
            fisheyeRadius: { value: this.settings.fisheyeRadius },
            chromaticAberrationAmount: { value: this.settings.chromaticAberration },
            minInputLevel: { value: this.settings.minInputLevel },
            maxInputLevel: { value: this.settings.maxInputLevel },
            gammaLevel: { value: this.settings.gamma },
            exposure: { value: this.settings.exposure },
            visionMode: { value: POST_VISION_MODE_MAP[this.settings.visionMode] ?? 0 },
            thermalSensitivity: { value: this.settings.thermalSensitivity },
            nightVisionGain: { value: this.settings.nightVisionGain },
            nightVisionNoise: { value: this.settings.nightVisionNoise },
            crtIntensity: { value: this.settings.crtIntensity },
            time: { value: 0 },
          },
          vertexShader: postOrthoVertexShader,
          fragmentShader: postColorFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.rgbPass = new PostShaderPass(this.rgbShader);

        this.copyShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
          },
          vertexShader: postOrthoVertexShader,
          fragmentShader: postCopyFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.copyPass = new PostShaderPass(this.copyShader);
      }

      updateSettings() {
        this.bloomPass.enabled = this.settings.bloomEnabled;
        this.bloomPass.strength = this.settings.bloomStrength;
        this.bloomPass.radius = this.settings.bloomRadius;
        this.bloomPass.threshold = this.settings.bloomThreshold;

        this.godRaysMaskShader.uniforms.threshold.value = this.settings.raysThreshold;
        this.godRaysGenShader.uniforms.distanceAttenuation.value = this.settings.raysDistanceAttenuation;
        this.godRaysGenShader.uniforms.maxDensity.value = this.settings.raysMaxDensity;

        this.anamorphicBrightShader.uniforms.threshold.value = this.settings.anamorphicThreshold;
        this.anamorphicBrightShader.uniforms.smoothWidth.value = this.settings.anamorphicSmoothWidth;
        this.anamorphicBlurShader.uniforms.samples.value = this.settings.anamorphicSamples;
        this.anamorphicBlurShader.uniforms.intensity.value = this.settings.anamorphicIntensity;
        this.anamorphicBlurShader.uniforms.tintColor.value.copy(this.settings.anamorphicColor);
        this.anamorphicBlurShader.uniforms.bloomRadius.value = this.settings.anamorphicRadius;

        this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
        this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
        this.finalShader.uniforms.raysEnabled.value = this.settings.raysEnabled && this.moonInFront;
        this.finalShader.uniforms.raysStrength.value = this.settings.raysStrength;
        this.finalShader.uniforms.raysColor.value.copy(this.settings.raysColor);
        this.finalShader.uniforms.anamorphicEnabled.value = this.settings.anamorphicEnabled;
        this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
        this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
        this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;

        this.rgbShader.uniforms.fisheyeStrength.value = this.settings.fisheyeStrength;
        this.rgbShader.uniforms.fisheyeRadius.value = this.settings.fisheyeRadius;
        this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
        this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
        this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
        this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
        this.rgbShader.uniforms.exposure.value = this.settings.exposure;
        this.rgbShader.uniforms.visionMode.value = POST_VISION_MODE_MAP[this.settings.visionMode] ?? 0;
        this.rgbShader.uniforms.thermalSensitivity.value = this.settings.thermalSensitivity;
        this.rgbShader.uniforms.nightVisionGain.value = this.settings.nightVisionGain;
        this.rgbShader.uniforms.nightVisionNoise.value = this.settings.nightVisionNoise;
        this.rgbShader.uniforms.crtIntensity.value = this.settings.crtIntensity;
      }

      setSize(w0, h0, dpr = 1) {
        const w = Math.max(1, Math.floor(w0 * dpr));
        const h = Math.max(1, Math.floor(h0 * dpr));
        this.sceneTarget.setSize(w, h);
        this.finalPass.setSize(w, h);
        this.finalShader.uniforms.resolution.value.set(w, h);
        this.bloomPass.setSize(w, h);

        const grW = Math.max(1, Math.round(w / 2));
        const grH = Math.max(1, Math.round(h / 2));
        this.godRaysMaskPass.setSize(grW, grH);
        this.godRaysPingPong.setSize(grW, grH);

        const anW = Math.max(1, Math.round(w / 4));
        const anH = Math.max(1, Math.round(h / 4));
        this.anamorphicBrightPass.setSize(anW, anH);
        this.anamorphicBlurPass.setSize(anW, anH);
        this.anamorphicBlurShader.uniforms.resolution.value.set(anW, anH);

        this.rgbPass.setSize(w, h);
        this.copyPass.setSize(w, h);
      }

      setAntialias(enabled) {
        this.settings.antialias = !!enabled;
        const maxSamples = (this.renderer && this.renderer.capabilities) ? (this.renderer.capabilities.maxSamples || 4) : 4;
        const samples = this.settings.antialias ? Math.min(4, maxSamples) : 0;
        if (this.sceneTarget.samples !== samples) {
          const oldTarget = this.sceneTarget;
          this.sceneTarget = postCreateFBO(oldTarget.width, oldTarget.height, {
            type: THREE.HalfFloatType,
            samples: samples,
          });
          oldTarget.dispose();
        }
      }

      renderScene(scene, camera) {
        if (!this.settings.enabled) {
          this.renderer.setRenderTarget(this.sceneTarget);
          this.renderer.render(scene, camera);
          this.renderer.setRenderTarget(null);
          this.copyPass.shader.uniforms.inputTexture.value = this.sceneTarget.texture;
          this.copyPass.render(this.renderer, true);
          return;
        }
        this.renderer.setRenderTarget(this.sceneTarget);
        this.renderer.render(scene, camera);
        this.renderer.setRenderTarget(null);
        this.render(this.sceneTarget.texture);
      }

      render(sourceTexture) {
        if (!this.settings.enabled) {
          this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
          this.copyPass.render(this.renderer, true);
          return;
        }

        this.updateSettings();

        this.bloomPass.source = sourceTexture;
        this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
        this.bloomPass.render(this.renderer);

        this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
        this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
        this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
        this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
        this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

        if (this.settings.raysEnabled && this.settings.raysStrength > 0.001 && this.moonInFront) {
          this.godRaysMaskShader.uniforms.inputTexture.value = sourceTexture;
          this.godRaysMaskShader.uniforms.threshold.value = this.settings.raysThreshold;
          this.godRaysMaskPass.render(this.renderer);

          const filterLen = this.settings.raysDensity;
          const tapsPerPass = 6.0;

          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -1.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysMaskPass.texture;
          this.godRaysPingPong.render(this.renderer);

          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -2.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysPingPong.texture;
          this.godRaysPingPong.render(this.renderer);

          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -3.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysPingPong.texture;
          this.godRaysPingPong.render(this.renderer);

          this.finalPass.shader.uniforms.raysTexture.value = this.godRaysPingPong.texture;
          this.finalPass.shader.uniforms.raysEnabled.value = true;
        } else {
          this.finalPass.shader.uniforms.raysEnabled.value = false;
        }

        if (this.settings.anamorphicEnabled && this.settings.anamorphicIntensity > 0.001) {
          this.anamorphicBrightShader.uniforms.inputTexture.value = sourceTexture;
          this.anamorphicBrightShader.uniforms.threshold.value = this.settings.anamorphicThreshold;
          this.anamorphicBrightShader.uniforms.smoothWidth.value = this.settings.anamorphicSmoothWidth;
          this.anamorphicBrightPass.render(this.renderer);

          this.anamorphicBlurShader.uniforms.inputTexture.value = this.anamorphicBrightPass.texture;
          this.anamorphicBlurShader.uniforms.samples.value = this.settings.anamorphicSamples;
          this.anamorphicBlurShader.uniforms.intensity.value = this.settings.anamorphicIntensity;
          this.anamorphicBlurShader.uniforms.tintColor.value.copy(this.settings.anamorphicColor);
          this.anamorphicBlurShader.uniforms.bloomRadius.value = this.settings.anamorphicRadius;
          this.anamorphicBlurPass.render(this.renderer);

          this.finalPass.shader.uniforms.anamorphicTexture.value = this.anamorphicBlurPass.texture;
          this.finalPass.shader.uniforms.anamorphicEnabled.value = true;
        } else {
          this.finalPass.shader.uniforms.anamorphicEnabled.value = false;
        }

        const randomTime = Math.random() * 100000;
        this.finalPass.shader.uniforms.time.value = randomTime;
        this.rgbPass.shader.uniforms.time.value = randomTime;

        this.finalPass.render(this.renderer);
        this.rgbPass.render(this.renderer, true);
      }

        root.add(this.settings, "enabled").name("Enable Post-Process");

        const vision = root.addFolder("Thermal & Night Vision");
        vision.add(this.settings, "visionMode", Object.keys(POST_VISION_MODE_MAP)).name("Vision Mode").onChange(() => this.updateSettings());

        vision.add(this.settings, "nightVisionNoise", 0.0, 0.3, 0.01).name("NVG Sensor Noise").onChange(() => this.updateSettings());
        vision.add(this.settings, "thermalSensitivity", 0.5, 3.5, 0.05).name("Thermal Sensitivity").onChange(() => this.updateSettings());

        anamorphic.add(this.settings, "anamorphicRadius", 0.0, 1.0, 0.01).name("Bloom Radius").onChange(() => this.updateSettings());
        anamorphic.addColor(this.settings, "anamorphicColorHex").name("Tint Color").onChange((v) => {
          this.settings.anamorphicColor.set(v);
          this.updateSettings();
        });

        bloom.add(this.settings, "bloomThreshold", 0, 1.0, 0.01).name("Bloom Threshold").onChange(() => this.updateSettings());

        const lens = root.addFolder("Lens, Optics & Film Grain");
        lens.add(this.settings, "fisheyeStrength", -1.0, 1.5, 0.01).name("Fisheye Distortion").onChange(() => this.updateSettings());
        lens.add(this.settings, "fisheyeRadius", 0.2, 2.0, 0.05).name("Fisheye Radius").onChange(() => this.updateSettings());
        lens.add(this.settings, "chromaticAberration", 0, 0.2, 0.005).name("Chromatic Aberration").onChange(() => this.updateSettings());
        lens.add(this.settings, "vignetteBoost", 0, 2.0, 0.05).name("Vignette Boost").onChange(() => this.updateSettings());
        lens.add(this.settings, "vignetteReduction", 0, 2.0, 0.05).name("Vignette Falloff").onChange(() => this.updateSettings());
        lens.add(this.settings, "noiseIntensity", 0, 0.1, 0.005).name("Film Grain").onChange(() => this.updateSettings());

        return root;
      }

    // -------------------------------------------------------------
    // STUDIO ENVIRONMENT GENERATOR
    // -------------------------------------------------------------
    function updateEnvironment() {
      const canvas = document.createElement('canvas');
      canvas.width = 2048;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');

      const bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      bgGrad.addColorStop(0, '#030406');
      bgGrad.addColorStop(0.35, '#0e1018');
      bgGrad.addColorStop(0.5, '#06070a');
      bgGrad.addColorStop(1, '#010204');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      // Main Overhead Softbox Diffuser
      ctx.filter = 'blur(26px)';
      const radGrad1 = ctx.createRadialGradient(1024, 210, 30, 1024, 210, 440);
      radGrad1.addColorStop(0, '#ffffff');
      radGrad1.addColorStop(0.3, params.keyLightColor);
      radGrad1.addColorStop(0.7, 'rgba(255,255,255,0.25)');
      radGrad1.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = radGrad1;
      ctx.beginPath();
      ctx.ellipse(1024, 210, 560, 190, 0, 0, Math.PI * 2);
      ctx.fill();

      // Left Vertical Strip Softbox
      ctx.filter = 'blur(16px)';
      const linGrad2 = ctx.createLinearGradient(160, 180, 360, 780);
      linGrad2.addColorStop(0, params.fillLightColor);
      linGrad2.addColorStop(0.4, '#ffffff');
      linGrad2.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = linGrad2;
      ctx.fillRect(180, 200, 160, 520);

      // Right Vertical Strip Softbox
      const linGrad3 = ctx.createLinearGradient(1660, 180, 1880, 780);
      linGrad3.addColorStop(0, '#ffffff');
      linGrad3.addColorStop(0.5, params.rimLightColor);
      linGrad3.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = linGrad3;
      ctx.fillRect(1680, 220, 150, 480);

      // Studio Horizon light bounce
      ctx.filter = 'blur(12px)';
      const horizGrad = ctx.createLinearGradient(0, 512, canvas.width, 512);
      horizGrad.addColorStop(0, 'rgba(255,255,255,0)');
      horizGrad.addColorStop(0.5, 'rgba(255,255,255,0.35)');
      horizGrad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = horizGrad;
      ctx.fillRect(0, 508, canvas.width, 20);
      ctx.restore();

      const texture = new THREE.CanvasTexture(canvas);
      texture.mapping = THREE.EquirectangularReflectionMapping;

      const envMap = pmremGenerator.fromEquirectangular(texture).texture;
      scene.environment = envMap;
      texture.dispose();
    }

    // -------------------------------------------------------------
    // SPECTACULAR FIREWORKS BEHIND TYPOGRAPHY
    // -------------------------------------------------------------
    const MAX_FIREWORKS = 6;
    const PARTICLES_PER_BURST = 180;

    const fireworkVertexShader = `
      attribute float aSize;
      attribute float aAlpha;
      attribute vec3 aColor;
      varying float vAlpha;
      varying vec3 vColor;
      void main() {
        vAlpha = aAlpha;
        vColor = aColor;
        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = aSize * (320.0 / max(1.0, -mvPosition.z));
        gl_Position = projectionMatrix * mvPosition;
      }
    `;

    const fireworkFragmentShader = `
      varying float vAlpha;
      varying vec3 vColor;
      void main() {
        if (vAlpha <= 0.01) discard;
        vec2 coord = gl_PointCoord - vec2(0.5);
        float dist = length(coord);
        if (dist > 0.5) discard;
        float factor = max(0.0, 1.0 - dist * 2.0);
        float intensity = pow(factor, 1.6);
        vec3 col = mix(vColor, vec3(1.0), pow(intensity, 3.5));
        gl_FragColor = vec4(col, intensity * vAlpha);
      }
    `;

    function setupFireworks() {
      fireworksGroup = new THREE.Group();
      scene.add(fireworksGroup);

      const festiveColors = [
        new THREE.Color('#ffd166'), // Gold
        new THREE.Color('#ff0055'), // Ruby Crimson
        new THREE.Color('#00f0ff'), // Electric Cyan
        new THREE.Color('#7000ff'), // Royal Violet
        new THREE.Color('#00ff88'), // Emerald Green
        new THREE.Color('#ff7700'), // Amber Orange
        new THREE.Color('#ffffff')  // Pure Silver Spark
      ];

      for (let f = 0; f < MAX_FIREWORKS; f++) {
        const positions = new Float32Array(PARTICLES_PER_BURST * 3);
        const colors = new Float32Array(PARTICLES_PER_BURST * 3);
        const sizes = new Float32Array(PARTICLES_PER_BURST);
        const alphas = new Float32Array(PARTICLES_PER_BURST);
        const velocities = [];

        for (let i = 0; i < PARTICLES_PER_BURST; i++) {
          velocities.push(new THREE.Vector3());
          alphas[i] = 0.0;
          sizes[i] = params.fireworksSize;
        }

        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('aColor', new THREE.BufferAttribute(colors, 3));
        geometry.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
        geometry.setAttribute('aAlpha', new THREE.BufferAttribute(alphas, 1));

        const material = new THREE.ShaderMaterial({
          vertexShader: fireworkVertexShader,
          fragmentShader: fireworkFragmentShader,
          transparent: true,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        });

        const points = new THREE.Points(geometry, material);
        fireworksGroup.add(points);

        // Burst flash light that illuminates chrome letters from behind
        const burstLight = new THREE.PointLight(0xffffff, 0, 25);
        scene.add(burstLight);
        fireworkLights.push(burstLight);

        fireworkPool.push({
          points,
          geometry,
          material,
          burstLight,
          velocities,
          active: false,
          age: 0,
          maxAge: 2.2,
          timer: 0.3 + f * 0.7, // Staggered launches
          colors: festiveColors
        });
      }
    }

    function triggerFirework(fw) {
      fw.active = true;
      fw.age = 0;
      fw.maxAge = 1.8 + Math.random() * 0.8;

      // Position BEHIND typography: Z between -8 and -20, Y between 1 and 12, X between -15 and 15
      const originX = (Math.random() - 0.5) * 28;
      const originY = 1.5 + Math.random() * 10;
      const originZ = -8 - Math.random() * 12;

      const baseColor = fw.colors[Math.floor(Math.random() * fw.colors.length)];
      const accentColor = fw.colors[Math.floor(Math.random() * fw.colors.length)];

      const posAttr = fw.geometry.attributes.position;
      const colAttr = fw.geometry.attributes.aColor;
      const sizeAttr = fw.geometry.attributes.aSize;
      const alphaAttr = fw.geometry.attributes.aAlpha;

      fw.burstLight.position.set(originX, originY, originZ);
      fw.burstLight.color.copy(baseColor);
      fw.burstLight.intensity = 3.5 * params.globalLightIntensity;

      const burstSpeed = 7.0 + Math.random() * 6.0;

      for (let i = 0; i < PARTICLES_PER_BURST; i++) {
        posAttr.setXYZ(i, originX, originY, originZ);

        // Spherical explosion distribution
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        const speed = burstSpeed * (0.35 + Math.random() * 0.65);

        fw.velocities[i].set(
          Math.sin(phi) * Math.cos(theta) * speed,
          Math.sin(phi) * Math.sin(theta) * speed,
          Math.cos(phi) * speed
        );

        const particleColor = Math.random() > 0.3 ? baseColor : accentColor;
        colAttr.setXYZ(i, particleColor.r, particleColor.g, particleColor.b);
        sizeAttr.setX(i, params.fireworksSize * (0.8 + Math.random() * 0.6));
        alphaAttr.setX(i, 1.0);
      }

      posAttr.needsUpdate = true;
      colAttr.needsUpdate = true;
      sizeAttr.needsUpdate = true;
      alphaAttr.needsUpdate = true;
    }

    function updateFireworks(delta) {
      if (!params.fireworksEnabled || params.greenscreen) {
        fireworksGroup.visible = false;
        fireworkLights.forEach(l => l.intensity = 0);
        return;
      }
      fireworksGroup.visible = true;

      fireworkPool.forEach(fw => {
        if (!fw.active) {
          fw.timer -= delta * params.fireworksFrequency;
          if (fw.timer <= 0) {
            triggerFirework(fw);
          }
        } else {
          fw.age += delta;
          const progress = fw.age / fw.maxAge;

          if (progress >= 1.0) {
            fw.active = false;
            fw.timer = 0.4 + Math.random() * 1.5;
            fw.burstLight.intensity = 0;
            const alphaAttr = fw.geometry.attributes.aAlpha;
            for (let i = 0; i < PARTICLES_PER_BURST; i++) alphaAttr.setX(i, 0);
            alphaAttr.needsUpdate = true;
            return;
          }

          // Dim light quickly after initial burst flash
          fw.burstLight.intensity = Math.max(0, 3.5 * (1.0 - progress * 2.5));

          const posAttr = fw.geometry.attributes.position;
          const alphaAttr = fw.geometry.attributes.aAlpha;
          const decayAlpha = Math.max(0, 1.0 - Math.pow(progress, 1.4));

          for (let i = 0; i < PARTICLES_PER_BURST; i++) {
            const v = fw.velocities[i];
            // Deceleration + gravity
            v.x *= 0.965;
            v.z *= 0.965;
            v.y = v.y * 0.965 - 3.8 * delta;

            const px = posAttr.getX(i) + v.x * delta;
            const py = posAttr.getY(i) + v.y * delta;
            const pz = posAttr.getZ(i) + v.z * delta;

            posAttr.setXYZ(i, px, py, pz);

            // Subtle sparkle twinkle
            const twinkle = 0.75 + 0.25 * Math.sin(fw.age * 28 + i * 3);
            alphaAttr.setX(i, decayAlpha * twinkle);
          }

          posAttr.needsUpdate = true;
          alphaAttr.needsUpdate = true;
        }
      });
    }

    // -------------------------------------------------------------
    // GLITTERING 3D SNOWFLAKES & METALLIC FLAKES
    // -------------------------------------------------------------
    function createFlakeGeometry() {
      // 6-pointed faceted crystal snowflake geometry
      const shape = new THREE.Shape();
      const points = 6;
      const outerR = 0.35;
      const innerR = 0.12;
      const branchR = 0.25;

      for (let i = 0; i < points; i++) {
        const a = (i * Math.PI * 2) / points - Math.PI / 2;
        const midA = a + Math.PI / points;

        const x0 = Math.cos(a) * outerR;
        const y0 = Math.sin(a) * outerR;
        const xMid = Math.cos(midA) * innerR;
        const yMid = Math.sin(midA) * innerR;

        if (i === 0) shape.moveTo(x0, y0);
        else shape.lineTo(x0, y0);

        const subA = a + 0.16;
        shape.lineTo(Math.cos(subA) * branchR, Math.sin(subA) * branchR);
        shape.lineTo(xMid, yMid);
      }
      shape.closePath();

      const geo = new THREE.ExtrudeGeometry(shape, {
        height: 0.04,
        depth: 0.04,
        bevelEnabled: true,
        bevelThickness: 0.02,
        bevelSize: 0.015,
        bevelSegments: 2
      });
      geo.center();
      return geo;
    }

    function setup3DFlakes() {
      const flakeGeo = createFlakeGeometry();
      flakesMesh = new THREE.InstancedMesh(flakeGeo, flakeMaterial, FLAKE_COUNT);
      flakesMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      flakesMesh.castShadow = true;
      flakesMesh.receiveShadow = true;
      scene.add(flakesMesh);

      const dummy = new THREE.Object3D();

      for (let i = 0; i < FLAKE_COUNT; i++) {
        const isBackLayer = Math.random() < 0.65;
        const initZ = isBackLayer
          ? (-2.5 - Math.random() * 8.0)  // Background layer: safely behind text
          : (2.4 + Math.random() * 5.0);   // Foreground layer: safely in front of text

        const data = {
          x: (Math.random() - 0.5) * 34,
          y: -5.5 + Math.random() * 18,
          z: initZ,
          isBackLayer: isBackLayer,
          speedY: 0.7 + Math.random() * 1.1,
          driftX: 0.3 + Math.random() * 0.5,
          driftZ: 0.2 + Math.random() * 0.4,
          phaseX: Math.random() * Math.PI * 2,
          phaseZ: Math.random() * Math.PI * 2,
          rotX: Math.random() * Math.PI * 2,
          rotY: Math.random() * Math.PI * 2,
          rotZ: Math.random() * Math.PI * 2,
          rotSpeedX: (Math.random() - 0.5) * 2.2,
          rotSpeedY: (Math.random() - 0.5) * 2.2,
          rotSpeedZ: (Math.random() - 0.5) * 2.2,
          scale: 0.5 + Math.random() * 0.65
        };
        flakesData.push(data);

        dummy.position.set(data.x, data.y, data.z);
        dummy.rotation.set(data.rotX, data.rotY, data.rotZ);
        dummy.scale.setScalar(data.scale * params.flakesSize);
        dummy.updateMatrix();
        flakesMesh.setMatrixAt(i, dummy.matrix);
      }
      flakesMesh.instanceMatrix.needsUpdate = true;
    }

    function update3DFlakes(delta, timeVal) {
      if (!params.flakesEnabled || params.greenscreen) {
        flakesMesh.visible = false;
        return;
      }
      flakesMesh.visible = true;

      const dummy = new THREE.Object3D();
      const speedMult = params.flakesSpeed;

      for (let i = 0; i < FLAKE_COUNT; i++) {
        const f = flakesData[i];

        f.y -= f.speedY * delta * speedMult;
        f.x += Math.sin(timeVal * 0.7 + f.phaseX) * f.driftX * delta * speedMult;
        f.z += Math.cos(timeVal * 0.6 + f.phaseZ) * f.driftZ * delta * speedMult;

        // Guaranteed Collision Avoidance: Never overlap or clip inside 3D letter meshes
        if (f.x > textExclusionBounds.minX && f.x < textExclusionBounds.maxX &&
            f.y > textExclusionBounds.minY && f.y < textExclusionBounds.maxY) {
          if (f.z > -1.9 && f.z < 2.2) {
            f.z = (f.isBackLayer || f.z < 0.1) ? -2.3 : 2.4;
          }
        }

        f.rotX += f.rotSpeedX * delta * speedMult;
        f.rotY += f.rotSpeedY * delta * speedMult;
        f.rotZ += f.rotSpeedZ * delta * speedMult;

        // Loop from bottom to top
        if (f.y < -5.5) {
          f.y = 11.5 + Math.random() * 1.5;
          f.x = (Math.random() - 0.5) * 34;
          f.isBackLayer = Math.random() < 0.65;
          f.z = f.isBackLayer
            ? (-2.5 - Math.random() * 8.0)
            : (2.4 + Math.random() * 5.0);
        }

        dummy.position.set(f.x, f.y, f.z);
        dummy.rotation.set(f.rotX, f.rotY, f.rotZ);
        dummy.scale.setScalar(f.scale * params.flakesSize);
        dummy.updateMatrix();
        flakesMesh.setMatrixAt(i, dummy.matrix);
      }
      flakesMesh.instanceMatrix.needsUpdate = true;
    }

          postProcessor.updateSettings();

    // -------------------------------------------------------------
    // FONT LOADER & PROPORTIONED 3D CHROME TYPOGRAPHY
    // -------------------------------------------------------------
    async function loadFont() {
      const fontUrls = [
        'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/fonts/helvetiker_bold.typeface.json',
        'https://unpkg.com/three@0.160.0/examples/fonts/helvetiker_bold.typeface.json'
      ];

      const loader = new FontLoader();
      for (const url of fontUrls) {
        try {
          const res = await fetch(url);
          if (res.ok) {
            const fontData = await res.json();
            return loader.parse(fontData);
          }
        } catch (err) {
          console.warn('Font CDN failed:', url, err);
        }
      }
      throw new Error('Failed to load font from CDNs');
    }

    function applyTextPreset(presetName) {
      params.textPreset = presetName;
      const preset = TEXT_PRESETS[presetName];
      if (preset && presetName !== 'Custom') {
        params.customLine1 = preset.lines[0] ? preset.lines[0].text : '';
        params.customLine2 = preset.lines[1] ? preset.lines[1].text : '';
        params.customLine3 = preset.lines[2] ? preset.lines[2].text : '';
        if (params.autoMatchTheme && preset.recommendedScheme) {
          applyColorScheme(preset.recommendedScheme);
        }
        if (preset.textStyle) {
          params.textStyle = preset.textStyle;
        }
      }
      updateMaterialProperties();
      createTypography();
      if (gui) {
        gui.controllersRecursive().forEach(c => {
          if (c.property && !postProcessor.settings.hasOwnProperty(c.property)) {
            c.updateDisplay();
          }
        });
      }
    }

    function createTypography() {
      if (!loadedFont) return;

      while (typographyGroup.children.length > 0) {
        const obj = typographyGroup.children[0];
        if (obj.geometry) obj.geometry.dispose();
        typographyGroup.remove(obj);
      }
      letterMeshes = [];

      // Determine active lines configuration
      let activeLines = [];
      if (params.textPreset === 'Custom') {
        const c1 = (params.customLine1 || '').trim();
        const c2 = (params.customLine2 || '').trim();
        const c3 = (params.customLine3 || '').trim();
        if (c1) activeLines.push({ text: c1, fontSize: 2.3, height: 0.42, bevelThickness: 0.10, bevelSize: 0.05 });
        if (c2) activeLines.push({ text: c2, fontSize: 2.3, height: 0.42, bevelThickness: 0.10, bevelSize: 0.05 });
        if (c3) activeLines.push({ text: c3, fontSize: 2.3, height: 0.42, bevelThickness: 0.10, bevelSize: 0.05 });
        if (activeLines.length === 0) {
          activeLines.push({ text: 'CUSTOM', fontSize: 2.8, height: 0.48, bevelThickness: 0.11, bevelSize: 0.055 });
        }
      } else {
        const preset = TEXT_PRESETS[params.textPreset] || TEXT_PRESETS['HAPPY NEW YEAR 2027'];
        activeLines = preset.lines.map(l => ({ ...l }));
      }

      // Assign stylized dual-materials per line
      activeLines.forEach((cfg, idx) => {
        cfg.lineIndex = idx;
        if (idx === 0) cfg.materials = [matPrimaryFace, matPrimaryBevel];
        else if (idx === 1) cfg.materials = [matSecondaryFace, matSecondaryBevel];
        else if (idx === 2) cfg.materials = [matAccentFace, matAccentBevel];
        else cfg.materials = [matPrimaryFace, matPrimaryBevel];
      });

      const processedLines = [];
      const lineHeights = [];

      activeLines.forEach((cfg) => {
        const chars = cfg.text.split('');
        const charData = [];
        let lineWidth = 0;
        let maxCharH = cfg.fontSize * 0.9;

        chars.forEach((char) => {
          if (char === ' ') {
            const spaceW = cfg.fontSize * 0.42;
            charData.push({ char, geo: null, width: spaceW, height: 0 });
            lineWidth += spaceW;
            return;
          }

          const geo = new TextGeometry(char, {
            font: loadedFont,
            size: cfg.fontSize,
            height: cfg.height,
            depth: cfg.height,
            curveSegments: 16,
            bevelEnabled: true,
            bevelThickness: cfg.bevelThickness,
            bevelSize: cfg.bevelSize,
            bevelOffset: 0,
            bevelSegments: 6
          });
          geo.computeBoundingBox();
          const bbox = geo.boundingBox;
          const charW = bbox.max.x - bbox.min.x;
          const charH = bbox.max.y - bbox.min.y;
          if (charH > maxCharH) maxCharH = charH;

          charData.push({ char, geo, width: charW, height: charH, bbox });
          lineWidth += charW + params.letterSpacing;
        });

        if (chars.length > 0 && chars[chars.length - 1] !== ' ') {
          lineWidth -= params.letterSpacing;
        }

        lineHeights.push(maxCharH);
        processedLines.push({ cfg, charData, lineWidth, maxCharH });
      });

      // Guaranteed Overlap Prevention: Mathematically compute line positions with explicit clearance
      const numLines = processedLines.length;
      const lineGap = params.lineGap;
      const totalTextH = lineHeights.reduce((a, b) => a + b, 0) + (numLines - 1) * lineGap;

      let curCenterY = totalTextH / 2 - lineHeights[0] / 2;
      const lineYPositions = [];

      for (let i = 0; i < numLines; i++) {
        lineYPositions.push(curCenterY);
        if (i < numLines - 1) {
          curCenterY -= (lineHeights[i] / 2 + lineGap + lineHeights[i + 1] / 2);
        }
      }

      let bMinX = Infinity, bMaxX = -Infinity;
      let bMinY = Infinity, bMaxY = -Infinity;
      let bMinZ = Infinity, bMaxZ = -Infinity;

      processedLines.forEach((pLine, lineIdx) => {
        const posY = lineYPositions[lineIdx];
        const baseLineZ = (numLines - 1 - lineIdx) * 0.22;
        let currentX = -pLine.lineWidth / 2;

        pLine.charData.forEach((item, charIdx) => {
          if (!item.geo) {
            currentX += item.width;
            return;
          }

          item.geo.center();

          const mesh = new THREE.Mesh(item.geo, pLine.cfg.materials);
          mesh.castShadow = true;
          mesh.receiveShadow = true;

          const posX = currentX + item.width / 2;

          // Stylized cylindrical 3D arc curvature
          const normX = pLine.lineWidth > 0 ? (posX / (pLine.lineWidth * 0.5)) : 0;
          const clampedNormX = Math.max(-1, Math.min(1, normX));
          const arcZ = Math.cos(clampedNormX * Math.PI * 0.45) * params.textCurvature;
          const posZ = baseLineZ + arcZ;

          const rotY = -clampedNormX * 0.12 * (params.textCurvature > 0 ? 1 : 0);

          mesh.position.set(posX, posY, posZ);
          mesh.rotation.set(0, rotY, 0);
          typographyGroup.add(mesh);

          // Track live bounding box
          if (posX - item.width / 2 < bMinX) bMinX = posX - item.width / 2;
          if (posX + item.width / 2 > bMaxX) bMaxX = posX + item.width / 2;
          if (posY - item.height / 2 < bMinY) bMinY = posY - item.height / 2;
          if (posY + item.height / 2 > bMaxY) bMaxY = posY + item.height / 2;
          if (posZ - pLine.cfg.height < bMinZ) bMinZ = posZ - pLine.cfg.height;
          if (posZ + pLine.cfg.height > bMaxZ) bMaxZ = posZ + pLine.cfg.height;

          letterMeshes.push({
            mesh,
            originalPos: new THREE.Vector3(posX, posY, posZ),
            originalRot: new THREE.Euler(0, rotY, 0),
            lineIndex: lineIdx,
            charIndex: charIdx,
            timeOffset: lineIdx * 0.5 + charIdx * 0.12
          });

          currentX += item.width + params.letterSpacing;
        });
      });

      // Update exclusion box preventing flake penetrations
      if (isFinite(bMinX)) {
        textExclusionBounds.minX = bMinX - 1.2;
        textExclusionBounds.maxX = bMaxX + 1.2;
        textExclusionBounds.minY = bMinY - 0.9;
        textExclusionBounds.maxY = bMaxY + 0.9;
        textExclusionBounds.minZ = -2.0;
        textExclusionBounds.maxZ = 2.2;
      }
    }

    // -------------------------------------------------------------
    // COLOR SCHEME SELECTOR
    // -------------------------------------------------------------
    function applyColorScheme(schemeName) {
      const scheme = COLOR_SCHEMES[schemeName];
      if (!scheme) return;

      params.colorScheme = schemeName;
      params.primaryColor = scheme.primary;
      params.secondaryColor = scheme.secondary;
      params.accentColor = scheme.accent;
      params.backgroundColor = scheme.background;
      params.keyLightColor = scheme.keyLight;
      params.fillLightColor = scheme.fillLight;
      params.rimLightColor = scheme.rimLight;
      params.underGlowColor = scheme.underGlow;
      params.ambientLightColor = scheme.ambient;
      params.metalness = scheme.metalness;
      params.roughness = scheme.roughness;

      updateMaterialProperties();
      updateLights();
      applyGreenscreen();
      updateEnvironment();

      if (floorMaterial) {
        floorMaterial.color.set(scheme.floor);
      }
    }

    // -------------------------------------------------------------
    // PROCEDURAL RANDOMIZER (DOES NOT TOUCH POSTPROCESSING SETTINGS!)
    // -------------------------------------------------------------
    function randomizeScene() {
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      applyColorScheme(randomScheme);

      params.metalness = 0.95 + Math.random() * 0.05;
      params.roughness = 0.03 + Math.random() * 0.08;
      params.clearcoat = 0.8 + Math.random() * 0.2;

      params.animation = ANIMATION_MODES[Math.floor(Math.random() * ANIMATION_MODES.length)];
      params.animationSpeed = parseFloat((0.6 + Math.random() * 0.8).toFixed(2));

      params.keyLightIntensity = parseFloat((1.8 + Math.random() * 1.0).toFixed(2));
      params.fillLightIntensity = parseFloat((1.2 + Math.random() * 0.8).toFixed(2));
      params.rimLightIntensity = parseFloat((2.0 + Math.random() * 1.2).toFixed(2));

      updateMaterialProperties();
      updateLights();

      // Trigger an immediate celebratory firework burst on randomize!
      const idleFw = fireworkPool.find(f => !f.active);
      if (idleFw) triggerFirework(idleFw);

      // IMPORTANT: DO NOT SHUFFLE OR CHANGE POSTPROCESSING SETTINGS!
      if (gui) {
        gui.controllersRecursive().forEach(ctrl => {
          if (ctrl.property && !postProcessor.settings.hasOwnProperty(ctrl.property)) {
            ctrl.updateDisplay();
          }
        });
      }
    }

    // -------------------------------------------------------------
    // POINTER & KEYBOARD EVENTS
    // -------------------------------------------------------------
    function attachPointerListeners(domElement) {
      domElement.addEventListener('pointerdown', (e) => {
        pointerDownPos.x = e.clientX;
        pointerDownPos.y = e.clientY;
        pointerDownTime = performance.now();
      });

      domElement.addEventListener('pointerup', (e) => {
        const dx = e.clientX - pointerDownPos.x;
        const dy = e.clientY - pointerDownPos.y;
        const dist = Math.hypot(dx, dy);
        const elapsed = performance.now() - pointerDownTime;

        if (dist < 5 && elapsed < 400 && params.randomizeOnClick) {
          randomizeScene();
        }
      });
    }

    function onKeyDown(e) {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
      if (e.key === 'h' || e.key === 'H') {
        if (gui) {
          gui._hidden ? gui.show() : gui.hide();
        }
      } else if (e.key === 'f' || e.key === 'F') {
        params.showFloor = !params.showFloor;
        if (floorMesh) floorMesh.visible = params.showFloor && !params.greenscreen;
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      if (postProcessor) {
        postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);
      }
    }

    // LIL-GUI SETUP

            if (!postProcessor.settings.hasOwnProperty(c.property)) c.updateDisplay();

      fThemes.add(params, 'greenscreen')
        .name('Greenscreen (#00ff00)')
        .onChange(applyGreenscreen);

      fThemes.addColor(params, 'backgroundColor')
        .name('Studio Background')
        .onChange(v => {
          if (!params.greenscreen) scene.background = new THREE.Color(v);
        });

      fThemes.add(params, 'showFloor')
        .name('Floor / Plane')

        .onChange(v => {
          if (floorMesh) floorMesh.visible = v && !params.greenscreen;

        .onChange(v => {

        .name('Bevel & Chrome Style')

      fTypo.add(params, 'autoMatchTheme')

      const fCustom = fTypo.addFolder('Custom Text Input');

        gui.controllersRecursive().forEach(c => c.property === 'textPreset' && c.updateDisplay());
      });
      fCustom.add(params, 'customLine2').name('Line 2').listen().onFinishChange(() => {
        params.textPreset = 'Custom';
        createTypography();
        gui.controllersRecursive().forEach(c => c.property === 'textPreset' && c.updateDisplay());
      });
      fCustom.add(params, 'customLine3').name('Line 3').listen().onFinishChange(() => {

        createTypography();
        gui.controllersRecursive().forEach(c => c.property === 'textPreset' && c.updateDisplay());
