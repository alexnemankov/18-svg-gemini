<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Core Sample Scan</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
        }

        canvas:active {
            cursor: grabbing;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-family: monospace;
            font-size: 12px;
            pointer-events: none;
        }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
                "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
            }
        }
    </script>
</head>
<body>
    <div id="loading">Scanning Core Strata...</div>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
        import GUI from 'lil-gui';

        const COLOR_SCHEMES = {
            "Monochromatic (Sandstone Strata)": {
                color1: "#ffd27d",
                color2: "#e89f4c",
                color3: "#b86828",
                color4: "#6e3914",
                bgColor: "#180c04"
            },
            "Analogous (Magma Ochre)": {
                color1: "#ffb703",
                color2: "#fb8500",
                color3: "#d90429",
                color4: "#7a0818",
                bgColor: "#1a0307"
            },
            "Complementary (Lapis & Amber)": {
                color1: "#00e5ff",
                color2: "#ff9100",
                color3: "#0077b6",
                color4: "#d05b00",
                bgColor: "#030c14"
            },
            "Split-Complementary (Cobalt & Coral)": {
                color1: "#3a86ff",
                color2: "#ff006e",
                color3: "#ffbe0b",
                color4: "#8338ec",
                bgColor: "#09081a"
            },
            "Triadic (Mineral Spectrum)": {
                color1: "#ff5964",
                color2: "#35a7ff",
                color3: "#ffe74c",
                color4: "#2ec4b6",
                bgColor: "#080d1a"
            },
            "Tetradic (Polymetallic Core)": {
                color1: "#00f5d4",
                color2: "#7b2cbf",
                color3: "#fee440",
                color4: "#f72585",
                bgColor: "#0b0618"
            },
            "Double Split-Complementary (Deep Earth)": {
                color1: "#ff6b6b",
                color2: "#4ecdc4",
                color3: "#ffe66d",
                color4: "#9b5de5",
                bgColor: "#0e091c"
            },
            "Achromatic (Black & White X-Ray)": {
                color1: "#ffffff",
                color2: "#cccccc",
                color3: "#888888",
                color4: "#444444",
                bgColor: "#000000"
            },
            "Achromatic (White & Black Inverted)": {
                color1: "#000000",
                color2: "#333333",
                color3: "#777777",
                color4: "#bbbbbb",
                bgColor: "#ffffff"
            },
            "Neutral + Accent (Basalt & Gold Vein)": {
                color1: "#ffb700",
                color2: "#ff8800",
                color3: "#78716c",
                color4: "#44403c",
                bgColor: "#0c0a09"
            },
            "Amber & Magma Strata": {
                color1: "#F6AA1C",
                color2: "#BC3908",
                color3: "#941B0C",
                color4: "#F6AA1C",
                bgColor: "#220901"
            },
            "Malachite & Cyan Core": {
                color1: "#63D1CF",
                color2: "#5BC0BE",
                color3: "#4BAD9E",
                color4: "#4BAD9E",
                bgColor: "#0B132B"
            },
            "Amethyst & Quartz Scan": {
                color1: "#AA60C8",
                color2: "#D69ADE",
                color3: "#C9A3C6",
                color4: "#CFB5C2",
                bgColor: "#0D001D"
            },
            "Pyrite & Calcite Gold": {
                color1: "#FEF1BE",
                color2: "#FFBA00",
                color3: "#008189",
                color4: "#00474D",
                bgColor: "#061210"
            },
            "Emerald & Uranium Sediments": {
                color1: "#D4FFB0",
                color2: "#7FFF00",
                color3: "#00B894",
                color4: "#0A3322",
                bgColor: "#05140A"
            },
            "Copper & Kimberlite": {
                color1: "#FFE8CC",
                color2: "#FF8C00",
                color3: "#C7501A",
                color4: "#3D1050",
                bgColor: "#0E0618"
            },
            "Fluorite & Lazurite": {
                color1: "#E8E0FF",
                color2: "#B38FFF",
                color3: "#6A3DE8",
                color4: "#1A1250",
                bgColor: "#090612"
            },
            "Spectral Tomography": {
                color1: "#E0FBFF",
                color2: "#00F0FF",
                color3: "#D40078",
                color4: "#1E0A3D",
                bgColor: "#05020F"
            }
        };

        const ANIMATIONS = [
            'Static Analysis',
            'Borehole Descent',
            'Axial Core Rotation',
            'CT Tomography Orbit',
            'Strata Micro-Drift',
            'Mineral Vein Zoom & Scan',
            'Seismic Wave Float',
            'Deep Exploration Sweep'
        ];

        const defaultScheme = "Neutral + Accent (Basalt & Gold Vein)";
        const initialColors = COLOR_SCHEMES[defaultScheme];

        const SETTINGS = {
            colorScheme: defaultScheme,
            animation: 'Static Analysis',
            clickRandomize: true,
            curveSoftness: 6.8,
            curveWidth: 0.45,
            curveDepth: 1.15,
            height: 1.35,
            fov: 105.0,
            lineDensity: 1.25,
            veinWarp: 1.2,
            veinFreq: 1.8,
            particleSize: 12.0,
            speed: 3.8,
            bloomStrength: 0.35,
            bloomRadius: 1.1,
            chromaticAberration: 0.008,
            edgeBlurStrength: 0.012,
            cameraY: 0.0,
            cameraSpinSpeed: 0.0,
            wallTilt: 0.0,
            dpr: Math.min(window.devicePixelRatio || 1.0, 2.0),
            objectX: 0.0,
            objectY: 0.0,
            zoom: 1.0,
            greenScreen: false,
            greenScreenColor: '#00ff00',
            color1: initialColors.color1,
            color2: initialColors.color2,
            color3: initialColors.color3,
            color4: initialColors.color4,
            bgColor: initialColors.bgColor
        };

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(SETTINGS.bgColor, 0.0025);
        scene.background = new THREE.Color(SETTINGS.bgColor);

        const camera = new THREE.PerspectiveCamera(SETTINGS.fov, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, SETTINGS.cameraY, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(SETTINGS.dpr);
        document.body.appendChild(renderer.domElement);

        document.getElementById('loading').style.display = 'none';

        // Generate Geological Core Sample CT Telemetry Data Texture
        const canvasTexture = document.createElement('canvas');
        canvasTexture.width = 1024;
        canvasTexture.height = 1024;
        const ctx = canvasTexture.getContext('2d');

        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, 1024, 1024);

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.18)';
        ctx.lineWidth = 1;

        // Depth scale ticks and calibration lines
        for (let y = 0; y < 1024; y += 16) {
            ctx.beginPath();
            const isMajor = (y % 64 === 0);
            const tickWidth = isMajor ? 60 : 25;
            ctx.moveTo(0, y);
            ctx.lineTo(tickWidth, y);
            ctx.moveTo(1024 - tickWidth, y);
            ctx.lineTo(1024, y);
            ctx.stroke();

            if (isMajor) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                ctx.font = 'bold 13px monospace';
                ctx.textAlign = 'left';
                ctx.fillText(`+${(120.0 + (y / 1024) * 8.0).toFixed(2)}m`, 70, y + 4);

                ctx.textAlign = 'right';
                ctx.fillText(`CT:${1850 + Math.floor((y / 1024) * 1200)}HU`, 1024 - 70, y + 4);
            }
        }

        // Subterranean telemetry readouts and geological annotations
        const telemetryLines = [
            'CORE ID: #292-SEDIMENT',
            'FACIES: CALCAREOUS SHALE',
            'MINERAL: QUARTZ / PYRITE VEIN',
            'DENSITY: 2.68 g/cm³',
            'POROSITY: 11.4%',
            'GAMMA API: 92.5',
            'ACOUSTIC DT: 68.2 µs/ft',
            'CALIPER: 101.6mm',
            'RESISTIVITY: 240 Ω·m',
            'XRF: Fe 18.4% / Si 62.1%',
            'DRILL DEPTH: 128.45m',
            'EXPLORATION TARGET: STRATA-B'
        ];

        ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
        ctx.font = '12px monospace';
        ctx.textAlign = 'center';

        const colStep = 256;
        const rowStep = 48;
        let lineIdx = 0;
        for (let x = 128; x < 1024; x += colStep) {
            for (let y = 32; y < 1024; y += rowStep) {
                if (Math.random() > 0.35) {
                    const text = telemetryLines[lineIdx % telemetryLines.length];
                    ctx.fillText(text, x, y);
                    lineIdx++;
                }
            }
        }

        // Concentric core reticles and crosshair targets
        for (let i = 0; i < 6; i++) {
            const rx = 180 + (i % 3) * 320;
            const ry = 220 + Math.floor(i / 3) * 500;
            ctx.beginPath();
            ctx.arc(rx, ry, 28, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(rx - 36, ry);
            ctx.lineTo(rx + 36, ry);
            ctx.moveTo(rx, ry - 36);
            ctx.lineTo(rx, ry + 36);
            ctx.stroke();
        }

        const dataTexture = new THREE.CanvasTexture(canvasTexture);
        dataTexture.wrapS = THREE.RepeatWrapping;
        dataTexture.wrapT = THREE.RepeatWrapping;
        dataTexture.minFilter = THREE.LinearMipmapLinearFilter;
        dataTexture.magFilter = THREE.LinearFilter;
        dataTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();

        const tunnelGroup = new THREE.Group();
        scene.add(tunnelGroup);

        const wallVertexShader = `
            varying vec2 vUv;
            varying vec3 vPosition;
            uniform float uCurveSoftness;

            void main() {
                vUv = uv;
                vec3 pos = position;

                float angle = atan(pos.z, pos.x);
                float normX = cos(angle);
                float n = uCurveSoftness;

                float absZ = pow(max(0.00001, 1.0 - pow(abs(normX), n)), 1.0 / n) * 100.0;
                pos.z = sign(sin(angle)) * absZ;

                vPosition = pos;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
            }
        `;

        const wallFragmentShader = `
            varying vec2 vUv;
            varying vec3 vPosition;

            uniform float uTime;
            uniform float uSpeed;
            uniform float uLineDensity;
            uniform float uVeinWarp;
            uniform float uVeinFreq;
            uniform vec3 uColor1;
            uniform vec3 uColor2;
            uniform vec3 uColor3;
            uniform vec3 uColor4;
            uniform vec3 uBgColor;
            uniform sampler2D uDataTexture;

            float hash(vec2 p) {
                p = fract(p * vec2(123.34, 456.21));
                p += dot(p, p + 45.32);
                return fract(p.x * p.y);
            }

            float noise(vec2 p) {
                vec2 i = floor(p);
                vec2 f = fract(p);
                vec2 u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
                
                float a = hash(i);
                float b = hash(i + vec2(1.0, 0.0));
                float c = hash(i + vec2(0.0, 1.0));
                float d = hash(i + vec2(1.0, 1.0));
                
                return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
            }

            float fbm(vec2 p) {
                float v = 0.0;
                float a = 0.5;
                mat2 rot = mat2(0.80, 0.60, -0.60, 0.80);
                for (int i = 0; i < 4; i++) {
                    v += a * noise(p);
                    p = rot * p * 2.02 + vec2(1.37, 2.75);
                    a *= 0.5;
                }
                return v;
            }

            vec2 domainWarp(vec2 p, float t) {
                vec2 q = vec2(
                    fbm(p + vec2(0.0, t * 0.03)),
                    fbm(p + vec2(5.2, 1.3 - t * 0.02))
                );
                vec2 r = vec2(
                    fbm(p + 3.2 * q + vec2(1.7, 9.2) + vec2(t * 0.015, 0.0)),
                    fbm(p + 3.2 * q + vec2(8.3, 2.8) - vec2(0.0, t * 0.02))
                );
                return p + (uVeinWarp * 1.2) * r;
            }

            vec3 evaluateLUT(float density, vec3 c1, vec3 c2, vec3 c3, vec3 c4, vec3 bg) {
                density = clamp(density, 0.0, 1.0);
                if (density < 0.22) {
                    float t = smoothstep(0.0, 0.22, density);
                    return mix(bg, c4, t);
                } else if (density < 0.48) {
                    float t = smoothstep(0.22, 0.48, density);
                    return mix(c4, c3, t);
                } else if (density < 0.74) {
                    float t = smoothstep(0.48, 0.74, density);
                    return mix(c3, c2, t);
                } else {
                    float t = smoothstep(0.74, 1.0, density);
                    return mix(c2, c1, t);
                }
            }

            vec3 getCoreScan(vec3 pos, float isReflection) {
                float angle = atan(pos.z, pos.x);
                float normAngle = (angle + 3.14159265) / 6.2831853;

                float scanY = pos.y * 0.05 * uLineDensity;
                vec2 baseCoord = vec2(normAngle * 3.5, scanY);

                float driftTime = uTime * uSpeed * 0.018;
                vec2 warpedCoord = domainWarp(baseCoord + vec2(0.0, driftTime * 0.2), driftTime);

                float strataFbm = fbm(warpedCoord * uVeinFreq);
                float beddingWave = sin(warpedCoord.y * 16.0 + strataFbm * 6.0) * 0.5 + 0.5;
                float density = mix(strataFbm, beddingWave, 0.45);

                float veinNoise1 = fbm(warpedCoord * 5.5 + vec2(warpedCoord.y * 1.2, -warpedCoord.x * 0.6));
                float veinRidge1 = 1.0 - abs(sin(veinNoise1 * 3.14159265));
                veinRidge1 = pow(veinRidge1, 6.0);

                float veinNoise2 = fbm(warpedCoord * 8.5 + vec2(4.1, -3.2 + driftTime * 0.05));
                float veinRidge2 = 1.0 - abs(sin(veinNoise2 * 3.14159265));
                veinRidge2 = pow(veinRidge2, 8.0);

                float microLaminae = sin(warpedCoord.y * 60.0 + fbm(warpedCoord * 10.0) * 3.5) * 0.5 + 0.5;
                float microGrain = noise(vec2(normAngle * 180.0, pos.y * 1.8));

                vec2 telemetryUv = vec2(normAngle * 16.0, pos.y * 0.04);
                float telemetryMask = texture2D(uDataTexture, telemetryUv).r;

                float totalDensity = density * 0.58 
                                   + microLaminae * 0.12 
                                   + (veinRidge1 * 0.32 + veinRidge2 * 0.22) 
                                   + (microGrain - 0.5) * 0.06
                                   + telemetryMask * 0.14;
                totalDensity = clamp(totalDensity, 0.0, 1.0);

                vec3 color = evaluateLUT(totalDensity, uColor1, uColor2, uColor3, uColor4, uBgColor);

                float veinGlow = pow(veinRidge1, 3.0) * 0.35 + pow(veinRidge2, 4.0) * 0.3;
                color = clamp(color + uColor1 * veinGlow, 0.0, 1.0);

                if (isReflection == 1.0) {
                    float fade = smoothstep(-35.0, -12.0, pos.y);
                    color = mix(uBgColor, color * 0.45, fade);
                } else {
                    float topFade = smoothstep(40.0, 20.0, pos.y);
                    color = mix(uBgColor, color, topFade);
                }

                return color;
            }

            void main() {
                vec3 color = uBgColor;
                float floorLevel = -12.0;

                if (vPosition.y > floorLevel) {
                    color = getCoreScan(vPosition, 0.0);
                } else {
                    vec3 reflectedPos = vPosition;
                    reflectedPos.y = floorLevel + (floorLevel - vPosition.y);
                    color = getCoreScan(reflectedPos, 1.0);
                    color += uColor4 * 0.03;
                }

                float horizonGlow = smoothstep(1.0, 0.0, abs(vPosition.y - floorLevel));
                color = clamp(color + uColor1 * horizonGlow * 0.25, 0.0, 1.0);

                gl_FragColor = vec4(color, 1.0);
            }
        `;

        const uniforms = {
            uTime: { value: 0.0 },
            uSpeed: { value: SETTINGS.speed },
            uLineDensity: { value: SETTINGS.lineDensity },
            uVeinWarp: { value: SETTINGS.veinWarp },
            uVeinFreq: { value: SETTINGS.veinFreq },
            uCurveSoftness: { value: SETTINGS.curveSoftness },
            uColor1: { value: new THREE.Color(SETTINGS.color1) },
            uColor2: { value: new THREE.Color(SETTINGS.color2) },
            uColor3: { value: new THREE.Color(SETTINGS.color3) },
            uColor4: { value: new THREE.Color(SETTINGS.color4) },
            uBgColor: { value: new THREE.Color(SETTINGS.bgColor) },
            uDataTexture: { value: dataTexture }
        };

        const material = new THREE.ShaderMaterial({
            vertexShader: wallVertexShader,
            fragmentShader: wallFragmentShader,
            uniforms,
            side: THREE.BackSide,
            transparent: false
        });

        const geometry = new THREE.CylinderGeometry(100, 100, 80, 128, 1, true);
        const wall = new THREE.Mesh(geometry, material);
        tunnelGroup.add(wall);

        // Subterranean crystal & mineral dust micro-particles
        const particleCount = 2200;
        const particleGeometry = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        const particleSpeeds = new Float32Array(particleCount);
        const particleScales = new Float32Array(particleCount);

        for (let i = 0; i < particleCount; i++) {
            const angle = Math.random() * Math.PI * 2;
            const radius = 98.2 + Math.random() * 1.6;
            const y = -11.0 + Math.random() * 48.0;

            particlePositions[i * 3] = Math.cos(angle) * radius;
            particlePositions[i * 3 + 1] = y;
            particlePositions[i * 3 + 2] = Math.sin(angle) * radius;
            particleSpeeds[i] = 0.4 + Math.random() * 1.8;
            particleScales[i] = 0.6 + Math.random() * 1.4;
        }

        particleGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        particleGeometry.setAttribute('aSpeed', new THREE.BufferAttribute(particleSpeeds, 1));
        particleGeometry.setAttribute('aScale', new THREE.BufferAttribute(particleScales, 1));

        const particleUniforms = {
            uTime: { value: 0 },
            uSpeed: { value: SETTINGS.speed },
            uCurveSoftness: { value: SETTINGS.curveSoftness },
            uParticleSize: { value: SETTINGS.particleSize },
            uColor1: { value: new THREE.Color(SETTINGS.color1) },
            uColor2: { value: new THREE.Color(SETTINGS.color2) }
        };

        const particleMaterial = new THREE.ShaderMaterial({
            uniforms: particleUniforms,
            vertexShader: `
                uniform float uTime;
                uniform float uSpeed;
                uniform float uCurveSoftness;
                uniform float uParticleSize;
                attribute float aSpeed;
                attribute float aScale;
                varying float vAlpha;
                varying float vColorMix;

                void main() {
                    vec3 pos = position;

                    float angle = atan(pos.z, pos.x);
                    float radius = length(pos.xz);
                    float currentAngle = angle - uTime * uSpeed * 0.012 * aSpeed;

                    float normX = cos(currentAngle);
                    float n = uCurveSoftness;
                    float absZ = pow(max(0.00001, 1.0 - pow(abs(normX), n)), 1.0 / n) * radius;

                    pos.x = cos(currentAngle) * radius;
                    pos.z = sign(sin(currentAngle)) * absZ;

                    vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                    gl_PointSize = (12.0 * uParticleSize * aScale / -mvPosition.z);
                    gl_Position = projectionMatrix * mvPosition;

                    vAlpha = smoothstep(38.0, 25.0, pos.y) * smoothstep(-12.0, -6.0, pos.y);
                    vColorMix = fract(aSpeed * 7.7);
                }
            `,
            fragmentShader: `
                uniform vec3 uColor1;
                uniform vec3 uColor2;
                varying float vAlpha;
                varying float vColorMix;

                void main() {
                    vec2 xy = gl_PointCoord.xy - vec2(0.5);
                    float ll = length(xy);
                    if (ll > 0.5) discard;

                    float glow = 1.0 - (ll * 2.0);
                    glow = pow(glow, 1.4);
                    vec3 pColor = mix(uColor1, uColor2, vColorMix);

                    gl_FragColor = vec4(pColor, vAlpha * glow * 0.85);
                }
            `,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const particles = new THREE.Points(particleGeometry, particleMaterial);
        tunnelGroup.add(particles);

        tunnelGroup.scale.set(SETTINGS.curveWidth, SETTINGS.height, SETTINGS.curveDepth);
        tunnelGroup.rotation.z = SETTINGS.wallTilt * Math.PI / 180;
        tunnelGroup.position.set(SETTINGS.objectX, SETTINGS.objectY, 0);

        const composer = new EffectComposer(renderer);
        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);

        const PeripheralBlurShader = {
            uniforms: {
                tDiffuse: { value: null },
                uStrength: { value: SETTINGS.edgeBlurStrength },
                uAspect: { value: window.innerWidth / window.innerHeight }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D tDiffuse;
                uniform float uStrength;
                uniform float uAspect;
                varying vec2 vUv;

                void main() {
                    vec2 center = vec2(0.5, 0.5);
                    vec2 uvCorrection = vec2(uAspect, 1.0);
                    float dist = length((vUv - center) * uvCorrection);

                    float blurMask = smoothstep(0.15, 0.7, dist);

                    if (blurMask <= 0.0) {
                        gl_FragColor = texture2D(tDiffuse, vUv);
                        return;
                    }

                    const int SAMPLES = 32;
                    const float GOLDEN_ANGLE = 2.39996323;
                    vec4 color = vec4(0.0);
                    float radius = uStrength * blurMask;

                    for (int i = 0; i < SAMPLES; i++) {
                        float r = sqrt(float(i) + 0.5) / sqrt(float(SAMPLES));
                        float theta = float(i) * GOLDEN_ANGLE;
                        vec2 offset = vec2(cos(theta), sin(theta)) * r * radius;
                        offset.x /= uAspect;
                        color += texture2D(tDiffuse, vUv + offset);
                    }
                    gl_FragColor = color / float(SAMPLES);
                }
            `
        };
        const peripheralBlurPass = new ShaderPass(PeripheralBlurShader);
        composer.addPass(peripheralBlurPass);

        const ChromaticAberrationShader = {
            uniforms: {
                tDiffuse: { value: null },
                uAmount: { value: SETTINGS.chromaticAberration }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D tDiffuse;
                uniform float uAmount;
                varying vec2 vUv;

                void main() {
                    vec2 offset = uAmount * (vec2(0.5) - vUv);
                    vec4 cr = texture2D(tDiffuse, vUv + offset);
                    vec4 cga = texture2D(tDiffuse, vUv);
                    vec4 cb = texture2D(tDiffuse, vUv - offset);
                    gl_FragColor = vec4(cr.r, cga.g, cb.b, cga.a);
                }
            `
        };
        const caPass = new ShaderPass(ChromaticAberrationShader);
        composer.addPass(caPass);

        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            SETTINGS.bloomStrength,
            SETTINGS.bloomRadius,
            0.08
        );
        composer.addPass(bloomPass);

        const updateBackground = () => {
            const activeBg = SETTINGS.greenScreen ? SETTINGS.greenScreenColor : SETTINGS.bgColor;
            uniforms.uBgColor.value.set(activeBg);
            scene.background.set(activeBg);
            scene.fog.color.set(activeBg);
            document.body.style.backgroundColor = activeBg;
        };

        const updateColors = () => {
            uniforms.uColor1.value.set(SETTINGS.color1);
            uniforms.uColor2.value.set(SETTINGS.color2);
            uniforms.uColor3.value.set(SETTINGS.color3);
            uniforms.uColor4.value.set(SETTINGS.color4);
            particleUniforms.uColor1.value.set(SETTINGS.color1);
            particleUniforms.uColor2.value.set(SETTINGS.color2);
            updateBackground();
        };

        const updateObjectTransform = () => {
            tunnelGroup.position.x = SETTINGS.objectX;
            tunnelGroup.position.y = SETTINGS.objectY;
            tunnelGroup.scale.set(
                SETTINGS.curveWidth * SETTINGS.zoom,
                SETTINGS.height * SETTINGS.zoom,
                SETTINGS.curveDepth * SETTINGS.zoom
            );
            tunnelGroup.rotation.z = SETTINGS.wallTilt * Math.PI / 180;
        };

        const applyColorScheme = (name) => {
            const scheme = COLOR_SCHEMES[name];
            if (scheme) {
                SETTINGS.color1 = scheme.color1;
                SETTINGS.color2 = scheme.color2;
                SETTINGS.color3 = scheme.color3;
                SETTINGS.color4 = scheme.color4;
                SETTINGS.bgColor = scheme.bgColor;
                updateColors();
                gui.controllersRecursive().forEach(c => c.updateDisplay());
            }
        };

        // Procedural scene variation randomization
        const randomizeScene = () => {
            const schemeKeys = Object.keys(COLOR_SCHEMES);
            const randomSchemeName = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
            SETTINGS.colorScheme = randomSchemeName;
            const scheme = COLOR_SCHEMES[randomSchemeName];
            SETTINGS.color1 = scheme.color1;
            SETTINGS.color2 = scheme.color2;
            SETTINGS.color3 = scheme.color3;
            SETTINGS.color4 = scheme.color4;
            SETTINGS.bgColor = scheme.bgColor;

            SETTINGS.curveSoftness = +(THREE.MathUtils.randFloat(2.5, 9.0).toFixed(2));
            SETTINGS.curveWidth = +(THREE.MathUtils.randFloat(0.28, 0.95).toFixed(2));
            SETTINGS.curveDepth = +(THREE.MathUtils.randFloat(0.7, 1.8).toFixed(2));
            SETTINGS.height = +(THREE.MathUtils.randFloat(0.8, 2.0).toFixed(2));
            SETTINGS.wallTilt = +(THREE.MathUtils.randFloat(-30.0, 30.0).toFixed(1));
            SETTINGS.lineDensity = +(THREE.MathUtils.randFloat(0.6, 2.4).toFixed(2));
            SETTINGS.veinWarp = +(THREE.MathUtils.randFloat(0.5, 2.2).toFixed(2));
            SETTINGS.veinFreq = +(THREE.MathUtils.randFloat(0.8, 3.2).toFixed(2));
            SETTINGS.speed = +(THREE.MathUtils.randFloat(1.5, 6.5).toFixed(1));
            SETTINGS.bloomStrength = +(THREE.MathUtils.randFloat(0.15, 0.65).toFixed(2));
            SETTINGS.bloomRadius = +(THREE.MathUtils.randFloat(0.6, 1.6).toFixed(2));
            SETTINGS.chromaticAberration = +(THREE.MathUtils.randFloat(0.003, 0.02).toFixed(4));
            SETTINGS.edgeBlurStrength = +(THREE.MathUtils.randFloat(0.005, 0.025).toFixed(4));
            SETTINGS.particleSize = +(THREE.MathUtils.randFloat(6.0, 18.0).toFixed(1));

            const randomAnim = ANIMATIONS[Math.floor(Math.random() * ANIMATIONS.length)];
            SETTINGS.animation = randomAnim;

            uniforms.uCurveSoftness.value = SETTINGS.curveSoftness;
            uniforms.uLineDensity.value = SETTINGS.lineDensity;
            uniforms.uVeinWarp.value = SETTINGS.veinWarp;
            uniforms.uVeinFreq.value = SETTINGS.veinFreq;
            uniforms.uSpeed.value = SETTINGS.speed;

            particleUniforms.uCurveSoftness.value = SETTINGS.curveSoftness;
            particleUniforms.uParticleSize.value = SETTINGS.particleSize;
            particleUniforms.uSpeed.value = SETTINGS.speed;

            bloomPass.strength = SETTINGS.bloomStrength;
            bloomPass.radius = SETTINGS.bloomRadius;
            caPass.uniforms.uAmount.value = SETTINGS.chromaticAberration;
            peripheralBlurPass.uniforms.uStrength.value = SETTINGS.edgeBlurStrength;

            updateColors();
            updateObjectTransform();
            gui.controllersRecursive().forEach(c => c.updateDisplay());
        };

        // GUI Setup
        const gui = new GUI({ title: 'Core Sample Scan' });

        const fPresets = gui.addFolder('Presets & Animation');
        fPresets.add(SETTINGS, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Color Scheme').onChange(applyColorScheme);
        fPresets.add(SETTINGS, 'animation', ANIMATIONS).name('Camera Animation');
        fPresets.add(SETTINGS, 'clickRandomize').name('Click Scene to Re-roll');
        fPresets.add({ randomize: randomizeScene }, 'randomize').name('⚡ Randomize Variation');

        const fStrata = gui.addFolder('Strata & Mineral Veins');
        fStrata.add(SETTINGS, 'lineDensity', 0.1, 5.0, 0.05).name('Strata Density').onChange(v => uniforms.uLineDensity.value = v);
        fStrata.add(SETTINGS, 'veinWarp', 0.1, 3.5, 0.05).name('Domain Warp').onChange(v => uniforms.uVeinWarp.value = v);
        fStrata.add(SETTINGS, 'veinFreq', 0.2, 5.0, 0.05).name('Vein Frequency').onChange(v => uniforms.uVeinFreq.value = v);
        fStrata.add(SETTINGS, 'particleSize', 1.0, 30.0, 0.5).name('Crystal Particles').onChange(v => particleUniforms.uParticleSize.value = v);

        const fGeometry = gui.addFolder('Shape & Geometry');
        fGeometry.add(SETTINGS, 'curveSoftness', 1.0, 10.0, 0.1).name('Cylinder Softness').onChange(v => {
            uniforms.uCurveSoftness.value = v;
            particleUniforms.uCurveSoftness.value = v;
        });
        fGeometry.add(SETTINGS, 'curveWidth', 0.1, 5.0, 0.01).name('Core Width').onChange(updateObjectTransform);
        fGeometry.add(SETTINGS, 'curveDepth', 0.1, 5.0, 0.01).name('Core Depth').onChange(updateObjectTransform);
        fGeometry.add(SETTINGS, 'height', 0.1, 4.0, 0.01).name('Core Height').onChange(updateObjectTransform);
        fGeometry.add(SETTINGS, 'wallTilt', -180, 180, 1).name('Core Tilt (deg)').onChange(updateObjectTransform);
        fGeometry.add(SETTINGS, 'zoom', 0.15, 5.0, 0.01).name('Object Zoom').onChange(updateObjectTransform);
        fGeometry.add(SETTINGS, 'objectX', -100.0, 100.0, 0.5).name('Object X').onChange(updateObjectTransform);
        fGeometry.add(SETTINGS, 'objectY', -60.0, 60.0, 0.5).name('Object Y').onChange(updateObjectTransform);
        fGeometry.add(SETTINGS, 'fov', 30, 140, 1).name('Camera FOV').onChange(v => {
            camera.fov = v;
            camera.updateProjectionMatrix();
        });

        const fMotion = gui.addFolder('Motion & Flow');
        fMotion.add(SETTINGS, 'speed', 0, 12, 0.1).name('Animation Speed').onChange(v => {
            uniforms.uSpeed.value = v;
            particleUniforms.uSpeed.value = v;
        });
        fMotion.add(SETTINGS, 'cameraY', -15.0, 15.0, 0.1).name('Camera Base Y');
        fMotion.add(SETTINGS, 'cameraSpinSpeed', -2.0, 2.0, 0.05).name('Manual Pan Speed');

        const fPost = gui.addFolder('Post-Processing');
        fPost.add(SETTINGS, 'bloomStrength', 0, 4, 0.02).name('Bloom Strength').onChange(v => bloomPass.strength = v);
        fPost.add(SETTINGS, 'bloomRadius', 0, 2, 0.02).name('Bloom Radius').onChange(v => bloomPass.radius = v);
        fPost.add(SETTINGS, 'chromaticAberration', 0, 0.05, 0.001).name('RGB Shift').onChange(v => caPass.uniforms.uAmount.value = v);
        fPost.add(SETTINGS, 'edgeBlurStrength', 0, 0.05, 0.001).name('Lens Edge Blur').onChange(v => peripheralBlurPass.uniforms.uStrength.value = v);
        fPost.add(SETTINGS, 'dpr', 0.25, 3.0, 0.1).name('DPR (Pixel Ratio)').onChange(v => {
            renderer.setPixelRatio(v);
            composer.setPixelRatio(v);
        });

        const fColors = gui.addFolder('Density Gradient & Colors');
        fColors.addColor(SETTINGS, 'color1').name('Vein Highlight (Top)').onChange(updateColors);
        fColors.addColor(SETTINGS, 'color2').name('Rich Ore (High-Mid)').onChange(updateColors);
        fColors.addColor(SETTINGS, 'color3').name('Primary Strata (Mid)').onChange(updateColors);
        fColors.addColor(SETTINGS, 'color4').name('Shale Matrix (Low)').onChange(updateColors);
        fColors.addColor(SETTINGS, 'bgColor').name('Bedrock / Void').onChange(updateColors);
        fColors.add(SETTINGS, 'greenScreen').name('Green Screen').onChange(updateBackground);
        fColors.addColor(SETTINGS, 'greenScreenColor').name('Green Screen Color').onChange(updateBackground);

        gui.close();

        // Keyboard toggle for UI with "H" key
        let guiVisible = true;
        window.addEventListener('keydown', (e) => {
            if (e.key === 'h' || e.key === 'H') {
                guiVisible = !guiVisible;
                gui.show(guiVisible);
            }
        });

        // Wheel Zoom & Pointer Drag Interaction + Click Randomization
        const dragState = {
            active: false,
            pointerId: null,
            startX: 0,
            startY: 0,
            downX: 0,
            downY: 0,
            downTime: 0,
            objectX: 0,
            objectY: 0
        };

        renderer.domElement.addEventListener('wheel', event => {
            event.preventDefault();
            const zoomFactor = event.deltaY > 0 ? 0.92 : 1.08;
            SETTINGS.zoom = THREE.MathUtils.clamp(SETTINGS.zoom * zoomFactor, 0.15, 5.0);
            updateObjectTransform();
            gui.controllersRecursive().find(controller => controller.property === 'zoom')?.updateDisplay();
        }, { passive: false });

        renderer.domElement.addEventListener('pointerdown', event => {
            if (event.button !== 0) return;
            dragState.active = true;
            dragState.pointerId = event.pointerId;
            dragState.startX = event.clientX;
            dragState.startY = event.clientY;
            dragState.downX = event.clientX;
            dragState.downY = event.clientY;
            dragState.downTime = performance.now();
            dragState.objectX = SETTINGS.objectX;
            dragState.objectY = SETTINGS.objectY;
            renderer.domElement.setPointerCapture(event.pointerId);
        });

        renderer.domElement.addEventListener('pointermove', event => {
            if (!dragState.active || event.pointerId !== dragState.pointerId) return;
            const worldUnitsPerPixel = 0.12 / SETTINGS.zoom;
            SETTINGS.objectX = dragState.objectX + (event.clientX - dragState.startX) * worldUnitsPerPixel;
            SETTINGS.objectY = dragState.objectY - (event.clientY - dragState.startY) * worldUnitsPerPixel;
            updateObjectTransform();
        });

        const endDrag = event => {
            if (!dragState.active || event.pointerId !== dragState.pointerId) return;
            const dragDist = Math.hypot(event.clientX - dragState.downX, event.clientY - dragState.downY);
            const dragTime = performance.now() - dragState.downTime;

            dragState.active = false;
            dragState.pointerId = null;
            renderer.domElement.releasePointerCapture(event.pointerId);

            gui.controllersRecursive().forEach(controller => {
                if (controller.property === 'objectX' || controller.property === 'objectY') {
                    controller.updateDisplay();
                }
            });

            // Instant procedural variation on scene click
            if (dragDist < 6 && dragTime < 350 && SETTINGS.clickRandomize) {
                randomizeScene();
            }
        };

        renderer.domElement.addEventListener('pointerup', endDrag);
        renderer.domElement.addEventListener('pointercancel', endDrag);

        // Preconfigured Camera Animation Suite
        function applyCameraAnimation(t) {
            const anim = SETTINGS.animation;
            if (anim === 'Static Analysis') {
                camera.position.set(0.0, SETTINGS.cameraY, 0.0);
                camera.rotation.set(0.0, t * SETTINGS.cameraSpinSpeed, 0.0);
            } else if (anim === 'Borehole Descent') {
                camera.position.set(0.0, SETTINGS.cameraY + Math.sin(t * 0.25) * 8.0, 0.0);
                camera.rotation.set(Math.sin(t * 0.15) * 0.04, t * SETTINGS.cameraSpinSpeed + Math.sin(t * 0.1) * 0.15, 0.0);
            } else if (anim === 'Axial Core Rotation') {
                camera.position.set(0.0, SETTINGS.cameraY, 0.0);
                camera.rotation.set(0.0, t * 0.18 + t * SETTINGS.cameraSpinSpeed, 0.0);
            } else if (anim === 'CT Tomography Orbit') {
                camera.position.set(
                    Math.sin(t * 0.22) * 12.0,
                    SETTINGS.cameraY + Math.cos(t * 0.15) * 2.8,
                    (Math.cos(t * 0.22) - 1.0) * 8.0
                );
                camera.rotation.set(Math.sin(t * 0.2) * 0.03, t * 0.22 + t * SETTINGS.cameraSpinSpeed, 0.0);
            } else if (anim === 'Strata Micro-Drift') {
                camera.position.set(
                    Math.sin(t * 0.3) * 3.5,
                    SETTINGS.cameraY + Math.sin(t * 0.4) * 2.0,
                    Math.cos(t * 0.25) * 2.0
                );
                camera.rotation.set(
                    Math.cos(t * 0.2) * 0.03,
                    Math.sin(t * 0.15) * 0.25 + t * SETTINGS.cameraSpinSpeed,
                    Math.sin(t * 0.2) * 0.02
                );
            } else if (anim === 'Mineral Vein Zoom & Scan') {
                camera.position.set(
                    0.0,
                    SETTINGS.cameraY + Math.sin(t * 0.2) * 3.0,
                    Math.sin(t * 0.3) * 10.0
                );
                camera.rotation.set(
                    Math.sin(t * 0.25) * 0.05,
                    Math.sin(t * 0.18) * 0.3 + t * SETTINGS.cameraSpinSpeed,
                    0.0
                );
            } else if (anim === 'Seismic Wave Float') {
                camera.position.set(
                    Math.sin(t * 0.2) * 8.0,
                    SETTINGS.cameraY + Math.sin(t * 0.4) * 4.0,
                    Math.sin(t * 0.2) * Math.cos(t * 0.2) * 6.0
                );
                camera.rotation.set(
                    Math.sin(t * 0.25) * 0.03,
                    Math.sin(t * 0.2) * 0.35 + t * SETTINGS.cameraSpinSpeed,
                    Math.cos(t * 0.3) * 0.02
                );
            } else if (anim === 'Deep Exploration Sweep') {
                camera.position.set(
                    Math.sin(t * 0.15) * 14.0,
                    SETTINGS.cameraY + Math.cos(t * 0.12) * 6.0,
                    (Math.cos(t * 0.15) - 1.0) * 10.0
                );
                camera.rotation.set(
                    Math.sin(t * 0.1) * 0.04,
                    t * 0.1 + Math.sin(t * 0.15) * 0.25 + t * SETTINGS.cameraSpinSpeed,
                    0.0
                );
            }
        }

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const t = clock.getElapsedTime();

            uniforms.uTime.value = t;
            particleUniforms.uTime.value = t;

            applyCameraAnimation(t);

            composer.render();
        }

        updateBackground();
        updateColors();
        updateObjectTransform();
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
            peripheralBlurPass.uniforms.uAspect.value = window.innerWidth / window.innerHeight;
        });
    </script>
</body>
</html>
