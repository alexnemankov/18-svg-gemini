<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heart Bloom Animation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
      font-family: serif;
      overflow: hidden;
      position: relative;
      background-color: #000000;
      user-select: none;
    }

    canvas {
      display: block;
      height: 100%;
      width: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 0;
      background-color: #000000;
      cursor: grab;
    }
  </style>
</head>
<body>
  <script type="module">
    import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

    class Utils {
      static norm(value, min, max) {
        return (value - min) / (max - min);
      }

      static lerp(norm, min, max) {
        return (max - min) * norm + min;
      }

      static map(value, sourceMin, sourceMax, destMin, destMax) {
        return this.lerp(this.norm(value, sourceMin, sourceMax), destMin, destMax);
      }

      static clamp(value, min, max) {
        return Math.min(Math.max(value, min), max);
      }

      static distance(x0, y0, x1, y1) {
        const dx = x1 - x0;
        const dy = y1 - y0;
        return Math.sqrt(dx * dx + dy * dy);
      }

      static randomRange(min, max) {
        return min + Math.random() * (max - min);
      }

      static randomInt(min, max) {
        return Math.floor(min + Math.random() * (max - min + 1));
      }

      static degreesToRads(degrees) {
        return degrees / 180 * Math.PI;
      }

      static radsToDegrees(radians) {
        return radians * 180 / Math.PI;
      }
    }

    // Color conversion helpers
    function hexToRgb(hex) {
      let c = hex.replace('#', '');
      if (c.length === 3) c = c.split('').map(x => x + x).join('');
      return {
        r: parseInt(c.substring(0, 2), 16) || 0,
        g: parseInt(c.substring(2, 4), 16) || 0,
        b: parseInt(c.substring(4, 6), 16) || 0
      };
    }

    function lerpColor(hexA, hexB, t) {
      const a = hexToRgb(hexA);
      const b = hexToRgb(hexB);
      const r = Math.round(a.r + (b.r - a.r) * t);
      const g = Math.round(a.g + (b.g - a.g) * t);
      const bl = Math.round(a.b + (b.b - a.b) * t);
      return `rgb(${r}, ${g}, ${bl})`;
    }

    function hexToHsl(hex) {
      const rgb = hexToRgb(hex);
      const r = rgb.r / 255;
      const g = rgb.g / 255;
      const b = rgb.b / 255;
      const max = Math.max(r, g, b);
      const min = Math.min(r, g, b);
      let h = 0, s = 0;
      const l = (max + min) / 2;

      if (max !== min) {
        const d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        switch (max) {
          case r: h = (g - b) / d + (g < b ? 6 : 0); break;
          case g: h = (b - r) / d + 2; break;
          case b: h = (r - g) / d + 4; break;
        }
        h *= 60;
      }
      return { h: Math.round(h), s: Math.round(s * 100), l: Math.round(l * 100) };
    }

    function samplePalette(colors, ratio) {
      if (!colors || colors.length === 0) return '#ffffff';
      if (colors.length === 1) return colors[0];
      const scaled = ratio * (colors.length - 1);
      const idx = Math.floor(scaled);
      const frac = scaled - idx;
      const c1 = colors[idx];
      const c2 = colors[Math.min(idx + 1, colors.length - 1)];
      return lerpColor(c1, c2, frac);
    }

    // 19 Preconfigured Color Schemes
    const COLOR_SCHEMES = {
      'Original': { type: 'original' },
      'Monochromatic': { type: 'monochromatic' },
      'Analogous': { type: 'analogous' },
      'Complementary': { type: 'complementary' },
      'Split-complementary': { type: 'split-complementary' },
      'Triadic': { type: 'triadic' },
      'Tetradic': { type: 'tetradic' },
      'Double split-complementary': { type: 'double-split-complementary' },
      'Achromatic (B&W)': { type: 'achromatic' },
      'Achromatic + Accent (Red)': { type: 'achromatic-accent' },
      'Neutral + accent': { type: 'neutral-accent' },
      'Palette 1 (F6AA1C, BC3908, 941B0C, F6AA1C, 220901)': {
        type: 'palette',
        colors: ['#F6AA1C', '#BC3908', '#941B0C', '#F6AA1C', '#220901']
      },
      'Palette 2 (63D1CF, 5BC0BE, 4BAD9E, 4BAD9E, 0B132B, 000000)': {
        type: 'palette',
        colors: ['#63D1CF', '#5BC0BE', '#4BAD9E', '#4BAD9E', '#0B132B', '#000000']
      },
      'Palette 3 (AA60C8, D69ADE, C9A3C6, CFB5C2, 0D001D, 120A12)': {
        type: 'palette',
        colors: ['#AA60C8', '#D69ADE', '#C9A3C6', '#CFB5C2', '#0D001D', '#120A12']
      },
      'Palette 4 (FEF1BE, FFBA00, 008189, 00474D, 061210)': {
        type: 'palette',
        colors: ['#FEF1BE', '#FFBA00', '#008189', '#00474D', '#061210']
      },
      'Palette 5 (D4FFB0, 7FFF00, 00B894, 0A3322, 05140A)': {
        type: 'palette',
        colors: ['#D4FFB0', '#7FFF00', '#00B894', '#0A3322', '#05140A']
      },
      'Palette 6 (FFE8CC, FF8C00, C7501A, 3D1050, 0E0618)': {
        type: 'palette',
        colors: ['#FFE8CC', '#FF8C00', '#C7501A', '#3D1050', '#0E0618']
      },
      'Palette 7 (E8E0FF, B38FFF, 6A3DE8, 1A1250, 090612)': {
        type: 'palette',
        colors: ['#E8E0FF', '#B38FFF', '#6A3DE8', '#1A1250', '#090612']
      },
      'Palette 8 (E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)': {
        type: 'palette',
        colors: ['#E0FBFF', '#00F0FF', '#D40078', '#1E0A3D', '#05020F']
      }
    };

    function getColor(j, num, params) {
      const scheme = COLOR_SCHEMES[params.colorScheme] || COLOR_SCHEMES['Original'];
      const ratio = num > 1 ? j / (num - 1) : 0;
      const cyclicRatio = (j / num) % 1;
      const base = hexToHsl(params.baseColor || '#ff2a6d');

      switch (scheme.type) {
        case 'original':
          return `hsl(${360 * cyclicRatio}, 80%, 60%)`;

        case 'monochromatic': {
          const l = 30 + 55 * Math.sin(ratio * Math.PI);
          const s = Math.max(30, base.s);
          return `hsl(${base.h}, ${s}%, ${l}%)`;
        }

        case 'analogous': {
          const hue = (base.h + (ratio - 0.5) * 70 + 360) % 360;
          return `hsl(${hue}, ${Math.max(55, base.s)}%, ${Math.max(45, base.l)}%)`;
        }

        case 'complementary': {
          const compH = (base.h + 180) % 360;
          const hue = (j % 2 === 0) ? base.h : compH;
          const l = 45 + 30 * Math.sin(ratio * Math.PI);
          return `hsl(${hue}, ${Math.max(65, base.s)}%, ${l}%)`;
        }

        case 'split-complementary': {
          const hues = [base.h, (base.h + 150) % 360, (base.h + 210) % 360];
          const hue = hues[j % 3];
          const l = 45 + 30 * Math.sin(ratio * Math.PI);
          return `hsl(${hue}, ${Math.max(65, base.s)}%, ${l}%)`;
        }

        case 'triadic': {
          const hues = [base.h, (base.h + 120) % 360, (base.h + 240) % 360];
          const hue = hues[j % 3];
          const l = 45 + 30 * Math.sin(ratio * Math.PI);
          return `hsl(${hue}, ${Math.max(65, base.s)}%, ${l}%)`;
        }

        case 'tetradic': {
          const hues = [base.h, (base.h + 90) % 360, (base.h + 180) % 360, (base.h + 270) % 360];
          const hue = hues[j % 4];
          const l = 45 + 30 * Math.sin(ratio * Math.PI);
          return `hsl(${hue}, ${Math.max(65, base.s)}%, ${l}%)`;
        }

        case 'double-split-complementary': {
          const hues = [
            (base.h + 330) % 360,
            base.h,
            (base.h + 30) % 360,
            (base.h + 150) % 360,
            (base.h + 210) % 360
          ];
          const hue = hues[j % 5];
          const l = 45 + 30 * Math.sin(ratio * Math.PI);
          return `hsl(${hue}, ${Math.max(65, base.s)}%, ${l}%)`;
        }

        case 'achromatic': {
          const grays = ['#ffffff', '#e8e8e8', '#cccccc', '#999999', '#ffffff', '#777777'];
          return grays[j % grays.length];
        }

        case 'achromatic-accent': {
          if (j % 4 === 0) {
            return '#ff0033';
          }
          const grays = ['#ffffff', '#bbbbbb', '#ffffff', '#777777', '#dddddd'];
          return grays[j % grays.length];
        }

        case 'neutral-accent': {
          if (j % 4 === 0) {
            return params.accentColor || '#ff9f1c';
          }
          const neutrals = ['#ede8df', '#c8b8a6', '#8e8279', '#5c6b73', '#dcd5ca', '#393d3f'];
          return neutrals[j % neutrals.length];
        }

        case 'palette': {
          return samplePalette(scheme.colors, ratio);
        }

        default:
          return `hsl(${360 * cyclicRatio}, 80%, 60%)`;
      }
    }

    let gui, canvas, c, width, height, animId, shapes;

    const params = {
      // Color & Theme
      colorScheme: 'Original',
      baseColor: '#ff2a6d',
      accentColor: '#ff9f1c',
      greenscreen: false,
      bgColor: '#000000',
      blendMode: 'lighter',

      // View & Transform
      zoom: 1.0,
      panX: 0,
      panY: 0,
      resetView: () => {
        params.zoom = 1.0;
        params.panX = 0;
        params.panY = 0;
        updateAllControllers(gui);
      },

      // Geometry & Motion
      timeScale: 0.00004,
      number: 72,
      size: 250,
      rotations: 4.0,
      pulseScale: 3.0,

      // Procedural Randomization
      clickRandomize: true,
      randomize: () => randomizeScene(),
      reset: () => initialize()
    };

    const updateBackground = () => {
      const activeColor = params.greenscreen ? '#00ff00' : params.bgColor;
      canvas.style.backgroundColor = activeColor;
      document.body.style.backgroundColor = activeColor;
    };

    const updateAllControllers = (root) => {
      if (!root) return;
      if (root.controllers) {
        root.controllers.forEach(ctrl => ctrl.updateDisplay());
      }
      if (root.folders) {
        root.folders.forEach(folder => updateAllControllers(folder));
      }
    };

    const randomizeScene = () => {
      // 1. Random color scheme from all 19
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      params.colorScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];

      // 2. Random base & accent colors
      const randomHex = () => '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0');
      params.baseColor = randomHex();
      params.accentColor = randomHex();

      // 3. Re-roll geometry
      params.number = Utils.randomInt(36, 160);
      params.size = Utils.randomInt(120, 380);

      // 4. Re-roll motion parameters
      params.timeScale = Utils.randomRange(0.00001, 0.00008);
      params.rotations = Utils.randomRange(1.0, 6.0);
      params.pulseScale = Utils.randomRange(1.8, 4.2);

      // 5. Reinitialize heart particles
      initializeShapes();

      // 6. Refresh UI controls
      updateAllControllers(gui);
    };

    const setupGui = () => {
      gui = new GUI({ title: 'Heart Visualizer' });

      // Theme Folder
      const themeFolder = gui.addFolder('Theme & Colors');
      themeFolder.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Color Scheme');
      themeFolder.addColor(params, 'baseColor').name('Base Color');
      themeFolder.addColor(params, 'accentColor').name('Accent Color');
      themeFolder.add(params, 'greenscreen').name('Green Screen (#00ff00)').onChange(updateBackground);
      themeFolder.addColor(params, 'bgColor').name('Background Color').onChange(updateBackground);
      themeFolder.add(params, 'blendMode', ['lighter', 'source-over', 'screen']).name('Blend Mode');

      // Transform / Navigation Folder
      const viewFolder = gui.addFolder('Navigation & Zoom');
      viewFolder.add(params, 'zoom', 0.1, 15, 0.01).name('Zoom');
      viewFolder.add(params, 'panX', -2000, 2000, 1).name('Pan X');
      viewFolder.add(params, 'panY', -2000, 2000, 1).name('Pan Y');
      viewFolder.add(params, 'resetView').name('Reset View');

      // Geometry & Motion Folder
      const geomFolder = gui.addFolder('Geometry & Motion');
      geomFolder.add(params, 'timeScale', 0.000002, 0.00015, 0.000002).name('Speed');
      geomFolder.add(params, 'number', 1, 360, 1).name('Heart Count').onChange(() => initializeShapes());
      geomFolder.add(params, 'size', 10, 600, 1).name('Main Size');
      geomFolder.add(params, 'rotations', 0.5, 8.0, 0.5).name('Rotations');
      geomFolder.add(params, 'pulseScale', 1.0, 6.0, 0.1).name('Pulse Scale');

      // Procedural Variation Folder
      const procFolder = gui.addFolder('Procedural Mode');
      procFolder.add(params, 'clickRandomize').name('Click to Randomize');
      procFolder.add(params, 'randomize').name('🎲 Randomize Scene');
      procFolder.add(params, 'reset').name('↺ Reset All');

      // Keep default lil-gui styling
    };

    const setupCanvas = () => {
      canvas = document.createElement('canvas');
      document.body.appendChild(canvas);
      c = canvas.getContext('2d');
      updateBackground();
    };

    const initializeShapes = () => {
      shapes = [];
      const num = params.number;
      for (let i = 0; i < num; i++) {
        shapes.push([
          Math.cos(Math.random() * Math.PI * 2) * width / 2,
          Math.sin(Math.random() * Math.PI * 2) * height / 2,
          Math.random() * 30 + 10
        ]);
      }
    };

    const initialize = () => {
      if (animId) {
        cancelAnimationFrame(animId);
      }

      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;

      initializeShapes();
      draw(0);
    };

    const ease = (x) => {
      return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
    };

    const drawPolygon = (x, y, numVertices, sizeVal, fillStyle, strokeStyle, lineWidth, al) => {
      if (lineWidth <= 0.001 || al <= 0.001) return;

      c.fillStyle = fillStyle;
      c.strokeStyle = strokeStyle;
      c.lineJoin = 'round';
      c.globalCompositeOperation = params.blendMode || 'lighter';
      c.lineWidth = lineWidth;
      c.globalAlpha = Utils.clamp(al, 0, 1);

      c.beginPath();
      for (let i = 0; i < numVertices; i++) {
        const theta = (i / numVertices) * Math.PI * 2;
        const sinT = Math.sin(theta);

        const nx = (16 * sinT * sinT * sinT) * sizeVal * 0.06 + x;
        const ny = (
          13 * Math.cos(theta) -
          5 * Math.cos(2 * theta) -
          2 * Math.cos(3 * theta) -
          Math.cos(4 * theta)
        ) * sizeVal * 0.06 + y;

        if (i === 0) {
          c.moveTo(nx, ny);
        } else {
          c.lineTo(nx, ny);
        }
      }
      c.closePath();

      if (strokeStyle) {
        c.stroke();
      }
    };

    const draw = (t) => {
      const scaledTime = t * params.timeScale;
      const num = params.number;
      const sizeVal = params.size;
      const maxPulse = params.pulseScale;

      c.save();
      c.clearRect(0, 0, width, height);

      // Apply zoom & pan translation
      c.translate(width / 2 + params.panX, height / 2 + params.panY);
      c.scale(params.zoom, params.zoom);
      c.rotate(Math.PI);

      for (let j = 0; j < num; j++) {
        c.save();

        let scaledT = (scaledTime + (j / num)) % 1;
        scaledT = ease(Math.abs(scaledT));

        let alpha, lineWidth;

        if (scaledT < 0.5) {
          lineWidth = Utils.map(scaledT, 0, 0.5, 0, 20);
          alpha = Utils.map(scaledT, 0, 0.5, 1, 0);
          const sc = Utils.map(scaledT, 0, 0.5, 0, maxPulse);
          c.scale(sc, sc);
        } else {
          lineWidth = Utils.map(scaledT, 0.5, 1.0, 0, 0);
          alpha = Utils.map(scaledT, 0.5, 1.0, 0, 0);
          const sc = Utils.map(scaledT, 0.5, 1.0, maxPulse, 0);
          c.scale(sc, sc);
        }

        const color = getColor(j, num, params);

        // Main center pulsating heart
        drawPolygon(0, 0, 72, sizeVal, null, color, lineWidth, alpha);

        // Orbiting small heart
        c.rotate(Utils.lerp(scaledT, 0, Math.PI * params.rotations));
        if (shapes && shapes[j]) {
          drawPolygon(shapes[j][0], shapes[j][1], 72, shapes[j][2], color, color, lineWidth, alpha);
        }

        c.restore();
      }

      c.restore();
      animId = requestAnimationFrame(draw);
    };

    // Interaction Handlers: Wheel Zoom & Drag across screen
    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let initialPanX = 0;
    let initialPanY = 0;
    let hasMoved = false;

    const setupInteractions = () => {
      // Zoom with wheel
      window.addEventListener('wheel', (e) => {
        e.preventDefault();

        const mouseX = e.clientX;
        const mouseY = e.clientY;

        const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
        const oldZoom = params.zoom;
        const newZoom = Utils.clamp(oldZoom * zoomFactor, 0.1, 15.0);

        if (newZoom !== oldZoom) {
          const cx = width / 2 + params.panX;
          const cy = height / 2 + params.panY;
          const k = newZoom / oldZoom;

          params.panX = params.panX + (mouseX - cx) * (1 - k);
          params.panY = params.panY + (mouseY - cy) * (1 - k);
          params.zoom = newZoom;

          updateAllControllers(gui);
        }
      }, { passive: false });

      // Drag across screen
      canvas.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        isDragging = true;
        hasMoved = false;
        dragStartX = e.clientX;
        dragStartY = e.clientY;
        initialPanX = params.panX;
        initialPanY = params.panY;
        canvas.style.cursor = 'grabbing';
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const dx = e.clientX - dragStartX;
        const dy = e.clientY - dragStartY;

        if (Math.hypot(dx, dy) > 5) {
          hasMoved = true;
        }

        params.panX = initialPanX + dx;
        params.panY = initialPanY + dy;
        updateAllControllers(gui);
      });

      window.addEventListener('mouseup', (e) => {
        if (!isDragging) return;
        isDragging = false;
        canvas.style.cursor = 'grab';

        // Upon click on scene (not a drag), randomize if enabled
        if (!hasMoved && params.clickRandomize) {
          randomizeScene();
        }
      });

      // Touch interactions (Mobile & tablet support)
      let touchStartDist = 0;
      let touchStartZoom = 1;
      let touchStartX = 0, touchStartY = 0;
      let touchMoved = false;

      canvas.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          isDragging = true;
          touchMoved = false;
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
          initialPanX = params.panX;
          initialPanY = params.panY;
        } else if (e.touches.length === 2) {
          isDragging = false;
          touchStartDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          touchStartZoom = params.zoom;
        }
      }, { passive: true });

      window.addEventListener('touchmove', (e) => {
        if (e.touches.length === 1 && isDragging) {
          const dx = e.touches[0].clientX - touchStartX;
          const dy = e.touches[0].clientY - touchStartY;
          if (Math.hypot(dx, dy) > 5) touchMoved = true;
          params.panX = initialPanX + dx;
          params.panY = initialPanY + dy;
          updateAllControllers(gui);
        } else if (e.touches.length === 2 && touchStartDist > 0) {
          const dist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          const scale = dist / touchStartDist;
          params.zoom = Utils.clamp(touchStartZoom * scale, 0.1, 15.0);
          updateAllControllers(gui);
        }
      }, { passive: true });

      window.addEventListener('touchend', (e) => {
        if (isDragging) {
          isDragging = false;
          if (!touchMoved && params.clickRandomize && e.touches.length === 0) {
            randomizeScene();
          }
        }
        if (e.touches.length < 2) {
          touchStartDist = 0;
        }
      });

      // Hide / Show UI with "H" key
      window.addEventListener('keydown', (e) => {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) return;
        if (e.key === 'h' || e.key === 'H') {
          if (gui._hidden) {
            gui.show();
          } else {
            gui.hide();
          }
        }
      });
    };

    // Lifecycle
    window.addEventListener('DOMContentLoaded', () => {
      setupGui();
      setupCanvas();
      setupInteractions();
      initialize();
    });

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      initializeShapes();
    });
  </script>
</body>
</html>
