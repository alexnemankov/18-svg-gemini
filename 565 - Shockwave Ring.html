<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Shockwave Ring - Three.js</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    #webgl-canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }
  </style>

  <!-- Import map for modern ES modules -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js",
      "postprocessing/PostProcessor.js": "./postprocessing/PostProcessor.js"
    }
  }
  </script>

  <!-- GSAP CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import GUI from 'lil-gui';

    // -------------------------------------------------------------
    // POST PROCESSOR SUITE (From postprocessing/PostProcessor.js)
    // -------------------------------------------------------------
    const orthoVertexShader = `
      precision highp float;
      in vec3 position;
      out vec2 vUv;
      void main() {
        vUv = position.xy * 0.5 + 0.5;
        gl_Position = vec4(position.xy, 0.0, 1.0);
      }
    `;

    const brightFragmentShader = `
      precision highp float;
      uniform sampler2D inputTexture;
      uniform float bloomThreshold;
      in vec2 vUv;
      out vec4 fragColor;

      vec3 sanitize(vec3 v) {
        if (isnan(v.x) || isinf(v.x)) v.x = 0.0;
        if (isnan(v.y) || isinf(v.y)) v.y = 0.0;
        if (isnan(v.z) || isinf(v.z)) v.z = 0.0;
        return clamp(v, vec3(0.0), vec3(65000.0));
      }

      void main() {
        vec4 raw = texture(inputTexture, vUv);
        vec3 color = sanitize(raw.rgb);
        float luminance = max(0.0, dot(color, vec3(0.2126, 0.7152, 0.0722)));
        float knee = 0.1;
        float soft = luminance - bloomThreshold + knee;
        soft = clamp(soft, 0.0, 2.0 * knee);
        soft = (soft * soft) / (4.0 * knee + 0.00001);
        float contribution = max(soft, luminance - bloomThreshold);
        contribution /= max(luminance, 0.0001);
        vec3 result = color * contribution;
        fragColor = vec4(sanitize(result), clamp(raw.a, 0.0, 1.0));
      }
    `;

    const blur13ShaderChunk = `
      vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
        vec2 resolution = vec2(textureSize(image, 0));
        vec4 color = vec4(0.0);
        vec2 off1 = vec2(1.411764705882353) * direction;
        vec2 off2 = vec2(3.2941176470588234) * direction;
        vec2 off3 = vec2(5.176470588235294) * direction;
        color += texture(image, uv) * 0.1964825501511404;
        color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
        color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
        color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
        color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
        color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
        color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
        return color;
      }
    `;

    const blurFragmentShader = `
      precision highp float;
      uniform sampler2D inputTexture;
      uniform vec2 direction;
      in vec2 vUv;
      out vec4 color;
      ${blur13ShaderChunk}

      vec4 sanitize(vec4 v) {
        if (isnan(v.x) || isinf(v.x)) v.x = 0.0;
        if (isnan(v.y) || isinf(v.y)) v.y = 0.0;
        if (isnan(v.z) || isinf(v.z)) v.z = 0.0;
        if (isnan(v.w) || isinf(v.w)) v.w = 0.0;
        return clamp(v, vec4(0.0), vec4(65000.0));
      }

      void main() {
        color = sanitize(blur13(inputTexture, vUv, direction));
      }
    `;

    const godRaysDepthMaskShader = `
      precision highp float;
      uniform sampler2D inputTexture;
      uniform float threshold;
      in vec2 vUv;
      out vec4 fragColor;

      void main() {
        vec4 color = texture(inputTexture, vUv);
        float lum = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
        float factor = smoothstep(threshold, threshold + 0.15, lum);
        fragColor = vec4(vec3(factor), 1.0);
      }
    `;

    const godRaysGenerateShader = `
      precision highp float;
      #define TAPS_PER_PASS 6.0

      uniform sampler2D inputTexture;
      uniform vec3 vSunPositionScreenSpace;
      uniform float fStepSize;
      uniform float distanceAttenuation;
      uniform float maxDensity;
      in vec2 vUv;
      out vec4 fragColor;

      void main() {
        vec2 delta = vSunPositionScreenSpace.xy - vUv;
        float dist = length(delta);
        vec2 stepv = fStepSize * delta / max(dist, 0.0001);
        float iters = dist / max(fStepSize, 0.00001);

        vec2 uv = vUv;
        float col = 0.0;
        float f = min(1.0, max(vSunPositionScreenSpace.z, 0.0));
        float atten = 1.0 / (1.0 + pow(dist, distanceAttenuation));

        if (0.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
        uv += stepv;
        if (1.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
        uv += stepv;
        if (2.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
        uv += stepv;
        if (3.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
        uv += stepv;
        if (4.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
        uv += stepv;
        if (5.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;

        float finalVal = min(col / TAPS_PER_PASS * atten, maxDensity);
        fragColor = vec4(vec3(finalVal), 1.0);
      }
    `;

    const anamorphicBrightShader = `
      precision highp float;
      uniform sampler2D inputTexture;
      uniform float threshold;
      uniform float smoothWidth;
      in vec2 vUv;
      out vec4 fragColor;

      void main() {
        vec4 color = texture(inputTexture, vUv);
        float v = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
        float alpha = smoothstep(threshold, threshold + smoothWidth, v);
        fragColor = mix(vec4(0.0), color, alpha);
      }
    `;

    const anamorphicBlurShader = `
      precision highp float;
      uniform sampler2D inputTexture;
      uniform vec2 resolution;
      uniform float samples;
      uniform float intensity;
      uniform vec3 tintColor;
      uniform float bloomRadius;
      in vec2 vUv;
      out vec4 fragColor;

      void main() {
        int halfSamples = max(1, int(samples) / 2);
        float fHalfSamples = float(halfSamples);
        vec2 invSize = 1.0 / resolution;
        vec4 total = vec4(0.0);

        for (int i = -64; i <= 64; i++) {
          if (i < -halfSamples || i > halfSamples) continue;
          float softness = 1.0 - abs(float(i)) / fHalfSamples;
          softness = pow(softness, 2.0);
          vec2 shiftedUV = vec2(vUv.x + invSize.x * float(i) * (4.0 + bloomRadius * 8.0), vUv.y);
          shiftedUV = clamp(shiftedUV, 0.001, 0.999);
          total += texture(inputTexture, shiftedUV) * softness;
        }

        fragColor = (total / (samples / 3.0)) * vec4(tintColor, 1.0) * intensity;
      }
    `;

    const finalFragmentShader = `
      precision highp float;
      uniform vec2 resolution;
      uniform sampler2D inputTexture;
      uniform sampler2D blur0Texture;
      uniform sampler2D blur1Texture;
      uniform sampler2D blur2Texture;
      uniform sampler2D blur3Texture;
      uniform sampler2D blur4Texture;
      uniform sampler2D raysTexture;
      uniform sampler2D anamorphicTexture;
      uniform bool bloomEnabled;
      uniform float bloomStrength;
      uniform bool raysEnabled;
      uniform float raysStrength;
      uniform vec3 raysColor;
      uniform bool anamorphicEnabled;
      uniform float vignetteBoost;
      uniform float vignetteReduction;
      uniform float noiseIntensity;
      uniform float time;
      in vec2 vUv;
      out vec4 fragColor;

      vec3 sanitize(vec3 v) {
        if (isnan(v.x) || isinf(v.x)) v.x = 0.0;
        if (isnan(v.y) || isinf(v.y)) v.y = 0.0;
        if (isnan(v.z) || isinf(v.z)) v.z = 0.0;
        return clamp(v, vec3(0.0), vec3(65000.0));
      }

      float vignette(vec2 uv, float boost, float reduction) {
        vec2 position = vUv - 0.5;
        return boost - length(position) * reduction;
      }

      float hash1(uint n) {
        n = (n << 13U) ^ n;
        n = n * (n * n * 15731U + 789221U) + 1376312589U;
        return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
      }

      float noise(in vec2 uv, in float timeVal) {
        uvec2 p = uvec2(uv);
        return hash1(p.x + 1920U * p.y + (1920U * 1080U) * (uint(timeVal) % 65536U));
      }

      void main() {
        vec4 raw = texture(inputTexture, vUv);
        vec3 color = sanitize(raw.rgb);

        if (bloomEnabled && bloomStrength > 0.001) {
          vec3 b0 = sanitize(texture(blur0Texture, vUv).rgb);
          vec3 b1 = sanitize(texture(blur1Texture, vUv).rgb);
          vec3 b2 = sanitize(texture(blur2Texture, vUv).rgb);
          vec3 b3 = sanitize(texture(blur3Texture, vUv).rgb);
          vec3 b4 = sanitize(texture(blur4Texture, vUv).rgb);

          vec3 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
          color += bloomSum * bloomStrength;
        }

        if (raysEnabled && raysStrength > 0.001) {
          vec3 r = sanitize(texture(raysTexture, vUv).rgb);
          color += r * raysColor * raysStrength;
        }

        if (anamorphicEnabled) {
          vec3 a = sanitize(texture(anamorphicTexture, vUv).rgb);
          color += a;
        }

        float vig = max(0.0, vignette(vUv, vignetteBoost, vignetteReduction));
        color *= vig;
        color += max(0.0, noiseIntensity) * noise(gl_FragCoord.xy, time);
        fragColor = vec4(sanitize(color), 1.0);
      }
    `;

    const chromaticAberrationShaderChunk = `
      vec2 barrelDistortion(vec2 coord, float amt) {
        vec2 cc = coord - 0.5;
        float dist = dot(cc, cc);
        return coord + cc * dist * amt;
      }
      float sat(float t) { return clamp(t, 0.0, 1.0); }
      float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
      float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
      vec4 spectrum_offset(float t) {
        float lo = step(t, 0.5);
        float hi = 1.0 - lo;
        float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
        vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
        return pow(ret, vec4(1.0 / 2.2));
      }
      const float max_distort = 2.2;
      const int num_iter = 8;
      const float reci_num_iter_f = 1.0 / float(num_iter);
      vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
        vec4 sumcol = vec4(0.0);
        vec4 sumw = vec4(0.0);
        for (int i = 0; i < num_iter; ++i) {
          float t = float(i) * reci_num_iter_f;
          vec4 w = spectrum_offset(t);
          sumw += w;
          sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
        }
        return sumcol / sumw;
      }
    `;

    const colorFragmentShader = `
      precision highp float;
      uniform sampler2D inputTexture;
      uniform float chromaticAberrationAmount;
      uniform float minInputLevel;
      uniform float maxInputLevel;
      uniform float gammaLevel;
      uniform float exposure;
      uniform float fisheyeStrength;
      uniform float fisheyeRadius;
      uniform float time;
      uniform int visionMode;
      uniform float thermalSensitivity;
      uniform float nightVisionNoise;
      uniform float nightVisionGain;
      uniform float crtIntensity;
      in vec2 vUv;
      out vec4 fragColor;

      ${chromaticAberrationShaderChunk}

      vec2 applyFisheye(vec2 uv, float strength, float radius) {
        if (abs(strength) < 0.0001) return uv;
        vec2 p = uv - 0.5;
        float d = length(p);
        if (d > radius * 1.5) return uv;
        float r = d / max(radius, 0.001);
        float theta = atan(p.y, p.x);
        float rDist = r + strength * (r * r * r);
        return 0.5 + vec2(cos(theta), sin(theta)) * (rDist * radius);
      }

      vec3 gammaCorrect(vec3 color, vec3 gamma) {
        return pow(max(color, vec3(0.0)), 1.0 / max(gamma, vec3(0.001)));
      }
      vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
        return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
      }
      vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
        return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
      }

      vec3 applyNightVision(vec3 color, vec2 uv, float timeVal, float noiseAmt, float gain, float crt) {
        float lum = dot(color, vec3(0.299, 0.587, 0.114));
        float amplified = pow(lum * gain, 0.72);
        vec3 phosphorColor = mix(vec3(0.02, 0.12, 0.03), vec3(0.18, 1.0, 0.32), clamp(amplified, 0.0, 1.0));
        phosphorColor += vec3(0.7, 1.0, 0.8) * max(0.0, amplified - 0.75) * 1.8;
        vec2 p = uv - 0.5;
        float tubeDist = length(p);
        float tubeMask = smoothstep(0.72, 0.44, tubeDist);
        float n = fract(sin(dot(uv * 280.0 + timeVal * 0.05, vec2(12.9898, 78.233))) * 43758.5453);
        float scanline = sin(uv.y * 650.0) * crt;
        phosphorColor += (n - 0.5) * noiseAmt * 2.0 + scanline;
        return clamp(phosphorColor * tubeMask, 0.0, 1.0);
      }

      vec3 ironbow(float t) {
        t = clamp(t, 0.0, 1.0);
        vec3 c0 = vec3(0.02, 0.01, 0.18);
        vec3 c1 = vec3(0.22, 0.02, 0.48);
        vec3 c2 = vec3(0.82, 0.05, 0.25);
        vec3 c3 = vec3(1.0, 0.62, 0.02);
        vec3 c4 = vec3(1.0, 1.0, 0.92);
        if (t < 0.25) return mix(c0, c1, t * 4.0);
        if (t < 0.50) return mix(c1, c2, (t - 0.25) * 4.0);
        if (t < 0.75) return mix(c2, c3, (t - 0.50) * 4.0);
        return mix(c3, c4, (t - 0.75) * 4.0);
      }

      vec3 applyThermal(vec3 color, vec2 uv, float sensitivity, float crt, bool whiteHot) {
        float lum = dot(color, vec3(0.299, 0.587, 0.114));
        float heat = clamp(lum * sensitivity, 0.0, 1.0);
        float sensorRaster = sin(uv.y * 900.0) * (crt * 0.3);
        heat = clamp(heat + sensorRaster, 0.0, 1.0);
        if (whiteHot) {
          float grad = pow(heat, 0.85);
          return vec3(grad);
        } else {
          return ironbow(heat);
        }
      }

      void main() {
        vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
        vec4 col = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
        vec3 finalCol = col.rgb;
        if (isnan(finalCol.x) || isinf(finalCol.x)) finalCol.x = 0.0;
        if (isnan(finalCol.y) || isinf(finalCol.y)) finalCol.y = 0.0;
        if (isnan(finalCol.z) || isinf(finalCol.z)) finalCol.z = 0.0;
        finalCol = clamp(finalCol, vec3(0.0), vec3(65000.0));

        if (visionMode == 1) {
          finalCol = applyNightVision(finalCol, uv, time, nightVisionNoise, nightVisionGain, crtIntensity);
        } else if (visionMode == 2) {
          finalCol = applyThermal(finalCol, uv, thermalSensitivity, crtIntensity, false);
        } else if (visionMode == 3) {
          finalCol = applyThermal(finalCol, uv, thermalSensitivity, crtIntensity, true);
        }

        finalCol *= exposure;
        finalCol = finalLevels(finalCol, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
        fragColor = vec4(finalCol, col.a);
      }
    `;

    const copyFragmentShader = `
      precision highp float;
      uniform sampler2D inputTexture;
      in vec2 vUv;
      out vec4 fragColor;
      void main() {
        fragColor = texture(inputTexture, vUv);
      }
    `;

    const fxaaFragmentShader = `
      precision highp float;
      uniform sampler2D inputTexture;
      uniform vec2 resolution;
      in vec2 vUv;
      out vec4 fragColor;

      #define FXAA_REDUCE_MIN   (1.0/ 128.0)
      #define FXAA_REDUCE_MUL   (1.0/ 8.0)
      #define FXAA_SPAN_MAX     8.0

      void main() {
        vec2 inverseVP = 1.0 / resolution;
        vec3 rgbNW = texture(inputTexture, vUv + (vec2(-1.0, -1.0) * inverseVP)).rgb;
        vec3 rgbNE = texture(inputTexture, vUv + (vec2(1.0, -1.0) * inverseVP)).rgb;
        vec3 rgbSW = texture(inputTexture, vUv + (vec2(-1.0, 1.0) * inverseVP)).rgb;
        vec3 rgbSE = texture(inputTexture, vUv + (vec2(1.0, 1.0) * inverseVP)).rgb;
        vec3 rgbM  = texture(inputTexture, vUv).rgb;

        vec3 luma = vec3(0.299, 0.587, 0.114);
        float lumaNW = dot(rgbNW, luma);
        float lumaNE = dot(rgbNE, luma);
        float lumaSW = dot(rgbSW, luma);
        float lumaSE = dot(rgbSE, luma);
        float lumaM  = dot(rgbM,  luma);

        float lumaMin = min(lumaM, min(min(lumaNW, lumaNE), min(lumaSW, lumaSE)));
        float lumaMax = max(lumaM, max(max(lumaNW, lumaNE), max(lumaSW, lumaSE)));

        vec2 dir;
        dir.x = -((lumaNW + lumaNE) - (lumaSW + lumaSE));
        dir.y =  ((lumaNW + lumaSW) - (lumaNE + lumaSE));

        float dirReduce = max((lumaNW + lumaNE + lumaSW + lumaSE) * (0.25 * (1.0 / 8.0)), 1.0 / 128.0);
        float rcpDirMin = 1.0 / (min(abs(dir.x), abs(dir.y)) + dirReduce);

        dir = min(vec2(8.0, 8.0), max(vec2(-8.0, -8.0), dir * rcpDirMin)) * inverseVP;

        vec3 rgbA = 0.5 * (
            texture(inputTexture, vUv + dir * (1.0 / 3.0 - 0.5)).rgb +
            texture(inputTexture, vUv + dir * (2.0 / 3.0 - 0.5)).rgb);
        vec3 rgbB = rgbA * 0.5 + 0.25 * (
            texture(inputTexture, vUv + dir * -0.5).rgb +
            texture(inputTexture, vUv + dir * 0.5).rgb);

        float lumaB = dot(rgbB, luma);
        if ((lumaB < lumaMin) || (lumaB > lumaMax)) {
            fragColor = vec4(rgbA, 1.0);
        } else {
            fragColor = vec4(rgbB, 1.0);
        }
      }
    `;

    const smaaFragmentShader = `
      precision highp float;
      uniform sampler2D inputTexture;
      uniform vec2 resolution;
      in vec2 vUv;
      out vec4 fragColor;

      void main() {
        vec2 invRes = 1.0 / resolution;
        vec4 center = texture(inputTexture, vUv);
        vec3 cU = texture(inputTexture, vUv + vec2(0.0, -1.0) * invRes).rgb;
        vec3 cD = texture(inputTexture, vUv + vec2(0.0, 1.0) * invRes).rgb;
        vec3 cL = texture(inputTexture, vUv + vec2(-1.0, 0.0) * invRes).rgb;
        vec3 cR = texture(inputTexture, vUv + vec2(1.0, 0.0) * invRes).rgb;

        vec3 cUL = texture(inputTexture, vUv + vec2(-1.0, -1.0) * invRes).rgb;
        vec3 cUR = texture(inputTexture, vUv + vec2(1.0, -1.0) * invRes).rgb;
        vec3 cDL = texture(inputTexture, vUv + vec2(-1.0, 1.0) * invRes).rgb;
        vec3 cDR = texture(inputTexture, vUv + vec2(1.0, 1.0) * invRes).rgb;

        vec3 lumaW = vec3(0.299, 0.587, 0.114);
        float lM = dot(center.rgb, lumaW);
        float lU = dot(cU, lumaW);
        float lD = dot(cD, lumaW);
        float lL = dot(cL, lumaW);
        float lR = dot(cR, lumaW);

        float gx = (lR - lL) * 2.0 + (dot(cUR, lumaW) - dot(cUL, lumaW)) + (dot(cDR, lumaW) - dot(cDL, lumaW));
        float gy = (lD - lU) * 2.0 + (dot(cDL, lumaW) - dot(cUL, lumaW)) + (dot(cDR, lumaW) - dot(cUR, lumaW));
        float edgeStrength = length(vec2(gx, gy));

        if (edgeStrength < 0.04) {
          fragColor = center;
          return;
        }

        vec2 dir = normalize(vec2(-gy, gx)) * invRes * clamp(edgeStrength * 1.5, 0.5, 1.5);
        vec4 sampleA = texture(inputTexture, vUv + dir * 0.5);
        vec4 sampleB = texture(inputTexture, vUv - dir * 0.5);
        vec4 sampleC = texture(inputTexture, vUv + dir * 1.0);
        vec4 sampleD = texture(inputTexture, vUv - dir * 1.0);

        vec4 blended = (center * 2.0 + sampleA + sampleB + (sampleC + sampleD) * 0.5) / 5.0;
        fragColor = vec4(blended.rgb, center.a);
      }
    `;

    function createFBO(w, h, options = {}) {
      return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
        wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
        wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
        minFilter: options.minFilter || THREE.LinearFilter,
        magFilter: options.magFilter || THREE.LinearFilter,
        format: options.format || THREE.RGBAFormat,
        type: options.type || THREE.HalfFloatType,

        const screenX = this._ndc.x * 0.5 + 0.5;
        const screenY = this._ndc.y * 0.5 + 0.5;
        const screenZ = fade;

        this.moonScreenPos.set(screenX, screenY, screenZ);
        this.godRaysGenShader.uniforms.vSunPositionScreenSpace.value.set(screenX, screenY, screenZ);
      }

      renderScene(scene, camera) {
        if (!this.settings.enabled) {
          if (this.settings.fxaaEnabled || this.settings.smaaEnabled || (this.settings.msaaSamples && this.settings.msaaSamples > 0) || (this.settings.ssaaScale && this.settings.ssaaScale > 1.0)) {
            this.renderer.setRenderTarget(this.sceneTarget);
            this.renderer.render(scene, camera);
            this.renderer.setRenderTarget(null);
            if (this.settings.fxaaEnabled) {
              this.fxaaShader.uniforms.inputTexture.value = this.sceneTarget.texture;
              this.fxaaPass.render(this.renderer, true);
            } else if (this.settings.smaaEnabled) {
              this.smaaShader.uniforms.inputTexture.value = this.sceneTarget.texture;
              this.smaaPass.render(this.renderer, true);
            } else {
              this.copyPass.shader.uniforms.inputTexture.value = this.sceneTarget.texture;
              this.copyPass.render(this.renderer, true);
            }
          } else {
            this.renderer.setRenderTarget(null);
            this.renderer.render(scene, camera);
          }
          return;
        }
        this.renderer.setRenderTarget(this.sceneTarget);
        this.renderer.render(scene, camera);
        this.renderer.setRenderTarget(null);
        this.render(this.sceneTarget.texture);
      }

      render(sourceTexture) {
        if (!this.settings.enabled) {
          this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
          this.copyPass.render(this.renderer, true);
          return;
        }

        this.updateSettings();

        // 1. Atmospheric Bloom
        this.bloomPass.source = sourceTexture;
        this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
        this.bloomPass.render(this.renderer);

        this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
        this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
        this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
        this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
        this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

        // 2. Godrays
        if (this.settings.raysEnabled && this.settings.raysStrength > 0.001 && this.moonInFront) {
          this.godRaysMaskShader.uniforms.inputTexture.value = sourceTexture;
          this.godRaysMaskPass.render(this.renderer);

          let grInput = this.godRaysMaskPass.texture;
          this.godRaysPingPong.render(this.renderer);
          grInput = this.godRaysPingPong.texture;
          this.godRaysPingPong.render(this.renderer);
          grInput = this.godRaysPingPong.texture;

          this.finalPass.shader.uniforms.raysTexture.value = grInput;
          this.finalPass.shader.uniforms.raysEnabled.value = true;
        } else {
          this.finalPass.shader.uniforms.raysEnabled.value = false;
        }

        // 3. Anamorphic Flare
        if (this.settings.anamorphicEnabled && this.settings.anamorphicIntensity > 0.001) {
          this.anamorphicBrightShader.uniforms.inputTexture.value = sourceTexture;
          this.anamorphicBrightShader.uniforms.threshold.value = this.settings.anamorphicThreshold;
          this.anamorphicBrightShader.uniforms.smoothWidth.value = this.settings.anamorphicSmoothWidth;
          this.anamorphicBrightPass.render(this.renderer);

          this.anamorphicBlurShader.uniforms.inputTexture.value = this.anamorphicBrightPass.texture;
          this.anamorphicBlurShader.uniforms.samples.value = this.settings.anamorphicSamples;
          this.anamorphicBlurShader.uniforms.intensity.value = this.settings.anamorphicIntensity;
          this.anamorphicBlurShader.uniforms.tintColor.value.copy(this.settings.anamorphicColor);
          this.anamorphicBlurShader.uniforms.bloomRadius.value = this.settings.anamorphicRadius;
          this.anamorphicBlurPass.render(this.renderer);

          this.finalPass.shader.uniforms.anamorphicTexture.value = this.anamorphicBlurPass.texture;
          this.finalPass.shader.uniforms.anamorphicEnabled.value = true;
        } else {
          this.finalPass.shader.uniforms.anamorphicEnabled.value = false;
        }

        const randomTime = Math.random() * 100000;
        this.finalPass.shader.uniforms.time.value = randomTime;
        this.rgbPass.shader.uniforms.time.value = randomTime;

        this.finalPass.render(this.renderer);
        if (this.settings.fxaaEnabled || this.settings.useFxaa) {
          this.rgbPass.render(this.renderer, false);
          this.fxaaShader.uniforms.inputTexture.value = this.rgbPass.texture;
          this.fxaaPass.render(this.renderer, true);
        } else if (this.settings.smaaEnabled) {
          this.rgbPass.render(this.renderer, false);
          this.smaaShader.uniforms.inputTexture.value = this.rgbPass.texture;
          this.smaaPass.render(this.renderer, true);
        } else {
          this.rgbPass.render(this.renderer, true);
        }
      }

    // --- PROCEDURAL RADIAL TEXTURE FOR PARTICLES ---
    function generateRadialTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
      grad.addColorStop(0.0, 'rgba(255,255,255,1.0)');
      grad.addColorStop(0.2, 'rgba(255,255,255,0.85)');
      grad.addColorStop(0.6, 'rgba(255,255,255,0.2)');
      grad.addColorStop(1.0, 'rgba(255,255,255,0.0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 128, 128);
      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.ClampToEdgeWrapping;
      texture.wrapT = THREE.ClampToEdgeWrapping;
      return texture;
    }

    const simplexNoiseGLSL = `
      vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
      vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
      vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
      vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

      float snoise(vec3 v) {
        const vec2 C = vec2(1.0/6.0, 1.0/3.0);
        const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
        vec3 i  = floor(v + dot(v, C.yyy));
        vec3 x0 = v - i + dot(i, C.xxx);
        vec3 g = step(x0.yzx, x0.xyz);
        vec3 l = 1.0 - g;
        vec3 i1 = min(g.xyz, l.zxy);
        vec3 i2 = max(g.xyz, l.zxy);
        vec3 x1 = x0 - i1 + C.xxx;
        vec3 x2 = x0 - i2 + C.yyy;
        vec3 x3 = x0 - D.yyy;
        i = mod289(i);
        vec4 p = permute(permute(permute(
                   i.z + vec4(0.0, i1.z, i2.z, 1.0))
                 + i.y + vec4(0.0, i1.y, i2.y, 1.0))
                 + i.x + vec4(0.0, i1.x, i2.x, 1.0));
        float n_ = 0.142857142857;
        vec3  ns = n_ * D.wyz - D.xzx;
        vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
        vec4 x_ = floor(j * ns.z);
        vec4 y_ = floor(j - 7.0 * x_);
        vec4 x = x_ *ns.x + ns.yyyy;
        vec4 y = y_ *ns.x + ns.yyyy;
        vec4 h = 1.0 - abs(x) - abs(y);
        vec4 b0 = vec4(x.xy, y.xy);
        vec4 b1 = vec4(x.zw, y.zw);
        vec4 s0 = floor(b0)*2.0 + 1.0;
        vec4 s1 = floor(b1)*2.0 + 1.0;
        vec4 sh = -step(h, vec4(0.0));
        vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
        vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
        vec3 p0 = vec3(a0.xy, h.x);
        vec3 p1 = vec3(a0.zw, h.y);
        vec3 p2 = vec3(a1.xy, h.z);
        vec3 p3 = vec3(a1.zw, h.w);
        vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
        p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
        vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
        m = m * m;
        return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
      }
    `;

    // Shockwave Ring Shader: Symmetrical expanding wavefront
    const shockwaveVertexShader = `
      varying vec3 vLocalPos;
      varying vec2 vUv;
      void main() {
        vUv = uv;
        vLocalPos = position;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `;

    const shockwaveFragmentShader = `
      precision highp float;
      ${simplexNoiseGLSL}

      uniform float uRadius;
      uniform float uFrontSharpness;
      uniform float uFrontBrightness;
      uniform float uWakeLength;
      uniform float uWakeIntensity;
      uniform float uRimSharpness;
      uniform float uRimIntensity;
      uniform float uVacuumIntensity;
      uniform float uWaveAge;

      uniform vec3 uFrontColor;
      uniform vec3 uWakeColor;
      uniform vec3 uVacuumColor;
      uniform vec3 uRimColor;
      uniform float uTime;

      varying vec3 vLocalPos;
      varying vec2 vUv;

      void main() {
        float dist = length(vLocalPos.xy);
        float delta = dist - uRadius;

        float lifeFade = smoothstep(0.0, 0.08, uWaveAge) * smoothstep(1.0, 0.72, uWaveAge);
        if (lifeFade <= 0.0001) discard;

        vec3 noiseCoord = vec3(vLocalPos.xy * 0.28, uTime * 0.6);
        float noiseVal = snoise(noiseCoord) * 0.5 + 0.5;

        // 1. Thin bright leading shock front
        float frontMask = exp(-abs(delta) * uFrontSharpness) * step(delta, 0.4);
        float front = frontMask * uFrontBrightness;

        // 2. Soft trailing wake (behind front, delta < 0)
        float wakeDist = -delta;
        float wakeMask = 0.0;
        if (delta <= 0.0) {
          wakeMask = exp(-wakeDist / max(uWakeLength, 0.1)) * smoothstep(uRadius * 0.05, uWakeLength * 0.3, wakeDist);
          wakeMask *= (0.65 + 0.45 * noiseVal);
        }
        float wake = wakeMask * uWakeIntensity;

        // 3. Outside subtle glow along edge (pre-ionization halo, delta > 0)
        float rimMask = 0.0;
        if (delta > 0.0) {
          rimMask = exp(-delta * uRimSharpness);
        }
        float rim = rimMask * uRimIntensity;

        // 4. Inside vacuum darkening depression (rarefaction bubble)
        float vacuumMask = 0.0;
        if (dist < uRadius - uWakeLength * 0.6) {
          float innerDist = (uRadius - uWakeLength * 0.6) - dist;
          vacuumMask = smoothstep(0.0, uWakeLength * 1.2, innerDist) * uVacuumIntensity;
        }

        vec3 color = vec3(0.0);
        color += uFrontColor * front;
        color += uWakeColor * wake;
        color += uRimColor * rim;
        color = mix(color, uVacuumColor, vacuumMask * 0.85);

        float totalAlpha = (front * 0.95 + wake * 0.85 + rim * 0.65 + vacuumMask * 0.4) * lifeFade;
        totalAlpha = clamp(totalAlpha, 0.0, 1.0);

        if (totalAlpha < 0.005) discard;

        gl_FragColor = vec4(color, totalAlpha);
      }
    `;

    // Optical Refraction Shader (Shockwave Air Distortion)
    const refractionVertexShader = `
      varying vec3 vLocalPos;
      varying vec2 vUv;
      void main() {
        vUv = uv;
        vLocalPos = position;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `;

    const refractionFragmentShader = `
      precision highp float;
      ${simplexNoiseGLSL}

      uniform sampler2D uSceneTexture;
      uniform vec2 uResolution;
      uniform float uRadius;
      uniform float uDistortionStrength;
      uniform float uDispersion;
      uniform float uWaveAge;
      uniform float uTime;
      uniform vec3 uShockColor;

      varying vec3 vLocalPos;
      varying vec2 vUv;

      void main() {
        float dist = length(vLocalPos.xy);
        float delta = dist - uRadius;

        float ringMask = exp(-abs(delta) * 1.6);
        float lifeFade = smoothstep(0.0, 0.06, uWaveAge) * smoothstep(1.0, 0.75, uWaveAge);
        float strength = ringMask * uDistortionStrength * lifeFade;

        if (strength <= 0.0005) discard;

        vec2 screenUv = gl_FragCoord.xy / uResolution;

        vec2 dir = normalize(vLocalPos.xy + 0.0001);
        float noise = snoise(vec3(vLocalPos.xy * 0.4, uTime * 0.8)) * 0.2;
        vec2 displacement = dir * (strength * (1.0 + noise));

        float r = texture2D(uSceneTexture, screenUv + displacement * (1.0 + uDispersion)).r;
        float g = texture2D(uSceneTexture, screenUv + displacement).g;
        float b = texture2D(uSceneTexture, screenUv + displacement * (1.0 - uDispersion)).b;

        vec3 sceneRefracted = vec3(r, g, b);
        float rimSpec = pow(ringMask, 3.5) * 0.35;
        vec3 finalColor = sceneRefracted + uShockColor * rimSpec;

        gl_FragColor = vec4(finalColor, clamp(strength * 2.8, 0.0, 1.0));
      }
    `;

    // Ground Shock Wave Shader
    const groundShockVertex = `
      varying vec3 vWorldPos;
      void main() {
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWorldPos = wp.xyz;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `;

    const groundShockFragment = `
      precision highp float;
      uniform vec3 uOrigin;
      uniform float uRadius;
      uniform float uWakeLength;
      uniform vec3 uShockColor;
      uniform float uWaveAge;
      varying vec3 vWorldPos;

      void main() {
        float dist = length(vWorldPos.xz - uOrigin.xz);
        float delta = dist - uRadius;
        float lifeFade = smoothstep(0.0, 0.08, uWaveAge) * smoothstep(1.0, 0.75, uWaveAge);

        float edge = exp(-abs(delta) * 8.0) * 1.8;
        float scorch = 0.0;
        if (delta <= 0.0) {
          scorch = exp(delta / max(uWakeLength * 0.8, 0.1)) * 0.6;
        }

        float total = (edge + scorch) * lifeFade;
        if (total < 0.01) discard;

        gl_FragColor = vec4(uShockColor * total, clamp(total, 0.0, 0.75));
      }
    `;

    // --- CREATE MESHES ---
    const shockRingGeometry = new THREE.PlaneGeometry(80, 80, 1, 1);

    // 1. Primary Shockwave Ring
    const primaryShockMaterial = new THREE.ShaderMaterial({
      vertexShader: shockwaveVertexShader,
      fragmentShader: shockwaveFragmentShader,
      uniforms: {
        uRadius: { value: 0.1 },
        uFrontSharpness: { value: params.frontSharpness },
        uFrontBrightness: { value: params.frontBrightness },
        uWakeLength: { value: params.wakeLength },
        uWakeIntensity: { value: params.wakeIntensity },
        uRimSharpness: { value: params.rimGlowSharpness },
        uRimIntensity: { value: params.rimGlowIntensity },
        uVacuumIntensity: { value: params.vacuumIntensity },
        uWaveAge: { value: 0.0 },
        uFrontColor: { value: new THREE.Color(params.frontColor) },
        uWakeColor: { value: new THREE.Color(params.wakeColor) },
        uVacuumColor: { value: new THREE.Color(params.vacuumColor) },
        uRimColor: { value: new THREE.Color(params.rimColor) },
        uTime: { value: 0.0 }
      },
      transparent: true,
      blending: THREE.NormalBlending,
      depthWrite: false,
      side: THREE.DoubleSide
    });
    const primaryShockMesh = new THREE.Mesh(shockRingGeometry, primaryShockMaterial);
    scene.add(primaryShockMesh);

    // 2. Secondary Delayed Shockwave Ring
    const secondaryShockMaterial = new THREE.ShaderMaterial({
      vertexShader: shockwaveVertexShader,
      fragmentShader: shockwaveFragmentShader,
      uniforms: {
        uRadius: { value: 0.1 },
        uFrontSharpness: { value: params.frontSharpness * 0.85 },
        uFrontBrightness: { value: params.frontBrightness * params.secondaryIntensity },
        uWakeLength: { value: params.wakeLength * 0.75 },
        uWakeIntensity: { value: params.wakeIntensity * params.secondaryIntensity },
        uRimSharpness: { value: params.rimGlowSharpness },
        uRimIntensity: { value: params.rimGlowIntensity * params.secondaryIntensity },
        uVacuumIntensity: { value: params.vacuumIntensity * 0.4 },
        uWaveAge: { value: 0.0 },
        uFrontColor: { value: new THREE.Color(params.frontColor) },
        uWakeColor: { value: new THREE.Color(params.wakeColor) },
        uVacuumColor: { value: new THREE.Color(params.vacuumColor) },
        uRimColor: { value: new THREE.Color(params.rimColor) },
        uTime: { value: 0.0 }
      },
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      side: THREE.DoubleSide
    });
    const secondaryShockMesh = new THREE.Mesh(shockRingGeometry, secondaryShockMaterial);
    scene.add(secondaryShockMesh);

    // 3. Optical Refraction Air Distortion Mesh
    const refractionMaterial = new THREE.ShaderMaterial({
      vertexShader: refractionVertexShader,
      fragmentShader: refractionFragmentShader,
      uniforms: {
        uSceneTexture: { value: refractRenderTarget.texture },
        uResolution: { value: new THREE.Vector2(window.innerWidth * params.dpr, window.innerHeight * params.dpr) },
        uRadius: { value: 0.1 },
        uDistortionStrength: { value: params.airDistortion },
        uDispersion: { value: params.dispersion },
        uWaveAge: { value: 0.0 },
        uTime: { value: 0.0 },
        uShockColor: { value: new THREE.Color(params.rimColor) }
      },
      transparent: true,
      depthWrite: false,
      side: THREE.DoubleSide
    });
    const refractionMesh = new THREE.Mesh(shockRingGeometry, refractionMaterial);
    scene.add(refractionMesh);

    // 4. Ground Shock Mesh (expanding on ground plane)
    const groundShockMaterial = new THREE.ShaderMaterial({
      vertexShader: groundShockVertex,
      fragmentShader: groundShockFragment,
      uniforms: {
        uOrigin: { value: new THREE.Vector3(params.originX, params.originY, params.originZ) },
        uRadius: { value: 0.1 },
        uWakeLength: { value: params.wakeLength },
        uShockColor: { value: new THREE.Color(params.rimColor) },
        uWaveAge: { value: 0.0 }
      },
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const groundShockGeo = new THREE.PlaneGeometry(120, 120);
    const groundShockMesh = new THREE.Mesh(groundShockGeo, groundShockMaterial);
    groundShockMesh.rotation.x = -Math.PI / 2;
    groundShockMesh.position.y = -5.92;
    scene.add(groundShockMesh);

    // 5. Ground Plane & Grid
    const groundGeometry = new THREE.PlaneGeometry(120, 120, 32, 32);
    const groundMaterial = new THREE.MeshStandardMaterial({
      color: 0x0c0f16,
      roughness: 0.85,
      metalness: 0.2
    });
    const groundMesh = new THREE.Mesh(groundGeometry, groundMaterial);
    groundMesh.rotation.x = -Math.PI / 2;
    groundMesh.position.y = -6.0;
    scene.add(groundMesh);

    const gridHelper = new THREE.GridHelper(120, 60, 0x334466, 0x151c28);
    gridHelper.position.y = -5.98;
    scene.add(gridHelper);

    // Toggle Floor Visibility
    function updateFloorVisibility() {
      groundMesh.visible = params.showFloor;
      gridHelper.visible = params.showFloor;
      groundShockMesh.visible = params.showFloor;
    }

    // --- DEBRIS SHARDS SYSTEM (Instanced Shattered Polyhedra) ---
    const debrisGeo = new THREE.DodecahedronGeometry(0.35, 0);
    const debrisMat = new THREE.MeshStandardMaterial({
      color: new THREE.Color(params.debrisColor),
      roughness: 0.65,
      metalness: 0.35
    });

    const debrisInstanced = new THREE.InstancedMesh(debrisGeo, debrisMat, params.debrisCount);
    debrisInstanced.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    scene.add(debrisInstanced);

    const debrisData = [];
    const dummy = new THREE.Object3D();

    function initDebris() {
      debrisData.length = 0;
      for (let i = 0; i < params.debrisCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const dist = Math.pow(Math.random(), 0.65) * (params.maxRadius * 0.95) + 0.5;
        const initialX = Math.cos(angle) * dist;
        const initialY = -5.85 + (Math.random() * 0.35);
        const initialZ = Math.sin(angle) * dist;

        debrisData.push({
          x: initialX,
          y: initialY,
          z: initialZ,
          homeX: initialX,
          homeY: initialY,
          homeZ: initialZ,
          vx: 0,
          vy: 0,
          vz: 0,
          rotX: Math.random() * Math.PI,
          rotY: Math.random() * Math.PI,
          rotZ: Math.random() * Math.PI,
          vRotX: (Math.random() - 0.5) * 8.0,
          vRotY: (Math.random() - 0.5) * 8.0,
          vRotZ: (Math.random() - 0.5) * 8.0,
          scale: 0.4 + Math.random() * 0.9,
          triggered: false
        });

        dummy.position.set(initialX, initialY, initialZ);
        dummy.scale.setScalar(debrisData[i].scale);
        dummy.updateMatrix();
        debrisInstanced.setMatrixAt(i, dummy.matrix);
      }
      debrisInstanced.instanceMatrix.needsUpdate = true;
    }
    initDebris();

    // --- SPARKS / EMBERS SYSTEM (Swept High-Speed Points) ---
    const sparksGeo = new THREE.BufferGeometry();
    const sparksPos = new Float32Array(params.sparksCount * 3);
    const sparksVel = new Float32Array(params.sparksCount * 3);
    const sparksLife = new Float32Array(params.sparksCount);

    function resetSpark(i, fullSpread = false) {
      const idx = i * 3;
      const angle = Math.random() * Math.PI * 2;
      const r = fullSpread ? Math.random() * params.maxRadius : (Math.random() * 0.8 + 0.1);
      sparksPos[idx] = params.originX + Math.cos(angle) * r;
      sparksPos[idx + 1] = params.originY + (Math.random() - 0.5) * 1.5;
      sparksPos[idx + 2] = params.originZ + Math.sin(angle) * r;

      const speed = (Math.random() * 14.0 + 8.0) * (params.speed);
      sparksVel[idx] = Math.cos(angle) * speed + (Math.random() - 0.5) * 2.0;
      sparksVel[idx + 1] = (Math.random() * 6.0) + 1.0;
      sparksVel[idx + 2] = Math.sin(angle) * speed + (Math.random() - 0.5) * 2.0;

      sparksLife[i] = Math.random();
    }

    function initSparks() {
      for (let i = 0; i < params.sparksCount; i++) {
        resetSpark(i, true);
      }
      sparksGeo.setAttribute('position', new THREE.BufferAttribute(sparksPos, 3));
    }
    initSparks();

    const sparksMat = new THREE.PointsMaterial({
      color: new THREE.Color(params.sparksColor),
      size: 0.65,
      map: particleTexture,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const sparksPoints = new THREE.Points(sparksGeo, sparksMat);
    scene.add(sparksPoints);

    // --- VOLUMETRIC DUST SYSTEM (Toroidal Vortex Dust Ring) ---
    const dustGeo = new THREE.BufferGeometry();
    const dustPos = new Float32Array(params.dustCount * 3);
    const dustData = [];

    for (let i = 0; i < params.dustCount; i++) {
      const angle = Math.random() * Math.PI * 2;
      const dist = Math.pow(Math.random(), 0.5) * params.maxRadius;
      const x = params.originX + Math.cos(angle) * dist;
      const y = -5.8 + Math.random() * 2.5;
      const z = params.originZ + Math.sin(angle) * dist;

      dustPos[i * 3] = x;
      dustPos[i * 3 + 1] = y;
      dustPos[i * 3 + 2] = z;

      dustData.push({
        angle: angle,
        dist: dist,
        baseY: y,
        radialSpeed: (Math.random() * 0.5 + 0.5),
        vortexPhase: Math.random() * Math.PI * 2
      });
    }
    dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));

    const dustMat = new THREE.PointsMaterial({
      color: new THREE.Color(params.dustColor),
      size: params.dustSize,
      map: particleTexture,
      transparent: true,
      opacity: 0.55,
      blending: THREE.NormalBlending,
      depthWrite: false
    });
    const dustPoints = new THREE.Points(dustGeo, dustMat);
    scene.add(dustPoints);

    // --- DETONATION & BLAST TIMELINE ---
    let blastTime = 0.0;
    let currentWaveRadius = 0.0;
    let secondaryWaveRadius = 0.0;

    function triggerDetonation(immediate = false) {
      if (immediate) {
        blastTime = 0.0;
      }
      for (let i = 0; i < params.debrisCount; i++) {
        debrisData[i].x = debrisData[i].homeX;
        debrisData[i].y = debrisData[i].homeY;
        debrisData[i].z = debrisData[i].homeZ;
        debrisData[i].vx = 0;
        debrisData[i].vy = 0;
        debrisData[i].vz = 0;
        debrisData[i].triggered = false;
      }
      for (let i = 0; i < params.sparksCount; i++) {
        resetSpark(i, false);
      }

      // GSAP Flash on Core Light
      gsap.killTweensOf(blastCoreLight);
      blastCoreLight.intensity = params.coreLightIntensity * 3.5 * params.lightMultiplier;
      gsap.to(blastCoreLight, {
        intensity: params.coreLightIntensity * params.lightMultiplier,
        duration: 1.2,
        ease: 'power2.out'
      });
    }

    // Apply Composition Mode
    function applyComposition() {
      if (params.compositionMode === 'Center Blast') {
        params.originX = 0.0;
        params.originY = 0.0;
        params.originZ = 0.0;
        params.ringOrientation = 'Face Camera (Billboard)';
        groundMesh.position.y = -8.0;
        gridHelper.position.y = -7.98;
        groundShockMesh.position.y = -7.92;
      } else if (params.compositionMode === 'Ground Impact') {
        params.originX = -12.0;
        params.originY = -5.8;
        params.originZ = 0.0;
        params.ringOrientation = 'Horizontal (Ground)';
        groundMesh.position.y = -6.0;
        gridHelper.position.y = -5.98;
        groundShockMesh.position.y = -5.92;
      }

      const orig = new THREE.Vector3(params.originX, params.originY, params.originZ);
      primaryShockMesh.position.copy(orig);
      secondaryShockMesh.position.copy(orig);
      refractionMesh.position.copy(orig);
      groundShockMaterial.uniforms.uOrigin.value.copy(orig);
      blastCoreLight.position.copy(orig);

      updateFloorVisibility();
    }
    applyComposition();

    // Apply Color Scheme
    function applyScheme(name) {
      const scheme = COLOR_SCHEMES[name];
      if (!scheme) return;
      params.scheme = name;
      params.frontColor = scheme.frontColor;
      params.wakeColor = scheme.wakeColor;
      params.vacuumColor = scheme.vacuumColor;
      params.rimColor = scheme.rimColor;
      params.debrisColor = scheme.debrisColor;
      params.sparksColor = scheme.sparksColor;
      params.dustColor = scheme.dustColor;
      params.coreLightColor = scheme.coreLightColor;
      params.bgColor = scheme.bgColor;

      updateAllVisualColors();
      updateSceneGuiControllers();
    }

    function updateAllVisualColors() {
      if (params.greenscreen) {
        scene.background.set('#00ff00');
      } else {
        scene.background.set(params.bgColor);
      }

      primaryShockMaterial.uniforms.uFrontColor.value.set(params.frontColor);
      primaryShockMaterial.uniforms.uWakeColor.value.set(params.wakeColor);
      primaryShockMaterial.uniforms.uVacuumColor.value.set(params.vacuumColor);
      primaryShockMaterial.uniforms.uRimColor.value.set(params.rimColor);

      secondaryShockMaterial.uniforms.uFrontColor.value.set(params.frontColor);
      secondaryShockMaterial.uniforms.uWakeColor.value.set(params.wakeColor);
      secondaryShockMaterial.uniforms.uVacuumColor.value.set(params.vacuumColor);
      secondaryShockMaterial.uniforms.uRimColor.value.set(params.rimColor);

      refractionMaterial.uniforms.uShockColor.value.set(params.rimColor);
      groundShockMaterial.uniforms.uShockColor.value.set(params.rimColor);

      debrisMat.color.set(params.debrisColor);
      sparksMat.color.set(params.sparksColor);
      dustMat.color.set(params.dustColor);

      blastCoreLight.color.set(params.coreLightColor);
      rimLight.color.set(params.rimColor);
    }

    // --- REBUILD RENDERER FOR ANTIALIAS SETTING ---
    function rebuildRenderer(antialias) {
      const currentCanvas = renderer.domElement;
      const parent = currentCanvas.parentElement;

      renderer.dispose();
      currentCanvas.remove();

      renderer = new THREE.WebGLRenderer({
        antialias: antialias,
        powerPreference: 'high-performance'
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(params.dpr);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = params.exposure;
      renderer.domElement.id = 'webgl-canvas';
      parent.appendChild(renderer.domElement);

      controls.dispose();
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.screenSpacePanning = true;
      controls.minDistance = 3.0;
      controls.maxDistance = 120.0;
      controls.target.set(params.originX, params.originY, params.originZ);
      controls.addEventListener('start', () => { isUserInteracting = true; });
      controls.addEventListener('end', () => { isUserInteracting = false; });

      if (postProcessor) {
        postProcessor.renderer = renderer;
        postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);
      }
    }

    // --- PROCEDURAL RANDOMIZER (DOES NOT TOUCH POSTPROCESSING SETTINGS) ---
    function randomizeScene() {
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const randomKey = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      applyScheme(randomKey);

      // Randomize geometric and motion properties ONLY (Post-Processing settings left untouched)
      params.frontSharpness = 16.0 + Math.random() * 20.0;
      params.frontBrightness = 3.2 + Math.random() * 3.5;
      params.wakeLength = 3.5 + Math.random() * 3.5;
      params.wakeIntensity = 1.6 + Math.random() * 1.8;
      params.vacuumIntensity = 0.5 + Math.random() * 0.45;
      params.secondaryDelay = 0.12 + Math.random() * 0.22;
      params.airDistortion = 0.025 + Math.random() * 0.06;
      params.speed = 0.75 + Math.random() * 0.65;

      const anims = [
        'Static (No Camera Motion)',
        'Slow Cinematic Orbit',
        'Subtle Breathing Drift',
        'Cinematic Low Angle',
        'Top-down Overview',
        'Dramatic Pulse Push',
        'Diagonal Pan & Tilt',
        'Horizon Skim'
      ];
      params.cameraAnimation = anims[Math.floor(Math.random() * anims.length)];
      params.compositionMode = Math.random() > 0.4 ? 'Center Blast' : 'Ground Impact';
      applyComposition();

      primaryShockMaterial.uniforms.uFrontSharpness.value = params.frontSharpness;
      primaryShockMaterial.uniforms.uFrontBrightness.value = params.frontBrightness;
      primaryShockMaterial.uniforms.uWakeLength.value = params.wakeLength;
      primaryShockMaterial.uniforms.uWakeIntensity.value = params.wakeIntensity;
      primaryShockMaterial.uniforms.uVacuumIntensity.value = params.vacuumIntensity;
      refractionMaterial.uniforms.uDistortionStrength.value = params.airDistortion;

      // Update only scene GUI folders, preserving all Post-Processing settings!
      updateSceneGuiControllers();

      triggerDetonation(true);
    }

    // Click Detection on Scene (distinguishes between camera orbit drag and single click)
    let pointerDownPos = { x: 0, y: 0 };
    let pointerDownTime = 0;

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest && e.target.closest('.lil-gui')) return;
      pointerDownPos.x = e.clientX;
      pointerDownPos.y = e.clientY;
      pointerDownTime = performance.now();
    });

    window.addEventListener('pointerup', (e) => {
      if (e.target.closest && e.target.closest('.lil-gui')) return;
      const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
      const time = performance.now() - pointerDownTime;
      if (dist < 6 && time < 400) {
        if (params.randomizeOnClick) {
          randomizeScene();
        }
      }
    });

    // --- GUI SETUP (lil-gui, untouched styles, toggle with 'H' key) ---
    const gui = new GUI({ title: 'Shockwave Controls' });
    window.gui = gui;

    // Theme & Color Schemes Folder (19 Preconfigured Schemes)
    const fTheme = gui.addFolder('Theme & Color Presets');
    fTheme.add(params, 'scheme', Object.keys(COLOR_SCHEMES)).name('Color Scheme').onChange(applyScheme);
    fTheme.add(params, 'greenscreen').name('Greenscreen (#00ff00)').onChange(updateAllVisualColors);
    fTheme.addColor(params, 'bgColor').name('Background Color').onChange(updateAllVisualColors);
    fTheme.addColor(params, 'frontColor').name('Front Edge Color').onChange(updateAllVisualColors);
    fTheme.addColor(params, 'wakeColor').name('Trailing Wake Color').onChange(updateAllVisualColors);
    fTheme.addColor(params, 'vacuumColor').name('Vacuum Dark Tint').onChange(updateAllVisualColors);
    fTheme.addColor(params, 'rimColor').name('Outer Rim Glow').onChange(updateAllVisualColors);
    fTheme.addColor(params, 'debrisColor').name('Debris Shards Color').onChange(updateAllVisualColors);
    fTheme.addColor(params, 'sparksColor').name('Sparks & Embers').onChange(updateAllVisualColors);
    fTheme.addColor(params, 'dustColor').name('Dust Vortex Color').onChange(updateAllVisualColors);

    // Quick Color Versions (White, Cold Blue, Warm Orange)
    const fQuickColors = gui.addFolder('Quick Color Versions');
    fQuickColors.add({ setWarm: () => applyScheme('Original') }, 'setWarm').name('Warm Orange Version');
    fQuickColors.add({ setCold: () => applyScheme('Monochromatic') }, 'setCold').name('Cold Blue Version');
    fQuickColors.add({ setWhite: () => applyScheme('Achromatic (black and white version, white and black)') }, 'setWhite').name('Pure White Version');

    // Composition & Floor Folder
    const fComp = gui.addFolder('Composition & Origin');
    fComp.add(params, 'compositionMode', ['Center Blast', 'Ground Impact']).name('Composition Mode').onChange(applyComposition);
    fComp.add(params, 'showFloor').name('Enable Floor / Ground').onChange(updateFloorVisibility);
    fComp.add(params, 'ringOrientation', [
      'Face Camera (Billboard)',
      'Horizontal (Ground)',
      'Frontal (Vertical)'
    ]).name('Ring Orientation');
    fComp.add(params, 'originX', -25, 25, 0.5).name('Origin X').onChange(applyComposition);
    fComp.add(params, 'originY', -15, 15, 0.5).name('Origin Y').onChange(applyComposition);
    fComp.add(params, 'originZ', -25, 25, 0.5).name('Origin Z').onChange(applyComposition);

    // Shockwave Wavefront & Light Physics Folder
    const fWave = gui.addFolder('Shockwave Wavefront');
    fWave.add(params, 'maxRadius', 10, 60, 1).name('Max Blast Radius');
    fWave.add(params, 'waveDuration', 1.0, 8.0, 0.1).name('Wave Duration (s)');
    fWave.add(params, 'frontSharpness', 4.0, 60.0, 1.0).name('Front Sharpness').onChange(v => {
      primaryShockMaterial.uniforms.uFrontSharpness.value = v;
    });
    fWave.add(params, 'frontBrightness', 1.0, 10.0, 0.1).name('Front Brightness').onChange(v => {
      primaryShockMaterial.uniforms.uFrontBrightness.value = v;
    });
    fWave.add(params, 'wakeLength', 1.0, 14.0, 0.2).name('Wake Length').onChange(v => {
      primaryShockMaterial.uniforms.uWakeLength.value = v;
      groundShockMaterial.uniforms.uWakeLength.value = v;
    });
    fWave.add(params, 'wakeIntensity', 0.5, 6.0, 0.1).name('Wake Intensity').onChange(v => {
      primaryShockMaterial.uniforms.uWakeIntensity.value = v;
    });
    fWave.add(params, 'vacuumIntensity', 0.0, 1.0, 0.05).name('Vacuum Darkening').onChange(v => {
      primaryShockMaterial.uniforms.uVacuumIntensity.value = v;
    });
    fWave.add(params, 'rimGlowIntensity', 0.0, 4.0, 0.1).name('Rim Glow Intensity').onChange(v => {
      primaryShockMaterial.uniforms.uRimIntensity.value = v;
    });
    fWave.add(params, 'secondaryDelay', 0.05, 0.5, 0.01).name('Double Ring Delay');
    fWave.add(params, 'secondaryIntensity', 0.1, 1.0, 0.05).name('Double Ring Intensity').onChange(v => {
      secondaryShockMaterial.uniforms.uFrontBrightness.value = params.frontBrightness * v;
      secondaryShockMaterial.uniforms.uWakeIntensity.value = params.wakeIntensity * v;
    });
    fWave.add(params, 'airDistortion', 0.0, 0.15, 0.005).name('Air Refraction').onChange(v => {
      refractionMaterial.uniforms.uDistortionStrength.value = v;
    });
    fWave.add(params, 'dispersion', 0.0, 0.1, 0.005).name('Chromatic Dispersion').onChange(v => {
      refractionMaterial.uniforms.uDispersion.value = v;
    });

    // Debris & Particles Folder
    const fParts = gui.addFolder('Debris, Sparks & Dust');
    fParts.add(params, 'debrisSpeed', 5.0, 40.0, 1.0).name('Debris Velocity');
    fParts.add(params, 'dustSize', 0.5, 5.0, 0.2).name('Dust Particle Size').onChange(v => {
      dustMat.size = v;
    });

    // 8 Preconfigured Camera Animations Folder
    const fCam = gui.addFolder('Camera & Animation');
    fCam.add(params, 'cameraAnimation', [
      'Static (No Camera Motion)',
      'Slow Cinematic Orbit',
      'Subtle Breathing Drift',
      'Cinematic Low Angle',
      'Top-down Overview',
      'Dramatic Pulse Push',
      'Diagonal Pan & Tilt',
      'Horizon Skim'
    ]).name('Camera Motion');
    fCam.add(params, 'speed', 0.0, 3.0, 0.05).name('Animation Speed');
    fCam.add(params, 'paused').name('Pause Animation');
    fCam.add(params, 'triggerBurst').name('Trigger Blast Detonation');

    // Lighting & Render Settings Folder
    const fRender = gui.addFolder('Lighting & Exposure');
    fRender.add(params, 'antialias').name('Antialias (Default ON)').onChange(rebuildRenderer);
    fRender.add(params, 'dpr', 0.5, 3.0, 0.25).name('Pixel Ratio (DPR)').onChange(v => {
      renderer.setPixelRatio(v);
      refractRenderTarget.setSize(window.innerWidth * v, window.innerHeight * v);
      refractionMaterial.uniforms.uResolution.value.set(window.innerWidth * v, window.innerHeight * v);
      if (postProcessor) {
        postProcessor.setSize(window.innerWidth, window.innerHeight, v);
      }
    });
    fRender.add(params, 'exposure', 0.2, 3.0, 0.05).name('Scene Exposure').onChange(v => {
      renderer.toneMappingExposure = v;
    });
    fRender.add(params, 'lightMultiplier', 0.1, 3.0, 0.05).name('Total Light Multiplier').onChange(v => {
      blastCoreLight.intensity = params.coreLightIntensity * v;
      directionalSunLight.intensity = params.sunLightIntensity * v;
      ambientLight.intensity = params.ambientIntensity * v;
      rimLight.intensity = params.rimLightIntensity * v;
    });

    // Individual Light Sources Folder
    const fLights = gui.addFolder('Individual Light Sources');
    fLights.add(params, 'coreLightIntensity', 0, 30, 0.5).name('Core Light Intensity').onChange(v => {
      blastCoreLight.intensity = v * params.lightMultiplier;
    });
    fLights.addColor(params, 'coreLightColor').name('Core Light Color').onChange(v => {
      blastCoreLight.color.set(v);
    });
    fLights.add(params, 'sunLightIntensity', 0, 8, 0.1).name('Sun Light Intensity').onChange(v => {
      directionalSunLight.intensity = v * params.lightMultiplier;
    });
    fLights.addColor(params, 'sunLightColor').name('Sun Light Color').onChange(v => {
      directionalSunLight.color.set(v);
    });
    fLights.add(params, 'ambientIntensity', 0, 3, 0.05).name('Ambient Light Intensity').onChange(v => {
      ambientLight.intensity = v * params.lightMultiplier;
    });
    fLights.addColor(params, 'ambientColor').name('Ambient Color').onChange(v => {
      ambientLight.color.set(v);
    });
    fLights.add(params, 'rimLightIntensity', 0, 8, 0.1).name('Rim Light Intensity').onChange(v => {
      rimLight.intensity = v * params.lightMultiplier;
    });
    fLights.addColor(params, 'rimLightColor').name('Rim Light Color').onChange(v => {
      rimLight.color.set(v);
    });

    // Attach PostProcessor Controls to lil-gui
    const fPost = postProcessor.attachGUI(gui, "Post-Processing Suite");

    // Procedural Randomize on Click Folder
    const fInteraction = gui.addFolder('Procedural Interaction');
    fInteraction.add(params, 'randomizeOnClick').name('Randomize on Click');

    // List of scene folders (excluding fPost so Postprocessing is never touched on random click)
    const sceneFolders = [fTheme, fQuickColors, fComp, fWave, fParts, fCam, fRender, fLights, fInteraction];
    function updateSceneGuiControllers() {
      sceneFolders.forEach(folder => {
        folder.controllersRecursive().forEach(controller => controller.updateDisplay());
      });
    }

    // UI Toggle with 'H' Key
    let isGuiVisible = true;
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        isGuiVisible = !isGuiVisible;
        if (isGuiVisible) {
          gui.show();
        } else {
          gui.hide();
        }
      }
    });

    // --- CAMERA ANIMATIONS ENGINE ---
    let cameraAnimTime = 0.0;

    function updateCameraAnimation(dt) {
      if (params.cameraAnimation === 'Static (No Camera Motion)') {
        return;
      }

      cameraAnimTime += dt * params.speed;

      // When user is actively dragging or zooming with the mouse, do not interrupt user's hand
      if (isUserInteracting) return;

      const offset = new THREE.Vector3().subVectors(camera.position, controls.target);
      const userRadius = offset.length(); // Retain user zoom distance
      const spherical = new THREE.Spherical().setFromVector3(offset);

      if (params.cameraAnimation === 'Slow Cinematic Orbit') {
        spherical.theta += 0.0035 * params.speed;
      } else if (params.cameraAnimation === 'Subtle Breathing Drift') {
        spherical.theta += Math.sin(cameraAnimTime * 0.4) * 0.002 * params.speed;
        spherical.phi = THREE.MathUtils.clamp(spherical.phi + Math.cos(cameraAnimTime * 0.5) * 0.0015 * params.speed, 0.1, Math.PI - 0.1);
      } else if (params.cameraAnimation === 'Cinematic Low Angle') {
        const targetPhi = Math.PI * 0.46;
        spherical.phi = THREE.MathUtils.lerp(spherical.phi, targetPhi, 0.02);
        spherical.theta += 0.0025 * params.speed;
      } else if (params.cameraAnimation === 'Top-down Overview') {
        const targetPhi = 0.16;
        spherical.phi = THREE.MathUtils.lerp(spherical.phi, targetPhi, 0.02);
        spherical.theta += 0.003 * params.speed;
      } else if (params.cameraAnimation === 'Dramatic Pulse Push') {
        const pulse = Math.exp(-blastTime * 2.5) * Math.sin(blastTime * 8.0) * 0.015;
        spherical.phi = THREE.MathUtils.clamp(spherical.phi + pulse, 0.1, Math.PI - 0.1);
        spherical.theta += 0.002 * params.speed;
      } else if (params.cameraAnimation === 'Diagonal Pan & Tilt') {
        spherical.theta += 0.0025 * params.speed;
        const targetPhi = Math.PI / 3 + Math.sin(cameraAnimTime * 0.4) * 0.14;
        spherical.phi = THREE.MathUtils.lerp(spherical.phi, targetPhi, 0.03);
      } else if (params.cameraAnimation === 'Horizon Skim') {
        const targetPhi = Math.PI * 0.485;
        spherical.phi = THREE.MathUtils.lerp(spherical.phi, targetPhi, 0.03);
        spherical.theta += 0.0035 * params.speed;
      }

      spherical.radius = userRadius; // Preserve manual zoom distance
      offset.setFromSpherical(spherical);
      camera.position.addVectors(controls.target, offset);
    }

    // --- MAIN RENDER & SIMULATION LOOP ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const dt = clock.getDelta();
      const scaledDt = params.paused ? 0.0 : dt * params.speed;

      // Update Shockwave Time Cycle (Infinite auto loop)
      if (!params.paused) {
        blastTime += scaledDt;
        if (blastTime > params.waveDuration) {
          blastTime = 0.0;
          triggerDetonation(false);
        }
      }

      const waveProgress = blastTime / params.waveDuration;
      const expansionFactor = 1.0 - Math.exp(-waveProgress * 3.2);
      currentWaveRadius = expansionFactor * params.maxRadius;

      // Secondary Delayed Wavefront
      const secondaryTime = Math.max(0.0, blastTime - params.secondaryDelay);
      const secondaryProgress = secondaryTime / params.waveDuration;
      const secondaryExpansion = 1.0 - Math.exp(-secondaryProgress * 3.2);
      secondaryWaveRadius = secondaryExpansion * params.maxRadius;

      // Orientation of the Shockwave Ring
      if (params.ringOrientation === 'Face Camera (Billboard)') {
        primaryShockMesh.quaternion.copy(camera.quaternion);
        secondaryShockMesh.quaternion.copy(camera.quaternion);
        refractionMesh.quaternion.copy(camera.quaternion);
      } else if (params.ringOrientation === 'Horizontal (Ground)') {
        primaryShockMesh.rotation.set(-Math.PI / 2, 0, 0);
        secondaryShockMesh.rotation.set(-Math.PI / 2, 0, 0);
        refractionMesh.rotation.set(-Math.PI / 2, 0, 0);
      } else {
        primaryShockMesh.rotation.set(0, 0, 0);
        secondaryShockMesh.rotation.set(0, 0, 0);
        refractionMesh.rotation.set(0, 0, 0);
      }

      // Update Primary Shockwave Uniforms
      primaryShockMaterial.uniforms.uRadius.value = currentWaveRadius;
      primaryShockMaterial.uniforms.uWaveAge.value = waveProgress;
      primaryShockMaterial.uniforms.uTime.value += scaledDt;

      // Update Secondary Shockwave Uniforms
      secondaryShockMaterial.uniforms.uRadius.value = secondaryWaveRadius;
      secondaryShockMaterial.uniforms.uWaveAge.value = secondaryProgress;
      secondaryShockMaterial.uniforms.uTime.value += scaledDt;

      // Update Ground Shockwave Uniforms
      groundShockMaterial.uniforms.uRadius.value = currentWaveRadius;
      groundShockMaterial.uniforms.uWaveAge.value = waveProgress;

      // Update Air Refraction Uniforms
      refractionMaterial.uniforms.uRadius.value = currentWaveRadius;
      refractionMaterial.uniforms.uWaveAge.value = waveProgress;
      refractionMaterial.uniforms.uTime.value += scaledDt;

      // --- SIMULATE DEBRIS SHARDS ---
      if (!params.paused) {
        for (let i = 0; i < params.debrisCount; i++) {
          const deb = debrisData[i];
          const distToOrigin = Math.hypot(deb.homeX - params.originX, deb.homeZ - params.originZ);

          if (!deb.triggered && currentWaveRadius >= distToOrigin) {
            deb.triggered = true;
            const normX = (deb.homeX - params.originX) / (distToOrigin + 0.001);
            const normZ = (deb.homeZ - params.originZ) / (distToOrigin + 0.001);
            const force = (1.0 - (distToOrigin / params.maxRadius)) * params.debrisSpeed;
            deb.vx = normX * force + (Math.random() - 0.5) * 4.0;
            deb.vy = (Math.random() * 0.8 + 0.4) * force;
            deb.vz = normZ * force + (Math.random() - 0.5) * 4.0;
          }

          if (deb.triggered) {
            deb.x += deb.vx * scaledDt;
            deb.y += deb.vy * scaledDt;
            deb.z += deb.vz * scaledDt;

            deb.vy -= 18.0 * scaledDt;
            deb.vx *= (1.0 - 0.8 * scaledDt);
            deb.vz *= (1.0 - 0.8 * scaledDt);

            if (deb.y < -5.85) {
              deb.y = -5.85;
              deb.vy = -deb.vy * 0.35;
              deb.vx *= 0.6;
              deb.vz *= 0.6;
            }

            deb.rotX += deb.vRotX * scaledDt;
            deb.rotY += deb.vRotY * scaledDt;
            deb.rotZ += deb.vRotZ * scaledDt;

            dummy.position.set(deb.x, deb.y, deb.z);
            dummy.rotation.set(deb.rotX, deb.rotY, deb.rotZ);
            dummy.scale.setScalar(deb.scale);
            dummy.updateMatrix();
            debrisInstanced.setMatrixAt(i, dummy.matrix);
          }
        }
        debrisInstanced.instanceMatrix.needsUpdate = true;
      }

      // --- SIMULATE SPARKS & EMBERS ---
      if (!params.paused) {
        for (let i = 0; i < params.sparksCount; i++) {
          const idx = i * 3;
          sparksPos[idx] += sparksVel[idx] * scaledDt;
          sparksPos[idx + 1] += sparksVel[idx + 1] * scaledDt;
          sparksPos[idx + 2] += sparksVel[idx + 2] * scaledDt;

          sparksVel[idx + 1] -= 5.0 * scaledDt;
          sparksVel[idx] *= (1.0 - 0.4 * scaledDt);
          sparksVel[idx + 2] *= (1.0 - 0.4 * scaledDt);

          sparksLife[i] -= scaledDt * 0.45;
          if (sparksLife[i] <= 0.0 || sparksPos[idx + 1] < -5.85) {
            resetSpark(i, false);
          }
        }
        sparksGeo.attributes.position.needsUpdate = true;
      }

      // --- SIMULATE DUST VORTEX ---
      if (!params.paused) {
        for (let i = 0; i < params.dustCount; i++) {
          const d = dustData[i];
          const distToOrigin = Math.hypot(dustPos[i * 3] - params.originX, dustPos[i * 3 + 2] - params.originZ);

          if (currentWaveRadius >= distToOrigin * 0.85) {
            dustPos[i * 3] += Math.cos(d.angle) * d.radialSpeed * 4.5 * scaledDt;
            dustPos[i * 3 + 2] += Math.sin(d.angle) * d.radialSpeed * 4.5 * scaledDt;
            dustPos[i * 3 + 1] = d.baseY + Math.sin(blastTime * 4.0 + d.vortexPhase) * 1.8 + (1.0 - waveProgress) * 0.8;
          }
        }
        dustGeo.attributes.position.needsUpdate = true;
      }

      // Update Camera Motion
      updateCameraAnimation(dt);
      controls.update();

      // Update Godrays Light Position
      if (postProcessor && postProcessor.settings.raysEnabled) {
        postProcessor.setMoonScreenPosition(camera, blastCoreLight.position);
      }

      // --- OPTICAL AIR DISTORTION CAPTURE ---
      if (params.airDistortion > 0.001) {
        refractionMesh.visible = false;

        renderer.setRenderTarget(refractRenderTarget);
        renderer.render(scene, camera);
        renderer.setRenderTarget(null);

        refractionMesh.visible = true;
      } else {
        refractionMesh.visible = false;
      }

      // --- POST PROCESSOR RENDER PIPELINE ---
      if (postProcessor) {
        postProcessor.renderScene(scene, camera);
      } else {
        renderer.render(scene, camera);
      }
    }

    animate();

    // --- WINDOW RESIZE HANDLER ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();

      renderer.setSize(window.innerWidth, window.innerHeight);
      refractRenderTarget.setSize(window.innerWidth * params.dpr, window.innerHeight * params.dpr);
      refractionMaterial.uniforms.uResolution.value.set(window.innerWidth * params.dpr, window.innerHeight * params.dpr);
      if (postProcessor) {
        postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);
      }
    });
  </script>
</body>
</html>
