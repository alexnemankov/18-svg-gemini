<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Isometric Luxury Gift Box Unwrapping - Full Spec Production</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

  <!-- GSAP for organic micro-movements and unboxing transitions -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <!-- Three.js and addons via CDN Import Map -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js",
      "postprocessing/PostProcessor.js": "./postprocessing/PostProcessor.js"
    }

</head>
<body>
  <canvas id="webgl-canvas"></canvas>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import GUI from 'lil-gui';

    // INLINED POST PROCESSOR SUITE (Standalone file:// friendly, high-performance GLSL3)
    // =========================================================================================
    const orthoVertexShader = `
    precision highp float;
    in vec3 position;
    out vec2 vUv;
    void main() {
      vUv = position.xy * 0.5 + 0.5;
      gl_Position = vec4(position, 1.0);
    }
    `;

    const brightFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float bloomThreshold;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float luminance = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float knee = 0.1;
      float soft = luminance - bloomThreshold + knee;
      soft = clamp(soft, 0.0, 2.0 * knee);
      soft = (soft * soft) / (4.0 * knee + 0.00001);
      float contribution = max(soft, luminance - bloomThreshold);
      contribution /= max(luminance, 0.00001);
      fragColor = vec4(color.rgb * contribution, color.a);
    }
    `;

    const blur13ShaderChunk = `
    vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
      vec2 resolution = vec2(textureSize(image, 0));
      vec4 color = vec4(0.0);
      vec2 off1 = vec2(1.411764705882353) * direction;
      vec2 off2 = vec2(3.2941176470588234) * direction;
      vec2 off3 = vec2(5.176470588235294) * direction;
      color += texture(image, uv) * 0.1964825501511404;
      color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
      color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
      return color;
    }
    `;

    const blurFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 direction;
    in vec2 vUv;
    out vec4 color;
    ${blur13ShaderChunk}
    void main() {
      color = blur13(inputTexture, vUv, direction);
    }
    `;

    const godRaysDepthMaskShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float threshold;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float lum = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float factor = smoothstep(threshold, threshold + 0.15, lum);
      fragColor = vec4(vec3(factor), 1.0);
    }
    `;

    const godRaysGenerateShader = `
    precision highp float;
    #define TAPS_PER_PASS 6.0

    uniform sampler2D inputTexture;
    uniform vec3 vSunPositionScreenSpace;
    uniform float fStepSize;
    uniform float distanceAttenuation;
    uniform float maxDensity;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec2 delta = vSunPositionScreenSpace.xy - vUv;
      float dist = length(delta);
      vec2 stepv = fStepSize * delta / max(dist, 0.0001);
      float iters = dist / max(fStepSize, 0.00001);

      vec2 uv = vUv;
      float col = 0.0;
      float f = clamp(vSunPositionScreenSpace.z, 0.0, 1.0);
      float safeAttenExp = max(distanceAttenuation, 0.01);
      float atten = 1.0 / (1.0 + pow(max(dist, 0.00001), safeAttenExp));

      if (0.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (1.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (2.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (3.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (4.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (5.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;

      float finalVal = clamp(col / TAPS_PER_PASS * atten, 0.0, max(maxDensity, 0.0));
      fragColor = vec4(vec3(finalVal), 1.0);
    }
    `;

    const anamorphicBrightShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float threshold;
    uniform float smoothWidth;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float v = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float alpha = smoothstep(threshold, threshold + smoothWidth, v);
      fragColor = mix(vec4(0.0), color, alpha);
    }
    `;

    const anamorphicBlurShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 resolution;
    uniform float samples;
    uniform float intensity;
    uniform vec3 tintColor;
    uniform float bloomRadius;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      int halfSamples = max(1, int(samples) / 2);
      float fHalfSamples = max(float(halfSamples), 1.0);
      vec2 invSize = 1.0 / max(resolution, vec2(1.0));
      vec4 total = vec4(0.0);

      for (int i = -64; i <= 64; i++) {
        if (i < -halfSamples || i > halfSamples) continue;
        float softness = clamp(1.0 - abs(float(i)) / fHalfSamples, 0.0, 1.0);
        softness = softness * softness;
        vec2 shiftedUV = vec2(vUv.x + invSize.x * float(i) * (4.0 + bloomRadius * 8.0), vUv.y);
        shiftedUV = clamp(shiftedUV, 0.001, 0.999);
        total += texture(inputTexture, shiftedUV) * softness;
      }

      float denom = max(samples / 3.0, 0.001);
      fragColor = (total / denom) * vec4(max(tintColor, vec3(0.0)), 1.0) * max(intensity, 0.0);
    }
    `;

    const finalFragmentShader = `
    precision highp float;
    uniform vec2 resolution;
    uniform sampler2D inputTexture;
    uniform sampler2D blur0Texture;
    uniform sampler2D blur1Texture;
    uniform sampler2D blur2Texture;
    uniform sampler2D blur3Texture;
    uniform sampler2D blur4Texture;
    uniform sampler2D raysTexture;
    uniform sampler2D anamorphicTexture;
    uniform bool bloomEnabled;
    uniform float bloomStrength;
    uniform bool raysEnabled;
    uniform float raysStrength;
    uniform vec3 raysColor;
    uniform bool anamorphicEnabled;
    uniform float vignetteBoost;
    uniform float vignetteReduction;
    uniform float noiseIntensity;
    uniform float time;
    in vec2 vUv;
    out vec4 fragColor;

    float vignette(vec2 uv, float boost, float reduction) {
      vec2 position = uv - 0.5;
      return clamp(boost - length(position) * reduction, 0.0, 2.0);
    }

    float filmNoise(vec2 coord, float t) {
      float n = fract(sin(dot(coord + fract(t * 0.05), vec2(12.9898, 78.233))) * 43758.5453);
      return (n - 0.5) * 2.0;
    }

    void main() {
      vec4 color = texture(inputTexture, vUv);

      if (bloomEnabled && bloomStrength > 0.001) {
        vec4 b0 = texture(blur0Texture, vUv);
        vec4 b1 = texture(blur1Texture, vUv);
        vec4 b2 = texture(blur2Texture, vUv);
        vec4 b3 = texture(blur3Texture, vUv);
        vec4 b4 = texture(blur4Texture, vUv);

        vec4 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
        color += bloomSum * bloomStrength;
      }

      if (raysEnabled && raysStrength > 0.001) {
        vec4 r = texture(raysTexture, vUv);
        color.rgb += r.rgb * raysColor * raysStrength;
      }

      if (anamorphicEnabled) {
        vec4 a = texture(anamorphicTexture, vUv);
        color.rgb += a.rgb;
      }

      color.rgb *= vignette(vUv, vignetteBoost, vignetteReduction);
      color.rgb += max(noiseIntensity, 0.0) * filmNoise(gl_FragCoord.xy, time) * 0.035;
      fragColor = vec4(max(color.rgb, vec3(0.0)), 1.0);
    }
    `;

    const chromaticAberrationShaderChunk = `
    vec2 barrelDistortion(vec2 coord, float amt) {
      vec2 cc = coord - 0.5;
      float dist = dot(cc, cc);
      return coord + cc * dist * amt;
    }
    float sat(float t) { return clamp(t, 0.0, 1.0); }
    float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
    float remap(float t, float a, float b) { return sat((t - a) / max(b - a, 0.0001)); }
    vec4 spectrum_offset(float t) {
      float lo = step(t, 0.5);
      float hi = 1.0 - lo;
      float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
      vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
      return pow(clamp(ret, 0.0, 1.0), vec4(1.0 / 2.2));
    }
    const float max_distort = 2.2;
    const int num_iter = 8;
    const float reci_num_iter_f = 1.0 / float(num_iter);
    vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
      vec4 sumcol = vec4(0.0);
      vec4 sumw = vec4(0.0);
      for (int i = 0; i < num_iter; ++i) {
        float t = float(i) * reci_num_iter_f;
        vec4 w = spectrum_offset(t);
        sumw += w;
        vec2 sampleUv = clamp(barrelDistortion(uv, amount * max_distort * t), 0.0, 1.0);
        sumcol += w * texture(inputTexture, sampleUv);
      }
      return sumcol / max(sumw, vec4(0.0001));
    }
    `;

    const colorFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float chromaticAberrationAmount;
    uniform float minInputLevel;
    uniform float maxInputLevel;
    uniform float gammaLevel;
    uniform float exposure;
    uniform float fisheyeStrength;
    uniform float fisheyeRadius;
    uniform float time;
    uniform int visionMode;
    uniform float thermalSensitivity;
    uniform float nightVisionNoise;
    uniform float nightVisionGain;
    uniform float crtIntensity;
    in vec2 vUv;
    out vec4 fragColor;

    ${chromaticAberrationShaderChunk}

    vec2 applyFisheye(vec2 uv, float strength, float radius) {
      if (abs(strength) < 0.0001) return uv;
      vec2 p = uv - 0.5;
      float d = length(p);
      if (d > radius * 1.5) return uv;
      float r = d / max(radius, 0.001);
      float theta = atan(p.y, p.x);
      float rDist = r + strength * (r * r * r);
      return clamp(0.5 + vec2(cos(theta), sin(theta)) * (rDist * radius), 0.0, 1.0);
    }

    vec3 ACESFilmicToneMapping(vec3 color) {
      color = max(color, vec3(0.0));
      float a = 2.51;
      float b = 0.03;
      float c = 2.43;
      float d = 0.59;
      float e = 0.14;
      vec3 denom = color * (c * color + d) + e;
      return clamp((color * (a * color + b)) / max(denom, vec3(0.0001)), 0.0, 1.0);
    }

    vec3 gammaCorrect(vec3 color, vec3 gamma) {
      return pow(clamp(color, 0.0, 1.0), 1.0 / max(gamma, vec3(0.001)));
    }
    vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
      return clamp((color - minInput) / max(maxInput - minInput, vec3(0.0001)), 0.0, 1.0);
    }
    vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
      return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
    }

    vec3 applyNightVision(vec3 color, vec2 uv, float timeVal, float noiseAmt, float gain, float crt) {
      float lum = dot(color, vec3(0.299, 0.587, 0.114));
      float amplified = pow(lum * gain, 0.72);
      vec3 phosphorColor = mix(vec3(0.02, 0.12, 0.03), vec3(0.18, 1.0, 0.32), clamp(amplified, 0.0, 1.0));
      phosphorColor += vec3(0.7, 1.0, 0.8) * max(0.0, amplified - 0.75) * 1.8;
      vec2 p = uv - 0.5;
      float tubeDist = length(p);
      float tubeMask = smoothstep(0.72, 0.44, tubeDist);
      float n = fract(sin(dot(uv * 280.0 + timeVal * 0.05, vec2(12.9898, 78.233))) * 43758.5453);
      float scanline = sin(uv.y * 650.0) * crt;
      phosphorColor += (n - 0.5) * noiseAmt * 2.0 + scanline;
      return clamp(phosphorColor * tubeMask, 0.0, 1.0);
    }

    vec3 ironbow(float t) {
      t = clamp(t, 0.0, 1.0);
      vec3 c0 = vec3(0.02, 0.01, 0.18);
      vec3 c1 = vec3(0.22, 0.02, 0.48);
      vec3 c2 = vec3(0.82, 0.05, 0.25);
      vec3 c3 = vec3(1.0, 0.62, 0.02);
      vec3 c4 = vec3(1.0, 1.0, 0.92);
      if (t < 0.25) return mix(c0, c1, t * 4.0);
      if (t < 0.50) return mix(c1, c2, (t - 0.25) * 4.0);
      if (t < 0.75) return mix(c2, c3, (t - 0.50) * 4.0);
      return mix(c3, c4, (t - 0.75) * 4.0);
    }

    vec3 applyThermal(vec3 color, vec2 uv, float sensitivity, float crt, bool whiteHot) {
      float lum = dot(color, vec3(0.299, 0.587, 0.114));
      float heat = clamp(lum * sensitivity, 0.0, 1.0);
      float sensorRaster = sin(uv.y * 900.0) * (crt * 0.3);
      heat = clamp(heat + sensorRaster, 0.0, 1.0);
      if (whiteHot) {
        return vec3(pow(heat, 0.85));
      } else {
        return ironbow(heat);
      }
    }

    void main() {
      vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
      vec4 col = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
      vec3 finalCol = col.rgb;

      if (visionMode == 1) {
        finalCol = applyNightVision(finalCol, uv, time, nightVisionNoise, nightVisionGain, crtIntensity);
      } else if (visionMode == 2) {
        finalCol = applyThermal(finalCol, uv, thermalSensitivity, crtIntensity, false);
      } else if (visionMode == 3) {
        finalCol = applyThermal(finalCol, uv, thermalSensitivity, crtIntensity, true);
      } else {
        vec3 exposedColor = finalCol * exposure;
        vec3 toneMappedColor = ACESFilmicToneMapping(exposedColor);
        finalCol = finalLevels(toneMappedColor, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
      }

      fragColor = vec4(finalCol, 1.0);
    }
    `;

    const copyFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      fragColor = texture(inputTexture, vUv);
    }
    `;

    function createFBO(w, h, options = {}) {
      return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
        wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
        wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
        minFilter: options.minFilter || THREE.LinearFilter,
        magFilter: options.magFilter || THREE.LinearFilter,
        format: options.format || THREE.RGBAFormat,
        type: options.type || THREE.HalfFloatType,
        stencilBuffer: options.stencilBuffer || false,
        depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : true,
        samples: options.samples || 0,
      });
    }

    class ShaderPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbo = createFBO(1, 1, options);
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoQuad.frustumCulled = false;
        this.orthoScene.add(this.orthoQuad);
        this.texture = this.fbo.texture;
      }
      render(renderer, toScreen = false) {
        if (!toScreen) {
          renderer.setRenderTarget(this.fbo);
        }
        renderer.render(this.orthoScene, this.orthoCamera);
        if (!toScreen) {
          renderer.setRenderTarget(null);
        }
      }
      setSize(width, height) {
        this.fbo.setSize(Math.max(1, width), Math.max(1, height));
      }
    }

    class ShaderPingPongPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
        this.currentFBO = 0;
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoQuad.frustumCulled = false;
        this.orthoScene.add(this.orthoQuad);
      }
      render(renderer) {
        renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
        renderer.render(this.orthoScene, this.orthoCamera);
        renderer.setRenderTarget(null);
        this.currentFBO = 1 - this.currentFBO;
      }
      get current() { return this.fbos[this.currentFBO]; }
      get texture() { return this.current.texture; }
      setSize(width, height) {
        const w = Math.max(1, width);
        const h = Math.max(1, height);
        this.fbos[0].setSize(w, h);
        this.fbos[1].setSize(w, h);
      }
    }

    class BloomPass {
      constructor(strength = 0.8, radius = 0.5, threshold = 0.2, levels = 5) {
        this.strength = strength;
        this.radius = radius;
        this.threshold = threshold;
        this.enabled = true;
        this.levels = levels;

        this.brightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            bloomThreshold: { value: this.threshold },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: brightFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.brightPass = new ShaderPass(this.brightShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.blurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            direction: { value: new THREE.Vector2(0, 1) },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: blurFragmentShader,
          glslVersion: THREE.GLSL3,
        });

        this.blurPasses = [];
        for (let i = 0; i < this.levels; i++) {
          this.blurPasses.push(new ShaderPingPongPass(this.blurShader, {
            format: THREE.RGBAFormat,
            type: THREE.HalfFloatType,
          }));
        }
      }

      setSize(w, h) {
        let tw = Math.max(1, w);
        let th = Math.max(1, h);
        this.brightPass.setSize(tw, th);
        for (let i = 0; i < this.levels; i++) {
          tw = Math.max(1, Math.round(tw / 2));
          th = Math.max(1, Math.round(th / 2));
          this.blurPasses[i].setSize(tw, th);
        }
      }

      set source(texture) {
        this.brightShader.uniforms.inputTexture.value = texture;
      }

      render(renderer) {
        if (!this.enabled || this.strength <= 0.001) return;

        this.brightShader.uniforms.bloomThreshold.value = this.threshold;
        this.brightPass.render(renderer);

        const baseOffset = Math.max(0.1, this.radius * 2.0);
        const u = this.blurShader.uniforms;

        for (let j = 0; j < this.levels; j++) {
          const blurPass = this.blurPasses[j];
          const stepOffset = baseOffset * (1.0 + j * 0.5);

          u.direction.value.set(stepOffset, 0);
          u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
          blurPass.render(renderer);

          u.direction.value.set(0, stepOffset * 0.5);
          u.inputTexture.value = blurPass.current.texture;
          blurPass.render(renderer);
        }
      }
    }

    const VISION_MODE_MAP = {
      'Normal (Cinematic)': 0,
      'Night Vision (Phosphor)': 1,
      'Thermal (Ironbow)': 2,
      'Thermal (White-Hot)': 3,
    };

    class PostProcessor {
      constructor(renderer, params = {}) {
        this.renderer = renderer;

        this.settings = {
          enabled: params.enabled !== undefined ? params.enabled : true,
          antialias: params.antialias !== undefined ? params.antialias : true,
          bloomEnabled: params.bloomEnabled !== undefined ? params.bloomEnabled : true,
          bloomStrength: params.bloomStrength !== undefined ? params.bloomStrength : 0.75,
          bloomRadius: params.bloomRadius !== undefined ? params.bloomRadius : 0.45,
          bloomThreshold: params.bloomThreshold !== undefined ? params.bloomThreshold : 0.65,

          raysEnabled: params.raysEnabled !== undefined ? params.raysEnabled : true,
          raysStrength: params.raysStrength !== undefined ? params.raysStrength : 0.65,
          raysDensity: params.raysDensity !== undefined ? params.raysDensity : 1.0,
          raysMaxDensity: params.raysMaxDensity !== undefined ? params.raysMaxDensity : 0.45,
          raysDistanceAttenuation: params.raysDistanceAttenuation !== undefined ? params.raysDistanceAttenuation : 2.0,
          raysThreshold: params.raysThreshold !== undefined ? params.raysThreshold : 0.35,
          raysColor: params.raysColor ? (params.raysColor.isColor ? params.raysColor.clone() : new THREE.Color(params.raysColor)) : new THREE.Color(0xffaa55),
          raysColorHex: params.raysColorHex || '#ffaa55',

          anamorphicEnabled: params.anamorphicEnabled !== undefined ? params.anamorphicEnabled : true,
          anamorphicIntensity: params.anamorphicIntensity !== undefined ? params.anamorphicIntensity : 4.5,
          anamorphicThreshold: params.anamorphicThreshold !== undefined ? params.anamorphicThreshold : 0.4,
          anamorphicSamples: params.anamorphicSamples !== undefined ? params.anamorphicSamples : 64,
          anamorphicRadius: params.anamorphicRadius !== undefined ? params.anamorphicRadius : 0.15,
          anamorphicSmoothWidth: params.anamorphicSmoothWidth !== undefined ? params.anamorphicSmoothWidth : 0.05,
          anamorphicColor: params.anamorphicColor ? (params.anamorphicColor.isColor ? params.anamorphicColor.clone() : new THREE.Color(params.anamorphicColor)) : new THREE.Color(0xff99bb),
          anamorphicColorHex: params.anamorphicColorHex || '#ff99bb',

          visionMode: params.visionMode !== undefined ? params.visionMode : 'Normal (Cinematic)',
          thermalSensitivity: params.thermalSensitivity !== undefined ? params.thermalSensitivity : 1.4,
          nightVisionGain: params.nightVisionGain !== undefined ? params.nightVisionGain : 2.1,
          nightVisionNoise: params.nightVisionNoise !== undefined ? params.nightVisionNoise : 0.05,
          crtIntensity: params.crtIntensity !== undefined ? params.crtIntensity : 0.0,

          fisheyeStrength: params.fisheyeStrength !== undefined ? params.fisheyeStrength : 0.0,
          fisheyeRadius: params.fisheyeRadius !== undefined ? params.fisheyeRadius : 1.0,
          chromaticAberration: params.chromaticAberration !== undefined ? params.chromaticAberration : 0.016,
          vignetteBoost: params.vignetteBoost !== undefined ? params.vignetteBoost : 1.1,
          vignetteReduction: params.vignetteReduction !== undefined ? params.vignetteReduction : 0.58,
          noiseIntensity: params.noiseIntensity !== undefined ? params.noiseIntensity : 0.015,

          gamma: params.gamma !== undefined ? params.gamma : 1.0,
          minInputLevel: params.minInputLevel !== undefined ? params.minInputLevel : 0.0,
          maxInputLevel: params.maxInputLevel !== undefined ? params.maxInputLevel : 1.0,
          exposure: params.exposure !== undefined ? params.exposure : 1.0,
        };

        this.sceneTarget = createFBO(1, 1, {
          type: THREE.HalfFloatType,
          samples: this.settings.antialias ? 4 : 0
        });
        this.bloomPass = new BloomPass(this.settings.bloomStrength, this.settings.bloomRadius, this.settings.bloomThreshold, 5);

        this.moonScreenPos = new THREE.Vector3(0.5, 0.7, 1.0);
        this.moonInFront = true;

        this.godRaysMaskShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            threshold: { value: this.settings.raysThreshold },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: godRaysDepthMaskShader,
          glslVersion: THREE.GLSL3,
        });
        this.godRaysMaskPass = new ShaderPass(this.godRaysMaskShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.godRaysGenShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            vSunPositionScreenSpace: { value: this.moonScreenPos },
            fStepSize: { value: 1.0 },
            distanceAttenuation: { value: this.settings.raysDistanceAttenuation },
            maxDensity: { value: this.settings.raysMaxDensity },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: godRaysGenerateShader,
          glslVersion: THREE.GLSL3,
        });
        this.godRaysPingPong = new ShaderPingPongPass(this.godRaysGenShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.anamorphicBrightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            threshold: { value: this.settings.anamorphicThreshold },
            smoothWidth: { value: this.settings.anamorphicSmoothWidth },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: anamorphicBrightShader,
          glslVersion: THREE.GLSL3,
        });
        this.anamorphicBrightPass = new ShaderPass(this.anamorphicBrightShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.anamorphicBlurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            resolution: { value: new THREE.Vector2(1, 1) },
            samples: { value: this.settings.anamorphicSamples },
            intensity: { value: this.settings.anamorphicIntensity },
            tintColor: { value: this.settings.anamorphicColor },
            bloomRadius: { value: this.settings.anamorphicRadius },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: anamorphicBlurShader,
          glslVersion: THREE.GLSL3,
        });
        this.anamorphicBlurPass = new ShaderPass(this.anamorphicBlurShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.finalShader = new THREE.RawShaderMaterial({
          uniforms: {
            resolution: { value: new THREE.Vector2(1, 1) },
            bloomEnabled: { value: this.settings.bloomEnabled },
            bloomStrength: { value: this.settings.bloomStrength },
            raysEnabled: { value: this.settings.raysEnabled },
            raysStrength: { value: this.settings.raysStrength },
            raysColor: { value: this.settings.raysColor },
            anamorphicEnabled: { value: this.settings.anamorphicEnabled },
            vignetteBoost: { value: this.settings.vignetteBoost },
            vignetteReduction: { value: this.settings.vignetteReduction },
            noiseIntensity: { value: this.settings.noiseIntensity },
            inputTexture: { value: null },
            blur0Texture: { value: null },
            blur1Texture: { value: null },
            blur2Texture: { value: null },
            blur3Texture: { value: null },
            blur4Texture: { value: null },
            raysTexture: { value: null },
            anamorphicTexture: { value: null },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: finalFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.finalPass = new ShaderPass(this.finalShader);

        this.rgbShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: this.finalPass.texture },
            fisheyeStrength: { value: this.settings.fisheyeStrength },
            fisheyeRadius: { value: this.settings.fisheyeRadius },
            chromaticAberrationAmount: { value: this.settings.chromaticAberration },
            minInputLevel: { value: this.settings.minInputLevel },
            maxInputLevel: { value: this.settings.maxInputLevel },
            gammaLevel: { value: this.settings.gamma },
            exposure: { value: this.settings.exposure },
            visionMode: { value: VISION_MODE_MAP[this.settings.visionMode] ?? 0 },
            thermalSensitivity: { value: this.settings.thermalSensitivity },
            nightVisionGain: { value: this.settings.nightVisionGain },
            nightVisionNoise: { value: this.settings.nightVisionNoise },
            crtIntensity: { value: this.settings.crtIntensity },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: colorFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.rgbPass = new ShaderPass(this.rgbShader);

        this.copyShader = new THREE.RawShaderMaterial({
          uniforms: { inputTexture: { value: null } },
          vertexShader: orthoVertexShader,
          fragmentShader: copyFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.copyPass = new ShaderPass(this.copyShader);
      }

      updateSettings() {
        this.bloomPass.enabled = this.settings.bloomEnabled;
        this.bloomPass.strength = this.settings.bloomStrength;
        this.bloomPass.radius = this.settings.bloomRadius;
        this.bloomPass.threshold = this.settings.bloomThreshold;

        this.godRaysMaskShader.uniforms.threshold.value = this.settings.raysThreshold;
        this.godRaysGenShader.uniforms.distanceAttenuation.value = this.settings.raysDistanceAttenuation;
        this.godRaysGenShader.uniforms.maxDensity.value = this.settings.raysMaxDensity;

        this.anamorphicBrightShader.uniforms.threshold.value = this.settings.anamorphicThreshold;
        this.anamorphicBrightShader.uniforms.smoothWidth.value = this.settings.anamorphicSmoothWidth;
        this.anamorphicBlurShader.uniforms.samples.value = this.settings.anamorphicSamples;
        this.anamorphicBlurShader.uniforms.intensity.value = this.settings.anamorphicIntensity;
        this.anamorphicBlurShader.uniforms.tintColor.value.copy(this.settings.anamorphicColor);
        this.anamorphicBlurShader.uniforms.bloomRadius.value = this.settings.anamorphicRadius;

        this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
        this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
        this.finalShader.uniforms.raysEnabled.value = this.settings.raysEnabled && this.moonInFront;
        this.finalShader.uniforms.raysStrength.value = this.settings.raysStrength;
        this.finalShader.uniforms.raysColor.value.copy(this.settings.raysColor);
        this.finalShader.uniforms.anamorphicEnabled.value = this.settings.anamorphicEnabled;
        this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
        this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
        this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;

        this.rgbShader.uniforms.fisheyeStrength.value = this.settings.fisheyeStrength;
        this.rgbShader.uniforms.fisheyeRadius.value = this.settings.fisheyeRadius;
        this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
        this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
        this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
        this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
        this.rgbShader.uniforms.exposure.value = this.settings.exposure;
        this.rgbShader.uniforms.visionMode.value = VISION_MODE_MAP[this.settings.visionMode] ?? 0;
        this.rgbShader.uniforms.thermalSensitivity.value = this.settings.thermalSensitivity;
        this.rgbShader.uniforms.nightVisionGain.value = this.settings.nightVisionGain;
        this.rgbShader.uniforms.nightVisionNoise.value = this.settings.nightVisionNoise;
        this.rgbShader.uniforms.crtIntensity.value = this.settings.crtIntensity;
      }

      setSize(w0, h0, dpr = 1) {
        const w = Math.max(1, Math.floor(w0 * dpr));
        const h = Math.max(1, Math.floor(h0 * dpr));
        this.sceneTarget.setSize(w, h);
        this.finalPass.setSize(w, h);
        this.finalShader.uniforms.resolution.value.set(w, h);
        this.bloomPass.setSize(w, h);

        const grW = Math.max(1, Math.round(w / 2));
        const grH = Math.max(1, Math.round(h / 2));
        this.godRaysMaskPass.setSize(grW, grH);
        this.godRaysPingPong.setSize(grW, grH);

        const anW = Math.max(1, Math.round(w / 4));
        const anH = Math.max(1, Math.round(h / 4));
        this.anamorphicBrightPass.setSize(anW, anH);
        this.anamorphicBlurPass.setSize(anW, anH);
        this.anamorphicBlurShader.uniforms.resolution.value.set(anW, anH);

        this.rgbPass.setSize(w, h);
        this.copyPass.setSize(w, h);
      }

      setMoonScreenPosition(camera, lightPos) {
        if (!this._camDir) {
          this._camDir = new THREE.Vector3();
          this._toLight = new THREE.Vector3();
          this._ndc = new THREE.Vector3();
        }
        camera.getWorldDirection(this._camDir);
        this._toLight.copy(lightPos).sub(camera.position).normalize();
        const dot = this._camDir.dot(this._toLight);

        if (dot <= 0.05) {
          this.moonInFront = false;
          this.finalShader.uniforms.raysEnabled.value = false;
          return;
        }

        this.moonInFront = true;
        const fade = THREE.MathUtils.clamp((dot - 0.05) / 0.15, 0.0, 1.0);
        this._ndc.copy(lightPos).project(camera);
        const screenX = THREE.MathUtils.clamp(this._ndc.x * 0.5 + 0.5, 0.0, 1.0);
        const screenY = THREE.MathUtils.clamp(this._ndc.y * 0.5 + 0.5, 0.0, 1.0);
        const screenZ = fade;

        this.moonScreenPos.set(screenX, screenY, screenZ);
        this.godRaysGenShader.uniforms.vSunPositionScreenSpace.value.set(screenX, screenY, screenZ);
      }

      renderScene(scene, camera) {
        if (!this.settings.enabled) {
          this.renderer.render(scene, camera);
          return;
        }
        const prevToneMapping = this.renderer.toneMapping;
        this.renderer.toneMapping = THREE.NoToneMapping;
        this.renderer.setRenderTarget(this.sceneTarget);
        this.renderer.render(scene, camera);
        this.renderer.setRenderTarget(null);
        this.renderer.toneMapping = prevToneMapping;
        this.render(this.sceneTarget.texture);
      }

      render(sourceTexture) {
        if (!this.settings.enabled) {
          this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
          this.copyPass.render(this.renderer, true);
          return;
        }

        this.updateSettings();

        // 1. Atmospheric Bloom
        this.bloomPass.source = sourceTexture;
        this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
        this.bloomPass.render(this.renderer);

        this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
        this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
        this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
        this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
        this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

        // 2. Volumetric Godrays
        if (this.settings.raysEnabled && this.settings.raysStrength > 0.001 && this.moonInFront) {
          this.godRaysMaskShader.uniforms.inputTexture.value = sourceTexture;
          this.godRaysMaskShader.uniforms.threshold.value = this.settings.raysThreshold;
          this.godRaysMaskPass.render(this.renderer);

          const filterLen = this.settings.raysDensity;
          const tapsPerPass = 6.0;

          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -1.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysMaskPass.texture;
          this.godRaysPingPong.render(this.renderer);

          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -2.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysPingPong.texture;
          this.godRaysPingPong.render(this.renderer);

          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -3.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysPingPong.texture;
          this.godRaysPingPong.render(this.renderer);

          this.finalPass.shader.uniforms.raysTexture.value = this.godRaysPingPong.texture;
          this.finalPass.shader.uniforms.raysEnabled.value = true;
        } else {
          this.finalPass.shader.uniforms.raysEnabled.value = false;
        }

        // 3. Anamorphic Horizontal Flare Streaks
        if (this.settings.anamorphicEnabled && this.settings.anamorphicIntensity > 0.001) {
          this.anamorphicBrightShader.uniforms.inputTexture.value = sourceTexture;
          this.anamorphicBrightShader.uniforms.threshold.value = this.settings.anamorphicThreshold;
          this.anamorphicBrightShader.uniforms.smoothWidth.value = this.settings.anamorphicSmoothWidth;
          this.anamorphicBrightPass.render(this.renderer);

          this.anamorphicBlurShader.uniforms.inputTexture.value = this.anamorphicBrightPass.texture;
          this.anamorphicBlurShader.uniforms.samples.value = this.settings.anamorphicSamples;
          this.anamorphicBlurShader.uniforms.intensity.value = this.settings.anamorphicIntensity;
          this.anamorphicBlurShader.uniforms.tintColor.value.copy(this.settings.anamorphicColor);
          this.anamorphicBlurShader.uniforms.bloomRadius.value = this.settings.anamorphicRadius;
          this.anamorphicBlurPass.render(this.renderer);

          this.finalPass.shader.uniforms.anamorphicTexture.value = this.anamorphicBlurPass.texture;
          this.finalPass.shader.uniforms.anamorphicEnabled.value = true;
        } else {
          this.finalPass.shader.uniforms.anamorphicEnabled.value = false;
        }

        const randomTime = Math.random() * 100000;
        this.finalPass.shader.uniforms.time.value = randomTime;
        this.rgbPass.shader.uniforms.time.value = randomTime;

        this.finalPass.render(this.renderer);
        this.rgbPass.render(this.renderer, true);
      }

      setAntialias(enabled) {
        this.settings.antialias = !!enabled;
        params.antialias = this.settings.antialias;
        const desiredSamples = this.settings.antialias ? 4 : 0;
        if (this.sceneTarget.samples !== desiredSamples) {
          this.sceneTarget.samples = desiredSamples;
          this.sceneTarget.dispose();
        }
        if (typeof antialiasController !== 'undefined' && antialiasController) antialiasController.updateDisplay();
        if (typeof ppAntialiasController !== 'undefined' && ppAntialiasController) ppAntialiasController.updateDisplay();
      }

      attachGUI(gui, title = "Post-Processing Suite") {
        const root = gui.addFolder(title);
        root.close();
        root.add(this.settings, "enabled").name("Enable Post-Process");
        ppAntialiasController = root.add(this.settings, "antialias").name("Scene Antialias (MSAA)").onChange((v) => this.setAntialias(v));

        // 1. Vision Modes (Night Vision & Thermal)
        const vision = root.addFolder("Thermal & Night Vision");
        vision.close();
        vision.add(this.settings, "visionMode", Object.keys(VISION_MODE_MAP)).name("Vision Mode").onChange(() => this.updateSettings());
        vision.add(this.settings, "nightVisionGain", 0.5, 5.0, 0.1).name("NVG Gain").onChange(() => this.updateSettings());
        vision.add(this.settings, "nightVisionNoise", 0.0, 0.3, 0.01).name("NVG Sensor Noise").onChange(() => this.updateSettings());
        vision.add(this.settings, "thermalSensitivity", 0.5, 3.5, 0.05).name("Thermal Sensitivity").onChange(() => this.updateSettings());
        vision.add(this.settings, "crtIntensity", 0.0, 0.1, 0.005).name("CRT Scanlines").onChange(() => this.updateSettings());

        // 2. Volumetric Godrays
        const rays = root.addFolder("Volumetric Godrays");
        rays.close();
        rays.add(this.settings, "raysEnabled").name("Enable Godrays").onChange(() => this.updateSettings());
        rays.add(this.settings, "raysStrength", 0, 3.0, 0.05).name("Intensity").onChange(() => this.updateSettings());
        rays.add(this.settings, "raysDensity", 0.1, 2.5, 0.05).name("Density (Spread)").onChange(() => this.updateSettings());
        rays.add(this.settings, "raysMaxDensity", 0.1, 1.0, 0.05).name("Max Density").onChange(() => this.updateSettings());
        rays.add(this.settings, "raysDistanceAttenuation", 0.5, 4.0, 0.1).name("Distance Atten").onChange(() => this.updateSettings());
        rays.add(this.settings, "raysThreshold", 0.0, 0.8, 0.01).name("Light Threshold").onChange(() => this.updateSettings());
        rays.addColor(this.settings, "raysColorHex").name("Ray Tint").onChange((v) => {
          this.settings.raysColor.set(v);
          this.updateSettings();
        });

        // 3. Atmospheric Bloom
        const bloom = root.addFolder("Atmospheric Bloom");
        bloom.close();
        bloom.add(this.settings, "bloomEnabled").name("Enable Bloom").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomStrength", 0, 3.0, 0.05).name("Bloom Strength").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomRadius", 0, 2.0, 0.05).name("Bloom Radius").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomThreshold", 0, 1.0, 0.01).name("Bloom Threshold").onChange(() => this.updateSettings());

        // 4. Anamorphic Lens Flares
        const anamorphic = root.addFolder("Anamorphic Lens Flares");
        anamorphic.add(this.settings, "anamorphicEnabled").name("Enable Anamorphic").onChange(() => this.updateSettings());
        anamorphic.add(this.settings, "anamorphicIntensity", 0.0, 10.0, 0.1).name("Streak Intensity").onChange(() => this.updateSettings());
        anamorphic.add(this.settings, "anamorphicThreshold", 0.0, 1.0, 0.02).name("Streak Threshold").onChange(() => this.updateSettings());
        anamorphic.add(this.settings, "anamorphicRadius", 0.01, 0.5, 0.01).name("Streak Length / Radius").onChange(() => this.updateSettings());
        anamorphic.add(this.settings, "anamorphicSamples", [16, 32, 64, 128]).name("Quality Samples").onChange(() => this.updateSettings());
        anamorphic.add(this.settings, "anamorphicSmoothWidth", 0.01, 0.3, 0.01).name("Smooth Falloff").onChange(() => this.updateSettings());
        anamorphic.addColor(this.settings, "anamorphicColorHex").name("Streak Tint Color").onChange((v) => {
          this.settings.anamorphicColor.set(v);
          this.updateSettings();
        });

        // 5. Lens Optics & Aberration
        const optics = root.addFolder("Lens Optics & Aberration");
        optics.close();
        optics.add(this.settings, "chromaticAberration", 0.0, 0.05, 0.001).name("Chromatic Aberration").onChange(() => this.updateSettings());
        optics.add(this.settings, "vignetteBoost", 0.0, 3.0, 0.05).name("Vignette Falloff").onChange(() => this.updateSettings());
        optics.add(this.settings, "vignetteReduction", 0.0, 1.0, 0.02).name("Vignette Darkness").onChange(() => this.updateSettings());
        optics.add(this.settings, "noiseIntensity", 0.0, 0.08, 0.002).name("Film Grain").onChange(() => this.updateSettings());

        // 6. Color Grading & Levels
        const grading = root.addFolder("Color Grading & Levels");
        grading.close();
        grading.add(this.settings, "fisheyeStrength", -0.8, 0.8, 0.01).name("Fisheye Distortion").onChange(() => this.updateSettings());
        grading.add(this.settings, "fisheyeRadius", 0.2, 2.0, 0.05).name("Fisheye Radius").onChange(() => this.updateSettings());
        grading.add(this.settings, "gamma", 0.2, 2.0, 0.05).name("Gamma").onChange(() => this.updateSettings());
        grading.add(this.settings, "minInputLevel", 0, 0.5, 0.01).name("Black Level").onChange(() => this.updateSettings());
        grading.add(this.settings, "maxInputLevel", 0.5, 1.0, 0.01).name("White Level").onChange(() => this.updateSettings());

        return root;
      }
    }

    // =========================================================================================
    // 1. 18+ DYNAMIC COLOR THEORY PRESETS ARCHITECTURE
    // =========================================================================================
    const PRESETS = {
      'Monochromatic': {
        boxColor: '#0a1628', boxRoughness: 0.18, boxMetalness: 0.25, boxClearcoat: 0.95, boxClearcoatRoughness: 0.08, boxSheen: 0.7, boxSheenColor: '#1d4ed8',
        ribbonColor: '#38bdf8', ribbonRoughness: 0.2, ribbonMetalness: 0.9, ribbonClearcoat: 0.6,
        hardwareColor: '#60a5fa',
        cushionColor: '#060f1e', cushionSheen: '#2563eb',
        percentType: 'glass', percentColor: '#e0f2fe', percentRoughness: 0.02, percentMetalness: 0.05, percentTransmission: 0.96, percentIor: 1.55, percentThickness: 2.0, percentAttenuation: '#38bdf8', percentAttenuationDist: 1.2,

    // =========================================================================================

    // =========================================================================================
    // 5. PROCEDURAL TEXTURES & PMREM STUDIO ENVIRONMENT
    // =========================================================================================
    function clamp(val, min, max) {
      return Math.max(min, Math.min(max, val));
    }

    function createProceduralStudioBackground(topColor, bottomColor) {
      const c = document.createElement('canvas');
      c.width = 1024;
      c.height = 1024;
      const ctx = c.getContext('2d');

      const grad = ctx.createRadialGradient(512, 420, 100, 512, 512, 650);
      grad.addColorStop(0.0, topColor);
      grad.addColorStop(1.0, bottomColor);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 1024, 1024);

      const texture = new THREE.CanvasTexture(c);
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }

    function createProceduralVelvetBumpMap() {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 512;
      const ctx = c.getContext('2d');
      const imgData = ctx.createImageData(512, 512);
      const data = imgData.data;

      for (let y = 0; y < 512; y++) {
        for (let x = 0; x < 512; x++) {
          const idx = (y * 512 + x) * 4;
          const weave = (Math.sin((x + y) * 1.5) * 0.5 + 0.5) * (Math.sin((x - y) * 1.5) * 0.5 + 0.5);
          const noise = Math.random() * 0.4;
          const val = Math.floor(clamp((weave * 0.6 + noise * 0.4), 0, 1) * 255);
          data[idx] = val;
          data[idx + 1] = val;
          data[idx + 2] = val;
          data[idx + 3] = 255;
        }
      }
      ctx.putImageData(imgData, 0, 0);
      const texture = new THREE.CanvasTexture(c);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(8, 8);
      return texture;
    }

    function createProceduralTerrazzoTexture() {
      const c = document.createElement('canvas');
      c.width = 1024;
      c.height = 1024;
      const ctx = c.getContext('2d');

      ctx.fillStyle = '#f0f3f6';
      ctx.fillRect(0, 0, 1024, 1024);

      for (let i = 0; i < 4000; i++) {
        const x = Math.random() * 1024;
        const y = Math.random() * 1024;
        const r = Math.random() * 1.5 + 0.5;
        ctx.fillStyle = Math.random() > 0.5 ? 'rgba(70, 85, 105, 0.15)' : 'rgba(215, 180, 110, 0.18)';
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }

      const flakeColors = [
        'rgba(40, 55, 80, 0.5)',
        'rgba(210, 165, 80, 0.55)',
        'rgba(15, 115, 130, 0.45)',
        'rgba(140, 150, 165, 0.4)',
        'rgba(240, 245, 250, 0.8)'
      ];

      for (let i = 0; i < 450; i++) {
        const x = Math.random() * 1024;
        const y = Math.random() * 1024;
        const size = Math.random() * 6 + 2;
        ctx.fillStyle = flakeColors[Math.floor(Math.random() * flakeColors.length)];
        ctx.beginPath();
        ctx.ellipse(x, y, size, size * (Math.random() * 0.6 + 0.4), Math.random() * Math.PI, 0, Math.PI * 2);
        ctx.fill();
      }

      const texture = new THREE.CanvasTexture(c);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(2, 2);
      return texture;
    }

    function drawSoftbox(ctx, cx, cy, w, h, opacity, centerColor, outerColor) {
      ctx.save();
      const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(w, h) * 0.6);
      grad.addColorStop(0.0, centerColor);
      grad.addColorStop(0.5, outerColor);
      grad.addColorStop(1.0, 'transparent');
      ctx.globalAlpha = opacity;
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.ellipse(cx, cy, w / 2, h / 2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function createProceduralStudioEnvironment(renderer) {
      const pmrem = new THREE.PMREMGenerator(renderer);
      pmrem.compileEquirectangularShader();

      const c = document.createElement('canvas');
      c.width = 1024;
      c.height = 512;
      const ctx = c.getContext('2d');

      const grad = ctx.createLinearGradient(0, 0, 0, 512);
      grad.addColorStop(0.0, '#eaf2fc');
      grad.addColorStop(0.45, '#99b6d8');
      grad.addColorStop(0.5, '#405068');
      grad.addColorStop(1.0, '#101520');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 1024, 512);

      drawSoftbox(ctx, 300, 120, 220, 110, 0.95, '#ffffff', '#b8dcff');
      drawSoftbox(ctx, 740, 150, 180, 90, 0.65, '#e8f0fe', '#7da2cc');
      drawSoftbox(ctx, 512, 40, 360, 60, 0.85, '#fff7ea', '#ffdda6');

      const texture = new THREE.CanvasTexture(c);
      texture.mapping = THREE.EquirectangularReflectionMapping;
      const envRenderTarget = pmrem.fromEquirectangular(texture);
      texture.dispose();
      pmrem.dispose();
      return envRenderTarget.texture;
    }

    const velvetBumpMap = createProceduralVelvetBumpMap();
    const terrazzoMap = createProceduralTerrazzoTexture();

    // =========================================================================================

    // =========================================================================================
    // 7. PROCEDURAL GEOMETRY BUILDERS
    // =========================================================================
    function createRoundedRectShape(w, h, r) {
      const shape = new THREE.Shape();
      const x = -w / 2;
      const y = -h / 2;
      shape.moveTo(x + r, y);
      shape.lineTo(x + w - r, y);
      shape.quadraticCurveTo(x + w, y, x + w, y + r);
      shape.lineTo(x + w, y + h - r);
      shape.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      shape.lineTo(x + r, y + h);
      shape.quadraticCurveTo(x, y + h, x, y + h - r);
      shape.lineTo(x, y + r);
      shape.quadraticCurveTo(x, y, x + r, y);
      return shape;
    }

    function createRoundedRectPath(w, h, r) {
      const path = new THREE.Path();
      const x = -w / 2;
      const y = -h / 2;
      path.moveTo(x + r, y);
      path.lineTo(x + w - r, y);
      path.quadraticCurveTo(x + w, y, x + w, y + r);
      path.lineTo(x + w, y + h - r);
      path.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      path.lineTo(x + r, y + h);
      path.quadraticCurveTo(x, y + h, x, y + h - r);
      path.lineTo(x, y + r);
      path.quadraticCurveTo(x, y, x + r, y);
      return path;
    }

    function createBeveledExtrusion(shape, depth, bevelThickness = 0.04, bevelSize = 0.03, bevelSegments = 4) {
      const geom = new THREE.ExtrudeGeometry(shape, {
        depth,
        bevelEnabled: true,
        bevelThickness,
        bevelSize,
        bevelSegments
      });
      geom.center();
      return geom;
    }

    // -------------------------------------------------------------------------

    // 4. Thick Beveled Gold Lip Framing the Open Rim

    function createSideChevrons() {

        barV.position.set(cx * (0.65 + leg / 2 - thick / 2), cy * (0.48 + leg / 2 - thick / 2), 0.02);

        const diag = new THREE.Mesh(new THREE.BoxGeometry(leg * 1.3, thick, thick), materials.gold);
        diag.rotation.z = (cx * cy > 0 ? 1 : -1) * Math.PI / 4;
        diag.position.set(cx * 0.65, cy * 0.48, 0.02);
        group.add(diag);

    // -------------------------------------------------------------------------
    // C. Levitating Pop-Up Box Lid (Calibrated to Eliminate Z-Fighting)
    // -------------------------------------------------------------------------
    const lidGroup = new THREE.Group();
    masterSceneGroup.add(lidGroup);

    const lidWidth = boxWidth + 0.14; // 2.34

    function createRibbonLoop(rotZ, rotY, scaleX = 1.0, scaleY = 1.0) {
      const pts = [
        new THREE.Vector3(0.05, 0.02, 0.0),
        new THREE.Vector3(0.45 * scaleX, 0.55 * scaleY, 0.2),
        new THREE.Vector3(0.85 * scaleX, 0.85 * scaleY, 0.12),
        new THREE.Vector3(1.05 * scaleX, 0.55 * scaleY, -0.05),
        new THREE.Vector3(0.75 * scaleX, 0.22 * scaleY, -0.15),
        new THREE.Vector3(-0.05, -0.02, 0.0)
      ];
      const curve = new THREE.CatmullRomCurve3(pts, false, 'centripetal', 0.5);

      const w = 0.24;
      const h = 0.016;
      const rShape = new THREE.Shape();
      rShape.moveTo(-w / 2, -h / 2);
      rShape.lineTo(w / 2, -h / 2);
      rShape.lineTo(w / 2, h / 2);
      rShape.lineTo(-w / 2, h / 2);
      rShape.closePath();

      const geom = new THREE.ExtrudeGeometry(rShape, {
        extrudePath: curve,
        steps: 48,
        bevelEnabled: false
      });

      const mesh = new THREE.Mesh(geom, materials.ribbon);
      mesh.rotation.z = rotZ;
      mesh.rotation.y = rotY;
      mesh.castShadow = true;

      const wirePts = curve.getPoints(36);
      const wireCurve = new THREE.CatmullRomCurve3(wirePts);
      const wireGeom = new THREE.TubeGeometry(wireCurve, 36, 0.012, 8, false);
      const wireMesh = new THREE.Mesh(wireGeom, materials.gold);
      mesh.add(wireMesh);

      return mesh;
    }

    bowGroup.add(createRibbonLoop(-Math.PI * 0.25, 0.15, 1.1, 0.95));

      rShape.moveTo(-w / 2, -h / 2);

      rShape.lineTo(-w / 2, h / 2);
      rShape.closePath();

      const geom = new THREE.ExtrudeGeometry(rShape, {

      const mesh = new THREE.Mesh(geom, materials.ribbon);

    function createRingGeometry(outerR, innerR, depth, bevel) {
      const shape = new THREE.Shape();
      shape.absarc(0, 0, outerR, 0, Math.PI * 2, false);

      hole.absarc(0, 0, innerR, 0, Math.PI * 2, true);

        depth: depth,
        bevelEnabled: true,
        bevelThickness: bevel,
        bevelSize: bevel * 0.85,
        bevelSegments: 4,
        curveSegments: 36

      geom.center();
      return geom;
    }

    const ringGeom = createRingGeometry(0.42, 0.22, 0.28, 0.045);

    // -------------------------------------------------------------------------

    // -------------------------------------------------------------------------
    const rayUniforms = {
      color: { value: new THREE.Color(initialPalette.internalColor || initialPalette.hardwareColor) },
      time: { value: 0 },
      intensity: { value: params.internalIntensity }
    };

    const rayMaterial = new THREE.ShaderMaterial({
      uniforms: rayUniforms,
      vertexShader: `
        varying vec2 vUv;
        varying vec3 vNormal;
        void main() {
          vUv = uv;
          vNormal = normalize(normalMatrix * normal);
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform vec3 color;
        uniform float time;
        uniform float intensity;
        varying vec2 vUv;
        varying vec3 vNormal;

        void main() {
          float h = 1.0 - vUv.y;
          float verticalFade = pow(1.0 - h, 2.5);
          float shimmer = 0.88 + 0.12 * sin(vUv.x * 20.0 + time * 3.5);
          float alpha = clamp(verticalFade * shimmer * 0.16 * (intensity / 5.5), 0.0, 0.4);
          gl_FragColor = vec4(color * 1.5, alpha);
        }
      `,
      transparent: true,
      blending: THREE.AdditiveBlending,
      side: THREE.DoubleSide,
      depthWrite: false
    });

    const rayGeom = new THREE.CylinderGeometry(1.2, 0.35, 2.2, 32, 1, true);

    // -------------------------------------------------------------------------

    function createDiamondStarShape(outerR, innerR) {
      const shape = new THREE.Shape();
      const n = 4;
      for (let i = 0; i < n * 2; i++) {
        const angle = (i * Math.PI) / n - Math.PI / 2;
        const r = (i % 2 === 0) ? outerR : innerR;
        const x = Math.cos(angle) * r;
        const y = Math.sin(angle) * r;
        if (i === 0) shape.moveTo(x, y);
        else shape.lineTo(x, y);
      }
      shape.closePath();
      return shape;
    }

    const starShape = createDiamondStarShape(0.24, 0.045);
    const starGeom = createBeveledExtrusion(starShape, 0.05, 0.02, 0.015, 3);

    // -------------------------------------------------------------------------

    const shockwaveMesh1 = new THREE.Mesh(ringGeom1, ringMat1);

    // -------------------------------------------------------------------------

    const particleCount = 120;

    const particleMesh = new THREE.InstancedMesh(particleGeom, materials.sparkle, particleCount);
    masterSceneGroup.add(particleMesh);

    const dummy = new THREE.Object3D();

    // =========================================================================================

    const lights = {

    // =========================================================================================
    // 10. DYNAMIC THEME & GREEN-SCREEN CONTROLLER (SMOOTH GSAP COLOR TRANSITIONS)
    // =========================================================================================
    const bgTopColor = new THREE.Color(initialPalette.bgGradTop);
    const bgBottomColor = new THREE.Color(initialPalette.bgGradBottom);

    function refreshBackground() {
      if (params.greenScreen) {
        scene.background = new THREE.Color(0x00ff00);
        document.body.style.backgroundColor = '#00ff00';
        return;
      }
      if (params.bgMode === 'Solid Color') {
        if (scene.background && scene.background.dispose) scene.background.dispose();
        scene.background = new THREE.Color(params.bgColor);
        document.body.style.backgroundColor = params.bgColor;
      } else {
        if (scene.background && scene.background.dispose) scene.background.dispose();
        scene.background = createProceduralStudioBackground(params.bgGradTop, params.bgGradBottom);
        document.body.style.backgroundColor = params.bgGradBottom;
      }
    }

    function updateBackground(topHex, bottomHex, animate = false) {
      if (animate) {
        gsap.to(bgTopColor, {
          r: new THREE.Color(topHex).r,
          g: new THREE.Color(topHex).g,
          b: new THREE.Color(topHex).b,
          duration: 0.85,
          ease: "power2.out",
          onUpdate: () => {
            params.bgGradTop = '#' + bgTopColor.getHexString();
            params.bgGradBottom = '#' + bgBottomColor.getHexString();
            params.bgColor = params.bgGradBottom;
            if (bgGradTopController) bgGradTopController.updateDisplay();
            if (bgGradBottomController) bgGradBottomController.updateDisplay();
            if (bgColorController) bgColorController.updateDisplay();
            refreshBackground();
          }
        });
        gsap.to(bgBottomColor, {
          r: new THREE.Color(bottomHex).r,
          g: new THREE.Color(bottomHex).g,
          b: new THREE.Color(bottomHex).b,
          duration: 0.85,
          ease: "power2.out"
        });
      } else {
        params.bgGradTop = topHex;
        params.bgGradBottom = bottomHex;
        params.bgColor = bottomHex;
        bgTopColor.set(topHex);
        bgBottomColor.set(bottomHex);
        if (bgGradTopController) bgGradTopController.updateDisplay();
        if (bgGradBottomController) bgGradBottomController.updateDisplay();
        if (bgColorController) bgColorController.updateDisplay();
        refreshBackground();
      }
    }

    function applyPreset(name, animate = true) {
      const p = PRESETS[name];
      if (!p) return;
      params.preset = name;

      params.keyColor = p.keyColor;
      params.fillColor = p.fillColor;
      params.rimColor = p.rimColor;
      params.internalColor = p.internalColor;

      if (!animate) {
        materials.boxVelvet.color.set(p.boxColor);
        materials.boxVelvet.sheenColor.set(p.boxSheenColor);
        materials.ribbon.color.set(p.ribbonColor);
        materials.gold.color.set(p.hardwareColor);
        materials.sparkle.color.set(p.sparkleColor1);
        materials.sparkle.emissive.set(p.sparkleColor1);
        materials.innerLining.color.set(p.internalColor || p.hardwareColor);
        materials.boxFloor.color.set(p.internalColor || p.hardwareColor);
        materials.neonRing1.color.set(p.pedestalRimColor || p.hardwareColor);
        materials.neonRing2.color.set(p.pedestalInnerRing || p.ribbonColor);

        lights.key.color.set(p.keyColor);
        lights.fill.color.set(p.fillColor);
        lights.rim.color.set(p.rimColor);
        lights.core.color.set(p.internalColor || p.hardwareColor);
        rayUniforms.color.value.set(p.internalColor || p.hardwareColor);
        ringMat1.color.set(p.hardwareColor);
        ringMat2.color.set(p.ribbonColor);

        if (p.percentType === 'glass') {
          materials.percent.transmission = p.percentTransmission || 0.95;
          materials.percent.ior = p.percentIor || 1.55;
          materials.percent.thickness = p.percentThickness || 2.0;
          materials.percent.metalness = p.percentMetalness || 0.05;
          materials.percent.roughness = p.percentRoughness || 0.03;
          materials.percent.color.set(p.percentColor);
          materials.percent.attenuationColor.set(p.percentAttenuation || p.hardwareColor);
        } else {

        gsap.to(materials.boxVelvet.color, { r: new THREE.Color(p.boxColor).r, g: new THREE.Color(p.boxColor).g, b: new THREE.Color(p.boxColor).b, duration: dur, ease });
        gsap.to(materials.boxVelvet.sheenColor, { r: new THREE.Color(p.boxSheenColor).r, g: new THREE.Color(p.boxSheenColor).g, b: new THREE.Color(p.boxSheenColor).b, duration: dur, ease });
        gsap.to(materials.ribbon.color, { r: new THREE.Color(p.ribbonColor).r, g: new THREE.Color(p.ribbonColor).g, b: new THREE.Color(p.ribbonColor).b, duration: dur, ease });
        gsap.to(materials.gold.color, { r: new THREE.Color(p.hardwareColor).r, g: new THREE.Color(p.hardwareColor).g, b: new THREE.Color(p.hardwareColor).b, duration: dur, ease });
        gsap.to(materials.sparkle.color, { r: new THREE.Color(p.sparkleColor1).r, g: new THREE.Color(p.sparkleColor1).g, b: new THREE.Color(p.sparkleColor1).b, duration: dur, ease });
        gsap.to(materials.sparkle.emissive, { r: new THREE.Color(p.sparkleColor1).r, g: new THREE.Color(p.sparkleColor1).g, b: new THREE.Color(p.sparkleColor1).b, duration: dur, ease });
        gsap.to(materials.innerLining.color, { r: new THREE.Color(p.internalColor || p.hardwareColor).r, g: new THREE.Color(p.internalColor || p.hardwareColor).g, b: new THREE.Color(p.internalColor || p.hardwareColor).b, duration: dur, ease });
        gsap.to(materials.boxFloor.color, { r: new THREE.Color(p.internalColor || p.hardwareColor).r, g: new THREE.Color(p.internalColor || p.hardwareColor).g, b: new THREE.Color(p.internalColor || p.hardwareColor).b, duration: dur, ease });
        gsap.to(materials.neonRing1.color, { r: new THREE.Color(p.pedestalRimColor || p.hardwareColor).r, g: new THREE.Color(p.pedestalRimColor || p.hardwareColor).g, b: new THREE.Color(p.pedestalRimColor || p.hardwareColor).b, duration: dur, ease });
        gsap.to(materials.neonRing2.color, { r: new THREE.Color(p.pedestalInnerRing || p.ribbonColor).r, g: new THREE.Color(p.pedestalInnerRing || p.ribbonColor).g, b: new THREE.Color(p.pedestalInnerRing || p.ribbonColor).b, duration: dur, ease });

        gsap.to(lights.key.color, { r: new THREE.Color(p.keyColor).r, g: new THREE.Color(p.keyColor).g, b: new THREE.Color(p.keyColor).b, duration: dur, ease });
        gsap.to(lights.fill.color, { r: new THREE.Color(p.fillColor).r, g: new THREE.Color(p.fillColor).g, b: new THREE.Color(p.fillColor).b, duration: dur, ease });
        gsap.to(lights.rim.color, { r: new THREE.Color(p.rimColor).r, g: new THREE.Color(p.rimColor).g, b: new THREE.Color(p.rimColor).b, duration: dur, ease });
        gsap.to(lights.core.color, { r: new THREE.Color(p.internalColor || p.hardwareColor).r, g: new THREE.Color(p.internalColor || p.hardwareColor).g, b: new THREE.Color(p.internalColor || p.hardwareColor).b, duration: dur, ease });
        gsap.to(rayUniforms.color.value, { r: new THREE.Color(p.internalColor || p.hardwareColor).r, g: new THREE.Color(p.internalColor || p.hardwareColor).g, b: new THREE.Color(p.internalColor || p.hardwareColor).b, duration: dur, ease });
        gsap.to(ringMat1.color, { r: new THREE.Color(p.hardwareColor).r, g: new THREE.Color(p.hardwareColor).g, b: new THREE.Color(p.hardwareColor).b, duration: dur, ease });
        gsap.to(ringMat2.color, { r: new THREE.Color(p.ribbonColor).r, g: new THREE.Color(p.ribbonColor).g, b: new THREE.Color(p.ribbonColor).b, duration: dur, ease });

        if (p.percentType === 'glass') {
          gsap.to(materials.percent, {
            transmission: p.percentTransmission || 0.95,
            ior: p.percentIor || 1.55,
            thickness: p.percentThickness || 2.0,
            metalness: p.percentMetalness || 0.05,
            roughness: p.percentRoughness || 0.03,

            ease
          });
          gsap.to(materials.percent.color, { r: new THREE.Color(p.percentColor).r, g: new THREE.Color(p.percentColor).g, b: new THREE.Color(p.percentColor).b, duration: dur, ease });
          gsap.to(materials.percent.attenuationColor, { r: new THREE.Color(p.percentAttenuation || p.hardwareColor).r, g: new THREE.Color(p.percentAttenuation || p.hardwareColor).g, b: new THREE.Color(p.percentAttenuation || p.hardwareColor).b, duration: dur, ease });

          gsap.to(materials.percent, {
            transmission: 0.0,

          gsap.to(materials.percent.color, { r: new THREE.Color(p.percentColor || p.hardwareColor).r, g: new THREE.Color(p.percentColor || p.hardwareColor).g, b: new THREE.Color(p.percentColor || p.hardwareColor).b, duration: dur, ease });

        updateBackground(p.bgGradTop, p.bgGradBottom, true);

    function toggleGreenScreen(enabled) {
      params.greenScreen = enabled;
      if (enabled) {
        scene.background = new THREE.Color(0x00ff00);
        document.body.style.backgroundColor = '#00ff00';
        shadowFloor.visible = false;
        aoDisc.visible = false;
