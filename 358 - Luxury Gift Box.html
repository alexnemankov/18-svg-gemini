        aoDisc.visible = true;
        refreshBackground();
      }
    }

    // =========================================================================================
    // 11. KINEMATICS & MOTION GRAPHIC UNBOXING RIGGING
    // =========================================================================
    const lidClosedPos = new THREE.Vector3(0, boxHeight + 0.16, 0);
    const lidPoppedPos = new THREE.Vector3(2.2, 3.7, -1.0);
    const lidPoppedRot = new THREE.Euler(-0.55, 0.35, 0.45);

    const bowClosedPos = new THREE.Vector3(0, boxHeight + 0.16 + 0.22 + 0.035 + 0.18, 0);
    const bowPoppedPos = new THREE.Vector3(-2.3, 3.8, 0.5);
    const bowPoppedRot = new THREE.Euler(0.35, -0.45, -0.25);

    const percentPoppedY = 3.10;
    const miniPercentClosedPos = new THREE.Vector3(0.35, 1.15, 0.25);
    const miniPercentPoppedPos = new THREE.Vector3(1.55, 2.35, 0.70);

    function updateUnboxKinematics(t) {
      const p = params.unboxProgress;

      // 1. Lid Pop Interpolation + Organic Idle Floating
      const lidHoverY = Math.sin(t * 1.5 + 0.4) * 0.08 * p;
      const lidHoverRotX = Math.sin(t * 1.2) * 0.03 * p;
      const lidHoverRotZ = Math.cos(t * 1.0) * 0.03 * p;

      lidGroup.position.lerpVectors(lidClosedPos, lidPoppedPos, p);
      lidGroup.position.y += lidHoverY;

      lidGroup.rotation.x = THREE.MathUtils.lerp(0, lidPoppedRot.x, p) + lidHoverRotX;
      lidGroup.rotation.y = THREE.MathUtils.lerp(0, lidPoppedRot.y, p);
      lidGroup.rotation.z = THREE.MathUtils.lerp(0, lidPoppedRot.z, p) + lidHoverRotZ;

      // 2. Detached Ribbon Bow Interpolation + Floating
      const bowHoverY = Math.sin(t * 1.7 + 1.2) * 0.1 * p;
      const bowHoverRotY = Math.sin(t * 0.9) * 0.06 * p;

      bowGroup.position.lerpVectors(bowClosedPos, bowPoppedPos, p);
      bowGroup.position.y += bowHoverY;

      bowGroup.rotation.x = THREE.MathUtils.lerp(0, bowPoppedRot.x, p);
      bowGroup.rotation.y = THREE.MathUtils.lerp(0, bowPoppedRot.y, p) + bowHoverRotY;
      bowGroup.rotation.z = THREE.MathUtils.lerp(0, bowPoppedRot.z, p);

      tailLeft.rotation.z = Math.sin(t * 2.0) * 0.05;
      tailRight.rotation.z = -Math.cos(t * 2.0) * 0.05;

      // 3. Levitating Percentage Symbol (%) - Floating High in Free Air (Zero Clipping)
      if (p <= 0.08) {
        percentGroup.visible = false;
        miniPercentGroup.visible = false;
        coin1.visible = false;
        coin2.visible = false;
      } else {
        percentGroup.visible = true;
        miniPercentGroup.visible = true;
        coin1.visible = true;
        coin2.visible = true;

        const animP = THREE.MathUtils.smoothstep(p, 0.08, 1.0);
        const percentScale = THREE.MathUtils.lerp(0.01, 1.0, Math.pow(animP, 1.35)) * (p > 1.0 ? (1.0 + (p - 1.0) * 0.3) : 1.0);
        percentGroup.scale.setScalar(percentScale);
        miniPercentGroup.scale.setScalar(0.34 * animP);

        const floatY = Math.sin(t * 1.8) * 0.08 * animP;
        percentGroup.position.set(0, THREE.MathUtils.lerp(1.15, percentPoppedY, animP) + floatY, 0);

        const miniHoverY = Math.sin(t * 1.5 + 1.0) * 0.05 * animP;
        miniPercentGroup.position.lerpVectors(miniPercentClosedPos, miniPercentPoppedPos, animP);
        miniPercentGroup.position.y += miniHoverY;
        miniPercentGroup.rotation.y = isoAngle - 0.2 + Math.sin(t * 0.9) * 0.12 * animP;
        miniPercentGroup.rotation.x = -0.1 + Math.cos(t * 1.1) * 0.04 * animP;

        coin1.position.y = 2.65 + Math.sin(t * 1.6 + 0.5) * 0.05 * animP;
        coin2.position.y = 2.65 + Math.cos(t * 1.4 + 1.2) * 0.05 * animP;

        const rotWobble = animP;
        percentGroup.rotation.x = -0.15 + Math.sin(t * 1.3) * 0.035 * rotWobble;
        percentGroup.rotation.y = isoAngle + burstYawOffset.value + Math.sin(t * 0.7 * params.animationSpeed) * 0.18 * rotWobble;
        percentGroup.rotation.z = Math.cos(t * 1.1) * 0.035 * rotWobble;
      }

      // 4. Volumetric Light Cone & Core Flare Breathing
      rayMesh.position.y = 0.35;
      rayMesh.scale.set(1.0 + p * 0.2, p, 1.0 + p * 0.2);
      rayUniforms.intensity.value = params.internalIntensity * (0.3 + p * 0.7);
      lights.core.intensity = params.internalIntensity * (0.3 + p * 0.7) * (1.0 + Math.sin(t * 3.5) * 0.12);

      // 5. Floating Diamond Stars
      starMeshes.forEach(({ mesh, cfg, initialY }) => {
        mesh.position.y = initialY + Math.sin(t * cfg.rotSpeed + cfg.x) * 0.15 * p;
        mesh.rotation.y += cfg.rotSpeed * 0.015;
        mesh.rotation.z = Math.sin(t * cfg.rotSpeed) * 0.15;
      });

      // 6. Particle Swarm Simulation (Spiral Embers + Radial Explosion Motes)
      const bf = burstProgress.value;
      for (let i = 0; i < particleCount; i++) {
        const pd = particleData[i];
        pd.angle += (pd.speed + bf * 3.5) * 0.015 * params.animationSpeed;
        pd.y += pd.upSpeed * 0.015 * params.animationSpeed;

        if (pd.y > 4.2) {
          pd.y = 0.4;
          pd.radius = Math.random() * 1.5 + 0.25;
        }

        const curRadius = pd.radius + pd.burstMaxR * bf;
        const curY = pd.y + pd.burstMaxY * bf;

        const px = Math.cos(pd.angle) * curRadius;
        const pz = Math.sin(pd.angle) * curRadius;
        const currentScale = pd.scale * (1.0 + bf * 1.6) * Math.sin(t * 3.0 + pd.wobble) * p;

        dummy.position.set(px, curY, pz);
        dummy.scale.setScalar(Math.max(0.001, currentScale));
        dummy.rotation.set(t * pd.speed + bf * 4.0, t * pd.speed * 1.2, bf * 2.0);
        dummy.updateMatrix();

        particleMesh.setMatrixAt(i, dummy.matrix);
      }
      particleMesh.instanceMatrix.needsUpdate = true;
    }

    // =========================================================================================
    // 12. MOTION GRAPHIC PING-PONG UNBOXING (EXPAND / HIDE)
    // =========================================================================================
    let isUnboxed = true;
    let unboxTimeline = null;
    let unboxController = null;
    let presetController = null;
    let distanceController = null;
    let focalController = null;
    let fovController = null;
    let antialiasController = null;
    let ppAntialiasController = null;
    let bgModeController = null;
    let bgColorController = null;
    let bgGradTopController = null;
    let bgGradBottomController = null;

    function updateFocalLength(val) {
      params.focalLength = val;
      camera.setFocalLength(val);
      params.fov = Math.round(camera.fov * 10) / 10;
      if (fovController) fovController.updateDisplay();
    }

    function updateFov(val) {
      params.fov = val;
      camera.fov = val;
      camera.updateProjectionMatrix();
      params.focalLength = Math.round(camera.getFocalLength() * 10) / 10;
      if (focalController) focalController.updateDisplay();
    }

    function triggerBurstShockwave() {
      shockwaveMesh1.scale.set(0.4, 0.4, 0.4);
      shockwaveMat1.opacity = 0.95;
      gsap.to(shockwaveMesh1.scale, { x: 3.8, y: 3.8, z: 3.8, duration: 0.85, delay: 0.10, ease: "power2.out" });
      gsap.to(shockwaveMat1, { opacity: 0.0, duration: 0.85, delay: 0.10, ease: "power2.out" });

      shockwaveMesh2.scale.set(0.3, 0.3, 0.3);
      shockwaveMat2.opacity = 0.85;
      gsap.to(shockwaveMesh2.scale, { x: 2.9, y: 2.9, z: 2.9, duration: 0.75, delay: 0.16, ease: "power2.out" });
      gsap.to(shockwaveMat2, { opacity: 0.0, duration: 0.75, delay: 0.16, ease: "power2.out" });
    }

    function expandBox() {
      if (unboxTimeline) unboxTimeline.kill();
      isUnboxed = true;

      unboxTimeline = gsap.timeline();

      // 1. Anticipation Pre-Burst Dip (0.00s - 0.10s)
      gsap.to(boxGroup.scale, { x: 1.04, y: 0.93, z: 1.04, duration: 0.10, ease: "power1.in" });
      gsap.to(lidGroup.position, { y: boxHeight + 0.10, duration: 0.10, ease: "power1.in" });

      // 2. Explosive Release Blastoff (0.10s+)
      gsap.to(params, {
        unboxProgress: 1.0,
        duration: 1.35,
        delay: 0.10,
        ease: "back.out(1.65)",
        onUpdate: () => { if (unboxController) unboxController.updateDisplay(); }
      });

      // Box Base Elastic Spring & Recovery
      gsap.to(boxGroup.scale, {
        x: 0.97, y: 1.05, z: 0.97,
        duration: 0.18,
        delay: 0.10,
        ease: "power2.out",
        onComplete: () => {
          gsap.to(boxGroup.scale, { x: 1.0, y: 1.0, z: 1.0, duration: 0.5, ease: "elastic.out(1.2, 0.4)" });
        }
      });

      // Shockwaves & Particle Fountain
      triggerBurstShockwave();
      gsap.fromTo(burstProgress, { value: 1.0 }, { value: 0.0, duration: 1.4, delay: 0.10, ease: "power2.out" });

      // Core Light Explosion Flash
      gsap.fromTo(lights.core,
        { intensity: params.internalIntensity * 3.8 },
        { intensity: params.internalIntensity, duration: 1.1, delay: 0.10, ease: "power2.out" }
      );

      // Dynamic flourish spin on % symbol
      gsap.fromTo(burstYawOffset, { value: 0.8 }, { value: 0.0, duration: 1.2, delay: 0.10, ease: "back.out(1.8)" });

      // Camera Kinetic Micro-Thrust
      gsap.fromTo(camera,
        { fov: 31.4 },
        { fov: 32.0, duration: 0.45, delay: 0.10, ease: "back.out(2.2)", onUpdate: () => camera.updateProjectionMatrix() }
      );
    }

    function hideBox() {
      if (unboxTimeline) unboxTimeline.kill();
      isUnboxed = false;

      unboxTimeline = gsap.timeline();

      // 1. Smooth Collapse Down into Cavity
      gsap.to(params, {
        unboxProgress: 0.0,
        duration: 0.95,
        ease: "power2.inOut",
        onUpdate: () => { if (unboxController) unboxController.updateDisplay(); }
      });

      // Core Light fades to standby
      gsap.to(lights.core, {
        intensity: params.internalIntensity * 0.2,
        duration: 0.8,
        ease: "power2.out"
      });

      // 2. Tactile Snap Impact when Lid Lands on Rim (at ~0.82s)
      gsap.fromTo(lidGroup.position,
        { y: boxHeight + 0.16 },
        { y: boxHeight + 0.21, duration: 0.12, yoyo: true, repeat: 1, delay: 0.82, ease: "power1.out" }
      );

      gsap.to(boxGroup.scale, {
        x: 1.03, y: 0.96, z: 1.03,
        duration: 0.08,
        delay: 0.84,
        ease: "power1.in",
        onComplete: () => {
          gsap.to(boxGroup.scale, { x: 1.0, y: 1.0, z: 1.0, duration: 0.35, ease: "elastic.out(1.1, 0.4)" });
        }
      });
    }

    function toggleUnbox() {
      if (params.unboxProgress > 0.45) {
        hideBox();
      } else {
        expandBox();
      }
    }

    // Isolated scene randomizer: DO NOT touch PostProcessor settings!
    function randomizeScene() {
      const keys = Object.keys(PRESETS);
      const randKey = keys[Math.floor(Math.random() * keys.length)];
      applyPreset(randKey, true);
      if (presetController) presetController.setValue(randKey);
    }

    let pointerDownTime = 0;
    let pointerDownPos = { x: 0, y: 0 };

    window.addEventListener('pointerdown', (e) => {
      pointerDownTime = performance.now();
      pointerDownPos.x = e.clientX;
      pointerDownPos.y = e.clientY;
    });

    window.addEventListener('pointerup', (e) => {
      const elapsed = performance.now() - pointerDownTime;
      const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);

      if (elapsed < 300 && dist < 6 && params.clickToToggle) {
        if (!e.target.closest('.lil-gui')) {
          toggleUnbox();
        }
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        toggleUnbox();
      }
    });

    // Allow mouse wheel to dynamically zoom camera distance during motion choreography
    window.addEventListener('wheel', (e) => {
      if (e.target.closest('.lil-gui')) return;
      if (params.cameraMode !== 'Static Camera') {
        const zoomDelta = e.deltaY * 0.0012;
        params.cameraDistance = THREE.MathUtils.clamp(params.cameraDistance + zoomDelta, 0.3, 3.0);
        if (distanceController) distanceController.updateDisplay();
      }
    }, { passive: true });

    // =========================================================================================
    // 13. 8 CAMERA & MOTION CHOREOGRAPHY PRESETS (+ 1 STATIC MODE)
    // =========================================================================
    const camTargetPos = new THREE.Vector3();
    const camLookTarget = new THREE.Vector3();

    function updateStaticCameraDistance() {
      const dir = new THREE.Vector3().subVectors(camera.position, controls.target);
      const len = dir.length();
      if (len > 0.001) {
        dir.normalize().multiplyScalar(17.5 * params.cameraDistance);
        camera.position.copy(controls.target).add(dir);
        controls.update();
      }
    }

    function updateCameraMotion(time, p) {
      if (params.cameraMode === 'Static Camera') {
        controls.update();
        return;
      }

      if (params.cameraMode === 'Slow Showcase Turntable') {
        const rad = 14.5;
        camTargetPos.set(
          Math.cos(time * 0.14) * rad,
          7.6 + Math.sin(time * 0.12) * 1.0,
          Math.sin(time * 0.14) * rad
        );
        camLookTarget.set(0, 1.45 + p * 0.45, 0);
        camera.up.set(0, 1, 0);
      } else if (params.cameraMode === 'Macro Focus Glide') {
        const theta = time * 0.18;
        const rad = 6.2 + Math.sin(time * 0.25) * 0.8;
        const y = 3.2 + Math.sin(time * 0.2) * 1.0 + p * 0.8;
        camTargetPos.set(Math.cos(theta) * rad, y, Math.sin(theta) * rad);
        camLookTarget.set(0, 1.8 + p * 0.6, 0);
        camera.up.set(0, 1, 0);
      } else if (params.cameraMode === 'Pendulum Sway') {
        const sway = Math.sin(time * 0.35) * 0.65;
        const rad = 14.0;
        const baseAngle = Math.PI * 0.25;
        const theta = baseAngle + sway;
        camTargetPos.set(
          Math.cos(theta) * rad,
          7.2 + Math.cos(time * 0.7) * 0.8,
          Math.sin(theta) * rad
        );
        camLookTarget.set(0, 1.45 + p * 0.45, 0);
        camera.up.set(0, 1, 0);
      } else if (params.cameraMode === 'Breathing Orbit') {
        const theta = time * 0.12;
        const rad = 13.5 + Math.sin(time * 0.35) * 3.0;
        const y = 7.5 + Math.cos(time * 0.28) * 1.8;
        camTargetPos.set(Math.cos(theta) * rad, y, Math.sin(theta) * rad);
        camLookTarget.set(0, 1.45 + p * 0.45, 0);
        camera.up.set(0, 1, 0);
      } else if (params.cameraMode === 'Dramatic Low-Angle Rise') {
        const cycle = (time * 0.16) % (Math.PI * 2);
        const ct = (Math.sin(cycle) + 1.0) * 0.5;
        const rad = 9.5 + ct * 4.2;
        const y = 1.3 + Math.pow(ct, 1.5) * 6.5;
        const theta = time * 0.1;
        camTargetPos.set(Math.cos(theta) * rad, y, Math.sin(theta) * rad);
        camLookTarget.set(0, 1.2 + ct * 1.0 + p * 0.5, 0);
        camera.up.set(0, 1, 0);
      } else if (params.cameraMode === 'Dutch-Angle Roll') {
        const theta = Math.PI * 0.28 + Math.sin(time * 0.18) * 0.45;
        const rad = 12.5;
        camTargetPos.set(
          Math.cos(theta) * rad,
          6.8 + Math.cos(time * 0.2) * 1.0,
          Math.sin(theta) * rad
        );
        camLookTarget.set(0, 1.6 + p * 0.4, 0);
        const rollAngle = Math.sin(time * 0.3) * 0.14;
        camera.up.set(Math.sin(rollAngle), Math.cos(rollAngle), 0);
      } else if (params.cameraMode === 'Micro-Jitter / Handheld Float') {
        const ox = Math.sin(time * 0.8) * 0.35 + Math.sin(time * 1.9) * 0.12 + Math.sin(time * 3.7) * 0.04;
        const oy = Math.cos(time * 0.7) * 0.28 + Math.sin(time * 2.1) * 0.10 + Math.cos(time * 4.1) * 0.03;
        const oz = Math.sin(time * 0.6) * 0.35 + Math.cos(time * 1.7) * 0.12 + Math.sin(time * 3.3) * 0.04;
        camTargetPos.set(11.2 + ox, 8.8 + oy, 11.2 + oz);
        camLookTarget.set(Math.sin(time * 0.5) * 0.08, 1.45 + p * 0.45 + Math.cos(time * 0.6) * 0.06, 0);
        camera.up.set(0, 1, 0);
      } else if (params.cameraMode === 'Dynamic Spiral Descent') {
        const spiralT = (time * 0.15) % (Math.PI * 2);
        const spiralPhase = Math.sin(spiralT);
        const y = 3.0 + (spiralPhase + 1.0) * 0.5 * 7.5;
        const rad = 7.5 + (spiralPhase + 1.0) * 0.5 * 5.5;
        const theta = time * 0.24;
        camTargetPos.set(Math.cos(theta) * rad, y, Math.sin(theta) * rad);
        camLookTarget.set(0, 1.4 + p * 0.5, 0);
        camera.up.set(0, 1, 0);
      }

      camLookTarget.y += params.focalTargetOffset;

      // Apply dynamic camera distance scaling relative to camLookTarget
      const toCam = new THREE.Vector3().subVectors(camTargetPos, camLookTarget);
      toCam.multiplyScalar(params.cameraDistance);
      camTargetPos.copy(camLookTarget).add(toCam);

      const lerpPos = params.cameraMode === 'Micro-Jitter / Handheld Float' ? 0.05 : 0.04;
      const lerpLook = params.cameraMode === 'Micro-Jitter / Handheld Float' ? 0.06 : 0.05;
      camera.position.lerp(camTargetPos, lerpPos);
      controls.target.lerp(camLookTarget, lerpLook);

      controls.update();
    }

    // =========================================================================================
    // 14. LIL-GUI PRODUCTION CONTROLS
    // =========================================================================
    const gui = new GUI({ title: 'Studio Production Suite' });

    // A. 18+ Color Scheme Architecture
    const fPresets = gui.addFolder('Color Schemes (18+)');
    presetController = fPresets.add(params, 'preset', Object.keys(PRESETS)).name('Palette Scheme').onChange(v => {
      applyPreset(v, true);
    });
    fPresets.add({ rand: () => randomizeScene() }, 'rand').name('🎲 Random Palette (Isolated)');
    fPresets.add(params, 'greenScreen').name('Pure #00ff00 Green-Screen').onChange(v => {
      toggleGreenScreen(v);
    });

    // A2. Studio Background Controls
    const fBackground = gui.addFolder('Studio Background');
    bgModeController = fBackground.add(params, 'bgMode', ['Studio Radial Gradient', 'Solid Color']).name('Background Mode').onChange(refreshBackground);
    bgColorController = fBackground.addColor(params, 'bgColor').name('Solid Color').onChange(() => {
      params.bgMode = 'Solid Color';
      if (bgModeController) bgModeController.updateDisplay();
      refreshBackground();
    });
    bgGradTopController = fBackground.addColor(params, 'bgGradTop').name('Gradient Center').onChange(() => {
      params.bgMode = 'Studio Radial Gradient';
      if (bgModeController) bgModeController.updateDisplay();
      refreshBackground();
    });
    bgGradBottomController = fBackground.addColor(params, 'bgGradBottom').name('Gradient Edge').onChange(() => {
      params.bgMode = 'Studio Radial Gradient';
      if (bgModeController) bgModeController.updateDisplay();
      refreshBackground();
    });

    const BACKDROP_PRESETS = {
      'Current Palette Default': null,
      'Pitch Black (#000000)': { mode: 'Solid Color', solid: '#000000', top: '#111115', bottom: '#000000' },
      'Studio Charcoal (#141419)': { mode: 'Studio Radial Gradient', top: '#22222a', bottom: '#0b0b0e' },
      'Deep Velvet Navy (#080e1a)': { mode: 'Studio Radial Gradient', top: '#12233f', bottom: '#03060c' },
      'Royal Midnight Violet (#12081f)': { mode: 'Studio Radial Gradient', top: '#23103c', bottom: '#07020d' },
      'Warm Espresso (#1a0d06)': { mode: 'Studio Radial Gradient', top: '#331a0c', bottom: '#0c0502' },
      'Emerald Noir (#06140c)': { mode: 'Studio Radial Gradient', top: '#0d2b1a', bottom: '#020704' },
      'Minimalist Light Grey (#e2e8f0)': { mode: 'Studio Radial Gradient', top: '#f8fafc', bottom: '#cbd5e1' },
      'Pure Studio White (#ffffff)': { mode: 'Solid Color', solid: '#ffffff', top: '#ffffff', bottom: '#f1f5f9' }
    };
    fBackground.add(params, 'backdropPreset', Object.keys(BACKDROP_PRESETS)).name('Backdrop Presets').onChange(v => {
      if (v === 'Current Palette Default') {
        const curP = PRESETS[params.preset] || PRESETS['Analogous'];
        params.bgMode = 'Studio Radial Gradient';
        params.bgGradTop = curP.bgGradTop;
        params.bgGradBottom = curP.bgGradBottom;
        params.bgColor = curP.bgGradBottom;
      } else {
        const b = BACKDROP_PRESETS[v];
        params.bgMode = b.mode;
        if (b.solid) params.bgColor = b.solid;
        params.bgGradTop = b.top;
        params.bgGradBottom = b.bottom;
      }
      if (bgModeController) bgModeController.updateDisplay();
      if (bgColorController) bgColorController.updateDisplay();
      if (bgGradTopController) bgGradTopController.updateDisplay();
      if (bgGradBottomController) bgGradBottomController.updateDisplay();
      refreshBackground();
    });

    fBackground.add({ resetBg: () => {
      const curP = PRESETS[params.preset] || PRESETS['Analogous'];
      params.bgMode = 'Studio Radial Gradient';
      params.bgGradTop = curP.bgGradTop;
      params.bgGradBottom = curP.bgGradBottom;
      params.bgColor = curP.bgGradBottom;
      if (bgModeController) bgModeController.updateDisplay();
      if (bgColorController) bgColorController.updateDisplay();
      if (bgGradTopController) bgGradTopController.updateDisplay();
      if (bgGradBottomController) bgGradBottomController.updateDisplay();
      refreshBackground();
    }}, 'resetBg').name('↺ Reset to Palette BG');

    fBackground.add(params, 'greenScreen').name('Pure #00ff00 Green-Screen').onChange(v => {
      toggleGreenScreen(v);
    });

    // B. Camera & Motion Choreography
    const fMotion = gui.addFolder('Camera & Motion Rigs');
    fMotion.add(params, 'cameraMode', [
      'Slow Showcase Turntable',
      'Macro Focus Glide',
      'Pendulum Sway',
      'Breathing Orbit',
      'Dramatic Low-Angle Rise',
      'Dutch-Angle Roll',
      'Micro-Jitter / Handheld Float',
      'Dynamic Spiral Descent',
      'Static Camera'
    ]).name('Motion Choreography');
    distanceController = fMotion.add(params, 'cameraDistance', 0.3, 3.0, 0.02).name('Camera Distance').onChange(v => {
      if (params.cameraMode === 'Static Camera') {
        updateStaticCameraDistance();
      }
    });
    fMotion.add({ resetDist: () => {
      gsap.to(params, {
        cameraDistance: 1.0,
        duration: 0.5,
        ease: 'power2.out',
        onUpdate: () => {
          if (distanceController) distanceController.updateDisplay();
          if (params.cameraMode === 'Static Camera') updateStaticCameraDistance();
        }
      });
    }}, 'resetDist').name('↺ Reset Distance');

    // Camera Optics & Focal Length Controls
    const LENS_PRESETS = {
      '60mm Studio Isometric (Default)': 60.5,
      '85mm Macro Portrait (Tele)': 85,
      '50mm Standard Cinema Prime': 50,
      '35mm Wide-Angle Cinema': 35,
      '24mm Ultra-Wide Dynamic': 24,
      '105mm Telephoto Compression': 105
    };
    fMotion.add(params, 'lensPreset', Object.keys(LENS_PRESETS)).name('Lens Preset').onChange(v => {
      if (LENS_PRESETS[v]) {
        updateFocalLength(LENS_PRESETS[v]);
        if (focalController) focalController.updateDisplay();
      }
    });
    focalController = fMotion.add(params, 'focalLength', 18, 135, 0.5).name('Focal Length (mm)').onChange(updateFocalLength);
    fovController = fMotion.add(params, 'fov', 15, 90, 0.5).name('Field of View (FOV°)').onChange(updateFov);
    fMotion.add(params, 'focalTargetOffset', -1.5, 2.5, 0.05).name('Focal Look Height');
    fMotion.add({ resetLens: () => {
      gsap.to(params, {
        focalLength: 60.5,
        duration: 0.5,
        ease: 'power2.out',
        onUpdate: () => {
          updateFocalLength(params.focalLength);
          if (focalController) focalController.updateDisplay();
        }
      });
    }}, 'resetLens').name('↺ Reset Focal (60mm)');

    fMotion.add(params, 'animationSpeed', 0.1, 3.0, 0.05).name('Motion Speed');
    fMotion.add({ toggle: () => toggleUnbox() }, 'toggle').name('⚡ Toggle Pop (Ping-Pong)');
    unboxController = fMotion.add(params, 'unboxProgress', 0.0, 1.5, 0.01).name('Lid Pop Scrub');

    // C. Granular Studio Lighting Controls
    const fLight = gui.addFolder('Studio Lighting');
    fLight.close();
    fLight.add(params, 'exposure', 0.5, 2.5, 0.02).name('Tone Exposure').onChange(v => {
      renderer.toneMappingExposure = v;
    });
    fLight.add(params, 'ambientIntensity', 0.0, 2.5, 0.05).name('Env Ambient').onChange(v => {
      lights.ambient.intensity = v;
    });

    const fKey = fLight.addFolder('Key Light');
    fKey.close();
    fKey.addColor(params, 'keyColor').name('Color').onChange(v => lights.key.color.set(v));
    fKey.add(params, 'keyIntensity', 0.0, 10.0, 0.1).name('Intensity').onChange(v => lights.key.intensity = v);
    fKey.add(params, 'keyPosX', -20, 20, 0.5).name('Pos X').onChange(v => lights.key.position.x = v);
    fKey.add(params, 'keyPosY', 0, 30, 0.5).name('Pos Y').onChange(v => lights.key.position.y = v);
    fKey.add(params, 'keyPosZ', -20, 20, 0.5).name('Pos Z').onChange(v => lights.key.position.z = v);

    const fFill = fLight.addFolder('Fill Light');
    fFill.close();
    fFill.addColor(params, 'fillColor').name('Color').onChange(v => lights.fill.color.set(v));
    fFill.add(params, 'fillIntensity', 0.0, 6.0, 0.1).name('Intensity').onChange(v => lights.fill.intensity = v);
    fFill.add(params, 'fillPosX', -20, 20, 0.5).name('Pos X').onChange(v => lights.fill.position.x = v);
    fFill.add(params, 'fillPosY', 0, 30, 0.5).name('Pos Y').onChange(v => lights.fill.position.y = v);
    fFill.add(params, 'fillPosZ', -20, 20, 0.5).name('Pos Z').onChange(v => lights.fill.position.z = v);

    const fRim = fLight.addFolder('Rim Light');
    fRim.close();
    fRim.addColor(params, 'rimColor').name('Color').onChange(v => lights.rim.color.set(v));
    fRim.add(params, 'rimIntensity', 0.0, 15.0, 0.2).name('Intensity').onChange(v => lights.rim.intensity = v);
    fRim.add(params, 'rimPosX', -20, 20, 0.5).name('Pos X').onChange(v => lights.rim.position.x = v);
    fRim.add(params, 'rimPosY', 0, 30, 0.5).name('Pos Y').onChange(v => lights.rim.position.y = v);
    fRim.add(params, 'rimPosZ', -20, 20, 0.5).name('Pos Z').onChange(v => lights.rim.position.z = v);

    const fCore = fLight.addFolder('Internal Core Light');
    fCore.close();
    fCore.addColor(params, 'internalColor').name('Color').onChange(v => {
      lights.core.color.set(v);
      rayUniforms.color.value.set(v);
    });
    fCore.add(params, 'internalIntensity', 0.0, 30.0, 0.5).name('Intensity').onChange(v => {
      lights.core.intensity = v;
      rayUniforms.intensity.value = v;
    });

    // D. Anamorphic Lens Flare Suite (Direct Access)
    const fAnamorphic = gui.addFolder('Anamorphic Lens Flares');
    fAnamorphic.add(postProcessor.settings, 'anamorphicEnabled').name('Enable Anamorphic').onChange(() => postProcessor.updateSettings());
    fAnamorphic.add(postProcessor.settings, 'anamorphicIntensity', 0.0, 10.0, 0.1).name('Streak Intensity').onChange(() => postProcessor.updateSettings());
    fAnamorphic.add(postProcessor.settings, 'anamorphicThreshold', 0.0, 1.0, 0.02).name('Streak Threshold').onChange(() => postProcessor.updateSettings());
    fAnamorphic.add(postProcessor.settings, 'anamorphicRadius', 0.01, 0.5, 0.01).name('Streak Length / Width').onChange(() => postProcessor.updateSettings());
    fAnamorphic.add(postProcessor.settings, 'anamorphicSamples', [16, 32, 64, 128]).name('Quality Samples').onChange(() => postProcessor.updateSettings());
    fAnamorphic.add(postProcessor.settings, 'anamorphicSmoothWidth', 0.01, 0.3, 0.01).name('Streak Softness').onChange(() => postProcessor.updateSettings());
    fAnamorphic.addColor(postProcessor.settings, 'anamorphicColorHex').name('Streak Tint Color').onChange((v) => {
      postProcessor.settings.anamorphicColor.set(v);
      postProcessor.updateSettings();
    });

    // E. Inlined PostProcessor Advanced Suite
    postProcessor.attachGUI(gui, 'Post-Processing Suite');

    // F. Production Viewport & Quality (Antialias & DPR)
    const fViewport = gui.addFolder('Viewport & Antialias');
    fViewport.close();
    antialiasController = fViewport.add(params, 'antialias').name('Scene Antialias (MSAA)').onChange(v => {
      postProcessor.setAntialias(v);
    });
    fViewport.add(params, 'dpr', [1.0, 1.5, 2.0]).name('Device Pixel Ratio').onChange(v => {
      const pr = parseFloat(v);
      renderer.setPixelRatio(pr);
      postProcessor.setSize(window.innerWidth, window.innerHeight, pr);
    });
    fViewport.add(params, 'clickToToggle').name('Click to Ping-Pong');

    // 'H' key toggle GUI visibility for clean cinematic stock footage
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        gui._hidden ? gui.show() : gui.hide();
      }
    });

    // =========================================================================================
    // 15. RESIZE HANDLER & HIGH-PERFORMANCE RENDER LOOP
    // =========================================================================
    function onWindowResize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const pr = renderer.getPixelRatio();

      camera.aspect = w / h;
      camera.updateProjectionMatrix();

      renderer.setSize(w, h);
      postProcessor.setSize(w, h, pr);
    }
    window.addEventListener('resize', onWindowResize);

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const elapsedTime = clock.getElapsedTime();
      const t = elapsedTime * params.animationSpeed;

      rayUniforms.time.value = elapsedTime;

      updateUnboxKinematics(t);
      updateCameraMotion(elapsedTime, params.unboxProgress);

      postProcessor.renderScene(scene, camera);
    }

    animate();
  </script>
</body>
</html>
