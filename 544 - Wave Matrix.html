<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hypnotic Wave Matrix</title>
  <style>
    * {
      padding: 0;
      margin: 0;
      overflow: hidden;
    }
    body {
      background-color: #000000;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
    }
    body:active {
      cursor: grabbing;
    }
    canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
    }
  }
  </script>
</head>
<body>
  <canvas></canvas>

  <script type="module">
    import GUI from 'lil-gui';

    const canvas = document.querySelector('canvas');
    const C = canvas.getContext('2d');
    const m = Math;

    let W = canvas.width = window.innerWidth;
    let H = canvas.height = window.innerHeight;
    let HW = W / 2;
    let HH = H / 2;

    const SCHEMES = {
      'Original': {
        colors: ['#ffffff'],
        bg: '#000000',
        blend: 'lighter'
      },
      'Monochromatic': {
        colors: ['#00e5ff', '#33ebff', '#66f0ff', '#99f5ff', '#00b4d8', '#ffffff'],
        bg: '#03101c',
        blend: 'lighter'
      },
      'Analogous': {
        colors: ['#00f5d4', '#00bbf9', '#4361ee', '#7209b7', '#3f37c9'],
        bg: '#050814',
        blend: 'lighter'
      },
      'Complementary': {
        colors: ['#ff6b35', '#f7c59f', '#004e89', '#1a759f', '#00a8e8'],
        bg: '#050a12',
        blend: 'lighter'
      },
      'Split-complementary': {
        colors: ['#3a86ff', '#ff5400', '#ffbe0b', '#70e000', '#8338ec'],
        bg: '#0a0814',
        blend: 'lighter'
      },
      'Triadic': {
        colors: ['#ff007f', '#ffbe0b', '#00f5d4', '#7209b7'],
        bg: '#0e0517',
        blend: 'lighter'
      },
      'Tetradic': {
        colors: ['#ff0055', '#ffcc00', '#00f0ff', '#7928ca'],
        bg: '#0f051d',
        blend: 'lighter'
      },
      'Double split-complementary': {
        colors: ['#9d4edd', '#c77dff', '#52b788', '#ff758f', '#48cae4'],
        bg: '#0b0a17',
        blend: 'lighter'
      },
      'Achromatic': {
        colors: ['#ffffff', '#e0e0e0', '#9e9e9e', '#ffffff'],
        bg: '#000000',
        blend: 'lighter',
        invertedColors: ['#000000', '#222222', '#555555', '#111111'],
        invertedBg: '#ffffff',
        invertedBlend: 'source-over'
      },
      'Achromatic + Accent': {
        colors: ['#ffffff', '#9e9e9e', '#ff0033', '#ffffff', '#ff1744'],
        bg: '#000000',
        blend: 'lighter',
        invertedColors: ['#000000', '#424242', '#ff0033', '#111111', '#d50000'],
        invertedBg: '#ffffff',
        invertedBlend: 'source-over'
      },
      'Neutral + Accent': {
        colors: ['#e2e8f0', '#94a3b8', '#64748b', '#ffb703', '#f59e0b', '#cbd5e1'],
        bg: '#0f172a',
        blend: 'lighter'
      },
      'Palette 1 (F6AA1C, BC3908, 941B0C, 220901)': {
        colors: ['#F6AA1C', '#BC3908', '#941B0C', '#F6AA1C'],
        bg: '#220901',
        blend: 'lighter'
      },
      'Palette 2 (63D1CF, 5BC0BE, 4BAD9E, 0B132B)': {
        colors: ['#63D1CF', '#5BC0BE', '#4BAD9E', '#4BAD9E'],
        bg: '#0B132B',
        blend: 'lighter'
      },
      'Palette 3 (AA60C8, D69ADE, C9A3C6, 0D001D)': {
        colors: ['#AA60C8', '#D69ADE', '#C9A3C6', '#CFB5C2'],
        bg: '#0D001D',
        blend: 'lighter'
      },
      'Palette 4 (FEF1BE, FFBA00, 008189, 061210)': {
        colors: ['#FEF1BE', '#FFBA00', '#008189', '#00474D'],
        bg: '#061210',
        blend: 'lighter'
      },
      'Palette 5 (D4FFB0, 7FFF00, 00B894, 05140A)': {
        colors: ['#D4FFB0', '#7FFF00', '#00B894', '#0A3322'],
        bg: '#05140A',
        blend: 'lighter'
      },
      'Palette 6 (FFE8CC, FF8C00, C7501A, 0E0618)': {
        colors: ['#FFE8CC', '#FF8C00', '#C7501A', '#3D1050'],
        bg: '#0E0618',
        blend: 'lighter'
      },
      'Palette 7 (E8E0FF, B38FFF, 6A3DE8, 090612)': {
        colors: ['#E8E0FF', '#B38FFF', '#6A3DE8', '#1A1250'],
        bg: '#090612',
        blend: 'lighter'
      },
      'Palette 8 (E0FBFF, 00F0FF, D40078, 05020F)': {
        colors: ['#E0FBFF', '#00F0FF', '#D40078', '#1E0A3D'],
        bg: '#05020F',
        blend: 'lighter'
      }
    };

    const SCHEME_KEYS = Object.keys(SCHEMES);

    const params = {
      // Theme & Colors
      colorScheme: 'Original',
      greenscreen: false,
      bgColor: '#000000',
      invertAchromatic: false,
      useCustomColor: false,
      customColor: '#ffffff',
      colorMapping: 'Vortex Flow',
      blendMode: 'lighter',

      // Geometry
      gridSpacing: 20,
      circleScale: 1.0,
      distFactor: 0.05,
      waveFreq: 1.0,
      angleWarp: 1.0,

      // Motion
      speed: 1.0,
      animate: true,

      // Transform (Pan / Zoom)
      zoom: 1.0,
      panX: 0,
      panY: 0,
      resetView: () => {
        params.zoom = 1.0;
        params.panX = 0;
        params.panY = 0;
        updateGuiDisplay(gui);
      },

      // Interactivity
      clickToRandomize: true,
      randomize: () => randomizeScene()
    };

    function updateGuiDisplay(g) {
      if (!g) return;
      if (g.controllers) {
        g.controllers.forEach(c => c.updateDisplay());
      }
      if (g.folders) {
        g.folders.forEach(f => updateGuiDisplay(f));
      }
    }

    function applyScheme(key) {
      const scheme = SCHEMES[key];
      if (!scheme) return;
      params.colorScheme = key;
      if ((key === 'Achromatic' || key === 'Achromatic + Accent') && params.invertAchromatic) {
        params.bgColor = scheme.invertedBg;
        params.blendMode = scheme.invertedBlend;
      } else {
        params.bgColor = scheme.bg;
        params.blendMode = scheme.blend;
      }
      updateGuiDisplay(gui);
    }

    function getColor(cx, cy, dist, theta, s) {
      if (params.useCustomColor) {
        return params.customColor;
      }
      const scheme = SCHEMES[params.colorScheme] || SCHEMES['Original'];
      let palette = scheme.colors;

      if ((params.colorScheme === 'Achromatic' || params.colorScheme === 'Achromatic + Accent') && params.invertAchromatic) {
        palette = scheme.invertedColors || scheme.colors;
      }

      if (palette.length === 1) {
        return palette[0];
      }

      let idx = 0;
      if (params.colorMapping === 'Wave (s)') {
        idx = Math.floor((s / 2) * palette.length);
      } else if (params.colorMapping === 'Radial (Distance)') {
        idx = Math.floor(dist * 0.4);
      } else if (params.colorMapping === 'Angular (Theta)') {
        const norm = (theta + m.PI) / (2 * m.PI);
        idx = Math.floor(norm * palette.length);
      } else {
        const normTheta = (theta + m.PI) / (2 * m.PI);
        const v = s * 0.6 + normTheta * 2.0 + dist * 0.15;
        idx = Math.floor(Math.abs(v) * 2);
      }

      idx = Math.abs(idx) % palette.length;
      return palette[idx];
    }

    function randomizeScene() {
      const randomSchemeKey = SCHEME_KEYS[Math.floor(Math.random() * SCHEME_KEYS.length)];
      params.colorScheme = randomSchemeKey;

      if (randomSchemeKey === 'Achromatic' || randomSchemeKey === 'Achromatic + Accent') {
        params.invertAchromatic = Math.random() > 0.5;
      } else {
        params.invertAchromatic = false;
      }

      const scheme = SCHEMES[randomSchemeKey];
      if (params.invertAchromatic) {
        params.bgColor = scheme.invertedBg;
        params.blendMode = scheme.invertedBlend;
      } else {
        params.bgColor = scheme.bg;
        params.blendMode = scheme.blend;
      }

      const spacings = [14, 16, 18, 20, 22, 25, 28];
      params.gridSpacing = spacings[Math.floor(Math.random() * spacings.length)];
      params.circleScale = +(0.7 + Math.random() * 0.9).toFixed(2);
      params.distFactor = +(0.02 + Math.random() * 0.07).toFixed(3);
      params.waveFreq = +(Math.floor(1 + Math.random() * 5)).toFixed(1);
      params.angleWarp = +(Math.floor(1 + Math.random() * 4)).toFixed(1);

      const speeds = [-1.5, -1.0, 0.8, 1.0, 1.2, 1.5, 2.0];
      params.speed = speeds[Math.floor(Math.random() * speeds.length)];

      const mappings = ['Vortex Flow', 'Wave (s)', 'Radial (Distance)', 'Angular (Theta)'];
      params.colorMapping = mappings[Math.floor(Math.random() * mappings.length)];

      params.useCustomColor = false;

      updateGuiDisplay(gui);
    }

    // --- GUI SETUP ---
    const gui = new GUI({ title: 'Scene Controls' });

    const themeFolder = gui.addFolder('Theme & Colors');
    themeFolder.add(params, 'colorScheme', SCHEME_KEYS).name('Color Scheme').onChange(applyScheme);
    themeFolder.add(params, 'greenscreen').name('Greenscreen (#00ff00)');
    themeFolder.addColor(params, 'bgColor').name('Background Color');
    themeFolder.add(params, 'invertAchromatic').name('Invert B&W / W&B').onChange(() => applyScheme(params.colorScheme));
    themeFolder.add(params, 'useCustomColor').name('Use Custom Color');
    themeFolder.addColor(params, 'customColor').name('Custom Color');
    themeFolder.add(params, 'colorMapping', ['Vortex Flow', 'Wave (s)', 'Radial (Distance)', 'Angular (Theta)']).name('Color Mapping');
    themeFolder.add(params, 'blendMode', ['lighter', 'source-over', 'screen', 'multiply']).name('Blend Mode');

    const geomFolder = gui.addFolder('Geometry');
    geomFolder.add(params, 'gridSpacing', 10, 40, 1).name('Grid Spacing');
    geomFolder.add(params, 'circleScale', 0.2, 2.5, 0.05).name('Circle Scale');
    geomFolder.add(params, 'distFactor', 0.01, 0.15, 0.005).name('Distortion Factor');
    geomFolder.add(params, 'waveFreq', 0.5, 8.0, 0.5).name('Wave Frequency');
    geomFolder.add(params, 'angleWarp', 0.5, 8.0, 0.5).name('Angle Warp');

    const motionFolder = gui.addFolder('Motion');
    motionFolder.add(params, 'speed', -4.0, 4.0, 0.1).name('Speed');
    motionFolder.add(params, 'animate').name('Play Animation');

    const transformFolder = gui.addFolder('Transform');
    const zoomCtrl = transformFolder.add(params, 'zoom', 0.1, 8.0, 0.05).name('Zoom');
    const panXCtrl = transformFolder.add(params, 'panX', -2000, 2000, 1).name('Pan X');
    const panYCtrl = transformFolder.add(params, 'panY', -2000, 2000, 1).name('Pan Y');
    transformFolder.add(params, 'resetView').name('Reset Pan/Zoom');

    const actionFolder = gui.addFolder('Interaction');
    actionFolder.add(params, 'clickToRandomize').name('Click Scene to Randomize');
    actionFolder.add(params, 'randomize').name('🎲 Randomize Now');

    // Hide/Show GUI with "H" key
    let guiVisible = true;
    window.addEventListener('keydown', (e) => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) return;
      if (e.key === 'h' || e.key === 'H') {
        guiVisible = !guiVisible;
        if (guiVisible) {
          gui.show();
        } else {
          gui.hide();
        }
      }
    });

    // --- INTERACTION: ZOOM & DRAG & CLICK ---
    let isPointerDown = false;
    let isDragging = false;
    let startX = 0, startY = 0;
    let initialPanX = 0, initialPanY = 0;

    canvas.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      isPointerDown = true;
      isDragging = false;
      startX = e.clientX;
      startY = e.clientY;
      initialPanX = params.panX;
      initialPanY = params.panY;
      canvas.setPointerCapture(e.pointerId);
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!isPointerDown) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      if (!isDragging && m.hypot(dx, dy) > 5) {
        isDragging = true;
        document.body.style.cursor = 'grabbing';
      }
      if (isDragging) {
        params.panX = initialPanX + dx;
        params.panY = initialPanY + dy;
        panXCtrl.updateDisplay();
        panYCtrl.updateDisplay();
      }
    });

    canvas.addEventListener('pointerup', (e) => {
      if (!isPointerDown) return;
      isPointerDown = false;
      document.body.style.cursor = 'grab';
      try {
        canvas.releasePointerCapture(e.pointerId);
      } catch (err) {}

      if (!isDragging && params.clickToRandomize) {
        randomizeScene();
      }
      isDragging = false;
    });

    canvas.addEventListener('pointercancel', () => {
      isPointerDown = false;
      isDragging = false;
      document.body.style.cursor = 'grab';
    });

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.08 : 0.925;
      const newZoom = m.min(m.max(params.zoom * zoomFactor, 0.1), 10);

      const sx = e.clientX;
      const sy = e.clientY;

      const wx = HW + (sx - HW - params.panX) / params.zoom;
      const wy = HH + (sy - HH - params.panY) / params.zoom;

      params.panX = sx - HW - (wx - HW) * newZoom;
      params.panY = sy - HH - (wy - HH) * newZoom;
      params.zoom = newZoom;

      zoomCtrl.updateDisplay();
      panXCtrl.updateDisplay();
      panYCtrl.updateDisplay();
    }, { passive: false });

    // --- RESIZE ---
    window.addEventListener('resize', () => {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
      HW = W / 2;
      HH = H / 2;
    });

    // --- ANIMATION & RENDER LOOP ---
    let lastTime = 0;
    let simTime = 0;

    function render(t) {
      const currentBg = params.greenscreen ? '#00ff00' : params.bgColor;
      C.globalCompositeOperation = 'source-over';
      C.fillStyle = currentBg;
      C.fillRect(0, 0, W, H);

      const effectiveBlend = (params.greenscreen && params.blendMode === 'lighter') ? 'source-over' : params.blendMode;
      C.globalCompositeOperation = effectiveBlend;

      C.save();
      C.translate(HW + params.panX, HH + params.panY);
      C.scale(params.zoom, params.zoom);
      C.translate(-HW, -HH);

      const l = m.max(8, params.gridSpacing);

      const worldLeft = HW + (0 - HW - params.panX) / params.zoom;
      const worldRight = HW + (W - HW - params.panX) / params.zoom;
      const worldTop = HH + (0 - HH - params.panY) / params.zoom;
      const worldBottom = HH + (H - HH - params.panY) / params.zoom;

      let startX = m.floor(worldLeft / l) * l - l * 2;
      let endX = m.ceil(worldRight / l) * l + l * 2;
      let startY = m.floor(worldTop / l) * l - l * 2;
      let endY = m.ceil(worldBottom / l) * l + l * 2;

      const maxCells = 160;
      if ((endX - startX) / l > maxCells) {
        const midX = (startX + endX) / 2;
        startX = midX - (maxCells / 2) * l;
        endX = midX + (maxCells / 2) * l;
      }
      if ((endY - startY) / l > maxCells) {
        const midY = (startY + endY) / 2;
        startY = midY - (maxCells / 2) * l;
        endY = midY + (maxCells / 2) * l;
      }

      const degToRad = m.PI / 180;
      const angleWarp = params.angleWarp;
      const waveFreq = params.waveFreq;
      const distFactor = params.distFactor;
      const circleScale = params.circleScale;

      for (let y = startY; y <= endY; y += l) {
        const cy = y - HH;
        for (let x = startX; x <= endX; x += l) {
          const cx = x - HW;
          const dist = m.sqrt(cx * cx + cy * cy) * distFactor;
          const theta = m.atan2(cy, cx);
          const s = m.sin(m.sin(theta * degToRad * angleWarp) + theta * waveFreq + dist - t) + 1;
          const radius = (l * s / 4) * circleScale;

          if (radius > 0.3) {
            C.fillStyle = getColor(cx, cy, dist, theta, s);
            C.beginPath();
            C.arc(x, y, radius, 0, m.PI * 2, false);
            C.fill();
          }
        }
      }

      C.restore();
    }

    function loop(currentTime) {
      if (!lastTime) lastTime = currentTime;
      const dt = (currentTime - lastTime) / 1000;
      lastTime = currentTime;

      if (params.animate) {
        simTime += dt * params.speed;
      }

      render(simTime);
      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
