// ============================================================
//  Shaders

const vertexShader = /* glsl */ `
in vec3 position;
void main() {
  gl_Position = vec4(position.xy, 0.0, 1.0);
}
`;

const fragmentShader = /* glsl */ `
precision highp float;
precision highp int;

uniform vec2  uResolution;
uniform vec3  uCamPos;
uniform vec3  uCamRight;
uniform vec3  uCamUp;
uniform vec3  uCamForward;
uniform float uFocal;
uniform vec2  uPan;

uniform mat3  uObjRot;
uniform vec2  uTwist;
uniform float uOffsetY;

uniform float uMaxDist;
uniform float uSurfEps;
uniform float uStepFactor;
uniform float uFractalScale;
uniform float uBoundRadius;

uniform float uHoloFreq;
uniform float uHoloPhase;
uniform float uHoloAmount;
uniform float uSweepY;
uniform float uScanlineAmt;

// Lighting & Colors
uniform float uGlowStrength;
uniform vec3  uGlowColor;
uniform vec3  uFilmTint;
uniform float uExposure;
uniform float uMasterLightIntensity;

uniform vec3  uLight1Color;
uniform float uLight1Intensity;
uniform vec3  uLight2Color;
uniform float uLight2Intensity;
uniform vec3  uLight3Color;
uniform float uLight3Intensity;
uniform vec3  uAmbientColor;
uniform float uAmbientIntensity;

uniform float uGlassIor;
uniform float uDispersion;
uniform vec3  uGlassAbsorb;

uniform vec3  uBgColor;

out vec4 fragColor;

const float TAU = 6.28318530718;

// ---------- Math ----------
vec2 sphereIntersect(vec3 ro, vec3 rd, float r) {
  float b = dot(ro, rd);
  float c = dot(ro, ro) - r * r;
  float h = b * b - c;
  if (h < 0.0) return vec2(-1.0);
  h = sqrt(h);
  return vec2(-b - h, -b + h);
}

vec3 safeRefract(vec3 I, vec3 N, float eta) {
  vec3 r = refract(I, N, eta);
  return dot(r, r) < 1e-6 ? reflect(I, N) : r;
}

// ---------- Color & Palette ----------
vec3 holoPalette(float x) {
  vec3 c = 0.5 + 0.5 * cos(TAU * (x + vec3(0.0, 0.33, 0.67)));
  c = mix(c, c * vec3(0.75, 0.9, 1.15), 0.5);
  return c * c * uGlowColor;
}

vec3 thinFilm(float ndv, float thickness) {
  float sinT2 = (1.0 - ndv * ndv) / (1.4 * 1.4);
  float cosT  = sqrt(max(1.0 - sinT2, 0.0));
  float phase = thickness * cosT * uHoloFreq;
  vec3  c = 0.5 + 0.5 * cos(TAU * (phase + vec3(0.0, 0.33, 0.67)));
  c = mix(c, c * vec3(0.8, 0.95, 1.2), 0.4);
  return (2.0 * c * c + 0.15) * uFilmTint;
}

vec3 acesTonemap(vec3 x) {
  return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0);
}

vec3 toDisplay(vec3 c) {
  return pow(acesTonemap(max(c * uExposure, 0.0)), vec3(1.0 / 2.2));
}

// ---------- Environment & Light Sources ----------
vec3 envLit(vec3 d) {
  vec3 amb = uAmbientColor * uAmbientIntensity * mix(0.6, 1.4, clamp(d.y * 0.5 + 0.5, 0.0, 1.0));
  vec3 c = amb;

  // Key Light (Light 1)
  c += uLight1Color * (uLight1Intensity * 3.0) *
       smoothstep(0.25, 0.05, abs(d.x)) * smoothstep(0.55, 0.8, d.y);

  // Fill Light (Light 2)
  c += uLight2Color * (uLight2Intensity * 2.0) *
       smoothstep(0.78, 0.96, dot(d, vec3(-0.94, 0.19, 0.28)));

  // Rim Light (Light 3)
  c += uLight3Color * (uLight3Intensity * 1.6) *
       smoothstep(0.80, 0.97, dot(d, vec3(0.93, -0.28, -0.19)));

  c += uAmbientColor * 0.5 * smoothstep(0.0, -0.8, d.y);
  return c * uMasterLightIntensity;
}

// ---------- SDF ----------
float sdBox(vec3 p, vec3 b) {
  vec3 q = abs(p) - b;
  return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0);
}

float map(vec3 p, out float trap) {
  p = uObjRot * p;
  vec3  off = vec3(1.0, uOffsetY, 1.0);
  mat2  tw  = mat2(uTwist.x, uTwist.y, -uTwist.y, uTwist.x);
  float k   = uFractalScale - 1.0;
  float s   = 1.0;
  trap = 1e9;

  for (int i = 0; i < FRACTAL_ITERS; i++) {
    p = abs(p);
    if (p.x < p.y) p.xy = p.yx;
    if (p.x < p.z) p.xz = p.zx;
    if (p.y < p.z) p.yz = p.zy;
    p.xy = tw * p.xy;
    p = p * uFractalScale - off * k;
    if (p.z < -0.5 * off.z * k) p.z += off.z * k;
    s *= uFractalScale;
    trap = min(trap, dot(p, p));
  }
  return sdBox(p, vec3(1.0)) / s;
}

float mapD(vec3 p) {
  float t;
  return map(p, t);
}

// ---------- Normals & AO ----------
vec3 calcNormal(vec3 p, float h) {
  const vec2 k = vec2(1.0, -1.0);
  vec3 g = k.xyy * mapD(p + k.xyy * h) +
           k.yyx * mapD(p + k.yyx * h) +
           k.yxy * mapD(p + k.yxy * h) +
           k.xxx * mapD(p + k.xxx * h);
  return g * inversesqrt(max(dot(g, g), 1e-12));
}

float calcAO(vec3 p, vec3 n) {
  float occ = 0.0, w = 1.0;
  for (int i = 0; i < AO_SAMPLES; i++) {
    float h = 0.01 + 0.06 * float(i);
    occ += (h - mapD(p + n * h)) * w;
    w *= 0.7;
  }
  return clamp(1.0 - 3.0 * occ, 0.0, 1.0);
}

// ---------- Interior march ----------
float traceInterior(vec3 ro, vec3 rd, out vec3 pExit) {
  float t = 0.0;
  for (int i = 0; i < INTERIOR_STEPS; i++) {
    float d = -mapD(ro + rd * t);
    if (d < 0.001) break;
    t += max(d * uStepFactor, 0.004);
    if (t > 2.0 * uBoundRadius) break;
  }
  pExit = ro + rd * t;
  return t;
}

// ---------- Render one sample ----------
vec3 render(vec2 fragCoord) {
  vec2 uv = (2.0 * fragCoord - uResolution) / uResolution.y;

  // Camera ray origin with pan translation offset
  vec3 ro = uCamPos - (uCamRight * uPan.x + uCamUp * uPan.y);
  vec3 rd = normalize(uv.x * uCamRight + uv.y * uCamUp + uFocal * uCamForward);

  vec3  objCol   = vec3(0.0);
  float coverage = 0.0;

  vec2  bnd  = sphereIntersect(ro, rd, uBoundRadius);
  float t    = max(bnd.x, 0.0);
  float tFar = min(bnd.y, t + uMaxDist);
  float glow = 0.0;
  float trap = 0.0;
  bool  hit  = false;

  if (bnd.y > 0.0) {
    for (int i = 0; i < MAX_STEPS; i++) {
      float d = map(ro + rd * t, trap);
      glow += exp(-d * 30.0) * 0.012;
      if (d < uSurfEps * t) { hit = true; break; }
      t += d * uStepFactor;
      if (t > tFar) break;
    }
  }

  if (hit) {
    vec3  p   = ro + rd * t;
    vec3  n   = calcNormal(p, max(uSurfEps * t, 0.0005));
    float ao  = calcAO(p, n);
    float ndv = clamp(dot(n, -rd), 0.0, 1.0);
    float fr  = 1.0 - ndv;
    float fr2 = fr * fr;
    float F   = 0.04 + 0.96 * fr2 * fr2 * fr;

    float filmThick = 1.0 + 0.35 * log(1.0 + trap)
                    + 0.4 * sin(dot(p, vec3(2.1, 1.7, 2.6)))
                    + uHoloPhase / uHoloFreq;
    vec3 film     = thinFilm(ndv, filmThick);
    vec3 reflTint = mix(vec3(1.0), film, uHoloAmount);

    vec3 refl = envLit(reflect(rd, n)) * reflTint;

    vec3 dIn = safeRefract(rd, n, 1.0 / uGlassIor);
    vec3 pExit;
    float thick = traceInterior(p - n * 0.01, dIn, pExit);
    vec3  nExit = -calcNormal(pExit, 0.001);
    vec3  iors  = uGlassIor + vec3(-uDispersion, 0.0, uDispersion);
    vec3 trans;
    trans.r = envLit(safeRefract(dIn, nExit, iors.r)).r;
    trans.g = envLit(safeRefract(dIn, nExit, iors.g)).g;
    trans.b = envLit(safeRefract(dIn, nExit, iors.b)).b;
    trans *= exp(-thick * uGlassAbsorb);

    // Diffuse & Specular from key & fill lights
    const vec3 L1 = vec3(0.5306, 0.7960, -0.2908);
    float dif1  = clamp(dot(n, L1), 0.0, 1.0);
    vec3  hv1   = normalize(L1 - rd);
    float spec1 = pow(clamp(dot(n, hv1), 0.0, 1.0), 96.0);

    const vec3 L2 = vec3(-0.94, 0.19, 0.28);
    float dif2  = clamp(dot(n, L2), 0.0, 1.0);
    vec3  hv2   = normalize(L2 - rd);
    float spec2 = pow(clamp(dot(n, hv2), 0.0, 1.0), 64.0);

    vec3 specTotal = (uLight1Color * (spec1 * uLight1Intensity) + uLight2Color * (spec2 * uLight2Intensity * 0.5)) * uMasterLightIntensity;
    float difTotal = (dif1 * uLight1Intensity + dif2 * uLight2Intensity * 0.5) * uMasterLightIntensity;

    float aoSoft = mix(0.55, 1.0, ao);
    objCol  = mix(trans, refl, F) * aoSoft;
    objCol += film * uHoloAmount * 0.08 * (0.3 + difTotal) * ao;
    objCol += reflTint * specTotal * 2.5 * ao;

    float sy = p.y - uSweepY;
    objCol += film * exp(-sy * sy * 60.0) * 0.6;

    float depth = max(t - (length(ro) - uBoundRadius), 0.0);
    coverage = exp(-0.08 * depth * depth);
  }

  // Volumetric edge glow
  vec3 glowLin = holoPalette(0.6 + 0.25 * uv.y + uHoloPhase) * glow * uGlowStrength;

  // Composite against background color
  vec3 bgWithGlow = 1.0 - (1.0 - uBgColor) * (1.0 - toDisplay(glowLin));
  vec3 col = mix(bgWithGlow, toDisplay(objCol + glowLin), coverage);

  // Scanlines
  col *= 1.0 - uScanlineAmt * (0.5 + 0.5 * sin(fragCoord.y * TAU / 3.0));
  return col;
}

void main() {
#if AA > 1
  vec3 col = vec3(0.0);
  for (int j = 0; j < AA; j++) {
    for (int i = 0; i < AA; i++) {
      vec2 o = (vec2(float(i), float(j)) + 0.5) / float(AA) - 0.5;
      col += render(gl_FragCoord.xy + o);
    }
  }
  col /= float(AA * AA);
#else
  vec3 col = render(gl_FragCoord.xy);
#endif
  fragColor = vec4(col, 1.0);
}
`;

const camRight = new THREE.Vector3();
const camUp = new THREE.Vector3();
const camForward = new THREE.Vector3();

function setVec3FromHex(targetVec3, hex) {
  tmpCol.set(hex);

}
function hexToVec3(hex) {

// ============================================================
//  Camera / Resize / DPR / Background
// ============================================================
let animDistanceOffset = 0.0;
let animHeightOffset = 0.0;

function updateCamera() {
  const effectiveDistance = Math.max(PARAMS.camDistance + animDistanceOffset, 0.8);
  const effectiveHeight = PARAMS.camHeight + animHeightOffset;

  camPos.set(0, effectiveHeight, -effectiveDistance);
  camForward.copy(camPos).negate().normalize();
  camRight.crossVectors(WORLD_UP, camForward).normalize();
  camUp.crossVectors(camForward, camRight);
  uniforms.uFocal.value = 1.0 / Math.tan(THREE.MathUtils.degToRad(PARAMS.fov) * 0.5);
  uniforms.uPan.value.set(PARAMS.panX, PARAMS.panY);
}

function updateBackgroundColor() {
  const colorStr = PARAMS.greenScreen ? '#00ff00' : PARAMS.backgroundColor;
  const n = parseInt(colorStr.slice(1), 16);
  uniforms.uBgColor.value.set(((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255);
  document.body.style.background = colorStr;
}

function resize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  renderer.setSize(w, h);
  composer.setSize(w, h);
  renderer.getDrawingBufferSize(uniforms.uResolution.value);
}

function setDPR(value) {
  const dpr = THREE.MathUtils.clamp(value, 0.5, MAX_DPR);
  PARAMS.dpr = dpr;
  renderer.setPixelRatio(dpr);
  composer.setPixelRatio(dpr);
  resize();
}

function setDefine(name, value) {
  const v = Math.round(value);
  if (material.defines[name] === v) return;
  material.defines[name] = v;
  material.needsUpdate = true;
}

window.addEventListener('resize', resize);
updateCamera();
updateBackgroundColor();
resize();

// ============================================================
//  Animation state
// ============================================================
const anim = {
  rotPhase: 0,
  twistPhase: 0,
  morphPhase: 0,
  holoPhase: 0,
  sweepPhase: 0,
  camPhase: 0
};

const rotY = new THREE.Matrix3();
const rotX = new THREE.Matrix3();
const autoRot = new THREE.Matrix3();
const userRotT = new THREE.Matrix3();
const userMat4 = new THREE.Matrix4();
const userQuat = new THREE.Quaternion();
const tmpQuat = new THREE.Quaternion();

function updateAnimation(dt) {
  const t = PARAMS.paused ? 0 : dt * PARAMS.timeScale;
  anim.rotPhase   += t * PARAMS.rotSpeed;
  anim.twistPhase += t * PARAMS.twistSpeed;
  anim.morphPhase += t * PARAMS.morphSpeed;
  anim.holoPhase  += t * PARAMS.holoSpeed;
  anim.sweepPhase += t * PARAMS.sweepSpeed;
  anim.camPhase   += t * 0.8;

  // Compute camera animation modulations based on the selected mode
  let ay = 0;
  let ax = 0;
  animDistanceOffset = 0.0;
  animHeightOffset = 0.0;

  switch (PARAMS.animationMode) {
    case 'Orbit & Breathe':
      ay = anim.rotPhase;
      ax = 0.35 + 0.18 * Math.sin(anim.rotPhase * 0.65);
      break;

    case 'Static View':
      // Static animation without camera movement
      ay = 0.0;
      ax = 0.0;
      animDistanceOffset = 0.0;
      animHeightOffset = 0.0;
      break;

    case 'Slow Zen Float':
      animHeightOffset = Math.sin(anim.rotPhase * 0.8) * 0.95;
      ay = Math.sin(anim.rotPhase * 0.3) * 0.22;
      ax = 0.25 + 0.1 * Math.cos(anim.rotPhase * 0.5);
      break;

    case 'Hypnotic Twist':
      ay = anim.rotPhase * 0.35;
      ax = 0.28 + 0.15 * Math.sin(anim.twistPhase * 0.5);
      break;

    case 'Deep Core Drift':
      // Push-pull zoom relative to user distance without overriding it
      animDistanceOffset = Math.sin(anim.camPhase * 0.45) * 0.85;
      ay = anim.rotPhase * 0.2;
      ax = 0.3 + 0.12 * Math.sin(anim.camPhase * 0.3);
      break;

    case 'Spiral Ascension':
      ay = anim.rotPhase * 0.6;
      animHeightOffset = Math.sin(anim.rotPhase * 0.35) * 1.6;
      ax = 0.35 + 0.15 * Math.cos(anim.rotPhase * 0.35);
      break;

    case 'Horizon Sweep':
      ay = Math.sin(anim.rotPhase * 0.4) * 0.65;
      animHeightOffset = Math.cos(anim.rotPhase * 0.4) * 0.4;
      ax = 0.3;
      break;

    case 'Crystalline Echo':
      ay = Math.sin(anim.rotPhase * 0.5) * 0.4;
      ax = 0.3 + Math.cos(anim.rotPhase * 0.8) * 0.25;
      animDistanceOffset = Math.sin(anim.rotPhase * 0.5) * 0.45;
      break;
  }

  updateCamera();

  const cy = Math.cos(ay), sy = Math.sin(ay);
  const cx = Math.cos(ax), sx = Math.sin(ax);
  rotY.set(cy, 0, sy,   0, 1, 0,   -sy, 0, cy);
  rotX.set(1, 0, 0,    0, cx, -sx,  0, sx, cx);
  autoRot.multiplyMatrices(rotY, rotX);

  userMat4.makeRotationFromQuaternion(userQuat);
  userRotT.setFromMatrix4(userMat4).transpose();
  uniforms.uObjRot.value.multiplyMatrices(autoRot, userRotT);

  const twist = 0.12 + 0.18 * Math.sin(anim.twistPhase);
  uniforms.uTwist.value.set(Math.cos(twist), Math.sin(twist));
  uniforms.uOffsetY.value = 1.0 + PARAMS.morphAmount * Math.sin(anim.morphPhase);
  uniforms.uHoloPhase.value = anim.holoPhase;
  const s = anim.sweepPhase % 5.0;
  uniforms.uSweepY.value = (s < 0 ? s + 5.0 : s) - 2.5;
}

function syncUniforms() {
  const u = uniforms;
  u.uMaxDist.value = PARAMS.maxDist;
  u.uSurfEps.value = PARAMS.surfEps;
  u.uStepFactor.value = PARAMS.stepFactor;
  u.uFractalScale.value = PARAMS.fractalScale;
  u.uBoundRadius.value = PARAMS.boundRadius;
  u.uHoloFreq.value = PARAMS.holoFreq;
  u.uHoloAmount.value = PARAMS.holoAmount;
  u.uScanlineAmt.value = PARAMS.scanlines;
  u.uGlowStrength.value = PARAMS.glowStrength;
  setVec3FromHex(u.uGlowColor.value, PARAMS.glowColor);
  setVec3FromHex(u.uFilmTint.value, PARAMS.filmTint);
  u.uExposure.value = PARAMS.exposure;
  u.uMasterLightIntensity.value = PARAMS.masterLightIntensity;
  setVec3FromHex(u.uLight1Color.value, PARAMS.light1Color);
  u.uLight1Intensity.value = PARAMS.light1Intensity;
  setVec3FromHex(u.uLight2Color.value, PARAMS.light2Color);
  u.uLight2Intensity.value = PARAMS.light2Intensity;
  setVec3FromHex(u.uLight3Color.value, PARAMS.light3Color);
  u.uLight3Intensity.value = PARAMS.light3Intensity;
  setVec3FromHex(u.uAmbientColor.value, PARAMS.ambientColor);
  u.uAmbientIntensity.value = PARAMS.ambientIntensity;
  u.uGlassIor.value = PARAMS.glassIor;
  u.uDispersion.value = PARAMS.dispersion;
  u.uGlassAbsorb.value.set(PARAMS.absorbR, PARAMS.absorbG, PARAMS.absorbB);
  u.uPan.value.set(PARAMS.panX, PARAMS.panY);
}

// ============================================================
//  Mouse & Touch: Rotation, Pan Drag, Zoom & Click Detection
// ============================================================
const pointer = {
  dragging: false,
  panning: false,
  id: -1,
  startX: 0,
  startY: 0,
  startTime: 0,
  lastX: 0,
  lastY: 0,
  accX: 0,
  accY: 0
};
const spin = { velX: 0, velY: 0 };

canvas.addEventListener('pointerdown', (e) => {
  pointer.id = e.pointerId;
  pointer.startX = e.clientX;
  pointer.startY = e.clientY;
  pointer.lastX = e.clientX;
  pointer.lastY = e.clientY;
  pointer.startTime = performance.now();
  pointer.accX = 0;
  pointer.accY = 0;

  // Secondary button (right click), middle button, or shift key drags object across screen
  if (e.button === 2 || e.button === 1 || e.shiftKey) {
    pointer.panning = true;
    pointer.dragging = false;
  } else if (e.button === 0) {
    pointer.dragging = true;
    pointer.panning = false;
  }

  canvas.setPointerCapture(e.pointerId);
  canvas.classList.add('dragging');
});

canvas.addEventListener('pointermove', (e) => {
  if (e.pointerId !== pointer.id) return;
  const dx = e.clientX - pointer.lastX;
  const dy = e.clientY - pointer.lastY;
  pointer.lastX = e.clientX;
  pointer.lastY = e.clientY;

  if (pointer.panning) {
    // Pan object across screen based on view frustum height
    const fovRad = THREE.MathUtils.degToRad(PARAMS.fov);
    const visibleH = 2.0 * Math.max(PARAMS.camDistance, 1.0) * Math.tan(fovRad * 0.5);
    const scaleFactor = visibleH / Math.max(window.innerHeight, 1);
    PARAMS.panX += dx * scaleFactor;
    PARAMS.panY -= dy * scaleFactor;
    uniforms.uPan.value.set(PARAMS.panX, PARAMS.panY);
    if (ctrlPanX) ctrlPanX.updateDisplay();
    if (ctrlPanY) ctrlPanY.updateDisplay();
  } else if (pointer.dragging) {
    pointer.accX += dx;
    pointer.accY += dy;
  }
});

function endPointer(e) {
  if (e.pointerId !== pointer.id) return;
  const upX = e.clientX;
  const upY = e.clientY;
  const elapsed = performance.now() - pointer.startTime;
  const dist = Math.hypot(upX - pointer.startX, upY - pointer.startY);

  const wasDragging = pointer.dragging;
  pointer.dragging = false;
  pointer.panning = false;
  pointer.id = -1;
  canvas.classList.remove('dragging');

  // Click on scene detection: short duration and negligible movement
  if (wasDragging && dist < 5.0 && elapsed < 350 && e.button === 0 && !e.shiftKey) {
    if (PARAMS.clickRandomize) {
      randomizeScene();
    }
  }
}

canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('lostpointercapture', endPointer);
canvas.addEventListener('contextmenu', (e) => e.preventDefault());

// Mouse wheel zoom: modifies camDistance directly so animations don't reset it
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const zoomFactor = Math.exp(e.deltaY * 0.001);
  PARAMS.camDistance = THREE.MathUtils.clamp(PARAMS.camDistance * zoomFactor, 1.2, 22.0);
  updateCamera();
  if (ctrlDist) ctrlDist.updateDisplay();
}, { passive: false });

function updateUserRotation(dt) {
  if (pointer.dragging) {
    const sens = PARAMS.dragSensitivity * 3.0 / Math.max(window.innerHeight, 1);
    const targetX = (pointer.accX * sens) / dt;
    const targetY = (pointer.accY * sens) / dt;
    pointer.accX = 0;
    pointer.accY = 0;
    const k = 1.0 - Math.exp(-DRAG_RESPONSE * dt);
    spin.velX += (targetX - spin.velX) * k;
    spin.velY += (targetY - spin.velY) * k;
  } else {
    const decay = Math.exp(-PARAMS.inertiaDamping * dt);
    spin.velX *= decay;
    spin.velY *= decay;
  }

  const angX = -spin.velX * dt;
  const angY = -spin.velY * dt;
  if (Math.abs(angX) + Math.abs(angY) < 1e-7) return;

  tmpQuat.setFromAxisAngle(camUp, angX);
  userQuat.premultiply(tmpQuat);
  tmpQuat.setFromAxisAngle(camRight, angY);
  userQuat.premultiply(tmpQuat);
  userQuat.normalize();
}

//  Procedural Variation & Color Scheme Application

function applyColorScheme(name) {
  const scheme = COLOR_SCHEMES[name];
  if (!scheme) return;
  PARAMS.colorScheme = name;
  if (!PARAMS.greenScreen) {
    PARAMS.backgroundColor = scheme.backgroundColor;
    savedBgColor = scheme.backgroundColor;
  }
  PARAMS.absorbR = scheme.absorbR;
  PARAMS.absorbG = scheme.absorbG;
  PARAMS.absorbB = scheme.absorbB;
  PARAMS.glowColor = scheme.glowColor;
  PARAMS.filmTint = scheme.filmTint;
  PARAMS.light1Color = scheme.light1Color;
  PARAMS.light1Intensity = scheme.light1Intensity;
  PARAMS.light2Color = scheme.light2Color;
  PARAMS.light2Intensity = scheme.light2Intensity;
  PARAMS.light3Color = scheme.light3Color;
  PARAMS.light3Intensity = scheme.light3Intensity;
  PARAMS.ambientColor = scheme.ambientColor;
  PARAMS.ambientIntensity = scheme.ambientIntensity;

  updateBackgroundColor();
  syncUniforms();
  updateAllGUI();
}

function randomizeScene() {
  // 1. Pick a random color scheme from the 19 schemes
  const schemeKeys = Object.keys(COLOR_SCHEMES);
  const randomKey = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
  applyColorScheme(randomKey);

  // 2. Re-roll geometric parameters
  PARAMS.fractalScale = +(0.72 + Math.random() * 0.22).toFixed(3);
  PARAMS.boundRadius = +(1.15 + Math.random() * 0.35).toFixed(2);
  PARAMS.morphAmount = +(0.08 + Math.random() * 0.25).toFixed(3);
  PARAMS.glassIor = +(1.45 + Math.random() * 0.55).toFixed(2);
  PARAMS.dispersion = +(0.006 + Math.random() * 0.024).toFixed(3);
  PARAMS.holoFreq = +(0.8 + Math.random() * 2.8).toFixed(2);
  PARAMS.holoAmount = +(0.15 + Math.random() * 0.35).toFixed(2);
  PARAMS.glowStrength = +(0.4 + Math.random() * 0.8).toFixed(2);

  // 3. Re-roll motion parameters
  const animKeys = ANIMATION_MODES;
  PARAMS.animationMode = animKeys[Math.floor(Math.random() * animKeys.length)];
  const rotDir = Math.random() > 0.5 ? 1 : -1;
  PARAMS.rotSpeed = +(rotDir * (0.12 + Math.random() * 0.22)).toFixed(2);
  PARAMS.twistSpeed = +(0.2 + Math.random() * 0.4).toFixed(2);
  PARAMS.morphSpeed = +(0.15 + Math.random() * 0.3).toFixed(2);
  PARAMS.sweepSpeed = +(0.3 + Math.random() * 0.4).toFixed(2);
  PARAMS.holoSpeed = +(0.04 + Math.random() * 0.12).toFixed(3);

  syncUniforms();
  updateCamera();
  updateAllGUI();
}

function updateAllGUI() {
  gui.controllersRecursive().forEach((c) => c.updateDisplay());
}

fLight1.addColor(PARAMS, 'light1Color').name('Color').onChange(syncUniforms);
fLight1.add(PARAMS, 'light1Intensity', 0.0, 3.0, 0.01).name('Intensity').onChange(syncUniforms);

const fLight2 = fLight.addFolder('Fill Light (Light 2)');
fLight2.addColor(PARAMS, 'light2Color').name('Color').onChange(syncUniforms);
fLight2.add(PARAMS, 'light2Intensity', 0.0, 3.0, 0.01).name('Intensity').onChange(syncUniforms);

const fLight3 = fLight.addFolder('Rim Light (Light 3)');
fLight3.addColor(PARAMS, 'light3Color').name('Color').onChange(syncUniforms);
fLight3.add(PARAMS, 'light3Intensity', 0.0, 3.0, 0.01).name('Intensity').onChange(syncUniforms);

const fAmbient = fLight.addFolder('Ambient Environment');
fAmbient.addColor(PARAMS, 'ambientColor').name('Color').onChange(syncUniforms);
fAmbient.add(PARAMS, 'ambientIntensity', 0.0, 3.0, 0.01).name('Intensity').onChange(syncUniforms);

// Geometry
const fGeom = gui.addFolder('Geometry');
fGeom.add(PARAMS, 'fractalScale', 0.6, 1.2, 0.005).name('Fractal Scale').onChange(syncUniforms);
fGeom.add(PARAMS, 'fractalIters', 1, 10, 1).name('Fractal Iterations')
  .onFinishChange((v) => setDefine('FRACTAL_ITERS', v));
fGeom.add(PARAMS, 'boundRadius', 0.5, 3, 0.01).name('Bound Radius').onChange(syncUniforms);

// Material
const fMat = gui.addFolder('Material');
fMat.add(PARAMS, 'glassIor', 1.0, 2.5, 0.01).name('Glass IOR').onChange(syncUniforms);
fMat.add(PARAMS, 'dispersion', 0, 0.1, 0.001).name('Dispersion').onChange(syncUniforms);
fMat.add(PARAMS, 'holoFreq', 0.1, 6, 0.01).name('Holo Band Density').onChange(syncUniforms);
fMat.add(PARAMS, 'holoAmount', 0, 1, 0.01).name('Holo Amount').onChange(syncUniforms);
const fAbsorb = fMat.addFolder('Glass Absorption');
fAbsorb.add(PARAMS, 'absorbR', 0, 3, 0.01).name('Red').onChange(syncUniforms);
fAbsorb.add(PARAMS, 'absorbG', 0, 3, 0.01).name('Green').onChange(syncUniforms);
fAbsorb.add(PARAMS, 'absorbB', 0, 3, 0.01).name('Blue').onChange(syncUniforms);

// Post Processing & Antialiasing
const fPost = gui.addFolder('Post Processing');
fPost.add(PARAMS, 'scanlines', 0, 0.5, 0.005).name('Scanlines').onChange(syncUniforms);
fPost.add(PARAMS, 'antialias').name('Antialiasing (SMAA)').onChange((v) => { smaaPass.enabled = v; });
fPost.add(PARAMS, 'supersampling', { 'Off (1x)': 1, '2x2 (heavy)': 2, '3x3 (very heavy)': 3 })
  .name('Supersampling')
  .onChange((v) => setDefine('AA', Number(v)));

// Performance & DPR
const fPerf = gui.addFolder('Performance');
fPerf.add(PARAMS, 'dpr', 0.5, MAX_DPR, 0.25).name('Pixel Ratio (DPR)').onChange(setDPR);
fPerf.add(PARAMS, 'maxSteps', 32, 300, 1).name('Max Steps')
  .onFinishChange((v) => setDefine('MAX_STEPS', v));
fPerf.add(PARAMS, 'interiorSteps', 8, 120, 1).name('Interior Steps')
  .onFinishChange((v) => setDefine('INTERIOR_STEPS', v));
fPerf.add(PARAMS, 'aoSamples', 1, 10, 1).name('AO Samples')
  .onFinishChange((v) => setDefine('AO_SAMPLES', v));
fPerf.add(PARAMS, 'maxDist', 1, 20, 0.1).name('Max Distance').onChange(syncUniforms);
fPerf.add(PARAMS, 'surfEps', 0.0002, 0.01, 0.0001).name('Surface Epsilon').onChange(syncUniforms);
fPerf.add(PARAMS, 'stepFactor', 0.5, 2.0, 0.01).name('Step Factor').onChange(syncUniforms);

gui.close();

// ============================================================
//  Toggle GUI with "H" key
// ============================================================
let isGuiVisible = true;
window.addEventListener('keydown', (e) => {
  if (e.code === 'KeyH' || e.key === 'h' || e.key === 'H') {
    isGuiVisible = !isGuiVisible;
    gui.show(isGuiVisible);
  }
});

// ============================================================
//  Render Loop
// ============================================================
let lastTime = performance.now();

document.addEventListener('visibilitychange', () => {
  lastTime = performance.now();
});

function frame() {
  const now = performance.now();
  const dt = Math.min(Math.max((now - lastTime) / 1000, 1e-4), MAX_DELTA);
  lastTime = now;

  updateUserRotation(dt);
  updateAnimation(dt);
  syncUniforms();

  composer.render();
}

renderer.setAnimationLoop(frame);
</script>
</body>
</html>
