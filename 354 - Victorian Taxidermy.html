import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import GUI from 'lil-gui';

// =========================================================================================
// POST PROCESSOR SUITE (Inlined from postprocessing/PostProcessor.js for standalone usage)
// =========================================================================================
const orthoVertexShader = `
precision highp float;
in vec3 position;
out vec2 vUv;
void main() {
  vUv = position.xy * 0.5 + 0.5;
  gl_Position = vec4(position, 1.0);
}
`;

const brightFragmentShader = `
precision highp float;
uniform sampler2D inputTexture;
uniform float bloomThreshold;
in vec2 vUv;
out vec4 fragColor;

void main() {
  vec4 color = texture(inputTexture, vUv);
  float luminance = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
  float knee = 0.1;
  float soft = luminance - bloomThreshold + knee;
  soft = clamp(soft, 0.0, 2.0 * knee);
  soft = (soft * soft) / (4.0 * knee + 0.00001);
  float contribution = max(soft, luminance - bloomThreshold);
  contribution /= max(luminance, 0.00001);
  fragColor = vec4(color.rgb * contribution, color.a);
}
`;

const blur13ShaderChunk = `
vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
  vec2 resolution = vec2(textureSize(image, 0));
  vec4 color = vec4(0.0);
  vec2 off1 = vec2(1.411764705882353) * direction;
  vec2 off2 = vec2(3.2941176470588234) * direction;
  vec2 off3 = vec2(5.176470588235294) * direction;
  color += texture(image, uv) * 0.1964825501511404;
  color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
  color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
  color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
  color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
  color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
  color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
  return color;
}
`;

const blurFragmentShader = `
precision highp float;
uniform sampler2D inputTexture;
uniform vec2 direction;
in vec2 vUv;
out vec4 color;
${blur13ShaderChunk}
void main() {
  color = blur13(inputTexture, vUv, direction);
}
`;

const godRaysDepthMaskShader = `
precision highp float;
uniform sampler2D inputTexture;
uniform float threshold;
in vec2 vUv;
out vec4 fragColor;

void main() {
  vec4 color = texture(inputTexture, vUv);
  float lum = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
  float factor = smoothstep(threshold, threshold + 0.15, lum);
  fragColor = vec4(vec3(factor), 1.0);
}
`;

const godRaysGenerateShader = `
precision highp float;
#define TAPS_PER_PASS 6.0

uniform sampler2D inputTexture;
uniform vec3 vSunPositionScreenSpace;
uniform float fStepSize;
uniform float distanceAttenuation;
uniform float maxDensity;
in vec2 vUv;
out vec4 fragColor;

void main() {
  vec2 delta = vSunPositionScreenSpace.xy - vUv;
  float dist = length(delta);
  vec2 stepv = fStepSize * delta / max(dist, 0.0001);
  float iters = dist / max(fStepSize, 0.00001);

  vec2 uv = vUv;
  float col = 0.0;
  float f = min(1.0, max(vSunPositionScreenSpace.z, 0.0));
  float atten = 1.0 / (1.0 + pow(dist, distanceAttenuation));

  if (0.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
  uv += stepv;
  if (1.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
  uv += stepv;
  if (2.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
  uv += stepv;
  if (3.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
  uv += stepv;
  if (4.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
  uv += stepv;
  if (5.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;

  float finalVal = min(col / TAPS_PER_PASS * atten, maxDensity);
  fragColor = vec4(vec3(finalVal), 1.0);
}
`;

const anamorphicBrightShader = `
precision highp float;
uniform sampler2D inputTexture;
uniform float threshold;
uniform float smoothWidth;
in vec2 vUv;
out vec4 fragColor;

void main() {
  vec4 color = texture(inputTexture, vUv);
  float v = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
  float alpha = smoothstep(threshold, threshold + smoothWidth, v);
  fragColor = mix(vec4(0.0), color, alpha);
}
`;

const anamorphicBlurShader = `
precision highp float;
uniform sampler2D inputTexture;
uniform vec2 resolution;
uniform float samples;
uniform float intensity;
uniform vec3 tintColor;
uniform float bloomRadius;
in vec2 vUv;
out vec4 fragColor;

void main() {
  int halfSamples = max(1, int(samples) / 2);
  float fHalfSamples = float(halfSamples);
  vec2 invSize = 1.0 / resolution;
  vec4 total = vec4(0.0);

  for (int i = -64; i <= 64; i++) {
    if (i < -halfSamples || i > halfSamples) continue;
    float softness = 1.0 - abs(float(i)) / fHalfSamples;
    softness = pow(softness, 2.0);
    vec2 shiftedUV = vec2(vUv.x + invSize.x * float(i) * (4.0 + bloomRadius * 8.0), vUv.y);
    shiftedUV = clamp(shiftedUV, 0.001, 0.999);
    total += texture(inputTexture, shiftedUV) * softness;
  }

  fragColor = (total / (samples / 3.0)) * vec4(tintColor, 1.0) * intensity;
}
`;

const finalFragmentShader = `
precision highp float;
uniform vec2 resolution;
uniform sampler2D inputTexture;
uniform sampler2D blur0Texture;
uniform sampler2D blur1Texture;
uniform sampler2D blur2Texture;
uniform sampler2D blur3Texture;
uniform sampler2D blur4Texture;
uniform sampler2D raysTexture;
uniform sampler2D anamorphicTexture;
uniform bool bloomEnabled;
uniform float bloomStrength;
uniform bool raysEnabled;
uniform float raysStrength;
uniform vec3 raysColor;
uniform bool anamorphicEnabled;
uniform float vignetteBoost;
uniform float vignetteReduction;
uniform float noiseIntensity;
uniform float time;
in vec2 vUv;
out vec4 fragColor;

float vignette(vec2 uv, float boost, float reduction) {
  vec2 position = vUv - 0.5;
  return boost - length(position) * reduction;
}

float hash1(uint n) {
  n = (n << 13U) ^ n;
  n = n * (n * n * 15731U + 789221U) + 1376312589U;
  return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
}

float noise(in vec2 uv, in float timeVal) {
  uvec2 p = uvec2(uv);
  return hash1(p.x + 1920U * p.y + (1920U * 1080U) * uint(timeVal));
}

void main() {
  vec4 color = texture(inputTexture, vUv);

  if (bloomEnabled && bloomStrength > 0.001) {
    vec4 b0 = texture(blur0Texture, vUv);
    vec4 b1 = texture(blur1Texture, vUv);
    vec4 b2 = texture(blur2Texture, vUv);
    vec4 b3 = texture(blur3Texture, vUv);
    vec4 b4 = texture(blur4Texture, vUv);

    vec4 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
    color += bloomSum * bloomStrength;
  }

  if (raysEnabled && raysStrength > 0.001) {
    vec4 r = texture(raysTexture, vUv);
    color.rgb += r.rgb * raysColor * raysStrength;
  }

  if (anamorphicEnabled) {
    vec4 a = texture(anamorphicTexture, vUv);
    color.rgb += a.rgb;
  }

  color.rgb *= vignette(vUv, vignetteBoost, vignetteReduction);
  color.rgb += noiseIntensity * noise(gl_FragCoord.xy, time);
  fragColor = vec4(color.rgb, 1.0);
}
`;

const chromaticAberrationShaderChunk = `
vec2 barrelDistortion(vec2 coord, float amt) {
  vec2 cc = coord - 0.5;
  float dist = dot(cc, cc);
  return coord + cc * dist * amt;
}
float sat(float t) { return clamp(t, 0.0, 1.0); }
float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
vec4 spectrum_offset(float t) {
  float lo = step(t, 0.5);
  float hi = 1.0 - lo;
  float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
  vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
  return pow(ret, vec4(1.0 / 2.2));
}
const float max_distort = 2.2;
const int num_iter = 8;
const float reci_num_iter_f = 1.0 / float(num_iter);
vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
  vec4 sumcol = vec4(0.0);
  vec4 sumw = vec4(0.0);
  for (int i = 0; i < num_iter; ++i) {
    float t = float(i) * reci_num_iter_f;
    vec4 w = spectrum_offset(t);
    sumw += w;
    sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
  }
  return sumcol / sumw;
}
`;

const colorFragmentShader = `
precision highp float;
uniform sampler2D inputTexture;
uniform float chromaticAberrationAmount;
uniform float minInputLevel;
uniform float maxInputLevel;
uniform float gammaLevel;
uniform float exposure;
uniform float fisheyeStrength;
uniform float fisheyeRadius;
uniform float time;
uniform int visionMode;
uniform float thermalSensitivity;
uniform float nightVisionNoise;
uniform float nightVisionGain;
uniform float crtIntensity;
in vec2 vUv;
out vec4 fragColor;

${chromaticAberrationShaderChunk}

vec2 applyFisheye(vec2 uv, float strength, float radius) {
  if (abs(strength) < 0.0001) return uv;
  vec2 p = uv - 0.5;
  float d = length(p);
  if (d > radius * 1.5) return uv;
  float r = d / max(radius, 0.001);
  float theta = atan(p.y, p.x);
  float rDist = r + strength * (r * r * r);
  return 0.5 + vec2(cos(theta), sin(theta)) * (rDist * radius);
}

vec3 ACESFilmicToneMapping(vec3 color) {
  float a = 2.51;
  float b = 0.03;
  float c = 2.43;
  float d = 0.59;
  float e = 0.14;
  return clamp((color * (a * color + b)) / (color * (c * color + d) + e), 0.0, 1.0);
}

vec3 gammaCorrect(vec3 color, vec3 gamma) {
  return pow(max(color, vec3(0.0)), 1.0 / gamma);
}
vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
  return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
}
vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
  return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
}

vec3 applyNightVision(vec3 color, vec2 uv, float timeVal, float noiseAmt, float gain, float crt) {
  float lum = dot(color, vec3(0.299, 0.587, 0.114));
  float amplified = pow(lum * gain, 0.72);
  vec3 phosphorColor = mix(vec3(0.02, 0.12, 0.03), vec3(0.18, 1.0, 0.32), clamp(amplified, 0.0, 1.0));
  phosphorColor += vec3(0.7, 1.0, 0.8) * max(0.0, amplified - 0.75) * 1.8;
  vec2 p = uv - 0.5;
  float tubeDist = length(p);
  float tubeMask = smoothstep(0.72, 0.44, tubeDist);
  float n = fract(sin(dot(uv * 280.0 + timeVal * 0.05, vec2(12.9898, 78.233))) * 43758.5453);
  float scanline = sin(uv.y * 650.0) * crt;
  phosphorColor += (n - 0.5) * noiseAmt * 2.0 + scanline;
  return clamp(phosphorColor * tubeMask, 0.0, 1.0);
}

vec3 ironbow(float t) {
  t = clamp(t, 0.0, 1.0);
  vec3 c0 = vec3(0.02, 0.01, 0.18);
  vec3 c1 = vec3(0.22, 0.02, 0.48);
  vec3 c2 = vec3(0.82, 0.05, 0.25);
  vec3 c3 = vec3(1.0, 0.62, 0.02);
  vec3 c4 = vec3(1.0, 1.0, 0.92);
  if (t < 0.25) return mix(c0, c1, t * 4.0);
  if (t < 0.50) return mix(c1, c2, (t - 0.25) * 4.0);
  if (t < 0.75) return mix(c2, c3, (t - 0.50) * 4.0);
  return mix(c3, c4, (t - 0.75) * 4.0);
}

vec3 applyThermal(vec3 color, vec2 uv, float sensitivity, float crt, bool whiteHot) {
  float lum = dot(color, vec3(0.299, 0.587, 0.114));
  float heat = clamp(lum * sensitivity, 0.0, 1.0);
  float sensorRaster = sin(uv.y * 900.0) * (crt * 0.3);
  heat = clamp(heat + sensorRaster, 0.0, 1.0);
  if (whiteHot) {
    float grad = pow(heat, 0.85);
    return vec3(grad);
  } else {
    return ironbow(heat);
  }
}

void main() {
  vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
  vec4 col = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
  vec3 finalCol = col.rgb;
  
  if (visionMode == 1) {
    finalCol = applyNightVision(finalCol, uv, time, nightVisionNoise, nightVisionGain, crtIntensity);
  } else if (visionMode == 2) {
    finalCol = applyThermal(finalCol, uv, thermalSensitivity, crtIntensity, false);
  } else if (visionMode == 3) {
    finalCol = applyThermal(finalCol, uv, thermalSensitivity, crtIntensity, true);
  } else {
    vec3 exposedColor = finalCol * exposure;
    vec3 toneMappedColor = ACESFilmicToneMapping(exposedColor);
    finalCol = finalLevels(toneMappedColor, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
  }

  fragColor = vec4(finalCol, 1.0);
}
`;

const copyFragmentShader = `
precision highp float;
uniform sampler2D inputTexture;
in vec2 vUv;
out vec4 fragColor;
void main() {
  fragColor = texture(inputTexture, vUv);
}
`;

function createFBO(w, h, options = {}) {
  return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
    wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
    wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
    minFilter: options.minFilter || THREE.LinearFilter,
    magFilter: options.magFilter || THREE.LinearFilter,
    format: options.format || THREE.RGBAFormat,
    type: options.type || THREE.HalfFloatType,
    stencilBuffer: options.stencilBuffer || false,
    depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : true,
    samples: options.samples || 0,
  });
}

class ShaderPass {
  constructor(shader, options = {}) {
    this.shader = shader;
    this.orthoScene = new THREE.Scene();
    this.fbo = createFBO(1, 1, options);
    this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
    this.orthoScene.add(this.orthoQuad);
    this.texture = this.fbo.texture;
  }
  render(renderer, toScreen = false) {
    if (!toScreen) {
      renderer.setRenderTarget(this.fbo);
    }
    renderer.render(this.orthoScene, this.orthoCamera);
    if (!toScreen) {
      renderer.setRenderTarget(null);
    }
  }
  setSize(width, height) {
    this.fbo.setSize(Math.max(1, width), Math.max(1, height));
    this.orthoQuad.scale.set(width, height, 1);
  }
}

class ShaderPingPongPass {
  constructor(shader, options = {}) {
    this.shader = shader;
    this.orthoScene = new THREE.Scene();
    this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
    this.currentFBO = 0;
    this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
    this.orthoScene.add(this.orthoQuad);
  }
  render(renderer) {
    renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
    renderer.render(this.orthoScene, this.orthoCamera);
    renderer.setRenderTarget(null);
    this.currentFBO = 1 - this.currentFBO;
  }
  get current() { return this.fbos[this.currentFBO]; }
  get texture() { return this.current.texture; }
  setSize(width, height) {
    const w = Math.max(1, width);
    const h = Math.max(1, height);
    this.orthoQuad.scale.set(w, h, 1);
    this.fbos[0].setSize(w, h);
    this.fbos[1].setSize(w, h);
  }
}

class BloomPass {
  constructor(strength = 0.8, radius = 0.5, threshold = 0.2, levels = 5) {
    this.strength = strength;
    this.radius = radius;
    this.threshold = threshold;
    this.enabled = true;
    this.levels = levels;

    this.brightShader = new THREE.RawShaderMaterial({
      uniforms: {
        inputTexture: { value: null },
        bloomThreshold: { value: this.threshold },
      },
      vertexShader: orthoVertexShader,
      fragmentShader: brightFragmentShader,
      glslVersion: THREE.GLSL3,
    });
    this.brightPass = new ShaderPass(this.brightShader, {
      format: THREE.RGBAFormat,
      type: THREE.HalfFloatType,
    });

    this.blurShader = new THREE.RawShaderMaterial({
      uniforms: {
        inputTexture: { value: null },
        direction: { value: new THREE.Vector2(0, 1) },
      },
      vertexShader: orthoVertexShader,
      fragmentShader: blurFragmentShader,
      glslVersion: THREE.GLSL3,
    });

    this.blurPasses = [];
    for (let i = 0; i < this.levels; i++) {
      this.blurPasses.push(new ShaderPingPongPass(this.blurShader, {
        format: THREE.RGBAFormat,
        type: THREE.HalfFloatType,
      }));
    }
  }

  setSize(w, h) {
    let tw = Math.max(1, w);
    let th = Math.max(1, h);
    this.brightPass.setSize(tw, th);
    for (let i = 0; i < this.levels; i++) {
      tw = Math.max(1, Math.round(tw / 2));
      th = Math.max(1, Math.round(th / 2));
      this.blurPasses[i].setSize(tw, th);
    }
  }

  set source(texture) {
    this.brightShader.uniforms.inputTexture.value = texture;
  }

  render(renderer) {
    if (!this.enabled || this.strength <= 0.001) return;

    this.brightShader.uniforms.bloomThreshold.value = this.threshold;
    this.brightPass.render(renderer);

    const baseOffset = Math.max(0.1, this.radius * 2.0);
    const u = this.blurShader.uniforms;

    for (let j = 0; j < this.levels; j++) {
      const blurPass = this.blurPasses[j];
      const stepOffset = baseOffset * (1.0 + j * 0.5);

      u.direction.value.set(stepOffset, 0);
      u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
      blurPass.render(renderer);

      u.direction.value.set(0, stepOffset * 0.5);
      u.inputTexture.value = blurPass.current.texture;
      blurPass.render(renderer);
    }
  }
}

const VISION_MODE_MAP = {
  'Normal (Cinematic)': 0,
  'Night Vision (Phosphor)': 1,
  'Thermal (Ironbow)': 2,
  'Thermal (White-Hot)': 3,
};

class PostProcessor {
  constructor(renderer, params = {}) {
    this.renderer = renderer;

    this.settings = {
      enabled: params.enabled !== undefined ? params.enabled : true,
      bloomEnabled: params.bloomEnabled !== undefined ? params.bloomEnabled : true,
      bloomStrength: params.bloomStrength !== undefined ? params.bloomStrength : 1.15,
      bloomRadius: params.bloomRadius !== undefined ? params.bloomRadius : 0.55,
      bloomThreshold: params.bloomThreshold !== undefined ? params.bloomThreshold : 0.15,

      raysEnabled: params.raysEnabled !== undefined ? params.raysEnabled : true,
      raysStrength: params.raysStrength !== undefined ? params.raysStrength : 0.55,
      raysDensity: params.raysDensity !== undefined ? params.raysDensity : 1.0,
      raysMaxDensity: params.raysMaxDensity !== undefined ? params.raysMaxDensity : 0.45,
      raysDistanceAttenuation: params.raysDistanceAttenuation !== undefined ? params.raysDistanceAttenuation : 2.2,
      raysThreshold: params.raysThreshold !== undefined ? params.raysThreshold : 0.15,
      raysColor: params.raysColor ? (params.raysColor.isColor ? params.raysColor.clone() : new THREE.Color(params.raysColor)) : new THREE.Color(0x00ff88),
      raysColorHex: params.raysColorHex || '#00ff88',

      anamorphicEnabled: params.anamorphicEnabled !== undefined ? params.anamorphicEnabled : false,
      anamorphicIntensity: params.anamorphicIntensity !== undefined ? params.anamorphicIntensity : 3.0,
      anamorphicThreshold: params.anamorphicThreshold !== undefined ? params.anamorphicThreshold : 0.3,
      anamorphicSamples: params.anamorphicSamples !== undefined ? params.anamorphicSamples : 64,
      anamorphicRadius: params.anamorphicRadius !== undefined ? params.anamorphicRadius : 0.0,
      anamorphicSmoothWidth: params.anamorphicSmoothWidth !== undefined ? params.anamorphicSmoothWidth : 0.05,
      anamorphicColor: params.anamorphicColor ? (params.anamorphicColor.isColor ? params.anamorphicColor.clone() : new THREE.Color(params.anamorphicColor)) : new THREE.Color(0x7a8aff),
      anamorphicColorHex: params.anamorphicColorHex || '#7a8aff',

      visionMode: params.visionMode !== undefined ? params.visionMode : 'Normal (Cinematic)',
      thermalSensitivity: params.thermalSensitivity !== undefined ? params.thermalSensitivity : 1.4,
      nightVisionGain: params.nightVisionGain !== undefined ? params.nightVisionGain : 2.1,
      nightVisionNoise: params.nightVisionNoise !== undefined ? params.nightVisionNoise : 0.05,
      crtIntensity: params.crtIntensity !== undefined ? params.crtIntensity : 0.0,

      fisheyeStrength: params.fisheyeStrength !== undefined ? params.fisheyeStrength : 0.0,
      fisheyeRadius: params.fisheyeRadius !== undefined ? params.fisheyeRadius : 1.0,
      chromaticAberration: params.chromaticAberration !== undefined ? params.chromaticAberration : 0.012,
      vignetteBoost: params.vignetteBoost !== undefined ? params.vignetteBoost : 1.15,
      vignetteReduction: params.vignetteReduction !== undefined ? params.vignetteReduction : 0.85,
      noiseIntensity: params.noiseIntensity !== undefined ? params.noiseIntensity : 0.018,

      gamma: params.gamma !== undefined ? params.gamma : 1.02,
      minInputLevel: params.minInputLevel !== undefined ? params.minInputLevel : 0.0,
      maxInputLevel: params.maxInputLevel !== undefined ? params.maxInputLevel : 1.0,
      exposure: params.exposure !== undefined ? params.exposure : 1.0,
    };

    this.sceneTarget = createFBO(1, 1, { type: THREE.HalfFloatType });

    this.bloomPass = new BloomPass(
      this.settings.bloomStrength,
      this.settings.bloomRadius,
      this.settings.bloomThreshold,
      5
    );

    this.moonScreenPos = new THREE.Vector3(0.5, 0.7, 1.0);
    this.moonInFront = true;

    this.godRaysMaskShader = new THREE.RawShaderMaterial({
      uniforms: {
        inputTexture: { value: null },
        threshold: { value: this.settings.raysThreshold },
      },
      vertexShader: orthoVertexShader,
      fragmentShader: godRaysDepthMaskShader,
      glslVersion: THREE.GLSL3,
    });
    this.godRaysMaskPass = new ShaderPass(this.godRaysMaskShader, {
      format: THREE.RGBAFormat,
      type: THREE.HalfFloatType,
    });

    this.godRaysGenShader = new THREE.RawShaderMaterial({
      uniforms: {
        inputTexture: { value: null },
        vSunPositionScreenSpace: { value: this.moonScreenPos },
        fStepSize: { value: 1.0 },
        distanceAttenuation: { value: this.settings.raysDistanceAttenuation },
        maxDensity: { value: this.settings.raysMaxDensity },
      },
      vertexShader: orthoVertexShader,
      fragmentShader: godRaysGenerateShader,
      glslVersion: THREE.GLSL3,
    });
    this.godRaysPingPong = new ShaderPingPongPass(this.godRaysGenShader, {
      format: THREE.RGBAFormat,
      type: THREE.HalfFloatType,
    });

    this.anamorphicBrightShader = new THREE.RawShaderMaterial({
      uniforms: {
        inputTexture: { value: null },
        threshold: { value: this.settings.anamorphicThreshold },
        smoothWidth: { value: this.settings.anamorphicSmoothWidth },
      },
      vertexShader: orthoVertexShader,
      fragmentShader: anamorphicBrightShader,
      glslVersion: THREE.GLSL3,
    });
    this.anamorphicBrightPass = new ShaderPass(this.anamorphicBrightShader, {
      format: THREE.RGBAFormat,
      type: THREE.HalfFloatType,
    });

    this.anamorphicBlurShader = new THREE.RawShaderMaterial({
      uniforms: {
        inputTexture: { value: null },
        resolution: { value: new THREE.Vector2(1, 1) },
        samples: { value: this.settings.anamorphicSamples },
        intensity: { value: this.settings.anamorphicIntensity },
        tintColor: { value: this.settings.anamorphicColor },
        bloomRadius: { value: this.settings.anamorphicRadius },
      },
      vertexShader: orthoVertexShader,
      fragmentShader: anamorphicBlurShader,
      glslVersion: THREE.GLSL3,
    });
    this.anamorphicBlurPass = new ShaderPass(this.anamorphicBlurShader, {
      format: THREE.RGBAFormat,
      type: THREE.HalfFloatType,
    });

    this.finalShader = new THREE.RawShaderMaterial({
      uniforms: {
        resolution: { value: new THREE.Vector2(1, 1) },
        bloomEnabled: { value: this.settings.bloomEnabled },
        bloomStrength: { value: this.settings.bloomStrength },
        raysEnabled: { value: this.settings.raysEnabled },
        raysStrength: { value: this.settings.raysStrength },
        raysColor: { value: this.settings.raysColor },
        anamorphicEnabled: { value: this.settings.anamorphicEnabled },
        vignetteBoost: { value: this.settings.vignetteBoost },
        vignetteReduction: { value: this.settings.vignetteReduction },
        noiseIntensity: { value: this.settings.noiseIntensity },
        inputTexture: { value: null },
        blur0Texture: { value: null },
        blur1Texture: { value: null },
        blur2Texture: { value: null },
        blur3Texture: { value: null },
        blur4Texture: { value: null },
        raysTexture: { value: null },
        anamorphicTexture: { value: null },
        time: { value: 0 },
      },
      vertexShader: orthoVertexShader,
      fragmentShader: finalFragmentShader,
      glslVersion: THREE.GLSL3,
    });
    this.finalPass = new ShaderPass(this.finalShader);

    this.rgbShader = new THREE.RawShaderMaterial({
      uniforms: {
        inputTexture: { value: this.finalPass.texture },
        fisheyeStrength: { value: this.settings.fisheyeStrength },
        fisheyeRadius: { value: this.settings.fisheyeRadius },
        chromaticAberrationAmount: { value: this.settings.chromaticAberration },
        minInputLevel: { value: this.settings.minInputLevel },
        maxInputLevel: { value: this.settings.maxInputLevel },
        gammaLevel: { value: this.settings.gamma },
        exposure: { value: this.settings.exposure },
        visionMode: { value: VISION_MODE_MAP[this.settings.visionMode] ?? 0 },
        thermalSensitivity: { value: this.settings.thermalSensitivity },
        nightVisionGain: { value: this.settings.nightVisionGain },
        nightVisionNoise: { value: this.settings.nightVisionNoise },
        crtIntensity: { value: this.settings.crtIntensity },
        time: { value: 0 },
      },
      vertexShader: orthoVertexShader,
      fragmentShader: colorFragmentShader,
      glslVersion: THREE.GLSL3,
    });
    this.rgbPass = new ShaderPass(this.rgbShader);

    this.copyShader = new THREE.RawShaderMaterial({
      uniforms: {
        inputTexture: { value: null },
      },
      vertexShader: orthoVertexShader,
      fragmentShader: copyFragmentShader,
      glslVersion: THREE.GLSL3,
    });
    this.copyPass = new ShaderPass(this.copyShader);
  }

  updateSettings() {
    this.bloomPass.enabled = this.settings.bloomEnabled;
    this.bloomPass.strength = this.settings.bloomStrength;
    this.bloomPass.radius = this.settings.bloomRadius;
    this.bloomPass.threshold = this.settings.bloomThreshold;

    this.godRaysMaskShader.uniforms.threshold.value = this.settings.raysThreshold;
    this.godRaysGenShader.uniforms.distanceAttenuation.value = this.settings.raysDistanceAttenuation;
    this.godRaysGenShader.uniforms.maxDensity.value = this.settings.raysMaxDensity;

    this.anamorphicBrightShader.uniforms.threshold.value = this.settings.anamorphicThreshold;
    this.anamorphicBrightShader.uniforms.smoothWidth.value = this.settings.anamorphicSmoothWidth;
    this.anamorphicBlurShader.uniforms.samples.value = this.settings.anamorphicSamples;
    this.anamorphicBlurShader.uniforms.intensity.value = this.settings.anamorphicIntensity;
    this.anamorphicBlurShader.uniforms.tintColor.value.copy(this.settings.anamorphicColor);
    this.anamorphicBlurShader.uniforms.bloomRadius.value = this.settings.anamorphicRadius;

    this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
    this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
    this.finalShader.uniforms.raysEnabled.value = this.settings.raysEnabled && this.moonInFront;
    this.finalShader.uniforms.raysStrength.value = this.settings.raysStrength;
    this.finalShader.uniforms.raysColor.value.copy(this.settings.raysColor);
    this.finalShader.uniforms.anamorphicEnabled.value = this.settings.anamorphicEnabled;
    this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
    this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
    this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;

    this.rgbShader.uniforms.fisheyeStrength.value = this.settings.fisheyeStrength;
    this.rgbShader.uniforms.fisheyeRadius.value = this.settings.fisheyeRadius;
    this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
    this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
    this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
    this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
    this.rgbShader.uniforms.exposure.value = this.settings.exposure;
    this.rgbShader.uniforms.visionMode.value = VISION_MODE_MAP[this.settings.visionMode] ?? 0;
    this.rgbShader.uniforms.thermalSensitivity.value = this.settings.thermalSensitivity;
    this.rgbShader.uniforms.nightVisionGain.value = this.settings.nightVisionGain;
    this.rgbShader.uniforms.nightVisionNoise.value = this.settings.nightVisionNoise;
    this.rgbShader.uniforms.crtIntensity.value = this.settings.crtIntensity;
  }

  setSize(w0, h0, dpr = 1) {
    const w = Math.max(1, Math.floor(w0 * dpr));
    const h = Math.max(1, Math.floor(h0 * dpr));
    this.sceneTarget.setSize(w, h);
    this.finalPass.setSize(w, h);
    this.finalShader.uniforms.resolution.value.set(w, h);
    this.bloomPass.setSize(w, h);

    const grW = Math.max(1, Math.round(w / 2));
    const grH = Math.max(1, Math.round(h / 2));
    this.godRaysMaskPass.setSize(grW, grH);
    this.godRaysPingPong.setSize(grW, grH);

    const anW = Math.max(1, Math.round(w / 4));
    const anH = Math.max(1, Math.round(h / 4));
    this.anamorphicBrightPass.setSize(anW, anH);
    this.anamorphicBlurPass.setSize(anW, anH);
    this.anamorphicBlurShader.uniforms.resolution.value.set(anW, anH);

    this.rgbPass.setSize(w, h);
    this.copyPass.setSize(w, h);
  }

  setMoonScreenPosition(camera, moonWorldPos) {
    if (!this._camDir) {
      this._camDir = new THREE.Vector3();
      this._toMoon = new THREE.Vector3();
      this._ndc = new THREE.Vector3();
    }
    camera.getWorldDirection(this._camDir);
    this._toMoon.copy(moonWorldPos).sub(camera.position).normalize();
    const dot = this._camDir.dot(this._toMoon);

    if (dot <= 0.02) {
      this.moonInFront = false;
      this.finalShader.uniforms.raysEnabled.value = false;
      return;
    }

    this.moonInFront = true;
    const fade = THREE.MathUtils.clamp((dot - 0.02) / 0.15, 0.0, 1.0);

    this._ndc.copy(moonWorldPos).project(camera);
    const screenX = this._ndc.x * 0.5 + 0.5;
    const screenY = this._ndc.y * 0.5 + 0.5;
    const screenZ = fade;

    this.moonScreenPos.set(screenX, screenY, screenZ);
    this.godRaysGenShader.uniforms.vSunPositionScreenSpace.value.set(screenX, screenY, screenZ);
  }

  renderScene(scene, camera) {
    if (!this.settings.enabled) {
      this.renderer.render(scene, camera);
      return;
    }
    this.renderer.setRenderTarget(this.sceneTarget);
    this.renderer.render(scene, camera);
    this.renderer.setRenderTarget(null);
    this.render(this.sceneTarget.texture);
  }

  render(sourceTexture) {
    if (!this.settings.enabled) {
      this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
      this.copyPass.render(this.renderer, true);
      return;
    }

    this.updateSettings();

    this.bloomPass.source = sourceTexture;
    this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
    this.bloomPass.render(this.renderer);

    this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
    this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
    this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
    this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
    this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

    if (this.settings.raysEnabled && this.settings.raysStrength > 0.001 && this.moonInFront) {
      this.godRaysMaskShader.uniforms.inputTexture.value = sourceTexture;
      this.godRaysMaskShader.uniforms.threshold.value = this.settings.raysThreshold;
      this.godRaysMaskPass.render(this.renderer);

      const filterLen = this.settings.raysDensity;
      const tapsPerPass = 6.0;

      this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -1.0);
      this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysMaskPass.texture;
      this.godRaysPingPong.render(this.renderer);

      this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -2.0);
      this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysPingPong.texture;
      this.godRaysPingPong.render(this.renderer);

      this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -3.0);
      this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysPingPong.texture;
      this.godRaysPingPong.render(this.renderer);

      this.finalPass.shader.uniforms.raysTexture.value = this.godRaysPingPong.texture;
      this.finalPass.shader.uniforms.raysEnabled.value = true;
    } else {
      this.finalPass.shader.uniforms.raysEnabled.value = false;
    }

    if (this.settings.anamorphicEnabled && this.settings.anamorphicIntensity > 0.001) {
      this.anamorphicBrightShader.uniforms.inputTexture.value = sourceTexture;
      this.anamorphicBrightShader.uniforms.threshold.value = this.settings.anamorphicThreshold;
      this.anamorphicBrightShader.uniforms.smoothWidth.value = this.settings.anamorphicSmoothWidth;
      this.anamorphicBrightPass.render(this.renderer);

      this.anamorphicBlurShader.uniforms.inputTexture.value = this.anamorphicBrightPass.texture;
      this.anamorphicBlurShader.uniforms.samples.value = this.settings.anamorphicSamples;
      this.anamorphicBlurShader.uniforms.intensity.value = this.settings.anamorphicIntensity;
      this.anamorphicBlurShader.uniforms.tintColor.value.copy(this.settings.anamorphicColor);
      this.anamorphicBlurShader.uniforms.bloomRadius.value = this.settings.anamorphicRadius;
      this.anamorphicBlurPass.render(this.renderer);

      this.finalPass.shader.uniforms.anamorphicTexture.value = this.anamorphicBlurPass.texture;
      this.finalPass.shader.uniforms.anamorphicEnabled.value = true;
    } else {
      this.finalPass.shader.uniforms.anamorphicEnabled.value = false;
    }

    const randomTime = Math.random() * 100000;
    this.finalPass.shader.uniforms.time.value = randomTime;
    this.rgbPass.shader.uniforms.time.value = randomTime;

    this.finalPass.render(this.renderer);
    this.rgbPass.render(this.renderer, true);
  }

  attachGUI(gui, title = "Post-Processing (PostProcessor.js)") {
    const root = gui.addFolder(title);
    root.add(this.settings, "enabled").name("Enable Post-Process");

    const bloom = root.addFolder("Atmospheric Bloom");
    bloom.add(this.settings, "bloomEnabled").name("Enable Bloom").onChange(() => this.updateSettings());
    bloom.add(this.settings, "bloomStrength", 0, 3.0, 0.05).name("Bloom Strength").onChange(() => this.updateSettings());
    bloom.add(this.settings, "bloomRadius", 0, 2.0, 0.05).name("Bloom Radius").onChange(() => this.updateSettings());
    bloom.add(this.settings, "bloomThreshold", 0, 1.0, 0.01).name("Bloom Threshold").onChange(() => this.updateSettings());

    const rays = root.addFolder("Three.js Godrays");
    rays.add(this.settings, "raysEnabled").name("Enable Godrays").onChange(() => this.updateSettings());
    rays.add(this.settings, "raysStrength", 0, 3.0, 0.05).name("Intensity").onChange(() => this.updateSettings());
    rays.add(this.settings, "raysDensity", 0.1, 2.5, 0.05).name("Density (Spread)").onChange(() => this.updateSettings());
    rays.add(this.settings, "raysMaxDensity", 0.1, 1.0, 0.05).name("Max Density").onChange(() => this.updateSettings());
    rays.add(this.settings, "raysDistanceAttenuation", 0.5, 4.0, 0.1).name("Distance Atten").onChange(() => this.updateSettings());
    rays.add(this.settings, "raysThreshold", 0.0, 0.8, 0.01).name("Light Threshold").onChange(() => this.updateSettings());
    rays.addColor(this.settings, "raysColorHex").name("Ray Tint").onChange((v) => {
      this.settings.raysColor.set(v);
      this.updateSettings();
    });

    const anamorphic = root.addFolder("Anamorphic Flare");
    anamorphic.add(this.settings, "anamorphicEnabled").name("Enable Anamorphic").onChange(() => this.updateSettings());
    anamorphic.add(this.settings, "anamorphicIntensity", 0, 10.0, 0.1).name("Intensity").onChange(() => this.updateSettings());
    anamorphic.add(this.settings, "anamorphicThreshold", 0.0, 0.9, 0.01).name("Threshold").onChange(() => this.updateSettings());
    anamorphic.add(this.settings, "anamorphicSamples", 2, 128, 1).name("Samples").onChange(() => this.updateSettings());
    anamorphic.add(this.settings, "anamorphicRadius", 0.0, 1.0, 0.01).name("Bloom Radius").onChange(() => this.updateSettings());
    anamorphic.addColor(this.settings, "anamorphicColorHex").name("Tint Color").onChange((v) => {
      this.settings.anamorphicColor.set(v);
      this.updateSettings();
    });

    const lens = root.addFolder("Lens, Optics & Film Grain");
    lens.add(this.settings, "fisheyeStrength", -1.0, 1.5, 0.01).name("Fisheye Distortion").onChange(() => this.updateSettings());
    lens.add(this.settings, "fisheyeRadius", 0.2, 2.0, 0.05).name("Fisheye Radius").onChange(() => this.updateSettings());
    lens.add(this.settings, "chromaticAberration", 0, 0.2, 0.005).name("Chromatic Aberration").onChange(() => this.updateSettings());
    lens.add(this.settings, "vignetteBoost", 0, 2.0, 0.05).name("Vignette Boost").onChange(() => this.updateSettings());
    lens.add(this.settings, "vignetteReduction", 0, 2.0, 0.05).name("Vignette Falloff").onChange(() => this.updateSettings());
    lens.add(this.settings, "noiseIntensity", 0, 0.1, 0.005).name("Film Grain").onChange(() => this.updateSettings());
    lens.add(this.settings, "gamma", 0.2, 2.0, 0.05).name("Gamma").onChange(() => this.updateSettings());
    lens.add(this.settings, "minInputLevel", 0, 0.5, 0.01).name("Black Level").onChange(() => this.updateSettings());
    lens.add(this.settings, "maxInputLevel", 0.5, 1.0, 0.01).name("White Level").onChange(() => this.updateSettings());

    const vision = root.addFolder("Thermal & Night Vision");
    vision.add(this.settings, "visionMode", Object.keys(VISION_MODE_MAP)).name("Vision Mode").onChange(() => this.updateSettings());
    vision.add(this.settings, "nightVisionGain", 0.5, 5.0, 0.1).name("NVG Amplification").onChange(() => this.updateSettings());
    vision.add(this.settings, "nightVisionNoise", 0.0, 0.3, 0.01).name("NVG Sensor Noise").onChange(() => this.updateSettings());
    vision.add(this.settings, "thermalSensitivity", 0.5, 3.5, 0.05).name("Thermal Sensitivity").onChange(() => this.updateSettings());
    vision.add(this.settings, "crtIntensity", 0.0, 0.1, 0.005).name("CRT Scanlines").onChange(() => this.updateSettings());

    return root;
  }
}

function generateCurioEnvironment() {
  const envCanvas = document.createElement('canvas');
  envCanvas.width = 1024;
  envCanvas.height = 512;
  const ctx = envCanvas.getContext('2d');

  // Dark Victorian cabinet interior with warm chandelier and window light
  const bgGrad = ctx.createLinearGradient(0, 0, 0, 512);
  bgGrad.addColorStop(0, '#120d1c');
  bgGrad.addColorStop(0.5, '#0a0610');
  bgGrad.addColorStop(1, '#050308');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, 1024, 512);

  // Soft gothic arched windows
  for (let w = 0; w < 3; w++) {
    const wx = 150 + w * 350;
    const winGrad = ctx.createRadialGradient(wx, 200, 20, wx, 200, 140);
    winGrad.addColorStop(0, 'rgba(210, 230, 255, 0.55)');
    winGrad.addColorStop(0.6, 'rgba(120, 150, 200, 0.2)');
    winGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = winGrad;
    ctx.beginPath();
    ctx.ellipse(wx, 200, 70, 150, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // Warm chandelier gaslights
  for (let c = 0; c < 4; c++) {
    const cx = 80 + c * 280;
    const flameGrad = ctx.createRadialGradient(cx, 120, 5, cx, 120, 90);
    flameGrad.addColorStop(0, 'rgba(255, 220, 150, 0.9)');
    flameGrad.addColorStop(0.4, 'rgba(255, 140, 50, 0.35)');
    flameGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = flameGrad;
    ctx.beginPath();
    ctx.arc(cx, 120, 90, 0, Math.PI * 2);
    ctx.fill();
  }

  const texture = new THREE.CanvasTexture(envCanvas);
  texture.mapping = THREE.EquirectangularReflectionMapping;
  return texture;
}

function createBarkTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 512;
  canvas.height = 512;
  const ctx = canvas.getContext('2d');
  
  // Warm dark bog-wood base
  ctx.fillStyle = '#2a1a12';
  ctx.fillRect(0, 0, 512, 512);

  // Weathered bark striations
  for (let i = 0; i < 4500; i++) {
    const x = Math.random() * 512;
    const y = Math.random() * 512;
    const l = Math.random() * 35 + 12;
    const w = Math.random() * 2.5 + 0.8;
    const shade = Math.floor(Math.random() * 60);
    ctx.fillStyle = `rgb(${35 + shade}, ${22 + shade * 0.75}, ${14 + shade * 0.5})`;
    ctx.fillRect(x, y, w, l);
  }

  // Dried sage lichen patches
  for (let k = 0; k < 25; k++) {
    const kx = Math.random() * 512;
    const ky = Math.random() * 512;
    const kr = Math.random() * 14 + 5;
    ctx.fillStyle = 'rgba(75, 95, 60, 0.35)';
    ctx.beginPath();
    ctx.arc(kx, ky, kr, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(140, 160, 120, 0.25)';
    ctx.beginPath();
    ctx.arc(kx + 1, ky - 1, kr * 0.6, 0, Math.PI * 2);
    ctx.fill();
  }

  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(2, 6);
  return texture;
}

function createGothicWingTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 512;
  canvas.height = 512;
  const ctx = canvas.getContext('2d');

  ctx.clearRect(0, 0, 512, 512);

  // Delicate translucent aged gossamer parchment membrane
  const grad = ctx.createRadialGradient(256, 256, 40, 256, 256, 250);
  grad.addColorStop(0, 'rgba(255, 250, 240, 0.7)');
  grad.addColorStop(0.6, 'rgba(235, 220, 195, 0.45)');
  grad.addColorStop(0.9, 'rgba(180, 150, 120, 0.2)');
  grad.addColorStop(1, 'rgba(100, 75, 50, 0.05)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 512, 512);

  // Bold Ivory Bone Veining Struts (Death's-Head Hawkmoth skeletal venation)
  ctx.strokeStyle = 'rgba(255, 255, 255, 1.0)';
  ctx.lineWidth = 6.5;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // Costal main leading bone rib
  ctx.beginPath();
  ctx.moveTo(30, 256);
  ctx.bezierCurveTo(110, 70, 380, 50, 495, 130);
  ctx.stroke();

  // Subcosta and Radial finger struts
  const ribs = [
    [90, 240, 480, 185, 4.5],
    [130, 245, 465, 250, 4.0],
    [170, 250, 440, 320, 3.5],
    [210, 255, 410, 380, 3.2],
    [240, 260, 360, 435, 3.0],
    [270, 265, 300, 470, 2.5]
  ];

  for (const r of ribs) {
    ctx.lineWidth = r[4];
    ctx.beginPath();
    ctx.moveTo(r[0], r[1]);
    ctx.quadraticCurveTo(270, 190 + (r[3] - 250) * 0.45, r[2], r[3]);
    ctx.stroke();

    // Secondary Gothic Arch cross-vein bridges
    for (let s = 0.2; s <= 0.85; s += 0.16) {
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      const cx = r[0] + (r[2] - r[0]) * s;
      const cy = r[1] + (r[3] - r[1]) * s;
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + (Math.random() - 0.5) * 26, cy - 28);
      ctx.stroke();
    }
  }

  // Skeletal Death's-Head Watermark on Forewing Cell
  ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
  ctx.beginPath();
  ctx.arc(220, 210, 22, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillRect(210, 226, 20, 12);
  // Skull eye cavities
  ctx.fillStyle = 'rgba(20, 10, 15, 0.9)';
  ctx.beginPath();
  ctx.arc(212, 208, 6.5, 0, Math.PI * 2);
  ctx.arc(228, 208, 6.5, 0, Math.PI * 2);
  ctx.fill();

  const texture = new THREE.CanvasTexture(canvas);
  return texture;
}

function createCurvedLimb(points, radii, radialSegments = 12) {
  const curve = new THREE.CatmullRomCurve3(points);
  const geom = new THREE.TubeGeometry(curve, 42, radii[0], radialSegments, false);
  
  const pos = geom.attributes.position;
  const count = pos.count;
  const v = new THREE.Vector3();
  const tubularSegments = 42;
  const vertsPerRing = radialSegments + 1;

  for (let i = 0; i <= tubularSegments; i++) {
    const t = i / tubularSegments;
    const currentRadius = radii[0] * (1 - t) + radii[1] * t;
    const scale = currentRadius / radii[0];
    const center = curve.getPoint(t);
    for (let j = 0; j < vertsPerRing; j++) {
      const idx = i * vertsPerRing + j;
      if (idx < count) {
        v.fromBufferAttribute(pos, idx);
        // Organic bark bumps
        const bump = Math.sin(i * 1.5 + j) * 0.015;
        v.sub(center).multiplyScalar(scale + bump).add(center);
        pos.setXYZ(idx, v.x, v.y, v.z);
      }
    }
  }
  geom.computeVertexNormals();
  const mesh = new THREE.Mesh(geom, branchMaterial);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

// --- TRUE SKELETAL DEATH'S-HEAD HAWKMOTH BUILDER ---
function createSkeletalHawkmoth() {
  const moth = new THREE.Group();

  // 1. ANATOMICAL SKULL DORSUM (Head & Thorax)
  const skullGroup = new THREE.Group();
  skullGroup.position.set(0, 0.02, -0.04);
  moth.add(skullGroup);

  // Cranium Dome
  const craniumGeo = new THREE.SphereGeometry(0.07, 12, 10);
  craniumGeo.scale(1.0, 1.1, 1.3);
  const craniumMesh = new THREE.Mesh(craniumGeo, mothBoneMaterial);
  craniumMesh.castShadow = true;
  skullGroup.add(craniumMesh);

  // Raised Bone Brow & Nasal Ridge
  const browGeo = new THREE.BoxGeometry(0.08, 0.025, 0.04);
  const brow = new THREE.Mesh(browGeo, mothBoneMaterial);
  brow.position.set(0, 0.05, -0.03);
  skullGroup.add(brow);

  // Deep Orbital Eye Cavities
  const socketMat = new THREE.MeshBasicMaterial({ color: 0x050308 });
  const socketGeo = new THREE.SphereGeometry(0.022, 8, 8);
  const socketL = new THREE.Mesh(socketGeo, socketMat);
  socketL.position.set(0.032, 0.045, -0.06);
  const socketR = new THREE.Mesh(socketGeo, socketMat);
  socketR.position.set(-0.032, 0.045, -0.06);
  skullGroup.add(socketL, socketR);

  // Maxillary bone teeth ridges (sculpted skull teeth)
  const teethGeo = new THREE.BoxGeometry(0.045, 0.02, 0.03);
  const teeth = new THREE.Mesh(teethGeo, mothBoneMaterial);
  teeth.position.set(0, 0.015, -0.07);
  skullGroup.add(teeth);

  // 2. OPEN SKELETAL RIBCAGE ABDOMEN
  const ribcageGroup = new THREE.Group();
  ribcageGroup.position.set(0, 0.01, 0.08);
  moth.add(ribcageGroup);

  // Central Vertebral Spine
  const spineGeo = new THREE.CylinderGeometry(0.012, 0.006, 0.42, 8);
  spineGeo.rotateX(Math.PI / 2);
  const spineMesh = new THREE.Mesh(spineGeo, mothBoneMaterial);
  spineMesh.position.z = 0.18;
  ribcageGroup.add(spineMesh);

  // 6 Segmented Rib Arches encircling the body
  const ribCount = 6;
  for (let r = 0; r < ribCount; r++) {
    const frac = r / ribCount;
    const archRadius = 0.075 * (1.0 - frac * 0.65);
    const ribTorus = new THREE.TorusGeometry(archRadius, 0.009, 6, 12, Math.PI * 1.5);
    ribTorus.rotateZ(-Math.PI * 0.75);
    const ribMesh = new THREE.Mesh(ribTorus, mothBoneMaterial);
    ribMesh.position.z = r * 0.058;
    ribMesh.castShadow = true;
    ribcageGroup.add(ribMesh);
  }

  // Inner Cursed Marrow Ember (soft glow inside the ribcage)
  const marrowMat = new THREE.MeshBasicMaterial({ color: params.jarGlowColor });
  const marrowGeo = new THREE.SphereGeometry(0.025, 6, 6);
  const marrowMesh = new THREE.Mesh(marrowGeo, marrowMat);
  marrowMesh.position.set(0, 0.01, 0.12);
  ribcageGroup.add(marrowMesh);

  // 3. CURVED FEATHERED (BIPECTINATE) ANTENNAE
  const antCurveL = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0.03, 0.05, -0.06),
    new THREE.Vector3(0.09, 0.12, -0.16),
    new THREE.Vector3(0.18, 0.15, -0.26)
  ]);
  const antGeoL = new THREE.TubeGeometry(antCurveL, 12, 0.006, 4, false);
  const antMeshL = new THREE.Mesh(antGeoL, mothBoneMaterial);
  skullGroup.add(antMeshL);

  const antCurveR = new THREE.CatmullRomCurve3([
    new THREE.Vector3(-0.03, 0.05, -0.06),
    new THREE.Vector3(-0.09, 0.12, -0.16),
    new THREE.Vector3(-0.18, 0.15, -0.26)
  ]);
  const antGeoR = new THREE.TubeGeometry(antCurveR, 12, 0.006, 4, false);
  const antMeshR = new THREE.Mesh(antGeoR, mothBoneMaterial);
  skullGroup.add(antMeshR);

  // 4. AUTHENTIC HAWKMOTH WINGS (SHAPE GEOMETRY)
  // Left Wing Pivot (mounted at shoulder)
  const leftWingPivot = new THREE.Group();
  leftWingPivot.position.set(0.05, 0.04, 0.02);
  moth.add(leftWingPivot);

  // Right Wing Pivot
  const rightWingPivot = new THREE.Group();
  rightWingPivot.position.set(-0.05, 0.04, 0.02);
  moth.add(rightWingPivot);

  // Forewing Shape (Pointed, Swept Aerodynamic Hawkmoth Blade)
  const foreShape = new THREE.Shape();
  foreShape.moveTo(0, 0);
  foreShape.bezierCurveTo(0.15, 0.08, 0.45, 0.14, 0.68, 0.05); // Leading edge
  foreShape.bezierCurveTo(0.62, -0.12, 0.38, -0.24, 0.18, -0.22); // Outer margin
  foreShape.bezierCurveTo(0.08, -0.20, 0.02, -0.10, 0, 0); // Inner margin
  const forewingGeo = new THREE.ShapeGeometry(foreShape, 12);
  forewingGeo.rotateX(-Math.PI / 2);

  const leftForewing = new THREE.Mesh(forewingGeo, mothWingMaterial);
  leftWingPivot.add(leftForewing);

  const forewingGeoR = forewingGeo.clone();
  forewingGeoR.scale(-1, 1, 1);
  const rightForewing = new THREE.Mesh(forewingGeoR, mothWingMaterial);
  rightWingPivot.add(rightForewing);

  // Hindwing Shape (Rounded Scalloped Fan)
  const hindShape = new THREE.Shape();
  hindShape.moveTo(0, 0);
  hindShape.bezierCurveTo(0.12, 0.02, 0.32, -0.04, 0.42, -0.12);
  hindShape.bezierCurveTo(0.35, -0.24, 0.18, -0.28, 0.08, -0.22);
  hindShape.bezierCurveTo(0.03, -0.16, 0.01, -0.08, 0, 0);
  const hindwingGeo = new THREE.ShapeGeometry(hindShape, 10);
  hindwingGeo.rotateX(-Math.PI / 2);

  const leftHindwing = new THREE.Mesh(hindwingGeo, mothWingMaterial);
  leftHindwing.position.set(0.02, -0.01, 0.06);
  leftWingPivot.add(leftHindwing);

  const hindwingGeoR = hindwingGeo.clone();
  hindwingGeoR.scale(-1, 1, 1);
  const rightHindwing = new THREE.Mesh(hindwingGeoR, mothWingMaterial);
  rightHindwing.position.set(-0.02, -0.01, 0.06);
  rightWingPivot.add(rightHindwing);

  // 5. ARTICULATED JOINTED BONE LEGS
  for (let side = -1; side <= 1; side += 2) {
    for (let leg = 0; leg < 3; leg++) {
      const legCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(side * 0.04, 0.0, (leg - 1) * 0.06),
        new THREE.Vector3(side * 0.09, -0.05, (leg - 1) * 0.06 + 0.02),
        new THREE.Vector3(side * 0.12, -0.11, (leg - 1) * 0.06 + 0.04)
      ]);
      const legGeo = new THREE.TubeGeometry(legCurve, 6, 0.005, 4, false);
      const legMesh = new THREE.Mesh(legGeo, mothBoneMaterial);
      moth.add(legMesh);
    }
  }

  moth.scale.setScalar(0.95);
  return {
    group: moth,
    leftPivot: leftWingPivot,
    rightPivot: rightWingPivot,
    ribcage: ribcageGroup,
    marrow: marrowMesh
  };
}

// --- STRICT GLASS COLLISION & FLIGHT DYNAMICS ---
function applyStrictClocheConstraint(pos, vel, margin = 0.16) {
  let collided = false;
  const R_eff = JAR_COLLISION.radius - margin;

  // 1. Floor collision
  if (pos.y < JAR_COLLISION.minY + margin) {
    pos.y = JAR_COLLISION.minY + margin;
    vel.y = Math.abs(vel.y) * 0.8 + 0.3;
    collided = true;
  }

  // 2. Cylinder wall collision
  if (pos.y <= JAR_COLLISION.cylinderMaxY) {
    const dXZ = Math.hypot(pos.x, pos.z);
    if (dXZ > R_eff) {
      const nx = pos.x / dXZ;
      const nz = pos.z / dXZ;
      pos.x = nx * R_eff;
      pos.z = nz * R_eff;

      // Inward bounce + slight upward flutter along glass
      const dot = vel.x * nx + vel.z * nz;
      vel.x = (vel.x - 1.8 * dot * nx) * 0.7;
      vel.z = (vel.z - 1.8 * dot * nz) * 0.7;
      vel.y += 0.2;
      collided = true;
    }
  } else {
    // 3. Hemisphere Dome ceiling collision (FIXED: THREE.Vector3 addScaledVector)
    const domeCenter = new THREE.Vector3(0, JAR_COLLISION.domeCenterY, 0);
    const offset = pos.clone().sub(domeCenter);
    const dist = offset.length();

    if (dist > R_eff) {
      const normal = offset.normalize();
      pos.copy(domeCenter).addScaledVector(normal, R_eff);

      const dot = vel.dot(normal);
      vel.addScaledVector(normal, -1.8 * dot); // FIXED! No invalid subScaledVector
      vel.multiplyScalar(0.7);
      collided = true;
    }
  }

  // 4. Branch Trunk Core Avoidance
  const dTrunk = Math.hypot(pos.x, pos.z);
  if (dTrunk < 0.22 && pos.y < 4.2) {
    const nx = pos.x / (dTrunk || 1);
    const nz = pos.z / (dTrunk || 1);
    vel.x += nx * 0.8;
    vel.z += nz * 0.8;
  }

  return collided;
}

// --- POINTER & HOVER INTERACTION ---
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2(-999, -999);
let hoverAgitationTarget = 0.0;
let idleHoverTimeout = null;

let pointerDownTime = 0;
let pointerDownPos = { x: 0, y: 0 };

function onPointerMove(e) {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects([clocheMesh, plinthMesh, trunkMesh], false);

  if (intersects.length > 0 || Math.hypot(mouse.x, mouse.y) < 0.6) {
    hoverAgitationTarget = 1.0;

    clearTimeout(idleHoverTimeout);
    idleHoverTimeout = setTimeout(() => {
      if (params.agitationMode === "Hover Reactive") {
        hoverAgitationTarget = 0.0;
      }
    }, 4500);
  } else {
    if (params.agitationMode === "Hover Reactive") {
      hoverAgitationTarget = 0.0;
    }
  }
}

function onPointerDown(e) {
  pointerDownTime = performance.now();
  pointerDownPos.x = e.clientX;
  pointerDownPos.y = e.clientY;
}

function onPointerUp(e) {
  const dt = performance.now() - pointerDownTime;
  const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);

  if (dist < 7 && dt < 350) {
    if (params.randomizeOnClick) {
      triggerProceduralRandomization();
    }
  }
}

window.addEventListener('pointermove', onPointerMove);
window.addEventListener('pointerdown', onPointerDown);
window.addEventListener('pointerup', onPointerUp);

// --- COLOR SCHEME APPLIER ---
function applyColorScheme(schemeName, animate = true) {
  const scheme = COLOR_SCHEMES[schemeName];
  if (!scheme) return;

  params.colorScheme = schemeName;
  params.mothBoneColor = scheme.bone;
  params.mothWingColor = scheme.wingVein;
  params.jarGlowColor = scheme.jarGlow;
  params.woodBaseColor = scheme.wood;
  params.brassColor = scheme.brass;
  params.keyLightColor = scheme.keyLight;
  params.ambientColor = scheme.ambient;

  const targetBg = params.greenscreen ? '#00ff00' : scheme.bg;

  if (animate && typeof gsap !== 'undefined') {
    const bgCol = scene.background.clone();
    const fogCol = scene.fog.color.clone();
    const ambCol = ambientLight.color.clone();
    const keyCol = keyLight.color.clone();
    const jarCol = jarLight.color.clone();
    const rimCol = rimLight.color.clone();
    const plinthCol = plinthLight.color.clone();

    const targetBgCol = new THREE.Color(targetBg);
    const targetFogCol = new THREE.Color(params.greenscreen ? '#00ff00' : scheme.bg);
    const targetAmbCol = new THREE.Color(scheme.ambient);
    const targetKeyCol = new THREE.Color(scheme.keyLight);
    const targetJarCol = new THREE.Color(scheme.jarGlow);
    const targetRimCol = new THREE.Color(scheme.rimLight);
    const targetBrassCol = new THREE.Color(scheme.brass);

    gsap.to({}, {
      duration: 1.2,
      ease: "power2.out",
      onUpdate: function() {
        const p = this.progress();
        scene.background.lerpColors(bgCol, targetBgCol, p);
        scene.fog.color.lerpColors(fogCol, targetFogCol, p);
        ambientLight.color.lerpColors(ambCol, targetAmbCol, p);
        keyLight.color.lerpColors(keyCol, targetKeyCol, p);
        jarLight.color.lerpColors(jarCol, targetJarCol, p);
        rimLight.color.lerpColors(rimCol, targetRimCol, p);
        plinthLight.color.lerpColors(plinthCol, targetBrassCol, p);

        mothBoneMaterial.color.set(scheme.bone);
        mothWingMaterial.emissive.set(scheme.wingVein);
        woodMaterial.color.set(scheme.wood);
        branchMaterial.color.set(scheme.wood);
        brassMaterial.color.set(scheme.brass);
        shelfMat.color.set(scheme.jarGlow);
        shelfMat.emissive.set(scheme.jarGlow);
        dustMat.color.set(scheme.jarGlow);

        for (const m of moths) {
          m.marrow.material.color.set(scheme.jarGlow);
        }
      }
    });
  } else {
    scene.background.set(targetBg);
    scene.fog.color.set(targetBg);
    ambientLight.color.set(scheme.ambient);
    keyLight.color.set(scheme.keyLight);
    jarLight.color.set(scheme.jarGlow);
    rimLight.color.set(scheme.rimLight);
    plinthLight.color.set(scheme.brass);

    mothBoneMaterial.color.set(scheme.bone);
    mothWingMaterial.emissive.set(scheme.wingVein);
    woodMaterial.color.set(scheme.wood);
    branchMaterial.color.set(scheme.wood);
    brassMaterial.color.set(scheme.brass);
    shelfMat.color.set(scheme.jarGlow);
    shelfMat.emissive.set(scheme.jarGlow);
    dustMat.color.set(scheme.jarGlow);

    for (const m of moths) {
      m.marrow.material.color.set(scheme.jarGlow);
    }
  }
}

// --- PROCEDURAL RANDOMIZATION UPON CLICK ---
function triggerProceduralRandomization() {
  const schemeKeys = Object.keys(COLOR_SCHEMES);
  const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];

  params.exposure = THREE.MathUtils.randFloat(0.95, 1.45);
  params.jarLightIntensity = THREE.MathUtils.randFloat(2.5, 4.8);
  params.keyLightIntensity = THREE.MathUtils.randFloat(1.6, 2.8);
  params.ambientIntensity = THREE.MathUtils.randFloat(0.6, 1.1);
  params.mothSpeed = THREE.MathUtils.randFloat(0.8, 1.6);
  params.mothFlapRate = THREE.MathUtils.randFloat(0.85, 1.4);

  if (Math.random() > 0.15) {
    const animKeys = ANIMATION_PRESETS.filter(a => !a.startsWith("Static"));
    params.animation = animKeys[Math.floor(Math.random() * animKeys.length)];
  }

  applyColorScheme(randomScheme, true);

  renderer.toneMappingExposure = params.exposure;
  ambientLight.intensity = params.ambientIntensity;
  keyLight.intensity = params.keyLightIntensity;
  jarLight.intensity = params.jarLightIntensity;

  hoverAgitationTarget = 1.0;
  setTimeout(() => {
    if (params.agitationMode === "Hover Reactive") {
      hoverAgitationTarget = 0.0;
    }
  }, 3500);

  gui.controllersRecursive().forEach(c => c.updateDisplay());
}

// --- SEAMLESS ANTIALIAS TOGGLE ---
function setAntialias(enable) {
  if (params.antialias === enable && renderer) return;
  params.antialias = enable;

  const oldCanvas = renderer.domElement;
  const parent = oldCanvas.parentElement;
  const currentPixelRatio = renderer.getPixelRatio();
  const currentSize = new THREE.Vector2();
  renderer.getSize(currentSize);

  renderer.dispose();
  if (oldCanvas && parent) {
    parent.removeChild(oldCanvas);
  }

  renderer = new THREE.WebGLRenderer({
    antialias: enable,
    powerPreference: "high-performance"
  });
  renderer.setSize(currentSize.x, currentSize.y);
  renderer.setPixelRatio(currentPixelRatio);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = params.exposure;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  document.body.appendChild(renderer.domElement);
  controls.domElement = renderer.domElement;

  renderer.domElement.addEventListener('pointerdown', onPointerDown);
  renderer.domElement.addEventListener('pointerup', onPointerUp);

  if (typeof postProcessor !== 'undefined') {
    postProcessor.renderer = renderer;
    postProcessor.setSize(currentSize.x, currentSize.y, currentPixelRatio);
  }
}

// --- CAMERA ANIMATION UPDATE ---
let animClock = 0;

function updateCameraPreset(delta) {
  if (params.animation === "Static (Observation)") {
    return;
  }

  animClock += delta * params.animationSpeed * 0.45;
  const t = animClock;
  const targetLook = new THREE.Vector3(0, 2.7, 0);

  switch (params.animation) {
    case "Slow Victorian Orbit": {
      const radius = 7.5;
      const angle = t * 0.4;
      camera.position.x = THREE.MathUtils.lerp(camera.position.x, Math.sin(angle) * radius, 0.04);
      camera.position.z = THREE.MathUtils.lerp(camera.position.z, Math.cos(angle) * radius, 0.04);
      camera.position.y = THREE.MathUtils.lerp(camera.position.y, 3.2 + Math.sin(t * 0.2) * 0.6, 0.04);
      controls.target.lerp(targetLook, 0.04);
      break;
    }
    case "Eerie Pendulum Sway": {
      const arc = Math.sin(t * 0.6) * 0.85;
      const radius = 7.2;
      camera.position.x = THREE.MathUtils.lerp(camera.position.x, Math.sin(arc) * radius, 0.05);
      camera.position.z = THREE.MathUtils.lerp(camera.position.z, Math.cos(arc) * radius, 0.05);
      camera.position.y = THREE.MathUtils.lerp(camera.position.y, 3.0 + Math.cos(arc * 2) * 0.4, 0.05);
      controls.target.lerp(targetLook, 0.05);
      break;
    }
    case "Entomologist Inspection": {
      const radius = 6.2;
      const angle = t * 0.55;
      const height = 2.0 + Math.sin(t * 0.4) * 1.8;
      camera.position.x = THREE.MathUtils.lerp(camera.position.x, Math.sin(angle) * radius, 0.04);
      camera.position.z = THREE.MathUtils.lerp(camera.position.z, Math.cos(angle) * radius, 0.04);
      camera.position.y = THREE.MathUtils.lerp(camera.position.y, height, 0.04);
      controls.target.lerp(new THREE.Vector3(0, height * 0.9, 0), 0.04);
      break;
    }
    case "Breathing Cloche Dolly": {
      const dist = 7.2 + Math.sin(t * 0.5) * 2.2;
      const angle = 0.35 + Math.sin(t * 0.15) * 0.3;
      camera.position.x = THREE.MathUtils.lerp(camera.position.x, Math.sin(angle) * dist, 0.04);
      camera.position.z = THREE.MathUtils.lerp(camera.position.z, Math.cos(angle) * dist, 0.04);
      camera.position.y = THREE.MathUtils.lerp(camera.position.y, 2.9, 0.04);
      controls.target.lerp(targetLook, 0.04);
      break;
    }
    case "Gothic Figure-8 Drift": {
      const radius = 6.8;
      const x = Math.sin(t * 0.45) * radius;
      const z = Math.sin(t * 0.9) * 2.4 + 5.5;
      const y = 3.2 + Math.cos(t * 0.45) * 1.1;
      camera.position.x = THREE.MathUtils.lerp(camera.position.x, x, 0.04);
      camera.position.z = THREE.MathUtils.lerp(camera.position.z, z, 0.04);
      camera.position.y = THREE.MathUtils.lerp(camera.position.y, y, 0.04);
      controls.target.lerp(targetLook, 0.04);
      break;
    }
    case "Low Curio Angle": {
      const radius = 5.8;
      const angle = t * 0.3;
      camera.position.x = THREE.MathUtils.lerp(camera.position.x, Math.sin(angle) * radius, 0.035);
      camera.position.z = THREE.MathUtils.lerp(camera.position.z, Math.cos(angle) * radius, 0.035);
      camera.position.y = THREE.MathUtils.lerp(camera.position.y, 1.1 + Math.sin(t * 0.4) * 0.3, 0.035);
      controls.target.lerp(new THREE.Vector3(0, 3.4, 0), 0.04);
      break;
    }
    case "Specimen Macro Focus": {
      const radius = 3.8;
      const angle = t * 0.35;
      camera.position.x = THREE.MathUtils.lerp(camera.position.x, Math.sin(angle) * radius, 0.04);
      camera.position.z = THREE.MathUtils.lerp(camera.position.z, Math.cos(angle) * radius, 0.04);
      camera.position.y = THREE.MathUtils.lerp(camera.position.y, 2.8 + Math.sin(t * 0.3) * 0.5, 0.04);
      controls.target.lerp(new THREE.Vector3(0, 2.7, 0), 0.04);
      break;
    }
  }
}

// --- MAIN ANIMATION & RENDER LOOP ---
const clock = new THREE.Clock();
let swarmCenter = new THREE.Vector3(0, 2.7, 0);

function animate() {
  requestAnimationFrame(animate);

  const rawDelta = clock.getDelta();
  const delta = Math.min(rawDelta, 0.1);
  const time = clock.getElapsedTime() * params.animationSpeed;

  if (params.agitationMode === "Always Swarm") {
    params.swarmExcitement = 1.0;
  } else if (params.agitationMode === "Frozen Taxidermy") {
    params.swarmExcitement = 0.0;
  } else {
    params.swarmExcitement = THREE.MathUtils.lerp(params.swarmExcitement, hoverAgitationTarget, delta * 3.2);
  }

  updateCameraPreset(delta);
  controls.update();

  // Curio Jar internal pulsing glow
  const curioPulse = Math.sin(time * 2.2) * 0.25;
  jarLight.intensity = params.jarLightIntensity + curioPulse;
  jarLight.position.y = 2.7 + Math.sin(time * 1.5) * 0.12;

  // Dust & Cursed Embers Motion
  const dustPosArr = dustParticles.geometry.attributes.position.array;
  for (let i = 0; i < DUST_COUNT; i++) {
    const idx = i * 3;
    const v = dustVelocities[i];

    dustPosArr[idx + 0] += v.x * delta * (1.0 + params.swarmExcitement * 1.5);
    dustPosArr[idx + 1] += v.y * delta * (1.0 + params.swarmExcitement * 2.0);
    dustPosArr[idx + 2] += v.z * delta * (1.0 + params.swarmExcitement * 1.5);

    if (dustPosArr[idx + 1] > 5.8) {
      dustPosArr[idx + 1] = 0.75;
      const th = Math.random() * Math.PI * 2;
      const r = Math.sqrt(Math.random()) * 1.35;
      dustPosArr[idx + 0] = r * Math.cos(th);
      dustPosArr[idx + 2] = r * Math.sin(th);
    }
    const dXZ = Math.hypot(dustPosArr[idx + 0], dustPosArr[idx + 2]);
    if (dXZ > 1.45) {
      dustPosArr[idx + 0] *= 0.96;
      dustPosArr[idx + 2] *= 0.96;
    }
  }
  dustParticles.geometry.attributes.position.needsUpdate = true;

  const mothSpeedScale = params.mothSpeed * params.animationSpeed;
  const mothFlapScale = params.mothFlapRate * params.animationSpeed;

  swarmCenter.set(0, 2.7 + Math.sin(time * 0.8) * 0.4, 0);

  for (let i = 0; i < MOTH_COUNT; i++) {
    const moth = moths[i];

    moth.agitation = THREE.MathUtils.lerp(moth.agitation, params.swarmExcitement, delta * (2.0 + (i % 5) * 0.5));

    if (moth.agitation > 0.02) {
      const p = moth.flightPos;
      const v = moth.velocity;

      // 1. Swarm Center Cohesion
      const toCenter = swarmCenter.clone().sub(p);
      v.addScaledVector(toCenter, 0.45 * delta);

      // 2. Neighbor Separation
      for (let j = 0; j < MOTH_COUNT; j++) {
        if (i !== j) {
          const dist = p.distanceTo(moths[j].flightPos);
          if (dist < 0.38 && dist > 0.001) {
            const repulse = p.clone().sub(moths[j].flightPos).normalize();
            v.addScaledVector(repulse, (0.38 - dist) * 3.8 * delta);
          }
        }
      }

      // 3. Turbulent Flocking Wander
      const noiseX = Math.sin(time * 3.2 + moth.phase) * 1.8;
      const noiseY = Math.cos(time * 2.5 + moth.phase * 1.3) * 1.6;
      const noiseZ = Math.sin(time * 2.9 + moth.phase * 2.1) * 1.8;
      v.x += noiseX * delta;
      v.y += noiseY * delta;
      v.z += noiseZ * delta;

      const currentSpeed = v.length();
      const maxSpd = 2.4 * mothSpeedScale;
      const minSpd = 0.6 * mothSpeedScale;
      if (currentSpeed > maxSpd) v.multiplyScalar(maxSpd / currentSpeed);
      if (currentSpeed < minSpd) v.multiplyScalar(minSpd / (currentSpeed || 1));

      p.addScaledVector(v, delta * mothSpeedScale);

      const collided = applyStrictClocheConstraint(p, v, 0.16);
      if (collided && moth.tapCooldown <= 0) {
        moth.tapCooldown = 0.25;
      }
      if (moth.tapCooldown > 0) moth.tapCooldown -= delta;

      const lookTarget = p.clone().add(v);
      moth.group.position.lerp(p, THREE.MathUtils.clamp(moth.agitation * 2.0, 0, 1));
      
      const currentRot = moth.group.quaternion.clone();
      moth.group.lookAt(lookTarget);
      const targetRot = moth.group.quaternion.clone();
      moth.group.quaternion.slerpQuaternions(currentRot, targetRot, delta * 12.0);

      // Fast flutter flapping (18 - 25 Hz)
      const flapAngle = Math.sin(time * moth.freq * mothFlapScale + moth.phase) * 0.95;
      moth.leftPivot.rotation.z = flapAngle;
      moth.rightPivot.rotation.z = -flapAngle;

      moth.leftPivot.rotation.x = Math.cos(time * moth.freq * mothFlapScale + moth.phase) * 0.25;
      moth.rightPivot.rotation.x = moth.leftPivot.rotation.x;

      moth.ribcage.rotation.x = -Math.sin(time * moth.freq * 0.5) * 0.12 - 0.08;
    } else {
      // Frozen Taxidermy Pose
      moth.group.position.lerp(moth.perchPos, delta * 4.5);
      moth.group.rotation.set(
        THREE.MathUtils.lerp(moth.group.rotation.x, moth.perchRot.x, delta * 4.5),
        THREE.MathUtils.lerp(moth.group.rotation.y, moth.perchRot.y, delta * 4.5),
        THREE.MathUtils.lerp(moth.group.rotation.z, moth.perchRot.z, delta * 4.5)
      );

      // Wings folded naturally over ribcage
      moth.leftPivot.rotation.z = THREE.MathUtils.lerp(moth.leftPivot.rotation.z, -0.28, delta * 6.0);
      moth.rightPivot.rotation.z = THREE.MathUtils.lerp(moth.rightPivot.rotation.z, 0.28, delta * 6.0);
      moth.leftPivot.rotation.x = THREE.MathUtils.lerp(moth.leftPivot.rotation.x, 0.12, delta * 6.0);
      moth.rightPivot.rotation.x = THREE.MathUtils.lerp(moth.rightPivot.rotation.x, 0.12, delta * 6.0);
      moth.ribcage.rotation.x = THREE.MathUtils.lerp(moth.ribcage.rotation.x, -0.04, delta * 6.0);

      moth.flightPos.copy(moth.perchPos);
    }
  }

  if (typeof postProcessor !== 'undefined' && postProcessor.settings.enabled) {
    postProcessor.setMoonScreenPosition(camera, jarLight.position);
    postProcessor.renderScene(scene, camera);
  } else {
    renderer.render(scene, camera);
  }
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  if (typeof postProcessor !== 'undefined') {
    postProcessor.setSize(window.innerWidth, window.innerHeight, params.pixelRatio);
  }
});

animate();
</script>
