<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blowing Heart</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      user-select: none;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }
  </style>
</head>
<body>
  <script type="module">
    import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

    /*
    * File Name / blowingHeart.js
    * Created Date / Aug 24, 2020
    * Author / Toshiya Marukubo
    * Twitter / https://twitter.com/toshiyamarukubo
    */

    class Tool {
      static randomNumber(min, max) {
        return Math.floor(Math.random() * (max - min + 1) + min);
      }
      static randomColorRGB() {
        return (
          "rgb(" +
          this.randomNumber(0, 255) +
          ", " +
          this.randomNumber(0, 255) +
          ", " +
          this.randomNumber(0, 255) +
          ")"
        );
      }
      static randomColorHSL(hue, saturation, lightness) {
        return (
          "hsl(" +
          hue +
          ", " +
          saturation +
          "%, " +
          lightness +
          "%)"
        );
      }
      static gradientColor(ctx, cr, cg, cb, ca, x, y, r) {
        const col = cr + "," + cg + "," + cb;
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, "rgba(" + col + ", " + (ca * 1) + ")");
        g.addColorStop(0.5, "rgba(" + col + ", " + (ca * 0.5) + ")");
        g.addColorStop(1, "rgba(" + col + ", " + (ca * 0) + ")");
        return g;
      }
    }

    class Angle {
      constructor(a) {
        this.a = a;
        this.rad = (this.a * Math.PI) / 180;
      }
      incDec(num) {
        this.a += num;
        this.rad = (this.a * Math.PI) / 180;
      }
    }

    function hexToHsl(hex) {
      let c = hex.replace('#', '');
      if (c.length === 3) c = c.split('').map(x => x + x).join('');
      const r = parseInt(c.substr(0, 2), 16) / 255;
      const g = parseInt(c.substr(2, 2), 16) / 255;
      const b = parseInt(c.substr(4, 2), 16) / 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      let h = 0, s = 0, l = (max + min) / 2;
      if (max !== min) {
        const d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        switch (max) {
          case r: h = ((g - b) / d + (g < b ? 6 : 0)) * 60; break;
          case g: h = ((b - r) / d + 2) * 60; break;
          case b: h = ((r - g) / d + 4) * 60; break;
        }
      }
      return { h, s: s * 100, l: l * 100 };
    }

    const COLOR_SCHEMES = [
      'Original',
      'Monochromatic',
      'Analogous',
      'Complementary',
      'Split-complementary',
      'Triadic',
      'Tetradic',
      'Double split-complementary',
      'Achromatic',
      'Achromatic + Accent',
      'Neutral + accent',
      'Amber Flame (F6AA1C, BC3908, 941B0C, F6AA1C, 220901)',
      'Teal Ocean (63D1CF, 5BC0BE, 4BAD9E, 4BAD9E, 0B132B, 000000)',
      'Lavender Orchid (AA60C8, D69ADE, C9A3C6, CFB5C2, 0D001D, 120A12)',
      'Golden Teal (FEF1BE, FFBA00, 008189, 00474D, 061210)',
      'Neon Lime (D4FFB0, 7FFF00, 00B894, 0A3322, 05140A)',
      'Sunset Tangerine (FFE8CC, FF8C00, C7501A, 3D1050, 0E0618)',
      'Mystic Violet (E8E0FF, B38FFF, 6A3DE8, 1A1250, 090612)',
      'Cyberpunk Neon (E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)'
    ];

    const PALETTES = {
      'Amber Flame (F6AA1C, BC3908, 941B0C, F6AA1C, 220901)': ['#F6AA1C', '#BC3908', '#941B0C', '#F6AA1C', '#220901'],
      'Teal Ocean (63D1CF, 5BC0BE, 4BAD9E, 4BAD9E, 0B132B, 000000)': ['#63D1CF', '#5BC0BE', '#4BAD9E', '#4BAD9E', '#0B132B', '#000000'],
      'Lavender Orchid (AA60C8, D69ADE, C9A3C6, CFB5C2, 0D001D, 120A12)': ['#AA60C8', '#D69ADE', '#C9A3C6', '#CFB5C2', '#0D001D', '#120A12'],
      'Golden Teal (FEF1BE, FFBA00, 008189, 00474D, 061210)': ['#FEF1BE', '#FFBA00', '#008189', '#00474D', '#061210'],
      'Neon Lime (D4FFB0, 7FFF00, 00B894, 0A3322, 05140A)': ['#D4FFB0', '#7FFF00', '#00B894', '#0A3322', '#05140A'],
      'Sunset Tangerine (FFE8CC, FF8C00, C7501A, 3D1050, 0E0618)': ['#FFE8CC', '#FF8C00', '#C7501A', '#3D1050', '#0E0618'],
      'Mystic Violet (E8E0FF, B38FFF, 6A3DE8, 1A1250, 090612)': ['#E8E0FF', '#B38FFF', '#6A3DE8', '#1A1250', '#090612'],
      'Cyberpunk Neon (E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)': ['#E0FBFF', '#00F0FF', '#D40078', '#1E0A3D', '#05020F']
    };

    const NEUTRALS = [
      '#f1f5f9', '#e2e8f0', '#cbd5e1', '#94a3b8', '#64748b', '#475569', '#334155',
      '#f5f5f4', '#e7e5e4', '#d6d3d1', '#a8a29e', '#78716c', '#57534e', '#44403c',
      '#d7cfc7', '#c2b69d', '#9e9282', '#6b6155'
    ];

    const params = {
      greenscreen: false,
      bgColor: '#000000',
      blendMode: 'lighter',

      colorScheme: 'Original',
      primaryColor: '#ff2255',
      accentColor: '#ff003c',

      heartScale: 1.0,
      samplingStep: 12,
      minHeartSize: 6,
      maxHeartSize: 12,
      pulseMagnitude: 20,
      pulseSpeed: 1.0,

      windX: 0.02,
      windY: -0.01,
      fadeRate: 1.0,

      clickToRandomize: true
    };

    const transform = {
      x: 0,
      y: 0,
      scale: 1.0
    };

    function getHeartColor() {
      const scheme = params.colorScheme;
      const { h: baseH } = hexToHsl(params.primaryColor);

      if (PALETTES[scheme]) {
        const pal = PALETTES[scheme];
        return pal[Math.floor(Math.random() * pal.length)];
      }

      switch (scheme) {
        case 'Original':
          return Tool.randomColorHSL(Tool.randomNumber(-5, 5), 80, 60);

        case 'Monochromatic': {
          const s = Tool.randomNumber(60, 95);
          const l = Tool.randomNumber(35, 80);
          return `hsl(${baseH}, ${s}%, ${l}%)`;
        }

        case 'Analogous': {
          const h = (baseH + Tool.randomNumber(-30, 30) + 360) % 360;
          const s = Tool.randomNumber(70, 95);
          const l = Tool.randomNumber(45, 75);
          return `hsl(${h}, ${s}%, ${l}%)`;
        }

        case 'Complementary': {
          const h = Math.random() < 0.5 ? baseH : (baseH + 180) % 360;
          const s = Tool.randomNumber(70, 95);
          const l = Tool.randomNumber(45, 75);
          return `hsl(${h}, ${s}%, ${l}%)`;
        }

        case 'Split-complementary': {
          const r = Math.random();
          let h = baseH;
          if (r < 0.333) h = (baseH + 150) % 360;
          else if (r < 0.666) h = (baseH + 210) % 360;
          const s = Tool.randomNumber(70, 95);
          const l = Tool.randomNumber(45, 75);
          return `hsl(${h}, ${s}%, ${l}%)`;
        }

        case 'Triadic': {
          const shifts = [0, 120, 240];
          const h = (baseH + shifts[Math.floor(Math.random() * 3)]) % 360;
          const s = Tool.randomNumber(70, 95);
          const l = Tool.randomNumber(45, 75);
          return `hsl(${h}, ${s}%, ${l}%)`;
        }

        case 'Tetradic': {
          const shifts = [0, 90, 180, 270];
          const h = (baseH + shifts[Math.floor(Math.random() * 4)]) % 360;
          const s = Tool.randomNumber(70, 95);
          const l = Tool.randomNumber(45, 75);
          return `hsl(${h}, ${s}%, ${l}%)`;
        }

        case 'Double split-complementary': {
          const shifts = [-30, 30, 150, 210];
          const h = (baseH + shifts[Math.floor(Math.random() * 4)] + 360) % 360;
          const s = Tool.randomNumber(70, 95);
          const l = Tool.randomNumber(45, 75);
          return `hsl(${h}, ${s}%, ${l}%)`;
        }

        case 'Achromatic': {
          const l = Tool.randomNumber(15, 95);
          return `hsl(0, 0%, ${l}%)`;
        }

        case 'Achromatic + Accent': {
          if (Math.random() < 0.22) {
            return params.accentColor;
          }
          const l = Tool.randomNumber(15, 95);
          return `hsl(0, 0%, ${l}%)`;
        }

        case 'Neutral + accent': {
          if (Math.random() < 0.25) {
            return params.accentColor;
          }
          return NEUTRALS[Math.floor(Math.random() * NEUTRALS.length)];
        }

        default:
          return Tool.randomColorHSL(Tool.randomNumber(-5, 5), 80, 60);
      }
    }

    let canvas;
    let offCanvas;
    let gui;
    const controllers = {};

    function refreshColors() {
      if (!canvas || !canvas.hearts) return;
      for (let i = 0; i < canvas.hearts.length; i++) {
        canvas.hearts[i].c = getHeartColor();
      }
    }

    function rebuildHeartShape() {
      if (!offCanvas) return;
      offCanvas.heartSize = (offCanvas.width < 768 ? 180 : 250) * params.heartScale;
      offCanvas.offInit();
      refreshColors();
    }

    function resetView() {
      transform.x = 0;
      transform.y = 0;
      transform.scale = 1.0;
      controllers.scale?.updateDisplay();
      controllers.panX?.updateDisplay();
      controllers.panY?.updateDisplay();
    }

    function randomizeScene() {
      params.colorScheme = COLOR_SCHEMES[Math.floor(Math.random() * COLOR_SCHEMES.length)];
      params.primaryColor = '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0');
      params.accentColor = '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0');

      params.pulseMagnitude = Tool.randomNumber(12, 34);
      params.pulseSpeed = +(Math.random() * 2.2 + 0.6).toFixed(2);
      params.minHeartSize = Tool.randomNumber(4, 8);
      params.maxHeartSize = Tool.randomNumber(10, 22);
      params.heartScale = +(Math.random() * 0.6 + 0.75).toFixed(2);

      params.windX = +(Math.random() * 0.045 + 0.008).toFixed(3);
      params.windY = +(-Math.random() * 0.03 - 0.005).toFixed(3);
      params.fadeRate = +(Math.random() * 1.5 + 0.5).toFixed(2);

      if (!params.greenscreen) {
        params.blendMode = Math.random() < 0.75 ? 'lighter' : 'source-over';
      }

      rebuildHeartShape();
      refreshColors();

      if (gui) {
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      }
    }

    class Canvas {
      constructor(bool) {
        this.canvas = document.createElement("canvas");
        if (bool === true) {
          this.canvas.style.position = 'fixed';
          this.canvas.style.display = 'block';
          this.canvas.style.top = '0';
          this.canvas.style.left = '0';
          document.body.appendChild(this.canvas);
        }
        this.ctx = this.canvas.getContext("2d");
        this.width = this.canvas.width = window.innerWidth;
        this.height = this.canvas.height = window.innerHeight;
        this.heartSize = (this.width < 768 ? 180 : 250) * params.heartScale;
        this.hearts = [];
        this.offHeartNum = 1;
        this.offHearts = [];
        this.data = null;
      }

      onInit() {
        this.hearts = [];
        let index = 0;
        const step = params.samplingStep;
        for (let i = 0; i < this.height; i += step) {
          for (let j = 0; j < this.width; j += step) {
            let oI = (j + i * this.width) * 4 + 3;
            if (this.data && this.data[oI] > 0) {
              index++;
              const h = new Heart(
                canvas.ctx,
                j + Tool.randomNumber(-3, 3),
                i + Tool.randomNumber(-3, 3),
                Tool.randomNumber(params.minHeartSize, params.maxHeartSize),
                index
              );
              canvas.hearts.push(h);
            }
          }
        }
      }

      offInit() {
        this.ctx.clearRect(0, 0, this.width, this.height);
        this.offHearts = [];
        for (let i = 0; i < this.offHeartNum; i++) {
          const s = new Heart(this.ctx, this.width / 2, this.height / 2.3, this.heartSize);
          this.offHearts.push(s);
        }
        for (let i = 0; i < this.offHearts.length; i++) {
          this.offHearts[i].offRender();
        }
        this.data = this.ctx.getImageData(0, 0, this.width, this.height).data;
        this.onInit();
      }

      render() {
        const ctx = this.ctx;
        ctx.save();

        const currentBg = params.greenscreen ? '#00ff00' : params.bgColor;
        document.body.style.backgroundColor = currentBg;
        ctx.fillStyle = currentBg;
        ctx.fillRect(0, 0, this.width, this.height);

        ctx.translate(transform.x, transform.y);
        ctx.scale(transform.scale, transform.scale);

        for (let i = 0; i < this.hearts.length; i++) {
          this.hearts[i].render(i);
        }

        ctx.restore();
      }

      resize() {
        this.offHearts = [];
        this.hearts = [];
        this.width = this.canvas.width = window.innerWidth;
        this.height = this.canvas.height = window.innerHeight;
        this.heartSize = (this.width < 768 ? 180 : 250) * params.heartScale;
      }
    }

    class Heart {
      constructor(ctx, x, y, r, i) {
        this.ctx = ctx;
        this.init(x, y, r, i);
      }

      init(x, y, r, i) {
        this.x = x;
        this.xi = x;
        this.y = y;
        this.yi = y;
        this.r = r;
        this.i = i * 0.5 + 200;
        this.l = this.i;
        this.c = getHeartColor();
        this.a = new Angle(Tool.randomNumber(0, 360));
        this.v = {
          x: Math.random(),
          y: -Math.random()
        };
        this.ga = Math.random();
      }

      draw() {
        const ctx = this.ctx;
        ctx.save();
        ctx.globalCompositeOperation = params.blendMode;
        ctx.globalAlpha = this.ga;
        ctx.beginPath();
        ctx.fillStyle = this.c;
        ctx.moveTo(this.x, this.y + this.r);
        ctx.bezierCurveTo(
          this.x - this.r - this.r / 5,
          this.y + this.r / 1.5,
          this.x - this.r,
          this.y - this.r,
          this.x,
          this.y - this.r / 5
        );
        ctx.bezierCurveTo(
          this.x + this.r,
          this.y - this.r,
          this.x + this.r + this.r / 5,
          this.y + this.r / 1.5,
          this.x,
          this.y + this.r
        );
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      offRender() {
        const ctx = this.ctx;
        ctx.save();
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = 1.0;
        ctx.beginPath();
        ctx.fillStyle = '#ff0000';
        ctx.moveTo(this.x, this.y + this.r);
        ctx.bezierCurveTo(
          this.x - this.r - this.r / 5,
          this.y + this.r / 1.5,
          this.x - this.r,
          this.y - this.r,
          this.x,
          this.y - this.r / 5
        );
        ctx.bezierCurveTo(
          this.x + this.r,
          this.y - this.r,
          this.x + this.r + this.r / 5,
          this.y + this.r / 1.5,
          this.x,
          this.y + this.r
        );
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      updateParams() {
        this.a.incDec(params.pulseSpeed);
        this.r = Math.abs(Math.sin(this.a.rad)) * params.pulseMagnitude;
      }

      updatePosition() {
        this.l -= params.fadeRate;
        if (this.l < 0) {
          this.v.y += params.windY;
          this.v.x += params.windX;
          this.y += this.v.y;
          this.x += this.v.x;
        }
      }

      wrapPosition() {
        const maxX = canvas.width * 1.6;
        const minX = -canvas.width * 0.6;
        const minY = -canvas.height * 1.5;
        const maxY = canvas.height * 1.6;
        if (this.x > maxX || this.x < minX || this.y < minY || this.y > maxY || this.l < -1200) {
          this.init(this.xi, this.yi, Tool.randomNumber(params.minHeartSize, params.maxHeartSize), this.i);
        }
      }

      render() {
        this.wrapPosition();
        this.updateParams();
        this.updatePosition();
        this.draw();
      }
    }

    function setupGUI() {
      gui = new GUI({ title: 'Blowing Heart Settings' });

      const folderDisplay = gui.addFolder('Background & Greenscreen');
      controllers.greenscreen = folderDisplay.add(params, 'greenscreen').name('Greenscreen (#00ff00)').onChange((val) => {
        if (val && params.blendMode === 'lighter') {
          params.blendMode = 'source-over';
          controllers.blendMode?.updateDisplay();
        } else if (!val && params.blendMode === 'source-over') {
          params.blendMode = 'lighter';
          controllers.blendMode?.updateDisplay();
        }
      });
      controllers.bgColor = folderDisplay.addColor(params, 'bgColor').name('Background Color');
      controllers.blendMode = folderDisplay.add(params, 'blendMode', ['lighter', 'source-over', 'screen']).name('Blend Mode');

      const folderColors = gui.addFolder('Color Schemes');
      controllers.colorScheme = folderColors.add(params, 'colorScheme', COLOR_SCHEMES).name('Color Scheme').onChange(refreshColors);
      controllers.primaryColor = folderColors.addColor(params, 'primaryColor').name('Primary Color').onChange(refreshColors);
      controllers.accentColor = folderColors.addColor(params, 'accentColor').name('Accent Color').onChange(refreshColors);

      const folderTransform = gui.addFolder('Zoom & Pan');
      controllers.scale = folderTransform.add(transform, 'scale', 0.15, 8.0, 0.01).name('Zoom (Scale)').listen();
      controllers.panX = folderTransform.add(transform, 'x', -window.innerWidth * 2, window.innerWidth * 2, 1).name('Pan X').listen();
      controllers.panY = folderTransform.add(transform, 'y', -window.innerHeight * 2, window.innerHeight * 2, 1).name('Pan Y').listen();
      folderTransform.add({ reset: resetView }, 'reset').name('Reset View');

      const folderGeo = gui.addFolder('Geometry & Particles');
      controllers.heartScale = folderGeo.add(params, 'heartScale', 0.4, 2.5, 0.05).name('Heart Scale').onChange(rebuildHeartShape);
      controllers.samplingStep = folderGeo.add(params, 'samplingStep', 6, 24, 1).name('Density (Step)').onChange(rebuildHeartShape);
      controllers.minHeartSize = folderGeo.add(params, 'minHeartSize', 2, 15, 1).name('Min Particle Size');
      controllers.maxHeartSize = folderGeo.add(params, 'maxHeartSize', 8, 30, 1).name('Max Particle Size');
      controllers.pulseMagnitude = folderGeo.add(params, 'pulseMagnitude', 5, 45, 1).name('Pulse Amplitude');
      controllers.pulseSpeed = folderGeo.add(params, 'pulseSpeed', 0.2, 4.0, 0.1).name('Pulse Speed');

      const folderMotion = gui.addFolder('Motion & Wind');
      controllers.windX = folderMotion.add(params, 'windX', -0.1, 0.1, 0.002).name('Wind X (Drift)');
      controllers.windY = folderMotion.add(params, 'windY', -0.1, 0.05, 0.002).name('Wind Y (Lift)');
      controllers.fadeRate = folderMotion.add(params, 'fadeRate', 0.2, 3.0, 0.1).name('Blow Delay Rate');

      const folderProcedural = gui.addFolder('Procedural Variation');
      controllers.clickToRandomize = folderProcedural.add(params, 'clickToRandomize').name('Click Scene to Re-roll');
      folderProcedural.add({ randomize: randomizeScene }, 'randomize').name('Generate New Theme');

      let isGuiVisible = true;
      window.addEventListener('keydown', (e) => {
        if (e.key === 'h' || e.key === 'H') {
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
          isGuiVisible = !isGuiVisible;
          if (typeof gui.show === 'function' && typeof gui.hide === 'function') {
            isGuiVisible ? gui.show() : gui.hide();
          } else {
            gui.domElement.style.display = isGuiVisible ? '' : 'none';
          }
        }
      });
    }

    function setupInteractions() {
      let isDragging = false;
      let startX = 0;
      let startY = 0;
      let startTransformX = 0;
      let startTransformY = 0;
      let dragDist = 0;

      window.addEventListener('pointerdown', (e) => {
        if (e.target.closest && e.target.closest('.lil-gui')) return;
        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;
        startTransformX = transform.x;
        startTransformY = transform.y;
        dragDist = 0;
      });

      window.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        dragDist = Math.hypot(dx, dy);
        transform.x = startTransformX + dx;
        transform.y = startTransformY + dy;
      });

      window.addEventListener('pointerup', (e) => {
        if (!isDragging) return;
        isDragging = false;
        if (dragDist < 6 && (!e.target.closest || !e.target.closest('.lil-gui'))) {
          if (params.clickToRandomize) {
            randomizeScene();
          }
        }
      });

      window.addEventListener('wheel', (e) => {
        if (e.target.closest && e.target.closest('.lil-gui')) return;
        e.preventDefault();
        const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
        const mouseX = e.clientX;
        const mouseY = e.clientY;

        const newScale = Math.min(Math.max(transform.scale * zoomFactor, 0.15), 8.0);
        transform.x = mouseX - (mouseX - transform.x) * (newScale / transform.scale);
        transform.y = mouseY - (mouseY - transform.y) * (newScale / transform.scale);
        transform.scale = newScale;

        controllers.scale?.updateDisplay();
        controllers.panX?.updateDisplay();
        controllers.panY?.updateDisplay();
      }, { passive: false });
    }

    window.addEventListener("load", function () {
      offCanvas = new Canvas(false);
      canvas = new Canvas(true);

      setupGUI();
      setupInteractions();

      offCanvas.offInit();

      function render() {
        window.requestAnimationFrame(function () {
          canvas.render();
          render();
        });
      }

      render();

      window.addEventListener("resize", function () {
        canvas.resize();
        offCanvas.resize();
        offCanvas.offInit();
      }, false);
    });
  </script>
</body>
</html>
