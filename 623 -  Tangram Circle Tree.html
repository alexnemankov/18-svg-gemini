  <style>
    /* =========================================================================
       CSS RESET & FULL-VIEWPORT CANVAS UX
       ========================================================================= */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #0b0f19;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "JetBrains Mono", monospace;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      transition: background-color 0.4s ease;
    }

    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: padding 0.4s cubic-bezier(0.16, 1, 0.3, 1), background 0.4s ease;
    }

    canvas {
      display: block;
      cursor: grab;
      touch-action: none;
      outline: none;
      transition: box-shadow 0.4s ease, border-radius 0.4s ease;
    }

    body.grabbing canvas,
    canvas.grabbing {
      cursor: grabbing !important;
    }

    /* Framed Mode (4:5 Generative Art Print Presentation) */
    body.mode-framed #canvas-container {
      padding: 40px;
      background: radial-gradient(circle at 50% 50%, #151d30 0%, #060911 100%);
    }

    body.mode-framed canvas {
      border-radius: 12px;
      box-shadow: 
        0 30px 90px rgba(0, 0, 0, 0.9),
        0 12px 36px rgba(0, 0, 0, 0.7),
        0 0 0 1px rgba(255, 255, 255, 0.12),
        0 0 0 10px rgba(255, 255, 255, 0.02);
    }

    /* =========================================================================
       lil-gui CUSTOM DARK GLASSMORPHISM THEME
       ========================================================================= */
    .lil-gui.root {
      --background-color: rgba(10, 15, 26, 0.88);
      --text-color: #f1f5f9;
      --title-background-color: rgba(18, 25, 40, 0.95);
      --widget-color: rgba(30, 41, 59, 0.85);
      --hover-color: rgba(51, 65, 85, 0.9);
      --focus-color: #38bdf8;
      --number-color: #38bdf8;
      --string-color: #34d399;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "JetBrains Mono", monospace;
      --font-size: 11px;
      --folder-indent: 8px;

      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 1000;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 16px 44px rgba(0, 0, 0, 0.75);
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      transition: opacity 0.3s ease, transform 0.3s ease, pointer-events 0.3s ease;
    }

    .lil-gui .title {
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-size: 11px;
    }

    .lil-gui button {
      font-weight: 600;
      cursor: pointer;
    }

    /* Smooth UI Hiding (Triggered via 'H' key) */
    body.hidden-ui .lil-gui.root {
      opacity: 0 !important;
      transform: translateY(12px) !important;
      pointer-events: none !important;
    }

<body>

  <script>
    // =========================================================================
    // Original Challenge Description & Author Attribution:
    // For the #WCCChallenge «Tangram» (join the discord! https://discord.gg/S8c7qcjw2b)
    //
    // Packed circles with some added rotation. Packing is almost filling the canvas right? (it almost follows the theme)
    //
    // The circles check collisions with others, but they can be inside other circles. When this happens, they are linked to their parent circle, forming a tree structure.
    // For drawing them, the parent circle is drawn first, then a rotation is applied, and the children are drawn recursively
    // Add some blob noise for the circles to not be perfect, and add some filters on top of it
    // =========================================================================

    /* =========================================================================

      },

        colors: ['#0E0618', '#3D1050', '#C7501A', '#FF8C00', '#FFE8CC'],
        desc: "Twilight sunset amber over dark plum"
      },
      'Palette 7 (E8E0FF, B38FFF, 6A3DE8, 1A1250, 090612)': {
        colors: ['#090612', '#1A1250', '#6A3DE8', '#B38FFF', '#E8E0FF'],
        desc: "Cybernetic violet vaporwave radiance"
      },
      'Palette 8 (E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)': {
        colors: ['#05020F', '#1E0A3D', '#D40078', '#00F0FF', '#E0FBFF'],
        desc: "Neon synthwave cyan & magenta pulse"
      }
    };

    // Original author's collection of auxiliary palettes
    const AUTHOR_PALETTES = [
      ["#fb6107","#f3de2c","#7cb518","#5c8001","#fbb02d"],
      ["#f72585","#7209b7","#b6f500","#000000","#ffffff"],
      ["#094074","#3c6997","#5adbff","#ffdd4a","#fe9000"],
      ["#05668d","#028090","#00a896","#f0f3bd"],
      ["#3c1642","#086375","#1dd3b0","#affc41","#b2ff9e"],
      ["#e5c679","#000807","#357266","#ed6a5e","#4ce0b3","#cfa5b4","#eae8ff","#b0d7ff","#61f2c2"],
      ["#3d2d1c","#30633d","#123c69","#1d58ab","#72c0ed","#fdefc0","#ffdf7c","#feb640","#d97b38","#a46379"],
      ["#080f0f","#2c4a73","#426c85","#4e6baa","#5c59c9","#c33b1e","#f07d23","#ffcc33","#fff1a1","#f1f5f8"],
      ["#fffcf2","#ccc5b9","#403d39","#252422","#eb5e28"],
      ["#faeee0","#fec802","#f69f40","#bf5f07","#0dc9c5","#18761a"],
      ["#0a122a","#771918","#3c5a14","#ffbb33","#a53e12"],
      ["#1a535c","#4ecdc4","#f7fff7","#ff6b6b","#ffe66d"],
      ["#283d3b","#197278","#edddd4","#c44536","#772e25"],
      ["#fb6107","#f3de2c","#7cb518","#5c8001","#fbb02d"],
      ["#03045e","#023e8a","#0077b6","#0096c7","#00b4d8","#48cae4","#90e0ef","#ade8f4","#caf0f8"]
    ];

    /* =========================================================================
       APPLICATION PARAMETERS & STATE
       ========================================================================= */
    const params = {
      // 🎨 Color & Appearance
      colorScheme: 'Original',
      bgMode: 'Auto (Chroma Tuned)', // 'Auto (Chroma Tuned)', 'Dark', 'Light', 'Palette 1st Color'
      layerOpacityFalloff: 0.85,

      // 🌀 Rotation & Dynamics
      speed: 1.0,
      paused: false,
      rotationMode: 'alternating', // 'alternating', 'same', 'random', 'noise'
      baseSpeedMultiplier: 1.0,

      // ⚪ Circle Packing Geometry
      minDistance: 2.0,
      minRadius: 10,
      initialStartRadius: 300,
      radiusDecayRate: 2.0,
      growthRate: 2.0,
      newSeedInterval: 2,
      seedsPerBatch: 1,
      initialSeeds: 5,
      maxRetries: 50,
      maxConsecutiveFailures: 100,

      // 🫧 Organic Blob Distortion
      blobDistortion: 5.0,
      numAngles: 10,
      blobNoiseSpeed: 0.0,
      strokeWeight: 0,
      strokeColor: '#000000',

      // ✨ Post-Processing Shaders
      enableDotFilter: true,
      dotStrength: 0.15,
      dotSize: 8,
      skipTolerance: 0.06,

      enableBloomFilter: true,
      bloomIntensity: 0.5,
      bloomGlow: 1.5,

      // 🔍 Camera & Pan/Zoom UX
      zoom: 1.0,
      panX: 0.0,
      panY: 0.0,
      framedMode: false,

      // ⚙️ Interaction & Randomization
      clickToRandomize: true,
      hideUI: false,

      // Actions
      randomize: () => randomizeScene(),
      regenerate: () => restartSimulation(),
      resetView: () => resetCameraView(),
      savePNG: () => saveArtScreenshot()
    };

    /* =========================================================================
       CORE SIMULATION VARIABLES
       ========================================================================= */
    let circles = [];
    let currentStartRadius;
    let consecutiveFailures = 0;
    let stoppedAddingSeeds = false;
    let currentPalette = [];
    let bgColor = '#ffffff';
    let dotFilter, bloomFilter;
    let myCanvas;
    let gui;

    // Controllers map for live updates
    let controllers = {};

    /* =========================================================================
       GLSL FILTER SHADERS
       ========================================================================= */
    const dotFilterShader = `
    precision highp float;

    varying vec2 vTexCoord;
    uniform sampler2D tex0;

    uniform vec2 u_resolution;
    uniform vec2 dotSizePx;        // dot size in pixels (x,y)
    uniform float dotStrength;     // 0..1

    uniform vec3 u_skipColor;      // background color to preserve (0..1 RGB)
    uniform float u_skipTolerance; // e.g. 0.02..0.12 (depends on your palette)

    float colorDist(vec3 a, vec3 b) {
      return length(a - b);
    }

    void main() {
      vec2 uv = vTexCoord;
      vec4 base = texture2D(tex0, uv);

      // Pixel-stable dot mask
      vec2 pixel = uv * u_resolution;
      vec2 dotCoordPx  = floor(pixel / dotSizePx) * dotSizePx;
      vec2 dotCenterPx = dotCoordPx + dotSizePx * 0.5;

      vec2 d = (pixel - dotCenterPx) / (dotSizePx * 0.5);
      float dist = length(d);
      float mask = smoothstep(1.0, 0.0, dist);

      // Exclude background-like pixels to keep backdrop pristine
      float cd = colorDist(base.rgb, u_skipColor);
      float exclude = 1.0 - smoothstep(u_skipTolerance * 0.75, u_skipTolerance, cd);

      float apply = mask * (1.0 - exclude);
      float darken = 1.0 - apply * dotStrength;
      vec3 outRgb = base.rgb * darken;

      gl_FragColor = vec4(outRgb, base.a);
    }
    `;

    const bloomFilterShader = `
    precision highp float;
    varying vec2 vTexCoord;
    uniform sampler2D tex0;
    uniform vec2 canvasSize;
    uniform float intensity;
    uniform float glow;

    void main() {
      vec2 tc = vTexCoord.st;
      vec4 originalColor = texture2D(tex0, tc);
      
      vec4 blurredColor = vec4(0.0);
      float clampedGlow = clamp(glow, 0.0, 8.0);
      vec2 safeCanvasSize = max(canvasSize, vec2(1.0, 1.0));
      vec2 blurOffset = vec2(clampedGlow / safeCanvasSize.x, 0.0);
      
      for (float i = -8.0; i <= 8.0; i += 1.0) {
        vec2 offset = i * blurOffset;
        blurredColor += texture2D(tex0, vTexCoord.st + offset);
      }
      blurredColor /= 17.0;
      blurredColor *= intensity;
      
      // Screen blend mode with original
      vec4 bloom = 1.0 - (1.0 - originalColor) * (1.0 - blurredColor);
      gl_FragColor = bloom;
    }
    `;

    /* =========================================================================
       COLOR HELPER UTILITIES
       ========================================================================= */
    function hexToRgb01(hex) {
      if (!hex) return [0.1, 0.1, 0.1];
      const h = hex.replace('#', '').slice(0, 6);
      const r = parseInt(h.slice(0, 2), 16) / 255;
      const g = parseInt(h.slice(2, 4), 16) / 255;
      const b = parseInt(h.slice(4, 6), 16) / 255;
      return [isNaN(r) ? 0 : r, isNaN(g) ? 0 : g, isNaN(b) ? 0 : b];
    }

    function updateColorsAndBackdrop() {
      const scheme = COLOR_SCHEMES[params.colorScheme];
      if (params.colorScheme === 'Original') {
        currentPalette = scheme ? scheme.colors.slice() : AUTHOR_PALETTES[0].slice();
      } else if (scheme) {
        currentPalette = scheme.colors.slice();
      } else {
        currentPalette = AUTHOR_PALETTES[0].slice();
      }

      // Compute background color
      if (params.bgMode === 'Auto (Chroma Tuned)') {
        let sample = currentPalette[0] || '#333333';
        if (params.colorScheme === 'Achromatic') {
          bgColor = '#111111';
        } else if (params.colorScheme === 'Achromatic + Accent') {
          bgColor = '#0a0a0a';
        } else if (params.colorScheme === 'Neutral + accent') {
          bgColor = '#181615';
        } else {
          try {
            bgColor = chroma(sample).desaturate(0.5).brighten(0.5).hex();
          } catch (e) {
            bgColor = '#222222';
          }
        }
      } else if (params.bgMode === 'Dark') {
        bgColor = '#0a0d14';
      } else if (params.bgMode === 'Light') {
        bgColor = '#f4f5f8';
      } else if (params.bgMode === 'Palette 1st Color') {
        bgColor = currentPalette[0] || '#111111';
      }

      // Update shader skip uniform
      if (dotFilter) {
        dotFilter.setUniform("u_skipColor", hexToRgb01(bgColor));
      }

      // Synchronize body background for seamless presentation
      document.body.style.backgroundColor = bgColor;

      // Re-tint active or completed circles with new palette
      for (let c of circles) {
        if (c.baseColor) {
          assignColor(c);
        }
      }
    }

    /* =========================================================================
       p5.js LIFECYCLE: SETUP & INITIALIZATION
       ========================================================================= */
    function setup() {
      const container = document.getElementById('canvas-container');
      const w = windowWidth;
      const h = windowHeight;

      myCanvas = createCanvas(w, h);
      myCanvas.parent(container);
      pixelDensity(Math.min(window.devicePixelRatio || 1, 2));

      // Pick initial palette & rotation mode
      params.rotationMode = random(["alternating", "same", "random", "noise"]);
      updateColorsAndBackdrop();

      // Instantiate Filter Shaders
      try {
        dotFilter = createFilterShader(dotFilterShader);
        dotFilter.setUniform("u_resolution", [width, height]);
        dotFilter.setUniform("dotSizePx", [params.dotSize, params.dotSize]);
        dotFilter.setUniform("dotStrength", params.dotStrength);
        dotFilter.setUniform("u_skipColor", hexToRgb01(bgColor));
        dotFilter.setUniform("u_skipTolerance", params.skipTolerance);
      } catch (err) {
        console.warn("Dot filter shader initialization notice:", err);
      }

      try {
        bloomFilter = createFilterShader(bloomFilterShader);
        bloomFilter.setUniform("canvasSize", [width, height]);
        bloomFilter.setUniform("intensity", params.bloomIntensity);
        bloomFilter.setUniform("glow", params.bloomGlow);
      } catch (err) {
        console.warn("Bloom filter shader initialization notice:", err);
      }

      // Initialize simulation circles
      restartSimulation();

      // Build Interactive GUI Controls & Setup Pan/Zoom Handlers
      buildGuiControls();
      setupPanAndZoomEvents(myCanvas.elt);
    }

    /* =========================================================================
       SIMULATION ENGINE: SEEDING, TREE FORMATION & PACKING
       ========================================================================= */
    function restartSimulation() {
      circles = [];
      consecutiveFailures = 0;
      stoppedAddingSeeds = false;

      // Adapt initial radius to screen dimensions
      const minDim = Math.min(width, height);
      currentStartRadius = Math.min(params.initialStartRadius, minDim * 0.42);

      for (let i = 0; i < params.initialSeeds; i++) {
        addSeed();
      }
    }

    function addSeed() {
      let retries = 0;
      let validPosition = false;
      let x, y;

      let minX = currentStartRadius;
      let maxX = width - currentStartRadius;
      let minY = currentStartRadius;
      let maxY = height - currentStartRadius;

      if (maxX < minX || maxY < minY) {
        return false;
      }

      while (retries < params.maxRetries && !validPosition) {
        x = random(minX, maxX);
        y = random(minY, maxY);

        validPosition = true;
        for (let c of circles) {
          let d = dist(x, y, c.x, c.y);
          if (!isValidCircleDistance(currentStartRadius, c.radius, d)) {
            validPosition = false;
            break;
          }
        }
        retries++;
      }

      if (validPosition) {
        let layerInfo = calculateLayer(x, y, currentStartRadius);
        let circleBaseSpeed = random(0.05, 0.3) * params.baseSpeedMultiplier;
        let rotSpeed = calculateRotationSpeed(layerInfo.layer, x, y, circleBaseSpeed);

        let newCircle = {
          x: x,
          y: y,
          radius: currentStartRadius,
          active: true,
          color: null,
          baseColor: null,
          layer: layerInfo.layer,
          parent: layerInfo.parent,
          children: [],
          rotationAngle: 0,
          rotationSpeed: rotSpeed,
          baseRotationSpeed: circleBaseSpeed,
          seed: random(1000),
          hachureAngle: random(0, 360),
          hachureGap: random(3, 5)
        };

        if (layerInfo.parent) {
          layerInfo.parent.children.push(newCircle);
        }

        circles.push(newCircle);
        return true;
      }

      return false;
    }

    function calculateLayer(x, y, radius) {
      let maxLayer = -1;
      let parent = null;

      for (let c of circles) {
        let d = dist(x, y, c.x, c.y);
        // If candidate circle is strictly nested within existing circle
        if (d + radius < c.radius) {
          if (c.layer > maxLayer) {
            maxLayer = c.layer;
            parent = c;
          }
        }
      }

      return {
        layer: maxLayer + 1,
        parent: parent
      };
    }

    function calculateRotationSpeed(layer, x, y, circleBaseSpeed) {
      let speedMultiplier = (10 - layer) / 3;
      let direction = 1;

      switch (params.rotationMode) {
        case "alternating":
          direction = layer % 2 === 0 ? 1 : -1;
          break;
        case "same":
          direction = 1;
          break;
        case "random":
          direction = random() > 0.5 ? 1 : -1;
          break;
        case "noise":
          direction = noise(x * 0.01, y * 0.01) > 0.5 ? 1 : -1;
          break;
        default:
          direction = layer % 2 === 0 ? 1 : -1;
      }

      return circleBaseSpeed * speedMultiplier * direction;
    }

    function growCircle(c) {
      if (
        c.x - c.radius <= 0 ||
        c.x + c.radius >= width ||
        c.y - c.radius <= 0 ||
        c.y + c.radius >= height
      ) {
        c.active = false;
        assignColor(c);
        return;
      }

      let newRadius = c.radius + params.growthRate;

      for (let other of circles) {
        if (other === c) continue;

        let d = dist(c.x, c.y, other.x, other.y);
        if (!isValidCircleDistance(newRadius, other.radius, d)) {
          c.active = false;
          assignColor(c);
          return;
        }
      }

      c.radius = newRadius;
    }

    function isValidCircleDistance(r1, r2, d) {
      let rLarge = max(r1, r2);
      let rSmall = min(r1, r2);

      if (d + rSmall < rLarge) {
        let gap = rLarge - d - rSmall;
        return gap >= params.minDistance;
      } else if (d >= rLarge + rSmall) {
        let gap = d - rLarge - rSmall;
        return gap >= params.minDistance;
      } else {
        return false;
      }
    }

    function getCircleGap(r1, r2, d) {
      let rLarge = max(r1, r2);
      let rSmall = min(r1, r2);

      if (d + rSmall < rLarge) {
        return rLarge - d - rSmall;
      } else if (d >= rLarge + rSmall) {
        return d - rLarge - rSmall;
      } else {
        return 0;
      }
    }

    function assignColor(c) {
      let touchingColors = new Set();
      for (let other of circles) {
        if (other === c || !other.baseColor) continue;

        let d = dist(c.x, c.y, other.x, other.y);
        let gap = getCircleGap(c.radius, other.radius, d);

        if (abs(gap - params.minDistance) < 2) {
          touchingColors.add(other.baseColor);
        }
      }

      if (c.parent && c.parent.baseColor) {
        touchingColors.add(c.parent.baseColor);
      }

      let availableColors = currentPalette.filter((color) => !touchingColors.has(color));

      if (availableColors.length > 0) {
        c.baseColor = random(availableColors);
      } else {
        c.baseColor = random(currentPalette);
      }

      let minOpacity = Math.round(160 * params.layerOpacityFalloff);
      let opacity = round(map(c.layer, 0, 6, 255, minOpacity, true));
      let opacityHex = opacity.toString(16).padStart(2, "0");
      c.color = c.baseColor.slice(0, 7) + opacityHex;
    }

    function updateRotations() {
      if (params.paused || params.speed === 0) return;
      for (let c of circles) {
        if (c.children.length > 0) {
          c.rotationAngle += c.rotationSpeed * params.speed;
        }
      }
    }

    /* =========================================================================
       p5.js DRAW LOOP: SIMULATION, RECURSIVE RENDERING & POST-PROCESSING
       ========================================================================= */
    function draw() {
      background(bgColor);

      // Simulation stepping (only when not paused)
      if (!params.paused) {
        if (currentStartRadius > params.minRadius) {
          currentStartRadius = max(params.minRadius, currentStartRadius - params.radiusDecayRate);
        }

        for (let c of circles) {
          if (c.active) {
            growCircle(c);
          }
        }

        if (!stoppedAddingSeeds && frameCount % params.newSeedInterval === 0) {
          for (let i = 0; i < params.seedsPerBatch; i++) {
            let success = addSeed();
            if (success) {
              consecutiveFailures = 0;
            } else {
              consecutiveFailures++;
              if (consecutiveFailures >= params.maxConsecutiveFailures) {
                stoppedAddingSeeds = true;
                break;
              }
            }
          }
        }
      }

      // Update orbital rotation kinematics
      updateRotations();

      // Camera Viewport Matrix (Smooth Pan & Zoom)
      push();
      translate(width / 2 + params.panX, height / 2 + params.panY);
      scale(params.zoom);
      translate(-width / 2, -height / 2);

      // Render root tree nodes recursively
      for (let c of circles) {
        if (c.parent === null) {
          drawCircleRecursive(c);
        }
      }
      pop();

      // Post-Processing Shaders
      if (params.enableDotFilter && dotFilter) {
        dotFilter.setUniform("u_resolution", [width, height]);
        dotFilter.setUniform("dotSizePx", [params.dotSize, params.dotSize]);
        dotFilter.setUniform("dotStrength", params.dotStrength);
        dotFilter.setUniform("u_skipColor", hexToRgb01(bgColor));
        dotFilter.setUniform("u_skipTolerance", params.skipTolerance);
        filter(dotFilter);
      }

      if (params.enableBloomFilter && bloomFilter) {
        bloomFilter.setUniform("canvasSize", [width, height]);
        bloomFilter.setUniform("intensity", params.bloomIntensity);
        bloomFilter.setUniform("glow", params.bloomGlow);
        filter(bloomFilter);
      }
    }

    /* =========================================================================
       RECURSIVE GRAPHICS RENDERING & PERLIN NOISE BLOB GEOMETRY
       ========================================================================= */
    function drawCircleRecursive(c, parent = null) {
      let tx = parent ? c.x - parent.x : c.x;
      let ty = parent ? c.y - parent.y : c.y;

      push();
      translate(tx, ty);
      rotate(radians(c.rotationAngle));

      if (c.color) {
        fill(c.color);
      } else {
        noFill();
      }

      if (params.strokeWeight > 0) {
        stroke(params.strokeColor);
        strokeWeight(params.strokeWeight);
      } else {
        noStroke();
      }

      drawBlobCircle(c);

      // Draw all child nodes in parent's rotating frame of reference
      for (let child of c.children) {
        drawCircleRecursive(child, c);
      }

      pop();
    }

    function drawBlobCircle(c) {
      let numAngles = Math.max(6, Math.round(params.numAngles));
      let distortion = params.blobDistortion;

      beginShape();
      for (let i = 0; i < numAngles; i++) {
        let baseAngle = (i * TAU) / numAngles;
        let angleWobble = map(noise(i, c.x, c.y), 0, 1, -0.1, 0.1);
        let angle = baseAngle + angleWobble;

        let noiseX = map(noise(c.x, c.y, angle), 0, 1, -distortion, distortion);
        let noiseY = map(noise(c.y, c.x, angle), 0, 1, -distortion, distortion);

        let x = c.radius * cos(angle) + noiseX;
        let y = c.radius * sin(angle) + noiseY;
        splineVertex(x, y);
      }
      endShape(CLOSE);
    }

    /* =========================================================================
       INTERACTIVE PAN & ZOOM (MOUSE WHEEL, DRAGGING & TOUCH PINCH)
       ========================================================================= */
    function setupPanAndZoomEvents(canvasElt) {
      let isDragging = false;
      let startX = 0, startY = 0;
      let initialPanX = 0, initialPanY = 0;
      let movedDistance = 0;
      let lastTouchDist = 0;

      // Mouse Wheel Zoom centered on cursor
      canvasElt.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomDelta = e.deltaY < 0 ? 1.09 : 0.91;
        const newZoom = Math.min(Math.max(params.zoom * zoomDelta, 0.15), 12.0);

        const rect = canvasElt.getBoundingClientRect();
        const mouseScreenX = e.clientX - rect.left;
        const mouseScreenY = e.clientY - rect.top;

        // Screen to World coords
        const wx = (mouseScreenX - (width / 2 + params.panX)) / params.zoom;
        const wy = (mouseScreenY - (height / 2 + params.panY)) / params.zoom;

        params.zoom = newZoom;
        params.panX = mouseScreenX - width / 2 - wx * params.zoom;
        params.panY = mouseScreenY - height / 2 - wy * params.zoom;

        if (controllers.zoom) controllers.zoom.updateDisplay();
        if (controllers.panX) controllers.panX.updateDisplay();
        if (controllers.panY) controllers.panY.updateDisplay();
      }, { passive: false });

      // Pointer / Mouse Drag Events
      canvasElt.addEventListener('pointerdown', (e) => {
        // Only primary mouse button or touch
        if (e.button !== 0 && e.pointerType === 'mouse') return;
        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;
        initialPanX = params.panX;
        initialPanY = params.panY;
        movedDistance = 0;
        canvasElt.setPointerCapture(e.pointerId);
      });

      canvasElt.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        movedDistance = Math.hypot(dx, dy);

        if (movedDistance > 5) {
          canvasElt.classList.add('grabbing');
          document.body.classList.add('grabbing');
        }

        params.panX = initialPanX + dx;
        params.panY = initialPanY + dy;

        if (controllers.panX) controllers.panX.updateDisplay();
        if (controllers.panY) controllers.panY.updateDisplay();
      });

      const handlePointerUp = (e) => {
        if (!isDragging) return;
        isDragging = false;
        canvasElt.classList.remove('grabbing');
        document.body.classList.remove('grabbing');

        // Clean Click (not a drag): Trigger procedural variation if enabled
        if (movedDistance < 6) {
          if (params.clickToRandomize) {
            randomizeScene();
          }
        }
      };

      canvasElt.addEventListener('pointerup', handlePointerUp);
      canvasElt.addEventListener('pointercancel', handlePointerUp);

      // Touch Pinch-to-Zoom Support
      canvasElt.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          lastTouchDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
        }
      }, { passive: true });

      canvasElt.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2) {
          const distCurrent = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          if (lastTouchDist > 0) {
            const factor = distCurrent / lastTouchDist;
            params.zoom = Math.min(Math.max(params.zoom * factor, 0.15), 12.0);
            if (controllers.zoom) controllers.zoom.updateDisplay();
          }
          lastTouchDist = distCurrent;
        }
      }, { passive: true });

      canvasElt.addEventListener('touchend', () => {
        lastTouchDist = 0;
      }, { passive: true });
    }

    function resetCameraView() {
      params.zoom = 1.0;
      params.panX = 0.0;
      params.panY = 0.0;
      if (controllers.zoom) controllers.zoom.updateDisplay();
      if (controllers.panX) controllers.panX.updateDisplay();
      if (controllers.panY) controllers.panY.updateDisplay();
    }

    /* =========================================================================
       PROCEDURAL RANDOMIZATION & PARAMETER RE-ROLLING
       ========================================================================= */
    function randomizeScene() {
      // 1. Pick a fresh color scheme from the 19 schemes
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      params.colorScheme = random(schemeKeys);
      params.rotationMode = random(["alternating", "same", "random", "noise"]);

      // 2. Re-roll geometric and motion parameters
      params.speed = random([0.6, 0.8, 1.0, 1.25, 1.5, 1.8]);
      params.initialStartRadius = Math.round(random(200, 380));
      params.minRadius = Math.round(random(6, 16));
      params.growthRate = Number(random(1.5, 3.5).toFixed(1));
      params.radiusDecayRate = Number(random(1.2, 3.0).toFixed(1));
      params.blobDistortion = Number(random(2.0, 8.5).toFixed(1));
      params.numAngles = Math.round(random(8, 16));

      // 3. Post-processing variations
      params.dotStrength = Number(random(0.08, 0.22).toFixed(2));
      params.dotSize = random([6, 8, 10, 12]);
      params.bloomIntensity = Number(random(0.35, 0.75).toFixed(2));
      params.bloomGlow = Number(random(1.0, 2.5).toFixed(1));

      // 4. Update colors & background
      updateColorsAndBackdrop();

      // 5. Update lil-gui controls visually
      if (gui) {
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      }

      // 6. Restart packing with fresh seeds
      restartSimulation();
    }

    function saveArtScreenshot() {
      saveCanvas(myCanvas, `tangram-tree-${params.colorScheme.toLowerCase().replace(/[^a-z0-9]+/g, '-')}`, 'png');
    }

    /* =========================================================================
       WINDOW RESIZE HANDLING
       ========================================================================= */
    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
      if (dotFilter) {
        dotFilter.setUniform("u_resolution", [width, height]);
      }
      if (bloomFilter) {
        bloomFilter.setUniform("canvasSize", [width, height]);
      }
    }

    /* =========================================================================
       KEYBOARD SHORTCUTS (H, SPACEBAR, R, P, S)
       ========================================================================= */
    window.addEventListener('keydown', (e) => {
      // Ignore if typing inside GUI input fields
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) return;

      const key = e.key.toLowerCase();

      // 'H' key: Toggle GUI visibility
      if (key === 'h') {
        params.hideUI = !params.hideUI;
        document.body.classList.toggle('hidden-ui', params.hideUI);
        if (controllers.hideUI) controllers.hideUI.updateDisplay();
      }

      // Spacebar: Reseed / Regenerate simulation
      if (e.code === 'Space' || key === ' ') {
        e.preventDefault();
        restartSimulation();
      }

      // 'R' key: Randomize theme & parameters
      if (key === 'r') {
        randomizeScene();
      }

      // 'P' key: Toggle pause / play
      if (key === 'p') {
        params.paused = !params.paused;
        if (controllers.paused) controllers.paused.updateDisplay();
      }

      // 'S' key: Save high-res screenshot
      if (key === 's') {
        saveArtScreenshot();
      }

      // '0' key: Reset Pan & Zoom
      if (key === '0') {
        resetCameraView();
      }
    });

    /* =========================================================================
       lil-gui INTERACTIVE DASHBOARD CONFIGURATION
       ========================================================================= */
    function buildGuiControls() {
      gui = new lil.GUI({ title: 'Tangram Circle Tree' });

      // 🎨 Color & Tone Folder
      const fColor = gui.addFolder('🎨 Color & Theme');
      controllers.colorScheme = fColor.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES))
        .name('Palette')
        .onChange(() => updateColorsAndBackdrop());

      controllers.bgMode = fColor.add(params, 'bgMode', ['Auto (Chroma Tuned)', 'Dark', 'Light', 'Palette 1st Color'])
        .name('Background')
        .onChange(() => updateColorsAndBackdrop());

      controllers.layerOpacityFalloff = fColor.add(params, 'layerOpacityFalloff', 0.2, 1.0, 0.05)
        .name('Depth Opacity')
        .onChange(() => {
          for (let c of circles) assignColor(c);
        });

      // 🌀 Rotation & Dynamics Folder
      const fMotion = gui.addFolder('🌀 Motion & Kinematics');
      controllers.speed = fMotion.add(params, 'speed', -3.0, 5.0, 0.1).name('Anim Speed');
      controllers.paused = fMotion.add(params, 'paused').name('Pause Motion');
      controllers.rotationMode = fMotion.add(params, 'rotationMode', ['alternating', 'same', 'random', 'noise'])
        .name('Rotation Mode')
        .onChange(() => {
          for (let c of circles) {
            c.rotationSpeed = calculateRotationSpeed(c.layer, c.x, c.y, c.baseRotationSpeed);
          }
        });
      controllers.baseSpeedMultiplier = fMotion.add(params, 'baseSpeedMultiplier', 0.1, 4.0, 0.1)
        .name('Base Speed')
        .onChange(() => {
          for (let c of circles) {
            c.rotationSpeed = calculateRotationSpeed(c.layer, c.x, c.y, c.baseRotationSpeed * params.baseSpeedMultiplier);
          }
        });

      // ⚪ Packing & Growth Folder
      const fPacking = gui.addFolder('⚪ Circle Packing');
      controllers.initialStartRadius = fPacking.add(params, 'initialStartRadius', 80, 500, 10).name('Start Radius');
      controllers.minRadius = fPacking.add(params, 'minRadius', 4, 40, 1).name('Min Radius');
      controllers.growthRate = fPacking.add(params, 'growthRate', 0.5, 6.0, 0.5).name('Growth Rate');
      controllers.radiusDecayRate = fPacking.add(params, 'radiusDecayRate', 0.5, 6.0, 0.5).name('Decay Rate');
      controllers.minDistance = fPacking.add(params, 'minDistance', 0, 10, 0.5).name('Min Distance');
      controllers.initialSeeds = fPacking.add(params, 'initialSeeds', 1, 15, 1).name('Initial Seeds');
      controllers.newSeedInterval = fPacking.add(params, 'newSeedInterval', 1, 8, 1).name('Seed Interval');

      // 🫧 Blob Geometry & Styling
      const fGeometry = gui.addFolder('🫧 Blob Geometry');
      controllers.blobDistortion = fGeometry.add(params, 'blobDistortion', 0.0, 20.0, 0.5).name('Noise Distortion');
      controllers.numAngles = fGeometry.add(params, 'numAngles', 6, 32, 1).name('Spline Vertices');
      controllers.strokeWeight = fGeometry.add(params, 'strokeWeight', 0, 5, 0.5).name('Outline Width');
      controllers.strokeColor = fGeometry.addColor(params, 'strokeColor').name('Outline Color');

      // ✨ Post-Processing Shaders
      const fShaders = gui.addFolder('✨ Shader Filters');
      controllers.enableDotFilter = fShaders.add(params, 'enableDotFilter').name('Halftone Dots');
      controllers.dotStrength = fShaders.add(params, 'dotStrength', 0.0, 0.6, 0.01).name('Dot Intensity');
      controllers.dotSize = fShaders.add(params, 'dotSize', 2, 24, 1).name('Dot Size');
      controllers.skipTolerance = fShaders.add(params, 'skipTolerance', 0.01, 0.2, 0.01).name('Skip Tolerance');

      controllers.enableBloomFilter = fShaders.add(params, 'enableBloomFilter').name('Bloom Glow');
      controllers.bloomIntensity = fShaders.add(params, 'bloomIntensity', 0.0, 2.0, 0.05).name('Glow Intensity');
      controllers.bloomGlow = fShaders.add(params, 'bloomGlow', 0.0, 6.0, 0.1).name('Glow Spread');

      // 🔍 Camera & Pan/Zoom
      const fCamera = gui.addFolder('🔍 Camera & Viewport');
      controllers.zoom = fCamera.add(params, 'zoom', 0.2, 8.0, 0.05).name('Zoom Level');
      controllers.panX = fCamera.add(params, 'panX', -1500, 1500, 5).name('Pan X');
      controllers.panY = fCamera.add(params, 'panY', -1500, 1500, 5).name('Pan Y');
      controllers.framedMode = fCamera.add(params, 'framedMode')
        .name('Framed Print Mode')
        .onChange(v => document.body.classList.toggle('mode-framed', v));
      fCamera.add(params, 'resetView').name('Reset Camera (0)');

      // ⚙️ Behavior & Actions
      const fBehavior = gui.addFolder('⚙️ Interaction & Actions');
      controllers.clickToRandomize = fBehavior.add(params, 'clickToRandomize').name('Click to Randomize');
      controllers.hideUI = fBehavior.add(params, 'hideUI')
        .name('Hide UI (Press H)')
        .onChange(v => document.body.classList.toggle('hidden-ui', v));

      gui.add(params, 'randomize').name('🎲 Randomize All (R)');
      gui.add(params, 'regenerate').name('🔄 Reseed Packing (Space)');
      gui.add(params, 'savePNG').name('📸 Save PNG (S)');

      // Open primary folders by default
      fColor.open();
      fMotion.open();
    }
  </script>
