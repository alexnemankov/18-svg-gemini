<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebGL Collection - 195</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #050508;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    .collection {
      position: fixed;
      bottom: 20px;
      right: 20px;
      margin: 0;
      z-index: 10;
      font-family: sans-serif;
    }
    .collection a {
      color: #fff;
      text-decoration: none;
      background: rgba(0, 0, 0, 0.6);
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <p class="collection">
    <a href="https://codepen.io/collection/AGZywR" target="_blank">WebGL Collection</a>
  </p>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chroma-js/2.4.2/chroma.min.js"></script>

  <script type="module">
    import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

    function App() {
      const COLOR_SCHEMES = {
        'Vibrant Rainbow': ['#2175D8', '#DC5DCE', '#CC223D', '#F07414', '#FDEE61', '#74C425'],
        'Cyberpunk Neon': ['#00f0ff', '#ff0077', '#7000ff', '#ff00b7', '#00ff66'],
        'Golden Sunset': ['#2b0038', '#8b005d', '#ff0055', '#ff5500', '#ffcc00'],
        'Ocean Aurora': ['#051923', '#003554', '#006494', '#0582ca', '#00a6fb', '#57cc99'],
        'Toxic Emerald': ['#0a2e1d', '#006400', '#00e676', '#a3ff00', '#ffff00']
      };

      const conf = {
        nx: 40,
        ny: 100,
        colorScheme: 'Vibrant Rainbow',
        darken: -1,
        angle: Math.PI / 3,
        timeCoef: 0.1,
        speed: 1.0,
        animPreset: 'Smooth Flow',
        greenscreen: false,
        bgColor: '#050508',
        dpr: Math.min(window.devicePixelRatio || 1, 2),
        zoom: 1.0,
        panX: 0,
        panY: 0
      };

      let renderer, scene, camera;
      let width, height;
      let gui;
      const { randFloat: rnd } = THREE.MathUtils || THREE.Math;

      const uTime = { value: 0 };
      const uTimeCoef = { value: conf.timeCoef };
      const uZoom = { value: conf.zoom };
      const uPan = { value: new THREE.Vector2(conf.panX, conf.panY) };
      const uAnimMode = { value: 1.0 }; // 0: static, 1: smooth, 2: pulse, 3: ripple, 4: warp

      const polylines = [];
      const meshes = [];

      init();

      function init() {
        renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas'), antialias: true });
        renderer.setPixelRatio(conf.dpr);
        camera = new THREE.PerspectiveCamera();

        updateSize();
        window.addEventListener('resize', updateSize, false);

        conf.cscale = chroma.scale(COLOR_SCHEMES[conf.colorScheme]).mode('lch');

        initScene();
        setupControls();
        setupGUI();

        requestAnimationFrame(animate);
      }

      function initScene() {
        scene = new THREE.Scene();
        updateBackground();

        const vertexShader = `
          uniform float uTime, uTimeCoef;
          uniform float uSize;
          uniform mat2 uMat2;
          uniform vec3 uRnd1;
          uniform vec3 uRnd2;
          uniform vec3 uRnd3;
          uniform vec3 uRnd4;
          uniform vec3 uRnd5;
          uniform float uZoom;
          uniform vec2 uPan;
          uniform float uAnimMode;

          attribute vec3 next, prev; 
          attribute float side;
          varying vec2 vUv;

          vec2 dp(vec2 sv) {
            return (1.5 * sv * uMat2);
          }

          void main() {
            vUv = uv;

            vec2 pos = dp(position.xy);

            vec2 normal = dp(vec2(1, 0));
            normal *= uSize;

            float time = uTime * uTimeCoef;
            
            // Animation mode variations
            if (uAnimMode == 0.0) {
              time = 0.0; // Static mode
            }

            vec3 rnd1 = vec3(cos(time * uRnd1.x + uRnd3.x), cos(time * uRnd1.y + uRnd3.y), cos(time * uRnd1.z + uRnd3.z));
            vec3 rnd2 = vec3(cos(time * uRnd2.x + uRnd4.x), cos(time * uRnd2.y + uRnd4.y), cos(time * uRnd2.z + uRnd4.z));

            float waveMult = 1.0;
            if (uAnimMode == 2.0) { // Deep Pulse
              waveMult = 1.0 + 0.35 * sin(time * 2.0);
            } else if (uAnimMode == 3.0) { // Quantum Ripple
              waveMult = 1.0 + 0.25 * cos(position.x * 10.0 + time * 3.0);
            } else if (uAnimMode == 4.0) { // Cosmic Warp
              waveMult = 1.0 + 0.4 * sin(position.y * 15.0 - time * 1.5);
            }

            normal *= (1.0
              + uRnd5.x * (cos((position.y + rnd1.x) * 20.0 * rnd1.y) + 1.0)
              + uRnd5.y * (sin((position.y + rnd2.x) * 20.0 * rnd2.y) + 1.0)
              + uRnd5.z * (cos((position.y + rnd1.z) * 20.0 * rnd2.z) + 1.0)) * waveMult;

            pos.xy -= normal * side;

            // Apply Zoom and Pan transforms
            pos.xy = (pos.xy * uZoom) + uPan;

            gl_Position = vec4(pos, 0.0, 1.0);
          }
        `;

        const fragmentShader = `
          uniform vec3 uColor1;
          uniform vec3 uColor2;
          varying vec2 vUv;
          void main() {
            gl_FragColor = vec4(mix(uColor1, uColor2, vUv.x), 1.0);
          }
        `;

        const dx = 2 / (conf.nx), dy = -2 / (conf.ny - 1);
        const ox = -1 + dx / 2, oy = 1;
        const mat2 = Float32Array.from([Math.cos(conf.angle), -Math.sin(conf.angle), Math.sin(conf.angle), Math.cos(conf.angle)]);

        polylines.length = 0;
        meshes.length = 0;

        for (let i = 0; i < conf.nx; i++) {
          const points = [];
          for (let j = 0; j < conf.ny; j++) {
            const x = ox + i * dx, y = oy + j * dy;
            points.push(new THREE.Vector3(x, y, 0));
          }
          const polyline = new Polyline({ points });
          polylines.push(polyline);

          const material = new THREE.ShaderMaterial({
            uniforms: {
              uTime,
              uTimeCoef,
              uZoom,
              uPan,
              uAnimMode,
              uMat2: { value: mat2 },
              uSize: { value: 1.5 / conf.nx },
              uRnd1: { value: new THREE.Vector3(rnd(-1, 1), rnd(-1, 1), rnd(-1, 1)) },
              uRnd2: { value: new THREE.Vector3(rnd(-1, 1), rnd(-1, 1), rnd(-1, 1)) },
              uRnd3: { value: new THREE.Vector3(rnd(-1, 1), rnd(-1, 1), rnd(-1, 1)) },
              uRnd4: { value: new THREE.Vector3(rnd(-1, 1), rnd(-1, 1), rnd(-1, 1)) },
              uRnd5: { value: new THREE.Vector3(rnd(0.2, 0.5), rnd(0.3, 0.6), rnd(0.4, 0.7)) },
              uColor1: { value: new THREE.Color(conf.cscale(i / conf.nx).hex()) },
              uColor2: { value: new THREE.Color(conf.cscale(i / conf.nx).darken(conf.darken).hex()) }
            },
            vertexShader,
            fragmentShader
          });
          const mesh = new THREE.Mesh(polyline.geometry, material);
          scene.add(mesh);
          meshes.push(mesh);
        }
      }

      function updateBackground() {
        if (conf.greenscreen) {
          renderer.setClearColor(0x00ff00, 1.0);
          document.body.style.backgroundColor = '#00ff00';
        } else {
          renderer.setClearColor(new THREE.Color(conf.bgColor), 1.0);
          document.body.style.backgroundColor = conf.bgColor;
        }
      }

      function updateColors() {
        conf.cscale = chroma.scale(COLOR_SCHEMES[conf.colorScheme]).mode('lch');
        for (let i = 0; i < meshes.length; i++) {
          const mat = meshes[i].material;
          mat.uniforms.uColor1.value.set(conf.cscale(i / conf.nx).hex());
          mat.uniforms.uColor2.value.set(conf.cscale(i / conf.nx).darken(conf.darken).hex());
        }
      }

      function setupControls() {
        // Zoom with Mouse Wheel
        window.addEventListener('wheel', (e) => {
          e.preventDefault();
          const factor = e.deltaY < 0 ? 1.08 : 0.92;
          conf.zoom = Math.max(0.2, Math.min(8.0, conf.zoom * factor));
          uZoom.value = conf.zoom;
        }, { passive: false });

        // Drag Object across Screen
        let isDragging = false;
        let prevMouse = { x: 0, y: 0 };

        window.addEventListener('pointerdown', (e) => {
          if (e.target.closest('.lil-gui')) return;
          isDragging = true;
          prevMouse = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('pointermove', (e) => {
          if (!isDragging) return;
          const dx = (e.clientX - prevMouse.x) / window.innerWidth * 2;
          const dy = -(e.clientY - prevMouse.y) / window.innerHeight * 2;
          conf.panX += dx;
          conf.panY += dy;
          uPan.value.set(conf.panX, conf.panY);
          prevMouse = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('pointerup', () => { isDragging = false; });
        window.addEventListener('pointercancel', () => { isDragging = false; });

        // Toggle UI with "H" key
        window.addEventListener('keydown', (e) => {
          if (e.key === 'h' || e.key === 'H') {
            if (gui) {
              gui._hidden ? gui.show() : gui.hide();
            }
          }
        });
      }

      function setupGUI() {
        gui = new GUI({ title: 'Settings' });

        // Color & Palette Controls
        const fColor = gui.addFolder('Colors');
        fColor.add(conf, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Color Scheme').onChange(updateColors);
        fColor.add(conf, 'greenscreen').name('Greenscreen (#00ff00)').onChange(updateBackground);
        fColor.addColor(conf, 'bgColor').name('Background Color').onChange(updateBackground);

        // Animation Controls
        const fAnim = gui.addFolder('Animation');
        const animPresets = {
          'Static': 0.0,
          'Smooth Flow': 1.0,
          'Deep Pulse': 2.0,
          'Quantum Ripple': 3.0,
          'Cosmic Warp': 4.0
        };

        fAnim.add(conf, 'animPreset', Object.keys(animPresets)).name('Preset').onChange((val) => {
          uAnimMode.value = animPresets[val];
        });
        fAnim.add(conf, 'speed', 0.0, 3.0, 0.1).name('Speed');

        // View & Render Controls
        const fRender = gui.addFolder('Render & View');
        fRender.add(conf, 'dpr', 0.5, 3.0, 0.25).name('Pixel Ratio (DPR)').onChange((val) => {
          renderer.setPixelRatio(val);
        });
        fRender.add(conf, 'zoom', 0.2, 5.0, 0.05).name('Zoom').listen().onChange((val) => {
          uZoom.value = val;
        });
        
        const resetView = { reset: () => {
          conf.zoom = 1.0;
          conf.panX = 0;
          conf.panY = 0;
          uZoom.value = 1.0;
          uPan.value.set(0, 0);
        }};
        fRender.add(resetView, 'reset').name('Reset View / Drag');
      }

      let lastTime = 0;
      let accumulatedTime = 0;

      function animate(t) {
        const delta = (t - lastTime) * 0.001;
        lastTime = t;

        if (conf.animPreset !== 'Static') {
          accumulatedTime += delta * conf.speed;
        }
        uTime.value = accumulatedTime;
        uTimeCoef.value = conf.timeCoef;

        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      }

      function updateSize() {
        width = window.innerWidth;
        height = window.innerHeight;
        renderer.setSize(width, height);
      }
    }

    // Polyline class adapted from OGL
    const Polyline = (function () {
      const tmp = new THREE.Vector3();

      class Polyline {
        constructor(params) {
          const { points } = params;
          this.points = points;
          this.count = points.length;
          this.init();
          this.updateGeometry();
        }

        init() {
          this.geometry = new THREE.BufferGeometry();
          this.position = new Float32Array(this.count * 3 * 2);
          this.prev = new Float32Array(this.count * 3 * 2);
          this.next = new Float32Array(this.count * 3 * 2);
          const side = new Float32Array(this.count * 1 * 2);
          const uv = new Float32Array(this.count * 2 * 2);
          const index = new Uint16Array((this.count - 1) * 3 * 2);

          for (let i = 0; i < this.count; i++) {
            const i2 = i * 2;
            side.set([-1, 1], i2);
            const v = i / (this.count - 1);
            uv.set([0, v, 1, v], i * 4);

            if (i === this.count - 1) continue;
            index.set([i2 + 0, i2 + 1, i2 + 2], (i2 + 0) * 3);
            index.set([i2 + 2, i2 + 1, i2 + 3], (i2 + 1) * 3);
          }

          this.geometry.setAttribute('position', new THREE.BufferAttribute(this.position, 3));
          this.geometry.setAttribute('prev', new THREE.BufferAttribute(this.prev, 3));
          this.geometry.setAttribute('next', new THREE.BufferAttribute(this.next, 3));
          this.geometry.setAttribute('side', new THREE.BufferAttribute(side, 1));
          this.geometry.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
          this.geometry.setIndex(new THREE.BufferAttribute(index, 1));
        }

        updateGeometry() {
          this.points.forEach((p, i) => {
            p.toArray(this.position, i * 3 * 2);
            p.toArray(this.position, i * 3 * 2 + 3);

            if (!i) {
              tmp.copy(p).sub(this.points[i + 1]).add(p);
              tmp.toArray(this.prev, i * 3 * 2);
              tmp.toArray(this.prev, i * 3 * 2 + 3);
            } else {
              p.toArray(this.next, (i - 1) * 3 * 2);
              p.toArray(this.next, (i - 1) * 3 * 2 + 3);
            }

            if (i === this.points.length - 1) {
              tmp.copy(p).sub(this.points[i - 1]).add(p);
              tmp.toArray(this.next, i * 3 * 2);
              tmp.toArray(this.next, i * 3 * 2 + 3);
            } else {
              p.toArray(this.prev, (i + 1) * 3 * 2);
              p.toArray(this.prev, (i + 1) * 3 * 2 + 3);
            }
          });

          this.geometry.attributes.position.needsUpdate = true;
          this.geometry.attributes.prev.needsUpdate = true;
          this.geometry.attributes.next.needsUpdate = true;
        }
      }

      return Polyline;
    })();

    App();
  </script>
</body>
</html>
