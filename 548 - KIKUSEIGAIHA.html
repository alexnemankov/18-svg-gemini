<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KIKUSEIGAIHA / 菊青海波</title>
  <style>
    * {
      font-family: 'arial black', Helvetica, verdana, monospace, sans-serif;
      letter-spacing: 0.2rem;
      margin: 0;
      padding: 0;
      color: #FFF;
      overflow: hidden;
      user-select: none;
    }

    body {
      position: relative;
      background: #000;
      width: 100vw;
      height: 100vh;
    }

    canvas#canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #000;
      cursor: grab;
    }

    canvas#canvas:active {
      cursor: grabbing;
    }

    span#logo {
      display: inline-block;
      width: 1.6rem;
      height: 1.6rem;
      border-radius: 50%;
      background: #CC2F3B;
      margin-right: 0.4rem;
      vertical-align: middle;
      transition: background 0.3s ease;
    }

    h1 {
      position: absolute;
      top: 1.6rem;
      left: 1.6rem;
      font-size: 2.4rem;
      pointer-events: none;
      z-index: 10;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
    }

    h2 {
      background: rgba(0, 0, 0, 0.7);
      position: absolute;
      top: 0;
      right: 1.6rem;
      height: 100%;
      text-align: center;
      font-size: 1rem;
      padding: 0.8rem;
      -webkit-writing-mode: vertical-rl;
          -ms-writing-mode: tb-rl;
              writing-mode: vertical-rl;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>
  <h1 id="header"><span id="logo"></span><span id="title"></span></h1>
  <h2>日本・中国の文様事典</h2>
  <canvas id="canvas">Canvas not supported.</canvas>

  <script type="module">
    import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

    // Referenced 日本・中国の文様事典 (9784881081501)
    // Author: Toshiya Marukubo

    (function () {
      'use strict';

      const canvas = document.getElementById('canvas');
      if (!canvas || !canvas.getContext) {
        return;
      }

      const title = document.getElementById('title');
      if (title) {
        title.textContent = 'KIKUSEIGAIHA / 菊青海波';
      }

      const logo = document.getElementById('logo');
      const ctx = canvas.getContext('2d');
      let X = canvas.width = window.innerWidth;
      let Y = canvas.height = window.innerHeight;

      function rand(min, max) {
        return Math.floor(Math.random() * (max - min + 1) + min);
      }

      /********************
        19 Preconfigured Color Schemes
      ********************/
      const colorSchemes = {
        'Original': {
          bg: '#000000',
          evenFill: '#000000',
          evenStroke: '#ffffff',
          oddFill: '#ffffff',
          oddStroke: '#000000',
          accent: '#cc2f3b'
        },
        'Monochromatic': {
          bg: '#0a192f',
          evenFill: '#172a45',
          evenStroke: '#64ffda',
          oddFill: '#303c55',
          oddStroke: '#0a192f',
          accent: '#64ffda'
        },
        'Analogous': {
          bg: '#1a0f0a',
          evenFill: '#e65100',
          evenStroke: '#ffb74d',
          oddFill: '#bf360c',
          oddStroke: '#ff9800',
          accent: '#ffe082'
        },
        'Complementary': {
          bg: '#071a24',
          evenFill: '#00b4d8',
          evenStroke: '#ff5722',
          oddFill: '#ff5722',
          oddStroke: '#00b4d8',
          accent: '#ffe8d6'
        },
        'Split-complementary': {
          bg: '#150d2a',
          evenFill: '#7209b7',
          evenStroke: '#4cc9f0',
          oddFill: '#ffb703',
          oddStroke: '#f72585',
          accent: '#80ed99'
        },
        'Triadic': {
          bg: '#101018',
          evenFill: '#e63946',
          evenStroke: '#ffb703',
          oddFill: '#118ab2',
          oddStroke: '#06d6a0',
          accent: '#ffd166'
        },
        'Tetradic': {
          bg: '#0c0e14',
          evenFill: '#ff4d6d',
          evenStroke: '#06d6a0',
          oddFill: '#118ab2',
          oddStroke: '#ffb703',
          accent: '#ff758f'
        },
        'Double split-complementary': {
          bg: '#0f0c18',
          evenFill: '#ff0054',
          evenStroke: '#00f5d4',
          oddFill: '#7b2cbf',
          oddStroke: '#ffbe0b',
          accent: '#9e0059'
        },
        'Achromatic': {
          bg: '#000000',
          evenFill: '#000000',
          evenStroke: '#ffffff',
          oddFill: '#ffffff',
          oddStroke: '#000000',
          accent: '#888888'
        },
        'Achromatic + Accent': {
          bg: '#000000',
          evenFill: '#000000',
          evenStroke: '#ffffff',
          oddFill: '#ffffff',
          oddStroke: '#000000',
          accent: '#e60026'
        },
        'Neutral + Accent': {
          bg: '#1e1e24',
          evenFill: '#2b2d42',
          evenStroke: '#8d99ae',
          oddFill: '#edf2f4',
          oddStroke: '#2b2d42',
          accent: '#ffb703'
        },
        'Palette 1 (F6AA1C, BC3908, 941B0C, F6AA1C, 220901)': {
          bg: '#220901',
          evenFill: '#941B0C',
          evenStroke: '#F6AA1C',
          oddFill: '#BC3908',
          oddStroke: '#220901',
          accent: '#F6AA1C'
        },
        'Palette 2 (63D1CF, 5BC0BE, 4BAD9E, 4BAD9E, 0B132B, 000000)': {
          bg: '#0B132B',
          evenFill: '#4BAD9E',
          evenStroke: '#63D1CF',
          oddFill: '#000000',
          oddStroke: '#5BC0BE',
          accent: '#63D1CF'
        },
        'Palette 3 (AA60C8, D69ADE, C9A3C6, CFB5C2, 0D001D, 120A12)': {
          bg: '#0D001D',
          evenFill: '#AA60C8',
          evenStroke: '#CFB5C2',
          oddFill: '#120A12',
          oddStroke: '#D69ADE',
          accent: '#C9A3C6'
        },
        'Palette 4 (FEF1BE, FFBA00, 008189, 00474D, 061210)': {
          bg: '#061210',
          evenFill: '#00474D',
          evenStroke: '#FEF1BE',
          oddFill: '#008189',
          oddStroke: '#FFBA00',
          accent: '#FFBA00'
        },
        'Palette 5 (D4FFB0, 7FFF00, 00B894, 0A3322, 05140A)': {
          bg: '#05140A',
          evenFill: '#0A3322',
          evenStroke: '#7FFF00',
          oddFill: '#00B894',
          oddStroke: '#D4FFB0',
          accent: '#7FFF00'
        },
        'Palette 6 (FFE8CC, FF8C00, C7501A, 3D1050, 0E0618)': {
          bg: '#0E0618',
          evenFill: '#3D1050',
          evenStroke: '#FF8C00',
          oddFill: '#C7501A',
          oddStroke: '#FFE8CC',
          accent: '#FF8C00'
        },
        'Palette 7 (E8E0FF, B38FFF, 6A3DE8, 1A1250, 090612)': {
          bg: '#090612',
          evenFill: '#1A1250',
          evenStroke: '#B38FFF',
          oddFill: '#6A3DE8',
          oddStroke: '#E8E0FF',
          accent: '#B38FFF'
        },
        'Palette 8 (E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)': {
          bg: '#05020F',
          evenFill: '#1E0A3D',
          evenStroke: '#00F0FF',
          oddFill: '#D40078',
          oddStroke: '#E0FBFF',
          accent: '#00F0FF'
        }
      };

      /********************
        Global Settings
      ********************/
      const settings = {
        // Theme & Color
        colorScheme: 'Original',
        greenscreen: false,
        backgroundColor: '#000000',
        evenFill: '#000000',
        evenStroke: '#ffffff',
        oddFill: '#ffffff',
        oddStroke: '#000000',
        accentColor: '#cc2f3b',

        // Geometry
        dist: 200,
        petals: 18,
        lineWidth: 4,
        petalWidth: 0.166,
        dotRadius: 0.1,

        // Dynamics & Motion
        rotationSpeed: 0.3,
        ease: 0.3,
        friction: 0.9,

        // Transform View
        zoom: 1.0,
        panX: 0,
        panY: 0,

        // Interaction
        clickToRandomize: true,

        // Actions
        invertColors: function () {
          const tf = settings.evenFill;
          const ts = settings.evenStroke;
          settings.evenFill = settings.oddFill;
          settings.evenStroke = settings.oddStroke;
          settings.oddFill = tf;
          settings.oddStroke = ts;

          if (settings.backgroundColor.toLowerCase() === '#000000') {
            settings.backgroundColor = '#ffffff';
          } else if (settings.backgroundColor.toLowerCase() === '#ffffff') {
            settings.backgroundColor = '#000000';
          }

          updateLogo();
          updateGUI();
        },
        resetView: function () {
          settings.zoom = 1.0;
          settings.panX = 0;
          settings.panY = 0;
          updateGUI();
        },
        scatter: function () {
          for (let i = 0; i < shapes.length; i++) {
            shapes[i].xi = Math.random() * X;
            shapes[i].yi = Math.random() * Y;
            shapes[i].v.x = (Math.random() - 0.5) * 80;
            shapes[i].v.y = (Math.random() - 0.5) * 80;
          }
        },
        randomize: function () {
          randomizeScene();
        }
      };

      function updateLogo() {
        if (logo) {
          logo.style.background = settings.accentColor;
        }
      }

      function applyScheme(name) {
        const scheme = colorSchemes[name];
        if (!scheme) return;
        settings.backgroundColor = scheme.bg;
        settings.evenFill = scheme.evenFill;
        settings.evenStroke = scheme.evenStroke;
        settings.oddFill = scheme.oddFill;
        settings.oddStroke = scheme.oddStroke;
        settings.accentColor = scheme.accent;
        updateLogo();
        updateGUI();
      }

      /********************
        Shape
      ********************/
      let shapes = [];

      function Shape(ctx, x, y, row, col) {
        this.ctx = ctx;
        this.x = x;
        this.y = y;
        this.row = row;
        this.col = col;
        this.xi = rand(0, X);
        this.yi = rand(0, Y);
        this.r = settings.dist / 2;
        this.v = { x: 0, y: 0 };
        this.a = Math.abs(col) * 10;
        this.rad = this.a * Math.PI / 180;
      }

      Shape.prototype.draw = function () {
        const ctx = this.ctx;
        const isEven = Math.abs(this.row) % 2 === 0;
        const currentStroke = isEven ? settings.evenStroke : settings.oddStroke;
        const currentFill = isEven ? settings.evenFill : settings.oddFill;

        ctx.save();
        ctx.lineWidth = settings.lineWidth;
        ctx.strokeStyle = currentStroke;
        ctx.fillStyle = currentFill;

        ctx.translate(this.xi, this.yi);
        ctx.rotate(this.rad);
        ctx.translate(-this.xi, -this.yi);

        const petals = settings.petals;
        const angleStep = (2 * Math.PI) / petals;
        const pw = this.r * settings.petalWidth;
        const pCurve = this.r * 0.2;

        for (let i = petals; i > 0; i--) {
          ctx.translate(this.xi, this.yi);
          ctx.rotate(angleStep);
          ctx.translate(-this.xi, -this.yi);
          ctx.beginPath();
          ctx.moveTo(this.xi, this.yi);
          ctx.lineTo(this.xi - pw, this.yi - this.r);
          ctx.quadraticCurveTo(this.xi, this.yi - this.r - pCurve, this.xi + pw, this.yi - this.r);
          ctx.lineTo(this.xi, this.yi);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
        }

        // Center dot
        ctx.beginPath();
        ctx.arc(this.xi, this.yi, this.r * settings.dotRadius, 0, Math.PI * 2, false);
        ctx.fillStyle = settings.accentColor;
        ctx.fill();
        ctx.strokeStyle = currentStroke;
        ctx.stroke();

        ctx.restore();
      };

      Shape.prototype.updatePosition = function () {
        this.v.x += (this.xi - this.x) * settings.ease;
        this.v.y += (this.yi - this.y) * settings.ease;
        this.v.x *= settings.friction;
        this.v.y *= settings.friction;
        this.xi -= this.v.x / 100;
        this.yi -= this.v.y / 100;
      };

      Shape.prototype.updateParams = function () {
        const isEven = Math.abs(this.row) % 2 === 0;
        if (isEven) {
          this.a += settings.rotationSpeed;
        } else {
          this.a -= settings.rotationSpeed;
        }
        this.rad = this.a * Math.PI / 180;
      };

      Shape.prototype.render = function () {
        this.updateParams();
        this.updatePosition();
      };

      /********************
        Build Grid of Shapes
      ********************/
      function buildShapes(scatter = false) {
        const dist = settings.dist;
        const diffX = dist / 2;
        const diffY = dist / 1.5;
        const stepY = dist - diffY; // = dist / 3

        const padX = Math.max(X * 2, 2500);
        const padY = Math.max(Y * 2, 2500);

        const startX = -padX;
        const endX = X + padX;
        const startY = -padY;
        const endY = Y + padY;

        const minJ = Math.floor(startX / dist) - 1;
        const maxJ = Math.ceil(endX / dist) + 1;
        const minI = Math.floor(startY / stepY) - 1;
        const maxI = Math.ceil(endY / stepY) + 1;

        shapes = [];
        for (let i = minI; i <= maxI; i++) {
          const isEven = Math.abs(i) % 2 === 0;
          const y = i * stepY;
          const offsetX = isEven ? diffX : 0;
          for (let j = minJ; j <= maxJ; j++) {
            const x = j * dist + offsetX;
            const s = new Shape(ctx, x, y, i, j);
            if (scatter) {
              s.xi = Math.random() * X;
              s.yi = Math.random() * Y;
              s.v.x = (Math.random() - 0.5) * 60;
              s.v.y = (Math.random() - 0.5) * 60;
            }
            shapes.push(s);
          }
        }
      }

      buildShapes(false);

      /********************
        Procedural Variation
      ********************/
      function randomizeScene() {
        const schemeKeys = Object.keys(colorSchemes);
        const chosenScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
        settings.colorScheme = chosenScheme;
        applyScheme(chosenScheme);

        // Re-roll geometric parameters
        settings.dist = Math.floor(Math.random() * 120 + 150); // 150 - 270
        settings.petals = [12, 14, 16, 18, 20, 24][Math.floor(Math.random() * 6)];
        settings.lineWidth = +(Math.random() * 4 + 2).toFixed(1); // 2 - 6
        settings.petalWidth = +(Math.random() * 0.12 + 0.11).toFixed(3); // 0.11 - 0.23
        settings.dotRadius = +(Math.random() * 0.1 + 0.06).toFixed(3); // 0.06 - 0.16

        // Re-roll motion parameters
        const dir = Math.random() < 0.5 ? 1 : -1;
        settings.rotationSpeed = +( (Math.random() * 0.6 + 0.15) * dir ).toFixed(2);
        settings.ease = +(Math.random() * 0.3 + 0.15).toFixed(2);
        settings.friction = +(Math.random() * 0.08 + 0.88).toFixed(2);

        // Rebuild with scatter animation burst
        buildShapes(true);
        updateLogo();
        updateGUI();
      }

      /********************
        Render Loop
      ********************/
      function render() {
        // Clear background
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.fillStyle = settings.greenscreen ? '#00ff00' : settings.backgroundColor;
        ctx.fillRect(0, 0, X, Y);
        ctx.restore();

        // Apply Pan & Zoom
        ctx.save();
        ctx.translate(settings.panX, settings.panY);
        ctx.scale(settings.zoom, settings.zoom);

        // Calculate world bounds for frustum culling
        const visibleMinX = -settings.panX / settings.zoom;
        const visibleMaxX = (X - settings.panX) / settings.zoom;
        const visibleMinY = -settings.panY / settings.zoom;
        const visibleMaxY = (Y - settings.panY) / settings.zoom;
        const cullMargin = (settings.dist / 2) * 1.5;

        for (let i = 0; i < shapes.length; i++) {
          const s = shapes[i];
          s.render();

          // Draw only visible shapes
          if (
            s.xi + cullMargin >= visibleMinX &&
            s.xi - cullMargin <= visibleMaxX &&
            s.yi + cullMargin >= visibleMinY &&
            s.yi - cullMargin <= visibleMaxY
          ) {
            s.draw();
          }
        }

        ctx.restore();
        requestAnimationFrame(render);
      }

      render();

      /********************
        Pan & Zoom Interaction
      ********************/
      let isDragging = false;
      let startX = 0;
      let startY = 0;
      let initialPanX = 0;
      let initialPanY = 0;
      let hasMoved = false;

      canvas.addEventListener('mousedown', function (e) {
        if (e.button !== 0) return;
        isDragging = true;
        hasMoved = false;
        startX = e.clientX;
        startY = e.clientY;
        initialPanX = settings.panX;
        initialPanY = settings.panY;
      });

      window.addEventListener('mousemove', function (e) {
        if (!isDragging) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        if (Math.hypot(dx, dy) > 5) {
          hasMoved = true;
        }
        settings.panX = initialPanX + dx;
        settings.panY = initialPanY + dy;
      });

      window.addEventListener('mouseup', function () {
        if (!isDragging) return;
        isDragging = false;
        if (!hasMoved && settings.clickToRandomize) {
          randomizeScene();
        }
      });

      // Zoom with wheel centered on cursor
      canvas.addEventListener('wheel', function (e) {
        e.preventDefault();
        const factor = e.deltaY < 0 ? 1.08 : 0.92;
        const newZoom = Math.max(0.1, Math.min(10, settings.zoom * factor));
        const mx = e.clientX;
        const my = e.clientY;
        settings.panX = mx - (mx - settings.panX) * (newZoom / settings.zoom);
        settings.panY = my - (my - settings.panY) * (newZoom / settings.zoom);
        settings.zoom = newZoom;
      }, { passive: false });

      // Touch events for mobile/tablet devices
      let touchStartDist = 0;
      let touchInitZoom = 1;

      canvas.addEventListener('touchstart', function (e) {
        if (e.touches.length === 1) {
          isDragging = true;
          hasMoved = false;
          startX = e.touches[0].clientX;
          startY = e.touches[0].clientY;
          initialPanX = settings.panX;
          initialPanY = settings.panY;
        } else if (e.touches.length === 2) {
          isDragging = false;
          touchStartDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          touchInitZoom = settings.zoom;
        }
      }, { passive: false });

      window.addEventListener('touchmove', function (e) {
        if (isDragging && e.touches.length === 1) {
          const dx = e.touches[0].clientX - startX;
          const dy = e.touches[0].clientY - startY;
          if (Math.hypot(dx, dy) > 5) hasMoved = true;
          settings.panX = initialPanX + dx;
          settings.panY = initialPanY + dy;
        } else if (e.touches.length === 2 && touchStartDist > 0) {
          const dist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
          const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
          const newZoom = Math.max(0.1, Math.min(10, touchInitZoom * (dist / touchStartDist)));
          settings.panX = midX - (midX - settings.panX) * (newZoom / settings.zoom);
          settings.panY = midY - (midY - settings.panY) * (newZoom / settings.zoom);
          settings.zoom = newZoom;
        }
      }, { passive: false });

      window.addEventListener('touchend', function (e) {
        if (isDragging) {
          isDragging = false;
          if (!hasMoved && settings.clickToRandomize) {
            randomizeScene();
          }
        }
        if (e.touches.length < 2) {
          touchStartDist = 0;
        }
      });

      /********************
        Resize Event
      ********************/
      function onResize() {
        X = canvas.width = window.innerWidth;
        Y = canvas.height = window.innerHeight;
        buildShapes(false);
      }

      window.addEventListener('resize', onResize);

      /********************
        lil-gui Controls
      ********************/
      const gui = new GUI({ title: 'Kikuseigaiha Controls' });

      function updateGUI() {
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      }

      // 1. Color Themes Folder
      const themeFolder = gui.addFolder('Theme & Color Presets');
      themeFolder.add(settings, 'colorScheme', Object.keys(colorSchemes))
        .name('Color Scheme')
        .onChange(name => applyScheme(name));
      themeFolder.add(settings, 'invertColors').name('⇄ Invert Colors');

      // 2. Colors Folder
      const colorFolder = gui.addFolder('Color Customization');
      colorFolder.add(settings, 'greenscreen')
        .name('Greenscreen (#00ff00)')
        .onChange(val => {
          if (val) {
            document.body.style.backgroundColor = '#00ff00';
          } else {
            document.body.style.backgroundColor = settings.backgroundColor;
          }
        });
      colorFolder.addColor(settings, 'backgroundColor')
        .name('Background Color')
        .onChange(val => {
          if (settings.greenscreen) {
            settings.greenscreen = false;
            updateGUI();
          }
          document.body.style.backgroundColor = val;
        });
      colorFolder.addColor(settings, 'evenFill').name('Even Layer Fill');
      colorFolder.addColor(settings, 'evenStroke').name('Even Layer Stroke');
      colorFolder.addColor(settings, 'oddFill').name('Odd Layer Fill');
      colorFolder.addColor(settings, 'oddStroke').name('Odd Layer Stroke');
      colorFolder.addColor(settings, 'accentColor').name('Accent Center Dot')
        .onChange(() => updateLogo());

      // 3. Geometry Folder
      const geomFolder = gui.addFolder('Geometry');
      geomFolder.add(settings, 'dist', 100, 350, 10)
        .name('Grid Distance')
        .onChange(() => buildShapes(false));
      geomFolder.add(settings, 'petals', 8, 36, 2).name('Petals Count');
      geomFolder.add(settings, 'lineWidth', 0.5, 12, 0.5).name('Line Width');
      geomFolder.add(settings, 'petalWidth', 0.05, 0.35, 0.01).name('Petal Width');
      geomFolder.add(settings, 'dotRadius', 0.02, 0.3, 0.01).name('Center Dot Radius');

      // 4. Motion & Physics Folder
      const motionFolder = gui.addFolder('Motion & Dynamics');
      motionFolder.add(settings, 'rotationSpeed', -2, 2, 0.05).name('Rotation Speed');
      motionFolder.add(settings, 'ease', 0.05, 0.8, 0.01).name('Spring Ease');
      motionFolder.add(settings, 'friction', 0.7, 0.99, 0.01).name('Friction');
      motionFolder.add(settings, 'scatter').name('💥 Scatter Burst');

      // 5. View / Pan & Zoom Folder
      const viewFolder = gui.addFolder('Pan & Zoom');
      viewFolder.add(settings, 'zoom', 0.1, 10, 0.01).name('Zoom Scale');
      viewFolder.add(settings, 'panX', -3000, 3000, 1).name('Pan X');
      viewFolder.add(settings, 'panY', -3000, 3000, 1).name('Pan Y');
      viewFolder.add(settings, 'resetView').name('↺ Reset View');

      // 6. Procedural Variation Folder
      const proceduralFolder = gui.addFolder('Procedural Generator');
      proceduralFolder.add(settings, 'clickToRandomize').name('Click Scene to Reroll');
      proceduralFolder.add(settings, 'randomize').name('🎲 Randomize Scene');

      /********************
        Toggle UI with 'H' Key
      ********************/
      let uiVisible = true;
      window.addEventListener('keydown', function (e) {
        if (['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) return;
        if (e.key === 'h' || e.key === 'H') {
          uiVisible = !uiVisible;
          gui.domElement.style.display = uiVisible ? '' : 'none';
          const h1 = document.querySelector('h1');
          const h2 = document.querySelector('h2');
          if (h1) h1.style.display = uiVisible ? '' : 'none';
          if (h2) h2.style.display = uiVisible ? '' : 'none';
        }
      });

    })();
  </script>
</body>
</html>
