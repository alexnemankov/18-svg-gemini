    // --- SETUP THREE.JS SCENE & RENDERER ---

    let renderer;
    let controls;

    function initRenderer(antialias) {
      if (renderer) {
        renderer.dispose();
        renderer.domElement.remove();
      }
      renderer = new THREE.WebGLRenderer({
        antialias: antialias,
        powerPreference: "high-performance"
      });
      renderer.setPixelRatio(params.dpr);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = params.exposure;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      if (controls) controls.dispose();
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.screenSpacePanning = true; // Drag object across screen
      controls.minDistance = 1.6;
      controls.maxDistance = 12.0;
      controls.target.set(0, 0.65, 0);
      controls.mouseButtons = {
        LEFT: THREE.MOUSE.ROTATE,
        MIDDLE: THREE.MOUSE.DOLLY,
        RIGHT: THREE.MOUSE.PAN

      controls.touches = {

        TWO: THREE.TOUCH.DOLLY_PAN

    // --- PROCEDURAL PROCEDURES FOR TEXTURES ---
    function createHighDetailBarkTexture() {
      const cvs = document.createElement('canvas');
      cvs.width = 1024;
      cvs.height = 1024;
      const ctx = cvs.getContext('2d');

      // Base earthy undertone
      ctx.fillStyle = '#4a382a';
      ctx.fillRect(0, 0, 1024, 1024);

      // Deep longitudinal fissures and fibrous wood grain
      for (let i = 0; i < 1800; i++) {
        const x = Math.random() * 1024;
        const w = Math.random() * 4 + 1;
        const a = Math.random() * 0.45 + 0.1;
        ctx.fillStyle = Math.random() > 0.5 ? `rgba(22, 14, 8, ${a})` : `rgba(75, 55, 38, ${a * 0.8})`;
        ctx.fillRect(x, 0, w, 1024);
      }

      // Knot whorls and mossy patches
      for (let k = 0; k < 18; k++) {
        const kx = Math.random() * 1024;
        const ky = Math.random() * 1024;
        const r = Math.random() * 35 + 20;
        for (let ring = r; ring > 3; ring -= 4) {
          ctx.strokeStyle = ring % 8 === 0 ? 'rgba(85, 60, 40, 0.8)' : 'rgba(18, 10, 5, 0.85)';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.ellipse(kx, ky, ring, ring * 1.6, Math.PI / 6, 0, Math.PI * 2);
          ctx.stroke();
        }
      }

      const texture = new THREE.CanvasTexture(cvs);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(2, 4);
      return texture;
    }

    function createPotTextureAndEmissive() {
      const cvs = document.createElement('canvas');
      cvs.width = 2048;
      cvs.height = 1024;
      const ctx = cvs.getContext('2d');

      const emissiveCvs = document.createElement('canvas');
      emissiveCvs.width = 2048;
      emissiveCvs.height = 1024;
      const eCtx = emissiveCvs.getContext('2d');
      eCtx.fillStyle = '#000000';
      eCtx.fillRect(0, 0, 2048, 1024);

      // Antique terracotta clay gradient
      const grad = ctx.createLinearGradient(0, 0, 0, 1024);
      grad.addColorStop(0, '#362419');
      grad.addColorStop(0.3, '#4d3324');
      grad.addColorStop(0.7, '#3b261b');
      grad.addColorStop(1, '#20140d');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 2048, 1024);

      // Fine ceramic stippling
      for (let i = 0; i < 80000; i++) {
        const x = Math.random() * 2048;
        const y = Math.random() * 1024;
        const a = Math.random() * 0.15;
        ctx.fillStyle = `rgba(0, 0, 0, ${a})`;
        ctx.fillRect(x, y, 2, 2);
      }

      // Deep organic crack fissures (Kintsugi / Alchemical power fractures)
      const glyphs = ['🜁', '🜂', '🜃', '🜄', '☿', '🜍', '☉', '☽', '♄', '♃', '♂', '♀', '🜔', '🝎', '🜏', '🝓'];

      // Glowing etched rune ring around the upper collar
      eCtx.font = 'bold 54px serif';
      eCtx.fillStyle = '#ffffff';
      eCtx.textAlign = 'center';
      eCtx.textBaseline = 'middle';

      ctx.font = 'bold 54px serif';
      ctx.fillStyle = 'rgba(10, 5, 2, 0.9)';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      const runeY = 480;
      for (let i = 0; i < 24; i++) {
        const x = (i / 24) * 2048 + 42;
        const g = glyphs[i % glyphs.length];
        ctx.fillText(g, x, runeY);
        eCtx.fillText(g, x, runeY);
      }

      // Branching glowing lightning cracks
      for (let c = 0; c < 10; c++) {
        let cx = (c * 205 + Math.random() * 50) % 2048;
        let cy = 260 + Math.random() * 80;

        ctx.strokeStyle = '#120804';
        ctx.lineWidth = 4.0;
        eCtx.strokeStyle = '#ffffff';
        eCtx.lineWidth = 2.5;

        ctx.beginPath();
        eCtx.beginPath();
        ctx.moveTo(cx, cy);
        eCtx.moveTo(cx, cy);

        for (let s = 0; s < 14; s++) {
          cx += (Math.random() - 0.5) * 60;
          cy += Math.random() * 55 + 15;
          ctx.lineTo(cx, cy);
          eCtx.lineTo(cx, cy);
        }
        ctx.stroke();
        eCtx.stroke();
      }

      const potTex = new THREE.CanvasTexture(cvs);
      potTex.wrapS = THREE.RepeatWrapping;
      potTex.wrapT = THREE.ClampToEdgeWrapping;

      const potEmissive = new THREE.CanvasTexture(emissiveCvs);
      potEmissive.wrapS = THREE.RepeatWrapping;
      potEmissive.wrapT = THREE.ClampToEdgeWrapping;

      return { potTex, potEmissive };
    }

    const barkTexture = createHighDetailBarkTexture();
    const { potTex, potEmissive } = createPotTextureAndEmissive();

    // --- MATERIALS ---
    const mandrakeMaterial = new THREE.MeshStandardMaterial({
      color: params.rootBarkColor,
      map: barkTexture,
      bumpMap: barkTexture,
      bumpScale: 0.08,
      roughness: 0.85,
      metalness: 0.08
    });

    const leafMaterial = new THREE.MeshStandardMaterial({
      color: params.leafColor,
      roughness: 0.35,
      metalness: 0.15,
      side: THREE.DoubleSide
    });

    const potMaterial = new THREE.MeshStandardMaterial({
      color: params.potColor,
      map: potTex,
      roughness: 0.75,
      metalness: 0.12,
      emissive: params.runeColor,
      emissiveMap: potEmissive,
      emissiveIntensity: 1.2
    });

    const soilMaterial = new THREE.MeshStandardMaterial({
      color: params.soilColor,
      roughness: 0.96,
      metalness: 0.02
    });

    // --- CRACKED CLAY POT & SOIL MESH ---
    const potGroup = new THREE.Group();
    scene.add(potGroup);

    // Smooth antique ceramic lathe silhouette with rolled lip
    const potPoints = [];
    potPoints.push(new THREE.Vector2(0.0, -1.25));
    potPoints.push(new THREE.Vector2(0.95, -1.25));
    potPoints.push(new THREE.Vector2(1.22, -0.75));
    potPoints.push(new THREE.Vector2(1.38, -0.1));
    potPoints.push(new THREE.Vector2(1.28, 0.42));
    potPoints.push(new THREE.Vector2(1.08, 0.78));
    potPoints.push(new THREE.Vector2(1.18, 0.92));
    potPoints.push(new THREE.Vector2(1.06, 0.98));
    potPoints.push(new THREE.Vector2(0.96, 0.86)); // inner lip
    potPoints.push(new THREE.Vector2(0.92, 0.0));

    const potGeo = new THREE.LatheGeometry(potPoints, 96);
    const potMesh = new THREE.Mesh(potGeo, potMaterial);
    potMesh.castShadow = true;
    potMesh.receiveShadow = true;
    potGroup.add(potMesh);

    // Rich dark soil bed
    const soilGeo = new THREE.CylinderGeometry(0.99, 0.93, 0.3, 48, 6);
    const sPos = soilGeo.attributes.position;
    for (let i = 0; i < sPos.count; i++) {
      if (sPos.getY(i) > 0.05) {
        const x = sPos.getX(i);
        const z = sPos.getZ(i);
        const bump = (Math.sin(x * 16) * Math.cos(z * 16) + Math.sin(x * 30 + z * 24)) * 0.04;
        sPos.setY(i, sPos.getY(i) + bump);
      }
    }
    soilGeo.computeVertexNormals();
    const soilMesh = new THREE.Mesh(soilGeo, soilMaterial);
    soilMesh.position.y = 0.68;
    soilMesh.receiveShadow = true;
    potGroup.add(soilMesh);

    // Soil earth clumps that lift during uprooting
    const soilChunkGroup = new THREE.Group();
    soilMesh.add(soilChunkGroup);
    const chunkGeo = new THREE.DodecahedronGeometry(0.065, 1);
    const soilChunks = [];
    for (let i = 0; i < 24; i++) {
      const chunk = new THREE.Mesh(chunkGeo, soilMaterial);
      const angle = (i / 24) * Math.PI * 2 + Math.random() * 0.2;
      const r = 0.2 + Math.random() * 0.55;
      chunk.position.set(Math.cos(angle) * r, 0.14, Math.sin(angle) * r);
      chunk.rotation.set(Math.random() * 3, Math.random() * 3, Math.random() * 3);
      chunk.scale.setScalar(0.6 + Math.random() * 0.8);
      soilChunkGroup.add(chunk);
      soilChunks.push({
        mesh: chunk,
        baseY: 0.14,
        rndX: (Math.random() - 0.5) * 0.15,
        rndZ: (Math.random() - 0.5) * 0.15
      });
    }

    // Root tendrils gripping the pot rim from the soil
    for (let t = 0; t < 5; t++) {
      const tendrilAngle = (t / 5) * Math.PI * 2 + 0.3;
      const tendrilCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(Math.cos(tendrilAngle) * 0.5, 0.72, Math.sin(tendrilAngle) * 0.5),

        new THREE.Vector3(Math.cos(tendrilAngle) * 1.12, 0.88, Math.sin(tendrilAngle) * 1.12),
        new THREE.Vector3(Math.cos(tendrilAngle) * 1.18, 0.68, Math.sin(tendrilAngle) * 1.18),

      ]);
      const tendrilGeo = new THREE.TubeGeometry(tendrilCurve, 20, 0.035, 10, false);
      const tendrilMesh = new THREE.Mesh(tendrilGeo, mandrakeMaterial);
      tendrilMesh.castShadow = true;

    }

    // Alchemical stone pedestal

    const pedestalMat = new THREE.MeshStandardMaterial({

    // --- ALCHEMICAL MANDRAKE (SEAMLESS HUMAN-ROOT SKINNED MESH) ---
    const mandrakeContainer = new THREE.Group();
    scene.add(mandrakeContainer);

    // Precise bone skeleton hierarchy
    const rootBone = new THREE.Bone();
    rootBone.position.set(0, 0, 0);

    const spineLower = new THREE.Bone();
    spineLower.position.set(0, 0.45, 0); // world y = 0.45
    rootBone.add(spineLower);

    const spineUpper = new THREE.Bone();
    spineUpper.position.set(0, 0.42, 0); // world y = 0.87
    spineLower.add(spineUpper);

    chestBone.position.set(0, 0.38, 0); // world y = 1.25
    spineUpper.add(chestBone);

    chestBone.add(neckBone);

    // Left Arm Root (Tucked naturally along torso/roots so max radius < 0.50, safely inside pot)
    const leftShoulder = new THREE.Bone();
    leftShoulder.position.set(-0.30, 0.04, 0.06); // world y = 1.29, x = -0.30, z = 0.06
    chestBone.add(leftShoulder);

    const leftElbow = new THREE.Bone();
    leftElbow.position.set(-0.10, -0.34, 0.12); // world y = 0.95, x = -0.40, z = 0.18
    leftShoulder.add(leftElbow);

    const leftHand = new THREE.Bone();
    leftHand.position.set(0.06, -0.34, 0.08); // world y = 0.61, x = -0.34, z = 0.26
    leftElbow.add(leftHand);

    // Right Arm Root (Tucked naturally along torso/roots so max radius < 0.50, safely inside pot)
    const rightShoulder = new THREE.Bone();
    rightShoulder.position.set(0.30, 0.04, 0.06); // world y = 1.29, x = 0.30, z = 0.06
    chestBone.add(rightShoulder);

    const rightElbow = new THREE.Bone();
    rightElbow.position.set(0.10, -0.34, 0.12); // world y = 0.95, x = 0.40, z = 0.18
    rightShoulder.add(rightElbow);

    const rightHand = new THREE.Bone();
    rightHand.position.set(-0.06, -0.34, 0.08); // world y = 0.61, x = 0.34, z = 0.26
    rightElbow.add(rightHand);

    // Left Taproot (Leg)
    const leftHip = new THREE.Bone();
    leftHip.position.set(-0.2, -0.05, 0);
    rootBone.add(leftHip);

    const leftKnee = new THREE.Bone();
    leftKnee.position.set(-0.06, -0.5, 0.06);
    leftHip.add(leftKnee);

    const leftRootTip = new THREE.Bone();
    leftRootTip.position.set(-0.04, -0.55, -0.04);
    leftKnee.add(leftRootTip);

    // Right Taproot (Leg)
    const rightHip = new THREE.Bone();
    rightHip.position.set(0.2, -0.05, 0);
    rootBone.add(rightHip);

    const rightKnee = new THREE.Bone();
    rightKnee.position.set(0.06, -0.5, 0.06);
    rightHip.add(rightKnee);

    const rightRootTip = new THREE.Bone();
    rightRootTip.position.set(0.04, -0.55, -0.04);
    rightKnee.add(rightRootTip);

    const allBones = [
      rootBone, spineLower, spineUpper, chestBone, neckBone, headBone, jawBone, crownBone,
      leftShoulder, leftElbow, leftHand,
      rightShoulder, rightElbow, rightHand,
      leftHip, leftKnee, leftRootTip,
      rightHip, rightKnee, rightRootTip
    ];

    const skeleton = new THREE.Skeleton(allBones);

    // BUILD CONTINUOUS SCULPTED MANDRAKE GEOMETRY
    function buildSculptedMandrakeGeometry() {
      const positions = [];
      const normals = [];
      const uvs = [];
      const skinIndices = [];
      const skinWeights = [];
      const indices = [];

      let vertexIndexOffset = 0;

      // 1. Torso, Neck & Face Column (y = 0.0 to 2.35)
      const rings = 42;
      const segs = 32;

      for (let r = 0; r <= rings; r++) {
        const v = r / rings;
        const y = v * 2.35; // from 0.0 to 2.35

        // Anatomical profile radius along torso and face
        let rad = 0.3;
        let centerZ = 0.0;
        let centerX = 0.0;

        if (y < 0.3) {
          rad = 0.28 + y * 0.15; // pelvis
        } else if (y < 0.75) {
          const t = (y - 0.3) / 0.45;
          rad = 0.32 + Math.sin(t * Math.PI) * 0.08; // bulbous belly
          centerZ = Math.sin(t * Math.PI) * 0.08;
        } else if (y < 1.2) {
          rad = 0.28 + (y - 0.75) * 0.16; // ribcage
        } else if (y < 1.5) {
          const t = (y - 1.2) / 0.3;
          rad = 0.35 - t * 0.14; // narrowing into neck
        } else if (y < 2.05) {
          const t = (y - 1.5) / 0.55;
          rad = 0.21 + Math.sin(t * Math.PI) * 0.15; // head skull expansion
          centerZ = 0.04;
        } else {
          const t = (y - 2.05) / 0.3;
          rad = 0.32 * (1.0 - t * 0.55); // crown apex
        }

        for (let s = 0; s <= segs; s++) {
          const u = s / segs;
          const theta = u * Math.PI * 2;

          let px = Math.sin(theta) * rad;
          let pz = Math.cos(theta) * rad + centerZ;
          let py = y;

          // Sculpt face features on front (cos(theta) > 0.3)
          const isFront = Math.cos(theta) > 0.2;

          if (isFront && y >= 1.62 && y <= 1.84) {
            // Mouth opening indentation (screaming cavern)
            const mouthU = Math.sin(theta) / 0.35;
            if (Math.abs(mouthU) < 1.0) {
              const mouthDist = Math.hypot(mouthU, (y - 1.73) / 0.11);
              if (mouthDist < 1.0) {
                const depth = (1.0 - mouthDist) * 0.16;
                pz -= depth;
              }
            }
          }

          if (isFront && y >= 1.88 && y <= 2.08) {
            // Left & Right eye sockets
            const eyeXLeft = -0.16;
            const eyeXRight = 0.16;
            const eyeY = 1.98;

            const dLeft = Math.hypot(px - eyeXLeft, py - eyeY);
            const dRight = Math.hypot(px - eyeXRight, py - eyeY);

            if (dLeft < 0.13) {
              pz -= (0.13 - dLeft) * 0.8;
            }
            if (dRight < 0.13) {
              pz -= (0.13 - dRight) * 0.8;
            }

            // Gnarled root nose protrusion in center
            if (Math.abs(px) < 0.08 && py < 2.0) {
              pz += (0.08 - Math.abs(px)) * 0.8;
            }
          }

          // Wood grain & organic bark bumps
          const bump = Math.sin(py * 24.0 + theta * 4.0) * 0.02 + Math.cos(theta * 6.0) * 0.015;
          px += Math.sin(theta) * bump;
          pz += Math.cos(theta) * bump;

          positions.push(px, py, pz);
          uvs.push(u * 2, v * 4);

          // Skin weights calculation
          let b1 = 0, b2 = 1, w1 = 1, w2 = 0;

          if (y < 0.45) {
            b1 = 0; b2 = 1; // root to spineLower
            w2 = y / 0.45; w1 = 1.0 - w2;
          } else if (y < 0.87) {
            b1 = 1; b2 = 2; // spineLower to spineUpper
            w2 = (y - 0.45) / 0.42; w1 = 1.0 - w2;
          } else if (y < 1.25) {
            b1 = 2; b2 = 3; // spineUpper to chest
            w2 = (y - 0.87) / 0.38; w1 = 1.0 - w2;
          } else if (y < 1.53) {
            b1 = 3; b2 = 4; // chest to neck
            w2 = (y - 1.25) / 0.28; w1 = 1.0 - w2;
          } else if (y < 1.85) {
            if (isFront && y < 1.78) {
              b1 = 6; b2 = 5; // Jaw dominates mouth area
              w1 = 0.85; w2 = 0.15;
            } else {
              b1 = 4; b2 = 5; // neck to head
              w2 = (y - 1.53) / 0.32; w1 = 1.0 - w2;
            }
          } else if (y < 2.15) {
            b1 = 5; b2 = 7; // head to crown
            w2 = (y - 1.85) / 0.3; w1 = 1.0 - w2;
          } else {
            b1 = 7; b2 = 5;
            w1 = 0.85; w2 = 0.15;
          }

          skinIndices.push(b1, b2, 0, 0);
          skinWeights.push(w1, w2, 0, 0);
        }
      }

      // Generate Torso Index Quads
      for (let r = 0; r < rings; r++) {
        for (let s = 0; s < segs; s++) {
          const a = r * (segs + 1) + s;
          const b = (r + 1) * (segs + 1) + s;
          const c = (r + 1) * (segs + 1) + (s + 1);
          const d = r * (segs + 1) + (s + 1);
          indices.push(a, b, d);
          indices.push(b, c, d);
        }
      }

      vertexIndexOffset = (rings + 1) * (segs + 1);

      // 2. Bifurcated Taproots (Left & Right Legs)
      function appendTaproot(isLeft) {
        const sign = isLeft ? -1 : 1;
        const hipB = isLeft ? 14 : 17;
        const kneeB = isLeft ? 15 : 18;
        const tipB = isLeft ? 16 : 19;

        const legRings = 24;
        const legSegs = 16;
        const startIndex = positions.length / 3;

        for (let r = 0; r <= legRings; r++) {
          const v = r / legRings;
          const y = 0.1 - v * 1.2; // from +0.1 down to -1.1

          const rad = (1.0 - v * 0.75) * 0.16;
          const curveX = sign * (0.18 + Math.sin(v * Math.PI) * 0.08);
          const curveZ = Math.sin(v * 4.0) * 0.05;

          for (let s = 0; s <= legSegs; s++) {
            const u = s / legSegs;
            const theta = u * Math.PI * 2;

            const px = curveX + Math.sin(theta) * rad;
            const py = y;
            const pz = curveZ + Math.cos(theta) * rad;

            positions.push(px, py, pz);
            uvs.push(u, v * 2);

            let b1 = hipB, b2 = kneeB, w1 = 1, w2 = 0;
            if (v < 0.5) {
              const t = v / 0.5;
              w2 = t; w1 = 1.0 - t;
            } else {
              b1 = kneeB; b2 = tipB;
              const t = (v - 0.5) / 0.5;
              w2 = t; w1 = 1.0 - t;
            }

            skinIndices.push(b1, b2, 0, 0);
            skinWeights.push(w1, w2, 0, 0);
          }
        }

        for (let r = 0; r < legRings; r++) {
          for (let s = 0; s < legSegs; s++) {
            const a = startIndex + r * (legSegs + 1) + s;
            const b = startIndex + (r + 1) * (legSegs + 1) + s;
            const c = startIndex + (r + 1) * (legSegs + 1) + (s + 1);
            const d = startIndex + r * (legSegs + 1) + (s + 1);
            indices.push(a, b, d);
            indices.push(b, c, d);
          }
        }
      }

      appendTaproot(true);
      appendTaproot(false);

      // 3. Gnarled Root Arms & Claws (Left & Right - Tucked safely within pot bounds)
      function appendRootArm(isLeft) {
        const sign = isLeft ? -1 : 1;
        const shB = isLeft ? 8 : 11;
        const elB = isLeft ? 9 : 12;
        const hdB = isLeft ? 10 : 13;

        const armRings = 22;
        const armSegs = 14;
        const startIndex = positions.length / 3;

        for (let r = 0; r <= armRings; r++) {
          const v = r / armRings;
          // Smooth curve path from shoulder (v=0) through elbow (v=0.5) to hand (v=1.0)
          // Shoulder: (sign * 0.30, 1.29, 0.06)
          // Elbow:    (sign * 0.40, 0.95, 0.18)
          // Hand:     (sign * 0.34, 0.61, 0.26)
          let px, py, pz;
          if (v <= 0.5) {
            const t = v / 0.5;
            px = sign * (0.30 + t * 0.10);
            py = 1.29 - t * 0.34;
            pz = 0.06 + t * 0.12;
          } else {
            const t = (v - 0.5) / 0.5;
            px = sign * (0.40 - t * 0.06);
            py = 0.95 - t * 0.34;
            pz = 0.18 + t * 0.08;
          }

          const rad = (1.0 - v * 0.45) * 0.085;

          for (let s = 0; s <= armSegs; s++) {
            const u = s / armSegs;
            const theta = u * Math.PI * 2;

            const vx = px + Math.cos(theta) * rad * 0.8;
            const vy = py + Math.sin(theta) * rad;
            const vz = pz + Math.sin(theta * 2) * 0.02;

            positions.push(vx, vy, vz);
            uvs.push(u, v * 2);

            let b1 = shB, b2 = elB, w1 = 1, w2 = 0;
            if (v < 0.5) {
              const t = v / 0.5;
              w2 = t; w1 = 1.0 - t;
            } else {
              b1 = elB; b2 = hdB;
              const t = (v - 0.5) / 0.5;
              w2 = t; w1 = 1.0 - t;
            }

            skinIndices.push(b1, b2, 0, 0);
            skinWeights.push(w1, w2, 0, 0);
          }
        }

        for (let r = 0; r < armRings; r++) {
          for (let s = 0; s < armSegs; s++) {
            const a = startIndex + r * (armSegs + 1) + s;
            const b = startIndex + (r + 1) * (armSegs + 1) + s;
            const c = startIndex + (r + 1) * (armSegs + 1) + (s + 1);
            const d = startIndex + r * (armSegs + 1) + (s + 1);
            indices.push(a, b, d);
            indices.push(b, c, d);
          }
        }

        // Branching root claws / fingers at the hand tip (draping cleanly over front, r < 0.52)
        const clawCount = 4;
        for (let c = 0; c < clawCount; c++) {
          const clawStartIdx = positions.length / 3;
          const angleSpread = ((c - 1.5) / 1.5) * 0.45;
          const handX = sign * 0.34;
          const handY = 0.61;
          const handZ = 0.26;

          for (let cr = 0; cr <= 8; cr++) {
            const cv = cr / 8;
            const cx = handX + sign * (cv * 0.05 * Math.cos(angleSpread) - cv * 0.02);
            const cy = handY - cv * 0.24 + Math.sin(cv * Math.PI) * 0.04;
            const cz = handZ + cv * 0.10 + Math.sin(angleSpread) * 0.04 * cv;

            const crad = (1.0 - cv) * 0.025;

            for (let cs = 0; cs <= 6; cs++) {
              const cu = cs / 6;
              const ctheta = cu * Math.PI * 2;

              positions.push(cx + Math.cos(ctheta) * crad, cy + Math.sin(ctheta) * crad, cz);
              uvs.push(cu, cv);
              skinIndices.push(hdB, elB, 0, 0);
              skinWeights.push(0.9, 0.1, 0, 0);
            }
          }

          for (let cr = 0; cr < 8; cr++) {
            for (let cs = 0; cs < 6; cs++) {
              const a = clawStartIdx + cr * 7 + cs;
              const b = clawStartIdx + (cr + 1) * 7 + cs;
              const c = clawStartIdx + (cr + 1) * 7 + (cs + 1);
              const d = clawStartIdx + cr * 7 + (cs + 1);
              indices.push(a, b, d);
              indices.push(b, c, d);
            }
          }
        }
      }

      appendRootArm(true);
      appendRootArm(false);

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geo.setAttribute('skinIndex', new THREE.Uint16BufferAttribute(skinIndices, 4));
      geo.setAttribute('skinWeight', new THREE.Float32BufferAttribute(skinWeights, 4));
      geo.setIndex(indices);
      geo.computeVertexNormals();

      return geo;
    }

    const mandrakeSkinnedGeo = buildSculptedMandrakeGeometry();
    const mandrakeMesh = new THREE.SkinnedMesh(mandrakeSkinnedGeo, mandrakeMaterial);
    mandrakeMesh.add(rootBone);
    mandrakeMesh.bind(skeleton);
    mandrakeMesh.castShadow = true;
    mandrakeMesh.receiveShadow = true;
    mandrakeContainer.add(mandrakeMesh);

    // Initial nestled depth inside the clay pot
    mandrakeContainer.position.y = -0.55;

    // --- BIOLUMINESCENT ALCHEMICAL EYES ---
    // Deep, expressive glowing eyes seated safely inside the carved sockets
    const eyeGroup = new THREE.Group();
    headBone.add(eyeGroup);

    const eyeSocketGeo = new THREE.SphereGeometry(0.065, 24, 24);
    const eyePupilGeo = new THREE.SphereGeometry(0.038, 16, 16);

    const eyeScleraMat = new THREE.MeshStandardMaterial({
      color: 0x1a120b,
      roughness: 0.6,
      metalness: 0.2
    });

    const eyePupilMat = new THREE.MeshBasicMaterial({
      color: params.eyeColor
    });

    function createEye(x) {
      const g = new THREE.Group();
      g.position.set(x, 0.13, 0.22); // Perfectly centered in sockets

      const sclera = new THREE.Mesh(eyeSocketGeo, eyeScleraMat);
      sclera.scale.set(1.0, 0.85, 0.85);
      g.add(sclera);

      const pupil = new THREE.Mesh(eyePupilGeo, eyePupilMat);
      pupil.position.set(0, 0, 0.045);
      g.add(pupil);

      return g;
    }

    const leftEyeMesh = createEye(-0.16);
    const rightEyeMesh = createEye(0.16);
    eyeGroup.add(leftEyeMesh);
    eyeGroup.add(rightEyeMesh);

    // --- CROWN OF MANDRAKE NIGHTSHADE FOLIAGE ---
    const crownGroup = new THREE.Group();
    crownBone.add(crownGroup);
    crownGroup.position.set(0, 0.05, 0);

    const leafCount = 11;
    for (let l = 0; l < leafCount; l++) {
      const angle = (l / leafCount) * Math.PI * 2 + (l % 3) * 0.15;
      const leafLength = 0.75 + (l % 4) * 0.12;
      const leafGeo = new THREE.PlaneGeometry(0.24, leafLength, 8, 18);
      const lPos = leafGeo.attributes.position;

      for (let i = 0; i < lPos.count; i++) {
        let lx = lPos.getX(i);
        let ly = lPos.getY(i);
        let lz = lPos.getZ(i);

        const v = (ly + leafLength * 0.5) / leafLength; // 0 to 1

        // Natural arching curve
        const arch = Math.sin(v * Math.PI * 0.65) * 0.45;
        const forward = v * 0.7;

        // Cup leaf along central rib
        lz += Math.sin(Math.PI * (lx + 0.12) / 0.24) * 0.035;

        // Leaf outline taper
        lx *= Math.sin(v * Math.PI);
        // Serrated edge ripple
        lx += Math.sin(ly * 35.0) * 0.012 * v;

        const rx = Math.cos(angle) * (forward + lz) - Math.sin(angle) * lx;
        const rz = Math.sin(angle) * (forward + lz) + Math.cos(angle) * lx;
        const ry = arch - v * 0.35;

        lPos.setXYZ(i, rx, ry, rz);
      }
      leafGeo.computeVertexNormals();

      const leafMesh = new THREE.Mesh(leafGeo, leafMaterial);
      leafMesh.castShadow = true;
      crownGroup.add(leafMesh);
    }

    // Alchemical nightshade berries in center of crown
    const berryGeo = new THREE.SphereGeometry(0.04, 12, 12);
    const berryMat = new THREE.MeshStandardMaterial({
      color: params.screamColor,
      roughness: 0.2,
      metalness: 0.1,
      emissive: params.screamColor,
      emissiveIntensity: 0.6
    });
    for (let b = 0; b < 6; b++) {
      const bMesh = new THREE.Mesh(berryGeo, berryMat);
      const bAngle = (b / 6) * Math.PI * 2;
      bMesh.position.set(Math.cos(bAngle) * 0.1, 0.08, Math.sin(bAngle) * 0.1);
      crownGroup.add(bMesh);
    }

    // --- ROOT BEARD TENDRILS ---
    for (let tb = 0; tb < 5; tb++) {
      const tbAngle = (tb - 2) * 0.18;
      const beardCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(tbAngle * 0.4, -0.16, 0.18),
        new THREE.Vector3(tbAngle * 0.6, -0.32, 0.22),
        new THREE.Vector3(tbAngle * 0.8 + Math.sin(tb) * 0.05, -0.55, 0.18)
      ]);
      const beardGeo = new THREE.TubeGeometry(beardCurve, 14, 0.02, 8, false);
      const beardMesh = new THREE.Mesh(beardGeo, mandrakeMaterial);
      headBone.add(beardMesh);
    }

    // --- ETHEREAL ACOUSTIC SCREAM WAVES & SHOCKWAVES ---
    const mouthAnchor = new THREE.Group();
    headBone.add(mouthAnchor);
    mouthAnchor.position.set(0, -0.12, 0.25); // Positioned inside mouth cavity

    // Expanding concentric acoustic shockwaves
    const waveCount = 6;
    const screamWavefronts = [];
    const waveGeo = new THREE.RingGeometry(0.1, 0.22, 48);

    for (let w = 0; w < waveCount; w++) {
      const waveMat = new THREE.MeshBasicMaterial({
        color: params.screamColor,
        transparent: true,
        opacity: 0.0, // Strictly 0 in idle!
        side: THREE.DoubleSide,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });
      const waveMesh = new THREE.Mesh(waveGeo, waveMat);
      mouthAnchor.add(waveMesh);
      screamWavefronts.push({
        mesh: waveMesh,
        phase: w / waveCount,
        speed: 1.5
      });
    }

    // Conical acoustic sound particles (2,500 glowing points)
    const particleCount = 2500;
    const particleGeo = new THREE.BufferGeometry();
    const particlePos = new Float32Array(particleCount * 3);
    const particleVels = [];
    const particleLife = new Float32Array(particleCount);

    for (let p = 0; p < particleCount; p++) {
      particlePos[p * 3] = 0;
      particlePos[p * 3 + 1] = 0;
      particlePos[p * 3 + 2] = 0;

      const theta = (Math.random() - 0.5) * 0.9;
      const phi = (Math.random() - 0.5) * 0.9;
      const spd = 1.0 + Math.random() * 2.8;

      particleVels.push({
        vx: Math.sin(theta) * spd,
        vy: Math.sin(phi) * spd,
        vz: Math.cos(theta) * Math.cos(phi) * spd + 0.8
      });
      particleLife[p] = Math.random();
    }
    particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));

    function createSoftGlowTexture() {
      const cvs = document.createElement('canvas');
      cvs.width = 64;
      cvs.height = 64;
      const ctx = cvs.getContext('2d');
      const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
      grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
      grad.addColorStop(0.3, 'rgba(255, 255, 255, 0.7)');
      grad.addColorStop(0.7, 'rgba(255, 255, 255, 0.15)');
      grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 64, 64);
      return new THREE.CanvasTexture(cvs);
    }

    const particleMaterial = new THREE.PointsMaterial({
      size: 0.09,
      color: params.screamColor,
      map: createSoftGlowTexture(),
      transparent: true,
      opacity: 0.0,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });

    const screamParticles = new THREE.Points(particleGeo, particleMaterial);
    mouthAnchor.add(screamParticles);

    // Floating alchemical ambient cellar dust
    const dustCount = 800;
    const dustGeo = new THREE.BufferGeometry();
    const dustPos = new Float32Array(dustCount * 3);
    for (let d = 0; d < dustCount; d++) {
      dustPos[d * 3] = (Math.random() - 0.5) * 7.0;
      dustPos[d * 3 + 1] = Math.random() * 4.5 - 1.0;
      dustPos[d * 3 + 2] = (Math.random() - 0.5) * 7.0;
    }
    dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
    const dustMat = new THREE.PointsMaterial({
      size: 0.035,
      color: 0x99bb88,
      transparent: true,
      opacity: 0.35,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });
    const cellarDust = new THREE.Points(dustGeo, dustMat);
    scene.add(cellarDust);

    // --- GSAP VERTICAL EXTRACTION & WAIL INTERACTION ---
    let isPulling = false;
    let screamProgress = 0.0;
    let extractionTimeline = null;

    function triggerExtraction(userForced = false) {
      if (isPulling && !userForced) return;

      if (extractionTimeline) {
        extractionTimeline.kill();
      }

      isPulling = true;
      extractionTimeline = gsap.timeline({
        onComplete: () => {
          isPulling = false;
          extractionLoopTimer = 0;
        }
      });

      // 1. Initial strain dip into soil
      extractionTimeline.to(mandrakeContainer.position, {
        y: -0.72,
        duration: 0.35,
        ease: "power2.in"
      })
      // 2. Powerful vertical emergence up out of the pot
      .to(mandrakeContainer.position, {
        y: 0.95,
        duration: 1.5,
        ease: "back.out(1.4)",
        onUpdate: () => {
          params.emergenceProgress = THREE.MathUtils.clamp((mandrakeContainer.position.y + 0.72) / 1.67, 0, 1);
        }
      })
      // 3. Jaw drops open wide & head tilts back in horrific agony
      .to(jawBone.rotation, {
        x: 0.82,
        duration: 0.55,
        ease: "power2.out"
      }, "-=1.0")
      .to(headBone.rotation, {
        x: -0.36,
        duration: 0.7,
        ease: "power2.out"
      }, "-=1.0")
      // 4. Arms flex, writhe and claws splay (only when high above pot rim!)
      .to(leftShoulder.rotation, {
        z: -0.75,
        y: 0.35,
        x: -0.2,
        duration: 0.9,
        ease: "elastic.out(1, 0.4)"
      }, "-=1.1")
      .to(rightShoulder.rotation, {
        z: 0.75,
        y: -0.35,
        x: -0.2,
        duration: 0.9,
        ease: "elastic.out(1, 0.4)"
      }, "-=1.1")
      // 5. Soundwave flash and acoustic burst
      .to(screamLight, {
        intensity: params.screamIntensity * 3.8,
        duration: 0.35,
        yoyo: true,
        repeat: 4
      }, "-=0.8")
      .to({ val: 0 }, {
        val: 1,
        duration: 1.8,
        onUpdate: function() {
          screamProgress = this.targets()[0].val;
          particleMaterial.opacity = screamProgress * 0.95;
        }
      }, "-=1.2")
      // 6. Hold wail at apex
      .to({}, { duration: 1.4 })
      // 7. Subside wail and settle back
      .to({ val: 1 }, {
        val: 0,
        duration: 1.2,
        onUpdate: function() {
          screamProgress = this.targets()[0].val;
          particleMaterial.opacity = screamProgress * 0.95;
        }
      })
      .to(jawBone.rotation, {
        x: 0.04,
        duration: 1.1,
        ease: "power2.inOut"
      }, "-=0.9")
      .to(headBone.rotation, {
        x: 0.0,
        duration: 1.1,
        ease: "power2.inOut"
      }, "-=0.9")
      // Fold arms back inwards tightly BEFORE descending back down into pot
      .to([leftShoulder.rotation, rightShoulder.rotation], {
        x: 0.0,
        y: 0.0,
        z: 0.0,
        duration: 1.2,
        ease: "power2.inOut"
      }, "-=1.0")
      // Descend back down into the pot
      .to(mandrakeContainer.position, {
        y: -0.55,
        duration: 1.6,
        ease: "power2.inOut",
        onUpdate: () => {
          params.emergenceProgress = THREE.MathUtils.clamp((mandrakeContainer.position.y + 0.72) / 1.67, 0, 1);
        }
      }, "-=0.8");
    }

    // --- APPLY COLOR SCHEME ---
    function applyPalette(palName) {
      const pal = PALETTES[palName];
      if (!pal) return;
      params.paletteName = palName;

      params.rootBarkColor = pal.rootBark;
      params.leafColor = pal.leaves;
      params.eyeColor = pal.eyes;
      params.potColor = pal.pot;
      params.runeColor = pal.runes;
      params.soilColor = pal.soil;
      params.screamColor = pal.scream;

      params.ambientColor = pal.ambient;
      params.keyColor = pal.keyLight;
      params.rimColor = pal.rimLight;
      params.fillColor = pal.fillLight;

      // Update materials
      mandrakeMaterial.color.set(pal.rootBark);
      leafMaterial.color.set(pal.leaves);
      eyePupilMat.color.set(pal.eyes);
      berryMat.color.set(pal.scream);
      berryMat.emissive.set(pal.scream);
      potMaterial.color.set(pal.pot);
      potMaterial.emissive.set(pal.runes);
      soilMaterial.color.set(pal.soil);

      // Acoustic wave & particles
      screamWavefronts.forEach(w => w.mesh.material.color.set(pal.scream));
      particleMaterial.color.set(pal.scream);

      // Lights
      ambientLight.color.set(pal.ambient);
      keyLight.color.set(pal.keyLight);
      rimLight.color.set(pal.rimLight);
      potFillLight.color.set(pal.fillLight);
      screamLight.color.set(pal.screamLight);

      // Environment & Fog
      if (params.greenscreen) {
        scene.background = new THREE.Color("#00ff00");
        scene.fog = null;
      } else {
        scene.background = new THREE.Color(pal.bg);
        scene.fog = new THREE.FogExp2(pal.fog, 0.08);
      }

      gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    // --- PROCEDURAL RANDOMIZER (CLICK TO REROLL) ---
    function randomizeEverything() {
      const keys = Object.keys(PALETTES);
      const chosen = keys[Math.floor(Math.random() * keys.length)];
      applyPalette(chosen);

      params.shiverIntensity = 0.6 + Math.random() * 1.5;
      params.speed = 0.7 + Math.random() * 0.8;
      params.exposure = 1.1 + Math.random() * 0.5;
      params.rootGirth = 0.88 + Math.random() * 0.28;
      params.ambientIntensity = 0.4 + Math.random() * 0.4;
      params.keyIntensity = 2.2 + Math.random() * 1.4;
      params.rimIntensity = 1.8 + Math.random() * 1.2;
      params.screamIntensity = 2.5 + Math.random() * 2.0;

      renderer.toneMappingExposure = params.exposure;
      ambientLight.intensity = params.ambientIntensity;
      keyLight.intensity = params.keyIntensity;
      rimLight.intensity = params.rimIntensity;
      mandrakeContainer.scale.set(params.rootGirth, 1.0, params.rootGirth);

      triggerExtraction(true);
      gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    function resetCameraPose() {
      gsap.to(camera.position, {
        x: 0,
        y: 1.4,
        z: 4.6,
        duration: 1.2,
        ease: "power2.inOut"
      });
      gsap.to(controls.target, {
        x: 0,
        y: 0.65,
        z: 0,
        duration: 1.2,
        ease: "power2.inOut"
      });
    }

    // --- CLICK INTERACTION BINDINGS ---
    let pointerDownPos = { x: 0, y: 0 };
    let pointerDownTime = 0;

    function bindInteractionEvents() {
      renderer.domElement.addEventListener('pointerdown', (e) => {
        pointerDownPos = { x: e.clientX, y: e.clientY };
        pointerDownTime = performance.now();
      });

      renderer.domElement.addEventListener('pointerup', (e) => {
        const dx = e.clientX - pointerDownPos.x;
        const dy = e.clientY - pointerDownPos.y;
        const dist = Math.hypot(dx, dy);
        const dt = performance.now() - pointerDownTime;

        if (dist < 6 && dt < 450) {
          if (params.randomizeOnClick) {
            randomizeEverything();
          } else {
            triggerExtraction(true);
          }
        }
      });
    }

    // --- 8 PRECONFIGURED ANIMATION PRESETS ---
    const ANIMATIONS = [
      "Static (No Camera Motion)",
      "Alchemical Extraction & Wail",
      "Mystic Turntable Orbit",
      "Violent Shiver & Tremor",
      "Slow Arcane Levitation",
      "Wailing Crescendo & Pulse",
      "Earthbound Slumber",
      "Alchemist Close-up Inspection"
    ];

    // --- KEYBOARD LISTENER (H to hide/show UI) ---
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        if (gui._hidden) {
          gui.show();
        } else {
          gui.hide();
        }
      }
    });

    // --- LIL-GUI SETUP ---
    const gui = new GUI({ title: "Mandrake Control" });

    const fPresets = gui.addFolder("Presets & Themes");
    fPresets.add(params, "paletteName", Object.keys(PALETTES)).name("Color Scheme").onChange(applyPalette);
    fPresets.add(params, "animation", ANIMATIONS).name("Animation Preset").onChange(name => {
      if (name === "Static (No Camera Motion)") {
        resetCameraPose();
      }
    });
    fPresets.add(params, "randomizeOnClick").name("Click Reroll Theme");
    fPresets.add(params, "randomizeTheme").name("⚡ Randomize Scene Now");
    fPresets.add(params, "triggerPull").name("🌱 Trigger Extraction");

    const fDisplay = gui.addFolder("Display & Camera");
    fDisplay.add(params, "greenscreen").name("Greenscreen (#00ff00)").onChange(val => {
      if (val) {
        scene.background = new THREE.Color("#00ff00");
        scene.fog = null;
      } else {
        const pal = PALETTES[params.paletteName];
        scene.background = new THREE.Color(pal.bg);
        scene.fog = new THREE.FogExp2(pal.fog, 0.08);
      }
    });
    fDisplay.add(params, "dpr", 0.5, 3.0, 0.1).name("Pixel Ratio (DPR)").onChange(v => renderer.setPixelRatio(v));
    fDisplay.add(params, "antialias").name("Antialias (FX)").onChange(v => initRenderer(v));
    fDisplay.add(params, "speed", 0.1, 3.0, 0.05).name("Animation Speed");
    fDisplay.add(params, "exposure", 0.2, 3.0, 0.05).name("Scene Exposure").onChange(v => renderer.toneMappingExposure = v);
    fDisplay.add(params, "resetCamera").name("Reset Camera");

    const fLighting = gui.addFolder("Lighting Controls");
    fLighting.add(params, "ambientIntensity", 0.0, 2.0, 0.05).name("Ambient Intensity").onChange(v => ambientLight.intensity = v);
    fLighting.addColor(params, "ambientColor").name("Ambient Color").onChange(c => ambientLight.color.set(c));

    fLighting.add(params, "keyIntensity", 0.0, 6.0, 0.1).name("Key Light Intensity").onChange(v => keyLight.intensity = v);
    fLighting.addColor(params, "keyColor").name("Key Light Color").onChange(c => keyLight.color.set(c));

    fLighting.add(params, "rimIntensity", 0.0, 5.0, 0.1).name("Rim Light Intensity").onChange(v => rimLight.intensity = v);
    fLighting.addColor(params, "rimColor").name("Rim Light Color").onChange(c => rimLight.color.set(c));

    fLighting.add(params, "fillIntensity", 0.0, 4.0, 0.1).name("Pot Glow Intensity").onChange(v => potFillLight.intensity = v);
    fLighting.addColor(params, "fillColor").name("Pot Glow Color").onChange(c => potFillLight.color.set(c));

    fLighting.add(params, "screamIntensity", 0.0, 6.0, 0.1).name("Scream Light Flare");
    fLighting.addColor(params, "screamColor").name("Scream Light Color").onChange(c => {
      screamLight.color.set(c);
      particleMaterial.color.set(c);
      screamWavefronts.forEach(w => w.mesh.material.color.set(c));
    });

    const fCreature = gui.addFolder("Creature & Pot");
    fCreature.add(params, "shiverIntensity", 0.0, 3.0, 0.05).name("Shiver Intensity");
    fCreature.add(params, "rootGirth", 0.7, 1.5, 0.05).name("Root Trunk Scale").onChange(v => {
      mandrakeContainer.scale.set(v, 1.0, v);
    });
    fCreature.addColor(params, "rootBarkColor").name("Bark Color").onChange(c => mandrakeMaterial.color.set(c));
    fCreature.addColor(params, "leafColor").name("Leaves Color").onChange(c => leafMaterial.color.set(c));
    fCreature.addColor(params, "eyeColor").name("Eyes Color").onChange(c => eyePupilMat.color.set(c));
    fCreature.addColor(params, "potColor").name("Pot Clay Color").onChange(c => potMaterial.color.set(c));
    fCreature.addColor(params, "runeColor").name("Rune Glow Color").onChange(c => potMaterial.emissive.set(c));
    fCreature.addColor(params, "soilColor").name("Soil Color").onChange(c => soilMaterial.color.set(c));

    applyPalette(params.paletteName);

    // --- AUTO INFINITE RENDER & ANIMATION LOOP ---
    const clock = new THREE.Clock();
    let extractionLoopTimer = 1.8; // Trigger first extraction promptly after ~1.2s

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta() * params.speed;
      const elapsedTime = clock.getElapsedTime() * params.speed;

      controls.update();

      // Emergence dynamically tracks vertical height of mandrake root
      const emergence = THREE.MathUtils.clamp((mandrakeContainer.position.y - (-0.65)) / 1.5, 0, 1);
      params.emergenceProgress = emergence;

      // 1. Shivering & Gnarled Root Limbs Vertex Skinning
      const shiverScale = params.shiverIntensity;
      const fastTremor = Math.sin(elapsedTime * 30.0) * 0.045 * shiverScale;
      const breathing = Math.sin(elapsedTime * 2.4) * 0.025;

      // Spine twitches
      spineLower.rotation.z = Math.sin(elapsedTime * 15.0) * 0.025 * shiverScale;
      spineUpper.rotation.x = Math.cos(elapsedTime * 20.0) * 0.03 * shiverScale + breathing;
      chestBone.rotation.y = Math.sin(elapsedTime * 12.0) * 0.02 * shiverScale;
      neckBone.rotation.z = Math.sin(elapsedTime * 24.0) * 0.035 * shiverScale;

      // Root arm & claw flex (Strictly tucked inside pot when hided; wide & expressive when emerged!)
      const armFlexScale = 0.12 + 0.88 * emergence;
      leftElbow.rotation.z = (-0.03 + Math.sin(elapsedTime * 14.0) * 0.03 * shiverScale) * armFlexScale;
      rightElbow.rotation.z = (0.03 - Math.cos(elapsedTime * 14.0) * 0.03 * shiverScale) * armFlexScale;
      leftHand.rotation.x = (Math.sin(elapsedTime * 20.0) * 0.06 * shiverScale) * armFlexScale;
      rightHand.rotation.x = (Math.cos(elapsedTime * 20.0) * 0.06 * shiverScale) * armFlexScale;

      // Taproot struggle
      leftKnee.rotation.x = Math.sin(elapsedTime * 11.0) * 0.07 * shiverScale;
      rightKnee.rotation.x = Math.cos(elapsedTime * 11.0) * 0.07 * shiverScale;
      leftRootTip.rotation.z = Math.sin(elapsedTime * 16.0) * 0.09 * shiverScale;
      rightRootTip.rotation.z = -Math.sin(elapsedTime * 16.0) * 0.09 * shiverScale;

      // Crown leaves fluttering in mystical updraft
      crownBone.rotation.y = Math.sin(elapsedTime * 2.8) * 0.07;
      crownBone.rotation.z = fastTremor * 0.9;

      // Soil chunks shift dynamically when mandrake is uprooted
      soilChunks.forEach((sc, idx) => {
        const lift = params.emergenceProgress * 0.28 * (1 + Math.sin(elapsedTime * 6 + idx) * 0.2);
        sc.mesh.position.y = sc.baseY + lift;
        sc.mesh.rotation.x += delta * 0.4;
      });

      // 2. Scream Shockwave Waves Animation (Expanding from mouth orifice)
      const isScreaming = screamProgress > 0.02;
      screamWavefronts.forEach(wf => {
        if (isScreaming) {
          wf.phase = (wf.phase + delta * wf.speed) % 1.0;
          const scale = 0.2 + wf.phase * 3.8;
          wf.mesh.scale.set(scale, scale, scale);
          wf.mesh.position.z = wf.phase * 0.6; // travels forward along +Z

          // Fade out as it expands
          const op = Math.sin(wf.phase * Math.PI) * screamProgress * 0.85;
          wf.mesh.material.opacity = Math.max(0, op);
        } else {
          wf.mesh.material.opacity = 0; // Completely invisible in idle!
        }
      });

      // 3. Acoustic Spore Particles
      const pAttr = particleGeo.attributes.position;
      for (let p = 0; p < particleCount; p++) {
        particleLife[p] += delta * (isScreaming ? 2.2 : 0.4);
        if (particleLife[p] > 1.0) {
          particleLife[p] = 0;
          pAttr.setXYZ(p, 0, 0, 0);
        }

        const life = particleLife[p];
        const vel = particleVels[p];
        const spdMult = isScreaming ? 2.8 : 0.5;

        const curX = vel.vx * life * spdMult + Math.sin(life * 18.0 + p) * 0.08;
        const curY = vel.vy * life * spdMult + Math.cos(life * 18.0 + p) * 0.08;
        const curZ = vel.vz * life * spdMult;

        pAttr.setXYZ(p, curX, curY, curZ);
      }
      pAttr.needsUpdate = true;

      // Cellar dust slow drift
      const dPos = dustGeo.attributes.position;
      for (let d = 0; d < dustCount; d++) {
        let dy = dPos.getY(d) + delta * 0.06;
        if (dy > 3.5) dy = -1.0;
        dPos.setY(d, dy);
      }
      dustGeo.attributes.position.needsUpdate = true;

      // Pot runes glow pulsation
      potMaterial.emissiveIntensity = 1.0 + Math.sin(elapsedTime * 3.5) * 0.4 + screamProgress * 1.8;

      // Update scream point light position in sync with mouth
      const mouthWorldPos = new THREE.Vector3();
      mouthAnchor.getWorldPosition(mouthWorldPos);
      screamLight.position.copy(mouthWorldPos);

      // 4. PRECONFIGURED ANIMATION PRESET BEHAVIORS (ALL AUTOMATIC & LOOPED)
      extractionLoopTimer += delta;

      switch (params.animation) {
        case "Static (No Camera Motion)":
          // Automatic looped extraction with static camera
          if (extractionLoopTimer > 2.5 && !isPulling) {
            extractionLoopTimer = 0;
            triggerExtraction(false);
          }
          break;

        case "Alchemical Extraction & Wail":
          // Automatic looped extraction with gentle camera drift
          if (extractionLoopTimer > 2.5 && !isPulling) {
            extractionLoopTimer = 0;
            triggerExtraction(false);
          }
          camera.position.x = Math.sin(elapsedTime * 0.35) * 0.5;
          camera.position.y = 1.4 + Math.cos(elapsedTime * 0.25) * 0.2;
          break;

        case "Mystic Turntable Orbit":
          if (extractionLoopTimer > 3.0 && !isPulling) {
            extractionLoopTimer = 0;
            triggerExtraction(false);
          }
          const orbitDist = 4.6;
          camera.position.x = Math.sin(elapsedTime * 0.22) * orbitDist;
          camera.position.z = Math.cos(elapsedTime * 0.22) * orbitDist;
          camera.position.y = 1.4 + Math.sin(elapsedTime * 0.12) * 0.35;
          controls.target.set(0, 0.65, 0);
          break;

        case "Violent Shiver & Tremor":
          mandrakeContainer.position.y = -0.15 + Math.sin(elapsedTime * 20.0) * 0.09;
          jawBone.rotation.x = 0.35 + Math.sin(elapsedTime * 36.0) * 0.22;
          params.shiverIntensity = 2.6;
          screamLight.intensity = (params.screamIntensity * 1.4) * (0.5 + Math.sin(elapsedTime * 22.0) * 0.5);
          break;

        case "Slow Arcane Levitation":
          mandrakeContainer.position.y = 0.9 + Math.sin(elapsedTime * 1.1) * 0.22;
          leftHip.rotation.z = Math.sin(elapsedTime * 1.4) * 0.25;
          rightHip.rotation.z = -Math.sin(elapsedTime * 1.4) * 0.25;
          camera.position.x = Math.sin(elapsedTime * 0.18) * 4.2;
          camera.position.z = Math.cos(elapsedTime * 0.18) * 4.2;
          camera.position.y = 1.5 + Math.cos(elapsedTime * 0.25) * 0.25;
          break;

        case "Wailing Crescendo & Pulse":
          const pulse = (Math.sin(elapsedTime * 1.4) + 1.0) * 0.5;
          jawBone.rotation.x = pulse * 0.76;
          headBone.rotation.x = -pulse * 0.38;
          mandrakeContainer.position.y = -0.4 + pulse * 1.15;
          screamProgress = pulse;
          particleMaterial.opacity = pulse * 0.95;
          screamLight.intensity = pulse * params.screamIntensity * 3.5;
          break;

        case "Earthbound Slumber":
          mandrakeContainer.position.y = -0.65 + Math.sin(elapsedTime * 1.1) * 0.035;
          jawBone.rotation.x = 0.0;
          headBone.rotation.x = 0.12;
          leftShoulder.rotation.set(0, 0, 0);
          rightShoulder.rotation.set(0, 0, 0);
          params.shiverIntensity = 0.25;
          break;

        case "Alchemist Close-up Inspection":
          if (extractionLoopTimer > 3.2 && !isPulling) {
            extractionLoopTimer = 0;
            triggerExtraction(false);
          }
          const inspectT = elapsedTime * 0.22;
          camera.position.x = Math.sin(inspectT) * 1.8;
          camera.position.z = Math.cos(inspectT) * 1.9 + 0.3;
          camera.position.y = 1.3 + Math.sin(inspectT * 1.4) * 0.5;
          controls.target.set(0, 1.1, 0);
          break;
      }

      renderer.render(scene, camera);
    }

    animate();

    // --- RESIZE EVENT ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
