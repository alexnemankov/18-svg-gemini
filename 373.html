<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Podium & Fluid Gold</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    #webgl-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
    }
  }
  </script>
</head>
<body>
  <canvas id="webgl-canvas"></canvas>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import GUI from 'lil-gui';

    // =============================================================
    // POST PROCESSOR SUITE (From postprocessing/PostProcessor.js)
    // =============================================================
    const orthoVertexShader = `
    precision highp float;
    in vec3 position;
    out vec2 vUv;
    void main() {
      vUv = position.xy * 0.5 + 0.5;
      gl_Position = vec4(position, 1.0);
    }
    `;

    const brightFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float bloomThreshold;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float luminance = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float knee = 0.1;
      float soft = luminance - bloomThreshold + knee;
      soft = clamp(soft, 0.0, 2.0 * knee);
      soft = (soft * soft) / (4.0 * knee + 0.00001);
      float contribution = max(soft, luminance - bloomThreshold);
      contribution /= max(luminance, 0.00001);
      fragColor = vec4(color.rgb * contribution, color.a);
    }
    `;

    const blur13ShaderChunk = `
    vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
      vec2 resolution = vec2(textureSize(image, 0));
      vec4 color = vec4(0.0);
      vec2 off1 = vec2(1.411764705882353) * direction;
      vec2 off2 = vec2(3.2941176470588234) * direction;
      vec2 off3 = vec2(5.176470588235294) * direction;
      color += texture(image, uv) * 0.1964825501511404;
      color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
      color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
      return color;
    }
    `;

    const blurFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 direction;
    in vec2 vUv;
    out vec4 color;
    ${blur13ShaderChunk}
    void main() {
      color = blur13(inputTexture, vUv, direction);
    }
    `;

    const godRaysDepthMaskShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float threshold;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float lum = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float factor = smoothstep(threshold, threshold + 0.15, lum);
      fragColor = vec4(vec3(factor), 1.0);
    }
    `;

    const godRaysGenerateShader = `
    precision highp float;
    #define TAPS_PER_PASS 6.0

    uniform sampler2D inputTexture;
    uniform vec3 vSunPositionScreenSpace;
    uniform float fStepSize;
    uniform float distanceAttenuation;
    uniform float maxDensity;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec2 delta = vSunPositionScreenSpace.xy - vUv;
      float dist = length(delta);
      vec2 stepv = fStepSize * delta / max(dist, 0.0001);
      float iters = dist / max(fStepSize, 0.00001);

      vec2 uv = vUv;
      float col = 0.0;
      float f = min(1.0, max(vSunPositionScreenSpace.z, 0.0));
      float atten = 1.0 / (1.0 + pow(dist, distanceAttenuation));

      if (0.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (1.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (2.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (3.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (4.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (5.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;

      float finalVal = min(col / TAPS_PER_PASS * atten, maxDensity);
      fragColor = vec4(vec3(finalVal), 1.0);
    }
    `;

    const anamorphicBrightShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float threshold;
    uniform float smoothWidth;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float v = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float alpha = smoothstep(threshold, threshold + smoothWidth, v);
      fragColor = mix(vec4(0.0), color, alpha);
    }
    `;

    const anamorphicBlurShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 resolution;
    uniform float samples;
    uniform float intensity;
    uniform vec3 tintColor;
    uniform float bloomRadius;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      int halfSamples = max(1, int(samples) / 2);
      float fHalfSamples = float(halfSamples);
      vec2 invSize = 1.0 / resolution;
      vec4 total = vec4(0.0);

      for (int i = -64; i <= 64; i++) {
        if (i < -halfSamples || i > halfSamples) continue;
        float softness = 1.0 - abs(float(i)) / fHalfSamples;
        softness = pow(softness, 2.0);
        vec2 shiftedUV = vec2(vUv.x + invSize.x * float(i) * (4.0 + bloomRadius * 8.0), vUv.y);
        shiftedUV = clamp(shiftedUV, 0.001, 0.999);
        total += texture(inputTexture, shiftedUV) * softness;
      }

      fragColor = (total / (samples / 3.0)) * vec4(tintColor, 1.0) * intensity;
    }
    `;

    const finalFragmentShader = `
    precision highp float;
    uniform vec2 resolution;
    uniform sampler2D inputTexture;
    uniform sampler2D blur0Texture;
    uniform sampler2D blur1Texture;
    uniform sampler2D blur2Texture;
    uniform sampler2D blur3Texture;
    uniform sampler2D blur4Texture;
    uniform sampler2D raysTexture;
    uniform sampler2D anamorphicTexture;
    uniform bool bloomEnabled;
    uniform float bloomStrength;
    uniform bool raysEnabled;
    uniform float raysStrength;
    uniform vec3 raysColor;
    uniform bool anamorphicEnabled;
    uniform float vignetteBoost;
    uniform float vignetteReduction;
    uniform float noiseIntensity;
    uniform float time;
    in vec2 vUv;
    out vec4 fragColor;

    float vignette(vec2 uv, float boost, float reduction) {
      vec2 position = vUv - 0.5;
      return boost - length(position) * reduction;
    }

    float hash1(uint n) {
      n = (n << 13U) ^ n;
      n = n * (n * n * 15731U + 789221U) + 1376312589U;
      return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
    }

    float noise(in vec2 uv, in float timeVal) {
      uvec2 p = uvec2(uv);
      return hash1(p.x + 1920U * p.y + (1920U * 1080U) * uint(timeVal));
    }

    void main() {
      vec4 color = texture(inputTexture, vUv);

      if (bloomEnabled && bloomStrength > 0.001) {
        vec4 b0 = texture(blur0Texture, vUv);
        vec4 b1 = texture(blur1Texture, vUv);
        vec4 b2 = texture(blur2Texture, vUv);
        vec4 b3 = texture(blur3Texture, vUv);
        vec4 b4 = texture(blur4Texture, vUv);
        vec4 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
        color += bloomSum * bloomStrength;
      }

      if (raysEnabled && raysStrength > 0.001) {
        vec4 r = texture(raysTexture, vUv);
        color.rgb += r.rgb * raysColor * raysStrength;
      }

      if (anamorphicEnabled) {
        vec4 a = texture(anamorphicTexture, vUv);
        color.rgb += a.rgb;
      }

      color.rgb *= vignette(vUv, vignetteBoost, vignetteReduction);
      color.rgb += noiseIntensity * noise(gl_FragCoord.xy, time);
      fragColor = vec4(color.rgb, 1.0);
    }
    `;

    const chromaticAberrationShaderChunk = `
    vec2 barrelDistortion(vec2 coord, float amt) {
      vec2 cc = coord - 0.5;
      float dist = dot(cc, cc);
      return coord + cc * dist * amt;
    }
    float sat(float t) { return clamp(t, 0.0, 1.0); }
    float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
    float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
    vec4 spectrum_offset(float t) {
      float lo = step(t, 0.5);
      float hi = 1.0 - lo;
      float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
      vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
      return pow(ret, vec4(1.0 / 2.2));
    }
    const float max_distort = 2.2;
    const int num_iter = 8;
    const float reci_num_iter_f = 1.0 / float(num_iter);
    vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
      vec4 sumcol = vec4(0.0);
      vec4 sumw = vec4(0.0);
      for (int i = 0; i < num_iter; ++i) {
        float t = float(i) * reci_num_iter_f;
        vec4 w = spectrum_offset(t);
        sumw += w;
        sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
      }
      return sumcol / sumw;
    }
    `;

    const colorFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float chromaticAberrationAmount;
    uniform float minInputLevel;
    uniform float maxInputLevel;
    uniform float gammaLevel;
    uniform float exposure;
    uniform float fisheyeStrength;
    uniform float fisheyeRadius;
    uniform float time;
    uniform int visionMode;
    uniform float thermalSensitivity;
    uniform float nightVisionNoise;
    uniform float nightVisionGain;
    uniform float crtIntensity;
    in vec2 vUv;
    out vec4 fragColor;

    ${chromaticAberrationShaderChunk}

    vec2 applyFisheye(vec2 uv, float strength, float radius) {
      if (abs(strength) < 0.0001) return uv;
      vec2 p = uv - 0.5;
      float d = length(p);
      if (d > radius * 1.5) return uv;
      float r = d / max(radius, 0.001);
      float theta = atan(p.y, p.x);
      float rDist = r + strength * (r * r * r);
      return 0.5 + vec2(cos(theta), sin(theta)) * (rDist * radius);
    }

    vec3 ACESFilmicToneMapping(vec3 color) {
      float a = 2.51;
      float b = 0.03;
      float c = 2.43;
      float d = 0.59;
      float e = 0.14;
      return clamp((color * (a * color + b)) / (color * (c * color + d) + e), 0.0, 1.0);
    }

    vec3 gammaCorrect(vec3 color, vec3 gamma) {
      return pow(max(color, vec3(0.0)), 1.0 / gamma);
    }
    vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
      return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
    }
    vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
      return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
    }

    vec3 applyNightVision(vec3 color, vec2 uv, float timeVal, float noiseAmt, float gain, float crt) {
      float lum = dot(color, vec3(0.299, 0.587, 0.114));
      float amplified = pow(lum * gain, 0.72);
      vec3 phosphorColor = mix(vec3(0.02, 0.12, 0.03), vec3(0.18, 1.0, 0.32), clamp(amplified, 0.0, 1.0));
      phosphorColor += vec3(0.7, 1.0, 0.8) * max(0.0, amplified - 0.75) * 1.8;
      vec2 p = uv - 0.5;
      float tubeDist = length(p);
      float tubeMask = smoothstep(0.72, 0.44, tubeDist);
      float n = fract(sin(dot(uv * 280.0 + timeVal * 0.05, vec2(12.9898, 78.233))) * 43758.5453);
      float scanline = sin(uv.y * 650.0) * crt;
      phosphorColor += (n - 0.5) * noiseAmt * 2.0 + scanline;
      return clamp(phosphorColor * tubeMask, 0.0, 1.0);
    }

    vec3 ironbow(float t) {
      t = clamp(t, 0.0, 1.0);
      vec3 c0 = vec3(0.02, 0.01, 0.18);
      vec3 c1 = vec3(0.22, 0.02, 0.48);
      vec3 c2 = vec3(0.82, 0.05, 0.25);
      vec3 c3 = vec3(1.0, 0.62, 0.02);
      vec3 c4 = vec3(1.0, 1.0, 0.92);
      if (t < 0.25) return mix(c0, c1, t * 4.0);
      if (t < 0.50) return mix(c1, c2, (t - 0.25) * 4.0);
      if (t < 0.75) return mix(c2, c3, (t - 0.50) * 4.0);
      return mix(c3, c4, (t - 0.75) * 4.0);
    }

    vec3 applyThermal(vec3 color, vec2 uv, float sensitivity, float crt, bool whiteHot) {
      float lum = dot(color, vec3(0.299, 0.587, 0.114));
      float heat = clamp(lum * sensitivity, 0.0, 1.0);
      float sensorRaster = sin(uv.y * 900.0) * (crt * 0.3);
      heat = clamp(heat + sensorRaster, 0.0, 1.0);
      if (whiteHot) {
        return vec3(pow(heat, 0.85));
      } else {
        return ironbow(heat);
      }
    }

    void main() {
      vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
      vec4 col = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
      vec3 finalCol = col.rgb;

      if (visionMode == 1) {
        finalCol = applyNightVision(finalCol, uv, time, nightVisionNoise, nightVisionGain, crtIntensity);
      } else if (visionMode == 2) {
        finalCol = applyThermal(finalCol, uv, thermalSensitivity, crtIntensity, false);
      } else if (visionMode == 3) {
        finalCol = applyThermal(finalCol, uv, thermalSensitivity, crtIntensity, true);
      } else {
        vec3 exposedColor = finalCol * exposure;
        vec3 toneMappedColor = ACESFilmicToneMapping(exposedColor);
        finalCol = finalLevels(toneMappedColor, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
      }

      fragColor = vec4(finalCol, 1.0);
    }
    `;

    const copyFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      fragColor = texture(inputTexture, vUv);
    }
    `;

    function createFBO(w, h, options = {}) {
      return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
        wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
        wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
        minFilter: options.minFilter || THREE.LinearFilter,
        magFilter: options.magFilter || THREE.LinearFilter,
        format: options.format || THREE.RGBAFormat,
        type: options.type || THREE.HalfFloatType,
        stencilBuffer: options.stencilBuffer || false,
        depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : true,
        samples: options.samples || 0,
      });
    }

    class ShaderPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbo = createFBO(1, 1, options);
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
        this.texture = this.fbo.texture;
      }
      render(rend, toScreen = false) {
        if (!toScreen) rend.setRenderTarget(this.fbo);
        rend.render(this.orthoScene, this.orthoCamera);
        if (!toScreen) rend.setRenderTarget(null);
      }
      setSize(width, height) {
        this.fbo.setSize(Math.max(1, width), Math.max(1, height));
        this.orthoQuad.scale.set(width, height, 1);
      }
    }

    class ShaderPingPongPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
        this.currentFBO = 0;
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
      }
      render(rend) {
        rend.setRenderTarget(this.fbos[1 - this.currentFBO]);
        rend.render(this.orthoScene, this.orthoCamera);
        rend.setRenderTarget(null);
        this.currentFBO = 1 - this.currentFBO;
      }
      get current() { return this.fbos[this.currentFBO]; }
      get texture() { return this.current.texture; }
      setSize(width, height) {
        const w = Math.max(1, width);
        const h = Math.max(1, height);
        this.orthoQuad.scale.set(w, h, 1);
        this.fbos[0].setSize(w, h);
        this.fbos[1].setSize(w, h);
      }
    }

    class BloomPass {
      constructor(strength = 0.8, radius = 0.5, threshold = 0.2, levels = 5) {
        this.strength = strength;
        this.radius = radius;
        this.threshold = threshold;
        this.enabled = true;
        this.levels = levels;

        this.brightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            bloomThreshold: { value: this.threshold },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: brightFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.brightPass = new ShaderPass(this.brightShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.blurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            direction: { value: new THREE.Vector2(0, 1) },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: blurFragmentShader,
          glslVersion: THREE.GLSL3,
        });

        this.blurPasses = [];
        for (let i = 0; i < this.levels; i++) {
          this.blurPasses.push(new ShaderPingPongPass(this.blurShader, {
            format: THREE.RGBAFormat,
            type: THREE.HalfFloatType,
          }));
        }
      }

      setSize(w, h) {
        let tw = Math.max(1, w);
        let th = Math.max(1, h);
        this.brightPass.setSize(tw, th);
        for (let i = 0; i < this.levels; i++) {
          tw = Math.max(1, Math.round(tw / 2));
          th = Math.max(1, Math.round(th / 2));
          this.blurPasses[i].setSize(tw, th);
        }
      }

      set source(texture) {
        this.brightShader.uniforms.inputTexture.value = texture;
      }

      render(rend) {
        if (!this.enabled || this.strength <= 0.001) return;
        this.brightShader.uniforms.bloomThreshold.value = this.threshold;
        this.brightPass.render(rend);

        const baseOffset = Math.max(0.1, this.radius * 2.0);
        const u = this.blurShader.uniforms;

        for (let j = 0; j < this.levels; j++) {
          const blurPass = this.blurPasses[j];
          const stepOffset = baseOffset * (1.0 + j * 0.5);

          u.direction.value.set(stepOffset, 0);
          u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
          blurPass.render(rend);

          u.direction.value.set(0, stepOffset * 0.5);
          u.inputTexture.value = blurPass.current.texture;
          blurPass.render(rend);
        }
      }
    }

    const VISION_MODE_MAP = {
      'Normal (Cinematic)': 0,
      'Night Vision (Phosphor)': 1,
      'Thermal (Ironbow)': 2,
      'Thermal (White-Hot)': 3,
    };

    class PostProcessor {
      constructor(rendererInstance, p = {}) {
        this.renderer = rendererInstance;

        this.settings = {
          enabled: p.enabled !== undefined ? p.enabled : true,
          antialias: p.antialias !== undefined ? p.antialias : true,
          bloomEnabled: p.bloomEnabled !== undefined ? p.bloomEnabled : true,
          bloomStrength: p.bloomStrength !== undefined ? p.bloomStrength : 1.25,
          bloomRadius: p.bloomRadius !== undefined ? p.bloomRadius : 0.55,
          bloomThreshold: p.bloomThreshold !== undefined ? p.bloomThreshold : 0.18,

          raysEnabled: p.raysEnabled !== undefined ? p.raysEnabled : false,
          raysStrength: p.raysStrength !== undefined ? p.raysStrength : 0.85,
          raysDensity: p.raysDensity !== undefined ? p.raysDensity : 1.0,
          raysMaxDensity: p.raysMaxDensity !== undefined ? p.raysMaxDensity : 0.5,
          raysDistanceAttenuation: p.raysDistanceAttenuation !== undefined ? p.raysDistanceAttenuation : 2.0,
          raysThreshold: p.raysThreshold !== undefined ? p.raysThreshold : 0.12,
          raysColor: p.raysColor ? (p.raysColor.isColor ? p.raysColor.clone() : new THREE.Color(p.raysColor)) : new THREE.Color(0xf6aa1c),
          raysColorHex: p.raysColorHex || (typeof p.raysColor === 'string' ? p.raysColor : '#f6aa1c'),

          anamorphicEnabled: p.anamorphicEnabled !== undefined ? p.anamorphicEnabled : false,
          anamorphicIntensity: p.anamorphicIntensity !== undefined ? p.anamorphicIntensity : 5.0,
          anamorphicThreshold: p.anamorphicThreshold !== undefined ? p.anamorphicThreshold : 0.3,
          anamorphicSamples: p.anamorphicSamples !== undefined ? p.anamorphicSamples : 64,
          anamorphicRadius: p.anamorphicRadius !== undefined ? p.anamorphicRadius : 0.0,
          anamorphicSmoothWidth: p.anamorphicSmoothWidth !== undefined ? p.anamorphicSmoothWidth : 0.05,
          anamorphicColor: p.anamorphicColor ? (p.anamorphicColor.isColor ? p.anamorphicColor.clone() : new THREE.Color(p.anamorphicColor)) : new THREE.Color(0x7a8aff),
          anamorphicColorHex: p.anamorphicColorHex || '#7a8aff',

          visionMode: p.visionMode !== undefined ? p.visionMode : 'Normal (Cinematic)',
          thermalSensitivity: p.thermalSensitivity !== undefined ? p.thermalSensitivity : 1.4,
          nightVisionGain: p.nightVisionGain !== undefined ? p.nightVisionGain : 2.1,
          nightVisionNoise: p.nightVisionNoise !== undefined ? p.nightVisionNoise : 0.05,
          crtIntensity: p.crtIntensity !== undefined ? p.crtIntensity : 0.0,

          fisheyeStrength: p.fisheyeStrength !== undefined ? p.fisheyeStrength : 0.0,
          fisheyeRadius: p.fisheyeRadius !== undefined ? p.fisheyeRadius : 1.0,
          chromaticAberration: p.chromaticAberration !== undefined ? p.chromaticAberration : 0.008,
          vignetteBoost: p.vignetteBoost !== undefined ? p.vignetteBoost : 1.05,
          vignetteReduction: p.vignetteReduction !== undefined ? p.vignetteReduction : 0.45,
          noiseIntensity: p.noiseIntensity !== undefined ? p.noiseIntensity : 0.01,

          gamma: p.gamma !== undefined ? p.gamma : 1.0,
          minInputLevel: p.minInputLevel !== undefined ? p.minInputLevel : 0.0,
          maxInputLevel: p.maxInputLevel !== undefined ? p.maxInputLevel : 1.0,
          exposure: p.exposure !== undefined ? p.exposure : 1.15,
        };

        const maxSamples = (this.renderer && this.renderer.capabilities) ? (this.renderer.capabilities.maxSamples || 4) : 4;
        const targetSamples = this.settings.antialias ? Math.min(4, maxSamples) : 0;
        this.sceneTarget = createFBO(1, 1, { type: THREE.HalfFloatType, samples: targetSamples });
        this.bloomPass = new BloomPass(this.settings.bloomStrength, this.settings.bloomRadius, this.settings.bloomThreshold, 5);
        this.moonScreenPos = new THREE.Vector3(0.5, 0.7, 1.0);
        this.moonInFront = true;

        this.godRaysMaskShader = new THREE.RawShaderMaterial({
          uniforms: { inputTexture: { value: null }, threshold: { value: this.settings.raysThreshold } },
          vertexShader: orthoVertexShader,
          fragmentShader: godRaysDepthMaskShader,
          glslVersion: THREE.GLSL3,
        });
        this.godRaysMaskPass = new ShaderPass(this.godRaysMaskShader, { format: THREE.RGBAFormat, type: THREE.HalfFloatType });

        this.godRaysGenShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            vSunPositionScreenSpace: { value: this.moonScreenPos },
            fStepSize: { value: 1.0 },
            distanceAttenuation: { value: this.settings.raysDistanceAttenuation },
            maxDensity: { value: this.settings.raysMaxDensity },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: godRaysGenerateShader,
          glslVersion: THREE.GLSL3,
        });
        this.godRaysPingPong = new ShaderPingPongPass(this.godRaysGenShader, { format: THREE.RGBAFormat, type: THREE.HalfFloatType });

        this.anamorphicBrightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            threshold: { value: this.settings.anamorphicThreshold },
            smoothWidth: { value: this.settings.anamorphicSmoothWidth },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: anamorphicBrightShader,
          glslVersion: THREE.GLSL3,
        });
        this.anamorphicBrightPass = new ShaderPass(this.anamorphicBrightShader, { format: THREE.RGBAFormat, type: THREE.HalfFloatType });

        this.anamorphicBlurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            resolution: { value: new THREE.Vector2(1, 1) },
            samples: { value: this.settings.anamorphicSamples },
            intensity: { value: this.settings.anamorphicIntensity },
            tintColor: { value: this.settings.anamorphicColor },
            bloomRadius: { value: this.settings.anamorphicRadius },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: anamorphicBlurShader,
          glslVersion: THREE.GLSL3,
        });
        this.anamorphicBlurPass = new ShaderPass(this.anamorphicBlurShader, { format: THREE.RGBAFormat, type: THREE.HalfFloatType });

        this.finalShader = new THREE.RawShaderMaterial({
          uniforms: {
            resolution: { value: new THREE.Vector2(1, 1) },
            bloomEnabled: { value: this.settings.bloomEnabled },
            bloomStrength: { value: this.settings.bloomStrength },
            raysEnabled: { value: this.settings.raysEnabled },
            raysStrength: { value: this.settings.raysStrength },
            raysColor: { value: this.settings.raysColor },
            anamorphicEnabled: { value: this.settings.anamorphicEnabled },
            vignetteBoost: { value: this.settings.vignetteBoost },
            vignetteReduction: { value: this.settings.vignetteReduction },
            noiseIntensity: { value: this.settings.noiseIntensity },
            inputTexture: { value: null },
            blur0Texture: { value: null },
            blur1Texture: { value: null },
            blur2Texture: { value: null },
            blur3Texture: { value: null },
            blur4Texture: { value: null },
            raysTexture: { value: null },
            anamorphicTexture: { value: null },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: finalFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.finalPass = new ShaderPass(this.finalShader);

        this.rgbShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: this.finalPass.texture },
            fisheyeStrength: { value: this.settings.fisheyeStrength },
            fisheyeRadius: { value: this.settings.fisheyeRadius },
            chromaticAberrationAmount: { value: this.settings.chromaticAberration },
            minInputLevel: { value: this.settings.minInputLevel },
            maxInputLevel: { value: this.settings.maxInputLevel },
            gammaLevel: { value: this.settings.gamma },
            exposure: { value: this.settings.exposure },
            visionMode: { value: VISION_MODE_MAP[this.settings.visionMode] ?? 0 },
            thermalSensitivity: { value: this.settings.thermalSensitivity },
            nightVisionGain: { value: this.settings.nightVisionGain },
            nightVisionNoise: { value: this.settings.nightVisionNoise },
            crtIntensity: { value: this.settings.crtIntensity },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: colorFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.rgbPass = new ShaderPass(this.rgbShader);

        this.copyShader = new THREE.RawShaderMaterial({
          uniforms: { inputTexture: { value: null } },
          vertexShader: orthoVertexShader,
          fragmentShader: copyFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.copyPass = new ShaderPass(this.copyShader);
      }

      updateSettings() {
        this.bloomPass.enabled = this.settings.bloomEnabled;
        this.bloomPass.strength = this.settings.bloomStrength;
        this.bloomPass.radius = this.settings.bloomRadius;
        this.bloomPass.threshold = this.settings.bloomThreshold;

        this.godRaysMaskShader.uniforms.threshold.value = this.settings.raysThreshold;
        this.godRaysGenShader.uniforms.distanceAttenuation.value = this.settings.raysDistanceAttenuation;
        this.godRaysGenShader.uniforms.maxDensity.value = this.settings.raysMaxDensity;

        this.anamorphicBrightShader.uniforms.threshold.value = this.settings.anamorphicThreshold;
        this.anamorphicBrightShader.uniforms.smoothWidth.value = this.settings.anamorphicSmoothWidth;
        this.anamorphicBlurShader.uniforms.samples.value = this.settings.anamorphicSamples;
        this.anamorphicBlurShader.uniforms.intensity.value = this.settings.anamorphicIntensity;
        this.anamorphicBlurShader.uniforms.tintColor.value.copy(this.settings.anamorphicColor);
        this.anamorphicBlurShader.uniforms.bloomRadius.value = this.settings.anamorphicRadius;

        this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
        this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
        this.finalShader.uniforms.raysEnabled.value = this.settings.raysEnabled && this.moonInFront;
        this.finalShader.uniforms.raysStrength.value = this.settings.raysStrength;
        this.finalShader.uniforms.raysColor.value.copy(this.settings.raysColor);
        this.finalShader.uniforms.anamorphicEnabled.value = this.settings.anamorphicEnabled;
        this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
        this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
        this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;

        this.rgbShader.uniforms.fisheyeStrength.value = this.settings.fisheyeStrength;
        this.rgbShader.uniforms.fisheyeRadius.value = this.settings.fisheyeRadius;
        this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
        this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
        this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
        this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
        this.rgbShader.uniforms.exposure.value = this.settings.exposure;
        this.rgbShader.uniforms.visionMode.value = VISION_MODE_MAP[this.settings.visionMode] ?? 0;
        this.rgbShader.uniforms.thermalSensitivity.value = this.settings.thermalSensitivity;
        this.rgbShader.uniforms.nightVisionGain.value = this.settings.nightVisionGain;
        this.rgbShader.uniforms.nightVisionNoise.value = this.settings.nightVisionNoise;
        this.rgbShader.uniforms.crtIntensity.value = this.settings.crtIntensity;
      }

      setSize(w0, h0, dpr = 1) {
        const w = Math.max(1, Math.floor(w0 * dpr));
        const h = Math.max(1, Math.floor(h0 * dpr));
        this.sceneTarget.setSize(w, h);
        this.finalPass.setSize(w, h);
        this.finalShader.uniforms.resolution.value.set(w, h);
        this.bloomPass.setSize(w, h);

        const grW = Math.max(1, Math.round(w / 2));
        const grH = Math.max(1, Math.round(h / 2));
        this.godRaysMaskPass.setSize(grW, grH);
        this.godRaysPingPong.setSize(grW, grH);

        const anW = Math.max(1, Math.round(w / 4));
        const anH = Math.max(1, Math.round(h / 4));
        this.anamorphicBrightPass.setSize(anW, anH);
        this.anamorphicBlurPass.setSize(anW, anH);
        this.anamorphicBlurShader.uniforms.resolution.value.set(anW, anH);

        this.rgbPass.setSize(w, h);
        this.copyPass.setSize(w, h);
      }

      setAntialias(enabled) {
        this.settings.antialias = !!enabled;
        const maxSamples = (this.renderer && this.renderer.capabilities) ? (this.renderer.capabilities.maxSamples || 4) : 4;
        const samples = this.settings.antialias ? Math.min(4, maxSamples) : 0;
        if (this.sceneTarget.samples !== samples) {
          const oldTarget = this.sceneTarget;
          this.sceneTarget = createFBO(oldTarget.width, oldTarget.height, {
            type: THREE.HalfFloatType,
            samples: samples,
          });
          oldTarget.dispose();
        }
      }

      setMoonScreenPosition(cam, moonWorldPos) {
        if (!this._camDir) {
          this._camDir = new THREE.Vector3();
          this._toMoon = new THREE.Vector3();
          this._ndc = new THREE.Vector3();
        }
        cam.getWorldDirection(this._camDir);
        this._toMoon.copy(moonWorldPos).sub(cam.position).normalize();
        const dot = this._camDir.dot(this._toMoon);

        if (dot <= 0.02) {
          this.moonInFront = false;
          this.finalShader.uniforms.raysEnabled.value = false;
          return;
        }

        this.moonInFront = true;
        const fade = THREE.MathUtils.clamp((dot - 0.02) / 0.15, 0.0, 1.0);
        this._ndc.copy(moonWorldPos).project(cam);
        const screenX = this._ndc.x * 0.5 + 0.5;
        const screenY = this._ndc.y * 0.5 + 0.5;
        const screenZ = fade;

        this.moonScreenPos.set(screenX, screenY, screenZ);
        this.godRaysGenShader.uniforms.vSunPositionScreenSpace.value.set(screenX, screenY, screenZ);
      }

      renderScene(sc, cam) {
        if (!this.settings.enabled) {
          this.renderer.setRenderTarget(this.sceneTarget);
          this.renderer.render(sc, cam);
          this.renderer.setRenderTarget(null);
          this.copyPass.shader.uniforms.inputTexture.value = this.sceneTarget.texture;
          this.copyPass.render(this.renderer, true);
          return;
        }
        this.renderer.setRenderTarget(this.sceneTarget);
        this.renderer.render(sc, cam);
        this.renderer.setRenderTarget(null);
        this.render(this.sceneTarget.texture);
      }

      render(sourceTexture) {
        if (!this.settings.enabled) {
          this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
          this.copyPass.render(this.renderer, true);
          return;
        }

        this.updateSettings();

        // 1. Bloom
        this.bloomPass.source = sourceTexture;
        this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
        this.bloomPass.render(this.renderer);

        this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
        this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
        this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
        this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
        this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

        // 2. Godrays
        if (this.settings.raysEnabled && this.settings.raysStrength > 0.001 && this.moonInFront) {
          this.godRaysMaskShader.uniforms.inputTexture.value = sourceTexture;
          this.godRaysMaskShader.uniforms.threshold.value = this.settings.raysThreshold;
          this.godRaysMaskPass.render(this.renderer);

          const filterLen = this.settings.raysDensity;
          const tapsPerPass = 6.0;

          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -1.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysMaskPass.texture;
          this.godRaysPingPong.render(this.renderer);

          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -2.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysPingPong.texture;
          this.godRaysPingPong.render(this.renderer);

          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -3.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysPingPong.texture;
          this.godRaysPingPong.render(this.renderer);

          this.finalPass.shader.uniforms.raysTexture.value = this.godRaysPingPong.texture;
          this.finalPass.shader.uniforms.raysEnabled.value = true;
        } else {
          this.finalPass.shader.uniforms.raysEnabled.value = false;
        }

        // 3. Anamorphic Flare
        if (this.settings.anamorphicEnabled && this.settings.anamorphicIntensity > 0.001) {
          this.anamorphicBrightShader.uniforms.inputTexture.value = sourceTexture;
          this.anamorphicBrightShader.uniforms.threshold.value = this.settings.anamorphicThreshold;
          this.anamorphicBrightShader.uniforms.smoothWidth.value = this.settings.anamorphicSmoothWidth;
          this.anamorphicBrightPass.render(this.renderer);

          this.anamorphicBlurShader.uniforms.inputTexture.value = this.anamorphicBrightPass.texture;
          this.anamorphicBlurShader.uniforms.samples.value = this.settings.anamorphicSamples;
          this.anamorphicBlurShader.uniforms.intensity.value = this.settings.anamorphicIntensity;
          this.anamorphicBlurShader.uniforms.tintColor.value.copy(this.settings.anamorphicColor);
          this.anamorphicBlurShader.uniforms.bloomRadius.value = this.settings.anamorphicRadius;
          this.anamorphicBlurPass.render(this.renderer);

          this.finalPass.shader.uniforms.anamorphicTexture.value = this.anamorphicBlurPass.texture;
          this.finalPass.shader.uniforms.anamorphicEnabled.value = true;
        } else {
          this.finalPass.shader.uniforms.anamorphicEnabled.value = false;
        }

        const randomTime = Math.random() * 100000;
        this.finalPass.shader.uniforms.time.value = randomTime;
        this.rgbPass.shader.uniforms.time.value = randomTime;

        this.finalPass.render(this.renderer);
        this.rgbPass.render(this.renderer, true);
      }

      attachGUI(g, title = "Post-Processing Suite") {
        const root = g.addFolder(title);
        root.add(this.settings, "enabled").name("Enable Post-Process");
        root.add(this.settings, "antialias").name("MSAA Antialias").onChange((val) => {
          this.setAntialias(val);
          if (typeof params !== 'undefined') {
            params.antialias = val;
          }
          if (typeof gui !== 'undefined') {
            gui.controllersRecursive().forEach(c => {
              if (c.property === 'antialias') c.updateDisplay();
            });
          }
        });

        const bloom = root.addFolder("Atmospheric Bloom");
        bloom.add(this.settings, "bloomEnabled").name("Enable Bloom").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomStrength", 0, 3.0, 0.05).name("Bloom Strength").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomRadius", 0, 2.0, 0.05).name("Bloom Radius").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomThreshold", 0, 1.0, 0.01).name("Bloom Threshold").onChange(() => this.updateSettings());

        const rays = root.addFolder("Three.js Godrays");
        rays.add(this.settings, "raysEnabled").name("Enable Godrays").onChange(() => this.updateSettings());
        rays.add(this.settings, "raysStrength", 0, 3.0, 0.05).name("Intensity").onChange(() => this.updateSettings());
        rays.add(this.settings, "raysDensity", 0.1, 2.5, 0.05).name("Density (Spread)").onChange(() => this.updateSettings());
        rays.add(this.settings, "raysMaxDensity", 0.1, 1.0, 0.05).name("Max Density").onChange(() => this.updateSettings());
        rays.add(this.settings, "raysDistanceAttenuation", 0.5, 4.0, 0.1).name("Distance Atten").onChange(() => this.updateSettings());
        rays.add(this.settings, "raysThreshold", 0.0, 0.8, 0.01).name("Light Threshold").onChange(() => this.updateSettings());
        rays.addColor(this.settings, "raysColorHex").name("Ray Tint").onChange((v) => {
          this.settings.raysColor.set(v);
          this.updateSettings();
        });

        const anamorphic = root.addFolder("Three.js Anamorphic Flare");
        anamorphic.add(this.settings, "anamorphicEnabled").name("Enable Anamorphic").onChange(() => this.updateSettings());
        anamorphic.add(this.settings, "anamorphicIntensity", 0, 10.0, 0.1).name("Intensity").onChange(() => this.updateSettings());
        anamorphic.add(this.settings, "anamorphicThreshold", 0.0, 0.9, 0.01).name("Threshold").onChange(() => this.updateSettings());
        anamorphic.add(this.settings, "anamorphicSamples", 2, 128, 1).name("Samples").onChange(() => this.updateSettings());
        anamorphic.add(this.settings, "anamorphicRadius", 0.0, 1.0, 0.01).name("Bloom Radius").onChange(() => this.updateSettings());
        anamorphic.addColor(this.settings, "anamorphicColorHex").name("Tint Color").onChange((v) => {
          this.settings.anamorphicColor.set(v);
          this.updateSettings();
        });

        const lens = root.addFolder("Lens, Optics & Film Grain");
        lens.add(this.settings, "fisheyeStrength", -1.0, 1.5, 0.01).name("Fisheye Distortion").onChange(() => this.updateSettings());
        lens.add(this.settings, "fisheyeRadius", 0.2, 2.0, 0.05).name("Fisheye Radius").onChange(() => this.updateSettings());
        lens.add(this.settings, "chromaticAberration", 0, 0.2, 0.002).name("Chromatic Aberration").onChange(() => this.updateSettings());
        lens.add(this.settings, "vignetteBoost", 0, 2.0, 0.05).name("Vignette Boost").onChange(() => this.updateSettings());
        lens.add(this.settings, "vignetteReduction", 0, 2.0, 0.05).name("Vignette Falloff").onChange(() => this.updateSettings());
        lens.add(this.settings, "noiseIntensity", 0, 0.1, 0.002).name("Film Grain").onChange(() => this.updateSettings());
        lens.add(this.settings, "gamma", 0.2, 2.0, 0.05).name("Gamma").onChange(() => this.updateSettings());
        lens.add(this.settings, "minInputLevel", 0, 0.5, 0.01).name("Black Level").onChange(() => this.updateSettings());
        lens.add(this.settings, "maxInputLevel", 0.5, 1.0, 0.01).name("White Level").onChange(() => this.updateSettings());
        lens.add(this.settings, "exposure", 0.1, 3.0, 0.05).name("Exposure").onChange(() => this.updateSettings());

        const vision = root.addFolder("Thermal & Night Vision");
        vision.add(this.settings, "visionMode", Object.keys(VISION_MODE_MAP)).name("Vision Mode").onChange(() => this.updateSettings());
        vision.add(this.settings, "nightVisionGain", 0.5, 5.0, 0.1).name("NVG Amplification").onChange(() => this.updateSettings());
        vision.add(this.settings, "nightVisionNoise", 0.0, 0.3, 0.01).name("NVG Sensor Noise").onChange(() => this.updateSettings());
        vision.add(this.settings, "thermalSensitivity", 0.5, 3.5, 0.05).name("Thermal Sensitivity").onChange(() => this.updateSettings());
        vision.add(this.settings, "crtIntensity", 0.0, 0.1, 0.005).name("CRT Scanlines").onChange(() => this.updateSettings());

        return root;
      }
    }

        fluid: '#7FFF00',
        pedestal: '#0A3322',
        pedestalTrim: '#00B894',
        background: '#05140A',
        light: '#D4FFB0'
      },
      'Amber Midnight (FFE8CC, FF8C00...)': {
        fluid: '#FF8C00',
        pedestal: '#3D1050',
        pedestalTrim: '#FFE8CC',
        background: '#0E0618',
        light: '#C7501A'
      },
      'Cosmic Lavender (E8E0FF, B38FFF...)': {
        fluid: '#B38FFF',
        pedestal: '#1A1250',
        pedestalTrim: '#6A3DE8',
        background: '#090612',
        light: '#E8E0FF'
      },
      'Cyberpunk Neon (E0FBFF, 00F0FF...)': {
        fluid: '#00F0FF',
        pedestal: '#1E0A3D',
        pedestalTrim: '#D40078',
        background: '#05020F',
        light: '#E0FBFF'
      }
    };

    const animationPresets = [
      'Static (Showcase)',
      'Gentle Orbit',
      'Cinematic Dolly',
      'Top-Down Spiral',
      'Low Angle Hero',
      'Figure-8 Float',
      'Liquid Pulse',
      'Studio Turntable'
    ];

    // -------------------------------------------------------------
    // SCENE PARAMETERS & INITIAL STATE
    // -------------------------------------------------------------
    const initialScheme = 'Monochromatic';
    const params = {
      colorScheme: initialScheme,
      greenScreen: false,
      antialias: true,
      dpr: Math.min(window.devicePixelRatio || 1, 2.0),
      speed: 1.0,
      animationPreset: 'Gentle Orbit',
      randomizeOnClick: true,

      // Material colors
      fluidColor: colorSchemes[initialScheme].fluid,
      pedestalColor: colorSchemes[initialScheme].pedestal,
      pedestalTrim: colorSchemes[initialScheme].pedestalTrim,
      bgColor: colorSchemes[initialScheme].background,
      lightColor: colorSchemes[initialScheme].light,

      // Fluid dynamics
      viscosity: 1.0,
      amplitude: 0.20,
      fluidMetalness: 0.96,
      fluidRoughness: 0.14,
      dropletCount: 36,

      // Controls
      dragAction: 'Rotate Scene'
    };

    // -------------------------------------------------------------
    // RENDERER, SCENE, CAMERA, CONTROLS
    // -------------------------------------------------------------
    const canvas = document.getElementById('webgl-canvas');
    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: params.antialias,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(params.dpr);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    // PostProcessor performs ACESFilmic tone-mapping internally; avoid double tone-mapping
    renderer.toneMapping = THREE.NoToneMapping;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(params.bgColor);

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 2.3, 6.4);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.enableZoom = true;
    controls.zoomSpeed = 1.0;
    controls.enablePan = true;
    controls.screenSpacePanning = true;
    controls.target.set(0, 0.8, 0);
    controls.minDistance = 2.0;
    controls.maxDistance = 18.0;

    let isUserInteracting = false;
    let interactionTimeout = null;

    controls.addEventListener('start', () => {
      isUserInteracting = true;
      if (interactionTimeout) clearTimeout(interactionTimeout);
    });

    controls.addEventListener('end', () => {
      if (interactionTimeout) clearTimeout(interactionTimeout);
      interactionTimeout = setTimeout(() => {
        isUserInteracting = false;
      }, 1400);
    });

    function updateDragAction() {
      if (params.dragAction === 'Pan / Drag Scene') {
        controls.mouseButtons.LEFT = THREE.MOUSE.PAN;
        controls.mouseButtons.RIGHT = THREE.MOUSE.ROTATE;
      } else {
        controls.mouseButtons.LEFT = THREE.MOUSE.ROTATE;
        controls.mouseButtons.RIGHT = THREE.MOUSE.PAN;
      }
    }
    updateDragAction();

    // -------------------------------------------------------------
    // PROCEDURAL STUDIO ENVIRONMENT MAP
    // -------------------------------------------------------------
    function createStudioEnvironment(rend) {
      const pmremGenerator = new THREE.PMREMGenerator(rend);
      pmremGenerator.compileEquirectangularShader();

      const envCanvas = document.createElement('canvas');
      envCanvas.width = 1024;
      envCanvas.height = 512;
      const ctx = envCanvas.getContext('2d');

      const bgGrad = ctx.createLinearGradient(0, 0, 0, 512);
      bgGrad.addColorStop(0, '#1e1c22');
      bgGrad.addColorStop(0.5, '#0e0e12');
      bgGrad.addColorStop(1, '#060608');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, 1024, 512);

      // Top softbox
      const g1 = ctx.createRadialGradient(512, 90, 10, 512, 90, 250);
      g1.addColorStop(0, 'rgba(255, 250, 235, 1.0)');
      g1.addColorStop(0.35, 'rgba(255, 225, 190, 0.6)');
      g1.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = g1;
      ctx.fillRect(0, 0, 1024, 300);

      // Left rim highlight
      const g2 = ctx.createRadialGradient(180, 240, 10, 180, 240, 190);
      g2.addColorStop(0, 'rgba(255, 220, 150, 0.9)');
      g2.addColorStop(0.5, 'rgba(255, 170, 70, 0.35)');
      g2.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = g2;
      ctx.fillRect(0, 70, 370, 370);

      // Right soft fill
      const g3 = ctx.createRadialGradient(840, 220, 10, 840, 220, 190);
      g3.addColorStop(0, 'rgba(220, 240, 255, 0.8)');
      g3.addColorStop(0.5, 'rgba(140, 180, 230, 0.3)');
      g3.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = g3;
      ctx.fillRect(610, 70, 414, 350);

      // Metallic horizon stripe
      ctx.fillStyle = 'rgba(255, 240, 210, 0.18)';
      ctx.fillRect(0, 248, 1024, 14);

      const tex = new THREE.CanvasTexture(envCanvas);
      tex.mapping = THREE.EquirectangularReflectionMapping;
      const envMap = pmremGenerator.fromEquirectangular(tex).texture;
      pmremGenerator.dispose();
      tex.dispose();
      return envMap;
    }

    const studioEnvMap = createStudioEnvironment(renderer);
    scene.environment = studioEnvMap;

    // -------------------------------------------------------------
    // PROCEDURAL MARBLE TEXTURE FOR PEDESTAL (CARTESIAN SMOOTH)
    // -------------------------------------------------------------
    function generateMarbleTexture() {
      const c = document.createElement('canvas');
      c.width = 1024;
      c.height = 1024;
      const ctx = c.getContext('2d');
      const imgData = ctx.createImageData(1024, 1024);
      const data = imgData.data;

      for (let y = 0; y < 1024; y++) {
        for (let x = 0; x < 1024; x++) {
          const idx = (y * 1024 + x) * 4;
          const nx = x / 1024.0;
          const ny = y / 1024.0;

          // Pure Cartesian coordinate turbulence (no polar pinwheel)
          const v1 = Math.sin(nx * 10.0 + Math.sin(ny * 12.0 + nx * 5.0) * 2.2);
          const v2 = Math.cos(ny * 16.0 + Math.cos(nx * 14.0) * 1.8);
          const v3 = Math.sin((nx * 1.5 + ny) * 24.0);
          const turbulence = v1 * 0.5 + v2 * 0.35 + v3 * 0.15;
          const vein = Math.pow(Math.abs(Math.sin(turbulence * 3.1415)), 3.0);
          const grain = (Math.random() - 0.5) * 12;

          const val = Math.min(255, Math.max(0, Math.floor(180 + vein * 75 + grain)));
          data[idx] = val;
          data[idx + 1] = val;
          data[idx + 2] = val;
          data[idx + 3] = 255;
        }
      }
      ctx.putImageData(imgData, 0, 0);
      const texture = new THREE.CanvasTexture(c);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(2, 2);
      return texture;
    }

    const marbleTexture = generateMarbleTexture();

    // -------------------------------------------------------------
    // LIGHTING SETUP
    // -------------------------------------------------------------
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(params.lightColor, 3.2);
    keyLight.position.set(5.5, 8.0, 5.0);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.width = 2048;
    keyLight.shadow.mapSize.height = 2048;
    keyLight.shadow.camera.near = 0.5;
    keyLight.shadow.camera.far = 25;
    keyLight.shadow.camera.left = -5;
    keyLight.shadow.camera.right = 5;
    keyLight.shadow.camera.top = 5;
    keyLight.shadow.camera.bottom = -5;
    keyLight.shadow.bias = -0.0001;
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xddeeff, 1.4);
    fillLight.position.set(-6.0, 4.5, -4.0);
    scene.add(fillLight);

    const rimLight = new THREE.PointLight(0xffdd88, 3.5, 20);
    rimLight.position.set(0, 4.2, -5.2);
    scene.add(rimLight);

    // -------------------------------------------------------------
    // STUDIO FLOOR (SEAMLESS LARGE CIRCULAR DISK)
    // -------------------------------------------------------------
    const floorGeo = new THREE.CircleGeometry(60, 64);
    const floorMat = new THREE.MeshStandardMaterial({
      color: new THREE.Color(params.bgColor),
      roughness: 0.45,
      metalness: 0.08
    });
    const floorMesh = new THREE.Mesh(floorGeo, floorMat);
    floorMesh.rotation.x = -Math.PI / 2;
    floorMesh.position.y = 0;
    floorMesh.receiveShadow = true;
    scene.add(floorMesh);

    // -------------------------------------------------------------
    // PODIUM GEOMETRY & MATERIALS
    // -------------------------------------------------------------
    const podiumGroup = new THREE.Group();
    scene.add(podiumGroup);

    // Pedestal outer body (tiered base, cylinder wall, smooth rounded chamfer)
    const lathePoints = [];
    lathePoints.push(new THREE.Vector2(0, 0));
    lathePoints.push(new THREE.Vector2(2.65, 0));
    lathePoints.push(new THREE.Vector2(2.65, 0.22));
    lathePoints.push(new THREE.Vector2(2.42, 0.28));
    lathePoints.push(new THREE.Vector2(2.42, 1.25));

    const chamferSteps = 8;
    for (let i = 0; i <= chamferSteps; i++) {
      const theta = (i / chamferSteps) * (Math.PI / 2);
      const r = 2.28 + 0.14 * Math.cos(theta);
      const y = 1.25 + 0.14 * Math.sin(theta);
      lathePoints.push(new THREE.Vector2(r, y));
    }

    const bodyGeo = new THREE.LatheGeometry(lathePoints, 128);
    const pedestalMaterial = new THREE.MeshStandardMaterial({
      color: new THREE.Color(params.pedestalColor),
      roughness: 0.65,
      metalness: 0.15,
      bumpMap: marbleTexture,
      bumpScale: 0.025,
      roughnessMap: marbleTexture
    });
    const bodyMesh = new THREE.Mesh(bodyGeo, pedestalMaterial);
    bodyMesh.castShadow = true;
    bodyMesh.receiveShadow = true;
    podiumGroup.add(bodyMesh);

    // Flat top stage deck with PLANAR Cartesian UV mapping (ZERO center swirl/pinwheel artifact!)
    const topDeckGeo = new THREE.CylinderGeometry(2.28, 2.28, 0.05, 128);
    const pos = topDeckGeo.attributes.position;
    const uvs = topDeckGeo.attributes.uv;
    for (let i = 0; i < pos.count; i++) {
      const vx = pos.getX(i);
      const vz = pos.getZ(i);
      uvs.setXY(i, (vx / 4.56) + 0.5, (vz / 4.56) + 0.5);
    }
    uvs.needsUpdate = true;

    const topDeckMesh = new THREE.Mesh(topDeckGeo, pedestalMaterial);
    topDeckMesh.position.y = 1.375;
    topDeckMesh.receiveShadow = true;
    podiumGroup.add(topDeckMesh);

    // Inlay gold trim ring at pedestal tier step
    const trimGeo = new THREE.TorusGeometry(2.43, 0.032, 24, 128);
    trimGeo.rotateX(Math.PI / 2);
    const trimMaterial = new THREE.MeshPhysicalMaterial({
      color: new THREE.Color(params.pedestalTrim),
      metalness: 0.95,
      roughness: 0.16,
      clearcoat: 1.0,
      clearcoatRoughness: 0.08,
      reflectivity: 1.0
    });
    const trimMesh = new THREE.Mesh(trimGeo, trimMaterial);
    trimMesh.position.y = 0.25;
    trimMesh.castShadow = true;
    podiumGroup.add(trimMesh);

    // Product stage border ring framing the central showcase area
    const stageBorderGeo = new THREE.TorusGeometry(2.27, 0.012, 16, 128);
    stageBorderGeo.rotateX(Math.PI / 2);
    const stageBorderMesh = new THREE.Mesh(stageBorderGeo, trimMaterial);
    stageBorderMesh.position.y = 1.402;
    podiumGroup.add(stageBorderMesh);

    // -------------------------------------------------------------
    // FLUID GOLD SYSTEM (ELEGANT CIRCULATING STREAMS - ZERO FLOOR CLIPPING)
    // -------------------------------------------------------------
    const fluidUniforms = {
      uTime: { value: 0 },
      uViscosity: { value: params.viscosity },
      uAmplitude: { value: params.amplitude },
      uBaseRadius: { value: 3.08 }
    };

    // 1. Primary Mid-level circulating fluid ribbon (elevated at y = 0.58, min height >= 0.30)
    const fluidMaterial = new THREE.MeshPhysicalMaterial({
      color: new THREE.Color(params.fluidColor),
      metalness: params.fluidMetalness,
      roughness: params.fluidRoughness,
      clearcoat: 1.0,
      clearcoatRoughness: 0.05,
      reflectivity: 1.0,
      envMapIntensity: 2.8
    });
    fluidMaterial.customProgramCacheKey = () => 'fluidMainRing';

    fluidMaterial.onBeforeCompile = (shader) => {
      shader.uniforms.uTime = fluidUniforms.uTime;
      shader.uniforms.uViscosity = fluidUniforms.uViscosity;
      shader.uniforms.uAmplitude = fluidUniforms.uAmplitude;
      shader.uniforms.uBaseRadius = fluidUniforms.uBaseRadius;

      shader.vertexShader = `
        uniform float uTime;
        uniform float uViscosity;
        uniform float uAmplitude;
        uniform float uBaseRadius;
      ` + shader.vertexShader;

      shader.vertexShader = shader.vertexShader.replace(
        '#include <begin_vertex>',
        `
        #include <begin_vertex>
        float a = atan(position.z, position.x);
        vec3 spine = vec3(cos(a) * uBaseRadius, 0.0, sin(a) * uBaseRadius);
        vec3 crossSection = position - spine;

        // Bounded traveling viscous waves (strictly stays above floor at y >= 0.30)
        float waveY = (sin(a * 3.0 + uTime * 1.5 * uViscosity) * 0.22 +
                       cos(a * 5.0 - uTime * 2.0 * uViscosity) * 0.10 +
                       sin(a * 8.0 + uTime * 2.6) * 0.04) * uAmplitude;

        float waveR = (cos(a * 2.0 + uTime * 1.1 * uViscosity) * 0.20 +
                       sin(a * 4.0 - uTime * 1.5) * 0.10) * uAmplitude;

        float newR = uBaseRadius + waveR;
        vec3 newSpine = vec3(cos(a) * newR, waveY, sin(a) * newR);
        float bulge = 1.0 + (sin(a * 6.0 + uTime * 2.0) * 0.10 + cos(a * 4.0 - uTime * 1.4) * 0.06) * uAmplitude;

        transformed = newSpine + crossSection * bulge;
        `
      );
    };

    const mainFluidGeo = new THREE.TorusGeometry(3.08, 0.19, 64, 256);
    mainFluidGeo.rotateX(Math.PI / 2);
    const mainFluidMesh = new THREE.Mesh(mainFluidGeo, fluidMaterial);
    mainFluidMesh.position.y = 0.58;
    mainFluidMesh.castShadow = true;
    mainFluidMesh.receiveShadow = true;
    podiumGroup.add(mainFluidMesh);

    // 2. Upper-level circulating fluid stream (elevated at y = 0.95, framing the stage rim from below, min height >= 0.72)
    const upperFluidUniforms = {
      uTime: fluidUniforms.uTime,
      uViscosity: fluidUniforms.uViscosity,
      uAmplitude: fluidUniforms.uAmplitude,
      uBaseRadius: { value: 3.28 }
    };

    const upperFluidMaterial = new THREE.MeshPhysicalMaterial({
      color: new THREE.Color(params.fluidColor),
      metalness: params.fluidMetalness,
      roughness: params.fluidRoughness,
      clearcoat: 1.0,
      clearcoatRoughness: 0.05,
      reflectivity: 1.0,
      envMapIntensity: 2.8
    });
    upperFluidMaterial.customProgramCacheKey = () => 'upperFluidRing';

    upperFluidMaterial.onBeforeCompile = (shader) => {
      shader.uniforms.uTime = upperFluidUniforms.uTime;
      shader.uniforms.uViscosity = upperFluidUniforms.uViscosity;
      shader.uniforms.uAmplitude = upperFluidUniforms.uAmplitude;
      shader.uniforms.uBaseRadius = upperFluidUniforms.uBaseRadius;

      shader.vertexShader = `
        uniform float uTime;
        uniform float uViscosity;
        uniform float uAmplitude;
        uniform float uBaseRadius;
      ` + shader.vertexShader;

      shader.vertexShader = shader.vertexShader.replace(
        '#include <begin_vertex>',
        `
        #include <begin_vertex>
        float a = atan(position.z, position.x);
        vec3 spine = vec3(cos(a) * uBaseRadius, 0.0, sin(a) * uBaseRadius);
        vec3 crossSection = position - spine;

        // Smooth counter-circulating waves framing the top stage rim from below
        float waveY = (sin(a * 2.0 - uTime * 1.3 * uViscosity) * 0.16 +
                       cos(a * 4.0 + uTime * 1.8 * uViscosity) * 0.08) * uAmplitude;
        float waveR = (cos(a * 3.0 + uTime * 1.1) * 0.16) * uAmplitude;

        float newR = uBaseRadius + waveR;
        vec3 newSpine = vec3(cos(a) * newR, waveY, sin(a) * newR);
        float bulge = 1.0 + (sin(a * 4.0 + uTime * 1.5) * 0.08) * uAmplitude;

        transformed = newSpine + crossSection * bulge;
        `
      );
    };

    const upperFluidGeo = new THREE.TorusGeometry(3.28, 0.14, 48, 200);
    upperFluidGeo.rotateX(Math.PI / 2);
    const upperFluidMesh = new THREE.Mesh(upperFluidGeo, upperFluidMaterial);
    upperFluidMesh.position.y = 0.95;
    upperFluidMesh.castShadow = true;
    upperFluidMesh.receiveShadow = true;
    podiumGroup.add(upperFluidMesh);

    // 3. Base fluid ripple ring (elevated at y = 0.22, hugs the tier step, min height >= 0.12, NEVER touches floor)
    const baseRingUniforms = {
      uTime: fluidUniforms.uTime,
      uViscosity: fluidUniforms.uViscosity,
      uAmplitude: fluidUniforms.uAmplitude,
      uBaseRadius: { value: 2.74 }
    };

    const baseRingMaterial = new THREE.MeshPhysicalMaterial({
      color: new THREE.Color(params.fluidColor),
      metalness: params.fluidMetalness,
      roughness: params.fluidRoughness,
      clearcoat: 1.0,
      clearcoatRoughness: 0.05,
      reflectivity: 1.0,
      envMapIntensity: 2.8
    });
    baseRingMaterial.customProgramCacheKey = () => 'fluidBaseRing';

    baseRingMaterial.onBeforeCompile = (shader) => {
      shader.uniforms.uTime = baseRingUniforms.uTime;
      shader.uniforms.uViscosity = baseRingUniforms.uViscosity;
      shader.uniforms.uAmplitude = baseRingUniforms.uAmplitude;
      shader.uniforms.uBaseRadius = baseRingUniforms.uBaseRadius;

      shader.vertexShader = `
        uniform float uTime;
        uniform float uViscosity;
        uniform float uAmplitude;
        uniform float uBaseRadius;
      ` + shader.vertexShader;

      shader.vertexShader = shader.vertexShader.replace(
        '#include <begin_vertex>',
        `
        #include <begin_vertex>
        float a = atan(position.z, position.x);
        vec3 spine = vec3(cos(a) * uBaseRadius, 0.0, sin(a) * uBaseRadius);
        vec3 crossSection = position - spine;

        // Gentle liquid ripple right above the base tier
        float waveY = (sin(a * 4.0 + uTime * 1.6 * uViscosity) * 0.03 +
                       cos(a * 3.0 - uTime * 1.1) * 0.02) * uAmplitude;
        float waveR = (cos(a * 4.0 + uTime * 1.2) * 0.05) * uAmplitude;

        float newR = uBaseRadius + waveR;
        vec3 newSpine = vec3(cos(a) * newR, waveY, sin(a) * newR);

        transformed = newSpine + crossSection;
        `
      );
    };

    const baseRingGeo = new THREE.TorusGeometry(2.74, 0.10, 32, 180);
    baseRingGeo.rotateX(Math.PI / 2);
    const baseRingMesh = new THREE.Mesh(baseRingGeo, baseRingMaterial);
    baseRingMesh.position.y = 0.22;
    baseRingMesh.castShadow = true;
    baseRingMesh.receiveShadow = true;
    podiumGroup.add(baseRingMesh);

    // 4. Floating molten gold droplets (strictly elevated between y = 0.25 and y = 1.35)
    const dropletGroup = new THREE.Group();
    podiumGroup.add(dropletGroup);

    const dropletMaterial = new THREE.MeshPhysicalMaterial({
      color: new THREE.Color(params.fluidColor),
      metalness: params.fluidMetalness,
      roughness: params.fluidRoughness,
      clearcoat: 1.0,
      clearcoatRoughness: 0.05,
      reflectivity: 1.0,
      envMapIntensity: 2.8
    });

    const dropletGeo = new THREE.SphereGeometry(1, 32, 32);
    const droplets = [];

    function initDroplets() {
      while (dropletGroup.children.length > 0) {
        dropletGroup.remove(dropletGroup.children[0]);
      }
      droplets.length = 0;

      for (let i = 0; i < params.dropletCount; i++) {
        const mesh = new THREE.Mesh(dropletGeo, dropletMaterial);
        mesh.castShadow = true;
        const baseRadius = 2.65 + Math.random() * 1.45;
        const angle = (i / params.dropletCount) * Math.PI * 2 + (Math.random() - 0.5) * 0.6;
        const speed = 0.35 + Math.random() * 0.75;
        // Strictly elevated so droplets never dip into the floor
        const baseY = 0.38 + Math.random() * 0.85;
        const yAmp = 0.08 + Math.random() * 0.14;
        const scale = 0.05 + Math.random() * 0.12;
        const phase = Math.random() * Math.PI * 2;

        mesh.scale.setScalar(scale);
        dropletGroup.add(mesh);

        droplets.push({ mesh, baseRadius, angle, speed, baseY, yAmp, scale, phase });
      }
    }
    initDroplets();

    // -------------------------------------------------------------
    // INITIALIZE POST PROCESSOR PIPELINE
    // -------------------------------------------------------------
    const postProcessor = new PostProcessor(renderer, {
      enabled: true,
      antialias: params.antialias,
      bloomEnabled: true,
      bloomStrength: 1.25,
      bloomRadius: 0.55,
      bloomThreshold: 0.18,
      raysEnabled: false,
      anamorphicEnabled: false,
      chromaticAberration: 0.008,
      vignetteBoost: 1.05,
      vignetteReduction: 0.45,
      noiseIntensity: 0.01,
      gamma: 1.0,
      exposure: 1.15
    });
    postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);

    // -------------------------------------------------------------
    // COLOR UPDATE & GREENSCREEN HANDLING
    // -------------------------------------------------------------
    function updateMaterialColors() {
      fluidMaterial.color.set(params.fluidColor);
      upperFluidMaterial.color.set(params.fluidColor);
      baseRingMaterial.color.set(params.fluidColor);
      dropletMaterial.color.set(params.fluidColor);
      trimMaterial.color.set(params.pedestalTrim);
      pedestalMaterial.color.set(params.pedestalColor);
      keyLight.color.set(params.lightColor);

      if (params.greenScreen) {
        scene.background = new THREE.Color('#00ff00');
        floorMesh.material.color.set('#00ff00');
        floorMesh.material.roughness = 1.0;
        floorMesh.material.metalness = 0.0;
        floorMesh.receiveShadow = false;
      } else {
        scene.background = new THREE.Color(params.bgColor);
        floorMesh.material.color.set(params.bgColor);
        floorMesh.material.roughness = 0.45;
        floorMesh.material.metalness = 0.08;
        floorMesh.receiveShadow = true;
      }
    }

    function applyColorScheme(schemeName) {
      const scheme = colorSchemes[schemeName];
      if (!scheme) return;
      params.colorScheme = schemeName;
      params.fluidColor = scheme.fluid;
      params.pedestalColor = scheme.pedestal;
      params.pedestalTrim = scheme.pedestalTrim;
      params.bgColor = scheme.background;
      params.lightColor = scheme.light;
      updateMaterialColors();
    }

    // -------------------------------------------------------------
    // PROCEDURAL RANDOMIZATION (ON SCENE CLICK)
    // NOTE: Does NOT shuffle or change Postprocessing settings!
    // -------------------------------------------------------------
    function triggerProceduralRandomization() {
      // 1. Random visual color scheme from the 18 preconfigured palettes
      const schemeNames = Object.keys(colorSchemes);
      const chosenScheme = schemeNames[Math.floor(Math.random() * schemeNames.length)];
      applyColorScheme(chosenScheme);

      // 2. Randomize geometric motion & fluid parameters ONLY
      params.viscosity = +(0.5 + Math.random() * 1.5).toFixed(2);
      params.amplitude = +(0.12 + Math.random() * 0.22).toFixed(2);
      params.speed = +(0.65 + Math.random() * 1.0).toFixed(2);
      params.fluidRoughness = +(0.08 + Math.random() * 0.22).toFixed(2);
      fluidMaterial.roughness = params.fluidRoughness;
      upperFluidMaterial.roughness = params.fluidRoughness;
      baseRingMaterial.roughness = params.fluidRoughness;
      dropletMaterial.roughness = params.fluidRoughness;

      // 3. Randomize animation preset
      const randomPreset = animationPresets[Math.floor(Math.random() * animationPresets.length)];
      params.animationPreset = randomPreset;

      // 4. Re-seed droplets
      initDroplets();

      // Explicitly ensure postProcessor settings are NOT changed!
      gui.controllersRecursive().forEach(c => {
        if (!c.property || !(c.property in postProcessor.settings)) {
          c.updateDisplay();
        }
      });
    }

    // Distinguish click from OrbitControls drag/pan
    let pointerDownPos = { x: 0, y: 0 };
    let pointerDownTime = 0;

    canvas.addEventListener('pointerdown', (e) => {
      pointerDownPos = { x: e.clientX, y: e.clientY };
      pointerDownTime = performance.now();
    });

    canvas.addEventListener('pointerup', (e) => {
      const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
      const duration = performance.now() - pointerDownTime;
      if (dist < 6 && duration < 350) {
        if (params.randomizeOnClick) {
          triggerProceduralRandomization();
        }
      }
    });

    // -------------------------------------------------------------
    // LIL-GUI CONTROL PANEL (DEFAULT STYLING)
    // -------------------------------------------------------------
    const gui = new GUI({ title: 'Podium & Fluid Gold Settings' });

    const displayFolder = gui.addFolder('Display & Theme');
    displayFolder.add(params, 'colorScheme', Object.keys(colorSchemes)).name('Color Scheme').onChange((val) => {
      applyColorScheme(val);
      gui.controllersRecursive().forEach(c => {
        if (!c.property || !(c.property in postProcessor.settings)) {
          c.updateDisplay();
        }
      });
    });
    displayFolder.add(params, 'greenScreen').name('Green Screen (#00ff00)').onChange(() => {
      updateMaterialColors();
    });
    displayFolder.add(params, 'antialias').name('Three.js Antialias').onChange((val) => {
      postProcessor.setAntialias(val);
      gui.controllersRecursive().forEach(c => {
        if (c.property === 'antialias') c.updateDisplay();
      });
    });
    displayFolder.add(params, 'dpr', 0.5, 3.0, 0.1).name('Pixel Ratio (DPR)').onChange((val) => {
      renderer.setPixelRatio(val);
      postProcessor.setSize(window.innerWidth, window.innerHeight, val);
    });
    displayFolder.add(params, 'speed', 0.0, 3.0, 0.05).name('Animation Speed');
    displayFolder.add(params, 'animationPreset', animationPresets).name('Animation Preset');
    displayFolder.add(params, 'randomizeOnClick').name('Randomize on Click');

    const colorsFolder = gui.addFolder('Custom Colors');
    colorsFolder.addColor(params, 'fluidColor').name('Fluid Gold Color').onChange((val) => {
      fluidMaterial.color.set(val);
      upperFluidMaterial.color.set(val);
      baseRingMaterial.color.set(val);
      dropletMaterial.color.set(val);
    });
    colorsFolder.addColor(params, 'pedestalColor').name('Pedestal Color').onChange((val) => {
      pedestalMaterial.color.set(val);
    });
    colorsFolder.addColor(params, 'pedestalTrim').name('Pedestal Trim').onChange((val) => {
      trimMaterial.color.set(val);
    });
    colorsFolder.addColor(params, 'bgColor').name('Background Color').onChange((val) => {
      if (!params.greenScreen) {
        scene.background.set(val);
        floorMesh.material.color.set(val);
      }
    });
    colorsFolder.addColor(params, 'lightColor').name('Key Light Color').onChange((val) => {
      keyLight.color.set(val);
    });

    const fluidFolder = gui.addFolder('Fluid Parameters');
    fluidFolder.add(params, 'viscosity', 0.2, 2.5, 0.05).name('Fluid Flow / Viscosity');
    fluidFolder.add(params, 'amplitude', 0.05, 0.5, 0.01).name('Wave Amplitude');
    fluidFolder.add(params, 'fluidMetalness', 0.0, 1.0, 0.01).name('Metalness').onChange((v) => {
      fluidMaterial.metalness = v;
      upperFluidMaterial.metalness = v;
      baseRingMaterial.metalness = v;
      dropletMaterial.metalness = v;
    });
    fluidFolder.add(params, 'fluidRoughness', 0.0, 0.6, 0.01).name('Roughness').onChange((v) => {
      fluidMaterial.roughness = v;
      upperFluidMaterial.roughness = v;
      baseRingMaterial.roughness = v;
      dropletMaterial.roughness = v;
    });
    fluidFolder.add(params, 'dropletCount', 10, 60, 1).name('Droplets Count').onChange(() => {
      initDroplets();
    });

    const controlsFolder = gui.addFolder('Camera & Drag Mode');
    controlsFolder.add(params, 'dragAction', ['Rotate Scene', 'Pan / Drag Scene']).name('Left-Click Drag').onChange(() => {
      updateDragAction();
    });

    // Attach PostProcessor suite controls directly into lil-gui
    postProcessor.attachGUI(gui, 'Post Processor Settings');

    // Toggle UI visibility with 'H' key
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        if (gui._hidden) {
          gui.show();
        } else {
          gui.hide();
        }
      }
    });

    // -------------------------------------------------------------
    // WINDOW RESIZE
    // -------------------------------------------------------------
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);
    });

    // -------------------------------------------------------------
    // ANIMATION LOOP (AUTO INFINITE ANIMATION)
    // -------------------------------------------------------------
    const clock = new THREE.Clock();
    let animTime = 0;

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const step = delta * params.speed;
      animTime += step;

      // Update fluid uniforms
      fluidUniforms.uTime.value = animTime;
      fluidUniforms.uViscosity.value = params.viscosity;
      fluidUniforms.uAmplitude.value = params.amplitude;

      // Smooth orbital rotation of fluid rings around the podium
      mainFluidMesh.rotation.y += step * 0.22 * params.viscosity;
      upperFluidMesh.rotation.y -= step * 0.18 * params.viscosity;
      baseRingMesh.rotation.y += step * 0.10 * params.viscosity;

      // Animate floating droplets
      for (let i = 0; i < droplets.length; i++) {
        const d = droplets[i];
        d.angle += step * d.speed * 0.45 * params.viscosity;
        d.mesh.position.x = Math.cos(d.angle) * d.baseRadius;
        d.mesh.position.z = Math.sin(d.angle) * d.baseRadius;
        d.mesh.position.y = d.baseY + Math.sin(animTime * d.speed * 2.0 + d.phase) * d.yAmp;

        const wobble = 1.0 + Math.sin(animTime * 3.0 + d.phase) * 0.12;
        d.mesh.scale.set(d.scale, d.scale * wobble, d.scale);
      }

      // Handle the 8 camera / podium animation presets
      if (params.animationPreset === 'Static (Showcase)') {
        // Zero camera motion; fluid circulates continuously; user has 100% manual control
      } else if (params.animationPreset === 'Gentle Orbit') {
        if (!isUserInteracting) {
          const angle = animTime * 0.18;
          const radius = 6.4;
          camera.position.x = Math.sin(angle) * radius;
          camera.position.z = Math.cos(angle) * radius;
          camera.position.y = 2.2 + Math.sin(animTime * 0.3) * 0.35;
          controls.target.set(0, 0.8, 0);
        }
      } else if (params.animationPreset === 'Cinematic Dolly') {
        if (!isUserInteracting) {
          const dist = 6.0 + Math.sin(animTime * 0.35) * 1.5;
          camera.position.set(0, 2.0 + Math.cos(animTime * 0.2) * 0.3, dist);
          controls.target.set(0, 0.8, 0);
        }
      } else if (params.animationPreset === 'Top-Down Spiral') {
        if (!isUserInteracting) {
          const angle = animTime * 0.15;
          camera.position.set(Math.sin(angle) * 4.8, 4.2 + Math.sin(animTime * 0.25) * 0.4, Math.cos(angle) * 4.8);
          controls.target.set(0, 0.7, 0);
        }
      } else if (params.animationPreset === 'Low Angle Hero') {
        if (!isUserInteracting) {
          const angle = Math.sin(animTime * 0.15) * 0.5;
          camera.position.set(Math.sin(angle) * 5.6, 0.65 + Math.cos(animTime * 0.2) * 0.2, Math.cos(angle) * 5.6);
          controls.target.set(0, 1.1, 0);
        }
      } else if (params.animationPreset === 'Figure-8 Float') {
        if (!isUserInteracting) {
          const t = animTime * 0.16;
          camera.position.x = Math.sin(t) * 6.2;
          camera.position.z = Math.cos(t) * 6.2;
          camera.position.y = 2.1 + Math.sin(t * 2.0) * 0.85;
          controls.target.set(0, 0.8, 0);
        }
      } else if (params.animationPreset === 'Liquid Pulse') {
        const pulse = 1.0 + Math.sin(animTime * 1.8) * 0.45;
        fluidUniforms.uAmplitude.value = params.amplitude * pulse;
        if (!isUserInteracting) {
          const angle = animTime * 0.12;
          camera.position.x = Math.sin(angle) * 6.3;
          camera.position.z = Math.cos(angle) * 6.3;
          camera.position.y = 2.2 + Math.sin(animTime * 0.25) * 0.2;
          controls.target.set(0, 0.8, 0);
        }
      } else if (params.animationPreset === 'Studio Turntable') {
        podiumGroup.rotation.y += step * 0.35;
      }

      controls.update();

      // Post-Processing pipeline render
      postProcessor.setMoonScreenPosition(camera, keyLight.position);
      postProcessor.renderScene(scene, camera);
    }

    animate();
  </script>
</body>
</html>
