<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cosmic Dreams - Space Voyager</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
    }
  }
  </script>

  <style>
    @property --shadow-color {
      syntax: "<color>";
      initial-value: transparent;
      inherits: true;
    }

    @property --space {
      syntax: "<length>";
      initial-value: 0px;
      inherits: true;
    }

    @property --moon-angle {
      syntax: "<angle>";
      initial-value: 0deg;
      inherits: true;
    }

    :root {
      --color-primary: rgba(220, 219, 219, 0.78);
      --color-surface: #242425;
      --time: 24s;

      /* Scene Dynamic Palette Tokens */
      --bg-color: #242425;
      --sun-core: #ffffff;
      --sun-glow: rgba(255, 255, 255, 0.5);
      --sun-halo: rgba(255, 255, 255, 0.4);
      --sun-size: 25vmax;

      --planet-primary: #ede9ea;
      --planet-secondary: #7a7a7a;
      --planet-dark: #212528;

      --cuboid-top: #e8dbdd;
      --cuboid-top-dark: #989699;
      --cuboid-side: #5f595d;
      --cuboid-outline: rgba(255, 255, 255, 0.4);
      --cuboid-size: 8vmax;

      --human-color: #ffffff;
      --human-shadow-color: rgba(250, 250, 250, 0.6);

      --accent-color: #ffffff;

      --filter-color-1: rgba(50, 56, 92, 0.27);
      --filter-color-2: rgba(152, 75, 132, 0.07);
      --filter-color-3: rgba(150, 75, 152, 0.04);
      --filter-color-4: rgba(50, 56, 92, 0.27);

      /* Lighting and Exposure Multipliers */
      --exposure: 1.0;
      --sun-intensity: 1.0;
      --sun-glow-radius: 1.0;
      --ambient-intensity: 1.0;
      --nebula-intensity: 1.0;
      --outline-intensity: 1.0;
      --planet-light-intensity: 1.0;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: var(--bg-color);
      color: var(--color-primary);
      display: grid;
      place-items: center;
      perspective: 80vmax;
      user-select: none;
      -webkit-user-select: none;
      cursor: grab;
      transition: background-color 0.3s ease;
    }

    body.grabbing {
      cursor: grabbing;
    }

    body.antialias-on {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      image-rendering: auto;
    }

    body.antialias-off {
      -webkit-font-smoothing: none;
      -moz-osx-font-smoothing: none;
      image-rendering: pixelated;
    }

    /* Ambient atmospheric vignette */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 111;
      pointer-events: none;
      background: rgba(0, 0, 0, 0.1);
      mask: linear-gradient(
        black 10%,
        transparent 30%,
        transparent 70%,
        black 80%
      );
      -webkit-mask: linear-gradient(
        black 10%,
        transparent 30%,
        transparent 70%,
        black 80%
      );
      backdrop-filter: blur(5vmin) invert(0);
      -webkit-backdrop-filter: blur(5vmin) invert(0);
      transition: opacity 0.3s ease;
    }

    /* Green screen mode cleanly overrides background and removes tint filters */
    body.greenscreen-active {
      background-color: #00ff00 !important;
    }

    body.greenscreen-active::before,
    body.greenscreen-active .highlight,
    body.greenscreen-active .color-filter,
    body.greenscreen-active .stars,
    body.greenscreen-active .stars-highlights {
      display: none !important;
    }

    /* Hidden SVG filter container */
    svg.filter {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
      pointer-events: none;
    }

    /* WebGL background canvas for DPR & Three.js management */
    #webgl-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    /* Transform Stage - Receives Drag Pan, Zoom, and Camera Orbit */
    #world-stage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      transform-style: preserve-3d;
      transform-origin: center center;
      pointer-events: auto;
      filter: brightness(calc(var(--exposure) * 1.05)) contrast(calc(0.92 + var(--exposure) * 0.08));
    }

    /* --- Stars Layer --- */
    .stars {
      position: absolute;
      width: 100vmax;
      height: 100vmax;
      pointer-events: none;
      opacity: calc(0.15 * var(--ambient-intensity));
      transition: opacity 0.3s ease;
    }

    .stars::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      filter: url(#stars) saturate(0) brightness(1.5);
      mix-blend-mode: overlay;
      opacity: 0.15;
      animation: stars-animation 20s ease-in-out infinite;
    }

    .stars-highlights {
      position: absolute;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      opacity: calc(0.6 * var(--ambient-intensity));
      transition: opacity 0.3s ease;
    }

    .stars-highlights::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      filter: url(#stars-highlights) saturate(0) brightness(1.5);
      mix-blend-mode: lighten;
      opacity: 0.2;
      animation: stars-animation-2 20s ease-in-out infinite;
    }

    @keyframes stars-animation {
      from {
        translate: 1vmin 2vmin;
        rotate: 0deg;
      }
      30% {
        translate: 1vmin -2vmin;
      }
      50% {
        translate: -1vmin 2vmin;
        rotate: 10deg;
      }
      to {
        translate: 1vmin 2vmin;
        rotate: 0deg;
      }
    }

    @keyframes stars-animation-2 {
      from {
        translate: 1vmin -2vmin;
      }
      30% {
        translate: -1vmin -2vmin;
      }
      50% {
        translate: 1vmin -2vmin;
      }
      to {
        translate: 1vmin -2vmin;
      }
    }

    /* --- Startails Shooting Stars --- */
    .startails {
      position: absolute;
      inset: 0;
      opacity: calc(0.6 * var(--ambient-intensity));
      pointer-events: none;
    }

    .startails > div {
      --distance: 20vmax;
      position: absolute;
      border-radius: 50%;
      width: 0.55vmax;
      aspect-ratio: 3 / 1;
      background: var(--accent-color);
      translate: calc(var(--x, 0.5) * 100vw) calc(var(--y, 0.5) * 100vh);
      opacity: 0;
      animation: startails-animation 10s calc(var(--delay, 0) * var(--time) * 6) linear infinite;
      box-shadow: 0 0 0.2vmax var(--accent-color);
    }

    @keyframes startails-animation {
      from {
        opacity: 1;
        translate: calc(var(--x, 0.5) * 100vw) calc(var(--y, 0.5) * 100vh);
        scale: 0.9;
      }
      2% {
        scale: 0.4;
      }
      5% {
        translate: calc(var(--x, 0.5) * 100vw + var(--y2, 0) * var(--distance))
                   calc(var(--y, 0.5) * 100vh + var(--x2, 0) * var(--distance));
        opacity: 0;
        scale: 1;
      }
      to {
        translate: calc(var(--x, 0.5) * 100vw + var(--y2, 0) * var(--distance))
                   calc(var(--y, 0.5) * 100vh + var(--x2, 0) * var(--distance));
        scale: 1;
        opacity: 0;
      }
    }

    /* --- Central 3D Scene --- */
    .scene {
      display: grid;
      place-items: center;
      position: absolute;
      animation: scene-zoom-in-out var(--time) ease-in-out infinite;
      transform-style: preserve-3d;
      pointer-events: auto;
    }

    @keyframes scene-zoom-in-out {
      from {
        transform: scale(0.9);
      }
      50% {
        transform: scale(1);
      }
      to {
        transform: scale(0.9);
      }
    }

    /* --- Cuboid Monolith --- */
    .cuboid {
      position: absolute;
      transform-style: preserve-3d;
      transform: rotateY(312deg) rotateX(350deg) rotateZ(10deg) translateY(20vh);
      --size: var(--cuboid-size);
      --size-h: calc(var(--size) / 2);
      --size-h-n: calc(var(--size) / -2);
    }

    .cuboid .top {
      width: var(--size);
      aspect-ratio: 1;
      background: linear-gradient(135deg, var(--cuboid-top), var(--cuboid-top-dark));
      transform-style: preserve-3d;
      transform: rotateX(90deg) translateZ(var(--size-h-n));
      opacity: 0.9;
    }

    .cuboid .front {
      width: var(--size);
      aspect-ratio: 1 / 2;
      background: linear-gradient(var(--cuboid-side), transparent 60%);
      opacity: 0.5;
      transform: translateZ(var(--size-h));
      position: absolute;
    }

    .cuboid .right {
      width: var(--size);
      aspect-ratio: 1 / 2;
      background: linear-gradient(var(--cuboid-side) 10%, transparent 90%);
      transform: translate3d(var(--size-h), 0, 0) rotateY(90deg);
      position: absolute;
      opacity: 0.7;
      mask: radial-gradient(150% 120% at 0% 0%, black, transparent);
      -webkit-mask: radial-gradient(150% 120% at 0% 0%, black, transparent);
    }

    .cuboid .outline {
      --space: 0vmax;
      --space-h: calc(var(--size) / 2);
      position: absolute;
      width: var(--size);
      aspect-ratio: 1;
      border: 0.0125vmax solid var(--cuboid-outline);
      transition: all 3s ease-in-out;
      translate: calc(-50% + var(--space-h)) calc(-50% + var(--space-h));
      padding: var(--space);
      --duration: 16s;
      animation: outline-animation var(--duration) 0s cubic-bezier(0.68, 0.27, 0.26, 0.91) infinite;
      opacity: 0;
      box-shadow: inset 0 0 calc(0.5vmax * var(--outline-intensity)) var(--cuboid-outline),
                  0 0 calc(0.5vmax * var(--outline-intensity)) var(--cuboid-outline);
      --initial-space: var(--size-h);
    }

    .cuboid .outline:nth-of-type(2) {
      animation-delay: calc(var(--duration) / 4);
    }

    .cuboid .outline:nth-of-type(3) {
      animation-delay: calc(var(--duration) / 4 * 2);
    }

    .cuboid .outline:nth-of-type(4) {
      animation-delay: calc(var(--duration) / 4 * 3);
    }

    @keyframes outline-animation {
      from {
        --space: var(--initial-space, 0vmax);
        opacity: 0;
        filter: blur(0vmax);
      }
      5% {
        opacity: calc(0.2 * var(--outline-intensity));
      }
      40% {
        opacity: calc(0.5 * var(--outline-intensity));
      }
      60% {
        opacity: calc(0.05 * var(--outline-intensity));
        filter: blur(0vmax);
      }
      80% {
        opacity: 0;
      }
      to {
        --space: calc(var(--initial-space, 0vmax) + 25vmax);
        opacity: 0;
        filter: blur(0.6vmax);
      }
    }

    /* --- Celestial Bodies & Planets --- */
    @keyframes moon-animation {
      from {
        --moon-angle: 180deg;
      }
      50% {
        --moon-angle: 200deg;
      }
      to {
        --moon-angle: 180deg;
      }
    }

    .sun {
      border-radius: 50%;
      width: var(--sun-size);
      aspect-ratio: 1;
      background: radial-gradient(circle at 60% 60%, var(--sun-core), var(--cuboid-top), var(--planet-primary));
      position: absolute;
      transform: translateY(-20vmax);
      box-shadow:
        0 0 calc(14vmax * var(--sun-glow-radius)) color-mix(in srgb, var(--sun-glow) calc(100% * var(--sun-intensity)), transparent),
        0 0 calc(22vmax * var(--sun-glow-radius)) color-mix(in srgb, var(--sun-glow) calc(20% * var(--sun-intensity)), transparent),
        0 0 calc(42vmax * var(--sun-glow-radius)) color-mix(in srgb, var(--sun-halo) calc(80% * var(--sun-intensity)), transparent);
      transform-style: preserve-3d;
      transition: width 0.4s ease, box-shadow 0.3s ease;
    }

    .planet {
      border-radius: 50%;
      width: 17vmax;
      aspect-ratio: 1;
      background: radial-gradient(
          90% 90% at 60% 55%,
          var(--planet-dark),
          var(--planet-secondary) 52%,
          var(--planet-primary) 62%
        ),
        var(--planet-primary);
      position: absolute;
      --r: 15vmax;
      --y: calc(-10vmax + sin(var(--moon-angle)) * var(--r));
      --z: calc(cos(var(--moon-angle)) * var(--r) * -1);
      transform: translateY(var(--y)) translateX(10vmax) translateZ(var(--z));
      animation: moon-animation var(--time) ease-in-out infinite;
      box-shadow: 0 0 calc(2.5vmax * var(--planet-light-intensity)) var(--sun-glow);
      filter: blur(0.05vmax);
      transform-style: preserve-3d;
    }

    .planet-2 {
      transform-style: preserve-3d;
      border-radius: 50%;
      width: 13vmax;
      aspect-ratio: 1;
      background: radial-gradient(
        90% 90% at 60% 55%,
        var(--planet-primary),
        var(--cuboid-top) 52%,
        var(--planet-dark) 62%,
        transparent 82%
      );
      position: absolute;
      --r: 2vmax;
      --y: calc(-35vmax + sin(var(--moon-angle)) * var(--r));
      --z: calc(cos(var(--moon-angle)) * var(--r) * 1);
      transform: translateY(var(--y)) translateX(-20vmax) translateZ(var(--z));
      animation: moon-animation var(--time) ease-in-out infinite;
    }

    .planet-3 {
      transform-style: preserve-3d;
      border-radius: 50%;
      width: 2vmax;
      aspect-ratio: 1;
      background: radial-gradient(
        90% 90% at 70% 50%,
        var(--planet-primary) 16%,
        var(--cuboid-top) 38%,
        var(--planet-secondary) 52%,
        var(--planet-dark) 60%,
        transparent 82%
      );
      position: absolute;
      transform: translateY(-10vmax) translateX(-20vmax);
      opacity: calc(0.6 * var(--planet-light-intensity));
    }

    .planet-4 {
      transform-style: preserve-3d;
      border-radius: 50%;
      width: 1vmax;
      aspect-ratio: 1;
      background: radial-gradient(
        90% 90% at 70% 50%,
        var(--planet-primary),
        var(--cuboid-top) 38%,
        var(--planet-dark) 52%,
        var(--planet-dark) 60%,
        transparent 82%
      );
      position: absolute;
      transform: translateY(-11vmax) translateX(-22vmax);
      opacity: calc(0.5 * var(--planet-light-intensity));
    }

    .planet-5 {
      transform-style: preserve-3d;
      border-radius: 50%;
      width: 10vmax;
      aspect-ratio: 1;
      background: radial-gradient(
        90% 90% at 30% 55%,
        var(--planet-secondary),
        var(--planet-secondary) 52%,
        var(--planet-dark) 62%,
        transparent 82%
      );
      position: absolute;
      --r: 5vmax;
      --y: calc(-35vmax + sin(var(--moon-angle)) * var(--r));
      --z: calc(cos(var(--moon-angle)) * var(--r) * 1);
      transform: translateY(var(--y)) translateX(18vmax) translateZ(var(--z));
      clip-path: circle();
      overflow: clip;
      animation: moon-animation var(--time) ease-in-out infinite;
      filter: blur(0.03rem);
      --animation: move-to-left calc(var(--time) * 6) ease-in-out infinite;
    }

    .planet-5 .structure-1 {
      position: absolute;
      inset: -20vmax;
      filter: url(#planet-structure) saturate(0);
      mix-blend-mode: lighten;
      opacity: 0.4;
      transform: scale(4) translateX(1vmax);
      animation: var(--animation);
    }

    .planet-5 .structure-2 {
      position: absolute;
      inset: -20vmax;
      filter: url(#planet-structure) saturate(0);
      mix-blend-mode: lighten;
      opacity: 0.5;
      transform: scale(7.5);
      animation: var(--animation);
    }

    .planet-5 .structure-3 {
      position: absolute;
      inset: -20vmax;
      filter: url(#planet-structure) saturate(0);
      mix-blend-mode: lighten;
      opacity: 0.1;
      transform: scale(0.2) translateX(1vmax);
      animation: var(--animation);
    }

    .planet-5::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(
        circle at 5% 20%,
        transparent 30%,
        var(--planet-dark) 60%
      );
    }

    @keyframes move-to-left {
      from { translate: 0 0; }
      50% { translate: -100% 0; }
      to { translate: 0 0; }
    }

    .planet-6 {
      transform-style: preserve-3d;
      border-radius: 50%;
      width: 7vmax;
      aspect-ratio: 1;
      background: radial-gradient(
        90% 90% at 30% 55%,
        var(--planet-primary),
        var(--planet-secondary) 52%,
        var(--planet-dark) 72%,
        transparent
      );
      position: absolute;
      --r: 6vmax;
      --y: calc(-39.6vmax + sin(var(--moon-angle)) * var(--r));
      --z: calc(cos(var(--moon-angle)) * var(--r) * 1);
      transform: translateY(var(--y)) translateX(23vmax) translateZ(var(--z));
      animation: moon-animation var(--time) ease-in-out infinite;
      display: grid;
      place-items: center;
      filter: blur(0.06rem);
    }

    .planet-6::before {
      content: "";
      position: absolute;
      border-radius: 50%;
      width: 12vmax;
      height: 1vmax;
      border: 1vmax solid var(--planet-secondary);
      box-shadow: inset 0 0 1rem black;
      transform: rotate(25deg);
      mask: radial-gradient(circle at 50% -20%, transparent 30%, black);
      -webkit-mask: radial-gradient(circle at 50% -20%, transparent 30%, black);
      clip-path: ellipse(47% 22% at 50% 50%);
      filter: blur(0.5vmax);
    }

    .planet-6::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      width: 12vmax;
      height: 1vmax;
      border: 2.6vmax solid var(--planet-dark);
      box-shadow: inset 0 0 1rem black;
      transform: rotate(25deg);
      mask: radial-gradient(circle at 50% -20%, transparent 30%, black);
      -webkit-mask: radial-gradient(circle at 50% -20%, transparent 30%, black);
      clip-path: ellipse(47% 22% at 50% 50%);
    }

    .planets, .planets-2 {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .planets > div, .planets-2 > div {
      position: absolute;
      --distance: 20vmax;
      border-radius: 50%;
      width: 1.6vmax;
      aspect-ratio: 1;
      background: radial-gradient(
        90% 90% at 70% 50%,
        var(--planet-primary),
        var(--planet-secondary) 38%,
        var(--planet-dark) 52%,
        var(--planet-dark) 60%,
        transparent 82%
      );
      opacity: calc(0.5 * var(--planet-light-intensity));
      filter: blur(0.1rem);
      translate: calc(var(--x, 0.5) * 100vw) calc(var(--y, 0.5) * 100vh);
    }

    .planets-2 > div {
      width: 0.5vmax;
      opacity: calc(0.6 * var(--planet-light-intensity));
      filter: unset;
    }

    /* --- Object (Optional Floating Glyph) --- */
    .object {
      position: absolute;
      display: none;
      place-items: center;
      transform: rotateY(45deg) translateZ(6vmax);
      translate: 5vmax 5vmax;
    }

    .object .body {
      position: absolute;
      display: grid;
      place-items: center;
      --content: "🐋";
      font-size: 6vmax;
      color: initial;
      z-index: 1111;
    }

    .object .body:before {
      content: var(--content);
      transform: scaleX(-1);
      filter: saturate(0) brightness(1.1) drop-shadow(0 0 1vmax rgba(0, 0, 0, 0.4));
      z-index: 1111;
    }

    .object .body:after {
      content: var(--content);
      transform: scaleX(-1) scaleY(-1) translateY(2.5vmax);
      filter: saturate(0) brightness(0);
      mask: linear-gradient(to bottom, transparent 60%, black 80%);
      -webkit-mask: linear-gradient(to bottom, transparent 60%, black 80%);
      z-index: 115;
    }

    /* --- Astronaut / Human Figure --- */
    .human {
      position: absolute;
      display: grid;
      place-items: center;
      width: 6vmax;
      height: 14vmax;
      translate: 0 17vh;
      z-index: 111;
      transform-style: preserve-3d;
    }

    .human:not(.shadow) {
      filter: invert(0.04) drop-shadow(0 0 1.5vmax var(--human-shadow-color));
    }

    .human > div {
      position: absolute;
    }

    .human .head {
      background: var(--human-color);
      width: 1.5vmax;
      height: 1.6vmax;
      border-radius: 50%;
      translate: 0.2vmax -6.2vmax;
      rotate: 355deg;
    }

    .human .head:before {
      content: "";
      position: absolute;
      background: var(--human-color);
      width: 0.27vmax;
      height: 0.7vmax;
      border-radius: 50%;
      translate: 1.19vmax 0.5vmin;
      rotate: 136deg;
      animation: head-nose calc(var(--time) / 4) ease-in-out infinite;
    }

    .human .head:after {
      content: "";
      position: absolute;
      background: var(--human-color);
      width: 1.1vmax;
      height: 0.9vmax;
      border-radius: 50%;
      translate: 0.45vmax 0.66vmax;
      rotate: 45deg;
      animation: head-chin calc(var(--time) / 4) ease-in-out infinite;
    }

    @keyframes head-nose {
      from { translate: 1.19vmax 0.5vmin; }
      50% { translate: 1.06vmax 0.5vmin; }
      to { translate: 1.19vmax 0.5vmin; }
    }

    @keyframes head-chin {
      from { translate: 0.45vmax 0.66vmax; }
      50% { translate: 0.2vmax 0.66vmax; }
      to { translate: 0.45vmax 0.66vmax; }
    }

    .human .neck {
      background: var(--human-color);
      width: 0.8vmax;
      height: 1.5vmax;
      border-radius: 50%;
      translate: 0.2vmax -5.4vmax;
    }

    .human .neck:before {
      content: "";
      position: absolute;
      width: 0.3vmax;
      height: 1.5vmax;
      background: var(--human-color);
      border-radius: 50%;
      translate: 0.6vmax 0.4vmax;
      rotate: 352deg;
    }

    .human .body {
      z-index: 11;

    /* ==========================================================================

      // General & Presets
      colorScheme: 'Original',

      randomizeNow: () => randomizeScene(true),
      resetView: () => resetCameraView()

    /* ==========================================================================
       Three.js Ambient WebGL Pipeline
       ========================================================================== */
    const canvas = document.getElementById('webgl-canvas');
    let renderer = new THREE.WebGLRenderer({
      canvas: canvas,
      antialias: settings.antialias,
      alpha: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(settings.dpr);
    renderer.setSize(window.innerWidth, window.innerHeight);

    const threeScene = new THREE.Scene();
    const threeCamera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    threeCamera.position.z = 100;

    // Subtle 3D background cosmic stardust particles
    const particleGeo = new THREE.BufferGeometry();
    const particleCount = 400;
    const posArray = new Float32Array(particleCount * 3);
    for (let i = 0; i < particleCount * 3; i += 3) {
      posArray[i] = (Math.random() - 0.5) * 200;
      posArray[i + 1] = (Math.random() - 0.5) * 140;
      posArray[i + 2] = (Math.random() - 0.5) * 120;
    }
    particleGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    const particleMat = new THREE.PointsMaterial({
      size: 1.8,
      color: new THREE.Color(settings.accentColor),
      transparent: true,
      opacity: 0.35,
      blending: THREE.AdditiveBlending
    });
    const particlePoints = new THREE.Points(particleGeo, particleMat);
    threeScene.add(particlePoints);

    /* ==========================================================================
       Helper Utilities
       ========================================================================== */
    function shadeColor(hex, percent) {
      try {
        const c = new THREE.Color(hex);
        if (percent > 0) {
          c.lerp(new THREE.Color('#ffffff'), percent);
        } else {
          c.lerp(new THREE.Color('#000000'), -percent);
        }
        return '#' + c.getHexString();
      } catch (e) {
        return hex;
      }
    }

    function randomizeParticles() {
      const startails = document.querySelectorAll('.startails > div');
      startails.forEach(el => {
        el.style.setProperty('--x', Math.random().toFixed(4));
        el.style.setProperty('--y', Math.random().toFixed(4));
        el.style.setProperty('--x2', (Math.random() - 0.5).toFixed(4));
        el.style.setProperty('--y2', (Math.random() - 0.5).toFixed(4));
        el.style.setProperty('--delay', Math.random().toFixed(4));
      });

      const planets = document.querySelectorAll('.planets > div, .planets-2 > div');
      planets.forEach(el => {
        el.style.setProperty('--x', Math.random().toFixed(4));
        el.style.setProperty('--y', Math.random().toFixed(4));
        el.style.setProperty('--x2', (Math.random() - 0.5).toFixed(4));
        el.style.setProperty('--y2', (Math.random() - 0.5).toFixed(4));
        el.style.setProperty('--delay', Math.random().toFixed(4));
      });
    }

    function applyColorScheme(name) {
      const scheme = COLOR_SCHEMES[name];
      if (!scheme) return;
      settings.colorScheme = name;
      settings.bgColor = scheme.background;
      settings.sunColor = scheme.sunCore;
      settings.sunGlowColor = scheme.sunGlow;
      settings.planetPrimary = scheme.planetPrimary;
      settings.planetSecondary = scheme.planetSecondary;
      settings.planetDark = scheme.planetDark;
      settings.cuboidColor = scheme.cuboid;
      settings.humanColor = scheme.human;
      settings.accentColor = scheme.accent;
      settings.filterColor1 = scheme.filter1;
      settings.filterColor2 = scheme.filter2;

      particleMat.color.set(settings.accentColor);
      updateCSSVariables();
      gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    function updateCSSVariables() {
      const root = document.documentElement;
      const isGreen = settings.greenScreen;

      root.style.setProperty('--bg-color', isGreen ? '#00ff00' : settings.bgColor);
      root.style.setProperty('--sun-core', settings.sunColor);
      root.style.setProperty('--sun-glow', settings.sunGlowColor);
      root.style.setProperty('--sun-halo', shadeColor(settings.sunGlowColor, 0.15));
      root.style.setProperty('--planet-primary', settings.planetPrimary);
      root.style.setProperty('--planet-secondary', settings.planetSecondary);
      root.style.setProperty('--planet-dark', settings.planetDark);
      root.style.setProperty('--cuboid-top', settings.cuboidColor);
      root.style.setProperty('--cuboid-top-dark', shadeColor(settings.cuboidColor, -0.3));
      root.style.setProperty('--cuboid-side', shadeColor(settings.cuboidColor, -0.5));
      root.style.setProperty('--cuboid-outline', settings.accentColor);
      root.style.setProperty('--human-color', settings.humanColor);
      root.style.setProperty('--human-shadow-color', settings.accentColor);
      root.style.setProperty('--filter-color-1', settings.filterColor1);
      root.style.setProperty('--filter-color-2', settings.filterColor2);
      root.style.setProperty('--filter-color-3', settings.filterColor2);
      root.style.setProperty('--filter-color-4', settings.filterColor1);

      // Light Intensity Multipliers
      root.style.setProperty('--exposure', settings.exposure);
      root.style.setProperty('--sun-intensity', settings.sunIntensity);
      root.style.setProperty('--sun-glow-radius', settings.sunGlowRadius);
      root.style.setProperty('--ambient-intensity', settings.ambientIntensity);
      root.style.setProperty('--nebula-intensity', settings.nebulaIntensity);
      root.style.setProperty('--outline-intensity', settings.outlineIntensity);
      root.style.setProperty('--planet-light-intensity', settings.planetLightIntensity);

      // Animation speed & pause state
      const effectiveSpeed = settings.paused ? 0.00001 : Math.max(settings.speed, 0.05);
      root.style.setProperty('--time', (24 / effectiveSpeed) + 's');

      if (isGreen) {
        document.body.classList.add('greenscreen-active');
        particlePoints.visible = false;
      } else {
        document.body.classList.remove('greenscreen-active');
        particlePoints.visible = true;
      }
    }

    function resetCameraView() {
      settings.zoom = 1.0;
      settings.panX = 0;
      settings.panY = 0;
      settings.rotX = 0;
      settings.rotY = 0;
      gui.controllersRecursive().forEach(c => {
        if (['zoom', 'panX', 'panY', 'rotX', 'rotY'].includes(c.property)) c.updateDisplay();
      });
    }

    /* ==========================================================================
       Procedural Variation & Re-roll Engine
       ========================================================================== */
    function randomizeScene(force = false) {
      if (!force && !settings.clickRandomize) return;

      // 1. Pick a random color scheme or generate procedural colors
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      applyColorScheme(randomScheme);

      // 2. Re-roll geometric parameters
      const root = document.documentElement;
      const cuboidVmax = (6.0 + Math.random() * 5.0).toFixed(1) + 'vmax';
      const sunVmax = (20.0 + Math.random() * 12.0).toFixed(1) + 'vmax';
      root.style.setProperty('--cuboid-size', cuboidVmax);
      root.style.setProperty('--sun-size', sunVmax);

      // 3. Re-roll motion & animation
      const presetsWithoutStatic = ANIMATION_PRESETS.filter(p => p !== 'Static (No Camera Movement)');
      settings.animationPreset = presetsWithoutStatic[Math.floor(Math.random() * presetsWithoutStatic.length)];
      settings.speed = +(0.65 + Math.random() * 0.9).toFixed(2);

      // 4. Re-roll lighting dynamics slightly
      settings.exposure = +(0.85 + Math.random() * 0.35).toFixed(2);
      settings.sunIntensity = +(0.8 + Math.random() * 0.5).toFixed(2);
      settings.sunGlowRadius = +(0.8 + Math.random() * 0.4).toFixed(2);

      // 5. Scatter all startails and planets into a new celestial formation
      randomizeParticles();

      // 6. Update display across GUI
      updateCSSVariables();
      gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    /* ==========================================================================
       Interactive Pan & Zoom Event Handlers
       ========================================================================== */
    const stage = document.getElementById('world-stage');
    let isPointerDown = false;
    let startPointerX = 0;
    let startPointerY = 0;
    let startPanX = 0;
    let startPanY = 0;
    let hasDragged = false;
    let pointerDownTime = 0;

    window.addEventListener('pointerdown', (e) => {
      // Don't drag if clicking lil-gui or audio button
      if (e.target.closest('.lil-gui') || e.target.closest('#audiobutton')) return;

      isPointerDown = true;
      startPointerX = e.clientX;
      startPointerY = e.clientY;
      startPanX = settings.panX;
      startPanY = settings.panY;
      hasDragged = false;
      pointerDownTime = performance.now();
      document.body.classList.add('grabbing');
    });

    window.addEventListener('pointermove', (e) => {
      if (!isPointerDown) return;
      const dx = e.clientX - startPointerX;
      const dy = e.clientY - startPointerY;

      if (Math.hypot(dx, dy) > 5) {
        hasDragged = true;
      }

      if (e.buttons === 2 || e.shiftKey) {
        // 3D rotation with right-click or shift-drag
        settings.rotY += (e.movementX || 0) * 0.35;
        settings.rotX -= (e.movementY || 0) * 0.35;
        settings.rotX = Math.max(-75, Math.min(75, settings.rotX));
      } else {
        // Drag object across screen
        settings.panX = startPanX + dx;
        settings.panY = startPanY + dy;
      }

      gui.controllersRecursive().forEach(c => {
        if (['panX', 'panY', 'rotX', 'rotY'].includes(c.property)) c.updateDisplay();
      });
    });

    window.addEventListener('pointerup', (e) => {
      if (!isPointerDown) return;
      isPointerDown = false;
      document.body.classList.remove('grabbing');

      // Detect clean click for procedural randomization
      const clickDuration = performance.now() - pointerDownTime;
      if (!hasDragged && clickDuration < 380 && settings.clickRandomize) {
        if (!e.target.closest('.lil-gui') && !e.target.closest('#audiobutton')) {
          randomizeScene();
        }
      }
    });

    // Mouse wheel zoom
    window.addEventListener('wheel', (e) => {
      if (e.target.closest('.lil-gui')) return;
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
      settings.zoom = Math.min(Math.max(settings.zoom * zoomFactor, 0.2), 4.5);
      gui.controllersRecursive().forEach(c => {
        if (c.property === 'zoom') c.updateDisplay();
      });
    }, { passive: false });

    // Prevent context menu on 3D rotation drag
    window.addEventListener('contextmenu', (e) => {
      if (!e.target.closest('.lil-gui')) e.preventDefault();
    });

    // Window resize handler
    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      threeCamera.aspect = window.innerWidth / window.innerHeight;
      threeCamera.updateProjectionMatrix();
    });

    // Keyboard shortcut: 'H' to toggle UI
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        gui.show(gui._hidden);
      }
    });

    /* ==========================================================================
       Audio Playback
       ========================================================================== */
    const audioBtn = document.getElementById('audiobutton');
    const audio = document.getElementById('audio');
    audioBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (audio.paused) {
        audio.play().then(() => {
          audioBtn.classList.add('playing');
          audioBtn.style.opacity = '1';
        }).catch(() => {});
      } else {
        audio.pause();
        audioBtn.classList.remove('playing');
        audioBtn.style.opacity = '0.6';
      }
    });

       lil-gui Controls Setup (Default unpkg styles preserved)
       ========================================================================== */

    // Presets & Themes
    const fPresets = gui.addFolder('Presets & Themes');
    fPresets.add(settings, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Color Scheme').onChange(v => applyColorScheme(v));
    fPresets.add(settings, 'animationPreset', ANIMATION_PRESETS).name('Animation');
    fPresets.add(settings, 'greenScreen').name('Green Screen #00ff00').onChange(v => updateCSSVariables());
    fPresets.add(settings, 'clickRandomize').name('Click Scene to Randomize');
    fPresets.add(settings, 'randomizeNow').name('🎲 Procedural Re-roll');

    // Camera & Transform Navigation
    const fCam = gui.addFolder('Camera & Viewport');
    fCam.add(settings, 'zoom', 0.2, 4.0, 0.01).name('Zoom (Wheel)');
    fCam.add(settings, 'panX', -1200, 1200, 1).name('Pan X (Drag)');

    fCam.add(settings, 'rotX', -75, 75, 0.5).name('Tilt X');

    fCam.add(settings, 'resetView').name('Reset View');

    // Animation & Motion
    const fMotion = gui.addFolder('Motion & Timing');

    fMotion.add(settings, 'paused').name('Pause Motion').onChange(v => updateCSSVariables());

    // Lighting & Exposure
    const fLights = gui.addFolder('Lighting & Exposure');
    fLights.add(settings, 'exposure', 0.2, 2.5, 0.02).name('Scene Exposure').onChange(v => updateCSSVariables());
    fLights.add(settings, 'sunIntensity', 0.0, 3.0, 0.05).name('Sun Light Intensity').onChange(v => updateCSSVariables());
    fLights.add(settings, 'sunGlowRadius', 0.2, 2.5, 0.05).name('Sun Glow Radius').onChange(v => updateCSSVariables());
    fLights.add(settings, 'ambientIntensity', 0.0, 2.0, 0.05).name('Ambient Starlight').onChange(v => updateCSSVariables());
    fLights.add(settings, 'nebulaIntensity', 0.0, 2.0, 0.05).name('Nebula Highlight Glow').onChange(v => updateCSSVariables());
    fLights.add(settings, 'outlineIntensity', 0.0, 2.5, 0.05).name('Cuboid Edge Glow').onChange(v => updateCSSVariables());
    fLights.add(settings, 'planetLightIntensity', 0.0, 2.5, 0.05).name('Planet Illumination').onChange(v => updateCSSVariables());

    // Individual Colors
    const fColors = gui.addFolder('Colors Palette').close();
    fColors.addColor(settings, 'bgColor').name('Background').onChange(v => updateCSSVariables());
    fColors.addColor(settings, 'sunColor').name('Sun Core').onChange(v => updateCSSVariables());
    fColors.addColor(settings, 'sunGlowColor').name('Sun Glow').onChange(v => updateCSSVariables());
    fColors.addColor(settings, 'planetPrimary').name('Planet Highlight').onChange(v => updateCSSVariables());
    fColors.addColor(settings, 'planetSecondary').name('Planet Midtone').onChange(v => updateCSSVariables());
    fColors.addColor(settings, 'planetDark').name('Planet Dark').onChange(v => updateCSSVariables());
    fColors.addColor(settings, 'cuboidColor').name('Cuboid Accent').onChange(v => updateCSSVariables());
    fColors.addColor(settings, 'humanColor').name('Astronaut Suit').onChange(v => updateCSSVariables());
    fColors.addColor(settings, 'accentColor').name('Accent Glow').onChange(v => {
      particleMat.color.set(v);
      updateCSSVariables();
    });

    // Render & Engine Settings
    const fRender = gui.addFolder('Rendering');
    fRender.add(settings, 'antialias').name('Three.js Antialias').onChange(v => {
      if (v) {
        document.body.classList.add('antialias-on');
        document.body.classList.remove('antialias-off');
      } else {
        document.body.classList.add('antialias-off');
        document.body.classList.remove('antialias-on');
      }
    });
    fRender.add(settings, 'dpr', 0.5, 3.0, 0.1).name('Pixel Ratio (DPR)').onChange(v => {
      renderer.setPixelRatio(v);
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    /* ==========================================================================
       Main Animation Loop (RAF)
       ========================================================================== */
    let animTime = 0;
    let lastClock = performance.now();

    function renderLoop() {
      requestAnimationFrame(renderLoop);

      const now = performance.now();
      const dt = (now - lastClock) * 0.001;
      lastClock = now;

      if (!settings.paused) {
        animTime += dt * settings.speed;
      }

      // Compute camera animation offsets
      let animPanX = 0;
      let animPanY = 0;
      let animRotX = 0;
      let animRotY = 0;
      let animZoom = 1.0;

      const t = animTime;

      switch (settings.animationPreset) {
        case 'Static (No Camera Movement)':
          break;

        case 'Cosmic Orbit (Slow Pan & Tilt)':
          animPanX = Math.sin(t * 0.3) * 35;
          animPanY = Math.cos(t * 0.24) * 20;
          animRotY = Math.sin(t * 0.2) * 10;
          animRotX = Math.cos(t * 0.16) * 5;
          animZoom = 1.0 + Math.sin(t * 0.15) * 0.05;
          break;

        case 'Ethereal Floating Drift':
          animPanX = Math.sin(t * 0.2) * 15;
          animPanY = Math.sin(t * 0.35) * 38;
          animRotY = Math.sin(t * 0.14) * 4;
          animRotX = Math.cos(t * 0.22) * 3;
          animZoom = 1.0 + Math.cos(t * 0.18) * 0.04;
          break;

        case 'Planetary Horizon Glide':
          animPanX = Math.sin(t * 0.25) * 65;
          animPanY = Math.cos(t * 0.15) * 14;
          animRotY = Math.sin(t * 0.25) * 7;
          animRotX = -3 + Math.sin(t * 0.1) * 3;
          animZoom = 1.02 + Math.sin(t * 0.2) * 0.04;
          break;

        case 'Deep Space Dolly Zoom':
          animPanX = Math.sin(t * 0.16) * 10;
          animPanY = Math.sin(t * 0.14) * 14;
          animRotY = Math.sin(t * 0.1) * 3;
          animRotX = Math.cos(t * 0.12) * 3;
          animZoom = 1.0 + Math.sin(t * 0.3) * 0.15;
          break;

        case 'Lissajous Figure-8 Sway':
          animPanX = Math.sin(t * 0.28) * 40;
          animPanY = Math.sin(t * 0.56) * 22;
          animRotY = Math.sin(t * 0.28) * 8;
          animRotX = Math.cos(t * 0.28) * 4;
          animZoom = 1.0 + Math.sin(t * 0.28) * 0.04;
          break;

        case 'Celestial Ascending Arc':
          animPanX = Math.sin(t * 0.2) * 28;
          animPanY = -20 + Math.cos(t * 0.2) * 32;
          animRotY = Math.sin(t * 0.2) * 6;
          animRotX = -7 + Math.sin(t * 0.2) * 5;
          animZoom = 0.98 + Math.cos(t * 0.2) * 0.06;
          break;

        case 'Gentle Pendulum Oscillation':
          animPanX = Math.sin(t * 0.32) * 30;
          animPanY = Math.abs(Math.sin(t * 0.32)) * 10;
          animRotY = Math.sin(t * 0.32) * 6;
          animRotX = Math.cos(t * 0.2) * 3;
          animZoom = 1.0;
          break;
      }

      // Apply combined transform to 3D world stage
      const finalPanX = settings.panX + animPanX;
      const finalPanY = settings.panY + animPanY;
      const finalZoom = settings.zoom * animZoom;
      const finalRotX = settings.rotX + animRotX;
      const finalRotY = settings.rotY + animRotY;

      stage.style.transform = `translate3d(${finalPanX.toFixed(2)}px, ${finalPanY.toFixed(2)}px, 0) scale(${finalZoom.toFixed(4)}) rotateX(${finalRotX.toFixed(2)}deg) rotateY(${finalRotY.toFixed(2)}deg)`;

      // Rotate Three.js background cosmic dust
      if (particlePoints && !settings.greenScreen) {
        particlePoints.rotation.y = t * 0.03;
        particlePoints.rotation.x = t * 0.015;
        renderer.render(threeScene, threeCamera);
      }
    }

    // Initial setup
    randomizeParticles();
    applyColorScheme('Original');
    updateCSSVariables();
    renderLoop();
  </script>
</body>
</html>
