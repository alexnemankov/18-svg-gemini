<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Living Coral</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
            }
        }
    </script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000a0d;
            cursor: grab;
            user-select: none;
            touch-action: none;
        }

        body:active {
            cursor: grabbing;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <script type="module">
        import * as THREE from 'three';
        import GUI from 'lil-gui';

        // ============================================================
        // PostProcessor Suite (Inlined for standalone file:// support)
        // ============================================================

        const orthoVertexShader = `
        precision highp float;
        in vec3 position;
        out vec2 vUv;
        void main() {
          vUv = position.xy * 0.5 + 0.5;
          gl_Position = vec4(position, 1.0);
        }
        `;

        const brightFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        uniform float bloomThreshold;
        in vec2 vUv;
        out vec4 fragColor;

        void main() {
          vec4 color = texture(inputTexture, vUv);
          float luminance = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
          float knee = 0.1;
          float soft = luminance - bloomThreshold + knee;
          soft = clamp(soft, 0.0, 2.0 * knee);
          soft = (soft * soft) / (4.0 * knee + 0.00001);
          float contribution = max(soft, luminance - bloomThreshold);
          contribution /= max(luminance, 0.00001);
          fragColor = vec4(color.rgb * contribution, color.a);
        }
        `;

        const blur13ShaderChunk = `
        vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
          vec2 resolution = vec2(textureSize(image, 0));
          vec4 color = vec4(0.0);
          vec2 off1 = vec2(1.411764705882353) * direction;
          vec2 off2 = vec2(3.2941176470588234) * direction;
          vec2 off3 = vec2(5.176470588235294) * direction;
          color += texture(image, uv) * 0.1964825501511404;
          color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
          color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
          color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
          color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
          color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
          color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
          return color;
        }
        `;

        const blurFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        uniform vec2 direction;
        in vec2 vUv;
        out vec4 color;
        ${blur13ShaderChunk}
        void main() {
          color = blur13(inputTexture, vUv, direction);
        }
        `;

        const finalFragmentShader = `
        precision highp float;
        uniform vec2 resolution;
        uniform sampler2D inputTexture;
        uniform sampler2D blur0Texture;
        uniform sampler2D blur1Texture;
        uniform sampler2D blur2Texture;
        uniform sampler2D blur3Texture;
        uniform sampler2D blur4Texture;
        uniform bool bloomEnabled;
        uniform float bloomStrength;
        uniform float vignetteBoost;
        uniform float vignetteReduction;
        uniform float noiseIntensity;
        uniform float time;
        in vec2 vUv;
        out vec4 fragColor;

        float vignette(vec2 uv, float boost, float reduction) {
          vec2 position = vUv - 0.5;
          return boost - length(position) * reduction;
        }

        float hash1(uint n) {
          n = (n << 13U) ^ n;
          n = n * (n * n * 15731U + 789221U) + 1376312589U;
          return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
        }

        float noise(in vec2 uv, in float timeVal) {
          uvec2 p = uvec2(uv);
          return hash1(p.x + 1920U * p.y + (1920U * 1080U) * uint(timeVal));
        }

        void main() {
          vec4 color = texture(inputTexture, vUv);

          if (bloomEnabled && bloomStrength > 0.001) {
            vec4 b0 = texture(blur0Texture, vUv);
            vec4 b1 = texture(blur1Texture, vUv);
            vec4 b2 = texture(blur2Texture, vUv);
            vec4 b3 = texture(blur3Texture, vUv);
            vec4 b4 = texture(blur4Texture, vUv);

            vec4 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
            color += bloomSum * bloomStrength;
          }

          color.rgb *= vignette(vUv, vignetteBoost, vignetteReduction);
          color.rgb += noiseIntensity * noise(gl_FragCoord.xy, time);
          fragColor = vec4(color.rgb, 1.0);
        }
        `;

        const chromaticAberrationShaderChunk = `
        vec2 barrelDistortion(vec2 coord, float amt) {
          vec2 cc = coord - 0.5;
          float dist = dot(cc, cc);
          return coord + cc * dist * amt;
        }
        float sat(float t) { return clamp(t, 0.0, 1.0); }
        float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
        float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
        vec4 spectrum_offset(float t) {
          float lo = step(t, 0.5);
          float hi = 1.0 - lo;
          float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
          vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
          return pow(ret, vec4(1.0 / 2.2));
        }
        const float max_distort = 2.2;
        const int num_iter = 8;
        const float reci_num_iter_f = 1.0 / float(num_iter);
        vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
          vec4 sumcol = vec4(0.0);
          vec4 sumw = vec4(0.0);
          for (int i = 0; i < num_iter; ++i) {
            float t = float(i) * reci_num_iter_f;
            vec4 w = spectrum_offset(t);
            sumw += w;
            sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
          }
          return sumcol / sumw;
        }
        `;

        const colorFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        uniform float chromaticAberrationAmount;
        uniform float minInputLevel;
        uniform float maxInputLevel;
        uniform float gammaLevel;
        uniform float fisheyeStrength;
        uniform float fisheyeRadius;
        uniform float time;
        in vec2 vUv;
        out vec4 fragColor;

        ${chromaticAberrationShaderChunk}

        vec2 applyFisheye(vec2 uv, float strength, float radius) {
          if (abs(strength) < 0.0001) return uv;
          vec2 p = uv - 0.5;
          float d = length(p);
          if (d > radius * 1.5) return uv;
          float r = d / max(radius, 0.001);
          float theta = atan(p.y, p.x);
          float rDist = r + strength * (r * r * r);
          return 0.5 + vec2(cos(theta), sin(theta)) * (rDist * radius);
        }

        vec3 gammaCorrect(vec3 color, vec3 gamma) {
          return pow(max(color, vec3(0.0)), 1.0 / gamma);
        }
        vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
          return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
        }
        vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
          return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
        }
        void main() {
          vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
          fragColor = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
          fragColor.rgb = finalLevels(fragColor.rgb, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
          fragColor.a = 1.0;
        }
        `;

        const copyFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        in vec2 vUv;
        out vec4 fragColor;
        void main() {
          fragColor = texture(inputTexture, vUv);
        }
        `;

        function createFBO(w, h, options = {}) {
          return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
            wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
            wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
            minFilter: options.minFilter || THREE.LinearFilter,
            magFilter: options.magFilter || THREE.LinearFilter,
            format: options.format || THREE.RGBAFormat,
            type: options.type || THREE.HalfFloatType,
            stencilBuffer: options.stencilBuffer || false,
            depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : true,
            samples: options.samples || 0,
          });
        }

        class ShaderPass {
          constructor(shader, options = {}) {
            this.shader = shader;
            this.orthoScene = new THREE.Scene();
            this.fbo = createFBO(1, 1, options);
            this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
            this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
            this.orthoScene.add(this.orthoQuad);
            this.texture = this.fbo.texture;
          }
          render(renderer, toScreen = false) {
            if (!toScreen) {
              renderer.setRenderTarget(this.fbo);
            }
            renderer.render(this.orthoScene, this.orthoCamera);
            if (!toScreen) {
              renderer.setRenderTarget(null);
            }
          }
          setSize(width, height) {
            this.fbo.setSize(Math.max(1, width), Math.max(1, height));
            this.orthoQuad.scale.set(width, height, 1);
          }
        }

        class ShaderPingPongPass {
          constructor(shader, options = {}) {
            this.shader = shader;
            this.orthoScene = new THREE.Scene();
            this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
            this.currentFBO = 0;
            this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
            this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
            this.orthoScene.add(this.orthoQuad);
          }
          render(renderer) {
            renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
            renderer.render(this.orthoScene, this.orthoCamera);
            renderer.setRenderTarget(null);
            this.currentFBO = 1 - this.currentFBO;
          }
          get current() { return this.fbos[this.currentFBO]; }
          get texture() { return this.current.texture; }
          setSize(width, height) {
            const w = Math.max(1, width);
            const h = Math.max(1, height);
            this.orthoQuad.scale.set(w, h, 1);
            this.fbos[0].setSize(w, h);
            this.fbos[1].setSize(w, h);
          }
        }

        class BloomPass {
          constructor(strength = 0.8, radius = 0.5, threshold = 0.2, levels = 5) {
            this.strength = strength;
            this.radius = radius;
            this.threshold = threshold;
            this.enabled = true;
            this.levels = levels;

            this.brightShader = new THREE.RawShaderMaterial({
              uniforms: {
                inputTexture: { value: null },
                bloomThreshold: { value: this.threshold },
              },
              vertexShader: orthoVertexShader,
              fragmentShader: brightFragmentShader,
              glslVersion: THREE.GLSL3,
            });
            this.brightPass = new ShaderPass(this.brightShader, {
              format: THREE.RGBAFormat,
              type: THREE.HalfFloatType,
            });

            this.blurShader = new THREE.RawShaderMaterial({
              uniforms: {
                inputTexture: { value: null },
                direction: { value: new THREE.Vector2(0, 1) },
              },
              vertexShader: orthoVertexShader,
              fragmentShader: blurFragmentShader,
              glslVersion: THREE.GLSL3,
            });

            this.blurPasses = [];
            for (let i = 0; i < this.levels; i++) {
              this.blurPasses.push(new ShaderPingPongPass(this.blurShader, {
                format: THREE.RGBAFormat,
                type: THREE.HalfFloatType,
              }));
            }
          }

          setSize(w, h) {
            let tw = Math.max(1, w);
            let th = Math.max(1, h);
            this.brightPass.setSize(tw, th);
            for (let i = 0; i < this.levels; i++) {
              tw = Math.max(1, Math.round(tw / 2));
              th = Math.max(1, Math.round(th / 2));
              this.blurPasses[i].setSize(tw, th);
            }
          }

          set source(texture) {
            this.brightShader.uniforms.inputTexture.value = texture;
          }

          render(renderer) {
            if (!this.enabled || this.strength <= 0.001) return;

            this.brightShader.uniforms.bloomThreshold.value = this.threshold;
            this.brightPass.render(renderer);

            const baseOffset = Math.max(0.1, this.radius * 2.0);
            const u = this.blurShader.uniforms;

            for (let j = 0; j < this.levels; j++) {
              const blurPass = this.blurPasses[j];
              const stepOffset = baseOffset * (1.0 + j * 0.5);

              u.direction.value.set(stepOffset, 0);
              u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
              blurPass.render(renderer);

              u.direction.value.set(0, stepOffset * 0.5);
              u.inputTexture.value = blurPass.current.texture;
              blurPass.render(renderer);
            }
          }
        }

        class PostProcessor {
          constructor(renderer, params = {}) {
            this.renderer = renderer;

            this.settings = {
              enabled: params.enabled !== undefined ? params.enabled : true,
              bloomEnabled: params.bloomEnabled !== undefined ? params.bloomEnabled : true,
              bloomStrength: params.bloomStrength !== undefined ? params.bloomStrength : 0.75,
              bloomRadius: params.bloomRadius !== undefined ? params.bloomRadius : 0.5,
              bloomThreshold: params.bloomThreshold !== undefined ? params.bloomThreshold : 0.2,

              fisheyeStrength: params.fisheyeStrength !== undefined ? params.fisheyeStrength : 0.0,
              fisheyeRadius: params.fisheyeRadius !== undefined ? params.fisheyeRadius : 1.0,
              chromaticAberration: params.chromaticAberration !== undefined ? params.chromaticAberration : 0.02,
              vignetteBoost: params.vignetteBoost !== undefined ? params.vignetteBoost : 1.0,
              vignetteReduction: params.vignetteReduction !== undefined ? params.vignetteReduction : 0.45,
              noiseIntensity: params.noiseIntensity !== undefined ? params.noiseIntensity : 0.015,

              gamma: params.gamma !== undefined ? params.gamma : 1.0,
              minInputLevel: params.minInputLevel !== undefined ? params.minInputLevel : 0.0,
              maxInputLevel: params.maxInputLevel !== undefined ? params.maxInputLevel : 1.0,
            };

            this.sceneTarget = createFBO(1, 1, { type: THREE.HalfFloatType });

            this.bloomPass = new BloomPass(
              this.settings.bloomStrength,
              this.settings.bloomRadius,
              this.settings.bloomThreshold,
              5
            );

            this.finalShader = new THREE.RawShaderMaterial({
              uniforms: {
                resolution: { value: new THREE.Vector2(1, 1) },
                bloomEnabled: { value: this.settings.bloomEnabled },
                bloomStrength: { value: this.settings.bloomStrength },
                vignetteBoost: { value: this.settings.vignetteBoost },
                vignetteReduction: { value: this.settings.vignetteReduction },
                noiseIntensity: { value: this.settings.noiseIntensity },
                inputTexture: { value: null },
                blur0Texture: { value: null },
                blur1Texture: { value: null },
                blur2Texture: { value: null },
                blur3Texture: { value: null },
                blur4Texture: { value: null },
                time: { value: 0 },
              },
              vertexShader: orthoVertexShader,
              fragmentShader: finalFragmentShader,
              glslVersion: THREE.GLSL3,
            });
            this.finalPass = new ShaderPass(this.finalShader);

            this.rgbShader = new THREE.RawShaderMaterial({
              uniforms: {
                inputTexture: { value: this.finalPass.texture },
                fisheyeStrength: { value: this.settings.fisheyeStrength },
                fisheyeRadius: { value: this.settings.fisheyeRadius },
                chromaticAberrationAmount: { value: this.settings.chromaticAberration },
                minInputLevel: { value: this.settings.minInputLevel },
                maxInputLevel: { value: this.settings.maxInputLevel },
                gammaLevel: { value: this.settings.gamma },
                time: { value: 0 },
              },
              vertexShader: orthoVertexShader,
              fragmentShader: colorFragmentShader,
              glslVersion: THREE.GLSL3,
            });
            this.rgbPass = new ShaderPass(this.rgbShader);

            this.copyPass = new THREE.RawShaderMaterial({
              uniforms: {
                inputTexture: { value: null },
              },
              vertexShader: orthoVertexShader,
              fragmentShader: copyFragmentShader,
              glslVersion: THREE.GLSL3,
            });
            this.copyPass = new ShaderPass(this.copyPass);
          }

          updateSettings() {
            this.bloomPass.enabled = this.settings.bloomEnabled;
            this.bloomPass.strength = this.settings.bloomStrength;
            this.bloomPass.radius = this.settings.bloomRadius;
            this.bloomPass.threshold = this.settings.bloomThreshold;

            this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
            this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
            this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
            this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
            this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;

            this.rgbShader.uniforms.fisheyeStrength.value = this.settings.fisheyeStrength;
            this.rgbShader.uniforms.fisheyeRadius.value = this.settings.fisheyeRadius;
            this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
            this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
            this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
            this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
          }

          setSize(w0, h0, dpr = 1) {
            const w = Math.max(1, Math.floor(w0 * dpr));
            const h = Math.max(1, Math.floor(h0 * dpr));
            this.sceneTarget.setSize(w, h);
            this.finalPass.setSize(w, h);
            this.finalShader.uniforms.resolution.value.set(w, h);
            this.bloomPass.setSize(w, h);
            this.rgbPass.setSize(w, h);
            this.copyPass.setSize(w, h);
          }

          renderScene(scene, camera) {
            if (!this.settings.enabled) {
              this.renderer.render(scene, camera);
              return;
            }
            this.renderer.setRenderTarget(this.sceneTarget);
            this.renderer.render(scene, camera);
            this.renderer.setRenderTarget(null);
            this.render(this.sceneTarget.texture);
          }

          render(sourceTexture) {
            if (!this.settings.enabled) {
              this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
              this.copyPass.render(this.renderer, true);
              return;
            }

            this.updateSettings();

            this.bloomPass.source = sourceTexture;
            this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
            this.bloomPass.render(this.renderer);

            this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
            this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
            this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
            this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
            this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

            const randomTime = Math.random() * 100000;
            this.finalPass.shader.uniforms.time.value = randomTime;
            this.rgbPass.shader.uniforms.time.value = randomTime;

            this.finalPass.render(this.renderer);
            this.rgbPass.render(this.renderer, true);
          }

          attachGUI(gui, title = "Post-Processing Suite") {
            const root = gui.addFolder(title);
            root.add(this.settings, "enabled").name("Enable Suite");

            const bloom = root.addFolder("Bloom");
            bloom.add(this.settings, "bloomEnabled").name("Enable Bloom").onChange(() => this.updateSettings());
            bloom.add(this.settings, "bloomStrength", 0, 3.0, 0.05).name("Strength").onChange(() => this.updateSettings());
            bloom.add(this.settings, "bloomRadius", 0, 2.0, 0.05).name("Radius").onChange(() => this.updateSettings());
            bloom.add(this.settings, "bloomThreshold", 0, 1.0, 0.01).name("Threshold").onChange(() => this.updateSettings());

            const lens = root.addFolder("Lens, Optics & Fisheye");
            lens.add(this.settings, "fisheyeStrength", -1.0, 1.5, 0.01).name("Fisheye Distortion").onChange(() => this.updateSettings());
            lens.add(this.settings, "fisheyeRadius", 0.2, 2.0, 0.05).name("Fisheye Radius").onChange(() => this.updateSettings());
            lens.add(this.settings, "chromaticAberration", 0, 0.2, 0.005).name("Chromatic Aberration").onChange(() => this.updateSettings());
            lens.add(this.settings, "vignetteBoost", 0, 2.0, 0.05).name("Vignette Boost").onChange(() => this.updateSettings());
            lens.add(this.settings, "vignetteReduction", 0, 2.0, 0.05).name("Vignette Falloff").onChange(() => this.updateSettings());
            lens.add(this.settings, "noiseIntensity", 0, 0.1, 0.005).name("Film Grain").onChange(() => this.updateSettings());
            lens.add(this.settings, "gamma", 0.2, 2.0, 0.05).name("Gamma").onChange(() => this.updateSettings());
            lens.add(this.settings, "minInputLevel", 0, 0.5, 0.01).name("Black Level").onChange(() => this.updateSettings());
            lens.add(this.settings, "maxInputLevel", 0.5, 1.0, 0.01).name("White Level").onChange(() => this.updateSettings());

            return root;
          }
        }

        // ============================================================
        // Color Schemes & Animation Presets
        // ============================================================

        const COLOR_SCHEMES = {
            "Analogous (Living Coral)": {
                core: "#004044",
                tips: "#76ff03",

            },
            "Complementary": {

            },
            "Split-complementary": {

            "Achromatic (Black and White)": {

            },
            "Achromatic (White and Black)": {
                core: "#ffffff",

                glow: 1.3
            },
            "Neutral + Accent": {
                core: "#1f242d",
                tips: "#4b5563",
                accent: "#00ff66",
                bg: "#0b0d11",
                glow: 1.5
            }
        };

        const ANIMATION_PRESETS = {
            "Bioluminescent Pulse": {
                speed: 0.8,
                pulseRate: 1.0,
                fractalSpeed: 0.7,
                morphIntensity: 1.0,
                smoothK: 0.65

            "Deep Sea Swell": {
                speed: 0.5,
                pulseRate: 0.6,
                fractalSpeed: 0.5,
                morphIntensity: 1.2,
                smoothK: 0.75
            },
            "Tidal Respiration": {
                speed: 0.6,
                pulseRate: 0.8,
                fractalSpeed: 0.6,
                morphIntensity: 0.9,
                smoothK: 0.6
            },
            "Polyp Bloom": {
                speed: 0.7,
                pulseRate: 1.2,
                fractalSpeed: 0.8,
                morphIntensity: 1.3,
                smoothK: 0.7
            },
            "Abyssal Flow": {
                speed: 0.35,
                pulseRate: 0.5,
                fractalSpeed: 0.4,
                morphIntensity: 0.8,
                smoothK: 0.85
            },
            "Subsea Drift": {
                speed: 0.55,
                pulseRate: 0.7,
                fractalSpeed: 0.65,
                morphIntensity: 1.1,
                smoothK: 0.7
            },
            "Hydrothermal Vent": {
                speed: 0.9,
                pulseRate: 1.3,
                fractalSpeed: 1.0,
                morphIntensity: 1.15,

                speed: 0.0,
                pulseRate: 0.0,
                fractalSpeed: 0.0,
                morphIntensity: 1.0,
                smoothK: 0.65
            }
        };

        // --- Parameters ---
        const initialScheme = COLOR_SCHEMES["Analogous (Living Coral)"];
        const initialAnim = ANIMATION_PRESETS["Bioluminescent Pulse"];

        const params = {
            colorScheme: "Analogous (Living Coral)",
            animationPreset: "Bioluminescent Pulse",
            clickToRandomize: true,
            greenScreen: false,

            dpr: 1.0,
            animationSpeed: initialAnim.speed,
            pulseRate: initialAnim.pulseRate,
            fractalSpeed: initialAnim.fractalSpeed,
            morphIntensity: initialAnim.morphIntensity,
            smoothK: initialAnim.smoothK,

            shapeSize: 2.7,
            shapeStretch: 0.75,
            plasmaDensity: 0.05,
            noiseScale: 1.15,
            glowIntensity: initialScheme.glow,
            zoom: 1.0,

            colorCore: initialScheme.core,
            colorTips: initialScheme.tips,
            colorAccent: initialScheme.accent,

            resetView: () => {
                targetPan.x = 0;
                targetPan.y = 0;
                targetZoom = 1.0;
                targetRotation.x = 0;

        };

        // --- Scene Setup ---
        const canvas = document.createElement('canvas');

        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: false, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(params.dpr);

        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        const scene = new THREE.Scene();

        // --- Initialize PostProcessor Suite ---
        const postProcessor = new PostProcessor(renderer, {
            enabled: true,
            bloomEnabled: true,
            bloomStrength: 0.75,
            bloomRadius: 0.5,
            bloomThreshold: 0.2,
            chromaticAberration: 0.02,
            vignetteBoost: 1.0,
            vignetteReduction: 0.45,
            noiseIntensity: 0.015,
            gamma: 1.0
        });
        postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);

        // --- Shader Uniforms ---
        const uniforms = {
            iTime: { value: 0.0 },
            iResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
            uPanOffset: { value: new THREE.Vector2(0.0, 0.0) },
            uMouseRot: { value: new THREE.Vector2(0.0, 0.0) },
            uZoom: { value: 1.0 },

            uFractalSpeed: { value: params.fractalSpeed },
            uPulseRate: { value: params.pulseRate },
            uMorphIntensity: { value: params.morphIntensity },
            uSmoothK: { value: params.smoothK },
            uPlasmaDensity: { value: params.plasmaDensity },
            uNoiseScale: { value: params.noiseScale },
            uShapeStretch: { value: params.shapeStretch },
            uShapeSize: { value: params.shapeSize },
            uGlowIntensity: { value: params.glowIntensity },

            uBackgroundColor: { value: new THREE.Color(params.colorBg) },
            uColorCore: { value: new THREE.Color(params.colorCore) },
            uColorTips: { value: new THREE.Color(params.colorTips) },
            uColorAccent: { value: new THREE.Color(params.colorAccent) },
            uGreenScreen: { value: 0.0 }
        };

        // --- GLSL Shader Material ---
        const material = new THREE.ShaderMaterial({
            vertexShader: `
                void main() {
                    gl_Position = vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                precision highp float;

                uniform float iTime;
                uniform vec2 iResolution;
                uniform vec2 uPanOffset;
                uniform vec2 uMouseRot;
                uniform float uZoom;

                uniform float uFractalSpeed;
                uniform float uPulseRate;
                uniform float uMorphIntensity;
                uniform float uSmoothK;
                uniform float uPlasmaDensity;
                uniform float uNoiseScale;
                uniform float uShapeStretch;
                uniform float uShapeSize;
                uniform float uGlowIntensity;

                uniform vec3 uBackgroundColor;
                uniform vec3 uColorCore;
                uniform vec3 uColorTips;
                uniform vec3 uColorAccent;
                uniform float uGreenScreen;

                const mat3 NOISE_TRANSFORM = mat3(
                    -0.21,  1.33,  0.52,
                     0.72, 0.52,  1.67,
                     0.77,  0.49,  0.18
                );

                float calculateNoise(vec3 pos) {
                    vec3 a = cos(NOISE_TRANSFORM * pos);
                    vec3 b = sin(17.1 * pos * NOISE_TRANSFORM);
                    return dot(a, b);
                }

                mat2 getRotationMatrix(float theta) {
                    float c = cos(theta);
                    float s = sin(theta);
                    return mat2(c, -s, s, c);
                }

                vec2 normalizeCoordinates(vec2 fragCoord, vec2 resolution) {
                    return (fragCoord * 2.0 - resolution.xy) / resolution.y;
                }

                float sdSphere(vec3 p, float r) {
                    return length(p) - r;
                }

                float smin(float a, float b, float k) {
                    float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
                    return mix(b, a, h) - k * h * (1.0 - h);
                }

                float mapMetaballs(vec3 p, float t, float morph, float k) {
                    // Center root organism mass
                    float d = sdSphere(p - vec3(0.0, -0.3 + 0.08 * sin(t * 0.8 * uPulseRate), 0.0), 0.95 * uShapeSize * 0.45);
                    
                    // Branch 1: Upper Right Frond
                    vec3 c1 = vec3(
                        0.55 * sin(t * 0.5 * uPulseRate),
                        0.65 + 0.2 * cos(t * 0.7 * uPulseRate),
                        0.35 * sin(t * 0.6 * uPulseRate)
                    ) * morph;
                    d = smin(d, sdSphere(p - c1, 0.65 * uShapeSize * 0.4), k);
                    
                    // Branch 2: Upper Left Frond
                    vec3 c2 = vec3(
                        -0.65 * cos(t * 0.4 * uPulseRate),
                        0.55 + 0.25 * sin(t * 0.5 * uPulseRate),
                        -0.25 * cos(t * 0.8 * uPulseRate)
                    ) * morph;
                    d = smin(d, sdSphere(p - c2, 0.58 * uShapeSize * 0.4), k);
                    
                    // Branch 3: Crown Spire (Tip)
                    vec3 c3 = vec3(
                        0.15 * sin(t * 0.9 * uPulseRate),
                        1.15 + 0.2 * sin(t * 0.75 * uPulseRate),
                        0.15 * cos(t * 0.5 * uPulseRate)
                    ) * morph;
                    d = smin(d, sdSphere(p - c3, 0.45 * uShapeSize * 0.35), k);
                    
                    // Branch 4: Lower Right Tendril
                    vec3 c4 = vec3(
                        0.65 * cos(t * 0.6 * uPulseRate),
                        -0.65 + 0.15 * sin(t * 0.4 * uPulseRate),
                        0.45 * sin(t * 0.5 * uPulseRate)
                    ) * morph;
                    d = smin(d, sdSphere(p - c4, 0.52 * uShapeSize * 0.38), k);
                    
                    // Branch 5: Lower Left Tendril
                    vec3 c5 = vec3(
                        -0.55 * sin(t * 0.7 * uPulseRate),
                        -0.55 + 0.18 * cos(t * 0.6 * uPulseRate),
                        -0.45 * cos(t * 0.3 * uPulseRate)
                    ) * morph;
                    d = smin(d, sdSphere(p - c5, 0.5 * uShapeSize * 0.38), k);
                    
                    // Branch 6: Ventral Polyp
                    vec3 c6 = vec3(
                        0.2 * sin(t * 0.3 * uPulseRate),
                        0.05 + 0.15 * cos(t * 0.8 * uPulseRate),
                        0.75 * sin(t * 0.4 * uPulseRate)
                    ) * morph;
                    d = smin(d, sdSphere(p - c6, 0.48 * uShapeSize * 0.36), k);
                    
                    // Branch 7: Dorsal Polyp
                    vec3 c7 = vec3(
                        -0.3 * cos(t * 0.5 * uPulseRate),
                        0.15 + 0.15 * sin(t * 0.9 * uPulseRate),
                        -0.75 * cos(t * 0.4 * uPulseRate)
                    ) * morph;
                    d = smin(d, sdSphere(p - c7, 0.48 * uShapeSize * 0.36), k);

                    return d;
                }

                void main() {
                    vec2 fragCoord = gl_FragCoord.xy;
                    vec2 uv = normalizeCoordinates(fragCoord, iResolution.xy);
                    uv *= 0.85;

                    vec4 colorAccumulator = vec4(0.0);
                    float totalDistance = 0.0;
                    float globalTime = iTime;

                    for (int i = 0; i < 125; i++) {
                        float iterationFloat = float(i);
                        vec3 p = vec3(uv * totalDistance, totalDistance);
                        vec3 localPos = p;

                        // Camera distance / Zoom
                        localPos.z -= 6.0 / max(uZoom, 0.1);
                        
                        // Pan offset (dragging object across screen)
                        localPos.xy -= uPanOffset;

                        // Interactive rotation / subtle tilt
                        localPos.xz *= getRotationMatrix(uMouseRot.x);
                        localPos.yz *= getRotationMatrix(uMouseRot.y);

                        vec3 shapePos = localPos;
                        shapePos.y *= uShapeStretch;

                        float bounds = mapMetaballs(shapePos, globalTime, uMorphIntensity, uSmoothK);

                        if (bounds > 0.008) {
                            totalDistance += bounds * 0.65;
                        } else {
                            vec3 noisePos = localPos * uNoiseScale;
                            float timeOffset = globalTime * 0.1 * uFractalSpeed;
                            float wavePerturbation = sin(noisePos.z * 3.1 + noisePos.x * 1.7 + timeOffset) * -0.076 + -0.011;

                            float noiseHighFreq = calculateNoise(noisePos / 1.0 + vec3(0.0, globalTime * 0.2 * uFractalSpeed, 0.0));
                            float noiseLowFreq = calculateNoise(noisePos / 4.5 + vec3(globalTime * 0.13 * uFractalSpeed, 0.0, 0.0)) * 0.8;

                            float noiseVal = wavePerturbation + abs(noiseHighFreq - noiseLowFreq);
                            float surfaceDist = abs(bounds);
                            
                            float edgeDist = min(abs(shapePos.x), min(abs(shapePos.y), abs(shapePos.z)));
                            float edgeProximity = smoothstep(0.2, 0.0, edgeDist) * smoothstep(0.3, 0.0, surfaceDist);
                            
                            float stepWithNoise = 0.02 + noiseVal * uPlasmaDensity;
                            float currentStep = mix(stepWithNoise, 0.012, edgeProximity * 0.5);
                            currentStep = max(currentStep, 0.006);

                            // Bioluminescent Color Splitting: Deep Core -> Pale Tips
                            float heightRatio = clamp((localPos.y + 1.3) / 2.6, 0.0, 1.0);
                            float depthRatio = clamp(1.0 - surfaceDist * 2.2, 0.0, 1.0);
                            float cellularNoise = sin(noisePos.y * 4.0 + noiseHighFreq * 2.5 + globalTime * 0.3 * uFractalSpeed) * 0.5 + 0.5;

                            // Blend from Core to Tips
                            vec3 bioColor = mix(uColorCore, uColorTips, clamp(heightRatio * 0.65 + cellularNoise * 0.35, 0.0, 1.0));
                            
                            // Accent bioluminescent vein lines
                            float veinGlow = smoothstep(0.05, 0.005, edgeDist) * smoothstep(0.06, -0.08, surfaceDist);
                            bioColor = mix(bioColor, uColorAccent, clamp(veinGlow * 0.85 + pow(cellularNoise, 4.0) * 0.5, 0.0, 1.0));

                            float glowFactor = cos(iterationFloat * 0.034 + globalTime * 0.4 * uFractalSpeed) * 0.45 + 0.55;
                            vec4 glowColor = vec4(bioColor * glowFactor * uGlowIntensity, 1.0);

                            float stepDivisor = currentStep * currentStep * (140000.0 / max(uGlowIntensity, 0.01));
                            colorAccumulator += glowColor / max(stepDivisor, 0.00001);
                            totalDistance += currentStep;
                        }

                        if (totalDistance > 14.0) break;
                    }

                    if (uGreenScreen > 0.5) {
                        vec3 green = vec3(0.0, 1.0, 0.0);
                        float lum = dot(colorAccumulator.rgb, vec3(0.2126, 0.7152, 0.0722));
                        if (lum < 0.0005) {
                            gl_FragColor = vec4(green, 1.0);
                        } else {
                            float alpha = smoothstep(0.0005, 0.18, lum);
                            gl_FragColor = vec4(mix(green, colorAccumulator.rgb, alpha), 1.0);
                        }
                    } else {
                        gl_FragColor = vec4(uBackgroundColor + colorAccumulator.rgb, 1.0);
                    }
                }
            `,
            uniforms: uniforms
        });

        const geometry = new THREE.PlaneGeometry(2, 2);
        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        // --- Interactive State & Damping ---
        let isDragging = false;
        let pointerDownPos = { x: 0, y: 0 };
        let pointerDownTime = 0;
        let previousMousePosition = { x: 0, y: 0 };

        let targetPan = { x: 0.0, y: 0.0 };
        let currentPan = { x: 0.0, y: 0.0 };

        let targetZoom = 1.0;
        let currentZoom = 1.0;

        let targetRotation = { x: 0.0, y: 0.0 };
        let currentRotation = { x: 0.0, y: 0.0 };

        // --- Event Listeners for Drag and Zoom ---
        window.addEventListener('pointerdown', (e) => {
            if (e.target.closest('.lil-gui')) return;
            isDragging = true;
            pointerDownPos = { x: e.clientX, y: e.clientY };
            pointerDownTime = performance.now();
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - previousMousePosition.x;
            const deltaY = e.clientY - previousMousePosition.y;

            // Pan object across screen adjusted by zoom
            targetPan.x += (deltaX * 0.004) / currentZoom;
            targetPan.y -= (deltaY * 0.004) / currentZoom;

            // Subtle 3D tilt
            targetRotation.x -= deltaX * 0.002;
            targetRotation.y += deltaY * 0.002;

            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('pointerup', (e) => {
            if (isDragging) {
                isDragging = false;
                const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
                const timeElapsed = performance.now() - pointerDownTime;

                // Scene click detection for procedural randomizer
                if (dist < 6 && timeElapsed < 350 && params.clickToRandomize) {
                    if (!e.target.closest('.lil-gui')) {
                        randomizeScene();
                    }
                }
            }
        });

        window.addEventListener('wheel', (e) => {
            if (e.target.closest('.lil-gui')) return;
            e.preventDefault();
            const zoomFactor = Math.exp(-e.deltaY * 0.0015);
            targetZoom = Math.max(0.3, Math.min(4.0, targetZoom * zoomFactor));
            params.zoom = targetZoom;
            updateAllControllers();
        }, { passive: false });

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            uniforms.iResolution.value.set(window.innerWidth, window.innerHeight);
            postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);
        });

        // --- Hide/Show UI on "H" key ---
        window.addEventListener('keydown', (e) => {
            if (e.key === 'h' || e.key === 'H') {
                if (gui.domElement) {
                    const isHidden = gui.domElement.style.display === 'none';
                    gui.domElement.style.display = isHidden ? '' : 'none';
                }
            }
        });

        // --- Preset Application Helpers ---
        function applyColorScheme(name) {
            const scheme = COLOR_SCHEMES[name];
            if (!scheme) return;
            params.colorCore = scheme.core;
            params.colorTips = scheme.tips;
            params.colorAccent = scheme.accent;
            params.colorBg = scheme.bg;
            params.glowIntensity = scheme.glow;

            uniforms.uColorCore.value.set(scheme.core);
            uniforms.uColorTips.value.set(scheme.tips);
            uniforms.uColorAccent.value.set(scheme.accent);
            uniforms.uGlowIntensity.value = scheme.glow;

            if (!params.greenScreen) {
                uniforms.uBackgroundColor.value.set(scheme.bg);
                document.body.style.backgroundColor = scheme.bg;
                renderer.setClearColor(scheme.bg, 1);
            }
        }

        function applyAnimationPreset(name) {
            const anim = ANIMATION_PRESETS[name];
            if (!anim) return;
            params.animationSpeed = anim.speed;
            params.pulseRate = anim.pulseRate;
            params.fractalSpeed = anim.fractalSpeed;
            params.morphIntensity = anim.morphIntensity;
            params.smoothK = anim.smoothK;

            uniforms.uPulseRate.value = anim.pulseRate;
            uniforms.uFractalSpeed.value = anim.fractalSpeed;
            uniforms.uMorphIntensity.value = anim.morphIntensity;
            uniforms.uSmoothK.value = anim.smoothK;
        }

        function setGreenScreen(enabled) {
            params.greenScreen = enabled;
            uniforms.uGreenScreen.value = enabled ? 1.0 : 0.0;
            const bg = enabled ? '#00ff00' : params.colorBg;
            document.body.style.backgroundColor = bg;
            renderer.setClearColor(bg, 1);
            if (!enabled) {
                uniforms.uBackgroundColor.value.set(params.colorBg);
            }
        }

        function updateUniformsFromParams() {
            uniforms.uPulseRate.value = params.pulseRate;
            uniforms.uFractalSpeed.value = params.fractalSpeed;
            uniforms.uMorphIntensity.value = params.morphIntensity;
            uniforms.uSmoothK.value = params.smoothK;
            uniforms.uShapeSize.value = params.shapeSize;
            uniforms.uShapeStretch.value = params.shapeStretch;
            uniforms.uPlasmaDensity.value = params.plasmaDensity;
            uniforms.uNoiseScale.value = params.noiseScale;
            uniforms.uGlowIntensity.value = params.glowIntensity;
            uniforms.uColorCore.value.set(params.colorCore);
            uniforms.uColorTips.value.set(params.colorTips);
            uniforms.uColorAccent.value.set(params.colorAccent);
            if (!params.greenScreen) {
                uniforms.uBackgroundColor.value.set(params.colorBg);
                document.body.style.backgroundColor = params.colorBg;
                renderer.setClearColor(params.colorBg, 1);
            }
        }

        function updateAllControllers() {
            function updateFolder(folder) {
                if (folder.controllers) {
                    folder.controllers.forEach(c => c.updateDisplay());
                }
                if (folder.folders) {
                    folder.folders.forEach(f => updateFolder(f));
                }
            }
            updateFolder(gui);
        }

        function randomizeScene() {
            const schemeKeys = Object.keys(COLOR_SCHEMES);
            const randomSchemeKey = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
            params.colorScheme = randomSchemeKey;
            applyColorScheme(randomSchemeKey);

            const animKeys = Object.keys(ANIMATION_PRESETS).filter(k => k !== "Static Life");
            const randomAnimKey = animKeys[Math.floor(Math.random() * animKeys.length)];
            params.animationPreset = randomAnimKey;
            applyAnimationPreset(randomAnimKey);

            params.shapeSize = +(1.8 + Math.random() * 1.8).toFixed(2);
            params.shapeStretch = +(0.5 + Math.random() * 0.7).toFixed(2);
            params.smoothK = +(0.4 + Math.random() * 0.5).toFixed(2);
            params.plasmaDensity = +(0.03 + Math.random() * 0.06).toFixed(3);
            params.noiseScale = +(0.8 + Math.random() * 1.0).toFixed(2);
            params.glowIntensity = +(0.8 + Math.random() * 1.0).toFixed(2);
            params.animationSpeed = +(0.4 + Math.random() * 0.8).toFixed(2);

            updateUniformsFromParams();
            updateAllControllers();
        }

        // --- lil-gui Setup ---
        const gui = new GUI({ title: 'Living Coral' });

        const fPresets = gui.addFolder('Presets');
        fPresets.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Color Scheme').onChange((v) => {
            applyColorScheme(v);
            updateAllControllers();
        });
        fPresets.add(params, 'animationPreset', Object.keys(ANIMATION_PRESETS)).name('Animation').onChange((v) => {
            applyAnimationPreset(v);
            updateAllControllers();
        });
        fPresets.add(params, 'clickToRandomize').name('Click Scene to Randomize');

        const fColor = gui.addFolder('Colors & Bioluminescence');
        fColor.addColor(params, 'colorCore').name('Core Hue').onChange((v) => uniforms.uColorCore.value.set(v));
        fColor.addColor(params, 'colorTips').name('Tips Glow').onChange((v) => uniforms.uColorTips.value.set(v));
        fColor.addColor(params, 'colorAccent').name('Vein Accent').onChange((v) => uniforms.uColorAccent.value.set(v));
        fColor.addColor(params, 'colorBg').name('Background').onChange((v) => {
            if (!params.greenScreen) {
                uniforms.uBackgroundColor.value.set(v);
                document.body.style.backgroundColor = v;
                renderer.setClearColor(v, 1);
            }
        });
        fColor.add(params, 'glowIntensity', 0.2, 3.0, 0.05).name('Glow Intensity').onChange((v) => uniforms.uGlowIntensity.value = v);
        fColor.add(params, 'greenScreen').name('Green Screen #00ff00').onChange(setGreenScreen);

        const fStructure = gui.addFolder('SDF Structure');
        fStructure.add(params, 'shapeSize', 1.0, 5.0, 0.1).name('Cluster Size').onChange((v) => uniforms.uShapeSize.value = v);
        fStructure.add(params, 'shapeStretch', 0.3, 1.8, 0.05).name('Vertical Stretch').onChange((v) => uniforms.uShapeStretch.value = v);
        fStructure.add(params, 'smoothK', 0.2, 1.5, 0.05).name('Metaball Blend (smin)').onChange((v) => uniforms.uSmoothK.value = v);
        fStructure.add(params, 'plasmaDensity', 0.01, 0.15, 0.005).name('Tissue Density').onChange((v) => uniforms.uPlasmaDensity.value = v);
        fStructure.add(params, 'noiseScale', 0.4, 3.0, 0.05).name('Noise Scale').onChange((v) => uniforms.uNoiseScale.value = v);

        const fMotion = gui.addFolder('Organic Motion');
        fMotion.add(params, 'animationSpeed', 0.0, 3.0, 0.05).name('Animation Speed');
        fMotion.add(params, 'pulseRate', 0.0, 3.0, 0.05).name('Respiration Rate').onChange((v) => uniforms.uPulseRate.value = v);
        fMotion.add(params, 'fractalSpeed', 0.0, 3.0, 0.05).name('Tissue Warp Speed').onChange((v) => uniforms.uFractalSpeed.value = v);
        fMotion.add(params, 'morphIntensity', 0.0, 2.0, 0.05).name('Morph Amplitude').onChange((v) => uniforms.uMorphIntensity.value = v);

        // Attach PostProcessor suite folder to GUI
        postProcessor.attachGUI(gui, "Post-Processing Suite");

        const fDisplay = gui.addFolder('Display & Camera');
        fDisplay.add(params, 'dpr', 0.5, 2.5, 0.1).name('Device Pixel Ratio').onChange((v) => {
            renderer.setPixelRatio(v);
            postProcessor.setSize(window.innerWidth, window.innerHeight, v);
        });
        fDisplay.add(params, 'zoom', 0.3, 4.0, 0.05).name('Zoom').onChange((v) => targetZoom = v);
        fDisplay.add(params, 'resetView').name('Reset View');

        // Initial setup
        applyColorScheme(params.colorScheme);
        applyAnimationPreset(params.animationPreset);

        // --- Animation Loop ---
        const clock = new THREE.Clock();
        let simulatedTime = 0.0;

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            simulatedTime += delta * params.animationSpeed;

            // Damping for Pan, Zoom, Tilt
            currentPan.x += (targetPan.x - currentPan.x) * 0.1;
            currentPan.y += (targetPan.y - currentPan.y) * 0.1;
            currentZoom += (targetZoom - currentZoom) * 0.1;
            currentRotation.x += (targetRotation.x - currentRotation.x) * 0.08;
            currentRotation.y += (targetRotation.y - currentRotation.y) * 0.08;

            uniforms.uPanOffset.value.set(currentPan.x, currentPan.y);
            uniforms.uZoom.value = currentZoom;
            uniforms.uMouseRot.value.set(currentRotation.x, currentRotation.y);
            uniforms.iTime.value = simulatedTime;

            // Render through PostProcessor pipeline
            postProcessor.renderScene(scene, camera);
        }

        animate();
    </script>
</body>
