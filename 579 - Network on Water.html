    const subsurfaceFragmentShader = `
      uniform vec3 uLineColor;
      uniform float uSubsurfaceGlow;
      uniform float uTime;
      varying vec2 vUv;

      void main() {
        float d = abs(vUv.y - 0.5) * 2.0;
        float bleed = exp(-d * d * 3.4);
        float alpha = bleed * uSubsurfaceGlow * 0.45;
        gl_FragColor = vec4(uLineColor * 0.85, alpha);
      }
    `;

    const subsurfaceMat = new THREE.ShaderMaterial({
      vertexShader: filamentVertexShader,
      fragmentShader: subsurfaceFragmentShader,
      uniforms: subsurfaceUniforms,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthTest: false,
      depthWrite: false,
      side: THREE.DoubleSide
    });

    let filamentMesh = null;
    let subsurfaceMesh = null;

    // -------------------------------------------------------------
    // Dynamic Network Graph (Nodes, Connections, Traveling Pulses)
    // -------------------------------------------------------------
    let nodes = [];
    let edgeSegments = [];
    const nodeGroup = new THREE.Group();
    scene.add(nodeGroup);

    const coreGeo = new THREE.SphereGeometry(0.56, 24, 24);
    const haloGeo = new THREE.PlaneGeometry(3.6, 3.6);
    haloGeo.rotateX(-Math.PI / 2);

    function createGlowTexture() {
      const size = 128;
      const cv = document.createElement('canvas');
      cv.width = size;
      cv.height = size;
      const ctx = cv.getContext('2d');
      const grad = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
      grad.addColorStop(0, 'rgba(255,255,255,1.0)');
      grad.addColorStop(0.22, 'rgba(255,255,255,0.72)');
      grad.addColorStop(0.55, 'rgba(255,255,255,0.18)');
      grad.addColorStop(1, 'rgba(255,255,255,0.0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, size, size);
      const tex = new THREE.CanvasTexture(cv);
      tex.generateMipmaps = true;
      return tex;
    }
    const haloTexture = createGlowTexture();

    const pulseHeadGeo = new THREE.SphereGeometry(0.48, 16, 16);
    const pulseMat = new THREE.MeshBasicMaterial({
      color: params.pulseColor,
      transparent: true,
      opacity: 0.95,
      blending: THREE.AdditiveBlending,
      depthTest: false
    });

    const tailGeo = new THREE.CylinderGeometry(0.18, 0.45, 1.0, 12, 1, true);
    tailGeo.rotateX(Math.PI / 2);
    const tailMat = new THREE.MeshBasicMaterial({
      color: params.pulseColor,
      transparent: true,
      opacity: 0.7,
      blending: THREE.AdditiveBlending,
      depthTest: false,
      depthWrite: false
    });

    const MAX_PULSES = 90;
    const pulsePool = [];
    for (let i = 0; i < MAX_PULSES; i++) {
      const head = new THREE.Mesh(pulseHeadGeo, pulseMat.clone());
      const tail = new THREE.Mesh(tailGeo, tailMat.clone());
      head.renderOrder = 22;
      tail.renderOrder = 21;
      head.visible = false;
      tail.visible = false;
      scene.add(head);
      scene.add(tail);
      pulsePool.push({
        mesh: head,
        tailMesh: tail,
        active: false,
        startPos: new THREE.Vector3(),
        endPos: new THREE.Vector3(),
        dir: new THREE.Vector3(),
        targetNodeIndex: -1,
        progress: 0,
        speed: 1.0,
        duration: 1.0
      });
    }

    function spawnPulse(fromNodeIdx, toNodeIdx, travelDuration) {
      const p = pulsePool.find(item => !item.active);
      if (!p) return;
      const fromNode = nodes[fromNodeIdx];
      const toNode = nodes[toNodeIdx];
      if (!fromNode || !toNode) return;

      p.active = true;
      p.startPos.copy(fromNode.pos);
      p.endPos.copy(toNode.pos);
      p.dir.subVectors(toNode.pos, fromNode.pos).normalize();
      p.targetNodeIndex = toNodeIdx;
      p.progress = 0;
      p.duration = Math.max(travelDuration, 0.05);

      p.mesh.position.copy(fromNode.pos);
      p.mesh.material.color.set(params.pulseColor);
      p.mesh.visible = true;

      p.tailMesh.material.color.set(params.pulseColor);
      p.tailMesh.visible = true;
    }

    function rebuildConnectionMeshes() {
      if (filamentMesh) {
        scene.remove(filamentMesh);
        filamentMesh.geometry.dispose();
        filamentMesh = null;
      }
      if (subsurfaceMesh) {
        scene.remove(subsurfaceMesh);
        subsurfaceMesh.geometry.dispose();
        subsurfaceMesh = null;
      }
      if (edgeSegments.length === 0) return;

      const numSubdivs = 6;
      const vertsPerEdge = (numSubdivs + 1) * 2;
      const totalEdges = edgeSegments.length;

      const positions = new Float32Array(totalEdges * vertsPerEdge * 3);
      const subPositions = new Float32Array(totalEdges * vertsPerEdge * 3);
      const uvs = new Float32Array(totalEdges * vertsPerEdge * 2);
      const nodeIndices = new Float32Array(totalEdges * vertsPerEdge * 2);
      const indices = [];

      const normalY = new THREE.Vector3(0, 1, 0);
      const halfWidth = params.connectionWidth * 0.5;
      const subHalfWidth = halfWidth * 3.4;

      let vOffset = 0;

      for (let e = 0; e < totalEdges; e++) {
        const [i, j] = edgeSegments[e];
        const A = nodes[i].pos;
        const B = nodes[j].pos;

        const dir = new THREE.Vector3().subVectors(B, A).normalize();
        const side = new THREE.Vector3().crossVectors(dir, normalY).normalize();
        const baseIndex = (e * vertsPerEdge);

        for (let s = 0; s <= numSubdivs; s++) {
          const t = s / numSubdivs;
          const px = THREE.MathUtils.lerp(A.x, B.x, t);
          const pz = THREE.MathUtils.lerp(A.z, B.z, t);

          const lx = px - side.x * halfWidth;
          const lz = pz - side.z * halfWidth;
          const rx = px + side.x * halfWidth;
          const rz = pz + side.z * halfWidth;

          positions[vOffset * 3 + 0] = lx;
          positions[vOffset * 3 + 1] = 0.28;
          positions[vOffset * 3 + 2] = lz;

          positions[vOffset * 3 + 3] = rx;
          positions[vOffset * 3 + 4] = 0.28;
          positions[vOffset * 3 + 5] = rz;

          subPositions[vOffset * 3 + 0] = px - side.x * subHalfWidth;
          subPositions[vOffset * 3 + 1] = 0.08;
          subPositions[vOffset * 3 + 2] = pz - side.z * subHalfWidth;

          subPositions[vOffset * 3 + 3] = px + side.x * subHalfWidth;
          subPositions[vOffset * 3 + 4] = 0.08;
          subPositions[vOffset * 3 + 5] = pz + side.z * subHalfWidth;

          uvs[vOffset * 2 + 0] = t;
          uvs[vOffset * 2 + 1] = 0.0;
          uvs[vOffset * 2 + 2] = t;
          uvs[vOffset * 2 + 3] = 1.0;

          nodeIndices[vOffset * 2 + 0] = i;
          nodeIndices[vOffset * 2 + 1] = j;
          nodeIndices[vOffset * 2 + 2] = i;
          nodeIndices[vOffset * 2 + 3] = j;

          if (s < numSubdivs) {
            const idx = baseIndex + s * 2;
            indices.push(idx, idx + 1, idx + 2);
            indices.push(idx + 2, idx + 1, idx + 3);
          }

          vOffset += 2;
        }
      }

      const filGeo = new THREE.BufferGeometry();
      filGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      filGeo.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
      filGeo.setAttribute('aNodeIndices', new THREE.BufferAttribute(nodeIndices, 2));
      filGeo.setIndex(indices);
      filamentMesh = new THREE.Mesh(filGeo, filamentMat);
      filamentMesh.renderOrder = 15; // Renders above water plane cleanly
      scene.add(filamentMesh);

      const subGeo = new THREE.BufferGeometry();
      subGeo.setAttribute('position', new THREE.BufferAttribute(subPositions, 3));
      subGeo.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
      subGeo.setAttribute('aNodeIndices', new THREE.BufferAttribute(nodeIndices, 2));
      subGeo.setIndex(indices);
      subsurfaceMesh = new THREE.Mesh(subGeo, subsurfaceMat);
      subsurfaceMesh.renderOrder = 10;
      scene.add(subsurfaceMesh);
    }

    function buildNetwork() {
      while (nodeGroup.children.length > 0) {
        const obj = nodeGroup.children[0];
        nodeGroup.remove(obj);
        if (obj.geometry) obj.geometry.dispose();
      }
      pulsePool.forEach(p => { 
        p.active = false; 
        p.mesh.visible = false; 
        p.tailMesh.visible = false; 
      });
      ripplePool.forEach(r => { 
        r.active = false; 
        r.mesh.visible = false; 
      });

      nodes = [];
      const count = params.nodeCount;
      const maxRadius = 56;
      const calmR = params.calmRadius;

      let attempts = 0;
      while (nodes.length < count && attempts < 3500) {
        attempts++;
        const angle = Math.random() * Math.PI * 2;
        const dist = Math.sqrt(Math.random()) * maxRadius;
        const x = Math.cos(angle) * dist;
        const z = Math.sin(angle) * dist;

        const calmRatio = Math.min(dist / calmR, 1.0);
        const minDist = THREE.MathUtils.lerp(9.2, 6.2, calmRatio);
        if (Math.random() < (1.0 - calmRatio) * 0.3) continue;

        let tooClose = false;
        for (let i = 0; i < nodes.length; i++) {
          const dx = nodes[i].pos.x - x;
          const dz = nodes[i].pos.z - z;
          if (Math.hypot(dx, dz) < minDist) {
            tooClose = true;
            break;
          }
        }
        if (tooClose) continue;

        const nodePos = new THREE.Vector3(x, 0.4, z);

        const coreMat = new THREE.MeshStandardMaterial({
          color: params.nodeIdle,
          emissive: params.nodeIdle,
          emissiveIntensity: params.nodeEmissiveBoost * 0.75,
          roughness: 0.22,
          metalness: 0.12,
          depthTest: false
        });
        const coreMesh = new THREE.Mesh(coreGeo, coreMat);
        coreMesh.position.copy(nodePos);
        coreMesh.renderOrder = 25; // Renders on top of filament joints cleanly
        nodeGroup.add(coreMesh);

        const haloMat = new THREE.MeshBasicMaterial({
          map: haloTexture,
          color: params.nodeIdle,
          transparent: true,
          opacity: 0.65,
          blending: THREE.AdditiveBlending,
          depthTest: false,
          depthWrite: false
        });
        const haloMesh = new THREE.Mesh(haloGeo, haloMat);
        haloMesh.position.set(x, 0.12, z);
        haloMesh.renderOrder = 20;
        nodeGroup.add(haloMesh);

        const reflMat = new THREE.MeshBasicMaterial({
          map: haloTexture,
          color: params.nodeIdle,
          transparent: true,
          opacity: 0.38,
          blending: THREE.AdditiveBlending,
          depthTest: false,
          depthWrite: false
        });
        const reflMesh = new THREE.Mesh(haloGeo, reflMat);
        reflMesh.position.set(x, 0.06, z + 1.2);
        reflMesh.scale.set(1.4, 0.6, 1.0);
        reflMesh.renderOrder = 18;
        nodeGroup.add(reflMesh);

        nodes.push({
          index: nodes.length,
          pos: nodePos,
          baseY: 0.4,
          coreMesh: coreMesh,
          haloMesh: haloMesh,
          reflMesh: reflMesh,
          connections: [],
          activation: 0.0,
          cooldownTimer: 0.0,
          phase: Math.random() * Math.PI * 2,
          lastFired: 0
        });
      }

      edgeSegments = [];
      const maxConnDist = params.connectionRadius;
      const minConnDist = 6.5;

      for (let i = 0; i < nodes.length; i++) {
        const nodeA = nodes[i];
        const candidates = [];
        for (let j = 0; j < nodes.length; j++) {
          if (i === j) continue;
          const d = nodeA.pos.distanceTo(nodes[j].pos);
          if (d >= minConnDist && d <= maxConnDist) {
            candidates.push({ index: j, dist: d });
          }
        }
        candidates.sort((a, b) => a.dist - b.dist);

        const numEdges = Math.min(candidates.length, Math.floor(Math.random() * 2) + 3);
        for (let k = 0; k < numEdges; k++) {
          const neighborIdx = candidates[k].index;
          if (!nodeA.connections.includes(neighborIdx)) {
            nodeA.connections.push(neighborIdx);
            if (!nodes[neighborIdx].connections.includes(i)) {
              nodes[neighborIdx].connections.push(i);
            }
            edgeSegments.push([i, neighborIdx]);
          }
        }
      }

      rebuildConnectionMeshes();

      setTimeout(() => {
        triggerRandomNode();
      }, 300);
    }

    // -------------------------------------------------------------
    // Chain Reaction Activation & Wave Propagation
    // -------------------------------------------------------------
    let lastActivationTimestamp = 0;

    function activateNode(nodeIndex) {
      const node = nodes[nodeIndex];
      if (!node) return;

      lastActivationTimestamp = performance.now();
      node.activation = 1.0;
      node.cooldownTimer = 2.8;
      node.lastFired = performance.now();

      gsap.killTweensOf(node);
      gsap.fromTo(node, 
        { activation: 1.0 }, 
        { activation: 0.0, duration: 1.5, ease: 'power2.out' }
      );

      spawnVisualRipple(node.pos.x, node.pos.z, 36, 1.0, 0.5);
      setTimeout(() => {
        spawnVisualRipple(node.pos.x, node.pos.z, 30, 0.9, 0.35);
      }, 200);

      node.connections.forEach(neighborIdx => {
        const neighbor = nodes[neighborIdx];
        if (!neighbor) return;

        const dist = node.pos.distanceTo(neighbor.pos);
        const travelDuration = dist / params.rippleSpeed;

        spawnPulse(nodeIndex, neighborIdx, travelDuration);

        setTimeout(() => {
          if (neighbor.cooldownTimer <= 0.01) {
            activateNode(neighborIdx);
          }
        }, travelDuration * 1000 / params.animSpeed);
      });
    }

    function triggerRandomNode() {
      if (nodes.length === 0) return;
      const quietNodes = nodes.filter(n => n.cooldownTimer <= 0.1);
      const pool = quietNodes.length > 0 ? quietNodes : nodes;
      const chosen = pool[Math.floor(Math.random() * pool.length)];
      activateNode(chosen.index);
    }

    function sparkRippleCascadeAt(x, z) {
      spawnVisualRipple(x, z, 42, 1.1, 0.6);
      setTimeout(() => spawnVisualRipple(x, z, 34, 1.0, 0.4), 220);

      let closest = null;
      let minDist = 9999;
      nodes.forEach(n => {
        const d = Math.hypot(n.pos.x - x, n.pos.z - z);
        if (d < minDist) {
          minDist = d;
          closest = n;
        }
      });
      if (closest && minDist < 32) {
        setTimeout(() => {
          activateNode(closest.index);
        }, (minDist / params.rippleSpeed) * 800 / params.animSpeed);
      }
    }

    // -------------------------------------------------------------
    // 8 Preconfigured Camera Animations
    // -------------------------------------------------------------
    let animClock = 0;

    function updateCameraMotion(delta) {
      animClock += delta * params.animSpeed;

      const offset = camera.position.clone().sub(controls.target);
      const spherical = new THREE.Spherical().setFromVector3(offset);

      switch (params.cameraAnimation) {
        case 'Static (Top-Down Still)':
          break;

        case 'Gentle Orbit (Slow 360° Drift)':
          spherical.theta += 0.038 * delta * params.animSpeed;
          offset.setFromSpherical(spherical);
          camera.position.copy(controls.target).add(offset);
          break;

        case 'Subtle Water Sway (Slow Breathing & Tilt)':
          spherical.theta += Math.sin(animClock * 0.32) * 0.003 * params.animSpeed;
          spherical.phi = THREE.MathUtils.clamp(
            spherical.phi + Math.cos(animClock * 0.26) * 0.0012 * params.animSpeed,
            0.08,
            Math.PI / 2 - 0.08
          );
          offset.setFromSpherical(spherical);
          camera.position.copy(controls.target).add(offset);
          break;

        case 'Serene Glide (Linear Slow Drone Pan)':
          controls.target.x = THREE.MathUtils.lerp(controls.target.x, Math.sin(animClock * 0.16) * 7.5, 0.012);
          controls.target.z = THREE.MathUtils.lerp(controls.target.z, Math.cos(animClock * 0.13) * 7.5, 0.012);
          offset.setFromSpherical(spherical);
          camera.position.copy(controls.target).add(offset);
          break;

        case 'Figure Eight Drift (Infinity Curve)':
          spherical.theta += Math.sin(animClock * 0.24) * 0.0035 * params.animSpeed;
          controls.target.x = THREE.MathUtils.lerp(controls.target.x, Math.sin(animClock * 0.18) * 6.5, 0.012);
          controls.target.z = THREE.MathUtils.lerp(controls.target.z, Math.sin(animClock * 0.36) * 3.5, 0.012);
          offset.setFromSpherical(spherical);
          camera.position.copy(controls.target).add(offset);
          break;

        case 'Deep Horizon Tilt (Low Angle Glide)':
          spherical.theta += 0.028 * delta * params.animSpeed;
          spherical.phi = THREE.MathUtils.lerp(spherical.phi, 1.18, 0.005);
          offset.setFromSpherical(spherical);
          camera.position.copy(controls.target).add(offset);
          break;

        case 'Radial Ripple Follower (Spiral Flow)':
          spherical.theta += 0.035 * delta * params.animSpeed;
          controls.target.x = THREE.MathUtils.lerp(controls.target.x, Math.sin(animClock * 0.12) * 6.0, 0.015);
          controls.target.z = THREE.MathUtils.lerp(controls.target.z, Math.cos(animClock * 0.12) * 6.0, 0.015);
          offset.setFromSpherical(spherical);
          camera.position.copy(controls.target).add(offset);
          break;

        case 'Cinematic Drone Hover (Atmospheric Float)':
          spherical.theta += Math.sin(animClock * 0.18) * 0.0028 * params.animSpeed;
          spherical.phi = THREE.MathUtils.clamp(
            spherical.phi + Math.cos(animClock * 0.22) * 0.0014 * params.animSpeed,
            0.06,
            Math.PI / 2 - 0.08
          );
          offset.setFromSpherical(spherical);
          camera.position.copy(controls.target).add(offset);
          break;
      }
    }

    // -------------------------------------------------------------
    // Palette & Visual Theme Application
    // -------------------------------------------------------------
    function applyPalette(themeName) {
      const p = PALETTES[themeName];
      if (!p) return;
      params.preset = themeName;
      params.waterDeep = p.waterDeep;
      params.waterShallow = p.waterShallow;
      params.nodeActive = p.nodeActive;
      params.nodeIdle = p.nodeIdle;
      params.lineColor = p.line;
      params.pulseColor = p.pulse;
      params.rippleColor = p.ripple;
      params.ambientColor = p.ambient;
      params.keyLightColor = p.keyLight;
      params.bgColor = p.background;

      if (!params.greenScreen) {
        scene.background.set(params.bgColor);
        renderer.setClearColor(params.bgColor);
      }

      waterMat.uniforms.uWaterDeep.value.set(params.waterDeep);
      waterMat.uniforms.uWaterShallow.value.set(params.waterShallow);
      waterMat.uniforms.uRippleColor.value.set(params.rippleColor);
      waterMat.uniforms.uAmbientColor.value.set(params.ambientColor);
      waterMat.uniforms.uLightColor.value.set(params.keyLightColor);

      ambientLight.color.set(params.ambientColor);
      directionalLight.color.set(params.keyLightColor);

      filamentMat.uniforms.uLineColor.value.set(params.lineColor);
      filamentMat.uniforms.uPulseColor.value.set(params.pulseColor);
      subsurfaceMat.uniforms.uLineColor.value.set(params.lineColor);

      pulseMat.color.set(params.pulseColor);
      tailMat.color.set(params.pulseColor);
      ringMat.uniforms.uColor.value.set(params.rippleColor);

      // Only update scene color controllers; do NOT touch post-processing settings!
      fColor.controllersRecursive().forEach(ctrl => ctrl.updateDisplay());
    }

    // -------------------------------------------------------------
    // Procedural Scene Randomization
    // CRITICAL: DOES NOT TOUCH OR SHUFFLE POSTPROCESSING SETTINGS!
    // -------------------------------------------------------------
    function randomizeScene(hitPoint = null) {
      const keys = Object.keys(PALETTES);
      const randomPreset = keys[Math.floor(Math.random() * keys.length)];
      applyPalette(randomPreset);

      params.nodeCount = Math.floor(THREE.MathUtils.randFloat(60, 92));
      params.calmRadius = Math.round(THREE.MathUtils.randFloat(16, 28));
      params.connectionRadius = Math.round(THREE.MathUtils.randFloat(17, 25));
      params.rippleSpeed = parseFloat(THREE.MathUtils.randFloat(10, 19).toFixed(1));
      params.animSpeed = parseFloat(THREE.MathUtils.randFloat(0.7, 1.35).toFixed(2));
      params.exposure = parseFloat(THREE.MathUtils.randFloat(0.9, 1.25).toFixed(2));
      renderer.toneMappingExposure = params.exposure;

      waterMat.uniforms.uCalmRadius.value = params.calmRadius;
      filamentMat.uniforms.uCalmRadius.value = params.calmRadius;
      subsurfaceMat.uniforms.uCalmRadius.value = params.calmRadius;

      buildNetwork();

      if (hitPoint) {
        sparkRippleCascadeAt(hitPoint.x, hitPoint.z);
      } else {
        triggerRandomNode();
      }

      // Update ONLY scene & geometry controllers - Postprocessing is left untouched!
      [fColor, fConn, fAnim, fLight, fScene].forEach(folder => {
        folder.controllersRecursive().forEach(ctrl => ctrl.updateDisplay());
      });
    }

    // -------------------------------------------------------------
    // Antialias Dynamic Recreation
    // -------------------------------------------------------------
    function setAntialias(enabled) {
      params.antialias = enabled;
      const oldCanvas = renderer.domElement;
      renderer.dispose();

      renderer = new THREE.WebGLRenderer({
        canvas: undefined,
        antialias: enabled,
        powerPreference: 'high-performance'
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(params.dpr);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = params.exposure;

      oldCanvas.parentNode.replaceChild(renderer.domElement, oldCanvas);
      renderer.domElement.id = 'webgl-canvas';
      controls.domElement = renderer.domElement;
      postProcessor.renderer = renderer;
      postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);
      setupPointerEvents(renderer.domElement);
    }

    // -------------------------------------------------------------
    // Pointer Events: Distinguish Click vs Drag
    // -------------------------------------------------------------
    const raycaster = new THREE.Raycaster();
    const waterPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
    let pointerDownPos = { x: 0, y: 0, time: 0 };
    let isDown = false;

    function setupPointerEvents(targetEl) {
      targetEl.addEventListener('pointerdown', (e) => {
        if (e.target.closest && e.target.closest('.lil-gui')) return;
        pointerDownPos = { x: e.clientX, y: e.clientY, time: performance.now() };
        isDown = true;
      });

      targetEl.addEventListener('pointerup', (e) => {
        if (!isDown) return;
        isDown = false;
        if (e.target.closest && e.target.closest('.lil-gui')) return;

        const dx = e.clientX - pointerDownPos.x;
        const dy = e.clientY - pointerDownPos.y;
        const dt = performance.now() - pointerDownPos.time;

        if (Math.hypot(dx, dy) < 6 && dt < 450) {
          const mouse = new THREE.Vector2(
            (e.clientX / window.innerWidth) * 2 - 1,
            -(e.clientY / window.innerHeight) * 2 + 1
          );
          raycaster.setFromCamera(mouse, camera);
          const hit = new THREE.Vector3();
          if (raycaster.ray.intersectPlane(waterPlane, hit)) {
            if (params.clickToRandomize) {
              randomizeScene(hit);
            } else {
              sparkRippleCascadeAt(hit.x, hit.z);
            }
          }
        }
      });
    }
    setupPointerEvents(canvas);

    // -------------------------------------------------------------
    // Lil-GUI Setup
    // -------------------------------------------------------------
    const gui = new GUI({ title: 'Water Network Settings' });

    // Presets & Colors Folder
    const fColor = gui.addFolder('Presets & Colors');
    fColor.add(params, 'preset', Object.keys(PALETTES)).name('Color Preset').onChange((val) => {
      applyPalette(val);
    });
    fColor.add(params, 'greenScreen').name('Green Screen (#00ff00)').onChange((val) => {
      if (val) {
        scene.background.set(0x00ff00);
        renderer.setClearColor(0x00ff00);
        waterMat.uniforms.uIsGreenScreen.value = 1.0;
      } else {
        scene.background.set(params.bgColor);
        renderer.setClearColor(params.bgColor);
        waterMat.uniforms.uIsGreenScreen.value = 0.0;
      }
    });
    fColor.addColor(params, 'bgColor').name('Background Color').onChange((val) => {
      if (!params.greenScreen) {
        scene.background.set(val);
        renderer.setClearColor(val);
      }
    });
    fColor.addColor(params, 'waterDeep').name('Water Deep').onChange((val) => {
      waterMat.uniforms.uWaterDeep.value.set(val);
    });
    fColor.addColor(params, 'waterShallow').name('Water Shallow').onChange((val) => {
      waterMat.uniforms.uWaterShallow.value.set(val);
    });
    fColor.addColor(params, 'nodeActive').name('Node Active Glow');
    fColor.addColor(params, 'nodeIdle').name('Node Idle');
    fColor.addColor(params, 'lineColor').name('Network Lines').onChange((val) => {
      filamentMat.uniforms.uLineColor.value.set(val);
      subsurfaceMat.uniforms.uLineColor.value.set(val);
    });
    fColor.addColor(params, 'pulseColor').name('Signal Pulse').onChange((val) => {
      pulseMat.color.set(val);
      tailMat.color.set(val);
      filamentMat.uniforms.uPulseColor.value.set(val);
    });
    fColor.addColor(params, 'rippleColor').name('Water Ripple').onChange((val) => {
      waterMat.uniforms.uRippleColor.value.set(val);
      ringMat.uniforms.uColor.value.set(val);
    });

    // Connection Visuals Folder
    const fConn = gui.addFolder('Connection Visuals');
    fConn.add(params, 'connectionWidth', 0.2, 1.8, 0.05).name('Filament Width').onChange(() => {
      rebuildConnectionMeshes();
    });
    fConn.add(params, 'connectionGlow', 0.4, 3.5, 0.1).name('Filament Glow').onChange((val) => {
      filamentMat.uniforms.uGlowBoost.value = val;
    });
    fConn.add(params, 'subsurfaceGlow', 0.0, 1.5, 0.05).name('Subsurface Water Glow').onChange((val) => {
      subsurfaceMat.uniforms.uSubsurfaceGlow.value = val;
    });
    fConn.add(params, 'pulseSize', 0.2, 1.5, 0.05).name('Pulse Comet Size');

    // Camera & Motion Folder
    const fAnim = gui.addFolder('Camera & Motion');
    fAnim.add(params, 'cameraAnimation', [
      'Static (Top-Down Still)',
      'Gentle Orbit (Slow 360° Drift)',
      'Subtle Water Sway (Slow Breathing & Tilt)',
      'Serene Glide (Linear Slow Drone Pan)',
      'Figure Eight Drift (Infinity Curve)',
      'Deep Horizon Tilt (Low Angle Glide)',
      'Radial Ripple Follower (Spiral Flow)',
      'Cinematic Drone Hover (Atmospheric Float)'
    ]).name('Camera Animation');
    fAnim.add(params, 'animSpeed', 0.1, 3.0, 0.05).name('Animation Speed');
    fAnim.add(params, 'rippleSpeed', 5.0, 30.0, 0.5).name('Ripple Wave Speed');
    fAnim.add(params, 'calmRadius', 5.0, 45.0, 1.0).name('Calm Center Radius').onChange((val) => {
      waterMat.uniforms.uCalmRadius.value = val;
      filamentMat.uniforms.uCalmRadius.value = val;
      subsurfaceMat.uniforms.uCalmRadius.value = val;
    });

    // Lighting & Exposure Folder
    const fLight = gui.addFolder('Lighting & Exposure');
    fLight.add(params, 'exposure', 0.2, 3.0, 0.05).name('Scene Exposure').onChange((val) => {
      renderer.toneMappingExposure = val;
    });
    fLight.add(params, 'ambientIntensity', 0.0, 2.0, 0.05).name('Ambient Intensity').onChange((val) => {
      ambientLight.intensity = val;
      waterMat.uniforms.uAmbientIntensity.value = val;
    });
    fLight.addColor(params, 'ambientColor').name('Ambient Color').onChange((val) => {
      ambientLight.color.set(val);
      waterMat.uniforms.uAmbientColor.value.set(val);
    });
    fLight.add(params, 'keyLightIntensity', 0.0, 3.0, 0.05).name('Key Light Intensity').onChange((val) => {
      directionalLight.intensity = val;
      waterMat.uniforms.uLightIntensity.value = val;
    });
    fLight.addColor(params, 'keyLightColor').name('Key Light Color').onChange((val) => {
      directionalLight.color.set(val);
      waterMat.uniforms.uLightColor.value.set(val);
    });
    fLight.add(params, 'nodeEmissiveBoost', 0.5, 6.0, 0.1).name('Node Glow Boost');
    fLight.add(params, 'waterShininess', 10.0, 150.0, 1.0).name('Water Shininess').onChange((val) => {
      waterMat.uniforms.uShininess.value = val;
    });

    // Scene & Procedural Controls Folder
    const fScene = gui.addFolder('Scene & Procedural Controls');
    fScene.add(params, 'dpr', 0.5, 3.0, 0.1).name('Pixel Ratio (DPR)').onChange((val) => {
      renderer.setPixelRatio(val);
      postProcessor.setSize(window.innerWidth, window.innerHeight, val);
    });
    fScene.add(params, 'antialias').name('Antialias (default ON)').onChange((val) => {
      setAntialias(val);
    });
    fScene.add(params, 'clickToRandomize').name('Click to Randomize');
    fScene.add(params, 'sparkRandomNode').name('Spark Chain Reaction');
    fScene.add(params, 'randomizeNow').name('Randomize Variation Now');

    // Attach PostProcessor Suite Folder (Preserved across scene randomizations)
    postProcessor.attachGUI(gui, 'Post-Processing Suite');

    // Hide/Show UI with 'H' key
    let uiVisible = true;
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        uiVisible = !uiVisible;
        gui.show(uiVisible);
      }
    });

    // Window Resize Handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);
    });

    // -------------------------------------------------------------
    // Main Animation Loop
    // -------------------------------------------------------------
    const clock = new THREE.Clock();
    const activeAmberColor = new THREE.Color();
    const idleColor = new THREE.Color();
    const tempColor = new THREE.Color();

    buildNetwork();

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const scaledDelta = delta * params.animSpeed;
      const elapsedTime = clock.getElapsedTime() * params.animSpeed;

      // 1. Update Water & Filaments Time Uniform
      waterMat.uniforms.uTime.value = elapsedTime;
      filamentMat.uniforms.uTime.value = elapsedTime;
      subsurfaceMat.uniforms.uTime.value = elapsedTime;

      // 2. Camera Motion & Controls (Respects user zoom and angle)
      updateCameraMotion(delta);
      controls.update();

      // 3. Update Visual Water Ripple Rings
      let shIndex = 0;
      for (let i = 0; i < ripplePool.length; i++) {
        const r = ripplePool[i];
        if (r.active) {
          r.life += scaledDelta;
          r.radius += r.speed * scaledDelta;

          const progress = r.life / r.maxLife;
          if (progress >= 1.0) {
            r.active = false;
            r.mesh.visible = false;
          } else {
            const currentAlpha = (1.0 - progress) * r.intensity * 0.45;
            r.mesh.scale.set(r.radius, r.radius, r.radius);
            r.mesh.material.uniforms.uAlpha.value = currentAlpha;

            if (shIndex < MAX_SH_RIPPLES) {
              const shR = waterUniforms.uRipples.value[shIndex];
              shR.pos.copy(r.origin);
              shR.radius = r.radius;
              shR.intensity = (1.0 - progress) * r.intensity;
              shR.width = 1.6 + progress * 2.0;
              shIndex++;
            }
          }
        }
      }
      waterUniforms.uNumRipples.value = shIndex;

      // 4. Update Network Nodes (Glow, Undulating Float, Cooldowns)
      activeAmberColor.set(params.nodeActive);
      idleColor.set(params.nodeIdle);

      let activeNodeCount = 0;

      for (let i = 0; i < nodes.length; i++) {
        const n = nodes[i];

        if (n.cooldownTimer > 0) {
          n.cooldownTimer -= scaledDelta;
        }

        const waveBob = computeWaveHeight(n.pos.x, n.pos.z, elapsedTime, params.calmRadius);
        n.coreMesh.position.y = n.baseY + waveBob;

        const idlePulse = Math.sin(elapsedTime * 1.8 + n.phase) * 0.15 + 0.85;
        const currentIntensity = THREE.MathUtils.lerp(
          idlePulse * params.nodeEmissiveBoost * 0.65,
          params.nodeEmissiveBoost * 2.8,
          n.activation
        );

        tempColor.copy(idleColor).lerp(activeAmberColor, n.activation);

        n.coreMesh.material.color.copy(tempColor);
        n.coreMesh.material.emissive.copy(tempColor);
        n.coreMesh.material.emissiveIntensity = currentIntensity;

        const haloScale = THREE.MathUtils.lerp(1.0, 2.2, n.activation);
        n.haloMesh.scale.set(haloScale, haloScale, haloScale);
        n.haloMesh.material.color.copy(tempColor);
        n.haloMesh.material.opacity = THREE.MathUtils.lerp(0.45 * idlePulse, 0.95, n.activation);

        n.reflMesh.scale.set(1.4 * haloScale, 0.6 * haloScale, 1.0);
        n.reflMesh.material.color.copy(tempColor);
        n.reflMesh.material.opacity = THREE.MathUtils.lerp(0.25 * idlePulse, 0.75, n.activation);

        if (i < MAX_NODES_UNIFORM) {
          nodeActivationsArray[i] = n.activation;
        }

        if (n.activation > 0.1) {
          activeNodeCount++;
        }
      }

      // 5. Update Traveling Signal Pulses & Comet Tails
      for (let i = 0; i < pulsePool.length; i++) {
        const p = pulsePool[i];
        if (p.active) {
          p.progress += scaledDelta / p.duration;
          if (p.progress >= 1.0) {
            p.active = false;
            p.mesh.visible = false;
            p.tailMesh.visible = false;
          } else {
            p.mesh.position.lerpVectors(p.startPos, p.endPos, p.progress);
            const waveY = computeWaveHeight(p.mesh.position.x, p.mesh.position.z, elapsedTime, params.calmRadius);
            p.mesh.position.y = waveY + 0.38;

            const pulseArc = Math.sin(p.progress * Math.PI);
            p.mesh.material.opacity = pulseArc * 0.95;
            const s = params.pulseSize * (0.8 + 0.4 * pulseArc);
            p.mesh.scale.set(s, s, s);

            const tailProg = Math.max(0.0, p.progress - 0.18);
            p.tailMesh.position.lerpVectors(p.startPos, p.endPos, (p.progress + tailProg) * 0.5);
            p.tailMesh.position.y = waveY + 0.34;
            p.tailMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), p.dir);
            const tailLen = p.startPos.distanceTo(p.endPos) * (p.progress - tailProg);
            p.tailMesh.scale.set(s * 0.65, s * 0.65, Math.max(tailLen, 0.05));
            p.tailMesh.material.opacity = pulseArc * 0.6;
          }
        }
      }

      // 6. Perpetual Auto-Animation Pacemaker
      if (activeNodeCount === 0 && performance.now() - lastActivationTimestamp > 1900) {
        triggerRandomNode();
      }

      // 7. Render Scene through PostProcessor Pipeline
      postProcessor.renderScene(scene, camera);
    }

    animate();
  </script>
</body>
</html>
