<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>509</title>
  <style>
    body {
      background: #000;
      overscroll-behavior: none;
      margin: 0;
      overflow: hidden;
    }

    #loading {
      background: black;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      visibility: visible;
      opacity: 1;
      transition: visibility 1.6s, opacity 1.6s;
    }

    #loading .circle {
      width: 50px;
      height: 50px;
      background: white;
      border-radius: 50%;
      opacity: 0;
      transform: scale(0, 0);
      animation: circle-animation 1.6s ease-in-out 0s infinite normal none;
    }

    #loading.loaded {
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }

    #container {
      width: 100vw;
      height: 100vh;
    }

    #container canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 0;
      outline: none;
    }

    /** css animation */
    @keyframes circle-animation {
      0% {
        opacity: 0;
        transform: scale(0, 0);
      }
      50% {
        opacity: 1;
        transform: scale(1, 1);
      }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/stats.js@0.17.0/build/stats.min.js"></script>
</head>

    /** vertex shader source - Ground */
    const vertexGroundShaderSource = `
    uniform float uTime;
    uniform float uWaveHeight;
    uniform float uWaveSpeed;
    uniform float uWaveFreq;

    varying vec3 vPosition;

    float PI = 3.14159265359;

    void main(){
      vPosition = position / 100.0;
      vec3 newPosition = position;
      float t = uTime * uWaveSpeed;
      newPosition.y = sin(newPosition.y * PI * uWaveFreq + t) * uWaveHeight + newPosition.y;
      newPosition.z = sin(newPosition.x * 0.01 * uWaveFreq + t) * (uWaveHeight * 10.0) + newPosition.z;
      newPosition.x = sin(newPosition.z * 0.01 * uWaveFreq + t) * (uWaveHeight * 10.0) + newPosition.x;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(newPosition, 1.0);
    }
    `;

    /** fragment shader source - Ground */
    const fragmentGroundShaderSource = `
    uniform float uTime;
    uniform float uColorSpeed;
    uniform int uColorMode;
    uniform vec3 uColorA;
    uniform vec3 uColorB;
    uniform vec3 uColorC;
    uniform vec3 uColorD;
    uniform vec3 uColors[6];
    uniform int uColorCount;

    varying vec3 vPosition;

    vec3 pal(in float t, in vec3 a, in vec3 b, in vec3 c, in vec3 d) {
      return a + b * cos(6.28318 * (c * t + d));
    }

    vec3 getRampColor(float t) {
      t = fract(t);
      float ft = t * float(uColorCount);
      int idx = int(floor(ft));
      float f = fract(ft);
      vec3 c1 = uColors[0];
      vec3 c2 = uColors[0];
      for (int i = 0; i < 6; i++) {
        if (i == idx) {
          c1 = uColors[i];
          int nextIdx = i + 1;
          if (nextIdx >= uColorCount) nextIdx = 0;
          for (int j = 0; j < 6; j++) {
            if (j == nextIdx) {
              c2 = uColors[j];
            }
          }
        }
      }
      return mix(c1, c2, smoothstep(0.0, 1.0, f));
    }

    void main () {
      float coord = vPosition.y * 0.1 + uTime * 0.1 * uColorSpeed;
      vec3 col;
      if (uColorMode == 0) {
        col = pal(coord, uColorA, uColorB, uColorC, uColorD);
      } else {
        col = getRampColor(coord);
      }
      gl_FragColor = vec4(abs(col), 1.0);
    }
    `;

    /** vertex shader source - Sphere */
    const vertexSphereShaderSource = `
    uniform float uTime;

    varying vec3 vPosition;

    float PI = 3.14159265359;

    void main(){
      vPosition = position / 100.0;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
    `;

    /** fragment shader source - Sphere */
    const fragmentSphereShaderSource = `
    uniform float uTime;
    uniform float uColorSpeed;
    uniform int uColorMode;
    uniform vec3 uColorA;
    uniform vec3 uColorB;
    uniform vec3 uColorC;
    uniform vec3 uColorD;
    uniform vec3 uColors[6];
    uniform int uColorCount;

    varying vec3 vPosition;

    vec3 pal(in float t, in vec3 a, in vec3 b, in vec3 c, in vec3 d) {
      return a + b * cos(6.28318 * (c * t + d));
    }

    vec3 getRampColor(float t) {
      t = fract(t);
      float ft = t * float(uColorCount);
      int idx = int(floor(ft));
      float f = fract(ft);
      vec3 c1 = uColors[0];
      vec3 c2 = uColors[0];
      for (int i = 0; i < 6; i++) {
        if (i == idx) {
          c1 = uColors[i];
          int nextIdx = i + 1;
          if (nextIdx >= uColorCount) nextIdx = 0;
          for (int j = 0; j < 6; j++) {
            if (j == nextIdx) {
              c2 = uColors[j];
            }
          }
        }
      }
      return mix(c1, c2, smoothstep(0.0, 1.0, f));
    }

    void main () {
      float coord = vPosition.y * 0.1 + uTime * 0.1 * uColorSpeed;
      vec3 col;
      if (uColorMode == 0) {
        col = pal(coord, uColorA, uColorB, uColorC, uColorD);
      } else {
        col = getRampColor(coord);
      }
      gl_FragColor = vec4(abs(col), 1.0);
    }
    `;

    /** vertex shader source - Outer Sphere */
    const vertexOuterSphereShaderSource = `
    uniform float uTime;

    varying vec3 vPosition;

    float PI = 3.14159265359;

    void main(){
      vPosition = position / 100.0;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
    `;

    /** fragment shader source - Outer Sphere */
    const fragmentOuterSphereShaderSource = `
    uniform float uTime;
    uniform float uNoiseScale;
    uniform float uNoiseSpeed;
    uniform float uNoiseDensity;
    uniform vec3 uOuterColor;

    varying vec3 vPosition;

    // Classic Perlin 3D Noise by Stefan Gustavson
    vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x, 289.0);}
    vec4 taylorInvSqrt(vec4 r){return 1.79284291400159 - 0.85373472095314 * r;}
    vec3 fade(vec3 t) {return t*t*t*(t*(t*6.0-15.0)+10.0);}

    float cnoise(vec3 P){
      vec3 Pi0 = floor(P);
      vec3 Pi1 = Pi0 + vec3(1.0);
      Pi0 = mod(Pi0, 289.0);
      Pi1 = mod(Pi1, 289.0);
      vec3 Pf0 = fract(P);
      vec3 Pf1 = Pf0 - vec3(1.0);
      vec4 ix = vec4(Pi0.x, Pi1.x, Pi0.x, Pi1.x);
      vec4 iy = vec4(Pi0.yy, Pi1.yy);
      vec4 iz0 = Pi0.zzzz;
      vec4 iz1 = Pi1.zzzz;

      vec4 ixy = permute(permute(ix) + iy);
      vec4 ixy0 = permute(ixy + iz0);
      vec4 ixy1 = permute(ixy + iz1);

      vec4 gx0 = ixy0 / 7.0;
      vec4 gy0 = fract(floor(gx0) / 7.0) - 0.5;
      gx0 = fract(gx0);
      vec4 gz0 = vec4(0.5) - abs(gx0) - abs(gy0);
      vec4 sz0 = step(gz0, vec4(0.0));
      gx0 -= sz0 * (step(0.0, gx0) - 0.5);
      gy0 -= sz0 * (step(0.0, gy0) - 0.5);

      vec4 gx1 = ixy1 / 7.0;
      vec4 gy1 = fract(floor(gx1) / 7.0) - 0.5;
      gx1 = fract(gx1);
      vec4 gz1 = vec4(0.5) - abs(gx1) - abs(gy1);
      vec4 sz1 = step(gz1, vec4(0.0));
      gx1 -= sz1 * (step(0.0, gx1) - 0.5);
      gy1 -= sz1 * (step(0.0, gy1) - 0.5);

      vec3 g000 = vec3(gx0.x,gy0.x,gz0.x);
      vec3 g100 = vec3(gx0.y,gy0.y,gz0.y);
      vec3 g010 = vec3(gx0.z,gy0.z,gz0.z);
      vec3 g110 = vec3(gx0.w,gy0.w,gz0.w);
      vec3 g001 = vec3(gx1.x,gy1.x,gz1.x);
      vec3 g101 = vec3(gx1.y,gy1.y,gz1.y);
      vec3 g011 = vec3(gx1.z,gy1.z,gz1.z);
      vec3 g111 = vec3(gx1.w,gy1.w,gz1.w);

      vec4 norm0 = taylorInvSqrt(vec4(dot(g000, g000), dot(g010, g010), dot(g100, g100), dot(g110, g110)));
      g000 *= norm0.x;
      g010 *= norm0.y;
      g100 *= norm0.z;
      g110 *= norm0.w;
      vec4 norm1 = taylorInvSqrt(vec4(dot(g001, g001), dot(g011, g011), dot(g101, g101), dot(g111, g111)));
      g001 *= norm1.x;
      g011 *= norm1.y;
      g101 *= norm1.z;
      g111 *= norm1.w;

      float n000 = dot(g000, Pf0);
      float n100 = dot(g100, vec3(Pf1.x, Pf0.yz));
      float n010 = dot(g010, vec3(Pf0.x, Pf1.y, Pf0.z));
      float n110 = dot(g110, vec3(Pf1.xy, Pf0.z));
      float n001 = dot(g001, vec3(Pf0.xy, Pf1.z));
      float n101 = dot(g101, vec3(Pf1.x, Pf0.y, Pf1.z));
      float n011 = dot(g011, vec3(Pf0.x, Pf1.yz));
      float n111 = dot(g111, Pf1);

      vec3 fade_xyz = fade(Pf0);
      vec4 n_z = mix(vec4(n000, n100, n010, n110), vec4(n001, n101, n011, n111), fade_xyz.z);
      vec2 n_yz = mix(n_z.xy, n_z.zw, fade_xyz.y);
      float n_xyz = mix(n_yz.x, n_yz.y, fade_xyz.x); 
      return 2.2 * n_xyz;
    }

    float random (vec2 st) {
      return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123);
    }

    void main () {
      float noisy = cnoise(vPosition * uNoiseScale + uTime * uNoiseSpeed);
      float alpha = clamp(noisy * random(vPosition.xy) * uNoiseDensity, 0.0, 1.0);
      gl_FragColor = vec4(uOuterColor, alpha);
    }
    `;

    /**
     * class Sketch
     */
    class Sketch {
      constructor() {
        this.params = {
          // Color & Palette
          scheme: 'Original',
          greenscreen: false,
          backgroundColor: '#000000',
          color1: '#f6aa1c',
          color2: '#bc3908',
          color3: '#941b0c',
          color4: '#3a86ff',
          color5: '#8338ec',
          outerColor: '#ffffff',
          colorSpeed: 1.0,

          // Object & Scene Interaction
          dragMode: 'Drag Object (Auto)',
          posX: 0,
          posY: 50,
          posZ: 0,

          // Geometry
          sphereRadius: window.innerWidth < 500 ? 100 : 150,
          outerOffset: 10,
          sphereWireframe: true,
          groundWireframe: true,
          waveHeight: 2.0,
          waveFrequency: 1.0,

          // Motion & Noise
          waveSpeed: 1.0,
          noiseSpeed: 0.5,
          noiseScale: 2.0,
          noiseDensity: 1.0,
          rgbShiftAmount: 0.01,
          rotationSpeed: 0.0,

          // Procedural Variation
          clickToRandomize: true
        };

        this.previousBgColor = '#000000';
        this.customColorMode = false;
        this.uiVisible = true;
        this.guiControllers = {};

        /** renderer */
        this.renderer = new THREE.WebGLRenderer({
          antialias: true,
          alpha: true
        });
        document.getElementById('container').appendChild(this.renderer.domElement);

        /** setup */
        this.statsInit();
        this.init();
        this.setupGUI();
        this.applyScheme('Original');
        this.setupEvents();
      }

      statsInit() {
        if (typeof Stats !== 'undefined') {
          this.stats = new Stats();
          this.stats.setMode(0);
          this.stats.domElement.style.position = 'absolute';
          this.stats.domElement.style.left = '0';
          this.stats.domElement.style.top = '0';
          this.stats.domElement.style.zIndex = '100';
          document.getElementById('container').appendChild(this.stats.domElement);
        }
      }

      init() {
        /** time */
        this.time = new THREE.Clock(true);

        /** mouse */
        this.mouse = new THREE.Vector2();

        /** canvas size */
        this.width = window.innerWidth;
        this.height = window.innerHeight;

        /** scene */
        this.scene = new THREE.Scene();

        /** setup and render */
        this.setupCanvas();
        this.setupCamera();
        this.setupEffect();
        this.setupShape();

        this.render();
      }

      setupCanvas() {
        this.renderer.setSize(this.width, this.height);
        this.renderer.setPixelRatio(window.devicePixelRatio);
        this.updateBackgroundColor();

        this.renderer.domElement.style.position = 'fixed';
        this.renderer.domElement.style.top = '0';
        this.renderer.domElement.style.left = '0';
        this.renderer.domElement.style.zIndex = '0';
        this.renderer.domElement.style.outline = 'none';
      }

      setupCamera() {
        const fov = 70;
        const fovRadian = (fov / 2) * (Math.PI / 180);

        this.dist = this.height / 2 / Math.tan(fovRadian);
        this.camera = new THREE.PerspectiveCamera(
          fov,
          this.width / this.height,
          1,
          this.dist * 2
        );
        this.camera.position.set(0, 100, this.dist);
        this.camera.lookAt(new THREE.Vector3());
        this.scene.add(this.camera);

        this.controls = new OrbitControls(this.camera, this.renderer.domElement);
        this.controls.enableZoom = true;
        this.controls.zoomSpeed = 1.0;
        this.controls.enablePan = true;
        this.controls.panSpeed = 1.0;
        this.controls.screenSpacePanning = true;
      }

      setupShape() {
        this.shapes = [];
        this.objectGroup = new THREE.Group();
        this.objectGroup.position.set(this.params.posX, this.params.posY, this.params.posZ);
        this.scene.add(this.objectGroup);

        const s = new Shape(this, 0, 0, 0);
        this.shapes.push(s);
      }

      setupEffect() {
        this.composer = new EffectComposer(this.renderer);
        this.composer.addPass(new RenderPass(this.scene, this.camera));

        this.effect = new ShaderPass(RGBShiftShader);
        this.effect.uniforms['amount'].value = 0.015;
        this.composer.addPass(this.effect);

        this.composer.setSize(this.width, this.height);
      }

      updateBackgroundColor() {
        const color = this.params.greenscreen ? '#00ff00' : this.params.backgroundColor;
        const threeColor = new THREE.Color(color);
        this.renderer.setClearColor(threeColor, 1.0);
        this.scene.background = threeColor;
        document.body.style.backgroundColor = color;
      }

      applyScheme(schemeName) {
        const scheme = COLOR_SCHEMES[schemeName];
        if (!scheme) return;

        this.customColorMode = false;
        this.params.scheme = schemeName;
        this.params.backgroundColor = scheme.bg;
        this.previousBgColor = scheme.bg;
        this.params.outerColor = scheme.outerColor;

        if (scheme.colors && scheme.colors.length >= 5) {
          this.params.color1 = scheme.colors[0];
          this.params.color2 = scheme.colors[1];
          this.params.color3 = scheme.colors[2];
          this.params.color4 = scheme.colors[3];
          this.params.color5 = scheme.colors[4];
        }

        this.updateShaderColors(scheme);
        this.updateBackgroundColor();

        if (this.guiControllers) {
          if (this.guiControllers.scheme) this.guiControllers.scheme.updateDisplay();
          if (this.guiControllers.backgroundColor) this.guiControllers.backgroundColor.updateDisplay();
          if (this.guiControllers.color1) this.guiControllers.color1.updateDisplay();
          if (this.guiControllers.color2) this.guiControllers.color2.updateDisplay();
          if (this.guiControllers.color3) this.guiControllers.color3.updateDisplay();
          if (this.guiControllers.color4) this.guiControllers.color4.updateDisplay();
          if (this.guiControllers.color5) this.guiControllers.color5.updateDisplay();
          if (this.guiControllers.outerColor) this.guiControllers.outerColor.updateDisplay();
        }
      }

      updateShaderColors(schemeOverride) {
        if (!this.shapes || this.shapes.length === 0) return;

        const currentScheme = schemeOverride || (this.customColorMode ? { mode: 1 } : COLOR_SCHEMES[this.params.scheme]) || {};
        const isCosine = currentScheme.mode === 0;

        const hexList = [
          this.params.color1,
          this.params.color2,
          this.params.color3,
          this.params.color4,
          this.params.color5,
          (currentScheme.colors && currentScheme.colors[5]) ? currentScheme.colors[5] : this.params.color5
        ];

        const colorCount = (currentScheme.colors && currentScheme.colors.length === 6) ? 6 : 5;

        const groundUniforms = this.shapes[0].groundMesh.material.uniforms;
        const sphereUniforms = this.shapes[0].sphereMesh.material.uniforms;
        const outerUniforms = this.shapes[0].outerSphereMesh.material.uniforms;

        groundUniforms.uColorMode.value = isCosine ? 0 : 1;
        sphereUniforms.uColorMode.value = isCosine ? 0 : 1;

        if (isCosine && currentScheme.a) {
          groundUniforms.uColorA.value.set(...currentScheme.a);
          groundUniforms.uColorB.value.set(...currentScheme.b);
          groundUniforms.uColorC.value.set(...currentScheme.c);
          groundUniforms.uColorD.value.set(...currentScheme.d);

          sphereUniforms.uColorA.value.set(...currentScheme.a);
          sphereUniforms.uColorB.value.set(...currentScheme.b);
          sphereUniforms.uColorC.value.set(...currentScheme.c);
          sphereUniforms.uColorD.value.set(...currentScheme.d);
        }

        groundUniforms.uColorCount.value = colorCount;
        sphereUniforms.uColorCount.value = colorCount;

        for (let i = 0; i < 6; i++) {
          groundUniforms.uColors.value[i].set(hexList[i]);
          sphereUniforms.uColors.value[i].set(hexList[i]);
        }

        outerUniforms.uOuterColor.value.set(this.params.outerColor);
      }

      rebuildSpheres() {
        if (!this.shapes || this.shapes.length === 0) return;
        const s = this.shapes[0];

        s.sphereMesh.geometry.dispose();
        s.sphereMesh.geometry = new THREE.SphereGeometry(this.params.sphereRadius, 32, 32);

        s.outerSphereMesh.geometry.dispose();
        s.outerSphereMesh.geometry = new THREE.SphereGeometry(this.params.sphereRadius + this.params.outerOffset, 32, 32);

        if (s.hitMesh) {
          s.hitMesh.geometry.dispose();
          s.hitMesh.geometry = new THREE.SphereGeometry(this.params.sphereRadius + 20, 16, 16);
        }
      }

      randomize() {
        const schemeKeys = Object.keys(COLOR_SCHEMES);
        const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
        this.applyScheme(randomScheme);

        if (this.params.greenscreen) {
          this.params.greenscreen = false;
          if (this.guiControllers.greenscreen) this.guiControllers.greenscreen.updateDisplay();
        }

        // Re-roll geometric parameters
        this.params.sphereRadius = getRandomNumber(80, 220);
        this.params.outerOffset = getRandomNumber(6, 26);
        this.params.waveHeight = +(Math.random() * 4.5 + 0.8).toFixed(2);
        this.params.waveFrequency = +(Math.random() * 2.5 + 0.5).toFixed(2);

        // Re-roll motion parameters
        this.params.waveSpeed = +(Math.random() * 2.5 + 0.4).toFixed(2);
        this.params.noiseSpeed = +(Math.random() * 1.8 + 0.2).toFixed(2);
        this.params.noiseScale = +(Math.random() * 3.5 + 1.0).toFixed(2);
        this.params.noiseDensity = +(Math.random() * 1.5 + 0.5).toFixed(2);
        this.params.colorSpeed = +(Math.random() * 2.5 + 0.5).toFixed(2);
        this.params.rgbShiftAmount = +(Math.random() * 0.025 + 0.003).toFixed(4);
        this.params.rotationSpeed = +(Math.random() * 0.8 - 0.4).toFixed(2);

        this.rebuildSpheres();

        // Update control panel display
        if (this.gui) {
          this.gui.controllersRecursive().forEach(ctrl => ctrl.updateDisplay());
        }
      }

      resetObjectPosition() {
        this.params.posX = 0;
        this.params.posY = 50;
        this.params.posZ = 0;
        this.objectGroup.position.set(0, 50, 0);
        if (this.guiControllers.posX) this.guiControllers.posX.updateDisplay();
        if (this.guiControllers.posY) this.guiControllers.posY.updateDisplay();
        if (this.guiControllers.posZ) this.guiControllers.posZ.updateDisplay();
      }

      resetCamera() {
        this.camera.position.set(0, 100, this.dist);
        this.camera.lookAt(new THREE.Vector3());
        this.controls.target.set(0, 0, 0);
        this.controls.update();
      }

      setupGUI() {
        this.gui = new GUI({ title: 'Scene Controls' });

        // Color & Palette Folder
        const colorFolder = this.gui.addFolder('Colors & Themes');
        this.guiControllers.scheme = colorFolder.add(this.params, 'scheme', Object.keys(COLOR_SCHEMES))
          .name('Color Scheme')
          .onChange((v) => this.applyScheme(v));

        this.guiControllers.greenscreen = colorFolder.add(this.params, 'greenscreen')
          .name('Green Screen (#00ff00)')
          .onChange((v) => {
            if (v) {
              this.previousBgColor = this.params.backgroundColor;
            } else {
              this.params.backgroundColor = this.previousBgColor;
              if (this.guiControllers.backgroundColor) this.guiControllers.backgroundColor.updateDisplay();
            }
            this.updateBackgroundColor();
          });

        this.guiControllers.backgroundColor = colorFolder.addColor(this.params, 'backgroundColor')
          .name('Background Color')
          .onChange(() => {
            if (this.params.greenscreen) {
              this.params.greenscreen = false;
              if (this.guiControllers.greenscreen) this.guiControllers.greenscreen.updateDisplay();
            }
            this.previousBgColor = this.params.backgroundColor;
            this.updateBackgroundColor();
          });

        this.guiControllers.color1 = colorFolder.addColor(this.params, 'color1')
          .name('Color 1')
          .onChange(() => {
            this.customColorMode = true;
            this.updateShaderColors();
          });

        this.guiControllers.color2 = colorFolder.addColor(this.params, 'color2')
          .name('Color 2')
          .onChange(() => {
            this.customColorMode = true;
            this.updateShaderColors();
          });

        this.guiControllers.color3 = colorFolder.addColor(this.params, 'color3')
          .name('Color 3')
          .onChange(() => {
            this.customColorMode = true;
            this.updateShaderColors();
          });

        this.guiControllers.color4 = colorFolder.addColor(this.params, 'color4')
          .name('Color 4')
          .onChange(() => {
            this.customColorMode = true;
            this.updateShaderColors();
          });

        this.guiControllers.color5 = colorFolder.addColor(this.params, 'color5')
          .name('Color 5')
          .onChange(() => {
            this.customColorMode = true;
            this.updateShaderColors();
          });

        this.guiControllers.outerColor = colorFolder.addColor(this.params, 'outerColor')
          .name('Outer Noise Color')
          .onChange(() => this.updateShaderColors());

        colorFolder.add(this.params, 'colorSpeed', 0, 5, 0.1).name('Color Cycle Speed');

        // Transform & Interaction Folder
        const transformFolder = this.gui.addFolder('Drag & Transform');
        transformFolder.add(this.params, 'dragMode', ['Drag Object (Auto)', 'Always Drag Object', 'Orbit Controls', 'Pan Camera']).name('Drag Mode');
        this.guiControllers.posX = transformFolder.add(this.params, 'posX', -600, 600, 1).name('Position X').onChange(v => { this.objectGroup.position.x = v; });
        this.guiControllers.posY = transformFolder.add(this.params, 'posY', -400, 400, 1).name('Position Y').onChange(v => { this.objectGroup.position.y = v; });
        this.guiControllers.posZ = transformFolder.add(this.params, 'posZ', -600, 600, 1).name('Position Z').onChange(v => { this.objectGroup.position.z = v; });
        transformFolder.add({ resetPos: () => this.resetObjectPosition() }, 'resetPos').name('Reset Object Position');
        transformFolder.add({ resetCam: () => this.resetCamera() }, 'resetCam').name('Reset Camera');

        // Geometry Folder
        const geomFolder = this.gui.addFolder('Geometry');
        geomFolder.add(this.params, 'sphereRadius', 50, 300, 1).name('Sphere Radius').onChange(() => this.rebuildSpheres());
        geomFolder.add(this.params, 'outerOffset', 2, 40, 1).name('Outer Offset').onChange(() => this.rebuildSpheres());
        geomFolder.add(this.params, 'waveHeight', 0, 8, 0.1).name('Wave Height');
        geomFolder.add(this.params, 'waveFrequency', 0.1, 4, 0.1).name('Wave Frequency');
        geomFolder.add(this.params, 'sphereWireframe').name('Sphere Wireframe').onChange(v => {
          this.shapes[0].sphereMesh.material.wireframe = v;
          this.shapes[0].outerSphereMesh.material.wireframe = v;
        });
        geomFolder.add(this.params, 'groundWireframe').name('Ground Wireframe').onChange(v => {
          this.shapes[0].groundMesh.material.wireframe = v;
        });

        // Motion & FX Folder
        const motionFolder = this.gui.addFolder('Motion & FX');
        motionFolder.add(this.params, 'waveSpeed', 0, 4, 0.1).name('Wave Speed');
        motionFolder.add(this.params, 'noiseSpeed', 0, 3, 0.1).name('Noise Speed');
        motionFolder.add(this.params, 'noiseScale', 0.5, 6, 0.1).name('Noise Scale');
        motionFolder.add(this.params, 'noiseDensity', 0.1, 3, 0.1).name('Noise Density');
        motionFolder.add(this.params, 'rgbShiftAmount', 0, 0.05, 0.001).name('RGB Shift');
        motionFolder.add(this.params, 'rotationSpeed', -2, 2, 0.05).name('Object Spin');

        // Procedural Variation Folder
        const procFolder = this.gui.addFolder('Procedural Variation');
        procFolder.add(this.params, 'clickToRandomize').name('Click Scene to Randomize');
        procFolder.add({ randomize: () => this.randomize() }, 'randomize').name('🎲 Randomize Scene');
      }

      setupEvents() {
        window.addEventListener('resize', this.resize.bind(this), false);

        // Hide/Show UI with "H" key
        window.addEventListener('keydown', (e) => {
          if (e.key === 'h' || e.key === 'H') {
            this.uiVisible = !this.uiVisible;
            if (this.gui) {
              if (this.uiVisible) {
                this.gui.show();
              } else {
                this.gui.hide();
              }
            }
            if (this.stats && this.stats.domElement) {
              this.stats.domElement.style.display = this.uiVisible ? 'block' : 'none';
            }
          }
        });

        // Dragging & Click-to-randomize interaction
        const raycaster = new THREE.Raycaster();
        const mouseVec = new THREE.Vector2();
        const dragPlane = new THREE.Plane();
        const planeIntersect = new THREE.Vector3();
        const dragOffset = new THREE.Vector3();

        let isPointerDown = false;
        let isDraggingObject = false;
        let pointerStartX = 0;
        let pointerStartY = 0;
        let pointerMovedDistance = 0;

        this.renderer.domElement.addEventListener('pointerdown', (e) => {
          if (e.target !== this.renderer.domElement) return;

          isPointerDown = true;
          pointerStartX = e.clientX;
          pointerStartY = e.clientY;
          pointerMovedDistance = 0;

          mouseVec.x = (e.clientX / window.innerWidth) * 2 - 1;
          mouseVec.y = -(e.clientY / window.innerHeight) * 2 + 1;
          raycaster.setFromCamera(mouseVec, this.camera);

          const hitTargets = this.shapes && this.shapes[0]
            ? [this.shapes[0].hitMesh, this.shapes[0].sphereMesh, this.shapes[0].outerSphereMesh].filter(Boolean)
            : [];
          const hits = raycaster.intersectObjects(hitTargets);
          const hitObject = hits.length > 0;

          if (e.button === 0) { // Left mouse button
            const shouldDrag = this.params.dragMode === 'Always Drag Object' ||
              (this.params.dragMode === 'Drag Object (Auto)' && hitObject) ||
              (this.params.dragMode === 'Object (Screen Plane)');

            if (shouldDrag) {
              isDraggingObject = true;
              this.controls.enabled = false;

              const normal = new THREE.Vector3();
              this.camera.getWorldDirection(normal).negate();
              dragPlane.setFromNormalAndCoplanarPoint(normal, this.objectGroup.position);

              if (raycaster.ray.intersectPlane(dragPlane, planeIntersect)) {
                dragOffset.copy(planeIntersect).sub(this.objectGroup.position);
              }
            } else if (this.params.dragMode === 'Pan Camera') {
              this.controls.mouseButtons.LEFT = THREE.MOUSE.PAN;
            } else {
              this.controls.mouseButtons.LEFT = THREE.MOUSE.ROTATE;
            }
          }
        });

        window.addEventListener('pointermove', (e) => {
          if (!isPointerDown) return;

          const dx = e.clientX - pointerStartX;
          const dy = e.clientY - pointerStartY;
          pointerMovedDistance = Math.hypot(dx, dy);

          if (isDraggingObject) {
            mouseVec.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouseVec.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouseVec, this.camera);

            if (raycaster.ray.intersectPlane(dragPlane, planeIntersect)) {
              this.objectGroup.position.copy(planeIntersect.sub(dragOffset));

              this.params.posX = Math.round(this.objectGroup.position.x);
              this.params.posY = Math.round(this.objectGroup.position.y);
              this.params.posZ = Math.round(this.objectGroup.position.z);

              if (this.guiControllers.posX) this.guiControllers.posX.updateDisplay();
              if (this.guiControllers.posY) this.guiControllers.posY.updateDisplay();
              if (this.guiControllers.posZ) this.guiControllers.posZ.updateDisplay();
            }
          }
        });

        window.addEventListener('pointerup', (e) => {
          if (isDraggingObject) {
            isDraggingObject = false;
            this.controls.enabled = true;
          }

          if (isPointerDown) {
            isPointerDown = false;
            if (pointerMovedDistance < 6 && e.button === 0 && e.target === this.renderer.domElement) {
              if (this.params.clickToRandomize) {
                this.randomize();
              }
            }
          }
        });
      }

      resize() {
        this.width = window.innerWidth;
        this.height = window.innerHeight;

        this.camera.aspect = this.width / this.height;
        const fovRadian = (this.camera.fov / 2) * (Math.PI / 180);
        this.dist = this.height / 2 / Math.tan(fovRadian);
        this.camera.updateProjectionMatrix();

        this.renderer.setSize(this.width, this.height);
        this.composer.setSize(this.width, this.height);
      }

      render() {
        if (this.stats) this.stats.begin();

        const time = this.time.getElapsedTime();

        for (let i = 0; i < this.shapes.length; i++) {
          this.shapes[i].update(time);
        }

        this.controls.update();

        this.effect.uniforms['amount'].value = Math.sin(time) * this.params.rgbShiftAmount;
        this.composer.render(time);

        if (this.stats) this.stats.end();
        this.animationId = requestAnimationFrame(this.render.bind(this));
      }
    }

    class Shape {
      constructor(sketch, x, y, z) {
        this.sketch = sketch;
        this.init(x, y, z);
      }

      init(x, y, z) {
        this.size = this.sketch.params.sphereRadius;

        const colorsArray = [
          new THREE.Color('#f6aa1c'),
          new THREE.Color('#bc3908'),
          new THREE.Color('#941b0c'),
          new THREE.Color('#3a86ff'),
          new THREE.Color('#8338ec'),
          new THREE.Color('#8338ec')
        ];

        /** ground */
        this.groundGeometry = new THREE.PlaneGeometry(this.sketch.width * 2, this.sketch.height * 2, 64, 64);
        this.groundMaterial = new THREE.ShaderMaterial({
          side: THREE.DoubleSide,
          uniforms: {
            uTime: { value: 0 },
            uWaveHeight: { value: this.sketch.params.waveHeight },
            uWaveSpeed: { value: this.sketch.params.waveSpeed },
            uWaveFreq: { value: this.sketch.params.waveFrequency },
            uColorSpeed: { value: this.sketch.params.colorSpeed },
            uColorMode: { value: 0 },
            uColorA: { value: new THREE.Vector3(0.5, 0.5, 0.5) },
            uColorB: { value: new THREE.Vector3(0.5, 0.5, 0.5) },
            uColorC: { value: new THREE.Vector3(2.0, 1.0, 0.0) },
            uColorD: { value: new THREE.Vector3(0.5, 0.20, 0.25) },
            uColors: { value: colorsArray.map(c => c.clone()) },
            uColorCount: { value: 5 }
          },
          wireframe: this.sketch.params.groundWireframe,
          vertexShader: vertexGroundShaderSource,
          fragmentShader: fragmentGroundShaderSource
        });
        this.groundMesh = new THREE.Mesh(this.groundGeometry, this.groundMaterial);
        this.groundMesh.rotation.set(90 * Math.PI / 180, 0, 0);
        this.groundMesh.position.set(0, -140, 0);
        this.sketch.scene.add(this.groundMesh);

        /** sphere */
        this.sphereGeometry = new THREE.SphereGeometry(this.size, 32, 32);
        this.sphereMaterial = new THREE.ShaderMaterial({
          side: THREE.DoubleSide,
          uniforms: {
            uTime: { value: 0 },
            uColorSpeed: { value: this.sketch.params.colorSpeed },
            uColorMode: { value: 0 },
            uColorA: { value: new THREE.Vector3(0.5, 0.5, 0.5) },
            uColorB: { value: new THREE.Vector3(0.5, 0.5, 0.5) },
            uColorC: { value: new THREE.Vector3(2.0, 1.0, 0.0) },
            uColorD: { value: new THREE.Vector3(0.5, 0.20, 0.25) },
            uColors: { value: colorsArray.map(c => c.clone()) },
            uColorCount: { value: 5 }
          },
          wireframe: this.sketch.params.sphereWireframe,
          vertexShader: vertexSphereShaderSource,
          fragmentShader: fragmentSphereShaderSource
        });
        this.sphereMesh = new THREE.Mesh(this.sphereGeometry, this.sphereMaterial);
        this.sphereMesh.position.set(0, 0, 0);
        this.sketch.objectGroup.add(this.sphereMesh);

        /** sphere outer */
        this.outerSphereGeometry = new THREE.SphereGeometry(this.size + this.sketch.params.outerOffset, 32, 32);
        this.outerSphereMaterial = new THREE.ShaderMaterial({
          side: THREE.DoubleSide,
          uniforms: {
            uTime: { value: 0 },
            uNoiseScale: { value: this.sketch.params.noiseScale },
            uNoiseSpeed: { value: this.sketch.params.noiseSpeed },
            uNoiseDensity: { value: this.sketch.params.noiseDensity },
            uOuterColor: { value: new THREE.Color(this.sketch.params.outerColor) }
          },
          wireframe: this.sketch.params.sphereWireframe,
          transparent: true,
          vertexShader: vertexOuterSphereShaderSource,
          fragmentShader: fragmentOuterSphereShaderSource
        });
        this.outerSphereMesh = new THREE.Mesh(this.outerSphereGeometry, this.outerSphereMaterial);
        this.outerSphereMesh.position.set(0, 0, 0);
        this.sketch.objectGroup.add(this.outerSphereMesh);

        /** invisible hit sphere for intuitive grabbing */
        this.hitMesh = new THREE.Mesh(
          new THREE.SphereGeometry(this.size + 20, 16, 16),
          new THREE.MeshBasicMaterial({ visible: false })
        );
        this.hitMesh.position.set(0, 0, 0);
        this.sketch.objectGroup.add(this.hitMesh);
      }

      update(time) {
        this.groundMesh.material.uniforms.uTime.value = time;
        this.groundMesh.material.uniforms.uWaveHeight.value = this.sketch.params.waveHeight;
        this.groundMesh.material.uniforms.uWaveSpeed.value = this.sketch.params.waveSpeed;
        this.groundMesh.material.uniforms.uWaveFreq.value = this.sketch.params.waveFrequency;
        this.groundMesh.material.uniforms.uColorSpeed.value = this.sketch.params.colorSpeed;

        this.sphereMesh.material.uniforms.uTime.value = time;
        this.sphereMesh.material.uniforms.uColorSpeed.value = this.sketch.params.colorSpeed;

        this.outerSphereMesh.material.uniforms.uTime.value = time;
        this.outerSphereMesh.material.uniforms.uNoiseScale.value = this.sketch.params.noiseScale;
        this.outerSphereMesh.material.uniforms.uNoiseSpeed.value = this.sketch.params.noiseSpeed;
        this.outerSphereMesh.material.uniforms.uNoiseDensity.value = this.sketch.params.noiseDensity;

        if (this.sketch.params.rotationSpeed !== 0) {
          this.sphereMesh.rotation.y += this.sketch.params.rotationSpeed * 0.02;
          this.outerSphereMesh.rotation.y += this.sketch.params.rotationSpeed * 0.02;
        }
      }
    }

    window.addEventListener('load', () => {
      console.clear();

      const loading = document.getElementById('loading');
      if (loading) {
        loading.classList.add('loaded');
      }

      new Sketch();
    });
  </script>
</body>
