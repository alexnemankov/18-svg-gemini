<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procedural Kinetic Star Kaleidoscope</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      user-select: none;
      -webkit-user-select: none;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: none;
    }

    canvas:active {
      cursor: grabbing;
    }
  </style>
</head>
<body>

<script type="module">
import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

/*
  Preconfigured Palettes & Color Schemes
*/
const PALETTES = {
  'Palette 1': ['#F6AA1C', '#BC3908', '#941B0C', '#F6AA1C', '#220901'],
  'Palette 2': ['#63D1CF', '#5BC0BE', '#4BAD9E', '#4BAD9E', '#0B132B', '#000000'],
  'Palette 3': ['#AA60C8', '#D69ADE', '#C9A3C6', '#CFB5C2', '#0D001D', '#120A12'],
  'Palette 4': ['#FEF1BE', '#FFBA00', '#008189', '#00474D', '#061210'],
  'Palette 5': ['#D4FFB0', '#7FFF00', '#00B894', '#0A3322', '#05140A'],
  'Palette 6': ['#FFE8CC', '#FF8C00', '#C7501A', '#3D1050', '#0E0618'],
  'Palette 7': ['#E8E0FF', '#B38FFF', '#6A3DE8', '#1A1250', '#090612'],
  'Palette 8': ['#E0FBFF', '#00F0FF', '#D40078', '#1E0A3D', '#05020F']
};

const COLOR_SCHEMES = [
  'Original',
  'Monochromatic',
  'Analogous',
  'Complementary',
  'Split-complementary',
  'Triadic',
  'Tetradic',
  'Double split-complementary',
  'Achromatic (black and white)',
  'Achromatic (white and black)',
  'Achromatic + Accent (black and white + red)',
  'Achromatic + Accent (white and black + red)',
  'Neutral + accent',
  'Palette: F6AA1C, BC3908, 941B0C, 220901',
  'Palette: 63D1CF, 5BC0BE, 4BAD9E, 0B132B, 000000',
  'Palette: AA60C8, D69ADE, C9A3C6, CFB5C2, 0D001D, 120A12',
  'Palette: FEF1BE, FFBA00, 008189, 00474D, 061210',
  'Palette: D4FFB0, 7FFF00, 00B894, 0A3322, 05140A',
  'Palette: FFE8CC, FF8C00, C7501A, 3D1050, 0E0618',
  'Palette: E8E0FF, B38FFF, 6A3DE8, 1A1250, 090612',
  'Palette: E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F'
];

function hexToRgba(hex, alpha = 1) {
  let c = hex.replace('#', '').trim();
  if (c.length === 3) {
    c = c.split('').map(x => x + x).join('');
  }
  const num = parseInt(c, 16);
  const r = (num >> 16) & 255;
  const g = (num >> 8) & 255;
  const b = num & 255;
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

/*
  Central Parameter State
*/
const params = {
  // Screen & Background
  greenscreen: false,
  backgroundColor: '#000000',

  // Colors
  colorScheme: 'Original',
  baseHue: 0,
  saturation: 80,
  lightness: 60,
  opacity: 1.0,
  customAccentColor: '#ff1744',

  // View & Camera (Zoom and Pan)
  zoom: 1.0,
  panX: 0,
  panY: 0,

  // Geometry
  shapeNum: 12,
  pointsCount: 5,
  starStep: 2,
  ringDensity: 10,
  ringSpacing: 50,
  compositeOperation: 'xor',
  renderMode: 'fill',
  lineWidth: 1.5,

  // Motion
  rotationSpeed: 0.1,
  pulseSpeed: 1.0,
  pulseAmplitude: 200,
  scaleBase: 3.0,
  scaleAmplitude: 2.0,

  // Procedural Interaction
  randomizeOnClick: true,
  showFPS: false
};

function getColor(ringIdx, starIdx, numStars, totalRings) {
  const scheme = params.colorScheme;
  const baseH = params.baseHue;
  const sat = params.saturation;
  const light = params.lightness;
  const alpha = params.opacity;
  const normAngle = starIdx / Math.max(1, numStars);
  const normRing = ringIdx / Math.max(1, totalRings);

  if (scheme === 'Original') {
    const angleStep = 360 / numStars;
    const h = (angleStep * starIdx + baseH) % 360;
    return `hsla(${h}, ${sat}%, ${light}%, ${alpha})`;
  }

  if (scheme === 'Monochromatic') {
    const l = Math.max(15, Math.min(92, 25 + ((starIdx * 7 + ringIdx * 11) % 100) * 0.65));
    const s = Math.max(20, Math.min(100, sat - (starIdx % 5) * 6));
    return `hsla(${baseH}, ${s}%, ${l}%, ${alpha})`;
  }

  if (scheme === 'Analogous') {
    const offset = Math.sin(normAngle * Math.PI * 2 + normRing * Math.PI) * 35;
    const h = (baseH + offset + 360) % 360;
    const l = Math.max(20, Math.min(85, light + (starIdx % 3 - 1) * 8));
    return `hsla(${h}, ${sat}%, ${l}%, ${alpha})`;
  }

  if (scheme === 'Complementary') {
    const isComp = (starIdx + ringIdx) % 2 === 1;
    const h = (isComp ? baseH + 180 : baseH) % 360;
    const l = Math.max(20, Math.min(85, light + ((starIdx % 4) - 2) * 6));
    return `hsla(${h}, ${sat}%, ${l}%, ${alpha})`;
  }

  if (scheme === 'Split-complementary') {
    const hues = [baseH, (baseH + 150) % 360, (baseH + 210) % 360];
    const h = hues[(starIdx + ringIdx) % 3];
    const l = Math.max(25, Math.min(85, light + ((starIdx % 3) - 1) * 8));
    return `hsla(${h}, ${sat}%, ${l}%, ${alpha})`;
  }

  if (scheme === 'Triadic') {
    const hues = [baseH, (baseH + 120) % 360, (baseH + 240) % 360];
    const h = hues[(starIdx + ringIdx) % 3];
    return `hsla(${h}, ${sat}%, ${light}%, ${alpha})`;
  }

  if (scheme === 'Tetradic') {
    const hues = [baseH, (baseH + 90) % 360, (baseH + 180) % 360, (baseH + 270) % 360];
    const h = hues[(starIdx + ringIdx) % 4];
    return `hsla(${h}, ${sat}%, ${light}%, ${alpha})`;
  }

  if (scheme === 'Double split-complementary') {
    const hues = [
      (baseH - 30 + 360) % 360,
      (baseH + 30) % 360,
      (baseH + 150) % 360,
      (baseH + 210) % 360
    ];
    const h = hues[(starIdx + ringIdx) % 4];
    return `hsla(${h}, ${sat}%, ${light}%, ${alpha})`;
  }

  if (scheme === 'Achromatic (black and white)') {
    const grays = ['#151515', '#2e2e2e', '#4c4c4c', '#6e6e6e', '#949494', '#bbbbbb', '#dddddd', '#ffffff'];
    const c = grays[(starIdx * 3 + ringIdx * 2) % grays.length];
    return hexToRgba(c, alpha);
  }

  if (scheme === 'Achromatic (white and black)') {
    const grays = ['#ffffff', '#f4f4f4', '#dedede', '#bfbfbf', '#999999', '#666666', '#333333', '#ffffff'];
    const c = grays[(starIdx * 2 + ringIdx * 3) % grays.length];
    return hexToRgba(c, alpha);
  }

  if (scheme === 'Achromatic + Accent (black and white + red)') {
    if ((starIdx + ringIdx * 2) % 5 === 0) {
      return hexToRgba(params.customAccentColor || '#ff1744', alpha);
    }
    const grays = ['#222222', '#444444', '#666666', '#888888', '#aaaaaa', '#cccccc', '#eeeeee'];
    const c = grays[(starIdx + ringIdx) % grays.length];
    return hexToRgba(c, alpha);
  }

  if (scheme === 'Achromatic + Accent (white and black + red)') {
    if ((starIdx + ringIdx) % 4 === 0) {
      return hexToRgba(params.customAccentColor || '#ff2a55', alpha);
    }
    const grays = ['#ffffff', '#ececec', '#d4d4d4', '#b0b0b0', '#808080', '#404040', '#ffffff'];
    const c = grays[(starIdx * 2 + ringIdx) % grays.length];
    return hexToRgba(c, alpha);
  }

  if (scheme === 'Neutral + accent') {
    if ((starIdx + ringIdx * 2) % 6 === 0) {
      return hexToRgba(params.customAccentColor || '#00e5ff', alpha);
    }
    const neutrals = ['#ede5d8', '#dfd5c6', '#c9baa7', '#a89885', '#7a6e60', '#4d453b', '#2c2721'];
    const c = neutrals[(starIdx + ringIdx) % neutrals.length];
    return hexToRgba(c, alpha);
  }

  if (scheme.includes('F6AA1C')) {
    const pal = PALETTES['Palette 1'];
    return hexToRgba(pal[(starIdx + ringIdx) % pal.length], alpha);
  }
  if (scheme.includes('63D1CF')) {
    const pal = PALETTES['Palette 2'];
    return hexToRgba(pal[(starIdx + ringIdx) % pal.length], alpha);
  }
  if (scheme.includes('AA60C8')) {
    const pal = PALETTES['Palette 3'];
    return hexToRgba(pal[(starIdx + ringIdx) % pal.length], alpha);
  }
  if (scheme.includes('FEF1BE')) {
    const pal = PALETTES['Palette 4'];
    return hexToRgba(pal[(starIdx + ringIdx) % pal.length], alpha);
  }
  if (scheme.includes('D4FFB0')) {
    const pal = PALETTES['Palette 5'];
    return hexToRgba(pal[(starIdx + ringIdx) % pal.length], alpha);
  }
  if (scheme.includes('FFE8CC')) {
    const pal = PALETTES['Palette 6'];
    return hexToRgba(pal[(starIdx + ringIdx) % pal.length], alpha);
  }
  if (scheme.includes('E8E0FF')) {
    const pal = PALETTES['Palette 7'];
    return hexToRgba(pal[(starIdx + ringIdx) % pal.length], alpha);
  }
  if (scheme.includes('E0FBFF')) {
    const pal = PALETTES['Palette 8'];
    return hexToRgba(pal[(starIdx + ringIdx) % pal.length], alpha);
  }

  return `hsla(${baseH}, ${sat}%, ${light}%, ${alpha})`;
}

/*
  Angle Helper
*/
class Angle {
  constructor(angle) {
    this.a = angle;
    this.rad = this.a * Math.PI / 180;
  }

  incDec(num) {
    this.a += num;
    this.rad = this.a * Math.PI / 180;
    return this.rad;
  }
}

/*
  Shape Class
*/
class Shape {
  constructor(ctx, x, y, i) {
    this.ctx = ctx;
    this.init(x, y, i);
  }

  init(x, y, i) {
    this.i = i + 1;
    this.num = this.i * params.ringDensity;
    this.a = new Angle(15);
    this.r = params.ringSpacing * this.i;
    this.ri = this.r;
    this.s = (this.r * 2 * Math.PI / this.num) / 2;
    this.si = this.s;
    this.c = 'white';
    this.x = x;
    this.y = y;
    this.rad = (Math.PI * 2 * params.starStep) / params.pointsCount;
    this.a1 = new Angle(360 / this.num);
    this.a2 = new Angle(180);
  }

  draw() {
    const ctx = this.ctx;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.a2.rad);
    const scaleVal = Math.sin(this.a2.rad) * params.scaleAmplitude + params.scaleBase;
    ctx.scale(scaleVal, scaleVal);
    ctx.translate(-this.x, -this.y);

    for (let i = 0; i < this.num; i++) {
      ctx.save();
      const cx = Math.cos(i * this.a1.rad) * this.r + this.x;
      const cy = Math.sin(i * this.a1.rad) * this.r + this.y;
      ctx.translate(cx, cy);
      ctx.rotate(i * this.a1.rad);
      ctx.translate(-cx, -cy);

      const color = getColor(this.i - 1, i, this.num, params.shapeNum);
      ctx.fillStyle = color;
      ctx.strokeStyle = color;
      ctx.lineWidth = params.lineWidth;
      ctx.globalCompositeOperation = params.compositeOperation;

      ctx.beginPath();
      for (let j = 0; j < params.pointsCount; j++) {
        const x = Math.cos(j * this.rad) * this.s + cx;
        const y = Math.sin(j * this.rad) * this.s + cy;
        ctx.lineTo(x, y);
      }
      ctx.closePath();

      if (params.renderMode === 'fill' || params.renderMode === 'both') {
        ctx.fill();
      }
      if (params.renderMode === 'stroke' || params.renderMode === 'both') {
        ctx.stroke();
      }

      ctx.restore();
    }
    ctx.restore();
  }

  updateParams() {
    const t = (Date.now() / 3000) * params.pulseSpeed;
    if (Math.sin(t) < 0) {
      this.s = Math.sin(t) * params.pulseAmplitude + this.si;
    } else {
      this.s = -Math.sin(t) * params.pulseAmplitude + this.si;
    }
    this.a2.incDec(params.rotationSpeed);
  }

  render() {
    this.draw();
    this.updateParams();
  }
}

/*
  Canvas Manager
*/
let lastTime = 0;

class Canvas {
  constructor() {
    this.canvas = document.createElement('canvas');
    this.canvas.style.position = 'relative';
    this.canvas.style.display = 'block';
    this.canvas.style.top = '0';
    this.canvas.style.left = '0';
    document.body.appendChild(this.canvas);

    this.ctx = this.canvas.getContext('2d');
    this.width = this.canvas.width = window.innerWidth;
    this.height = this.canvas.height = window.innerHeight;
    this.shapes = [];
  }

  init() {
    this.rebuildShapes();
  }

  rebuildShapes() {
    this.shapes = [];
    for (let i = 0; i < params.shapeNum; i++) {
      const s = new Shape(this.ctx, this.width / 2, this.height / 2, i);
      this.shapes.push(s);
    }
  }

  render() {
    const ctx = this.ctx;

    // Apply Background
    ctx.save();
    ctx.fillStyle = params.greenscreen ? '#00ff00' : params.backgroundColor;
    ctx.fillRect(0, 0, this.width, this.height);

    // Apply Zoom & Pan Transformations
    ctx.translate(this.width / 2 + params.panX, this.height / 2 + params.panY);
    ctx.scale(params.zoom, params.zoom);
    ctx.translate(-this.width / 2, -this.height / 2);

    for (let i = 0; i < this.shapes.length; i++) {
      this.shapes[i].render();
    }
    ctx.restore();

    if (params.showFPS) {
      this.drawFPS();
    }

    requestAnimationFrame(() => this.render());
  }

  drawFPS() {
    const now = +new Date();
    const fps = lastTime ? (1000 / (now - lastTime)).toFixed() : 60;
    lastTime = now;

    const ctx = this.ctx;
    ctx.save();
    ctx.fillStyle = '#ffffff';
    ctx.font = '14px monospace';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'bottom';
    ctx.fillText(fps + ' FPS', this.width - 15, this.height - 15);
    ctx.restore();
  }

  resize() {
    this.width = this.canvas.width = window.innerWidth;
    this.height = this.canvas.height = window.innerHeight;
    this.rebuildShapes();
  }
}

/*
  Interactive Scene Setup
*/
const canvasApp = new Canvas();
canvasApp.init();
canvasApp.render();

window.addEventListener('resize', () => {
  canvasApp.resize();
}, false);

/*
  Zoom with Wheel & Drag Pan Setup
*/
let isDragging = false;
let startX = 0;
let startY = 0;
let initialPanX = 0;
let initialPanY = 0;
let totalDragDistance = 0;

canvasApp.canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
  const newZoom = Math.min(Math.max(params.zoom * zoomFactor, 0.1), 15);

  const mx = e.clientX;
  const my = e.clientY;
  const cx = canvasApp.width / 2;
  const cy = canvasApp.height / 2;

  // Zoom toward cursor position
  params.panX = mx - cx - (mx - cx - params.panX) * (newZoom / params.zoom);
  params.panY = my - cy - (my - cy - params.panY) * (newZoom / params.zoom);
  params.zoom = newZoom;

  updateAllGuiControllers();
}, { passive: false });

window.addEventListener('pointerdown', (e) => {
  if (e.target.closest && e.target.closest('.lil-gui')) return;
  if (e.button !== 0) return;

  isDragging = true;
  startX = e.clientX;
  startY = e.clientY;
  initialPanX = params.panX;
  initialPanY = params.panY;
  totalDragDistance = 0;
  canvasApp.canvas.style.cursor = 'grabbing';
});

window.addEventListener('pointermove', (e) => {
  if (!isDragging) return;
  const dx = e.clientX - startX;
  const dy = e.clientY - startY;
  totalDragDistance += Math.hypot(e.movementX, e.movementY);
  params.panX = initialPanX + dx;
  params.panY = initialPanY + dy;
  updateAllGuiControllers();
});

window.addEventListener('pointerup', (e) => {
  if (!isDragging) return;
  isDragging = false;
  canvasApp.canvas.style.cursor = 'grab';

  if (e.target.closest && e.target.closest('.lil-gui')) return;

  // If clicked without dragging, trigger procedural variation
  if (totalDragDistance < 6) {
    if (params.randomizeOnClick) {
      randomizeScene();
    }
  }
});

window.addEventListener('pointercancel', () => {
  isDragging = false;
  canvasApp.canvas.style.cursor = 'grab';
});

/*
  Procedural Scene Randomizer
*/
function randomizeScene() {
  // 1. Pick a random color scheme
  params.colorScheme = COLOR_SCHEMES[Math.floor(Math.random() * COLOR_SCHEMES.length)];

  // 2. Randomize color parameters
  params.baseHue = Math.floor(Math.random() * 360);
  params.saturation = Math.floor(65 + Math.random() * 35);
  params.lightness = Math.floor(45 + Math.random() * 30);

  const vibrantAccents = [
    '#ff1744', '#ff0055', '#ff5252', '#ff4081', '#00e5ff',
    '#00ffcc', '#ffea00', '#ff9100', '#76ff03', '#d500f9'
  ];
  params.customAccentColor = vibrantAccents[Math.floor(Math.random() * vibrantAccents.length)];

  if (!params.greenscreen) {
    const darkBgs = ['#000000', '#06060c', '#0a050d', '#03080c', '#060a04', '#0d0703'];
    params.backgroundColor = darkBgs[Math.floor(Math.random() * darkBgs.length)];
    document.body.style.backgroundColor = params.backgroundColor;
  }

  // 3. Re-roll geometric parameters
  params.shapeNum = Math.floor(6 + Math.random() * 11); // 6 to 16
  const possiblePoints = [3, 4, 5, 6, 7, 8, 10];
  params.pointsCount = possiblePoints[Math.floor(Math.random() * possiblePoints.length)];

  if (params.pointsCount === 5) {
    params.starStep = 2;
  } else if (params.pointsCount === 7) {
    params.starStep = Math.random() < 0.5 ? 2 : 3;
  } else if (params.pointsCount === 8) {
    params.starStep = 3;
  } else {
    params.starStep = 1;
  }

  params.ringSpacing = Math.floor(35 + Math.random() * 35); // 35 to 70
  params.ringDensity = Math.floor(6 + Math.random() * 9); // 6 to 14

  // 4. Re-roll motion parameters
  const dir = Math.random() < 0.5 ? 1 : -1;
  params.rotationSpeed = Number((dir * (0.05 + Math.random() * 0.25)).toFixed(3));
  params.pulseSpeed = Number((0.5 + Math.random() * 2.0).toFixed(2));
  params.pulseAmplitude = Math.floor(90 + Math.random() * 190);

  // 5. Composite modes
  const composites = ['xor', 'xor', 'xor', 'lighter', 'screen', 'source-over'];
  params.compositeOperation = composites[Math.floor(Math.random() * composites.length)];

  // 6. Rebuild shapes and update UI
  canvasApp.rebuildShapes();
  updateAllGuiControllers();
}

/*
  lil-gui Control Panel Configuration
*/
const gui = new GUI({ title: 'Kaleidoscope Matrix' });
const allControllers = [];

function registerController(c) {
  allControllers.push(c);
  return c;
}

function updateAllGuiControllers() {
  for (let i = 0; i < allControllers.length; i++) {
    allControllers[i].updateDisplay();
  }
}

// Background & Greenscreen
const fBg = gui.addFolder('Background');
registerController(fBg.add(params, 'greenscreen').name('Greenscreen (#00ff00)').onChange(v => {
  document.body.style.backgroundColor = v ? '#00ff00' : params.backgroundColor;
}));
registerController(fBg.addColor(params, 'backgroundColor').name('Background Color').onChange(v => {
  if (!params.greenscreen) {
    document.body.style.backgroundColor = v;
  }
}));

// Colors & Themes
const fColor = gui.addFolder('Color Schemes');
registerController(fColor.add(params, 'colorScheme', COLOR_SCHEMES).name('Scheme'));
registerController(fColor.add(params, 'baseHue', 0, 360, 1).name('Base Hue'));
registerController(fColor.add(params, 'saturation', 0, 100, 1).name('Saturation %'));
registerController(fColor.add(params, 'lightness', 0, 100, 1).name('Lightness %'));
registerController(fColor.add(params, 'opacity', 0.05, 1.0, 0.05).name('Opacity'));
registerController(fColor.addColor(params, 'customAccentColor').name('Accent Color'));

// Geometry & Patterns
const fGeom = gui.addFolder('Geometry');
registerController(fGeom.add(params, 'shapeNum', 1, 24, 1).name('Rings Count').onChange(() => canvasApp.rebuildShapes()));
registerController(fGeom.add(params, 'pointsCount', 3, 12, 1).name('Star Points').onChange(() => canvasApp.rebuildShapes()));
registerController(fGeom.add(params, 'starStep', 1, 5, 1).name('Star Step').onChange(() => canvasApp.rebuildShapes()));
registerController(fGeom.add(params, 'ringDensity', 3, 25, 1).name('Ring Density').onChange(() => canvasApp.rebuildShapes()));
registerController(fGeom.add(params, 'ringSpacing', 15, 120, 1).name('Ring Spacing').onChange(() => canvasApp.rebuildShapes()));
registerController(fGeom.add(params, 'compositeOperation', ['xor', 'lighter', 'screen', 'source-over', 'difference', 'multiply']).name('Composite'));
registerController(fGeom.add(params, 'renderMode', ['fill', 'stroke', 'both']).name('Render Mode'));
registerController(fGeom.add(params, 'lineWidth', 0.5, 10, 0.5).name('Line Width'));

// Motion & Pulsing
const fMotion = gui.addFolder('Motion & Dynamics');
registerController(fMotion.add(params, 'rotationSpeed', -1.0, 1.0, 0.01).name('Rotation Speed'));
registerController(fMotion.add(params, 'pulseSpeed', 0.1, 5.0, 0.1).name('Pulse Speed'));
registerController(fMotion.add(params, 'pulseAmplitude', 0, 500, 5).name('Pulse Amplitude'));
registerController(fMotion.add(params, 'scaleBase', 0.5, 6.0, 0.1).name('Scale Base'));
registerController(fMotion.add(params, 'scaleAmplitude', 0.0, 5.0, 0.1).name('Scale Amplitude'));

// View & Camera (Zoom and Pan)
const fView = gui.addFolder('Camera & View');
registerController(fView.add(params, 'zoom', 0.1, 10, 0.05).name('Zoom'));
registerController(fView.add(params, 'panX', -2000, 2000, 1).name('Pan X'));
registerController(fView.add(params, 'panY', -2000, 2000, 1).name('Pan Y'));
fView.add({
  resetView: () => {
    params.zoom = 1.0;
    params.panX = 0;
    params.panY = 0;
    updateAllGuiControllers();
  }
}, 'resetView').name('↺ Reset View');

// Procedural & Settings
const fSettings = gui.addFolder('Interaction');
registerController(fSettings.add(params, 'randomizeOnClick').name('Click to Randomize'));
fSettings.add({ randomize: () => randomizeScene() }, 'randomize').name('🎲 Randomize Scene');
registerController(fSettings.add(params, 'showFPS').name('Show FPS'));

/*
  Toggle UI visibility with 'H' key
*/
let isGuiVisible = true;
window.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'h' || e.key === 'H') {
    isGuiVisible = !isGuiVisible;
    gui.show(isGuiVisible);
    if (gui.domElement) {
      gui.domElement.style.display = isGuiVisible ? '' : 'none';
    }
  }
});

// Set initial background
document.body.style.backgroundColor = params.backgroundColor;
</script>
