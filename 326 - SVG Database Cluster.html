<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Distributed Database Cluster (Sharding & Replication) - SVG Animation</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #080e1c;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    #stage-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      cursor: grab;
      overflow: hidden;
      touch-action: none;
    }
    #stage-container:active {
      cursor: grabbing;
    }
    svg {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <div id="stage-container">
    <svg id="cluster-svg" viewBox="0 0 1600 950" preserveAspectRatio="xMidYMid meet">
      <defs>
        <!-- Exposure filter -->
        <filter id="exposure-filter" x="-20%" y="-20%" width="140%" height="140%">
          <feComponentTransfer id="exposure-transfer">
            <feFuncR type="linear" slope="1.0" />
            <feFuncG type="linear" slope="1.0" />
            <feFuncB type="linear" slope="1.0" />
          </feComponentTransfer>
        </filter>

        <!-- Dynamic Glow filters -->
        <filter id="glow-lg" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur" />
          <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
        <filter id="glow-sm" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur" />
          <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>

        <!-- Base cylinder shadow/glow radial gradients -->
        <radialGradient id="grad-glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" id="glow-stop-0" stop-color="#4299E1" stop-opacity="0.45" />
          <stop offset="65%" id="glow-stop-65" stop-color="#4299E1" stop-opacity="0.15" />
          <stop offset="100%" id="glow-stop-100" stop-color="#4299E1" stop-opacity="0" />
        </radialGradient>

        <!-- Gold / Election Glow -->
        <radialGradient id="grad-gold-glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ffd700" stop-opacity="0.8" />
          <stop offset="60%" stop-color="#ff9900" stop-opacity="0.3" />
          <stop offset="100%" stop-color="#ff9900" stop-opacity="0" />
        </radialGradient>

        <!-- Cylinder horizontal gradients -->
        <linearGradient id="grad-cylinder-primary" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" id="cyl-prim-0" stop-color="#142c4b" />
          <stop offset="25%" id="cyl-prim-25" stop-color="#2a5d9a" />
          <stop offset="65%" id="cyl-prim-65" stop-color="#1e4675" />
          <stop offset="100%" id="cyl-prim-100" stop-color="#11243e" />
        </linearGradient>
        <linearGradient id="grad-cap-primary" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" id="cap-prim-0" stop-color="#3b78c4" />
          <stop offset="100%" id="cap-prim-100" stop-color="#1e4675" />
        </linearGradient>

        <linearGradient id="grad-cylinder-replica" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" id="cyl-rep-0" stop-color="#0f223b" />
          <stop offset="30%" id="cyl-rep-30" stop-color="#1a3b63" />
          <stop offset="70%" id="cyl-rep-70" stop-color="#132d4e" />
          <stop offset="100%" id="cyl-rep-100" stop-color="#0c1b30" />
        </linearGradient>
        <linearGradient id="grad-cap-replica" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" id="cap-rep-0" stop-color="#265287" />
          <stop offset="100%" id="cap-rep-100" stop-color="#132d4e" />
        </linearGradient>

        <linearGradient id="grad-cylinder-router" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" id="cyl-rout-0" stop-color="#1d3d66" />
          <stop offset="25%" id="cyl-rout-25" stop-color="#3877c4" />
          <stop offset="65%" id="cyl-rout-65" stop-color="#265a99" />
          <stop offset="100%" id="cyl-rout-100" stop-color="#183457" />
        </linearGradient>
        <linearGradient id="grad-cap-router" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" id="cap-rout-0" stop-color="#4991eb" />
          <stop offset="100%" id="cap-rout-100" stop-color="#265a99" />
        </linearGradient>

        <!-- Subtle Blueprint Background Grid Pattern -->
        <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
          <path id="grid-path" d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.04" />
          <circle id="grid-dot" cx="40" cy="40" r="1" fill="#ffffff" fill-opacity="0.08" />
        </pattern>
      </defs>

      <!-- Scene background -->
      <rect id="bg-rect" width="100%" height="100%" fill="#080e1c" />
      <rect id="bg-grid" width="100%" height="100%" fill="url(#grid-pattern)" />

      <!-- Primary transform viewport group (controlled by zoom, drag & camera animation) -->
      <g id="viewport-group" filter="url(#exposure-filter)">
        <!-- Scenario layers -->
        <g id="decorations-layer"></g>
        <g id="shard-boxes-layer"></g>
        <g id="paths-layer"></g>
        <g id="packets-layer"></g>
        <g id="cylinders-layer"></g>
        <g id="telemetry-layer"></g>
      </g>
    </svg>

    // Helper: Hex color manipulation
    function hexToRgb(hex) {
      hex = hex.replace('#', '');
      if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
      const int = parseInt(hex, 16);
      return { r: (int >> 16) & 255, g: (int >> 8) & 255, b: int & 255 };
    }

    function shadeColor(hex, percent) {
      const rgb = hexToRgb(hex);
      const factor = 1 + percent / 100;
      const r = Math.min(255, Math.max(0, Math.round(rgb.r * factor)));
      const g = Math.min(255, Math.max(0, Math.round(rgb.g * factor)));
      const b = Math.min(255, Math.max(0, Math.round(rgb.b * factor)));
      return `#${((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1)}`;
    }

      cylindersLayer.innerHTML = '';

    // Cylinder Builder
    function createCylinder({
      id, cx, cy, w, h,
      role = 'primary',
      title = 'PRIMARY',
      subtitle = 'PORT 5432',
      tag = 'LEADER',
      ledColor = '#00e676',
      customGlow = null
    }) {
      const rx = (w / 2) * params.cylinderScale;
      const ry = rx * 0.24;
      const ch = h * params.cylinderScale;
      const topY = cy - ch / 2;
      const bottomY = cy + ch / 2;
      const segmentCount = role === 'primary' ? 3 : (role === 'router' ? 4 : 2);
      const segHeight = (ch - ry) / segmentCount;

      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.id = id;

      // Base shadow / ambient glow
      const baseGlow = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
      baseGlow.setAttribute('cx', cx);
      baseGlow.setAttribute('cy', bottomY + 6);
      baseGlow.setAttribute('rx', rx * 1.25);
      baseGlow.setAttribute('ry', ry * 1.25);
      baseGlow.setAttribute('fill', customGlow || 'url(#grad-glow)');
      baseGlow.setAttribute('opacity', '0.65');
      baseGlow.setAttribute('class', 'base-glow-ring');
      g.appendChild(baseGlow);

      // Stacked platter body slices
      for (let i = 0; i < segmentCount; i++) {
        const segTop = topY + i * segHeight;
        const segBottom = segTop + segHeight;
        const slice = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        const d = `
          M ${cx - rx} ${segTop}
          L ${cx - rx} ${segBottom}
          A ${rx} ${ry} 0 0 0 ${cx + rx} ${segBottom}
          L ${cx + rx} ${segTop}
          A ${rx} ${ry} 0 0 1 ${cx - rx} ${segTop}
          Z
        `;
        slice.setAttribute('d', d);
        slice.setAttribute('fill', role === 'primary' ? 'url(#grad-cylinder-primary)' : (role === 'router' ? 'url(#grad-cylinder-router)' : 'url(#grad-cylinder-replica)'));
        slice.setAttribute('stroke', params.accent);
        slice.setAttribute('stroke-width', '1.2');
        slice.setAttribute('stroke-opacity', '0.55');
        slice.setAttribute('class', 'theme-stroke cyl-slice');
        g.appendChild(slice);

        // Partition divider groove lip
        if (i < segmentCount - 1) {
          const groove = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          groove.setAttribute('d', `M ${cx - rx} ${segBottom} A ${rx} ${ry} 0 0 0 ${cx + rx} ${segBottom}`);
          groove.setAttribute('fill', 'none');
          groove.setAttribute('stroke', params.accent);
          groove.setAttribute('stroke-width', '1.6');
          groove.setAttribute('stroke-opacity', '0.8');
          groove.setAttribute('class', 'theme-stroke');
          g.appendChild(groove);
        }
      }

      // Top cap ellipse
      const topCap = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
      topCap.setAttribute('cx', cx);
      topCap.setAttribute('cy', topY);
      topCap.setAttribute('rx', rx);
      topCap.setAttribute('ry', ry);
      topCap.setAttribute('fill', role === 'primary' ? 'url(#grad-cap-primary)' : (role === 'router' ? 'url(#grad-cap-router)' : 'url(#grad-cap-replica)'));
      topCap.setAttribute('stroke', params.accent);
      topCap.setAttribute('stroke-width', '1.4');
      topCap.setAttribute('class', 'theme-stroke cyl-cap');
      g.appendChild(topCap);

      // Inner rim
      const innerRim = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
      innerRim.setAttribute('cx', cx);
      innerRim.setAttribute('cy', topY);
      innerRim.setAttribute('rx', rx * 0.76);
      innerRim.setAttribute('ry', ry * 0.76);
      innerRim.setAttribute('fill', 'none');
      innerRim.setAttribute('stroke', params.accent);
      innerRim.setAttribute('stroke-width', '1');
      innerRim.setAttribute('stroke-opacity', '0.6');
      innerRim.setAttribute('stroke-dasharray', '4 3');
      innerRim.setAttribute('class', 'theme-stroke');
      g.appendChild(innerRim);

      // LED diode
      const ledY = topY + segHeight * 0.5 + ry * 0.35;
      const led = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      led.setAttribute('cx', cx - rx * 0.62);
      led.setAttribute('cy', ledY);
      led.setAttribute('r', '4');
      led.setAttribute('fill', ledColor);
      led.setAttribute('filter', 'url(#glow-sm)');
      led.setAttribute('class', 'theme-led');
      g.appendChild(led);

      activeLeds.push({
        el: led,
        phase: Math.random() * Math.PI * 2,
        baseR: 4,
        role
      });

      // Storage partition utilization bars
      for (let b = 0; b < 3; b++) {
        const bar = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        bar.setAttribute('x', cx - rx * 0.35 + b * (rx * 0.38));
        bar.setAttribute('y', ledY - 3);
        bar.setAttribute('width', rx * 0.28);
        bar.setAttribute('height', '6');
        bar.setAttribute('rx', '1.5');
        bar.setAttribute('fill', params.accent);
        bar.setAttribute('opacity', b < 2 ? '0.7' : '0.25');
        bar.setAttribute('class', 'theme-accent-fill');
        g.appendChild(bar);
      }

      // Role tag pill badge
      const badgeY = bottomY + 22;
      const badgeGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      const badgeW = Math.max(90, rx * 1.5);
      const badgeH = 18;

    // Path Builder with stroke-dasharray
    function createNetworkPath({ id, d, strokeColor, strokeWidth = 2, dashArray = '8 6', speed = 40 }) {
      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.id = id;

      const bgPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      bgPath.setAttribute('d', d);
      bgPath.setAttribute('fill', 'none');
      bgPath.setAttribute('stroke', strokeColor);
      bgPath.setAttribute('stroke-width', strokeWidth * 1.8);
      bgPath.setAttribute('stroke-opacity', '0.18');
      bgPath.setAttribute('stroke-linecap', 'round');
      bgPath.setAttribute('class', 'theme-path-bg');
      g.appendChild(bgPath);

      const dashPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      dashPath.setAttribute('d', d);
      dashPath.setAttribute('fill', 'none');
      dashPath.setAttribute('stroke', strokeColor);
      dashPath.setAttribute('stroke-width', strokeWidth);
      dashPath.setAttribute('stroke-dasharray', dashArray);
      dashPath.setAttribute('stroke-linecap', 'round');
      dashPath.setAttribute('filter', 'url(#glow-sm)');
      dashPath.setAttribute('class', 'theme-path-fg');
      g.appendChild(dashPath);

      pathsLayer.appendChild(g);

      const pathObj = {
        id,
        el: dashPath,
        speed,
        length: dashPath.getTotalLength ? dashPath.getTotalLength() : 400
      };
      activePaths.push(pathObj);
      return pathObj;
    }

    // Packet Marker Generator with dynamic text autosizing & generous padding
    function createPacket({ pathObj, label = 'WRITE', color = '#69f0ae', offset = 0, speedMult = 1, icon = null }) {
      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.setAttribute('class', 'packet-marker');

      // Generous dynamic spacing calculation:
      const charWidth = 6.2;
      const textLen = label.length;
      const textWidth = textLen * charWidth;
      const indicatorSpace = 16;
      const sidePadding = 24;
      const packetW = Math.max(54, Math.round(textWidth + indicatorSpace + sidePadding));
      const packetH = 19;
      const rx = packetH / 2;

      const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      bg.setAttribute('x', -packetW / 2);
      bg.setAttribute('y', -packetH / 2);
      bg.setAttribute('width', packetW);
      bg.setAttribute('height', packetH);
      bg.setAttribute('rx', rx);
      bg.setAttribute('fill', params.panelBg);
      bg.setAttribute('stroke', color);
      bg.setAttribute('stroke-width', '1.5');
      bg.setAttribute('filter', 'url(#glow-sm)');
      bg.setAttribute('class', 'theme-panel-bg theme-packet-stroke');
      g.appendChild(bg);

      const iconX = -packetW / 2 + 10;

      if (icon) {
        const ic = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        ic.setAttribute('x', iconX);
        ic.setAttribute('y', '3.5');
        ic.setAttribute('font-size', '8.5');
        ic.setAttribute('text-anchor', 'middle');
        ic.textContent = icon;
        g.appendChild(ic);
      } else {
        const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        dot.setAttribute('cx', iconX);
        dot.setAttribute('cy', '0');
        dot.setAttribute('r', '2.8');
        dot.setAttribute('fill', color);
        dot.setAttribute('class', 'theme-packet-fill');
        g.appendChild(dot);
      }

      const textCenter = (iconX + 6 + (packetW / 2 - 8)) / 2;

      const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      text.setAttribute('x', textCenter.toFixed(1));
      text.setAttribute('y', '3.5');
      text.setAttribute('text-anchor', 'middle');
      text.setAttribute('font-family', 'ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace');
      text.setAttribute('font-size', '7.5');
      text.setAttribute('font-weight', '700');
      text.setAttribute('letter-spacing', '0.5');
      text.setAttribute('fill', params.text);
      text.setAttribute('class', 'theme-text');
      text.textContent = label;
      g.appendChild(text);

      packetsLayer.appendChild(g);

      activePackets.push({
        el: g,
        pathObj,
        progress: offset,
        speedMult,
        packetW
      });
    }

        createPacket({ pathObj: pRoute, label: 'HASH-TX', color: params.packet, offset: 0.2 });

        for (let r = 0; r < replicasCount; r++) {

      const busY = 785;

      createPacket({ pathObj: pBus, label: 'RAFT-SYNC', color: params.packet, offset: 0.7 });

      });

      const pIngress = createNetworkPath({
        id: 'path-chaos-ingress', d: `M 800 50 L 800 ${n1.topY}`,
        strokeColor: params.primaryPath, strokeWidth: 2.5, dashArray: '8 5', speed: 50
      });
      createPacket({ pathObj: pIngress, label: 'WRITE-TX', color: params.packet, offset: 0.3 });

      const followers = [n2, n3, n4, n5];
      const hbPaths = followers.map((f, i) => {
        const p = createNetworkPath({
          id: `path-hb-${i}`, d: `M ${n1.cx} ${n1.bottomY + 8} L ${f.cx} ${f.topY}`,

        });
        createPacket({ pathObj: p, label: 'HEARTBEAT', color: params.packet, offset: i * 0.25 });

      // Peer-to-peer voting paths between followers
      const pVote1 = createNetworkPath({
        id: 'path-vote-2-3', d: `M ${n2.cx + n2.rx} ${n2.cy} L ${n3.cx - n3.rx} ${n3.cy}`,
        strokeColor: '#ffbb00', strokeWidth: 1.8, dashArray: '4 4', speed: 60

      scenarioHooks.data = { n1, n2, n3, n4, n5, hbPaths, statusText: document.getElementById('chaos-status-text') };

        const cycle = t % 20; // 20-second continuous failure-election-recovery cycle

          // NORMAL

          n1.badgeText.textContent = "OFFLINE (CRASH)";
        } else if (cycle < 14) {
          // ELECTION

          n2.badgeText.textContent = "CANDIDATE";
          n2.led.setAttribute('fill', '#ffbb00');

          n2.led.setAttribute('fill', '#00ffaa');

        } else {
          // RECOVERY & CATCHUP

          n1.led.setAttribute('fill', '#66aacc');
          n1.badgeText.textContent = "FOLLOWER (SYNC)";
        }
      };
    }

    // ==========================================
    // SCENARIO DISPATCHER
    // ==========================================
    function buildClusterScene() {
      clearScene();
      const s = params.sceneScenario;

      if (s.startsWith("1. Standard")) {
        buildStandardShardedScene();
      } else if (s.startsWith("2. Chaos")) {
        buildChaosRaftScene();
      } else if (s.startsWith("3. Multi-Region")) {
        buildMultiRegionScene();
      } else if (s.startsWith("4. Consistent Hash")) {
        buildHashRingScene();
      } else if (s.startsWith("5. Storage Engine")) {
        buildLSMInternalsScene();
      } else if (s.startsWith("6. Scatter-Gather")) {
        buildScatterGatherScene();
      } else if (s.startsWith("7. Dynamic Auto")) {
        buildAutoReshardScene();
      } else if (s.startsWith("8. Cyber-Secured")) {
        buildZeroTrustScene();
      }

      applyColors();
      applyExposure();
    }

    // Colors & Themes

      const scheme = COLOR_SCHEMES[params.colorScheme];

      params.bg = scheme.bg;
      params.nodePrimary = scheme.nodePrimary;
      params.nodeReplica = scheme.nodeReplica;
      params.router = scheme.router;
      params.primaryPath = scheme.primaryPath;
      params.replicaPath = scheme.replicaPath;
      params.packet = scheme.packet;
      params.accent = scheme.accent;
      params.text = scheme.text;
      params.subtext = scheme.subtext;
      params.panelBg = scheme.panelBg;
      applyColors();
    }

      document.getElementById('cyl-rout-25').setAttribute('stop-color', shadeColor(params.router, 30));
      document.getElementById('cyl-rout-65').setAttribute('stop-color', params.router);
      document.getElementById('cyl-rout-100').setAttribute('stop-color', shadeColor(params.router, -45));
      document.getElementById('cap-rout-0').setAttribute('stop-color', shadeColor(params.router, 40));
      document.getElementById('cap-rout-100').setAttribute('stop-color', params.router);

      document.getElementById('glow-stop-0').setAttribute('stop-color', params.accent);
      document.getElementById('glow-stop-65').setAttribute('stop-color', params.accent);
      document.getElementById('glow-stop-100').setAttribute('stop-color', params.accent);

      document.querySelectorAll('.theme-stroke').forEach(el => el.setAttribute('stroke', params.accent));
      document.querySelectorAll('.theme-panel-bg').forEach(el => el.setAttribute('fill', isGreen ? '#003300' : params.panelBg));
      document.querySelectorAll('.theme-text').forEach(el => el.setAttribute('fill', params.text));
      document.querySelectorAll('.theme-subtext').forEach(el => el.setAttribute('fill', params.subtext));
      document.querySelectorAll('.theme-accent-fill').forEach(el => el.setAttribute('fill', params.accent));
      document.querySelectorAll('.theme-led').forEach(el => el.setAttribute('fill', params.accent));

      activePaths.forEach(p => {
        let sc = params.replicaPath;
        if (p.id.includes('router') || p.id.includes('ingress') || p.id.includes('scatter')) sc = params.primaryPath;
        if (p.id.includes('bus') || p.id.includes('wan') || p.id.includes('gather')) sc = params.accent;
        p.el.setAttribute('stroke', sc);
        const bgEl = p.el.previousElementSibling;
        if (bgEl) bgEl.setAttribute('stroke', sc);
      });

      document.querySelectorAll('.theme-packet-stroke').forEach(el => el.setAttribute('stroke', params.accent));
      document.querySelectorAll('.theme-packet-fill').forEach(el => el.setAttribute('fill', params.packet));
    }

    function applyExposure() {
      const exp = parseFloat(params.exposure);
      const transfer = document.getElementById('exposure-transfer');
      if (transfer) {
        transfer.children[0].setAttribute('slope', exp);
        transfer.children[1].setAttribute('slope', exp);
        transfer.children[2].setAttribute('slope', exp);
      }
    }

    function applyDPR() {
      const dpr = parseFloat(params.dpr);
      const glowLg = document.getElementById('glow-lg');
      const glowSm = document.getElementById('glow-sm');
      if (glowLg && glowSm) {
        glowLg.children[0].setAttribute('stdDeviation', 6 * dpr);
        glowSm.children[0].setAttribute('stdDeviation', 3 * dpr);
      }
    }

    // Procedural Randomizer on Click
    function triggerProceduralRandomize() {
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      params.colorScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];

      params.sceneScenario = SCENARIOS[Math.floor(Math.random() * SCENARIOS.length)];
      params.shardCount = [2, 3, 4][Math.floor(Math.random() * 3)];
      params.replicasPerShard = [1, 2, 3][Math.floor(Math.random() * 3)];
      params.cylinderScale = parseFloat((0.85 + Math.random() * 0.35).toFixed(2));
      params.pathCurvature = parseFloat((0.3 + Math.random() * 0.9).toFixed(2));
      params.packetDensity = parseFloat((0.7 + Math.random() * 1.3).toFixed(2));

      params.animation = CAMERA_ANIMATIONS[Math.floor(Math.random() * CAMERA_ANIMATIONS.length)];
      params.speed = parseFloat((0.6 + Math.random() * 1.2).toFixed(2));
      params.exposure = parseFloat((0.85 + Math.random() * 0.45).toFixed(2));

      applyTheme();
      buildClusterScene();
      applyDPR();

      if (window._clusterGUI) {
        window._clusterGUI.controllersRecursive().forEach(ctrl => ctrl.updateDisplay());
      }
    }

    // Pan & Zoom Handlers
    const stage = document.getElementById('stage-container');
    let isDragging = false;
    let startPoint = { x: 0, y: 0 };
    let dragStartView = { x: 0, y: 0 };
    let totalDragDist = 0;

    stage.addEventListener('wheel', (e) => {
      e.preventDefault();
      const rect = stage.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
      const newScale = Math.min(Math.max(userView.scale * zoomFactor, 0.25), 4.5);

      userView.x = mouseX - (mouseX - userView.x) * (newScale / userView.scale);
      userView.y = mouseY - (mouseY - userView.y) * (newScale / userView.scale);
      userView.scale = newScale;
    }, { passive: false });

    stage.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      isDragging = true;
      startPoint = { x: e.clientX, y: e.clientY };
      dragStartView = { x: userView.x, y: userView.y };
      totalDragDist = 0;
      stage.setPointerCapture(e.pointerId);
    });

    stage.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - startPoint.x;
      const dy = e.clientY - startPoint.y;
      totalDragDist += Math.hypot(dx, dy);
      userView.x = dragStartView.x + dx;
      userView.y = dragStartView.y + dy;
    });

    stage.addEventListener('pointerup', (e) => {
      if (!isDragging) return;
      isDragging = false;
      try { stage.releasePointerCapture(e.pointerId); } catch (_) {}

      if (totalDragDist < 6 && params.clickRandomize) {
        triggerProceduralRandomize();
      }
    });

    stage.addEventListener('pointercancel', () => { isDragging = false; });

    function resetCameraView() {
      userView.x = 0;
      userView.y = 0;
      userView.scale = 1.0;
    }

    // Infinite Animation Loop
    let lastTime = performance.now();
    let animTime = 0;

    function animate(currentTime) {
      const dt = Math.min((currentTime - lastTime) * 0.001, 0.1);
      lastTime = currentTime;
      animTime += dt * params.speed;

      // 1. Camera Animation Modes
      const mode = params.animation;
      const t = animTime;

      if (mode.startsWith("1. Static")) {
        cameraAnim.x = 0; cameraAnim.y = 0; cameraAnim.scale = 1.0; cameraAnim.rot = 0;
      } else if (mode.startsWith("2. Gentle Orbit")) {
        cameraAnim.x = Math.sin(t * 0.35) * 35;
        cameraAnim.y = Math.cos(t * 0.25) * 22;
        cameraAnim.scale = 1.0 + Math.sin(t * 0.2) * 0.03;
        cameraAnim.rot = Math.sin(t * 0.15) * 0.5;
      } else if (mode.startsWith("3. Shard Focus")) {
        cameraAnim.x = Math.sin(t * 0.3) * 85;
        cameraAnim.y = Math.cos(t * 0.4) * 20;
        cameraAnim.scale = 1.02 + Math.sin(t * 0.3) * 0.035;
        cameraAnim.rot = 0;
      } else if (mode.startsWith("4. Heartbeat")) {
        const pulse = Math.pow(Math.sin(t * 0.75), 4);
        cameraAnim.scale = 1.0 + pulse * 0.05;
        cameraAnim.y = Math.sin(t * 0.35) * 12;
        cameraAnim.x = 0; cameraAnim.rot = 0;
      } else if (mode.startsWith("5. Replication Flow")) {
        cameraAnim.x = Math.sin(t * 0.22) * 110;
        cameraAnim.y = Math.sin(t * 0.15) * 16;
        cameraAnim.scale = 1.01; cameraAnim.rot = 0;
      } else if (mode.startsWith("6. Isometric Elevation")) {
        cameraAnim.rot = Math.sin(t * 0.25) * 1.5;
        cameraAnim.y = Math.cos(t * 0.3) * 24;
        cameraAnim.x = Math.sin(t * 0.2) * 15;
        cameraAnim.scale = 1.015 + Math.sin(t * 0.18) * 0.03;
      } else if (mode.startsWith("7. Query Pipeline")) {
        cameraAnim.x = Math.cos(t * 0.32) * 48;
        cameraAnim.y = Math.sin(t * 0.32) * 32;
        cameraAnim.scale = 1.02 + Math.sin(t * 0.6) * 0.025;
        cameraAnim.rot = Math.sin(t * 0.2) * 0.4;
      } else if (mode.startsWith("8. Lissajous")) {
        cameraAnim.x = Math.sin(t * 0.28) * 45;
        cameraAnim.y = Math.sin(t * 0.56) * 26;
        cameraAnim.scale = 1.0 + Math.cos(t * 0.28) * 0.03;
        cameraAnim.rot = Math.sin(t * 0.14) * 0.6;
      }

      // 2. Viewport Transform
      const finalX = userView.x + cameraAnim.x;
      const finalY = userView.y + cameraAnim.y;
      const finalScale = userView.scale * cameraAnim.scale;
      const cx = 800; const cy = 475;

      viewportGroup.setAttribute(
        'transform',
        `translate(${finalX}, ${finalY}) translate(${cx}, ${cy}) scale(${finalScale}) rotate(${cameraAnim.rot}) translate(${-cx}, ${-cy})`
      );

      // 3. Network Paths Dash Offset
      activePaths.forEach(p => {
        const offset = -((animTime * p.speed * 2.5) % 1000);
        p.el.style.strokeDashoffset = `${offset}px`;
      });

      // 4. Packet Markers Position & Orientation
      activePackets.forEach(pkt => {
        pkt.progress = (pkt.progress + dt * params.speed * 0.18 * pkt.speedMult) % 1;
        const totalLen = pkt.pathObj.length;
        const curDist = pkt.progress * totalLen;

        try {
          const pt = pkt.pathObj.el.getPointAtLength(curDist);
          const nextDist = Math.min(totalLen, curDist + 2);
          const ptNext = pkt.pathObj.el.getPointAtLength(nextDist);
          let angle = Math.atan2(ptNext.y - pt.y, ptNext.x - pt.x) * 180 / Math.PI;

          // Keep packet text upright and readable
          if (angle > 90) angle -= 180;
          else if (angle < -90) angle += 180;

          pkt.el.setAttribute('transform', `translate(${pt.x}, ${pt.y}) rotate(${angle})`);
        } catch (_) {}
      });

      // 5. Status LEDs
      activeLeds.forEach(led => {
        const pulse = 0.5 + 0.5 * Math.sin(animTime * (led.role === 'primary' ? 4 : 2.5) + led.phase);
        led.el.setAttribute('r', (led.baseR + pulse * 1.5).toFixed(1));
        led.el.setAttribute('opacity', (0.65 + pulse * 0.35).toFixed(2));
      });

      // 6. Scenario-specific updates
      if (scenarioHooks.update) {
        scenarioHooks.update(animTime);
      }

      requestAnimationFrame(animate);
    }

    // --- LIL-GUI INITIALIZATION ---
    function initGUI() {
      const gui = new GUI({ title: 'Distributed DB Cluster' });
      window._clusterGUI = gui;

      // Scenario Folder
      const fScenario = gui.addFolder('Cluster Scenario');
      fScenario.add(params, 'sceneScenario', SCENARIOS).name('Architecture').onChange(buildClusterScene);

      // Theme & Display
      const fDisplay = gui.addFolder('Theme & Display');
      fDisplay.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Color Scheme').onChange(applyTheme);
      fDisplay.add(params, 'greenscreen').name('Greenscreen (#00ff00)').onChange(applyColors);
      fDisplay.add(params, 'exposure', 0.3, 2.5, 0.05).name('Exposure / Light').onChange(applyExposure);
      fDisplay.add(params, 'dpr', 0.5, 3.0, 0.1).name('Pixel Ratio (DPR)').onChange(applyDPR);

      // Camera & Motion
      const fMotion = gui.addFolder('Camera & Motion');
      fMotion.add(params, 'animation', CAMERA_ANIMATIONS).name('Camera Animation');
      fMotion.add(params, 'speed', 0.1, 3.0, 0.05).name('Animation Speed');
      fMotion.add(params, 'packetDensity', 0.5, 2.5, 0.1).name('Packet Density').onChange(buildClusterScene);

      // Topology Controls (Relevant for Sharded Clusters)
      const fCluster = gui.addFolder('Cluster Architecture');
      fCluster.add(params, 'shardCount', [2, 3, 4]).name('Shard Count').onChange(buildClusterScene);
      fCluster.add(params, 'replicasPerShard', [1, 2, 3]).name('Replicas / Shard').onChange(buildClusterScene);
      fCluster.add(params, 'cylinderScale', 0.7, 1.4, 0.05).name('Cylinder Scale').onChange(buildClusterScene);
      fCluster.add(params, 'pathCurvature', 0.0, 1.5, 0.05).name('Path Curvature').onChange(buildClusterScene);
      fCluster.add(params, 'clickRandomize').name('Click to Randomize');

      // Custom Color Overrides
      const fColors = gui.addFolder('Custom Palette');
      fColors.addColor(params, 'bg').name('Background').onChange(applyColors);
      fColors.addColor(params, 'nodePrimary').name('Primary DB').onChange(applyColors);
      fColors.addColor(params, 'nodeReplica').name('Replica DB').onChange(applyColors);
      fColors.addColor(params, 'router').name('Router Node').onChange(applyColors);
      fColors.addColor(params, 'primaryPath').name('Shard Path').onChange(applyColors);
      fColors.addColor(params, 'replicaPath').name('Replica Path').onChange(applyColors);
      fColors.addColor(params, 'packet').name('Data Packet').onChange(applyColors);
      fColors.addColor(params, 'accent').name('Accent / LED').onChange(applyColors);
      fColors.close();

      // Actions
      const fActions = gui.addFolder('Actions');
      fActions.add({ randomize: () => triggerProceduralRandomize() }, 'randomize').name('🎲 Randomize Scene');
      fActions.add({ reset: () => resetCameraView() }, 'reset').name('⟲ Reset Zoom / Pan');

      // 'H' key to toggle UI
      window.addEventListener('keydown', (e) => {
        if (e.key === 'h' || e.key === 'H') {
          if (gui._hidden) {
            gui.show();
          } else {
            gui.hide();
          }
        }
      });
    }

    // --- BOOTSTRAP ---
    buildClusterScene();
    applyTheme();
    applyDPR();
    initGUI();
    requestAnimationFrame(animate);
  </script>
</body>
