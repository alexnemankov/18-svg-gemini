<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frosted Glass Ornaments</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #080b12;
      user-select: none;
      -webkit-user-select: none;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      display: block;
      position: absolute;
      top: 0;
      left: 0;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
    }
  }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import GUI from 'lil-gui';

    // =========================================================================
    // POST PROCESSOR SUITE (from postprocessing/PostProcessor.js)
    // =========================================================================
    const orthoVertexShader = `
      precision highp float;
      in vec3 position;
      out vec2 vUv;
      void main() {
        vUv = position.xy * 0.5 + 0.5;
        gl_Position = vec4(position.xy, 0.0, 1.0);
      }
    `;

    const brightFragmentShader = `
      precision highp float;
      uniform sampler2D inputTexture;
      uniform float bloomThreshold;
      in vec2 vUv;
      out vec4 fragColor;

      vec3 sanitize(vec3 v) {
        if (isnan(v.x) || isinf(v.x)) v.x = 0.0;
        if (isnan(v.y) || isinf(v.y)) v.y = 0.0;
        if (isnan(v.z) || isinf(v.z)) v.z = 0.0;
        return clamp(v, vec3(0.0), vec3(65000.0));
      }

      void main() {
        vec4 raw = texture(inputTexture, vUv);
        vec3 color = sanitize(raw.rgb);
        // Calculate relative luminance (Rec. 709)
        float luminance = max(0.0, dot(color, vec3(0.2126, 0.7152, 0.0722)));
        // Soft knee thresholding
        float knee = 0.1;
        float soft = luminance - bloomThreshold + knee;
        soft = clamp(soft, 0.0, 2.0 * knee);
        soft = (soft * soft) / (4.0 * knee + 0.00001);
        float contribution = max(soft, luminance - bloomThreshold);
        contribution /= max(luminance, 0.0001);
        vec3 result = color * contribution;
        fragColor = vec4(sanitize(result), clamp(raw.a, 0.0, 1.0));
      }
    `;

    const blur13ShaderChunk = `
      vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
        vec2 resolution = vec2(textureSize(image, 0));
        vec4 color = vec4(0.0);
        vec2 off1 = vec2(1.411764705882353) * direction;
        vec2 off2 = vec2(3.2941176470588234) * direction;
        vec2 off3 = vec2(5.176470588235294) * direction;
        color += texture(image, uv) * 0.1964825501511404;
        color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
        color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
        color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
        color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
        color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
        color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
        return color;
      }
    `;

    const blurFragmentShader = `
      precision highp float;
      uniform sampler2D inputTexture;
      uniform vec2 direction;
      in vec2 vUv;
      out vec4 color;
      ${blur13ShaderChunk}

      vec4 sanitize(vec4 v) {
        if (isnan(v.x) || isinf(v.x)) v.x = 0.0;
        if (isnan(v.y) || isinf(v.y)) v.y = 0.0;
        if (isnan(v.z) || isinf(v.z)) v.z = 0.0;
        if (isnan(v.w) || isinf(v.w)) v.w = 0.0;
        return clamp(v, vec4(0.0), vec4(65000.0));
      }

      void main() {
        color = sanitize(blur13(inputTexture, vUv, direction));
      }
    `;

    const godRaysDepthMaskShader = `
      precision highp float;
      uniform sampler2D inputTexture;
      uniform float threshold;
      in vec2 vUv;
      out vec4 fragColor;
      void main() {
        vec4 color = texture(inputTexture, vUv);
        float lum = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
        float factor = smoothstep(threshold, threshold + 0.15, lum);
        fragColor = vec4(vec3(factor), 1.0);
      }
    `;

    const godRaysGenerateShader = `
      precision highp float;
      #define TAPS_PER_PASS 6.0
      uniform sampler2D inputTexture;
      uniform vec3 vSunPositionScreenSpace;
      uniform float fStepSize;
      uniform float distanceAttenuation;
      uniform float maxDensity;
      in vec2 vUv;
      out vec4 fragColor;
      void main() {
        vec2 delta = vSunPositionScreenSpace.xy - vUv;
        float dist = length(delta);
        vec2 stepv = fStepSize * delta / max(dist, 0.0001);
        float iters = dist / max(fStepSize, 0.00001);
        vec2 uv = vUv;
        float col = 0.0;
        float f = min(1.0, max(vSunPositionScreenSpace.z, 0.0));
        float atten = 1.0 / (1.0 + pow(dist, distanceAttenuation));
        if (0.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
        uv += stepv;
        if (1.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
        uv += stepv;
        if (2.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
        uv += stepv;
        if (3.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
        uv += stepv;
        if (4.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
        uv += stepv;
        if (5.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
        float finalVal = min(col / TAPS_PER_PASS * atten, maxDensity);
        fragColor = vec4(vec3(finalVal), 1.0);
      }
    `;

    const anamorphicBrightShader = `
      precision highp float;
      uniform sampler2D inputTexture;
      uniform float threshold;
      uniform float smoothWidth;
      in vec2 vUv;
      out vec4 fragColor;
      void main() {
        vec4 color = texture(inputTexture, vUv);
        float v = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
        float alpha = smoothstep(threshold, threshold + smoothWidth, v);
        fragColor = mix(vec4(0.0), color, alpha);
      }
    `;

    const anamorphicBlurShader = `
      precision highp float;
      uniform sampler2D inputTexture;
      uniform vec2 resolution;
      uniform float samples;
      uniform float intensity;
      uniform vec3 tintColor;
      uniform float bloomRadius;
      in vec2 vUv;
      out vec4 fragColor;
      void main() {
        int halfSamples = max(1, int(samples) / 2);
        float fHalfSamples = float(halfSamples);
        vec2 invSize = 1.0 / resolution;
        vec4 total = vec4(0.0);
        for (int i = -64; i <= 64; i++) {
          if (i < -halfSamples || i > halfSamples) continue;
          float softness = 1.0 - abs(float(i)) / fHalfSamples;
          softness = pow(softness, 2.0);
          vec2 shiftedUV = vec2(vUv.x + invSize.x * float(i) * (4.0 + bloomRadius * 8.0), vUv.y);
          shiftedUV = clamp(shiftedUV, 0.001, 0.999);
          total += texture(inputTexture, shiftedUV) * softness;
        }
        fragColor = (total / (samples / 3.0)) * vec4(tintColor, 1.0) * intensity;
      }
    `;

    const finalFragmentShader = `
      precision highp float;
      uniform vec2 resolution;
      uniform sampler2D inputTexture;
      uniform sampler2D blur0Texture;
      uniform sampler2D blur1Texture;
      uniform sampler2D blur2Texture;
      uniform sampler2D blur3Texture;
      uniform sampler2D blur4Texture;
      uniform sampler2D raysTexture;
      uniform sampler2D anamorphicTexture;
      uniform bool bloomEnabled;
      uniform float bloomStrength;
      uniform bool raysEnabled;
      uniform float raysStrength;
      uniform vec3 raysColor;
      uniform bool anamorphicEnabled;
      uniform float vignetteBoost;
      uniform float vignetteReduction;
      uniform float noiseIntensity;
      uniform float time;
      in vec2 vUv;
      out vec4 fragColor;

      vec3 sanitize(vec3 v) {
        if (isnan(v.x) || isinf(v.x)) v.x = 0.0;
        if (isnan(v.y) || isinf(v.y)) v.y = 0.0;
        if (isnan(v.z) || isinf(v.z)) v.z = 0.0;
        return clamp(v, vec3(0.0), vec3(65000.0));
      }

      float vignette(vec2 uv, float boost, float reduction) {
        vec2 position = vUv - 0.5;
        return boost - length(position) * reduction;
      }

      float hash1(uint n) {
        n = (n << 13U) ^ n;
        n = n * (n * n * 15731U + 789221U) + 1376312589U;
        return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
      }

      float noise(in vec2 uv, in float timeVal) {
        uvec2 p = uvec2(uv);
        return hash1(p.x + 1920U * p.y + (1920U * 1080U) * (uint(timeVal) % 65536U));
      }

      void main() {
        vec4 raw = texture(inputTexture, vUv);
        vec3 color = sanitize(raw.rgb);

        if (bloomEnabled && bloomStrength > 0.001) {
          vec3 b0 = sanitize(texture(blur0Texture, vUv).rgb);
          vec3 b1 = sanitize(texture(blur1Texture, vUv).rgb);
          vec3 b2 = sanitize(texture(blur2Texture, vUv).rgb);
          vec3 b3 = sanitize(texture(blur3Texture, vUv).rgb);
          vec3 b4 = sanitize(texture(blur4Texture, vUv).rgb);

          vec3 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
          color += bloomSum * bloomStrength;
        }

        if (raysEnabled && raysStrength > 0.001) {
          vec3 r = sanitize(texture(raysTexture, vUv).rgb);
          color += r * raysColor * raysStrength;
        }

        if (anamorphicEnabled) {
          vec3 a = sanitize(texture(anamorphicTexture, vUv).rgb);
          color += a;
        }

        float vig = max(0.0, vignette(vUv, vignetteBoost, vignetteReduction));
        color *= vig;
        color += max(0.0, noiseIntensity) * noise(gl_FragCoord.xy, time);
        fragColor = vec4(sanitize(color), 1.0);
      }
    `;

    const chromaticAberrationShaderChunk = `
      vec2 barrelDistortion(vec2 coord, float amt) {
        vec2 cc = coord - 0.5;
        float dist = dot(cc, cc);
        return coord + cc * dist * amt;
      }
      float sat(float t) { return clamp(t, 0.0, 1.0); }
      float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
      float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
      vec4 spectrum_offset(float t) {
        float lo = step(t, 0.5);
        float hi = 1.0 - lo;
        float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
        vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
        return pow(ret, vec4(1.0 / 2.2));
      }
      const float max_distort = 2.2;
      const int num_iter = 8;
      const float reci_num_iter_f = 1.0 / float(num_iter);
      vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
        vec4 sumcol = vec4(0.0);
        vec4 sumw = vec4(0.0);
        for (int i = 0; i < num_iter; ++i) {
          float t = float(i) * reci_num_iter_f;
          vec4 w = spectrum_offset(t);
          sumw += w;
          sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
        }
        return sumcol / sumw;
      }
    `;

    const colorFragmentShader = `
      precision highp float;
      uniform sampler2D inputTexture;
      uniform float chromaticAberrationAmount;
      uniform float minInputLevel;
      uniform float maxInputLevel;
      uniform float gammaLevel;
      uniform float exposure;
      uniform float fisheyeStrength;
      uniform float fisheyeRadius;
      uniform float time;
      uniform int visionMode;
      uniform float thermalSensitivity;
      uniform float nightVisionNoise;
      uniform float nightVisionGain;
      uniform float crtIntensity;
      in vec2 vUv;
      out vec4 fragColor;

      ${chromaticAberrationShaderChunk}

      vec2 applyFisheye(vec2 uv, float strength, float radius) {
        if (abs(strength) < 0.0001) return uv;
        vec2 p = uv - 0.5;
        float d = length(p);
        if (d > radius * 1.5) return uv;
        float r = d / max(radius, 0.001);
        float theta = atan(p.y, p.x);
        float rDist = r + strength * (r * r * r);
        return 0.5 + vec2(cos(theta), sin(theta)) * (rDist * radius);
      }

      vec3 ACESFilmicToneMapping(vec3 color) {
        color = max(vec3(0.0), color);
        float a = 2.51;
        float b = 0.03;
        float c = 2.43;
        float d = 0.59;
        float e = 0.14;
        vec3 denom = max(color * (c * color + d) + e, vec3(0.0001));
        return clamp((color * (a * color + b)) / denom, 0.0, 1.0);
      }

      vec3 gammaCorrect(vec3 color, vec3 gamma) {
        return pow(max(color, vec3(0.0)), 1.0 / max(gamma, vec3(0.001)));
      }
      vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
        return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
      }
      vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
        return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
      }

      void main() {
        vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
        vec4 col = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
        vec3 finalCol = col.rgb;
        if (isnan(finalCol.x) || isinf(finalCol.x)) finalCol.x = 0.0;
        if (isnan(finalCol.y) || isinf(finalCol.y)) finalCol.y = 0.0;
        if (isnan(finalCol.z) || isinf(finalCol.z)) finalCol.z = 0.0;
        finalCol = clamp(finalCol, vec3(0.0), vec3(65000.0));
        
        vec3 exposedColor = finalCol * exposure;
        vec3 toneMappedColor = ACESFilmicToneMapping(exposedColor);
        finalCol = finalLevels(toneMappedColor, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));

        fragColor = vec4(finalCol, 1.0);
      }
    `;

    const copyFragmentShader = `
      precision highp float;
      uniform sampler2D inputTexture;
      in vec2 vUv;
      out vec4 fragColor;
      void main() {
        fragColor = texture(inputTexture, vUv);
      }
    `;

    function createFBO(w, h, options = {}) {
      return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
        wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
        wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
        minFilter: options.minFilter || THREE.LinearFilter,
        magFilter: options.magFilter || THREE.LinearFilter,
        format: options.format || THREE.RGBAFormat,
        type: options.type || THREE.HalfFloatType,
        stencilBuffer: options.stencilBuffer || false,
        depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : false,
        samples: options.samples || 0,
      });
    }

    class ShaderPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.shader.depthTest = false;
        this.shader.depthWrite = false;
        this.orthoScene = new THREE.Scene();
        this.fbo = createFBO(1, 1, options);
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
        this.texture = this.fbo.texture;
      }
      render(renderer, toScreen = false) {
        if (!toScreen) renderer.setRenderTarget(this.fbo);
        renderer.render(this.orthoScene, this.orthoCamera);
        if (!toScreen) renderer.setRenderTarget(null);
      }
      setSize(width, height) {
        this.fbo.setSize(Math.max(1, width), Math.max(1, height));
      }
    }

    class ShaderPingPongPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.shader.depthTest = false;
        this.shader.depthWrite = false;
        this.orthoScene = new THREE.Scene();
        this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
        this.currentFBO = 0;
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
      }
      render(renderer) {
        renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
        renderer.render(this.orthoScene, this.orthoCamera);
        renderer.setRenderTarget(null);
        this.currentFBO = 1 - this.currentFBO;
      }
      get current() { return this.fbos[this.currentFBO]; }
      get texture() { return this.current.texture; }
      setSize(width, height) {
        const w = Math.max(1, width);
        const h = Math.max(1, height);
        this.fbos[0].setSize(w, h);
        this.fbos[1].setSize(w, h);
      }
    }

    class BloomPass {
      constructor(strength = 0.8, radius = 0.5, threshold = 0.2, levels = 5) {
        this.strength = strength;
        this.radius = radius;
        this.threshold = threshold;
        this.enabled = true;
        this.levels = levels;

        this.brightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            bloomThreshold: { value: this.threshold },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: brightFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.brightPass = new ShaderPass(this.brightShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.blurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            direction: { value: new THREE.Vector2(0, 1) },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: blurFragmentShader,
          glslVersion: THREE.GLSL3,
        });

        this.blurPasses = [];
        for (let i = 0; i < this.levels; i++) {
          this.blurPasses.push(new ShaderPingPongPass(this.blurShader, {
            format: THREE.RGBAFormat,
            type: THREE.HalfFloatType,
          }));
        }
      }

      setSize(w, h) {
        let tw = Math.max(1, w);
        let th = Math.max(1, h);
        this.brightPass.setSize(tw, th);
        for (let i = 0; i < this.levels; i++) {
          tw = Math.max(1, Math.round(tw / 2));
          th = Math.max(1, Math.round(th / 2));
          this.blurPasses[i].setSize(tw, th);
        }
      }

      set source(texture) {
        this.brightShader.uniforms.inputTexture.value = texture;
      }

      render(renderer) {
        if (!this.enabled || this.strength <= 0.001) return;
        this.brightShader.uniforms.bloomThreshold.value = this.threshold;
        this.brightPass.render(renderer);

        const baseOffset = Math.max(0.1, this.radius * 2.0);
        const u = this.blurShader.uniforms;

        for (let j = 0; j < this.levels; j++) {
          const blurPass = this.blurPasses[j];
          const stepOffset = baseOffset * (1.0 + j * 0.5);

          u.direction.value.set(stepOffset, 0);
          u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
          blurPass.render(renderer);

          u.direction.value.set(0, stepOffset * 0.5);
          u.inputTexture.value = blurPass.current.texture;
          blurPass.render(renderer);
        }
      }
    }

    class PostProcessor {
      constructor(renderer, params = {}) {
        this.renderer = renderer;

        this.settings = {
          enabled: params.enabled !== undefined ? params.enabled : true,
          antialias: params.antialias !== undefined ? params.antialias : true,
          bloomEnabled: params.bloomEnabled !== undefined ? params.bloomEnabled : true,
          bloomStrength: params.bloomStrength !== undefined ? params.bloomStrength : 1.1,
          bloomRadius: params.bloomRadius !== undefined ? params.bloomRadius : 0.55,
          bloomThreshold: params.bloomThreshold !== undefined ? params.bloomThreshold : 0.18,

          raysEnabled: params.raysEnabled !== undefined ? params.raysEnabled : false,
          raysStrength: params.raysStrength !== undefined ? params.raysStrength : 0.6,
          raysDensity: params.raysDensity !== undefined ? params.raysDensity : 1.0,
          raysMaxDensity: params.raysMaxDensity !== undefined ? params.raysMaxDensity : 0.5,
          raysDistanceAttenuation: params.raysDistanceAttenuation !== undefined ? params.raysDistanceAttenuation : 2.0,
          raysThreshold: params.raysThreshold !== undefined ? params.raysThreshold : 0.12,
          raysColor: params.raysColor ? (params.raysColor.isColor ? params.raysColor.clone() : new THREE.Color(params.raysColor)) : new THREE.Color(0xffe29a),
          raysColorHex: params.raysColorHex || '#ffe29a',

          // Anamorphic flare default is explicitly OFF per user requirement
          anamorphicEnabled: params.anamorphicEnabled !== undefined ? params.anamorphicEnabled : false,
          anamorphicIntensity: params.anamorphicIntensity !== undefined ? params.anamorphicIntensity : 4.0,
          anamorphicThreshold: params.anamorphicThreshold !== undefined ? params.anamorphicThreshold : 0.35,
          anamorphicSamples: params.anamorphicSamples !== undefined ? params.anamorphicSamples : 48,
          anamorphicRadius: params.anamorphicRadius !== undefined ? params.anamorphicRadius : 0.0,
          anamorphicSmoothWidth: params.anamorphicSmoothWidth !== undefined ? params.anamorphicSmoothWidth : 0.05,
          anamorphicColor: params.anamorphicColor ? (params.anamorphicColor.isColor ? params.anamorphicColor.clone() : new THREE.Color(params.anamorphicColor)) : new THREE.Color(0xffd77a),
          anamorphicColorHex: params.anamorphicColorHex || '#ffd77a',

          fisheyeStrength: params.fisheyeStrength !== undefined ? params.fisheyeStrength : 0.0,
          fisheyeRadius: params.fisheyeRadius !== undefined ? params.fisheyeRadius : 1.0,
          chromaticAberration: params.chromaticAberration !== undefined ? params.chromaticAberration : 0.008,
          vignetteBoost: params.vignetteBoost !== undefined ? params.vignetteBoost : 1.08,
          vignetteReduction: params.vignetteReduction !== undefined ? params.vignetteReduction : 0.7,
          noiseIntensity: params.noiseIntensity !== undefined ? params.noiseIntensity : 0.012,

          gamma: params.gamma !== undefined ? params.gamma : 1.0,
          minInputLevel: params.minInputLevel !== undefined ? params.minInputLevel : 0.0,
          maxInputLevel: params.maxInputLevel !== undefined ? params.maxInputLevel : 1.0,
          exposure: params.exposure !== undefined ? params.exposure : 1.1,
        };

        const maxSamples = (this.renderer && this.renderer.capabilities) ? (this.renderer.capabilities.maxSamples || 4) : 4;
        const targetSamples = this.settings.antialias ? Math.min(4, maxSamples) : 0;
        this.sceneTarget = createFBO(1, 1, { type: THREE.HalfFloatType, samples: targetSamples, depthBuffer: true });

        this.bloomPass = new BloomPass(
          this.settings.bloomStrength,
          this.settings.bloomRadius,
          this.settings.bloomThreshold,
          5
        );

        this.moonScreenPos = new THREE.Vector3(0.5, 0.5, 1.0);
        this.moonInFront = true;

        this.godRaysMaskShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            threshold: { value: this.settings.raysThreshold },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: godRaysDepthMaskShader,
          glslVersion: THREE.GLSL3,
        });
        this.godRaysMaskPass = new ShaderPass(this.godRaysMaskShader, { format: THREE.RGBAFormat, type: THREE.HalfFloatType });

        this.godRaysGenShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            vSunPositionScreenSpace: { value: this.moonScreenPos },
            fStepSize: { value: 1.0 },
            distanceAttenuation: { value: this.settings.raysDistanceAttenuation },
            maxDensity: { value: this.settings.raysMaxDensity },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: godRaysGenerateShader,
          glslVersion: THREE.GLSL3,
        });
        this.godRaysPingPong = new ShaderPingPongPass(this.godRaysGenShader, { format: THREE.RGBAFormat, type: THREE.HalfFloatType });

        this.anamorphicBrightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            threshold: { value: this.settings.anamorphicThreshold },
            smoothWidth: { value: this.settings.anamorphicSmoothWidth },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: anamorphicBrightShader,
          glslVersion: THREE.GLSL3,
        });
        this.anamorphicBrightPass = new ShaderPass(this.anamorphicBrightShader, { format: THREE.RGBAFormat, type: THREE.HalfFloatType });

        this.anamorphicBlurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            resolution: { value: new THREE.Vector2(1, 1) },
            samples: { value: this.settings.anamorphicSamples },
            intensity: { value: this.settings.anamorphicIntensity },
            tintColor: { value: this.settings.anamorphicColor },
            bloomRadius: { value: this.settings.anamorphicRadius },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: anamorphicBlurShader,
          glslVersion: THREE.GLSL3,
        });
        this.anamorphicBlurPass = new ShaderPass(this.anamorphicBlurShader, { format: THREE.RGBAFormat, type: THREE.HalfFloatType });

        this.finalShader = new THREE.RawShaderMaterial({
          uniforms: {
            resolution: { value: new THREE.Vector2(1, 1) },
            bloomEnabled: { value: this.settings.bloomEnabled },
            bloomStrength: { value: this.settings.bloomStrength },
            raysEnabled: { value: this.settings.raysEnabled },
            raysStrength: { value: this.settings.raysStrength },
            raysColor: { value: this.settings.raysColor },
            anamorphicEnabled: { value: this.settings.anamorphicEnabled },
            vignetteBoost: { value: this.settings.vignetteBoost },
            vignetteReduction: { value: this.settings.vignetteReduction },
            noiseIntensity: { value: this.settings.noiseIntensity },
            inputTexture: { value: null },
            blur0Texture: { value: null },
            blur1Texture: { value: null },
            blur2Texture: { value: null },
            blur3Texture: { value: null },
            blur4Texture: { value: null },
            raysTexture: { value: null },
            anamorphicTexture: { value: null },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: finalFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.finalPass = new ShaderPass(this.finalShader);

        this.rgbShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: this.finalPass.texture },
            fisheyeStrength: { value: this.settings.fisheyeStrength },
            fisheyeRadius: { value: this.settings.fisheyeRadius },
            chromaticAberrationAmount: { value: this.settings.chromaticAberration },
            minInputLevel: { value: this.settings.minInputLevel },
            maxInputLevel: { value: this.settings.maxInputLevel },
            gammaLevel: { value: this.settings.gamma },
            exposure: { value: this.settings.exposure },
            visionMode: { value: 0 },
            thermalSensitivity: { value: 1.4 },
            nightVisionGain: { value: 2.1 },
            nightVisionNoise: { value: 0.05 },
            crtIntensity: { value: 0.0 },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: colorFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.rgbPass = new ShaderPass(this.rgbShader);

        this.copyPass = new ShaderPass(new THREE.RawShaderMaterial({
          uniforms: { inputTexture: { value: null } },
          vertexShader: orthoVertexShader,
          fragmentShader: copyFragmentShader,
          glslVersion: THREE.GLSL3,
        }));
      }

      updateSettings() {
        this.bloomPass.enabled = this.settings.bloomEnabled;
        this.bloomPass.strength = this.settings.bloomStrength;
        this.bloomPass.radius = this.settings.bloomRadius;
        this.bloomPass.threshold = this.settings.bloomThreshold;

        this.godRaysMaskShader.uniforms.threshold.value = this.settings.raysThreshold;
        this.godRaysGenShader.uniforms.distanceAttenuation.value = this.settings.raysDistanceAttenuation;
        this.godRaysGenShader.uniforms.maxDensity.value = this.settings.raysMaxDensity;

        this.anamorphicBrightShader.uniforms.threshold.value = this.settings.anamorphicThreshold;
        this.anamorphicBrightShader.uniforms.smoothWidth.value = this.settings.anamorphicSmoothWidth;
        this.anamorphicBlurShader.uniforms.samples.value = this.settings.anamorphicSamples;
        this.anamorphicBlurShader.uniforms.intensity.value = this.settings.anamorphicIntensity;
        this.anamorphicBlurShader.uniforms.tintColor.value.copy(this.settings.anamorphicColor);
        this.anamorphicBlurShader.uniforms.bloomRadius.value = this.settings.anamorphicRadius;

        this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
        this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
        this.finalShader.uniforms.raysEnabled.value = this.settings.raysEnabled;
        this.finalShader.uniforms.raysStrength.value = this.settings.raysStrength;
        this.finalShader.uniforms.raysColor.value.copy(this.settings.raysColor);
        this.finalShader.uniforms.anamorphicEnabled.value = this.settings.anamorphicEnabled;
        this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
        this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
        this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;

        this.rgbShader.uniforms.fisheyeStrength.value = this.settings.fisheyeStrength;
        this.rgbShader.uniforms.fisheyeRadius.value = this.settings.fisheyeRadius;
        this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
        this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
        this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
        this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
        this.rgbShader.uniforms.exposure.value = this.settings.exposure;
      }

      setSize(w0, h0, dpr = 1) {
        const w = Math.max(1, Math.floor(w0 * dpr));
        const h = Math.max(1, Math.floor(h0 * dpr));
        this.sceneTarget.setSize(w, h);
        this.finalPass.setSize(w, h);
        this.finalShader.uniforms.resolution.value.set(w, h);
        this.bloomPass.setSize(w, h);

        const grW = Math.max(1, Math.round(w / 2));
        const grH = Math.max(1, Math.round(h / 2));
        this.godRaysMaskPass.setSize(grW, grH);
        this.godRaysPingPong.setSize(grW, grH);

        const anW = Math.max(1, Math.round(w / 4));
        const anH = Math.max(1, Math.round(h / 4));
        this.anamorphicBrightPass.setSize(anW, anH);
        this.anamorphicBlurPass.setSize(anW, anH);
        this.anamorphicBlurShader.uniforms.resolution.value.set(anW, anH);

        this.rgbPass.setSize(w, h);
        this.copyPass.setSize(w, h);
      }

      setAntialias(enabled) {
        this.settings.antialias = !!enabled;
        const maxSamples = (this.renderer && this.renderer.capabilities) ? (this.renderer.capabilities.maxSamples || 4) : 4;
        const samples = this.settings.antialias ? Math.min(4, maxSamples) : 0;
        if (this.sceneTarget.samples !== samples) {
          const oldTarget = this.sceneTarget;
          this.sceneTarget = createFBO(oldTarget.width, oldTarget.height, {
            type: THREE.HalfFloatType,
            samples: samples,
            depthBuffer: true,
          });
          oldTarget.dispose();
        }
      }

      renderScene(scene, camera) {
        if (!this.settings.enabled) {
          this.renderer.setRenderTarget(this.sceneTarget);
          this.renderer.render(scene, camera);
          this.renderer.setRenderTarget(null);
          this.copyPass.shader.uniforms.inputTexture.value = this.sceneTarget.texture;
          this.copyPass.render(this.renderer, true);
          return;
        }
        this.renderer.setRenderTarget(this.sceneTarget);
        this.renderer.render(scene, camera);
        this.renderer.setRenderTarget(null);
        this.render(this.sceneTarget.texture);
      }

      render(sourceTexture) {
        if (!this.settings.enabled) {
          this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
          this.copyPass.render(this.renderer, true);
          return;
        }

        this.updateSettings();

        // Bloom
        this.bloomPass.source = sourceTexture;
        this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
        this.bloomPass.render(this.renderer);

        this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
        this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
        this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
        this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
        this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

        // Godrays
        if (this.settings.raysEnabled && this.settings.raysStrength > 0.001) {
          this.godRaysMaskShader.uniforms.inputTexture.value = sourceTexture;
          this.godRaysMaskShader.uniforms.threshold.value = this.settings.raysThreshold;
          this.godRaysMaskPass.render(this.renderer);
          const filterLen = this.settings.raysDensity;
          const taps = 6.0;
          this.godRaysGenShader.uniforms.fStepSize.value = filterLen / taps;
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysMaskPass.texture;
          this.godRaysPingPong.render(this.renderer);
          this.finalPass.shader.uniforms.raysTexture.value = this.godRaysPingPong.texture;
          this.finalPass.shader.uniforms.raysEnabled.value = true;
        } else {
          this.finalPass.shader.uniforms.raysEnabled.value = false;
        }

        // Anamorphic Flare
        if (this.settings.anamorphicEnabled && this.settings.anamorphicIntensity > 0.001) {
          this.anamorphicBrightShader.uniforms.inputTexture.value = sourceTexture;
          this.anamorphicBrightShader.uniforms.threshold.value = this.settings.anamorphicThreshold;
          this.anamorphicBrightShader.uniforms.smoothWidth.value = this.settings.anamorphicSmoothWidth;
          this.anamorphicBrightPass.render(this.renderer);

          this.anamorphicBlurShader.uniforms.inputTexture.value = this.anamorphicBrightPass.texture;
          this.anamorphicBlurShader.uniforms.samples.value = this.settings.anamorphicSamples;
          this.anamorphicBlurShader.uniforms.intensity.value = this.settings.anamorphicIntensity;
          this.anamorphicBlurShader.uniforms.tintColor.value.copy(this.settings.anamorphicColor);
          this.anamorphicBlurShader.uniforms.bloomRadius.value = this.settings.anamorphicRadius;
          this.anamorphicBlurPass.render(this.renderer);

          this.finalPass.shader.uniforms.anamorphicTexture.value = this.anamorphicBlurPass.texture;
          this.finalPass.shader.uniforms.anamorphicEnabled.value = true;
        } else {
          this.finalPass.shader.uniforms.anamorphicEnabled.value = false;
        }

        const randomTime = Math.random() * 100000;
        this.finalPass.shader.uniforms.time.value = randomTime;
        this.rgbPass.shader.uniforms.time.value = randomTime;

        this.finalPass.render(this.renderer);
        this.rgbPass.render(this.renderer, true);
      }

      attachGUI(gui, title = "Post-Processing Suite") {
        const root = gui.addFolder(title);
        root.add(this.settings, "enabled").name("Enable Post-Process");
        root.add(this.settings, "antialias").name("MSAA Antialias").onChange((v) => this.setAntialias(v));

        // Atmospheric Bloom
        const bloom = root.addFolder("Atmospheric Bloom");
        bloom.add(this.settings, "bloomEnabled").name("Enable Bloom").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomStrength", 0, 3.0, 0.05).name("Bloom Strength").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomRadius", 0, 2.0, 0.05).name("Bloom Radius").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomThreshold", 0, 1.0, 0.01).name("Bloom Threshold").onChange(() => this.updateSettings());

        // Anamorphic Flare (Default OFF)
        const anamorphic = root.addFolder("Three.js Anamorphic Flare");
        anamorphic.add(this.settings, "anamorphicEnabled").name("Enable Anamorphic").onChange(() => this.updateSettings());
        anamorphic.add(this.settings, "anamorphicIntensity", 0, 10.0, 0.1).name("Intensity").onChange(() => this.updateSettings());
        anamorphic.add(this.settings, "anamorphicThreshold", 0.0, 0.9, 0.01).name("Threshold").onChange(() => this.updateSettings());
        anamorphic.add(this.settings, "anamorphicSamples", 2, 128, 1).name("Samples").onChange(() => this.updateSettings());
        anamorphic.add(this.settings, "anamorphicRadius", 0.0, 1.0, 0.01).name("Bloom Radius").onChange(() => this.updateSettings());
        anamorphic.addColor(this.settings, "anamorphicColorHex").name("Tint Color").onChange((v) => {
          this.settings.anamorphicColor.set(v);
          this.updateSettings();
        });

        // Lens, Optics & Tone
        const lens = root.addFolder("Lens, Optics & Tone");
        lens.add(this.settings, "chromaticAberration", 0, 0.05, 0.001).name("Chromatic Aberration").onChange(() => this.updateSettings());
        lens.add(this.settings, "vignetteBoost", 0, 2.0, 0.05).name("Vignette Boost").onChange(() => this.updateSettings());
        lens.add(this.settings, "vignetteReduction", 0, 2.0, 0.05).name("Vignette Falloff").onChange(() => this.updateSettings());
        lens.add(this.settings, "noiseIntensity", 0, 0.05, 0.002).name("Film Grain").onChange(() => this.updateSettings());
        lens.add(this.settings, "exposure", 0.2, 3.0, 0.05).name("Tone Exposure").onChange(() => this.updateSettings());
        lens.add(this.settings, "gamma", 0.2, 2.0, 0.05).name("Gamma").onChange(() => this.updateSettings());

        return root;
      }
    }

      rimLightIntensity: 2.6,
      rimLightColor: '#ffe5b4',
      innerLightIntensity: 3.5,
      innerLightDistance: 6.5,

      // Material properties
      glassRoughness: 0.28,
      glassTransmission: 0.94,
      glassOpacity: 0.82,
      glassIor: 1.5,
      ringMetalness: 0.96,
      ringRoughness: 0.12,
      innerCoreScale: 0.35,

      // Colors
      glassColor: '#e2effa',
      innerGlow1: '#ffaa22',
      innerGlow2: '#00e5ff',
      ringColor: '#f7d368',
      capColor: '#f7d368',
      bgColor: '#060911',

      // Motion
      bobAmplitude: 0.28,
      ringSpeed: 1.0
    };

    const ANIMATION_PRESETS = [
      'Zero-G Drift',
      'Gentle Orbit',
      'Breathing Pulse',
      'Celestial Spiral',
      'Harmonic Pendulum',
      'Zen Float',
      'Golden Rings Spin',
      'Static (No Camera Move)'
    ];

    // --- SETUP THREE.JS SCENE ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(params.bgColor, 0.018);

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.0, 13.0);

    let renderer = new THREE.WebGLRenderer({
      antialias: params.antialias,
      powerPreference: 'high-performance'
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(params.dpr);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = params.exposure;
    container.appendChild(renderer.domElement);

    let controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.screenSpacePanning = true;
    controls.zoomSpeed = 1.1;
    controls.panSpeed = 1.0;
    controls.minDistance = 3.0;
    controls.maxDistance = 32.0;

    // --- INITIALIZE POST PROCESSOR ---
    const postProcessor = new PostProcessor(renderer, {
      enabled: true,
      antialias: params.antialias,
      bloomEnabled: true,
      bloomStrength: 1.15,
      bloomRadius: 0.55,
      bloomThreshold: 0.18,
      raysEnabled: false,
      anamorphicEnabled: false, // Explicitly default OFF
      chromaticAberration: 0.006,
      vignetteBoost: 1.08,
      vignetteReduction: 0.72,
      noiseIntensity: 0.012,
      exposure: 1.15
    });
    postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);

    // --- PROCEDURAL HIGH-DYNAMIC HDR ENVIRONMENT MAP ---
    function setupEnvironment() {
      const pmremGenerator = new THREE.PMREMGenerator(renderer);
      pmremGenerator.compileEquirectangularShader();

      const envCanvas = document.createElement('canvas');
      envCanvas.width = 1024;
      envCanvas.height = 512;
      const ctx = envCanvas.getContext('2d');

      // Gradient background
      const bgGrad = ctx.createLinearGradient(0, 0, 0, 512);
      bgGrad.addColorStop(0.0, '#101625');
      bgGrad.addColorStop(0.5, '#070b13');
      bgGrad.addColorStop(1.0, '#020306');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, 1024, 512);

      // Studio key softbox 1
      const g1 = ctx.createRadialGradient(280, 160, 0, 280, 160, 240);
      g1.addColorStop(0.0, 'rgba(255, 255, 255, 1.0)');
      g1.addColorStop(0.25, 'rgba(255, 240, 210, 0.7)');
      g1.addColorStop(0.7, 'rgba(255, 210, 160, 0.15)');
      g1.addColorStop(1.0, 'rgba(255, 200, 140, 0.0)');
      ctx.fillStyle = g1;
      ctx.beginPath();
      ctx.arc(280, 160, 240, 0, Math.PI * 2);
      ctx.fill();

      // Studio rim softbox 2
      const g2 = ctx.createRadialGradient(820, 220, 0, 820, 220, 220);
      g2.addColorStop(0.0, 'rgba(220, 240, 255, 0.95)');
      g2.addColorStop(0.3, 'rgba(170, 210, 255, 0.5)');
      g2.addColorStop(0.7, 'rgba(120, 180, 255, 0.12)');
      g2.addColorStop(1.0, 'rgba(90, 150, 255, 0.0)');
      ctx.fillStyle = g2;
      ctx.beginPath();
      ctx.arc(820, 220, 220, 0, Math.PI * 2);
      ctx.fill();

      // Overhead soft strip
      const g3 = ctx.createLinearGradient(0, 0, 0, 90);
      g3.addColorStop(0, 'rgba(255, 255, 255, 0.85)');
      g3.addColorStop(1, 'rgba(255, 255, 255, 0)');
      ctx.fillStyle = g3;
      ctx.fillRect(0, 0, 1024, 90);

      const envTexture = new THREE.CanvasTexture(envCanvas);
      envTexture.mapping = THREE.EquirectangularReflectionMapping;
      const envRenderTarget = pmremGenerator.fromEquirectangular(envTexture);
      scene.environment = envRenderTarget.texture;

      pmremGenerator.dispose();
      envTexture.dispose();
    }
    setupEnvironment();

    // --- LIGHTS ---
    const keyLight = new THREE.DirectionalLight(params.keyLightColor, params.keyLightIntensity);
    keyLight.position.set(7, 9, 8);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(params.fillLightColor, params.fillLightIntensity);
    fillLight.position.set(-8, -4, -6);
    scene.add(fillLight);

    const rimLight = new THREE.PointLight(params.rimLightColor, params.rimLightIntensity, 28, 1.5);
    rimLight.position.set(0, 6, -8);
    scene.add(rimLight);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.55);
    scene.add(ambientLight);

    // --- SHARED MATERIALS ---
    // Frosted Glass Outer Shell:
    // Using MeshPhysicalMaterial with high transmission, satin roughness, glossy clearcoat and depthWrite: false
    // so multiple overlapping spheres blend seamlessly without occlusion voids or opaque plastic clipping!
    const glassMaterial = new THREE.MeshPhysicalMaterial({
      color: new THREE.Color(params.glassColor),
      metalness: 0.04,
      roughness: params.glassRoughness,
      transmission: params.glassTransmission,
      thickness: 1.2,
      ior: params.glassIor,
      transparent: true,
      opacity: params.glassOpacity,
      specularIntensity: 1.0,
      specularColor: new THREE.Color(0xffffff),
      clearcoat: 1.0,
      clearcoatRoughness: 0.06,
      envMapIntensity: 2.2,
      side: THREE.FrontSide,
      depthWrite: false
    });

    // Thin Metallic Gold Rings Material
    const ringMaterial = new THREE.MeshStandardMaterial({
      color: new THREE.Color(params.ringColor),
      metalness: params.ringMetalness,
      roughness: params.ringRoughness,
      envMapIntensity: 2.5
    });

    // Metallic Cap & Loop Material
    const capMaterial = new THREE.MeshStandardMaterial({
      color: new THREE.Color(params.capColor),
      metalness: 0.95,
      roughness: 0.16,
      envMapIntensity: 2.0
    });

    // Helper: Shared Sphere Geometries
    const sphereGeomCache = new Map();
    function getSphereGeometry(radius) {
      const key = radius.toFixed(3);
      if (!sphereGeomCache.has(key)) {
        sphereGeomCache.set(key, new THREE.SphereGeometry(radius, 64, 48));
      }
      return sphereGeomCache.get(key);
    }

    // --- VOLUMETRIC FROST GLOW SHADER MATERIAL (CREATES SOFT SCATTERED FROSTED HAZE) ---
    function createInnerFrostMaterial(coreColor) {
      return new THREE.ShaderMaterial({
        uniforms: {
          glowColor: { value: new THREE.Color(coreColor) },
          fresnelPow: { value: 1.9 },
          intensity: { value: 0.55 }
        },
        vertexShader: `
          varying vec3 vNormal;
          varying vec3 vViewPosition;
          void main() {
            vNormal = normalize(normalMatrix * normal);
            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
            vViewPosition = -mvPosition.xyz;
            gl_Position = projectionMatrix * mvPosition;
          }
        `,
        fragmentShader: `
          uniform vec3 glowColor;
          uniform float fresnelPow;
          uniform float intensity;
          varying vec3 vNormal;
          varying vec3 vViewPosition;
          void main() {
            float lenN = length(vNormal);
            vec3 normal = lenN > 0.0001 ? vNormal / lenN : vec3(0.0, 1.0, 0.0);
            float lenV = length(vViewPosition);
            vec3 viewDir = lenV > 0.0001 ? vViewPosition / lenV : vec3(0.0, 0.0, 1.0);
            float d = clamp(dot(normal, viewDir), 0.0, 1.0);
            float fresnel = pow(clamp(1.0 - d, 0.0, 1.0), max(0.1, fresnelPow));
            gl_FragColor = vec4(glowColor, clamp(fresnel * intensity, 0.0, 1.0));
          }
        `,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        depthTest: true,
        side: THREE.FrontSide
      });
    }

    // --- ORNAMENTS SETUP: CAREFULLY SPACED CONSTELLATION TO ELIMINATE COLLISION / OVERLAPS ---
    // Guaranteed non-intersecting coordinates & ring bounds
    const ornamentsData = [
      {
        baseX: 0.0, baseY: 0.25, baseZ: 0.0,
        radius: 1.5,
        innerColorIdx: 1,
        rings: [
          { radius: 2.05, tiltX: 0.35, tiltY: 0.2, tiltZ: 0.1, speedX: 0.003, speedY: 0.005, speedZ: 0.002 },
          { radius: 2.3, tiltX: -0.45, tiltY: 0.5, tiltZ: -0.2, speedX: -0.004, speedY: 0.003, speedZ: -0.003 }
        ],
        phase: 0.0,
        floatFreq: 0.7
      },
      {
        baseX: 3.3, baseY: 1.8, baseZ: 0.3,
        radius: 1.1,
        innerColorIdx: 2,
        rings: [
          { radius: 1.52, tiltX: -0.3, tiltY: 0.6, tiltZ: 0.4, speedX: -0.003, speedY: 0.006, speedZ: 0.002 }
        ],
        phase: 3.2,
        floatFreq: 0.75
      },
      {
        baseX: -3.5, baseY: 0.9, baseZ: -0.5,
        radius: 1.18,
        innerColorIdx: 2,
        rings: [
          { radius: 1.62, tiltX: 0.6, tiltY: -0.4, tiltZ: 0.3, speedX: 0.005, speedY: -0.004, speedZ: 0.003 }
        ],
        phase: 1.8,
        floatFreq: 0.85
      },
      {
        baseX: 2.3, baseY: -2.3, baseZ: 1.4,
        radius: 0.92,
        innerColorIdx: 1,
        rings: [
          { radius: 1.35, tiltX: 0.8, tiltY: 0.2, tiltZ: -0.3, speedX: 0.006, speedY: 0.004, speedZ: -0.002 }
        ],
        phase: 4.5,
        floatFreq: 0.9
      },
      {
        baseX: -2.4, baseY: -2.1, baseZ: -1.3,
        radius: 1.0,
        innerColorIdx: 2,
        rings: [
          { radius: 1.42, tiltX: -0.5, tiltY: -0.6, tiltZ: 0.2, speedX: -0.005, speedY: -0.004, speedZ: 0.005 }
        ],
        phase: 2.5,
        floatFreq: 0.8
      },
      {
        baseX: -1.3, baseY: 3.2, baseZ: 0.9,
        radius: 0.75,
        innerColorIdx: 1,
        rings: [
          { radius: 1.12, tiltX: 0.4, tiltY: 0.7, tiltZ: -0.4, speedX: 0.007, speedY: -0.005, speedZ: 0.003 }
        ],
        phase: 5.4,
        floatFreq: 1.05
      },
      {
        baseX: 2.7, baseY: -0.7, baseZ: -2.8,
        radius: 0.85,
        innerColorIdx: 2,
        rings: [
          { radius: 1.25, tiltX: -0.7, tiltY: 0.3, tiltZ: 0.6, speedX: -0.004, speedY: 0.005, speedZ: -0.003 }
        ],
        phase: 1.1,
        floatFreq: 0.95
      }
    ];

    const ornamentsGroup = new THREE.Group();
    scene.add(ornamentsGroup);

    const ornamentObjects = [];

    ornamentsData.forEach((data, index) => {
      const group = new THREE.Group();
      group.position.set(data.baseX, data.baseY, data.baseZ);

      const coreColor = data.innerColorIdx === 1 ? params.innerGlow1 : params.innerGlow2;

      // 1. Soft Inner Neon Core (Opaque emissive sphere with depthWrite: true so it draws before transmission)
      const coreMaterial = new THREE.MeshStandardMaterial({
        color: new THREE.Color(coreColor),
        emissive: new THREE.Color(coreColor),
        emissiveIntensity: 3.8,
        roughness: 0.18,
        metalness: 0.0
      });
      const coreGeom = new THREE.SphereGeometry(data.radius * params.innerCoreScale, 32, 24);
      const coreMesh = new THREE.Mesh(coreGeom, coreMaterial);
      coreMesh.renderOrder = 0;
      group.add(coreMesh);

      // Inner Point Light illuminating the inner frosting
      const pointLight = new THREE.PointLight(
        coreColor,
        params.innerLightIntensity,
        params.innerLightDistance,
        1.8
      );
      group.add(pointLight);

      // 2. Volumetric Frost Glow Layer (diffuse inner scattering)
      const innerFrostMat = createInnerFrostMaterial(coreColor);
      const innerFrostMesh = new THREE.Mesh(getSphereGeometry(data.radius * 0.96), innerFrostMat);
      innerFrostMesh.renderOrder = 1;
      group.add(innerFrostMesh);

      // 3. Frosted Glass Outer Shell (Clearcoat + satin frosted transmission)
      const sphereMesh = new THREE.Mesh(getSphereGeometry(data.radius), glassMaterial);
      sphereMesh.renderOrder = 2;
      group.add(sphereMesh);

      // 4. Minimalist Gold Cap & Hanger Ring at top
      const capGroup = new THREE.Group();
      const capNeckGeom = new THREE.CylinderGeometry(data.radius * 0.13, data.radius * 0.17, data.radius * 0.16, 32);
      const capNeck = new THREE.Mesh(capNeckGeom, capMaterial);
      capNeck.position.y = data.radius * 0.98;
      capGroup.add(capNeck);

      const loopGeom = new THREE.TorusGeometry(data.radius * 0.075, data.radius * 0.014, 16, 32);
      const loopMesh = new THREE.Mesh(loopGeom, capMaterial);
      loopMesh.position.y = data.radius * 1.11;
      capGroup.add(loopMesh);
      capGroup.renderOrder = 3;
      group.add(capGroup);

      // 5. Thin Polished Golden Rings (Ultra-fine torus profile)
      const ringObjects = [];
      data.rings.forEach(rConfig => {
        // Slim, delicate tube thickness (radius * 0.007)
        const ringGeom = new THREE.TorusGeometry(rConfig.radius, rConfig.radius * 0.0075, 24, 128);
        const ringMesh = new THREE.Mesh(ringGeom, ringMaterial);
        ringMesh.rotation.set(rConfig.tiltX, rConfig.tiltY, rConfig.tiltZ);
        ringMesh.renderOrder = 3;
        group.add(ringMesh);
        ringObjects.push({
          mesh: ringMesh,
          config: rConfig
        });
      });

      ornamentsGroup.add(group);
      ornamentObjects.push({
        group,
        data,
        sphereMesh,
        coreMesh,
        innerFrostMat,
        pointLight,
        ringObjects,
        index
      });
    });

    // --- DELICATE FLOATING ZERO-G GOLDEN STARDUST BEADS ---
    const stardustCount = 55;
    const stardustGeom = new THREE.SphereGeometry(0.04, 12, 12);
    const stardustMaterial = new THREE.MeshStandardMaterial({
      color: new THREE.Color(params.ringColor),
      metalness: 0.95,
      roughness: 0.15
    });
    const stardustMesh = new THREE.InstancedMesh(stardustGeom, stardustMaterial, stardustCount);
    const stardustDummy = new THREE.Object3D();
    const stardustPositions = [];

    for (let i = 0; i < stardustCount; i++) {
      const pos = new THREE.Vector3(
        (Math.random() - 0.5) * 16,
        (Math.random() - 0.5) * 12,
        (Math.random() - 0.5) * 14
      );
      stardustPositions.push({
        pos,
        speed: 0.2 + Math.random() * 0.4,
        phase: Math.random() * Math.PI * 2,
        scale: 0.5 + Math.random() * 0.7
      });
      stardustDummy.position.copy(pos);
      stardustDummy.scale.setScalar(stardustPositions[i].scale);
      stardustDummy.updateMatrix();
      stardustMesh.setMatrixAt(i, stardustDummy.matrix);
    }
    stardustMesh.instanceMatrix.needsUpdate = true;
    scene.add(stardustMesh);

    // --- APPLY COLOR SCHEME FUNCTION ---
    function applyColorScheme(schemeKey) {
      const scheme = COLOR_SCHEMES[schemeKey];
      if (!scheme) return;

      params.colorScheme = schemeKey;
      params.glassColor = scheme.glassColor;
      params.innerGlow1 = scheme.innerGlow1;
      params.innerGlow2 = scheme.innerGlow2;
      params.ringColor = scheme.ringColor;
      params.capColor = scheme.capColor;
      params.bgColor = scheme.bgColor;
      params.keyLightColor = scheme.keyLightColor;
      params.fillLightColor = scheme.fillLightColor;
      params.rimLightColor = scheme.rimLightColor;

      // Update materials
      glassMaterial.color.set(params.glassColor);
      ringMaterial.color.set(params.ringColor);
      capMaterial.color.set(params.capColor);
      stardustMaterial.color.set(params.ringColor);

      // Update lights
      keyLight.color.set(params.keyLightColor);
      fillLight.color.set(params.fillLightColor);
      rimLight.color.set(params.rimLightColor);

      // Update inner cores, neon lights, and frost glow
      ornamentObjects.forEach(obj => {
        const c = obj.data.innerColorIdx === 1 ? params.innerGlow1 : params.innerGlow2;
        obj.coreMesh.material.color.set(c);
        obj.coreMesh.material.emissive.set(c);
        obj.pointLight.color.set(c);
        obj.innerFrostMat.uniforms.glowColor.value.set(c);
      });

      updateBackground();
    }

    // --- UPDATE BACKGROUND (GREEN SCREEN / COLOR) ---
    function updateBackground() {
      if (params.greenscreen) {
        scene.background = new THREE.Color(0x00ff00);
        scene.fog = null;
      } else {
        scene.background = new THREE.Color(params.bgColor);
        scene.fog = new THREE.FogExp2(params.bgColor, 0.018);
      }
    }
    updateBackground();

    // --- REBUILD RENDERER FOR ANTIALIASING TOGGLE ---
    function rebuildRenderer(antialias) {
      const camPos = camera.position.clone();
      const target = controls.target.clone();

      renderer.dispose();
      renderer.domElement.remove();

      renderer = new THREE.WebGLRenderer({
        antialias: antialias,
        powerPreference: 'high-performance'
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(params.dpr);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = params.exposure;
      container.appendChild(renderer.domElement);

      controls.dispose();
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.screenSpacePanning = true;
      controls.zoomSpeed = 1.1;
      controls.panSpeed = 1.0;
      controls.minDistance = 3.0;
      controls.maxDistance = 32.0;
      controls.target.copy(target);
      camera.position.copy(camPos);

      postProcessor.renderer = renderer;
      postProcessor.setAntialias(antialias);
      postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);

      setupEnvironment();
      updateBackground();
    }

    // --- PROCEDURAL RANDOMIZER (UPON USER CLICK) ---
    // STRICT REQUIREMENT: "when I click for random scene do not shuffle or change Postprocessing settings"
    function randomizeScene() {
      // 1. Pick a random color scheme from all 21 preconfigured schemes
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      applyColorScheme(randomScheme);

      // 2. Randomize geometric parameters within collision-safe limits
      ornamentObjects.forEach(obj => {
        const d = obj.data;
        // Subtle non-overlapping jitter
        d.baseX += (Math.random() - 0.5) * 0.15;
        d.baseY += (Math.random() - 0.5) * 0.15;
        d.baseZ += (Math.random() - 0.5) * 0.15;
        d.phase = Math.random() * Math.PI * 2;
        d.floatFreq = 0.6 + Math.random() * 0.5;

        obj.ringObjects.forEach(r => {
          r.config.speedX = (Math.random() - 0.5) * 0.008;
          r.config.speedY = (Math.random() - 0.5) * 0.008;
          r.config.speedZ = (Math.random() - 0.5) * 0.006;
          r.mesh.rotation.set(
            Math.random() * Math.PI * 2,
            Math.random() * Math.PI * 2,
            Math.random() * Math.PI * 2
          );
        });
      });

      // 3. Randomize animation preset & motion
      const randomPreset = ANIMATION_PRESETS[Math.floor(Math.random() * ANIMATION_PRESETS.length)];
      params.animationPreset = randomPreset;
      params.speed = 0.7 + Math.random() * 0.8;
      params.bobAmplitude = 0.2 + Math.random() * 0.25;
      params.ringSpeed = 0.7 + Math.random() * 0.8;

      // 4. Subtle material & light tweaks
      params.innerLightIntensity = 2.8 + Math.random() * 1.5;
      params.glassRoughness = 0.22 + Math.random() * 0.14;
      glassMaterial.roughness = params.glassRoughness;

      // NOTE: Postprocessing settings are strictly untouched!
      updateSceneGuiDisplay();
    }

    // --- USER INTERACTION (CLICK VS DRAG DETECTION) ---
    let pointerDownPos = { x: 0, y: 0, time: 0 };
    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.lil-gui')) return;
      pointerDownPos = { x: e.clientX, y: e.clientY, time: performance.now() };
    });

    window.addEventListener('pointerup', (e) => {
      if (e.target.closest('.lil-gui')) return;
      const dx = e.clientX - pointerDownPos.x;
      const dy = e.clientY - pointerDownPos.y;
      const dt = performance.now() - pointerDownPos.time;
      if (Math.hypot(dx, dy) < 6 && dt < 320) {
        if (params.clickRandomize) {
          randomizeScene();
        }
      }
    });

    // --- H KEY TO TOGGLE ALL UI ---
    window.addEventListener('keydown', (e) => {
      if (e.code === 'KeyH') {
        if (gui._hidden) {
          gui.show();
        } else {
          gui.hide();
        }
      }
    });

    // --- LIL-GUI INITIALIZATION ---
    const gui = new GUI({ title: 'Frosted Glass Ornaments' });

    // Scene folders
    const colorFolder = gui.addFolder('Color Schemes & Palette');
    colorFolder.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES))
      .name('Preset Scheme')
      .onChange(val => {
        applyColorScheme(val);
        updateSceneGuiDisplay();
      });

    colorFolder.add(params, 'greenscreen')
      .name('Green Screen (#00ff00)')
      .onChange(() => updateBackground());

    colorFolder.addColor(params, 'glassColor').name('Glass Tint').onChange(v => glassMaterial.color.set(v));
    colorFolder.addColor(params, 'innerGlow1').name('Inner Neon 1').onChange(v => {
      ornamentObjects.forEach(obj => {
        if (obj.data.innerColorIdx === 1) {
          obj.coreMesh.material.color.set(v);
          obj.coreMesh.material.emissive.set(v);
          obj.pointLight.color.set(v);
          obj.innerFrostMat.uniforms.glowColor.value.set(v);
        }
      });
    });
    colorFolder.addColor(params, 'innerGlow2').name('Inner Neon 2').onChange(v => {
      ornamentObjects.forEach(obj => {
        if (obj.data.innerColorIdx === 2) {
          obj.coreMesh.material.color.set(v);
          obj.coreMesh.material.emissive.set(v);
          obj.pointLight.color.set(v);
          obj.innerFrostMat.uniforms.glowColor.value.set(v);
        }
      });
    });
    colorFolder.addColor(params, 'ringColor').name('Gold Rings').onChange(v => {
      ringMaterial.color.set(v);
      stardustMaterial.color.set(v);
    });
    colorFolder.addColor(params, 'capColor').name('Ornament Cap').onChange(v => capMaterial.color.set(v));
    colorFolder.addColor(params, 'bgColor').name('Background Color').onChange(v => updateBackground());

    // Animation & Motion folder
    const animFolder = gui.addFolder('Animation & Zero-G Motion');
    animFolder.add(params, 'animationPreset', ANIMATION_PRESETS).name('Animation Mode');
    animFolder.add(params, 'speed', 0.0, 3.0, 0.05).name('Animation Speed');
    animFolder.add(params, 'bobAmplitude', 0.0, 1.0, 0.02).name('Float Amplitude');
    animFolder.add(params, 'ringSpeed', 0.0, 3.0, 0.05).name('Ring Spin Speed');

    // Lighting & Exposure folder
    const lightFolder = gui.addFolder('Lighting & Exposure');
    lightFolder.add(params, 'exposure', 0.1, 3.0, 0.05).name('Scene Exposure').onChange(v => {
      renderer.toneMappingExposure = v;
      postProcessor.settings.exposure = v;
      postProcessor.updateSettings();
    });
    lightFolder.add(params, 'keyLightIntensity', 0.0, 6.0, 0.1).name('Key Intensity').onChange(v => keyLight.intensity = v);
    lightFolder.addColor(params, 'keyLightColor').name('Key Color').onChange(v => keyLight.color.set(v));
    lightFolder.add(params, 'fillLightIntensity', 0.0, 5.0, 0.1).name('Fill Intensity').onChange(v => fillLight.intensity = v);
    lightFolder.addColor(params, 'fillLightColor').name('Fill Color').onChange(v => fillLight.color.set(v));
    lightFolder.add(params, 'rimLightIntensity', 0.0, 6.0, 0.1).name('Rim Intensity').onChange(v => rimLight.intensity = v);
    lightFolder.addColor(params, 'rimLightColor').name('Rim Color').onChange(v => rimLight.color.set(v));
    lightFolder.add(params, 'innerLightIntensity', 0.0, 8.0, 0.1).name('Inner Neon Glow').onChange(v => {
      ornamentObjects.forEach(o => o.pointLight.intensity = v);
    });
    lightFolder.add(params, 'innerLightDistance', 1.0, 15.0, 0.5).name('Inner Glow Radius').onChange(v => {
      ornamentObjects.forEach(o => o.pointLight.distance = v);
    });

    // Frosted Glass Material folder
    const matFolder = gui.addFolder('Frosted Glass Material');
    matFolder.add(params, 'glassRoughness', 0.05, 0.7, 0.01).name('Frost Roughness').onChange(v => glassMaterial.roughness = v);
    matFolder.add(params, 'glassOpacity', 0.2, 1.0, 0.02).name('Glass Opacity').onChange(v => glassMaterial.opacity = v);
    matFolder.add(params, 'glassTransmission', 0.5, 1.0, 0.01).name('Transmission').onChange(v => glassMaterial.transmission = v);
    matFolder.add(params, 'ringMetalness', 0.5, 1.0, 0.01).name('Ring Metalness').onChange(v => ringMaterial.metalness = v);
    matFolder.add(params, 'ringRoughness', 0.0, 0.5, 0.01).name('Ring Roughness').onChange(v => ringMaterial.roughness = v);

    // Scene & Engine settings folder
    const sceneFolder = gui.addFolder('Scene & System');
    sceneFolder.add(params, 'clickRandomize').name('Click to Randomize');
    sceneFolder.add({ randomize: () => randomizeScene() }, 'randomize').name('🎲 Randomize Now');
    sceneFolder.add(params, 'antialias').name('Antialiasing').onChange(v => rebuildRenderer(v));
    sceneFolder.add(params, 'dpr', 0.5, 3.0, 0.1).name('Pixel Ratio (DPR)').onChange(v => {
      renderer.setPixelRatio(v);
      postProcessor.setSize(window.innerWidth, window.innerHeight, v);
    });

    // ATTACH POST PROCESSOR GUI FOLDER
    const postGuiFolder = postProcessor.attachGUI(gui, "Post-Processing Suite");

    // Function to update only scene controllers without overwriting postprocessing settings
    function updateSceneGuiDisplay() {
      [colorFolder, animFolder, lightFolder, matFolder, sceneFolder].forEach(folder => {
        folder.controllers.forEach(c => c.updateDisplay());
      });
    }

    // --- ANIMATION LOOP ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const elapsed = clock.getElapsedTime();
      const time = elapsed * params.speed;

      // Handle 8 distinct animation modes
      switch (params.animationPreset) {
        case 'Zero-G Drift':
          controls.autoRotate = false;
          ornamentObjects.forEach(obj => {
            const d = obj.data;
            const bobY = Math.sin(time * d.floatFreq + d.phase) * (params.bobAmplitude * 0.35) +
                         Math.cos(time * d.floatFreq * 0.6 + d.phase) * (params.bobAmplitude * 0.12);
            const driftX = Math.cos(time * 0.4 + d.phase) * (params.bobAmplitude * 0.18);
            const driftZ = Math.sin(time * 0.35 + d.phase) * (params.bobAmplitude * 0.18);

            obj.group.position.set(d.baseX + driftX, d.baseY + bobY, d.baseZ + driftZ);
            obj.group.rotation.y += 0.002 * params.speed;
            obj.group.rotation.z = Math.sin(time * 0.3 + d.phase) * 0.04;

            const breath = 1.0 + Math.sin(time * 1.2 + d.phase) * 0.12;
            obj.coreMesh.scale.setScalar(breath);
          });
          break;

        case 'Gentle Orbit':
          controls.autoRotate = true;
          controls.autoRotateSpeed = 0.7 * params.speed;
          ornamentObjects.forEach(obj => {
            const d = obj.data;
            const bobY = Math.sin(time * d.floatFreq + d.phase) * (params.bobAmplitude * 0.2);
            obj.group.position.set(d.baseX, d.baseY + bobY, d.baseZ);
            obj.group.rotation.y += 0.001 * params.speed;
          });
          break;

        case 'Breathing Pulse':
          controls.autoRotate = false;
          const pulse = Math.sin(time * 0.7) * 0.16;
          ornamentObjects.forEach(obj => {
            const d = obj.data;
            obj.group.position.set(
              d.baseX * (1.0 + pulse),
              d.baseY * (1.0 + pulse * 0.6),
              d.baseZ * (1.0 + pulse)
            );
            const corePulse = 1.0 + Math.sin(time * 1.4 + d.phase) * 0.2;
            obj.coreMesh.scale.setScalar(corePulse);
            obj.pointLight.intensity = params.innerLightIntensity * (1.0 + Math.sin(time * 1.4 + d.phase) * 0.3);
          });
          break;

        case 'Celestial Spiral':
          controls.autoRotate = false;
          ornamentObjects.forEach((obj, idx) => {
            const d = obj.data;
            const spiralAngle = time * 0.45 + idx * ((Math.PI * 2) / ornamentObjects.length);
            const spiralY = Math.sin(time * 0.6 + idx * 0.9) * (params.bobAmplitude * 0.45);
            const spiralX = Math.cos(spiralAngle) * 0.2;
            const spiralZ = Math.sin(spiralAngle) * 0.2;

            obj.group.position.set(d.baseX + spiralX, d.baseY + spiralY, d.baseZ + spiralZ);
            obj.group.rotation.y = spiralAngle * 0.25;
          });
          break;

        case 'Harmonic Pendulum':
          controls.autoRotate = false;
          ornamentObjects.forEach((obj, idx) => {
            const d = obj.data;
            const swing = Math.sin(time * 0.75 + idx * 1.1) * (params.bobAmplitude * 0.32);
            obj.group.position.set(d.baseX + swing, d.baseY - Math.abs(swing) * 0.1, d.baseZ);
            obj.group.rotation.z = -swing * 0.2;
          });
          break;

        case 'Zen Float':
          controls.autoRotate = false;
          ornamentObjects.forEach(obj => {
            const d = obj.data;
            const microY = Math.sin(time * 0.25 + d.phase) * 0.06;
            const microX = Math.cos(time * 0.2 + d.phase) * 0.04;
            obj.group.position.set(d.baseX + microX, d.baseY + microY, d.baseZ);
          });
          break;

        case 'Golden Rings Spin':
          controls.autoRotate = false;
          ornamentObjects.forEach(obj => {
            const d = obj.data;
            const subtleY = Math.sin(time * 0.35 + d.phase) * 0.06;
            obj.group.position.set(d.baseX, d.baseY + subtleY, d.baseZ);
          });
          break;

        case 'Static (No Camera Move)':
          controls.autoRotate = false;
          ornamentObjects.forEach(obj => {
            const d = obj.data;
            const subtleBob = Math.sin(time * 0.4 + d.phase) * 0.04;
            obj.group.position.set(d.baseX, d.baseY + subtleBob, d.baseZ);
            const breath = 1.0 + Math.sin(time * 0.7 + d.phase) * 0.08;
            obj.coreMesh.scale.setScalar(breath);
          });
          break;
      }

      // Rotate thin gold rings in zero-gravity
      const ringMultiplier = params.animationPreset === 'Golden Rings Spin' ? 2.6 : 1.0;
      ornamentObjects.forEach(obj => {
        obj.ringObjects.forEach(r => {
          r.mesh.rotation.x += r.config.speedX * params.ringSpeed * ringMultiplier * params.speed;
          r.mesh.rotation.y += r.config.speedY * params.ringSpeed * ringMultiplier * params.speed;
          r.mesh.rotation.z += r.config.speedZ * params.ringSpeed * ringMultiplier * params.speed;
        });
      });

      // Levitating stardust gentle drift
      for (let i = 0; i < stardustCount; i++) {
        const p = stardustPositions[i];
        const curY = p.pos.y + Math.sin(time * p.speed + p.phase) * 0.22;
        stardustDummy.position.set(p.pos.x, curY, p.pos.z);
        stardustDummy.scale.setScalar(p.scale * (1.0 + Math.sin(time * 1.4 + p.phase) * 0.12));
        stardustDummy.updateMatrix();
        stardustMesh.setMatrixAt(i, stardustDummy.matrix);
      }
      stardustMesh.instanceMatrix.needsUpdate = true;

      controls.update();

      // RENDER THROUGH POST PROCESSOR
      postProcessor.renderScene(scene, camera);
    }

    animate();

    // --- RESIZE HANDLER ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);
    });
  </script>
</body>
</html>
