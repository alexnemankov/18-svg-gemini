      populateInstancedMesh(instancedMarigold, instances.marigold, 'marigold');
      populateInstancedMesh(instancedRose, instances.rose, 'rose');
      populateInstancedMesh(instancedLotus, instances.lotus, 'lotus');
      populateInstancedMesh(instancedJasmine, instances.jasmine, 'jasmine');

      // --- LAYER 9: Perimeter Traditional Clay Diyas (Oil Lamps) ---
      const diyaRadius = 17.2;
      const countDiyas = params.diyaCount;
      for (let i = 0; i < countDiyas; i++) {
        const theta = (i / countDiyas) * Math.PI * 2;
        const dx = Math.cos(theta) * diyaRadius;
        const dz = Math.sin(theta) * diyaRadius;

        const diyaObj = createDiyaLampGroup();
        diyaObj.group.position.set(dx, 0.0, dz);
        diyaObj.group.rotation.y = -theta + Math.PI;

        rangoliGroup.add(diyaObj.group);
        diyaMeshes.push(diyaObj);
        diyaFlames.push({ flame: diyaObj.flame, glow: diyaObj.glow, baseScale: 1.0 });

        const pLight = new THREE.PointLight(
          new THREE.Color(params.diyaColor),
          params.diyaIntensity * params.sceneLightIntensity,
          12,
          1.8
        );
        pLight.position.set(dx, 0.75, dz);
        scene.add(pLight);
        diyaPointLights.push(pLight);
      }

      rangoliGroup.position.set(params.objectPosX, params.objectPosY, params.objectPosZ);
      applyColorPaletteToPetals();
    }

    function populateInstancedMesh(mesh, items, typeKey) {
      const dummy = new THREE.Object3D();
      for (let i = 0; i < items.length; i++) {
        const d = items[i];
        dummy.position.set(d.x, d.y, d.z);
        dummy.rotation.set(d.rotX, d.rotY, d.rotZ);
        dummy.scale.set(d.scale, d.scale, d.scale);
        dummy.updateMatrix();
        mesh.setMatrixAt(i, dummy.matrix);

        petalDefinitions.push({
          type: typeKey,
          index: i,
          mesh: mesh,
          basePos: new THREE.Vector3(d.x, d.y, d.z),
          baseRot: new THREE.Vector3(d.rotX, d.rotY, d.rotZ),
          baseScale: d.scale,
          colorType: d.colorType,
          ringId: d.ringId,
          radialDist: d.radialDist,
          phaseOffset: Math.random() * Math.PI * 2
        });
      }
      mesh.instanceMatrix.needsUpdate = true;
    }

    // =========================================================================
    // FLOATING AIRBORNE PETALS (Breeze Motion)
    // =========================================================================
    function setupFloatingWindPetals() {
      while (floatingPetalsGroup.children.length > 0) {
        floatingPetalsGroup.remove(floatingPetalsGroup.children[0]);
      }
      floatingPetalsData = [];

      const petalGeom = createRosePetalGeometry();
      const numFloating = 70;

      const instFloating = new THREE.InstancedMesh(
        petalGeom,
        new THREE.MeshStandardMaterial({
          map: sharedPetalTexture,
          roughness: 0.4,
          metalness: 0.02,
          side: THREE.DoubleSide
        }),
        numFloating
      );
      instFloating.castShadow = true;
      instFloating.receiveShadow = false;

      const dummy = new THREE.Object3D();
      for (let i = 0; i < numFloating; i++) {
        const x = (Math.random() - 0.5) * 44;
        const z = (Math.random() - 0.5) * 44;
        const y = 0.4 + Math.random() * 3.5;
        const scale = 0.5 + Math.random() * 0.45;

        dummy.position.set(x, y, z);
        dummy.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
        dummy.scale.set(scale, scale, scale);
        dummy.updateMatrix();
        instFloating.setMatrixAt(i, dummy.matrix);

        const colors = [activeColors.c1, activeColors.c3, activeColors.c4];
        const chosenCol = colors[Math.floor(Math.random() * colors.length)];
        instFloating.setColorAt(i, chosenCol);

        floatingPetalsData.push({
          pos: new THREE.Vector3(x, y, z),
          rot: new THREE.Vector3(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI),
          rotSpeed: new THREE.Vector3((Math.random() - 0.5) * 1.5, (Math.random() - 0.5) * 2.0, (Math.random() - 0.5) * 1.8),
          speed: 1.2 + Math.random() * 1.8,
          scale: scale,
          bobPhase: Math.random() * Math.PI * 2
        });
      }

      instFloating.instanceMatrix.needsUpdate = true;
      if (instFloating.instanceColor) instFloating.instanceColor.needsUpdate = true;
      floatingPetalsGroup.add(instFloating);
      floatingPetalsGroup.userData.mesh = instFloating;
    }

    // =========================================================================
    // COLOR PALETTE APPLICATION & GREENSCREEN
    // =========================================================================
    function applyColorPaletteToPetals() {
      const cMap = {
        c1: activeColors.c1,
        c2: activeColors.c2,
        c3: activeColors.c3,
        c4: activeColors.c4,
        c5: activeColors.c5
      };

      const jitter = new THREE.Color();
      for (let def of petalDefinitions) {
        const base = cMap[def.colorType] || activeColors.c1;
        // Subtle natural hue jitter so each individual flower petal feels organic
        jitter.copy(base);
        const hsl = { h: 0, s: 0, l: 0 };
        jitter.getHSL(hsl);
        hsl.l = THREE.MathUtils.clamp(hsl.l + (Math.random() - 0.5) * 0.04, 0.05, 0.95);
        jitter.setHSL(hsl.h, hsl.s, hsl.l);

        def.mesh.setColorAt(def.index, jitter);
      }

      if (instancedMarigold.instanceColor) instancedMarigold.instanceColor.needsUpdate = true;
      if (instancedRose.instanceColor) instancedRose.instanceColor.needsUpdate = true;
      if (instancedLotus.instanceColor) instancedLotus.instanceColor.needsUpdate = true;
      if (instancedJasmine.instanceColor) instancedJasmine.instanceColor.needsUpdate = true;

      // Update Diya lights & flame glow
      for (let light of diyaPointLights) {
        light.color.copy(activeColors.diya);
      }
      for (let item of diyaFlames) {
        if (item.glow && item.glow.material) {
          item.glow.material.color.copy(activeColors.diya);
        }
      }

      // Update floating airborne petals
      if (floatingPetalsGroup.userData.mesh && floatingPetalsGroup.userData.mesh.instanceColor) {
        const floatColors = [activeColors.c1, activeColors.c3, activeColors.c4];
        for (let i = 0; i < floatingPetalsData.length; i++) {
          floatingPetalsGroup.userData.mesh.setColorAt(i, floatColors[i % floatColors.length]);
        }
        floatingPetalsGroup.userData.mesh.instanceColor.needsUpdate = true;
      }

      updateBackground();
    }

    function updateBackground() {
      if (params.greenScreen) {
        renderer.setClearColor(0x00ff00, 1.0);
        scene.background = new THREE.Color(0x00ff00);
        document.body.style.backgroundColor = '#00ff00';
        if (floorMesh) {
          floorMesh.material.color.set(0x00ff00);
          floorMesh.material.map = null;
          floorMesh.material.needsUpdate = true;
        }
      } else {
        renderer.setClearColor(activeColors.bg, 1.0);
        scene.background = activeColors.bg.clone();
        document.body.style.backgroundColor = params.bgColor;
        if (floorMesh) {
          floorMesh.material.color.copy(activeColors.bg);
          floorMesh.material.needsUpdate = true;
        }
      }
    }

    function applyColorScheme(schemeName) {
      const scheme = COLOR_SCHEMES.find(s => s.name === schemeName) || COLOR_SCHEMES[0];
      params.colorScheme = scheme.name;
      params.color1 = scheme.c1;
      params.color2 = scheme.c2;
      params.color3 = scheme.c3;
      params.color4 = scheme.c4;
      params.color5 = scheme.c5;
      params.diyaColor = scheme.diya || scheme.c1;
      params.bgColor = scheme.bg;

      const targetC1 = new THREE.Color(scheme.c1);
      const targetC2 = new THREE.Color(scheme.c2);
      const targetC3 = new THREE.Color(scheme.c3);
      const targetC4 = new THREE.Color(scheme.c4);
      const targetC5 = new THREE.Color(scheme.c5);
      const targetBg = new THREE.Color(scheme.bg);
      const targetDiya = new THREE.Color(scheme.diya || scheme.c1);

      gsap.to(activeColors.c1, { r: targetC1.r, g: targetC1.g, b: targetC1.b, duration: 1.0, ease: "power2.out" });
      gsap.to(activeColors.c2, { r: targetC2.r, g: targetC2.g, b: targetC2.b, duration: 1.0, ease: "power2.out" });
      gsap.to(activeColors.c3, { r: targetC3.r, g: targetC3.g, b: targetC3.b, duration: 1.0, ease: "power2.out" });
      gsap.to(activeColors.c4, { r: targetC4.r, g: targetC4.g, b: targetC4.b, duration: 1.0, ease: "power2.out" });
      gsap.to(activeColors.c5, { r: targetC5.r, g: targetC5.g, b: targetC5.b, duration: 1.0, ease: "power2.out" });
      gsap.to(activeColors.diya, { r: targetDiya.r, g: targetDiya.g, b: targetDiya.b, duration: 1.0, ease: "power2.out" });
      gsap.to(activeColors.bg, {
        r: targetBg.r, g: targetBg.g, b: targetBg.b,
        duration: 1.0,
        ease: "power2.out",
        onUpdate: () => {
          applyColorPaletteToPetals();
        }
      });

      updateAllGui();
    }

    function onCustomColorChange() {
      activeColors.c1.set(params.color1);
      activeColors.c2.set(params.color2);
      activeColors.c3.set(params.color3);
      activeColors.c4.set(params.color4);
      activeColors.c5.set(params.color5);
      activeColors.bg.set(params.bgColor);
      activeColors.diya.set(params.diyaColor);
      applyColorPaletteToPetals();
    }

    function updateLightingSettings() {
      if (overheadLight) {
        overheadLight.intensity = params.overheadIntensity * params.sceneLightIntensity;
        overheadLight.color.set(params.overheadColor);
        overheadLight.position.y = params.overheadY;
      }
      if (ambientLight) {
        ambientLight.intensity = params.ambientIntensity * params.sceneLightIntensity;
        ambientLight.color.set(params.ambientColor);
      }
      for (let light of diyaPointLights) {
        light.intensity = params.diyaIntensity * params.sceneLightIntensity;
      }
      if (postProcessor) {
        postProcessor.settings.exposure = params.exposure;
        postProcessor.updateSettings();
      }
    }

    function rebuildRenderer(antialias) {
      const oldCanvas = renderer.domElement;
      renderer.dispose();
      if (oldCanvas && oldCanvas.parentNode) {
        oldCanvas.parentNode.removeChild(oldCanvas);
      }
      renderer = new THREE.WebGLRenderer({ antialias: antialias, powerPreference: 'high-performance' });
      renderer.setPixelRatio(params.dpr);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      updateBackground();
      container.appendChild(renderer.domElement);

      // Reconnect PostProcessor to new renderer
      postProcessor.renderer = renderer;
      postProcessor.setSize(window.innerWidth, window.innerHeight);
    }

    // =========================================================================
    // PROCEDURAL RANDOM ON CLICK (Preserving Postprocessing Settings!)
    // =========================================================================
    function triggerProceduralRandom() {
      // Pick random color palette
      const randomScheme = COLOR_SCHEMES[Math.floor(Math.random() * COLOR_SCHEMES.length)];
      applyColorScheme(randomScheme.name);

      // Randomize geometric parameters (symmetry, curl)
      const symmetries = [16, 20, 24];
      params.mandalaSymmetry = symmetries[Math.floor(Math.random() * symmetries.length)];
      params.petalCurl = parseFloat((0.8 + Math.random() * 0.5).toFixed(2));

      // Randomize animation & wind motion
      params.cameraAnimation = ANIMATION_NAMES[Math.floor(Math.random() * ANIMATION_NAMES.length)];
      params.animationSpeed = parseFloat((0.7 + Math.random() * 0.6).toFixed(2));
      params.windStrength = parseFloat((0.8 + Math.random() * 0.8).toFixed(2));
      params.windSpeed = parseFloat((0.7 + Math.random() * 0.7).toFixed(2));
      params.windAngle = parseFloat((Math.random() * Math.PI * 2).toFixed(2));

      // Randomize lighting mood
      params.exposure = parseFloat((1.05 + Math.random() * 0.35).toFixed(2));
      params.overheadIntensity = parseFloat((1.2 + Math.random() * 0.6).toFixed(2));
      params.ambientIntensity = parseFloat((0.6 + Math.random() * 0.4).toFixed(2));
      params.diyaIntensity = parseFloat((1.1 + Math.random() * 0.7).toFixed(2));

      // Rebuild Rangoli mandala geometry
      buildRangoli();
      setupFloatingWindPetals();
      updateLightingSettings();

      // Elastic bloom pulse
      gsap.fromTo(rangoliGroup.scale,
        { x: 0.94, y: 0.8, z: 0.94 },
        { x: 1.0, y: 1.0, z: 1.0, duration: 1.1, ease: "elastic.out(1, 0.6)" }
      );

      // NOTE: Strictly DO NOT touch postProcessor settings during random scene!
      updateAllGui();
    }

    // =========================================================================
    // CAMERA POSITION COMPUTATION (Orbit, Zoom & Angle Freedom)
    // =========================================================================
    function updateCameraMatrix(deltaYaw, deltaPitch, deltaDistFactor, deltaTgtX, deltaTgtZ) {
      const finalYaw = params.cameraYaw + deltaYaw;
      const finalPitch = THREE.MathUtils.clamp(params.cameraPitch + deltaPitch, 0.08, Math.PI * 0.495);
      const finalDist = (params.baseDistance / Math.max(params.zoom, 0.1)) * (1.0 + deltaDistFactor);

      const lookX = params.objectPosX + deltaTgtX;
      const lookY = params.objectPosY;
      const lookZ = params.objectPosZ + deltaTgtZ;

      camera.position.set(
        lookX + finalDist * Math.sin(finalYaw) * Math.cos(finalPitch),
        lookY + finalDist * Math.sin(finalPitch),
        lookZ + finalDist * Math.cos(finalYaw) * Math.cos(finalPitch)
      );
      camera.lookAt(lookX, lookY, lookZ);
    }

    // =========================================================================
    // MAIN ANIMATION & RENDER LOOP (Wind Flutter & Smooth Camera Motion)
    // =========================================================================
    function animate() {
      requestAnimationFrame(animate);
      render();
    }

    const dummyObj = new THREE.Object3D();

    function render() {
      const delta = clock.getDelta();
      const effectiveDelta = delta * params.animationSpeed;
      animTime += effectiveDelta;

      // 1. Eight Slow Meditative Camera Animations
      let deltaYaw = 0.0, deltaPitch = 0.0, deltaDist = 0.0, deltaTgtX = 0.0, deltaTgtZ = 0.0;

      switch (params.cameraAnimation) {
        case "Static (Top-Down Zen)":
          break;
        case "Zenith Slow Orbit":
          deltaYaw = animTime * 0.06;
          break;
        case "Gentle Top-Down Hover":
          deltaYaw = animTime * 0.03;
          deltaPitch = Math.sin(animTime * 0.15) * 0.045;
          deltaDist = Math.cos(animTime * 0.18) * 0.04;
          break;
        case "Diya Rim Glide":
          deltaYaw = animTime * 0.08;
          deltaPitch = -0.52 + Math.sin(animTime * 0.12) * 0.08;
          deltaDist = -0.12;
          break;
        case "Breathing Lotus Sway":
          deltaYaw = Math.cos(animTime * 0.1) * 0.2;
          deltaPitch = Math.sin(animTime * 0.18) * 0.1;
          deltaDist = Math.sin(animTime * 0.14) * 0.06;
          break;
        case "Meditative Figure-8":
          deltaTgtX = Math.sin(animTime * 0.1) * 2.2;
          deltaTgtZ = Math.sin(animTime * 0.2) * 1.4;
          deltaYaw = Math.sin(animTime * 0.1) * 0.14;
          break;
        case "Mandala Ripple Drift":
          deltaTgtX = Math.sin(animTime * 0.08) * 2.6;
          deltaTgtZ = Math.cos(animTime * 0.08) * 2.6;
          deltaYaw = animTime * 0.04;
          break;
        case "Spiral Ascension":
          deltaYaw = animTime * 0.07;
          deltaDist = Math.sin(animTime * 0.12) * 0.15;
          deltaPitch = Math.cos(animTime * 0.12) * 0.09;
          break;
      }

      updateCameraMatrix(deltaYaw, deltaPitch, deltaDist, deltaTgtX, deltaTgtZ);

      // 2. Wind Flutter on Petals ("add some petals movement like on wind")
      if (params.windEnabled && params.windStrength > 0.01) {
        const windX = Math.cos(params.windAngle);
        const windZ = Math.sin(params.windAngle);
        const wTime = animTime * 2.5 * params.windSpeed;
        const wStr = params.windStrength;

        // Animate each petal according to traveling wind wave
        for (let i = 0; i < petalDefinitions.length; i++) {
          const p = petalDefinitions[i];
          const dot = p.basePos.x * windX + p.basePos.z * windZ;
          const wave = Math.sin(dot * 0.32 - wTime);
          const gust = Math.max(0, wave) * 0.7 + Math.sin(dot * 1.1 - wTime * 2.2 + p.phaseOffset) * 0.3;

          // Outer petals catch more breeze than tightly packed core
          const flex = Math.min(1.2, 0.15 + (p.radialDist / 16.0) * 1.1);
          const flutterAngle = gust * 0.16 * wStr * flex;
          const lift = Math.max(0, gust) * 0.08 * wStr * flex;

          dummyObj.position.set(p.basePos.x, p.basePos.y + lift, p.basePos.z);
          dummyObj.rotation.set(
            p.baseRot.x - flutterAngle,
            p.baseRot.y,
            p.baseRot.z + flutterAngle * 0.4
          );
          dummyObj.scale.set(p.baseScale, p.baseScale, p.baseScale);
          dummyObj.updateMatrix();

          p.mesh.setMatrixAt(p.index, dummyObj.matrix);
        }

        if (instancedMarigold) instancedMarigold.instanceMatrix.needsUpdate = true;
        if (instancedRose) instancedRose.instanceMatrix.needsUpdate = true;
        if (instancedLotus) instancedLotus.instanceMatrix.needsUpdate = true;
        if (instancedJasmine) instancedJasmine.instanceMatrix.needsUpdate = true;
      }

      // 3. Floating Airborne Wind Petals
      if (params.floatingPetals && floatingPetalsGroup.userData.mesh) {
        const fMesh = floatingPetalsGroup.userData.mesh;
        const windX = Math.cos(params.windAngle);
        const windZ = Math.sin(params.windAngle);
        const dt = effectiveDelta;

        for (let i = 0; i < floatingPetalsData.length; i++) {
          const pt = floatingPetalsData[i];
          pt.pos.x += windX * pt.speed * dt * 2.2 * params.windSpeed;
          pt.pos.z += windZ * pt.speed * dt * 2.2 * params.windSpeed;
          pt.pos.y = 0.5 + Math.sin(animTime * 1.8 + pt.bobPhase) * 0.35 + 0.8;

          pt.rot.x += pt.rotSpeed.x * dt;
          pt.rot.y += pt.rotSpeed.y * dt;
          pt.rot.z += pt.rotSpeed.z * dt;

          // Wrap around boundary
          if (pt.pos.x > 26) pt.pos.x = -26;
          if (pt.pos.x < -26) pt.pos.x = 26;
          if (pt.pos.z > 26) pt.pos.z = -26;
          if (pt.pos.z < -26) pt.pos.z = 26;

          dummyObj.position.copy(pt.pos);
          dummyObj.rotation.set(pt.rot.x, pt.rot.y, pt.rot.z);
          dummyObj.scale.set(pt.scale, pt.scale, pt.scale);
          dummyObj.updateMatrix();

          fMesh.setMatrixAt(i, dummyObj.matrix);
        }
        fMesh.instanceMatrix.needsUpdate = true;
      }

      // 4. Diya Flames Flickering
      const fTime = animTime * params.diyaFlickerSpeed;
      const fAmt = params.diyaFlicker;
      for (let i = 0; i < diyaFlames.length; i++) {
        const item = diyaFlames[i];
        const noise = (
          Math.sin(fTime + i * 1.6) * 0.42 +
          Math.cos(fTime * 1.7 + i * 2.4) * 0.35 +
          Math.sin(fTime * 3.3 + i * 0.8) * 0.23
        );
        const flScale = 1.0 + noise * fAmt;
        item.flame.scale.set(flScale, flScale * (1.0 + noise * 0.25), flScale);

        if (diyaPointLights[i]) {
          diyaPointLights[i].intensity = (params.diyaIntensity * params.sceneLightIntensity) * (1.0 + noise * fAmt * 0.7);
        }
      }

      // 5. Render Scene via PostProcessor Pipeline
      postProcessor.renderScene(scene, camera);
    }

    // =========================================================================
    // POINTER & TOUCH INTERACTIONS (Zoom, Object Drag, Orbit Angle Freedom)
    // =========================================================================
    function onPointerDown(e) {
      if (e.target.closest && e.target.closest('.lil-gui')) return;
      isPointerDown = true;
      activePointerButton = e.button;
      pointerStartX = e.clientX;
      pointerStartY = e.clientY;
      pointerLastX = e.clientX;
      pointerLastY = e.clientY;
      pointerDownTime = performance.now();
      pointerHasMoved = false;
    }

    function onPointerMove(e) {
      if (!isPointerDown) return;
      const dx = e.clientX - pointerLastX;
      const dy = e.clientY - pointerLastY;
      pointerLastX = e.clientX;
      pointerLastY = e.clientY;

      if (Math.hypot(e.clientX - pointerStartX, e.clientY - pointerStartY) > 5) {
        pointerHasMoved = true;
      }

      const isDragObject = (activePointerButton === 0 && params.dragMode === "Drag Object") ||
                           (activePointerButton === 2 && params.dragMode === "Rotate Camera");

      if (isDragObject) {
        // Drag object across screen in camera plane
        const dist = params.baseDistance / Math.max(params.zoom, 0.1);
        const factor = dist * 0.0015;
        const curYaw = params.cameraYaw;
        const sinY = Math.sin(curYaw);
        const cosY = Math.cos(curYaw);

        params.objectPosX += (dx * cosY - dy * sinY) * factor;
        params.objectPosZ += (-dx * sinY - dy * cosY) * factor;

        rangoliGroup.position.set(params.objectPosX, params.objectPosY, params.objectPosZ);
        floatingPetalsGroup.position.set(params.objectPosX, params.objectPosY, params.objectPosZ);

        if (controllers.objectPosX) controllers.objectPosX.updateDisplay();
        if (controllers.objectPosZ) controllers.objectPosZ.updateDisplay();
      } else {
        // Rotate Camera Angle freely during orbit animation
        params.cameraYaw += dx * 0.0055;
        params.cameraPitch = THREE.MathUtils.clamp(params.cameraPitch + dy * 0.0045, 0.08, Math.PI * 0.495);
        if (controllers.cameraYaw) controllers.cameraYaw.updateDisplay();
        if (controllers.cameraPitch) controllers.cameraPitch.updateDisplay();
      }
    }

    function onPointerUp(e) {
      if (!isPointerDown) return;
      isPointerDown = false;

      // Click detected (short click without drag)
      if (!pointerHasMoved && (performance.now() - pointerDownTime < 320)) {
        if (params.randomOnClick) {
          triggerProceduralRandom();
        }
      }
    }

    function onWheel(e) {
      e.preventDefault();
      const zoomFactor = 1.0 - Math.sign(e.deltaY) * 0.085;
      params.zoom = THREE.MathUtils.clamp(params.zoom * zoomFactor, 0.15, 6.0);
      if (controllers.zoom) controllers.zoom.updateDisplay();
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      if (postProcessor) {
        postProcessor.setSize(window.innerWidth, window.innerHeight);
      }
    }

    function onKeyDown(e) {
      if (e.key === 'h' || e.key === 'H') {
        gui.show(gui._hidden);
      }
    }

    function updateAllGui() {
      for (const key in controllers) {
        if (controllers[key] && typeof controllers[key].updateDisplay === 'function') {
          controllers[key].updateDisplay();
        }
      }
    }

    // =========================================================================
    // LIL-GUI CONTROL PANEL (Preserving default UI style)
    // =========================================================================
    function initGUI() {
      gui = new GUI({ title: 'Flower Petal Rangoli' });

      // Display & Canvas
      const fDisplay = gui.addFolder('Display & View');
      controllers.greenScreen = fDisplay.add(params, 'greenScreen').name('Green Screen (#00ff00)').onChange(updateBackground);
      controllers.bgColor = fDisplay.addColor(params, 'bgColor').name('Background Color').onChange(onCustomColorChange);
      controllers.dpr = fDisplay.add(params, 'dpr', 0.5, 3.0, 0.25).name('Pixel Ratio (DPR)').onChange(v => {
        renderer.setPixelRatio(v);
        renderer.setSize(window.innerWidth, window.innerHeight);
        if (postProcessor) postProcessor.setSize(window.innerWidth, window.innerHeight);
      });
      controllers.antialias = fDisplay.add(params, 'antialias').name('Antialiasing').onChange(v => rebuildRenderer(v));
      controllers.randomOnClick = fDisplay.add(params, 'randomOnClick').name('Random On Click');
      fDisplay.add({ randomize: triggerProceduralRandom }, 'randomize').name('Randomize Scene Now');

      // Color Schemes (19+ Preconfigured Harmonies & Palettes)
      const fColors = gui.addFolder('Colors & Themes');
      controllers.colorScheme = fColors.add(params, 'colorScheme', COLOR_SCHEMES.map(s => s.name)).name('Color Scheme').onChange(applyColorScheme);
      controllers.color1 = fColors.addColor(params, 'color1').name('Center Saffron (C1)').onChange(onCustomColorChange);
      controllers.color2 = fColors.addColor(params, 'color2').name('Jasmine White (C2)').onChange(onCustomColorChange);
      controllers.color3 = fColors.addColor(params, 'color3').name('Lotus Petal (C3)').onChange(onCustomColorChange);
      controllers.color4 = fColors.addColor(params, 'color4').name('Rose Petal (C4)').onChange(onCustomColorChange);
      controllers.color5 = fColors.addColor(params, 'color5').name('Outer Crest (C5)').onChange(onCustomColorChange);
      controllers.diyaColor = fColors.addColor(params, 'diyaColor').name('Diya Flame Light').onChange(onCustomColorChange);

      // Wind & Breeze Physics
      const fWind = gui.addFolder('Wind & Breeze');
      controllers.windEnabled = fWind.add(params, 'windEnabled').name('Enable Wind Flutter');
      controllers.windStrength = fWind.add(params, 'windStrength', 0.0, 3.0, 0.05).name('Wind Strength');
      controllers.windSpeed = fWind.add(params, 'windSpeed', 0.1, 3.0, 0.05).name('Wind Gust Speed');
      controllers.windAngle = fWind.add(params, 'windAngle', 0.0, Math.PI * 2, 0.05).name('Wind Direction');
      controllers.floatingPetals = fWind.add(params, 'floatingPetals').name('Airborne Petals Drift');

      // Camera & Animations
      const fCamera = gui.addFolder('Camera & Animation');
      controllers.cameraAnimation = fCamera.add(params, 'cameraAnimation', ANIMATION_NAMES).name('Animation Mode');
      controllers.animationSpeed = fCamera.add(params, 'animationSpeed', 0.0, 3.0, 0.05).name('Anim Speed');
      controllers.zoom = fCamera.add(params, 'zoom', 0.2, 5.0, 0.05).name('Zoom (Wheel)');
      controllers.cameraPitch = fCamera.add(params, 'cameraPitch', 0.1, 1.55, 0.01).name('Camera Pitch');
      controllers.cameraYaw = fCamera.add(params, 'cameraYaw', -Math.PI, Math.PI, 0.01).name('Camera Yaw');
      fCamera.add({
        resetCamera: () => {
          params.zoom = 1.0;
          params.cameraPitch = 1.36;
          params.cameraYaw = 0.0;
          updateAllGui();
        }
      }, 'resetCamera').name('Reset Camera');

      // Object Drag & Position
      const fObj = gui.addFolder('Object Drag & Position');
      controllers.dragMode = fObj.add(params, 'dragMode', ['Drag Object', 'Rotate Camera']).name('Left Drag Mode');
      controllers.objectPosX = fObj.add(params, 'objectPosX', -30, 30, 0.1).name('Pos X').onChange(v => {
        rangoliGroup.position.x = v;
        floatingPetalsGroup.position.x = v;
      });
      controllers.objectPosY = fObj.add(params, 'objectPosY', -10, 10, 0.1).name('Pos Y').onChange(v => {
        rangoliGroup.position.y = v;
        floatingPetalsGroup.position.y = v;
      });
      controllers.objectPosZ = fObj.add(params, 'objectPosZ', -30, 30, 0.1).name('Pos Z').onChange(v => {
        rangoliGroup.position.z = v;
        floatingPetalsGroup.position.z = v;
      });
      fObj.add({
        resetPosition: () => {
          params.objectPosX = 0;
          params.objectPosY = 0;
          params.objectPosZ = 0;
          rangoliGroup.position.set(0, 0, 0);
          floatingPetalsGroup.position.set(0, 0, 0);
          updateAllGui();
        }
      }, 'resetPosition').name('Reset Position');

      // Lighting & Exposure
      const fLight = gui.addFolder('Lighting & Exposure');
      controllers.exposure = fLight.add(params, 'exposure', 0.2, 3.0, 0.05).name('Exposure').onChange(updateLightingSettings);
      controllers.sceneLightIntensity = fLight.add(params, 'sceneLightIntensity', 0.0, 3.0, 0.05).name('Scene Light Intensity').onChange(updateLightingSettings);

      const fOverhead = fLight.addFolder('Overhead Diffuse Light');
      controllers.overheadIntensity = fOverhead.add(params, 'overheadIntensity', 0.0, 3.0, 0.05).name('Intensity').onChange(updateLightingSettings);
      controllers.overheadColor = fOverhead.addColor(params, 'overheadColor').name('Color').onChange(updateLightingSettings);
      controllers.overheadY = fOverhead.add(params, 'overheadY', 10.0, 60.0, 1.0).name('Height Y').onChange(updateLightingSettings);

      const fAmbient = fLight.addFolder('Ambient Fill Light');
      controllers.ambientIntensity = fAmbient.add(params, 'ambientIntensity', 0.0, 2.0, 0.05).name('Intensity').onChange(updateLightingSettings);
      controllers.ambientColor = fAmbient.addColor(params, 'ambientColor').name('Color').onChange(updateLightingSettings);

      const fDiya = fLight.addFolder('Diyas (Oil Lamps)');
      controllers.diyaIntensity = fDiya.add(params, 'diyaIntensity', 0.0, 3.0, 0.05).name('Lamp Intensity').onChange(updateLightingSettings);
      controllers.diyaFlicker = fDiya.add(params, 'diyaFlicker', 0.0, 1.0, 0.05).name('Flame Flicker');
      controllers.diyaFlickerSpeed = fDiya.add(params, 'diyaFlickerSpeed', 0.5, 8.0, 0.1).name('Flicker Speed');

      // PostProcessor Suite integration (One-line lil-gui integration)
      postProcessor.attachGUI(gui, "Post-Processing Suite");

      fLight.close();
      fObj.close();
    }

    // Start Application
    init();
    initGUI();
    animate();
  </script>
</body>
</html>
