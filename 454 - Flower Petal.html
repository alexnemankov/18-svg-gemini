<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Flower Petal Rangoli - Ранголи из цветочных лепестков</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1a0e08;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      cursor: grab;
      touch-action: none;
    }
    #canvas-container:active {
      cursor: grabbing;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js",
      "postprocessing/PostProcessor.js": "./postprocessing/PostProcessor.js"
    }
  }
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <script type="module">
    import * as THREE from 'three';
    import GUI from 'lil-gui';

    // =========================================================================
    // POST PROCESSOR SUITE (From postprocessing/PostProcessor.js)
    // Inlined for direct standalone file:// compatibility and cross-origin security
    // =========================================================================
    const orthoVertexShader = `
    precision highp float;
    in vec3 position;
    out vec2 vUv;
    void main() {
      vUv = position.xy * 0.5 + 0.5;
      gl_Position = vec4(position.xy, 0.0, 1.0);
    }
    `;

    const brightFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float bloomThreshold;
    in vec2 vUv;
    out vec4 fragColor;

    vec3 sanitize(vec3 v) {
      if (isnan(v.x) || isinf(v.x)) v.x = 0.0;
      if (isnan(v.y) || isinf(v.y)) v.y = 0.0;
      if (isnan(v.z) || isinf(v.z)) v.z = 0.0;
      return clamp(v, vec3(0.0), vec3(65000.0));
    }

    void main() {
      vec4 raw = texture(inputTexture, vUv);
      vec3 color = sanitize(raw.rgb);
      float luminance = max(0.0, dot(color, vec3(0.2126, 0.7152, 0.0722)));
      float knee = 0.1;
      float soft = luminance - bloomThreshold + knee;
      soft = clamp(soft, 0.0, 2.0 * knee);
      soft = (soft * soft) / (4.0 * knee + 0.00001);
      float contribution = max(soft, luminance - bloomThreshold);
      contribution /= max(luminance, 0.0001);
      vec3 result = color * contribution;
      fragColor = vec4(sanitize(result), clamp(raw.a, 0.0, 1.0));
    }
    `;

    const blur13ShaderChunk = `
    vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
      vec2 resolution = vec2(textureSize(image, 0));
      vec4 color = vec4(0.0);
      vec2 off1 = vec2(1.411764705882353) * direction;
      vec2 off2 = vec2(3.2941176470588234) * direction;
      vec2 off3 = vec2(5.176470588235294) * direction;
      color += texture(image, uv) * 0.1964825501511404;
      color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
      color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
      return color;
    }
    `;

    const blurFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 direction;
    in vec2 vUv;
    out vec4 color;
    ${blur13ShaderChunk}

    vec4 sanitize(vec4 v) {
      if (isnan(v.x) || isinf(v.x)) v.x = 0.0;
      if (isnan(v.y) || isinf(v.y)) v.y = 0.0;
      if (isnan(v.z) || isinf(v.z)) v.z = 0.0;
      if (isnan(v.w) || isinf(v.w)) v.w = 0.0;
      return clamp(v, vec4(0.0), vec4(65000.0));
    }

    void main() {
      color = sanitize(blur13(inputTexture, vUv, direction));
    }
    `;

    const godRaysDepthMaskShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float threshold;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float lum = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float factor = smoothstep(threshold, threshold + 0.15, lum);
      fragColor = vec4(vec3(factor), 1.0);
    }
    `;

    const godRaysGenerateShader = `
    precision highp float;
    #define TAPS_PER_PASS 6.0

    uniform sampler2D inputTexture;
    uniform vec3 vSunPositionScreenSpace;
    uniform float fStepSize;
    uniform float distanceAttenuation;
    uniform float maxDensity;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec2 delta = vSunPositionScreenSpace.xy - vUv;
      float dist = length(delta);
      vec2 stepv = fStepSize * delta / max(dist, 0.0001);
      float iters = dist / max(fStepSize, 0.00001);

      vec2 uv = vUv;
      float col = 0.0;
      float f = min(1.0, max(vSunPositionScreenSpace.z, 0.0));
      float atten = 1.0 / (1.0 + pow(dist, distanceAttenuation));

      if (0.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (1.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (2.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (3.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (4.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (5.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;

      float finalVal = min(col / TAPS_PER_PASS * atten, maxDensity);
      fragColor = vec4(vec3(finalVal), 1.0);
    }
    `;

    const anamorphicBrightShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float threshold;
    uniform float smoothWidth;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float v = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float alpha = smoothstep(threshold, threshold + smoothWidth, v);
      fragColor = mix(vec4(0.0), color, alpha);
    }
    `;

    const anamorphicBlurShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 resolution;
    uniform float samples;
    uniform float intensity;
    uniform vec3 tintColor;
    uniform float bloomRadius;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      int halfSamples = max(1, int(samples) / 2);
      float fHalfSamples = float(halfSamples);
      vec2 invSize = 1.0 / resolution;
      vec4 total = vec4(0.0);

      for (int i = -64; i <= 64; i++) {
        if (i < -halfSamples || i > halfSamples) continue;
        float softness = 1.0 - abs(float(i)) / fHalfSamples;
        softness = pow(softness, 2.0);
        vec2 shiftedUV = vec2(vUv.x + invSize.x * float(i) * (4.0 + bloomRadius * 8.0), vUv.y);
        shiftedUV = clamp(shiftedUV, 0.001, 0.999);
        total += texture(inputTexture, shiftedUV) * softness;
      }

      fragColor = (total / (samples / 3.0)) * vec4(tintColor, 1.0) * intensity;
    }
    `;

    const finalFragmentShader = `
    precision highp float;
    uniform vec2 resolution;
    uniform sampler2D inputTexture;
    uniform sampler2D blur0Texture;
    uniform sampler2D blur1Texture;
    uniform sampler2D blur2Texture;
    uniform sampler2D blur3Texture;
    uniform sampler2D blur4Texture;
    uniform sampler2D raysTexture;
    uniform sampler2D anamorphicTexture;
    uniform bool bloomEnabled;
    uniform bool raysEnabled;
    uniform bool anamorphicEnabled;
    uniform float bloomStrength;
    uniform float bloomRadius;
    uniform float raysStrength;
    uniform vec3 raysColor;
    uniform float vignetteBoost;
    uniform float vignetteReduction;
    uniform float time;
    in vec2 vUv;
    out vec4 fragColor;

    vec3 sanitize(vec3 v) {
      if (isnan(v.x) || isinf(v.x)) v.x = 0.0;
      if (isnan(v.y) || isinf(v.y)) v.y = 0.0;
      if (isnan(v.z) || isinf(v.z)) v.z = 0.0;
      return clamp(v, vec3(0.0), vec3(65000.0));
    }

    void main() {
      vec4 rawBase = texture(inputTexture, vUv);
      vec3 color = sanitize(rawBase.rgb);

      if (bloomEnabled) {
        vec3 b0 = sanitize(texture(blur0Texture, vUv).rgb);
        vec3 b1 = sanitize(texture(blur1Texture, vUv).rgb);
        vec3 b2 = sanitize(texture(blur2Texture, vUv).rgb);
        vec3 b3 = sanitize(texture(blur3Texture, vUv).rgb);
        vec3 b4 = sanitize(texture(blur4Texture, vUv).rgb);
        float r = clamp(bloomRadius, 0.0, 1.0);
        float w0 = 1.0 - 0.7 * r;
        float w1 = 0.8;
        float w2 = 0.6 + 0.4 * r;
        float w3 = 0.4 + 0.6 * r;
        float w4 = 0.2 + 0.8 * r;
        vec3 bloom = (b0 * w0 + b1 * w1 + b2 * w2 + b3 * w3 + b4 * w4) / (w0 + w1 + w2 + w3 + w4);
        color += bloom * bloomStrength;
      }

      if (raysEnabled) {
        vec3 rays = sanitize(texture(raysTexture, vUv).rgb);
        color += rays * raysStrength * raysColor;
      }

      if (anamorphicEnabled) {
        vec3 a = sanitize(texture(anamorphicTexture, vUv).rgb);
        color += a;
      }

      vec2 center = vUv - 0.5;
      float dist = length(center);
      float vig = 1.0 - smoothstep(vignetteBoost * 0.5, vignetteBoost * 0.5 + vignetteReduction * 0.5, dist);
      color *= clamp(vig, 0.0, 1.0);

      fragColor = vec4(sanitize(color), clamp(rawBase.a, 0.0, 1.0));
    }
    `;

    const rgbSplitFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float chromaticAberration;
    uniform float noiseIntensity;
    uniform float fisheyeStrength;
    uniform float fisheyeRadius;
    uniform int visionMode;
    uniform float thermalSensitivity;
    uniform float nightVisionGain;
    uniform float nightVisionNoise;
    uniform float crtIntensity;
    uniform float gamma;
    uniform float minInputLevel;
    uniform float maxInputLevel;
    uniform float exposure;
    uniform float time;
    in vec2 vUv;
    out vec4 fragColor;

    vec3 ACESFilmicToneMapping(vec3 x) {
      float a = 2.51;
      float b = 0.03;
      float c = 2.43;
      float d = 0.59;
      float e = 0.14;
      return clamp((x * (a * x + b)) / (x * (c * x + d) + e), 0.0, 1.0);
    }

    vec3 finalLevels(vec3 color, vec3 minIn, vec3 gammaIn, vec3 maxIn) {
      return pow(clamp((color - minIn) / max(maxIn - minIn, vec3(0.0001)), 0.0, 1.0), 1.0 / max(gammaIn, vec3(0.0001)));
    }

    float hash(vec2 p) {
      vec3 p3 = fract(vec3(p.xyx) * 0.1031);
      p3 += dot(p3, p3.yzx + 33.33);
      return fract((p3.x + p3.y) * p3.z);
    }

    void main() {
      vec2 uv = vUv;
      if (abs(fisheyeStrength) > 0.001) {
        vec2 d = uv - 0.5;
        float r = length(d) / max(fisheyeRadius, 0.001);
        float bind = (fisheyeStrength > 0.0) ? 0.7071 : 0.5;
        if (r < bind) {
          float factor = 1.0 + fisheyeStrength * (r * r);
          uv = 0.5 + d * factor;
        }
      }

      vec2 offset = (uv - 0.5) * chromaticAberration;
      float r = texture(inputTexture, uv - offset).r;
      float g = texture(inputTexture, uv).g;
      float b = texture(inputTexture, uv + offset).b;
      vec3 col = vec3(r, g, b);

      if (noiseIntensity > 0.0001) {
        float n = (hash(uv * 1234.5 + time) - 0.5) * noiseIntensity;
        col += n;
      }

      vec3 exposedColor = col * exposure;
      vec3 toneMappedColor = ACESFilmicToneMapping(exposedColor);
      vec3 finalCol = finalLevels(toneMappedColor, vec3(minInputLevel), vec3(gamma), vec3(maxInputLevel));

      fragColor = vec4(finalCol, 1.0);
    }
    `;

    const copyFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      fragColor = texture(inputTexture, vUv);
    }
    `;

    function createFBO(w, h, options = {}) {
      return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
        wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
        wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
        minFilter: options.minFilter || THREE.LinearFilter,
        magFilter: options.magFilter || THREE.LinearFilter,
        format: options.format || THREE.RGBAFormat,
        type: options.type || THREE.HalfFloatType,
        stencilBuffer: options.stencilBuffer || false,
        depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : true,
        samples: options.samples || 0,
      });
    }

    class ShaderPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbo = createFBO(1, 1, options);
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
        this.texture = this.fbo.texture;
      }
      render(renderer, toScreen = false) {
        if (!toScreen) renderer.setRenderTarget(this.fbo);
        renderer.render(this.orthoScene, this.orthoCamera);
        if (!toScreen) renderer.setRenderTarget(null);
      }
      setSize(width, height) {
        this.fbo.setSize(Math.max(1, width), Math.max(1, height));
        this.orthoQuad.scale.set(width, height, 1);
      }
    }

    class ShaderPingPongPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
        this.currentFBO = 0;
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
      }
      render(renderer) {
        renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
        renderer.render(this.orthoScene, this.orthoCamera);
        renderer.setRenderTarget(null);
        this.currentFBO = 1 - this.currentFBO;
      }
      get current() { return this.fbos[this.currentFBO]; }
      get texture() { return this.current.texture; }
      setSize(width, height) {
        const w = Math.max(1, width);
        const h = Math.max(1, height);
        this.orthoQuad.scale.set(w, h, 1);
        this.fbos[0].setSize(w, h);
        this.fbos[1].setSize(w, h);
      }
    }

    class BloomPass {
      constructor(strength = 0.8, radius = 0.5, threshold = 0.2, levels = 5) {
        this.strength = strength;
        this.radius = radius;
        this.threshold = threshold;
        this.enabled = true;
        this.levels = levels;

        this.brightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            bloomThreshold: { value: this.threshold },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: brightFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.brightPass = new ShaderPass(this.brightShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.blurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            direction: { value: new THREE.Vector2(0, 1) },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: blurFragmentShader,
          glslVersion: THREE.GLSL3,
        });

        this.blurPasses = [];
        for (let i = 0; i < this.levels; i++) {
          this.blurPasses.push(new ShaderPingPongPass(this.blurShader, {
            format: THREE.RGBAFormat,
            type: THREE.HalfFloatType,
          }));
        }
      }

      setSize(width, height) {
        let w = width;
        let h = height;
        this.brightPass.setSize(w, h);
        for (let i = 0; i < this.levels; i++) {
          w = Math.max(1, Math.floor(w / 2));
          h = Math.max(1, Math.floor(h / 2));
          this.blurPasses[i].setSize(w, h);
        }
      }

      render(renderer) {
        this.brightShader.uniforms.inputTexture.value = this.source;
        this.brightShader.uniforms.bloomThreshold.value = this.threshold;
        this.brightPass.render(renderer);

        let input = this.brightPass.texture;
        for (let i = 0; i < this.levels; i++) {
          const pass = this.blurPasses[i];
          this.blurShader.uniforms.inputTexture.value = input;
          this.blurShader.uniforms.direction.value.set(1, 0);
          pass.render(renderer);

          this.blurShader.uniforms.inputTexture.value = pass.texture;
          this.blurShader.uniforms.direction.value.set(0, 1);
          pass.render(renderer);

          input = pass.texture;
        }
      }
    }

    class PostProcessor {
      constructor(renderer, params = {}) {
        this.renderer = renderer;

        this.settings = {
          enabled: params.enabled !== undefined ? params.enabled : true,
          antialias: params.antialias !== undefined ? params.antialias : true,

          // 1. Universal 3-Param Bloom Engine
          bloomEnabled: params.bloomEnabled !== undefined ? params.bloomEnabled : true,
          bloomStrength: params.bloomStrength !== undefined ? params.bloomStrength : 0.85,
          bloomRadius: params.bloomRadius !== undefined ? params.bloomRadius : 0.65,
          bloomThreshold: params.bloomThreshold !== undefined ? params.bloomThreshold : 0.35,

          // 2. Godrays Settings
          raysEnabled: params.raysEnabled !== undefined ? params.raysEnabled : false,
          raysStrength: params.raysStrength !== undefined ? params.raysStrength : 0.5,
          raysDensity: params.raysDensity !== undefined ? params.raysDensity : 1.0,
          raysMaxDensity: params.raysMaxDensity !== undefined ? params.raysMaxDensity : 0.5,
          raysDistanceAttenuation: params.raysDistanceAttenuation !== undefined ? params.raysDistanceAttenuation : 2.0,
          raysThreshold: params.raysThreshold !== undefined ? params.raysThreshold : 0.25,
          raysColor: params.raysColor ? (params.raysColor.isColor ? params.raysColor.clone() : new THREE.Color(params.raysColor)) : new THREE.Color(0xffaa33),
          raysColorHex: params.raysColorHex || '#ffaa33',

          // 3. Three.js Anamorphic Flare Settings (Default OFF as requested!)
          anamorphicEnabled: params.anamorphicEnabled !== undefined ? params.anamorphicEnabled : false,
          anamorphicIntensity: params.anamorphicIntensity !== undefined ? params.anamorphicIntensity : 4.0,
          anamorphicThreshold: params.anamorphicThreshold !== undefined ? params.anamorphicThreshold : 0.4,
          anamorphicSamples: params.anamorphicSamples !== undefined ? params.anamorphicSamples : 64,
          anamorphicRadius: params.anamorphicRadius !== undefined ? params.anamorphicRadius : 0.0,
          anamorphicSmoothWidth: params.anamorphicSmoothWidth !== undefined ? params.anamorphicSmoothWidth : 0.05,
          anamorphicColor: params.anamorphicColor ? (params.anamorphicColor.isColor ? params.anamorphicColor.clone() : new THREE.Color(params.anamorphicColor)) : new THREE.Color(0xffa040),
          anamorphicColorHex: params.anamorphicColorHex || '#ffa040',

          // 4. Lens & Camera Optics
          fisheyeStrength: params.fisheyeStrength !== undefined ? params.fisheyeStrength : 0.0,
          fisheyeRadius: params.fisheyeRadius !== undefined ? params.fisheyeRadius : 1.0,
          chromaticAberration: params.chromaticAberration !== undefined ? params.chromaticAberration : 0.006,
          vignetteBoost: params.vignetteBoost !== undefined ? params.vignetteBoost : 1.05,
          vignetteReduction: params.vignetteReduction !== undefined ? params.vignetteReduction : 0.65,
          noiseIntensity: params.noiseIntensity !== undefined ? params.noiseIntensity : 0.012,

          // 5. Color Grading, Exposure & Tone
          gamma: params.gamma !== undefined ? params.gamma : 1.0,
          minInputLevel: params.minInputLevel !== undefined ? params.minInputLevel : 0.0,
          maxInputLevel: params.maxInputLevel !== undefined ? params.maxInputLevel : 1.0,
          exposure: params.exposure !== undefined ? params.exposure : 1.0,
        };

        const maxSamples = (this.renderer && this.renderer.capabilities) ? (this.renderer.capabilities.maxSamples || 4) : 4;
        const targetSamples = this.settings.antialias ? Math.min(4, maxSamples) : 0;
        this.sceneTarget = createFBO(1, 1, { type: THREE.HalfFloatType, samples: targetSamples, depthBuffer: true });

        this.bloomPass = new BloomPass(
          this.settings.bloomStrength,
          this.settings.bloomRadius,
          this.settings.bloomThreshold,
          5
        );

        this.moonScreenPos = new THREE.Vector3(0.5, 0.5, 1.0);

        this.godRaysMaskShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            threshold: { value: this.settings.raysThreshold },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: godRaysDepthMaskShader,
          glslVersion: THREE.GLSL3,
        });
        this.godRaysMaskPass = new ShaderPass(this.godRaysMaskShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.godRaysGenShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            vSunPositionScreenSpace: { value: this.moonScreenPos },
            fStepSize: { value: 1.0 },
            distanceAttenuation: { value: this.settings.raysDistanceAttenuation },
            maxDensity: { value: this.settings.raysMaxDensity },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: godRaysGenerateShader,
          glslVersion: THREE.GLSL3,
        });
        this.godRaysPingPong = new ShaderPingPongPass(this.godRaysGenShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.anamorphicBrightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            threshold: { value: this.settings.anamorphicThreshold },
            smoothWidth: { value: this.settings.anamorphicSmoothWidth },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: anamorphicBrightShader,
          glslVersion: THREE.GLSL3,
        });
        this.anamorphicBrightPass = new ShaderPass(this.anamorphicBrightShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.anamorphicBlurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            resolution: { value: new THREE.Vector2(1, 1) },

            intensity: { value: this.settings.anamorphicIntensity },
            tintColor: { value: this.settings.anamorphicColor },
            bloomRadius: { value: this.settings.anamorphicRadius },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: anamorphicBlurShader,
          glslVersion: THREE.GLSL3,
        });
        this.anamorphicBlurPass = new ShaderPass(this.anamorphicBlurShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.finalShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            blur0Texture: { value: null },
            blur1Texture: { value: null },
            blur2Texture: { value: null },
            blur3Texture: { value: null },
            blur4Texture: { value: null },
            raysTexture: { value: null },
            anamorphicTexture: { value: null },
            bloomEnabled: { value: this.settings.bloomEnabled },
            raysEnabled: { value: this.settings.raysEnabled },
            anamorphicEnabled: { value: this.settings.anamorphicEnabled },
            bloomStrength: { value: this.settings.bloomStrength },

            raysStrength: { value: this.settings.raysStrength },

            vignetteReduction: { value: this.settings.vignetteReduction },
            time: { value: 0 },
            resolution: { value: new THREE.Vector2(1, 1) },
          },

          fragmentShader: finalFragmentShader,

        });
        this.finalPass = new ShaderPass(this.finalShader, {

        this.rgbPass = new ShaderPass(this.rgbShader);

        this.copyShader = new THREE.RawShaderMaterial({
          uniforms: { inputTexture: { value: null } },

      updateSettings() {
        this.bloomPass.strength = this.settings.bloomStrength;
        this.bloomPass.radius = this.settings.bloomRadius;
        this.bloomPass.threshold = this.settings.bloomThreshold;
        this.bloomPass.enabled = this.settings.bloomEnabled;

        this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
        this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
        this.finalShader.uniforms.bloomRadius.value = this.settings.bloomRadius;

        this.godRaysMaskShader.uniforms.threshold.value = this.settings.raysThreshold;
        this.godRaysGenShader.uniforms.distanceAttenuation.value = this.settings.raysDistanceAttenuation;
        this.godRaysGenShader.uniforms.maxDensity.value = this.settings.raysMaxDensity;
        this.finalShader.uniforms.raysStrength.value = this.settings.raysStrength;
        this.finalShader.uniforms.raysColor.value.copy(this.settings.raysColor);
        this.finalShader.uniforms.raysEnabled.value = this.settings.raysEnabled;

        this.anamorphicBrightShader.uniforms.threshold.value = this.settings.anamorphicThreshold;
        this.anamorphicBrightShader.uniforms.smoothWidth.value = this.settings.anamorphicSmoothWidth;
        this.anamorphicBlurShader.uniforms.samples.value = this.settings.anamorphicSamples;
        this.anamorphicBlurShader.uniforms.intensity.value = this.settings.anamorphicIntensity;
        this.anamorphicBlurShader.uniforms.tintColor.value.copy(this.settings.anamorphicColor);
        this.anamorphicBlurShader.uniforms.bloomRadius.value = this.settings.anamorphicRadius;
        this.finalShader.uniforms.anamorphicEnabled.value = this.settings.anamorphicEnabled;

        this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
        this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;

        this.rgbShader.uniforms.chromaticAberration.value = this.settings.chromaticAberration;
        this.rgbShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;
        this.rgbShader.uniforms.fisheyeStrength.value = this.settings.fisheyeStrength;
        this.rgbShader.uniforms.fisheyeRadius.value = this.settings.fisheyeRadius;
        this.rgbShader.uniforms.gamma.value = this.settings.gamma;
        this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
        this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
        this.rgbShader.uniforms.exposure.value = this.settings.exposure;
      }

      setSize(width, height) {
        const w = Math.max(1, width);
        const h = Math.max(1, height);
        this.sceneTarget.setSize(w, h);
        this.bloomPass.setSize(w, h);
        this.finalPass.setSize(w, h);
        this.finalShader.uniforms.resolution.value.set(w, h);

        const rW = Math.max(1, Math.floor(w / 2));
        const rH = Math.max(1, Math.floor(h / 2));
        this.godRaysMaskPass.setSize(rW, rH);
        this.godRaysPingPong.setSize(rW, rH);

        const anW = Math.max(1, Math.floor(w / 2));
        const anH = Math.max(1, Math.floor(h / 4));
        this.anamorphicBrightPass.setSize(anW, anH);
        this.anamorphicBlurPass.setSize(anW, anH);
        this.anamorphicBlurShader.uniforms.resolution.value.set(anW, anH);

        this.rgbPass.setSize(w, h);
        this.copyPass.setSize(w, h);
      }

      renderScene(scene, camera) {
        if (!this.settings.enabled) {
          this.renderer.render(scene, camera);
          return;
        }
        this.renderer.setRenderTarget(this.sceneTarget);
        this.renderer.render(scene, camera);
        this.renderer.setRenderTarget(null);
        this.render(this.sceneTarget.texture);
      }

      render(sourceTexture) {
        this.updateSettings();

        // 1. Atmospheric Bloom
        if (this.settings.bloomEnabled) {
          this.bloomPass.source = sourceTexture;
          this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
          this.bloomPass.render(this.renderer);

          this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
          this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
          this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
          this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
          this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;
        } else {
          this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
        }

        // 2. Anamorphic Flare
        if (this.settings.anamorphicEnabled && this.settings.anamorphicIntensity > 0.001) {
          this.anamorphicBrightShader.uniforms.inputTexture.value = sourceTexture;
          this.anamorphicBrightPass.render(this.renderer);
          this.anamorphicBlurShader.uniforms.inputTexture.value = this.anamorphicBrightPass.texture;
          this.anamorphicBlurPass.render(this.renderer);
          this.finalPass.shader.uniforms.anamorphicTexture.value = this.anamorphicBlurPass.texture;
          this.finalPass.shader.uniforms.anamorphicEnabled.value = true;
        } else {
          this.finalPass.shader.uniforms.anamorphicEnabled.value = false;
        }

        const rTime = Math.random() * 10000;
        this.finalPass.shader.uniforms.time.value = rTime;
        this.rgbPass.shader.uniforms.time.value = rTime;

        this.finalPass.render(this.renderer);
        this.rgbPass.shader.uniforms.inputTexture.value = this.finalPass.texture;
        this.rgbPass.render(this.renderer, true);
      }

      attachGUI(gui, title = "Post-Processing Suite") {
        const root = gui.addFolder(title);
        root.add(this.settings, "enabled").name("Enable Post-Process");

        // Atmospheric Bloom
        const bloom = root.addFolder("Atmospheric Bloom");
        bloom.add(this.settings, "bloomEnabled").name("Enable Bloom").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomStrength", 0, 3.0, 0.05).name("Bloom Strength").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomRadius", 0, 2.0, 0.05).name("Bloom Radius").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomThreshold", 0, 1.0, 0.01).name("Bloom Threshold").onChange(() => this.updateSettings());

        // Three.js Anamorphic Flare (webgpu_postprocessing_anamorphic.html)
        const anamorphic = root.addFolder("Three.js Anamorphic Flare");
        anamorphic.add(this.settings, "anamorphicEnabled").name("Enable Anamorphic").onChange(() => this.updateSettings());
        anamorphic.add(this.settings, "anamorphicIntensity", 0, 10.0, 0.1).name("Intensity").onChange(() => this.updateSettings());
        anamorphic.add(this.settings, "anamorphicThreshold", 0.0, 0.9, 0.01).name("Threshold").onChange(() => this.updateSettings());
        anamorphic.add(this.settings, "anamorphicSamples", 2, 128, 1).name("Samples").onChange(() => this.updateSettings());
        anamorphic.addColor(this.settings, "anamorphicColorHex").name("Tint Color").onChange((v) => {
          this.settings.anamorphicColor.set(v);
          this.updateSettings();
        });

        // Lens, Optics & Film Grain
        const lens = root.addFolder("Lens & Film Grain");
        lens.add(this.settings, "chromaticAberration", 0, 0.05, 0.001).name("Chromatic Aberr.").onChange(() => this.updateSettings());
        lens.add(this.settings, "vignetteBoost", 0, 2.0, 0.05).name("Vignette Boost").onChange(() => this.updateSettings());
        lens.add(this.settings, "vignetteReduction", 0, 2.0, 0.05).name("Vignette Falloff").onChange(() => this.updateSettings());
        lens.add(this.settings, "noiseIntensity", 0, 0.06, 0.002).name("Film Grain").onChange(() => this.updateSettings());

        root.close();
        return root;
      }

    // Procedural soft velvet organic petal texture
    function createPetalTexture() {
      const cvs = document.createElement('canvas');
      cvs.width = 256;
      cvs.height = 256;
      const ctx = cvs.getContext('2d');

      // Soft vertical gradient from pale base to saturated velvety tip
      const grad = ctx.createLinearGradient(0, 256, 0, 0);
      grad.addColorStop(0, '#f2ece4');
      grad.addColorStop(0.35, '#ffffff');
      grad.addColorStop(0.85, '#ffffff');
      grad.addColorStop(1, '#ebd0c0');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 256, 256);

      // Fine organic veins radiating along petal length
      ctx.strokeStyle = 'rgba(0, 0, 0, 0.05)';
      ctx.lineWidth = 1.0;
      for (let i = -10; i <= 10; i++) {
        ctx.beginPath();
        ctx.moveTo(128, 256);
        ctx.quadraticCurveTo(128 + i * 8, 120, 128 + i * 11, 10);
        ctx.stroke();
      }

      // Micro noise for velvet feel
      const img = ctx.getImageData(0, 0, 256, 256);
      for (let k = 0; k < img.data.length; k += 4) {
        const n = (Math.random() - 0.5) * 14;
        img.data[k] = Math.max(0, Math.min(255, img.data[k] + n));
        img.data[k+1] = Math.max(0, Math.min(255, img.data[k+1] + n));
        img.data[k+2] = Math.max(0, Math.min(255, img.data[k+2] + n));
      }
      ctx.putImageData(img, 0, 0);

      const tex = new THREE.CanvasTexture(cvs);
      return tex;
    }

    // 1. Calendula / Marigold Petal (slender, fluted, longitudinally cupped)
    function createMarigoldPetalGeometry() {
      const geom = new THREE.BufferGeometry();
      const uSegs = 14, vSegs = 6;
      const positions = [], uvs = [], indices = [];

      for (let i = 0; i <= uSegs; i++) {
        const u = i / uSegs;
        const w = Math.sin(u * Math.PI * 0.92) * 0.42 * (1.0 - 0.12 * u);
        const y = u * 2.3;
        const spineZ = Math.sin(u * Math.PI * 0.85) * 0.18 + Math.pow(u, 2.0) * 0.12;

        for (let j = 0; j <= vSegs; j++) {
          const v = (j / vSegs) - 0.5;
          const x = v * w * 2.0;
          const cup = Math.abs(v) * 0.1 * (1.0 - u * 0.35);
          positions.push(x, y, spineZ - cup);
          uvs.push(j / vSegs, u);
        }
      }

      for (let i = 0; i < uSegs; i++) {
        for (let j = 0; j < vSegs; j++) {
          const a = i * (vSegs + 1) + j;
          const b = (i + 1) * (vSegs + 1) + j;
          const c = (i + 1) * (vSegs + 1) + (j + 1);
          const d = i * (vSegs + 1) + (j + 1);
          indices.push(a, b, d);
          indices.push(b, c, d);
        }
      }
      geom.setIndex(indices);
      geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geom.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geom.computeVertexNormals();
      return geom;
    }

    // 2. Velvety Rose Petal (broad, spoon-cupped with rolled crest)
    function createRosePetalGeometry() {
      const geom = new THREE.BufferGeometry();
      const uSegs = 16, vSegs = 10;
      const positions = [], uvs = [], indices = [];

      for (let i = 0; i <= uSegs; i++) {
        const u = i / uSegs;
        const w = Math.sin(u * Math.PI * 0.86) * 1.25;
        const y = u * 2.6;
        const archY = Math.sin(u * Math.PI * 0.9) * 0.32;
        const tipCurl = (u > 0.82) ? -Math.pow((u - 0.82) / 0.18, 2) * 0.22 : 0;

        for (let j = 0; j <= vSegs; j++) {
          const v = (j / vSegs) - 0.5;
          const x = v * w * 2.0;
          const dish = Math.cos(v * Math.PI) * 0.38 * Math.sin(u * Math.PI);
          positions.push(x, y, archY + dish + tipCurl);
          uvs.push(j / vSegs, u);
        }
      }

      for (let i = 0; i < uSegs; i++) {
        for (let j = 0; j < vSegs; j++) {
          const a = i * (vSegs + 1) + j;
          const b = (i + 1) * (vSegs + 1) + j;
          const c = (i + 1) * (vSegs + 1) + (j + 1);
          const d = i * (vSegs + 1) + (j + 1);
          indices.push(a, b, d);
          indices.push(b, c, d);
        }
      }
      geom.setIndex(indices);
      geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geom.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geom.computeVertexNormals();
      return geom;
    }

    // 3. Pointed Lotus Petal (sharp pointed tip, upward sweep)
    function createLotusPetalGeometry() {
      const geom = new THREE.BufferGeometry();
      const uSegs = 16, vSegs = 8;
      const positions = [], uvs = [], indices = [];

      for (let i = 0; i <= uSegs; i++) {
        const u = i / uSegs;
        const w = Math.sin(Math.pow(u, 0.75) * Math.PI) * 0.92 * (1.0 - 0.1 * u);
        const y = u * 3.4;
        const z = Math.sin(u * Math.PI * 0.8) * 0.44 + Math.pow(u, 2.4) * 0.2;

        for (let j = 0; j <= vSegs; j++) {
          const v = (j / vSegs) - 0.5;
          const x = v * w * 2.0;
          const cup = Math.abs(v) * 0.12 * Math.sin(u * Math.PI);
          positions.push(x, y, z - cup);
          uvs.push(j / vSegs, u);
        }
      }

      for (let i = 0; i < uSegs; i++) {
        for (let j = 0; j < vSegs; j++) {
          const a = i * (vSegs + 1) + j;
          const b = (i + 1) * (vSegs + 1) + j;
          const c = (i + 1) * (vSegs + 1) + (j + 1);
          const d = i * (vSegs + 1) + (j + 1);
          indices.push(a, b, d);
          indices.push(b, c, d);
        }
      }
      geom.setIndex(indices);
      geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geom.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geom.computeVertexNormals();
      return geom;
    }

    // 4. White Star Jasmine Flower (5 distinct delicate lobes)
    function createJasmineFlowerGeometry() {
      const geom = new THREE.BufferGeometry();
      const numPetals = 5;
      const positions = [], uvs = [], indices = [];

      positions.push(0, 0.09, 0);
      uvs.push(0.5, 0.5);

      let vIdx = 1;
      for (let p = 0; p < numPetals; p++) {
        const a1 = (p / numPetals) * Math.PI * 2;
        const a2 = ((p + 1) / numPetals) * Math.PI * 2;
        const aMid = (a1 + a2) * 0.5;

        const rB = 0.15;
        const rT = 0.52;

        positions.push(Math.cos(a1) * rB, 0.03, Math.sin(a1) * rB);
        uvs.push(0.4, 0.4);

        positions.push(Math.cos(aMid) * rT, 0.08, Math.sin(aMid) * rT);
        uvs.push(0.5, 0.0);

        positions.push(Math.cos(a2) * rB, 0.03, Math.sin(a2) * rB);
        uvs.push(0.6, 0.4);

        indices.push(0, vIdx, vIdx + 1);
        indices.push(0, vIdx + 1, vIdx + 2);
        vIdx += 3;
      }

      geom.setIndex(indices);
      geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geom.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geom.computeVertexNormals();
      return geom;
    }

    // 5. Authentic Clay Diya (Traditional Terracotta Oil Lamp)

      // Teardrop Golden Flame

        color: 0xfff0aa,
        transparent: true,

      });

    // =========================================================================

    function setupLighting() {

    function setupFloor() {
      const floorGeom = new THREE.PlaneGeometry(90, 90, 64, 64);

      // Rich procedural sandstone with subtle grain and sacred chalk guidelines
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, 512, 512);

      // Grain noise
      const imgData = ctx.getImageData(0, 0, 512, 512);
      for (let i = 0; i < imgData.data.length; i += 4) {
        const noise = (Math.random() - 0.5) * 30;
        imgData.data[i] = Math.max(0, Math.min(255, 235 + noise));
        imgData.data[i + 1] = Math.max(0, Math.min(255, 222 + noise));
        imgData.data[i + 2] = Math.max(0, Math.min(255, 205 + noise));
      }
      ctx.putImageData(imgData, 0, 0);

      // Traditional sacred chalk lines (white rice powder Kolam circles)
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.18)';
      ctx.lineWidth = 1.6;
      for (let r = 24; r < 250; r += 24) {
        ctx.beginPath();
        ctx.arc(256, 256, r, 0, Math.PI * 2);
        ctx.stroke();
      }

      // 16 radial rays
      for (let a = 0; a < 16; a++) {
        const rad = (a / 16) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(256 + Math.cos(rad) * 30, 256 + Math.sin(rad) * 30);
        ctx.lineTo(256 + Math.cos(rad) * 240, 256 + Math.sin(rad) * 240);
        ctx.stroke();
      }

      const sandTex = new THREE.CanvasTexture(canvas);
      sandTex.wrapS = THREE.RepeatWrapping;
      sandTex.wrapT = THREE.RepeatWrapping;
      sandTex.repeat.set(4, 4);

      const floorMat = new THREE.MeshStandardMaterial({
        color: activeColors.bg,
        map: sandTex,
        roughness: 0.92,
        metalness: 0.03
      });

      floorMesh = new THREE.Mesh(floorGeom, floorMat);
      floorMesh.rotation.x = -Math.PI / 2;
      floorMesh.position.y = -0.02;
      floorMesh.receiveShadow = true;
      scene.add(floorMesh);
    }

    // =========================================================================
    // DENSE LUSH MANDALA ARCHITECTURE (Over 2,800 Overlapping Flower Petals)
    // =========================================================================
    function buildRangoli() {
      while (rangoliGroup.children.length > 0) {
        const obj = rangoliGroup.children[0];
        rangoliGroup.remove(obj);
        if (obj.geometry) obj.geometry.dispose();
      }

      for (let light of diyaPointLights) {
        scene.remove(light);
      }
      diyaPointLights = [];
      diyaMeshes = [];
      diyaFlames = [];
      petalDefinitions = [];

      // Organic velvety petal materials with procedural gradient & veining
      const matMarigold = new THREE.MeshStandardMaterial({
        map: sharedPetalTexture,
        roughness: 0.42,
        metalness: 0.02,
        side: THREE.DoubleSide
      });
      const matRose = new THREE.MeshStandardMaterial({
        map: sharedPetalTexture,
        roughness: 0.38,
        metalness: 0.03,
        side: THREE.DoubleSide
      });
      const matLotus = new THREE.MeshStandardMaterial({
        map: sharedPetalTexture,
        roughness: 0.40,
        metalness: 0.02,
        side: THREE.DoubleSide
      });
      const matJasmine = new THREE.MeshStandardMaterial({
        roughness: 0.32,
        metalness: 0.05,
        side: THREE.DoubleSide
      });

      const geomMarigold = createMarigoldPetalGeometry();
      const geomRose = createRosePetalGeometry();
      const geomLotus = createLotusPetalGeometry();
      const geomJasmine = createJasmineFlowerGeometry();

      const instances = {
        marigold: [],
        rose: [],
        lotus: [],
        jasmine: []
      };

      const sym = params.mandalaSymmetry; // 16-fold rotational symmetry

      // --- LAYER 0: Central Plush Marigold Rosette (Radius 0.0 -> 1.1) ---
      // Inner spiral coil
      const nCore = 36;
      for (let i = 0; i < nCore; i++) {
        const frac = i / nCore;
        const rad = 0.15 + frac * 0.85;
        const theta = frac * Math.PI * 6.0;
        instances.marigold.push({
          x: Math.cos(theta) * rad,
          z: Math.sin(theta) * rad,
          y: 0.08 + (1.0 - frac) * 0.08,
          rotY: -theta + Math.PI / 2 + 0.3,
          rotX: -0.25,
          rotZ: (Math.random() - 0.5) * 0.1,
          scale: 0.45 + frac * 0.25,
          colorType: 'c1',
          ringId: 0,
          radialDist: rad
        });
      }

      // --- LAYER 1: First Dense Jasmine Contrast Halo (Radius 1.2 -> 1.9) ---
      const nJ1 = sym * 3; // 48
      for (let i = 0; i < nJ1; i++) {
        const theta = (i / nJ1) * Math.PI * 2;
        const rad = 1.35 + (i % 2) * 0.25;
        instances.jasmine.push({
          x: Math.cos(theta) * rad,
          z: Math.sin(theta) * rad,
          y: 0.06 + (i % 2) * 0.02,
          rotY: theta + Math.PI / 2,
          rotX: 0,
          rotZ: 0,
          scale: 0.72,
          colorType: 'c2',
          ringId: 1,
          radialDist: rad
        });
      }

      // --- LAYER 2: Inner Lotus Blossom Tier (Radius 1.8 -> 3.8) ---
      // Layer 2A: Pointed Lotus Petals
      const nL1 = sym * 2; // 32
      for (let i = 0; i < nL1; i++) {
        const theta = (i / nL1) * Math.PI * 2;
        const rad = 2.4;
        instances.lotus.push({
          x: Math.cos(theta) * rad,
          z: Math.sin(theta) * rad,
          y: 0.09,
          rotY: -theta + Math.PI / 2,
          rotX: -0.18 * params.petalCurl,
          rotZ: 0,
          scale: 0.82,
          colorType: 'c3',
          ringId: 2,
          radialDist: rad
        });
      }

      // Layer 2B: Golden Marigold Florets nestled between Lotus petals
      for (let i = 0; i < nL1; i++) {
        const theta = (i / nL1) * Math.PI * 2 + (Math.PI / nL1);
        const rad = 2.9;
        instances.marigold.push({
          x: Math.cos(theta) * rad,
          z: Math.sin(theta) * rad,
          y: 0.07,
          rotY: -theta + Math.PI / 2 + 0.15,
          rotX: -0.15,
          rotZ: 0,
          scale: 0.78,
          colorType: 'c1',
          ringId: 2,
          radialDist: rad
        });
      }

      // --- LAYER 3: First Velvet Rose Shingled Carpet (Radius 3.6 -> 5.8) ---
      // Dense overlapping scales with ZERO gaps
      const nRose1 = sym * 4; // 64
      for (let i = 0; i < nRose1; i++) {
        const theta = (i / nRose1) * Math.PI * 2;
        const rad = 4.1 + (i % 2) * 0.45;
        instances.rose.push({
          x: Math.cos(theta) * rad,
          z: Math.sin(theta) * rad,
          y: 0.07 + (i % 2) * 0.03,
          rotY: -theta + Math.PI / 2 + (i % 2 === 0 ? 0.12 : -0.12),
          rotX: -0.22 * params.petalCurl,
          rotZ: (Math.random() - 0.5) * 0.08,
          scale: 0.95,
          colorType: 'c4',
          ringId: 3,
          radialDist: rad
        });
      }

      // Outer tier of first rose ring
      for (let i = 0; i < nRose1; i++) {
        const theta = (i / nRose1) * Math.PI * 2 + (Math.PI / nRose1);
        const rad = 5.1;
        instances.rose.push({
          x: Math.cos(theta) * rad,
          z: Math.sin(theta) * rad,
          y: 0.08,
          rotY: -theta + Math.PI / 2,
          rotX: -0.18 * params.petalCurl,
          rotZ: 0,
          scale: 1.0,
          colorType: 'c4',
          ringId: 3,
          radialDist: rad
        });
      }

      // --- LAYER 4: Middle White Jasmine Lace Border (Radius 5.8 -> 7.0) ---
      const nJ2 = sym * 5; // 80
      for (let i = 0; i < nJ2; i++) {
        const theta = (i / nJ2) * Math.PI * 2;
        const rad = 6.2 + (i % 2) * 0.28;
        instances.jasmine.push({
          x: Math.cos(theta) * rad,
          z: Math.sin(theta) * rad,
          y: 0.06 + (i % 2) * 0.02,
          rotY: theta,
          rotX: 0,
          rotZ: 0,
          scale: 0.85,
          colorType: 'c2',
          ringId: 4,
          radialDist: rad
        });
      }

      // --- LAYER 5: Paisley / Mango Medallions & Lotus Flourishes (Radius 6.8 -> 9.8) ---
      const nL2 = sym * 2; // 32
      for (let i = 0; i < nL2; i++) {
        const theta = (i / nL2) * Math.PI * 2;
        const rad = 7.7;
        instances.lotus.push({
          x: Math.cos(theta) * rad,
          z: Math.sin(theta) * rad,
          y: 0.1,
          rotY: -theta + Math.PI / 2,
          rotX: -0.24 * params.petalCurl,

          scale: 1.15,
          colorType: 'c3',
          ringId: 5,
          radialDist: rad
        });

      // Interstitial calendula clusters in Layer 5
      const nMar2 = sym * 4; // 64
      for (let i = 0; i < nMar2; i++) {

          x: Math.cos(theta) * rad,

          radialDist: rad
        });

      // --- LAYER 6: Second Velvet Rose Carpet (Radius 9.4 -> 12.0) ---
      const nRose2 = sym * 5; // 80
      for (let i = 0; i < nRose2; i++) {
        const theta = (i / nRose2) * Math.PI * 2;
        const rad = 10.0 + (i % 2) * 0.55;
        instances.rose.push({
          x: Math.cos(theta) * rad,
          z: Math.sin(theta) * rad,
          y: 0.08 + (i % 2) * 0.03,
          rotY: -theta + Math.PI / 2 + (i % 2 === 0 ? 0.1 : -0.1),

          colorType: 'c4',
          ringId: 6,
          radialDist: rad
        });
      }

      for (let i = 0; i < nRose2; i++) {
        const theta = (i / nRose2) * Math.PI * 2 + (Math.PI / nRose2);
        const rad = 11.2;
        instances.rose.push({
          x: Math.cos(theta) * rad,
          z: Math.sin(theta) * rad,
          y: 0.08,
          rotY: -theta + Math.PI / 2,
          rotX: -0.18 * params.petalCurl,
          rotZ: 0,
          scale: 1.15,
          colorType: 'c5',
          ringId: 6,
          radialDist: rad
        });
      }

      // --- LAYER 7: Grand Outer Sunburst Garland (Radius 12.0 -> 14.8) ---
      const nSun = sym * 6; // 96
      for (let i = 0; i < nSun; i++) {
        const theta = (i / nSun) * Math.PI * 2;
        const rad = 12.8 + (i % 2) * 0.5;
        instances.marigold.push({
          x: Math.cos(theta) * rad,
          z: Math.sin(theta) * rad,

          rotX: -0.14,
          rotZ: (Math.random() - 0.5) * 0.05,
          scale: 1.12,
          colorType: 'c1',
          ringId: 7,
          radialDist: rad
        });
      }

      // Grand outward lotus star points
      const nLotusOuter = sym * 2; // 32
      for (let i = 0; i < nLotusOuter; i++) {
        const theta = (i / nLotusOuter) * Math.PI * 2;
        const rad = 14.1;
        instances.lotus.push({
          x: Math.cos(theta) * rad,
          z: Math.sin(theta) * rad,

          radialDist: rad
        });

      const nOuter = sym * 6; // 96
      for (let i = 0; i < nOuter; i++) {
        const theta = (i / nOuter) * Math.PI * 2 + (Math.PI / nOuter);
        const rad = 15.2;
        instances.rose.push({
          x: Math.cos(theta) * rad,
          z: Math.sin(theta) * rad,

      instancedRose = new THREE.InstancedMesh(geomRose, matRose, instances.rose.length);
      instancedLotus = new THREE.InstancedMesh(geomLotus, matLotus, instances.lotus.length);
      instancedJasmine = new THREE.InstancedMesh(geomJasmine, matJasmine, instances.jasmine.length);

      [instancedMarigold, instancedRose, instancedLotus, instancedJasmine].forEach(mesh => {

        mesh.receiveShadow = true;
        mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
