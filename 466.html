<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beautiful Burnout — Full Screen Generative Cityscape</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #0d0c10;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      color: #e4e2e6;
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      display: block;
      width: 100vw !important;
      height: 100vh !important;
      cursor: pointer;
      touch-action: manipulation;
    }

    /* Elegant Minimalist HUD */
    .hud {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(18, 17, 23, 0.76);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 8px 18px;
      border-radius: 30px;
      box-shadow: 0 10px 36px rgba(0, 0, 0, 0.5);
      z-index: 100;
      transition: opacity 0.4s ease, transform 0.4s ease;
      opacity: 0.95;
    }

    .hud.idle {
      opacity: 0.12;
      transform: translate(-50%, 6px);
    }

    .hud:hover {
      opacity: 1 !important;
      transform: translate(-50%, 0) !important;
    }

    .hud-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.4px;
      color: #f2edf4;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff781e;
      display: inline-block;
      box-shadow: 0 0 8px #ff781e;
      transition: background 0.3s, box-shadow 0.3s;
    }

    .status-dot.done {
      background: #80c372;
      box-shadow: 0 0 8px #80c372;
    }

    .hud-divider {
      width: 1px;
      height: 16px;
      background: rgba(255, 255, 255, 0.15);
    }

    .hud-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #ded9e2;
      font-size: 12px;
      font-weight: 500;
      padding: 5px 12px;
      border-radius: 16px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      outline: none;
      white-space: nowrap;
    }

    .hud-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.28);
    }

    .hud-btn:active {
      transform: scale(0.96);
    }

    .hud-key {
      font-size: 10px;
      background: rgba(255, 255, 255, 0.14);
      padding: 1px 5px;
      border-radius: 4px;
      color: #b0abb4;
      text-transform: uppercase;
      font-family: monospace;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.0/lib/p5.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="hud" id="hud">
    <div class="hud-title">
      <span class="status-dot" id="status-dot"></span>
      <span id="status-text">Burning out...</span>
    </div>
    <div class="hud-divider"></div>
    <button class="hud-btn" id="btn-regen" title="Generate a new skyline (Space or Click)">
      <span>Regenerate</span>
      <span class="hud-key">Space</span>
    </button>
    <button class="hud-btn" id="btn-save" title="Save high-res canvas (S)">
      <span>Save</span>
      <span class="hud-key">S</span>
    </button>
    <button class="hud-btn" id="btn-fs" title="Toggle browser Fullscreen (F)">
      <span>Fullscreen</span>
      <span class="hud-key">F</span>
    </button>
  </div>

  <script>
// Made for WCCC Beautiful Burnout
// A sunset kinda burns out right? This might be stretch...

var gradient
var objs = 0
var y
var w
var horizonY
var sunDiameter
var minW, maxW

const BG = "#E8E0E0"
const BG2 = "#F9F5E0"
const ALPHA = "#FFF0"

const SUNC = ["#FF781E", "#FB2300", "#FFF0", "#FFF0"]

const PAL = ["#FB2300", "#FF781E", "#E4EF00", "#80C372",
		     "#1A9D00", "#004930", "#6AB4E1", "#0064FF",
		     "#2600FF", "#261B63", "#551976", "#FF6AFA", 
		     "#6D5604", "#00A48B", "#2A2526"]

const L = ["#E4EF00", "#80C372", "#6AB4E1", "#FF6AFA"]
const M = ["#1A9D00", "#00A48B", "#FF781E"]
const MD = ["#FB2300", "#0064FF"]
const D = ["#2600FF", "#6D5604", "#004930"]
const XD = ["#261B63", "#2A2526", "#551976"]

const LANTERNPAIRS = [
	["#F9F5E0", "#E4EF00"],
	["#F9F5E0", "#6AB4E1"],
	["#F9F5E0", "#80C372"],
	["#F9F5E0", "#FF6AFA"],
	["#FF781E", "#FB2300"],
	["#E4EF00", "#FF781E"],
	["#FF6AFA", "#00A48B"],
	["#6AB4E1", "#00A48B"],
	["#6AB4E1", "#FF6AFA"],
	["#FF6AFA", "#FB2300"],
	["#E4EF00", "#FF6AFA"],
	["#E4EF00", "#FF781E"],
	["#80C372", "#00A48B"],
	["#00A48B", "#1A9D00"],
	["#80C372", "#1A9D00"],
]
const ALLPAIRS = [
	["#FB2300", "#551976"],
	["#FF6AFA", "#FB2300"],
	["#FF781E", "#FB2300"],
	["#1A9D00", "#2600FF"],
	["#2600FF", "#551976"],
	["#FF6AFA", "#0064FF"],
	["#E4EF00", "#FF6AFA"],
	["#E4EF00", "#FF781E"],
	["#FF781E", "#6D5604"],
	["#80C372", "#551976"],
	["#80C372", "#00A48B"],
	["#00A48B", "#1A9D00"],
	["#80C372", "#1A9D00"],
	["#1A9D00", "#004930"],
	["#FB2300", "#6D5604"],
	["#6D5604", "#2A2526"],
	["#551976", "#2A2526"],
	["#2600FF", "#004930"],
	["#1A9D00", "#6D5604"],
	["#00A48B", "#004930"],
	["#FF6AFA", "#00A48B"],
	["#6AB4E1", "#00A48B"],
	["#6AB4E1", "#FF6AFA"],
	["#6AB4E1", "#0064FF"],
	["#F9F5E0", "#E4EF00"],
	["#F9F5E0", "#6AB4E1"],
	["#F9F5E0", "#80C372"],
	["#F9F5E0", "#FF6AFA"],
	["#004930", "#2A2526"],
	["#551976", "#2A2526"],
]

// Fast color parser to 0xAABBGGRR for Uint32Array
function hexToUint32(hex) {
  if (!hex || hex === '#FFF0' || hex === '#0000') return 0;
  if (hex.length === 5) { // #RGBA format
    const r = parseInt(hex[1] + hex[1], 16);
    const g = parseInt(hex[2] + hex[2], 16);
    const b = parseInt(hex[3] + hex[3], 16);
    const a = parseInt(hex[4] + hex[4], 16);
    return (a << 24) | (b << 16) | (g << 8) | r;
  }
  const c = hex.replace('#', '');
  if (c.length === 6) {
    const r = parseInt(c.substring(0, 2), 16);
    const g = parseInt(c.substring(2, 4), 16);
    const b = parseInt(c.substring(4, 6), 16);
    return (255 << 24) | (b << 16) | (g << 8) | r;
  }
  return 0xFF000000;
}

// Reusable offscreen canvas for high-performance subpixel dithering
let offCanvas = null;
let offCtx = null;
function getOffscreen(w, h) {
  if (!offCanvas) {
    offCanvas = document.createElement('canvas');
    offCtx = offCanvas.getContext('2d', { willReadFrequently: true });
  }
  if (offCanvas.width < w || offCanvas.height < h) {
    offCanvas.width = Math.max(offCanvas.width || 0, w);
    offCanvas.height = Math.max(offCanvas.height || 0, h);
  }
  return { canvas: offCanvas, ctx: offCtx };
}

// My custom noise gradient. High-performance full-screen accelerated implementation
function pixelDither(x, y, w, h, stepH, stepW, pal) {
  w = Math.max(1, Math.round(w));
  h = Math.max(1, Math.round(h));
  x = Math.floor(x);
  y = Math.floor(y);

  const { canvas: off, ctx } = getOffscreen(w, h);
  const imgData = ctx.createImageData(w, h);
  const buf = new Uint32Array(imgData.data.buffer);
  const uintPal = pal.map(hexToUint32);
  const l = uintPal.length - 1;

  for (let i = 0; i < h; i++) {
    const k = Math.min(Math.floor((i / h) * l), l - 1);
    const frac = (i - (h / l * k)) / (h / l);
    const rowOffset = i * w;
    for (let j = 0; j < w; j++) {
      buf[rowOffset + j] = Math.random() < frac ? uintPal[k + 1] : uintPal[k];
    }
  }

  ctx.putImageData(imgData, 0, 0);
  drawingContext.drawImage(off, 0, 0, w, h, x, y, w, h);
}

function radialDither(x, y, w, h, stepH, stepW, pal) {
  w = Math.max(1, Math.round(w));
  h = Math.max(1, Math.round(h));
  x = Math.floor(x);
  y = Math.floor(y);

  const { canvas: off, ctx } = getOffscreen(w, h);
  const imgData = ctx.createImageData(w, h);
  const buf = new Uint32Array(imgData.data.buffer);
  const uintPal = pal.map(hexToUint32);
  const l = uintPal.length - 1;

  const maxR = Math.hypot(w / 2, h / 2);
  const cX = w / 2, cY = h / 2;

  for (let i = 0; i < h; i++) {
    const dy = i - cY;
    const dy2 = dy * dy;
    const rowOffset = i * w;
    for (let j = 0; j < w; j++) {
      const dx = j - cX;
      const pr = Math.sqrt(dx * dx + dy2) / maxR;
      const t = pr * l;
      const k = Math.min(Math.floor(t), l - 1);
      const frac = t - k;
      buf[rowOffset + j] = Math.random() < frac ? uintPal[k + 1] : uintPal[k];
    }
  }

  ctx.putImageData(imgData, 0, 0);
  drawingContext.drawImage(off, 0, 0, w, h, x, y, w, h);
}

function rotateAroundPoint(x, y, rot) {
	translate(x, y)
	rotate(rot)
	translate(-x, -y)
}

let randInt = (a, b) => (floor(random(a, b)))
let randAng = (n) => (floor(random(n)) * TAU / n)
let maybe = () => (random() < 0.5)
let sometimes = (p) => (random() < p)

function setup() {
	pixelDensity(1)
	const c = createCanvas(windowWidth, windowHeight)
	c.parent('canvas-container')
	resetSketch()
}

function windowResized() {
	resizeCanvas(windowWidth, windowHeight)
	resetSketch()
}

function resetSketch() {
	objs = 0
	updateStatus(false)
	horizonY = floor(height * 0.5)
	sunDiameter = floor(min(width, height) * 0.52)
	minW = max(5, floor(width * 0.007))
	maxW = max(120, floor(width * 0.11))

	background(BG)
	gradient = [random(L), random(M), random(MD), random(D), random(XD), random(D), random(MD), random(M), random(L)]
	// Panoramic full-screen sky dither
	pixelDither(0, 0, width, height, 1, 1, gradient)

	// Half-sun clipped to top half above horizon
	push()
	beginClip()
	rect(0, 0, width, horizonY)
	endClip()
	radialDither(width / 2 - sunDiameter / 2, horizonY - sunDiameter / 2, sunDiameter, sunDiameter, 1, 1, SUNC)
	pop()

	y = horizonY
	loop()
}

function draw() {
	// Process multiple buildings per frame for responsive, silky-smooth progression across wide screens
	const batch = Math.max(1, Math.round(width / 750))
	for (let s = 0; s < batch; s++) {
		if (y > height) {
			noLoop()
			updateStatus(true)
			break
		}
		stepBuilding()
	}
}

function stepBuilding() {
	push()
	objs++
	var x = randInt(0, width)
	translate(floor(x), floor(y))
	w = floor(map(y, horizonY, height, minW, maxW))
	if (sometimes(0.04)) {
		tower(w)
	} else if (sometimes(0.3)) {
		decor(w)
	} else {
		building(w)
	}
	pop()
	if (sometimes(0.2)) {
		push()
		translate(floor(x), horizonY - randInt(0, max(1, y - horizonY)))
		lantern(w)
		pop()
	}
	y += (w * w) / (width * 1.25)
}

function lantern(w) {
	push()
	gradient = random(LANTERNPAIRS).concat(BG)
	beginClip()
	circle(0, 0, w/4)
	endClip()
	radialDither(-w/4, -w/4, w/2, w/2, 1, 1, gradient)
	pop()
}

function decor(w) {
	gradient = [random(L), random(M), random(D), ALPHA]
	beginClip()
	if (maybe()) {
		if (maybe()) {
			ellipse(0, w/2, w/6, w/2)
			ellipse(-w/3, w/2, w/6, w/2)
			ellipse(w/3, w/2, w/6, w/2)
			ellipse(-w/6, w/2, w/6, w/2)
			ellipse(w/6, w/2, w/6, w/2)
		} else {
			circle(-w/4, w/2, w/2)
			circle(0, w/4, w/2)
			circle(w/4, w/2, w/2)
		}
	} else {
		if (maybe()) {
			circle(0, w/2, w)
		} else {
			rect(-w/3, 0, w/6, w/2)
			rect(w/3, 0, w/6, w/2)
			rect(0, 0, w/6, w/2)
		}
	}
	endClip()
	pixelDither(-w/2, 0, w, w/2, 1, 1, gradient)
}

function tower(w) {
	translate(0, -w/2)
	gradient = [random(L), random(M), random(MD), random(D), random(XD), ALPHA]
	beginClip()
	triangle(-w/2, w, w/2, w, 0, -w*4)
	endClip()
	beginClip({invert:true})
	circle(0, -w*2, w * 0.4)
	circle(0, -w*1.5, w/3)
	circle(0, -w, w/4)
	endClip()
	pixelDither(-w/2, -w*2, w, w * 3, 1, 1, gradient)
}

function building(w) {
	gradient = random(ALLPAIRS).concat(ALPHA)
	pixelDither(-w/2, -w/2, w, w, 1, 1, gradient)
	gradient = random(ALLPAIRS)
	if (maybe()) {
		pixelDither(-w/16, -w/4, w/8, w/4, 1, 1, gradient)
		pixelDither(-(w/16)*5, -w/4, w/8, w/4, 1, 1, gradient)
		pixelDither((w/16)*3, -w/4, w/8, w/4, 1, 1, gradient)
	} else {
		pixelDither(-w/2, -w/3, w, w/6, 1, 1, gradient)
		pixelDither(-w/2, 0, w, w/12, 1, 1, gradient)
	}
	gradient = random(ALLPAIRS)
	if (maybe()) {
		beginClip({invert:true})
		if (maybe()) {
			ellipse(-w/2, -w, w/2, w)
			ellipse(w/2, -w, w/2, w)
			ellipse(0, -w, w/2, w/2)
		} else {
			ellipse(-w/2, -w, w/3, w)
			ellipse(w/2, -w, w/3, w)
			ellipse(-w/6, -w, w/3, w/3)
			ellipse(w/6, -w, w/3, w/3)
		}
		endClip()
	} else {
		beginClip()
		if (maybe()) {
			ellipse(-w/4, -w/2, w/2, w/2)
			ellipse(w/4, -w/2, w/2, w/2)
		} else {
			triangle(-w/2, -w/2, w/2, -w/2, 0, -2*w)
		}
		endClip()
	}
	pixelDither(-w/2, -w, w, w/2, 1, 1, gradient)
}

function toggleFullScreen() {
	if (!document.fullscreenElement) {
		document.documentElement.requestFullscreen().catch(() => {});
	} else {
		if (document.exitFullscreen) {
			document.exitFullscreen().catch(() => {});
		}
	}
}

function keyPressed() {
	if (key === 's' || key === 'S') {
		saveCanvas('beautiful-burnout', 'png')
	}
	if (key === 'r' || key === 'R' || key === ' ') {
		resetSketch()
	}
	if (key === 'f' || key === 'F') {
		toggleFullScreen()
	}
}

function mouseClicked(e) {
	if (e && e.target && e.target.tagName === 'CANVAS') {
		resetSketch()
	}
}

// UI & Interaction helpers
function updateStatus(isDone) {
	const dot = document.getElementById('status-dot')
	const text = document.getElementById('status-text')
	if (!dot || !text) return
	if (isDone) {
		dot.classList.add('done')
		text.textContent = 'Burnout Complete'
	} else {
		dot.classList.remove('done')
		text.textContent = 'Burning out...'
	}
}

// Button listeners
document.getElementById('btn-regen').addEventListener('click', (e) => {
	e.stopPropagation()
	resetSketch()
})

document.getElementById('btn-save').addEventListener('click', (e) => {
	e.stopPropagation()
	saveCanvas('beautiful-burnout', 'png')
})

document.getElementById('btn-fs').addEventListener('click', (e) => {
	e.stopPropagation()
	toggleFullScreen()
})

// Auto-dim HUD on idle mouse
let idleTimer
const hud = document.getElementById('hud')
function resetIdleTimer() {
	if (hud) hud.classList.remove('idle')
	clearTimeout(idleTimer)
	idleTimer = setTimeout(() => {
		if (hud) hud.classList.add('idle')
	}, 3500)
}
window.addEventListener('mousemove', resetIdleTimer)
window.addEventListener('touchstart', resetIdleTimer)
resetIdleTimer()
  </script>
</body>
</html>
