<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#140500">
  <meta name="description" content="An infinite, slowly unfolding journey through a spectrum of light. Procedural WebGL artwork.">
  <title>Chromatic Infinity</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #080403; overscroll-behavior: none; }
    canvas { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none;
      filter: brightness(1); }
    #status { position: fixed; inset: 0; display: grid; place-items: center; margin: 0;
      padding: 2rem; color: #ffde8c; text-align: center; font: 15px/1.6 system-ui, sans-serif; }
    #status[hidden] { display: none; }
  </style>
</head>
<body>
  <canvas role="img" aria-label="Thousands of vivid light beams slowly flowing outward from a brilliant white and gold center"></canvas>
  <p id="status" role="alert" hidden></p>
  <script type="module">
    // Single-file artwork. Only Three.js and the unstyled lil-gui runtime use a CDN.
    const settings = {
      speed: 0.025,
      intensity: 1.15,
      bloomStrength: 0.24,
      streakDensity: 1,
      colorSaturation: 1.12,
      coreRadius: 0.043,
      loopDuration: 60,
      maxPixelRatio: Math.min(devicePixelRatio || 1, 1.5),
      respectReducedMotion: true,
      scheme: 'Original', customPalette: false, tint: '#ffffff',
      color1: '#ff1800', color2: '#ff6500', color3: '#ffd000',
      color4: '#00e5f5', color5: '#00a65a', color6: '#f000b5',
      invert: false, accent: '#ff2535', background: '#080403', greenscreen: false,
      animation: 'Forward drift', motionAmount: 1, orbitAngle: 0,
      zoom: 1, positionX: 0, positionY: 0, yaw: 0, pitch: 0, roll: 0,
      seed: 0, beamWidth: 1, depth: 1, randomizeOnClick: true,
    };

    // Exactly 19 presets. Invert provides both black/white polarities without extra presets.
    const schemes = {
      'Original': ['FF1800', 'FF6500', 'FFD000', '00E5F5', '00A65A', 'F000B5'],
      'Monochromatic': ['090B26', '192269', '3048A5', '637FE8', 'A8C0FF', 'E7F1FF'],
      'Analogous': ['65008F', 'B3007C', 'F000B5', 'FF185E', 'FF6500', 'FFD000'],
      'Complementary': ['072C40', '008A98', '00E5F5', 'FF6500', 'FFB454', 'FFF1C2'],
      'Split-complementary': ['171343', '5747C7', 'ABA0FF', 'FF6500', 'FFCE50', '54E8B2'],
      'Triadic': ['27115A', '913DE6', 'F000B5', '00A65A', '7BE390', 'FFD000'],
      'Tetradic': ['A30939', 'FF3857', 'FFCD38', '09B882', '007DB5', '703AE0'],
      'Double split-complementary': ['C12052', 'FF835A', 'FFDA66', '37D4AB', '238AD1', '8D53CE'],
      'Achromatic': ['000000', '202020', '606060', 'A0A0A0', 'D8D8D8', 'FFFFFF'],
      'Achromatic + Accent': ['000000', '282828', '686868', 'A8A8A8', 'FFFFFF', 'FF2535'],
      'Neutral + accent': ['191D22', '454B50', '878983', 'C5C1B6', 'EEE8D9', 'E8A23A'],
      'Amber / Oxblood': ['F6AA1C', 'BC3908', '941B0C', 'F6AA1C', '220901'],
      'Lagoon / Midnight': ['63D1CF', '5BC0BE', '4BAD9E', '4BAD9E', '0B132B', '000000'],
      'Orchid / Ink': ['AA60C8', 'D69ADE', 'C9A3C6', 'CFB5C2', '0D001D', '120A12'],
      'Champagne / Teal': ['FEF1BE', 'FFBA00', '008189', '00474D', '061210'],
      'Chartreuse / Forest': ['D4FFB0', '7FFF00', '00B894', '0A3322', '05140A'],
      'Apricot / Aubergine': ['FFE8CC', 'FF8C00', 'C7501A', '3D1050', '0E0618'],
      'Lilac / Ultraviolet': ['E8E0FF', 'B38FFF', '6A3DE8', '1A1250', '090612'],
      'Ice / Fuchsia': ['E0FBFF', '00F0FF', 'D40078', '1E0A3D', '05020F'],
    };
    const animations = ['Forward drift', 'Slow orbit', 'Elliptic glide', 'Light breathing',
      'Chromatic tide', 'Depth waves', 'Lantern sway', 'Gentle spiral', 'Static'];

    const canvas = document.querySelector('canvas');
    const status = document.querySelector('#status');
    function fail(message, error) {
      status.textContent = message;
      status.hidden = false;
      if (error) console.error(error);
    }

    let THREE;
    try {
      THREE = await import('https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js');
    } catch (error) {
      fail('The light engine could not load. Check your connection and reload.', error);
      throw error;
    }

    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: true,
        depth: false, stencil: false, powerPreference: 'high-performance' });
    } catch (error) {
      fail('This artwork requires a browser with WebGL 2 enabled.', error);
      throw error;
    }
    renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
    renderer.toneMapping = THREE.NoToneMapping;
    renderer.autoClear = true;

    const vertexShader = /* glsl */`
      varying vec2 vUv;
      void main() {
        vUv = uv;
        // Screen-space geometry: the optical depth lives entirely in the fragment shader.
        gl_Position = vec4(position.xy, 0.0, 1.0);
      }
    `;

    const uniforms = {
      uTime: { value: 0 },
      uResolution: { value: new THREE.Vector2() },
      uSpeed: { value: settings.speed },
      uIntensity: { value: settings.intensity },
      uBloomStrength: { value: settings.bloomStrength },
      uStreakDensity: { value: settings.streakDensity },
      uColorSaturation: { value: settings.colorSaturation },
      uCoreRadius: { value: settings.coreRadius },
      uLoopDuration: { value: settings.loopDuration },
      uPalette: { value: Array.from({ length: 6 }, () => new THREE.Color()) },
      uPaletteMode: { value: 0 }, uSeed: { value: 0 },
      uBeamWidth: { value: 1 }, uDepth: { value: 1 },
      uCenter: { value: new THREE.Vector2(0.49, 0.52) },
      uZoom: { value: 1 }, uView: { value: new THREE.Vector3() },
      uRotation: { value: 0 }, uPulse: { value: 1 },
    };

    const lightShader = /* glsl */`
      precision highp float;
      varying vec2 vUv;
      uniform float uTime, uSpeed, uIntensity, uStreakDensity;
      uniform float uCoreRadius, uLoopDuration;
      uniform vec2 uResolution;
      uniform vec3 uPalette[6];
      uniform float uPaletteMode, uSeed, uBeamWidth, uDepth, uZoom, uRotation, uPulse;
      uniform vec2 uCenter;
      uniform vec3 uView;
      const float TAU = 6.28318530718;

      float hash(float n) {
        return fract(sin((n + uSeed * 7.13) * 127.1 + 311.7) * 43758.5453123);
      }

      // Discrete pigments, deliberately weighted toward fiery red and gold.
      vec3 pigment(float h) {
        if (uPaletteMode > 0.5) {
          if (h < 0.166667) return uPalette[0];
          if (h < 0.333333) return uPalette[1];
          if (h < 0.5) return uPalette[2];
          if (h < 0.666667) return uPalette[3];
          if (h < 0.833333) return uPalette[4];
          return uPalette[5];
        }
        if (h < 0.13) return vec3(1.0, 0.018, 0.001);
        if (h < 0.23) return vec3(0.48, 0.003, 0.014);
        if (h < 0.34) return vec3(1.0, 0.15, 0.002);
        if (h < 0.43) return vec3(1.0, 0.60, 0.003);
        if (h < 0.51) return vec3(1.0, 1.0, 0.028);
        if (h < 0.60) return vec3(0.0, 0.79, 0.91);
        if (h < 0.66) return vec3(0.0, 0.42, 0.46);
        if (h < 0.74) return vec3(0.0, 0.30, 0.055);
        if (h < 0.79) return vec3(0.001, 0.065, 0.016);
        if (h < 0.85) return vec3(0.008, 0.12, 0.95);
        if (h < 0.95) return vec3(0.77, 0.001, 0.31);
        return vec3(0.15, 0.001, 0.30);
      }

      // Each angular lane has an independent width, depth, phase and pigment.
      // Logarithmic depth makes the pieces grow in perspective as they travel.
      // The circular pulse is periodic, so neither endpoints nor colors pop on wrap.
      vec3 beams(float angle, float radius, float count, float seed,
                 float width, float turns, float brightness, float cycle) {
        count = max(8.0, floor(count * uStreakDensity));
        float a = fract(angle + seed * 0.017) * count;
        float lane = floor(a);
        float id = lane + seed * 193.17;
        float rnd = hash(id);
        float center = 0.5 + (hash(id + 2.0) - 0.5) * 0.25;
        float halfWidth = min(0.49, width * uBeamWidth * mix(0.22, 1.0, hash(id + 7.0)));
        float distanceToLine = abs(fract(a) - center);
        float aa = max(fwidth(a) * 0.65, 0.006);
        float edge = 1.0 - smoothstep(halfWidth - aa, halfWidth + aa, distanceToLine);
        float halo = exp(-distanceToLine * distanceToLine / (halfWidth * halfWidth * 3.0));

        float depth = log(max(radius, 0.0001)) * turns * uDepth;
        float phase = fract(depth - cycle + rnd * 13.0);
        float segmentLength = mix(0.18, 0.79, hash(id + 11.0));
        float feather = mix(0.012, 0.075, hash(id + 19.0));
        float segment = smoothstep(0.0, feather, phase)
                      * (1.0 - smoothstep(segmentLength, segmentLength + feather, phase));
        float thinHighlight = (1.0 - smoothstep(0.015, 0.04 + aa, abs(fract(a) - center + halfWidth * 0.45)))
                            * step(0.65, hash(id + 51.0));
        float power = mix(0.22, 1.5, pow(hash(id + 17.0), 2.0));
        float shimmer = 0.97 + 0.03 * sin(TAU * (phase + cycle + rnd));
        vec3 color = pigment(hash(id + 43.0));
        float heat = exp(-radius * mix(7.0, 16.0, rnd));
        vec3 hotColor = mix(vec3(1.0, 0.66 + rnd * 0.32, 0.008), pigment(0.72), uPaletteMode);
        color = mix(color, hotColor, heat * 0.88);
        vec3 light = color * (edge * (0.015 + segment * 0.985) + halo * segment * 0.025);
        light += mix(color, mix(vec3(1.0, 0.94, 0.59), pigment(0.94), uPaletteMode), 0.25)
               * thinHighlight * segment * 0.09;
        float presence = smoothstep(0.32, 0.68, hash(id + 93.0));
        return light * power * brightness * shimmer * presence;
      }

      void main() {
        vec2 p = (vUv - uCenter) * vec2(uResolution.x / uResolution.y, 1.0) / uZoom;
        float rotation = uView.z + uRotation;
        p = mat2(cos(rotation), -sin(rotation), sin(rotation), cos(rotation)) * p;
        p /= max(0.25, 1.0 + dot(p, sin(uView.xy)) * 0.45);
        p *= max(vec2(0.3), cos(uView.xy));
        float radius = length(p);
        float angle = atan(p.y, p.x) / TAU + 0.5;
        // Integer phase travel gives an exact 60-second loop at the default speed.
        float loop = uTime / uLoopDuration;
        float travel = loop;
        angle += 0.0007 * sin(loop * TAU);

        // A: full-length, translucent color slabs and rich dark interstices.
        float lane = floor(fract(angle) * floor(104.0 * uStreakDensity));
        float inner = fract(angle * floor(104.0 * uStreakDensity));
        float grooves = 0.56 + 0.44 * smoothstep(0.015, 0.13, inner);
        vec3 color = pigment(hash(lane + 901.0)) * mix(0.004, 0.72, pow(hash(lane + 6.0), 2.0)) * grooves;
        color *= 0.80 + 0.20 * sin(log(radius + 0.01) * 2.0 - travel * TAU + hash(lane) * TAU);
        color += beams(angle, radius, 83.0, 3.0, 0.47, 0.43, 0.78, travel);
        color += beams(angle, radius, 173.0, 9.0, 0.43, 0.67, 0.86, travel);
        // B: crisp, independently colored foreground streaks.
        color += beams(angle, radius, 317.0, 17.0, 0.30, 0.94, 0.66, travel * 2.0);
        color += beams(angle, radius, 557.0, 27.0, 0.25, 1.18, 0.39, travel * 2.0);
        // C: hairline inlays; subpixel coverage is handled by screen derivatives.
        color += beams(angle, radius, 1093.0, 41.0, 0.14, 1.47, 0.22, travel * 3.0);
        float engraving = pow(0.5 + 0.5 * sin(angle * TAU * 1531.0), 18.0);
        color *= 1.0 - engraving * smoothstep(0.08, 0.7, radius) * 0.18;
        float cluster = angle * 43.0;
        float clusterShade = mix(hash(floor(cluster) + 118.0), hash(floor(cluster) + 119.0),
                                 smoothstep(0.12, 0.88, fract(cluster)));
        color *= mix(0.025, 1.30, smoothstep(0.16, 0.80, clusterShade));
        // Short, crowded fragments build the ragged optical depth around the source.
        color += beams(angle, radius, 431.0, 61.0, 0.38, 2.35, 1.25, travel * 2.0)
               * (1.0 - smoothstep(0.13, 0.43, radius));
        color += beams(angle, radius, 719.0, 73.0, 0.28, 3.4, 0.90, travel * 3.0)
               * (1.0 - smoothstep(0.10, 0.31, radius));

        // D: hot irregular corona, warm scattered light, and compact white emitter.
        float corona = 1.0 + 0.08 * sin(angle * TAU * 37.0) + 0.045 * sin(angle * TAU * 83.0);
        float r = radius / uCoreRadius;
        float breath = 1.0 + 0.035 * sin(loop * TAU * 7.0);
        color += mix(vec3(1.0, 0.12, 0.003), pigment(0.38), uPaletteMode) * exp(-radius * 7.0) * 0.55;
        color += mix(vec3(1.0, 0.70, 0.008), pigment(0.72), uPaletteMode) * exp(-r * 0.64 / corona) * 3.2 * breath;
        color += mix(vec3(1.0, 0.97, 0.12), pigment(0.94), uPaletteMode) * exp(-r * r * 0.19 / corona) * 3.5;
        color += vec3(1.0) * exp(-pow(r, 3.0) * 0.72) * 9.0 * breath;
        gl_FragColor = vec4(color * uIntensity * uPulse, 1.0);
      }
    `;

    const camera = new THREE.Camera();
    const scene = new THREE.Scene();
    const geometry = new THREE.PlaneGeometry(2, 2);
    function material(fragmentShader, passUniforms) {
      return new THREE.ShaderMaterial({ vertexShader, fragmentShader, uniforms: passUniforms,
        depthTest: false, depthWrite: false, toneMapped: false });
    }
    const lightMaterial = material(lightShader, uniforms);
    const plane = new THREE.Mesh(geometry, lightMaterial);
    plane.frustumCulled = false;
    scene.add(plane);

    // HDR when renderable; normalized targets remain a compatible fallback.
    const hdr = renderer.extensions.has('EXT_color_buffer_float');
    const targetOptions = { type: hdr ? THREE.HalfFloatType : THREE.UnsignedByteType,
      minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: false, stencilBuffer: false };
    const image = new THREE.WebGLRenderTarget(1, 1, targetOptions);
    const bloomA = new THREE.WebGLRenderTarget(1, 1, targetOptions);
    const bloomB = new THREE.WebGLRenderTarget(1, 1, targetOptions);
    const bloomWide = new THREE.WebGLRenderTarget(1, 1, targetOptions);
    const brightMaterial = material(/* glsl */`
      varying vec2 vUv;
      uniform sampler2D tInput;
      void main() {
        vec3 color = texture2D(tInput, vUv).rgb;
        float light = max(color.r, max(color.g, color.b));
        gl_FragColor = vec4(color * smoothstep(0.65, 1.8, light), 1.0);
      }
    `, { tInput: { value: image.texture } });
    const blurUniforms = { tInput: { value: null }, uStep: { value: new THREE.Vector2() } };
    const blurMaterial = material(/* glsl */`
      varying vec2 vUv;
      uniform sampler2D tInput;
      uniform vec2 uStep;
      void main() {
        vec3 sum = texture2D(tInput, vUv).rgb * 0.227027;
        sum += texture2D(tInput, vUv + uStep * 1.384615).rgb * 0.316216;
        sum += texture2D(tInput, vUv - uStep * 1.384615).rgb * 0.316216;
        sum += texture2D(tInput, vUv + uStep * 3.230769).rgb * 0.070270;
        sum += texture2D(tInput, vUv - uStep * 3.230769).rgb * 0.070270;
        gl_FragColor = vec4(sum, 1.0);
      }
    `, blurUniforms);

    const compositeMaterial = material(/* glsl */`
      varying vec2 vUv;
      uniform sampler2D tImage, tBloom, tWide;
      uniform float uBloomStrength, uColorSaturation;
      uniform vec2 uResolution;
      uniform vec2 uCenter;
      uniform vec3 uTint, uBackground;
      uniform float uInvert, uKeepAccent, uGreenscreen, uAchromatic;
      vec3 filmic(vec3 x) {
        return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0);
      }
      void main() {
        vec2 radial = vUv - uCenter;
        vec2 offset = radial * 0.00065 * (1.0 - uAchromatic);
        vec3 color = texture2D(tImage, vUv).rgb;
        // A tiny optical color split and radial integration preserve hard silhouettes.
        color.r = mix(color.r, texture2D(tImage, vUv + offset).r, 0.32);
        color.b = mix(color.b, texture2D(tImage, vUv - offset).b, 0.32);
        color = color * 0.92 + texture2D(tImage, vUv - radial * 0.003).rgb * 0.08;
        color += (texture2D(tBloom, vUv).rgb * 0.72 + texture2D(tWide, vUv).rgb * 0.28) * uBloomStrength;
        float radiance = max(color.r, max(color.g, color.b));
        color = filmic(color * uTint);
        float luma = dot(color, vec3(0.2126, 0.7152, 0.0722));
        color = max(vec3(0.0), mix(vec3(luma), color, uColorSaturation));
        color = pow(color, vec3(1.0 / 2.2));
        float chroma = max(color.r, max(color.g, color.b)) - min(color.r, min(color.g, color.b));
        float keepAccent = uKeepAccent * smoothstep(0.03, 0.20, chroma);
        color = mix(color, vec3(1.0) - color, uInvert * (1.0 - keepAccent));
        float grain = fract(sin(dot(floor(vUv * uResolution), vec2(12.9898, 78.233))) * 43758.5453);
        color += (grain - 0.5) / 255.0;
        // Composite after tone mapping: chroma-key gaps are exactly #00ff00.
        float coverage = smoothstep(mix(0.004, 0.03, uGreenscreen), mix(0.10, 0.24, uGreenscreen), radiance);
        gl_FragColor = vec4(mix(uBackground, clamp(color, 0.0, 1.0), coverage), 1.0);
      }
    `, { tImage: { value: image.texture }, tBloom: { value: bloomA.texture },
      tWide: { value: bloomWide.texture }, uBloomStrength: uniforms.uBloomStrength,
      uColorSaturation: uniforms.uColorSaturation, uResolution: uniforms.uResolution,
      uCenter: uniforms.uCenter, uTint: { value: new THREE.Color(1, 1, 1) },
      uBackground: { value: new THREE.Vector3() }, uInvert: { value: 0 },
      uKeepAccent: { value: 0 }, uGreenscreen: { value: 0 }, uAchromatic: { value: 0 } });

    let gui;
    const backgroundColor = new THREE.Color();
    function applySettings() {
      uniforms.uIntensity.value = settings.intensity;
      uniforms.uBloomStrength.value = settings.bloomStrength;
      uniforms.uStreakDensity.value = settings.streakDensity;
      uniforms.uColorSaturation.value = settings.colorSaturation;
      uniforms.uCoreRadius.value = settings.coreRadius;
      uniforms.uLoopDuration.value = settings.loopDuration;
      uniforms.uSpeed.value = settings.speed;
      uniforms.uSeed.value = settings.seed;
      uniforms.uBeamWidth.value = settings.beamWidth;
      uniforms.uDepth.value = settings.depth;
      uniforms.uPaletteMode.value = Number(settings.scheme !== 'Original' || settings.customPalette);
      for (let i = 0; i < 6; i++) {
        uniforms.uPalette.value[i].set(settings['color' + (i + 1)]);
      }
      if (!settings.customPalette && ['Achromatic + Accent', 'Neutral + accent'].includes(settings.scheme)) {
        uniforms.uPalette.value[5].set(settings.accent);
      }
      const u = compositeMaterial.uniforms;
      u.uTint.value.set(settings.tint);
      u.uInvert.value = Number(settings.invert);
      u.uKeepAccent.value = Number(settings.scheme === 'Achromatic + Accent');
      u.uAchromatic.value = Number(settings.scheme.startsWith('Achromatic'));
      u.uGreenscreen.value = Number(settings.greenscreen);
      // The shader writes display-space background values directly.
      backgroundColor.set(settings.greenscreen ? '#00ff00' : settings.background).convertLinearToSRGB();
      if (settings.invert && !settings.greenscreen && settings.scheme.startsWith('Achromatic')) {
        backgroundColor.setRGB(1 - backgroundColor.r, 1 - backgroundColor.g, 1 - backgroundColor.b, THREE.LinearSRGBColorSpace);
      }
      u.uBackground.value.set(backgroundColor.r, backgroundColor.g, backgroundColor.b);
      resume();
    }
    function applyScheme() {
      const colors = schemes[settings.scheme];
      colors.forEach((hex, i) => { settings['color' + (i + 1)] = '#' + hex.toLowerCase(); });
      for (let i = colors.length; i < 6; i++) settings['color' + (i + 1)] = '#' + colors.at(-1).toLowerCase();
      settings.customPalette = false;
      settings.invert = false;
      if (settings.scheme.startsWith('Achromatic')) settings.background = '#000000';
      if (settings.scheme === 'Achromatic + Accent') settings.accent = '#ff2535';
      if (settings.scheme === 'Neutral + accent') settings.accent = '#e8a23a';
      applySettings();
      gui?.controllersRecursive().forEach(controller => controller.updateDisplay());
    }

    function resize() {
      const width = Math.max(1, window.innerWidth);
      const height = Math.max(1, window.innerHeight);
      const ratio = settings.maxPixelRatio;
      renderer.setPixelRatio(ratio);
      renderer.setSize(width, height, false);
      renderer.getDrawingBufferSize(uniforms.uResolution.value);
      const { x, y } = uniforms.uResolution.value;
      image.setSize(x, y);
      const bw = Math.max(1, Math.floor(x / 2)), bh = Math.max(1, Math.floor(y / 2));
      bloomA.setSize(bw, bh);
      bloomB.setSize(bw, bh);
      bloomWide.setSize(Math.max(1, Math.floor(bw / 2)), Math.max(1, Math.floor(bh / 2)));
    }
    function pass(passMaterial, target) {
      plane.material = passMaterial;
      renderer.setRenderTarget(target);
      renderer.render(scene, camera);
    }
    function blur(input, target, x, y) {
      blurUniforms.tInput.value = input.texture;
      blurUniforms.uStep.value.set(x / input.width, y / input.height);
      pass(blurMaterial, target);
    }
    function render() {
      pass(lightMaterial, image);
      pass(brightMaterial, bloomA);
      blur(bloomA, bloomB, 1.35, 0);
      blur(bloomB, bloomA, 0, 1.35);
      blur(bloomA, bloomWide, 3.5, 0);
      blur(bloomWide, bloomB, 0, 3.5);
      // bloomB holds the completed wider, two-axis halo.
      compositeMaterial.uniforms.tWide.value = bloomB.texture;
      pass(compositeMaterial, null);
    }

    const motion = matchMedia('(prefers-reduced-motion: reduce)');
    let elapsed = 0, lastTime = null, frame = 0, disposed = false, contextLost = false;
    const autoPose = { x: 0, y: 0, yaw: 0, pitch: 0, roll: 0, zoom: 1, pulse: 1, rotation: 0 };
    function updateView(dt, animate) {
      if (animate && settings.animation !== 'Static') {
        const t = elapsed / settings.loopDuration * Math.PI * 2;
        const a = settings.motionAmount;
        const target = { x: 0, y: 0, yaw: 0, pitch: 0, roll: 0, zoom: 1, pulse: 1, rotation: 0 };
        switch (settings.animation) {
          case 'Slow orbit':
            target.x = Math.cos(t) * 0.035 * a;
            target.y = Math.sin(t) * 0.028 * a;
            target.yaw = Math.sin(t) * 0.20 * a;
            target.pitch = Math.cos(t) * 0.14 * a;
            break;
          case 'Elliptic glide':
            target.x = Math.sin(t) * 0.055 * a;
            target.y = Math.sin(t * 2) * 0.018 * a;
            target.roll = Math.sin(t) * 0.035 * a;
            break;
          case 'Light breathing':
            target.zoom = 1 + Math.sin(t * 2) * 0.055 * a;
            target.pulse = 1 + Math.sin(t * 2) * 0.10 * a;
            break;
          case 'Chromatic tide':
            target.rotation = Math.sin(t) * 0.018 * a;
            target.pulse = 1 + Math.sin(t * 3) * 0.055 * a;
            target.yaw = Math.sin(t) * 0.08 * a;
            break;
          case 'Depth waves':
            target.zoom = 1 + Math.sin(t) * 0.09 * a;
            target.pitch = Math.sin(t * 2) * 0.10 * a;
            break;
          case 'Lantern sway':
            target.x = Math.sin(t) * 0.025 * a;
            target.y = Math.cos(t * 2) * 0.012 * a;
            target.roll = Math.sin(t) * 0.07 * a;
            break;
          case 'Gentle spiral':
            target.rotation = Math.sin(t) * 0.055 * a;
            target.x = Math.cos(t) * 0.012 * a;
            target.y = Math.sin(t) * 0.012 * a;
            target.zoom = 1 + Math.sin(t) * 0.035 * a;
            break;
        }
        const smoothing = 1 - Math.exp(-dt * 3);
        for (const key of Object.keys(autoPose)) autoPose[key] += (target[key] - autoPose[key]) * smoothing;
      }
      const inclination = THREE.MathUtils.degToRad(settings.orbitAngle);
      const c = Math.cos(inclination), s = Math.sin(inclination);
      uniforms.uCenter.value.set(0.49 + settings.positionX + autoPose.x * c - autoPose.y * s,
        0.52 - settings.positionY + autoPose.x * s + autoPose.y * c);
      // User zoom and angles remain independent of every animated camera offset.
      uniforms.uZoom.value = settings.zoom * autoPose.zoom;
      uniforms.uView.value.set(THREE.MathUtils.degToRad(settings.yaw) + autoPose.yaw,
        THREE.MathUtils.degToRad(settings.pitch) + autoPose.pitch,
        THREE.MathUtils.degToRad(settings.roll) + autoPose.roll);
      uniforms.uRotation.value = autoPose.rotation;
      uniforms.uPulse.value = autoPose.pulse;
    }
    function tick(now) {
      frame = 0;
      if (disposed || contextLost || document.hidden) return;
      const dt = lastTime === null ? 0 : Math.min((now - lastTime) / 1000, 0.1);
      const animate = !(settings.respectReducedMotion && motion.matches);
      if (animate && settings.animation !== 'Static') elapsed += dt * settings.speed / 0.025;
      lastTime = now;
      // Integrating speed avoids phase jumps while editing the speed control.
      elapsed %= settings.loopDuration;
      uniforms.uTime.value = elapsed;
      updateView(settings.speed > 0 ? dt : 0, animate);
      render();
      if (animate && settings.animation !== 'Static' && settings.speed > 0) frame = requestAnimationFrame(tick);
    }
    function resume() {
      if (!frame && !disposed && !contextLost && !document.hidden) {
        lastTime = null;
        frame = requestAnimationFrame(tick);
      }
    }
    function onResize() { resize(); resume(); }
    function onVisibility() {
      if (document.hidden) { cancelAnimationFrame(frame); frame = 0; lastTime = null; }
      else resume();
    }
    function onContextLost(event) {
      event.preventDefault();
      contextLost = true;
      cancelAnimationFrame(frame);
      frame = 0;
      lastTime = null;
    }
    function onContextRestored() { contextLost = false; resize(); resume(); }

    function refreshControls() { gui?.controllersRecursive().forEach(controller => controller.updateDisplay()); }
    function randomize() {
      const choose = values => values[Math.floor(Math.random() * values.length)];
      const between = (a, b) => a + Math.random() * (b - a);
      settings.scheme = choose(Object.keys(schemes));
      settings.seed = Math.floor(between(1, 999));
      settings.streakDensity = between(0.65, 1.65);
      settings.beamWidth = between(0.65, 1.45);
      settings.depth = between(0.7, 1.55);
      settings.coreRadius = between(0.027, 0.065);
      settings.intensity = between(0.85, 1.5);
      settings.bloomStrength = between(0.12, 0.42);
      settings.animation = choose(animations.slice(0, 8));
      settings.motionAmount = between(0.4, 1.25);
      settings.orbitAngle = between(-180, 180);
      settings.speed = between(0.012, 0.032);
      applyScheme();
      refreshControls();
    }
    const actions = {
      randomize,
      resetView() {
        Object.assign(settings, { zoom: 1, positionX: 0, positionY: 0, yaw: 0, pitch: 0, roll: 0, orbitAngle: 0 });
        refreshControls(); resume();
      },
    };
    // Canvas-only listeners keep GUI edits from triggering theme randomization.
    let drag = null;
    function onPointerDown(event) {
      if (drag || (event.button !== 0 && event.button !== 2)) return;
      canvas.setPointerCapture(event.pointerId);
      drag = { id: event.pointerId, x: event.clientX, y: event.clientY,
        startX: event.clientX, startY: event.clientY, distance: 0,
        angle: event.shiftKey || event.button === 2 };
    }
    function onPointerMove(event) {
      if (!drag || drag.id !== event.pointerId) return;
      const dx = event.clientX - drag.x, dy = event.clientY - drag.y;
      drag.distance = Math.max(drag.distance, Math.hypot(event.clientX - drag.startX, event.clientY - drag.startY));
      if (drag.angle) {
        settings.yaw = THREE.MathUtils.clamp(settings.yaw + dx * 0.15, -70, 70);
        settings.pitch = THREE.MathUtils.clamp(settings.pitch + dy * 0.15, -70, 70);
      } else {
        settings.positionX = THREE.MathUtils.clamp(settings.positionX + dx / innerWidth, -2, 2);
        settings.positionY = THREE.MathUtils.clamp(settings.positionY + dy / innerHeight, -2, 2);
      }
      drag.x = event.clientX; drag.y = event.clientY;
      refreshControls(); resume();
    }
    function onPointerUp(event) {
      if (!drag || drag.id !== event.pointerId) return;
      const click = drag.distance < 5 && !drag.angle && event.type === 'pointerup';
      drag = null;
      if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
      if (click && settings.randomizeOnClick) randomize();
    }
    function onWheel(event) {
      event.preventDefault();
      const delta = event.deltaY * (event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? innerHeight : 1);
      settings.zoom = THREE.MathUtils.clamp(settings.zoom * Math.exp(-THREE.MathUtils.clamp(delta, -200, 200) * 0.0015), 0.15, 6);
      refreshControls(); resume();
    }
    let uiVisible = true;
    function onKey(event) {
      if (event.repeat || event.ctrlKey || event.metaKey || event.altKey) return;
      if (event.target instanceof Element && event.target.closest('input, textarea, select, [contenteditable="true"]')) return;
      if (event.key.toLowerCase() === 'h' && gui) {
        gui.show(uiVisible = !uiVisible);
        resume();
      }
    }
    function onContextMenu(event) { event.preventDefault(); }

    function dispose() {
      disposed = true;
      cancelAnimationFrame(frame);
      window.removeEventListener('resize', onResize);
      document.removeEventListener('visibilitychange', onVisibility);
      motion.removeEventListener('change', resume);
      canvas.removeEventListener('webglcontextlost', onContextLost);
      canvas.removeEventListener('webglcontextrestored', onContextRestored);
      canvas.removeEventListener('pointerdown', onPointerDown);
      canvas.removeEventListener('pointermove', onPointerMove);
      canvas.removeEventListener('pointerup', onPointerUp);
      canvas.removeEventListener('pointercancel', onPointerUp);
      canvas.removeEventListener('lostpointercapture', onPointerUp);
      canvas.removeEventListener('wheel', onWheel);
      canvas.removeEventListener('contextmenu', onContextMenu);
      window.removeEventListener('keydown', onKey);
      gui?.destroy();
      [image, bloomA, bloomB, bloomWide, lightMaterial, brightMaterial,
        blurMaterial, compositeMaterial, geometry].forEach(resource => resource.dispose());
      renderer.dispose();
    }
    window.addEventListener('resize', onResize, { passive: true });
    document.addEventListener('visibilitychange', onVisibility);
    motion.addEventListener('change', resume);
    canvas.addEventListener('webglcontextlost', onContextLost);
    canvas.addEventListener('webglcontextrestored', onContextRestored);
    canvas.addEventListener('pointerdown', onPointerDown);
    canvas.addEventListener('pointermove', onPointerMove);
    canvas.addEventListener('pointerup', onPointerUp);
    canvas.addEventListener('pointercancel', onPointerUp);
    canvas.addEventListener('lostpointercapture', onPointerUp);
    canvas.addEventListener('wheel', onWheel, { passive: false });
    canvas.addEventListener('contextmenu', onContextMenu);
    window.addEventListener('keydown', onKey);
    window.addEventListener('pagehide', event => { if (!event.persisted) dispose(); });
    resize();
    applySettings();
    resume();

    try {
      const { default: GUI } = await import('https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js');
      if (!disposed) {
        gui = new GUI({ title: 'Chromatic Infinity' });
        gui.add(settings, 'scheme', Object.keys(schemes)).name('Color scheme').onChange(applyScheme);
        gui.add(settings, 'animation', animations).name('Animation');
        gui.add(settings, 'speed', 0, 0.06, 0.001).name('Animation speed');
        const colors = gui.addFolder('Colors');
        colors.addColor(settings, 'tint').name('Light tint');
        colors.addColor(settings, 'background').name('Background');
        colors.add(settings, 'greenscreen').name('Greenscreen');
        colors.add(settings, 'invert').name('Invert B/W');
        colors.addColor(settings, 'accent').name('Accent');
        colors.add(settings, 'customPalette').name('Custom palette');
        for (let i = 1; i <= 6; i++) {
          colors.addColor(settings, 'color' + i).name('Color ' + i).onChange(() => {
            settings.customPalette = true; refreshControls();
          });
        }
        colors.add(settings, 'colorSaturation', 0, 2, 0.01).name('Saturation');
        colors.close();
        const light = gui.addFolder('Light & geometry');
        light.add(settings, 'intensity', 0.1, 2.5, 0.01).name('Intensity');
        light.add(settings, 'bloomStrength', 0, 1, 0.01).name('Bloom');
        light.add(settings, 'coreRadius', 0.01, 0.12, 0.001).name('Core radius');
        light.add(settings, 'streakDensity', 0.3, 2, 0.01).name('Streak density');
        light.add(settings, 'beamWidth', 0.3, 1.8, 0.01).name('Beam width');
        light.add(settings, 'depth', 0.4, 2, 0.01).name('Depth');
        light.add(settings, 'seed', 0, 999, 1).name('Seed');
        light.close();
        const view = gui.addFolder('View & motion');
        view.add(settings, 'zoom', 0.15, 6, 0.01).name('Zoom');
        view.add(settings, 'positionX', -2, 2, 0.001).name('Position X');
        view.add(settings, 'positionY', -2, 2, 0.001).name('Position Y');
        view.add(settings, 'yaw', -70, 70, 0.1).name('Camera yaw');
        view.add(settings, 'pitch', -70, 70, 0.1).name('Camera pitch');
        view.add(settings, 'roll', -180, 180, 0.1).name('Camera roll');
        view.add(settings, 'orbitAngle', -180, 180, 0.1).name('Orbit angle');
        view.add(settings, 'motionAmount', 0, 2, 0.01).name('Motion amount');
        view.add(settings, 'loopDuration', 30, 180, 1).name('Loop duration');
        view.add(actions, 'resetView').name('Reset view');
        view.close();
        const system = gui.addFolder('Settings');
        system.add(settings, 'maxPixelRatio', 0.5, 3, 0.05).name('Pixel Ratio').onChange(resize);
        system.add(settings, 'respectReducedMotion').name('Reduced motion');
        system.add(settings, 'randomizeOnClick').name('Randomize on click');
        system.add(actions, 'randomize').name('Generate variation');
        system.close();
        gui.onChange(applySettings);
      }
    } catch (error) {
      console.error('Settings panel could not load:', error);
    }
  </script>
</body>
</html>
