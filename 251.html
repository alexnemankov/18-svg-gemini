<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >
    <title>Neon Kaleidoscope</title>

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #000000;
            user-select: none;
            -webkit-user-select: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.178.0/build/three.module.js",
            "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
        }
    }
    </script>
</head>

<body>

<script type="module">
import * as THREE from "three";
import GUI from "lil-gui";


// ============================================================
// Presets: Color Schemes & Animations
// ============================================================

const colorSchemes = {
    "Cyber Neon": {
        base: [0.020, 0.020, 0.761],
        range: [0.090, 0.129, 0.910],
        rate: [0.259, 0.580, 1.000],
        offset: [0.957, 0.341, 1.000],
        tint: "#ffffff",
        bgColor: "#000000"
    },
    "Cosmic Amethyst": {
        base: [0.500, 0.100, 0.600],
        range: [0.500, 0.400, 0.500],
        rate: [1.000, 0.800, 0.600],
        offset: [0.670, 0.200, 0.900],
        tint: "#ff88ff",
        bgColor: "#06000c"
    },
    "Solar Flare": {
        base: [0.700, 0.300, 0.050],
        range: [0.500, 0.400, 0.100],
        rate: [1.000, 1.000, 0.500],
        offset: [0.000, 0.333, 0.667],
        tint: "#ffbb44",
        bgColor: "#0a0300"
    },
    "Emerald Matrix": {
        base: [0.050, 0.600, 0.300],
        range: [0.100, 0.500, 0.400],
        rate: [0.500, 1.000, 0.800],
        offset: [0.300, 0.600, 0.900],
        tint: "#00ffaa",
        bgColor: "#000a04"
    },
    "Vaporwave Sunset": {
        base: [0.600, 0.400, 0.700],
        range: [0.400, 0.300, 0.400],
        rate: [0.800, 0.500, 0.300],
        offset: [0.250, 0.500, 0.750],
        tint: "#ffaacc",
        bgColor: "#080010"
    }
};

const animationPresets = {
    "Hypnotic Flow": {
        speed: 1.0,
        colorRate: 0.50,
        phaseRate: 1.00,
        layerShift: 0.50,
        hasOrbit: false
    },
    "Celestial Drift": {
        speed: 0.6,
        colorRate: 0.30,
        phaseRate: 0.60,
        layerShift: 0.35,
        hasOrbit: true
    },
    "Kaleido Pulse": {
        speed: 1.2,
        colorRate: 0.70,
        phaseRate: 1.80,
        layerShift: 0.65,
        hasOrbit: false
    },
    "Quantum Shimmer": {
        speed: 0.8,
        colorRate: 1.10,
        phaseRate: 0.40,
        layerShift: 0.80,
        hasOrbit: false
    },
    "Static Zen": {
        speed: 0.0,
        colorRate: 0.00,
        phaseRate: 0.00,
        layerShift: 0.50,
        hasOrbit: false
    }
};


// ============================================================
// Main Scene Parameters
// ============================================================

const params = {
    // Presets
    animationPreset: "Hypnotic Flow",
    colorScheme: "Cyber Neon",

    // Randomize on Click
    clickRandomize: true,

    // Greenscreen & Colors
    greenscreen: false,
    bgColor: "#000000",
    tint: "#ffffff",

    // Transform & Navigation
    zoom: 1.0,
    offsetX: 0.0,
    offsetY: 0.0,

    // Performance
    dpr: Math.min(window.devicePixelRatio || 1, 2),

    // Animation & Dynamics
    speed: 1.0,
    colorRate: 0.50,
    phaseRate: 1.00,
    layerShift: 0.50,

    // Geometry
    iterationCount: 10,
    cellScale: 1.16,
    formRadius: 0.69,
    formAngularity: 1.00,
    cornerWeight: 0.45,

    // Material
    bandFrequency: 36.10,
    bandDivisor: 3.41,
    lightWidth: 0.020,
    lightPower: 1.50
};


// ============================================================
// Renderer
// ============================================================

const renderer = new THREE.WebGLRenderer({
    antialias: false,
    alpha: false,
    powerPreference: "high-performance"
});

renderer.setPixelRatio(params.dpr);
renderer.setSize(window.innerWidth, window.innerHeight, false);
renderer.setClearColor(0x000000, 1);

renderer.toneMapping = THREE.NoToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;

document.body.appendChild(renderer.domElement);


// ============================================================
// Scene & Camera
// ============================================================

const scene = new THREE.Scene();
scene.name = "Geometric Luminous Recursion";

const camera = new THREE.Camera();
const resolution = new THREE.Vector2();
const offsetVec = new THREE.Vector2(0, 0);


// ============================================================
// Uniforms
// ============================================================

const uniforms = {
    uTime: { value: 0 },
    uResolution: { value: resolution },
    uOffset: { value: offsetVec },
    uZoom: { value: params.zoom },
    uAngle: { value: 0.0 },

    // Geometry
    uIterationCount: { value: params.iterationCount },
    uCellScale: { value: params.cellScale },
    uFormRadius: { value: params.formRadius },
    uFormAngularity: { value: params.formAngularity },
    uCornerWeight: { value: params.cornerWeight },

    // Material
    uBandFrequency: { value: params.bandFrequency },
    uBandDivisor: { value: params.bandDivisor },
    uLightWidth: { value: params.lightWidth },
    uLightPower: { value: params.lightPower },

    // Animation
    uColorRate: { value: params.colorRate },
    uPhaseRate: { value: params.phaseRate },
    uLayerShift: { value: params.layerShift },

    // Palette & Colors
    uColorBase: { value: new THREE.Vector3(...colorSchemes["Cyber Neon"].base) },
    uColorRange: { value: new THREE.Vector3(...colorSchemes["Cyber Neon"].range) },
    uColorRateVec: { value: new THREE.Vector3(...colorSchemes["Cyber Neon"].rate) },
    uColorOffset: { value: new THREE.Vector3(...colorSchemes["Cyber Neon"].offset) },
    uTint: { value: new THREE.Vector3(1, 1, 1) },
    uBgColor: { value: new THREE.Vector3(0, 0, 0) },
    uGreenscreen: { value: 0.0 }
};


// ============================================================
// Fullscreen Quad Geometry
// ============================================================

const geometry = new THREE.BufferGeometry();
geometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(
        [
            -1, -1, 0,
             3, -1, 0,
            -1,  3, 0
        ],
        3
    )
);


// ============================================================
// Shaders
// ============================================================

const vertexShader = /* glsl */`
precision highp float;
attribute vec3 position;

void main()
{
    gl_Position = vec4(position, 1.0);
}
`;

const fragmentShader = /* glsl */`
precision highp float;
precision highp int;

uniform float uTime;
uniform vec2 uResolution;
uniform vec2 uOffset;
uniform float uZoom;
uniform float uAngle;

uniform int uIterationCount;
uniform float uCellScale;
uniform float uFormRadius;
uniform float uFormAngularity;
uniform float uCornerWeight;

uniform float uBandFrequency;
uniform float uBandDivisor;
uniform float uColorRate;
uniform float uPhaseRate;
uniform float uLayerShift;
uniform float uLightWidth;
uniform float uLightPower;

// Colors & Greenscreen
uniform vec3 uColorBase;
uniform vec3 uColorRange;
uniform vec3 uColorRateVec;
uniform vec3 uColorOffset;
uniform vec3 uTint;
uniform vec3 uBgColor;
uniform float uGreenscreen;

#define MAX_ITERATIONS 12
const float MIN_DISTANCE = 0.0001;

vec2 rotate(vec2 p, float a)
{
    float s = sin(a);
    float c = cos(a);
    return vec2(p.x * c - p.y * s, p.x * s + p.y * c);
}

vec3 colorField(float phase)
{
    vec3 col = uColorBase + uColorRange * cos(6.2831853 * (uColorRateVec * phase + uColorOffset));
    return col * uTint;
}

float angularMetric(vec2 p)
{
    vec2 a = abs(p);
    float rounded = length(a);
    float faceted = (a.x + a.y) * uCornerWeight;
    return mix(rounded, faceted, uFormAngularity);
}

float shapeField(vec2 p)
{
    return angularMetric(p) - uFormRadius;
}

vec2 nextCell(vec2 p)
{
    return fract(p * uCellScale) - 0.5;
}

float luminousBand(float fieldValue, float timePhase)
{
    float wave = sin(fieldValue * uBandFrequency - timePhase) / uBandDivisor;
    float distanceToBand = max(abs(wave), MIN_DISTANCE);
    return pow(uLightWidth / distanceToBand, uLightPower);
}

void main()
{
    vec2 fragCoord = gl_FragCoord.xy;
    vec2 screen = (2.0 * fragCoord - uResolution.xy) / uResolution.y;

    // Pan, Zoom & Orbit transform
    vec2 domain = (screen - uOffset) / uZoom;
    if (uAngle != 0.0) {
        domain = rotate(domain, uAngle);
    }

    float radialDistance = length(domain);
    float radialFalloff = exp(-radialDistance);

    vec3 radiance = vec3(0.0);

    for (int layer = 0; layer < MAX_ITERATIONS; ++layer)
    {
        if (layer >= uIterationCount) {
            break;
        }

        float index = float(layer);
        domain = nextCell(domain);

        float geometryField = shapeField(domain) * radialFalloff;
        float colorPhase = radialDistance + index * uLayerShift + uTime * uColorRate;

        vec3 tint = colorField(colorPhase);
        float intensity = luminousBand(geometryField, uTime * uPhaseRate);

        radiance += tint * intensity;
    }

    // Background & Greenscreen blending
    vec3 finalColor;
    if (uGreenscreen > 0.5) {
        vec3 greenBg = vec3(0.0, 1.0, 0.0);
        float mask = clamp(max(radiance.r, max(radiance.g, radiance.b)) * 1.5, 0.0, 1.0);
        finalColor = mix(greenBg, radiance, mask);
    } else {
        finalColor = uBgColor + radiance;
    }

    gl_FragColor = vec4(finalColor, 1.0);
}
`;


// ============================================================
// Material & Mesh
// ============================================================

const material = new THREE.RawShaderMaterial({
    uniforms,
    vertexShader,
    fragmentShader,
    depthTest: false,
    depthWrite: false,
    transparent: false
});

const fullscreenTriangle = new THREE.Mesh(geometry, material);
fullscreenTriangle.frustumCulled = false;
scene.add(fullscreenTriangle);


// ============================================================
// Renderer & Uniform Synchronizers
// ============================================================

function updateResolution()
{
    renderer.getDrawingBufferSize(resolution);
}

function updateRendererSize()
{
    renderer.setPixelRatio(params.dpr);
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    updateResolution();
}

function updateColors()
{
    const tintColorObj = new THREE.Color(params.tint);
    uniforms.uTint.value.set(tintColorObj.r, tintColorObj.g, tintColorObj.b);

    const bgColorObj = new THREE.Color(params.bgColor);
    uniforms.uBgColor.value.set(bgColorObj.r, bgColorObj.g, bgColorObj.b);

    uniforms.uGreenscreen.value = params.greenscreen ? 1.0 : 0.0;
}

function applyColorScheme(schemeName)
{
    const scheme = colorSchemes[schemeName];
    if (!scheme) return;

    uniforms.uColorBase.value.set(...scheme.base);
    uniforms.uColorRange.value.set(...scheme.range);
    uniforms.uColorRateVec.value.set(...scheme.rate);
    uniforms.uColorOffset.value.set(...scheme.offset);

    params.tint = scheme.tint;
    params.bgColor = scheme.bgColor;
    updateColors();
}

function applyAnimationPreset(presetName)
{
    const preset = animationPresets[presetName];
    if (!preset) return;

    params.speed = preset.speed;
    params.colorRate = preset.colorRate;
    params.phaseRate = preset.phaseRate;
    params.layerShift = preset.layerShift;

    uniforms.uColorRate.value = params.colorRate;
    uniforms.uPhaseRate.value = params.phaseRate;
    uniforms.uLayerShift.value = params.layerShift;
}

function updateUniforms()
{
    uniforms.uIterationCount.value = Math.round(params.iterationCount);
    uniforms.uCellScale.value = params.cellScale;
    uniforms.uFormRadius.value = params.formRadius;
    uniforms.uFormAngularity.value = params.formAngularity;
    uniforms.uCornerWeight.value = params.cornerWeight;

    uniforms.uBandFrequency.value = params.bandFrequency;
    uniforms.uBandDivisor.value = params.bandDivisor;
    uniforms.uLightWidth.value = params.lightWidth;
    uniforms.uLightPower.value = params.lightPower;

    uniforms.uColorRate.value = params.colorRate;
    uniforms.uPhaseRate.value = params.phaseRate;
    uniforms.uLayerShift.value = params.layerShift;

    uniforms.uZoom.value = params.zoom;
    uniforms.uOffset.value.set(params.offsetX, params.offsetY);

    updateColors();
}


// ============================================================
// Procedural Scene Randomizer
// ============================================================

const colorSchemeKeys = Object.keys(colorSchemes);
const animationKeys = Object.keys(animationPresets);

function randomizeScene()
{
    // Randomize Color Scheme
    const randomSchemeKey = colorSchemeKeys[Math.floor(Math.random() * colorSchemeKeys.length)];
    params.colorScheme = randomSchemeKey;
    applyColorScheme(randomSchemeKey);

    // Randomize Geometry
    params.iterationCount = Math.floor(THREE.MathUtils.randFloat(5, 11));
    params.cellScale = +THREE.MathUtils.randFloat(0.85, 2.10).toFixed(2);
    params.formRadius = +THREE.MathUtils.randFloat(0.40, 1.30).toFixed(2);
    params.formAngularity = +THREE.MathUtils.randFloat(0.00, 1.00).toFixed(2);
    params.cornerWeight = +THREE.MathUtils.randFloat(0.20, 0.80).toFixed(2);

    // Randomize Material
    params.bandFrequency = +THREE.MathUtils.randFloat(18.0, 48.0).toFixed(1);
    params.bandDivisor = +THREE.MathUtils.randFloat(2.0, 8.0).toFixed(2);
    params.lightWidth = +THREE.MathUtils.randFloat(0.012, 0.035).toFixed(3);
    params.lightPower = +THREE.MathUtils.randFloat(1.2, 2.6).toFixed(2);

    // Randomize Dynamics if not in Static Zen
    if (params.animationPreset !== "Static Zen") {
        params.colorRate = +THREE.MathUtils.randFloat(0.25, 0.90).toFixed(2);
        params.phaseRate = +THREE.MathUtils.randFloat(0.40, 1.80).toFixed(2);
        params.layerShift = +THREE.MathUtils.randFloat(0.30, 0.75).toFixed(2);
    }

    updateUniforms();
    refreshAllControllers();
}


// ============================================================
// GUI Setup
// ============================================================

const gui = new GUI({ title: "Kaleidoscope Settings" });
const allControllers = [];

// Presets Folder
const presetsFolder = gui.addFolder("Presets & Modes");

const animController = presetsFolder
    .add(params, "animationPreset", Object.keys(animationPresets))
    .name("Animation Preset")
    .onChange(value => {
        applyAnimationPreset(value);
        refreshAllControllers();
    });
allControllers.push(animController);

const colorPresetController = presetsFolder
    .add(params, "colorScheme", Object.keys(colorSchemes))
    .name("Color Scheme")
    .onChange(value => {
        applyColorScheme(value);
        refreshAllControllers();
    });
allControllers.push(colorPresetController);

const clickRandomizeController = presetsFolder
    .add(params, "clickRandomize")
    .name("Randomize on Click");
allControllers.push(clickRandomizeController);

presetsFolder.add({ randomize: () => randomizeScene() }, "randomize").name("🎲 Randomize Scene");

// Navigation & Camera Folder
const transformFolder = gui.addFolder("View & Navigation");

const zoomController = transformFolder
    .add(params, "zoom", 0.1, 15.0, 0.05)
    .name("Zoom")
    .onChange(val => {
        uniforms.uZoom.value = val;
    });
allControllers.push(zoomController);

const offsetXController = transformFolder
    .add(params, "offsetX", -4.0, 4.0, 0.01)
    .name("Pan X")
    .onChange(val => {
        uniforms.uOffset.value.x = val;
    });
allControllers.push(offsetXController);

const offsetYController = transformFolder
    .add(params, "offsetY", -4.0, 4.0, 0.01)
    .name("Pan Y")
    .onChange(val => {
        uniforms.uOffset.value.y = val;
    });
allControllers.push(offsetYController);

transformFolder.add({
    reset: () => {
        params.zoom = 1.0;
        params.offsetX = 0.0;
        params.offsetY = 0.0;
        uniforms.uZoom.value = 1.0;
        uniforms.uOffset.value.set(0, 0);
        refreshAllControllers();
    }
}, "reset").name("Reset View");

// Colors & Greenscreen Folder
const colorsFolder = gui.addFolder("Colors & Background");

const greenscreenController = colorsFolder
    .add(params, "greenscreen")
    .name("Greenscreen (#00ff00)")
    .onChange(val => {
        uniforms.uGreenscreen.value = val ? 1.0 : 0.0;
    });
allControllers.push(greenscreenController);

const bgColorController = colorsFolder
    .addColor(params, "bgColor")
    .name("Background Color")
    .onChange(() => {
        updateColors();
    });
allControllers.push(bgColorController);

const tintController = colorsFolder
    .addColor(params, "tint")
    .name("Color Tint")
    .onChange(() => {
        updateColors();
    });
allControllers.push(tintController);

// Animation Dynamics Folder
const animationFolder = gui.addFolder("Animation Dynamics");

const speedController = animationFolder
    .add(params, "speed", 0.0, 3.0, 0.05)
    .name("Speed");
allControllers.push(speedController);

const colorRateController = animationFolder
    .add(params, "colorRate", 0.0, 2.0, 0.01)
    .name("Color Rate")
    .onChange(val => {
        uniforms.uColorRate.value = val;
    });
allControllers.push(colorRateController);

const phaseRateController = animationFolder
    .add(params, "phaseRate", 0.0, 3.0, 0.01)
    .name("Phase Rate")
    .onChange(val => {
        uniforms.uPhaseRate.value = val;
    });
allControllers.push(phaseRateController);

const layerShiftController = animationFolder
    .add(params, "layerShift", 0.0, 2.0, 0.01)
    .name("Layer Shift")
    .onChange(val => {
        uniforms.uLayerShift.value = val;
    });
allControllers.push(layerShiftController);

// Geometry Folder
const geometryFolder = gui.addFolder("Geometry");

allControllers.push(
    geometryFolder
        .add(params, "iterationCount", 1, 12, 1)
        .name("Iterations")
        .onChange(val => {
            uniforms.uIterationCount.value = Math.round(val);
        }),
    geometryFolder
        .add(params, "cellScale", 0.5, 3.0, 0.01)
        .name("Cell Scale")
        .onChange(val => {
            uniforms.uCellScale.value = val;
        }),
    geometryFolder
        .add(params, "formRadius", 0.1, 2.0, 0.01)
        .name("Form Radius")
        .onChange(val => {
            uniforms.uFormRadius.value = val;
        }),
    geometryFolder
        .add(params, "formAngularity", 0.0, 1.0, 0.01)
        .name("Form Angularity")
        .onChange(val => {
            uniforms.uFormAngularity.value = val;
        }),
    geometryFolder
        .add(params, "cornerWeight", 0.1, 1.0, 0.01)
        .name("Corner Weight")
        .onChange(val => {
            uniforms.uCornerWeight.value = val;
        })
);

// Material Folder
const materialFolder = gui.addFolder("Material & Glow");

allControllers.push(
    materialFolder
        .add(params, "bandFrequency", 1.0, 60.0, 0.1)
        .name("Band Frequency")
        .onChange(val => {
            uniforms.uBandFrequency.value = val;
        }),
    materialFolder
        .add(params, "bandDivisor", 0.5, 15.0, 0.01)
        .name("Band Divisor")
        .onChange(val => {
            uniforms.uBandDivisor.value = val;
        }),
    materialFolder
        .add(params, "lightWidth", 0.001, 0.1, 0.001)
        .name("Light Width")
        .onChange(val => {
            uniforms.uLightWidth.value = val;
        }),
    materialFolder
        .add(params, "lightPower", 0.1, 4.0, 0.01)
        .name("Light Power")
        .onChange(val => {
            uniforms.uLightPower.value = val;
        })
);

// Performance Folder
const performanceFolder = gui.addFolder("Performance");

const dprController = performanceFolder
    .add(params, "dpr", {
        "0.5x (Fast)": 0.5,
        "0.75x": 0.75,
        "1.0x (Standard)": 1.0,
        "1.5x (Crisp)": 1.5,
        "2.0x (Retina)": 2.0,
        "2.5x": 2.5,
        "3.0x (Ultra)": 3.0
    })
    .name("DPR (Pixel Ratio)")
    .onChange(() => {
        updateRendererSize();
    });
allControllers.push(dprController);

function refreshAllControllers()
{
    for (let i = 0; i < allControllers.length; i++) {
        allControllers[i].updateDisplay();
    }
}


// ============================================================
// Pointer Interaction: Drag & Wheel Zoom & Click-to-Randomize
// ============================================================

const canvas = renderer.domElement;
let isDragging = false;
let dragStart = { x: 0, y: 0 };
let initialOffset = { x: 0, y: 0 };
let totalDragDistance = 0;

canvas.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    isDragging = true;
    dragStart = { x: e.clientX, y: e.clientY };
    initialOffset = { x: params.offsetX, y: params.offsetY };
    totalDragDistance = 0;
});

window.addEventListener("pointermove", (e) => {
    if (!isDragging) return;

    const dx = e.clientX - dragStart.x;
    const dy = e.clientY - dragStart.y;
    totalDragDistance = Math.hypot(dx, dy);

    // Screen coordinate scale (1:1 direct tracking)
    const scale = 2.0 / window.innerHeight;
    params.offsetX = initialOffset.x + dx * scale;
    params.offsetY = initialOffset.y - dy * scale;

    uniforms.uOffset.value.set(params.offsetX, params.offsetY);
    offsetXController.updateDisplay();
    offsetYController.updateDisplay();
});

window.addEventListener("pointerup", (e) => {
    if (!isDragging) return;
    isDragging = false;

    // Distinguish click from dragging
    if (totalDragDistance < 6 && params.clickRandomize) {
        randomizeScene();
    }
});

// Wheel zoom
window.addEventListener("wheel", (e) => {
    e.preventDefault();
    const zoomMultiplier = e.deltaY < 0 ? 1.08 : 0.925;
    params.zoom = Math.max(0.1, Math.min(20.0, params.zoom * zoomMultiplier));
    uniforms.uZoom.value = params.zoom;
    zoomController.updateDisplay();
}, { passive: false });


// ============================================================
// Keyboard: Toggle UI with "H" key
// ============================================================

window.addEventListener("keydown", (e) => {
    if (e.key === "h" || e.key === "H") {
        if (gui.domElement) {
            const isHidden = gui.domElement.style.display === "none";
            gui.domElement.style.display = isHidden ? "" : "none";
        }
    }
});


// ============================================================
// Window Resize
// ============================================================

window.addEventListener("resize", () => {
    updateRendererSize();
});


// ============================================================
// Initialization & Animation Loop
// ============================================================

applyColorScheme("Cyber Neon");
applyAnimationPreset("Hypnotic Flow");
updateUniforms();
updateRendererSize();

const clock = new THREE.Clock();
let accumulatedTime = 0;

function animate()
{
    const delta = clock.getDelta();

    if (params.animationPreset !== "Static Zen") {
        accumulatedTime += delta * params.speed;
    }

    const currentPreset = animationPresets[params.animationPreset];
    if (currentPreset && currentPreset.hasOrbit && params.speed > 0) {
        uniforms.uAngle.value = accumulatedTime * 0.12;
    } else {
        uniforms.uAngle.value = 0.0;
    }

    uniforms.uTime.value = accumulatedTime;

    renderer.render(scene, camera);
}

renderer.setAnimationLoop(animate);
