<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDF Volumetric Matrix</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
            }
        }
    </script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000000;
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
        }
        body:active {
            cursor: grabbing;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <script type="module">
        import * as THREE from 'three';
        import GUI from 'lil-gui';

        // =========================================================================================
        // POST PROCESSOR SUITE (Inlined from postprocessing/PostProcessor.js for Standalone Execution)
        // =========================================================================================
        const orthoVertexShader = `
        precision highp float;
        in vec3 position;
        out vec2 vUv;
        void main() {
          vUv = position.xy * 0.5 + 0.5;
          gl_Position = vec4(position, 1.0);
        }
        `;

        const brightFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        uniform float bloomThreshold;
        in vec2 vUv;
        out vec4 fragColor;

        void main() {
          vec4 color = texture(inputTexture, vUv);
          float luminance = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
          float knee = 0.1;
          float soft = luminance - bloomThreshold + knee;
          soft = clamp(soft, 0.0, 2.0 * knee);
          soft = (soft * soft) / (4.0 * knee + 0.00001);
          float contribution = max(soft, luminance - bloomThreshold);
          contribution /= max(luminance, 0.00001);
          fragColor = vec4(color.rgb * contribution, color.a);
        }
        `;

        const blur13ShaderChunk = `
        vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
          vec2 resolution = vec2(textureSize(image, 0));
          vec4 color = vec4(0.0);
          vec2 off1 = vec2(1.411764705882353) * direction;
          vec2 off2 = vec2(3.2941176470588234) * direction;
          vec2 off3 = vec2(5.176470588235294) * direction;
          color += texture(image, uv) * 0.1964825501511404;
          color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
          color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
          color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
          color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
          color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
          color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
          return color;
        }
        `;

        const blurFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        uniform vec2 direction;
        in vec2 vUv;
        out vec4 color;
        ${blur13ShaderChunk}
        void main() {
          color = blur13(inputTexture, vUv, direction);
        }
        `;

        const finalFragmentShader = `
        precision highp float;
        uniform vec2 resolution;
        uniform sampler2D inputTexture;
        uniform sampler2D blur0Texture;
        uniform sampler2D blur1Texture;
        uniform sampler2D blur2Texture;
        uniform sampler2D blur3Texture;
        uniform sampler2D blur4Texture;
        uniform bool bloomEnabled;
        uniform float bloomStrength;
        uniform float vignetteBoost;
        uniform float vignetteReduction;
        uniform float noiseIntensity;
        uniform float time;
        in vec2 vUv;
        out vec4 fragColor;

        float vignette(vec2 uv, float boost, float reduction) {
          vec2 position = vUv - 0.5;
          return boost - length(position) * reduction;
        }

        float hash1(uint n) {
          n = (n << 13U) ^ n;
          n = n * (n * n * 15731U + 789221U) + 1376312589U;
          return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
        }

        float noise(in vec2 uv, in float timeVal) {
          uvec2 p = uvec2(uv);
          return hash1(p.x + 1920U * p.y + (1920U * 1080U) * uint(timeVal));
        }

        void main() {
          vec4 color = texture(inputTexture, vUv);

          if (bloomEnabled && bloomStrength > 0.001) {
            vec4 b0 = texture(blur0Texture, vUv);
            vec4 b1 = texture(blur1Texture, vUv);
            vec4 b2 = texture(blur2Texture, vUv);
            vec4 b3 = texture(blur3Texture, vUv);
            vec4 b4 = texture(blur4Texture, vUv);

            vec4 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
            color += bloomSum * bloomStrength;
          }

          color.rgb *= vignette(vUv, vignetteBoost, vignetteReduction);
          color.rgb += noiseIntensity * noise(gl_FragCoord.xy, time);
          fragColor = vec4(color.rgb, 1.0);
        }
        `;

        const chromaticAberrationShaderChunk = `
        vec2 barrelDistortion(vec2 coord, float amt) {
          vec2 cc = coord - 0.5;
          float dist = dot(cc, cc);
          return coord + cc * dist * amt;
        }
        float sat(float t) { return clamp(t, 0.0, 1.0); }
        float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
        float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
        vec4 spectrum_offset(float t) {
          float lo = step(t, 0.5);
          float hi = 1.0 - lo;
          float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
          vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
          return pow(ret, vec4(1.0 / 2.2));
        }
        const float max_distort = 2.2;
        const int num_iter = 8;
        const float reci_num_iter_f = 1.0 / float(num_iter);
        vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
          vec4 sumcol = vec4(0.0);
          vec4 sumw = vec4(0.0);
          for (int i = 0; i < num_iter; ++i) {
            float t = float(i) * reci_num_iter_f;
            vec4 w = spectrum_offset(t);
            sumw += w;
            sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
          }
          return sumcol / sumw;
        }
        `;

        const colorFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        uniform float chromaticAberrationAmount;
        uniform float minInputLevel;
        uniform float maxInputLevel;
        uniform float gammaLevel;
        uniform float fisheyeStrength;
        uniform float fisheyeRadius;
        uniform float time;
        in vec2 vUv;
        out vec4 fragColor;

        ${chromaticAberrationShaderChunk}

        vec2 applyFisheye(vec2 uv, float strength, float radius) {
          if (abs(strength) < 0.0001) return uv;
          vec2 p = uv - 0.5;
          float d = length(p);
          if (d > radius * 1.5) return uv;
          float r = d / max(radius, 0.001);
          float theta = atan(p.y, p.x);
          float rDist = r + strength * (r * r * r);
          return 0.5 + vec2(cos(theta), sin(theta)) * (rDist * radius);
        }

        vec3 gammaCorrect(vec3 color, vec3 gamma) {
          return pow(max(color, vec3(0.0)), 1.0 / gamma);
        }
        vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
          return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
        }
        vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
          return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
        }
        void main() {
          vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
          fragColor = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
          fragColor.rgb = finalLevels(fragColor.rgb, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
          fragColor.a = 1.0;
        }
        `;

        const copyFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        in vec2 vUv;
        out vec4 fragColor;
        void main() {
          fragColor = texture(inputTexture, vUv);
        }
        `;

        function createFBO(w, h, options = {}) {
          return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
            wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
            wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
            minFilter: options.minFilter || THREE.LinearFilter,
            magFilter: options.magFilter || THREE.LinearFilter,
            format: options.format || THREE.RGBAFormat,
            type: options.type || THREE.HalfFloatType,
            stencilBuffer: options.stencilBuffer || false,
            depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : true,
            samples: options.samples || 0,
          });
        }

        class ShaderPass {
          constructor(shader, options = {}) {
            this.shader = shader;
            this.orthoScene = new THREE.Scene();
            this.fbo = createFBO(1, 1, options);
            this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
            this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
            this.orthoScene.add(this.orthoQuad);
            this.texture = this.fbo.texture;
          }
          render(renderer, toScreen = false) {
            if (!toScreen) {
              renderer.setRenderTarget(this.fbo);
            }
            renderer.render(this.orthoScene, this.orthoCamera);
            if (!toScreen) {
              renderer.setRenderTarget(null);
            }
          }
          setSize(width, height) {
            this.fbo.setSize(Math.max(1, width), Math.max(1, height));
            this.orthoQuad.scale.set(width, height, 1);
          }
        }

        class ShaderPingPongPass {
          constructor(shader, options = {}) {
            this.shader = shader;
            this.orthoScene = new THREE.Scene();
            this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
            this.currentFBO = 0;
            this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
            this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
            this.orthoScene.add(this.orthoQuad);
          }
          render(renderer) {
            renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
            renderer.render(this.orthoScene, this.orthoCamera);
            renderer.setRenderTarget(null);
            this.currentFBO = 1 - this.currentFBO;
          }
          get current() { return this.fbos[this.currentFBO]; }
          get texture() { return this.current.texture; }
          setSize(width, height) {
            const w = Math.max(1, width);
            const h = Math.max(1, height);
            this.orthoQuad.scale.set(w, h, 1);
            this.fbos[0].setSize(w, h);
            this.fbos[1].setSize(w, h);
          }
        }

        class BloomPass {
          constructor(strength = 0.8, radius = 0.5, threshold = 0.2, levels = 5) {
            this.strength = strength;
            this.radius = radius;
            this.threshold = threshold;
            this.enabled = true;
            this.levels = levels;

            this.brightShader = new THREE.RawShaderMaterial({
              uniforms: {
                inputTexture: { value: null },
                bloomThreshold: { value: this.threshold },
              },
              vertexShader: orthoVertexShader,
              fragmentShader: brightFragmentShader,
              glslVersion: THREE.GLSL3,
            });
            this.brightPass = new ShaderPass(this.brightShader, {
              format: THREE.RGBAFormat,
              type: THREE.HalfFloatType,
            });

            this.blurShader = new THREE.RawShaderMaterial({
              uniforms: {
                inputTexture: { value: null },
                direction: { value: new THREE.Vector2(0, 1) },
              },
              vertexShader: orthoVertexShader,
              fragmentShader: blurFragmentShader,
              glslVersion: THREE.GLSL3,
            });

            this.blurPasses = [];
            for (let i = 0; i < this.levels; i++) {
              this.blurPasses.push(new ShaderPingPongPass(this.blurShader, {
                format: THREE.RGBAFormat,
                type: THREE.HalfFloatType,
              }));
            }
          }

          setSize(w, h) {
            let tw = Math.max(1, w);
            let th = Math.max(1, h);
            this.brightPass.setSize(tw, th);
            for (let i = 0; i < this.levels; i++) {
              tw = Math.max(1, Math.round(tw / 2));
              th = Math.max(1, Math.round(th / 2));
              this.blurPasses[i].setSize(tw, th);
            }
          }

          set source(texture) {
            this.brightShader.uniforms.inputTexture.value = texture;
          }

          render(renderer) {
            if (!this.enabled || this.strength <= 0.001) return;

            this.brightShader.uniforms.bloomThreshold.value = this.threshold;
            this.brightPass.render(renderer);

            const baseOffset = Math.max(0.1, this.radius * 2.0);
            const u = this.blurShader.uniforms;

            for (let j = 0; j < this.levels; j++) {
              const blurPass = this.blurPasses[j];
              const stepOffset = baseOffset * (1.0 + j * 0.5);

              // Horizontal blur pass
              u.direction.value.set(stepOffset, 0);
              u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
              blurPass.render(renderer);

              // Vertical blur pass
              u.direction.value.set(0, stepOffset * 0.5);
              u.inputTexture.value = blurPass.current.texture;
              blurPass.render(renderer);
            }
          }
        }

        class PostProcessor {
          constructor(renderer, params = {}) {
            this.renderer = renderer;

            this.settings = {
              enabled: params.enabled !== undefined ? params.enabled : true,
              bloomEnabled: params.bloomEnabled !== undefined ? params.bloomEnabled : true,
              bloomStrength: params.bloomStrength !== undefined ? params.bloomStrength : 1.2,
              bloomRadius: params.bloomRadius !== undefined ? params.bloomRadius : 0.6,
              bloomThreshold: params.bloomThreshold !== undefined ? params.bloomThreshold : 0.15,
              fisheyeStrength: params.fisheyeStrength !== undefined ? params.fisheyeStrength : 0.0,
              fisheyeRadius: params.fisheyeRadius !== undefined ? params.fisheyeRadius : 1.0,
              chromaticAberration: params.chromaticAberration !== undefined ? params.chromaticAberration : 0.03,
              vignetteBoost: params.vignetteBoost !== undefined ? params.vignetteBoost : 1.0,
              vignetteReduction: params.vignetteReduction !== undefined ? params.vignetteReduction : 0.45,
              noiseIntensity: params.noiseIntensity !== undefined ? params.noiseIntensity : 0.015,
              gamma: params.gamma !== undefined ? params.gamma : 1.0,
              minInputLevel: params.minInputLevel !== undefined ? params.minInputLevel : 0.0,
              maxInputLevel: params.maxInputLevel !== undefined ? params.maxInputLevel : 1.0,
            };

            this.sceneTarget = createFBO(1, 1, { type: THREE.HalfFloatType });

            this.bloomPass = new BloomPass(
              this.settings.bloomStrength,
              this.settings.bloomRadius,
              this.settings.bloomThreshold,
              5
            );

            this.finalShader = new THREE.RawShaderMaterial({
              uniforms: {
                resolution: { value: new THREE.Vector2(1, 1) },
                bloomEnabled: { value: this.settings.bloomEnabled },
                bloomStrength: { value: this.settings.bloomStrength },
                vignetteBoost: { value: this.settings.vignetteBoost },
                vignetteReduction: { value: this.settings.vignetteReduction },
                noiseIntensity: { value: this.settings.noiseIntensity },
                inputTexture: { value: null },
                blur0Texture: { value: null },
                blur1Texture: { value: null },
                blur2Texture: { value: null },
                blur3Texture: { value: null },
                blur4Texture: { value: null },
                time: { value: 0 },
              },
              vertexShader: orthoVertexShader,
              fragmentShader: finalFragmentShader,
              glslVersion: THREE.GLSL3,
            });
            this.finalPass = new ShaderPass(this.finalShader);

            this.rgbShader = new THREE.RawShaderMaterial({
              uniforms: {
                inputTexture: { value: this.finalPass.texture },
                fisheyeStrength: { value: this.settings.fisheyeStrength },
                fisheyeRadius: { value: this.settings.fisheyeRadius },
                chromaticAberrationAmount: { value: this.settings.chromaticAberration },
                minInputLevel: { value: this.settings.minInputLevel },
                maxInputLevel: { value: this.settings.maxInputLevel },
                gammaLevel: { value: this.settings.gamma },
                time: { value: 0 },
              },
              vertexShader: orthoVertexShader,
              fragmentShader: colorFragmentShader,
              glslVersion: THREE.GLSL3,
            });
            this.rgbPass = new ShaderPass(this.rgbShader);

            this.copyShader = new THREE.RawShaderMaterial({
              uniforms: {
                inputTexture: { value: null },
              },
              vertexShader: orthoVertexShader,
              fragmentShader: copyFragmentShader,
              glslVersion: THREE.GLSL3,
            });
            this.copyPass = new ShaderPass(this.copyShader);
          }

          updateSettings() {
            this.bloomPass.enabled = this.settings.bloomEnabled;
            this.bloomPass.strength = this.settings.bloomStrength;
            this.bloomPass.radius = this.settings.bloomRadius;
            this.bloomPass.threshold = this.settings.bloomThreshold;

            this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
            this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
            this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
            this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
            this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;

            this.rgbShader.uniforms.fisheyeStrength.value = this.settings.fisheyeStrength;
            this.rgbShader.uniforms.fisheyeRadius.value = this.settings.fisheyeRadius;
            this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
            this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
            this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
            this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
          }

          setSize(w0, h0, dpr = 1) {
            const w = Math.max(1, Math.floor(w0 * dpr));
            const h = Math.max(1, Math.floor(h0 * dpr));
            this.sceneTarget.setSize(w, h);
            this.finalPass.setSize(w, h);
            this.finalShader.uniforms.resolution.value.set(w, h);
            this.bloomPass.setSize(w, h);
            this.rgbPass.setSize(w, h);
            this.copyPass.setSize(w, h);
          }

          renderScene(scene, camera) {
            if (!this.settings.enabled) {
              this.renderer.render(scene, camera);
              return;
            }
            this.renderer.setRenderTarget(this.sceneTarget);
            this.renderer.render(scene, camera);
            this.renderer.setRenderTarget(null);
            this.render(this.sceneTarget.texture);
          }

          render(sourceTexture) {
            if (!this.settings.enabled) {
              this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
              this.copyPass.render(this.renderer, true);
              return;
            }

            this.updateSettings();

            this.bloomPass.source = sourceTexture;
            this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
            this.bloomPass.render(this.renderer);

            this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
            this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
            this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
            this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
            this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

            const randomTime = Math.random() * 100000;
            this.finalPass.shader.uniforms.time.value = randomTime;
            this.rgbPass.shader.uniforms.time.value = randomTime;

            this.finalPass.render(this.renderer);
            this.rgbPass.render(this.renderer, true);
          }

          attachGUI(gui, title = "Post Processor (PostProcessor.js)") {
            const root = gui.addFolder(title);
            root.add(this.settings, "enabled").name("Enable Suite");

            const bloom = root.addFolder("Bloom");
            bloom.add(this.settings, "bloomEnabled").name("Enable Bloom").onChange(() => this.updateSettings());
            bloom.add(this.settings, "bloomStrength", 0, 3.0, 0.05).name("Strength").onChange(() => this.updateSettings());
            bloom.add(this.settings, "bloomRadius", 0, 2.0, 0.05).name("Radius").onChange(() => this.updateSettings());
            bloom.add(this.settings, "bloomThreshold", 0, 1.0, 0.01).name("Threshold").onChange(() => this.updateSettings());

            const lens = root.addFolder("Lens, Optics & Color");
            lens.add(this.settings, "fisheyeStrength", -1.0, 1.5, 0.01).name("Fisheye Distortion").onChange(() => this.updateSettings());
            lens.add(this.settings, "fisheyeRadius", 0.2, 2.0, 0.05).name("Fisheye Radius").onChange(() => this.updateSettings());
            lens.add(this.settings, "chromaticAberration", 0, 0.2, 0.005).name("Chromatic Aberration").onChange(() => this.updateSettings());
            lens.add(this.settings, "vignetteBoost", 0, 2.0, 0.05).name("Vignette Boost").onChange(() => this.updateSettings());
            lens.add(this.settings, "vignetteReduction", 0, 2.0, 0.05).name("Vignette Falloff").onChange(() => this.updateSettings());
            lens.add(this.settings, "noiseIntensity", 0, 0.1, 0.005).name("Film Grain").onChange(() => this.updateSettings());
            lens.add(this.settings, "gamma", 0.2, 2.0, 0.05).name("Gamma").onChange(() => this.updateSettings());
            lens.add(this.settings, "minInputLevel", 0, 0.5, 0.01).name("Black Level").onChange(() => this.updateSettings());
            lens.add(this.settings, "maxInputLevel", 0.5, 1.0, 0.01).name("White Level").onChange(() => this.updateSettings());

            return root;
          }
        }

        // --- Color Palettes (10 Preconfigured Harmonies) ---
        const COLOR_SCHEMES = {
            'Monochromatic': {
                plasma: '#00f0ff',
                frame: '#a6f9ff',
                core: '#003b5c',

            },

        const PRIMITIVES = {
            'Torus (Ring Portal)': 0,
            'Menger Sponge (Fractal)': 1,
            'Gyroid Lattice (Bio-Foam)': 2,
            'Metaball Cluster (Liquid)': 3,
            'Octahedron Crystal': 4,
            'Mandelbox (Cubic Fractal)': 5,
            'Hexagonal Column': 6,
            'Hyper-Torus Matrix': 7
        };

        const ANIMATIONS = [
            'Smooth Orbit',
            'Breathing Pulse',
            'Cosmic Drift',
            'Tesseract Flux',
            'Ethereal Wave',
            'Hypnotic Spin',
            'Portal Vortex',
            'Static (No Movement)'
        ];

        // --- Three.js & Renderer Setup ---
        const canvas = document.createElement('canvas');
        document.body.appendChild(canvas);

        const renderer = new THREE.WebGLRenderer({
            canvas: canvas,
            antialias: false,
            powerPreference: 'high-performance'
        });
        renderer.setSize(window.innerWidth, window.innerHeight);

        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        const scene = new THREE.Scene();

        // --- PostProcessor Instance ---
        const postProcessor = new PostProcessor(renderer, {
            enabled: true,
            bloomEnabled: true,
            bloomStrength: 1.2,
            bloomRadius: 0.6,
            bloomThreshold: 0.15,
            chromaticAberration: 0.03,
            vignetteBoost: 1.0,
            vignetteReduction: 0.45,
            noiseIntensity: 0.015,
            gamma: 1.0
        });

        // --- Uniforms Definition ---
        const uniforms = {
            iTime: { value: 0.0 },
            iResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
            uMouseRot: { value: new THREE.Vector2(0.0, 0.0) },
            uOffset: { value: new THREE.Vector2(0.0, 0.0) },
            uZoom: { value: 1.0 },
            uPrimitive: { value: 0 },
            uFractalSpeed: { value: 1.0 },
            uRotationSpeed: { value: 0.5 },
            uPlasmaDensity: { value: 0.05 },
            uShapeStretch: { value: 0.8 },
            uShapeSize: { value: 2.5 },
            uNoiseScale: { value: 1.0 },
            uLatticeDensity: { value: 1.0 },
            uIsGreenScreen: { value: 0.0 },
            uIsWhiteAchromatic: { value: 0.0 },
            uBackgroundColor: { value: new THREE.Color(0x030c14) },
            uColorPlasma: { value: new THREE.Color(0x00f0ff) },
            uColorFrame: { value: new THREE.Color(0xa6f9ff) },
            uColorCore: { value: new THREE.Color(0x003b5c) }
        };

        // --- GLSL Raymarching Shader Material ---
        const material = new THREE.ShaderMaterial({
            vertexShader: `
                void main() {
                    gl_Position = vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                precision highp float;

                uniform float iTime;
                uniform vec2 iResolution;
                uniform vec2 uMouseRot;
                uniform vec2 uOffset;
                uniform float uZoom;
                uniform int uPrimitive;
                uniform float uFractalSpeed;
                uniform float uRotationSpeed;
                uniform float uPlasmaDensity;
                uniform float uShapeStretch;
                uniform float uShapeSize;
                uniform float uNoiseScale;
                uniform float uLatticeDensity;
                uniform float uIsGreenScreen;
                uniform float uIsWhiteAchromatic;
                uniform vec3 uBackgroundColor;
                uniform vec3 uColorPlasma;
                uniform vec3 uColorFrame;
                uniform vec3 uColorCore;

                const mat3 NOISE_TRANSFORM = mat3(
                    -0.21,  1.33,  0.52,
                     0.72, 0.52,  1.67,
                     0.77,  0.49,  0.18
                );

                float calculateNoise(vec3 pos) {
                    vec3 a = cos(NOISE_TRANSFORM * pos);
                    vec3 b = sin(17.1 * pos * NOISE_TRANSFORM);
                    return dot(a, b);
                }

                mat2 getRotationMatrix(float theta) {
                    float c = cos(theta);
                    float s = sin(theta);
                    return mat2(c, -s, s, c);
                }

                float smin(float a, float b, float k) {
                    float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
                    return mix(b, a, h) - k * h * (1.0 - h);
                }

                // --- SDF Primitives ---

                // 0: Torus / Ring Portal
                float sdTorus(vec3 p, vec2 t) {
                    vec2 q = vec2(length(p.xz) - t.x, p.y);
                    return (length(q) - t.y) * 0.7;
                }

                // 1: Menger Sponge Fractal
                float sdMenger(vec3 p, float size) {
                    vec3 d = abs(p) - vec3(size * 0.75);
                    float dBox = min(max(d.x, max(d.y, d.z)), 0.0) + length(max(d, 0.0));
                    float s = 1.0;
                    for (int m = 0; m < 3; m++) {
                        vec3 a = mod(p * s, 2.0) - 1.0;
                        s *= 3.0;
                        vec3 r = abs(1.0 - 3.0 * abs(a));
                        float da = max(r.x, r.y);
                        float db = max(r.y, r.z);
                        float dc = max(r.z, r.x);
                        float c = (min(da, min(db, dc)) - 1.0) / s;
                        dBox = max(dBox, c);
                    }
                    return dBox * 0.6;
                }

                // 2: Gyroid Infinite Lattice / Foam
                float sdGyroid(vec3 p, float size) {
                    vec3 gp = p * (1.3 * uLatticeDensity);
                    float g = abs(dot(sin(gp), cos(gp.zxy))) / (1.3 * uLatticeDensity) - 0.22;
                    float boundingSphere = length(p) - size * 1.05;
                    return max(boundingSphere, g * 0.55);
                }

                // 3: Metaball Field (Liquid Blobs)
                float sdMetaballs(vec3 p, float size, float time) {
                    float t = time * 0.7 * uFractalSpeed;
                    vec3 c1 = vec3(sin(t * 1.1), cos(t * 0.9), sin(t * 0.7)) * (size * 0.45);
                    vec3 c2 = vec3(cos(t * 0.8), sin(t * 1.2), cos(t * 1.0)) * (size * 0.5);
                    vec3 c3 = vec3(sin(t * 1.3 + 2.0), cos(t * 0.7 + 1.0), sin(t * 1.1 + 3.0)) * (size * 0.4);
                    vec3 c4 = vec3(cos(t * 1.0 + 4.0), sin(t * 0.8 + 2.0), cos(t * 1.4 + 1.0)) * (size * 0.48);

                    float d1 = length(p - c1) - size * 0.42;
                    float d2 = length(p - c2) - size * 0.38;
                    float d3 = length(p - c3) - size * 0.46;
                    float d4 = length(p - c4) - size * 0.35;
                    float dCenter = length(p) - size * 0.5;

                    float d = smin(d1, d2, 0.45);
                    d = smin(d, d3, 0.45);
                    d = smin(d, d4, 0.45);
                    d = smin(d, dCenter, 0.45);
                    return d * 0.6;
                }

                // 4: Octahedron Crystal
                float sdOctahedron(vec3 p, float s) {
                    return ((abs(p.x) + abs(p.y) + abs(p.z)) - s) * 0.45;
                }

                // 5: Mandelbox Fractal
                float sdMandelbox(vec3 p, float size) {
                    vec3 offset = p / max(size * 0.5, 0.1);
                    vec3 z = offset;
                    float dr = 1.0;
                    float scale = -2.3;
                    for (int n = 0; n < 4; n++) {
                        z = clamp(z, -1.0, 1.0) * 2.0 - z;
                        float r2 = dot(z, z);
                        if (r2 < 0.25) {
                            z *= 4.0;
                            dr *= 4.0;
                        } else if (r2 < 1.0) {
                            float temp = 1.0 / r2;
                            z *= temp;
                            dr *= temp;
                        }
                        z = z * scale + offset;
                        dr = dr * abs(scale) + 1.0;
                    }
                    float d = (length(z) - 1.4) / abs(dr);
                    return d * (size * 0.35);
                }

                // 6: Hexagonal Prism / Column
                float sdHexPrism(vec3 p, vec2 h) {
                    vec3 q = abs(p);
                    float dPlane = max(q.x * 0.866025 + q.y * 0.5, q.y) - h.x;
                    return max(q.z - h.y, dPlane) * 0.55;
                }

                // 7: Hyper-Torus Matrix
                float sdHyperTorus(vec3 p, float size) {
                    vec2 q1 = vec2(length(p.xz) - size * 0.7, p.y);
                    float d1 = length(q1) - size * 0.35;
                    vec2 q2 = vec2(length(p.yz) - size * 0.7, p.x);
                    float d2 = length(q2) - size * 0.35;
                    return smin(d1, d2, 0.3) * 0.65;
                }

                // --- Master Scene SDF Evaluator ---
                float mapSDF(vec3 p, float time) {
                    vec3 shapePos = p;
                    shapePos.y *= uShapeStretch;

                    if (uPrimitive == 0) {
                        return sdTorus(shapePos, vec2(uShapeSize * 0.75, uShapeSize * 0.35));
                    } else if (uPrimitive == 1) {
                        return sdMenger(shapePos, uShapeSize);
                    } else if (uPrimitive == 2) {
                        return sdGyroid(shapePos, uShapeSize);
                    } else if (uPrimitive == 3) {
                        return sdMetaballs(shapePos, uShapeSize, time);
                    } else if (uPrimitive == 4) {
                        return sdOctahedron(shapePos, uShapeSize);
                    } else if (uPrimitive == 5) {
                        return sdMandelbox(shapePos, uShapeSize);
                    } else if (uPrimitive == 6) {
                        return sdHexPrism(shapePos.xzy, vec2(uShapeSize * 0.7, uShapeSize * 0.9));
                    } else {
                        return sdHyperTorus(shapePos, uShapeSize);
                    }
                }

                // --- Edge Distance for Dynamic Lattices ---
                float getEdgeDist(vec3 p) {
                    vec3 shapePos = p;
                    shapePos.y *= uShapeStretch;

                    if (uPrimitive == 0) {
                        float ringDist = abs(length(shapePos.xz) - uShapeSize * 0.75);
                        return min(ringDist, abs(shapePos.y));
                    } else if (uPrimitive == 1) {
                        vec3 c = abs(mod(shapePos * (1.5 * uLatticeDensity) + 1.0, 2.0) - 1.0);
                        return min(c.x, min(c.y, c.z));
                    } else if (uPrimitive == 2) {
                        vec3 gp = shapePos * (1.3 * uLatticeDensity);
                        return abs(dot(sin(gp), cos(gp.zxy))) * 0.25;
                    } else if (uPrimitive == 3) {
                        return length(fract(shapePos * 1.4) - 0.5) * 0.45;
                    } else if (uPrimitive == 4) {
                        return min(abs(shapePos.x), min(abs(shapePos.y), abs(shapePos.z)));
                    } else if (uPrimitive == 5) {
                        vec3 c = abs(shapePos);
                        return min(abs(c.x - c.y), min(abs(c.y - c.z), abs(c.z - c.x)));
                    } else if (uPrimitive == 6) {
                        vec3 q = abs(shapePos);
                        return min(abs(q.y), min(abs(q.x * 0.866025 + q.y * 0.5), abs(q.z)));
                    } else {
                        float r1 = abs(length(shapePos.xz) - uShapeSize * 0.7);
                        float r2 = abs(length(shapePos.yz) - uShapeSize * 0.7);
                        return min(r1, r2);
                    }
                }

                void main() {
                    vec2 fragCoord = gl_FragCoord.xy;
                    vec2 uv = (fragCoord * 2.0 - iResolution.xy) / iResolution.y;

                    // Apply zoom & pan translation
                    uv = (uv - uOffset) * uZoom;
                    uv *= 0.82;

                    vec4 colorAccumulator = vec4(0.0);
                    float totalDistance = 0.0;
                    float globalTime = iTime;

                    for (int i = 0; i < 130; i++) {
                        float iterationFloat = float(i);
                        vec3 p = vec3(uv * totalDistance, totalDistance);
                        vec3 localPos = p;

                        localPos.z -= 6.0;
                        localPos.y -= sin(globalTime * 0.8) * 0.08;

                        // Rotations
                        localPos.xz *= getRotationMatrix(globalTime * 0.5 * uRotationSpeed + uMouseRot.x);
                        localPos.yz *= getRotationMatrix(sin(globalTime * 0.3) * 0.08 + uMouseRot.y);

                        float bounds = mapSDF(localPos, globalTime);

                        if (bounds > 0.005) {
                            totalDistance += bounds;
                        } else {
                            vec3 noisePos = localPos * uNoiseScale;
                            float timeOffset = globalTime * 0.1 * uFractalSpeed;
                            float wavePerturbation = sin(noisePos.z * 3.1 + noisePos.x * 1.7 + timeOffset) * -0.076 - 0.011;

                            float noiseHighFreq = calculateNoise(noisePos / 1.0 + globalTime * 0.2 * uFractalSpeed);
                            float noiseLowFreq = calculateNoise(noisePos / 4.5 + globalTime * 0.13 * uFractalSpeed) * 0.8;

                            float noiseVal = wavePerturbation + abs(noiseHighFreq - noiseLowFreq);
                            float surfaceDist = abs(bounds);
                            float edgeDist = getEdgeDist(localPos);

                            float edgeProximity = smoothstep(0.16, 0.0, edgeDist) * smoothstep(0.26, 0.0, surfaceDist);
                            float stepWithNoise = 0.02 + noiseVal * uPlasmaDensity;
                            float currentStep = mix(stepWithNoise, 0.015, edgeProximity);
                            currentStep = max(currentStep, 0.006);

                            float lineThickness = 0.045;
                            float lineIntensity = smoothstep(lineThickness, 0.008, edgeDist) * smoothstep(0.025, -0.12, surfaceDist);

                            vec4 frameColor = vec4(uColorFrame, 1.0) * lineIntensity * 13.5;
                            
                            // Rich harmonic plasma base coloration
                            vec3 harmonicBase = mix(uColorCore, uColorPlasma, 0.5 + 0.5 * cos(iterationFloat * 0.038 + globalTime * 0.4));
                            vec4 baseColor = vec4(harmonicBase, 1.1);
                            vec4 glowColor = baseColor * (0.8 + 0.4 * cos(iterationFloat * 0.034)) + iterationFloat * 0.014;
                            glowColor.rgb *= uColorPlasma;

                            colorAccumulator += (glowColor + frameColor) / (currentStep * currentStep * 140000.0);
                            totalDistance += currentStep;
                        }

                        if (totalDistance > 12.5) break;
                    }

                    // Green Screen Mode
                    if (uIsGreenScreen > 0.5) {
                        float alpha = clamp(length(colorAccumulator.rgb) * 1.8, 0.0, 1.0);
                        vec3 finalGlow = colorAccumulator.rgb;
                        vec3 greenBg = vec3(0.0, 1.0, 0.0);
                        gl_FragColor = vec4(mix(greenBg, finalGlow + greenBg * 0.15, alpha), 1.0);
                        return;
                    }

                    // Inverted Achromatic (White & Black)
                    if (uIsWhiteAchromatic > 0.5) {
                        float lum = clamp(length(colorAccumulator.rgb) * 0.9, 0.0, 1.0);
                        vec3 invertedColor = mix(vec3(1.0), vec3(0.02, 0.02, 0.02), lum);
                        gl_FragColor = vec4(invertedColor, 1.0);
                        return;
                    }

                    // Standard Rendering
                    vec3 finalCol = uBackgroundColor + colorAccumulator.rgb;
                    gl_FragColor = vec4(finalCol, 1.0);
                }
            `,
            uniforms: uniforms
        });

        const quadMesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
        scene.add(quadMesh);

        // --- Interaction & State Management ---
        const params = {
            dpr: Math.min(window.devicePixelRatio || 1.0, 2.0),
            primitive: 'Torus (Ring Portal)',
            colorScheme: 'Monochromatic',
            animationPreset: 'Smooth Orbit',
            greenScreen: false,
            animSpeed: 1.0,
            shapeSize: 2.5,
            shapeStretch: 0.8,
            fractalSpeed: 1.0,
            rotationSpeed: 0.5,
            plasmaDensity: 0.05,
            noiseScale: 1.0,
            latticeDensity: 1.0,
            colorPlasma: COLOR_SCHEMES['Monochromatic'].plasma,
            colorFrame: COLOR_SCHEMES['Monochromatic'].frame,
            colorCore: COLOR_SCHEMES['Monochromatic'].core,
            colorBg: COLOR_SCHEMES['Monochromatic'].bg,
            clickToRandomize: true
        };

        // Smooth camera / pan / zoom damping variables
        let isDragging = false;
        let isPanning = false;
        let dragStartPos = { x: 0, y: 0 };
        let lastMousePos = { x: 0, y: 0 };
        let targetRotation = { x: 0.0, y: 0.0 };
        let targetOffset = { x: 0.0, y: 0.0 };
        let targetZoom = 1.0;
        let didMoveSignificant = false;

        const ROTATION_SENSITIVITY = 0.0055;
        const PAN_SENSITIVITY = 0.0022;

        // Apply Color Scheme helper
        function applyColorScheme(schemeName) {
            const scheme = COLOR_SCHEMES[schemeName];
            if (!scheme) return;
            
            params.colorPlasma = scheme.plasma;
            params.colorFrame = scheme.frame;
            params.colorCore = scheme.core;
            params.colorBg = scheme.bg;

            uniforms.uColorPlasma.value.set(scheme.plasma);
            uniforms.uColorFrame.value.set(scheme.frame);
            uniforms.uColorCore.value.set(scheme.core);

            const isWhiteAchromatic = (schemeName === 'Achromatic (White & Black)');
            uniforms.uIsWhiteAchromatic.value = isWhiteAchromatic ? 1.0 : 0.0;

            if (params.greenScreen) {
                applyGreenScreen(true);
            } else {
                uniforms.uBackgroundColor.value.set(scheme.bg);
                document.body.style.backgroundColor = scheme.bg;
                renderer.setClearColor(scheme.bg, 1.0);
            }
        }

        // Green screen toggle helper
        function applyGreenScreen(enabled) {
            uniforms.uIsGreenScreen.value = enabled ? 1.0 : 0.0;
            if (enabled) {
                document.body.style.backgroundColor = '#00ff00';
                renderer.setClearColor('#00ff00', 1.0);
            } else {
                const currentBg = params.colorBg;
                document.body.style.backgroundColor = currentBg;
                renderer.setClearColor(currentBg, 1.0);
                uniforms.uBackgroundColor.value.set(currentBg);
            }
        }

        // Set primitive helper
        function applyPrimitive(primName) {
            uniforms.uPrimitive.value = PRIMITIVES[primName] ?? 0;
        }

        // Procedural Variation Generator (Randomizer)
        function randomizeScene() {
            const primitiveKeys = Object.keys(PRIMITIVES);
            const schemeKeys = Object.keys(COLOR_SCHEMES);
            const animKeys = ANIMATIONS.filter(a => a !== 'Static (No Movement)');

            // Pick random primitive, scheme, and animation
            params.primitive = primitiveKeys[Math.floor(Math.random() * primitiveKeys.length)];
            params.colorScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
            params.animationPreset = animKeys[Math.floor(Math.random() * animKeys.length)];

            // Randomize parameters within pleasing aesthetic ranges
            params.shapeSize = +(1.6 + Math.random() * 2.0).toFixed(2);
            params.shapeStretch = +(0.5 + Math.random() * 0.9).toFixed(2);
            params.fractalSpeed = +(0.4 + Math.random() * 1.8).toFixed(2);
            params.rotationSpeed = +(0.2 + Math.random() * 1.2).toFixed(2);
            params.plasmaDensity = +(0.025 + Math.random() * 0.055).toFixed(3);
            params.noiseScale = +(0.7 + Math.random() * 0.8).toFixed(2);
            params.latticeDensity = +(0.6 + Math.random() * 1.0).toFixed(2);

            // Apply updates
            applyPrimitive(params.primitive);
            applyColorScheme(params.colorScheme);

            uniforms.uShapeSize.value = params.shapeSize;
            uniforms.uShapeStretch.value = params.shapeStretch;
            uniforms.uFractalSpeed.value = params.fractalSpeed;
            uniforms.uRotationSpeed.value = params.rotationSpeed;
            uniforms.uPlasmaDensity.value = params.plasmaDensity;
            uniforms.uNoiseScale.value = params.noiseScale;
            uniforms.uLatticeDensity.value = params.latticeDensity;

            // Sync all GUI controls display
            gui.controllersRecursive().forEach(ctrl => ctrl.updateDisplay());
        }

        // --- GUI Configuration ---
        const gui = new GUI({ title: 'Energy Matrix Control' });

        const folderGeneral = gui.addFolder('General & Scene');
        folderGeneral.add(params, 'dpr', 0.5, 2.5, 0.1).name('Device Pixel Ratio (DPR)').onChange(v => {
            renderer.setPixelRatio(v);
            postProcessor.setSize(window.innerWidth, window.innerHeight, v);
        });
        folderGeneral.add(params, 'greenScreen').name('Green Screen (#00ff00)').onChange(applyGreenScreen);
        folderGeneral.add(params, 'clickToRandomize').name('Click Scene to Randomize');

        const folderGeometry = gui.addFolder('SDF Primitive & Geometry');
        folderGeometry.add(params, 'primitive', Object.keys(PRIMITIVES)).name('SDF Primitive').onChange(applyPrimitive);
        folderGeometry.add(params, 'shapeSize', 1.0, 4.5, 0.05).name('Shape Scale').onChange(v => uniforms.uShapeSize.value = v);
        folderGeometry.add(params, 'shapeStretch', 0.3, 2.0, 0.05).name('Vertical Ratio').onChange(v => uniforms.uShapeStretch.value = v);
        folderGeometry.add(params, 'latticeDensity', 0.4, 2.5, 0.05).name('Lattice Density').onChange(v => uniforms.uLatticeDensity.value = v);

        const folderAnimation = gui.addFolder('Animation & Motion');
        folderAnimation.add(params, 'animationPreset', ANIMATIONS).name('Animation Style');
        folderAnimation.add(params, 'animSpeed', 0.0, 3.0, 0.05).name('Global Speed');
        folderAnimation.add(params, 'rotationSpeed', 0.0, 3.0, 0.05).name('Auto Rotation').onChange(v => uniforms.uRotationSpeed.value = v);
        folderAnimation.add(params, 'fractalSpeed', 0.0, 3.0, 0.05).name('Fractal Flow').onChange(v => uniforms.uFractalSpeed.value = v);

        const folderPlasma = gui.addFolder('Plasma & Volumetrics');
        folderPlasma.add(params, 'plasmaDensity', 0.01, 0.12, 0.005).name('Plasma Density').onChange(v => uniforms.uPlasmaDensity.value = v);
        folderPlasma.add(params, 'noiseScale', 0.4, 2.5, 0.05).name('Noise Frequency').onChange(v => uniforms.uNoiseScale.value = v);

        const folderColors = gui.addFolder('Color Harmonies');
        folderColors.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Color Harmony').onChange(applyColorScheme);
        folderColors.addColor(params, 'colorPlasma').name('Plasma Glow').onChange(v => uniforms.uColorPlasma.value.set(v));
        folderColors.addColor(params, 'colorFrame').name('Frame / Edges').onChange(v => uniforms.uColorFrame.value.set(v));
        folderColors.addColor(params, 'colorCore').name('Harmonic Core').onChange(v => uniforms.uColorCore.value.set(v));
        folderColors.addColor(params, 'colorBg').name('Background').onChange(v => {
            if (!params.greenScreen) {
                uniforms.uBackgroundColor.value.set(v);
                document.body.style.backgroundColor = v;
                renderer.setClearColor(v, 1.0);
            }
        });

        // Attach PostProcessor Suite Controls Folder
        postProcessor.attachGUI(gui, 'Post Processor (PostProcessor.js)');

        // Initialize setup
        renderer.setPixelRatio(params.dpr);
        postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);
        applyPrimitive(params.primitive);
        applyColorScheme(params.colorScheme);

        // --- Keyboard Controls ('H' to toggle GUI) ---
        window.addEventListener('keydown', (e) => {
            if (e.key === 'h' || e.key === 'H') {
                gui._hidden ? gui.show() : gui.hide();
            }
        });

        // --- Mouse & Touch Controls (Rotate, Pan, Zoom, Click) ---
        function onPointerDown(e) {
            if (e.target.closest && e.target.closest('.lil-gui')) return;

            dragStartPos = { x: e.clientX, y: e.clientY };
            lastMousePos = { x: e.clientX, y: e.clientY };
            didMoveSignificant = false;

            if (e.button === 2 || e.shiftKey || e.button === 1) {
                isPanning = true;
            } else if (e.button === 0) {
                isDragging = true;
            }
        }

        function onPointerMove(e) {
            if (!isDragging && !isPanning) return;

            const deltaX = e.clientX - lastMousePos.x;
            const deltaY = e.clientY - lastMousePos.y;
            const totalDist = Math.hypot(e.clientX - dragStartPos.x, e.clientY - dragStartPos.y);

            if (totalDist > 5) {
                didMoveSignificant = true;
            }

            if (isPanning) {
                targetOffset.x += deltaX * PAN_SENSITIVITY * targetZoom;
                targetOffset.y -= deltaY * PAN_SENSITIVITY * targetZoom;
            } else if (isDragging) {
                targetRotation.x -= deltaX * ROTATION_SENSITIVITY;
                targetRotation.y += deltaY * ROTATION_SENSITIVITY;
            }

            lastMousePos = { x: e.clientX, y: e.clientY };
        }

        function onPointerUp(e) {
            if (!didMoveSignificant && params.clickToRandomize) {
                if (!(e.target.closest && e.target.closest('.lil-gui'))) {
                    randomizeScene();
                }
            }
            isDragging = false;
            isPanning = false;
        }

        // Mouse Wheel Zoom
        window.addEventListener('wheel', (e) => {
            if (e.target.closest && e.target.closest('.lil-gui')) return;
            e.preventDefault();
            const zoomDelta = e.deltaY * 0.0012;
            targetZoom = THREE.MathUtils.clamp(targetZoom * (1.0 + zoomDelta), 0.25, 4.0);
        }, { passive: false });

        window.addEventListener('mousedown', onPointerDown);
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);
        window.addEventListener('contextmenu', (e) => {
            if (!(e.target.closest && e.target.closest('.lil-gui'))) {
                e.preventDefault();
            }
        });

        // Touch support for mobile & tablet devices
        let initialPinchDist = null;
        window.addEventListener('touchstart', (e) => {
            if (e.target.closest && e.target.closest('.lil-gui')) return;
            if (e.touches.length === 1) {
                onPointerDown({
                    clientX: e.touches[0].clientX,
                    clientY: e.touches[0].clientY,
                    button: 0,
                    shiftKey: false,
                    target: e.target
                });
            } else if (e.touches.length === 2) {
                initialPinchDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                isPanning = true;
                isDragging = false;
                dragStartPos = {
                    x: (e.touches[0].clientX + e.touches[1].clientX) * 0.5,
                    y: (e.touches[0].clientY + e.touches[1].clientY) * 0.5
                };
                lastMousePos = { ...dragStartPos };
            }
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1) {
                onPointerMove({
                    clientX: e.touches[0].clientX,
                    clientY: e.touches[0].clientY
                });
            } else if (e.touches.length === 2 && initialPinchDist) {
                const currentDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                const zoomFactor = initialPinchDist / Math.max(currentDist, 1.0);
                targetZoom = THREE.MathUtils.clamp(targetZoom * (1.0 + (zoomFactor - 1.0) * 0.05), 0.25, 4.0);

                const centerPos = {
                    x: (e.touches[0].clientX + e.touches[1].clientX) * 0.5,
                    y: (e.touches[0].clientY + e.touches[1].clientY) * 0.5
                };
                const deltaX = centerPos.x - lastMousePos.x;
                const deltaY = centerPos.y - lastMousePos.y;
                targetOffset.x += deltaX * PAN_SENSITIVITY * targetZoom;
                targetOffset.y -= deltaY * PAN_SENSITIVITY * targetZoom;
                lastMousePos = centerPos;
            }
        }, { passive: true });

        window.addEventListener('touchend', (e) => {
            if (e.touches.length === 0) {
                onPointerUp({ target: e.target });
                initialPinchDist = null;
            }
        });

        // Window resize
        window.addEventListener('resize', () => {
            const width = window.innerWidth;
            const height = window.innerHeight;
            renderer.setSize(width, height);
            postProcessor.setSize(width, height, params.dpr);
            uniforms.iResolution.value.set(width, height);
        });

        // --- Animation Loop & Presets ---
        const clock = new THREE.Clock();
        let virtualTime = 0.0;

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            const animSpeed = params.animSpeed;
            virtualTime += delta * animSpeed;

            // Apply 8 Animation Presets
            const style = params.animationPreset;
            if (style === 'Smooth Orbit') {
                targetRotation.x += delta * 0.3 * params.rotationSpeed * animSpeed;
                targetRotation.y = Math.sin(virtualTime * 0.5) * 0.2;
            } else if (style === 'Breathing Pulse') {
                const pulse = Math.sin(virtualTime * 1.5) * 0.18;
                uniforms.uShapeSize.value = params.shapeSize * (1.0 + pulse);
                targetRotation.x += delta * 0.15 * params.rotationSpeed * animSpeed;
            } else if (style === 'Cosmic Drift') {
                targetRotation.x += Math.sin(virtualTime * 0.4) * 0.008 * animSpeed;
                targetRotation.y += Math.cos(virtualTime * 0.35) * 0.008 * animSpeed;
                uniforms.uShapeStretch.value = params.shapeStretch * (1.0 + Math.sin(virtualTime * 0.8) * 0.12);
            } else if (style === 'Tesseract Flux') {
                targetRotation.x += delta * 0.45 * params.rotationSpeed * animSpeed;
                targetRotation.y += delta * 0.25 * params.rotationSpeed * animSpeed;
                uniforms.uLatticeDensity.value = params.latticeDensity * (1.0 + Math.sin(virtualTime * 1.2) * 0.25);
            } else if (style === 'Ethereal Wave') {
                targetRotation.x = Math.sin(virtualTime * 0.6) * 0.45;
                targetRotation.y = Math.cos(virtualTime * 0.4) * 0.3;
                uniforms.uNoiseScale.value = params.noiseScale * (1.0 + Math.sin(virtualTime * 1.1) * 0.2);
            } else if (style === 'Hypnotic Spin') {
                targetRotation.x += delta * 1.1 * params.rotationSpeed * animSpeed;
                targetRotation.y = Math.sin(virtualTime * 0.2) * 0.08;
            } else if (style === 'Portal Vortex') {
                targetRotation.x += delta * 0.6 * params.rotationSpeed * animSpeed;
                targetRotation.y += Math.sin(virtualTime * 0.9) * 0.15;
                const vortexZoom = 1.0 + Math.sin(virtualTime * 0.7) * 0.15;
                uniforms.uZoom.value = targetZoom * vortexZoom;
            } else if (style === 'Static (No Movement)') {
                // Fixed static camera & frozen rotation
            }

            // Smooth interpolation / damping for controls
            uniforms.uMouseRot.value.x += (targetRotation.x - uniforms.uMouseRot.value.x) * 0.08;
            uniforms.uMouseRot.value.y += (targetRotation.y - uniforms.uMouseRot.value.y) * 0.08;
            uniforms.uOffset.value.x += (targetOffset.x - uniforms.uOffset.value.x) * 0.1;
            uniforms.uOffset.value.y += (targetOffset.y - uniforms.uOffset.value.y) * 0.1;
            
            if (style !== 'Portal Vortex') {
                uniforms.uZoom.value += (targetZoom - uniforms.uZoom.value) * 0.1;
            }

            uniforms.iTime.value = virtualTime;

            // Render scene through PostProcessor pipeline
            postProcessor.renderScene(scene, camera);
        }

        animate();
    </script>
</body>
</html>
