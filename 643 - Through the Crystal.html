<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#151720">
  <meta name="description" content="A slowly breathing, seamless study of prismatic light. Procedural Three.js and GLSL; no image assets.">
  <link rel="icon" href="data:,">
  <title>Through the Crystal</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #151720; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
    canvas.dragging { cursor: grabbing; }
    .unavailable { position: fixed; inset: 0; display: grid; place-content: center; padding: 2rem; color: #e9e0dc; font: 15px/1.7 system-ui, sans-serif; text-align: center; }
  </style>
</head>
<body>
<script>
/*
 * THROUGH THE CRYSTAL
 * One fullscreen plane. All light, dispersion, caustics, and grain are GLSL.
 * No textures, geometry effects, image assets, or postprocessing dependencies.
 * Open directly in a modern browser; the pinned Three.js module loads via CDN.
 */
(async () => {
  'use strict';
  let renderer;
  try {
    let THREE;
    try {
      THREE = await import('https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js');
    } catch {
      THREE = await import('https://unpkg.com/three@0.180.0/build/three.module.js');
    }
    let GUI;
    try {
      ({ default: GUI } = await import('https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js'));
    } catch {
      ({ default: GUI } = await import('https://cdn.jsdelivr.net/npm/lil-gui@0.19.1/dist/lil-gui.esm.min.js'));
    }

    // Eleven harmony schemes plus eight supplied palettes = exactly 19 presets.
    // Inversion supplies both achromatic versions without duplicating presets.
    const schemes = {
      'Original': { colors: ['#ffcf90','#ffa39f','#f4a2d2','#baa6e6','#89bdea','#aae7db'], background: '#151720', original: true },
      'Monochromatic': { colors: ['#f1e7ff','#c8b3f0','#9e7bcb','#7544ad','#51297c','#aa86d4'], background: '#100b1c' },
      'Analogous': { colors: ['#ffe6b8','#ffc27e','#ffadab','#f3a7cd','#c7a7e9','#f8c2ce'], background: '#1a111b' },
      'Complementary': { colors: ['#a7eff4','#54bed7','#4585b1','#ffd5a0','#edaa72','#f8e8d0'], background: '#101a24' },
      'Split-complementary': { colors: ['#b9e6ed','#72c2d2','#fac492','#e79dbb','#c59ae0','#e3d5f3'], background: '#161321' },
      'Triadic': { colors: ['#f2a6ca','#d182b8','#a9e7d9','#68b7ad','#ffe0a4','#e4b36e'], background: '#17151e' },
      'Tetradic': { colors: ['#f4b1c7','#cd91cd','#a3c0ed','#a1e5cd','#f1dc9d','#ecb27e'], background: '#141820' },
      'Double split-complementary': { colors: ['#edb4dc','#c0aceb','#99d7ed','#b3dfbb','#f4dda0','#f4b29d'], background: '#17171f' },
      'Achromatic': { colors: ['#ffffff','#eeeeee','#cccccc','#aaaaaa','#eeeeee','#ffffff'], background: '#000000', mono: true },
      'Achromatic + Accent': { colors: ['#ffffff','#eeeeee','#cccccc','#aaaaaa','#eeeeee','#ffffff'], background: '#000000', mono: true, accent: true },
      'Neutral + accent': { colors: ['#e8e1d5','#b8b1a4','#8e8a83','#ded6ca','#d38b63','#b7aea0'], background: '#1c1d20' },
      'Amber / Oxblood': { colors: ['#F6AA1C','#BC3908','#941B0C','#F6AA1C','#220901'], background: '#220901' },
      'Tidal / Obsidian': { colors: ['#63D1CF','#5BC0BE','#4BAD9E','#4BAD9E','#0B132B','#000000'], background: '#000000' },
      'Orchid / Smoke': { colors: ['#AA60C8','#D69ADE','#C9A3C6','#CFB5C2','#0D001D','#120A12'], background: '#120A12' },
      'Saffron / Petrol': { colors: ['#FEF1BE','#FFBA00','#008189','#00474D','#061210'], background: '#061210' },
      'Chartreuse / Jade': { colors: ['#D4FFB0','#7FFF00','#00B894','#0A3322','#05140A'], background: '#05140A' },
      'Tangerine / Plum': { colors: ['#FFE8CC','#FF8C00','#C7501A','#3D1050','#0E0618'], background: '#0E0618' },
      'Amethyst / Midnight': { colors: ['#E8E0FF','#B38FFF','#6A3DE8','#1A1250','#090612'], background: '#090612' },
      'Glacier / Magenta': { colors: ['#E0FBFF','#00F0FF','#D40078','#1E0A3D','#05020F'], background: '#05020F' }
    };
    const animations = ['Still camera', 'Slow orbit', 'Floating lens', 'Pendulum',
      'Dolly breath', 'Spectral tide', 'Crystal roll', 'Aurora drift', 'Static'];
    const settings = {
      scheme: 'Original', inverted: false, accent: '#ff2424', colorShift: 0,
      color1: '#ffcf90', color2: '#ffa39f', color3: '#f4a2d2',
      color4: '#baa6e6', color5: '#89bdea', color6: '#aae7db',
      background: '#151720', greenScreen: false, keyThreshold: 0.10,
      pixelRatio: Math.min(devicePixelRatio || 1, matchMedia('(pointer: coarse)').matches ? 1.15 : 1.6), speed: 1,
      animation: 'Still camera', motion: 1, orbitTilt: 22,
      zoom: 1, cameraAngle: 0, panX: 0, panY: 0,
      seed: 0, spread: 1, beamWidth: 1, refraction: 1, caustics: 1,
      clickVariations: true,
      newVariation: () => randomize(),
      resetView: () => {
        settings.zoom = 1; settings.cameraAngle = 0;
        settings.panX = 0; settings.panY = 0; refreshPanel();
      }
    };
    let originalColors = true;
    let gui;
    const LOOP_SECONDS = 60;
    const uniforms = {
      uTime: { value: 0 },
      uLoopDuration: { value: LOOP_SECONDS },
      uResolution: { value: new THREE.Vector2() },
      uZoom: { value: 1 }, uAngle: { value: 0 },
      uPan: { value: new THREE.Vector2() }, uTilt: { value: new THREE.Vector2() },
      uBackground: { value: new THREE.Color(settings.background) },
      uPalette: { value: Array.from({length: 6}, (_,i) => new THREE.Color(settings['color'+(i+1)])) },
      uPaletteSize: { value: 6 }, uOriginal: { value: 1 },
      uMonochrome: { value: 0 }, uAccentMode: { value: 0 }, uInverted: { value: 0 },
      uAccent: { value: new THREE.Color(settings.accent) }, uColorShift: { value: 0 },
      uGreenScreen: { value: 0 }, uKeyThreshold: { value: 0.10 },
      uSeed: { value: 0 }, uSpread: { value: 1 }, uBeamWidth: { value: 1 },
      uRefraction: { value: 1 }, uCaustics: { value: 1 }, uFlow: { value: 1 }
    };

    renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false, powerPreference: 'high-performance' });
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.NoToneMapping;
    renderer.setClearColor(0x151720, 1);
    renderer.domElement.setAttribute('role', 'img');
    renderer.domElement.setAttribute('aria-label', 'Slowly flowing pastel rainbow light refracting through darkness, converging into a luminous ivory glow.');
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const material = new THREE.ShaderMaterial({
      uniforms,
      depthTest: false,
      depthWrite: false,
      vertexShader: /* glsl */`
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = vec4(position.xy, 0.0, 1.0);
        }
      `,
      fragmentShader: /* glsl */`
        precision highp float;
        uniform float uTime;
        uniform float uLoopDuration;
        uniform vec2 uResolution;
        uniform float uZoom, uAngle;
        uniform vec2 uPan, uTilt;
        uniform vec3 uBackground, uPalette[6], uAccent;
        uniform float uPaletteSize, uOriginal, uMonochrome, uAccentMode, uInverted;
        uniform float uColorShift, uGreenScreen, uKeyThreshold;
        uniform float uSeed, uSpread, uBeamWidth, uRefraction, uCaustics, uFlow;
        varying vec2 vUv;

        const float TAU = 6.28318530718;

        float hash(vec2 p) {
          vec3 q = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973));
          q += dot(q, q.yzx + 33.33);
          return fract((q.x + q.y) * q.z);
        }

        float noise(vec2 p) {
          vec2 i = floor(p), f = fract(p);
          vec2 s = f*f*f*(f*(f*6.0-15.0)+10.0);
          return mix(mix(hash(i), hash(i+vec2(1,0)), s.x),
                     mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), s.x), s.y);
        }

        float fbm(vec2 p) {
          float n = 0.0;
          float amplitude = 0.55;
          mat2 turn = mat2(0.80, -0.60, 0.60, 0.80);
          for (int i = 0; i < 4; i++) {
            n += amplitude * noise(p);
            p = turn * p * 2.07 + vec2(13.4, 7.8);
            amplitude *= 0.47;
          }
          return n;
        }

        float gaussian(float x, float width) {
          x /= width;
          return exp(-x*x);
        }

        // A measured, softly interpolated glass palette. Green occupies only a
        // small part of the spectrum; pink, ice blue, and champagne dominate.
        vec3 spectrum(float x) {
          x += uColorShift;
          if (uMonochrome > 0.5) return vec3(0.75);
          if (uOriginal < 0.5) {
            float index = fract(x)*uPaletteSize;
            int first = int(floor(index));
            int second = int(mod(float(first+1), uPaletteSize));
            return mix(uPalette[first], uPalette[second], smoothstep(0.0,1.0,fract(index)));
          }
          float t = fract(x)*6.0;
          vec3 a, b;
          if (t < 1.0) { a=vec3(1.0,0.65,0.28); b=vec3(0.98,0.40,0.36); }
          else if (t < 2.0) { a=vec3(0.98,0.40,0.36); b=vec3(0.90,0.36,0.65); }
          else if (t < 3.0) { a=vec3(0.90,0.36,0.65); b=vec3(0.48,0.38,0.79); }
          else if (t < 4.0) { a=vec3(0.48,0.38,0.79); b=vec3(0.25,0.53,0.78); }
          else if (t < 5.0) { a=vec3(0.25,0.53,0.78); b=vec3(0.40,0.80,0.72); }
          else { a=vec3(0.40,0.80,0.72); b=vec3(1.0,0.65,0.28); }
          return mix(a,b,smoothstep(0.0,1.0,fract(t)));
        }

        // Angular center, width, radiant energy, spectral phase.
        // These are composed individually, rather than evenly spaced spokes.
        vec4 curtain(int i) {
          if (i == 0) return vec4(-1.24, 0.105, 0.27, 0.10);
          if (i == 1) return vec4(-0.94, 0.065, 0.28, 0.08);
          if (i == 2) return vec4(-0.745,0.085, 0.68, 0.58);
          if (i == 3) return vec4(-0.565,0.045, 0.28, 0.15);
          if (i == 4) return vec4(-0.30, 0.095, 0.53, 0.58);
          if (i == 5) return vec4(-0.145,0.070, 0.91, 0.34);
          if (i == 6) return vec4(-0.025,0.072, 0.71, 0.04);
          if (i == 7) return vec4( 0.115,0.095, 0.82, 0.76);
          if (i == 8) return vec4( 0.268,0.071, 0.45, 0.53);
          if (i == 9) return vec4( 0.382,0.035, 0.57, 0.025);
          if (i == 10)return vec4( 0.605,0.075, 0.60, 0.70);
          if (i == 11)return vec4( 0.765,0.071, 0.73, 0.015);
          if (i == 12)return vec4( 0.943,0.048, 0.27, 0.65);
          return vec4(1.28, 0.10, 0.15, 0.32);
        }

        vec4 shapedCurtain(int i) {
          vec4 ray = curtain(i);
          float variation = uSeed == 0.0 ? 0.0 : 1.0;
          float id = float(i);
          ray.x = ray.x*uSpread + (hash(vec2(id,uSeed))-0.5)*0.11*variation;
          ray.y *= uBeamWidth*(1.0+variation*(hash(vec2(uSeed,id+15.0))-0.5)*0.5);
          ray.z *= 1.0+variation*(hash(vec2(id+91.0,uSeed))-0.5)*0.65;
          ray.w += variation*(hash(vec2(id+7.0,uSeed))-0.5)*0.16;
          return ray;
        }

        // An imperfect glass reflection: broken, defocused, spectrally fringed.
        vec3 caustic(vec2 p, vec2 center, vec2 size, float seed, vec2 orbit) {
          float variation = uSeed == 0.0 ? 0.0 : 1.0;
          center += (vec2(noise(vec2(seed*91.0,uSeed)),noise(vec2(uSeed,seed*71.0)))-0.5)*0.20*variation;
          seed += uSeed*0.013;
          center += 0.012 * vec2(sin(seed+orbit.x*uFlow), cos(seed+orbit.y*uFlow));
          vec2 q = (p-center)/size;
          q.x += 0.27*sin(q.y*2.7+seed) + 0.16*(noise(q*1.7+seed)-0.5);
          float body = exp(-2.1*q.x*q.x-1.35*q.y*q.y);
          float folded = 0.35 + 0.65*noise(q*vec2(2.1,3.8)+seed);
          vec3 tint = spectrum(q.x*0.21+q.y*0.09+seed);
          return tint * body * folded*uCaustics;
        }

        void main() {
          float phase = TAU * mod(uTime, uLoopDuration) / uLoopDuration;
          vec2 orbit = vec2(cos(phase), sin(phase))*uFlow;
          vec2 orbit2 = vec2(cos(phase*2.0+0.8), sin(phase*2.0+0.8))*uFlow;
          float aspect = uResolution.x/uResolution.y;
          // On portrait screens, open the angular field without moving the focus.
          float fieldAspect = max(aspect, 1.12);
          // Transform the optical field, keeping user framing independent of
          // the animated lens. No animation writes to the user's zoom or angle.
          vec2 view = (vec2((vUv.x-0.5)*fieldAspect,vUv.y-0.5)-uPan)/uZoom;
          float c = cos(uAngle), s = sin(uAngle);
          view = mat2(c,-s,s,c)*view;
          view /= max(vec2(0.4), cos(uTilt));
          vec2 artUv = vec2(view.x/fieldAspect,view.y)+0.5;
          vec2 p = vec2((artUv.x-0.52)*fieldAspect, artUv.y+0.13);
          float radius = max(length(p),0.0001);
          float angle = atan(p.x, p.y);

          // Low-frequency glass deformation shared by the optical layers.
          vec2 glass = vec2(angle*3.7, radius*1.8)+uSeed*vec2(0.173,0.291);
          float haze = fbm(glass + orbit*0.20);
          float warp = (fbm(glass*1.6+vec2(7.8,2.3)+orbit*0.14)-0.5);
          float a = angle + uRefraction*(0.031*warp + 0.008*sin(radius*4.2+orbit.x));
          float breathing = 1.0+0.025*orbit2.y;

          vec3 light = vec3(0.0);
          float broad = 0.0;
          float sourceFalloff = 0.69 + 0.50*exp(-radius*1.7);

          // Broad light curtains, optical diffusion, and irregular interior folds.
          for (int i = 0; i < 14; i++) {
            vec4 ray = shapedCurtain(i);
            float id = float(i);
            float drift = uFlow*(0.009*sin(phase+id*2.13)
                        + 0.005*sin(phase*2.0+radius*2.7+id));
            float bend = uRefraction*0.011*sin(radius*3.1+id*1.7+orbit.y*0.24);
            float x = a-ray.x-drift-bend;
            float width = ray.y*(0.86+0.20*sin(radius*2.6+id));
            float envelope = gaussian(x, width);
            float diffusion = gaussian(x, width*2.8);
            float across = x/width;
            float structure = noise(vec2(a*91.0+id*8.3+orbit.x*0.25,
                                         radius*2.1+orbit.y*0.15));
            float folds = 0.73+0.27*structure;
            float longitudinal = 0.68+0.32*sin(radius*4.7+id*3.1+orbit2.x*0.30);
            float glassCloud = noise(vec2(a*28.0+id*3.1+warp*1.7,
                                           radius*5.5+orbit.x*0.2));
            longitudinal *= 0.55+0.90*glassCloud;

            // RGB channels see slightly different ray coordinates. The dispersion
            // varies with the glass thickness rather than splitting the whole image.
            float dispersion = 0.0055*(0.65+0.35*sin(radius*2.5+id));
            vec3 separated = vec3(gaussian(x+dispersion,width),
                                  envelope,
                                  gaussian(x-dispersion,width));
            vec3 tint = spectrum(ray.w+across*0.115+warp*0.12);
            light += separated*tint*ray.z*folds*longitudinal*sourceFalloff*1.65;
            light += spectrum(ray.w+0.05)*diffusion*ray.z*0.016;
            broad += envelope*ray.z;
          }

          // Angular noise is elongated radially: thousands of fine photographic
          // striations are implied by just three filtered frequencies of glass.
          float fiberA = noise(vec2(a*310.0+warp*2.0+orbit.x*0.35, radius*1.5+orbit.y*0.1));
          float fiberB = noise(vec2(a*735.0+warp*4.0+orbit2.x*0.22, radius*2.7));
          float fiberC = noise(vec2(a*1490.0+warp*5.0, radius*4.1+orbit2.y*0.10));
          float fine = pow(fiberA, 9.0)*0.35+pow(fiberB, 14.0)*0.14;
          float resolve = 1.0-smoothstep(0.0015,0.006, fwidth(a));
          fine += pow(fiberC, 20.0)*0.05*resolve;
          light *= 0.96+0.04*fiberA+0.02*fiberB;
          light += fine*broad*spectrum(a*2.4+warp*0.22+0.1)*0.22;

          // A handful of extremely fine highlights embedded in the softer sheets.
          for (int i = 0; i < 9; i++) {
            float id = float(i);
            vec4 ray = shapedCurtain(i+3);
            float x = a-ray.x+ray.y*0.48
                    + 0.004*sin(radius*5.0+id+orbit.y*0.3);
            float w = 0.0015+0.0008*sin(id*3.3)*sin(id*3.3);
            w = max(w, fwidth(a)*0.8);
            float streak = gaussian(x,w)+0.19*gaussian(x,w*4.5);
            float veil = 0.5+0.5*noise(vec2(radius*4.4+id*4.0, orbit.x*0.18));
            light += spectrum(ray.w+0.06)*streak*ray.z*veil*0.13;
          }

          // Broken upper-left and side caustics, like distant facets of imperfect
          // optical glass. No circles, particles, or regular repeated fragments.
          vec2 cp = vec2((artUv.x-0.52)*fieldAspect, artUv.y);
          light += caustic(cp,vec2(-0.69,0.91),vec2(0.052,0.093),0.08,orbit)*0.63;
          light += caustic(cp,vec2(-0.78,0.77),vec2(0.042,0.062),0.38,orbit)*0.37;
          light += caustic(cp,vec2(-0.62,0.72),vec2(0.075,0.150),0.21,orbit)*0.58;
          light += caustic(cp,vec2(-0.52,0.61),vec2(0.055,0.089),0.92,orbit)*0.49;
          light += caustic(cp,vec2(-0.40,0.43),vec2(0.049,0.070),0.64,orbit)*0.60;
          light += caustic(cp,vec2(-0.53,0.88),vec2(0.044,0.028),0.14,orbit)*0.42;
          light += caustic(cp,vec2( 0.29,0.38),vec2(0.040,0.135),0.18,orbit)*0.65;

          // Lower source sits outside the frame. Three scattering scales let the
          // convergence overexpose naturally while keeping the top corners dark.
          float core = exp(-length(p*vec2(1.02,1.5))*7.0);
          float halo = exp(-length(p*vec2(1.2,1.0))*4.8);
          float mist = exp(-radius*1.2)*(0.5+0.5*haze);
          light += vec3(1.0,0.83,0.54)*core*8.5*breathing;
          light += vec3(0.72,0.37,0.29)*halo*0.78;
          light += vec3(0.15,0.19,0.25)*mist*0.06;
          light *= breathing;

          // Palette-aware scattering also recolors the warm source and haze.
          if (uOriginal < 0.5 && uMonochrome < 0.5) {
            vec3 sourceTint = spectrum(0.05);
            light += (sourceTint-vec3(1.0,0.83,0.54))*core*8.5*breathing*breathing;
            light += (spectrum(0.68)-vec3(0.72,0.37,0.29))*halo*0.78*breathing;
          }
          vec3 hdr = max(light,vec3(0.0));
          // Exponential film shoulder preserves pastel hues in overlapping light.
          vec3 color = 1.0-exp(-hdr*1.27);
          float white = smoothstep(1.3,5.5, max(hdr.r,max(hdr.g,hdr.b)));
          color = mix(color,uOriginal > 0.5 ? vec3(1.0,0.973,0.895) : vec3(1.0),white*0.38);
          float intensity = max(color.r,max(color.g,color.b));
          vec3 background = uGreenScreen > 0.5 ? vec3(0.0,1.0,0.0) : uBackground;
          float coverage = smoothstep(uKeyThreshold,uKeyThreshold+0.28,max(hdr.r,max(hdr.g,hdr.b)));
          if (uMonochrome > 0.5) {
            float luminance = dot(color,vec3(0.2126,0.7152,0.0722));
            vec3 ink = vec3(1.0-uInverted);
            float accentMask = pow(0.5+0.5*sin(a*9.3+uSeed*0.1),12.0)*uAccentMode;
            ink = mix(ink,uAccent,accentMask);
            color = mix(background,ink,luminance*(uGreenScreen > 0.5 ? coverage : 1.0));
          } else if (uGreenScreen > 0.5) {
            color = mix(background,color,coverage);
          } else {
            color += background*(1.0-intensity);
          }
          gl_FragColor = vec4(color,1.0);
          #include <colorspace_fragment>
          // Stationary grain is intentional: neither flicker nor a loop seam.
          float grain = hash(gl_FragCoord.xy)-0.5;
          float grainMask = uGreenScreen > 0.5 ? coverage : 1.0;
          gl_FragColor.rgb += grain*(0.006+0.006*(1.0-gl_FragColor.g))*grainMask;
          gl_FragColor.rgb = clamp(gl_FragColor.rgb,0.0,1.0);
        }
      `
    });
    const geometry = new THREE.PlaneGeometry(2, 2);
    scene.add(new THREE.Mesh(geometry, material));

    function refreshPanel() {
      gui?.controllersRecursive().forEach(controller => controller.updateDisplay());
    }

    let activePaletteSize = 6;
    function syncColors() {
      const scheme = schemes[settings.scheme];
      uniforms.uOriginal.value = originalColors ? 1 : 0;
      uniforms.uMonochrome.value = scheme.mono ? 1 : 0;
      uniforms.uAccentMode.value = scheme.accent ? 1 : 0;
      uniforms.uInverted.value = settings.inverted ? 1 : 0;
      uniforms.uAccent.value.set(settings.accent);
      uniforms.uPaletteSize.value = activePaletteSize;
      uniforms.uPalette.value.forEach((color,i) => color.set(settings['color'+(i+1)]));
    }

    function applyScheme() {
      const scheme = schemes[settings.scheme];
      originalColors = !!scheme.original;
      activePaletteSize = scheme.colors.length;
      scheme.colors.forEach((color,i) => { settings['color'+(i+1)] = color; });
      for (let i=scheme.colors.length;i<6;i++) settings['color'+(i+1)] = scheme.colors[scheme.colors.length-1];
      settings.background = scheme.mono ? (settings.inverted ? '#ffffff' : '#000000') : scheme.background;
      settings.colorShift = 0;
      settings.accent = settings.scheme === 'Neutral + accent' ? '#d38b63' : '#ff2424';
      syncColors();
      inversionController?.show(!!scheme.mono);
      accentController?.show(!!scheme.accent || settings.scheme === 'Neutral + accent');
      paletteFolder?.show(!scheme.mono);
      refreshPanel();
    }

    // Keep the library's default UI styling. No on-screen help or overlays.
    gui = new GUI({ title: 'Through the Crystal', width: 310 });
    const colorsFolder = gui.addFolder('Colors');
    colorsFolder.add(settings, 'scheme', Object.keys(schemes)).name('Color scheme').onChange(applyScheme);
    const inversionController = colorsFolder.add(settings, 'inverted').name('Invert black / white').onChange(() => {
      if (schemes[settings.scheme].mono) settings.background = settings.inverted ? '#ffffff' : '#000000';
      syncColors(); refreshPanel();
    });
    const accentController = colorsFolder.addColor(settings, 'accent').name('Accent color').onChange(() => {
      if (settings.scheme === 'Neutral + accent') settings.color5 = settings.accent;
      syncColors(); refreshPanel();
    });
    colorsFolder.add(settings, 'colorShift', 0, 1, 0.001).name('Spectral shift');
    const paletteFolder = colorsFolder.addFolder('Palette colors');
    for (let i=1;i<=6;i++) {
      paletteFolder.addColor(settings, 'color'+i).name('Color '+i).onChange(() => {
        originalColors = false; activePaletteSize = 6; syncColors();
      });
    }
    paletteFolder.close();

    const backgroundFolder = gui.addFolder('Background');
    backgroundFolder.addColor(settings, 'background').name('Background color');
    backgroundFolder.add(settings, 'greenScreen').name('Greenscreen');
    backgroundFolder.add(settings, 'keyThreshold', 0.01, 0.4, 0.005).name('Key threshold');

    const motionFolder = gui.addFolder('Animation');
    motionFolder.add(settings, 'animation', animations).name('Motion preset');
    motionFolder.add(settings, 'speed', 0, 3, 0.01).name('Animation speed');
    motionFolder.add(settings, 'motion', 0, 2, 0.01).name('Motion amount');
    motionFolder.add(settings, 'orbitTilt', 0, 65, 0.1).name('Orbit tilt');

    const lensFolder = gui.addFolder('Lens');
    lensFolder.add(settings, 'zoom', 0.2, 6, 0.01).name('Zoom').listen();
    lensFolder.add(settings, 'cameraAngle', -180, 180, 0.1).name('Camera angle').listen();
    lensFolder.add(settings, 'panX', -3, 3, 0.001).name('Horizontal position').listen();
    lensFolder.add(settings, 'panY', -3, 3, 0.001).name('Vertical position').listen();
    lensFolder.add(settings, 'resetView').name('Reset view');
    lensFolder.close();

    const fieldFolder = gui.addFolder('Optical field');
    fieldFolder.add(settings, 'seed', 0, 1000, 1).name('Crystal seed');
    fieldFolder.add(settings, 'spread', 0.55, 1.65, 0.01).name('Beam spread');
    fieldFolder.add(settings, 'beamWidth', 0.45, 1.9, 0.01).name('Curtain width');
    fieldFolder.add(settings, 'refraction', 0, 3, 0.01).name('Refraction');
    fieldFolder.add(settings, 'caustics', 0, 2.5, 0.01).name('Glass reflections');
    fieldFolder.close();

    const renderFolder = gui.addFolder('Rendering');
    renderFolder.add(settings, 'pixelRatio', 0.5, 3, 0.1).name('Pixel ratio (DPR)').onChange(resize);
    renderFolder.close();
    gui.add(settings, 'clickVariations').name('Click to regenerate');
    gui.add(settings, 'newVariation').name('New variation');
    applyScheme();

    const randomBetween = (min,max) => min+Math.random()*(max-min);
    function randomize() {
      const names = Object.keys(schemes);
      settings.scheme = names[Math.floor(Math.random()*names.length)];
      settings.inverted = schemes[settings.scheme].mono && Math.random()<0.5;
      applyScheme();
      settings.seed = Math.floor(randomBetween(1,1000));
      settings.spread = Number(randomBetween(0.75,1.35).toFixed(2));
      settings.beamWidth = Number(randomBetween(0.65,1.50).toFixed(2));
      settings.refraction = Number(randomBetween(0.45,2.3).toFixed(2));
      settings.caustics = Number(randomBetween(0.5,2).toFixed(2));
      settings.colorShift = Number(randomBetween(0,1).toFixed(3));
      settings.animation = animations[Math.floor(Math.random()*8)];
      settings.speed = Number(randomBetween(0.35,0.85).toFixed(2));
      settings.motion = Number(randomBetween(0.45,1.25).toFixed(2));
      settings.orbitTilt = Number(randomBetween(10,40).toFixed(1));
      refreshPanel();
    }

    let uiVisible = true;
    addEventListener('keydown', event => {
      if (event.key.toLowerCase() !== 'h' || event.ctrlKey || event.metaKey || event.altKey || event.repeat) return;
      const target = event.target;
      if (target instanceof HTMLElement && (target.isContentEditable || target.matches('input[type="text"], input[type="number"], textarea'))) return;
      uiVisible = !uiVisible;
      gui.show(uiVisible);
    });

    const canvas = renderer.domElement;
    const fieldAspect = () => Math.max(innerWidth/innerHeight,1.12);
    const drag = { active: false, id: null, x: 0, y: 0, startX: 0, startY: 0, moved: false, rotate: false };
    canvas.addEventListener('contextmenu', event => event.preventDefault());
    canvas.addEventListener('pointerdown', event => {
      if (drag.active || ![0,2].includes(event.button)) return;
      drag.active = true; drag.id = event.pointerId;
      drag.x = drag.startX = event.clientX; drag.y = drag.startY = event.clientY;
      drag.moved = false; drag.rotate = event.button === 2 || event.altKey;
      canvas.setPointerCapture(event.pointerId);
      canvas.classList.add('dragging');
    });
    canvas.addEventListener('pointermove', event => {
      if (!drag.active || event.pointerId !== drag.id) return;
      const dx = event.clientX-drag.x, dy = event.clientY-drag.y;
      if (Math.hypot(event.clientX-drag.startX,event.clientY-drag.startY)>5) drag.moved = true;
      if (drag.rotate) {
        settings.cameraAngle = ((settings.cameraAngle+dx*0.22+180)%360+360)%360-180;
        settings.orbitTilt = THREE.MathUtils.clamp(settings.orbitTilt+dy*0.12,0,65);
      } else {
        settings.panX += dx/innerWidth*fieldAspect();
        settings.panY -= dy/innerHeight;
      }
      drag.x = event.clientX; drag.y = event.clientY;
    });
    function endDrag(event) {
      if (!drag.active || event.pointerId !== drag.id) return;
      const regenerate = event.type === 'pointerup' && !drag.moved && !drag.rotate && settings.clickVariations;
      drag.active = false;
      if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
      canvas.classList.remove('dragging');
      if (regenerate) randomize();
      refreshPanel();
    }
    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);
    canvas.addEventListener('lostpointercapture', () => { drag.active = false; canvas.classList.remove('dragging'); });
    canvas.addEventListener('wheel', event => {
      event.preventDefault();
      const delta = event.deltaY*(event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? innerHeight : 1);
      const before = settings.zoom;
      settings.zoom = THREE.MathUtils.clamp(before*Math.exp(-delta*0.001),0.2,6);
      const ratio = settings.zoom/before;
      const x = (event.clientX/innerWidth-0.5)*fieldAspect();
      const y = 0.5-event.clientY/innerHeight;
      // Include the current lens drift so wheel zoom anchors under the pointer
      // during an orbit just as it does with a stationary camera.
      settings.panX = x-(x-uniforms.uPan.value.x)*ratio-(uniforms.uPan.value.x-settings.panX);
      settings.panY = y-(y-uniforms.uPan.value.y)*ratio-(uniforms.uPan.value.y-settings.panY);
      refreshPanel();
    }, { passive: false });

    function resize() {
      const width = Math.max(1, innerWidth);
      const height = Math.max(1, innerHeight);
      // This is the actual requested drawing-buffer ratio, not a hidden cap.
      renderer.setPixelRatio(settings.pixelRatio);
      renderer.setSize(width, height);
      renderer.getDrawingBufferSize(uniforms.uResolution.value);
      renderer.render(scene, camera);
    }
    addEventListener('resize', resize, { passive: true });
    resize();

    // Automatic, infinite motion; explicit user selection can override the
    // reduced-motion default. Every lens path closes on the same 60-second loop.
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
    if (reducedMotion.matches) settings.animation = 'Static';
    refreshPanel();
    let elapsed = 0;
    let previous = performance.now();
    let frame;
    function animate(now) {
      const delta = Math.min((now-previous)*0.001, 0.1);
      previous = now;
      if (!document.hidden) elapsed = (elapsed+delta*settings.speed)%LOOP_SECONDS;
      const still = settings.animation === 'Static';
      const t = still ? 0 : elapsed/LOOP_SECONDS*Math.PI*2;
      const amount = still ? 0 : settings.motion;
      let px = 0, py = 0, roll = 0, dolly = 0, tx = 0, ty = 0;
      let flow = 1;
      switch (settings.animation) {
        case 'Slow orbit':
          px = Math.cos(t)*0.055; py = Math.sin(t)*0.025;
          roll = Math.sin(t)*0.035;
          tx = Math.sin(t)*THREE.MathUtils.degToRad(settings.orbitTilt);
          ty = Math.cos(t)*THREE.MathUtils.degToRad(settings.orbitTilt)*0.45;
          break;
        case 'Floating lens':
          px = Math.sin(t)*0.065; py = Math.sin(t*2)*0.028;
          roll = Math.sin(t+0.7)*0.025; break;
        case 'Pendulum':
          roll = Math.sin(t)*0.095; px = Math.sin(t)*0.022; break;
        case 'Dolly breath':
          dolly = Math.sin(t)*0.09; py = Math.sin(t)*0.018; break;
        case 'Spectral tide':
          px = Math.sin(t)*0.045; dolly = Math.sin(t+1.2)*0.04; flow = 1.6; break;
        case 'Crystal roll':
          roll = Math.sin(t)*0.13; dolly = Math.cos(t)*0.025;
          tx = Math.cos(t)*THREE.MathUtils.degToRad(settings.orbitTilt)*0.5; break;
        case 'Aurora drift':
          px = Math.sin(t)*0.07; py = Math.cos(t*2)*0.03;
          roll = Math.sin(t*2)*0.025; flow = 1.9; break;
      }
      uniforms.uTime.value = still ? 0 : elapsed;
      uniforms.uZoom.value = settings.zoom*Math.exp(dolly*amount);
      uniforms.uAngle.value = THREE.MathUtils.degToRad(settings.cameraAngle)+roll*amount;
      uniforms.uPan.value.set(settings.panX+px*amount,settings.panY+py*amount);
      uniforms.uTilt.value.set(tx*amount,ty*amount);
      uniforms.uFlow.value = still ? 1 : flow*settings.motion;
      uniforms.uColorShift.value = settings.colorShift;
      uniforms.uBackground.value.set(settings.background);
      uniforms.uGreenScreen.value = settings.greenScreen ? 1 : 0;
      uniforms.uKeyThreshold.value = settings.keyThreshold;
      uniforms.uSeed.value = settings.seed;
      uniforms.uSpread.value = settings.spread;
      uniforms.uBeamWidth.value = settings.beamWidth;
      uniforms.uRefraction.value = settings.refraction;
      uniforms.uCaustics.value = settings.caustics;
      renderer.render(scene, camera);
      frame = requestAnimationFrame(animate);
    }
    document.addEventListener('visibilitychange', () => {
      cancelAnimationFrame(frame);
      if (!document.hidden) {
        previous = performance.now();
        frame = requestAnimationFrame(animate);
      }
    });
    frame = requestAnimationFrame(animate);

    renderer.domElement.addEventListener('webglcontextlost', event => {
      event.preventDefault();
      cancelAnimationFrame(frame);
    });
    renderer.domElement.addEventListener('webglcontextrestored', () => {
      previous = performance.now();
      resize();
      frame = requestAnimationFrame(animate);
    });
  } catch (error) {
    console.error('Unable to start Through the Crystal:', error);
    renderer?.dispose();
    renderer?.domElement.remove();
    const message = document.createElement('div');
    message.className = 'unavailable';
    message.textContent = 'This artwork needs WebGL 2 and an internet connection to load Three.js. Please open it in a current browser.';
    document.body.appendChild(message);
  }
})();
</script>
</body>
</html>
