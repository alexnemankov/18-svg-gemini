<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dendritic Etch Plate</title>

    <!-- Import maps polyfill for module resolution -->
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
            }
        }
    </script>

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #e3ddd2;
            cursor: grab;
        }

        body.dragging {
            cursor: grabbing;
        }

        body.greenscreen {
            background-color: #00ff00 !important;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <script type="module">
        import * as THREE from 'three';
        import GUI from 'lil-gui';

        // =========================================================================
        // 1. POST-PROCESSING SUITE (postprocessing/PostProcessor.js)
        // =========================================================================
        const orthoVertexShader = `
        precision highp float;
        in vec3 position;
        out vec2 vUv;
        void main() {
          vUv = position.xy * 0.5 + 0.5;
          gl_Position = vec4(position, 1.0);
        }
        `;

        const brightFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        uniform float bloomThreshold;
        in vec2 vUv;
        out vec4 fragColor;

        void main() {
          vec4 color = texture(inputTexture, vUv);
          float luminance = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
          float knee = 0.1;
          float soft = luminance - bloomThreshold + knee;
          soft = clamp(soft, 0.0, 2.0 * knee);
          soft = (soft * soft) / (4.0 * knee + 0.00001);
          float contribution = max(soft, luminance - bloomThreshold);
          contribution /= max(luminance, 0.00001);
          fragColor = vec4(color.rgb * contribution, color.a);
        }
        `;

        const blur13ShaderChunk = `
        vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
          vec2 resolution = vec2(textureSize(image, 0));
          vec4 color = vec4(0.0);
          vec2 off1 = vec2(1.411764705882353) * direction;
          vec2 off2 = vec2(3.2941176470588234) * direction;
          vec2 off3 = vec2(5.176470588235294) * direction;
          color += texture(image, uv) * 0.1964825501511404;
          color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
          color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
          color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
          color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
          color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
          color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
          return color;
        }
        `;

        const blurFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        uniform vec2 direction;
        in vec2 vUv;
        out vec4 color;
        ${blur13ShaderChunk}
        void main() {
          color = blur13(inputTexture, vUv, direction);
        }
        `;

        const finalFragmentShader = `
        precision highp float;
        uniform vec2 resolution;
        uniform sampler2D inputTexture;
        uniform sampler2D blur0Texture;
        uniform sampler2D blur1Texture;
        uniform sampler2D blur2Texture;
        uniform sampler2D blur3Texture;
        uniform sampler2D blur4Texture;
        uniform bool bloomEnabled;
        uniform float bloomStrength;
        uniform float vignetteBoost;
        uniform float vignetteReduction;
        uniform float noiseIntensity;
        uniform float time;
        in vec2 vUv;
        out vec4 fragColor;

        float vignette(vec2 uv, float boost, float reduction) {
          vec2 position = vUv - 0.5;
          return boost - length(position) * reduction;
        }

        float hash1(uint n) {
          n = (n << 13U) ^ n;
          n = n * (n * n * 15731U + 789221U) + 1376312589U;
          return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
        }

        float noise(in vec2 uv, in float timeVal) {
          uvec2 p = uvec2(uv);
          return hash1(p.x + 1920U * p.y + (1920U * 1080U) * uint(timeVal));
        }

        void main() {
          vec4 color = texture(inputTexture, vUv);

          if (bloomEnabled && bloomStrength > 0.001) {
            vec4 b0 = texture(blur0Texture, vUv);
            vec4 b1 = texture(blur1Texture, vUv);
            vec4 b2 = texture(blur2Texture, vUv);
            vec4 b3 = texture(blur3Texture, vUv);
            vec4 b4 = texture(blur4Texture, vUv);

            vec4 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
            color += bloomSum * bloomStrength;
          }

          color.rgb *= vignette(vUv, vignetteBoost, vignetteReduction);
          color.rgb += noiseIntensity * noise(gl_FragCoord.xy, time);
          fragColor = vec4(color.rgb, 1.0);
        }
        `;

        const chromaticAberrationShaderChunk = `
        vec2 barrelDistortion(vec2 coord, float amt) {
          vec2 cc = coord - 0.5;
          float dist = dot(cc, cc);
          return coord + cc * dist * amt;
        }
        float sat(float t) { return clamp(t, 0.0, 1.0); }
        float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
        float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
        vec4 spectrum_offset(float t) {
          float lo = step(t, 0.5);
          float hi = 1.0 - lo;
          float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
          vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
          return pow(ret, vec4(1.0 / 2.2));
        }
        const float max_distort = 2.2;
        const int num_iter = 8;
        const float reci_num_iter_f = 1.0 / float(num_iter);
        vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
          vec4 sumcol = vec4(0.0);
          vec4 sumw = vec4(0.0);
          for (int i = 0; i < num_iter; ++i) {
            float t = float(i) * reci_num_iter_f;
            vec4 w = spectrum_offset(t);
            sumw += w;
            sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
          }
          return sumcol / sumw;
        }
        `;

        const colorFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        uniform float chromaticAberrationAmount;
        uniform float minInputLevel;
        uniform float maxInputLevel;
        uniform float gammaLevel;
        uniform float fisheyeStrength;
        uniform float fisheyeRadius;
        uniform float time;
        in vec2 vUv;
        out vec4 fragColor;

        ${chromaticAberrationShaderChunk}

        vec2 applyFisheye(vec2 uv, float strength, float radius) {
          if (abs(strength) < 0.0001) return uv;
          vec2 p = uv - 0.5;
          float d = length(p);
          if (d > radius * 1.5) return uv;
          float r = d / max(radius, 0.001);
          float theta = atan(p.y, p.x);
          float rDist = r + strength * (r * r * r);
          return 0.5 + vec2(cos(theta), sin(theta)) * (rDist * radius);
        }

        vec3 gammaCorrect(vec3 color, vec3 gamma) {
          return pow(max(color, vec3(0.0)), 1.0 / gamma);
        }
        vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
          return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
        }
        vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
          return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
        }
        void main() {
          vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
          fragColor = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
          fragColor.rgb = finalLevels(fragColor.rgb, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
          fragColor.a = 1.0;
        }
        `;

        const copyFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        in vec2 vUv;
        out vec4 fragColor;
        void main() {
          fragColor = texture(inputTexture, vUv);
        }
        `;

        function createFBO(w, h, options = {}) {
          return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
            wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
            wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
            minFilter: options.minFilter || THREE.LinearFilter,
            magFilter: options.magFilter || THREE.LinearFilter,
            format: options.format || THREE.RGBAFormat,
            type: options.type || THREE.HalfFloatType,
            stencilBuffer: options.stencilBuffer || false,
            depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : true,
            samples: options.samples || 0,
          });
        }

        class ShaderPass {
          constructor(shader, options = {}) {
            this.shader = shader;
            this.orthoScene = new THREE.Scene();
            this.fbo = createFBO(1, 1, options);
            this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
            this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
            this.orthoScene.add(this.orthoQuad);
            this.texture = this.fbo.texture;
          }
          render(renderer, toScreen = false) {
            if (!toScreen) {
              renderer.setRenderTarget(this.fbo);
            }
            renderer.render(this.orthoScene, this.orthoCamera);
            if (!toScreen) {
              renderer.setRenderTarget(null);
            }
          }
          setSize(width, height) {
            this.fbo.setSize(Math.max(1, width), Math.max(1, height));
            this.orthoQuad.scale.set(width, height, 1);
          }
        }

        class ShaderPingPongPass {
          constructor(shader, options = {}) {
            this.shader = shader;
            this.orthoScene = new THREE.Scene();
            this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
            this.currentFBO = 0;
            this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
            this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
            this.orthoScene.add(this.orthoQuad);
          }
          render(renderer) {
            renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
            renderer.render(this.orthoScene, this.orthoCamera);
            renderer.setRenderTarget(null);
            this.currentFBO = 1 - this.currentFBO;
          }
          get current() { return this.fbos[this.currentFBO]; }
          get texture() { return this.current.texture; }
          setSize(width, height) {
            const w = Math.max(1, width);
            const h = Math.max(1, height);
            this.orthoQuad.scale.set(w, h, 1);
            this.fbos[0].setSize(w, h);
            this.fbos[1].setSize(w, h);
          }
        }

        class BloomPass {
          constructor(strength = 0.3, radius = 0.4, threshold = 0.35, levels = 5) {
            this.strength = strength;
            this.radius = radius;
            this.threshold = threshold;
            this.enabled = true;
            this.levels = levels;

            this.brightShader = new THREE.RawShaderMaterial({
              uniforms: {
                inputTexture: { value: null },
                bloomThreshold: { value: this.threshold },
              },
              vertexShader: orthoVertexShader,
              fragmentShader: brightFragmentShader,
              glslVersion: THREE.GLSL3,
            });
            this.brightPass = new ShaderPass(this.brightShader, {
              format: THREE.RGBAFormat,
              type: THREE.HalfFloatType,
            });

            this.blurShader = new THREE.RawShaderMaterial({
              uniforms: {
                inputTexture: { value: null },
                direction: { value: new THREE.Vector2(0, 1) },
              },
              vertexShader: orthoVertexShader,
              fragmentShader: blurFragmentShader,
              glslVersion: THREE.GLSL3,
            });

            this.blurPasses = [];
            for (let i = 0; i < this.levels; i++) {
              this.blurPasses.push(new ShaderPingPongPass(this.blurShader, {
                format: THREE.RGBAFormat,
                type: THREE.HalfFloatType,
              }));
            }
          }

          setSize(w, h) {
            let tw = Math.max(1, w);
            let th = Math.max(1, h);
            this.brightPass.setSize(tw, th);
            for (let i = 0; i < this.levels; i++) {
              tw = Math.max(1, Math.round(tw / 2));
              th = Math.max(1, Math.round(th / 2));
              this.blurPasses[i].setSize(tw, th);
            }
          }

          set source(texture) {
            this.brightShader.uniforms.inputTexture.value = texture;
          }

          render(renderer) {
            if (!this.enabled || this.strength <= 0.001) return;

            this.brightShader.uniforms.bloomThreshold.value = this.threshold;
            this.brightPass.render(renderer);

            const baseOffset = Math.max(0.1, this.radius * 2.0);
            const u = this.blurShader.uniforms;

            for (let j = 0; j < this.levels; j++) {
              const blurPass = this.blurPasses[j];
              const stepOffset = baseOffset * (1.0 + j * 0.5);

              u.direction.value.set(stepOffset, 0);
              u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
              blurPass.render(renderer);

              u.direction.value.set(0, stepOffset * 0.5);
              u.inputTexture.value = blurPass.current.texture;
              blurPass.render(renderer);
            }
          }
        }

        class PostProcessor {
          constructor(renderer, params = {}) {
            this.renderer = renderer;

            this.settings = {
              enabled: params.enabled !== undefined ? params.enabled : true,

              // 1. Bloom Engine
              bloomEnabled: params.bloomEnabled !== undefined ? params.bloomEnabled : false,
              bloomStrength: params.bloomStrength !== undefined ? params.bloomStrength : 0.25,
              bloomRadius: params.bloomRadius !== undefined ? params.bloomRadius : 0.4,
              bloomThreshold: params.bloomThreshold !== undefined ? params.bloomThreshold : 0.4,

              // 2. Lens & Optics
              fisheyeStrength: params.fisheyeStrength !== undefined ? params.fisheyeStrength : 0.0,
              fisheyeRadius: params.fisheyeRadius !== undefined ? params.fisheyeRadius : 1.0,
              chromaticAberration: params.chromaticAberration !== undefined ? params.chromaticAberration : 0.015,
              vignetteBoost: params.vignetteBoost !== undefined ? params.vignetteBoost : 1.0,
              vignetteReduction: params.vignetteReduction !== undefined ? params.vignetteReduction : 0.4,
              noiseIntensity: params.noiseIntensity !== undefined ? params.noiseIntensity : 0.015,

              // 3. Color Grading & Tone
              gamma: params.gamma !== undefined ? params.gamma : 1.0,
              minInputLevel: params.minInputLevel !== undefined ? params.minInputLevel : 0.0,
              maxInputLevel: params.maxInputLevel !== undefined ? params.maxInputLevel : 1.0,
            };

            this.sceneTarget = createFBO(1, 1, { type: THREE.HalfFloatType });

            this.bloomPass = new BloomPass(
              this.settings.bloomStrength,
              this.settings.bloomRadius,
              this.settings.bloomThreshold,
              5
            );

            this.finalShader = new THREE.RawShaderMaterial({
              uniforms: {
                resolution: { value: new THREE.Vector2(1, 1) },
                bloomEnabled: { value: this.settings.bloomEnabled },
                bloomStrength: { value: this.settings.bloomStrength },
                vignetteBoost: { value: this.settings.vignetteBoost },
                vignetteReduction: { value: this.settings.vignetteReduction },
                noiseIntensity: { value: this.settings.noiseIntensity },
                inputTexture: { value: null },
                blur0Texture: { value: null },
                blur1Texture: { value: null },
                blur2Texture: { value: null },
                blur3Texture: { value: null },
                blur4Texture: { value: null },
                time: { value: 0 },
              },
              vertexShader: orthoVertexShader,
              fragmentShader: finalFragmentShader,
              glslVersion: THREE.GLSL3,
            });
            this.finalPass = new ShaderPass(this.finalShader);

            this.rgbShader = new THREE.RawShaderMaterial({
              uniforms: {
                inputTexture: { value: this.finalPass.texture },
                fisheyeStrength: { value: this.settings.fisheyeStrength },
                fisheyeRadius: { value: this.settings.fisheyeRadius },
                chromaticAberrationAmount: { value: this.settings.chromaticAberration },
                minInputLevel: { value: this.settings.minInputLevel },
                maxInputLevel: { value: this.settings.maxInputLevel },
                gammaLevel: { value: this.settings.gamma },
                time: { value: 0 },
              },
              vertexShader: orthoVertexShader,
              fragmentShader: colorFragmentShader,
              glslVersion: THREE.GLSL3,
            });
            this.rgbPass = new ShaderPass(this.rgbShader);

            this.copyShader = new THREE.RawShaderMaterial({
              uniforms: {
                inputTexture: { value: null },
              },
              vertexShader: orthoVertexShader,
              fragmentShader: copyFragmentShader,
              glslVersion: THREE.GLSL3,
            });
            this.copyPass = new ShaderPass(this.copyShader);
          }

          updateSettings() {
            this.bloomPass.enabled = this.settings.bloomEnabled;
            this.bloomPass.strength = this.settings.bloomStrength;
            this.bloomPass.radius = this.settings.bloomRadius;
            this.bloomPass.threshold = this.settings.bloomThreshold;

            this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
            this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
            this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
            this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
            this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;

            this.rgbShader.uniforms.fisheyeStrength.value = this.settings.fisheyeStrength;
            this.rgbShader.uniforms.fisheyeRadius.value = this.settings.fisheyeRadius;
            this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
            this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
            this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
            this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
          }

          setSize(w0, h0, dpr = 1) {
            const w = Math.max(1, Math.floor(w0 * dpr));
            const h = Math.max(1, Math.floor(h0 * dpr));
            this.sceneTarget.setSize(w, h);
            this.finalPass.setSize(w, h);
            this.finalShader.uniforms.resolution.value.set(w, h);
            this.bloomPass.setSize(w, h);
            this.rgbPass.setSize(w, h);
            this.copyPass.setSize(w, h);
          }

          renderScene(scene, camera) {
            if (!this.settings.enabled) {
              this.renderer.render(scene, camera);
              return;
            }
            this.renderer.setRenderTarget(this.sceneTarget);
            this.renderer.render(scene, camera);
            this.renderer.setRenderTarget(null);
            this.render(this.sceneTarget.texture);
          }

          render(sourceTexture) {
            if (!this.settings.enabled) {
              this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
              this.copyPass.render(this.renderer, true);
              return;
            }

            this.updateSettings();

            this.bloomPass.source = sourceTexture;
            this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
            this.bloomPass.render(this.renderer);

            this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
            this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
            this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
            this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
            this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

            const randomTime = Math.random() * 100000;
            this.finalPass.shader.uniforms.time.value = randomTime;
            this.rgbPass.shader.uniforms.time.value = randomTime;

            this.finalPass.render(this.renderer);
            this.rgbPass.render(this.renderer, true);
          }

          attachGUI(gui, title = "Post-Processing Suite") {
            const root = gui.addFolder(title);
            root.add(this.settings, "enabled").name("Enable Suite");

            const bloom = root.addFolder("Bloom Engine");
            bloom.add(this.settings, "bloomEnabled").name("Enable Bloom").onChange(() => this.updateSettings());
            bloom.add(this.settings, "bloomStrength", 0, 3.0, 0.05).name("Strength").onChange(() => this.updateSettings());
            bloom.add(this.settings, "bloomRadius", 0, 2.0, 0.05).name("Radius").onChange(() => this.updateSettings());
            bloom.add(this.settings, "bloomThreshold", 0, 1.0, 0.01).name("Threshold").onChange(() => this.updateSettings());

            const lens = root.addFolder("Lens, Optics & Fisheye");
            lens.add(this.settings, "fisheyeStrength", -1.0, 1.5, 0.01).name("Fisheye Distortion").onChange(() => this.updateSettings());
            lens.add(this.settings, "fisheyeRadius", 0.2, 2.0, 0.05).name("Fisheye Radius").onChange(() => this.updateSettings());
            lens.add(this.settings, "chromaticAberration", 0, 0.2, 0.002).name("Chromatic Aberration").onChange(() => this.updateSettings());
            lens.add(this.settings, "vignetteBoost", 0, 2.0, 0.05).name("Vignette Boost").onChange(() => this.updateSettings());
            lens.add(this.settings, "vignetteReduction", 0, 2.0, 0.05).name("Vignette Falloff").onChange(() => this.updateSettings());
            lens.add(this.settings, "noiseIntensity", 0, 0.1, 0.002).name("Film Grain").onChange(() => this.updateSettings());
            lens.add(this.settings, "gamma", 0.2, 2.0, 0.05).name("Gamma").onChange(() => this.updateSettings());
            lens.add(this.settings, "minInputLevel", 0, 0.5, 0.01).name("Black Level").onChange(() => this.updateSettings());
            lens.add(this.settings, "maxInputLevel", 0.5, 1.0, 0.01).name("White Level").onChange(() => this.updateSettings());

            return root;
          }
        }

        // =========================================================================
        // 2. PRECONFIGURED COLOR SCHEMES & ANIMATIONS
        // =========================================================================
        const COLOR_SCHEMES = {
            'Monochromatic': {
                name: 'Monochromatic (Sumi on Washi)',
                paper: '#f2ede4',
                ink1: '#18181b',
                ink2: '#3f3f46',
                accent: '#27272a',
                bg: '#e3ddd2'
            },
            'Analogous': {
                name: 'Analogous (Indigo & Cyan Marine)',
                paper: '#eaf2f5',
                ink1: '#0f3854',
                ink2: '#1b6b7a',
                accent: '#38b2ac',
                bg: '#d2e2e8'
            },
            'Complementary': {
                name: 'Complementary (Prussian Blue & Sienna)',
                paper: '#f6f0e6',
                ink1: '#142c44',
                ink2: '#8c3d23',
                accent: '#c05621',
                bg: '#e8dcce'
            },
            'Split-complementary': {
                name: 'Split-complementary (Crimson, Viridian, Amber)',
                paper: '#f7f4eb',
                ink1: '#7a1c38',
                ink2: '#1c5244',
                accent: '#d69e2e',
                bg: '#ebe4d5'
            },
            'Triadic': {
                name: 'Triadic (Cobalt, Sanguine & Ochre)',
                paper: '#f5efe3',
                ink1: '#1a365d',
                ink2: '#7b1d1d',
                accent: '#b7791f',
                bg: '#e6dcce'
            },
            'Tetradic': {
                name: 'Tetradic (Plum, Forest, Amber & Slate)',

        const ANIMATIONS = {

            },

        // =========================================================================
        // 3. GUI PARAMETERS & STATE
        // =========================================================================
        const params = {

            accentColor: COLOR_SCHEMES['Monochromatic'].accent,

        };

        // =========================================================================
        // 4. THREE.JS ENVIRONMENT & POSTPROCESSOR INITIALIZATION
        // =========================================================================
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

        const postProcessor = new PostProcessor(renderer);

        const hexToVector3 = (hex) => {
            const color = new THREE.Color(hex);
            return new THREE.Vector3(color.r, color.g, color.b);
        };

        const updateSize = () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            renderer.setSize(w, h);
            renderer.setPixelRatio(window.devicePixelRatio * params.dpr);
            if (material) {
                material.uniforms.uResolution.value.set(w, h);
            }
            postProcessor.setSize(w, h, params.dpr);
        };

        const applyBackground = () => {
            const color = params.greenScreen ? '#00ff00' : params.backgroundColor;
            document.body.classList.toggle('greenscreen', params.greenScreen);
            document.body.style.backgroundColor = color;
            renderer.setClearColor(color, 1);
            if (material) {
                material.uniforms.uBackgroundColor.value.copy(hexToVector3(color));
                material.uniforms.uGreenScreen.value = params.greenScreen;
            }
        };

        const updateViewUniforms = () => {
            material.uniforms.uZoom.value = params.zoom;
            material.uniforms.uPan.value.set(params.panX, params.panY);
        };

        const updateAllMaterialColors = () => {
            material.uniforms.uPaperColor.value.copy(hexToVector3(params.paperColor));
            material.uniforms.uInkColor1.value.copy(hexToVector3(params.inkColor1));
            material.uniforms.uInkColor2.value.copy(hexToVector3(params.inkColor2));
            material.uniforms.uAccentColor.value.copy(hexToVector3(params.accentColor));

        };

        const applyColorScheme = (schemeKey) => {
            const scheme = COLOR_SCHEMES[schemeKey];
            if (!scheme) return;
            params.paperColor = scheme.paper;
            params.inkColor1 = scheme.ink1;
            params.inkColor2 = scheme.ink2;
            params.accentColor = scheme.accent;
            if (!params.greenScreen) {
                params.backgroundColor = scheme.bg;
            }
            updateAllMaterialColors();
            gui.controllersRecursive().forEach(c => c.updateDisplay());
        };

        const applyAnimationPreset = (animKey) => {
            const anim = ANIMATIONS[animKey];
            if (!anim) return;
            params.speed = anim.speed;
            params.autoRotate = anim.autoRotate;
            params.autoRotateSpeed = anim.autoRotateSpeed;
            gui.controllersRecursive().forEach(c => c.updateDisplay());
        };

        // =========================================================================
        // 5. SHADER DEFINITIONS
        // =========================================================================
        const vertexShader = `
            varying vec2 vUv;

            void main() {
                vUv = uv;
                gl_Position = vec4(position, 1.0);
            }
        `;

        const fragmentShader = `
            uniform float uTime;
            uniform vec2 uResolution;
            uniform mat3 uRotation;
            uniform float uZoom;
            uniform vec2 uPan;

            // Background & Greenscreen
            uniform vec3 uBackgroundColor;
            uniform bool uGreenScreen;

            // Substrate & Colors
            uniform vec3 uPaperColor;
            uniform vec3 uInkColor1;
            uniform vec3 uInkColor2;
            uniform vec3 uAccentColor;
            uniform float uSubstrateGrain;
            uniform float uContrast;

            // Dendritic SDF Geometry
            uniform float uFractalScale;
            uniform float uBranchFreq;
            uniform float uSmoothing;
            uniform float uRidgeScale;
            uniform float uCreaseDepth;
            uniform float uCoreRadius;

            // Boundary & Beer-Lambert Absorption
            uniform float uFadeOuter;
            uniform float uFadeInner;
            uniform float uInkDensity;
            uniform float uAbsorptionFactor;

            varying vec2 vUv;

            // Smooth minimum that resolves into sharp creases as uSmoothing approaches 0
            float smin(float a, float b, float k) {
                float h = clamp(0.5 + 0.5 * (b - a) / max(k, 0.0001), 0.0, 1.0);
                return mix(b, a, h) - k * h * (1.0 - h);
            }

            // Pseudo-random noise for dithering & paper grain
            float hash21(vec2 p) {
                return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
            }

            // Dendritic Branching SDF: ridged noise (abs(sin(...))) fed into smin with small smoothing factor
            float evaluateDendrite(vec3 pos, float currentTime, out float branchTier, out vec3 localWarp) {
                vec3 p1 = pos * uFractalScale;
                vec3 p2 = pos * uFractalScale;

                float tierAccum = 0.0;

                // Domain warping and multi-scale harmonic rotation
                for (float iter = 1.0; iter <= 4.0; iter += 1.0) {
                    float scale = iter * uBranchFreq;
                    
                    float ang = 0.785398 + iter * 0.523598;
                    mat2 rot = mat2(cos(ang), -sin(ang), sin(ang), cos(ang));
                    p1.xy = rot * p1.xy;
                    p2.yz = rot * p2.yz;

                    p2 += sin(0.4 * currentTime + p1.zxy * (scale * 0.38)) * (0.38 / iter);
                    p1 += sin(0.6 * currentTime + p2.yzx * scale) * (0.28 / iter);

                    tierAccum += length(p1 - p2) * 0.25;
                }

                localWarp = p1;
                branchTier = tierAccum;

                // Feed warped coordinates through ridged noise (abs(sin(...))) before the smin
                vec3 ridgeA = abs(sin(p1 * uRidgeScale + currentTime * 0.08));
                vec3 ridgeB = abs(sin(p2 * (uRidgeScale * 1.37) - currentTime * 0.06 + 1.57079));

                // Spheres displaced by ridged folds
                float sphereA = length(p1 + (ridgeA - 0.5) * uCreaseDepth) - uCoreRadius;
                float sphereB = length(p2 - (ridgeB - 0.5) * uCreaseDepth) - (uCoreRadius * 1.25);

                // smin with small smoothing factor creates branching creases instead of smooth blobs
                float blendedSpheres = smin(sphereA, sphereB, max(uSmoothing, 0.001));

                // Etched plate profile
                float plateSlab = abs(pos.z) - 0.85;
                float fractalVolume = max(blendedSpheres * 0.22, plateSlab * 0.35);

                return fractalVolume / uFractalScale;
            }

            void main() {
                vec2 fragCoord = vUv * uResolution;
                vec2 uv = (fragCoord * 2.0 - uResolution.xy) / uResolution.y;
                uv = (uv - uPan) / max(uZoom, 0.05);

                // Dither ray start to eliminate banding in volumetric accumulation
                float dither = hash21(fragCoord);
                float totalDistance = 0.015 * dither;

                vec3 rayOrigin = vec3(0.0, 0.0, -4.5);
                vec3 rayDir = normalize(vec3(uv, 1.0));

                // Beer-Lambert Transmittance (starts at 1.0 = clear unsoaked substrate)
                vec3 transmittance = vec3(1.0);
                vec3 accumulatedInkColor = vec3(0.0);

                for (int step = 0; step < 100; step++) {
                    vec3 currentPos = rayOrigin + rayDir * totalDistance;
                    if (totalDistance > 10.0) break;

                    float distFromCenter = length(currentPos);

                    // Skip steps outside the outer boundary
                    if (distFromCenter > uFadeOuter + 0.02) {
                        totalDistance += distFromCenter - uFadeOuter;
                        continue;
                    }

                    vec3 rotatedPos = uRotation * currentPos;
                    float branchTier;
                    vec3 localWarp;
                    float sceneDist = evaluateDendrite(rotatedPos, uTime, branchTier, localWarp);

                    float stepSize = 0.014 + max(sceneDist, 0.0) * 0.65;
                    totalDistance += stepSize;

                    float radialFade = smoothstep(uFadeOuter, uFadeInner, distFromCenter);
                    if (radialFade <= 0.001) continue;

                    // Density along the dendritic creases
                    float density = max(0.0, (0.075 - sceneDist) / 0.075);
                    density = pow(density, 1.6) * uInkDensity * radialFade;

                    if (density > 0.001) {
                        // Multi-tier ink tone modulation
                        float tierMix = clamp(sin(branchTier * 1.8 + localWarp.z * 1.4) * 0.5 + 0.5, 0.0, 1.0);
                        vec3 currentInk = mix(uInkColor1, uInkColor2, tierMix);

                        // Subtle mineral accent at fine dendritic capillaries
                        float accentFactor = smoothstep(0.65, 1.3, branchTier) * 0.35;
                        currentInk = mix(currentInk, uAccentColor, accentFactor);

                        // Beer-Lambert spectral absorption coefficient:
                        // Complementary absorption produces authentic saturated ink absorption
                        vec3 absorptionCoeff = (vec3(1.18) - currentInk * 0.82) * density * uAbsorptionFactor;

                        // Beer-Lambert transmission decay: T *= exp(-density * stepSize)
                        vec3 stepTransmittance = exp(-absorptionCoeff * stepSize);
                        
                        // Ink color absorbed onto substrate
                        accumulatedInkColor += (vec3(1.0) - stepTransmittance) * transmittance * currentInk;
                        transmittance *= stepTransmittance;

                        // Early break if substrate is fully saturated with ink
                        if (dot(transmittance, vec3(0.3333)) < 0.005) break;
                    }
                }

                // Substrate paper/stone texture with tactile micro-grain
                float paperGrain = (hash21(fragCoord * 0.8) - 0.5) * uSubstrateGrain;
                vec3 basePaper = clamp(uPaperColor + vec3(paperGrain), 0.0, 1.0);

                // Beer-Lambert composite: substrate reflected through remaining transmittance + soaked ink
                vec3 etchPlateColor = basePaper * transmittance + accumulatedInkColor;

                // High-contrast, flat matte intaglio print finish
                etchPlateColor = pow(etchPlateColor, vec3(uContrast));

                // Bounding mask of the specimen plate
                float plateDist = length(uv);
                float plateMask = smoothstep(2.4, 0.6, plateDist);

                // Background or Greenscreen compositing
                vec3 finalColor;
                if (uGreenScreen) {
                    float chromaMask = smoothstep(uFadeOuter * 0.85, uFadeInner * 0.65, length(uv * max(uZoom, 0.05) + uPan));
                    finalColor = mix(vec3(0.0, 1.0, 0.0), etchPlateColor, chromaMask);
                } else {
                    float bgBlend = smoothstep(2.8, 1.1, plateDist);
                    finalColor = mix(uBackgroundColor, etchPlateColor, bgBlend);
                }

                gl_FragColor = vec4(finalColor, 1.0);
            }
        `;

        // =========================================================================
        // 6. INITIALIZE MESH & MATERIAL
        // =========================================================================
        const geometry = new THREE.PlaneGeometry(2, 2);
        const material = new THREE.ShaderMaterial({
            vertexShader,
            fragmentShader,
            uniforms: {
                uTime: { value: 0 },
                uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
                uRotation: { value: new THREE.Matrix3() },
                uZoom: { value: params.zoom },
                uPan: { value: new THREE.Vector2(params.panX, params.panY) },

                uBackgroundColor: { value: hexToVector3(params.backgroundColor) },

                uPaperColor: { value: hexToVector3(params.paperColor) },
                uInkColor1: { value: hexToVector3(params.inkColor1) },
                uInkColor2: { value: hexToVector3(params.inkColor2) },
                uAccentColor: { value: hexToVector3(params.accentColor) },
                uSubstrateGrain: { value: params.substrateGrain },
                uContrast: { value: params.contrast },

                uFractalScale: { value: params.fractalScale },
                uBranchFreq: { value: params.branchFreq },
                uSmoothing: { value: params.smoothing },
                uRidgeScale: { value: params.ridgeScale },
                uCreaseDepth: { value: params.creaseDepth },
                uCoreRadius: { value: params.coreRadius },

                uFadeOuter: { value: params.fadeOuter },
                uFadeInner: { value: params.fadeInner },
                uInkDensity: { value: params.inkDensity },
                uAbsorptionFactor: { value: params.absorptionFactor }

        });

            // 1. Pick a random color scheme
            const schemeKeys = Object.keys(COLOR_SCHEMES);
            const randomSchemeKey = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
            params.colorScheme = randomSchemeKey;
            const scheme = COLOR_SCHEMES[randomSchemeKey];

            params.paperColor = scheme.paper;
            params.inkColor1 = scheme.ink1;
            params.inkColor2 = scheme.ink2;
            params.accentColor = scheme.accent;
            if (!params.greenScreen) {
                params.backgroundColor = scheme.bg;
            }

            // 2. Randomize geometric dendritic parameters
            params.fractalScale = THREE.MathUtils.randFloat(0.75, 1.45);
            params.branchFreq = THREE.MathUtils.randFloat(1.1, 2.6);
            params.smoothing = THREE.MathUtils.randFloat(0.008, 0.06); // Keep low toward zero for sharp branching creases
            params.ridgeScale = THREE.MathUtils.randFloat(2.0, 4.8);

            // 4. Randomize animation preset

            const randomAnimKey = animKeys[Math.floor(Math.random() * animKeys.length)];
            params.animationPreset = randomAnimKey;
            const anim = ANIMATIONS[randomAnimKey];
            params.speed = anim.speed;
            params.autoRotate = anim.autoRotate;
            params.autoRotateSpeed = anim.autoRotateSpeed;

            // 5. Update uniforms
            material.uniforms.uFractalScale.value = params.fractalScale;
            material.uniforms.uBranchFreq.value = params.branchFreq;
            material.uniforms.uSmoothing.value = params.smoothing;
            material.uniforms.uRidgeScale.value = params.ridgeScale;
            material.uniforms.uCreaseDepth.value = params.creaseDepth;
            material.uniforms.uCoreRadius.value = params.coreRadius;
            material.uniforms.uInkDensity.value = params.inkDensity;
            material.uniforms.uAbsorptionFactor.value = params.absorptionFactor;
            material.uniforms.uContrast.value = params.contrast;

            updateAllMaterialColors();

            // 6. Update GUI display
            gui.controllersRecursive().forEach(c => c.updateDisplay());
        };

        // =========================================================================
        // 8. INTERACTION LOGIC (Zoom, Drag Pan, Click-to-Randomize)
        // =========================================================================
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let pointerDownPos = { x: 0, y: 0 };
        let pointerDownTime = 0;
        let hasMovedSignificantly = false;

        let targetRotationX = 0;
        let targetRotationY = 0;
        let currentRotationX = 0;
        let currentRotationY = 0;

        const updateRotationMatrix = () => {
            const euler = new THREE.Euler(currentRotationX, currentRotationY, 0, 'YXZ');
            const rotationMatrix4 = new THREE.Matrix4().makeRotationFromEuler(euler);
            material.uniforms.uRotation.value.setFromMatrix4(rotationMatrix4);
        };

        updateRotationMatrix();

        window.addEventListener('pointerdown', (e) => {
            if (e.target.closest('.lil-gui')) return;

            isDragging = true;
            hasMovedSignificantly = false;
            pointerDownPos = { x: e.clientX, y: e.clientY };
            pointerDownTime = performance.now();
            previousMousePosition = { x: e.clientX, y: e.clientY };
            document.body.classList.add('dragging');
            window.setPointerCapture?.(e.pointerId);
        });

        window.addEventListener('pointermove', (e) => {
            if (!isDragging) return;

            const deltaX = e.clientX - previousMousePosition.x;
            const deltaY = e.clientY - previousMousePosition.y;

            if (Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y) > 6) {
                hasMovedSignificantly = true;
            }

            // Drag object across screen (pan)
            const panScale = 2 / window.innerHeight;
            params.panX += deltaX * panScale / params.zoom;
            params.panY -= deltaY * panScale / params.zoom;
            updateViewUniforms();

            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('pointerup', (e) => {
            if (isDragging) {
                const clickDuration = performance.now() - pointerDownTime;
                if (!hasMovedSignificantly && clickDuration < 350 && !e.target.closest('.lil-gui')) {
                    if (params.randomizeOnClick) {
                        randomizeScene();
                    }
                }
            }

            isDragging = false;
            document.body.classList.remove('dragging');
            window.releasePointerCapture?.(e.pointerId);
        });

        window.addEventListener('pointercancel', () => {
            isDragging = false;
            document.body.classList.remove('dragging');
        });

        // Mouse wheel zoom
        window.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = Math.exp(-e.deltaY * 0.001);
            params.zoom = THREE.MathUtils.clamp(params.zoom * zoomFactor, 0.2, 8.0);
            updateViewUniforms();
            gui.controllersRecursive().find(c => c.property === 'zoom')?.updateDisplay();
        }, { passive: false });

        // Hide / Show UI with "H" key
        window.addEventListener('keydown', (e) => {
            if (e.key === 'h' || e.key === 'H') {
                gui._hidden ? gui.show() : gui.hide();
            }
        });

        // =========================================================================
        // 9. LIL-GUI SETUP & POST-PROCESSING ATTACHMENT
        // =========================================================================
        const gui = new GUI({ title: 'Dendritic Etch Plate' });

        // Preset Schemes & Randomizer

        folderPresets.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES))
            .name('Color Scheme (10)')
            .onChange(applyColorScheme);
        folderPresets.add(params, 'animationPreset', Object.keys(ANIMATIONS))
            .name('Animation (8)')
            .onChange(applyAnimationPreset);
        folderPresets.add(params, 'randomizeOnClick')
            .name('Click Scene to Randomize');
        folderPresets.add({ randomize: randomizeScene }, 'randomize')
            .name('🎲 Randomize Theme');

        // Color & Substrate Settings
        const folderColors = gui.addFolder('Ink & Substrate');
        folderColors.addColor(params, 'paperColor').name('Substrate / Paper').onChange(() => {
            material.uniforms.uPaperColor.value.copy(hexToVector3(params.paperColor));
        });
        folderColors.addColor(params, 'inkColor1').name('Primary Ink').onChange(() => {
            material.uniforms.uInkColor1.value.copy(hexToVector3(params.inkColor1));
        });
        folderColors.addColor(params, 'inkColor2').name('Secondary Ink').onChange(() => {
            material.uniforms.uInkColor2.value.copy(hexToVector3(params.inkColor2));
        });
        folderColors.addColor(params, 'accentColor').name('Accent / Tips').onChange(() => {
            material.uniforms.uAccentColor.value.copy(hexToVector3(params.accentColor));
        });
        folderColors.add(params, 'substrateGrain', 0.0, 0.25, 0.005).name('Substrate Grain').onChange(v => {
            material.uniforms.uSubstrateGrain.value = v;
        });
        folderColors.add(params, 'contrast', 0.5, 2.0, 0.01).name('Etch Contrast').onChange(v => {
            material.uniforms.uContrast.value = v;
        });

        // Background & Greenscreen
        const folderBg = gui.addFolder('Background & Greenscreen');
        folderBg.add(params, 'greenScreen').name('Green Screen #00ff00').onChange(applyBackground);
        folderBg.addColor(params, 'backgroundColor').name('Background Color').onChange(applyBackground);

        // Animation & Motion Settings
        const folderAnim = gui.addFolder('Animation & Motion');
        folderAnim.add(params, 'speed', 0.0, 3.0, 0.01).name('Animation Speed');
        folderAnim.add(params, 'autoRotate').name('Auto Orbit');
        folderAnim.add(params, 'autoRotateSpeed', -2.0, 2.0, 0.01).name('Orbit Speed');

        // Dendritic SDF Geometry
        const folderSdf = gui.addFolder('Dendritic Branching (SDF)');
        folderSdf.add(params, 'fractalScale', 0.2, 3.0, 0.01).name('Fractal Scale').onChange(v => {
            material.uniforms.uFractalScale.value = v;
        });
        folderSdf.add(params, 'branchFreq', 0.5, 4.0, 0.01).name('Branch Frequency').onChange(v => {
            material.uniforms.uBranchFreq.value = v;
        });
        folderSdf.add(params, 'smoothing', 0.001, 0.2, 0.001).name('Smoothing Factor (Crease)').onChange(v => {
            material.uniforms.uSmoothing.value = v;
        });
        folderSdf.add(params, 'ridgeScale', 0.5, 6.0, 0.05).name('Ridge Scale (abs-sin)').onChange(v => {
            material.uniforms.uRidgeScale.value = v;
        });
        folderSdf.add(params, 'creaseDepth', 0.2, 3.0, 0.01).name('Crease Depth').onChange(v => {
            material.uniforms.uCreaseDepth.value = v;
        });
        folderSdf.add(params, 'coreRadius', 0.5, 4.0, 0.01).name('Core Size').onChange(v => {
            material.uniforms.uCoreRadius.value = v;
        });

        // Absorption & Beer-Lambert
        const folderAbsorption = gui.addFolder('Absorption (Beer-Lambert)');
        folderAbsorption.add(params, 'inkDensity', 1.0, 40.0, 0.1).name('Ink Density').onChange(v => {
            material.uniforms.uInkDensity.value = v;
        });
        folderAbsorption.add(params, 'absorptionFactor', 0.2, 6.0, 0.05).name('Absorption Scale').onChange(v => {
            material.uniforms.uAbsorptionFactor.value = v;
        });
        folderAbsorption.add(params, 'fadeOuter', 1.0, 5.0, 0.01).name('Fade Outer Radius').onChange(v => {
            material.uniforms.uFadeOuter.value = v;
        });
        folderAbsorption.add(params, 'fadeInner', 0.5, 4.0, 0.01).name('Fade Inner Radius').onChange(v => {
            material.uniforms.uFadeInner.value = v;
        });

        // Attach Modular Post-Processing Suite
        postProcessor.attachGUI(gui, "Post-Processing Suite");

        // Render Settings & View
        const folderRender = gui.addFolder('View & DPR');
        folderRender.add(params, 'dpr', 0.2, 2.5, 0.1).name('Pixel Ratio (DPR)').onChange(updateSize);
        folderRender.add(params, 'zoom', 0.2, 8.0, 0.01).name('Zoom').onChange(updateViewUniforms);
        folderRender.add(params, 'panX', -4.0, 4.0, 0.01).name('Pan X').onChange(updateViewUniforms);
        folderRender.add(params, 'panY', -4.0, 4.0, 0.01).name('Pan Y').onChange(updateViewUniforms);
        folderRender.add({
            resetView: () => {
                params.zoom = 1.0;
                params.panX = 0.0;
                params.panY = 0.0;
                targetRotationX = 0;
                targetRotationY = 0;
                updateViewUniforms();
                gui.controllersRecursive().forEach(c => c.updateDisplay());
            }
        }, 'resetView').name('Reset View');

        gui.open();

        // =========================================================================
        // 10. RENDER LOOP
        // =========================================================================
        const clock = new THREE.Clock();
        let currentTime = 0;

        const animate = () => {
            requestAnimationFrame(animate);

            let delta = clock.getDelta();
            delta = Math.min(delta, 0.1);
            currentTime += delta * params.speed;

            if (params.autoRotate && !isDragging) {
                targetRotationY += delta * params.autoRotateSpeed;
            }

            // Animation specific tilt motions
            let animTiltX = 0;
            let animTiltY = 0;
            const currentAnim = ANIMATIONS[params.animationPreset];
            if (currentAnim) {
                if (currentAnim.tiltType === 'wobble') {
                    animTiltX = Math.sin(currentTime * 0.9) * 0.20;
                    animTiltY = Math.cos(currentTime * 0.65) * 0.26;
                } else if (currentAnim.tiltType === 'lissajous') {
                    animTiltX = Math.sin(currentTime * 0.7) * 0.28;
                    animTiltY = Math.sin(currentTime * 0.35) * 0.40;
                } else if (currentAnim.tiltType === 'turntable') {
                    animTiltX = Math.sin(currentTime * 0.3) * 0.08;
                } else if (currentAnim.tiltType === 'crystallize') {
                    animTiltX = Math.sin(currentTime * 0.4) * 0.15;
                    animTiltY = Math.cos(currentTime * 0.5) * 0.18;
                } else if (currentAnim.tiltType === 'erosion') {
                    animTiltX = Math.cos(currentTime * 0.4) * 0.12;
                }
            }

            targetRotationX = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, targetRotationX));

            currentRotationX += (targetRotationX + animTiltX - currentRotationX) * 0.08;
            currentRotationY += (targetRotationY + animTiltY - currentRotationY) * 0.08;

            updateRotationMatrix();

            material.uniforms.uTime.value = currentTime;
            
            // Render scene through the PostProcessor suite
            postProcessor.renderScene(scene, camera);
        };

        animate();
    </script>
</body>
</html>
