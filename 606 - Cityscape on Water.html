<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>606 - Transparent Cityscape on Water</title>

  <!-- p5.js v2.3.3 official recommended CDN -->
  <script src="https://cdn.jsdelivr.net/npm/p5@2.3.3/lib/p5.min.js"></script>
  <!-- lil-gui for modern interactive controls -->
  <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.19/dist/lil-gui.umd.min.js"></script>

  <style>
    /* ============================================================
       CSS Reset & Viewport UX
       ============================================================ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #0b132b;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "JetBrains Mono", monospace;
    }

    /* Edge-to-Edge Fullscreen Canvas */
    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      margin: 0;
      padding: 0;
      border: none;
      outline: none;
    }

    canvas {
      display: block;
      width: 100vw !important;
      height: 100vh !important;
      outline: none;
      border: none;
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }

    /* ============================================================
       lil-gui Custom Glassmorphic Dark Aesthetic
       ============================================================ */
    .lil-gui {
      --background-color: rgba(12, 15, 22, 0.88) !important;
      --text-color: #e2e8f0 !important;
      --title-background-color: rgba(20, 25, 36, 0.95) !important;
      --widget-color: rgba(32, 38, 54, 0.75) !important;
      --hover-color: rgba(50, 60, 85, 0.9) !important;
      --focus-color: #00f0ff !important;
      --number-color: #38bdf8 !important;
      --string-color: #4ade80 !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "JetBrains Mono", monospace !important;
      border-radius: 10px !important;
      backdrop-filter: blur(20px) !important;
      -webkit-backdrop-filter: blur(20px) !important;
      border: 1px solid rgba(255, 255, 255, 0.12) !important;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.65) !important;
      margin-top: 14px;
      margin-right: 14px;
      z-index: 1000;
    }

    .lil-gui .title {
      font-weight: 700 !important;
      letter-spacing: 0.08em !important;
      text-transform: uppercase !important;
      font-size: 11px !important;
    }
  </style>
</head>
<body>

  <div id="canvas-container"></div>

  <script>
    // ============================================================
    // FractalKitty (Genuary 2026)
    // https://www.fractalkitty.com/genuary-2026/
    //
    // Description:
    // "transparent city scape on water with reflection and lines in
    //  the water with a consistent color pallet and windows in the city."
    //
    // Enhanced with:
    // - Fullscreen borderless responsive viewport
    // - Smooth water reflection wave ripples & breathing water streaks
    // - Subtle window light twinkles & ambient waterline mist
    // - 19 curated harmonious color schemes (including all requested palettes)
    // - Cursor-anchored pan & zoom with smooth interpolation
    // - Procedural theme randomizer on scene click (toggleable)
    // - Interactive lil-gui control panel & animation speed controls
    // ============================================================

    // 19 Curated Color Schemes Pattern
    const COLOR_SCHEMES = {
      'Original': {
        name: 'Original (FractalKitty Procedural)',
        bg: '#0f172a',
        colors: []
      },
      'Monochromatic': {
        name: 'Monochromatic (Deep Cobalt)',
        bg: '#040d1a',
        colors: ['#061a30', '#0a2e52', '#0f467a', '#1765a8', '#2188db', '#4bb3fd', '#9ad9fe', '#d0eeff']
      },
      'Analogous': {
        name: 'Analogous (Ember Twilight)',
        bg: '#140510',
        colors: ['#2d0922', '#59113e', '#8c1a4b', '#c72c41', '#e8503a', '#f5853f', '#f9b34c', '#fed976']
      },
      'Complementary': {
        name: 'Complementary (Teal & Amber)',
        bg: '#030f14',
        colors: ['#002b36', '#005f73', '#0a9396', '#94d2bd', '#ee9b00', '#ca6702', '#bb3e03', '#ae2012']
      },
      'Split-complementary': {
        name: 'Split-complementary (Cyber Orchid)',
        bg: '#070d12',
        colors: ['#0b221a', '#174d38', '#2ec4b6', '#a7f3d0', '#7209b7', '#b5179e', '#f72585', '#ff70a6']
      },
      'Triadic': {
        name: 'Triadic (Neon Arcade)',
        bg: '#050814',
        colors: ['#071a3d', '#0077b6', '#00b4d8', '#90e0ef', '#f48c06', '#ffba08', '#38b000', '#70e000']
      },
      'Tetradic': {
        name: 'Tetradic (Aurora Spectrum)',
        bg: '#080814',
        colors: ['#141432', '#31a2ac', '#61e8e1', '#f25757', '#ff85a1', '#ffd166', '#7b2cbf', '#9d4edd']
      },
      'Double split-complementary': {
        name: 'Double split-complementary (Synthwave)',
        bg: '#060a14',
        colors: ['#101030', '#0077b6', '#00b4d8', '#e65100', '#fb8500', '#8338ec', '#b5179e', '#ff007f']
      },
      'Achromatic': {
        name: 'Achromatic (Black & White)',
        bg: '#080808',
        colors: ['#121212', '#242424', '#484848', '#6e6e6e', '#989898', '#c4c4c4', '#e6e6e6', '#ffffff']
      },
      'Achromatic + Accent': {
        name: 'Achromatic + Accent (Noir & Scarlet)',
        bg: '#080808',
        colors: ['#161616', '#303030', '#565656', '#848484', '#b8b8b8', '#ffffff', '#ff1e44', '#e60026']
      },
      'Neutral + accent': {
        name: 'Neutral + accent (Slate & Gold)',
        bg: '#121110',
        colors: ['#1c1a18', '#302c28', '#4e4842', '#766e66', '#a89e94', '#dcd4ca', '#ffb703', '#00f0ff']
      },
      'Palette 12: F6AA1C, BC3908, 941B0C': {
        name: 'Palette 12: (F6AA1C, BC3908, 941B0C, F6AA1C, 220901)',
        bg: '#220901',
        colors: ['#f6aa1c', '#bc3908', '#941b0c', '#f6aa1c', '#220901']
      },
      'Palette 13: 63D1CF, 5BC0BE, 4BAD9E': {
        name: 'Palette 13: (63D1CF, 5BC0BE, 4BAD9E, 4BAD9E, 0B132B, 000000)',
        bg: '#000000',
        colors: ['#63d1cf', '#5bc0be', '#4bad9e', '#4bad9e', '#0b132b', '#000000']
      },
      'Palette 14: AA60C8, D69ADE, C9A3C6': {
        name: 'Palette 14: (AA60C8, D69ADE, C9A3C6, CFB5C2, 0D001D, 120A12)',
        bg: '#0d001d',
        colors: ['#aa60c8', '#d69ade', '#c9a3c6', '#cfb5c2', '#0d001d', '#120a12']
      },
      'Palette 15: FEF1BE, FFBA00, 008189': {
        name: 'Palette 15: (FEF1BE, FFBA00, 008189, 00474D, 061210)',
        bg: '#061210',
        colors: ['#fef1be', '#ffba00', '#008189', '#00474d', '#061210']
      },
      'Palette 16: D4FFB0, 7FFF00, 00B894': {
        name: 'Palette 16: (D4FFB0, 7FFF00, 00B894, 0A3322, 05140A)',
        bg: '#05140a',
        colors: ['#d4ffb0', '#7fff00', '#00b894', '#0a3322', '#05140a']
      },
      'Palette 17: FFE8CC, FF8C00, C7501A': {
        name: 'Palette 17: (FFE8CC, FF8C00, C7501A, 3D1050, 0E0618)',
        bg: '#0e0618',
        colors: ['#ffe8cc', '#ff8c00', '#c7501a', '#3d1050', '#0e0618']
      },
      'Palette 18: E8E0FF, B38FFF, 6A3DE8': {
        name: 'Palette 18: (E8E0FF, B38FFF, 6A3DE8, 1A1250, 090612)',
        bg: '#090612',
        colors: ['#e8e0ff', '#b38fff', '#6a3de8', '#1a1250', '#090612']
      },
      'Palette 19: E0FBFF, 00F0FF, D40078': {
        name: 'Palette 19: (E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)',
        bg: '#05020f',
        colors: ['#e0fbff', '#00f0ff', '#d40078', '#1e0a3d', '#05020f']
      }
    };

    // ============================================================
    // Global Settings & Parameters
    // ============================================================
    const settings = {
      // Color & Visual Theme
      colorScheme: 'Original',

      // Animation & Timing
      isPlaying: true,
      animSpeed: 1.0,
      waterWaveAmp: 1.0,
      waterWaveSpeed: 1.0,
      streakDrift: 1.0,
      windowTwinkle: 0.5,
      waterRipples: true,

      // Atmosphere & Waterline
      waterlineGlow: true,
      mistEnabled: true,
      waterlineOffset: 0,

      // Architecture & Geometry
      buildingCount: 110,
      heightScale: 1.0,
      widthScale: 1.0,
      spreadScale: 1.0,

      // UX & Camera Viewport
      zoom: 1.0,
      clickToRandomize: true,

      // Actions
      regenerate: () => reseedBuildings(),
      randomizeTheme: () => randomizeAll(),
      resetCamera: () => resetCameraView(),
      saveSnapshot: () => saveCanvas('cityscape_' + Date.now(), 'png')
    };

    // Core artistic data
    let colors = [];
    let buildings = [];
    let n;
    let t = 0;
    let h; // Background color
    let originalBgHex = '#0f172a';
    let originalBgColor;
    let cnv;
    let mistParticles = [];

    // Camera Pan & Zoom Transform State
    let panX = 0, panY = 0;
    let targetPanX = 0, targetPanY = 0;
    let zoomLevel = 1.0, targetZoom = 1.0;
    let isDragging = false;
    let dragStartX = 0, dragStartY = 0;
    let startPanX = 0, startPanY = 0;
    let totalDragDistance = 0;

    let gui = null;

    // Helper: Hex string to [r, g, b]
    function hexToRgb(hex) {
      let c = hex.replace('#', '');
      if (c.length === 3) c = c.split('').map(x => x + x).join('');
      let num = parseInt(c, 16);
      return [(num >> 16) & 255, (num >> 8) & 255, num & 255];
    }

    // Palette generator: produces 45 [r, g, b] entries compatible with FractalKitty's coordinate formulas
    function generateColorsForScheme(schemeKey) {
      if (schemeKey === 'Original') {
        let rC = [random(5, 10), random(20, 35), random(25, 40)];
        let cnt = 0;
        let cols = [];
        for (let i = 1; i < 10; i += 0.2) {
          cols[cnt] = [
            (1.2 * rC[2]) / i + rC[0] * i * 0.8,
            (-1.2 * rC[0]) / i + rC[1] * i * 0.8,
            (1.2 * rC[1]) / i + rC[2] * i * 0.8
          ];
          cnt++;
        }
        return cols;
      }

      const scheme = COLOR_SCHEMES[schemeKey] || COLOR_SCHEMES['Original'];
      const rgbList = scheme.colors.map(hexToRgb);
      const count = 45;
      const cols = [];
      for (let i = 0; i < count; i++) {
        let tVal = (i / (count - 1)) * (rgbList.length - 1);
        let idx = Math.floor(tVal);
        let frac = tVal - idx;
        let c1 = rgbList[idx];
        let c2 = rgbList[Math.min(idx + 1, rgbList.length - 1)];
        cols.push([
          Math.round(c1[0] + (c2[0] - c1[0]) * frac),
          Math.round(c1[1] + (c2[1] - c1[1]) * frac),
          Math.round(c1[2] + (c2[2] - c1[2]) * frac)
        ]);
      }
      return cols;
    }

    // Update color palette and background
    function applyColorScheme(schemeKey) {
      settings.colorScheme = schemeKey;
      colors = generateColorsForScheme(schemeKey);

      if (schemeKey === 'Original') {
        h = color(random(colors));
        h.setAlpha(100);
        let r = red(h), g = green(h), b = blue(h);
        originalBgColor = color(r, g, b);
        originalBgHex = '#' + [r, g, b].map(x => Math.round(x).toString(16).padStart(2, '0')).join('');
        document.body.style.backgroundColor = originalBgHex;
        h.setAlpha(50);
      } else {
        const sc = COLOR_SCHEMES[schemeKey];
        document.body.style.backgroundColor = sc.bg;
        h = color(sc.bg);
        h.setAlpha(50);
      }

      // Re-assign colors to existing buildings
      for (let i = 0; i < buildings.length; i++) {
        buildings[i].c = random(colors);
        buildings[i].c2 = random(colors);
      }
    }

    // ============================================================
    // Building Class (Bs)
    // ============================================================
    class Bs {
      constructor(baseW, baseH) {
        const wRef = baseW || width;
        const hRef = baseH || height;

        this.x = randomGaussian(0, (wRef / 4) * settings.spreadScale);
        this.c = random(colors);
        this.c2 = random(colors);

        // Core geometric formula from FractalKitty
        this.baseH = abs(random(hRef / 3 - abs(this.x / 2), -abs(this.x / 5)));
        if (this.baseH < 25) this.baseH = random(30, 90);
        this.h = this.baseH * settings.heightScale;

        this.baseW = random(wRef / 50, wRef / 10);
        this.w = this.baseW * settings.widthScale;

        this.bools = [
          random([true, false]),
          random([true, false]),
          random([true, false]),
          random([true, false]),
          random([true, false]),
          random([true, false]),
          random([true, false])
        ];
        this.windows = random([0, 1, 2, 2, 3, 3, 3, 4, 4, 5]);
        this.rows = random([4, 5, 6, 7, 8]);

        // Persistent decorative line parameters to ensure smooth organic shimmer without 60fps noise flicker
        this.extraLineX = random(-wRef / 3, wRef / 3);
        this.extraLineY = abs(random(10, hRef / 3));
        this.extraLineWeight = random(0.5, 2.0);

        // Phase offsets for organic breathing
        this.ripplePhase = random(TWO_PI);
        this.twinklePhases = [];
        for (let j = 0; j < 6; j++) {
          this.twinklePhases[j] = [];
          for (let k = 0; k < 9; k++) {
            this.twinklePhases[j][k] = random(TWO_PI);
          }
        }
      }

      display(curT) {
        let c = color(this.c);
        c.setAlpha(20);
        let c1 = color(this.c);
        c1.setAlpha(50);
        let c2 = color(this.c2);
        c2.setAlpha(15);
        let c3 = color(this.c2);
        c3.setAlpha(40);

        // ------------------------------------------------------------
        // 1. Sky Building (Above Waterline: y < 0)
        // ------------------------------------------------------------
        fill(c1);
        rect(this.x, -this.h + settings.waterlineOffset, this.w, this.h);

        // ------------------------------------------------------------
        // 2. Reflection in Water (Below Waterline: y > 0)
        // ------------------------------------------------------------
        fill(c);
        if (settings.waterRipples && settings.waterWaveAmp > 0 && settings.animSpeed > 0) {
          // Water-sliced reflection with gentle undulating ripple
          let slices = 8;
          let sliceH = this.h / slices;
          for (let s = 0; s < slices; s++) {
            let sy = s * sliceH;
            let depthFrac = (sy + sliceH * 0.5) / this.h;
            let waveX = sin(curT * 0.03 * settings.waterWaveSpeed * settings.animSpeed + sy * 0.04 + this.x * 0.008 + this.ripplePhase) * (7 * settings.waterWaveAmp * depthFrac);
            rect(this.x + waveX, sy + settings.waterlineOffset, this.w, sliceH + 0.5);
          }
        } else {
          rect(this.x, settings.waterlineOffset, this.w, this.h);
        }

        // ------------------------------------------------------------
        // 3. Windows (Sky building & water reflection)
        // ------------------------------------------------------------
        if (this.bools[0]) {
          for (let j = 0; j < this.windows; j++) {
            for (let k = 0; k < this.rows; k++) {
              let d1 = this.w / (this.windows + 1);
              let d2 = this.h / this.rows;
              let x1 = this.x + d1 / 2 + d1 * j;

              // Window twinkle modulation
              let twinkle = 0;
              if (settings.windowTwinkle > 0 && settings.animSpeed > 0) {
                twinkle = sin(curT * 0.04 * settings.animSpeed + this.twinklePhases[j][k]) * (settings.windowTwinkle * 22);
              }

              // Sky window
              let curC3 = color(this.c2);
              curC3.setAlpha(constrain(40 + twinkle, 10, 85));
              fill(curC3);
              rect(x1, -d2 / 2 - d2 * k + settings.waterlineOffset, d1 / 2, d2 / 2);

              // Reflection window with wave displacement
              let depthFrac = (d2 * k + d2 * 0.5) / this.h;
              let waveWinX = 0;
              if (settings.waterRipples && settings.waterWaveAmp > 0 && settings.animSpeed > 0) {
                waveWinX = sin(curT * 0.03 * settings.waterWaveSpeed * settings.animSpeed + d2 * k * 0.04 + this.x * 0.008 + this.ripplePhase) * (7 * settings.waterWaveAmp * depthFrac);
              }
              let curC2 = color(this.c2);
              curC2.setAlpha(constrain(15 + twinkle * 0.5, 5, 50));
              fill(curC2);
              rect(x1 + waveWinX, d2 * k + settings.waterlineOffset, d1 / 2, d2 / 2);
            }
          }

          // ------------------------------------------------------------
          // 4. Horizontal Water Lines & Shimmering Streaks
          // ------------------------------------------------------------
          if (this.bools[1]) {
            push();
            let c4 = color(this.c);
            c4.setAlpha(40);
            stroke(c4);
            strokeWeight(this.rows / 5);
            let x2 = this.x - this.rows * this.windows;
            let y2 = abs(this.h / 2);

            let ripple1 = 0;
            let pulse1 = 0;
            if (settings.streakDrift > 0 && settings.animSpeed > 0) {
              ripple1 = sin(curT * 0.025 * settings.waterWaveSpeed * settings.animSpeed + y2 * 0.03 + this.x * 0.007) * (10 * settings.streakDrift);
              pulse1 = cos(curT * 0.02 * settings.waterWaveSpeed * settings.animSpeed + y2 * 0.04) * (6 * settings.streakDrift);
            }
            line(
              x2 - this.c[1] + ripple1 - pulse1,
              y2 + settings.waterlineOffset,
              x2 + (this.c[0] * this.windows) / 4 + ripple1 + pulse1,
              y2 + settings.waterlineOffset
            );
            pop();

            if (this.bools[2]) {
              push();
              let c5 = color(this.c);
              c5.setAlpha(15);
              stroke(c5);
              strokeWeight(this.rows / 10);
              let x2 = this.x - this.rows * this.windows;
              let y2 = abs(this.h / 1.5);

              let ripple2 = 0;
              let pulse2 = 0;
              if (settings.streakDrift > 0 && settings.animSpeed > 0) {
                ripple2 = sin(curT * 0.022 * settings.waterWaveSpeed * settings.animSpeed + y2 * 0.035 + this.x * 0.006) * (12 * settings.streakDrift);
                pulse2 = cos(curT * 0.018 * settings.waterWaveSpeed * settings.animSpeed + y2 * 0.045) * (8 * settings.streakDrift);
              }
              line(
                x2 - this.c[2] + ripple2 - pulse2,
                y2 + settings.waterlineOffset,
                x2 + (this.c[0] * this.windows) / 5 + ripple2 + pulse2,
                y2 + settings.waterlineOffset
              );
              pop();

              if (this.bools[3]) {
                push();
                let c6 = color(h);
                c6.setAlpha(20);
                stroke(c6);
                let safeWin = Math.max(1, this.windows);
                strokeWeight(this.rows / safeWin);
                let x2 = this.x - this.rows * this.windows;
                let y2 = abs(this.h / safeWin + this.c[0]);

                let ripple3 = 0;
                if (settings.streakDrift > 0 && settings.animSpeed > 0) {
                  ripple3 = sin(curT * 0.028 * settings.waterWaveSpeed * settings.animSpeed + y2 * 0.03 + this.x * 0.005) * (14 * settings.streakDrift);
                }
                line(
                  x2 - this.c[2] + ripple3,
                  y2 + settings.waterlineOffset,
                  x2 + (this.c[0] * this.windows) / 5 + ripple3,
                  y2 + settings.waterlineOffset
                );
                pop();

                if (this.bools[4] || this.bools[5] || this.bools[6]) {
                  push();
                  stroke(255, 255, 255, 40);
                  strokeWeight(this.extraLineWeight);
                  let ripple4 = 0;
                  if (settings.streakDrift > 0 && settings.animSpeed > 0) {
                    ripple4 = sin(curT * 0.02 * settings.waterWaveSpeed * settings.animSpeed + this.extraLineY * 0.04) * (10 * settings.streakDrift);
                  }
                  line(
                    this.extraLineX - this.c[1] * 0.8 + ripple4,
                    this.extraLineY + settings.waterlineOffset,
                    this.extraLineX + (this.c[0] * this.windows) / 5 + ripple4,
                    this.extraLineY + settings.waterlineOffset
                  );
                  pop();
                }
              }
            }
          }
        }
      }
    }

    // ============================================================
    // Waterline Atmospheric Mist Particle
    // ============================================================
    class MistParticle {
      constructor(w, h) {
        this.w = w;
        this.h = h;
        this.reset(true);
      }

      reset(initial = false) {
        this.x = initial ? random(-this.w / 2, this.w / 2) : -this.w / 2 - random(40, 150);
        this.y = random(-18, 38);
        this.size = random(40, 130);
        this.speed = random(0.25, 0.75);
        this.baseAlpha = random(5, 16);
        this.phase = random(TWO_PI);
      }

      update(speedMult) {
        this.x += this.speed * speedMult;
        if (this.x > this.w / 2 + 150) {
          this.reset(false);
        }
      }

      display(col) {
        push();
        noStroke();
        let a = this.baseAlpha * (0.8 + 0.2 * sin(t * 0.03 + this.phase));
        fill(col[0], col[1], col[2], a);
        ellipse(this.x, this.y + settings.waterlineOffset, this.size * 2.0, this.size * 0.45);
        pop();
      }
    }

    function initMistParticles(w, h) {
      mistParticles = [];
      for (let i = 0; i < 40; i++) {
        mistParticles.push(new MistParticle(w, h));
      }
    }

    // Reseed building collection
    function reseedBuildings() {
      buildings = [];
      const count = settings.buildingCount;
      for (let i = 0; i < count; i++) {
        buildings.push(new Bs(width, height));
      }
    }

    // Update dimensions on existing buildings smoothly
    function updateBuildingDimensions() {
      for (let i = 0; i < buildings.length; i++) {
        buildings[i].h = buildings[i].baseH * settings.heightScale;
        buildings[i].w = buildings[i].baseW * settings.widthScale;
      }
    }

    // Procedural Theme & Geometry Randomizer (Requirement 6)
    function randomizeAll() {
      const keys = Object.keys(COLOR_SCHEMES);
      const randomScheme = random(keys);
      settings.colorScheme = randomScheme;

      settings.buildingCount = floor(random(75, 160));
      settings.heightScale = parseFloat(random(0.75, 1.4).toFixed(2));
      settings.widthScale = parseFloat(random(0.75, 1.35).toFixed(2));
      settings.spreadScale = parseFloat(random(0.85, 1.3).toFixed(2));
      settings.animSpeed = parseFloat(random(0.7, 1.5).toFixed(2));
      settings.waterWaveAmp = parseFloat(random(0.6, 1.6).toFixed(2));
      settings.streakDrift = parseFloat(random(0.6, 1.6).toFixed(2));
      settings.windowTwinkle = parseFloat(random(0.3, 0.8).toFixed(2));

      applyColorScheme(randomScheme);
      reseedBuildings();

      if (gui) {
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      }
    }

    function resetCameraView() {
      targetPanX = 0;
      targetPanY = 0;
      targetZoom = 1.0;
    }

    // ============================================================
    // p5.js Core Lifecycle
    // ============================================================
    function setup() {
      const container = document.getElementById('canvas-container');
      const w = container ? (container.clientWidth || windowWidth) : windowWidth;
      const h_ = container ? (container.clientHeight || windowHeight) : windowHeight;

      cnv = createCanvas(w, h_);
      cnv.parent('canvas-container');
      noStroke();

      describe(
        "transparent city scape on water with reflection and lines in the water with a consistent color pallet and windows in the city."
      );

      applyColorScheme(settings.colorScheme);
      reseedBuildings();
      initMistParticles(w, h_);
      initGUI();
    }

    function windowResized() {
      const container = document.getElementById('canvas-container');
      const w = container ? (container.clientWidth || windowWidth) : windowWidth;
      const h_ = container ? (container.clientHeight || windowHeight) : windowHeight;
      resizeCanvas(w, h_);
      initMistParticles(w, h_);
    }

    function draw() {
      // Clear background with current theme background
      const currentScheme = COLOR_SCHEMES[settings.colorScheme] || COLOR_SCHEMES['Original'];
      let bgCol = (settings.colorScheme === 'Original') ? originalBgColor : color(currentScheme.bg);
      background(bgCol);

      // Animation tick
      if (settings.isPlaying && settings.animSpeed > 0) {
        t += settings.animSpeed;
      }

      // Smooth camera interpolation
      panX = lerp(panX, targetPanX, 0.16);
      panY = lerp(panY, targetPanY, 0.16);
      zoomLevel = lerp(zoomLevel, targetZoom, 0.16);
      settings.zoom = parseFloat(zoomLevel.toFixed(2));

      push();
      // Apply Camera Viewport: center at screen center + pan, scaled by zoom
      translate(width / 2 + panX, height / 2 + panY);
      scale(zoomLevel);

      // Render buildings and their reflections
      for (let i = 0; i < buildings.length; i++) {
        buildings[i].display(t);
      }

      // Atmospheric waterline mist
      if (settings.mistEnabled && mistParticles.length > 0) {
        let mistCol = colors.length > 0 ? colors[0] : [200, 220, 255];
        for (let i = 0; i < mistParticles.length; i++) {
          if (settings.isPlaying && settings.animSpeed > 0) {
            mistParticles[i].update(settings.animSpeed);
          }
          mistParticles[i].display(mistCol);
        }
      }

      // Waterline subtle luminous horizon glow
      if (settings.waterlineGlow) {
        push();
        strokeWeight(1.2);
        let glowCol = (settings.colorScheme === 'Original')
          ? color(255, 255, 255, 30)
          : color(currentScheme.colors[1] || '#ffffff');
        glowCol.setAlpha(35);
        stroke(glowCol);
        line(-width, settings.waterlineOffset, width, settings.waterlineOffset);
        pop();
      }

      pop();
    }

    // ============================================================
    // Interactive Controls (Zoom with Wheel & Pan with Drag)
    // ============================================================
    function mouseWheel(event) {
      if (event.target && event.target.closest && event.target.closest('.lil-gui')) {
        return;
      }

      const zoomFactor = event.deltaY < 0 ? 1.09 : 0.91;
      const newZoom = constrain(targetZoom * zoomFactor, 0.2, 10.0);

      // Cursor-anchored smooth zoom
      const mx = mouseX - width / 2;
      const my = mouseY - height / 2;
      targetPanX = mx - (mx - targetPanX) * (newZoom / targetZoom);
      targetPanY = my - (my - targetPanY) * (newZoom / targetZoom);
      targetZoom = newZoom;

      return false; // Prevent page scroll
    }

    function mousePressed(event) {
      if (event.target && event.target.closest && event.target.closest('.lil-gui')) {
        return;
      }
      isDragging = true;
      dragStartX = mouseX;
      dragStartY = mouseY;
      startPanX = targetPanX;
      startPanY = targetPanY;
      totalDragDistance = 0;
    }

    function mouseDragged(event) {
      if (!isDragging) return;
      if (event.target && event.target.closest && event.target.closest('.lil-gui')) {
        return;
      }
      const dx = mouseX - dragStartX;
      const dy = mouseY - dragStartY;
      totalDragDistance = Math.hypot(dx, dy);
      targetPanX = startPanX + dx;
      targetPanY = startPanY + dy;
    }

    function mouseReleased(event) {
      if (!isDragging) return;
      isDragging = false;

      // Pure click detection (distance moved < 6px) triggers procedural theme randomizer
      if (totalDragDistance < 6) {
        if (settings.clickToRandomize) {
          randomizeAll();
        }
      }
    }

    // Touch Support for Mobile & Tablet Devices
    function touchStarted(event) {
      if (event.target && event.target.closest && event.target.closest('.lil-gui')) {
        return;
      }
      if (touches.length === 1) {
        isDragging = true;
        dragStartX = touches[0].x;
        dragStartY = touches[0].y;
        startPanX = targetPanX;
        startPanY = targetPanY;
        totalDragDistance = 0;
      }
    }

    function touchMoved(event) {
      if (!isDragging) return;
      if (event.target && event.target.closest && event.target.closest('.lil-gui')) {
        return;
      }
      if (touches.length === 1) {
        const dx = touches[0].x - dragStartX;
        const dy = touches[0].y - dragStartY;
        totalDragDistance = Math.hypot(dx, dy);
        targetPanX = startPanX + dx;
        targetPanY = startPanY + dy;
        return false;
      }
    }

    function touchEnded(event) {
      if (!isDragging) return;
      isDragging = false;
      if (totalDragDistance < 8 && settings.clickToRandomize) {
        randomizeAll();
      }
    }

    // Keyboard Shortcuts
    function keyPressed() {
      // Key 'S' or 's': Save PNG snapshot
      if (keyCode === 83 || key === 's' || key === 'S') {
        saveCanvas('cityscape_' + Date.now(), 'png');
      }
      // Spacebar: Randomize theme & scene
      if (keyCode === 32) {
        randomizeAll();
      }
      // Key 'R' or 'r': Reset camera view
      if (keyCode === 82 || key === 'r' || key === 'R') {
        resetCameraView();
      }
    }

    // ============================================================
    // lil-gui Controller Setup
    // ============================================================
    function initGUI() {
      if (gui) {
        gui.destroy();
      }

      gui = new lil.GUI({ title: 'Transparent Cityscape' });
      gui.domElement.classList.add('lil-gui');

      // Folder 1: Palette & Atmosphere
      const fPalette = gui.addFolder('Palette & Atmosphere');
      fPalette.add(settings, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Color Scheme').onChange(val => {
        applyColorScheme(val);
      });
      fPalette.add(settings, 'waterlineGlow').name('Waterline Glow');
      fPalette.add(settings, 'mistEnabled').name('Water Mist');
      fPalette.add(settings, 'waterlineOffset', -120, 120, 1).name('Horizon Offset');

      // Folder 2: Animation Dynamics
      const fAnim = gui.addFolder('Animation Dynamics');
      fAnim.add(settings, 'isPlaying').name('Play Animation');
      fAnim.add(settings, 'animSpeed', 0.0, 3.0, 0.05).name('Anim Speed');
      fAnim.add(settings, 'waterWaveAmp', 0.0, 3.0, 0.05).name('Water Wave Amp');
      fAnim.add(settings, 'waterWaveSpeed', 0.1, 3.0, 0.05).name('Wave Speed');
      fAnim.add(settings, 'streakDrift', 0.0, 3.0, 0.05).name('Streak Drift');
      fAnim.add(settings, 'windowTwinkle', 0.0, 1.0, 0.02).name('Window Twinkle');
      fAnim.add(settings, 'waterRipples').name('Water Ripples');

      // Folder 3: City Architecture
      const fCity = gui.addFolder('City Architecture');
      fCity.add(settings, 'buildingCount', 30, 250, 1).name('Building Count').onChange(() => {
        reseedBuildings();
      });
      fCity.add(settings, 'heightScale', 0.4, 2.5, 0.05).name('Height Scale').onChange(() => {
        updateBuildingDimensions();
      });
      fCity.add(settings, 'widthScale', 0.4, 2.5, 0.05).name('Width Scale').onChange(() => {
        updateBuildingDimensions();
      });
      fCity.add(settings, 'spreadScale', 0.5, 2.0, 0.05).name('Skyline Spread').onChange(() => {
        reseedBuildings();
      });

      // Folder 4: Camera & Actions
      const fCam = gui.addFolder('Camera & Actions');
      fCam.add(settings, 'clickToRandomize').name('Click to Randomize');
      fCam.add(settings, 'zoom').name('Zoom Level').listen().disable();
      fCam.add(settings, 'resetCamera').name('Reset Camera (R)');
      fCam.add(settings, 'regenerate').name('Reseed City');
      fCam.add(settings, 'randomizeTheme').name('Randomize (Space)');
      fCam.add(settings, 'saveSnapshot').name('Save PNG (S)');

      fPalette.open();
      fAnim.open();
      fCity.close();
      fCam.close();
    }
  </script>
</body>
</html>
