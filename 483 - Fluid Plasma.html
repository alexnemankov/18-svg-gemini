<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procedural Fluid Plasma</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
    }
    #canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
      cursor: grab;
      touch-action: none;
    }
    #canvas:active {
      cursor: grabbing;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script id="vs" type="x-shader/x-vertex">
    attribute vec3 position;
    void main(void) {
      gl_Position = vec4(position, 1.0);
    }
  </script>

  <script id="fs" type="x-shader/x-fragment">
    precision mediump float;
    uniform float time;
    uniform vec2  mouse;
    uniform vec2  resolution;
    uniform vec2  u_offset;
    uniform float u_zoom;

    uniform int   u_colorMode; // 0: Original, 1: Palette
    uniform vec3  u_c1;
    uniform vec3  u_c2;
    uniform vec3  u_c3;
    uniform vec3  u_c4;
    uniform vec3  u_c5;
    uniform vec3  u_bgColor;
    uniform bool  u_greenscreen;
    uniform bool  u_invert;
    uniform float u_colorCycle;
    uniform float u_contrast;
    uniform float u_brightness;

    // Geometric and motion parameters
    uniform float u_iterations;
    uniform float u_twist;
    uniform float u_complexity;
    uniform float u_rotationSpeed;
    uniform float u_morphSpeed;
    uniform float u_power;
    uniform float u_noiseScale;

    float PI = 3.141592653589793;

    float random(vec2 p) {
      return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453123);
    }

    float noise(vec2 p) {
      vec2 i = floor(p);
      vec2 f = fract(p);
      
      float a = random(i);
      float b = random(i + vec2(1.0, 0.0));
      float c = random(i + vec2(0.0, 1.0));
      float d = random(i + vec2(1.0, 1.0));
      
      vec2 u = f * f * (3.0 - 2.0 * f);
      
      return mix(a, b, u.x) + (c - a)* u.y * (1.0 - u.x) + (d - b) * u.x * u.y;
    }

    vec2 rotate2d(vec2 p, float angle){
      p = mat2(cos(angle), -sin(angle), sin(angle), cos(angle)) * p;
      return p;
    }

    vec3 samplePalette(float t) {
      t = fract(t);
      if (t < 0.25) {
        return mix(u_c1, u_c2, t * 4.0);
      } else if (t < 0.5) {
        return mix(u_c2, u_c3, (t - 0.25) * 4.0);
      } else if (t < 0.75) {
        return mix(u_c3, u_c4, (t - 0.5) * 4.0);
      } else {
        return mix(u_c4, u_c5, (t - 0.75) * 4.0);
      }
    }

    void main(void) {
      vec2 p = vec2(gl_FragCoord.xy * 2.0 - resolution) / min(resolution.x, resolution.y);
      p = (p - u_offset) / max(u_zoom, 0.001);
      
      vec2 m = vec2(mouse.x * 2.0 - 1.0, -mouse.y * 2.0 + 1.0);
      float l = length(p);

      for (int i = 1; i < 28; i++) {
        float fi = float(i);
        if (fi > u_iterations) break;
        p = rotate2d(p, fi * u_twist + time * u_rotationSpeed);
        p.x += (u_complexity / fi) * sin(fi * p.y + time * u_morphSpeed) + noise(vec2(l * u_noiseScale + time * u_morphSpeed));
        p.y += (u_complexity / fi) * cos(fi * p.x + time * u_morphSpeed) + noise(vec2(l * u_noiseScale + time * u_morphSpeed));
      }

      l = pow(l, u_power) + l + l + l;
      float val = l - noise(p * 2.0 + vec2(time * u_morphSpeed)) + sin(l + time * u_morphSpeed) - 1.0;

      vec3 effectiveBg = u_greenscreen ? vec3(0.0, 1.0, 0.0) : u_bgColor;

      if (u_colorMode == 0 && !u_greenscreen && u_bgColor == vec3(0.0) && !u_invert) {
        gl_FragColor = vec4(vec3(val), 1.0);
        return;
      }

      if (u_colorMode == 0) {
        vec3 fg = vec3(clamp(val * u_contrast + u_brightness, 0.0, 1.5));
        if (u_invert && !u_greenscreen) {
          fg = vec3(1.0) - fg;
          effectiveBg = vec3(1.0) - effectiveBg;
        }
        float mask = clamp(val * 1.5, 0.0, 1.0);
        gl_FragColor = vec4(mix(effectiveBg, fg, mask), 1.0);
        return;
      }

      // Palette mode
      float angle = atan(p.y, p.x) / (2.0 * PI) + 0.5;
      float coord = (angle * 0.4 + length(p) * 0.12 + val * 0.25) * u_colorCycle;
      vec3 palColor = samplePalette(coord);

      float intensity = clamp(val * u_contrast + u_brightness, 0.0, 3.0);
      vec3 fg = palColor * intensity;
      if (intensity > 1.0) {
        fg = mix(fg, vec3(1.0), (intensity - 1.0) * 0.35);
      }

      if (u_invert && !u_greenscreen) {
        fg = vec3(1.0) - fg;
        effectiveBg = vec3(1.0) - effectiveBg;
      }

      float mask = clamp(val * 1.6, 0.0, 1.0);
      vec3 col = mix(effectiveBg, fg, mask);

      gl_FragColor = vec4(col, 1.0);
    }
  </script>

  <script type="module">
    import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

    // 19 preconfigured color schemes
    const SCHEMES = {
      'Original': {
        mode: 0,
        c1: '#ffffff', c2: '#cccccc', c3: '#888888', c4: '#444444', c5: '#111111',
        bg: '#000000'
      },
      'Monochromatic': {
        mode: 1,
        c1: '#caf0f8', c2: '#90e0ef', c3: '#00b4d8', c4: '#0077b6', c5: '#03045e',
        bg: '#020b14'
      },
      'Analogous': {
        mode: 1,
        c1: '#ffd166', c2: '#f77f00', c3: '#d62828', c4: '#ae2012', c5: '#9b2226',
        bg: '#140505'
      },
      'Complementary': {
        mode: 1,
        c1: '#06d6a0', c2: '#118ab2', c3: '#ffd166', c4: '#ef476f', c5: '#ff5400',
        bg: '#070d12'
      },
      'Split-complementary': {
        mode: 1,
        c1: '#7209b7', c2: '#f72585', c3: '#4cc9f0', c4: '#fee440', c5: '#3a0ca3',
        bg: '#0a0414'
      },
      'Triadic': {
        mode: 1,
        c1: '#00f5d4', c2: '#7b2cbf', c3: '#ff007f', c4: '#ffbe0b', c5: '#3a86ff',
        bg: '#060512'
      },
      'Tetradic': {
        mode: 1,
        c1: '#00bbf9', c2: '#00f5d4', c3: '#fee440', c4: '#f15bb5', c5: '#9b5de5',
        bg: '#090514'
      },
      'Double split-complementary': {
        mode: 1,
        c1: '#ff758f', c2: '#ff4d6d', c3: '#ffb703', c4: '#2a9d8f', c5: '#264653',
        bg: '#0b0f14'
      },
      'Achromatic (Black & White)': {
        mode: 1,
        c1: '#ffffff', c2: '#d0d0d0', c3: '#888888', c4: '#404040', c5: '#101010',
        bg: '#000000'
      },
      'Achromatic + Accent (B&W + Red)': {
        mode: 1,
        c1: '#ffffff', c2: '#bbbbbb', c3: '#ff1744', c4: '#9b0000', c5: '#222222',
        bg: '#000000'
      },
      'Neutral + Accent': {
        mode: 1,
        c1: '#f4f1de', c2: '#dfd7bf', c3: '#f39c12', c4: '#6c5b4b', c5: '#3d342c',
        bg: '#181512'
      },
      'Palette 1 (F6AA1C, BC3908, 941B0C, F6AA1C, 220901)': {
        mode: 1,
        c1: '#F6AA1C', c2: '#BC3908', c3: '#941B0C', c4: '#F6AA1C', c5: '#220901',
        bg: '#220901'
      },
      'Palette 2 (63D1CF, 5BC0BE, 4BAD9E, 4BAD9E, 0B132B, 000000)': {
        mode: 1,
        c1: '#63D1CF', c2: '#5BC0BE', c3: '#4BAD9E', c4: '#4BAD9E', c5: '#0B132B',
        bg: '#000000'
      },
      'Palette 3 (AA60C8, D69ADE, C9A3C6, CFB5C2, 0D001D, 120A12)': {
        mode: 1,
        c1: '#AA60C8', c2: '#D69ADE', c3: '#C9A3C6', c4: '#CFB5C2', c5: '#0D001D',
        bg: '#120A12'
      },
      'Palette 4 (FEF1BE, FFBA00, 008189, 00474D, 061210)': {
        mode: 1,
        c1: '#FEF1BE', c2: '#FFBA00', c3: '#008189', c4: '#00474D', c5: '#061210',
        bg: '#061210'
      },
      'Palette 5 (D4FFB0, 7FFF00, 00B894, 0A3322, 05140A)': {
        mode: 1,
        c1: '#D4FFB0', c2: '#7FFF00', c3: '#00B894', c4: '#0A3322', c5: '#05140A',
        bg: '#05140A'
      },
      'Palette 6 (FFE8CC, FF8C00, C7501A, 3D1050, 0E0618)': {
        mode: 1,
        c1: '#FFE8CC', c2: '#FF8C00', c3: '#C7501A', c4: '#3D1050', c5: '#0E0618',
        bg: '#0E0618'
      },
      'Palette 7 (E8E0FF, B38FFF, 6A3DE8, 1A1250, 090612)': {
        mode: 1,
        c1: '#E8E0FF', c2: '#B38FFF', c3: '#6A3DE8', c4: '#1A1250', c5: '#090612',
        bg: '#090612'
      },
      'Palette 8 (E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)': {
        mode: 1,
        c1: '#E0FBFF', c2: '#00F0FF', c3: '#D40078', c4: '#1E0A3D', c5: '#05020F',
        bg: '#05020F'
      }
    };

    function hexToRgb(hex) {
      if (!hex) return [0, 0, 0];
      hex = hex.replace('#', '');
      if (hex.length === 3) {
        hex = hex.split('').map(x => x + x).join('');
      }
      const num = parseInt(hex, 16);
      return [
        ((num >> 16) & 255) / 255,
        ((num >> 8) & 255) / 255,
        (num & 255) / 255
      ];
    }

    const params = {
      // Color & Theme
      scheme: 'Palette 8 (E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)',
      greenscreen: false,
      bgColor: '#05020F',
      color1: '#E0FBFF',
      color2: '#00F0FF',
      color3: '#D40078',
      color4: '#1E0A3D',
      color5: '#05020F',
      invert: false,
      colorCycle: 1.0,
      contrast: 1.1,
      brightness: 0.0,

      // Transform (Pan & Zoom)
      zoom: 1.0,
      panX: 0.0,
      panY: 0.0,
      resetView: () => {
        params.zoom = 1.0;
        params.panX = 0.0;
        params.panY = 0.0;
        updateGuiDisplays();
      },

      // Geometry & Motion
      speed: 1.0,
      iterations: 24,
      twist: 1.0,
      complexity: 0.5,
      rotationSpeed: 0.1,
      morphSpeed: 1.0,
      power: 5.0,
      noiseScale: 1.0,

      // Procedural interaction
      clickToRandomize: true,
      randomizeNow: () => randomizeScene()
    };

    let c, cw, ch, mx = 0.5, my = 0.5, gl, uniLocation = {};
    let accumulatedTime = 0.0, lastTimestamp = performance.now();
    let gui;

    function applyScheme(schemeName) {
      const s = SCHEMES[schemeName];
      if (!s) return;
      params.color1 = s.c1;
      params.color2 = s.c2;
      params.color3 = s.c3;
      params.color4 = s.c4;
      params.color5 = s.c5;
      params.bgColor = s.bg;
      updateGuiDisplays();
    }

    function randomizeScene() {
      const schemeKeys = Object.keys(SCHEMES);
      const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      params.scheme = randomScheme;
      applyScheme(randomScheme);

      // Re-roll geometric and motion parameters
      params.speed = parseFloat((0.4 + Math.random() * 1.8).toFixed(2));
      params.iterations = Math.floor(12 + Math.random() * 13); // 12 to 24
      params.twist = parseFloat((0.6 + Math.random() * 1.4).toFixed(2));
      params.complexity = parseFloat((0.3 + Math.random() * 0.7).toFixed(2));
      params.rotationSpeed = parseFloat((0.04 + Math.random() * 0.2).toFixed(3));
      params.morphSpeed = parseFloat((0.5 + Math.random() * 1.5).toFixed(2));
      params.power = parseFloat((2.5 + Math.random() * 5.0).toFixed(2));
      params.noiseScale = parseFloat((0.6 + Math.random() * 1.6).toFixed(2));
      params.colorCycle = parseFloat((0.5 + Math.random() * 2.0).toFixed(2));
      params.contrast = parseFloat((0.8 + Math.random() * 1.2).toFixed(2));

      updateGuiDisplays();
    }

    function updateGuiDisplays() {
      if (!gui) return;
      gui.controllersRecursive().forEach(ctrl => ctrl.updateDisplay());
    }

    function initGui() {
      gui = new GUI({ title: 'Plasma Controls' });

      // Theme & Color folder
      const fTheme = gui.addFolder('Theme & Color');
      fTheme.add(params, 'scheme', Object.keys(SCHEMES)).name('Color Scheme').onChange(val => {
        applyScheme(val);
      });
      fTheme.add(params, 'greenscreen').name('Greenscreen (#00ff00)').onChange(val => {
        document.body.style.background = val ? '#00ff00' : params.bgColor;
      });
      fTheme.addColor(params, 'bgColor').name('Background Color').onChange(val => {
        if (!params.greenscreen) document.body.style.background = val;
      });
      fTheme.addColor(params, 'color1').name('Color 1');
      fTheme.addColor(params, 'color2').name('Color 2');
      fTheme.addColor(params, 'color3').name('Color 3');
      fTheme.addColor(params, 'color4').name('Color 4');
      fTheme.addColor(params, 'color5').name('Color 5');
      fTheme.add(params, 'invert').name('Invert / Dark-Light');
      fTheme.add(params, 'colorCycle', 0.1, 5.0, 0.05).name('Color Frequency');
      fTheme.add(params, 'contrast', 0.2, 3.0, 0.05).name('Contrast');
      fTheme.add(params, 'brightness', -1.0, 1.0, 0.05).name('Brightness');

      // Transform folder
      const fTransform = gui.addFolder('Pan & Zoom');
      fTransform.add(params, 'zoom', 0.1, 15.0, 0.01).name('Zoom (Wheel)');
      fTransform.add(params, 'panX', -4.0, 4.0, 0.01).name('Pan X (Drag)');
      fTransform.add(params, 'panY', -4.0, 4.0, 0.01).name('Pan Y (Drag)');
      fTransform.add(params, 'resetView').name('Reset View');

      // Geometry & Dynamics folder
      const fMotion = gui.addFolder('Geometry & Dynamics');
      fMotion.add(params, 'speed', 0.0, 3.0, 0.05).name('Time Speed');
      fMotion.add(params, 'iterations', 2, 24, 1).name('Iterations');
      fMotion.add(params, 'twist', 0.1, 3.0, 0.05).name('Twist Factor');
      fMotion.add(params, 'complexity', 0.1, 2.0, 0.05).name('Complexity');
      fMotion.add(params, 'rotationSpeed', 0.0, 0.5, 0.01).name('Rotation Speed');
      fMotion.add(params, 'morphSpeed', 0.1, 3.0, 0.05).name('Morph Speed');
      fMotion.add(params, 'power', 1.0, 10.0, 0.1).name('Decay Power');
      fMotion.add(params, 'noiseScale', 0.2, 3.0, 0.05).name('Noise Scale');

      // Procedural Generation folder
      const fRandom = gui.addFolder('Procedural Generation');
      fRandom.add(params, 'clickToRandomize').name('Click Scene to Randomize');
      fRandom.add(params, 'randomizeNow').name('Randomize Now');

      // Keyboard toggle for UI with "H" key
      let guiVisible = true;
      window.addEventListener('keydown', (e) => {
        if (e.key === 'h' || e.key === 'H') {
          if (['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement?.tagName)) return;
          guiVisible = !guiVisible;
          if (guiVisible) {
            gui.show();
          } else {
            gui.hide();
          }
        }
      });
    }

    function createShader(id) {
      const scriptElement = document.getElementById(id);
      if (!scriptElement) {
        console.error('Missing script element: ' + id);
        return null;
      }
      let shader;
      switch (scriptElement.type) {
        case 'x-shader/x-vertex':
          shader = gl.createShader(gl.VERTEX_SHADER);
          break;
        case 'x-shader/x-fragment':
          shader = gl.createShader(gl.FRAGMENT_SHADER);
          break;
        default:
          return null;
      }
      gl.shaderSource(shader, scriptElement.text.trim());
      gl.compileShader(shader);
      if (gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        return shader;
      } else {
        console.error('Shader compile error:', gl.getShaderInfoLog(shader));
        return null;
      }
    }

    function createProgram(vs, fs) {
      if (!vs || !fs) return null;
      const program = gl.createProgram();
      gl.attachShader(program, vs);
      gl.attachShader(program, fs);
      gl.linkProgram(program);
      if (gl.getProgramParameter(program, gl.LINK_STATUS)) {
        gl.useProgram(program);
        return program;
      } else {
        console.error('Program link error:', gl.getProgramInfoLog(program));
        return null;
      }
    }

    function createVbo(data) {
      const vbo = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(data), gl.STATIC_DRAW);
      gl.bindBuffer(gl.ARRAY_BUFFER, null);
      return vbo;
    }

    function createIbo(data) {
      const ibo = gl.createBuffer();
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo);
      gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Int16Array(data), gl.STATIC_DRAW);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, null);
      return ibo;
    }

    function setupBuffers(prg) {
      const position = [
        -1.0,  1.0,  0.0,
         1.0,  1.0,  0.0,
        -1.0, -1.0,  0.0,
         1.0, -1.0,  0.0
      ];
      const index = [
        0, 2, 1,
        1, 2, 3
      ];

      const vPosition = createVbo(position);
      const vIndex = createIbo(index);
      const vAttLocation = gl.getAttribLocation(prg, 'position');
      gl.bindBuffer(gl.ARRAY_BUFFER, vPosition);
      gl.enableVertexAttribArray(vAttLocation);
      gl.vertexAttribPointer(vAttLocation, 3, gl.FLOAT, false, 0, 0);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, vIndex);
    }

    function initWebGl() {
      c = document.getElementById('canvas');
      cw = c.width = window.innerWidth;
      ch = c.height = window.innerHeight;

      gl = c.getContext('webgl', { alpha: false, antialias: true }) || c.getContext('experimental-webgl');
      if (!gl) {
        console.error('WebGL not supported');
        return false;
      }
      gl.viewport(0, 0, cw, ch);

      const vs = createShader('vs');
      const fs = createShader('fs');
      const prg = createProgram(vs, fs);
      if (!prg) return false;

      const uniformNames = [
        'time', 'mouse', 'resolution', 'u_offset', 'u_zoom',
        'u_colorMode', 'u_c1', 'u_c2', 'u_c3', 'u_c4', 'u_c5',
        'u_bgColor', 'u_greenscreen', 'u_invert', 'u_colorCycle',
        'u_contrast', 'u_brightness', 'u_iterations', 'u_twist',
        'u_complexity', 'u_rotationSpeed', 'u_morphSpeed', 'u_power',
        'u_noiseScale'
      ];
      uniformNames.forEach(name => {
        uniLocation[name] = gl.getUniformLocation(prg, name);
      });

      setupBuffers(prg);
      lastTimestamp = performance.now();
      return true;
    }

    function render() {
      const now = performance.now();
      const delta = (now - lastTimestamp) * 0.001;
      lastTimestamp = now;
      accumulatedTime += delta * params.speed;

      if (params.greenscreen) {
        gl.clearColor(0.0, 1.0, 0.0, 1.0);
      } else {
        const bg = hexToRgb(params.bgColor);
        gl.clearColor(bg[0], bg[1], bg[2], 1.0);
      }
      gl.clear(gl.COLOR_BUFFER_BIT);

      if (uniLocation['time']) gl.uniform1f(uniLocation['time'], accumulatedTime);
      if (uniLocation['mouse']) gl.uniform2fv(uniLocation['mouse'], [mx, my]);
      if (uniLocation['resolution']) gl.uniform2fv(uniLocation['resolution'], [cw, ch]);
      if (uniLocation['u_offset']) gl.uniform2fv(uniLocation['u_offset'], [params.panX, params.panY]);
      if (uniLocation['u_zoom']) gl.uniform1f(uniLocation['u_zoom'], params.zoom);

      const currentScheme = SCHEMES[params.scheme];
      if (uniLocation['u_colorMode']) gl.uniform1i(uniLocation['u_colorMode'], currentScheme ? currentScheme.mode : 1);

      if (uniLocation['u_c1']) gl.uniform3fv(uniLocation['u_c1'], hexToRgb(params.color1));
      if (uniLocation['u_c2']) gl.uniform3fv(uniLocation['u_c2'], hexToRgb(params.color2));
      if (uniLocation['u_c3']) gl.uniform3fv(uniLocation['u_c3'], hexToRgb(params.color3));
      if (uniLocation['u_c4']) gl.uniform3fv(uniLocation['u_c4'], hexToRgb(params.color4));
      if (uniLocation['u_c5']) gl.uniform3fv(uniLocation['u_c5'], hexToRgb(params.color5));
      if (uniLocation['u_bgColor']) gl.uniform3fv(uniLocation['u_bgColor'], hexToRgb(params.bgColor));

      if (uniLocation['u_greenscreen']) gl.uniform1i(uniLocation['u_greenscreen'], params.greenscreen ? 1 : 0);
      if (uniLocation['u_invert']) gl.uniform1i(uniLocation['u_invert'], params.invert ? 1 : 0);
      if (uniLocation['u_colorCycle']) gl.uniform1f(uniLocation['u_colorCycle'], params.colorCycle);
      if (uniLocation['u_contrast']) gl.uniform1f(uniLocation['u_contrast'], params.contrast);
      if (uniLocation['u_brightness']) gl.uniform1f(uniLocation['u_brightness'], params.brightness);

      if (uniLocation['u_iterations']) gl.uniform1f(uniLocation['u_iterations'], params.iterations);
      if (uniLocation['u_twist']) gl.uniform1f(uniLocation['u_twist'], params.twist);
      if (uniLocation['u_complexity']) gl.uniform1f(uniLocation['u_complexity'], params.complexity);
      if (uniLocation['u_rotationSpeed']) gl.uniform1f(uniLocation['u_rotationSpeed'], params.rotationSpeed);
      if (uniLocation['u_morphSpeed']) gl.uniform1f(uniLocation['u_morphSpeed'], params.morphSpeed);
      if (uniLocation['u_power']) gl.uniform1f(uniLocation['u_power'], params.power);
      if (uniLocation['u_noiseScale']) gl.uniform1f(uniLocation['u_noiseScale'], params.noiseScale);

      gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0);
      gl.flush();

      requestAnimationFrame(render);
    }

    function setupInteractions() {
      let isPointerDown = false;
      let startX = 0, startY = 0;
      let startPanX = 0, startPanY = 0;
      let hasDragged = false;

      c.addEventListener('pointerdown', (e) => {
        isPointerDown = true;
        hasDragged = false;
        startX = e.clientX;
        startY = e.clientY;
        startPanX = params.panX;
        startPanY = params.panY;
        c.setPointerCapture(e.pointerId);
      });

      c.addEventListener('pointermove', (e) => {
        mx = e.clientX / cw;
        my = e.clientY / ch;

        if (isPointerDown) {
          const dx = e.clientX - startX;
          const dy = e.clientY - startY;
          if (Math.hypot(dx, dy) > 4) {
            hasDragged = true;
          }
          const minDim = Math.min(cw, ch);
          params.panX = startPanX + (dx * 2.0) / minDim;
          params.panY = startPanY - (dy * 2.0) / minDim;
          updateGuiDisplays();
        }
      });

      c.addEventListener('pointerup', (e) => {
        if (isPointerDown) {
          try { c.releasePointerCapture(e.pointerId); } catch (_) {}
          isPointerDown = false;
          // If clicked without dragging, and clickToRandomize is enabled:
          if (!hasDragged && params.clickToRandomize) {
            randomizeScene();
          }
        }
      });

      c.addEventListener('pointercancel', () => {
        isPointerDown = false;
      });

      // Zoom with wheel centered around mouse cursor
      c.addEventListener('wheel', (e) => {
        e.preventDefault();
        const minDim = Math.min(cw, ch);
        const mScreenX = (e.clientX * 2.0 - cw) / minDim;
        const mScreenY = -(e.clientY * 2.0 - ch) / minDim;

        const oldZoom = params.zoom;
        const zoomFactor = e.deltaY < 0 ? 1.12 : 0.893;
        const newZoom = Math.min(Math.max(oldZoom * zoomFactor, 0.1), 20.0);

        const worldX = (mScreenX - params.panX) / oldZoom;
        const worldY = (mScreenY - params.panY) / oldZoom;

        params.panX = mScreenX - worldX * newZoom;
        params.panY = mScreenY - worldY * newZoom;
        params.zoom = newZoom;

        updateGuiDisplays();
      }, { passive: false });

      window.addEventListener('resize', () => {
        cw = c.width = window.innerWidth;
        ch = c.height = window.innerHeight;
        gl.viewport(0, 0, cw, ch);
      });
    }

    function start() {
      const ok = initWebGl();
      if (!ok) return;
      initGui();
      setupInteractions();
      render();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', start);
    } else {
      start();
    }
  </script>
</body>
</html>
