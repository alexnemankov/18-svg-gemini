    /* ============================================================
       CSS Reset & Edge-to-Edge Fullscreen UX
       ============================================================ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000000;
      color: #f0f0f0;

      user-select: none;
      -webkit-user-select: none;
      touch-action: none;

    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    canvas {
      display: block;
      width: 100vw !important;
      height: 100vh !important;
      outline: none;
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;

      display: none;

  <!-- Offline Shim for Chroma.js if CDN is unavailable -->
  <script>
    if (typeof window.chroma === 'undefined') {
      window.chroma = (function() {
        function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
        function parseHex(h) {
          h = String(h).replace('#', '');
          if (h.length === 3) h = h.split('').map(c => c + c).join('');
          let num = parseInt(h, 16) || 0;
          return [(num >> 16) & 255, (num >> 8) & 255, num & 255];
        }
        function rgbToHsl(r, g, b) {
          r /= 255; g /= 255; b /= 255;
          let max = Math.max(r, g, b), min = Math.min(r, g, b);
          let h = 0, s = 0, l = (max + min) / 2;
          if (max !== min) {
            let d = max - min;
            s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
            switch (max) {
              case r: h = (g - b) / d + (g < b ? 6 : 0); break;
              case g: h = (b - r) / d + 2; break;
              case b: h = (r - g) / d + 4; break;
            }
            h /= 6;
          }
          return [h * 360, s, l];
        }
        function hslToRgb(h, s, l) {
          h = (h % 360 + 360) % 360;
          let c = (1 - Math.abs(2 * l - 1)) * s;
          let x = c * (1 - Math.abs(((h / 60) % 2) - 1));
          let m = l - c / 2;
          let r = 0, g = 0, b = 0;
          if (h < 60) { r = c; g = x; }
          else if (h < 120) { r = x; g = c; }
          else if (h < 180) { g = c; b = x; }
          else if (h < 240) { g = x; b = c; }
          else if (h < 300) { r = x; b = c; }
          else { r = c; b = x; }
          return [Math.round((r + m) * 255), Math.round((g + m) * 255), Math.round((b + m) * 255)];
        }
        class Color {
          constructor(r, g, b, a = 1) {
            this.r = clamp(r, 0, 255);
            this.g = clamp(g, 0, 255);
            this.b = clamp(b, 0, 255);
            this.a = clamp(a, 0, 1);
          }
          hex() {
            let toHex = n => Math.round(n).toString(16).padStart(2, '0');
            return '#' + toHex(this.r) + toHex(this.g) + toHex(this.b);
          }
          css() {
            return 'rgba(' + Math.round(this.r) + ',' + Math.round(this.g) + ',' + Math.round(this.b) + ',' + this.a + ')';
          }
        }
        return function chroma(a, b, c, d) {
          if (typeof a === 'string') {
            let [r, g, bl] = parseHex(a);
            return new Color(r, g, bl, 1);
          }
          return new Color(a, b, c, d !== undefined ? d : 1);
        };
      })();
    }
  </script>

  <!-- p5.Ease standalone mathematical module with maclaurinCosine series -->
  <script>
    window.p5 = window.p5 || {};
    window.p5.Ease = function() {
      this.version = 0.05;
    };

    /**
     * Maclaurin series expansion of cosine curve over [0, 1]
     * Ported from Golan Levin / R. Luke DuBois (p5.func)
     */
    window.p5.Ease.prototype.maclaurinCosine = function(_x) {
      var nTerms = 6;
      _x = Math.max(0, Math.min(1, _x)) * Math.PI;
      var xp = 1.0;
      var x2 = _x * _x;
      var sig = 1.0;
      var fact = 1.0;
      var _y = xp;

      for (var i = 0; i < nTerms; i++) {
        xp *= x2;
        sig = 0 - sig;
        fact *= (i * 2 + 1);
        fact *= (i * 2 + 2);
        _y += sig * (xp / fact);
      }

      _y = (1.0 - _y) / 2.0;
      return Math.max(0, Math.min(1, _y));
    };

    window.p5.Ease.prototype.cubicInOut = function(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    };
  </script>

    // ============================================================
    // p5.js Core Lifecycle
    // ============================================================
    function preload() {
      // Decode embedded Nordic Fair Isle sweater synchronously in preload
      img2 = loadImage(IMG2_DATA_URI);
    }

    function setup() {
      const canvas = createCanvas(windowWidth, windowHeight);
      canvas.parent('canvas-container');

      ease = new p5.Ease();
      imageMode(CENTER);

      finished = createGraphics(width, height);
      finished.imageMode(CENTER);

      setupInteractions();
      buildGUI();

      // Original animation entrance: cx starts at width, slides to width/2
      cx = width;
      tcx = width / 2;
      simFrame = 0;

      // Start immediately from img2 (Nordic Fair Isle sweater)
      rebuildPatternAndStitches(false);
    }

    function draw() {
      background(0);

      // Smooth lerp for entrance / exit sliding (matching original cx = lerp(cx, tcx, 0.1))
      cx = lerp(cx, tcx, 0.1);

      // Camera smooth spring interpolation
      panX += (targetPanX - panX) * 0.16;
      panY += (targetPanY - panY) * 0.16;
      zoomLevel += (targetZoomLevel - zoomLevel) * 0.16;

      // Time step integration
      let stepSpeed = settings.animationSpeed * (settings.isPlaying ? 1.0 : 0.0);

      // Batch launch stitches according to speed & frame pacing (original: frameCount * 4 > s.id)
      if (stepSpeed > 0 && !isTransitioning) {
        simFrame += stepSpeed;
        let launchTarget = Math.floor(simFrame * settings.stitchesPerFrame);
        while (nextStitchIndex < stitches.length && nextStitchIndex < launchTarget) {
          let s = stitches[nextStitchIndex++];
          s.alive = true;
          activeStitches.push(s);
        }
      }

      // Camera World Transformation
      push();
      // Exact Bees & Bombs translation + user interactive pan & zoom
      let needleYTracking = (zoomLevel - 1) * Math.min(simFrame / 6, height);
      translate(cx + panX, (zoomLevel * height / 2 - needleYTracking) + panY);
      scale(zoomLevel);

      // Draw the accumulated embroidered cloth tapestry
      image(finished, 0, 0);

      // Update and render active in-flight stitches
      for (let i = activeStitches.length - 1; i >= 0; i--) {
        let s = activeStitches[i];
        if (stepSpeed > 0) {
          s.move(stepSpeed);
        }
        if (s.alive) {
          s.show();
        } else {
          activeStitches.splice(i, 1);
        }
      }
      pop();
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
      if (finished.width !== width || finished.height !== height) {
        let newFinished = createGraphics(width, height);
        newFinished.imageMode(CENTER);
        newFinished.background(FABRIC_TONES[settings.fabricTone] || 0);
        newFinished.image(finished, width / 2, height / 2);
        finished = newFinished;
        finished.stroke(255, 30);
        finished.strokeWeight(2);
      }
      tcx = width / 2;
    }

    // ============================================================
    // Stitch Class (Authentic Bees & Bombs Motion & Stamping)
    // ============================================================
    class Stitch {
      constructor(pos, ang, len, f, row, col, id) {
        let startx = -pos.x / 2;
        this.pos = createVector(startx, height / 2);
        this.tpos = pos;
        this.ang = 0;
        this.tang = ang;
        this.len = len;
        this.f = f;
        this.row = row;
        this.col = col;
        this.counter = 0;
        this.alive = false;
        this.t = 0;
        this.q = 0;
        this.id = id;
      }

      show() {
        // Stretch thread along parabolic flight arc (original: 1 + 3 * sin(dang))
        let dang = constrain(map(this.pos.y, height / 2, this.tpos.y, 0, PI), 0, PI);
        let mult = 1 + settings.flightArc * Math.sin(dang);

        push();
        translate(this.pos.x, this.pos.y);
        rotate(this.ang);
        stroke(255, 30);
        strokeWeight(1);
        fill(this.f);
        ellipse(0, 0, this.len / settings.stitchWidthRatio, mult * this.len);
        pop();
      }

      stamp() {
        finished.push();
        finished.translate(width / 2, height / 2);
        finished.translate(this.pos);

        // Organic thread sheen & fiber variation (original: random(1, 2) & scale(random(0.8, 1.1), 1))
        let sheenAlpha = Math.round(settings.threadSheen * 75);
        finished.stroke(255, sheenAlpha);
        finished.strokeWeight(random(1.0, 2.0));

        let texSpread = settings.threadTexture;
        finished.scale(random(1.0 - texSpread * 0.25, 1.0 + texSpread * 0.25), 1);
        finished.rotate(this.ang);
        finished.fill(this.f);
        finished.ellipse(0, 0, this.len / settings.stitchWidthRatio, this.len);
        finished.pop();
      }

      move(speedMult = 1) {
        let q = ease['maclaurinCosine'](this.t);
        this.t += 0.01 * speedMult;
        this.t = constrain(this.t, 0.0, 1.0);
        this.counter += 1 * speedMult;

        this.pos.lerp(this.tpos, q);

        if (this.counter > 25) {
          this.ang = lerp(this.ang, this.tang, 0.2 * speedMult);
        } else {
          this.ang = HALF_PI + Math.atan2(this.tpos.y - this.pos.y, this.tpos.x - this.pos.x);
        }

        if (this.counter > 35 || this.t >= 0.999) {
          this.pos.set(this.tpos);
          this.ang = this.tang;
          this.stamp();
          this.alive = false;
        }
      }
    }

    // ============================================================
    // Stitch Grid Assembly & Fabric Initialization
    // ============================================================
    function makeStitches() {
      cx = width;
      tcx = width / 2;
      finished.background(FABRIC_TONES[settings.fabricTone] || 0);

      stroke(255, 30);
      strokeWeight(2);
      finished.stroke(255, 30);
      finished.strokeWeight(2);

      stitches = [];
      activeStitches = [];
      nextStitchIndex = 0;

      if (currentPatternImg && typeof currentPatternImg.loadPixels === 'function') {
        currentPatternImg.loadPixels();
      }

      const rows = settings.gridResolution;
      const cols = settings.gridResolution;

      for (let row = 0; row < rows; row++) {
        for (let col = 0; col < cols; col++) {
          // Exact Dave Whyte mapping
          let x = map(col, 0, cols - 1, -height / 2.05, height / 2.05);
          let y = map(row, 0, rows - 1, -height / 2.05, height / 2.10);
          let pos = createVector(x, y);

          // Alternating cross-stitch angle: -PI/8 + (col % 2) * PI/4
          let ang = -PI / 8 + (col % 2) * PI / 4;
          let len = (settings.stitchLengthMult * height) / rows;

          // Sample color from procedural pattern or img2
          let f = samplePatternColor(col, row, cols, rows);
          f.setAlpha(210);

          // Serpentine order: row % 2 ? cols - col : col
          let scol = col;
          if (row % 2) scol = cols - col;
          let stitchId = row * cols + scol;

          let stitch = new Stitch(pos, ang, len, f, row, scol, stitchId);
          stitches.push(stitch);
        }
      }

      // Sort stitches in serpentine sequential order for realistic loom progression
      stitches.sort((a, b) => a.id - b.id);
    }

    // ============================================================
    // Procedural Tapestry & Pattern Synthesizer
    // ============================================================
    function rebuildPatternAndStitches(slideOut = true) {
      if (settings.patternType === 'Custom Image' && customUploadedImg) {
        currentPatternImg = customUploadedImg;
      } else if (settings.patternType === 'Nordic Fair Isle (Reindeer & Trees)' && img2) {
        if (settings.colorScheme === 'Original') {
          currentPatternImg = img2;
        } else {
          currentPatternImg = remapImageToScheme(img2, settings.colorScheme);
        }
      } else {
        currentPatternImg = generateProceduralPattern(
          settings.patternType,
          settings.colorScheme,
          settings.gridResolution,
          settings.gridResolution
        );
      }

      if (slideOut) {
        // Original slide-out transition
        tcx = -width;
        isTransitioning = true;
        setTimeout(() => {
          makeStitches();
          cx = width;
          tcx = width / 2;
          simFrame = -15;
          isTransitioning = false;
        }, 800);
      } else {
        makeStitches();
        cx = width;
        tcx = width / 2;
        simFrame = 0;
        isTransitioning = false;
      }
    }

    function samplePatternColor(col, row, cols, rows) {
      if (!currentPatternImg) return color(240);
      let w = currentPatternImg.width;
      let h = currentPatternImg.height;
      let px = Math.floor(map(col, 0, cols, 0, w));
      let py = Math.floor(map(row, 0, rows, 0, h));
      px = constrain(px, 0, w - 1);
      py = constrain(py, 0, h - 1);
      if (currentPatternImg.pixels && currentPatternImg.pixels.length > 0) {
        let idx = (py * w + px) * 4;
        return color(
          currentPatternImg.pixels[idx],
          currentPatternImg.pixels[idx + 1],
          currentPatternImg.pixels[idx + 2]
        );
      }
      return color(currentPatternImg.get(px, py));
    }

    // Remap img2 luminance and accents to any of the 19 color schemes
    function remapImageToScheme(srcImg, schemeName) {
      let palette = COLOR_SCHEMES[schemeName] || COLOR_SCHEMES['Original'];
      let pg = createGraphics(srcImg.width, srcImg.height);
      pg.pixelDensity(1);
      srcImg.loadPixels();
      pg.loadPixels();

      let nColors = palette.length;
      let parsed = palette.map(hex => {
        let c = chroma(hex);
        return [c.r, c.g, c.b];
      });

      for (let i = 0; i < srcImg.pixels.length; i += 4) {
        let r = srcImg.pixels[i];
        let g = srcImg.pixels[i + 1];
        let b = srcImg.pixels[i + 2];

        let isRed = (r > 150 && g < 75 && b < 75);
        let isWhite = (r > 170 && g > 170 && b > 170);
        let isSoftBlue = (b > 110 && g > 100 && r < 135 && Math.abs(g - b) < 45);

        let rgb;
        if (isRed) {
          let accentIdx = Math.floor(nColors * 0.6) % nColors;
          rgb = parsed[accentIdx];
        } else if (isWhite) {
          rgb = parsed[nColors - 1];
        } else if (isSoftBlue) {
          let midIdx = Math.floor(nColors * 0.45) % nColors;
          rgb = parsed[midIdx];
        } else {
          // Field background tone
          let darkIdx = Math.min(1, nColors - 1);
          rgb = parsed[darkIdx];
        }

        pg.pixels[i] = rgb[0];
        pg.pixels[i + 1] = rgb[1];
        pg.pixels[i + 2] = rgb[2];
        pg.pixels[i + 3] = 255;
      }
      pg.updatePixels();
      return pg.get();
    }

    // Rich, vibrant procedural tapestry pattern generator (guaranteed zero black-on-black)
    function generateProceduralPattern(patternName, schemeName, cols, rows) {
      let palette = COLOR_SCHEMES[schemeName] || COLOR_SCHEMES['Original'];
      let pg = createGraphics(cols, rows);
      pg.pixelDensity(1);
      pg.loadPixels();

      let nColors = palette.length;
      let parsedColors = palette.map(hex => {
        let c = chroma(hex);
        return [c.r, c.g, c.b];
      });

      for (let y = 0; y < rows; y++) {
        let v = (y - rows / 2) / (rows / 2); // -1.0 to 1.0
        for (let x = 0; x < cols; x++) {
          let u = (x - cols / 2) / (cols / 2); // -1.0 to 1.0
          let r = Math.sqrt(u * u + v * v);
          let theta = Math.atan2(v, u);

          let colorIdx = 1; // Default to rich field color (not black)

          switch (patternName) {
            case 'Scandinavian Selburose (Folk Elk)': {
              let isSelbuCenter = (r < 0.38);
              let starRay = Math.abs(Math.cos(4 * theta)) * r;
              let isSelbuStar = isSelbuCenter && (starRay > 0.10 || r < 0.12);

              let isHeartBand = (v > -0.15 && v < 0.05);
              let heartU = (u * 4 + 4) % 1.0 - 0.5;
              let isHeart = isHeartBand && (Math.abs(heartU) < 0.28 && Math.abs(v + 0.05) < 0.07);

              let isLowerField = v > 0.05 && v < 0.85;
              let elkU = (u * 3 + 3) % 1.0 - 0.5;
              let isElkBody = isLowerField && (Math.abs(elkU) < 0.22 && v > 0.35 && v < 0.65);
              let isElkLegs = isLowerField && (Math.abs(elkU) < 0.18 && v >= 0.65 && v < 0.80);
              let isElkHead = isLowerField && (Math.abs(elkU + 0.15) < 0.09 && v > 0.20 && v <= 0.35);
              let isElk = isElkBody || isElkLegs || isElkHead;

              let isBorder = Math.abs(v) > 0.88;
              let borderCheck = (Math.floor(x / 4) + Math.floor(y / 4)) % 2;

              if (isSelbuStar || isElk || (isHeartBand && !isHeart)) {
                colorIdx = nColors - 1; // Bright white
              } else if (isHeart || (isBorder && borderCheck === 0)) {
                colorIdx = Math.floor(nColors * 0.65) % nColors; // Vivid red
              } else if (isSelbuCenter || isBorder) {
                colorIdx = Math.floor(nColors * 0.4) % nColors; // Sky blue
              } else {
                colorIdx = 1; // Nordic deep navy/teal field
              }
              break;
            }

            case 'Persian Imperial Tapestry': {
              let rosette = Math.cos(16 * theta) * 0.25 + Math.cos(8 * theta) * 0.35 + r * 2.6;
              let diamond = (Math.abs(u) + Math.abs(v));
              let corner = Math.sqrt(Math.pow(Math.abs(u) - 0.85, 2) + Math.pow(Math.abs(v) - 0.85, 2));

              if (r < 0.12) {
                colorIdx = nColors - 1; // Ivory center
              } else if (r < 0.32) {
                colorIdx = Math.floor(nColors * 0.8) % nColors; // Shimmering gold
              } else if (r < 0.50) {
                colorIdx = Math.floor(nColors * 0.6) % nColors; // Ruby red
              } else if (corner < 0.35) {
                colorIdx = Math.floor(nColors * 0.7) % nColors; // Emerald corner
              } else if (diamond > 0.95 && diamond < 1.15) {
                colorIdx = Math.floor(nColors * 0.85) % nColors; // Golden diamond frame
              } else if (diamond >= 1.15 && diamond < 1.35) {
                colorIdx = Math.floor(nColors * 0.5) % nColors; // Crimson outer band
              } else {
                colorIdx = 2; // Deep lapis field
              }
              break;
            }

            case 'Celtic Sunburst & Knot': {
              let path1 = Math.sin(u * 9.0) * Math.cos(v * 9.0);
              let path2 = Math.cos(u * 9.0 + 1.57) * Math.sin(v * 9.0 + 1.57);
              let ribbon = Math.max(Math.abs(path1), Math.abs(path2));
              let sun = Math.cos(24 * theta);

              if (r < 0.18) {
                colorIdx = nColors - 1; // Radiant solar core
              } else if (r < 0.45 && sun > 0.3) {
                colorIdx = Math.floor(nColors * 0.85) % nColors; // Golden sunburst rays
              } else if (ribbon > 0.35) {
                colorIdx = Math.floor(nColors * 0.7) % nColors; // Emerald interwoven ribbon
              } else if (ribbon > 0.20) {
                colorIdx = nColors - 1; // Ivory ribbon highlight
              } else {
                colorIdx = 1; // Deep midnight sapphire
              }
              break;
            }

            case 'Aztec & Navajo Kilim': {
              let stepDiamond = Math.floor((Math.abs(u) + Math.abs(v)) * 8.0);
              let chevron = Math.floor(Math.abs(v * 7.0 - Math.abs(Math.sin(u * 10.0) * 1.5)));
              let band = (stepDiamond + chevron) % 4;

              if (band === 0) {
                colorIdx = nColors - 1; // Ivory white
              } else if (band === 1) {
                colorIdx = Math.floor(nColors * 0.8) % nColors; // Ochre gold
              } else if (band === 2) {
                colorIdx = Math.floor(nColors * 0.6) % nColors; // Coral red
              } else {
                colorIdx = Math.floor(nColors * 0.35) % nColors; // Turquoise band
              }
              break;
            }

            case 'Japanese Waves & Rising Sun': {
              let sunR = Math.sqrt(u * u + Math.pow(v + 0.35, 2));
              let waveX = (u + 1.0) * 4.0;
              let waveY = (v + 1.0) * 5.0;
              let rowIdx = Math.floor(waveY);
              let colOffset = (rowIdx % 2 === 1) ? 0.5 : 0.0;
              let localX = (waveX + colOffset) % 1.0 - 0.5;
              let localY = waveY % 1.0;
              let waveR = Math.sqrt(localX * localX + localY * localY);

              if (sunR < 0.32) {
                colorIdx = Math.floor(nColors * 0.65) % nColors; // Vermilion rising sun
              } else if (waveR < 0.16 || (waveR > 0.32 && waveR < 0.44)) {
                colorIdx = nColors - 1; // White wave crests
              } else if (waveR < 0.32 || (waveR >= 0.44 && waveR < 0.6)) {
                colorIdx = Math.floor(nColors * 0.45) % nColors; // Light cyan ocean foam
              } else {
                colorIdx = 1; // Deep indigo sea
              }
              break;
            }

            case 'Vintage Botanical Rose': {
              let isPetals = (r < 0.32);
              let petalWave = Math.sin(theta * 5.0 + r * 14.0);
              let isLeaf = (r >= 0.32 && r < 0.70) && (Math.sin(theta * 4.0 + 0.7) > 0.35);
              let border = Math.max(Math.abs(u), Math.abs(v));
              let isVineBorder = border > 0.84 && border < 0.94;

              if (r < 0.08) {
                colorIdx = Math.floor(nColors * 0.85) % nColors; // Golden stamen
              } else if (isPetals) {
                colorIdx = petalWave > 0.2 ? (nColors - 1) : Math.floor(nColors * 0.6) % nColors; // Rose petals
              } else if (isLeaf || isVineBorder) {
                colorIdx = Math.floor(nColors * 0.4) % nColors; // Foliage emerald
              } else {
                colorIdx = 2; // Vintage slate field
              }
              break;
            }

            case 'Retro Op-Art Prism':
            default: {
              let wave1 = Math.sin(10.0 * Math.sqrt(u * u + v * v));
              let wave2 = Math.cos(8.0 * (u + v)) + Math.sin(8.0 * (u - v));
              let val = Math.floor(Math.abs(wave1 + wave2) * 2.2) % nColors;
              colorIdx = Math.max(1, val);
              break;
            }
          }

          let rgb = parsedColors[colorIdx % nColors];
          let pIdx = (y * cols + x) * 4;
          pg.pixels[pIdx] = rgb[0];
          pg.pixels[pIdx + 1] = rgb[1];
          pg.pixels[pIdx + 2] = rgb[2];
          pg.pixels[pIdx + 3] = 255;
        }
      }

      pg.updatePixels();
      return pg.get();
    }

    // ============================================================
    // Instant Completion & Slide Rebuild
    // ============================================================
    function instantFinish() {
      // Fast forward remaining stitches onto the cloth buffer
      for (let s of stitches) {
        if (!s.alive && nextStitchIndex <= s.id) {
          s.pos.set(s.tpos);
          s.ang = s.tang;
          s.stamp();
          s.alive = false;
        }
      }
      for (let s of activeStitches) {
        s.pos.set(s.tpos);
        s.ang = s.tang;
        s.stamp();
        s.alive = false;
      }
      activeStitches = [];
      nextStitchIndex = stitches.length;
    }

    function triggerRebuild(slideOut = true) {
      rebuildPatternAndStitches(slideOut);
    }

    // ============================================================
    // Procedural Randomization (Scene Variation on Canvas Click)
    // ============================================================
    function randomizeAll(animateTransition = true) {
      // 1. Pick a random color scheme from the 19 schemes
      let schemes = Object.keys(COLOR_SCHEMES);
      settings.colorScheme = schemes[Math.floor(Math.random() * schemes.length)];

      // 2. Pick a random fabric tone
      let fabrics = Object.keys(FABRIC_TONES);
      settings.fabricTone = fabrics[Math.floor(Math.random() * fabrics.length)];

      // 3. Pick a random pattern motif
      settings.patternType = PATTERN_TYPES[Math.floor(Math.random() * PATTERN_TYPES.length)];

      // 4. Randomize geometric & motion parameters
      settings.stitchLengthMult = Number((1.2 + Math.random() * 0.9).toFixed(2));
      settings.stitchWidthRatio = Number((1.8 + Math.random() * 1.5).toFixed(2));
      settings.threadTexture = Number((0.15 + Math.random() * 0.5).toFixed(2));
      settings.threadSheen = Number((0.2 + Math.random() * 0.6).toFixed(2));
      settings.flightArc = Number((2.0 + Math.random() * 2.5).toFixed(2));
      settings.animationSpeed = Number((0.75 + Math.random() * 0.8).toFixed(2));

      // 5. Update lil-gui controls display
      if (gui) {
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      }

      // 6. Rebuild pattern and launch stitches with sliding theatrical transition
      triggerRebuild(animateTransition);
    }

    function resetCamera() {
      targetPanX = 0;
      targetPanY = 0;
      targetZoomLevel = 1.0;
      settings.zoom = 1.0;
      if (gui) {
        let c = gui.controllersRecursive().find(c => c.property === 'zoom');
        if (c) c.updateDisplay();
      }
    }

    // ============================================================
    // Interactive Gestures (Wheel Zoom & Drag Pan)
    // Zero on-screen clutter, seamless mouse & touch manipulation
    // ============================================================
    function setupInteractions() {
      // Wheel Zoom Centered on Mouse Cursor
      window.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomFactor = e.deltaY < 0 ? 1.10 : 0.90;
        const mouseX = e.clientX;
        const mouseY = e.clientY;

        const newZoom = Math.min(Math.max(targetZoomLevel * zoomFactor, 0.25), 8.0);
        const worldX = (mouseX - (width / 2 + targetPanX)) / targetZoomLevel;
        const worldY = (mouseY - (height / 2 + targetPanY)) / targetZoomLevel;

        targetZoomLevel = newZoom;
        settings.zoom = newZoom;
        targetPanX = mouseX - width / 2 - worldX * targetZoomLevel;
        targetPanY = mouseY - height / 2 - worldY * targetZoomLevel;

        if (gui) {
          let c = gui.controllersRecursive().find(c => c.property === 'zoom');
          if (c) c.updateDisplay();
        }
      }, { passive: false });

      // Drag to Pan & Clean Click to Randomize
      window.addEventListener('pointerdown', (e) => {
        if (e.target.closest('.lil-gui')) return;
        isDragging = true;
        hasDragged = false;
        dragStartX = e.clientX;
        dragStartY = e.clientY;
        startPanX = targetPanX;
        startPanY = targetPanY;
      });

      window.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        const dx = e.clientX - dragStartX;
        const dy = e.clientY - dragStartY;
        if (Math.hypot(dx, dy) > 5) {
          hasDragged = true;
        }
        targetPanX = startPanX + dx;
        targetPanY = startPanY + dy;
      });

      window.addEventListener('pointerup', (e) => {
        if (!isDragging) return;
        isDragging = false;
        if (!hasDragged && !e.target.closest('.lil-gui')) {
          // Clean canvas click detected
          if (settings.clickToRandomize) {
            randomizeAll(true);
          }
        }
      });

      // Keyboard Shortcuts (No on-screen instructions)
      window.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT') return;
        if (e.code === 'Space') {
          e.preventDefault();
          settings.isPlaying = !settings.isPlaying;
          if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
        } else if (e.code === 'KeyR') {
          e.preventDefault();
          randomizeAll(true);
        } else if (e.code === 'KeyC') {
          e.preventDefault();
          let keys = Object.keys(COLOR_SCHEMES);
          let nextIdx = (keys.indexOf(settings.colorScheme) + 1) % keys.length;
          settings.colorScheme = keys[nextIdx];
          triggerRebuild(true);
          if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
        } else if (e.code === 'KeyP') {
          e.preventDefault();
          let nextIdx = (PATTERN_TYPES.indexOf(settings.patternType) + 1) % PATTERN_TYPES.length;
          settings.patternType = PATTERN_TYPES[nextIdx];
          triggerRebuild(true);
          if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
        } else if (e.code === 'Enter') {
          e.preventDefault();
          instantFinish();
        } else if (e.code === 'KeyZ') {
          e.preventDefault();
          resetCamera();
        } else if (e.code === 'KeyF') {
          e.preventDefault();
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(() => {});
          } else {
            document.exitFullscreen().catch(() => {});
          }
        }
      });

      // File Drag & Drop for Custom Image Embroidery
      window.addEventListener('dragover', (e) => e.preventDefault());
      window.addEventListener('drop', (e) => {
        e.preventDefault();
        if (e.dataTransfer.files && e.dataTransfer.files[0]) {
          handleImageFile(e.dataTransfer.files[0]);
        }
      });

      // Image Upload File Input Handler
      const uploadInput = document.getElementById('image-upload-input');
      uploadInput.addEventListener('change', (e) => {
        if (e.target.files && e.target.files[0]) {
          handleImageFile(e.target.files[0]);
        }
      });
    }

    function handleImageFile(file) {
      if (!file.type.startsWith('image/')) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        loadImage(event.target.result, (loaded) => {
          customUploadedImg = loaded;
          if (!PATTERN_TYPES.includes('Custom Image')) {
            PATTERN_TYPES.push('Custom Image');
          }
          settings.patternType = 'Custom Image';
          if (gui) {
            let pCtrl = gui.controllersRecursive().find(c => c.property === 'patternType');
            if (pCtrl) {
              pCtrl.options(PATTERN_TYPES);
              pCtrl.setValue('Custom Image');
            }
          }
          triggerRebuild(true);
        });
      };
      reader.readAsDataURL(file);
    }

    // ============================================================
    // lil-gui Control Panel Construction
    // ============================================================
    function buildGUI() {
      gui = new lil.GUI({ title: 'Cross-Stitch Loom' });

      // Folder 1: Color Themes (19 Curated Schemes)
      const fTheme = gui.addFolder('Color Themes (19 Schemes)');
      fTheme.add(settings, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Palette').onChange(() => {
        triggerRebuild(true);
      });
      fTheme.add(settings, 'fabricTone', Object.keys(FABRIC_TONES)).name('Cloth Tone').onChange(() => {
        makeStitches();
      });
      fTheme.add(settings, 'patternType', PATTERN_TYPES).name('Tapestry Motif').onChange(() => {
        triggerRebuild(true);
      });
      fTheme.add(settings, 'uploadImage').name('📂 Upload Image...');
      fTheme.add(settings, 'clickToRandomize').name('Click Scene to Roll');
      fTheme.add(settings, 'randomizeScene').name('🎲 Randomize All');

      // Folder 2: Animation & Loom Speed
      const fAnim = gui.addFolder('Animation & Loom Controls');
      fAnim.add(settings, 'animationSpeed', 0.2, 3.5, 0.05).name('Loom Speed');
      fAnim.add(settings, 'stitchesPerFrame', 1, 24, 1).name('Stitches/Frame');
      fAnim.add(settings, 'isPlaying').name('Weaving Active');
      fAnim.add(settings, 'completeNow').name('⚡ Complete Tapestry');
      fAnim.add(settings, 'restart').name('↺ Re-stitch');

      // Folder 3: Stitch Fiber & Geometry
      const fFiber = gui.addFolder('Thread & Needle Geometry');
      fFiber.add(settings, 'gridResolution', [80, 100, 120, 140, 160]).name('Grid Density').onChange(() => {
        triggerRebuild(true);
      });
      fFiber.add(settings, 'stitchLengthMult', 0.8, 2.5, 0.05).name('Stitch Length').onChange(() => {
        triggerRebuild(false);
      });
      fFiber.add(settings, 'stitchWidthRatio', 1.5, 4.0, 0.1).name('Thread Thickness').onChange(() => {
        triggerRebuild(false);
      });
      fFiber.add(settings, 'flightArc', 1.0, 5.0, 0.1).name('Needle Arc');
      fFiber.add(settings, 'threadTexture', 0.0, 1.0, 0.05).name('Fiber Variance');
      fFiber.add(settings, 'threadSheen', 0.0, 1.0, 0.05).name('Silk Sheen');

      // Folder 4: Camera & Viewport
      const fCam = gui.addFolder('Viewport & Camera');
      fCam.add(settings, 'zoom', 0.3, 6.0, 0.05).name('Zoom Level').onChange((v) => {
        targetZoomLevel = v;
      });
      fCam.add({ reset: resetCamera }, 'reset').name('⌖ Reset Pan & Zoom');

      fTheme.open();
      fAnim.open();
    }
  </script>
</body>
