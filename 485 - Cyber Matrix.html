<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procedural Cyber Matrix City - 485</title>
  <style>
    .wrapper, body, canvas, html {
      width: 100%;
      height: 100%;
    }
    body, html {
      margin: 0;
      overflow: hidden;
      background-color: #030812;
      user-select: none;
      -webkit-user-select: none;
    }
    .wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: none;
    }
    canvas:active {
      cursor: grabbing;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/",
      "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
    }
  }
  </script>
</head>
<body>
  <div class="wrapper"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import GUI from 'lil-gui';

    // =========================================================================
    // 19 Preconfigured Color Schemes & Palettes
    // =========================================================================
    const colorSchemes = {
      'Original': {

        primary: '#00f0ff',

        grid: '#003355',

        accent: '#90e0ef',

      },
      'Analogous': {

      },
      'Complementary': {
        bg: '#060612',

        secondary: '#ff5400',
        accent: '#ffaa00',
        grid: '#0a2a40',

      },
      'Split-complementary': {
        bg: '#080812',

      },

      },
      'Tetradic': {

      'Achromatic + Accent (W&B + Red)': {

      },

        primary: '#d4c5b9',
        secondary: '#8c8275',
        accent: '#ff5500',
        grid: '#3a3530',
        particles: '#ff7733'
      },
      'Palette 1 (F6AA1C)': {
        bg: '#220901',
        primary: '#F6AA1C',
        secondary: '#BC3908',
        accent: '#941B0C',
        grid: '#471505',
        particles: '#F6AA1C'
      },
      'Palette 2 (63D1CF)': {
        bg: '#000000',
        primary: '#63D1CF',
        secondary: '#5BC0BE',
        accent: '#4BAD9E',
        grid: '#0B132B',
        particles: '#63D1CF'
      },
      'Palette 3 (AA60C8)': {
        bg: '#120A12',
        primary: '#AA60C8',
        secondary: '#D69ADE',
        accent: '#CFB5C2',
        grid: '#0D001D',
        particles: '#D69ADE'
      },
      'Palette 4 (FEF1BE)': {
        bg: '#061210',
        primary: '#FFBA00',
        secondary: '#FEF1BE',
        accent: '#008189',
        grid: '#00474D',
        particles: '#FFBA00'
      },
      'Palette 5 (D4FFB0)': {
        bg: '#05140A',
        primary: '#7FFF00',
        secondary: '#D4FFB0',
        accent: '#00B894',
        grid: '#0A3322',
        particles: '#7FFF00'
      },
      'Palette 6 (FFE8CC)': {
        bg: '#0E0618',
        primary: '#FF8C00',
        secondary: '#FFE8CC',
        accent: '#C7501A',
        grid: '#3D1050',
        particles: '#FF8C00'
      },
      'Palette 7 (E8E0FF)': {
        bg: '#090612',
        primary: '#B38FFF',
        secondary: '#E8E0FF',
        accent: '#6A3DE8',
        grid: '#1A1250',
        particles: '#B38FFF'
      },
      'Palette 8 (E0FBFF)': {
        bg: '#05020F',
        primary: '#00F0FF',
        secondary: '#E0FBFF',
        accent: '#D40078',
        grid: '#1E0A3D',
        particles: '#00F0FF'
      }
    };

    // =========================================================================
    // Parameters State
    // =========================================================================
    const initialScheme = colorSchemes['Original'];

    const params = {
      // Color & Theme
      colorScheme: 'Original',
      greenscreen: false,
      backgroundColor: initialScheme.bg,
      primaryColor: initialScheme.primary,
      secondaryColor: initialScheme.secondary,
      accentColor: initialScheme.accent,
      gridColor: initialScheme.grid,
      particlesColor: initialScheme.particles,

      // Procedural Click Randomizer
      randomizeOnClick: true,

      // Geometry & City Matrix
      gridSize: 22,
      gridSpacing: 3.2,
      maxHeight: 28.0,
      heightVariance: 1.4,
      waveFrequency: 0.14,
      waveSpeed: 1.6,
      waveAmplitude: 0.8,
      towerWidth: 1.8,

      // Core Monolith
      coreScale: 1.3,
      coreSpeed: 1.2,

      // Kinetic Rings
      ringSpeed: 1.0,

      // Motion & Dynamics
      cityRotationSpeed: 0.35,
      lightPulseSpeed: 1.8,
      particleSpeed: 1.0,
      particleCount: 1800
    };

    const wrapper = document.querySelector('.wrapper');

    // =========================================================================
    // Robust WebGL Context Detection & Creation with Auto-Recovery
    // =========================================================================
    function getSafeContext(canvas) {
      canvas.addEventListener('webglcontextlost', (e) => {
        e.preventDefault();
        console.warn('WebGL Context Lost. Auto recovery scheduled.');
      }, false);

      const configs = [
        { powerPreference: 'default', failIfMajorPerformanceCaveat: false, antialias: true, alpha: true },
        { powerPreference: 'default', failIfMajorPerformanceCaveat: false, antialias: false, alpha: true },
        { failIfMajorPerformanceCaveat: false, antialias: false, alpha: false }
      ];

      for (const cfg of configs) {
        try {
          const gl = canvas.getContext('webgl2', cfg);
          if (gl && !gl.isContextLost()) {
            return { gl, cfg };
          }
        } catch (err) {
          // try next
        }
      }
      return null;
    }

    // Determine initial rendering mode
    let isWebGL = false;
    let mainCanvas = document.createElement('canvas');
    wrapper.appendChild(mainCanvas);

    let webglSetup = getSafeContext(mainCanvas);

    // If initial canvas failed WebGL, check if it's because of browser temporary block
    if (!webglSetup) {
      console.warn('WebGL currently unavailable or blocked by browser. Initializing high-performance procedural fallback mode.');
    } else {
      isWebGL = true;
    }

    // =========================================================================
    // Mode A: Three.js 3D WebGL Implementation
    // =========================================================================
    let scene, camera, renderer, controls;
    let coreLight, accentLight, ambientLight, dirLight1, dirLight2;
    let instancedMesh, buildingGeo, buildingMat;
    const dummy = new THREE.Object3D();
    const towerData = [];
    let coreGroup, crystalMesh, crystalMat, cageLine, cageMat, innerSphere, innerSphereMat;
    let ringsGroup;
    const ringList = [];
    let gridHelper, groundMesh;
    let particlesMesh, particlePositions, particleVelocities;
    let clock = new THREE.Clock();

    function initWebGL() {
      scene = new THREE.Scene();
      const initialBg = params.greenscreen ? '#00ff00' : params.backgroundColor;
      scene.background = new THREE.Color(initialBg);
      scene.fog = new THREE.FogExp2(initialBg, 0.012);

      camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.5, 600);
      camera.position.set(52, 45, 68);

      renderer = new THREE.WebGLRenderer({
        canvas: mainCanvas,
        context: webglSetup.gl,
        alpha: true,
        antialias: webglSetup.cfg.antialias
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.25;

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.screenSpacePanning = true;
      controls.minDistance = 5;
      controls.maxDistance = 250;
      controls.maxPolarAngle = Math.PI / 2 + 0.05;
      controls.target.set(0, 8, 0);
      controls.update();

      // Lights
      ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);

      dirLight1 = new THREE.DirectionalLight(0xffffff, 2.2);
      dirLight1.position.set(40, 70, 30);
      scene.add(dirLight1);

      dirLight2 = new THREE.DirectionalLight(0xffffff, 1.2);
      dirLight2.position.set(-40, -20, -40);
      scene.add(dirLight2);

      coreLight = new THREE.PointLight(new THREE.Color(params.primaryColor), 4.0, 60, 1.5);
      coreLight.position.set(0, 14, 0);
      scene.add(coreLight);

      accentLight = new THREE.PointLight(new THREE.Color(params.accentColor), 3.0, 50, 1.5);
      accentLight.position.set(0, 2, 0);
      scene.add(accentLight);

      // Building Geometry & Materials
      buildingGeo = new THREE.BoxGeometry(1, 1, 1);
      buildingGeo.translate(0, 0.5, 0);

      buildingMat = new THREE.MeshStandardMaterial({
        color: 0x111622,
        roughness: 0.25,
        metalness: 0.85,
        emissive: new THREE.Color(params.primaryColor),
        emissiveIntensity: 0.2
      });

      buildCityWebGL();

      // Central Monolith
      coreGroup = new THREE.Group();
      coreGroup.position.set(0, 6, 0);
      scene.add(coreGroup);

      const crystalGeo = new THREE.OctahedronGeometry(3.5, 0);
      crystalMat = new THREE.MeshPhysicalMaterial({
        color: new THREE.Color(params.primaryColor),
        emissive: new THREE.Color(params.primaryColor),
        emissiveIntensity: 0.8,
        roughness: 0.1,
        metalness: 0.2,
        transmission: 0.85,
        ior: 1.6,
        thickness: 2.0,
        transparent: true,
        opacity: 0.95
      });
      crystalMesh = new THREE.Mesh(crystalGeo, crystalMat);
      coreGroup.add(crystalMesh);

      const cageGeo = new THREE.IcosahedronGeometry(5.0, 1);
      const cageEdgesGeo = new THREE.WireframeGeometry(cageGeo);
      cageMat = new THREE.LineBasicMaterial({
        color: new THREE.Color(params.accentColor),
        transparent: true,
        opacity: 0.7,
        blending: THREE.AdditiveBlending
      });
      cageLine = new THREE.LineSegments(cageEdgesGeo, cageMat);
      coreGroup.add(cageLine);

      const innerSphereGeo = new THREE.SphereGeometry(1.4, 24, 24);
      innerSphereMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(params.accentColor) });
      innerSphere = new THREE.Mesh(innerSphereGeo, innerSphereMat);
      coreGroup.add(innerSphere);

      // Kinetic Orbital Rings
      ringsGroup = new THREE.Group();
      scene.add(ringsGroup);

      const ringRadii = [8, 14, 22, 32, 44];
      ringRadii.forEach((r, i) => {
        const ringGeo = new THREE.RingGeometry(r, r + 0.16, 96);
        const ringMat = new THREE.MeshBasicMaterial({
          color: (i % 2 === 0) ? new THREE.Color(params.primaryColor) : new THREE.Color(params.accentColor),
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 0.65 - i * 0.08,
          blending: THREE.AdditiveBlending
        });
        const ringMesh = new THREE.Mesh(ringGeo, ringMat);
        ringMesh.rotation.x = Math.PI / 2;
        ringMesh.position.y = 0.2 + i * 0.8;
        ringsGroup.add(ringMesh);

        ringList.push({
          mesh: ringMesh,
          speed: (i % 2 === 0 ? 1 : -1) * (0.4 + i * 0.15),
          baseY: 0.2 + i * 0.8
        });
      });

      // Energy Ground Matrix
      gridHelper = new THREE.PolarGridHelper(70, 24, 8, 64, new THREE.Color(params.accentColor), new THREE.Color(params.gridColor));
      gridHelper.position.y = 0.02;
      scene.add(gridHelper);

      const groundGeo = new THREE.CircleGeometry(85, 64);
      const groundMat = new THREE.MeshStandardMaterial({ color: 0x050810, roughness: 0.35, metalness: 0.85 });
      groundMesh = new THREE.Mesh(groundGeo, groundMat);
      groundMesh.rotation.x = -Math.PI / 2;
      scene.add(groundMesh);

      // Particles
      particlePositions = new Float32Array(params.particleCount * 3);
      particleVelocities = [];

      for (let i = 0; i < params.particleCount; i++) {
        const rad = 5 + Math.random() * 55;
        const th = Math.random() * Math.PI * 2;
        const y = Math.random() * 40;

        particlePositions[i * 3 + 0] = Math.cos(th) * rad;
        particlePositions[i * 3 + 1] = y;
        particlePositions[i * 3 + 2] = Math.sin(th) * rad;

        particleVelocities.push({
          radius: rad,
          angle: th,
          speed: (Math.random() * 0.5 + 0.2) * (Math.random() < 0.5 ? 1 : -1),
          yVel: (Math.random() - 0.5) * 0.08
        });
      }

      const particleGeo = new THREE.BufferGeometry();
      particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
      const particleMat = new THREE.PointsMaterial({
        color: new THREE.Color(params.particlesColor),
        size: 0.8,
        transparent: true,
        opacity: 0.85,
        blending: THREE.AdditiveBlending
      });
      particlesMesh = new THREE.Points(particleGeo, particleMat);
      scene.add(particlesMesh);

      updateVisualsWebGL();
    }

    function buildCityWebGL() {
      if (instancedMesh) scene.remove(instancedMesh);
      towerData.length = 0;

      const N = params.gridSize;
      const count = N * N;

      instancedMesh = new THREE.InstancedMesh(buildingGeo, buildingMat, count);
      instancedMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);

      const colors = new Float32Array(count * 3);
      const cPrimary = new THREE.Color(params.primaryColor);
      const cSecondary = new THREE.Color(params.secondaryColor);
      const cAccent = new THREE.Color(params.accentColor);
      const tempColor = new THREE.Color();

      const half = (N - 1) / 2;
      let idx = 0;

      for (let x = 0; x < N; x++) {
        for (let z = 0; z < N; z++) {
          const posX = (x - half) * params.gridSpacing;
          const posZ = (z - half) * params.gridSpacing;
          const dist = Math.sqrt(posX * posX + posZ * posZ);
          const isCoreClearing = dist < 6.5;

          const angle = Math.atan2(posZ, posX);
          const heightFactor = Math.pow(Math.max(0, 1 - dist / (half * params.gridSpacing * 1.3)), 1.1);
          const baseHeight = isCoreClearing ? 0.05 : (
            (Math.sin(x * 1.2) * Math.cos(z * 1.2) * 0.4 + 0.6) * 
            (Math.sin(angle * 3.0) * 0.35 + 0.9) * 
            params.maxHeight * heightFactor * params.heightVariance + 1.2
          );

          towerData.push({
            posX, posZ, dist, angle, baseHeight,
            active: !isCoreClearing,
            colorType: Math.random() < 0.2 ? 'accent' : (Math.random() < 0.5 ? 'secondary' : 'primary')
          });

          const cType = towerData[idx].colorType;
          if (cType === 'accent') tempColor.copy(cAccent);
          else if (cType === 'secondary') tempColor.copy(cSecondary);
          else tempColor.copy(cPrimary);

          tempColor.lerp(new THREE.Color(0x0a0e18), 0.72);
          tempColor.toArray(colors, idx * 3);

          idx++;
        }
      }

      instancedMesh.instanceColor = new THREE.InstancedBufferAttribute(colors, 3);
      scene.add(instancedMesh);
    }

    function updateVisualsWebGL() {
      if (!isWebGL || !renderer) return;

      const effectiveBg = params.greenscreen ? '#00ff00' : params.backgroundColor;
      const bgColor = new THREE.Color(effectiveBg);

      scene.background = bgColor;
      scene.fog.color.copy(bgColor);
      renderer.setClearColor(bgColor, 1.0);

      const cPrimary = new THREE.Color(params.primaryColor);
      const cSecondary = new THREE.Color(params.secondaryColor);
      const cAccent = new THREE.Color(params.accentColor);

      coreLight.color.copy(cPrimary);
      accentLight.color.copy(cAccent);

      crystalMat.color.copy(cPrimary);
      crystalMat.emissive.copy(cPrimary);
      cageMat.color.copy(cAccent);
      innerSphereMat.color.copy(cAccent);

      ringList.forEach((r, idx) => {
        r.mesh.material.color.copy(idx % 2 === 0 ? cPrimary : cAccent);
      });

      scene.remove(gridHelper);
      gridHelper = new THREE.PolarGridHelper(70, 24, 8, 64, cAccent, new THREE.Color(params.gridColor));
      gridHelper.position.y = 0.02;
      scene.add(gridHelper);

      particlesMesh.material.color.copy(new THREE.Color(params.particlesColor));

      if (instancedMesh && instancedMesh.instanceColor) {
        const colors = instancedMesh.instanceColor.array;
        const temp = new THREE.Color();
        for (let i = 0; i < towerData.length; i++) {
          const type = towerData[i].colorType;
          if (type === 'accent') temp.copy(cAccent);
          else if (type === 'secondary') temp.copy(cSecondary);
          else temp.copy(cPrimary);
          temp.lerp(new THREE.Color(0x0a0e18), 0.72);
          temp.toArray(colors, i * 3);
        }
        instancedMesh.instanceColor.needsUpdate = true;
      }

      if (params.greenscreen) {
        groundMesh.material.color.setHex(0x00ff00);
      } else {
        groundMesh.material.color.copy(new THREE.Color(params.backgroundColor).lerp(new THREE.Color(0x000000), 0.4));
      }
    }

    // =========================================================================
    // Mode B: High-Performance Canvas 2D Fallback Implementation
    // =========================================================================
    let ctx2d = null;
    let cameraAngle = 0.75;
    let cameraElevation = 0.58;
    let cameraZoom = 1.0;
    let cameraPanX = 0;
    let cameraPanY = 0;
    let isDragging = false;
    let dragButton = 0;
    let lastMouseX = 0, lastMouseY = 0;
    let towers2D = [];
    let particles2D = [];

    function initCanvas2D() {
      // Re-create a clean 2D canvas
      wrapper.innerHTML = '';
      mainCanvas = document.createElement('canvas');
      mainCanvas.width = window.innerWidth;
      mainCanvas.height = window.innerHeight;
      wrapper.appendChild(mainCanvas);
      ctx2d = mainCanvas.getContext('2d');

      buildCity2D();
      initParticles2D();
      setup2DControls();
    }

    function buildCity2D() {
      towers2D = [];
      const N = params.gridSize;
      const half = (N - 1) / 2;

      for (let x = 0; x < N; x++) {
        for (let z = 0; z < N; z++) {
          const posX = (x - half) * params.gridSpacing;
          const posZ = (z - half) * params.gridSpacing;
          const dist = Math.sqrt(posX * posX + posZ * posZ);
          const isCoreClearing = dist < 6.5;

          const angle = Math.atan2(posZ, posX);
          const heightFactor = Math.pow(Math.max(0, 1 - dist / (half * params.gridSpacing * 1.3)), 1.1);
          const baseHeight = isCoreClearing ? 0 : (
            (Math.sin(x * 1.2) * Math.cos(z * 1.2) * 0.4 + 0.6) * 
            (Math.sin(angle * 3.0) * 0.35 + 0.9) * 
            params.maxHeight * heightFactor * params.heightVariance + 1.2
          );

          towers2D.push({
            x: posX, z: posZ, dist, angle, baseHeight,
            active: !isCoreClearing,
            colorType: Math.random() < 0.2 ? 'accent' : (Math.random() < 0.5 ? 'secondary' : 'primary')
          });
        }
      }
    }

    function initParticles2D() {
      particles2D = [];
      for (let i = 0; i < params.particleCount; i++) {
        particles2D.push({
          radius: 6 + Math.random() * 52,
          angle: Math.random() * Math.PI * 2,
          y: Math.random() * 35,
          speed: (Math.random() * 0.4 + 0.15) * (Math.random() < 0.5 ? 1 : -1),
          yVel: (Math.random() - 0.5) * 0.05
        });
      }
    }

    function setup2DControls() {
      mainCanvas.addEventListener('mousedown', (e) => {
        isDragging = true;
        dragButton = e.button;
        lastMouseX = e.clientX;
        lastMouseY = e.clientY;
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const dx = e.clientX - lastMouseX;
        const dy = e.clientY - lastMouseY;
        lastMouseX = e.clientX;
        lastMouseY = e.clientY;

        if (dragButton === 0 && !e.shiftKey) {
          // Left drag: Rotate scene
          cameraAngle += dx * 0.008;
          cameraElevation = Math.max(0.1, Math.min(1.4, cameraElevation - dy * 0.006));
        } else {
          // Right drag or Shift + Left drag: Pan across screen
          cameraPanX += dx;
          cameraPanY += dy;
        }
      });

      window.addEventListener('mouseup', () => { isDragging = false; });
      mainCanvas.addEventListener('contextmenu', (e) => e.preventDefault());

      // Wheel Zoom
      mainCanvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        const factor = e.deltaY > 0 ? 0.92 : 1.08;
        cameraZoom = Math.max(0.2, Math.min(4.0, cameraZoom * factor));
      }, { passive: false });
    }

    // 3D to 2D projection helper for fallback mode
    function project3D(x, y, z, cx, cy, cosA, sinA, cosE, sinE, scale) {
      // Rotation around Y
      const rx = x * cosA - z * sinA;
      const rz = x * sinA + z * cosA;
      // Tilt with elevation
      const px = rx * scale + cx + cameraPanX;
      const py = (rz * sinE - y * cosE) * scale + cy + cameraPanY;
      return { x: px, y: py, depth: rz * cosE + y * sinE };
    }

    function render2D(time) {
      if (!ctx2d) return;
      const w = mainCanvas.width;
      const h = mainCanvas.height;
      const cx = w / 2;
      const cy = h / 2 + 60 * cameraZoom;

      const effectiveBg = params.greenscreen ? '#00ff00' : params.backgroundColor;
      ctx2d.fillStyle = effectiveBg;
      ctx2d.fillRect(0, 0, w, h);

      const rot = cameraAngle + time * 0.03 * params.cityRotationSpeed;
      const cosA = Math.cos(rot);
      const sinA = Math.sin(rot);
      const cosE = Math.cos(cameraElevation);
      const sinE = Math.sin(cameraElevation);
      const scale = 8.5 * cameraZoom;

      // 1. Draw Polar Coordinate Ground Rings
      ctx2d.save();
      const ringColor = params.greenscreen ? 'rgba(0,0,0,0.4)' : params.gridColor;
      ctx2d.strokeStyle = ringColor;
      ctx2d.lineWidth = 1;
      const radii = [10, 20, 30, 42, 56];
      for (const r of radii) {
        ctx2d.beginPath();
        for (let th = 0; th <= Math.PI * 2; th += 0.2) {
          const pt = project3D(Math.cos(th) * r, 0, Math.sin(th) * r, cx, cy, cosA, sinA, cosE, sinE, scale);
          if (th === 0) ctx2d.moveTo(pt.x, pt.y);
          else ctx2d.lineTo(pt.x, pt.y);
        }
        ctx2d.closePath();
        ctx2d.stroke();
      }
      ctx2d.restore();

      // 2. Draw 3D Harmonic City Towers (depth-sorted)
      const visibleTowers = [];
      const wFreq = params.waveFrequency;
      const wSpeed = params.waveSpeed;
      const wAmp = params.waveAmplitude;
      const wWidth = params.towerWidth;

      for (let i = 0; i < towers2D.length; i++) {
        const t = towers2D[i];
        if (!t.active) continue;

        const wave = Math.sin(t.dist * wFreq - time * wSpeed) * Math.cos(t.angle * 2.0 + time * 0.5);
        const height = Math.max(0.6, t.baseHeight * (1.0 + wave * wAmp));

        const basePt = project3D(t.x, 0, t.z, cx, cy, cosA, sinA, cosE, sinE, scale);
        const topPt = project3D(t.x, height, t.z, cx, cy, cosA, sinA, cosE, sinE, scale);

        visibleTowers.push({
          x: t.x, z: t.z, height,
          basePt, topPt, depth: basePt.depth,
          colorType: t.colorType
        });
      }

      visibleTowers.sort((a, b) => a.depth - b.depth);

      for (const t of visibleTowers) {
        const hw = (wWidth * scale) / 2;
        const b = t.basePt;
        const top = t.topPt;

        // Tower Body
        ctx2d.fillStyle = params.greenscreen ? '#0f2214' : '#0e1422';
        ctx2d.beginPath();
        ctx2d.moveTo(b.x - hw, b.y);
        ctx2d.lineTo(top.x - hw, top.y);
        ctx2d.lineTo(top.x + hw, top.y);
        ctx2d.lineTo(b.x + hw, b.y);
        ctx2d.closePath();
        ctx2d.fill();

        // Neon Roof & Edge Glow
        let strokeCol = params.primaryColor;
        if (t.colorType === 'accent') strokeCol = params.accentColor;
        else if (t.colorType === 'secondary') strokeCol = params.secondaryColor;

        ctx2d.strokeStyle = strokeCol;
        ctx2d.lineWidth = 1.2;
        ctx2d.stroke();

        // Glowing Beacon on high towers
        if (t.height > 16) {
          ctx2d.fillStyle = params.accentColor;
          ctx2d.beginPath();
          ctx2d.arc(top.x, top.y - 2, 2.5 * cameraZoom, 0, Math.PI * 2);
          ctx2d.fill();
        }
      }

      // 3. Central Monolith & Core Hologram
      const coreY = 8 + Math.sin(time * 1.5 * params.coreSpeed) * 1.2;
      const coreScale = params.coreScale * scale;
      const corePt = project3D(0, coreY, 0, cx, cy, cosA, sinA, cosE, sinE, scale);

      ctx2d.save();
      ctx2d.translate(corePt.x, corePt.y);

      // Rotating Octahedron Diamond in 2D
      const rotC = time * params.coreSpeed;
      ctx2d.strokeStyle = params.primaryColor;
      ctx2d.lineWidth = 2.0;
      ctx2d.beginPath();
      ctx2d.moveTo(0, -coreScale * 0.45);
      ctx2d.lineTo(Math.cos(rotC) * coreScale * 0.35, 0);
      ctx2d.lineTo(0, coreScale * 0.45);
      ctx2d.lineTo(-Math.cos(rotC) * coreScale * 0.35, 0);
      ctx2d.closePath();
      ctx2d.stroke();

      // Outer Cage Line
      ctx2d.strokeStyle = params.accentColor;
      ctx2d.lineWidth = 1.0;
      ctx2d.beginPath();
      ctx2d.arc(0, 0, coreScale * 0.48, 0, Math.PI * 2);
      ctx2d.stroke();

      // Inner Glowing Core
      const pulse = (Math.sin(time * params.lightPulseSpeed * 2.0) + 1.0) * 0.5;
      ctx2d.fillStyle = params.accentColor;
      ctx2d.beginPath();
      ctx2d.arc(0, 0, (6 + pulse * 5) * cameraZoom, 0, Math.PI * 2);
      ctx2d.fill();
      ctx2d.restore();

      // 4. Stardust Particles
      ctx2d.fillStyle = params.particlesColor;
      const pSpeed = params.particleSpeed;
      for (const p of particles2D) {
        p.angle += p.speed * 0.015 * pSpeed;
        p.y += p.yVel * pSpeed;
        if (p.y > 40) p.y = 1;
        if (p.y < 1) p.y = 40;

        const px = Math.cos(p.angle) * p.radius;
        const pz = Math.sin(p.angle) * p.radius;
        const pt = project3D(px, p.y, pz, cx, cy, cosA, sinA, cosE, sinE, scale);

        ctx2d.beginPath();
        ctx2d.arc(pt.x, pt.y, 1.2 * cameraZoom, 0, Math.PI * 2);
        ctx2d.fill();
      }
    }

    // =========================================================================
    // Master Unified Visualization & Theme Manager
    // =========================================================================
    function applyColorScheme(scheme) {
      params.primaryColor = scheme.primary;
      params.secondaryColor = scheme.secondary;
      params.accentColor = scheme.accent;
      params.gridColor = scheme.grid;
      params.particlesColor = scheme.particles;
      if (!params.greenscreen) {
        params.backgroundColor = scheme.bg;
      }
      if (isWebGL) updateVisualsWebGL();
    }

    function randomizeScene() {
      // 1. Pick Random Theme
      const keys = Object.keys(colorSchemes);
      const chosenKey = keys[Math.floor(Math.random() * keys.length)];
      params.colorScheme = chosenKey;
      applyColorScheme(colorSchemes[chosenKey]);

      // 2. Re-roll Geometric Parameters
      params.maxHeight = THREE.MathUtils.randFloat(18.0, 42.0);
      params.heightVariance = THREE.MathUtils.randFloat(0.9, 2.2);
      params.waveFrequency = THREE.MathUtils.randFloat(0.08, 0.30);
      params.waveAmplitude = THREE.MathUtils.randFloat(0.4, 1.6);
      params.towerWidth = THREE.MathUtils.randFloat(1.2, 2.4);
      params.coreScale = THREE.MathUtils.randFloat(0.8, 1.9);

      // 3. Re-roll Motion Parameters
      params.waveSpeed = THREE.MathUtils.randFloat(0.8, 2.8);
      params.cityRotationSpeed = THREE.MathUtils.randFloat(0.15, 0.75) * (Math.random() < 0.5 ? 1 : -1);
      params.coreSpeed = THREE.MathUtils.randFloat(0.6, 2.4);
      params.lightPulseSpeed = THREE.MathUtils.randFloat(1.0, 3.0);
      params.particleSpeed = THREE.MathUtils.randFloat(0.6, 2.2);

      // Rebuild geometry
      if (isWebGL) {
        buildCityWebGL();
        updateVisualsWebGL();
      } else {
        buildCity2D();
      }

      // Update lil-gui controls
      gui.controllersRecursive().forEach(ctrl => ctrl.updateDisplay());
    }

    // Click Detection on Scene (distinguishing drag vs click)
    let pointerDownPos = { x: 0, y: 0 };
    let pointerDownTime = 0;

    window.addEventListener('pointerdown', (e) => {
      // Ignore clicks on GUI
      if (e.target.closest('.lil-gui')) return;
      pointerDownPos.x = e.clientX;
      pointerDownPos.y = e.clientY;
      pointerDownTime = performance.now();
    });

    window.addEventListener('pointerup', (e) => {
      if (e.target.closest('.lil-gui')) return;
      const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
      const duration = performance.now() - pointerDownTime;

      // Click qualifies if barely moved and released quickly
      if (dist < 6 && duration < 380) {
        if (params.randomizeOnClick) {
          randomizeScene();
        }
      }
    });

    // =========================================================================
    // Lil-GUI Setup
    // =========================================================================
    const gui = new GUI({ title: 'Cyber Matrix 485' });

    // Presets & Color Schemes
    const themeFolder = gui.addFolder('Theme & Color Presets');
    themeFolder.add(params, 'colorScheme', Object.keys(colorSchemes)).name('Scheme').onChange((val) => {
      applyColorScheme(colorSchemes[val]);
      gui.controllersRecursive().forEach(ctrl => ctrl.updateDisplay());
    });

    themeFolder.add(params, 'greenscreen').name('Greenscreen #00ff00').onChange(() => {
      if (isWebGL) updateVisualsWebGL();
    });

    themeFolder.addColor(params, 'backgroundColor').name('Background').onChange(() => {
      if (!params.greenscreen && isWebGL) updateVisualsWebGL();
    });

    themeFolder.addColor(params, 'primaryColor').name('Primary').onChange(() => {
      if (isWebGL) updateVisualsWebGL();
    });
    themeFolder.addColor(params, 'secondaryColor').name('Secondary').onChange(() => {
      if (isWebGL) updateVisualsWebGL();
    });
    themeFolder.addColor(params, 'accentColor').name('Accent').onChange(() => {
      if (isWebGL) updateVisualsWebGL();
    });
    themeFolder.addColor(params, 'gridColor').name('Grid Lines').onChange(() => {
      if (isWebGL) updateVisualsWebGL();
    });
    themeFolder.addColor(params, 'particlesColor').name('Particles').onChange(() => {
      if (isWebGL) updateVisualsWebGL();
    });

    // Procedural Interaction
    const interactFolder = gui.addFolder('Interactivity');
    interactFolder.add(params, 'randomizeOnClick').name('Randomize on Click');
    interactFolder.add({ randomizeNow: () => randomizeScene() }, 'randomizeNow').name('Randomize Theme');

    // Geometry Controls
    const geomFolder = gui.addFolder('City Geometry');
    geomFolder.add(params, 'maxHeight', 10, 50, 0.5).name('Max Height').onChange(() => {
      if (isWebGL) buildCityWebGL(); else buildCity2D();
    });
    geomFolder.add(params, 'heightVariance', 0.5, 3.0, 0.1).name('Variance').onChange(() => {
      if (isWebGL) buildCityWebGL(); else buildCity2D();
    });
    geomFolder.add(params, 'towerWidth', 0.8, 2.8, 0.1).name('Building Width');
    geomFolder.add(params, 'waveFrequency', 0.04, 0.4, 0.01).name('Wave Frequency');
    geomFolder.add(params, 'waveAmplitude', 0.1, 2.0, 0.05).name('Wave Amplitude');
    geomFolder.add(params, 'coreScale', 0.5, 3.0, 0.05).name('Core Scale');

    // Motion & Dynamic Speeds
    const motionFolder = gui.addFolder('Motion & Dynamics');
    motionFolder.add(params, 'cityRotationSpeed', -2.0, 2.0, 0.05).name('City Spin');
    motionFolder.add(params, 'waveSpeed', 0.1, 4.0, 0.1).name('Wave Speed');
    motionFolder.add(params, 'coreSpeed', 0.1, 3.0, 0.1).name('Core Spin');
    motionFolder.add(params, 'lightPulseSpeed', 0.2, 4.0, 0.1).name('Pulse Speed');
    motionFolder.add(params, 'particleSpeed', 0.1, 3.0, 0.1).name('Drift Speed');

    // Hide/Show GUI with "H" key
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        const active = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
        if (active === 'input' || active === 'select' || active === 'textarea') return;
        gui._hidden ? gui.show() : gui.hide();
      }
    });

    // =========================================================================
    // Master Animation Loop
    // =========================================================================
    let startTime = performance.now();

    function masterAnimate() {
      requestAnimationFrame(masterAnimate);
      const time = (performance.now() - startTime) * 0.001;

      if (isWebGL && renderer && scene && camera) {
        controls.update();

        // City rotation
        scene.rotation.y = time * 0.04 * params.cityRotationSpeed;

        // Dynamic Towers Wave
        if (instancedMesh) {
          const wFreq = params.waveFrequency;
          const wSpeed = params.waveSpeed;
          const wAmp = params.waveAmplitude;
          const wWidth = params.towerWidth;

          for (let i = 0; i < towerData.length; i++) {
            const t = towerData[i];
            if (!t.active) {
              dummy.scale.set(0.001, 0.001, 0.001);
              dummy.position.set(t.posX, 0, t.posZ);
              dummy.updateMatrix();
              instancedMesh.setMatrixAt(i, dummy.matrix);
              continue;
            }

            const wave = Math.sin(t.dist * wFreq - time * wSpeed) * Math.cos(t.angle * 2.0 + time * 0.5);
            const currentHeight = Math.max(0.6, t.baseHeight * (1.0 + wave * wAmp));

            dummy.position.set(t.posX, 0, t.posZ);
            dummy.scale.set(wWidth, currentHeight, wWidth);
            dummy.rotation.set(0, 0, 0);
            dummy.updateMatrix();
            instancedMesh.setMatrixAt(i, dummy.matrix);
          }
          instancedMesh.instanceMatrix.needsUpdate = true;
        }

        // Central Monolith
        const cSpeed = params.coreSpeed;
        const cScale = params.coreScale;
        crystalMesh.rotation.y = time * 0.6 * cSpeed;
        crystalMesh.rotation.x = Math.sin(time * 0.4 * cSpeed) * 0.3;
        cageLine.rotation.y = -time * 0.8 * cSpeed;
        cageLine.rotation.z = Math.cos(time * 0.5 * cSpeed) * 0.4;

        const coreBob = Math.sin(time * 1.5 * cSpeed) * 0.8;
        coreGroup.position.y = 8 + coreBob;
        coreGroup.scale.set(cScale, cScale, cScale);

        // Pulse
        const pulse = (Math.sin(time * params.lightPulseSpeed * 2.0) + 1.0) * 0.5;
        coreLight.intensity = 3.0 + pulse * 4.0;
        accentLight.intensity = 2.0 + (1.0 - pulse) * 3.5;
        innerSphere.scale.setScalar(1.0 + pulse * 0.3);

        // Rings
        const rSpeed = params.ringSpeed;
        ringList.forEach((r, idx) => {
          r.mesh.rotation.z = time * r.speed * rSpeed;
          r.mesh.position.y = r.baseY + Math.sin(time * 1.2 + idx) * 0.4;
        });

        // Particles
        if (particlesMesh) {
          const pSpeed = params.particleSpeed;
          const positions = particlesMesh.geometry.attributes.position.array;
          for (let i = 0; i < params.particleCount; i++) {
            const v = particleVelocities[i];
            v.angle += v.speed * 0.01 * pSpeed;
            v.radius += Math.sin(time * 0.5 + i) * 0.03;

            positions[i * 3 + 0] = Math.cos(v.angle) * v.radius;
            positions[i * 3 + 1] += v.yVel * pSpeed;
            positions[i * 3 + 2] = Math.sin(v.angle) * v.radius;

            if (positions[i * 3 + 1] > 45) positions[i * 3 + 1] = 0.5;
            if (positions[i * 3 + 1] < 0.5) positions[i * 3 + 1] = 45;
          }
          particlesMesh.geometry.attributes.position.needsUpdate = true;
        }

        renderer.render(scene, camera);
      } else {
        render2D(time);
      }
    }

    // Initialize the engine based on current availability
    if (isWebGL) {
      initWebGL();
    } else {
      initCanvas2D();

      // Periodically test for WebGL availability in the background
      const recoveryTimer = setInterval(() => {
        try {
          const testCanvas = document.createElement('canvas');
          const testGl = testCanvas.getContext('webgl2', { failIfMajorPerformanceCaveat: false });
          if (testGl && !testGl.isContextLost()) {
            clearInterval(recoveryTimer);
            console.info('WebGL restored! Transitioning from fallback to WebGL 3D...');
            wrapper.innerHTML = '';
            mainCanvas = document.createElement('canvas');
            wrapper.appendChild(mainCanvas);
            webglSetup = getSafeContext(mainCanvas);
            if (webglSetup) {
              isWebGL = true;
              initWebGL();
            }
          }
        } catch (e) {
          // Keep running in fallback
        }
      }, 2000);
    }

    masterAnimate();

    // =========================================================================
    // Window Resize Handler
    // =========================================================================
    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      if (isWebGL && renderer && camera) {
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      } else if (mainCanvas) {
        mainCanvas.width = w;
        mainCanvas.height = h;
      }
    });
  </script>
</body>
</html>
