    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",

  <body>
    <script type="module">
      import * as THREE from 'three';
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
      import GUI from 'lil-gui';

      // =========================================================================================
      // POST PROCESSOR SUITE (Three.js Shader Post-Processing Pipeline + Fisheye)
      // =========================================================================================
      const orthoVertexShader = `
        precision highp float;
        in vec3 position;
        out vec2 vUv;
        void main() {
          vUv = position.xy * 0.5 + 0.5;
          gl_Position = vec4(position, 1.0);
        }
      `;

      const brightFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        uniform float bloomThreshold;
        in vec2 vUv;
        out vec4 fragColor;

        void main() {
          vec4 color = texture(inputTexture, vUv);
          float luminance = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
          float knee = 0.1;
          float soft = luminance - bloomThreshold + knee;
          soft = clamp(soft, 0.0, 2.0 * knee);
          soft = (soft * soft) / (4.0 * knee + 0.00001);
          float contribution = max(soft, luminance - bloomThreshold);
          contribution /= max(luminance, 0.00001);
          fragColor = vec4(color.rgb * contribution, color.a);
        }
      `;

      const blur13ShaderChunk = `
        vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
          vec2 resolution = vec2(textureSize(image, 0));
          vec4 color = vec4(0.0);
          vec2 off1 = vec2(1.411764705882353) * direction;
          vec2 off2 = vec2(3.2941176470588234) * direction;
          vec2 off3 = vec2(5.176470588235294) * direction;
          color += texture(image, uv) * 0.1964825501511404;
          color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
          color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
          color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
          color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
          color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
          color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
          return color;
        }
      `;

      const blurFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        uniform vec2 direction;
        in vec2 vUv;
        out vec4 color;
        ${blur13ShaderChunk}
        void main() {
          color = blur13(inputTexture, vUv, direction);
        }
      `;

      const finalFragmentShader = `
        precision highp float;
        uniform vec2 resolution;
        uniform sampler2D inputTexture;
        uniform sampler2D blur0Texture;
        uniform sampler2D blur1Texture;
        uniform sampler2D blur2Texture;
        uniform sampler2D blur3Texture;
        uniform sampler2D blur4Texture;
        uniform bool bloomEnabled;
        uniform float bloomStrength;
        uniform float vignetteBoost;
        uniform float vignetteReduction;
        uniform float noiseIntensity;
        uniform float time;
        in vec2 vUv;
        out vec4 fragColor;

        float vignette(vec2 uv, float boost, float reduction) {
          vec2 position = vUv - 0.5;
          return boost - length(position) * reduction;
        }

        float hash1(uint n) {
          n = (n << 13U) ^ n;
          n = n * (n * n * 15731U + 789221U) + 1376312589U;
          return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
        }

        float noise(in vec2 uv, in float timeVal) {
          uvec2 p = uvec2(uv);
          return hash1(p.x + 1920U * p.y + (1920U * 1080U) * uint(timeVal));
        }

        void main() {
          vec4 color = texture(inputTexture, vUv);

          if (bloomEnabled && bloomStrength > 0.001) {
            vec4 b0 = texture(blur0Texture, vUv);
            vec4 b1 = texture(blur1Texture, vUv);
            vec4 b2 = texture(blur2Texture, vUv);
            vec4 b3 = texture(blur3Texture, vUv);
            vec4 b4 = texture(blur4Texture, vUv);

            vec4 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
            color += bloomSum * bloomStrength;
          }

          color.rgb *= vignette(vUv, vignetteBoost, vignetteReduction);
          color.rgb += noiseIntensity * noise(gl_FragCoord.xy, time);
          fragColor = vec4(color.rgb, 1.0);
        }
      `;

      const chromaticAberrationShaderChunk = `
        vec2 barrelDistortion(vec2 coord, float amt) {
          vec2 cc = coord - 0.5;
          float dist = dot(cc, cc);
          return coord + cc * dist * amt;
        }
        float sat(float t) { return clamp(t, 0.0, 1.0); }
        float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
        float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
        vec4 spectrum_offset(float t) {
          float lo = step(t, 0.5);
          float hi = 1.0 - lo;
          float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
          vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
          return pow(ret, vec4(1.0 / 2.2));
        }
        const float max_distort = 2.2;
        const int num_iter = 8;
        const float reci_num_iter_f = 1.0 / float(num_iter);
        vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
          vec4 sumcol = vec4(0.0);
          vec4 sumw = vec4(0.0);
          for (int i = 0; i < num_iter; ++i) {
            float t = float(i) * reci_num_iter_f;
            vec4 w = spectrum_offset(t);
            sumw += w;
            sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
          }
          return sumcol / sumw;
        }
      `;

      const colorFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        uniform float chromaticAberrationAmount;
        uniform float minInputLevel;
        uniform float maxInputLevel;
        uniform float gammaLevel;
        uniform float fisheyeStrength;
        uniform float fisheyeRadius;
        uniform float time;
        in vec2 vUv;
        out vec4 fragColor;

        ${chromaticAberrationShaderChunk}

        vec2 applyFisheye(vec2 uv, float strength, float radius) {
          if (abs(strength) < 0.0001) return uv;
          vec2 p = uv - 0.5;
          float d = length(p);
          if (d > radius * 1.5) return uv;
          float r = d / max(radius, 0.001);
          float theta = atan(p.y, p.x);
          float rDist = r + strength * (r * r * r);
          return 0.5 + vec2(cos(theta), sin(theta)) * (rDist * radius);
        }

        vec3 gammaCorrect(vec3 color, vec3 gamma) {
          return pow(max(color, vec3(0.0)), 1.0 / gamma);
        }
        vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
          return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
        }
        vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
          return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
        }

        void main() {
          vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
          if (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) {
            fragColor = vec4(0.0, 0.0, 0.0, 1.0);
            return;
          }
          fragColor = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
          fragColor.rgb = finalLevels(fragColor.rgb, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
          fragColor.a = 1.0;
        }
      `;

      const copyFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        in vec2 vUv;
        out vec4 fragColor;
        void main() {
          fragColor = texture(inputTexture, vUv);
        }
      `;

      function createFBO(w, h, options = {}) {
        return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
          wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
          wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
          minFilter: options.minFilter || THREE.LinearFilter,
          magFilter: options.magFilter || THREE.LinearFilter,
          format: options.format || THREE.RGBAFormat,
          type: options.type || THREE.HalfFloatType,
          stencilBuffer: options.stencilBuffer || false,
          depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : true,
          samples: options.samples || 0,
        });
      }

      class ShaderPass {
        constructor(shader, options = {}) {
          this.shader = shader;
          this.orthoScene = new THREE.Scene();
          this.fbo = createFBO(1, 1, options);
          this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
          this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
          this.orthoScene.add(this.orthoQuad);
          this.texture = this.fbo.texture;
        }
        render(renderer, toScreen = false) {
          if (!toScreen) {
            renderer.setRenderTarget(this.fbo);
          }
          renderer.render(this.orthoScene, this.orthoCamera);
          if (!toScreen) {
            renderer.setRenderTarget(null);
          }
        }
        setSize(width, height) {
          this.fbo.setSize(Math.max(1, width), Math.max(1, height));
          this.orthoQuad.scale.set(width, height, 1);
        }
      }

      class ShaderPingPongPass {
        constructor(shader, options = {}) {
          this.shader = shader;
          this.orthoScene = new THREE.Scene();
          this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
          this.currentFBO = 0;
          this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
          this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
          this.orthoScene.add(this.orthoQuad);
        }
        render(renderer) {
          renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
          renderer.render(this.orthoScene, this.orthoCamera);
          renderer.setRenderTarget(null);
          this.currentFBO = 1 - this.currentFBO;
        }
        get current() {
          return this.fbos[this.currentFBO];
        }
        get texture() {
          return this.current.texture;
        }
        setSize(width, height) {
          const w = Math.max(1, width);
          const h = Math.max(1, height);
          this.orthoQuad.scale.set(w, h, 1);
          this.fbos[0].setSize(w, h);
          this.fbos[1].setSize(w, h);
        }
      }

      class BloomPass {
        constructor(strength = 0.8, radius = 0.5, threshold = 0.2, levels = 5) {
          this.strength = strength;
          this.radius = radius;
          this.threshold = threshold;
          this.enabled = true;
          this.levels = levels;

          this.brightShader = new THREE.RawShaderMaterial({
            uniforms: {
              inputTexture: { value: null },
              bloomThreshold: { value: this.threshold },
            },
            vertexShader: orthoVertexShader,
            fragmentShader: brightFragmentShader,
            glslVersion: THREE.GLSL3,
          });
          this.brightPass = new ShaderPass(this.brightShader, {
            format: THREE.RGBAFormat,
            type: THREE.HalfFloatType,
          });

          this.blurShader = new THREE.RawShaderMaterial({
            uniforms: {
              inputTexture: { value: null },
              direction: { value: new THREE.Vector2(0, 1) },
            },
            vertexShader: orthoVertexShader,
            fragmentShader: blurFragmentShader,
            glslVersion: THREE.GLSL3,
          });

          this.blurPasses = [];
          for (let i = 0; i < this.levels; i++) {
            this.blurPasses.push(
              new ShaderPingPongPass(this.blurShader, {
                format: THREE.RGBAFormat,
                type: THREE.HalfFloatType,
              })
            );
          }
        }

        setSize(w, h) {
          let tw = Math.max(1, w);
          let th = Math.max(1, h);
          this.brightPass.setSize(tw, th);
          for (let i = 0; i < this.levels; i++) {
            tw = Math.max(1, Math.round(tw / 2));
            th = Math.max(1, Math.round(th / 2));
            this.blurPasses[i].setSize(tw, th);
          }
        }

        set source(texture) {
          this.brightShader.uniforms.inputTexture.value = texture;
        }

        render(renderer) {
          if (!this.enabled || this.strength <= 0.001) return;

          this.brightShader.uniforms.bloomThreshold.value = this.threshold;
          this.brightPass.render(renderer);

          const baseOffset = Math.max(0.1, this.radius * 2.0);
          const u = this.blurShader.uniforms;

          for (let j = 0; j < this.levels; j++) {
            const blurPass = this.blurPasses[j];
            const stepOffset = baseOffset * (1.0 + j * 0.5);

            u.direction.value.set(stepOffset, 0);
            u.inputTexture.value = j === 0 ? this.brightPass.texture : this.blurPasses[j - 1].texture;
            blurPass.render(renderer);

            u.direction.value.set(0, stepOffset * 0.5);
            u.inputTexture.value = blurPass.current.texture;
            blurPass.render(renderer);
          }
        }
      }

      class PostProcessor {
        constructor(renderer, params = {}) {
          this.renderer = renderer;

          this.settings = {
            enabled: params.enabled !== undefined ? params.enabled : false,
            bloomEnabled: params.bloomEnabled !== undefined ? params.bloomEnabled : true,
            bloomStrength: params.bloomStrength !== undefined ? params.bloomStrength : 1.2,
            bloomRadius: params.bloomRadius !== undefined ? params.bloomRadius : 0.6,
            bloomThreshold: params.bloomThreshold !== undefined ? params.bloomThreshold : 0.15,
            fisheyeStrength: params.fisheyeStrength !== undefined ? params.fisheyeStrength : 0.0,
            fisheyeRadius: params.fisheyeRadius !== undefined ? params.fisheyeRadius : 1.0,
            chromaticAberration: params.chromaticAberration !== undefined ? params.chromaticAberration : 0.04,
            vignetteBoost: params.vignetteBoost !== undefined ? params.vignetteBoost : 1.0,
            vignetteReduction: params.vignetteReduction !== undefined ? params.vignetteReduction : 0.5,
            noiseIntensity: params.noiseIntensity !== undefined ? params.noiseIntensity : 0.02,
            gamma: params.gamma !== undefined ? params.gamma : 1.0,
            minInputLevel: params.minInputLevel !== undefined ? params.minInputLevel : 0.0,
            maxInputLevel: params.maxInputLevel !== undefined ? params.maxInputLevel : 1.0,
          };

          this.sceneTarget = createFBO(1, 1, { type: THREE.HalfFloatType });

          this.bloomPass = new BloomPass(
            this.settings.bloomStrength,
            this.settings.bloomRadius,
            this.settings.bloomThreshold,
            5
          );

          this.finalShader = new THREE.RawShaderMaterial({
            uniforms: {
              resolution: { value: new THREE.Vector2(1, 1) },
              bloomEnabled: { value: this.settings.bloomEnabled },
              bloomStrength: { value: this.settings.bloomStrength },
              vignetteBoost: { value: this.settings.vignetteBoost },
              vignetteReduction: { value: this.settings.vignetteReduction },
              noiseIntensity: { value: this.settings.noiseIntensity },
              inputTexture: { value: null },
              blur0Texture: { value: null },
              blur1Texture: { value: null },
              blur2Texture: { value: null },
              blur3Texture: { value: null },
              blur4Texture: { value: null },
              time: { value: 0 },
            },
            vertexShader: orthoVertexShader,
            fragmentShader: finalFragmentShader,
            glslVersion: THREE.GLSL3,
          });
          this.finalPass = new ShaderPass(this.finalShader);

          this.rgbShader = new THREE.RawShaderMaterial({
            uniforms: {
              inputTexture: { value: this.finalPass.texture },
              fisheyeStrength: { value: this.settings.fisheyeStrength },
              fisheyeRadius: { value: this.settings.fisheyeRadius },
              chromaticAberrationAmount: { value: this.settings.chromaticAberration },
              minInputLevel: { value: this.settings.minInputLevel },
              maxInputLevel: { value: this.settings.maxInputLevel },
              gammaLevel: { value: this.settings.gamma },
              time: { value: 0 },
            },
            vertexShader: orthoVertexShader,
            fragmentShader: colorFragmentShader,
            glslVersion: THREE.GLSL3,
          });
          this.rgbPass = new ShaderPass(this.rgbShader);

          this.copyShader = new THREE.RawShaderMaterial({
            uniforms: {
              inputTexture: { value: null },
            },
            vertexShader: orthoVertexShader,
            fragmentShader: copyFragmentShader,
            glslVersion: THREE.GLSL3,
          });
          this.copyPass = new ShaderPass(this.copyShader);
        }

        updateSettings() {
          this.bloomPass.enabled = this.settings.bloomEnabled;
          this.bloomPass.strength = this.settings.bloomStrength;
          this.bloomPass.radius = this.settings.bloomRadius;
          this.bloomPass.threshold = this.settings.bloomThreshold;

          this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
          this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
          this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
          this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
          this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;

          this.rgbShader.uniforms.fisheyeStrength.value = this.settings.fisheyeStrength;
          this.rgbShader.uniforms.fisheyeRadius.value = this.settings.fisheyeRadius;
          this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
          this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
          this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
          this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
        }

        setSize(w0, h0, dpr = 1) {
          const w = Math.max(1, Math.floor(w0 * dpr));
          const h = Math.max(1, Math.floor(h0 * dpr));
          this.sceneTarget.setSize(w, h);
          this.finalPass.setSize(w, h);
          this.finalShader.uniforms.resolution.value.set(w, h);
          this.bloomPass.setSize(w, h);
          this.rgbPass.setSize(w, h);
          this.copyPass.setSize(w, h);
        }

        renderScene(scene, camera) {
          if (!this.settings.enabled) {
            this.renderer.render(scene, camera);
            return;
          }
          this.renderer.setRenderTarget(this.sceneTarget);
          this.renderer.render(scene, camera);
          this.renderer.setRenderTarget(null);
          this.render(this.sceneTarget.texture);
        }

        render(sourceTexture) {
          if (!this.settings.enabled) {
            this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
            this.copyPass.render(this.renderer, true);
            return;
          }

          this.updateSettings();

          this.bloomPass.source = sourceTexture;
          this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
          this.bloomPass.render(this.renderer);

          this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
          this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
          this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
          this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
          this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

          const randomTime = Math.random() * 100000;
          this.finalPass.shader.uniforms.time.value = randomTime;
          this.rgbPass.shader.uniforms.time.value = randomTime;

          this.finalPass.render(this.renderer);
          this.rgbPass.render(this.renderer, true);
        }

        attachGUI(gui, title = 'Post-Processing & Fisheye') {
          const root = gui.addFolder(title);
          root.add(this.settings, 'enabled').name('Enable Post-Processing');

          const bloom = root.addFolder('Bloom');
          bloom
            .add(this.settings, 'bloomEnabled')
            .name('Enable Bloom')
            .onChange(() => this.updateSettings());
          bloom
            .add(this.settings, 'bloomStrength', 0, 3.0, 0.05)
            .name('Strength')
            .onChange(() => this.updateSettings());
          bloom
            .add(this.settings, 'bloomRadius', 0, 2.0, 0.05)
            .name('Radius')
            .onChange(() => this.updateSettings());
          bloom
            .add(this.settings, 'bloomThreshold', 0, 1.0, 0.01)
            .name('Threshold')
            .onChange(() => this.updateSettings());

          const lens = root.addFolder('Lens, Optics & Fisheye');
          lens
            .add(this.settings, 'fisheyeStrength', -1.0, 1.5, 0.01)
            .name('Fisheye Distortion')
            .onChange(() => this.updateSettings());
          lens
            .add(this.settings, 'fisheyeRadius', 0.2, 2.0, 0.05)
            .name('Fisheye Radius')
            .onChange(() => this.updateSettings());
          lens
            .add(this.settings, 'chromaticAberration', 0, 0.2, 0.005)
            .name('Chromatic Aberration')
            .onChange(() => this.updateSettings());
          lens
            .add(this.settings, 'vignetteBoost', 0, 2.0, 0.05)
            .name('Vignette Boost')
            .onChange(() => this.updateSettings());
          lens
            .add(this.settings, 'vignetteReduction', 0, 2.0, 0.05)
            .name('Vignette Falloff')
            .onChange(() => this.updateSettings());
          lens
            .add(this.settings, 'noiseIntensity', 0, 0.1, 0.005)
            .name('Film Grain')
            .onChange(() => this.updateSettings());
          lens
            .add(this.settings, 'gamma', 0.2, 2.0, 0.05)
            .name('Gamma')
            .onChange(() => this.updateSettings());
          lens
            .add(this.settings, 'minInputLevel', 0, 0.5, 0.01)
            .name('Black Level')
            .onChange(() => this.updateSettings());
          lens
            .add(this.settings, 'maxInputLevel', 0.5, 1.0, 0.01)
            .name('White Level')
            .onChange(() => this.updateSettings());

          return root;
        }
      }

      // =========================================================================================
      // 5 CURATED PRESET COLOR SCHEMES
      // =========================================================================================
      const COLOR_PALETTES = {
        'Cyberpunk Neon': {

          colorLine: '#162438',
          colorSignal1: '#00f0ff',
          colorSignal2: '#ff0077',

        'Quantum Matrix': {

        'Deep Space Aurora': {
          colorBg: '#06030e',
          colorLine: '#1e1338',
          colorSignal1: '#b026ff',
          colorSignal2: '#00ffd5',
          colorSignal3: '#ff00a0',
          colorSignal4: '#38bdf8',
          colorSignal5: '#ff77e9',
        },
        'Hyperdrive Monochrome': {
          colorBg: '#030305',
          colorLine: '#222831',
          colorSignal1: '#f0f6fc',
          colorSignal2: '#a5f3fc',
          colorSignal3: '#cbd5e1',
          colorSignal4: '#60a5fa',
          colorSignal5: '#ffffff',
        },
      };

      // =========================================================================================
      // SCENE CONFIGURATION & PARAMETERS
      // =========================================================================================
      const params = {
        // Presets & Modes
        theme: 'Cyberpunk Neon',
        animationPreset: 'Static Tunnel View',
        clickToRandomize: true,

        // Colors
        colorBg: COLOR_PALETTES['Cyberpunk Neon'].colorBg,
        greenScreen: false,
        colorLine: COLOR_PALETTES['Cyberpunk Neon'].colorLine,
        colorSignal1: COLOR_PALETTES['Cyberpunk Neon'].colorSignal1,
        colorSignal2: COLOR_PALETTES['Cyberpunk Neon'].colorSignal2,
        colorSignal3: COLOR_PALETTES['Cyberpunk Neon'].colorSignal3,
        colorSignal4: COLOR_PALETTES['Cyberpunk Neon'].colorSignal4,
        colorSignal5: COLOR_PALETTES['Cyberpunk Neon'].colorSignal5,

        // Geometry & Layout
        lineCount: 110,
        spreadHeight: 36.0,
        spreadDepth: 36.0,
        bundleRadius: 16.0,
        curveLength: 60.0,
        straightLength: 120.0,
        curvePower: 0.85,
        twistAmount: 0.0,
        positionX: 0.0,
        positionY: 0.0,
        positionZ: 0.0,
        rotationZ: 0.0,

        // Wave Dynamics
        waveSpeed: 2.2,
        waveHeight: 0.28,
        lineOpacity: 0.55,

        // Data Signals
        signalCount: 130,
        speedGlobal: 0.65,
        trailLength: 16,
        signalBrightness: 1.6,

        // System & Display
        dpr: 1.0,
        timeScale: 1.0,

        // Camera Cartesian Coordinates
        camPosX: -28.0,
        camPosY: 2.2,
        camPosZ: 4.8,
        targetX: 35.0,
        targetY: 0.0,
        targetZ: 0.0,
        fov: 65.0,

        // Camera Spherical Coordinates
        polarAngle: 85.0,
        azimuthAngle: -95.0,
        camDistance: 63.2,

        // Mouse & Orbit Interaction
        rotateSpeed: 1.0,
        panSpeed: 1.0,
        zoomSpeed: 1.0,
        dampingFactor: 0.05,
        enableRotate: true,
        enablePan: true,
        enableZoom: true,
        autoRotate: false,
        autoRotateSpeed: 1.0,
      };

      // Center initial content group
      params.positionX = (params.curveLength - params.straightLength) / 2;

      const CONSTANTS = {
        segmentCount: 160,
      };

      // =========================================================================================
      // THREE.JS SETUP & SCENE GRAPH
      // =========================================================================================
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(params.colorBg);
      scene.fog = new THREE.FogExp2(params.colorBg, 0.0035);

      const perspectiveCamera = new THREE.PerspectiveCamera(
        params.fov,
        window.innerWidth / window.innerHeight,
        0.1,
        1500
      );
      perspectiveCamera.position.set(params.camPosX, params.camPosY, params.camPosZ);

      const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(params.dpr);
      document.body.appendChild(renderer.domElement);

      const controls = new OrbitControls(perspectiveCamera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = params.dampingFactor;
      controls.rotateSpeed = params.rotateSpeed;
      controls.panSpeed = params.panSpeed;
      controls.zoomSpeed = params.zoomSpeed;
      controls.enableRotate = params.enableRotate;
      controls.enablePan = params.enablePan;
      controls.enableZoom = params.enableZoom;
      controls.autoRotate = params.autoRotate;
      controls.autoRotateSpeed = params.autoRotateSpeed;
      controls.target.set(params.targetX, params.targetY, params.targetZ);
      perspectiveCamera.lookAt(controls.target);
      controls.update();
      perspectiveCamera.updateMatrixWorld(true);

      // Post-Processing Instance (default disabled)
      const postProcessor = new PostProcessor(renderer, {
        enabled: false,
        bloomEnabled: true,
        bloomStrength: 1.25,
        bloomRadius: 0.65,
        bloomThreshold: 0.12,
        fisheyeStrength: 0.0,
        fisheyeRadius: 1.0,
        chromaticAberration: 0.035,
        vignetteBoost: 1.15,
        vignetteReduction: 0.75,
        noiseIntensity: 0.02,
        gamma: 1.0,
      });

      // Shader Uniforms container for camera parameters
      const shaderUniforms = {
        uCameraPos: { value: new THREE.Vector3() },
        uCameraWorldMatrix: { value: new THREE.Matrix4() },
        uFov: { value: params.fov },
        iTime: { value: 0.0 },
        iResolution: { value: new THREE.Vector3() },
      };

      const contentGroup = new THREE.Group();
      contentGroup.position.set(params.positionX, params.positionY, params.positionZ);
      contentGroup.rotation.z = THREE.MathUtils.degToRad(params.rotationZ);
      scene.add(contentGroup);

      // Background & Colors Update
      function setBackgroundColor(value) {
        document.body.style.backgroundColor = value;
        scene.background.set(value);
        if (scene.fog) scene.fog.color.set(value);
        renderer.setClearColor(value, 1);
      }

      function setGreenScreen(enabled) {
        params.greenScreen = enabled;
        const color = enabled ? '#00ff00' : params.colorBg;
        if (enabled) {
          scene.fog = null;
        } else {
          scene.fog = new THREE.FogExp2(params.colorBg, 0.0035);
        }
        setBackgroundColor(color);
      }

      // =========================================================================================
      // 3D CURVE PATH GENERATION
      // =========================================================================================
      function getPathPoint(t, lineIndex, time) {
        const totalLen = params.curveLength + params.straightLength;
        const currentX = -params.curveLength + t * totalLen;
        let y = 0;
        let z = 0;

        const normIndex = lineIndex / Math.max(1, params.lineCount);
        const spreadFactor = (normIndex - 0.5) * 2;
        const radialAngle = normIndex * Math.PI * 2 + currentX * params.twistAmount * 0.02;

        const radialY = Math.sin(radialAngle) * params.bundleRadius;
        const radialZ = Math.cos(radialAngle) * params.bundleRadius;

        if (currentX < 0) {
          const ratio = (currentX + params.curveLength) / Math.max(0.001, params.curveLength);
          let shapeFactor = (Math.cos(ratio * Math.PI) + 1) / 2;
          shapeFactor = Math.pow(Math.max(0, shapeFactor), params.curvePower);

          y = (spreadFactor * params.spreadHeight + radialY) * shapeFactor;
          z = (spreadFactor * params.spreadDepth + radialZ) * shapeFactor;

          const waveFactor = shapeFactor;
          const wave1 =
            Math.sin(time * params.waveSpeed + currentX * 0.12 + lineIndex * 0.28) *
            params.waveHeight *
            waveFactor;
          const wave2 =
            Math.cos(time * params.waveSpeed * 0.75 + currentX * 0.09 + lineIndex * 0.42) *
            (params.waveHeight * 0.6) *
            waveFactor;
          y += wave1;
          z += wave2;
        } else {
          const straightRatio = Math.min(1.0, currentX / (params.straightLength * 0.35));
          const bundleCompression = 1.0 - straightRatio * 0.65;
          y = radialY * 0.18 * bundleCompression;
          z = radialZ * 0.18 * bundleCompression;

          const microWave =
            Math.sin(time * params.waveSpeed * 1.4 + currentX * 0.14 + lineIndex * 0.2) *
            (params.waveHeight * 0.06);
          y += microWave;
        }

        return new THREE.Vector3(currentX, y, z);
      }

      // =========================================================================================
      // LINES & DATA SIGNALS MANAGEMENT
      // =========================================================================================
      let backgroundLines = [];
      let signals = [];

      const bgMaterial = new THREE.LineBasicMaterial({
        color: params.colorLine,
        transparent: true,
        opacity: params.lineOpacity,
        depthWrite: false,
      });

      const signalMaterial = new THREE.LineBasicMaterial({
        vertexColors: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        depthTest: false,
        transparent: true,
      });

      const signalColors = [
        new THREE.Color(params.colorSignal1),
        new THREE.Color(params.colorSignal2),
        new THREE.Color(params.colorSignal3),
        new THREE.Color(params.colorSignal4),
        new THREE.Color(params.colorSignal5),
      ];

      function updateSignalColorObjects() {
        signalColors[0].set(params.colorSignal1);
        signalColors[1].set(params.colorSignal2);
        signalColors[2].set(params.colorSignal3);
        signalColors[3].set(params.colorSignal4);
        signalColors[4].set(params.colorSignal5);
      }

      function pickSignalColor() {
        return signalColors[Math.floor(Math.random() * signalColors.length)];
      }

      function rebuildLines() {
        backgroundLines.forEach((line) => {
          contentGroup.remove(line);
          line.geometry.dispose();
        });
        backgroundLines = [];

        for (let i = 0; i < params.lineCount; i++) {
          const geometry = new THREE.BufferGeometry();
          const positions = new Float32Array(CONSTANTS.segmentCount * 3);
          geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

          const line = new THREE.Line(geometry, bgMaterial);
          line.userData = { id: i };
          line.renderOrder = 0;
          contentGroup.add(line);
          backgroundLines.push(line);
        }

        rebuildSignals();
      }

      function rebuildSignals() {
        signals.forEach((signal) => {
          contentGroup.remove(signal.mesh);
          signal.mesh.geometry.dispose();
        });
        signals = [];

        for (let i = 0; i < params.signalCount; i++) {
          createSignal();
        }
      }

      function createSignal() {
        const maxTrail = 140;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(maxTrail * 3);
        const colors = new Float32Array(maxTrail * 3);

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const mesh = new THREE.Line(geometry, signalMaterial);
        mesh.frustumCulled = false;
        mesh.renderOrder = 1;
        contentGroup.add(mesh);

        signals.push({
          mesh,
          laneIndex: Math.floor(Math.random() * params.lineCount),
          speed: 0.35 + Math.random() * 0.85,
          progress: Math.random(),
          history: [],
          assignedColor: pickSignalColor(),
        });
      }

      rebuildLines();

      // =========================================================================================
      // PALETTE & PRESET MANAGEMENT
      // =========================================================================================
      function applyPalette(paletteName) {
        if (!COLOR_PALETTES[paletteName]) return;
        const pal = COLOR_PALETTES[paletteName];
        params.theme = paletteName;
        params.colorBg = pal.colorBg;
        params.colorLine = pal.colorLine;
        params.colorSignal1 = pal.colorSignal1;
        params.colorSignal2 = pal.colorSignal2;
        params.colorSignal3 = pal.colorSignal3;
        params.colorSignal4 = pal.colorSignal4;
        params.colorSignal5 = pal.colorSignal5;

        if (!params.greenScreen) {
          setBackgroundColor(params.colorBg);
        }
        bgMaterial.color.set(params.colorLine);
        updateSignalColorObjects();

        signals.forEach((s) => {
          s.assignedColor = pickSignalColor();
        });

        if (gui) {
          gui.controllersRecursive().forEach((c) => c.updateDisplay());
        }
      }

      // =========================================================================================
      // PROCEDURAL RANDOMIZER (Click Scene to Randomize)
      // =========================================================================================
      function randomRange(min, max) {
        return min + Math.random() * (max - min);
      }

      function randomChoice(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
      }

      function hslToHex(h, s, l) {
        const c = new THREE.Color();
        c.setHSL(h % 1.0, s, l);
        return '#' + c.getHexString();
      }

      function randomizeScene() {
        // Geometric Parameters
        params.lineCount = Math.floor(randomRange(60, 180));
        params.spreadHeight = parseFloat(randomRange(18.0, 55.0).toFixed(1));
        params.spreadDepth = parseFloat(randomRange(10.0, 55.0).toFixed(1));
        params.bundleRadius = parseFloat(randomRange(8.0, 30.0).toFixed(1));
        params.curveLength = parseFloat(randomRange(35.0, 95.0).toFixed(1));
        params.straightLength = parseFloat(randomRange(60.0, 180.0).toFixed(1));
        params.curvePower = parseFloat(randomRange(0.4, 1.8).toFixed(2));
        params.twistAmount = parseFloat(randomRange(-2.5, 2.5).toFixed(2));
        params.positionX = (params.curveLength - params.straightLength) / 2;
        contentGroup.position.x = params.positionX;

        // Motion Parameters
        params.waveSpeed = parseFloat(randomRange(1.2, 3.8).toFixed(2));
        params.waveHeight = parseFloat(randomRange(0.1, 0.6).toFixed(2));
        params.lineOpacity = parseFloat(randomRange(0.35, 0.75).toFixed(2));
        params.signalCount = Math.floor(randomRange(80, 200));
        params.speedGlobal = parseFloat(randomRange(0.4, 1.2).toFixed(2));
        params.trailLength = Math.floor(randomRange(10, 35));
        params.signalBrightness = parseFloat(randomRange(1.2, 2.4).toFixed(1));

        // Harmonic Color Scheme Generation
        const baseHue = Math.random();
        const compHue = (baseHue + 0.5) % 1.0;
        const triHue1 = (baseHue + 0.33) % 1.0;
        const triHue2 = (baseHue + 0.66) % 1.0;

        params.colorBg = hslToHex(baseHue, 0.5, 0.03);
        params.colorLine = hslToHex(baseHue, 0.45, 0.16);
        params.colorSignal1 = hslToHex(baseHue, 1.0, 0.58);
        params.colorSignal2 = hslToHex(compHue, 1.0, 0.55);
        params.colorSignal3 = hslToHex(triHue1, 1.0, 0.62);
        params.colorSignal4 = hslToHex(triHue2, 0.95, 0.65);
        params.colorSignal5 = '#ffffff';

        if (!params.greenScreen) {
          setBackgroundColor(params.colorBg);
        }
        bgMaterial.color.set(params.colorLine);
        bgMaterial.opacity = params.lineOpacity;
        updateSignalColorObjects();

        rebuildLines();

        if (gui) {
          gui.controllersRecursive().forEach((c) => c.updateDisplay());
        }
      }

      // Pointer Tracking for Click vs Drag
      let pointerDownPos = { x: 0, y: 0 };
      let pointerDownTime = 0;

      window.addEventListener('pointerdown', (e) => {
        if (e.target.closest('.lil-gui')) return;
        pointerDownPos.x = e.clientX;
        pointerDownPos.y = e.clientY;
        pointerDownTime = Date.now();
      });

      window.addEventListener('pointerup', (e) => {
        if (e.target.closest('.lil-gui')) return;
        const dx = e.clientX - pointerDownPos.x;
        const dy = e.clientY - pointerDownPos.y;
        const dist = Math.hypot(dx, dy);
        const dt = Date.now() - pointerDownTime;

        if (dist < 6 && dt < 300 && params.clickToRandomize) {
          randomizeScene();
        }
      });

      // =========================================================================================
      // CAMERA SYNCHRONIZATION HELPERS
      // =========================================================================================
      function updateCameraFromAngles() {
        const r = params.camDistance;
        const phi = THREE.MathUtils.degToRad(params.polarAngle);
        const theta = THREE.MathUtils.degToRad(params.azimuthAngle);

        perspectiveCamera.position.x = params.targetX + r * Math.sin(phi) * Math.sin(theta);
        perspectiveCamera.position.y = params.targetY + r * Math.cos(phi);
        perspectiveCamera.position.z = params.targetZ + r * Math.sin(phi) * Math.cos(theta);

        controls.target.set(params.targetX, params.targetY, params.targetZ);
        perspectiveCamera.lookAt(controls.target);
        controls.update();
        perspectiveCamera.updateMatrixWorld(true);

        params.camPosX = perspectiveCamera.position.x;
        params.camPosY = perspectiveCamera.position.y;
        params.camPosZ = perspectiveCamera.position.z;
      }

      function updateCameraFromPosition() {
        perspectiveCamera.position.set(params.camPosX, params.camPosY, params.camPosZ);
        controls.target.set(params.targetX, params.targetY, params.targetZ);
        perspectiveCamera.lookAt(controls.target);
        controls.update();
        perspectiveCamera.updateMatrixWorld(true);

        const offset = new THREE.Vector3().subVectors(perspectiveCamera.position, controls.target);
        params.camDistance = parseFloat(offset.length().toFixed(2));
        params.polarAngle = parseFloat(THREE.MathUtils.radToDeg(controls.getPolarAngle()).toFixed(2));
        params.azimuthAngle = parseFloat(THREE.MathUtils.radToDeg(controls.getAzimuthalAngle()).toFixed(2));
      }

      function resetCameraView() {
        params.camPosX = -28.0;
        params.camPosY = 2.2;
        params.camPosZ = 4.8;
        params.targetX = 35.0;
        params.targetY = 0.0;
        params.targetZ = 0.0;
        params.fov = 65.0;
        perspectiveCamera.fov = 65.0;
        perspectiveCamera.updateProjectionMatrix();
        updateCameraFromPosition();
      }

      // =========================================================================================
      // GUI SETUP (LIL-GUI)
      // =========================================================================================
      const gui = new GUI({ title: 'Data Lines Settings' });

      // Folder 1: Presets & Themes
      const fPresets = gui.addFolder('Presets & Themes');
      fPresets
        .add(params, 'theme', Object.keys(COLOR_PALETTES))
        .name('Color Theme')
        .onChange((val) => applyPalette(val));
      fPresets
        .add(params, 'animationPreset', [
          'Static Tunnel View',
          'Tunnel Fly-Through',
          'Sunburst Fan Orbit',
          'Helix Corkscrew Drift',
          'Horizon Glide',
        ])
        .name('Camera Animation');
      fPresets.add(params, 'clickToRandomize').name('Click To Randomize');

      // Folder 2: Colors
      const fColors = gui.addFolder('Colors');
      fColors
        .addColor(params, 'colorBg')
        .name('Background')
        .onChange((value) => {
          if (!params.greenScreen) setBackgroundColor(value);
        });
      fColors.add(params, 'greenScreen').name('Green Screen (#00ff00)').onChange(setGreenScreen);
      fColors
        .addColor(params, 'colorLine')
        .name('Fiber Lines')
        .onChange((value) => bgMaterial.color.set(value));

      const fSignalColors = fColors.addFolder('Signal Colors');
      fSignalColors
        .addColor(params, 'colorSignal1')
        .name('Signal Color 1')
        .onChange(() => {
          updateSignalColorObjects();
          rebuildSignals();
        });
      fSignalColors
        .addColor(params, 'colorSignal2')
        .name('Signal Color 2')
        .onChange(() => {
          updateSignalColorObjects();
          rebuildSignals();
        });
      fSignalColors
        .addColor(params, 'colorSignal3')
        .name('Signal Color 3')
        .onChange(() => {
          updateSignalColorObjects();
          rebuildSignals();
        });
      fSignalColors
        .addColor(params, 'colorSignal4')
        .name('Signal Color 4')
        .onChange(() => {
          updateSignalColorObjects();
          rebuildSignals();
        });
      fSignalColors
        .addColor(params, 'colorSignal5')
        .name('Signal Color 5')
        .onChange(() => {
          updateSignalColorObjects();
          rebuildSignals();
        });

      // Folder 3: Geometry & Funnel Bundle
      const fGeo = gui.addFolder('Geometry & Funnel');
      fGeo.add(params, 'lineCount', 10, 300, 1).name('Line Count').onFinishChange(rebuildLines);
      fGeo.add(params, 'spreadHeight', 5, 120, 0.5).name('Spread Height');
      fGeo.add(params, 'spreadDepth', 0, 100, 0.5).name('Spread Depth (3D)');
      fGeo.add(params, 'bundleRadius', 0, 60, 0.5).name('Bundle 3D Radius');
      fGeo.add(params, 'curveLength', 15, 160, 1).name('Funnel Length');
      fGeo.add(params, 'straightLength', 20, 260, 1).name('Stream Length');
      fGeo.add(params, 'curvePower', 0.1, 3.0, 0.01).name('Curvature Falloff');
      fGeo.add(params, 'twistAmount', -5.0, 5.0, 0.1).name('Funnel Twist');
      fGeo
        .add(params, 'positionX', -200, 200, 1)
        .name('Origin X')
        .onChange((v) => (contentGroup.position.x = v));
      fGeo
        .add(params, 'positionY', -100, 100, 1)
        .name('Origin Y')
        .onChange((v) => (contentGroup.position.y = v));
      fGeo
        .add(params, 'positionZ', -100, 100, 1)
        .name('Origin Z')
        .onChange((v) => (contentGroup.position.z = v));
      fGeo
        .add(params, 'rotationZ', -180, 180, 1)
        .name('Rotation Z (Deg)')
        .onChange((v) => (contentGroup.rotation.z = THREE.MathUtils.degToRad(v)));

      // Folder 4: Motion & Waves
      const fWaves = gui.addFolder('Motion & Waves');
      fWaves.add(params, 'waveSpeed', 0, 6, 0.1).name('Wave Speed');
      fWaves.add(params, 'waveHeight', 0, 3, 0.02).name('Wave Height');
      fWaves
        .add(params, 'lineOpacity', 0, 1, 0.01)
        .name('Line Opacity')
        .onChange((v) => (bgMaterial.opacity = v));

      // Folder 5: Data Signals
      const fSignals = gui.addFolder('Data Signals');
      fSignals.add(params, 'signalCount', 0, 300, 1).name('Count').onFinishChange(rebuildSignals);
      fSignals.add(params, 'speedGlobal', 0, 3, 0.05).name('Signal Velocity');
      fSignals.add(params, 'trailLength', 1, 100, 1).name('Trail Length');
      fSignals.add(params, 'signalBrightness', 0.5, 3.0, 0.1).name('Luminescence');

      // Folder 6: System & Display
      const fSystem = gui.addFolder('System & Display');
      fSystem
        .add(params, 'dpr', 0.5, 2.5, 0.1)
        .name('Pixel Ratio (DPR)')
        .onChange((val) => {
          renderer.setPixelRatio(val);
          updateResolution();
        });
      fSystem.add(params, 'timeScale', 0.0, 3.0, 0.05).name('Global Speed');

      // Folder 7: Camera Placement and Lens Settings
      const fCam = gui.addFolder('Camera Placement and Lens Settings');
      fCam
        .add(params, 'camPosX', -150.0, 150.0, 0.5)
        .name('Camera Pos X')
        .listen()
        .onChange(updateCameraFromPosition);
      fCam
        .add(params, 'camPosY', -150.0, 150.0, 0.5)
        .name('Camera Pos Y')
        .listen()
        .onChange(updateCameraFromPosition);
      fCam
        .add(params, 'camPosZ', -150.0, 150.0, 0.5)
        .name('Camera Pos Z')
        .listen()
        .onChange(updateCameraFromPosition);
      fCam
        .add(params, 'polarAngle', 1.0, 179.0, 0.5)
        .name('Polar Pitch (°)')
        .listen()
        .onChange(updateCameraFromAngles);
      fCam
        .add(params, 'azimuthAngle', -180.0, 180.0, 0.5)
        .name('Azimuth Yaw (°)')
        .listen()
        .onChange(updateCameraFromAngles);
      fCam
        .add(params, 'camDistance', 1.0, 300.0, 0.5)
        .name('Camera Distance')
        .listen()
        .onChange(updateCameraFromAngles);
      fCam
        .add(params, 'targetX', -100.0, 100.0, 0.5)
        .name('Target LookAt X')
        .listen()
        .onChange(updateCameraFromPosition);
      fCam
        .add(params, 'targetY', -100.0, 100.0, 0.5)
        .name('Target LookAt Y')
        .listen()
        .onChange(updateCameraFromPosition);
      fCam
        .add(params, 'targetZ', -100.0, 100.0, 0.5)
        .name('Target LookAt Z')
        .listen()
        .onChange(updateCameraFromPosition);
      fCam
        .add(params, 'fov', 15.0, 120.0, 1.0)
        .name('FOV')
        .listen()
        .onChange((v) => {
          perspectiveCamera.fov = v;
          perspectiveCamera.updateProjectionMatrix();
          shaderUniforms.uFov.value = v;
        });

      const fMouse = fCam.addFolder('Interaction Controls');
      fMouse
        .add(params, 'rotateSpeed', 0.1, 3.0, 0.1)
        .name('Rotate Speed')
        .onChange((v) => (controls.rotateSpeed = v));
      fMouse
        .add(params, 'panSpeed', 0.1, 3.0, 0.1)
        .name('Pan Speed')
        .onChange((v) => (controls.panSpeed = v));
      fMouse
        .add(params, 'zoomSpeed', 0.1, 3.0, 0.1)
        .name('Zoom Speed')
        .onChange((v) => (controls.zoomSpeed = v));
      fMouse
        .add(params, 'dampingFactor', 0.01, 0.2, 0.01)
        .name('Damping')
        .onChange((v) => (controls.dampingFactor = v));
      fMouse
        .add(params, 'enableRotate')
        .name('Enable Rotate')
        .onChange((v) => (controls.enableRotate = v));
      fMouse
        .add(params, 'enablePan')
        .name('Enable Pan')
        .onChange((v) => (controls.enablePan = v));
      fMouse
        .add(params, 'enableZoom')
        .name('Enable Zoom')
        .onChange((v) => (controls.enableZoom = v));
      fMouse
        .add(params, 'autoRotate')
        .name('Auto-Rotate')
        .onChange((v) => (controls.autoRotate = v));
      fMouse
        .add(params, 'autoRotateSpeed', -10.0, 10.0, 0.5)
        .name('Auto-Rotate Speed')
        .onChange((v) => (controls.autoRotateSpeed = v));
      fMouse.add({ reset: () => resetCameraView() }, 'reset').name('Reset Camera View');

      // Folder 8: Post-Processing & Fisheye Suite
      postProcessor.attachGUI(gui, 'Post-Processing & Fisheye');

      // GUI closed by default
      gui.close();

      // Keyboard Toggle for GUI with 'H' key
      window.addEventListener('keydown', (e) => {
        if (e.key === 'h' || e.key === 'H') {
          if (gui._hidden) {
            gui.show();
          } else {
            gui.hide();
          }
        }
      });

      // =========================================================================================
      // WINDOW RESIZE & RESOLUTION
      // =========================================================================================
      function updateResolution() {
        const width = window.innerWidth;
        const height = window.innerHeight;
        perspectiveCamera.aspect = width / height;
        perspectiveCamera.updateProjectionMatrix();
        renderer.setSize(width, height);

        const dpr = renderer.getPixelRatio();
        shaderUniforms.iResolution.value.set(width * dpr, height * dpr, 1);
        postProcessor.setSize(width, height, dpr);
      }

      window.addEventListener('resize', updateResolution);
      updateResolution();
      updateCameraFromPosition();

      // =========================================================================================
      // MAIN ANIMATION LOOP
      // =========================================================================================
      const clock = new THREE.Clock();
      let animAngle = 0;

      function animate() {
        requestAnimationFrame(animate);

        const delta = clock.getDelta();
        const elapsedTime = clock.getElapsedTime();
        shaderUniforms.iTime.value = elapsedTime;

        const time = elapsedTime * params.timeScale;

        // Camera Animation Presets
        if (params.animationPreset !== 'Static Tunnel View') {
          animAngle += delta * params.timeScale;

          if (params.animationPreset === 'Tunnel Fly-Through') {
            const tDolly = animAngle * 0.35;
            const dollyX = -32.0 + Math.sin(tDolly) * 24.0;
            perspectiveCamera.position.set(
              dollyX,
              1.8 + Math.sin(tDolly * 1.4) * 1.6,
              3.2 + Math.cos(tDolly * 1.1) * 2.0
            );
            controls.target.set(dollyX + 40.0, 0, 0);
          } else if (params.animationPreset === 'Sunburst Fan Orbit') {
            const tOrbit = animAngle * 0.22;
            const orbitR = 68.0;
            perspectiveCamera.position.set(
              -18.0 + Math.sin(tOrbit) * 22.0,
              38.0 + Math.sin(tOrbit * 1.3) * 14.0,
              Math.cos(tOrbit) * orbitR
            );
            controls.target.set(15.0, 0, 0);
          } else if (params.animationPreset === 'Helix Corkscrew Drift') {
            const tHelix = animAngle * 0.28;
            const helixR = 14.0 + Math.sin(tHelix * 0.6) * 4.5;
            const helixX = -24.0 + Math.sin(tHelix * 0.45) * 26.0;
            perspectiveCamera.position.set(
              helixX,
              Math.sin(tHelix * 1.1) * helixR,
              Math.cos(tHelix * 1.1) * helixR
            );
            controls.target.set(helixX + 32.0, Math.sin(tHelix * 0.7) * 1.5, Math.cos(tHelix * 0.7) * 1.5);
          } else if (params.animationPreset === 'Horizon Glide') {
            const tGlide = animAngle * 0.24;
            perspectiveCamera.position.set(
              -8.0 + Math.sin(tGlide * 0.7) * 16.0,
              -1.6 + Math.sin(tGlide * 1.2) * 0.7,
              8.5 + Math.cos(tGlide) * 4.5
            );
            controls.target.set(28.0, 0.4, 0);
          }
        }

        controls.update();
        perspectiveCamera.updateMatrixWorld(true);

        // Sync Perspective Camera with Shader Uniforms
        shaderUniforms.uCameraPos.value.copy(perspectiveCamera.position);
        shaderUniforms.uCameraWorldMatrix.value.copy(perspectiveCamera.matrixWorld);
        shaderUniforms.uFov.value = perspectiveCamera.fov;

        // Keep GUI sliders synchronized with real-time camera position
        const offset = new THREE.Vector3().subVectors(perspectiveCamera.position, controls.target);
        params.camDistance = parseFloat(offset.length().toFixed(2));
        params.polarAngle = parseFloat(THREE.MathUtils.radToDeg(controls.getPolarAngle()).toFixed(2));
        params.azimuthAngle = parseFloat(THREE.MathUtils.radToDeg(controls.getAzimuthalAngle()).toFixed(2));

        params.camPosX = perspectiveCamera.position.x;
        params.camPosY = perspectiveCamera.position.y;
        params.camPosZ = perspectiveCamera.position.z;
        params.targetX = controls.target.x;
        params.targetY = controls.target.y;
        params.targetZ = controls.target.z;
        params.fov = perspectiveCamera.fov;

        // Update Background Lines Geometry
        backgroundLines.forEach((line) => {
          const positions = line.geometry.attributes.position.array;
          const lineId = line.userData.id;
          for (let j = 0; j < CONSTANTS.segmentCount; j++) {
            const t = j / (CONSTANTS.segmentCount - 1);
            const vec = getPathPoint(t, lineId, time);
            positions[j * 3] = vec.x;
            positions[j * 3 + 1] = vec.y;
            positions[j * 3 + 2] = vec.z;
          }
          line.geometry.attributes.position.needsUpdate = true;
        });

        // Update Data Signals Geometry
        signals.forEach((signal) => {
          signal.progress += signal.speed * 0.005 * params.speedGlobal * params.timeScale;

          if (signal.progress > 1.0) {
            signal.progress = 0;
            signal.laneIndex = Math.floor(Math.random() * params.lineCount);
            signal.history = [];
            signal.assignedColor = pickSignalColor();
            signal.speed = 0.35 + Math.random() * 0.85;
          }

          const pos = getPathPoint(signal.progress, signal.laneIndex, time);
          signal.history.push(pos);

          if (signal.history.length > params.trailLength + 1) {
            signal.history.shift();
          }

          const positions = signal.mesh.geometry.attributes.position.array;
          const colors = signal.mesh.geometry.attributes.color.array;
          const drawCount = Math.max(1, params.trailLength);
          const currentLen = signal.history.length;
          const baseCol = signal.assignedColor;
          const bright = params.signalBrightness;

          for (let i = 0; i < drawCount; i++) {
            let index = currentLen - 1 - i;
            if (index < 0) index = 0;

            const point = signal.history[index] || pos;

            positions[i * 3] = point.x;
            positions[i * 3 + 1] = point.y;
            positions[i * 3 + 2] = point.z;

            let alpha = 1.0;
            if (params.trailLength > 0) {
              alpha = Math.pow(Math.max(0, 1 - i / params.trailLength), 1.5);
            }

            colors[i * 3] = baseCol.r * alpha * bright;
            colors[i * 3 + 1] = baseCol.g * alpha * bright;
            colors[i * 3 + 2] = baseCol.b * alpha * bright;
          }

          signal.mesh.geometry.setDrawRange(0, drawCount);
          signal.mesh.geometry.attributes.position.needsUpdate = true;
          signal.mesh.geometry.attributes.color.needsUpdate = true;
        });

        // Render Scene (with post-processing if enabled, else direct render)
        if (postProcessor.settings.enabled) {
          postProcessor.renderScene(scene, perspectiveCamera);
        } else {
          renderer.render(scene, perspectiveCamera);
        }
      }

      animate();
    </script>
  </body>
</html>
