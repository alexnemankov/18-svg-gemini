<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />

  <title>A Riot of Color - Creative Coding 615</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      color: #e6ebf2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      transition: background-color 0.4s ease;
    }

    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: padding 0.4s cubic-bezier(0.16, 1, 0.3, 1), background 0.4s ease;
    }

    canvas {
      display: block;
      cursor: grab;
      touch-action: none;
      outline: none;
      transition: box-shadow 0.4s ease, border-radius 0.4s ease;
    }

    canvas.dragging {
      cursor: grabbing !important;
    }

    /* Framed Mode (4:5 Generative Art Print) */
    body.mode-framed #canvas-container {
      padding: 32px;
      background: radial-gradient(circle at 50% 45%, rgba(255, 255, 255, 0.05), transparent 75%), #050608;
    }

    body.mode-framed canvas {
      border-radius: 8px;
      box-shadow: 
        0 25px 80px rgba(0, 0, 0, 0.9),
        0 10px 30px rgba(0, 0, 0, 0.7),
        0 0 0 1px rgba(255, 255, 255, 0.14),
        0 0 0 8px rgba(255, 255, 255, 0.02);
    }

    /* lil-gui Custom Styling - Dark Glassmorphism */
    .lil-gui.root {
      --background-color: rgba(12, 16, 24, 0.9);
      --text-color: #f1f5f9;
      --title-background-color: rgba(22, 29, 44, 0.96);
      --widget-color: rgba(30, 41, 59, 0.85);
      --hover-color: rgba(51, 65, 85, 0.9);
      --focus-color: rgba(246, 170, 28, 0.9);
      --number-color: #38bdf8;
      --string-color: #f472b6;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      --font-size: 11px;
      --folder-indent: 10px;
      
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 1000;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 14px 44px rgba(0, 0, 0, 0.75);
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .lil-gui .title {
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    body.hidden-ui .lil-gui.root {
      opacity: 0 !important;
      transform: translateY(14px);
      pointer-events: none !important;
    }
  </style>

</head>
<body>

  <script>
    /* =========================================================================
       19 PRECONFIGURED COLOR SCHEMES
       ========================================================================= */
    const COLOR_SCHEMES = {

        colors: ['#00f0ff', '#ff00aa', '#ffd700', '#00ff88', '#8b5cf6'],

      'Achromatic + Accent': {

      },
      'Neutral + accent': {

        colors: ['#1c1917', '#44403c', '#78716c', '#d6d3d1', '#f97316'],

      },
      'Palette 1 (F6AA1C, BC3908, 941B0C, F6AA1C, 220901)': {

      },
      'Palette 2 (63D1CF, 5BC0BE, 4BAD9E, 4BAD9E, 0B132B, 000000)': {

      },
      'Palette 3 (AA60C8, D69ADE, C9A3C6, CFB5C2, 0D001D, 120A12)': {

        colors: ['#AA60C8', '#D69ADE', '#C9A3C6', '#CFB5C2', '#0D001D', '#120A12'],
        blend: 1.0
      },
      'Palette 4 (FEF1BE, FFBA00, 008189, 00474D, 061210)': {
        bg: '#061210',
        colors: ['#FEF1BE', '#FFBA00', '#008189', '#00474D', '#061210'],
        blend: 1.0
      },
      'Palette 5 (D4FFB0, 7FFF00, 00B894, 0A3322, 05140A)': {
        bg: '#05140A',
        colors: ['#D4FFB0', '#7FFF00', '#00B894', '#0A3322', '#05140A'],
        blend: 1.0
      },
      'Palette 6 (FFE8CC, FF8C00, C7501A, 3D1050, 0E0618)': {
        bg: '#0E0618',
        colors: ['#FFE8CC', '#FF8C00', '#C7501A', '#3D1050', '#0E0618'],
        blend: 1.0
      },
      'Palette 7 (E8E0FF, B38FFF, 6A3DE8, 1A1250, 090612)': {
        bg: '#090612',
        colors: ['#E8E0FF', '#B38FFF', '#6A3DE8', '#1A1250', '#090612'],
        blend: 1.0
      },
      'Palette 8 (E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)': {
        bg: '#05020F',
        colors: ['#E0FBFF', '#00F0FF', '#D40078', '#1E0A3D', '#05020F'],
        blend: 1.0
      }
    };

    function hexToRgb(hex) {
      const clean = hex.replace('#', '');
      const bigint = parseInt(clean, 16);
      if (clean.length === 3) {
        const r = ((bigint >> 8) & 0xf) * 17;
        const g = ((bigint >> 4) & 0xf) * 17;
        const b = (bigint & 0xf) * 17;
        return [r / 255, g / 255, b / 255];
      }
      const r = (bigint >> 16) & 255;
      const g = (bigint >> 8) & 255;
      const b = bigint & 255;
      return [r / 255, g / 255, b / 255];
    }

    /* =========================================================================
       APPLICATION PARAMETERS
       ========================================================================= */
    const params = {
      // Color & Palette
      colorScheme: 'Original',
      paletteBlend: 0.0,
      invert: false,

      // View & Pan/Zoom
      viewZoom: 1.0,
      panX: 0.0,
      panY: 0.0,

      // Motion & Dynamics
      speed: 1.0,
      paused: false,
      baseZoom: 2.0,
      rotationSpeed: 0.05,
      driftX: 12.0,
      driftY: 10.0,
      warpK: 4.0,
      grainScale: 1.0,

      // Lighting & Aesthetics
      brightness: 1.0,
      contrast: 1.0,
      highlightPower: 4.0,
      largePatch: 0.4,
      vignette: 0.125,
      renderScale: Math.min(window.devicePixelRatio || 1, 2.0),

      // Modes & Randomization
      clickToRandomize: true,
      framedMode: false,
      hideUI: false,

      // Actions
      randomize: () => randomizeScene(),
      resetDefaults: () => resetDefaults(),
      resetView: () => resetView(),
      savePNG: () => savePNG()
    };

    /* =========================================================================
       GLSL ES 3.00 SHADERS
       ========================================================================= */
    const vertexShaderSource = `#version 300 es
    precision highp float;
    in vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }`;

    const fragmentShaderSource = `#version 300 es
    /*********
    * Original shader made by Matthias Hurrle (@atzedent)
    * "A Riot of Color" - Creative Coding Challenge
    * Enhanced with parametric modulation, multi-palette transitions & pan/zoom
    */
    precision highp float;
    out vec4 O;

    // Standard & Compatibility uniforms
    uniform float time;
    uniform vec2 resolution;
    uniform vec2 wheel;
    uniform float iTime;
    uniform vec2 iResolution;
    uniform vec4 iMouse;

    // View uniforms (interactive pan & zoom)
    uniform vec2  u_pan;
    uniform float u_viewZoom;

    // Procedural parameter uniforms
    uniform float u_baseZoom;
    uniform float u_rotSpeed;
    uniform float u_driftX;
    uniform float u_driftY;
    uniform float u_warpK;
    uniform float u_grainScale;
    uniform float u_highlightPower;
    uniform float u_largePatch;
    uniform float u_brightness;
    uniform float u_contrast;
    uniform float u_vignette;
    uniform float u_invert;

    // Palette uniforms
    uniform float u_paletteBlend;
    uniform int   u_palCount;
    uniform vec3  u_pal[6];

    #define FC gl_FragCoord.xy
    #define R resolution
    #define T (time + wheel.y / 1e3)
    #define S smoothstep
    #define MN min(R.x, R.y)
    #define rot(a) mat2(cos((a) - vec4(0, 11, 33, 0)))

    // white noise
    float rnd(vec2 a) {
      vec3 p = fract(vec3(a.xyx) * .1031);
      p += dot(p, p.yzx + 33.33);
      return fract((p.x + p.y) * p.z);
    }

    // value noise
    float noise(vec2 p) {
      vec2 i = floor(p), u = S(i, i + 1., p), k = vec2(1, 0);
      float
      a = rnd(i),
      b = rnd(i + k),
      c = rnd(i + k.yx),
      d = rnd(i + k.xx);
      return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
    }

    // animates the scene
    void anim(inout vec2 uv) {
      float t = T * u_rotSpeed;
      uv *= 1. + S(.0, 1., clamp(1.2 * dot(uv, uv), .0, 1.));
      uv *= rot(t);
      uv.x -= u_driftX * cos(t);	
      uv.y += u_driftY * sin(t);
      uv *= u_baseZoom;
    }

    // smooth multi-stop color palette sampler
    vec3 samplePalette(float t) {
      t = clamp(t, 0.0, 1.0);
      float n = float(max(1, u_palCount - 1));
      float scaled = t * n;
      int idx = int(floor(scaled));
      float f = fract(scaled);
      f = smoothstep(0.0, 1.0, f);
      if (idx >= u_palCount - 1) return u_pal[u_palCount - 1];

      vec3 cA = u_pal[0];
      vec3 cB = u_pal[1];
      if (idx == 1) { cA = u_pal[1]; cB = u_pal[2]; }
      else if (idx == 2) { cA = u_pal[2]; cB = u_pal[3]; }
      else if (idx == 3) { cA = u_pal[3]; cB = u_pal[4]; }
      else if (idx == 4) { cA = u_pal[4]; cB = u_pal[5]; }

      return mix(cA, cB, f);
    }

    // aggregates layers of colorful noise
    vec3 pattern(vec2 uv) {
      float k = u_warpK;
      float grain = mix(.0, noise(vec2(uv.x, fract(uv.y)) * 100.), min(T * .3, 1.)) * u_grainScale;
      vec3 col = vec3(0);
      vec2
      a = vec2(noise(uv - T + noise(uv * 2. + grain)), noise(T * .1 - uv + vec2(3, 5))),
      b = vec2(noise(T + uv + vec2(7, 3) + a * k), noise(T * .3 - uv + a * k)),
      c = vec2(noise(T * .2 - uv + vec2(1, 4) + b * k), noise(T * .5 - uv - vec2(4, 1) + b * k)),
      d = vec2(noise(T * .4 - uv + vec2(2, 3) + c * k), noise(T * .2 - uv - vec2(7, 2) + c * k));
      col += max(.3, noise(uv - d));
      col = clamp(col, .0, .35);
      float f = clamp(dot(a, b), -1., 1.);

      // Original mathematical color formulation
      vec3 origColor = vec3(a.x / 3. + a.y / 2. + f * 1.4, a.x + a.x / (2.4 + f * f), b.x * b.y / 1.5 + f * .6 + d.y * .4) / 3.;

      // Procedural palette modulation
      float palCoord = clamp((a.x * 0.45 + a.y * 0.35 + (f * 0.5 + 0.5) * 0.55) * 0.8, 0.0, 1.0);
      vec3 palColor = samplePalette(palCoord) * (0.6 + 0.4 * (b.x * b.y + d.y * 0.5));

      col += mix(origColor, palColor, u_paletteBlend);

      // add highlights
      vec3 hiTint = mix(vec3(.2, .8, 1.), samplePalette(0.85), u_paletteBlend);
      col += pow(d.x * d.y, u_highlightPower) * hiTint;

      // highlight larger patches
      vec3 patchTint = mix(vec3(1.0), samplePalette(0.15), u_paletteBlend * 0.7);
      col += u_largePatch * pow(a.x, 5.) * patchTint;

      return col;
    }

    // puts it all together
    vec3 render(vec2 uv) {
      anim(uv);
      vec3 col = pattern(uv);
      
      // contrast modulation
      col = S(.1 * (2.0 - u_contrast), 1.0 * u_contrast, col);
      
      // brighten the scene
      col += abs(col) * (.25 * u_brightness);
      
      // color grading
      col = tanh(col * col * col);

      if (u_invert > 0.5) {
        col = 1.0 - col;
      }

      return col;
    }

    void main() {
      // Apply interactive pan and zoom in viewport space
      vec2 uv = (FC - .5 * R) / MN;
      uv = uv / u_viewZoom - u_pan;

      vec3 col = render(uv);

      // vignette
      vec2 c = FC / R;
      c *= 1. - c.yx;
      float v = c.x * c.y * 25.;
      col *= pow(v, u_vignette); // very subtle
      O = vec4(col, 1.0);
    }`;

    /* =========================================================================
       WEBGL2 ENGINE INITIALIZATION
       ========================================================================= */
    const canvas = document.getElementById('glcanvas');
    const gl = canvas.getContext('webgl2', {
      alpha: false,
      antialias: false,
      depth: false,
      stencil: false,
      preserveDrawingBuffer: true,
      powerPreference: 'high-performance'
    });

    if (!gl) {
      alert('WebGL 2.0 is not supported by your browser or graphics hardware.');
      throw new Error('WebGL 2.0 unavailable');
    }

    function createShader(gl, type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        const info = gl.getShaderInfoLog(shader);
        gl.deleteShader(shader);
        throw new Error('Shader compilation error: ' + info);
      }
      return shader;
    }

    function createProgram(gl, vsSource, fsSource) {
      const vs = createShader(gl, gl.VERTEX_SHADER, vsSource);
      const fs = createShader(gl, gl.FRAGMENT_SHADER, fsSource);
      const program = gl.createProgram();
      gl.attachShader(program, vs);
      gl.attachShader(program, fs);
      gl.linkProgram(program);
      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        const info = gl.getProgramInfoLog(program);
        gl.deleteProgram(program);
        throw new Error('Program link error: ' + info);
      }
      return program;
    }

    const program = createProgram(gl, vertexShaderSource, fragmentShaderSource);

    // Full-screen triangle covering [-1, 1]x[-1, 1]
    const quadVertices = new Float32Array([
      -1, -1,
       3, -1,
      -1,  3
    ]);

    const vao = gl.createVertexArray();
    gl.bindVertexArray(vao);
    const vbo = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
    gl.bufferData(gl.ARRAY_BUFFER, quadVertices, gl.STATIC_DRAW);

    const posAttr = gl.getAttribLocation(program, 'a_position');
    gl.enableVertexAttribArray(posAttr);
    gl.vertexAttribPointer(posAttr, 2, gl.FLOAT, false, 0, 0);

    // Uniform Locations
    const uniforms = {
      time: gl.getUniformLocation(program, 'time'),
      resolution: gl.getUniformLocation(program, 'resolution'),
      wheel: gl.getUniformLocation(program, 'wheel'),
      iTime: gl.getUniformLocation(program, 'iTime'),
      iResolution: gl.getUniformLocation(program, 'iResolution'),
      iMouse: gl.getUniformLocation(program, 'iMouse'),
      u_pan: gl.getUniformLocation(program, 'u_pan'),
      u_viewZoom: gl.getUniformLocation(program, 'u_viewZoom'),
      u_baseZoom: gl.getUniformLocation(program, 'u_baseZoom'),
      u_rotSpeed: gl.getUniformLocation(program, 'u_rotSpeed'),
      u_driftX: gl.getUniformLocation(program, 'u_driftX'),
      u_driftY: gl.getUniformLocation(program, 'u_driftY'),
      u_warpK: gl.getUniformLocation(program, 'u_warpK'),
      u_grainScale: gl.getUniformLocation(program, 'u_grainScale'),
      u_highlightPower: gl.getUniformLocation(program, 'u_highlightPower'),
      u_largePatch: gl.getUniformLocation(program, 'u_largePatch'),
      u_brightness: gl.getUniformLocation(program, 'u_brightness'),
      u_contrast: gl.getUniformLocation(program, 'u_contrast'),
      u_vignette: gl.getUniformLocation(program, 'u_vignette'),
      u_invert: gl.getUniformLocation(program, 'u_invert'),
      u_paletteBlend: gl.getUniformLocation(program, 'u_paletteBlend'),
      u_palCount: gl.getUniformLocation(program, 'u_palCount'),
      u_pal: gl.getUniformLocation(program, 'u_pal')
    };

    /* =========================================================================
       INTERACTIVE PAN, ZOOM, AND VIEWPORT STATE
       ========================================================================= */
    let viewZoom = 1.0;
    let targetZoom = 1.0;

    let panX = 0.0;
    let panY = 0.0;
    let targetPanX = 0.0;
    let targetPanY = 0.0;

    let wheelDelta = 0.0;
    let wheelOffset = 0.0;

    let timeSec = 0.0;
    let lastTimestamp = performance.now();

    // Mouse / Pointer Interaction tracking
    let isPointerDown = false;
    let startPointerX = 0;
    let startPointerY = 0;
    let lastPointerX = 0;
    let lastPointerY = 0;
    let totalDragDist = 0;
    let pointerDownTime = 0;

    // Multi-touch tracking for pinch-to-zoom
    const activeTouches = new Map();
    let initialPinchDistance = 0;
    let initialPinchZoom = 1.0;

    /* =========================================================================
       RESIZING & FRAMED 4:5 PRINT MODE
       ========================================================================= */
    function resizeCanvas() {
      const dpr = params.renderScale;
      let displayWidth, displayHeight;

      if (params.framedMode) {
        // 4:5 Art Print Aspect Ratio
        const maxW = window.innerWidth - 64;
        const maxH = window.innerHeight - 64;
        const targetAspect = 4 / 5;

        if (maxW / maxH > targetAspect) {
          displayHeight = maxH;
          displayWidth = maxH * targetAspect;
        } else {
          displayWidth = maxW;
          displayHeight = maxW / targetAspect;
        }
        document.body.classList.add('mode-framed');
      } else {
        displayWidth = window.innerWidth;
        displayHeight = window.innerHeight;
        document.body.classList.remove('mode-framed');
      }

      const renderWidth = Math.round(displayWidth * dpr);
      const renderHeight = Math.round(displayHeight * dpr);

      if (canvas.width !== renderWidth || canvas.height !== renderHeight) {
        canvas.width = renderWidth;
        canvas.height = renderHeight;
        canvas.style.width = displayWidth + 'px';
        canvas.style.height = displayHeight + 'px';
        gl.viewport(0, 0, renderWidth, renderHeight);
      }
    }

    window.addEventListener('resize', resizeCanvas);

    /* =========================================================================
       WHEEL ZOOM & PAN EVENT LISTENERS
       ========================================================================= */
    // Mouse Wheel: Zoom smoothly in/out around cursor
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();

      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;
      const minDim = Math.min(rect.width, rect.height);
      const mNormX = (mouseX - rect.width * 0.5) / minDim;
      const mNormY = (rect.height * 0.5 - mouseY) / minDim;

      // Exponential zoom sensitivity
      const zoomFactor = Math.exp(-e.deltaY * 0.0022);
      const newTargetZoom = Math.min(Math.max(targetZoom * zoomFactor, 0.15), 35.0);

      // Stationary cursor world anchoring
      targetPanX = targetPanX + mNormX * (1.0 / newTargetZoom - 1.0 / targetZoom);
      targetPanY = targetPanY + mNormY * (1.0 / newTargetZoom - 1.0 / targetZoom);
      targetZoom = newTargetZoom;

      params.viewZoom = +targetZoom.toFixed(2);
      params.panX = +targetPanX.toFixed(3);
      params.panY = +targetPanY.toFixed(3);
      if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
    }, { passive: false });

    // Pointer down: initiate drag / record start for click detection
    canvas.addEventListener('pointerdown', (e) => {
      if (e.target !== canvas) return;
      isPointerDown = true;
      startPointerX = e.clientX;
      startPointerY = e.clientY;
      lastPointerX = e.clientX;
      lastPointerY = e.clientY;
      totalDragDist = 0;
      pointerDownTime = performance.now();
      canvas.setPointerCapture(e.pointerId);

      activeTouches.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (activeTouches.size === 2) {
        const pts = Array.from(activeTouches.values());
        initialPinchDistance = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        initialPinchZoom = targetZoom;
      }
    });

    // Pointer move: Drag object across screen or pinch-zoom
    window.addEventListener('pointermove', (e) => {
      if (!isPointerDown) return;

      if (activeTouches.has(e.pointerId)) {
        activeTouches.set(e.pointerId, { x: e.clientX, y: e.clientY });
      }

      // Handle two-finger pinch-to-zoom
      if (activeTouches.size === 2) {
        const pts = Array.from(activeTouches.values());
        const currentDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        if (initialPinchDistance > 10) {
          const ratio = currentDist / initialPinchDistance;
          targetZoom = Math.min(Math.max(initialPinchZoom * ratio, 0.15), 35.0);
          params.viewZoom = +targetZoom.toFixed(2);
          if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
        }
        return;
      }

      const dx = e.clientX - lastPointerX;
      const dy = e.clientY - lastPointerY;
      lastPointerX = e.clientX;
      lastPointerY = e.clientY;
      totalDragDist += Math.hypot(dx, dy);

      if (totalDragDist > 4) {
        canvas.classList.add('dragging');
      }

      // 1:1 screen-to-domain panning
      const rect = canvas.getBoundingClientRect();
      const minDim = Math.min(rect.width, rect.height);
      targetPanX += dx / (minDim * viewZoom);
      targetPanY -= dy / (minDim * viewZoom);

      params.panX = +targetPanX.toFixed(3);
      params.panY = +targetPanY.toFixed(3);
      if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
    });

    // Pointer up: detect click vs drag
    window.addEventListener('pointerup', (e) => {
      if (!isPointerDown) return;
      activeTouches.delete(e.pointerId);
      isPointerDown = false;
      canvas.classList.remove('dragging');

      const clickDuration = performance.now() - pointerDownTime;
      // If it was a clean click without significant drag
      if (totalDragDist < 6 && clickDuration < 450) {
        if (params.clickToRandomize) {
          randomizeScene();
        }
      }
    });

    window.addEventListener('pointercancel', (e) => {
      activeTouches.delete(e.pointerId);
      isPointerDown = false;
      canvas.classList.remove('dragging');
    });

    // Keyboard Shortcuts
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;

      const key = e.key.toLowerCase();
      if (e.key === ' ' || key === 'space') {
        e.preventDefault();
        params.paused = !params.paused;
        if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
      } else if (key === 'h') {
        params.hideUI = !params.hideUI;
        document.body.classList.toggle('hidden-ui', params.hideUI);
        if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
      } else if (key === 'r') {
        randomizeScene();
      }
    });

    /* =========================================================================
       PALETTE MANAGEMENT
       ========================================================================= */
    function applyPalette(schemeName) {
      params.colorScheme = schemeName;
      const scheme = COLOR_SCHEMES[schemeName] || COLOR_SCHEMES['Original'];
      params.paletteBlend = scheme.blend;
      document.body.style.backgroundColor = scheme.bg;
      if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    function uploadPaletteUniforms(schemeName) {
      const scheme = COLOR_SCHEMES[schemeName] || COLOR_SCHEMES['Original'];
      const hexList = scheme.colors;
      const count = hexList.length;
      gl.uniform1i(uniforms.u_palCount, count);

      const flatArray = new Float32Array(18); // 6 * 3
      for (let i = 0; i < 6; i++) {
        const hex = hexList[Math.min(i, hexList.length - 1)];
        const rgb = hexToRgb(hex);
        flatArray[i * 3 + 0] = rgb[0];
        flatArray[i * 3 + 1] = rgb[1];
        flatArray[i * 3 + 2] = rgb[2];
      }
      gl.uniform3fv(uniforms.u_pal, flatArray);
    }

    /* =========================================================================
       RANDOMIZATION & PROCEDURAL GENERATION
       ========================================================================= */
    function randomizeScene() {
      // Pick random palette from 19 schemes
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const chosenScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      applyPalette(chosenScheme);

      // Re-roll geometric and motion parameters
      params.baseZoom = +(1.2 + Math.random() * 1.8).toFixed(2);
      params.warpK = +(2.5 + Math.random() * 3.5).toFixed(2);
      params.speed = +(0.65 + Math.random() * 0.75).toFixed(2);
      params.rotationSpeed = +((Math.random() > 0.5 ? 1 : -1) * (0.02 + Math.random() * 0.05)).toFixed(3);
      params.driftX = +(6.0 + Math.random() * 12.0).toFixed(1);
      params.driftY = +(5.0 + Math.random() * 10.0).toFixed(1);
      params.grainScale = +(0.4 + Math.random() * 1.0).toFixed(2);
      params.highlightPower = +(2.5 + Math.random() * 3.5).toFixed(1);
      params.brightness = +(0.85 + Math.random() * 0.35).toFixed(2);
      params.contrast = +(0.85 + Math.random() * 0.3).toFixed(2);

      // Subtle procedural pan shift
      targetPanX = (Math.random() - 0.5) * 1.5;
      targetPanY = (Math.random() - 0.5) * 1.5;
      params.panX = +targetPanX.toFixed(3);
      params.panY = +targetPanY.toFixed(3);

      if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    function resetView() {
      targetZoom = 1.0;
      targetPanX = 0.0;
      targetPanY = 0.0;
      params.viewZoom = 1.0;
      params.panX = 0.0;
      params.panY = 0.0;
      if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    function resetDefaults() {
      resetView();
      wheelDelta = 0.0;
      wheelOffset = 0.0;
      timeSec = 0.0;

      params.colorScheme = 'Original';
      params.paletteBlend = 0.0;
      params.invert = false;
      params.speed = 1.0;
      params.paused = false;
      params.baseZoom = 2.0;
      params.rotationSpeed = 0.05;
      params.driftX = 12.0;
      params.driftY = 10.0;
      params.warpK = 4.0;
      params.grainScale = 1.0;
      params.brightness = 1.0;
      params.contrast = 1.0;
      params.highlightPower = 4.0;
      params.largePatch = 0.4;
      params.vignette = 0.125;

      applyPalette('Original');
      if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    function savePNG() {
      canvas.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
        const themeSlug = params.colorScheme.toLowerCase().replace(/[^a-z0-9]+/g, '-');
        a.download = `riot-of-color-${themeSlug}-${timestamp}.png`;
        a.href = url;
        a.click();
        URL.revokeObjectURL(url);
      }, 'image/png');
    }

    /* =========================================================================
       LIL-GUI CONTROLS
       ========================================================================= */
    let gui;
    if (typeof lil !== 'undefined' && lil.GUI) {
      gui = new lil.GUI({ title: 'A Riot of Color' });

      // Theme & Color Schemes Folder
      const themeFolder = gui.addFolder('Theme & Color Palette');
      themeFolder.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES))
        .name('Color Scheme')
        .onChange(v => applyPalette(v));
      themeFolder.add(params, 'paletteBlend', 0.0, 1.0, 0.01)
        .name('Palette Blend')
        .listen();
      themeFolder.add(params, 'invert').name('Invert Negative');

      // View & Navigation Folder
      const viewFolder = gui.addFolder('View & Navigation');
      viewFolder.add(params, 'viewZoom', 0.15, 20.0, 0.05).name('Wheel Zoom').listen().onChange(v => {
        targetZoom = v;
      });
      viewFolder.add(params, 'panX', -10.0, 10.0, 0.01).name('Pan X').listen().onChange(v => {
        targetPanX = v;
      });
      viewFolder.add(params, 'panY', -10.0, 10.0, 0.01).name('Pan Y').listen().onChange(v => {
        targetPanY = v;
      });
      viewFolder.add(params, 'resetView').name('↺ Reset View');

      // Motion & Dynamics Folder
      const motionFolder = gui.addFolder('Motion & Dynamics');
      motionFolder.add(params, 'speed', -3.0, 3.0, 0.05).name('Animation Speed');
      motionFolder.add(params, 'paused').name('Pause Motion').listen();
      motionFolder.add(params, 'baseZoom', 0.5, 4.5, 0.05).name('Domain Zoom');
      motionFolder.add(params, 'rotationSpeed', -0.15, 0.15, 0.005).name('Rotation Velocity');
      motionFolder.add(params, 'driftX', 0.0, 30.0, 0.5).name('Drift X');
      motionFolder.add(params, 'driftY', 0.0, 30.0, 0.5).name('Drift Y');
      motionFolder.add(params, 'warpK', 1.0, 8.0, 0.1).name('Noise Warp (k)');
      motionFolder.add(params, 'grainScale', 0.0, 2.5, 0.05).name('Film Grain');

      // Lighting & Aesthetics Folder
      const renderFolder = gui.addFolder('Lighting & Aesthetics');
      renderFolder.add(params, 'brightness', 0.4, 2.0, 0.05).name('Brightness');
      renderFolder.add(params, 'contrast', 0.4, 2.0, 0.05).name('Contrast');
      renderFolder.add(params, 'highlightPower', 1.0, 8.0, 0.1).name('Highlight Power');
      renderFolder.add(params, 'largePatch', 0.0, 1.2, 0.05).name('Patch Glow');
      renderFolder.add(params, 'vignette', 0.0, 0.35, 0.005).name('Vignette Falloff');
      renderFolder.add(params, 'renderScale', [0.5, 1.0, 1.5, 2.0]).name('Render DPI').onChange(resizeCanvas);

      // Display & Interaction Settings Folder
      const settingsFolder = gui.addFolder('Settings & Modes');
      settingsFolder.add(params, 'clickToRandomize').name('Click to Randomize');
      settingsFolder.add(params, 'framedMode').name('Framed 4:5 Print').onChange(resizeCanvas).listen();
      settingsFolder.add(params, 'hideUI').name('Hide Interface (H)').onChange(v => {
        document.body.classList.toggle('hidden-ui', v);
      }).listen();

      // Quick Actions Folder
      const actionsFolder = gui.addFolder('Quick Actions');
      actionsFolder.add(params, 'randomize').name('🎲 Randomize Scene');
      actionsFolder.add(params, 'resetDefaults').name('↺ Reset Defaults');
      actionsFolder.add(params, 'savePNG').name('📸 Capture PNG');

      themeFolder.open();
    }

    /* =========================================================================
       MAIN ANIMATION & RENDER LOOP
       ========================================================================= */
    resizeCanvas();

    function renderFrame(now) {
      requestAnimationFrame(renderFrame);

      const deltaMs = now - lastTimestamp;
      lastTimestamp = now;

      // Update time with animation speed
      if (!params.paused) {
        timeSec += (deltaMs / 1000.0) * params.speed;
      }

      // Smooth inertia lerping for zoom and pan
      viewZoom += (targetZoom - viewZoom) * 0.12;
      panX += (targetPanX - panX) * 0.14;
      panY += (targetPanY - panY) * 0.14;

      // Activate Shader Program
      gl.useProgram(program);

      // Core uniform inputs
      gl.uniform1f(uniforms.time, timeSec);
      gl.uniform2f(uniforms.resolution, canvas.width, canvas.height);
      gl.uniform2f(uniforms.wheel, wheelDelta, wheelOffset);

      // Compatibility uniforms
      gl.uniform1f(uniforms.iTime, timeSec);
      gl.uniform2f(uniforms.iResolution, canvas.width, canvas.height);
      gl.uniform4f(uniforms.iMouse, lastPointerX, lastPointerY, isPointerDown ? 1.0 : 0.0, 0.0);

      // Interactive view uniforms
      gl.uniform1f(uniforms.u_viewZoom, viewZoom);
      gl.uniform2f(uniforms.u_pan, panX, panY);

      // Procedural parameters
      gl.uniform1f(uniforms.u_baseZoom, params.baseZoom);
      gl.uniform1f(uniforms.u_rotSpeed, params.rotationSpeed);
      gl.uniform1f(uniforms.u_driftX, params.driftX);
      gl.uniform1f(uniforms.u_driftY, params.driftY);
      gl.uniform1f(uniforms.u_warpK, params.warpK);
      gl.uniform1f(uniforms.u_grainScale, params.grainScale);
      gl.uniform1f(uniforms.u_highlightPower, params.highlightPower);
      gl.uniform1f(uniforms.u_largePatch, params.largePatch);
      gl.uniform1f(uniforms.u_brightness, params.brightness);
      gl.uniform1f(uniforms.u_contrast, params.contrast);
      gl.uniform1f(uniforms.u_vignette, params.vignette);
      gl.uniform1f(uniforms.u_invert, params.invert ? 1.0 : 0.0);
      gl.uniform1f(uniforms.u_paletteBlend, params.paletteBlend);

      // Upload active color palette
      uploadPaletteUniforms(params.colorScheme);

      // Render fullscreen triangle
      gl.bindVertexArray(vao);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }

    requestAnimationFrame(renderFrame);
  </script>
</body>
