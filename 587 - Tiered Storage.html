    // ==========================================

      colorScheme: 'Original',

      // Procedural & Motion Parameters

      dataFlowSpeed: 1.0,
      coldPulseInterval: 2.8,

      // Lighting & Exposure

      ambientIntensity: 0.8,
      ambientColor: '#1a2233',
      keyLightIntensity: 2.2,
      keyLightColor: '#ffffff',
      hotLightIntensity: 3.5,
      hotLightColor: '#ff5500',
      coldLightIntensity: 2.8,

      clickToRandomize: true

    // Three.js Core Setup

    // Groups for Dual Tiers
    let hotGroup, coldGroup, conduitsGroup, streamsGroup, particlesGroup;

    let coldMonoliths = [];
    let verticalConduits = [];
    let activePulses = [];
    let streamPackets = [];

    // Lights

    // GUI reference
    let gui = null;
    let colorControllers = {};

    function initCamera() {
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(24, 12, 28);
    }

    function initRenderer(useAntialias) {
      if (renderer) {
        if (controls) controls.dispose();
        renderer.dispose();
        if (renderer.domElement && renderer.domElement.parentNode) {
          renderer.domElement.parentNode.removeChild(renderer.domElement);
        }
      }

      renderer = new THREE.WebGLRenderer({
        antialias: useAntialias,
        powerPreference: 'high-performance'
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(params.pixelRatio);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = params.exposure;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      container.appendChild(renderer.domElement);

      if (camera) {
        setupControls();
      }
    }

    function initScene() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(params.greenscreen ? '#00ff00' : params.backgroundColor);

      mainGroup = new THREE.Group();
      scene.add(mainGroup);

      hotGroup = new THREE.Group();
      coldGroup = new THREE.Group();
      conduitsGroup = new THREE.Group();
      streamsGroup = new THREE.Group();
      particlesGroup = new THREE.Group();

      mainGroup.add(coldGroup);
      mainGroup.add(conduitsGroup);
      mainGroup.add(streamsGroup);
      mainGroup.add(hotGroup);
      mainGroup.add(particlesGroup);

      setupLighting();
      buildHotTier();
      buildColdArchiveTier();
      buildConduits();
      buildDataStreams();
      buildAmbientMotes();
      buildPedestalGrid();
    }

    function setupLighting() {
      ambientLight = new THREE.AmbientLight(params.ambientColor, params.ambientIntensity);
      scene.add(ambientLight);

      keyLight = new THREE.DirectionalLight(params.keyLightColor, params.keyLightIntensity);
      keyLight.position.set(20, 30, 20);
      keyLight.castShadow = true;
      keyLight.shadow.mapSize.width = 1024;
      keyLight.shadow.mapSize.height = 1024;
      scene.add(keyLight);

      // Dedicated Point Light for Hot Tier (radiant top illumination)
      hotTierLight = new THREE.PointLight(params.hotLightColor, params.hotLightIntensity, 25, 1.2);
      hotTierLight.position.set(0, 7.5, 0);
      scene.add(hotTierLight);

      // Dedicated Point Light for Cold Tier (uplight / deep archive glow)
      coldTierLight = new THREE.PointLight(params.coldLightColor, params.coldLightIntensity, 30, 1.1);
      coldTierLight.position.set(0, -6.5, 0);
      scene.add(coldTierLight);
    }

    function setupControls() {
      const prevTarget = controls ? controls.target.clone() : new THREE.Vector3(0, 0, 0);
      if (controls) {
        controls.dispose();
      }
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.enablePan = true;
      controls.enableZoom = true;
      controls.zoomSpeed = 1.0;
      controls.rotateSpeed = 0.7;
      controls.minDistance = 6.0;
      controls.maxDistance = 140.0;
      controls.target.copy(prevTarget);
    }

    // ==========================================
    // 3D Visual Architecture: Dual-Tier Build
    // ==========================================

    // 1. Hot Layer: Rapidly pulsing compact cubes processing data flows
    function buildHotTier() {
      // Clear previous hot cubes
      while (hotGroup.children.length > 0) {
        const obj = hotGroup.children[0];
        if (obj.geometry) obj.geometry.dispose();
        if (obj.material) {
          if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
          else obj.material.dispose();
        }
        hotGroup.remove(obj);
      }
      hotCubes = [];

      const gridSize = 7;
      const spacing = 1.9;
      const baseHeightY = 5.2;

      const cubeGeom = new THREE.BoxGeometry(0.85, 0.85, 0.85);
      const wireGeom = new THREE.WireframeGeometry(cubeGeom);
      const coreGeom = new THREE.BoxGeometry(0.55, 0.55, 0.55);

      const offset = ((gridSize - 1) * spacing) / 2;

      for (let ix = 0; ix < gridSize; ix++) {
        for (let iz = 0; iz < gridSize; iz++) {
          const posX = ix * spacing - offset;
          const posZ = iz * spacing - offset;

          const cubeContainer = new THREE.Group();
          cubeContainer.position.set(posX, baseHeightY, posZ);

          // Outer shell: sleek beveled metallic housing
          const shellMat = new THREE.MeshStandardMaterial({
            color: new THREE.Color(params.hotTierColor).multiplyScalar(0.2),
            metalness: 0.85,
            roughness: 0.25,
            emissive: new THREE.Color(params.hotTierColor),
            emissiveIntensity: 0.15,
            transparent: true,
            opacity: 0.92
          });
          const shellMesh = new THREE.Mesh(cubeGeom, shellMat);
          shellMesh.castShadow = true;
          shellMesh.receiveShadow = true;
          cubeContainer.add(shellMesh);

          // Wireframe neon edge highlight
          const wireMat = new THREE.LineBasicMaterial({
            color: new THREE.Color(params.hotAccentColor),
            transparent: true,
            opacity: 0.65
          });
          const wireLine = new THREE.LineSegments(wireGeom, wireMat);
          cubeContainer.add(wireLine);

          // Glowing internal computational core
          const coreMat = new THREE.MeshBasicMaterial({
            color: new THREE.Color(params.hotAccentColor),
            transparent: true,
            opacity: 0.85
          });
          const coreMesh = new THREE.Mesh(coreGeom, coreMat);
          cubeContainer.add(coreMesh);

          hotGroup.add(cubeContainer);

          hotCubes.push({
            container: cubeContainer,
            shell: shellMesh,
            core: coreMesh,
            wire: wireLine,
            baseY: baseHeightY,
            gridX: ix,
            gridZ: iz,
            phase: (ix * 0.7 + iz * 1.1) + Math.random() * Math.PI,
            pulseSpeed: 4.0 + Math.random() * 3.5,
            heightScale: 0.85 + Math.random() * 0.4
          });
        }
      }
    }

    // 2. Cold Archive Tier: Heavy, static monoliths receiving intermittent pulses
    function buildColdArchiveTier() {
      while (coldGroup.children.length > 0) {
        const obj = coldGroup.children[0];
        if (obj.geometry) obj.geometry.dispose();
        if (obj.material) {
          if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
          else obj.material.dispose();
        }
        coldGroup.remove(obj);
      }
      coldMonoliths = [];

      const rows = 4;
      const cols = 4;
      const spacingX = 3.6;
      const spacingZ = 3.6;
      const offsetX = ((cols - 1) * spacingX) / 2;
      const offsetZ = ((rows - 1) * spacingZ) / 2;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const posX = c * spacingX - offsetX;
          const posZ = r * spacingZ - offsetZ;

          // Varied monumental heights (monolithic archive towers)
          const monolithHeight = 5.2 + Math.random() * 2.2;
          const monolithWidth = 1.9;
          const monolithDepth = 1.9;
          const posY = -1.8 - monolithHeight / 2;

          const monolithGroup = new THREE.Group();
          monolithGroup.position.set(posX, posY, posZ);

          // Monolith main body: Heavy obsidian / dark brushed alloy
          const bodyGeom = new THREE.BoxGeometry(monolithWidth, monolithHeight, monolithDepth);
          const bodyMat = new THREE.MeshStandardMaterial({
            color: new THREE.Color(params.coldTierColor),
            metalness: 0.88,
            roughness: 0.35,
            emissive: new THREE.Color(params.coldTierColor).multiplyScalar(0.15)
          });
          const bodyMesh = new THREE.Mesh(bodyGeom, bodyMat);
          bodyMesh.castShadow = true;
          bodyMesh.receiveShadow = true;
          monolithGroup.add(bodyMesh);

          // Monolith edges: Chamfer wireframe contour
          const edgesGeom = new THREE.WireframeGeometry(bodyGeom);
          const edgesMat = new THREE.LineBasicMaterial({
            color: new THREE.Color(params.coldPulseColor),
            transparent: true,
            opacity: 0.22
          });
          const edgesLine = new THREE.LineSegments(edgesGeom, edgesMat);
          monolithGroup.add(edgesLine);

          // Horizontal Archive Shelf Slots (Recessed drive bays)
          const ribCount = Math.floor(monolithHeight * 2.2);
          const ribs = [];
          const ribGeom = new THREE.BoxGeometry(monolithWidth * 1.02, 0.08, monolithDepth * 1.02);

          for (let i = 0; i < ribCount; i++) {
            const ribY = -monolithHeight / 2 + 0.35 + (i * (monolithHeight - 0.7)) / (ribCount - 1);
            const ribMat = new THREE.MeshStandardMaterial({
              color: new THREE.Color(params.coldTierColor).multiplyScalar(0.4),
              metalness: 0.9,
              roughness: 0.2,
              emissive: new THREE.Color(params.coldPulseColor),
              emissiveIntensity: 0.05
            });
            const ribMesh = new THREE.Mesh(ribGeom, ribMat);
            ribMesh.position.y = ribY;
            monolithGroup.add(ribMesh);
            ribs.push({
              mesh: ribMesh,
              normY: 1.0 - (i / (ribCount - 1)) // 1.0 at top, 0.0 at bottom
            });
          }

          // Top Port Interface (Target receiver for conduits)
          const portGeom = new THREE.CylinderGeometry(0.35, 0.45, 0.25, 8);
          const portMat = new THREE.MeshStandardMaterial({
            color: new THREE.Color(params.coldPulseColor),
            metalness: 0.9,
            roughness: 0.2,
            emissive: new THREE.Color(params.coldPulseColor),
            emissiveIntensity: 0.3
          });
          const portMesh = new THREE.Mesh(portGeom, portMat);
          portMesh.position.y = monolithHeight / 2 + 0.12;
          monolithGroup.add(portMesh);

          coldGroup.add(monolithGroup);

          coldMonoliths.push({
            group: monolithGroup,
            body: bodyMesh,
            edges: edgesLine,
            ribs: ribs,
            port: portMesh,
            height: monolithHeight,
            topY: posY + monolithHeight / 2,
            posX: posX,
            posZ: posZ,
            pulseWave: -1.0, // Wave progress [0.0 to 1.5]
            pulseIntensity: 0.0
          });
        }
      }
    }

    // 3. Conduits: Vertical Data Light-Pipes Linking Hot Nodes to Cold Monoliths
    function buildConduits() {
      while (conduitsGroup.children.length > 0) {
        const obj = conduitsGroup.children[0];
        if (obj.geometry) obj.geometry.dispose();
        if (obj.material) obj.material.dispose();
        conduitsGroup.remove(obj);
      }
      verticalConduits = [];

      // Link each cold monolith to the closest matching hot node
      coldMonoliths.forEach((monolith, idx) => {
        // Find nearest hot cube or create direct vertical conduit
        let nearestCube = hotCubes[0];
        let minD = Infinity;
        hotCubes.forEach(cube => {
          const dx = cube.container.position.x - monolith.posX;
          const dz = cube.container.position.z - monolith.posZ;
          const dist = Math.hypot(dx, dz);
          if (dist < minD) {
            minD = dist;
            nearestCube = cube;
          }
        });

        const startY = nearestCube.container.position.y - 0.45;
        const endY = monolith.topY + 0.2;
        const conduitHeight = startY - endY;

        const conduitContainer = new THREE.Group();
        conduitContainer.position.set(monolith.posX, endY + conduitHeight / 2, monolith.posZ);

        // Core light beam
        const cylinderGeom = new THREE.CylinderGeometry(0.04, 0.04, conduitHeight, 8);
        const cylinderMat = new THREE.MeshBasicMaterial({
          color: new THREE.Color(params.conduitColor),
          transparent: true,
          opacity: 0.45
        });
        const beamMesh = new THREE.Mesh(cylinderGeom, cylinderMat);
        conduitContainer.add(beamMesh);

        // Outer holographic wireframe ring sleeves
        const sleeveGeom = new THREE.CylinderGeometry(0.18, 0.18, conduitHeight, 6, 12, true);
        const wireMat = new THREE.MeshBasicMaterial({
          color: new THREE.Color(params.conduitColor),
          wireframe: true,
          transparent: true,
          opacity: 0.18
        });
        const sleeveMesh = new THREE.Mesh(sleeveGeom, wireMat);
        conduitContainer.add(sleeveMesh);

        conduitsGroup.add(conduitContainer);

        verticalConduits.push({
          startY: startY,
          endY: endY,
          posX: monolith.posX,
          posZ: monolith.posZ,
          monolithIndex: idx,
          beamMesh: beamMesh,
          sleeveMesh: sleeveMesh
        });
      });
    }

    // 4. Data Streams: High-speed continuous horizontal packets in Hot Tier
    function buildDataStreams() {
      while (streamsGroup.children.length > 0) {
        const obj = streamsGroup.children[0];
        if (obj.geometry) obj.geometry.dispose();
        if (obj.material) obj.material.dispose();
        streamsGroup.remove(obj);
      }
      streamPackets = [];

      const packetCount = 28;
      const packetGeom = new THREE.BoxGeometry(0.35, 0.12, 0.12);

      for (let i = 0; i < packetCount; i++) {
        const mat = new THREE.MeshBasicMaterial({
          color: new THREE.Color(params.hotAccentColor),
          transparent: true,
          opacity: 0.95
        });
        const mesh = new THREE.Mesh(packetGeom, mat);

        const isXAxis = Math.random() > 0.5;
        const randomCube = hotCubes[Math.floor(Math.random() * hotCubes.length)];
        const y = 5.2 + (Math.random() - 0.5) * 0.4;

        streamsGroup.add(mesh);

        streamPackets.push({
          mesh: mesh,
          isXAxis: isXAxis,
          dir: Math.random() > 0.5 ? 1 : -1,
          speed: (2.5 + Math.random() * 3.5),
          fixedCoord: isXAxis ? randomCube.container.position.z : randomCube.container.position.x,
          currPos: (Math.random() - 0.5) * 14,
          y: y
        });
      }
    }

    // 5. Intermittent Archive Pulse System (Hot -> Cold transfer packets)
    let lastPulseLaunchTime = 0;

    function launchArchivePulse() {
      if (verticalConduits.length === 0) return;

      // Select a random conduit to receive an archive dump
      const conduitIdx = Math.floor(Math.random() * verticalConduits.length);
      const conduit = verticalConduits[conduitIdx];

      const packetGeom = new THREE.SphereGeometry(0.28, 12, 12);
      const packetMat = new THREE.MeshBasicMaterial({
        color: new THREE.Color(params.coldPulseColor),
        transparent: true,
        opacity: 0.95
      });
      const packetMesh = new THREE.Mesh(packetGeom, packetMat);
      packetMesh.position.set(conduit.posX, conduit.startY, conduit.posZ);
      scene.add(packetMesh);

      // Trailing ring glow
      const ringGeom = new THREE.RingGeometry(0.2, 0.45, 16);
      const ringMat = new THREE.MeshBasicMaterial({
        color: new THREE.Color(params.coldPulseColor),
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.6
      });
      const ringMesh = new THREE.Mesh(ringGeom, ringMat);
      ringMesh.rotation.x = Math.PI / 2;
      packetMesh.add(ringMesh);

      activePulses.push({
        mesh: packetMesh,
        conduit: conduit,
        progress: 0.0,
        speed: (0.45 + Math.random() * 0.35) * params.dataFlowSpeed
      });
    }

    // 6. Ambient Data Motes / Swarm
    function buildAmbientMotes() {
      if (dataMotes) {
        dataMotes.geometry.dispose();
        dataMotes.material.dispose();
        particlesGroup.remove(dataMotes);
      }

      const motesCount = 450;
      const positions = new Float32Array(motesCount * 3);
      const velocities = new Float32Array(motesCount * 3);

      for (let i = 0; i < motesCount; i++) {
        positions[i * 3 + 0] = (Math.random() - 0.5) * 26;
        positions[i * 3 + 1] = -7.0 + Math.random() * 15;
        positions[i * 3 + 2] = (Math.random() - 0.5) * 26;

        velocities[i * 3 + 0] = (Math.random() - 0.5) * 0.02;
        velocities[i * 3 + 1] = 0.01 + Math.random() * 0.03;
        velocities[i * 3 + 2] = (Math.random() - 0.5) * 0.02;
      }

      const motesGeom = new THREE.BufferGeometry();
      motesGeom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      motesGeom.userData = { velocities: velocities };

      const motesMat = new THREE.PointsMaterial({
        color: new THREE.Color(params.hotAccentColor),
        size: 0.12,
        transparent: true,
        opacity: 0.55,
        blending: THREE.AdditiveBlending
      });

      dataMotes = new THREE.Points(motesGeom, motesMat);
      particlesGroup.add(dataMotes);
    }

    // 7. Base Pedestal / Archive Ground Floor
    let floorGrid = null;
    let basePedestal = null;

    function buildPedestalGrid() {
      if (floorGrid) scene.remove(floorGrid);
      if (basePedestal) scene.remove(basePedestal);

      // Deep Archive Floor Slab
      const slabGeom = new THREE.BoxGeometry(24, 0.4, 24);
      const slabMat = new THREE.MeshStandardMaterial({
        color: new THREE.Color(params.coldTierColor).multiplyScalar(0.4),
        metalness: 0.95,
        roughness: 0.18
      });
      basePedestal = new THREE.Mesh(slabGeom, slabMat);
      basePedestal.position.y = -8.2;
      basePedestal.receiveShadow = true;
      scene.add(basePedestal);

      // Digital Coordinate Grid
      floorGrid = new THREE.GridHelper(26, 26, new THREE.Color(params.conduitColor), new THREE.Color(params.coldPulseColor).multiplyScalar(0.25));
      floorGrid.position.y = -7.98;
      floorGrid.material.transparent = true;
      floorGrid.material.opacity = 0.35;
      scene.add(floorGrid);
    }

    // ==========================================
    // Color Scheme Application
    // ==========================================
    function applyColorScheme(schemeName) {
      const scheme = COLOR_SCHEMES[schemeName] || COLOR_SCHEMES['Original'];
      params.colorScheme = schemeName;
      params.hotTierColor = scheme.hotColor;
      params.hotAccentColor = scheme.hotAccent;
      params.coldTierColor = scheme.coldColor;
      params.coldPulseColor = scheme.coldPulse;
      params.conduitColor = scheme.conduitColor;
      params.backgroundColor = scheme.bgColor;
      params.ambientColor = scheme.ambientColor;
      params.keyLightColor = scheme.keyLight;
      params.hotLightColor = scheme.hotLight;
      params.coldLightColor = scheme.coldLight;

      updateSceneColors();
      updateGuiControllers();
    }

    function updateSceneColors() {
      // Scene Background
      const targetBg = params.greenscreen ? '#00ff00' : params.backgroundColor;
      scene.background.set(targetBg);

      // Lights
      if (ambientLight) {
        ambientLight.color.set(params.ambientColor);
        ambientLight.intensity = params.ambientIntensity;
      }
      if (keyLight) {
        keyLight.color.set(params.keyLightColor);
        keyLight.intensity = params.keyLightIntensity;
      }
      if (hotTierLight) {
        hotTierLight.color.set(params.hotLightColor);
        hotTierLight.intensity = params.hotLightIntensity;
      }
      if (coldTierLight) {
        coldTierLight.color.set(params.coldLightColor);
        coldTierLight.intensity = params.coldLightIntensity;
      }

      // Hot Tier Cubes
      hotCubes.forEach(cube => {
        cube.shell.material.color.set(params.hotTierColor).multiplyScalar(0.2);
        cube.shell.material.emissive.set(params.hotTierColor);
        cube.wire.material.color.set(params.hotAccentColor);
        cube.core.material.color.set(params.hotAccentColor);
      });

      // Cold Monoliths
      coldMonoliths.forEach(monolith => {
        monolith.body.material.color.set(params.coldTierColor);
        monolith.body.material.emissive.set(params.coldTierColor).multiplyScalar(0.15);
        monolith.edges.material.color.set(params.coldPulseColor);
        monolith.port.material.color.set(params.coldPulseColor);
        monolith.port.material.emissive.set(params.coldPulseColor);

        monolith.ribs.forEach(rib => {
          rib.mesh.material.color.set(params.coldTierColor).multiplyScalar(0.4);
          rib.mesh.material.emissive.set(params.coldPulseColor);
        });
      });

      // Conduits
      verticalConduits.forEach(conduit => {
        conduit.beamMesh.material.color.set(params.conduitColor);
        conduit.sleeveMesh.material.color.set(params.conduitColor);
      });

      // Stream Packets
      streamPackets.forEach(p => {
        p.mesh.material.color.set(params.hotAccentColor);
      });

      // Ambient motes
      if (dataMotes) {
        dataMotes.material.color.set(params.hotAccentColor);
      }

      // Pedestal & Grid
      if (basePedestal) {
        basePedestal.material.color.set(params.coldTierColor).multiplyScalar(0.4);
      }
      if (floorGrid) {
        floorGrid.material.color.set(params.conduitColor);
      }
    }

    // ==========================================
    // Camera Animation Modes (8 Preconfigured)
    // ==========================================
    const CAMERA_MODES = [
      'Static (Manual Camera)',
      'Slow Orbital Drift',
      'Vertical Tier Wave',
      'Hot Tier Inspection',
      'Cold Archive Descent',
      'Cinematic Dual Sweep',
      'Subtle Breather Orbit',
      'Diagonal Horizon Glide'
    ];

    let animClock = 0;

    function updateCameraAnimation(delta) {
      if (params.animSpeed <= 0) return;
      animClock += delta * params.animSpeed;

      const mode = params.animationMode;

      if (mode === 'Static (Manual Camera)') {
        controls.autoRotate = false;
        return;
      }

      // To preserve user wheel zoom & manual drag angles without snapping back:
      // OrbitControls automatically respects user zoom distance when auto-rotating!
      // And smooth adjustments to controls.target.y guide the vertical focus without overriding user distance.

      if (mode === 'Slow Orbital Drift') {
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.55 * params.animSpeed;
        controls.target.y = THREE.MathUtils.lerp(controls.target.y, 0, 0.03);
      }
      else if (mode === 'Vertical Tier Wave') {
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.45 * params.animSpeed;
        // Gently oscilate target Y between hot layer (+5) and cold layer (-4)
        const targetWaveY = Math.sin(animClock * 0.45) * 4.2;
        controls.target.y = THREE.MathUtils.lerp(controls.target.y, targetWaveY, 0.025);
      }
      else if (mode === 'Hot Tier Inspection') {
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.65 * params.animSpeed;
        controls.target.y = THREE.MathUtils.lerp(controls.target.y, 4.8, 0.035);
      }
      else if (mode === 'Cold Archive Descent') {
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.5 * params.animSpeed;
        controls.target.y = THREE.MathUtils.lerp(controls.target.y, -3.8, 0.035);
      }
      else if (mode === 'Cinematic Dual Sweep') {
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.75 * params.animSpeed;
        const targetDualY = Math.sin(animClock * 0.3) * 4.6;
        controls.target.y = THREE.MathUtils.lerp(controls.target.y, targetDualY, 0.02);
      }
      else if (mode === 'Subtle Breather Orbit') {
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.28 * params.animSpeed;
        const targetBreathY = Math.sin(animClock * 0.2) * 1.5;
        controls.target.y = THREE.MathUtils.lerp(controls.target.y, targetBreathY, 0.02);
      }
      else if (mode === 'Diagonal Horizon Glide') {
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.85 * Math.sin(animClock * 0.35) * params.animSpeed;
        const targetDiagY = Math.cos(animClock * 0.4) * 2.8;
        controls.target.y = THREE.MathUtils.lerp(controls.target.y, targetDiagY, 0.025);
      }
    }

    // ==========================================
    // Procedural Re-roll on Scene Click
    // ==========================================
    function randomizeSceneVariation() {
      // Pick random scheme from available keys
      const keys = Object.keys(COLOR_SCHEMES);
      const randomScheme = keys[Math.floor(Math.random() * keys.length)];
      applyColorScheme(randomScheme);

      // Randomize geometric parameters
      params.hotPulseRate = parseFloat((0.6 + Math.random() * 1.6).toFixed(2));
      params.dataFlowSpeed = parseFloat((0.7 + Math.random() * 1.5).toFixed(2));
      params.coldPulseInterval = parseFloat((1.8 + Math.random() * 3.2).toFixed(1));

      // Re-randomize hot cubes phases & scales
      hotCubes.forEach(cube => {
        cube.pulseSpeed = 3.5 + Math.random() * 4.0;
        cube.heightScale = 0.7 + Math.random() * 0.6;
        cube.phase = Math.random() * Math.PI * 2;
      });

      // Re-randomize cold monolith wave statuses
      coldMonoliths.forEach(monolith => {
        monolith.pulseWave = -1.0;
        monolith.pulseIntensity = 0.0;
      });

      // Trigger instant pulse bursts
      launchArchivePulse();
      setTimeout(launchArchivePulse, 250);

      updateGuiControllers();
    }

    let pointerDownPos = { x: 0, y: 0, time: 0 };

    function setupPointerEvents() {
      window.addEventListener('pointerdown', (e) => {
        if (!renderer || e.target !== renderer.domElement) return;
        pointerDownPos.x = e.clientX;
        pointerDownPos.y = e.clientY;
        pointerDownPos.time = performance.now();
      });

      window.addEventListener('pointerup', (e) => {
        if (!renderer || e.target !== renderer.domElement) return;
        const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
        const duration = performance.now() - pointerDownPos.time;

        // If it's a genuine quick click without dragging
        if (dist < 7 && duration < 380 && params.clickToRandomize) {
          randomizeSceneVariation();
        }
      });
    }

    function updateGuiControllers() {
      if (!gui) return;
      gui.controllersRecursive().forEach(controller => {
        controller.updateDisplay();
      });
    }

    // ==========================================
    // Infinite Animation Loop
    // ==========================================
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const time = clock.getElapsedTime();

      // 1. Update Camera and Controls
      updateCameraAnimation(delta);
      controls.update();

      // 2. Hot Tier Dynamic High-Speed Processing Animation
      const pulseSpeedMultiplier = params.hotPulseRate * params.animSpeed;
      hotCubes.forEach(cube => {
        const localTime = time * cube.pulseSpeed * pulseSpeedMultiplier + cube.phase;
        // Rapid pulsing scale
        const scaleVal = 1.0 + Math.sin(localTime) * 0.22 * cube.heightScale;
        cube.shell.scale.set(1.0, scaleVal, 1.0);
        cube.wire.scale.set(1.0, scaleVal, 1.0);

        // Core glowing micro-pulse
        const coreScale = 0.8 + Math.cos(localTime * 1.5) * 0.35;
        cube.core.scale.set(coreScale, coreScale, coreScale);

        // High frequency emissive surge
        const emissivePulse = 0.2 + 0.45 * Math.abs(Math.sin(localTime * 2.0));
        cube.shell.material.emissiveIntensity = emissivePulse;
      });

      // 3. Continuous Horizontal Data Streams on Hot Tier
      const streamSpeedMultiplier = params.dataFlowSpeed * params.animSpeed;
      streamPackets.forEach(packet => {
        packet.currPos += packet.speed * streamSpeedMultiplier * packet.dir * delta * 4.0;
        if (packet.currPos > 7.0) packet.currPos = -7.0;
        if (packet.currPos < -7.0) packet.currPos = 7.0;

        if (packet.isXAxis) {
          packet.mesh.position.set(packet.currPos, packet.y, packet.fixedCoord);
          packet.mesh.rotation.y = 0;
        } else {
          packet.mesh.position.set(packet.fixedCoord, packet.y, packet.currPos);
          packet.mesh.rotation.y = Math.PI / 2;
        }
      });

      // 4. Intermittent Archive Pulse Scheduling
      if (time - lastPulseLaunchTime > (params.coldPulseInterval / Math.max(params.animSpeed, 0.1))) {
        launchArchivePulse();
        lastPulseLaunchTime = time;
      }

      // 5. Update Active Archive Pulses (Hot -> Cold transfer packets)
      for (let i = activePulses.length - 1; i >= 0; i--) {
        const pulse = activePulses[i];
        pulse.progress += pulse.speed * delta * params.animSpeed;

        if (pulse.progress < 1.0) {
          const currentY = THREE.MathUtils.lerp(pulse.conduit.startY, pulse.conduit.endY, pulse.progress);
          pulse.mesh.position.y = currentY;
          pulse.mesh.rotation.y += delta * 6.0;
        } else {
          // Packet arrived at Cold Monolith! Trigger Monolith Pulse Wave!
          const monolith = coldMonoliths[pulse.conduit.monolithIndex];
          if (monolith) {
            monolith.pulseWave = 0.0;
            monolith.pulseIntensity = 1.0;
          }

          // Remove completed pulse mesh
          scene.remove(pulse.mesh);
          pulse.mesh.geometry.dispose();
          pulse.mesh.material.dispose();
          activePulses.splice(i, 1);
        }
      }

      // 6. Cold Monolith Shockwave / Shelf Lighting Animation
      coldMonoliths.forEach(monolith => {
        if (monolith.pulseWave >= 0.0) {
          monolith.pulseWave += delta * 1.6 * params.animSpeed;

          // Propagate pulse down the monolith ribs
          monolith.ribs.forEach(rib => {
            const distFromWave = Math.abs(rib.normY - monolith.pulseWave);
            if (distFromWave < 0.28) {
              const highlight = Math.max(0, 1.0 - distFromWave / 0.28) * monolith.pulseIntensity;
              rib.mesh.material.emissiveIntensity = 0.08 + highlight * 2.5;
            } else {
              rib.mesh.material.emissiveIntensity = THREE.MathUtils.lerp(rib.mesh.material.emissiveIntensity, 0.05, 0.08);
            }
          });

          // Monolith edge flash
          if (monolith.pulseWave < 0.3) {
            monolith.port.material.emissiveIntensity = 1.0 + (1.0 - monolith.pulseWave / 0.3) * 3.0;
          } else {
            monolith.port.material.emissiveIntensity = THREE.MathUtils.lerp(monolith.port.material.emissiveIntensity, 0.3, 0.06);
          }

          // Fade out wave once through
          if (monolith.pulseWave > 1.6) {
            monolith.pulseWave = -1.0;
          }
        }
      });

      // 7. Ambient Data Motes drift
      if (dataMotes) {
        const positions = dataMotes.geometry.attributes.position.array;
        const velocities = dataMotes.geometry.userData.velocities;
        const count = positions.length / 3;

        for (let i = 0; i < count; i++) {
          positions[i * 3 + 1] += velocities[i * 3 + 1] * params.animSpeed;
          positions[i * 3 + 0] += velocities[i * 3 + 0] * params.animSpeed;
          positions[i * 3 + 2] += velocities[i * 3 + 2] * params.animSpeed;

          // Wrap around top to bottom
          if (positions[i * 3 + 1] > 8.0) {
            positions[i * 3 + 1] = -7.5;
          }
        }
        dataMotes.geometry.attributes.position.needsUpdate = true;
      }

      renderer.render(scene, camera);
    }

    // ==========================================
    // Responsive Window Resizing
    // ==========================================
    window.addEventListener('resize', () => {
      if (camera && renderer) {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }
    });

    // ==========================================
    // Initialization Execution
    // ==========================================
    initCamera();
    initRenderer(params.antialias);
    initScene();
    setupPointerEvents();
    setupGUI();
    applyColorScheme('Original');
    animate();

  </script>
</body>
</html>
