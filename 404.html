      }

    // =========================================================================
    // 8 PRECONFIGURED SMOOTH ANIMATIONS
    // =========================================================================
    const ANIMATION_PRESETS = [
      'Static (No Camera Movement)',
      'Gentle Cosmic Drift',
      'Slow Polar Vortex',
      'Deep Harmonic Breathing',
      'Lissajous Infinity Loop',
      'Horizon Pitch & Roll',
      'Zenith Aerial Survey',
      'Cosmic Pendulum Sway'
    ];

    // =========================================================================
    // GLOBAL STATE & DEFAULT SETTINGS
    // =========================================================================
    const settings = {
      // General
      greenScreen: false,
      clickRandomize: true,

      // Colors
      colorScheme: 'Original',
      color1: COLOR_SCHEMES['Original'].color1,
      color2: COLOR_SCHEMES['Original'].color2,
      color3: COLOR_SCHEMES['Original'].color3,
      color4: COLOR_SCHEMES['Original'].color4,
      background: COLOR_SCHEMES['Original'].background,

      // Lighting & Exposure
      exposure: 1.0,
      sceneLightIntensity: 1.0,
      keyLightIntensity: 1.2,
      keyLightColor: '#ffffff',
      keyLightPosX: 1.5,
      keyLightPosY: 2.0,
      keyLightPosZ: 1.0,
      rimLightIntensity: 1.1,
      rimLightColor: '#60a5fa',
      fillLightIntensity: 0.8,
      fillLightColor: '#c084fc',
      ambientIntensity: 0.5,
      ambientColor: '#334155',

      // Camera & Animation
      animationPreset: 'Gentle Cosmic Drift',
      animSpeed: 1.0,
      zoom: 1.0,
      panX: 0.0,
      panY: 0.0,

      // Render Settings
      antialias: true,
      dpr: Math.min(window.devicePixelRatio || 1, 2.0),
      maxIterations: 99,

      // Fractal Geometry
      stepFactor: 0.3,
      noiseScale: 0.3,
      expOffset: 0.9,
      speedA: 0.8,
      speedB: 0.4
    };

    // Interaction trackers
    let manualZoom = 1.0;
    let manualPanX = 0.0;
    let manualPanY = 0.0;
    let isDragging = false;
    let pointerStartX = 0;
    let pointerStartY = 0;
    let panStartX = 0;
    let panStartY = 0;

    // Time & Animation
    let animTime = 0.0;
    const clock = new THREE.Clock();

    // =========================================================================
    // THREE.JS SETUP & SHADER MATERIAL
    // =========================================================================
    let renderer = new THREE.WebGLRenderer({
      antialias: settings.antialias,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(settings.dpr);
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

    const uniforms = {
      u_time: { value: 0.0 },
      u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
      u_pan: { value: new THREE.Vector2(0.0, 0.0) },
      u_zoom: { value: 1.0 },
      u_rot: { value: new THREE.Matrix3() },
      u_maxIterations: { value: settings.maxIterations },

      u_stepFactor: { value: settings.stepFactor },
      u_noiseScale: { value: settings.noiseScale },
      u_expOffset: { value: settings.expOffset },
      u_speedA: { value: settings.speedA },
      u_speedB: { value: settings.speedB },

      u_color1: { value: new THREE.Color(settings.color1) },
      u_color2: { value: new THREE.Color(settings.color2) },
      u_color3: { value: new THREE.Color(settings.color3) },
      u_color4: { value: new THREE.Color(settings.color4) },
      u_colorBg: { value: new THREE.Color(settings.background) },

      u_exposure: { value: settings.exposure },
      u_sceneLightIntensity: { value: settings.sceneLightIntensity },
      u_keyLightIntensity: { value: settings.keyLightIntensity },
      u_keyLightColor: { value: new THREE.Color(settings.keyLightColor) },
      u_keyLightPos: { value: new THREE.Vector3(settings.keyLightPosX, settings.keyLightPosY, settings.keyLightPosZ) },
      u_rimLightIntensity: { value: settings.rimLightIntensity },
      u_rimLightColor: { value: new THREE.Color(settings.rimLightColor) },
      u_fillLightIntensity: { value: settings.fillLightIntensity },
      u_fillLightColor: { value: new THREE.Color(settings.fillLightColor) },
      u_ambientIntensity: { value: settings.ambientIntensity },
      u_ambientColor: { value: new THREE.Color(settings.ambientColor) },

      u_greenscreen: { value: settings.greenScreen }
    };

    const vertexShader = `
      varying vec2 vUv;
      void main() {
        vUv = position.xy * 0.5 + 0.5;
        gl_Position = vec4(position.xy, 0.0, 1.0);
      }
    `;

    const fragmentShader = `
      precision highp float;

      uniform float u_time;
      uniform vec2  u_resolution;
      uniform vec2  u_pan;
      uniform float u_zoom;
      uniform mat3  u_rot;
      uniform int   u_maxIterations;

      uniform float u_stepFactor;
      uniform float u_noiseScale;
      uniform float u_expOffset;
      uniform float u_speedA;
      uniform float u_speedB;

      uniform vec3  u_color1;
      uniform vec3  u_color2;
      uniform vec3  u_color3;
      uniform vec3  u_color4;
      uniform vec3  u_colorBg;

      uniform float u_exposure;
      uniform float u_sceneLightIntensity;
      uniform float u_keyLightIntensity;
      uniform vec3  u_keyLightColor;
      uniform vec3  u_keyLightPos;
      uniform float u_rimLightIntensity;
      uniform vec3  u_rimLightColor;
      uniform float u_fillLightIntensity;
      uniform vec3  u_fillLightColor;
      uniform float u_ambientIntensity;
      uniform vec3  u_ambientColor;

      uniform bool  u_greenscreen;

      // Film tonemapping curve
      vec3 acesFilm(vec3 x) {
        float a = 2.51;
        float b = 0.03;
        float c = 2.43;
        float d = 0.59;
        float e = 0.14;
        return clamp((x * (a * x + b)) / (x * (c * x + d) + e), 0.0, 1.0);
      }

      void main() {
        vec2 FC = gl_FragCoord.xy;
        vec2 r = u_resolution;

        // Interactive coordinate setup with aspect ratio preservation
        vec2 uv = (FC - 0.5 * r) / min(r.x, r.y);
        uv = (uv - u_pan) / max(u_zoom, 0.001);

        // Framing translation matching original formula
        vec2 baseUV = uv + vec2(0.0, 0.3);

        // Ray direction
        vec3 d = normalize(vec3(baseUV, 1.2));
        d = u_rot * d;

        // Raymarcher state initialization
        vec3 q = vec3(0.0, -1.0, -1.0);
        vec3 p = q;
        float e = 0.0;
        float R = 1.0;
        float s = 1.0;
        float t = u_time;

        vec3 accumRgb = vec3(0.0);
        float accumDensity = 0.0;

        for (int iter = 0; iter < 140; iter++) {
          if (iter >= u_maxIterations) break;

          // Ethereal surface filament boundary glow
          if (iter > 0) {
            float val = max(0.0, min(e * s, 0.65 - e) / 45.0);
            if (val > 0.0001) {
              // Multiscale harmonic color synthesis
              float coordY = clamp(abs(p.y) * 0.45, 0.0, 1.0);
              float coordZ = fract(p.z * 0.159);
              float tCoord = clamp(coordY * 0.6 + coordZ * 0.4, 0.0, 1.0);

              vec3 curColor = mix(u_color1, u_color2, smoothstep(0.0, 0.45, tCoord));
              curColor = mix(curColor, u_color3, smoothstep(0.45, 0.85, tCoord));

              // High-frequency filament rim highlight
              float highlightFactor = pow(clamp(val * 45.0, 0.0, 1.0), 3.0);
              curColor = mix(curColor, u_color4, highlightFactor * 0.65);

              // Shading with active scene light sources
              vec3 normDir = normalize(p + vec3(0.001));
              float diffKey = max(0.1, dot(normDir, normalize(u_keyLightPos)));
              float diffRim = pow(1.0 - max(0.0, dot(-d, normDir)), 2.0);

              vec3 lighting = u_ambientColor * u_ambientIntensity
                            + u_keyLightColor * (diffKey * u_keyLightIntensity)
                            + u_fillLightColor * (0.5 * u_fillLightIntensity)
                            + u_rimLightColor * (diffRim * u_rimLightIntensity);

              accumRgb += curColor * lighting * (val * u_sceneLightIntensity);
              accumDensity += val * 1.8;
            }
          }

          s = 1.0;
          float stepDist = e * R * u_stepFactor;
          p = (q += d * stepDist);

          // Logarithmic spherical polar coordinate transformation
          float lenP = max(length(p), 0.0001);
          R = lenP;
          float oldX = p.x;
          float oldY = p.y;
          float oldZ = p.z;

          p.x = log2(R) - t * u_speedA;
          p.y = exp2(-oldZ / R + u_expOffset);
          p.z = atan(oldY, oldX) - t * u_speedB;

          // Inner fractal gyroid & high-frequency FBM loop
          p.y -= 1.0;
          e = p.y;
          for (float iterS = 1.0; iterS < 300.0; iterS += iterS) {
            e += (dot(sin(p.xy * iterS) - 0.5, 0.5 - sin(p.zy * iterS))) / iterS * u_noiseScale;
          }
          s = 512.0;
        }

        // Scene Background & Greenscreen Chroma Keying
        vec3 finalCol;
        if (u_greenscreen) {
          vec3 greenKey = vec3(0.0, 1.0, 0.0);
          float blendFactor = clamp(accumDensity * 1.4, 0.0, 1.0);
          vec3 fractalToneMapped = acesFilm(accumRgb * u_exposure);
          finalCol = mix(greenKey, fractalToneMapped, blendFactor);
        } else {
          float blendFactor = clamp(accumDensity, 0.0, 1.0);
          vec3 fractalToneMapped = acesFilm(accumRgb * u_exposure);
          finalCol = mix(u_colorBg, fractalToneMapped, blendFactor);
          finalCol = pow(finalCol, vec3(1.0 / 2.2));
        }

        gl_FragColor = vec4(finalCol, 1.0);
      }
    `;

    const material = new THREE.ShaderMaterial({
      vertexShader,
      fragmentShader,
      uniforms,
      depthTest: false,
      depthWrite: false
    });

    const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
    scene.add(quad);

    // =========================================================================
    // HELPER FUNCTIONS & UNIFORM UPDATES
    // =========================================================================
    function updateShaderUniforms() {
      uniforms.u_exposure.value = settings.exposure;
      uniforms.u_sceneLightIntensity.value = settings.sceneLightIntensity;
      uniforms.u_keyLightIntensity.value = settings.keyLightIntensity;
      uniforms.u_keyLightColor.value.set(settings.keyLightColor);
      uniforms.u_keyLightPos.value.set(settings.keyLightPosX, settings.keyLightPosY, settings.keyLightPosZ);
      uniforms.u_rimLightIntensity.value = settings.rimLightIntensity;
      uniforms.u_rimLightColor.value.set(settings.rimLightColor);
      uniforms.u_fillLightIntensity.value = settings.fillLightIntensity;
      uniforms.u_fillLightColor.value.set(settings.fillLightColor);
      uniforms.u_ambientIntensity.value = settings.ambientIntensity;
      uniforms.u_ambientColor.value.set(settings.ambientColor);

      uniforms.u_color1.value.set(settings.color1);
      uniforms.u_color2.value.set(settings.color2);
      uniforms.u_color3.value.set(settings.color3);
      uniforms.u_color4.value.set(settings.color4);
      uniforms.u_colorBg.value.set(settings.background);

      uniforms.u_stepFactor.value = settings.stepFactor;
      uniforms.u_noiseScale.value = settings.noiseScale;
      uniforms.u_expOffset.value = settings.expOffset;
      uniforms.u_speedA.value = settings.speedA;
      uniforms.u_speedB.value = settings.speedB;
      uniforms.u_maxIterations.value = settings.maxIterations;
    }

    function applyColorScheme(schemeName) {
      if (!COLOR_SCHEMES[schemeName]) return;
      const s = COLOR_SCHEMES[schemeName];
      settings.color1 = s.color1;
      settings.color2 = s.color2;
      settings.color3 = s.color3;
      settings.color4 = s.color4;
      settings.background = s.background;

      if (!settings.greenScreen) {
        document.body.style.backgroundColor = s.background;
      }
      updateShaderUniforms();
      updateAllControllers(gui);
    }

    function applyGreenScreen(enabled) {
      settings.greenScreen = enabled;
      uniforms.u_greenscreen.value = enabled;
      if (enabled) {
        document.body.classList.add('greenscreen');
        document.body.style.backgroundColor = '#00ff00';
      } else {
        document.body.classList.remove('greenscreen');
        document.body.style.backgroundColor = settings.background;
      }
    }

    function resetTransform() {
      manualZoom = 1.0;
      manualPanX = 0.0;
      manualPanY = 0.0;
      settings.zoom = 1.0;
      settings.panX = 0.0;
      settings.panY = 0.0;
      updateAllControllers(gui);
    }

    function toggleAntialias(val) {
      settings.antialias = val;
      const oldCanvas = renderer.domElement;
      renderer.dispose();

      renderer = new THREE.WebGLRenderer({
        antialias: settings.antialias,
        powerPreference: 'high-performance'
      });
      renderer.setPixelRatio(settings.dpr);
      renderer.setSize(window.innerWidth, window.innerHeight);
      oldCanvas.replaceWith(renderer.domElement);
      attachCanvasEvents(renderer.domElement);
    }

    // Tait-Bryan rotation matrix from yaw, pitch, roll
    function getRotationMatrix(yaw, pitch, roll) {
      const cy = Math.cos(yaw),   sy = Math.sin(yaw);
      const cp = Math.cos(pitch), sp = Math.sin(pitch);
      const cr = Math.cos(roll),  sr = Math.sin(roll);

      return new THREE.Matrix3().set(
        cy * cr + sy * sp * sr, -cy * sr + sy * sp * cr, sy * cp,
        cp * sr,                 cp * cr,                -sp,
        -sy * cr + cy * sp * sr, sy * sr + cy * sp * cr, cy * cp
      );
    }

    // Recursive helper to update all lil-gui controllers
    function updateAllControllers(folder) {
      if (!folder) return;
      if (folder.controllers) {
        for (const c of folder.controllers) c.updateDisplay();
      }
      if (folder.folders) {
        for (const f of folder.folders) updateAllControllers(f);
      }
    }

    // =========================================================================
    // RANDOM PROCEDURAL VARIATION ON CLICK
    // =========================================================================
    function randomizeProceduralScene() {
      // 1. Pick a random color scheme
      const schemes = Object.keys(COLOR_SCHEMES);
      const chosenScheme = schemes[Math.floor(Math.random() * schemes.length)];
      settings.colorScheme = chosenScheme;
      applyColorScheme(chosenScheme);

      // 2. Re-roll geometric parameters
      settings.stepFactor = +(0.18 + Math.random() * 0.28).toFixed(3);
      settings.noiseScale = +(0.15 + Math.random() * 0.40).toFixed(3);
      settings.expOffset = +(0.65 + Math.random() * 0.65).toFixed(3);
      settings.speedA = +(0.45 + Math.random() * 0.70).toFixed(3);
      settings.speedB = +(0.20 + Math.random() * 0.50).toFixed(3);

      // 3. Re-roll lighting parameters
      settings.exposure = +(0.75 + Math.random() * 0.55).toFixed(2);
      settings.sceneLightIntensity = +(0.80 + Math.random() * 0.60).toFixed(2);
      settings.keyLightIntensity = +(0.80 + Math.random() * 0.90).toFixed(2);
      settings.rimLightIntensity = +(0.80 + Math.random() * 1.00).toFixed(2);
      settings.fillLightIntensity = +(0.50 + Math.random() * 0.70).toFixed(2);
      settings.ambientIntensity = +(0.30 + Math.random() * 0.40).toFixed(2);

      // 4. Re-roll motion & animation preset
      const randomPreset = ANIMATION_PRESETS[Math.floor(Math.random() * ANIMATION_PRESETS.length)];
      settings.animationPreset = randomPreset;
      settings.animSpeed = +(0.6 + Math.random() * 0.8).toFixed(2);

      // 5. Update shader and GUI
      updateShaderUniforms();
      updateAllControllers(gui);
    }

    // =========================================================================
    // INTERACTION LISTENERS (WHEEL ZOOM, POINTER DRAG & CLICK)
    // =========================================================================
    function attachCanvasEvents(dom) {
      dom.addEventListener('pointerdown', (e) => {
        if (e.target.closest('.lil-gui')) return;
        isDragging = true;
        pointerStartX = e.clientX;
        pointerStartY = e.clientY;
        panStartX = manualPanX;
        panStartY = manualPanY;
        document.body.classList.add('grabbing');
      });

      window.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        const dx = e.clientX - pointerStartX;
        const dy = e.clientY - pointerStartY;
        const scale = (2.0 * manualZoom) / Math.min(window.innerWidth, window.innerHeight);

        manualPanX = panStartX - dx * scale;
        manualPanY = panStartY + dy * scale;
        settings.panX = manualPanX;
        settings.panY = manualPanY;
      });

      window.addEventListener('pointerup', (e) => {
        if (!isDragging) return;
        isDragging = false;
        document.body.classList.remove('grabbing');

        // Check if this was a click (distance < 6px)
        const dist = Math.hypot(e.clientX - pointerStartX, e.clientY - pointerStartY);
        if (dist < 6 && settings.clickRandomize && !e.target.closest('.lil-gui')) {
          randomizeProceduralScene();
        }
      });

      window.addEventListener('wheel', (e) => {
        if (e.target.closest('.lil-gui')) return;
        e.preventDefault();
        const factor = e.deltaY < 0 ? 1.08 : 0.92;
        manualZoom = Math.max(0.1, Math.min(15.0, manualZoom * factor));
        settings.zoom = manualZoom;
      }, { passive: false });
    }

    attachCanvasEvents(renderer.domElement);

    // Keyboard shortcut ('H' key) to toggle UI visibility
    let isGuiVisible = true;
    window.addEventListener('keydown', (e) => {
      if (e.key.toLowerCase() === 'h') {
        isGuiVisible = !isGuiVisible;
        if (isGuiVisible) {
          gui.show();
        } else {
          gui.hide();
        }
      }
    });

    // Window resize handler
    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      uniforms.u_resolution.value.set(window.innerWidth, window.innerHeight);
    });

    // =========================================================================
    // LIL-GUI SETUP
    // =========================================================================
    const gui = new GUI({ title: 'Procedural Fractal 404' });

    // General Mode Switches
    gui.add(settings, 'greenScreen').name('Green Screen (#00ff00)').onChange(applyGreenScreen);
    gui.add(settings, 'clickRandomize').name('Click to Randomize');

    // Color Schemes Folder
    const fColors = gui.addFolder('Color Schemes');
    fColors.add(settings, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Preset Scheme').onChange(applyColorScheme);
    fColors.addColor(settings, 'color1').name('Core Tint').onChange(updateShaderUniforms);
    fColors.addColor(settings, 'color2').name('Mid Ridge Tint').onChange(updateShaderUniforms);
    fColors.addColor(settings, 'color3').name('High Peak Tint').onChange(updateShaderUniforms);
    fColors.addColor(settings, 'color4').name('Filament Highlight').onChange(updateShaderUniforms);
    fColors.addColor(settings, 'background').name('Void Background').onChange(v => {
      if (!settings.greenScreen) document.body.style.backgroundColor = v;
      updateShaderUniforms();
    });

    // Lighting & Exposure Folder
    const fLight = gui.addFolder('Lighting & Exposure');
    fLight.add(settings, 'exposure', 0.1, 3.0, 0.05).name('Exposure').onChange(updateShaderUniforms);
    fLight.add(settings, 'sceneLightIntensity', 0.1, 4.0, 0.05).name('Scene Light Intensity').onChange(updateShaderUniforms);

    const fKeyLight = fLight.addFolder('Key Light');
    fKeyLight.add(settings, 'keyLightIntensity', 0.0, 3.0, 0.05).name('Intensity').onChange(updateShaderUniforms);
    fKeyLight.addColor(settings, 'keyLightColor').name('Color').onChange(updateShaderUniforms);
    fKeyLight.add(settings, 'keyLightPosX', -5.0, 5.0, 0.1).name('Position X').onChange(updateShaderUniforms);
    fKeyLight.add(settings, 'keyLightPosY', -5.0, 5.0, 0.1).name('Position Y').onChange(updateShaderUniforms);
    fKeyLight.add(settings, 'keyLightPosZ', -5.0, 5.0, 0.1).name('Position Z').onChange(updateShaderUniforms);

    const fRimLight = fLight.addFolder('Rim Light');
    fRimLight.add(settings, 'rimLightIntensity', 0.0, 3.0, 0.05).name('Intensity').onChange(updateShaderUniforms);
    fRimLight.addColor(settings, 'rimLightColor').name('Color').onChange(updateShaderUniforms);

    const fFillLight = fLight.addFolder('Fill Light');
    fFillLight.add(settings, 'fillLightIntensity', 0.0, 3.0, 0.05).name('Intensity').onChange(updateShaderUniforms);
    fFillLight.addColor(settings, 'fillLightColor').name('Color').onChange(updateShaderUniforms);

    const fAmbient = fLight.addFolder('Ambient Light');
    fAmbient.add(settings, 'ambientIntensity', 0.0, 2.0, 0.05).name('Intensity').onChange(updateShaderUniforms);
    fAmbient.addColor(settings, 'ambientColor').name('Color').onChange(updateShaderUniforms);

    // Animation & Camera Controls
    const fAnim = gui.addFolder('Animation & Camera');
    fAnim.add(settings, 'animationPreset', ANIMATION_PRESETS).name('Preset Animation');
    fAnim.add(settings, 'animSpeed', 0.0, 3.0, 0.05).name('Animation Speed');
    fAnim.add(settings, 'zoom', 0.1, 8.0, 0.02).name('Zoom (Wheel)').listen().onChange(v => { manualZoom = v; });
    fAnim.add(settings, 'panX', -3.0, 3.0, 0.01).name('Pan X (Drag)').listen().onChange(v => { manualPanX = v; });
    fAnim.add(settings, 'panY', -3.0, 3.0, 0.01).name('Pan Y (Drag)').listen().onChange(v => { manualPanY = v; });
    fAnim.add({ reset: resetTransform }, 'reset').name('Reset Pan & Zoom');

    // Render Settings Folder
    const fRender = gui.addFolder('Render Settings');
    fRender.add(settings, 'antialias').name('Three.js Antialias').onChange(toggleAntialias);
    fRender.add(settings, 'dpr', 0.5, 3.0, 0.1).name('DPR (Pixel Ratio)').onChange(v => { renderer.setPixelRatio(v); });
    fRender.add(settings, 'maxIterations', 30, 140, 1).name('Raymarch Steps').onChange(updateShaderUniforms);

    // Procedural Geometry Folder
    const fGeo = gui.addFolder('Fractal Parameters');
    fGeo.add(settings, 'stepFactor', 0.05, 0.8, 0.01).name('Ray Step Factor').onChange(updateShaderUniforms);
    fGeo.add(settings, 'noiseScale', 0.05, 1.0, 0.01).name('Noise Scale').onChange(updateShaderUniforms);
    fGeo.add(settings, 'expOffset', 0.2, 2.0, 0.02).name('Curvature Exp').onChange(updateShaderUniforms);
    fGeo.add(settings, 'speedA', 0.1, 2.0, 0.05).name('Radial Warp').onChange(updateShaderUniforms);
    fGeo.add(settings, 'speedB', 0.05, 1.5, 0.02).name('Vortex Twist').onChange(updateShaderUniforms);

    fGeo.close();
    fLight.close();

    // =========================================================================
    // AUTO INFINITE ANIMATION LOOP
    // =========================================================================
    (function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      animTime += delta * settings.animSpeed;
      uniforms.u_time.value = animTime;

      // Calculate camera transforms based on active preset animation
      let curZoom = manualZoom;
      let curPanX = manualPanX;
      let curPanY = manualPanY;
      let yaw = 0.0;
      let pitch = 0.0;
      let roll = 0.0;

      const preset = settings.animationPreset;

      if (preset === 'Static (No Camera Movement)') {
        // Locked camera position with manual pan/zoom
      } else if (preset === 'Gentle Cosmic Drift') {
        curPanX += Math.sin(animTime * 0.25) * 0.08 * manualZoom;
        curPanY += Math.cos(animTime * 0.18) * 0.05 * manualZoom;
        curZoom *= (1.0 + Math.sin(animTime * 0.20) * 0.06);
        pitch = Math.sin(animTime * 0.15) * 0.04;
      } else if (preset === 'Slow Polar Vortex') {
        yaw = animTime * 0.12;
        curZoom *= (1.0 + Math.sin(animTime * 0.25) * 0.08);
      } else if (preset === 'Deep Harmonic Breathing') {
        curZoom *= (1.0 + Math.sin(animTime * 0.35) * 0.22);
        pitch = Math.sin(animTime * 0.22) * 0.08;
      } else if (preset === 'Lissajous Infinity Loop') {
        curPanX += Math.sin(animTime * 0.22) * 0.12 * manualZoom;
        curPanY += Math.sin(animTime * 0.44) * 0.06 * manualZoom;
        yaw = Math.sin(animTime * 0.22) * 0.12;
      } else if (preset === 'Horizon Pitch & Roll') {
        pitch = Math.sin(animTime * 0.25) * 0.14;
        roll = Math.cos(animTime * 0.20) * 0.08;
        curPanY += Math.sin(animTime * 0.30) * 0.04 * manualZoom;
      } else if (preset === 'Zenith Aerial Survey') {
        pitch = 0.18 + Math.sin(animTime * 0.18) * 0.06;
        yaw = Math.cos(animTime * 0.14) * 0.16;
        curZoom *= (1.0 + Math.cos(animTime * 0.18) * 0.10);
      } else if (preset === 'Cosmic Pendulum Sway') {
        roll = Math.sin(animTime * 0.28) * 0.12;
        curPanX += Math.sin(animTime * 0.28) * 0.10 * manualZoom;
      }

      uniforms.u_zoom.value = curZoom;
      uniforms.u_pan.value.set(curPanX, curPanY);
      uniforms.u_rot.value.copy(getRotationMatrix(yaw, pitch, roll));

      renderer.render(scene, camera);
    })();

  </script>
</body>
</html>
