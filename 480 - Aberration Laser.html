  <!-- fragmentShader -->
  <script id="js-fragment-shader" type="x-shader/x-fragment">
precision highp float;

uniform vec2 resolution;
uniform float time;
uniform float xScale;
uniform float yScale;
uniform float distortion;
uniform float thickness;
uniform float harmonics;
uniform int waveMode;
uniform int dispersionType;

// View / Transform
uniform vec2 pan;
uniform float zoom;
uniform float rotation;
uniform float tilt;

// Interactive Mouse
uniform vec2 mouse;
uniform float mouseInfluence;

// Color schemes & Styling
uniform int colorSchemeIndex;
uniform vec3 color1;
uniform vec3 color2;
uniform vec3 color3;
uniform vec3 glowTint;
uniform vec3 backgroundColor;
uniform bool greenscreen;
uniform bool toneMappingEnabled;

// Virtual 3D Surface Lighting
uniform float exposure;
uniform float masterLightIntensity;
uniform vec3 ambientColor;
uniform float ambientIntensity;
uniform vec3 dirLightColor;
uniform float dirLightIntensity;
uniform vec3 dirLightDir;
uniform vec3 pointLightColor;
uniform float pointLightIntensity;
uniform vec3 pointLightPos;

float safeCosh(float x) {
  float e = exp(clamp(x, -15.0, 15.0));
  return (e + 1.0 / e) * 0.5;
}

void main() {
  // Screen-space coordinates centered at origin [-aspect..aspect, -1..1]
  vec2 p = (gl_FragCoord.xy * 2.0 - resolution) / min(resolution.x, resolution.y);

  // Pan & Zoom transform
  p = (p - pan) / max(0.0001, zoom);

  // 2D In-plane rotation
  float cr = cos(rotation);
  float sr = sin(rotation);
  p = mat2(cr, -sr, sr, cr) * p;

  // Perspective 3D tilt
  float ct = cos(tilt);
  float st = sin(tilt);
  p.y = p.y / max(0.12, ct - p.x * st * 0.35);

  // Interactive mouse displacement (smooth gaussian pull)
  vec2 m = (mouse * 2.0 - 1.0);
  m.x *= (resolution.x / min(resolution.x, resolution.y));
  m.y *= (resolution.y / min(resolution.x, resolution.y));
  float mDist = length(p - m);
  float mPull = exp(-mDist * 2.5) * mouseInfluence;
  p.y -= m.y * mPull * 0.55;

  // Chromatic dispersion distance calculation
  float d = 0.0;
  if (dispersionType == 0) {
    // CodePen Radial Lens Exact
    d = length(p) * distortion;
  } else if (dispersionType == 1) {
    // Horizontal Linear Prism
    d = (p.x * 0.75 + 0.25 * length(p)) * distortion;
  } else if (dispersionType == 2) {
    // Polar Vortex Aberration
    float ang = atan(p.y, p.x);
    d = (length(p) * (1.0 + 0.35 * sin(ang * 4.0))) * distortion;
  } else {
    // Spherical Lens Barrel
    float r2 = dot(p, p);
    d = (r2 * 0.85 + 0.15 * length(p)) * distortion;
  }

  // Chromatic channel coordinate separation
  float rx = p.x * (1.0 + d);
  float gx = p.x;
  float bx = p.x * (1.0 - d);

  // Wave elevation per chromatic channel
  float waveR = 0.0;
  float waveG = 0.0;
  float waveB = 0.0;

  if (waveMode == 0) {
    // CodePen Classic Sine
    waveR = sin((rx + time) * xScale) * yScale;
    waveG = sin((gx + time) * xScale) * yScale;
    waveB = sin((bx + time) * xScale) * yScale;
  } else if (waveMode == 1) {
    // Dual Resonant Harmonics
    waveR = sin((rx + time) * xScale) * yScale + sin((rx * 2.4 - time * 1.25)) * (yScale * 0.35 * harmonics);
    waveG = sin((gx + time) * xScale) * yScale + sin((gx * 2.4 - time * 1.25)) * (yScale * 0.35 * harmonics);
    waveB = sin((bx + time) * xScale) * yScale + sin((bx * 2.4 - time * 1.25)) * (yScale * 0.35 * harmonics);
  } else if (waveMode == 2) {
    // Triple Crossing Lasers
    float h1R = sin((rx + time) * xScale) * yScale;
    float h2R = cos((rx * 1.6 - time * 0.75) * xScale) * (yScale * 0.55);
    waveR = (h1R + h2R) * 0.72;

    float h1G = sin((gx + time) * xScale) * yScale;
    float h2G = cos((gx * 1.6 - time * 0.75) * xScale) * (yScale * 0.55);
    waveG = (h1G + h2G) * 0.72;

    float h1B = sin((bx + time) * xScale) * yScale;
    float h2B = cos((bx * 1.6 - time * 0.75) * xScale) * (yScale * 0.55);
    waveB = (h1B + h2B) * 0.72;
  } else if (waveMode == 3) {
    // Soliton Pulse
    float sR = sin((rx + time) * xScale * 0.5);
    float sG = sin((gx + time) * xScale * 0.5);
    float sB = sin((bx + time) * xScale * 0.5);
    waveR = (1.0 / safeCosh(sR * 4.0)) * yScale * 1.4 - yScale * 0.4;
    waveG = (1.0 / safeCosh(sG * 4.0)) * yScale * 1.4 - yScale * 0.4;
    waveB = (1.0 / safeCosh(sB * 4.0)) * yScale * 1.4 - yScale * 0.4;
  } else {
    // Lissajous Knot Beam
    waveR = sin((rx + time) * xScale) * yScale + sin(rx * 3.2 + cos(time * 0.6)) * (yScale * 0.3 * harmonics);
    waveG = sin((gx + time) * xScale) * yScale + sin(gx * 3.2 + cos(time * 0.6)) * (yScale * 0.3 * harmonics);
    waveB = sin((bx + time) * xScale) * yScale + sin(bx * 3.2 + cos(time * 0.6)) * (yScale * 0.3 * harmonics);
  }

  // Distance from pixel y to wave profile
  float distR = abs(p.y + waveR);
  float distG = abs(p.y + waveG);
  float distB = abs(p.y + waveB);

  // Core inverse-distance laser intensity
  float rVal = thickness / max(distR, 0.001);
  float gVal = thickness / max(distG, 0.001);
  float bVal = thickness / max(distB, 0.001);

  vec3 rgbOutput;
  if (colorSchemeIndex == 0) {
    // Exact CodePen Original formula
    rgbOutput = vec3(rVal, gVal, bVal);
  } else {
    // Rich chromatic mapping to custom or preset colors
    rgbOutput = rVal * color1 + gVal * color2 + bVal * color3;
    float coreDist = min(distR, min(distG, distB));
    float coreGlow = (thickness * 0.65) / max(coreDist, 0.002);
    rgbOutput += coreGlow * glowTint;
  }

  // Virtual surface normals for 3D lighting modulation
  float slope = -cos((gx + time) * xScale) * xScale * yScale;
  vec3 N = normalize(vec3(-slope, 1.0, 0.6));
  vec3 V = vec3(0.0, 0.0, 1.0);
  vec3 surfacePos = vec3(p.x, p.y, -min(distR, min(distG, distB)) * 1.8);

  // Ambient Light
  vec3 amb = ambientColor * ambientIntensity;

  // Directional Light
  vec3 L_dir = normalize(-dirLightDir);
  float diffDir = max(0.0, dot(N, L_dir));
  vec3 H_dir = normalize(L_dir + V);
  float specDir = pow(max(0.0, dot(N, H_dir)), 24.0);
  vec3 dirLit = dirLightColor * dirLightIntensity * (diffDir * 0.65 + specDir * 0.45);

  // Point Light
  vec3 toPt = pointLightPos - surfacePos;
  float dPt = length(toPt);
  vec3 L_pt = normalize(toPt);
  float att = 1.0 / (1.0 + 0.35 * dPt * dPt);
  float diffPt = max(0.0, dot(N, L_pt));
  vec3 H_pt = normalize(L_pt + V);
  float specPt = pow(max(0.0, dot(N, H_pt)), 24.0);
  vec3 ptLit = pointLightColor * pointLightIntensity * att * (diffPt * 0.6 + specPt * 0.55);

  vec3 totalLight = (amb + dirLit + ptLit) * masterLightIntensity;

  // Modulate beam with surface illumination
  vec3 litWave = rgbOutput * (0.65 + 0.35 * totalLight) + totalLight * 0.08 * (rVal + gVal + bVal);

  // Background composition
  vec3 bg = greenscreen ? vec3(0.0, 1.0, 0.0) : backgroundColor;
  float energy = max(litWave.r, max(litWave.g, litWave.b));
  float alpha = clamp(1.0 - exp(-energy * 1.6), 0.0, 1.0);

  vec3 compColor = mix(bg, litWave, alpha);

  // Tone mapping and greenscreen pass
  vec3 finalColor = compColor;
  if (toneMappingEnabled) {
    finalColor = vec3(1.0) - exp(-compColor * exposure);
  }
  if (greenscreen) {
    finalColor = mix(vec3(0.0, 1.0, 0.0), finalColor, alpha);
  }

  gl_FragColor = vec4(finalColor, 1.0);
}
  </script>

    // =========================================================================

    const params = {

    // =========================================================================
    // STAGE CLASS (Architecture faithful to CodePen)
    // =========================================================================
    class Stage {
      constructor() {
        this.canvas = document.getElementById('webgl-canvas');
        this.renderParam = {
          clearColor: 0x000000,
          width: window.innerWidth,
          height: window.innerHeight
        };

        this.cameraParam = {
          left: -1,
          right: 1,
          top: 1,
          bottom: -1,
          near: 0,
          far: 1
        };

        this.scene = null;
        this.camera = null;
        this.renderer = null;

        this.isInitialized = false;
      }

      init() {
        this._setScene();
        this._setRender();
        this._setCamera();
        this.isInitialized = true;
      }

      _setScene() {
        this.scene = new THREE.Scene();
      }

      _setRender() {
        this.renderer = new THREE.WebGLRenderer({
          canvas: this.canvas,
          antialias: true,
          powerPreference: 'high-performance',
          preserveDrawingBuffer: true
        });
        this.renderer.setPixelRatio(params.dpr);
        this.renderer.setSize(this.renderParam.width, this.renderParam.height);
        this._updateClearColor();
      }

      _updateClearColor() {
        const c = params.greenscreen ? 0x00ff00 : new THREE.Color(params.backgroundColor);
        this.renderer.setClearColor(c, 1.0);
      }

      _setCamera() {
        if (!this.isInitialized) {
          this.camera = new THREE.OrthographicCamera(
            this.cameraParam.left,
            this.cameraParam.right,
            this.cameraParam.top,
            this.cameraParam.bottom,
            this.cameraParam.near,
            this.cameraParam.far
          );
        }
        this.renderer.setSize(window.innerWidth, window.innerHeight);
      }

      _render() {
        this.renderer.render(this.scene, this.camera);
      }

      onResize() {
        this.renderParam.width = window.innerWidth;
        this.renderParam.height = window.innerHeight;
        this.renderer.setSize(window.innerWidth, window.innerHeight);
      }

      onRaf() {
        this._render();
      }
    }

    // =========================================================================
    // MESH CLASS (CodePen Shaders + Synthesizer Enhancements)
    // =========================================================================
    class Mesh {
      constructor(stage) {
        this.stage = stage;
        this.canvas = document.getElementById('webgl-canvas');

        // Dynamic view states
        this.userPan = new THREE.Vector2(0, 0);
        this.userZoom = 1.0;
        this.userRotation = 0.0;
        this.userTilt = 0.0;

        this.mouseNDC = new THREE.Vector2(0.5, 0.5);

        // Diffuse pulse animation state
        this.diffuseActive = false;
        this.diffuseTime = 0.0;
        this.diffuseDuration = 1.2;

        this.uniforms = {
          resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
          time: { value: 0.0 },
          xScale: { value: params.xScale },
          yScale: { value: params.yScale },
          distortion: { value: params.distortion },

          harmonics: { value: params.harmonics },
          waveMode: { value: WAVE_MODES.indexOf(params.waveMode) },

          pan: { value: new THREE.Vector2(0, 0) },
          zoom: { value: 1.0 },
          rotation: { value: 0.0 },
          tilt: { value: 0.0 },

          mouse: { value: new THREE.Vector2(0.5, 0.5) },
          mouseInfluence: { value: params.mouseInfluence },

          colorSchemeIndex: { value: 0 },
          color1: { value: new THREE.Color(params.color1) },
          color2: { value: new THREE.Color(params.color2) },
          color3: { value: new THREE.Color(params.color3) },
          glowTint: { value: new THREE.Color(params.glowTint) },
          backgroundColor: { value: new THREE.Color(params.backgroundColor) },
          greenscreen: { value: params.greenscreen },
          toneMappingEnabled: { value: params.toneMappingEnabled },

          exposure: { value: params.exposure },
          masterLightIntensity: { value: params.masterLightIntensity },
          ambientColor: { value: new THREE.Color(initialScheme.ambient) },
          ambientIntensity: { value: params.ambientIntensity },
          dirLightColor: { value: new THREE.Color(initialScheme.dirLight) },
          dirLightIntensity: { value: params.dirLightIntensity },
          dirLightDir: { value: new THREE.Vector3(1.0, 1.5, 2.0).normalize() },
          pointLightColor: { value: new THREE.Color(initialScheme.pointLight) },
          pointLightIntensity: { value: params.pointLightIntensity },
          pointLightPos: { value: new THREE.Vector3(0.0, 0.0, 1.0) }
        };

        this.mesh = null;
      }

      init() {
        this._setMesh();
      }

      _setMesh() {
        const position = [
          -1.0, -1.0, 0.0,
           1.0, -1.0, 0.0,
          -1.0,  1.0, 0.0,
           1.0, -1.0, 0.0,
          -1.0,  1.0, 0.0,
           1.0,  1.0, 0.0
        ];

        const positions = new THREE.BufferAttribute(new Float32Array(position), 3);
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', positions);

        const material = new THREE.RawShaderMaterial({
          vertexShader: document.getElementById('js-vertex-shader').textContent,
          fragmentShader: document.getElementById('js-fragment-shader').textContent,
          uniforms: this.uniforms,
          side: THREE.DoubleSide
        });

        this.mesh = new THREE.Mesh(geometry, material);
        this.stage.scene.add(this.mesh);
      }

      // Elegant CodePen Diffuse Resonance Trigger
      _diffuse() {
        this.diffuseActive = true;
        this.diffuseTime = 0.0;
      }

      onResize() {
        this.uniforms.resolution.value.set(window.innerWidth, window.innerHeight);
      }

      _updateMotion(deltaTime, elapsedTime) {
        if (!params.isPaused) {
          this.uniforms.time.value += deltaTime * 1.5 * params.waveSpeed;
        }

        // Camera Motion Presets
        let camPanX = 0;
        let camPanY = 0;
        let camRot = 0;
        let camTilt = 0;
        let camZoom = 1.0;

        const tAnim = elapsedTime * params.animationSpeed;

        switch (params.animation) {
          case 'Gentle Horizon Orbit':
            camRot = Math.sin(tAnim * 0.4) * 0.14;
            camTilt = Math.sin(tAnim * 0.3) * 0.12;
            camPanX = Math.sin(tAnim * 0.25) * 0.14;
            camPanY = Math.cos(tAnim * 0.35) * 0.08;
            break;
          case 'Slow Harmonic Drift':
            camPanX = Math.sin(tAnim * 0.3) * 0.28;
            camPanY = Math.cos(tAnim * 0.22) * 0.20;
            camRot = Math.sin(tAnim * 0.16) * 0.09;
            break;
          case 'Cinematic Lissajous Pan':
            camPanX = Math.sin(tAnim * 0.5) * 0.32;
            camPanY = Math.sin(tAnim * 1.0) * 0.22;
            camTilt = Math.cos(tAnim * 0.5) * 0.18;
            break;
          case 'Floating Pendulum Sway':
            camRot = Math.sin(tAnim * 0.75) * 0.26;
            camTilt = Math.abs(Math.sin(tAnim * 0.75)) * 0.16;
            break;
          case 'Cosmic Spiral Ascend':
            camRot = tAnim * 0.12;
            camPanX = Math.cos(tAnim * 0.4) * 0.22;
            camPanY = Math.sin(tAnim * 0.4) * 0.22;
            break;
          case 'Ethereal Breathing Glide':
            camZoom = 1.0 + Math.sin(tAnim * 0.5) * 0.22;
            camTilt = Math.sin(tAnim * 0.4) * 0.12;
            break;
          case 'Dynamic Oblique Wave':
            camTilt = 0.22 + Math.sin(tAnim * 0.6) * 0.18;
            camRot = Math.cos(tAnim * 0.5) * 0.16;
            break;
          case 'Static (No Camera Motion)':
          default:
            break;
        }

        // Combine procedural camera animation with persistent user drag transforms
        this.uniforms.pan.value.set(this.userPan.x + camPanX, this.userPan.y + camPanY);
        this.uniforms.zoom.value = this.userZoom * camZoom;
        this.uniforms.rotation.value = this.userRotation + camRot;
        this.uniforms.tilt.value = this.userTilt + camTilt;

        // Diffuse Pulse Shockwave Modulation
        let diffuseXBoost = 0;
        let diffuseYBoost = 0;

        if (params.continuousDiffuse) {
          const breath = (Math.sin(elapsedTime * 3.5) * 0.5 + 0.5);
          diffuseXBoost = breath * 1.2;
          diffuseYBoost = breath * 0.5;
        } else if (this.diffuseActive) {
          this.diffuseTime += deltaTime;
          const prog = this.diffuseTime / this.diffuseDuration;
          if (prog >= 1.0) {
            this.diffuseActive = false;
          } else {
            const envelope = Math.sin(prog * Math.PI) * Math.exp(-prog * 2.2);
            diffuseXBoost = envelope * 1.8;
            diffuseYBoost = envelope * 0.7;
          }
        }

        this.uniforms.xScale.value = params.xScale + diffuseXBoost;
        this.uniforms.yScale.value = params.yScale + diffuseYBoost;

        // Update interactive mouse
        this.uniforms.mouse.value.copy(this.mouseNDC);
      }

      onRaf(deltaTime, elapsedTime) {
        this._updateMotion(deltaTime, elapsedTime);
      }
    }

    // =========================================================================
    // COLOR SCHEME LOGIC
    // =========================================================================
    function applyColorScheme(name, mesh, stage) {
      const scheme = COLOR_SCHEMES[name];
      if (!scheme) return;

      params.colorScheme = name;
      params.backgroundColor = scheme.background;
      params.color1 = scheme.color1;
      params.color2 = scheme.color2;
      params.color3 = scheme.color3;
      params.glowTint = scheme.glow;

      mesh.uniforms.colorSchemeIndex.value = (name === 'Original') ? 0 : 1;
      mesh.uniforms.color1.value.set(scheme.color1);
      mesh.uniforms.color2.value.set(scheme.color2);
      mesh.uniforms.color3.value.set(scheme.color3);
      mesh.uniforms.glowTint.value.set(scheme.glow);
      mesh.uniforms.backgroundColor.value.set(scheme.background);
      mesh.uniforms.ambientColor.value.set(scheme.ambient);
      mesh.uniforms.dirLightColor.value.set(scheme.dirLight);
      mesh.uniforms.pointLightColor.value.set(scheme.pointLight);

      stage._updateClearColor();
    }

    // =========================================================================
    // INTERACTION HANDLERS (Drag Pan, Rotate, Wheel Zoom, Click)
    // =========================================================================
    let isDragging = false;
    let dragButton = 0;
    let dragStartX = 0;
    let dragStartY = 0;
    let pointerDownTime = 0;

    function setupInteractions(canvas, mesh, stage) {
      canvas.addEventListener('pointerdown', (e) => {
        isDragging = true;
        dragButton = e.button;
        dragStartX = e.clientX;
        dragStartY = e.clientY;
        pointerDownTime = performance.now();
      });

      window.addEventListener('pointermove', (e) => {
        mesh.mouseNDC.x = e.clientX / window.innerWidth;
        mesh.mouseNDC.y = 1.0 - (e.clientY / window.innerHeight);

        if (!isDragging) return;

        const dx = e.clientX - dragStartX;
        const dy = e.clientY - dragStartY;
        dragStartX = e.clientX;
        dragStartY = e.clientY;

        const aspect = window.innerWidth / Math.min(window.innerWidth, window.innerHeight);

        if (dragButton === 0 && !e.shiftKey) {
          // Left drag: Pan view
          mesh.userPan.x += (dx / window.innerWidth) * (aspect * 1.8) / mesh.userZoom;
          mesh.userPan.y -= (dy / window.innerHeight) * 1.8 / mesh.userZoom;
        } else {
          // Right drag or Shift + Left drag: In-plane rotate & Tilt
          mesh.userRotation += dx * 0.005;
          mesh.userTilt = Math.max(-0.8, Math.min(0.8, mesh.userTilt + dy * 0.005));
        }
      });

      window.addEventListener('pointerup', (e) => {
        if (!isDragging) return;
        isDragging = false;

        const duration = performance.now() - pointerDownTime;
        const dist = Math.hypot(e.clientX - dragStartX, e.clientY - dragStartY);

        // Click detection threshold
        if (duration < 280 && dist < 8 && e.target === canvas && e.button === 0) {
          if (params.clickAction === 'Trigger Diffuse Pulse') {
            mesh._diffuse();
          } else if (params.clickAction === 'Randomize Scene') {
            randomizeScene(mesh, stage);
          }
        }
      });

      canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomDelta = e.deltaY * -0.0012;
        mesh.userZoom = Math.max(0.2, Math.min(5.0, mesh.userZoom * (1.0 + zoomDelta)));
      }, { passive: false });

      canvas.addEventListener('contextmenu', (e) => e.preventDefault());
    }

    // =========================================================================
    // RANDOMIZER & PROCEDURAL EXPLORATION
    // =========================================================================
    function randomizeScene(mesh, stage) {
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const chosenScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      applyColorScheme(chosenScheme, mesh, stage);

      params.waveMode = WAVE_MODES[Math.floor(Math.random() * WAVE_MODES.length)];
      mesh.uniforms.waveMode.value = WAVE_MODES.indexOf(params.waveMode);

      params.dispersionType = DISPERSION_TYPES[Math.floor(Math.random() * DISPERSION_TYPES.length)];
      mesh.uniforms.dispersionType.value = DISPERSION_TYPES.indexOf(params.dispersionType);

      params.animation = ANIMATION_PRESETS[Math.floor(Math.random() * ANIMATION_PRESETS.length)];

      params.xScale = +(0.4 + Math.random() * 2.2).toFixed(2);
      params.yScale = +(0.2 + Math.random() * 0.8).toFixed(2);
      params.distortion = +(0.015 + Math.random() * 0.09).toFixed(3);
      params.thickness = +(0.025 + Math.random() * 0.06).toFixed(3);
      params.harmonics = +(Math.random() < 0.4 ? 0.0 : Math.random() * 0.8).toFixed(2);

      params.animationSpeed = +(0.6 + Math.random() * 1.2).toFixed(2);
      params.waveSpeed = +(0.6 + Math.random() * 1.2).toFixed(2);

      mesh.uniforms.xScale.value = params.xScale;
      mesh.uniforms.yScale.value = params.yScale;
      mesh.uniforms.distortion.value = params.distortion;
      mesh.uniforms.thickness.value = params.thickness;
      mesh.uniforms.harmonics.value = params.harmonics;

      mesh._diffuse();
      updateGuiControllers();
    }

    function resetView(mesh) {
      mesh.userPan.set(0, 0);
      mesh.userZoom = 1.0;
      mesh.userRotation = 0.0;
      mesh.userTilt = 0.0;
    }

    function resetDefaults(mesh, stage) {
      applyColorScheme('Original', mesh, stage);
      params.greenscreen = false;
      mesh.uniforms.greenscreen.value = false;

      params.waveMode = 'Classic Sine (CodePen)';
      mesh.uniforms.waveMode.value = 0;

      params.dispersionType = 'Radial Lens (CodePen)';
      mesh.uniforms.dispersionType.value = 0;

      params.animation = 'Gentle Horizon Orbit';
      params.animationSpeed = 1.0;
      params.waveSpeed = 1.0;
      params.isPaused = false;
      params.continuousDiffuse = false;

      params.xScale = 1.0;
      params.yScale = 0.5;
      params.distortion = 0.050;
      params.thickness = 0.050;
      params.harmonics = 0.0;

      params.toneMappingEnabled = true;
      params.exposure = 1.0;
      params.masterLightIntensity = 1.0;
      params.ambientIntensity = 0.5;
      params.dirLightIntensity = 1.0;
      params.pointLightIntensity = 1.0;

      mesh.uniforms.xScale.value = 1.0;
      mesh.uniforms.yScale.value = 0.5;
      mesh.uniforms.distortion.value = 0.050;
      mesh.uniforms.thickness.value = 0.050;
      mesh.uniforms.harmonics.value = 0.0;
      mesh.uniforms.toneMappingEnabled.value = true;
      mesh.uniforms.exposure.value = 1.0;
      mesh.uniforms.masterLightIntensity.value = 1.0;
      mesh.uniforms.ambientIntensity.value = 0.5;
      mesh.uniforms.dirLightIntensity.value = 1.0;
      mesh.uniforms.pointLightIntensity.value = 1.0;

      resetView(mesh);
      updateGuiControllers();
    }

    function saveScreenshot(stage) {
      stage._render();
      const dataUrl = stage.canvas.toDataURL('image/png');
      const a = document.createElement('a');
      a.download = `chromatic_laser_wave_480_${Date.now()}.png`;
      a.href = dataUrl;
      a.click();
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    // =========================================================================
    // GUI SETUP (lil-gui with full controls)
    // =========================================================================
    let gui = null;

    function buildGui(mesh, stage) {
      gui = new GUI({ title: 'Chromatic Laser Wave 480' });

      // 1. Theme & Colors
      const folderColor = gui.addFolder('Theme & Colors');
      folderColor.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Color Scheme').onChange(v => {
        applyColorScheme(v, mesh, stage);
        updateGuiControllers();
      });
      folderColor.add(params, 'greenscreen').name('Greenscreen (#00ff00)').onChange(v => {
        mesh.uniforms.greenscreen.value = v;
        stage._updateClearColor();
      });
      folderColor.addColor(params, 'backgroundColor').name('Background Color').onChange(v => {
        mesh.uniforms.backgroundColor.value.set(v);
        stage._updateClearColor();
      });
      folderColor.addColor(params, 'color1').name('Channel 1 (Red / Main)').onChange(v => {
        mesh.uniforms.color1.value.set(v);
      });
      folderColor.addColor(params, 'color2').name('Channel 2 (Green / Mid)').onChange(v => {
        mesh.uniforms.color2.value.set(v);
      });
      folderColor.addColor(params, 'color3').name('Channel 3 (Blue / Outer)').onChange(v => {
        mesh.uniforms.color3.value.set(v);
      });
      folderColor.addColor(params, 'glowTint').name('Laser Glow Tint').onChange(v => {
        mesh.uniforms.glowTint.value.set(v);
      });

      // 2. Wave & Optics
      const folderWave = gui.addFolder('Wave & Optics');
      folderWave.add(params, 'waveMode', WAVE_MODES).name('Wave Synthesis').onChange(v => {
        mesh.uniforms.waveMode.value = WAVE_MODES.indexOf(v);
      });
      folderWave.add(params, 'dispersionType', DISPERSION_TYPES).name('Lens Dispersion').onChange(v => {
        mesh.uniforms.dispersionType.value = DISPERSION_TYPES.indexOf(v);
      });
      folderWave.add(params, 'xScale', 0.05, 5.0, 0.01).name('Wave Frequency (xScale)').onChange(v => {
        mesh.uniforms.xScale.value = v;
      });
      folderWave.add(params, 'yScale', 0.05, 1.5, 0.01).name('Wave Amplitude (yScale)').onChange(v => {
        mesh.uniforms.yScale.value = v;
      });
      folderWave.add(params, 'distortion', 0.001, 0.150, 0.001).name('Chromatic Split').onChange(v => {
        mesh.uniforms.distortion.value = v;
      });
      folderWave.add(params, 'thickness', 0.005, 0.150, 0.001).name('Beam Core Width').onChange(v => {
        mesh.uniforms.thickness.value = v;
      });
      folderWave.add(params, 'harmonics', 0.0, 1.5, 0.01).name('Harmonic Overtones').onChange(v => {
        mesh.uniforms.harmonics.value = v;
      });

      // 3. Motion & Dynamics
      const folderMotion = gui.addFolder('Motion & Dynamics');
      folderMotion.add(params, 'animation', ANIMATION_PRESETS).name('Camera Preset');
      folderMotion.add(params, 'animationSpeed', 0.0, 3.0, 0.05).name('Camera Speed');
      folderMotion.add(params, 'waveSpeed', 0.0, 3.0, 0.05).name('Wave Speed');
      folderMotion.add(params, 'isPaused').name('Pause Motion (Space)');
      folderMotion.add(params, 'continuousDiffuse').name('Continuous Pulse');
      folderMotion.add(params, 'mouseInfluence', 0.0, 1.0, 0.01).name('Mouse Pull').onChange(v => {
        mesh.uniforms.mouseInfluence.value = v;
      });
      folderMotion.add({ trigger: () => mesh._diffuse() }, 'trigger').name('Trigger Diffuse Pulse [D]');

      // 4. Lighting & Shading
      const folderLight = gui.addFolder('Lighting & Shading');
      folderLight.add(params, 'toneMappingEnabled').name('Tone Mapping').onChange(v => {
        mesh.uniforms.toneMappingEnabled.value = v;
      });
      folderLight.add(params, 'exposure', 0.2, 3.0, 0.05).name('Exposure').onChange(v => {
        mesh.uniforms.exposure.value = v;
      });
      folderLight.add(params, 'masterLightIntensity', 0.0, 2.5, 0.05).name('Master Light').onChange(v => {
        mesh.uniforms.masterLightIntensity.value = v;
      });
      folderLight.add(params, 'ambientIntensity', 0.0, 1.5, 0.05).name('Ambient Light').onChange(v => {
        mesh.uniforms.ambientIntensity.value = v;
      });
      folderLight.add(params, 'dirLightIntensity', 0.0, 2.0, 0.05).name('Directional Light').onChange(v => {
        mesh.uniforms.dirLightIntensity.value = v;
      });
      folderLight.add(params, 'pointLightIntensity', 0.0, 2.0, 0.05).name('Point Specular').onChange(v => {
        mesh.uniforms.pointLightIntensity.value = v;
      });

      // 5. Interaction & Actions
      const folderActions = gui.addFolder('Interaction & Actions');
      folderActions.add(params, 'clickAction', ['Trigger Diffuse Pulse', 'Randomize Scene', 'None']).name('Click Action');
      folderActions.add({ reset: () => resetView(mesh) }, 'reset').name('Reset Camera View');
      folderActions.add({ rand: () => randomizeScene(mesh, stage) }, 'rand').name('Randomize Scene [R]');
      folderActions.add({ resetAll: () => resetDefaults(mesh, stage) }, 'resetAll').name('Reset to Defaults');
      folderActions.add({ snap: () => saveScreenshot(stage) }, 'snap').name('Save Screenshot [S]');
      folderActions.add({ fs: () => toggleFullscreen() }, 'fs').name('Toggle Fullscreen [F]');
    }

    function updateGuiControllers() {
      if (!gui) return;
      gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    // =========================================================================
    // KEYBOARD SHORTCUTS
    // =========================================================================
    function setupKeyboard(mesh, stage) {
      window.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;

        switch (e.code) {
          case 'Space':
            e.preventDefault();
            params.isPaused = !params.isPaused;
            updateGuiControllers();
            break;
          case 'KeyD':
            mesh._diffuse();
            break;
          case 'KeyR':
            randomizeScene(mesh, stage);
            break;
          case 'KeyS':
            saveScreenshot(stage);
            break;
          case 'KeyF':
            toggleFullscreen();
            break;
          case 'KeyH':
            if (gui) {
              gui._hidden ? gui.show() : gui.hide();
            }
            break;
        }
      });
    }

    // =========================================================================
    // APPLICATION INITIALIZATION & RAF LOOP
    // =========================================================================
    (() => {
      const stage = new Stage();
      stage.init();

      const mesh = new Mesh(stage);
      mesh.init();

      setupInteractions(stage.canvas, mesh, stage);
      buildGui(mesh, stage);
      setupKeyboard(mesh, stage);

      window.addEventListener('resize', () => {
        stage.onResize();
        mesh.onResize();
      });

      // CodePen exact automatic initial diffuse pulse
      window.addEventListener('load', () => {
        setTimeout(() => {
          mesh._diffuse();
        }, 1000);
      });

      const clock = new THREE.Clock();

      const _raf = () => {
        window.requestAnimationFrame(() => {
          const delta = Math.min(clock.getDelta(), 0.1);
          const elapsed = clock.getElapsedTime();

          mesh.onRaf(delta, elapsed);
          stage.onRaf();

          _raf();
        });
      };

      _raf();
    })();
  </script>
