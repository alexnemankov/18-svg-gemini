<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>621 - Isometric Rough City</title>

  <!-- External Library CDNs per specifications -->
  <!-- p5.js v2.3.3 official release CDN -->
  <script src="https://cdn.jsdelivr.net/npm/p5@2.3.3/lib/p5.min.js"></script>
  <!-- Rough.js for hand-drawn sketchy architectural linework -->
  <script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js"></script>
  <!-- Chroma.js for rich color scale transformations -->
  <script src="https://cdn.jsdelivr.net/npm/chroma-js@2.4.2/chroma.min.js"></script>
  <!-- lil-gui Modern Interactive Controls CDN -->
  <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.19.1/dist/lil-gui.umd.min.js"></script>

  <style>
    /* =========================================================================
       CSS RESET & FULL-VIEWPORT CANVAS UX
       ========================================================================= */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #0b0f19;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "JetBrains Mono", monospace;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      transition: background-color 0.4s ease;
    }

    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: padding 0.4s cubic-bezier(0.16, 1, 0.3, 1), background 0.4s ease;
    }

    canvas {
      display: block;
      cursor: grab;
      touch-action: none;
      outline: none;
      transition: box-shadow 0.4s ease, border-radius 0.4s ease;
    }

    body.grabbing canvas,
    canvas.grabbing {
      cursor: grabbing !important;
    }

    /* Framed Mode (4:5 Generative Art Print Presentation) */
    body.mode-framed #canvas-container {
      padding: 36px;
      background: radial-gradient(circle at 50% 50%, #151821 0%, #06070a 100%);
    }

    body.mode-framed canvas {
      border-radius: 10px;
      box-shadow: 
        0 30px 90px rgba(0, 0, 0, 0.88),
        0 12px 36px rgba(0, 0, 0, 0.65),
        0 0 0 1px rgba(255, 255, 255, 0.12),
        0 0 0 10px rgba(255, 255, 255, 0.025);
    }

    /* =========================================================================
       lil-gui CUSTOM DARK GLASSMORPHISM THEME
       ========================================================================= */
    .lil-gui.root {
      --background-color: rgba(12, 16, 25, 0.88);
      --text-color: #f1f5f9;
      --title-background-color: rgba(20, 27, 42, 0.95);
      --widget-color: rgba(30, 41, 59, 0.8);
      --hover-color: rgba(51, 65, 85, 0.9);
      --focus-color: #00f0ff;
      --number-color: #38bdf8;
      --string-color: #4ade80;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "JetBrains Mono", monospace;
      --font-size: 11px;
      --folder-indent: 8px;

      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 1000;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 16px 45px rgba(0, 0, 0, 0.7);
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.3s;
    }

    .lil-gui .title {
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      font-size: 10.5px;
    }

    body.hidden-ui .lil-gui.root {
      opacity: 0 !important;
      transform: translateY(14px) scale(0.97);
      pointer-events: none !important;
      visibility: hidden !important;
    }
  </style>
</head>
<body>

  <div id="canvas-container"></div>

  <script>
    /* =========================================================================
       19 PRECONFIGURED COLOR SCHEMES
       ========================================================================= */
    const COLOR_SCHEMES = {

      },
      'Palette 12: F6AA1C, BC3908, 941B0C': {

      },
      'Palette 13: 63D1CF, 5BC0BE, 4BAD9E': {

      },
      'Palette 14: AA60C8, D69ADE, C9A3C6': {
        name: 'Palette (AA60C8, D69ADE, C9A3C6, CFB5C2, 0D001D, 120A12)',
        colors: ["#AA60C8", "#D69ADE", "#C9A3C6", "#CFB5C2", "#0D001D", "#120A12"],

      },
      'Palette 15: FEF1BE, FFBA00, 008189': {

        colors: ["#FEF1BE", "#FFBA00", "#008189", "#00474D", "#061210"],
        defaultNight: false
      },
      'Palette 16: D4FFB0, 7FFF00, 00B894': {
        name: 'Palette (D4FFB0, 7FFF00, 00B894, 0A3322, 05140A)',
        colors: ["#D4FFB0", "#7FFF00", "#00B894", "#0A3322", "#05140A"],
        defaultNight: false
      },
      'Palette 17: FFE8CC, FF8C00, C7501A': {
        name: 'Palette (FFE8CC, FF8C00, C7501A, 3D1050, 0E0618)',
        colors: ["#FFE8CC", "#FF8C00", "#C7501A", "#3D1050", "#0E0618"],
        defaultNight: true
      },
      'Palette 18: E8E0FF, B38FFF, 6A3DE8': {
        name: 'Palette (E8E0FF, B38FFF, 6A3DE8, 1A1250, 090612)',
        colors: ["#E8E0FF", "#B38FFF", "#6A3DE8", "#1A1250", "#090612"],
        defaultNight: true
      },
      'Palette 19: E0FBFF, 00F0FF, D40078': {
        name: 'Palette (E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)',
        colors: ["#E0FBFF", "#00F0FF", "#D40078", "#1E0A3D", "#05020F"],
        defaultNight: true
      }
    };

    // Original Source Palettes Array
    let palettes = [
      ["#fb6107","#f3de2c","#7cb518","#5c8001","#fbb02d"],
      ["#f72585","#7209b7","#b6f500","#000000","#ffffff"],
      ["#094074","#3c6997","#5adbff","#ffdd4a","#fe9000"],
      ["#05668d","#028090","#00a896","#02c39a","#f0f3bd"],
      ["#3c1642","#086375","#1dd3b0","#affc41","#b2ff9e"],
      ["#e5c679","#000807","#357266","#ed6a5e","#4ce0b3","#cfa5b4","#eae8ff","#b0d7ff","#61f2c2"],
      ["#3d2d1c","#30633d","#123c69","#1d58ab","#72c0ed","#fdefc0","#ffdf7c","#feb640","#d97b38","#a46379"],
      ["#080f0f","#2c4a73","#426c85","#4e6baa","#5c59c9","#c33b1e","#f07d23","#ffcc33","#fff1a1","#f1f5f8"],
      ["#fffcf2","#ccc5b9","#403d39","#252422","#eb5e28"],
      ["#faeee0","#fec802","#f69f40","#bf5f07","#0dc9c5","#18761a"],
      ["#0a122a","#771918","#3c5a14","#ffbb33","#a53e12"]
    ];

    /* =========================================================================
       GLOBAL STATE & INTERACTIVE SETTINGS
       ========================================================================= */
    let buildings = [];
    let rg = null;
    let selectedPalette = [];
    let paletteHSB = [];
    let bgColor;
    let isNight;
    let floorColor;

    // Offscreen Graphics Buffers for 60 FPS Performance
    let cityPG = null;
    let skyPG = null;

    // Pan & Zoom Camera State
    let panX = 0, panY = 0;
    let targetPanX = 0, targetPanY = 0;
    let zoomLevel = 1.0, targetZoom = 1.0;
    let isDragging = false;
    let dragStartX = 0, dragStartY = 0;
    let startPanX = 0, startPanY = 0;
    let totalDragDist = 0;

    // Dynamic Atmospheric Entities
    let vehicles = [];
    let clouds = [];
    let airship = null;
    let stars = [];
    let steamPuffs = [];

    // Building Entrance Animation State
    let isBuildingRising = false;
    let buildAnimProgress = 1.0;

    let gui = null;
    let zoomController = null;
    let isNightController = null;

    const settings = {
      // 1. Theme & Appearance
      colorScheme: 'Original',
      isNight: false,
      viewMode: 'Full Viewport',

      // 2. Animation & Dynamics
      isPlaying: true,
      animSpeed: 1.0,
      buildingRiseAnimation: true,
      showTraffic: true,
      trafficCount: 18,
      showClouds: true,
      showBeacons: true,
      showSmoke: true,
      cameraSway: false,
      lineBoil: false,

      // 3. City Architecture & Geometry
      density: 0.5,
      minHeight: 20,
      maxHeight: 80,
      maxSkew: 5,
      textureDetail: 300,

      // 4. Camera & Projection
      zoom: 1.0,
      cameraAngle: 30, // degrees
      cameraHeight: 1.5,
      cameraDistance: 60.0,

      // 5. Interaction
      randomizeOnClick: true,

      // Actions
      regenerate: () => triggerRebuild(false),
      randomizeScene: () => randomizeAll(),
      replayBuild: () => startBuildingRise(),
      resetCamera: () => resetView(),
      saveImage: () => saveCanvas('rough_city_' + Date.now(), 'png')
    };

    /* =========================================================================
       INITIALIZATION & SETUP
       ========================================================================= */
    function setup() {
      const container = document.getElementById('canvas-container');
      const canvas = createCanvas(windowWidth, windowHeight);
      canvas.parent('canvas-container');
      pixelDensity(Math.min(window.devicePixelRatio || 1, 2));

      // Pick starting color scheme and day/night mode
      applyColorScheme(settings.colorScheme, false);

      // Create graphics buffers
      initBuffers();

      // Initialize UI controls and user interaction
      initGUI();
      initInteraction();

      // Generate procedural city layout
      generateBuildings();

      // Initialize dynamic entities (traffic, clouds, airship, stars)
      initAtmosphere();

      // Trigger initial rise animation
      if (settings.buildingRiseAnimation) {
        startBuildingRise();
      } else {
        buildAnimProgress = 1.0;
        isBuildingRising = false;
        renderCityToBuffer();
      }
    }

    function initBuffers() {
      if (cityPG) cityPG.remove();
      if (skyPG) skyPG.remove();

      cityPG = createGraphics(width, height);
      cityPG.pixelDensity(1);
      cityPG.colorMode(HSB, 360, 100, 100);

      skyPG = createGraphics(width, height);
      skyPG.pixelDensity(1);

      // Bind Rough.js to the offscreen city buffer
      rg = rough.canvas(cityPG.elt);
    }

    function windowResized() {
      if (settings.viewMode === 'Full Viewport') {
        resizeCanvas(windowWidth, windowHeight);
      } else {
        // 4:5 aspect ratio framed print
        let pad = 72;
        let availW = windowWidth - pad;
        let availH = windowHeight - pad;
        let targetW = availW;
        let targetH = availW * 1.25;
        if (targetH > availH) {
          targetH = availH;
          targetW = targetH / 1.25;
        }
        resizeCanvas(floor(targetW), floor(targetH));
      }

      initBuffers();
      generateBuildings();
      initAtmosphere();
      renderCityToBuffer();
    }

    /* =========================================================================
       COLOR SCHEME ENGINE
       ========================================================================= */
    function applyColorScheme(schemeName, keepTime = false) {
      const scheme = COLOR_SCHEMES[schemeName] || COLOR_SCHEMES['Original'];
      
      if (schemeName === 'Original') {
        selectedPalette = random(palettes);
      } else {
        selectedPalette = [...scheme.colors];
      }

      // Convert hex colors to HSB format
      colorMode(RGB, 255);
      paletteHSB = selectedPalette.map(hex => {
        let c = color(hex);
        let h = hue(c);
        let s = saturation(c);
        let b = brightness(c);
        if (isNaN(h) || s === 0) h = 0;
        return { h, s, b };
      });
      colorMode(HSB, 360, 100, 100);

      if (!keepTime) {
        isNight = scheme.defaultNight !== undefined ? scheme.defaultNight : (random() > 0.5);
        settings.isNight = isNight;
        if (isNightController) isNightController.updateDisplay();
      } else {
        isNight = settings.isNight;
      }

      // Create bright, desaturated background color from palette via chroma
      let bgSourceColor = random(selectedPalette);
      bgColor = chroma(bgSourceColor).desaturate(random(1, 2)).brighten(random(0.5, 2)).hex();
      floorColor = chroma(random(selectedPalette)).darken(0.3).hex();
    }

    /* =========================================================================
       PROCEDURAL BUILDING GENERATION (Preserved Source Logic)
       ========================================================================= */
    function generateBuildings() {
      buildings = [];
      
      // Scale factor based on canvas size (using min dimension for consistency)
      let baseSize = min(width, height);
      let nScale = baseSize / 600; // Reference size was 600
      
      // Generate random buildings with scaled coordinates
      let gridSpacing = 40 * nScale;
      let xStart = 0;
      let xEnd = 200 * nScale;
      let zStart = -20 * nScale;
      let zEnd = 400 * nScale;
      
      let spawnThreshold = 1.0 - settings.density;
      let maxSkew = settings.maxSkew * nScale;

      for (let x = xStart; x <= xEnd; x += gridSpacing) {
        for (let z = zStart; z <= zEnd; z += gridSpacing) {
          if (random() > spawnThreshold) { // Placement probability
            let buildingHeight = random(settings.minHeight * nScale, settings.maxHeight * nScale);
            let buildingWidth = random(20 * nScale, 35 * nScale);
            let buildingDepth = random(20 * nScale, 35 * nScale);
            
            // Random window type: 0 = solid, 1 = horizontal stripes, 2 = grid, 3 = rectangles
            let windowType = random() > 0.2 ? random([1, 2, 3]) : 0; // 20% chance of solid
            
            // Pick two colors from palette for this building
            let mainColorIdx = floor(random(paletteHSB.length));
            let windowColorIdx = floor(random(paletteHSB.length));
            // Ensure they're different
            while (windowColorIdx === mainColorIdx && paletteHSB.length > 1) {
              windowColorIdx = floor(random(paletteHSB.length));
            }
            
            // Staggered rise delay based on depth distance
            let distNorm = (x / (xEnd || 1) + (z - zStart) / (zEnd - zStart || 1)) * 0.5;

            buildings.push({
              pos: createVector(x, 0, z),
              w: buildingWidth,
              h: buildingHeight,
              targetH: buildingHeight,
              d: buildingDepth,
              windowType: windowType,
              mainColor: paletteHSB[mainColorIdx],
              windowColor: paletteHSB[windowColorIdx],
              topOffsets: {
                frontLeft: { x: random(-maxSkew, maxSkew), z: random(-maxSkew, maxSkew) },
                frontRight: { x: random(-maxSkew, maxSkew), z: random(-maxSkew, maxSkew) },
                backRight: { x: random(-maxSkew, maxSkew), z: random(-maxSkew, maxSkew) },
                backLeft: { x: random(-maxSkew, maxSkew), z: random(-maxSkew, maxSkew) }
              },
              riseDelay: distNorm * 0.45,
              hasBeacon: buildingHeight > 55 * nScale,
              hasSmoke: random() > 0.72,
              smokeTimer: random(100)
            });
          }
        }
      }

      // Sort buildings back-to-front (depth painter's algorithm for accurate occlusion)
      sortBuildings();
    }

    function sortBuildings() {
      let alfa = radians(settings.cameraAngle);
      buildings.sort((a, b) => {
        let depthA = (a.pos.x + a.w * 0.5) * cos(alfa) + (a.pos.z + a.d * 0.5) * sin(alfa);
        let depthB = (b.pos.x + b.w * 0.5) * cos(alfa) + (b.pos.z + b.d * 0.5) * sin(alfa);
        return depthB - depthA; // Far to near
      });
    }

    /* =========================================================================
       PERSPECTIVE PROJECTION (Preserved Source Logic with Dynamic Controls)
       ========================================================================= */
    function project(pt, customAlfa) {
      let d = settings.cameraDistance; // Camera distance (default 60.0)
      let h = settings.cameraHeight;   // Eye height (default 1.5)
      let alfa = customAlfa !== undefined ? customAlfa : radians(settings.cameraAngle); // Rotation angle around Y-axis
      
      // Rotate around Y-axis
      let a = pt.x * sin(alfa) - pt.z * cos(alfa);
      let b = pt.x * cos(alfa) + pt.z * sin(alfa);
      
      // Perspective projection
      let x = d * a / (b + d);
      let y = d * (pt.y - h) / (b + d);
      
      // Scale and position on screen
      let sc = height / 90;
      return createVector(0.63 * width + sc * x, 0.95 * height - sc * y);
    }

    /* =========================================================================
       OFFSCREEN CITY RENDERING (Full Quality with Rough.js & Textures)
       ========================================================================= */
    function renderCityToBuffer(isAnimatedRise = false) {
      if (!cityPG || !rg) return;

      cityPG.clear();

      // Draw all buildings in sorted order
      for (let b of buildings) {
        let currentH = b.h;
        if (isAnimatedRise) {
          let t = constrain((buildAnimProgress - b.riseDelay) / (1.0 - b.riseDelay || 0.01), 0, 1);
          // Ease-out elastic bounce
          let ease = 1 - Math.pow(1 - t, 3.2);
          currentH = b.targetH * ease;
        }

        if (currentH > 0.5) {
          drawBoxOnPG(
            cityPG,
            b.pos,
            b.w,
            currentH,
            b.d,
            b.mainColor,
            b.windowColor,
            b.topOffsets,
            b.windowType,
            isAnimatedRise
          );
        }
      }

      // Draw floor line at the bottom
      let floorY = 0.95 * height; // Same Y position as horizon in projection
      cityPG.fill(floorColor);
      cityPG.noStroke();
      cityPG.rect(0, floorY, width, height - floorY);
      
      // Draw floor line with rough style
      let floorLinePoints = [];
      for (let x = 0; x <= width; x += 5) {
        let y = floorY + random(-1, 1);
        floorLinePoints.push([x, y]);
      }
      rg.linearPath(floorLinePoints, {
        stroke: '#000000',
        strokeWidth: 2,
        roughness: 1.5,
        bowing: 0.3
      });
    }

    /* =========================================================================
       DRAW BOX IN PERSPECTIVE (Preserved Source Logic on Buffer)
       ========================================================================= */
    function drawBoxOnPG(pg, pos, w, h, d, mainColor, windowColor, topOffsets, windowType, isDraft = false) {
      // Calculate 8 corners of the box
      // Bottom vertices stay at ground level (no offset)
      let corners = [
        createVector(pos.x, pos.y, pos.z),           // 0: bottom-front-left
        createVector(pos.x + w, pos.y, pos.z),       // 1: bottom-front-right
        createVector(pos.x + w, pos.y, pos.z + d),   // 2: bottom-back-right
        createVector(pos.x, pos.y, pos.z + d),       // 3: bottom-back-left
        // Top vertices with random offsets for skewing
        createVector(pos.x + topOffsets.frontLeft.x, pos.y + h, pos.z + topOffsets.frontLeft.z),       // 4: top-front-left
        createVector(pos.x + w + topOffsets.frontRight.x, pos.y + h, pos.z + topOffsets.frontRight.z),   // 5: top-front-right
        createVector(pos.x + w + topOffsets.backRight.x, pos.y + h, pos.z + d + topOffsets.backRight.z), // 6: top-back-right
        createVector(pos.x + topOffsets.backLeft.x, pos.y + h, pos.z + d + topOffsets.backLeft.z)    // 7: top-back-left
      ];
      
      // Project all corners to 2D
      let projected = corners.map(c => project(c));
      
      pg.noStroke();
      
      // Draw the 6 faces of the box (non-visible faces first)
      // Bottom face (vertices 0, 1, 2, 3)
      pg.fill(mainColor.h, mainColor.s, mainColor.b);
      pg.beginShape();
      pg.vertex(projected[0].x, projected[0].y);
      pg.vertex(projected[1].x, projected[1].y);
      pg.vertex(projected[2].x, projected[2].y);
      pg.vertex(projected[3].x, projected[3].y);
      pg.endShape(CLOSE);
      
      // Top face (vertices 4, 5, 6, 7)
      pg.beginShape();
      pg.vertex(projected[4].x, projected[4].y);
      pg.vertex(projected[5].x, projected[5].y);
      pg.vertex(projected[6].x, projected[6].y);
      pg.vertex(projected[7].x, projected[7].y);
      pg.endShape(CLOSE);
      
      // Back face (vertices 2, 3, 7, 6)
      pg.beginShape();
      pg.vertex(projected[2].x, projected[2].y);
      pg.vertex(projected[3].x, projected[3].y);
      pg.vertex(projected[7].x, projected[7].y);
      pg.vertex(projected[6].x, projected[6].y);
      pg.endShape(CLOSE);
      
      // Right face (vertices 1, 2, 6, 5)
      pg.beginShape();
      pg.vertex(projected[1].x, projected[1].y);
      pg.vertex(projected[2].x, projected[2].y);
      pg.vertex(projected[6].x, projected[6].y);
      pg.vertex(projected[5].x, projected[5].y);
      pg.endShape(CLOSE);
      
      // Front and left faces with texture using clipping
      pg.push();
      
      // Create clipping mask for both front and left faces
      pg.beginClip();
      // Front face (vertices 0, 1, 5, 4)
      pg.beginShape();
      pg.vertex(projected[0].x, projected[0].y);
      pg.vertex(projected[1].x, projected[1].y);
      pg.vertex(projected[5].x, projected[5].y);
      pg.vertex(projected[4].x, projected[4].y);
      pg.endShape(CLOSE);
      // Left face (vertices 0, 3, 7, 4)
      pg.beginShape();
      pg.vertex(projected[0].x, projected[0].y);
      pg.vertex(projected[3].x, projected[3].y);
      pg.vertex(projected[7].x, projected[7].y);
      pg.vertex(projected[4].x, projected[4].y);
      pg.endShape(CLOSE);
      pg.endClip();
      
      // Calculate bounding box for the two faces
      let xCoords = [projected[0].x, projected[1].x, projected[3].x, projected[4].x, projected[5].x, projected[7].x];
      let yCoords = [projected[0].y, projected[1].y, projected[3].y, projected[4].y, projected[5].y, projected[7].y];
      let minX = min(xCoords);
      let maxX = max(xCoords);
      let minY = min(yCoords);
      let maxY = max(yCoords);
      
      // Draw base color
      pg.fill(mainColor.h, mainColor.s, mainColor.b);
      pg.rect(minX, minY, maxX - minX, maxY - minY);
      
      // Draw texture rectangles with HSB variations
      // When live animating rise, use lighter quad count for high framerate, then bake full detail
      let numRects = isDraft ? 24 : settings.textureDetail;
      for (let i = 0; i < numRects; i++) {
        let x = random(minX, maxX);
        let y = random(minY, maxY);
        let rectW = random(20, 100);
        let rectH = random(20, 100);
        
        // Vary HSB components slightly
        let hVar = mainColor.h + random(-5, 5);
        let sVar = constrain(mainColor.s + random(-10, 10), 0, 100);
        let bVar = constrain(mainColor.b + random(-15, 15), 0, 100);
        
        pg.fill(hVar, sVar, bVar, random(5, 10));
        let quadPoints = [
          createVector(x, y),
          createVector(x + rectW, y),
          createVector(x + rectW, y + rectH),
          createVector(x, y + rectH),
        ];
        let n = 30;
        quadPoints = quadPoints.map(p => {
          return createVector(p.x + random(-n, n), p.y + random(-n, n));
        });
        pg.quad(
          quadPoints[0].x, quadPoints[0].y,
          quadPoints[1].x, quadPoints[1].y,
          quadPoints[2].x, quadPoints[2].y,
          quadPoints[3].x, quadPoints[3].y
        );
      }
      
      pg.pop();
      
      // Draw borders and windows on front face
      const frontFacePoints = [
        [projected[0].x, projected[0].y],
        [projected[1].x, projected[1].y],
        [projected[5].x, projected[5].y],
        [projected[4].x, projected[4].y],
        [projected[0].x, projected[0].y] // close path
      ];
      rg.linearPath(frontFacePoints, {
        stroke: 'black',
        strokeWidth: 2,
        roughness: 1.2,
        bowing: 0.5
      });
      
      // Draw windows on front face
      if (windowType > 0 && !isDraft) {
        drawWindowsOnFace([projected[0], projected[1], projected[5], projected[4]], windowType, w, h, windowColor);
      }

      // Draw borders and windows on left face
      const leftFacePoints = [
        [projected[0].x, projected[0].y],
        [projected[3].x, projected[3].y],
        [projected[7].x, projected[7].y],
        [projected[4].x, projected[4].y],
        [projected[0].x, projected[0].y] // close path
      ];
      rg.linearPath(leftFacePoints, {
        stroke: 'black',
        strokeWidth: 2,
        roughness: 1.2,
        bowing: 0.5
      });
      
      // Draw windows on left face
      if (windowType > 0 && !isDraft) {
        drawWindowsOnFace([projected[0], projected[3], projected[7], projected[4]], windowType, d, h, windowColor);
      }
    }

    /* =========================================================================
       WINDOW & FACADE HELPER FUNCTIONS (Preserved Source Logic)
       ========================================================================= */
    function interpolateFacePoint(faceVertices, u, v) {
      let p0 = faceVertices[0]; // bottom-left
      let p1 = faceVertices[1]; // bottom-right
      let p2 = faceVertices[2]; // top-right
      let p3 = faceVertices[3]; // top-left
      
      let bottom = createVector(lerp(p0.x, p1.x, u), lerp(p0.y, p1.y, u));
      let top = createVector(lerp(p3.x, p2.x, u), lerp(p3.y, p2.y, u));
      return createVector(lerp(bottom.x, top.x, v), lerp(bottom.y, top.y, v));
    }

    function faceVerticesToQuad(faceVertices) {
      return [
        faceVertices[3], // TL
        faceVertices[2], // TR
        faceVertices[1], // BR
        faceVertices[0]  // BL
      ];
    }

    function quadPoint(q, u, v) {
      const top = lerpPoint(q[0], q[1], u);
      const bot = lerpPoint(q[3], q[2], u);
      return lerpPoint(top, bot, v);
    }

    function lerpPoint(a, b, t) {
      return { x: lerp(a.x, b.x, t), y: lerp(a.y, b.y, t) };
    }

    function quadSizeApprox(q) {
      const dist2 = (a, b) => {
        const dx = a.x - b.x, dy = a.y - b.y;
        return Math.sqrt(dx * dx + dy * dy);
      };
      const top = dist2(q[0], q[1]);
      const bottom = dist2(q[3], q[2]);
      const left = dist2(q[0], q[3]);
      const right = dist2(q[1], q[2]);
      return {
        w: (top + bottom) / 2,
        h: (left + right) / 2,
      };
    }

    function drawLineV(q, v, u0 = 0, u1 = 1, segments = 24, strokeColor = 'black') {
      const points = [];
      for (let i = 0; i <= segments; i++) {
        const u = lerp(u0, u1, i / segments);
        const p = quadPoint(q, u, v);
        points.push([p.x, p.y]);
      }
      rg.linearPath(points, {
        stroke: strokeColor,
        strokeWidth: 1,
        roughness: 1.2,
        bowing: 0.5
      });
    }

    function drawLineU(q, u, v0 = 0, v1 = 1, segments = 24, strokeColor = 'black') {
      const points = [];
      for (let i = 0; i <= segments; i++) {
        const v = lerp(v0, v1, i / segments);
        const p = quadPoint(q, u, v);
        points.push([p.x, p.y]);
      }
      rg.linearPath(points, {
        stroke: strokeColor,
        strokeWidth: 1,
        roughness: 1.2,
        bowing: 0.5
      });
    }

    function drawUVRect(q, u0, v0, u1, v1, segments = 10, strokeColor = 'black') {
      const points = [];
      for (let i = 0; i <= segments; i++) {
        const u = lerp(u0, u1, i / segments);
        const p = quadPoint(q, u, v0);
        points.push([p.x, p.y]);
      }
      for (let i = 1; i <= segments; i++) {
        const v = lerp(v0, v1, i / segments);
        const p = quadPoint(q, u1, v);
        points.push([p.x, p.y]);
      }
      for (let i = 1; i <= segments; i++) {
        const u = lerp(u1, u0, i / segments);
        const p = quadPoint(q, u, v1);
        points.push([p.x, p.y]);
      }
      for (let i = 1; i < segments; i++) {
        const v = lerp(v1, v0, i / segments);
        const p = quadPoint(q, u0, v);
        points.push([p.x, p.y]);
      }
      points.push(points[0]);
      
      rg.polygon(points, {
        stroke: strokeColor,
        strokeWidth: random(1, 3),
        roughness: 1.2,
        bowing: 0.5,
        fill: strokeColor,
      });
    }

    function drawWindowsOnFace(faceVertices, windowType, faceWidth, faceHeight, windowColor) {
      const q = faceVerticesToQuad(faceVertices);
      
      colorMode(HSB, 360, 100, 100);
      let windowColorRGB = color(windowColor.h, windowColor.s, windowColor.b);
      colorMode(RGB, 255);
      let windowColorStr = `rgb(${floor(red(windowColorRGB))}, ${floor(green(windowColorRGB))}, ${floor(blue(windowColorRGB))})`;
      
      if (windowType === 1) {
        drawHorizontalDividersWithBars(q, faceWidth, faceHeight, windowColorStr);
      } else if (windowType === 2) {
        drawGrid(q, faceWidth, faceHeight, windowColorStr);
      } else if (windowType === 3) {
        drawWindowRects(q, faceWidth, faceHeight, windowColorStr);
      }
      
      colorMode(HSB, 360, 100, 100);
    }

    function drawHorizontalDividersWithBars(q, faceWidth, faceHeight, strokeColor = 'black') {
      const opt = {
        minBandPx: 35,
        maxBandPx: 80,
        barMinPx: 10,
        barMaxPx: 30,
        barDensity: 0.75,
        marginUPx: 10,
        marginVPx: 10,
        bottomBlankMinPx: 0,
        bottomBlankMaxPx: 70,
        dividerJitterPx: 6,
      };

      const { w, h } = quadSizeApprox(q);
      const marginU = constrain(opt.marginUPx / w, 0, 0.25);
      const marginV = constrain(opt.marginVPx / h, 0, 0.25);
      const bottomBlank = random(opt.bottomBlankMinPx, opt.bottomBlankMaxPx) / h;

      const vEnd = constrain(1 - marginV - bottomBlank, 0, 1);
      const vStart = marginV;

      let v = vStart;
      const bandCuts = [vStart];

      while (v < vEnd - 1e-6) {
        const bandPx = random(opt.minBandPx, opt.maxBandPx);
        const dv = bandPx / h;
        v = min(v + dv, vEnd);
        bandCuts.push(v);
      }

      for (let i = 0; i < bandCuts.length; i++) {
        const vv = bandCuts[i] + random(-opt.dividerJitterPx, opt.dividerJitterPx) / h;
        if (vv <= vStart + 1e-4 || vv >= vEnd - 1e-4) continue;
        drawLineV(q, constrain(vv, vStart, vEnd), marginU, 1 - marginU, 26, strokeColor);
      }

      for (let i = 0; i < bandCuts.length - 1; i++) {
        const v0 = bandCuts[i];
        const v1 = bandCuts[i + 1];

        const bandHeightPx = (v1 - v0) * h;
        if (bandHeightPx < opt.minBandPx * 0.5) continue;

        const barPx = random(opt.barMinPx, opt.barMaxPx);
        const du = barPx / w;

        let u = marginU;
        while (u < 1 - marginU - du) {
          if (random() < opt.barDensity) {
            const uu = u + random(-1, 1) * (opt.dividerJitterPx / w);
            drawLineU(q, constrain(uu, marginU, 1 - marginU), v0, v1, 18, strokeColor);
          }
          const gapPx = random(opt.barMinPx * 0.6, opt.barMaxPx * 1.2);
          u += du + gapPx / w;
        }
      }
    }

    function drawGrid(q, faceWidth, faceHeight, strokeColor = 'black') {
      const opt = {
        cellMinPx: 25,
        cellMaxPx: 60,
        marginUPx: 10,
        marginVPx: 10,
        bottomBlankMinPx: 0,
        bottomBlankMaxPx: 40,
        jitterPx: 3,
      };

      const { w, h } = quadSizeApprox(q);
      const marginU = constrain(opt.marginUPx / w, 0, 0.25);
      const marginV = constrain(opt.marginVPx / h, 0, 0.25);
      const bottomBlank = random(opt.bottomBlankMinPx, opt.bottomBlankMaxPx) / h;

      const v0 = marginV;
      const v1 = constrain(1 - marginV - bottomBlank, 0, 1);
      const u0 = marginU;
      const u1 = 1 - marginU;

      const cellPx = random(opt.cellMinPx, opt.cellMaxPx);
      const cols = max(2, floor((w * (u1 - u0)) / cellPx));
      const rows = max(2, floor((h * (v1 - v0)) / cellPx));

      for (let c = 1; c < cols; c++) {
        const u = lerp(u0, u1, c / cols) + random(-opt.jitterPx, opt.jitterPx) / w;
        drawLineU(q, constrain(u, u0, u1), v0, v1, 22, strokeColor);
      }

      for (let r = 1; r < rows; r++) {
        const v = lerp(v0, v1, r / rows) + random(-opt.jitterPx, opt.jitterPx) / h;
        drawLineV(q, constrain(v, v0, v1), u0, u1, 22, strokeColor);
      }
    }

    function drawWindowRects(q, faceWidth, faceHeight, strokeColor = 'black') {
      const opt = {
        winMinPx: 18,
        winMaxPx: 45,
        gapMinPx: 6,
        gapMaxPx: 18,
        marginUPx: 14,
        marginVPx: 14,
        bottomBlankMinPx: 0,
        bottomBlankMaxPx: 70,
        insetMinPx: 2,
        insetMaxPx: 7,
        skipChance: 0.12,
        jitterPx: 2,
      };

      const { w, h } = quadSizeApprox(q);
      const marginU = constrain(opt.marginUPx / w, 0, 0.25);
      const marginV = constrain(opt.marginVPx / h, 0, 0.25);
      const bottomBlank = random(opt.bottomBlankMinPx, opt.bottomBlankMaxPx) / h;

      const U0 = marginU;
      const U1 = 1 - marginU;
      const V0 = marginV;
      const V1 = constrain(1 - marginV - bottomBlank, 0, 1);

      const colEdges = [U0];
      let u = U0;

      while (u < U1 - 1e-6) {
        const winW = random(opt.winMinPx, opt.winMaxPx);
        const gapW = random(opt.gapMinPx, opt.gapMaxPx);
        const duWin = winW / w;
        const duGap = gapW / w;

        const next = min(u + duWin, U1);
        if (next <= u + 1e-6) break;
        colEdges.push(next);

        u = min(next + duGap, U1);
        if (u < U1 - 1e-6) colEdges.push(u);
      }

      const cols = [];
      for (let i = 0; i < colEdges.length - 1; i += 2) {
        const a = colEdges[i];
        const b = colEdges[i + 1];
        if (b - a > 0.01) cols.push([a, b]);
      }

      const rowEdges = [V0];
      let v = V0;

      while (v < V1 - 1e-6) {
        const winH = random(opt.winMinPx, opt.winMaxPx);
        const gapH = random(opt.gapMinPx, opt.gapMaxPx);
        const dvWin = winH / h;
        const dvGap = gapH / h;

        const next = min(v + dvWin, V1);
        if (next <= v + 1e-6) break;
        rowEdges.push(next);

        v = min(next + dvGap, V1);
        if (v < V1 - 1e-6) rowEdges.push(v);
      }

      const rows = [];
      for (let i = 0; i < rowEdges.length - 1; i += 2) {
        const a = rowEdges[i];
        const b = rowEdges[i + 1];
        if (b - a > 0.01) rows.push([a, b]);
      }

      for (const [vA, vB] of rows) {
        for (const [uA, uB] of cols) {
          if (random() < opt.skipChance) continue;

          const insetPx = random(opt.insetMinPx, opt.insetMaxPx);
          const duInset = insetPx / w;
          const dvInset = insetPx / h;

          let u0 = uA + duInset;
          let u1 = uB - duInset;
          let v0 = vA + duInset;
          let v1 = vB - duInset;

          u0 += random(-opt.jitterPx, opt.jitterPx) / w;
          u1 += random(-opt.jitterPx, opt.jitterPx) / w;
          v0 += random(-opt.jitterPx, opt.jitterPx) / h;
          v1 += random(-opt.jitterPx, opt.jitterPx) / h;

          if (u1 <= u0 + 0.005 || v1 <= v0 + 0.005) continue;

          drawUVRect(q, u0, v0, u1, v1, 8, strokeColor);
        }
      }
    }

    /* =========================================================================
       DYNAMIC ATMOSPHERE & LIFE SUBSYSTEMS
       ========================================================================= */
    function initAtmosphere() {
      let baseSize = min(width, height);
      let nScale = baseSize / 600;

      // 1. Vehicles cruising through the street grid corridors
      vehicles = [];
      let streetLanesX = [0, 40 * nScale, 80 * nScale, 120 * nScale, 160 * nScale, 200 * nScale];
      let streetLanesZ = [-20 * nScale, 20 * nScale, 60 * nScale, 100 * nScale, 140 * nScale, 180 * nScale, 220 * nScale, 260 * nScale, 300 * nScale, 340 * nScale, 380 * nScale];

      for (let i = 0; i < settings.trafficCount; i++) {
        let isAxisX = random() > 0.5;
        let cHex = random(selectedPalette);
        vehicles.push({
          isAxisX: isAxisX,
          fixedCoord: isAxisX ? random(streetLanesZ) + 18 * nScale : random(streetLanesX) + 18 * nScale,
          posCoord: random(0, isAxisX ? 220 * nScale : 400 * nScale),
          speed: random(0.35, 0.9) * nScale * (random() > 0.4 ? 1 : -1),
          minCoord: isAxisX ? -10 * nScale : -30 * nScale,
          maxCoord: isAxisX ? 230 * nScale : 420 * nScale,
          color: cHex,
          size: random(4, 7) * nScale
        });
      }

      // 2. Clouds in the sky
      clouds = [];
      for (let i = 0; i < 7; i++) {
        clouds.push({
          x: random(-0.3 * width, 1.3 * width),
          y: random(0.08 * height, 0.42 * height),
          speed: random(0.12, 0.35) * nScale,
          w: random(90, 180) * nScale,
          h: random(30, 60) * nScale,
          opacity: random(0.25, 0.6)
        });
      }

      // 3. Cruising Airship / Blimp
      airship = {
        x: -120 * nScale,
        y: 0.16 * height,
        speed: 0.22 * nScale,
        w: 52 * nScale,
        h: 22 * nScale,
        bobPhase: random(10)
      };

      // 4. Night Stars
      stars = [];
      for (let i = 0; i < 110; i++) {
        stars.push({
          x: random(width),
          y: random(0.85 * height),
          size: random(1, 2.5),
          twinkleSpeed: random(1.5, 4.0),
          phase: random(TWO_PI)
        });
      }

      // 5. Rooftop Steam Puffs
      steamPuffs = [];
    }

    function updateAtmosphere() {
      if (!settings.isPlaying) return;
      let dt = settings.animSpeed;
      let baseSize = min(width, height);
      let nScale = baseSize / 600;

      // Update Vehicles
      for (let v of vehicles) {
        v.posCoord += v.speed * dt;
        if (v.posCoord > v.maxCoord) v.posCoord = v.minCoord;
        if (v.posCoord < v.minCoord) v.posCoord = v.maxCoord;
      }

      // Update Clouds
      for (let c of clouds) {
        c.x += c.speed * dt;
        if (c.x > width + c.w) c.x = -c.w * 1.2;
      }

      // Update Airship
      if (airship) {
        airship.x += airship.speed * dt;
        if (airship.x > width + 150 * nScale) airship.x = -150 * nScale;
      }

      // Update Steam Puffs
      if (settings.showSmoke && frameCount % 4 === 0) {
        for (let b of buildings) {
          if (b.hasSmoke && random() > 0.88) {
            let smokeOrigin = project(createVector(b.pos.x + b.w * 0.4, b.h, b.pos.z + b.d * 0.4));
            steamPuffs.push({
              x: smokeOrigin.x,
              y: smokeOrigin.y,
              vx: random(-0.2, 0.4) * nScale,
              vy: random(-0.6, -1.2) * nScale,
              size: random(3, 6) * nScale,
              life: 1.0,
              decay: random(0.012, 0.024) * dt
            });
          }
        }
      }

      for (let i = steamPuffs.length - 1; i >= 0; i--) {
        let p = steamPuffs[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.size += 0.15 * dt;
        p.life -= p.decay;
        if (p.life <= 0) steamPuffs.splice(i, 1);
      }
    }

    function startBuildingRise() {
      isBuildingRising = true;
      buildAnimProgress = 0.0;
    }

    /* =========================================================================
       MAIN RENDER LOOP
       ========================================================================= */
    function draw() {
      // 1. Advance building rise animation if active
      if (isBuildingRising && settings.isPlaying) {
        buildAnimProgress += 0.022 * settings.animSpeed;
        if (buildAnimProgress >= 1.0) {
          buildAnimProgress = 1.0;
          isBuildingRising = false;
          // Finalize full-resolution bake with full textures
          renderCityToBuffer(false);
        } else {
          renderCityToBuffer(true);
        }
      }

      // 2. Line Boil / Hand-drawn sketchy jitter effect if toggled
      if (settings.lineBoil && frameCount % 6 === 0 && !isBuildingRising && settings.isPlaying) {
        renderCityToBuffer(false);
      }

      // 3. Update dynamic atmospheric entities
      updateAtmosphere();

      // 4. Smooth camera pan and zoom interpolation
      panX = lerp(panX, targetPanX, 0.18);
      panY = lerp(panY, targetPanY, 0.18);
      zoomLevel = lerp(zoomLevel, targetZoom, 0.18);

      // Optional ambient camera sway / breathing drift
      let swayOffset = settings.cameraSway && settings.isPlaying 
        ? sin(frameCount * 0.015 * settings.animSpeed) * 6 
        : 0;

      // 5. Draw Sky & Atmosphere
      drawSky();

      // 6. Draw City Buffer Transformed by Pan & Zoom
      push();
      translate(width * 0.5 + panX, height * 0.5 + panY + swayOffset);
      scale(zoomLevel);
      translate(-width * 0.5, -height * 0.5);

      if (cityPG) {
        image(cityPG, 0, 0);
      }

      // 7. Draw Dynamic Overlays (Traffic, Rooftop Beacons, Smoke, Airship)
      drawDynamicOverlays();

      pop();
    }

    /* =========================================================================
       SKY & BACKGROUND DRAWING
       ========================================================================= */
    function drawSky() {
      colorMode(RGB, 255);
      let ctx = drawingContext;
      
      // Top-to-bottom gradient sky
      let gradient = ctx.createLinearGradient(0, 0, 0, height);
      gradient.addColorStop(0, bgColor);
      
      if (isNight) {
        let darkColor = chroma(bgColor).darken(2.5).desaturate(1.2).hex();
        gradient.addColorStop(1, darkColor);
      } else {
        let lightColor = chroma(bgColor).brighten(2.2).desaturate(0.9).hex();
        gradient.addColorStop(1, lightColor);
      }
      
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, width, height);

      // Night Stars
      if (isNight) {
        let t = millis() * 0.002 * settings.animSpeed;
        noStroke();
        for (let s of stars) {
          let alpha = 160 + 95 * sin(t * s.twinkleSpeed + s.phase);
          fill(255, 255, 255, alpha);
          circle(s.x, s.y, s.size);
        }
      }

      // Distant Hand-Drawn Clouds
      if (settings.showClouds) {
        noStroke();
        for (let c of clouds) {
          let cloudCol = isNight ? color(255, 255, 255, c.opacity * 40) : color(255, 255, 255, c.opacity * 130);
          fill(cloudCol);
          ellipse(c.x, c.y, c.w, c.h);
          ellipse(c.x + c.w * 0.25, c.y - c.h * 0.2, c.w * 0.7, c.h * 0.9);
          ellipse(c.x - c.w * 0.22, c.y + c.h * 0.1, c.w * 0.6, c.h * 0.8);
        }
      }

      colorMode(HSB, 360, 100, 100);
    }

    /* =========================================================================
       DYNAMIC OVERLAYS (Traffic, Rooftop Beacons, Smoke, Airship)
       ========================================================================= */
    function drawDynamicOverlays() {
      let baseSize = min(width, height);
      let nScale = baseSize / 600;

      // 1. Animated Traffic / Vehicles
      if (settings.showTraffic) {
        for (let v of vehicles) {
          let pt3D = v.isAxisX 
            ? createVector(v.posCoord, 0, v.fixedCoord) 
            : createVector(v.fixedCoord, 0, v.posCoord);
          
          let p2D = project(pt3D);
          
          push();
          translate(p2D.x, p2D.y);

          // Car body
          colorMode(RGB, 255);
          fill(v.color);
          stroke(0, 0, 0, 180);
          strokeWeight(1);
          rectMode(CENTER);
          rect(0, 0, v.size * 1.6, v.size * 0.9, 1.5);

          // Headlights & Taillights
          if (isNight) {
            let dir = v.speed > 0 ? 1 : -1;
            // Glowing Headlights
            fill(255, 245, 180, 220);
            noStroke();
            circle(dir * v.size * 0.9, 0, v.size * 0.5);
            
            // Soft Light Beam
            fill(255, 245, 180, 45);
            triangle(
              dir * v.size * 0.9, 0,
              dir * (v.size * 0.9 + 22 * nScale), -8 * nScale,
              dir * (v.size * 0.9 + 22 * nScale), 8 * nScale
            );

            // Red Taillights
            fill(255, 30, 40, 240);
            circle(-dir * v.size * 0.9, 0, v.size * 0.45);
          }
          pop();
        }
      }

      // 2. Rooftop Blinking Aviation Safety Beacons
      if (settings.showBeacons && isNight) {
        let t = millis() * 0.004 * settings.animSpeed;
        for (let b of buildings) {
          if (b.hasBeacon && b.h > 10) {
            let topCenter = createVector(b.pos.x + b.w * 0.5, b.h + 8 * nScale, b.pos.z + b.d * 0.5);
            let beaconPos = project(topCenter);
            
            // Antenna Mast
            let basePos = project(createVector(b.pos.x + b.w * 0.5, b.h, b.pos.z + b.d * 0.5));
            stroke(0, 0, 0, 180);
            strokeWeight(1.5);
            line(basePos.x, basePos.y, beaconPos.x, beaconPos.y);

            // Pulsing Strobe Light
            let pulse = Math.pow(sin(t + b.pos.x * 0.1) * 0.5 + 0.5, 4.0);
            noStroke();
            fill(255, 30, 40, 70 * pulse);
            circle(beaconPos.x, beaconPos.y, 16 * nScale);
            fill(255, 60, 60, 255 * pulse);
            circle(beaconPos.x, beaconPos.y, 4 * nScale);
          }
        }
      }

      // 3. Rooftop Steam / Smoke Plumes
      if (settings.showSmoke && steamPuffs.length > 0) {
        noStroke();
        for (let p of steamPuffs) {
          let alpha = isNight ? p.life * 45 : p.life * 95;
          fill(240, 240, 245, alpha);
          circle(p.x, p.y, p.size);
        }
      }

      // 4. Cruising Airship / Blimp
      if (settings.showClouds && airship) {
        let bobY = airship.y + sin(millis() * 0.002 * settings.animSpeed + airship.bobPhase) * 6 * nScale;
        push();
        translate(airship.x, bobY);
        
        // Airship Gondola & Hull
        colorMode(RGB, 255);
        fill(isNight ? '#252936' : '#e6ebf2');
        stroke(0, 0, 0, 220);
        strokeWeight(1.5);
        ellipse(0, 0, airship.w, airship.h);

        // Fins & Cabin
        fill(selectedPalette[0] || '#ff5533');
        triangle(-airship.w * 0.45, -airship.h * 0.2, -airship.w * 0.55, -airship.h * 0.6, -airship.w * 0.35, -airship.h * 0.2);
        triangle(-airship.w * 0.45, airship.h * 0.2, -airship.w * 0.55, airship.h * 0.6, -airship.w * 0.35, airship.h * 0.2);
        
        fill(40, 45, 55);
        rect(-airship.w * 0.1, airship.h * 0.42, airship.w * 0.3, airship.h * 0.25, 2);
        
        // Blinking airship beacon
        if (isNight) {
          fill(0, 240, 255, 230);
          noStroke();
          circle(airship.w * 0.45, 0, 4 * nScale);
        }
        pop();
      }

      colorMode(HSB, 360, 100, 100);
    }

    /* =========================================================================
       REBUILD & RANDOMIZATION LOGIC
       ========================================================================= */
    function triggerRebuild(reapplyColors = false) {
      if (reapplyColors) {
        applyColorScheme(settings.colorScheme, true);
      }
      generateBuildings();
      initAtmosphere();
      
      if (settings.buildingRiseAnimation) {
        startBuildingRise();
      } else {
        buildAnimProgress = 1.0;
        isBuildingRising = false;
        renderCityToBuffer(false);
      }
    }

    function randomizeAll() {
      // 1. Pick a random color scheme from the 19 preconfigured themes
      const paletteKeys = Object.keys(COLOR_SCHEMES);
      settings.colorScheme = random(paletteKeys);
      
      // 2. Randomly re-roll geometric and motion parameters
      settings.isNight = random() > 0.45;
      settings.density = Number(random(0.35, 0.65).toFixed(2));
      settings.minHeight = floor(random(15, 30));
      settings.maxHeight = floor(random(65, 120));
      settings.maxSkew = floor(random(2, 9));
      settings.animSpeed = Number(random(0.8, 1.4).toFixed(2));
      settings.cameraAngle = floor(random(22, 42));

      // 3. Apply color palette
      applyColorScheme(settings.colorScheme, false);

      // 4. Update all lil-gui controllers recursively
      if (gui) {
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      }

      // 5. Generate and trigger new procedural variation
      triggerRebuild(false);
    }

    function resetView() {
      targetPanX = 0;
      targetPanY = 0;
      targetZoom = 1.0;
      settings.zoom = 1.0;
      if (zoomController) zoomController.updateDisplay();
    }

    /* =========================================================================
       INTERACTION UX (Pan, Zoom, Wheel, Drag, Hotkeys)
       ========================================================================= */
    function initInteraction() {
      const container = document.getElementById('canvas-container');

      // Mouse Wheel Zoom centered on cursor
      window.addEventListener('wheel', (e) => {
        if (e.target && e.target.closest && e.target.closest('.lil-gui')) return;
        e.preventDefault();

        const zoomFactor = e.deltaY < 0 ? 1.12 : 0.893;
        const newZoom = constrain(targetZoom * zoomFactor, 0.25, 8.0);

        // Keep position under cursor invariant
        const mouseWorldX = (mouseX - (width * 0.5 + targetPanX)) / targetZoom;
        const mouseWorldY = (mouseY - (height * 0.5 + targetPanY)) / targetZoom;

        targetPanX = mouseX - width * 0.5 - mouseWorldX * newZoom;
        targetPanY = mouseY - height * 0.5 - mouseWorldY * newZoom;
        targetZoom = newZoom;

        settings.zoom = targetZoom;
        if (zoomController) zoomController.updateDisplay();
      }, { passive: false });

      // Mouse Drag to Pan Across Screen
      window.addEventListener('mousedown', (e) => {
        if (e.target && e.target.closest && e.target.closest('.lil-gui')) return;
        if (e.button === 0) {
          isDragging = true;
          dragStartX = e.clientX;
          dragStartY = e.clientY;
          startPanX = targetPanX;
          startPanY = targetPanY;
          totalDragDist = 0;
          document.body.classList.add('grabbing');
        }
      });

      window.addEventListener('mousemove', (e) => {
        if (isDragging) {
          const dx = e.clientX - dragStartX;
          const dy = e.clientY - dragStartY;
          totalDragDist = Math.hypot(dx, dy);
          targetPanX = startPanX + dx;
          targetPanY = startPanY + dy;
        }
      });

      window.addEventListener('mouseup', (e) => {
        if (isDragging) {
          isDragging = false;
          document.body.classList.remove('grabbing');
          
          // Canvas Click Detection (if drag was minimal < 6px)
          if (totalDragDist < 6) {
            if (settings.randomizeOnClick) {
              randomizeAll();
            }
          }
        }
      });

      // Mobile Touch Support: Touch Pan & Pinch-to-Zoom
      let touchStartDist = 0;
      let touchStartZoom = 1.0;

      container.addEventListener('touchstart', (e) => {
        if (e.target && e.target.closest && e.target.closest('.lil-gui')) return;
        if (e.touches.length === 1) {
          isDragging = true;
          dragStartX = e.touches[0].clientX;
          dragStartY = e.touches[0].clientY;
          startPanX = targetPanX;
          startPanY = targetPanY;
          totalDragDist = 0;
        } else if (e.touches.length === 2) {
          isDragging = false;
          touchStartDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          touchStartZoom = targetZoom;
        }
      }, { passive: true });

      container.addEventListener('touchmove', (e) => {
        if (isDragging && e.touches.length === 1) {
          const dx = e.touches[0].clientX - dragStartX;
          const dy = e.touches[0].clientY - dragStartY;
          totalDragDist = Math.hypot(dx, dy);
          targetPanX = startPanX + dx;
          targetPanY = startPanY + dy;
        } else if (e.touches.length === 2) {
          const distVal = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          if (touchStartDist > 0) {
            const factor = distVal / touchStartDist;
            targetZoom = constrain(touchStartZoom * factor, 0.25, 8.0);
            settings.zoom = targetZoom;
            if (zoomController) zoomController.updateDisplay();
          }
        }
      }, { passive: true });

      container.addEventListener('touchend', (e) => {
        if (isDragging) {
          isDragging = false;
          if (totalDragDist < 6 && settings.randomizeOnClick) {
            randomizeAll();
          }
        }
      }, { passive: true });

      // Keyboard Controls
      window.addEventListener('keydown', (e) => {
        // 'H' key to hide/show all UI (CRITICAL REQUIREMENT)
        if (e.code === 'KeyH') {
          document.body.classList.toggle('hidden-ui');
          if (gui) {
            gui._hidden ? gui.show() : gui.hide();
          }
        }
        // Spacebar to randomize / reseed
        if (e.code === 'Space') {
          e.preventDefault();
          randomizeAll();
        }
        // 'R' key to reset camera view
        if (e.code === 'KeyR') {
          resetView();
        }
        // 'P' key to toggle animation playback
        if (e.code === 'KeyP') {
          settings.isPlaying = !settings.isPlaying;
        }
      });
    }

    /* =========================================================================
       lil-gui INTERACTIVE CONTROL PANEL
       ========================================================================= */
    function initGUI() {
      gui = new lil.GUI({ title: 'Isometric Rough City' });

      // Folder 1: Color Palette & Mood
      const fTheme = gui.addFolder('Theme & Palette');
      fTheme.add(settings, 'colorScheme', Object.keys(COLOR_SCHEMES))
        .name('Palette')
        .onChange(v => {
          applyColorScheme(v, true);
          renderCityToBuffer(false);
        });

      isNightController = fTheme.add(settings, 'isNight')
        .name('Night Mode')
        .onChange(v => {
          isNight = v;
          applyColorScheme(settings.colorScheme, true);
          renderCityToBuffer(false);
        });

      fTheme.add(settings, 'viewMode', ['Full Viewport', 'Framed 4:5 Art Print'])
        .name('View Mode')
        .onChange(v => {
          if (v === 'Framed 4:5 Art Print') {
            document.body.classList.add('mode-framed');
          } else {
            document.body.classList.remove('mode-framed');
          }
          windowResized();
        });

      // Folder 2: Animation & Dynamics
      const fAnim = gui.addFolder('Animation & Motion');
      fAnim.add(settings, 'isPlaying').name('Play Animation');
      fAnim.add(settings, 'animSpeed', 0.1, 3.0, 0.05).name('Anim Speed');
      fAnim.add(settings, 'buildingRiseAnimation').name('Building Rise FX');
      fAnim.add(settings, 'showTraffic').name('Street Traffic');
      fAnim.add(settings, 'trafficCount', 4, 40, 1)
        .name('Traffic Density')
        .onChange(() => initAtmosphere());
      fAnim.add(settings, 'showClouds').name('Sky Clouds & Blimp');
      fAnim.add(settings, 'showBeacons').name('Rooftop Beacons');
      fAnim.add(settings, 'showSmoke').name('Rooftop Smoke');
      fAnim.add(settings, 'cameraSway').name('Camera Sway');
      fAnim.add(settings, 'lineBoil').name('Line Boil (Jitter)');

      // Folder 3: City Architecture
      const fCity = gui.addFolder('City Architecture');
      fCity.add(settings, 'density', 0.2, 0.85, 0.05)
        .name('Building Density')
        .onChange(() => triggerRebuild(false));
      fCity.add(settings, 'minHeight', 10, 50, 1)
        .name('Min Height')
        .onChange(() => triggerRebuild(false));
      fCity.add(settings, 'maxHeight', 40, 150, 1)
        .name('Max Height')
        .onChange(() => triggerRebuild(false));
      fCity.add(settings, 'maxSkew', 0, 14, 0.5)
        .name('Max Skew')
        .onChange(() => triggerRebuild(false));
      fCity.add(settings, 'textureDetail', 50, 450, 25)
        .name('Texture Detail')
        .onChange(() => renderCityToBuffer(false));

      // Folder 4: Camera & Viewport
      const fCam = gui.addFolder('Camera & Viewport');
      zoomController = fCam.add(settings, 'zoom', 0.25, 6.0, 0.05)
        .name('Zoom')
        .listen()
        .onChange(v => { targetZoom = v; });
      
      fCam.add(settings, 'cameraAngle', 10, 60, 1)
        .name('Camera Angle')
        .onChange(() => {
          sortBuildings();
          renderCityToBuffer(false);
        });

      fCam.add(settings, 'cameraHeight', 0.5, 4.0, 0.1)
        .name('Eye Height')
        .onChange(() => renderCityToBuffer(false));

      fCam.add(settings, 'cameraDistance', 30, 120, 2)
        .name('Camera Distance')
        .onChange(() => renderCityToBuffer(false));

      // Folder 5: Actions & Randomization
      const fActions = gui.addFolder('Actions & Presets');
      fActions.add(settings, 'randomizeOnClick').name('Click to Randomize');
      fActions.add(settings, 'randomizeScene').name('🎲 Randomize All');
      fActions.add(settings, 'regenerate').name('🔄 Rebuild City');
      fActions.add(settings, 'replayBuild').name('🏗️ Replay Rise');
      fActions.add(settings, 'resetCamera').name('🎯 Reset Camera (R)');
      fActions.add(settings, 'saveImage').name('💾 Export PNG');

      fTheme.open();
      fAnim.open();
    }
  </script>
