Sampling to get concentric rings that then I can then line up again

Oh man, would have saved myself a LOT of time actually reading the documentation carefully and not auto-piloting

Lessons Learned:
1. Mask only works with p5.Image
2. You convert a p5.Graphic to a p5.Image with img = whateverYourGraphicIsCalled.get()
3. Mask uses the ALPHA channel and doesn't depend on colour at all (unlike alpha maps in THREE.js)
p5.Graphics are fully transparent by default, so whatever you draw to the graphic buffer will be the shape of what is retained in the masked image

INTERACTION
- Click to Toggle Order / Disorder

RESOURCES
- Claude and Gemini for finding pesky bugs (I just feed it the code if I can't find it myself)
- Palettes from coolors.co
- Easing functions from Easings.net

TO IMPROVE

*/

      },
      'Palette 17 (FFE8CC, FF8C00, C7501A)': {
        bg: '#0E0618',
        stroke: '#3D1050',
        colors: ['#FFE8CC', '#FF8C00', '#C7501A', '#3D1050', '#0E0618', '#FF8C00', '#C7501A', '#FFE8CC', '#5A1B75', '#FFA947']
      },
      'Palette 18 (E8E0FF, B38FFF, 6A3DE8)': {
        bg: '#090612',
        stroke: '#1A1250',
        colors: ['#E8E0FF', '#B38FFF', '#6A3DE8', '#1A1250', '#090612', '#6A3DE8', '#B38FFF', '#E8E0FF', '#2A1F78', '#8657FF']
      },
      'Palette 19 (E0FBFF, 00F0FF, D40078)': {
        bg: '#05020F',
        stroke: '#1E0A3D',
        colors: ['#E0FBFF', '#00F0FF', '#D40078', '#1E0A3D', '#05020F', '#00F0FF', '#D40078', '#E0FBFF', '#351469', '#FF2E99']
      }
    };

    // ============================================================
    // Global Settings & Interactive State
    // ============================================================
    const settings = {
      // Order / Disorder Mode
      desync: true,
      motionMode: 'Perlin Noise (Original)',
      isPlaying: true,
      animSpeed: 1.0,
      progRate: 0.001,
      transitionFrames: 60,
      easingType: 'Elastic',

      // Color Theme
      colorScheme: 'Original',
      originalSubPalette: 'Vibrant Tones',
      invertColors: false,

      // Concentric Rings & Masking
      ringCount: 10,
      showOuterSquare: true,

      // Wonk Squares & Geometry
      showWonkSquares: true,
      gridDivisions: 10,
      wonkIntensity: 1.0,
      wonkiness: 0.25,
      noiseZoom: 10.0,
      strokeWeight: 2.0,
      minWonkSquares: 3,
      maxWonkSquares: 8,
      minWonkRes: 5,
      maxWonkRes: 10,

      // Interaction & UX
      zoom: 1.0,
      clickToRandomize: true
    };

    // Global Working Variables
    let currentColors = [];
    let bg = null;
    let w = 0, s = 0;
    let masks = [];
    let t = 0;
    let maxRot = 0;
    let desync = true;
    let animPhase = 0;

    // Pan & Drag Camera State
    let panX = 0, panY = 0;
    let isDragging = false;
    let hasDragged = false;
    let dragStartX = 0, dragStartY = 0;
    let startPanX = 0, startPanY = 0;

    // lil-gui Controllers references
    let gui = null;
    let zoomController = null;
    let desyncController = null;
    let subPaletteController = null;

    // ============================================================
    // Setup & Initialization
    // ============================================================
    function setup() {
      let canvas = createCanvas(windowWidth, windowHeight);
      canvas.parent('canvas-container');
      pixelDensity(1);

      rectMode(CENTER);
      imageMode(CENTER);
      maxRot = TWO_PI;
      desync = settings.desync;

      initGUI();
      buildArtwork();
    }

    // ============================================================
    // Artwork Construction & Masked Rings Generator
    // ============================================================
    function buildArtwork() {
      masks = [];

      let schemeObj = COLOR_SCHEMES[settings.colorScheme] || COLOR_SCHEMES['Original'];
      if (settings.colorScheme === 'Original') {
        currentColors = [...(ORIGINAL_PALETTES[settings.originalSubPalette] || ORIGINAL_PALETTES["Vibrant Tones"])];
      } else {
        currentColors = [...schemeObj.colors];
      }

      if (settings.invertColors) {
        currentColors.reverse();
      }

      let baseDiagonal = Math.hypot(width, height);
      w = Math.round(Math.min(2048, Math.max(800, baseDiagonal * 1.15)));
      s = w / settings.gridDivisions;

      bg = getBackground();

      let count = Math.max(2, settings.ringCount);
      for (let i = 0; i < count; i++) {
        let diameter = w * (1 - i / count);
        let maskImg = maskCircle(bg, diameter);
        masks.push({
          mask: maskImg,
          ringIndex: i,
          a: random(TWO_PI),
          offset: random(10000),
          show: function() {
            push();
            rotate(this.a);
            image(this.mask, 0, 0);
            pop();
          },
          update: function() {
            if (settings.motionMode === 'Harmonic Wave') {
              let wave = Math.sin(animPhase * 3.5 + this.ringIndex * 0.45);
              this.a = map(wave, -1, 1, -maxRot / 2, maxRot / 2);
            } else if (settings.motionMode === 'Alternating Spin') {
              let dir = (this.ringIndex % 2 === 0 ? 1 : -1);
              let baseSpin = (animPhase * 3.0 * dir) % TWO_PI;
              this.a = baseSpin * (maxRot / TWO_PI);
            } else if (settings.motionMode === 'Vortex Swirl') {
              let swirl = (noise(this.offset, animPhase * 0.7) - 0.5) * 2;
              this.a = (swirl * maxRot * 0.7) + (this.ringIndex / count) * maxRot * 0.6;
            } else if (settings.motionMode === 'Brownian Wobble') {
              let n1 = noise(this.offset, animPhase);
              let n2 = noise(this.offset + 500, animPhase * 2.2);
              this.a = map(n1 * 0.7 + n2 * 0.3, 0, 1, -maxRot, maxRot);
            } else {
              // Default: Perlin Noise (Original)
              this.a = map(noise(this.offset, animPhase), 0, 1, 0, maxRot);
            }
          }
        });
      }
    }

    // ============================================================
    // Main Render Loop
    // ============================================================
    function draw() {
      let schemeObj = COLOR_SCHEMES[settings.colorScheme] || COLOR_SCHEMES['Original'];
      background(schemeObj.bg || 0);

      if (settings.isPlaying) {
        animPhase += settings.progRate * settings.animSpeed;
      }

      syncBiz();

      push();
      // Smooth Pan & Zoom Transformation
      translate(width / 2 + panX, height / 2 + panY);
      scale(settings.zoom);

      // Base background (outer corners)
      if (settings.showOuterSquare && bg) {
        image(bg, 0, 0, w, w);
      }

      // Concentric masked rings from outer to inner
      for (let m of masks) {
        if (settings.isPlaying) {
          m.update();
        }
        m.show();
      }
      pop();
    }

    // ============================================================
    // Background Generator & Wonk Squares Pipeline
    // ============================================================
    function getBackground() {
      let newBG = createGraphics(w, w);
      newBG.pixelDensity(1);
      newBG.rectMode(CENTER);
      newBG.noStroke();

      let div = settings.gridDivisions;
      let cellS = w / div;

      // Draw background grid of squares
      for (let i = 0; i < div; i++) {
        for (let j = 0; j < div; j++) {
          let x = (i + 0.5) * cellS;
          let y = (j + 0.5) * cellS;
          newBG.fill(random(currentColors));
          newBG.square(x, y, cellS);

          let squares = floor(random(settings.minWonkSquares, settings.maxWonkSquares + 1));
          let res = floor(random(settings.minWonkRes, settings.maxWonkRes + 1));
          let baseCol = random(currentColors);
          if (settings.showWonkSquares) {
            drawWonkSquareStack(squares, x, y, newBG, res, baseCol, cellS);
          }
        }
      }

      let img = newBG.get(); // Converts p5.Graphics to p5.Image
      if (typeof newBG.remove === 'function') {
        newBG.remove(); // Prevent canvas element leak
      }
      return img;
    }

    function drawWonkSquareStack(squares, x, y, cnv, res, baseCol, cellS) {
      let prevCol = baseCol;
      for (let k = 0; k < squares; k++) {
        let available = currentColors.filter(e => e !== prevCol);
        let colour = available.length > 0 ? random(available) : random(currentColors);
        prevCol = colour;
        wonkSquare(cellS * 0.8 - cellS * k / Math.max(1, squares - 1), x, y, cnv, res, colour);
      }
    }

    function wonkSquare(squareWidth, cx, cy, cnv, res, colour) {
      let corners = [
        createVector(cx - squareWidth / 2, cy - squareWidth / 2), // tl
        createVector(cx + squareWidth / 2, cy - squareWidth / 2), // tr
        createVector(cx + squareWidth / 2, cy + squareWidth / 2), // br
        createVector(cx - squareWidth / 2, cy + squareWidth / 2)  // bl
      ];

      // Add randomness to the corners
      let jitter = settings.wonkiness * squareWidth / res;
      for (let corner of corners) {
        corner.x += random(-jitter, jitter);
        corner.y += random(-jitter, jitter);
      }

      cnv.fill(colour);
      let schemeObj = COLOR_SCHEMES[settings.colorScheme] || COLOR_SCHEMES['Original'];
      if (settings.strokeWeight > 0) {
        cnv.stroke(schemeObj.stroke || 0);
        cnv.strokeWeight(settings.strokeWeight);
      } else {
        cnv.noStroke();
      }
      cnv.beginShape();

      // Loop through each edge
      let nScale = settings.wonkIntensity * 0.5 * squareWidth / res;
      for (let i = 0; i < 4; i++) {
        let c1 = corners[i];
        let c2 = corners[(i + 1) % 4];

        // Add vertices along this edge (including the starting corner)
        for (let j = 0; j <= res; j++) {
          let c = p5.Vector.lerp(c1, c2, j / res);
          cnv.vertex(
            c.x + noise(c.x / settings.noiseZoom, c.y / settings.noiseZoom) * nScale,
            c.y + noise(c.x / settings.noiseZoom + 1000, c.y / settings.noiseZoom) * nScale
          );
        }
      }

      cnv.endShape(CLOSE);
    }

    // ============================================================
    // Circular Masking (Alpha Clipping)
    // ============================================================
    function maskCircle(img, diameter) {
      let clonedImg = img.get();
      let maskGraphics = createGraphics(img.width, img.height);
      maskGraphics.pixelDensity(1);

      maskGraphics.fill(255);
      maskGraphics.noStroke();
      maskGraphics.circle(img.width / 2, img.height / 2, diameter);

      clonedImg.mask(maskGraphics);
      if (typeof maskGraphics.remove === 'function') {
        maskGraphics.remove();
      }

      return clonedImg;
    }

    // ============================================================
    // Easing Functions (from easings.net)
    // ============================================================
    function easeInOutElastic(x) {
      const c5 = (2 * Math.PI) / 4.5;
      return x === 0
        ? 0
        : x === 1
        ? 1
        : x < 0.5
        ? -(Math.pow(2, 20 * x - 10) * Math.sin((20 * x - 11.125) * c5)) / 2
        : (Math.pow(2, -20 * x + 10) * Math.sin((20 * x - 11.125) * c5)) / 2 + 1;
    }

    function easeInOutCubic(x) {
      return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
    }

    function easeOutBounce(x) {
      const n1 = 7.5625;
      const d1 = 2.75;
      if (x < 1 / d1) {
        return n1 * x * x;
      } else if (x < 2 / d1) {
        return n1 * (x -= 1.5 / d1) * x + 0.75;
      } else if (x < 2.5 / d1) {
        return n1 * (x -= 2.25 / d1) * x + 0.9375;
      } else {
        return n1 * (x -= 2.625 / d1) * x + 0.984375;
      }
    }

    function easeInOutSine(x) {
      return -(Math.cos(Math.PI * x) - 1) / 2;
    }

    function applyEasing(x, type) {
      if (type === 'Cubic') return easeInOutCubic(x);
      if (type === 'Bounce') return easeOutBounce(x);
      if (type === 'Sine') return easeInOutSine(x);
      return easeInOutElastic(x);
    }

    // ============================================================
    // Order / Disorder Synchronization Math
    // ============================================================
    function syncBiz() {
      if (t < 1) {
        t = constrain(t + 1 / Math.max(1, settings.transitionFrames), 0, 1);
      }
      let prog = applyEasing(t, settings.easingType);
      maxRot = desync ? prog * TWO_PI : TWO_PI * (1 - prog);
    }

    function toggleOrderDisorder() {
      settings.desync = !settings.desync;
      desync = settings.desync;
      t = 0;
      if (desyncController) desyncController.updateDisplay();
    }

    // ============================================================
    // Procedural Theme & Parameter Randomizer
    // ============================================================
    function randomizeAll(updateGui = true) {
      // 1. Pick a random color scheme from all 19 curated schemes
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      settings.colorScheme = random(schemeKeys);
      if (settings.colorScheme === 'Original') {
        const origKeys = Object.keys(ORIGINAL_PALETTES);
        settings.originalSubPalette = random(origKeys);
      }
      settings.invertColors = random() > 0.75;

      // 2. Randomize geometric resolution & wonk properties
      settings.ringCount = floor(random(6, 17));
      settings.gridDivisions = floor(random(6, 14));
      settings.showWonkSquares = random() > 0.12;
      settings.wonkIntensity = round(random(0.4, 1.8), 2);
      settings.wonkiness = round(random(0.15, 0.45), 2);
      settings.noiseZoom = round(random(6, 24), 1);
      settings.strokeWeight = random([1, 1.5, 2, 2.5, 3]);

      // 3. Randomize motion parameters
      const motionModes = ['Perlin Noise (Original)', 'Harmonic Wave', 'Alternating Spin', 'Vortex Swirl', 'Brownian Wobble'];
      settings.motionMode = random(motionModes);
      settings.animSpeed = round(random(0.6, 2.2), 2);
      settings.progRate = round(random(0.0008, 0.0025), 4);
      settings.transitionFrames = floor(random(40, 90));

      // Trigger dynamic disorder transition for the new variation
      settings.desync = true;
      desync = true;
      t = 0;

      // 4. Rebuild the artwork
      buildArtwork();

      // 5. Update GUI controls
      if (updateGui && gui) {
        if (subPaletteController) {
          if (settings.colorScheme === 'Original') {
            subPaletteController.show();
          } else {
            subPaletteController.hide();
          }
        }
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      }
    }

    function resetCamera() {
      panX = 0;
      panY = 0;
      settings.zoom = 1.0;
      if (zoomController) zoomController.updateDisplay();
    }

    // ============================================================
    // Viewport Resize & Window Event Handling
    // ============================================================
    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
      let baseDiagonal = Math.hypot(width, height);
      let newW = Math.round(Math.min(2048, Math.max(800, baseDiagonal * 1.15)));
      if (Math.abs(newW - w) > 250) {
        buildArtwork();
      }
    }

    // ============================================================
    // Mouse Drag, Pan, Zoom & Click-to-Randomize Interaction
    // ============================================================
    function mouseWheel(event) {
      if (!event) return;
      if (event.target && event.target.closest && event.target.closest('.lil-gui')) {
        return;
      }
      let zoomFactor = event.deltaY < 0 ? 1.08 : 0.92;
      let oldZoom = settings.zoom;
      let newZoom = constrain(oldZoom * zoomFactor, 0.15, 10.0);

      // Smooth zoom centered towards mouse cursor
      let mouseWorldX = (mouseX - (width / 2 + panX)) / oldZoom;
      let mouseWorldY = (mouseY - (height / 2 + panY)) / oldZoom;

      panX = mouseX - width / 2 - mouseWorldX * newZoom;
      panY = mouseY - height / 2 - mouseWorldY * newZoom;
      settings.zoom = newZoom;

      if (zoomController) zoomController.updateDisplay();
      return false; // Prevent page scroll
    }

    function mousePressed(event) {
      // Ignore clicks originating inside GUI controls
      if (event && event.target && event.target.closest && event.target.closest('.lil-gui')) {
        return;
      }
      isDragging = true;
      hasDragged = false;
      dragStartX = mouseX;
      dragStartY = mouseY;
      startPanX = panX;
      startPanY = panY;
    }

    function mouseDragged(event) {
      if (!isDragging) return;
      if (event && event.target && event.target.closest && event.target.closest('.lil-gui')) {
        return;
      }
      let dx = mouseX - dragStartX;
      let dy = mouseY - dragStartY;
      if (Math.hypot(dx, dy) > 5) {
        hasDragged = true;
        document.body.style.cursor = 'grabbing';
      }
      panX = startPanX + dx;
      panY = startPanY + dy;
    }

    function mouseReleased(event) {
      if (event && event.target && event.target.closest && event.target.closest('.lil-gui')) {
        isDragging = false;
        return;
      }
      document.body.style.cursor = 'grab';

      // Click without drag
      if (isDragging && !hasDragged) {
        if (settings.clickToRandomize) {
          randomizeAll(true);
        } else {
          toggleOrderDisorder();
        }
      }
      isDragging = false;
    }

    // Touch Support for mobile and tablets
    let initialPinchDist = 0;
    let initialZoom = 1;

    function touchStarted(event) {
      if (event && event.target && event.target.closest && event.target.closest('.lil-gui')) {
        return true;
      }
      if (touches && touches.length === 1) {
        mousePressed(event);
      } else if (touches && touches.length === 2) {
        isDragging = false;
        let dx = touches[0].x - touches[1].x;
        let dy = touches[0].y - touches[1].y;
        initialPinchDist = Math.hypot(dx, dy);
        initialZoom = settings.zoom;
      }
      return false;
    }

    function touchMoved(event) {
      if (event && event.target && event.target.closest && event.target.closest('.lil-gui')) {
        return true;
      }
      if (touches && touches.length === 1) {
        mouseDragged(event);
      } else if (touches && touches.length === 2 && initialPinchDist > 0) {
        let dx = touches[0].x - touches[1].x;
        let dy = touches[0].y - touches[1].y;
        let currentDist = Math.hypot(dx, dy);
        let scaleRatio = currentDist / initialPinchDist;
        settings.zoom = constrain(initialZoom * scaleRatio, 0.2, 8.0);
        if (zoomController) zoomController.updateDisplay();
      }
      return false;
    }

    function touchEnded(event) {
      if (event && event.target && event.target.closest && event.target.closest('.lil-gui')) {
        return true;
      }
      mouseReleased(event);
      initialPinchDist = 0;
      return false;
    }

    // Spacebar to randomize, 'O' to toggle Order/Disorder, 'R' to reset view
    window.addEventListener('keydown', (e) => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) return;
      if (e.code === 'Space') {
        randomizeAll(true);
        e.preventDefault();
      } else if (e.key === 'o' || e.key === 'O') {
        toggleOrderDisorder();
        e.preventDefault();
      } else if (e.key === 'r' || e.key === 'R') {
        resetCamera();
        e.preventDefault();
      }
    });

    // ============================================================
    // Interactive lil-gui Setup
    // ============================================================
    function initGUI() {
      if (typeof lil === 'undefined' || !lil.GUI) return;
      gui = new lil.GUI({ title: 'Order & Disorder (Genuary)' });

      // 1. Order & Disorder Dynamics Folder
      const fMode = gui.addFolder('Order & Disorder Mode');
      desyncController = fMode.add(settings, 'desync').name('Disorder (Desync)').onChange(v => {
        desync = v;
        t = 0;
      });
      fMode.add({ toggle: () => toggleOrderDisorder() }, 'toggle').name('Toggle Order / Disorder (O)');
      fMode.add(settings, 'motionMode', [
        'Perlin Noise (Original)',
        'Harmonic Wave',
        'Alternating Spin',
        'Vortex Swirl',
        'Brownian Wobble'
      ]).name('Motion Style');
      fMode.add(settings, 'animSpeed', 0.0, 4.0, 0.05).name('Animation Speed');
      fMode.add(settings, 'progRate', 0.0002, 0.005, 0.0002).name('Noise Speed');
      fMode.add(settings, 'transitionFrames', 15, 180, 1).name('Elastic Duration');
      fMode.add(settings, 'easingType', ['Elastic', 'Cubic', 'Bounce', 'Sine']).name('Transition Easing');

      // 2. Palette & Color Schemes Folder
      const fColor = gui.addFolder('Color Schemes (19 Palettes)');
      fColor.add(settings, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Palette Scheme').onChange(v => {
        if (v === 'Original') {
          subPaletteController.show();
        } else {
          subPaletteController.hide();
        }
        buildArtwork();
      });
      subPaletteController = fColor.add(settings, 'originalSubPalette', Object.keys(ORIGINAL_PALETTES)).name('Original Palette').onChange(() => {
        if (settings.colorScheme === 'Original') buildArtwork();
      });
      fColor.add(settings, 'invertColors').name('Invert Palette').onChange(() => buildArtwork());

      // 3. Concentric Rings & Masking Folder
      const fRings = gui.addFolder('Concentric Rings (Masking)');
      fRings.add(settings, 'ringCount', 3, 24, 1).name('Ring Count').onChange(() => buildArtwork());
      fRings.add(settings, 'showOuterSquare').name('Show Outer Square');

      // 4. Wonk Squares & Grid Folder
      const fWonk = gui.addFolder('Wonk Squares & Geometry');
      fWonk.add(settings, 'showWonkSquares').name('Show Wonk Squares').onChange(() => buildArtwork());
      fWonk.add(settings, 'gridDivisions', 4, 18, 1).name('Grid Divisions').onChange(() => buildArtwork());
      fWonk.add(settings, 'wonkIntensity', 0.0, 3.0, 0.05).name('Edge Distortion').onChange(() => buildArtwork());
      fWonk.add(settings, 'wonkiness', 0.0, 0.8, 0.02).name('Corner Jitter').onChange(() => buildArtwork());
      fWonk.add(settings, 'noiseZoom', 2.0, 40.0, 0.5).name('Noise Frequency').onChange(() => buildArtwork());
      fWonk.add(settings, 'strokeWeight', 0.0, 6.0, 0.25).name('Stroke Weight').onChange(() => buildArtwork());
      fWonk.add(settings, 'minWonkSquares', 1, 6, 1).name('Min Nested Squares').onChange(() => buildArtwork());
      fWonk.add(settings, 'maxWonkSquares', 3, 14, 1).name('Max Nested Squares').onChange(() => buildArtwork());

      // 5. Interaction & Camera Folder
      const fView = gui.addFolder('Camera & Interaction');
      zoomController = fView.add(settings, 'zoom', 0.2, 5.0, 0.01).name('Zoom Level');
      fView.add(settings, 'clickToRandomize').name('Click Scene Randomizes');
      fView.add({ reset: () => resetCamera() }, 'reset').name('Reset Pan & Zoom (R)');
      fView.add({ rand: () => randomizeAll(true) }, 'rand').name('Randomize All (Space)');
      fView.add({ regen: () => buildArtwork() }, 'regen').name('Regenerate Geometry');
      fView.add({ save: () => saveCanvas('order_and_disorder_' + Date.now(), 'png') }, 'save').name('Export Image (PNG)');
    }
  </script>
</body>
