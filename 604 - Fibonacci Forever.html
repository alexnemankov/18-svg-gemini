<!DOCTYPE html>
<html lang="en">
<head>

  <title>604 - Fibonacci Forever</title>

  <!-- p5.js v2.3.3 from official CDN with graceful failover -->
  <script src="https://cdn.jsdelivr.net/npm/p5@2.3.3/lib/p5.min.js"></script>
  <script>
    if (typeof window.p5 === 'undefined') {
      document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"><\/script>');
    }
  </script>

  <!-- lil-gui for modern interactive controls -->
  <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.19/dist/lil-gui.umd.min.js"></script>

  <style>
    /* ============================================================
       CSS Reset & Viewport UX
       ============================================================ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      cursor: grab;
    }

    body:active {
      cursor: grabbing;
    }

    /* Fullscreen Edge-to-Edge Canvas Container */
    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    canvas {
      display: block;
      width: 100vw !important;
      height: 100vh !important;
      outline: none;
    }

    /* lil-gui Custom Dark Glassmorphic Styling */
    .lil-gui {
      --background-color: rgba(12, 15, 22, 0.88) !important;
      --text-color: #e2e8f0 !important;
      --title-background-color: rgba(20, 24, 36, 0.95) !important;
      --widget-color: rgba(30, 38, 56, 0.8) !important;
      --hover-color: rgba(48, 60, 88, 0.9) !important;
      --focus-color: #F6AA1C !important;
      --number-color: #38bdf8 !important;
      --string-color: #4ade80 !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "JetBrains Mono", monospace !important;
      border-radius: 12px !important;
      backdrop-filter: blur(20px) !important;
      -webkit-backdrop-filter: blur(20px) !important;
      border: 1px solid rgba(255, 255, 255, 0.12) !important;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6) !important;
      margin-top: 14px;
      margin-right: 14px;
      z-index: 1000;
    }

    .lil-gui .title {
      font-weight: 700 !important;
      letter-spacing: 0.08em !important;
      text-transform: uppercase !important;
      font-size: 11px !important;
    }
  </style>
</head>
<body>

  <div id="canvas-container"></div>

  <script>
    // ============================================================
    // For #genuary2026, day 03: "fibonacci forever".
    //
    // Production-ready creative coding enhancement:
    // • Preserves 100% of original core math, algorithms & geometry
    // • 19 Preconfigured harmonious color schemes
    // • Interactive zoom with wheel & drag object across screen
    // • Multi-mode rendering (Volumetric Ribbons, Infinite Accumulation, Fade Trails, Single Wireframe)
    // • Procedural theme & motion randomizer on click & Spacebar
    // • Smooth continuous animation speed controller
    // ============================================================

    // 19 Curated Color Schemes Pattern
    const COLOR_SCHEMES = {
      'Original': {
        bg: '#000000',
        accent: '#ffffff',
        colors: ['#ffffff', '#cccccc', '#999999', '#666666', '#ffffff']
      },
      'Monochromatic': {
        bg: '#06131d',
        accent: '#0096ff',
        colors: ['#06131d', '#0c283d', '#114567', '#176798', '#208ecf', '#54b1eb', '#9ed5f7', '#e3f3fc']
      },
      'Analogous': {
        bg: '#1c0423',
        accent: '#ff4d6d',
        colors: ['#1c0423', '#3d0c3e', '#6b144a', '#a21e4a', '#d8315b', '#f95738', '#ff8c42', '#f4d06f']
      },
      'Complementary': {
        bg: '#02141a',
        accent: '#ee6c4d',
        colors: ['#02141a', '#083742', '#0f5a6b', '#1a8599', '#3dccc7', '#ee6c4d', '#f28482', '#ffb4a2']
      },
      'Split-complementary': {
        bg: '#081410',
        accent: '#f72585',
        colors: ['#081410', '#123d2b', '#226f54', '#43aa8b', '#3a0ca3', '#7209b7', '#b5179e', '#f72585']
      },
      'Triadic': {
        bg: '#04091a',
        accent: '#ff0054',
        colors: ['#04091a', '#0d3b66', '#0582ca', '#00f5d4', '#ff0054', '#ff5400', '#ffbd00', '#70e000']
      },
      'Tetradic': {
        bg: '#0e0d1f',
        accent: '#f77f00',
        colors: ['#0e0d1f', '#1c2541', '#3a86ff', '#06d6a0', '#ff006e', '#f77f00', '#ffd166', '#8338ec']
      },
      'Double split-complementary': {
        bg: '#0c1b2a',
        accent: '#ff9f1c',
        colors: ['#0c1b2a', '#1b3a4b', '#0077b6', '#00b4d8', '#e65100', '#ff9f1c', '#ffb703', '#7b2cbf']
      },
      'Achromatic (black and white)': {
        bg: '#000000',
        accent: '#ffffff',
        colors: ['#000000', '#181818', '#333333', '#555555', '#888888', '#b8b8b8', '#e0e0e0', '#ffffff']
      },
      'Achromatic + Accent (B&W + Red)': {
        bg: '#000000',
        accent: '#e60000',
        colors: ['#000000', '#1c1c1c', '#404040', '#737373', '#b3b3b3', '#ffffff', '#e60000', '#ff3333']
      },
      'Neutral + accent': {
        bg: '#181614',
        accent: '#ff9e00',
        colors: ['#181614', '#2c2722', '#48413a', '#786e63', '#b4a796', '#eee9e0', '#ff9e00', '#00e5ff']
      },
      'Palette 12: F6AA1C, BC3908, 941B0C': {
        bg: '#220901',
        accent: '#F6AA1C',
        colors: ['#F6AA1C', '#BC3908', '#941B0C', '#F6AA1C', '#220901']
      },
      'Palette 13: 63D1CF, 5BC0BE, 4BAD9E': {
        bg: '#000000',
        accent: '#63D1CF',
        colors: ['#63D1CF', '#5BC0BE', '#4BAD9E', '#4BAD9E', '#0B132B', '#000000']
      },
      'Palette 14: AA60C8, D69ADE, C9A3C6': {
        bg: '#0D001D',
        accent: '#AA60C8',
        colors: ['#AA60C8', '#D69ADE', '#C9A3C6', '#CFB5C2', '#0D001D', '#120A12']
      },
      'Palette 15: FEF1BE, FFBA00, 008189': {
        bg: '#061210',
        accent: '#FFBA00',
        colors: ['#FEF1BE', '#FFBA00', '#008189', '#00474D', '#061210']
      },
      'Palette 16: D4FFB0, 7FFF00, 00B894': {
        bg: '#05140A',
        accent: '#7FFF00',
        colors: ['#D4FFB0', '#7FFF00', '#00B894', '#0A3322', '#05140A']
      },
      'Palette 17: FFE8CC, FF8C00, C7501A': {
        bg: '#0E0618',
        accent: '#FF8C00',
        colors: ['#FFE8CC', '#FF8C00', '#C7501A', '#3D1050', '#0E0618']
      },
      'Palette 18: E8E0FF, B38FFF, 6A3DE8': {
        bg: '#090612',
        accent: '#6A3DE8',
        colors: ['#E8E0FF', '#B38FFF', '#6A3DE8', '#1A1250', '#090612']
      },
      'Palette 19: E0FBFF, 00F0FF, D40078': {
        bg: '#05020F',
        accent: '#00F0FF',
        colors: ['#E0FBFF', '#00F0FF', '#D40078', '#1E0A3D', '#05020F']
      }
    };

    // ============================================================
    // Global Interactive State & Settings
    // ============================================================
    const settings = {
      // Color & Visual Theme
      colorScheme: 'Original',
      colorMode: 'Palette by Index',
      invertColors: false,
      strokeAlpha: 50,
      strokeWeight: 0.3,
      fillArcs: false,
      fillAlpha: 25,

      // Animation & Motion Dynamics
      isPlaying: true,
      animSpeed: 1.0,
      motionStyle: 'Harmonic Sine',
      renderMode: 'Volumetric Ribbons',
      ribbonStrands: 16,
      ribbonSpan: 0.12,
      autoOrbit: false,
      autoOrbitSpeed: 1.0,
      fadeDecay: 18,

      // Geometry & Spiral
      arcType: 'PIE',
      fibonacciCount: 15,
      scaleMultiplier: 1.0,
      symmetryBranches: 1,
      rotXMultiplier: 1.0,
      rotYMultiplier: 1.0,
      rotZMultiplier: 1.0,

      // Viewport & UX
      zoom: 1.0,
      dragMode: 'Pan (Move Object)',
      clickToRandomize: true,
      autoClearOnTransform: true,

      // Actions
      resetCamera: () => resetCamera(),
      clearCanvas: () => { clearCanvasRequested = true; },
      randomizeAll: () => randomizeAll(true),
      savePNG: () => saveCanvas('fibonacci_forever_604_' + Date.now(), 'png')
    };

    // Core variables preserved from original snippet
    let types;
    let dim;
    let tindex = 2; // Default PIE
    let sequence = [];
    let lastdim;

    // Smooth animation phase accumulator (prevents time jumps when scrubbing animSpeed)
    let animPhase = 0;
    let clearCanvasRequested = true;

    // Camera Pan & 3D Transform State
    let panX = 0, panY = 0;
    let rotX = 0, rotY = 0, rotZ = 0;
    let isDragging = false;
    let hasDragged = false;
    let dragStartX = 0, dragStartY = 0;
    let startPanX = 0, startPanY = 0;
    let startRotX = 0, startRotY = 0;
    let currentDragButton = 0;
    let pinchStartDist = 0;
    let startZoom = 1.0;

    let gui = null;
    let zoomController = null;

    // ============================================================
    // Setup & Initialization (WebGL Canvas)
    // ============================================================
    function setup() {
      let canvas = createCanvas(windowWidth, windowHeight, WEBGL);
      canvas.parent('canvas-container');
      pixelDensity(Math.min(window.devicePixelRatio || 1, 2));

      // Handle p5 constants safely across environments
      const safeOpen = (typeof OPEN !== 'undefined') ? OPEN : 'open';
      const safeChord = (typeof CHORD !== 'undefined') ? CHORD : 'chord';
      const safePie = (typeof PIE !== 'undefined') ? PIE : 'pie';
      types = [safeOpen, safeChord, safePie];

      dim = -PI;
      tindex = 2; // PIE
      sequence = generateFibonacci(settings.fibonacciCount);
      lastdim = dim;

      background(0);

      initGUI();
    }

    // ============================================================
    // Main Render Loop
    // ============================================================
    function draw() {
      const scheme = COLOR_SCHEMES[settings.colorScheme] || COLOR_SCHEMES['Original'];
      const activeBg = settings.invertColors ? scheme.accent : scheme.bg;

      // Integrate animation time smoothly
      let dt = (typeof deltaTime !== 'undefined' && deltaTime > 0 && deltaTime < 100) ? deltaTime : 16.6667;
      if (settings.isPlaying) {
        // Base frequency calibrated: at 60fps and speed 1.0, matches (1 / 300) per frame
        animPhase += (dt / 1000) * (60 / 300) * settings.animSpeed;

        if (settings.autoOrbit) {
          rotX += 0.003 * settings.autoOrbitSpeed;
          rotY += 0.005 * settings.autoOrbitSpeed;
        }
      }

      // Compute dynamic dimension based on selected wave style
      if (settings.motionStyle === 'Cosmic Pulsar') {
        dim = 2 * TAU * sin(animPhase) * Math.cos(animPhase * 0.35);
      } else if (settings.motionStyle === 'Breathing Wave') {
        let s = sin(animPhase);
        dim = 2 * TAU * Math.sign(s) * Math.pow(Math.abs(s), 0.65);
      } else {
        // Harmonic Sine: original formula dim = 2 * TAU * sin(frameCount / 300)
        dim = 2 * TAU * sin(animPhase);
      }
      lastdim = dim;

      // Render mode management
      if (settings.renderMode === 'Volumetric Ribbons') {
        background(activeBg);
        renderVolumetricRibbons();
      } else if (settings.renderMode === 'Single Wireframe') {
        background(activeBg);
        renderSingleFrame(dim, settings.strokeAlpha, settings.fillAlpha);
      } else if (settings.renderMode === 'Fade Trails') {
        // Soft fading overlay in WebGL
        push();
        resetMatrix();
        noStroke();
        let bgCol = color(activeBg);
        fill(red(bgCol), green(bgCol), blue(bgCol), settings.fadeDecay);
        rectMode(CENTER);
        rect(0, 0, width * 3, height * 3);
        pop();
        renderSingleFrame(dim, settings.strokeAlpha, settings.fillAlpha);
      } else {
        // 'Infinite Accumulation' (Original code behavior)
        if (clearCanvasRequested) {
          background(activeBg);
          clearCanvasRequested = false;
        }
        renderSingleFrame(dim, settings.strokeAlpha, settings.fillAlpha);
      }
    }

    // ============================================================
    // Realtime Volumetric Multi-Ribbon Renderer
    // ============================================================
    function renderVolumetricRibbons() {
      let strands = settings.ribbonStrands;
      let span = settings.ribbonSpan;

      for (let s = 0; s < strands; s++) {
        let offset = (s / strands) * span;
        let strandPhase = animPhase - offset;
        let strandDim;

        if (settings.motionStyle === 'Cosmic Pulsar') {
          strandDim = 2 * TAU * sin(strandPhase) * Math.cos(strandPhase * 0.35);
        } else if (settings.motionStyle === 'Breathing Wave') {
          let sv = sin(strandPhase);
          strandDim = 2 * TAU * Math.sign(sv) * Math.pow(Math.abs(sv), 0.65);
        } else {
          strandDim = 2 * TAU * sin(strandPhase);
        }

        // Taper opacity across time strands
        let alphaFactor = Math.pow(1 - (s / strands), 0.65);
        let sAlpha = Math.max(8, settings.strokeAlpha * alphaFactor);
        let fAlpha = settings.fillAlpha * alphaFactor;

        push();
        // Camera translation (drag across screen) & zoom
        translate(panX, panY, 0);
        scale(settings.zoom * settings.scaleMultiplier);
        rotateX(rotX);
        rotateY(rotY);
        rotateZ(rotZ);

        for (let b = 0; b < settings.symmetryBranches; b++) {
          push();
          if (settings.symmetryBranches > 1) {
            rotateZ((TWO_PI / settings.symmetryBranches) * b);
          }
          // Original 3D rotation math
          rotateZ((strandDim / 2) * settings.rotZMultiplier);
          rotateY((strandDim / 2) * settings.rotYMultiplier);
          rotateX((strandDim / 2) * settings.rotXMultiplier);

          drawCurl(strandDim, tindex, settings.strokeWeight, sAlpha, fAlpha);
          pop();
        }
        pop();
      }
    }

    // ============================================================
    // Single Frame 3D Renderer (Accumulation / Wireframe / Fade)
    // ============================================================
    function renderSingleFrame(currentDim, sAlpha, fAlpha) {
      push();
      // Camera translation (drag across screen) & zoom
      translate(panX, panY, 0);
      scale(settings.zoom * settings.scaleMultiplier);
      rotateX(rotX);
      rotateY(rotY);
      rotateZ(rotZ);

      for (let b = 0; b < settings.symmetryBranches; b++) {
        push();
        if (settings.symmetryBranches > 1) {
          rotateZ((TWO_PI / settings.symmetryBranches) * b);
        }
        // Original 3D rotation math
        rotateZ((currentDim / 2) * settings.rotZMultiplier);
        rotateY((currentDim / 2) * settings.rotYMultiplier);
        rotateX((currentDim / 2) * settings.rotXMultiplier);

        drawCurl(currentDim, tindex, settings.strokeWeight, sAlpha, fAlpha);
        pop();
      }
      pop();
    }

    // ============================================================
    // Core Curl Algorithm (Preserving original math & geometry)
    // ============================================================
    function drawCurl(currentDim, currentTindex, currentWeight, currentStrokeAlpha, currentFillAlpha) {
      for (let i = 0; i < sequence.length; i++) {
        let r = sequence[i] * currentDim;
        if (Math.abs(r) < 0.001) continue;

        let col = getArcColor(i, sequence.length, currentDim);

        if (settings.fillArcs && currentFillAlpha > 0) {
          fill(red(col), green(col), blue(col), currentFillAlpha);
        } else {
          noFill();
        }

        stroke(red(col), green(col), blue(col), currentStrokeAlpha);
        strokeWeight(currentWeight);

        if (i > 2) {
          translate(-(sequence[i - 1] * abs(currentDim)) / 2 + (sequence[i - 3] * abs(currentDim)) / 2, 0);
        }
        arc(0, 0, r, r, 0, HALF_PI, types[currentTindex]);
        rotate(HALF_PI);
      }
    }

    // ============================================================
    // Color Harmonization Engine
    // ============================================================
    function getArcColor(i, total, curDim) {
      const scheme = COLOR_SCHEMES[settings.colorScheme] || COLOR_SCHEMES['Original'];
      const pal = scheme.colors;
      const accent = scheme.accent;

      if (settings.colorMode === 'Original White') {
        return settings.invertColors ? color(0) : color(255);
      }

      if (settings.colorMode === 'Monochrome Accent') {
        return color(settings.invertColors ? scheme.bg : accent);
      }

      if (settings.colorMode === 'Palette by Index') {
        let colHex = pal[i % pal.length];
        return color(colHex);
      }

      if (settings.colorMode === 'Gradient Flow') {
        let norm = (i / Math.max(1, total - 1) + (animPhase * 0.06)) % 1;
        if (norm < 0) norm += 1;
        let idx = norm * (pal.length - 1);
        let i0 = Math.floor(idx);
        let i1 = Math.min(pal.length - 1, i0 + 1);
        let frac = idx - i0;
        return lerpColor(color(pal[i0]), color(pal[i1]), frac);
      }

      if (settings.colorMode === 'Depth Z-Coded') {
        let factor = 0.5 + 0.5 * sin(curDim * 0.4 + i * 0.35);
        let idx = Math.floor(factor * (pal.length - 1));
        return color(pal[idx]);
      }

      return color(pal[i % pal.length]);
    }

    // ============================================================
    // Fibonacci Sequence Generator (Preserved from source)
    // ============================================================
    function generateFibonacci(n) {
      let fib = [0, 1];
      for (let i = 2; i < n; i++) {
        fib.push(fib[i - 1] + fib[i - 2]);
      }
      return fib;
    }

    // ============================================================
    // Procedural Theme & Parameter Randomizer
    // ============================================================
    function randomizeAll(updateGui = true) {
      // 1. Pick a random color scheme from the 19 schemes
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      settings.colorScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];

      // 2. Randomize color mode & inversion
      const colorModes = ['Palette by Index', 'Gradient Flow', 'Monochrome Accent', 'Depth Z-Coded'];
      settings.colorMode = colorModes[Math.floor(Math.random() * colorModes.length)];
      settings.invertColors = Math.random() < 0.22;

      // 3. Randomize arc type & tindex
      tindex = Math.floor(Math.random() * 3);
      settings.arcType = ['OPEN', 'CHORD', 'PIE'][tindex];

      // 4. Randomize motion dynamics
      settings.animSpeed = Math.round((0.6 + Math.random() * 1.8) * 100) / 100;
      const motionStyles = ['Harmonic Sine', 'Cosmic Pulsar', 'Breathing Wave'];
      settings.motionStyle = motionStyles[Math.floor(Math.random() * motionStyles.length)];
      settings.strokeAlpha = Math.floor(35 + Math.random() * 85);
      settings.strokeWeight = Math.round((0.2 + Math.random() * 1.3) * 100) / 100;
      settings.fillArcs = Math.random() < 0.25;
      settings.fillAlpha = Math.floor(15 + Math.random() * 45);

      // 5. Randomize rotation multipliers & symmetry
      settings.rotXMultiplier = [0.5, 1.0, 1.5, 2.0][Math.floor(Math.random() * 4)];
      settings.rotYMultiplier = [0.5, 1.0, 1.5, 2.0][Math.floor(Math.random() * 4)];
      settings.rotZMultiplier = [0.5, 1.0, 1.5, 2.0][Math.floor(Math.random() * 4)];
      settings.symmetryBranches = Math.random() < 0.65 ? 1 : [2, 3, 4, 6][Math.floor(Math.random() * 4)];

      // 6. Randomize sequence count
      settings.fibonacciCount = Math.floor(13 + Math.random() * 5);
      sequence = generateFibonacci(settings.fibonacciCount);

      // 7. Request clear canvas
      clearCanvasRequested = true;

      // 8. Update lil-gui displays
      if (updateGui && gui) {
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      }
    }

    // ============================================================
    // Camera Reset
    // ============================================================
    function resetCamera() {
      panX = 0;
      panY = 0;
      rotX = 0;
      rotY = 0;
      rotZ = 0;
      settings.zoom = 1.0;
      if (zoomController) zoomController.updateDisplay();
      if (settings.renderMode === 'Infinite Accumulation') {
        clearCanvasRequested = true;
      }
    }

    // ============================================================
    // Viewport Resize Handling
    // ============================================================
    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
      if (settings.renderMode === 'Infinite Accumulation') {
        clearCanvasRequested = true;
      }
    }

    // ============================================================
    // Interactive Mouse & Touch Handling (Pan, Drag, Zoom, Click)
    // ============================================================
    function mouseWheel(event) {
      if (!event) return;
      if (event.target && event.target.closest && event.target.closest('.lil-gui')) {
        return true;
      }

      let zoomFactor = event.deltaY < 0 ? 1.09 : 0.91;
      let newZoom = constrain(settings.zoom * zoomFactor, 0.1, 25.0);
      settings.zoom = Math.round(newZoom * 100) / 100;

      if (zoomController) zoomController.updateDisplay();
      if (settings.renderMode === 'Infinite Accumulation' && settings.autoClearOnTransform) {
        clearCanvasRequested = true;
      }

      return false; // Prevent browser page scroll
    }

    function mousePressed(event) {
      if (event && event.target && event.target.closest && event.target.closest('.lil-gui')) {
        return;
      }

      isDragging = true;
      hasDragged = false;
      dragStartX = mouseX;
      dragStartY = mouseY;
      startPanX = panX;
      startPanY = panY;
      startRotX = rotX;
      startRotY = rotY;
      currentDragButton = (event && event.button !== undefined) ? event.button : 0;
    }

    function mouseDragged(event) {
      if (!isDragging) return;
      if (event && event.target && event.target.closest && event.target.closest('.lil-gui')) {
        return;
      }

      let dx = mouseX - dragStartX;
      let dy = mouseY - dragStartY;

      if (Math.hypot(dx, dy) > 4) {
        hasDragged = true;
        document.body.style.cursor = 'grabbing';
      }

      // If Right-click (2) or Shift held or mode is Orbit, rotate in 3D
      if (currentDragButton === 2 || (event && event.shiftKey) || settings.dragMode === '3D Orbit (Rotate)') {
        rotY = startRotY + dx * 0.008;
        rotX = startRotX - dy * 0.008;
      } else {
        // Primary: Left-click drag translates the object across screen
        panX = startPanX + dx;
        panY = startPanY + dy;
      }

      if (settings.renderMode === 'Infinite Accumulation' && settings.autoClearOnTransform) {
        clearCanvasRequested = true;
      }
    }

    function mouseReleased(event) {
      if (event && event.target && event.target.closest && event.target.closest('.lil-gui')) {
        isDragging = false;
        return;
      }

      document.body.style.cursor = 'grab';

      // If user clicked without dragging, trigger procedural variation
      if (isDragging && !hasDragged) {
        if (settings.clickToRandomize) {
          randomizeAll(true);
        } else {
          // Original click behavior: cycle tindex & clear
          tindex = (tindex + 1) % types.length;
          settings.arcType = ['OPEN', 'CHORD', 'PIE'][tindex];
          clearCanvasRequested = true;
          if (gui) {
            gui.controllersRecursive().forEach(c => c.updateDisplay());
          }
        }
      }

      isDragging = false;
    }

    function doubleClicked(event) {
      if (event && event.target && event.target.closest && event.target.closest('.lil-gui')) return;
      resetCamera();
    }

    // Touch Support for mobile & touchscreens
    function touchStarted(event) {
      if (touches && touches.length === 2) {
        pinchStartDist = Math.hypot(touches[0].x - touches[1].x, touches[0].y - touches[1].y);
        startZoom = settings.zoom;
        return false;
      }
      if (touches && touches.length === 1) {
        mousePressed(event);
      }
      return true;
    }

    function touchMoved(event) {
      if (touches && touches.length === 2 && pinchStartDist > 0) {
        let currentDist = Math.hypot(touches[0].x - touches[1].x, touches[0].y - touches[1].y);
        let factor = currentDist / pinchStartDist;
        settings.zoom = Math.round(constrain(startZoom * factor, 0.1, 25.0) * 100) / 100;
        if (zoomController) zoomController.updateDisplay();
        if (settings.renderMode === 'Infinite Accumulation' && settings.autoClearOnTransform) {
          clearCanvasRequested = true;
        }
        return false;
      }
      if (touches && touches.length === 1) {
        mouseDragged(event);
      }
      return false;
    }

    function touchEnded(event) {
      mouseReleased(event);
      pinchStartDist = 0;
      return false;
    }

    // Prevent default context menu on right click to allow smooth right-click 3D orbit
    window.addEventListener('contextmenu', (e) => {
      if (!e.target.closest('.lil-gui')) {
        e.preventDefault();
      }
    });

    // Spacebar to randomize / reseed
    window.addEventListener('keydown', (e) => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) return;
      if (e.code === 'Space') {
        randomizeAll(true);
        e.preventDefault();
      } else if (e.key === 'c' || e.key === 'C') {
        clearCanvasRequested = true;
      } else if (e.key === 'r' || e.key === 'R') {
        resetCamera();
      } else if (e.key === 'p' || e.key === 'P') {
        settings.isPlaying = !settings.isPlaying;
        if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
      } else if (e.key === 'h' || e.key === 'H') {
        if (gui) {
          gui.show(gui._hidden);
        }
      } else if (e.key === 'f' || e.key === 'F') {
        let fs = fullscreen();
        fullscreen(!fs);
      }
    });

    // ============================================================
    // Interactive lil-gui Controls Setup
    // ============================================================
    function initGUI() {
      if (typeof lil === 'undefined' || !lil.GUI) return;
      gui = new lil.GUI({ title: 'Fibonacci Forever #604' });

      // 1. Palette & Color Schemes
      const fColor = gui.addFolder('Palette & Color Schemes');
      fColor.add(settings, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Color Scheme').onChange(() => {
        clearCanvasRequested = true;
      });
      fColor.add(settings, 'colorMode', ['Palette by Index', 'Gradient Flow', 'Monochrome Accent', 'Original White', 'Depth Z-Coded']).name('Color Mode').onChange(() => {
        clearCanvasRequested = true;
      });
      fColor.add(settings, 'invertColors').name('Invert Colors').onChange(() => {
        clearCanvasRequested = true;
      });
      fColor.add(settings, 'strokeAlpha', 10, 255, 1).name('Stroke Alpha');
      fColor.add(settings, 'strokeWeight', 0.1, 4.0, 0.05).name('Stroke Weight');
      fColor.add(settings, 'fillArcs').name('Fill Arcs');
      fColor.add(settings, 'fillAlpha', 0, 100, 1).name('Fill Alpha');

      // 2. Animation & Dynamics
      const fAnim = gui.addFolder('Animation & Motion');
      fAnim.add(settings, 'isPlaying').name('Play Animation');
      fAnim.add(settings, 'animSpeed', 0.0, 4.0, 0.05).name('Animation Speed');
      fAnim.add(settings, 'motionStyle', ['Harmonic Sine', 'Cosmic Pulsar', 'Breathing Wave']).name('Waveform');
      fAnim.add(settings, 'renderMode', ['Volumetric Ribbons', 'Infinite Accumulation', 'Fade Trails', 'Single Wireframe']).name('Render Mode').onChange(() => {
        clearCanvasRequested = true;
      });
      fAnim.add(settings, 'ribbonStrands', 2, 40, 1).name('Ribbon Strands');
      fAnim.add(settings, 'ribbonSpan', 0.02, 0.35, 0.01).name('Ribbon Span');
      fAnim.add(settings, 'autoOrbit').name('Auto 3D Orbit');
      fAnim.add(settings, 'autoOrbitSpeed', 0.1, 3.0, 0.1).name('Orbit Speed');

      // 3. Geometry & Fibonacci
      const fGeom = gui.addFolder('Geometry & Golden Ratio');
      fGeom.add(settings, 'arcType', ['OPEN', 'CHORD', 'PIE']).name('Arc Geometry').onChange((val) => {
        tindex = ['OPEN', 'CHORD', 'PIE'].indexOf(val);
        clearCanvasRequested = true;
      });
      fGeom.add(settings, 'fibonacciCount', 8, 22, 1).name('Fibonacci Depth').onChange((val) => {
        sequence = generateFibonacci(val);
        clearCanvasRequested = true;
      });
      fGeom.add(settings, 'scaleMultiplier', 0.2, 3.0, 0.05).name('Scale Multiplier');
      fGeom.add(settings, 'symmetryBranches', 1, 8, 1).name('Symmetry Branches').onChange(() => {
        clearCanvasRequested = true;
      });
      fGeom.add(settings, 'rotXMultiplier', 0.0, 3.0, 0.1).name('Rot X Mult');
      fGeom.add(settings, 'rotYMultiplier', 0.0, 3.0, 0.1).name('Rot Y Mult');
      fGeom.add(settings, 'rotZMultiplier', 0.0, 3.0, 0.1).name('Rot Z Mult');

      // 4. Viewport & Interaction
      const fView = gui.addFolder('Viewport & Camera');
      zoomController = fView.add(settings, 'zoom', 0.1, 10.0, 0.05).name('Zoom (Wheel)').listen();
      fView.add(settings, 'dragMode', ['Pan (Move Object)', '3D Orbit (Rotate)']).name('Drag Action');
      fView.add(settings, 'clickToRandomize').name('Click to Randomize');
      fView.add(settings, 'autoClearOnTransform').name('Clear on Drag/Zoom');
      fView.add(settings, 'resetCamera').name('Reset Camera');
      fView.add(settings, 'clearCanvas').name('Clear Canvas');
      fView.add(settings, 'randomizeAll').name('🎲 Randomize Scene');
      fView.add(settings, 'savePNG').name('📸 Save PNG');

      fColor.open();
      fAnim.open();
    }
  </script>
