    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",

    <script type="module">
      import * as THREE from 'three';
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
      import GUI from 'lil-gui';

      // =========================================================================
      // POST PROCESSOR SUITE (Three.js Shader Post-Processing Pipeline)
      // =========================================================================
      const postOrthoVertexShader = `
        precision highp float;
        in vec3 position;
        out vec2 vUv;
        void main() {
          vUv = position.xy * 0.5 + 0.5;
          gl_Position = vec4(position, 1.0);
        }
      `;

      const postBlur13ShaderChunk = `
        vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
          vec2 resolution = vec2(textureSize(image,0));
          vec4 color = vec4(0.0);
          vec2 off1 = vec2(1.411764705882353) * direction;
          vec2 off2 = vec2(3.2941176470588234) * direction;
          vec2 off3 = vec2(5.176470588235294) * direction;
          color += texture(image, uv) * 0.1964825501511404;
          color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
          color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
          color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
          color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
          color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
          color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
          return color;
        }
      `;

      const postBlurFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        uniform vec2 direction;
        in vec2 vUv;
        out vec4 color;
        ${postBlur13ShaderChunk}
        void main() {
          color = blur13(inputTexture, vUv, direction);
        }
      `;

      const postFinalFragmentShader = `
        precision highp float;
        uniform vec2 resolution;
        uniform sampler2D inputTexture;
        uniform sampler2D blur0Texture;
        uniform sampler2D blur1Texture;
        uniform sampler2D blur2Texture;
        uniform sampler2D blur3Texture;
        uniform sampler2D blur4Texture;
        uniform float vignetteBoost;
        uniform float vignetteReduction;
        uniform float noiseIntensity;
        uniform float time;
        in vec2 vUv;
        out vec4 fragColor;

        float vignette(vec2 uv, float boost, float reduction) {
          vec2 position = vUv - 0.5;
          return boost - length(position) * reduction;
        }

        float hash1(uint n) {
          n = (n << 13U) ^ n;
          n = n * (n * n * 15731U + 789221U) + 1376312589U;
          return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
        }

        float noise(in vec2 uv, in float time) {
          uvec2 p = uvec2(uv);
          return hash1(p.x + 1920U * p.y + (1920U * 1080U) * uint(time));
        }

        vec4 screen(vec4 base, vec4 blend, float opacity) {
          vec4 color = 1.0 - (1.0 - base) * (1.0 - blend);
          return color * opacity + base * (1.0 - opacity);
        }

        void main() {
          vec4 b0 = texture(blur0Texture, vUv);
          vec4 b1 = texture(blur1Texture, vUv);
          vec4 b2 = texture(blur2Texture, vUv);
          vec4 b3 = texture(blur3Texture, vUv);
          vec4 b4 = texture(blur4Texture, vUv);
          
          vec4 color = texture(inputTexture, vUv);
          float factor = 40.0;
          vec4 b = b0 / factor;
          b += 2.0 * b1 / factor;
          b += 4.0 * b2 / factor;
          b += 8.0 * b3 / factor;
          b += 16.0 * b4 / factor;
          fragColor = color + b;
          float f = 0.25;
          b = clamp(b - f, vec4(0.0), vec4(1.0)) * (1.0 / (1.0 - f));
          fragColor = screen(color, b, 1.0);
          fragColor *= vignette(vUv, vignetteBoost, vignetteReduction);
          fragColor += noiseIntensity * noise(gl_FragCoord.xy, time);
          fragColor.a = 1.0;
        }
      `;

      const postChromaticAberrationShaderChunk = `
        vec2 barrelDistortion(vec2 coord, float amt) {
          vec2 cc = coord - 0.5;
          float dist = dot(cc, cc);
          return coord + cc * dist * amt;
        }
        float sat(float t) { return clamp(t, 0.0, 1.0); }
        float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
        float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
        vec4 spectrum_offset(float t) {
          float lo = step(t, 0.5);
          float hi = 1.0 - lo;
          float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
          vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
          return pow(ret, vec4(1.0 / 2.2));
        }
        const float max_distort = 2.2;
        const int num_iter = 8;
        const float reci_num_iter_f = 1.0 / float(num_iter);
        vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
          vec4 sumcol = vec4(0.0);
          vec4 sumw = vec4(0.0);
          for (int i = 0; i < num_iter; ++i) {
            float t = float(i) * reci_num_iter_f;
            vec4 w = spectrum_offset(t);
            sumw += w;
            sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
          }
          return sumcol / sumw;
        }
      `;

      const postColorFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        uniform float chromaticAberrationAmount;
        uniform float minInputLevel;
        uniform float maxInputLevel;
        uniform float gammaLevel;
        uniform float time;
        in vec2 vUv;
        out vec4 fragColor;

        ${postChromaticAberrationShaderChunk}

        vec3 gammaCorrect(vec3 color, vec3 gamma) {
          return pow(color, 1.0 / gamma);
        }
        vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
          return min(max(color - minInput, vec3(0.0)) / (maxInput - minInput), vec3(1.0));
        }
        vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
          return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
        }
        void main() {
          vec2 uv = 0.8 * (vUv - 0.5) + 0.5;
          fragColor = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (vUv - 0.5));
          fragColor.rgb = finalLevels(fragColor.rgb, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
          fragColor.a = 1.0;
        }
      `;

      const postCopyFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        in vec2 vUv;
        out vec4 fragColor;
        void main() {
          fragColor = texture(inputTexture, vUv);
        }
      `;

      function createFBO(w, h, options = {}) {
        return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
          wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
          wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
          minFilter: options.minFilter || THREE.LinearFilter,
          magFilter: options.magFilter || THREE.LinearFilter,
          format: options.format || THREE.RGBAFormat,
          type: options.type || THREE.UnsignedByteType,
          stencilBuffer: options.stencilBuffer || false,
          depthBuffer: options.depthBuffer || true,
          samples: options.samples || 0,
        });
      }

      class ShaderPass {
        constructor(shader, options = {}) {
          this.shader = shader;
          this.orthoScene = new THREE.Scene();
          this.fbo = createFBO(1, 1, options);
          this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
          this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
          this.orthoScene.add(this.orthoQuad);
          this.texture = this.fbo.texture;
        }
        render(renderer, toScreen = false) {
          if (!toScreen) {
            renderer.setRenderTarget(this.fbo);
          }
          renderer.render(this.orthoScene, this.orthoCamera);
          if (!toScreen) {
            renderer.setRenderTarget(null);
          }
        }
        setSize(width, height) {
          this.fbo.setSize(Math.max(1, width), Math.max(1, height));
          this.orthoQuad.scale.set(width, height, 1);
        }
      }

      class ShaderPingPongPass {
        constructor(shader, options = {}) {
          this.shader = shader;
          this.orthoScene = new THREE.Scene();
          this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
          this.currentFBO = 0;
          this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
          this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
          this.orthoScene.add(this.orthoQuad);
        }
        render(renderer) {
          renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
          renderer.render(this.orthoScene, this.orthoCamera);
          renderer.setRenderTarget(null);
          this.currentFBO = 1 - this.currentFBO;
        }
        get current() { return this.fbos[this.currentFBO]; }
        get texture() { return this.current.texture; }
        setSize(width, height) {
          const w = Math.max(1, width);
          const h = Math.max(1, height);
          this.orthoQuad.scale.set(w, h, 1);
          this.fbos[0].setSize(w, h);
          this.fbos[1].setSize(w, h);
        }
      }

      class BloomPass {
        constructor(strength = 3, levels = 5) {
          this.strength = strength;
          this.levels = levels;
          this.blurPasses = [];
          this.blurShader = new THREE.RawShaderMaterial({
            uniforms: {
              inputTexture: { value: null },
              direction: { value: new THREE.Vector2(0, 1) },
            },
            vertexShader: postOrthoVertexShader,
            fragmentShader: postBlurFragmentShader,
            glslVersion: THREE.GLSL3,
          });
          for (let i = 0; i < this.levels; i++) {
            this.blurPasses.push(new ShaderPingPongPass(this.blurShader, {
              format: THREE.RGBAFormat,
            }));
          }
        }
        setSize(w, h) {
          let tw = Math.max(1, w);
          let th = Math.max(1, h);
          for (let i = 0; i < this.levels; i++) {
            tw = Math.max(1, Math.round(tw / 2));
            th = Math.max(1, Math.round(th / 2));
            this.blurPasses[i].setSize(tw, th);
          }
        }
        set source(texture) {
          this.blurShader.uniforms.inputTexture.value = texture;
        }
        render(renderer) {
          const offset = this.strength;
          const u = this.blurShader.uniforms;
          for (let j = 0; j < this.levels; j++) {
            const blurPass = this.blurPasses[j];
            u.direction.value.set(offset, 0);
            blurPass.render(renderer);
            u.inputTexture.value = blurPass.current.texture;
            u.direction.value.set(0, offset / 2);
            blurPass.render(renderer);
            u.inputTexture.value = blurPass.current.texture;
          }
        }
      }

      class PostProcessor {
        constructor(renderer, params = {}) {
          this.renderer = renderer;

          this.settings = {
            enabled: params.enabled !== undefined ? params.enabled : true,
            bloomStrength: params.bloomStrength !== undefined ? params.bloomStrength : 2.17,
            vignetteBoost: params.vignetteBoost !== undefined ? params.vignetteBoost : 1.1,
            vignetteReduction: params.vignetteReduction !== undefined ? params.vignetteReduction : 0.2,
            noiseIntensity: params.noiseIntensity !== undefined ? params.noiseIntensity : 0.06,
            chromaticAberration: params.chromaticAberration !== undefined ? params.chromaticAberration : 0.14,
            gamma: params.gamma !== undefined ? params.gamma : 1.05,
            minInputLevel: params.minInputLevel !== undefined ? params.minInputLevel : 0.0,
            maxInputLevel: params.maxInputLevel !== undefined ? params.maxInputLevel : 0.875,
          };

          this.sceneTarget = createFBO(1, 1);

          this.finalShader = new THREE.RawShaderMaterial({
            uniforms: {
              resolution: { value: new THREE.Vector2(1, 1) },
              vignetteBoost: { value: this.settings.vignetteBoost },
              vignetteReduction: { value: this.settings.vignetteReduction },
              noiseIntensity: { value: this.settings.noiseIntensity },
              inputTexture: { value: null },
              blur0Texture: { value: null },
              blur1Texture: { value: null },
              blur2Texture: { value: null },
              blur3Texture: { value: null },
              blur4Texture: { value: null },
              time: { value: 0 },
            },
            vertexShader: postOrthoVertexShader,
            fragmentShader: postFinalFragmentShader,
            glslVersion: THREE.GLSL3,
          });
          this.finalPass = new ShaderPass(this.finalShader);

          this.rgbShader = new THREE.RawShaderMaterial({
            uniforms: {
              inputTexture: { value: this.finalPass.texture },
              chromaticAberrationAmount: { value: this.settings.chromaticAberration },
              minInputLevel: { value: this.settings.minInputLevel },
              maxInputLevel: { value: this.settings.maxInputLevel },
              gammaLevel: { value: this.settings.gamma },
              time: { value: 0 },
            },
            vertexShader: postOrthoVertexShader,
            fragmentShader: postColorFragmentShader,
            glslVersion: THREE.GLSL3,
          });
          this.rgbPass = new ShaderPass(this.rgbShader);

          this.copyShader = new THREE.RawShaderMaterial({
            uniforms: {
              inputTexture: { value: null },
            },
            vertexShader: postOrthoVertexShader,
            fragmentShader: postCopyFragmentShader,
            glslVersion: THREE.GLSL3,
          });
          this.copyPass = new ShaderPass(this.copyShader);

          this.bloomPass = new BloomPass(this.settings.bloomStrength, 5);
        }

        updateSettings() {
          this.bloomPass.strength = this.settings.bloomStrength;
          this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
          this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
          this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;
          this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
          this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
          this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
          this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
        }

        setSize(w0, h0, dpr = 1) {
          const w = Math.max(1, Math.floor(w0 * dpr));
          const h = Math.max(1, Math.floor(h0 * dpr));
          this.sceneTarget.setSize(w, h);
          this.finalPass.setSize(w, h);
          this.finalShader.uniforms.resolution.value.set(w, h);
          this.bloomPass.setSize(w, h);
          this.rgbPass.setSize(w, h);
          this.copyPass.setSize(w, h);
        }

        renderScene(scene, camera) {
          if (!this.settings.enabled) {
            this.renderer.render(scene, camera);
            return;
          }
          this.renderer.setRenderTarget(this.sceneTarget);
          this.renderer.render(scene, camera);
          this.renderer.setRenderTarget(null);
          this.render(this.sceneTarget.texture);
        }

        render(sourceTexture) {
          if (!this.settings.enabled) {
            this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
            this.copyPass.render(this.renderer, true);
            return;
          }

          this.updateSettings();

          this.bloomPass.source = sourceTexture;
          this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
          this.bloomPass.render(this.renderer);

          this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
          this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
          this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
          this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
          this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

          const randomTime = Math.random() * 100000;
          this.finalPass.shader.uniforms.time.value = randomTime;
          this.rgbPass.shader.uniforms.time.value = randomTime;

          this.finalPass.render(this.renderer);
          this.rgbPass.render(this.renderer, true);
        }

        attachGUI(gui, title = 'Post Processor Settings') {
          const folder = gui.addFolder(title);

          folder.add(this.settings, 'enabled').name('Enable PostProcess');
          folder.add(this.settings, 'bloomStrength', 0, 10, 0.1).name('Bloom Strength').onChange(() => this.updateSettings());
          folder.add(this.settings, 'chromaticAberration', 0, 0.5, 0.01).name('Chromatic Aberration').onChange(() => this.updateSettings());
          folder.add(this.settings, 'vignetteBoost', 0, 2, 0.05).name('Vignette Boost').onChange(() => this.updateSettings());
          folder.add(this.settings, 'vignetteReduction', 0, 2, 0.05).name('Vignette Reduction').onChange(() => this.updateSettings());
          folder.add(this.settings, 'noiseIntensity', 0, 0.2, 0.005).name('Noise Intensity').onChange(() => this.updateSettings());
          folder.add(this.settings, 'gamma', 0.1, 2.0, 0.05).name('Gamma Level').onChange(() => this.updateSettings());
          folder.add(this.settings, 'minInputLevel', 0, 0.5, 0.005).name('Min Input Level').onChange(() => this.updateSettings());
          folder.add(this.settings, 'maxInputLevel', 0.5, 1.0, 0.005).name('Max Input Level').onChange(() => this.updateSettings());

          return folder;
        }
      }

      // =========================================================================
      // 5 ORIGINAL & CURATED CELESTIAL COLOR SCHEMES
      // =========================================================================
      const COLOR_PALETTES = {
        'Nordic Aurora': {
          color1: '#00ff88', // Emerald Oxygen Base
          color2: '#00f0ff', // Electric Aqua Mid-Band
          color3: '#7c3aed', // Solar Magneto-Violet
          color4: '#d946ef', // Upper Atmospheric Magenta
          color5: '#ffffff'  // High-Energy Corona Core
        },
        'Solar Storm Magenta': {
          color1: '#ff0055', // Low-Altitude Crimson
          color2: '#f43f5e', // Radiant Rose
          color3: '#9333ea', // Magnetic Ion Purple
          color4: '#ffaa00', // Solar Flare Amber
          color5: '#ffe4e6'  // Incandescent Corona
        },
        'Boreal Twilight': {
          color1: '#38bdf8', // Glacial Sky Blue
          color2: '#14b8a6', // Deep Ethereal Teal
          color3: '#818cf8', // Mesospheric Lavender
          color4: '#1e1b4b', // Polar Indigo Veil
          color5: '#e0f2fe'  // Pure Star Phosphor
        },
        'Cosmic Comet Nebula': {

          color2: '#f97316', // Supernova Orange
          color3: '#7c3aed', // Deep Space Purple
          color4: '#06b6d4', // Ion Tail Cyan
          color5: '#fffbeb'  // Starlight Nucleus
        },
        'Ethereal Ghost Polar': {
          color1: '#4ade80', // Spectral Pale Green
          color2: '#2dd4bf', // Ghostly Aquamarine
          color3: '#c084fc', // Polar Dawn Lilac
          color4: '#94a3b8', // Silver Moon Mist
          color5: '#f8fafc'  // Diamond Ice Gleam
        }
      };

      // =========================================================================
      // APPLICATION CONFIGURATION
      // =========================================================================
      const config = {
        // Presets & Themes
        theme: 'Nordic Aurora',
        animationPreset: 'Static Vantage',

        // Color Customization
        color1: COLOR_PALETTES['Nordic Aurora'].color1,
        color2: COLOR_PALETTES['Nordic Aurora'].color2,
        color3: COLOR_PALETTES['Nordic Aurora'].color3,
        color4: COLOR_PALETTES['Nordic Aurora'].color4,
        color5: COLOR_PALETTES['Nordic Aurora'].color5,

        // System & Viewport
        dpr: 1.0,
        greenScreen: false,
        speedMultiplier: 0.7,
        clickToRandomize: false,

        // Aurora Curtains Geometry & Shaders
        curtainCount: 9,

        curtainWidth: 360.0,
        curtainElevation: 45.0,
        waveAmplitude: 16.0,

        rayFrequency: 38.0,

        curtainBrightness: 1.35,

        // Camera & Viewport Position
        cameraElevation: 36.0,

        // Diamond Dust Atmosphere
        dustCount: 500,

        dustSpread: 260.0,

        dustBrightness: 1.3,

        // Pillars & Meteors
        pillarCount: 16,

        groundReflection: false,

      };

      // =========================================================================
      // SCENE GLOBALS
      // =========================================================================
      let scene, camera, renderer, postProcessor, controls;
      let auroraGroup, dustPoints, dustGeometry, dustMaterial;
      let pillarGroup, starFieldPoints, floorMesh;
      let auroraMaterials = [];
      let pillarMaterials = [];
      let shootingStars = [];
      let globalTime = 0;
      let gui;
      const clock = new THREE.Clock();

      // Click vs Drag Detection
      let pointerDownPos = { x: 0, y: 0 };
      let pointerDownTime = 0;

      // Camera Animation Rig State
      const camState = {
        orbitAngle: 0,
        swayAngle: 0,
        ascendHeight: 25,
        targetY: 56
      };

      // =========================================================================
      // GLSL SHADER CODE
      // =========================================================================

      // Simplex Noise 2D / 3D
      const noiseGLSL = `
        vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec3 permute(vec3 x) { return mod289(((x*34.0)+1.0)*x); }

        float snoise(vec2 v) {
          const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
          vec2 i  = floor(v + dot(v, C.yy) );
          vec2 x0 = v -   i + dot(i, C.xx);
          vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
          vec4 x12 = x0.xyxy + C.xxzz;
          x12.xy -= i1;
          i = mod289(i);
          vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0 )) + i.x + vec3(0.0, i1.x, 1.0 ));
          vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
          m = m*m;
          m = m*m;
          vec3 x = 2.0 * fract(p * C.www) - 1.0;
          vec3 h = abs(x) - 0.5;
          vec3 ox = floor(x + 0.5);
          vec3 a0 = x - ox;
          m *= 1.79284291400159 - 0.85373472095314 * ( a0*a0 + h*h );
          vec3 g;
          g.x  = a0.x  * x0.x  + h.x  * x0.y;
          g.yz = a0.yz * x12.xz + h.yz * x12.yw;
          return 130.0 * dot(m, g);
        }
      `;

      // Aurora Borealis Curtains Shader (Towering, fluted, continuous rays)
      const auroraVertexShader = `
        ${noiseGLSL}

        varying vec2 vUv;
        varying vec3 vNormal;
        varying vec3 vWorldPos;
        varying vec3 vViewPosition;

        uniform float uTime;
        uniform float uWaveAmp;
        uniform float uWaveSpeed;
        uniform float uCurtainOffset;
        uniform float uCurtainIndex;

        void main() {
          vUv = uv;

          vec3 pos = position;
          float heightFactor = pow(vUv.y, 1.15);

          float t = uTime * uWaveSpeed * 0.4 + uCurtainOffset;
          float macroWave = sin(vUv.x * 2.8 + t + uCurtainIndex * 0.9) * uWaveAmp * heightFactor;
          float harmonicWave = cos(vUv.x * 5.5 - t * 0.7 + uCurtainIndex) * (uWaveAmp * 0.4) * heightFactor;
          float noiseDisplace = snoise(vec2(vUv.x * 3.5 + t * 0.25, vUv.y * 1.2 + uCurtainIndex)) * (uWaveAmp * 0.55) * heightFactor;

          pos.z += macroWave + harmonicWave + noiseDisplace;
          pos.x += sin(vUv.x * 1.8 + t * 0.3) * (uWaveAmp * 0.25) * heightFactor;
          pos.y += cos(vUv.x * 2.4 + t * 0.35) * (uWaveAmp * 0.12) * heightFactor;

          vec4 worldPosition = modelMatrix * vec4(pos, 1.0);
          vWorldPos = worldPosition.xyz;

          vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
          vViewPosition = -mvPosition.xyz;
          vNormal = normalize(normalMatrix * normal);

          gl_Position = projectionMatrix * mvPosition;
        }
      `;

      const auroraFragmentShader = `
        ${noiseGLSL}

        varying vec2 vUv;
        varying vec3 vNormal;
        varying vec3 vWorldPos;
        varying vec3 vViewPosition;

        uniform float uTime;
        uniform vec3 uColor1;
        uniform vec3 uColor2;
        uniform vec3 uColor3;
        uniform vec3 uColor4;
        uniform vec3 uColor5;
        uniform float uRayFrequency;
        uniform float uNoiseScale;
        uniform float uNoiseSpeed;
        uniform float uBrightness;
        uniform float uOpacity;
        uniform float uCurtainIndex;
        uniform float uIsReflection;

        void main() {
          float t = uTime * uNoiseSpeed;

          float rayDistort = snoise(vec2(vUv.x * 10.0, t * 0.15 + uCurtainIndex * 0.7)) * 2.2;
          float ray1 = sin(vUv.x * uRayFrequency + rayDistort);
          float ray2 = sin(vUv.x * uRayFrequency * 2.2 - t * 0.4);
          float striations = pow(ray1 * 0.5 + 0.5, 2.2) * 0.65 + pow(ray2 * 0.5 + 0.5, 2.8) * 0.35;

          vec2 noiseCoord1 = vec2(vUv.x * uNoiseScale * 2.5, vUv.y * 0.9 - t * 0.65 + uCurtainIndex * 0.35);
          vec2 noiseCoord2 = vec2(vUv.x * uNoiseScale * 5.0 + t * 0.2, vUv.y * 1.8 - t * 1.1);
          float scrollNoise = snoise(noiseCoord1) * 0.5 + 0.5;
          float detailNoise = snoise(noiseCoord2) * 0.5 + 0.5;
          float curtainTexture = scrollNoise * 0.65 + detailNoise * 0.35;

          float bottomFade = smoothstep(-0.05, 0.08, vUv.y);
          float topFade = smoothstep(1.0, 0.42, vUv.y);
          float verticalMask = bottomFade * topFade;

          float intensity = verticalMask * (striations * 0.7 + 0.3) * (curtainTexture * 0.75 + 0.35);
          intensity = pow(max(0.0, intensity), 1.25);

          vec3 auroraCol = mix(uColor1, uColor2, smoothstep(0.0, 0.36, vUv.y));
          auroraCol = mix(auroraCol, uColor3, smoothstep(0.3, 0.72, vUv.y));
          auroraCol = mix(auroraCol, uColor4, smoothstep(0.65, 0.96, vUv.y));

          float foldPeak = pow(intensity, 2.4);
          auroraCol = mix(auroraCol, uColor5, foldPeak * 0.5);

          vec3 viewDir = normalize(vViewPosition);
          float fresnel = 1.0 - abs(dot(vNormal, viewDir));
          fresnel = pow(fresnel, 2.2);

          vec3 baseCol = auroraCol * (intensity * 1.35 + foldPeak * 1.6 + fresnel * 0.35) * uBrightness;
          float finalAlpha = clamp(intensity * uOpacity * (0.85 + fresnel * 0.35), 0.0, 1.0);

          if (uIsReflection > 0.5) {
            float lakeSeamFade = smoothstep(0.04, 0.3, vUv.y);
            baseCol *= 0.32 * lakeSeamFade;
            finalAlpha *= 0.35 * lakeSeamFade;
          }

          gl_FragColor = vec4(baseCol * finalAlpha, finalAlpha);
        }
      `;

      // Diamond Dust / Polar Ice Stardust Shader
      const dustVertexShader = `
        ${noiseGLSL}

        attribute float aScale;
        attribute float aPhase;
        attribute float aAltitude;
        attribute vec3 aVelocity;

        varying float vPhase;
        varying float vAltitude;
        varying float vGlint;

        uniform float uTime;
        uniform float uDustSize;
        uniform float uDriftSpeed;

        void main() {
          vPhase = aPhase;
          vAltitude = aAltitude;

          vec3 pos = position;
          float t = uTime * uDriftSpeed * 0.3 + aPhase;

          pos.x += sin(t * 0.8 + aAltitude * 4.0) * 14.0 + cos(t * 0.4) * 8.0;
          pos.y += sin(t * 0.6 + aPhase) * 6.0 + cos(t * 0.3) * 4.0;
          pos.z += cos(t * 0.7 + aAltitude * 3.0) * 14.0 + sin(t * 0.5) * 8.0;

          float glint = sin(uTime * 3.5 + aPhase * 6.28) * 0.5 + 0.5;
          glint = pow(glint, 3.0);
          vGlint = glint;

          vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
          float pointSize = uDustSize * aScale * (glint * 1.5 + 0.8) * 180.0;

          gl_PointSize = max(1.2, pointSize / -mvPosition.z);
          gl_Position = projectionMatrix * mvPosition;
        }
      `;

      const dustFragmentShader = `
        varying float vPhase;
        varying float vAltitude;
        varying float vGlint;

        uniform float uTime;
        uniform vec3 uColor1;
        uniform vec3 uColor2;
        uniform vec3 uColor3;
        uniform vec3 uColor4;
        uniform vec3 uColor5;
        uniform float uBrightness;

        void main() {
          vec2 coord = gl_PointCoord - vec2(0.5);
          float dist = length(coord);
          if (dist > 0.5) discard;

          float glow = smoothstep(0.5, 0.0, dist);
          glow = pow(glow, 1.6);

          float crossGlow = max(
            1.0 - smoothstep(0.0, 0.18, abs(coord.x)) * (1.0 - smoothstep(0.0, 0.5, abs(coord.y))),
            1.0 - smoothstep(0.0, 0.18, abs(coord.y)) * (1.0 - smoothstep(0.0, 0.5, abs(coord.x)))
          ) * vGlint * 0.6;

          vec3 dustCol = mix(uColor1, uColor2, smoothstep(0.0, 0.35, vAltitude));
          dustCol = mix(dustCol, uColor3, smoothstep(0.3, 0.7, vAltitude));
          dustCol = mix(dustCol, uColor4, smoothstep(0.65, 1.0, vAltitude));
          dustCol = mix(dustCol, uColor5, vGlint * 0.75);

          vec3 finalColor = dustCol * (glow * 1.4 + crossGlow * 2.2) * uBrightness;
          float alpha = (glow * 0.85 + crossGlow * 0.4) * (0.6 + vGlint * 0.4);

          gl_FragColor = vec4(finalColor * alpha, alpha);
        }
      `;

      // Vertical Celestial Ion Light Pillars Shader
      const pillarVertexShader = `
        varying vec2 vUv;
        varying vec3 vViewPosition;

        void main() {
          vUv = uv;
          vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
          vViewPosition = -mvPosition.xyz;
          gl_Position = projectionMatrix * mvPosition;
        }
      `;

      const pillarFragmentShader = `
        ${noiseGLSL}

        varying vec2 vUv;
        varying vec3 vViewPosition;

        uniform float uTime;
        uniform vec3 uColor1;
        uniform vec3 uColor2;
        uniform vec3 uColor3;
        uniform vec3 uColor5;
        uniform float uBrightness;
        uniform float uPillarIndex;

        void main() {
          float t = uTime * 0.3 + uPillarIndex * 1.5;

          float centerDist = abs(vUv.x - 0.5) * 2.0;
          float beamProfile = smoothstep(1.0, 0.0, centerDist);
          beamProfile = pow(beamProfile, 2.8);

          float shimmer = snoise(vec2(uPillarIndex * 3.0, vUv.y * 1.5 - t * 0.5)) * 0.5 + 0.5;
          float verticalFade = smoothstep(0.0, 0.12, vUv.y) * smoothstep(1.0, 0.4, vUv.y);

          float intensity = beamProfile * verticalFade * (shimmer * 0.6 + 0.4);

          vec3 col = mix(uColor1, uColor2, vUv.y * 0.6);
          col = mix(col, uColor3, smoothstep(0.4, 0.9, vUv.y));
          col = mix(col, uColor5, pow(beamProfile, 4.0) * 0.6);

          vec3 finalColor = col * intensity * 1.4 * uBrightness;
          float alpha = intensity * 0.55;

          gl_FragColor = vec4(finalColor * alpha, alpha);
        }
      `;

      // Background Starfield Shader
      const starfieldVertexShader = `
        attribute float aTwinkleSpeed;
        attribute float aPhase;
        attribute float aSize;

        varying float vTwinkle;

        uniform float uTime;

        void main() {
          vTwinkle = sin(uTime * aTwinkleSpeed + aPhase) * 0.5 + 0.5;

          vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
          gl_PointSize = max(1.2, (aSize * (vTwinkle * 0.5 + 0.6) * 750.0) / -mvPosition.z);
          gl_Position = projectionMatrix * mvPosition;
        }
      `;

      const starfieldFragmentShader = `
        varying float vTwinkle;
        uniform vec3 uColor5;

        void main() {
          vec2 coord = gl_PointCoord - vec2(0.5);
          float dist = length(coord);
          if (dist > 0.5) discard;

          float glow = smoothstep(0.5, 0.0, dist);
          glow = pow(glow, 2.0);
          gl_FragColor = vec4(uColor5 * (vTwinkle * 1.3 + 0.4) * glow, glow * 0.85);
        }
      `;

      // =========================================================================
      // PROCEDURAL SCENE BUILDERS
      // =========================================================================

      function createStarField() {
        const starCount = 2200;
        const starGeo = new THREE.BufferGeometry();
        const positions = new Float32Array(starCount * 3);
        const twinkleSpeeds = new Float32Array(starCount);
        const phases = new Float32Array(starCount);
        const sizes = new Float32Array(starCount);

        for (let i = 0; i < starCount; i++) {
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.acos(Math.random() * 0.95 + 0.05);
          const radius = 650 + Math.random() * 450;

          positions[i * 3 + 0] = radius * Math.sin(phi) * Math.cos(theta);
          positions[i * 3 + 1] = radius * Math.cos(phi) - 10;
          positions[i * 3 + 2] = radius * Math.sin(phi) * Math.sin(theta);

          twinkleSpeeds[i] = 1.0 + Math.random() * 3.5;
          phases[i] = Math.random() * Math.PI * 2;
          sizes[i] = 0.6 + Math.random() * 1.5;
        }

        starGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        starGeo.setAttribute('aTwinkleSpeed', new THREE.BufferAttribute(twinkleSpeeds, 1));
        starGeo.setAttribute('aPhase', new THREE.BufferAttribute(phases, 1));
        starGeo.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));

        const starMat = new THREE.ShaderMaterial({
          vertexShader: starfieldVertexShader,
          fragmentShader: starfieldFragmentShader,
          uniforms: {
            uTime: { value: 0 },
            uColor5: { value: new THREE.Color(config.color5) }
          },
          transparent: true,
          depthWrite: false,
          blending: THREE.AdditiveBlending
        });

        starFieldPoints = new THREE.Points(starGeo, starMat);
        scene.add(starFieldPoints);
      }

      function createReflectiveFloor() {
        const floorGeo = new THREE.PlaneGeometry(1400, 1400, 1, 1);
        floorGeo.rotateX(-Math.PI * 0.5);

        const floorMat = new THREE.MeshBasicMaterial({
          color: 0x01040d,
          transparent: true,
          opacity: config.groundOpacity,
          depthWrite: false
        });

        floorMesh = new THREE.Mesh(floorGeo, floorMat);
        floorMesh.position.set(0, -25.0, 0);
        floorMesh.visible = config.groundReflection;
        scene.add(floorMesh);
      }

      function buildAuroraCurtains() {
        if (auroraGroup) {
          scene.remove(auroraGroup);
          auroraGroup.traverse(child => {
            if (child.geometry) child.geometry.dispose();
            if (child.material) child.material.dispose();
          });
        }

        auroraGroup = new THREE.Group();
        auroraGroup.position.y = config.curtainElevation;
        auroraMaterials = [];

        const ribbonCount = config.curtainCount;
        const segX = 160;
        const segY = 44;

        for (let i = 0; i < ribbonCount; i++) {
          const norm = i / (ribbonCount - 1 || 1);
          const zBase = -180 + norm * 150 + (Math.random() - 0.5) * 18;
          const xOffset = (norm - 0.5) * 75 + (Math.random() - 0.5) * 30;
          const arcCurvature = 0.0015 + (Math.random() * 0.0008);

          const ribbonGeo = new THREE.PlaneGeometry(config.curtainWidth, config.curtainHeight, segX, segY);
          const pos = ribbonGeo.attributes.position.array;

          for (let v = 0; v < pos.length; v += 3) {
            const x = pos[v + 0];
            const y = pos[v + 1];

            pos[v + 2] = zBase - (x * x * arcCurvature) + Math.sin(x * 0.025 + i * 1.2) * 15.0;
            pos[v + 0] = x + xOffset;
            pos[v + 1] = y + config.curtainHeight * 0.2 - 25.0;
          }

          ribbonGeo.computeVertexNormals();

          const uniforms = {
            uTime: { value: 0 },
            uColor1: { value: new THREE.Color(config.color1) },
            uColor2: { value: new THREE.Color(config.color2) },
            uColor3: { value: new THREE.Color(config.color3) },
            uColor4: { value: new THREE.Color(config.color4) },
            uColor5: { value: new THREE.Color(config.color5) },
            uWaveAmp: { value: config.waveAmplitude },
            uWaveSpeed: { value: config.waveSpeed },
            uCurtainOffset: { value: i * 1.65 },
            uCurtainIndex: { value: i },
            uRayFrequency: { value: config.rayFrequency },
            uNoiseScale: { value: config.noiseScale },
            uNoiseSpeed: { value: config.noiseSpeed },
            uBrightness: { value: config.curtainBrightness },
            uOpacity: { value: config.curtainOpacity },
            uIsReflection: { value: 0.0 }
          };

          const material = new THREE.ShaderMaterial({
            vertexShader: auroraVertexShader,
            fragmentShader: auroraFragmentShader,
            uniforms: uniforms,
            transparent: true,
            depthWrite: false,
            side: THREE.DoubleSide,
            blending: THREE.AdditiveBlending
          });

          const mesh = new THREE.Mesh(ribbonGeo, material);
          auroraGroup.add(mesh);
          auroraMaterials.push(uniforms);

          if (config.groundReflection) {
            const refUniforms = {};
            for (let key in uniforms) {
              refUniforms[key] = { value: uniforms[key].value };
            }
            refUniforms.uIsReflection = { value: 1.0 };

            const refMaterial = new THREE.ShaderMaterial({
              vertexShader: auroraVertexShader,
              fragmentShader: auroraFragmentShader,
              uniforms: refUniforms,
              transparent: true,
              depthWrite: false,
              side: THREE.DoubleSide,
              blending: THREE.AdditiveBlending
            });

            const refMesh = new THREE.Mesh(ribbonGeo, refMaterial);
            refMesh.scale.y = -1;
            refMesh.position.y = -25.0;
            auroraGroup.add(refMesh);
            auroraMaterials.push(refUniforms);
          }
        }

        scene.add(auroraGroup);
      }

      function buildDiamondDust() {
        if (dustPoints) {
          scene.remove(dustPoints);
          dustGeometry.dispose();
          dustMaterial.dispose();
        }

        const count = config.dustCount;
        dustGeometry = new THREE.BufferGeometry();
        const positions = new Float32Array(count * 3);
        const scales = new Float32Array(count);
        const phases = new Float32Array(count);
        const altitudes = new Float32Array(count);

        const spread = config.dustSpread;

        for (let i = 0; i < count; i++) {
          const x = (Math.random() - 0.5) * spread * 2.0;
          const y = -10.0 + Math.random() * 150.0;
          const z = -200.0 + Math.random() * 320.0;

          positions[i * 3 + 0] = x;
          positions[i * 3 + 1] = y;
          positions[i * 3 + 2] = z;

          scales[i] = 0.5 + Math.random() * 1.8;
          phases[i] = Math.random() * Math.PI * 2.0;
          altitudes[i] = Math.min(1.0, Math.max(0.0, (y + 10.0) / 150.0));
        }

        dustGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        dustGeometry.setAttribute('aScale', new THREE.BufferAttribute(scales, 1));
        dustGeometry.setAttribute('aPhase', new THREE.BufferAttribute(phases, 1));
        dustGeometry.setAttribute('aAltitude', new THREE.BufferAttribute(altitudes, 1));

        dustMaterial = new THREE.ShaderMaterial({
          vertexShader: dustVertexShader,
          fragmentShader: dustFragmentShader,
          uniforms: {
            uTime: { value: 0 },
            uDustSize: { value: config.dustSize },
            uDriftSpeed: { value: config.dustDriftSpeed },
            uColor1: { value: new THREE.Color(config.color1) },
            uColor2: { value: new THREE.Color(config.color2) },
            uColor3: { value: new THREE.Color(config.color3) },
            uColor4: { value: new THREE.Color(config.color4) },
            uColor5: { value: new THREE.Color(config.color5) },
            uBrightness: { value: config.dustBrightness }
          },
          transparent: true,
          depthWrite: false,
          blending: THREE.AdditiveBlending
        });

        dustPoints = new THREE.Points(dustGeometry, dustMaterial);
        scene.add(dustPoints);
      }

      function buildIonPillars() {
        if (pillarGroup) {
          scene.remove(pillarGroup);
          pillarGroup.traverse(child => {
            if (child.geometry) child.geometry.dispose();
            if (child.material) child.material.dispose();
          });
        }

        pillarGroup = new THREE.Group();
        pillarMaterials = [];

        const count = config.pillarCount;
        for (let i = 0; i < count; i++) {
          const norm = i / (count - 1 || 1);
          const pillarWidth = 14.0 + Math.random() * 18.0;
          const pillarHeight = config.pillarHeight * (0.75 + Math.random() * 0.5);

          const pillarGeo = new THREE.PlaneGeometry(pillarWidth, pillarHeight, 1, 1);
          const x = (norm - 0.5) * 320.0 + (Math.random() - 0.5) * 40.0;
          const z = -200.0 + Math.random() * 160.0;
          const y = pillarHeight * 0.4 - 15.0;

          const uniforms = {
            uTime: { value: 0 },
            uColor1: { value: new THREE.Color(config.color1) },
            uColor2: { value: new THREE.Color(config.color2) },
            uColor3: { value: new THREE.Color(config.color3) },
            uColor5: { value: new THREE.Color(config.color5) },
            uBrightness: { value: config.pillarBrightness },
            uPillarIndex: { value: i }
          };

          const pillarMat = new THREE.ShaderMaterial({
            vertexShader: pillarVertexShader,
            fragmentShader: pillarFragmentShader,
            uniforms: uniforms,
            transparent: true,
            depthWrite: false,
            side: THREE.DoubleSide,
            blending: THREE.AdditiveBlending
          });

          const pillarMesh = new THREE.Mesh(pillarGeo, pillarMat);
          pillarMesh.position.set(x, y, z);
          pillarMesh.rotation.y = (Math.random() - 0.5) * 0.4;

          pillarGroup.add(pillarMesh);
          pillarMaterials.push(uniforms);
        }

        scene.add(pillarGroup);
      }

      class ShootingStar {
        constructor() {
          this.mesh = null;
          this.active = false;
          this.progress = 1.0;
          this.startPos = new THREE.Vector3();
          this.dir = new THREE.Vector3();
          this.length = 35.0;
          this.speed = 1.8;

          const geo = new THREE.BufferGeometry();
          const positions = new Float32Array(6);
          const alphas = new Float32Array([1.0, 0.0]);

          geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
          geo.setAttribute('aAlpha', new THREE.BufferAttribute(alphas, 1));

          const mat = new THREE.ShaderMaterial({
            vertexShader: `
              attribute float aAlpha;
              varying float vAlpha;
              void main() {
                vAlpha = aAlpha;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
              }
            `,
            fragmentShader: `
              varying float vAlpha;
              uniform vec3 uColor;
              void main() {
                gl_FragColor = vec4(uColor * 2.5 * vAlpha, vAlpha);
              }
            `,
            uniforms: {
              uColor: { value: new THREE.Color(config.color5) }
            },
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending
          });

          this.mesh = new THREE.Line(geo, mat);
          this.mesh.visible = false;
          scene.add(this.mesh);
        }

        spawn() {
          this.active = true;
          this.progress = 0.0;
          this.speed = (1.5 + Math.random() * 1.5) * config.meteorSpeed;
          this.length = 25.0 + Math.random() * 30.0;

          const theta = Math.random() * Math.PI * 2;
          const radius = 250 + Math.random() * 150;
          const y = 80 + Math.random() * 80;

          this.startPos.set(
            Math.cos(theta) * radius,
            y,
            Math.sin(theta) * radius - 100
          );

          this.dir.set(
            (Math.random() - 0.5) * 1.2,
            -0.6 - Math.random() * 0.5,
            (Math.random() - 0.5) * 1.2
          ).normalize();

          this.mesh.visible = true;
        }

        update(delta) {
          if (!this.active) return;

          this.progress += delta * this.speed * 0.8;
          if (this.progress >= 1.0) {
            this.active = false;
            this.mesh.visible = false;
            return;
          }

          const currentHead = this.startPos.clone().addScaledVector(this.dir, this.progress * 180.0);
          const currentTail = currentHead.clone().addScaledVector(this.dir, -this.length * (1.0 - this.progress * 0.5));

          const posAttr = this.mesh.geometry.attributes.position;
          posAttr.setXYZ(0, currentHead.x, currentHead.y, currentHead.z);
          posAttr.setXYZ(1, currentTail.x, currentTail.y, currentTail.z);
          posAttr.needsUpdate = true;
        }
      }

      function initShootingStars() {
        shootingStars = [];
        for (let i = 0; i < 4; i++) {
          shootingStars.push(new ShootingStar());
        }
      }

      function updateShootingStars(delta) {
        if (Math.random() < 0.015 * config.meteorFrequency) {
          const available = shootingStars.find(s => !s.active);
          if (available) available.spawn();
        }

        shootingStars.forEach(s => s.update(delta));
      }

      // =========================================================================
      // COLOR & UNIFORM SYNCHRONIZATION
      // =========================================================================
      function updateMaterialUniforms() {
        const c1 = new THREE.Color(config.color1);
        const c2 = new THREE.Color(config.color2);
        const c3 = new THREE.Color(config.color3);
        const c4 = new THREE.Color(config.color4);
        const c5 = new THREE.Color(config.color5);

        auroraMaterials.forEach((u) => {
          u.uColor1.value.copy(c1);
          u.uColor2.value.copy(c2);
          u.uColor3.value.copy(c3);
          u.uColor4.value.copy(c4);
          u.uColor5.value.copy(c5);
          u.uWaveAmp.value = config.waveAmplitude;
          u.uWaveSpeed.value = config.waveSpeed;
          u.uRayFrequency.value = config.rayFrequency;
          u.uNoiseScale.value = config.noiseScale;
          u.uNoiseSpeed.value = config.noiseSpeed;
          u.uBrightness.value = config.curtainBrightness;
          u.uOpacity.value = config.curtainOpacity;
        });

        if (dustMaterial) {
          dustMaterial.uniforms.uColor1.value.copy(c1);
          dustMaterial.uniforms.uColor2.value.copy(c2);
          dustMaterial.uniforms.uColor3.value.copy(c3);
          dustMaterial.uniforms.uColor4.value.copy(c4);
          dustMaterial.uniforms.uColor5.value.copy(c5);
          dustMaterial.uniforms.uDustSize.value = config.dustSize;
          dustMaterial.uniforms.uDriftSpeed.value = config.dustDriftSpeed;
          dustMaterial.uniforms.uBrightness.value = config.dustBrightness;
        }

        pillarMaterials.forEach((u) => {
          u.uColor1.value.copy(c1);
          u.uColor2.value.copy(c2);
          u.uColor3.value.copy(c3);
          u.uColor5.value.copy(c5);
          u.uBrightness.value = config.pillarBrightness;
        });

        shootingStars.forEach(s => {
          if (s.mesh && s.mesh.material.uniforms) {
            s.mesh.material.uniforms.uColor.value.copy(c5);
          }
        });

        if (starFieldPoints && starFieldPoints.material.uniforms) {
          starFieldPoints.material.uniforms.uColor5.value.copy(c5);
        }

        if (floorMesh) {
          floorMesh.visible = !config.greenScreen && config.groundReflection;
        }
      }

      function applyPalette(themeName) {
        if (!COLOR_PALETTES[themeName]) return;
        const pal = COLOR_PALETTES[themeName];
        config.theme = themeName;
        config.color1 = pal.color1;
        config.color2 = pal.color2;
        config.color3 = pal.color3;
        config.color4 = pal.color4;
        config.color5 = pal.color5;

        updateMaterialUniforms();
        if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
      }

      function setGreenScreen(enabled) {
        const bg = enabled ? '#00ff00' : '#01030a';
        scene.background = new THREE.Color(bg);
        document.body.style.backgroundColor = bg;
        if (floorMesh) {
          floorMesh.visible = !enabled && config.groundReflection;
        }
      }

      // =========================================================================
      // PROCEDURAL RANDOMIZATION ON SCENE CLICK
      // =========================================================================
      function randomizeScene() {
        const paletteKeys = Object.keys(COLOR_PALETTES);
        const randomKey = paletteKeys[Math.floor(Math.random() * paletteKeys.length)];
        applyPalette(randomKey);

        config.curtainHeight = +(120.0 + Math.random() * 40.0).toFixed(1);
        config.curtainElevation = +(30.0 + Math.random() * 25.0).toFixed(1);
        config.waveAmplitude = +(12.0 + Math.random() * 10.0).toFixed(1);
        config.waveSpeed = +(0.5 + Math.random() * 0.5).toFixed(2);
        config.rayFrequency = +(28.0 + Math.random() * 22.0).toFixed(1);
        config.noiseScale = +(2.0 + Math.random() * 1.8).toFixed(2);
        config.noiseSpeed = +(0.4 + Math.random() * 0.5).toFixed(2);
        config.curtainBrightness = +(1.1 + Math.random() * 0.5).toFixed(2);

        config.dustSize = +(0.7 + Math.random() * 0.6).toFixed(2);
        config.dustDriftSpeed = +(1.2 + Math.random() * 0.8).toFixed(2);
        config.dustBrightness = +(1.0 + Math.random() * 0.5).toFixed(2);
        config.pillarBrightness = +(0.8 + Math.random() * 0.6).toFixed(2);

        if (postProcessor) {
          postProcessor.settings.bloomStrength = +(1.6 + Math.random() * 1.2).toFixed(2);
          postProcessor.settings.chromaticAberration = +(0.02 + Math.random() * 0.04).toFixed(3);
          postProcessor.updateSettings();
        }

        buildAuroraCurtains();
        buildDiamondDust();
        buildIonPillars();
        updateMaterialUniforms();

        if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
      }

      // =========================================================================
      // LIL-GUI SETUP (STANDARD UNMODIFIED STYLING)
      // =========================================================================
      function setupGUI() {
        gui = new GUI({ title: 'Celestial Aurora & Diamond Dust' });

        // 1. Presets & Themes
        const themeFolder = gui.addFolder('Presets & Animations');
        themeFolder.add(config, 'theme', Object.keys(COLOR_PALETTES))
          .name('Color Scheme')
          .onChange(applyPalette);

        themeFolder.add(config, 'animationPreset', [
          'Polar Drift Orbit',
          'Curtain Ascendance',
          'Cosmic Zenith',
          'Horizon Sway',
          'Static Vantage'
        ]).name('Animation Style');

        // 2. Aurora Curtains
        const auroraFolder = gui.addFolder('Aurora Curtains');
        auroraFolder.add(config, 'curtainElevation', -80.0, 100.0, 1.0)
          .name('Curtain Elevation (Y)')
          .onChange((v) => {
            if (auroraGroup) auroraGroup.position.y = v;
          });
        auroraFolder.add(config, 'curtainCount', 3, 16, 1).name('Curtain Planes').onChange(buildAuroraCurtains);
        auroraFolder.add(config, 'curtainHeight', 60.0, 240.0, 2.0).name('Curtain Height').onChange(buildAuroraCurtains);
        auroraFolder.add(config, 'curtainWidth', 180.0, 500.0, 10.0).name('Curtain Width').onChange(buildAuroraCurtains);
        auroraFolder.add(config, 'waveAmplitude', 2.0, 35.0, 0.5).name('Wave Amplitude').onChange(updateMaterialUniforms);
        auroraFolder.add(config, 'waveSpeed', 0.1, 2.0, 0.05).name('Wave Speed').onChange(updateMaterialUniforms);
        auroraFolder.add(config, 'rayFrequency', 10.0, 70.0, 1.0).name('Striation Rays').onChange(updateMaterialUniforms);
        auroraFolder.add(config, 'noiseScale', 1.0, 6.0, 0.1).name('Noise Scale').onChange(updateMaterialUniforms);
        auroraFolder.add(config, 'noiseSpeed', 0.1, 2.0, 0.05).name('Noise Speed').onChange(updateMaterialUniforms);
        auroraFolder.add(config, 'curtainBrightness', 0.3, 3.5, 0.05).name('Curtain Glow').onChange(updateMaterialUniforms);
        auroraFolder.add(config, 'curtainOpacity', 0.2, 1.0, 0.05).name('Curtain Opacity').onChange(updateMaterialUniforms);

        // 3. Camera Position & Framing
        const camFolder = gui.addFolder('Camera View & Framing');
        camFolder.add(config, 'cameraElevation', -20.0, 120.0, 1.0)
          .name('Camera Height (Y)')
          .onChange((v) => {
            camera.position.y = v;
          });
        camFolder.add(config, 'cameraPitch', 0.0, 140.0, 1.0)
          .name('Look Height (Pitch)')
          .onChange((v) => {
            controls.target.y = v;
          });

        // 4. Polar Diamond Dust & Atmospheric Crystals
        const dustFolder = gui.addFolder('Diamond Dust Atmosphere');
        dustFolder.add(config, 'dustCount', 100, 4000, 50).name('Crystal Count').onChange(buildDiamondDust);
        dustFolder.add(config, 'dustSize', 0.2, 4.0, 0.05).name('Crystal Size').onChange(updateMaterialUniforms);
        dustFolder.add(config, 'dustDriftSpeed', 0.1, 3.0, 0.05).name('Wind Drift Speed').onChange(updateMaterialUniforms);
        dustFolder.add(config, 'dustBrightness', 0.2, 3.5, 0.05).name('Sparkle Brightness').onChange(updateMaterialUniforms);

        // 5. Ion Pillars & Shooting Stars
        const ionFolder = gui.addFolder('Pillars & Meteors');
        ionFolder.add(config, 'pillarCount', 4, 32, 1).name('Ion Pillars').onChange(buildIonPillars);
        ionFolder.add(config, 'pillarBrightness', 0.0, 3.0, 0.1).name('Pillar Intensity').onChange(updateMaterialUniforms);
        ionFolder.add(config, 'meteorFrequency', 0.0, 3.0, 0.1).name('Meteor Frequency');
        ionFolder.add(config, 'meteorSpeed', 0.5, 3.0, 0.1).name('Meteor Speed');

        // 6. Color Customization
        const colorFolder = gui.addFolder('Color Palette');
        const makeColorPicker = (prop, label) => {
          colorFolder.addColor(config, prop).name(label).onChange(() => {
            config.theme = 'Custom';
            updateMaterialUniforms();
          });
        };
        makeColorPicker('color1', 'Lower Oxygen Glow');
        makeColorPicker('color2', 'Mid-Curtain Aqua');
        makeColorPicker('color3', 'Magnetic Violet');
        makeColorPicker('color4', 'Crown Magenta');
        makeColorPicker('color5', 'Core Corona Phosphor');

        // 7. Integrated PostProcessor Suite Settings
        if (postProcessor) {
          postProcessor.attachGUI(gui, 'Post Processor & Optics');
        }

        // 8. System & Display
        const sysFolder = gui.addFolder('System & Display');
        sysFolder.add(config, 'dpr', 0.5, 2.5, 0.1).name('DPR (Pixel Ratio)').onChange((v) => {
          renderer.setPixelRatio(v);
          postProcessor.setSize(window.innerWidth, window.innerHeight, v);
        });
        sysFolder.add(config, 'speedMultiplier', 0.0, 3.0, 0.05).name('Animation Speed');
        sysFolder.add(config, 'greenScreen').name('Green Screen (#00ff00)').onChange(setGreenScreen);
        sysFolder.add(config, 'groundReflection').name('Lake Reflection').onChange(buildAuroraCurtains);
        sysFolder.add(config, 'clickToRandomize').name('Click Scene Randomize');

        gui.open();
      }

      // =========================================================================
      // INTERACTION & KEYBOARD HANDLERS
      // =========================================================================
      function setupInteractionListeners() {
        window.addEventListener('keydown', (e) => {
          if (e.key === 'h' || e.key === 'H') {
            if (gui._hidden) {
              gui.show();
            } else {
              gui.hide();
            }
          }
        });

        const dom = renderer.domElement;
        dom.addEventListener('pointerdown', (e) => {
          pointerDownPos = { x: e.clientX, y: e.clientY };
          pointerDownTime = performance.now();
        });

        dom.addEventListener('pointerup', (e) => {
          const deltaX = Math.abs(e.clientX - pointerDownPos.x);
          const deltaY = Math.abs(e.clientY - pointerDownPos.y);
          const duration = performance.now() - pointerDownTime;

          if (deltaX < 6 && deltaY < 6 && duration < 320) {
            if (config.clickToRandomize) {
              randomizeScene();
            }
          }
        });
      }

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        if (postProcessor) {
          postProcessor.setSize(window.innerWidth, window.innerHeight, config.dpr);
        }
      }

      // =========================================================================
      // 5 SMOOTH CAMERA ANIMATION PRESETS
      // =========================================================================
      function updateCameraAnimation(delta) {
        const t = globalTime * 0.18;

        switch (config.animationPreset) {
          case 'Polar Drift Orbit':
            camState.orbitAngle += delta * 0.07 * config.speedMultiplier;
            camState.swayAngle += delta * 0.12 * config.speedMultiplier;
            const r = 75 + Math.sin(camState.swayAngle * 0.6) * 15;
            camera.position.x = Math.sin(camState.orbitAngle) * r;
            camera.position.z = Math.cos(camState.orbitAngle) * r;
            camera.position.y = config.cameraElevation + Math.sin(camState.swayAngle) * 8;
            controls.target.set(0, config.cameraPitch + Math.sin(camState.swayAngle * 0.7) * 6, -30);
            break;

          case 'Curtain Ascendance':
            camState.swayAngle += delta * 0.15 * config.speedMultiplier;
            const ascRadius = 70 + Math.cos(camState.swayAngle * 0.5) * 12;
            camera.position.x = Math.sin(t * 0.3) * ascRadius;
            camera.position.z = Math.cos(t * 0.3) * ascRadius;
            camera.position.y = 25 + (Math.sin(camState.swayAngle) * 0.5 + 0.5) * 45;
            controls.target.set(0, camera.position.y + 20, -35);
            break;

          case 'Cosmic Zenith':
            camState.orbitAngle += delta * 0.09 * config.speedMultiplier;
            camera.position.x = Math.sin(camState.orbitAngle) * 55;
            camera.position.z = Math.cos(camState.orbitAngle) * 55;
            camera.position.y = 28;
            controls.target.set(0, 85, -20);
            break;

          case 'Horizon Sway':
            camState.swayAngle += delta * 0.14 * config.speedMultiplier;
            camera.position.x = Math.sin(camState.swayAngle) * 50;
            camera.position.z = 70 + Math.cos(camState.swayAngle * 0.8) * 15;
            camera.position.y = config.cameraElevation + Math.sin(camState.swayAngle * 0.5) * 8;
            controls.target.set(0, config.cameraPitch, -35);
            break;

          case 'Static Vantage':
          default:
            // Static Vantage: Fixed majestic upward framing
            break;
        }
      }

      // =========================================================================
      // MAIN RENDER & ANIMATION LOOP
      // =========================================================================
      function animate() {
        requestAnimationFrame(animate);

        const delta = clock.getDelta();
        const effectiveSpeed = delta * config.speedMultiplier;
        globalTime += effectiveSpeed;

        auroraMaterials.forEach((u) => {
          u.uTime.value = globalTime;
        });

        if (dustMaterial) {
          dustMaterial.uniforms.uTime.value = globalTime;
        }

        pillarMaterials.forEach((u) => {
          u.uTime.value = globalTime;
        });

        updateShootingStars(delta * config.speedMultiplier);

        if (starFieldPoints && starFieldPoints.material.uniforms) {
          starFieldPoints.material.uniforms.uTime.value = globalTime;
        }

        if (!controls.state || controls.state === -1) {
          updateCameraAnimation(delta);
        }

        controls.update();

        // Render scene through the PostProcessor suite
        postProcessor.renderScene(scene, camera);
      }

      // =========================================================================
      // INITIALIZATION & EXECUTION
      // =========================================================================
      function init() {
        scene = new THREE.Scene();
        setGreenScreen(config.greenScreen);

        camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 1, 3000);
        camera.position.set(0, config.cameraElevation, 68);

        renderer = new THREE.WebGLRenderer({
          antialias: true,
          powerPreference: 'high-performance',
          alpha: false
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(config.dpr);
        document.body.appendChild(renderer.domElement);

        controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.screenSpacePanning = true;
        controls.minDistance = 15;
        controls.maxDistance = 550;
        controls.target.set(0, config.cameraPitch, -40);

        // Initialize PostProcessor Suite
        postProcessor = new PostProcessor(renderer, {
          enabled: true,
          bloomStrength: 2.17,
          chromaticAberration: 0.14,
          vignetteBoost: 1.1,
          vignetteReduction: 0.2,
          noiseIntensity: 0.06,
          gamma: 1.05,
          minInputLevel: 0.0,
          maxInputLevel: 0.875
        });
        postProcessor.setSize(window.innerWidth, window.innerHeight, config.dpr);

        // Build Scene Visual Systems
        createStarField();
        createReflectiveFloor();
        buildAuroraCurtains();
        buildDiamondDust();
        buildIonPillars();
        initShootingStars();

        // Control Panel & Interaction Handlers
        setupGUI();
        setupInteractionListeners();

        window.addEventListener('resize', onWindowResize);
      }

      // Execute scene bootstrap
      init();
      animate();
    </script>
  </body>
</html>
