import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import GUI from 'lil-gui';

// =========================================================================================
// POST PROCESSOR SUITE (From postprocessing/PostProcessor.js - inlined for universal protocol support)
// =========================================================================================
const orthoVertexShader = `
precision highp float;
in vec3 position;
out vec2 vUv;
void main() {
  vUv = position.xy * 0.5 + 0.5;
  gl_Position = vec4(position, 1.0);
}
`;

const brightFragmentShader = `
precision highp float;
uniform sampler2D inputTexture;
uniform float bloomThreshold;
in vec2 vUv;
out vec4 fragColor;

void main() {
  vec4 color = texture(inputTexture, vUv);
  float luminance = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
  float knee = 0.1;
  float soft = luminance - bloomThreshold + knee;
  soft = clamp(soft, 0.0, 2.0 * knee);
  soft = (soft * soft) / (4.0 * knee + 0.00001);
  float contribution = max(soft, luminance - bloomThreshold);
  contribution /= max(luminance, 0.00001);
  fragColor = vec4(color.rgb * contribution, color.a);
}
`;

const blur13ShaderChunk = `
vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
  vec2 resolution = vec2(textureSize(image, 0));
  vec4 color = vec4(0.0);
  vec2 off1 = vec2(1.411764705882353) * direction;
  vec2 off2 = vec2(3.2941176470588234) * direction;
  vec2 off3 = vec2(5.176470588235294) * direction;
  color += texture(image, uv) * 0.1964825501511404;
  color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
  color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
  color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
  color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
  color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
  color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
  return color;
}
`;

const blurFragmentShader = `
precision highp float;
uniform sampler2D inputTexture;
uniform vec2 direction;
in vec2 vUv;
out vec4 color;
${blur13ShaderChunk}
void main() {
  color = blur13(inputTexture, vUv, direction);
}
`;

const godRaysDepthMaskShader = `
precision highp float;
uniform sampler2D inputTexture;
uniform float threshold;
in vec2 vUv;
out vec4 fragColor;

void main() {
  vec4 color = texture(inputTexture, vUv);
  float lum = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
  float factor = smoothstep(threshold, threshold + 0.15, lum);
  fragColor = vec4(vec3(factor), 1.0);
}
`;

const godRaysGenerateShader = `
precision highp float;
#define TAPS_PER_PASS 6.0

uniform sampler2D inputTexture;
uniform vec3 vSunPositionScreenSpace;
uniform float fStepSize;
uniform float distanceAttenuation;
uniform float maxDensity;
in vec2 vUv;
out vec4 fragColor;

void main() {
  vec2 delta = vSunPositionScreenSpace.xy - vUv;
  float dist = length(delta);
  vec2 stepv = fStepSize * delta / max(dist, 0.0001);
  float iters = dist / max(fStepSize, 0.00001);

  vec2 uv = vUv;
  float col = 0.0;
  float f = min(1.0, max(vSunPositionScreenSpace.z, 0.0));
  float atten = 1.0 / (1.0 + pow(dist, distanceAttenuation));

  if (0.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
  uv += stepv;
  if (1.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
  uv += stepv;
  if (2.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
  uv += stepv;
  if (3.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
  uv += stepv;
  if (4.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
  uv += stepv;
  if (5.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;

  float finalVal = min(col / TAPS_PER_PASS * atten, maxDensity);
  fragColor = vec4(vec3(finalVal), 1.0);
}
`;

const anamorphicBrightShader = `
precision highp float;
uniform sampler2D inputTexture;
uniform float threshold;
uniform float smoothWidth;
in vec2 vUv;
out vec4 fragColor;

void main() {
  vec4 color = texture(inputTexture, vUv);
  float v = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
  float alpha = smoothstep(threshold, threshold + smoothWidth, v);
  fragColor = mix(vec4(0.0), color, alpha);
}
`;

const anamorphicBlurShader = `
precision highp float;
uniform sampler2D inputTexture;
uniform vec2 resolution;
uniform float samples;
uniform float intensity;
uniform vec3 tintColor;
uniform float bloomRadius;
in vec2 vUv;
out vec4 fragColor;

void main() {
  int halfSamples = max(1, int(samples) / 2);
  float fHalfSamples = float(halfSamples);
  vec2 invSize = 1.0 / resolution;
  vec4 total = vec4(0.0);

  for (int i = -64; i <= 64; i++) {
    if (i < -halfSamples || i > halfSamples) continue;
    float softness = 1.0 - abs(float(i)) / fHalfSamples;
    softness = pow(softness, 2.0);
    vec2 shiftedUV = vec2(vUv.x + invSize.x * float(i) * (4.0 + bloomRadius * 8.0), vUv.y);
    shiftedUV = clamp(shiftedUV, 0.001, 0.999);
    total += texture(inputTexture, shiftedUV) * softness;
  }

  fragColor = (total / (samples / 3.0)) * vec4(tintColor, 1.0) * intensity;
}
`;

const finalFragmentShader = `
precision highp float;
uniform vec2 resolution;
uniform sampler2D inputTexture;
uniform sampler2D blur0Texture;
uniform sampler2D blur1Texture;
uniform sampler2D blur2Texture;
uniform sampler2D blur3Texture;
uniform sampler2D blur4Texture;
uniform sampler2D raysTexture;
uniform sampler2D anamorphicTexture;
uniform bool bloomEnabled;
uniform float bloomStrength;
uniform bool raysEnabled;
uniform float raysStrength;
uniform vec3 raysColor;
uniform bool anamorphicEnabled;
uniform float vignetteBoost;
uniform float vignetteReduction;
uniform float noiseIntensity;
uniform float time;
in vec2 vUv;
out vec4 fragColor;

float vignette(vec2 uv, float boost, float reduction) {
  vec2 position = vUv - 0.5;
  return boost - length(position) * reduction;
}

float hash1(uint n) {
  n = (n << 13U) ^ n;
  n = n * (n * n * 15731U + 789221U) + 1376312589U;
  return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
}

float noise(in vec2 uv, in float timeVal) {
  uvec2 p = uvec2(uv);
  return hash1(p.x + 1920U * p.y + (1920U * 1080U) * uint(timeVal));
}

void main() {
  vec4 color = texture(inputTexture, vUv);

  if (bloomEnabled && bloomStrength > 0.001) {
    vec4 b0 = texture(blur0Texture, vUv);
    vec4 b1 = texture(blur1Texture, vUv);
    vec4 b2 = texture(blur2Texture, vUv);
    vec4 b3 = texture(blur3Texture, vUv);
    vec4 b4 = texture(blur4Texture, vUv);

    vec4 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
    color += bloomSum * bloomStrength;
  }

  if (raysEnabled && raysStrength > 0.001) {
    vec4 r = texture(raysTexture, vUv);
    color.rgb += r.rgb * raysColor * raysStrength;
  }

  if (anamorphicEnabled) {
    vec4 a = texture(anamorphicTexture, vUv);
    color.rgb += a.rgb;
  }

  color.rgb *= vignette(vUv, vignetteBoost, vignetteReduction);
  color.rgb += noiseIntensity * noise(gl_FragCoord.xy, time);
  fragColor = vec4(color.rgb, 1.0);
}
`;

const chromaticAberrationShaderChunk = `
vec2 barrelDistortion(vec2 coord, float amt) {
  vec2 cc = coord - 0.5;
  float dist = dot(cc, cc);
  return coord + cc * dist * amt;
}
float sat(float t) { return clamp(t, 0.0, 1.0); }
float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
vec4 spectrum_offset(float t) {
  float lo = step(t, 0.5);
  float hi = 1.0 - lo;
  float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
  vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
  return pow(ret, vec4(1.0 / 2.2));
}
const float max_distort = 2.2;
const int num_iter = 8;
const float reci_num_iter_f = 1.0 / float(num_iter);
vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
  vec4 sumcol = vec4(0.0);
  vec4 sumw = vec4(0.0);
  for (int i = 0; i < num_iter; ++i) {
    float t = float(i) * reci_num_iter_f;
    vec4 w = spectrum_offset(t);
    sumw += w;
    sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
  }
  return sumcol / sumw;
}
`;

const colorFragmentShader = `
precision highp float;
uniform sampler2D inputTexture;
uniform float chromaticAberrationAmount;
uniform float minInputLevel;
uniform float maxInputLevel;
uniform float gammaLevel;
uniform float exposure;
uniform float fisheyeStrength;
uniform float fisheyeRadius;
uniform float time;
uniform int visionMode;
uniform float thermalSensitivity;
uniform float nightVisionNoise;
uniform float nightVisionGain;
uniform float crtIntensity;
in vec2 vUv;
out vec4 fragColor;

${chromaticAberrationShaderChunk}

vec2 applyFisheye(vec2 uv, float strength, float radius) {
  if (abs(strength) < 0.0001) return uv;
  vec2 p = uv - 0.5;
  float d = length(p);
  if (d > radius * 1.5) return uv;
  float r = d / max(radius, 0.001);
  float theta = atan(p.y, p.x);
  float rDist = r + strength * (r * r * r);
  return 0.5 + vec2(cos(theta), sin(theta)) * (rDist * radius);
}

vec3 ACESFilmicToneMapping(vec3 color) {
  float a = 2.51;
  float b = 0.03;
  float c = 2.43;
  float d = 0.59;
  float e = 0.14;
  return clamp((color * (a * color + b)) / (color * (c * color + d) + e), 0.0, 1.0);
}

vec3 gammaCorrect(vec3 color, vec3 gamma) {
  return pow(max(color, vec3(0.0)), 1.0 / gamma);
}
vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
  return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
}
vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
  return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
}

void main() {
  vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
  vec4 col = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
  vec3 finalCol = col.rgb;
  
  vec3 exposedColor = finalCol * exposure;
  vec3 toneMappedColor = ACESFilmicToneMapping(exposedColor);
  finalCol = finalLevels(toneMappedColor, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));

  fragColor = vec4(finalCol, 1.0);
}
`;

const copyFragmentShader = `
precision highp float;
uniform sampler2D inputTexture;
in vec2 vUv;
out vec4 fragColor;
void main() {
  fragColor = texture(inputTexture, vUv);
}
`;

function createFBO(w, h, options = {}) {
  return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
    wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
    wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
    minFilter: options.minFilter || THREE.LinearFilter,
    magFilter: options.magFilter || THREE.LinearFilter,
    format: options.format || THREE.RGBAFormat,
    type: options.type || THREE.HalfFloatType,
    stencilBuffer: options.stencilBuffer || false,
    depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : true,
    samples: options.samples || 0,
  });
}

class ShaderPass {
  constructor(shader, options = {}) {
    this.shader = shader;
    this.orthoScene = new THREE.Scene();
    this.fbo = createFBO(1, 1, options);
    this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
    this.orthoScene.add(this.orthoQuad);
    this.texture = this.fbo.texture;
  }
  render(renderer, toScreen = false) {
    if (!toScreen) {
      renderer.setRenderTarget(this.fbo);
    }
    renderer.render(this.orthoScene, this.orthoCamera);
    if (!toScreen) {
      renderer.setRenderTarget(null);
    }
  }
  setSize(width, height) {
    this.fbo.setSize(Math.max(1, width), Math.max(1, height));
    this.orthoQuad.scale.set(width, height, 1);
  }
}

class ShaderPingPongPass {
  constructor(shader, options = {}) {
    this.shader = shader;
    this.orthoScene = new THREE.Scene();
    this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
    this.currentFBO = 0;
    this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
    this.orthoScene.add(this.orthoQuad);
  }
  render(renderer) {
    renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
    renderer.render(this.orthoScene, this.orthoCamera);
    renderer.setRenderTarget(null);
    this.currentFBO = 1 - this.currentFBO;
  }
  get current() { return this.fbos[this.currentFBO]; }
  get texture() { return this.current.texture; }
  setSize(width, height) {
    const w = Math.max(1, width);
    const h = Math.max(1, height);
    this.orthoQuad.scale.set(w, h, 1);
    this.fbos[0].setSize(w, h);
    this.fbos[1].setSize(w, h);
  }
}

class BloomPass {
  constructor(strength = 0.8, radius = 0.5, threshold = 0.2, levels = 5) {
    this.strength = strength;
    this.radius = radius;
    this.threshold = threshold;
    this.enabled = true;
    this.levels = levels;

    this.brightShader = new THREE.RawShaderMaterial({
      uniforms: {
        inputTexture: { value: null },
        bloomThreshold: { value: this.threshold },
      },
      vertexShader: orthoVertexShader,
      fragmentShader: brightFragmentShader,
      glslVersion: THREE.GLSL3,
    });
    this.brightPass = new ShaderPass(this.brightShader, {
      format: THREE.RGBAFormat,
      type: THREE.HalfFloatType,
    });

    this.blurShader = new THREE.RawShaderMaterial({
      uniforms: {
        inputTexture: { value: null },
        direction: { value: new THREE.Vector2(0, 1) },
      },
      vertexShader: orthoVertexShader,
      fragmentShader: blurFragmentShader,
      glslVersion: THREE.GLSL3,
    });

    this.blurPasses = [];
    for (let i = 0; i < this.levels; i++) {
      this.blurPasses.push(new ShaderPingPongPass(this.blurShader, {
        format: THREE.RGBAFormat,
        type: THREE.HalfFloatType,
      }));
    }
  }

  setSize(w, h) {
    let tw = Math.max(1, w);
    let th = Math.max(1, h);
    this.brightPass.setSize(tw, th);
    for (let i = 0; i < this.levels; i++) {
      tw = Math.max(1, Math.round(tw / 2));
      th = Math.max(1, Math.round(th / 2));
      this.blurPasses[i].setSize(tw, th);
    }
  }

  set source(texture) {
    this.brightShader.uniforms.inputTexture.value = texture;
  }

  render(renderer) {
    if (!this.enabled || this.strength <= 0.001) return;

    this.brightShader.uniforms.bloomThreshold.value = this.threshold;
    this.brightPass.render(renderer);

    const baseOffset = Math.max(0.1, this.radius * 2.0);
    const u = this.blurShader.uniforms;

    for (let j = 0; j < this.levels; j++) {
      const blurPass = this.blurPasses[j];
      const stepOffset = baseOffset * (1.0 + j * 0.5);

      u.direction.value.set(stepOffset, 0);
      u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
      blurPass.render(renderer);

      u.direction.value.set(0, stepOffset * 0.5);
      u.inputTexture.value = blurPass.current.texture;
      blurPass.render(renderer);
    }
  }
}

class PostProcessor {
  constructor(renderer, params = {}) {
    this.renderer = renderer;

    this.settings = {
      enabled: params.enabled !== undefined ? params.enabled : true,
      bloomEnabled: params.bloomEnabled !== undefined ? params.bloomEnabled : true,
      bloomStrength: params.bloomStrength !== undefined ? params.bloomStrength : 1.3,
      bloomRadius: params.bloomRadius !== undefined ? params.bloomRadius : 0.65,
      bloomThreshold: params.bloomThreshold !== undefined ? params.bloomThreshold : 0.22,
      raysEnabled: params.raysEnabled !== undefined ? params.raysEnabled : false,
      raysStrength: params.raysStrength !== undefined ? params.raysStrength : 0.6,
      raysDensity: 1.0,
      raysMaxDensity: 0.5,
      raysDistanceAttenuation: 2.0,
      raysThreshold: 0.2,
      raysColor: new THREE.Color(0xffd700),
      raysColorHex: '#ffd700',
      anamorphicEnabled: params.anamorphicEnabled !== undefined ? params.anamorphicEnabled : false,
      anamorphicIntensity: 4.0,
      anamorphicThreshold: 0.35,
      anamorphicSamples: 32,
      anamorphicRadius: 0.0,
      anamorphicSmoothWidth: 0.05,
      anamorphicColor: new THREE.Color(0x7a8aff),
      anamorphicColorHex: '#7a8aff',
      fisheyeStrength: 0.0,
      fisheyeRadius: 1.0,
      chromaticAberration: params.chromaticAberration !== undefined ? params.chromaticAberration : 0.015,
      vignetteBoost: params.vignetteBoost !== undefined ? params.vignetteBoost : 1.05,
      vignetteReduction: params.vignetteReduction !== undefined ? params.vignetteReduction : 0.45,
      noiseIntensity: params.noiseIntensity !== undefined ? params.noiseIntensity : 0.01,
      gamma: 1.0,
      minInputLevel: 0.0,
      maxInputLevel: 1.0,
      exposure: 1.1,
    };

    this.sceneTarget = createFBO(1, 1, { type: THREE.HalfFloatType });
    this.bloomPass = new BloomPass(this.settings.bloomStrength, this.settings.bloomRadius, this.settings.bloomThreshold, 5);

    this.finalShader = new THREE.RawShaderMaterial({
      uniforms: {
        resolution: { value: new THREE.Vector2(1, 1) },
        bloomEnabled: { value: this.settings.bloomEnabled },
        bloomStrength: { value: this.settings.bloomStrength },
        raysEnabled: { value: this.settings.raysEnabled },
        raysStrength: { value: this.settings.raysStrength },
        raysColor: { value: this.settings.raysColor },
        anamorphicEnabled: { value: this.settings.anamorphicEnabled },
        vignetteBoost: { value: this.settings.vignetteBoost },
        vignetteReduction: { value: this.settings.vignetteReduction },
        noiseIntensity: { value: this.settings.noiseIntensity },
        inputTexture: { value: null },
        blur0Texture: { value: null },
        blur1Texture: { value: null },
        blur2Texture: { value: null },
        blur3Texture: { value: null },
        blur4Texture: { value: null },
        raysTexture: { value: null },
        anamorphicTexture: { value: null },
        time: { value: 0 },
      },
      vertexShader: orthoVertexShader,
      fragmentShader: finalFragmentShader,
      glslVersion: THREE.GLSL3,
    });
    this.finalPass = new ShaderPass(this.finalShader);

    this.rgbShader = new THREE.RawShaderMaterial({
      uniforms: {
        inputTexture: { value: this.finalPass.texture },
        fisheyeStrength: { value: this.settings.fisheyeStrength },
        fisheyeRadius: { value: this.settings.fisheyeRadius },
        chromaticAberrationAmount: { value: this.settings.chromaticAberration },
        minInputLevel: { value: this.settings.minInputLevel },
        maxInputLevel: { value: this.settings.maxInputLevel },
        gammaLevel: { value: this.settings.gamma },
        exposure: { value: this.settings.exposure },
        time: { value: 0 },
      },
      vertexShader: orthoVertexShader,
      fragmentShader: colorFragmentShader,
      glslVersion: THREE.GLSL3,
    });
    this.rgbPass = new ShaderPass(this.rgbShader);

    this.copyShader = new THREE.RawShaderMaterial({
      uniforms: { inputTexture: { value: null } },
      vertexShader: orthoVertexShader,
      fragmentShader: copyFragmentShader,
      glslVersion: THREE.GLSL3,
    });
    this.copyPass = new ShaderPass(this.copyShader);
  }

  updateSettings() {
    this.bloomPass.enabled = this.settings.bloomEnabled;
    this.bloomPass.strength = this.settings.bloomStrength;
    this.bloomPass.radius = this.settings.bloomRadius;
    this.bloomPass.threshold = this.settings.bloomThreshold;

    this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
    this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
    this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
    this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
    this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;

    this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
    this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
    this.rgbShader.uniforms.exposure.value = this.settings.exposure;
  }

  setSize(w0, h0, dpr = 1) {
    const w = Math.max(1, Math.floor(w0 * dpr));
    const h = Math.max(1, Math.floor(h0 * dpr));
    this.sceneTarget.setSize(w, h);
    this.finalPass.setSize(w, h);
    this.finalShader.uniforms.resolution.value.set(w, h);
    this.bloomPass.setSize(w, h);
    this.rgbPass.setSize(w, h);
    this.copyPass.setSize(w, h);
  }

  renderScene(scene, camera) {
    if (!this.settings.enabled) {
      this.renderer.render(scene, camera);
      return;
    }
    this.renderer.setRenderTarget(this.sceneTarget);
    this.renderer.render(scene, camera);
    this.renderer.setRenderTarget(null);
    this.render(this.sceneTarget.texture);
  }

  render(sourceTexture) {
    if (!this.settings.enabled) {
      this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
      this.copyPass.render(this.renderer, true);
      return;
    }

    this.updateSettings();

    this.bloomPass.source = sourceTexture;
    this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
    this.bloomPass.render(this.renderer);

    this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
    this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
    this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
    this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
    this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

    const randomTime = Math.random() * 10000;
    this.finalPass.shader.uniforms.time.value = randomTime;
    this.rgbPass.shader.uniforms.time.value = randomTime;

    this.finalPass.render(this.renderer);
    this.rgbPass.render(this.renderer, true);
  }

  attachGUI(gui, title = "Post-Processing Suite") {
    const root = gui.addFolder(title);
    root.add(this.settings, "enabled").name("Enable Post-Process");

    const bloom = root.addFolder("Bloom Glow");
    bloom.add(this.settings, "bloomEnabled").name("Bloom Enabled").onChange(() => this.updateSettings());
    bloom.add(this.settings, "bloomStrength", 0, 4.0, 0.05).name("Bloom Strength").onChange(() => this.updateSettings());
    bloom.add(this.settings, "bloomRadius", 0, 2.0, 0.05).name("Bloom Radius").onChange(() => this.updateSettings());
    bloom.add(this.settings, "bloomThreshold", 0, 1.0, 0.01).name("Bloom Threshold").onChange(() => this.updateSettings());

    const optics = root.addFolder("Optics & Film Tone");
    optics.add(this.settings, "chromaticAberration", 0, 0.1, 0.002).name("Chromatic Aberr").onChange(() => this.updateSettings());
    optics.add(this.settings, "vignetteBoost", 0.5, 2.0, 0.05).name("Vignette Boost").onChange(() => this.updateSettings());
    optics.add(this.settings, "vignetteReduction", 0, 1.5, 0.05).name("Vignette Edge").onChange(() => this.updateSettings());
    optics.add(this.settings, "noiseIntensity", 0, 0.05, 0.002).name("Film Grain").onChange(() => this.updateSettings());
    optics.add(this.settings, "exposure", 0.5, 2.5, 0.05).name("Exposure").onChange(() => this.updateSettings());

    return root;
  }
}

function generateStudioEnvMap() {
  const pmremGenerator = new THREE.PMREMGenerator(renderer);
  pmremGenerator.compileEquirectangularShader();

  const c = document.createElement('canvas');
  c.width = 1024;
  c.height = 512;
  const ctx = c.getContext('2d');

  const bgGrad = ctx.createLinearGradient(0, 0, 0, 512);
  bgGrad.addColorStop(0, '#0a101d');
  bgGrad.addColorStop(0.5, '#1e293b');
  bgGrad.addColorStop(1, '#060810');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, 1024, 512);

  function drawSoftbox(x, y, w, h, col, blur) {
    ctx.save();
    ctx.filter = `blur(${blur}px)`;
    ctx.fillStyle = col;
    ctx.fillRect(x - w / 2, y - h / 2, w, h);
    ctx.restore();
  }

  drawSoftbox(256, 110, 340, 120, 'rgba(255, 255, 255, 0.98)', 20);
  drawSoftbox(768, 130, 300, 110, 'rgba(255, 235, 200, 0.95)', 25);
  drawSoftbox(512, 380, 450, 90, 'rgba(140, 200, 255, 0.65)', 30);
  drawSoftbox(100, 250, 100, 240, 'rgba(255, 255, 255, 0.8)', 15);
  drawSoftbox(920, 250, 100, 240, 'rgba(255, 245, 220, 0.8)', 15);

  const envTex = new THREE.CanvasTexture(c);
  envTex.mapping = THREE.EquirectangularReflectionMapping;
  const envMap = pmremGenerator.fromEquirectangular(envTex).texture;
  pmremGenerator.dispose();
  envTex.dispose();
  return envMap;
}

// 2. Card Emissive / Microcircuit Glow Texture
function createCardEmissiveTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 2048;
  canvas.height = 1292;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, 2048, 1292);

  // Bright Glowing Card Border
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 14;
  ctx.strokeRect(36, 36, 2048 - 72, 1292 - 72);

  // Glowing microcircuit traces spreading from chip
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 6;
  ctx.shadowColor = '#ffffff';
  ctx.shadowBlur = 18;

  const startX = 580, startY = 580;
  const traces = [
    [[startX, startY], [760, 580], [900, 440], [1340, 440], [1540, 240], [1820, 240]],
    [[startX, startY + 45], [740, 625], [860, 750], [1240, 750], [1480, 950]],
    [[startX - 120, 460], [420, 340], [420, 200], [780, 200]],
    [[startX - 160, 700], [380, 840], [620, 840], [740, 970]],
    [[startX, startY - 60], [700, 520], [960, 520], [1100, 360]],
    [[1240, 750], [1390, 750], [1490, 650], [1800, 650]]
  ];

  traces.forEach(path => {
    ctx.beginPath();
    ctx.moveTo(path[0][0], path[0][1]);
    for (let i = 1; i < path.length; i++) {
      ctx.lineTo(path[i][0], path[i][1]);
    }
    ctx.stroke();

    const last = path[path.length - 1];
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(last[0], last[1], 12, 0, Math.PI * 2);
    ctx.fill();
  });

  // Glowing NFC arcs
  ctx.lineWidth = 8;
  const nfcX = 660, nfcY = 580;
  for (let i = 1; i <= 3; i++) {
    ctx.beginPath();
    ctx.arc(nfcX, nfcY, i * 32, -Math.PI * 0.35, Math.PI * 0.35);
    ctx.stroke();
  }

  // Glowing microchip frame
  ctx.strokeRect(260, 460, 320, 240);

  const tex = new THREE.CanvasTexture(canvas);
  tex.anisotropy = 16;
  return tex;
}

// 3. Bitcoin Gold Coin Texture
function createBitcoinTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 1024;
  canvas.height = 1024;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#443311';
  ctx.fillRect(0, 0, 1024, 1024);

  const cx = 512, cy = 512;

  ctx.strokeStyle = '#ffe899';
  ctx.lineWidth = 14;
  ctx.beginPath();
  ctx.arc(cx, cy, 475, 0, Math.PI * 2);
  ctx.stroke();

  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.arc(cx, cy, 445, 0, Math.PI * 2);
  ctx.stroke();

  ctx.lineWidth = 8;
  ctx.beginPath();
  ctx.arc(cx, cy, 370, 0, Math.PI * 2);
  ctx.stroke();

  for (let a = 0; a < Math.PI * 2; a += Math.PI / 36) {
    const bx = cx + Math.cos(a) * 460;
    const by = cy + Math.sin(a) * 460;
    ctx.fillStyle = '#fff0aa';
    ctx.beginPath();
    ctx.arc(bx, by, 6, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.strokeStyle = 'rgba(255, 235, 170, 0.35)';
  ctx.lineWidth = 2;
  for (let a = 0; a < Math.PI * 2; a += Math.PI / 48) {
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * 380, cy + Math.sin(a) * 380);
    ctx.lineTo(cx + Math.cos(a) * 435, cy + Math.sin(a) * 435);
    ctx.stroke();
  }

  ctx.fillStyle = '#fffae0';
  ctx.font = 'bold 30px "Segoe UI", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const text = "BITCOIN · DIGITAL ASSET · 1 TROY OZ FINE GOLD · ";
  const charStep = (Math.PI * 2) / text.length;
  for (let i = 0; i < text.length; i++) {
    const angle = i * charStep - Math.PI / 2;
    ctx.save();
    ctx.translate(cx + Math.cos(angle) * 405, cy + Math.sin(angle) * 405);
    ctx.rotate(angle + Math.PI / 2);
    ctx.fillText(text[i], 0, 0);
    ctx.restore();
  }

  ctx.strokeStyle = 'rgba(255, 230, 150, 0.55)';
  ctx.lineWidth = 4;
  for (let i = -240; i <= 240; i += 60) {
    ctx.beginPath();
    ctx.moveTo(cx + i, cy - 250);
    ctx.lineTo(cx + i, cy + 250);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx - 250, cy + i);
    ctx.lineTo(cx + 250, cy + i);
    ctx.stroke();
  }

  ctx.fillStyle = '#ffffff';
  ctx.shadowColor = '#000000';
  ctx.shadowBlur = 18;
  ctx.shadowOffsetX = 8;
  ctx.shadowOffsetY = 8;
  ctx.font = 'bold 440px "Segoe UI", sans-serif';

  rad.addColorStop(0, '#ffffff');
  rad.addColorStop(0.35, 'rgba(255, 235, 170, 0.9)');
  rad.addColorStop(0.7, 'rgba(255, 190, 80, 0.35)');
  rad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = rad;
  ctx.fillRect(0, 0, 512, 512);

  return new THREE.CanvasTexture(canvas);
}

// Currency Symbol Texture
function createSymbolTexture(symbol) {
  const canvas = document.createElement('canvas');
  canvas.width = 256;
  canvas.height = 256;
  const ctx = canvas.getContext('2d');

  const g = ctx.createRadialGradient(128, 128, 20, 128, 128, 120);
  g.addColorStop(0, 'rgba(255, 255, 255, 0.45)');
  g.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 256, 256);

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 120px "Segoe UI", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(symbol, 128, 128);

  return new THREE.CanvasTexture(canvas);
}

const cardTexture = createCardTexture();
const cardEmissiveTexture = createCardEmissiveTexture();
const bitcoinTexture = createBitcoinTexture();
const particleStarTexture = createFinancialParticleTexture();

// --- GEOMETRIES & MATERIALS ---

// 1. Credit Card Rounded Geometry
function createRoundedCardGeometry(w, h, r, depth) {
  const shape = new THREE.Shape();
  const x = -w / 2, y = -h / 2;
  shape.moveTo(x + r, y);
  shape.lineTo(x + w - r, y);
  shape.quadraticCurveTo(x + w, y, x + w, y + r);
  shape.lineTo(x + w, y + h - r);
  shape.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  shape.lineTo(x + r, y + h);
  shape.quadraticCurveTo(x, y + h, x, y + h - r);
  shape.lineTo(x, y + r);
  shape.quadraticCurveTo(x, y, x + r, y);

  const extrudeSettings = {
    steps: 1,
    depth: depth,
    bevelEnabled: true,
    bevelThickness: 0.03,
    bevelSize: 0.03,
    bevelOffset: 0,
    bevelSegments: 5
  };
  return new THREE.ExtrudeGeometry(shape, extrudeSettings);
}

const cardGeometry = createRoundedCardGeometry(4.2, 2.65, 0.25, 0.06);
cardGeometry.center();

const chipLights = [];

// 2. Gold Bitcoins / Coins (18 coins with detailed 3D bevel rims)
const coinGroup = new THREE.Group();
scene.add(coinGroup);

const coinBaseGeo = new THREE.CylinderGeometry(0.65, 0.65, 0.1, 64);
const coinRimGeo = new THREE.TorusGeometry(0.63, 0.04, 16, 64);

const coinMaterial = new THREE.MeshStandardMaterial({

});

const coinRimMaterial = new THREE.MeshStandardMaterial({

});

const COIN_COUNT = 18;
const coins = [];

for (let i = 0; i < COIN_COUNT; i++) {
  const coinPivot = new THREE.Group();
  
  const coinMesh = new THREE.Mesh(coinBaseGeo, coinMaterial);
  coinMesh.rotation.x = Math.PI / 2;
  coinMesh.castShadow = true;
  coinMesh.receiveShadow = true;
  coinPivot.add(coinMesh);

  const rimFront = new THREE.Mesh(coinRimGeo, coinRimMaterial);
  rimFront.position.z = 0.05;
  coinPivot.add(rimFront);

  const rimBack = new THREE.Mesh(coinRimGeo, coinRimMaterial);
  rimBack.position.z = -0.05;
  coinPivot.add(rimBack);

  const ring = i % 3;
  let radius = 3.4 + ring * 1.8 + Math.random() * 0.7;
  const angle = (i / COIN_COUNT) * Math.PI * 2 + (Math.random() - 0.5) * 0.3;
  const height = (Math.random() - 0.5) * 3.4;
  const orbitSpeed = (0.22 + Math.random() * 0.32) * (i % 2 === 0 ? 1 : -1);
  const spinSpeed = (1.2 + Math.random() * 2.0);
  const tiltX = (Math.random() - 0.5) * 0.8;
  const tiltZ = (Math.random() - 0.5) * 0.8;

  coins.push({
    group: coinPivot,
    radius,
    angle,
    height,
    baseHeight: height,
    orbitSpeed,
    spinSpeed,
    tiltX,
    tiltZ,
    wobbleSpeed: 0.8 + Math.random() * 1.2
  });

  coinGroup.add(coinPivot);
}

// 3. Abstract Financial Particles (Stardust + currency glyphs)
const particleGroup = new THREE.Group();
scene.add(particleGroup);

const STAR_COUNT = 550;
const starGeometry = new THREE.BufferGeometry();
const starPositions = new Float32Array(STAR_COUNT * 3);
const starSpeeds = new Float32Array(STAR_COUNT);

for (let i = 0; i < STAR_COUNT; i++) {
  const r = 2.0 + Math.random() * 11.0;
  const th = Math.random() * Math.PI * 2;
  starPositions[i * 3 + 0] = Math.cos(th) * r;
  starPositions[i * 3 + 1] = (Math.random() - 0.5) * 12.0;
  starPositions[i * 3 + 2] = Math.sin(th) * r;
  starSpeeds[i] = 0.3 + Math.random() * 0.7;
}

starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));

const starMaterial = new THREE.PointsMaterial({
  color: new THREE.Color(params.accentColor),
  size: 0.28,
  map: particleStarTexture,
  transparent: true,
  opacity: 0.8,
  blending: THREE.AdditiveBlending,

});

const starPoints = new THREE.Points(starGeometry, starMaterial);
particleGroup.add(starPoints);

const symbols = ['₿', '$', '€', '¥', '£', '⟠', '▲', '%'];
const symbolTextures = symbols.map(s => createSymbolTexture(s));
const SYMBOL_COUNT = 32;
const symbolSprites = [];

for (let i = 0; i < SYMBOL_COUNT; i++) {
  const tex = symbolTextures[i % symbolTextures.length];
  const mat = new THREE.SpriteMaterial({
    map: tex,
    color: new THREE.Color(params.accentColor),

    depthWrite: false
  });

  const r = 3.5 + Math.random() * 8.5;
  const th = Math.random() * Math.PI * 2;
  const y = (Math.random() - 0.5) * 8.0;
  sprite.position.set(Math.cos(th) * r, y, Math.sin(th) * r);
  const sc = 0.42 + Math.random() * 0.42;
  sprite.scale.set(sc, sc, 1);

  particleGroup.add(sprite);
  symbolSprites.push({
    sprite,
    radius: r,
    angle: th,
    y: y,
    speedY: 0.2 + Math.random() * 0.35,
    rotSpeed: (Math.random() - 0.5) * 0.3
  });
}

// 4. Subtle Floor Holographic Radial Grid
const gridHelper = new THREE.PolarGridHelper(16, 24, 8, 64, new THREE.Color(params.accentColor), new THREE.Color(params.accentColor));
gridHelper.position.y = -4.5;
gridHelper.material.opacity = 0.18;
gridHelper.material.transparent = true;
gridHelper.material.blending = THREE.AdditiveBlending;
gridHelper.material.depthWrite = false;
scene.add(gridHelper);

// --- UPDATE THEME & COLORS ---
function applyColorScheme(schemeName) {
  const sc = COLOR_SCHEMES[schemeName] || COLOR_SCHEMES["Neutral + accent"];
  params.scheme = schemeName;
  params.glassColor = sc.glass;
  params.chipGlowColor = sc.chip;
  params.coinColor = sc.coin;
  params.accentColor = sc.accent;
  params.bgColor = sc.background;

  updateVisuals();
}

function updateVisuals() {
  if (params.greenscreen) {
    scene.background = new THREE.Color(0x00ff00);
    scene.fog = null;
    gridHelper.visible = false;
  } else {
    const bgCol = new THREE.Color(params.bgColor);
    scene.background = bgCol;
    scene.fog = new THREE.FogExp2(bgCol, 0.035);
    gridHelper.visible = true;
    gridHelper.material.color.set(params.accentColor);
  }

  // Glass Material updates
  glassMaterial.color.set(params.glassColor);
  glassMaterial.emissive.set(params.chipGlowColor);
  glassMaterial.transmission = params.transmission;
  glassMaterial.roughness = params.roughness;
  glassMaterial.metalness = params.metalness;
  glassMaterial.ior = params.ior;
  glassMaterial.thickness = params.thickness;
  glassMaterial.needsUpdate = true;

  // Luminous Card Edge Rim outline
  cardEdgeMat.color.set(params.accentColor);

  // Chip point lights
  chipLights.forEach(light => {
    light.color.set(params.chipGlowColor);
  });

  // Coin Materials
  coinMaterial.color.set(params.coinColor);
  coinRimMaterial.color.set(params.coinColor);
  coinMaterial.needsUpdate = true;
  coinRimMaterial.needsUpdate = true;

  // Particles
  starMaterial.color.set(params.accentColor);
  symbolSprites.forEach(item => {
    item.sprite.material.color.set(params.accentColor);
  });

  // Dynamic Scene Lighting
  cardFrontLight.color.set(0xffffff);
  mainKeyLight.color.set(params.chipGlowColor);
  rimLight1.color.set(params.accentColor);
  rimLight2.color.set(params.coinColor);
}

// Initial setup
applyColorScheme(params.scheme);

// --- PROCEDURAL SCENE RANDOMIZER (UPON CLICK) ---
// User requirement: "when I click for random scene do not shuffle or change Postprocessing settings"
function randomizeScene() {
  // 1. Pick a random color scheme from the 18 schemes
  const schemeKeys = Object.keys(COLOR_SCHEMES);
  const randomSchemeKey = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
  applyColorScheme(randomSchemeKey);

  // 2. Re-roll geometric card variations
  cardsData.forEach((data) => {
    data.rot[0] = (Math.random() - 0.5) * 0.7;
    data.rot[1] = (Math.random() - 0.5) * 1.0;
    data.rot[2] = (Math.random() - 0.5) * 0.5;
    data.floatSpeed = 0.7 + Math.random() * 0.8;
    data.phase = Math.random() * Math.PI * 2;
  });

  // 3. Re-roll motion parameters for coins
  coins.forEach(c => {
    c.radius = 3.0 + Math.random() * 4.2;
    c.orbitSpeed = (0.2 + Math.random() * 0.5) * (Math.random() > 0.5 ? 1 : -1);
    c.spinSpeed = 1.0 + Math.random() * 2.2;
    c.height = (Math.random() - 0.5) * 3.8;
    c.baseHeight = c.height;
  });

  // 4. Re-roll glass parameters slightly (keeping clarity high)
  params.roughness = 0.08 + Math.random() * 0.12;
  params.transmission = 0.78 + Math.random() * 0.10;
  params.thickness = 0.8 + Math.random() * 0.8;

  // 5. Update GUI controllers for scene (POST-PROCESSING SETTINGS REMAIN INTACT!)
  sceneFolderControllers.forEach(c => c.updateDisplay());
}

// Pointer event handling: distinguish click from drag/orbit
let pointerDownPos = { x: 0, y: 0 };
let pointerDownTime = 0;

window.addEventListener('pointerdown', (e) => {
  if (e.target.closest('.lil-gui')) return;
  pointerDownPos = { x: e.clientX, y: e.clientY };
  pointerDownTime = performance.now();
});

window.addEventListener('pointerup', (e) => {
  if (e.target.closest('.lil-gui')) return;
  const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
  const elapsed = performance.now() - pointerDownTime;

  if (dist < 6 && elapsed < 350) {
    if (params.randomOnClick) {
      randomizeScene();
    }
  }
});

// "H" KEY TO TOGGLE UI
window.addEventListener('keydown', (e) => {
  if (e.key === 'h' || e.key === 'H') {
    if (gui._hidden) {
      gui.show();
    } else {
      gui.hide();
    }
  }
});

// --- LIL-GUI SETUP ---
const gui = new GUI({ title: 'Holo-Vault Settings' });
const sceneFolderControllers = [];

// Preset Schemes Folder
const folderColor = gui.addFolder('Color Themes & Greenscreen');
sceneFolderControllers.push(
  folderColor.add(params, 'scheme', Object.keys(COLOR_SCHEMES)).name('18 Color Schemes').onChange((val) => {
    applyColorScheme(val);
    sceneFolderControllers.forEach(c => c.updateDisplay());
  }),
  folderColor.add(params, 'greenscreen').name('Greenscreen (#00ff00)').onChange(() => updateVisuals()),
  folderColor.addColor(params, 'glassColor').name('Glass Tint').onChange(() => updateVisuals()),
  folderColor.addColor(params, 'chipGlowColor').name('Chip Glow').onChange(() => updateVisuals()),
  folderColor.addColor(params, 'coinColor').name('Coin Metal').onChange(() => updateVisuals()),
  folderColor.addColor(params, 'accentColor').name('Accent & Particles').onChange(() => updateVisuals()),

);

// Animation Folder
const folderAnim = gui.addFolder('Animation');
sceneFolderControllers.push(

// Rendering Folder
const folderRender = gui.addFolder('Rendering & Materials');
sceneFolderControllers.push(
  folderRender.add(params, 'dpr', 0.5, 3.0, 0.25).name('Pixel Ratio (DPR)').onChange((val) => {
    renderer.setPixelRatio(val);
    postProcessor.setSize(window.innerWidth, window.innerHeight, val);
  }),

);

// Interaction Folder
const folderInteract = gui.addFolder('Procedural Interaction');
sceneFolderControllers.push(
  folderInteract.add(params, 'randomOnClick').name('Click Scene to Randomize'),
  folderInteract.add({ randomize: () => randomizeScene() }, 'randomize').name('🎲 Randomize Now')
);

// Attach PostProcessor GUI (User requirement: PostProcessor settings separate from randomizer!)
postProcessor.attachGUI(gui, 'Post-Processing Suite');

// --- ANIMATION ENGINE ---
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const delta = clock.getDelta();
  const time = clock.getElapsedTime() * params.speed;

  // --- 8 PRECONFIGURED CAMERA & SCENE ANIMATIONS ---
  switch (params.animation) {
    case "Static (No Camera Move)":
      controls.autoRotate = false;
      break;

    case "Slow Cinematic Orbit":
      controls.autoRotate = false;
      camera.position.x = Math.sin(time * 0.22) * 9.5;
      camera.position.z = Math.cos(time * 0.22) * 9.5;
      camera.position.y = 1.8 + Math.sin(time * 0.15) * 0.8;
      controls.target.set(0, 0, 0);
      break;

    case "Floating Cascade":
      controls.autoRotate = false;
      camera.position.x = Math.sin(time * 0.35) * 4.2;
      camera.position.y = 1.5 + Math.sin(time * 0.45) * 1.5;
      camera.position.z = 9.2 + Math.cos(time * 0.25) * 1.8;
      controls.target.set(0, Math.sin(time * 0.3) * 0.4, 0);
      break;

    case "Financial Spiral":
      controls.autoRotate = false;
      const spiralR = 8.5 + Math.sin(time * 0.3) * 2.0;
      camera.position.x = Math.sin(time * 0.28) * spiralR;
      camera.position.z = Math.cos(time * 0.28) * spiralR;
      camera.position.y = 2.4 + Math.sin(time * 0.4) * 2.2;
      controls.target.set(0, Math.sin(time * 0.2) * 0.5, 0);
      break;

    case "Macro Focus Sweep":
      controls.autoRotate = false;
      camera.position.x = Math.sin(time * 0.3) * 4.8;
      camera.position.y = 0.6 + Math.cos(time * 0.25) * 0.8;
      camera.position.z = 4.8 + Math.sin(time * 0.2) * 1.2;
      controls.target.set(Math.sin(time * 0.3) * 1.0, 0, 0);
      break;

    case "Zero-G Weightless Drift":
      controls.autoRotate = false;
      camera.position.x = Math.sin(time * 0.18) * 8.8;
      camera.position.y = Math.cos(time * 0.22) * 4.5;
      camera.position.z = 8.0 + Math.sin(time * 0.15) * 3.0;
      controls.target.set(0, 0, 0);
      break;

    case "Pendulum Symphony":
      controls.autoRotate = false;
      const pend = Math.sin(time * 0.4);
      camera.position.x = pend * 7.5;
      camera.position.y = 1.2 + Math.abs(Math.cos(time * 0.4)) * 1.8;
      camera.position.z = 8.5 + Math.cos(time * 0.2) * 1.5;
      controls.target.set(0, 0, 0);
      break;

    case "Vortex Elevation":
      controls.autoRotate = false;
      camera.position.x = Math.sin(time * 0.25) * (8.5 - Math.sin(time * 0.2) * 2.0);
      camera.position.z = Math.cos(time * 0.25) * (8.5 - Math.sin(time * 0.2) * 2.0);
      camera.position.y = Math.sin(time * 0.2) * 4.0;
      controls.target.set(0, 0, 0);
      break;
  }

  controls.update();

  // --- ANIMATE GLASS CREDIT CARDS ---
  cardMeshes.forEach((card, i) => {
    const d = cardsData[i];
    card.position.y = d.pos[1] + Math.sin(time * d.floatSpeed + d.phase) * 0.18;
    card.rotation.x = d.rot[0] + Math.sin(time * 0.8 + d.phase) * 0.08;
    card.rotation.y = d.rot[1] + Math.cos(time * 0.6 + d.phase) * 0.12;
    card.rotation.z = d.rot[2] + Math.sin(time * 0.5 + d.phase) * 0.05;

    chipLights[i].intensity = 2.2 + Math.sin(time * 3.2 + d.phase) * 0.9;
  });

  glassMaterial.emissiveIntensity = 0.75 + Math.sin(time * 2.2) * 0.35;

  // --- ANIMATE ROTATING GOLD COINS ---
  coins.forEach((c, idx) => {
    c.angle += c.orbitSpeed * delta * params.speed;
    c.group.position.x = Math.cos(c.angle) * c.radius;
    c.group.position.z = Math.sin(c.angle) * c.radius;
    c.group.position.y = c.baseHeight + Math.sin(time * c.wobbleSpeed + idx) * 0.35;

    c.group.rotation.y += c.spinSpeed * delta * params.speed;
    c.group.rotation.x = c.tiltX + Math.sin(time * 1.5 + idx) * 0.2;
    c.group.rotation.z = c.tiltZ + Math.cos(time * 1.2 + idx) * 0.2;
  });

  // --- ANIMATE ABSTRACT FINANCIAL PARTICLES ---
  const posAttr = starGeometry.attributes.position;
  for (let i = 0; i < STAR_COUNT; i++) {
    let y = posAttr.getY(i) + starSpeeds[i] * delta * params.speed * 0.8;
    if (y > 6.0) y = -6.0;
    posAttr.setY(i, y);
  }
  posAttr.needsUpdate = true;
  starPoints.rotation.y += 0.0015 * params.speed;

  symbolSprites.forEach(item => {
    item.y += item.speedY * delta * params.speed;
    if (item.y > 6.5) item.y = -6.5;
    item.angle += item.rotSpeed * delta * params.speed * 0.2;
    item.sprite.position.x = Math.cos(item.angle) * item.radius;
    item.sprite.position.z = Math.sin(item.angle) * item.radius;
    item.sprite.position.y = item.y;
  });

  gridHelper.rotation.y += 0.001 * params.speed;

  // Render through PostProcessor pipeline
  postProcessor.renderScene(scene, camera);
}

// Window resize
window.addEventListener('resize', () => {
  const w = window.innerWidth;
  const h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  postProcessor.setSize(w, h, params.dpr);
});

// Start infinite loop
animate();
