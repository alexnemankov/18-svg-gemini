    // --- COMPOSITIONS CONFIGURATION ---
    // Expanded diagonal spans across the entire 16:9 viewport

        end: new THREE.Vector3(25, 16, -2),
        contactNormalStart: new THREE.Vector3(1, 1, 0).normalize(),
        contactNormalEnd: new THREE.Vector3(-1, -1, 0).normalize()
      },
      'Corner Strike': {
        start: new THREE.Vector3(-22, -18, 1),
        end: new THREE.Vector3(22, 18, -1),
        contactNormalStart: new THREE.Vector3(0.7, 0.7, 0).normalize(),
        contactNormalEnd: new THREE.Vector3(-0.7, -0.7, 0).normalize()
      },
      'High Voltage Arc': {
        start: new THREE.Vector3(-26, 0, 0),
        end: new THREE.Vector3(26, 0, 0),
        midOffset: new THREE.Vector3(0, 10, 0),
        contactNormalStart: new THREE.Vector3(1, 0, 0),
        contactNormalEnd: new THREE.Vector3(-1, 0, 0)

        end: new THREE.Vector3(0, -14, 0),
        contactNormalStart: new THREE.Vector3(0, -1, 0),
        contactNormalEnd: new THREE.Vector3(0, 1, 0)

    // --- SYSTEM GLOBALS ---
    let scene, camera, renderer, composer, controls, bloomPass;
    let container = document.getElementById('canvas-container');
    let allLineMaterials = [];
    let gui;

    // Lights
    let ambientLight, corePointLight, flashPointLight, startPointLight, endPointLight;

    // Meshes for Lightning
    let trunkCoreMesh, trunkGlowMesh, trunkRimMesh;
    let branchCoreMesh, branchGlowMesh, branchRimMesh;
    let microCoreMesh, microGlowMesh;

    // Terminal Corona Glowing Nodes

    // Contact Ripples
    let startRippleMesh, endRippleMesh, startRippleMat, endRippleMat;

    // Ambient Floating Dust

    // Active segments storage for live micro-jitter crackle
    let currentRawTrunk = [];

    // Camera animation state
    const baseTarget = new THREE.Vector3(0, 0, 0);

    let elapsedTime = 0;
    let nextStrikeTimer = 0;

    // Strike brightness state for GSAP

      intensity: 1.0,
      decayAlpha: 1.0,
      aliveAlpha: 0.65 // Baseline energy when idle

    // Pointer tracker for distinguishing click vs drag
    let pointerDownPos = { x: 0, y: 0 };
    let pointerDownTime = 0;

    // --- INITIALIZATION ---
    function init() {
      // Scene
      scene = new THREE.Scene();
      scene.background = new THREE.Color(params.greenScreen ? 0x00ff00 : params.backgroundColor);

      // Camera
      camera = new THREE.PerspectiveCamera(baseFov, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 2, 42);

      // Renderer
      renderer = new THREE.WebGLRenderer({
        antialias: params.antialias,
        powerPreference: 'high-performance',
        alpha: false
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(params.dpr);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = params.exposure;
      container.appendChild(renderer.domElement);

      // Controls
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.target.copy(baseTarget);
      controls.minDistance = 6;
      controls.maxDistance = 150;

      controls.addEventListener('start', () => { isUserInteracting = true; });
      controls.addEventListener('end', () => {
        isUserInteracting = false;
        baseTarget.copy(controls.target);
      });

      // Post-processing Composer & Bloom Pass
      initComposer();

      // Lights
      initLights();

      // Scene Components
      initDust();
      initLightningMeshes();
      initTerminalCoronas();
      initContactRipples();
      initSparks();

      // Setup GUI
      buildGUI();

      // Event Listeners
      window.addEventListener('resize', onWindowResize);
      window.addEventListener('keydown', onKeyDown);

      // Pointer detection for randomize click
      renderer.domElement.addEventListener('pointerdown', (e) => {
        pointerDownPos = { x: e.clientX, y: e.clientY };
        pointerDownTime = performance.now();
      });

      renderer.domElement.addEventListener('pointerup', (e) => {
        const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
        const duration = performance.now() - pointerDownTime;
        if (dist < 8 && duration < 450 && params.randomizeOnClick) {
          randomizeScene();
        }
      });

      // Fire initial discharge strike
      triggerStrike(true);

      // Start animation loop
      requestAnimationFrame(animate);
    }

    // --- COMPOSER & BLOOM SETUP ---
    function initComposer() {
      const renderPass = new RenderPass(scene, camera);

      bloomPass = new UnrealBloomPass(
        new THREE.Vector2(window.innerWidth, window.innerHeight),
        params.bloomStrength,
        params.bloomRadius,
        params.bloomThreshold
      );

      const outputPass = new OutputPass();

      composer = new EffectComposer(renderer);
      composer.setPixelRatio(params.dpr);
      composer.setSize(window.innerWidth, window.innerHeight);
      composer.addPass(renderPass);
      composer.addPass(bloomPass);
      composer.addPass(outputPass);
    }

    // --- LIGHTS SETUP ---
    function initLights() {
      ambientLight = new THREE.AmbientLight(params.ambientColor, params.ambientIntensity);
      scene.add(ambientLight);

      corePointLight = new THREE.PointLight(params.glowColor, params.coreLightIntensity, 70, 1.2);
      corePointLight.position.set(0, 0, 0);
      scene.add(corePointLight);

      flashPointLight = new THREE.PointLight(params.flashColor, 0, 200, 0.9);
      flashPointLight.position.set(0, 1, 10);
      scene.add(flashPointLight);

      startPointLight = new THREE.PointLight(params.sparkColor, 0, 40, 1.3);
      scene.add(startPointLight);

      endPointLight = new THREE.PointLight(params.sparkColor, 0, 40, 1.3);
      scene.add(endPointLight);
    }

    // --- 100% PERFECTLY ROUND AMBIENT DUST PARTICLES ---
    function initDust() {
      const dustCount = 380;
      const dustGeo = new THREE.BufferGeometry();
      const posArray = new Float32Array(dustCount * 3);
      const sizeArray = new Float32Array(dustCount);
      const phaseArray = new Float32Array(dustCount);

      for (let i = 0; i < dustCount; i++) {
        posArray[i * 3 + 0] = (Math.random() - 0.5) * 80;
        posArray[i * 3 + 1] = (Math.random() - 0.5) * 60;
        posArray[i * 3 + 2] = (Math.random() - 0.5) * 50;

        sizeArray[i] = Math.random() * 2.2 + 1.2;
        phaseArray[i] = Math.random() * Math.PI * 2;
      }

      dustGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
      dustGeo.setAttribute('aSize', new THREE.BufferAttribute(sizeArray, 1));
      dustGeo.setAttribute('aPhase', new THREE.BufferAttribute(phaseArray, 1));

      // Shader guaranteeing strictly round circles with smooth glowing falloff
      const dustVertexShader = `
        attribute float aSize;
        attribute float aPhase;
        uniform float uTime;
        varying float vAlpha;
        varying vec3 vColor;
        uniform vec3 uColor;

        void main() {
          vColor = uColor;
          vAlpha = (sin(uTime * 1.5 + aPhase) * 0.3 + 0.5) * 0.35;
          vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
          gl_PointSize = aSize * (350.0 / -mvPosition.z);
          gl_Position = projectionMatrix * mvPosition;
        }
      `;

      const dustFragmentShader = `
        varying float vAlpha;
        varying vec3 vColor;

        void main() {
          vec2 coord = gl_PointCoord - vec2(0.5);
          float dist = length(coord);
          if (dist > 0.5) discard; // Strictly discard outside unit circle

          // Smooth round anti-aliased edge
          float edge = smoothstep(0.5, 0.05, dist);
          float core = smoothstep(0.15, 0.0, dist);
          vec3 col = mix(vColor, vec3(1.0), core * 0.6);
          gl_FragColor = vec4(col, edge * vAlpha);
        }
      `;

      dustMaterial = new THREE.ShaderMaterial({
        vertexShader: dustVertexShader,
        fragmentShader: dustFragmentShader,
        uniforms: {
          uTime: { value: 0.0 },
          uColor: { value: new THREE.Color(params.sparkColor) }
        },
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      dustParticles = new THREE.Points(dustGeo, dustMaterial);
      scene.add(dustParticles);
    }

    // --- LIGHTNING MESHES SETUP (WHITE CORE + INTENSE GLOW + OUTER RIM) ---
    function initLightningMeshes() {
      lightningGroup = new THREE.Group();
      scene.add(lightningGroup);

      const res = new THREE.Vector2(window.innerWidth, window.innerHeight);

      // Trunk Materials
      const trunkRimMat = new LineMaterial({
        color: new THREE.Color(params.rimColor),
        linewidth: params.rimWidth,
        transparent: true,
        opacity: 0.45,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        resolution: res
      });

      const trunkGlowMat = new LineMaterial({
        color: new THREE.Color(params.glowColor),
        linewidth: params.glowWidth,
        transparent: true,
        opacity: 0.9,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        resolution: res
      });

      const trunkCoreMat = new LineMaterial({
        color: new THREE.Color(params.coreColor),
        linewidth: params.coreWidth,
        transparent: true,
        opacity: 1.0,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        resolution: res
      });

      // Branch Materials
      const branchRimMat = new LineMaterial({
        color: new THREE.Color(params.rimColor),
        linewidth: params.rimWidth * 0.65,
        transparent: true,
        opacity: 0.38,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        resolution: res
      });

      const branchGlowMat = new LineMaterial({
        color: new THREE.Color(params.glowColor),
        linewidth: params.glowWidth * 0.65,
        transparent: true,
        opacity: 0.85,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        resolution: res
      });

      const branchCoreMat = new LineMaterial({
        color: new THREE.Color(params.coreColor),
        linewidth: params.coreWidth * 0.7,
        transparent: true,
        opacity: 1.0,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        resolution: res
      });

      // Micro Filaments Materials
      const microGlowMat = new LineMaterial({
        color: new THREE.Color(params.glowColor),
        linewidth: params.glowWidth * 0.4,
        transparent: true,
        opacity: 0.6,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        resolution: res
      });

      const microCoreMat = new LineMaterial({
        color: new THREE.Color(params.coreColor),
        linewidth: params.coreWidth * 0.5,
        transparent: true,
        opacity: 0.9,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        resolution: res
      });

      allLineMaterials = [
        trunkRimMat, trunkGlowMat, trunkCoreMat,
        branchRimMat, branchGlowMat, branchCoreMat,
        microGlowMat, microCoreMat
      ];

      const dummyGeo = new LineSegmentsGeometry();
      dummyGeo.setPositions([0, 0, 0, 0.01, 0.01, 0.01]);

      trunkRimMesh = new LineSegments2(dummyGeo, trunkRimMat);
      trunkGlowMesh = new LineSegments2(dummyGeo, trunkGlowMat);
      trunkCoreMesh = new LineSegments2(dummyGeo, trunkCoreMat);

      branchRimMesh = new LineSegments2(dummyGeo, branchRimMat);
      branchGlowMesh = new LineSegments2(dummyGeo, branchGlowMat);
      branchCoreMesh = new LineSegments2(dummyGeo, branchCoreMat);

      microGlowMesh = new LineSegments2(dummyGeo, microGlowMat);
      microCoreMesh = new LineSegments2(dummyGeo, microCoreMat);

      lightningGroup.add(trunkRimMesh);
      lightningGroup.add(trunkGlowMesh);
      lightningGroup.add(trunkCoreMesh);

      lightningGroup.add(branchRimMesh);
      lightningGroup.add(branchGlowMesh);
      lightningGroup.add(branchCoreMesh);

      lightningGroup.add(microGlowMesh);
      lightningGroup.add(microCoreMesh);
    }

    // --- TERMINAL CORONA GLOW ORBS ---
    function initTerminalCoronas() {
      const coronaVertexShader = `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `;

      const coronaFragmentShader = `
        uniform vec3 uCoreColor;
        uniform vec3 uGlowColor;
        uniform float uIntensity;
        varying vec2 vUv;

        void main() {
          vec2 p = vUv - vec2(0.5);
          float d = length(p) * 2.0;
          if (d > 1.0) discard;

          float core = smoothstep(0.25, 0.0, d);
          float halo = smoothstep(1.0, 0.1, d);
          vec3 col = mix(uGlowColor, uCoreColor, core * 0.95);
          float alpha = (core * 0.9 + halo * 0.5) * uIntensity;

          gl_FragColor = vec4(col, alpha);
        }
      `;

      const mat1 = new THREE.ShaderMaterial({
        vertexShader: coronaVertexShader,
        fragmentShader: coronaFragmentShader,
        uniforms: {
          uCoreColor: { value: new THREE.Color(params.coreColor) },
          uGlowColor: { value: new THREE.Color(params.glowColor) },
          uIntensity: { value: 0.9 }
        },
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        side: THREE.DoubleSide
      });

      const mat2 = mat1.clone();
      const coronaGeo = new THREE.PlaneGeometry(3.5, 3.5);

      startCoronaMesh = new THREE.Mesh(coronaGeo, mat1);
      endCoronaMesh = new THREE.Mesh(coronaGeo, mat2);

      scene.add(startCoronaMesh);
      scene.add(endCoronaMesh);
    }

    // --- CONTACT SHOCKWAVE RIPPLES ---
    function initContactRipples() {
      const rippleVertexShader = `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `;

      const rippleFragmentShader = `
        uniform vec3 uColor;
        uniform float uOpacity;
        uniform float uProgress;
        varying vec2 vUv;

        void main() {
          vec2 p = vUv - vec2(0.5);
          float d = length(p) * 2.0;
          if (d > 1.0) discard; // Strict circular boundary

          // Multiple sharp expanding ripple wave fronts
          float ring1 = sin(clamp((d - uProgress * 0.85) * 24.0, 0.0, 3.14159));
          float ring2 = sin(clamp((d - uProgress * 0.55) * 16.0, 0.0, 3.14159));
          float wave = max(ring1, ring2 * 0.7);

          float edgeFade = smoothstep(1.0, 0.45, d) * smoothstep(0.0, 0.12, d);
          float alpha = wave * edgeFade * (1.0 - uProgress) * uOpacity;

          gl_FragColor = vec4(uColor, alpha);
        }
      `;

      startRippleMat = new THREE.ShaderMaterial({
        vertexShader: rippleVertexShader,
        fragmentShader: rippleFragmentShader,
        uniforms: {
          uColor: { value: new THREE.Color(params.sparkColor) },
          uOpacity: { value: 0.0 },
          uProgress: { value: 0.0 }
        },
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        side: THREE.DoubleSide
      });

      endRippleMat = startRippleMat.clone();
      endRippleMat.uniforms = {
        uColor: { value: new THREE.Color(params.sparkColor) },
        uOpacity: { value: 0.0 },
        uProgress: { value: 0.0 }
      };

      const rippleGeo = new THREE.PlaneGeometry(1, 1);
      startRippleMesh = new THREE.Mesh(rippleGeo, startRippleMat);
      endRippleMesh = new THREE.Mesh(rippleGeo, endRippleMat);

      scene.add(startRippleMesh);
      scene.add(endRippleMesh);
    }

    // --- 100% PERFECTLY ROUND SPARKS PARTICLE SYSTEM ---
    class SparksParticleSystem {
      constructor(maxParticles) {
        this.maxParticles = maxParticles;
        this.particles = [];

        this.positions = new Float32Array(maxParticles * 3);
        this.colors = new Float32Array(maxParticles * 3);
        this.sizes = new Float32Array(maxParticles);
        this.alphas = new Float32Array(maxParticles);

        this.geometry = new THREE.BufferGeometry();
        this.posAttr = new THREE.BufferAttribute(this.positions, 3);
        this.colAttr = new THREE.BufferAttribute(this.colors, 3);
        this.sizeAttr = new THREE.BufferAttribute(this.sizes, 1);
        this.alphaAttr = new THREE.BufferAttribute(this.alphas, 1);

        this.geometry.setAttribute('position', this.posAttr);
        this.geometry.setAttribute('color', this.colAttr);
        this.geometry.setAttribute('size', this.sizeAttr);
        this.geometry.setAttribute('aAlpha', this.alphaAttr);

        // Custom Shader strictly guaranteeing round shapes with glowing hot center
        const sparkVertexShader = `
          attribute float size;
          attribute vec3 color;
          attribute float aAlpha;
          varying vec3 vColor;
          varying float vAlpha;

          void main() {
            vColor = color;
            vAlpha = aAlpha;
            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
            gl_PointSize = size * (420.0 / -mvPosition.z);
            gl_Position = projectionMatrix * mvPosition;
          }
        `;

        const sparkFragmentShader = `
          varying vec3 vColor;
          varying float vAlpha;

          void main() {
            vec2 coord = gl_PointCoord - vec2(0.5);
            float dist = length(coord);
            if (dist > 0.5) discard; // Strictly discard outside unit circle

            // Smooth circular falloff with incandescent core
            float core = smoothstep(0.18, 0.0, dist);
            float halo = smoothstep(0.5, 0.02, dist);
            float alpha = (core * 0.7 + halo * 0.4) * vAlpha;

            vec3 finalColor = mix(vColor, vec3(1.0), core * 0.9);
            gl_FragColor = vec4(finalColor, alpha);
          }
        `;

        this.material = new THREE.ShaderMaterial({
          vertexShader: sparkVertexShader,
          fragmentShader: sparkFragmentShader,
          transparent: true,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        });

        this.mesh = new THREE.Points(this.geometry, this.material);
        scene.add(this.mesh);

        // Initialize particle pool
        for (let i = 0; i < maxParticles; i++) {
          this.particles.push({
            active: false,
            x: 0, y: 0, z: 0,
            vx: 0, vy: 0, vz: 0,
            life: 0,
            maxLife: 1,
            size: 0,
            r: 1, g: 1, b: 1
          });
        }
      }

      emit(origin, count, velocityScale, colorHex, isImpact = false) {
        const col = new THREE.Color(colorHex);

        for (let i = 0; i < count; i++) {
          const p = this.particles.find(item => !item.active);
          if (!p) break;

          p.active = true;
          p.x = origin.x + (Math.random() - 0.5) * 0.4;
          p.y = origin.y + (Math.random() - 0.5) * 0.4;
          p.z = origin.z + (Math.random() - 0.5) * 0.4;

          const theta = Math.random() * Math.PI * 2;
          const phi = Math.acos(2 * Math.random() - 1);
          const speed = (Math.random() * 1.1 + 0.4) * velocityScale;

          p.vx = Math.sin(phi) * Math.cos(theta) * speed;
          p.vy = Math.sin(phi) * Math.sin(theta) * speed + (isImpact ? Math.random() * 0.5 : 0);
          p.vz = Math.cos(phi) * speed;

          p.life = Math.random() * 0.55 + 0.35;
          p.maxLife = p.life;
          p.size = (Math.random() * 0.9 + 0.55);

          p.r = col.r;
          p.g = col.g;
          p.b = col.b;
        }
      }

      update(dt) {
        let activeIdx = 0;
        const drag = Math.pow(0.93, dt * 60);

        for (let i = 0; i < this.maxParticles; i++) {
          const p = this.particles[i];
          if (!p.active) continue;

          p.life -= dt * params.animationSpeed;
          if (p.life <= 0) {
            p.active = false;
            continue;
          }

          p.x += p.vx * dt * 60;
          p.y += p.vy * dt * 60;
          p.z += p.vz * dt * 60;

          p.vx *= drag;
          p.vy *= drag;
          p.vz *= drag;
          p.vy -= 0.0035 * dt * 60;

          const lifeProgress = p.life / p.maxLife;

          this.positions[activeIdx * 3 + 0] = p.x;
          this.positions[activeIdx * 3 + 1] = p.y;
          this.positions[activeIdx * 3 + 2] = p.z;

          this.colors[activeIdx * 3 + 0] = p.r;
          this.colors[activeIdx * 3 + 1] = p.g;
          this.colors[activeIdx * 3 + 2] = p.b;

          this.sizes[activeIdx] = p.size * (0.4 + 0.6 * lifeProgress);
          this.alphas[activeIdx] = Math.min(1.0, lifeProgress * 1.5);

          activeIdx++;
        }

        this.geometry.setDrawRange(0, activeIdx);
        this.posAttr.needsUpdate = true;
        this.colAttr.needsUpdate = true;
        this.sizeAttr.needsUpdate = true;
        this.alphaAttr.needsUpdate = true;
      }
    }

    function initSparks() {
      sparkSystem = new SparksParticleSystem(2200);
    }

    // --- ENHANCED HIGH-ENERGY FRACTAL LIGHTNING TREE GENERATOR ---
    function generateLightningTree(start, end, compConfig) {
      const trunkSegments = [];
      const branchSegments = [];
      const microSegments = [];

      function getPerpendiculars(dir) {
        const normDir = dir.clone().normalize();
        let up = new THREE.Vector3(0, 1, 0);
        if (Math.abs(normDir.dot(up)) > 0.9) up.set(1, 0, 0);
        const u = new THREE.Vector3().crossVectors(normDir, up).normalize();
        const v = new THREE.Vector3().crossVectors(normDir, u).normalize();
        return { u, v };
      }

      // Recursive Midpoint Subdivision with aggressive electrical kinks
      function subdivide(p1, p2, depth, maxDepth, scale, targetArray, isBranch = false, branchGen = 0) {
        const dir = new THREE.Vector3().subVectors(p2, p1);
        const len = dir.length();

        if (depth >= maxDepth || len < 0.45) {
          targetArray.push(p1.x, p1.y, p1.z, p2.x, p2.y, p2.z);
          return;
        }

        const mid = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5);
        const { u, v } = getPerpendiculars(dir);

        const angle = Math.random() * Math.PI * 2;
        // High-voltage displacement magnitude
        const disp = (Math.random() - 0.5) * len * scale * params.jitter * (isBranch ? 1.1 : 0.85);

        const offset = new THREE.Vector3()
          .addScaledVector(u, Math.cos(angle) * disp)
          .addScaledVector(v, Math.sin(angle) * disp);

        const displacedMid = mid.clone().add(offset);

        // Branch bifurcation: guaranteed high branch count
        if (!isBranch && depth >= 1 && depth <= 5) {
          const branchChance = params.branchDensity * 0.65;
          if (Math.random() < branchChance) {
            const branchDir = dir.clone().normalize();
            const randomAxis = u.clone().applyAxisAngle(v, Math.random() * Math.PI * 2);
            const forkAngle = (0.4 + Math.random() * 0.55); // 23° to 55°
            branchDir.applyAxisAngle(randomAxis, forkAngle);

            const branchLen = len * (0.6 + Math.random() * 0.6);
            const branchEnd = displacedMid.clone().addScaledVector(branchDir, branchLen);

            // Subdivide secondary branch
            subdivide(displacedMid, branchEnd, depth + 1, maxDepth, scale * 0.75, branchSegments, true, 1);
          }
        } else if (isBranch && branchGen === 1 && depth <= 5 && Math.random() < 0.4) {
          // Secondary fork on branch
          const subDir = dir.clone().normalize();
          const rAxis = u.clone().applyAxisAngle(v, Math.random() * Math.PI * 2);
          subDir.applyAxisAngle(rAxis, 0.55);
          const subEnd = displacedMid.clone().addScaledVector(subDir, len * 0.5);
          subdivide(displacedMid, subEnd, depth + 1, maxDepth, scale * 0.6, branchSegments, true, 2);
        } else if (Math.random() < 0.25) {
          // Micro crackle filament
          const microDir = dir.clone().normalize();
          const rAxis = u.clone().applyAxisAngle(v, Math.random() * Math.PI * 2);
          microDir.applyAxisAngle(rAxis, 0.7);
          const microEnd = displacedMid.clone().addScaledVector(microDir, len * 0.35);
          subdivide(displacedMid, microEnd, depth + 1, maxDepth, scale * 0.5, microSegments, true, 3);
        }

        const nextScale = scale * 0.58;
        subdivide(p1, displacedMid, depth + 1, maxDepth, nextScale, targetArray, isBranch, branchGen);
        subdivide(displacedMid, p2, depth + 1, maxDepth, nextScale, targetArray, isBranch, branchGen);
      }

      // Multi-Point Jagged Guide Path for Primary Arc
      const mainPathPoints = [start.clone()];
      const segmentsCount = 7;
      const totalDelta = new THREE.Vector3().subVectors(end, start);
      const { u, v } = getPerpendiculars(totalDelta);

      for (let i = 1; i < segmentsCount; i++) {
        const t = i / segmentsCount;
        const pt = start.clone().addScaledVector(totalDelta, t);

        if (compConfig.midOffset) {
          pt.addScaledVector(compConfig.midOffset, Math.sin(t * Math.PI));
        }

        // Add major macro wander to the lightning corridor
        const wander = (Math.random() - 0.5) * 5.0 * params.jitter;
        const wAngle = Math.random() * Math.PI * 2;
        pt.addScaledVector(u, Math.cos(wAngle) * wander);
        pt.addScaledVector(v, Math.sin(wAngle) * wander);

        mainPathPoints.push(pt);
      }
      mainPathPoints.push(end.clone());

      // Subdivide each macro section into dense fractal segments
      for (let i = 0; i < mainPathPoints.length - 1; i++) {
        subdivide(mainPathPoints[i], mainPathPoints[i + 1], 0, 5, 0.55, trunkSegments, false, 0);
      }

      // Companion Braided Arc: entwined secondary plasma streamer
      const twinPathPoints = [start.clone()];
      for (let i = 1; i < mainPathPoints.length - 1; i++) {
        const twinPt = mainPathPoints[i].clone().add(new THREE.Vector3(
          (Math.random() - 0.5) * 2.5,
          (Math.random() - 0.5) * 2.5,
          (Math.random() - 0.5) * 2.5
        ));
        twinPathPoints.push(twinPt);
      }
      twinPathPoints.push(end.clone());

      for (let i = 0; i < twinPathPoints.length - 1; i++) {
        subdivide(twinPathPoints[i], twinPathPoints[i + 1], 0, 4, 0.45, trunkSegments, false, 0);
      }

      return { trunkSegments, branchSegments, microSegments };
    }

    // --- TRIGGER A NEW HIGH-VOLTAGE DISCHARGE STRIKE ---
    function triggerStrike(instant = false) {
      const comp = COMPOSITIONS[params.compositionMode] || COMPOSITIONS['Diagonal Traverse'];

      const start = comp.start.clone().add(new THREE.Vector3(
        (Math.random() - 0.5) * 1.5,
        (Math.random() - 0.5) * 1.5,
        (Math.random() - 0.5) * 1.5
      ));

      const end = comp.end.clone().add(new THREE.Vector3(
        (Math.random() - 0.5) * 1.5,
        (Math.random() - 0.5) * 1.5,
        (Math.random() - 0.5) * 1.5
      ));

      const tree = generateLightningTree(start, end, comp);

      // Save raw segments for dynamic micro-jittering in the animation loop
      currentRawTrunk = new Float32Array(tree.trunkSegments);
      currentRawBranches = new Float32Array(tree.branchSegments);
      currentRawMicro = new Float32Array(tree.microSegments);

      function updateLineMesh(mesh1, mesh2, mesh3, segmentsArray) {
        if (!segmentsArray || segmentsArray.length === 0) {
          segmentsArray = [0, 0, 0, 0.01, 0.01, 0.01];
        }
        mesh1.geometry.dispose();
        const newGeo = new LineSegmentsGeometry();
        newGeo.setPositions(segmentsArray);
        mesh1.geometry = newGeo;
        if (mesh2) mesh2.geometry = newGeo;
        if (mesh3) mesh3.geometry = newGeo;
      }

      updateLineMesh(trunkRimMesh, trunkGlowMesh, trunkCoreMesh, currentRawTrunk);
      updateLineMesh(branchRimMesh, branchGlowMesh, branchCoreMesh, currentRawBranches);
      updateLineMesh(microGlowMesh, microCoreMesh, null, currentRawMicro);

      // Lights position
      const midPoint = start.clone().add(end).multiplyScalar(0.5);
      corePointLight.position.copy(midPoint);
      flashPointLight.position.set(midPoint.x, midPoint.y + 2, midPoint.z + 10);

      startPointLight.position.copy(start);
      endPointLight.position.copy(end);

      // Terminal Coronas
      startCoronaMesh.position.copy(start);
      endCoronaMesh.position.copy(end);
      startCoronaMesh.quaternion.copy(camera.quaternion);
      endCoronaMesh.quaternion.copy(camera.quaternion);

      // Trigger Shockwave Ripples
      triggerRipples(start, end, comp);

      // Trigger Round Particle Sparks
      triggerSparksBurst(start, end, currentRawTrunk);

      // Strobe Light Pulse & Multi-Restrike Dynamics with GSAP
      triggerLightFlash(instant);
    }

    // --- CONTACT RIPPLES PULSE ---
    function triggerRipples(start, end, comp) {
      const duration = 0.7 / params.animationSpeed;

      startRippleMesh.position.copy(start);
      endRippleMesh.position.copy(end);

      startRippleMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), comp.contactNormalStart || new THREE.Vector3(0, 1, 0));
      endRippleMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), comp.contactNormalEnd || new THREE.Vector3(0, -1, 0));

      startRippleMat.uniforms.uColor.value.set(params.sparkColor);
      endRippleMat.uniforms.uColor.value.set(params.sparkColor);

      startRippleMesh.scale.set(0.1, 0.1, 0.1);
      endRippleMesh.scale.set(0.1, 0.1, 0.1);

      gsap.killTweensOf(startRippleMesh.scale);
      gsap.killTweensOf(endRippleMesh.scale);
      gsap.killTweensOf(startRippleMat.uniforms.uProgress);
      gsap.killTweensOf(startRippleMat.uniforms.uOpacity);
      gsap.killTweensOf(endRippleMat.uniforms.uProgress);
      gsap.killTweensOf(endRippleMat.uniforms.uOpacity);

      gsap.to(startRippleMesh.scale, {
        x: params.rippleScale,
        y: params.rippleScale,
        z: params.rippleScale,
        duration: duration,
        ease: 'power1.out'
      });
      gsap.to(endRippleMesh.scale, {
        x: params.rippleScale * 1.2,
        y: params.rippleScale * 1.2,
        z: params.rippleScale * 1.2,
        duration: duration,
        ease: 'power1.out'
      });

      startRippleMat.uniforms.uOpacity.value = 1.0;
      endRippleMat.uniforms.uOpacity.value = 1.0;

      gsap.fromTo(startRippleMat.uniforms.uProgress, { value: 0 }, { value: 1, duration: duration, ease: 'none' });
      gsap.to(startRippleMat.uniforms.uOpacity, { value: 0, duration: duration, ease: 'power2.in' });

      gsap.fromTo(endRippleMat.uniforms.uProgress, { value: 0 }, { value: 1, duration: duration, ease: 'none' });
      gsap.to(endRippleMat.uniforms.uOpacity, { value: 0, duration: duration, ease: 'power2.in' });
    }

    // --- ROUND SPARKS BURST GENERATION ---
    function triggerSparksBurst(start, end, trunkSegments) {
      const count = params.sparkCount;
      const contactCount = Math.floor(count * 0.38);
      const arcCount = Math.floor(count * 0.35);

      // Contact point spark fountains
      sparkSystem.emit(start, contactCount, 1.35, params.sparkColor, true);
      sparkSystem.emit(end, contactCount, 1.5, params.sparkColor, true);

      // Plasma sparks along the main arc corridor
      if (trunkSegments.length >= 6) {
        for (let i = 0; i < arcCount; i++) {
          const segIdx = Math.floor(Math.random() * (trunkSegments.length / 6)) * 6;
          const origin = new THREE.Vector3(
            trunkSegments[segIdx],
            trunkSegments[segIdx + 1],
            trunkSegments[segIdx + 2]
          );
          sparkSystem.emit(origin, 1, 0.95, params.glowColor, false);
        }
      }
    }

    // --- LIGHT FLASH STROBE DYNAMICS ---
    function triggerLightFlash(instant) {
      gsap.killTweensOf(strikeState);
      gsap.killTweensOf(flashPointLight);
      gsap.killTweensOf(ambientLight);
      gsap.killTweensOf(startPointLight);
      gsap.killTweensOf(endPointLight);

      const speedFactor = 1.0 / params.animationSpeed;

      flashPointLight.color.set(params.flashColor);
      corePointLight.color.set(params.glowColor);
      startPointLight.color.set(params.sparkColor);
      endPointLight.color.set(params.sparkColor);

      const maxFlash = params.flashIntensity * 3.2;

      // Realistic return strokes and flickering plasma decay
      const tl = gsap.timeline({
        onUpdate: () => {
          updateLightningVisualIntensity();
        }
      });

      tl.set(strikeState, { intensity: 1.0, decayAlpha: 1.0 })
        .set(flashPointLight, { intensity: maxFlash })
        .set(startPointLight, { intensity: params.startLightIntensity * 3.0 })
        .set(endPointLight, { intensity: params.endLightIntensity * 3.0 })
        .set(ambientLight, { intensity: params.ambientIntensity + 1.6 })
        // Multi-stroke restrike violence
        .to(flashPointLight, { intensity: maxFlash * 0.35, duration: 0.035 * speedFactor, ease: 'power1.in' })
        .to(flashPointLight, { intensity: maxFlash * 0.9, duration: 0.025 * speedFactor, ease: 'power1.out' })
        .to(flashPointLight, { intensity: maxFlash * 0.2, duration: 0.04 * speedFactor, ease: 'power1.in' })
        .to(flashPointLight, { intensity: maxFlash * 0.7, duration: 0.03 * speedFactor, ease: 'power1.out' })
        // Exponential decay to alive baseline
        .to(flashPointLight, { intensity: 0, duration: 0.32 * speedFactor, ease: 'power2.out' }, 'decay')
        .to(startPointLight, { intensity: params.startLightIntensity * 0.3, duration: 0.35 * speedFactor, ease: 'power2.out' }, 'decay')
        .to(endPointLight, { intensity: params.endLightIntensity * 0.3, duration: 0.35 * speedFactor, ease: 'power2.out' }, 'decay')
        .to(ambientLight, { intensity: params.ambientIntensity, duration: 0.38 * speedFactor, ease: 'power1.out' }, 'decay')
        // Retain baseline energetic alpha so arc is always alive and crackling!
        .to(strikeState, { decayAlpha: 0.0, duration: 0.45 * speedFactor, ease: 'power2.out' }, 'decay');
    }

    // --- UPDATE LIGHTNING MATERIAL OPACITIES ---
    function updateLightningVisualIntensity() {
      // Retain lively baseline glow between strikes
      const effectiveAlpha = THREE.MathUtils.lerp(strikeState.aliveAlpha, 1.0, strikeState.decayAlpha);

      trunkCoreMesh.material.opacity = effectiveAlpha * 1.0;
      trunkGlowMesh.material.opacity = effectiveAlpha * 0.9;
      trunkRimMesh.material.opacity = effectiveAlpha * 0.45;

      branchCoreMesh.material.opacity = effectiveAlpha * 0.95;
      branchGlowMesh.material.opacity = effectiveAlpha * 0.85;
      branchRimMesh.material.opacity = effectiveAlpha * 0.38;

      microCoreMesh.material.opacity = effectiveAlpha * 0.8;
      microGlowMesh.material.opacity = effectiveAlpha * 0.55;

      corePointLight.intensity = params.coreLightIntensity * (0.4 + 0.6 * strikeState.decayAlpha);

      if (startCoronaMesh && endCoronaMesh) {
        startCoronaMesh.material.uniforms.uIntensity.value = 0.5 + 0.5 * strikeState.decayAlpha;
        endCoronaMesh.material.uniforms.uIntensity.value = 0.5 + 0.5 * strikeState.decayAlpha;
      }
    }

    // --- REAL-TIME HIGH-FREQUENCY PLASMA CRACKLE JITTER ---
    function updateLiveLightningJitter(time) {
      if (!currentRawTrunk || currentRawTrunk.length === 0) return;

      const jitterAmp = 0.12 * params.jitter;
      const count = trunkCoreMesh.geometry.attributes.instanceStart.count;
      const startAttr = trunkCoreMesh.geometry.attributes.instanceStart;
      const endAttr = trunkCoreMesh.geometry.attributes.instanceEnd;

      for (let i = 0; i < count; i++) {
        const rawIdx = i * 6;
        if (rawIdx + 5 >= currentRawTrunk.length) break;

        // High frequency chaotic electrical displacement
        const n1 = Math.sin(time * 35.0 + i * 3.7) * jitterAmp;
        const n2 = Math.cos(time * 42.0 + i * 5.1) * jitterAmp;

        startAttr.setXYZ(
          i,
          currentRawTrunk[rawIdx + 0] + n1,
          currentRawTrunk[rawIdx + 1] + n2,
          currentRawTrunk[rawIdx + 2] + (n1 - n2) * 0.5
        );

        const n3 = Math.sin(time * 38.0 + (i + 1) * 3.7) * jitterAmp;
        const n4 = Math.cos(time * 46.0 + (i + 1) * 5.1) * jitterAmp;

        endAttr.setXYZ(
          i,
          currentRawTrunk[rawIdx + 3] + n3,
          currentRawTrunk[rawIdx + 4] + n4,
          currentRawTrunk[rawIdx + 5] + (n3 - n4) * 0.5
        );
      }

      startAttr.needsUpdate = true;
      endAttr.needsUpdate = true;
    }

    // --- UPDATE COLORS ACROSS MATERIALS & LIGHTS ---
    function updateColors() {
      const coreCol = new THREE.Color(params.coreColor);
      const glowCol = new THREE.Color(params.glowColor);
      const rimCol = new THREE.Color(params.rimColor);
      const sparkCol = new THREE.Color(params.sparkColor);
      const bgCol = new THREE.Color(params.greenScreen ? 0x00ff00 : params.backgroundColor);

      scene.background.copy(bgCol);

      trunkCoreMesh.material.color.copy(coreCol);
      branchCoreMesh.material.color.copy(coreCol);
      microCoreMesh.material.color.copy(coreCol);

      trunkGlowMesh.material.color.copy(glowCol);
      branchGlowMesh.material.color.copy(glowCol);
      microGlowMesh.material.color.copy(glowCol);

      trunkRimMesh.material.color.copy(rimCol);
      branchRimMesh.material.color.copy(rimCol);

      ambientLight.color.set(params.ambientColor);
      corePointLight.color.copy(glowCol);
      flashPointLight.color.set(params.flashColor);
      startPointLight.color.copy(sparkCol);
      endPointLight.color.copy(sparkCol);

      startRippleMat.uniforms.uColor.value.copy(sparkCol);
      endRippleMat.uniforms.uColor.value.copy(sparkCol);

      if (dustMaterial) {
        dustMaterial.uniforms.uColor.value.copy(sparkCol);
      }

      if (startCoronaMesh && endCoronaMesh) {
        startCoronaMesh.material.uniforms.uCoreColor.value.copy(coreCol);
        startCoronaMesh.material.uniforms.uGlowColor.value.copy(glowCol);
        endCoronaMesh.material.uniforms.uCoreColor.value.copy(coreCol);
        endCoronaMesh.material.uniforms.uGlowColor.value.copy(glowCol);
      }
    }

    // --- APPLY COLOR SCHEME SELECTION ---
    function applyColorScheme(name) {
      const scheme = COLOR_SCHEMES[name];
      if (!scheme) return;

      params.colorScheme = name;
      params.coreColor = scheme.core;
      params.glowColor = scheme.glow;
      params.rimColor = scheme.rim;
      params.flashColor = scheme.flash;
      params.sparkColor = scheme.sparks;
      params.backgroundColor = scheme.bg;
      params.ambientColor = scheme.ambient;

      updateColors();
      if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    // --- RANDOMIZE SCENE PROCEDURALLY ON CLICK ---
    function randomizeScene() {
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      applyColorScheme(randomScheme);

      const compKeys = Object.keys(COMPOSITIONS);
      params.compositionMode = compKeys[Math.floor(Math.random() * compKeys.length)];

      const anims = [
        'Static (Manual Orbit)',
        'Slow Orbital Drift',
        'Gentle Floating Drone',
        'Cinematic Dolly Breathing',
        'Diagonal Tension Drift',
        'Wide Panoramic Sweep',
        'Dutch Angle Roll & Tilt',
        'Ethereal Orbit & Sway'
      ];
      params.cameraAnimation = anims[Math.floor(Math.random() * anims.length)];

      params.branchDensity = +(Math.random() * 0.4 + 0.6).toFixed(2);
      params.jitter = +(Math.random() * 0.9 + 0.9).toFixed(2);
      params.coreWidth = +(Math.random() * 3.0 + 3.5).toFixed(1);
      params.glowWidth = +(Math.random() * 12.0 + 12.0).toFixed(1);
      params.rimWidth = +(Math.random() * 20.0 + 24.0).toFixed(1);
      params.sparkCount = Math.floor(Math.random() * 300 + 200);
      params.rippleScale = +(Math.random() * 2.5 + 3.0).toFixed(1);

      params.strikeFrequency = +(Math.random() * 1.5 + 0.9).toFixed(2);
      params.flashIntensity = +(Math.random() * 4.0 + 3.5).toFixed(1);
      params.bloomStrength = +(Math.random() * 1.0 + 1.8).toFixed(2);

      updateLineWidths();
      bloomPass.strength = params.bloomStrength;

      if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());

      triggerStrike(true);
    }

    // --- UPDATE LINE WIDTHS ---
    function updateLineWidths() {
      trunkRimMesh.material.linewidth = params.rimWidth;
      trunkGlowMesh.material.linewidth = params.glowWidth;
      trunkCoreMesh.material.linewidth = params.coreWidth;

      branchRimMesh.material.linewidth = params.rimWidth * 0.65;
      branchGlowMesh.material.linewidth = params.glowWidth * 0.65;
      branchCoreMesh.material.linewidth = params.coreWidth * 0.7;

      microGlowMesh.material.linewidth = params.glowWidth * 0.4;
      microCoreMesh.material.linewidth = params.coreWidth * 0.5;
    }

    // --- REBUILD RENDERER FOR ANTIALIAS CHANGE ---
    function applyAntialiasSetting() {
      const oldCanvas = renderer.domElement;
      renderer.dispose();

      renderer = new THREE.WebGLRenderer({
        antialias: params.antialias,
        powerPreference: 'high-performance',
        alpha: false
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(params.dpr);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = params.exposure;

      container.replaceChild(renderer.domElement, oldCanvas);

      controls.dispose();
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.target.copy(baseTarget);
      controls.minDistance = 6;
      controls.maxDistance = 150;

      controls.addEventListener('start', () => { isUserInteracting = true; });
      controls.addEventListener('end', () => {
        isUserInteracting = false;
        baseTarget.copy(controls.target);
      });

      renderer.domElement.addEventListener('pointerdown', (e) => {
        pointerDownPos = { x: e.clientX, y: e.clientY };
        pointerDownTime = performance.now();
      });

      renderer.domElement.addEventListener('pointerup', (e) => {
        const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
        const duration = performance.now() - pointerDownTime;
        if (dist < 8 && duration < 450 && params.randomizeOnClick) {
          randomizeScene();
        }
      });

      initComposer();
    }

    // --- BUILD LIL-GUI CONTROL PANEL ---
    function buildGUI() {
      gui = new GUI({ title: '⚡ Electric Discharges' });

      // Presets & Themes
      const fPresets = gui.addFolder('Presets & Themes');
      fPresets.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Color Scheme').onChange(applyColorScheme);
      fPresets.add(params, 'compositionMode', Object.keys(COMPOSITIONS)).name('Composition');
      fPresets.add(params, 'cameraAnimation', [
        'Static (Manual Orbit)',
        'Slow Orbital Drift',
        'Gentle Floating Drone',
        'Cinematic Dolly Breathing',
        'Diagonal Tension Drift',
        'Wide Panoramic Sweep',
        'Dutch Angle Roll & Tilt',
        'Ethereal Orbit & Sway'
      ]).name('Camera Animation');
      fPresets.add(params, 'randomizeOnClick').name('Randomize on Click');
      fPresets.add({ randomize: randomizeScene }, 'randomize').name('🎲 Randomize Now');

      // Lightning & Energy Settings
      const fEnergy = gui.addFolder('Lightning Dynamics');
      fEnergy.add(params, 'animationSpeed', 0.1, 3.0, 0.1).name('Animation Speed');
      fEnergy.add(params, 'strikeFrequency', 0.4, 4.0, 0.1).name('Strike Interval (s)');
      fEnergy.add(params, 'branchDensity', 0.2, 1.0, 0.05).name('Branch Density');
      fEnergy.add(params, 'jitter', 0.3, 2.5, 0.1).name('Jitter / Jaggedness');
      fEnergy.add(params, 'coreWidth', 1.0, 12.0, 0.5).name('Core Width').onChange(updateLineWidths);
      fEnergy.add(params, 'glowWidth', 4.0, 40.0, 1.0).name('Glow Width').onChange(updateLineWidths);
      fEnergy.add(params, 'rimWidth', 8.0, 60.0, 1.0).name('Rim Width').onChange(updateLineWidths);
      fEnergy.add(params, 'sparkCount', 0, 1000, 25).name('Round Sparks Count');
      fEnergy.add(params, 'rippleScale', 0.5, 7.0, 0.2).name('Contact Ripple Scale');

      // Color Palette Customization
      const fColors = gui.addFolder('Color Settings');
      fColors.addColor(params, 'coreColor').name('Core Color').onChange(updateColors);
      fColors.addColor(params, 'glowColor').name('Glow Color').onChange(updateColors);
      fColors.addColor(params, 'rimColor').name('Rim Color').onChange(updateColors);
      fColors.addColor(params, 'flashColor').name('Flash Light Color').onChange(updateColors);
      fColors.addColor(params, 'sparkColor').name('Sparks & Ripple Color').onChange(updateColors);
      fColors.addColor(params, 'backgroundColor').name('Background Color').onChange(updateColors);
      fColors.addColor(params, 'ambientColor').name('Ambient Color').onChange(updateColors);
      fColors.add(params, 'greenScreen').name('Green Screen (#00ff00)').onChange((val) => {
        scene.background.set(val ? 0x00ff00 : params.backgroundColor);
      });

      // Lighting & Post-Processing
      const fLight = gui.addFolder('Lighting & Bloom');
      fLight.add(params, 'exposure', 0.1, 3.5, 0.05).name('Scene Exposure').onChange(v => {
        renderer.toneMappingExposure = v;
      });
      fLight.add(params, 'ambientIntensity', 0.0, 2.5, 0.05).name('Ambient Light').onChange(v => {
        ambientLight.intensity = v;
      });
      fLight.add(params, 'coreLightIntensity', 0.0, 12.0, 0.2).name('Core Point Light').onChange(v => {
        corePointLight.intensity = v;
      });
      fLight.add(params, 'flashIntensity', 0.0, 18.0, 0.5).name('Discharge Flash Peak');
      fLight.add(params, 'startLightIntensity', 0.0, 10.0, 0.2).name('Cathode Contact Light');
      fLight.add(params, 'endLightIntensity', 0.0, 10.0, 0.2).name('Anode Contact Light');
      fLight.add(params, 'bloomStrength', 0.0, 4.0, 0.05).name('Bloom Strength').onChange(v => {
        bloomPass.strength = v;
      });
      fLight.add(params, 'bloomRadius', 0.0, 1.8, 0.05).name('Bloom Radius').onChange(v => {
        bloomPass.radius = v;
      });
      fLight.add(params, 'bloomThreshold', 0.0, 1.0, 0.02).name('Bloom Threshold').onChange(v => {
        bloomPass.threshold = v;
      });

      // Rendering Settings
      const fRender = gui.addFolder('Render Quality');
      fRender.add(params, 'dpr', 0.5, 3.0, 0.1).name('Pixel Ratio (DPR)').onChange(v => {
        renderer.setPixelRatio(v);
        composer.setPixelRatio(v);
        composer.setSize(window.innerWidth, window.innerHeight);
      });
      fRender.add(params, 'antialias').name('Antialias').onChange(applyAntialiasSetting);
    }

    // --- WINDOW RESIZE HANDLER ---
    function onWindowResize() {
      const w = window.innerWidth;
      const h = window.innerHeight;

      camera.aspect = w / h;
      camera.updateProjectionMatrix();

      renderer.setSize(w, h);
      composer.setSize(w, h);

      allLineMaterials.forEach(mat => {
        if (mat.resolution) mat.resolution.set(w, h);
      });
    }

    // --- KEYBOARD LISTENER (TOGGLE UI WITH "H") ---
    function onKeyDown(e) {
      if (e.key === 'h' || e.key === 'H') {
        gui._hidden ? gui.show() : gui.hide();
      }
    }

    // --- CAMERA ANIMATIONS CONTROLLER ---
    function updateCameraAnimation(dt) {
      const anim = params.cameraAnimation;
      const speed = params.animationSpeed;
      elapsedTime += dt * speed;

      controls.autoRotate = false;

      if (isUserInteracting) return;

      if (anim === 'Static (Manual Orbit)') {
        camera.rotation.z = 0;
      } else if (anim === 'Slow Orbital Drift') {
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.55 * speed;
        camera.rotation.z = 0;
      } else if (anim === 'Gentle Floating Drone') {
        const hoverX = Math.sin(elapsedTime * 0.45) * 0.45;
        const hoverY = Math.cos(elapsedTime * 0.65) * 0.4;
        controls.target.set(baseTarget.x + hoverX, baseTarget.y + hoverY, baseTarget.z);
        camera.rotation.z = Math.sin(elapsedTime * 0.35) * 0.015;
      } else if (anim === 'Cinematic Dolly Breathing') {
        const fovBreath = Math.sin(elapsedTime * 0.55) * 2.8;
        camera.fov = baseFov + fovBreath;
        camera.updateProjectionMatrix();
        camera.rotation.z = 0;
      } else if (anim === 'Diagonal Tension Drift') {
        const drift = Math.sin(elapsedTime * 0.5) * 1.2;
        controls.target.set(baseTarget.x + drift * 0.7, baseTarget.y + drift * 0.5, baseTarget.z);
        camera.rotation.z = 0;
      } else if (anim === 'Wide Panoramic Sweep') {
        controls.autoRotate = true;
        controls.autoRotateSpeed = Math.sin(elapsedTime * 0.35) * 0.85 * speed;
        camera.rotation.z = 0;
      } else if (anim === 'Dutch Angle Roll & Tilt') {
        camera.rotation.z = Math.sin(elapsedTime * 0.4) * 0.05;
        controls.target.y = baseTarget.y + Math.sin(elapsedTime * 0.6) * 0.35;
      } else if (anim === 'Ethereal Orbit & Sway') {
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.38 * speed;
        controls.target.y = baseTarget.y + Math.sin(elapsedTime * 0.5) * 0.5;
        camera.rotation.z = 0;
      }
    }

    // --- MAIN RENDER & ANIMATION LOOP ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const dt = Math.min(clock.getDelta(), 0.1);

      updateCameraAnimation(dt);
      controls.update();

      // Orient Terminal Coronas toward camera
      if (startCoronaMesh && endCoronaMesh) {
        startCoronaMesh.quaternion.copy(camera.quaternion);
        endCoronaMesh.quaternion.copy(camera.quaternion);
      }

      // Real-time live electrical micro-jitter crackling
      updateLiveLightningJitter(elapsedTime);

      // Round Sparks physics update
      if (sparkSystem) {
        sparkSystem.update(dt);
      }

      // Round Ambient Dust gentle twinkling update
      if (dustParticles && dustMaterial) {
        dustMaterial.uniforms.uTime.value = elapsedTime;
        dustParticles.rotation.y += 0.0004 * params.animationSpeed;
      }

      // Auto Infinite Strike Scheduler
      nextStrikeTimer -= dt * params.animationSpeed;
      if (nextStrikeTimer <= 0) {
        triggerStrike(false);
        nextStrikeTimer = params.strikeFrequency * (0.8 + Math.random() * 0.5);
      }

      // Render through Bloom Post-Processing
      composer.render();
    }

    // Initialize application
    init();
  </script>
</body>
</html>
