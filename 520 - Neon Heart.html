<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Heart</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #08080c;
      user-select: none;
      -webkit-user-select: none;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>

  <!-- GSAP CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <!-- Import Map for Three.js, lil-gui, and PostProcessor.js -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js",
      "postprocessing/PostProcessor.js": "./postprocessing/PostProcessor.js"
    }
  }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import GUI from 'lil-gui';

    /* ========================================================================= */
    /* POST PROCESSOR SUITE (From postprocessing/PostProcessor.js)               */
    /* ========================================================================= */
    const orthoVertexShader = `
    precision highp float;
    in vec3 position;
    out vec2 vUv;
    void main() {
      vUv = position.xy * 0.5 + 0.5;
      gl_Position = vec4(position.xy, 0.0, 1.0);
    }
    `;

    const brightFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float bloomThreshold;
    in vec2 vUv;
    out vec4 fragColor;

    vec3 sanitize(vec3 v) {
      if (isnan(v.x) || isinf(v.x)) v.x = 0.0;
      if (isnan(v.y) || isinf(v.y)) v.y = 0.0;
      if (isnan(v.z) || isinf(v.z)) v.z = 0.0;
      return clamp(v, vec3(0.0), vec3(65000.0));
    }

    void main() {
      vec4 raw = texture(inputTexture, vUv);
      vec3 color = sanitize(raw.rgb);
      float luminance = max(0.0, dot(color, vec3(0.2126, 0.7152, 0.0722)));
      float knee = 0.1;
      float soft = luminance - bloomThreshold + knee;
      soft = clamp(soft, 0.0, 2.0 * knee);
      soft = (soft * soft) / (4.0 * knee + 0.00001);
      float contribution = max(soft, luminance - bloomThreshold);
      contribution /= max(luminance, 0.0001);
      vec3 result = color * contribution;
      fragColor = vec4(sanitize(result), clamp(raw.a, 0.0, 1.0));
    }
    `;

    const blur13ShaderChunk = `
    vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
      vec2 resolution = vec2(textureSize(image, 0));
      vec4 color = vec4(0.0);
      vec2 off1 = vec2(1.411764705882353) * direction;
      vec2 off2 = vec2(3.2941176470588234) * direction;
      vec2 off3 = vec2(5.176470588235294) * direction;
      color += texture(image, uv) * 0.1964825501511404;
      color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
      color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
      return color;
    }
    `;

    const blurFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 direction;
    in vec2 vUv;
    out vec4 color;
    ${blur13ShaderChunk}

    vec4 sanitize(vec4 v) {
      if (isnan(v.x) || isinf(v.x)) v.x = 0.0;
      if (isnan(v.y) || isinf(v.y)) v.y = 0.0;
      if (isnan(v.z) || isinf(v.z)) v.z = 0.0;
      if (isnan(v.w) || isinf(v.w)) v.w = 0.0;
      return clamp(v, vec4(0.0), vec4(65000.0));
    }

    void main() {
      color = sanitize(blur13(inputTexture, vUv, direction));
    }
    `;

    const godRaysDepthMaskShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float threshold;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float lum = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float factor = smoothstep(threshold, threshold + 0.15, lum);
      fragColor = vec4(vec3(factor), 1.0);
    }
    `;

    const godRaysGenerateShader = `
    precision highp float;
    #define TAPS_PER_PASS 6.0

    uniform sampler2D inputTexture;
    uniform vec3 vSunPositionScreenSpace;
    uniform float fStepSize;
    uniform float distanceAttenuation;
    uniform float maxDensity;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec2 delta = vSunPositionScreenSpace.xy - vUv;
      float dist = length(delta);
      vec2 stepv = fStepSize * delta / max(dist, 0.0001);
      float iters = dist / max(fStepSize, 0.00001);

      vec2 uv = vUv;
      float col = 0.0;
      float f = min(1.0, max(vSunPositionScreenSpace.z, 0.0));
      float atten = 1.0 / (1.0 + pow(dist, distanceAttenuation));

      if (0.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (1.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (2.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (3.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (4.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (5.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;

      float finalVal = min(col / TAPS_PER_PASS * atten, maxDensity);
      fragColor = vec4(vec3(finalVal), 1.0);
    }
    `;

    const anamorphicBrightShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float threshold;
    uniform float smoothWidth;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float v = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float alpha = smoothstep(threshold, threshold + smoothWidth, v);
      fragColor = mix(vec4(0.0), color, alpha);
    }
    `;

    const anamorphicBlurShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 resolution;
    uniform float samples;
    uniform float intensity;
    uniform vec3 tintColor;
    uniform float bloomRadius;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      int halfSamples = max(1, int(samples) / 2);
      float fHalfSamples = float(halfSamples);
      vec2 invSize = 1.0 / resolution;
      vec4 total = vec4(0.0);

      for (int i = -64; i <= 64; i++) {
        if (i < -halfSamples || i > halfSamples) continue;
        float softness = 1.0 - abs(float(i)) / fHalfSamples;
        softness = pow(softness, 2.0);
        vec2 shiftedUV = vec2(vUv.x + invSize.x * float(i) * (4.0 + bloomRadius * 8.0), vUv.y);
        shiftedUV = clamp(shiftedUV, 0.001, 0.999);
        total += texture(inputTexture, shiftedUV) * softness;
      }

      fragColor = (total / (samples / 3.0)) * vec4(tintColor, 1.0) * intensity;
    }
    `;

    const finalFragmentShader = `
    precision highp float;
    uniform vec2 resolution;
    uniform sampler2D inputTexture;
    uniform sampler2D blur0Texture;
    uniform sampler2D blur1Texture;
    uniform sampler2D blur2Texture;
    uniform sampler2D blur3Texture;
    uniform sampler2D blur4Texture;
    uniform sampler2D raysTexture;
    uniform sampler2D anamorphicTexture;
    uniform bool bloomEnabled;
    uniform float bloomStrength;
    uniform bool raysEnabled;
    uniform float raysStrength;
    uniform vec3 raysColor;
    uniform bool anamorphicEnabled;
    uniform float vignetteBoost;
    uniform float vignetteReduction;
    uniform float noiseIntensity;
    uniform float time;
    in vec2 vUv;
    out vec4 fragColor;

    vec3 sanitize(vec3 v) {
      if (isnan(v.x) || isinf(v.x)) v.x = 0.0;
      if (isnan(v.y) || isinf(v.y)) v.y = 0.0;
      if (isnan(v.z) || isinf(v.z)) v.z = 0.0;
      return clamp(v, vec3(0.0), vec3(65000.0));
    }

    float vignette(vec2 uv, float boost, float reduction) {
      vec2 position = vUv - 0.5;
      return boost - length(position) * reduction;
    }

    float hash1(uint n) {
      n = (n << 13U) ^ n;
      n = n * (n * n * 15731U + 789221U) + 1376312589U;
      return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
    }

    float noise(in vec2 uv, in float timeVal) {
      uvec2 p = uvec2(uv);
      return hash1(p.x + 1920U * p.y + (1920U * 1080U) * (uint(timeVal) % 65536U));
    }

    void main() {
      vec4 raw = texture(inputTexture, vUv);
      vec3 color = sanitize(raw.rgb);

      if (bloomEnabled && bloomStrength > 0.001) {
        vec3 b0 = sanitize(texture(blur0Texture, vUv).rgb);
        vec3 b1 = sanitize(texture(blur1Texture, vUv).rgb);
        vec3 b2 = sanitize(texture(blur2Texture, vUv).rgb);
        vec3 b3 = sanitize(texture(blur3Texture, vUv).rgb);
        vec3 b4 = sanitize(texture(blur4Texture, vUv).rgb);

        vec3 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
        color += bloomSum * bloomStrength;
      }

      if (raysEnabled && raysStrength > 0.001) {
        vec3 r = sanitize(texture(raysTexture, vUv).rgb);
        color += r * raysColor * raysStrength;
      }

      if (anamorphicEnabled) {
        vec3 a = sanitize(texture(anamorphicTexture, vUv).rgb);
        color += a;
      }

      float vig = max(0.0, vignette(vUv, vignetteBoost, vignetteReduction));
      color *= vig;
      color += max(0.0, noiseIntensity) * noise(gl_FragCoord.xy, time);
      fragColor = vec4(sanitize(color), 1.0);
    }
    `;

    const chromaticAberrationShaderChunk = `
    vec2 barrelDistortion(vec2 coord, float amt) {
      vec2 cc = coord - 0.5;
      float dist = dot(cc, cc);
      return coord + cc * dist * amt;
    }
    float sat(float t) { return clamp(t, 0.0, 1.0); }
    float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
    float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
    vec4 spectrum_offset(float t) {
      float lo = step(t, 0.5);
      float hi = 1.0 - lo;
      float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
      vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
      return pow(ret, vec4(1.0 / 2.2));
    }
    const float max_distort = 2.2;
    const int num_iter = 8;
    const float reci_num_iter_f = 1.0 / float(num_iter);
    vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
      vec4 sumcol = vec4(0.0);
      vec4 sumw = vec4(0.0);
      for (int i = 0; i < num_iter; ++i) {
        float t = float(i) * reci_num_iter_f;
        vec4 w = spectrum_offset(t);
        sumw += w;
        sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
      }
      return sumcol / sumw;
    }
    `;

    const colorFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float chromaticAberrationAmount;
    uniform float minInputLevel;
    uniform float maxInputLevel;
    uniform float gammaLevel;
    uniform float exposure;
    uniform float fisheyeStrength;
    uniform float fisheyeRadius;
    uniform float time;
    uniform int visionMode;
    uniform float thermalSensitivity;
    uniform float nightVisionNoise;
    uniform float nightVisionGain;
    uniform float crtIntensity;
    in vec2 vUv;
    out vec4 fragColor;

    ${chromaticAberrationShaderChunk}

    vec2 applyFisheye(vec2 uv, float strength, float radius) {
      if (abs(strength) < 0.0001) return uv;
      vec2 p = uv - 0.5;
      float d = length(p);
      if (d > radius * 1.5) return uv;
      float r = d / max(radius, 0.001);
      float theta = atan(p.y, p.x);
      float rDist = r + strength * (r * r * r);
      return 0.5 + vec2(cos(theta), sin(theta)) * (rDist * radius);
    }

    vec3 ACESFilmicToneMapping(vec3 color) {
      color = max(vec3(0.0), color);
      float a = 2.51;
      float b = 0.03;
      float c = 2.43;
      float d = 0.59;
      float e = 0.14;
      vec3 denom = max(color * (c * color + d) + e, vec3(0.0001));
      return clamp((color * (a * color + b)) / denom, 0.0, 1.0);
    }

    vec3 gammaCorrect(vec3 color, vec3 gamma) {
      return pow(max(color, vec3(0.0)), 1.0 / max(gamma, vec3(0.001)));
    }
    vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
      return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
    }
    vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
      return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
    }

    vec3 applyNightVision(vec3 color, vec2 uv, float timeVal, float noiseAmt, float gain, float crt) {
      float lum = dot(color, vec3(0.299, 0.587, 0.114));
      float amplified = pow(lum * gain, 0.72);
      vec3 phosphorColor = mix(vec3(0.02, 0.12, 0.03), vec3(0.18, 1.0, 0.32), clamp(amplified, 0.0, 1.0));
      phosphorColor += vec3(0.7, 1.0, 0.8) * max(0.0, amplified - 0.75) * 1.8;
      vec2 p = uv - 0.5;
      float tubeDist = length(p);
      float tubeMask = smoothstep(0.72, 0.44, tubeDist);
      float n = fract(sin(dot(uv * 280.0 + timeVal * 0.05, vec2(12.9898, 78.233))) * 43758.5453);
      float scanline = sin(uv.y * 650.0) * crt;
      phosphorColor += (n - 0.5) * noiseAmt * 2.0 + scanline;
      return clamp(phosphorColor * tubeMask, 0.0, 1.0);
    }

    vec3 ironbow(float t) {
      t = clamp(t, 0.0, 1.0);
      vec3 c0 = vec3(0.02, 0.01, 0.18);
      vec3 c1 = vec3(0.22, 0.02, 0.48);
      vec3 c2 = vec3(0.82, 0.05, 0.25);
      vec3 c3 = vec3(1.0, 0.62, 0.02);
      vec3 c4 = vec3(1.0, 1.0, 0.92);
      if (t < 0.25) return mix(c0, c1, t * 4.0);
      if (t < 0.50) return mix(c1, c2, (t - 0.25) * 4.0);
      if (t < 0.75) return mix(c2, c3, (t - 0.50) * 4.0);
      return mix(c3, c4, (t - 0.75) * 4.0);
    }

    vec3 applyThermal(vec3 color, vec2 uv, float sensitivity, float crt, bool whiteHot) {
      float lum = dot(color, vec3(0.299, 0.587, 0.114));
      float heat = clamp(lum * sensitivity, 0.0, 1.0);
      float sensorRaster = sin(uv.y * 900.0) * (crt * 0.3);
      heat = clamp(heat + sensorRaster, 0.0, 1.0);
      if (whiteHot) {
        float grad = pow(heat, 0.85);
        return vec3(grad);
      } else {
        return ironbow(heat);
      }
    }

    void main() {
      vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
      vec4 col = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
      vec3 finalCol = col.rgb;
      if (isnan(finalCol.x) || isinf(finalCol.x)) finalCol.x = 0.0;
      if (isnan(finalCol.y) || isinf(finalCol.y)) finalCol.y = 0.0;
      if (isnan(finalCol.z) || isinf(finalCol.z)) finalCol.z = 0.0;
      finalCol = clamp(finalCol, vec3(0.0), vec3(65000.0));

      if (visionMode == 1) {
        finalCol = applyNightVision(finalCol, uv, time, nightVisionNoise, nightVisionGain, crtIntensity);
      } else if (visionMode == 2) {
        finalCol = applyThermal(finalCol, uv, thermalSensitivity, crtIntensity, false);
      } else if (visionMode == 3) {
        finalCol = applyThermal(finalCol, uv, thermalSensitivity, crtIntensity, true);
      } else {
        vec3 exposedColor = finalCol * exposure;
        vec3 toneMappedColor = ACESFilmicToneMapping(exposedColor);
        finalCol = finalLevels(toneMappedColor, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
        if (crtIntensity > 0.0001) {
          float scanline = sin(uv.y * 900.0 + time * 2.0) * crtIntensity;
          finalCol -= scanline;
        }
      }

      fragColor = vec4(finalCol, 1.0);
    }
    `;

    const copyFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      fragColor = texture(inputTexture, vUv);
    }
    `;

    const fxaaFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 resolution;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec2 inverseVP = 1.0 / resolution;
      vec3 rgbNW = texture(inputTexture, vUv + vec2(-1.0, -1.0) * inverseVP).rgb;
      vec3 rgbNE = texture(inputTexture, vUv + vec2(1.0, -1.0) * inverseVP).rgb;
      vec3 rgbSW = texture(inputTexture, vUv + vec2(-1.0, 1.0) * inverseVP).rgb;
      vec3 rgbSE = texture(inputTexture, vUv + vec2(1.0, 1.0) * inverseVP).rgb;
      vec3 rgbM  = texture(inputTexture, vUv).rgb;

      vec3 luma = vec3(0.299, 0.587, 0.114);
      float lumaNW = dot(rgbNW, luma);
      float lumaNE = dot(rgbNE, luma);
      float lumaSW = dot(rgbSW, luma);
      float lumaSE = dot(rgbSE, luma);
      float lumaM  = dot(rgbM,  luma);

      float lumaMin = min(lumaM, min(min(lumaNW, lumaNE), min(lumaSW, lumaSE)));
      float lumaMax = max(lumaM, max(max(lumaNW, lumaNE), max(lumaSW, lumaSE)));

      vec2 dir;
      dir.x = -((lumaNW + lumaNE) - (lumaSW + lumaSE));
      dir.y =  ((lumaNW + lumaSW) - (lumaNE + lumaSE));

      float dirReduce = max((lumaNW + lumaNE + lumaSW + lumaSE) * (0.25 * (1.0 / 8.0)), 1.0 / 128.0);
      float rcpDirMin = 1.0 / (min(abs(dir.x), abs(dir.y)) + dirReduce);

      dir = min(vec2(8.0, 8.0), max(vec2(-8.0, -8.0), dir * rcpDirMin)) * inverseVP;

      vec3 rgbA = 0.5 * (
          texture(inputTexture, vUv + dir * (1.0 / 3.0 - 0.5)).rgb +
          texture(inputTexture, vUv + dir * (2.0 / 3.0 - 0.5)).rgb);
      vec3 rgbB = rgbA * 0.5 + 0.25 * (
          texture(inputTexture, vUv + dir * -0.5).rgb +
          texture(inputTexture, vUv + dir * 0.5).rgb);

      float lumaB = dot(rgbB, luma);
      if ((lumaB < lumaMin) || (lumaB > lumaMax)) {
          fragColor = vec4(rgbA, 1.0);
      } else {
          fragColor = vec4(rgbB, 1.0);
      }
    }
    `;

    const smaaFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 resolution;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec2 invRes = 1.0 / resolution;
      vec4 center = texture(inputTexture, vUv);
      
      vec3 cU = texture(inputTexture, vUv + vec2(0.0, -1.0) * invRes).rgb;
      vec3 cD = texture(inputTexture, vUv + vec2(0.0, 1.0) * invRes).rgb;
      vec3 cL = texture(inputTexture, vUv + vec2(-1.0, 0.0) * invRes).rgb;
      vec3 cR = texture(inputTexture, vUv + vec2(1.0, 0.0) * invRes).rgb;
      
      vec3 cUL = texture(inputTexture, vUv + vec2(-1.0, -1.0) * invRes).rgb;
      vec3 cUR = texture(inputTexture, vUv + vec2(1.0, -1.0) * invRes).rgb;
      vec3 cDL = texture(inputTexture, vUv + vec2(-1.0, 1.0) * invRes).rgb;
      vec3 cDR = texture(inputTexture, vUv + vec2(1.0, 1.0) * invRes).rgb;

      vec3 lumaW = vec3(0.299, 0.587, 0.114);
      float lM = dot(center.rgb, lumaW);
      float lU = dot(cU, lumaW);
      float lD = dot(cD, lumaW);
      float lL = dot(cL, lumaW);
      float lR = dot(cR, lumaW);

      float gx = (lR - lL) * 2.0 + (dot(cUR, lumaW) - dot(cUL, lumaW)) + (dot(cDR, lumaW) - dot(cDL, lumaW));
      float gy = (lD - lU) * 2.0 + (dot(cDL, lumaW) - dot(cUL, lumaW)) + (dot(cDR, lumaW) - dot(cUR, lumaW));
      float edgeStrength = length(vec2(gx, gy));

      if (edgeStrength < 0.04) {
        fragColor = center;
        return;
      }

      vec2 dir = normalize(vec2(-gy, gx)) * invRes * clamp(edgeStrength * 1.5, 0.5, 1.5);
      vec4 sampleA = texture(inputTexture, vUv + dir * 0.5);
      vec4 sampleB = texture(inputTexture, vUv - dir * 0.5);
      vec4 sampleC = texture(inputTexture, vUv + dir * 1.0);
      vec4 sampleD = texture(inputTexture, vUv - dir * 1.0);

      vec4 blended = (center * 2.0 + sampleA + sampleB + (sampleC + sampleD) * 0.5) / 5.0;

        this._toMoon.copy(moonWorldPos).sub(camera.position).normalize();
        const dot = this._camDir.dot(this._toMoon);

        if (dot <= 0.02) {
          this.moonInFront = false;
          this.finalShader.uniforms.raysEnabled.value = false;
          return;
        }

        this.moonInFront = true;
        const fade = THREE.MathUtils.clamp((dot - 0.02) / 0.15, 0.0, 1.0);
        this._ndc.copy(moonWorldPos).project(camera);
        const screenX = this._ndc.x * 0.5 + 0.5;
        const screenY = this._ndc.y * 0.5 + 0.5;
        const screenZ = fade;

        this.moonScreenPos.set(screenX, screenY, screenZ);
        this.godRaysGenShader.uniforms.vSunPositionScreenSpace.value.set(screenX, screenY, screenZ);
      }

      renderScene(scene, camera) {
        if (!this.settings.enabled) {
          if (this.settings.fxaaEnabled || this.settings.smaaEnabled || (this.settings.msaaSamples && this.settings.msaaSamples > 0) || (this.settings.ssaaScale && this.settings.ssaaScale > 1.0)) {
            this.renderer.setRenderTarget(this.sceneTarget);
            this.renderer.render(scene, camera);
            this.renderer.setRenderTarget(null);
            if (this.settings.fxaaEnabled) {
              this.fxaaShader.uniforms.inputTexture.value = this.sceneTarget.texture;
              this.fxaaPass.render(this.renderer, true);
            } else if (this.settings.smaaEnabled) {
              this.smaaShader.uniforms.inputTexture.value = this.sceneTarget.texture;
              this.smaaPass.render(this.renderer, true);
            } else {
              this.copyPass.shader.uniforms.inputTexture.value = this.sceneTarget.texture;
              this.copyPass.render(this.renderer, true);
            }
          } else {
            this.renderer.setRenderTarget(null);
            this.renderer.render(scene, camera);
          }
          return;
        }
        this.renderer.setRenderTarget(this.sceneTarget);
        this.renderer.render(scene, camera);
        this.renderer.setRenderTarget(null);
        this.render(this.sceneTarget.texture);
      }

      render(sourceTexture) {
        if (!this.settings.enabled) {
          this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
          this.copyPass.render(this.renderer, true);
          return;
        }

        this.updateSettings();

        // 1. Atmospheric Bloom
        this.bloomPass.source = sourceTexture;
        this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
        this.bloomPass.render(this.renderer);

        this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
        this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
        this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
        this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
        this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

        // 2. Godrays
        if (this.settings.raysEnabled && this.settings.raysStrength > 0.001 && this.moonInFront) {
          this.godRaysMaskShader.uniforms.inputTexture.value = sourceTexture;
          this.godRaysMaskShader.uniforms.threshold.value = this.settings.raysThreshold;
          this.godRaysMaskPass.render(this.renderer);

          const filterLen = this.settings.raysDensity;
          const tapsPerPass = 6.0;

          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -1.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysMaskPass.texture;
          this.godRaysPingPong.render(this.renderer);

          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -2.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysPingPong.texture;
          this.godRaysPingPong.render(this.renderer);

          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -3.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysPingPong.texture;
          this.godRaysPingPong.render(this.renderer);

          this.finalPass.shader.uniforms.raysTexture.value = this.godRaysPingPong.texture;
          this.finalPass.shader.uniforms.raysEnabled.value = true;
        } else {
          this.finalPass.shader.uniforms.raysEnabled.value = false;
        }

        // 3. Three.js Anamorphic Flare - DEFAULT IS OFF
        if (this.settings.anamorphicEnabled && this.settings.anamorphicIntensity > 0.001) {
          this.anamorphicBrightShader.uniforms.inputTexture.value = sourceTexture;
          this.anamorphicBrightShader.uniforms.threshold.value = this.settings.anamorphicThreshold;
          this.anamorphicBrightShader.uniforms.smoothWidth.value = this.settings.anamorphicSmoothWidth;
          this.anamorphicBrightPass.render(this.renderer);

          this.anamorphicBlurShader.uniforms.inputTexture.value = this.anamorphicBrightPass.texture;
          this.anamorphicBlurShader.uniforms.samples.value = this.settings.anamorphicSamples;
          this.anamorphicBlurShader.uniforms.intensity.value = this.settings.anamorphicIntensity;
          this.anamorphicBlurShader.uniforms.tintColor.value.copy(this.settings.anamorphicColor);
          this.anamorphicBlurShader.uniforms.bloomRadius.value = this.settings.anamorphicRadius;
          this.anamorphicBlurPass.render(this.renderer);

          this.finalPass.shader.uniforms.anamorphicTexture.value = this.anamorphicBlurPass.texture;
          this.finalPass.shader.uniforms.anamorphicEnabled.value = true;
        } else {
          this.finalPass.shader.uniforms.anamorphicEnabled.value = false;
        }

        const randomTime = Math.random() * 100000;
        this.finalPass.shader.uniforms.time.value = randomTime;
        this.rgbPass.shader.uniforms.time.value = randomTime;

        this.finalPass.render(this.renderer);
        if (this.settings.fxaaEnabled || this.settings.useFxaa) {
          this.rgbPass.render(this.renderer, false);
          this.fxaaShader.uniforms.inputTexture.value = this.rgbPass.texture;
          this.fxaaPass.render(this.renderer, true);
        } else if (this.settings.smaaEnabled) {
          this.rgbPass.render(this.renderer, false);
          this.smaaShader.uniforms.inputTexture.value = this.rgbPass.texture;
          this.smaaPass.render(this.renderer, true);
        } else {
          this.rgbPass.render(this.renderer, true);
        }
      }

    // --- PROCEDURAL BRICK WALL TEXTURE GENERATOR ---
    function generateBrickWallTextures() {
      const size = 1024;
      const colCanvas = document.createElement('canvas');
      colCanvas.width = size;
      colCanvas.height = size;
      const ctx = colCanvas.getContext('2d');

      const bumpCanvas = document.createElement('canvas');
      bumpCanvas.width = size;
      bumpCanvas.height = size;
      const bCtx = bumpCanvas.getContext('2d');

      ctx.fillStyle = '#0f1013';
      ctx.fillRect(0, 0, size, size);

      bCtx.fillStyle = '#101010';
      bCtx.fillRect(0, 0, size, size);

      const rows = 28;
      const rowHeight = size / rows;
      const mortar = 5;

      for (let r = 0; r < rows; r++) {
        const y = r * rowHeight;
        const isOffset = r % 2 === 1;
        const cols = 12;
        const brickWidth = size / (cols / 2);
        const startX = isOffset ? -brickWidth / 2 : 0;

        for (let x = startX; x < size + brickWidth; x += brickWidth) {
          const bx = x + mortar / 2;
          const by = y + mortar / 2;
          const bw = brickWidth - mortar;
          const bh = rowHeight - mortar;

          const shade = 40 + Math.floor(Math.random() * 25);
          ctx.fillStyle = `rgb(${shade}, ${shade + 1}, ${shade + 4})`;
          ctx.fillRect(bx, by, bw, bh);

          const bShade = 145 + Math.floor(Math.random() * 45);
          bCtx.fillStyle = `rgb(${bShade}, ${bShade}, ${bShade})`;
          bCtx.fillRect(bx, by, bw, bh);
        }
      }

      const imgData = ctx.getImageData(0, 0, size, size);
      const bImgData = bCtx.getImageData(0, 0, size, size);
      const data = imgData.data;
      const bData = bImgData.data;

      for (let i = 0; i < data.length; i += 4) {
        const noise = (Math.random() - 0.5) * 35;
        data[i] = Math.min(255, Math.max(0, data[i] + noise));
        data[i + 1] = Math.min(255, Math.max(0, data[i + 1] + noise));
        data[i + 2] = Math.min(255, Math.max(0, data[i + 2] + noise));

        const bNoise = (Math.random() - 0.5) * 45;
        const val = Math.min(255, Math.max(0, bData[i] + bNoise));
        bData[i] = val;
        bData[i + 1] = val;
        bData[i + 2] = val;
      }

      ctx.putImageData(imgData, 0, 0);
      bCtx.putImageData(bImgData, 0, 0);

      const diffuseTex = new THREE.CanvasTexture(colCanvas);
      diffuseTex.wrapS = THREE.RepeatWrapping;
      diffuseTex.wrapT = THREE.RepeatWrapping;
      diffuseTex.repeat.set(4, 3);

      const bumpTex = new THREE.CanvasTexture(bumpCanvas);
      bumpTex.wrapS = THREE.RepeatWrapping;
      bumpTex.wrapT = THREE.RepeatWrapping;
      bumpTex.repeat.set(4, 3);

      return { diffuseTex, bumpTex };
    }

    const { diffuseTex, bumpTex } = generateBrickWallTextures();

    // Wall Mesh
    const wallGeo = new THREE.PlaneGeometry(36, 24, 64, 64);
    const wallMat = new THREE.MeshStandardMaterial({
      color: new THREE.Color(params.wallColor),
      map: diffuseTex,
      bumpMap: bumpTex,
      bumpScale: params.wallBumpScale,
      roughness: params.wallRoughness,
      metalness: 0.12
    });
    const wallMesh = new THREE.Mesh(wallGeo, wallMat);
    wallMesh.position.set(0, 0, -1.2);
    scene.add(wallMesh);

    // --- ATMOSPHERIC PARTICLES ---
    const particleCount = 180;
    const particleGeo = new THREE.BufferGeometry();
    const particlePositions = new Float32Array(particleCount * 3);
    const particleScales = new Float32Array(particleCount);

    for (let i = 0; i < particleCount; i++) {
      particlePositions[i * 3 + 0] = (Math.random() - 0.5) * 12;
      particlePositions[i * 3 + 1] = (Math.random() - 0.5) * 9;
      particlePositions[i * 3 + 2] = (Math.random() - 0.5) * 4 + 0.5;
      particleScales[i] = Math.random() * 0.8 + 0.2;
    }
    particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
    particleGeo.setAttribute('aScale', new THREE.BufferAttribute(particleScales, 1));

    const particleMat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      uniforms: {
        uColor: { value: new THREE.Color(params.glowColor) },
        uTime: { value: 0 }
      },
      vertexShader: `
        attribute float aScale;
        uniform float uTime;
        varying float vAlpha;
        void main() {
          vec3 pos = position;
          pos.y += sin(uTime * 0.4 + position.x) * 0.2;
          pos.x += cos(uTime * 0.3 + position.y) * 0.2;
          vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
          gl_PointSize = (12.0 * aScale) / -mvPosition.z;
          vAlpha = 0.25 + 0.25 * sin(uTime + position.x * 2.0);
          gl_Position = projectionMatrix * mvPosition;
        }
      `,
      fragmentShader: `
        varying float vAlpha;
        uniform vec3 uColor;
        void main() {
          float d = length(gl_PointCoord - vec2(0.5));
          if (d > 0.5) discard;
          float fade = pow(1.0 - d * 2.0, 2.0);
          gl_FragColor = vec4(uColor, fade * vAlpha * 0.4);
        }
      `
    });
    const particleSystem = new THREE.Points(particleGeo, particleMat);
    scene.add(particleSystem);

    // --- LIGHTING ---
    const ambientLight = new THREE.AmbientLight(params.ambientColor, params.ambientIntensity * params.masterLightIntensity);
    scene.add(ambientLight);

    const grazingLight = new THREE.DirectionalLight(params.grazingColor, params.grazingIntensity * params.masterLightIntensity);
    grazingLight.position.set(-5, 6, 4);
    scene.add(grazingLight);

    const neonLight1 = new THREE.PointLight(params.light1Color, params.light1Intensity * params.masterLightIntensity, params.light1Distance, 1.6);
    scene.add(neonLight1);

    const neonLight2 = new THREE.PointLight(params.light2Color, params.light2Intensity * params.masterLightIntensity, params.light2Distance, 1.6);
    scene.add(neonLight2);

    const centerFillLight = new THREE.PointLight(params.glowColor, 1.2 * params.masterLightIntensity, 7.0, 1.5);
    centerFillLight.position.set(0, 0, 0.4);
    scene.add(centerFillLight);

    // --- MATHEMATICAL 3D INTERTWINED HEART CURVES ---
    function evaluateBaseHeart(t) {
      const scale = 0.155;
      const x = 16 * Math.pow(Math.sin(t), 3) * scale;
      const y = (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * scale + 0.12;
      return new THREE.Vector3(x, y, 0);
    }

    class IntertwinedHeartCurve extends THREE.Curve {
      constructor(phaseOffset = 0, amp = 0.12, freq = 16) {
        super();
        this.phaseOffset = phaseOffset;
        this.amp = amp;
        this.freq = freq;
      }

      getPoint(t, optionalTarget = new THREE.Vector3()) {
        const point = optionalTarget;
        const angle = t * Math.PI * 2;
        const delta = 0.002;

        const base = evaluateBaseHeart(angle);
        const pNext = evaluateBaseHeart(angle + delta);
        const pPrev = evaluateBaseHeart(angle - delta);

        const tangent = new THREE.Vector3().subVectors(pNext, pPrev).normalize();
        const normal = new THREE.Vector3(-tangent.y, tangent.x, 0).normalize();
        const binormal = new THREE.Vector3(0, 0, 1);

        const twistAngle = angle * this.freq + this.phaseOffset;
        const cosTwist = Math.cos(twistAngle);
        const sinTwist = Math.sin(twistAngle);

        point.copy(base);
        point.addScaledVector(normal, cosTwist * this.amp * 0.75);
        point.addScaledVector(binormal, sinTwist * this.amp);

        return point;
      }
    }

    const neonVertexShader = `
      varying vec2 vUv;
      varying vec3 vNormal;
      varying vec3 vViewPosition;
      varying vec3 vWorldPosition;

      uniform float uTime;
      uniform float uJitter;

      void main() {
        vUv = uv;
        vNormal = normalize(normalMatrix * normal);
        
        vec3 jitterOffset = vec3(
          sin(position.y * 35.0 + uTime * 45.0),
          cos(position.x * 35.0 + uTime * 52.0),
          sin(position.z * 40.0 + uTime * 48.0)
        ) * uJitter * 0.0065;

        vec4 worldPos = modelMatrix * vec4(position + jitterOffset, 1.0);
        vWorldPosition = worldPos.xyz;
        vec4 mvPosition = viewMatrix * worldPos;
        vViewPosition = -mvPosition.xyz;
        gl_Position = projectionMatrix * mvPosition;
      }
    `;

    const neonFragmentShader = `
      varying vec2 vUv;
      varying vec3 vNormal;
      varying vec3 vViewPosition;
      varying vec3 vWorldPosition;

      uniform float uTime;
      uniform float uDrawProgress;
      uniform float uTailLength;
      uniform vec3 uNeonColor;
      uniform vec3 uCoreColor;
      uniform float uGlowIntensity;
      uniform float uFlicker;

      void main() {
        float prog = vUv.x;
        float head = fract(uDrawProgress);
        float distBehind = mod(head - prog + 1.0, 1.0);

        float alpha = 0.0;
        if (distBehind <= uTailLength) {
          float tailFade = smoothstep(uTailLength, uTailLength * 0.25, distBehind);
          float headSharp = smoothstep(0.0, 0.012, distBehind);
          alpha = tailFade * headSharp;
        }

        vec3 normal = normalize(vNormal);
        vec3 viewDir = normalize(vViewPosition);
        float facing = abs(dot(normal, viewDir));
        float corePower = pow(facing, 2.6);

        float hum = 1.0 + 0.04 * sin(uTime * 65.0) + 0.02 * sin(uTime * 19.0);
        float randDip = fract(sin(floor(uTime * 14.0) * 83.21)) > 0.94 ? 0.28 : 0.0;
        float flickerFactor = hum * (1.0 - randDip * uFlicker);

        vec3 finalColor = mix(uNeonColor, uCoreColor, corePower * 0.85);
        finalColor *= uGlowIntensity * flickerFactor;

        float headSpot = smoothstep(0.035, 0.0, distBehind);
        finalColor += uCoreColor * headSpot * 3.5;

        if (alpha < 0.01) discard;

        gl_FragColor = vec4(finalColor, alpha);
      }
    `;

    const neonMat1 = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: true,
      uniforms: {
        uTime: { value: 0 },
        uDrawProgress: { value: 0 },
        uTailLength: { value: params.tailLength },
        uNeonColor: { value: new THREE.Color(params.neonColor1) },
        uCoreColor: { value: new THREE.Color('#ffffff') },
        uGlowIntensity: { value: params.glowIntensity },
        uFlicker: { value: params.flickerAmount },
        uJitter: { value: params.jitterAmount }
      },
      vertexShader: neonVertexShader,
      fragmentShader: neonFragmentShader
    });

    const neonMat2 = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: true,
      uniforms: {
        uTime: { value: 0 },
        uDrawProgress: { value: 0.08 },
        uTailLength: { value: params.tailLength },
        uNeonColor: { value: new THREE.Color(params.neonColor2) },
        uCoreColor: { value: new THREE.Color('#ffffff') },
        uGlowIntensity: { value: params.glowIntensity },
        uFlicker: { value: params.flickerAmount },
        uJitter: { value: params.jitterAmount }
      },
      vertexShader: neonVertexShader,
      fragmentShader: neonFragmentShader
    });

    let heartCurve1, heartCurve2;
    let tubeGeo1, tubeGeo2;
    let neonMesh1, neonMesh2;

    function buildNeonMeshes() {
      if (neonMesh1) scene.remove(neonMesh1);
      if (neonMesh2) scene.remove(neonMesh2);

      heartCurve1 = new IntertwinedHeartCurve(0, params.intertwineAmp, params.intertwineFreq);
      heartCurve2 = new IntertwinedHeartCurve(Math.PI, params.intertwineAmp, params.intertwineFreq);

      tubeGeo1 = new THREE.TubeGeometry(heartCurve1, 480, params.tubeRadius, 10, true);
      tubeGeo2 = new THREE.TubeGeometry(heartCurve2, 480, params.tubeRadius, 10, true);

      neonMesh1 = new THREE.Mesh(tubeGeo1, neonMat1);
      neonMesh2 = new THREE.Mesh(tubeGeo2, neonMat2);

      scene.add(neonMesh1);
      scene.add(neonMesh2);
    }

    buildNeonMeshes();

    // --- COLOR PALETTE UPDATE LOGIC ---
    function applyColorScheme(schemeName, animate = true) {
      const s = COLOR_SCHEMES[schemeName];
      if (!s) return;

      params.colorScheme = schemeName;
      params.neonColor1 = s.neon1;
      params.neonColor2 = s.neon2;
      params.glowColor = s.glow;
      params.wallColor = s.wall;
      params.bgColor = s.bg;
      params.fogColor = s.fog;
      params.light1Color = s.light1;
      params.light2Color = s.light2;

      if (animate && window.gsap) {
        const targetNeon1 = new THREE.Color(s.neon1);
        const targetNeon2 = new THREE.Color(s.neon2);
        const targetGlow = new THREE.Color(s.glow);
        const targetWall = new THREE.Color(s.wall);
        const targetBg = new THREE.Color(params.greenscreen ? '#00ff00' : s.bg);
        const targetLight1 = new THREE.Color(s.light1);
        const targetLight2 = new THREE.Color(s.light2);

        gsap.to(neonMat1.uniforms.uNeonColor.value, {
          r: targetNeon1.r, g: targetNeon1.g, b: targetNeon1.b, duration: 0.9, ease: 'power2.out'
        });
        gsap.to(neonMat2.uniforms.uNeonColor.value, {
          r: targetNeon2.r, g: targetNeon2.g, b: targetNeon2.b, duration: 0.9, ease: 'power2.out'
        });
        gsap.to(particleMat.uniforms.uColor.value, {
          r: targetGlow.r, g: targetGlow.g, b: targetGlow.b, duration: 0.9, ease: 'power2.out'
        });
        gsap.to(wallMat.color, {
          r: targetWall.r, g: targetWall.g, b: targetWall.b, duration: 0.9, ease: 'power2.out'
        });
        gsap.to(scene.background, {
          r: targetBg.r, g: targetBg.g, b: targetBg.b, duration: 0.9, ease: 'power2.out'
        });
        if (scene.fog) {
          gsap.to(scene.fog.color, {
            r: targetBg.r, g: targetBg.g, b: targetBg.b, duration: 0.9, ease: 'power2.out'
          });
        }
        gsap.to(neonLight1.color, {
          r: targetLight1.r, g: targetLight1.g, b: targetLight1.b, duration: 0.9, ease: 'power2.out'
        });
        gsap.to(neonLight2.color, {
          r: targetLight2.r, g: targetLight2.g, b: targetLight2.b, duration: 0.9, ease: 'power2.out'
        });
        gsap.to(centerFillLight.color, {
          r: targetGlow.r, g: targetGlow.g, b: targetGlow.b, duration: 0.9, ease: 'power2.out'
        });
      } else {
        neonMat1.uniforms.uNeonColor.value.set(s.neon1);
        neonMat2.uniforms.uNeonColor.value.set(s.neon2);
        particleMat.uniforms.uColor.value.set(s.glow);
        wallMat.color.set(s.wall);
        scene.background.set(params.greenscreen ? '#00ff00' : s.bg);
        if (scene.fog) scene.fog.color.set(params.greenscreen ? '#00ff00' : s.fog);
        neonLight1.color.set(s.light1);
        neonLight2.color.set(s.light2);
        centerFillLight.color.set(s.glow);
      }

      syncGuiControllers();
    }

    // --- GREENSCREEN TOGGLE LOGIC ---
    function updateGreenScreen(enabled) {
      params.greenscreen = enabled;
      if (enabled) {
        scene.background.set('#00ff00');
        wallMesh.visible = false;
        if (scene.fog) scene.fog.density = 0.0;
        particleSystem.visible = false;
      } else {
        scene.background.set(params.bgColor);
        wallMesh.visible = true;
        if (scene.fog) {
          scene.fog.color.set(params.fogColor);
          scene.fog.density = params.fogDensity;
        }
        particleSystem.visible = true;
      }
    }

    // --- PROCEDURAL RANDOMIZE ON CLICK ---
    // NOTE: PER USER INSTRUCTION, POSTPROCESSOR SETTINGS ARE STRICTLY
    // PRESERVED AND NEVER SHUFFLED OR CHANGED ON RANDOM SCENE!
    function randomizeScene() {
      const keys = Object.keys(COLOR_SCHEMES);
      const randomScheme = keys[Math.floor(Math.random() * keys.length)];

      params.tubeRadius = THREE.MathUtils.randFloat(0.018, 0.045);
      params.intertwineAmp = THREE.MathUtils.randFloat(0.06, 0.18);
      params.intertwineFreq = Math.floor(THREE.MathUtils.randFloat(12, 22));
      params.jitterAmount = THREE.MathUtils.randFloat(0.15, 0.65);
      params.flickerAmount = THREE.MathUtils.randFloat(0.2, 0.7);
      params.tailLength = THREE.MathUtils.randFloat(0.65, 1.15);
      params.animationSpeed = THREE.MathUtils.randFloat(0.7, 1.4);

      // (PostProcessor settings remain strictly untouched!)
      applyColorScheme(randomScheme, true);
      buildNeonMeshes();
      syncGuiControllers();
    }

    let pointerDownPos = { x: 0, y: 0, time: 0 };
    window.addEventListener('pointerdown', (e) => {
      pointerDownPos.x = e.clientX;
      pointerDownPos.y = e.clientY;
      pointerDownPos.time = performance.now();
    });

    window.addEventListener('pointerup', (e) => {
      if (!params.randomizeOnClick) return;
      if (e.target.closest('.lil-gui')) return;

      const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
      const elapsed = performance.now() - pointerDownPos.time;

      if (dist < 6 && elapsed < 350) {
        randomizeScene();
      }
    });

    // --- LIL-GUI SETUP ---
    const gui = new GUI({ title: 'Neon Heart Controls' });

    function setupGui() {
      // 1. Color Presets & Greenscreen
      const fPresets = gui.addFolder('Theme & Presets');
      fPresets.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Color Scheme').onChange(v => applyColorScheme(v, true));
      fPresets.add(params, 'greenscreen').name('Green Screen (#00ff00)').onChange(updateGreenScreen);

      // 2. Custom Neon & Tube Parameters
      const fNeon = gui.addFolder('Neon Line & Contours');
      fNeon.addColor(params, 'neonColor1').name('Contour 1 Color').onChange(v => {
        neonMat1.uniforms.uNeonColor.value.set(v);
        neonLight1.color.set(v);
      });
      fNeon.addColor(params, 'neonColor2').name('Contour 2 Color').onChange(v => {
        neonMat2.uniforms.uNeonColor.value.set(v);
        neonLight2.color.set(v);
      });
      fNeon.addColor(params, 'glowColor').name('Glow / Halo Color').onChange(v => {
        particleMat.uniforms.uColor.value.set(v);
        centerFillLight.color.set(v);
      });
      fNeon.add(params, 'tubeRadius', 0.01, 0.07, 0.002).name('Tube Thickness').onChange(() => buildNeonMeshes());
      fNeon.add(params, 'intertwineAmp', 0.02, 0.25, 0.005).name('Twist Depth').onChange(() => buildNeonMeshes());
      fNeon.add(params, 'intertwineFreq', 8, 28, 1).name('Twist Frequency').onChange(() => buildNeonMeshes());
      fNeon.add(params, 'tailLength', 0.1, 1.2, 0.02).name('Draw Tail Length').onChange(v => {
        neonMat1.uniforms.uTailLength.value = v;
        neonMat2.uniforms.uTailLength.value = v;
      });
      fNeon.add(params, 'glowIntensity', 0.5, 5.0, 0.1).name('Core Intensity').onChange(v => {
        neonMat1.uniforms.uGlowIntensity.value = v;
        neonMat2.uniforms.uGlowIntensity.value = v;
      });
      fNeon.add(params, 'flickerAmount', 0.0, 1.0, 0.05).name('Flicker / Hum').onChange(v => {
        neonMat1.uniforms.uFlicker.value = v;
        neonMat2.uniforms.uFlicker.value = v;
      });
      fNeon.add(params, 'jitterAmount', 0.0, 1.0, 0.05).name('Vibration Jitter').onChange(v => {
        neonMat1.uniforms.uJitter.value = v;
        neonMat2.uniforms.uJitter.value = v;
      });

      // 3. Wall Surface & Environment
      const fWall = gui.addFolder('Wall & Environment');
      fWall.addColor(params, 'bgColor').name('Background Color').onChange(v => {
        if (!params.greenscreen) scene.background.set(v);
      });
      fWall.addColor(params, 'wallColor').name('Wall Tint').onChange(v => wallMat.color.set(v));
      fWall.add(params, 'wallRoughness', 0.1, 1.0, 0.05).name('Wall Roughness').onChange(v => wallMat.roughness = v);
      fWall.add(params, 'wallBumpScale', 0.0, 0.12, 0.005).name('Brick Bump Scale').onChange(v => wallMat.bumpScale = v);
      fWall.add(params, 'fogDensity', 0.0, 0.1, 0.002).name('Fog Density').onChange(v => {
        if (scene.fog && !params.greenscreen) scene.fog.density = v;
      });
      fWall.addColor(params, 'fogColor').name('Fog Color').onChange(v => {
        if (scene.fog && !params.greenscreen) scene.fog.color.set(v);
      });

      // 4. Lighting & Exposure
      const fLight = gui.addFolder('Lighting & Exposure');
      fLight.add(params, 'exposure', 0.1, 3.0, 0.05).name('Scene Exposure').onChange(v => {
        renderer.toneMappingExposure = v;
        postProcessor.settings.exposure = v;
        postProcessor.updateSettings();
      });
      fLight.add(params, 'masterLightIntensity', 0.0, 3.0, 0.1).name('Master Light Mult').onChange(() => updateLights());
      fLight.add(params, 'ambientIntensity', 0.0, 2.0, 0.05).name('Ambient Intensity').onChange(() => updateLights());
      fLight.addColor(params, 'ambientColor').name('Ambient Color').onChange(v => ambientLight.color.set(v));
      fLight.add(params, 'light1Intensity', 0.0, 10.0, 0.2).name('Contour 1 Light Int').onChange(() => updateLights());
      fLight.add(params, 'light1Distance', 1.0, 15.0, 0.5).name('Contour 1 Range').onChange(v => neonLight1.distance = v);
      fLight.addColor(params, 'light1Color').name('Contour 1 Light Col').onChange(v => neonLight1.color.set(v));
      fLight.add(params, 'light2Intensity', 0.0, 10.0, 0.2).name('Contour 2 Light Int').onChange(() => updateLights());
      fLight.add(params, 'light2Distance', 1.0, 15.0, 0.5).name('Contour 2 Range').onChange(v => neonLight2.distance = v);
      fLight.addColor(params, 'light2Color').name('Contour 2 Light Col').onChange(v => neonLight2.color.set(v));
      fLight.add(params, 'grazingIntensity', 0.0, 4.0, 0.1).name('Grazing Light Int').onChange(() => updateLights());
      fLight.addColor(params, 'grazingColor').name('Grazing Light Col').onChange(v => grazingLight.color.set(v));
      fLight.add(params, 'followHeadLight').name('Light Follows Tip');

      // 5. Post-Processing Suite (from PostProcessor.js)
      postProcessor.attachGUI(gui, "Post-Processing Suite");

      // 6. Animation & Motion (Static by default)
      const fAnim = gui.addFolder('Motion & Animations');
      fAnim.add(params, 'animationMode', ANIMATION_MODES).name('Camera Motion');
      fAnim.add(params, 'animationSpeed', 0.0, 3.0, 0.05).name('Animation Speed');
      fAnim.add(params, 'randomizeOnClick').name('Randomize On Click');

      // 7. System Quality
      const fQuality = gui.addFolder('System Quality');
      fQuality.add(params, 'dpr', 0.5, 3.0, 0.1).name('DPR (Pixel Ratio)').onChange(v => {
        renderer.setPixelRatio(v);
        postProcessor.setSize(window.innerWidth, window.innerHeight, v);
      });
    }

    function updateLights() {
      ambientLight.intensity = params.ambientIntensity * params.masterLightIntensity;
      grazingLight.intensity = params.grazingIntensity * params.masterLightIntensity;
      neonLight1.intensity = params.light1Intensity * params.masterLightIntensity;
      neonLight2.intensity = params.light2Intensity * params.masterLightIntensity;
      centerFillLight.intensity = 1.2 * params.masterLightIntensity;
    }

    function syncGuiControllers() {
      gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    setupGui();

    // Toggle UI visibility with "H" key
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
        if (gui._hidden) {
          gui.show();
        } else {
          gui.hide();
        }
      }
    });

    // --- ANIMATION LOOP ---
    const clock = new THREE.Clock();
    let drawProgress = 0;

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const speed = params.animationSpeed;
      const elapsedTime = clock.getElapsedTime() * speed;

      // 1. Endless loop draw progress
      drawProgress += delta * params.drawSpeed * speed;
      neonMat1.uniforms.uDrawProgress.value = drawProgress;
      neonMat2.uniforms.uDrawProgress.value = drawProgress + 0.08;

      neonMat1.uniforms.uTime.value = elapsedTime;
      neonMat2.uniforms.uTime.value = elapsedTime;
      particleMat.uniforms.uTime.value = elapsedTime;

      // 2. Dynamic light tracking the leading tip
      if (params.followHeadLight && heartCurve1 && heartCurve2) {
        const head1T = (drawProgress) % 1.0;
        const head2T = (drawProgress + 0.08) % 1.0;
        const tipPos1 = heartCurve1.getPoint(head1T);
        const tipPos2 = heartCurve2.getPoint(head2T);

        neonLight1.position.set(tipPos1.x, tipPos1.y, tipPos1.z + 0.35);
        neonLight2.position.set(tipPos2.x, tipPos2.y, tipPos2.z + 0.35);

        // Update Godrays sun/light position for PostProcessor
        if (postProcessor.settings.raysEnabled) {
          postProcessor.setMoonScreenPosition(camera, neonLight1.position);
        }
      }

      // 3. Camera motion (Static by default, allows user to rotate & zoom freely)
      if (!isUserInteracting) {
        let deltaTheta = 0;
        let deltaPhi = 0;
        let radiusFactor = 1.0;
        const targetOffset = new THREE.Vector3(0, 0, 0);

        switch (params.animationMode) {
          case 'Static (No Movement)':
            // Default: camera remains completely static at user's current view
            break;

          case 'Gentle Floating Sway':
            deltaTheta = Math.sin(elapsedTime * 0.45) * 0.07;
            deltaPhi = Math.cos(elapsedTime * 0.38) * 0.04;
            targetOffset.set(
              Math.sin(elapsedTime * 0.45) * 0.12,
              Math.cos(elapsedTime * 0.38) * 0.08,
              0
            );
            break;

          case 'Slow Cinematic Orbit':
            userBaseTheta += delta * 0.22 * speed;
            deltaPhi = Math.sin(elapsedTime * 0.35) * 0.035;
            break;

          case 'Breathing Dolly Zoom':
            radiusFactor = 1.0 + Math.sin(elapsedTime * 0.75) * 0.14;
            deltaTheta = Math.sin(elapsedTime * 0.3) * 0.03;
            break;

          case 'Side Grazing Drift':
            deltaTheta = 0.38 + Math.sin(elapsedTime * 0.35) * 0.09;
            deltaPhi = 0.06 + Math.cos(elapsedTime * 0.28) * 0.035;
            targetOffset.x = Math.sin(elapsedTime * 0.35) * 0.15;
            break;

          case 'Figure-8 Infinity':
            deltaTheta = Math.sin(elapsedTime * 0.4) * 0.12;
            deltaPhi = Math.sin(elapsedTime * 0.8) * 0.06;
            targetOffset.y = Math.cos(elapsedTime * 0.4) * 0.08;
            break;

          case 'Heartbeat Pulse': {
            const beatPhase = (elapsedTime * 1.4) % 1.0;
            const pulse = (Math.exp(-beatPhase * 7.0) * Math.sin(beatPhase * Math.PI * 2.0)) * 0.09;
            radiusFactor = 1.0 - pulse;
            deltaPhi = pulse * 0.03;
            break;
          }

          case 'Crane Arc Pan':
            deltaPhi = Math.sin(elapsedTime * 0.4) * 0.14;
            targetOffset.y = Math.sin(elapsedTime * 0.4) * 0.25;
            break;
        }

        const curRadius = THREE.MathUtils.clamp(userBaseRadius * radiusFactor, controls.minDistance, controls.maxDistance);
        const curTheta = userBaseTheta + deltaTheta;
        const curPhi = THREE.MathUtils.clamp(userBasePhi + deltaPhi, 0.05, Math.PI - 0.05);

        spherical.set(curRadius, curPhi, curTheta);
        camera.position.setFromSpherical(spherical).add(userTarget).add(targetOffset);
        controls.target.copy(userTarget).add(targetOffset);
      }

      controls.update();

      // Render via PostProcessor pipeline
      postProcessor.renderScene(scene, camera);
    }

    animate();

    // --- WINDOW RESIZE HANDLER ---
    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;

      camera.aspect = w / h;
      camera.updateProjectionMatrix();

      renderer.setSize(w, h);
      postProcessor.setSize(w, h, params.dpr);
    });
  </script>
</body>
</html>
