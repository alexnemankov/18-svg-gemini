    function fitSealText(ctx, text, maxWidth, initialSize, minSize, weight = '900', fontFam = '"Arial Black", Impact, sans-serif') {
      let size = initialSize;
      ctx.font = `${weight} ${size}px ${fontFam}`;
      let width = ctx.measureText(text).width;
      while (width > maxWidth && size > minSize) {
        size -= 1;
        ctx.font = `${weight} ${size}px ${fontFam}`;
        width = ctx.measureText(text).width;
      }
      return { size, width, font: `${weight} ${size}px ${fontFam}` };
    }

    function updateSealTexture() {
      if (!sealCanvas) return;
      const ctx = sealCanvas.getContext('2d');
      const w = sealCanvas.width;
      const h = sealCanvas.height;
      const cx = w / 2;
      const cy = h / 2;

      ctx.clearRect(0, 0, w, h);

      const p = PALETTES[params.colorScheme];
      const sealInk = p.seal;

      ctx.save();
      ctx.fillStyle = sealInk;
      ctx.strokeStyle = sealInk;

      // 1. Heavy Outer Circular Borders & Security Teeth
      ctx.lineWidth = 16;
      ctx.beginPath();
      ctx.arc(cx, cy, 460, 0, Math.PI * 2);
      ctx.stroke();

      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.arc(cx, cy, 436, 0, Math.PI * 2);
      ctx.stroke();

      const teeth = 72;
      for (let i = 0; i < teeth; i++) {
        const angle = (i / teeth) * Math.PI * 2;
        const x1 = cx + Math.cos(angle) * 418;
        const y1 = cy + Math.sin(angle) * 418;
        const x2 = cx + Math.cos(angle) * 404;
        const y2 = cy + Math.sin(angle) * 404;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      }

      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.arc(cx, cy, 390, 0, Math.PI * 2);
      ctx.stroke();

      // 2. Official Arc Inscriptions (Properly measured letter spacing)
      drawArcText(ctx, "★ OFFICIAL REVENUE & TAX AUDIT AUTHORITY ★", cx, cy, 345, Math.PI * 1.5, true, 'bold 27px "Courier New", monospace');
      drawArcText(ctx, "★ STATUTORY FISCAL COMPLIANCE DIVISION ★", cx, cy, 345, Math.PI * 0.5, false, 'bold 27px "Courier New", monospace');

      // 3. Inner Ring
      ctx.lineWidth = 7;
      ctx.beginPath();
      ctx.arc(cx, cy, 290, 0, Math.PI * 2);
      ctx.stroke();

      // 4. Parse Seal Text (Handles "A / B", "A/B", or single long phrases)
      let mainText = "";
      let subText = "";
      if (params.sealText.includes(' / ')) {
        const parts = params.sealText.split(' / ');
        mainText = parts[0].trim();
        subText = (parts[1] || "").trim();
      } else if (params.sealText.includes('/')) {
        const parts = params.sealText.split('/');
        mainText = parts[0].trim();
        subText = (parts[1] || "").trim();
      } else {
        mainText = params.sealText.trim();
        subText = "";
      }

      // 5. Central Rectangular Cartouche Box
      // Corner radius: sqrt(262^2 + 74^2) = 272.2 < 290
      const boxW = 524;
      const boxH = 148;
      const boxHalfW = boxW / 2;
      const boxHalfH = boxH / 2;

      ctx.lineWidth = 6;
      ctx.strokeRect(cx - boxHalfW, cy - boxHalfH, boxW, boxH);
      ctx.lineWidth = 2.5;
      ctx.strokeRect(cx - (boxHalfW - 9), cy - (boxHalfH - 9), boxW - 18, boxH - 18);

      // Micro security corner brackets inside cartouche
      const bLen = 14;
      const bOffX = boxHalfW - 16;
      const bOffY = boxHalfH - 16;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      // TL
      ctx.moveTo(cx - bOffX, cy - bOffY + bLen); ctx.lineTo(cx - bOffX, cy - bOffY); ctx.lineTo(cx - bOffX + bLen, cy - bOffY);
      // TR
      ctx.moveTo(cx + bOffX - bLen, cy - bOffY); ctx.lineTo(cx + bOffX, cy - bOffY); ctx.lineTo(cx + bOffX, cy - bOffY + bLen);
      // BL
      ctx.moveTo(cx - bOffX, cy + bOffY - bLen); ctx.lineTo(cx - bOffX, cy + bOffY); ctx.lineTo(cx - bOffX + bLen, cy + bOffY);
      // BR
      ctx.moveTo(cx + bOffX - bLen, cy + bOffY); ctx.lineTo(cx + bOffX, cy + bOffY); ctx.lineTo(cx + bOffX, cy + bOffY - bLen);
      ctx.stroke();

      // 6. Text Layout & Dynamic Auto-Fit
      const maxTextW = 464; // Max safe inner width leaving generous 30px side padding

      if (subText.length > 0) {
        // Two-Tier Layout: Main headline + Decorative Divider + Subtitle
        const mainY = cy - 20;
        const divY = cy + 10;
        const subY = cy + 38;

        const mainFit = fitSealText(ctx, mainText, maxTextW, 44, 20, '900', '"Arial Black", Impact, sans-serif');
        ctx.font = mainFit.font;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(mainText, cx, mainY);

        // Flanking stars on Main Text ONLY if ample clearance exists (never collide!)
        if (mainFit.width + 72 <= maxTextW) {
          const starOffset = (mainFit.width / 2) + 24;
          drawSealStar(ctx, cx - starOffset, mainY, 5, 12, 6);
          drawSealStar(ctx, cx + starOffset, mainY, 5, 12, 6);
        }

        // Elegant Horizontal Divider with Center Star Badge
        const divMargin = 28;
        const lineLeft = cx - (boxHalfW - 32);
        const lineRight = cx + (boxHalfW - 32);

        drawSealStar(ctx, cx, divY, 5, 8, 4);
        drawSealStar(ctx, cx - 18, divY, 5, 5, 2.5);
        drawSealStar(ctx, cx + 18, divY, 5, 5, 2.5);

        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(lineLeft, divY);
        ctx.lineTo(cx - divMargin, divY);
        ctx.moveTo(cx + divMargin, divY);
        ctx.lineTo(lineRight, divY);
        ctx.stroke();

        // Subtitle text (auto-scaled down if needed)
        const subFit = fitSealText(ctx, subText, maxTextW - 20, 22, 13, 'bold', '"Arial Black", Arial, sans-serif');
        ctx.font = subFit.font;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(subText, cx, subY);

        // Subtitle flanking accents if space permits
        if (subFit.width + 48 <= maxTextW - 40) {
          const subStarOffset = (subFit.width / 2) + 16;
          drawSealStar(ctx, cx - subStarOffset, subY, 5, 5, 2.5);
          drawSealStar(ctx, cx + subStarOffset, subY, 5, 5, 2.5);
        }

      } else {
        // Single-Tier Layout: Prominent Single Header (Vertically Centered)
        const mainFit = fitSealText(ctx, mainText, maxTextW, 48, 22, '900', '"Arial Black", Impact, sans-serif');
        ctx.font = mainFit.font;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(mainText, cx, cy);

        // Flanking stars if space permits
        if (mainFit.width + 72 <= maxTextW) {
          const starOffset = (mainFit.width / 2) + 26;
          drawSealStar(ctx, cx - starOffset, cy, 5, 15, 7.5);
          drawSealStar(ctx, cx + starOffset, cy, 5, 15, 7.5);
        }
      }

      // 7. Upper & Lower Circular Segment Annotations
      ctx.font = 'bold 19px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('REGISTRY REF: SEC-404-J', cx, cy - 142);
      ctx.fillText('FINAL DETERMINATION: VALID', cx, cy + 142);

      // 8. Natural Rubber Stamp Distressing & Micro-Pores
      ctx.globalCompositeOperation = 'destination-out';
      for (let g = 0; g < 350; g++) {
        const gx = cx + (Math.random() - 0.5) * 920;
        const gy = cy + (Math.random() - 0.5) * 920;
        if (Math.hypot(gx - cx, gy - cy) < 460) {
          ctx.beginPath();
          ctx.arc(gx, gy, Math.random() * 2.2 + 0.5, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      ctx.restore();
      sealTexture.needsUpdate = true;
    }

    function drawArcText(ctx, text, cx, cy, radius, centerAngle, isTop, font) {
      ctx.save();
      ctx.font = font;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      let totalWidth = 0;
      for (let i = 0; i < text.length; i++) {
        totalWidth += ctx.measureText(text[i]).width + 2.5;
      }

      let totalAngle = totalWidth / radius;
      if (totalAngle > 2.50) totalAngle = 2.50; // Clamp arc span to max ~143 degrees

      const angleStep = totalAngle / Math.max(1, text.length - 1);
      const startAngle = isTop ? (centerAngle - totalAngle / 2) : (centerAngle + totalAngle / 2);

      for (let i = 0; i < text.length; i++) {
        const angle = isTop ? (startAngle + i * angleStep) : (startAngle - i * angleStep);
        ctx.save();
        ctx.translate(cx + Math.cos(angle) * radius, cy + Math.sin(angle) * radius);
        ctx.rotate(angle + (isTop ? Math.PI / 2 : -Math.PI / 2));
        ctx.fillText(text[i], 0, 0);
        ctx.restore();
      }
      ctx.restore();
    }

    function drawSealStar(ctx, cx, cy, spikes, outerRadius, innerRadius) {
      let rot = Math.PI / 2 * 3;
      let x = cx;
      let y = cy;
      const step = Math.PI / spikes;
      ctx.beginPath();
      ctx.moveTo(cx, cy - outerRadius);
      for (let i = 0; i < spikes; i++) {
        x = cx + Math.cos(rot) * outerRadius;
        y = cy + Math.sin(rot) * outerRadius;
        ctx.lineTo(x, y);
        rot += step;
        x = cx + Math.cos(rot) * innerRadius;
        y = cy + Math.sin(rot) * innerRadius;
        ctx.lineTo(x, y);
        rot += step;
      }
      ctx.lineTo(cx, cy - outerRadius);
      ctx.closePath();
      ctx.fill();
    }

    function applyColorScheme(schemeName) {
      const p = PALETTES[schemeName] || PALETTES["Original"];

      if (params.greenScreen) {
        scene.background.set(0x00ff00);
      } else {
        scene.background.set(p.desk);
      }

      materials.desk.color.set(p.desk);
      materials.blotter.color.set(p.blotter);
      materials.paper.color.set(p.paper);
      materials.topPaper.color.set(p.paper);
      materials.handle.color.set(p.handle);
      materials.metal.color.set(p.metal);
      materials.shaft.color.set(p.shaft);
      materials.spring.color.set(p.spring);
      materials.rubber.color.set(p.rubber);

      if (activeSheetMesh) {
        const tex = createFinancialLedgerTexture();
        materials.topPaper.map = tex;
        materials.topPaper.needsUpdate = true;
      }
      updateSealTexture();
    }

    // =========================================================================
    // SATISFYING AUTOMATED ANIMATION CHOREOGRAPHY
    // =========================================================================
    let clock = new THREE.Clock();
    let cycleTime = 0.0;
    let currentCycleIndex = -1;
    let sealScale = 1.0;
    let sealPulsePhase = 0;
    let hasStampedThisCycle = false;

    function updateAnimation(delta) {
      if (!paperCarriers || paperCarriers.length < 2) return;

      const speed = params.speed;
      cycleTime += delta * speed;

      let cycleDuration = 3.2;
      if (params.animationMode === "Rapid Clearance") cycleDuration = 1.8;
      if (params.animationMode === "Executive Slow Press") cycleDuration = 4.8;

      const totalCycles = cycleTime / cycleDuration;
      const cycleIndex = Math.floor(totalCycles);
      const t = totalCycles - cycleIndex; // normalized progress in [0, 1)

      const activeIdx = cycleIndex % 2;
      const restingIdx = (cycleIndex + 1) % 2;

      const activeC = paperCarriers[activeIdx];
      const restingC = paperCarriers[restingIdx];

      const yCenter = BASE_SURFACE_Y + SHEET_THICKNESS * 0.5;

      // Handle cycle turnover: smoothly resets incoming carrier and ensures outbox carrier rests with seal
      if (cycleIndex !== currentCycleIndex) {
        currentCycleIndex = cycleIndex;
        hasStampedThisCycle = false;
        sealScale = 1.0;

        // Reset active carrier at Left Inbox: PRISTINE, SEAL INVISIBLE!
        activeC.group.position.set(INBOX_X, yCenter, 0);
        activeC.group.rotation.set(0, 0, 0);
        activeC.group.visible = true;
        activeC.sealMesh.visible = false;
        activeC.sealMat.opacity = 0.0;
        activeC.sealMesh.scale.set(1.0, 1.0, 1.0);

        // Resting carrier stays at Right Outbox with approved seal displayed
        restingC.group.position.set(OUTBOX_X, yCenter, 0);
        restingC.group.rotation.set(0, 0, 0);
        restingC.group.visible = true;
        restingC.sealMesh.visible = true;
        restingC.sealMat.opacity = 1.0;
        restingC.sealMesh.scale.set(1.0, 1.0, 1.0);
      }

      // Mechanical Stamp Height References
      const apexY = PAPER_SURFACE_Y + 1.75;
      const contactY = PAPER_SURFACE_Y; // Exact contact plane, zero clipping

      let currentStampY = apexY;
      let plungerOffset = 0.0;
      let springScaleY = 1.0;

      // -----------------------------------------------------------------------
      // PHASES OF THE CYCLE:
      // 1. Infeed (0.00 - 0.24): Unstamped paper glides from Inbox (-3.4) to Center (0.0)
      // 2. Descent (0.24 - 0.38): Stamp descends to paper surface
      // 3. Impact & Imprint (0.38 - 0.52): Stamp strikes! Seal appears and pulses
      // 4. Ascent (0.52 - 0.66): Stamp lifts back to apex
      // 5. Outfeed (0.66 - 0.92): Stamped paper glides to Outbox (+3.4)
      // 6. Settle (0.92 - 1.00): Stamped paper settles on Outbox stack
      // -----------------------------------------------------------------------
      if (t < 0.24) {
        // Phase 1: Incoming sheet glides from Left Stack to Center Station
        currentStampY = apexY;
        plungerOffset = 0.0;
        springScaleY = 1.0;

        const inT = t / 0.24;
        const easeIn = inT < 0.5 ? 4 * inT * inT * inT : 1 - Math.pow(-2 * inT + 2, 3) / 2;
        const posX = THREE.MathUtils.lerp(INBOX_X, CENTER_X, easeIn);
        const lift = Math.sin(inT * Math.PI) * 0.12;
        const posY = yCenter + lift;
        const rotZ = Math.sin(inT * Math.PI) * 0.025;
        const rotY = -Math.sin(inT * Math.PI) * 0.015;

        activeC.group.position.set(posX, posY, 0);
        activeC.group.rotation.set(0, rotY, rotZ);
        activeC.group.visible = true;

        // SEAL IS STRICTLY HIDDEN!
        activeC.sealMesh.visible = false;
        activeC.sealMat.opacity = 0.0;

        // Resting paper sits on right outbox stack
        restingC.group.position.set(OUTBOX_X, yCenter, 0);
        restingC.group.rotation.set(0, 0, 0);
        restingC.group.visible = true;

      } else if (t < 0.38) {
        // Phase 2: Sheet resting centered; Stamp descends smoothly towards paper
        activeC.group.position.set(CENTER_X, yCenter, 0);
        activeC.group.rotation.set(0, 0, 0);
        activeC.group.visible = true;

        // SEAL IS STILL STRICTLY HIDDEN!
        activeC.sealMesh.visible = false;
        activeC.sealMat.opacity = 0.0;

        const downT = (t - 0.24) / 0.14;
        const easeDown = downT * downT * downT; // Accelerating mechanical drop
        currentStampY = THREE.MathUtils.lerp(apexY, contactY, easeDown);
        plungerOffset = 0.0;
        springScaleY = 1.0;

        restingC.group.position.set(OUTBOX_X, yCenter, 0);
        restingC.group.visible = true;

      } else if (t < 0.52) {
        // Phase 3: Mechanical Impact, Compression & Official Seal Imprint
        currentStampY = contactY; // Locked at exact paper plane
        const pressT = (t - 0.38) / 0.14;
        const pressCurve = Math.sin(pressT * Math.PI);
        plungerOffset = -0.22 * pressCurve;
        springScaleY = 1.0 - 0.45 * pressCurve;

        // Trigger impact stamp event on first frame of contact!
        if (!hasStampedThisCycle) {
          hasStampedThisCycle = true;
          sealScale = 1.30; // Tactile pop on impact
          sealPulsePhase = 0;
        }

        activeC.group.position.set(CENTER_X, yCenter, 0);
        activeC.group.rotation.set(0, 0, 0);
        activeC.group.visible = true;

        // SEAL APPEARS ON IMPACT!
        activeC.sealMesh.visible = true;
        activeC.sealMat.opacity = 1.0;

        sealScale = THREE.MathUtils.lerp(sealScale, 1.0, delta * 12.0);
        sealPulsePhase += delta * 4.0;
        const pulse = Math.sin(sealPulsePhase) * 0.025;
        const dynamicScale = Math.max(0.01, sealScale * (1.0 + pulse));
        activeC.sealMesh.scale.set(dynamicScale, dynamicScale, 1.0);

        restingC.group.position.set(OUTBOX_X, yCenter, 0);
        restingC.group.visible = true;

      } else if (t < 0.66) {
        // Phase 4: Stamp releases and ascends back to apex; paper dwells in center
        const upT = (t - 0.52) / 0.14;
        const easeUp = 1 - Math.pow(1 - upT, 3);
        currentStampY = THREE.MathUtils.lerp(contactY, apexY, easeUp);
        plungerOffset = THREE.MathUtils.lerp(-0.05, 0.0, easeUp);
        springScaleY = THREE.MathUtils.lerp(0.85, 1.0, easeUp);

        activeC.group.position.set(CENTER_X, yCenter, 0);
        activeC.group.rotation.set(0, 0, 0);
        activeC.group.visible = true;
        activeC.sealMesh.visible = true;
        activeC.sealMat.opacity = 1.0;

        sealScale = THREE.MathUtils.lerp(sealScale, 1.0, delta * 12.0);
        sealPulsePhase += delta * 4.0;
        const pulse = Math.sin(sealPulsePhase) * 0.025;
        const dynamicScale = Math.max(0.01, sealScale * (1.0 + pulse));
        activeC.sealMesh.scale.set(dynamicScale, dynamicScale, 1.0);

        restingC.group.position.set(OUTBOX_X, yCenter, 0);
        restingC.group.visible = true;

      } else if (t < 0.92) {
        // Phase 5: Stamped sheet smoothly glides from Center to Outbox
        currentStampY = apexY;
        plungerOffset = 0.0;
        springScaleY = 1.0;

        const outT = (t - 0.66) / 0.26;
        const easeOut = outT < 0.5 ? 4 * outT * outT * outT : 1 - Math.pow(-2 * outT + 2, 3) / 2;
        const posX = THREE.MathUtils.lerp(CENTER_X, OUTBOX_X, easeOut);
        const lift = Math.sin(outT * Math.PI) * 0.14;
        const posY = yCenter + lift;
        const rotZ = -Math.sin(outT * Math.PI) * 0.035;
        const rotY = Math.sin(outT * Math.PI) * 0.02;

        activeC.group.position.set(posX, posY, 0);
        activeC.group.rotation.set(0, rotY, rotZ);
        activeC.group.visible = true;
        activeC.sealMesh.visible = true;
        activeC.sealMat.opacity = 1.0;

        sealPulsePhase += delta * 4.0;
        const pulse = Math.sin(sealPulsePhase) * 0.025;
        activeC.sealMesh.scale.set(1.0 + pulse, 1.0 + pulse, 1.0);

        // Resting carrier stays visible at OUTBOX_X until activeC arrives to cover it
        restingC.group.position.set(OUTBOX_X, yCenter, 0);
        restingC.group.visible = (outT < 0.85);

      } else {
        // Phase 6: Sheet settles squarely on top of the Right Outbox stack
        currentStampY = apexY;
        plungerOffset = 0.0;
        springScaleY = 1.0;

        activeC.group.position.set(OUTBOX_X, yCenter, 0);
        activeC.group.rotation.set(0, 0, 0);
        activeC.group.visible = true;
        activeC.sealMesh.visible = true;
        activeC.sealMat.opacity = 1.0;
        activeC.sealMesh.scale.set(1.0, 1.0, 1.0);

        // restingC is now completely hidden beneath activeC
        restingC.group.visible = false;
      }

      stampRoot.position.y = currentStampY;
      stampPlungerGroup.position.y = plungerOffset;
      if (springMesh) {
        springMesh.scale.y = springScaleY;
      }

      updateCameraMotion(delta);
    }

    function triggerSealStampEvent() {
      sealScale = 1.30;
      updateSealTexture();
    }

    // =========================================================================
    // 8 PRECONFIGURED CAMERA MODES
    // =========================================================================
    let orbitAngle = 0;
    function updateCameraMotion(delta) {
      const mode = params.animationMode;

      if (mode === "Static (No Camera Move)") {
        return; // Fully stationary camera, perfect for manual orbit/pan/zoom
      }

      if (mode === "Inspection Cycle") {
        orbitAngle += delta * 0.15 * params.speed;
        camera.position.x = Math.sin(orbitAngle) * 1.5;
        camera.position.y = 4.2 + Math.cos(orbitAngle * 0.7) * 0.3;
        camera.position.z = 6.2 + Math.sin(orbitAngle * 0.5) * 0.4;
        controls.target.set(0.0, 0.65, 0.0);
      } else if (mode === "Orbital Inspection") {
        orbitAngle += delta * 0.25 * params.speed;
        const dist = 7.0;
        camera.position.x = Math.sin(orbitAngle) * dist;
        camera.position.z = Math.cos(orbitAngle) * dist;
        camera.position.y = 4.2 + Math.sin(orbitAngle * 0.5) * 0.4;
        controls.target.set(0.0, 0.7, 0.0);
      } else if (mode === "Desk Overview") {
        orbitAngle += delta * 0.12 * params.speed;
        camera.position.x = Math.sin(orbitAngle) * 3.8;
        camera.position.z = 6.4;
        camera.position.y = 6.0;
        controls.target.set(0.0, 0.4, 0.0);
      } else if (mode === "Close-up Seal Macro") {
        orbitAngle += delta * 0.18 * params.speed;
        camera.position.set(Math.sin(orbitAngle) * 0.8, 1.8, 2.4);
        controls.target.set(0.0, 0.4, 0.1);
      } else if (mode === "Mechanical Rhythm") {
        orbitAngle += delta * 0.22 * params.speed;
        camera.position.set(2.4 + Math.cos(orbitAngle) * 0.4, 2.0, 3.2 + Math.sin(orbitAngle) * 0.4);
        controls.target.set(0.0, 1.1, 0.0);
      } else if (mode === "Executive Slow Press") {
        orbitAngle += delta * 0.08 * params.speed;
        camera.position.set(Math.sin(orbitAngle) * 2.8, 3.4, 5.2);
        controls.target.set(0.0, 0.7, 0.0);
      } else if (mode === "Rapid Clearance") {
        orbitAngle += delta * 0.35 * params.speed;
        camera.position.set(Math.sin(orbitAngle) * 3.2, 3.0, 4.8);
        controls.target.set(0.0, 0.6, 0.0);
      }
    }

    // =========================================================================
    // EVENT LISTENERS & INTERACTION
    // =========================================================================
    let pointerDownPos = new THREE.Vector2();

    function setupEventListeners() {
      window.addEventListener('resize', onWindowResize);

      const dom = renderer.domElement;
      dom.addEventListener('pointerdown', (e) => {
        pointerDownPos.set(e.clientX, e.clientY);
      });

      dom.addEventListener('pointerup', (e) => {
        const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
        if (dist < 6 && params.clickToRandomize) {
          randomizeSceneParameters();
        }
      });

      // Press 'H' to toggle UI
      window.addEventListener('keydown', (e) => {
        if (e.key.toLowerCase() === 'h') {
          if (gui) {
            gui._hidden ? gui.show() : gui.hide();
          }
        }
      });
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      if (postProcessor) {
        postProcessor.setSize(window.innerWidth, window.innerHeight);
      }
    }

    // "when I click for random scene do not shuffle or change Postprocessing settings"
    function randomizeSceneParameters() {
      const paletteKeys = Object.keys(PALETTES);
      const randomPalette = paletteKeys[Math.floor(Math.random() * paletteKeys.length)];
      params.colorScheme = randomPalette;

      const randomText = SEAL_TEXTS[Math.floor(Math.random() * SEAL_TEXTS.length)];
      params.sealText = randomText;

      params.speed = THREE.MathUtils.randFloat(0.85, 1.35);
      params.springTurns = THREE.MathUtils.randFloat(5.0, 7.5);
      rebuildSpring();

      applyColorScheme(randomPalette);
      triggerSealStampEvent();

      // Update non-postprocessing GUI controllers only!
      if (gui) {
        gui.controllersRecursive().forEach(controller => {
          let isPostProc = false;
          let p = controller.parent;
          while (p) {
            if (p._title === 'Post-Processing Suite') {
              isPostProc = true;
              break;
            }
            p = p.parent;
          }
          if (!isPostProc) {
            controller.updateDisplay();
          }
        });
      }
    }

    // =========================================================================
    // GUI CONTROLS (Standard unstyled lil-gui)
    // =========================================================================
    let gui;
    function setupGUI() {
      gui = new GUI({ title: 'Corporate Tax Audit Controls' });

      // Visual Theme
      const themeFolder = gui.addFolder('Visual Theme');
      themeFolder.add(params, 'colorScheme', Object.keys(PALETTES)).name('Color Scheme').onChange(val => {
        applyColorScheme(val);
      });

      themeFolder.add(params, 'greenScreen').name('Green Screen (#00ff00)').onChange(val => {
        if (val) {
          scene.background.set(0x00ff00);
        } else {
          scene.background.set(PALETTES[params.colorScheme].desk);
        }
      });

      themeFolder.add(params, 'sealText', SEAL_TEXTS).name('Seal Inscription').onChange(() => {
        updateSealTexture();
        sealScale = 1.30;
      });

      guiAntialiasController = themeFolder.add(params, 'antialiasMode', ANTIALIAS_MODES).name('Antialiasing').onChange(val => {
        setAntialiasMode(val);
      });

      themeFolder.add(params, 'dpr', 0.5, 3.0, 0.1).name('Pixel Ratio (DPR)').onChange(val => {
        renderer.setPixelRatio(val);
        if (postProcessor) postProcessor.setSize(window.innerWidth, window.innerHeight);
      });

      // Animation & Interaction
      const animFolder = gui.addFolder('Animation');
      animFolder.add(params, 'animationMode', ANIMATION_MODES).name('Camera / Mode');
      animFolder.add(params, 'speed', 0.1, 3.0, 0.05).name('Speed Multiplier');
      animFolder.add(params, 'clickToRandomize').name('Click Scene to Randomize');
      animFolder.add({ randomize: randomizeSceneParameters }, 'randomize').name('⚡ Randomize Theme Now');

      // Lighting & Exposure
      const lightFolder = gui.addFolder('Scene Lighting & Exposure');
      lightFolder.add(params, 'exposure', 0.1, 3.0, 0.05).name('Tone Exposure').onChange(val => {
        renderer.toneMappingExposure = val;
        if (postProcessor) postProcessor.settings.exposure = val;
      });
      lightFolder.add(params, 'sceneLightIntensity', 0.1, 3.0, 0.05).name('Global Intensity').onChange(updateLightIntensities);

      const ambSub = lightFolder.addFolder('Ambient Light');
      ambSub.add(params, 'ambientIntensity', 0.0, 2.0, 0.05).name('Intensity').onChange(updateLightIntensities);
      ambSub.addColor(params, 'ambientColor').name('Color').onChange(c => ambientLight.color.set(c));

      const keySub = lightFolder.addFolder('Key Directional Light');
      keySub.add(params, 'keyIntensity', 0.0, 4.0, 0.1).name('Intensity').onChange(updateLightIntensities);
      keySub.addColor(params, 'keyColor').name('Color').onChange(c => keyLight.color.set(c));
      keySub.add(params, 'keyPosY', 2, 14, 0.5).name('Elevation').onChange(v => keyLight.position.y = v);
      keySub.add(params, 'keyPosX', -10, 10, 0.5).name('Position X').onChange(v => keyLight.position.x = v);

      const fillSub = lightFolder.addFolder('Fill Light');
      fillSub.add(params, 'fillIntensity', 0.0, 3.0, 0.1).name('Intensity').onChange(updateLightIntensities);
      fillSub.addColor(params, 'fillColor').name('Color').onChange(c => fillLight.color.set(c));

      const spotSub = lightFolder.addFolder('Desk Spot Light');
      spotSub.add(params, 'spotIntensity', 0.0, 5.0, 0.1).name('Intensity').onChange(updateLightIntensities);
      spotSub.addColor(params, 'spotColor').name('Color').onChange(c => deskSpot.color.set(c));

      // Stamp Mechanics
      const mechFolder = gui.addFolder('Stamp Mechanics');
      mechFolder.add(params, 'springTurns', 4.0, 9.0, 0.5).name('Spring Turns').onChange(rebuildSpring);

      // Post-Processing Suite Integration
      if (postProcessor) {
        postProcessor.attachGUI(gui, 'Post-Processing Suite');
      }
    }

    function updateLightIntensities() {
      ambientLight.intensity = params.ambientIntensity * params.sceneLightIntensity;
      keyLight.intensity = params.keyIntensity * params.sceneLightIntensity;
      fillLight.intensity = params.fillIntensity * params.sceneLightIntensity;
      deskSpot.intensity = params.spotIntensity * params.sceneLightIntensity;
    }

    // =========================================================================
    // MAIN LOOP
    // =========================================================================
    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      updateAnimation(delta);
      controls.update();

      if (postProcessor) {
        postProcessor.renderScene(scene, camera);
      } else {
        renderer.render(scene, camera);
      }
    }

    init();
    animate();
  </script>
