<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wagasa</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      position: relative;
      overflow: hidden;
      background: #000;
      user-select: none;
      -webkit-user-select: none;
    }

    canvas#canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }
  </style>
</head>
<body>
  <canvas id="canvas">Canvas not supported.</canvas>

  <script type="module">
    import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

    (function () {
      'use strict';

      const canvas = document.getElementById('canvas');
      if (!canvas || !canvas.getContext) return;

      const ctx = canvas.getContext('2d');
      let X = canvas.width = window.innerWidth;
      let Y = canvas.height = window.innerHeight;

      function rand(min, max) {
        return Math.floor(Math.random() * (max - min + 1) + min);
      }

      // 19 Preconfigured Color Schemes
      const SCHEMES = {
        'Original': {
          bg: '#FCFAEE',
          colors: ['#4D799B', '#F8D7CD', '#B1C9B3', '#4D799B', '#F8D7CD'],
          spoke: '#FFFFFF',
          pattern: '#FCFAEE'
        },
        'Monochromatic': {
          bg: '#0F1D2A',
          colors: ['#1D3557', '#457B9D', '#A8DADC', '#2A4D69', '#639FAB'],
          spoke: '#FFFFFF',
          pattern: '#A8DADC'
        },
        'Analogous': {
          bg: '#260D0D',
          colors: ['#E63946', '#F4A261', '#E76F51', '#D62828', '#FFB703'],
          spoke: '#FFFFFF',
          pattern: '#FFB703'
        },
        'Complementary': {
          bg: '#0E1A24',
          colors: ['#1D3557', '#F4A261', '#2A9D8F', '#E76F51', '#457B9D'],
          spoke: '#FFFFFF',
          pattern: '#F4A261'
        },
        'Split-complementary': {
          bg: '#111923',
          colors: ['#1F3A52', '#E07A5F', '#F2CC8F', '#3D5A80', '#EE8959'],
          spoke: '#FFFFFF',
          pattern: '#F2CC8F'
        },
        'Triadic': {
          bg: '#161622',
          colors: ['#E63946', '#2A9D8F', '#457B9D', '#F4A261', '#588157'],
          spoke: '#FFFFFF',
          pattern: '#2A9D8F'
        },
        'Tetradic': {
          bg: '#15181F',
          colors: ['#C1121F', '#669BBC', '#003049', '#780000', '#FDF0D5'],
          spoke: '#FFFFFF',
          pattern: '#669BBC'
        },
        'Double split-complementary': {
          bg: '#1C1024',
          colors: ['#5F0F40', '#9A031E', '#FB8B24', '#0F4C5C', '#E36414'],
          spoke: '#FFFFFF',
          pattern: '#FB8B24'
        },
        'Achromatic (black and white version, white and black)': {
          bg: '#121212',
          colors: ['#000000', '#FFFFFF', '#888888', '#333333', '#DDDDDD'],
          spoke: '#EEEEEE',
          pattern: '#777777'
        },
        'Achromatic + Accent (black and white + red, white and black + red)': {
          bg: '#141414',
          colors: ['#000000', '#FFFFFF', '#FF0033', '#888888', '#CC0029'],
          spoke: '#FFFFFF',
          pattern: '#FF0033'
        },
        'Neutral + accent': {
          bg: '#F4F1DE',
          colors: ['#3D405B', '#81B29A', '#E07A5F', '#D4A373', '#F2CC8F'],
          spoke: '#FFFFFF',
          pattern: '#E07A5F'
        },
        'Palette: (F6AA1C, BC3908, 941B0C, F6AA1C, 220901)': {
          bg: '#220901',
          colors: ['#F6AA1C', '#BC3908', '#941B0C', '#F6AA1C', '#220901'],
          spoke: '#FFFFFF',
          pattern: '#F6AA1C'
        },
        'Palette: (63D1CF, 5BC0BE, 4BAD9E, 4BAD9E, 0B132B, 000000)': {
          bg: '#0B132B',
          colors: ['#63D1CF', '#5BC0BE', '#4BAD9E', '#4BAD9E', '#000000'],
          spoke: '#FFFFFF',
          pattern: '#63D1CF'
        },
        'Palette: (AA60C8, D69ADE, C9A3C6, CFB5C2, 0D001D, 120A12)': {
          bg: '#0D001D',
          colors: ['#AA60C8', '#D69ADE', '#C9A3C6', '#CFB5C2', '#120A12'],
          spoke: '#FFFFFF',
          pattern: '#D69ADE'
        },
        'Palette: (FEF1BE, FFBA00, 008189, 00474D, 061210)': {
          bg: '#061210',
          colors: ['#FEF1BE', '#FFBA00', '#008189', '#00474D', '#FEF1BE'],
          spoke: '#FFFFFF',
          pattern: '#FFBA00'
        },
        'Palette: (D4FFB0, 7FFF00, 00B894, 0A3322, 05140A)': {
          bg: '#05140A',
          colors: ['#D4FFB0', '#7FFF00', '#00B894', '#0A3322', '#D4FFB0'],
          spoke: '#FFFFFF',
          pattern: '#7FFF00'
        },
        'Palette: (FFE8CC, FF8C00, C7501A, 3D1050, 0E0618)': {
          bg: '#0E0618',
          colors: ['#FFE8CC', '#FF8C00', '#C7501A', '#3D1050', '#FFE8CC'],
          spoke: '#FFFFFF',
          pattern: '#FF8C00'
        },
        'Palette: (E8E0FF, B38FFF, 6A3DE8, 1A1250, 090612)': {
          bg: '#090612',
          colors: ['#E8E0FF', '#B38FFF', '#6A3DE8', '#1A1250', '#E8E0FF'],
          spoke: '#FFFFFF',
          pattern: '#B38FFF'
        },
        'Palette: (E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)': {
          bg: '#05020F',
          colors: ['#E0FBFF', '#00F0FF', '#D40078', '#1E0A3D', '#E0FBFF'],
          spoke: '#FFFFFF',
          pattern: '#00F0FF'
        }
      };

      const SCHEME_KEYS = Object.keys(SCHEMES);

      // Simulation Parameters
      const params = {
        // Theme & Colors
        scheme: 'Original',
        greenScreen: false,
        bgColor: SCHEMES['Original'].bg,
        color1: SCHEMES['Original'].colors[0],
        color2: SCHEMES['Original'].colors[1],
        color3: SCHEMES['Original'].colors[2],
        color4: SCHEMES['Original'].colors[3],
        color5: SCHEMES['Original'].colors[4],
        spokeColor: SCHEMES['Original'].spoke,
        patternColor: SCHEMES['Original'].pattern,

        // View & Navigation
        zoom: 1.0,
        panX: 0,
        panY: 0,
        dragMode: 'Auto (Shape or Pan)',

        // Geometry
        spokesCount: 36,
        spokeLineWidth: 1.0,
        minRadius: 50,
        maxRadius: 200,
        growthSpeed: 0.5,
        maxShapes: 30,
        spawnRate: 0.05,

        // Motion
        rotationSpeed: 1.0,
        oscillationAmp: 1.0,

        // Confetti
        confettiEnabled: true,
        confettiCount: 200,
        confettiSpeed: 1.0,
        confettiSize: 1.0,

        // Interactivity
        clickToRandomize: true
      };

      let shapes = [];
      let confettis = [];

      function getActiveColors() {
        return [params.color1, params.color2, params.color3, params.color4, params.color5].filter(Boolean);
      }

      function recolorAllElements() {
        const activeColors = getActiveColors();
        for (let i = 0; i < shapes.length; i++) {
          shapes[i].c = activeColors[rand(0, activeColors.length - 1)];
        }
        for (let i = 0; i < confettis.length; i++) {
          confettis[i].c = activeColors[rand(0, activeColors.length - 1)];
        }
      }

      function applyScheme(schemeName) {
        const s = SCHEMES[schemeName];
        if (!s) return;
        params.scheme = schemeName;
        params.bgColor = s.bg;
        params.color1 = s.colors[0];
        params.color2 = s.colors[1];
        params.color3 = s.colors[2];
        params.color4 = s.colors[3];
        params.color5 = s.colors[4];
        params.spokeColor = s.spoke;
        params.patternColor = s.pattern;

        recolorAllElements();
        updateAllGuiDisplays();
      }

      /********************
        Shape (Wagasa)
      ********************/
      function Shape(context, x, y, r) {
        this.ctx = context;
        this.init(x, y, r);
      }

      Shape.prototype.init = function(x, y, r) {
        this.x = x;
        this.y = y;
        this.r = 1;
        this.ri = r;
        const activeColors = getActiveColors();
        this.c = activeColors[rand(0, activeColors.length - 1)];
        this.num = rand(0, 2);
        this.a = rand(0, 360);
        this.rad = this.a * Math.PI / 180;
        this.random = Math.random();
      };

      Shape.prototype.draw = function() {
        const c = this.ctx;
        c.save();
        c.fillStyle = this.c;
        c.lineWidth = Math.max(0.5, (this.r / 100) * params.spokeLineWidth);
        c.strokeStyle = params.spokeColor;
        c.translate(this.x, this.y);
        c.rotate(Math.sin(Math.sin(this.rad)) * params.oscillationAmp);
        c.translate(-this.x, -this.y);

        const segments = Math.max(6, Math.floor(params.spokesCount));
        const segRad = (Math.PI * 2) / segments;

        c.beginPath();
        for (let i = 0; i < segments; i++) {
          const px = Math.cos(segRad * i) * this.r + this.x;
          const py = Math.sin(segRad * i) * this.r + this.y;
          if (i === 0) {
            c.moveTo(px, py);
          } else {
            c.lineTo(px, py);
          }
        }
        c.closePath();
        c.fill();
        c.stroke();

        for (let i = 0; i < segments; i++) {
          const px = Math.cos(segRad * i) * this.r * 1.01 + this.x;
          const py = Math.sin(segRad * i) * this.r * 1.01 + this.y;
          c.beginPath();
          c.moveTo(this.x, this.y);
          c.lineTo(px, py);
          c.stroke();
        }

        c.strokeStyle = params.patternColor;
        switch (this.num) {
          case 0:
            this.drawCircle();
            break;
          case 1:
            this.doubleCircle();
            break;
          default:
            break;
        }
        c.restore();
      };

      Shape.prototype.drawCircle = function() {
        this.ctx.lineWidth = Math.max(0.5, (this.r / 5) * params.spokeLineWidth);
        this.ctx.beginPath();
        this.ctx.arc(this.x, this.y, this.r / 2, 0, Math.PI * 2, false);
        this.ctx.stroke();
      };

      Shape.prototype.doubleCircle = function() {
        for (let i = 2; i < 4; i++) {
          this.ctx.lineWidth = Math.max(0.5, (this.r / i / 5) * params.spokeLineWidth);
          this.ctx.beginPath();
          this.ctx.arc(this.x, this.y, this.r / i, 0, Math.PI * 2, false);
          this.ctx.stroke();
        }
      };

      Shape.prototype.updateParams = function(i) {
        if (i % 2 === 0) this.a += this.random * params.rotationSpeed;
        if (i % 2 !== 0) this.a -= this.random * params.rotationSpeed;
        if (this.r < this.ri) this.r += params.growthSpeed;
        this.rad = this.a * Math.PI / 180;
      };

      Shape.prototype.render = function(i) {
        this.updateParams(i);
        this.draw();
      };

      function addShape() {
        if (shapes.length >= params.maxShapes) return;
        if (Math.random() > params.spawnRate) return;

        let overlap = false;
        const setX = rand(0, X);
        const setY = rand(0, Y);
        let setR;
        if (Math.random() < 0.3) {
          setR = rand(params.minRadius, Math.min(params.minRadius + 20, params.maxRadius));
        } else {
          setR = rand(params.minRadius + 30, params.maxRadius);
        }

        for (let i = 0; i < shapes.length; i++) {
          const dx = Math.abs(setX - shapes[i].x);
          const dy = Math.abs(setY - shapes[i].y);
          const dist = Math.floor(Math.sqrt(dx * dx + dy * dy));
          if (dist < setR + shapes[i].ri / 2) {
            overlap = true;
            break;
          }
        }
        if (overlap) return;

        const s = new Shape(ctx, setX, setY, setR);
        shapes.push(s);
      }

      function clearShapes() {
        shapes = [];
        for (let i = 0; i < 2; i++) {
          shapes.push(new Shape(ctx, rand(0, X), rand(0, Y), rand(params.minRadius, params.maxRadius)));
        }
      }

      /********************
        Confetti
      ********************/
      function Confetti(context, x, y) {
        this.ctx = context;
        this.init(x, y);
      }

      Confetti.prototype.init = function(x, y) {
        this.x = x;
        this.y = y;
        this.baseR = rand(5, 15);
        const activeColors = getActiveColors();
        this.c = activeColors[rand(0, activeColors.length - 1)];
        this.a = rand(0, 360);
        this.rad = this.a * Math.PI / 180;
        this.baseVx = rand(-1, 1) * Math.random();
        this.baseVy = Math.random() + Math.random();
      };

      Confetti.prototype.draw = function() {
        const c = this.ctx;
        const size = this.baseR * params.confettiSize;
        c.save();
        c.fillStyle = this.c;
        c.translate(this.x + size / 2, this.y + size / 2);
        c.rotate(this.rad);
        c.scale(Math.cos(this.rad * 7), Math.sin(this.rad * 3));
        c.translate(-this.x - size / 2, -this.y - size / 2);
        c.fillRect(this.x, this.y, size, size);
        c.restore();
      };

      Confetti.prototype.updateParams = function(i) {
        if (i % 2 === 0) this.a += params.rotationSpeed;
        if (i % 2 !== 0) this.a -= params.rotationSpeed;
        this.rad = this.a * Math.PI / 180;
      };

      Confetti.prototype.updatePosition = function() {
        this.x += this.baseVx * params.confettiSpeed;
        this.y += this.baseVy * params.confettiSpeed;
      };

      Confetti.prototype.wrapPosition = function() {
        const size = this.baseR * params.confettiSize;
        if (this.y > Y + size) {
          this.y = 0 - size;
          this.x = rand(0, X);
        }
      };

      Confetti.prototype.render = function(i) {
        this.updateParams(i);
        this.updatePosition();
        this.wrapPosition();
        this.draw();
      };

      function updateConfettiCount() {
        const activeColors = getActiveColors();
        while (confettis.length < params.confettiCount) {
          const c = new Confetti(ctx, rand(0, X), rand(-Y, 0));
          confettis.push(c);
        }
        while (confettis.length > params.confettiCount) {
          confettis.pop();
        }
      }

      // Initial elements
      for (let i = 0; i < 2; i++) {
        shapes.push(new Shape(ctx, rand(0, X), rand(0, Y), rand(params.minRadius, params.maxRadius)));
      }
      updateConfettiCount();

      /********************
        Render Loop
      ********************/
      function render() {
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.fillStyle = params.greenScreen ? '#00ff00' : params.bgColor;
        ctx.fillRect(0, 0, X, Y);
        ctx.restore();

        ctx.save();
        ctx.translate(params.panX, params.panY);
        ctx.scale(params.zoom, params.zoom);

        for (let i = 0; i < shapes.length; i++) {
          shapes[i].render(i);
        }

        if (params.confettiEnabled) {
          for (let i = 0; i < confettis.length; i++) {
            confettis[i].render(i);
          }
        }
        ctx.restore();

        addShape();
        requestAnimationFrame(render);
      }

      render();

      /********************
        Procedural Variation
      ********************/
      function randomizeScene() {
        const randomKey = SCHEME_KEYS[rand(0, SCHEME_KEYS.length - 1)];
        const s = SCHEMES[randomKey];

        params.scheme = randomKey;
        params.bgColor = s.bg;
        params.color1 = s.colors[0];
        params.color2 = s.colors[1];
        params.color3 = s.colors[2];
        params.color4 = s.colors[3];
        params.color5 = s.colors[4];
        params.spokeColor = s.spoke;
        params.patternColor = s.pattern;

        const spokeCounts = [18, 24, 30, 36, 42, 48, 60];
        params.spokesCount = spokeCounts[rand(0, spokeCounts.length - 1)];
        params.spokeLineWidth = parseFloat((0.4 + Math.random() * 2.0).toFixed(1));
        params.minRadius = rand(25, 60);
        params.maxRadius = rand(120, 280);
        params.growthSpeed = parseFloat((0.2 + Math.random() * 1.4).toFixed(1));
        params.rotationSpeed = parseFloat((0.4 + Math.random() * 2.6).toFixed(1));
        params.oscillationAmp = parseFloat((0.4 + Math.random() * 2.0).toFixed(1));
        params.confettiSpeed = parseFloat((0.5 + Math.random() * 2.5).toFixed(1));
        params.confettiSize = parseFloat((0.6 + Math.random() * 1.6).toFixed(1));
        params.confettiCount = rand(80, 350);

        recolorAllElements();
        updateConfettiCount();
        updateAllGuiDisplays();
      }

      function resetView() {
        params.zoom = 1.0;
        params.panX = 0;
        params.panY = 0;
        updateAllGuiDisplays();
      }

      /********************
        Interactivity: Pan, Zoom & Drag
      ********************/
      let isPointerDown = false;
      let startX = 0;
      let startY = 0;
      let hasDragged = false;
      let draggedShape = null;
      let shapeDragOffset = { x: 0, y: 0 };

      function getCanvasCoords(e) {
        const rect = canvas.getBoundingClientRect();
        return {
          x: e.clientX - rect.left,
          y: e.clientY - rect.top
        };
      }

      function screenToWorld(sx, sy) {
        return {
          x: (sx - params.panX) / params.zoom,
          y: (sy - params.panY) / params.zoom
        };
      }

      canvas.addEventListener('pointerdown', (e) => {
        if (e.button !== 0 && e.button !== 1) return;
        isPointerDown = true;
        hasDragged = false;
        startX = e.clientX;
        startY = e.clientY;

        const pt = getCanvasCoords(e);
        const worldPt = screenToWorld(pt.x, pt.y);

        draggedShape = null;
        if (params.dragMode !== 'Pan View') {
          for (let i = shapes.length - 1; i >= 0; i--) {
            const s = shapes[i];
            const dist = Math.hypot(worldPt.x - s.x, worldPt.y - s.y);
            if (dist <= Math.max(s.r, 25)) {
              draggedShape = s;
              shapeDragOffset.x = s.x - worldPt.x;
              shapeDragOffset.y = s.y - worldPt.y;
              shapes.splice(i, 1);
              shapes.push(s);
              break;
            }
          }
        }

        try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
      });

      canvas.addEventListener('pointermove', (e) => {
        if (!isPointerDown) {
          const pt = getCanvasCoords(e);
          const worldPt = screenToWorld(pt.x, pt.y);
          let hoveringShape = false;
          for (let i = shapes.length - 1; i >= 0; i--) {
            if (Math.hypot(worldPt.x - shapes[i].x, worldPt.y - shapes[i].y) <= Math.max(shapes[i].r, 25)) {
              hoveringShape = true;
              break;
            }
          }
          canvas.style.cursor = hoveringShape ? 'grab' : 'default';
          return;
        }

        const moveDist = Math.hypot(e.clientX - startX, e.clientY - startY);
        if (moveDist > 4) {
          hasDragged = true;
        }

        if (hasDragged) {
          canvas.style.cursor = 'grabbing';
          if (draggedShape && params.dragMode !== 'Pan View') {
            const pt = getCanvasCoords(e);
            const worldPt = screenToWorld(pt.x, pt.y);
            draggedShape.x = worldPt.x + shapeDragOffset.x;
            draggedShape.y = worldPt.y + shapeDragOffset.y;
          } else {
            params.panX += e.movementX;
            params.panY += e.movementY;
            updateAllGuiDisplays();
          }
        }
      });

      canvas.addEventListener('pointerup', (e) => {
        if (!isPointerDown) return;
        isPointerDown = false;
        try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}

        if (!hasDragged) {
          if (params.clickToRandomize) {
            randomizeScene();
          }
        }
        draggedShape = null;
        canvas.style.cursor = 'default';
      });

      canvas.addEventListener('pointercancel', () => {
        isPointerDown = false;
        draggedShape = null;
        canvas.style.cursor = 'default';
      });

      // Zoom with wheel centered at cursor
      canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
        const newZoom = Math.min(Math.max(params.zoom * zoomFactor, 0.1), 10.0);

        const mouseX = e.clientX;
        const mouseY = e.clientY;

        params.panX = mouseX - (mouseX - params.panX) * (newZoom / params.zoom);
        params.panY = mouseY - (mouseY - params.panY) * (newZoom / params.zoom);
        params.zoom = newZoom;

        updateAllGuiDisplays();
      }, { passive: false });

      /********************
        lil-gui Controls
      ********************/
      const gui = new GUI({ title: 'Wagasa Controls' });

      function updateAllGuiDisplays(targetGui = gui) {
        if (!targetGui) return;
        if (typeof targetGui.controllersRecursive === 'function') {
          targetGui.controllersRecursive().forEach(c => c.updateDisplay());
          return;
        }
        if (targetGui.controllers) {
          targetGui.controllers.forEach(c => c.updateDisplay());
        }
        if (targetGui.folders) {
          targetGui.folders.forEach(f => updateAllGuiDisplays(f));
        }
      }

      // Theme & Color Folder
      const themeFolder = gui.addFolder('Theme & Colors');
      themeFolder.add(params, 'scheme', SCHEME_KEYS).name('Color Scheme').onChange(applyScheme);
      themeFolder.add(params, 'greenScreen').name('Green Screen (#00ff00)');
      themeFolder.addColor(params, 'bgColor').name('Background Color');
      themeFolder.addColor(params, 'color1').name('Color 1').onChange(recolorAllElements);
      themeFolder.addColor(params, 'color2').name('Color 2').onChange(recolorAllElements);
      themeFolder.addColor(params, 'color3').name('Color 3').onChange(recolorAllElements);
      themeFolder.addColor(params, 'color4').name('Color 4').onChange(recolorAllElements);
      themeFolder.addColor(params, 'color5').name('Color 5').onChange(recolorAllElements);
      themeFolder.addColor(params, 'spokeColor').name('Spoke / Outline');
      themeFolder.addColor(params, 'patternColor').name('Pattern Ring');

      // View & Navigation Folder
      const viewFolder = gui.addFolder('View & Navigation');
      viewFolder.add(params, 'zoom', 0.1, 5.0, 0.01).name('Zoom');
      viewFolder.add(params, 'panX', -2000, 2000, 1).name('Pan X');
      viewFolder.add(params, 'panY', -2000, 2000, 1).name('Pan Y');
      viewFolder.add(params, 'dragMode', ['Auto (Shape or Pan)', 'Pan View', 'Drag Shapes']).name('Drag Target');
      viewFolder.add({ resetView }, 'resetView').name('Reset View');

      // Umbrella Geometry Folder
      const geomFolder = gui.addFolder('Umbrella Geometry');
      geomFolder.add(params, 'spokesCount', 12, 72, 2).name('Spokes Count');
      geomFolder.add(params, 'spokeLineWidth', 0.2, 5.0, 0.1).name('Spoke Line Width');
      geomFolder.add(params, 'minRadius', 15, 120, 1).name('Min Radius');
      geomFolder.add(params, 'maxRadius', 60, 400, 1).name('Max Radius');
      geomFolder.add(params, 'growthSpeed', 0.1, 3.0, 0.1).name('Growth Speed');
      geomFolder.add(params, 'maxShapes', 5, 80, 1).name('Max Umbrellas');
      geomFolder.add(params, 'spawnRate', 0.01, 0.3, 0.01).name('Spawn Rate');
      geomFolder.add({ clearShapes }, 'clearShapes').name('Clear Umbrellas');

      // Motion & Dynamics Folder
      const motionFolder = gui.addFolder('Motion & Dynamics');
      motionFolder.add(params, 'rotationSpeed', 0.0, 5.0, 0.1).name('Rotation Speed');
      motionFolder.add(params, 'oscillationAmp', 0.0, 3.0, 0.1).name('Oscillation Wave');

      // Confetti Folder
      const confettiFolder = gui.addFolder('Confetti Petals');
      confettiFolder.add(params, 'confettiEnabled').name('Show Confetti');
      confettiFolder.add(params, 'confettiCount', 0, 500, 10).name('Confetti Count').onChange(updateConfettiCount);
      confettiFolder.add(params, 'confettiSpeed', 0.1, 4.0, 0.1).name('Confetti Speed');
      confettiFolder.add(params, 'confettiSize', 0.3, 3.0, 0.1).name('Confetti Size');

      // Procedural Variation Folder
      const varFolder = gui.addFolder('Procedural Variation');
      varFolder.add(params, 'clickToRandomize').name('Click Scene: Randomize');
      varFolder.add({ randomizeScene }, 'randomizeScene').name('Randomize Now');

      /********************
        Keyboard Shortcut 'H'
      ********************/
      window.addEventListener('keydown', (e) => {
        if (e.key === 'h' || e.key === 'H') {
          if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) return;
          if (typeof gui.show === 'function' && typeof gui.hide === 'function') {
            if (gui._hidden) {
              gui.show();
            } else {
              gui.hide();
            }
          } else {
            gui.domElement.style.display = (gui.domElement.style.display === 'none') ? '' : 'none';
          }
        }
      });

      /********************
        Resize Event
      ********************/
      function onResize() {
        X = canvas.width = window.innerWidth;
        Y = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', onResize);

    })();
  </script>
</body>
</html>
