<script type="module">

    },

    },

    },

    },
    'Palette 3 (AA60C8, D69ADE, C9A3C6, CFB5C2, 0D001D, 120A12)': {

    },
    'Palette 4 (FEF1BE, FFBA00, 008189, 00474D, 061210)': {

    },
    'Palette 5 (D4FFB0, 7FFF00, 00B894, 0A3322, 05140A)': {

    },
    'Palette 8 (E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)': {
        pink: '#D40078', cyan: '#00F0FF', shadow: '#1E0A3D', highlight: '#E0FBFF', background: '#05020F'
    }
};

const ANIMATION_PRESETS = [
    'Static (No Camera Movement)',
    'Gentle Floating Sway',
    'Slow Horizon Orbit',
    'Breathing Dolly Flow',
    'Low-Angle Ridge Glide',
    'Elevated Aerial Survey',
    'Figure-8 Lissajous Drift',
    'Cinematic Diagonal Arc'
];

const DEFAULTS = {
    colorScheme: 'Original',
    greenScreen: false,
    clickRandomize: true,

    animationPreset: 'Static (No Camera Movement)',
    speed: 0.65,
    paused: false,

    amplitude: 0.3,
    folds: 1.22,
    detail: 0.04,

    iridescence: 1.0,
    gloss: 0.72,

    exposure: 1.0,
    lightIntensity: 1.0,
    keyLightIntensity: 1.0,
    keyLightColor: '#ffffff',
    rimLightIntensity: 1.0,
    rimLightColor: '#e0e8ff',
    studioIntensity: 1.0,
    ambientIntensity: 1.0,

    pink: '#052fff',
    cyan: '#00ccff',
    shadow: '#727899',
    highlight: '#f0f5ff',
    background: '#d6edff',

    camPosX: 0.0,
    camPosY: 9.93,
    camPosZ: 12.8,
    targetX: 0.0,
    targetY: -0.3,
    targetZ: -1.0,
    fov: 40,
    zoom: 0.8,

    antialias: true,
    dpr: 1.5,
    fps: 60
};

const settings = { ...DEFAULTS };

let renderer = new THREE.WebGLRenderer({ antialias: settings.antialias, powerPreference: 'high-performance' });
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(settings.background);

const camera = new THREE.PerspectiveCamera(settings.fov, window.innerWidth / window.innerHeight, 0.1, 70);

const uniforms = {
    uTime: { value: 0 },
    uAmplitude: { value: settings.amplitude },
    uFolds: { value: settings.folds },
    uDetail: { value: settings.detail },
    uIridescence: { value: settings.iridescence },
    uGloss: { value: settings.gloss },
    uExposure: { value: settings.exposure },
    uLightIntensity: { value: settings.lightIntensity },
    uKeyLightIntensity: { value: settings.keyLightIntensity },
    uRimLightIntensity: { value: settings.rimLightIntensity },
    uStudioIntensity: { value: settings.studioIntensity },
    uAmbientIntensity: { value: settings.ambientIntensity },
    uPink: { value: new THREE.Color(settings.pink) },
    uCyan: { value: new THREE.Color(settings.cyan) },
    uShadow: { value: new THREE.Color(settings.shadow) },
    uHighlight: { value: new THREE.Color(settings.highlight) },
    uKeyLightColor: { value: new THREE.Color(settings.keyLightColor) },
    uRimLightColor: { value: new THREE.Color(settings.rimLightColor) }
};

const vertexShader = `
uniform float uTime, uAmplitude, uFolds, uDetail;
attribute vec2 profileTangent;
varying vec3 vWorld;
varying vec3 vNormal;
varying vec2 vFabric;
varying float vHeight;

void main() {
    float x = position.x;
    float z = position.y / uFolds;
    float y = position.z;
    float t = 0.0;
    float center = 2.2 + 1.3 * sin(z * 1.1 - t * 0.45);
    float centerZ = 1.43 * cos(z * 1.1 - t * 0.45);
    float d = (x - center) / 3.2;
    float lift = exp(-d * d);
    float a = x * 0.62 + z * 1.24 - t * 0.48;
    float stretch = uAmplitude * (0.8 + 1.3 * lift + 0.3 * sin(a));
    float stretchX = uAmplitude * (-2.6 * d * lift / 3.2 + 0.186 * cos(a));
    float stretchZ = uAmplitude * (2.6 * d * lift * centerZ / 3.2 + 0.372 * cos(a));
    float billow = 0.3 * sin(x * 0.3 + z * 0.22 - t * 0.38);
    float billowX = 0.09 * cos(x * 0.3 + z * 0.22 - t * 0.38);
    float billowZ = 0.066 * cos(x * 0.3 + z * 0.22 - t * 0.38);
    float wrinklePhase = z * 8.0 + x * 0.32 - t * 0.36;
    float wrinkle = 0.065 * uDetail * sin(wrinklePhase);
    float wrinkleX = 0.0208 * uDetail * cos(wrinklePhase);
    float wrinkleZ = 0.52 * uDetail * cos(wrinklePhase);
    float tilt = 0.25 + 0.13 * sin(x * 0.35 - t * 0.3);
    float tiltX = 0.0455 * cos(x * 0.35 - t * 0.3);
    float sweep = 0.8 * sin(x * 0.58 + z * 0.85 - t * 0.3);
    float sweepX = 0.464 * cos(x * 0.58 + z * 0.85 - t * 0.3);
    float sweepZ = 0.68 * cos(x * 0.58 + z * 0.85 - t * 0.3);
    float height = y * stretch + billow + wrinkle;
    float heightX = y * stretchX + billowX + wrinkleX;
    vec3 point = vec3(x, height, z + height * tilt + sweep + 0.38 * x);
    float dz = profileTangent.x / uFolds;
    float dy = profileTangent.y;
    vec3 tangent = vec3(1.0, heightX, height * tiltX + heightX * tilt + sweepX + 0.38);
    float heightV = dy * stretch + (y * stretchZ + billowZ + wrinkleZ) * dz;
    vec3 bitangent = vec3(0.0, heightV, dz * (1.0 + sweepZ) + heightV * tilt);
    float curlPhase = height * 1.5 + t * 0.22;
    float curlSlope = 0.825 * cos(curlPhase) - 0.2;
    point.x += 0.55 * sin(curlPhase) - 0.2 * height;
    tangent.x += curlSlope * heightX;
    bitangent.x = curlSlope * heightV;

    float q = point.x - uTime * 1.3;
    float phase1 = q * 0.58 + point.z * 0.12;
    float phase2 = q * 1.13 - point.z * 0.19 + 0.8;
    float phase3 = q * 2.25 + point.z * 0.23 + 1.7;
    float fine = 0.016 * uDetail;

    float windY = 0.36 * sin(phase1) + 0.085 * sin(phase2)
                + fine * sin(phase3);
    float windYX = 0.2088 * cos(phase1) + 0.09605 * cos(phase2)
                 + fine * 2.25 * cos(phase3);
    float windYZ = 0.0432 * cos(phase1) - 0.01615 * cos(phase2)
                 + fine * 0.23 * cos(phase3);
    float windZ = 0.09 * sin(phase1 - 0.55);
    float windZX = 0.0522 * cos(phase1 - 0.55);
    float windZZ = 0.0108 * cos(phase1 - 0.55);

    tangent += vec3(0.0,
        windYX * tangent.x + windYZ * tangent.z,
        windZX * tangent.x + windZZ * tangent.z);
    bitangent += vec3(0.0,
        windYX * bitangent.x + windYZ * bitangent.z,
        windZX * bitangent.x + windZZ * bitangent.z);
    point.y += windY;
    point.z += windZ;

    vec3 objectNormal = cross(bitangent, tangent);
    vNormal = normalize(mat3(modelMatrix) * objectNormal);
    vec4 worldPos = modelMatrix * vec4(point, 1.0);
    vWorld = worldPos.xyz;
    vFabric = vec2(x, z);
    vHeight = y;
    gl_Position = projectionMatrix * viewMatrix * worldPos;
}
`;

const fragmentShader = `
uniform vec3 uPink, uCyan, uShadow, uHighlight;
uniform vec3 uKeyLightColor, uRimLightColor;
uniform float uIridescence, uGloss, uExposure, uLightIntensity;
uniform float uKeyLightIntensity, uRimLightIntensity, uStudioIntensity, uAmbientIntensity;
varying vec3 vWorld;
varying vec3 vNormal;
varying vec2 vFabric;
varying float vHeight;

float boxLight(vec3 r, vec3 axis, vec3 up, vec2 size, float softness) {
    vec3 a = normalize(axis);
    vec3 u = normalize(cross(up, a));
    vec3 v = cross(a, u);
    float facing = dot(r, a);
    vec2 q = abs(vec2(dot(r, u), dot(r, v))) / max(facing, 0.05);
    vec2 edge = vec2(1.0) - smoothstep(size, size + softness, q);
    return edge.x * edge.y * smoothstep(0.0, 0.15, facing);
}

vec3 studio(vec3 r) {
    float wash = 0.5 + 0.5 * sin(r.y * 3.8 + r.x * 1.6);
    vec3 color = mix(uShadow * 0.85, uPink * 0.92, 0.5 + wash * 0.5);
    float cyan = boxLight(r, vec3(-0.65, 0.35, 1.0), vec3(0.0, 1.0, 0.0), vec2(0.6, 0.1), 0.28);
    cyan += boxLight(r, vec3(0.7, 0.8, -0.5), vec3(0.3, 1.0, 0.0), vec2(0.3, 0.15), 0.3) * 0.82;
    cyan += boxLight(r, vec3(-0.9, -0.35, -0.5), vec3(0.0, 1.0, 0.0), vec2(0.18, 0.45), 0.3) * 0.6;
    color = mix(color, uCyan, clamp(cyan * uIridescence, 0.0, 1.0));
    float white = boxLight(r, vec3(-0.5, 1.0, 0.5), vec3(0.0, 0.0, 1.0), vec2(0.38, 0.75), 0.2);
    float strip = boxLight(r, vec3(0.5, 0.35, 1.0), vec3(-0.2, 1.0, 0.0), vec2(0.055, 1.3), 0.09);
    float upper = boxLight(r, vec3(0.0, 1.0, -0.65), vec3(0.0, 0.0, 1.0), vec2(0.8, 0.12), 0.14);
    color += uHighlight * (white * 0.65 + strip * 0.9 + upper * 0.6) * uGloss;
    return color * uStudioIntensity;
}

void main() {
    vec3 n = normalize(vNormal);
    vec3 view = normalize(cameraPosition - vWorld);
    float facing = abs(dot(n, view));
    vec3 reflected = reflect(-view, n);
    vec3 faceNormal = dot(n, view) < 0.0 ? -n : n;
    vec3 key = normalize(vec3(-0.65, 0.85, 0.5));
    float diffuse = max(dot(faceNormal, key), 0.0) * uKeyLightIntensity;
    float rim = max(dot(faceNormal, normalize(vec3(0.65, 0.5, -0.6))), 0.0) * uRimLightIntensity;
    float fresnel = (1.0 - facing) * (1.0 - facing);
    vec3 satin = mix(uShadow * (0.55 * uAmbientIntensity), uPink, 0.3 + 0.7 * diffuse);
    satin += uPink * rim * 0.22 * uRimLightColor;
    vec3 color = mix(satin, studio(reflected), 0.7);
    float filmPhase = (facing - 0.55 + n.x * 0.08) / 0.13;
    float film = exp(-filmPhase * filmPhase) * 0.92 * uIridescence;
    color = mix(color, uCyan * (0.95 + 0.25 * diffuse), film);
    vec3 halfVector = normalize(key + view);
    float highlight = pow(max(dot(faceNormal, halfVector), 0.0), 38.0) * uKeyLightIntensity;
    color += uKeyLightColor * highlight * uGloss;
    color += mix(uPink, uHighlight, 0.4) * fresnel * 0.12;
    color *= (uExposure * uLightIntensity);
    gl_FragColor = vec4(color, 1.0);
    #include <colorspace_fragment>
}
`;

const profilePoints = [
    [-10,0.1],[-8,0.6],[-6.5,1.3],[-5.4,2.2],[-4.6,2.4],
    [-3.9,1.9],[-3.35,0.4],[-3,-0.2],[-2.55,-0.35],[-2.5,0.4],
    [-2.8,1.7],[-2.35,2.1],[-1.8,1.7],[-1.3,0],[-0.5,-0.5],
    [0.35,-0.3],[0.55,0.45],[0.15,1.15],[0.5,1.4],[1.15,1.2],
    [1.8,-0.1],[2.65,-0.4],[3,0.1],[2.85,1.1],[3.25,1.65],
    [3.9,1.4],[4.8,0.2],[6,-0.3],[8,-0.1],[10,0.5]
];

function buildFabric() {
    const columns = 240;
    const rows = 720;
    const positions = new Float32Array((columns + 1) * (rows + 1) * 3);
    const tangents = new Float32Array((columns + 1) * (rows + 1) * 2);
    const indices = new Uint32Array(columns * rows * 6);
    const point = new THREE.Vector2();
    const tangent = new THREE.Vector2();
    for (let row = 0; row <= rows; row++) {
        const u = row / rows * (profilePoints.length - 1);
        const segment = Math.min(Math.floor(u), profilePoints.length - 2);
        const t = u - segment;
        const p0 = profilePoints[Math.max(segment - 1, 0)];
        const p1 = profilePoints[segment];
        const p2 = profilePoints[segment + 1];
        const p3 = profilePoints[Math.min(segment + 2, profilePoints.length - 1)];
        for (let axis = 0; axis < 2; axis++) {
            const a = 2 * p1[axis];
            const b = -p0[axis] + p2[axis];
            const c = 2*p0[axis] - 5*p1[axis] + 4*p2[axis] - p3[axis];
            const d = -p0[axis] + 3*p1[axis] - 3*p2[axis] + p3[axis];
            point.setComponent(axis, 0.5 * (a + t * (b + t * (c + t * d))));
            tangent.setComponent(axis, 0.5 * (b + t * (2*c + 3*t*d)));
        }
        for (let col = 0; col <= columns; col++) {
            const index = row * (columns + 1) + col;
            positions[index * 3] = (col / columns - 0.5) * 30;
            positions[index * 3 + 1] = point.x;
            positions[index * 3 + 2] = point.y;
            tangents[index * 2] = tangent.x;
            tangents[index * 2 + 1] = tangent.y;
        }
    }
    let cursor = 0;
    for (let row = 0; row < rows; row++) {
        for (let col = 0; col < columns; col++) {
            const a = row * (columns + 1) + col;
            const b = a + columns + 1;
            indices[cursor++] = a; indices[cursor++] = b; indices[cursor++] = a+1;
            indices[cursor++] = a+1; indices[cursor++] = b; indices[cursor++] = b+1;
        }
    }
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('profileTangent', new THREE.BufferAttribute(tangents, 2));
    geometry.setIndex(new THREE.BufferAttribute(indices, 1));
    return geometry;
}

const geometry = buildFabric();
const material = new THREE.ShaderMaterial({
    uniforms,
    vertexShader,
    fragmentShader,
    side: THREE.DoubleSide
});
const fabric = new THREE.Mesh(geometry, material);
fabric.frustumCulled = false;
scene.add(fabric);

function updateCamera() {
    camera.fov = settings.fov;
    camera.position.set(settings.camPosX, settings.camPosY, settings.camPosZ);
    camera.lookAt(settings.targetX, settings.targetY, settings.targetZ);
    camera.zoom = settings.zoom;
    camera.updateProjectionMatrix();
}

function updateBackground() {
    const bg = settings.greenScreen ? '#00ff00' : settings.background;
    scene.background.set(bg);
    document.body.style.background = bg;
}

function syncUniforms() {
    uniforms.uAmplitude.value = settings.amplitude;
    uniforms.uFolds.value = settings.folds;
    uniforms.uDetail.value = settings.detail;
    uniforms.uIridescence.value = settings.iridescence;
    uniforms.uGloss.value = settings.gloss;
    uniforms.uExposure.value = settings.exposure;
    uniforms.uLightIntensity.value = settings.lightIntensity;
    uniforms.uKeyLightIntensity.value = settings.keyLightIntensity;
    uniforms.uRimLightIntensity.value = settings.rimLightIntensity;
    uniforms.uStudioIntensity.value = settings.studioIntensity;
    uniforms.uAmbientIntensity.value = settings.ambientIntensity;

    uniforms.uPink.value.set(settings.pink);
    uniforms.uCyan.value.set(settings.cyan);
    uniforms.uShadow.value.set(settings.shadow);
    uniforms.uHighlight.value.set(settings.highlight);
    uniforms.uKeyLightColor.value.set(settings.keyLightColor);
    uniforms.uRimLightColor.value.set(settings.rimLightColor);
    updateBackground();
}

function applyColorScheme(name) {
    if (!COLOR_SCHEMES[name]) return;
    const s = COLOR_SCHEMES[name];
    settings.colorScheme = name;
    settings.pink = s.pink;
    settings.cyan = s.cyan;
    settings.shadow = s.shadow;
    settings.highlight = s.highlight;
    settings.background = s.background;
    settings.greenScreen = false;
    syncUniforms();
    gui.controllersRecursive().forEach(c => c.updateDisplay());
}

function randomizeScene() {
    const schemes = Object.keys(COLOR_SCHEMES);
    const chosen = schemes[Math.floor(Math.random() * schemes.length)];
    settings.colorScheme = chosen;
    const s = COLOR_SCHEMES[chosen];
    settings.pink = s.pink;
    settings.cyan = s.cyan;
    settings.shadow = s.shadow;
    settings.highlight = s.highlight;
    settings.background = s.background;
    settings.greenScreen = false;

    settings.amplitude = Number((0.35 + Math.random() * 1.1).toFixed(2));
    settings.folds = Number((0.6 + Math.random() * 0.9).toFixed(2));
    settings.detail = Number((0.02 + Math.random() * 0.6).toFixed(2));

    settings.speed = Number((0.35 + Math.random() * 0.75).toFixed(2));
    settings.iridescence = Number((0.4 + Math.random() * 0.6).toFixed(2));
    settings.gloss = Number((0.45 + Math.random() * 0.5).toFixed(2));
    settings.exposure = Number((0.85 + Math.random() * 0.45).toFixed(2));

    settings.keyLightIntensity = Number((0.7 + Math.random() * 0.8).toFixed(2));
    settings.rimLightIntensity = Number((0.6 + Math.random() * 0.8).toFixed(2));
    settings.studioIntensity = Number((0.7 + Math.random() * 0.6).toFixed(2));

    syncUniforms();
    gui.controllersRecursive().forEach(c => c.updateDisplay());
}

function resize() {
    if (!renderer) return;
    renderer.setPixelRatio(Math.min(settings.dpr, 3.0));
    renderer.setSize(innerWidth, innerHeight);
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
}

function updateAntialias(enabled) {
    if (!renderer) return;
    const oldCanvas = renderer.domElement;
    renderer.setAnimationLoop(null);
    renderer.dispose();

    settings.antialias = enabled;
    renderer = new THREE.WebGLRenderer({ antialias: settings.antialias, powerPreference: 'high-performance' });
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.setPixelRatio(Math.min(settings.dpr, 3.0));
    renderer.setSize(innerWidth, innerHeight);

    oldCanvas.parentNode.replaceChild(renderer.domElement, oldCanvas);
    observer.disconnect();
    observer.observe(renderer.domElement);
    startAnimationLoop();
}

// GUI Setup
const gui = new GUI({ title: 'Liquid Fabric Settings' });

// Presets & Modes
const presetFolder = gui.addFolder('Theme & Color Presets');
presetFolder.add(settings, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Color Scheme').onChange(applyColorScheme);
presetFolder.add(settings, 'greenScreen').name('Green Screen (#00ff00)').onChange(updateBackground);
presetFolder.add(settings, 'clickRandomize').name('Click Scene to Randomize');
presetFolder.add({ resetPosition() { fabric.position.set(0, 0, 0); } }, 'resetPosition').name('Reset Fabric Position');

// Animation
const animFolder = gui.addFolder('Animation & Camera');
animFolder.add(settings, 'animationPreset', ANIMATION_PRESETS).name('Camera Motion');
animFolder.add(settings, 'speed', 0, 3.0, 0.01).name('Animation Speed');
animFolder.add(settings, 'paused').name('Pause Motion');

// Lighting & Exposure
const lightFolder = gui.addFolder('Lighting & Exposure');
lightFolder.add(settings, 'exposure', 0.2, 2.5, 0.01).name('Scene Exposure').onChange(syncUniforms);
lightFolder.add(settings, 'lightIntensity', 0.1, 3.0, 0.01).name('Light Intensity').onChange(syncUniforms);
lightFolder.add(settings, 'keyLightIntensity', 0.0, 3.0, 0.01).name('Key Light Intensity').onChange(syncUniforms);

gui.add({ reset() {

// Keyboard Toggle UI with 'H'
window.addEventListener('keydown', (e) => {
    if (e.key === 'h' || e.key === 'H') {
        const isHidden = gui.domElement.style.display === 'none';
        gui.domElement.style.display = isHidden ? '' : 'none';
    }
});

// Drag Object & Wheel Zoom Interaction
let isPointerDown = false;
let pointerMoved = false;
let startX = 0, startY = 0;
const initialMeshPos = new THREE.Vector3();

window.addEventListener('pointerdown', (e) => {
    if (e.target.closest && e.target.closest('.lil-gui')) return;
    isPointerDown = true;
    pointerMoved = false;
    startX = e.clientX;
    startY = e.clientY;
    initialMeshPos.copy(fabric.position);
});

window.addEventListener('pointermove', (e) => {
    if (!isPointerDown) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if (Math.hypot(dx, dy) > 5) {
        pointerMoved = true;
    }
    if (pointerMoved) {
        const dist = camera.position.distanceTo(fabric.position);
        const vFovRad = THREE.MathUtils.degToRad(camera.fov);
        const visibleHeight = 2.0 * Math.tan(vFovRad / 2.0) * dist / Math.max(camera.zoom, 0.01);
        const scale = visibleHeight / Math.max(window.innerHeight, 1);

        const camRight = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 0);
        const camUp = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 1);

        fabric.position.copy(initialMeshPos)
            .addScaledVector(camRight, dx * scale)
            .addScaledVector(camUp, -dy * scale);
    }
});

window.addEventListener('pointerup', (e) => {
    if (!isPointerDown) return;
    isPointerDown = false;
    if (!pointerMoved && settings.clickRandomize) {
        randomizeScene();
    }
});

window.addEventListener('pointercancel', () => {
    isPointerDown = false;
});

window.addEventListener('wheel', (e) => {
    if (e.target.closest && e.target.closest('.lil-gui')) return;
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.08 : 0.92;
    settings.zoom = THREE.MathUtils.clamp(settings.zoom * factor, 0.2, 5.0);
    camera.zoom = settings.zoom;
    camera.updateProjectionMatrix();
    zoomController.updateDisplay();
}, { passive: false });

// Animation Loop & Camera Modes
let animTime = 0;
let lastTime = performance.now();
let accumulator = 0;
let inViewport = true;
let disposed = false;

function updateCameraMotion() {
    if (settings.animationPreset === 'Static (No Camera Movement)') {
        camera.position.set(settings.camPosX, settings.camPosY, settings.camPosZ);
        camera.up.set(0, 1, 0);
        camera.lookAt(settings.targetX, settings.targetY, settings.targetZ);
    } else {
        const t = animTime * 0.35;
        let cx = settings.camPosX, cy = settings.camPosY, cz = settings.camPosZ;
        let tx = settings.targetX, ty = settings.targetY, tz = settings.targetZ;
        let upX = 0, upY = 1, upZ = 0;

        switch (settings.animationPreset) {
            case 'Gentle Floating Sway':
                cx = settings.camPosX + Math.sin(t * 0.5) * 2.8;
                cy = settings.camPosY + Math.cos(t * 0.35) * 1.5;
                cz = settings.camPosZ + Math.sin(t * 0.25) * 1.8;
                tx = settings.targetX + Math.sin(t * 0.3) * 0.8;
                ty = settings.targetY + Math.cos(t * 0.4) * 0.4;
                break;
            case 'Slow Horizon Orbit': {
                const rad = 16.2;
                const a = t * 0.2;
                cx = Math.sin(a) * rad;
                cz = Math.cos(a) * rad;
                cy = 8.8 + Math.sin(t * 0.3) * 1.6;
                tx = 0; ty = -0.3; tz = -1.0;
                break;
            }
            case 'Breathing Dolly Flow': {
                const d = 13.5 + Math.sin(t * 0.35) * 4.5;
                cx = Math.sin(t * 0.18) * 2.2;
                cy = 9.8 + Math.cos(t * 0.28) * 1.4;
                cz = d;
                tx = Math.sin(t * 0.2) * 0.5;
                ty = -0.3;
                tz = -1.0;
                break;
            }
            case 'Low-Angle Ridge Glide':
                cx = Math.sin(t * 0.25) * 9.0;
                cy = 4.8 + Math.sin(t * 0.35) * 1.2;
                cz = 11.5 + Math.cos(t * 0.25) * 2.5;
                tx = cx * 0.35;
                ty = 0.2;
                tz = -1.0;
                break;
            case 'Elevated Aerial Survey': {
                const rad = 8.5;
                const a = t * 0.16;
                cx = Math.sin(a) * rad;
                cz = 8.0 + Math.cos(a) * 6.0;
                cy = 16.5 + Math.sin(t * 0.22) * 2.0;
                tx = 0; ty = 0; tz = -0.5;
                break;
            }
            case 'Figure-8 Lissajous Drift':
                cx = Math.sin(t * 0.3) * 7.0;
                cy = 9.2 + Math.sin(t * 0.6) * 2.0;
                cz = 13.0 + Math.cos(t * 0.3) * 3.5;
                tx = Math.sin(t * 0.3) * 1.2;
                ty = -0.3 + Math.cos(t * 0.6) * 0.5;
                tz = -1.0;
                break;
            case 'Cinematic Diagonal Arc': {
                const a = t * 0.22;
                cx = Math.cos(a) * 11.0;
                cy = 8.0 + Math.sin(a * 1.3) * 2.8;
                cz = 12.5 + Math.sin(a) * 4.0;
                tx = Math.sin(a) * 1.5;
                ty = -0.2;
                tz = -1.0;
                upX = Math.sin(a * 0.6) * 0.08;
                break;
            }
        }
        camera.position.set(cx, cy, cz);
        camera.up.set(upX, upY, upZ);
        camera.lookAt(tx, ty, tz);
    }
    camera.zoom = settings.zoom;
    camera.updateProjectionMatrix();
}

function startAnimationLoop() {
    renderer.setAnimationLoop(now => {
        if (disposed) return;
        const delta = Math.min((now - lastTime) * 0.001, 0.08);
        lastTime = now;
        if (document.hidden || !inViewport) return;

        if (!settings.paused) {
            uniforms.uTime.value += delta * settings.speed;
            animTime += delta * settings.speed;
        }

        updateCameraMotion();

        accumulator += delta;
        const interval = 1 / settings.fps;
        if (accumulator < interval) return;
        accumulator %= interval;
        renderer.render(scene, camera);
    });
}

const observer = new IntersectionObserver(entries => {
    inViewport = entries[0].isIntersecting;
    lastTime = performance.now();
    accumulator = 0;
});
observer.observe(renderer.domElement);

function onVisibility() {
    lastTime = performance.now();
    accumulator = 0;
}
document.addEventListener('visibilitychange', onVisibility);
window.addEventListener('resize', resize);

syncUniforms();
updateCamera();
resize();
startAnimationLoop();

window.addEventListener('pagehide', event => {
    if (event.persisted) return;
    disposed = true;
    renderer.setAnimationLoop(null);
    observer.disconnect();
    window.removeEventListener('resize', resize);
    document.removeEventListener('visibilitychange', onVisibility);
    geometry.dispose();
    material.dispose();
    gui.destroy();
    renderer.dispose();
});
</script>
