<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>572 - Senbaku Star Packing (Generative Celestial Collage)</title>
  
  <style>
    /* =========================================================================
       CSS RESET & HIGH-END VIEWPORT ARCHITECTURE
       ========================================================================= */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d0f12;
      color: #e6ebf2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      transition: background-color 0.4s ease;
    }

    /* Container for the p5 canvas supporting edge-to-edge and framed print modes */
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    canvas {
      display: block;
      cursor: pointer;
      touch-action: none;
      outline: none;
      transition: box-shadow 0.35s ease, border-radius 0.35s ease;
    }

    /* Framed Print Mode Styling (Centered 1:1 or 4:5 with elegant matting) */
    body.mode-framed #canvas-container {
      padding: 32px;
      background: radial-gradient(circle at 50% 40%, rgba(255, 255, 255, 0.05), transparent 70%), #07090c;
    }

    body.mode-framed canvas {
      border-radius: 8px;
      box-shadow: 
        0 24px 70px rgba(0, 0, 0, 0.8),
        0 8px 24px rgba(0, 0, 0, 0.6),
        0 0 0 1px rgba(255, 255, 255, 0.12);
    }

    /* =========================================================================
       GLASSMORPHIС HEADS-UP DISPLAY (HUD)
       ========================================================================= */
    #hud {
      position: fixed;
      bottom: 24px;
      left: 24px;
      z-index: 100;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 7px;
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .hud-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hud-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 0 0 16px rgba(255, 255, 255, 0.35), 0 2px 4px rgba(0, 0, 0, 0.8);
    }

    .hud-badge {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1px;
      padding: 2px 8px;
      border-radius: 12px;
      background: rgba(225, 85, 33, 0.22);
      border: 1px solid rgba(225, 85, 33, 0.5);
      color: #ff7e50;
      text-transform: uppercase;
      text-shadow: 0 0 8px rgba(225, 85, 33, 0.6);
    }

    .hud-meta {
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.8px;
      color: rgba(255, 255, 255, 0.68);
      display: flex;
      align-items: center;
      gap: 8px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
    }

    .hud-meta a {
      color: #3391cf;
      text-decoration: none;
      pointer-events: auto;
      transition: color 0.2s ease, text-shadow 0.2s ease;
    }

    .hud-meta a:hover {
      color: #70baff;
      text-shadow: 0 0 8px rgba(51, 145, 207, 0.8);
    }

    .hud-hints {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 3px;
    }

    .key-tag {
      background: rgba(20, 24, 34, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 3px 8px;
      border-radius: 5px;
      font-size: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: rgba(255, 255, 255, 0.88);
      letter-spacing: 0.5px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    .key-tag span {
      color: #ff7e50;
      font-weight: 600;
    }

    /* =========================================================================
       FLOATING TOAST NOTIFICATION
       ========================================================================= */
    #toast {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(-24px);
      background: rgba(18, 22, 32, 0.94);
      border: 1px solid rgba(225, 85, 33, 0.45);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7), 0 0 20px rgba(225, 85, 33, 0.25);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 9px 24px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.8px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 1000;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #toast.toast-visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast-icon {
      font-size: 15px;
    }

    /* =========================================================================
       STATS BADGE (FPS & STAR COUNT)
       ========================================================================= */
    #fps-badge {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 100;
      font-size: 11px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: rgba(255, 255, 255, 0.75);
      background: rgba(18, 22, 32, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 5px 14px;
      border-radius: 20px;
      pointer-events: none;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      transition: opacity 0.3s ease;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #fps-badge .indicator {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #00ff88;
      box-shadow: 0 0 8px #00ff88;
    }

    /* =========================================================================
       LIL-GUI CUSTOM GLASS STYLING
       ========================================================================= */
    .lil-gui.root {
      --background-color: rgba(18, 22, 32, 0.92);
      --text-color: #e6ebf2;
      --title-background-color: rgba(28, 34, 48, 0.96);
      --widget-color: rgba(36, 44, 62, 0.85);
      --hover-color: rgba(52, 64, 90, 0.92);
      --focus-color: rgba(225, 85, 33, 0.85);
      --number-color: #3391cf;
      --string-color: #f5b2b1;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      --font-size: 11px;
      --folder-indent: 10px;
      
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 1000;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.65);
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .lil-gui .title {
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* Presentation mode: UI hidden */
    body.hidden-ui #hud,
    body.hidden-ui .lil-gui.root,
    body.hidden-ui #fps-badge,
    body.hidden-ui #toast {
      opacity: 0 !important;
      transform: translateY(12px);
      pointer-events: none !important;
    }
  </style>

</head>
<body>

    <div class="hud-header">
      <div class="hud-title">Senbaku Star Garden</div>

    <div class="hud-meta">
      Original concept by <a href="https://openprocessing.org/user/207560/" target="_blank" rel="noopener">Senbaku</a>

  <div id="fps-badge">
    <div class="indicator"></div>
    <span id="fps-val">60 FPS</span>

  <script>
    /*
      2026/06/02 randomCrop() fix.
      When fetching images, `image()` is faster than `get()`!
      頂点数 (verticesNums)
      くびれの深さ (depth)
      
      Original concept by Senbaku (@senbaku)
      https://openprocessing.org/user/207560/
      
      Enhanced Fullscreen Production Release with Procedural Textures,
      Curated 19 Color Schemes, Dynamic Randomization & lil-gui Controls.
    */

    // =========================================================================
    // COLOR SCHEMES (Senbaku 8 Originals + Curated 11 Harmony Expansions = 19 Schemes)
    // =========================================================================
    const COLOR_SCHEMES = {
      'Senbaku #8 (Nordic Ecru / Cobalt / Amber)': [
        "#F9F9F1", "#191A18", "#E15521", "#3391CF", "#E4901C", "#F5B2B1", "#009472"
      ],
      'Senbaku #1 (Indigo / Sage / Coral)': [
        "#3c4cad", "#5FB49C", "#e8a49c", "#1a224f", "#f4f1de"
      ],
      'Senbaku #2 (Navy / Tangerine / Sand)': [
        "#1c3560", "#ff6343", "#f2efdb", "#fea985", "#2a4d80"
      ],
      'Senbaku #3 (Earthy Olive / Sienna / Azure)': [
        "#e0d7c5", "#488a50", "#b59a55", "#bf5513", "#3b6fb6", "#4f3224", "#9a7f6e"
      ],
      'Senbaku #4 (Matcha / Mint / Salmon)': [
        "#DEEFB7", "#5FB49C", "#ed6a5a", "#35524a", "#f9f8f8"
      ],
      'Senbaku #5 (Midnight Charcoal / Slate Lavender)': [
        "#2B2B2B", "#91B3E1", "#2F5FB3", "#3D4B89", "#AE99E8", "#DBE2EC"
      ],
      'Senbaku #6 (Neon Cyberpunk Sunset)': [
        "#ffbe0b", "#fb5607", "#ff006e", "#8338ec", "#3a86ff", "#120024"
      ],
      'Senbaku #7 (Olive Garden / Ochre / Sky)': [
        "#A8C25D", "#5B7243", "#FFA088", "#FFFB42", "#a9cff0", "#2D6EA6"
      ],
      'Kyoto Woodblock & Vermilion': [
        "#1c222e", "#c83e29", "#e8a87c", "#c38d9e", "#41b3a3", "#f8f3eb"
      ],
      'Bauhaus 1923 (Primary Harmony)': [
        "#0d0e15", "#e63946", "#1d3557", "#457b9d", "#f1faee", "#e9c46a"
      ],
      'Tokyo Synthwave (Cyan & Magenta)': [
        "#080417", "#ff007f", "#00f0ff", "#ffe600", "#7928ca", "#ffffff"
      ],
      'Achromatic Noir & Silver': [
        "#000000", "#ffffff", "#888888", "#333333", "#dddddd", "#1a1a1a"
      ],
      'Pastel Botanica': [
        "#2e3d36", "#a8dadc", "#f4a261", "#e76f51", "#2a9d8f", "#fefae0"
      ],
      'Deep Oceanic Bioluminescence': [
        "#03071e", "#0077b6", "#00b4d8", "#90e0ef", "#03045e", "#caf0f8"
      ],
      'Moroccan Terracotta & Majorelle': [
        "#1a1423", "#3d315b", "#eb5e28", "#f38375", "#e7ecef", "#274060"
      ],
      'Wabi-Sabi Clay & Green Tea': [
        "#282622", "#8c7a6b", "#c5b9a8", "#685044", "#3e4739", "#ede8df"
      ],
      'Solar Flare & Aztec Gold': [
        "#140804", "#ff4500", "#ffaa00", "#ffd700", "#ffe4b5", "#7f1d1d"
      ],
      'Celestial Starlight (Cosmic Lilac)': [
        "#100b20", "#b5838d", "#e5989b", "#ffb4a2", "#6d597a", "#352342"
      ],
      'Nordic Forest Moss & Frost': [
        "#18231c", "#2d4739", "#709775", "#8fb996", "#a1cca5", "#e1eed9"
      ]
    };

    const SCHEME_KEYS = Object.keys(COLOR_SCHEMES);

    // =========================================================================
    // PARAMETERS & STATE CONFIGURATION
    // =========================================================================
    const params = {
      // Theme & Palette
      paletteScheme: 'Senbaku #8 (Nordic Ecru / Cobalt / Amber)',
      bgColor: '#f4f1de',
      autoBgFromPalette: false,
      textureStyle: 'Fluid Marbled / Suminagashi', // 'Fluid Marbled / Suminagashi', 'Watercolor Gouache', 'Bauhaus & Memphis', 'Cosmic Nebula', 'Chiyogami Ornamental'
      
      // Star Morphology & Packing
      packingAttempts: 1200,
      packingSpacing: 0.6,
      minStarRadius: 15,
      maxStarRadius: 200,
      minVertices: 3,
      maxVertices: 12,
      strokeWeight: 1.5,
      blendMode: 'OVERLAY', // 'OVERLAY', 'HARD_LIGHT', 'SOFT_LIGHT', 'MULTIPLY', 'DIFFERENCE', 'SCREEN', 'SOURCE_OVER'
      
      // Motion & Dynamics
      vel: 0.5,
      speedMultiplier: 1.0,
      directionMode: 'Alternating [-1, 1]', // 'Alternating [-1, 1]', 'Clockwise', 'Counter-Clockwise', 'Radial Vortex'
      mouseReaction: 'Accelerate Spin', // 'None', 'Accelerate Spin', 'Repel Deflection', 'Gentle Pulse'
      isPaused: false,

      // Atmosphere & Noise Layers
      enableNoiseTexture: true,
      noiseDensity: 0.04,
      noiseAlpha: 90,
      enableSpeckles: true,
      speckleCount: 1000,

      // Viewport & Layout
      viewportMode: 'Fullscreen (Edge-to-Edge)', // 'Fullscreen (Edge-to-Edge)', 'Framed Square (1:1)', 'Framed Print (4:5)'
      pixelDensityVal: 2,

      // Randomization Settings
      clickToRandomize: true,
      spacebarRandomize: true
    };

    // Global Procedural Variables (Preserving original variable names)
    let num;
    let cs;
    let paletteSelected = [];
    let paletteSelected1 = [];
    let paletteSelected2 = [];
    let img;
    let paletteCurrent = [];
    let t = 0.0;
    let vel = 0.5;
    let pg, pg2;
    
    // Cached Star Entities for silky smooth 60fps rotation
    let stars = [];
    let gui;
    let fpsValEl, starCountEl, toastEl, toastMsgEl;
    let toastTimeout = null;
    let lastFrameTime = performance.now();
    let frameCounter = 0;
    let currentFPS = 60;

    // Helper: Select random element from array
    function choose(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    // =========================================================================
    // COLOR & THEME RESOLUTION
    // =========================================================================
    function setPaletteByName(name, updateBg = params.autoBgFromPalette) {
      if (COLOR_SCHEMES[name]) {
        params.paletteScheme = name;
        paletteCurrent = [...COLOR_SCHEMES[name]];
      } else {
        paletteCurrent = [...COLOR_SCHEMES[SCHEME_KEYS[0]]];
      }

      paletteSelected = [...paletteCurrent];
      paletteSelected1 = [...paletteCurrent].sort(() => 0.5 - Math.random());
      paletteSelected2 = [...paletteCurrent].sort(() => 0.5 - Math.random());

      if (updateBg) {
        params.bgColor = paletteCurrent[0];
      }
    }

    function randomCol() {
      let randoms = int(random(1, paletteSelected.length));
      return color(paletteSelected[randoms]);
    }

    // =========================================================================
    // PROCEDURAL GENERATIVE TEXTURE FOR `img` (Zero External Assets)
    // =========================================================================
    function generateSourceTexture() {
      const S = 2048;
      if (!img || img.width !== S || img.height !== S) {
        img = createGraphics(S, S);
      }
      img.push();
      img.colorMode(RGB, 255);
      img.angleMode(DEGREES);
      img.rectMode(CORNER);

      const colors = [...paletteCurrent];
      const baseBg = colors[0] || "#F9F9F1";
      img.background(baseBg);

      const style = params.textureStyle;

      if (style === 'Fluid Marbled / Suminagashi') {
        // Organic topological Perlin noise contours & flowing marbling
        img.noFill();
        for (let c = 1; c < colors.length; c++) {
          img.stroke(colors[c]);
          img.strokeWeight(img.random(4, 26));
          for (let y = -200; y < S + 200; y += 42) {
            img.beginShape();
            for (let x = -100; x < S + 100; x += 32) {
              let n = noise(x * 0.002, y * 0.002, c * 0.45);
              let dy = sin(x * 0.01 + n * 14) * 85 + cos(y * 0.01) * 45;
              img.vertex(x, y + dy);
            }
            img.endShape();
          }
        }
        // Organic ink droplets
        img.noStroke();
        for (let i = 0; i < 450; i++) {
          img.fill(img.random(colors));
          let rx = img.random(S), ry = img.random(S), rr = img.random(6, 48);
          img.ellipse(rx, ry, rr, rr);
        }
      } else if (style === 'Watercolor Gouache') {
        // Translucent watercolor washes & pigment blooms
        img.noStroke();
        for (let i = 0; i < 200; i++) {
          let col = color(img.random(colors));
          col.setAlpha(img.random(30, 100));
          img.fill(col);
          let cx = img.random(S), cy = img.random(S);
          let rad = img.random(120, 650);
          img.beginShape();
          for (let a = 0; a < 360; a += 15) {
            let rOffset = rad * (1 + (noise(cos(a) * 1.5, sin(a) * 1.5, i * 0.12) - 0.5) * 0.7);
            img.vertex(cx + cos(a) * rOffset, cy + sin(a) * rOffset);
          }
          img.endShape(CLOSE);
        }
      } else if (style === 'Bauhaus & Memphis') {
        // High-contrast geometric shapes, diagonal stripes, and bold accents
        img.noStroke();
        for (let i = 0; i < 75; i++) {
          img.fill(img.random(colors));
          let bx = img.random(S), by = img.random(S), bw = img.random(90, 520), bh = img.random(90, 520);
          img.push();
          img.translate(bx, by);
          img.rotate(img.random([0, 15, 30, 45, 90]));
          let mode = i % 4;
          if (mode === 0) img.rect(-bw/2, -bh/2, bw, bh);
          else if (mode === 1) img.ellipse(0, 0, bw, bw);
          else if (mode === 2) {
            img.stroke(img.random(colors));
            img.strokeWeight(img.random(8, 24));
            img.line(-bw/2, -bh/2, bw/2, bh/2);
          } else {
            img.arc(0, 0, bw, bw, 0, 180);
          }
          img.pop();
        }
      } else if (style === 'Cosmic Nebula') {
        // Swirling chromatic nebula clouds
        for (let i = 0; i < 150; i++) {
          let col = color(img.random(colors));
          col.setAlpha(img.random(25, 95));
          img.fill(col);
          img.noStroke();
          let nx = img.random(S), ny = img.random(S), nr = img.random(140, 750);
          img.ellipse(nx, ny, nr, nr);
        }
      } else { // 'Chiyogami Ornamental'
        // Traditional concentric circular waves & radial geometry
        img.noFill();
        for (let r = 40; r < S * 1.5; r += 55) {
          img.stroke(img.random(colors));
          img.strokeWeight(img.random(4, 18));
          img.ellipse(S / 2, S / 2, r, r);
        }
        img.noStroke();
        for (let j = 0; j < 350; j++) {
          img.fill(img.random(colors));
          img.ellipse(img.random(S), img.random(S), img.random(8, 55), img.random(8, 55));
        }
      }

      // Micro risograph dither grain
      img.stroke(255, 32);
      img.strokeWeight(1);
      for (let g = 0; g < 5000; g++) {
        img.point(img.random(S), img.random(S));
      }

      img.pop();
    }

    // =========================================================================
    // STAR GEOMETRY & CIRCLE PACKING ENGINE
    // =========================================================================
    function starShape(x, y, r, verticesNums, depth) {
      push();
      translate(x, y);
      let radiusOuter = r;
      let radiusInner = r * depth;
      let angle = 360 / verticesNums;

      beginShape();
      for (let i = 0; i < 360; i += angle) {
        let ex = radiusOuter * cos(i);
        let ey = radiusOuter * sin(i);
        vertex(ex, ey);
        let ex2 = radiusInner * cos(i + (angle * 0.5));
        let ey2 = radiusInner * sin(i + (angle * 0.5));
        vertex(ex2, ey2);
      }
      endShape(CLOSE);
      pop();
    }

    function buildStarField() {
      randomSeed(num);
      noiseSeed(num);
      stars = [];

      let points = [];
      let count = params.packingAttempts;

      for (let i = 0; i < count; i++) {
        let s = random(params.minStarRadius, params.maxStarRadius);
        let x = random(width);
        let y = random(height);
        let add = true;
        for (let j = 0; j < points.length; j++) {
          let p = points[j];
          if (dist(x, y, p.x, p.y) < (s + p.z) * params.packingSpacing) {
            add = false;
            break;
          }
        }
        if (add) points.push(createVector(x, y, s));
      }

      // Process packed points and generate star parameters
      for (let i = 0; i < points.length; i++) {
        let p = points[i];
        let ran = random([-1, 1]);
        let r = Math.max(5, p.z - 5);

        let fillColor = randomCol();
        let strokeColor = randomCol();

        let verticesNums = floor(random(params.minVertices, params.maxVertices));
        let depth = 1 - random();

        // Safe bounds for randomCrop
        let maxCropW = Math.max(1, img.width - r * 2);
        let maxCropH = Math.max(1, img.height - r * 2);
        let cropX = random(0, maxCropW);
        let cropY = random(0, maxCropH);

        // Optional second overlay star properties (from source snippet)
        let verticesNums2 = floor(random(params.minVertices, params.maxVertices));
        let depth2 = 1 - random();

        stars.push({
          x: p.x,
          y: p.y,
          r: r,
          ran: ran,
          fillColor: fillColor,
          strokeColor: strokeColor,
          verticesNums: verticesNums,
          depth: depth,
          verticesNums2: verticesNums2,
          depth2: depth2,
          cropX: cropX,
          cropY: cropY,
          rotationOffset: random(360)
        });
      }

      if (starCountEl) {
        starCountEl.textContent = `${stars.length} Stars`;
      }
    }

    function renderStars() {
      push();
      rectMode(CENTER);
      angleMode(DEGREES);

      // Determine blend mode
      const blendModeMap = {
        'OVERLAY': OVERLAY,
        'HARD_LIGHT': HARD_LIGHT,
        'SOFT_LIGHT': SOFT_LIGHT,
        'MULTIPLY': MULTIPLY,
        'DIFFERENCE': DIFFERENCE,
        'SCREEN': SCREEN,
        'SOURCE_OVER': BLEND
      };
      const activeBlend = blendModeMap[params.blendMode] || OVERLAY;

      let mx = mouseX;
      let my = mouseY;
      let mouseActive = (mx > 0 && mx < width && my > 0 && my < height);

      for (let i = 0; i < stars.length; i++) {
        let s = stars[i];
        push();
        translate(s.x, s.y);

        // Direction computation
        let dir = s.ran;
        if (params.directionMode === 'Clockwise') dir = 1;
        else if (params.directionMode === 'Counter-Clockwise') dir = -1;
        else if (params.directionMode === 'Radial Vortex') {
          let angleToCenter = atan2(s.y - height / 2, s.x - width / 2);
          dir = (angleToCenter > 0) ? 1 : -1;
        }

        // Mouse reaction
        let extraRot = 0;
        let scaleFactor = 1.0;
        if (mouseActive && params.mouseReaction !== 'None') {
          let d = dist(s.x, s.y, mx, my);
          let influence = Math.max(0, 1 - d / 220);
          if (influence > 0) {
            if (params.mouseReaction === 'Accelerate Spin') {
              extraRot = influence * 45 * dir;
            } else if (params.mouseReaction === 'Gentle Pulse') {
              scaleFactor = 1 + influence * 0.18;
            } else if (params.mouseReaction === 'Repel Deflection') {
              let angleFromMouse = atan2(s.y - my, s.x - mx);
              translate(cos(angleFromMouse) * influence * 15, sin(angleFromMouse) * influence * 15);
            }
          }
        }

        scale(scaleFactor);
        rotate(dir * (t * 0.5) + extraRot + s.rotationOffset);

        fill(s.fillColor);
        if (params.strokeWeight > 0) {
          stroke(s.strokeColor);
          strokeWeight(params.strokeWeight);
        } else {
          noStroke();
        }

        // Draw primary star and set clipping mask
        push();
        starShape(0, 0, s.r, s.verticesNums, s.depth);
        drawingContext.clip();

        // Draw overlay texture crop inside clipped star
        push();
        blendMode(activeBlend);
        image(img, -s.r, -s.r, s.r * 2, s.r * 2, s.cropX, s.cropY, s.r * 2, s.r * 2);
        
        // Second star layer from source snippet
        noStroke();
        starShape(0, 0, s.r, s.verticesNums2, s.depth2);
        pop();

        pop();
        pop();
      }
      pop();
    }

    // =========================================================================
    // P5.JS LIFECYCLE HOOKS
    // =========================================================================
    function preload() {
      // In original code: img = loadImage("img.jpg");
      // For standalone zero-dependency execution, procedural texture is generated in setup().
    }

    function setup() {
      setCanvasDimensions();
      pixelDensity(params.pixelDensityVal);
      rectMode(CENTER);
      angleMode(DEGREES);

      num = Math.floor(random(100000));
      setPaletteByName(params.paletteScheme);

      generateSourceTexture();
      resetAndRestart();

      setupGUI();
      setupEvents();
    }

    function setCanvasDimensions() {
      let w = windowWidth;
      let h = windowHeight;

      if (params.viewportMode === 'Framed Square (1:1)') {
        document.body.classList.add('mode-framed');
        let side = Math.min(windowWidth - 64, windowHeight - 64);
        w = Math.max(300, side);
        h = Math.max(300, side);
      } else if (params.viewportMode === 'Framed Print (4:5)') {
        document.body.classList.add('mode-framed');
        let maxH = windowHeight - 64;
        let maxW = windowWidth - 64;
        let targetW = maxH * 0.8;
        if (targetW > maxW) {
          w = maxW;
          h = w / 0.8;
        } else {
          h = maxH;
          w = targetW;
        }
      } else {
        document.body.classList.remove('mode-framed');
      }

      cs = Math.min(w, h);

      if (!window._canvasCreated) {
        let cnv = createCanvas(w, h);
        cnv.parent('canvas-container');
        window._canvasCreated = true;
      } else {
        resizeCanvas(w, h);
      }
    }

    function resetAndRestart() {
      randomSeed(num);
      noiseSeed(num);

      // Texture 1: Frosted noise particles (pg)
      pg = createGraphics(width, height);
      pg.noStroke();
      let particle_count = Math.min(50000, Math.floor((width * height) * (params.noiseDensity * 0.001)));
      pg.randomSeed(num);

      for (let i = 0; i < particle_count; i++) {
        let x = pg.random(width);
        let y = pg.random(height);
        let n = noise(x * 0.01, y * 0.01) * ((width + height) / 2 * 0.002);
        pg.fill(255, params.noiseAlpha);
        pg.ellipse(x, y, n, n);
      }

      // Texture 2: Gaussian color speckles (pg2)
      pg2 = createGraphics(width, height);
      pg2.noStroke();
      for (let j = 0; j < params.speckleCount; j++) {
        pg2.fill(random(paletteCurrent));
        pg2.ellipse(
          randomGaussian(width / 2, width * 0.3),
          randomGaussian(height / 2, height * 0.3),
          random() < 0.9 ? width * random(0.001, 0.003) : width * random(0.005, 0.007)
        );
      }

      buildStarField();
    }

    function draw() {
      if (params.isPaused) {
        updateFPS();
        return;
      }

      background(params.bgColor);

      // Render the packed star field
      renderStars();

      // Atmospheric grain overlays
      if (params.enableSpeckles && pg2) {
        image(pg2, 0, 0);
      }
      if (params.enableNoiseTexture && pg) {
        image(pg, 0, 0);
      }

      t += params.vel * params.speedMultiplier;
      updateFPS();
    }

    function windowResized() {
      setCanvasDimensions();
      resetAndRestart();
    }

    // =========================================================================
    // RANDOMIZATION & PRESETS
    // =========================================================================
    function randomizeTheme() {
      // Pick random scheme from 19 schemes
      let nextScheme = choose(SCHEME_KEYS);
      params.paletteScheme = nextScheme;
      setPaletteByName(nextScheme);

      // Randomize background: 40% chance of custom palette color, 60% chance of soft ecru / noir
      if (Math.random() < 0.4) {
        params.bgColor = choose(paletteCurrent);
      } else {
        params.bgColor = choose(['#f4f1de', '#0b0f14', '#191a18', '#f8f5ed', '#05070a']);
      }

      // Re-roll geometry & packing parameters
      params.minStarRadius = Math.floor(random(10, 25));
      params.maxStarRadius = Math.floor(random(130, 240));
      params.minVertices = Math.floor(random(3, 6));
      params.maxVertices = Math.floor(random(8, 16));
      params.strokeWeight = choose([0, 1.0, 1.5, 2.0, 3.0]);
      params.packingSpacing = random(0.45, 0.75);

      // Re-roll motion
      params.vel = parseFloat((random(0.3, 1.2) * (random() < 0.5 ? 1 : -1)).toFixed(2));
      params.directionMode = choose(['Alternating [-1, 1]', 'Clockwise', 'Counter-Clockwise', 'Radial Vortex']);

      // Re-roll texture style
      params.textureStyle = choose([
        'Fluid Marbled / Suminagashi',
        'Watercolor Gouache',
        'Bauhaus & Memphis',
        'Cosmic Nebula',
        'Chiyogami Ornamental'
      ]);

      params.blendMode = choose(['OVERLAY', 'HARD_LIGHT', 'SOFT_LIGHT']);

      // New seed
      num = Math.floor(Math.random() * 1000000);

      generateSourceTexture();
      resetAndRestart();

      // Sync lil-gui controls
      if (gui) {
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      }

      showToast(`Theme: ${nextScheme.split(' (')[0]} • Seed #${num}`);
    }

    function reseed() {
      num = Math.floor(Math.random() * 1000000);
      generateSourceTexture();
      resetAndRestart();
      showToast(`Reseeded • Seed #${num}`);
    }

    function saveSnapshot() {
      let filename = `senbaku-stars-${params.paletteScheme.split(' (')[0].replace(/[^a-zA-Z0-9]/g, '_')}-${num}.png`;
      saveCanvas(filename);
      showToast("📸 High-Res PNG Saved!");
    }

    function toggleUI() {
      document.body.classList.toggle('hidden-ui');
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    // =========================================================================
    // USER INTERACTION & CONTROLS
    // =========================================================================
    function mousePressed(event) {
      if (event && event.target && (
        event.target.closest('.lil-gui') || 
        event.target.closest('#hud') || 
        event.target.closest('button') || 
        event.target.closest('a')
      )) {
        return;
      }

      if (params.clickToRandomize) {
        randomizeTheme();
      }
    }

    function setupEvents() {
      window.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;

        if (e.code === 'Space' && params.spacebarRandomize) {
          e.preventDefault();
          randomizeTheme();
        } else if (e.key === 'r' || e.key === 'R') {
          reseed();
        } else if (e.key === 'p' || e.key === 'P') {
          params.isPaused = !params.isPaused;
          showToast(params.isPaused ? "⏸️ Animation Paused" : "▶️ Animation Resumed");
          if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
        } else if (e.key === 'h' || e.key === 'H') {
          toggleUI();
        } else if (e.key === 's' || e.key === 'S') {
          saveSnapshot();
        } else if (e.key === 'f' || e.key === 'F') {
          toggleFullscreen();
        }
      });

      fpsValEl = document.getElementById('fps-val');
      starCountEl = document.getElementById('star-count-val');
      toastEl = document.getElementById('toast');
      toastMsgEl = document.getElementById('toast-message');
    }

    function showToast(msg) {
      if (!toastEl || !toastMsgEl) return;
      toastMsgEl.textContent = msg;
      toastEl.classList.add('toast-visible');
      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toastEl.classList.remove('toast-visible');
      }, 2400);
    }

    function updateFPS() {
      frameCounter++;
      let now = performance.now();
      if (now - lastFrameTime >= 500) {
        currentFPS = Math.round((frameCounter * 1000) / (now - lastFrameTime));
        frameCounter = 0;
        lastFrameTime = now;
        if (fpsValEl) {
          fpsValEl.textContent = `${currentFPS} FPS`;
        }
      }
    }

    // =========================================================================
    // LIL-GUI INITIALIZATION
    // =========================================================================
    function setupGUI() {
      if (typeof lil === 'undefined' || typeof lil.GUI === 'undefined') return;

      gui = new lil.GUI({ title: 'Senbaku Star Controls', width: 290 });

      // 1. Theme & Color Folder
      const fTheme = gui.addFolder('🎨 Theme & Colors');
      fTheme.add(params, 'paletteScheme', SCHEME_KEYS).name('Color Scheme').onChange(v => {
        setPaletteByName(v);
        generateSourceTexture();
        resetAndRestart();
      });
      fTheme.addColor(params, 'bgColor').name('Background').onChange(() => {});
      fTheme.add(params, 'autoBgFromPalette').name('Sync BG Color').onChange(v => {
        if (v) params.bgColor = paletteCurrent[0];
      });
      fTheme.add(params, 'textureStyle', [
        'Fluid Marbled / Suminagashi',
        'Watercolor Gouache',
        'Bauhaus & Memphis',
        'Cosmic Nebula',
        'Chiyogami Ornamental'
      ]).name('Texture Pattern').onChange(() => {
        generateSourceTexture();
      });
      fTheme.add({ fn: () => { generateSourceTexture(); } }, 'fn').name('✨ Re-draw Texture');

      // 2. Star Geometry & Packing Folder
      const fGeo = gui.addFolder('⭐ Star Morphology');
      fGeo.add(params, 'packingAttempts', 300, 3000, 50).name('Packing Density').onFinishChange(buildStarField);
      fGeo.add(params, 'packingSpacing', 0.3, 1.2, 0.05).name('Circle Spacing').onFinishChange(buildStarField);
      fGeo.add(params, 'minStarRadius', 5, 50, 1).name('Min Radius').onFinishChange(buildStarField);
      fGeo.add(params, 'maxStarRadius', 50, 350, 5).name('Max Radius').onFinishChange(buildStarField);
      fGeo.add(params, 'minVertices', 3, 8, 1).name('Min Vertices').onFinishChange(buildStarField);
      fGeo.add(params, 'maxVertices', 8, 20, 1).name('Max Vertices').onFinishChange(buildStarField);
      fGeo.add(params, 'strokeWeight', 0, 6, 0.5).name('Star Outline');
      fGeo.add(params, 'blendMode', [
        'OVERLAY', 'HARD_LIGHT', 'SOFT_LIGHT', 'MULTIPLY', 'DIFFERENCE', 'SCREEN', 'SOURCE_OVER'
      ]).name('Blend Mode');

      // 3. Motion & Physics Folder
      const fMotion = gui.addFolder('🌀 Motion & Rotation');
      fMotion.add(params, 'vel', -2.5, 2.5, 0.05).name('Velocity (vel)');
      fMotion.add(params, 'speedMultiplier', 0.1, 3.0, 0.1).name('Speed Factor');
      fMotion.add(params, 'directionMode', [
        'Alternating [-1, 1]', 'Clockwise', 'Counter-Clockwise', 'Radial Vortex'
      ]).name('Rotation Flow');
      fMotion.add(params, 'mouseReaction', [
        'None', 'Accelerate Spin', 'Gentle Pulse', 'Repel Deflection'
      ]).name('Mouse Hover');
      fMotion.add(params, 'isPaused').name('Pause Motion');

      // 4. Atmospheric Grain Folder
      const fAtmo = gui.addFolder('🌫️ Atmospheric Grain');
      fAtmo.add(params, 'enableNoiseTexture').name('Noise Paper (pg)');
      fAtmo.add(params, 'noiseDensity', 0.01, 0.1, 0.01).name('Grain Density').onFinishChange(resetAndRestart);
      fAtmo.add(params, 'noiseAlpha', 10, 200, 5).name('Grain Opacity').onFinishChange(resetAndRestart);
      fAtmo.add(params, 'enableSpeckles').name('Speckles (pg2)');
      fAtmo.add(params, 'speckleCount', 0, 3000, 100).name('Speckle Count').onFinishChange(resetAndRestart);

      // 5. Layout & Viewport Folder
      const fView = gui.addFolder('📐 Viewport & Layout');
      fView.add(params, 'viewportMode', [
        'Fullscreen (Edge-to-Edge)', 'Framed Square (1:1)', 'Framed Print (4:5)'
      ]).name('Display Mode').onChange(() => {
        setCanvasDimensions();
        resetAndRestart();
      });

      // 6. Randomization & Actions Folder
      const fRand = gui.addFolder('🎲 Randomization & Actions');
      fRand.add(params, 'clickToRandomize').name('Click to Randomize');
      fRand.add(params, 'spacebarRandomize').name('Space to Randomize');
      fRand.add({ fn: randomizeTheme }, 'fn').name('✨ Randomize Everything');
      fRand.add({ fn: reseed }, 'fn').name('🎲 Reseed Geometry');
      fRand.add({ fn: saveSnapshot }, 'fn').name('📸 Export High-Res PNG');
      fRand.add({ fn: toggleUI }, 'fn').name('👁️ Hide UI (Key H)');

      fTheme.open();
    }
  </script>
