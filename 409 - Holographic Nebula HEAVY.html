        // --- PARAMS SETUP ---
        const initialTheme = COLOR_SCHEMES['Original (Crimson & Cyan)'];

        // --- SCENE & RENDERER SETUP ---
        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 10);

        let renderer;

        // --- SHADER UNIFORMS ---
        const uniforms = {
            u_time: { value: 0.0 },
            u_resolution: { value: new THREE.Vector2(window.innerWidth * params.dpr, window.innerHeight * params.dpr) },

            u_greenScreen: { value: params.greenScreen },
            u_greenScreenColor: { value: new THREE.Color(params.greenScreenColor) },

            // Camera in World & Camera Space
            u_camPos: { value: new THREE.Vector3() },
            u_camForward: { value: new THREE.Vector3(0, 0, 1) },
            u_camRight: { value: new THREE.Vector3(1, 0, 0) },
            u_camUp: { value: new THREE.Vector3(0, 1, 0) },

            // Holographic Scanner Box
            u_scannerDist: { value: params.scannerDist },
            u_boxSize: { value: new THREE.Vector3(params.boxWidth, params.boxHeight, params.boxDepth) },
            u_dotDensity: { value: params.dotDensity },
            u_dotRadius: { value: params.dotRadius },
            u_contourFreq: { value: params.contourFreq },
            u_scanSpeed: { value: params.scanSpeed },

            // Nebula Geometry & Noise
            u_noiseScale: { value: params.noiseScale },
            u_densityThreshold: { value: params.densityThreshold },
            u_turbulence: { value: params.turbulence },
            u_fogDensity: { value: params.fogDensity },
            u_flightSpeed: { value: params.flightSpeed },

            // Colors
            u_nebulaBg: { value: new THREE.Color(params.nebulaBg) },
            u_nebulaColor: { value: new THREE.Color(params.nebulaColor) },
            u_nebulaAccent: { value: new THREE.Color(params.nebulaAccent) },
            u_scanCore: { value: new THREE.Color(params.scanCore) },
            u_scanColor: { value: new THREE.Color(params.scanColor) },
            u_scanContour: { value: new THREE.Color(params.scanContour) },

            // Lighting & Exposure
            u_exposure: { value: params.exposure },
            u_sceneLightIntensity: { value: params.sceneLightIntensity },
            u_nebulaLightIntensity: { value: params.nebulaLightIntensity },
            u_nebulaLightColor: { value: new THREE.Color(params.nebulaLightColor) },
            u_nebulaLightPos: { value: new THREE.Vector3(0, 2.0, 5.0) },
            u_scannerLightIntensity: { value: params.scannerLightIntensity },
            u_scannerLightColor: { value: new THREE.Color(params.scannerLightColor) },
            u_keyLightIntensity: { value: params.keyLightIntensity },
            u_keyLightDir: { value: new THREE.Vector3(0.6, 0.7, -0.4).normalize() }
        };

        // --- SHADER CODE ---
        const vertexShader = `
            void main() {
                gl_Position = vec4(position, 1.0);
            }
        `;

        const fragmentShader = `
            precision highp float;

            uniform float u_time;
            uniform vec2 u_resolution;
            uniform float u_zoom;
            uniform vec2 u_pan;
            uniform bool u_greenScreen;
            uniform vec3 u_greenScreenColor;

            // Camera vectors
            uniform vec3 u_camPos;
            uniform vec3 u_camForward;
            uniform vec3 u_camRight;
            uniform vec3 u_camUp;

            // Scanner parameters
            uniform float u_scannerDist;
            uniform vec3 u_boxSize;
            uniform float u_dotDensity;
            uniform float u_dotRadius;
            uniform float u_contourFreq;
            uniform float u_scanSpeed;

            // Nebula parameters
            uniform float u_noiseScale;
            uniform float u_densityThreshold;
            uniform float u_turbulence;
            uniform float u_fogDensity;
            uniform float u_flightSpeed;

            // Colors
            uniform vec3 u_nebulaBg;
            uniform vec3 u_nebulaColor;
            uniform vec3 u_nebulaAccent;
            uniform vec3 u_scanCore;
            uniform vec3 u_scanColor;
            uniform vec3 u_scanContour;

            // Lighting & Exposure
            uniform float u_exposure;
            uniform float u_sceneLightIntensity;
            uniform float u_nebulaLightIntensity;
            uniform vec3 u_nebulaLightColor;
            uniform vec3 u_nebulaLightPos;
            uniform float u_scannerLightIntensity;
            uniform vec3 u_scannerLightColor;
            uniform float u_keyLightIntensity;
            uniform vec3 u_keyLightDir;
            uniform int u_renderSteps;

            // Fast, robust 3D hash & noise
            float hash31(vec3 p) {
                p = fract(p * vec3(0.1031, 0.1030, 0.0973));
                p += dot(p, p.yzx + 33.33);
                return fract((p.x + p.y) * p.z);
            }

            float noise3D(vec3 p) {
                vec3 i = floor(p);
                vec3 f = fract(p);
                vec3 u = f * f * (3.0 - 2.0 * f);

                float n000 = hash31(i + vec3(0.0, 0.0, 0.0));
                float n100 = hash31(i + vec3(1.0, 0.0, 0.0));
                float n010 = hash31(i + vec3(0.0, 1.0, 0.0));
                float n110 = hash31(i + vec3(1.0, 1.0, 0.0));
                float n001 = hash31(i + vec3(0.0, 0.0, 1.0));
                float n101 = hash31(i + vec3(1.0, 0.0, 1.0));
                float n011 = hash31(i + vec3(0.0, 1.0, 1.0));
                float n111 = hash31(i + vec3(1.0, 1.0, 1.0));

                return mix(
                    mix(mix(n000, n100, u.x), mix(n010, n110, u.x), u.y),
                    mix(mix(n001, n101, u.x), mix(n011, n111, u.x), u.y),
                    u.z
                );
            }

            const mat3 m3 = mat3(
                0.00,  0.80,  0.60,
               -0.80,  0.36, -0.48,
               -0.60, -0.48,  0.64
            );

            float fbm(vec3 p) {
                float v = 0.55 * noise3D(p);
                // Early-out: if first octave is very small, remaining octaves can't lift it above threshold
                if (v < 0.18) return v * 0.5;

                p = m3 * p * 2.02 + vec3(0.12, 0.23, 0.34);
                v += 0.28 * noise3D(p);

                p = m3 * p * 2.03 + vec3(0.15, 0.25, 0.35);
                v += 0.17 * noise3D(p);

                return v;
            }

            float getNebulaDensity(vec3 p) {
                vec3 drift = vec3(0.0, 0.0, u_time * u_flightSpeed * 0.12);
                vec3 coord = (p + drift) * u_noiseScale;

                // Fast 1-octave domain warp for billowing fluid filaments (replaces 3 heavy 4-octave fbm calls)
                vec3 q = vec3(
                    noise3D(coord),
                    noise3D(coord + vec3(4.3, 1.7, 2.8)),
                    noise3D(coord + vec3(2.1, 7.2, 5.4))
                );

                float n = fbm(coord + q * u_turbulence);
                return smoothstep(u_densityThreshold, 0.92, n);
            }

            void main() {
                vec2 centeredPixel = gl_FragCoord.xy - 0.5 * u_resolution.xy - u_pan;
                vec2 localPixel = centeredPixel / max(u_zoom, 0.001) + 0.5 * u_resolution.xy;
                bool insideViewport = all(greaterThanEqual(localPixel, vec2(0.0))) && all(lessThanEqual(localPixel, u_resolution));

                if (!insideViewport) {
                    vec3 backgroundColor = u_greenScreen ? u_greenScreenColor : vec3(0.0);
                    gl_FragColor = vec4(backgroundColor, 1.0);
                    return;
                }

                vec2 uv = (localPixel - 0.5 * u_resolution.xy) / u_resolution.y;

                // Camera ray in world space
                vec3 rdWorld = normalize(uv.x * u_camRight + uv.y * u_camUp + 1.25 * u_camForward);
                vec3 roWorld = u_camPos;

                // Camera ray in camera-aligned space
                vec3 rdCam = normalize(vec3(uv.x, uv.y, 1.25));

                // Scanner box bounds in camera space
                vec3 bHalf = u_boxSize * 0.5;
                vec3 bMin = vec3(-bHalf.x, -bHalf.y, u_scannerDist - bHalf.z);
                vec3 bMax = vec3( bHalf.x,  bHalf.y, u_scannerDist + bHalf.z);

                // Analytic Ray-Box intersection
                vec3 invR = 1.0 / (rdCam + vec3(equal(rdCam, vec3(0.0))) * 1e-6);
                vec3 t0 = bMin * invR;
                vec3 t1 = bMax * invR;
                vec3 tmin = min(t0, t1);
                vec3 tmax = max(t0, t1);
                float tNear = max(max(tmin.x, tmin.y), tmin.z);
                float tFar = min(min(tmax.x, tmax.y), tmax.z);
                bool hitScanner = (tNear < tFar && tFar > 0.0);
                float tBoxStart = max(tNear, 0.0);
                float tBoxEnd = tFar;

                // Volumetric raymarching setup (optimized step count with jitter smoothing)
                const int MAX_STEPS = 64;
                float maxDist = 16.0;
                float dt = maxDist / float(u_renderSteps);

                // Dither to completely smooth volumetric stepping slices
                float dither = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453);
                float t = 0.4 + dither * dt;

                vec3 accumColor = vec3(0.0);
                float transmittance = 1.0;

                vec3 keyDir = normalize(u_keyLightDir);

                for (int i = 0; i < MAX_STEPS; i++) {
                    if (i >= u_renderSteps || t > maxDist || transmittance < 0.025) break;

                    vec3 pWorld = roWorld + rdWorld * t;
                    vec3 pCam = rdCam * t;

                    float dens = getNebulaDensity(pWorld);
                    bool insideBox = (hitScanner && t >= tBoxStart && t <= tBoxEnd);

                    if (insideBox) {
                        // --- HOLOGRAPHIC SCANNER CHAMBER ---
                        vec3 pBoxLocal = pCam - vec3(0.0, 0.0, u_scannerDist);

                        // 1. Crisp 3D Point Cloud Matrix
                        vec3 gridCell = fract(pBoxLocal * u_dotDensity) - 0.5;
                        float dDot = length(gridCell);
                        float dotCore = smoothstep(u_dotRadius, u_dotRadius * 0.25, dDot);
                        float dotGlow = smoothstep(u_dotRadius * 2.2, 0.0, dDot) * 0.4;
                        float pointCloud = (dotCore + dotGlow) * smoothstep(0.08, 0.48, dens);

                        // 2. Fluorescent Density Contour Isolines
                        float contourPhase = fract(dens * u_contourFreq);
                        float contourLine = smoothstep(0.12, 0.0, abs(contourPhase - 0.5)) * smoothstep(0.05, 0.25, dens);

                        // 3. Sweeping Holographic Laser Sheet
                        float sweepZ = sin(u_time * u_scanSpeed) * (bHalf.z * 0.88);
                        float laserDist = abs(pBoxLocal.z - sweepZ);
                        float laserSheet = smoothstep(0.06, 0.0, laserDist) * (0.4 + dens * 3.2);
                        float laserGlow = smoothstep(0.28, 0.0, laserDist) * dens * 0.6;

                        // 4. Holographic Cage Edges & Corner Brackets
                        vec3 dEdge = abs(abs(pBoxLocal) - bHalf);
                        float minEdge = min(min(dEdge.x + dEdge.y, dEdge.y + dEdge.z), dEdge.x + dEdge.z);
                        float edgeWire = smoothstep(0.045, 0.0, minEdge);

                        vec3 cornerDist = abs(pBoxLocal) - bHalf * 0.75;
                        float isCorner = step(0.0, cornerDist.x) * step(0.0, cornerDist.y) * step(0.0, cornerDist.z);
                        float bracketGlow = edgeWire * (1.0 + isCorner * 2.5);

                        // Vibrant contrasting scanner color palette
                        vec3 scanCol = u_scanColor * (pointCloud * 3.2);
                        scanCol += u_scanContour * (contourLine * 2.8);
                        scanCol += u_scanCore * (laserSheet * 4.0 + laserGlow * 1.5 + bracketGlow * 2.2);

                        float scanDensity = (dens * 0.25 + pointCloud * 0.35 + contourLine * 0.35 + laserSheet * 0.45) * dt;
                        accumColor += transmittance * scanCol * scanDensity * u_scannerLightIntensity;
                        transmittance *= exp(-scanDensity * 2.2);

                    } else if (dens > 0.005) {
                        // --- RAW BILLOWING DIFFUSE NEBULA ---
                        float fogAlpha = dens * u_fogDensity * 3.5 * dt;
                        vec3 fogCol = mix(u_nebulaColor, u_nebulaAccent, clamp(dens * 1.6, 0.0, 1.0));

                        // Lighting calculations
                        vec3 nebLightVec = u_nebulaLightPos - pWorld;
                        float nebDist = length(nebLightVec);
                        float nebAtten = 1.0 / (1.0 + 0.08 * nebDist * nebDist);
                        vec3 nebLightContrib = u_nebulaLightColor * u_nebulaLightIntensity * nebAtten;

                        vec3 scanCenterWorld = roWorld + u_camForward * u_scannerDist;
                        vec3 scanLightVec = scanCenterWorld - pWorld;
                        float scanDist = length(scanLightVec);
                        float scanAtten = 1.0 / (1.0 + 0.15 * scanDist * scanDist);
                        vec3 scanLightContrib = u_scannerLightColor * (u_scannerLightIntensity * 0.6) * scanAtten;

                        float keyDiff = max(dot(rdWorld, -keyDir) * 0.5 + 0.5, 0.0);
                        vec3 keyContrib = vec3(keyDiff * u_keyLightIntensity * 0.6);

                        vec3 totalLight = (vec3(0.2) + nebLightContrib + scanLightContrib + keyContrib) * u_sceneLightIntensity;
                        fogCol *= totalLight;

                        accumColor += transmittance * fogCol * fogAlpha;
                        transmittance *= exp(-fogAlpha * 2.5);
                    }

                    t += dt;
                }

                // Holographic Scanner Entry & Boundary Face Shimmer
                if (hitScanner && (!u_greenScreen || accumColor != vec3(0.0))) {
                    vec3 pNear = rdCam * tBoxStart - vec3(0.0, 0.0, u_scannerDist);
                    vec3 dFaceNear = abs(abs(pNear) - bHalf);
                    float edgeFace = min(min(dFaceNear.x + dFaceNear.y, dFaceNear.y + dFaceNear.z), dFaceNear.x + dFaceNear.z);
                    float edgeShimmer = smoothstep(0.04, 0.0, edgeFace);
                    accumColor += u_scanCore * edgeShimmer * 0.5 * u_scannerLightIntensity;
                }

                // Background & Composite
                if (u_greenScreen) {
                    accumColor = mix(u_greenScreenColor, accumColor, 1.0 - transmittance);
                } else {
                    vec3 bg = u_nebulaBg * (0.8 + 0.4 * uv.y);
                    accumColor += transmittance * bg;
                    accumColor *= 1.0 - dot(uv, uv) * 0.38;
                }

                // Exposure & Tone Mapping
                accumColor *= u_sceneLightIntensity;
                accumColor = vec3(1.0) - exp(-accumColor * u_exposure);

                gl_FragColor = vec4(accumColor, 1.0);
            }
        `;

        const material = new THREE.ShaderMaterial({
            vertexShader,
            fragmentShader,
            uniforms
        });

        const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
        scene.add(quad);

        // --- RENDERER INITIALIZATION & MANAGEMENT ---
        function updateCanvasBackground() {
            const color = params.greenScreen ? params.greenScreenColor : '#000000';
            document.body.style.backgroundColor = color;
            if (renderer) renderer.setClearColor(color, 1);
        }

        function setPan(x, y) {
            params.panX = x;
            params.panY = y;
            uniforms.u_pan.value.set(x, y);
        }

        function setZoom(value) {
            params.zoom = THREE.MathUtils.clamp(value, 0.35, 5.0);
            uniforms.u_zoom.value = params.zoom;
        }

        function applyColorScheme(schemeName) {
            const scheme = COLOR_SCHEMES[schemeName];
            if (!scheme) return;

            params.colorScheme = schemeName;
            params.nebulaBg = scheme.nebulaBg;
            params.nebulaColor = scheme.nebulaColor;
            params.nebulaAccent = scheme.nebulaAccent;
            params.scanCore = scheme.scanCore;
            params.scanColor = scheme.scanColor;
            params.scanContour = scheme.scanContour;
            params.scannerLightColor = scheme.scannerLightColor;
            params.nebulaLightColor = scheme.nebulaLightColor;

            uniforms.u_nebulaBg.value.set(params.nebulaBg);
            uniforms.u_nebulaColor.value.set(params.nebulaColor);
            uniforms.u_nebulaAccent.value.set(params.nebulaAccent);
            uniforms.u_scanCore.value.set(params.scanCore);
            uniforms.u_scanColor.value.set(params.scanColor);
            uniforms.u_scanContour.value.set(params.scanContour);
            uniforms.u_scannerLightColor.value.set(params.scannerLightColor);
            uniforms.u_nebulaLightColor.value.set(params.nebulaLightColor);

            updateCanvasBackground();
        }

        function updateKeyLight() {
            const rad = params.keyLightAngle * Math.PI / 180.0;
            uniforms.u_keyLightDir.value.set(Math.cos(rad), 0.7, -Math.sin(rad)).normalize();
        }

        // --- PROCEDURAL RE-ROLL GENERATOR ---
        function randomizeScene() {
            const schemeKeys = Object.keys(COLOR_SCHEMES);
            const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
            applyColorScheme(randomScheme);

            // Re-roll geometric parameters
            params.noiseScale = parseFloat((0.4 + Math.random() * 0.9).toFixed(2));
            params.densityThreshold = parseFloat((0.25 + Math.random() * 0.28).toFixed(2));
            params.turbulence = parseFloat((0.6 + Math.random() * 1.5).toFixed(2));
            params.fogDensity = parseFloat((0.04 + Math.random() * 0.08).toFixed(3));

            // Re-roll scanner box
            params.boxWidth = parseFloat((1.8 + Math.random() * 1.6).toFixed(2));
            params.boxHeight = parseFloat((1.4 + Math.random() * 1.2).toFixed(2));
            params.boxDepth = parseFloat((2.0 + Math.random() * 1.8).toFixed(2));
            params.dotDensity = parseFloat((8.0 + Math.random() * 16.0).toFixed(1));
            params.dotRadius = parseFloat((0.10 + Math.random() * 0.12).toFixed(2));
            params.contourFreq = parseFloat((6.0 + Math.random() * 18.0).toFixed(1));
            params.scanSpeed = parseFloat((0.6 + Math.random() * 1.6).toFixed(2));

            // Re-roll motion & animation
            params.animation = ANIMATION_MODES[Math.floor(Math.random() * ANIMATION_MODES.length)];
            params.flightSpeed = parseFloat((0.2 + Math.random() * 0.8).toFixed(2));
            params.animSpeed = parseFloat((0.5 + Math.random() * 0.9).toFixed(2));

            // Re-roll lighting
            params.exposure = parseFloat((0.85 + Math.random() * 0.5).toFixed(2));
            params.scannerLightIntensity = parseFloat((1.5 + Math.random() * 1.8).toFixed(2));
            params.nebulaLightIntensity = parseFloat((1.0 + Math.random() * 1.5).toFixed(2));
            params.keyLightAngle = Math.floor(Math.random() * 360);

            // Update uniforms
            uniforms.u_noiseScale.value = params.noiseScale;
            uniforms.u_densityThreshold.value = params.densityThreshold;
            uniforms.u_turbulence.value = params.turbulence;
            uniforms.u_fogDensity.value = params.fogDensity;
            uniforms.u_flightSpeed.value = params.flightSpeed;

            uniforms.u_boxSize.value.set(params.boxWidth, params.boxHeight, params.boxDepth);
            uniforms.u_dotDensity.value = params.dotDensity;
            uniforms.u_dotRadius.value = params.dotRadius;
            uniforms.u_contourFreq.value = params.contourFreq;
            uniforms.u_scanSpeed.value = params.scanSpeed;

            uniforms.u_exposure.value = params.exposure;
            uniforms.u_scannerLightIntensity.value = params.scannerLightIntensity;
            uniforms.u_nebulaLightIntensity.value = params.nebulaLightIntensity;
            updateKeyLight();

            // Refresh lil-gui displays
            gui.controllersRecursive().forEach(controller => controller.updateDisplay());
        }

        // --- LIL-GUI CONFIGURATION ---
        const gui = new GUI({ title: 'Holographic Scanner Nebula' });

        // System & Display
        const fSystem = gui.addFolder('System & Display');
        fSystem.add(params, 'antialias').name('Antialiasing').onChange(v => setAntialias(v));
        fSystem.add(params, 'dpr', 0.5, 2.5, 0.05).name('Pixel Ratio (DPR)').onChange(v => {
            renderer.setPixelRatio(v);
            uniforms.u_resolution.value.set(window.innerWidth * v, window.innerHeight * v);
        });
        fSystem.add(params, 'renderSteps', 24, 64, 4).name('Raymarch Steps').onChange(v => uniforms.u_renderSteps.value = v);
        fSystem.add(params, 'animSpeed', 0.0, 3.0, 0.1).name('Animation Speed');
        fSystem.add(params, 'flightSpeed', 0.0, 3.0, 0.1).name('Flight Speed').onChange(v => uniforms.u_flightSpeed.value = v);

        // Camera & Motion
        const fAnim = gui.addFolder('Animation & Flight');
        fAnim.add(params, 'animation', ANIMATION_MODES).name('Flight Trajectory').listen();
        fAnim.add(params, 'camPosY', -5.0, 15.0, 0.2).name('Altitude Offset').listen();
        fAnim.add(params, 'camPitch', -0.8, 1.2, 0.02).name('Pitch Offset').listen();

        // View Controls
        const fView = gui.addFolder('View Controls');
        fView.add(params, 'zoom', 0.35, 5.0, 0.01).name('Zoom').listen().onChange(setZoom);
        fView.add(params, 'panX', -2000.0, 2000.0, 1.0).name('Pan X').listen().onChange(v => setPan(v, params.panY));
        fView.add(params, 'panY', -2000.0, 2000.0, 1.0).name('Pan Y').listen().onChange(v => setPan(params.panX, v));
        fView.add({ reset: () => { setZoom(1.0); setPan(0.0, 0.0); } }, 'reset').name('Reset View');

        // Output & Chroma
        const fOutput = gui.addFolder('Output & Chroma');
        fOutput.add(params, 'greenScreen').name('Green Screen').onChange(v => {
            uniforms.u_greenScreen.value = v;
            updateCanvasBackground();
        });
        fOutput.addColor(params, 'greenScreenColor').name('Key Color').onChange(v => {
            uniforms.u_greenScreenColor.value.set(v);
            updateCanvasBackground();
        });

        // Themes & Colors
        const fColors = gui.addFolder('Color Schemes');
        fColors.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Color Scheme').listen().onChange(applyColorScheme);
        fColors.addColor(params, 'nebulaBg').name('Space Background').listen().onChange(v => uniforms.u_nebulaBg.value.set(v));
        fColors.addColor(params, 'nebulaColor').name('Nebula Cloud Base').listen().onChange(v => uniforms.u_nebulaColor.value.set(v));
        fColors.addColor(params, 'nebulaAccent').name('Nebula Cloud Accent').listen().onChange(v => uniforms.u_nebulaAccent.value.set(v));
        fColors.addColor(params, 'scanCore').name('Scanner Laser Core').listen().onChange(v => uniforms.u_scanCore.value.set(v));
        fColors.addColor(params, 'scanColor').name('Scanner Point Matrix').listen().onChange(v => uniforms.u_scanColor.value.set(v));
        fColors.addColor(params, 'scanContour').name('Scanner Contours').listen().onChange(v => uniforms.u_scanContour.value.set(v));

        // Scanner Volume Controls
        const fScanner = gui.addFolder('Scanner Volume');
        fScanner.add(params, 'boxWidth', 1.0, 6.0, 0.1).name('Box Width').listen().onChange(v => uniforms.u_boxSize.value.x = v);
        fScanner.add(params, 'boxHeight', 0.8, 4.5, 0.1).name('Box Height').listen().onChange(v => uniforms.u_boxSize.value.y = v);
        fScanner.add(params, 'boxDepth', 1.0, 6.0, 0.1).name('Box Depth').listen().onChange(v => uniforms.u_boxSize.value.z = v);
        fScanner.add(params, 'scannerDist', 2.0, 8.0, 0.1).name('Distance Ahead').onChange(v => uniforms.u_scannerDist.value = v);
        fScanner.add(params, 'dotDensity', 4.0, 32.0, 0.5).name('Matrix Density').listen().onChange(v => uniforms.u_dotDensity.value = v);
        fScanner.add(params, 'dotRadius', 0.04, 0.35, 0.01).name('Dot Radius').listen().onChange(v => uniforms.u_dotRadius.value = v);
        fScanner.add(params, 'contourFreq', 2.0, 32.0, 0.5).name('Contour Frequency').listen().onChange(v => uniforms.u_contourFreq.value = v);
        fScanner.add(params, 'scanSpeed', 0.1, 4.0, 0.1).name('Laser Sweep Speed').listen().onChange(v => uniforms.u_scanSpeed.value = v);

        // Nebula Density & Structure
        const fNebula = gui.addFolder('Nebula Density & Noise');
        fNebula.add(params, 'noiseScale', 0.2, 2.5, 0.05).name('Noise Frequency').listen().onChange(v => uniforms.u_noiseScale.value = v);
        fNebula.add(params, 'densityThreshold', 0.1, 0.8, 0.02).name('Density Cutoff').listen().onChange(v => uniforms.u_densityThreshold.value = v);
        fNebula.add(params, 'turbulence', 0.0, 3.0, 0.05).name('Swirl Turbulence').listen().onChange(v => uniforms.u_turbulence.value = v);
        fNebula.add(params, 'fogDensity', 0.01, 0.3, 0.005).name('Fog Density').listen().onChange(v => uniforms.u_fogDensity.value = v);

        // Lighting & Exposure
        const fLighting = gui.addFolder('Lighting & Exposure');
        fLighting.add(params, 'exposure', 0.1, 3.0, 0.05).name('Tone Exposure').listen().onChange(v => uniforms.u_exposure.value = v);
        fLighting.add(params, 'sceneLightIntensity', 0.0, 3.0, 0.1).name('Scene Master Light').onChange(v => uniforms.u_sceneLightIntensity.value = v);
        fLighting.add(params, 'nebulaLightIntensity', 0.0, 4.0, 0.1).name('Nebula Core Light').listen().onChange(v => uniforms.u_nebulaLightIntensity.value = v);
        fLighting.addColor(params, 'nebulaLightColor').name('Nebula Light Color').listen().onChange(v => uniforms.u_nebulaLightColor.value.set(v));
        fLighting.add(params, 'scannerLightIntensity', 0.0, 5.0, 0.1).name('Scanner Emitter Light').listen().onChange(v => uniforms.u_scannerLightIntensity.value = v);
        fLighting.addColor(params, 'scannerLightColor').name('Scanner Light Color').listen().onChange(v => uniforms.u_scannerLightColor.value.set(v));
        fLighting.add(params, 'keyLightIntensity', 0.0, 3.0, 0.1).name('Directional Key Light').onChange(v => uniforms.u_keyLightIntensity.value = v);
        fLighting.add(params, 'keyLightAngle', 0, 360, 5).name('Key Light Azimuth').listen().onChange(updateKeyLight);

        // Procedural Re-roll
        const fGen = gui.addFolder('Procedural Generator');
        fGen.add(params, 'clickRandomize').name('Click to Randomize');
        fGen.add({ reRoll: randomizeScene }, 'reRoll').name('⚡ Generate New Variation');

        gui.close();

        // --- POINTER, DRAG, ZOOM & CLICK HANDLING ---
        let isDragging = false;
        let lastPointerX = 0;
        let lastPointerY = 0;
        let pointerDownX = 0;
        let pointerDownY = 0;
        let pointerDownTime = 0;

        function bindEvents(dom) {
            dom.addEventListener('pointerdown', onPointerDown);
            dom.addEventListener('pointermove', onPointerMove);
            dom.addEventListener('pointerup', onPointerUp);
            dom.addEventListener('pointercancel', onPointerCancel);
            dom.addEventListener('lostpointercapture', onPointerCancel);
            dom.addEventListener('wheel', onWheel, { passive: false });
        }

        function unbindEvents(dom) {
            dom.removeEventListener('pointerdown', onPointerDown);
            dom.removeEventListener('pointermove', onPointerMove);
            dom.removeEventListener('pointerup', onPointerUp);
            dom.removeEventListener('pointercancel', onPointerCancel);
            dom.removeEventListener('lostpointercapture', onPointerCancel);
            dom.removeEventListener('wheel', onWheel);
        }

        function onPointerDown(event) {
            if (event.target.closest('.lil-gui')) return;

            isDragging = true;
            lastPointerX = event.clientX;
            lastPointerY = event.clientY;
            pointerDownX = event.clientX;
            pointerDownY = event.clientY;
            pointerDownTime = performance.now();

            document.body.classList.add('dragging');
            renderer.domElement.setPointerCapture(event.pointerId);
        }

        function onPointerMove(event) {
            if (!isDragging) return;

            const dpr = renderer.getPixelRatio();
            const deltaX = (event.clientX - lastPointerX) * dpr;
            const deltaY = (lastPointerY - event.clientY) * dpr;

            setPan(params.panX + deltaX, params.panY + deltaY);

            lastPointerX = event.clientX;
            lastPointerY = event.clientY;
        }

        function onPointerUp(event) {
            const elapsed = performance.now() - pointerDownTime;
            const dist = Math.hypot(event.clientX - pointerDownX, event.clientY - pointerDownY);

            // Re-roll scene variation upon click if enabled
            if (dist < 6 && elapsed < 350 && params.clickRandomize) {
                randomizeScene();
            }

            stopDrag(event);
        }

        function onPointerCancel(event) {
            stopDrag(event);
        }

        function stopDrag(event) {
            isDragging = false;
            document.body.classList.remove('dragging');

            if (event && renderer.domElement.hasPointerCapture(event.pointerId)) {
                renderer.domElement.releasePointerCapture(event.pointerId);
            }
        }

        function onWheel(event) {
            event.preventDefault();
            const zoomScale = Math.exp(-event.deltaY * 0.001);
            setZoom(params.zoom * zoomScale);
        }

        // --- ANTIALIAS TOGGLE & RENDERER CREATION ---
        function setAntialias(enabled) {
            params.antialias = enabled;
            const oldCanvas = renderer.domElement;
            unbindEvents(oldCanvas);
            if (oldCanvas.parentElement) {
                oldCanvas.parentElement.removeChild(oldCanvas);
            }
            renderer.dispose();

            initRenderer(enabled);
        }

        function initRenderer(antialiasEnabled) {
            renderer = new THREE.WebGLRenderer({ antialias: antialiasEnabled, alpha: true, powerPreference: 'high-performance' });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(params.dpr);
            document.body.appendChild(renderer.domElement);
            updateCanvasBackground();
            bindEvents(renderer.domElement);
        }

        initRenderer(params.antialias);

        // --- KEYBOARD LISTENER ('H' KEY TO HIDE/SHOW GUI) ---
        window.addEventListener('keydown', (event) => {
            if (event.code === 'KeyH' || event.key.toLowerCase() === 'h') {
                gui._hidden ? gui.show() : gui.hide();
            }
        });

        // --- WINDOW RESIZE HANDLING ---
        window.addEventListener('resize', () => {
            const width = window.innerWidth;
            const height = window.innerHeight;

            renderer.setSize(width, height);
            const currentDPR = renderer.getPixelRatio();
            uniforms.u_resolution.value.set(width * currentDPR, height * currentDPR);
        });

        // --- ANIMATION LOOP ---
        const clock = new THREE.Clock();
        let flightZ = 0.0;
        const euler = new THREE.Euler(0, 0, 0, 'YXZ');
        const camDir = new THREE.Vector3();
        const camUp = new THREE.Vector3();
        const camRight = new THREE.Vector3();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            const effectiveDelta = delta * params.animSpeed;
            uniforms.u_time.value += effectiveDelta;
            const t = uniforms.u_time.value;

            // Camera Animation Trajectory Modes
            let curPitch = params.camPitch;
            let curYaw = 0.0;
            let curRoll = 0.0;
            let camX = 0.0;
            let camY = params.camPosY;

            switch (params.animation) {
                case 'Forward Warp Drift':
                    flightZ += effectiveDelta * params.flightSpeed * 2.5;
                    curPitch += Math.sin(t * 0.4) * 0.08;
                    curYaw = Math.sin(t * 0.25) * 0.06;
                    camX = Math.sin(t * 0.3) * 0.5;
                    camY += Math.cos(t * 0.35) * 0.3;
                    curRoll = Math.sin(t * 0.2) * 0.03;
                    break;

                case 'Orbital Scan Survey':
                    flightZ += effectiveDelta * params.flightSpeed * 0.5;
                    curYaw = t * 0.16;
                    curPitch += Math.cos(t * 0.12) * 0.08;
                    camX = Math.sin(curYaw) * 1.8;
                    camY += Math.sin(t * 0.2) * 0.4;
                    break;

                case 'Deep Nebula Dive':
                    flightZ += effectiveDelta * params.flightSpeed * 2.0;
                    curPitch += 0.32 + Math.sin(t * 0.3) * 0.12;
                    camY += -0.8 + Math.sin(t * 0.2) * 1.5;
                    curYaw = Math.sin(t * 0.22) * 0.1;
                    curRoll = Math.sin(t * 0.25) * 0.08;
                    break;

                case 'Harmonic Lissajous Float':
                    flightZ += effectiveDelta * params.flightSpeed * 1.2;
                    camX = Math.sin(t * 0.35) * 1.5;
                    camY += Math.cos(t * 0.7) * 0.8;
                    curPitch += Math.cos(t * 0.35) * 0.12;
                    curYaw = Math.sin(t * 0.35) * 0.15;
                    curRoll = Math.sin(t * 0.35) * 0.04;
                    break;

                case 'Spiral Filament Flight':
                    flightZ += effectiveDelta * params.flightSpeed * 2.2;
                    camX = Math.cos(t * 0.25) * 1.8;
                    camY += Math.sin(t * 0.25) * 1.2;
                    curPitch += Math.sin(t * 0.25) * 0.1;
                    curYaw = -Math.cos(t * 0.25) * 0.12;
                    curRoll = (t * 0.1) % (Math.PI * 2);
                    break;

                case 'Transverse Cross-Slice':
                    flightZ += effectiveDelta * params.flightSpeed * 0.8;
                    camX = Math.sin(t * 0.28) * 3.5;
                    curYaw = Math.cos(t * 0.28) * 0.22;
                    camY += Math.sin(t * 0.15) * 0.3;
                    curRoll = -Math.cos(t * 0.28) * 0.05;
                    break;

                case 'Zenith Survey Sweep':
                    flightZ += effectiveDelta * params.flightSpeed * 0.6;
                    camY += Math.sin(t * 0.22) * 2.2;
                    curPitch += Math.sin(t * 0.22) * 0.38;
                    curYaw = Math.cos(t * 0.15) * 0.08;
                    camX = Math.sin(t * 0.18) * 0.6;
                    break;

                case 'Static Chamber (No Movement)':
                    // Complete stillness: static camera, scanner static in space
                    flightZ = 0.0;
                    camX = 0.0;
                    camY = params.camPosY;
                    curPitch = params.camPitch;
                    curYaw = 0.0;
                    curRoll = 0.0;
                    break;
            }

            // Update camera coordinate frame uniforms
            euler.set(curPitch, curYaw, curRoll, 'YXZ');
            camDir.set(0, 0, 1).applyEuler(euler);
            camUp.set(0, 1, 0).applyEuler(euler);
            camRight.set(1, 0, 0).applyEuler(euler);

            uniforms.u_camPos.value.set(camX, camY, flightZ);
            uniforms.u_camForward.value.copy(camDir);
            uniforms.u_camUp.value.copy(camUp);
            uniforms.u_camRight.value.copy(camRight);

            // Dynamic light source animation inside nebula
            uniforms.u_nebulaLightPos.value.set(
                Math.sin(t * 0.3) * 3.0,
                camY + 2.0 + Math.cos(t * 0.4) * 1.5,
                flightZ + 5.0 + Math.sin(t * 0.5) * 2.0
            );

            renderer.render(scene, camera);
        }

        // Global API export for programmatic inspection
        window.nebulaSceneControls = {
            setZoom,
            setPan,
            setGreenScreen(enabled) {
                params.greenScreen = enabled;
                uniforms.u_greenScreen.value = enabled;
                updateCanvasBackground();
            },
            setColorScheme: applyColorScheme,
            randomize: randomizeScene,
            getState() {
                return {
                    zoom: params.zoom,
                    panX: params.panX,
                    panY: params.panY,
                    greenScreen: params.greenScreen,
                    colorScheme: params.colorScheme,
                    animation: params.animation,
                    antialias: params.antialias,
                    dpr: params.dpr,
                    renderSteps: params.renderSteps
                };
            }
        };

        updateCanvasBackground();
        updateKeyLight();
        animate();
    </script>
</body>
</html>
