<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Seamless Liquid Metal Metaballs Fusion</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #080b10;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    canvas:active {
      cursor: grabbing;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container">
    <canvas id="webgl-canvas"></canvas>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import GUI from 'lil-gui';

    // =========================================================================
    // POST PROCESSOR SUITE (Inlined from postprocessing/PostProcessor.js)
    // =========================================================================
    const orthoVertexShader = `
    precision highp float;
    in vec3 position;
    out vec2 vUv;
    void main() {
      vUv = position.xy * 0.5 + 0.5;
      gl_Position = vec4(position, 1.0);
    }
    `;

    const brightFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float bloomThreshold;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float luminance = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float knee = 0.1;
      float soft = luminance - bloomThreshold + knee;
      soft = clamp(soft, 0.0, 2.0 * knee);
      soft = (soft * soft) / (4.0 * knee + 0.00001);
      float contribution = max(soft, luminance - bloomThreshold);
      contribution /= max(luminance, 0.00001);
      fragColor = vec4(color.rgb * contribution, color.a);
    }
    `;

    const blur13ShaderChunk = `
    vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
      vec2 resolution = vec2(textureSize(image, 0));
      vec4 color = vec4(0.0);
      vec2 off1 = vec2(1.411764705882353) * direction;
      vec2 off2 = vec2(3.2941176470588234) * direction;
      vec2 off3 = vec2(5.176470588235294) * direction;
      color += texture(image, uv) * 0.1964825501511404;
      color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
      color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
      return color;
    }
    `;

    const blurFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 direction;
    in vec2 vUv;
    out vec4 color;
    ${blur13ShaderChunk}
    void main() {
      color = blur13(inputTexture, vUv, direction);
    }
    `;

    const finalFragmentShader = `
    precision highp float;
    uniform vec2 resolution;
    uniform sampler2D inputTexture;
    uniform sampler2D blur0Texture;
    uniform sampler2D blur1Texture;
    uniform sampler2D blur2Texture;
    uniform sampler2D blur3Texture;
    uniform sampler2D blur4Texture;
    uniform bool bloomEnabled;
    uniform float bloomStrength;
    uniform float vignetteBoost;
    uniform float vignetteReduction;
    uniform float noiseIntensity;
    uniform float time;
    in vec2 vUv;
    out vec4 fragColor;

    float vignette(vec2 uv, float boost, float reduction) {
      vec2 position = vUv - 0.5;
      return boost - length(position) * reduction;
    }

    float hash1(uint n) {
      n = (n << 13U) ^ n;
      n = n * (n * n * 15731U + 789221U) + 1376312589U;
      return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
    }

    float noise(in vec2 uv, in float timeVal) {
      uvec2 p = uvec2(uv);
      return hash1(p.x + 1920U * p.y + (1920U * 1080U) * uint(timeVal));
    }

    void main() {
      vec4 color = texture(inputTexture, vUv);

      if (bloomEnabled && bloomStrength > 0.001) {
        vec4 b0 = texture(blur0Texture, vUv);
        vec4 b1 = texture(blur1Texture, vUv);
        vec4 b2 = texture(blur2Texture, vUv);
        vec4 b3 = texture(blur3Texture, vUv);
        vec4 b4 = texture(blur4Texture, vUv);

        vec4 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
        color += bloomSum * bloomStrength;
      }

      color.rgb *= vignette(vUv, vignetteBoost, vignetteReduction);
      color.rgb += noiseIntensity * noise(gl_FragCoord.xy, time);
      fragColor = vec4(color.rgb, 1.0);
    }
    `;

    const chromaticAberrationShaderChunk = `
    vec2 barrelDistortion(vec2 coord, float amt) {
      vec2 cc = coord - 0.5;
      float dist = dot(cc, cc);
      return coord + cc * dist * amt;
    }
    float sat(float t) { return clamp(t, 0.0, 1.0); }
    float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
    float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
    vec4 spectrum_offset(float t) {
      float lo = step(t, 0.5);
      float hi = 1.0 - lo;
      float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
      vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
      return pow(ret, vec4(1.0 / 2.2));
    }
    const float max_distort = 2.2;
    const int num_iter = 8;
    const float reci_num_iter_f = 1.0 / float(num_iter);
    vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
      vec4 sumcol = vec4(0.0);
      vec4 sumw = vec4(0.0);
      for (int i = 0; i < num_iter; ++i) {
        float t = float(i) * reci_num_iter_f;
        vec4 w = spectrum_offset(t);
        sumw += w;
        sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
      }
      return sumcol / sumw;
    }
    `;

    const colorFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float chromaticAberrationAmount;
    uniform float minInputLevel;
    uniform float maxInputLevel;
    uniform float gammaLevel;
    uniform float fisheyeStrength;
    uniform float fisheyeRadius;
    uniform float time;
    in vec2 vUv;
    out vec4 fragColor;

    ${chromaticAberrationShaderChunk}

    vec2 applyFisheye(vec2 uv, float strength, float radius) {
      if (abs(strength) < 0.0001) return uv;
      vec2 p = uv - 0.5;
      float d = length(p);
      if (d > radius * 1.5) return uv;
      float r = d / max(radius, 0.001);
      float theta = atan(p.y, p.x);
      float rDist = r + strength * (r * r * r);
      return 0.5 + vec2(cos(theta), sin(theta)) * (rDist * radius);
    }

    vec3 gammaCorrect(vec3 color, vec3 gamma) {
      return pow(max(color, vec3(0.0)), 1.0 / gamma);
    }
    vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
      return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
    }
    vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
      return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
    }
    void main() {
      vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
      fragColor = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
      fragColor.rgb = finalLevels(fragColor.rgb, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
      fragColor.a = 1.0;
    }
    `;

    const copyFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      fragColor = texture(inputTexture, vUv);
    }
    `;

    function createFBO(w, h, options = {}) {
      return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
        wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
        wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
        minFilter: options.minFilter || THREE.LinearFilter,
        magFilter: options.magFilter || THREE.LinearFilter,
        format: options.format || THREE.RGBAFormat,
        type: options.type || THREE.HalfFloatType,
        stencilBuffer: options.stencilBuffer || false,
        depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : true,
        samples: options.samples || 0,
      });
    }

    class ShaderPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbo = createFBO(1, 1, options);
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
        this.texture = this.fbo.texture;
      }
      render(renderer, toScreen = false) {
        if (!toScreen) {
          renderer.setRenderTarget(this.fbo);
        }
        renderer.render(this.orthoScene, this.orthoCamera);
        if (!toScreen) {
          renderer.setRenderTarget(null);
        }
      }
      setSize(width, height) {
        this.fbo.setSize(Math.max(1, width), Math.max(1, height));
        this.orthoQuad.scale.set(width, height, 1);
      }
    }

    class ShaderPingPongPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
        this.currentFBO = 0;
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
      }
      render(renderer) {
        renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
        renderer.render(this.orthoScene, this.orthoCamera);
        renderer.setRenderTarget(null);
        this.currentFBO = 1 - this.currentFBO;
      }
      get current() { return this.fbos[this.currentFBO]; }
      get texture() { return this.current.texture; }
      setSize(width, height) {
        const w = Math.max(1, width);
        const h = Math.max(1, height);
        this.orthoQuad.scale.set(w, h, 1);
        this.fbos[0].setSize(w, h);
        this.fbos[1].setSize(w, h);
      }
    }

    class BloomPass {
      constructor(strength = 0.6, radius = 0.45, threshold = 0.4, levels = 5) {
        this.strength = strength;
        this.radius = radius;
        this.threshold = threshold;
        this.enabled = true;
        this.levels = levels;

        this.brightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            bloomThreshold: { value: this.threshold },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: brightFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.brightPass = new ShaderPass(this.brightShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.blurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            direction: { value: new THREE.Vector2(0, 1) },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: blurFragmentShader,
          glslVersion: THREE.GLSL3,
        });

        this.blurPasses = [];
        for (let i = 0; i < this.levels; i++) {
          this.blurPasses.push(new ShaderPingPongPass(this.blurShader, {
            format: THREE.RGBAFormat,
            type: THREE.HalfFloatType,
          }));
        }
      }

      setSize(w, h) {
        let tw = Math.max(1, w);
        let th = Math.max(1, h);
        this.brightPass.setSize(tw, th);
        for (let i = 0; i < this.levels; i++) {
          tw = Math.max(1, Math.round(tw / 2));
          th = Math.max(1, Math.round(th / 2));
          this.blurPasses[i].setSize(tw, th);
        }
      }

      set source(texture) {
        this.brightShader.uniforms.inputTexture.value = texture;
      }

      render(renderer) {
        if (!this.enabled || this.strength <= 0.001) return;

        this.brightShader.uniforms.bloomThreshold.value = this.threshold;
        this.brightPass.render(renderer);

        const baseOffset = Math.max(0.1, this.radius * 2.0);
        const u = this.blurShader.uniforms;

        for (let j = 0; j < this.levels; j++) {
          const blurPass = this.blurPasses[j];
          const stepOffset = baseOffset * (1.0 + j * 0.5);

          u.direction.value.set(stepOffset, 0);
          u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
          blurPass.render(renderer);

          u.direction.value.set(0, stepOffset * 0.5);
          u.inputTexture.value = blurPass.current.texture;
          blurPass.render(renderer);
        }
      }
    }

    class PostProcessor {
      constructor(renderer, params = {}) {
        this.renderer = renderer;

        this.settings = {
          enabled: params.enabled !== undefined ? params.enabled : true,
          bloomEnabled: params.bloomEnabled !== undefined ? params.bloomEnabled : true,
          bloomStrength: params.bloomStrength !== undefined ? params.bloomStrength : 0.65,
          bloomRadius: params.bloomRadius !== undefined ? params.bloomRadius : 0.45,
          bloomThreshold: params.bloomThreshold !== undefined ? params.bloomThreshold : 0.45,

          fisheyeStrength: params.fisheyeStrength !== undefined ? params.fisheyeStrength : 0.0,
          fisheyeRadius: params.fisheyeRadius !== undefined ? params.fisheyeRadius : 1.0,
          chromaticAberration: params.chromaticAberration !== undefined ? params.chromaticAberration : 0.015,
          vignetteBoost: params.vignetteBoost !== undefined ? params.vignetteBoost : 1.0,
          vignetteReduction: params.vignetteReduction !== undefined ? params.vignetteReduction : 0.38,
          noiseIntensity: params.noiseIntensity !== undefined ? params.noiseIntensity : 0.008,

          gamma: params.gamma !== undefined ? params.gamma : 1.0,
          minInputLevel: params.minInputLevel !== undefined ? params.minInputLevel : 0.0,
          maxInputLevel: params.maxInputLevel !== undefined ? params.maxInputLevel : 1.0,
        };

        this.sceneTarget = createFBO(1, 1, { type: THREE.HalfFloatType });

        this.bloomPass = new BloomPass(
          this.settings.bloomStrength,
          this.settings.bloomRadius,
          this.settings.bloomThreshold,
          5
        );

        this.finalShader = new THREE.RawShaderMaterial({
          uniforms: {
            resolution: { value: new THREE.Vector2(1, 1) },
            bloomEnabled: { value: this.settings.bloomEnabled },
            bloomStrength: { value: this.settings.bloomStrength },
            vignetteBoost: { value: this.settings.vignetteBoost },
            vignetteReduction: { value: this.settings.vignetteReduction },
            noiseIntensity: { value: this.settings.noiseIntensity },
            inputTexture: { value: null },
            blur0Texture: { value: null },
            blur1Texture: { value: null },
            blur2Texture: { value: null },
            blur3Texture: { value: null },
            blur4Texture: { value: null },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: finalFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.finalPass = new ShaderPass(this.finalShader);

        this.rgbShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: this.finalPass.texture },
            fisheyeStrength: { value: this.settings.fisheyeStrength },
            fisheyeRadius: { value: this.settings.fisheyeRadius },
            chromaticAberrationAmount: { value: this.settings.chromaticAberration },
            minInputLevel: { value: this.settings.minInputLevel },
            maxInputLevel: { value: this.settings.maxInputLevel },
            gammaLevel: { value: this.settings.gamma },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: colorFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.rgbPass = new ShaderPass(this.rgbShader);

        this.copyShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: copyFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.copyPass = new ShaderPass(this.copyShader);
      }

      updateSettings() {
        this.bloomPass.enabled = this.settings.bloomEnabled;
        this.bloomPass.strength = this.settings.bloomStrength;
        this.bloomPass.radius = this.settings.bloomRadius;
        this.bloomPass.threshold = this.settings.bloomThreshold;

        this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
        this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
        this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
        this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
        this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;

        this.rgbShader.uniforms.fisheyeStrength.value = this.settings.fisheyeStrength;
        this.rgbShader.uniforms.fisheyeRadius.value = this.settings.fisheyeRadius;
        this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
        this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
        this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
        this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
      }

      setSize(w0, h0, dpr = 1) {
        const w = Math.max(1, Math.floor(w0 * dpr));
        const h = Math.max(1, Math.floor(h0 * dpr));
        this.sceneTarget.setSize(w, h);
        this.finalPass.setSize(w, h);
        this.finalShader.uniforms.resolution.value.set(w, h);
        this.bloomPass.setSize(w, h);
        this.rgbPass.setSize(w, h);
        this.copyPass.setSize(w, h);
      }

      renderScene(scene, camera) {
        if (!this.settings.enabled) {
          this.renderer.render(scene, camera);
          return;
        }
        this.renderer.setRenderTarget(this.sceneTarget);
        this.renderer.render(scene, camera);
        this.renderer.setRenderTarget(null);
        this.render(this.sceneTarget.texture);
      }

      render(sourceTexture) {
        if (!this.settings.enabled) {
          this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
          this.copyPass.render(this.renderer, true);
          return;
        }

        this.updateSettings();

        this.bloomPass.source = sourceTexture;
        this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
        this.bloomPass.render(this.renderer);

        this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
        this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
        this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
        this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
        this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

        const randomTime = Math.random() * 100000;
        this.finalPass.shader.uniforms.time.value = randomTime;
        this.rgbPass.shader.uniforms.time.value = randomTime;

        this.finalPass.render(this.renderer);
        this.rgbPass.render(this.renderer, true);
      }

      attachGUI(gui, title = "Post-Processing Suite") {
        const root = gui.addFolder(title);
        root.add(this.settings, "enabled").name("Enable Suite");

        const bloom = root.addFolder("Bloom");
        bloom.add(this.settings, "bloomEnabled").name("Enable Bloom").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomStrength", 0, 3.0, 0.05).name("Strength").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomRadius", 0, 2.0, 0.05).name("Radius").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomThreshold", 0, 1.0, 0.01).name("Threshold").onChange(() => this.updateSettings());

        const lens = root.addFolder("Lens, Optics & Fisheye");
        lens.add(this.settings, "fisheyeStrength", -1.0, 1.5, 0.01).name("Fisheye Distortion").onChange(() => this.updateSettings());
        lens.add(this.settings, "fisheyeRadius", 0.2, 2.0, 0.05).name("Fisheye Radius").onChange(() => this.updateSettings());
        lens.add(this.settings, "chromaticAberration", 0, 0.2, 0.005).name("Chromatic Aberration").onChange(() => this.updateSettings());
        lens.add(this.settings, "vignetteBoost", 0, 2.0, 0.05).name("Vignette Boost").onChange(() => this.updateSettings());
        lens.add(this.settings, "vignetteReduction", 0, 2.0, 0.05).name("Vignette Falloff").onChange(() => this.updateSettings());
        lens.add(this.settings, "noiseIntensity", 0, 0.1, 0.005).name("Film Grain").onChange(() => this.updateSettings());
        lens.add(this.settings, "gamma", 0.2, 2.0, 0.05).name("Gamma").onChange(() => this.updateSettings());
        lens.add(this.settings, "minInputLevel", 0, 0.5, 0.01).name("Black Level").onChange(() => this.updateSettings());
        lens.add(this.settings, "maxInputLevel", 0.5, 1.0, 0.01).name("White Level").onChange(() => this.updateSettings());

        return root;
      }
    }

    // =========================================================================
    // 18 PRECONFIGURED COLOR SCHEMES
    // =========================================================================
    const COLOR_SCHEMES = {
      'Monochromatic': {
        primary: '#d8e2ec',
        secondary: '#8899a6',
        accent: '#f0f4f8',
        bg: '#080b10',
        palette: ['#ffffff', '#d8e2ec', '#a6b8c7', '#758a99', '#4d5b66', '#2b343b', '#181e24', '#0f1418']
      },
      'Analogous': {
        primary: '#00d2ff',
        secondary: '#0066ff',
        accent: '#3a0ca3',
        bg: '#040814',
        palette: ['#00f0ff', '#00c3ff', '#0091ff', '#0051ff', '#2c10b0', '#480ca8', '#7209b7', '#00e5ff']
      },
      'Complementary': {
        primary: '#ff9e00',
        secondary: '#0077b6',
        accent: '#ffd166',
        bg: '#0a0910',
        palette: ['#ffaa00', '#ff7700', '#0096c7', '#0077b6', '#023e8a', '#ffb703', '#03045e', '#ff8500']
      },
      'Split-complementary': {
        primary: '#ffb703',
        secondary: '#00b4d8',
        accent: '#d90429',
        bg: '#080c14',
        palette: ['#ffb703', '#fb8500', '#00b4d8', '#0077b6', '#d90429', '#ef233c', '#023047', '#ff9f1c']

    // =========================================================================

    // =========================================================================

    // =========================================================================
    // METABALLS BUFFER & UNIFORMS
    // =========================================================================
    const MAX_BALLS = 12;
    const ballPositions = [];
    const ballColors = [];

    for (let i = 0; i < MAX_BALLS; i++) {
      ballPositions.push(new THREE.Vector4(0, 0, 0, 0.5));
      const col = new THREE.Color(initialScheme.palette[i % initialScheme.palette.length]);
      ballColors.push(new THREE.Vector3(col.r, col.g, col.b));
    }

    // =========================================================================
    // RAYMARCHING FULLSCREEN SHADER
    // =========================================================================
    const vertexShader = `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = vec4(position.xy, 0.0, 1.0);
      }
    `;

    const fragmentShader = `
      precision highp float;

      varying vec2 vUv;

      uniform vec2 uResolution;
      uniform float uTime;
      uniform vec3 uCameraPos;
      uniform mat4 uInverseProjectionMatrix;
      uniform mat4 uInverseViewMatrix;

      uniform int uBallCount;
      uniform vec4 uBalls[12];
      uniform vec3 uBallColors[12];

      uniform vec3 uPrimaryColor;
      uniform vec3 uSecondaryColor;
      uniform vec3 uAccentColor;
      uniform vec3 uBgColor;
      uniform float uGreenScreen;

      uniform float uBlendK;
      uniform float uFluidRipple;
      uniform float uMetallic;
      uniform float uRoughness;
      uniform float uIridescence;
      uniform float uExposure;
      uniform float uLightIntensity;
      uniform float uAntialias;

      struct Hit {
        float d;
        vec3 color;
        float h;
      };

      // Polynomial smooth union blending distance and pigment without boundary artifacts
      Hit opSmoothUnion(Hit a, Hit b, float k) {
        float h = clamp(0.5 + 0.5 * (b.d - a.d) / k, 0.0, 1.0);
        float d = mix(b.d, a.d, h) - k * h * (1.0 - h);
        vec3 col = mix(b.color, a.color, h);
        return Hit(d, col, h);
      }

      // Continuous 3D Signed Distance Field of Liquid Metal Organism
      Hit map(vec3 p) {
        float ripple = 0.0;
        if (uFluidRipple > 0.0005) {
          ripple = sin(p.x * 4.2 + uTime * 2.1) *
                   cos(p.y * 4.2 + uTime * 2.4) *
                   sin(p.z * 4.2 + uTime * 1.8) * uFluidRipple;
        }

        Hit res = Hit(1e5, vec3(1.0), 0.0);

        for (int i = 0; i < 12; i++) {
          if (i >= uBallCount) break;
          vec4 ball = uBalls[i];
          float d = length(p - ball.xyz) - ball.w + ripple;
          Hit cur = Hit(d, uBallColors[i], 1.0);
          if (i == 0) {
            res = cur;
          } else {
            res = opSmoothUnion(res, cur, uBlendK);
          }
        }
        return res;
      }

      // Analytic Tetrahedral Normal Estimation
      vec3 calcNormal(vec3 p) {
        const float eps = 0.0012;
        vec2 e = vec2(1.0, -1.0) * 0.5773 * eps;
        return normalize(
          e.xyy * map(p + e.xyy).d +
          e.yyx * map(p + e.yyx).d +
          e.yxy * map(p + e.yxy).d +
          e.xxx * map(p + e.xxx).d
        );
      }

      // Procedural Studio Lighting & High-Gloss Chrome Reflection
      vec3 shade(vec3 p, vec3 n, vec3 rd, Hit hit) {
        vec3 v = -rd;
        vec3 r = reflect(rd, n);
        float NdotV = max(0.0, dot(n, v));

        // Genuine liquid chrome Fresnel reflection curve
        float F0 = mix(0.85, 0.98, uMetallic);
        float fresnel = F0 + (1.0 - F0) * pow(1.0 - NdotV, 5.0);

        vec3 studioEnv = vec3(0.0);
        float roughnessExp = max(0.006, uRoughness * 1.6);

        // 1. Overhead large softbox reflector
        float softboxY = smoothstep(0.3, 0.96, r.y);
        float softboxX = smoothstep(0.75, 0.0, abs(r.x));
        studioEnv += vec3(1.0, 1.0, 1.0) * softboxY * softboxX * 2.4;

        // 2. High-contrast Key light kicker (Front-Right)
        vec3 keyDir = normalize(vec3(1.2, 0.85, 1.1));
        float keySpec = pow(max(0.0, dot(r, keyDir)), 36.0 / roughnessExp);
        studioEnv += vec3(1.0, 0.98, 0.95) * keySpec * 3.2;

        // 3. Fill soft light (Left)
        vec3 fillDir = normalize(vec3(-1.3, 0.25, 0.8));
        float fillSpec = pow(max(0.0, dot(r, fillDir)), 18.0 / roughnessExp);
        studioEnv += mix(vec3(0.9, 0.95, 1.0), uSecondaryColor, 0.4) * fillSpec * 2.0;

        // 4. Razor rim kickers along grazing edges
        vec3 rim1Dir = normalize(vec3(0.0, -0.65, -1.2));
        float rim1Spec = pow(max(0.0, dot(r, rim1Dir)), 24.0 / roughnessExp);
        studioEnv += mix(vec3(1.0), uAccentColor, 0.5) * rim1Spec * 2.2;

        vec3 rim2Dir = normalize(vec3(-1.1, 0.9, -0.7));
        float rim2Spec = pow(max(0.0, dot(r, rim2Dir)), 16.0 / roughnessExp);
        studioEnv += uPrimaryColor * rim2Spec * 1.6;

        // 5. Studio horizon reflection band & floor
        float horizon = 1.0 - smoothstep(0.0, 0.26, abs(r.y));
        studioEnv += vec3(0.25, 0.28, 0.35) * horizon * 1.0;
        studioEnv += mix(uBgColor * 0.5, vec3(0.06), 0.5) * smoothstep(-0.05, -0.9, r.y);

        // 6. Optional subtle iridescent thin-film sheen (only when activated)
        if (uIridescence > 0.001) {
          vec3 irid = 0.5 + 0.5 * cos(vec3(0.0, 2.0, 4.0) + (1.0 - NdotV) * 6.28318 + uTime * 0.3);
          studioEnv += irid * uIridescence * (1.0 - NdotV) * 1.0;
        }

        // Base & Chrome reflection synthesis
        vec3 baseColor = hit.color;
        vec3 diffuse = baseColor * 0.1 * max(0.0, dot(n, keyDir));
        vec3 reflection = studioEnv * mix(vec3(1.0), baseColor, 0.7);

        vec3 color = mix(diffuse, reflection, uMetallic);
        color += studioEnv * fresnel * 0.6;

        // Ambient self-shadowing / contact occlusion
        float ao = 0.0;
        float sca = 1.0;
        for (int a = 1; a <= 4; a++) {
          float hr = 0.04 * float(a);
          float d = map(p + n * hr).d;
          ao += -(d - hr) * sca;
          sca *= 0.68;
        }
        ao = clamp(1.0 - ao * 2.5, 0.2, 1.0);
        color *= ao;

        // Exposure & Light Intensity
        color *= uExposure * uLightIntensity;

        // Filmic Tone Mapping & Gamma
        color = color / (color + vec3(1.0));
        color = pow(color, vec3(1.0 / 2.2));

        return color;
      }

      // Background Rendering with Vignette or Greenscreen
      vec3 renderBackground(vec2 uv) {
        if (uGreenScreen > 0.5) {
          return vec3(0.0, 1.0, 0.0);
        }
        vec2 ndc = uv * 2.0 - 1.0;
        float aspect = uResolution.x / uResolution.y;
        float dist = length(ndc * vec2(aspect, 1.0));
        vec3 bgGrad = mix(uBgColor * 1.25, uBgColor * 0.3, clamp(dist * 0.72, 0.0, 1.0));
        return bgGrad;
      }

      // Ray Direction from Camera Matrix
      vec3 getRayDirection(vec2 uv) {
        vec4 clip = vec4(uv * 2.0 - 1.0, 1.0, 1.0);
        vec4 view = uInverseProjectionMatrix * clip;
        view.xyz /= view.w;
        vec4 world = uInverseViewMatrix * vec4(view.xyz, 0.0);
        return normalize(world.xyz);
      }

      // Raymarching Core - Clean boundary without artificial halos
      vec4 raymarch(vec3 ro, vec3 rd, vec2 uv) {
        float t = 0.4;
        const float maxDist = 28.0;
        Hit hit;

        for (int i = 0; i < 110; i++) {
          vec3 p = ro + rd * t;
          hit = map(p);

          if (hit.d < 0.0014) {
            vec3 n = calcNormal(p);
            vec3 col = shade(p, n, rd, hit);
            return vec4(col, 1.0);
          }

          t += hit.d * 0.76;
          if (t > maxDist) break;
        }

        // Missed ray -> clean pristine background without yellow halo
        return vec4(renderBackground(uv), 1.0);
      }

      void main() {
        if (uAntialias > 0.5) {
          vec2 offset = vec2(0.35, 0.35) / uResolution;
          vec3 rd1 = getRayDirection(vUv);
          vec3 rd2 = getRayDirection(vUv + offset);

          vec4 col1 = raymarch(uCameraPos, rd1, vUv);
          vec4 col2 = raymarch(uCameraPos, rd2, vUv + offset);

          if (uGreenScreen > 0.5) {
            bool isBg1 = (col1.g > 0.98 && col1.r < 0.05 && col1.b < 0.05);
            bool isBg2 = (col2.g > 0.98 && col2.r < 0.05 && col2.b < 0.05);
            if (isBg1 && isBg2) {
              gl_FragColor = vec4(0.0, 1.0, 0.0, 1.0);
            } else if (isBg1) {
              gl_FragColor = col2;
            } else if (isBg2) {
              gl_FragColor = col1;
            } else {
              gl_FragColor = vec4(mix(col1.rgb, col2.rgb, 0.5), 1.0);
            }
          } else {
            gl_FragColor = vec4(mix(col1.rgb, col2.rgb, 0.5), 1.0);
          }
        } else {
          vec3 rd = getRayDirection(vUv);
          gl_FragColor = raymarch(uCameraPos, rd, vUv);
        }
      }
    `;

    // Full-screen Quad Material & Mesh
    const quadMaterial = new THREE.ShaderMaterial({
      vertexShader: vertexShader,
      fragmentShader: fragmentShader,
      uniforms: {
        uResolution: { value: new THREE.Vector2(window.innerWidth * params.dpr, window.innerHeight * params.dpr) },
        uTime: { value: 0.0 },
        uCameraPos: { value: new THREE.Vector3() },
        uInverseProjectionMatrix: { value: new THREE.Matrix4() },
        uInverseViewMatrix: { value: new THREE.Matrix4() },

        uBallCount: { value: params.ballCount },
        uBalls: { value: ballPositions },
        uBallColors: { value: ballColors },

        uPrimaryColor: { value: new THREE.Color(initialScheme.primary) },
        uSecondaryColor: { value: new THREE.Color(initialScheme.secondary) },
        uAccentColor: { value: new THREE.Color(initialScheme.accent) },
        uBgColor: { value: new THREE.Color(initialScheme.bg) },
        uGreenScreen: { value: params.greenScreen ? 1.0 : 0.0 },

        uBlendK: { value: params.blendK },
        uFluidRipple: { value: params.fluidRipple },
        uMetallic: { value: params.metallic },
        uRoughness: { value: params.roughness },
        uIridescence: { value: params.iridescence },
        uExposure: { value: params.exposure },
        uLightIntensity: { value: params.lightIntensity },
        uAntialias: { value: params.antialias ? 1.0 : 0.0 }
      },
      depthWrite: false,
      depthTest: false

    const quadScene = new THREE.Scene();
    const quadCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const quadGeometry = new THREE.PlaneGeometry(2, 2);
    const quadMesh = new THREE.Mesh(quadGeometry, quadMaterial);

    // =========================================================================
    // COLOR SCHEME SYNCHRONIZATION
    // =========================================================================
    function applyColorScheme(schemeName) {
      const scheme = COLOR_SCHEMES[schemeName] || COLOR_SCHEMES['Monochromatic'];
      params.colorScheme = schemeName;
      params.primaryColor = scheme.primary;
      params.secondaryColor = scheme.secondary;
      params.accentColor = scheme.accent;
      params.backgroundColor = scheme.bg;

      quadMaterial.uniforms.uPrimaryColor.value.set(scheme.primary);
      quadMaterial.uniforms.uSecondaryColor.value.set(scheme.secondary);
      quadMaterial.uniforms.uAccentColor.value.set(scheme.accent);
      quadMaterial.uniforms.uBgColor.value.set(scheme.bg);

      for (let i = 0; i < MAX_BALLS; i++) {
        const hex = scheme.palette[i % scheme.palette.length];
        const c = new THREE.Color(hex);
        ballColors[i].set(c.r, c.g, c.b);
      }

      if (params.greenScreen) {
        document.body.style.backgroundColor = '#00ff00';
      } else {
        document.body.style.backgroundColor = scheme.bg;
      }
    }

    // =========================================================================
    // SIMULATION DYNAMICS & 8 ANIMATION TRAJECTORIES
    // =========================================================================
    function updateMetaballPositions(simTime) {
      const N = params.ballCount;
      const spread = params.spread;
      const baseR = params.baseRadius;
      const pulseSpeed = params.pulsation;

      switch (params.animation) {
        case 'Static (Zero Movement)': {
          for (let i = 0; i < N; i++) {
            const angle = (i / N) * Math.PI * 2.0;
            const rDist = spread * 0.75;
            const x = Math.cos(angle) * rDist;
            const y = Math.sin(angle) * rDist * 0.78;
            const z = Math.sin(i * 2.1) * spread * 0.42;
            const radius = baseR * (0.85 + 0.35 * ((i % 3) / 2.0));
            ballPositions[i].set(x, y, z, radius);
          }
          break;
        }

        case 'Zero-G Orbit & Fusion': {
          const T = simTime * 0.75 * pulseSpeed;
          const converge = Math.pow(0.5 + 0.5 * Math.sin(T), 2.8);
          const currentSpread = THREE.MathUtils.lerp(spread * 1.35, spread * 0.18, converge);
          const currentRadius = baseR * (1.0 + 0.28 * converge);

          for (let i = 0; i < N; i++) {
            const phase = (i / N) * Math.PI * 2.0;
            const theta = simTime * 0.65 * (0.8 + 0.2 * (i % 2)) + phase;
            const inclination = i * 1.35;

            const x = currentSpread * (Math.cos(theta) * Math.cos(inclination) - Math.sin(theta) * Math.sin(inclination) * 0.35);
            const y = currentSpread * (Math.sin(theta) * Math.cos(inclination) + Math.cos(theta) * Math.sin(inclination) * 0.35);
            const z = currentSpread * Math.sin(theta + inclination) * 0.72;

            const radiusVariation = currentRadius * (0.9 + 0.2 * Math.sin(theta * 2.0 + i));
            ballPositions[i].set(x, y, z, radiusVariation);
          }
          break;
        }

        case 'Harmonic Breathing Pulse': {
          const pulse = 0.5 + 0.5 * Math.sin(simTime * 1.15 * pulseSpeed);
          const expansion = THREE.MathUtils.lerp(0.2, 1.3, 1.0 - pulse);

          for (let i = 0; i < N; i++) {
            if (i === 0) {
              const coreRadius = baseR * (1.55 - 0.45 * (1.0 - pulse));
              ballPositions[0].set(0, 0, 0, coreRadius);
            } else {
              const phi = Math.acos(1.0 - 2.0 * (i / N));
              const goldenAngle = Math.PI * (3.0 - Math.sqrt(5.0));
              const theta = goldenAngle * i + simTime * 0.3;

              const rDist = spread * expansion;
              const x = rDist * Math.sin(phi) * Math.cos(theta);
              const y = rDist * Math.sin(phi) * Math.sin(theta);
              const z = rDist * Math.cos(phi);
              const r = baseR * (0.75 + 0.3 * Math.sin(theta * 2.0));
              ballPositions[i].set(x, y, z, r);
            }
          }
          break;
        }

        case 'DNA Double Helix Swirl': {
          const tH = simTime * 0.85 * pulseSpeed;
          for (let i = 0; i < N; i++) {
            const strand = i % 2;
            const strandOffset = strand * Math.PI;
            const progress = (Math.floor(i / 2) / (N / 2)) * Math.PI * 2.0;

            const y = Math.sin(tH * 0.5 + progress) * spread * 1.3;
            const rRadius = spread * (0.65 + 0.35 * Math.cos(tH + progress * 2.0));
            const angle = tH + progress + strandOffset;

            const x = rRadius * Math.cos(angle);
            const z = rRadius * Math.sin(angle);
            const r = baseR * (0.85 + 0.25 * Math.sin(angle));
            ballPositions[i].set(x, y, z, r);
          }
          break;
        }

        case 'Torus Knot Flow': {
          const tK = simTime * 0.65 * pulseSpeed;
          for (let i = 0; i < N; i++) {
            const u = tK + (i / N) * Math.PI * 2.0;
            const rK = spread * (1.05 + 0.32 * Math.cos(3.0 * u));
            const x = rK * Math.cos(2.0 * u);
            const y = rK * Math.sin(2.0 * u);
            const z = spread * (-0.62 * Math.sin(3.0 * u));
            const r = baseR * (0.9 + 0.25 * Math.cos(3.0 * u));
            ballPositions[i].set(x, y, z, r);
          }
          break;
        }

        case 'Planetary Pendulum': {
          const tP = simTime * pulseSpeed;
          for (let i = 0; i < N; i++) {
            if (i === 0) {
              ballPositions[0].set(0, 0, 0, baseR * 1.45);
            } else {
              const freq = 0.7 + 0.15 * i;
              const anomaly = tP * freq + i * 1.25;
              const rDist = spread * (0.16 + 1.25 * (0.5 + 0.5 * Math.cos(anomaly)));
              const angle = anomaly + 0.5 * Math.sin(anomaly);

              const x = rDist * Math.cos(angle) * Math.cos(i * 0.75);
              const y = rDist * Math.sin(angle) * Math.cos(i * 0.55);
              const z = rDist * Math.sin(angle) * Math.sin(i * 0.75);
              const r = baseR * (0.8 + 0.3 * (0.5 + 0.5 * Math.sin(anomaly)));
              ballPositions[i].set(x, y, z, r);
            }
          }
          break;
        }

        case 'Chaotic Attraction (Slow)': {
          const t1 = simTime * 0.52 * pulseSpeed;
          const t2 = simTime * 0.38 * pulseSpeed;
          const t3 = simTime * 0.44 * pulseSpeed;

          for (let i = 0; i < N; i++) {
            const x = spread * (Math.sin(t1 + i * 1.25) * 0.78 + Math.sin(t2 * 1.5 + i * 2.1) * 0.38);
            const y = spread * (Math.cos(t2 + i * 1.65) * 0.78 + Math.cos(t3 * 1.35 + i * 0.92) * 0.38);
            const z = spread * (Math.sin(t3 + i * 0.95) * 0.78 + Math.sin(t1 * 1.25 + i * 2.65) * 0.38);
            const r = baseR * (0.85 + 0.3 * Math.sin(t1 + i));
            ballPositions[i].set(x, y, z, r);
          }
          break;
        }

        case 'Cosmic Drift & Zen': {
          const tz = simTime * 0.24 * pulseSpeed;
          for (let i = 0; i < N; i++) {
            const phase = i * (Math.PI * 2.0 / N);
            const x = spread * Math.sin(tz + phase) * (0.92 + 0.2 * Math.sin(tz * 0.5 + i));
            const y = spread * Math.cos(tz * 0.82 + i * 1.6) * (0.92 + 0.2 * Math.cos(tz * 0.6 + i));
            const z = spread * Math.sin(tz * 0.68 + i * 2.3) * 0.58;
            const r = baseR * (0.9 + 0.2 * Math.sin(tz + phase));
            ballPositions[i].set(x, y, z, r);
          }
          break;
        }
      }
    }

    // =========================================================================
    // PROCEDURAL RANDOMIZATION ON CLICK
    // =========================================================================
    function randomizeScene() {
      // 1. Pick a random color scheme from the 18 schemes
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const chosenSchemeKey = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      applyColorScheme(chosenSchemeKey);

      // 2. Re-roll geometric parameters
      params.ballCount = Math.floor(THREE.MathUtils.randInt(5, 10));
      params.blendK = parseFloat(THREE.MathUtils.randFloat(0.42, 0.82).toFixed(2));
      params.baseRadius = parseFloat(THREE.MathUtils.randFloat(0.38, 0.56).toFixed(2));
      params.spread = parseFloat(THREE.MathUtils.randFloat(1.0, 1.65).toFixed(2));
      params.fluidRipple = parseFloat(THREE.MathUtils.randFloat(0.005, 0.025).toFixed(3));

      // 3. Re-roll motion & animation parameters
      params.animation = ANIMATION_PRESETS[Math.floor(Math.random() * ANIMATION_PRESETS.length)];
      params.speed = parseFloat(THREE.MathUtils.randFloat(0.7, 1.4).toFixed(2));
      params.pulsation = parseFloat(THREE.MathUtils.randFloat(0.8, 1.3).toFixed(2));

      // 4. Re-roll material & lighting parameters (clean metallic sheen)
      params.metallic = parseFloat(THREE.MathUtils.randFloat(0.92, 1.0).toFixed(2));
      params.roughness = parseFloat(THREE.MathUtils.randFloat(0.02, 0.12).toFixed(2));
      params.iridescence = 0.0;
      params.exposure = parseFloat(THREE.MathUtils.randFloat(1.05, 1.45).toFixed(2));
      params.lightIntensity = parseFloat(THREE.MathUtils.randFloat(1.3, 1.9).toFixed(2));

      // 5. Synchronize shader uniforms
      quadMaterial.uniforms.uBallCount.value = params.ballCount;
      quadMaterial.uniforms.uBlendK.value = params.blendK;
      quadMaterial.uniforms.uFluidRipple.value = params.fluidRipple;
      quadMaterial.uniforms.uMetallic.value = params.metallic;
      quadMaterial.uniforms.uRoughness.value = params.roughness;
      quadMaterial.uniforms.uIridescence.value = params.iridescence;
      quadMaterial.uniforms.uExposure.value = params.exposure;
      quadMaterial.uniforms.uLightIntensity.value = params.lightIntensity;

      // 6. Update Control Panel (lil-gui) to reflect all new values
      gui.controllersRecursive().forEach(ctrl => ctrl.updateDisplay());
    }

    // Distinguish click from drag/zoom interaction
    let pointerDownPos = { x: 0, y: 0 };
    let pointerDownTime = 0;
    let isInteracting = false;

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest && e.target.closest('.lil-gui')) return;
      pointerDownPos.x = e.clientX;
      pointerDownPos.y = e.clientY;
      pointerDownTime = performance.now();
      isInteracting = true;
    });

    window.addEventListener('pointerup', (e) => {
      isInteracting = false;
      if (e.target.closest && e.target.closest('.lil-gui')) return;
      const dx = e.clientX - pointerDownPos.x;
      const dy = e.clientY - pointerDownPos.y;
      const dist = Math.hypot(dx, dy);
      const duration = performance.now() - pointerDownTime;

      if (dist < 6 && duration < 380) {
        if (params.clickToRandomize) {
          randomizeScene();
        }
      }
    });

    // =========================================================================
    // LIL-GUI CONTROL PANEL (Standard styling, unpkg ESM)
    // =========================================================================
    const gui = new GUI({ title: 'Liquid Metal Fusion' });

    // Folder: Color & Visual Theme
    const folderColor = gui.addFolder('Color & Theme');
    folderColor.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Preset Scheme').onChange((name) => {
      applyColorScheme(name);
      folderColor.controllersRecursive().forEach(c => c.updateDisplay());
    });
    folderColor.add(params, 'greenScreen').name('Green Screen (#00ff00)').onChange((val) => {
      quadMaterial.uniforms.uGreenScreen.value = val ? 1.0 : 0.0;
      document.body.style.backgroundColor = val ? '#00ff00' : params.backgroundColor;
      if (val) {
        postProcessor.settings.enabled = false;
      } else {
        postProcessor.settings.enabled = true;
      }
      postProcessor.updateSettings();
    });
    folderColor.addColor(params, 'primaryColor').name('Primary Color').onChange((c) => {
      quadMaterial.uniforms.uPrimaryColor.value.set(c);
    });
    folderColor.addColor(params, 'secondaryColor').name('Secondary Color').onChange((c) => {
      quadMaterial.uniforms.uSecondaryColor.value.set(c);
    });
    folderColor.addColor(params, 'accentColor').name('Accent Color').onChange((c) => {
      quadMaterial.uniforms.uAccentColor.value.set(c);
    });
    folderColor.addColor(params, 'backgroundColor').name('Background Color').onChange((c) => {
      quadMaterial.uniforms.uBgColor.value.set(c);
      if (!params.greenScreen) document.body.style.backgroundColor = c;
    });

    // Folder: Material & Optics
    const folderMaterial = gui.addFolder('Liquid Chrome Material');
    folderMaterial.add(params, 'metallic', 0.5, 1.0, 0.01).name('Reflectivity').onChange((v) => {
      quadMaterial.uniforms.uMetallic.value = v;
    });
    folderMaterial.add(params, 'roughness', 0.01, 0.35, 0.01).name('Roughness').onChange((v) => {
      quadMaterial.uniforms.uRoughness.value = v;
    });
    folderMaterial.add(params, 'iridescence', 0.0, 1.0, 0.02).name('Iridescent Sheen').onChange((v) => {
      quadMaterial.uniforms.uIridescence.value = v;
    });

    // Folder: Metaball Fluid Physics
    const folderFluid = gui.addFolder('Metaball Fluid & Physics');
    folderFluid.add(params, 'ballCount', 4, 12, 1).name('Droplet Count').onChange((v) => {
      quadMaterial.uniforms.uBallCount.value = v;
    });
    folderFluid.add(params, 'blendK', 0.15, 1.2, 0.02).name('Surface Tension (k)').onChange((v) => {
      quadMaterial.uniforms.uBlendK.value = v;
    });
    folderFluid.add(params, 'baseRadius', 0.2, 0.75, 0.02).name('Droplet Radius');
    folderFluid.add(params, 'spread', 0.5, 2.5, 0.05).name('Cluster Spread');
    folderFluid.add(params, 'fluidRipple', 0.0, 0.06, 0.002).name('Surface Ripple').onChange((v) => {
      quadMaterial.uniforms.uFluidRipple.value = v;
    });

    // Folder: Animation & Choreography
    const folderAnimation = gui.addFolder('Animation & Motion');
    folderAnimation.add(params, 'animation', ANIMATION_PRESETS).name('Motion Preset');
    folderAnimation.add(params, 'speed', 0.0, 3.0, 0.05).name('Animation Speed');
    folderAnimation.add(params, 'pulsation', 0.2, 2.5, 0.05).name('Cycle Pulsation');
    folderAnimation.add(params, 'autoOrbit').name('Slow Auto-Orbit');

    // Folder: Lighting & Exposure
    const folderLighting = gui.addFolder('Lighting & Exposure');
    folderLighting.add(params, 'exposure', 0.2, 3.0, 0.05).name('Exposure').onChange((v) => {
      quadMaterial.uniforms.uExposure.value = v;
    });
    folderLighting.add(params, 'lightIntensity', 0.5, 3.0, 0.05).name('Light Intensity').onChange((v) => {
      quadMaterial.uniforms.uLightIntensity.value = v;
    });
    folderLighting.add(params, 'antialias').name('Antialias').onChange((v) => {
      quadMaterial.uniforms.uAntialias.value = v ? 1.0 : 0.0;
    });

    // Folder: Post-Processing Suite Integration
    postProcessor.attachGUI(gui, 'Post-Processing Suite');

    // Folder: Interaction & Renderer
    const folderRender = gui.addFolder('Interaction & Renderer');
    folderRender.add(params, 'dpr', 0.5, 2.5, 0.25).name('DPR (Pixel Ratio)').onChange((v) => {
      renderer.setPixelRatio(v);
      postProcessor.setSize(window.innerWidth, window.innerHeight, v);
      quadMaterial.uniforms.uResolution.value.set(window.innerWidth * v, window.innerHeight * v);
    });
    folderRender.add(params, 'dragMode', ['Rotate View', 'Pan / Drag Object']).name('Left Drag Action').onChange(() => {
      updateDragMode();
    });
    folderRender.add(params, 'clickToRandomize').name('Click Scene: Re-roll');
    folderRender.add(params, 'randomizeNow').name('Randomize Now');
    folderRender.add(params, 'resetView').name('Reset Camera');

    // Toggle UI visibility with 'H' key
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        if (gui._hidden) {
          gui.show();
        } else {
          gui.hide();
        }
      }
    });

    // =========================================================================
    // WINDOW RESIZE HANDLER
    // =========================================================================
    function onWindowResize() {
      const width = window.innerWidth;
      const height = window.innerHeight;

      camera.aspect = width / height;
      camera.updateProjectionMatrix();

      renderer.setSize(width, height);
      postProcessor.setSize(width, height, params.dpr);
      quadMaterial.uniforms.uResolution.value.set(width * params.dpr, height * params.dpr);
    }
    window.addEventListener('resize', onWindowResize);

    // =========================================================================
    // MAIN RENDER LOOP
    // =========================================================================
    let lastTime = performance.now();
    let accumulatedSimTime = 0.0;

    function animate(currentTime) {
      requestAnimationFrame(animate);

      const delta = Math.min((currentTime - lastTime) * 0.001, 0.1);
      lastTime = currentTime;

      // Continuous infinite simulation time
      accumulatedSimTime += delta * params.speed;

      // Update fluid metaball coordinates
      updateMetaballPositions(accumulatedSimTime);

      // Auto camera orbit when enabled and user is not dragging
      if (params.autoOrbit && params.animation !== 'Static (Zero Movement)' && !isInteracting) {
        const orbitAngle = 0.0035 * params.speed;
        camera.position.applyAxisAngle(new THREE.Vector3(0, 1, 0), orbitAngle);
        camera.lookAt(controls.target);
      }

      controls.update();
      camera.updateMatrixWorld();
      camera.updateProjectionMatrix();

      // Sync Raymarching camera unprojection uniforms
      quadMaterial.uniforms.uTime.value = accumulatedSimTime;
      quadMaterial.uniforms.uCameraPos.value.copy(camera.position);
      quadMaterial.uniforms.uInverseProjectionMatrix.value.copy(camera.projectionMatrixInverse);
      quadMaterial.uniforms.uInverseViewMatrix.value.copy(camera.matrixWorld);

      // Render Raymarching Quad through PostProcessor Pipeline
      postProcessor.renderScene(quadScene, quadCamera);
    }

    // Initiate Loop
    requestAnimationFrame(animate);
  </script>
</body>
</html>
