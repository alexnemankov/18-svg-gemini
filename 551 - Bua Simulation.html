<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voxel Bua Simulation</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      background-color: #000;
    }

    canvas {
      width: 100vw !important;
      height: 100vh !important;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
      image-rendering: -o-crisp-edges;
      -ms-interpolation-mode: nearest-neighbor;
      display: block;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>
  <script type="module">
    import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

    // 19 Preconfigured Color Schemes
    const COLOR_SCHEMES = {
      'Original': {
        bg: '#FFFAEF',
        colors: ['#3258e8', '#ebe045', '#f24f46', '#26c94a'],
        isOriginal: true
      },
      'Monochromatic': {
        bg: '#0a192f',
        colors: ['#1e3a8a', '#2563eb', '#60a5fa', '#93c5fd']
      },
      'Analogous': {
        bg: '#041c24',
        colors: ['#06b6d4', '#0ea5e9', '#3b82f6', '#10b981']
      },
      'Complementary': {
        bg: '#161925',
        colors: ['#ff6b35', '#004e89', '#f7c59f', '#1a659e']
      },
      'Split-complementary': {
        bg: '#111625',
        colors: ['#f97316', '#06b6d4', '#6366f1', '#fb923c']
      },
      'Triadic': {
        bg: '#191326',
        colors: ['#8b5cf6', '#10b981', '#f59e0b', '#ec4899']
      },
      'Tetradic': {
        bg: '#13141f',
        colors: ['#ef4444', '#06b6d4', '#eab308', '#8b5cf6']
      },
      'Double split-complementary': {
        bg: '#181224',
        colors: ['#ff5964', '#ffb30f', '#05d5b0', '#6948fe']
      },
      'Achromatic': {
        bg: '#121212',
        colors: ['#ffffff', '#cccccc', '#777777', '#222222'],
        isAchromatic: true
      },
      'Achromatic + Accent': {
        bg: '#181818',
        colors: ['#e50914', '#ffffff', '#999999', '#262626'],
        isAchromaticAccent: true
      },
      'Neutral + accent': {
        bg: '#242526',
        colors: ['#ff9f1c', '#d3cec4', '#8e887f', '#4a4640'],
        isNeutralAccent: true
      },
      'Palette 1 (Amber & Rust)': {
        bg: '#220901',
        colors: ['#F6AA1C', '#BC3908', '#941B0C', '#F6AA1C']
      },
      'Palette 2 (Cyan & Navy)': {
        bg: '#000000',
        colors: ['#63D1CF', '#5BC0BE', '#4BAD9E', '#0B132B']
      },
      'Palette 3 (Orchid & Plum)': {
        bg: '#0D001D',
        colors: ['#AA60C8', '#D69ADE', '#C9A3C6', '#CFB5C2']
      },
      'Palette 4 (Gold & Teal)': {
        bg: '#061210',
        colors: ['#FEF1BE', '#FFBA00', '#008189', '#00474D']
      },
      'Palette 5 (Lime & Forest)': {
        bg: '#05140A',
        colors: ['#D4FFB0', '#7FFF00', '#00B894', '#0A3322']
      },
      'Palette 6 (Sunset Orange)': {
        bg: '#0E0618',
        colors: ['#FFE8CC', '#FF8C00', '#C7501A', '#3D1050']
      },
      'Palette 7 (Neon Lavender)': {
        bg: '#090612',
        colors: ['#E8E0FF', '#B38FFF', '#6A3DE8', '#1A1250']
      },
      'Palette 8 (Cyber Glow)': {
        bg: '#05020F',
        colors: ['#E0FBFF', '#00F0FF', '#D40078', '#1E0A3D']
      }
    };

    // System parameters
    const params = {
      // Color & Theme
      colorScheme: 'Original',
      greenscreen: false,
      backgroundColor: '#FFFAEF',
      color1: '#3258e8',
      color2: '#ebe045',
      color3: '#f24f46',
      color4: '#26c94a',

      // Procedural Mode
      clickToRandomize: true,

      // Geometry & Simulation
      carCount: 40,
      scale: 1.0,
      sliceSpacing: 1.0,
      zoneMultiplier: 1.0,

      // Motion & Physics
      topSpeed: 140,
      fearStrength: 1.0,
      flockAlignment: 0.1,
      visionAngle: 0.4,

      // Camera View
      zoom: 1.0,
      panX: 0,
      panY: 0
    };

    let blue_sprite, yellow_sprite, red_sprite, green_sprite;
    let fallbackTemplateCanvas = null;
    let cachedSprites = [null, null, null, null];
    let bua = [];
    const sprite_size = { x: 38, y: 24 };

    // Interaction tracking
    let draggedObject = null;
    let dragOffset = { x: 0, y: 0 };
    let isPanning = false;
    let mouseDownPos = { x: 0, y: 0 };
    let isMouseDown = false;

    // Lil-gui setup
    const gui = new GUI({ title: 'Voxel Bua Controls' });

    // GUI Folders
    const fTheme = gui.addFolder('Theme & Colors');
    const schemeCtrl = fTheme.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Color Scheme').onChange(applyScheme);
    const greenCtrl = fTheme.add(params, 'greenscreen').name('Greenscreen (#00ff00)');
    const bgCtrl = fTheme.addColor(params, 'backgroundColor').name('Background Color');
    const c1Ctrl = fTheme.addColor(params, 'color1').name('Color 1').onChange(updateColoredSprites);
    const c2Ctrl = fTheme.addColor(params, 'color2').name('Color 2').onChange(updateColoredSprites);
    const c3Ctrl = fTheme.addColor(params, 'color3').name('Color 3').onChange(updateColoredSprites);
    const c4Ctrl = fTheme.addColor(params, 'color4').name('Color 4').onChange(updateColoredSprites);

    const fProcedural = gui.addFolder('Procedural Variations');
    fProcedural.add(params, 'clickToRandomize').name('Click Scene to Re-roll');
    fProcedural.add({ randomize: randomizeScene }, 'randomize').name('Randomize Scene Now');

    const fGeometry = gui.addFolder('Geometry');
    fGeometry.add(params, 'carCount', 5, 100, 1).name('Car Count').onChange(adjustCarCount);
    fGeometry.add(params, 'scale', 0.4, 2.5, 0.05).name('Car Scale');
    fGeometry.add(params, 'sliceSpacing', 0.4, 2.5, 0.05).name('Layer Spacing');
    fGeometry.add(params, 'zoneMultiplier', 0.4, 3.0, 0.05).name('Zone Radius');

    const fPhysics = gui.addFolder('Motion & Physics');
    fPhysics.add(params, 'topSpeed', 40, 320, 5).name('Top Speed');
    fPhysics.add(params, 'fearStrength', 0.1, 3.0, 0.05).name('Repulsion Force');
    fPhysics.add(params, 'flockAlignment', 0.01, 0.4, 0.01).name('Flock Lerp');
    fPhysics.add(params, 'visionAngle', 0.1, 0.9, 0.02).name('Vision Angle');

    const fCamera = gui.addFolder('Camera & View');
    const zoomCtrl = fCamera.add(params, 'zoom', 0.2, 5.0, 0.05).name('Zoom');
    const panXCtrl = fCamera.add(params, 'panX', -1000, 1000, 1).name('Pan X');
    const panYCtrl = fCamera.add(params, 'panY', -1000, 1000, 1).name('Pan Y');
    fCamera.add({ reset: resetView }, 'reset').name('Reset View');

    function resetView() {
      params.zoom = 1.0;
      params.panX = 0;
      params.panY = 0;
      updateAllGuiDisplays();
    }

    function updateAllGuiDisplays() {
      if (typeof gui.controllersRecursive === 'function') {
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      } else {
        function rec(f) {
          if (f.controllers) f.controllers.forEach(c => c.updateDisplay());
          if (f.folders) f.folders.forEach(sub => rec(sub));
        }
        rec(gui);
      }
    }

    // Toggle UI on "H" key
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        gui.domElement.style.display = gui.domElement.style.display === 'none' ? '' : 'none';
      }
    });

    // Prevent default right-click context menu on canvas
    window.addEventListener('contextmenu', (e) => {
      if (e.target && e.target.tagName === 'CANVAS') {
        e.preventDefault();
      }
    });

    function applyScheme(schemeName) {
      const scheme = COLOR_SCHEMES[schemeName] || COLOR_SCHEMES['Original'];
      params.backgroundColor = scheme.bg;
      params.color1 = scheme.colors[0];
      params.color2 = scheme.colors[1];
      params.color3 = scheme.colors[2];
      params.color4 = scheme.colors[3];
      updateColoredSprites();
      updateAllGuiDisplays();
    }

    function hexToRgb(hex) {
      const cleaned = hex.replace('#', '');
      const num = parseInt(cleaned, 16);
      return {
        r: (num >> 16) & 255,
        g: (num >> 8) & 255,
        b: num & 255
      };
    }

    function canvasToP5Image(c) {
      if (!c) return null;
      c.canvas = c;
      c.elt = c;
      if (typeof createImage === 'function') {
        try {
          const img = createImage(c.width, c.height);
          if (img && img.drawingContext) {
            img.drawingContext.drawImage(c, 0, 0);
            img.canvas = img.canvas || c;
            img.elt = img.elt || img.canvas;
            return img;
          }
        } catch (e) {
          // Fall through
        }
      }
      return c;
    }

    function createFallbackTemplate() {
      const c = document.createElement('canvas');
      c.width = 722;
      c.height = 24;
      c.canvas = c;
      c.elt = c;
      const ctx = c.getContext('2d');
      // 19 slices of 38x24
      for (let s = 0; s < 19; s++) {
        const ox = s * 38;
        // Undercarriage & tires
        if (s < 4) {
          ctx.fillStyle = '#392e59';
          ctx.fillRect(ox + 6, 2, 8, 4);
          ctx.fillRect(ox + 24, 2, 8, 4);
          ctx.fillRect(ox + 6, 18, 8, 4);
          ctx.fillRect(ox + 24, 18, 8, 4);
        }
        // Body chassis
        if (s >= 2 && s < 14) {
          ctx.fillStyle = '#3258e8';
          ctx.fillRect(ox + 4, 4, 30, 16);
          // Highlight edge
          ctx.fillStyle = '#50a9f4';
          ctx.fillRect(ox + 6, 5, 26, 3);
          // Taillights
          ctx.fillStyle = '#db362c';
          ctx.fillRect(ox + 4, 6, 2, 4);
          ctx.fillRect(ox + 4, 14, 2, 4);
        }
        // Cabin & windshield
        if (s >= 8 && s < 16) {
          ctx.fillStyle = '#a5aeff';
          ctx.fillRect(ox + 12, 6, 14, 12);
        }
        // Roof
        if (s >= 14) {
          ctx.fillStyle = '#3258e8';
          ctx.fillRect(ox + 13, 7, 12, 10);
          ctx.fillStyle = '#50a9f4';
          ctx.fillRect(ox + 14, 8, 10, 3);
        }
      }
      return canvasToP5Image(c);
    }

    function renderRecoloredSprite(baseSource, targetHex, isAchromatic = false, achroTone = 200) {
      const c = document.createElement('canvas');
      c.width = 722;
      c.height = 24;
      c.canvas = c;
      c.elt = c;
      const ctx = c.getContext('2d');
      
      let srcCanvas = (baseSource && (baseSource.canvas || baseSource.elt || baseSource));
      if (!srcCanvas || !srcCanvas.width || srcCanvas.width <= 1) {
        if (!fallbackTemplateCanvas) fallbackTemplateCanvas = createFallbackTemplate();
        srcCanvas = fallbackTemplateCanvas.canvas || fallbackTemplateCanvas.elt || fallbackTemplateCanvas;
      }

      let imgData = null;
      try {
        ctx.drawImage(srcCanvas, 0, 0);
        imgData = ctx.getImageData(0, 0, 722, 24);
      } catch (err) {
        if (!fallbackTemplateCanvas) fallbackTemplateCanvas = createFallbackTemplate();
        ctx.clearRect(0, 0, 722, 24);
        const fb = fallbackTemplateCanvas.canvas || fallbackTemplateCanvas.elt || fallbackTemplateCanvas;
        ctx.drawImage(fb, 0, 0);
        imgData = ctx.getImageData(0, 0, 722, 24);
      }

      const data = imgData.data;
      const targetRgb = hexToRgb(targetHex);

      // Brighter highlight color
      const hlR = Math.min(255, Math.round(targetRgb.r + (255 - targetRgb.r) * 0.42));
      const hlG = Math.min(255, Math.round(targetRgb.g + (255 - targetRgb.g) * 0.42));
      const hlB = Math.min(255, Math.round(targetRgb.b + (255 - targetRgb.b) * 0.42));

      for (let i = 0; i < data.length; i += 4) {
        const a = data[i + 3];
        if (a < 15) continue;

        const r = data[i], g = data[i + 1], b = data[i + 2];

        // 1. Detect tire/undercarriage (#392e59: 57, 46, 89)
        if (Math.abs(r - 57) < 20 && Math.abs(g - 46) < 20 && Math.abs(b - 89) < 20) {
          if (isAchromatic) {
            data[i] = 30;
            data[i + 1] = 30;
            data[i + 2] = 30;
          }
          continue;
        }

        // 2. Detect glass/windshield (#a5aeff: 165, 174, 255)
        if (Math.abs(r - 165) < 25 && Math.abs(g - 174) < 25 && Math.abs(b - 255) < 25) {
          if (isAchromatic) {
            data[i] = 210;
            data[i + 1] = 210;
            data[i + 2] = 210;
          }
          continue;
        }

        // 3. Detect taillight (#db362c: 219, 54, 44)
        if (Math.abs(r - 219) < 25 && Math.abs(g - 54) < 25 && Math.abs(b - 44) < 25) {
          if (isAchromatic) {
            data[i] = 110;
            data[i + 1] = 110;
            data[i + 2] = 110;
          }
          continue;
        }

        // 4. Car body pixels (distinguish highlight vs main body)
        const isHighlight = (r > 65 || g > 125 || b > 238);

        if (isAchromatic) {
          const val = isHighlight ? Math.min(255, achroTone + 45) : Math.max(20, achroTone - 30);
          data[i] = val;
          data[i + 1] = val;
          data[i + 2] = val;
        } else {
          if (isHighlight) {
            data[i] = hlR;
            data[i + 1] = hlG;
            data[i + 2] = hlB;
          } else {
            data[i] = targetRgb.r;
            data[i + 1] = targetRgb.g;
            data[i + 2] = targetRgb.b;
          }
        }
      }

      ctx.putImageData(imgData, 0, 0);
      c.canvas = c;
      c.elt = c;
      return canvasToP5Image(c);
    }

    function updateColoredSprites() {
      const isOriginalColors = (
        params.colorScheme === 'Original' &&
        params.color1 === '#3258e8' &&
        params.color2 === '#ebe045' &&
        params.color3 === '#f24f46' &&
        params.color4 === '#26c94a'
      );

      if (isOriginalColors && blue_sprite && blue_sprite.width > 1 && yellow_sprite && yellow_sprite.width > 1 && red_sprite && red_sprite.width > 1 && green_sprite && green_sprite.width > 1) {
        cachedSprites[0] = blue_sprite;
        cachedSprites[1] = yellow_sprite;
        cachedSprites[2] = red_sprite;
        cachedSprites[3] = green_sprite;
        return;
      }

      let base = blue_sprite;
      if (!base || !base.width || base.width <= 1) {
        if (!fallbackTemplateCanvas) {
          fallbackTemplateCanvas = createFallbackTemplate();
        }
        base = fallbackTemplateCanvas;
      }

      const colors = [params.color1, params.color2, params.color3, params.color4];
      const scheme = COLOR_SCHEMES[params.colorScheme];
      const isAchro = scheme && scheme.isAchromatic;
      const isAchroAccent = scheme && scheme.isAchromaticAccent;
      const isNeutralAccent = scheme && scheme.isNeutralAccent;

      const achroTones = [240, 185, 120, 55];

      for (let k = 0; k < 4; k++) {
        let recolored;
        if (isAchro) {
          recolored = renderRecoloredSprite(base, colors[k], true, achroTones[k]);
        } else if (isAchroAccent) {
          if (k === 0) {
            // Vivid red accent
            recolored = renderRecoloredSprite(base, colors[0], false);
          } else {
            recolored = renderRecoloredSprite(base, colors[k], true, achroTones[k - 1]);
          }
        } else if (isNeutralAccent) {
          // Accent on variant 0, refined neutrals on others
          recolored = renderRecoloredSprite(base, colors[k], false);
        } else {
          recolored = renderRecoloredSprite(base, colors[k], false);
        }
        if (recolored) {
          recolored.canvas = recolored.canvas || recolored;
          recolored.elt = recolored.elt || recolored;
        }
        cachedSprites[k] = recolored;
      }
    }

    function adjustCarCount(target) {
      while (bua.length < target) {
        const spriteIdx = Math.floor(random(4));
        const x = random(width);
        const y = random(height);
        bua.push(new Bu(x, y, spriteIdx));
      }
      while (bua.length > target) {
        bua.pop();
      }
    }

    function randomizeScene() {
      // 1. Pick a random color scheme from the 19 preconfigured schemes
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const chosenKey = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      params.colorScheme = chosenKey;
      applyScheme(chosenKey);

      // 2. Re-roll geometric parameters
      params.scale = Math.round((0.65 + Math.random() * 0.95) * 100) / 100;
      params.sliceSpacing = Math.round((0.65 + Math.random() * 0.85) * 100) / 100;
      params.zoneMultiplier = Math.round((0.7 + Math.random() * 1.5) * 100) / 100;
      params.carCount = Math.floor(25 + Math.random() * 35);
      adjustCarCount(params.carCount);

      // 3. Re-roll motion parameters
      params.topSpeed = Math.round(90 + Math.random() * 150);
      params.fearStrength = Math.round((0.4 + Math.random() * 1.8) * 100) / 100;
      params.flockAlignment = Math.round((0.04 + Math.random() * 0.21) * 100) / 100;
      params.visionAngle = Math.round((0.25 + Math.random() * 0.4) * 100) / 100;

      // 4. Re-roll car individual properties and impulse
      bua.forEach(b => {
        b.spriteIdx = Math.floor(Math.random() * 4);
        b.speedVariance = 0.8 + Math.random() * 0.4;
        b.radius = 10 * (0.8 + Math.random() * 0.4);
        b.zone = b.radius * 4 * (0.8 + Math.random() * 1.2);
        if (typeof p5 !== 'undefined' && p5.Vector && p5.Vector.fromAngle) {
          b.addForce(p5.Vector.fromAngle(Math.random() * TWO_PI, 60 + Math.random() * 100));
        }
      });

      // 5. Update control panel to reflect newly randomized parameters
      updateAllGuiDisplays();
    }

    function angleToP(p1, p2) {
      return Math.atan2(p2.y - p1.y, p2.x - p1.x);
    }

    function fmod(a, b) {
      return Number((a - Math.floor(a / b) * b).toPrecision(8));
    }

    class Bu {
      constructor(x, y, spriteIdx) {
        this.spriteIdx = spriteIdx !== undefined ? spriteIdx : Math.floor(random(4));
        this.position = createVector(x, y);
        this.radius = 10 * random(0.8, 1.2);
        this.speedVariance = random(0.8, 1.2);
        this.zone = this.radius * 4 * random(0.8, 2);
        this.drag = random(0.8, 0.9);
        this.velocity = createVector(0, 0);
        this.acceleration = createVector(0, 0);
        this.addForce(p5.Vector.fromAngle(random(TWO_PI), 100));
      }

      display() {
        let sprite = cachedSprites[this.spriteIdx] || blue_sprite;
        if (!sprite || !sprite.width || sprite.width <= 1) {
          if (!fallbackTemplateCanvas) fallbackTemplateCanvas = createFallbackTemplate();
          sprite = fallbackTemplateCanvas;
        }

        if (!sprite || !sprite.width) return;

        // Ensure sprite has .canvas and .elt so p5's internal image() pipeline never accesses undefined.width
        if (!sprite.canvas) sprite.canvas = sprite.elt || sprite;
        if (!sprite.elt) sprite.elt = sprite.canvas || sprite;

        const sliceCount = Math.floor(sprite.width / 38);
        const sW = sprite_size.x * params.scale;
        const sH = sprite_size.y * params.scale;

        for (let i = 0; i < sliceCount; i++) {
          push();
          translate(this.position.x, this.position.y - i * params.sliceSpacing);
          rotate(this.velocity.heading());
          image(
            sprite,
            -sW / 2,
            -sH / 2,
            sW,
            sH,
            sprite_size.x * i,
            0,
            sprite_size.x,
            sprite_size.y
          );
          pop();
        }
      }

      update() {
        this.velocity.add(this.acceleration);
        const currentTopSpeed = params.topSpeed * this.speedVariance;
        this.velocity.limit(currentTopSpeed);
        if (this.velocity.mag() < currentTopSpeed * 0.8) {
          this.velocity.setMag(currentTopSpeed * 0.8);
        }

        const dt = (typeof _targetFrameRate !== 'undefined' && _targetFrameRate > 0) ? (1 / _targetFrameRate) : (1 / 60);
        this.position.add(this.velocity.copy().mult(dt));
        this.acceleration.mult(0);

        const effZone = this.zone * params.zoneMultiplier;
        if (this.position.x < -effZone) {
          this.position.x = width + effZone;
        } else if (this.position.x > width + effZone) {
          this.position.x = -effZone;
        }

        if (this.position.y < -effZone) {
          this.position.y = height + effZone;
        } else if (this.position.y > height + effZone) {
          this.position.y = -effZone;
        }
      }

      addForce(vector) {
        this.acceleration.add(vector);
      }
    }

    function screenToWorld(sx, sy) {
      return {
        x: (sx - params.panX) / params.zoom,
        y: (sy - params.panY) / params.zoom
      };
    }

    // p5 Lifecycle hooks
    function preload() {
      blue_sprite = loadImage("https://i.ibb.co/q1zJs4q/blue.png");
      yellow_sprite = loadImage("https://i.ibb.co/ZJQ1LxB/yellow.png");
      red_sprite = loadImage("https://i.ibb.co/qCbqN92/red.png");
      green_sprite = loadImage("https://i.ibb.co/zncZjm9/green.png");
    }

    function setup() {
      createCanvas(windowWidth / 3, windowHeight / 3);
      noSmooth();

      updateColoredSprites();

      for (let i = 0; i < params.carCount; i++) {
        const spriteIdx = Math.floor(random(4));
        const x = random(width);
        const y = random(height);
        bua.push(new Bu(x, y, spriteIdx));
      }
    }

    function windowResized() {
      resizeCanvas(windowWidth / 3, windowHeight / 3);
      noSmooth();
    }

    function draw() {
      if (params.greenscreen) {
        background("#00ff00");
      } else {
        background(params.backgroundColor);
      }

      push();
      translate(params.panX, params.panY);
      scale(params.zoom);

      noFill();
      stroke(0);

      // Boid flocking & avoidance physics
      bua.forEach((b, current_id) => {
        let fear = createVector(0, 0);

        for (let other_id = 0; other_id < bua.length; other_id++) {
          if (current_id === other_id) continue;
          const other = bua[other_id];
          const dist_between = b.position.dist(other.position);
          const shared_zone = ((b.zone + other.zone) / 2) * params.zoneMultiplier;

          if (dist_between < shared_zone && dist_between > 0.0001) {
            const angle_away = angleToP(other.position, b.position);
            const angle_toward = angleToP(b.position, other.position);

            const vec = p5.Vector.fromAngle(angle_toward);

            if (b.velocity.angleBetween(vec) > Math.PI * params.visionAngle) continue;

            fear.add(
              p5.Vector.fromAngle(
                angle_away,
                map(dist_between, 0, shared_zone, 0.6 * params.fearStrength, 0)
              )
            );

            b.velocity = p5.Vector.lerp(b.velocity, other.velocity, params.flockAlignment);

            fear.add(
              p5.Vector.fromAngle(
                angle_toward,
                map(dist_between, 0, shared_zone, 0.1 * params.fearStrength, 0)
              )
            );
          }
        }
        b.addForce(fear);
      });

      // Depth sorting along Y axis for voxel stacking
      bua.sort((p1, p2) => p1.position.y - p2.position.y);

      bua.forEach((b) => {
        b.display();
        b.update();
      });

      pop();
    }

    // Zoom with wheel centered at cursor
    function mouseWheel(event) {
      if (event.target && event.target.closest && event.target.closest('.lil-gui')) {
        return true;
      }

      const zoomFactor = event.deltaY < 0 ? 1.09 : 0.91;
      const oldZoom = params.zoom;
      const newZoom = constrain(oldZoom * zoomFactor, 0.2, 5.0);

      // Center zoom around cursor position in canvas
      params.panX = mouseX - (mouseX - params.panX) * (newZoom / oldZoom);
      params.panY = mouseY - (mouseY - params.panY) * (newZoom / oldZoom);
      params.zoom = newZoom;

      zoomCtrl.updateDisplay();
      panXCtrl.updateDisplay();
      panYCtrl.updateDisplay();

      return false;
    }

    // Drag object / pan scene
    function mousePressed(event) {
      if (event.target && event.target.closest && event.target.closest('.lil-gui')) {
        return;
      }

      mouseDownPos = { x: mouseX, y: mouseY };
      isMouseDown = true;

      const wm = screenToWorld(mouseX, mouseY);

      // Check if user clicked on an individual car
      let picked = null;
      const hitRadius = Math.max(22 * params.scale, 18);
      for (let i = bua.length - 1; i >= 0; i--) {
        const d = dist(wm.x, wm.y, bua[i].position.x, bua[i].position.y);
        if (d < hitRadius) {
          picked = bua[i];
          break;
        }
      }

      if (picked) {
        draggedObject = picked;
        dragOffset = {
          x: picked.position.x - wm.x,
          y: picked.position.y - wm.y
        };
      } else {
        isPanning = true;
      }
    }

    function mouseDragged() {
      if (!isMouseDown) return;

      const wm = screenToWorld(mouseX, mouseY);
      const prevWm = screenToWorld(pmouseX, pmouseY);

      if (draggedObject) {
        draggedObject.position.x = wm.x + dragOffset.x;
        draggedObject.position.y = wm.y + dragOffset.y;
        draggedObject.velocity.set(
          (wm.x - prevWm.x) * 30,
          (wm.y - prevWm.y) * 30
        );
      } else if (isPanning) {
        params.panX += (mouseX - pmouseX);
        params.panY += (mouseY - pmouseY);
        panXCtrl.updateDisplay();
        panYCtrl.updateDisplay();
      }
    }

    function mouseReleased() {
      if (!isMouseDown) return;
      isMouseDown = false;

      const dragDistance = dist(mouseDownPos.x, mouseDownPos.y, mouseX, mouseY);

      // Pure click on scene without dragging triggers procedural randomization
      if (dragDistance < 5 && params.clickToRandomize) {
        randomizeScene();
      }

      draggedObject = null;
      isPanning = false;
    }

    // Guarantee that p5's internal image() renderer never fails when passed custom canvas/sprites
    if (typeof p5 !== 'undefined' && p5.prototype && p5.prototype.image) {
      const origImage = p5.prototype.image;
      p5.prototype.image = function(img) {
        if (img && typeof img === 'object') {
          if (!img.canvas) img.canvas = img.elt || img;
          if (!img.elt) img.elt = img.canvas || img;
        }
        return origImage.apply(this, arguments);
      };
    }

    // Attach p5 lifecycle to window for global mode
    window.preload = preload;
    window.setup = setup;
    window.windowResized = windowResized;
    window.draw = draw;
    window.mouseWheel = mouseWheel;
    window.mousePressed = mousePressed;
    window.mouseDragged = mouseDragged;
    window.mouseReleased = mouseReleased;
  </script>
</body>
</html>
