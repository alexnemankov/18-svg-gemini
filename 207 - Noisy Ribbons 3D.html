<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noisy Ribbons 3D</title>
  <style>
    body {
      overflow: hidden;
      margin: 0;
      background-color: #000;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
      }
    }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GUI } from "lil-gui";

let noise = `//	Simplex 3D Noise 
//	by Ian McEwan, Ashima Arts
//
vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x, 289.0);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159 - 0.85373472095314 * r;}

float snoise(vec3 v){ 
  const vec2  C = vec2(1.0/6.0, 1.0/3.0) ;
  const vec4  D = vec4(0.0, 0.5, 1.0, 2.0);

// First corner
  vec3 i  = floor(v + dot(v, C.yyy) );
  vec3 x0 =   v - i + dot(i, C.xxx) ;

// Other corners
  vec3 g = step(x0.yzx, x0.xyz);
  vec3 l = 1.0 - g;
  vec3 i1 = min( g.xyz, l.zxy );
  vec3 i2 = max( g.xyz, l.zxy );

  //  x0 = x0 - 0. + 0.0 * C 
  vec3 x1 = x0 - i1 + 1.0 * C.xxx;
  vec3 x2 = x0 - i2 + 2.0 * C.xxx;
  vec3 x3 = x0 - 1. + 3.0 * C.xxx;

// Permutations
  i = mod(i, 289.0 ); 
  vec4 p = permute( permute( permute( 
             i.z + vec4(0.0, i1.z, i2.z, 1.0 ))
           + i.y + vec4(0.0, i1.y, i2.y, 1.0 )) 
           + i.x + vec4(0.0, i1.x, i2.x, 1.0 ));

// Gradients
// ( N*N points uniformly over a square, mapped onto an octahedron.)
  float n_ = 1.0/7.0; // N=7
  vec3  ns = n_ * D.wyz - D.xzx;

  vec4 j = p - 49.0 * floor(p * ns.z *ns.z);  //  mod(p,N*N)

  vec4 x_ = floor(j * ns.z);
  vec4 y_ = floor(j - 7.0 * x_ );    // mod(j,N)

  vec4 x = x_ *ns.x + ns.yyyy;
  vec4 y = y_ *ns.x + ns.yyyy;
  vec4 h = 1.0 - abs(x) - abs(y);

  vec4 b0 = vec4( x.xy, y.xy );
  vec4 b1 = vec4( x.zw, y.zw );

  vec4 s0 = floor(b0)*2.0 + 1.0;
  vec4 s1 = floor(b1)*2.0 + 1.0;
  vec4 sh = -step(h, vec4(0.0));

  vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ;
  vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ;

  vec3 p0 = vec3(a0.xy,h.x);
  vec3 p1 = vec3(a0.zw,h.y);
  vec3 p2 = vec3(a1.xy,h.z);
  vec3 p3 = vec3(a1.zw,h.w);

//Normalise gradients
  vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
  p0 *= norm.x;
  p1 *= norm.y;
  p2 *= norm.z;
  p3 *= norm.w;

// Mix final noise value
  vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
  m = m * m;
  return 42.0 * dot( m*m, vec4( dot(p0,x0), dot(p1,x1), 
                                dot(p2,x2), dot(p3,x3) ) );
}`;

console.clear();

// load fonts
await (async function () {
  async function loadFont(fontface) {
    try {
      await fontface.load();
      document.fonts.add(fontface);
    } catch (e) {
      console.warn("Font loading fallback", e);
    }
  }
  let fonts = [
    new FontFace(
      "Neonderthaw",
      "url(https://fonts.gstatic.com/s/neonderthaw/v6/Iure6Yx5-oWVZI0r-17AeaZOrLQ.woff2)"
    ),
    new FontFace(
      "TiltNeon",
      "url(https://fonts.gstatic.com/s/tiltneon/v10/E21L_d7gguXdwD9LEFY2WCeElCNtd-eBqpHp1TzrkJSmwpj5ndxquUK6UOc.woff2)"
    ),
    new FontFace(
      "Michroma",
      "url(https://fonts.gstatic.com/s/michroma/v19/PN_zRfy9qWD8fEagAPg9pTk.woff2)"
    )
  ];
  for (let font of fonts) {
    await loadFont(font);
  }
})();

class FloorBase extends THREE.Mesh {
  constructor() {    
    let hfs = 50; // half floor size
    let hhs = 5; // half hole size;
    let floorShape = new THREE.Shape(
      [
        [hfs, hfs],
        [hfs, -hfs],
        [-hfs, -hfs],
        [-hfs, hfs]
      ].map((p) => {
        return new THREE.Vector2(p[0], p[1]);
      })
    );
    let floorHole = new THREE.Path()
      .moveTo(hhs, hhs)
      .lineTo(hhs, -hhs)
      .lineTo(-hhs, -hhs)
      .lineTo(-hhs, hhs)
      .lineTo(hhs, hhs);
    floorShape.holes.push(floorHole);
    super();
    this.camPosition = {value: new THREE.Vector3()};
    this.geometry = new THREE.ShapeGeometry(floorShape).rotateX(Math.PI * -0.5);
    this.material = new THREE.MeshStandardMaterial({
      color: 0x11111b,
      roughness: 0.4,
      metalness: 0.2,
      onBeforeCompile: shader => {
        shader.uniforms.camPosition = this.camPosition;
        shader.uniforms.textTexture = {value: getTexture()};
        shader.vertexShader = `
          uniform vec3 camPosition;
          varying vec3 vPos;
          mat2 rot2d(float a){return mat2(cos(a), sin(a), -sin(a), cos(a));}
          ${shader.vertexShader}
        `.replace(
          `#include <begin_vertex>`,
          `#include <begin_vertex>
            float a = atan(camPosition.z, camPosition.x) - PI * 0.375;
            float hPI = PI * 0.5;
            a = floor(a / hPI) * hPI; 
            vPos = position;
            vPos.xz *= rot2d(a);
          `
        );
        shader.fragmentShader = `
          uniform sampler2D textTexture;
          varying vec3 vPos;
          ${shader.fragmentShader}
        `.replace(
          `#include <map_fragment>`,
          `
            float patchW = 7.;
            float patchH = patchW / 8.;
            vec2 patchC = vec2(-1.5, 5. + patchH * 0.5);
            vec2 uv = (vPos.xz - (patchC + vec2(-patchW, -patchH) * 0.5)) / vec2(patchW, patchH);
            uv.y = 1. - uv.y;
            
            vec4 sampledDiffuseColor = texture2D( textTexture, uv );
            diffuseColor *= sampledDiffuseColor;
          `
        );
      }
    });
    
    function getTexture(){
      let c = document.createElement("canvas");
      c.width = 1024;
      c.height = 128;
      
      let ctx = c.getContext("2d");
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, c.width, c.height);
      
      // Text "849 # Noisy ribbons" removed
      
      let texture = new THREE.CanvasTexture(c);
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }
  }
  
  update(camera){
    this.worldToLocal(this.camPosition.value.copy(camera.position));
  }
}

class Ribbons extends THREE.Mesh {
  constructor(gu, amount) {
    let totalSize = 10;
    let g = new THREE.InstancedBufferGeometry().copy(
      new THREE.PlaneGeometry(1, 1, 200, 1)
        .translate(0, 0.5, 0)
        .rotateX(Math.PI * -0.5)
    );
    g.instanceCount = amount;
    
    let getHeight = `
          float getHeight(vec3 data){
            float amp = uAmp;
            float freq = uFreq;
            data.x *= freq;
            float n = snoise(data);
            return n * n * amp;
          }`;
    let compute = `
            float stripeWidth = ${totalSize}. / ${amount}.;
            float iID = float(gl_InstanceID);
            
            vec3 pos = vec3(position);
            
            pos.xz *= vec2(${totalSize}., stripeWidth);
            float zPos = 5. - stripeWidth * iID;
            pos.z += zPos;
            
            float lenRatio = smoothstep(4.9, 1., abs(pos.x));
            float wdtRatio = 0.1 + smoothstep(5., 1., abs(zPos - stripeWidth * 0.5)) * 0.5;
            
            float t = time * 0.25;
            float t2 = time * 0.5;
            
            float h = getHeight(vec3(pos.x + t2, zPos * 0.25, t));
            h *= lenRatio * wdtRatio;
            pos.y = h;
    `;
    let m = new THREE.MeshStandardMaterial({
      side: THREE.DoubleSide,
      roughness: 0.3,
      metalness: 0.4,
      onBeforeCompile: (shader) => {
        shader.uniforms.time = gu.time;
        shader.uniforms.uAmp = gu.amp;
        shader.uniforms.uFreq = gu.freq;
        shader.uniforms.uColor1 = gu.color1;
        shader.uniforms.uColor2 = gu.color2;

        shader.vertexShader = `
          uniform float time;
          uniform float uAmp;
          uniform float uFreq;
          varying float vNormHeight;
          ${noise}
          ${getHeight}
          
          ${shader.vertexShader}
        `.replace(
          `#include <beginnormal_vertex>`,
          `#include <beginnormal_vertex>
          
            ${compute}
            
            float h2 = getHeight(vec3(pos.x + t2 + 0.1, zPos * 0.25, t));
            h2 *= lenRatio * wdtRatio;
            objectNormal = normalize(vec3(h - h2, 0.1, 0.));
            vNormHeight = clamp(h / max(uAmp, 0.001), 0.0, 1.0);
          `
        ).replace(
          `#include <begin_vertex>`,
          `#include <begin_vertex>
          
            transformed = pos;
          `
        );

        shader.fragmentShader = `
          uniform vec3 uColor1;
          uniform vec3 uColor2;
          varying float vNormHeight;
          ${shader.fragmentShader}
        `.replace(
          `#include <map_fragment>`,
          `#include <map_fragment>
            vec3 gradColor = mix(uColor1, uColor2, vNormHeight);
            diffuseColor.rgb *= gradColor;
          `
        );
      }
    });
    super(g, m);

    this.customDepthMaterial = new THREE.MeshDepthMaterial({
      depthPacking: THREE.RGBADepthPacking,
      side: THREE.DoubleSide,
      onBeforeCompile: shader => {
        shader.uniforms.time = gu.time;
        shader.uniforms.uAmp = gu.amp;
        shader.uniforms.uFreq = gu.freq;
        shader.vertexShader = `
          uniform float time;
          uniform float uAmp;
          uniform float uFreq;
          ${noise}
          ${getHeight}
          
          ${shader.vertexShader}
        `.replace(
          `#include <begin_vertex>`,
          `#include <begin_vertex>
          
            ${compute}
            
            transformed = pos;
          `
        );
      }
    });
  }
}

let gu = {
  time: { value: 0 },
  amp: { value: 10.0 },
  freq: { value: 0.25 },
  color1: { value: new THREE.Color("#ff0055") },
  color2: { value: new THREE.Color("#00e5ff") }
};

let scene = new THREE.Scene();
scene.background = new THREE.Color("#0a0814");

let camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 1, 1000);
camera.position.set(1, 1, 0.75).setLength(25);

let renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

window.addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.enableZoom = true;
controls.enablePan = true;
controls.panSpeed = 1.0;
controls.zoomSpeed = 1.2;
controls.maxPolarAngle = Math.PI / 3;

let camShift = 1;
controls.target.set(0, -camShift, 0);
camera.position.y -= camShift;

let light = new THREE.DirectionalLight(0xffffff, Math.PI * 1);
light.position.set(0, 4, 5);
light.castShadow = true;
let shadowCamSize = 6;
light.shadow.camera.left = -shadowCamSize;
light.shadow.camera.right = shadowCamSize;
light.shadow.camera.top = shadowCamSize;
light.shadow.camera.bottom = -shadowCamSize;
light.shadow.camera.near = 0.1;
light.shadow.camera.far = 50;
light.shadow.mapSize.width = 2048;
light.shadow.mapSize.height = 2048;
light.shadow.bias = -0.001;

let ambientLight = new THREE.AmbientLight(0xffffff, Math.PI * 0.5);
scene.add(light, ambientLight);

let floorBase = new FloorBase();
floorBase.receiveShadow = true;
scene.add(floorBase);

let stripes = new Ribbons(gu, 17);
stripes.castShadow = true;
stripes.receiveShadow = true;
scene.add(stripes);

// 5 Preset Color Schemes (Matching White or Matching Black background & floor base)
const colorPresets = {
  "Cyber Neon (Black)": {
    stripeColor1: "#ff0055",
    stripeColor2: "#00e5ff",
    floorColor: "#000000",
    bgColor: "#000000",
    lightColor: "#ffffff"
  },
  "Studio White (White)": {
    stripeColor1: "#ff2a5f",
    stripeColor2: "#0077ff",
    floorColor: "#ffffff",
    bgColor: "#ffffff",
    lightColor: "#ffffff"
  },
  "Emerald Matrix (Black)": {
    stripeColor1: "#39ff14",
    stripeColor2: "#00ffd5",
    floorColor: "#000000",
    bgColor: "#000000",
    lightColor: "#ffffff"
  },
  "Vivid Coral (White)": {
    stripeColor1: "#ff5500",
    stripeColor2: "#9900ff",
    floorColor: "#ffffff",
    bgColor: "#ffffff",
    lightColor: "#ffffff"
  },
  "Electric Violet (Black)": {
    stripeColor1: "#8a2be2",
    stripeColor2: "#ff1493",
    floorColor: "#000000",
    bgColor: "#000000",
    lightColor: "#ffffff"
  }
};

let params = {
  colorScheme: "Cyber Neon (Black)",
  greenscreen: false,
  stripeColor1: colorPresets["Cyber Neon (Black)"].stripeColor1,
  stripeColor2: colorPresets["Cyber Neon (Black)"].stripeColor2,
  floorColor: colorPresets["Cyber Neon (Black)"].floorColor,
  bgColor: colorPresets["Cyber Neon (Black)"].bgColor,
  lightColor: "#ffffff",
  
  cameraMotion: "Cinematic Sweep",
  animSpeed: 1.0,
  amplitude: 10.0,
  frequency: 0.25,
  dpr: Math.min(window.devicePixelRatio, 2),
  clickToRandomize: true,
  randomizeNow: () => randomizeScene()
};

function updateVisuals() {
  gu.color1.value.set(params.stripeColor1);
  gu.color2.value.set(params.stripeColor2);
  gu.amp.value = params.amplitude;
  gu.freq.value = params.frequency;
  
  floorBase.material.color.set(params.floorColor);
  light.color.set(params.lightColor);
  
  if (params.greenscreen) {
    scene.background.set("#00ff00");
  } else {
    scene.background.set(params.bgColor);
  }
}

function applyColorScheme(schemeName) {
  const p = colorPresets[schemeName];
  if (!p) return;
  params.stripeColor1 = p.stripeColor1;
  params.stripeColor2 = p.stripeColor2;
  params.floorColor = p.floorColor;
  params.bgColor = p.bgColor;
  params.lightColor = "#ffffff";
  
  updateVisuals();
  gui.controllersRecursive().forEach((c) => c.updateDisplay());
}

function randomizeScene() {
  const isWhiteBase = Math.random() > 0.5;
  const hue1 = Math.random();
  const hue2 = (hue1 + 0.2 + Math.random() * 0.4) % 1.0;

  params.lightColor = "#ffffff";

  if (isWhiteBase) {
    // Both White Theme
    params.bgColor = "#ffffff";
    params.floorColor = "#ffffff";
    
    // Rich saturated ribbon colors for crisp white background
    const c1 = new THREE.Color().setHSL(hue1, 0.9, 0.4);
    const c2 = new THREE.Color().setHSL(hue2, 0.9, 0.45);
    params.stripeColor1 = "#" + c1.getHexString();
    params.stripeColor2 = "#" + c2.getHexString();
  } else {
    // Both Black Theme
    params.bgColor = "#000000";
    params.floorColor = "#000000";
    
    // Vibrant glowing ribbon colors for deep black background
    const c1 = new THREE.Color().setHSL(hue1, 0.95, 0.55);
    const c2 = new THREE.Color().setHSL(hue2, 0.95, 0.6);
    params.stripeColor1 = "#" + c1.getHexString();
    params.stripeColor2 = "#" + c2.getHexString();
  }

  params.animSpeed = parseFloat((0.4 + Math.random() * 1.6).toFixed(2));
  params.amplitude = parseFloat((5.0 + Math.random() * 13.0).toFixed(1));
  params.frequency = parseFloat((0.1 + Math.random() * 0.35).toFixed(2));
  
  updateVisuals();
  gui.controllersRecursive().forEach((c) => c.updateDisplay());
}

// lil-gui setup
const gui = new GUI({ title: "Noisy Ribbons" });

gui.add(params, "colorScheme", Object.keys(colorPresets)).name("Color Scheme").onChange((val) => {
  applyColorScheme(val);
});

gui.add(params, "cameraMotion", [
  "Cinematic Sweep",
  "Gentle Orbit",
  "Wave Pulse",
  "Side Sway",
  "Static Camera"
]).name("Camera Motion");

const fColors = gui.addFolder("Colors");
fColors.add(params, "greenscreen").name("Greenscreen (#00ff00)").onChange(() => updateVisuals());
fColors.addColor(params, "stripeColor1").name("Ribbon Primary").onChange(() => updateVisuals());
fColors.addColor(params, "stripeColor2").name("Ribbon Secondary").onChange(() => updateVisuals());
fColors.addColor(params, "floorColor").name("Floor Base").onChange(() => updateVisuals());
fColors.addColor(params, "bgColor").name("Background").onChange(() => updateVisuals());
fColors.addColor(params, "lightColor").name("Key Light").onChange(() => updateVisuals());

const fMotion = gui.addFolder("Motion & Shader");
fMotion.add(params, "animSpeed", 0.0, 3.0, 0.1).name("Anim Speed");
fMotion.add(params, "amplitude", 2.0, 20.0, 0.5).name("Amplitude").onChange(() => updateVisuals());
fMotion.add(params, "frequency", 0.05, 0.8, 0.01).name("Frequency").onChange(() => updateVisuals());

const fSystem = gui.addFolder("System");
fSystem.add(params, "dpr", 0.5, 2.5, 0.1).name("DPR (Pixel Ratio)").onChange((val) => {
  renderer.setPixelRatio(val);
});
fSystem.add(params, "clickToRandomize").name("Click Randomizer");
fSystem.add(params, "randomizeNow").name("⚡ Randomize Scene");

// Initial visual sync
updateVisuals();

// Hide/Show UI with 'H' key
window.addEventListener("keydown", (e) => {
  if (e.key === "h" || e.key === "H") {
    if (gui._hidden) {
      gui.show();
    } else {
      gui.hide();
    }
  }
});

// Click randomizer interaction
let pointerDownTime = 0;
let pointerDownPos = { x: 0, y: 0 };

window.addEventListener("pointerdown", (e) => {
  if (e.target.closest && e.target.closest(".lil-gui")) return;
  pointerDownTime = performance.now();
  pointerDownPos.x = e.clientX;
  pointerDownPos.y = e.clientY;
});

window.addEventListener("pointerup", (e) => {
  if (e.target.closest && e.target.closest(".lil-gui")) return;
  if (!params.clickToRandomize) return;
  
  let dt = performance.now() - pointerDownTime;
  let dx = e.clientX - pointerDownPos.x;
  let dy = e.clientY - pointerDownPos.y;
  let dist = Math.sqrt(dx * dx + dy * dy);
  
  if (dist < 5 && dt < 300) {
    randomizeScene();
  }
});

let isUserInteracting = false;
let userInteractionTimer = null;

controls.addEventListener("start", () => {
  isUserInteracting = true;
  if (userInteractionTimer) clearTimeout(userInteractionTimer);
});

controls.addEventListener("end", () => {
  if (userInteractionTimer) clearTimeout(userInteractionTimer);
  userInteractionTimer = setTimeout(() => {
    isUserInteracting = false;
  }, 2500);
});

let clock = new THREE.Clock();
let t = 0;

renderer.setAnimationLoop(() => {
  let dt = clock.getDelta();
  t += dt * params.animSpeed;
  gu.time.value = t;

  if (params.cameraMotion !== "Static Camera" && !isUserInteracting) {
    let camRadius = 25;
    if (params.cameraMotion === "Cinematic Sweep") {
      let a = t * 0.12;
      camera.position.x = Math.cos(a) * 22;
      camera.position.z = Math.sin(a) * 22;
      camera.position.y = 10 + Math.sin(t * 0.15) * 4 - camShift;
    } else if (params.cameraMotion === "Gentle Orbit") {
      let a = t * 0.08;
      camera.position.x = Math.cos(a) * camRadius;
      camera.position.z = Math.sin(a) * camRadius;
    } else if (params.cameraMotion === "Wave Pulse") {
      let dist = 22 + Math.sin(t * 0.2) * 5;
      let a = t * 0.06;
      camera.position.x = Math.cos(a) * dist;
      camera.position.z = Math.sin(a) * dist;
      camera.position.y = 10 + Math.cos(t * 0.15) * 3 - camShift;
    } else if (params.cameraMotion === "Side Sway") {
      let sway = Math.sin(t * 0.15) * 10;
      camera.position.x = sway;
      camera.position.z = 22;
      camera.position.y = 12 + Math.cos(t * 0.1) * 2 - camShift;
    }
  }

  controls.update();
  floorBase.update(camera);
  renderer.render(scene, camera);
});
</script>
</body>
</html>
