<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#030805">
  <meta name="description" content="Vermilion and cobalt. A living botanical sculpture, made entirely of procedural geometry and light.">
  <link rel="icon" href="data:,">
  <title>Vermilion — a botanical study</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #030805; }
    canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; cursor: grab; }
    canvas:active { cursor: grabbing; }
    #notice { position: fixed; inset: 0; display: grid; place-content: center; padding: 32px;
      color: #b7b9aa; font: 12px/1.8 system-ui, sans-serif; text-align: center; letter-spacing: .08em; }
    #notice[hidden] { display: none; }
    @media (prefers-reduced-motion: reduce) { canvas { animation: none; } }
  </style>
</head>
<body>
  <div id="notice" role="status">Preparing the botanical study…</div>
  <script type="module">
  /*
   * VERMILION
   * No models, textures, images, postprocessing, or generated assets.
   * Dependencies are pinned Three.js and unmodified lil-gui. Open this HTML directly
   * with an internet connection, or serve it from any static web server.
   * All animated terms are integer harmonics of one 24-second phase.
   * Space pauses; R restarts; H toggles the panel. No on-screen instructions.
   */
  const notice = document.querySelector('#notice');
  let THREE, GUI;
  try {
    [THREE, { default: GUI }] = await Promise.all([
      import('https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js'),
      import('https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js')
    ]);
  } catch (error) {
    notice.textContent = 'Unable to load the artwork libraries. Please check your connection and reload.';
    throw error;
  }

  const TAU = Math.PI * 2;
  const LOOP = 24;
  // Nineteen scheme families; polarity exposes both achromatic versions without
  // adding duplicate entries to the scheme menu. Palette order is highlight,
  // petals, foliage, stems, shadows, background. Every supplied hex is retained.
  const palettes = {
    'Original': ['FFC36B','D52B0A','064ED7','AD642B','220901','030805'],
    'Monochromatic': ['FFD4B8','E96930','8E351E','B3522C','230B06','090402'],
    'Analogous': ['FFE598','E84120','B83365','A76A36','2E1022','090407'],
    'Complementary': ['FFD39B','E74721','087DB7','AE713B','10252E','03090C'],
    'Split-complementary': ['FFE4A8','ED5427','2E65CF','388A89','14132F','05060D'],
    'Triadic': ['F6D76A','D93442','2663BD','86A449','1C2336','05070A'],
    'Tetradic': ['FFD264','DC3D2C','2659B4','47935C','2B1635','08050C'],
    'Double split-complementary': ['EDC882','CF526F','487DBD','739265','302239','08060C'],
    'Achromatic': ['FFFFFF','D9D9D9','AAAAAA','999999','202020','000000'],
    'Achromatic + Accent': ['E52D35','D9D9D9','AAAAAA','999999','202020','000000'],
    'Neutral + accent': ['E6A943','C5BAA7','7F8986','A49A87','282B29','090B0A'],
    'Amber / oxblood': ['F6AA1C','BC3908','941B0C','F6AA1C','220901','080201'],
    'Glacial teal': ['63D1CF','5BC0BE','4BAD9E','4BAD9E','0B132B','000000'],
    'Orchid / mauve': ['AA60C8','D69ADE','C9A3C6','CFB5C2','0D001D','120A12'],
    'Saffron / lagoon': ['FEF1BE','FFBA00','008189','00474D','061210','061210'],
    'Chartreuse / jade': ['D4FFB0','7FFF00','00B894','0A3322','05140A','05140A'],
    'Tangerine / plum': ['FFE8CC','FF8C00','C7501A','3D1050','0E0618','0E0618'],
    'Lavender / ultramarine': ['E8E0FF','B38FFF','6A3DE8','1A1250','090612','090612'],
    'Cyan / magenta': ['E0FBFF','00F0FF','D40078','1E0A3D','05020F','05020F']
  };
  const animations = [
    'Botanical breeze', 'Petal breathing', 'Leaf tide', 'Evening drift',
    'Bloom reverie', 'Gentle orbit', 'Orbital ellipse', 'Pendulum orbit', 'Static'
  ];
  const motionQuery = matchMedia('(prefers-reduced-motion: reduce)');
  const settings = {
    scheme: 'Original', polarity: 'Light on dark',
    highlight: '#ffc36b', petals: '#d52b0a', foliage: '#064ed7',
    veins: '#126cff', stems: '#ad642b', shadows: '#220901', background: '#030805',
    greenscreen: false, pixelRatio: Math.min(devicePixelRatio || 1, 1.75),
    animation: motionQuery.matches ? 'Static' : 'Botanical breeze', speed: 1,
    wind: 1, flutter: 1, cameraMotion: 1, azimuth: 0, elevation: 0,
    orbitAngle: 18, zoom: 1, panX: 0, panY: 0,
    shapeSeed: 0, petalWidth: 1, petalCurl: 1, folds: 1, leafWidth: 1,
    clickRandomize: true, exposure: 1.12,
    randomize: () => randomizeScene(),
    resetView: () => { settings.zoom = 1; settings.panX = settings.panY = 0;
      settings.azimuth = settings.elevation = 0; refreshGUI(); }
  };
  const colorKeys = ['highlight','petals','foliage','stems','shadows','background'];
  const colorUniforms = Object.fromEntries(
    [...colorKeys.filter(key => key !== 'background'), 'veins'].map(key =>
      [key, { value: new THREE.Color(settings[key]) }])
  );
  const motionUniforms = {
    bend: { value: 1 }, ripple: { value: 1 }, shape: { value: 0 }
  };
  const scene = new THREE.Scene();
  scene.background = new THREE.Color('#030805');
  const camera = new THREE.OrthographicCamera(-4, 4, 6, -6, .1, 60);
  camera.position.set(0, 4.8, 20);
  camera.lookAt(0, 4.8, 0);

  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
  } catch (error) {
    notice.textContent = 'This botanical study needs a browser with WebGL enabled.';
    throw error;
  }
  renderer.setClearColor('#030805');
  renderer.setPixelRatio(settings.pixelRatio);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.12;
  renderer.domElement.setAttribute('aria-label', 'Slowly breathing vermilion poppy with marbled golden petals, two buds, and cobalt-blue leaves against black.');
  renderer.domElement.setAttribute('role', 'img');
  document.body.append(renderer.domElement);

  // Deterministic geometry: reloading never changes the arrangement.
  let seed = 76131;
  function random() {
    seed = (Math.imul(1664525, seed) + 1013904223) >>> 0;
    return seed / 4294967296;
  }
  const phase = { value: 0 };
  const V = (x, y, z = 0) => new THREE.Vector3(x, y, z);

  const noiseGLSL = /* glsl */`
    float hash(vec2 p) {
      vec3 q = fract(vec3(p.xyx) * .1031);
      q += dot(q, q.yzx + 33.33);
      return fract((q.x + q.y) * q.z);
    }
    float noise(vec2 p) {
      vec2 i = floor(p), f = fract(p);
      f = f * f * (3.0 - 2.0 * f);
      return mix(mix(hash(i), hash(i + vec2(1,0)), f.x),
                 mix(hash(i + vec2(0,1)), hash(i + vec2(1,1)), f.x), f.y);
    }
    float fbm(vec2 p) {
      float f = 0.0;
      f += .53 * noise(p); p = mat2(.8,-.6,.6,.8) * p * 2.07 + 7.1;
      f += .27 * noise(p); p = mat2(.8,-.6,.6,.8) * p * 2.03 + 3.7;
      f += .13 * noise(p); p = p * 2.11 + 9.2;
      f += .07 * noise(p);
      return f;
    }
  `;

  const vertexShader = /* glsl */`
    uniform float uPhase;
    uniform float uSeed;
    uniform float uKind;
    uniform float uBend;
    uniform float uRipple;
    varying vec2 vUv;
    varying vec3 vWorld;
    varying float vDepth;
    void main() {
      vUv = uv;
      vec3 p = position;
      if (uKind < 1.5) {
        float envelope = pow(uv.y, 1.65);
        float petal = 1.0 - step(.5, uKind);
        // Fine waves travel continuously and return exactly to their first state.
        p.z += uRipple * envelope * (.021 + .015 * petal) *
          sin(uPhase + uSeed + uv.y * 5.0 + uv.x * 4.0);
        p.z += uRipple * envelope * .012 * sin(2.0 * uPhase - uv.x * 9.0 + uSeed);
        p.x += uRipple * envelope * .010 * sin(uPhase + uSeed + uv.y * 3.0);
      }
      #ifdef USE_INSTANCING
        p = (instanceMatrix * vec4(p, 1.0)).xyz;
      #endif
      vec4 world = modelMatrix * vec4(p, 1.0);
      // One continuous displacement field keeps stems and attachment points joined.
      float h = max(world.y + .9, 0.0) / 9.6;
      world.x += uBend * (.064 * h * h * sin(uPhase) + .018 * h * sin(2.0 * uPhase + world.y * .3));
      world.z += uBend * .032 * h * sin(uPhase + .8);
      vWorld = world.xyz;
      vec4 view = viewMatrix * world;
      vDepth = -view.z;
      gl_Position = projectionMatrix * view;
    }
  `;

  const fragmentShader = /* glsl */`
    uniform float uSeed;
    uniform float uKind;
    uniform float uShade;
    uniform float uShape;
    uniform vec3 uHighlight;
    uniform vec3 uPetals;
    uniform vec3 uFoliage;
    uniform vec3 uVeins;
    uniform vec3 uStems;
    uniform vec3 uShadows;
    varying vec2 vUv;
    varying vec3 vWorld;
    varying float vDepth;
    ${noiseGLSL}

    // Screen-space bump gradients preserve the tiny ridges as surfaces deform.
    vec3 bump(vec3 n, float height, float amount) {
      vec3 q0 = dFdx(vWorld), q1 = dFdy(vWorld);
      vec3 r0 = cross(q1, n), r1 = cross(n, q0);
      float det = dot(q0, r0);
      vec3 grad = sign(det) * (dFdx(height) * r0 + dFdy(height) * r1);
      return normalize(abs(det) * n - amount * grad);
    }

    void main() {
      vec2 uv = vUv;
      vec3 n = normalize(cross(dFdx(vWorld), dFdy(vWorld)));
      vec3 viewDir = normalize(cameraPosition - vWorld);
      if (dot(n, viewDir) < 0.0) n = -n;
      vec3 key = normalize(vec3(-.65, .9, 1.25));
      vec3 cool = normalize(vec3(-.8, .5, 1.5));
      float grain = noise(uv * vec2(490.0, 390.0) + uSeed);
      vec3 color;

      if (uKind < .5) {
        vec2 p = vec2(uv.x * 7.5, uv.y * 3.7) + uSeed * 2.1 + uShape;
        float warp = fbm(p * 1.35 + vec2(2.7, 6.1));
        float flow = uv.x * 36.0 + warp * 9.0 +
          1.7 * sin(uv.y * 6.5 + uSeed) + noise(p * 3.8) * 1.9;
        float stripe = .5 + .5 * sin(flow);
        float gold = smoothstep(.64, .98, stripe + .12 * fbm(p * 4.0));
        float fine = sin(flow * 3.8 + noise(p * 9.0) * 2.0);
        vec3 scarlet = mix(mix(uShadows, uPetals, .38), uPetals * 1.28, warp);
        vec3 amber = mix(mix(uPetals, uHighlight, .38), uHighlight, smoothstep(.78, 1.0, stripe));
        vec3 albedo = mix(scarlet, amber, gold * .88);
        float hairline = pow(.5 + .5 * sin(flow * 2.7 + warp * 5.0), 18.0);
        albedo = mix(albedo, uHighlight * 1.15, hairline * gold * .45);
        albedo *= .86 + .20 * grain + .055 * fine;
        float fiber = noise(vec2(uv.x * 730.0 + warp * 9.0, uv.y * 20.0));
        n = bump(n, .45 * fiber + .3 * fine + grain * .1, .0023);
        float diffuse = max(dot(n, key), 0.0);
        float backlight = pow(max(dot(-n, key), 0.0), 1.5);
        float rim = pow(1.0 - max(dot(n, viewDir), 0.0), 3.2);
        float rootAO = smoothstep(.0, .28, uv.y);
        float light = .12 + .88 * diffuse + .25 * backlight;
        color = albedo * light * mix(.25, 1.0, rootAO) * uShade;
        // Warm transmitted light catches the thin tissue without a bloom pass.
        color += albedo * rim * .18 * rootAO;
        float edge = smoothstep(.95, 1.0, uv.y) + smoothstep(.94, 1.0, abs(uv.x * 2.0 - 1.0));
        color += mix(uPetals, uHighlight, .4) * edge * (.12 + .22 * diffuse);
        vec3 halfDir = normalize(key + viewDir);
        color += uHighlight * pow(max(dot(n, halfDir), 0.0), 55.0) * .045;
      } else if (uKind < 1.5) {
        float s = abs(uv.x * 2.0 - 1.0);
        float ribs = (uv.y - s * .24 + .015 * sin(s * 12.0)) * 10.0;
        float veinDist = abs(fract(ribs + .5) - .5);
        float veins = 1.0 - smoothstep(.012, .045, veinDist);
        veins *= 1.0 - smoothstep(.75, .99, s);
        float midrib = exp(-s * 95.0);
        float fineRibs = sin((uv.y - s * .27) * 340.0 + noise(uv * 40.0) * 2.0);
        float tissue = fbm(uv * vec2(37.0, 42.0) + uSeed);
        n = bump(n, tissue * .30 + grain * .14 + fineRibs * .045 + veins * .12, .0033);
        float light = pow(max(dot(n, cool), 0.0), 1.2);
        float fold = .50 + .50 * smoothstep(.18, .75, tissue);
        vec3 blue = mix(uFoliage * .075, uFoliage * 1.22, light);
        color = blue * fold * uShade * (.45 + .65 * light);
        color += uVeins * .23 * veins * (.2 + .8 * light);
        color += uVeins * .34 * midrib * (.2 + .8 * light);
        color *= .88 + grain * .23;
        color *= mix(.25, 1.0, smoothstep(0.0, .18, uv.y));
        float edge = smoothstep(.95, 1.0, s);
        color += uVeins * .25 * edge * light * .35;
        color += uVeins * pow(max(dot(n, normalize(cool + viewDir)), 0.0), 65.0) * .09;
      } else if (uKind < 2.5) {
        float threads = noise(vec2(uv.x * 49.0, uv.y * 260.0) + uSeed);
        n = bump(n, threads, .001);
        float light = max(dot(n, key), 0.0);
        vec3 brown = mix(uStems * .08, uStems * .9, threads);
        color = brown * (.16 + light * 1.2) * uShade;
        float rim = pow(1.0 - max(dot(n, viewDir), 0.0), 2.5);
        color += uStems * rim * light * .8;
        color += mix(uStems, uHighlight, .3) * pow(max(dot(n, normalize(key + viewDir)), 0.0), 37.0) * .20;
      } else {
        float fur = noise(uv * vec2(370.0, 120.0));
        float grooves = .5 + .5 * sin(uv.x * 72.0 + noise(uv * 9.0) * 2.0);
        n = bump(n, fur * .2 + grooves, .002);
        float light = max(dot(n, key), 0.0);
        float blueTip = smoothstep(.40, .83, uv.y + .10 * sin(uv.x * 26.0));
        vec3 calyx = mix(uStems * .22, uFoliage * .65, blueTip);
        color = calyx * (.15 + light * 1.1) * (.65 + grooves * .35);
        float rim = pow(1.0 - max(dot(n,viewDir),0.0), 2.0);
        color += uStems * rim * light * (.4 + .6 * fur);
      }
      // Subtle depth falloff makes the foliage behind the stem disappear into black.
      color *= mix(1.0, .65, smoothstep(20.0, 23.0, vDepth));
      gl_FragColor = vec4(max(color, vec3(0)), 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }
  `;

  const materials = [];
  function material(kind, variation = 0, shade = 1) {
    const m = new THREE.ShaderMaterial({
      vertexShader, fragmentShader, side: THREE.DoubleSide,
      uniforms: { uPhase: phase, uSeed: { value: variation },
        uKind: { value: kind }, uShade: { value: shade },
        uBend: motionUniforms.bend, uRipple: motionUniforms.ripple, uShape: motionUniforms.shape,
        uHighlight: colorUniforms.highlight, uPetals: colorUniforms.petals,
        uFoliage: colorUniforms.foliage, uVeins: colorUniforms.veins,
        uStems: colorUniforms.stems, uShadows: colorUniforms.shadows }
    });
    materials.push(m);
    return m;
  }
  const stemMaterial = material(2, 2.3);
  const darkStemMaterial = material(2, 6.2, .6);

  // A UV surface keeps fibers, veins and wrinkles aligned with growth direction.
  function surface(nx, ny, sample) {
    const positions = [], uvs = [], indices = [];
    for (let j = 0; j <= ny; j++) {
      for (let i = 0; i <= nx; i++) {
        const u = i / nx, v = j / ny;
        positions.push(...sample(u * 2 - 1, v));
        uvs.push(u, v);
      }
    }
    for (let j = 0; j < ny; j++) {
      for (let i = 0; i < nx; i++) {
        const a = j * (nx + 1) + i, b = a + nx + 1;
        indices.push(a, a + 1, b, a + 1, b + 1, b);
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    g.setIndex(indices);
    g.computeVertexNormals();
    g.computeBoundingSphere();
    g.userData.surface = { nx, ny, sample };
    return g;
  }

  const movingParts = [];
  function petal(parent, { length, width, angle, tilt = 0, twist = 0, depth = 0, curl = .3, variation = 1, shade = 1 }) {
    const g = surface(100, 106, (u, v) => {
      const spread = Math.pow(Math.sin(v * 1.9), .78);
      const edge = Math.pow(Math.abs(u), 5);
      const s = settings.shapeSeed * .071;
      const ruffle = settings.folds * (.040 * Math.sin(u * 17 + v * 5 + variation + s) +
        .014 * Math.sin(u * 36 - v * 9 + variation * 2 + s) + .005 * Math.sin(u * 79 + v * 15));
      const x = u * width * settings.petalWidth * spread * (1 + .045 * Math.sin(v * 19 + variation + u * 3 + s));
      const y = length * v * (1 - .18 * Math.pow(Math.abs(u), 2.6)) +
        Math.pow(v, 6) * (.055 * Math.sin(u * 13 + variation) + .023 * Math.sin(u * 31));
      const z = settings.petalCurl * (curl * v * v + .41 * u * u * spread) +
        Math.sin(v * Math.PI) * .13 + ruffle * spread * (.4 + .6 * v) +
        edge * .10 * Math.sin(v * 12 + variation) * spread +
        .10 * Math.sin(u * 6 + v * 4 + variation) * spread * v +
        .009 * Math.sin(u * 53 + v * 8 + Math.sin(v * 11)) * spread;
      return [x, y, z];
    });
    const mesh = new THREE.Mesh(g, material(0, variation, shade));
    mesh.position.z = depth;
    mesh.rotation.set(tilt, twist, angle);
    parent.add(mesh);
    movingParts.push({ mesh, x: tilt, y: twist, z: angle, phase: variation, amount: .012 });
    return mesh;
  }

  function stem(points, radius = .025, parent = scene, mat = stemMaterial) {
    const curve = new THREE.CatmullRomCurve3(points.map(p => V(...p)));
    const mesh = new THREE.Mesh(new THREE.TubeGeometry(curve, 90, radius, 9, false), mat);
    parent.add(mesh);
    return curve;
  }

  // Main stem and both bud branches have continuous, curved attachments.
  const mainStem = stem([[.05,-1.35,-.12],[-.11,.65,-.10],[-.46,2.55,0],
    [-.35,4.25,.01],[.04,5.8,.02],[-.25,6.65,.08]], .026);
  const leftStem = stem([[-.43,2.55,0],[-.83,2.96,.04],[-.96,3.56,.08],[-.98,4.12,.10]], .018);
  stem([[-.42,2.7,0],[.13,3.29,.02],[.55,4.06,.04],[.99,4.77,.06]], .020);
  stem([[.01,-.6,-.15],[.26,1.1,-.25],[.52,2.02,-.22],[.63,2.74,-.12]], .018, scene, darkStemMaterial);

  // Fine stem bristles, modelled as tapered triangles rather than glowing points.
  function bristles(curve, count, radius, length, variation) {
    const points = [], uv = [];
    for (let i = 0; i < count; i++) {
      const t = .025 + random() * .96;
      const p = curve.getPointAt(t), tangent = curve.getTangentAt(t);
      const radial = V(Math.cos(i * 2.399), 0, Math.sin(i * 2.399));
      radial.addScaledVector(tangent, -radial.dot(tangent)).normalize();
      const root = p.clone().addScaledVector(radial, radius);
      const tip = root.clone().addScaledVector(radial, length * (.55 + random() * .65)).addScaledVector(tangent, .025);
      const side = new THREE.Vector3().crossVectors(tangent, radial).multiplyScalar(.0018);
      points.push(...root.clone().add(side).toArray(), ...root.clone().sub(side).toArray(), ...tip.toArray());
      uv.push(0, t, 1, t, .5, t + .01);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(points, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    scene.add(new THREE.Mesh(g, material(2, variation, .8)));
  }
  bristles(mainStem, 560, .026, .037, 3);
  bristles(leftStem, 120, .018, .035, 5);

  const bloom = new THREE.Group();
  bloom.position.set(-.25, 6.65, .08);
  bloom.rotation.y = -.09;
  bloom.scale.y = .82;
  scene.add(bloom);
  [
    { length: 1.91, width: .87, angle: .43, tilt: -.16, twist: -.27, depth: -.30, curl: .22, variation: 1.1, shade: .92 },
    { length: 2.08, width: .88, angle: -.22, tilt: -.15, twist: .26, depth: -.28, curl: .23, variation: 4.2 },
    { length: 1.67, width: .79, angle: 1.14, tilt: .29, twist: -.36, depth: -.01, curl: .44, variation: 2.6 },
    { length: 1.55, width: .75, angle: -1.36, tilt: .42, twist: -.12, depth: .09, curl: .41, variation: 5.1, shade: .70 },
    { length: .73, width: .48, angle: 2.03, tilt: .63, twist: -.32, depth: .18, curl: .24, variation: 6.7, shade: .86 },
    { length: .81, width: .57, angle: -1.94, tilt: .56, twist: .29, depth: .19, curl: .25, variation: 3.6, shade: .75 },
    { length: .94, width: .72, angle: .10, tilt: 1.79, twist: -.1, depth: .25, curl: -.20, variation: 9.5, shade: .66 }
  ].forEach(options => petal(bloom, options));

  // A dark receptacle and tiny individual anthers nest inside the folded corolla.
  const heart = new THREE.Mesh(new THREE.SphereGeometry(.21, 28, 18), material(2, 5.6, .23));
  heart.scale.set(1.3, .47, .8);
  heart.position.set(0, .055, .30);
  bloom.add(heart);
  const pollenMaterial = material(2, 7, 1.25);
  const filaments = new THREE.InstancedMesh(new THREE.CylinderGeometry(.004, .006, 1, 4), darkStemMaterial, 66);
  const anthers = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 5, 4), pollenMaterial, 66);
  const instance = new THREE.Object3D();
  for (let i = 0; i < 66; i++) {
    const a = i * 2.39996, r = .10 + random() * .21;
    const x = Math.cos(a) * r, z = .26 + Math.sin(a) * r * .60;
    const y = .14 + random() * .17;
    instance.position.set(x, y * .5, z);
    instance.rotation.z = -x * .7;
    instance.scale.set(1,y,1);
    instance.updateMatrix();
    filaments.setMatrixAt(i, instance.matrix);
    const size = .017 + random() * .009;
    instance.scale.set(size, size * .62, size);
    instance.position.set(x * 1.08, y, z);
    instance.updateMatrix();
    anthers.setMatrixAt(i, instance.matrix);
  }
  bloom.add(filaments, anthers);

  function leaf(parent, { length, width, angle, tilt = 0, twist = 0, variation = 1, shade = 1, position = [0,0,0] }) {
    const g = surface(68, 100, (u, v) => {
      const blade = Math.pow(Math.max(0, Math.sin(v * Math.PI)), .76);
      const s = settings.shapeSeed * .031;
      const tooth = 1 - Math.abs(((v * (18 + Math.sin(s) * 3) + variation * .17) % 1) * 2 - 1);
      const lobes = .83 + .17 * Math.sin(v * 7 * Math.PI + .5);
      const edge = .88 + .12 * tooth;
      const w = settings.leafWidth * width * blade * lobes * (1 + (edge - 1) * Math.pow(Math.abs(u), 3));
      const x = u * w;
      const y = v * length + .065 * Math.sin(u * 4 + variation) * blade;
      const ribs = Math.cos((v - Math.abs(u) * .24) * TAU * 10);
      const z = .16 * Math.pow(Math.abs(u), 1.6) * blade +
        .08 * Math.exp(-Math.abs(u) * 13) * blade +
        .024 * ribs * blade * Math.abs(u) +
        .055 * Math.sin(v * 19 + u * 8 + variation + s) * blade +
        .14 * Math.sin(v * Math.PI * 1.4) + .08 * u * v;
      return [x,y,z];
    });
    const mesh = new THREE.Mesh(g, material(1, variation, shade));
    mesh.position.set(...position);
    mesh.rotation.set(tilt, twist, angle);
    parent.add(mesh);
    movingParts.push({ mesh, x: tilt, y: twist, z: angle, phase: variation, amount: .009 });
    return mesh;
  }

  // The right-hand bud is just opening; its blue sepals still cradle the petals.
  const bud = new THREE.Group();
  bud.position.set(.99,4.77,.06);
  bud.rotation.z = -.41;
  bud.scale.setScalar(.43);
  scene.add(bud);
  [
    { length: 1.90, width: .65, angle: .30, tilt: -.1, twist: -.25, depth: -.16, curl: .5, variation: 2.2 },
    { length: 1.65, width: .63, angle: -.42, tilt: .15, twist: .22, depth: .0, curl: .35, variation: 5.3 },
    { length: 1.65, width: .53, angle: .65, tilt: .22, twist: -.23, depth: .05, curl: .33, variation: 7.2, shade: .85 }
  ].forEach(options => petal(bud, options));
  leaf(bud, { length: .95, width: .25, angle: .37, tilt: .5, variation: 2, position: [-.14,-.05,.28], shade: .8 });
  leaf(bud, { length: 1.1, width: .29, angle: -.68, tilt: .7, variation: 6, position: [.08,-.08,.24], shade: .8 });

  // Closed bud: irregular longitudinal lobes and a warm, hairy calyx.
  const closed = new THREE.Group();
  closed.position.set(-.98,4.12,.1);
  closed.rotation.z = .10;
  scene.add(closed);
  const budGeometry = new THREE.SphereGeometry(1, 48, 56);
  const bp = budGeometry.attributes.position;
  for (let i = 0; i < bp.count; i++) {
    const x = bp.getX(i), y = bp.getY(i), z = bp.getZ(i);
    const theta = Math.atan2(z,x);
    const irregular = 1 + .06 * Math.sin(theta * 7 + y * 4) + .025 * Math.sin(y * 24 + theta * 3);
    bp.setXYZ(i, x * .235 * irregular * (1 + y * .10), y * .40 + .32, z * .22 * irregular);
  }
  budGeometry.computeVertexNormals();
  closed.add(new THREE.Mesh(budGeometry, material(3, 3.4, .72)));
  for (let i = 0; i < 5; i++) {
    const a = i / 5 * TAU;
    stem([[Math.cos(a)*.06,-.05,Math.sin(a)*.06],
      [Math.cos(a)*.23,.22,Math.sin(a)*.22],
      [Math.cos(a)*.18,.52,Math.sin(a)*.18],
      [Math.cos(a)*.04,.69,Math.sin(a)*.04]], .009, closed);
  }

  // Layered foliage: back leaves are dimmer and physically sit behind the stem.
  const foliage = [
    { position: [.12,-.82,-1.05], length: 2.62, width: .93, angle: -1.10, tilt: .38, twist: .4, variation: 1, shade: .48 },
    { position: [.0,-.76,-.85], length: 2.72, width: 1.02, angle: .97, tilt: -.15, twist: -.35, variation: 4, shade: .60 },
    { position: [-.1,-.55,-.50], length: 2.05, width: .87, angle: .51, tilt: .45, twist: .22, variation: 7, shade: .70 },
    { position: [.08,-.62,.10], length: 2.83, width: 1.07, angle: 1.12, tilt: .2, twist: .16, variation: 2.7, shade: .9 },
    { position: [.18,-.87,.31], length: 2.67, width: 1.02, angle: -1.31, tilt: .28, twist: -.26, variation: 5.4, shade: .76 },
    { position: [-.05,-.44,.43], length: 1.93, width: .80, angle: .92, tilt: .06, twist: -.13, variation: 9.1, shade: 1.1 },
    { position: [.13,-.55,.53], length: 1.68, width: .62, angle: -.55, tilt: .45, twist: .2, variation: 3.2, shade: .76 },
    { position: [-.17,.18,.38], length: 1.49, width: .61, angle: 1.65, tilt: -.1, twist: .25, variation: 6.8, shade: .84 },
    { position: [-.40,2.28,.05], length: 2.02, width: .68, angle: -1.21, tilt: .30, twist: -.26, variation: 8.1, shade: .98 },
    { position: [-.40,2.28,.12], length: 1.12, width: .42, angle: 1.37, tilt: .20, twist: .12, variation: 2.1, shade: .9 },
    { position: [.03,.80,-.45], length: 1.55, width: .45, angle: -.34, tilt: -.3, twist: -.6, variation: 4.5, shade: .30 }
  ];
  foliage.forEach(options => leaf(scene, options));
  stem([[-.40,2.28,.05],[.35,2.57,.13],[1.12,2.77,.17]], .012);
  stem([[-.05,-.2,.15],[-.67,.37,.25],[-1.32,.70,.25]], .015);
  stem([[.11,-.46,.18],[.80,.05,.25],[1.64,.27,.26]], .012);

  // Small dried stipules interrupt the otherwise clean stem silhouette.
  for (const [x,y,z,a] of [[-.43,2.7,.04,.7],[.24,3.53,.04,-.8],[.56,4.03,.04,1.3],[-.73,3.02,.06,.3]]) {
    const stipule = new THREE.Mesh(surface(12,22,(u,v) => [u * .07 * Math.sin(v * Math.PI), v * .29, .04 * Math.sin(v * 4 + u * 5)]), stemMaterial);
    stipule.position.set(x,y,z);
    stipule.rotation.z = a;
    scene.add(stipule);
  }

  let gui;
  function refreshGUI() { gui?.controllersRecursive().forEach(controller => controller.updateDisplay()); }

  function applyColors() {
    for (const [key, uniform] of Object.entries(colorUniforms)) uniform.value.set(settings[key]);
    const background = settings.greenscreen ? '#00ff00' : settings.background;
    scene.background.set(background);
    renderer.setClearColor(background);
    document.body.style.backgroundColor = background;
    renderer.toneMappingExposure = settings.exposure;
  }

  function applyPalette() {
    const colors = palettes[settings.scheme];
    colorKeys.forEach((key, i) => { settings[key] = '#' + colors[i].toLowerCase(); });
    const achromatic = settings.scheme.startsWith('Achromatic');
    if (achromatic && settings.polarity === 'Dark on light') {
      Object.assign(settings, { petals: '#181818', foliage: '#272727', stems: '#242424',
        shadows: '#050505', background: '#ffffff',
        highlight: settings.scheme === 'Achromatic + Accent' ? '#e52d35' : '#555555' });
    }
    settings.veins = '#' + new THREE.Color(settings.foliage)
      .lerp(new THREE.Color(settings.highlight), achromatic ? 0 : .14).getHexString();
    if (settings.scheme === 'Original') settings.veins = '#126cff';
    applyColors();
    refreshGUI();
  }

  function rebuildSurfaces() {
    scene.traverse(object => {
      const geometry = object.geometry, data = geometry?.userData.surface;
      if (!data) return;
      const position = geometry.attributes.position;
      let index = 0;
      for (let j = 0; j <= data.ny; j++) {
        for (let i = 0; i <= data.nx; i++) {
          position.setXYZ(index++, ...data.sample(i / data.nx * 2 - 1, j / data.ny));
        }
      }
      position.needsUpdate = true;
      // Shading derives deformed normals on the GPU; only bounds need refreshing.
      geometry.computeBoundingSphere();
    });
    motionUniforms.shape.value = settings.shapeSeed * .013;
  }

  function randomizeScene() {
    const names = Object.keys(palettes).filter(name => name !== settings.scheme);
    settings.scheme = names[Math.floor(Math.random() * names.length)];
    settings.polarity = Math.random() < .5 ? 'Light on dark' : 'Dark on light';
    applyPalette();
    if (!settings.scheme.startsWith('Achromatic')) {
      const hue = (Math.random() - .5) * .065;
      for (const key of [...colorKeys.filter(key => key !== 'background'), 'veins']) {
        settings[key] = '#' + new THREE.Color(settings[key]).offsetHSL(hue, 0, 0).getHexString();
      }
    }
    settings.shapeSeed = Math.floor(Math.random() * 10000);
    const range = (low, high) => Math.round((low + Math.random() * (high - low)) * 100) / 100;
    settings.petalWidth = range(.82, 1.18);
    settings.petalCurl = range(.65, 1.45);
    settings.folds = range(.6, 1.4);
    settings.leafWidth = range(.8, 1.16);
    settings.speed = range(.45, 1.10);
    settings.wind = range(.45, 1.55);
    settings.flutter = range(.5, 1.4);
    // Keep an explicitly selected static scene still, including reduced motion.
    if (settings.animation !== 'Static') settings.animation = animations[Math.floor(Math.random() * 8)];
    rebuildSurfaces();
    applyColors();
    refreshGUI();
  }

  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    const aspect = w / h;
    // A minimum 6.5-unit width preserves the foliage on very narrow phones.
    const height = Math.max(11.65, 6.5 / aspect);
    camera.left = -height * aspect / 2;
    camera.right = height * aspect / 2;
    camera.top = height / 2;
    camera.bottom = -height / 2;
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(settings.pixelRatio);
    renderer.setSize(w, h);
  }
  window.addEventListener('resize', resize, { passive: true });
  resize();

  // The library's default styling is deliberately left untouched.
  gui = new GUI({ title: 'Botanical study' });
  const appearance = gui.addFolder('Color & background');
  appearance.add(settings, 'scheme', Object.keys(palettes)).name('Color scheme').onChange(applyPalette);
  appearance.add(settings, 'polarity', ['Light on dark','Dark on light']).name('Achromatic polarity').onChange(() => {
    if (settings.scheme.startsWith('Achromatic')) applyPalette();
  });
  appearance.add(settings, 'greenscreen').name('Greenscreen').onChange(applyColors);
  appearance.addColor(settings, 'background').name('Background').onChange(applyColors);
  const custom = appearance.addFolder('Botanical colors');
  for (const key of ['petals','highlight','foliage','veins','stems','shadows']) {
    custom.addColor(settings, key).name(key[0].toUpperCase() + key.slice(1)).onChange(applyColors);
  }
  custom.close();

  const movement = gui.addFolder('Animation');
  movement.add(settings, 'animation', animations).name('Movement');
  movement.add(settings, 'speed', .05, 2, .01).name('Speed');
  movement.add(settings, 'wind', 0, 2, .01).name('Stem sway');
  movement.add(settings, 'flutter', 0, 2, .01).name('Petal & leaf motion');

  const view = gui.addFolder('Camera & framing');
  view.add(settings, 'zoom', .15, 5, .01).name('Zoom').listen();
  view.add(settings, 'panX', -20, 20, .01).name('Position X').listen();
  view.add(settings, 'panY', -20, 20, .01).name('Position Y').listen();
  view.add(settings, 'azimuth', -180, 180, 1).name('Camera angle');
  view.add(settings, 'elevation', -60, 60, 1).name('Camera elevation');
  view.add(settings, 'orbitAngle', 0, 55, 1).name('Orbit angle');
  view.add(settings, 'cameraMotion', 0, 2, .01).name('Orbit motion');
  view.add(settings, 'resetView').name('Reset view');
  view.close();

  const shape = gui.addFolder('Procedural variation');
  shape.add(settings, 'clickRandomize').name('Randomize on click');
  shape.add(settings, 'randomize').name('New variation');
  shape.add(settings, 'shapeSeed', 0, 9999, 1).name('Shape seed').onFinishChange(rebuildSurfaces);
  shape.add(settings, 'petalWidth', .65, 1.35, .01).name('Petal width').onFinishChange(rebuildSurfaces);
  shape.add(settings, 'petalCurl', .3, 1.8, .01).name('Petal curl').onFinishChange(rebuildSurfaces);
  shape.add(settings, 'folds', .25, 1.8, .01).name('Petal folds').onFinishChange(rebuildSurfaces);
  shape.add(settings, 'leafWidth', .6, 1.4, .01).name('Leaf width').onFinishChange(rebuildSurfaces);
  shape.close();

  const rendering = gui.addFolder('Rendering');
  rendering.add(settings, 'pixelRatio', .5, 3, .05).name('DPR (Pixel Ratio)').onChange(resize);
  rendering.add(settings, 'exposure', .4, 2, .01).name('Exposure').onChange(applyColors);
  rendering.close();
  applyColors();

  let paused = false, elapsed = 0, previous = null, uiVisible = true;
  let frame = 0, lost = false;
  const profiles = {
    'Botanical breeze': { bend: 1, ripple: 1, petal: 1, leaf: 1 },
    'Petal breathing': { bend: .15, ripple: 1.35, petal: 2.4, leaf: .2 },
    'Leaf tide': { bend: .4, ripple: .8, petal: .35, leaf: 2.7 },
    'Evening drift': { bend: 1.9, ripple: .45, petal: .5, leaf: .7 },
    'Bloom reverie': { bend: .25, ripple: 1.6, petal: 1.6, leaf: .55 },
    'Gentle orbit': { bend: .7, ripple: .75, petal: .7, leaf: .8 },
    'Orbital ellipse': { bend: .45, ripple: .65, petal: .6, leaf: 1 },
    'Pendulum orbit': { bend: .8, ripple: .8, petal: .85, leaf: .85 },
    'Static': { bend: 0, ripple: 0, petal: 0, leaf: 0 }
  };
  const center = V(0,4.8,0), target = V(), right = V(), up = V(), pan = V();
  function updateCamera(p) {
    let azimuth = settings.azimuth * Math.PI / 180;
    let elevation = settings.elevation * Math.PI / 180;
    const angle = settings.orbitAngle * settings.cameraMotion * Math.PI / 180;
    if (settings.animation === 'Gentle orbit') {
      azimuth += Math.sin(p) * angle;
      elevation += (Math.cos(p) - 1) * angle * .18;
    } else if (settings.animation === 'Orbital ellipse') {
      azimuth += Math.sin(p) * angle;
      elevation += Math.cos(p) * angle * .38;
    } else if (settings.animation === 'Pendulum orbit') {
      azimuth += Math.sin(p) * angle;
      elevation += Math.sin(2 * p) * angle * .12;
    }
    elevation = THREE.MathUtils.clamp(elevation, -1.35, 1.35);
    camera.position.set(Math.sin(azimuth) * Math.cos(elevation) * 20,
      4.8 + Math.sin(elevation) * 20, Math.cos(azimuth) * Math.cos(elevation) * 20);
    camera.lookAt(center);
    camera.updateMatrixWorld();
    right.setFromMatrixColumn(camera.matrixWorld,0);
    up.setFromMatrixColumn(camera.matrixWorld,1);
    // User placement is expressed in screen axes, so an orbit never undoes a drag.
    pan.copy(right).multiplyScalar(-settings.panX).addScaledVector(up, -settings.panY);
    camera.position.add(pan);
    target.copy(center).add(pan);
    camera.lookAt(target);
    // Animation never writes the user's zoom, position, or angle settings.
    if (camera.zoom !== settings.zoom) {
      camera.zoom = settings.zoom;
      camera.updateProjectionMatrix();
    }
  }

  function draw(seconds) {
    const still = settings.animation === 'Static';
    phase.value = still ? 0 : (seconds % LOOP) / LOOP * TAU;
    const profile = profiles[settings.animation];
    motionUniforms.bend.value = profile.bend * settings.wind;
    motionUniforms.ripple.value = profile.ripple * settings.flutter;
    for (const part of movingParts) {
      const isPetal = part.mesh.material.uniforms.uKind.value < .5;
      const p = phase.value, a = part.amount * settings.flutter * (isPetal ? profile.petal : profile.leaf);
      part.mesh.rotation.x = part.x + a * Math.sin(p + part.phase);
      part.mesh.rotation.y = part.y + a * .7 * Math.sin(p + part.phase + .8);
      part.mesh.rotation.z = part.z + a * .5 * Math.sin(2 * p + part.phase);
    }
    updateCamera(phase.value);
    renderer.render(scene, camera);
  }

  function animate(now) {
    if (lost) return;
    if (previous !== null && !paused && !document.hidden) {
      elapsed = (elapsed + Math.min((now - previous) / 1000, .1) * settings.speed) % LOOP;
    }
    previous = now;
    draw(elapsed);
    frame = requestAnimationFrame(animate);
  }
  document.addEventListener('visibilitychange', () => { previous = null; });
  motionQuery.addEventListener('change', event => {
    settings.animation = event.matches ? 'Static' : 'Botanical breeze';
    previous = null; refreshGUI();
  });
  window.addEventListener('keydown', event => {
    if (event.target instanceof Element && event.target.closest('input, textarea, select, [contenteditable="true"]')) return;
    if (event.repeat) return;
    if (event.code === 'KeyH') { uiVisible = !uiVisible; gui.show(uiVisible); }
    if (event.code === 'Space') { event.preventDefault(); paused = !paused; }
    if (event.code === 'KeyR') { elapsed = 0; previous = null; draw(0); }
  });

  const canvas = renderer.domElement;
  canvas.addEventListener('wheel', event => {
    event.preventDefault();
    const delta = event.deltaY * (event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? innerHeight : 1);
    settings.zoom = THREE.MathUtils.clamp(settings.zoom * Math.exp(-delta * .001), .15, 5);
  }, { passive: false });

  const pointers = new Map();
  let gesture = null;
  function pointerDistance() {
    const [a,b] = [...pointers.values()];
    return a && b ? Math.hypot(a.x - b.x, a.y - b.y) : 0;
  }
  canvas.addEventListener('pointerdown', event => {
    if (event.pointerType === 'mouse' && event.button !== 0) return;
    canvas.setPointerCapture(event.pointerId);
    pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
    if (pointers.size === 1) gesture = { x: event.clientX, y: event.clientY, moved: false, pinch: 0 };
    else if (gesture) { gesture.moved = true; gesture.pinch = pointerDistance(); }
  });
  canvas.addEventListener('pointermove', event => {
    const last = pointers.get(event.pointerId);
    if (!last || !gesture) return;
    const dx = event.clientX - last.x, dy = event.clientY - last.y;
    pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
    if (Math.hypot(event.clientX - gesture.x, event.clientY - gesture.y) > 4) gesture.moved = true;
    if (pointers.size > 1) {
      const distance = pointerDistance();
      if (gesture.pinch > 0) settings.zoom = THREE.MathUtils.clamp(settings.zoom * distance / gesture.pinch, .15, 5);
      gesture.pinch = distance;
    } else if (gesture.moved) {
      const units = (camera.top - camera.bottom) / (innerHeight * settings.zoom);
      settings.panX = THREE.MathUtils.clamp(settings.panX + dx * units, -20, 20);
      settings.panY = THREE.MathUtils.clamp(settings.panY - dy * units, -20, 20);
    }
  });
  function finishPointer(event, cancelled = false) {
    if (!pointers.has(event.pointerId)) return;
    const click = !cancelled && gesture && !gesture.moved && pointers.size === 1;
    pointers.delete(event.pointerId);
    if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
    if (!pointers.size) gesture = null;
    else if (gesture) { gesture.moved = true; gesture.pinch = 0; }
    if (click && settings.clickRandomize) randomizeScene();
  }
  canvas.addEventListener('pointerup', event => finishPointer(event));
  canvas.addEventListener('pointercancel', event => finishPointer(event, true));
  canvas.addEventListener('lostpointercapture', event => {
    if (pointers.has(event.pointerId)) finishPointer(event, true);
  });
  renderer.domElement.addEventListener('webglcontextlost', event => {
    event.preventDefault(); lost = true; cancelAnimationFrame(frame);
    notice.textContent = 'The graphics context was interrupted. Restoring the botanical study…';
    notice.hidden = false;
  });
  renderer.domElement.addEventListener('webglcontextrestored', () => {
    lost = false; previous = null; notice.hidden = true;
    frame = requestAnimationFrame(animate);
  });

  draw(0);
  notice.hidden = true;
  frame = requestAnimationFrame(animate);

  // Deterministic sampling and controls also make browser-based QA reproducible.
  window.botanicalStudy = Object.freeze({
    loopDuration: LOOP,
    renderer, scene, camera, settings, gui, palettes, animations,
    applyPalette, applyColors, randomize: randomizeScene, rebuildSurfaces,
    renderAt(seconds) { paused = true; elapsed = ((seconds % LOOP) + LOOP) % LOOP; draw(elapsed); },
    resume() { paused = false; previous = null; },
    get paused() { return paused; }
  });
  </script>
</body>
</html>
