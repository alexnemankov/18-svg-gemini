      user-select: none;

    canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      cursor: grab;
    }
    canvas.dragging {
      cursor: grabbing;
    }
  </style>
</head>
<body>
  <script type="module">
    import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

    /*************************************************

     *************************************************/
    const SCHEMES = {

      '(63D1CF, 5BC0BE, 4BAD9E, 4BAD9E, 0B132B, 000000)': {

      },
      '(AA60C8, D69ADE, C9A3C6, CFB5C2, 0D001D, 120A12)': {

      },
      '(FEF1BE, FFBA00, 008189, 00474D, 061210)': {

      },
      '(D4FFB0, 7FFF00, 00B894, 0A3322, 05140A)': {

        palette: ['#D4FFB0', '#7FFF00', '#00B894', '#0A3322', '#05140A']
      },
      '(FFE8CC, FF8C00, C7501A, 3D1050, 0E0618)': {

        secondary: '#C7501A',
        palette: ['#FFE8CC', '#FF8C00', '#C7501A', '#3D1050', '#0E0618']
      },
      '(E8E0FF, B38FFF, 6A3DE8, 1A1250, 090612)': {
        bg: '#090612',
        primary: '#6A3DE8',
        secondary: '#B38FFF',
        palette: ['#E8E0FF', '#B38FFF', '#6A3DE8', '#1A1250', '#090612']
      },
      '(E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)': {
        bg: '#05020F',
        primary: '#00F0FF',
        secondary: '#D40078',
        palette: ['#E0FBFF', '#00F0FF', '#D40078', '#1E0A3D', '#05020F']
      }
    };

    /*************************************************
     * Utilities & Vector Mathematics
     *************************************************/
    const Util = {
      timeStamp: () => window.performance.now(),
      random: (min, max) => min + Math.random() * (max - min),
      map: function(a, b, c, d, e) {
        a = this.clamp(a, b, c);
        return (a - b) / (c - b) * (e - d) + d;
      },
      lerp: (value1, value2, amount) => value1 + (value2 - value1) * amount,
      clamp: (value, min, max) => Math.max(min, Math.min(max, value)),
      threeAngle: function(p0, p1, p2) {
        var b = Math.pow(p1.x - p0.x, 2) + Math.pow(p1.y - p0.y, 2),
            a = Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2),
            c = Math.pow(p2.x - p0.x, 2) + Math.pow(p2.y - p0.y, 2);
        return Math.acos((a + b - c) / Math.sqrt(4 * a * b));
      },
      hsl: (hue, saturation, lightness) => `hsl(${hue},${saturation}%,${lightness}%)`
    };

    class Vector {
      constructor(x, y) {
        this.x = x || 0;
        this.y = y || 0;
      }
      set(x, y) {
        this.x = x;
        this.y = y;
      }
      reset() {
        this.x = 0;
        this.y = 0;
      }
      fromAngle(angle) {
        return new Vector(Math.cos(angle), Math.sin(angle));
      }
      add(vector) {
        this.x += vector.x;
        this.y += vector.y;
      }
      sub(vector) {
        this.x -= vector.x;
        this.y -= vector.y;
      }
      mult(scalar) {
        this.x *= scalar;
        this.y *= scalar;
      }
      div(scalar) {
        this.x /= scalar;
        this.y /= scalar;
      }
      dot(vector) {
        return vector.x * this.x + vector.y * this.y;
      }
      limit(limit_value) {
        if (this.mag() > limit_value) this.setMag(limit_value);
      }
      mag() {
        return Math.hypot(this.x, this.y);
      }
      setMag(new_mag) {
        if (this.mag() > 0) {
          this.normalize();
        } else {
          this.x = 1;
          this.y = 0;
        }
        this.mult(new_mag);
      }
      normalize() {
        let mag = this.mag();
        if (mag > 0) {
          this.x /= mag;
          this.y /= mag;
        }
      }
      normalizedMag() {
        let copy = this.copy();
        copy.normalize();
        return copy.mag();
      }
      heading() {
        return Math.atan2(this.y, this.x);
      }
      setHeading(angle) {
        let mag = this.mag();
        this.x = Math.cos(angle) * mag;
        this.y = Math.sin(angle) * mag;
      }
      dist(vector) {
        return new Vector(this.x - vector.x, this.y - vector.y).mag();
      }
      angle(vector) {
        return Math.atan2(vector.y - this.y, vector.x - this.x);
      }
      copy() {
        return new Vector(this.x, this.y);
      }
    }

    /*************************************************
     * Parameters & State
     *************************************************/
    const params = {
      // Theme & Color
      colorScheme: 'Original',
      greenScreen: false,
      bgColor: '#000000',
      primaryColor: '#FFFFFF',
      secondaryColor: '#A0A0A0',
      colorMode: 'Palette Grid', // 'Palette Grid', 'Radial Wave', 'Uniform Color', 'Original / Grayscale'
      achromaticVariant: 'White on Black', // 'White on Black', 'Black on White'

      // Geometry & Grid
      divXMax: 24,
      divYMax: 12,
      gap: 0,
      padding: 10,
      diskScale: 1.0,
      diskPattern: 'Auto (Online / Procedural)', // 'Auto (Online / Procedural)', 'Phenakistoscope', 'Spiral Vortex', 'Concentric Grooves', 'Geometric Star'
      compositeOperation: 'source-over', // 'source-over', 'screen', 'lighter', 'multiply', 'difference'

      // Motion & Dynamics
      speed: 0.4,
      waveX: 0.04,
      waveY: 0.02,
      mouseLag: 0.1,
      mouseInfluence: 1.0,

      // Camera & Navigation
      zoom: 1.0,
      panX: 0,
      panY: 0,
      resetView: () => {
        params.zoom = 1.0;
        params.panX = 0;
        params.panY = 0;
        updateGuiControllers();
      },

      // Procedural Randomizer
      clickToRandomize: true,
      randomizeNow: () => randomizeScene()
    };

    /*************************************************
     * Procedural & Image Sprite Engine (24 Frames, 200x200)
     *************************************************/
    const SPRITE_FRAMES = 24;
    const CELL_SIZE = 200;

    let onlineImage = new Image();
    let onlineImageLoaded = false;
    let onlineImageAlphaCanvas = null;

    let proceduralCanvases = {};
    let tintCache = new Map();

    function createProceduralFrames(style) {
      let canvas = document.createElement('canvas');
      canvas.width = SPRITE_FRAMES * CELL_SIZE;
      canvas.height = CELL_SIZE;
      let ctx = canvas.getContext('2d');

      for (let f = 0; f < SPRITE_FRAMES; f++) {
        let cx = f * CELL_SIZE + CELL_SIZE / 2;
        let cy = CELL_SIZE / 2;
        let radius = CELL_SIZE * 0.46;
        let phase = (f / SPRITE_FRAMES) * Math.PI * 2;

        ctx.save();
        ctx.translate(cx, cy);

        // Base vinyl / disc background circle with subtle edge
        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
        ctx.fill();
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = '#FFFFFF';
        ctx.stroke();

        if (style === 'Spiral Vortex') {
          // Spiraling arms
          let arms = 5;
          ctx.lineWidth = 2.5;
          ctx.strokeStyle = '#FFFFFF';
          for (let a = 0; a < arms; a++) {
            let armOffset = (a / arms) * Math.PI * 2;
            ctx.beginPath();
            for (let step = 0; step < 80; step++) {
              let t = step / 80;
              let r = t * (radius - 8);
              let angle = armOffset + phase + t * Math.PI * 5;
              let px = Math.cos(angle) * r;
              let py = Math.sin(angle) * r;
              if (step === 0) ctx.moveTo(px, py);
              else ctx.lineTo(px, py);
            }
            ctx.stroke();
          }
        } else if (style === 'Concentric Grooves') {
          // Phonograph grooves with stroboscopic tick slits
          let rings = 7;
          for (let rIdx = 1; rIdx <= rings; rIdx++) {
            let ringRadius = (radius / rings) * rIdx;
            ctx.beginPath();
            ctx.arc(0, 0, ringRadius, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
            ctx.lineWidth = 1;
            ctx.stroke();

            // Strobe markers along ring
            let ticks = rIdx * 4;
            let tickPhase = phase * (rIdx % 2 === 0 ? 1 : -1);
            for (let t = 0; t < ticks; t++) {
              let angle = (t / ticks) * Math.PI * 2 + tickPhase;
              let px1 = Math.cos(angle) * (ringRadius - 3);
              let py1 = Math.sin(angle) * (ringRadius - 3);
              let px2 = Math.cos(angle) * (ringRadius + 3);
              let py2 = Math.sin(angle) * (ringRadius + 3);
              ctx.beginPath();
              ctx.moveTo(px1, py1);
              ctx.lineTo(px2, py2);
              ctx.strokeStyle = '#FFFFFF';
              ctx.lineWidth = 1.5;
              ctx.stroke();
            }
          }
        } else if (style === 'Geometric Star') {
          // Stroboscopic rotating polygonal rosette
          let points = 8;
          ctx.rotate(phase);
          for (let layer = 1; layer <= 4; layer++) {
            let rOuter = (radius / 4) * layer;
            let rInner = rOuter * 0.5;
            ctx.beginPath();
            for (let p = 0; p < points * 2; p++) {
              let a = (p / (points * 2)) * Math.PI * 2 + (layer % 2 ? phase : -phase);
              let currR = p % 2 === 0 ? rOuter : rInner;
              let px = Math.cos(a) * currR;
              let py = Math.sin(a) * currR;
              if (p === 0) ctx.moveTo(px, py);
              else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.strokeStyle = '#FFFFFF';
            ctx.lineWidth = 1.5;
            ctx.stroke();
          }
        } else {
          // Default: Classic Phenakistoscope optical disc
          // 1. Perimeter strobe teeth
          let outerTeeth = 32;
          for (let t = 0; t < outerTeeth; t++) {
            let angle = (t / outerTeeth) * Math.PI * 2 + phase;
            let innerR = radius - 7;
            let outerR = radius;
            let px1 = Math.cos(angle) * innerR;
            let py1 = Math.sin(angle) * innerR;
            let px2 = Math.cos(angle) * outerR;
            let py2 = Math.sin(angle) * outerR;
            ctx.beginPath();
            ctx.moveTo(px1, py1);
            ctx.lineTo(px2, py2);
            ctx.strokeStyle = '#FFFFFF';
            ctx.lineWidth = 2;
            ctx.stroke();
          }

          // 2. Swirling optical spoke blades
          let blades = 12;
          for (let b = 0; b < blades; b++) {
            let angle = (b / blades) * Math.PI * 2 + phase;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            let ctrlAngle = angle + 0.45;
            let ctrlR = radius * 0.55;
            let endX = Math.cos(angle) * (radius - 12);
            let endY = Math.sin(angle) * (radius - 12);
            ctx.quadraticCurveTo(Math.cos(ctrlAngle) * ctrlR, Math.sin(ctrlAngle) * ctrlR, endX, endY);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.75)';
            ctx.lineWidth = 2.5;
            ctx.stroke();
          }

          // 3. Counter-phase middle ring dots
          let dots = 12;
          let dotRadius = radius * 0.48;
          for (let d = 0; d < dots; d++) {
            let angle = (d / dots) * Math.PI * 2 - phase;
            let dx = Math.cos(angle) * dotRadius;
            let dy = Math.sin(angle) * dotRadius;
            ctx.beginPath();
            ctx.arc(dx, dy, 3.5, 0, Math.PI * 2);
            ctx.fillStyle = '#FFFFFF';
            ctx.fill();
          }
        }

        // Center hub spindle / hole
        ctx.beginPath();
        ctx.arc(0, 0, 7, 0, Math.PI * 2);
        ctx.fillStyle = '#FFFFFF';
        ctx.fill();

        ctx.beginPath();
        ctx.arc(0, 0, 16, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.restore();
      }

      return canvas;
    }

    // Pre-generate procedural patterns
    const PATTERN_TYPES = ['Phenakistoscope', 'Spiral Vortex', 'Concentric Grooves', 'Geometric Star'];
    PATTERN_TYPES.forEach(t => {
      proceduralCanvases[t] = createProceduralFrames(t);
    });

    // Load Online Image with fallback
    onlineImage.crossOrigin = 'anonymous';
    onlineImage.onload = () => {
      try {
        let tempCanvas = document.createElement('canvas');
        tempCanvas.width = SPRITE_FRAMES * CELL_SIZE;
        tempCanvas.height = CELL_SIZE;
        let tctx = tempCanvas.getContext('2d');
        tctx.drawImage(onlineImage, 0, 0);

        // Convert black background to transparent alpha for clean blending
        let imgData = tctx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
        let d = imgData.data;
        for (let i = 0; i < d.length; i += 4) {
          let lum = d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114;
          d[i + 3] = lum; // Dark pixels transparent, bright pixels opaque
          d[i] = 255;
          d[i + 1] = 255;
          d[i + 2] = 255;
        }
        tctx.putImageData(imgData, 0, 0);
        onlineImageAlphaCanvas = tempCanvas;
      } catch (err) {
        onlineImageAlphaCanvas = onlineImage;
      }
      onlineImageLoaded = true;
      tintCache.clear();
    };
    onlineImage.onerror = () => {
      onlineImageLoaded = false;
    };
    onlineImage.src = 'https://i.ibb.co/tDmyrGD/disk-sprite.jpg';

    function getBaseSprite() {
      if (params.diskPattern === 'Auto (Online / Procedural)') {
        if (onlineImageLoaded && onlineImageAlphaCanvas) {
          return onlineImageAlphaCanvas;
        }
        return proceduralCanvases['Phenakistoscope'];
      }
      return proceduralCanvases[params.diskPattern] || proceduralCanvases['Phenakistoscope'];
    }

    function getTintedSprite(color, isInverted) {
      let base = getBaseSprite();
      let key = color + '_' + (isInverted ? 'inv' : 'norm') + '_' + params.diskPattern + '_' + (onlineImageLoaded ? 'img' : 'proc');
      if (tintCache.has(key)) {
        return tintCache.get(key);
      }

      let canvas = document.createElement('canvas');
      canvas.width = SPRITE_FRAMES * CELL_SIZE;
      canvas.height = CELL_SIZE;
      let ctx = canvas.getContext('2d');

      ctx.drawImage(base, 0, 0);

      if (color !== 'original') {
        ctx.globalCompositeOperation = 'source-in';
        ctx.fillStyle = isInverted ? '#000000' : color;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      } else if (isInverted) {
        ctx.globalCompositeOperation = 'source-in';
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      tintCache.set(key, canvas);
      return canvas;
    }

    /*************************************************
     * Tagada Engine Setup
     *************************************************/
    class Tagada {
      constructor() {
        this.canvas = document.createElement('canvas');
        this.canvas.id = 'canvas';
        this.ctx = this.canvas.getContext('2d');
        document.body.appendChild(this.canvas);
        this.W = 0;
        this.H = 0;
        this.timeData = {
          now: 0,
          dt: 0,
          last: Util.timeStamp(),
          step: 1 / 60
        };
        this.frame = 0;
        window.addEventListener('resize', () => {
          this.setSize();
          this.resize();
        });
        this.mouse = new Vector(0, 0);
        window.addEventListener('pointermove', (event) => {
          this.pMove(event);
        });
      }
      pMove(event) {
        this.mouse.x = event.clientX - this.canvas.offsetLeft;
        this.mouse.y = event.clientY - this.canvas.offsetTop;
      }
      setSize() {
        this.W = this.canvas.width = window.innerWidth;
        this.H = this.canvas.height = window.innerHeight;
      }
      update(dt) {}
      render() {}
      resize() {}
      loop() {
        let currentBg = params.greenScreen ? '#00ff00' : params.bgColor;
        document.body.style.backgroundColor = currentBg;
        this.ctx.fillStyle = currentBg;
        this.ctx.fillRect(0, 0, this.W, this.H);

        this.timeData.now = Util.timeStamp();
        this.timeData.dt = this.timeData.dt + Math.min(1, (this.timeData.now - this.timeData.last) / 1000);
        while (this.timeData.dt > this.timeData.step) {
          this.timeData.dt = this.timeData.dt - this.timeData.step;
          this.update(this.timeData.step);
        }
        this.render();
        this.timeData.last = this.timeData.now;
        this.frame += 1;

        requestAnimationFrame(() => this.loop());
      }
      run() {
        this.setSize();
        this.loop();
      }
    }

    let app = new Tagada();
    let target = new Vector(window.innerWidth / 2, window.innerHeight / 2);

    let div = {
      x: { value: 0, min: 1, max: 24, size: 0 },
      y: { value: 0, min: 1, max: 12, size: 0 },
      total: 1
    };

    let gap = 0,
        padding = 10,
        margin = -gap / 2 + padding;

    app.divide = function() {
      div.x.max = params.divXMax;
      div.y.max = params.divYMax;
      gap = params.gap;
      padding = params.padding;
      margin = -gap / 2 + padding;

      div.x.value = Math.max(1, Math.round(
        Util.map(this.W, 0, window.screen.width, div.x.min, div.x.max)
      ));
      div.y.value = Math.max(1, Math.round(
        Util.map(this.H, 0, window.screen.height, div.y.min, div.y.max)
      ));
      div.x.size = -gap + (this.W - margin * 2) / div.x.value;
      div.y.size = -gap + (this.H - margin * 2) / div.y.value;
      div.total = div.x.value * div.y.value;
    };

    app.update = function(dt) {
      // Map screen mouse coordinates to transformed scene coordinates
      let sceneMouseX = (this.mouse.x - params.panX) / params.zoom;
      let sceneMouseY = (this.mouse.y - params.panY) / params.zoom;

      let mousePos = new Vector(sceneMouseX, sceneMouseY);
      let offset = mousePos.copy();
      offset.sub(target);
      offset.mult(params.mouseLag);
      target.add(offset.copy());
    };

    app.render = function() {
      let $ = this.ctx;
      $.save();

      // Camera Viewport Transformation (Pan & Zoom)
      $.translate(params.panX, params.panY);
      $.scale(params.zoom, params.zoom);

      $.globalCompositeOperation = params.compositeOperation;

      let curScheme = SCHEMES[params.colorScheme] || SCHEMES['Original'];
      let palette = curScheme.palette || [params.primaryColor];
      let isInverted = (params.colorScheme.startsWith('Achromatic') && params.achromaticVariant === 'Black on White');

      let curTintedCanvases = palette.map(c => getTintedSprite(c, isInverted));
      let primaryTintCanvas = getTintedSprite(params.primaryColor, isInverted);
      let originalSpriteCanvas = getTintedSprite('original', isInverted);

      for (let i = 0; i < div.total; i++) {
        let col = Math.floor(i / div.y.value);
        let row = i % div.y.value;
        let x = gap / 2 + margin + col * (gap + div.x.size);
        let y = gap / 2 + margin + row * (gap + div.y.size);

        let minS = Math.min(div.x.size, div.y.size) * params.diskScale;
        if (minS <= 0) continue;

        let cellCenterX = x + (div.x.size - minS) / 2;
        let cellCenterY = y + (div.y.size - minS) / 2;

        // Wave animation calculation
        let mouseDeltaX = (cellCenterX - target.x) * (params.mouseInfluence * 0.005);
        let mouseDeltaY = (cellCenterY - target.y) * (params.mouseInfluence * 0.005);
        let animOffset = app.frame * params.speed + (x + mouseDeltaX) * params.waveX + (y + mouseDeltaY) * params.waveY;
        let frameIndex = Math.floor(Math.abs(animOffset)) % SPRITE_FRAMES;
        let sourceX = frameIndex * CELL_SIZE;

        // Color Mode Handling
        let activeSprite;
        if (params.colorMode === 'Original / Grayscale') {
          activeSprite = originalSpriteCanvas;
        } else if (params.colorMode === 'Uniform Color') {
          activeSprite = primaryTintCanvas;
        } else if (params.colorMode === 'Radial Wave') {
          let dist = Math.hypot(cellCenterX - target.x, cellCenterY - target.y);
          let palIdx = Math.floor(dist * 0.008 + app.frame * 0.04) % palette.length;
          activeSprite = curTintedCanvases[palIdx < 0 ? 0 : palIdx];
        } else {
          // Default: Palette Grid
          activeSprite = curTintedCanvases[i % palette.length];
        }

        $.drawImage(activeSprite, sourceX, 0, CELL_SIZE, CELL_SIZE, cellCenterX, cellCenterY, minS, minS);
      }

      $.restore();
    };

    app.resize = function() {
      this.divide();
    };

    /*************************************************
     * Scheme Application & Randomizer
     *************************************************/
    function applyScheme(schemeName) {
      let scheme = SCHEMES[schemeName];
      if (!scheme) return;
      params.colorScheme = schemeName;
      params.bgColor = scheme.bg;
      params.primaryColor = scheme.primary;
      params.secondaryColor = scheme.secondary;

      if (schemeName === 'Achromatic' && params.achromaticVariant === 'Black on White') {
        params.bgColor = '#FFFFFF';
      }

      tintCache.clear();
      updateGuiControllers();
    }

    function randomizeScene() {
      let schemeKeys = Object.keys(SCHEMES);
      let nextScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      if (nextScheme === params.colorScheme && schemeKeys.length > 1) {
        nextScheme = schemeKeys[(schemeKeys.indexOf(nextScheme) + 1) % schemeKeys.length];
      }
      applyScheme(nextScheme);

      // Randomize geometric parameters
      params.divXMax = Math.floor(Util.random(10, 32));
      params.divYMax = Math.floor(Util.random(6, 20));
      params.gap = Math.round(Util.random(-15, 25));
      params.padding = Math.round(Util.random(2, 35));
      params.diskScale = +(Util.random(0.75, 1.35)).toFixed(2);

      // Randomize motion parameters
      params.speed = +(Util.random(0.18, 0.8)).toFixed(2);
      let signs = [1, -1];
      params.waveX = +(Util.random(0.015, 0.07) * signs[Math.floor(Math.random() * 2)]).toFixed(3);
      params.waveY = +(Util.random(0.015, 0.07) * signs[Math.floor(Math.random() * 2)]).toFixed(3);

      // Randomize patterns & color mode
      let modes = ['Palette Grid', 'Radial Wave', 'Uniform Color'];
      params.colorMode = modes[Math.floor(Math.random() * modes.length)];

      let patterns = ['Auto (Online / Procedural)', 'Phenakistoscope', 'Spiral Vortex', 'Concentric Grooves', 'Geometric Star'];
      params.diskPattern = patterns[Math.floor(Math.random() * patterns.length)];

      let blendModes = ['source-over', 'screen', 'lighter'];
      params.compositeOperation = blendModes[Math.floor(Math.random() * blendModes.length)];

      app.divide();
      tintCache.clear();
      updateGuiControllers();
    }

    /*************************************************
     * Zoom with Wheel & Drag Object Across Screen
     *************************************************/
    const canvas = app.canvas;

    // Wheel Zoom centered on cursor
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      let zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
      let minZoom = 0.05;
      let maxZoom = 25.0;
      let oldZoom = params.zoom;
      let newZoom = Math.min(Math.max(oldZoom * zoomFactor, minZoom), maxZoom);

      let mouseX = e.clientX;
      let mouseY = e.clientY;

      params.panX = mouseX - (mouseX - params.panX) * (newZoom / oldZoom);
      params.panY = mouseY - (mouseY - params.panY) * (newZoom / oldZoom);
      params.zoom = newZoom;

      updateGuiControllers();
    }, { passive: false });

    // Mouse Dragging & Scene Click
    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let dragStartPanX = 0;
    let dragStartPanY = 0;
    let dragMoved = false;

    canvas.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      isDragging = true;
      dragMoved = false;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      dragStartPanX = params.panX;
      dragStartPanY = params.panY;
      canvas.classList.add('dragging');
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      let dx = e.clientX - dragStartX;
      let dy = e.clientY - dragStartY;
      if (Math.hypot(dx, dy) > 5) {
        dragMoved = true;
      }
      params.panX = dragStartPanX + dx;
      params.panY = dragStartPanY + dy;
      updateGuiControllers();
    });

    window.addEventListener('mouseup', (e) => {
      if (!isDragging) return;
      isDragging = false;
      canvas.classList.remove('dragging');

      if (!dragMoved && e.target === canvas) {
        if (params.clickToRandomize) {
          randomizeScene();
        }
      }
    });

    // Touch Support for Mobile / Tablet Drag & Pinch
    let touchStartDist = 0;
    let touchStartZoom = 1;
    let touchMoved = false;

    canvas.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        isDragging = true;
        touchMoved = false;
        dragStartX = e.touches[0].clientX;
        dragStartY = e.touches[0].clientY;
        dragStartPanX = params.panX;
        dragStartPanY = params.panY;
      } else if (e.touches.length === 2) {
        isDragging = false;
        touchStartDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        touchStartZoom = params.zoom;
      }
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (e.touches.length === 1 && isDragging) {
        let dx = e.touches[0].clientX - dragStartX;
        let dy = e.touches[0].clientY - dragStartY;
        if (Math.hypot(dx, dy) > 6) touchMoved = true;
        params.panX = dragStartPanX + dx;
        params.panY = dragStartPanY + dy;
        updateGuiControllers();
      } else if (e.touches.length === 2) {
        touchMoved = true;
        let currentDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        if (touchStartDist > 0) {
          let scaleFactor = currentDist / touchStartDist;
          params.zoom = Math.min(Math.max(touchStartZoom * scaleFactor, 0.05), 25.0);
          updateGuiControllers();
        }
      }
    }, { passive: false });

    canvas.addEventListener('touchend', (e) => {
      if (isDragging && !touchMoved && e.touches.length === 0) {
        if (params.clickToRandomize) {
          randomizeScene();
        }
      }
      if (e.touches.length === 0) {
        isDragging = false;
      }
    });

    /*************************************************
     * lil-gui Control Panel Setup
     *************************************************/
    const gui = new GUI({ title: 'Scene Controls' });

    function updateGuiControllers() {
      gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    // Theme & Color Folder
    const themeFolder = gui.addFolder('Theme & Color');
    themeFolder.add(params, 'colorScheme', Object.keys(SCHEMES)).name('Color Scheme').onChange(applyScheme);
    themeFolder.add(params, 'greenScreen').name('Green Screen (#00ff00)');
    themeFolder.addColor(params, 'bgColor').name('Background Color');
    themeFolder.addColor(params, 'primaryColor').name('Primary Color').onChange(() => tintCache.clear());
    themeFolder.addColor(params, 'secondaryColor').name('Secondary Color').onChange(() => tintCache.clear());
    themeFolder.add(params, 'colorMode', ['Palette Grid', 'Radial Wave', 'Uniform Color', 'Original / Grayscale']).name('Color Mode');
    themeFolder.add(params, 'achromaticVariant', ['White on Black', 'Black on White']).name('Achromatic Style').onChange((val) => {
      if (params.colorScheme.startsWith('Achromatic')) {
        params.bgColor = (val === 'Black on White') ? '#FFFFFF' : '#000000';
      }
      tintCache.clear();
      updateGuiControllers();
    });

    // Geometry & Grid Folder
    const geomFolder = gui.addFolder('Geometry & Grid');
    geomFolder.add(params, 'divXMax', 1, 48, 1).name('Grid Columns Max').onChange(() => app.divide());
    geomFolder.add(params, 'divYMax', 1, 24, 1).name('Grid Rows Max').onChange(() => app.divide());
    geomFolder.add(params, 'gap', -40, 60, 1).name('Disk Spacing (Gap)').onChange(() => app.divide());
    geomFolder.add(params, 'padding', 0, 100, 1).name('Border Padding').onChange(() => app.divide());
    geomFolder.add(params, 'diskScale', 0.2, 2.5, 0.05).name('Disk Scale');
    geomFolder.add(params, 'diskPattern', ['Auto (Online / Procedural)', ...PATTERN_TYPES]).name('Disk Pattern').onChange(() => tintCache.clear());
    geomFolder.add(params, 'compositeOperation', ['source-over', 'screen', 'lighter', 'multiply', 'difference']).name('Blend Mode');

    // Motion & Wave Folder
    const motionFolder = gui.addFolder('Motion & Dynamics');
    motionFolder.add(params, 'speed', -1.5, 1.5, 0.01).name('Rotation Speed');
    motionFolder.add(params, 'waveX', -0.15, 0.15, 0.002).name('Wave Frequency X');
    motionFolder.add(params, 'waveY', -0.15, 0.15, 0.002).name('Wave Frequency Y');
    motionFolder.add(params, 'mouseLag', 0.01, 0.5, 0.01).name('Mouse Follow Lag');
    motionFolder.add(params, 'mouseInfluence', 0.0, 3.0, 0.1).name('Mouse Wave Strength');

    // Camera & Navigation Folder
    const viewFolder = gui.addFolder('Camera & Navigation');
    viewFolder.add(params, 'zoom', 0.05, 10.0, 0.01).name('Zoom');
    viewFolder.add(params, 'panX', -2000, 2000, 1).name('Pan X');
    viewFolder.add(params, 'panY', -2000, 2000, 1).name('Pan Y');
    viewFolder.add(params, 'resetView').name('Reset Pan & Zoom');

    // Procedural Randomizer Folder
    const randFolder = gui.addFolder('Procedural Randomizer');
    randFolder.add(params, 'clickToRandomize').name('Click Scene to Randomize');
    randFolder.add(params, 'randomizeNow').name('Randomize Scene 🎲');

    /*************************************************
     * Hide / Show UI with 'H' Key
     *************************************************/
    let isGuiVisible = true;
    window.addEventListener('keydown', (e) => {
      if (e.target && ['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) {
        return;
      }
      if (e.key === 'h' || e.key === 'H') {
        isGuiVisible = !isGuiVisible;
        if (typeof gui.show === 'function') {
          gui.show(isGuiVisible);
        }
        if (gui.domElement) {
          gui.domElement.style.display = isGuiVisible ? '' : 'none';
        }
      }
    });

    /*************************************************
     * Initialization
     *************************************************/
    app.setSize();
    target = new Vector(app.W / 2, app.H / 2);
    app.mouse = new Vector(app.W / 2, app.H / 2);
    app.divide();
    app.run();
  </script>
</body>
</html>
