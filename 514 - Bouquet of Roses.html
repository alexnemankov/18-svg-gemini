<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bouquet of Roses in a Dark Room</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas#webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      outline: none;
    }
    .lil-gui {
      z-index: 100 !important;
    }
  </style>

  <!-- Import Map for PostProcessor & Three modules -->
  <script type="importmap">
  {
    "imports": {
      "postprocessing/PostProcessor.js": "./postprocessing/PostProcessor.js"
    }
  }
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
  <canvas id="webgl-canvas"></canvas>

  <script type="module">
    import GUI from "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js";

    // =========================================================================
    // POST PROCESSOR SUITE (From postprocessing/PostProcessor.js)
    // Inlined for complete standalone file:// protocol support & web servers
    // =========================================================================
    const orthoVertexShader = `
    precision highp float;
    in vec3 position;
    out vec2 vUv;
    void main() {
      vUv = position.xy * 0.5 + 0.5;
      gl_Position = vec4(position.xy, 0.0, 1.0);
    }
    `;

    const brightFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float bloomThreshold;
    in vec2 vUv;
    out vec4 fragColor;

    vec3 sanitize(vec3 v) {
      if (isnan(v.x) || isinf(v.x)) v.x = 0.0;
      if (isnan(v.y) || isinf(v.y)) v.y = 0.0;
      if (isnan(v.z) || isinf(v.z)) v.z = 0.0;
      return clamp(v, vec3(0.0), vec3(65000.0));
    }

    void main() {
      vec4 raw = texture(inputTexture, vUv);
      vec3 color = sanitize(raw.rgb);
      float luminance = max(0.0, dot(color, vec3(0.2126, 0.7152, 0.0722)));
      float knee = 0.1;
      float soft = luminance - bloomThreshold + knee;
      soft = clamp(soft, 0.0, 2.0 * knee);
      soft = (soft * soft) / (4.0 * knee + 0.00001);
      float contribution = max(soft, luminance - bloomThreshold);
      contribution /= max(luminance, 0.0001);
      vec3 result = color * contribution;
      fragColor = vec4(sanitize(result), clamp(raw.a, 0.0, 1.0));
    }
    `;

    const blur13ShaderChunk = `
    vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
      vec2 resolution = vec2(textureSize(image, 0));
      vec4 color = vec4(0.0);
      vec2 off1 = vec2(1.411764705882353) * direction;
      vec2 off2 = vec2(3.2941176470588234) * direction;
      vec2 off3 = vec2(5.176470588235294) * direction;
      color += texture(image, uv) * 0.1964825501511404;
      color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
      color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
      return color;
    }
    `;

    const blurFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 direction;
    in vec2 vUv;
    out vec4 color;
    ${blur13ShaderChunk}

    vec4 sanitize(vec4 v) {
      if (isnan(v.x) || isinf(v.x)) v.x = 0.0;
      if (isnan(v.y) || isinf(v.y)) v.y = 0.0;
      if (isnan(v.z) || isinf(v.z)) v.z = 0.0;
      if (isnan(v.w) || isinf(v.w)) v.w = 0.0;
      return clamp(v, vec4(0.0), vec4(65000.0));
    }

    void main() {
      color = sanitize(blur13(inputTexture, vUv, direction));
    }
    `;

    const anamorphicBrightShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float threshold;
    uniform float smoothWidth;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float v = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float alpha = smoothstep(threshold, threshold + smoothWidth, v);
      fragColor = mix(vec4(0.0), color, alpha);
    }
    `;

    const anamorphicBlurShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 resolution;
    uniform float samples;
    uniform float intensity;
    uniform vec3 tintColor;
    uniform float bloomRadius;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      int halfSamples = max(1, int(samples) / 2);
      float fHalfSamples = float(halfSamples);
      vec2 invSize = 1.0 / resolution;
      vec4 total = vec4(0.0);

      for (int i = -64; i <= 64; i++) {
        if (i < -halfSamples || i > halfSamples) continue;
        float softness = 1.0 - abs(float(i)) / fHalfSamples;
        softness = pow(softness, 2.0);
        vec2 shiftedUV = vec2(vUv.x + invSize.x * float(i) * (4.0 + bloomRadius * 8.0), vUv.y);
        shiftedUV = clamp(shiftedUV, 0.001, 0.999);
        total += texture(inputTexture, shiftedUV) * softness;
      }

      fragColor = (total / (samples / 3.0)) * vec4(tintColor, 1.0) * intensity;
    }
    `;

    const finalFragmentShader = `
    precision highp float;
    uniform vec2 resolution;
    uniform sampler2D inputTexture;
    uniform sampler2D blur0Texture;
    uniform sampler2D blur1Texture;
    uniform sampler2D blur2Texture;
    uniform sampler2D blur3Texture;
    uniform sampler2D blur4Texture;
    uniform sampler2D anamorphicTexture;
    uniform bool bloomEnabled;
    uniform bool anamorphicEnabled;
    uniform float bloomStrength;
    uniform float bloomRadius;
    uniform float vignetteBoost;
    uniform float vignetteReduction;
    uniform float time;
    in vec2 vUv;
    out vec4 fragColor;

    vec3 sanitize(vec3 v) {
      if (isnan(v.x) || isinf(v.x)) v.x = 0.0;
      if (isnan(v.y) || isinf(v.y)) v.y = 0.0;
      if (isnan(v.z) || isinf(v.z)) v.z = 0.0;
      return clamp(v, vec3(0.0), vec3(65000.0));
    }

    void main() {
      vec4 rawBase = texture(inputTexture, vUv);
      vec3 color = sanitize(rawBase.rgb);

      if (bloomEnabled) {
        vec3 b0 = sanitize(texture(blur0Texture, vUv).rgb);
        vec3 b1 = sanitize(texture(blur1Texture, vUv).rgb);
        vec3 b2 = sanitize(texture(blur2Texture, vUv).rgb);
        vec3 b3 = sanitize(texture(blur3Texture, vUv).rgb);
        vec3 b4 = sanitize(texture(blur4Texture, vUv).rgb);
        float r = clamp(bloomRadius, 0.0, 1.0);
        float w0 = 1.0 - 0.7 * r;
        float w1 = 0.8;
        float w2 = 0.6 + 0.4 * r;
        float w3 = 0.4 + 0.6 * r;
        float w4 = 0.2 + 0.8 * r;
        vec3 bloom = (b0 * w0 + b1 * w1 + b2 * w2 + b3 * w3 + b4 * w4) / (w0 + w1 + w2 + w3 + w4);
        color += bloom * bloomStrength;
      }

      if (anamorphicEnabled) {
        vec3 a = sanitize(texture(anamorphicTexture, vUv).rgb);
        color += a;
      }

      vec2 center = vUv - 0.5;
      float dist = length(center);
      float vig = 1.0 - smoothstep(vignetteBoost * 0.5, vignetteBoost * 0.5 + vignetteReduction * 0.5, dist);
      color *= clamp(vig, 0.0, 1.0);

      fragColor = vec4(sanitize(color), clamp(rawBase.a, 0.0, 1.0));
    }
    `;

    const rgbSplitFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float chromaticAberration;
    uniform float noiseIntensity;
    uniform float fisheyeStrength;
    uniform float fisheyeRadius;
    uniform float gamma;
    uniform float minInputLevel;
    uniform float maxInputLevel;
    uniform float exposure;
    uniform float time;
    in vec2 vUv;
    out vec4 fragColor;

    vec3 ACESFilmicToneMapping(vec3 x) {
      float a = 2.51;
      float b = 0.03;
      float c = 2.43;
      float d = 0.59;
      float e = 0.14;
      return clamp((x * (a * x + b)) / (x * (c * x + d) + e), 0.0, 1.0);
    }

    vec3 finalLevels(vec3 color, vec3 minIn, vec3 gammaIn, vec3 maxIn) {
      return pow(clamp((color - minIn) / max(maxIn - minIn, vec3(0.0001)), 0.0, 1.0), 1.0 / max(gammaIn, vec3(0.0001)));
    }

    float hash(vec2 p) {
      vec3 p3 = fract(vec3(p.xyx) * 0.1031);
      p3 += dot(p3, p3.yzx + 33.33);
      return fract((p3.x + p3.y) * p3.z);
    }

    void main() {
      vec2 uv = vUv;
      if (abs(fisheyeStrength) > 0.001) {
        vec2 d = uv - 0.5;
        float r = length(d) / max(fisheyeRadius, 0.001);
        float bind = (fisheyeStrength > 0.0) ? 0.7071 : 0.5;
        if (r < bind) {
          float factor = 1.0 + fisheyeStrength * (r * r);
          uv = 0.5 + d * factor;
        }
      }

      vec2 offset = (uv - 0.5) * chromaticAberration;
      float r = texture(inputTexture, uv - offset).r;
      float g = texture(inputTexture, uv).g;
      float b = texture(inputTexture, uv + offset).b;
      vec3 col = vec3(r, g, b);

      if (noiseIntensity > 0.0001) {
        float n = (hash(uv * 1234.5 + time) - 0.5) * noiseIntensity;
        col += n;
      }

      vec3 exposedColor = col * exposure;
      vec3 toneMappedColor = ACESFilmicToneMapping(exposedColor);
      vec3 finalCol = finalLevels(toneMappedColor, vec3(minInputLevel), vec3(gamma), vec3(maxInputLevel));

      fragColor = vec4(finalCol, 1.0);
    }
    `;

    function createFBO(w, h, options = {}) {
      return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
        wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
        wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
        minFilter: options.minFilter || THREE.LinearFilter,
        magFilter: options.magFilter || THREE.LinearFilter,
        format: options.format || THREE.RGBAFormat,
        type: options.type || THREE.HalfFloatType,
        stencilBuffer: options.stencilBuffer || false,
        depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : true,
        samples: options.samples || 0,
      });
    }

    class ShaderPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbo = createFBO(1, 1, options);
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
        this.texture = this.fbo.texture;
      }
      render(renderer, toScreen = false) {
        if (!toScreen) renderer.setRenderTarget(this.fbo);
        renderer.render(this.orthoScene, this.orthoCamera);
        if (!toScreen) renderer.setRenderTarget(null);
      }
      setSize(width, height) {
        this.fbo.setSize(Math.max(1, width), Math.max(1, height));
        this.orthoQuad.scale.set(width, height, 1);
      }
    }

    class ShaderPingPongPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
        this.currentFBO = 0;
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
      }
      render(renderer) {
        renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
        renderer.render(this.orthoScene, this.orthoCamera);
        renderer.setRenderTarget(null);
        this.currentFBO = 1 - this.currentFBO;
      }
      get current() { return this.fbos[this.currentFBO]; }
      get texture() { return this.current.texture; }
      setSize(width, height) {
        const w = Math.max(1, width);
        const h = Math.max(1, height);
        this.orthoQuad.scale.set(w, h, 1);
        this.fbos[0].setSize(w, h);
        this.fbos[1].setSize(w, h);
      }
    }

    class BloomPass {
      constructor(strength = 0.85, radius = 0.55, threshold = 0.25, levels = 5) {
        this.strength = strength;
        this.radius = radius;
        this.threshold = threshold;
        this.enabled = true;
        this.levels = levels;

        this.brightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            bloomThreshold: { value: this.threshold },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: brightFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.brightPass = new ShaderPass(this.brightShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.blurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            direction: { value: new THREE.Vector2(0, 1) },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: blurFragmentShader,
          glslVersion: THREE.GLSL3,
        });

        this.blurPasses = [];
        for (let i = 0; i < this.levels; i++) {
          this.blurPasses.push(new ShaderPingPongPass(this.blurShader, {
            format: THREE.RGBAFormat,
            type: THREE.HalfFloatType,
          }));
        }
      }

      setSize(width, height) {
        let w = width;
        let h = height;
        this.brightPass.setSize(w, h);
        for (let i = 0; i < this.levels; i++) {
          w = Math.max(1, Math.floor(w / 2));
          h = Math.max(1, Math.floor(h / 2));
          this.blurPasses[i].setSize(w, h);
        }
      }

      render(renderer) {
        this.brightShader.uniforms.inputTexture.value = this.source;
        this.brightShader.uniforms.bloomThreshold.value = this.threshold;
        this.brightPass.render(renderer);

        let input = this.brightPass.texture;
        for (let i = 0; i < this.levels; i++) {
          const pass = this.blurPasses[i];
          this.blurShader.uniforms.inputTexture.value = input;
          this.blurShader.uniforms.direction.value.set(1, 0);
          pass.render(renderer);

          this.blurShader.uniforms.inputTexture.value = pass.texture;
          this.blurShader.uniforms.direction.value.set(0, 1);
          pass.render(renderer);

          input = pass.texture;
        }
      }
    }

    class PostProcessor {
      constructor(renderer, params = {}) {
        this.renderer = renderer;

        this.settings = {
          enabled: params.enabled !== undefined ? params.enabled : true,

          // 1. Universal 3-Param Bloom Engine
          bloomEnabled: params.bloomEnabled !== undefined ? params.bloomEnabled : true,
          bloomStrength: params.bloomStrength !== undefined ? params.bloomStrength : 0.9,
          bloomRadius: params.bloomRadius !== undefined ? params.bloomRadius : 0.55,
          bloomThreshold: params.bloomThreshold !== undefined ? params.bloomThreshold : 0.22,

          // 2. Three.js Anamorphic Flare Settings (STRICTLY DEFAULT OFF as requested)
          anamorphicEnabled: params.anamorphicEnabled !== undefined ? params.anamorphicEnabled : false,
          anamorphicIntensity: params.anamorphicIntensity !== undefined ? params.anamorphicIntensity : 4.0,
          anamorphicThreshold: params.anamorphicThreshold !== undefined ? params.anamorphicThreshold : 0.35,
          anamorphicSamples: params.anamorphicSamples !== undefined ? params.anamorphicSamples : 64,
          anamorphicRadius: params.anamorphicRadius !== undefined ? params.anamorphicRadius : 0.0,
          anamorphicSmoothWidth: params.anamorphicSmoothWidth !== undefined ? params.anamorphicSmoothWidth : 0.05,
          anamorphicColor: params.anamorphicColor ? (params.anamorphicColor.isColor ? params.anamorphicColor.clone() : new THREE.Color(params.anamorphicColor)) : new THREE.Color(0xffb050),
          anamorphicColorHex: params.anamorphicColorHex || '#ffb050',

          // 3. Lens & Camera Optics
          fisheyeStrength: params.fisheyeStrength !== undefined ? params.fisheyeStrength : 0.0,
          fisheyeRadius: params.fisheyeRadius !== undefined ? params.fisheyeRadius : 1.0,
          chromaticAberration: params.chromaticAberration !== undefined ? params.chromaticAberration : 0.005,
          vignetteBoost: params.vignetteBoost !== undefined ? params.vignetteBoost : 1.05,
          vignetteReduction: params.vignetteReduction !== undefined ? params.vignetteReduction : 0.55,
          noiseIntensity: params.noiseIntensity !== undefined ? params.noiseIntensity : 0.01,

          // 4. Color Grading, Exposure & Tone
          gamma: params.gamma !== undefined ? params.gamma : 1.0,
          minInputLevel: params.minInputLevel !== undefined ? params.minInputLevel : 0.0,
          maxInputLevel: params.maxInputLevel !== undefined ? params.maxInputLevel : 1.0,
          exposure: params.exposure !== undefined ? params.exposure : 1.0,
        };

        const maxSamples = (this.renderer && this.renderer.capabilities) ? (this.renderer.capabilities.maxSamples || 4) : 4;
        this.sceneTarget = createFBO(1, 1, { type: THREE.HalfFloatType, samples: maxSamples, depthBuffer: true });

        this.bloomPass = new BloomPass(
          this.settings.bloomStrength,
          this.settings.bloomRadius,
          this.settings.bloomThreshold,
          5
        );

        // Anamorphic Passes
        this.anamorphicBrightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            threshold: { value: this.settings.anamorphicThreshold },
            smoothWidth: { value: this.settings.anamorphicSmoothWidth },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: anamorphicBrightShader,
          glslVersion: THREE.GLSL3,
        });
        this.anamorphicBrightPass = new ShaderPass(this.anamorphicBrightShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.anamorphicBlurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            resolution: { value: new THREE.Vector2(1, 1) },
            samples: { value: this.settings.anamorphicSamples },
            intensity: { value: this.settings.anamorphicIntensity },
            tintColor: { value: this.settings.anamorphicColor },
            bloomRadius: { value: this.settings.anamorphicRadius },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: anamorphicBlurShader,
          glslVersion: THREE.GLSL3,
        });
        this.anamorphicBlurPass = new ShaderPass(this.anamorphicBlurShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        // Final Composite Pass
        this.finalShader = new THREE.RawShaderMaterial({
          uniforms: {
            resolution: { value: new THREE.Vector2(1, 1) },
            inputTexture: { value: null },
            blur0Texture: { value: null },
            blur1Texture: { value: null },
            blur2Texture: { value: null },
            blur3Texture: { value: null },
            blur4Texture: { value: null },
            anamorphicTexture: { value: null },
            bloomEnabled: { value: this.settings.bloomEnabled },
            anamorphicEnabled: { value: this.settings.anamorphicEnabled },
            bloomStrength: { value: this.settings.bloomStrength },
            bloomRadius: { value: this.settings.bloomRadius },
            vignetteBoost: { value: this.settings.vignetteBoost },
            vignetteReduction: { value: this.settings.vignetteReduction },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: finalFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.finalPass = new ShaderPass(this.finalShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        // RGB Split, Film Grain & Tone Curve Pass
        this.rgbShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            chromaticAberration: { value: this.settings.chromaticAberration },
            noiseIntensity: { value: this.settings.noiseIntensity },
            fisheyeStrength: { value: this.settings.fisheyeStrength },
            fisheyeRadius: { value: this.settings.fisheyeRadius },
            gamma: { value: this.settings.gamma },
            minInputLevel: { value: this.settings.minInputLevel },
            maxInputLevel: { value: this.settings.maxInputLevel },
            exposure: { value: this.settings.exposure },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: rgbSplitFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.rgbPass = new ShaderPass(this.rgbShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });
      }

      updateSettings() {
        this.bloomPass.strength = this.settings.bloomStrength;
        this.bloomPass.radius = this.settings.bloomRadius;
        this.bloomPass.threshold = this.settings.bloomThreshold;

        this.anamorphicBrightShader.uniforms.threshold.value = this.settings.anamorphicThreshold;
        this.anamorphicBrightShader.uniforms.smoothWidth.value = this.settings.anamorphicSmoothWidth;
        this.anamorphicBlurShader.uniforms.samples.value = this.settings.anamorphicSamples;
        this.anamorphicBlurShader.uniforms.intensity.value = this.settings.anamorphicIntensity;
        this.anamorphicBlurShader.uniforms.tintColor.value.copy(this.settings.anamorphicColor);
        this.anamorphicBlurShader.uniforms.bloomRadius.value = this.settings.anamorphicRadius;

        this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
        this.finalShader.uniforms.anamorphicEnabled.value = this.settings.anamorphicEnabled;
        this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
        this.finalShader.uniforms.bloomRadius.value = this.settings.bloomRadius;
        this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
        this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;

        this.rgbShader.uniforms.chromaticAberration.value = this.settings.chromaticAberration;
        this.rgbShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;
        this.rgbShader.uniforms.fisheyeStrength.value = this.settings.fisheyeStrength;
        this.rgbShader.uniforms.fisheyeRadius.value = this.settings.fisheyeRadius;
        this.rgbShader.uniforms.gamma.value = this.settings.gamma;
        this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
        this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
        this.rgbShader.uniforms.exposure.value = this.settings.exposure;
      }

      setSize(width, height) {
        const w = Math.max(1, width);
        const h = Math.max(1, height);
        this.sceneTarget.setSize(w, h);
        this.bloomPass.setSize(w, h);
        this.finalPass.setSize(w, h);
        this.finalShader.uniforms.resolution.value.set(w, h);

        const anW = Math.max(1, Math.floor(w / 2));
        const anH = Math.max(1, Math.floor(h / 4));
        this.anamorphicBrightPass.setSize(anW, anH);
        this.anamorphicBlurPass.setSize(anW, anH);
        this.anamorphicBlurShader.uniforms.resolution.value.set(anW, anH);

        this.rgbPass.setSize(w, h);
      }

      renderScene(scene, camera) {
        if (!this.settings.enabled) {
          this.renderer.render(scene, camera);
          return;
        }

        this.renderer.setRenderTarget(this.sceneTarget);
        this.renderer.render(scene, camera);
        this.renderer.setRenderTarget(null);

        this.render(this.sceneTarget.texture);
      }

      render(sourceTexture) {
        if (this.settings.bloomEnabled) {
          this.bloomPass.source = sourceTexture;
          this.bloomPass.render(this.renderer);
          this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
          this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
          this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
          this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
          this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;
        }

        if (this.settings.anamorphicEnabled && this.settings.anamorphicIntensity > 0.001) {
          this.anamorphicBrightShader.uniforms.inputTexture.value = sourceTexture;
          this.anamorphicBrightShader.uniforms.threshold.value = this.settings.anamorphicThreshold;
          this.anamorphicBrightShader.uniforms.smoothWidth.value = this.settings.anamorphicSmoothWidth;
          this.anamorphicBrightPass.render(this.renderer);

          this.anamorphicBlurShader.uniforms.inputTexture.value = this.anamorphicBrightPass.texture;
          this.anamorphicBlurShader.uniforms.samples.value = this.settings.anamorphicSamples;
          this.anamorphicBlurShader.uniforms.intensity.value = this.settings.anamorphicIntensity;
          this.anamorphicBlurShader.uniforms.tintColor.value.copy(this.settings.anamorphicColor);
          this.anamorphicBlurShader.uniforms.bloomRadius.value = this.settings.anamorphicRadius;
          this.anamorphicBlurPass.render(this.renderer);

          this.finalPass.shader.uniforms.anamorphicTexture.value = this.anamorphicBlurPass.texture;
          this.finalPass.shader.uniforms.anamorphicEnabled.value = true;
        } else {
          this.finalPass.shader.uniforms.anamorphicEnabled.value = false;
        }

        const rTime = Math.random() * 10000;
        this.finalPass.shader.uniforms.time.value = rTime;
        this.rgbPass.shader.uniforms.time.value = rTime;

        this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
        this.finalPass.render(this.renderer);

        this.rgbPass.shader.uniforms.inputTexture.value = this.finalPass.texture;
        this.rgbPass.render(this.renderer, true);
      }

    // --- Procedural Bokeh Texture ---
    function createBokehTexture() {
      const size = 128;
      const cvs = document.createElement("canvas");
      cvs.width = size;
      cvs.height = size;
      const ctx = cvs.getContext("2d");

      const grad = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
      grad.addColorStop(0, "rgba(255, 255, 255, 1.0)");
      grad.addColorStop(0.3, "rgba(255, 240, 200, 0.85)");
      grad.addColorStop(0.65, "rgba(255, 180, 80, 0.35)");
      grad.addColorStop(0.9, "rgba(255, 140, 40, 0.08)");
      grad.addColorStop(1, "rgba(255, 120, 20, 0.0)");

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
      ctx.fill();

      const texture = new THREE.CanvasTexture(cvs);
      texture.generateMipmaps = true;
      return texture;
    }

    // --- Procedural Geometry Generators ---
    function createPetalGeometry(widthScale = 1.0, lengthScale = 1.0, curl = 0.25, cup = 0.3) {
      const segU = 14;
      const segV = 14;
      const positions = [];
      const normals = [];
      const uvs = [];
      const indices = [];

      for (let iv = 0; iv <= segV; iv++) {
        const v = iv / segV;
        for (let iu = 0; iu <= segU; iu++) {
          const u = (iu / segU) * 2 - 1;

          const widthProfile = Math.sin(v * Math.PI * 0.82) * (1.0 - 0.12 * v);
          const x = u * widthProfile * widthScale * 0.52;
          const y = v * lengthScale;

          const cupZ = (1.0 - u * u) * cup * Math.sin(v * Math.PI * 0.75);
          const curlZ = (v > 0.6) ? -Math.pow((v - 0.6) / 0.4, 2) * curl : 0.0;
          const z = cupZ + curlZ;

          positions.push(x, y, z);
          uvs.push(iu / segU, v);
        }
      }

      for (let iv = 0; iv < segV; iv++) {
        for (let iu = 0; iu < segU; iu++) {
          const a = iv * (segU + 1) + iu;
          const b = (iv + 1) * (segU + 1) + iu;
          const c = (iv + 1) * (segU + 1) + (iu + 1);
          const d = iv * (segU + 1) + (iu + 1);
          indices.push(a, b, d);
          indices.push(b, c, d);
        }
      }

      const geom = new THREE.BufferGeometry();
      geom.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
      geom.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
      geom.setIndex(indices);
      geom.computeVertexNormals();
      return geom;
    }

    function createLeafGeometry(widthScale = 0.45, lengthScale = 0.9) {
      const segU = 8;
      const segV = 12;
      const positions = [];
      const uvs = [];
      const indices = [];

      for (let iv = 0; iv <= segV; iv++) {
        const v = iv / segV;
        for (let iu = 0; iu <= segU; iu++) {
          const u = (iu / segU) * 2 - 1;
          const shape = Math.sin(v * Math.PI) * (1.0 - 0.15 * v);
          const x = u * shape * widthScale * 0.5;
          const y = v * lengthScale;
          const archZ = Math.sin(v * Math.PI * 0.7) * 0.1 - Math.abs(u) * 0.06;
          positions.push(x, y, archZ);
          uvs.push(iu / segU, v);
        }
      }

      for (let iv = 0; iv < segV; iv++) {
        for (let iu = 0; iu < segU; iu++) {
          const a = iv * (segU + 1) + iu;
          const b = (iv + 1) * (segU + 1) + iu;
          const c = (iv + 1) * (segU + 1) + (iu + 1);
          const d = iv * (segU + 1) + (iu + 1);
          indices.push(a, b, d);
          indices.push(b, c, d);
        }
      }

      const geom = new THREE.BufferGeometry();
      geom.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
      geom.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
      geom.setIndex(indices);
      geom.computeVertexNormals();
      return geom;
    }

    function createWaterDropletMesh() {
      const geom = new THREE.SphereGeometry(0.024, 10, 8);
      geom.scale(1, 0.4, 1);
      const mat = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        roughness: 0.02,
        metalness: 0.08,
        transparent: true,
        opacity: 0.88
      });
      const mesh = new THREE.Mesh(geom, mat);
      return mesh;
    }

    function createRose(stage = 2, primaryMat, secondaryMat, leafMat) {
      const rose = new THREE.Group();
      const layers = stage === 2 ? 5 : (stage === 1 ? 4 : 2);
      const goldenAngle = 2.39996;

      let petalIndex = 0;
      const layerConfigs = [
        { count: 5, w: 0.32, l: 0.46, curl: 0.02, cup: 0.26, tilt: 0.16, y: 0.08, scale: 0.85 },
        { count: 7, w: 0.48, l: 0.58, curl: 0.08, cup: 0.32, tilt: 0.38, y: 0.05, scale: 0.95 },
        { count: 9, w: 0.68, l: 0.72, curl: 0.22, cup: 0.34, tilt: 0.65, y: 0.02, scale: 1.05 },
        { count: 11, w: 0.88, l: 0.88, curl: 0.38, cup: 0.30, tilt: 0.95, y: -0.02, scale: 1.18 },
        { count: 12, w: 1.05, l: 0.98, curl: 0.52, cup: 0.22, tilt: 1.25, y: -0.08, scale: 1.28 }
      ];

      for (let l = 0; l < layers; l++) {
        const cfg = layerConfigs[l];
        const petalGeom = createPetalGeometry(cfg.w, cfg.l, cfg.curl, cfg.cup);
        const mat = (l <= 1) ? secondaryMat : primaryMat;

        for (let i = 0; i < cfg.count; i++) {
          const petalMesh = new THREE.Mesh(petalGeom, mat);
          petalMesh.castShadow = true;
          petalMesh.receiveShadow = true;

          const azimuth = petalIndex * goldenAngle + (Math.random() * 0.1 - 0.05);
          petalMesh.rotation.y = azimuth;
          petalMesh.rotation.x = cfg.tilt + (Math.random() * 0.08 - 0.04);
          petalMesh.position.y = cfg.y;

          petalMesh.scale.setScalar(cfg.scale * (0.95 + Math.random() * 0.1));
          rose.add(petalMesh);
          petalIndex++;
        }
      }

      // Sepals
      const sepalGeom = createPetalGeometry(0.18, 0.45, 0.3, 0.1);
      for (let s = 0; s < 5; s++) {
        const sepal = new THREE.Mesh(sepalGeom, leafMat);
        sepal.rotation.y = (s * Math.PI * 2) / 5 + 0.3;
        sepal.rotation.x = 1.7;
        sepal.position.y = -0.12;
        sepal.scale.set(0.85, 0.85, 0.85);
        rose.add(sepal);
      }

      const stemGeom = new THREE.CylinderGeometry(0.04, 0.045, 0.45, 8);
      const stemMesh = new THREE.Mesh(stemGeom, leafMat);
      stemMesh.position.y = -0.32;
      rose.add(stemMesh);

      if (stage >= 1) {
        const dropletCount = Math.floor(Math.random() * 3) + 2;
        for (let d = 0; d < dropletCount; d++) {
          const drop = createWaterDropletMesh();
          const angle = Math.random() * Math.PI * 2;
          const rad = 0.15 + Math.random() * 0.35;
          drop.position.set(Math.cos(angle) * rad, 0.1 + Math.random() * 0.15, Math.sin(angle) * rad);
          rose.add(drop);
        }
      }

      return rose;
    }

      scene.background = new THREE.Color(params.bgColor);

      camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(2.5, 0.5, 7.5);

      renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: params.antialias,
        powerPreference: "high-performance"
      });
      renderer.setPixelRatio(params.dpr);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = params.exposure;

      // Spotlight target aiming directly at bouquet crown
      const spotTarget = new THREE.Object3D();
      spotTarget.position.set(1.85, -0.65, 0.15);
      scene.add(spotTarget);

      // Main Focused Warm Spotlight Beam: decay = 0.0 so light reaches the roses with rich power
      spotLight = new THREE.SpotLight(params.spotColor, params.spotIntensity);
      spotLight.position.set(2.4, 4.5, 2.8);
      spotLight.angle = params.spotAngle;
      spotLight.penumbra = params.spotPenumbra;
      spotLight.decay = 0.0;
      spotLight.distance = 40;
      spotLight.castShadow = true;
      spotLight.shadow.mapSize.width = 2048;
      spotLight.shadow.mapSize.height = 2048;
      spotLight.shadow.bias = -0.0008;
      spotLight.target = spotTarget;
      scene.add(spotLight);

      // Directional Key Light for soft modeling across the rose crowns
      keyLight = new THREE.DirectionalLight(0xffecd0, 1.3);
      keyLight.position.set(2.5, 3.5, 3.2);
      keyLight.target = spotTarget;
      scene.add(keyLight);

      // Ambient Fill Light to illuminate deep shadow details
      ambientLight = new THREE.AmbientLight(params.ambientColor, params.ambientIntensity);
      scene.add(ambientLight);

      // Backlight Candle Rim Light
      candleRimLight = new THREE.PointLight(params.bokehColor, params.candleRimIntensity, 15, 0.5);
      candleRimLight.position.set(1.8, -0.2, -1.2);
      scene.add(candleRimLight);

      // Subtle fill from upper left room space
      fillLight = new THREE.DirectionalLight(0x402535, 0.5);
      fillLight.position.set(-4, 3, 3);
      scene.add(fillLight);

      buildBouquet();
      buildFallingPetals();
      buildCandleBokeh();
      buildAtmosphericHaze();

      // Initialize PostProcessor Suite (Anamorphic default is OFF as requested!)
      postProcessor = new PostProcessor(renderer, {
        enabled: true,
        bloomEnabled: true,
        bloomStrength: 0.9,
        bloomRadius: 0.55,
        bloomThreshold: 0.22,
        anamorphicEnabled: false, // Default is OFF
        chromaticAberration: 0.005,
        vignetteBoost: 1.05,
        vignetteReduction: 0.55,
        noiseIntensity: 0.01
      });
      postProcessor.setSize(window.innerWidth, window.innerHeight);
    }

    // --- Build Bouquet of Roses in Lower Right Corner ---
    function buildBouquet() {
      bouquetGroup = new THREE.Group();

      // Materials with rich velvety texture catching warm highlights
      const primaryMat = new THREE.MeshStandardMaterial({
        color: new THREE.Color(params.petalPrimary),
        roughness: 0.58,
        metalness: 0.02,
        side: THREE.DoubleSide
      });
      petalMaterialsA.push(primaryMat);

      const secondaryMat = new THREE.MeshStandardMaterial({
        color: new THREE.Color(params.petalSecondary),
        roughness: 0.65,
        metalness: 0.03,
        side: THREE.DoubleSide
      });
      petalMaterialsB.push(secondaryMat);

      const leafMat = new THREE.MeshStandardMaterial({
        color: new THREE.Color(params.leavesColor),
        roughness: 0.38,
        metalness: 0.06,
        side: THREE.DoubleSide
      });
      leafMaterials.push(leafMat);

      const roseArrangements = [
        [0.0, 0.45, 0.25, 0.15, -0.2, 0.1, 1.25, 2],
        [-0.45, 0.35, 0.45, 0.3, -0.45, 0.25, 1.15, 2],
        [0.52, 0.38, 0.35, 0.25, 0.35, -0.2, 1.18, 2],
        [0.15, 0.55, -0.3, -0.25, 0.1, 0.0, 1.12, 2],
        [-0.48, 0.48, -0.2, -0.2, -0.35, 0.15, 1.08, 1],

        [-0.85, 0.12, 0.38, 0.5, -0.7, 0.35, 1.05, 1],
        [-0.78, 0.18, -0.25, -0.35, -0.65, 0.25, 1.02, 1],
        [0.82, 0.15, 0.28, 0.45, 0.65, -0.3, 1.08, 2],
        [0.78, 0.22, -0.35, -0.3, 0.6, -0.25, 1.05, 1],
        [0.0, 0.15, 0.72, 0.65, 0.0, 0.0, 1.12, 2],

        [-0.45, -0.18, 0.62, 0.75, -0.4, 0.3, 1.0, 1],
        [0.48, -0.15, 0.58, 0.7, 0.42, -0.3, 1.02, 1],
        [-0.92, -0.12, 0.0, 0.2, -1.0, 0.4, 0.95, 1],
        [0.92, -0.08, -0.05, 0.15, 0.95, -0.35, 0.95, 1],
        [0.05, -0.08, -0.65, -0.7, 0.05, 0.0, 0.98, 1],

        [-0.95, 0.45, 0.1, 0.15, -0.85, 0.4, 0.85, 0],
        [0.96, 0.48, 0.12, 0.2, 0.85, -0.4, 0.88, 0],
        [-0.35, 0.72, 0.05, -0.1, -0.25, 0.1, 0.82, 0],
        [0.45, 0.7, -0.1, -0.15, 0.3, -0.15, 0.85, 0]
      ];

      roseArrangements.forEach(([rx, ry, rz, ax, ay, az, sc, stg], idx) => {
        const rMatA = (idx % 2 === 0) ? primaryMat : secondaryMat;
        const rMatB = (idx % 2 === 0) ? secondaryMat : primaryMat;
        const roseMesh = createRose(stg, rMatA, rMatB, leafMat);
        roseMesh.position.set(rx, ry, rz);
        roseMesh.rotation.set(ax, ay, az);
        roseMesh.scale.setScalar(sc);
        bouquetGroup.add(roseMesh);
      });

      // Rose Leaves
      const leafGeom = createLeafGeometry(0.55, 1.05);
      const leafCount = 36;
      for (let i = 0; i < leafCount; i++) {
        const leafMesh = new THREE.Mesh(leafGeom, leafMat);
        leafMesh.castShadow = true;
        leafMesh.receiveShadow = true;

        const theta = (i / leafCount) * Math.PI * 2 + (Math.random() * 0.2 - 0.1);
        const radius = 0.85 + Math.random() * 0.45;
        const height = -0.35 + Math.random() * 0.65;

        leafMesh.position.set(
          Math.cos(theta) * radius,
          height,
          Math.sin(theta) * radius
        );

        leafMesh.rotation.y = theta + Math.PI / 2 + (Math.random() * 0.4 - 0.2);
        leafMesh.rotation.x = 0.5 + Math.random() * 0.6;
        leafMesh.rotation.z = (Math.random() - 0.5) * 0.5;
        leafMesh.scale.setScalar(0.7 + Math.random() * 0.5);

        if (Math.random() > 0.6) {
          const drop = createWaterDropletMesh();
          drop.position.set(0, 0.35 + Math.random() * 0.3, 0.05);
          leafMesh.add(drop);
        }

        bouquetGroup.add(leafMesh);
      }

      // Stem cluster
      const stemGroup = new THREE.Group();
      for (let s = 0; s < 14; s++) {
        const stalkGeom = new THREE.CylinderGeometry(0.045, 0.05, 2.2, 8);
        const stalk = new THREE.Mesh(stalkGeom, leafMat);
        stalk.position.set(
          (Math.random() - 0.5) * 0.35,
          -1.1 + (Math.random() - 0.5) * 0.2,
          (Math.random() - 0.5) * 0.35
        );
        stalk.rotation.set((Math.random() - 0.5) * 0.25, 0, (Math.random() - 0.5) * 0.25);
        stemGroup.add(stalk);
      }

      const ribbonGeom = new THREE.CylinderGeometry(0.32, 0.28, 0.7, 16);
      const ribbonMat = new THREE.MeshStandardMaterial({
        color: 0x140a12,
        roughness: 0.5,
        metalness: 0.2
      });
      const ribbon = new THREE.Mesh(ribbonGeom, ribbonMat);
      ribbon.position.set(0, -0.85, 0);
      stemGroup.add(ribbon);
      bouquetGroup.add(stemGroup);

      bouquetGroup.position.set(1.85, -0.85, 0.15);
      bouquetGroup.rotation.set(0.32, -0.38, 0.22);
      scene.add(bouquetGroup);
    }

    // --- Falling Petals Simulation ---
    const fallingPetalsData = [];
    function buildFallingPetals() {
      fallingPetalsGroup = new THREE.Group();

      const petalGeom = createPetalGeometry(0.85, 0.95, 0.45, 0.3);
      const petalMat = new THREE.MeshStandardMaterial({
        color: new THREE.Color(params.petalPrimary),
        roughness: 0.58,
        metalness: 0.02,
        side: THREE.DoubleSide
      });
      petalMaterialsA.push(petalMat);

      const count = 9;
      for (let i = 0; i < count; i++) {
        const mesh = new THREE.Mesh(petalGeom, petalMat);
        mesh.castShadow = true;
        mesh.scale.setScalar(0.75 + Math.random() * 0.35);

        const item = {
          mesh,
          x: 1.2 + (Math.random() - 0.5) * 2.2,
          y: -2.8 + Math.random() * 5.5,
          z: (Math.random() - 0.5) * 2.0,
          vy: 0.007 + Math.random() * 0.008,
          wobbleSpeedX: 1.2 + Math.random() * 1.5,
          wobbleSpeedZ: 0.9 + Math.random() * 1.3,
          rotSpeedX: (Math.random() - 0.5) * 0.02,
          rotSpeedY: (Math.random() - 0.5) * 0.025,
          rotSpeedZ: 0.015 + Math.random() * 0.02,
          phase: Math.random() * Math.PI * 2
        };

        mesh.position.set(item.x, item.y, item.z);
        mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);

        fallingPetalsGroup.add(mesh);
        fallingPetalsData.push(item);
      }

      scene.add(fallingPetalsGroup);
    }

    // --- Golden Bokeh from Invisible Flickering Candles ---
    const bokehParticlesData = [];
    function buildCandleBokeh() {
      bokehGroup = new THREE.Group();
      const texture = createBokehTexture();

      bokehMaterial = new THREE.SpriteMaterial({
        map: texture,
        color: new THREE.Color(params.bokehColor),
        transparent: true,
        opacity: 0.65,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      const count = 70;
      for (let i = 0; i < count; i++) {
        const sprite = new THREE.Sprite(bokehMaterial);

        const x = 0.5 + (Math.random() - 0.5) * 8.0;
        const y = -1.8 + Math.random() * 5.5;
        const z = -1.5 - Math.random() * 6.5;

        const baseScale = 0.45 + Math.random() * 1.1;
        sprite.position.set(x, y, z);
        sprite.scale.set(baseScale, baseScale, 1);

        bokehParticlesData.push({
          sprite,
          baseY: y,
          baseOpacity: 0.35 + Math.random() * 0.5,
          flickerSpeed: 0.8 + Math.random() * 2.5,
          driftSpeed: 0.15 + Math.random() * 0.35,
          phase: Math.random() * Math.PI * 2,
          scale: baseScale
        });

        bokehGroup.add(sprite);
      }

      scene.add(bokehGroup);
    }

    // --- Atmospheric Dust Haze Motes ---
    const dustParticlesData = [];
    function buildAtmosphericHaze() {
      dustGroup = new THREE.Group();

      const geom = new THREE.BufferGeometry();
      const count = 120;
      const positions = new Float32Array(count * 3);

      for (let i = 0; i < count; i++) {
        const t = Math.random();
        const spread = 0.2 + t * 1.4;
        positions[i * 3 + 0] = 2.4 - t * 0.8 + (Math.random() - 0.5) * spread;
        positions[i * 3 + 1] = 4.5 - t * 4.8 + (Math.random() - 0.5) * 0.4;
        positions[i * 3 + 2] = 2.8 - t * 2.5 + (Math.random() - 0.5) * spread;

        dustParticlesData.push({
          origX: positions[i * 3 + 0],
          origY: positions[i * 3 + 1],
          origZ: positions[i * 3 + 2],
          phase: Math.random() * Math.PI * 2,
          speed: 0.3 + Math.random() * 0.7
        });
      }

      geom.setAttribute("position", new THREE.BufferAttribute(positions, 3));

      dustMaterial = new THREE.PointsMaterial({
        color: new THREE.Color(params.spotColor),
        size: 0.035,
        transparent: true,
        opacity: 0.45,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      const pSystem = new THREE.Points(geom, dustMaterial);
      dustGroup.add(pSystem);
      scene.add(dustGroup);
    }

    // --- Dynamic Color & Preset Update with GSAP Transitions ---
    function applyColorScheme(schemeKey, duration = 0.8) {
      const scheme = COLOR_SCHEMES[schemeKey] || COLOR_SCHEMES["Original"];
      params.colorScheme = schemeKey;
      params.petalPrimary = scheme.petalPrimary;
      params.petalSecondary = scheme.petalSecondary;
      params.leavesColor = scheme.leaves;
      params.spotColor = scheme.spotlight;
      params.bokehColor = scheme.bokeh;
      params.ambientColor = scheme.ambient;
      params.bgColor = scheme.background;

      applyCurrentColors(duration);
    }

    function applyCurrentColors(duration = 0.6) {
      const targetPetalA = new THREE.Color(params.petalPrimary);
      const targetPetalB = new THREE.Color(params.petalSecondary);
      const targetLeaf = new THREE.Color(params.leavesColor);
      const targetSpot = new THREE.Color(params.spotColor);
      const targetBokeh = new THREE.Color(params.bokehColor);
      const targetAmbient = new THREE.Color(params.ambientColor);
      const targetBg = params.greenScreen ? new THREE.Color("#00ff00") : new THREE.Color(params.bgColor);

      if (duration > 0 && window.gsap) {
        gsap.to(scene.background, {
          r: targetBg.r, g: targetBg.g, b: targetBg.b,
          duration,
          ease: "power2.out"
        });
        gsap.to(scene.fog.color, {
          r: targetBg.r, g: targetBg.g, b: targetBg.b,
          duration,
          ease: "power2.out"
        });

        petalMaterialsA.forEach(m => {
          gsap.to(m.color, { r: targetPetalA.r, g: targetPetalA.g, b: targetPetalA.b, duration, ease: "power2.out" });
        });
        petalMaterialsB.forEach(m => {
          gsap.to(m.color, { r: targetPetalB.r, g: targetPetalB.g, b: targetPetalB.b, duration, ease: "power2.out" });
        });

        leafMaterials.forEach(m => {
          gsap.to(m.color, { r: targetLeaf.r, g: targetLeaf.g, b: targetLeaf.b, duration, ease: "power2.out" });
        });

        gsap.to(spotLight.color, { r: targetSpot.r, g: targetSpot.g, b: targetSpot.b, duration });
        if (keyLight) gsap.to(keyLight.color, { r: targetSpot.r, g: targetSpot.g, b: targetSpot.b, duration });
        gsap.to(ambientLight.color, { r: targetAmbient.r, g: targetAmbient.g, b: targetAmbient.b, duration });
        gsap.to(candleRimLight.color, { r: targetBokeh.r, g: targetBokeh.g, b: targetBokeh.b, duration });
        if (bokehMaterial) gsap.to(bokehMaterial.color, { r: targetBokeh.r, g: targetBokeh.g, b: targetBokeh.b, duration });
        if (dustMaterial) gsap.to(dustMaterial.color, { r: targetSpot.r, g: targetSpot.g, b: targetSpot.b, duration });
      } else {
        scene.background.copy(targetBg);
        scene.fog.color.copy(targetBg);
        petalMaterialsA.forEach(m => m.color.copy(targetPetalA));
        petalMaterialsB.forEach(m => m.color.copy(targetPetalB));
        leafMaterials.forEach(m => m.color.copy(targetLeaf));
        spotLight.color.copy(targetSpot);
        if (keyLight) keyLight.color.copy(targetSpot);
        ambientLight.color.copy(targetAmbient);
        candleRimLight.color.copy(targetBokeh);
        if (bokehMaterial) bokehMaterial.color.copy(targetBokeh);
        if (dustMaterial) dustMaterial.color.copy(targetSpot);
      }
    }

    function setGreenScreen(enabled) {
      params.greenScreen = enabled;
      if (enabled) {
        scene.background.set("#00ff00");
        scene.fog.color.set("#00ff00");
        scene.fog.density = 0.0001;
      } else {
        scene.fog.density = 0.045;
        applyCurrentColors(0.4);
      }
    }

    // --- Procedural Randomization On Click ---
    // IMPORTANT: PostProcessor settings are NEVER shuffled or changed here!
    function randomizeScene() {
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const randomSchemeKey = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      applyColorScheme(randomSchemeKey, 1.0);

      // Randomize only scene motion, geometric, and scene lighting parameters
      params.animationSpeed = 0.6 + Math.random() * 0.9;
      params.exposure = 1.25 + Math.random() * 0.35;
      params.spotIntensity = 6.0 + Math.random() * 3.0;
      params.ambientIntensity = 0.7 + Math.random() * 0.35;
      params.candleRimIntensity = 2.0 + Math.random() * 1.5;

      renderer.toneMappingExposure = params.exposure;
      spotLight.intensity = params.spotIntensity;
      if (keyLight) keyLight.intensity = 1.0 + Math.random() * 0.6;
      ambientLight.intensity = params.ambientIntensity;
      candleRimLight.intensity = params.candleRimIntensity;

      const animKeys = Object.keys(ANIMATIONS);
      params.animationMode = animKeys[Math.floor(Math.random() * animKeys.length)];

      if (bouquetGroup && window.gsap) {
        gsap.to(bouquetGroup.rotation, {
          x: 0.32 + (Math.random() - 0.5) * 0.1,
          y: -0.38 + (Math.random() - 0.5) * 0.12,
          z: 0.22 + (Math.random() - 0.5) * 0.1,
          duration: 1.2,
          ease: "power2.out"
        });
      }

      // Notice: postProcessor.settings is strictly preserved and not modified!
      if (gui) {
        gui.controllersRecursive().forEach(c => {
          // Update only core scene controllers
          if (!c.property.startsWith("anamorphic") && !c.property.startsWith("bloom") && !c.property.startsWith("vignette")) {
            c.updateDisplay();
          }
        });
      }
    }

    function resetCameraView() {
      if (window.gsap) {
        gsap.to({ zoom: userZoom, rx: userRotX, ry: userRotY, px: userPanX, py: userPanY }, {
          zoom: 1.0, rx: 0.0, ry: 0.0, px: 0.0, py: 0.0,
          duration: 0.8,
          ease: "power2.out",
          onUpdate: function() {
            userZoom = this.targets()[0].zoom;
            userRotX = this.targets()[0].rx;
            userRotY = this.targets()[0].ry;
            userPanX = this.targets()[0].px;
            userPanY = this.targets()[0].py;
          }
        });
      } else {
        userZoom = 1.0;
        userRotX = 0.0;
        userRotY = 0.0;
        userPanX = 0.0;
        userPanY = 0.0;
      }
    }

    // --- Interactive Mouse & Touch Controls ---
    function setupInteraction() {
      window.addEventListener("wheel", (e) => {
        e.preventDefault();
        const factor = 1.0 + e.deltaY * 0.001;
        userZoom = THREE.MathUtils.clamp(userZoom * factor, 0.25, 3.5);
      }, { passive: false });

      window.addEventListener("pointerdown", (e) => {
        if (e.target.closest(".lil-gui")) return;
        isPointerDown = true;
        pointerButton = e.button;
        pointerStartX = e.clientX;
        pointerStartY = e.clientY;
        pointerDragDistance = 0;
      });

      window.addEventListener("pointermove", (e) => {
        if (!isPointerDown) return;
        const dx = e.clientX - pointerStartX;
        const dy = e.clientY - pointerStartY;
        pointerStartX = e.clientX;
        pointerStartY = e.clientY;
        pointerDragDistance += Math.hypot(dx, dy);

        if (pointerButton === 2 || pointerButton === 1 || e.shiftKey) {
          userPanX += dx * 0.0055 * userZoom;
          userPanY -= dy * 0.0055 * userZoom;
        } else if (pointerButton === 0) {
          userRotX += dx * 0.0045;
          userRotY += dy * 0.0045;
          userRotY = THREE.MathUtils.clamp(userRotY, -Math.PI * 0.42, Math.PI * 0.42);
        }
      });

      window.addEventListener("pointerup", (e) => {
        if (!isPointerDown) return;
        isPointerDown = false;

        if (pointerDragDistance < 6 && e.button === 0) {
          if (!e.target.closest(".lil-gui") && params.randomizeOnClick) {
            randomizeScene();
          }
        }
      });

      window.addEventListener("contextmenu", (e) => {
        if (!e.target.closest(".lil-gui")) e.preventDefault();
      });

      window.addEventListener("keydown", (e) => {
        if (e.key === "h" || e.key === "H") {
          if (gui) {
            gui._hidden ? gui.show() : gui.hide();
          }
        }
      });

      window.addEventListener("resize", () => {
        if (!renderer || !camera) return;
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        if (postProcessor) {
          postProcessor.setSize(window.innerWidth, window.innerHeight);
        }
      });
    }

    // --- Lil-GUI Setup ---
    let gui;
    function setupGUI() {
      gui = new GUI({ title: "Rose Bouquet Controls" });

      // Folder 1: Color Presets & Visual Theme
      const fPresets = gui.addFolder("Presets & Theme");
      fPresets.add(params, "colorScheme", Object.keys(COLOR_SCHEMES))
        .name("Color Scheme")
        .onChange((v) => applyColorScheme(v, 0.8));

      fPresets.add(params, "greenScreen")
        .name("Green Screen (#00ff00)")
        .onChange((v) => setGreenScreen(v));

      fPresets.add(params, "randomizeOnClick")
        .name("Randomize On Click");

      fPresets.add(params, "randomizeNow")
        .name("🎲 Randomize Scene");

      fPresets.add(params, "resetCamera")
        .name("🔄 Reset Camera");

      // Folder 2: Animation & Camera Motion
      const fAnim = gui.addFolder("Motion & Camera");
      fAnim.add(params, "animationMode", Object.keys(ANIMATIONS))
        .name("Animation Preset");

      fAnim.add(params, "animationSpeed", 0.0, 3.0, 0.05)
        .name("Animation Speed");

      // Folder 3: Fine Colors
      const fColors = gui.addFolder("Custom Colors");
      fColors.addColor(params, "petalPrimary").name("Petals Outer").onChange(() => applyCurrentColors(0.3));
      fColors.addColor(params, "petalSecondary").name("Petals Inner").onChange(() => applyCurrentColors(0.3));
      fColors.addColor(params, "leavesColor").name("Leaves").onChange(() => applyCurrentColors(0.3));
      fColors.addColor(params, "bgColor").name("Background").onChange(() => applyCurrentColors(0.3));
      fColors.addColor(params, "spotColor").name("Spotlight").onChange(() => applyCurrentColors(0.3));
      fColors.addColor(params, "bokehColor").name("Candle Bokeh").onChange(() => applyCurrentColors(0.3));
      fColors.addColor(params, "ambientColor").name("Ambient").onChange(() => applyCurrentColors(0.3));
      fColors.close();

      // Folder 4: Lighting & Exposure
      const fLighting = gui.addFolder("Lighting & Exposure");
      fLighting.add(params, "exposure", 0.1, 3.0, 0.05).name("Scene Exposure").onChange((v) => {
        renderer.toneMappingExposure = v;
      });
      fLighting.add(params, "spotIntensity", 0.0, 15.0, 0.1).name("Spotlight Beam").onChange((v) => {
        spotLight.intensity = v;
      });
      fLighting.add(params, "spotAngle", 0.15, 1.2, 0.02).name("Spotlight Angle").onChange((v) => {
        spotLight.angle = v;
      });
      fLighting.add(params, "spotPenumbra", 0.0, 1.0, 0.05).name("Spot Penumbra").onChange((v) => {
        spotLight.penumbra = v;
      });
      fLighting.add(params, "ambientIntensity", 0.0, 3.0, 0.05).name("Ambient Fill").onChange((v) => {
        ambientLight.intensity = v;
      });
      fLighting.add(params, "candleRimIntensity", 0.0, 8.0, 0.1).name("Candle Rim Light").onChange((v) => {
        candleRimLight.intensity = v;
      });

      // Folder 5: PostProcessor Suite Integration
      if (postProcessor) {
        postProcessor.attachGUI(gui, "Post-Processing Suite");
      }

      // Folder 6: Rendering Settings
      const fRender = gui.addFolder("Rendering Settings");
      fRender.add(params, "dpr", 0.5, 3.0, 0.25).name("DPR (Pixel Ratio)").onChange((v) => {
        renderer.setPixelRatio(v);
        if (postProcessor) postProcessor.setSize(window.innerWidth, window.innerHeight);
      });
      fRender.add(params, "antialias").name("Antialias (Reload needed)").onChange((v) => {
        params.antialias = v;
      });
      fRender.close();
    }

    // --- Main Infinite Animation Render Loop ---
    let clock = new THREE.Clock();
    let animTime = 0;

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const speed = params.animationSpeed;
      animTime += delta * speed;

      // 1. Camera Animation layered with Persistent User Zoom & Drag Offsets
      const animFunc = ANIMATIONS[params.animationMode] || ANIMATIONS["Gentle Drift & Breathe"];
      const baseCam = animFunc(animTime);

      const finalRadius = baseCam.radius * userZoom;
      const finalTheta = baseCam.theta + userRotX;
      const finalPhi = THREE.MathUtils.clamp(baseCam.phi + userRotY, 0.08, Math.PI - 0.08);

      const targetX = baseCam.targetX + userPanX;
      const targetY = baseCam.targetY + userPanY;
      const targetZ = baseCam.targetZ;

      const camX = targetX + finalRadius * Math.sin(finalPhi) * Math.sin(finalTheta);
      const camY = targetY + finalRadius * Math.cos(finalPhi);
      const camZ = targetZ + finalRadius * Math.sin(finalPhi) * Math.cos(finalTheta);

      camera.position.set(camX, camY, camZ);
      camera.lookAt(targetX, targetY, targetZ);

      // 2. Bouquet Gentle Living Sway
      if (bouquetGroup) {
        bouquetGroup.rotation.z = 0.22 + Math.sin(animTime * 0.6) * 0.018;
        bouquetGroup.rotation.x = 0.32 + Math.cos(animTime * 0.45) * 0.015;
        bouquetGroup.position.y = -0.85 + Math.sin(animTime * 0.75) * 0.02;
      }

      // 3. Falling Petals Simulation
      if (fallingPetalsData.length > 0) {
        fallingPetalsData.forEach((item) => {
          if (speed > 0) {
            item.y -= item.vy * speed * 60.0 * delta;
            const flutterX = Math.sin(animTime * item.wobbleSpeedX + item.phase) * 0.008;
            const flutterZ = Math.cos(animTime * item.wobbleSpeedZ + item.phase) * 0.006;
            item.x += flutterX;
            item.z += flutterZ;

            item.mesh.position.set(item.x, item.y, item.z);
            item.mesh.rotation.x += item.rotSpeedX * speed;
            item.mesh.rotation.y += item.rotSpeedY * speed;
            item.mesh.rotation.z += Math.sin(animTime * 2.0 + item.phase) * 0.02;

            if (item.y < -3.5) {
              item.y = 2.8 + Math.random() * 1.5;
              item.x = 1.3 + (Math.random() - 0.5) * 2.0;
              item.z = (Math.random() - 0.5) * 1.8;
            }
          }
        });
      }

      // 4. Candlelight Bokeh Floating & Flickering
      if (bokehParticlesData.length > 0) {
        bokehParticlesData.forEach((bp) => {
          if (speed > 0) {
            bp.sprite.position.y = bp.baseY + Math.sin(animTime * bp.driftSpeed + bp.phase) * 0.25;
            const flicker = 0.7 + 0.3 * Math.sin(animTime * bp.flickerSpeed + bp.phase);
            bp.sprite.material.opacity = bp.baseOpacity * flicker;
          }
        });
      }

      // 5. Atmospheric Dust Motes
      if (dustGroup && dustParticlesData.length > 0) {
        const positions = dustGroup.children[0].geometry.attributes.position.array;
        dustParticlesData.forEach((dp, i) => {
          if (speed > 0) {
            positions[i * 3 + 1] = dp.origY + Math.sin(animTime * dp.speed + dp.phase) * 0.15;
            positions[i * 3 + 0] = dp.origX + Math.cos(animTime * dp.speed * 0.7 + dp.phase) * 0.08;
          }
        });
        dustGroup.children[0].geometry.attributes.position.needsUpdate = true;
      }

      // 6. Subtle Spotlight Beam Breathing
      if (spotLight) {
        spotLight.intensity = params.spotIntensity + Math.sin(animTime * 1.8) * 0.15;
      }

      // 7. Render via PostProcessor Pipeline
      if (postProcessor && postProcessor.settings.enabled) {
        postProcessor.renderScene(scene, camera);
      } else {
        renderer.render(scene, camera);
      }
    }

    // --- Bootstrap ---
    initScene();
    setupInteraction();
    setupGUI();
    animate();
  </script>
</body>
</html>
