<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102b33">
  <meta name="description" content="An endless, twenty-second study of holographic liquid chrome. Procedural light, folded metal, and thin-film interference.">
  <link rel="icon" href="data:,">
  <title>Liquid Spectrum</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #102b33; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .error { position: fixed; inset: 0; display: grid; place-content: center; padding: 2rem; color: #ffb5eb; font: 16px/1.7 system-ui, sans-serif; text-align: center; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
        "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
      }
    }
  </script>
</head>
<body>
  <script type="module">
    /*
     * LIQUID SPECTRUM — all visual content is generated in the fragment shader.
     * Serve this directory with `npx vite --host` and open /638.html, or use
     * any static HTTP server. Three.js and its addons are pinned above.
     * No textures, models, images, or build step needed. All controls use lil-gui.
     * Wheel: zoom. Drag: move. Right/shift-drag: angle. H: toggle all controls.
     * Motion is periodic; user framing is independent of animated framing.
     */
    const SETTINGS = Object.freeze({
      flowSpeed: 1,
      warpStrength: 0.60,
      ribbonScale: 4.05,
      iridescenceIntensity: 0.92,
      chromaticAberration: 0.012,
      reflectionSharpness: 1.0,
      bloomIntensity: 0.28,
      exposure: 1.04,
      maxPixelRatio: 1.75,
      loopSeconds: 20
    });

    let renderer, composer, material, geometry, bloom, gui, backdropPass;
    let animationId = 0;
    let disposed = false;
    let contextLost = false;
    const cleanups = [];

    function showError(message) {
      let notice = document.querySelector('.error');
      if (!notice) {
        notice = document.createElement('p');
        notice.className = 'error';
        notice.setAttribute('role', 'alert');
        document.body.appendChild(notice);
      }
      notice.textContent = message;
    }

    try {
      const [THREE, { EffectComposer }, { RenderPass }, { UnrealBloomPass }, { OutputPass }, { ShaderPass }, { default: GUI }] = await Promise.all([
        import('three'),
        import('three/addons/postprocessing/EffectComposer.js'),
        import('three/addons/postprocessing/RenderPass.js'),
        import('three/addons/postprocessing/UnrealBloomPass.js'),
        import('three/addons/postprocessing/OutputPass.js'),
        import('three/addons/postprocessing/ShaderPass.js'),
        import('lil-gui')
      ]);

      const animations = ['Static', 'Liquid drift', 'Slow orbit', 'Diagonal glide', 'Gentle sway', 'Tidal breathing', 'Fold study', 'Light dance'];
      const schemes = [
        'Original', 'Monochromatic', 'Analogous', 'Complementary', 'Split-complementary',
        'Triadic', 'Tetradic', 'Double split-complementary', 'Achromatic',
        'Achromatic + Accent', 'Neutral + Accent', 'Amber / Oxide', 'Tidal / Obsidian',
        'Orchid / Smoke', 'Saffron / Petrol', 'Lime / Jade', 'Tangerine / Plum',
        'Amethyst / Midnight', 'Neon / Afterglow'
      ];
      // Keep the supplied order and duplicates. A five-stop palette is extended
      // with its final stop so each shader palette has exactly six entries.
      const suppliedPalettes = [
        ['F6AA1C', 'BC3908', '941B0C', 'F6AA1C', '220901'],
        ['63D1CF', '5BC0BE', '4BAD9E', '4BAD9E', '0B132B', '000000'],
        ['AA60C8', 'D69ADE', 'C9A3C6', 'CFB5C2', '0D001D', '120A12'],
        ['FEF1BE', 'FFBA00', '008189', '00474D', '061210'],
        ['D4FFB0', '7FFF00', '00B894', '0A3322', '05140A'],
        ['FFE8CC', 'FF8C00', 'C7501A', '3D1050', '0E0618'],
        ['E8E0FF', 'B38FFF', '6A3DE8', '1A1250', '090612'],
        ['E0FBFF', '00F0FF', 'D40078', '1E0A3D', '05020F']
      ];
      const params = {
        scheme: 'Original', invert: false, harmonyColor: '#48f4ff', tint: '#ffffff', accent: '#ff3535',
        color1: '#ffffff', color2: '#48f4ff', color3: '#f15bbf', color4: '#b99bff', color5: '#102b33', color6: '#101419',
        greenscreen: false, background: '#102b33', isolate: false,
        animation: 'Liquid drift', speed: 1, motionAmount: 1,
        zoom: 1, panX: 0, panY: 0, angle: 0, pitch: 0, yaw: 0,
        warp: SETTINGS.warpStrength, ribbons: SETTINGS.ribbonScale, foldDepth: 1,
        iridescence: SETTINGS.iridescenceIntensity, dispersion: SETTINGS.chromaticAberration,
        sharpness: SETTINGS.reflectionSharpness, bloom: SETTINGS.bloomIntensity,
        exposure: SETTINGS.exposure, pixelRatio: Math.min(devicePixelRatio || 1, SETTINGS.maxPixelRatio),
        seed: 0, focusX: 1.95, focusY: 1.65, randomizeOnClick: true
      };

      renderer = new THREE.WebGLRenderer({
        alpha: false,
        antialias: false,
        powerPreference: 'high-performance',
        depth: false,
        stencil: false
      });
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = SETTINGS.exposure;
      renderer.setClearColor(0x102b33, 1);
      const canvas = renderer.domElement;
      canvas.setAttribute('role', 'img');
      canvas.setAttribute('aria-label', 'Slowly flowing holographic chrome with pearlescent folds, cyan and magenta interference, and glowing white reflections.');
      document.body.appendChild(canvas);

      const scene = new THREE.Scene();
      const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
      const uniforms = {
        uTime: { value: 0 },
        uResolution: { value: new THREE.Vector2() },
        uWarp: { value: SETTINGS.warpStrength },
        uScale: { value: SETTINGS.ribbonScale },
        uIridescence: { value: SETTINGS.iridescenceIntensity },
        uDispersion: { value: SETTINGS.chromaticAberration },
        uSharpness: { value: SETTINGS.reflectionSharpness },
        uFoldDepth: { value: 1 },
        uSeed: { value: 0 },
        uFocus: { value: new THREE.Vector2(params.focusX, params.focusY) },
        uMotionAmount: { value: 1 },
        uZoom: { value: 1 },
        uPan: { value: new THREE.Vector2() },
        uAngles: { value: new THREE.Vector3() },
        uObjectAspect: { value: innerWidth / Math.max(1, innerHeight) },
        uIsolated: { value: 0 },
        uPaletteMode: { value: 0 },
        uPalette: { value: Array.from({ length: 6 }, () => new THREE.Color()) },
        uTint: { value: new THREE.Color('#ffffff') },
        uAccent: { value: new THREE.Color(params.accent) },
        uInvert: { value: 0 },
        uBackground: { value: new THREE.Vector3() }
      };

      // Shared by the HDR surface and the final display-space composition. The
      // background is inserted AFTER bloom and tone mapping for exact key green.
      const projectionGLSL = /* glsl */`
        uniform vec2 uResolution, uPan;
        uniform vec3 uAngles;
        uniform float uZoom, uObjectAspect, uIsolated, uSeed;
        mat3 surfaceRotation() {
          vec3 c = cos(uAngles), s = sin(uAngles);
          mat3 rx = mat3(1,0,0, 0,c.x,s.x, 0,-s.x,c.x);
          mat3 ry = mat3(c.y,0,-s.y, 0,1,0, s.y,0,c.y);
          mat3 rz = mat3(c.z,s.z,0, -s.z,c.z,0, 0,0,1);
          return rz * ry * rx;
        }
        vec3 surfacePoint(vec2 uv) {
          vec2 screen = (uv - 0.5) * 2.0 * vec2(uResolution.x / uResolution.y, 1.0);
          screen = (screen - uPan) / uZoom;
          vec3 origin = vec3(0, 0, 4);
          vec3 ray = normalize(vec3(screen, -4));
          mat3 rotation = surfaceRotation();
          float denominator = dot(ray, rotation[2]);
          if (denominator > -0.04) return vec3(0, 0, -1);
          vec3 hit = origin + ray * (-dot(origin, rotation[2]) / denominator);
          return vec3(vec2(dot(hit, rotation[0]), dot(hit, rotation[1])) * 0.95, 1.0);
        }
        float surfaceMask(vec3 point) {
          vec2 q = point.xy / vec2(uObjectAspect, 1.0);
          float edge;
          if (uIsolated > 0.5) {
            float angle = atan(q.y, q.x);
            float radius = 0.82 + 0.045 * sin(angle * 3.0 + uSeed)
                                + 0.025 * cos(angle * 5.0 - uSeed * 0.7);
            edge = length(q) - radius;
          } else {
            vec2 d = abs(q) - vec2(1.07);
            edge = length(max(d, 0.0)) + min(max(d.x, d.y), 0.0) - 0.03;
          }
          float aa = max(fwidth(edge), 0.0002);
          return (1.0 - smoothstep(-aa, aa, edge)) * step(0.0, point.z);
        }
      `;

      material = new THREE.ShaderMaterial({
        uniforms,
        depthTest: false,
        depthWrite: false,
        vertexShader: /* glsl */`
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = vec4(position.xy, 0.0, 1.0);
          }
        `,
        fragmentShader: /* glsl */`
          precision highp float;
          varying vec2 vUv;
          uniform float uTime, uWarp, uScale, uIridescence, uDispersion, uSharpness;
          uniform float uFoldDepth, uMotionAmount, uPaletteMode, uInvert;
          uniform vec2 uFocus;
          uniform vec3 uPalette[6], uTint, uAccent;
          ${projectionGLSL}
          const float TAU = 6.28318530718;

          float hash(vec2 p) {
            vec3 p3 = fract(vec3(p.xyx) * 0.1031);
            p3 += dot(p3, p3.yzx + 33.33);
            return fract((p3.x + p3.y) * p3.z);
          }

          float noise(vec2 p) {
            vec2 i = floor(p), f = fract(p);
            f = f * f * (3.0 - 2.0 * f);
            return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x),
                       mix(hash(i + vec2(0, 1)), hash(i + 1.0), f.x), f.y);
          }

          float fbm(vec2 p) {
            float sum = 0.0, amplitude = 0.5;
            mat2 turn = mat2(0.80, 0.60, -0.60, 0.80);
            for (int i = 0; i < 4; i++) {
              sum += amplitude * noise(p);
              p = turn * p * 2.03 + 7.3;
              amplitude *= 0.40;
            }
            return sum;
          }

          // A circular domain keeps the noise and its velocity continuous at 20s.
          // An offscreen focal point produces sweeping, nested macro folds.
          vec2 flow(vec2 p, vec2 orbit) {
            vec2 q = p + vec2(0.13 * orbit.y, 0.12 * orbit.x);
            vec2 domain = vec2(
              fbm(q * 0.67 + orbit * 0.23 + uSeed * 0.31),
              fbm(q * 0.61 + vec2(8.1, 3.7) - orbit.yx * 0.19 - uSeed * 0.23)
            );
            q += (domain - 0.37) * uWarp;
            q += 0.09 * vec2(sin(q.y * 1.7 + orbit.y * 0.4), sin(q.x * 1.3 + orbit.x * 0.3));
            float bend = 0.17 * sin(q.y * 1.32 + 0.38 * orbit.y);
            bend += 0.09 * sin(q.x * 1.7 + q.y * 0.6 + orbit.x * 0.3);
            bend += 0.08 * sin(q.x * 0.7 + q.y * 2.1 - orbit.y * 0.25);
            float across = length((q - uFocus) * vec2(0.92, 1.06)) + bend;
            float along = q.y - 0.24 * q.x;
            return vec2(across * uScale, along);
          }

          float heightAt(vec2 f, vec2 orbit) {
            float s = f.x;
            float shoulder = sin(s + 0.28 * sin(f.y * 1.1 + orbit.x * 0.3));
            float folds = 0.69 * shoulder + 0.16 * sin(2.0 * s + 0.6);
            folds += 0.053 * sin(3.0 * s + 0.7 * f.y + orbit.y * 0.4);
            folds += 0.016 * sin(6.0 * s - f.y * 0.5 + orbit.x * 0.45);
            return folds * uFoldDepth;
          }

          float gaussian(float x, float width) {
            return exp(-x * x / (width * width));
          }

          // A studio made of luminous softboxes, colored cards, and dark gaps.
          // Reflecting it in a height-derived normal makes light cling to folds.
          vec3 environment(vec3 r, vec2 orbit) {
            float a = atan(r.x, r.z);
            float b = r.y;
            float sweep = a + 0.32 * b + 0.13 * sin(b * 3.0 + orbit.y * 0.4);
            float key = gaussian(sweep - 0.28 - orbit.x * 0.08, 0.16 / uSharpness);
            float fill = gaussian(sweep + 0.84 + orbit.y * 0.09, 0.66);
            float edge = gaussian(sweep - 1.17, 0.12 / uSharpness);
            float ceiling = gaussian(sweep + 0.10, 1.10);
            vec3 light = mix(vec3(0.035, 0.075, 0.080), vec3(0.14, 0.07, 0.18),
                             0.5 + 0.5 * sin(a * 1.7 + b * 2.0));
            light += vec3(0.65, 0.62, 0.85) * ceiling;
            light += vec3(0.85, 1.13, 1.35) * fill;
            light += vec3(4.6, 4.8, 5.0) * key;
            light += vec3(1.6, 2.2, 2.5) * edge;
            light += vec3(0.02, 0.85, 1.10) * gaussian(sweep - 0.56, 0.15);
            light += vec3(1.05, 0.08, 0.47) * gaussian(sweep + 0.26, 0.22);
            return light;
          }

          vec3 film(float opticalPath) {
            // Wavelength-dependent phase offsets; linear-space pastel coating.
            vec3 wavelengths = vec3(0.650, 0.510, 0.475);
            vec3 spectrum = 0.5 + 0.5 * cos(TAU * opticalPath / wavelengths + vec3(0.0, 1.1, 2.0));
            spectrum = pow(spectrum, vec3(1.15));
            // A violet/cyan bias models the pale dielectric overcoat and keeps
            // the green part of the spectrum from overwhelming the silver.
            spectrum.b = 0.42 + 0.58 * spectrum.b;
            return mix(vec3(0.65, 0.70, 0.77), 0.22 + spectrum * 0.95, uIridescence);
          }

          vec3 paletteAt(float t) {
            float x = clamp(t, 0.0, 1.0) * 5.0;
            vec3 result = uPalette[0];
            for (int i = 0; i < 5; i++) {
              result = mix(result, uPalette[i + 1], smoothstep(float(i), float(i + 1), x));
            }
            return result;
          }

          void main() {
            vec2 orbit = vec2(cos(uTime), sin(uTime)) * uMotionAmount;
            vec3 point = surfacePoint(vUv);
            float coverage = surfaceMask(point);
            vec2 p = point.xy;
            vec2 f = flow(p, orbit);

            // Evaluate the expensive domain warp once, then differentiate the
            // cheap local height field using its screen-space flow Jacobian.
            vec2 dx = dFdx(f), dy = dFdy(f);
            float h = heightAt(f, orbit);
            float hx = heightAt(f + dx, orbit) - heightAt(f - dx, orbit);
            float hy = heightAt(f + dy, orbit) - heightAt(f - dy, orbit);
            vec2 slope = vec2(hx, hy) / (4.0 / uResolution.y);
            vec3 normal = normalize(vec3(-slope * 0.50, 1.0));
            vec3 view = normalize(vec3(p * 0.10, 1.8));
            vec3 reflected = reflect(-view, normal);
            float ndv = max(dot(normal, view), 0.0);
            float fresnel = pow(1.0 - ndv, 3.0);
            float curvature = (heightAt(f + dx * 3.0, orbit) + heightAt(f - dx * 3.0, orbit) - 2.0 * h)
                            / max(dot(dx * 3.0, dx * 3.0), 0.000001);

            // Internal optical streaks have varying spacing along each fold.
            float phase = f.x * 7.0 + 1.3 * sin(f.x * 1.8 + f.y * 0.65)
                        + 0.45 * sin(f.y * 2.0 + orbit.y * 0.5) + orbit.x * 0.7;
            float path = 0.72 + ndv * 0.95 + h * 0.11 + curvature * 0.012;
            path += 0.12 * sin(phase * 0.40) + 0.10 * orbit.y;
            vec3 coating = film(path);
            vec3 reflectedLight = environment(reflected, orbit);

            // Slightly separated red and blue reflections simulate dispersion.
            vec3 redRay = normalize(reflected + vec3(uDispersion * (1.0 + fresnel), 0.0, 0.0));
            vec3 blueRay = normalize(reflected - vec3(uDispersion * (1.0 + fresnel), 0.0, 0.0));
            reflectedLight.r = environment(redRay, orbit).r;
            reflectedLight.b = environment(blueRay, orbit).b;

            float thin = pow(0.5 + 0.5 * sin(phase), 18.0);
            float finer = pow(0.5 + 0.5 * sin(phase * 2.13 + f.y * 0.7), 28.0);
            float filtered = 1.0 - smoothstep(0.45, 1.65, fwidth(phase));
            vec3 interference = film(path + 0.19 + 0.03 * sin(phase));
            vec3 color = reflectedLight * mix(coating, vec3(0.95, 0.98, 1.0), 0.12) * 0.19;
            float pearl = pow(0.5 + 0.5 * sin(f.x - 0.40), 0.85);
            color += mix(vec3(0.32, 0.10, 0.27), vec3(0.20, 0.40, 0.58), 0.5 + 0.5 * sin(f.x * 1.8 + f.y)) * pearl * 0.75;

            // Grazing caustics split into spectral shoulders around a white
            // ridge. They follow the same distorted membrane as the normals.
            float ridgePhase = f.x + 0.16 * sin(f.y * 1.6 + orbit.x * 0.4);
            float ridge = pow(0.5 + 0.5 * cos(ridgePhase - 0.55), 78.0);
            float cyan = pow(0.5 + 0.5 * cos(ridgePhase - 1.13), 48.0);
            float pink = pow(0.5 + 0.5 * cos(ridgePhase + 0.08), 38.0);
            float gold = pow(0.5 + 0.5 * cos(ridgePhase - 1.41), 100.0);
            color += vec3(2.7, 2.85, 3.0) * ridge;
            color += vec3(0.015, 1.20, 1.65) * cyan;
            color += vec3(1.25, 0.025, 0.55) * pink;
            color += vec3(1.15, 0.80, 0.015) * gold;
            color += interference * (thin * 0.23 + finer * 0.065) * filtered;
            color *= 0.84 + 0.16 * smoothstep(-0.9, 0.8, h);

            vec3 lightA = normalize(vec3(-0.55 + orbit.y * 0.08, 0.6, 1.0));
            vec3 lightB = normalize(vec3(0.8, -0.3 + orbit.x * 0.12, 0.7));
            float specA = pow(max(dot(normal, normalize(lightA + view)), 0.0), 90.0 * uSharpness);
            float specB = pow(max(dot(normal, normalize(lightB + view)), 0.0), 130.0 * uSharpness);
            color += vec3(0.55, 0.65, 0.70) * specA + vec3(0.3, 0.45, 0.5) * specB;
            float valley = pow(0.5 + 0.5 * cos(ridgePhase - 3.7), 5.0);
            color *= 1.0 - valley * 0.93;
            color += vec3(0.006, 0.017, 0.020) * valley;
            float luminance = dot(color, vec3(0.2126, 0.7152, 0.0722));
            color = max(mix(vec3(luminance), color, 1.18), 0.0);

            if (uPaletteMode > 0.5) {
              float value = clamp(log2(1.0 + max(luminance, 0.0)) / log2(4.5), 0.0, 1.0);
              if (uInvert > 0.5) value = 1.0 - value;
              vec3 mapped = paletteAt(value);
              if (uPaletteMode > 1.5) {
                float accentMask = pow(0.5 + 0.5 * sin(phase * 0.43 + f.y * 0.7), 26.0);
                accentMask *= smoothstep(0.16, 0.68, value) * 0.90;
                mapped = mix(mapped, uAccent * (0.45 + value * 1.4), accentMask);
              }
              color = mapped * (1.0 + max(luminance - 1.0, 0.0) * 0.6);
            }
            color *= uTint;

            // Subpixel brushed foil; screen-space grain stays still, so it
            // cannot flicker or break the periodic animation at the seam.
            float brush = sin(f.x * 540.0 + 1.8 * sin(f.y * 21.0));
            brush *= 1.0 - smoothstep(0.6, 2.0, fwidth(f.x * 540.0));
            float grain = hash(gl_FragCoord.xy) - 0.5;
            color *= 1.0 + brush * 0.012 + grain * 0.042;
            color += grain * 0.005;
            float vignette = 1.0 - 0.065 * dot(vUv - 0.5, vUv - 0.5);
            // Keep HDR values intact: bloom precedes ACES and sRGB OutputPass.
            gl_FragColor = vec4(max(color * vignette, 0.0) * coverage, 1.0);
          }
        `
      });
      geometry = new THREE.PlaneGeometry(2, 2);
      scene.add(new THREE.Mesh(geometry, material));

      composer = new EffectComposer(renderer);
      composer.addPass(new RenderPass(scene, camera));
      bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), SETTINGS.bloomIntensity, 0.58, 0.92);
      composer.addPass(bloom);
      composer.addPass(new OutputPass());

      backdropPass = new ShaderPass({
        uniforms: { tDiffuse: { value: null } },
        vertexShader: /* glsl */`
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = vec4(position.xy, 0.0, 1.0);
          }
        `,
        fragmentShader: /* glsl */`
          precision highp float;
          varying vec2 vUv;
          uniform sampler2D tDiffuse;
          uniform vec3 uBackground;
          ${projectionGLSL}
          void main() {
            float mask = surfaceMask(surfacePoint(vUv));
            vec3 foreground = texture2D(tDiffuse, vUv).rgb;
            gl_FragColor = vec4(mix(uBackground, foreground, mask), 1.0);
          }
        `
      });
      for (const key of ['uResolution', 'uPan', 'uAngles', 'uZoom', 'uObjectAspect', 'uIsolated', 'uSeed', 'uBackground']) {
        backdropPass.uniforms[key] = uniforms[key];
      }
      composer.addPass(backdropPass);

      let phase = 0;
      let lastTime = null;
      let paletteEdited = false;
      const radians = THREE.MathUtils.degToRad;
      const clamp = THREE.MathUtils.clamp;

      function colorHex(h, s, l) {
        return '#' + new THREE.Color().setHSL((h % 1 + 1) % 1, s, l, THREE.SRGBColorSpace).getHexString();
      }

      function updateColorUniforms() {
        const index = schemes.indexOf(params.scheme);
        uniforms.uPaletteMode.value = index === 0 && !paletteEdited ? 0 : (index === 9 || index === 10 ? 2 : 1);
        for (let i = 0; i < 6; i++) uniforms.uPalette.value[i].set(params['color' + (6 - i)]);
        uniforms.uTint.value.set(params.tint);
        uniforms.uAccent.value.set(params.accent);
        uniforms.uInvert.value = params.invert ? 1 : 0;
      }

      function applyScheme() {
        paletteEdited = false;
        const index = schemes.indexOf(params.scheme);
        let colors;
        if (index >= 11) {
          colors = suppliedPalettes[index - 11].map(hex => '#' + hex);
        } else if (index === 0) {
          colors = ['#ffffff', '#48f4ff', '#f15bbf', '#b99bff', '#102b33', '#101419'];
        } else if (index === 8 || index === 9) {
          colors = ['#ffffff', '#d6d6d6', '#989898', '#5a5a5a', '#202020', '#000000'];
        } else if (index === 10) {
          colors = ['#f6f0e4', '#d6cbbb', '#a69f93', '#68665f', '#343532', '#141714'];
        } else {
          const hsl = new THREE.Color(params.harmonyColor).getHSL({}, THREE.SRGBColorSpace);
          const offsets = [[], [0], [-1 / 12, 0, 1 / 12], [0, 0.5], [0, 5 / 12, 7 / 12],
            [0, 1 / 3, 2 / 3], [0, 0.25, 0.5, 0.75], [-1 / 12, 1 / 12, 5 / 12, 7 / 12]][index];
          const lightness = [0.90, 0.67, 0.52, 0.34, 0.14, 0.035];
          colors = lightness.map((light, i) => colorHex(hsl.h + offsets[i % offsets.length], i === 0 ? 0.32 : 0.72, light));
        }
        for (let i = 0; i < 6; i++) params['color' + (i + 1)] = colors[Math.min(i, colors.length - 1)];
        updateColorUniforms();
        gui?.controllersRecursive().forEach(controller => controller.updateDisplay());
      }

      function updateBackground() {
        const hex = params.greenscreen ? '#00ff00' : params.background;
        const value = parseInt(hex.slice(1), 16);
        // These are display-space bytes, intentionally bypassing color management.
        uniforms.uBackground.value.set((value >> 16 & 255) / 255, (value >> 8 & 255) / 255, (value & 255) / 255);
        document.body.style.backgroundColor = hex;
        uniforms.uIsolated.value = params.isolate ? 1 : 0;
      }

      function syncSurface() {
        uniforms.uWarp.value = params.warp;
        uniforms.uScale.value = params.ribbons;
        uniforms.uFoldDepth.value = params.foldDepth;
        uniforms.uSeed.value = params.seed;
        uniforms.uFocus.value.set(params.focusX, params.focusY);
        uniforms.uIridescence.value = params.iridescence;
        uniforms.uDispersion.value = params.dispersion;
        uniforms.uSharpness.value = params.sharpness;
        bloom.strength = params.bloom;
        renderer.toneMappingExposure = params.exposure;
        updateColorUniforms();
        updateBackground();
      }

      function renderScene() {
        const s = Math.sin(phase), c = Math.cos(phase);
        const amount = params.motionAmount;
        let moveX = 0, moveY = 0, pitch = 0, yaw = 0, roll = 0, zoom = 1, deformation = 1;
        switch (params.animation) {
          case 'Static': deformation = 0; break;
          case 'Slow orbit':
            yaw = s * 0.20; pitch = c * 0.12; roll = s * 0.035; deformation = 0.65;
            break;
          case 'Diagonal glide':
            moveX = s * 0.24; moveY = s * -0.15; roll = c * 0.025; deformation = 0.8;
            break;
          case 'Gentle sway':
            roll = s * 0.11; pitch = Math.sin(phase * 2) * 0.045; moveX = c * 0.06;
            break;
          case 'Tidal breathing':
            zoom = Math.exp(s * 0.10 * amount); pitch = c * 0.055; deformation = 1.15;
            break;
          case 'Fold study':
            moveX = s * 0.13; moveY = Math.sin(phase * 2) * 0.07;
            yaw = c * 0.12; zoom = Math.exp(Math.sin(phase * 2) * 0.035 * amount); deformation = 0.7;
            break;
          case 'Light dance':
            roll = s * 0.025; deformation = 1.55;
            break;
        }
        uniforms.uTime.value = phase;
        uniforms.uMotionAmount.value = params.animation === 'Static' ? 1 : amount * deformation;
        // User zoom/pan/angles are persistent base transforms; presets add to them.
        uniforms.uZoom.value = params.zoom * zoom;
        uniforms.uPan.value.set(params.panX + moveX * amount, params.panY + moveY * amount);
        uniforms.uAngles.value.set(
          clamp(radians(params.pitch) + pitch * amount, -1.25, 1.25),
          clamp(radians(params.yaw) + yaw * amount, -1.25, 1.25),
          radians(params.angle) + roll * amount
        );
        composer.render();
      }

      function resize() {
        const width = Math.max(1, window.innerWidth);
        const height = Math.max(1, window.innerHeight);
        const ratio = clamp(params.pixelRatio, 0.5, 3);
        renderer.setPixelRatio(ratio);
        renderer.setSize(width, height);
        composer.setPixelRatio(ratio);
        composer.setSize(width, height);
        renderer.getDrawingBufferSize(uniforms.uResolution.value);
        uniforms.uObjectAspect.value = width / height;
        if (!contextLost) renderScene();
      }
      applyScheme();
      syncSurface();
      resize();
      window.addEventListener('resize', resize, { passive: true });
      cleanups.push(() => window.removeEventListener('resize', resize));

      // Accumulate only visible time so returning to a hidden tab is smooth.
      function isAnimating() { return params.animation !== 'Static' && params.speed > 0; }
      function frame(now) {
        animationId = 0;
        if (disposed || document.hidden || contextLost) return;
        if (lastTime !== null && isAnimating()) {
          phase = (phase + (now - lastTime) * 0.001 * params.speed * Math.PI * 2 / SETTINGS.loopSeconds) % (Math.PI * 2);
        }
        lastTime = now;
        renderScene();
        if (isAnimating()) animationId = requestAnimationFrame(frame);
      }
      function resume() {
        cancelAnimationFrame(animationId);
        lastTime = null;
        if (!disposed && !document.hidden && !contextLost) animationId = requestAnimationFrame(frame);
      }
      function requestRender() {
        if (disposed || contextLost) return;
        renderScene();
        if (!animationId && isAnimating() && !document.hidden) {
          lastTime = null;
          animationId = requestAnimationFrame(frame);
        }
      }

      function refreshPanel() {
        gui.controllersRecursive().forEach(controller => controller.updateDisplay());
      }
      function randomize() {
        const random = (min, max) => min + Math.random() * (max - min);
        const current = schemes.indexOf(params.scheme);
        params.scheme = schemes[(current + 1 + Math.floor(Math.random() * (schemes.length - 1))) % schemes.length];
        params.harmonyColor = colorHex(Math.random(), 0.8, 0.6);
        params.accent = colorHex(Math.random(), 0.92, 0.57);
        params.tint = '#ffffff';
        params.invert = false;
        params.seed = random(0, 100);
        params.warp = random(0.3, 1.05);
        params.ribbons = random(2.8, 5.8);
        params.foldDepth = random(0.7, 1.4);
        params.focusX = random(1.1, 2.7);
        params.focusY = random(0.8, 2.3);
        params.iridescence = random(0.65, 1);
        params.dispersion = random(0.003, 0.025);
        params.sharpness = random(0.7, 1.5);
        params.bloom = random(0.15, 0.4);
        params.animation = animations[1 + Math.floor(Math.random() * (animations.length - 1))];
        params.speed = random(0.35, 0.85);
        params.motionAmount = random(0.5, 1.25);
        applyScheme();
        syncSurface();
        refreshPanel();
        requestRender();
      }

      gui = new GUI({ title: 'Liquid Spectrum' });
      gui.add(params, 'scheme', schemes).name('Color scheme').onChange(() => {
        params.invert = false;
        applyScheme();
        requestRender();
      });
      gui.add(params, 'animation', animations).name('Animation').onChange(resume);
      gui.add(params, 'speed', 0, 2, 0.01).name('Animation speed').onChange(requestRender);
      gui.add(params, 'greenscreen').name('Greenscreen').onChange(() => {
        if (params.greenscreen) params.isolate = true;
        updateBackground(); refreshPanel(); requestRender();
      });
      gui.add(params, 'randomizeOnClick').name('Randomize on click');
      gui.add({ randomize }, 'randomize').name('New variation');

      const colors = gui.addFolder('Colors');
      colors.addColor(params, 'harmonyColor').name('Harmony color').onChange(() => { applyScheme(); requestRender(); });
      colors.addColor(params, 'tint').name('Color tint').onChange(() => { updateColorUniforms(); requestRender(); });
      colors.addColor(params, 'accent').name('Accent color').onChange(() => { updateColorUniforms(); requestRender(); });
      colors.add(params, 'invert').name('Reverse palette').onChange(() => {
        if (params.scheme === 'Original') paletteEdited = true;
        updateColorUniforms(); requestRender();
      });
      const stops = colors.addFolder('Palette colors');
      for (let i = 1; i <= 6; i++) {
        stops.addColor(params, 'color' + i).name('Color ' + i).onChange(() => {
          paletteEdited = true;
          updateColorUniforms();
          requestRender();
        });
      }
      stops.close();
      colors.close();

      const background = gui.addFolder('Background');
      background.addColor(params, 'background').name('Background color').onChange(() => {
        params.isolate = true;
        updateBackground(); refreshPanel(); requestRender();
      });
      background.add(params, 'isolate').name('Isolate membrane').onChange(() => { updateBackground(); requestRender(); });
      background.close();

      const view = gui.addFolder('View');
      for (const [property, label, min, max, step] of [
        ['zoom', 'Zoom', 0.15, 6, 0.01], ['panX', 'Position X', -6, 6, 0.01],
        ['panY', 'Position Y', -6, 6, 0.01], ['angle', 'Angle', -180, 180, 0.1],
        ['pitch', 'Pitch', -60, 60, 0.1], ['yaw', 'Orbit angle', -60, 60, 0.1],
        ['motionAmount', 'Motion amount', 0, 1.5, 0.01]
      ]) view.add(params, property, min, max, step).name(label).onChange(requestRender);
      view.add({ reset() {
        Object.assign(params, { zoom: 1, panX: 0, panY: 0, angle: 0, pitch: 0, yaw: 0 });
        refreshPanel(); requestRender();
      } }, 'reset').name('Reset view');
      view.close();

      const surface = gui.addFolder('Surface');
      for (const [property, label, min, max, step] of [
        ['warp', 'Flow warp', 0, 1.5, 0.01], ['ribbons', 'Ribbon scale', 1.5, 8, 0.01],
        ['foldDepth', 'Fold depth', 0.2, 2, 0.01], ['focusX', 'Fold center X', -3, 4, 0.01],
        ['focusY', 'Fold center Y', -3, 4, 0.01], ['seed', 'Variation seed', 0, 100, 0.01],
        ['iridescence', 'Iridescence', 0, 1, 0.01], ['dispersion', 'Dispersion', 0, 0.05, 0.001],
        ['sharpness', 'Reflection sharpness', 0.4, 2, 0.01], ['bloom', 'Bloom', 0, 1, 0.01]
      ]) surface.add(params, property, min, max, step).name(label).onChange(() => { syncSurface(); requestRender(); });
      surface.close();

      const rendering = gui.addFolder('Rendering');
      rendering.add(params, 'pixelRatio', 0.5, 3, 0.05).name('DPR / Pixel ratio').onFinishChange(resize);
      rendering.add(params, 'exposure', 0.4, 1.8, 0.01).name('Exposure').onChange(() => { syncSurface(); requestRender(); });
      rendering.close();

      let uiVisible = true;
      function onKey(event) {
        const target = event.target;
        if (event.code !== 'KeyH' || event.repeat || event.ctrlKey || event.metaKey || event.altKey ||
            target instanceof Element && (target.matches('input, textarea, select') || target.isContentEditable)) return;
        uiVisible = !uiVisible;
        gui.show(uiVisible);
      }
      window.addEventListener('keydown', onKey);
      cleanups.push(() => window.removeEventListener('keydown', onKey));

      let gesture = null;
      function pointerDown(event) {
        if (gesture || (event.button !== 0 && event.button !== 2)) return;
        gesture = { id: event.pointerId, x: event.clientX, y: event.clientY, moved: false,
          panX: params.panX, panY: params.panY, pitch: params.pitch, yaw: params.yaw,
          rotate: event.button === 2 || event.shiftKey };
        canvas.setPointerCapture(event.pointerId);
      }
      function pointerMove(event) {
        if (!gesture || gesture.id !== event.pointerId) return;
        const dx = event.clientX - gesture.x, dy = event.clientY - gesture.y;
        if (Math.hypot(dx, dy) > 5) gesture.moved = true;
        if (!gesture.moved) return;
        if (gesture.rotate) {
          params.yaw = clamp(gesture.yaw + dx * 0.16, -60, 60);
          params.pitch = clamp(gesture.pitch + dy * 0.16, -60, 60);
        } else {
          params.panX = clamp(gesture.panX + dx * 2 / innerHeight, -6, 6);
          params.panY = clamp(gesture.panY - dy * 2 / innerHeight, -6, 6);
        }
        refreshPanel();
        requestRender();
      }
      function pointerUp(event) {
        if (!gesture || gesture.id !== event.pointerId) return;
        const shouldRandomize = !gesture.moved && !gesture.rotate && params.randomizeOnClick && event.type === 'pointerup';
        gesture = null;
        if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
        if (shouldRandomize) randomize();
      }
      function wheel(event) {
        event.preventDefault();
        const delta = event.deltaY * (event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? innerHeight : 1);
        const previous = params.zoom;
        params.zoom = clamp(previous * Math.exp(-clamp(delta, -300, 300) * 0.0012), 0.15, 6);
        const ratio = params.zoom / previous;
        const x = (event.clientX / innerWidth - 0.5) * 2 * innerWidth / innerHeight;
        const y = (0.5 - event.clientY / innerHeight) * 2;
        params.panX = clamp(x - (x - params.panX) * ratio, -6, 6);
        params.panY = clamp(y - (y - params.panY) * ratio, -6, 6);
        refreshPanel(); requestRender();
      }
      const preventMenu = event => event.preventDefault();
      for (const [name, handler] of [['pointerdown', pointerDown], ['pointermove', pointerMove],
        ['pointerup', pointerUp], ['pointercancel', pointerUp], ['lostpointercapture', pointerUp], ['contextmenu', preventMenu]]) {
        canvas.addEventListener(name, handler);
        cleanups.push(() => canvas.removeEventListener(name, handler));
      }
      canvas.addEventListener('wheel', wheel, { passive: false });
      cleanups.push(() => canvas.removeEventListener('wheel', wheel));

      document.addEventListener('visibilitychange', resume);
      const loseContext = event => {
        event.preventDefault();
        contextLost = true;
        cancelAnimationFrame(animationId);
      };
      const restoreContext = () => {
        contextLost = false;
        resize();
        resume();
      };
      canvas.addEventListener('webglcontextlost', loseContext);
      canvas.addEventListener('webglcontextrestored', restoreContext);
      cleanups.push(
        () => document.removeEventListener('visibilitychange', resume),
        () => canvas.removeEventListener('webglcontextlost', loseContext),
        () => canvas.removeEventListener('webglcontextrestored', restoreContext)
      );
      resume();

      function dispose(event) {
        if (event.persisted) return;
        disposed = true;
        cancelAnimationFrame(animationId);
        cleanups.forEach(cleanup => cleanup());
        composer.passes.forEach(pass => pass.dispose?.());
        composer.dispose();
        geometry.dispose();
        material.dispose();
        gui.destroy();
        renderer.dispose();
        window.removeEventListener('pagehide', dispose);
      }
      window.addEventListener('pagehide', dispose);
    } catch (error) {
      console.error('Liquid Spectrum:', error);
      cancelAnimationFrame(animationId);
      cleanups.forEach(cleanup => cleanup());
      composer?.passes.forEach(pass => pass.dispose?.());
      composer?.dispose();
      geometry?.dispose();
      material?.dispose();
      gui?.destroy();
      renderer?.dispose();
      showError('The chrome effect needs WebGL 2 and an internet connection to load Three.js. Please reload in a current browser.');
    }
  </script>
</body>
</html>
