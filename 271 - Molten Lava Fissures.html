    <!-- Import Maps for Three.js and lil-gui -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
            }
        }
    </script>

    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            user-select: none;
            -webkit-user-select: none;
        }

        body.greenscreen {
            background-color: #00ff00;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            touch-action: none;
        }
    </style>
</head>
<body>
    <script type="module">
        import * as THREE from 'three';
        import GUI from 'lil-gui';

        // =========================================================================
        // POST PROCESSOR SUITE (Three.js Shader Post-Processing Pipeline)
        // =========================================================================
        const postOrthoVertexShader = `
        precision highp float;
        in vec3 position;
        out vec2 vUv;
        void main() {
            vUv = position.xy * 0.5 + 0.5;
            gl_Position = vec4(position, 1.0);
        }
        `;

        const postBrightFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        uniform float bloomThreshold;
        in vec2 vUv;
        out vec4 fragColor;

        void main() {
            vec4 color = texture(inputTexture, vUv);
            float luminance = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
            float knee = 0.1;
            float soft = luminance - bloomThreshold + knee;
            soft = clamp(soft, 0.0, 2.0 * knee);
            soft = (soft * soft) / (4.0 * knee + 0.00001);
            float contribution = max(soft, luminance - bloomThreshold);
            contribution /= max(luminance, 0.00001);
            fragColor = vec4(color.rgb * contribution, color.a);
        }
        `;

        const postBlur13ShaderChunk = `
        vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
            vec2 resolution = vec2(textureSize(image, 0));
            vec4 color = vec4(0.0);
            vec2 off1 = vec2(1.411764705882353) * direction;
            vec2 off2 = vec2(3.2941176470588234) * direction;
            vec2 off3 = vec2(5.176470588235294) * direction;
            color += texture(image, uv) * 0.1964825501511404;
            color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
            color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
            color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
            color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
            color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
            color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
            return color;
        }
        `;

        const postBlurFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        uniform vec2 direction;
        in vec2 vUv;
        out vec4 color;
        ${postBlur13ShaderChunk}
        void main() {
            color = blur13(inputTexture, vUv, direction);
        }
        `;

        const postFinalFragmentShader = `
        precision highp float;
        uniform vec2 resolution;
        uniform sampler2D inputTexture;
        uniform sampler2D blur0Texture;
        uniform sampler2D blur1Texture;
        uniform sampler2D blur2Texture;
        uniform sampler2D blur3Texture;
        uniform sampler2D blur4Texture;
        uniform bool bloomEnabled;
        uniform float bloomStrength;
        uniform float vignetteBoost;
        uniform float vignetteReduction;
        uniform float noiseIntensity;
        uniform float time;
        in vec2 vUv;
        out vec4 fragColor;

        float vignette(vec2 uv, float boost, float reduction) {
            vec2 position = vUv - 0.5;
            return boost - length(position) * reduction;
        }

        float hash1(uint n) {
            n = (n << 13U) ^ n;
            n = n * (n * n * 15731U + 789221U) + 1376312589U;
            return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
        }

        float noise(in vec2 uv, in float timeVal) {
            uvec2 p = uvec2(uv);
            return hash1(p.x + 1920U * p.y + (1920U * 1080U) * uint(timeVal));
        }

        void main() {
            vec4 color = texture(inputTexture, vUv);

            if (bloomEnabled && bloomStrength > 0.001) {
                vec4 b0 = texture(blur0Texture, vUv);
                vec4 b1 = texture(blur1Texture, vUv);
                vec4 b2 = texture(blur2Texture, vUv);
                vec4 b3 = texture(blur3Texture, vUv);
                vec4 b4 = texture(blur4Texture, vUv);

                vec4 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
                color += bloomSum * bloomStrength;
            }

            color.rgb *= vignette(vUv, vignetteBoost, vignetteReduction);
            color.rgb += noiseIntensity * noise(gl_FragCoord.xy, time);
            fragColor = vec4(color.rgb, 1.0);
        }
        `;

        const postChromaticAberrationShaderChunk = `
        vec2 barrelDistortion(vec2 coord, float amt) {
            vec2 cc = coord - 0.5;
            float dist = dot(cc, cc);
            return coord + cc * dist * amt;
        }
        float sat(float t) { return clamp(t, 0.0, 1.0); }
        float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
        float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
        vec4 spectrum_offset(float t) {
            float lo = step(t, 0.5);
            float hi = 1.0 - lo;
            float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
            vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
            return pow(ret, vec4(1.0 / 2.2));
        }
        const float max_distort = 2.2;
        const int num_iter = 8;
        const float reci_num_iter_f = 1.0 / float(num_iter);
        vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
            vec4 sumcol = vec4(0.0);
            vec4 sumw = vec4(0.0);
            for (int i = 0; i < num_iter; ++i) {
                float t = float(i) * reci_num_iter_f;
                vec4 w = spectrum_offset(t);
                sumw += w;
                sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
            }
            return sumcol / sumw;
        }
        `;

        const postColorFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        uniform float chromaticAberrationAmount;
        uniform float minInputLevel;
        uniform float maxInputLevel;
        uniform float gammaLevel;
        uniform float fisheyeStrength;
        uniform float fisheyeRadius;
        uniform float time;
        in vec2 vUv;
        out vec4 fragColor;

        ${postChromaticAberrationShaderChunk}

        vec2 applyFisheye(vec2 uv, float strength, float radius) {
            if (abs(strength) < 0.0001) return uv;
            vec2 p = uv - 0.5;
            float d = length(p);
            if (d > radius * 1.5) return uv;
            float r = d / max(radius, 0.001);
            float theta = atan(p.y, p.x);
            float rDist = r + strength * (r * r * r);
            return 0.5 + vec2(cos(theta), sin(theta)) * (rDist * radius);
        }

        vec3 gammaCorrect(vec3 color, vec3 gamma) {
            return pow(max(color, vec3(0.0)), 1.0 / gamma);
        }
        vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
            return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
        }
        vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
            return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
        }
        void main() {
            vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
            fragColor = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
            fragColor.rgb = finalLevels(fragColor.rgb, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
            fragColor.a = 1.0;
        }
        `;

        const postCopyFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        in vec2 vUv;
        out vec4 fragColor;
        void main() {
            fragColor = texture(inputTexture, vUv);
        }
        `;

        function createPostFBO(w, h, options = {}) {
            return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
                wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
                wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
                minFilter: options.minFilter || THREE.LinearFilter,
                magFilter: options.magFilter || THREE.LinearFilter,
                format: options.format || THREE.RGBAFormat,
                type: options.type || THREE.HalfFloatType,
                stencilBuffer: options.stencilBuffer || false,
                depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : true,
                samples: options.samples || 0,
            });
        }

        class PostShaderPass {
            constructor(shader, options = {}) {
                this.shader = shader;
                this.orthoScene = new THREE.Scene();
                this.fbo = createPostFBO(1, 1, options);
                this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
                this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
                this.orthoScene.add(this.orthoQuad);
                this.texture = this.fbo.texture;
            }
            render(renderer, toScreen = false) {
                if (!toScreen) {
                    renderer.setRenderTarget(this.fbo);
                }
                renderer.render(this.orthoScene, this.orthoCamera);
                if (!toScreen) {
                    renderer.setRenderTarget(null);
                }
            }
            setSize(width, height) {
                this.fbo.setSize(Math.max(1, width), Math.max(1, height));
                this.orthoQuad.scale.set(width, height, 1);
            }
        }

        class PostShaderPingPongPass {
            constructor(shader, options = {}) {
                this.shader = shader;
                this.orthoScene = new THREE.Scene();
                this.fbos = [createPostFBO(1, 1, options), createPostFBO(1, 1, options)];
                this.currentFBO = 0;
                this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
                this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
                this.orthoScene.add(this.orthoQuad);
            }
            render(renderer) {
                renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
                renderer.render(this.orthoScene, this.orthoCamera);
                renderer.setRenderTarget(null);
                this.currentFBO = 1 - this.currentFBO;
            }
            get current() { return this.fbos[this.currentFBO]; }
            get texture() { return this.current.texture; }
            setSize(width, height) {
                const w = Math.max(1, width);
                const h = Math.max(1, height);
                this.orthoQuad.scale.set(w, h, 1);
                this.fbos[0].setSize(w, h);
                this.fbos[1].setSize(w, h);
            }
        }

        class PostBloomPass {
            constructor(strength = 0.8, radius = 0.5, threshold = 0.2, levels = 5) {
                this.strength = strength;
                this.radius = radius;
                this.threshold = threshold;
                this.enabled = true;
                this.levels = levels;

                this.brightShader = new THREE.RawShaderMaterial({
                    uniforms: {
                        inputTexture: { value: null },
                        bloomThreshold: { value: this.threshold },
                    },
                    vertexShader: postOrthoVertexShader,
                    fragmentShader: postBrightFragmentShader,
                    glslVersion: THREE.GLSL3,
                });
                this.brightPass = new PostShaderPass(this.brightShader, {
                    format: THREE.RGBAFormat,
                    type: THREE.HalfFloatType,
                });

                this.blurShader = new THREE.RawShaderMaterial({
                    uniforms: {
                        inputTexture: { value: null },
                        direction: { value: new THREE.Vector2(0, 1) },
                    },
                    vertexShader: postOrthoVertexShader,
                    fragmentShader: postBlurFragmentShader,
                    glslVersion: THREE.GLSL3,
                });

                this.blurPasses = [];
                for (let i = 0; i < this.levels; i++) {
                    this.blurPasses.push(new PostShaderPingPongPass(this.blurShader, {
                        format: THREE.RGBAFormat,
                        type: THREE.HalfFloatType,
                    }));
                }
            }

            setSize(w, h) {
                let tw = Math.max(1, w);
                let th = Math.max(1, h);
                this.brightPass.setSize(tw, th);
                for (let i = 0; i < this.levels; i++) {
                    tw = Math.max(1, Math.round(tw / 2));
                    th = Math.max(1, Math.round(th / 2));
                    this.blurPasses[i].setSize(tw, th);
                }
            }

            set source(texture) {
                this.brightShader.uniforms.inputTexture.value = texture;
            }

            render(renderer) {
                if (!this.enabled || this.strength <= 0.001) return;

                this.brightShader.uniforms.bloomThreshold.value = this.threshold;
                this.brightPass.render(renderer);

                const baseOffset = Math.max(0.1, this.radius * 2.0);
                const u = this.blurShader.uniforms;

                for (let j = 0; j < this.levels; j++) {
                    const blurPass = this.blurPasses[j];
                    const stepOffset = baseOffset * (1.0 + j * 0.5);

                    // Horizontal blur pass
                    u.direction.value.set(stepOffset, 0);
                    u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
                    blurPass.render(renderer);

                    // Vertical blur pass
                    u.direction.value.set(0, stepOffset * 0.5);
                    u.inputTexture.value = blurPass.current.texture;
                    blurPass.render(renderer);
                }
            }
        }

        class PostProcessor {
            constructor(renderer, userParams = {}) {
                this.renderer = renderer;

                this.settings = {
                    enabled: userParams.enabled !== undefined ? userParams.enabled : true,
                    bloomEnabled: userParams.bloomEnabled !== undefined ? userParams.bloomEnabled : true,
                    bloomStrength: userParams.bloomStrength !== undefined ? userParams.bloomStrength : 0.6,
                    bloomRadius: userParams.bloomRadius !== undefined ? userParams.bloomRadius : 0.5,
                    bloomThreshold: userParams.bloomThreshold !== undefined ? userParams.bloomThreshold : 0.22,

                    fisheyeStrength: userParams.fisheyeStrength !== undefined ? userParams.fisheyeStrength : 0.0,
                    fisheyeRadius: userParams.fisheyeRadius !== undefined ? userParams.fisheyeRadius : 1.0,
                    chromaticAberration: userParams.chromaticAberration !== undefined ? userParams.chromaticAberration : 0.015,
                    vignetteBoost: userParams.vignetteBoost !== undefined ? userParams.vignetteBoost : 1.0,
                    vignetteReduction: userParams.vignetteReduction !== undefined ? userParams.vignetteReduction : 0.4,
                    noiseIntensity: userParams.noiseIntensity !== undefined ? userParams.noiseIntensity : 0.0,

                    gamma: userParams.gamma !== undefined ? userParams.gamma : 1.0,
                    minInputLevel: userParams.minInputLevel !== undefined ? userParams.minInputLevel : 0.0,
                    maxInputLevel: userParams.maxInputLevel !== undefined ? userParams.maxInputLevel : 1.0,
                };

                this.sceneTarget = createPostFBO(1, 1, { type: THREE.HalfFloatType });

                this.bloomPass = new PostBloomPass(
                    this.settings.bloomStrength,
                    this.settings.bloomRadius,
                    this.settings.bloomThreshold,
                    5
                );

                this.finalShader = new THREE.RawShaderMaterial({
                    uniforms: {
                        resolution: { value: new THREE.Vector2(1, 1) },
                        bloomEnabled: { value: this.settings.bloomEnabled },
                        bloomStrength: { value: this.settings.bloomStrength },
                        vignetteBoost: { value: this.settings.vignetteBoost },
                        vignetteReduction: { value: this.settings.vignetteReduction },
                        noiseIntensity: { value: this.settings.noiseIntensity },
                        inputTexture: { value: null },
                        blur0Texture: { value: null },
                        blur1Texture: { value: null },
                        blur2Texture: { value: null },
                        blur3Texture: { value: null },
                        blur4Texture: { value: null },
                        time: { value: 0 },
                    },
                    vertexShader: postOrthoVertexShader,
                    fragmentShader: postFinalFragmentShader,
                    glslVersion: THREE.GLSL3,
                });
                this.finalPass = new PostShaderPass(this.finalShader);

                this.rgbShader = new THREE.RawShaderMaterial({
                    uniforms: {
                        inputTexture: { value: this.finalPass.texture },
                        fisheyeStrength: { value: this.settings.fisheyeStrength },
                        fisheyeRadius: { value: this.settings.fisheyeRadius },
                        chromaticAberrationAmount: { value: this.settings.chromaticAberration },
                        minInputLevel: { value: this.settings.minInputLevel },
                        maxInputLevel: { value: this.settings.maxInputLevel },
                        gammaLevel: { value: this.settings.gamma },
                        time: { value: 0 },
                    },
                    vertexShader: postOrthoVertexShader,
                    fragmentShader: postColorFragmentShader,
                    glslVersion: THREE.GLSL3,
                });
                this.rgbPass = new PostShaderPass(this.rgbShader);

                this.copyShader = new THREE.RawShaderMaterial({
                    uniforms: {
                        inputTexture: { value: null },
                    },
                    vertexShader: postOrthoVertexShader,
                    fragmentShader: postCopyFragmentShader,
                    glslVersion: THREE.GLSL3,
                });
                this.copyPass = new PostShaderPass(this.copyShader);
            }

            updateSettings() {
                this.bloomPass.enabled = this.settings.bloomEnabled;
                this.bloomPass.strength = this.settings.bloomStrength;
                this.bloomPass.radius = this.settings.bloomRadius;
                this.bloomPass.threshold = this.settings.bloomThreshold;

                this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
                this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
                this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
                this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
                this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;

                this.rgbShader.uniforms.fisheyeStrength.value = this.settings.fisheyeStrength;
                this.rgbShader.uniforms.fisheyeRadius.value = this.settings.fisheyeRadius;
                this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
                this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
                this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
                this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
            }

            setSize(w0, h0, dpr = 1) {
                const w = Math.max(1, Math.floor(w0 * dpr));
                const h = Math.max(1, Math.floor(h0 * dpr));
                this.sceneTarget.setSize(w, h);
                this.finalPass.setSize(w, h);
                this.finalShader.uniforms.resolution.value.set(w, h);
                this.bloomPass.setSize(w, h);
                this.rgbPass.setSize(w, h);
                this.copyPass.setSize(w, h);
            }

            renderScene(scene, camera) {
                if (!this.settings.enabled) {
                    this.renderer.render(scene, camera);
                    return;
                }
                this.renderer.setRenderTarget(this.sceneTarget);
                this.renderer.render(scene, camera);
                this.renderer.setRenderTarget(null);
                this.render(this.sceneTarget.texture);
            }

            render(sourceTexture) {
                if (!this.settings.enabled) {
                    this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
                    this.copyPass.render(this.renderer, true);
                    return;
                }

                this.updateSettings();

                this.bloomPass.source = sourceTexture;
                this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
                this.bloomPass.render(this.renderer);

                this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
                this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
                this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
                this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
                this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

                const randomTime = Math.random() * 100000;
                this.finalPass.shader.uniforms.time.value = randomTime;
                this.rgbPass.shader.uniforms.time.value = randomTime;

                this.finalPass.render(this.renderer);
                this.rgbPass.render(this.renderer, true);
            }

            attachGUI(gui, title = "Post-Processing Suite") {
                const root = gui.addFolder(title);
                root.add(this.settings, "enabled").name("Enable Suite");

                const bloom = root.addFolder("Bloom");
                bloom.add(this.settings, "bloomEnabled").name("Enable Bloom").onChange(() => this.updateSettings());
                bloom.add(this.settings, "bloomStrength", 0, 3.0, 0.05).name("Strength").onChange(() => this.updateSettings());
                bloom.add(this.settings, "bloomRadius", 0, 2.0, 0.05).name("Radius").onChange(() => this.updateSettings());
                bloom.add(this.settings, "bloomThreshold", 0, 1.0, 0.01).name("Threshold").onChange(() => this.updateSettings());

                const lens = root.addFolder("Lens, Optics & Fisheye");
                lens.add(this.settings, "fisheyeStrength", -1.0, 1.5, 0.01).name("Fisheye Distortion").onChange(() => this.updateSettings());
                lens.add(this.settings, "fisheyeRadius", 0.2, 2.0, 0.05).name("Fisheye Radius").onChange(() => this.updateSettings());
                lens.add(this.settings, "chromaticAberration", 0, 0.2, 0.005).name("Chromatic Aberration").onChange(() => this.updateSettings());
                lens.add(this.settings, "vignetteBoost", 0, 2.0, 0.05).name("Vignette Boost").onChange(() => this.updateSettings());
                lens.add(this.settings, "vignetteReduction", 0, 2.0, 0.05).name("Vignette Falloff").onChange(() => this.updateSettings());
                lens.add(this.settings, "noiseIntensity", 0, 0.1, 0.005).name("Film Grain").onChange(() => this.updateSettings());
                lens.add(this.settings, "gamma", 0.2, 2.0, 0.05).name("Gamma").onChange(() => this.updateSettings());
                lens.add(this.settings, "minInputLevel", 0, 0.5, 0.01).name("Black Level").onChange(() => this.updateSettings());
                lens.add(this.settings, "maxInputLevel", 0.5, 1.0, 0.01).name("White Level").onChange(() => this.updateSettings());

                return root;
            }
        }

        // --- 10 Preconfigured Color Schemes ---
        const colorSchemes = {
            "Monochromatic": {
                color1: "#3b0000",
                color2: "#ff2600",
                color3: "#ffeedd",
                colorPhase: [3.7, 1.2, 0.8],
                glowSpread: 1.2
            },
            "Analogous": {
                color1: "#5c0200",
                color2: "#ff6a00",
                color3: "#ffee55",
                colorPhase: [4.0, 1.8, 0.4],
                glowSpread: 1.4
            },
            "Complementary": {
                color1: "#003844",
                color2: "#ff4d00",
                color3: "#00f7ff",
                colorPhase: [2.1, 5.2, 7.3],
                glowSpread: 1.3
            },
            "Split-complementary": {
                color1: "#2d004d",
                color2: "#ff3700",
                color3: "#00ffaa",
                colorPhase: [5.5, 2.0, 8.1],
                glowSpread: 1.5
            },
            "Triadic": {
                color1: "#091a52",
                color2: "#ff1464",
                color3: "#ffc800",
                colorPhase: [1.2, 4.4, 7.8],
                glowSpread: 1.3
            },
            "Tetradic": {
                color1: "#380040",
                color2: "#ff5100",
                color3: "#00e1ff",
                colorPhase: [6.1, 3.2, 1.5],
                glowSpread: 1.4
            },
            "Double split-complementary": {
                color1: "#00473e",
                color2: "#ff2449",
                color3: "#ffd166",
                colorPhase: [3.3, 7.1, 4.9],
                glowSpread: 1.2
            },
            "Achromatic (black and white)": {
                color1: "#080808",
                color2: "#7a7a7a",
                color3: "#ffffff",
                colorPhase: [0.0, 0.0, 0.0],
                glowSpread: 1.0
            },
            "Achromatic (white and black)": {
                color1: "#e0e0e0",
                color2: "#505050",
                color3: "#050505",
                colorPhase: [3.14, 3.14, 3.14],
                glowSpread: 0.8
            },
            "Neutral + accent": {
                color1: "#151515",
                color2: "#ff0037",
                color3: "#ffffff",
                colorPhase: [4.2, 0.5, 0.5],
                glowSpread: 1.6
            }
        };

        // --- 8 Preconfigured Animations ---
        const animations = {
            "Slow Cruise (Forward Flight)": (t) => ({
                speedMult: 1.0,
                offsetX: 0,
                offsetY: 0,
                rotPitch: 0,
                rotYaw: 0,
                magmaMult: 1.0
            }),
            "Hovering Abyss (Static Camera)": (t) => ({
                speedMult: 0.0,
                offsetX: 0,
                offsetY: 0,
                rotPitch: 0,
                rotYaw: 0,
                magmaMult: 1.0
            }),
            "Orbital Survey (Gentle Sway)": (t) => ({
                speedMult: 0.55,
                offsetX: Math.sin(t * 0.28) * 0.9,
                offsetY: Math.sin(t * 0.18) * 0.12,
                rotPitch: Math.sin(t * 0.22) * 0.07,
                rotYaw: Math.sin(t * 0.28) * 0.22,
                magmaMult: 0.9
            }),
            "Volcanic Pulse (Breathing Altitude)": (t) => ({
                speedMult: 0.75,
                offsetX: 0,
                offsetY: Math.sin(t * 0.45) * 0.3 + 0.05,
                rotPitch: -Math.cos(t * 0.45) * 0.09,
                rotYaw: 0,
                magmaMult: 1.25
            }),
            "Thermal Drift (Lateral Pan)": (t) => ({
                speedMult: 0.35,
                offsetX: Math.sin(t * 0.2) * 1.6,
                offsetY: 0,
                rotPitch: 0,
                rotYaw: Math.cos(t * 0.2) * 0.16,
                magmaMult: 0.85
            }),
            "Magma Surge (Speed Ramp & Flow)": (t) => {
                const wave = Math.sin(t * 0.5) * 0.5 + 0.5;
                return {
                    speedMult: 0.4 + wave * 1.1,
                    offsetX: 0,
                    offsetY: wave * 0.12,
                    rotPitch: wave * 0.04,
                    rotYaw: 0,
                    magmaMult: 0.5 + wave * 1.8
                };
            },
            "Descending Plunge (Slow Sink)": (t) => ({
                speedMult: 0.65,
                offsetX: 0,
                offsetY: Math.cos(t * 0.25) * 0.35 - 0.15,
                rotPitch: 0.12 + Math.sin(t * 0.25) * 0.07,
                rotYaw: 0,
                magmaMult: 1.05
            }),
            "Serpentine Meander (Winding Valley)": (t) => ({
                speedMult: 0.8,
                offsetX: Math.sin(t * 0.35) * 1.3,
                offsetY: Math.sin(t * 0.7) * 0.14,
                rotPitch: Math.sin(t * 0.35) * 0.05,
                rotYaw: Math.cos(t * 0.35) * 0.28,
                magmaMult: 1.1
            })
        };

        // --- Application Parameters ---
        const params = {
            // General / Presets
            colorScheme: "Analogous",
            animation: "Slow Cruise (Forward Flight)",
            clickRandomize: true,

            // Display
            dpr: 1.0,
            greenScreen: false,
            greenThreshold: 0.035,
            ditherStrength: 0.0,

            // Motion & Speed
            animationSpeed: 1.0,
            flightSpeed: 2.2,
            zoom: 1.0,

            // Terrain & Molten Fissures
            terrainHeight: 0.55,
            fogStepSize: 1.85,
            noiseFreq: 1.9,
            noiseAmp: 0.28,
            cracksFreq: 1.25,
            veinWidth: 0.38,
            veinIntensity: 2.2,
            magmaFlowSpeed: 1.1,
            glowSpread: 1.3,

            // Colors
            color1: colorSchemes["Analogous"].color1,
            color2: colorSchemes["Analogous"].color2,
            color3: colorSchemes["Analogous"].color3,
            colorR: colorSchemes["Analogous"].colorPhase[0],
            colorG: colorSchemes["Analogous"].colorPhase[1],
            colorB: colorSchemes["Analogous"].colorPhase[2]
        };

        // --- Helper: Convert Hex Color to THREE.Vector3 ---
        function hexToVec3(hex) {
            const c = new THREE.Color(hex);
            return new THREE.Vector3(c.r, c.g, c.b);
        }

        // --- Three.js Setup ---
        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 10);
        camera.position.z = 1;

        const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(params.dpr);
        renderer.setClearColor(0x000000, 1);
        document.body.appendChild(renderer.domElement);

        // --- Initialize PostProcessor Suite ---
        const postProcessor = new PostProcessor(renderer, {
            enabled: true,
            bloomEnabled: true,
            bloomStrength: 0.6,
            bloomRadius: 0.5,
            bloomThreshold: 0.22,
            chromaticAberration: 0.015,
            vignetteBoost: 1.0,
            vignetteReduction: 0.4,
            noiseIntensity: 0.0,
            gamma: 1.0,
            minInputLevel: 0.0,
            maxInputLevel: 1.0
        });

        // --- Shader Material ---
        const geometry = new THREE.PlaneGeometry(2, 2);

        const vertexShader = `
            void main() {
                gl_Position = vec4(position, 1.0);
            }
        `;

        const fragmentShader = `
            precision highp float;

            uniform float iTime;
            uniform vec2 iResolution;

            // Movement & Camera
            uniform float uSpeed;
            uniform vec3 uCamOffset;
            uniform vec2 uCamRot;
            uniform float uZoom;

            // Terrain & Volumetric Parameters
            uniform float uTerrainHeight;
            uniform float uFogStepSize;
            uniform float uNoiseFreq;
            uniform float uNoiseAmp;
            uniform float uCracksFreq;
            uniform float uVeinWidth;
            uniform float uVeinIntensity;
            uniform float uMagmaFlowSpeed;
            uniform float uGlowSpread;

            // Noise & Dithering Control
            uniform float uDitherStrength;

            // Palette & Tone
            uniform vec3 uColor1;
            uniform vec3 uColor2;
            uniform vec3 uColor3;
            uniform vec3 uColorPhase;

            // Greenscreen
            uniform bool uGreenScreen;
            uniform float uGreenThreshold;

            // Hash without Sine
            float hash12(vec2 p) {
                vec3 p3  = fract(vec3(p.xyx) * 0.1031);
                p3 += dot(p3, p3.yzx + 33.33);
                return fract((p3.x + p3.y) * p3.z);
            }

            vec2 rotate(vec2 v, float t) {
                float s = sin(t), c = cos(t);
                return mat2(c, -s, s, c) * v;
            }

            // Cinematic ACES-like Tone Mapping
            vec3 toneMap(vec3 c) {
                mat3 m1 = mat3(0.59719, 0.17600, 0.02840, 0.35458, 0.90834, 0.13383, 0.04823, 0.01566, 0.83777);
                mat3 m2 = mat3(1.60475, -0.10208, -0.00327, -0.53108, 1.10813, -0.07276, -0.07367, -0.00605, 1.07602);
                vec3 v = m1 * c;
                vec3 a = v * (v + -0.3254214) - 0.000090537;
                vec3 b = v * (0.973729 * v + 0.3429510) + 0.018081;
                return m2 * (a / b);
            }

            // Standard Pseudo-Random Hash for 3D noise
            float hash(float n) {
                return fract(sin(n) * 43758.7253);
            }

            // 3D Value Noise
            float valueNoise(vec3 x) {
                vec3 p = floor(x);
                vec3 f = fract(x);
                f = f * f * (3.0 - 2.0 * f);

                float n = p.x + p.y * 157.0 + 113.0 * p.z;

                float res = mix(mix(mix(hash(n +   0.0), hash(n +   1.0), f.x),
                                    mix(hash(n + 157.0), hash(n + 158.0), f.x), f.y),
                                mix(mix(hash(n + 113.0), hash(n + 114.0), f.x),
                                    mix(hash(n + 270.0), hash(n + 271.0), f.x), f.y), f.z);

                return res * 1.8 - 0.9;
            }

            // FBM for fine terrain height
            float fineNoise(vec3 p) {
                float value = -1.1;
                float amplitude = uNoiseAmp;
                p *= uNoiseFreq;

                for (int i = -1; i < 2; i++) {
                    value += amplitude * valueNoise(p);
                    p *= 1.85;
                    amplitude *= 0.88;
                }
                return value;
            }

            // Fissure / Vein Mask Generation
            float getFissureVein(vec2 p, float t) {
                vec2 flow = vec2(t * 0.14, t * 0.08);
                vec2 q = p + flow;
                float n1 = valueNoise(vec3(q * 1.1, 1.7));
                vec2 r = p + vec2(n1 * 1.35, -n1 * 1.2) + flow * 0.4;
                float n2 = valueNoise(vec3(r * 2.2, 3.4));

                // Fractured fissure ridge lines
                float f = abs(sin(r.x * 1.7 + n2 * 1.4) * cos(r.y * 1.7 + n2 * 1.1));
                float threshold = clamp(1.0 - uVeinWidth * 0.65, 0.15, 0.95);
                return smoothstep(threshold, 0.99, 1.0 - f);
            }

            // Flowing Magma Internal Turbulence
            float getMagmaFlow(vec2 p, float t) {
                vec2 flow = vec2(t * 0.22, t * 0.12);
                float n = valueNoise(vec3(p * 3.5 + flow, t * 0.15)) * 0.6 +
                          valueNoise(vec3(p * 7.0 - flow * 1.4, t * 0.3)) * 0.4;
                return n * 0.5 + 0.5;
            }

            void main() {
                vec2 fragCoord = gl_FragCoord.xy;
                float time = iTime;

                // Setup camera with drag rotation, pan offset, and zoom
                vec2 uv = (2.0 * fragCoord - iResolution.xy) / iResolution.y;
                uv *= uZoom;

                vec3 rayDir = normalize(vec3(uv, 0.32));

                // Camera Pitch & Yaw
                rayDir.yz = rotate(rayDir.yz, 0.76 + uCamRot.y);
                rayDir.xz = rotate(rayDir.xz, uCamRot.x);

                // Camera Position with forward travel & interactive offset
                vec3 rayPos = vec3(-1.0 + uCamOffset.x, 0.8 + uCamOffset.y, time * uSpeed + uCamOffset.z);

                // Controlled ray jittering
                float dither = hash12(fragCoord);
                if (uDitherStrength > 0.001) {
                    rayPos += rayDir * (dither - 0.5) * 0.75 * uDitherStrength;
                }

                vec3 accumulatedLight = vec3(0.0);
                vec3 ambientHeatGlow = vec3(0.0);

                // Flowing magma timing
                float magmaTime = time * uMagmaFlowSpeed;

                for (float i = 8.8; i < 52.0; i += 1.0) {
                    // Base terrain elevation
                    float height = fineNoise(vec3(rayPos.xz * 0.52, 4.3)) * uTerrainHeight;

                    // Signed and absolute distance to terrain surface line
                    float rawDist = rayPos.y - height;
                    float absDist = abs(rawDist);

                    // Soft bounding distance for stable ray marching
                    float marchDist = max(absDist, 0.38);

                    // Inverted Density Logic: Mask emission strictly to thin noisy "vein" layer near height
                    float surfaceVeinLayer = smoothstep(0.42, 0.01, absDist);

                    // Smooth altitude horizon cutoff to prevent noise/speckling in the empty sky above terrain
                    float skyCutoff = smoothstep(1.8, 0.1, rayPos.y - height);

                    // Fissure cracks pattern
                    float fissureVein = getFissureVein(rayPos.xz * uCracksFreq, magmaTime);

                    // Internal flowing magma turbulence
                    float magmaTurb = getMagmaFlow(rayPos.xz * (uCracksFreq * 1.8), magmaTime);

                    // Combined localized fissure emission
                    float fissureMask = surfaceVeinLayer * fissureVein * skyCutoff;
                    float coreHeat = fissureMask * (0.8 + magmaTurb * 0.85) * uVeinIntensity;

                    // Phase-shifted harmonic color variation
                    vec3 harmonic = 0.5 + 0.5 * sin(i * 0.12 + length(rayPos.xz * 0.12) + uColorPhase);

                    // Blackbody-style color ramp from deep crust -> mid lava -> radiant core
                    vec3 veinColor = mix(uColor1, uColor2 * harmonic, smoothstep(0.05, 0.7, coreHeat));
                    veinColor = mix(veinColor, uColor3, smoothstep(0.7, 2.2, coreHeat));
                    veinColor *= (coreHeat * coreHeat * 2.8 + 0.05);

                    // Dark basalt / obsidian crust body
                    vec3 rockCrust = uColor1 * 0.018 * (1.0 - fissureMask) * skyCutoff;

                    // Step forward along ray
                    rayPos += rayDir * marchDist * uFogStepSize;

                    // Accumulate crisp vein emission and subtle crust shading
                    accumulatedLight += (veinColor * fissureMask * 12.0 + rockCrust) / (marchDist + 0.12 * uFogStepSize);

                    // Atmospheric heat bloom around fissure rifts
                    ambientHeatGlow += (uColor1 * 0.6 + uColor2 * 0.4) * (0.012 * uGlowSpread / (absDist + 0.28)) * skyCutoff;
                }

                // Balance accumulated light
                vec3 finalColor = (accumulatedLight * accumulatedLight) / 3200.0 + ambientHeatGlow * 0.035;

                // Optional film grain / dithering (only if enabled via slider)
                if (uDitherStrength > 0.001) {
                    finalColor += (dither - 0.5) * 0.035 * uDitherStrength;
                }

                // Ensure non-negative before tone mapping
                finalColor = max(finalColor, vec3(0.0));

                // Cinematic ACES tone mapping
                vec3 mappedColor = toneMap(finalColor);

                // Greenscreen Mode
                if (uGreenScreen) {
                    float brightness = max(max(mappedColor.r, mappedColor.g), mappedColor.b);
                    mappedColor = mix(vec3(0.0, 1.0, 0.0), mappedColor, smoothstep(uGreenThreshold, uGreenThreshold + 0.09, brightness));
                }

                gl_FragColor = vec4(mappedColor, 1.0);
            }
        `;

        const material = new THREE.ShaderMaterial({
            vertexShader,
            fragmentShader,
            uniforms: {
                iTime: { value: 0 },
                iResolution: { value: new THREE.Vector2(window.innerWidth * params.dpr, window.innerHeight * params.dpr) },
                uSpeed: { value: params.flightSpeed },
                uCamOffset: { value: new THREE.Vector3(0, 0, 0) },
                uCamRot: { value: new THREE.Vector2(0, 0) },
                uZoom: { value: params.zoom },
                uTerrainHeight: { value: params.terrainHeight },
                uFogStepSize: { value: params.fogStepSize },
                uNoiseFreq: { value: params.noiseFreq },
                uNoiseAmp: { value: params.noiseAmp },
                uCracksFreq: { value: params.cracksFreq },
                uVeinWidth: { value: params.veinWidth },
                uVeinIntensity: { value: params.veinIntensity },
                uMagmaFlowSpeed: { value: params.magmaFlowSpeed },
                uGlowSpread: { value: params.glowSpread },
                uDitherStrength: { value: params.ditherStrength },
                uColor1: { value: hexToVec3(params.color1) },
                uColor2: { value: hexToVec3(params.color2) },
                uColor3: { value: hexToVec3(params.color3) },
                uColorPhase: { value: new THREE.Vector3(params.colorR, params.colorG, params.colorB) },
                uGreenScreen: { value: params.greenScreen },
                uGreenThreshold: { value: params.greenThreshold }
            }
        });

        const quad = new THREE.Mesh(geometry, material);
        scene.add(quad);

        // --- Greenscreen Helper ---
        function setGreenScreen(enabled) {
            document.body.classList.toggle('greenscreen', enabled);
            renderer.setClearColor(enabled ? 0x00ff00 : 0x000000, 1);
            material.uniforms.uGreenScreen.value = enabled;
        }

        // --- Color Scheme Application ---
        function applyColorScheme(name) {
            const scheme = colorSchemes[name];
            if (!scheme) return;
            params.color1 = scheme.color1;
            params.color2 = scheme.color2;
            params.color3 = scheme.color3;
            params.colorR = scheme.colorPhase[0];
            params.colorG = scheme.colorPhase[1];
            params.colorB = scheme.colorPhase[2];
            params.glowSpread = scheme.glowSpread;

            material.uniforms.uColor1.value.copy(hexToVec3(params.color1));
            material.uniforms.uColor2.value.copy(hexToVec3(params.color2));
            material.uniforms.uColor3.value.copy(hexToVec3(params.color3));
            material.uniforms.uColorPhase.value.set(params.colorR, params.colorG, params.colorB);
            material.uniforms.uGlowSpread.value = params.glowSpread;

            gui.controllersRecursive().forEach(c => c.updateDisplay());
        }

        // --- Interactive Drag & Zoom Controls ---
        const userCam = {
            rotX: 0,
            rotY: 0,
            panX: 0,
            panY: 0,
            panZ: 0
        };

        let isPointerDown = false;
        let startPointerX = 0;
        let startPointerY = 0;
        let totalDragDist = 0;

        window.addEventListener('pointerdown', (e) => {
            if (e.target.closest('.lil-gui')) return;
            isPointerDown = true;
            startPointerX = e.clientX;
            startPointerY = e.clientY;
            totalDragDist = 0;
        });

        window.addEventListener('pointermove', (e) => {
            if (!isPointerDown) return;
            const dx = e.clientX - startPointerX;
            const dy = e.clientY - startPointerY;
            totalDragDist += Math.hypot(dx, dy);
            startPointerX = e.clientX;
            startPointerY = e.clientY;

            userCam.rotX += dx * 0.004;
            userCam.rotY = Math.max(-1.1, Math.min(1.1, userCam.rotY + dy * 0.004));
            userCam.panX -= dx * 0.0025;
            userCam.panY += dy * 0.0025;
        });

        window.addEventListener('pointerup', (e) => {
            if (!isPointerDown) return;
            isPointerDown = false;

            // If user clicked without dragging & clickRandomize is enabled -> trigger procedural re-roll
            if (totalDragDist < 6 && params.clickRandomize && !e.target.closest('.lil-gui')) {
                randomizeScene();
            }
        });

        window.addEventListener('wheel', (e) => {
            if (e.target.closest('.lil-gui')) return;
            e.preventDefault();
            const delta = e.deltaY * 0.001;
            params.zoom = Math.max(0.25, Math.min(3.5, params.zoom + delta));
            material.uniforms.uZoom.value = params.zoom;
            gui.controllersRecursive().forEach(c => {
                if (c.property === 'zoom') c.updateDisplay();
            });
        }, { passive: false });

        // --- Procedural Scene Randomizer ---
        function randomizeScene() {
            const schemeKeys = Object.keys(colorSchemes);
            const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
            params.colorScheme = randomScheme;
            const scheme = colorSchemes[randomScheme];

            // Re-roll geometric and motion parameters
            params.flightSpeed = +(1.2 + Math.random() * 2.8).toFixed(2);
            params.terrainHeight = +(0.3 + Math.random() * 0.7).toFixed(2);
            params.fogStepSize = +(1.2 + Math.random() * 1.4).toFixed(2);
            params.noiseFreq = +(1.2 + Math.random() * 2.2).toFixed(2);
            params.noiseAmp = +(0.15 + Math.random() * 0.3).toFixed(2);
            params.cracksFreq = +(0.8 + Math.random() * 1.6).toFixed(2);
            params.veinWidth = +(0.2 + Math.random() * 0.45).toFixed(2);
            params.veinIntensity = +(1.4 + Math.random() * 2.2).toFixed(2);
            params.magmaFlowSpeed = +(0.6 + Math.random() * 1.8).toFixed(2);
            params.glowSpread = +(0.8 + Math.random() * 1.4).toFixed(2);

            // Re-roll color nuances
            params.color1 = scheme.color1;
            params.color2 = scheme.color2;
            params.color3 = scheme.color3;
            params.colorR = +(scheme.colorPhase[0] + (Math.random() - 0.5) * 1.5).toFixed(2);
            params.colorG = +(scheme.colorPhase[1] + (Math.random() - 0.5) * 1.5).toFixed(2);
            params.colorB = +(scheme.colorPhase[2] + (Math.random() - 0.5) * 1.5).toFixed(2);

            // Update Shader Uniforms
            material.uniforms.uSpeed.value = params.flightSpeed;
            material.uniforms.uTerrainHeight.value = params.terrainHeight;
            material.uniforms.uFogStepSize.value = params.fogStepSize;
            material.uniforms.uNoiseFreq.value = params.noiseFreq;
            material.uniforms.uNoiseAmp.value = params.noiseAmp;
            material.uniforms.uCracksFreq.value = params.cracksFreq;
            material.uniforms.uVeinWidth.value = params.veinWidth;
            material.uniforms.uVeinIntensity.value = params.veinIntensity;
            material.uniforms.uMagmaFlowSpeed.value = params.magmaFlowSpeed;
            material.uniforms.uGlowSpread.value = params.glowSpread;

            material.uniforms.uColor1.value.copy(hexToVec3(params.color1));
            material.uniforms.uColor2.value.copy(hexToVec3(params.color2));
            material.uniforms.uColor3.value.copy(hexToVec3(params.color3));
            material.uniforms.uColorPhase.value.set(params.colorR, params.colorG, params.colorB);

            // Update lil-gui displays
            gui.controllersRecursive().forEach(c => c.updateDisplay());
        }

        function resetCamera() {
            userCam.rotX = 0;
            userCam.rotY = 0;
            userCam.panX = 0;
            userCam.panY = 0;
            userCam.panZ = 0;
            params.zoom = 1.0;
            material.uniforms.uZoom.value = 1.0;
            gui.controllersRecursive().forEach(c => {
                if (c.property === 'zoom') c.updateDisplay();
            });
        }

        // --- GUI Setup with lil-gui ---
        const gui = new GUI({ title: 'Molten Lava Settings' });
        gui.close();

        // 1. Presets Folder
        const presetsFolder = gui.addFolder('Presets & Randomizer');
        presetsFolder.add(params, 'colorScheme', Object.keys(colorSchemes)).name('Color Scheme').onChange(applyColorScheme);
        presetsFolder.add(params, 'animation', Object.keys(animations)).name('Animation Mode');
        presetsFolder.add(params, 'clickRandomize').name('Randomize on Click');
        presetsFolder.add({ randomize: randomizeScene }, 'randomize').name('⚡ Randomize Now');

        // 2. Display & Greenscreen Folder
        const displayFolder = gui.addFolder('Display & Greenscreen');
        displayFolder.add(params, 'dpr', 0.25, 2.5, 0.05).name('Pixel Ratio (DPR)').onChange(val => {
            renderer.setPixelRatio(val);
            const w = window.innerWidth;
            const h = window.innerHeight;
            material.uniforms.iResolution.value.set(w * val, h * val);
            postProcessor.setSize(w, h, val);
        });
        displayFolder.add(params, 'greenScreen').name('Green Screen #00ff00').onChange(setGreenScreen);
        displayFolder.add(params, 'greenThreshold', 0.0, 0.3, 0.001).name('Green Threshold').onChange(v => {
            material.uniforms.uGreenThreshold.value = v;
        });
        displayFolder.add(params, 'ditherStrength', 0.0, 1.0, 0.01).name('Grain / Dithering').onChange(v => {
            material.uniforms.uDitherStrength.value = v;
        });

        // 3. Motion & Camera Folder
        const motionFolder = gui.addFolder('Motion & Camera');
        motionFolder.add(params, 'animationSpeed', 0.0, 4.0, 0.05).name('Animation Speed');
        motionFolder.add(params, 'flightSpeed', 0.0, 10.0, 0.1).name('Flight Speed').onChange(v => material.uniforms.uSpeed.value = v);
        motionFolder.add(params, 'zoom', 0.25, 3.5, 0.01).name('Zoom (Wheel)').onChange(v => material.uniforms.uZoom.value = v);
        motionFolder.add({ reset: resetCamera }, 'reset').name('Reset Camera');

        // 4. Molten Fissures & Terrain Folder
        const terrainFolder = gui.addFolder('Fissures & Terrain');
        terrainFolder.add(params, 'terrainHeight', 0.0, 2.0, 0.01).name('Terrain Height').onChange(v => material.uniforms.uTerrainHeight.value = v);
        terrainFolder.add(params, 'fogStepSize', 0.2, 4.0, 0.05).name('Ray Step Density').onChange(v => material.uniforms.uFogStepSize.value = v);
        terrainFolder.add(params, 'noiseFreq', 0.2, 5.0, 0.1).name('Terrain Noise Freq').onChange(v => material.uniforms.uNoiseFreq.value = v);
        terrainFolder.add(params, 'noiseAmp', 0.0, 1.0, 0.01).name('Terrain Amplitude').onChange(v => material.uniforms.uNoiseAmp.value = v);
        terrainFolder.add(params, 'cracksFreq', 0.2, 4.0, 0.05).name('Cracks Density').onChange(v => material.uniforms.uCracksFreq.value = v);
        terrainFolder.add(params, 'veinWidth', 0.05, 1.0, 0.01).name('Vein Width').onChange(v => material.uniforms.uVeinWidth.value = v);
        terrainFolder.add(params, 'veinIntensity', 0.2, 5.0, 0.1).name('Vein Glow Intensity').onChange(v => material.uniforms.uVeinIntensity.value = v);
        terrainFolder.add(params, 'magmaFlowSpeed', 0.0, 5.0, 0.1).name('Magma Flow Speed').onChange(v => material.uniforms.uMagmaFlowSpeed.value = v);
        terrainFolder.add(params, 'glowSpread', 0.1, 3.0, 0.05).name('Atmospheric Bloom').onChange(v => material.uniforms.uGlowSpread.value = v);

        // 5. Color Palette Folder
        const colorFolder = gui.addFolder('Color Customization');
        colorFolder.addColor(params, 'color1').name('Deep Crust').onChange(v => material.uniforms.uColor1.value.copy(hexToVec3(v)));
        colorFolder.addColor(params, 'color2').name('Molten Lava').onChange(v => material.uniforms.uColor2.value.copy(hexToVec3(v)));
        colorFolder.addColor(params, 'color3').name('Core Radiant').onChange(v => material.uniforms.uColor3.value.copy(hexToVec3(v)));
        colorFolder.add(params, 'colorR', 0.0, 10.0, 0.1).name('Red Phase').onChange(v => material.uniforms.uColorPhase.value.x = v);
        colorFolder.add(params, 'colorG', 0.0, 10.0, 0.1).name('Green Phase').onChange(v => material.uniforms.uColorPhase.value.y = v);
        colorFolder.add(params, 'colorB', 0.0, 10.0, 0.1).name('Blue Phase').onChange(v => material.uniforms.uColorPhase.value.z = v);

        // 6. Post-Processing Suite Folder
        postProcessor.attachGUI(gui, 'Post-Processing Suite');

        // Initial setup
        postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);

        // --- Toggle UI with "H" key ---
        window.addEventListener('keydown', (e) => {
            if (e.key === 'h' || e.key === 'H') {
                gui._hidden ? gui.show() : gui.hide();
            }
        });

        // --- Resize Handler ---
        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            renderer.setSize(w, h);
            const dpr = renderer.getPixelRatio();
            material.uniforms.iResolution.value.set(w * dpr, h * dpr);
            postProcessor.setSize(w, h, dpr);
        });

        // --- Animation Loop ---
        const clock = new THREE.Clock();
        let accumulatedSimTime = 0;

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            accumulatedSimTime += delta * params.animationSpeed;

            // Apply selected camera animation
            const animFn = animations[params.animation] || animations["Slow Cruise (Forward Flight)"];
            const animState = animFn(accumulatedSimTime);

            // Calculate active speeds and camera offsets
            material.uniforms.iTime.value = accumulatedSimTime;
            material.uniforms.uSpeed.value = params.flightSpeed * animState.speedMult;
            material.uniforms.uMagmaFlowSpeed.value = params.magmaFlowSpeed * animState.magmaMult;

            // Blend interactive drag and animated camera movement
            material.uniforms.uCamOffset.value.set(
                userCam.panX + animState.offsetX,
                userCam.panY + animState.offsetY,
                userCam.panZ
            );
            material.uniforms.uCamRot.value.set(
                userCam.rotX + animState.rotYaw,
                userCam.rotY + animState.rotPitch
            );

            // Render scene through PostProcessor pipeline
            postProcessor.renderScene(scene, camera);
        }

        setGreenScreen(params.greenScreen);
        animate();
    </script>
</body>
</html>
