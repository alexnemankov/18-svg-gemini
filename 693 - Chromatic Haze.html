<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#282305">
  <link rel="icon" href="data:,">
  <meta name="description" content="A slowly breathing analog color field. Procedural light, shadow, and film grain in a seamless twenty-second loop.">
  <title>Chromatic Haze</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #282305; overscroll-behavior: none; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  </style>
</head>
<body>
  <canvas aria-label="Slowly shifting cobalt light, a dark organic shadow, and an orange glow fading into lavender" role="img"></canvas>
  <script type="module">
    // All artwork is procedural; only the rendering and standard GUI runtimes use CDNs.
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
    import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

    // Exactly 19 schemes. The polarity switch supplies both achromatic variants.
    const schemes = {
      Original: ['0655c1', 'aeb4ec', '302502', 'da1401', 'ff5405', 'ffa266', 'f4acb3', 'cdbbe6'],
      Monochromatic: ['174da8', '91b6ee', '071126', '234b88', '568bd1', '9ebbe6', 'bed0ed', 'e2eaf6'],
      Analogous: ['59369c', 'b5a2df', '21152f', '9e267d', 'e65a9e', 'f2a1bb', 'edbfd0', 'e0c9ec'],
      Complementary: ['175bb8', 'aac8f3', '17242d', 'af3b12', 'ff8b2b', 'ffbd86', 'edc4b9', 'e4dcf0'],
      'Split-complementary': ['3153a6', 'b8bce9', '242333', 'b9494c', 'e98253', 'f1bb84', 'd6cfb0', 'c6dccb'],
      Triadic: ['3766a9', 'b4c9e9', '292224', 'a8446d', 'dc6a91', 'e6b279', 'e3cf9d', 'e8e0b8'],
      Tetradic: ['286e90', 'a9d1d8', '27222a', '9d365d', 'e27083', 'eab58b', 'c8d1aa', 'c5b5df'],
      'Double split-complementary': ['395c9c', 'b1c7e1', '28262d', 'aa486d', 'e48766', 'e7c17d', 'b8d4b0', 'd4c0e5'],
      Achromatic: ['656565', 'dedede', '080808', '242424', '818181', 'b0b0b0', 'd1d1d1', 'f5f5f5'],
      'Achromatic + Accent': ['656565', 'dedede', '080808', '9d0915', 'ec2438', 'b0b0b0', 'd1d1d1', 'f5f5f5'],
      'Neutral + accent': ['717f7c', 'd4d4c9', '252925', '9c592c', 'e5a84b', 'd9bd94', 'd8d2c3', 'eeebe2'],
      'Amber / Oxblood': ['F6AA1C', 'BC3908', '941B0C', 'F6AA1C', '220901'],
      'Lagoon / Midnight': ['63D1CF', '5BC0BE', '4BAD9E', '4BAD9E', '0B132B', '000000'],
      'Orchid / Ink': ['AA60C8', 'D69ADE', 'C9A3C6', 'CFB5C2', '0D001D', '120A12'],
      'Champagne / Teal': ['FEF1BE', 'FFBA00', '008189', '00474D', '061210'],
      'Chartreuse / Forest': ['D4FFB0', '7FFF00', '00B894', '0A3322', '05140A'],
      'Apricot / Aubergine': ['FFE8CC', 'FF8C00', 'C7501A', '3D1050', '0E0618'],
      'Lilac / Ultraviolet': ['E8E0FF', 'B38FFF', '6A3DE8', '1A1250', '090612'],
      'Ice / Fuchsia': ['E0FBFF', '00F0FF', 'D40078', '1E0A3D', '05020F']
    };
    const animations = ['Analog breath', 'Chromatic tide', 'Diagonal drift', 'Slow orbit',
      'Elliptic glide', 'Gentle roll', 'Light breathing', 'Diffusion wave', 'Static'];
    const settings = {
      scheme: 'Original', invert: false, tint: '#ffffff', saturation: 1,
      background: '#cdbbe6', greenscreen: false,
      field: '#0655c1', highlight: '#aeb4ec', shadow: '#302502',
      crimson: '#da1401', glow: '#ff5405', peach: '#ffa266', rose: '#f4acb3',
      animation: 'Analog breath', speed: 1, motion: 1,
      zoom: 1, positionX: 0, positionY: 0, angle: 0, orbitAngle: 0,
      seed: 0, curvature: 1, shadowSize: 1, glowWidth: 1, diffusion: 1, grain: 1,
      pixelRatio: Math.min(window.devicePixelRatio || 1, 2), randomizeOnClick: true
    };
    const defaults = { ...settings };

    const canvas = document.querySelector('canvas');
    const renderer = new THREE.WebGLRenderer({
      canvas, antialias: false, alpha: false, depth: false, stencil: false,
      powerPreference: 'high-performance'
    });
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.NoToneMapping;

    const uniforms = {
      uTime: { value: 0 },
      uResolution: { value: new THREE.Vector2() },
      uPan: { value: new THREE.Vector2() },
      uZoom: { value: 1 }, uAngle: { value: 0 },
      uMotion: { value: 1 }, uAnimation: { value: 0 },
      uSeed: { value: 0 }, uCurvature: { value: 1 },
      uShadowSize: { value: 1 }, uGlowWidth: { value: 1 },
      uDiffusion: { value: 1 }, uGrain: { value: 1 },
      uInvert: { value: false }, uGreenscreen: { value: false },
      uAccentScheme: { value: false }, uDye: { value: 1 },
      uSaturation: { value: 1 },
      uTint: { value: new THREE.Color() },
      uPalette: { value: Array.from({ length: 8 }, () => new THREE.Color()) }
    };
    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const geometry = new THREE.BufferGeometry();
    // Oversized triangle: no diagonal seam, and exactly one draw call.
    geometry.setAttribute('position', new THREE.Float32BufferAttribute([
      -1, -1, 0, 3, -1, 0, -1, 3, 0
    ], 3));

    const material = new THREE.ShaderMaterial({
      uniforms,
      depthTest: false,
      depthWrite: false,
      vertexShader: /* glsl */`
        varying vec2 vUv;
        void main() {
          vUv = position.xy * 0.5 + 0.5;
          gl_Position = vec4(position.xy, 0.0, 1.0);
        }
      `,
      fragmentShader: /* glsl */`
        precision highp float;
        varying vec2 vUv;
        uniform vec2 uResolution;
        uniform float uTime;
        uniform vec2 uPan;
        uniform float uZoom, uAngle, uMotion, uSeed;
        uniform float uCurvature, uShadowSize, uGlowWidth, uDiffusion, uGrain;
        uniform float uSaturation;
        uniform int uAnimation;
        uniform bool uInvert, uGreenscreen, uAccentScheme;
        uniform float uDye;
        uniform vec3 uTint;
        uniform vec3 uPalette[8];
        const float TAU = 6.283185307179586;
        const float LOOP = 20.0;

        // Trigonometry-free lattice hashes keep the broad gradient noise cheap.
        vec3 hash33(vec3 p) {
          p = fract(p * vec3(0.1031, 0.1030, 0.0973));
          p += dot(p, p.yxz + 33.33);
          return fract((p.xxy + p.yxx) * p.zyx) * 2.0 - 1.0;
        }

        float noise3(vec3 p) {
          vec3 cell = floor(p);
          vec3 f = fract(p);
          vec3 w = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
          return mix(
            mix(mix(dot(hash33(cell), f),
                    dot(hash33(cell + vec3(1,0,0)), f - vec3(1,0,0)), w.x),
                mix(dot(hash33(cell + vec3(0,1,0)), f - vec3(0,1,0)),
                    dot(hash33(cell + vec3(1,1,0)), f - vec3(1,1,0)), w.x), w.y),
            mix(mix(dot(hash33(cell + vec3(0,0,1)), f - vec3(0,0,1)),
                    dot(hash33(cell + vec3(1,0,1)), f - vec3(1,0,1)), w.x),
                mix(dot(hash33(cell + vec3(0,1,1)), f - vec3(0,1,1)),
                    dot(hash33(cell + vec3(1,1,1)), f - vec3(1,1,1)), w.x), w.y), w.z);
        }

        float fbm(vec3 p) {
          float value = 0.55 * noise3(p);
          p = p * 2.03 + vec3(11.2, 4.1, 7.7);
          value += 0.27 * noise3(p);
          p = p * 2.01 + vec3(3.7, 8.3, 2.8);
          return value + 0.13 * noise3(p);
        }

        float grainHash(vec3 p) {
          p = fract(p * 0.1031);
          p += dot(p, p.yzx + 33.33);
          return fract((p.x + p.y) * p.z);
        }

        // THREE.Color converts the palette from sRGB to linear light on the CPU.
        vec3 displayColor(vec3 c) {
          c = max(c, vec3(0.0));
          return mix(c * 12.92, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055,
                     step(vec3(0.0031308), c));
        }

        void main() {
          float phase = TAU * mod(uTime, LOOP) / LOOP;
          float s = sin(phase) * uMotion;
          float c = cos(phase) * uMotion;
          float aspect = uResolution.x / uResolution.y;
          vec2 screen = (vec2(vUv.x, 1.0 - vUv.y) - 0.5) * vec2(aspect, 1.0);
          vec2 view = (screen - uPan) / uZoom;
          float ca = cos(uAngle), sa = sin(uAngle);
          view = vec2(ca * view.x - sa * view.y, sa * view.x + ca * view.y);
          vec2 uv = view / vec2(aspect, 1.0) + 0.5;
          vec2 p = (uv - 0.5) * vec2(aspect, 1.0);

          // Circular trajectories through 3D noise close exactly every twenty seconds.
          vec3 orbit = vec3(0.23 * c, 0.17 * s, 0.20 * sin(phase + 0.7) * uMotion);
          vec3 seed = vec3(uSeed * 0.173, uSeed * 0.297, uSeed * 0.113);
          float atmosphere = fbm(vec3(p * 1.65, 0.6) + orbit + seed);
          float warp = noise3(vec3(p * 1.12 + 6.2, 2.0) + orbit * 1.3 + seed);
          float x = uv.x + 0.022 * s + 0.035 * warp;
          float breathing = 0.012 * s + 0.007 * sin(2.0 * phase + 0.6) * uMotion;
          if (uAnimation == 1) breathing += 0.022 * sin(phase + uv.x * 2.2) * uMotion;
          if (uAnimation == 7) breathing += 0.012 * sin(phase + uv.x * 3.0) * uMotion;

          // A diffuse upper contour and a more focused, curved lower light leak.
          float upper = 0.405 - 0.275 * x + 0.070 * uCurvature * sin(3.141593 * x);
          upper += breathing + 0.045 * atmosphere;
          float lower = 0.720 + 0.105 * uCurvature * sin(3.141593 * x) - 0.300 * uCurvature * x * x;
          lower += (uShadowSize - 1.0) * 0.15;
          lower += breathing + 0.022 * warp + 0.012 * atmosphere;

          // Approximate signed distance in aspect-correct space: diffusion stays round.
          float slope = uCurvature * (0.330 * cos(3.141593 * x) - 0.600 * x);
          float distanceToLeak = (uv.y - lower) / sqrt(1.0 + slope * slope / (aspect * aspect));
          float spread = (1.0 + 0.075 * sin(phase - 0.5) * uMotion) * uGlowWidth;
          if (uAnimation == 6) spread *= 1.0 + 0.10 * s;
          if (uAnimation == 7) spread *= 1.0 + 0.10 * sin(phase + uv.x * 2.0) * uMotion;
          float d = distanceToLeak / spread;

          vec3 cobalt = uPalette[0];
          vec3 ultramarine = cobalt * 0.65;
          vec3 blue = mix(cobalt, ultramarine,
            smoothstep(0.0, 0.9, uv.x * 0.55 + uv.y + atmosphere * 0.4));
          float skyDistance = (uv.y + 0.06 + 0.045 * atmosphere) / 0.185;
          float sky = exp(-skyDistance * skyDistance);
          blue = mix(blue, uPalette[1], clamp(sky * (0.86 - uv.x * 0.26), 0.0, 1.0));
          blue *= 1.0 + atmosphere * 0.21 + 0.025 * c;

          vec3 shadow = mix(uPalette[2], uPalette[2] * 0.95,
                            smoothstep(0.0, 0.8, uv.x + 0.3 * atmosphere));
          shadow *= 0.95 + 0.16 * atmosphere;
          vec3 color = mix(blue, shadow, smoothstep(upper - 0.115 * uDiffusion, upper + 0.155 * uDiffusion, uv.y));

          vec3 lavender = uPalette[7] * (1.0 + 0.018 * atmosphere + 0.008 * s);
          vec3 rose = uPalette[6];
          vec3 peach = uPalette[5];
          vec3 orange = uPalette[4];
          vec3 vermilion = uPalette[3];

          vec3 warmth = mix(vermilion, orange, smoothstep(-0.006, 0.032, d));
          warmth = mix(warmth, peach, smoothstep(0.025, 0.092, d));
          warmth = mix(warmth, rose, smoothstep(0.070, 0.163, d));
          warmth = mix(warmth, lavender, smoothstep(0.125, 0.260, d));
          float pulse = 1.0 + (uAnimation == 6 ? 0.10 : 0.035) * sin(phase + 0.8) * uMotion;
          warmth *= 1.0 + (pulse - 1.0) * exp(-(d * d) / 0.01);
          // A crimson penumbra bleeds into the dark silhouette before the orange rim.
          float rimDistance = (d + 0.012) / (0.036 * uDiffusion);
          float rim = exp(-rimDistance * rimDistance);
          color = mix(color, uPalette[3] * 0.23, rim * 0.42);
          color = mix(color, warmth, smoothstep(-0.023, 0.034, d));

          // Very broad exposure variation; no visible vignette ring.
          float vignette = smoothstep(0.25, 1.0, length((uv - 0.5) * vec2(0.85, 0.7)));
          color *= 1.0 - 0.055 * vignette;
          color *= uTint;
          color = displayColor(color);
          float luminance = dot(color, vec3(0.2126, 0.7152, 0.0722));
          color = mix(vec3(luminance), color, uSaturation);
          if (uInvert) {
            float accent = uAccentScheme ? clamp((color.r - max(color.g, color.b)) * 6.0, 0.0, 1.0) : 0.0;
            color = mix(1.0 - color, color, accent);
          }

          // 480 smoothly blended film exposures. Seed 480 wraps to seed 0,
          // so grain and its temporal derivative are continuous across the loop.
          float exposure = mod(uTime, LOOP) * 24.0;
          float frame = floor(exposure);
          float blend = smoothstep(0.0, 1.0, fract(exposure));
          vec2 pixel = floor(gl_FragCoord.xy);
          float g0 = grainHash(vec3(pixel, frame));
          float g1 = grainHash(vec3(pixel, mod(frame + 1.0, 480.0)));
          float grain = mix(g0, g1, blend) - 0.5;
          // Equalize grain variance while the two independent exposures dissolve.
          grain /= sqrt(blend * blend + (1.0 - blend) * (1.0 - blend));
          float fine = grainHash(vec3(pixel + 19.4, 37.0)) - 0.5;
          vec3 dye = vec3(fine, -fine * 0.45, fine * 0.7);
          color += (grain * 0.057 + dye * 0.009 * uDye) * uGrain;
          // The pastel field is the background layer. Keep key green exact and grain-free.
          vec3 background = displayColor(uPalette[7]);
          if (uInvert) background = 1.0 - background;
          if (uGreenscreen) {
            background = vec3(0.0, 1.0, 0.0);
            color = mix(color, background, smoothstep(0.125, 0.260, d));
          }
          vec2 outside = max(abs(uv - 0.5) - 0.5, 0.0);
          float coverage = 1.0 - smoothstep(0.0, 0.012, max(outside.x, outside.y));
          color = mix(background, color, coverage);
          // Output is already sRGB encoded; do not apply a second colorspace conversion.
          gl_FragColor = vec4(clamp(color, 0.0, 1.0), 1.0);
        }
      `
    });
    const mesh = new THREE.Mesh(geometry, material);
    mesh.frustumCulled = false;
    scene.add(mesh);

    function resize() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      // The selected DPR is honored, subject only to the GPU's canvas dimension limit.
      const limit = renderer.getContext().getParameter(renderer.getContext().MAX_RENDERBUFFER_SIZE);
      renderer.setPixelRatio(Math.min(settings.pixelRatio, limit / width, limit / height));
      renderer.setSize(width, height, false);
      renderer.getDrawingBufferSize(uniforms.uResolution.value);
    }
    window.addEventListener('resize', resize, { passive: true });
    resize();

    const colorKeys = ['field', 'highlight', 'shadow', 'crimson', 'glow', 'peach', 'rose', 'background'];
    function syncAppearance() {
      colorKeys.forEach((key, i) => uniforms.uPalette.value[i].set(settings[key]));
      uniforms.uTint.value.set(settings.tint);
      uniforms.uInvert.value = settings.invert;
      uniforms.uGreenscreen.value = settings.greenscreen;
      uniforms.uAccentScheme.value = settings.scheme === 'Achromatic + Accent';
      uniforms.uDye.value = settings.scheme.startsWith('Achromatic') ? 0 : 1;
      uniforms.uSaturation.value = settings.saturation;
      uniforms.uSeed.value = settings.seed;
      uniforms.uCurvature.value = settings.curvature;
      uniforms.uShadowSize.value = settings.shadowSize;
      uniforms.uGlowWidth.value = settings.glowWidth;
      uniforms.uDiffusion.value = settings.diffusion;
      uniforms.uGrain.value = settings.grain;
    }

    function applyScheme() {
      const source = schemes[settings.scheme];
      const palette = source.length === 8 ? source : source.length === 5
        ? [source[1], source[0], source[4], source[2], source[0], source[3], source[1], source[4]]
        : [source[0], source[1], source[5], source[4], source[2], source[3], source[1], source[4]];
      colorKeys.forEach((key, i) => { settings[key] = '#' + palette[i]; });
      settings.tint = '#ffffff';
      settings.saturation = 1;
      syncAppearance();
      refreshPanel();
    }

    const gui = new GUI({ title: 'Chromatic Haze' });
    const refreshPanel = () => gui.controllersRecursive().forEach(controller => controller.updateDisplay());
    gui.add(settings, 'scheme', Object.keys(schemes)).name('Color scheme').onChange(applyScheme);
    gui.add(settings, 'animation', animations).name('Animation');
    gui.add(settings, 'speed', 0, 3, 0.01).name('Animation speed');
    gui.add(settings, 'randomizeOnClick').name('Randomize on click');
    const actions = {
      randomize() {
        const range = (min, max) => min + Math.random() * (max - min);
        const choices = Object.keys(schemes).filter(name => name !== settings.scheme);
        settings.scheme = choices[Math.floor(Math.random() * choices.length)];
        applyScheme();
        // View framing and key/background mode stay in the user's control.
        settings.seed = Math.floor(range(1, 1000));
        settings.curvature = range(0.55, 1.65);
        settings.shadowSize = range(0.65, 1.40);
        settings.glowWidth = range(0.65, 1.65);
        settings.diffusion = range(0.70, 1.55);
        settings.grain = range(0.55, 1.25);
        settings.animation = animations[Math.floor(Math.random() * 8)];
        settings.speed = range(0.25, 0.90);
        settings.motion = range(0.40, 1.20);
        syncAppearance();
        refreshPanel();
      },
      resetView() {
        Object.assign(settings, { zoom: 1, positionX: 0, positionY: 0, angle: 0, orbitAngle: 0 });
        refreshPanel();
      },
      resetAll() {
        Object.assign(settings, defaults);
        elapsed = 0;
        previous = null;
        syncAppearance();
        resize();
        refreshPanel();
      }
    };
    gui.add(actions, 'randomize').name('New variation');
    const colors = gui.addFolder('Colors');
    colors.add(settings, 'invert').name('Invert polarity').onChange(syncAppearance);
    colors.addColor(settings, 'tint').name('Color tint').onChange(syncAppearance);
    colors.add(settings, 'saturation', 0, 1.5, 0.01).name('Saturation').onChange(syncAppearance);
    colorKeys.slice(0, -1).forEach(key => colors.addColor(settings, key)
      .name(({ field: 'Upper field', highlight: 'Highlight', shadow: 'Shadow', crimson: 'Inner rim',
        glow: 'Glow', peach: 'Peach haze', rose: 'Rose haze' })[key]).onChange(syncAppearance));
    colors.close();
    const background = gui.addFolder('Background');
    background.addColor(settings, 'background').name('Background color').onChange(syncAppearance);
    background.add(settings, 'greenscreen').name('Greenscreen #00ff00').onChange(syncAppearance);
    const viewFolder = gui.addFolder('View');
    viewFolder.add(settings, 'zoom', 0.25, 5, 0.01).name('Zoom');
    viewFolder.add(settings, 'positionX', -3, 3, 0.001).name('Position X');
    viewFolder.add(settings, 'positionY', -3, 3, 0.001).name('Position Y');
    viewFolder.add(settings, 'angle', -180, 180, 0.1).name('Camera angle');
    viewFolder.add(settings, 'orbitAngle', -180, 180, 0.1).name('Orbit angle');
    viewFolder.add(actions, 'resetView').name('Reset view');
    viewFolder.close();
    const atmosphereFolder = gui.addFolder('Atmosphere');
    atmosphereFolder.add(settings, 'motion', 0, 2, 0.01).name('Motion amount');
    atmosphereFolder.add(settings, 'seed', 0, 1000, 1).name('Noise seed').onChange(syncAppearance);
    atmosphereFolder.add(settings, 'curvature', 0.3, 2, 0.01).name('Curvature').onChange(syncAppearance);
    atmosphereFolder.add(settings, 'shadowSize', 0.4, 1.8, 0.01).name('Shadow size').onChange(syncAppearance);
    atmosphereFolder.add(settings, 'glowWidth', 0.3, 2, 0.01).name('Glow width').onChange(syncAppearance);
    atmosphereFolder.add(settings, 'diffusion', 0.4, 2, 0.01).name('Diffusion').onChange(syncAppearance);
    atmosphereFolder.add(settings, 'grain', 0, 2, 0.01).name('Film grain').onChange(syncAppearance);
    atmosphereFolder.close();
    const rendering = gui.addFolder('Rendering');
    rendering.add(settings, 'pixelRatio', 0.5, 3, 0.1).name('DPR (Pixel Ratio)').onChange(resize);
    rendering.add(actions, 'resetAll').name('Reset all');
    rendering.close();
    syncAppearance();

    window.addEventListener('keydown', event => {
      if (event.code !== 'KeyH' || event.repeat || event.ctrlKey || event.metaKey || event.altKey) return;
      event.preventDefault();
      if (!gui._hidden && gui.domElement.contains(document.activeElement)) document.activeElement.blur();
      gui.show(gui._hidden);
    }, { capture: true });

    // User view values are persistent; animation adds offsets without writing them back.
    const currentView = { driftX: 0, driftY: 0, zoom: 1, rotation: 0 };
    function syncView(time) {
      const mode = animations.indexOf(settings.animation);
      const phase = time / 20 * Math.PI * 2;
      const orbit = phase + THREE.MathUtils.degToRad(settings.orbitAngle);
      const amount = settings.motion;
      let driftX = 0, driftY = 0, zoom = 1, rotation = 0;
      if (mode === 2) { driftX = 0.045 * Math.sin(phase) * amount; driftY = -driftX * 0.6; }
      if (mode === 3) {
        driftX = 0.055 * Math.cos(orbit) * amount;
        driftY = 0.035 * Math.sin(orbit) * amount;
        rotation = 0.055 * Math.sin(orbit) * amount;
      }
      if (mode === 4) {
        driftX = 0.070 * Math.cos(orbit) * amount;
        driftY = 0.025 * Math.sin(orbit) * amount;
        zoom = Math.exp(0.035 * Math.sin(phase) * amount);
      }
      if (mode === 5) rotation = 0.065 * Math.sin(phase) * amount;
      if (mode === 6) zoom = Math.exp(0.020 * Math.sin(phase) * amount);
      Object.assign(currentView, { driftX, driftY, zoom, rotation });
      uniforms.uPan.value.set(settings.positionX + driftX, settings.positionY + driftY);
      uniforms.uZoom.value = settings.zoom * zoom;
      uniforms.uAngle.value = THREE.MathUtils.degToRad(settings.angle) + rotation;
      uniforms.uMotion.value = mode === 8 ? 0 : amount;
      uniforms.uAnimation.value = mode;
      uniforms.uTime.value = mode === 8 ? 0 : time;
    }

    canvas.addEventListener('wheel', event => {
      event.preventDefault();
      const unit = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? innerHeight : 1;
      const next = THREE.MathUtils.clamp(settings.zoom * Math.exp(-event.deltaY * unit * 0.001), 0.25, 5);
      const ratio = settings.zoom / next;
      const anchorX = (event.clientX - innerWidth * 0.5) / innerHeight;
      const anchorY = (event.clientY - innerHeight * 0.5) / innerHeight;
      settings.positionX = anchorX - currentView.driftX - (anchorX - settings.positionX - currentView.driftX) * ratio;
      settings.positionY = anchorY - currentView.driftY - (anchorY - settings.positionY - currentView.driftY) * ratio;
      settings.zoom = next;
      refreshPanel();
    }, { passive: false });

    let drag = null;
    canvas.addEventListener('pointerdown', event => {
      if (!event.isPrimary || event.button !== 0 || drag) return;
      drag = { id: event.pointerId, x: event.clientX, y: event.clientY,
        panX: settings.positionX, panY: settings.positionY, moved: false };
      canvas.setPointerCapture(event.pointerId);
    });
    canvas.addEventListener('pointermove', event => {
      if (!drag || event.pointerId !== drag.id) return;
      const dx = event.clientX - drag.x, dy = event.clientY - drag.y;
      if (Math.hypot(dx, dy) > 5) drag.moved = true;
      if (!drag.moved) return;
      settings.positionX = drag.panX + dx / innerHeight;
      settings.positionY = drag.panY + dy / innerHeight;
      refreshPanel();
    });
    canvas.addEventListener('pointerup', event => {
      if (!drag || event.pointerId !== drag.id) return;
      const click = !drag.moved && Math.hypot(event.clientX - drag.x, event.clientY - drag.y) <= 5;
      drag = null;
      canvas.releasePointerCapture(event.pointerId);
      if (click && settings.randomizeOnClick) actions.randomize();
    });
    canvas.addEventListener('pointercancel', () => { drag = null; });
    canvas.addEventListener('lostpointercapture', () => { drag = null; });

    // Freeze the clock in background tabs, then continue without a visible jump.
    let elapsed = 0;
    let previous = null;
    let contextLost = false;
    document.addEventListener('visibilitychange', () => { previous = null; });
    canvas.addEventListener('webglcontextlost', event => {
      event.preventDefault();
      contextLost = true;
      previous = null;
    });
    canvas.addEventListener('webglcontextrestored', () => {
      contextLost = false;
      previous = null;
      resize();
    });
    renderer.setAnimationLoop(now => {
      if (document.hidden || contextLost) return;
      if (previous !== null && settings.animation !== 'Static') elapsed += (now - previous) / 1000 * settings.speed;
      previous = now;
      elapsed %= 20;
      syncView(elapsed);
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
