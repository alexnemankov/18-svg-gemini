function hexToRgb(hex) {
  hex = hex.replace("#", "").trim();
  const num = parseInt(hex, 16);
  return [
    ((num >> 16) & 255) / 255,
    ((num >> 8) & 255) / 255,
    (num & 255) / 255
  ];
}

const material = new THREE.ShaderMaterial({
  uniforms,
  depthTest: false,
  depthWrite: false,
  toneMapped: false,
  transparent: true,
  vertexShader: `
    void main() { gl_Position = vec4(position.xy, 0.0, 1.0); }
  `,
  fragmentShader: `
uniform vec2 iResolution;
uniform float iTime;
uniform mat3 uRotation;
uniform vec2 uOffset;

// -------------------- Scene parameters --------------------

uniform float SPHERE_RADIUS;
uniform float CAMERA_DISTANCE;
uniform float CAMERA_FOCAL;

uniform float FRACTAL_SCALE;
uniform float TWIST_AMOUNT;
uniform float BRIGHTNESS;

uniform float ROTATION_SPEED;
uniform float MORPH_SPEED;
uniform float MORPH_AMOUNT;

// -------------------- Lighting & Exposure --------------------

uniform float EXPOSURE;
uniform float AMBIENT_INTENSITY;
uniform vec3 AMBIENT_COLOR;
uniform float KEY_LIGHT_INTENSITY;
uniform vec3 KEY_LIGHT_COLOR;
uniform float FILL_LIGHT_INTENSITY;
uniform vec3 FILL_LIGHT_COLOR;
uniform float RIM_LIGHT_INTENSITY;
uniform vec3 RIM_LIGHT_COLOR;

// -------------------- Colors --------------------

uniform vec3 COLOR_A;
uniform vec3 COLOR_B;
uniform vec3 COLOR_C;

uniform vec3 SPHERE_COLOR;
uniform float FRACTAL_OPACITY;
uniform float LAYER_THICKNESS;
uniform vec3 BACKGROUND_COLOR;

// -------------------- Render constants --------------------

const int MARCH_STEPS = 128;

// -------------------- Coordinate transforms --------------------

mat2 rotationMatrix(float angle)
{
    vec2 axis = vec2(cos(angle), sin(angle));
    return mat2(axis.x, -axis.y, axis.y, axis.x);
}

vec3 structureCoordinates(vec3 point, mat2 rotation, float scale)
{
    point.xz = rotation * point.xz;
    point.z += SPHERE_RADIUS;

    return point * scale;
}

// -------------------- Fractal field --------------------

float evaluateStructure(vec3 point, vec3 phase)
{
    point.xy *= mat2(cos(
        point.z * TWIST_AMOUNT - vec4(0.0, 11.0, 33.0, 0.0)
    ));

    float field = 1.0 - abs(point.y);
    float frequency = 1.0;

    for (int octave = 0; octave < 7; octave++)
    {
        vec3 detail = point * frequency;
        detail.z += field * 12.2;

        vec3 wave = sin(detail + phase);

        field -= abs(wave.x + wave.y + wave.z)
               / (frequency * 6.8);

        frequency *= 2.0;
    }

    return field;
}

vec3 evaluateEmission(float field, float depth)
{
    vec3 color = 0.5 + 0.5 * cos(
        field * 40.3 + depth * 3.3 + vec3(1.0, 4.4, 4.0)
    );

    return color / (0.006 + abs(field) * 0.08);
}

// -------------------- Ray integration --------------------

vec3 compressLight(vec3 light);
vec3 applyPalette(vec3 color);

vec4 traceStructure(
    vec3 origin,
    vec3 direction,
    vec2 interval,
    mat2 rotation,
    vec3 phase
)
{
    if (FRACTAL_OPACITY <= 0.0) return vec4(0.0);

    float scale = max(FRACTAL_SCALE, 0.0701);
    float stepLength = (interval.y - interval.x) / float(MARCH_STEPS);
    float worldStep = stepLength * length(direction);
    float referenceLength = max(SPHERE_RADIUS, 0.001);
    float extinction = -log(max(1.0 - FRACTAL_OPACITY, 0.001))
                     * 6.0 / referenceLength;
    float thickness = max(LAYER_THICKNESS, 0.001);
    vec3 accumulatedColor = vec3(0.0);
    float transmittance = 1.0;

    vec3 L_key = normalize(vec3(0.577, 0.707, -0.408));
    vec3 L_fill = normalize(vec3(-0.707, -0.354, -0.612));

    // Integrate the complete chord, including layers behind the first surface.
    for (int stepIndex = 0; stepIndex < MARCH_STEPS; stepIndex++)
    {
        float travel = interval.x + (float(stepIndex) + 0.5) * stepLength;
        vec3 worldPos = origin + direction * travel;
        vec3 point = structureCoordinates(worldPos, rotation, scale);
        float field = evaluateStructure(point, phase);
        float distanceToLayer = field / thickness;
        float density = exp(-distanceToLayer * distanceToLayer);
        float sampleAlpha = 1.0 - exp(-density * extinction * worldStep);

        vec3 N = normalize(worldPos);
        vec3 V = -normalize(direction);
        vec3 H_key = normalize(L_key + V);

        float diffKey = max(dot(N, L_key), 0.0);
        float specKey = pow(max(dot(N, H_key), 0.0), 24.0);
        float diffFill = max(dot(N, L_fill), 0.0);
        float rim = pow(clamp(1.0 - max(dot(N, V), 0.0), 0.0, 1.0), 2.5);

        vec3 lighting = AMBIENT_COLOR * AMBIENT_INTENSITY
                      + KEY_LIGHT_COLOR * (KEY_LIGHT_INTENSITY * (diffKey * 0.75 + specKey * 0.45 + 0.15))
                      + FILL_LIGHT_COLOR * (FILL_LIGHT_INTENSITY * (diffFill * 0.5 + 0.1))
                      + RIM_LIGHT_COLOR * (RIM_LIGHT_INTENSITY * rim);

        vec3 baseEmission = evaluateEmission(field, point.z) * BRIGHTNESS / 120.0;
        vec3 layerColor = applyPalette(compressLight(baseEmission)) * lighting;

        float weight = transmittance * sampleAlpha;
        accumulatedColor += layerColor * weight;
        transmittance *= 1.0 - sampleAlpha;
    }

    float opacity = 1.0 - transmittance;
    vec3 color = (accumulatedColor / max(opacity, 0.000001)) * EXPOSURE;
    return vec4(color, opacity);
}

// -------------------- Color processing --------------------

vec3 compressLight(vec3 light)
{
    vec3 attenuation = exp(-2.0 * max(light, vec3(0.0)));

    return (1.0 - attenuation) / (1.0 + attenuation);
}

vec3 applyPalette(vec3 color)
{
    float peak = max(color.r, max(color.g, color.b));
    vec3 weights = vec3(peak) - color;

    vec3 whitePalette = clamp(
        vec3(1.0)
        + weights.r * (COLOR_A - vec3(1.0))
        + weights.g * (COLOR_B - vec3(1.0))
        + weights.b * (COLOR_C - vec3(1.0)),
        0.0,
        1.0
    );

    float baseAmount = 1.0 - peak;

    return clamp(
        whitePalette
        + baseAmount * (SPHERE_COLOR - vec3(1.0)),
        0.0,
        1.0
    );
}

// -------------------- Image --------------------

void mainImage(out vec4 fragColor, in vec2 fragCoord)
{
    vec2 uv = (fragCoord - 0.5 * iResolution.xy) / iResolution.y - uOffset;

    vec3 origin = vec3(0.0, 0.0, -CAMERA_DISTANCE);
    vec3 direction = vec3(uv / CAMERA_FOCAL, 1.0);

    float rayLengthSquared = dot(direction, direction);
    float projection = dot(origin, direction);
    float centerTravel = -projection / rayLengthSquared;

    vec3 closestPoint = origin + direction * centerTravel;
    float closestDistance = length(closestPoint);

    float edgeWidth = max(fwidth(closestDistance), 0.00001);

    float coverage = 1.0 - smoothstep(
        SPHERE_RADIUS - edgeWidth,
        SPHERE_RADIUS,
        closestDistance
    );

    float chordSquared = SPHERE_RADIUS * SPHERE_RADIUS
                       - dot(closestPoint, closestPoint);

    if (chordSquared <= 0.0)
    {
        fragColor = vec4(0.0);
        return;
    }

    float halfInterval = sqrt(chordSquared / rayLengthSquared);

    vec2 interval = vec2(
        max(centerTravel - halfInterval, 0.0),
        centerTravel + halfInterval
    );

    mat2 rotation = rotationMatrix(iTime * ROTATION_SPEED);

    vec3 phase = MORPH_AMOUNT * sin(
        iTime * MORPH_SPEED * vec3(0.83, 1.0, 0.67)
    );

    vec4 volume = traceStructure(
        uRotation * origin,
        uRotation * direction,
        interval,
        rotation,
        phase
    );

    fragColor = vec4(volume.rgb, volume.a * coverage);
}
void main() { mainImage(gl_FragColor, gl_FragCoord.xy); }
`
});

const geometry = new THREE.BufferGeometry();
geometry.setAttribute("position", new THREE.Float32BufferAttribute([-1, -1, 0, 3, -1, 0, -1, 3, 0], 3));
const triangle = new THREE.Mesh(geometry, material);
triangle.frustumCulled = false;
scene.add(triangle);

function resize() {
  renderer.setPixelRatio(Number(params.DPR));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.getDrawingBufferSize(uniforms.iResolution.value);
}
window.addEventListener("resize", resize);
resize();

function updateBackground() {
  if (params.greenScreen) {
    document.body.style.backgroundColor = "#00ff00";
    if (renderer) renderer.setClearColor(0x00ff00, 1);
  } else {
    const color = params.BACKGROUND_COLOR;
    const r = Math.round(color[0] * 255);
    const g = Math.round(color[1] * 255);
    const b = Math.round(color[2] * 255);
    document.body.style.backgroundColor = `rgb(${r}, ${g}, ${b})`;
    if (renderer) renderer.setClearColor(0x000000, 0);
  }
}
updateBackground();

function applyColorScheme(name) {
  const scheme = COLOR_SCHEMES[name];
  if (!scheme) return;
  params.colorScheme = name;
  params.COLOR_A = [...scheme.COLOR_A];
  params.COLOR_B = [...scheme.COLOR_B];
  params.COLOR_C = [...scheme.COLOR_C];
  params.SPHERE_COLOR = [...scheme.SPHERE_COLOR];
  params.BACKGROUND_COLOR = [...scheme.BACKGROUND_COLOR];

  uniforms.COLOR_A.value.fromArray(params.COLOR_A);
  uniforms.COLOR_B.value.fromArray(params.COLOR_B);
  uniforms.COLOR_C.value.fromArray(params.COLOR_C);
  uniforms.SPHERE_COLOR.value.fromArray(params.SPHERE_COLOR);
  uniforms.BACKGROUND_COLOR.value.fromArray(params.BACKGROUND_COLOR);

  updateBackground();
  gui.controllersRecursive().forEach(ctrl => ctrl.updateDisplay());
}

function applyAnimationPreset(name) {
  const preset = ANIMATION_PRESETS[name];
  if (!preset) return;
  params.animationPreset = name;
  params.ROTATION_SPEED = preset.ROTATION_SPEED;
  params.MORPH_SPEED = preset.MORPH_SPEED;
  params.MORPH_AMOUNT = preset.MORPH_AMOUNT;
  params.autoCameraOrbit = preset.autoCameraOrbit;

  uniforms.ROTATION_SPEED.value = params.ROTATION_SPEED;
  uniforms.MORPH_SPEED.value = params.MORPH_SPEED;
  uniforms.MORPH_AMOUNT.value = params.MORPH_AMOUNT;
  gui.controllersRecursive().forEach(ctrl => ctrl.updateDisplay());
}

function randomizeScene() {
  const schemeKeys = Object.keys(COLOR_SCHEMES);
  const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
  applyColorScheme(randomScheme);

  params.SPHERE_RADIUS = Number(THREE.MathUtils.randFloat(0.7, 1.35).toFixed(2));
  params.FRACTAL_SCALE = Number(THREE.MathUtils.randFloat(0.5, 2.5).toFixed(2));
  params.TWIST_AMOUNT = Number(THREE.MathUtils.randFloat(-2.8, 2.8).toFixed(2));
  params.LAYER_THICKNESS = Number(THREE.MathUtils.randFloat(0.03, 0.12).toFixed(3));
  params.FRACTAL_OPACITY = Number(THREE.MathUtils.randFloat(0.8, 1.0).toFixed(2));
  params.BRIGHTNESS = Number(THREE.MathUtils.randFloat(0.8, 2.0).toFixed(2));

  params.ROTATION_SPEED = Number(THREE.MathUtils.randFloat(-0.35, 0.35).toFixed(2));
  params.MORPH_SPEED = Number(THREE.MathUtils.randFloat(0.1, 0.7).toFixed(2));
  params.MORPH_AMOUNT = Number(THREE.MathUtils.randFloat(0.6, 2.0).toFixed(2));

  params.EXPOSURE = Number(THREE.MathUtils.randFloat(0.85, 1.35).toFixed(2));
  params.KEY_LIGHT_INTENSITY = Number(THREE.MathUtils.randFloat(0.6, 1.6).toFixed(2));
  params.RIM_LIGHT_INTENSITY = Number(THREE.MathUtils.randFloat(0.4, 1.4).toFixed(2));

  uniforms.SPHERE_RADIUS.value = params.SPHERE_RADIUS;
  uniforms.FRACTAL_SCALE.value = params.FRACTAL_SCALE;
  uniforms.TWIST_AMOUNT.value = params.TWIST_AMOUNT;
  uniforms.LAYER_THICKNESS.value = params.LAYER_THICKNESS;
  uniforms.FRACTAL_OPACITY.value = params.FRACTAL_OPACITY;
  uniforms.BRIGHTNESS.value = params.BRIGHTNESS;

  uniforms.ROTATION_SPEED.value = params.ROTATION_SPEED;
  uniforms.MORPH_SPEED.value = params.MORPH_SPEED;
  uniforms.MORPH_AMOUNT.value = params.MORPH_AMOUNT;

  uniforms.EXPOSURE.value = params.EXPOSURE;
  uniforms.KEY_LIGHT_INTENSITY.value = params.KEY_LIGHT_INTENSITY;
  uniforms.RIM_LIGHT_INTENSITY.value = params.RIM_LIGHT_INTENSITY;

  gui.controllersRecursive().forEach(ctrl => ctrl.updateDisplay());
}

function recreateRenderer() {
  removeEvents(canvas);
  const oldCanvas = canvas;
  renderer.dispose();

  renderer = new THREE.WebGLRenderer({
    alpha: true,
    antialias: params.antialias,
    powerPreference: "high-performance"
  });
  renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
  renderer.toneMapping = THREE.NoToneMapping;
  canvas = renderer.domElement;
  oldCanvas.parentNode.replaceChild(canvas, oldCanvas);
  setupEvents(canvas);
  resize();
  updateBackground();
}

// GUI Setup
const gui = new GUI({ title: "Settings" });

function addUniformNumber(folder, key, label, min, max, step) {
  return folder.add(params, key, min, max, step).name(label)
    .onChange(value => { uniforms[key].value = value; });
}

// 1. Colors & Palettes Folder
const colorsFolder = gui.addFolder("Colors & Palettes");
colorsFolder.add(params, "greenScreen").name("Green Screen (#00ff00)").onChange(updateBackground);
colorsFolder.add(params, "colorScheme", Object.keys(COLOR_SCHEMES)).name("Color Scheme").onChange(applyColorScheme);

for (const [key, label] of [
  ["COLOR_A", "Color A"],
  ["COLOR_B", "Color B"],
  ["COLOR_C", "Color C"],
  ["SPHERE_COLOR", "Sphere Color"],
  ["BACKGROUND_COLOR", "Background Color"]
]) {
  colorsFolder.addColor(params, key, 1).name(label)
    .onChange(value => {
      uniforms[key].value.fromArray(value);
      if (key === "BACKGROUND_COLOR") updateBackground();
    });
}

// 2. Animation Folder
const animationFolder = gui.addFolder("Animation");
animationFolder.add(params, "animationPreset", Object.keys(ANIMATION_PRESETS))
  .name("Animation Preset").onChange(applyAnimationPreset);
animationFolder.add(params, "ANIMATION_SPEED", 0, 3, 0.01).name("Master Speed");
addUniformNumber(animationFolder, "ROTATION_SPEED", "Rotation Speed", -1, 1, 0.01);
addUniformNumber(animationFolder, "MORPH_SPEED", "Morph Speed", 0, 2, 0.01);
addUniformNumber(animationFolder, "MORPH_AMOUNT", "Morph Amount", 0, 2, 0.01);

// 3. Camera & Position Folder
const cameraFolder = gui.addFolder("Camera & Position");
const cameraDistController = addUniformNumber(cameraFolder, "CAMERA_DISTANCE", "Distance (Zoom)", 1.2, 16, 0.01);
addUniformNumber(cameraFolder, "CAMERA_FOCAL", "Focal Length", 0.3, 4, 0.01);

// 4. Lighting & Exposure Folder
const lightingFolder = gui.addFolder("Lighting & Exposure");
addUniformNumber(lightingFolder, "EXPOSURE", "Scene Exposure", 0.1, 3.0, 0.01);
addUniformNumber(lightingFolder, "AMBIENT_INTENSITY", "Ambient Intensity", 0.0, 2.0, 0.01);
lightingFolder.addColor(params, "AMBIENT_COLOR", 1).name("Ambient Color")
  .onChange(v => uniforms.AMBIENT_COLOR.value.fromArray(v));

addUniformNumber(lightingFolder, "KEY_LIGHT_INTENSITY", "Key Light Intensity", 0.0, 3.0, 0.01);
lightingFolder.addColor(params, "KEY_LIGHT_COLOR", 1).name("Key Light Color")
  .onChange(v => uniforms.KEY_LIGHT_COLOR.value.fromArray(v));

addUniformNumber(lightingFolder, "FILL_LIGHT_INTENSITY", "Fill Light Intensity", 0.0, 2.0, 0.01);
lightingFolder.addColor(params, "FILL_LIGHT_COLOR", 1).name("Fill Light Color")
  .onChange(v => uniforms.FILL_LIGHT_COLOR.value.fromArray(v));

addUniformNumber(lightingFolder, "RIM_LIGHT_INTENSITY", "Rim Light Intensity", 0.0, 3.0, 0.01);
lightingFolder.addColor(params, "RIM_LIGHT_COLOR", 1).name("Rim Light Color")
  .onChange(v => uniforms.RIM_LIGHT_COLOR.value.fromArray(v));

// 5. Geometry Folder
const geometryFolder = gui.addFolder("Geometry");
addUniformNumber(geometryFolder, "SPHERE_RADIUS", "Sphere Radius", 0.2, 2.5, 0.01);
addUniformNumber(geometryFolder, "FRACTAL_SCALE", "Fractal Scale", 0.1, 6, 0.01);
addUniformNumber(geometryFolder, "TWIST_AMOUNT", "Twist Amount", -3, 3, 0.01);
addUniformNumber(geometryFolder, "LAYER_THICKNESS", "Layer Thickness", 0.01, 0.2, 0.005);
addUniformNumber(geometryFolder, "FRACTAL_OPACITY", "Fractal Opacity", 0, 1, 0.01);
addUniformNumber(geometryFolder, "BRIGHTNESS", "Brightness", 0, 5, 0.01);

// 6. Interaction & Controls Folder
const controlsFolder = gui.addFolder("Interaction & Controls");
controlsFolder.add(params, "randomOnClick").name("Click to Randomize");
controlsFolder.add({ randomize: randomizeScene }, "randomize").name("🎲 Randomize Scene");
controlsFolder.add(params, "dragMode", ["Pan & Move", "Rotate"]).name("Drag Mode");

const actions = {
  resetPosition() {
    params.offsetX = 0;
    params.offsetY = 0;
    uniforms.uOffset.value.set(0, 0);
  },
  resetRotation() {
    angularVelocity.set(0, 0, 0);
    targetOrientation.identity();
  }
};
controlsFolder.add(actions, "resetPosition").name("Reset Position");
controlsFolder.add(actions, "resetRotation").name("Reset Rotation");

// 7. Performance Folder
const perfFolder = gui.addFolder("Performance");
perfFolder.add(params, "DPR", 0.5, 2.5, 0.1).name("DPR (Pixel Ratio)").onChange(resize);
perfFolder.add(params, "antialias").name("Antialias (Three.js)").onChange(recreateRenderer);

// Keyboard Toggle GUI with "H"
let guiVisible = true;
window.addEventListener("keydown", (event) => {
  if (event.target && (event.target.tagName === "INPUT" || event.target.tagName === "SELECT")) return;
  if (event.code === "KeyH" || event.key === "h" || event.key === "H") {
    guiVisible = !guiVisible;
    gui.domElement.style.display = guiVisible ? "" : "none";
  }
});

// Gesture and Drag Mechanics
const orientation = new THREE.Quaternion();
const targetOrientation = new THREE.Quaternion();
const inverseOrientation = new THREE.Quaternion();
const dragRotation = new THREE.Quaternion();
const dragAxis = new THREE.Vector3();
const rotationMatrix = new THREE.Matrix4();
const angularVelocity = new THREE.Vector3();
const sampledVelocity = new THREE.Vector3();
const INERTIA_DAMPING = 0.7;
const MAX_ANGULAR_SPEED = 24.0;
const DRAG_SENSITIVITY = 1.0;
const SPEED_BOOST = 1.8;

let lastPointerTime = 0;
let pointerId = null;
let pointerButton = 0;
let previousX = 0;
let previousY = 0;
let pointerDownPos = { x: 0, y: 0, time: 0 };
let isDragging = false;

function onContextMenu(e) {
  e.preventDefault();
}

function onPointerDown(event) {
  if (pointerId !== null || !event.isPrimary) return;
  pointerId = event.pointerId;
  pointerButton = event.button;
  previousX = event.clientX;
  previousY = event.clientY;
  lastPointerTime = event.timeStamp;
  pointerDownPos = { x: event.clientX, y: event.clientY, time: performance.now() };
  isDragging = false;
  angularVelocity.set(0, 0, 0);
  canvas.setPointerCapture(pointerId);
}

function onPointerMove(event) {
  if (event.pointerId !== pointerId) return;
  const now = event.timeStamp;
  const sampleDelta = Math.max((now - lastPointerTime) / 1000, 0.001);
  const dx = event.clientX - previousX;
  const dy = event.clientY - previousY;
  previousX = event.clientX;
  previousY = event.clientY;
  lastPointerTime = now;

  const totalDist = Math.hypot(event.clientX - pointerDownPos.x, event.clientY - pointerDownPos.y);
  if (totalDist > 4) {
    isDragging = true;
    canvas.classList.add("dragging");
  }

  let doPan = false;
  if (pointerButton === 1) {
    doPan = true;
  } else if (params.dragMode === "Pan & Move") {
    doPan = !(pointerButton === 2 || event.shiftKey);
  } else {
    doPan = (pointerButton === 2 || event.shiftKey);
  }

  if (doPan) {
    const invH = 1.0 / Math.max(window.innerHeight, 1);
    params.offsetX += dx * invH;
    params.offsetY -= dy * invH;
    uniforms.uOffset.value.set(params.offsetX, params.offsetY);
  } else {
    const distance = Math.hypot(dx, dy);
    if (distance < 0.0001) return;
    dragAxis.set(-dy / distance, -dx / distance, 0);
    const viewportSize = Math.max(200, Math.min(canvas.clientWidth, canvas.clientHeight));
    const cursorSpeed = distance / (sampleDelta * viewportSize);
    const speedGain = 1 + SPEED_BOOST * cursorSpeed / (cursorSpeed + 1.5);
    const angle = distance * Math.PI * DRAG_SENSITIVITY * speedGain / viewportSize;
    dragRotation.setFromAxisAngle(dragAxis, angle);
    targetOrientation.premultiply(dragRotation).normalize();
    sampledVelocity.copy(dragAxis).multiplyScalar(
      Math.min(angle / sampleDelta, MAX_ANGULAR_SPEED)
    );
    angularVelocity.lerp(sampledVelocity, 1 - Math.exp(-90 * sampleDelta));
  }
}

function onPointerUp(event) {
  if (pointerId === null || (event && event.pointerId !== pointerId)) return;
  const releasedId = pointerId;
  pointerId = null;
  canvas.classList.remove("dragging");
  if (releasedId !== null && canvas.hasPointerCapture(releasedId)) {
    canvas.releasePointerCapture(releasedId);
  }

  if (!isDragging) {
    if (params.randomOnClick) {
      randomizeScene();
    }
    angularVelocity.set(0, 0, 0);
    return;
  }

  if (event?.type === "pointerup") {
    const idleTime = Math.max(0, (event.timeStamp - lastPointerTime) / 1000 - 0.04);
    angularVelocity.multiplyScalar(Math.exp(-20 * idleTime));
  } else {
    angularVelocity.set(0, 0, 0);
  }
}

function onWheel(event) {
  event.preventDefault();
  const zoomFactor = Math.exp(event.deltaY * 0.0015);
  params.CAMERA_DISTANCE = THREE.MathUtils.clamp(
    params.CAMERA_DISTANCE * zoomFactor,
    1.2,
    16.0
  );
  uniforms.CAMERA_DISTANCE.value = params.CAMERA_DISTANCE;
  cameraDistController.updateDisplay();
}

function setupEvents(el) {
  el.addEventListener("pointerdown", onPointerDown);
  el.addEventListener("pointermove", onPointerMove);
  el.addEventListener("pointerup", onPointerUp);
  el.addEventListener("pointercancel", onPointerUp);
  el.addEventListener("lostpointercapture", onPointerUp);
  el.addEventListener("wheel", onWheel, { passive: false });
  el.addEventListener("contextmenu", onContextMenu);
}

function removeEvents(el) {
  el.removeEventListener("pointerdown", onPointerDown);
  el.removeEventListener("pointermove", onPointerMove);
  el.removeEventListener("pointerup", onPointerUp);
  el.removeEventListener("pointercancel", onPointerUp);
  el.removeEventListener("lostpointercapture", onPointerUp);
  el.removeEventListener("wheel", onWheel);
  el.removeEventListener("contextmenu", onContextMenu);
}

setupEvents(canvas);

window.addEventListener("blur", () => {
  onPointerUp();
  angularVelocity.set(0, 0, 0);
});

let previousTime = performance.now();
let frameId = 0;
let disposed = false;
let contextLost = false;

document.addEventListener("visibilitychange", () => {
  previousTime = performance.now();
  if (document.hidden) {
    onPointerUp();
    angularVelocity.set(0, 0, 0);
  }
});

canvas.addEventListener("webglcontextlost", event => {
  event.preventDefault();
  contextLost = true;
  onPointerUp();
});

canvas.addEventListener("webglcontextrestored", () => {
  contextLost = false;
  previousTime = performance.now();
  resize();
});

function animate(now) {
  if (disposed) return;
  frameId = requestAnimationFrame(animate);
  const delta = Math.min(Math.max((now - previousTime) / 1000, 0), 0.05);
  previousTime = now;
  if (document.hidden || contextLost) return;

  uniforms.iTime.value += delta * params.ANIMATION_SPEED;

  if (params.autoCameraOrbit && pointerId === null && params.ANIMATION_SPEED > 0) {
    const driftAxis = new THREE.Vector3(0.3, 1.0, 0.15).normalize();
    const driftAngle = 0.06 * delta * params.ANIMATION_SPEED;
    const driftRot = new THREE.Quaternion().setFromAxisAngle(driftAxis, driftAngle);
    targetOrientation.premultiply(driftRot).normalize();
  }

  if (pointerId === null) {
    const speed = angularVelocity.length();
    if (speed > 0.0001) {
      const decay = Math.exp(-INERTIA_DAMPING * delta);
      dragAxis.copy(angularVelocity).multiplyScalar(1 / speed);
      dragRotation.setFromAxisAngle(
        dragAxis, speed * (1 - decay) / INERTIA_DAMPING
      );
      targetOrientation.premultiply(dragRotation).normalize();
      orientation.premultiply(dragRotation).normalize();
      angularVelocity.multiplyScalar(decay);
    } else {
      angularVelocity.set(0, 0, 0);
    }
  }

  orientation.slerp(targetOrientation, 1 - Math.exp(-16 * delta));
  inverseOrientation.copy(orientation).invert();
  rotationMatrix.makeRotationFromQuaternion(inverseOrientation);
  uniforms.uRotation.value.setFromMatrix4(rotationMatrix);
  renderer.render(scene, camera);
}

renderer.compile(scene, camera);
frameId = requestAnimationFrame(animate);

window.addEventListener("pagehide", event => {
  if (event.persisted) return;
  disposed = true;
  cancelAnimationFrame(frameId);
  gui.destroy();
  geometry.dispose();
  material.dispose();
  renderer.dispose();
}, { once: true });
</script>
</body>
</html>
