<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>490 - Truchet Wave Vortex</title>
  <style>
    * {
      padding: 0;
      margin: 0;
      overflow: hidden;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
      cursor: grab;
    }
    canvas:active {
      cursor: grabbing;
    }
  </style>
</head>
<body>
  <canvas></canvas>

  <script type="module">
    import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');

    let WW = canvas.width = window.innerWidth;
    let WH = canvas.height = window.innerHeight;

    const PALETTE_DEFINITIONS = {
      'Palette 1 (F6AA1C, BC3908, 941B0C, F6AA1C, 220901)': {
        background: '#220901',
        staticColor: '#451505',
        colors: ['#F6AA1C', '#BC3908', '#941B0C', '#F6AA1C']
      },
      'Palette 2 (63D1CF, 5BC0BE, 4BAD9E, 4BAD9E, 0B132B, 000000)': {
        background: '#000000',
        staticColor: '#0B132B',
        colors: ['#63D1CF', '#5BC0BE', '#4BAD9E', '#4BAD9E']
      },
      'Palette 3 (AA60C8, D69ADE, C9A3C6, CFB5C2, 0D001D, 120A12)': {
        background: '#0D001D',
        staticColor: '#281335',
        colors: ['#AA60C8', '#D69ADE', '#C9A3C6', '#CFB5C2']
      },
      'Palette 4 (FEF1BE, FFBA00, 008189, 00474D, 061210)': {
        background: '#061210',
        staticColor: '#00474D',
        colors: ['#FEF1BE', '#FFBA00', '#008189', '#00474D']
      },
      'Palette 5 (D4FFB0, 7FFF00, 00B894, 0A3322, 05140A)': {
        background: '#05140A',
        staticColor: '#0A3322',
        colors: ['#D4FFB0', '#7FFF00', '#00B894', '#0A3322']
      },
      'Palette 6 (FFE8CC, FF8C00, C7501A, 3D1050, 0E0618)': {
        background: '#0E0618',
        staticColor: '#3D1050',
        colors: ['#FFE8CC', '#FF8C00', '#C7501A', '#3D1050']
      },
      'Palette 7 (E8E0FF, B38FFF, 6A3DE8, 1A1250, 090612)': {
        background: '#090612',
        staticColor: '#1A1250',
        colors: ['#E8E0FF', '#B38FFF', '#6A3DE8', '#1A1250']
      },
      'Palette 8 (E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)': {
        background: '#05020F',
        staticColor: '#1E0A3D',
        colors: ['#E0FBFF', '#00F0FF', '#D40078', '#1E0A3D']
      }
    };

    const SCHEMES = [
      'Original',
      'Monochromatic',
      'Analogous',
      'Complementary',
      'Split-complementary',
      'Triadic',
      'Tetradic',
      'Double split-complementary',
      'Achromatic',
      'Achromatic + Accent',
      'Neutral + Accent',
      'Palette 1 (F6AA1C, BC3908, 941B0C, F6AA1C, 220901)',
      'Palette 2 (63D1CF, 5BC0BE, 4BAD9E, 4BAD9E, 0B132B, 000000)',
      'Palette 3 (AA60C8, D69ADE, C9A3C6, CFB5C2, 0D001D, 120A12)',
      'Palette 4 (FEF1BE, FFBA00, 008189, 00474D, 061210)',
      'Palette 5 (D4FFB0, 7FFF00, 00B894, 0A3322, 05140A)',
      'Palette 6 (FFE8CC, FF8C00, C7501A, 3D1050, 0E0618)',
      'Palette 7 (E8E0FF, B38FFF, 6A3DE8, 1A1250, 090612)',
      'Palette 8 (E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)'
    ];

    const params = {
      // Background & Colors
      colorScheme: 'Original',
      greenscreen: false,
      backgroundColor: '#07070e',
      baseHue: 200,
      accentColor: '#ff1744',
      neutralAccent: '#ffaa00',
      achromaticStyle: 'White on Black',
      lineOpacity: 1.0,
      staticLineBrightness: 0.35,

      // Geometry & Dynamics
      gridSize: 20,
      lineWidth: 5,
      lineCap: 'round',
      speed: 1.0,
      waveScale: 0.01,
      waveFrequency: 3.0,
      rotationMultiplier: 1.0,

      // Interaction & Camera
      zoom: 1.0,
      panX: 0,
      panY: 0,
      clickToRandomize: true,
      seed: 42
    };

    function hexToRgb(hex) {
      hex = hex.replace('#', '');
      if (hex.length === 3) {
        hex = hex.split('').map(c => c + c).join('');
      }
      const num = parseInt(hex, 16);
      return {
        r: (num >> 16) & 255,
        g: (num >> 8) & 255,
        b: num & 255
      };
    }

    function hexToRgba(hex, alpha = 1) {
      if (hex.startsWith('rgb') || hex.startsWith('hsl')) return hex;
      const rgb = hexToRgb(hex);
      return `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${alpha})`;
    }

    function interpolateHex(hex1, hex2, factor) {
      const c1 = hexToRgb(hex1);
      const c2 = hexToRgb(hex2);
      const r = Math.round(c1.r + (c2.r - c1.r) * factor);
      const g = Math.round(c1.g + (c2.g - c1.g) * factor);
      const b = Math.round(c1.b + (c2.b - c1.b) * factor);
      return `#${((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1)}`;
    }

    function hslToHex(h, s, l) {
      h = ((h % 360) + 360) % 360;
      s /= 100;
      l /= 100;
      const a = s * Math.min(l, 1 - l);
      const f = n => {
        const k = (n + h / 30) % 12;
        const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
        return Math.round(255 * color).toString(16).padStart(2, '0');
      };
      return `#${f(0)}${f(8)}${f(4)}`;
    }

    function getDefaultBg(scheme) {
      if (scheme.startsWith('Palette ')) {
        return PALETTE_DEFINITIONS[scheme].background;
      }
      switch (scheme) {
        case 'Original':
          return '#07070e';
        case 'Monochromatic':
        case 'Analogous':
        case 'Complementary':
        case 'Split-complementary':
        case 'Triadic':
        case 'Tetradic':
        case 'Double split-complementary':
          return hslToHex(params.baseHue, 35, 6);
        case 'Achromatic':
        case 'Achromatic + Accent':
          return params.achromaticStyle === 'Black on White' ? '#f5f5f7' : '#0a0a0a';
        case 'Neutral + Accent':
          return '#1c1b1a';
        default:
          return '#07070e';
      }
    }

    function applyColorSchemeDefaults(scheme) {
      if (!params.greenscreen) {
        params.backgroundColor = getDefaultBg(scheme);
      }
    }

    function getCellOrientation(gx, gy, seed) {
      let h = (gx * 374761393 + gy * 668265263 + seed * 1274126177) ^ (gx >> 13) ^ (gy << 7);
      h = Math.imul(h ^ (h >>> 16), 0x85ebca6b);
      h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35);
      return (h >>> 31) & 1;
    }

    function getLineColor(scheme, t, s, theta, dist, isRotating, waveVal) {
      const alpha = params.lineOpacity;
      const staticDim = params.staticLineBrightness;

      if (scheme.startsWith('Palette ')) {
        const pal = PALETTE_DEFINITIONS[scheme];
        if (!isRotating) {
          return hexToRgba(pal.staticColor, alpha * staticDim);
        }
        const colors = pal.colors;
        const norm = (Math.sin(t + s) * 0.5 + 0.5) * (colors.length - 1);
        const idx = Math.floor(norm);
        const frac = norm - idx;
        const c1 = colors[idx];
        const c2 = colors[Math.min(idx + 1, colors.length - 1)];
        return hexToRgba(interpolateHex(c1, c2, frac), alpha);
      }

      switch (scheme) {
        case 'Original': {
          if (!isRotating) {
            return `rgba(80, 100, 150, ${0.25 * staticDim * alpha})`;
          }
          const hue = ((Math.sin(t + s) * 360) % 360 + 360) % 360;
          return `hsla(${hue}, 80%, 60%, ${alpha})`;
        }

        case 'Monochromatic': {
          const bh = params.baseHue;
          if (!isRotating) {
            return `hsla(${bh}, 35%, 22%, ${alpha * staticDim})`;
          }
          const sat = 70 + Math.sin(t + s) * 25;
          const light = 50 + Math.sin(t + s) * 35;
          return `hsla(${bh}, ${sat}%, ${light}%, ${alpha})`;
        }

        case 'Analogous': {
          const bh = params.baseHue;
          if (!isRotating) {
            return `hsla(${bh}, 30%, 20%, ${alpha * staticDim})`;
          }
          const h = ((bh + Math.sin(t + s) * 35) % 360 + 360) % 360;
          return `hsla(${h}, 85%, 60%, ${alpha})`;
        }

        case 'Complementary': {
          const bh = params.baseHue;
          const comp = (bh + 180) % 360;
          if (!isRotating) {
            return `hsla(${bh}, 25%, 22%, ${alpha * staticDim})`;
          }
          const h = Math.sin(theta + t) > 0 ? bh : comp;
          const light = 55 + Math.sin(t + s) * 25;
          return `hsla(${h}, 90%, ${light}%, ${alpha})`;
        }

        case 'Split-complementary': {
          const bh = params.baseHue;
          const hues = [bh, (bh + 150) % 360, (bh + 210) % 360];
          if (!isRotating) {
            return `hsla(${bh}, 25%, 20%, ${alpha * staticDim})`;
          }
          const idx = Math.floor(((theta + Math.PI) / (Math.PI * 2 / 3) + Math.sin(t + s) + 6)) % 3;
          return `hsla(${hues[idx]}, 85%, 60%, ${alpha})`;
        }

        case 'Triadic': {
          const bh = params.baseHue;
          const hues = [bh, (bh + 120) % 360, (bh + 240) % 360];
          if (!isRotating) {
            return `hsla(${bh}, 25%, 20%, ${alpha * staticDim})`;
          }
          const idx = Math.floor(((theta + Math.PI) / (Math.PI * 2 / 3) + Math.sin(t + s) + 6)) % 3;
          return `hsla(${hues[idx]}, 85%, 62%, ${alpha})`;
        }

        case 'Tetradic': {
          const bh = params.baseHue;
          const hues = [bh, (bh + 90) % 360, (bh + 180) % 360, (bh + 270) % 360];
          if (!isRotating) {
            return `hsla(${bh}, 25%, 20%, ${alpha * staticDim})`;
          }
          const idx = Math.floor(Math.abs(Math.sin(t + s) * 4)) % 4;
          return `hsla(${hues[idx]}, 85%, 60%, ${alpha})`;
        }

        case 'Double split-complementary': {
          const bh = params.baseHue;
          const hues = [
            (bh - 25 + 360) % 360,
            (bh + 25) % 360,
            (bh + 155) % 360,
            (bh + 205) % 360
          ];
          if (!isRotating) {
            return `hsla(${bh}, 25%, 20%, ${alpha * staticDim})`;
          }
          const idx = Math.floor(Math.abs(Math.sin(t + s + theta) * 4)) % 4;
          return `hsla(${hues[idx]}, 85%, 60%, ${alpha})`;
        }

        case 'Achromatic': {
          const isDark = params.achromaticStyle === 'White on Black';
          if (!isRotating) {
            return isDark
              ? `rgba(60, 60, 65, ${alpha * staticDim})`
              : `rgba(200, 200, 205, ${alpha * staticDim})`;
          }
          if (isDark) {
            const light = 60 + Math.sin(t + s) * 38;
            return `hsla(0, 0%, ${light}%, ${alpha})`;
          } else {
            const light = 38 - Math.sin(t + s) * 36;
            return `hsla(0, 0%, ${light}%, ${alpha})`;
          }
        }

        case 'Achromatic + Accent': {
          const isDark = params.achromaticStyle === 'White on Black';
          if (!isRotating) {
            return isDark
              ? `rgba(60, 60, 65, ${alpha * staticDim})`
              : `rgba(200, 200, 205, ${alpha * staticDim})`;
          }
          if (waveVal > 0.35) {
            return hexToRgba(params.accentColor, alpha);
          }
          if (isDark) {
            const light = 70 + Math.sin(t + s) * 28;
            return `hsla(0, 0%, ${light}%, ${alpha})`;
          } else {
            const light = 32 - Math.sin(t + s) * 30;
            return `hsla(0, 0%, ${light}%, ${alpha})`;
          }
        }

        case 'Neutral + Accent': {
          if (!isRotating) {
            return `rgba(75, 70, 64, ${alpha * staticDim})`;
          }
          if (waveVal > 0.28) {
            return hexToRgba(params.neutralAccent, alpha);
          }
          return waveVal > 0
            ? `rgba(222, 214, 201, ${alpha})`
            : `rgba(143, 134, 121, ${alpha})`;
        }

        default:
          return `hsla(${((Math.sin(t + s) * 360) % 360 + 360) % 360}, 80%, 60%, ${alpha})`;
      }
    }

    // GUI Setup
    const gui = new GUI({ title: 'Truchet Controls' });

    function updateAllGUI(instance) {
      if (typeof instance.controllersRecursive === 'function') {
        instance.controllersRecursive().forEach(c => c.updateDisplay());
      } else {
        const walk = (folder) => {
          if (folder.controllers) folder.controllers.forEach(c => c.updateDisplay());
          if (folder.folders) folder.folders.forEach(walk);
        };
        walk(instance);
      }
    }

    const folderColors = gui.addFolder('Colors & Themes');
    const schemeCtrl = folderColors.add(params, 'colorScheme', SCHEMES).name('Scheme');
    const greenscreenCtrl = folderColors.add(params, 'greenscreen').name('Greenscreen (#00ff00)');
    const bgCtrl = folderColors.addColor(params, 'backgroundColor').name('Background Color').listen();
    const baseHueCtrl = folderColors.add(params, 'baseHue', 0, 360, 1).name('Base Hue');
    const accentColorCtrl = folderColors.addColor(params, 'accentColor').name('Accent Color');
    const neutralAccentCtrl = folderColors.addColor(params, 'neutralAccent').name('Neutral Accent');
    const achrStyleCtrl = folderColors.add(params, 'achromaticStyle', ['White on Black', 'Black on White']).name('Achromatic Style');
    folderColors.add(params, 'lineOpacity', 0.1, 1.0, 0.05).name('Line Opacity');
    folderColors.add(params, 'staticLineBrightness', 0.0, 1.0, 0.05).name('Static Line Brightness');

    schemeCtrl.onChange((scheme) => {
      applyColorSchemeDefaults(scheme);
      updateAllGUI(gui);
    });

    baseHueCtrl.onChange(() => {
      if (!params.greenscreen && ['Monochromatic', 'Analogous', 'Complementary', 'Split-complementary', 'Triadic', 'Tetradic', 'Double split-complementary'].includes(params.colorScheme)) {
        params.backgroundColor = hslToHex(params.baseHue, 35, 6);
      }
      updateAllGUI(gui);
    });

    achrStyleCtrl.onChange(() => {
      if (!params.greenscreen && (params.colorScheme === 'Achromatic' || params.colorScheme === 'Achromatic + Accent')) {
        params.backgroundColor = params.achromaticStyle === 'Black on White' ? '#f5f5f7' : '#0a0a0a';
      }
      updateAllGUI(gui);
    });

    const folderGeometry = gui.addFolder('Geometry & Wave');
    folderGeometry.add(params, 'gridSize', 10, 60, 1).name('Grid Size');
    folderGeometry.add(params, 'lineWidth', 1, 15, 0.5).name('Line Width');
    folderGeometry.add(params, 'lineCap', ['round', 'square', 'butt']).name('Line Cap');
    folderGeometry.add(params, 'speed', 0.1, 3.5, 0.05).name('Speed');
    folderGeometry.add(params, 'waveScale', 0.002, 0.04, 0.001).name('Wave Distortion');
    folderGeometry.add(params, 'waveFrequency', 0.5, 8.0, 0.1).name('Wave Frequency');
    folderGeometry.add(params, 'rotationMultiplier', 0.2, 3.0, 0.05).name('Rotation Factor');

    const folderCamera = gui.addFolder('Interaction & View');
    const zoomCtrl = folderCamera.add(params, 'zoom', 0.1, 6.0, 0.05).name('Zoom').listen();
    const panXCtrl = folderCamera.add(params, 'panX', -2000, 2000, 1).name('Pan X').listen();
    const panYCtrl = folderCamera.add(params, 'panY', -2000, 2000, 1).name('Pan Y').listen();

    const viewActions = {
      resetView: () => {
        params.zoom = 1.0;
        params.panX = 0;
        params.panY = 0;
        updateAllGUI(gui);
      },
      randomizeNow: () => {
        randomizeScene();
      }
    };

    folderCamera.add(viewActions, 'resetView').name('Reset Pan/Zoom');
    folderCamera.add(params, 'clickToRandomize').name('Click Scene Randomize');
    folderCamera.add(viewActions, 'randomizeNow').name('🎲 Randomize Scene');

    function randomizeScene() {
      const randomScheme = SCHEMES[Math.floor(Math.random() * SCHEMES.length)];
      params.colorScheme = randomScheme;
      params.gridSize = Math.floor(Math.random() * 20) + 15;
      params.lineWidth = +(Math.random() * 5 + 2.5).toFixed(1);
      params.speed = +(Math.random() * 1.8 + 0.4).toFixed(2);
      params.waveScale = +(Math.random() * 0.015 + 0.005).toFixed(4);
      params.waveFrequency = +(Math.random() * 4 + 1.5).toFixed(1);
      params.rotationMultiplier = +(Math.random() * 1.5 + 0.5).toFixed(2);
      params.baseHue = Math.floor(Math.random() * 360);
      params.achromaticStyle = Math.random() < 0.5 ? 'White on Black' : 'Black on White';
      params.seed = Math.floor(Math.random() * 10000000);

      const accentHues = [0, 25, 45, 130, 180, 280, 320, 345];
      const randHue = accentHues[Math.floor(Math.random() * accentHues.length)];
      params.accentColor = `hsl(${randHue}, 92%, 55%)`;
      params.neutralAccent = `hsl(${(randHue + 40) % 360}, 95%, 55%)`;

      applyColorSchemeDefaults(randomScheme);
      updateAllGUI(gui);
    }

    // Toggle GUI with "H" key
    window.addEventListener('keydown', (e) => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA')) {
        return;
      }
      if (e.key === 'h' || e.key === 'H') {
        if (gui._hidden || gui.domElement.style.display === 'none') {
          gui.show();
          gui.domElement.style.display = '';
        } else {
          gui.hide();
          gui.domElement.style.display = 'none';
        }
      }
    });

    // Zoom with Wheel
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.08 : 0.925;
      const newZoom = Math.max(0.1, Math.min(6.0, params.zoom * zoomFactor));

      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      const cx = WW / 2;
      const cy = WH / 2;

      const worldX = (mouseX - cx - params.panX) / params.zoom + cx;
      const worldY = (mouseY - cy - params.panY) / params.zoom + cy;

      params.zoom = newZoom;
      params.panX = mouseX - cx - (worldX - cx) * newZoom;
      params.panY = mouseY - cy - (worldY - cy) * newZoom;

      updateAllGUI(gui);
    }, { passive: false });

    // Drag scene & Click Detection
    let isDragging = false;
    let startPointerX = 0;
    let startPointerY = 0;
    let totalDragDistance = 0;

    canvas.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      isDragging = true;
      startPointerX = e.clientX;
      startPointerY = e.clientY;
      totalDragDistance = 0;
      canvas.setPointerCapture(e.pointerId);
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - startPointerX;
      const dy = e.clientY - startPointerY;
      startPointerX = e.clientX;
      startPointerY = e.clientY;
      totalDragDistance += Math.hypot(dx, dy);

      params.panX += dx;
      params.panY += dy;
      updateAllGUI(gui);
    });

    canvas.addEventListener('pointerup', (e) => {
      if (!isDragging) return;
      isDragging = false;
      try {
        canvas.releasePointerCapture(e.pointerId);
      } catch (err) {}

      if (totalDragDistance < 6) {
        if (params.clickToRandomize) {
          randomizeScene();
        }
      }
    });

    // Resize handler
    window.addEventListener('resize', () => {
      WW = canvas.width = window.innerWidth;
      WH = canvas.height = window.innerHeight;
    });

    // Main animation loop
    let lastTime = 0;
    let simTime = 0;

    function render(timestamp) {
      if (!lastTime) lastTime = timestamp;
      const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
      lastTime = timestamp;
      simTime += dt * params.speed * 5.0;

      const t = simTime;

      // Background rendering
      if (params.greenscreen) {
        ctx.fillStyle = '#00ff00';
      } else {
        ctx.fillStyle = params.backgroundColor;
      }
      ctx.fillRect(0, 0, WW, WH);

      ctx.save();
      // Apply Camera View Transform
      ctx.translate(WW / 2 + params.panX, WH / 2 + params.panY);
      ctx.scale(params.zoom, params.zoom);
      ctx.translate(-WW / 2, -WH / 2);

      ctx.lineWidth = params.lineWidth;
      ctx.lineCap = params.lineCap;

      const L = params.gridSize;
      const half = L / 2;

      // Determine visible bounding area in world coordinates
      const minWorldX = (0 - (WW / 2 + params.panX)) / params.zoom + WW / 2;
      const minWorldY = (0 - (WH / 2 + params.panY)) / params.zoom + WH / 2;
      const maxWorldX = (WW - (WW / 2 + params.panX)) / params.zoom + WW / 2;
      const maxWorldY = (WH - (WH / 2 + params.panY)) / params.zoom + WH / 2;

      const startX = Math.floor(minWorldX / L) * L - L;
      const endX = Math.ceil(maxWorldX / L) * L + L;
      const startY = Math.floor(minWorldY / L) * L - L;
      const endY = Math.ceil(maxWorldY / L) * L + L;

      // Performance governor: prevent extreme zoom-out lag
      const cols = Math.max(1, Math.round((endX - startX) / L));
      const rows = Math.max(1, Math.round((endY - startY) / L));
      let stepMultiplier = 1;
      if (cols * rows > 12000) {
        stepMultiplier = Math.ceil(Math.sqrt((cols * rows) / 12000));
      }
      const effectiveStep = L * stepMultiplier;

      for (let y = startY; y <= endY; y += effectiveStep) {
        const cy = y - WH / 2;
        for (let x = startX; x <= endX; x += effectiveStep) {
          const cx = x - WW / 2;
          const dist = Math.sqrt(cx * cx + cy * cy) * params.waveScale;
          const theta = Math.atan2(cy, cx);
          const s = Math.sin(Math.sin(theta * Math.PI / 180) + dist - t) + theta * params.waveFrequency + 1;
          const waveVal = Math.sin(t + s);
          const isRotating = waveVal > 0;

          const gx = Math.round(x / L);
          const gy = Math.round(y / L);
          const orientation = getCellOrientation(gx, gy, params.seed);

          const strokeColor = getLineColor(params.colorScheme, t, s, theta, dist, isRotating, waveVal);

          if (isRotating) {
            ctx.save();
            ctx.translate(x + half, y + half);
            ctx.strokeStyle = strokeColor;
            ctx.rotate((t + s) * params.rotationMultiplier);

            ctx.beginPath();
            if (orientation === 0) {
              ctx.moveTo(-half, -half);
              ctx.lineTo(half, half);
            } else {
              ctx.moveTo(half, -half);
              ctx.lineTo(-half, half);
            }
            ctx.stroke();
            ctx.restore();
          } else {
            ctx.strokeStyle = strokeColor;
            ctx.beginPath();
            if (orientation === 0) {
              ctx.moveTo(x, y);
              ctx.lineTo(x + L, y + L);
            } else {
              ctx.moveTo(x + L, y);
              ctx.lineTo(x, y + L);
            }
            ctx.stroke();
          }
        }
      }

      ctx.restore();

      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);
  </script>
</body>
</html>
