<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Vortex Angel</title>
	<style>
		body {
			margin: 0;
			padding: 0;
			overflow: hidden;
			background-color: #000000;
			user-select: none;
			-webkit-user-select: none;
		}

		canvas {
			display: block;
			width: 100vw;
			height: 100vh;
			touch-action: none;
		}
	</style>
	<script type="importmap">
		{
			"imports": {
				"three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
				"jsm/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/",
				"lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
			}
		}
	</script>
</head>
<body>
	<script type="module">
		import * as THREE from "three";
		import { OrbitControls } from "jsm/controls/OrbitControls.js";
		import { EffectComposer } from "jsm/postprocessing/EffectComposer.js";
		import { RenderPass } from "jsm/postprocessing/RenderPass.js";
		import { UnrealBloomPass } from "jsm/postprocessing/UnrealBloomPass.js";
		import { OBJLoader } from "jsm/loaders/OBJLoader.js";
		import GUI from "lil-gui";

		// --- Color Presets ---
		const COLOR_PRESETS = {
			"Celestial Cyan": {
				lineColor: "#66ccff",
				particleColor: "#3399ff",
				angelColor: "#d0d7de",
				bgColor: "#000000",
				lightColor: "#ffffff",
				ambientColor: "#404040",
				bloomStrength: 2.5,
				bloomRadius: 0.8,
				bloomThreshold: 0.2
			},
			"Solar Flare": {
				lineColor: "#ff9900",
				particleColor: "#ff4400",
				angelColor: "#e6b87d",
				bgColor: "#060200",
				lightColor: "#ffeedd",
				ambientColor: "#502810",
				bloomStrength: 2.7,
				bloomRadius: 0.85,
				bloomThreshold: 0.18
			},
			"Ethereal Amethyst": {
				lineColor: "#c752ff",
				particleColor: "#ff3df1",
				angelColor: "#e8dfff",
				bgColor: "#07000d",
				lightColor: "#f0d0ff",
				ambientColor: "#351545",
				bloomStrength: 2.6,
				bloomRadius: 0.8,
				bloomThreshold: 0.2
			},
			"Emerald Matrix": {
				lineColor: "#00ff88",
				particleColor: "#00ddaa",
				angelColor: "#b5f5dc",
				bgColor: "#000a04",
				lightColor: "#d0ffea",
				ambientColor: "#103820",
				bloomStrength: 2.4,
				bloomRadius: 0.75,
				bloomThreshold: 0.22
			},
			"Crimson Void": {
				lineColor: "#ff2255",
				particleColor: "#ff5533",
				angelColor: "#ffb4c0",
				bgColor: "#0a0003",
				lightColor: "#ffe0e5",
				ambientColor: "#45101a",
				bloomStrength: 2.8,
				bloomRadius: 0.9,
				bloomThreshold: 0.18
			}
		};

		const ANIMATION_PRESETS = [
			"Static",
			"Slow Orbit",
			"Floating Drift",
			"Cinematic Sweep",
			"Spiral Vortex"
		];

		// --- Application Parameters ---
		const params = {
			preset: "Celestial Cyan",
			animationPreset: "Static",
			greenscreen: false,
			clickToRandomize: true,
			speed: 1.0,
			dpr: Math.min(window.devicePixelRatio || 1, 2),
			
			// Colors
			lineColor: COLOR_PRESETS["Celestial Cyan"].lineColor,
			particleColor: COLOR_PRESETS["Celestial Cyan"].particleColor,
			angelColor: COLOR_PRESETS["Celestial Cyan"].angelColor,
			bgColor: COLOR_PRESETS["Celestial Cyan"].bgColor,
			lightColor: COLOR_PRESETS["Celestial Cyan"].lightColor,
			ambientColor: COLOR_PRESETS["Celestial Cyan"].ambientColor,

			// Geometry & Dynamics
			spiralRevolutions: 0.4,
			tornadoTiltX: 90,
			tornadoTiltY: 18,
			tornadoTiltZ: 0,
			fadeStart: 0.6,
			fadeDistance: 0.5,

			// Particles
			particleSize: 0.002,
			particleOpacity: 0.2,

			// Angel Material
			angelRoughness: 0.3,
			angelMetalness: 0.8,

			// Bloom
			bloomStrength: COLOR_PRESETS["Celestial Cyan"].bloomStrength,
			bloomRadius: COLOR_PRESETS["Celestial Cyan"].bloomRadius,
			bloomThreshold: COLOR_PRESETS["Celestial Cyan"].bloomThreshold,

			// Action triggers
			randomize: () => randomizeScene(),
			resetCamera: () => resetCameraView()
		};

		// --- Scene & Camera Setup ---
		const scene = new THREE.Scene();
		scene.background = new THREE.Color(params.bgColor);

		const camera = new THREE.PerspectiveCamera(
			75,
			window.innerWidth / window.innerHeight,
			0.1,
			1000
		);
		const defaultCamPos = new THREE.Vector3(1.2, -0.5, -0.1);
		const targetCenter = new THREE.Vector3(0.9, -0.6, 0);

		camera.position.copy(defaultCamPos);

		const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
		renderer.setSize(window.innerWidth, window.innerHeight);
		renderer.setPixelRatio(params.dpr);
		renderer.toneMapping = THREE.ReinhardToneMapping;
		renderer.localClippingEnabled = true;
		document.body.appendChild(renderer.domElement);

		const controls = new OrbitControls(camera, renderer.domElement);
		controls.enableDamping = true;
		controls.dampingFactor = 0.05;
		controls.enableZoom = true;
		controls.zoomSpeed = 1.0;
		controls.enablePan = true;
		controls.panSpeed = 1.0;
		controls.screenSpacePanning = true;
		controls.target.copy(targetCenter);
		controls.update();

		// --- Post Processing ---
		const renderScene = new RenderPass(scene, camera);
		const bloomPass = new UnrealBloomPass(
			new THREE.Vector2(window.innerWidth, window.innerHeight),
			params.bloomStrength,
			params.bloomRadius,
			params.bloomThreshold
		);

		const composer = new EffectComposer(renderer);
		composer.addPass(renderScene);
		composer.addPass(bloomPass);

		// --- Lighting ---
		const ambientLight = new THREE.AmbientLight(params.ambientColor);
		scene.add(ambientLight);

		const dirLight = new THREE.DirectionalLight(params.lightColor, 2);
		dirLight.position.set(0, 5, 5);
		scene.add(dirLight);

		// --- Clipping Planes ---
		const planeFront = new THREE.Plane(new THREE.Vector3(0, 0, 1), 1);
		const planeBack = new THREE.Plane(new THREE.Vector3(0, 0, -1), 1);
		const planeLeft = new THREE.Plane(new THREE.Vector3(1, 0, 0), 1);
		const planeRight = new THREE.Plane(new THREE.Vector3(-1, 0, 0), 1);
		const clippingPlanes = [planeFront, planeBack, planeLeft, planeRight];

		// --- Tornado Geometry & Lines ---
		const R = 0.9;
		const r = 0.8;

		const tornadoGroup = new THREE.Group();
		scene.add(tornadoGroup);

		function getTorusPoint(u, v, target, rOffset = 0) {
			const effectiveR = r + rOffset;
			const x = (R + effectiveR * Math.cos(v)) * Math.cos(u);
			const y = (R + effectiveR * Math.cos(v)) * Math.sin(u);
			const z = effectiveR * Math.sin(v);
			target.set(x, y, z);
		}

		const lineVertexShader = `
			varying vec3 vPosition;
			varying float vDistanceFromCenter;

			void main() {
				vPosition = position;
				float distanceFromCenter = sqrt(position.x * position.x + position.z * position.z);
				vDistanceFromCenter = distanceFromCenter;
				gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
			}
		`;

		const lineFragmentShader = `
			uniform vec3 uColor;
			uniform float uFadeDistance;
			uniform float uFadeStart;

			varying vec3 vPosition;
			varying float vDistanceFromCenter;

			void main() {
				float maxDistance = 0.9;
				float fadeStart = uFadeStart;
				float fadeEnd = 0.9;

				float normalizedDistance = vDistanceFromCenter / maxDistance;

				float fade = 1.0;
				if (normalizedDistance > fadeStart) {
					fade = 1.0 - smoothstep(fadeStart, fadeEnd, normalizedDistance);
				}

				float zFade = 1.0;
				if (abs(vPosition.z) > 0.5) {
					zFade = 1.0 - smoothstep(0.5, 0.9, abs(vPosition.z));
				}

				float xFade = 1.0;
				if (abs(vPosition.x) > 0.5) {
					xFade = 1.0 - smoothstep(0.5, 0.9, abs(vPosition.x));
				}

				float finalAlpha = fade * zFade * xFade;
				gl_FragColor = vec4(uColor, finalAlpha);
			}
		`;

		const lineCount = 90;
		const segmentsPerLine = 2000;
		const linesData = [];

		const lineMaterial = new THREE.ShaderMaterial({
			vertexShader: lineVertexShader,
			fragmentShader: lineFragmentShader,
			uniforms: {
				uColor: { value: new THREE.Color(params.lineColor) },
				uFadeDistance: { value: params.fadeDistance },
				uFadeStart: { value: params.fadeStart },
			},
			transparent: true,
			blending: THREE.AdditiveBlending,
			clippingPlanes: clippingPlanes,
			depthWrite: false,
		});

		for (let i = 0; i < lineCount; i++) {
			const geometry = new THREE.BufferGeometry();
			const positions = new Float32Array(segmentsPerLine * 3);
			geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));

			const phaseOffset = Math.random() * Math.PI * 2;
			const speed = 0.001 + Math.random() * 0.001;
			const length = Math.PI * 3 + Math.random() * Math.PI;

			const line = new THREE.Line(geometry, lineMaterial);
			tornadoGroup.add(line);

			linesData.push({
				line: line,
				positions: positions,
				phaseOffset: phaseOffset,
				speed: speed,
				length: length,
				uOffset: Math.random() * Math.PI * 2,
				rOffset: (Math.random() - 0.2) * 0.1,
			});
		}

		// --- Particles ---
		const particleCount = 10000;
		const particlesGeometry = new THREE.BufferGeometry();
		const particlePositions = new Float32Array(particleCount * 3);
		particlesGeometry.setAttribute(
			"position",
			new THREE.BufferAttribute(particlePositions, 3)
		);

		const particlesMaterial = new THREE.PointsMaterial({
			color: new THREE.Color(params.particleColor),
			size: params.particleSize,
			transparent: true,
			opacity: params.particleOpacity,
			blending: THREE.AdditiveBlending,
			clippingPlanes: clippingPlanes,
		});

		const particles = new THREE.Points(particlesGeometry, particlesMaterial);
		tornadoGroup.add(particles);

		const particlesData = [];
		for (let i = 0; i < particleCount; i++) {
			particlesData.push({
				uOffset: Math.random() * Math.PI * 2,
				phaseOffset: Math.random() * Math.PI * 2,
				speed: 0.0001 - Math.random() * 0.001,
				radiusOffset: (Math.random() - 0.1) * 0.2,
			});
		}

		function updateTornadoRotation() {
			tornadoGroup.rotation.x = THREE.MathUtils.degToRad(params.tornadoTiltX);
			tornadoGroup.rotation.y = THREE.MathUtils.degToRad(params.tornadoTiltY);
			tornadoGroup.rotation.z = THREE.MathUtils.degToRad(params.tornadoTiltZ);
		}
		updateTornadoRotation();

		// --- Angel Model Loader ---
		let angelModel = null;
		const loader = new OBJLoader();
		loader.load(
			"https://cdn.jsdelivr.net/gh/danielyl123/person/person.obj",
			function (object) {
				const box = new THREE.Box3().setFromObject(object);
				const center = box.getCenter(new THREE.Vector3());
				object.position.sub(center);

				const size = box.getSize(new THREE.Vector3());
				const maxDim = Math.max(size.x, size.y, size.z);

				const scale = 0.13 / maxDim;
				object.scale.set(scale, scale, scale);

				object.position.copy(targetCenter);
				object.rotation.y = Math.PI / -2;

				object.traverse(function (child) {
					if (child.isMesh) {
						child.material = new THREE.MeshStandardMaterial({
							color: new THREE.Color(params.angelColor),
							roughness: params.angelRoughness,
							metalness: params.angelMetalness,
							side: THREE.DoubleSide,
						});
					}
				});

				scene.add(object);
				angelModel = object;
				applyColors();
			},
			undefined,
			function (error) {
				console.error("Error loading angel:", error);
			}
		);

		// --- Color & Visual Update Functions ---
		function updateBackground() {
			if (params.greenscreen) {
				scene.background.set("#00ff00");
				document.body.style.backgroundColor = "#00ff00";
			} else {
				scene.background.set(params.bgColor);
				document.body.style.backgroundColor = params.bgColor;
			}
		}

		function applyColors() {
			updateBackground();

			lineMaterial.uniforms.uColor.value.set(params.lineColor);
			lineMaterial.uniforms.uFadeStart.value = params.fadeStart;
			lineMaterial.uniforms.uFadeDistance.value = params.fadeDistance;

			particlesMaterial.color.set(params.particleColor);
			particlesMaterial.size = params.particleSize;
			particlesMaterial.opacity = params.particleOpacity;

			ambientLight.color.set(params.ambientColor);
			dirLight.color.set(params.lightColor);

			bloomPass.strength = params.bloomStrength;
			bloomPass.radius = params.bloomRadius;
			bloomPass.threshold = params.bloomThreshold;

			if (angelModel) {
				angelModel.traverse(function (child) {
					if (child.isMesh && child.material) {
						child.material.color.set(params.angelColor);
						child.material.roughness = params.angelRoughness;
						child.material.metalness = params.angelMetalness;
					}
				});
			}
		}

		function loadColorPreset(presetName) {
			const p = COLOR_PRESETS[presetName];
			if (!p) return;

			params.lineColor = p.lineColor;
			params.particleColor = p.particleColor;
			params.angelColor = p.angelColor;
			params.bgColor = p.bgColor;
			params.lightColor = p.lightColor;
			params.ambientColor = p.ambientColor;
			params.bloomStrength = p.bloomStrength;
			params.bloomRadius = p.bloomRadius;
			params.bloomThreshold = p.bloomThreshold;

			applyColors();
			refreshGUI();
		}

		function resetCameraView() {
			camera.position.copy(defaultCamPos);
			controls.target.copy(targetCenter);
			controls.update();
		}

		// --- Procedural Randomizer (Triggered on Scene Click) ---
		function randomizeScene() {
			const baseHue = Math.random();
			const compHue = (baseHue + 0.15 + Math.random() * 0.3) % 1.0;
			const angelHue = (baseHue + 0.5) % 1.0;

			const colLine = new THREE.Color().setHSL(baseHue, 0.85 + Math.random() * 0.15, 0.55 + Math.random() * 0.15);
			const colPart = new THREE.Color().setHSL(compHue, 0.9, 0.55);
			const colAngel = new THREE.Color().setHSL(angelHue, 0.25, 0.85);
			const colLight = new THREE.Color().setHSL(baseHue, 0.3, 0.95);
			const colAmbient = new THREE.Color().setHSL(baseHue, 0.7, 0.15);
			const colBg = new THREE.Color().setHSL(baseHue, 0.8, 0.02);

			params.lineColor = "#" + colLine.getHexString();
			params.particleColor = "#" + colPart.getHexString();
			params.angelColor = "#" + colAngel.getHexString();
			params.bgColor = "#" + colBg.getHexString();
			params.lightColor = "#" + colLight.getHexString();
			params.ambientColor = "#" + colAmbient.getHexString();

			// Geometric & Dynamic variations
			params.spiralRevolutions = 0.25 + Math.random() * 0.65;
			params.tornadoTiltX = 65 + Math.random() * 50;
			params.tornadoTiltY = -35 + Math.random() * 70;
			params.tornadoTiltZ = -20 + Math.random() * 40;
			params.speed = 0.6 + Math.random() * 1.4;

			params.bloomStrength = 1.6 + Math.random() * 1.8;
			params.bloomRadius = 0.5 + Math.random() * 0.5;
			params.bloomThreshold = 0.12 + Math.random() * 0.16;
			params.fadeStart = 0.45 + Math.random() * 0.35;
			params.particleOpacity = 0.15 + Math.random() * 0.3;
			params.particleSize = 0.0015 + Math.random() * 0.0025;

			// Re-roll individual line speeds & lengths
			linesData.forEach(d => {
				d.speed = (0.0008 + Math.random() * 0.0015) * (Math.random() > 0.1 ? 1 : -1);
				d.length = Math.PI * 2.5 + Math.random() * Math.PI * 2;
				d.rOffset = (Math.random() - 0.2) * 0.12;
			});

			updateTornadoRotation();
			applyColors();
			refreshGUI();
		}

		// --- Click vs Drag Detection for Scene Randomization ---
		let pointerDownPos = { x: 0, y: 0 };
		let pointerDownTime = 0;

		window.addEventListener("pointerdown", (e) => {
			pointerDownPos.x = e.clientX;
			pointerDownPos.y = e.clientY;
			pointerDownTime = performance.now();
		});

		window.addEventListener("pointerup", (e) => {
			if (!params.clickToRandomize) return;
			// Ignore clicks on lil-gui control panel
			if (gui && gui.domElement && gui.domElement.contains(e.target)) return;

			const dx = e.clientX - pointerDownPos.x;
			const dy = e.clientY - pointerDownPos.y;
			const dist = Math.hypot(dx, dy);
			const dt = performance.now() - pointerDownTime;

			if (dist < 6 && dt < 400) {
				randomizeScene();
			}
		});

		// --- GUI Setup (lil-gui) ---
		const gui = new GUI({ title: "Scene Controls" });

		const presetFolder = gui.addFolder("Presets & Themes");
		presetFolder.add(params, "preset", Object.keys(COLOR_PRESETS)).name("Color Preset").onChange((val) => {
			loadColorPreset(val);
		});
		presetFolder.add(params, "animationPreset", ANIMATION_PRESETS).name("Animation");
		presetFolder.add(params, "greenscreen").name("Greenscreen (#00ff00)").onChange(updateBackground);
		presetFolder.add(params, "clickToRandomize").name("Click to Randomize");
		presetFolder.add(params, "randomize").name("🎲 Randomize Theme");

		const colorFolder = gui.addFolder("Colors");
		colorFolder.addColor(params, "lineColor").name("Lines").onChange(applyColors);
		colorFolder.addColor(params, "particleColor").name("Particles").onChange(applyColors);
		colorFolder.addColor(params, "angelColor").name("Angel Model").onChange(applyColors);
		colorFolder.addColor(params, "bgColor").name("Background").onChange(updateBackground);
		colorFolder.addColor(params, "lightColor").name("Direct Light").onChange(applyColors);
		colorFolder.addColor(params, "ambientColor").name("Ambient Light").onChange(applyColors);

		const motionFolder = gui.addFolder("Motion & Geometry");
		motionFolder.add(params, "speed", 0.0, 4.0, 0.05).name("Animation Speed");
		motionFolder.add(params, "spiralRevolutions", 0.1, 1.5, 0.01).name("Spiral Revs");
		motionFolder.add(params, "tornadoTiltX", 0, 180, 1).name("Tilt X").onChange(updateTornadoRotation);
		motionFolder.add(params, "tornadoTiltY", -90, 90, 1).name("Tilt Y").onChange(updateTornadoRotation);
		motionFolder.add(params, "tornadoTiltZ", -180, 180, 1).name("Tilt Z").onChange(updateTornadoRotation);

		const effectsFolder = gui.addFolder("Visual Effects & Bloom");
		effectsFolder.add(params, "bloomStrength", 0.0, 5.0, 0.05).name("Bloom Strength").onChange(applyColors);
		effectsFolder.add(params, "bloomRadius", 0.0, 2.0, 0.01).name("Bloom Radius").onChange(applyColors);
		effectsFolder.add(params, "bloomThreshold", 0.0, 1.0, 0.01).name("Bloom Threshold").onChange(applyColors);
		effectsFolder.add(params, "fadeStart", 0.1, 0.9, 0.01).name("Fade Start").onChange(applyColors);
		effectsFolder.add(params, "particleSize", 0.0005, 0.01, 0.0005).name("Particle Size").onChange(applyColors);
		effectsFolder.add(params, "particleOpacity", 0.05, 1.0, 0.01).name("Particle Opacity").onChange(applyColors);

		const systemFolder = gui.addFolder("Display & System");
		systemFolder.add(params, "dpr", 0.5, 3.0, 0.1).name("Pixel Ratio (DPR)").onChange((val) => {
			renderer.setPixelRatio(val);
			composer.setPixelRatio(val);
			bloomPass.setSize(window.innerWidth * val, window.innerHeight * val);
		});
		systemFolder.add(params, "resetCamera").name("Reset Camera");

		function refreshGUI() {
			function traverse(folder) {
				if (folder.controllers) {
					folder.controllers.forEach(c => c.updateDisplay && c.updateDisplay());
				}
				if (folder.folders) {
					folder.folders.forEach(sub => traverse(sub));
				}
			}
			traverse(gui);
		}

		// --- Toggle GUI Visibility with 'H' Key ---
		window.addEventListener("keydown", (e) => {
			if (e.key === "h" || e.key === "H" || e.code === "KeyH") {
				if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT" || e.target.tagName === "TEXTAREA") return;
				if (typeof gui.show === "function" && typeof gui.hide === "function") {
					if (gui._hidden) {
						gui.show();
					} else {
						gui.hide();
					}
				} else {
					gui.domElement.style.display = gui.domElement.style.display === "none" ? "" : "none";
				}
			}
		});

		// --- Animation Loop ---
		let lastTime = performance.now();
		let accumulatedTime = 0;

		function animate(currentTime = performance.now()) {
			requestAnimationFrame(animate);

			const delta = Math.min((currentTime - lastTime) * 0.001, 0.1);
			lastTime = currentTime;
			accumulatedTime += delta * params.speed;
			const time = accumulatedTime;

			// Handle Presetupped Animations (Camera Modes)
			if (params.animationPreset === "Slow Orbit") {
				const angle = time * 0.2;
				const radius = 1.25;
				camera.position.x = targetCenter.x + Math.cos(angle) * radius;
				camera.position.z = targetCenter.z + Math.sin(angle) * radius;
				camera.position.y = targetCenter.y + 0.15 + Math.sin(time * 0.2) * 0.15;
				camera.lookAt(targetCenter);
				controls.target.copy(targetCenter);
			} else if (params.animationPreset === "Floating Drift") {
				camera.position.x = targetCenter.x + Math.sin(time * 0.25) * 0.6;
				camera.position.z = targetCenter.z + Math.cos(time * 0.18) * 0.7 - 0.1;
				camera.position.y = targetCenter.y + 0.1 + Math.sin(time * 0.3) * 0.25;
				camera.lookAt(targetCenter);
				controls.target.copy(targetCenter);
			} else if (params.animationPreset === "Cinematic Sweep") {
				const progress = (Math.sin(time * 0.2) + 1.0) * 0.5;
				camera.position.x = THREE.MathUtils.lerp(targetCenter.x + 0.6, targetCenter.x - 0.7, progress);
				camera.position.z = THREE.MathUtils.lerp(targetCenter.z - 0.7, targetCenter.z + 0.7, progress);
				camera.position.y = THREE.MathUtils.lerp(targetCenter.y - 0.2, targetCenter.y + 0.4, progress);
				camera.lookAt(targetCenter);
				controls.target.copy(targetCenter);
			} else if (params.animationPreset === "Spiral Vortex") {
				const spiralAngle = time * 0.25;
				const spiralHeight = targetCenter.y + Math.sin(time * 0.2) * 0.45;
				const spiralRadius = 0.85 + Math.cos(time * 0.15) * 0.35;
				camera.position.x = targetCenter.x + Math.cos(spiralAngle) * spiralRadius;
				camera.position.z = targetCenter.z + Math.sin(spiralAngle) * spiralRadius;
				camera.position.y = spiralHeight;
				camera.lookAt(targetCenter);
				controls.target.copy(targetCenter);
			}

			// Update Lines Positions
			linesData.forEach((data) => {
				data.uOffset += data.speed;

				const positions = data.positions;
				const tempVec = new THREE.Vector3();

				for (let j = 0; j < segmentsPerLine; j++) {
					const t = j / (segmentsPerLine - 1);
					const currentU = data.uOffset - t * data.length;
					const currentV = currentU * params.spiralRevolutions + data.phaseOffset + time * 0.4;

					getTorusPoint(currentU, currentV, tempVec, data.rOffset);

					positions[j * 3] = tempVec.x;
					positions[j * 3 + 1] = tempVec.y;
					positions[j * 3 + 2] = tempVec.z;
				}

				data.line.geometry.attributes.position.needsUpdate = true;
			});

			// Update Particles Positions
			const pPositions = particlesGeometry.attributes.position.array;
			particlesData.forEach((data, i) => {
				data.uOffset += data.speed;

				const currentU = data.uOffset;
				const currentV = currentU * params.spiralRevolutions + data.phaseOffset + time * 0.2;

				const effectiveR = r + data.radiusOffset;
				const x = (R + effectiveR * Math.cos(currentV)) * Math.cos(currentU);
				const y = (R + effectiveR * Math.cos(currentV)) * Math.sin(currentU);
				const z = effectiveR * Math.sin(currentV);

				pPositions[i * 3] = x;
				pPositions[i * 3 + 1] = y;
				pPositions[i * 3 + 2] = z;
			});
			particlesGeometry.attributes.position.needsUpdate = true;

			// Float angel model subtly
			if (angelModel) {
				angelModel.position.y = targetCenter.y + 0.05 + Math.sin(time * 2) * 0.01;
			}

			controls.update();
			composer.render();
		}

		animate();

		// --- Resize Handling ---
		window.addEventListener("resize", () => {
			camera.aspect = window.innerWidth / window.innerHeight;
			camera.updateProjectionMatrix();
			renderer.setSize(window.innerWidth, window.innerHeight);
			composer.setSize(window.innerWidth, window.innerHeight);
			bloomPass.setSize(window.innerWidth * params.dpr, window.innerHeight * params.dpr);
		});
	</script>
</body>
</html>
