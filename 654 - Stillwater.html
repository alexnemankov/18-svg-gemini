<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09142d">
  <meta name="description" content="An endless, slowly breathing sculpture of liquid metal, blue silk and sunset reflections.">
  <link rel="icon" href="data:,">
  <title>Stillwater - Liquid Silk</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #09142d; }
    body { background: linear-gradient(#09142d, #30496d); }
    /* An identity filter isolates canvas compositing beneath floating GUI panels. */
    canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; filter: opacity(1); }
  </style>
</head>
<body>
  <canvas aria-label="Slowly flowing liquid silk with steel-blue, violet and sunset-orange reflections"></canvas>
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

    // Eleven color families and eight requested palettes. Invert supplies both
    // achromatic orientations while keeping the selector at nineteen schemes.
    const schemes = {
      'Original': { colors: ['ffad74','ff783b','7584a7','8e608a','142544','100a10'], background: '09142d', bottom: '30496d' },
      'Monochromatic': { colors: ['e1efff','90b5de','6088b2','365679','182c48','050d1a'], background: '071121' },
      'Analogous': { colors: ['c7e8ec','64b8c1','567dbc','715c9e','22365f','090e21'], background: '0b1426' },
      'Complementary': { colors: ['ffe3c2','ed9254','79b6cc','417fa5','153a56','080f1d'], background: '081522' },
      'Split-complementary': { colors: ['f8dbad','e0a456','7a9ac5','af668d','34305e','110c25'], background: '100e24' },
      'Triadic': { colors: ['f5db9c','d79248','519f9b','ae5b84','32395b','100e20'], background: '0e1324' },
      'Tetradic': { colors: ['f0d5af','dc9064','67a99c','9b78b8','2d4265','110e22'], background: '0c1626' },
      'Double split-complementary': { colors: ['efd5a9','d68c69','62b0a7','ad72a2','546197','15172f'], background: '0c1424' },
      'Achromatic': { colors: ['ffffff','d8d8d8','a2a2a2','686868','242424','000000'], background: 'ffffff', bottom: 'ffffff', mono: true },
      'Achromatic + Accent': { colors: ['ffffff','d8d8d8','a2a2a2','686868','242424','000000'], background: 'ffffff', bottom: 'ffffff', mono: true, accent: 'ff263b', amount: 0.85 },
      'Neutral + accent': { colors: ['e9dfcf','b7a995','8f8578','655c54','302b28','100e0d'], background: 'ded8cd', bottom: 'beb3a1', accent: 'ff6936', amount: 0.8 },
      'Amber / Rust': { colors: ['F6AA1C','BC3908','941B0C','F6AA1C','220901'], background: '160702' },
      'Turquoise / Ink': { colors: ['63D1CF','5BC0BE','4BAD9E','4BAD9E','0B132B','000000'], background: '0b132b' },
      'Orchid / Mauve': { colors: ['AA60C8','D69ADE','C9A3C6','CFB5C2','0D001D','120A12'], background: '0d001d' },
      'Saffron / Teal': { colors: ['FEF1BE','FFBA00','008189','00474D','061210'], background: '061210' },
      'Lime / Emerald': { colors: ['D4FFB0','7FFF00','00B894','0A3322','05140A'], background: '05140a' },
      'Tangerine / Plum': { colors: ['FFE8CC','FF8C00','C7501A','3D1050','0E0618'], background: '0e0618' },
      'Lavender / Indigo': { colors: ['E8E0FF','B38FFF','6A3DE8','1A1250','090612'], background: '090612' },
      'Cyan / Fuchsia': { colors: ['E0FBFF','00F0FF','D40078','1E0A3D','05020F'], background: '05020f' }
    };
    const animations = ['Liquid breathing','Silk drift','Ripple tide','Basin pulse','Light sweep','Gentle orbit','Pendulum orbit','Static'];
    const config = {
      scheme: 'Original', invert: false, greenscreen: false,
      color1: '#ffad74', color2: '#ff783b', color3: '#7584a7',
      color4: '#8e608a', color5: '#142544', color6: '#100a10',
      accentColor: '#ff263b', accentAmount: 0, paletteBlend: 0,
      background: '#09142d', backgroundBottom: '#30496d', gradient: true,
      animation: 'Liquid breathing', speed: 1, motionStrength: 1,
      rippleDensity: 1, waveHeight: 1, basinDepth: 1, basinWidth: 1,
      warp: 1, seed: 0, randomizeOnClick: true,
      pixelRatio: Math.min(devicePixelRatio || 1, 1.75), zoom: 1, yaw: 0, pitch: 18.1
    };

    const canvas = document.querySelector('canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: 'high-performance' });
    renderer.setPixelRatio(config.pixelRatio);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.02;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 150);
    const uniforms = {
      uTime: { value: 0 },
      uAnimationMode: { value: 0 }, uMotionStrength: { value: 1 },
      uRippleDensity: { value: 1 }, uWaveHeight: { value: 1 },
      uBasinDepth: { value: 1 }, uBasinWidth: { value: 1 },
      uWarp: { value: 1 }, uSeed: { value: 0 },
      uPalette: { value: Array.from({length: 6}, () => new THREE.Color()) },
      uPaletteBlend: { value: 0 }, uInvert: { value: 0 },
      uAccent: { value: new THREE.Color() }, uAccentAmount: { value: 0 },
      uBackground: { value: new THREE.Color() },
      uBackgroundBottom: { value: new THREE.Color() },
      uGreenscreen: { value: 0 },
      uResolution: { value: new THREE.Vector2() },
      uCool: { value: new THREE.Color('#7584a7') },
      uWarm: { value: new THREE.Color('#ff783b') },
      uViolet: { value: new THREE.Color('#8e608a') },
      uLightDirection: { value: new THREE.Vector3(-0.65, 0.3, -0.7).normalize() }
    };

    // A separate fullscreen sky has no horizon, texture seams, or scene objects.
    const skyMaterial = new THREE.ShaderMaterial({
      uniforms, depthWrite: false, depthTest: false,
      vertexShader: `
        varying vec2 vUv;
        void main() { vUv = uv; gl_Position = vec4(position.xy, 1.0, 1.0); }
      `,
      fragmentShader: `
        varying vec2 vUv;
        uniform vec3 uBackground;
        uniform vec3 uBackgroundBottom;
        uniform float uGreenscreen;
        void main() {
          vec3 color = mix(uBackground, uBackgroundBottom, pow(1.0-vUv.y,0.8));
          gl_FragColor = vec4(color,1.0);
          #include <colorspace_fragment>
          if (uGreenscreen > 0.5) gl_FragColor = vec4(0.0,1.0,0.0,1.0);
        }
      `
    });
    const skyGeometry = new THREE.PlaneGeometry(2, 2);
    const sky = new THREE.Mesh(skyGeometry, skyMaterial);
    sky.frustumCulled = false;
    sky.renderOrder = -1;
    scene.add(sky);

    const waveGLSL = `
        uniform float uAnimationMode;
        uniform float uMotionStrength;
        uniform float uRippleDensity;
        uniform float uWaveHeight;
        uniform float uBasinDepth;
        uniform float uBasinWidth;
        uniform float uWarp;
        uniform float uSeed;
        vec2 basinCenter(float t) {
          return vec2(1.7+0.12*sin(t)*uMotionStrength,-5.8)
            + vec2(sin(uSeed)*0.8,(cos(uSeed)-1.0)*0.4);
        }

        // Every temporal term is an integer harmonic of the same 120-second
        // period. Geometry, normals, and lighting meet continuously at the seam.
        float ripplePhase(vec2 p) {
          float t = mod(uTime, 120.0) * TAU / 120.0;
          vec2 q = (p-basinCenter(t))/vec2(uBasinWidth,1.0);
          float flow = p.y + 2.0*uWarp*exp(-q.x*q.x/30.0-q.y*q.y/34.0);
          flow += 0.22*sin(p.x*0.39+0.13*sin(t));
          flow += 0.11*sin(p.x*0.81-p.y*0.13+0.15*cos(t));
          float drift = uAnimationMode == 1.0 ? 1.0*sin(t) : 0.0;
          drift += uAnimationMode == 2.0 ? 0.65*sin(2.0*t) : 0.0;
          return (flow*8.5-0.065*flow*flow)*uRippleDensity + drift*uMotionStrength + uSeed*0.7 + 0.09*p.x*p.x + 1.1*sin(p.x*0.62+p.y*0.38) + 0.55*sin(p.x*1.05-p.y*0.57)
            + 0.4*sin(p.x*0.45+flow*0.5)+(0.7*sin(t)+0.22*cos(2.0*t))*uMotionStrength;
        }
        float heightAt(vec2 p) {
          float t = mod(uTime, 120.0) * TAU / 120.0;
          vec2 center = basinCenter(t);
          vec2 q = (p-center)/vec2(uBasinWidth,1.0);
          float breath = 1.0 + (uAnimationMode == 3.0 ? 0.12 : 0.025)*sin(t)*uMotionStrength;
          float ellipse = q.x*q.x / (23.0*breath) + q.y*q.y / 11.0;
          float bowl = exp(-ellipse * 1.7);
          float shoulder = exp(-q.x*q.x / 86.0 - q.y*q.y / 32.0);
          float hill = 1.8 * shoulder - 1.62 * bowl * uBasinDepth;
          hill += 0.38 * sin(p.x * 0.23 + p.y * 0.12 + 0.16 * sin(t));
          hill += 0.18 * sin(p.y * 0.38 - p.x * 0.15 + 0.23 * cos(t));

          // Elliptical domain warping bends the parallel folds around the bowl.
          float warp = 2.0 * uWarp * exp(-q.x*q.x / 30.0 - q.y*q.y / 34.0);
          float flow = p.y + warp + 0.22 * sin(p.x * 0.39 + 0.13 * sin(t));
          flow += 0.11 * sin(p.x * 0.81 - p.y * 0.13 + 0.15 * cos(t));
          float phase = flow * 8.5 - 0.065 * flow * flow;
          phase += 0.4 * sin(p.x * 0.45 + flow * 0.5);
          phase = ripplePhase(p);
          float amplitude = mix(0.032, 0.008, smoothstep(0.0, 1.0, bowl));
          amplitude *= 0.75 + 0.25 * sin(p.x * 0.35 + p.y * 0.18);
          float folds = sin(phase) + 0.23*sin(phase*2.0 + 0.4);
          folds += 0.13 * sin(flow * 23.0 + p.x * 0.37 + 0.3*sin(2.0*t));
          float distant = 1.0 - smoothstep(10.0, 32.0, -p.y);
          return hill*uWaveHeight - 0.055*p.x + amplitude*folds*distant*uWaveHeight;
        }
    `;

    const surfaceMaterial = new THREE.ShaderMaterial({
      uniforms,
      vertexShader: `
        uniform float uTime;
        varying vec3 vWorld;
        varying vec2 vSurface;
        const float TAU = 6.28318530718;
        ${waveGLSL}
        void main() {
          vec2 p = position.xz;
          float h = heightAt(p);
          vWorld = vec3(p.x, h, p.y);
          vSurface = p;
          gl_Position = projectionMatrix * viewMatrix * vec4(vWorld, 1.0);
        }
      `,
      fragmentShader: `
        uniform float uTime;
        uniform vec2 uResolution;
        uniform vec3 uPalette[6];
        uniform float uPaletteBlend;
        uniform float uInvert;
        uniform vec3 uAccent;
        uniform float uAccentAmount;
        uniform vec3 uBackground;
        uniform vec3 uBackgroundBottom;
        uniform float uGreenscreen;
        uniform vec3 uCool;
        uniform vec3 uWarm;
        uniform vec3 uViolet;
        uniform vec3 uLightDirection;
        varying vec3 vWorld;
        varying vec2 vSurface;
        const float TAU = 6.28318530718;
        ${waveGLSL}
        float gaussian(float x, float width) { return exp(-x*x / width); }

        // An analytic studio environment: broad blue overhead panels, a warm
        // strip off to the left, and a dim violet panel on the right. Sampling
        // it with reflected eye rays makes every highlight follow the folds.
        vec3 environment(vec3 r, vec2 p, float t) {
          float elevation = r.y;
          float sky = smoothstep(0.30, 0.92, elevation);
          vec3 color = mix(vec3(0.007,0.003,0.007), vec3(0.085,0.15,0.27), sky);
          float cool = gaussian(elevation - 0.55, 0.09);
          cool *= 0.55 + 0.45 * (1.0-smoothstep(-0.8,0.6,r.x));
          color += uCool * cool * 0.42;
          color *= 1.0 - 0.94*smoothstep(-4.0,5.0,p.x);
          float warm = gaussian(elevation - 0.055 + 0.025*sin(t), 0.055);
          float left = gaussian(r.x + 0.32, 0.45);
          left *= 1.0 - smoothstep(-2.0, 6.0, p.x);
          float position = 1.0 - smoothstep(-6.0, 5.0, p.x);
          color += uWarm * warm * left * (1.4 + position * 2.3);
          color += vec3(1.0,0.38,0.12) * gaussian(elevation - 0.015, 0.0025) * left * position * 0.25;
          float violet = gaussian(elevation - 0.24, 0.07) * smoothstep(-3.0, 7.0, p.x);
          color += uViolet * violet * 0.32;
          return color;
        }
        void main() {
          float t = mod(uTime, 120.0) * TAU / 120.0;
          // Evaluate the continuous height field per pixel so fine reflections
          // stay perfectly smooth even between the dense geometry vertices.
          float e = 0.008;
          float dx = heightAt(vSurface+vec2(e,0.0))-heightAt(vSurface-vec2(e,0.0));
          float dz = heightAt(vSurface+vec2(0.0,e))-heightAt(vSurface-vec2(0.0,e));
          vec3 n = normalize(vec3(-dx,2.0*e,-dz));
          vec3 eye = normalize(cameraPosition - vWorld);
          vec3 reflection = reflect(-eye, n);
          vec3 color = environment(reflection, vSurface, t);
          // Broad, roughened strip-light lobes keep the reflected bands soft
          // at macro scale, with amber on the left and violet on the right.
          float phase = ripplePhase(vSurface);
          // Screen-space derivatives soften subpixel bands at any DPR or zoom.
          float attenuation = 1.0-smoothstep(0.4,3.14,fwidth(phase));
          float slope = (cos(phase)+0.22*cos(phase*2.0+0.4))*attenuation;
          float ribbon = smoothstep(-0.62,0.78,slope);
          float leftBlue = 1.0-smoothstep(-4.0,5.0,vSurface.x);
          vec3 silk = mix(vec3(0.004,0.002,0.004),
            mix(vec3(0.075,0.025,0.085),vec3(0.21,0.30,0.42),leftBlue),ribbon);
          float warmCenter = (uAnimationMode == 4.0 ? 0.8+1.4*sin(t)*uMotionStrength : 0.8)-0.40*(vSurface.y+5.8)+0.35*sin(vSurface.y*0.3);
          float warmPanel = gaussian(vSurface.x-warmCenter,1.9);
          float warmRibbon = gaussian(slope+0.25,0.17);
          silk += vec3(0.018,0.033,0.059)*leftBlue;
          silk += uWarm*warmPanel*(warmRibbon*1.4+0.035);
          silk += vec3(0.004,0.002,0.003);
          silk += uViolet*gaussian(slope-0.25,0.3)*(1.0-leftBlue)*0.12;
          color = mix(silk,color,0.12);
          float fresnel = pow(1.0 - max(dot(n, eye), 0.0), 5.0);
          color *= 0.58 + 0.42 * fresnel;
          // Wide softbox sheen, deliberately restrained to preserve black valleys.
          vec3 halfVector = normalize(eye + uLightDirection);
          color += uCool * pow(max(dot(n, halfVector), 0.0), 70.0) * 0.055;
          vec2 q = (vSurface-basinCenter(t))/vec2(uBasinWidth,1.0);
          float basin = exp(-q.x*q.x / 15.0 - q.y*q.y / 8.5);
          color *= 1.0 - 0.97 * smoothstep(0.14, 0.83, basin);
          color += vec3(0.0025, 0.0012, 0.002);
          // Recolor the continuous reflected luminance with six editable stops.
          // Original retains its studio shading until a color is customized.
          float luminance = dot(color,vec3(0.2126,0.7152,0.0722));
          float band = clamp(pow(luminance/(luminance+0.16),0.7)*5.0,0.0,5.0);
          vec3 mapped = mix(uPalette[5],uPalette[4],clamp(band,0.0,1.0));
          mapped = mix(mapped,uPalette[3],clamp(band-1.0,0.0,1.0));
          mapped = mix(mapped,uPalette[2],clamp(band-2.0,0.0,1.0));
          mapped = mix(mapped,uPalette[1],clamp(band-3.0,0.0,1.0));
          mapped = mix(mapped,uPalette[0],clamp(band-4.0,0.0,1.0));
          color = mix(color,mapped,uPaletteBlend);
          if (uInvert > 0.5) color = vec3(1.0)-clamp(color,0.0,1.0);
          // Apply the accent after inversion, keeping red accents red.
          color = mix(color,uAccent,clamp(warmPanel*warmRibbon*uAccentAmount,0.0,1.0));
          vec2 screen = gl_FragCoord.xy / uResolution;
          color *= 1.0-0.16*dot(screen-0.5,screen-0.5);
          gl_FragColor = vec4(color,1.0);
          #include <tonemapping_fragment>
          #include <colorspace_fragment>
          // Composite fog after display conversion so keyed pixels remain
          // precisely #00ff00, unaffected by tone mapping or the vignette.
          vec3 skyLinear = mix(uBackground,uBackgroundBottom,pow(1.0-screen.y,0.8));
          vec3 backdrop = linearToOutputTexel(vec4(skyLinear,1.0)).rgb;
          if (uGreenscreen > 0.5) backdrop = vec3(0.0,1.0,0.0);
          float fog = smoothstep(7.5,22.0,-vWorld.z);
          gl_FragColor.rgb = mix(gl_FragColor.rgb,backdrop,fog);
        }
      `
    });

    // The depth-heavy mesh spends subdivisions on the horizontal ripple bands.
    const surfaceGeometry = new THREE.PlaneGeometry(90, 76, 360, 640);
    surfaceGeometry.rotateX(-Math.PI / 2);
    surfaceGeometry.translate(0, 0, -12);
    const surface = new THREE.Mesh(surfaceGeometry, surfaceMaterial);
    surface.frustumCulled = false;
    scene.add(surface);

    const controls = new OrbitControls(camera,canvas);
    controls.enableDamping = true;
    controls.dampingFactor = 0.09;
    controls.enableZoom = false; // Wheel zoom uses a persistent user-owned lens.
    controls.panSpeed = 0.8;
    controls.rotateSpeed = 0.45;
    controls.minPolarAngle = 0.15;
    controls.maxPolarAngle = Math.PI/2-0.025;
    controls.mouseButtons.LEFT = THREE.MOUSE.PAN;
    controls.mouseButtons.RIGHT = THREE.MOUSE.ROTATE;
    controls.mouseButtons.MIDDLE = THREE.MOUSE.ROTATE;
    controls.touches.ONE = THREE.TOUCH.PAN;
    controls.touches.TWO = THREE.TOUCH.DOLLY_ROTATE;
    const spherical = new THREE.Spherical();
    const offset = new THREE.Vector3();
    const up = new THREE.Vector3(0,1,0);
    let frame = 0, elapsed = 0, previous = performance.now(), disposed = false;

    function syncUniforms() {
      if (config.animation === 'Static' && controls.enableDamping) {
        controls.enableDamping = false;
        controls.update(); // Settle any previous drag before freezing the view.
      } else if (config.animation !== 'Static') controls.enableDamping = true;
      uniforms.uCool.value.set(config.color3);
      uniforms.uWarm.value.set(config.color2);
      uniforms.uViolet.value.set(config.color4);
      uniforms.uPalette.value.forEach((color,i) => color.set(config['color'+(i+1)]));
      uniforms.uPaletteBlend.value = config.paletteBlend;
      uniforms.uInvert.value = Number(config.invert);
      uniforms.uAccent.value.set(config.accentColor);
      uniforms.uAccentAmount.value = config.accentAmount;
      uniforms.uGreenscreen.value = Number(config.greenscreen);
      uniforms.uBackground.value.set(config.background);
      uniforms.uBackgroundBottom.value.set(config.gradient ? config.backgroundBottom : config.background);
      uniforms.uAnimationMode.value = animations.indexOf(config.animation);
      for (const [key,name] of Object.entries({motionStrength:'uMotionStrength',rippleDensity:'uRippleDensity',waveHeight:'uWaveHeight',basinDepth:'uBasinDepth',basinWidth:'uBasinWidth',warp:'uWarp',seed:'uSeed'})) uniforms[name].value = config[key];
    }
    function applyScheme() {
      const scheme = schemes[config.scheme];
      const colors = scheme.colors.map(c => '#'+c);
      // Five-color palettes gain an interpolated sixth stop without dropping
      // or substituting any of their supplied colors.
      if (colors.length === 5) colors.splice(4,0,'#'+new THREE.Color(colors[3]).lerp(new THREE.Color(colors[4]),0.5).getHexString());
      colors.forEach((c,i) => config['color'+(i+1)] = c);
      config.invert = false;
      config.paletteBlend = config.scheme === 'Original' ? 0 : 1;
      config.background = '#'+scheme.background;
      config.backgroundBottom = '#'+(scheme.bottom || scheme.background);
      config.accentColor = '#'+(scheme.accent || 'ff263b');
      config.accentAmount = scheme.amount || 0;
      syncUniforms();
      gui.controllersRecursive().forEach(c => c.updateDisplay());
    }
    function resize() {
      renderer.setPixelRatio(config.pixelRatio);
      renderer.setSize(innerWidth,innerHeight,false);
      renderer.getDrawingBufferSize(uniforms.uResolution.value);
      camera.aspect = innerWidth/innerHeight;
      camera.updateProjectionMatrix();
    }
    function setZoom() {
      camera.zoom = config.zoom;
      camera.updateProjectionMatrix();
    }
    function setAngle() {
      controls.update();
      spherical.setFromVector3(offset.copy(camera.position).sub(controls.target));
      spherical.theta = THREE.MathUtils.degToRad(config.yaw);
      spherical.phi = THREE.MathUtils.degToRad(90-config.pitch);
      camera.position.copy(controls.target).add(offset.setFromSpherical(spherical));
      camera.lookAt(controls.target);
      controls.update();
    }
    function resetView() {
      controls.reset();
      controls.target.set(0,0,-1);
      camera.position.set(0,5.4,innerWidth/innerHeight<0.8?17.5:15.5);
      config.zoom = 1;
      setZoom();
      controls.update();
    }
    function onWheel(event) {
      event.preventDefault();
      config.zoom = THREE.MathUtils.clamp(config.zoom*Math.exp(-event.deltaY*0.001),0.35,3.5);
      setZoom();
    }
    function onKey(event) {
      if (event.code !== 'KeyH' || event.repeat || event.ctrlKey || event.metaKey || event.altKey) return;
      if (event.target.closest?.('input,textarea,[contenteditable="true"]')) return;
      gui.show(gui._hidden);
    }

    const gui = new GUI({title:'Liquid silk'});
    gui.add(config,'scheme',Object.keys(schemes)).name('Color scheme').onChange(applyScheme);
    gui.add(config,'invert').name('Invert').onChange(() => {
      if (schemes[config.scheme].mono) {
        for (const key of ['background','backgroundBottom']) config[key] = '#'+new THREE.Color(config[key]).setRGB(1-new THREE.Color(config[key]).r,1-new THREE.Color(config[key]).g,1-new THREE.Color(config[key]).b).getHexString();
      }
      syncUniforms();
      gui.controllersRecursive().forEach(c=>c.updateDisplay());
    });
    const colors = gui.addFolder('Colors');
    for (let i=1;i<=6;i++) colors.addColor(config,'color'+i).name('Color '+i).onChange(() => { config.paletteBlend=1; syncUniforms(); });
    colors.add(config,'paletteBlend',0,1,0.01).name('Palette blend').listen().onChange(syncUniforms);
    colors.addColor(config,'accentColor').name('Accent').onChange(syncUniforms);
    colors.add(config,'accentAmount',0,1,0.01).name('Accent amount').onChange(syncUniforms);
    colors.close();
    const background = gui.addFolder('Background');
    background.add(config,'greenscreen').name('Greenscreen').onChange(syncUniforms);
    background.add(config,'gradient').name('Gradient').onChange(syncUniforms);
    background.addColor(config,'background').name('Background color').onChange(syncUniforms);
    background.addColor(config,'backgroundBottom').name('Gradient bottom').onChange(syncUniforms);
    background.close();
    const motion = gui.addFolder('Animation');
    motion.add(config,'animation',animations).name('Animation').onChange(syncUniforms);
    motion.add(config,'speed',0,12,0.01).name('Speed');
    motion.add(config,'motionStrength',0,2,0.01).name('Motion strength').onChange(syncUniforms);
    const shape = gui.addFolder('Sculpture');
    shape.add(config,'rippleDensity',0.45,1.6,0.01).name('Ripple density').onChange(syncUniforms);
    shape.add(config,'waveHeight',0.4,1.6,0.01).name('Wave height').onChange(syncUniforms);
    shape.add(config,'basinDepth',0.4,1.6,0.01).name('Basin depth').onChange(syncUniforms);
    shape.add(config,'basinWidth',0.6,1.7,0.01).name('Basin width').onChange(syncUniforms);
    shape.add(config,'warp',0.2,1.8,0.01).name('Fold curvature').onChange(syncUniforms);
    shape.add(config,'seed',0,100,0.01).name('Seed').listen().onChange(syncUniforms);
    shape.close();
    const view = gui.addFolder('Camera & quality');
    view.add(config,'zoom',0.35,3.5,0.01).name('Zoom').listen().onChange(setZoom);
    view.add(config,'yaw',-180,180,0.1).name('Camera angle').listen().onChange(setAngle);
    view.add(config,'pitch',2,80,0.1).name('Elevation').listen().onChange(setAngle);
    view.add(config,'pixelRatio',0.5,3,0.05).name('DPR / Pixel ratio').onChange(resize);
    view.add({resetView},'resetView').name('Reset view');
    view.close();
    gui.add(config,'randomizeOnClick').name('Randomize on click');
    gui.add({randomize},'randomize').name('New variation');

    function randomize() {
      const random = (min,max) => Math.round((min+Math.random()*(max-min))*100)/100;
      const names = Object.keys(schemes);
      config.scheme = names[Math.floor(Math.random()*names.length)];
      applyScheme();
      config.seed = random(0,100);
      config.rippleDensity = random(0.65,1.3);
      config.waveHeight = random(0.65,1.3);
      config.basinDepth = random(0.65,1.35);
      config.basinWidth = random(0.8,1.35);
      config.warp = random(0.6,1.6);
      config.motionStrength = random(0.55,1.4);
      config.speed = random(0.35,1.1);
      config.animation = animations[Math.floor(Math.random()*(animations.length-1))];
      syncUniforms();
      gui.controllersRecursive().forEach(c=>c.updateDisplay());
    }
    let pointerStart = null;
    function onPointerDown(event) {
      if (event.button!==0 || !event.isPrimary) { pointerStart=null; return; }
      pointerStart={x:event.clientX,y:event.clientY,time:performance.now(),id:event.pointerId,moved:false};
    }
    function onPointerMove(event) {
      if (pointerStart && Math.hypot(event.clientX-pointerStart.x,event.clientY-pointerStart.y)>6) pointerStart.moved=true;
    }
    function onPointerUp(event) {
      const start=pointerStart;
      pointerStart=null;
      if (start && event.pointerId===start.id && !start.moved && performance.now()-start.time<700 && config.randomizeOnClick) randomize();
    }
    function onPointerCancel() { pointerStart=null; }
    canvas.addEventListener('pointerdown',onPointerDown);
    canvas.addEventListener('pointermove',onPointerMove);
    canvas.addEventListener('pointerup',onPointerUp);
    canvas.addEventListener('pointercancel',onPointerCancel);
    canvas.addEventListener('wheel',onWheel,{passive:false});
    addEventListener('keydown',onKey);
    addEventListener('resize',resize,{passive:true});
    resetView();
    resize();
    syncUniforms();

    function animate(now) {
      if (disposed) return;
      const delta = Math.min((now-previous)/1000,0.05)*config.speed*4;
      previous = now;
      if (config.animation !== 'Static') elapsed += delta;
      uniforms.uTime.value = elapsed%120;
      // Incremental orbit composes with user changes instead of restoring a
      // predefined camera. Wheel zoom, pan, and orbit angle remain persistent.
      let orbit=0;
      if (config.animation==='Gentle orbit') orbit=delta*0.025;
      if (config.animation==='Pendulum orbit') orbit=delta*0.045*Math.cos(elapsed*Math.PI/60);
      if (orbit) {
        offset.copy(camera.position).sub(controls.target).applyAxisAngle(up,orbit);
        camera.position.copy(controls.target).add(offset);
      }
      if (config.animation !== 'Static') controls.update();
      spherical.setFromVector3(offset.copy(camera.position).sub(controls.target));
      config.yaw = THREE.MathUtils.radToDeg(spherical.theta);
      config.pitch = 90-THREE.MathUtils.radToDeg(spherical.phi);
      renderer.render(scene,camera);
      frame=requestAnimationFrame(animate);
    }
    frame=requestAnimationFrame(animate);
    function dispose() {
      disposed=true;
      cancelAnimationFrame(frame);
      removeEventListener('resize',resize);
      removeEventListener('keydown',onKey);
      canvas.removeEventListener('wheel',onWheel);
      canvas.removeEventListener('pointerdown',onPointerDown);
      canvas.removeEventListener('pointermove',onPointerMove);
      canvas.removeEventListener('pointerup',onPointerUp);
      canvas.removeEventListener('pointercancel',onPointerCancel);
      controls.dispose();
      gui.destroy();
      surfaceGeometry.dispose(); surfaceMaterial.dispose();
      skyGeometry.dispose(); skyMaterial.dispose();
      renderer.dispose();
      removeEventListener('pagehide',onPageHide);
    }
    function onPageHide(event) { if (!event.persisted) dispose(); }
    addEventListener('pagehide',onPageHide);
  </script>
</body>
</html>
