<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ghost Swarm 👻</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      user-select: none;
      -webkit-user-select: none;
    }
    #webgl-canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js",
        "postprocessing/PostProcessor.js": "./postprocessing/PostProcessor.js"
      }
    }
  </script>
</head>
<body>
  <canvas id="webgl-canvas"></canvas>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import GUI from 'lil-gui';

    // =========================================================================
    // POST PROCESSOR SUITE (Inlined from postprocessing/PostProcessor.js)
    // =========================================================================
    const orthoVertexShader = `
    precision highp float;
    in vec3 position;
    out vec2 vUv;
    void main() {
      vUv = position.xy * 0.5 + 0.5;
      gl_Position = vec4(position, 1.0);
    }
    `;

    const brightFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float bloomThreshold;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float luminance = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float knee = 0.1;
      float soft = luminance - bloomThreshold + knee;
      soft = clamp(soft, 0.0, 2.0 * knee);
      soft = (soft * soft) / (4.0 * knee + 0.00001);
      float contribution = max(soft, luminance - bloomThreshold);
      contribution /= max(luminance, 0.00001);
      fragColor = vec4(color.rgb * contribution, color.a);
    }
    `;

    const blur13ShaderChunk = `
    vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
      vec2 resolution = vec2(textureSize(image, 0));
      vec4 color = vec4(0.0);
      vec2 off1 = vec2(1.411764705882353) * direction;
      vec2 off2 = vec2(3.2941176470588234) * direction;
      vec2 off3 = vec2(5.176470588235294) * direction;
      color += texture(image, uv) * 0.1964825501511404;
      color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
      color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
      return color;
    }
    `;

    const blurFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 direction;
    in vec2 vUv;
    out vec4 color;
    ${blur13ShaderChunk}
    void main() {
      color = blur13(inputTexture, vUv, direction);
    }
    `;

    const godRaysDepthMaskShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float threshold;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float lum = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float factor = smoothstep(threshold, threshold + 0.15, lum);
      fragColor = vec4(vec3(factor), 1.0);
    }
    `;

    const godRaysGenerateShader = `
    precision highp float;
    #define TAPS_PER_PASS 6.0

    uniform sampler2D inputTexture;
    uniform vec3 vSunPositionScreenSpace;
    uniform float fStepSize;
    uniform float distanceAttenuation;
    uniform float maxDensity;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec2 delta = vSunPositionScreenSpace.xy - vUv;
      float dist = length(delta);
      vec2 stepv = fStepSize * delta / max(dist, 0.0001);
      float iters = dist / max(fStepSize, 0.00001);

      vec2 uv = vUv;
      float col = 0.0;
      float f = min(1.0, max(vSunPositionScreenSpace.z, 0.0));

      float atten = 1.0 / (1.0 + pow(dist, distanceAttenuation));

      if (0.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (1.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (2.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (3.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (4.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (5.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;

      float finalVal = min(col / TAPS_PER_PASS * atten, maxDensity);
      fragColor = vec4(vec3(finalVal), 1.0);
    }
    `;

    const anamorphicBrightShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float threshold;
    uniform float smoothWidth;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float v = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float alpha = smoothstep(threshold, threshold + smoothWidth, v);
      fragColor = mix(vec4(0.0), color, alpha);
    }
    `;

    const anamorphicBlurShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 resolution;
    uniform float samples;
    uniform float intensity;
    uniform vec3 tintColor;
    uniform float bloomRadius;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      int halfSamples = max(1, int(samples) / 2);
      float fHalfSamples = float(halfSamples);
      vec2 invSize = 1.0 / resolution;
      vec4 total = vec4(0.0);

      for (int i = -64; i <= 64; i++) {
        if (i < -halfSamples || i > halfSamples) continue;
        float softness = 1.0 - abs(float(i)) / fHalfSamples;
        softness = pow(softness, 2.0);
        vec2 shiftedUV = vec2(vUv.x + invSize.x * float(i) * (4.0 + bloomRadius * 8.0), vUv.y);
        shiftedUV = clamp(shiftedUV, 0.001, 0.999);
        total += texture(inputTexture, shiftedUV) * softness;
      }

      fragColor = (total / (samples / 3.0)) * vec4(tintColor, 1.0) * intensity;
    }
    `;

    const finalFragmentShader = `
    precision highp float;
    uniform vec2 resolution;
    uniform sampler2D inputTexture;
    uniform sampler2D blur0Texture;
    uniform sampler2D blur1Texture;
    uniform sampler2D blur2Texture;
    uniform sampler2D blur3Texture;
    uniform sampler2D blur4Texture;
    uniform sampler2D raysTexture;
    uniform sampler2D anamorphicTexture;
    uniform bool bloomEnabled;
    uniform float bloomStrength;
    uniform bool raysEnabled;
    uniform float raysStrength;
    uniform vec3 raysColor;
    uniform bool anamorphicEnabled;
    uniform float vignetteBoost;
    uniform float vignetteReduction;
    uniform float noiseIntensity;
    uniform float time;
    in vec2 vUv;
    out vec4 fragColor;

    float vignette(vec2 uv, float boost, float reduction) {
      vec2 position = vUv - 0.5;
      return boost - length(position) * reduction;
    }

    float hash1(uint n) {
      n = (n << 13U) ^ n;
      n = n * (n * n * 15731U + 789221U) + 1376312589U;
      return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
    }

    float noise(in vec2 uv, in float timeVal) {
      uvec2 p = uvec2(uv);
      return hash1(p.x + 1920U * p.y + (1920U * 1080U) * uint(timeVal));
    }

    void main() {
      vec4 color = texture(inputTexture, vUv);

      if (bloomEnabled && bloomStrength > 0.001) {
        vec4 b0 = texture(blur0Texture, vUv);
        vec4 b1 = texture(blur1Texture, vUv);
        vec4 b2 = texture(blur2Texture, vUv);
        vec4 b3 = texture(blur3Texture, vUv);
        vec4 b4 = texture(blur4Texture, vUv);

        vec4 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
        color += bloomSum * bloomStrength;
      }

      if (raysEnabled && raysStrength > 0.001) {
        vec4 r = texture(raysTexture, vUv);
        color.rgb += r.rgb * raysColor * raysStrength;
      }

      if (anamorphicEnabled) {
        vec4 a = texture(anamorphicTexture, vUv);
        color.rgb += a.rgb;
      }

      color.rgb *= vignette(vUv, vignetteBoost, vignetteReduction);
      color.rgb += noiseIntensity * noise(gl_FragCoord.xy, time);
      fragColor = vec4(color.rgb, 1.0);
    }
    `;

    const chromaticAberrationShaderChunk = `
    vec2 barrelDistortion(vec2 coord, float amt) {
      vec2 cc = coord - 0.5;
      float dist = dot(cc, cc);
      return coord + cc * dist * amt;
    }
    float sat(float t) { return clamp(t, 0.0, 1.0); }
    float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
    float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
    vec4 spectrum_offset(float t) {
      float lo = step(t, 0.5);
      float hi = 1.0 - lo;
      float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
      vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
      return pow(ret, vec4(1.0 / 2.2));
    }
    const float max_distort = 2.2;
    const int num_iter = 8;
    const float reci_num_iter_f = 1.0 / float(num_iter);
    vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
      vec4 sumcol = vec4(0.0);
      vec4 sumw = vec4(0.0);
      for (int i = 0; i < num_iter; ++i) {
        float t = float(i) * reci_num_iter_f;
        vec4 w = spectrum_offset(t);
        sumw += w;
        sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
      }
      return sumcol / sumw;
    }
    `;

    const colorFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float chromaticAberrationAmount;
    uniform float minInputLevel;
    uniform float maxInputLevel;
    uniform float gammaLevel;
    uniform float exposure;
    uniform float fisheyeStrength;
    uniform float fisheyeRadius;
    uniform float time;
    uniform int visionMode;
    uniform float thermalSensitivity;
    uniform float nightVisionNoise;
    in vec2 vUv;
    out vec4 fragColor;

    ${chromaticAberrationShaderChunk}

    vec2 applyFisheye(vec2 uv, float strength, float radius) {
      if (abs(strength) < 0.0001) return uv;
      vec2 p = uv - 0.5;
      float d = length(p);
      if (d > radius * 1.5) return uv;
      float r = d / max(radius, 0.001);
      float theta = atan(p.y, p.x);
      float rDist = r + strength * (r * r * r);
      return 0.5 + vec2(cos(theta), sin(theta)) * (rDist * radius);
    }

    vec3 ACESFilmicToneMapping(vec3 color) {
      float a = 2.51;
      float b = 0.03;
      float c = 2.43;
      float d = 0.59;
      float e = 0.14;
      return clamp((color * (a * color + b)) / (color * (c * color + d) + e), 0.0, 1.0);
    }

    vec3 gammaCorrect(vec3 color, vec3 gamma) {
      return pow(max(color, vec3(0.0)), 1.0 / gamma);
    }
    vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
      return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
    }
    vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
      return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
    }

    vec3 applyNightVision(vec3 color, vec2 uv, float timeVal, float noiseAmt) {
      float lum = dot(color, vec3(0.299, 0.587, 0.114));
      float amplified = pow(lum * 2.1, 0.72);
      vec3 phosphorColor = mix(vec3(0.02, 0.12, 0.03), vec3(0.18, 1.0, 0.32), clamp(amplified, 0.0, 1.0));
      phosphorColor += vec3(0.7, 1.0, 0.8) * max(0.0, amplified - 0.75) * 1.8;

      vec2 p = uv - 0.5;
      float tubeDist = length(p);
      float tubeMask = smoothstep(0.72, 0.44, tubeDist);

      float n = fract(sin(dot(uv * 280.0 + timeVal * 0.05, vec2(12.9898, 78.233))) * 43758.5453);
      float scanline = sin(uv.y * 650.0) * 0.05;

      phosphorColor += (n - 0.5) * noiseAmt * 2.0 + scanline;
      return clamp(phosphorColor * tubeMask, 0.0, 1.0);
    }

    vec3 ironbow(float t) {
      t = clamp(t, 0.0, 1.0);
      vec3 c0 = vec3(0.02, 0.01, 0.18);
      vec3 c1 = vec3(0.22, 0.02, 0.48);
      vec3 c2 = vec3(0.82, 0.05, 0.25);
      vec3 c3 = vec3(1.0, 0.62, 0.02);
      vec3 c4 = vec3(1.0, 1.0, 0.92);

      if (t < 0.25) return mix(c0, c1, t * 4.0);
      if (t < 0.50) return mix(c1, c2, (t - 0.25) * 4.0);
      if (t < 0.75) return mix(c2, c3, (t - 0.50) * 4.0);
      return mix(c3, c4, (t - 0.75) * 4.0);
    }

    vec3 applyThermal(vec3 color, vec2 uv, float sensitivity, bool whiteHot) {
      float lum = dot(color, vec3(0.299, 0.587, 0.114));
      float heat = clamp(lum * sensitivity, 0.0, 1.0);
      float sensorRaster = sin(uv.y * 900.0) * 0.015;
      heat = clamp(heat + sensorRaster, 0.0, 1.0);

      if (whiteHot) {
        float grad = pow(heat, 0.85);
        return vec3(grad);
      } else {
        return ironbow(heat);
      }
    }

    void main() {
      vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
      vec4 col = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
      vec3 finalCol = col.rgb;

      if (visionMode == 1) {
        finalCol = applyNightVision(finalCol, uv, time, nightVisionNoise);
      } else if (visionMode == 2) {
        finalCol = applyThermal(finalCol, uv, thermalSensitivity, false);
      } else if (visionMode == 3) {
        finalCol = applyThermal(finalCol, uv, thermalSensitivity, true);
      } else {
        vec3 exposedColor = finalCol * exposure;
        vec3 toneMappedColor = ACESFilmicToneMapping(exposedColor);
        finalCol = finalLevels(toneMappedColor, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
      }

      fragColor = vec4(finalCol, 1.0);
    }
    `;

    const copyFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      fragColor = texture(inputTexture, vUv);
    }
    `;

    function createFBO(w, h, options = {}) {
      return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
        wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
        wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
        minFilter: options.minFilter || THREE.LinearFilter,
        magFilter: options.magFilter || THREE.LinearFilter,
        format: options.format || THREE.RGBAFormat,
        type: options.type || THREE.HalfFloatType,
        stencilBuffer: options.stencilBuffer || false,
        depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : true,
        samples: options.samples || 0,
      });
    }

    class ShaderPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbo = createFBO(1, 1, options);
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
        this.texture = this.fbo.texture;
      }
      render(renderer, toScreen = false) {
        if (!toScreen) {
          renderer.setRenderTarget(this.fbo);
        }
        renderer.render(this.orthoScene, this.orthoCamera);
        if (!toScreen) {
          renderer.setRenderTarget(null);
        }
      }
      setSize(width, height) {
        this.fbo.setSize(Math.max(1, width), Math.max(1, height));
        this.orthoQuad.scale.set(width, height, 1);
      }
    }

    class ShaderPingPongPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
        this.currentFBO = 0;
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
      }
      render(renderer) {
        renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
        renderer.render(this.orthoScene, this.orthoCamera);
        renderer.setRenderTarget(null);
        this.currentFBO = 1 - this.currentFBO;
      }
      get current() { return this.fbos[this.currentFBO]; }
      get texture() { return this.current.texture; }
      setSize(width, height) {
        const w = Math.max(1, width);
        const h = Math.max(1, height);
        this.orthoQuad.scale.set(w, h, 1);
        this.fbos[0].setSize(w, h);
        this.fbos[1].setSize(w, h);
      }
    }

    class BloomPass {
      constructor(strength = 0.8, radius = 0.5, threshold = 0.2, levels = 5) {
        this.strength = strength;
        this.radius = radius;
        this.threshold = threshold;
        this.enabled = true;
        this.levels = levels;

        this.brightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            bloomThreshold: { value: this.threshold },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: brightFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.brightPass = new ShaderPass(this.brightShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.blurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            direction: { value: new THREE.Vector2(0, 1) },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: blurFragmentShader,
          glslVersion: THREE.GLSL3,
        });

        this.blurPasses = [];
        for (let i = 0; i < this.levels; i++) {
          this.blurPasses.push(new ShaderPingPongPass(this.blurShader, {
            format: THREE.RGBAFormat,
            type: THREE.HalfFloatType,
          }));
        }
      }

      setSize(w, h) {
        let tw = Math.max(1, w);
        let th = Math.max(1, h);
        this.brightPass.setSize(tw, th);
        for (let i = 0; i < this.levels; i++) {
          tw = Math.max(1, Math.round(tw / 2));
          th = Math.max(1, Math.round(th / 2));
          this.blurPasses[i].setSize(tw, th);
        }
      }

      set source(texture) {
        this.brightShader.uniforms.inputTexture.value = texture;
      }

      render(renderer) {
        if (!this.enabled || this.strength <= 0.001) return;

        this.brightShader.uniforms.bloomThreshold.value = this.threshold;
        this.brightPass.render(renderer);

        const baseOffset = Math.max(0.1, this.radius * 2.0);
        const u = this.blurShader.uniforms;

        for (let j = 0; j < this.levels; j++) {
          const blurPass = this.blurPasses[j];
          const stepOffset = baseOffset * (1.0 + j * 0.5);

          u.direction.value.set(stepOffset, 0);
          u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
          blurPass.render(renderer);

          u.direction.value.set(0, stepOffset * 0.5);
          u.inputTexture.value = blurPass.current.texture;
          blurPass.render(renderer);
        }
      }
    }

    const VISION_MODE_MAP = {
      'Normal (Cinematic)': 0,
      'Night Vision (Phosphor)': 1,
      'Thermal (Ironbow)': 2,
      'Thermal (White-Hot)': 3,
    };

    class PostProcessor {
      constructor(renderer, userParams = {}) {
        this.renderer = renderer;

        this.settings = {
          enabled: userParams.enabled !== undefined ? userParams.enabled : true,

          bloomEnabled: userParams.bloomEnabled !== undefined ? userParams.bloomEnabled : true,
          bloomStrength: userParams.bloomStrength !== undefined ? userParams.bloomStrength : 1.2,
          bloomRadius: userParams.bloomRadius !== undefined ? userParams.bloomRadius : 0.6,
          bloomThreshold: userParams.bloomThreshold !== undefined ? userParams.bloomThreshold : 0.15,

          raysEnabled: userParams.raysEnabled !== undefined ? userParams.raysEnabled : true,
          raysStrength: userParams.raysStrength !== undefined ? userParams.raysStrength : 0.85,
          raysDensity: userParams.raysDensity !== undefined ? userParams.raysDensity : 1.0,
          raysMaxDensity: userParams.raysMaxDensity !== undefined ? userParams.raysMaxDensity : 0.5,
          raysDistanceAttenuation: userParams.raysDistanceAttenuation !== undefined ? userParams.raysDistanceAttenuation : 2.0,
          raysThreshold: userParams.raysThreshold !== undefined ? userParams.raysThreshold : 0.12,
          raysColor: userParams.raysColor ? (userParams.raysColor.isColor ? userParams.raysColor.clone() : new THREE.Color(userParams.raysColor)) : new THREE.Color(0xf6aa1c),
          raysColorHex: userParams.raysColorHex || (typeof userParams.raysColor === 'string' ? userParams.raysColor : '#f6aa1c'),

          anamorphicEnabled: userParams.anamorphicEnabled !== undefined ? userParams.anamorphicEnabled : true,
          anamorphicIntensity: userParams.anamorphicIntensity !== undefined ? userParams.anamorphicIntensity : (userParams.anamorphicStrength !== undefined ? userParams.anamorphicStrength * 2.5 : 5.0),
          anamorphicThreshold: userParams.anamorphicThreshold !== undefined ? userParams.anamorphicThreshold : 0.3,
          anamorphicSamples: userParams.anamorphicSamples !== undefined ? userParams.anamorphicSamples : 64,
          anamorphicRadius: userParams.anamorphicRadius !== undefined ? userParams.anamorphicRadius : 0.0,
          anamorphicSmoothWidth: userParams.anamorphicSmoothWidth !== undefined ? userParams.anamorphicSmoothWidth : 0.05,
          anamorphicColor: userParams.anamorphicColor ? (userParams.anamorphicColor.isColor ? userParams.anamorphicColor.clone() : new THREE.Color(userParams.anamorphicColor)) : new THREE.Color(0x7a8aff),
          anamorphicColorHex: userParams.anamorphicColorHex || '#7a8aff',

          visionMode: userParams.visionMode !== undefined ? userParams.visionMode : 'Normal (Cinematic)',
          thermalSensitivity: userParams.thermalSensitivity !== undefined ? userParams.thermalSensitivity : 1.4,
          nightVisionNoise: userParams.nightVisionNoise !== undefined ? userParams.nightVisionNoise : 0.12,

          fisheyeStrength: userParams.fisheyeStrength !== undefined ? userParams.fisheyeStrength : 0.0,
          fisheyeRadius: userParams.fisheyeRadius !== undefined ? userParams.fisheyeRadius : 1.0,
          chromaticAberration: userParams.chromaticAberration !== undefined ? userParams.chromaticAberration : 0.02,
          vignetteBoost: userParams.vignetteBoost !== undefined ? userParams.vignetteBoost : 1.1,
          vignetteReduction: userParams.vignetteReduction !== undefined ? userParams.vignetteReduction : 0.65,
          noiseIntensity: userParams.noiseIntensity !== undefined ? userParams.noiseIntensity : 0.015,

          gamma: userParams.gamma !== undefined ? userParams.gamma : 1.0,
          minInputLevel: userParams.minInputLevel !== undefined ? userParams.minInputLevel : 0.0,
          maxInputLevel: userParams.maxInputLevel !== undefined ? userParams.maxInputLevel : 1.0,
          exposure: userParams.exposure !== undefined ? userParams.exposure : 1.0,
        };

        this.sceneTarget = createFBO(1, 1, { type: THREE.HalfFloatType });

        this.bloomPass = new BloomPass(
          this.settings.bloomStrength,
          this.settings.bloomRadius,
          this.settings.bloomThreshold,
          5
        );

        this.moonScreenPos = new THREE.Vector3(0.5, 0.7, 1.0);
        this.moonInFront = true;

        this.godRaysMaskShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            threshold: { value: this.settings.raysThreshold },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: godRaysDepthMaskShader,
          glslVersion: THREE.GLSL3,
        });
        this.godRaysMaskPass = new ShaderPass(this.godRaysMaskShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.godRaysGenShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            vSunPositionScreenSpace: { value: this.moonScreenPos },
            fStepSize: { value: 1.0 },
            distanceAttenuation: { value: this.settings.raysDistanceAttenuation },
            maxDensity: { value: this.settings.raysMaxDensity },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: godRaysGenerateShader,
          glslVersion: THREE.GLSL3,
        });
        this.godRaysPingPong = new ShaderPingPongPass(this.godRaysGenShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.anamorphicBrightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            threshold: { value: this.settings.anamorphicThreshold },
            smoothWidth: { value: this.settings.anamorphicSmoothWidth },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: anamorphicBrightShader,
          glslVersion: THREE.GLSL3,
        });
        this.anamorphicBrightPass = new ShaderPass(this.anamorphicBrightShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.anamorphicBlurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            resolution: { value: new THREE.Vector2(1, 1) },
            samples: { value: this.settings.anamorphicSamples },
            intensity: { value: this.settings.anamorphicIntensity },
            tintColor: { value: this.settings.anamorphicColor },
            bloomRadius: { value: this.settings.anamorphicRadius },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: anamorphicBlurShader,
          glslVersion: THREE.GLSL3,
        });
        this.anamorphicBlurPass = new ShaderPass(this.anamorphicBlurShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.finalShader = new THREE.RawShaderMaterial({
          uniforms: {
            resolution: { value: new THREE.Vector2(1, 1) },
            bloomEnabled: { value: this.settings.bloomEnabled },
            bloomStrength: { value: this.settings.bloomStrength },
            raysEnabled: { value: this.settings.raysEnabled },
            raysStrength: { value: this.settings.raysStrength },
            raysColor: { value: this.settings.raysColor },
            anamorphicEnabled: { value: this.settings.anamorphicEnabled },
            vignetteBoost: { value: this.settings.vignetteBoost },
            vignetteReduction: { value: this.settings.vignetteReduction },
            noiseIntensity: { value: this.settings.noiseIntensity },
            inputTexture: { value: null },
            blur0Texture: { value: null },
            blur1Texture: { value: null },
            blur2Texture: { value: null },
            blur3Texture: { value: null },
            blur4Texture: { value: null },
            raysTexture: { value: null },
            anamorphicTexture: { value: null },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: finalFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.finalPass = new ShaderPass(this.finalShader);

        this.rgbShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: this.finalPass.texture },
            fisheyeStrength: { value: this.settings.fisheyeStrength },
            fisheyeRadius: { value: this.settings.fisheyeRadius },
            chromaticAberrationAmount: { value: this.settings.chromaticAberration },
            minInputLevel: { value: this.settings.minInputLevel },
            maxInputLevel: { value: this.settings.maxInputLevel },
            gammaLevel: { value: this.settings.gamma },
            exposure: { value: this.settings.exposure },
            visionMode: { value: VISION_MODE_MAP[this.settings.visionMode] ?? 0 },
            thermalSensitivity: { value: this.settings.thermalSensitivity },
            nightVisionNoise: { value: this.settings.nightVisionNoise },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: colorFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.rgbPass = new ShaderPass(this.rgbShader);

        this.copyShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: copyFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.copyPass = new ShaderPass(this.copyShader);
      }

      updateSettings() {
        this.bloomPass.enabled = this.settings.bloomEnabled;
        this.bloomPass.strength = this.settings.bloomStrength;
        this.bloomPass.radius = this.settings.bloomRadius;
        this.bloomPass.threshold = this.settings.bloomThreshold;

        this.godRaysMaskShader.uniforms.threshold.value = this.settings.raysThreshold;
        this.godRaysGenShader.uniforms.distanceAttenuation.value = this.settings.raysDistanceAttenuation;
        this.godRaysGenShader.uniforms.maxDensity.value = this.settings.raysMaxDensity;

        this.anamorphicBrightShader.uniforms.threshold.value = this.settings.anamorphicThreshold;
        this.anamorphicBrightShader.uniforms.smoothWidth.value = this.settings.anamorphicSmoothWidth;
        this.anamorphicBlurShader.uniforms.samples.value = this.settings.anamorphicSamples;
        this.anamorphicBlurShader.uniforms.intensity.value = this.settings.anamorphicIntensity;
        this.anamorphicBlurShader.uniforms.tintColor.value.copy(this.settings.anamorphicColor);
        this.anamorphicBlurShader.uniforms.bloomRadius.value = this.settings.anamorphicRadius;

        this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
        this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
        this.finalShader.uniforms.raysEnabled.value = this.settings.raysEnabled && this.moonInFront;
        this.finalShader.uniforms.raysStrength.value = this.settings.raysStrength;
        this.finalShader.uniforms.raysColor.value.copy(this.settings.raysColor);
        this.finalShader.uniforms.anamorphicEnabled.value = this.settings.anamorphicEnabled;
        this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
        this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
        this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;

        this.rgbShader.uniforms.fisheyeStrength.value = this.settings.fisheyeStrength;
        this.rgbShader.uniforms.fisheyeRadius.value = this.settings.fisheyeRadius;
        this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
        this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
        this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
        this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
        this.rgbShader.uniforms.exposure.value = this.settings.exposure;
        this.rgbShader.uniforms.visionMode.value = VISION_MODE_MAP[this.settings.visionMode] ?? 0;
        this.rgbShader.uniforms.thermalSensitivity.value = this.settings.thermalSensitivity;
        this.rgbShader.uniforms.nightVisionNoise.value = this.settings.nightVisionNoise;
      }

      setSize(w0, h0, dpr = 1) {
        const w = Math.max(1, Math.floor(w0 * dpr));
        const h = Math.max(1, Math.floor(h0 * dpr));
        this.sceneTarget.setSize(w, h);
        this.finalPass.setSize(w, h);
        this.finalShader.uniforms.resolution.value.set(w, h);
        this.bloomPass.setSize(w, h);

        const grW = Math.max(1, Math.round(w / 2));
        const grH = Math.max(1, Math.round(h / 2));
        this.godRaysMaskPass.setSize(grW, grH);
        this.godRaysPingPong.setSize(grW, grH);

        const anW = Math.max(1, Math.round(w / 4));
        const anH = Math.max(1, Math.round(h / 4));
        this.anamorphicBrightPass.setSize(anW, anH);
        this.anamorphicBlurPass.setSize(anW, anH);
        this.anamorphicBlurShader.uniforms.resolution.value.set(anW, anH);

        this.rgbPass.setSize(w, h);
        this.copyPass.setSize(w, h);
      }

      setMoonScreenPosition(camera, moonWorldPos) {
        if (!this._camDir) {
          this._camDir = new THREE.Vector3();
          this._toMoon = new THREE.Vector3();
          this._ndc = new THREE.Vector3();
        }
        camera.getWorldDirection(this._camDir);
        this._toMoon.copy(moonWorldPos).sub(camera.position).normalize();
        const dot = this._camDir.dot(this._toMoon);

        if (dot <= 0.02) {
          this.moonInFront = false;
          this.finalShader.uniforms.raysEnabled.value = false;
          return;
        }

        this.moonInFront = true;
        const fade = THREE.MathUtils.clamp((dot - 0.02) / 0.15, 0.0, 1.0);

        this._ndc.copy(moonWorldPos).project(camera);
        const screenX = this._ndc.x * 0.5 + 0.5;
        const screenY = this._ndc.y * 0.5 + 0.5;
        const screenZ = fade;

        this.moonScreenPos.set(screenX, screenY, screenZ);
        this.godRaysGenShader.uniforms.vSunPositionScreenSpace.value.set(screenX, screenY, screenZ);
      }

      renderScene(scene, camera) {
        if (!this.settings.enabled) {
          this.renderer.render(scene, camera);
          return;
        }
        this.renderer.setRenderTarget(this.sceneTarget);
        this.renderer.render(scene, camera);
        this.renderer.setRenderTarget(null);
        this.render(this.sceneTarget.texture);
      }

      render(sourceTexture) {
        if (!this.settings.enabled) {
          this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
          this.copyPass.render(this.renderer, true);
          return;
        }

        this.updateSettings();

        this.bloomPass.source = sourceTexture;
        this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
        this.bloomPass.render(this.renderer);

        this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
        this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
        this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
        this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
        this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

        if (this.settings.raysEnabled && this.settings.raysStrength > 0.001 && this.moonInFront) {
          this.godRaysMaskShader.uniforms.inputTexture.value = sourceTexture;
          this.godRaysMaskShader.uniforms.threshold.value = this.settings.raysThreshold;
          this.godRaysMaskPass.render(this.renderer);

          const filterLen = this.settings.raysDensity;
          const tapsPerPass = 6.0;

          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -1.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysMaskPass.texture;
          this.godRaysPingPong.render(this.renderer);

          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -2.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysPingPong.texture;
          this.godRaysPingPong.render(this.renderer);

          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -3.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysPingPong.texture;
          this.godRaysPingPong.render(this.renderer);

          this.finalPass.shader.uniforms.raysTexture.value = this.godRaysPingPong.texture;
          this.finalPass.shader.uniforms.raysEnabled.value = true;
        } else {
          this.finalPass.shader.uniforms.raysEnabled.value = false;
        }

        if (this.settings.anamorphicEnabled && this.settings.anamorphicIntensity > 0.001) {
          this.anamorphicBrightShader.uniforms.inputTexture.value = sourceTexture;
          this.anamorphicBrightShader.uniforms.threshold.value = this.settings.anamorphicThreshold;
          this.anamorphicBrightShader.uniforms.smoothWidth.value = this.settings.anamorphicSmoothWidth;
          this.anamorphicBrightPass.render(this.renderer);

          this.anamorphicBlurShader.uniforms.inputTexture.value = this.anamorphicBrightPass.texture;
          this.anamorphicBlurShader.uniforms.samples.value = this.settings.anamorphicSamples;
          this.anamorphicBlurShader.uniforms.intensity.value = this.settings.anamorphicIntensity;
          this.anamorphicBlurShader.uniforms.tintColor.value.copy(this.settings.anamorphicColor);
          this.anamorphicBlurShader.uniforms.bloomRadius.value = this.settings.anamorphicRadius;
          this.anamorphicBlurPass.render(this.renderer);

          this.finalPass.shader.uniforms.anamorphicTexture.value = this.anamorphicBlurPass.texture;
          this.finalPass.shader.uniforms.anamorphicEnabled.value = true;
        } else {
          this.finalPass.shader.uniforms.anamorphicEnabled.value = false;
        }

        const randomTime = Math.random() * 100000;
        this.finalPass.shader.uniforms.time.value = randomTime;
        this.rgbPass.shader.uniforms.time.value = randomTime;

        this.finalPass.render(this.renderer);
        this.rgbPass.render(this.renderer, true);
      }

      attachGUI(gui, title = "Post-Processing (PostProcessor.js)") {
        const root = gui.addFolder(title);
        root.add(this.settings, "enabled").name("Enable Post-Process");

        const vision = root.addFolder("Thermal & Night Vision");
        vision.add(this.settings, "visionMode", Object.keys(VISION_MODE_MAP)).name("Vision Mode").onChange(() => this.updateSettings());
        vision.add(this.settings, "thermalSensitivity", 0.5, 3.5, 0.05).name("Thermal Sensitivity").onChange(() => this.updateSettings());
        vision.add(this.settings, "nightVisionNoise", 0.0, 0.3, 0.01).name("NVG Sensor Noise").onChange(() => this.updateSettings());

        const rays = root.addFolder("Three.js Godrays");
        rays.add(this.settings, "raysEnabled").name("Enable Godrays").onChange(() => this.updateSettings());

        rays.add(this.settings, "raysMaxDensity", 0.1, 1.0, 0.05).name("Max Density").onChange(() => this.updateSettings());
        rays.add(this.settings, "raysDistanceAttenuation", 0.5, 4.0, 0.1).name("Distance Atten").onChange(() => this.updateSettings());

        const anamorphic = root.addFolder("Three.js Anamorphic Flare");

        anamorphic.add(this.settings, "anamorphicIntensity", 0, 10.0, 0.1).name("Intensity").onChange(() => this.updateSettings());
        anamorphic.add(this.settings, "anamorphicThreshold", 0.0, 0.9, 0.01).name("Threshold").onChange(() => this.updateSettings());
        anamorphic.add(this.settings, "anamorphicSamples", 2, 128, 1).name("Samples").onChange(() => this.updateSettings());
        anamorphic.add(this.settings, "anamorphicRadius", 0.0, 1.0, 0.01).name("Bloom Radius").onChange(() => this.updateSettings());
        anamorphic.addColor(this.settings, "anamorphicColorHex").name("Tint Color").onChange((v) => {
          this.settings.anamorphicColor.set(v);
          this.updateSettings();
        });

        const bloom = root.addFolder("Atmospheric Bloom");
        bloom.add(this.settings, "bloomEnabled").name("Enable Bloom").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomStrength", 0, 3.0, 0.05).name("Bloom Strength").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomRadius", 0, 2.0, 0.05).name("Bloom Radius").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomThreshold", 0, 1.0, 0.01).name("Bloom Threshold").onChange(() => this.updateSettings());

        const lens = root.addFolder("Lens, Optics & Film Grain");
        lens.add(this.settings, "fisheyeStrength", -1.0, 1.5, 0.01).name("Fisheye Distortion").onChange(() => this.updateSettings());
        lens.add(this.settings, "fisheyeRadius", 0.2, 2.0, 0.05).name("Fisheye Radius").onChange(() => this.updateSettings());
        lens.add(this.settings, "chromaticAberration", 0, 0.2, 0.005).name("Chromatic Aberration").onChange(() => this.updateSettings());
        lens.add(this.settings, "vignetteBoost", 0, 2.0, 0.05).name("Vignette Boost").onChange(() => this.updateSettings());
        lens.add(this.settings, "vignetteReduction", 0, 2.0, 0.05).name("Vignette Falloff").onChange(() => this.updateSettings());
        lens.add(this.settings, "noiseIntensity", 0, 0.1, 0.005).name("Film Grain").onChange(() => this.updateSettings());
        lens.add(this.settings, "gamma", 0.2, 2.0, 0.05).name("Gamma").onChange(() => this.updateSettings());
        lens.add(this.settings, "minInputLevel", 0, 0.5, 0.01).name("Black Level").onChange(() => this.updateSettings());
        lens.add(this.settings, "maxInputLevel", 0.5, 1.0, 0.01).name("White Level").onChange(() => this.updateSettings());

        return root;
      }

    // =========================================================================
    const noiseGLSL = `
    vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x, 289.0);}
    vec4 taylorInvSqrt(vec4 r){return 1.79284291400159 - 0.85373472095314 * r;}

    float snoise(vec3 v){
      const vec2  C = vec2(1.0/6.0, 1.0/3.0);
      const vec4  D = vec4(0.0, 0.5, 1.0, 2.0);

      vec3 i  = floor(v + dot(v, C.yyy) );
      vec3 x0 = v - i + dot(i, C.xxx) ;

      vec3 g = step(x0.yzx, x0.xyz);
      vec3 l = 1.0 - g;
      vec3 i1 = min( g.xyz, l.zxy );
      vec3 i2 = max( g.xyz, l.zxy );

      vec3 x1 = x0 - i1 + 1.0 * C.xxx;
      vec3 x2 = x0 - i2 + 2.0 * C.xxx;
      vec3 x3 = x0 - 1.0 + 3.0 * C.xxx;

      i = mod(i, 289.0 ); 
      vec4 p = permute( permute( permute( 
                 i.z + vec4(0.0, i1.z, i2.z, 1.0 ))
               + i.y + vec4(0.0, i1.y, i2.y, 1.0 )) 
               + i.x + vec4(0.0, i1.x, i2.x, 1.0 ));

      float n_ = 0.142857142857;
      vec3  ns = n_ * D.wyz - D.xzx;

      vec4 j = p - 49.0 * floor(p * ns.z.xxxx);

      vec4 x_ = floor(j * ns.z);
      vec4 y_ = floor(j - 7.0 * x_ );

      vec4 x = x_ *ns.x + ns.yyyy;
      vec4 y = y_ *ns.x + ns.yyyy;
      vec4 h = 1.0 - abs(x) - abs(y);

      vec4 b0 = vec4( x.xy, y.xy );
      vec4 b1 = vec4( x.zw, y.zw );

      vec4 s0 = floor(b0)*2.0 + 1.0;
      vec4 s1 = floor(b1)*2.0 + 1.0;
      vec4 sh = -step(h, vec4(0.0));

      vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ;
      vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ;

      vec3 p0 = vec3(a0.xy,h.x);
      vec3 p1 = vec3(a0.zw,h.y);
      vec3 p2 = vec3(a1.xy,h.z);
      vec3 p3 = vec3(a1.zw,h.w);

      vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
      p0 *= norm.x;
      p1 *= norm.y;
      p2 *= norm.z;
      p3 *= norm.w;

      vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
      m = m * m;
      return 42.0 * dot( m*m, vec4( dot(p0,x0), dot(p1,x1), 
                                    dot(p2,x2), dot(p3,x3) ) );
    }
    `;

    // =========================================================================
    // PROCEDURAL GHOST GEOMETRY
    // =========================================================================
    function createGhostGeometry(radialSegments = 32, heightSegments = 36) {
      const positions = [];
      const normals = [];
      const uvs = [];
      const indices = [];

      for (let j = 0; j <= heightSegments; j++) {
        const v = j / heightSegments;
        let r = 0.75;
        let y = 1.0;

        if (v < 0.25) {
          const frac = v / 0.25;
          r = Math.sin(frac * Math.PI * 0.5) * 0.75;
          y = 1.0 - (1.0 - Math.cos(frac * Math.PI * 0.5)) * 0.45;
        } else if (v < 0.55) {
          const frac = (v - 0.25) / 0.3;
          r = 0.75 - Math.sin(frac * Math.PI) * 0.12;
          y = 0.55 - frac * 0.75;
        } else {
          const frac = (v - 0.55) / 0.45;
          r = 0.63 + Math.pow(frac, 1.4) * 0.55;
          y = -0.2 - frac * 1.5;
        }

        for (let i = 0; i <= radialSegments; i++) {
          const u = i / radialSegments;
          const theta = u * Math.PI * 2;

          let currentR = r;
          if (v > 0.55) {
            const rippleWeight = Math.pow((v - 0.55) / 0.45, 2.0) * 0.16;
            currentR += Math.sin(theta * 6.0) * rippleWeight;
          }

          const x = Math.sin(theta) * currentR;
          const z = Math.cos(theta) * currentR;

          positions.push(x, y, z);

          const nx = Math.sin(theta);
          const ny = (v < 0.25) ? (1.0 - v / 0.25) : -0.15;
          const nz = Math.cos(theta);
          const len = Math.hypot(nx, ny, nz);
          normals.push(nx / len, ny / len, nz / len);

          uvs.push(u, v);
        }
      }

      for (let j = 0; j < heightSegments; j++) {
        for (let i = 0; i < radialSegments; i++) {
          const a = j * (radialSegments + 1) + i;
          const b = (j + 1) * (radialSegments + 1) + i;
          const c = (j + 1) * (radialSegments + 1) + (i + 1);
          const d = j * (radialSegments + 1) + (i + 1);
          indices.push(a, b, d);
          indices.push(b, c, d);
        }
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
      geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();
      return geometry;
    }

    const ghostBaseGeometry = createGhostGeometry(32, 36);

    // =========================================================================
    // GHOST SHADER MATERIAL
    // =========================================================================
    const ghostVertexShader = `
      ${noiseGLSL}

      uniform float uTime;
      uniform float uNoiseScale;
      uniform float uNoiseSpeed;
      uniform float uNoiseTurbulence;
      uniform float uGhostId;

      varying vec3 vNormal;
      varying vec3 vWorldPosition;
      varying vec3 vLocalPos;
      varying vec2 vUv;
      varying float vFresnel;

      void main() {
        vUv = uv;
        vLocalPos = position;

        float tailWeight = smoothstep(0.12, 0.95, uv.y);
        vec3 displacedPos = position;

        float waveTime = uTime * uNoiseSpeed + uGhostId * 1.618;
        vec3 noiseCoord = vec3(position.x * uNoiseScale, position.y * uNoiseScale * 0.8 + waveTime * 0.6, position.z * uNoiseScale);

        float n1 = snoise(noiseCoord);
        float n2 = snoise(noiseCoord * 2.2 + vec3(2.4, 7.1, 4.3));

        float sineWave = sin(waveTime * 3.2 + position.y * 3.2) * 0.16;
        float cosWave = cos(waveTime * 2.6 + position.y * 2.8) * 0.12;

        displacedPos.x += (sineWave + n1 * 0.32) * tailWeight * uNoiseTurbulence;
        displacedPos.z += (cosWave + n2 * 0.28) * tailWeight * uNoiseTurbulence;
        displacedPos += normal * (n1 * 0.22 + n2 * 0.12) * tailWeight * uNoiseTurbulence;

        displacedPos.z -= tailWeight * 0.32 * uNoiseTurbulence;

        vec4 worldPos = modelMatrix * vec4(displacedPos, 1.0);
        vWorldPosition = worldPos.xyz;
        vNormal = normalize(mat3(modelMatrix) * normal);

        vec3 viewDir = normalize(cameraPosition - worldPos.xyz);
        vFresnel = pow(1.0 - abs(dot(vNormal, viewDir)), 2.0);

        gl_Position = projectionMatrix * viewMatrix * worldPos;
      }
    `;

    const ghostFragmentShader = `
      ${noiseGLSL}

      uniform vec3 uColorPrimary;
      uniform vec3 uColorSecondary;
      uniform float uFresnelPower;
      uniform float uAlpha;
      uniform float uTime;
      uniform float uGhostId;
      uniform bool uInvertAchromatic;

      varying vec3 vNormal;
      varying vec3 vWorldPosition;
      varying vec3 vLocalPos;
      varying vec2 vUv;
      varying float vFresnel;

      void main() {
        vec3 viewDir = normalize(cameraPosition - vWorldPosition);
        float fresnel = pow(1.0 - abs(dot(normalize(vNormal), viewDir)), uFresnelPower);

        float tailFade = smoothstep(1.0, 0.62, vUv.y);

        float noise = snoise(vec3(vWorldPosition * 0.45 + vec3(0.0, uTime * 0.35, 0.0))) * 0.5 + 0.5;

        vec3 ghostColor = mix(uColorPrimary, uColorSecondary, clamp(fresnel * 1.15 + noise * 0.25, 0.0, 1.0));

        float eyeMask = 1.0;
        if (vUv.y > 0.12 && vUv.y < 0.28 && vLocalPos.z > 0.18) {
          vec2 leftEye = vec2(0.44, 0.19);
          vec2 rightEye = vec2(0.56, 0.19);
          
          float dLeft = length((vUv - leftEye) * vec2(1.0, 2.2));
          float dRight = length((vUv - rightEye) * vec2(1.0, 2.2));
          float eyeDist = min(dLeft, dRight);

          if (eyeDist < 0.042) {
            float eyeCore = smoothstep(0.042, 0.015, eyeDist);
            eyeMask = 1.0 - eyeCore * 0.95;
          }
        }

        ghostColor *= eyeMask;

        float alpha = (fresnel * 0.72 + 0.28) * tailFade * uAlpha;

        if (uInvertAchromatic) {
          gl_FragColor = vec4(ghostColor, alpha);
        } else {
          gl_FragColor = vec4(ghostColor * (1.0 + fresnel * 0.85), alpha);
        }
      }
    `;

    // =========================================================================

    function applyColorScheme(schemeName) {

      params.ghostColorPrimary = scheme.ghostPrimary;
      params.ghostColorSecondary = scheme.ghostSecondary;
      params.flameColor = scheme.flameColor;
      params.lanternMetalColor = scheme.lanternMetal;
      params.backgroundColor = scheme.bg;

      const isAchromaticInverted = !!scheme.invertAchromatic;

      ghosts.forEach(g => {
        g.mat.uniforms.uColorPrimary.value.set(scheme.ghostPrimary);
        g.mat.uniforms.uColorSecondary.value.set(scheme.ghostSecondary);
        g.mat.uniforms.uInvertAchromatic.value = isAchromaticInverted;
      });

      flameMat.color.set(scheme.flameColor);
      flameSpriteMat.color.set(scheme.flameColor);
      lanternLight.color.set(scheme.flameColor);
      ironMaterial.color.set(scheme.lanternMetal);
      particleMat.color.set(scheme.particles);

      if (!params.greenscreen) {
        scene.background.set(scheme.bg);
        scene.fog.color.set(scheme.bg);
      }
    }

    function updateGreenscreen(enable) {
      params.greenscreen = enable;
      if (enable) {
        scene.background.set('#00ff00');
        scene.fog.color.set('#00ff00');
      } else {
        scene.background.set(params.backgroundColor);
        scene.fog.color.set(params.backgroundColor);
      }
    }

    // =========================================================================
    // LIL-GUI SETUP
    // =========================================================================
    const gui = new GUI({ title: 'Ghost Swarm Settings' });

    const fPresets = gui.addFolder('Presets & Dynamics');
    fPresets.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Color Scheme').onChange((val) => {
      applyColorScheme(val);
      gui.controllersRecursive().forEach(c => c.updateDisplay());
    });
    fPresets.add(params, 'animationMode', ANIMATION_MODES).name('Animation Mode');
    fPresets.add(params, 'animationSpeed', 0.0, 3.0, 0.05).name('Animation Speed');
    fPresets.add(params, 'pixelRatio', 0.5, 3.0, 0.25).name('Pixel Ratio (DPR)').onChange((val) => {
      renderer.setPixelRatio(val);
      postProcessor.setSize(window.innerWidth, window.innerHeight, val);
    });
    fPresets.add(params, 'clickToRandomize').name('Click Scene to Randomize');

    // Exposure & Scene Lighting Folder
    const fLighting = gui.addFolder('Exposure & Lighting');
    fLighting.add(params, 'exposure', 0.1, 4.0, 0.05).name('Exposure').onChange((val) => {
      renderer.toneMappingExposure = val;
      postProcessor.settings.exposure = val;
      postProcessor.updateSettings();
    });
    fLighting.add(params, 'sceneLightIntensity', 0.0, 4.0, 0.05).name('Scene Light Intensity').onChange((val) => {
      ambientLight.intensity = params.ambientLightIntensity * val;
      rimLight.intensity = 0.25 * val;
      lanternLight.intensity = params.flameIntensity * val;
    });
    fLighting.add(params, 'ambientLightIntensity', 0.0, 2.0, 0.05).name('Ambient Light Intensity').onChange((val) => {
      ambientLight.intensity = val * params.sceneLightIntensity;
    });

    const fEnv = gui.addFolder('Environment & Greenscreen');
    fEnv.add(params, 'greenscreen').name('Greenscreen (#00ff00)').onChange((val) => {
      updateGreenscreen(val);
    });
    fEnv.addColor(params, 'backgroundColor').name('Background Color').onChange((val) => {
      if (!params.greenscreen) {
        scene.background.set(val);
        scene.fog.color.set(val);
      }
    });
    fEnv.add(params, 'fogDensity', 0.0, 0.1, 0.005).name('Fog Density').onChange((val) => {
      scene.fog.density = val;
    });

    const fGhosts = gui.addFolder('Ghost Swarm');
    fGhosts.add(params, 'ghostCount', 5, MAX_GHOSTS, 1).name('Ghost Count').onChange((val) => {
      ghosts.forEach((g, idx) => {
        g.mesh.visible = idx < val;
      });
    });
    fGhosts.addColor(params, 'ghostColorPrimary').name('Primary Color').onChange((val) => {
      ghosts.forEach(g => g.mat.uniforms.uColorPrimary.value.set(val));
    });
    fGhosts.addColor(params, 'ghostColorSecondary').name('Secondary Rim Color').onChange((val) => {
      ghosts.forEach(g => g.mat.uniforms.uColorSecondary.value.set(val));
    });
    fGhosts.add(params, 'ghostScale', 0.4, 2.5, 0.05).name('Ghost Scale');
    fGhosts.add(params, 'ghostOpacity', 0.1, 1.0, 0.02).name('Opacity').onChange((val) => {
      ghosts.forEach(g => g.mat.uniforms.uAlpha.value = val);
    });
    fGhosts.add(params, 'noiseTurbulence', 0.0, 3.0, 0.05).name('Noise Turbulence').onChange((val) => {
      ghosts.forEach(g => g.mat.uniforms.uNoiseTurbulence.value = val);
    });
    fGhosts.add(params, 'noiseSpeed', 0.1, 3.0, 0.05).name('Noise Speed').onChange((val) => {
      ghosts.forEach(g => g.mat.uniforms.uNoiseSpeed.value = val);
    });
    fGhosts.add(params, 'fresnelPower', 0.5, 4.0, 0.1).name('Fresnel Glow').onChange((val) => {
      ghosts.forEach(g => g.mat.uniforms.uFresnelPower.value = val);
    });
    fGhosts.add(params, 'additiveBlending').name('Additive Blending').onChange((val) => {
      ghosts.forEach(g => {
        g.mat.blending = val ? THREE.AdditiveBlending : THREE.NormalBlending;
        g.mat.needsUpdate = true;
      });
    });
    fGhosts.add(params, 'orbitRadius', 2.5, 14.0, 0.1).name('Orbit Radius');
    fGhosts.add(params, 'orbitSpread', 0.5, 8.0, 0.1).name('Orbit Spread');

    const fLantern = gui.addFolder('Lantern & Soul Fire');
    fLantern.add(params, 'showLantern').name('Show Lantern').onChange((val) => {
      lanternPivot.visible = val;
    });
    fLantern.addColor(params, 'flameColor').name('Flame Color').onChange((val) => {
      flameMat.color.set(val);
      flameSpriteMat.color.set(val);
      lanternLight.color.set(val);
    });
    fLantern.addColor(params, 'lanternMetalColor').name('Iron Metal Color').onChange((val) => {
      ironMaterial.color.set(val);
    });
    fLantern.add(params, 'flameIntensity', 0.0, 6.0, 0.1).name('Flame Light Intensity');
    fLantern.add(params, 'flameFlicker', 0.0, 2.5, 0.05).name('Flame Flicker');
    fLantern.add(params, 'lanternSway', 0.0, 2.5, 0.05).name('Lantern Sway');

    const fParticles = gui.addFolder('Ethereal Motes');
    fParticles.add(params, 'particleSize', 0.05, 1.0, 0.02).name('Particle Size').onChange((val) => {
      particleMat.size = val;
    });
    fParticles.add(params, 'particleOpacity', 0.05, 1.0, 0.02).name('Particle Opacity').onChange((val) => {
      particleMat.opacity = val;
    });

    // Attach full PostProcessor GUI suite (all postprocessing controls remain independent of randomize)
    postProcessor.attachGUI(gui, "Post-Processing (PostProcessor.js)");

    // Randomize Action: Shuffles scene parameters, strictly preserving post-processing settings
    function randomizeAllParameters() {
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      params.colorScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      applyColorScheme(params.colorScheme);

      params.animationMode = ANIMATION_MODES[Math.floor(Math.random() * ANIMATION_MODES.length)];
      params.ghostCount = Math.floor(16 + Math.random() * 26);
      params.ghostScale = +(0.75 + Math.random() * 0.9).toFixed(2);
      params.noiseTurbulence = +(0.8 + Math.random() * 1.6).toFixed(2);
      params.noiseSpeed = +(0.6 + Math.random() * 1.4).toFixed(2);
      params.fresnelPower = +(1.4 + Math.random() * 2.0).toFixed(2);
      params.ghostOpacity = +(0.65 + Math.random() * 0.3).toFixed(2);
      params.orbitRadius = +(4.0 + Math.random() * 5.5).toFixed(1);
      params.orbitSpread = +(2.0 + Math.random() * 4.0).toFixed(1);
      params.flameFlicker = +(0.6 + Math.random() * 1.2).toFixed(2);
      params.lanternSway = +(0.6 + Math.random() * 1.2).toFixed(2);
      params.animationSpeed = +(0.7 + Math.random() * 0.8).toFixed(2);

      ghosts.forEach((g, idx) => {
        g.mesh.visible = idx < params.ghostCount;
        g.mat.uniforms.uNoiseTurbulence.value = params.noiseTurbulence;
        g.mat.uniforms.uNoiseSpeed.value = params.noiseSpeed;
        g.mat.uniforms.uFresnelPower.value = params.fresnelPower;
        g.mat.uniforms.uAlpha.value = params.ghostOpacity;
      });

      // Update scene GUI displays without altering postProcessor settings
      gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    gui.add({ randomize: randomizeAllParameters }, 'randomize').name('🎲 Randomize Scene');

    // =========================================================================
    // INTERACTION & KEYBOARD SHORTCUTS
    // =========================================================================
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        gui._hidden ? gui.show() : gui.hide();
      }
    });

    let pointerDownPos = { x: 0, y: 0 };
    let pointerDownTime = 0;

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest && e.target.closest('.lil-gui')) return;
      pointerDownPos.x = e.clientX;
      pointerDownPos.y = e.clientY;
      pointerDownTime = performance.now();
    });

    window.addEventListener('pointerup', (e) => {
      if (e.target.closest && e.target.closest('.lil-gui')) return;
      const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
      const elapsed = performance.now() - pointerDownTime;

      if (dist < 6 && elapsed < 400 && params.clickToRandomize) {
        randomizeAllParameters();
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      postProcessor.setSize(window.innerWidth, window.innerHeight, params.pixelRatio);
    });

    // =========================================================================
    // TRAJECTORY COMPUTATION FOR ANIMATION MODES
    // =========================================================================
    function computeGhostPosition(ghostData, t, mode) {
      const { phase, speed, inclinationX, inclinationZ, verticalFreq, verticalAmp } = ghostData;
      const baseR = params.orbitRadius + (ghostData.radius / 10.0) * params.orbitSpread;
      const phi = phase + t * speed * 0.75;

      let x = 0, y = 0, z = 0;

      switch (mode) {
        case 'Lantern Focus': {
          const tightR = baseR * 0.58;
          x = Math.sin(phi) * tightR;
          z = Math.cos(phi) * tightR;
          y = Math.sin(t * verticalFreq * 1.2 + phase * 2.0) * (verticalAmp * 0.65) - 0.2;
          break;
        }
        case 'Spectral Vortex': {
          const vortexHeight = ((phi * 1.5) % 10.0) - 5.0;
          const vortexR = baseR * (0.45 + (vortexHeight + 5.0) * 0.08);
          x = Math.sin(phi * 1.8) * vortexR;
          z = Math.cos(phi * 1.8) * vortexR;
          y = vortexHeight;
          break;
        }
        case 'Ethereal Drift': {
          const driftX = Math.sin(t * 0.35 + phase) * 2.5;
          x = Math.sin(phi) * baseR + driftX;
          z = Math.cos(phi) * baseR;
          y = Math.sin(t * verticalFreq + phase) * (verticalAmp * 1.4);
          break;
        }
        case 'Haunted Pulse': {
          const pulseFactor = 1.0 + Math.sin(t * 1.2) * 0.38;
          const pulseR = baseR * pulseFactor;
          x = Math.sin(phi) * pulseR;
          z = Math.cos(phi) * pulseR;
          y = Math.sin(t * verticalFreq + phase * 1.5) * verticalAmp;
          break;
        }
        case 'Moonlight Serenade': {
          x = Math.sin(phi) * baseR;
          z = Math.sin(phi * 2.0) * (baseR * 0.65);
          y = Math.cos(phi) * (verticalAmp * 1.1);
          break;
        }
        case 'Whispering Swarm': {
          const tightR = baseR * 0.72;
          const jitterX = Math.sin(t * 3.5 + phase * 3.0) * 0.35;
          const jitterY = Math.cos(t * 2.8 + phase * 2.5) * 0.35;
          x = Math.sin(phi) * tightR + jitterX;
          z = Math.cos(phi) * tightR;
          y = Math.sin(t * verticalFreq + phase) * verticalAmp + jitterY;
          break;
        }
        case 'Static Chamber':
        case 'Ghostly Orbit':
        default: {
          x = Math.sin(phi) * baseR;
          z = Math.cos(phi) * baseR;
          y = Math.sin(t * verticalFreq + phase * 2.0) * verticalAmp;
          break;
        }
      }

      const cosX = Math.cos(inclinationX), sinX = Math.sin(inclinationX);
      const cosZ = Math.cos(inclinationZ), sinZ = Math.sin(inclinationZ);

      let y1 = y * cosX - z * sinX;
      let z1 = y * sinX + z * cosX;

      let x2 = x * cosZ - y1 * sinZ;
      let y2 = x * sinZ + y1 * cosZ;

      return new THREE.Vector3(x2, y2, z1);
    }

    // =========================================================================
    // CINEMATIC CAMERA MODES
    // =========================================================================
    function updateCinematicCamera(t, mode) {
      if (isUserInteracting) return;

      switch (mode) {
        case 'Static Chamber':
          break;
        case 'Lantern Focus': {
          const r = 8.5;
          const camAngle = t * 0.06;
          camera.position.x = Math.sin(camAngle) * r;
          camera.position.z = Math.cos(camAngle) * r;
          camera.position.y = 1.0 + Math.sin(t * 0.12) * 0.8;
          controls.target.set(0, 0.0, 0);
          break;
        }
        case 'Spectral Vortex': {
          const camAngle = t * 0.08;
          camera.position.x = Math.sin(camAngle) * 14.0;
          camera.position.z = Math.cos(camAngle) * 14.0;
          camera.position.y = -2.2 + Math.sin(t * 0.1) * 1.2;
          controls.target.set(0, 1.2, 0);
          break;
        }
        case 'Ethereal Drift': {
          camera.position.x = Math.sin(t * 0.09) * 8.0;
          camera.position.z = 15.0 + Math.cos(t * 0.07) * 2.5;
          camera.position.y = 2.4 + Math.cos(t * 0.1) * 1.2;
          controls.target.set(0, 0.2, 0);
          break;
        }
        case 'Haunted Pulse': {
          const r = 14.5 + Math.sin(t * 0.45) * 3.8;
          camera.position.x = Math.sin(t * 0.06) * r;
          camera.position.z = Math.cos(t * 0.06) * r;
          camera.position.y = 2.6;
          controls.target.set(0, 0.0, 0);
          break;
        }
        case 'Moonlight Serenade': {
          camera.position.x = Math.sin(t * 0.09) * 15.0;
          camera.position.z = Math.cos(t * 0.09) * 15.0;
          camera.position.y = 2.0 + Math.sin(t * 0.18) * 2.8;
          controls.target.set(0, 0.2, 0);
          break;
        }
        case 'Whispering Swarm': {
          const camAngle = t * 0.07;
          camera.position.x = Math.sin(camAngle) * 12.5;
          camera.position.z = Math.cos(camAngle) * 12.5;
          camera.position.y = 8.0 + Math.sin(t * 0.12) * 1.6;
          controls.target.set(0, -0.4, 0);
          break;
        }
        case 'Ghostly Orbit':
        default: {
          const camAngle = t * 0.08;
          camera.position.x = Math.sin(camAngle) * 16.0;
          camera.position.z = Math.cos(camAngle) * 16.0;
          camera.position.y = 2.4 + Math.sin(t * 0.15) * 1.6;
          controls.target.set(0, 0.2, 0);
          break;
        }
      }
    }

    // =========================================================================
    // MAIN RENDER LOOP (Auto Infinite Animation)
    // =========================================================================
    const clock = new THREE.Clock();
    let simTime = 0;
    const flameWorldPos = new THREE.Vector3();

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      simTime += delta * params.animationSpeed;

      // 1. Lantern gentle supernatural sway & flicker
      const swayZ = Math.sin(simTime * 0.9) * 0.06 * params.lanternSway;
      const swayX = Math.cos(simTime * 0.7) * 0.04 * params.lanternSway;
      lanternPivot.rotation.z = swayZ;
      lanternPivot.rotation.x = swayX;

      const flicker = (Math.sin(simTime * 14.0) * 0.14 + Math.sin(simTime * 31.0) * 0.09 + Math.cos(simTime * 47.0) * 0.06) * params.flameFlicker;
      lanternLight.intensity = Math.max(0.1, params.flameIntensity * params.sceneLightIntensity * (1.0 + flicker));
      flameSprite.scale.setScalar(2.3 + flicker * 0.5);
      flameMesh.scale.set(1.0 + flicker * 0.2, 1.0 + flicker * 0.35, 1.0 + flicker * 0.2);

      // 2. Ghost Swarm Movement & Shader Update
      const dtAhead = 0.04;
      for (let i = 0; i < params.ghostCount; i++) {
        const g = ghosts[i];
        const pCurrent = computeGhostPosition(g.data, simTime, params.animationMode);
        const pNext = computeGhostPosition(g.data, simTime + dtAhead, params.animationMode);

        g.mesh.position.copy(pCurrent);

        const dir = new THREE.Vector3().subVectors(pNext, pCurrent).normalize();
        if (dir.lengthSq() > 0.0001) {
          const targetLook = new THREE.Vector3().addVectors(pCurrent, dir);
          g.mesh.lookAt(targetLook);
          const roll = Math.sin(simTime * 2.0 + g.data.phase) * 0.25;
          g.mesh.rotateZ(roll);
        }

        const scale = params.ghostScale * g.data.scaleOffset;
        g.mesh.scale.set(scale, scale, scale);

        g.mat.uniforms.uTime.value = simTime;
      }

      // 3. Ethereal Motes / Particles Update
      const pPos = particleGeo.attributes.position.array;
      for (let p = 0; p < params.particleCount; p++) {
        pPos[p * 3 + 1] += particleSpeeds[p * 3 + 1] * delta * params.animationSpeed * 1.5;
        pPos[p * 3] += Math.sin(simTime * 0.5 + p) * 0.015;
        pPos[p * 3 + 2] += Math.cos(simTime * 0.5 + p) * 0.015;

        if (pPos[p * 3 + 1] > 7.0) {
          pPos[p * 3 + 1] = -5.0;
        }
      }
      particleGeo.attributes.position.needsUpdate = true;

      // 4. Camera Animation
      updateCinematicCamera(simTime, params.animationMode);

      controls.update();

      // 5. Update Godrays light source to center on the lantern flame
      flameMesh.getWorldPosition(flameWorldPos);
      postProcessor.setMoonScreenPosition(camera, flameWorldPos);

      // 6. Render Scene via PostProcessor Pipeline
      postProcessor.renderScene(scene, camera);
    }

    animate();
  </script>
</body>
