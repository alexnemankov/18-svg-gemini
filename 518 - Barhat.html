<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Бархатная ткань и шёлковые волны</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0c0204;
    }
    #webgl-canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }
  </style>

  <!-- Import maps polyfill & scripts -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
    }
  }
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
  <canvas id="webgl-canvas"></canvas>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import GUI from 'lil-gui';

    // =========================================================================================
    // EMBEDDED POST PROCESSOR SUITE (Standalone inline to bypass file:// CORS restrictions)
    // =========================================================================================
    const orthoVertexShader = `
    precision highp float;
    in vec3 position;
    out vec2 vUv;
    void main() {
      vUv = position.xy * 0.5 + 0.5;
      gl_Position = vec4(position.xy, 0.0, 1.0);
    }
    `;

    const brightFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float bloomThreshold;
    in vec2 vUv;
    out vec4 fragColor;

    vec3 sanitize(vec3 v) {
      if (isnan(v.x) || isinf(v.x)) v.x = 0.0;
      if (isnan(v.y) || isinf(v.y)) v.y = 0.0;
      if (isnan(v.z) || isinf(v.z)) v.z = 0.0;
      return clamp(v, vec3(0.0), vec3(65000.0));
    }

    void main() {
      vec4 raw = texture(inputTexture, vUv);
      vec3 color = sanitize(raw.rgb);
      float luminance = max(0.0, dot(color, vec3(0.2126, 0.7152, 0.0722)));
      float knee = 0.1;
      float soft = luminance - bloomThreshold + knee;
      soft = clamp(soft, 0.0, 2.0 * knee);
      soft = (soft * soft) / (4.0 * knee + 0.00001);
      float contribution = max(soft, luminance - bloomThreshold);
      contribution /= max(luminance, 0.0001);
      vec3 result = color * contribution;
      fragColor = vec4(sanitize(result), clamp(raw.a, 0.0, 1.0));
    }
    `;

    const blur13ShaderChunk = `
    vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
      vec2 resolution = vec2(textureSize(image, 0));
      vec4 color = vec4(0.0);
      vec2 off1 = vec2(1.411764705882353) * direction;
      vec2 off2 = vec2(3.2941176470588234) * direction;
      vec2 off3 = vec2(5.176470588235294) * direction;
      color += texture(image, uv) * 0.1964825501511404;
      color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
      color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
      return color;
    }
    `;

    const blurFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 direction;
    in vec2 vUv;
    out vec4 color;
    ${blur13ShaderChunk}

    vec4 sanitize(vec4 v) {
      if (isnan(v.x) || isinf(v.x)) v.x = 0.0;
      if (isnan(v.y) || isinf(v.y)) v.y = 0.0;
      if (isnan(v.z) || isinf(v.z)) v.z = 0.0;
      if (isnan(v.w) || isinf(v.w)) v.w = 0.0;
      return clamp(v, vec4(0.0), vec4(65000.0));
    }

    void main() {
      color = sanitize(blur13(inputTexture, vUv, direction));
    }
    `;

    const godRaysDepthMaskShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float threshold;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float lum = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float factor = smoothstep(threshold, threshold + 0.15, lum);
      fragColor = vec4(vec3(factor), 1.0);
    }
    `;

    const godRaysGenerateShader = `
    precision highp float;
    #define TAPS_PER_PASS 6.0
    uniform sampler2D inputTexture;
    uniform vec3 vSunPositionScreenSpace;
    uniform float fStepSize;
    uniform float distanceAttenuation;
    uniform float maxDensity;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec2 delta = vSunPositionScreenSpace.xy - vUv;
      float dist = length(delta);
      vec2 stepv = fStepSize * delta / max(dist, 0.0001);
      float iters = dist / max(fStepSize, 0.00001);

      vec2 uv = vUv;
      float col = 0.0;
      float f = min(1.0, max(vSunPositionScreenSpace.z, 0.0));
      float atten = 1.0 / (1.0 + pow(dist, distanceAttenuation));

      if (0.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (1.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (2.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (3.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (4.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (5.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;

      float finalVal = min(col / TAPS_PER_PASS * atten, maxDensity);
      fragColor = vec4(vec3(finalVal), 1.0);
    }
    `;

    const anamorphicBrightShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float threshold;
    uniform float smoothWidth;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float v = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float alpha = smoothstep(threshold, threshold + smoothWidth, v);
      fragColor = mix(vec4(0.0), color, alpha);
    }
    `;

    const anamorphicBlurShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 resolution;
    uniform float samples;
    uniform float intensity;
    uniform vec3 tintColor;
    uniform float bloomRadius;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      int halfSamples = max(1, int(samples) / 2);
      float fHalfSamples = float(halfSamples);
      vec2 invSize = 1.0 / resolution;
      vec4 total = vec4(0.0);

      for (int i = -64; i <= 64; i++) {
        if (i < -halfSamples || i > halfSamples) continue;
        float softness = 1.0 - abs(float(i)) / fHalfSamples;
        softness = pow(softness, 2.0);
        vec2 shiftedUV = vec2(vUv.x + invSize.x * float(i) * (4.0 + bloomRadius * 8.0), vUv.y);
        shiftedUV = clamp(shiftedUV, 0.001, 0.999);
        total += texture(inputTexture, shiftedUV) * softness;
      }

      fragColor = (total / (samples / 3.0)) * vec4(tintColor, 1.0) * intensity;
    }
    `;

    const finalFragmentShader = `
    precision highp float;
    uniform vec2 resolution;
    uniform sampler2D inputTexture;
    uniform sampler2D blur0Texture;
    uniform sampler2D blur1Texture;
    uniform sampler2D blur2Texture;
    uniform sampler2D blur3Texture;
    uniform sampler2D blur4Texture;
    uniform sampler2D raysTexture;
    uniform sampler2D anamorphicTexture;
    uniform bool bloomEnabled;
    uniform float bloomStrength;
    uniform bool raysEnabled;
    uniform float raysStrength;
    uniform vec3 raysColor;
    uniform bool anamorphicEnabled;
    uniform float vignetteBoost;
    uniform float vignetteReduction;
    uniform float noiseIntensity;
    uniform float time;
    in vec2 vUv;
    out vec4 fragColor;

    vec3 sanitize(vec3 v) {
      if (isnan(v.x) || isinf(v.x)) v.x = 0.0;
      if (isnan(v.y) || isinf(v.y)) v.y = 0.0;
      if (isnan(v.z) || isinf(v.z)) v.z = 0.0;
      return clamp(v, vec3(0.0), vec3(65000.0));
    }

    float vignette(vec2 uv, float boost, float reduction) {
      vec2 position = vUv - 0.5;
      return boost - length(position) * reduction;
    }

    float hash1(uint n) {
      n = (n << 13U) ^ n;
      n = n * (n * n * 15731U + 789221U) + 1376312589U;
      return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
    }

    float noise(in vec2 uv, in float timeVal) {
      uvec2 p = uvec2(uv);
      return hash1(p.x + 1920U * p.y + (1920U * 1080U) * (uint(timeVal) % 65536U));
    }

    void main() {
      vec4 raw = texture(inputTexture, vUv);
      vec3 color = sanitize(raw.rgb);

      if (bloomEnabled && bloomStrength > 0.001) {
        vec3 b0 = sanitize(texture(blur0Texture, vUv).rgb);
        vec3 b1 = sanitize(texture(blur1Texture, vUv).rgb);
        vec3 b2 = sanitize(texture(blur2Texture, vUv).rgb);
        vec3 b3 = sanitize(texture(blur3Texture, vUv).rgb);
        vec3 b4 = sanitize(texture(blur4Texture, vUv).rgb);

        vec3 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
        color += bloomSum * bloomStrength;
      }

      if (raysEnabled && raysStrength > 0.001) {
        vec3 r = sanitize(texture(raysTexture, vUv).rgb);
        color += r * raysColor * raysStrength;
      }

      if (anamorphicEnabled) {
        vec3 a = sanitize(texture(anamorphicTexture, vUv).rgb);
        color += a;
      }

      float vig = max(0.0, vignette(vUv, vignetteBoost, vignetteReduction));
      color *= vig;
      color += max(0.0, noiseIntensity) * noise(gl_FragCoord.xy, time);
      fragColor = vec4(sanitize(color), 1.0);
    }
    `;

    const chromaticAberrationShaderChunk = `
    vec2 barrelDistortion(vec2 coord, float amt) {
      vec2 cc = coord - 0.5;
      float dist = dot(cc, cc);
      return coord + cc * dist * amt;
    }
    float sat(float t) { return clamp(t, 0.0, 1.0); }
    float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
    float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
    vec4 spectrum_offset(float t) {
      float lo = step(t, 0.5);
      float hi = 1.0 - lo;
      float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
      vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
      return pow(ret, vec4(1.0 / 2.2));
    }
    const float max_distort = 2.2;
    const int num_iter = 8;
    const float reci_num_iter_f = 1.0 / float(num_iter);
    vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
      vec4 sumcol = vec4(0.0);
      vec4 sumw = vec4(0.0);
      for (int i = 0; i < num_iter; ++i) {
        float t = float(i) * reci_num_iter_f;
        vec4 w = spectrum_offset(t);
        sumw += w;
        sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
      }
      return sumcol / sumw;
    }
    `;

    const colorFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float chromaticAberrationAmount;
    uniform float minInputLevel;
    uniform float maxInputLevel;
    uniform float gammaLevel;
    uniform float exposure;
    uniform float fisheyeStrength;
    uniform float fisheyeRadius;
    uniform float time;
    uniform int visionMode;
    uniform float thermalSensitivity;
    uniform float nightVisionNoise;
    uniform float nightVisionGain;
    uniform float crtIntensity;
    in vec2 vUv;
    out vec4 fragColor;

    ${chromaticAberrationShaderChunk}

    vec2 applyFisheye(vec2 uv, float strength, float radius) {
      if (abs(strength) < 0.0001) return uv;
      vec2 p = uv - 0.5;
      float d = length(p);
      if (d > radius * 1.5) return uv;
      float r = d / max(radius, 0.001);
      float theta = atan(p.y, p.x);
      float rDist = r + strength * (r * r * r);
      return 0.5 + vec2(cos(theta), sin(theta)) * (rDist * radius);
    }

    vec3 ACESFilmicToneMapping(vec3 color) {
      color = max(vec3(0.0), color);
      float a = 2.51;
      float b = 0.03;
      float c = 2.43;
      float d = 0.59;
      float e = 0.14;
      vec3 denom = max(color * (c * color + d) + e, vec3(0.0001));
      return clamp((color * (a * color + b)) / denom, 0.0, 1.0);
    }

    vec3 gammaCorrect(vec3 color, vec3 gamma) {
      return pow(max(color, vec3(0.0)), 1.0 / max(gamma, vec3(0.001)));
    }
    vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
      return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
    }
    vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
      return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
    }

    void main() {
      vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
      vec4 col = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
      vec3 finalCol = col.rgb;
      if (isnan(finalCol.x) || isinf(finalCol.x)) finalCol.x = 0.0;
      if (isnan(finalCol.y) || isinf(finalCol.y)) finalCol.y = 0.0;
      if (isnan(finalCol.z) || isinf(finalCol.z)) finalCol.z = 0.0;
      finalCol = clamp(finalCol, vec3(0.0), vec3(65000.0));

      vec3 exposedColor = finalCol * exposure;
      vec3 toneMappedColor = ACESFilmicToneMapping(exposedColor);
      finalCol = finalLevels(toneMappedColor, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));

      fragColor = vec4(finalCol, 1.0);
    }
    `;

    const copyFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      fragColor = texture(inputTexture, vUv);
    }
    `;

    const fxaaFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 resolution;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec2 inverseVP = 1.0 / resolution;
      vec3 rgbNW = texture(inputTexture, vUv + vec2(-1.0, -1.0) * inverseVP).rgb;
      vec3 rgbNE = texture(inputTexture, vUv + vec2(1.0, -1.0) * inverseVP).rgb;
      vec3 rgbSW = texture(inputTexture, vUv + vec2(-1.0, 1.0) * inverseVP).rgb;
      vec3 rgbSE = texture(inputTexture, vUv + vec2(1.0, 1.0) * inverseVP).rgb;
      vec3 rgbM  = texture(inputTexture, vUv).rgb;

      vec3 luma = vec3(0.299, 0.587, 0.114);
      float lumaNW = dot(rgbNW, luma);
      float lumaNE = dot(rgbNE, luma);
      float lumaSW = dot(rgbSW, luma);
      float lumaSE = dot(rgbSE, luma);
      float lumaM  = dot(rgbM,  luma);

      float lumaMin = min(lumaM, min(min(lumaNW, lumaNE), min(lumaSW, lumaSE)));
      float lumaMax = max(lumaM, max(max(lumaNW, lumaNE), max(lumaSW, lumaSE)));

      vec2 dir;
      dir.x = -((lumaNW + lumaNE) - (lumaSW + lumaSE));
      dir.y =  ((lumaNW + lumaSW) - (lumaNE + lumaSE));

      float dirReduce = max((lumaNW + lumaNE + lumaSW + lumaSE) * (0.25 * (1.0 / 8.0)), 1.0 / 128.0);
      float rcpDirMin = 1.0 / (min(abs(dir.x), abs(dir.y)) + dirReduce);

      dir = min(vec2(8.0, 8.0), max(vec2(-8.0, -8.0), dir * rcpDirMin)) * inverseVP;

      vec3 rgbA = 0.5 * (
          texture(inputTexture, vUv + dir * (1.0 / 3.0 - 0.5)).rgb +
          texture(inputTexture, vUv + dir * (2.0 / 3.0 - 0.5)).rgb);
      vec3 rgbB = rgbA * 0.5 + 0.25 * (
          texture(inputTexture, vUv + dir * -0.5).rgb +
          texture(inputTexture, vUv + dir * 0.5).rgb);

      float lumaB = dot(rgbB, luma);
      if ((lumaB < lumaMin) || (lumaB > lumaMax)) {
          fragColor = vec4(rgbA, 1.0);
      } else {
          fragColor = vec4(rgbB, 1.0);
      }
    }
    `;

    function createFBO(w, h, options = {}) {
      return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
        wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
        wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
        minFilter: options.minFilter || THREE.LinearFilter,
        magFilter: options.magFilter || THREE.LinearFilter,
        format: options.format || THREE.RGBAFormat,
        type: options.type || THREE.HalfFloatType,
        stencilBuffer: options.stencilBuffer || false,
        depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : false,
        samples: options.samples !== undefined ? options.samples : 0,
      });
    }

    class ShaderPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.shader.depthTest = false;
        this.shader.depthWrite = false;
        this.orthoScene = new THREE.Scene();
        this.fbo = createFBO(1, 1, options);
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
        this.texture = this.fbo.texture;
      }
      render(renderer, toScreen = false) {
        if (!toScreen) renderer.setRenderTarget(this.fbo);
        renderer.render(this.orthoScene, this.orthoCamera);
        if (!toScreen) renderer.setRenderTarget(null);
      }
      setSize(width, height) {
        this.fbo.setSize(Math.max(1, width), Math.max(1, height));
      }
    }

    class ShaderPingPongPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.shader.depthTest = false;
        this.shader.depthWrite = false;
        this.orthoScene = new THREE.Scene();
        this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
        this.currentFBO = 0;
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
      }
      render(renderer) {
        renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
        renderer.render(this.orthoScene, this.orthoCamera);
        renderer.setRenderTarget(null);
        this.currentFBO = 1 - this.currentFBO;
      }
      get current() { return this.fbos[this.currentFBO]; }
      get texture() { return this.current.texture; }
      setSize(width, height) {
        const w = Math.max(1, width);
        const h = Math.max(1, height);
        this.fbos[0].setSize(w, h);
        this.fbos[1].setSize(w, h);
      }
    }

    class BloomPass {
      constructor(strength = 0.8, radius = 0.5, threshold = 0.2, levels = 5) {
        this.strength = strength;
        this.radius = radius;
        this.threshold = threshold;
        this.enabled = true;
        this.levels = levels;

        this.brightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            bloomThreshold: { value: this.threshold },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: brightFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.brightPass = new ShaderPass(this.brightShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.blurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            direction: { value: new THREE.Vector2(0, 1) },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: blurFragmentShader,
          glslVersion: THREE.GLSL3,
        });

        this.blurPasses = [];
        for (let i = 0; i < this.levels; i++) {
          this.blurPasses.push(new ShaderPingPongPass(this.blurShader, {
            format: THREE.RGBAFormat,
            type: THREE.HalfFloatType,
          }));
        }
      }

      setSize(w, h) {
        let tw = Math.max(1, w);
        let th = Math.max(1, h);
        this.brightPass.setSize(tw, th);
        for (let i = 0; i < this.levels; i++) {
          tw = Math.max(1, Math.round(tw / 2));
          th = Math.max(1, Math.round(th / 2));
          this.blurPasses[i].setSize(tw, th);
        }
      }

      set source(texture) {
        this.brightShader.uniforms.inputTexture.value = texture;
      }

      render(renderer) {
        if (!this.enabled || this.strength <= 0.001) return;
        this.brightShader.uniforms.bloomThreshold.value = this.threshold;
        this.brightPass.render(renderer);

        const baseOffset = Math.max(0.1, this.radius * 2.0);
        const u = this.blurShader.uniforms;

        for (let j = 0; j < this.levels; j++) {
          const blurPass = this.blurPasses[j];
          const stepOffset = baseOffset * (1.0 + j * 0.5);

          u.direction.value.set(stepOffset, 0);
          u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
          blurPass.render(renderer);

          u.direction.value.set(0, stepOffset * 0.5);
          u.inputTexture.value = blurPass.current.texture;
          blurPass.render(renderer);
        }
      }
    }

    const ANTIALIAS_MODES = [
      "MSAA 4x (Standard)",
      "MSAA 2x (Fast)",
      "MSAA 8x (Ultra)",
      "FXAA (Fast Approximate)",
      "Off (No Anti-Aliasing)"
    ];

    class LocalPostProcessor {
      constructor(renderer, params = {}) {
        this.renderer = renderer;
        this.width = 1;
        this.height = 1;
        this.dpr = 1;

        this.settings = {
          enabled: params.enabled !== undefined ? params.enabled : true,
          antialiasMode: params.antialiasMode || "MSAA 4x (Standard)",
          msaaSamples: 4,
          fxaaEnabled: false,

          bloomEnabled: params.bloomEnabled !== undefined ? params.bloomEnabled : true,
          bloomStrength: params.bloomStrength !== undefined ? params.bloomStrength : 0.75,
          bloomRadius: params.bloomRadius !== undefined ? params.bloomRadius : 0.55,
          bloomThreshold: params.bloomThreshold !== undefined ? params.bloomThreshold : 0.22,

          raysEnabled: params.raysEnabled !== undefined ? params.raysEnabled : false,
          raysStrength: params.raysStrength !== undefined ? params.raysStrength : 0.85,
          raysDensity: 1.0,
          raysMaxDensity: 0.5,
          raysDistanceAttenuation: 2.0,
          raysThreshold: 0.12,
          raysColor: new THREE.Color(0xf6aa1c),

          // Anamorphic flare: DEFAULT IS OFF per requirement
          anamorphicEnabled: params.anamorphicEnabled !== undefined ? params.anamorphicEnabled : false,
          anamorphicIntensity: 5.0,
          anamorphicThreshold: 0.3,
          anamorphicSamples: 64,
          anamorphicRadius: 0.0,
          anamorphicSmoothWidth: 0.05,
          anamorphicColor: new THREE.Color(0x7a8aff),

          fisheyeStrength: 0.0,
          fisheyeRadius: 1.0,
          chromaticAberration: params.chromaticAberration !== undefined ? params.chromaticAberration : 0.012,
          vignetteBoost: params.vignetteBoost !== undefined ? params.vignetteBoost : 1.05,
          vignetteReduction: params.vignetteReduction !== undefined ? params.vignetteReduction : 0.55,
          noiseIntensity: params.noiseIntensity !== undefined ? params.noiseIntensity : 0.01,

          gamma: 1.0,
          minInputLevel: 0.0,
          maxInputLevel: 1.0,
          exposure: params.exposure !== undefined ? params.exposure : 1.05,
        };

        const maxSamples = (this.renderer && this.renderer.capabilities) ? (this.renderer.capabilities.maxSamples || 4) : 4;
        this.sceneTarget = createFBO(1, 1, { type: THREE.HalfFloatType, samples: Math.min(this.settings.msaaSamples, maxSamples), depthBuffer: true });

        this.bloomPass = new BloomPass(this.settings.bloomStrength, this.settings.bloomRadius, this.settings.bloomThreshold, 5);

        this.finalShader = new THREE.RawShaderMaterial({
          uniforms: {
            resolution: { value: new THREE.Vector2(1, 1) },
            bloomEnabled: { value: this.settings.bloomEnabled },
            bloomStrength: { value: this.settings.bloomStrength },
            raysEnabled: { value: false },
            raysStrength: { value: this.settings.raysStrength },
            raysColor: { value: this.settings.raysColor },
            anamorphicEnabled: { value: this.settings.anamorphicEnabled },
            vignetteBoost: { value: this.settings.vignetteBoost },
            vignetteReduction: { value: this.settings.vignetteReduction },
            noiseIntensity: { value: this.settings.noiseIntensity },
            inputTexture: { value: null },
            blur0Texture: { value: null },
            blur1Texture: { value: null },
            blur2Texture: { value: null },
            blur3Texture: { value: null },
            blur4Texture: { value: null },
            raysTexture: { value: null },
            anamorphicTexture: { value: null },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: finalFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.finalPass = new ShaderPass(this.finalShader);

        this.rgbShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: this.finalPass.texture },
            fisheyeStrength: { value: 0 },
            fisheyeRadius: { value: 1 },
            chromaticAberrationAmount: { value: this.settings.chromaticAberration },
            minInputLevel: { value: 0 },
            maxInputLevel: { value: 1 },
            gammaLevel: { value: 1 },
            exposure: { value: this.settings.exposure },
            visionMode: { value: 0 },
            thermalSensitivity: { value: 1.4 },
            nightVisionGain: { value: 2.1 },
            nightVisionNoise: { value: 0.05 },
            crtIntensity: { value: 0 },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: colorFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.rgbPass = new ShaderPass(this.rgbShader);

        this.fxaaShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            resolution: { value: new THREE.Vector2(1, 1) },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: fxaaFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.fxaaPass = new ShaderPass(this.fxaaShader);

        this.copyShader = new THREE.RawShaderMaterial({
          uniforms: { inputTexture: { value: null } },
          vertexShader: orthoVertexShader,
          fragmentShader: copyFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.copyPass = new ShaderPass(this.copyShader);
      }

      updateSettings() {
        this.bloomPass.enabled = this.settings.bloomEnabled;
        this.bloomPass.strength = this.settings.bloomStrength;
        this.bloomPass.radius = this.settings.bloomRadius;
        this.bloomPass.threshold = this.settings.bloomThreshold;

        this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
        this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
        this.finalShader.uniforms.anamorphicEnabled.value = this.settings.anamorphicEnabled;
        this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
        this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
        this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;

        this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
        this.rgbShader.uniforms.exposure.value = this.settings.exposure;
        this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
      }

      setSize(w0, h0, dpr = 1) {
        this.width = w0;
        this.height = h0;
        this.dpr = dpr;

        const baseW = Math.max(1, Math.floor(w0 * dpr));
        const baseH = Math.max(1, Math.floor(h0 * dpr));

        this.sceneTarget.setSize(baseW, baseH);
        this.finalPass.setSize(baseW, baseH);
        this.finalShader.uniforms.resolution.value.set(baseW, baseH);
        this.bloomPass.setSize(baseW, baseH);
        this.rgbPass.setSize(baseW, baseH);
        this.copyPass.setSize(baseW, baseH);
        this.fxaaPass.setSize(baseW, baseH);
        this.fxaaShader.uniforms.resolution.value.set(baseW, baseH);
      }

      renderScene(scene, camera) {
        if (!this.settings.enabled) {
          this.renderer.setRenderTarget(null);
          this.renderer.render(scene, camera);
          return;
        }

        this.renderer.setRenderTarget(this.sceneTarget);
        this.renderer.render(scene, camera);
        this.renderer.setRenderTarget(null);

        this.updateSettings();

        const sourceTexture = this.sceneTarget.texture;
        this.bloomPass.source = sourceTexture;
        this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
        this.bloomPass.render(this.renderer);

        this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
        this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
        this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
        this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
        this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

        this.finalPass.render(this.renderer);

        if (this.settings.fxaaEnabled) {
          this.rgbPass.render(this.renderer, false);
          this.fxaaShader.uniforms.inputTexture.value = this.rgbPass.texture;
          this.fxaaPass.render(this.renderer, true);
        } else {
          this.rgbPass.render(this.renderer, true);
        }
      }

      attachGUI(gui, title = "Постобработка (Post-Processing)") {
        const root = gui.addFolder(title);
        root.add(this.settings, "enabled").name("Включить постобработку");

        const bloom = root.addFolder("Свечение (Bloom)");
        bloom.add(this.settings, "bloomEnabled").name("Включить Bloom").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomStrength", 0, 3.0, 0.05).name("Сила свечения").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomRadius", 0, 2.0, 0.05).name("Радиус свечения").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomThreshold", 0, 1.0, 0.01).name("Порог свечения").onChange(() => this.updateSettings());

        const anamorphic = root.addFolder("Анаморфотные блики (Anamorphic)");
        anamorphic.add(this.settings, "anamorphicEnabled").name("Включить Anamorphic").onChange(() => this.updateSettings());

        const optics = root.addFolder("Оптика и виньетка");
        optics.add(this.settings, "chromaticAberration", 0, 0.08, 0.002).name("Хром. аберрация").onChange(() => this.updateSettings());
        optics.add(this.settings, "vignetteBoost", 0, 2.0, 0.05).name("Виньетка (Яркость)").onChange(() => this.updateSettings());
        optics.add(this.settings, "vignetteReduction", 0, 2.0, 0.05).name("Виньетка (Спад)").onChange(() => this.updateSettings());
        optics.add(this.settings, "noiseIntensity", 0, 0.05, 0.002).name("Зернистость").onChange(() => this.updateSettings());
        optics.add(this.settings, "gamma", 0.5, 2.0, 0.05).name("Гамма").onChange(() => this.updateSettings());

        return root;
      }

    postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);

    // --- PROCEDURAL MICROFIBER WEAVE TEXTURE ---
    function generateVelvetNormalTexture() {
      const size = 512;
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const ctx = c.getContext('2d');
      const imgData = ctx.createImageData(size, size);
      const d = imgData.data;

      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const idx = (y * size + x) * 4;
          const grain = (Math.sin((x + y) * 0.8) + Math.cos((x - y) * 0.8)) * 3.0;
          const pile = (Math.random() - 0.5) * 4.0;

          d[idx] = Math.max(0, Math.min(255, 128 + Math.round(grain + pile)));
          d[idx + 1] = Math.max(0, Math.min(255, 128 + Math.round(grain + pile)));
          d[idx + 2] = 255;
          d[idx + 3] = 255;
        }
      }
      ctx.putImageData(imgData, 0, 0);
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(32, 32);
      return tex;
    }
    const velvetNormalMap = generateVelvetNormalTexture();

    // --- LIGHTING SYSTEM (RICH SIDE-LIGHTING & VELVET GLOW) ---
    const keyLight = new THREE.DirectionalLight(params.keyLightColor, params.keyLightIntensity);
    keyLight.position.set(params.keyLightX, params.keyLightY, params.keyLightZ);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(params.fillLightColor, params.fillLightIntensity);
    fillLight.position.set(params.fillLightX, params.fillLightY, params.fillLightZ);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(params.rimLightColor, params.rimLightIntensity);
    rimLight.position.set(params.rimLightX, params.rimLightY, params.rimLightZ);
    scene.add(rimLight);

    const ambientLight = new THREE.AmbientLight(params.ambientLightColor, params.ambientLightIntensity);
    scene.add(ambientLight);

    const valleyLight = new THREE.PointLight(params.valleyLightColor, params.valleyLightIntensity, 16.0, 1.6);
    valleyLight.position.set(params.valleyLightX, params.valleyLightY, params.valleyLightZ);
    scene.add(valleyLight);

    function updateLights() {
      const scale = params.sceneLightIntensity;
      if (postProcessor && postProcessor.settings) {
        postProcessor.settings.exposure = params.exposure;
        postProcessor.updateSettings();
      }

      keyLight.color.set(params.keyLightColor);
      keyLight.intensity = params.keyLightIntensity * scale;
      keyLight.position.set(params.keyLightX, params.keyLightY, params.keyLightZ);

      fillLight.color.set(params.fillLightColor);
      fillLight.intensity = params.fillLightIntensity * scale;
      fillLight.position.set(params.fillLightX, params.fillLightY, params.fillLightZ);

      rimLight.color.set(params.rimLightColor);
      rimLight.intensity = params.rimLightIntensity * scale;
      rimLight.position.set(params.rimLightX, params.rimLightY, params.rimLightZ);

      ambientLight.color.set(params.ambientLightColor);
      ambientLight.intensity = params.ambientLightIntensity * scale;

      valleyLight.color.set(params.valleyLightColor);
      valleyLight.intensity = params.valleyLightIntensity * scale;
      valleyLight.position.set(params.valleyLightX, params.valleyLightY, params.valleyLightZ);
    }

    // --- PROCEDURAL VELVET & SILK FABRIC SHADER UNIFORMS ---
    const clothUniforms = {
      uTime: { value: 0.0 },
      uAngle: { value: params.diagonalAngle },
      uWaveAmp1: { value: params.waveAmp1 },
      uWaveFreq1: { value: params.waveFreq1 },
      uWaveAmp2: { value: params.waveAmp2 },
      uWaveFreq2: { value: params.waveFreq2 },
      uWaveAmp3: { value: params.waveAmp3 },
      uWaveFreq3: { value: params.waveFreq3 },
      uValleyDepth: { value: params.valleyDepth },
      uBreathing: { value: params.breathingStrength }
    };

    const clothGLSLCommon = `
      uniform float uTime;
      uniform float uAngle;
      uniform float uWaveAmp1;
      uniform float uWaveFreq1;
      uniform float uWaveAmp2;
      uniform float uWaveFreq2;
      uniform float uWaveAmp3;
      uniform float uWaveFreq3;
      uniform float uValleyDepth;
      uniform float uBreathing;

      float getVelvetDisplacement(vec2 p) {
        float cosA = cos(uAngle);
        float sinA = sin(uAngle);
        float d = p.x * cosA + p.y * sinA;
        float q = -p.x * sinA + p.y * cosA;

        float t = uTime;
        float breath = 1.0 + 0.08 * sin(t * 0.7) * uBreathing;

        float f1 = uWaveAmp1 * sin(d * uWaveFreq1 + t * 0.6);
        float f2 = uWaveAmp2 * sin(d * uWaveFreq2 + q * 0.22 + t * 0.45 + 1.2);
        float f3 = uWaveAmp3 * sin(d * uWaveFreq3 - q * 0.15 + t * 0.8 + 2.5);
        float folds = (f1 + f2 + f3) * breath;

        vec2 vCenter = vec2(0.0, -1.2);
        vec2 diff = p - vCenter;
        float r2 = (diff.x * diff.x) / (6.0 * 6.0) + (diff.y * diff.y) / (4.0 * 4.0);
        float valleyMask = exp(-r2);

        return folds * (1.0 - 0.45 * valleyMask) - uValleyDepth * valleyMask;
      }

      vec3 getVelvetAnalyticalNormal(vec2 p) {
        float cosA = cos(uAngle);
        float sinA = sin(uAngle);
        float d = p.x * cosA + p.y * sinA;
        float q = -p.x * sinA + p.y * cosA;

        float t = uTime;
        float breath = 1.0 + 0.08 * sin(t * 0.7) * uBreathing;

        float c1 = uWaveAmp1 * uWaveFreq1 * cos(d * uWaveFreq1 + t * 0.6);
        float df1_dx = c1 * cosA;
        float df1_dy = c1 * sinA;

        float c2 = uWaveAmp2 * cos(d * uWaveFreq2 + q * 0.22 + t * 0.45 + 1.2);
        float df2_dx = c2 * (uWaveFreq2 * cosA - 0.22 * sinA);
        float df2_dy = c2 * (uWaveFreq2 * sinA + 0.22 * cosA);

        float c3 = uWaveAmp3 * cos(d * uWaveFreq3 - q * 0.15 + t * 0.8 + 2.5);
        float df3_dx = c3 * (uWaveFreq3 * cosA + 0.15 * sinA);
        float df3_dy = c3 * (uWaveFreq3 * sinA - 0.15 * cosA);

        float dF_dx = (df1_dx + df2_dx + df3_dx) * breath;
        float dF_dy = (df1_dy + df2_dy + df3_dy) * breath;

        float f1 = uWaveAmp1 * sin(d * uWaveFreq1 + t * 0.6);
        float f2 = uWaveAmp2 * sin(d * uWaveFreq2 + q * 0.22 + t * 0.45 + 1.2);
        float f3 = uWaveAmp3 * sin(d * uWaveFreq3 - q * 0.15 + t * 0.8 + 2.5);
        float F = (f1 + f2 + f3) * breath;

        vec2 vCenter = vec2(0.0, -1.2);
        vec2 diff = p - vCenter;
        float r2 = (diff.x * diff.x) / (6.0 * 6.0) + (diff.y * diff.y) / (4.0 * 4.0);
        float M = exp(-r2);

        float dM_dx = M * (-2.0 * diff.x / (6.0 * 6.0));
        float dM_dy = M * (-2.0 * diff.y / (4.0 * 4.0));

        float dZ_dx = dF_dx * (1.0 - 0.45 * M) + F * (-0.45 * dM_dx) - uValleyDepth * dM_dx;
        float dZ_dy = dF_dy * (1.0 - 0.45 * M) + F * (-0.45 * dM_dy) - uValleyDepth * dM_dy;

        return normalize(vec3(-dZ_dx, -dZ_dy, 1.0));
      }
    `;

    const clothGeometry = new THREE.PlaneGeometry(26, 20, 320, 240);
    const clothMaterial = new THREE.MeshPhysicalMaterial({
      color: new THREE.Color(params.fabricColor),
      roughness: params.roughness,
      metalness: 0.02,
      sheen: params.sheen,
      sheenColor: new THREE.Color(params.sheenColor),
      sheenRoughness: params.sheenRoughness,
      clearcoat: params.clearcoat,
      clearcoatRoughness: params.clearcoatRoughness,
      normalMap: velvetNormalMap,
      normalScale: new THREE.Vector2(0.06, 0.06),
      side: THREE.DoubleSide
    });

    clothMaterial.onBeforeCompile = (shader) => {
      Object.assign(shader.uniforms, clothUniforms);
      shader.vertexShader = clothGLSLCommon + '\n' + shader.vertexShader;

      shader.vertexShader = shader.vertexShader.replace(
        '#include <beginnormal_vertex>',
        `
        #include <beginnormal_vertex>
        objectNormal = getVelvetAnalyticalNormal(position.xy);
        `
      );

      shader.vertexShader = shader.vertexShader.replace(
        '#include <begin_vertex>',
        `
        #include <begin_vertex>
        transformed.z = getVelvetDisplacement(position.xy);
        `
      );
    };

    const clothMesh = new THREE.Mesh(clothGeometry, clothMaterial);
    scene.add(clothMesh);

    // --- SPARKS (DELICATE JEWEL GLINTS EMBEDDED ON FOLDS) ---
    const sparkShaderMaterial = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      uniforms: {
        ...clothUniforms,
        uSparkColor: { value: new THREE.Color(params.sparkColor) },
        uSparkIntensity: { value: params.sparkIntensity },
        uSparkBaseSize: { value: params.sparkSize }
      },
      vertexShader: `
        ${clothGLSLCommon}
        attribute float aPhase;
        attribute float aScale;
        attribute float aSpeed;
        varying float vTwinkle;

        uniform float uSparkBaseSize;

        void main() {
          vec3 pos = position;
          pos.z = getVelvetDisplacement(pos.xy) + 0.035;

          vec4 mvPos = modelViewMatrix * vec4(pos, 1.0);
          gl_Position = projectionMatrix * mvPos;

          float tw = sin(uTime * aSpeed + aPhase);
          vTwinkle = pow(clamp(tw, 0.0, 1.0), 5.0);

          float sz = uSparkBaseSize * aScale * (0.6 + 1.8 * vTwinkle) * (45.0 / -mvPos.z);
          gl_PointSize = clamp(sz, 1.0, 12.0);
        }
      `,
      fragmentShader: `
        uniform vec3 uSparkColor;
        uniform float uSparkIntensity;
        varying float vTwinkle;

        void main() {
          vec2 p = gl_PointCoord - vec2(0.5);
          float r = length(p);
          if (r > 0.5) discard;

          float star = 0.015 / (abs(p.x * p.y) + 0.012);
          float glow = exp(-r * 8.0);
          float alpha = clamp(glow * 0.7 + star * 0.35, 0.0, 1.0) * vTwinkle * uSparkIntensity;

          gl_FragColor = vec4(uSparkColor, clamp(alpha, 0.0, 0.95));
        }
      `
    });

    function createSparkParticles(count) {
      const sparkGeom = new THREE.BufferGeometry();
      const posArray = new Float32Array(count * 3);
      const phaseArray = new Float32Array(count);
      const scaleArray = new Float32Array(count);
      const speedArray = new Float32Array(count);

      for (let i = 0; i < count; i++) {
        const x = (Math.random() - 0.5) * 20.0;
        const y = (Math.random() - 0.5) * 15.0;
        posArray[i * 3 + 0] = x;
        posArray[i * 3 + 1] = y;
        posArray[i * 3 + 2] = 0.0;

        phaseArray[i] = Math.random() * Math.PI * 2.0;
        scaleArray[i] = 0.6 + Math.random() * 0.8;
        speedArray[i] = 1.0 + Math.random() * 2.0;
      }

      sparkGeom.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
      sparkGeom.setAttribute('aPhase', new THREE.BufferAttribute(phaseArray, 1));
      sparkGeom.setAttribute('aScale', new THREE.BufferAttribute(scaleArray, 1));
      sparkGeom.setAttribute('aSpeed', new THREE.BufferAttribute(speedArray, 1));

      return new THREE.Points(sparkGeom, sparkShaderMaterial);
    }

    let sparkPoints = createSparkParticles(params.sparksCount);
    scene.add(sparkPoints);

    // --- CAMERA MOTION & ANIMATION SYSTEM ---
    const ANIMATION_MODES = [
      'Static (No Camera Movement)',
      'Diagonal Drift (Cinematic Glide)',
      'Velvet Breathing Orbit',
      'Valley Focus Glide',
      'Side-Light Sweep',
      'Silk Horizon Float',
      'Gentle Undulation',
      'Diagonal Tilt & Roll'
    ];

    let animClock = 0;

    function getAnimationDelta(mode, t, dt) {
      const delta = {
        target: new THREE.Vector3(0, 0, 0),
        azimuthDelta: 0,
        polarDelta: 0
      };

      if (mode === 'Static (No Camera Movement)') {
        return delta;
      }

      const spd = params.speed;

      if (mode === 'Diagonal Drift (Cinematic Glide)') {
        const angle = params.diagonalAngle;
        const curX = Math.cos(angle) * Math.sin(t * 0.22) * 1.5;
        const curY = Math.sin(angle) * Math.sin(t * 0.22) * 1.0;
        const oldX = Math.cos(angle) * Math.sin((t - dt) * 0.22) * 1.5;
        const oldY = Math.sin(angle) * Math.sin((t - dt) * 0.22) * 1.0;
        delta.target.set(curX - oldX, curY - oldY, 0);
      } else if (mode === 'Velvet Breathing Orbit') {
        delta.azimuthDelta = 0.10 * dt * spd;
        const curY = Math.sin(t * 0.28) * 0.25;
        const oldY = Math.sin((t - dt) * 0.28) * 0.25;
        delta.target.set(0, curY - oldY, 0);
      } else if (mode === 'Valley Focus Glide') {
        const curX = Math.sin(t * 0.18) * 1.2;
        const curY = Math.cos(t * 0.14) * 0.4;
        const oldX = Math.sin((t - dt) * 0.18) * 1.2;
        const oldY = Math.cos((t - dt) * 0.14) * 0.4;
        delta.target.set(curX - oldX, curY - oldY, 0);
      } else if (mode === 'Side-Light Sweep') {
        const curX = Math.cos(t * 0.2) * 1.3;
        const oldX = Math.cos((t - dt) * 0.2) * 1.3;
        delta.target.set(curX - oldX, 0, 0);
        delta.azimuthDelta = Math.sin(t * 0.28) * 0.06 * dt * spd;
      } else if (mode === 'Silk Horizon Float') {
        const curY = Math.sin(t * 0.24) * 0.5;
        const curX = Math.sin(t * 0.15) * 0.7;
        const oldY = Math.sin((t - dt) * 0.24) * 0.5;
        const oldX = Math.sin((t - dt) * 0.15) * 0.7;
        delta.target.set(curX - oldX, curY - oldY, 0);
      } else if (mode === 'Gentle Undulation') {
        const curY = Math.sin(t * 0.32) * 0.5;
        const curZ = Math.cos(t * 0.22) * 0.2;
        const oldY = Math.sin((t - dt) * 0.32) * 0.5;
        const oldZ = Math.cos((t - dt) * 0.22) * 0.2;
        delta.target.set(0, curY - oldY, curZ - oldZ);
      } else if (mode === 'Diagonal Tilt & Roll') {
        const angle = params.diagonalAngle;
        const curX = Math.cos(angle) * Math.sin(t * 0.18) * 0.9;
        const curY = Math.sin(angle) * Math.sin(t * 0.18) * 0.6;
        const oldX = Math.cos(angle) * Math.sin((t - dt) * 0.18) * 0.9;
        const oldY = Math.sin(angle) * Math.sin((t - dt) * 0.18) * 0.6;
        delta.target.set(curX - oldX, curY - oldY, 0);
        delta.polarDelta = Math.sin(t * 0.22) * 0.03 * dt * spd;
      }

      return delta;
    }

    // --- APPLY COLOR PALETTE ---
    function applyPalette(key, animate = true) {
      const p = PALETTES[key];
      if (!p) return;

      params.palette = key;
      params.fabricColor = p.fabricColor;
      params.sheenColor = p.sheenColor;
      params.bgColor = p.bgColor;
      params.sparkColor = p.sparkColor;
      params.keyLightColor = p.keyLightColor;
      params.fillLightColor = p.fillLightColor;
      params.rimLightColor = p.rimLightColor;
      params.valleyLightColor = p.valleyLightColor;
      params.roughness = p.roughness;
      params.sheenRoughness = p.sheenRoughness;
      params.clearcoat = p.clearcoat;

      if (!params.greenscreen) {
        if (animate && window.gsap) {
          gsap.to(scene.background, {
            r: new THREE.Color(p.bgColor).r,
            g: new THREE.Color(p.bgColor).g,
            b: new THREE.Color(p.bgColor).b,
            duration: 0.8
          });
        } else {
          scene.background.set(p.bgColor);
        }
      }

      clothMaterial.color.set(p.fabricColor);
      clothMaterial.sheenColor.set(p.sheenColor);
      clothMaterial.roughness = p.roughness;
      clothMaterial.sheenRoughness = p.sheenRoughness;
      clothMaterial.clearcoat = p.clearcoat;

      sparkShaderMaterial.uniforms.uSparkColor.value.set(p.sparkColor);
      updateLights();

      if (gui) {
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      }
    }

    function applyFabricType(type) {
      params.fabricType = type;
      if (type.includes('Velvet')) {
        params.roughness = 0.76;
        params.sheenRoughness = 0.48;
        params.clearcoat = 0.12;
        clothMaterial.normalScale.set(0.06, 0.06);
      } else {
        params.roughness = 0.32;
        params.sheenRoughness = 0.25;
        params.clearcoat = 0.50;
        clothMaterial.normalScale.set(0.03, 0.03);
      }
      clothMaterial.roughness = params.roughness;
      clothMaterial.sheenRoughness = params.sheenRoughness;
      clothMaterial.clearcoat = params.clearcoat;
      if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    // --- PROCEDURAL SCENE RANDOMIZATION (ON CLICK) ---
    // NOTE: Does NOT touch or change any Postprocessing settings per user requirement!
    function randomizeScene() {
      const keys = Object.keys(PALETTES);
      const randomKey = keys[Math.floor(Math.random() * keys.length)];
      applyPalette(randomKey, true);

      params.waveAmp1 = +(0.65 + Math.random() * 0.35).toFixed(2);
      params.waveFreq1 = +(0.38 + Math.random() * 0.16).toFixed(2);
      params.waveAmp2 = +(0.30 + Math.random() * 0.25).toFixed(2);
      params.waveFreq2 = +(0.75 + Math.random() * 0.35).toFixed(2);
      params.valleyDepth = +(0.65 + Math.random() * 0.40).toFixed(2);
      params.diagonalAngle = +(0.50 + Math.random() * 0.30).toFixed(2);
      params.speed = +(0.75 + Math.random() * 0.50).toFixed(2);
      params.sparkIntensity = +(0.80 + Math.random() * 0.60).toFixed(2);

      params.keyLightX = +(-8.0 + Math.random() * 3.0).toFixed(1);
      params.keyLightY = +(5.0 + Math.random() * 3.0).toFixed(1);

      clothUniforms.uWaveAmp1.value = params.waveAmp1;
      clothUniforms.uWaveFreq1.value = params.waveFreq1;
      clothUniforms.uWaveAmp2.value = params.waveAmp2;
      clothUniforms.uWaveFreq2.value = params.waveFreq2;
      clothUniforms.uValleyDepth.value = params.valleyDepth;
      clothUniforms.uAngle.value = params.diagonalAngle;
      sparkShaderMaterial.uniforms.uSparkIntensity.value = params.sparkIntensity;

      updateLights();
      if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    // Canvas click detection (discriminates click from drag)
    let pointerDownInfo = { x: 0, y: 0, time: 0 };
    window.addEventListener('pointerdown', (e) => {
      pointerDownInfo = { x: e.clientX, y: e.clientY, time: performance.now() };
    });

    window.addEventListener('pointerup', (e) => {
      if (e.target.closest && e.target.closest('.lil-gui')) return;
      const dx = e.clientX - pointerDownInfo.x;
      const dy = e.clientY - pointerDownInfo.y;
      const dt = performance.now() - pointerDownInfo.time;
      if (Math.hypot(dx, dy) < 6 && dt < 280) {
        if (params.clickToRandomize) {
          randomizeScene();
        }
      }
    });

    // --- UI CONTROLS VIA LIL-GUI ---
    let gui = new GUI({ title: 'Параметры сцены' });

    // 1. Color Presets & Materials
    const fTheme = gui.addFolder('Цветовая гамма и ткань');
    fTheme.add(params, 'palette', Object.keys(PALETTES)).name('Палитра').onChange(v => applyPalette(v, true));
    fTheme.add(params, 'fabricType', ['Velvet (Бархат)', 'Silk / Satin (Атласный шёлк)']).name('Тип ткани').onChange(applyFabricType);
    fTheme.addColor(params, 'fabricColor').name('Цвет ткани').onChange(c => clothMaterial.color.set(c));
    fTheme.addColor(params, 'sheenColor').name('Блеск (Sheen)').onChange(c => clothMaterial.sheenColor.set(c));
    fTheme.addColor(params, 'bgColor').name('Цвет фона').onChange(c => {
      if (!params.greenscreen) scene.background.set(c);
    });
    fTheme.add(params, 'greenscreen').name('Хромакей (#00ff00)').onChange(v => {
      scene.background.set(v ? '#00ff00' : params.bgColor);
    });
    fTheme.add(params, 'clickToRandomize').name('Клик: случайная тема');

    // 2. Motion & Camera Animation Dropdown
    const fMotion = gui.addFolder('Анимация и движение');
    fMotion.add(params, 'animationMode', ANIMATION_MODES).name('Камера');
    fMotion.add(params, 'speed', 0.0, 3.0, 0.05).name('Скорость движения');
    fMotion.add(params, 'breathingStrength', 0.0, 2.5, 0.1).name('Дыхание ткани').onChange(v => {
      clothUniforms.uBreathing.value = v;
    });

    // 3. Wave Folds & Valley Geometry
    const fWave = gui.addFolder('Геометрия складок');
    fWave.add(params, 'diagonalAngle', 0.1, 1.5, 0.02).name('Угол диагонали').onChange(v => {
      clothUniforms.uAngle.value = v;
    });
    fWave.add(params, 'waveAmp1', 0.1, 2.5, 0.05).name('Высота волн 1').onChange(v => {
      clothUniforms.uWaveAmp1.value = v;
    });
    fWave.add(params, 'waveFreq1', 0.1, 1.5, 0.02).name('Частота волн 1').onChange(v => {
      clothUniforms.uWaveFreq1.value = v;
    });
    fWave.add(params, 'waveAmp2', 0.0, 1.5, 0.05).name('Рябь 2').onChange(v => {
      clothUniforms.uWaveAmp2.value = v;
    });
    fWave.add(params, 'valleyDepth', 0.0, 3.0, 0.05).name('Глубина впадины').onChange(v => {
      clothUniforms.uValleyDepth.value = v;
    });

    // 4. Sparkles / Glints
    const fSparks = gui.addFolder('Искры на складках');
    fSparks.add(params, 'sparksEnabled').name('Включить искры').onChange(v => {
      sparkPoints.visible = v;
    });
    fSparks.addColor(params, 'sparkColor').name('Цвет искр').onChange(c => {
      sparkShaderMaterial.uniforms.uSparkColor.value.set(c);
    });
    fSparks.add(params, 'sparkIntensity', 0.1, 3.0, 0.1).name('Яркость искр').onChange(v => {
      sparkShaderMaterial.uniforms.uSparkIntensity.value = v;
    });
    fSparks.add(params, 'sparkSize', 1.0, 20.0, 0.5).name('Размер искр').onChange(v => {
      sparkShaderMaterial.uniforms.uSparkBaseSize.value = v;
    });

    // 5. Lighting & Exposure (Individual Lights)
    const fLight = gui.addFolder('Освещение и экспозиция');
    fLight.add(params, 'exposure', 0.2, 2.5, 0.05).name('Экспозиция').onChange(v => {
      if (postProcessor && postProcessor.settings) {
        postProcessor.settings.exposure = v;
        postProcessor.updateSettings();
      }
    });
    fLight.add(params, 'sceneLightIntensity', 0.1, 2.5, 0.05).name('Общая яркость').onChange(updateLights);

    const fKey = fLight.addFolder('Боковой свет (Key)');
    fKey.addColor(params, 'keyLightColor').name('Цвет').onChange(updateLights);
    fKey.add(params, 'keyLightIntensity', 0.0, 5.0, 0.1).name('Яркость').onChange(updateLights);
    fKey.add(params, 'keyLightX', -15.0, 15.0, 0.5).name('Позиция X').onChange(updateLights);
    fKey.add(params, 'keyLightY', -15.0, 15.0, 0.5).name('Позиция Y').onChange(updateLights);
    fKey.add(params, 'keyLightZ', 1.0, 20.0, 0.5).name('Позиция Z').onChange(updateLights);
    fKey.close();

    const fFill = fLight.addFolder('Заполняющий свет (Fill)');
    fFill.addColor(params, 'fillLightColor').name('Цвет').onChange(updateLights);
    fFill.add(params, 'fillLightIntensity', 0.0, 4.0, 0.05).name('Яркость').onChange(updateLights);
    fFill.add(params, 'fillLightX', -15.0, 15.0, 0.5).name('Позиция X').onChange(updateLights);
    fFill.add(params, 'fillLightY', -15.0, 15.0, 0.5).name('Позиция Y').onChange(updateLights);
    fFill.add(params, 'fillLightZ', 1.0, 20.0, 0.5).name('Позиция Z').onChange(updateLights);
    fFill.close();

    const fRim = fLight.addFolder('Контурный свет (Rim)');
    fRim.addColor(params, 'rimLightColor').name('Цвет').onChange(updateLights);
    fRim.add(params, 'rimLightIntensity', 0.0, 4.0, 0.05).name('Яркость').onChange(updateLights);
    fRim.add(params, 'rimLightX', -15.0, 15.0, 0.5).name('Позиция X').onChange(updateLights);
    fRim.add(params, 'rimLightY', -15.0, 15.0, 0.5).name('Позиция Y').onChange(updateLights);
    fRim.add(params, 'rimLightZ', 1.0, 20.0, 0.5).name('Позиция Z').onChange(updateLights);
    fRim.close();

    const fValleyL = fLight.addFolder('Свет во впадине (Valley Glow)');
    fValleyL.addColor(params, 'valleyLightColor').name('Цвет').onChange(updateLights);
    fValleyL.add(params, 'valleyLightIntensity', 0.0, 4.0, 0.05).name('Яркость').onChange(updateLights);
    fValleyL.add(params, 'valleyLightX', -10.0, 10.0, 0.2).name('Позиция X').onChange(updateLights);
    fValleyL.add(params, 'valleyLightY', -10.0, 10.0, 0.2).name('Позиция Y').onChange(updateLights);
    fValleyL.add(params, 'valleyLightZ', 0.5, 10.0, 0.2).name('Позиция Z').onChange(updateLights);
    fValleyL.close();

    const fAmbient = fLight.addFolder('Окружающий свет (Ambient)');
    fAmbient.addColor(params, 'ambientLightColor').name('Цвет').onChange(updateLights);
    fAmbient.add(params, 'ambientLightIntensity', 0.0, 2.5, 0.05).name('Яркость').onChange(updateLights);
    fAmbient.close();

    // 6. Quality & Render Settings
    const fQuality = gui.addFolder('Качество и рендер');
    fQuality.add(params, 'dpr', 0.5, 3.0, 0.1).name('DPR (Pixel Ratio)').onChange(v => {
      renderer.setPixelRatio(v);
      postProcessor.setSize(window.innerWidth, window.innerHeight, v);
    });
    fQuality.add(params, 'antialias').name('Antialias (Сглаживание)').onChange(v => {
      initRenderer(v);
      postProcessor.renderer = renderer;
      postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);
      controls.dispose();
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.screenSpacePanning = true;
      controls.minDistance = 2.0;
      controls.maxDistance = 25.0;
    });

    // 7. Attach Post-Processing Suite Folder to lil-gui
    postProcessor.attachGUI(gui, 'Постобработка (Post-Processing)');

    // Toggle GUI visibility with 'H' key
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        gui._hidden ? gui.show() : gui.hide();
      }
    });

    // --- ANIMATION & RENDER LOOP ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const dt = clock.getDelta();
      const scaledDt = dt * params.speed;
      animClock += scaledDt;

      clothUniforms.uTime.value = animClock;

      const delta = getAnimationDelta(params.animationMode, animClock, scaledDt);

      if (delta.target.lengthSq() > 0) {
        controls.target.add(delta.target);
        camera.position.add(delta.target);
      }

      if (delta.azimuthDelta !== 0 || delta.polarDelta !== 0) {
        const offset = camera.position.clone().sub(controls.target);
        const spherical = new THREE.Spherical().setFromVector3(offset);
        spherical.theta += delta.azimuthDelta;
        spherical.phi = Math.max(0.08, Math.min(Math.PI - 0.08, spherical.phi + delta.polarDelta));
        offset.setFromSpherical(spherical);
        camera.position.copy(controls.target).add(offset);
      }

      controls.update();

      // Render through PostProcessor pipeline
      postProcessor.renderScene(scene, camera);
    }

    animate();

    // --- RESIZE HANDLER ---
    window.addEventListener('resize', () => {
      const width = window.innerWidth;
      const height = window.innerHeight;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
      renderer.setPixelRatio(params.dpr);
      postProcessor.setSize(width, height, params.dpr);
    });
  </script>
</body>
</html>
