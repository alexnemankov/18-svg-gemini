    /* ============================================================
       CSS Reset & Full Viewport UX
       ============================================================ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #181528;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      cursor: grab;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "JetBrains Mono", monospace;
    }

    body.grabbing {
      cursor: grabbing;
    }

    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      margin: 0;
      padding: 0;
      border: none;
      outline: none;
    }

    canvas {
      display: block;
      width: 100vw !important;
      height: 100vh !important;
      outline: none;
      border: none;
    }

  <script>
    // ============================================================
    // 613 - Procedural Wave Strata
    //
    // Generative art piece combining layered sine waves, Perlin noise fields,
    // harmonic ripples, and multi-palette color gradients.
    //
    // Preserves and enhances the core algorithm and mathematical formulations:
    //   - ny = noise(5 * y / height)
    //   - cx = ny * width
    //   - a = map(x, 0, width, HALF_PI, TWO_PI + HALF_PI) + (ny - 0.5) * 4
    //   - n = noise(x / width * 10, y / height * 10, frameCount / 1500)
    //   - d = map(abs(cx - x), 0, width, 1, 0.1)
    //   - yy = sin(a) * S / 4 * n /* * d */ + y
    //
    // Production Enhancements:
    //   - Full-viewport responsive canvas with aspect preservation
    //   - Cursor-anchored pan & zoom with inertia & touch support
    //   - 19 preconfigured color schemes (Original, Monochromatic, etc.)
    //   - Dynamic animation speed and flowing motion controls
    //   - Floating atmospheric ambient stardust particles
    //   - Procedural theme randomizer on scene click (toggleable)
    //   - Glassmorphic lil-gui control panel with clean organization
    // ============================================================

    // ============================================================
    // 19 Curated Color Schemes Pattern
    // ============================================================
    const COLOR_SCHEMES = {

      'Palette 12: F6AA1C, BC3908, 941B0C': {

        accent: '#f6aa1c'
      },
      'Palette 13: 63D1CF, 5BC0BE, 4BAD9E': {
        name: 'Palette 13: (63D1CF, 5BC0BE, 4BAD9E, 4BAD9E, 0B132B, 000000)',
        bg: '#000000',
        fg: '#63d1cf',
        palette: ['#000000', '#0b132b', '#1c2541', '#4bad9e', '#5bc0be', '#63d1cf'],
        accent: '#63d1cf'
      },
      'Palette 14: AA60C8, D69ADE, C9A3C6': {
        name: 'Palette 14: (AA60C8, D69ADE, C9A3C6, CFB5C2, 0D001D, 120A12)',
        bg: '#0d001d',
        fg: '#d69ade',
        palette: ['#0d001d', '#120a12', '#733388', '#aa60c8', '#c9a3c6', '#cfb5c2', '#d69ade'],
        accent: '#d69ade'
      },
      'Palette 15: FEF1BE, FFBA00, 008189': {
        name: 'Palette 15: (FEF1BE, FFBA00, 008189, 00474D, 061210)',
        bg: '#061210',
        fg: '#ffba00',
        palette: ['#061210', '#00474d', '#008189', '#ffba00', '#fef1be'],
        accent: '#ffba00'
      },
      'Palette 16: D4FFB0, 7FFF00, 00B894': {
        name: 'Palette 16: (D4FFB0, 7FFF00, 00B894, 0A3322, 05140A)',
        bg: '#05140a',
        fg: '#7fff00',
        palette: ['#05140a', '#0a3322', '#00b894', '#7fff00', '#d4ffb0'],
        accent: '#7fff00'
      },
      'Palette 17: FFE8CC, FF8C00, C7501A': {
        name: 'Palette 17: (FFE8CC, FF8C00, C7501A, 3D1050, 0E0618)',
        bg: '#0e0618',
        fg: '#ff8c00',
        palette: ['#0e0618', '#3d1050', '#852445', '#c7501a', '#ff8c00', '#ffe8cc'],
        accent: '#ff8c00'
      },
      'Palette 18: E8E0FF, B38FFF, 6A3DE8': {
        name: 'Palette 18: (E8E0FF, B38FFF, 6A3DE8, 1A1250, 090612)',
        bg: '#090612',
        fg: '#b38fff',
        palette: ['#090612', '#1a1250', '#41229a', '#6a3de8', '#b38fff', '#e8e0ff'],
        accent: '#b38fff'
      },
      'Palette 19: E0FBFF, 00F0FF, D40078': {
        name: 'Palette 19: (E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)',
        bg: '#05020f',
        fg: '#00f0ff',
        palette: ['#05020f', '#1e0a3d', '#7a0550', '#d40078', '#00f0ff', '#e0fbff'],
        accent: '#00f0ff'
      }
    };

    // ============================================================
    // Self-Contained EpiColors Implementation
    // Compatible with https://github.com/epibyte/p5-epi-colors
    // ============================================================
    const EpiColorsPckg = (function() {
      class EpiColors {
        constructor(schemeKey = 'Original') {
          this.setScheme(schemeKey);
        }

        setScheme(schemeKey) {
          this.schemeKey = COLOR_SCHEMES[schemeKey] ? schemeKey : 'Original';
          const scheme = COLOR_SCHEMES[this.schemeKey];
          this.BG = scheme.bg;
          this.FG = scheme.fg;
          this.palette = [...scheme.palette];
          this.accent = scheme.accent;
        }

        getRandomPalette(useGlobal = true) {
          const keys = Object.keys(COLOR_SCHEMES);
          const randKey = keys[Math.floor(Math.random() * keys.length)];
          this.setScheme(randKey);
          return randKey;
        }

        // Smooth color interpolation across the palette array
        getLerpedColorFromPalette(t) {
          if (!this.palette || this.palette.length === 0) {
            return color(128);
          }
          if (this.palette.length === 1) {
            return color(this.palette[0]);
          }

          // Wrap or clamp t in [0, 1]
          let clampedT = t % 1.0;
          if (clampedT < 0) clampedT += 1.0;

          const pos = clampedT * (this.palette.length - 1);
          const idx1 = Math.floor(pos);
          const idx2 = Math.min(idx1 + 1, this.palette.length - 1);
          const frac = pos - idx1;

          const c1 = color(this.palette[idx1]);
          const c2 = color(this.palette[idx2]);
          return lerpColor(c1, c2, frac);
        }

        static getColor(col, alphaVal = 255) {
          const c = color(col);
          return color(red(c), green(c), blue(c), alphaVal);
        }
      }

      return { EpiColors };
    })();

    // Extract EpiColors matching the original snippet declaration:
    // https://github.com/epibyte/p5-epi-colors
    const { EpiColors } = EpiColorsPckg;
    let epiColors;

    // ============================================================
    // Global Settings & Parameters
    // ============================================================
    const settings = {
      // Color & Palette
      colorScheme: 'Original',
      paletteSpread: 0.5,       // Original used f / 2 (just use half of palette)
      paletteShift: 0.0,        // Phase offset in color cycle
      paletteCycleSpeed: 0.0,   // Continuous slow palette cycling
      strokeAlpha: 64,          // Stroke opacity: EpiColors.getColor(epiColors.BG, 64)
      strokeWeight: 1.0,        // Stroke weight of wave edges
      showFrame: true,          // Outer picture border
      frameWeight: 8,           // strokeWeight(8); stroke(epiColors.FG);

      // Waves & Geometry
      layersDivisor: 5.0,       // Step spacing: PAD / 5
      amplitudeMultiplier: 1.0, // Multiplier for S / 4
      noiseXScale: 10.0,        // noise(x / width * 10, ...)
      noiseYScale: 10.0,        // noise(..., y / height * 10, ...)
      yNoiseFreq: 5.0,          // ny = noise(5 * y / height)
      angleMod: 4.0,            // (ny - 0.5) * 4
      stepXPercent: 0.01,       // x += width * 0.01
      useCrestAttenuate: false, // /* * d */ from original snippet

      // Animation & Motion
      animSpeed: 1.0,           // Master speed multiplier
      breatheIntensity: 0.05,   // Gentle swell breathing
      enableRipple: true,       // Harmonic secondary micro-ripples
      rippleAmp: 0.4,           // Amplitude of micro-texture
      enableParticles: true,    // Floating ambient stardust
      particleCount: 60,        // Number of floating particles

      // Interaction & Randomization
      clickToRandomize: true,   // Randomize theme & parameters on pure click
      mouseInfluence: 0.6,      // Gentle wave dip/swell around cursor
      mouseRadius: 180,         // Radius of cursor interaction

      // Camera & Viewport
      zoom: 1.0,                // Camera zoom level

      // Actions
      regenerate: () => reseedNoise(),
      randomizeAll: () => randomizeAll(),
      resetCamera: () => resetCameraView(),
      saveSnapshot: () => saveSnapshot()
    };

    // Global dimension and state variables
    let S = 800;
    let animTime = 0;
    let currentNoiseSeed = 1234567;
    let particles = [];

    // Camera Pan & Zoom Transform State
    let panX = 0, panY = 0;
    let targetPanX = 0, targetPanY = 0;
    let zoomLevel = 1.0, targetZoom = 1.0;
    let isDragging = false;
    let dragStartX = 0, dragStartY = 0;
    let startPanX = 0, startPanY = 0;
    let totalDragDistance = 0;

    // Touch pinch state
    let initialPinchDistance = 0;
    let pinchStartZoom = 1.0;

    // lil-gui instance
    let gui = null;

    // ============================================================
    // Particle System (Ambient Floating Stardust)
    // ============================================================
    class AmbientParticle {
      constructor(w, h) {
        this.reset(w, h, true);
      }

      reset(w, h, randomizeY = false) {
        this.x = random(0, w);
        this.y = randomizeY ? random(0, h) : random(h * 0.8, h * 1.1);
        this.baseSize = random(1.5, 4.0);
        this.size = this.baseSize;
        this.speedY = random(0.3, 1.2);
        this.noiseOffset = random(1000);
        this.phase = random(TWO_PI);
        this.alpha = random(60, 190);
        this.colorT = random(0.0, 1.0);
      }

      update(w, h, speedMult) {
        this.phase += 0.03 * speedMult;
        const nAngle = noise(this.x * 0.003, this.y * 0.003, animTime * 0.4 + this.noiseOffset);
        const vx = (nAngle - 0.48) * 2.2 * speedMult;
        const vy = -this.speedY * (0.8 + 0.4 * sin(this.phase)) * speedMult;

        this.x += vx;
        this.y += vy;
        this.size = this.baseSize * (0.85 + 0.25 * sin(this.phase * 2));

        if (this.y < -30 || this.x < -40 || this.x > w + 40) {
          this.reset(w, h, false);
        }
      }

      draw(pg, col) {
        noStroke();
        fill(red(col), green(col), blue(col), this.alpha * (0.7 + 0.3 * sin(this.phase)));
        circle(this.x, this.y, this.size);
      }
    }

    function initParticles() {
      particles = [];
      const count = Math.min(settings.particleCount, 200);
      for (let i = 0; i < count; i++) {
        particles.push(new AmbientParticle(width, height));
      }
    }

    // ============================================================
    // Core p5.js Setup
    // ============================================================
    function setup() {
      // Fullscreen responsive canvas creation
      const container = document.getElementById('canvas-container');
      const w = container ? (container.clientWidth || windowWidth) : windowWidth;
      const h = container ? (container.clientHeight || windowHeight) : windowHeight;

      let cnv = createCanvas(w, h);
      cnv.parent('canvas-container');

      // Prevent default right-click context menu for smooth panning
      cnv.elt.oncontextmenu = (e) => e.preventDefault();

      frameRate(30);

      // Dimension calculation matching original logic: S = ~~(min(innerWidth, innerHeight)*0.95)
      S = Math.floor(Math.min(w, h) * 0.95);

      epiColors = new EpiColors(settings.colorScheme);
      document.body.style.backgroundColor = epiColors.BG;

      reseedNoise();
      initParticles();
      initGUI();
      loop();
    }

    function reseedNoise() {
      currentNoiseSeed = Math.floor(random(7654321));
      noiseSeed(currentNoiseSeed);
      randomSeed(currentNoiseSeed);
    }

    function windowResized() {
      const container = document.getElementById('canvas-container');
      const w = container ? (container.clientWidth || windowWidth) : windowWidth;
      const h = container ? (container.clientHeight || windowHeight) : windowHeight;
      resizeCanvas(w, h);
      S = Math.floor(Math.min(w, h) * 0.95);
    }

    // ============================================================
    // Core p5.js Draw Loop
    // ============================================================
    function draw() {
      // 1. Advance animation time with speed multiplier
      // Original baseline used frameCount / 1500 (approx 0.000667 per frame)
      const dt = (1 / 1500) * settings.animSpeed;
      animTime += dt;

      // Dynamic palette shifting
      if (settings.paletteCycleSpeed > 0) {
        settings.paletteShift = (settings.paletteShift + settings.paletteCycleSpeed * 0.002) % 1.0;
      }

      // Smooth camera pan & zoom with inertia
      panX = lerp(panX, targetPanX, 0.16);
      panY = lerp(panY, targetPanY, 0.16);
      zoomLevel = lerp(zoomLevel, targetZoom, 0.16);
      settings.zoom = parseFloat(zoomLevel.toFixed(2));

      // Calculate world mouse coordinates inside transformed artboard
      const worldMouseX = (mouseX - width / 2 - panX) / zoomLevel + width / 2;
      const worldMouseY = (mouseY - height / 2 - panY) / zoomLevel + height / 2;

      // 2. Render background
      background(epiColors.BG);

      // 3. Begin camera transform
      push();
      translate(width / 2 + panX, height / 2 + panY);
      scale(zoomLevel);
      translate(-width / 2, -height / 2);

      // 4. Render ambient floating stardust (behind/between strata)
      if (settings.enableParticles && particles.length > 0) {
        const accentCol = color(epiColors.accent || epiColors.FG);
        for (let p of particles) {
          p.update(width, height, settings.animSpeed);
          p.draw(this, accentCol);
        }
      }

      // 5. Draw layered wave ribbons
      stroke(EpiColors.getColor(epiColors.BG, settings.strokeAlpha));
      strokeWeight(settings.strokeWeight);

      const PAD = S * 0.2;
      const stepY = PAD / settings.layersDivisor;
      const breathe = settings.breatheIntensity * Math.sin(animTime * 6.0);

      for (let y = PAD; y < height + PAD; y += stepY) {
        // Gradient interpolation factor from top to bottom
        const f = map(y, PAD, height + PAD, 0, 1);

        // Palette color retrieval matching original:
        // const clr = epiColors.getLerpedColorFromPalette(f/2); // just use half of palette
        const paletteSampleT = (f * settings.paletteSpread + settings.paletteShift) % 1.0;
        const clr = epiColors.getLerpedColorFromPalette(paletteSampleT);
        fill(clr);

        beginShape();
        vertex(0, height + y);

        const ny = noise((settings.yNoiseFreq * y) / height);
        const cx = ny * width;

        const stepX = Math.max(width * settings.stepXPercent, 2);
        for (let x = 0; x <= width + stepX; x += stepX) {
          const clampedX = Math.min(x, width);
          const a = map(clampedX, 0, width, HALF_PI, TWO_PI + HALF_PI) + (ny - 0.5) * settings.angleMod;
          const n = noise((clampedX / width) * settings.noiseXScale, (y / height) * settings.noiseYScale, animTime);

          // Crest attenuation calculation from snippet:
          const d = map(abs(cx - clampedX), 0, width, 1, 0.1);
          const attenuation = settings.useCrestAttenuate ? d : 1.0;

          // Wave amplitude calculation: sin(a) * S/4 * n /* * d */ + y
          const amp = (S / 4) * settings.amplitudeMultiplier * (1.0 + breathe);
          let yy = Math.sin(a) * amp * n * attenuation + y;

          // Harmonic micro-ripple for organic silky texture
          if (settings.enableRipple) {
            const ripple = Math.sin(a * 3.5 + animTime * 8.0 + y * 0.02) * (S * 0.012 * settings.rippleAmp);
            yy += ripple;
          }

          // Gentle interactive mouse dip/swell
          if (settings.mouseInfluence > 0) {
            const dMouse = dist(worldMouseX, worldMouseY, clampedX, yy);
            if (dMouse < settings.mouseRadius) {
              const influence = (1.0 - dMouse / settings.mouseRadius) * (settings.mouseInfluence * 35.0);
              yy += Math.sin(influence * 0.2) * influence;
            }
          }

          vertex(clampedX, yy);
        }

        vertex(width, height + y);
        endShape(CLOSE);
      }

      // 6. Outer border frame matching original logic:
      // strokeWeight(8); stroke(epiColors.FG); noFill(); rect(4, 4, width-8, height-8);
      if (settings.showFrame) {
        strokeWeight(settings.frameWeight);
        stroke(epiColors.FG);
        noFill();
        const halfBorder = settings.frameWeight / 2;
        rect(halfBorder, halfBorder, width - settings.frameWeight, height - settings.frameWeight);
      }

      pop();
    }

    // ============================================================
    // Interactive Controls (Zoom with Wheel & Pan with Drag)
    // ============================================================
    function mouseWheel(event) {
      if (event.target && event.target.closest && event.target.closest('.lil-gui')) {
        return;
      }

      const zoomFactor = event.deltaY < 0 ? 1.09 : 0.91;
      const newZoom = constrain(targetZoom * zoomFactor, 0.15, 12.0);

      // Cursor-anchored smooth zoom
      const mx = mouseX - width / 2;
      const my = mouseY - height / 2;
      targetPanX = mx - (mx - targetPanX) * (newZoom / targetZoom);
      targetPanY = my - (my - targetPanY) * (newZoom / targetZoom);
      targetZoom = newZoom;

      return false; // Prevent page scroll
    }

    function mousePressed(event) {
      if (event.target && event.target.closest && event.target.closest('.lil-gui')) {
        return;
      }

      isDragging = true;
      dragStartX = mouseX;
      dragStartY = mouseY;
      startPanX = targetPanX;
      startPanY = targetPanY;
      totalDragDistance = 0;
      document.body.classList.add('grabbing');
    }

    function mouseDragged(event) {
      if (!isDragging) return;
      if (event.target && event.target.closest && event.target.closest('.lil-gui')) {
        return;
      }

      const dx = mouseX - dragStartX;
      const dy = mouseY - dragStartY;
      totalDragDistance = Math.hypot(dx, dy);
      targetPanX = startPanX + dx;
      targetPanY = startPanY + dy;
    }

    function mouseReleased(event) {
      if (!isDragging) return;
      isDragging = false;
      document.body.classList.remove('grabbing');

      // Pure click detection (distance moved < 6px)
      // Wires up canvas click to reseed or randomize
      if (totalDragDistance < 6) {
        if (settings.clickToRandomize) {
          randomizeAll();
        } else {
          reseedNoise();
        }
      }
    }

    // Touch Support for Mobile & Tablet Devices (Pinch-to-zoom + Pan)
    function touchStarted(event) {
      if (event.target && event.target.closest && event.target.closest('.lil-gui')) {
        return;
      }

      if (touches.length === 1) {
        isDragging = true;
        dragStartX = touches[0].x;
        dragStartY = touches[0].y;
        startPanX = targetPanX;
        startPanY = targetPanY;
        totalDragDistance = 0;
      } else if (touches.length === 2) {
        isDragging = false;
        initialPinchDistance = Math.hypot(touches[0].x - touches[1].x, touches[0].y - touches[1].y);
        pinchStartZoom = targetZoom;
      }
    }

    function touchMoved(event) {
      if (event.target && event.target.closest && event.target.closest('.lil-gui')) {
        return;
      }

      if (touches.length === 1 && isDragging) {
        const dx = touches[0].x - dragStartX;
        const dy = touches[0].y - dragStartY;
        totalDragDistance = Math.hypot(dx, dy);
        targetPanX = startPanX + dx;
        targetPanY = startPanY + dy;
        return false;
      } else if (touches.length === 2 && initialPinchDistance > 0) {
        const currentPinchDistance = Math.hypot(touches[0].x - touches[1].x, touches[0].y - touches[1].y);
        const factor = currentPinchDistance / initialPinchDistance;
        targetZoom = constrain(pinchStartZoom * factor, 0.2, 10.0);
        return false;
      }
    }

    function touchEnded(event) {
      if (isDragging) {
        isDragging = false;
        if (totalDragDistance < 8 && settings.clickToRandomize) {
          randomizeAll();
        }
      }
      initialPinchDistance = 0;
    }

    function resetCameraView() {
      targetPanX = 0;
      targetPanY = 0;
      targetZoom = 1.0;
    }

    function saveSnapshot() {
      saveCanvas('procedural_wave_strata_' + Date.now(), 'png');
    }

    // Keyboard Shortcuts
    function keyPressed(e) {
      if (e && e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) {
        return;
      }

      // Spacebar: Randomize or regenerate
      if (keyCode === 32) {
        if (settings.clickToRandomize) {
          randomizeAll();
        } else {
          reseedNoise();
        }
        return false;
      }

      // Key 'R' or 'r': Reset camera view
      if (keyCode === 82 || key === 'r' || key === 'R') {
        resetCameraView();
      }

      // Key 'S' or 's': Save PNG snapshot
      if (keyCode === 83 || key === 's' || key === 'S') {
        saveSnapshot();
      }
    }

    // ============================================================
    // Randomization Engine
    // Upon user click on scene, generates unique procedural variation
    // ============================================================
    function randomizeAll() {
      const keys = Object.keys(COLOR_SCHEMES);
      const randomKey = keys[Math.floor(Math.random() * keys.length)];

      settings.colorScheme = randomKey;
      applyColorScheme(randomKey);

      // Randomize geometric parameters within aesthetic ranges
      settings.layersDivisor = parseFloat((random(3.5, 7.5)).toFixed(1));
      settings.amplitudeMultiplier = parseFloat((random(0.7, 1.4)).toFixed(2));
      settings.noiseXScale = parseFloat((random(6.0, 16.0)).toFixed(1));
      settings.noiseYScale = parseFloat((random(6.0, 16.0)).toFixed(1));
      settings.angleMod = parseFloat((random(2.0, 6.0)).toFixed(1));
      settings.paletteSpread = parseFloat((random(0.35, 0.85)).toFixed(2));
      settings.paletteShift = parseFloat((random(0.0, 0.9)).toFixed(2));
      settings.animSpeed = parseFloat((random(0.5, 1.8)).toFixed(2));
      settings.rippleAmp = parseFloat((random(0.2, 0.7)).toFixed(2));
      settings.breatheIntensity = parseFloat((random(0.02, 0.09)).toFixed(3));
      settings.useCrestAttenuate = Math.random() < 0.25;

      reseedNoise();

      // Refresh lil-gui controls display
      if (gui) {
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      }
    }

    function applyColorScheme(schemeKey) {
      settings.colorScheme = schemeKey;
      epiColors.setScheme(schemeKey);
      document.body.style.backgroundColor = epiColors.BG;
    }

    // ============================================================
    // lil-gui Controller Setup
    // ============================================================
    function initGUI() {
      if (gui) {
        gui.destroy();
      }

      gui = new lil.GUI({ title: 'Wave Strata Controls' });

      // Theme & Color Palette Folder
      const fTheme = gui.addFolder('Palette & Theme');
      fTheme.add(settings, 'colorScheme', Object.keys(COLOR_SCHEMES))
        .name('Color Scheme')
        .onChange((val) => {
          applyColorScheme(val);
        });
      fTheme.add(settings, 'paletteSpread', 0.1, 1.5, 0.05).name('Palette Spread');
      fTheme.add(settings, 'paletteShift', 0.0, 1.0, 0.01).name('Palette Shift');
      fTheme.add(settings, 'paletteCycleSpeed', 0.0, 2.0, 0.05).name('Color Cycle Speed');
      fTheme.add(settings, 'strokeAlpha', 0, 255, 1).name('Stroke Opacity');
      fTheme.add(settings, 'strokeWeight', 0.0, 4.0, 0.5).name('Stroke Width');
      fTheme.add(settings, 'showFrame').name('Picture Frame');
      fTheme.add(settings, 'frameWeight', 2, 24, 1).name('Frame Weight');

      // Wave Geometry Folder
      const fGeo = gui.addFolder('Wave Geometry');
      fGeo.add(settings, 'layersDivisor', 2.0, 10.0, 0.5).name('Layer Density');
      fGeo.add(settings, 'amplitudeMultiplier', 0.3, 2.5, 0.05).name('Wave Amplitude');
      fGeo.add(settings, 'noiseXScale', 2.0, 25.0, 0.5).name('Noise X Freq');
      fGeo.add(settings, 'noiseYScale', 2.0, 25.0, 0.5).name('Noise Y Freq');
      fGeo.add(settings, 'yNoiseFreq', 1.0, 12.0, 0.5).name('Vertical Warp');
      fGeo.add(settings, 'angleMod', 0.0, 8.0, 0.2).name('Sine Curvature');
      fGeo.add(settings, 'useCrestAttenuate').name('Crest Attenuation');

      // Animation & Motion Folder
      const fAnim = gui.addFolder('Animation & Motion');
      fAnim.add(settings, 'animSpeed', 0.0, 4.0, 0.05).name('Animation Speed');
      fAnim.add(settings, 'breatheIntensity', 0.0, 0.2, 0.01).name('Swell Breathing');
      fAnim.add(settings, 'enableRipple').name('Harmonic Ripples');
      fAnim.add(settings, 'rippleAmp', 0.0, 1.5, 0.05).name('Ripple Texture');
      fAnim.add(settings, 'enableParticles').name('Ambient Stardust');
      fAnim.add(settings, 'particleCount', 0, 150, 5).name('Particle Count').onChange(() => initParticles());

      // Interaction & Procedural Randomization Folder
      const fInteract = gui.addFolder('Interaction & Randomization');
      fInteract.add(settings, 'clickToRandomize').name('Click to Randomize');
      fInteract.add(settings, 'mouseInfluence', 0.0, 2.0, 0.05).name('Cursor Wave Push');
      fInteract.add(settings, 'mouseRadius', 50, 400, 10).name('Cursor Radius');
      fInteract.add(settings, 'regenerate').name('↺ Reseed Noise');
      fInteract.add(settings, 'randomizeAll').name('🎲 Randomize All');

      // Camera & Viewport Folder
      const fCam = gui.addFolder('Camera & Viewport');
      fCam.add(settings, 'zoom', 0.15, 10.0, 0.01).name('Zoom Level').listen().onChange((val) => {
        targetZoom = val;
      });
      fCam.add(settings, 'resetCamera').name('Reset View');
      fCam.add(settings, 'saveSnapshot').name('📷 Save Snapshot');

      // Default opened folders
      fTheme.open();
      fAnim.open();
    }
  </script>
