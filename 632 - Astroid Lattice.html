  <title>Procedural Astroid Lattice — Three.js & GLSL</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;

    canvas:active {
      cursor: grabbing;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
      }

  </script>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import GUI from 'lil-gui';

    // ============================================================================
    // 1. PRECONFIGURED 19 COLOR SCHEMES
    // ============================================================================
    // Each scheme maps to:
    //   coreColor   (Star deep center)
    //   midColor    (Star mid-body gradient)
    //   rimColor    (Star inner cusp highlight)
    //   strokeColor (Star razor-sharp contour line)
    //   bgColor     (Canvas background color)
    const COLOR_SCHEMES = {
      'Original': {
        coreColor: '#E62612',
        midColor: '#FF6219',
        rimColor: '#F9BC2C',
        strokeColor: '#2E2927',
        bgColor: '#EFEFF1'
      },
      'Monochromatic': {
        coreColor: '#7A1208',
        midColor: '#C82817',
        rimColor: '#FF7A59',
        strokeColor: '#3B0A05',
        bgColor: '#F9ECE8'
      },
      'Analogous': {
        coreColor: '#D91E36',
        midColor: '#FF5E1A',
        rimColor: '#FFCC00',
        strokeColor: '#4A1808',
        bgColor: '#FAF3E8'
      },
      'Complementary': {
        coreColor: '#E63215',
        midColor: '#FF7626',
        rimColor: '#00A8B5',
        strokeColor: '#0B3B42',
        bgColor: '#ECF4F5'
      },
      'Split-complementary': {
        coreColor: '#E02F1E',
        midColor: '#FF8427',
        rimColor: '#00B48B',
        strokeColor: '#162854',
        bgColor: '#F0F3F8'
      },
      'Triadic': {
        coreColor: '#E62929',
        midColor: '#FF6B1A',
        rimColor: '#FFD000',
        strokeColor: '#1B3B8C',
        bgColor: '#F2F4FA'
      },
      'Tetradic': {
        coreColor: '#D92344',
        midColor: '#FF8811',
        rimColor: '#12B886',
        strokeColor: '#3A1C71',
        bgColor: '#F4F1F8'
      },
      'Double split-complementary': {
        coreColor: '#E0314B',
        midColor: '#FF7F2A',
        rimColor: '#2EC4B6',
        strokeColor: '#2E1F5E',
        bgColor: '#F3F6F5'
      },
      'Achromatic (B&W / W&B)': {
        coreColor: '#FFFFFF',
        midColor: '#B8B8C0',
        rimColor: '#686870',
        strokeColor: '#E0E0E5',
        bgColor: '#0E0E11'
      },
      'Achromatic + Accent (B&W / W&B + Red)': {
        coreColor: '#FF1A22',
        midColor: '#C82026',
        rimColor: '#E8E8EC',
        strokeColor: '#18181B',
        bgColor: '#F4F4F6'
      },
      'Neutral + Accent': {
        coreColor: '#D44D27',
        midColor: '#C28457',
        rimColor: '#DFC7B0',
        strokeColor: '#38302A',
        bgColor: '#EAE4DC'
      },
      'Palette 1 (F6AA1C, BC3908, 941B0C, F6AA1C, 220901)': {
        coreColor: '#941B0C',
        midColor: '#BC3908',
        rimColor: '#F6AA1C',
        strokeColor: '#F6AA1C',
        bgColor: '#220901'
      },
      'Palette 2 (63D1CF, 5BC0BE, 4BAD9E, 4BAD9E, 0B132B, 000000)': {
        coreColor: '#0B132B',
        midColor: '#4BAD9E',
        rimColor: '#63D1CF',
        strokeColor: '#5BC0BE',
        bgColor: '#000000'
      },
      'Palette 3 (AA60C8, D69ADE, C9A3C6, CFB5C2, 0D001D, 120A12)': {
        coreColor: '#AA60C8',
        midColor: '#D69ADE',
        rimColor: '#CFB5C2',
        strokeColor: '#C9A3C6',
        bgColor: '#0D001D'
      },
      'Palette 4 (FEF1BE, FFBA00, 008189, 00474D, 061210)': {
        coreColor: '#00474D',
        midColor: '#008189',
        rimColor: '#FFBA00',
        strokeColor: '#FEF1BE',
        bgColor: '#061210'
      },
      'Palette 5 (D4FFB0, 7FFF00, 00B894, 0A3322, 05140A)': {
        coreColor: '#00B894',
        midColor: '#7FFF00',
        rimColor: '#D4FFB0',
        strokeColor: '#0A3322',
        bgColor: '#05140A'
      },
      'Palette 6 (FFE8CC, FF8C00, C7501A, 3D1050, 0E0618)': {
        coreColor: '#C7501A',
        midColor: '#FF8C00',
        rimColor: '#FFE8CC',
        strokeColor: '#3D1050',
        bgColor: '#0E0618'
      },
      'Palette 7 (E8E0FF, B38FFF, 6A3DE8, 1A1250, 090612)': {
        coreColor: '#6A3DE8',
        midColor: '#B38FFF',
        rimColor: '#E8E0FF',
        strokeColor: '#1A1250',
        bgColor: '#090612'
      },
      'Palette 8 (E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)': {
        coreColor: '#D40078',
        midColor: '#00F0FF',
        rimColor: '#E0FBFF',
        strokeColor: '#1E0A3D',
        bgColor: '#05020F'
      }
    };

    const SCHEME_NAMES = Object.keys(COLOR_SCHEMES);

    // ============================================================================
    // 2. PRECONFIGURED 8 ANIMATIONS
    // ============================================================================
    const ANIMATION_MODES = {
      '1. Signature Kaleido Cycle': 0,
      '2. Slow Orbital Drift': 1,
      '3. Hypnotic Lattice Wave': 2,
      '4. Pendulum Symmetry Fold': 3,
      '5. Infinite Deep Glide': 4,
      '6. Breathing Astroid Bloom': 5,
      '7. Silk Ribbon Twist': 6,
      '8. Static Camera (No Motion)': 7
    };

    const ANIMATION_NAMES = Object.keys(ANIMATION_MODES);

    // ============================================================================
    // 3. APPLICATION STATE & CONFIGURATION
    // ============================================================================
    const defaultDPR = Math.min(window.devicePixelRatio || 1, 2);

    const state = {
      // Renderer & Performance
      dpr: defaultDPR,
      antialias: true,
      clickToRandomize: true,

      // Animation & Camera
      animationPreset: '1. Signature Kaleido Cycle',
      animationSpeed: 0.45,
      userZoom: 1.0,
      userOrbitAngle: 0.0,
      userCameraTilt: 0.0,
      userPanX: 0.0,
      userPanY: 0.0,

      // Color & Background
      colorScheme: 'Original',
      achromaticInvert: false,
      greenscreen: false,
      coreColor: COLOR_SCHEMES['Original'].coreColor,
      midColor: COLOR_SCHEMES['Original'].midColor,
      rimColor: COLOR_SCHEMES['Original'].rimColor,
      strokeColor: COLOR_SCHEMES['Original'].strokeColor,
      bgColor: COLOR_SCHEMES['Original'].bgColor,

      // Geometry & Pattern Parameters
      gridDensity: 3.2,
      starSize: 0.92,
      cuspSharpness: 1.0,
      strokeWidth: 0.016,
      needleExtension: 0.085,
      staggerAmount: 0.5,
      symmetryFold: 0.0,
      waveModulation: 0.2,
      domainWarp: 0.0,

      // Round Particles
      particlesIntensity: 0.25,
      particlesScale: 1.0,

      // Exposure & Multi-Light System
      exposure: 1.05,
      sceneLightIntensity: 1.0,
      ambientIntensity: 0.72,
      ambientColor: '#FFFFFF',

      keyLightIntensity: 0.85,
      keyLightColor: '#FFF7E8',
      keyLightAzimuth: 40.0,
      keyLightElevation: 55.0,

      fillLightIntensity: 0.45,
      fillLightColor: '#FFE0C2',
      fillLightAzimuth: -135.0,
      fillLightElevation: 35.0,

      rimLightIntensity: 0.60,
      rimLightColor: '#FFBA42',
      rimLightFalloff: 1.8
    };

    // ============================================================================
    // 4. GLSL SHADERS
    // ============================================================================
    const vertexShader = /* glsl */ `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = vec4(position, 1.0);
      }
    `;

    const fragmentShader = /* glsl */ `
      precision highp float;

      varying vec2 vUv;

      // Core Required Uniforms
      uniform float u_time;
      uniform vec2 u_resolution;
      uniform vec2 u_mouse;

      // Interactive Camera & Transform Uniforms
      uniform int u_animMode;
      uniform float u_userZoom;
      uniform float u_userAngle;
      uniform float u_userTilt;
      uniform vec2 u_userPan;
      uniform float u_antialias;

      // Color & Greenscreen Uniforms
      uniform bool u_greenscreen;
      uniform vec3 u_coreColor;
      uniform vec3 u_midColor;
      uniform vec3 u_rimColor;
      uniform vec3 u_strokeColor;
      uniform vec3 u_bgColor;

      // Geometric & Pattern Uniforms
      uniform float u_gridDensity;
      uniform float u_starSize;
      uniform float u_cuspSharpness;
      uniform float u_strokeWidth;
      uniform float u_needleExtension;
      uniform float u_staggerAmount;
      uniform float u_symmetryFold;
      uniform float u_waveModulation;
      uniform float u_domainWarp;

      // Round Particles Uniforms
      uniform float u_particlesIntensity;
      uniform float u_particlesScale;

      // Exposure & Individual Light Source Uniforms
      uniform float u_exposure;
      uniform float u_sceneLightIntensity;
      uniform float u_ambientIntensity;
      uniform vec3 u_ambientColor;

      uniform float u_keyIntensity;
      uniform vec3 u_keyColor;
      uniform vec3 u_keyDir;

      uniform float u_fillIntensity;
      uniform vec3 u_fillColor;
      uniform vec3 u_fillDir;

      uniform float u_rimIntensity;
      uniform vec3 u_rimColor;
      uniform float u_rimFalloff;

      #define PI 3.14159265359
      #define TAU 6.28318530718

      // 2D rotation matrix
      mat2 rot2D(float a) {
        float s = sin(a), c = cos(a);
        return mat2(c, -s, s, c);
      }

      // Hash functions for procedural variation and round particles
      float hash21(vec2 p) {
        p = fract(p * vec2(234.34, 435.345));
        p += dot(p, p + 34.23);
        return fract(p.x * p.y);
      }

      vec2 hash22(vec2 p) {
        float n = hash21(p);
        return vec2(n, hash21(p + n + 17.3));
      }

      // Smooth value noise for organic domain warping
      float noise2D(vec2 p) {
        vec2 i = floor(p);
        vec2 f = fract(p);
        vec2 u = f * f * (3.0 - 2.0 * f);
        return mix(
          mix(hash21(i + vec2(0.0, 0.0)), hash21(i + vec2(1.0, 0.0)), u.x),
          mix(hash21(i + vec2(0.0, 1.0)), hash21(i + vec2(1.0, 1.0)), u.x),
          u.y
        );
      }

      // --------------------------------------------------------------------------
      // Astroid Concave Star Evaluation
      // Models a 4-pointed star formed by 4 tangent corner circles in local space.
      // Returns:
      //   x: signed distance to the colored interior fill (< 0 inside fill)
      //   y: distance to the razor-sharp circular arc contour (for ink stroke)
      //   z: normalized radial distance from star center (0 at center, 1 at tips)
      //   w: inward bevel distance from concave arc (for inner golden rim & normal)
      // --------------------------------------------------------------------------
      vec4 evalAstroidStar(vec2 p, float tipSpan, float curvature, float insetFill, float needleExt) {
        vec2 a = abs(p);

        // Circle center at (tipSpan, tipSpan) in quadrant 1
        // When radius == tipSpan, the circle is tangent to the X and Y axes at (tipSpan, 0) & (0, tipSpan),
        // creating razor-sharp 0-degree cusps along the axes.
        float rCircle = tipSpan * curvature;
        vec2 circleCenter = vec2(tipSpan, tipSpan);

        float distToCircleCenter = length(a - circleCenter);
        // Negative when inside the star (outside the 4 corner circles)
        float dArc = rCircle - distToCircleCenter;

        // Bounding extents for the interior fill vs the extended needle tips
        float boxFill = max(a.x, a.y) - tipSpan;
        float boxStroke = max(a.x, a.y) - tipSpan * (1.0 + needleExt);

        // Interior fill is slightly inset from the true mathematical cusp so the
        // dark contour lines merge and extend beyond the orange fill into sharp needles
        float dFill = max(dArc + insetFill, boxFill);

        // The contour stroke follows dArc == 0 all the way out to boxStroke
        float dContour = max(abs(dArc - insetFill * 0.15), boxStroke);

        float radialNorm = clamp(length(p) / max(tipSpan, 0.001), 0.0, 1.2);
        float arcInward = clamp(-dFill / max(tipSpan * 0.42, 0.001), 0.0, 1.0);

        return vec4(dFill, dContour, radialNorm, arcInward);
      }

      // --------------------------------------------------------------------------
      // Round Particle Layer (Strictly round radial SDF, never square)
      // --------------------------------------------------------------------------
      float renderRoundParticles(vec2 uv, float t, float scale) {
        if (u_particlesIntensity <= 0.001) return 0.0;

        float acc = 0.0;
        for (int layer = 0; layer < 2; layer++) {
          float fl = float(layer);
          float freq = (4.5 + fl * 3.5) * max(scale, 0.25);
          vec2 p = uv * freq + vec2(t * (0.08 + fl * 0.04), -t * (0.05 - fl * 0.03));
          vec2 id = floor(p);
          vec2 gv = fract(p) - 0.5;

          for (int y = -1; y <= 1; y++) {
            for (int x = -1; x <= 1; x++) {
              vec2 offs = vec2(float(x), float(y));
              vec2 rnd = hash22(id + offs + fl * 31.7);
              vec2 pos = offs + 0.36 * sin(rnd * TAU + t * (0.6 + rnd.x * 0.5));
              // Strict Euclidean length for perfectly round particles
              float d = length(gv - pos);
              float radius = (0.025 + 0.035 * rnd.y);
              float spark = smoothstep(radius, radius * 0.15, d);
              float pulse = 0.5 + 0.5 * sin(t * 1.5 + rnd.x * TAU);
              acc += spark * pulse * (0.65 - fl * 0.2);
            }
          }
        }
        return clamp(acc * u_particlesIntensity, 0.0, 1.0);
      }

      void main() {
        // 1. Aspect-Ratio Corrected Coordinates Centered at (0.0, 0.0)
        vec2 uv = (gl_FragCoord.xy - 0.5 * u_resolution.xy) / min(u_resolution.x, u_resolution.y);

        // Smooth mouse in centered aspect-corrected coordinates
        vec2 mouseCentered = (u_mouse - 0.5) * vec2(u_resolution.x / min(u_resolution.x, u_resolution.y), u_resolution.y / min(u_resolution.x, u_resolution.y));

        // 2. Animation Choreography Preset Selection
        float t = u_time;

        // Default animated choreography deltas (added to user persistent controls)
        float animZoomFactor = 1.0;
        float animAngle = 0.0;
        float animTilt = 0.0;
        vec2 animPan = vec2(0.0);

        float starBaseRot = PI * 0.25; // 45 degrees ('x' orientation like 00:00 and 00:02)
        float dynamicStagger = u_staggerAmount;
        float dynamicFold = u_symmetryFold;
        float dynamicWave = u_waveModulation;
        float dynamicWarp = u_domainWarp;
        float dynamicSizeMod = 1.0;

        if (u_animMode == 0) {
          // 1. Signature Kaleido Cycle (Faithful to 00:00 -> 00:01 -> 00:02 -> 00:03 -> 00:04)
          float phase = mod(t * 0.55, 5.0);
          float p01 = smoothstep(0.2, 0.85, phase) - smoothstep(1.15, 1.85, phase); // Subdivided mirror state (00:01)
          float p02 = smoothstep(1.15, 1.85, phase) - smoothstep(2.15, 2.85, phase); // Clean 3x3 grid (00:02)
          float p03 = smoothstep(2.15, 2.85, phase) - smoothstep(3.15, 3.85, phase); // Wave-modulated grid (00:03)
          float p04 = smoothstep(3.15, 3.85, phase) - smoothstep(4.15, 4.85, phase); // Upright '+' rotated staggered stars (00:04)

          animZoomFactor = 1.0 + 0.95 * p01 + 0.85 * p03 - 0.12 * p02;
          dynamicFold = clamp(u_symmetryFold + p01 * 0.92, 0.0, 1.0);
          dynamicStagger = mix(u_staggerAmount, 0.0, clamp(p02 + p01 * 0.6, 0.0, 1.0));
          dynamicWave = u_waveModulation + 0.65 * p03 + 0.25 * p01;
          starBaseRot = PI * 0.25 * (1.0 - p04);
          animPan = vec2(sin(t * 0.22) * 0.08, cos(t * 0.18) * 0.06);
        } else if (u_animMode == 1) {
          // 2. Slow Orbital Drift
          animAngle = t * 0.28;
          animTilt = 0.22 * sin(t * 0.35);
          animPan = vec2(cos(t * 0.25), sin(t * 0.25)) * 0.25;
          starBaseRot = PI * 0.25 + 0.25 * sin(t * 0.4);
          animZoomFactor = 1.0 + 0.12 * sin(t * 0.3);
        } else if (u_animMode == 2) {
          // 3. Hypnotic Lattice Wave
          dynamicWave = max(u_waveModulation, 0.72);
          starBaseRot = PI * 0.25 + 0.18 * sin(t * 0.5);
          animPan = vec2(t * 0.12, t * 0.06);
        } else if (u_animMode == 3) {
          // 4. Pendulum Symmetry Fold
          dynamicFold = 0.5 + 0.5 * sin(t * 0.45);
          animAngle = 0.25 * sin(t * 0.22);
          starBaseRot = PI * 0.25 + 0.35 * cos(t * 0.35);
          animZoomFactor = 1.15 + 0.35 * sin(t * 0.45);
        } else if (u_animMode == 4) {
          // 5. Infinite Deep Glide
          animPan = vec2(t * 0.22, -t * 0.14);
          starBaseRot = PI * 0.25 + 0.15 * sin(t * 0.3);
          dynamicStagger = 0.5 + 0.5 * sin(t * 0.25);
        } else if (u_animMode == 5) {
          // 6. Breathing Astroid Bloom
          dynamicSizeMod = 0.88 + 0.16 * sin(t * 0.65);
          starBaseRot = PI * 0.125 + PI * 0.125 * cos(t * 0.4);
          dynamicWave = u_waveModulation + 0.25 * (0.5 + 0.5 * sin(t * 0.5));
        } else if (u_animMode == 6) {
          // 7. Silk Ribbon Twist
          dynamicWarp = max(u_domainWarp, 0.42);
          animAngle = 0.18 * sin(t * 0.25);
          starBaseRot = PI * 0.25 + 0.3 * sin(t * 0.35);
          animPan = vec2(sin(t * 0.2) * 0.15, cos(t * 0.15) * 0.15);
        } else {
          // 8. Static Camera (No camera movement; only gentle in-place shader breathing)
          animZoomFactor = 1.0;
          animAngle = 0.0;
          animTilt = 0.0;
          animPan = vec2(0.0);
          starBaseRot = PI * 0.25;
        }

        // 3. Apply User Persistent Camera Controls (Wheel Zoom, Orbit Angle, Tilt, Drag Pan)
        // Notice userZoom and userAngle never reset during camera animations
        float totalAngle = animAngle + u_userAngle;
        float totalTilt = clamp(animTilt + u_userTilt, -0.75, 0.75);
        float effectiveScale = max(0.25, u_gridDensity * animZoomFactor / max(u_userZoom, 0.08));

        // Apply camera rotation & subtle perspective tilt foreshortening
        vec2 p = uv;
        p = rot2D(totalAngle) * p;
        float perspZ = 1.0 + dot(p, vec2(sin(totalAngle), cos(totalAngle))) * totalTilt * 0.45;
        p /= max(perspZ, 0.35);
        p.y *= (1.0 + abs(totalTilt) * 0.25);

        // Apply pan (user drag + animation drift)
        p = p * effectiveScale - u_userPan * u_gridDensity + animPan * u_gridDensity;

        // Subtle interactive cursor ripple
        vec2 mouseWorld = rot2D(totalAngle) * mouseCentered;
        float mouseDist = length(uv - mouseCentered);
        float mouseInfluence = exp(-mouseDist * mouseDist * 6.5);
        p += (uv - mouseCentered) * mouseInfluence * 0.18;

        // Optional organic domain warp
        if (dynamicWarp > 0.001) {
          vec2 warpOffset = vec2(
            noise2D(p * 0.65 + vec2(t * 0.25, 0.0)) - 0.5,
            noise2D(p * 0.65 + vec2(0.0, -t * 0.25) + 19.3) - 0.5
          );
          p += warpOffset * dynamicWarp * 1.15;
        }

        // 4. Multi-Scale Symmetry Folding (Creates the 00:01 kaleidoscopic tile clusters)
        float foldTilt = 0.0;
        if (dynamicFold > 0.001) {
          vec2 macroCell = floor(p * 0.5);
          vec2 macroFract = fract(p * 0.5) - 0.5;
          // Smoothly fold coordinates across vertical & horizontal symmetry axes
          vec2 folded = abs(macroFract);
          vec2 subP = (macroCell + 0.5 + mix(macroFract, folded - 0.25, dynamicFold)) * 2.0;
          // Induce subtle pinwheel tilt inside each folded quadrant (matching 00:01)
          float quadrantSign = sign(macroFract.x * macroFract.y + 0.0001);
          foldTilt = dynamicFold * quadrantSign * 0.22 * sin(t * 0.6 + (macroCell.x + macroCell.y) * 1.5);
          p = mix(p, subP, dynamicFold);
        }

        // 5. Staggered Lattice & Neighborhood Evaluation
        // Because sharp needle tips of stars can extend slightly across cell boundaries,
        // we evaluate the current cell and immediate neighbors for seamless cusps.
        float rowIdx = floor(p.y + 0.5);
        float rowShift = mod(rowIdx, 2.0) * dynamicStagger * 0.5;
        vec2 baseGrid = vec2(p.x + rowShift, p.y);
        vec2 baseCellId = floor(baseGrid + 0.5);

        float minFillDist = 1e5;
        float minContourDist = 1e5;
        float bestRadial = 0.0;
        float bestArcInward = 0.0;
        vec2 bestLocalPos = vec2(0.0);
        float bestTipSpan = 0.45;

        for (int dy = -1; dy <= 1; dy++) {
          for (int dx = -1; dx <= 1; dx++) {
            vec2 neighborRowCol = baseCellId + vec2(float(dx), float(dy));
            float nRow = neighborRowCol.y;
            float nShift = mod(nRow, 2.0) * dynamicStagger * 0.5;

            // Cell center in p-space
            vec2 cellCenter = vec2(neighborRowCol.x - nShift, nRow);
            vec2 localP = p - cellCenter;

            // Spatial wave modulation across the lattice (matches 00:03 & 00:01)
            float wavePhase = dot(neighborRowCol, vec2(0.85, 0.65)) - t * 1.4;
            float waveVal = sin(wavePhase) * cos(neighborRowCol.x * 0.7 - neighborRowCol.y * 0.7 + t * 0.9);

            float localScaleMod = dynamicSizeMod * (1.0 - dynamicWave * 0.28 * (0.5 - 0.5 * waveVal));
            float localRot = starBaseRot + foldTilt + dynamicWave * 0.26 * waveVal + mouseInfluence * 0.35;

            vec2 rotP = rot2D(localRot) * localP;

            // Tip span of the 4-pointed astroid star
            float tipSpan = 0.47 * u_starSize * clamp(localScaleMod, 0.35, 1.35);
            // Inset of the colored fill relative to the outer needle tips
            float insetFill = u_strokeWidth * 1.35;

            vec4 starData = evalAstroidStar(
              rotP,
              tipSpan,
              u_cuspSharpness,
              insetFill,
              u_needleExtension
            );

            if (starData.x < minFillDist) {
              minFillDist = starData.x;
              bestRadial = starData.z;
              bestArcInward = starData.w;
              bestLocalPos = rotP;
              bestTipSpan = tipSpan;
            }
            if (starData.y < minContourDist) {
              minContourDist = starData.y;
            }
          }
        }

        // 6. Analytical Antialiasing Width
        float pxSize = effectiveScale / min(u_resolution.x, u_resolution.y);
        float aaWidth = pxSize * mix(0.35, 1.35, u_antialias);

        // 7. Interior Star Shading, 3D Relief Normal & Multi-Light Illumination
        // Construct a smooth 3D dome/cusp normal for each star so the configurable
        // scene lights (Key, Fill, Rim, Ambient) sculpt the star surface naturally.
        vec2 normXY = bestLocalPos / max(bestTipSpan, 0.001);
        float domeZ = sqrt( clamp(1.0 - dot(normXY, normXY) * 0.65, 0.05, 1.0) );
        vec3 surfaceNormal = normalize(vec3(normXY * (0.65 + 0.5 * (1.0 - bestArcInward)), domeZ));

        // Base radial + concave arc color gradient (faithful to reference video)
        // Center is rich coreColor -> mid-body is vibrant midColor -> concave edge rim is rimColor
        float coreToMid = smoothstep(0.0, 0.62, bestRadial);
        float edgeRimFactor = pow(clamp(1.0 - bestArcInward, 0.0, 1.0), 2.2) * smoothstep(0.12, 0.88, bestRadial);

        vec3 baseStarAlbedo = mix(u_coreColor, u_midColor, coreToMid);
        baseStarAlbedo = mix(baseStarAlbedo, u_rimColor, clamp(edgeRimFactor * 1.15, 0.0, 1.0));

        // Compute contributions from each controllable light source
        vec3 viewDir = vec3(0.0, 0.0, 1.0);

        // Ambient Light
        vec3 ambientTerm = u_ambientColor * u_ambientIntensity;

        // Key Light (Diffuse + Soft Specular Sheen)
        float keyNdotL = max(dot(surfaceNormal, u_keyDir), 0.0);
        vec3 keyHalf = normalize(u_keyDir + viewDir);
        float keySpec = pow(max(dot(surfaceNormal, keyHalf), 0.0), 24.0) * 0.28;
        vec3 keyTerm = u_keyColor * u_keyIntensity * (keyNdotL * 0.65 + keySpec);

        // Fill Light
        float fillNdotL = max(dot(surfaceNormal, u_fillDir), 0.0);
        vec3 fillTerm = u_fillColor * u_fillIntensity * (fillNdotL * 0.55);

        // Rim / Core Glow Light
        float rimGlow = pow(clamp(1.0 - bestArcInward, 0.0, 1.0), max(u_rimFalloff, 0.3));
        vec3 rimTerm = u_rimColor * u_rimLightColor * (u_rimIntensity * rimGlow * 0.45);

        vec3 totalLighting = mix(vec3(1.0), (ambientTerm + keyTerm + fillTerm) * u_sceneLightIntensity, 0.65);
        vec3 litStarColor = baseStarAlbedo * totalLighting + rimTerm * u_sceneLightIntensity;

        // 8. Background & Razor-Sharp Ink Contour Composition
        vec3 bgBase = u_greenscreen ? vec3(0.0, 1.0, 0.0) : u_bgColor;

        // Subtle paper/canvas outer bevel halo right outside the concave arc (matches 00:00 & 00:02)
        if (!u_greenscreen) {
          float outerBevel = exp(-max(minFillDist, 0.0) * 42.0) * 0.045;
          bgBase = mix(bgBase, u_strokeColor, outerBevel);
        }

        // Fill mask (1.0 inside star, 0.0 outside)
        float fillMask = 1.0 - smoothstep(-aaWidth, aaWidth, minFillDist);

        // Contour stroke mask along the circular arcs & sharp needle tips
        float halfStroke = u_strokeWidth * 0.42;
        float strokeMask = 1.0 - smoothstep(halfStroke - aaWidth, halfStroke + aaWidth, minContourDist);

        // Combine background, star interior fill, and thin contour line
        vec3 color = mix(bgBase, litStarColor, fillMask);
        color = mix(color, u_strokeColor, strokeMask * 0.92);

        // 9. Round Luminous Micro-Particles (Strictly circular, never square)
        float roundParticles = renderRoundParticles(uv, t, u_particlesScale);
        if (roundParticles > 0.001) {
          vec3 particleCol = mix(u_rimColor, vec3(1.0), 0.45);
          // If greenscreen is active, only render particles over the stars so chroma key stays pure
          float pMask = u_greenscreen ? fillMask : 1.0;
          color = mix(color, particleCol, roundParticles * pMask * 0.75);
        }

        // 10. Exposure & Soft Filmic Clamping (Preserves pure #00ff00 when greenscreen is enabled)
        if (u_greenscreen && fillMask < 0.01 && strokeMask < 0.01) {
          gl_FragColor = vec4(0.0, 1.0, 0.0, 1.0);
        } else {
          color *= u_exposure;
          // Soft highlight compression to prevent harsh blown-out highlights while preserving vibrant colors
          color = color / (1.0 + max(vec3(0.0), color - 0.85) * 0.45);
          color = clamp(color, 0.0, 1.0);
          gl_FragColor = vec4(color, 1.0);
        }
      }
    `;

    // Note: Add missing uniform declaration u_rimLightColor in fragmentShader
    const finalFragmentShader = fragmentShader.replace(
      'uniform float u_rimIntensity;\n      uniform vec3 u_rimColor;',
      'uniform float u_rimIntensity;\n      uniform vec3 u_rimLightColor;'
    );

    // ============================================================================
    // 5. THREE.JS SCENE, CAMERA, RENDERER & UNIFORMS SETUP
    // ============================================================================
    const scene = new THREE.Scene();

    // Convert spherical azimuth/elevation (degrees) to normalized 3D light direction vector
    function anglesToDirection(azimuthDeg, elevationDeg) {
      const az = THREE.MathUtils.degToRad(azimuthDeg);
      const el = THREE.MathUtils.degToRad(elevationDeg);
      const cosEl = Math.cos(el);
      return new THREE.Vector3(
        Math.cos(az) * cosEl,
        Math.sin(az) * cosEl,
        Math.sin(el)
      ).normalize();
    }

    const uniforms = {
      u_time: { value: 0.0 },

    const geometry = new THREE.PlaneGeometry(2, 2);

    scene.add(quadMesh);

    function createRenderer(useAntialias) {
      if (renderer) {
        const oldCanvas = renderer.domElement;
        renderer.dispose();
        if (oldCanvas && oldCanvas.parentNode) {
          oldCanvas.parentNode.removeChild(oldCanvas);
        }
      }

      renderer = new THREE.WebGLRenderer({
        antialias: useAntialias,
        powerPreference: 'high-performance'
      });

      renderer.setPixelRatio(state.dpr);
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      uniforms.u_resolution.value.set(
        window.innerWidth * state.dpr,
        window.innerHeight * state.dpr
      );

      attachCanvasListeners(renderer.domElement);
    }

    // ============================================================================
    // 6. COLOR SCHEME & UNIFORM SYNCHRONIZATION
    // ============================================================================
    function applyColorScheme(schemeName) {
      const scheme = COLOR_SCHEMES[schemeName];
      if (!scheme) return;

      if (
        (schemeName === 'Achromatic (B&W / W&B)' ||
          schemeName === 'Achromatic + Accent (B&W / W&B + Red)') &&
        state.achromaticInvert
      ) {
        if (schemeName === 'Achromatic (B&W / W&B)') {
          state.coreColor = '#111114';
          state.midColor = '#45454C';
          state.rimColor = '#9A9AA4';
          state.strokeColor = '#141418';
          state.bgColor = '#F4F4F6';
        } else {
          state.coreColor = '#FF1A22';
          state.midColor = '#D91E26';
          state.rimColor = '#323238';
          state.strokeColor = '#E6E6EC';
          state.bgColor = '#0D0D10';
        }
      } else {
        state.coreColor = scheme.coreColor;
        state.midColor = scheme.midColor;
        state.rimColor = scheme.rimColor;
        state.strokeColor = scheme.strokeColor;
        state.bgColor = scheme.bgColor;
      }

      syncUniformsFromState();
      updateGUIDisplay();
    }

    function syncUniformsFromState() {
      uniforms.u_animMode.value = ANIMATION_MODES[state.animationPreset];
      uniforms.u_antialias.value = state.antialias ? 1.0 : 0.0;

      uniforms.u_greenscreen.value = state.greenscreen;
      uniforms.u_coreColor.value.set(state.coreColor);
      uniforms.u_midColor.value.set(state.midColor);
      uniforms.u_rimColor.value.set(state.rimColor);
      uniforms.u_strokeColor.value.set(state.strokeColor);
      uniforms.u_bgColor.value.set(state.bgColor);

      uniforms.u_gridDensity.value = state.gridDensity;
      uniforms.u_starSize.value = state.starSize;
      uniforms.u_cuspSharpness.value = state.cuspSharpness;
      uniforms.u_strokeWidth.value = state.strokeWidth;
      uniforms.u_needleExtension.value = state.needleExtension;
      uniforms.u_staggerAmount.value = state.staggerAmount;
      uniforms.u_symmetryFold.value = state.symmetryFold;
      uniforms.u_waveModulation.value = state.waveModulation;
      uniforms.u_domainWarp.value = state.domainWarp;

      uniforms.u_particlesIntensity.value = state.particlesIntensity;

      uniforms.u_ambientIntensity.value = state.ambientIntensity;
      uniforms.u_ambientColor.value.set(state.ambientColor);

      uniforms.u_keyIntensity.value = state.keyLightIntensity;
      uniforms.u_keyColor.value.set(state.keyLightColor);
      uniforms.u_keyDir.value.copy(
        anglesToDirection(state.keyLightAzimuth, state.keyLightElevation)

      uniforms.u_fillIntensity.value = state.fillLightIntensity;
      uniforms.u_fillColor.value.set(state.fillLightColor);
      uniforms.u_fillDir.value.copy(
        anglesToDirection(state.fillLightAzimuth, state.fillLightElevation)
      );

      uniforms.u_rimIntensity.value = state.rimLightIntensity;
      uniforms.u_rimLightColor.value.set(state.rimLightColor);
      uniforms.u_rimFalloff.value = state.rimLightFalloff;
    }

    // ============================================================================
    // 7. CLICK-TO-RANDOMIZE PROCEDURAL GENERATOR
    // ============================================================================
    function randomizeSceneVariation() {
      // Pick a random color scheme from the 19 preconfigured palettes
      const randomScheme = SCHEME_NAMES[Math.floor(Math.random() * SCHEME_NAMES.length)];
      state.colorScheme = randomScheme;
      state.achromaticInvert = Math.random() > 0.5;
      applyColorScheme(randomScheme);

      // Pick a random animation preset (excluding static mode most of the time so motion feels alive)
      const randomAnimIdx = Math.floor(Math.random() * ANIMATION_NAMES.length);
      state.animationPreset = ANIMATION_NAMES[randomAnimIdx];

      // Re-roll geometric & motion parameters within harmonious bounds
      state.gridDensity = Number((2.2 + Math.random() * 3.6).toFixed(2));
      state.starSize = Number((0.76 + Math.random() * 0.28).toFixed(2));
      state.cuspSharpness = Number((0.92 + Math.random() * 0.16).toFixed(3));
      state.strokeWidth = Number((0.01 + Math.random() * 0.018).toFixed(3));
      state.needleExtension = Number((0.04 + Math.random() * 0.10).toFixed(3));
      state.staggerAmount = Number((Math.random() > 0.35 ? 0.5 : Math.random() * 0.5).toFixed(2));
      state.symmetryFold = Number((Math.random() > 0.45 ? Math.random() * 0.85 : 0.0).toFixed(2));
      state.waveModulation = Number((Math.random() * 0.65).toFixed(2));
      state.domainWarp = Number((Math.random() > 0.6 ? Math.random() * 0.35 : 0.0).toFixed(2));
      state.animationSpeed = Number((0.25 + Math.random() * 0.55).toFixed(2));

      syncUniformsFromState();
      updateGUIDisplay();
    }

    // ============================================================================
    // 9. INTERACTIVITY: MOUSE, WHEEL ZOOM, DRAG PAN, ORBIT ANGLE & 'H' KEY UI TOGGLE

    const targetMouse = new THREE.Vector2(0.5, 0.5);

    function attachCanvasListeners(canvasEl) {
      canvasEl.addEventListener('contextmenu', (e) => e.preventDefault());

      canvasEl.addEventListener('pointerdown', (e) => {
        isDragging = true;
        totalDragDistance = 0;
        pointerDownPos.set(e.clientX, e.clientY);
        prevPointerPos.set(e.clientX, e.clientY);

        // Right mouse button or Shift/Alt key rotates camera orbit angle & tilt
        if (e.button === 2 || e.shiftKey || e.altKey) {
          dragMode = 'orbit';
        } else {
          dragMode = 'pan';
        }
      });

      canvasEl.addEventListener(
        'wheel',
        (e) => {
          e.preventDefault();
          const zoomFactor = Math.exp(-e.deltaY * 0.0012);
          targetZoom = THREE.MathUtils.clamp(targetZoom * zoomFactor, 0.25, 4.0);
          state.userZoom = Number(targetZoom.toFixed(2));
          updateGUIDisplay();
        },
        { passive: false }
      );
    }

    window.addEventListener('pointermove', (e) => {
      const nx = e.clientX / window.innerWidth;
      const ny = 1.0 - e.clientY / window.innerHeight;
      targetMouse.set(
        THREE.MathUtils.clamp(nx, 0.0, 1.0),
        THREE.MathUtils.clamp(ny, 0.0, 1.0)
      );

      if (!isDragging) return;

      const dx = e.clientX - prevPointerPos.x;
      const dy = e.clientY - prevPointerPos.y;
      prevPointerPos.set(e.clientX, e.clientY);
      totalDragDistance += Math.hypot(dx, dy);

      const minDim = Math.min(window.innerWidth, window.innerHeight);

      if (dragMode === 'orbit') {
        targetOrbitAngle = ((targetOrbitAngle - dx * 0.35 + 540) % 360) - 180;
        targetCameraTilt = THREE.MathUtils.clamp(
          targetCameraTilt + dy * 0.003,
          -0.7,
          0.7
        );
        state.userOrbitAngle = Math.round(targetOrbitAngle);
        state.userCameraTilt = Number(targetCameraTilt.toFixed(2));
        updateGUIDisplay();
      } else {
        // Convert screen drag delta into world pan coordinates respecting camera angle and zoom
        const angleRad = THREE.MathUtils.degToRad(currentOrbitAngle) +
          (state.animationPreset === '2. Slow Orbital Drift' ? uniforms.u_time.value * 0.28 : 0.0);
        const cosA = Math.cos(angleRad);
        const sinA = Math.sin(angleRad);

        const ndx = (dx / minDim) / Math.max(currentZoom, 0.15);
        const ndy = (-dy / minDim) / Math.max(currentZoom, 0.15);

        const rx = cosA * ndx - sinA * ndy;
        const ry = sinA * ndx + cosA * ndy;

        targetPan.x += rx;
        targetPan.y += ry;
        state.userPanX = Number(targetPan.x.toFixed(3));
        state.userPanY = Number(targetPan.y.toFixed(3));
      }
    });

    window.addEventListener('pointerup', (e) => {
      if (!isDragging) return;
      isDragging = false;

      // Trigger Click-to-Randomize if user clicked cleanly on the canvas (not dragged)
      if (
        state.clickToRandomize &&
        totalDragDistance < 5 &&
        e.button === 0 &&
        e.target === renderer.domElement
      ) {
        randomizeSceneVariation();
      }
    });

    // Toggle UI visibility with "H" key
    let uiVisible = true;
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        // Ignore if user is typing inside an input field
        if (
          document.activeElement &&
          (document.activeElement.tagName === 'INPUT' ||
            document.activeElement.tagName === 'SELECT')
        ) {
          return;
        }
        uiVisible = !uiVisible;
        gui.domElement.style.display = uiVisible ? '' : 'none';
      }
    });

    // Dynamic window resize handling
    window.addEventListener('resize', () => {
      if (!renderer) return;
      renderer.setPixelRatio(state.dpr);
      renderer.setSize(window.innerWidth, window.innerHeight);
      uniforms.u_resolution.value.set(
        window.innerWidth * state.dpr,
        window.innerHeight * state.dpr
      );
    });

    // ============================================================================
    // 10. INITIALIZE RENDERER & CONTINUOUS ANIMATION LOOP
    // ============================================================================
    createRenderer(state.antialias);

    let lastFrameTime = performance.now();

    function animate(now) {
      requestAnimationFrame(animate);

      const dt = Math.min((now - lastFrameTime) * 0.001, 0.1);
      lastFrameTime = now;

      // Advance continuous shader time scaled by animationSpeed
      uniforms.u_time.value += dt * state.animationSpeed;

      // Smooth damping/lerping for mouse, zoom, pan, and orbit angles
      const lerpFactor = 1.0 - Math.exp(-10.0 * dt);
      currentMouse.lerp(targetMouse, lerpFactor);
      uniforms.u_mouse.value.copy(currentMouse);

      currentZoom = THREE.MathUtils.lerp(currentZoom, targetZoom, lerpFactor);
      uniforms.u_userZoom.value = currentZoom;

      currentOrbitAngle = THREE.MathUtils.lerp(
        currentOrbitAngle,
        targetOrbitAngle,
        lerpFactor
      );
      uniforms.u_userAngle.value = THREE.MathUtils.degToRad(currentOrbitAngle);

      currentCameraTilt = THREE.MathUtils.lerp(
        currentCameraTilt,
        targetCameraTilt,
        lerpFactor
      );
      uniforms.u_userTilt.value = currentCameraTilt;

      currentPan.lerp(targetPan, lerpFactor);
      uniforms.u_userPan.value.copy(currentPan);

      renderer.render(scene, camera);
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
