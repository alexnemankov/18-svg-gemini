<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heart Animation</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: sans-serif;
      background: #000;
      font-size: 67.5%;
      color: deeppink;
      margin: 0;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas {
      z-index: 0;
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      height: 100%;
      width: 100%;
    }
    h1 {
      z-index: 2;
      position: fixed;
      font-size: 2.4rem;
      top: 5%;
      left: 5%;
      line-height: 3.2rem;
      margin: 0;
      pointer-events: none;
    }
    h2 {
      z-index: 2;
      position: fixed;
      bottom: 5%;
      right: 5%;
      text-align: right;
      font-size: 1rem;
      opacity: 0;
      margin: 0;
      pointer-events: none;
    }
    span {
      display: inline-block;
      opacity: 0;
    }
    span.delay:nth-of-type(1) {
      animation: span-animation 1s linear 2.0s 1 normal forwards;
    }
    span.delay:nth-of-type(2) {
      animation: span-animation 1s linear 2.4s 1 normal forwards;
    }
    span.delay:nth-of-type(3) {
      animation: span-animation 1s linear 2.8s 1 normal forwards;
    }
    h2.delay {
      animation: span-animation 1s linear 3.2s 1 normal forwards;
    }
    @keyframes span-animation {
      0% {
        transform: translateY(20px);
        opacity: 0;
      }
      100% {
        transform: translateY(0);
        opacity: 1;
      }
    }
    @media (min-width: 500px) {
      h1 {
        font-size: 4rem;
        line-height: 4.8rem;
      }
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <h1>
    <span>Happy</span><br>
    <span>Valentine's</span><br>
    <span>Day</span>
  </h1>
  <h2>Give me a chocolate :)</h2>

  <script type="module">
    import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

    const CANVAS = document.getElementById('c');
    const C = CANVAS.getContext('2d');
    const spans = document.getElementsByTagName('span');
    const h1 = document.getElementsByTagName('h1')[0];
    const h2 = document.getElementsByTagName('h2')[0];

    for (let i = 0; i < spans.length; i++) {
      spans[i].classList.add('delay');
    }
    h2.classList.add('delay');

    let w = CANVAS.width = window.innerWidth;
    let h = CANVAS.height = window.innerHeight;
    let hw = w / 2;
    let hh = h / 2;

    const SCHEMES = {
      'Original': {
        type: 'original',
        bg: '#000000',
        textColor: '#ff1493',
        gco: 'lighter'
      },
      'Monochromatic': {
        type: 'mono',
        bg: '#050308',
        textColor: '#ff4d94',
        gco: 'lighter'
      },
      'Analogous': {
        type: 'analogous',
        bg: '#080309',
        textColor: '#ff3366',
        gco: 'lighter'
      },
      'Complementary': {
        type: 'complementary',
        bg: '#04070d',
        textColor: '#00e5ff',
        gco: 'lighter'
      },
      'Split-complementary': {
        type: 'split',
        bg: '#06040e',
        textColor: '#ff4081',
        gco: 'lighter'
      },
      'Triadic': {
        type: 'triadic',
        bg: '#09050d',
        textColor: '#ffea00',
        gco: 'lighter'
      },
      'Tetradic': {
        type: 'tetradic',
        bg: '#06060c',
        textColor: '#00e676',
        gco: 'lighter'
      },
      'Double split-complementary': {
        type: 'double_split',
        bg: '#06050e',
        textColor: '#ff007f',
        gco: 'lighter'
      },
      'Achromatic (Black & White)': {
        type: 'achromatic_bw',
        bg: '#000000',
        textColor: '#ffffff',
        colors: ['#ffffff', '#f2f2f2', '#dedede', '#bfbfbf', '#949494', '#666666'],
        gco: 'lighter'
      },
      'Achromatic (White & Black)': {
        type: 'achromatic_wb',
        bg: '#ffffff',
        textColor: '#000000',
        colors: ['#000000', '#1a1a1a', '#333333', '#4d4d4d', '#666666', '#888888'],
        gco: 'source-over'
      },
      'Achromatic + Accent (Black & White + Red)': {
        type: 'achromatic_accent_bw',
        bg: '#000000',
        textColor: '#ff1744',
        accent: '#ff1744',
        colors: ['#ffffff', '#ececec', '#cfcfcf', '#9c9c9c', '#6b6b6b'],
        gco: 'lighter'
      },
      'Achromatic + Accent (White & Black + Red)': {
        type: 'achromatic_accent_wb',
        bg: '#ffffff',
        textColor: '#d50000',
        accent: '#d50000',
        colors: ['#050505', '#1e1e1e', '#383838', '#545454', '#707070'],
        gco: 'source-over'
      },
      'Neutral + Accent': {
        type: 'neutral_accent',
        bg: '#161517',
        textColor: '#ff2a6d',
        accent: '#ff2a6d',
        colors: ['#f4ebe1', '#e8dfd8', '#c2b2a3', '#8d99ae', '#4a4e69', '#2b2d42'],
        gco: 'lighter'
      },
      'Palette 1 (F6AA1C, BC3908, 941B0C, F6AA1C, 220901)': {
        type: 'palette',
        bg: '#220901',
        textColor: '#F6AA1C',
        colors: ['#F6AA1C', '#BC3908', '#941B0C', '#F6AA1C', '#220901'],
        gco: 'lighter'
      },
      'Palette 2 (63D1CF, 5BC0BE, 4BAD9E, 4BAD9E, 0B132B, 000000)': {
        type: 'palette',
        bg: '#000000',
        textColor: '#63D1CF',
        colors: ['#63D1CF', '#5BC0BE', '#4BAD9E', '#4BAD9E', '#0B132B', '#000000'],
        gco: 'lighter'
      },
      'Palette 3 (AA60C8, D69ADE, C9A3C6, CFB5C2, 0D001D, 120A12)': {
        type: 'palette',
        bg: '#120A12',
        textColor: '#D69ADE',
        colors: ['#AA60C8', '#D69ADE', '#C9A3C6', '#CFB5C2', '#0D001D', '#120A12'],
        gco: 'lighter'
      },
      'Palette 4 (FEF1BE, FFBA00, 008189, 00474D, 061210)': {
        type: 'palette',
        bg: '#061210',
        textColor: '#FFBA00',
        colors: ['#FEF1BE', '#FFBA00', '#008189', '#00474D', '#061210'],
        gco: 'lighter'
      },
      'Palette 5 (D4FFB0, 7FFF00, 00B894, 0A3322, 05140A)': {
        type: 'palette',
        bg: '#05140A',
        textColor: '#7FFF00',
        colors: ['#D4FFB0', '#7FFF00', '#00B894', '#0A3322', '#05140A'],
        gco: 'lighter'
      },
      'Palette 6 (FFE8CC, FF8C00, C7501A, 3D1050, 0E0618)': {
        type: 'palette',
        bg: '#0E0618',
        textColor: '#FF8C00',
        colors: ['#FFE8CC', '#FF8C00', '#C7501A', '#3D1050', '#0E0618'],
        gco: 'lighter'
      },
      'Palette 7 (E8E0FF, B38FFF, 6A3DE8, 1A1250, 090612)': {
        type: 'palette',
        bg: '#090612',
        textColor: '#B38FFF',
        colors: ['#E8E0FF', '#B38FFF', '#6A3DE8', '#1A1250', '#090612'],
        gco: 'lighter'
      },
      'Palette 8 (E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)': {
        type: 'palette',
        bg: '#05020F',
        textColor: '#00F0FF',
        colors: ['#E0FBFF', '#00F0FF', '#D40078', '#1E0A3D', '#05020F'],
        gco: 'lighter'
      }
    };

    const SCHEME_KEYS = Object.keys(SCHEMES);

    const params = {
      scheme: 'Original',
      baseHue: 350,
      accentColor: '#ff1744',
      textColor: '#ff1493',
      greenscreen: false,
      backgroundColor: '#000000',
      trails: true,
      trailFade: 0.1,
      version: 'line',
      itr: 720,
      maxR: 15,
      breathing: true,
      baseScale: 10,
      dispersion: 1.0,
      gco: 'lighter',
      pulsate: true,
      pulseAmp: 0.8,
      pulseSpeed: 420,
      tScale: 100,
      colorCycleSpeed: 3000,
      autoRotate: false,
      rotationSpeed: 0.2,
      zoom: 1.0,
      panX: 0,
      panY: 0,
      rotation: 0,
      clickToRandomize: true,
      showText: true
    };

    let s = 500;
    let x = 0;
    let y = 0;
    let r = 5;
    let color = 350;
    let t = Date.now();

    function updateColors() {
      const activeBg = params.greenscreen ? '#00ff00' : params.backgroundColor;
      document.body.style.backgroundColor = activeBg;
      document.body.style.color = params.textColor;
      if (h1) h1.style.color = params.textColor;
      if (h2) h2.style.color = params.textColor;
    }

    function applyScheme(name, syncControls = false) {
      const sc = SCHEMES[name];
      if (!sc) return;
      params.scheme = name;

      if (!params.greenscreen) {
        params.backgroundColor = sc.bg;
      }
      if (sc.textColor) {
        params.textColor = sc.textColor;
      }
      if (sc.accent) {
        params.accentColor = sc.accent;
      }

      if (params.greenscreen || sc.bg === '#ffffff') {
        params.gco = 'source-over';
      } else {
        params.gco = sc.gco || 'lighter';
      }

      updateColors();
      if (syncControls) syncControllers();
    }

    function getColor(i, total, curTime) {
      const sc = SCHEMES[params.scheme] || SCHEMES['Original'];

      switch (sc.type) {
        case 'original': {
          return 'hsl(' + color + ', 80%, 60%)';
        }
        case 'mono': {
          const l = 35 + ((i * 7) % 52);
          const sat = 70 + ((i * 5) % 30);
          return 'hsl(' + params.baseHue + ', ' + sat + '%, ' + l + '%)';
        }
        case 'analogous': {
          const hues = [
            (params.baseHue - 30 + 360) % 360,
            params.baseHue,
            (params.baseHue + 30) % 360
          ];
          return 'hsl(' + hues[i % 3] + ', 85%, 60%)';
        }
        case 'complementary': {
          const hues = [params.baseHue, (params.baseHue + 180) % 360];
          return 'hsl(' + hues[i % 2] + ', 90%, 60%)';
        }
        case 'split': {
          const hues = [
            params.baseHue,
            (params.baseHue + 150) % 360,
            (params.baseHue + 210) % 360
          ];
          return 'hsl(' + hues[i % 3] + ', 85%, 60%)';
        }
        case 'triadic': {
          const hues = [
            params.baseHue,
            (params.baseHue + 120) % 360,
            (params.baseHue + 240) % 360
          ];
          return 'hsl(' + hues[i % 3] + ', 85%, 60%)';
        }
        case 'tetradic': {
          const hues = [
            params.baseHue,
            (params.baseHue + 90) % 360,
            (params.baseHue + 180) % 360,
            (params.baseHue + 270) % 360
          ];
          return 'hsl(' + hues[i % 4] + ', 85%, 60%)';
        }
        case 'double_split': {
          const hues = [
            (params.baseHue - 30 + 360) % 360,
            (params.baseHue + 30) % 360,
            (params.baseHue + 150) % 360,
            (params.baseHue + 210) % 360
          ];
          return 'hsl(' + hues[i % 4] + ', 85%, 60%)';
        }
        case 'achromatic_bw': {
          return sc.colors[i % sc.colors.length];
        }
        case 'achromatic_wb': {
          return sc.colors[i % sc.colors.length];
        }
        case 'achromatic_accent_bw': {
          if (i % 4 === 0) return params.accentColor;
          return sc.colors[i % sc.colors.length];
        }
        case 'achromatic_accent_wb': {
          if (i % 4 === 0) return params.accentColor;
          return sc.colors[i % sc.colors.length];
        }
        case 'neutral_accent': {
          if (i % 4 === 0) return params.accentColor;
          return sc.colors[i % sc.colors.length];
        }
        case 'palette': {
          return sc.colors[i % sc.colors.length];
        }
        default:
          return 'hsl(' + color + ', 80%, 60%)';
      }
    }

    const particle = (px, py, ptColor, ptRadius) => {
      C.fillStyle = ptColor;
      C.beginPath();
      C.arc(px, py, ptRadius, 0, Math.PI * 2, false);
      C.fill();
    };

    const draw = () => {
      C.save();
      C.lineWidth = r;
      C.globalCompositeOperation = params.gco;
      C.translate(hw + params.panX, hh + params.panY);
      C.scale(params.zoom, params.zoom);
      C.rotate((180 + params.rotation) * Math.PI / 180);
      const sc = SCHEMES[params.scheme] || SCHEMES['Original'];
      const isOriginal = sc.type === 'original';

      let prevX = 0;
      let prevY = 0;

      if (params.version === 'line' && isOriginal) {
        C.strokeStyle = 'hsl(' + color + ', 80%, 60%)';
        C.beginPath();
        for (let i = 0; i < params.itr; i++) {
          const rad = i * Math.PI / 180;
          const rand = 1 - (Math.pow(Math.random(), params.dispersion) * Math.pow(Math.random(), params.dispersion));
          const nx = 16 * Math.sin(rad) * Math.sin(rad) * Math.sin(rad);
          const ny = 13 * Math.cos(rad) - 5 * Math.cos(2 * rad) - 2 * Math.cos(3 * rad) - Math.cos(4 * rad);
          const x = nx * rand;
          const y = ny * rand;
          if (i === 0) {
            C.moveTo(x * s, y * s);
          } else {
            C.lineTo(x * s, y * s);
          }
        }
        C.stroke();
      } else {
        for (let i = 0; i < params.itr; i++) {
          const rad = i * Math.PI / 180;
          const rand = 1 - (Math.pow(Math.random(), params.dispersion) * Math.pow(Math.random(), params.dispersion));

          const nx = 16 * Math.sin(rad) * Math.sin(rad) * Math.sin(rad);
          const ny = 13 * Math.cos(rad) - 5 * Math.cos(2 * rad) - 2 * Math.cos(3 * rad) - Math.cos(4 * rad);

          x = nx * rand;
          y = ny * rand;

          const ptColor = getColor(i, params.itr, t);

          if (params.version === 'particle' || params.version === 'both') {
            particle(x * s, y * s, ptColor, r);
          }

          if (params.version === 'line' || params.version === 'both') {
            if (i > 0) {
              C.strokeStyle = ptColor;
              C.beginPath();
              C.moveTo(prevX * s, prevY * s);
              C.lineTo(x * s, y * s);
              C.stroke();
            }
          }

          prevX = x;
          prevY = y;
        }
      }
      C.restore();
    };

    const update = () => {
      color = Math.sin(t / params.colorCycleSpeed) * 360;
      if (params.breathing) {
        r = Math.sin(t / params.tScale) * params.maxR + 1;
        if (r < 0) r *= -1;
      } else {
        r = params.maxR;
      }

      t = Date.now();

      if (s > params.baseScale) {
        s -= 5;
        if (s < params.baseScale) s = params.baseScale;
      } else if (s < params.baseScale) {
        s = params.baseScale;
      }

      if (params.pulsate && s <= params.baseScale) {
        const pulse = Math.sin(t / params.pulseSpeed) * params.pulseAmp;
        s = Math.max(2, params.baseScale + pulse);
      }

      if (params.autoRotate) {
        params.rotation = (params.rotation + params.rotationSpeed) % 360;
      }

      if (color < 0) color *= -1;
    };

    const render = () => {
      const activeBg = params.greenscreen ? '#00ff00' : params.backgroundColor;

      if (params.trails) {
        C.save();
        C.globalCompositeOperation = 'source-over';
        C.globalAlpha = params.trailFade;
        C.fillStyle = activeBg;
        C.fillRect(0, 0, w, h);
        C.restore();
      } else {
        C.save();
        C.globalCompositeOperation = 'source-over';
        C.fillStyle = activeBg;
        C.fillRect(0, 0, w, h);
        C.restore();
      }

      draw();
      update();
      window.requestAnimationFrame(render);
    };

    updateColors();
    render();

    window.addEventListener('resize', () => {
      w = CANVAS.width = window.innerWidth;
      h = CANVAS.height = window.innerHeight;
      hw = w / 2;
      hh = h / 2;
    }, false);

    // Zoom with wheel centered on cursor
    window.addEventListener('wheel', (e) => {
      if (e.target && e.target.closest && e.target.closest('.lil-gui')) return;
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.09 : 0.91;
      const newZoom = Math.min(Math.max(params.zoom * zoomFactor, 0.05), 30);

      const mouseX = e.clientX - hw;
      const mouseY = e.clientY - hh;

      params.panX = mouseX - (mouseX - params.panX) * (newZoom / params.zoom);
      params.panY = mouseY - (mouseY - params.panY) * (newZoom / params.zoom);
      params.zoom = newZoom;

      syncControllers();
    }, { passive: false });

    // Dragging and Scene Click
    let isPointerDown = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let initialPanX = 0;
    let initialPanY = 0;
    let movedDistance = 0;

    window.addEventListener('pointerdown', (e) => {
      if (e.target && e.target.closest && e.target.closest('.lil-gui')) return;
      isPointerDown = true;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      initialPanX = params.panX;
      initialPanY = params.panY;
      movedDistance = 0;
    });

    window.addEventListener('pointermove', (e) => {
      if (!isPointerDown) return;
      const dx = e.clientX - dragStartX;
      const dy = e.clientY - dragStartY;
      movedDistance = Math.hypot(dx, dy);
      params.panX = initialPanX + dx;
      params.panY = initialPanY + dy;
      syncControllers();
    });

    window.addEventListener('pointerup', (e) => {
      if (!isPointerDown) return;
      isPointerDown = false;
      if (movedDistance < 6) {
        if (params.clickToRandomize) {
          randomizeScene();
        }
      }
    });

    function resetTransform() {
      params.zoom = 1.0;
      params.panX = 0;
      params.panY = 0;
      params.rotation = 0;
      syncControllers();
    }

    function randomizeScene() {
      const randomScheme = SCHEME_KEYS[Math.floor(Math.random() * SCHEME_KEYS.length)];
      params.scheme = randomScheme;
      params.baseHue = Math.floor(Math.random() * 360);

      const randH = Math.floor(Math.random() * 360);
      params.accentColor = `hsl(${randH}, 95%, 55%)`;

      const styles = ['line', 'particle', 'both'];
      params.version = styles[Math.floor(Math.random() * styles.length)];
      params.itr = Math.floor(Math.random() * 72) * 10 + 360; // 360 to 1080
      params.maxR = +(Math.random() * 16 + 5).toFixed(1);
      params.dispersion = +(Math.random() * 1.0 + 0.6).toFixed(2);
      params.tScale = Math.floor(Math.random() * 150 + 60);
      params.pulseSpeed = Math.floor(Math.random() * 550 + 250);
      params.pulseAmp = +(Math.random() * 1.6 + 0.4).toFixed(1);
      params.trailFade = +(Math.random() * 0.14 + 0.05).toFixed(2);
      params.colorCycleSpeed = Math.floor(Math.random() * 5000 + 1500);

      applyScheme(randomScheme, false);
      syncControllers();
    }

    // lil-gui setup
    const gui = new GUI({ title: 'Scene Controls' });

    const fTheme = gui.addFolder('Color Schemes');
    fTheme.add(params, 'scheme', SCHEME_KEYS).name('Scheme').onChange((v) => applyScheme(v, true));
    fTheme.add(params, 'baseHue', 0, 360, 1).name('Base Hue').onChange(updateColors);
    fTheme.addColor(params, 'accentColor').name('Accent Color').onChange(updateColors);
    fTheme.addColor(params, 'textColor').name('Typography Color').onChange(updateColors);

    const fBg = gui.addFolder('Background & Greenscreen');
    fBg.add(params, 'greenscreen').name('Greenscreen (#00ff00)').onChange(() => {
      if (params.greenscreen) {
        params.gco = 'source-over';
      }
      updateColors();
      syncControllers();
    });
    fBg.addColor(params, 'backgroundColor').name('Background Color').onChange(updateColors);
    fBg.add(params, 'trails').name('Trails Enabled');
    fBg.add(params, 'trailFade', 0.01, 0.5, 0.01).name('Trail Fade Rate');

    const fGeom = gui.addFolder('Geometry & Style');
    fGeom.add(params, 'version', ['line', 'particle', 'both']).name('Render Style');
    fGeom.add(params, 'itr', 180, 1440, 10).name('Iterations');
    fGeom.add(params, 'maxR', 1, 35, 0.5).name('Radius / Width');
    fGeom.add(params, 'breathing').name('Breathing Radius');
    fGeom.add(params, 'baseScale', 4, 30, 0.5).name('Base Scale');
    fGeom.add(params, 'dispersion', 0.4, 2.5, 0.05).name('Dispersion');
    fGeom.add(params, 'gco', ['lighter', 'source-over', 'screen', 'xor', 'multiply']).name('Composite Mode');

    const fMotion = gui.addFolder('Motion');
    fMotion.add(params, 'pulsate').name('Pulsate (Heartbeat)');
    fMotion.add(params, 'pulseAmp', 0, 4, 0.1).name('Pulse Amp');
    fMotion.add(params, 'pulseSpeed', 100, 1200, 10).name('Pulse Speed');
    fMotion.add(params, 'tScale', 20, 300, 1).name('Oscillation (tScale)');
    fMotion.add(params, 'colorCycleSpeed', 500, 10000, 100).name('Hue Speed');
    fMotion.add(params, 'autoRotate').name('Auto Rotate');
    fMotion.add(params, 'rotationSpeed', -3, 3, 0.1).name('Rotation Speed');

    const fTransform = gui.addFolder('Transform (Zoom & Drag)');
    fTransform.add(params, 'zoom', 0.05, 10, 0.01).name('Zoom (Wheel)').listen();
    fTransform.add(params, 'panX', -1500, 1500, 1).name('Pan X (Drag)').listen();
    fTransform.add(params, 'panY', -1500, 1500, 1).name('Pan Y (Drag)').listen();
    fTransform.add(params, 'rotation', 0, 360, 1).name('Rotation Angle').listen();
    fTransform.add({ reset: resetTransform }, 'reset').name('Reset View / Drag');

    const fProcedural = gui.addFolder('Procedural & Click');
    fProcedural.add(params, 'clickToRandomize').name('Click Scene Random');
    fProcedural.add({ randomize: randomizeScene }, 'randomize').name('Randomize Now');

    const fDisplay = gui.addFolder('Display');
    fDisplay.add(params, 'showText').name('Show Text').onChange((v) => {
      if (h1) h1.style.display = v ? '' : 'none';
      if (h2) h2.style.display = v ? '' : 'none';
    });

    function syncControllers() {
      if (gui && typeof gui.controllersRecursive === 'function') {
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      }
    }

    // Toggle UI with "H" key
    let guiVisible = true;
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
        guiVisible = !guiVisible;
        if (guiVisible) {
          gui.show();
        } else {
          gui.hide();
        }
      }
    });
  </script>
</body>
</html>
