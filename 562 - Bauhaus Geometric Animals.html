<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bauhaus Geometric Animals</title>
    <style>
        html {
            box-sizing: border-box;
            --cream: #f2eee3;
            --black: #1b1b1b;
            --red: #d91729;
            --bg-color: var(--cream);
            --anim-speed: 1;
            --anim-amp: 1;
            --geo-scale: 1;
            --geo-round: 1;
            --geo-angle: 0deg;
            --pattern-scale: 1;
        }

        html *,
        html *::before,
        html *::after {
            box-sizing: inherit;
        }

        .animal *::before,
        .animal *::after {
            content: "";
            position: absolute;
        }

        body {
            margin: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            overflow: hidden;
            position: relative;
            align-items: center;
            justify-content: center;
            background-color: var(--bg-color);
            --beak-t: 115% 37%;
            --beak-b: 115% 41.5%;
            user-select: none;
            -webkit-user-select: none;
            cursor: grab;
            transition: background-color 0.25s ease;
        }

        body.dragging {
            cursor: grabbing;
        }

        /* Viewport & Transform Layer */
        #scene-viewport {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        #transform-layer {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-origin: center center;
            will-change: transform;
        }

        .animal {
            width: 36em;
            height: 36em;
            position: relative;
            display: none;
            transform: scale(var(--geo-scale)) rotate(var(--geo-angle));
            transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .animal.active {
            display: block;
        }

        .animal * {
            position: absolute;
        }

        .bird .head {
            left: 20.1em;
            top: 7.2em;
            height: 7em;
            width: 7.7em;
            border-radius: calc(86.2% * var(--geo-round)) 0 0 0;
            border-top: .15em solid var(--black);
            border-left: .15em solid var(--black);
            transform-origin: bottom left;
            animation: birdHeadBob calc(2.4s / var(--anim-speed)) ease-in-out infinite;
        }

        .bird .head::before {
            top: -62%;
            left: 36.6%;
            width: 9.5em;
            height: 9.9em;
            background-image:
                /* eye */
                radial-gradient(circle at 51% 52%, var(--black) 29%, var(--cream) 33%, var(--cream) 41%, var(--red) 44%, var(--red) 53%, transparent 56%),
                /* beak-b */
                linear-gradient(35deg, var(--red) 30%, transparent 31%),
                /* beak-t */
                linear-gradient(-35deg, transparent 70%, var(--red) 71%),
                /* face */
                linear-gradient(var(--red) 100%, transparent 0),
                /* wattle */
                radial-gradient(circle at 0% 50%, var(--red) 38%, transparent 40%),
                /* comb */
                radial-gradient(4.6em 4em at -9% 98%, var(--red) 70%, transparent 72%),
                /* comb */
                radial-gradient(4.6em 4em at -9% 98%, var(--red) 70%, transparent 72%);
            background-size:
                3em 3em,
                3em 2em,
                3em 2em,
                1.7em 2.4em,
                5em 6em,
                5em 5em,
                5em 5em;
            background-position:
                68% 37%,
                var(--beak-b),
                var(--beak-t),
                74% 39%,
                131% 117%,
                67% -42%,
                5% -42%;
            background-repeat: no-repeat;
            animation: birdBeakChatter calc(1.2s / var(--anim-speed)) ease-in-out infinite;
        }

        .bird .head::after {
            top: 184%;
            left: -158%;
            width: 15em;
            height: 16em;
            background-image:
                /* leg-c */
                radial-gradient(circle at 49% 52%, var(--black) 61%, transparent 64%),
                /* leg-t */
                linear-gradient(var(--black) 100%, transparent 0),
                /* leg-b */
                linear-gradient(var(--black) 100%, transparent 0),
                /* wing-c */
                radial-gradient(circle at 50% 50%, var(--black) 48%, transparent 54%),
                /* wing-c */
                radial-gradient(circle at 50% 50%, var(--black) 48%, transparent 54%),
                /* wing-c */
                radial-gradient(circle at 50% 50%, var(--black) 48%, transparent 54%),
                /* wing-r */
                radial-gradient(5.8em 5em at -4% 4%, transparent 46%, var(--black) 47%, var(--black) 48.5%, transparent 49.2%),
                /* wing-r */
                radial-gradient(10.7em 8em at -3% -29%, transparent 47%, var(--black) 48%, var(--black) 48.5%, transparent 49.2%),
                /* wing-r */
                radial-gradient(21.5em 15em at -6% -40%, transparent 47%, var(--black) 47.2%, var(--black) 47.6%, transparent 48%);
            background-size:
                2.5em 2.5em,
                .1em 7.8em,
                3.5em .1em,
                1em 1em,
                1em 1em,
                1em 1em,
                5em 3em,
                5em 3em,
                13em 7em;
            background-position:
                84% 64%,
                79.1% 94%,
                92.1% 97%,
                2% 21%,
                2% 48%,
                2% 78%,
                9% 9%,
                11% 36%,
                38% 89%;
            background-repeat: no-repeat;
            animation: birdWingPulse calc(2.4s / var(--anim-speed)) ease-in-out infinite;
        }

        .bird .body {
            top: 13.7em;
            left: 20.1em;
            width: 7.5em;
            height: 15em;
            border-radius: 0 calc(100% * var(--geo-round)) calc(100% * var(--geo-round)) 0 / 0 calc(50% * var(--geo-round)) calc(50% * var(--geo-round)) 0;
            background-image:
                linear-gradient(45deg, var(--black) 25%, transparent 0%),
                linear-gradient(45deg, transparent 75%, var(--black) 0%),
                linear-gradient(45deg, var(--black) 25%, transparent 0%),
                linear-gradient(45deg, transparent 75%, var(--black) 0%),
                linear-gradient(45deg, var(--black) 25%, transparent 0%),
                linear-gradient(-45deg, transparent 75%, var(--black) 0%),
                linear-gradient(-45deg, var(--black) 25%, transparent 0%),
                linear-gradient(45deg, transparent 75%, var(--black) 0%);
            background-size:
                4.2em 4em,
                4.2em 4em,
                4.2em 4em,
                4.2em 4em,
                2em 2em,
                2em 2em,
                2em 2em,
                2em 2em;
            background-position:
                0.8em -0.1em,
                2.8em 1.9em,
                -1.3em 1.9em,
                0.7em 3.9em,
                -4% 7%,
                -4% 6.7%,
                -3.4% 7.2%,
                -3% 7%;
            transform-origin: top left;
            animation: birdBodyBreathe calc(2.4s / var(--anim-speed)) ease-in-out infinite;
        }

        .bird .body::before {
            width: 13.7em;
            height: 7em;
            top: 49%;
            left: -112%;
            border-radius: 0 0 calc(50% * var(--geo-round)) calc(50% * var(--geo-round)) / 0 0 calc(100% * var(--geo-round)) calc(100% * var(--geo-round));
            background-image:
                repeating-radial-gradient(calc(9.3em * var(--pattern-scale)) calc(9.3em * var(--pattern-scale)) at center 1%, var(--cream), var(--cream) 8%, var(--black) 9%, var(--black) 18%, var(--cream) 19%);
        }

        .bird .body::after {
            z-index: 2;
            top: 49.3%;
            left: -223%;
            height: 7em;
            width: 4.4em;
            background-repeat: no-repeat;
            background-position: 0 0%, 75% 0;
            border-radius: 0 0 calc(100% * var(--geo-round)) 0 / 0 0 calc(75% * var(--geo-round)) 0;
            background-size: 43% 100%, 84% 105%;
            background-image:
                repeating-linear-gradient(to top, var(--black) 0, var(--black) 6%, var(--cream) 7%, var(--cream) 13.7%),
                repeating-linear-gradient(to top, var(--black) 0, var(--black) 5.5%, var(--cream) 6%, var(--cream) 12.7%);
            transform-origin: top right;
            animation: birdTailFlutter calc(1.8s / var(--anim-speed)) ease-in-out infinite alternate;
        }

        .bird .dams {
            top: 5.8em;
            left: 11.8em;
            width: 7.7em;
            height: 15.4em;
            border-radius: 0 calc(100% * var(--geo-round)) calc(100% * var(--geo-round)) 0 / 0 calc(50% * var(--geo-round)) calc(50% * var(--geo-round)) 0;
            background-image:
                repeating-linear-gradient(33deg, var(--cream) 0, var(--cream) 1%, transparent 1.2%, transparent 3%, var(--cream) 3.2%),
                repeating-linear-gradient(33deg, var(--cream) 0, var(--cream) 1%, transparent 1.2%, transparent 3%, var(--cream) 3.2%),
                repeating-linear-gradient(-32deg, var(--cream) 0, var(--cream) 1%, transparent 1.2%, transparent 3%, var(--cream) 3.2%),
                repeating-linear-gradient(-32deg, var(--cream) 0, var(--cream) 1%, transparent 1.2%, transparent 3%, var(--cream) 3.2%),
                repeating-linear-gradient(33deg, var(--cream) 0, var(--cream) 1%, transparent 1.2%, transparent 3%, var(--cream) 3.2%);
            background-size:
                2.1em 166%,
                2.1em 166%,
                2.2em 165%,
                2.2em 165%,
                2.1em 166%;
            background-position:
                49% 53.7%,
                -27% 53.7%,
                10.7% 45%,
                88.7% 45%,
                126.7% 45%;
            background-repeat: no-repeat;
            background-color: var(--black);
            transform-origin: bottom right;
            animation: birdFanSway calc(3s / var(--anim-speed)) ease-in-out infinite;
        }

        .bird .dams::before {
            width: 7.7em;
            height: 15.4em;
            border-radius: 0 calc(100% * var(--geo-round)) calc(100% * var(--geo-round)) 0 / 0 calc(50% * var(--geo-round)) calc(50% * var(--geo-round)) 0;
            top: -3%;
            left: -84%;
            transform: rotate(-45deg);
            transform-origin: bottom right;
            background-image: repeating-radial-gradient(calc(13em * var(--pattern-scale)) calc(13em * var(--pattern-scale)) at 0% 50%, var(--black), var(--black) 5%, var(--cream) 6%, var(--cream) 6.5%, var(--black) 7%, var(--black) 7%);
            animation: birdSubFan calc(3s / var(--anim-speed)) ease-in-out infinite;
        }

        .bird .dams::after {
            width: 8.3em;
            height: 4.3em;
            border-radius: calc(50% * var(--geo-round)) calc(50% * var(--geo-round)) 0 0 / calc(100% * var(--geo-round)) calc(100% * var(--geo-round)) 0 0;
            top: 72%;
            left: -109%;
            z-index: 1;
            background-image: repeating-radial-gradient(calc(6em * var(--pattern-scale)) calc(6em * var(--pattern-scale)) at 51% 100%, var(--black), var(--black) 7%, var(--cream) 8%, var(--cream) 12%, var(--black) 12.8%);
        }

        .fox .head {
            top: 8.5em;
            left: 19.5em;
            width: 9.5em;
            height: 8.5em;
            border-radius: 0 0 calc(90% * var(--geo-round)) 0;
            background-color: var(--red);
            background-image:
                /* Eye */
                radial-gradient(circle at 50% 50%, var(--black) 26%, var(--cream) 29%, var(--cream) 48%, var(--black) 50%, transparent 54%),
                /* Nose tip */
                radial-gradient(circle at 100% 0%, var(--black) 65%, transparent 68%),
                /* Cheek white diagonal */
                linear-gradient(-35deg, var(--cream) 42%, transparent 43%),
                /* Geometric face stripes */
                repeating-linear-gradient(90deg, var(--black) 0, var(--black) 8%, transparent 8%, transparent 18%);
            background-size:
                2.8em 2.8em,
                2.2em 2.2em,
                100% 100%,
                2.5em 3.5em;
            background-position:
                55% 32%,
                100% 0%,
                0 0,
                12% 0%;
            background-repeat: no-repeat;
            transform-origin: bottom left;
            animation: foxHeadTilt calc(2.6s / var(--anim-speed)) ease-in-out infinite;
        }

        /* Fox Ears */
        .fox .head::before {
            top: -52%;
            left: 0%;
            width: 6.5em;
            height: 4.5em;
            background-image:
                /* Left ear */
                linear-gradient(135deg, transparent 50%, var(--black) 51%),
                /* Right ear */
                linear-gradient(135deg, transparent 40%, var(--red) 41%, var(--red) 72%, var(--black) 73%);
            background-size:
                3.2em 4.5em,
                3.2em 4.5em;
            background-position:
                0% 100%,
                100% 100%;
            background-repeat: no-repeat;
            transform-origin: bottom center;
            animation: foxEarTwitch calc(1.8s / var(--anim-speed)) ease-in-out infinite;
        }

        /* Fox Legs */
        .fox .head::after {
            top: 100%;
            left: -58%;
            width: 15em;
            height: 11.5em;
            background-image:
                /* Front leg */
                linear-gradient(90deg, var(--black) 100%, transparent 0),
                /* Back leg */
                linear-gradient(90deg, var(--black) 100%, transparent 0),
                /* Front paw */
                radial-gradient(circle at 50% 100%, var(--red) 68%, transparent 70%),
                /* Back paw */
                radial-gradient(circle at 50% 100%, var(--red) 68%, transparent 70%),
                /* Joint circle */
                radial-gradient(circle at 50% 50%, var(--cream) 40%, var(--black) 43%, var(--black) 65%, transparent 68%);
            background-size:
                0.25em 10em,
                0.25em 10em,
                2.2em 1.2em,
                2.2em 1.2em,
                2.8em 2.8em;
            background-position:
                82% 0%,
                18% 0%,
                87% 100%,
                21% 100%,
                82% 35%;
            background-repeat: no-repeat;
        }

        .fox .body {
            top: 13.5em;
            left: 11.5em;
            width: 12em;
            height: 9.5em;
            border-radius: calc(80% * var(--geo-round)) 0 calc(70% * var(--geo-round)) 0;
            background-color: var(--black);
            background-image:
                /* Bauhaus chest checkerboard */
                linear-gradient(45deg, var(--red) 25%, transparent 25%),
                linear-gradient(-45deg, var(--red) 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, var(--red) 75%),
                linear-gradient(-45deg, transparent 75%, var(--red) 75%),
                /* Ribbed back pattern */
                repeating-linear-gradient(-45deg, var(--cream) 0, var(--cream) 4%, var(--black) 4.5%, var(--black) 11%);
            background-size:
                3.6em 3.6em,
                3.6em 3.6em,
                3.6em 3.6em,
                3.6em 3.6em,
                6.5em 100%;
            background-position:
                0 0,
                0 1.8em,
                1.8em -1.8em,
                -1.8em 0,
                100% 0;
            background-repeat: repeat, repeat, repeat, repeat, no-repeat;
            animation: birdBodyBreathe calc(2.6s / var(--anim-speed)) ease-in-out infinite;
        }

        /* Fox Underbelly Arc */
        .fox .body::before {
            top: 62%;
            left: 10%;
            width: 9.5em;
            height: 4.8em;
            border-radius: 0 0 calc(100% * var(--geo-round)) calc(100% * var(--geo-round));
            background-image:
                repeating-radial-gradient(calc(6em * var(--pattern-scale)) calc(6em * var(--pattern-scale)) at 50% 0%, var(--cream) 0%, var(--cream) 11%, var(--black) 12%, var(--black) 23%);
        }

        /* Fox Collar / Shoulder Accent */
        .fox .body::after {
            top: -12%;
            left: 68%;
            width: 5em;
            height: 7em;
            border-radius: 0 0 0 calc(100% * var(--geo-round));
            background-image:
                repeating-linear-gradient(25deg, var(--cream) 0, var(--cream) 8%, var(--red) 9%, var(--red) 18%);
        }

        .fox .dams {

                radial-gradient(circle at 0% 0%, var(--cream) 42%, var(--black) 43%, var(--black) 46%, transparent 47%),
                /* Tail diagonal lines */

            transform-origin: bottom right;
            animation: foxTailSwish calc(2.2s / var(--anim-speed)) ease-in-out infinite;
        }

        .fox .dams::before {
            top: 25%;
            left: -32%;
            width: 6.5em;
            height: 10.5em;
            border-radius: calc(100% * var(--geo-round)) 0 0 calc(100% * var(--geo-round));

            z-index: -1;

        .fox .dams::after {

        .owl .head {

        .owl .dams::after {

            resetView: () => {
                state.zoom = 1.0;
                state.panX = 0;
                state.panY = 0;
                state.geoScale = 1.0;
                state.geoRoundness = 1.0;
                state.geoAngle = 0;
                state.patternScale = 1.0;
                applyAllStyles();
                updateGUIControllers();
            }
        };

        const root = document.documentElement;
        const transformLayer = document.getElementById('transform-layer');
        const animalElements = document.querySelectorAll('.animal');

        function applyScheme(schemeName) {
            const palette = COLOR_SCHEMES[schemeName];
            if (!palette) return;
            state.creamColor = palette.cream;
            state.blackColor = palette.black;
            state.redColor = palette.red;
            if (!state.greenScreen) {
                state.backgroundColor = palette.bg;
            }
            applyAllStyles();
            updateGUIControllers();
        }

        function applyAllStyles() {
            root.style.setProperty('--cream', state.creamColor);
            root.style.setProperty('--black', state.blackColor);
            root.style.setProperty('--red', state.redColor);
            root.style.setProperty('--bg-color', state.greenScreen ? '#00ff00' : state.backgroundColor);

            const effectiveAmp = state.pauseAnimation ? 0 : state.animAmp;
            root.style.setProperty('--anim-speed', Math.max(0.1, state.animSpeed));
            root.style.setProperty('--anim-amp', effectiveAmp);

            root.style.setProperty('--geo-scale', state.geoScale);
            root.style.setProperty('--geo-round', state.geoRoundness);
            root.style.setProperty('--geo-angle', `${state.geoAngle}deg`);
            root.style.setProperty('--pattern-scale', state.patternScale);

            transformLayer.style.transform = `translate(${state.panX}px, ${state.panY}px) scale(${state.zoom})`;

            animalElements.forEach(el => {
                if (el.dataset.animal === state.animal) {
                    el.classList.add('active');
                } else {
                    el.classList.remove('active');
                }
            });
        }

        const gui = new GUI({ title: 'Bauhaus Studio Controls' });
        const controllers = [];

        const folderScene = gui.addFolder('Animal & Interaction');
        controllers.push(
            folderScene.add(state, 'animal', ANIMALS).name('Animal Style').onChange(applyAllStyles),
            folderScene.add(state, 'clickToRandomize').name('Click Scene Randomize'),
            folderScene.add(state, 'randomizeScene').name('Re-Roll Variation')
        );

        const folderColors = gui.addFolder('Color Schemes (19+)');
        controllers.push(
            folderColors.add(state, 'colorScheme', SCHEME_KEYS).name('Preset Scheme').onChange(applyScheme),
            folderColors.addColor(state, 'creamColor').name('Primary / Cream').onChange(applyAllStyles),
            folderColors.addColor(state, 'blackColor').name('Structure / Black').onChange(applyAllStyles),
            folderColors.addColor(state, 'redColor').name('Accent / Red').onChange(applyAllStyles),
            folderColors.addColor(state, 'backgroundColor').name('Background').onChange(() => {
                if (state.greenScreen) state.greenScreen = false;
                applyAllStyles();
                updateGUIControllers();
            }),
            folderColors.add(state, 'greenScreen').name('Greenscreen (#00ff00)').onChange(applyAllStyles)
        );

        const folderMotion = gui.addFolder('Motion & Geometry');
        controllers.push(
            folderMotion.add(state, 'animSpeed', 0.2, 3.0, 0.05).name('Animation Speed').onChange(applyAllStyles),
            folderMotion.add(state, 'animAmp', 0.0, 2.5, 0.05).name('Motion Amplitude').onChange(applyAllStyles),
            folderMotion.add(state, 'pauseAnimation').name('Pause Motion').onChange(applyAllStyles),
            folderMotion.add(state, 'geoScale', 0.5, 1.6, 0.02).name('Geometry Scale').onChange(applyAllStyles),
            folderMotion.add(state, 'geoRoundness', 0.1, 1.5, 0.02).name('Corner Roundness').onChange(applyAllStyles),
            folderMotion.add(state, 'geoAngle', -45, 45, 1).name('Tilt Angle').onChange(applyAllStyles),
            folderMotion.add(state, 'patternScale', 0.5, 2.0, 0.05).name('Pattern Density').onChange(applyAllStyles)
        );

        const folderView = gui.addFolder('Viewport (Zoom & Pan)');
        controllers.push(
            folderView.add(state, 'zoom', 0.25, 4.0, 0.05).name('Zoom').onChange(applyAllStyles),
            folderView.add(state, 'panX', -600, 600, 1).name('Pan X').onChange(applyAllStyles),
            folderView.add(state, 'panY', -600, 600, 1).name('Pan Y').onChange(applyAllStyles),
            folderView.add(state, 'resetView').name('Reset Transform')
        );

        function updateGUIControllers() {
            controllers.forEach(c => c.updateDisplay());
        }

        function triggerProceduralVariation() {
            // Pick random animal
            state.animal = ANIMALS[Math.floor(Math.random() * ANIMALS.length)];

            // Pick random color scheme
            const randomScheme = SCHEME_KEYS[Math.floor(Math.random() * SCHEME_KEYS.length)];
            state.colorScheme = randomScheme;
            const palette = COLOR_SCHEMES[randomScheme];
            state.creamColor = palette.cream;
            state.blackColor = palette.black;
            state.redColor = palette.red;
            if (!state.greenScreen) {
                state.backgroundColor = palette.bg;
            }

            // Re-roll geometric and motion parameters
            state.animSpeed = Number((0.6 + Math.random() * 1.8).toFixed(2));
            state.animAmp = Number((0.6 + Math.random() * 1.4).toFixed(2));
            state.geoScale = Number((0.8 + Math.random() * 0.45).toFixed(2));
            state.geoRoundness = Number((0.45 + Math.random() * 0.95).toFixed(2));
            state.geoAngle = Math.floor((Math.random() - 0.5) * 24);
            state.patternScale = Number((0.65 + Math.random() * 1.1).toFixed(2));

            applyAllStyles();
            updateGUIControllers();
        }

        // Dragging & Click Detection on Scene
        const viewport = document.getElementById('scene-viewport');
        let isDragging = false;
        let pointerDownPos = { x: 0, y: 0 };
        let panStartPos = { x: 0, y: 0 };
        let dragDistance = 0;

        viewport.addEventListener('pointerdown', (e) => {
            if (e.target.closest('.lil-gui')) return;
            isDragging = true;
            dragDistance = 0;
            pointerDownPos = { x: e.clientX, y: e.clientY };
            panStartPos = { x: state.panX, y: state.panY };
            document.body.classList.add('dragging');
        });

        window.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            const dx = e.clientX - pointerDownPos.x;
            const dy = e.clientY - pointerDownPos.y;
            dragDistance = Math.hypot(dx, dy);

            state.panX = Math.round(panStartPos.x + dx);
            state.panY = Math.round(panStartPos.y + dy);
            applyAllStyles();
            updateGUIControllers();
        });

        window.addEventListener('pointerup', (e) => {
            if (!isDragging) return;
            isDragging = false;
            document.body.classList.remove('dragging');

            // If pointer barely moved, treat as scene click
            if (dragDistance < 5 && !e.target.closest('.lil-gui')) {
                if (state.clickToRandomize) {
                    triggerProceduralVariation();
                }
            }
        });

        // Wheel Zoom
        viewport.addEventListener('wheel', (e) => {
            if (e.target.closest('.lil-gui')) return;
            e.preventDefault();
            const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
            const nextZoom = Math.min(4.0, Math.max(0.25, Number((state.zoom * zoomFactor).toFixed(2))));
            state.zoom = nextZoom;
            applyAllStyles();
            updateGUIControllers();
        }, { passive: false });

        // Hide/Show all UI with "H" key
        let uiVisible = true;
        window.addEventListener('keydown', (e) => {
            if (e.key === 'h' || e.key === 'H') {
                if (document.activeElement && ['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
                    return;
                }
                uiVisible = !uiVisible;
                gui.domElement.style.display = uiVisible ? '' : 'none';
            }
        });

        // Initial render
        applyAllStyles();
    </script>
</body>
</html>
