<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procedural Wave Grid</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      overscroll-behavior: none;
      user-select: none;
      -webkit-user-select: none;
    }

    #loading {
      background: black;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      visibility: visible;
      opacity: 1;
      transition: visibility 1.6s, opacity 1.6s;
      pointer-events: auto;
    }

    #loading.loaded {
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }

    #loading .circle {
      width: 50px;
      height: 50px;
      background: white;
      border-radius: 50%;
      opacity: 0;
      transform: scale(0, 0);
      animation: circle-animation 1.6s ease-in-out 0s infinite normal none;
    }

    #container {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 0;
      outline: none;
      display: block;
    }

    /** css animation */
    @keyframes circle-animation {
      0% {
        opacity: 0;
        transform: scale(0, 0);
      }
      50% {
        opacity: 1;
        transform: scale(1, 1);
      }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/stats.js/r17/Stats.min.js"></script>
</head>
<body>
  <div id="loading">
    <div class="circle"></div>
  </div>
  <div id="container"></div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.121.1/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.121.1/examples/jsm/controls/OrbitControls.js';
    import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

    const getRandomNumber = function (min, max) {
      return Math.floor(Math.random() * (max - min + 1) + min);
    };

    const getRandomFloat = function (min, max) {
      return Math.random() * (max - min) + min;
    };

    // 19 preconfigured color schemes
    const COLOR_SCHEMES = [
      'Original',
      'Monochromatic',
      'Analogous',
      'Complementary',
      'Split-complementary',
      'Triadic',
      'Tetradic',
      'Double split-complementary',
      'Achromatic (black and white)',
      'Achromatic + Accent (black/white + red)',
      'Neutral + accent',
      'Palette 1 (F6AA1C, BC3908, 941B0C, F6AA1C, 220901)',
      'Palette 2 (63D1CF, 5BC0BE, 4BAD9E, 4BAD9E, 0B132B, 000000)',
      'Palette 3 (AA60C8, D69ADE, C9A3C6, CFB5C2, 0D001D, 120A12)',
      'Palette 4 (FEF1BE, FFBA00, 008189, 00474D, 061210)',
      'Palette 5 (D4FFB0, 7FFF00, 00B894, 0A3322, 05140A)',
      'Palette 6 (FFE8CC, FF8C00, C7501A, 3D1050, 0E0618)',
      'Palette 7 (E8E0FF, B38FFF, 6A3DE8, 1A1250, 090612)',
      'Palette 8 (E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)'
    ];

    // Pre-configured palette colors (hex lists)
    const PALETTE_DATA = {
      'Palette 1 (F6AA1C, BC3908, 941B0C, F6AA1C, 220901)': ['#F6AA1C', '#BC3908', '#941B0C', '#F6AA1C', '#220901'].map(c => new THREE.Color(c)),
      'Palette 2 (63D1CF, 5BC0BE, 4BAD9E, 4BAD9E, 0B132B, 000000)': ['#63D1CF', '#5BC0BE', '#4BAD9E', '#4BAD9E', '#0B132B', '#000000'].map(c => new THREE.Color(c)),
      'Palette 3 (AA60C8, D69ADE, C9A3C6, CFB5C2, 0D001D, 120A12)': ['#AA60C8', '#D69ADE', '#C9A3C6', '#CFB5C2', '#0D001D', '#120A12'].map(c => new THREE.Color(c)),
      'Palette 4 (FEF1BE, FFBA00, 008189, 00474D, 061210)': ['#FEF1BE', '#FFBA00', '#008189', '#00474D', '#061210'].map(c => new THREE.Color(c)),
      'Palette 5 (D4FFB0, 7FFF00, 00B894, 0A3322, 05140A)': ['#D4FFB0', '#7FFF00', '#00B894', '#0A3322', '#05140A'].map(c => new THREE.Color(c)),
      'Palette 6 (FFE8CC, FF8C00, C7501A, 3D1050, 0E0618)': ['#FFE8CC', '#FF8C00', '#C7501A', '#3D1050', '#0E0618'].map(c => new THREE.Color(c)),
      'Palette 7 (E8E0FF, B38FFF, 6A3DE8, 1A1250, 090612)': ['#E8E0FF', '#B38FFF', '#6A3DE8', '#1A1250', '#090612'].map(c => new THREE.Color(c)),
      'Palette 8 (E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)': ['#E0FBFF', '#00F0FF', '#D40078', '#1E0A3D', '#05020F'].map(c => new THREE.Color(c)),
    };

    const NEUTRAL_COLORS = [
      new THREE.Color(0x181920),
      new THREE.Color(0x3f4453),
      new THREE.Color(0x8891a2),
      new THREE.Color(0xdce0ea)
    ];

    function samplePalette(colors, t, targetColor) {
      const clampedT = Math.max(0, Math.min(1, t));
      const pos = clampedT * (colors.length - 1);
      const idx = Math.floor(pos);
      const frac = pos - idx;
      if (idx >= colors.length - 1) {
        targetColor.copy(colors[colors.length - 1]);
      } else {
        targetColor.copy(colors[idx]).lerp(colors[idx + 1], frac);
      }
      return targetColor;
    }

    const _tempColorA = new THREE.Color();
    const _tempColorB = new THREE.Color();
    const _tempColorC = new THREE.Color();
    const _tempColorD = new THREE.Color();
    const _tempNeutral = new THREE.Color();

    class Sketch {
      constructor() {
        this.params = {
          // Greenscreen & Background
          greenscreen: false,
          backgroundColor: '#000000',

          // Colors
          colorScheme: 'Original',
          baseColor: '#3b82f6',
          accentColor: '#ff1744',
          wireframe: false,

          // Motion parameters
          speed: 1.0,
          waveFrequency: 1.0,
          distortion: 1.0,

          // Geometric parameters
          amplitude: 15.0,
          boxSize: 20.0,
          distScale: 0.0045,

          // Interaction & Procedural variation
          clickRandomize: true,
          dragMode: 'Rotate (Orbit)'
        };

        this.renderer = new THREE.WebGLRenderer({
          antialias: true,
          alpha: true
        });
        document.getElementById('container').appendChild(this.renderer.domElement);

        this.statsInit();
        this.init();
        this.setupGUI();
        this.setupEvents();
      }

      statsInit() {
        if (typeof Stats !== 'undefined') {
          this.stats = new Stats();
          this.stats.showPanel(0);
          const dom = this.stats.dom || this.stats.domElement;
          dom.style.position = 'absolute';
          dom.style.left = '0';
          dom.style.top = '0';
          dom.style.zIndex = '100';
          document.getElementById('container').appendChild(dom);
        }
      }

      init() {
        this.time = new THREE.Clock(true);
        this.mouse = new THREE.Vector2();
        this.width = window.innerWidth;
        this.height = window.innerHeight;

        this.scene = new THREE.Scene();

        this.setupCanvas();
        this.setupCamera();
        this.setupLight();
        this.setupShape();

        this.updateBackground();
        this.render();
      }

      setupCanvas() {
        this.renderer.setSize(this.width, this.height);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        this.renderer.domElement.style.position = 'fixed';
        this.renderer.domElement.style.top = '0';
        this.renderer.domElement.style.left = '0';
        this.renderer.domElement.style.zIndex = '0';
        this.renderer.domElement.style.outline = 'none';
      }

      setupCamera() {
        const fov = 70;
        const fovRadian = (fov / 2) * (Math.PI / 180);
        this.dist = this.height / 2 / Math.tan(fovRadian);

        this.camera = new THREE.PerspectiveCamera(
          fov,
          this.width / this.height,
          1,
          this.dist * 6
        );

        // Angled position for 3D perspective
        this.camera.position.set(0, this.dist * 0.85, this.dist * 0.45);
        this.scene.add(this.camera);

        this.controls = new OrbitControls(this.camera, this.renderer.domElement);
        this.controls.enableDamping = true;
        this.controls.dampingFactor = 0.05;
        this.controls.screenSpacePanning = true;
        this.controls.enableZoom = true;
        this.controls.zoomSpeed = 1.0;
        this.controls.enablePan = true;
        this.controls.panSpeed = 1.0;
        this.controls.enableRotate = true;
        this.controls.rotateSpeed = 1.0;
        this.controls.minDistance = 20;
        this.controls.maxDistance = this.dist * 5;

        this.updateDragMode();
      }

      updateDragMode() {
        if (!this.controls) return;
        if (this.params.dragMode === 'Pan (Drag Screen)') {
          this.controls.mouseButtons.LEFT = THREE.MOUSE.PAN;
          this.controls.mouseButtons.RIGHT = THREE.MOUSE.ROTATE;
        } else {
          this.controls.mouseButtons.LEFT = THREE.MOUSE.ROTATE;
          this.controls.mouseButtons.RIGHT = THREE.MOUSE.PAN;
        }
      }

      setupLight() {
        this.directionalLight = new THREE.DirectionalLight(0xffffff, 0.9);
        this.directionalLight.position.set(250, 450, 250);

        this.pointLight = new THREE.PointLight(0xffffff, 0.8, this.dist * 2.5);
        this.pointLight.position.set(0, this.dist * 0.9, 0);

        this.ambientLight = new THREE.AmbientLight(0xffffff, 0.45);

        this.scene.add(this.directionalLight);
        this.scene.add(this.pointLight);
        this.scene.add(this.ambientLight);
      }

      setupShape() {
        this.shapes = [];
        for (let y = 0; y < 400; y += 20) {
          for (let x = 0; x < 400; x += 20) {
            const s = new Shape(this, x - 190, 0, y - 190);
            this.shapes.push(s);
          }
        }
      }

      updateBackground() {
        const bg = this.params.greenscreen ? '#00ff00' : this.params.backgroundColor;
        this.renderer.setClearColor(bg, 1.0);
        if (this.scene) {
          this.scene.background = new THREE.Color(bg);
        }
        document.body.style.backgroundColor = bg;
      }

      render() {
        if (this.stats) this.stats.begin();

        const time = this.time.getElapsedTime();

        if (this.controls) {
          this.controls.update();
        }

        const len = this.shapes.length;
        for (let i = 0; i < len; i++) {
          this.shapes[i].update(time);
        }

        this.renderer.render(this.scene, this.camera);

        if (this.stats) this.stats.end();
        this.animationId = requestAnimationFrame(this.render.bind(this));
      }

      setupGUI() {
        this.gui = new GUI({ title: 'Scene Controls' });

        // Background folder
        const bgFolder = this.gui.addFolder('Background');
        bgFolder.add(this.params, 'greenscreen').name('Greenscreen (#00ff00)').onChange(() => this.updateBackground());
        bgFolder.addColor(this.params, 'backgroundColor').name('Background Color').onChange(() => this.updateBackground());

        // Color Schemes folder
        const colorFolder = this.gui.addFolder('Colors & Themes');
        colorFolder.add(this.params, 'colorScheme', COLOR_SCHEMES).name('Color Scheme');
        colorFolder.addColor(this.params, 'baseColor').name('Base Color');
        colorFolder.addColor(this.params, 'accentColor').name('Accent Color');
        colorFolder.add(this.params, 'wireframe').name('Wireframe');

        // Geometric parameters folder
        const geoFolder = this.gui.addFolder('Geometry');
        geoFolder.add(this.params, 'amplitude', 1.0, 40.0, 0.5).name('Wave Amplitude');
        geoFolder.add(this.params, 'boxSize', 5.0, 35.0, 0.5).name('Box Size');
        geoFolder.add(this.params, 'distScale', 0.001, 0.015, 0.0005).name('Distance Scale');

        // Motion parameters folder
        const motionFolder = this.gui.addFolder('Motion');
        motionFolder.add(this.params, 'speed', 0.1, 4.0, 0.05).name('Animation Speed');
        motionFolder.add(this.params, 'waveFrequency', 0.2, 3.5, 0.05).name('Frequency');
        motionFolder.add(this.params, 'distortion', 0.0, 3.0, 0.05).name('Wave Distortion');

        // Camera & Interaction folder
        const camFolder = this.gui.addFolder('Camera & Interaction');
        camFolder.add(this.params, 'dragMode', ['Rotate (Orbit)', 'Pan (Drag Screen)']).name('Left Drag Action').onChange(() => this.updateDragMode());
        camFolder.add({ resetCamera: () => this.resetCamera() }, 'resetCamera').name('Reset Camera');

        // Procedural generation folder
        const procFolder = this.gui.addFolder('Procedural Variation');
        procFolder.add(this.params, 'clickRandomize').name('Click Scene Randomize');
        procFolder.add({ randomize: () => this.randomizeScene() }, 'randomize').name('⚡ Generate Variation');
      }

      resetCamera() {
        this.camera.position.set(0, this.dist * 0.85, this.dist * 0.45);
        this.controls.target.set(0, 0, 0);
        this.controls.update();
      }

      randomizeScene() {
        // Random scheme from the 19 schemes
        const schemeIdx = getRandomNumber(0, COLOR_SCHEMES.length - 1);
        this.params.colorScheme = COLOR_SCHEMES[schemeIdx];

        // Random base and accent colors
        const randHue = Math.random();
        this.params.baseColor = '#' + new THREE.Color().setHSL(randHue, getRandomFloat(0.7, 0.95), getRandomFloat(0.5, 0.7)).getHexString();
        const randAccentHue = (randHue + getRandomFloat(0.25, 0.75)) % 1.0;
        this.params.accentColor = '#' + new THREE.Color().setHSL(randAccentHue, getRandomFloat(0.85, 1.0), getRandomFloat(0.5, 0.65)).getHexString();

        // Re-roll geometric parameters
        this.params.amplitude = getRandomFloat(8.0, 32.0);
        this.params.boxSize = getRandomFloat(10.0, 28.0);
        this.params.distScale = Number(getRandomFloat(0.002, 0.008).toFixed(4));

        // Re-roll motion parameters
        this.params.speed = Number(getRandomFloat(0.5, 2.5).toFixed(2));
        this.params.waveFrequency = Number(getRandomFloat(0.5, 2.2).toFixed(2));
        this.params.distortion = Number(getRandomFloat(0.2, 2.0).toFixed(2));

        // Update control panel to reflect new parameters
        this.updateGuiDisplays(this.gui);
      }

      updateGuiDisplays(g) {
        if (!g) return;
        if (g.controllers) {
          g.controllers.forEach(c => c.updateDisplay());
        }
        if (g.folders) {
          g.folders.forEach(f => this.updateGuiDisplays(f));
        }
      }

      setupEvents() {
        window.addEventListener('resize', this.resize.bind(this), false);

        // Hide/show all UI with 'H' key
        this.uiVisible = true;
        window.addEventListener('keydown', (e) => {
          if (e.key === 'h' || e.key === 'H') {
            this.uiVisible = !this.uiVisible;
            if (this.gui) {
              if (typeof this.gui.show === 'function' && typeof this.gui.hide === 'function') {
                if (this.uiVisible) this.gui.show(); else this.gui.hide();
              } else if (this.gui.domElement) {
                this.gui.domElement.style.display = this.uiVisible ? '' : 'none';
              }
            }
            if (this.stats) {
              const sDom = this.stats.dom || this.stats.domElement;
              if (sDom) sDom.style.display = this.uiVisible ? 'block' : 'none';
            }
          }
        });

        // Click scene to randomize (detect distinct click vs orbit/pan drag)
        let pointerDownX = 0;
        let pointerDownY = 0;
        let pointerDownTime = 0;

        this.renderer.domElement.addEventListener('pointerdown', (e) => {
          pointerDownX = e.clientX;
          pointerDownY = e.clientY;
          pointerDownTime = performance.now();
        });

        this.renderer.domElement.addEventListener('pointerup', (e) => {
          const dist = Math.hypot(e.clientX - pointerDownX, e.clientY - pointerDownY);
          const duration = performance.now() - pointerDownTime;
          if (dist < 6 && duration < 400) {
            if (this.params.clickRandomize) {
              this.randomizeScene();
            }
          }
        });
      }

      resize() {
        this.width = window.innerWidth;
        this.height = window.innerHeight;

        this.camera.aspect = this.width / this.height;
        const fovRadian = (this.camera.fov / 2) * (Math.PI / 180);
        this.dist = this.height / 2 / Math.tan(fovRadian);
        this.camera.updateProjectionMatrix();

        this.renderer.setSize(this.width, this.height);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      }
    }

    class Shape {
      constructor(sketch, x, y, z) {
        this.sketch = sketch;
        this.init(x, y, z);
      }

      init(x, y, z) {
        this.position = new THREE.Vector3(x, y, z);
        this.atan = Math.atan2(z, x);
        this.centerDist = Math.sqrt(x * x + z * z);

        this.size = 20;
        this.geometry = new THREE.BoxGeometry(this.size, this.size, this.size);
        this.material = new THREE.MeshLambertMaterial({
          color: new THREE.Color(0xffffff),
          transparent: true,
          opacity: 1.0
        });
        this.mesh = new THREE.Mesh(this.geometry, this.material);
        this.mesh.position.set(this.position.x, this.position.y, this.position.z);
        this.sketch.scene.add(this.mesh);
      }

      update(time) {
        const params = this.sketch.params;
        const dist = this.centerDist * params.distScale;

        // Wave phase and height
        const waveAngle = Math.PI * dist * params.waveFrequency + this.atan * params.distortion - time * params.speed;
        const waveVal = Math.sin(waveAngle);
        const normVal = Math.abs(Math.sin(Math.PI * dist * params.waveFrequency - time * params.speed));
        const t = (waveVal + 1.0) * 0.5;

        // Geometric scale
        const scaleXZ = params.boxSize / 20.0;
        const scaleY = waveVal * params.amplitude;
        this.mesh.scale.set(scaleXZ, scaleY, scaleXZ);

        // Wireframe toggle
        if (this.material.wireframe !== params.wireframe) {
          this.material.wireframe = params.wireframe;
        }

        // Color computation based on the 19 preconfigured color schemes
        this.applyColorScheme(time, dist, normVal, waveVal, t, params);
      }

      applyColorScheme(time, dist, normVal, waveVal, t, params) {
        const baseColorObj = _tempColorA.set(params.baseColor);
        const baseHsl = { h: 0, s: 0, l: 0 };
        baseColorObj.getHSL(baseHsl);

        const accentColorObj = _tempColorB.set(params.accentColor);

        switch (params.colorScheme) {
          case 'Original': {
            const hue = Math.abs(Math.sin(Math.PI * dist * params.waveFrequency - time * params.speed));
            this.material.color.setHSL(hue, 0.8, 0.6);
            this.material.opacity = Math.max(0.15, normVal);
            break;
          }

          case 'Monochromatic': {
            const s = THREE.MathUtils.clamp((baseHsl.s || 0.8) * (0.6 + 0.4 * normVal), 0.2, 1.0);
            const l = THREE.MathUtils.clamp(0.2 + 0.65 * t, 0.15, 0.95);
            this.material.color.setHSL(baseHsl.h, s, l);
            this.material.opacity = Math.max(0.2, normVal);
            break;
          }

          case 'Analogous': {
            const hueOffset = (t - 0.5) * (60 / 360);
            const h = (baseHsl.h + hueOffset + 1.0) % 1.0;
            this.material.color.setHSL(h, baseHsl.s || 0.85, 0.35 + 0.45 * normVal);
            this.material.opacity = Math.max(0.2, normVal);
            break;
          }

          case 'Complementary': {
            const compH = (baseHsl.h + 0.5) % 1.0;
            _tempColorC.setHSL(baseHsl.h, baseHsl.s || 0.85, 0.55);
            _tempColorD.setHSL(compH, baseHsl.s || 0.85, 0.55);
            this.material.color.copy(_tempColorC).lerp(_tempColorD, t);
            this.material.opacity = Math.max(0.2, normVal);
            break;
          }

          case 'Split-complementary': {
            const h1 = baseHsl.h;
            const h2 = (baseHsl.h + 150 / 360) % 1.0;
            const h3 = (baseHsl.h + 210 / 360) % 1.0;
            _tempColorC.setHSL(h1, 0.85, 0.5);
            _tempColorD.setHSL(h2, 0.85, 0.55);
            const c3 = _tempNeutral.setHSL(h3, 0.85, 0.55);
            if (t < 0.5) {
              this.material.color.copy(_tempColorC).lerp(_tempColorD, t * 2);
            } else {
              this.material.color.copy(_tempColorD).lerp(c3, (t - 0.5) * 2);
            }
            this.material.opacity = Math.max(0.2, normVal);
            break;
          }

          case 'Triadic': {
            const h1 = baseHsl.h;
            const h2 = (baseHsl.h + 120 / 360) % 1.0;
            const h3 = (baseHsl.h + 240 / 360) % 1.0;
            _tempColorC.setHSL(h1, 0.85, 0.55);
            _tempColorD.setHSL(h2, 0.85, 0.55);
            const c3 = _tempNeutral.setHSL(h3, 0.85, 0.55);
            if (t < 0.5) {
              this.material.color.copy(_tempColorC).lerp(_tempColorD, t * 2);
            } else {
              this.material.color.copy(_tempColorD).lerp(c3, (t - 0.5) * 2);
            }
            this.material.opacity = Math.max(0.2, normVal);
            break;
          }

          case 'Tetradic': {
            const tetradicColors = [
              _tempColorC.setHSL(baseHsl.h, 0.85, 0.55),
              _tempColorD.setHSL((baseHsl.h + 0.25) % 1.0, 0.85, 0.55),
              _tempNeutral.setHSL((baseHsl.h + 0.50) % 1.0, 0.85, 0.55),
              new THREE.Color().setHSL((baseHsl.h + 0.75) % 1.0, 0.85, 0.55)
            ];
            samplePalette(tetradicColors, t, this.material.color);
            this.material.opacity = Math.max(0.2, normVal);
            break;
          }

          case 'Double split-complementary': {
            const dscColors = [
              _tempColorC.setHSL((baseHsl.h - 25 / 360 + 1.0) % 1.0, 0.85, 0.55),
              _tempColorD.setHSL((baseHsl.h + 25 / 360) % 1.0, 0.85, 0.55),
              _tempNeutral.setHSL((baseHsl.h + 155 / 360) % 1.0, 0.85, 0.55),
              new THREE.Color().setHSL((baseHsl.h + 205 / 360) % 1.0, 0.85, 0.55)
            ];
            samplePalette(dscColors, t, this.material.color);
            this.material.opacity = Math.max(0.2, normVal);
            break;
          }

          case 'Achromatic (black and white)': {
            const lum = 0.05 + 0.9 * t;
            this.material.color.setRGB(lum, lum, lum);
            this.material.opacity = Math.max(0.2, normVal);
            break;
          }

          case 'Achromatic + Accent (black/white + red)': {
            const lum = 0.05 + 0.7 * t;
            _tempColorC.setRGB(lum, lum, lum);
            if (t > 0.65) {
              const accentBlend = (t - 0.65) / 0.35;
              this.material.color.copy(_tempColorC).lerp(accentColorObj, accentBlend);
            } else {
              this.material.color.copy(_tempColorC);
            }
            this.material.opacity = Math.max(0.25, normVal);
            break;
          }

          case 'Neutral + accent': {
            samplePalette(NEUTRAL_COLORS, Math.min(1.0, t * 1.15), _tempNeutral);
            if (t > 0.68) {
              const blend = (t - 0.68) / 0.32;
              this.material.color.copy(_tempNeutral).lerp(accentColorObj, blend);
            } else {
              this.material.color.copy(_tempNeutral);
            }
            this.material.opacity = Math.max(0.25, normVal);
            break;
          }

          default: {
            const palette = PALETTE_DATA[params.colorScheme];
            if (palette) {
              samplePalette(palette, t, this.material.color);
              this.material.opacity = Math.max(0.2, normVal);
            }
            break;
          }
        }
      }
    }

    window.addEventListener('load', () => {
      const loading = document.getElementById('loading');
      if (loading) loading.classList.add('loaded');
      new Sketch();
    });
  </script>
</body>
