<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ionization Track Chamber</title>

    <!-- Import maps polyfill for module resolution -->
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
            }
        }
    </script>

    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #020306;
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
        }

        body.dragging {
            cursor: grabbing;
        }

        body.greenscreen {
            background-color: #00ff00 !important;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <script type="module">
        import * as THREE from 'three';
        import GUI from 'lil-gui';

        // =========================================================================
        // 1. POST-PROCESSING SUITE (PostProcessor.js Pipeline)
        // =========================================================================
        const orthoVertexShader = `
        precision highp float;
        in vec3 position;
        out vec2 vUv;
        void main() {
          vUv = position.xy * 0.5 + 0.5;
          gl_Position = vec4(position, 1.0);
        }
        `;

        const brightFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        uniform float bloomThreshold;
        in vec2 vUv;
        out vec4 fragColor;

        void main() {
          vec4 color = texture(inputTexture, vUv);
          float luminance = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
          float knee = 0.1;
          float soft = luminance - bloomThreshold + knee;
          soft = clamp(soft, 0.0, 2.0 * knee);
          soft = (soft * soft) / (4.0 * knee + 0.00001);
          float contribution = max(soft, luminance - bloomThreshold);
          contribution /= max(luminance, 0.00001);
          fragColor = vec4(color.rgb * contribution, color.a);
        }
        `;

        const blur13ShaderChunk = `
        vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
          vec2 resolution = vec2(textureSize(image, 0));
          vec4 color = vec4(0.0);
          vec2 off1 = vec2(1.411764705882353) * direction;
          vec2 off2 = vec2(3.2941176470588234) * direction;
          vec2 off3 = vec2(5.176470588235294) * direction;
          color += texture(image, uv) * 0.1964825501511404;
          color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
          color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
          color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
          color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
          color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
          color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
          return color;
        }
        `;

        const blurFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        uniform vec2 direction;
        in vec2 vUv;
        out vec4 color;
        ${blur13ShaderChunk}
        void main() {
          color = blur13(inputTexture, vUv, direction);
        }
        `;

        const finalFragmentShader = `
        precision highp float;
        uniform vec2 resolution;
        uniform sampler2D inputTexture;
        uniform sampler2D blur0Texture;
        uniform sampler2D blur1Texture;
        uniform sampler2D blur2Texture;
        uniform sampler2D blur3Texture;
        uniform sampler2D blur4Texture;
        uniform bool bloomEnabled;
        uniform float bloomStrength;
        uniform float vignetteBoost;
        uniform float vignetteReduction;
        uniform float noiseIntensity;
        uniform float time;
        in vec2 vUv;
        out vec4 fragColor;

        float vignette(vec2 uv, float boost, float reduction) {
          vec2 position = vUv - 0.5;
          return boost - length(position) * reduction;
        }

        float hash1(uint n) {
          n = (n << 13U) ^ n;
          n = n * (n * n * 15731U + 789221U) + 1376312589U;
          return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
        }

        float noise(in vec2 uv, in float timeVal) {
          uvec2 p = uvec2(uv);
          return hash1(p.x + 1920U * p.y + (1920U * 1080U) * uint(timeVal));
        }

        void main() {
          vec4 color = texture(inputTexture, vUv);

          if (bloomEnabled && bloomStrength > 0.001) {
            vec4 b0 = texture(blur0Texture, vUv);
            vec4 b1 = texture(blur1Texture, vUv);
            vec4 b2 = texture(blur2Texture, vUv);
            vec4 b3 = texture(blur3Texture, vUv);
            vec4 b4 = texture(blur4Texture, vUv);

            vec4 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
            color += bloomSum * bloomStrength;
          }

          color.rgb *= vignette(vUv, vignetteBoost, vignetteReduction);
          color.rgb += noiseIntensity * noise(gl_FragCoord.xy, time);
          fragColor = vec4(color.rgb, 1.0);
        }
        `;

        const chromaticAberrationShaderChunk = `
        vec2 barrelDistortion(vec2 coord, float amt) {
          vec2 cc = coord - 0.5;
          float dist = dot(cc, cc);
          return coord + cc * dist * amt;
        }
        float sat(float t) { return clamp(t, 0.0, 1.0); }
        float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
        float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
        vec4 spectrum_offset(float t) {
          float lo = step(t, 0.5);
          float hi = 1.0 - lo;
          float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
          vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
          return pow(ret, vec4(1.0 / 2.2));
        }
        const float max_distort = 2.2;
        const int num_iter = 8;
        const float reci_num_iter_f = 1.0 / float(num_iter);
        vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
          vec4 sumcol = vec4(0.0);
          vec4 sumw = vec4(0.0);
          for (int i = 0; i < num_iter; ++i) {
            float t = float(i) * reci_num_iter_f;
            vec4 w = spectrum_offset(t);
            sumw += w;
            sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
          }
          return sumcol / sumw;
        }
        `;

        const colorFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        uniform float chromaticAberrationAmount;
        uniform float minInputLevel;
        uniform float maxInputLevel;
        uniform float gammaLevel;
        uniform float fisheyeStrength;
        uniform float fisheyeRadius;
        uniform float time;
        in vec2 vUv;
        out vec4 fragColor;

        ${chromaticAberrationShaderChunk}

        vec2 applyFisheye(vec2 uv, float strength, float radius) {
          if (abs(strength) < 0.0001) return uv;
          vec2 p = uv - 0.5;
          float d = length(p);
          if (d > radius * 1.5) return uv;
          float r = d / max(radius, 0.001);
          float theta = atan(p.y, p.x);
          float rDist = r + strength * (r * r * r);
          return 0.5 + vec2(cos(theta), sin(theta)) * (rDist * radius);
        }

        vec3 gammaCorrect(vec3 color, vec3 gamma) {
          return pow(max(color, vec3(0.0)), 1.0 / gamma);
        }
        vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
          return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
        }
        vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
          return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
        }
        void main() {
          vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
          fragColor = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
          fragColor.rgb = finalLevels(fragColor.rgb, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
          fragColor.a = 1.0;
        }
        `;

        const copyFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        in vec2 vUv;
        out vec4 fragColor;
        void main() {
          fragColor = texture(inputTexture, vUv);
        }
        `;

        function createFBO(w, h, options = {}) {
          return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
            wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
            wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
            minFilter: options.minFilter || THREE.LinearFilter,
            magFilter: options.magFilter || THREE.LinearFilter,
            format: options.format || THREE.RGBAFormat,
            type: options.type || THREE.HalfFloatType,
            stencilBuffer: options.stencilBuffer || false,
            depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : true,
            samples: options.samples || 0,
          });
        }

        class ShaderPass {
          constructor(shader, options = {}) {
            this.shader = shader;
            this.orthoScene = new THREE.Scene();
            this.fbo = createFBO(1, 1, options);
            this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
            this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
            this.orthoScene.add(this.orthoQuad);
            this.texture = this.fbo.texture;
          }
          render(renderer, toScreen = false) {
            if (!toScreen) {
              renderer.setRenderTarget(this.fbo);
            }
            renderer.render(this.orthoScene, this.orthoCamera);
            if (!toScreen) {
              renderer.setRenderTarget(null);
            }
          }
          setSize(width, height) {
            this.fbo.setSize(Math.max(1, width), Math.max(1, height));
            this.orthoQuad.scale.set(width, height, 1);
          }
        }

        class ShaderPingPongPass {
          constructor(shader, options = {}) {
            this.shader = shader;
            this.orthoScene = new THREE.Scene();
            this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
            this.currentFBO = 0;
            this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
            this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
            this.orthoScene.add(this.orthoQuad);
          }
          render(renderer) {
            renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
            renderer.render(this.orthoScene, this.orthoCamera);
            renderer.setRenderTarget(null);
            this.currentFBO = 1 - this.currentFBO;
          }
          get current() { return this.fbos[this.currentFBO]; }
          get texture() { return this.current.texture; }
          setSize(width, height) {
            const w = Math.max(1, width);
            const h = Math.max(1, height);
            this.orthoQuad.scale.set(w, h, 1);
            this.fbos[0].setSize(w, h);
            this.fbos[1].setSize(w, h);
          }
        }

        class BloomPass {
          constructor(strength = 0.75, radius = 0.55, threshold = 0.2, levels = 5) {
            this.strength = strength;
            this.radius = radius;
            this.threshold = threshold;
            this.enabled = true;
            this.levels = levels;

            this.brightShader = new THREE.RawShaderMaterial({
              uniforms: {
                inputTexture: { value: null },
                bloomThreshold: { value: this.threshold },
              },
              vertexShader: orthoVertexShader,
              fragmentShader: brightFragmentShader,
              glslVersion: THREE.GLSL3,
            });
            this.brightPass = new ShaderPass(this.brightShader, {
              format: THREE.RGBAFormat,
              type: THREE.HalfFloatType,
            });

            this.blurShader = new THREE.RawShaderMaterial({
              uniforms: {
                inputTexture: { value: null },
                direction: { value: new THREE.Vector2(0, 1) },
              },
              vertexShader: orthoVertexShader,
              fragmentShader: blurFragmentShader,
              glslVersion: THREE.GLSL3,
            });

            this.blurPasses = [];
            for (let i = 0; i < this.levels; i++) {
              this.blurPasses.push(new ShaderPingPongPass(this.blurShader, {
                format: THREE.RGBAFormat,
                type: THREE.HalfFloatType,
              }));
            }
          }

          setSize(w, h) {
            let tw = Math.max(1, w);
            let th = Math.max(1, h);
            this.brightPass.setSize(tw, th);
            for (let i = 0; i < this.levels; i++) {
              tw = Math.max(1, Math.round(tw / 2));
              th = Math.max(1, Math.round(th / 2));
              this.blurPasses[i].setSize(tw, th);
            }
          }

          set source(texture) {
            this.brightShader.uniforms.inputTexture.value = texture;
          }

          render(renderer) {
            if (!this.enabled || this.strength <= 0.001) return;

            this.brightShader.uniforms.bloomThreshold.value = this.threshold;
            this.brightPass.render(renderer);

            const baseOffset = Math.max(0.1, this.radius * 2.0);
            const u = this.blurShader.uniforms;

            for (let j = 0; j < this.levels; j++) {
              const blurPass = this.blurPasses[j];
              const stepOffset = baseOffset * (1.0 + j * 0.5);

              u.direction.value.set(stepOffset, 0);
              u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
              blurPass.render(renderer);

              u.direction.value.set(0, stepOffset * 0.5);
              u.inputTexture.value = blurPass.current.texture;
              blurPass.render(renderer);
            }
          }
        }

        class PostProcessor {
          constructor(renderer, params = {}) {
            this.renderer = renderer;

            this.settings = {
              enabled: params.enabled !== undefined ? params.enabled : true,
              bloomEnabled: params.bloomEnabled !== undefined ? params.bloomEnabled : true,
              bloomStrength: params.bloomStrength !== undefined ? params.bloomStrength : 0.75,
              bloomRadius: params.bloomRadius !== undefined ? params.bloomRadius : 0.55,
              bloomThreshold: params.bloomThreshold !== undefined ? params.bloomThreshold : 0.2,

              fisheyeStrength: params.fisheyeStrength !== undefined ? params.fisheyeStrength : 0.0,
              fisheyeRadius: params.fisheyeRadius !== undefined ? params.fisheyeRadius : 1.0,
              chromaticAberration: params.chromaticAberration !== undefined ? params.chromaticAberration : 0.035,
              vignetteBoost: params.vignetteBoost !== undefined ? params.vignetteBoost : 1.0,
              vignetteReduction: params.vignetteReduction !== undefined ? params.vignetteReduction : 0.5,
              noiseIntensity: params.noiseIntensity !== undefined ? params.noiseIntensity : 0.015,

              gamma: params.gamma !== undefined ? params.gamma : 1.0,
              minInputLevel: params.minInputLevel !== undefined ? params.minInputLevel : 0.0,
              maxInputLevel: params.maxInputLevel !== undefined ? params.maxInputLevel : 1.0,
            };

            this.sceneTarget = createFBO(1, 1, { type: THREE.HalfFloatType });

            this.bloomPass = new BloomPass(
              this.settings.bloomStrength,
              this.settings.bloomRadius,
              this.settings.bloomThreshold,
              5
            );

            this.finalShader = new THREE.RawShaderMaterial({
              uniforms: {
                resolution: { value: new THREE.Vector2(1, 1) },
                bloomEnabled: { value: this.settings.bloomEnabled },
                bloomStrength: { value: this.settings.bloomStrength },
                vignetteBoost: { value: this.settings.vignetteBoost },
                vignetteReduction: { value: this.settings.vignetteReduction },
                noiseIntensity: { value: this.settings.noiseIntensity },
                inputTexture: { value: null },
                blur0Texture: { value: null },
                blur1Texture: { value: null },
                blur2Texture: { value: null },
                blur3Texture: { value: null },
                blur4Texture: { value: null },
                time: { value: 0 },
              },
              vertexShader: orthoVertexShader,
              fragmentShader: finalFragmentShader,
              glslVersion: THREE.GLSL3,
            });
            this.finalPass = new ShaderPass(this.finalShader);

            this.rgbShader = new THREE.RawShaderMaterial({
              uniforms: {
                inputTexture: { value: this.finalPass.texture },
                fisheyeStrength: { value: this.settings.fisheyeStrength },
                fisheyeRadius: { value: this.settings.fisheyeRadius },
                chromaticAberrationAmount: { value: this.settings.chromaticAberration },
                minInputLevel: { value: this.settings.minInputLevel },
                maxInputLevel: { value: this.settings.maxInputLevel },
                gammaLevel: { value: this.settings.gamma },
                time: { value: 0 },
              },
              vertexShader: orthoVertexShader,
              fragmentShader: colorFragmentShader,
              glslVersion: THREE.GLSL3,
            });
            this.rgbPass = new ShaderPass(this.rgbShader);

            this.copyPass = new THREE.RawShaderMaterial({
              uniforms: {
                inputTexture: { value: null },
              },
              vertexShader: orthoVertexShader,
              fragmentShader: copyFragmentShader,
              glslVersion: THREE.GLSL3,
            });
            this.copyPass = new ShaderPass(this.copyPass);
          }

          updateSettings() {
            this.bloomPass.enabled = this.settings.bloomEnabled;
            this.bloomPass.strength = this.settings.bloomStrength;
            this.bloomPass.radius = this.settings.bloomRadius;
            this.bloomPass.threshold = this.settings.bloomThreshold;

            this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
            this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
            this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
            this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
            this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;

            this.rgbShader.uniforms.fisheyeStrength.value = this.settings.fisheyeStrength;
            this.rgbShader.uniforms.fisheyeRadius.value = this.settings.fisheyeRadius;
            this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
            this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
            this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
            this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
          }

          setSize(w0, h0, dpr = 1) {
            const w = Math.max(1, Math.floor(w0 * dpr));
            const h = Math.max(1, Math.floor(h0 * dpr));
            this.sceneTarget.setSize(w, h);
            this.finalPass.setSize(w, h);
            this.finalShader.uniforms.resolution.value.set(w, h);
            this.bloomPass.setSize(w, h);
            this.rgbPass.setSize(w, h);
            this.copyPass.setSize(w, h);
          }

          renderScene(scene, camera) {
            if (!this.settings.enabled) {
              this.renderer.render(scene, camera);
              return;
            }
            this.renderer.setRenderTarget(this.sceneTarget);
            this.renderer.render(scene, camera);
            this.renderer.setRenderTarget(null);
            this.render(this.sceneTarget.texture);
          }

          render(sourceTexture) {
            if (!this.settings.enabled) {
              this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
              this.copyPass.render(this.renderer, true);
              return;
            }

            this.updateSettings();

            this.bloomPass.source = sourceTexture;
            this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
            this.bloomPass.render(this.renderer);

            this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
            this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
            this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
            this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
            this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

            const randomTime = Math.random() * 100000;
            this.finalPass.shader.uniforms.time.value = randomTime;
            this.rgbPass.shader.uniforms.time.value = randomTime;

            this.finalPass.render(this.renderer);
            this.rgbPass.render(this.renderer, true);
          }

          attachGUI(gui, title = "Post-Processing Suite") {
            const root = gui.addFolder(title);
            root.add(this.settings, "enabled").name("Enable Suite");

            const bloom = root.addFolder("Bloom");
            bloom.add(this.settings, "bloomEnabled").name("Enable Bloom").onChange(() => this.updateSettings());
            bloom.add(this.settings, "bloomStrength", 0, 3.0, 0.05).name("Strength").onChange(() => this.updateSettings());
            bloom.add(this.settings, "bloomRadius", 0, 2.0, 0.05).name("Radius").onChange(() => this.updateSettings());
            bloom.add(this.settings, "bloomThreshold", 0, 1.0, 0.01).name("Threshold").onChange(() => this.updateSettings());

            const lens = root.addFolder("Lens, Optics & Fisheye");
            lens.add(this.settings, "fisheyeStrength", -1.0, 1.5, 0.01).name("Fisheye Distortion").onChange(() => this.updateSettings());
            lens.add(this.settings, "fisheyeRadius", 0.2, 2.0, 0.05).name("Fisheye Radius").onChange(() => this.updateSettings());
            lens.add(this.settings, "chromaticAberration", 0, 0.2, 0.005).name("Chromatic Aberration").onChange(() => this.updateSettings());
            lens.add(this.settings, "vignetteBoost", 0, 2.0, 0.05).name("Vignette Boost").onChange(() => this.updateSettings());
            lens.add(this.settings, "vignetteReduction", 0, 2.0, 0.05).name("Vignette Falloff").onChange(() => this.updateSettings());
            lens.add(this.settings, "noiseIntensity", 0, 0.1, 0.005).name("Film Grain").onChange(() => this.updateSettings());
            lens.add(this.settings, "gamma", 0.2, 2.0, 0.05).name("Gamma").onChange(() => this.updateSettings());
            lens.add(this.settings, "minInputLevel", 0, 0.5, 0.01).name("Black Level").onChange(() => this.updateSettings());
            lens.add(this.settings, "maxInputLevel", 0.5, 1.0, 0.01).name("White Level").onChange(() => this.updateSettings());

            return root;
          }
        }

        // =========================================================================
        // 2. SET UP THREE.JS ENVIRONMENT
        // =========================================================================
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

        const postProcessor = new PostProcessor(renderer, {
            bloomEnabled: true,
            bloomStrength: 0.75,
            bloomRadius: 0.55,
            bloomThreshold: 0.2,
            chromaticAberration: 0.035,
            vignetteBoost: 1.0,
            vignetteReduction: 0.5,
            noiseIntensity: 0.015
        });

        // =========================================================================
        // 3. COLOR SCHEMES DEFINITION (10 PRECONFIGURED HARMONIES)
        // =========================================================================
        const COLOR_SCHEMES = {
            'Monochromatic': {
                colorA: '#00f0ff',
                colorB: '#0055ff',
                colorC: '#001a4d',
                colorAccent: '#ffffff',
                phaseR: 6.28, phaseG: 6.28, phaseB: 6.28, phaseA: 0.0,
                interfKR: 12.0, interfKG: 13.0, interfKB: 14.0
            },
            'Analogous': {
                colorA: '#00ffc8',
                colorB: '#22e066',
                colorC: '#d4ff00',
                colorAccent: '#00aaff',
                phaseR: 1.2, phaseG: 3.4, phaseB: 5.6, phaseA: 1.5,
                interfKR: 8.5, interfKG: 14.2, interfKB: 19.8
            },
            'Complementary': {
                colorA: '#ff9900',
                colorB: '#0066ff',
                colorC: '#ff3300',
                colorAccent: '#00f0ff',
                phaseR: 0.5, phaseG: 3.6, phaseB: 2.1, phaseA: 2.0,

            },

                phaseR: 0.0, phaseG: 2.09, phaseB: 4.19, phaseA: 1.0,

            },
            'Tetradic': {
                colorA: '#ff007f',
                colorB: '#007fff',
                colorC: '#7fff00',
                colorAccent: '#ff8800',
                phaseR: 0.0, phaseG: 1.57, phaseB: 3.14, phaseA: 4.71,

            },

                colorC: '#ff6f61',
                colorAccent: '#00e5ff',
                phaseR: 5.1, phaseG: 2.4, phaseB: 0.9, phaseA: 1.8,

                colorAccent: '#ffffff',

                interfKR: 0.0, interfKG: 0.0, interfKB: 0.0

            'Achromatic (White & Black)': {

                colorAccent: '#ffffff',
                phaseR: 3.14, phaseG: 3.14, phaseB: 3.14, phaseA: 0.0,

                phaseR: 1.0, phaseG: 1.1, phaseB: 1.2, phaseA: 0.5,
                interfKR: 4.0, interfKG: 4.2, interfKB: 4.5
            }
        };

        // =========================================================================
        // 4. ANIMATION PRESETS (8 DISTINCT MODES)
        // =========================================================================
        const ANIMATION_PRESETS = [
            'Static Chamber (No Camera)',
            'Slow Cloud Chamber Drift',
            'Lorentz Magnetic Precession',
            'Quantum Fluctuation Pulse',
            'Detector Orbit Scan',
            'Ionization Cascade Swirl',
            'Relativistic Beam Wobble',
            'Deep Chamber Float'
        ];

        // =========================================================================
        // 5. STATE & PARAMETERS
        // =========================================================================
        const params = {
            dpr: 0.85,
            zoom: 1.0,
            panX: 0.0,
            panY: 0.0,
            greenScreen: false,
            backgroundColor: '#020306',
            vignette: 1.0,

            animationPreset: 'Slow Cloud Chamber Drift',
            speed: 1.0,
            autoRotate: true,
            autoRotateSpeed: 0.25,

            filamentRadius: 0.038,
            trackLength: 2.85,
            warpFreq: 1.65,
            warpAmp: 0.25,
            spiralAmp: 0.18,
            smoothing: 0.45,
            fadeOuter: 3.6,
            fadeInner: 2.8,

            colorScheme: 'Analogous',
            colorA: COLOR_SCHEMES['Analogous'].colorA,
            colorB: COLOR_SCHEMES['Analogous'].colorB,
            colorC: COLOR_SCHEMES['Analogous'].colorC,
            colorAccent: COLOR_SCHEMES['Analogous'].colorAccent,
            colorPhaseR: COLOR_SCHEMES['Analogous'].phaseR,
            colorPhaseG: COLOR_SCHEMES['Analogous'].phaseG,
            colorPhaseB: COLOR_SCHEMES['Analogous'].phaseB,
            colorPhaseA: COLOR_SCHEMES['Analogous'].phaseA,
            interfKR: COLOR_SCHEMES['Analogous'].interfKR,
            interfKG: COLOR_SCHEMES['Analogous'].interfKG,
            interfKB: COLOR_SCHEMES['Analogous'].interfKB,
            glowIntensity: 1.2,
            exposure: 22.0,

            clickRandomize: true
        };

        const hexToVector3 = (hex) => {
            const color = new THREE.Color(hex);
            return new THREE.Vector3(color.r, color.g, color.b);
        };

        // =========================================================================
        // 6. SHADER DEFINITIONS
        // =========================================================================
        const vertexShader = `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = vec4(position, 1.0);
            }
        `;

        const fragmentShader = `
            uniform float uTime;
            uniform vec2 uResolution;
            uniform mat3 uRotation;
            uniform float uZoom;
            uniform vec2 uPan;
            uniform vec3 uBackgroundColor;
            uniform float uGreenScreen;

            uniform float uFilamentRadius;
            uniform float uTrackLength;
            uniform float uWarpFreq;
            uniform float uWarpAmp;
            uniform float uSpiralAmp;
            uniform float uSmoothing;
            uniform float uFadeOuter;
            uniform float uFadeInner;

            uniform vec3 uColorA;
            uniform vec3 uColorB;
            uniform vec3 uColorC;
            uniform vec3 uColorAccent;
            uniform vec4 uColorPhases;
            uniform vec3 uInterferenceK;
            uniform float uGlowIntensity;
            uniform float uExposure;
            uniform float uVignette;

            varying vec2 vUv;

            float smin(float a, float b, float k) {
                float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
                return mix(b, a, h) - k * h * (1.0 - h);
            }

            vec3 getTrackDir(int i) {
                float phi = float(i) * 2.3999632;
                float y = 1.0 - (float(i) / 13.0) * 2.0;
                float r = sqrt(max(0.0, 1.0 - y * y));
                return vec3(cos(phi) * r, y, sin(phi) * r);
            }

            float getTrackDistance(vec3 p, int i, float time, out float outH) {
                vec3 dir = getTrackDir(i);
                float fi = float(i);
                
                float trackType = mod(fi, 3.0);
                float baseLen = uTrackLength * (0.7 + 0.38 * sin(fi * 1.8 + 0.5));
                
                vec3 pWarp = p;
                pWarp += vec3(
                    sin(p.y * uWarpFreq + time * 0.7 + fi * 0.8) * cos(p.z * (uWarpFreq * 0.8) + time * 0.5),
                    sin(p.z * uWarpFreq + time * 0.6 + fi * 0.5) * cos(p.x * (uWarpFreq * 0.8) + time * 0.7),
                    sin(p.x * uWarpFreq + time * 0.8 + fi * 0.7) * cos(p.y * (uWarpFreq * 0.8) + time * 0.6)
                ) * uWarpAmp;

                vec3 endpoint = dir * baseLen;
                
                vec3 pa = pWarp;
                vec3 ba = endpoint;
                float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
                
                vec3 n1 = normalize(cross(dir, vec3(0.0, 1.0, 0.1)));
                vec3 n2 = cross(dir, n1);
                float spiralCurl = (trackType < 1.5) ? 1.8 : 1.0;
                float spiralPhase = h * (12.0 * spiralCurl) + fi * 1.2 + time * 1.5;
                float spiralRadius = uSpiralAmp * pow(h, 1.1) * (0.8 + 0.4 * sin(fi * 2.5 + time));
                vec3 spiralOffset = (n1 * cos(spiralPhase) + n2 * sin(spiralPhase)) * spiralRadius;

                vec3 corePoint = ba * h + spiralOffset;
                outH = h;
                return length(pWarp - corePoint);
            }

            void evaluateScene(vec3 pos, float time, out float outCoreDist, out float outTrackH, out int outTrackId) {
                float minCore = 1e5;
                float bestH = 0.0;
                int bestId = 0;

                for (int i = 0; i < 14; i++) {
                    float h;
                    float d = getTrackDistance(pos, i, time, h);
                    if (d < minCore) {
                        minCore = d;
                        bestH = h;
                        bestId = i;
                    }
                }

                outCoreDist = minCore;
                outTrackH = bestH;
                outTrackId = bestId;
            }

            vec3 calculateInterferenceColor(float thickness, float zDepth, float trackH, int trackId) {
                vec3 k = uInterferenceK;
                vec3 phase = uColorPhases.rgb + vec3(uColorPhases.a * trackH + float(trackId) * 0.4);
                
                vec3 fringe1 = 0.5 + 0.5 * cos(thickness * k + phase);
                vec3 fringe2 = 0.5 + 0.5 * cos(thickness * (k * 1.618) + phase + vec3(1.0, 2.0, 3.0));
                vec3 fringe = mix(fringe1, fringe2, 0.35);

                float mixT = clamp(trackH + sin(thickness * 3.14159 + zDepth * 0.4) * 0.3, 0.0, 1.0);
                vec3 basePalette = mix(uColorA, uColorB, mixT);
                basePalette = mix(basePalette, uColorC, smoothstep(0.3, 0.85, thickness));

                vec3 finalTint = mix(basePalette * (0.4 + 0.6 * fringe), uColorAccent, pow(thickness, 3.5) * 0.85);
                return finalTint;
            }

            float randomNoise(vec2 p) {
                return fract(sin(dot(p, vec2(12.8998, 78.233))) * 43758.5453);
            }

            vec3 customTanh(vec3 x) {
                vec3 e2x = exp(2.0 * clamp(x, -20.0, 20.0));
                return (e2x - 1.0) / (e2x + 1.0);
            }

            void main() {
                vec2 fragCoord = vUv * uResolution;
                vec2 uv = (fragCoord * 2.0 - uResolution.xy) / uResolution.y;
                uv = (uv - uPan) / max(uZoom, 0.02);

                vec3 rayOrigin = vec3(0.0, 0.0, -4.5);
                vec3 rayDir = normalize(vec3(uv, 1.2));

                float b = dot(rayOrigin, rayDir);
                float c = dot(rayOrigin, rayOrigin) - uFadeOuter * uFadeOuter;
                float disc = b * b - c;

                vec4 colorAccumulator = vec4(0.0);

                if (disc > 0.0) {
                    float tEnter = max(0.0, -b - sqrt(disc));
                    float tExit = -b + sqrt(disc);
                    
                    float totalDistance = tEnter + 0.02 * randomNoise(fragCoord);
                    float rayLength = tExit - tEnter;
                    float stepSize = max(rayLength / 85.0, 0.015);

                    for (int step = 0; step < 85; step++) {
                        if (totalDistance > tExit) break;
                        
                        vec3 currentPos = rayOrigin + rayDir * totalDistance;
                        float distFromCenter = length(currentPos);
                        
                        vec3 rotatedPos = uRotation * currentPos;
                        float coreDist;
                        float trackH;
                        int trackId;
                        evaluateScene(rotatedPos, uTime, coreDist, trackH, trackId);

                        float radialFade = smoothstep(uFadeOuter, uFadeInner, distFromCenter);

                        float sheathRadius = max(uFilamentRadius * 3.2, 0.005);
                        float thickness = clamp(1.0 - (coreDist / sheathRadius), 0.0, 1.0);

                        float coreIntensity = exp(-coreDist * coreDist / max(2.0 * uFilamentRadius * uFilamentRadius, 0.0001));
                        float haloIntensity = 1.0 / (1.0 + pow(coreDist / max(sheathRadius, 0.005), 2.0));
                        float sampleDensity = coreIntensity * 3.5 + haloIntensity * 0.7;

                        vec3 trackColor = calculateInterferenceColor(thickness, rotatedPos.z, trackH, trackId);

                        colorAccumulator.rgb += trackColor * sampleDensity * radialFade * (stepSize * 25.0) * uGlowIntensity;
                        colorAccumulator.a += coreIntensity * radialFade * stepSize;

                        totalDistance += stepSize;
                    }
                }

                float vigDist = length(uv);
                float vignetteEffect = mix(1.0, max(pow(vigDist * 0.7, 1.5), 0.2), uVignette);
                
                vec3 tonemapped = customTanh(colorAccumulator.rgb / (uExposure * vignetteEffect));
                float objectMask = smoothstep(0.015, 0.15, max(max(tonemapped.r, tonemapped.g), tonemapped.b));
                
                vec3 finalColor;
                if (uGreenScreen > 0.5) {
                    finalColor = mix(vec3(0.0, 1.0, 0.0), tonemapped, objectMask);
                } else {
                    finalColor = mix(uBackgroundColor, tonemapped, objectMask);
                }

                gl_FragColor = vec4(finalColor, 1.0);
            }
        `;

        // =========================================================================
        // 7. CREATE MATERIAL & MESH
        // =========================================================================
        const geometry = new THREE.PlaneGeometry(2, 2);
        const material = new THREE.ShaderMaterial({
            vertexShader,
            fragmentShader,
            uniforms: {
                uTime: { value: 0 },
                uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
                uRotation: { value: new THREE.Matrix3() },
                uZoom: { value: params.zoom },
                uPan: { value: new THREE.Vector2(params.panX, params.panY) },
                uBackgroundColor: { value: hexToVector3(params.backgroundColor) },
                uGreenScreen: { value: params.greenScreen ? 1.0 : 0.0 },

                uFilamentRadius: { value: params.filamentRadius },
                uTrackLength: { value: params.trackLength },
                uWarpFreq: { value: params.warpFreq },
                uWarpAmp: { value: params.warpAmp },
                uSpiralAmp: { value: params.spiralAmp },
                uSmoothing: { value: params.smoothing },
                uFadeOuter: { value: params.fadeOuter },
                uFadeInner: { value: params.fadeInner },

                uColorA: { value: hexToVector3(params.colorA) },
                uColorB: { value: hexToVector3(params.colorB) },
                uColorC: { value: hexToVector3(params.colorC) },
                uColorAccent: { value: hexToVector3(params.colorAccent) },
                uColorPhases: { value: new THREE.Vector4(params.colorPhaseR, params.colorPhaseG, params.colorPhaseB, params.colorPhaseA) },
                uInterferenceK: { value: new THREE.Vector3(params.interfKR, params.interfKG, params.interfKB) },
                uGlowIntensity: { value: params.glowIntensity },
                uExposure: { value: params.exposure },
                uVignette: { value: params.vignette }
            }
        });

        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        // =========================================================================
        // 8. HELPER FUNCTIONS
        // =========================================================================
        const updateSize = () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            renderer.setSize(w, h);
            const pixelRatio = window.devicePixelRatio * params.dpr;
            renderer.setPixelRatio(pixelRatio);
            if (material) {
                material.uniforms.uResolution.value.set(w, h);
            }
            if (postProcessor) {
                postProcessor.setSize(w, h, pixelRatio);
            }
        };

        const applyBackground = () => {
            const color = params.greenScreen ? '#00ff00' : params.backgroundColor;
            document.body.classList.toggle('greenscreen', params.greenScreen);
            renderer.setClearColor(color, 1);
            material.uniforms.uBackgroundColor.value.copy(hexToVector3(color));
            material.uniforms.uGreenScreen.value = params.greenScreen ? 1.0 : 0.0;
        };

        const updateViewUniforms = () => {
            material.uniforms.uZoom.value = params.zoom;
            material.uniforms.uPan.value.set(params.panX, params.panY);
        };

        const updateColorUniforms = () => {
            material.uniforms.uColorA.value.copy(hexToVector3(params.colorA));
            material.uniforms.uColorB.value.copy(hexToVector3(params.colorB));
            material.uniforms.uColorC.value.copy(hexToVector3(params.colorC));
            material.uniforms.uColorAccent.value.copy(hexToVector3(params.colorAccent));
            material.uniforms.uColorPhases.value.set(params.colorPhaseR, params.colorPhaseG, params.colorPhaseB, params.colorPhaseA);
            material.uniforms.uInterferenceK.value.set(params.interfKR, params.interfKG, params.interfKB);
            material.uniforms.uGlowIntensity.value = params.glowIntensity;
            material.uniforms.uExposure.value = params.exposure;
            material.uniforms.uVignette.value = params.vignette;
        };

        const applyColorScheme = (name) => {
            const scheme = COLOR_SCHEMES[name];
            if (!scheme) return;
            params.colorScheme = name;
            params.colorA = scheme.colorA;
            params.colorB = scheme.colorB;
            params.colorC = scheme.colorC;
            params.colorAccent = scheme.colorAccent;
            params.colorPhaseR = scheme.phaseR;
            params.colorPhaseG = scheme.phaseG;
            params.colorPhaseB = scheme.phaseB;
            params.colorPhaseA = scheme.phaseA;
            params.interfKR = scheme.interfKR;
            params.interfKG = scheme.interfKG;
            params.interfKB = scheme.interfKB;
            updateColorUniforms();
            gui.controllersRecursive().forEach(c => c.updateDisplay());
        };

        const applyAnimationPreset = (presetName) => {
            params.animationPreset = presetName;
            switch (presetName) {
                case 'Static Chamber (No Camera)':
                    params.autoRotate = false;
                    params.speed = 0.5;
                    break;
                case 'Slow Cloud Chamber Drift':
                    params.autoRotate = true;
                    params.autoRotateSpeed = 0.25;
                    params.speed = 1.0;
                    break;
                case 'Lorentz Magnetic Precession':
                    params.autoRotate = true;
                    params.autoRotateSpeed = 0.55;
                    params.speed = 1.35;
                    break;
                case 'Quantum Fluctuation Pulse':
                    params.autoRotate = true;
                    params.autoRotateSpeed = 0.18;
                    params.speed = 1.8;
                    break;
                case 'Detector Orbit Scan':
                    params.autoRotate = true;
                    params.autoRotateSpeed = 0.8;
                    params.speed = 1.15;
                    break;
                case 'Ionization Cascade Swirl':
                    params.autoRotate = true;
                    params.autoRotateSpeed = 1.1;
                    params.speed = 2.0;
                    break;
                case 'Relativistic Beam Wobble':
                    params.autoRotate = true;
                    params.autoRotateSpeed = 0.35;
                    params.speed = 1.5;
                    break;
                case 'Deep Chamber Float':
                    params.autoRotate = true;
                    params.autoRotateSpeed = -0.3;
                    params.speed = 0.85;
                    break;
            }
            gui.controllersRecursive().forEach(c => c.updateDisplay());
        };

        const randomizeScene = () => {
            const schemeKeys = Object.keys(COLOR_SCHEMES);
            const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
            applyColorScheme(randomScheme);

            params.filamentRadius = THREE.MathUtils.randFloat(0.025, 0.055);
            params.trackLength = THREE.MathUtils.randFloat(2.2, 3.8);
            params.warpFreq = THREE.MathUtils.randFloat(1.0, 2.6);
            params.warpAmp = THREE.MathUtils.randFloat(0.12, 0.4);
            params.spiralAmp = THREE.MathUtils.randFloat(0.08, 0.3);
            params.smoothing = THREE.MathUtils.randFloat(0.2, 0.8);
            params.glowIntensity = THREE.MathUtils.randFloat(0.9, 1.6);
            params.exposure = THREE.MathUtils.randFloat(16.0, 32.0);
            params.speed = THREE.MathUtils.randFloat(0.7, 1.8);

            material.uniforms.uFilamentRadius.value = params.filamentRadius;
            material.uniforms.uTrackLength.value = params.trackLength;
            material.uniforms.uWarpFreq.value = params.warpFreq;
            material.uniforms.uWarpAmp.value = params.warpAmp;
            material.uniforms.uSpiralAmp.value = params.spiralAmp;
            material.uniforms.uSmoothing.value = params.smoothing;
            material.uniforms.uGlowIntensity.value = params.glowIntensity;
            material.uniforms.uExposure.value = params.exposure;

            targetRotationX = THREE.MathUtils.randFloat(-0.8, 0.8);
            targetRotationY += THREE.MathUtils.randFloat(-1.5, 1.5);

            updateColorUniforms();
            gui.controllersRecursive().forEach(c => c.updateDisplay());
        };

        window.addEventListener('resize', updateSize);

        // =========================================================================
        // 9. INTERACTION & CAMERA CONTROLS
        // =========================================================================
        let isDragging = false;
        let pointerDownPos = { x: 0, y: 0 };
        let previousMousePosition = { x: 0, y: 0 };
        let pointerDownTime = 0;

        let targetRotationX = 0.2;
        let targetRotationY = 0.3;
        let currentRotationX = 0.2;
        let currentRotationY = 0.3;

        const updateRotationMatrix = () => {
            const euler = new THREE.Euler(currentRotationX, currentRotationY, 0, 'YXZ');
            const rotationMatrix4 = new THREE.Matrix4().makeRotationFromEuler(euler);
            material.uniforms.uRotation.value.setFromMatrix4(rotationMatrix4);
        };

        updateRotationMatrix();

        window.addEventListener('pointerdown', (e) => {
            if (e.target.closest('.lil-gui')) return;

            isDragging = true;
            pointerDownPos = { x: e.clientX, y: e.clientY };
            previousMousePosition = { x: e.clientX, y: e.clientY };
            pointerDownTime = performance.now();
            document.body.classList.add('dragging');
            window.setPointerCapture?.(e.pointerId);
        });

        window.addEventListener('pointermove', (e) => {
            if (!isDragging) return;

            const deltaX = e.clientX - previousMousePosition.x;
            const deltaY = e.clientY - previousMousePosition.y;

            if (e.shiftKey || e.buttons === 2) {
                const panScale = 2.0 / window.innerHeight;
                params.panX += deltaX * panScale / params.zoom;
                params.panY -= deltaY * panScale / params.zoom;
                updateViewUniforms();
            } else {
                targetRotationY += deltaX * 0.007;
                targetRotationX += deltaY * 0.007;
                targetRotationX = Math.max(-Math.PI / 2 + 0.05, Math.min(Math.PI / 2 - 0.05, targetRotationX));
            }

            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        const endDrag = (e) => {
            if (!isDragging) return;
            isDragging = false;
            document.body.classList.remove('dragging');
            window.releasePointerCapture?.(e.pointerId);

            const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
            const duration = performance.now() - pointerDownTime;
            if (dist < 6 && duration < 350 && params.clickRandomize) {
                randomizeScene();
            }
        };

        window.addEventListener('pointerup', endDrag);
        window.addEventListener('pointercancel', endDrag);

        window.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = Math.exp(-e.deltaY * 0.0012);
            params.zoom = THREE.MathUtils.clamp(params.zoom * zoomFactor, 0.1, 10.0);
            updateViewUniforms();
            gui.controllersRecursive().forEach(c => {
                if (c.property === 'zoom') c.updateDisplay();
            });
        }, { passive: false });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'h' || e.key === 'H') {
                gui._hidden ? gui.show() : gui.hide();
            }
        });

        // =========================================================================
        // 10. LIL-GUI SETUP
        // =========================================================================
        const gui = new GUI({ title: 'Ionization Chamber Controls' });

        // Folder: Render & View
        const folderRender = gui.addFolder('Render & View');
        folderRender.add(params, 'dpr', 0.2, 2.0, 0.05).name('Pixel Ratio (DPR)').onChange(updateSize);
        folderRender.add(params, 'zoom', 0.1, 10.0, 0.01).name('Zoom').onChange(updateViewUniforms);
        folderRender.add(params, 'panX', -5.0, 5.0, 0.01).name('Pan X').onChange(updateViewUniforms);
        folderRender.add(params, 'panY', -5.0, 5.0, 0.01).name('Pan Y').onChange(updateViewUniforms);

        // Folder: Background
        const folderBg = gui.addFolder('Background & Chamber');
        folderBg.add(params, 'greenScreen').name('Green Screen #00ff00').onChange(applyBackground);
        folderBg.addColor(params, 'backgroundColor').name('Chamber Color').onChange(applyBackground);
        folderBg.add(params, 'vignette', 0.0, 2.0, 0.01).name('Vignette Falloff').onChange(v => material.uniforms.uVignette.value = v);

        // Folder: Animation
        const folderAnim = gui.addFolder('Animation');
        folderAnim.add(params, 'animationPreset', ANIMATION_PRESETS).name('Preset').onChange(applyAnimationPreset);
        folderAnim.add(params, 'speed', 0.0, 4.0, 0.01).name('Speed');
        folderAnim.add(params, 'autoRotate').name('Auto Chamber Rotation');
        folderAnim.add(params, 'autoRotateSpeed', -2.0, 2.0, 0.01).name('Rotation Speed');

        // Folder: Geometry
        const folderGeom = gui.addFolder('Ionization Geometry');
        folderGeom.add(params, 'filamentRadius', 0.005, 0.12, 0.001).name('Track Thickness').onChange(v => material.uniforms.uFilamentRadius.value = v);
        folderGeom.add(params, 'trackLength', 0.5, 5.0, 0.05).name('Track Length').onChange(v => material.uniforms.uTrackLength.value = v);
        folderGeom.add(params, 'warpFreq', 0.2, 4.0, 0.01).name('Wave Frequency').onChange(v => material.uniforms.uWarpFreq.value = v);
        folderGeom.add(params, 'warpAmp', 0.0, 0.8, 0.01).name('Wave Amplitude').onChange(v => material.uniforms.uWarpAmp.value = v);
        folderGeom.add(params, 'spiralAmp', 0.0, 0.6, 0.01).name('Magnetic Curl').onChange(v => material.uniforms.uSpiralAmp.value = v);
        folderGeom.add(params, 'smoothing', 0.05, 1.5, 0.01).name('Vertex Blend').onChange(v => material.uniforms.uSmoothing.value = v);
        folderGeom.add(params, 'fadeOuter', 1.0, 6.0, 0.05).name('Chamber Radius').onChange(v => material.uniforms.uFadeOuter.value = v);
        folderGeom.add(params, 'fadeInner', 0.5, 5.0, 0.05).name('Inner Fade').onChange(v => material.uniforms.uFadeInner.value = v);

        // Folder: Color & Interference
        const folderColors = gui.addFolder('Color & Thin-Film Interference');
        folderColors.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Color Scheme').onChange(applyColorScheme);
        folderColors.addColor(params, 'colorA').name('Color A').onChange(updateColorUniforms);
        folderColors.addColor(params, 'colorB').name('Color B').onChange(updateColorUniforms);
        folderColors.addColor(params, 'colorC').name('Color C').onChange(updateColorUniforms);
        folderColors.addColor(params, 'colorAccent').name('Accent Core').onChange(updateColorUniforms);
        folderColors.add(params, 'interfKR', 0.0, 30.0, 0.1).name('Interference K (R)').onChange(updateColorUniforms);
        folderColors.add(params, 'interfKG', 0.0, 30.0, 0.1).name('Interference K (G)').onChange(updateColorUniforms);
        folderColors.add(params, 'interfKB', 0.0, 30.0, 0.1).name('Interference K (B)').onChange(updateColorUniforms);
        folderColors.add(params, 'colorPhaseR', 0.0, 10.0, 0.1).name('Phase R').onChange(updateColorUniforms);
        folderColors.add(params, 'colorPhaseG', 0.0, 10.0, 0.1).name('Phase G').onChange(updateColorUniforms);
        folderColors.add(params, 'colorPhaseB', 0.0, 10.0, 0.1).name('Phase B').onChange(updateColorUniforms);
        folderColors.add(params, 'colorPhaseA', 0.0, 10.0, 0.1).name('Phase Decay').onChange(updateColorUniforms);
        folderColors.add(params, 'glowIntensity', 0.1, 3.0, 0.05).name('Glow Intensity').onChange(updateColorUniforms);
        folderColors.add(params, 'exposure', 2.0, 100.0, 0.5).name('Exposure').onChange(updateColorUniforms);

        // Attach Post-Processing Suite Folder
        postProcessor.attachGUI(gui);

        // Folder: Procedural Variations
        const folderRand = gui.addFolder('Procedural Variations');
        folderRand.add(params, 'clickRandomize').name('Click Scene to Mutate');
        folderRand.add({ mutate: randomizeScene }, 'mutate').name('🎲 Generate New Variation');

        gui.close();
        updateSize();
        applyBackground();
        updateColorUniforms();

        // =========================================================================
        // 11. RENDER LOOP
        // =========================================================================
        const clock = new THREE.Clock();
        let currentTime = 0;

        const animate = () => {
            requestAnimationFrame(animate);

            let delta = clock.getDelta();
            delta = Math.min(delta, 0.1);
            currentTime += delta * params.speed;

            if (params.autoRotate && !isDragging) {
                if (params.animationPreset === 'Lorentz Magnetic Precession') {
                    targetRotationY += delta * params.autoRotateSpeed;
                    targetRotationX = Math.sin(currentTime * 0.7) * 0.4;
                } else if (params.animationPreset === 'Relativistic Beam Wobble') {
                    targetRotationY += Math.cos(currentTime * 0.5) * delta * params.autoRotateSpeed * 1.5;
                    targetRotationX = Math.sin(currentTime * 0.8) * 0.35;
                } else if (params.animationPreset === 'Quantum Fluctuation Pulse') {
                    targetRotationY += delta * params.autoRotateSpeed;
                    material.uniforms.uWarpAmp.value = params.warpAmp * (1.0 + 0.35 * Math.sin(currentTime * 2.5));
                } else {
                    targetRotationY += delta * params.autoRotateSpeed;
                }
            }

            targetRotationX = Math.max(-Math.PI / 2 + 0.05, Math.min(Math.PI / 2 - 0.05, targetRotationX));

            currentRotationX += (targetRotationX - currentRotationX) * 0.08;
            currentRotationY += (targetRotationY - currentRotationY) * 0.08;

            updateRotationMatrix();

            material.uniforms.uTime.value = currentTime;
            postProcessor.renderScene(scene, camera);
        };

        animate();
    </script>
</body>
</html>
