<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flowing Silk Ribbon Fabric Waves</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #030712;
      user-select: none;
      -webkit-user-select: none;
    }
    #webgl-canvas {
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
    }
  }
  </script>
</head>
<body>
  <canvas id="webgl-canvas"></canvas>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import GUI from 'lil-gui';

    // =========================================================================
    // POST PROCESSOR SUITE (Inlined from postprocessing/PostProcessor.js)
    // Robust, NaN-safe, Frustum-cull-safe implementation
    // =========================================================================
    const orthoVertexShader = `
    precision highp float;
    in vec3 position;
    out vec2 vUv;
    void main() {
      vUv = position.xy * 0.5 + 0.5;
      gl_Position = vec4(position, 1.0);
    }
    `;

    const brightFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float bloomThreshold;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      if (isnan(color.r) || isnan(color.g) || isnan(color.b) || isinf(color.r) || isinf(color.g) || isinf(color.b)) {
        color = vec4(0.0, 0.0, 0.0, 1.0);
      }
      color.rgb = clamp(color.rgb, 0.0, 65000.0);

      float luminance = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float knee = 0.1;
      float soft = luminance - bloomThreshold + knee;
      soft = clamp(soft, 0.0, 2.0 * knee);
      soft = (soft * soft) / (4.0 * knee + 0.00001);
      float contribution = max(soft, luminance - bloomThreshold);
      contribution /= max(luminance, 0.00001);
      fragColor = vec4(color.rgb * contribution, color.a);
    }
    `;

    const blur13ShaderChunk = `
    vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
      vec2 resolution = max(vec2(textureSize(image, 0)), vec2(2.0, 2.0));
      vec4 color = vec4(0.0);
      vec2 off1 = vec2(1.411764705882353) * direction;
      vec2 off2 = vec2(3.2941176470588234) * direction;
      vec2 off3 = vec2(5.176470588235294) * direction;
      color += texture(image, uv) * 0.1964825501511404;
      color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
      color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
      return color;
    }
    `;

    const blurFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 direction;
    in vec2 vUv;
    out vec4 color;
    ${blur13ShaderChunk}
    void main() {
      color = blur13(inputTexture, vUv, direction);
      if (isnan(color.r) || isnan(color.g) || isnan(color.b) || isinf(color.r) || isinf(color.g) || isinf(color.b)) {
        color = vec4(0.0, 0.0, 0.0, 1.0);
      }
      color.rgb = clamp(color.rgb, 0.0, 65000.0);
    }
    `;

    const finalFragmentShader = `
    precision highp float;
    uniform vec2 resolution;
    uniform sampler2D inputTexture;
    uniform sampler2D blur0Texture;
    uniform sampler2D blur1Texture;
    uniform sampler2D blur2Texture;
    uniform sampler2D blur3Texture;
    uniform sampler2D blur4Texture;
    uniform bool bloomEnabled;
    uniform float bloomStrength;
    uniform float vignetteBoost;
    uniform float vignetteReduction;
    uniform float noiseIntensity;
    uniform float time;
    in vec2 vUv;
    out vec4 fragColor;

    float vignette(vec2 uv, float boost, float reduction) {
      vec2 position = vUv - 0.5;
      return max(0.0, boost - length(position) * reduction);
    }

    float hash1(uint n) {
      n = (n << 13U) ^ n;
      n = n * (n * n * 15731U + 789221U) + 1376312589U;
      return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
    }

    float noise(in vec2 uv, in float timeVal) {
      uvec2 p = uvec2(uv) % uvec2(1920U, 1080U);
      uint t = uint(timeVal) % 500U;
      return hash1(p.x + 1920U * p.y + t * 2073600U);
    }

    void main() {
      vec4 color = texture(inputTexture, vUv);
      if (isnan(color.r) || isnan(color.g) || isnan(color.b) || isinf(color.r) || isinf(color.g) || isinf(color.b)) {
        color = vec4(0.0, 0.0, 0.0, 1.0);
      }
      color.rgb = clamp(color.rgb, 0.0, 65000.0);

      if (bloomEnabled && bloomStrength > 0.001) {
        vec4 b0 = texture(blur0Texture, vUv);
        vec4 b1 = texture(blur1Texture, vUv);
        vec4 b2 = texture(blur2Texture, vUv);
        vec4 b3 = texture(blur3Texture, vUv);
        vec4 b4 = texture(blur4Texture, vUv);

        vec4 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
        if (!isnan(bloomSum.r) && !isnan(bloomSum.g) && !isnan(bloomSum.b)) {
          color += bloomSum * bloomStrength;
        }
      }

      color.rgb *= vignette(vUv, vignetteBoost, vignetteReduction);
      color.rgb += noiseIntensity * noise(gl_FragCoord.xy, time);
      fragColor = vec4(clamp(color.rgb, 0.0, 65000.0), 1.0);
    }
    `;

    const chromaticAberrationShaderChunk = `
    vec2 barrelDistortion(vec2 coord, float amt) {
      vec2 cc = coord - 0.5;
      float dist = dot(cc, cc);
      return coord + cc * dist * amt;
    }
    float sat(float t) { return clamp(t, 0.0, 1.0); }
    float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
    float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
    vec4 spectrum_offset(float t) {
      float lo = step(t, 0.5);
      float hi = 1.0 - lo;
      float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
      vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
      return pow(max(ret, vec4(0.0001)), vec4(1.0 / 2.2));
    }
    const float max_distort = 2.2;
    const int num_iter = 8;
    const float reci_num_iter_f = 1.0 / float(num_iter);
    vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
      vec4 sumcol = vec4(0.0);
      vec4 sumw = vec4(0.0);
      for (int i = 0; i < num_iter; ++i) {
        float t = float(i) * reci_num_iter_f;
        vec4 w = spectrum_offset(t);
        sumw += w;
        sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
      }
      return sumcol / max(sumw, vec4(0.0001));
    }
    `;

    const colorFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float chromaticAberrationAmount;
    uniform float minInputLevel;
    uniform float maxInputLevel;
    uniform float gammaLevel;
    uniform float fisheyeStrength;
    uniform float fisheyeRadius;
    uniform float time;
    in vec2 vUv;
    out vec4 fragColor;

    ${chromaticAberrationShaderChunk}

    vec2 applyFisheye(vec2 uv, float strength, float radius) {
      if (abs(strength) < 0.0001) return uv;
      vec2 p = uv - 0.5;
      float d = length(p);
      if (d < 0.0001 || d > radius * 1.5) return uv;
      float r = d / max(radius, 0.001);
      float theta = atan(p.y, p.x);
      float rDist = r + strength * (r * r * r);
      return 0.5 + vec2(cos(theta), sin(theta)) * (rDist * radius);
    }

    vec3 gammaCorrect(vec3 color, vec3 gamma) {
      return pow(clamp(color, vec3(0.0001), vec3(65000.0)), 1.0 / max(gamma, vec3(0.01)));
    }
    vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
      return clamp((color - minInput) / max(maxInput - minInput, vec3(0.0001)), vec3(0.0), vec3(1.0));
    }
    vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
      return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
    }
    void main() {
      vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
      fragColor = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
      if (isnan(fragColor.r) || isnan(fragColor.g) || isnan(fragColor.b) || isinf(fragColor.r) || isinf(fragColor.g) || isinf(fragColor.b)) {
        fragColor = vec4(0.0, 0.0, 0.0, 1.0);
      }
      fragColor.rgb = finalLevels(fragColor.rgb, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
      fragColor.a = 1.0;
    }
    `;

    const copyFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      fragColor = texture(inputTexture, vUv);
    }
    `;

    function createFBO(w, h, options = {}) {
      return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
        wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
        wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
        minFilter: options.minFilter || THREE.LinearFilter,
        magFilter: options.magFilter || THREE.LinearFilter,
        format: options.format || THREE.RGBAFormat,
        type: options.type || THREE.HalfFloatType,
        stencilBuffer: options.stencilBuffer || false,
        depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : true,
        samples: options.samples || 0,
      });
    }

    class ShaderPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbo = createFBO(1, 1, options);
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoQuad.frustumCulled = false; // Prevent culling
        this.orthoScene.add(this.orthoQuad);
        this.texture = this.fbo.texture;
      }
      render(renderer, toScreen = false) {
        if (!toScreen) {
          renderer.setRenderTarget(this.fbo);
        }
        renderer.render(this.orthoScene, this.orthoCamera);
        if (!toScreen) {
          renderer.setRenderTarget(null);
        }
      }
      setSize(width, height) {
        this.fbo.setSize(Math.max(1, width), Math.max(1, height));
        this.orthoQuad.scale.set(1, 1, 1);
      }
    }

    class ShaderPingPongPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
        this.currentFBO = 0;
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoQuad.frustumCulled = false; // Prevent culling
        this.orthoScene.add(this.orthoQuad);
      }
      render(renderer) {
        renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
        renderer.render(this.orthoScene, this.orthoCamera);
        renderer.setRenderTarget(null);
        this.currentFBO = 1 - this.currentFBO;
      }
      get current() { return this.fbos[this.currentFBO]; }
      get texture() { return this.current.texture; }
      setSize(width, height) {
        const w = Math.max(1, width);
        const h = Math.max(1, height);
        this.fbos[0].setSize(w, h);
        this.fbos[1].setSize(w, h);
        this.orthoQuad.scale.set(1, 1, 1);
      }
    }

    class BloomPass {
      constructor(strength = 0.8, radius = 0.5, threshold = 0.2, levels = 5) {
        this.strength = strength;
        this.radius = radius;
        this.threshold = threshold;
        this.enabled = true;
        this.levels = levels;

        this.brightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            bloomThreshold: { value: this.threshold },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: brightFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.brightPass = new ShaderPass(this.brightShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.blurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            direction: { value: new THREE.Vector2(0, 1) },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: blurFragmentShader,
          glslVersion: THREE.GLSL3,
        });

        this.blurPasses = [];
        for (let i = 0; i < this.levels; i++) {
          this.blurPasses.push(new ShaderPingPongPass(this.blurShader, {
            format: THREE.RGBAFormat,
            type: THREE.HalfFloatType,
          }));
        }
      }

      setSize(w, h) {
        let tw = Math.max(2, w);
        let th = Math.max(2, h);
        this.brightPass.setSize(tw, th);
        for (let i = 0; i < this.levels; i++) {
          tw = Math.max(2, Math.round(tw / 2));
          th = Math.max(2, Math.round(th / 2));
          this.blurPasses[i].setSize(tw, th);
        }
      }

      set source(texture) {
        this.brightShader.uniforms.inputTexture.value = texture;
      }

      render(renderer) {
        if (!this.enabled || this.strength <= 0.001) return;

        this.brightShader.uniforms.bloomThreshold.value = this.threshold;
        this.brightPass.render(renderer);

        const baseOffset = Math.max(0.1, this.radius * 2.0);
        const u = this.blurShader.uniforms;

        for (let j = 0; j < this.levels; j++) {
          const blurPass = this.blurPasses[j];
          const stepOffset = baseOffset * (1.0 + j * 0.5);

          u.direction.value.set(stepOffset, 0);
          u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
          blurPass.render(renderer);

          u.direction.value.set(0, stepOffset * 0.5);
          u.inputTexture.value = blurPass.current.texture;
          blurPass.render(renderer);
        }
      }
    }

    class PostProcessor {
      constructor(renderer, userParams = {}) {
        this.renderer = renderer;

        this.settings = {
          enabled: userParams.enabled !== undefined ? userParams.enabled : true,
          bloomEnabled: userParams.bloomEnabled !== undefined ? userParams.bloomEnabled : true,
          bloomStrength: userParams.bloomStrength !== undefined ? userParams.bloomStrength : 0.75,
          bloomRadius: userParams.bloomRadius !== undefined ? userParams.bloomRadius : 0.65,
          bloomThreshold: userParams.bloomThreshold !== undefined ? userParams.bloomThreshold : 0.32,
          fisheyeStrength: userParams.fisheyeStrength !== undefined ? userParams.fisheyeStrength : 0.0,
          fisheyeRadius: userParams.fisheyeRadius !== undefined ? userParams.fisheyeRadius : 1.0,
          chromaticAberration: userParams.chromaticAberration !== undefined ? userParams.chromaticAberration : 0.012,
          vignetteBoost: userParams.vignetteBoost !== undefined ? userParams.vignetteBoost : 1.05,
          vignetteReduction: userParams.vignetteReduction !== undefined ? userParams.vignetteReduction : 0.35,
          noiseIntensity: userParams.noiseIntensity !== undefined ? userParams.noiseIntensity : 0.012,
          gamma: userParams.gamma !== undefined ? userParams.gamma : 1.0,
          minInputLevel: userParams.minInputLevel !== undefined ? userParams.minInputLevel : 0.0,
          maxInputLevel: userParams.maxInputLevel !== undefined ? userParams.maxInputLevel : 1.0,
        };

        this.sceneTarget = createFBO(1, 1, { type: THREE.HalfFloatType });

        this.bloomPass = new BloomPass(
          this.settings.bloomStrength,
          this.settings.bloomRadius,
          this.settings.bloomThreshold,
          5
        );

        this.finalShader = new THREE.RawShaderMaterial({
          uniforms: {
            resolution: { value: new THREE.Vector2(1, 1) },
            bloomEnabled: { value: this.settings.bloomEnabled },
            bloomStrength: { value: this.settings.bloomStrength },
            vignetteBoost: { value: this.settings.vignetteBoost },
            vignetteReduction: { value: this.settings.vignetteReduction },
            noiseIntensity: { value: this.settings.noiseIntensity },
            inputTexture: { value: null },
            blur0Texture: { value: null },
            blur1Texture: { value: null },
            blur2Texture: { value: null },
            blur3Texture: { value: null },
            blur4Texture: { value: null },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: finalFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.finalPass = new ShaderPass(this.finalShader);

        this.rgbShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: this.finalPass.texture },
            fisheyeStrength: { value: this.settings.fisheyeStrength },
            fisheyeRadius: { value: this.settings.fisheyeRadius },
            chromaticAberrationAmount: { value: this.settings.chromaticAberration },
            minInputLevel: { value: this.settings.minInputLevel },
            maxInputLevel: { value: this.settings.maxInputLevel },
            gammaLevel: { value: this.settings.gamma },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: colorFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.rgbPass = new ShaderPass(this.rgbShader);

        this.copyShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: copyFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.copyPass = new ShaderPass(this.copyShader);
      }

      updateSettings() {
        this.bloomPass.enabled = this.settings.bloomEnabled;
        this.bloomPass.strength = this.settings.bloomStrength;
        this.bloomPass.radius = this.settings.bloomRadius;
        this.bloomPass.threshold = this.settings.bloomThreshold;

        this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
        this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
        this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
        this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
        this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;

        this.rgbShader.uniforms.fisheyeStrength.value = this.settings.fisheyeStrength;
        this.rgbShader.uniforms.fisheyeRadius.value = this.settings.fisheyeRadius;
        this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
        this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
        this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
        this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
      }

      setSize(w0, h0, dpr = 1) {
        const w = Math.max(2, Math.floor(w0 * dpr));
        const h = Math.max(2, Math.floor(h0 * dpr));
        this.sceneTarget.setSize(w, h);
        this.finalPass.setSize(w, h);
        this.finalShader.uniforms.resolution.value.set(w, h);
        this.bloomPass.setSize(w, h);
        this.rgbPass.setSize(w, h);
        this.copyPass.setSize(w, h);
      }

      renderScene(scene, camera) {
        if (!this.settings.enabled) {
          this.renderer.render(scene, camera);
          return;
        }
        this.renderer.setRenderTarget(this.sceneTarget);
        this.renderer.clear();
        this.renderer.render(scene, camera);
        this.renderer.setRenderTarget(null);
        this.render(this.sceneTarget.texture);
      }

      render(sourceTexture) {
        if (!this.settings.enabled) {
          this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
          this.copyPass.render(this.renderer, true);
          return;
        }

        this.updateSettings();

        this.bloomPass.source = sourceTexture;
        this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
        this.bloomPass.render(this.renderer);

        this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
        this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
        this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
        this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
        this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

        const safeTime = (performance.now() * 0.05) % 400.0;
        this.finalPass.shader.uniforms.time.value = safeTime;
        this.rgbPass.shader.uniforms.time.value = safeTime;

        this.finalPass.render(this.renderer);
        this.rgbPass.render(this.renderer, true);
      }

      attachGUI(gui, title = "Post-Processing Suite") {
        const root = gui.addFolder(title);
        root.add(this.settings, "enabled").name("Enable Suite");

        const bloom = root.addFolder("Bloom");
        bloom.add(this.settings, "bloomEnabled").name("Enable Bloom").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomStrength", 0, 3.0, 0.05).name("Strength").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomRadius", 0, 2.0, 0.05).name("Radius").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomThreshold", 0, 1.0, 0.01).name("Threshold").onChange(() => this.updateSettings());

        const lens = root.addFolder("Lens, Optics & Fisheye");
        lens.add(this.settings, "fisheyeStrength", -1.0, 1.5, 0.01).name("Fisheye Distortion").onChange(() => this.updateSettings());
        lens.add(this.settings, "fisheyeRadius", 0.2, 2.0, 0.05).name("Fisheye Radius").onChange(() => this.updateSettings());
        lens.add(this.settings, "chromaticAberration", 0, 0.2, 0.005).name("Chromatic Aberration").onChange(() => this.updateSettings());
        lens.add(this.settings, "vignetteBoost", 0, 2.0, 0.05).name("Vignette Boost").onChange(() => this.updateSettings());
        lens.add(this.settings, "vignetteReduction", 0, 2.0, 0.05).name("Vignette Falloff").onChange(() => this.updateSettings());
        lens.add(this.settings, "noiseIntensity", 0, 0.1, 0.005).name("Film Grain").onChange(() => this.updateSettings());
        lens.add(this.settings, "gamma", 0.2, 2.0, 0.05).name("Gamma").onChange(() => this.updateSettings());
        lens.add(this.settings, "minInputLevel", 0, 0.5, 0.01).name("Black Level").onChange(() => this.updateSettings());

    // --- CUSTOM SILK FABRIC SHADER MATERIAL ---
    function createFabricRibbon() {
      const geometry = new THREE.PlaneGeometry(BASE_RIBBON_WIDTH, BASE_RIBBON_HEIGHT, 380, 200);

      fabricMaterial = new THREE.ShaderMaterial({
        side: THREE.DoubleSide,
        transparent: false,
        uniforms: {
          uTime: { value: 0 },
          uWaveHeight: { value: params.waveHeight },
          uFrequency: { value: params.waveFrequency },
          uRidgeSharpness: { value: params.ridgeSharpness },
          uWindAngle: { value: params.windAngle },
          uAnchorStrength: { value: params.horizontalAnchor },
          uRibbonWidth: { value: BASE_RIBBON_WIDTH },
          uFabricColor: { value: new THREE.Color(params.fabricColor) },
          uSheenColor: { value: new THREE.Color(params.sheenColor) },
          uShadowColor: { value: new THREE.Color(params.shadowColor) },
          uRoughness: { value: params.roughness },
          uMetalness: { value: params.metalness },
          uSheenStrength: { value: params.sheenStrength },
          uLightIntensity: { value: params.lightIntensity },
          uDirLightPos1: { value: new THREE.Vector3(40, 50, 45) },
          uDirLightColor1: { value: new THREE.Color(params.sheenColor) },
          uDirLightPos2: { value: new THREE.Vector3(-45, -25, -35) },
          uDirLightColor2: { value: new THREE.Color(0xffffff) }
        },
        vertexShader: `
          uniform float uTime;
          uniform float uWaveHeight;
          uniform float uFrequency;
          uniform float uRidgeSharpness;
          uniform float uWindAngle;
          uniform float uAnchorStrength;
          uniform float uRibbonWidth;

          varying vec3 vNormalVec;
          varying vec3 vWorldPosition;
          varying vec2 vUv;
          varying float vElevation;
          varying float vRidgeFactor;

          // Continuous organic wind wave displacement with horizontal anchoring
          float calculateDisplacement(float x, float y) {
            float windX = cos(uWindAngle);
            float windY = sin(uWindAngle);

            // Coordinates in wind space with organic multi-frequency waves
            float p1 = (x * windX + y * windY) * (uFrequency * 0.22) - uTime * 0.85;
            float p2 = (x * (-windY) + y * windX) * (uFrequency * 0.32) - uTime * 0.52;
            float p3 = (x * 0.25 + y * 0.45) * (uFrequency * 0.55) + uTime * 0.32;

            // Rolling organic ridges: safe power function without NaN
            float s1 = sin(p1);
            float s1Abs = max(abs(s1), 0.0001);
            float safeExp = clamp(uRidgeSharpness, 0.4, 2.5);
            float ridge1 = sign(s1) * pow(s1Abs, safeExp);

            float s2 = sin(p2);
            float ridge2 = sin(p2 * 1.25 + s1 * 0.65) * 0.45;
            float s3 = cos(p3 + s1 * 0.7) * 0.28;

            // Delicate organic surface flutter
            float flutter = sin(x * 0.75 - uTime * 1.2) * cos(y * 0.9) * 0.2;

            float rawWave = (ridge1 * 1.85 + ridge2 + s3 + flutter) * uWaveHeight;

            // Horizontal anchoring: anchored at left & right edges
            float u = (x + uRibbonWidth * 0.5) / uRibbonWidth;
            float anchorMask = smoothstep(0.0, 0.14, u) * smoothstep(1.0, 0.86, u);
            anchorMask = mix(1.0, anchorMask, uAnchorStrength);

            // Hanging catenary drape: Safe multiplication instead of pow(negative, 2.0)
            float normX = clamp(x / (uRibbonWidth * 0.5), -1.0, 1.0);
            float catenary = -(normX * normX) * 1.8;

            return (rawWave * anchorMask) + (catenary * anchorMask);
          }

          void main() {
            vUv = uv;

            float x = position.x;
            float y = position.y;
            float z = calculateDisplacement(x, y);

            vElevation = z;

            // Analytical finite-difference normal calculation for pristine silk highlights
            float delta = 0.06;
            float zX = calculateDisplacement(x + delta, y);
            float zY = calculateDisplacement(x, y + delta);

            vec3 dX = vec3(delta, 0.0, zX - z);
            vec3 dY = vec3(0.0, delta, zY - z);
            vec3 crossVal = cross(dX, dY);
            vec3 calculatedNormal = length(crossVal) > 0.0001 ? normalize(crossVal) : vec3(0.0, 0.0, 1.0);

            vNormalVec = normalize(normalMatrix * calculatedNormal);
            vRidgeFactor = smoothstep(-2.5, 3.2, z);

            vec3 displacedPosition = vec3(x, y, z);
            vec4 worldPos = modelMatrix * vec4(displacedPosition, 1.0);
            vWorldPosition = worldPos.xyz;

            gl_Position = projectionMatrix * viewMatrix * worldPos;
          }
        `,
        fragmentShader: `
          uniform vec3 uFabricColor;
          uniform vec3 uSheenColor;
          uniform vec3 uShadowColor;
          uniform float uRoughness;
          uniform float uMetalness;
          uniform float uSheenStrength;
          uniform float uLightIntensity;
          uniform vec3 uDirLightPos1;
          uniform vec3 uDirLightColor1;
          uniform vec3 uDirLightPos2;
          uniform vec3 uDirLightColor2;

          varying vec3 vNormalVec;
          varying vec3 vWorldPosition;
          varying vec2 vUv;
          varying float vElevation;
          varying float vRidgeFactor;

          void main() {
            vec3 N = normalize(vNormalVec);
            if (!gl_FrontFacing) {
              N = -N;
            }

            vec3 V = normalize(cameraPosition - vWorldPosition);

            // Key Light 1
            vec3 L1 = normalize(uDirLightPos1 - vWorldPosition);
            vec3 H1 = normalize(L1 + V);
            float NdotL1 = clamp(dot(N, L1), 0.0, 1.0);
            float NdotH1 = clamp(dot(N, H1), 0.0, 1.0);
            float shininess1 = clamp(32.0 / max(0.05, uRoughness), 1.0, 256.0);
            float spec1 = pow(NdotH1, shininess1);

            // Key Light 2
            vec3 L2 = normalize(uDirLightPos2 - vWorldPosition);
            vec3 H2 = normalize(L2 + V);
            float NdotL2 = clamp(dot(N, L2), 0.0, 1.0);
            float NdotH2 = clamp(dot(N, H2), 0.0, 1.0);
            float shininess2 = clamp(16.0 / max(0.05, uRoughness), 1.0, 256.0);
            float spec2 = pow(NdotH2, shininess2);

            // Silk anisotropic grazing sheen (Fresnel / Shot-Silk Iridescence)
            float NdotV = clamp(dot(N, V), 0.0, 1.0);
            float fresnel = pow(clamp(1.0 - NdotV, 0.0, 1.0), 2.8) * uSheenStrength;

            // Interpolate pigment from deep fold shadows to bright silky crests
            vec3 baseTone = mix(uShadowColor, uFabricColor, smoothstep(-3.0, 1.5, vElevation));
            vec3 foldHighlight = mix(baseTone, uSheenColor, vRidgeFactor * 0.7);

            // Ambient + Diffuse
            float diffuseTotal = (NdotL1 * 0.7 + NdotL2 * 0.4 + 0.35) * uLightIntensity;
            vec3 finalColor = foldHighlight * diffuseTotal;

            // Specular & Sheen reflections
            vec3 specularColor = (spec1 * uDirLightColor1 * 0.95 + spec2 * uDirLightColor2 * 0.5) * (1.0 - uRoughness * 0.6);
            finalColor += specularColor * (1.0 + uMetalness * 2.0);
            finalColor += uSheenColor * fresnel * 0.85;

            finalColor = clamp(finalColor, 0.0, 65000.0);
            if (isnan(finalColor.r) || isnan(finalColor.g) || isnan(finalColor.b)) {
              finalColor = uFabricColor;
            }

            gl_FragColor = vec4(finalColor, 1.0);
          }
        `
      });

      fabricMesh = new THREE.Mesh(geometry, fabricMaterial);
      fabricMesh.rotation.x = -Math.PI * 0.15;
      fabricMesh.scale.set(params.planeScale, params.planeScale, params.planeScale);
      scene.add(fabricMesh);
    }

    // --- ANIMATION CONTROLLER ---
    function updateSceneAnimation(delta) {
      animTime += delta * params.animationSpeed;

      if (fabricMaterial) {
        fabricMaterial.uniforms.uTime.value = animTime;
        fabricMaterial.uniforms.uWaveHeight.value = params.waveHeight;
        fabricMaterial.uniforms.uFrequency.value = params.waveFrequency;
        fabricMaterial.uniforms.uRidgeSharpness.value = params.ridgeSharpness;
        fabricMaterial.uniforms.uWindAngle.value = params.windAngle;
        fabricMaterial.uniforms.uAnchorStrength.value = params.horizontalAnchor;
        fabricMaterial.uniforms.uRoughness.value = params.roughness;
        fabricMaterial.uniforms.uMetalness.value = params.metalness;
        fabricMaterial.uniforms.uSheenStrength.value = params.sheenStrength;
        fabricMaterial.uniforms.uLightIntensity.value = params.lightIntensity;
      }

      if (fabricMesh) {
        fabricMesh.scale.set(params.planeScale, params.planeScale, params.planeScale);
      }

      const t = animTime * 0.35;

      switch (params.animation) {
        case 'Gentle Ribbon Drift (Static Camera)':
          break;

        case 'Slow Orbiting Vista': {
          const radius = 58;
          camera.position.x = radius * Math.sin(t * 0.16);
          camera.position.z = radius * Math.cos(t * 0.16);
          camera.position.y = 12 + 6 * Math.sin(t * 0.1);
          controls.target.set(0, 0, 0);
          break;
        }

        case 'Low Horizon Breeze Glide': {
          camera.position.x = 24 * Math.sin(t * 0.2);
          camera.position.y = 4.5 + 2.5 * Math.cos(t * 0.14);
          camera.position.z = 46 + 5 * Math.sin(t * 0.1);
          controls.target.set(camera.position.x * 0.3, 1.0, 0);
          break;
        }

        case 'Serene Ocean Undulation': {
          camera.position.x = 16 * Math.sin(t * 0.14);
          camera.position.y = 16 + 5.0 * Math.sin(t * 0.22);
          camera.position.z = 52 + 5.0 * Math.cos(t * 0.16);
          controls.target.set(0, 0, 0);
          break;
        }

        case 'Diagonal Silk Weave': {
          const dist = 54;
          camera.position.x = dist * Math.cos(t * 0.18);
          camera.position.y = 15 + 5.5 * Math.sin(t * 0.13);
          camera.position.z = dist * 0.8 * Math.sin(t * 0.18);
          controls.target.set(0, -1.0, 0);
          break;
        }

        case 'Aerial Topographic Survey': {
          camera.position.x = 10 * Math.sin(t * 0.15);
          camera.position.y = 48 + 5 * Math.cos(t * 0.11);
          camera.position.z = 28 + 6 * Math.sin(t * 0.13);
          controls.target.set(0, 0, 0);
          break;
        }

        case 'Dreamy Breathing Waves': {
          const breath = 1.0 + 0.35 * Math.sin(t * 0.6);
          if (fabricMaterial) {
            fabricMaterial.uniforms.uWaveHeight.value = params.waveHeight * breath;
          }
          camera.position.x = 7 * Math.sin(t * 0.1);
          camera.position.y = 10 + 2.5 * Math.sin(t * 0.14);
          camera.position.z = 52;
          controls.target.set(0, 0, 0);
          break;
        }

        case 'Floating Ribbon Tilt & Swirl': {
          camera.position.x = 32 * Math.sin(t * 0.22);
          camera.position.y = 14 + 10 * Math.cos(t * 0.44);
          camera.position.z = 48 + 8 * Math.cos(t * 0.22);
          controls.target.set(0, 0, 0);
          break;
        }
      }
    }

    // --- PROCEDURAL CLICK-TO-RANDOMIZE SYSTEM ---
    function setupClickToRandomize() {
      let pointerDownX = 0;
      let pointerDownY = 0;
      let pointerDownTime = 0;

      window.addEventListener('pointerdown', (e) => {
        if (e.target !== canvas) return;
        pointerDownX = e.clientX;
        pointerDownY = e.clientY;
        pointerDownTime = performance.now();
      });

      window.addEventListener('pointerup', (e) => {
        if (e.target !== canvas) return;
        if (!params.clickToRandomize) return;

        const dist = Math.hypot(e.clientX - pointerDownX, e.clientY - pointerDownY);
        const duration = performance.now() - pointerDownTime;

        if (dist < 6 && duration < 320) {
          rerollProceduralVariation();
        }
      });
    }

    function rerollProceduralVariation() {
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      applyColorScheme(randomScheme, false);

      params.waveHeight = +(1.5 + Math.random() * 2.8).toFixed(2);
      params.waveFrequency = +(0.35 + Math.random() * 0.7).toFixed(2);
      params.ridgeSharpness = +(0.7 + Math.random() * 1.4).toFixed(2);
      params.windAngle = +(-0.9 + Math.random() * 1.8).toFixed(2);
      params.horizontalAnchor = +(0.5 + Math.random() * 0.5).toFixed(2);
      params.sheenStrength = +(1.0 + Math.random() * 1.5).toFixed(2);
      params.roughness = +(0.2 + Math.random() * 0.3).toFixed(2);
      params.metalness = +(0.1 + Math.random() * 0.3).toFixed(2);
      params.animationSpeed = +(0.7 + Math.random() * 0.8).toFixed(2);

      const randomAnim = ANIMATION_PRESETS[Math.floor(Math.random() * ANIMATION_PRESETS.length)];
      params.animation = randomAnim;

      if (gui) {
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      }
    }

        postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);

      colorFolder.addColor(params, 'fabricColor')
        .name('Fabric Color')
        .onChange(updateColors);

      colorFolder.addColor(params, 'sheenColor')
        .name('Sheen Highlight')
        .onChange(updateColors);

      colorFolder.addColor(params, 'shadowColor')
        .name('Fold Shadow')
        .onChange(updateColors);

      colorFolder.addColor(params, 'bgColor')
        .name('Background Color')
        .onChange(updateColors);

      colorFolder.add(params, 'greenscreen')
        .name('Greenscreen (#00ff00)')
        .onChange(updateColors);

      // 2. Fabric Physics & Ridges
      const fabricFolder = gui.addFolder('Fabric & Waves');
      fabricFolder.add(params, 'planeScale', 0.25, 4.0, 0.05).name('Plane Scale Multiplier');
      fabricFolder.add(params, 'waveHeight', 0.5, 6.0, 0.05).name('Wave Height');
      fabricFolder.add(params, 'waveFrequency', 0.1, 1.8, 0.02).name('Wave Frequency');
      fabricFolder.add(params, 'ridgeSharpness', 0.4, 2.5, 0.05).name('Ridge Sharpness');
      fabricFolder.add(params, 'windAngle', -Math.PI, Math.PI, 0.05).name('Wind Angle');
      fabricFolder.add(params, 'horizontalAnchor', 0.0, 1.0, 0.05).name('Horizontal Anchor');
      fabricFolder.add(params, 'sheenStrength', 0.1, 3.0, 0.05).name('Sheen Strength');
      fabricFolder.add(params, 'roughness', 0.05, 0.9, 0.01).name('Fabric Roughness');
      fabricFolder.add(params, 'metalness', 0.0, 0.8, 0.01).name('Fabric Lustre');

      // 3. Motion & Animations (8 Preconfigured animations)
      const motionFolder = gui.addFolder('Motion & Animations');
      motionFolder.add(params, 'animation', ANIMATION_PRESETS).name('Animation Mode');
      motionFolder.add(params, 'animationSpeed', 0.0, 3.0, 0.05).name('Animation Speed');

      // 4. Lighting & Rendering
      const renderFolder = gui.addFolder('Lighting & Rendering');
      renderFolder.add(params, 'exposure', 0.2, 3.0, 0.05)
        .name('Tone Exposure')
        .onChange(val => { renderer.toneMappingExposure = val; });

      renderFolder.add(params, 'lightIntensity', 0.1, 4.0, 0.05)
        .name('Light Intensity')
        .onChange(val => {
          ambientLight.intensity = 0.45 * val;
          dirLight1.intensity = 1.8 * val;
          dirLight2.intensity = 1.2 * val;
        });

      renderFolder.add(params, 'dpr', 0.5, 3.0, 0.1)
        .name('DPR (Pixel Ratio)')
        .onChange(val => {
          renderer.setPixelRatio(val);
          if (postProcessor) {
            postProcessor.setSize(window.innerWidth, window.innerHeight, val);
          }
        });

      renderFolder.add(params, 'antialias')
        .name('Antialias')
        .onChange(() => {
          createRenderer();
          setupControls();
          updateColors();
          if (postProcessor) {
            postProcessor.renderer = renderer;
            postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);
          }
        });

      // 5. Post-Processing Suite (PostProcessor.js)
      if (postProcessor) {
        postProcessor.attachGUI(gui, 'Post-Processing Suite');
      }

      // 6. Procedural Interaction
      const interactFolder = gui.addFolder('Interaction');
      interactFolder.add(params, 'clickToRandomize').name('Click Scene Randomizer');
      interactFolder.add({ reroll: rerollProceduralVariation }, 'reroll').name('Reroll Now (Click)');

      // Open primary folders by default
      colorFolder.open();
      motionFolder.open();
    }

    // --- RENDER LOOP ---
    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();

      updateSceneAnimation(delta);
      controls.update();

      if (postProcessor && postProcessor.settings.enabled) {
        postProcessor.renderScene(scene, camera);
      } else {
        renderer.render(scene, camera);
      }
    }

    // Start application
    init();
  </script>
</body>
</html>
