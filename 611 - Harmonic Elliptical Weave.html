    // ============================================================
    // Global Configuration & Settings
    // ============================================================
    const settings = {
      // Color & Style
      colorScheme: 'Palette 14: AA60C8, D69ADE, C9A3C6',
      fillTranslucency: 0.03,
      strokeWeight: 1.15,
      showOutlines: true,
      outlineWeight: 0.6,
      outlineOpacity: 0.25,

      // Geometry & SAT Packing
      candidateAttempts: 500,
      segmentModifier: 4.2,
      baseSizeMean: 100,
      baseSizeStd: 50,
      minSize: 30,
      aspectRatio: 1.618,
      noiseScale: 0.001,
      layoutMode: 'Full Viewport', // 'Full Viewport' or 'Classic 700x700'

      // Animation & Flow
      animationStyle: 'Flowing Currents', // 'Flowing Currents', 'Harmonic Breath', 'Loom Wave', 'Suspended Drift', 'Static Fine Art'
      animSpeed: 1.0,
      isPlaying: true,
      flowSpeed: 0.8,
      flowWobble: 0.45,
      pulseAmount: 0.06,
      driftAmount: 4.0,

      // Interactive UX
      randomizeOnClick: true,
      zoom: 1.0,
      panX: 0,
      panY: 0,

      // Action Handlers
      regenerate: () => initSimulation(),
      randomizeScene: () => randomizeAll(true),
      resetView: () => resetCamera(),
      saveImage: () => exportImage()
    };

    // Original constants preserved from source snippet
    const BASE_WIDTH = 700;
    const BASE_HEIGHT = 700;

    // Simulation Domain Dimensions
    let domainWidth = BASE_WIDTH;
    let domainHeight = BASE_HEIGHT;

    // Active Ellipse Array & Segment Modifier
    const ellipses = [];
    let segmentModifier = 4.0;

    // Color theme reference
    let currentTheme = COLOR_SCHEMES[settings.colorScheme];

    // Animation Clock
    let animClock = 0;

    // Camera Transform & Smooth Inertia Interpolation
    let targetPanX = 0, currentPanX = 0;
    let targetPanY = 0, currentPanY = 0;
    let targetZoom = 1.0, currentZoom = 1.0;

    // Pointer Interaction State
    let isPointerDown = false;
    let isDragging = false;
    let pointerStartX = 0, pointerStartY = 0;
    let lastPointerX = 0, lastPointerY = 0;
    let pointerStartTime = 0;

    // Touch gesture state for pinch-to-zoom
    let touchStartDist = 0;
    let touchStartZoom = 1.0;

    // GUI references
    let gui = null;
    let controllers = {};

    // ============================================================
    // MyEllipse Class (Preserving Original Algorithm & Math)
    // ============================================================
    class MyEllipse {
      constructor(x, y, w, h, angle, id = 0) {
        this.position = createVector(x, y);
        this.homePosition = createVector(x, y);
        this.w = w;
        this.h = h;
        this.n = noise(this.position.x * settings.noiseScale, this.position.y * settings.noiseScale);
        this.angle = angle;
        this.segments = round((w + h) / segmentModifier);
        this.id = id;
        this.phase = (x * 0.013 + y * 0.019) % TWO_PI;

        // Bounding radius for high-efficiency rejection before SAT
        this.maxRadius = max(w, h) * 0.6;
        this.minRadius = min(w, h) * 0.4;

        // Visual Palette Assignment
        const numStrokes = currentTheme.strokes.length;
        this.strokeColor = currentTheme.strokes[id % numStrokes];
        this.accentColor = currentTheme.accent;
      }

      // Draw method with full animation and thread weaving support
      draw(t = 0) {
        // Dynamic animation modulation
        let effectiveW = this.w;
        let effectiveH = this.h;
        let currentPos = this.position;

        // 1. Organic Breathing Pulse
        if (settings.animationStyle === 'Harmonic Breath' || settings.animationStyle === 'Loom Wave') {
          let breath = 1.0 + Math.sin(t * 2.2 * settings.animSpeed + this.phase) * settings.pulseAmount;
          effectiveW *= breath;
          effectiveH *= breath;
        }

        // 2. Micro-current Drift
        if (settings.animationStyle === 'Suspended Drift' || settings.animationStyle === 'Harmonic Breath') {
          let driftX = Math.sin(t * 0.9 * settings.animSpeed + this.phase) * settings.driftAmount;
          let driftY = Math.cos(t * 0.7 * settings.animSpeed + this.phase * 1.3) * settings.driftAmount;
          currentPos = p5.Vector.add(this.homePosition, createVector(driftX, driftY));
        } else {
          currentPos = this.homePosition;
        }

        // 3. Dynamic Flow Field Vector
        let flowAngle = this.n * TAU;
        if (settings.animationStyle === 'Flowing Currents' || settings.animationStyle === 'Harmonic Breath' || settings.animationStyle === 'Loom Wave') {
          let dynamicNoise = noise(
            this.position.x * settings.noiseScale,
            this.position.y * settings.noiseScale,
            t * 0.15 * settings.flowSpeed
          );
          flowAngle = dynamicNoise * TAU + Math.sin(t * 1.2 * settings.flowSpeed + this.phase) * settings.flowWobble;
        }

        const vertices = this.getVertices(currentPos, effectiveW, effectiveH);
        const v = createVector(1, 0).rotate(flowAngle);

        // Exact sorting formula preserved from original snippet
        const refOffset = domainWidth * 100;
        vertices.sort(function (a, b) {
          const projectionA = getProjection(a.copy().add(refOffset, refOffset), v);
          const projectionB = getProjection(b.copy().add(refOffset, refOffset), v);
          return projectionA.mag() - projectionB.mag();
        });

        // 4. Subtle Ambient Fill (if enabled)
        if (settings.fillTranslucency > 0) {
          push();
          noStroke();
          let fColor = color(currentTheme.accent);
          fColor.setAlpha(255 * settings.fillTranslucency);
          fill(fColor);
          beginShape();
          for (let pt of vertices) {
            vertex(pt.x, pt.y);
          }
          endShape(CLOSE);
          pop();
        }

        // 5. Perimeter Outline (Optional crisp architectural definition)
        if (settings.showOutlines) {
          push();
          noFill();
          let outColor = color(this.strokeColor);
          outColor.setAlpha(255 * settings.outlineOpacity);
          stroke(outColor);
          strokeWeight(settings.outlineWeight);
          this.drawPerimeter(currentPos, effectiveW, effectiveH);
          pop();
        }

        // 6. Draw the Internal Woven String-Art Ribbons
        noFill();
        stroke(this.strokeColor);
        strokeWeight(settings.strokeWeight);

        if (settings.animationStyle === 'Loom Wave') {
          // Traveling light energy wave through the thread
          let wavePhase = (t * 2.0 * settings.animSpeed + this.phase) % 1.0;
          let highlightIdx = Math.floor(wavePhase * vertices.length);

          beginShape();
          for (let i = 0; i < vertices.length; i++) {
            let pt = vertices[i];
            vertex(pt.x, pt.y);
          }
          endShape();

          // Traveling pulse marker
          if (vertices[highlightIdx]) {
            push();
            noStroke();
            let hlColor = color(currentTheme.accent);
            hlColor.setAlpha(200);
            fill(hlColor);
            let pth = vertices[highlightIdx];
            circle(pth.x, pth.y, settings.strokeWeight * 2.8);
            pop();
          }
        } else {
          // Continuous smooth woven shape
          beginShape();
          for (let pt of vertices) {
            vertex(pt.x, pt.y);
          }
          endShape();
        }
      }

      // Smooth perimeter boundary loop
      drawPerimeter(pos, w, h) {
        beginShape();
        const detail = Math.max(24, this.segments);
        for (let i = 0; i <= detail; i++) {
          let t = (i / detail) * TWO_PI;
          let px = (w / 2) * cos(t);
          let py = (h / 2) * sin(t);
          let rotatedX = px * cos(this.angle) - py * sin(this.angle);
          let rotatedY = px * sin(this.angle) + py * cos(this.angle);
          vertex(pos.x + rotatedX, pos.y + rotatedY);
        }
        endShape();
      }

      // Preserved exact getVertices math
      getVertices(customPos = null, customW = null, customH = null) {
        let vertices = [];
        let pos = customPos || this.position;
        let w = customW !== null ? customW : this.w;
        let h = customH !== null ? customH : this.h;
        let segs = this.segments;

        for (let i = 0; i < segs; i++) {
          let t = (i / segs) * TWO_PI;

          let px = (w / 2) * cos(t);
          let py = (h / 2) * sin(t);

          let rotatedX = px * cos(this.angle) - py * sin(this.angle);
          let rotatedY = px * sin(this.angle) + py * cos(this.angle);

          vertices.push(
            createVector(
              pos.x + rotatedX,
              pos.y + rotatedY
            )
          );
        }
        return vertices;
      }

      // Preserved exact getAxes math
      getAxes(vertices) {
        let axes = [];
        for (let i = 0; i < vertices.length; i++) {
          let p1 = vertices[i];
          let p2 = vertices[(i + 1) % vertices.length];

          let edge = p5.Vector.sub(p2, p1);

          let n = createVector(-edge.y, edge.x);
          n.normalize();

          axes.push(n);
        }
        return axes;
      }

      // Preserved exact projectOntoAxis math
      projectOntoAxis(axis, vertices) {
        let minAxis = Infinity;
        let maxAxis = -Infinity;

        for (let v of vertices) {
          let projection = v.dot(axis);
          minAxis = Math.min(minAxis, projection);
          maxAxis = Math.max(maxAxis, projection);
        }

        return {
          minAxis,
          maxAxis
        };
      }

      // Preserved exact projectionsOverlap math
      projectionsOverlap(proj1, proj2) {
        return !(proj1.maxAxis < proj2.minAxis || proj2.maxAxis < proj1.minAxis);
      }

      // SAT (Separating Axis Theorem) collision detection
      isCollision(anotherEllipse) {
        // High-efficiency radial distance pre-check:
        // If bounding circles do not intersect, polygon SAT collision is strictly impossible
        let dx = this.position.x - anotherEllipse.position.x;
        let dy = this.position.y - anotherEllipse.position.y;
        let maxRadiusSum = this.maxRadius + anotherEllipse.maxRadius;
        if (dx * dx + dy * dy > maxRadiusSum * maxRadiusSum) {
          return false;
        }

        // Full SAT Algorithm on Ellipse Vertices
        let verticesA = this.getVertices();
        let verticesB = anotherEllipse.getVertices();

        let axesA = this.getAxes(verticesA);
        let axesB = this.getAxes(verticesB);
        let allAxes = axesA.concat(axesB);

        for (let axis of allAxes) {
          let projA = this.projectOntoAxis(axis, verticesA);
          let projB = this.projectOntoAxis(axis, verticesB);
          if (!this.projectionsOverlap(projA, projB)) {
            return false;
          }
        }

        return true;
      }
    }

    // Preserved exact getProjection function
    function getProjection(v1, v2) {
      return v2.copy().mult(p5.Vector.dot(v1, v2) / v2.mag() * v2.mag());
    }

    // Preserved exact sleep function
    function sleep(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    // ============================================================
    // Generative Simulation Initializer
    // ============================================================
    function initSimulation() {
      ellipses.length = 0;

      // Update current theme reference
      currentTheme = COLOR_SCHEMES[settings.colorScheme] || COLOR_SCHEMES['Original'];

      // Configure simulation domain based on layout mode
      if (settings.layoutMode === 'Full Viewport') {
        domainWidth = Math.max(600, windowWidth);
        domainHeight = Math.max(600, windowHeight);
      } else {
        domainWidth = BASE_WIDTH;
        domainHeight = BASE_HEIGHT;
      }

      // Compute number of candidate attempts proportional to area
      let areaRatio = (domainWidth * domainHeight) / (BASE_WIDTH * BASE_HEIGHT);
      let targetAttempts = Math.round(settings.candidateAttempts * (settings.layoutMode === 'Full Viewport' ? Math.max(1, areaRatio * 0.85) : 1.0));

      segmentModifier = settings.segmentModifier;

      // SAT Collision-Packed Generation
      let ellipseIdCounter = 0;
      for (let i = 0; i < targetAttempts; i++) {
        let x = random(domainWidth);
        let y = random(domainHeight);
        let baseSize = max(randomGaussian(settings.baseSizeMean, settings.baseSizeStd), settings.minSize);
        let w = baseSize;
        let h = baseSize * settings.aspectRatio;
        let angle = random(TAU);

        let myEllipse = new MyEllipse(x, y, w, h, angle, ellipseIdCounter);

        let collisionChecked = true;
        for (let e of ellipses) {
          if (myEllipse.isCollision(e)) {
            collisionChecked = false;
            break;
          }
        }
        if (collisionChecked) {
          ellipses.push(myEllipse);
          ellipseIdCounter++;
        }
      }

      // Update document body background color
      document.body.style.backgroundColor = currentTheme.bg;
    }

    // ============================================================
    // p5.js Setup & Draw Lifecycle
    // ============================================================
    function setup() {
      const canvas = createCanvas(windowWidth, windowHeight);
      canvas.parent('canvas-container');

      pixelDensity(Math.min(window.devicePixelRatio || 1, 2));

      // Initialize Simulation
      initSimulation();

      // Initialize lil-gui interactive controls
      initGUI();

      // Attach event listeners for zoom, drag and click
      setupEventListeners();
    }

    function draw() {
      // Background with current palette theme
      background(currentTheme.bg);

      // Smooth inertia interpolation for Pan & Zoom
      currentPanX = lerp(currentPanX, targetPanX, 0.15);
      currentPanY = lerp(currentPanY, targetPanY, 0.15);
      currentZoom = lerp(currentZoom, targetZoom, 0.15);

      // Advance animation clock
      if (settings.isPlaying) {
        animClock += (deltaTime / 1000) * settings.animSpeed;
      }

      // Center the simulation domain in the viewport with Pan & Zoom transforms
      push();
      translate(width / 2 + currentPanX, height / 2 + currentPanY);
      scale(currentZoom);
      translate(-domainWidth / 2, -domainHeight / 2);

      // Framed canvas shadow & boundary (if in Classic 700x700 mode)
      if (settings.layoutMode === 'Classic 700x700') {
        push();
        noFill();
        stroke(currentTheme.isDark ? 'rgba(255, 255, 255, 0.12)' : 'rgba(0, 0, 0, 0.10)');
        strokeWeight(1 / currentZoom);
        rect(0, 0, domainWidth, domainHeight);
        pop();
      }

      // Render each packed ellipse with woven chord threads
      for (let e of ellipses) {
        e.draw(animClock);
      }

      pop();
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
      if (settings.layoutMode === 'Full Viewport') {
        initSimulation();
      }
    }

    // ============================================================
    // Camera Reset & View Handling
    // ============================================================
    function resetCamera() {
      targetPanX = 0;
      targetPanY = 0;
      targetZoom = 1.0;
      settings.panX = 0;
      settings.panY = 0;
      settings.zoom = 1.0;
      if (controllers.zoom) controllers.zoom.updateDisplay();
      if (controllers.panX) controllers.panX.updateDisplay();
      if (controllers.panY) controllers.panY.updateDisplay();
    }

    // ============================================================
    // Export High-Res Artwork
    // ============================================================
    function exportImage() {
      const cleanTheme = settings.colorScheme.replace(/[^a-zA-Z0-9]/g, '_').toLowerCase();
      saveCanvas(`elliptical_weave_${cleanTheme}_${Date.now()}`, 'png');
    }

    // ============================================================
    // Procedural Randomization (Theme & Geometry)
    // ============================================================
    function randomizeAll(regenerate = true) {
      // 1. Pick a random color scheme from the 19 curated palettes
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const randomScheme = random(schemeKeys);
      settings.colorScheme = randomScheme;

      // 2. Randomize geometric parameters
      settings.segmentModifier = random(2.8, 6.0);
      settings.baseSizeMean = random(75, 125);
      settings.baseSizeStd = random(30, 60);
      settings.aspectRatio = random(1.3, 2.1);
      settings.noiseScale = random(0.0006, 0.0025);
      settings.strokeWeight = random(0.85, 1.8);
      settings.showOutlines = random() > 0.3;

      // 3. Randomize animation & motion
      const animStyles = ['Flowing Currents', 'Harmonic Breath', 'Loom Wave', 'Suspended Drift'];
      settings.animationStyle = random(animStyles);
      settings.animSpeed = random(0.65, 1.6);
      settings.flowSpeed = random(0.5, 1.4);
      settings.flowWobble = random(0.2, 0.8);
      settings.pulseAmount = random(0.03, 0.09);

      // 4. Update all lil-gui controller displays
      if (gui) {
        if (typeof gui.controllersRecursive === 'function') {
          gui.controllersRecursive().forEach(ctrl => ctrl.updateDisplay());
        } else {
          for (let key in controllers) {
            if (controllers[key] && controllers[key].updateDisplay) {
              controllers[key].updateDisplay();
            }
          }
        }
      }

      // 5. Rebuild simulation
      if (regenerate) {
        initSimulation();
      }
    }

    // ============================================================
    // Interactive User Controls: Wheel Zoom, Drag & Click Randomize
    // ============================================================
    function setupEventListeners() {
      // Wheel Zoom with Focal Point Invariance (zooms into cursor location)
      window.addEventListener('wheel', (e) => {
        if (e.target && e.target.closest && e.target.closest('.lil-gui')) return;
        e.preventDefault();

        const zoomFactor = e.deltaY < 0 ? 1.09 : 0.91;
        const newZoom = constrain(targetZoom * zoomFactor, 0.2, 8.0);
        
        const mouseX = e.clientX;
        const mouseY = e.clientY;
        const worldX = (mouseX - (width / 2 + targetPanX)) / targetZoom;
        const worldY = (mouseY - (height / 2 + targetPanY)) / targetZoom;

        targetZoom = newZoom;
        targetPanX = mouseX - width / 2 - worldX * targetZoom;
        targetPanY = mouseY - height / 2 - worldY * targetZoom;

        settings.zoom = targetZoom;
        settings.panX = targetPanX;
        settings.panY = targetPanY;

        if (controllers.zoom) controllers.zoom.updateDisplay();
        if (controllers.panX) controllers.panX.updateDisplay();
        if (controllers.panY) controllers.panY.updateDisplay();
      }, { passive: false });

      // Touch Support for Mobile / Tablet Pinch-to-Zoom
      window.addEventListener('touchstart', (e) => {
        if (e.target && e.target.closest && e.target.closest('.lil-gui')) return;
        if (e.touches.length === 2) {
          touchStartDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          touchStartZoom = targetZoom;
        }
      }, { passive: true });

      window.addEventListener('touchmove', (e) => {
        if (e.target && e.target.closest && e.target.closest('.lil-gui')) return;
        if (e.touches.length === 2 && touchStartDist > 0) {
          const dist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          const factor = dist / touchStartDist;
          targetZoom = constrain(touchStartZoom * factor, 0.2, 8.0);
          settings.zoom = targetZoom;
          if (controllers.zoom) controllers.zoom.updateDisplay();
        }
      }, { passive: true });

      // Pointer Down
      window.addEventListener('pointerdown', (e) => {
        if (e.target && e.target.closest && e.target.closest('.lil-gui')) return;

        isPointerDown = true;
        isDragging = false;
        pointerStartX = e.clientX;
        pointerStartY = e.clientY;
        lastPointerX = e.clientX;
        lastPointerY = e.clientY;
        pointerStartTime = performance.now();
      });

      // Pointer Move (Drag Object across Screen)
      window.addEventListener('pointermove', (e) => {
        if (!isPointerDown) return;

        const dx = e.clientX - lastPointerX;
        const dy = e.clientY - lastPointerY;
        lastPointerX = e.clientX;
        lastPointerY = e.clientY;

        const totalDist = Math.hypot(e.clientX - pointerStartX, e.clientY - pointerStartY);
        if (totalDist > 5) {
          isDragging = true;
          document.body.classList.add('grabbing');
        }

        if (isDragging) {
          targetPanX += dx;
          targetPanY += dy;
          settings.panX = targetPanX;
          settings.panY = targetPanY;
          if (controllers.panX) controllers.panX.updateDisplay();
          if (controllers.panY) controllers.panY.updateDisplay();
        }
      });

      // Pointer Up (Click Detection & Randomize)
      window.addEventListener('pointerup', (e) => {
        if (e.target && e.target.closest && e.target.closest('.lil-gui')) {
          isPointerDown = false;
          return;
        }

        document.body.classList.remove('grabbing');
        const clickDuration = performance.now() - pointerStartTime;
        const totalDist = Math.hypot(e.clientX - pointerStartX, e.clientY - pointerStartY);

        // Click on scene (without drag): randomly generate new visual theme and parameters
        if (!isDragging && totalDist < 6 && clickDuration < 380) {
          if (settings.randomizeOnClick) {
            randomizeAll(true);
          }
        }

        isPointerDown = false;
        isDragging = false;
      });

      // Keyboard Shortcuts (Spacebar to reseed/randomize)
      window.addEventListener('keydown', (e) => {
        if (e.target && e.target.tagName === 'INPUT') return;

        if (e.code === 'Space') {
          e.preventDefault();
          if (settings.randomizeOnClick) {
            randomizeAll(true);
          } else {
            initSimulation();
          }
        } else if (e.key === 'r' || e.key === 'R') {
          resetCamera();
        } else if (e.key === 'p' || e.key === 'P') {
          settings.isPlaying = !settings.isPlaying;
          if (controllers.isPlaying) controllers.isPlaying.updateDisplay();
        }
      });
    }

    // ============================================================
    // lil-gui Interactive Controls Setup
    // ============================================================
    function initGUI() {
      gui = new lil.GUI({ title: 'Harmonic Elliptical Weave' });

      // 1. Color & Palette Folder (All 19 Schemes)
      const fColor = gui.addFolder('🎨 Color & Palette');
      controllers.colorScheme = fColor.add(settings, 'colorScheme', Object.keys(COLOR_SCHEMES))
        .name('Palette')
        .onChange((val) => {
          currentTheme = COLOR_SCHEMES[val];
          document.body.style.backgroundColor = currentTheme.bg;
          // Reassign strokes to ellipses
          for (let e of ellipses) {
            e.strokeColor = currentTheme.strokes[e.id % currentTheme.strokes.length];
            e.accentColor = currentTheme.accent;
          }
        });

      controllers.fillTranslucency = fColor.add(settings, 'fillTranslucency', 0, 0.2, 0.005).name('Fill Tint');
      controllers.strokeWeight = fColor.add(settings, 'strokeWeight', 0.5, 3.5, 0.05).name('Line Weight');
      controllers.showOutlines = fColor.add(settings, 'showOutlines').name('Show Outlines');
      controllers.outlineOpacity = fColor.add(settings, 'outlineOpacity', 0.05, 0.8, 0.02).name('Outline Alpha');

      // 2. Animation & Flow Folder
      const fAnim = gui.addFolder('🌀 Animation & Motion');
      controllers.animationStyle = fAnim.add(settings, 'animationStyle', [
        'Flowing Currents',
        'Harmonic Breath',
        'Loom Wave',
        'Suspended Drift',
        'Static Fine Art'
      ]).name('Anim Style');

      controllers.animSpeed = fAnim.add(settings, 'animSpeed', 0.0, 3.0, 0.05).name('Anim Speed');
      controllers.isPlaying = fAnim.add(settings, 'isPlaying').name('Playing');
      controllers.flowSpeed = fAnim.add(settings, 'flowSpeed', 0.1, 2.5, 0.05).name('Flow Speed');
      controllers.flowWobble = fAnim.add(settings, 'flowWobble', 0.0, 1.5, 0.02).name('Flow Wobble');
      controllers.pulseAmount = fAnim.add(settings, 'pulseAmount', 0.0, 0.2, 0.005).name('Pulse Depth');
      controllers.driftAmount = fAnim.add(settings, 'driftAmount', 0.0, 15.0, 0.2).name('Drift Range');

      // 3. Geometry & Packing Folder
      const fGeom = gui.addFolder('📐 Geometry & SAT Packing');
      controllers.layoutMode = fGeom.add(settings, 'layoutMode', ['Full Viewport', 'Classic 700x700'])
        .name('Layout Mode')
        .onChange(() => initSimulation());

      controllers.candidateAttempts = fGeom.add(settings, 'candidateAttempts', 100, 1200, 25)
        .name('Candidates')
        .onChange(() => initSimulation());

      controllers.segmentModifier = fGeom.add(settings, 'segmentModifier', 1.8, 8.0, 0.1)
        .name('Segment Mod')
        .onChange(() => initSimulation());

      controllers.baseSizeMean = fGeom.add(settings, 'baseSizeMean', 40, 200, 5)
        .name('Mean Size')
        .onChange(() => initSimulation());

      controllers.baseSizeStd = fGeom.add(settings, 'baseSizeStd', 10, 100, 2)
        .name('Size Variance')
        .onChange(() => initSimulation());

      controllers.aspectRatio = fGeom.add(settings, 'aspectRatio', 1.0, 3.0, 0.05)
        .name('Aspect Ratio')
        .onChange(() => initSimulation());

      controllers.noiseScale = fGeom.add(settings, 'noiseScale', 0.0002, 0.005, 0.0001)
        .name('Noise Scale')
        .onChange(() => {
          for (let e of ellipses) {
            e.n = noise(e.position.x * settings.noiseScale, e.position.y * settings.noiseScale);
          }
        });

      // 4. Viewport & Camera Interaction Folder
      const fView = gui.addFolder('🎥 Viewport & Camera');
      controllers.randomizeOnClick = fView.add(settings, 'randomizeOnClick').name('Click to Randomize');
      controllers.zoom = fView.add(settings, 'zoom', 0.2, 8.0, 0.05)
        .name('Zoom Level')
        .onChange((v) => { targetZoom = v; });
      controllers.panX = fView.add(settings, 'panX', -2000, 2000, 1)
        .name('Pan X')
        .onChange((v) => { targetPanX = v; });
      controllers.panY = fView.add(settings, 'panY', -2000, 2000, 1)
        .name('Pan Y')
        .onChange((v) => { targetPanY = v; });
      fView.add(settings, 'resetView').name('Reset View');

      // 5. Actions Folder
      const fActions = gui.addFolder('⚡ Actions');
      fActions.add(settings, 'regenerate').name('Regenerate');
      fActions.add(settings, 'randomizeScene').name('Randomize All');
      fActions.add(settings, 'saveImage').name('Export PNG');

      // Default folder states
      fColor.open();
      fAnim.open();
      fGeom.close();
      fView.close();
      fActions.open();
    }
  </script>
