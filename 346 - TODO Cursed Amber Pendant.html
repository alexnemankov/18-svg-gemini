    // --- TEARDROP RADIUS PROFILE FUNCTION ---
    // Smooth convex teardrop cabochon profile
    function getAmberRadius(y) {
      const yMin = -2.2, yMax = 2.0;
      if (y <= yMin || y >= yMax) return 0.001;
      const u = (y - yMin) / (yMax - yMin); // 0 to 1
      if (u < 0.38) {
        // Bulbous rounded convex bottom dome
        const p = u / 0.38;
        return 1.74 * Math.sin(p * Math.PI * 0.5);
      } else {
        // Smooth organic taper upwards into the neck
        const s = (u - 0.38) / 0.62;
        return 0.44 + (1.74 - 0.44) * Math.pow(1.0 - s, 1.45);
      }
    }

    // --- PROCEDURAL WING TEXTURE GENERATION ---
    function createWingTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Translucent iridescent wing membrane
      const grad = ctx.createLinearGradient(100, 100, 450, 950);
      grad.addColorStop(0, 'rgba(255, 255, 255, 0.6)');
      grad.addColorStop(0.4, 'rgba(235, 245, 255, 0.35)');
      grad.addColorStop(1, 'rgba(220, 200, 160, 0.2)');
      ctx.fillStyle = grad;

      ctx.beginPath();
      ctx.moveTo(256, 50);
      ctx.bezierCurveTo(420, 150, 490, 500, 420, 800);
      ctx.bezierCurveTo(360, 950, 280, 990, 256, 1000);
      ctx.bezierCurveTo(220, 980, 150, 850, 130, 650);
      ctx.bezierCurveTo(110, 450, 160, 150, 256, 50);
      ctx.fill();

      // Wing venation
      ctx.lineWidth = 4.5;
      ctx.strokeStyle = 'rgba(35, 20, 5, 0.95)';
      ctx.beginPath();
      ctx.moveTo(256, 50);
      ctx.bezierCurveTo(420, 150, 490, 500, 420, 800);
      ctx.stroke();

      ctx.lineWidth = 3.0;
      const branches = [
        [[256, 50], [350, 300], [450, 600]],
        [[256, 50], [300, 400], [380, 850]],
        [[256, 50], [256, 500], [300, 940]],
        [[256, 50], [220, 450], [240, 970]],
        [[256, 50], [180, 400], [170, 750]]
      ];

      branches.forEach(pts => {
        ctx.beginPath();
        ctx.moveTo(pts[0][0], pts[0][1]);
        ctx.quadraticCurveTo(pts[1][0], pts[1][1], pts[2][0], pts[2][1]);
        ctx.stroke();
      });

      // Micro cross-veins
      ctx.lineWidth = 1.4;
      ctx.strokeStyle = 'rgba(50, 30, 10, 0.7)';
      for (let y = 150; y < 900; y += 30) {
        ctx.beginPath();
        const startX = 200 + Math.sin(y * 0.02) * 50;
        const endX = 350 + Math.cos(y * 0.03) * 60;
        ctx.moveTo(startX, y);
        ctx.lineTo(endX, y + 15);
        ctx.stroke();
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.ClampToEdgeWrapping;
      texture.wrapT = THREE.ClampToEdgeWrapping;
      return texture;
    }

    // --- PROCEDURAL CAUSTIC GROUND ---
    function buildCausticGround() {
      const geo = new THREE.PlaneGeometry(18, 18, 64, 64);
      geo.rotateX(-Math.PI / 2);

      const causticUniforms = {
        uTime: { value: 0 },
        uColor: { value: new THREE.Color(params.attenuationColor) },
        uIntensity: { value: 0.9 }
      };

      causticMaterial = new THREE.ShaderMaterial({
        uniforms: causticUniforms,
        vertexShader: `
          varying vec2 vUv;
          varying vec3 vWorldPos;
          void main() {
            vUv = uv;
            vec4 wp = modelMatrix * vec4(position, 1.0);
            vWorldPos = wp.xyz;
            gl_Position = projectionMatrix * viewMatrix * wp;
          }
        `,
        fragmentShader: `
          uniform float uTime;
          uniform vec3 uColor;
          uniform float uIntensity;
          varying vec2 vUv;
          varying vec3 vWorldPos;

          void main() {
            vec2 p = (vUv - 0.5) * 14.0;
            float dist = length(vWorldPos.xz);
            float falloff = smoothstep(6.5, 0.5, dist);

            float t = uTime * 0.85;
            vec2 c1 = p + vec2(sin(p.y * 1.3 + t), cos(p.x * 1.3 - t * 0.8)) * 0.5;
            vec2 c2 = p + vec2(cos(p.y * 1.7 - t * 1.1), sin(p.x * 1.5 + t * 0.9)) * 0.5;

            float caustic1 = pow(abs(sin(c1.x * 2.0) * cos(c1.y * 2.0)), 3.0);
            float caustic2 = pow(abs(sin(c2.x * 2.5) * cos(c2.y * 2.5)), 3.0);
            float caustics = (caustic1 + caustic2 * 1.2) * falloff * uIntensity;

            float centerGlow = exp(-dist * 1.6) * 2.0;
            caustics += centerGlow * falloff * 0.65;

            vec3 finalCol = mix(vec3(0.01, 0.005, 0.02), uColor * 1.6, caustics);
            gl_FragColor = vec4(finalCol, falloff * 0.9);
          }
        `,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });

      causticGroundMesh = new THREE.Mesh(geo, causticMaterial);
      causticGroundMesh.position.y = -3.2;
      scene.add(causticGroundMesh);
    }

    // --- TEARDROP PENDANT & ORNATE CLASP ---
    function buildPendant() {
      pendantGroup = new THREE.Group();
      scene.add(pendantGroup);

      // Smooth Lathe profile calculated from mathematical teardrop curvature
      const points = [];
      const segs = 120;
      for (let i = 0; i <= segs; i++) {
        const t = i / segs;
        const y = -2.2 + t * 4.2; // -2.2 to +2.0
        const r = getAmberRadius(y);
        points.push(new THREE.Vector2(r, y));
      }

      const teardropGeo = new THREE.LatheGeometry(points, 84);
      teardropGeo.computeVertexNormals();

      // Crystal-clear translucent amber shell with high physical transmission
      const amberMat = new THREE.MeshPhysicalMaterial({
        color: new THREE.Color(params.amberColor),
        emissive: new THREE.Color(params.coreGlowColor),
        emissiveIntensity: params.amberGlowIntensity * 0.45,
        roughness: 0.04,
        metalness: 0.0,
        transmission: 0.95,
        ior: 1.54, // Genuine fossil amber index of refraction
        thickness: 2.8,
        attenuationColor: new THREE.Color(params.attenuationColor),
        attenuationDistance: 3.2,
        specularIntensity: 1.2,
        specularColor: new THREE.Color(0xffffff),
        clearcoat: 1.0,
        clearcoatRoughness: 0.02,
        transparent: true,
        opacity: 1.0,
        depthWrite: true,
        side: THREE.FrontSide
      });

      amberMesh = new THREE.Mesh(teardropGeo, amberMat);
      amberMesh.renderOrder = 10;
      amberMesh.castShadow = true;
      amberMesh.receiveShadow = true;
      pendantGroup.add(amberMesh);

      // Radiant Fresnel Glow Halo Mesh (radiates soft ethereal bloom around the amber boundaries)
      const haloPoints = points.map(pt => new THREE.Vector2(pt.x * 1.03, pt.y * 1.015));
      const haloGeo = new THREE.LatheGeometry(haloPoints, 64);
      haloGeo.computeVertexNormals();

      haloMaterial = new THREE.ShaderMaterial({
        uniforms: {
          uGlowColor: { value: new THREE.Color(params.coreGlowColor) },
          uGlowIntensity: { value: params.amberGlowIntensity },
          uPower: { value: 2.2 }
        },
        vertexShader: `
          varying vec3 vNormal;
          varying vec3 vViewDir;
          void main() {
            vNormal = normalize(normalMatrix * normal);
            vec4 worldPos = modelMatrix * vec4(position, 1.0);
            vViewDir = normalize(cameraPosition - worldPos.xyz);
            gl_Position = projectionMatrix * viewMatrix * worldPos;
          }
        `,
        fragmentShader: `
          uniform vec3 uGlowColor;
          uniform float uGlowIntensity;
          uniform float uPower;
          varying vec3 vNormal;
          varying vec3 vViewDir;
          void main() {
            float rim = 1.0 - max(dot(vNormal, vViewDir), 0.0);
            float glow = pow(rim, uPower) * uGlowIntensity;
            gl_FragColor = vec4(uGlowColor * 1.5, glow * 0.75);
          }
        `,
        transparent: true,
        blending: THREE.AdditiveBlending,
        side: THREE.BackSide,
        depthWrite: false
      });

      haloMesh = new THREE.Mesh(haloGeo, haloMaterial);
      haloMesh.renderOrder = 12;
      pendantGroup.add(haloMesh);

      // Soft internal volumetric scattering core (additive glow, does not obscure contents)
      const innerPoints = points.map(pt => new THREE.Vector2(pt.x * 0.84, pt.y * 0.84));
      const innerGeo = new THREE.LatheGeometry(innerPoints, 48);
      innerGeo.computeVertexNormals();

      const innerMat = new THREE.MeshBasicMaterial({
        color: new THREE.Color(params.coreGlowColor),
        transparent: true,
        opacity: params.innerCoreGlowIntensity * 0.22,
        blending: THREE.AdditiveBlending,
        side: THREE.BackSide,
        depthWrite: false
      });

      innerScatteringMesh = new THREE.Mesh(innerGeo, innerMat);
      innerScatteringMesh.renderOrder = 2;
      pendantGroup.add(innerScatteringMesh);

      // Ornate Cursed Antique Clasp Collar at Top
      claspGroup = new THREE.Group();
      claspGroup.position.set(0, 2.05, 0);
      pendantGroup.add(claspGroup);

      const metalMat = new THREE.MeshStandardMaterial({
        color: new THREE.Color(params.metalColor),
        metalness: 0.9,
        roughness: 0.32
      });

      // Filigree Collar
      const collarGeo = new THREE.CylinderGeometry(0.44, 0.50, 0.42, 32);
      const collarMesh = new THREE.Mesh(collarGeo, metalMat);
      claspGroup.add(collarMesh);

      // Claws gripping the amber
      for (let i = 0; i < 4; i++) {
        const clawAngle = (i / 4) * Math.PI * 2;
        const clawGeo = new THREE.ConeGeometry(0.075, 0.45, 12);
        clawGeo.rotateX(Math.PI);
        const clawMesh = new THREE.Mesh(clawGeo, metalMat);
        clawMesh.position.set(Math.cos(clawAngle) * 0.46, -0.20, Math.sin(clawAngle) * 0.46);
        clawMesh.rotation.y = -clawAngle;
        clawMesh.rotation.z = 0.26;
        claspGroup.add(clawMesh);
      }

      // Suspension Bail Loop
      const bailGeo = new THREE.TorusGeometry(0.26, 0.06, 16, 32);
      const bailMesh = new THREE.Mesh(bailGeo, metalMat);
      bailMesh.position.y = 0.42;
      claspGroup.add(bailMesh);

      // Hanging Chain segments
      chainGroup = new THREE.Group();
      claspGroup.add(chainGroup);
      for (let i = 0; i < 4; i++) {
        const linkGeo = new THREE.TorusGeometry(0.16, 0.042, 12, 24);
        const linkMesh = new THREE.Mesh(linkGeo, metalMat);
        linkMesh.position.y = 0.70 + i * 0.24;
        if (i % 2 === 1) linkMesh.rotation.y = Math.PI / 2;
        chainGroup.add(linkMesh);
      }
    }

    // --- PREHISTORIC MOSQUITO SKELETAL RIGGING (COMPACT ENCASED POSE) ---
    function buildMosquito() {
      mosquitoGroup = new THREE.Group();
      // Centered right in the deep optical core of the amber teardrop
      mosquitoGroup.position.set(0, -0.38, 0);
      mosquitoGroup.scale.set(0.95, 0.95, 0.95);
      mosquitoGroup.renderOrder = 1;
      pendantGroup.add(mosquitoGroup);

      const chitinMat = new THREE.MeshStandardMaterial({
        color: new THREE.Color(params.mosquitoColor),
        roughness: 0.28,
        metalness: 0.25
      });

      const eyeMat = new THREE.MeshStandardMaterial({
        color: 0x050505,
        roughness: 0.08,
        metalness: 0.85
      });

      const bloodMat = new THREE.MeshStandardMaterial({
        color: new THREE.Color(params.bloodAccentColor),
        emissive: new THREE.Color(params.bloodAccentColor),
        emissiveIntensity: 1.1,
        roughness: 0.2,
        metalness: 0.1,
        transparent: true,
        opacity: 0.95
      });

      // --- THORAX (Root Bone) ---
      const thoraxBone = new THREE.Bone();
      thoraxBone.name = "ThoraxRoot";
      thoraxBone.position.set(0, 0, 0);
      mosquitoGroup.add(thoraxBone);
      allMosquitoBones.push(thoraxBone);

      const thoraxGeo = new THREE.SphereGeometry(0.18, 18, 14);
      thoraxGeo.scale(0.85, 1.25, 1.4);
      const thoraxMesh = new THREE.Mesh(thoraxGeo, chitinMat);
      thoraxMesh.rotation.x = -0.3;
      thoraxBone.add(thoraxMesh);

      // --- HEAD & SENSORY STRUCTURES ---
      const headBone = new THREE.Bone();
      headBone.name = "Head";
      headBone.position.set(0, 0.16, 0.24);
      thoraxBone.add(headBone);
      allMosquitoBones.push(headBone);

      const headGeo = new THREE.SphereGeometry(0.11, 16, 12);
      headGeo.scale(0.9, 0.95, 1.15);
      const headMesh = new THREE.Mesh(headGeo, chitinMat);
      headBone.add(headMesh);

      // Compound Eyes & Antennae
      [-1, 1].forEach(side => {
        const eyeGeo = new THREE.SphereGeometry(0.058, 14, 10);
        eyeGeo.scale(0.7, 1.1, 1.0);
        const eyeMesh = new THREE.Mesh(eyeGeo, eyeMat);
        eyeMesh.position.set(side * 0.07, 0.03, 0.05);
        headBone.add(eyeMesh);

        const antBone = new THREE.Bone();
        antBone.position.set(side * 0.04, 0.07, 0.10);
        antBone.rotation.set(0.35, side * 0.35, 0);
        headBone.add(antBone);
        allMosquitoBones.push(antBone);

        const antGeo = new THREE.CylinderGeometry(0.009, 0.003, 0.35, 6);
        antGeo.translate(0, 0.17, 0);
        const antMesh = new THREE.Mesh(antGeo, chitinMat);
        antBone.add(antMesh);
      });

      // Hypodermic Needle Proboscis
      mosquitoProboscis = new THREE.Bone();
      mosquitoProboscis.name = "Proboscis";
      mosquitoProboscis.position.set(0, -0.05, 0.10);
      mosquitoProboscis.rotation.x = 1.40;
      headBone.add(mosquitoProboscis);
      allMosquitoBones.push(mosquitoProboscis);

      const probGeo = new THREE.CylinderGeometry(0.015, 0.003, 0.70, 8);
      probGeo.translate(0, -0.35, 0);
      const probMesh = new THREE.Mesh(probGeo, bloodMat);
      mosquitoProboscis.add(probMesh);

      // --- SEGMENTED ABDOMEN ---
      mosquitoAbdomen = new THREE.Bone();
      mosquitoAbdomen.name = "AbdomenRoot";
      mosquitoAbdomen.position.set(0, -0.12, -0.16);
      mosquitoAbdomen.rotation.x = -0.42;
      thoraxBone.add(mosquitoAbdomen);
      allMosquitoBones.push(mosquitoAbdomen);

      let prevAbdomenBone = mosquitoAbdomen;
      const numSegments = 6;
      for (let s = 0; s < numSegments; s++) {
        const segBone = new THREE.Bone();
        segBone.position.set(0, -0.12, -0.035);
        segBone.rotation.x = -0.07;
        prevAbdomenBone.add(segBone);
        allMosquitoBones.push(segBone);

        const segRadius = (1.0 - (s / numSegments) * 0.55) * 0.13;
        const segGeo = new THREE.SphereGeometry(segRadius, 14, 10);
        segGeo.scale(1.0, 1.4, 1.1);
        const segMesh = new THREE.Mesh(segGeo, s < 3 ? bloodMat : chitinMat);
        segBone.add(segMesh);

        prevAbdomenBone = segBone;
      }

      // --- GOSSAMER VEINED WINGS ---
      const wingTexture = createWingTexture();
      const wingMat = new THREE.MeshStandardMaterial({
        map: wingTexture,
        transparent: true,
        opacity: 0.88,
        roughness: 0.12,
        metalness: 0.25,
        side: THREE.DoubleSide,
        depthWrite: false
      });

      [-1, 1].forEach((side) => {
        const wingRoot = new THREE.Bone();
        wingRoot.name = `WingRoot_${side > 0 ? 'R' : 'L'}`;
        wingRoot.position.set(side * 0.10, 0.15, -0.04);
        wingRoot.rotation.set(-0.25, side * 0.35, side * 0.25);
        thoraxBone.add(wingRoot);
        allMosquitoBones.push(wingRoot);

        // Bounded wing dimensions
        const wingGeo = new THREE.PlaneGeometry(0.38, 0.95);
        wingGeo.translate(side * 0.16, 0.45, 0);
        wingGeo.rotateX(Math.PI / 2);
        const wingMesh = new THREE.Mesh(wingGeo, wingMat);
        wingRoot.add(wingMesh);

        mosquitoWings.push({
          bone: wingRoot,
          baseRot: wingRoot.rotation.clone(),
          side: side
        });
      });

      // --- 6 COMPACT SKELETAL LEGS (PROPORTIONED TO STAY DEEP WITHIN AMBER) ---
      // Total leg reach is strictly constrained so maximum radial distance < 0.52 (well within 1.74 amber boundary)
      const legConfigs = [
        // Forelegs: curl tightly underneath the head & proboscis
        { name: 'Fore_L', side: -1, pos: [-0.09, 0.05, 0.10], coxaRot: [-0.25, -0.35, -0.2], femurL: 0.35, tibiaL: 0.40, tarsusL: 0.30, fRot: [0.65, -0.2, 0.35], tRot: [-1.2, 0.1, -0.2], trRot: [0.75, 0.1, 0.2] },
        { name: 'Fore_R', side: 1,  pos: [0.09, 0.05, 0.10],  coxaRot: [-0.25, 0.35, 0.2],   femurL: 0.35, tibiaL: 0.40, tarsusL: 0.30, fRot: [0.65, 0.2, -0.35], tRot: [-1.2, -0.1, 0.2], trRot: [0.75, -0.1, -0.2] },
        // Midlegs: flank the thorax and curve downwards
        { name: 'Mid_L',  side: -1, pos: [-0.11, -0.02, 0.02], coxaRot: [0.1, -0.5, -0.2],    femurL: 0.38, tibiaL: 0.45, tarsusL: 0.34, fRot: [0.45, -0.25, 0.55], tRot: [-1.35, 0.1, -0.3], trRot: [0.85, 0.15, 0.25] },
        { name: 'Mid_R',  side: 1,  pos: [0.11, -0.02, 0.02],  coxaRot: [0.1, 0.5, 0.2],     femurL: 0.38, tibiaL: 0.45, tarsusL: 0.34, fRot: [0.45, 0.25, -0.55], tRot: [-1.35, -0.1, 0.3], trRot: [0.85, -0.15, -0.25] },
        // Hindlegs: trail along abdomen and curl inwards
        { name: 'Hind_L', side: -1, pos: [-0.09, -0.08, -0.07], coxaRot: [0.35, -0.65, -0.15], femurL: 0.44, tibiaL: 0.52, tarsusL: 0.38, fRot: [0.75, -0.15, 0.45], tRot: [-1.45, 0.1, -0.25], trRot: [0.65, 0.15, 0.2] },
        { name: 'Hind_R', side: 1,  pos: [0.09, -0.08, -0.07],  coxaRot: [0.35, 0.65, 0.15],   femurL: 0.44, tibiaL: 0.52, tarsusL: 0.38, fRot: [0.75, 0.15, -0.45], tRot: [-1.45, -0.1, 0.25], trRot: [0.65, -0.15, -0.2] }
      ];

      legConfigs.forEach((cfg, idx) => {
        const coxaBone = new THREE.Bone();
        coxaBone.name = `${cfg.name}_Coxa`;
        coxaBone.position.set(...cfg.pos);
        coxaBone.rotation.set(...cfg.coxaRot);
        thoraxBone.add(coxaBone);
        allMosquitoBones.push(coxaBone);

        const femurBone = new THREE.Bone();
        femurBone.name = `${cfg.name}_Femur`;
        femurBone.position.set(0, 0, 0);
        femurBone.rotation.set(...cfg.fRot);
        coxaBone.add(femurBone);
        allMosquitoBones.push(femurBone);

        const femurMesh = createSegmentMesh(0.018, 0.012, cfg.femurL, chitinMat);
        femurBone.add(femurMesh);

        const tibiaBone = new THREE.Bone();
        tibiaBone.name = `${cfg.name}_Tibia`;
        tibiaBone.position.set(0, -cfg.femurL, 0);
        tibiaBone.rotation.set(...cfg.tRot);
        femurBone.add(tibiaBone);
        allMosquitoBones.push(tibiaBone);

        const tibiaMesh = createSegmentMesh(0.013, 0.009, cfg.tibiaL, chitinMat);
        tibiaBone.add(tibiaMesh);

        const tarsusBone = new THREE.Bone();
        tarsusBone.name = `${cfg.name}_Tarsus`;
        tarsusBone.position.set(0, -cfg.tibiaL, 0);
        tarsusBone.rotation.set(...cfg.trRot);
        tibiaBone.add(tarsusBone);
        allMosquitoBones.push(tarsusBone);

        const tarsusMesh = createSegmentMesh(0.009, 0.004, cfg.tarsusL, chitinMat);
        tarsusBone.add(tarsusMesh);

        mosquitoLegs.push({
          index: idx,
          side: cfg.side,
          coxa: coxaBone,
          femur: femurBone,
          tibia: tibiaBone,
          tarsus: tarsusBone,
          baseFemurRot: femurBone.rotation.clone(),
          baseTibiaRot: tibiaBone.rotation.clone(),
          baseTarsusRot: tarsusBone.rotation.clone(),
          isTwitching: false
        });
      });

      new THREE.Skeleton(allMosquitoBones);
    }

    function createSegmentMesh(topR, bottomR, length, mat) {
      const geo = new THREE.CylinderGeometry(topR, bottomR, length, 8);
      geo.translate(0, -length / 2, 0);
      const mesh = new THREE.Mesh(geo, mat);
      const jointGeo = new THREE.SphereGeometry(topR * 1.35, 8, 6);
      const jointMesh = new THREE.Mesh(jointGeo, mat);
      mesh.add(jointMesh);
      return mesh;
    }

    // --- INTERNAL INCLUSIONS (STRICTLY BOUNDED INSIDE AMBER GEOMETRY) ---
    function buildInclusions() {
      bubblesGroup = new THREE.Group();
      bubblesGroup.renderOrder = 1;
      pendantGroup.add(bubblesGroup);

      const bubbleMat = new THREE.MeshPhysicalMaterial({
        color: 0xffffff,
        transmission: 0.98,
        roughness: 0.02,
        ior: 1.0, // Air bubble trapped in amber
        thickness: 0.35,
        transparent: true,
        opacity: 0.95,
        depthWrite: false
      });

      const bubbleCount = 42;
      for (let i = 0; i < bubbleCount; i++) {
        const radius = 0.018 + Math.pow(Math.random(), 2.5) * 0.09;
        const bubbleGeo = new THREE.SphereGeometry(radius, 16, 12);
        const bubbleMesh = new THREE.Mesh(bubbleGeo, bubbleMat);

        // Clustered near the insect and strictly clamped inside amber volume
        const y = -1.4 + Math.random() * 2.0;
        const maxR = getAmberRadius(y) * 0.65;
        const r = Math.pow(Math.random(), 0.7) * maxR;
        const theta = Math.random() * Math.PI * 2;
        bubbleMesh.position.set(Math.cos(theta) * r, y, Math.sin(theta) * r * 0.85);
        bubblesGroup.add(bubbleMesh);
      }

      // Prehistoric Organic Spores (Strictly bounded inside the amber matrix)
      const sporeCount = 240;
      const sporeGeo = new THREE.BufferGeometry();
      const sporePositions = new Float32Array(sporeCount * 3);
      const sporeColors = new Float32Array(sporeCount * 3);
      const colA = new THREE.Color(params.attenuationColor);
      const colB = new THREE.Color(params.coreGlowColor);

      for (let i = 0; i < sporeCount; i++) {
        const y = -1.8 + Math.random() * 3.2;
        const maxR = getAmberRadius(y) * 0.70;
        const r = Math.pow(Math.random(), 0.6) * maxR;
        const theta = Math.random() * Math.PI * 2;

        sporePositions[i * 3] = Math.cos(theta) * r;
        sporePositions[i * 3 + 1] = y;
        sporePositions[i * 3 + 2] = Math.sin(theta) * r * 0.85;

        const mixColor = colA.clone().lerp(colB, Math.random());
        sporeColors[i * 3] = mixColor.r;
        sporeColors[i * 3 + 1] = mixColor.g;
        sporeColors[i * 3 + 2] = mixColor.b;
      }

      sporeGeo.setAttribute('position', new THREE.BufferAttribute(sporePositions, 3));
      sporeGeo.setAttribute('color', new THREE.BufferAttribute(sporeColors, 3));

      const sporeMat = new THREE.PointsMaterial({
        size: 0.034,
        vertexColors: true,
        transparent: true,
        opacity: 0.85,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      sporePoints = new THREE.Points(sporeGeo, sporeMat);
      sporePoints.renderOrder = 1;
      pendantGroup.add(sporePoints);

      // Cursed Veined Filaments radiating inside the amber
      for (let i = 0; i < 6; i++) {
        const midY = -0.4 + (Math.random() - 0.5) * 0.4;
        const endY = -0.5 + (Math.random() - 0.5) * 0.7;
        const maxR1 = getAmberRadius(midY) * 0.55;
        const maxR2 = getAmberRadius(endY) * 0.65;

        const ang1 = Math.random() * Math.PI * 2;
        const ang2 = ang1 + (Math.random() - 0.5) * 0.8;

        const curve = new THREE.CatmullRomCurve3([
          new THREE.Vector3(0, -0.38, 0),
          new THREE.Vector3(Math.cos(ang1) * maxR1 * 0.6, midY, Math.sin(ang1) * maxR1 * 0.6),
          new THREE.Vector3(Math.cos(ang2) * maxR2, endY, Math.sin(ang2) * maxR2)
        ]);
        const tubeGeo = new THREE.TubeGeometry(curve, 24, 0.010, 6, false);
        const tubeMat = new THREE.MeshStandardMaterial({
          color: new THREE.Color(params.bloodAccentColor),
          emissive: new THREE.Color(params.bloodAccentColor),
          emissiveIntensity: 0.55,
          roughness: 0.3,
          transparent: true,
          opacity: 0.8,
          depthWrite: false
        });
        const tubeMesh = new THREE.Mesh(tubeGeo, tubeMat);
        tubeMesh.renderOrder = 1;
        pendantGroup.add(tubeMesh);
      }
    }

    // --- SKELETAL TWITCHING ANIMATION ENGINE ---
    let lastLegTwitchTime = 0;
    let lastWingShudderTime = 0;

    function triggerLegTwitch() {
      if (mosquitoLegs.length === 0) return;
      const leg = mosquitoLegs[Math.floor(Math.random() * mosquitoLegs.length)];
      if (leg.isTwitching) return;
      leg.isTwitching = true;

      const spd = Math.max(params.animSpeed, 0.2);
      const intensity = 0.18 + Math.random() * 0.15;

      const targetFemur = {
        x: leg.baseFemurRot.x + (Math.random() - 0.5) * intensity,
        y: leg.baseFemurRot.y + (Math.random() - 0.5) * intensity * 0.8,
        z: leg.baseFemurRot.z + leg.side * (Math.random() * intensity)
      };

      const targetTibia = {
        x: leg.baseTibiaRot.x + (Math.random() - 0.5) * intensity * 1.2,
        y: leg.baseTibiaRot.y + (Math.random() - 0.5) * intensity,
        z: leg.baseTibiaRot.z + (Math.random() - 0.5) * intensity
      };

      const targetTarsus = {
        x: leg.baseTarsusRot.x + (Math.random() - 0.5) * intensity * 1.3,
        y: leg.baseTarsusRot.y,
        z: leg.baseTarsusRot.z + (Math.random() - 0.5) * intensity * 1.3
      };

      gsap.to(leg.femur.rotation, {
        x: targetFemur.x,
        y: targetFemur.y,
        z: targetFemur.z,
        duration: 0.05 / spd,
        ease: 'power4.out',
        onComplete: () => {
          gsap.to(leg.femur.rotation, {
            x: leg.baseFemurRot.x,
            y: leg.baseFemurRot.y,
            z: leg.baseFemurRot.z,
            duration: (0.35 + Math.random() * 0.25) / spd,
            ease: 'elastic.out(1.2, 0.45)',
            onComplete: () => { leg.isTwitching = false; }
          });
        }
      });

      gsap.to(leg.tibia.rotation, {
        x: targetTibia.x,
        y: targetTibia.y,
        z: targetTibia.z,
        duration: 0.06 / spd,
        ease: 'power4.out',
        onComplete: () => {
          gsap.to(leg.tibia.rotation, {
            x: leg.baseTibiaRot.x,
            y: leg.baseTibiaRot.y,
            z: leg.baseTibiaRot.z,
            duration: (0.4 + Math.random() * 0.2) / spd,
            ease: 'elastic.out(1.1, 0.4)'
          });
        }
      });

      gsap.to(leg.tarsus.rotation, {
        x: targetTarsus.x,
        z: targetTarsus.z,
        duration: 0.07 / spd,
        ease: 'power3.out',
        onComplete: () => {
          gsap.to(leg.tarsus.rotation, {
            x: leg.baseTarsusRot.x,
            z: leg.baseTarsusRot.z,
            duration: 0.35 / spd,
            ease: 'power2.out'
          });
        }
      });
    }

    function triggerWingFlutter() {
      if (mosquitoWings.length === 0) return;
      const spd = Math.max(params.animSpeed, 0.2);

      mosquitoWings.forEach(w => {
        const shudderAmt = 0.10 + Math.random() * 0.07;
        gsap.to(w.bone.rotation, {
          z: w.baseRot.z + w.side * shudderAmt,
          duration: 0.04 / spd,
          yoyo: true,
          repeat: 5,
          ease: 'sine.inOut',
          onComplete: () => {
            gsap.to(w.bone.rotation, {
              x: w.baseRot.x,
              y: w.baseRot.y,
              z: w.baseRot.z,
              duration: 0.2 / spd,
              ease: 'power2.out'
            });
          }
        });
      });
    }

    // --- APPLY COLOR SCHEME ---
    function applyPalette(paletteName, transitionDuration = 0.8) {
      const pal = PALETTES[paletteName];
      if (!pal) return;

      params.colorScheme = paletteName;
      params.amberColor = pal.amber;
      params.attenuationColor = pal.attenuation;
      params.coreGlowColor = pal.coreGlow;
      params.mosquitoColor = pal.mosquito;
      params.bloodAccentColor = pal.bloodAccent;
      params.metalColor = pal.metal;
      params.bgColor = pal.background;
      params.keyLightColor = pal.keyLight;
      params.rimLightColor = pal.rimLight;

      if (!params.greenscreen) {
        gsap.to(scene.background, {
          r: new THREE.Color(pal.background).r,
          g: new THREE.Color(pal.background).g,
          b: new THREE.Color(pal.background).b,
          duration: transitionDuration
        });
        if (scene.fog) {
          gsap.to(scene.fog.color, {
            r: new THREE.Color(pal.background).r,
            g: new THREE.Color(pal.background).g,
            b: new THREE.Color(pal.background).b,
            duration: transitionDuration
          });
        }
      }

      if (amberMesh) {
        gsap.to(amberMesh.material.color, { ...new THREE.Color(pal.amber), duration: transitionDuration });
        gsap.to(amberMesh.material.emissive, { ...new THREE.Color(pal.coreGlow), duration: transitionDuration });
        gsap.to(amberMesh.material.attenuationColor, { ...new THREE.Color(pal.attenuation), duration: transitionDuration });
      }

      if (haloMaterial) {
        gsap.to(haloMaterial.uniforms.uGlowColor.value, { ...new THREE.Color(pal.coreGlow), duration: transitionDuration });
      }

      if (innerScatteringMesh) {
        gsap.to(innerScatteringMesh.material.color, { ...new THREE.Color(pal.coreGlow), duration: transitionDuration });
      }

      if (coreInternalLight) {
        gsap.to(coreInternalLight.color, { ...new THREE.Color(pal.coreGlow), duration: transitionDuration });
      }

      if (claspGroup) {
        claspGroup.traverse(child => {
          if (child.isMesh && child.material.metalness > 0.5) {
            gsap.to(child.material.color, { ...new THREE.Color(pal.metal), duration: transitionDuration });
          }
        });
      }

      if (causticMaterial) {
        gsap.to(causticMaterial.uniforms.uColor.value, { ...new THREE.Color(pal.attenuation), duration: transitionDuration });
      }

      if (keyLight) {
        gsap.to(keyLight.color, { ...new THREE.Color(pal.keyLight), duration: transitionDuration });
      }
      if (rimLight) {
        gsap.to(rimLight.color, { ...new THREE.Color(pal.rimLight), duration: transitionDuration });
      }

      if (gui) {
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      }
    }

    // --- PROCEDURAL RE-ROLL ON CLICK ---
    function triggerProceduralRandomization() {
      const paletteKeys = Object.keys(PALETTES);
      const randomPalette = paletteKeys[Math.floor(Math.random() * paletteKeys.length)];
      applyPalette(randomPalette, 1.0);

      params.animSpeed = +(0.6 + Math.random() * 1.2).toFixed(2);
      params.exposure = +(1.05 + Math.random() * 0.45).toFixed(2);
      renderer.toneMappingExposure = params.exposure;

      // Safe mosquito scale range that will never breach boundaries
      if (mosquitoGroup) {
        const sc = 0.88 + Math.random() * 0.16;
        gsap.to(mosquitoGroup.scale, { x: sc, y: sc, z: sc, duration: 1.0, ease: 'power2.out' });
      }

      triggerLegTwitch();
      triggerWingFlutter();

      if (gui) {
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      }
    }

    // --- RECREATE RENDERER FOR ANTIALIAS SETTING ---
    function recreateRenderer() {
      const oldCanvas = renderer.domElement;
      renderer.dispose();

      renderer = new THREE.WebGLRenderer({
        antialias: params.antialias,
        alpha: false,
        powerPreference: 'high-performance'
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(params.pixelRatio);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = params.exposure;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      container.replaceChild(renderer.domElement, oldCanvas);
      controls.domElement = renderer.domElement;
      setupPostProcessing();
    }

    // --- USER INTERACTIONS & CLICK DETECTION ---
    function setupInteractions() {
      let pointerDownPos = { x: 0, y: 0 };
      let pointerDownTime = 0;

      window.addEventListener('pointerdown', (e) => {
        pointerDownPos = { x: e.clientX, y: e.clientY };
        pointerDownTime = performance.now();
      });

      window.addEventListener('pointerup', (e) => {
        if (e.target.closest('.lil-gui')) return;

        const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
        const duration = performance.now() - pointerDownTime;

        if (dist < 8 && duration < 350 && params.randomizeOnClick) {
          triggerProceduralRandomization();
        }
      });

      window.addEventListener('keydown', (e) => {
        if (e.key === 'h' || e.key === 'H') {
          if (gui) {
            gui._hidden ? gui.show() : gui.hide();
          }
        }
      });
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      if (composer) {
        composer.setSize(window.innerWidth, window.innerHeight);
      }
    }

    // --- SETUP LIL-GUI ---
    function setupUI() {
      gui = new GUI({ title: 'Cursed Amber Pendant' });

      // 1. Color Schemes & Palettes
      const fPalette = gui.addFolder('Color Schemes');
      fPalette.add(params, 'colorScheme', Object.keys(PALETTES)).name('Preset Scheme').onChange(name => {
        applyPalette(name, 0.8);
      });

      fPalette.addColor(params, 'amberColor').name('Amber Resin').onChange(c => {
        if (amberMesh) amberMesh.material.color.set(c);
      });
      fPalette.addColor(params, 'attenuationColor').name('Volumetric Absorption').onChange(c => {
        if (amberMesh) amberMesh.material.attenuationColor.set(c);
        if (causticMaterial) causticMaterial.uniforms.uColor.value.set(c);
      });
      fPalette.addColor(params, 'coreGlowColor').name('Inner Glow Core').onChange(c => {
        if (innerScatteringMesh) innerScatteringMesh.material.color.set(c);
        if (coreInternalLight) coreInternalLight.color.set(c);
        if (haloMaterial) haloMaterial.uniforms.uGlowColor.value.set(c);
        if (amberMesh) amberMesh.material.emissive.set(c);
      });
      fPalette.addColor(params, 'mosquitoColor').name('Mosquito Chitin').onChange(c => {
        if (mosquitoGroup) {
          mosquitoGroup.traverse(ch => {
            if (ch.isMesh && ch.material.roughness > 0.25 && !ch.material.map) {
              ch.material.color.set(c);
            }
          });
        }
      });
      fPalette.addColor(params, 'bloodAccentColor').name('Blood / Needle Accent').onChange(c => {
        if (mosquitoProboscis && mosquitoProboscis.children[0]) mosquitoProboscis.children[0].material.color.set(c);
        if (mosquitoAbdomen) {
          mosquitoAbdomen.traverse(ch => {
            if (ch.isMesh && ch.material.emissiveIntensity > 0.4) {
              ch.material.color.set(c);
              ch.material.emissive.set(c);
            }
          });
        }
      });
      fPalette.addColor(params, 'metalColor').name('Antique Clasp').onChange(c => {
        if (claspGroup) {
          claspGroup.traverse(ch => {
            if (ch.isMesh && ch.material.metalness > 0.5) ch.material.color.set(c);
          });
        }
      });
      fPalette.addColor(params, 'bgColor').name('Background Color').onChange(c => {
        if (!params.greenscreen) {
          scene.background.set(c);
          if (scene.fog) scene.fog.color.set(c);
        }
      });

      // 2. Glow & Bloom Settings
      const fGlow = gui.addFolder('Glow & Bloom');
      fGlow.add(params, 'amberGlowIntensity', 0.0, 3.0, 0.05).name('Amber Glow Aura').onChange(v => {
        if (haloMaterial) haloMaterial.uniforms.uGlowIntensity.value = v;
        if (amberMesh) amberMesh.material.emissiveIntensity = v * 0.45;
      });
      fGlow.add(params, 'innerCoreGlowIntensity', 0.0, 3.0, 0.05).name('Inner Core Radiance').onChange(v => {
        if (innerScatteringMesh) innerScatteringMesh.material.opacity = v * 0.22;
        if (coreInternalLight) coreInternalLight.intensity = v * 2.2 * params.sceneLightIntensity;
      });
      fGlow.add(params, 'enableBloom').name('Enable Bloom FX');
      fGlow.add(params, 'bloomStrength', 0.0, 3.0, 0.05).name('Bloom Strength').onChange(v => {
        if (bloomPass) bloomPass.strength = v;
      });
      fGlow.add(params, 'bloomRadius', 0.0, 1.5, 0.05).name('Bloom Radius').onChange(v => {
        if (bloomPass) bloomPass.radius = v;
      });
      fGlow.add(params, 'bloomThreshold', 0.0, 1.0, 0.05).name('Bloom Threshold').onChange(v => {
        if (bloomPass) bloomPass.threshold = v;
      });

      // 3. Cinematic Animations Dropdown (8 Preconfigured)
      const fAnim = gui.addFolder('Animations');
      const animList = [
        'Static Exhibition',
        'Slow Relic Orbit',
        'Vertical Caustic Sweep',
        'Microscopic Inspection',
        'Cursed Pendulum Sway',
        'Eldritch Breathing',
        'Gemological Turn',
        'Zenith to Nadir Drift'
      ];
      fAnim.add(params, 'animationPreset', animList).name('Animation Mode').onChange(preset => {
        if (preset === 'Static Exhibition') {
          gsap.to(camera.position, { x: 0, y: 0.3, z: 5.2, duration: 1.2, ease: 'power2.inOut' });
          gsap.to(controls.target, { x: 0, y: -0.25, z: 0, duration: 1.2, ease: 'power2.inOut' });
        }
      });
      fAnim.add(params, 'animSpeed', 0.0, 3.0, 0.05).name('Speed Multiplier');

      // 4. Environment & Visibility Controls
      const fEnv = gui.addFolder('Environment & Visibility');
      fEnv.add(params, 'showAmber').name('Show Amber Pendant').onChange(visible => {
        pendantGroup.visible = visible;
      });
      fEnv.add(params, 'greenscreen').name('Greenscreen (#00ff00)').onChange(enabled => {
        if (enabled) {
          scene.background.set('#00ff00');
          scene.fog = null;
          causticGroundMesh.visible = false;
        } else {
          scene.background.set(params.bgColor);
          scene.fog = new THREE.FogExp2(params.bgColor, 0.06);
          causticGroundMesh.visible = true;
        }
      });
      fEnv.add(params, 'randomizeOnClick').name('Randomize on Click');
      fEnv.add({ randomizeNow: triggerProceduralRandomization }, 'randomizeNow').name('Randomize Now!');

      // 5. Rendering & Display
      const fRender = gui.addFolder('Rendering');
      fRender.add(params, 'pixelRatio', 0.5, 3.0, 0.25).name('Pixel Ratio (DPR)').onChange(v => {
        renderer.setPixelRatio(v);
        if (composer) composer.setPixelRatio(v);
      });
      fRender.add(params, 'antialias').name('Antialias').onChange(recreateRenderer);
      fRender.add(params, 'exposure', 0.1, 3.0, 0.05).name('Exposure').onChange(v => {
        renderer.toneMappingExposure = v;
      });
      fRender.add(params, 'sceneLightIntensity', 0.1, 3.0, 0.05).name('Scene Light Mult').onChange(updateAllLights);

      // 6. Lighting Folder
      const fLights = gui.addFolder('Lighting Settings');
      fLights.close();

      const fKey = fLights.addFolder('Key Light');
      fKey.add(params, 'keyLightIntensity', 0, 8, 0.1).name('Intensity').onChange(updateAllLights);
      fKey.addColor(params, 'keyLightColor').name('Color').onChange(c => keyLight.color.set(c));
      fKey.add(params, 'keyLightX', -10, 10, 0.5).name('Pos X').onChange(v => keyLight.position.x = v);
      fKey.add(params, 'keyLightY', -10, 10, 0.5).name('Pos Y').onChange(v => keyLight.position.y = v);
      fKey.add(params, 'keyLightZ', -10, 10, 0.5).name('Pos Z').onChange(v => keyLight.position.z = v);

      const fRim = fLights.addFolder('Rim Light');
      fRim.add(params, 'rimLightIntensity', 0, 10, 0.1).name('Intensity').onChange(updateAllLights);
      fRim.addColor(params, 'rimLightColor').name('Color').onChange(c => rimLight.color.set(c));
      fRim.add(params, 'rimLightX', -10, 10, 0.5).name('Pos X').onChange(v => rimLight.position.x = v);
      fRim.add(params, 'rimLightY', -10, 10, 0.5).name('Pos Y').onChange(v => rimLight.position.y = v);
      fRim.add(params, 'rimLightZ', -10, 10, 0.5).name('Pos Z').onChange(v => rimLight.position.z = v);

      const fCaustic = fLights.addFolder('Caustic Light');
      fCaustic.add(params, 'causticLightIntensity', 0, 8, 0.1).name('Intensity').onChange(updateAllLights);
      fCaustic.addColor(params, 'causticLightColor').name('Color').onChange(c => causticLight.color.set(c));

      const fAmb = fLights.addFolder('Ambient Light');
      fAmb.add(params, 'ambientLightIntensity', 0, 2, 0.05).name('Intensity').onChange(updateAllLights);
      fAmb.addColor(params, 'ambientLightColor').name('Color').onChange(c => ambientLight.color.set(c));
    }

    function updateAllLights() {
      const mult = params.sceneLightIntensity;
      if (ambientLight) ambientLight.intensity = params.ambientLightIntensity * mult;
      if (keyLight) keyLight.intensity = params.keyLightIntensity * mult;
      if (rimLight) rimLight.intensity = params.rimLightIntensity * mult;
      if (causticLight) causticLight.intensity = params.causticLightIntensity * mult;
      if (coreInternalLight) coreInternalLight.intensity = params.innerCoreGlowIntensity * 2.2 * mult;
    }

    // --- MAIN ANIMATION & CINEMATIC RENDER LOOP ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const time = clock.getElapsedTime() * params.animSpeed;

      if (causticMaterial) {
        causticMaterial.uniforms.uTime.value = time;
      }

      // Pulse Fresnel glow halo subtly with time
      if (haloMaterial) {
        haloMaterial.uniforms.uGlowIntensity.value = params.amberGlowIntensity * (1.0 + Math.sin(time * 2.2) * 0.12);
      }

      // Prehistoric Twitch Scheduler
      if (params.animSpeed > 0.01) {
        if (time - lastLegTwitchTime > (1.1 + Math.sin(time * 0.5) * 0.6) / params.animSpeed) {
          triggerLegTwitch();
          lastLegTwitchTime = time;
        }

        if (time - lastWingShudderTime > (3.2 + Math.cos(time * 0.4) * 1.2) / params.animSpeed) {
          triggerWingFlutter();
          lastWingShudderTime = time;
        }
      }

      // Continuous uncanny micro-tremors
      if (mosquitoGroup && params.animSpeed > 0) {
        if (mosquitoProboscis) {
          mosquitoProboscis.rotation.z = Math.sin(time * 18.0) * 0.015;
          mosquitoProboscis.rotation.y = Math.cos(time * 14.0) * 0.012;
        }

        if (mosquitoAbdomen) {
          const breathe = 1.0 + Math.sin(time * 2.8) * 0.03;
          mosquitoAbdomen.scale.set(breathe, breathe, 1.0 + Math.cos(time * 2.8) * 0.02);
        }

        pendantGroup.position.y = Math.sin(time * 1.2) * 0.07;
        pendantGroup.rotation.z = Math.sin(time * 0.9) * 0.035;
        pendantGroup.rotation.x = Math.cos(time * 0.7) * 0.025;

        if (sporePoints) {
          sporePoints.rotation.y = time * 0.04;
        }
      }

      // --- 8 PRECONFIGURED CINEMATIC CAMERA CHOREOGRAPHIES ---
      if (!isUserInteracting) {
        switch (params.animationPreset) {
          case 'Static Exhibition':
            // Static beauty angle, no camera translation
            break;

          case 'Slow Relic Orbit': {
            const orbitR = 5.2;
            const orbitSpeed = time * 0.22;
            camera.position.x = Math.sin(orbitSpeed) * orbitR;
            camera.position.z = Math.cos(orbitSpeed) * orbitR;
            camera.position.y = 0.3 + Math.sin(time * 0.15) * 0.4;
            controls.target.set(0, -0.25, 0);
            break;
          }

          case 'Vertical Caustic Sweep': {
            camera.position.y = 0.2 + Math.sin(time * 0.35) * 1.9;
            camera.position.x = Math.sin(time * 0.18) * 2.2;
            camera.position.z = 4.4;
            controls.target.set(0, camera.position.y * 0.4 - 0.3, 0);
            break;
          }

          case 'Microscopic Inspection': {
            const microAngle = time * 0.25;
            const microDist = 2.4 + Math.sin(time * 0.3) * 0.3;
            camera.position.x = Math.sin(microAngle) * microDist;
            camera.position.z = Math.cos(microAngle) * microDist;
            camera.position.y = -0.3 + Math.sin(time * 0.2) * 0.3;
            controls.target.set(0, -0.35, 0);
            break;
          }

          case 'Cursed Pendulum Sway': {
            pendantGroup.rotation.z = Math.sin(time * 1.5) * 0.22;
            pendantGroup.rotation.x = Math.cos(time * 1.1) * 0.14;
            controls.target.set(0, -0.3, 0);
            break;
          }

          case 'Eldritch Breathing': {
            const breatheDist = 4.6 + Math.sin(time * 0.45) * 1.6;
            const breatheAngle = time * 0.15;
            camera.position.x = Math.sin(breatheAngle) * breatheDist;
            camera.position.z = Math.cos(breatheAngle) * breatheDist;
            camera.position.y = 0.2 + Math.cos(time * 0.3) * 0.6;
            controls.target.set(0, -0.25, 0);
            break;
          }

          case 'Gemological Turn': {
            const turnAngle = Math.sin(time * 0.3) * Math.PI * 0.95;
            camera.position.x = Math.sin(turnAngle) * 5.0;
            camera.position.z = Math.cos(turnAngle) * 5.0;
            camera.position.y = 0.35;
            controls.target.set(0, -0.25, 0);
            break;
          }

          case 'Zenith to Nadir Drift': {
            const zenithT = time * 0.25;
            camera.position.x = Math.sin(zenithT) * 4.2;
            camera.position.z = Math.cos(zenithT * 0.8) * 3.8;
            camera.position.y = Math.sin(zenithT * 1.2) * 2.8;
            controls.target.set(0, -0.25, 0);
            break;
          }
        }
      }

      controls.update();

      // Render through Bloom EffectComposer if active, else standard renderer
      if (params.enableBloom && composer) {
        composer.render();
      } else {
        renderer.render(scene, camera);
      }
    }

    // --- START APPLICATION ---
    initScene();
    setupUI();
    animate();
  </script>
</body>
