<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#c9bcf5">
  <title>Pearlescent — Liquid Silk</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: linear-gradient(125deg, #a3e9f4, #b7a4f5 45%, #ffb8e8 80%, #fff6b3); }
    canvas { display: block; width: 100%; height: 100%; position: fixed; inset: 0; touch-action: none; }
  </style>
</head>
<body>
  <canvas aria-label="Slowly flowing pearlescent liquid silk"></canvas>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
    import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

    // All visual controls live here. Speed 1 completes one exact loop in 30 seconds.
    const config = {
      animationSpeed: 1,
      loopDuration: 30,
      foldScale: 1,
      displacementAmplitude: 0.94,
      iridescenceIntensity: 0.96,
      reflectionSharpness: 1,
      bloomStrength: 0.19,
      pixelRatio: Math.min(devicePixelRatio || 1, 1.75),
      scheme: 'Original', customPalette: false, tint: '#ffffff',
      color1: '#ffb8e8', color2: '#b7a4f5', color3: '#8cddfb',
      color4: '#91fff4', color5: '#fff6b3', color6: '#ffffff',
      invert: false, accent: '#ff3548', background: '#c9bcf5', greenscreen: false,
      animation: 'Liquid breath', motionAmount: 1, respectReducedMotion: true,
      zoom: 1, positionX: 0, positionY: 0, surfaceSize: 1,
      cameraYaw: 0, cameraPitch: 0, cameraRoll: 0,
      twist: 1, seedX: 0, seedY: 0, randomizeOnClick: true,
    };

    // Exactly 19 schemes. Invert B/W provides both achromatic polarities.
    const schemes = {
      'Original': ['FFB8E8', 'B7A4F5', '8CDDFB', '91FFF4', 'FFF6B3', 'FFFFFF'],
      'Monochromatic': ['100829', '35216B', '6742AD', 'A17DDD', 'D5BEF4', 'F4ECFF'],
      'Analogous': ['24113D', '7040A0', 'C16DD1', 'F4A4D0', 'FFD2D6', 'FFF0E2'],
      'Complementary': ['111C36', '205A85', '79CDE4', 'FFCE91', 'EB9344', 'FFF0D7'],
      'Split-complementary': ['211535', '7852B2', 'CAB1EC', 'F1CB74', '89CFB5', 'F7F3E8'],
      'Triadic': ['14243D', '4F9CA9', 'B9E4E1', 'D0699B', 'EDD175', 'FFF5DD'],
      'Tetradic': ['38214D', 'AA72BC', 'E9B5D1', 'D8BC71', '7CB89F', '6C9AC6'],
      'Double split-complementary': ['26394C', '7AAFC9', 'C4A1D7', 'E8A0A7', 'E2CD85', '97C6AB'],
      'Achromatic': ['000000', '202020', '606060', 'A0A0A0', 'D8D8D8', 'FFFFFF'],
      'Achromatic + Accent': ['000000', '282828', '666666', 'A4A4A4', 'DEDEDE', 'FFFFFF'],
      'Neutral + accent': ['181D21', '454B50', '8A8C88', 'C9C5BA', 'E9E3D7', 'FAF7F0'],
      'Amber / Oxblood': ['F6AA1C', 'BC3908', '941B0C', 'F6AA1C', '220901'],
      'Lagoon / Midnight': ['63D1CF', '5BC0BE', '4BAD9E', '4BAD9E', '0B132B', '000000'],
      'Orchid / Ink': ['AA60C8', 'D69ADE', 'C9A3C6', 'CFB5C2', '0D001D', '120A12'],
      'Champagne / Teal': ['FEF1BE', 'FFBA00', '008189', '00474D', '061210'],
      'Chartreuse / Forest': ['D4FFB0', '7FFF00', '00B894', '0A3322', '05140A'],
      'Apricot / Aubergine': ['FFE8CC', 'FF8C00', 'C7501A', '3D1050', '0E0618'],
      'Lilac / Ultraviolet': ['E8E0FF', 'B38FFF', '6A3DE8', '1A1250', '090612'],
      'Ice / Fuchsia': ['E0FBFF', '00F0FF', 'D40078', '1E0A3D', '05020F'],
    };
    const animations = ['Liquid breath', 'Silk drift', 'Tidal folds', 'Pearl pulse',
      'Reflection drift', 'Gentle orbit', 'Floating silk', 'Camera glide', 'Static'];

    const canvas = document.querySelector('canvas');
    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false, powerPreference: 'high-performance' });
    } catch (error) {
      // The pastel CSS remains visible if WebGL is unavailable.
      canvas.remove();
      console.error('Unable to initialize the liquid silk renderer.', error);
    }

    if (renderer) {
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 0.98;
      renderer.setClearColor(0x000000, 0);
      const scene = new THREE.Scene();
      const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 30);
      camera.position.z = 12;

      const uniforms = {
        uLoop: { value: new THREE.Vector2(1, 0) },
        uScale: { value: config.foldScale },
        uAmplitude: { value: config.displacementAmplitude },
        uIridescence: { value: config.iridescenceIntensity },
        uSharpness: { value: config.reflectionSharpness },
        uSeed: { value: new THREE.Vector2() },
        uDomainOffset: { value: new THREE.Vector2() },
        uTwist: { value: 1 }, uFlow: { value: 1 },
        uReflectionLoop: { value: new THREE.Vector2(1, 0) },
        uPalette: { value: Array.from({ length: 6 }, () => new THREE.Color()) },
        uPaletteCount: { value: 6 }, uColorMode: { value: 0 },
        uAccent: { value: new THREE.Color() }, uTint: { value: new THREE.Color(1, 1, 1) },
      };

      const surfaceMaterial = new THREE.ShaderMaterial({
        uniforms,
        depthTest: false,
        depthWrite: false,
        toneMapped: false,
        vertexShader: /* glsl */`
          uniform vec2 uLoop;
          uniform float uScale;
          uniform float uAmplitude;
          uniform vec2 uSeed;
          uniform vec2 uDomainOffset;
          uniform float uTwist;
          uniform float uFlow;
          varying vec3 vNormal;
          varying vec2 vDomain;
          varying float vHeight;

          // A scalar and its two exact spatial derivatives travel together.
          // This differentiates the full domain warp, including the narrow creases.
          vec3 dsin(vec3 a) { return vec3(sin(a.x), cos(a.x) * a.yz); }
          vec3 dcos(vec3 a) { return vec3(cos(a.x), -sin(a.x) * a.yz); }
          vec3 dmul(vec3 a, vec3 b) { return vec3(a.x*b.x, a.yz*b.x+b.yz*a.x); }
          vec3 dexp(vec3 a) { return vec3(exp(a.x), exp(a.x)*a.yz); }
          vec3 phase(float p) { return vec3(p, 0.0, 0.0); }
          float hash(vec2 p) {
            p = fract(p * vec2(123.34, 345.45));
            p += dot(p, p + 34.345);
            return fract(p.x * p.y);
          }
          vec3 noiseD(vec2 p) {
            vec2 i = floor(p), f = fract(p);
            vec2 u = f*f*f*(f*(f*6.0-15.0)+10.0);
            vec2 du = 30.0*f*f*(f*(f-2.0)+1.0);
            float a = hash(i), b = hash(i+vec2(1,0));
            float c = hash(i+vec2(0,1)), d = hash(i+vec2(1,1));
            float k = a-b-c+d;
            return vec3(a+(b-a)*u.x+(c-a)*u.y+k*u.x*u.y,
              du.x*(b-a+k*u.y), du.y*(c-a+k*u.x));
          }
          vec3 fbmD(vec2 p) {
            vec3 n = vec3(0);
            float amplitude = 0.55, frequency = 1.0;
            for (int i = 0; i < 3; i++) {
              vec3 s = noiseD(p*frequency+float(i)*13.17);
              n += amplitude * vec3(s.x, s.yz*frequency);
              frequency *= 1.93;
              amplitude *= 0.43;
            }
            return n;
          }
          vec3 heightD(vec2 p) {
            vec3 x = vec3(p.x, 1, 0), y = vec3(p.y, 0, 1);
            // Only a point on a circle drives motion: every field is periodic.
            float a = 0.19*uLoop.y*uFlow;
            float b = 0.17*(uLoop.x-1.0)*uFlow;
            // Two soft local twists draw the long ridges into folded junctions.
            vec3 dx = x-phase(-1.35), dy = y-phase(0.40);
            vec3 turn = 1.25*dexp(-0.48*(dmul(dx,dx)+dmul(dy,dy)));
            dx = x-phase(1.8); dy = y-phase(-1.25);
            turn -= 0.95*dexp(-0.53*(dmul(dx,dx)+dmul(dy,dy)));
            turn *= uTwist;
            vec3 rotatedX = dmul(x,dcos(turn))-dmul(y,dsin(turn));
            y = dmul(x,dsin(turn))+dmul(y,dcos(turn));
            x = rotatedX;
            vec3 n = fbmD(p*0.58+vec2(a,b));
            n.yz *= 0.58;
            vec3 m = fbmD(p*0.47+vec2(7.2+b, 3.7-a));
            m.yz *= 0.47;
            vec3 qx = x + 1.45*dsin(0.57*y+0.25*x+phase(a))
                        + 1.20*(n-phase(0.4));
            vec3 qy = y + 0.85*dsin(0.61*x-0.32*y+phase(b+1.8))
                        + 0.70*(m-phase(0.4));
            vec3 f = 1.55*qx-1.20*qy+1.20*dsin(0.68*qy+phase(0.4+b));
            vec3 g = 1.13*qx+1.38*qy+phase(1.4+a);
            vec3 s = dsin(f+0.42*dsin(g));
            // Smooth absolute value produces drawn, pinched folds without a cusp.
            float root = sqrt(s.x*s.x+0.035);
            vec3 crease = vec3(root, s.x*s.yz/root);
            return 0.64*dsin(f) + 0.16*dsin(2.0*f+phase(0.6))
                 + 0.41*dcos(g) - 0.38*crease
                 + 0.10*dsin(3.8*qx+0.65*qy+phase(2.0+b))
                 + 0.12*n;
          }
          void main() {
            vec2 p = position.xy*uScale+uSeed+uDomainOffset;
            vec3 h = heightD(p);
            float amplitude = uAmplitude;
            vNormal = normalMatrix * vec3(-h.yz*amplitude*uScale, 1.0);
            vHeight = h.x*amplitude;
            vDomain = p;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position.xy, vHeight, 1);
          }
        `,
        fragmentShader: /* glsl */`
          uniform vec2 uLoop;
          uniform float uIridescence;
          uniform float uSharpness;
          uniform vec2 uReflectionLoop;
          uniform vec3 uPalette[6];
          uniform float uPaletteCount;
          uniform float uColorMode;
          uniform vec3 uAccent;
          uniform vec3 uTint;
          varying vec3 vNormal;
          varying vec2 vDomain;
          varying float vHeight;

          const vec3 pink = vec3(1.25, 0.29, 0.78);
          const vec3 violet = vec3(0.32, 0.21, 1.10);
          const vec3 blue = vec3(0.12, 0.48, 1.10);
          const vec3 cyan = vec3(0.12, 1.0, 1.05);
          const vec3 gold = vec3(1.35, 1.15, 0.28);
          vec3 palette(float t) {
            float position = clamp(t, 0.0, 1.0)*(uPaletteCount-1.0);
            vec3 result = uPalette[0];
            for (int i = 0; i < 5; i++) {
              if (float(i) < uPaletteCount-1.0) {
                result = mix(result, uPalette[i+1], clamp(position-float(i), 0.0, 1.0));
              }
            }
            return result;
          }
          float gaussian(float x, float width) {
            // Widen subpixel reflections just enough to suppress sparkling.
            float footprint = fwidth(x);
            float variance = width*width+0.35*footprint*footprint;
            return exp(-x*x/variance);
          }

          // Procedural studio environment. Sampling a reflected direction makes
          // the long lightboxes bend and pinch naturally with the actual surface.
          vec3 environment(vec3 r, vec2 p, float facing) {
            float drift = 0.10*uReflectionLoop.y;
            float longitude = 1.12*r.x + 0.64*r.y;
            float latitude = -0.56*r.x + 0.97*r.y;
            float hue = longitude*2.8 + r.z*1.8 + 0.16*p.x + drift;
            vec3 color = mix(violet, blue, smoothstep(-0.7, 0.8, r.y)*0.70);
            color = mix(color, pink, smoothstep(-0.35, 0.9, sin(hue+0.3)) * 0.65);
            color = mix(color, cyan, gaussian(longitude+0.60+0.12*r.z, 0.34)*0.83);
            color = mix(color, gold, gaussian(longitude-0.67, 0.28)*0.79);
            color = mix(vec3(0.36, 0.30, 0.65), color, uIridescence);
            color -= min(color.r, min(color.g, color.b))*0.32;

            float thinFilm = 5.2*(1.0-facing)+longitude*2.3+0.2*p.y;
            vec3 interference = 0.5+0.5*cos(thinFilm+vec3(0.3, 2.1, 4.2));
            color += (interference-0.5)*0.12*uIridescence;

            float width = 0.050 / sqrt(uSharpness);
            float band = latitude + 0.15*sin(longitude*3.0) - 0.25;
            float ribbon = gaussian(band, width);
            float shoulder = gaussian(band, 0.19);
            float ribbon2 = gaussian(longitude+0.31+0.13*sin(latitude*2.8), width*0.60);
            float softbox = gaussian(latitude+0.80, 0.30)*gaussian(longitude-0.15, 1.7);
            float warmStrip = gaussian(latitude-0.78, 0.085/sqrt(uSharpness));
            float cyanStrip = gaussian(longitude+0.91, 0.075/sqrt(uSharpness));
            color += vec3(1.0, 0.96, 0.97)*(ribbon*2.5+shoulder*0.22+softbox*0.40);
            color += vec3(0.84, 0.96, 1.0)*ribbon2*1.35;
            color += vec3(1.0, 0.88, 0.46)*warmStrip*1.55;
            color += vec3(0.43, 1.0, 0.96)*cyanStrip*0.85;
            return color;
          }
          void main() {
            vec3 n = normalize(vNormal);
            vec3 view = vec3(0, 0, 1);
            vec3 reflected = reflect(-view, n);
            float facing = clamp(n.z, 0.0, 1.0);
            float fresnel = pow(1.0-facing, 5.0);
            vec3 color = environment(reflected, vDomain, facing);
            // Bright ambient fill keeps the valleys lavender rather than black.
            float depth = smoothstep(-1.0, 0.7, vHeight);
            color *= mix(0.73, 1.02, depth);
            color *= 0.92+0.18*fresnel;
            float curvature = length(fwidth(n));
            color += vec3(0.90, 0.86, 1.0)*min(curvature*1.2, 0.075);
            color += vec3(0.025, 0.018, 0.045);
            if (uColorMode > 0.5) {
              float light = dot(color, vec3(0.2126, 0.7152, 0.0722));
              float coordinate = 0.5+0.30*sin(reflected.x*2.7+reflected.y*1.8+vHeight*0.6)
                               +0.16*sin(reflected.z*3.2+uReflectionLoop.y*0.15);
              vec3 pigment = palette(coordinate);
              if (uColorMode > 1.5) {
                // Neutral and achromatic palettes retain a restrained accent.
                float accentBand = gaussian(reflected.x+reflected.y*0.45-0.42, 0.10);
                pigment = mix(pigment, uAccent, accentBand*0.92);
              }
              float sheen = pow(smoothstep(0.8, 3.0, light), 1.6);
              color = pigment*(0.42+0.75*min(light, 1.4))+vec3(sheen*1.8);
            }
            gl_FragColor = vec4(max(color, vec3(0))*uTint, 1);
          }
        `,
      });

      // One dense sheet; moving or zooming out reveals the selectable backdrop.
      const surface = new THREE.Mesh(new THREE.PlaneGeometry(1, 1, 1, 1), surfaceMaterial);
      surface.frustumCulled = false;
      scene.add(surface);

      const targetOptions = { type: THREE.HalfFloatType, depthBuffer: false, stencilBuffer: false };
      const sceneTarget = new THREE.WebGLRenderTarget(1, 1, targetOptions);
      const bloomA = new THREE.WebGLRenderTarget(1, 1, targetOptions);
      const bloomB = new THREE.WebGLRenderTarget(1, 1, targetOptions);
      const postScene = new THREE.Scene();
      const postCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
      const postGeometry = new THREE.PlaneGeometry(2, 2);
      const postVertex = `varying vec2 vUv; void main() { vUv=uv; gl_Position=vec4(position.xy,0,1); }`;
      const blurMaterial = new THREE.ShaderMaterial({
        depthTest: false, depthWrite: false, toneMapped: false,
        uniforms: {
          tSource: { value: sceneTarget.texture },
          uStep: { value: new THREE.Vector2() },
          uExtract: { value: 1 },
        },
        vertexShader: postVertex,
        fragmentShader: /* glsl */`
          uniform sampler2D tSource;
          uniform vec2 uStep;
          uniform float uExtract;
          varying vec2 vUv;
          vec3 sampleGlow(vec2 uv) {
            vec3 c = texture2D(tSource, uv).rgb;
            float light = max(c.r, max(c.g, c.b));
            return c*mix(1.0, smoothstep(0.85, 1.65, light), uExtract);
          }
          void main() {
            vec3 c = sampleGlow(vUv)*0.227027;
            c += (sampleGlow(vUv+uStep*1.384615)+sampleGlow(vUv-uStep*1.384615))*0.316216;
            c += (sampleGlow(vUv+uStep*3.230769)+sampleGlow(vUv-uStep*3.230769))*0.070270;
            gl_FragColor = vec4(c, 1);
          }
        `,
      });
      const compositeMaterial = new THREE.ShaderMaterial({
        depthTest: false, depthWrite: false,
        uniforms: {
          tScene: { value: sceneTarget.texture },
          tBloom: { value: bloomB.texture },
          uBloom: { value: config.bloomStrength },
          uBackground: { value: new THREE.Vector3() },
          uInvert: { value: 0 },
        },
        vertexShader: postVertex,
        fragmentShader: /* glsl */`
          uniform sampler2D tScene;
          uniform sampler2D tBloom;
          uniform float uBloom;
          uniform vec3 uBackground;
          uniform float uInvert;
          varying vec2 vUv;
          void main() {
            vec4 surface = texture2D(tScene, vUv);
            vec3 color = surface.rgb + texture2D(tBloom, vUv).rgb*uBloom;
            gl_FragColor = vec4(color, 1);
            #include <tonemapping_fragment>
            #include <colorspace_fragment>
            gl_FragColor.rgb = mix(gl_FragColor.rgb, 1.0-gl_FragColor.rgb, uInvert);
            // Composite in display space AFTER tone mapping. Empty pixels stay
            // exactly #00ff00 when chroma key is enabled, with no bloom spill.
            gl_FragColor.rgb = mix(uBackground, gl_FragColor.rgb, surface.a);
            gl_FragColor.a = 1.0;
          }
        `,
      });
      const screen = new THREE.Mesh(postGeometry, compositeMaterial);
      screen.frustumCulled = false;
      postScene.add(screen);

      let frame = 0, disposed = false, contextLost = false;
      let elapsed = 0, lastTime = null;
      let bloomWidth = 1, bloomHeight = 1;
      let viewWidth = 1, viewHeight = 1, paletteCount = 6;
      const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
      const gui = new GUI({ title: 'Liquid Silk', width: 300 });
      const colorControllers = [];
      const framingControllers = [];
      let uiVisible = true;

      function updatePanel() {
        for (const controller of gui.controllersRecursive()) controller.updateDisplay();
        colorControllers.forEach((controller, index) => controller.show(index < paletteCount));
      }

      function updateColors() {
        for (let i = 0; i < 6; i++) {
          uniforms.uPalette.value[i].set(config[`color${i+1}`]);
        }
        uniforms.uPaletteCount.value = paletteCount;
        uniforms.uColorMode.value = !config.customPalette ? 0
          : ['Achromatic + Accent', 'Neutral + accent'].includes(config.scheme) ? 2 : 1;
        uniforms.uAccent.value.set(config.accent);
        uniforms.uTint.value.set(config.tint);
        compositeMaterial.uniforms.uInvert.value = config.invert ? 1 : 0;
        // This is an sRGB display value, deliberately not a linear THREE.Color.
        const background = config.greenscreen ? '#00ff00' : config.background;
        const rgb = parseInt(background.slice(1), 16);
        compositeMaterial.uniforms.uBackground.value.set(
          ((rgb >> 16) & 255)/255, ((rgb >> 8) & 255)/255, (rgb & 255)/255);
        document.body.style.background = background;
      }

      function applyScheme() {
        const colors = schemes[config.scheme];
        paletteCount = colors.length;
        for (let i = 0; i < 6; i++) config[`color${i+1}`] = '#'+colors[Math.min(i, colors.length-1)];
        config.customPalette = config.scheme !== 'Original';
        config.invert = false;
        config.tint = '#ffffff';
        if (config.scheme === 'Achromatic + Accent') config.accent = '#ff243b';
        if (config.scheme === 'Neutral + accent') config.accent = '#ff713e';
        updateColors();
        updatePanel();
      }

      function randomize() {
        const random = (min, max) => Number((min+Math.random()*(max-min)).toFixed(2));
        const names = Object.keys(schemes);
        config.scheme = names[Math.floor(Math.random()*names.length)];
        config.foldScale = random(0.65, 1.35);
        config.displacementAmplitude = random(0.55, 1.25);
        config.twist = random(0.35, 1.65);
        config.seedX = random(-12, 12);
        config.seedY = random(-12, 12);
        config.iridescenceIntensity = random(0.65, 1);
        config.reflectionSharpness = random(0.65, 1.8);
        config.bloomStrength = random(0.08, 0.3);
        config.animation = animations[Math.floor(Math.random()*(animations.length-1))];
        config.animationSpeed = random(0.25, 0.85);
        config.motionAmount = random(0.5, 1.3);
        applyScheme();
        resume();
      }

      const appearance = gui.addFolder('Color & background');
      appearance.add(config, 'scheme', Object.keys(schemes)).name('Color scheme').onChange(applyScheme);
      appearance.addColor(config, 'tint').name('Surface tint').onChange(updateColors);
      appearance.addColor(config, 'accent').name('Accent color').onChange(updateColors);
      appearance.add(config, 'invert').name('Invert B/W').onChange(updateColors);
      appearance.add(config, 'greenscreen').name('Green screen').onChange(updateColors);
      appearance.addColor(config, 'background').name('Background color').onChange(updateColors);
      const paletteFolder = appearance.addFolder('Palette colors');
      paletteFolder.add(config, 'customPalette').name('Use palette colors').onChange(updateColors);
      for (let i = 1; i <= 6; i++) {
        colorControllers.push(paletteFolder.addColor(config, `color${i}`).name(`Color ${i}`).onChange(() => {
          config.customPalette = true;
          updateColors(); updatePanel();
        }));
      }
      paletteFolder.close();

      const motionFolder = gui.addFolder('Animation');
      motionFolder.add(config, 'animation', animations).name('Motion');
      motionFolder.add(config, 'animationSpeed', 0, 2, 0.01).name('Animation speed');
      motionFolder.add(config, 'motionAmount', 0, 2, 0.01).name('Motion amount');
      motionFolder.add(config, 'respectReducedMotion').name('Respect reduced motion');

      const framing = gui.addFolder('Framing');
      framingControllers.push(framing.add(config, 'zoom', 0.2, 5, 0.01).name('Zoom'));
      framingControllers.push(framing.add(config, 'positionX', -20, 20, 0.01).name('Position X'));
      framingControllers.push(framing.add(config, 'positionY', -20, 20, 0.01).name('Position Y'));
      framing.add(config, 'surfaceSize', 0.2, 2, 0.01).name('Surface size');
      framingControllers.push(framing.add(config, 'cameraYaw', -70, 70, 0.1).name('Camera yaw'));
      framingControllers.push(framing.add(config, 'cameraPitch', -65, 65, 0.1).name('Camera pitch'));
      framing.add(config, 'cameraRoll', -180, 180, 0.1).name('Camera roll');
      framing.add({ resetView() {
        Object.assign(config, { zoom: 1, positionX: 0, positionY: 0, surfaceSize: 1,
          cameraYaw: 0, cameraPitch: 0, cameraRoll: 0 });
        updatePanel(); resume();
      } }, 'resetView').name('Reset view');
      framing.close();

      const surfaceFolder = gui.addFolder('Surface');
      surfaceFolder.add(config, 'foldScale', 0.3, 2, 0.01).name('Fold scale');
      surfaceFolder.add(config, 'displacementAmplitude', 0, 1.8, 0.01).name('Displacement');
      surfaceFolder.add(config, 'twist', 0, 2, 0.01).name('Fold twist');
      surfaceFolder.add(config, 'iridescenceIntensity', 0, 1, 0.01).name('Iridescence');
      surfaceFolder.add(config, 'reflectionSharpness', 0.2, 3, 0.01).name('Reflection sharpness');
      surfaceFolder.add(config, 'bloomStrength', 0, 0.7, 0.01).name('Bloom');
      surfaceFolder.add(config, 'seedX', -15, 15, 0.01).name('Seed X');
      surfaceFolder.add(config, 'seedY', -15, 15, 0.01).name('Seed Y');
      surfaceFolder.close();
      gui.add(config, 'pixelRatio', 0.5, 3, 0.05).name('DPR (Pixel Ratio)').onChange(() => {
        resize(); resume();
      });
      gui.add(config, 'randomizeOnClick').name('Randomize on click');
      gui.add({ randomize }, 'randomize').name('New variation');
      gui.onChange(() => resume());

      // Manual framing is a persistent base. Motion is layered on top and never
      // writes back to the user's zoom, translation, or camera angles.
      function updateMotion() {
        const phase = Math.PI*2*((elapsed % config.loopDuration)/config.loopDuration);
        const s = Math.sin(phase), c = Math.cos(phase);
        const amount = config.motionAmount;
        const mode = config.animation;
        const still = mode === 'Static';
        uniforms.uLoop.value.set(still ? 1 : c, still ? 0 : s);
        uniforms.uReflectionLoop.value.set(still ? 1 : c, still ? 0 : s);
        uniforms.uFlow.value = still || mode === 'Reflection drift' ? 0 : amount;
        uniforms.uSeed.value.set(config.seedX, config.seedY);
        uniforms.uTwist.value = config.twist;
        uniforms.uDomainOffset.value.set(0, 0);
        let amplitude = config.displacementAmplitude;
        let yaw = 0, pitch = 0, roll = 0, dolly = 1;
        let floatX = 0, floatY = 0;
        switch (mode) {
          case 'Silk drift':
            uniforms.uDomainOffset.value.set(0.18*s*amount, 0.12*(c-1)*amount);
            break;
          case 'Tidal folds':
            uniforms.uDomainOffset.value.set(0.08*(c-1)*amount, 0.25*s*amount);
            uniforms.uTwist.value *= 1+0.10*s*amount;
            break;
          case 'Pearl pulse':
            amplitude *= 1+0.10*s*amount;
            break;
          case 'Reflection drift':
            uniforms.uLoop.value.set(1, 0);
            uniforms.uReflectionLoop.value.set(c, s*2*amount);
            break;
          case 'Gentle orbit':
            yaw = 14*s*amount; pitch = 9*(c-1)*amount;
            break;
          case 'Floating silk':
            floatX = 0.12*s*amount; floatY = 0.08*(c-1)*amount;
            roll = 2*s*amount;
            break;
          case 'Camera glide':
            yaw = 6*s*amount; pitch = 5*Math.sin(phase*2)*amount;
            dolly = Math.exp(0.09*s*amount);
            break;
        }
        uniforms.uScale.value = config.foldScale;
        uniforms.uAmplitude.value = amplitude;
        uniforms.uIridescence.value = config.iridescenceIntensity;
        uniforms.uSharpness.value = Math.max(0.1, config.reflectionSharpness);
        surface.scale.setScalar(config.surfaceSize);
        surface.position.set(config.positionX+floatX, config.positionY+floatY, 0);
        const azimuth = THREE.MathUtils.degToRad(THREE.MathUtils.clamp(config.cameraYaw+yaw, -82, 82));
        const elevation = THREE.MathUtils.degToRad(THREE.MathUtils.clamp(config.cameraPitch+pitch, -78, 78));
        camera.position.set(12*Math.sin(azimuth)*Math.cos(elevation), 12*Math.sin(elevation),
          12*Math.cos(azimuth)*Math.cos(elevation));
        camera.up.set(0, 1, 0);
        camera.lookAt(0, 0, 0);
        camera.rotateZ(THREE.MathUtils.degToRad(config.cameraRoll+roll));
        camera.zoom = config.zoom*dolly;
        camera.updateProjectionMatrix();
        camera.updateMatrixWorld();
      }

      function resize() {
        const width = Math.max(1, innerWidth), height = Math.max(1, innerHeight);
        const ratio = config.pixelRatio;
        renderer.setPixelRatio(ratio);
        renderer.setSize(width, height, false);
        const aspect = width / height;
        // Crop a stable macro view rather than stretching it in portrait.
        viewHeight = aspect < 1 ? 6.8 : 5.0;
        viewWidth = viewHeight*aspect;
        camera.left = -viewWidth/2;
        camera.right = viewWidth/2;
        camera.top = viewHeight/2;
        camera.bottom = -viewHeight/2;
        camera.updateProjectionMatrix();
        const oldGeometry = surface.geometry;
        const segmentsY = 288;
        const segmentsX = Math.max(128, Math.min(768, Math.ceil(segmentsY*aspect)));
        surface.geometry = new THREE.PlaneGeometry(viewWidth*1.01, viewHeight*1.01, segmentsX, segmentsY);
        oldGeometry.dispose();
        const size = renderer.getDrawingBufferSize(new THREE.Vector2());
        sceneTarget.setSize(size.x, size.y);
        bloomWidth = Math.max(1, Math.ceil(size.x/4));
        bloomHeight = Math.max(1, Math.ceil(size.y/4));
        bloomA.setSize(bloomWidth, bloomHeight);
        bloomB.setSize(bloomWidth, bloomHeight);
      }

      function render() {
        updateMotion();
        renderer.setRenderTarget(sceneTarget);
        renderer.render(scene, camera);
        screen.material = blurMaterial;
        blurMaterial.uniforms.tSource.value = sceneTarget.texture;
        blurMaterial.uniforms.uExtract.value = 1;
        blurMaterial.uniforms.uStep.value.set(1.5/bloomWidth, 0);
        renderer.setRenderTarget(bloomA);
        renderer.render(postScene, postCamera);
        blurMaterial.uniforms.tSource.value = bloomA.texture;
        blurMaterial.uniforms.uExtract.value = 0;
        blurMaterial.uniforms.uStep.value.set(0, 1.5/bloomHeight);
        renderer.setRenderTarget(bloomB);
        renderer.render(postScene, postCamera);
        screen.material = compositeMaterial;
        compositeMaterial.uniforms.uBloom.value = config.bloomStrength;
        renderer.setRenderTarget(null);
        renderer.render(postScene, postCamera);
      }

      function animate(now) {
        frame = 0;
        if (disposed || contextLost || document.hidden) return;
        if (lastTime !== null && !(config.respectReducedMotion && reducedMotion.matches)) {
          elapsed += Math.min((now-lastTime)/1000, 0.1)*config.animationSpeed;
        }
        lastTime = now;
        render();
        if (!(config.respectReducedMotion && reducedMotion.matches)) frame = requestAnimationFrame(animate);
      }
      function resume() {
        if (!frame && !disposed && !contextLost && !document.hidden) {
          lastTime = null;
          frame = requestAnimationFrame(animate);
        }
      }
      const raycaster = new THREE.Raycaster();
      const dragPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
      const pointerNdc = new THREE.Vector2();
      const dragFrom = new THREE.Vector3(), dragTo = new THREE.Vector3();
      let pointer = null;

      function pointOnSheet(clientX, clientY, target) {
        const bounds = canvas.getBoundingClientRect();
        pointerNdc.set(2*(clientX-bounds.left)/bounds.width-1, 1-2*(clientY-bounds.top)/bounds.height);
        raycaster.setFromCamera(pointerNdc, camera);
        return raycaster.ray.intersectPlane(dragPlane, target);
      }
      function updateFramingPanel() {
        for (const controller of framingControllers) controller.updateDisplay();
      }
      function onWheel(event) {
        event.preventDefault();
        const unit = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? innerHeight : 1;
        config.zoom = THREE.MathUtils.clamp(config.zoom*Math.exp(-event.deltaY*unit*0.001), 0.2, 5);
        updateFramingPanel();
        resume();
      }
      function onPointerDown(event) {
        if (pointer || (event.button !== 0 && event.button !== 2)) return;
        pointer = { id: event.pointerId, startX: event.clientX, startY: event.clientY,
          lastX: event.clientX, lastY: event.clientY, moved: false,
          orbit: event.button === 2 || event.altKey };
        canvas.setPointerCapture(event.pointerId);
        canvas.style.cursor = 'grabbing';
      }
      function onPointerMove(event) {
        if (!pointer || pointer.id !== event.pointerId) return;
        if (Math.hypot(event.clientX-pointer.startX, event.clientY-pointer.startY) > 5) pointer.moved = true;
        if (!pointer.moved) return;
        if (pointer.orbit) {
          config.cameraYaw = THREE.MathUtils.clamp(config.cameraYaw+(event.clientX-pointer.lastX)*0.15, -70, 70);
          config.cameraPitch = THREE.MathUtils.clamp(config.cameraPitch+(event.clientY-pointer.lastY)*0.15, -65, 65);
        } else if (pointOnSheet(pointer.lastX, pointer.lastY, dragFrom)
          && pointOnSheet(event.clientX, event.clientY, dragTo)) {
          config.positionX = THREE.MathUtils.clamp(config.positionX+dragTo.x-dragFrom.x, -20, 20);
          config.positionY = THREE.MathUtils.clamp(config.positionY+dragTo.y-dragFrom.y, -20, 20);
        }
        pointer.lastX = event.clientX;
        pointer.lastY = event.clientY;
        updateFramingPanel();
        resume();
      }
      function endPointer(event, cancelled = false) {
        if (!pointer || pointer.id !== event.pointerId) return;
        const clicked = !cancelled && !pointer.orbit && !pointer.moved
          && Math.hypot(event.clientX-pointer.startX, event.clientY-pointer.startY) <= 5;
        pointer = null;
        if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
        canvas.style.cursor = '';
        if (clicked && config.randomizeOnClick) randomize();
      }
      function onPointerUp(event) { endPointer(event); }
      function onPointerCancel(event) { endPointer(event, true); }
      function onLostCapture() { pointer = null; canvas.style.cursor = ''; }
      function onContextMenu(event) { event.preventDefault(); }
      function onKeyDown(event) {
        if (event.code !== 'KeyH' || event.repeat || event.ctrlKey || event.altKey || event.metaKey) return;
        const target = event.target;
        if (target instanceof HTMLElement && (target.isContentEditable
          || target.closest('input:not([type="checkbox"]):not([type="range"]), textarea'))) return;
        uiVisible = !uiVisible;
        gui.show(uiVisible);
      }
      function onResize() { resize(); resume(); }
      function onVisibility() {
        if (document.hidden) { cancelAnimationFrame(frame); frame = 0; lastTime = null; }
        else resume();
      }
      function onContextLost(event) {
        event.preventDefault();
        contextLost = true;
        cancelAnimationFrame(frame);
        frame = 0;
      }
      function onContextRestored() {
        contextLost = false;
        renderer.setClearColor(0x000000, 0);
        updateColors();
        resize();
        resume();
      }
      function onPageHide(event) {
        if (event.persisted) { cancelAnimationFrame(frame); frame = 0; lastTime = null; }
        else dispose();
      }
      function dispose() {
        if (disposed) return;
        disposed = true;
        cancelAnimationFrame(frame);
        removeEventListener('resize', onResize);
        removeEventListener('pagehide', onPageHide);
        removeEventListener('pageshow', resume);
        removeEventListener('keydown', onKeyDown);
        document.removeEventListener('visibilitychange', onVisibility);
        reducedMotion.removeEventListener('change', resume);
        canvas.removeEventListener('webglcontextlost', onContextLost);
        canvas.removeEventListener('webglcontextrestored', onContextRestored);
        canvas.removeEventListener('wheel', onWheel);
        canvas.removeEventListener('pointerdown', onPointerDown);
        canvas.removeEventListener('pointermove', onPointerMove);
        canvas.removeEventListener('pointerup', onPointerUp);
        canvas.removeEventListener('pointercancel', onPointerCancel);
        canvas.removeEventListener('lostpointercapture', onLostCapture);
        canvas.removeEventListener('contextmenu', onContextMenu);
        gui.destroy();
        surface.geometry.dispose();
        surfaceMaterial.dispose();
        postGeometry.dispose();
        blurMaterial.dispose();
        compositeMaterial.dispose();
        sceneTarget.dispose(); bloomA.dispose(); bloomB.dispose();
        scene.clear(); postScene.clear();
        renderer.dispose();
      }

      addEventListener('resize', onResize, { passive: true });
      addEventListener('pagehide', onPageHide);
      addEventListener('pageshow', resume);
      addEventListener('keydown', onKeyDown);
      document.addEventListener('visibilitychange', onVisibility);
      reducedMotion.addEventListener('change', resume);
      canvas.addEventListener('webglcontextlost', onContextLost);
      canvas.addEventListener('webglcontextrestored', onContextRestored);
      canvas.addEventListener('wheel', onWheel, { passive: false });
      canvas.addEventListener('pointerdown', onPointerDown);
      canvas.addEventListener('pointermove', onPointerMove);
      canvas.addEventListener('pointerup', onPointerUp);
      canvas.addEventListener('pointercancel', onPointerCancel);
      canvas.addEventListener('lostpointercapture', onLostCapture);
      canvas.addEventListener('contextmenu', onContextMenu);
      applyScheme();
      resize();
      resume();
    }
  </script>
</body>
</html>
