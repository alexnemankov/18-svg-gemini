<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Kinetic Rotated Vector Matrix - 478</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000;
      user-select: none;
      -webkit-user-select: none;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100vw !important;
      height: 100vh !important;
      cursor: grab;
      touch-action: none;
    }
    canvas:active {
      cursor: grabbing;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
      "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
    }
  }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import GUI from 'lil-gui';

    /* Raymond G McCord (slow_izzm) - Kinetic Vector Field Core Concept
       Transformed into a dynamic, interactive 3D WebGL experience
    */

    // =========================================================================
    // 19+ PRECONFIGURED COLOR SCHEMES
    // =========================================================================
    const COLOR_SCHEMES = {
      'Original': {
        background: '#ffffff',
        strokePrimary: '#000000',
        strokeSecondary: '#222222',
        accent: '#444444',
        ambient: '#dddddd'
      },
      'Monochromatic': {
        background: '#020b14',
        strokePrimary: '#00b4d8',
        strokeSecondary: '#0077b6',
        accent: '#90e0ef',
        ambient: '#0b2545'
      },
      'Analogous': {
        background: '#041118',
        strokePrimary: '#00e5ff',
        strokeSecondary: '#00b4d8',
        accent: '#38ef7d',
        ambient: '#082433'
      },
      'Complementary': {
        background: '#0a0812',
        strokePrimary: '#ff5722',
        strokeSecondary: '#00d4ff',
        accent: '#ff9100',
        ambient: '#1a1028'
      },
      'Split-complementary': {
        background: '#080914',
        strokePrimary: '#ff0055',
        strokeSecondary: '#00e5ff',
        accent: '#ffb703',
        ambient: '#16132e'
      },
      'Triadic': {
        background: '#0c0616',
        strokePrimary: '#00f0ff',
        strokeSecondary: '#e040fb',
        accent: '#ffd600',
        ambient: '#1c1236'
      },
      'Tetradic': {
        background: '#070b10',
        strokePrimary: '#00e5ff',
        strokeSecondary: '#76ff03',
        accent: '#ff1744',
        ambient: '#121b24'
      },
      'Double split-complementary': {
        background: '#0a0518',
        strokePrimary: '#00f5d4',
        strokeSecondary: '#f15bb5',
        accent: '#fee440',
        ambient: '#1a1230'
      },
      'Achromatic (black and white)': {
        background: '#000000',
        strokePrimary: '#ffffff',
        strokeSecondary: '#cccccc',
        accent: '#888888',
        ambient: '#222222'
      },
      'Achromatic (white and black)': {
        background: '#ffffff',
        strokePrimary: '#000000',
        strokeSecondary: '#333333',
        accent: '#666666',
        ambient: '#e0e0e0'
      },
      'Achromatic + Accent (black and white + red)': {
        background: '#050505',
        strokePrimary: '#ffffff',
        strokeSecondary: '#777777',
        accent: '#ff1744',
        ambient: '#260a0f'
      },
      'Achromatic + Accent (white and black + red)': {
        background: '#f5f5f5',
        strokePrimary: '#111111',
        strokeSecondary: '#555555',
        accent: '#d50000',
        ambient: '#fae1e1'
      },
      'Neutral + accent': {
        background: '#18181b',
        strokePrimary: '#d4d4d8',
        strokeSecondary: '#71717a',
        accent: '#f59e0b',
        ambient: '#27272a'
      },
      'Palette 1 (F6AA1C, BC3908, 941B0C, F6AA1C, 220901)': {
        background: '#220901',
        strokePrimary: '#F6AA1C',
        strokeSecondary: '#BC3908',
        accent: '#941B0C',
        ambient: '#3a1306'
      },
      'Palette 2 (63D1CF, 5BC0BE, 4BAD9E, 4BAD9E, 0B132B, 000000)': {
        background: '#000000',
        strokePrimary: '#63D1CF',
        strokeSecondary: '#5BC0BE',
        accent: '#4BAD9E',
        ambient: '#0B132B'
      },
      'Palette 3 (AA60C8, D69ADE, C9A3C6, CFB5C2, 0D001D, 120A12)': {
        background: '#0D001D',
        strokePrimary: '#AA60C8',
        strokeSecondary: '#D69ADE',
        accent: '#C9A3C6',
        ambient: '#120A12'
      },
      'Palette 4 (FEF1BE, FFBA00, 008189, 00474D, 061210)': {
        background: '#061210',
        strokePrimary: '#FEF1BE',
        strokeSecondary: '#FFBA00',
        accent: '#008189',
        ambient: '#00474D'
      },
      'Palette 5 (D4FFB0, 7FFF00, 00B894, 0A3322, 05140A)': {
        background: '#05140A',
        strokePrimary: '#D4FFB0',
        strokeSecondary: '#7FFF00',
        accent: '#00B894',
        ambient: '#0A3322'
      },
      'Palette 6 (FFE8CC, FF8C00, C7501A, 3D1050, 0E0618)': {
        background: '#0E0618',
        strokePrimary: '#FFE8CC',
        strokeSecondary: '#FF8C00',
        accent: '#C7501A',
        ambient: '#3D1050'
      },
      'Palette 7 (E8E0FF, B38FFF, 6A3DE8, 1A1250, 090612)': {
        background: '#090612',
        strokePrimary: '#E8E0FF',
        strokeSecondary: '#B38FFF',
        accent: '#6A3DE8',
        ambient: '#1A1250'
      },
      'Palette 8 (E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)': {
        background: '#05020F',
        strokePrimary: '#E0FBFF',
        strokeSecondary: '#00F0FF',
        accent: '#D40078',
        ambient: '#1E0A3D'
      }
    };

    // =========================================================================
    // 8 PRECONFIGURED CAMERA ANIMATIONS
    // =========================================================================
    const ANIMATION_PRESETS = [
      'Static (No Camera Motion)',
      'Gentle Horizon Orbit',
      'Slow Harmonic Drift',
      'Cinematic Lissajous Pan',
      'Floating Pendulum Sway',
      'Cosmic Spiral Ascend',
      'Ethereal Breathing Glide',
      'Dynamic Oblique Wave'
    ];

    // =========================================================================
    // PARAMETERS & INITIAL STATE
    // =========================================================================
    const initialScheme = COLOR_SCHEMES['Original'];

    const params = {
      // Theme & Colors
      colorScheme: 'Original',
      greenscreen: false,
      backgroundColor: initialScheme.background,
      strokePrimary: initialScheme.strokePrimary,
      strokeSecondary: initialScheme.strokeSecondary,
      accentColor: initialScheme.accent,
      ambientColor: initialScheme.ambient,

      // Camera & Motion
      animation: 'Gentle Horizon Orbit',
      animationSpeed: 1.0,
      dragMode: 'Orbit (Left) / Pan (Right)',
      attractorMode: 'Auto Flow + Mouse Influence',
      attractorSpeed: 1.0,

      // Geometry & Dynamics (Classic: sizer=13, strokeWeight=17, prox=20)
      vectorFormula: 'Raymond McCord Classic (Rotated Vortex)',
      geometryShape: 'Smooth Capsule (CodePen Exact)',
      sizer: 13.0,
      strokeWeight: 17.0,
      prox: 20.0,
      waveDepth: 0.0,
      waveFreq: 0.015,
      twist: 0.0,

      // Material & Lighting
      materialStyle: 'Physical Studio',
      roughness: 0.35,
      metalness: 0.1,
      exposure: 1.0,
      ambientIntensity: 0.8,
      keyLightIntensity: 2.0,
      rimLightIntensity: 1.0,
      vortexLightIntensity: 2.5,

      // Display & System
      dpr: Math.min(window.devicePixelRatio || 1, 2),
      randomizeOnClick: true
    };

    // Grid Dimensions
    const GRID_WIDTH = 1400;
    const GRID_HEIGHT = 1000;

    // =========================================================================
    // SCENE, CAMERA, RENDERER & ORBIT CONTROLS
    // =========================================================================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(params.backgroundColor);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 1, 4000);
    camera.position.set(0, 0, 750);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(params.dpr);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = params.exposure;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.screenSpacePanning = true;
    controls.enableZoom = true;
    controls.minDistance = 60;
    controls.maxDistance = 2500;
    controls.target.set(0, 0, 0);

    function updateDragMode() {
      if (params.dragMode === 'Pan (Left) / Orbit (Right)') {
        controls.mouseButtons.LEFT = THREE.MOUSE.PAN;
        controls.mouseButtons.RIGHT = THREE.MOUSE.ROTATE;
      } else {
        controls.mouseButtons.LEFT = THREE.MOUSE.ROTATE;
        controls.mouseButtons.RIGHT = THREE.MOUSE.PAN;
      }
    }
    updateDragMode();

    // =========================================================================
    // LIGHTING SETUP
    // =========================================================================
    const ambientLight = new THREE.AmbientLight(params.ambientColor, params.ambientIntensity);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xffffff, params.keyLightIntensity);
    keyLight.position.set(250, 350, 500);
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0xffffff, params.rimLightIntensity);
    rimLight.position.set(-250, -250, -300);
    scene.add(rimLight);

    const vortexLight = new THREE.PointLight(params.accentColor, params.vortexLightIntensity, 500, 1.4);
    vortexLight.position.set(0, 0, 45);
    scene.add(vortexLight);

    function updateLights() {
      ambientLight.color.set(params.ambientColor);
      ambientLight.intensity = params.ambientIntensity;
      keyLight.intensity = params.keyLightIntensity;
      rimLight.intensity = params.rimLightIntensity;
      vortexLight.color.set(params.accentColor);
      vortexLight.intensity = params.vortexLightIntensity;
    }

    function updateBackground() {
      if (params.greenscreen) {
        scene.background = new THREE.Color('#00ff00');
      } else {
        scene.background = new THREE.Color(params.backgroundColor);
      }
    }

    // =========================================================================
    // MESH & GRID GENERATION
    // =========================================================================
    let instancedMesh = null;
    let gridPoints = [];

    const dummy = new THREE.Object3D();
    const tempColor = new THREE.Color();
    const primaryColor = new THREE.Color();
    const secondaryColor = new THREE.Color();
    const accentColor = new THREE.Color();

    function buildGrid() {
      if (instancedMesh) {
        scene.remove(instancedMesh);
        instancedMesh.geometry.dispose();
        if (Array.isArray(instancedMesh.material)) {
          instancedMesh.material.forEach(m => m.dispose());
        } else {
          instancedMesh.material.dispose();
        }
        instancedMesh = null;
      }

      const prox = params.prox;
      const cols = Math.floor(GRID_WIDTH / prox) + 1;
      const rows = Math.floor(GRID_HEIGHT / prox) + 1;
      const totalCount = cols * rows;

      gridPoints = [];
      const startX = -((cols - 1) * prox) / 2;
      const startY = -((rows - 1) * prox) / 2;

      for (let j = 0; j < rows; j++) {
        for (let i = 0; i < cols; i++) {
          gridPoints.push({
            x: startX + i * prox,
            y: startY + j * prox
          });
        }
      }

      // Base geometry dimensions (normalized to sizer=13, strokeWeight=17)
      const baseRadius = 8.5;
      const baseLength = 13.0;
      let geom;

      if (params.geometryShape === 'Smooth Capsule (CodePen Exact)') {
        geom = new THREE.CapsuleGeometry(baseRadius, baseLength, 6, 12);
      } else if (params.geometryShape === 'Cylinder Rod') {
        geom = new THREE.CylinderGeometry(baseRadius, baseRadius, baseLength + baseRadius * 2, 12);
      } else if (params.geometryShape === 'Flat Ribbon') {
        geom = new THREE.BoxGeometry(baseRadius * 2, baseLength + baseRadius * 2, 2.5);
      } else if (params.geometryShape === 'Sharp Needle') {
        geom = new THREE.ConeGeometry(baseRadius * 1.5, baseLength + baseRadius * 2, 12);
      } else {
        geom = new THREE.CapsuleGeometry(baseRadius, baseLength, 6, 12);
      }

      let mat;
      if (params.materialStyle === 'Unshaded Graphic Art') {
        mat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      } else if (params.materialStyle === 'Metallic Mirror') {
        mat = new THREE.MeshStandardMaterial({
          color: 0xffffff,
          roughness: 0.15,
          metalness: 0.85
        });
      } else {
        mat = new THREE.MeshStandardMaterial({
          color: 0xffffff,
          roughness: params.roughness,
          metalness: params.metalness
        });
      }

      instancedMesh = new THREE.InstancedMesh(geom, mat, totalCount);
      instancedMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);

      // Initialize with unit transforms & default color
      for (let i = 0; i < totalCount; i++) {
        dummy.position.set(gridPoints[i].x, gridPoints[i].y, 0);
        dummy.updateMatrix();
        instancedMesh.setMatrixAt(i, dummy.matrix);
        instancedMesh.setColorAt(i, new THREE.Color(params.strokePrimary));
      }

      instancedMesh.instanceMatrix.needsUpdate = true;
      if (instancedMesh.instanceColor) instancedMesh.instanceColor.needsUpdate = true;

      scene.add(instancedMesh);
    }

    // =========================================================================
    // COLOR SCHEME APPLICATION
    // =========================================================================
    function applyColorScheme(name) {
      const scheme = COLOR_SCHEMES[name];
      if (!scheme) return;
      params.colorScheme = name;
      params.backgroundColor = scheme.background;
      params.strokePrimary = scheme.strokePrimary;
      params.strokeSecondary = scheme.strokeSecondary;
      params.accentColor = scheme.accent;
      params.ambientColor = scheme.ambient;

      updateBackground();
      updateLights();
    }

    // =========================================================================
    // INTERACTIVE ATTRACTOR & VECTOR CALCULATION
    // =========================================================================
    const currentAttractor = new THREE.Vector2(0, 0);
    const mouseInWorld = new THREE.Vector2(0, 0);
    const planeZ = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
    const raycaster = new THREE.Raycaster();
    const mouseNDC = new THREE.Vector2();
    const hitPoint = new THREE.Vector3();
    let isMouseActive = false;

    function onPointerMove(e) {
      mouseNDC.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouseNDC.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouseNDC, camera);
      if (raycaster.ray.intersectPlane(planeZ, hitPoint)) {
        mouseInWorld.x = hitPoint.x;
        mouseInWorld.y = hitPoint.y;
        isMouseActive = true;
      }
    }

    function calcHeading(dx, dy, formula) {
      let hx, hy;
      switch (formula) {
        case 'Opposite Swirl':
          hx = -dy - dx;
          hy = dx - dy;
          break;
        case 'Hyperbolic Saddle':
          hx = dx;
          hy = -dy;
          break;
        case 'Radial Spiral Sink':
          hx = -dx - 0.7 * dy;
          hy = -dy + 0.7 * dx;
          break;
        case 'Harmonic Wave Vortex':
          hx = Math.sin(dy * 0.04) * 45 - dx;
          hy = Math.cos(dx * 0.04) * 45 - dy;
          break;
        case 'Raymond McCord Classic (Rotated Vortex)':
        default:
          /* Core Raymond G McCord (slow_izzm) formula:
             calcVec(x, y) => Vector(y - x, -x - y)
          */
          hx = dy - dx;
          hy = -dx - dy;
          break;
      }
      return Math.atan2(hy, hx);
    }

    // =========================================================================
    // PROCEDURAL CLICK RANDOMIZER & POINTER EVENTS
    // =========================================================================
    let pointerDownX = 0;
    let pointerDownY = 0;
    let pointerDownTime = 0;
    let isUserInteracting = false;

    function randomizeScene() {
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      params.colorScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      applyColorScheme(params.colorScheme);

      const anims = ANIMATION_PRESETS;
      params.animation = anims[Math.floor(Math.random() * anims.length)];

      const formulas = [
        'Raymond McCord Classic (Rotated Vortex)',
        'Opposite Swirl',
        'Hyperbolic Saddle',
        'Radial Spiral Sink',
        'Harmonic Wave Vortex'
      ];
      params.vectorFormula = formulas[Math.floor(Math.random() * formulas.length)];

      const shapes = [
        'Smooth Capsule (CodePen Exact)',
        'Cylinder Rod',
        'Flat Ribbon',
        'Sharp Needle'
      ];
      params.geometryShape = shapes[Math.floor(Math.random() * shapes.length)];

      params.sizer = +(8.0 + Math.random() * 18.0).toFixed(1);
      params.strokeWeight = +(10.0 + Math.random() * 16.0).toFixed(1);
      params.waveDepth = +(Math.random() < 0.45 ? 0.0 : Math.random() * 38.0).toFixed(1);
      params.twist = +(Math.random() * 1.2).toFixed(2);
      params.animationSpeed = +(0.6 + Math.random() * 1.2).toFixed(2);
      params.attractorSpeed = +(0.6 + Math.random() * 1.2).toFixed(2);

      buildGrid();
      updateGuiDisplay();
    }

    window.addEventListener('pointerdown', (e) => {
      if (e.target !== renderer.domElement) return;
      pointerDownX = e.clientX;
      pointerDownY = e.clientY;
      pointerDownTime = performance.now();
      isUserInteracting = true;
    });

    window.addEventListener('pointermove', onPointerMove);

    window.addEventListener('pointerup', (e) => {
      isUserInteracting = false;
      if (e.target !== renderer.domElement || e.button !== 0) return;
      const dist = Math.hypot(e.clientX - pointerDownX, e.clientY - pointerDownY);
      const duration = performance.now() - pointerDownTime;

      // Click threshold: only randomize if user clicked, NOT dragged or orbited
      if (dist < 6 && duration < 320 && params.randomizeOnClick) {
        randomizeScene();
      }
    });

    // =========================================================================
    // GUI SETUP (lil-gui without custom stylesheet modifications)
    // =========================================================================
    const gui = new GUI({ title: 'Scene Controls' });

    // 1. Theme & Colors
    const folderColor = gui.addFolder('Theme & Colors');
    folderColor.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Color Scheme').onChange(v => {
      applyColorScheme(v);
      updateGuiDisplay();
    });
    folderColor.add(params, 'greenscreen').name('Greenscreen (#00ff00)').onChange(updateBackground);
    folderColor.addColor(params, 'backgroundColor').name('Background Color').onChange(updateBackground);
    folderColor.addColor(params, 'strokePrimary').name('Stroke Primary Color');
    folderColor.addColor(params, 'strokeSecondary').name('Stroke Secondary Color');
    folderColor.addColor(params, 'accentColor').name('Vortex Accent Color').onChange(updateLights);

    // 2. Camera & Motion
    const folderAnim = gui.addFolder('Camera & Motion');
    folderAnim.add(params, 'animation', ANIMATION_PRESETS).name('Camera Animation');
    folderAnim.add(params, 'animationSpeed', 0.0, 3.0, 0.05).name('Animation Speed');
    folderAnim.add(params, 'dragMode', [
      'Orbit (Left) / Pan (Right)',
      'Pan (Left) / Orbit (Right)'
    ]).name('Drag Mode').onChange(updateDragMode);
    folderAnim.add(params, 'attractorMode', [
      'Auto Flow + Mouse Influence',
      'Pure Auto Motion',
      'Direct Mouse Tracking'
    ]).name('Attractor Mode');
    folderAnim.add(params, 'attractorSpeed', 0.1, 3.0, 0.05).name('Attractor Speed');

    // 3. Geometry & Vector Field
    const folderGeom = gui.addFolder('Geometry & Vector Field');
    folderGeom.add(params, 'vectorFormula', [
      'Raymond McCord Classic (Rotated Vortex)',
      'Opposite Swirl',
      'Hyperbolic Saddle',
      'Radial Spiral Sink',
      'Harmonic Wave Vortex'
    ]).name('Vector Formula');
    folderGeom.add(params, 'geometryShape', [
      'Smooth Capsule (CodePen Exact)',
      'Cylinder Rod',
      'Flat Ribbon',
      'Sharp Needle'
    ]).name('Geometry Shape').onChange(buildGrid);
    folderGeom.add(params, 'sizer', 4.0, 35.0, 0.5).name('Stroke Length (sizer)');
    folderGeom.add(params, 'strokeWeight', 3.0, 35.0, 0.5).name('Stroke Thickness');
    folderGeom.add(params, 'prox', 15.0, 35.0, 1.0).name('Grid Spacing (prox)').onChange(buildGrid);
    folderGeom.add(params, 'waveDepth', 0.0, 60.0, 1.0).name('3D Wave Depth');
    folderGeom.add(params, 'waveFreq', 0.005, 0.05, 0.002).name('Wave Frequency');
    folderGeom.add(params, 'twist', 0.0, 2.0, 0.05).name('Spatial Twist');

    // 4. Material & Lighting
    const folderMat = gui.addFolder('Material & Lighting');
    folderMat.add(params, 'materialStyle', [
      'Physical Studio',
      'Metallic Mirror',
      'Unshaded Graphic Art'
    ]).name('Material Style').onChange(buildGrid);
    folderMat.add(params, 'roughness', 0.0, 1.0, 0.05).name('Roughness').onChange(v => {
      if (instancedMesh && instancedMesh.material.roughness !== undefined) {
        instancedMesh.material.roughness = v;
      }
    });
    folderMat.add(params, 'metalness', 0.0, 1.0, 0.05).name('Metalness').onChange(v => {
      if (instancedMesh && instancedMesh.material.metalness !== undefined) {
        instancedMesh.material.metalness = v;
      }
    });
    folderMat.add(params, 'exposure', 0.2, 3.0, 0.05).name('Exposure').onChange(v => {
      renderer.toneMappingExposure = v;
    });
    folderMat.add(params, 'ambientIntensity', 0.0, 2.0, 0.05).name('Ambient Light').onChange(updateLights);
    folderMat.add(params, 'keyLightIntensity', 0.0, 5.0, 0.1).name('Key Light').onChange(updateLights);
    folderMat.add(params, 'vortexLightIntensity', 0.0, 5.0, 0.1).name('Vortex Point Light').onChange(updateLights);

    // 5. Display & System
    const folderDisplay = gui.addFolder('Display Settings');
    folderDisplay.add(params, 'dpr', 0.5, 3.0, 0.25).name('Pixel Ratio (DPR)').onChange(v => {
      renderer.setPixelRatio(v);
    });
    folderDisplay.add(params, 'randomizeOnClick').name('Randomize on Click');

    const cameraActions = {
      reset: function() {
        controls.target.set(0, 0, 0);
        camera.position.set(0, 0, 750);
        camera.lookAt(0, 0, 0);
        controls.update();
      }
    };
    folderDisplay.add(cameraActions, 'reset').name('Reset Camera View');

    function updateGuiDisplay() {
      function traverse(f) {
        if (f.controllers) f.controllers.forEach(c => c.updateDisplay());
        if (f.folders) f.folders.forEach(child => traverse(child));
      }
      traverse(gui);
    }

    // Toggle GUI visibility with 'H' key
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        gui._hidden ? gui.show() : gui.hide();
      }
    });

    // Window Resize Handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Build Initial Grid & Theme
    buildGrid();
    applyColorScheme('Original');

    // =========================================================================
    // ANIMATION & RENDER LOOP
    // =========================================================================
    let prevTime = performance.now();
    let simTime = 0;
    let animTime = 0;

    function renderLoop(currentTime) {
      requestAnimationFrame(renderLoop);

      const delta = Math.min((currentTime - prevTime) / 1000, 0.1);
      prevTime = currentTime;

      const speedDelta = delta * params.animationSpeed;
      simTime += speedDelta * 0.8;
      animTime += speedDelta;

      // =======================================================================
      // 1. Camera Animation with Zoom & Angle Persistence
      // Smooth slow animations, user wheel zoom and manual angle retained!
      // =======================================================================
      if (params.animation === 'Static (No Camera Motion)') {
        controls.autoRotate = false;
        controls.update();
      } else if (params.animation === 'Gentle Horizon Orbit') {
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.65 * params.animationSpeed;
        controls.update();
      } else {
        controls.autoRotate = false;
        controls.update();

        // Apply relative spherical deltas while preserving current camera distance & manual angle
        if (!isUserInteracting) {
          const offset = camera.position.clone().sub(controls.target);
          const spherical = new THREE.Spherical().setFromVector3(offset);
          // Note: spherical.radius is explicitly preserved, maintaining wheel zoom!

          if (params.animation === 'Slow Harmonic Drift') {
            spherical.theta += Math.sin(animTime * 0.4) * 0.0025 * params.animationSpeed;
            spherical.phi = THREE.MathUtils.clamp(
              spherical.phi + Math.cos(animTime * 0.3) * 0.0015 * params.animationSpeed,
              0.15, Math.PI - 0.15
            );
          } else if (params.animation === 'Cinematic Lissajous Pan') {
            spherical.theta += 0.0035 * params.animationSpeed;
            spherical.phi = THREE.MathUtils.clamp(
              spherical.phi + Math.sin(animTime * 0.5) * 0.002 * params.animationSpeed,
              0.2, Math.PI - 0.2
            );
          } else if (params.animation === 'Floating Pendulum Sway') {
            spherical.theta += Math.cos(animTime * 0.5) * 0.004 * params.animationSpeed;
          } else if (params.animation === 'Cosmic Spiral Ascend') {
            spherical.theta += 0.003 * params.animationSpeed;
            spherical.phi = THREE.MathUtils.clamp(
              spherical.phi + Math.sin(animTime * 0.25) * 0.0018 * params.animationSpeed,
              0.25, Math.PI - 0.25
            );
          } else if (params.animation === 'Ethereal Breathing Glide') {
            spherical.theta += 0.002 * params.animationSpeed;
            spherical.phi = THREE.MathUtils.clamp(
              spherical.phi + Math.cos(animTime * 0.35) * 0.0012 * params.animationSpeed,
              0.18, Math.PI - 0.18
            );
          } else if (params.animation === 'Dynamic Oblique Wave') {
            spherical.theta += 0.003 * params.animationSpeed;
            spherical.phi = THREE.MathUtils.clamp(
              spherical.phi + Math.sin(animTime * 0.6) * 0.0028 * params.animationSpeed,
              0.3, Math.PI - 0.3
            );
          }

          camera.position.setFromSpherical(spherical).add(controls.target);
          camera.lookAt(controls.target);
        }
      }

      // =======================================================================
      // 2. Attractor Motion & Position Update
      // =======================================================================
      const t = animTime * params.attractorSpeed;
      const autoX = Math.sin(t * 0.7) * (GRID_WIDTH * 0.32) + Math.cos(t * 0.31) * (GRID_WIDTH * 0.12);
      const autoY = Math.cos(t * 0.55) * (GRID_HEIGHT * 0.32) + Math.sin(t * 0.43) * (GRID_HEIGHT * 0.12);

      if (params.attractorMode === 'Pure Auto Motion') {
        currentAttractor.x += (autoX - currentAttractor.x) * 0.08;
        currentAttractor.y += (autoY - currentAttractor.y) * 0.08;
      } else if (params.attractorMode === 'Direct Mouse Tracking') {
        if (isMouseActive) {
          currentAttractor.x += (mouseInWorld.x - currentAttractor.x) * 0.14;
          currentAttractor.y += (mouseInWorld.y - currentAttractor.y) * 0.14;
        } else {
          currentAttractor.x += (autoX - currentAttractor.x) * 0.08;
          currentAttractor.y += (autoY - currentAttractor.y) * 0.08;
        }
      } else {
        // 'Auto Flow + Mouse Influence'
        const targetX = isMouseActive ? autoX * 0.35 + mouseInWorld.x * 0.65 : autoX;
        const targetY = isMouseActive ? autoY * 0.35 + mouseInWorld.y * 0.65 : autoY;
        currentAttractor.x += (targetX - currentAttractor.x) * 0.08;
        currentAttractor.y += (targetY - currentAttractor.y) * 0.08;
      }

      vortexLight.position.set(currentAttractor.x, currentAttractor.y, 45);

      // =======================================================================
      // 3. Kinetic Vector Field Simulation Step
      // =======================================================================
      if (instancedMesh) {
        primaryColor.set(params.strokePrimary);
        secondaryColor.set(params.strokeSecondary);
        accentColor.set(params.accentColor);

        const count = gridPoints.length;
        const sizer = params.sizer;
        const scaleW = params.strokeWeight / 17.0;
        const scaleL = sizer / 13.0;
        const waveDepth = params.waveDepth;
        const waveFreq = params.waveFreq;
        const twist = params.twist;

        for (let i = 0; i < count; i++) {
          const pt = gridPoints[i];
          const dx = pt.x - currentAttractor.x;
          const dy = pt.y - currentAttractor.y;

          // Angular vector calculation
          const heading = calcHeading(dx, dy, params.vectorFormula);
          const dist = Math.hypot(dx, dy);

          // 3D elevation undulation (0 by default to match classic 2D Op Art)
          let pz = 0;
          if (waveDepth > 0) {
            pz = Math.sin(dist * waveFreq - simTime * 2.2) * waveDepth +
                 Math.cos((pt.x + pt.y) * 0.008 + simTime) * (waveDepth * 0.35);
          }

          // Line segment midpoint
          const midX = pt.x + 0.5 * sizer * Math.cos(heading);
          const midY = pt.y + 0.5 * sizer * Math.sin(heading);
          const midZ = pz;

          dummy.position.set(midX, midY, midZ);

          // Spatial rotation (Capsule default orientation is along +Y, so rotate Z by heading - PI/2)
          const rotZ = heading - Math.PI / 2 + (twist > 0 ? Math.sin(dist * 0.01) * twist : 0);
          dummy.rotation.set(0, 0, rotZ);

          dummy.scale.set(scaleW, scaleL, scaleW);
          dummy.updateMatrix();

          instancedMesh.setMatrixAt(i, dummy.matrix);

          // Dynamic chromatic gradient across vector matrix
          const tDist = Math.min(dist / 650, 1.0);
          tempColor.copy(primaryColor).lerp(secondaryColor, tDist);

          if (dist < 180) {
            const accentT = (1.0 - dist / 180) * 0.85;
            tempColor.lerp(accentColor, accentT);
          }

          instancedMesh.setColorAt(i, tempColor);
        }

        instancedMesh.instanceMatrix.needsUpdate = true;
        if (instancedMesh.instanceColor) instancedMesh.instanceColor.needsUpdate = true;
      }

      renderer.render(scene, camera);
    }

    requestAnimationFrame(renderLoop);
  </script>
</body>
