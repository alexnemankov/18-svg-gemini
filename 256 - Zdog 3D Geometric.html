<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zdog 3D Geometric Solids with PostProcessing</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
      user-select: none;
      -webkit-user-select: none;
    }

    .illo {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: grab;
      touch-action: none;
    }

    .illo:active {
      cursor: grabbing;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
      }
    }
  </script>
  <script src="https://unpkg.com/zdog@1/dist/zdog.dist.min.js"></script>
</head>
<body>
  <canvas class="illo"></canvas>

  <script type="module">
    import * as THREE from 'three';
    import GUI from 'lil-gui';

    // =========================================================================================
    // POST PROCESSOR SUITE (Inlined from postprocessing/PostProcessor.js for file:// execution)
    // =========================================================================================
    const orthoVertexShader = `
    precision highp float;
    in vec3 position;
    out vec2 vUv;
    void main() {
      vUv = position.xy * 0.5 + 0.5;
      gl_Position = vec4(position, 1.0);
    }
    `;

    const brightFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float bloomThreshold;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float luminance = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float knee = 0.1;
      float soft = luminance - bloomThreshold + knee;
      soft = clamp(soft, 0.0, 2.0 * knee);
      soft = (soft * soft) / (4.0 * knee + 0.00001);
      float contribution = max(soft, luminance - bloomThreshold);
      contribution /= max(luminance, 0.00001);
      fragColor = vec4(color.rgb * contribution, color.a);
    }
    `;

    const blur13ShaderChunk = `
    vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
      vec2 resolution = vec2(textureSize(image, 0));
      vec4 color = vec4(0.0);
      vec2 off1 = vec2(1.411764705882353) * direction;
      vec2 off2 = vec2(3.2941176470588234) * direction;
      vec2 off3 = vec2(5.176470588235294) * direction;
      color += texture(image, uv) * 0.1964825501511404;
      color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
      color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
      return color;
    }
    `;

    const blurFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 direction;
    in vec2 vUv;
    out vec4 color;
    ${blur13ShaderChunk}
    void main() {
      color = blur13(inputTexture, vUv, direction);
    }
    `;

    const finalFragmentShader = `
    precision highp float;
    uniform vec2 resolution;
    uniform sampler2D inputTexture;
    uniform sampler2D blur0Texture;
    uniform sampler2D blur1Texture;
    uniform sampler2D blur2Texture;
    uniform sampler2D blur3Texture;
    uniform sampler2D blur4Texture;
    uniform bool bloomEnabled;
    uniform float bloomStrength;
    uniform float vignetteBoost;
    uniform float vignetteReduction;
    uniform float noiseIntensity;
    uniform float time;
    in vec2 vUv;
    out vec4 fragColor;

    float vignette(vec2 uv, float boost, float reduction) {
      vec2 position = vUv - 0.5;
      return boost - length(position) * reduction;
    }

    float hash1(uint n) {
      n = (n << 13U) ^ n;
      n = n * (n * n * 15731U + 789221U) + 1376312589U;
      return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
    }

    float noise(in vec2 uv, in float timeVal) {
      uvec2 p = uvec2(uv);
      return hash1(p.x + 1920U * p.y + (1920U * 1080U) * uint(timeVal));
    }

    void main() {
      vec4 color = texture(inputTexture, vUv);

      if (bloomEnabled && bloomStrength > 0.001) {
        vec4 b0 = texture(blur0Texture, vUv);
        vec4 b1 = texture(blur1Texture, vUv);
        vec4 b2 = texture(blur2Texture, vUv);
        vec4 b3 = texture(blur3Texture, vUv);
        vec4 b4 = texture(blur4Texture, vUv);

        vec4 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
        color += bloomSum * bloomStrength;
      }

      color.rgb *= vignette(vUv, vignetteBoost, vignetteReduction);
      color.rgb += noiseIntensity * noise(gl_FragCoord.xy, time);
      fragColor = vec4(color.rgb, 1.0);
    }
    `;

    const chromaticAberrationShaderChunk = `
    vec2 barrelDistortion(vec2 coord, float amt) {
      vec2 cc = coord - 0.5;
      float dist = dot(cc, cc);
      return coord + cc * dist * amt;
    }
    float sat(float t) { return clamp(t, 0.0, 1.0); }
    float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
    float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
    vec4 spectrum_offset(float t) {
      float lo = step(t, 0.5);
      float hi = 1.0 - lo;
      float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
      vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
      return pow(ret, vec4(1.0 / 2.2));
    }
    const float max_distort = 2.2;
    const int num_iter = 8;
    const float reci_num_iter_f = 1.0 / float(num_iter);
    vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
      vec4 sumcol = vec4(0.0);
      vec4 sumw = vec4(0.0);
      for (int i = 0; i < num_iter; ++i) {
        float t = float(i) * reci_num_iter_f;
        vec4 w = spectrum_offset(t);
        sumw += w;
        sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
      }
      return sumcol / sumw;
    }
    `;

    const colorFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float chromaticAberrationAmount;
    uniform float minInputLevel;
    uniform float maxInputLevel;
    uniform float gammaLevel;
    uniform float fisheyeStrength;
    uniform float fisheyeRadius;
    uniform float time;
    in vec2 vUv;
    out vec4 fragColor;

    ${chromaticAberrationShaderChunk}

    vec2 applyFisheye(vec2 uv, float strength, float radius) {
      if (abs(strength) < 0.0001) return uv;
      vec2 p = uv - 0.5;
      float d = length(p);
      if (d > radius * 1.5) return uv;
      float r = d / max(radius, 0.001);
      float theta = atan(p.y, p.x);
      float rDist = r + strength * (r * r * r);
      return 0.5 + vec2(cos(theta), sin(theta)) * (rDist * radius);
    }

    vec3 gammaCorrect(vec3 color, vec3 gamma) {
      return pow(max(color, vec3(0.0)), 1.0 / gamma);
    }
    vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
      return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
    }
    vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
      return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
    }
    void main() {
      vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
      fragColor = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
      fragColor.rgb = finalLevels(fragColor.rgb, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
      fragColor.a = 1.0;
    }
    `;

    const copyFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      fragColor = texture(inputTexture, vUv);
    }
    `;

    function createFBO(w, h, options = {}) {
      return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
        wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
        wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
        minFilter: options.minFilter || THREE.LinearFilter,
        magFilter: options.magFilter || THREE.LinearFilter,
        format: options.format || THREE.RGBAFormat,
        type: options.type || THREE.HalfFloatType,
        stencilBuffer: options.stencilBuffer || false,
        depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : true,
        samples: options.samples || 0,
      });
    }

    class ShaderPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbo = createFBO(1, 1, options);
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
        this.texture = this.fbo.texture;
      }
      render(renderer, toScreen = false) {
        if (!toScreen) {
          renderer.setRenderTarget(this.fbo);
        }
        renderer.render(this.orthoScene, this.orthoCamera);
        if (!toScreen) {
          renderer.setRenderTarget(null);
        }
      }
      setSize(width, height) {
        this.fbo.setSize(Math.max(1, width), Math.max(1, height));
        this.orthoQuad.scale.set(width, height, 1);
      }
    }

    class ShaderPingPongPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
        this.currentFBO = 0;
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
      }
      render(renderer) {
        renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
        renderer.render(this.orthoScene, this.orthoCamera);
        renderer.setRenderTarget(null);
        this.currentFBO = 1 - this.currentFBO;
      }
      get current() { return this.fbos[this.currentFBO]; }
      get texture() { return this.current.texture; }
      setSize(width, height) {
        const w = Math.max(1, width);
        const h = Math.max(1, height);
        this.orthoQuad.scale.set(w, h, 1);
        this.fbos[0].setSize(w, h);
        this.fbos[1].setSize(w, h);
      }
    }

    class BloomPass {
      constructor(strength = 0.8, radius = 0.5, threshold = 0.2, levels = 5) {
        this.strength = strength;
        this.radius = radius;
        this.threshold = threshold;
        this.enabled = true;
        this.levels = levels;

        this.brightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            bloomThreshold: { value: this.threshold },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: brightFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.brightPass = new ShaderPass(this.brightShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.blurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            direction: { value: new THREE.Vector2(0, 1) },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: blurFragmentShader,
          glslVersion: THREE.GLSL3,
        });

        this.blurPasses = [];
        for (let i = 0; i < this.levels; i++) {
          this.blurPasses.push(new ShaderPingPongPass(this.blurShader, {
            format: THREE.RGBAFormat,
            type: THREE.HalfFloatType,
          }));
        }
      }

      setSize(w, h) {
        let tw = Math.max(1, w);
        let th = Math.max(1, h);
        this.brightPass.setSize(tw, th);
        for (let i = 0; i < this.levels; i++) {
          tw = Math.max(1, Math.round(tw / 2));
          th = Math.max(1, Math.round(th / 2));
          this.blurPasses[i].setSize(tw, th);
        }
      }

      set source(texture) {
        this.brightShader.uniforms.inputTexture.value = texture;
      }

      render(renderer) {
        if (!this.enabled || this.strength <= 0.001) return;

        this.brightShader.uniforms.bloomThreshold.value = this.threshold;
        this.brightPass.render(renderer);

        const baseOffset = Math.max(0.1, this.radius * 2.0);
        const u = this.blurShader.uniforms;

        for (let j = 0; j < this.levels; j++) {
          const blurPass = this.blurPasses[j];
          const stepOffset = baseOffset * (1.0 + j * 0.5);

          u.direction.value.set(stepOffset, 0);
          u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
          blurPass.render(renderer);

          u.direction.value.set(0, stepOffset * 0.5);
          u.inputTexture.value = blurPass.current.texture;
          blurPass.render(renderer);
        }
      }
    }

    class PostProcessor {
      constructor(renderer, params = {}) {
        this.renderer = renderer;

        this.settings = {
          enabled: params.enabled !== undefined ? params.enabled : true,
          bloomEnabled: params.bloomEnabled !== undefined ? params.bloomEnabled : true,
          bloomStrength: params.bloomStrength !== undefined ? params.bloomStrength : 0.65,
          bloomRadius: params.bloomRadius !== undefined ? params.bloomRadius : 0.45,
          bloomThreshold: params.bloomThreshold !== undefined ? params.bloomThreshold : 0.2,

          fisheyeStrength: params.fisheyeStrength !== undefined ? params.fisheyeStrength : 0.0,
          fisheyeRadius: params.fisheyeRadius !== undefined ? params.fisheyeRadius : 1.0,
          chromaticAberration: params.chromaticAberration !== undefined ? params.chromaticAberration : 0.02,
          vignetteBoost: params.vignetteBoost !== undefined ? params.vignetteBoost : 1.0,
          vignetteReduction: params.vignetteReduction !== undefined ? params.vignetteReduction : 0.4,
          noiseIntensity: params.noiseIntensity !== undefined ? params.noiseIntensity : 0.015,

          gamma: params.gamma !== undefined ? params.gamma : 1.0,
          minInputLevel: params.minInputLevel !== undefined ? params.minInputLevel : 0.0,
          maxInputLevel: params.maxInputLevel !== undefined ? params.maxInputLevel : 1.0,
        };

        this.sceneTarget = createFBO(1, 1, { type: THREE.HalfFloatType });

        this.bloomPass = new BloomPass(
          this.settings.bloomStrength,
          this.settings.bloomRadius,
          this.settings.bloomThreshold,
          5
        );

        this.finalShader = new THREE.RawShaderMaterial({
          uniforms: {
            resolution: { value: new THREE.Vector2(1, 1) },
            bloomEnabled: { value: this.settings.bloomEnabled },
            bloomStrength: { value: this.settings.bloomStrength },
            vignetteBoost: { value: this.settings.vignetteBoost },
            vignetteReduction: { value: this.settings.vignetteReduction },
            noiseIntensity: { value: this.settings.noiseIntensity },
            inputTexture: { value: null },
            blur0Texture: { value: null },
            blur1Texture: { value: null },
            blur2Texture: { value: null },
            blur3Texture: { value: null },
            blur4Texture: { value: null },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: finalFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.finalPass = new ShaderPass(this.finalShader);

        this.rgbShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: this.finalPass.texture },
            fisheyeStrength: { value: this.settings.fisheyeStrength },
            fisheyeRadius: { value: this.settings.fisheyeRadius },
            chromaticAberrationAmount: { value: this.settings.chromaticAberration },
            minInputLevel: { value: this.settings.minInputLevel },
            maxInputLevel: { value: this.settings.maxInputLevel },
            gammaLevel: { value: this.settings.gamma },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: colorFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.rgbPass = new ShaderPass(this.rgbShader);

        this.copyShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: copyFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.copyPass = new ShaderPass(this.copyShader);
      }

      updateSettings() {
        this.bloomPass.enabled = this.settings.bloomEnabled;
        this.bloomPass.strength = this.settings.bloomStrength;
        this.bloomPass.radius = this.settings.bloomRadius;
        this.bloomPass.threshold = this.settings.bloomThreshold;

        this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
        this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
        this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
        this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
        this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;

        this.rgbShader.uniforms.fisheyeStrength.value = this.settings.fisheyeStrength;
        this.rgbShader.uniforms.fisheyeRadius.value = this.settings.fisheyeRadius;
        this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
        this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
        this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
        this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
      }

      setSize(w0, h0, dpr = 1) {
        const w = Math.max(1, Math.floor(w0 * dpr));
        const h = Math.max(1, Math.floor(h0 * dpr));
        this.sceneTarget.setSize(w, h);
        this.finalPass.setSize(w, h);
        this.finalShader.uniforms.resolution.value.set(w, h);
        this.bloomPass.setSize(w, h);
        this.rgbPass.setSize(w, h);
        this.copyPass.setSize(w, h);
      }

      render(sourceTexture) {
        if (!this.settings.enabled) {
          this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
          this.copyPass.render(this.renderer, true);
          return;
        }

        this.updateSettings();

        this.bloomPass.source = sourceTexture;
        this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
        this.bloomPass.render(this.renderer);

        this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
        this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
        this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
        this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
        this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

        const randomTime = Math.random() * 100000;
        this.finalPass.shader.uniforms.time.value = randomTime;
        this.rgbPass.shader.uniforms.time.value = randomTime;

        this.finalPass.render(this.renderer);
        this.rgbPass.render(this.renderer, true);
      }

      attachGUI(gui, title = "Post-Processing (PostProcessor.js)") {
        const root = gui.addFolder(title);
        root.add(this.settings, "enabled").name("Enable Suite");

        const bloom = root.addFolder("Bloom");
        bloom.add(this.settings, "bloomEnabled").name("Enable Bloom").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomStrength", 0, 3.0, 0.05).name("Strength").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomRadius", 0, 2.0, 0.05).name("Radius").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomThreshold", 0, 1.0, 0.01).name("Threshold").onChange(() => this.updateSettings());

        const lens = root.addFolder("Lens, Optics & Fisheye");
        lens.add(this.settings, "fisheyeStrength", -1.0, 1.5, 0.01).name("Fisheye Distortion").onChange(() => this.updateSettings());
        lens.add(this.settings, "fisheyeRadius", 0.2, 2.0, 0.05).name("Fisheye Radius").onChange(() => this.updateSettings());
        lens.add(this.settings, "chromaticAberration", 0, 0.2, 0.005).name("Chromatic Aberration").onChange(() => this.updateSettings());
        lens.add(this.settings, "vignetteBoost", 0, 2.0, 0.05).name("Vignette Boost").onChange(() => this.updateSettings());
        lens.add(this.settings, "vignetteReduction", 0, 2.0, 0.05).name("Vignette Falloff").onChange(() => this.updateSettings());
        lens.add(this.settings, "noiseIntensity", 0, 0.1, 0.005).name("Film Grain").onChange(() => this.updateSettings());
        lens.add(this.settings, "gamma", 0.2, 2.0, 0.05).name("Gamma").onChange(() => this.updateSettings());
        lens.add(this.settings, "minInputLevel", 0, 0.5, 0.01).name("Black Level").onChange(() => this.updateSettings());
        lens.add(this.settings, "maxInputLevel", 0.5, 1.0, 0.01).name("White Level").onChange(() => this.updateSettings());

        return root;
      }
    }

    // =========================================================================================
    // MAIN SCENE SETUP & GEOMETRIC SOLIDS
    // =========================================================================================
    const TAU = Zdog.TAU;
    const ROOT3 = Math.sqrt(3);
    const ROOT5 = Math.sqrt(5);
    const PHI = (1 + ROOT5) / 2;
    const sceneSize = 96;

    // ----- Preset Color Schemes ----- //
    const colorPresets = {
      'Original Sunset': {
        background: '#ccffdd',
        color1: '#663366',
        color2: '#cc2255',
        color3: '#ee6622',
        color4: '#eeaa00',
        color5: '#eedd00'
      },
      'Black & White': {
        background: '#ffffff',
        color1: '#111111',
        color2: '#2b2b2b',
        color3: '#4f4f4f',
        color4: '#777777',
        color5: '#9e9e9e'
      },
      'White & Black': {
        background: '#111111',
        color1: '#ffffff',
        color2: '#e0e0e0',
        color3: '#c4c4c4',
        color4: '#999999',
        color5: '#707070'
      },
      'Cyber Neon': {
        background: '#0d0221',
        color1: '#ff007f',
        color2: '#7b2cbf',
        color3: '#00f0ff',
        color4: '#ffe600',
        color5: '#00ff87'
      },
      'Nordic Pastel': {
        background: '#f4f1de',
        color1: '#e07a5f',
        color2: '#3d405b',
        color3: '#81b29a',
        color4: '#f2cc8f',
        color5: '#e29578'
      }
    };

    // ----- Settings / State ----- //
    const params = {
      // Color & Theme
      preset: 'Original Sunset',
      greenscreen: false,
      background: '#ccffdd',
      color1: '#663366',
      color2: '#cc2255',
      color3: '#ee6622',
      color4: '#eeaa00',
      color5: '#eedd00',

      // Animation
      animation: 'Original Multi-Axis',
      speed: 1.0,
      isSpinning: true,

      // Rendering & Geometry
      dpr: Math.min(window.devicePixelRatio || 1, 2),
      zoom: 1.0,
      spacing: 4,
      scale: 1.0,

      // Interaction
      dragMode: 'Pan Object',
      randomizeOnClick: true,
      resetView: function() {
        params.zoom = 1.0;
        illo.translate.set({ x: 0, y: 0, z: 0 });
        viewRotation.set({ x: 0, y: 0, z: 0 });
        updateZoom();
        updateGuiDisplays(gui);
      },
      randomizeNow: function() {
        randomizeScene();
      }
    };

    // ----- WebGL Renderer & Offscreen 2D Canvas Setup ----- //
    const visibleCanvas = document.querySelector('.illo');
    const renderer = new THREE.WebGLRenderer({
      canvas: visibleCanvas,
      antialias: false,
      powerPreference: 'high-performance'
    });

    const postProcessor = new PostProcessor(renderer, {
      bloomStrength: 0.65,
      bloomRadius: 0.45,
      bloomThreshold: 0.25,
      chromaticAberration: 0.018,
      vignetteBoost: 1.0,
      vignetteReduction: 0.35,
      noiseIntensity: 0.012
    });

    const offscreenCanvas = document.createElement('canvas');
    const offscreenCtx = offscreenCanvas.getContext('2d');
    const canvasTexture = new THREE.CanvasTexture(offscreenCanvas);
    canvasTexture.minFilter = THREE.LinearFilter;
    canvasTexture.magFilter = THREE.LinearFilter;
    canvasTexture.generateMipmaps = false;

    let displaySize = Math.min(window.innerWidth, window.innerHeight);
    const viewRotation = new Zdog.Vector();
    let solids = [];

    const illo = new Zdog.Illustration({
      element: offscreenCanvas,
      scale: 8,
      dragRotate: false
    });

    // ----- Scene Builder ----- //
    function rebuildScene() {
      illo.children = [];
      solids = [];

      const c1 = params.color1;
      const c2 = params.color2;
      const c3 = params.color3;
      const c4 = params.color4;
      const c5 = params.color5;
      const sp = params.spacing;
      const sc = params.scale;

      // 1. Hourglass (top-center)
      (function() {
        const hourglass = new Zdog.Anchor({
          addTo: illo,
          translate: { x: 0, y: -sp * sc }
        });
        solids.push(hourglass);

        const hemi = new Zdog.Hemisphere({
          diameter: 2 * sc,
          translate: { z: -1 * sc },
          addTo: hourglass,
          color: c2,
          backface: c3,
          stroke: false
        });

        hemi.copy({
          translate: { z: 1 * sc },
          rotate: { y: TAU / 2 },
          color: c1,
          backface: c4
        });
      })();

      // 2. Sphere (top-left)
      (function() {
        const sphere = new Zdog.Anchor({
          addTo: illo,
          translate: { x: -sp * sc, y: -sp * sc }
        });
        solids.push(sphere);

        const hemi = new Zdog.Hemisphere({
          diameter: 2 * sc,
          addTo: sphere,
          color: c3,
          backface: c1,
          stroke: false
        });

        hemi.copy({
          rotate: { y: TAU / 2 },
          color: c1,
          backface: c3
        });
      })();

      // 3. Cylinder (top-right)
      (function() {
        const cylinder = new Zdog.Cylinder({
          diameter: 2 * sc,
          length: 2 * sc,
          addTo: illo,
          translate: { x: sp * sc, y: -sp * sc },
          color: c4,
          backface: c2,
          stroke: false
        });
        solids.push(cylinder);
      })();

      // 4. Cone (middle-left)
      (function() {
        const cone = new Zdog.Anchor({
          addTo: illo,
          translate: { x: -sp * sc, y: 0 }
        });
        solids.push(cone);

        new Zdog.Cone({
          diameter: 2 * sc,
          length: 2 * sc,
          addTo: cone,
          translate: { z: 1 * sc },
          rotate: { y: TAU / 2 },
          color: c2,
          backface: c4,
          stroke: false
        });
      })();

      // 5. Tetrahedron (center)
      (function() {
        const tetrahedron = new Zdog.Anchor({
          addTo: illo,
          translate: { x: 0, y: 0 },
          scale: 2.5 * sc
        });
        solids.push(tetrahedron);

        const radius = 0.5;
        const inradius = Math.cos(TAU / 6) * radius;
        const height = radius + inradius;

        const triangle = new Zdog.Polygon({
          sides: 3,
          radius: radius,
          addTo: tetrahedron,
          translate: { y: height / 2 },
          fill: true,
          stroke: false,
          color: c1
        });

        const faceColors = [c4, c2, c3];
        for (let i = 0; i < 3; i++) {
          const rotor1 = new Zdog.Anchor({
            addTo: tetrahedron,
            rotate: { y: TAU / 3 * -i }
          });
          const rotor2 = new Zdog.Anchor({
            addTo: rotor1,
            translate: { z: inradius, y: height / 2 },
            rotate: { x: Math.acos(1 / 3) * -1 + TAU / 4 }
          });
          triangle.copy({
            addTo: rotor2,
            translate: { y: -inradius },
            color: faceColors[i]
          });
        }

        triangle.rotate.set({ x: -TAU / 4, z: -TAU / 2 });
      })();

      // 6. Octahedron (bottom-left)
      (function() {
        const octahedron = new Zdog.Anchor({
          addTo: illo,
          translate: { x: -sp * sc, y: sp * sc },
          scale: 1.75 * sc
        });
        solids.push(octahedron);

        const colorWheel = [c1, c2, c3, c4, c5];
        const radius = ROOT3 / 2 * 2 / 3;
        const height = radius * 3 / 2;
        const tilt = Math.asin(0.5 / height);

        [-1, 1].forEach(function(ySide) {
          for (let i = 0; i < 4; i++) {
            const rotor = new Zdog.Anchor({
              addTo: octahedron,
              rotate: { y: TAU / 4 * (i + 1.5) * -1 }
            });

            const anchor = new Zdog.Anchor({
              addTo: rotor,
              translate: { z: 0.5 },
              rotate: { x: tilt * ySide }
            });

            new Zdog.Polygon({
              sides: 3,
              radius: radius,
              addTo: anchor,
              translate: { y: -radius / 2 * ySide },
              scale: { y: ySide },
              stroke: false,
              fill: true,
              color: colorWheel[Math.floor(i + 0.5 + 0.5 * ySide) % colorWheel.length],
              backface: false
            });
          }
        });
      })();

      // 7. Cube (middle-right)
      (function() {
        const cube = new Zdog.Box({
          addTo: illo,
          width: 2 * sc,
          height: 2 * sc,
          depth: 2 * sc,
          translate: { x: sp * sc, y: 0 },
          topFace: c5,
          frontFace: c4,
          leftFace: c3,
          rightFace: c3,
          rearFace: c2,
          bottomFace: c1,
          stroke: false
        });
        solids.push(cube);
      })();

      // 8. Dodecahedron (bottom-center)
      (function() {
        const dodecahedron = new Zdog.Anchor({
          addTo: illo,
          translate: { x: 0, y: sp * sc },
          scale: 0.75 * sc
        });
        solids.push(dodecahedron);

        const midradius = (PHI * PHI) / 2;

        const face = new Zdog.Polygon({
          sides: 5,
          radius: 1,
          addTo: dodecahedron,
          translate: { y: -midradius },
          rotate: { x: TAU / 4 },
          fill: true,
          stroke: false,
          color: c5
        });

        face.copy({
          translate: { y: midradius },
          rotate: { x: -TAU / 4 },
          color: c1
        });

        [-1, 1].forEach(function(ySide) {
          const colorWheel = {
            '-1': [c1, c2, c4, c3, c2],
            '1': [c5, c4, c2, c3, c4]
          }[ySide];

          for (let i = 0; i < 5; i++) {
            const rotor1 = new Zdog.Anchor({
              addTo: dodecahedron,
              rotate: { y: TAU / 5 * i }
            });
            const rotor2 = new Zdog.Anchor({
              addTo: rotor1,
              rotate: { x: TAU / 4 * ySide - Math.atan(2) }
            });

            face.copy({
              addTo: rotor2,
              translate: { z: midradius },
              rotate: { z: TAU / 2 },
              color: colorWheel[i]
            });
          }
        });
      })();

      // 9. Icosahedron (bottom-right)
      (function() {
        const isocahedron = new Zdog.Anchor({
          addTo: illo,
          translate: { x: sp * sc, y: sp * sc },
          scale: 1.2 * sc
        });
        solids.push(isocahedron);

        const faceRadius = ROOT3 / 2 * 2 / 3;
        const faceHeight = faceRadius * 3 / 2;
        const capApothem = 0.5 / Math.tan(TAU / 10);
        const capRadius = 0.5 / Math.sin(TAU / 10);
        const capTilt = Math.asin(capApothem / faceHeight);
        const capSagitta = capRadius - capApothem;
        const sideTilt = Math.asin(capSagitta / faceHeight);
        const sideHeight = Math.sqrt(faceHeight * faceHeight - capSagitta * capSagitta);

        [-1, 1].forEach(function(ySide) {
          const capColors = {
            '-1': [c2, c4, c5, c4, c3],
            '1': [c4, c2, c1, c2, c3]
          }[ySide];

          const sideColors = {
            '-1': [c2, c4, c5, c3, c2],
            '1': [c4, c2, c1, c3, c3]
          }[ySide];

          for (let i = 0; i < 5; i++) {
            const rotor = new Zdog.Anchor({
              addTo: isocahedron,
              rotate: { y: TAU / 5 * -i },
              translate: { y: sideHeight / 2 * ySide }
            });

            let capRotateX = -capTilt;
            const isYPos = ySide > 0;
            capRotateX += isYPos ? TAU / 2 : 0;

            const capAnchor = new Zdog.Anchor({
              addTo: rotor,
              translate: { z: capApothem * ySide },
              rotate: { x: capRotateX }
            });

            const face = new Zdog.Polygon({
              sides: 3,
              radius: faceRadius,
              addTo: capAnchor,
              translate: { y: -faceRadius / 2 },
              stroke: false,
              fill: true,
              color: capColors[i]
            });

            let sideRotateX = -sideTilt;
            sideRotateX += isYPos ? 0 : TAU / 2;
            const sideAnchor = capAnchor.copy({
              rotate: { x: sideRotateX }
            });

            face.copy({
              addTo: sideAnchor,
              translate: { y: -faceRadius / 2 },
              rotate: { y: TAU / 2 },
              color: sideColors[i]
            });
          }
        });
      })();

      illo.updateGraph();
    }

    // ----- Resize & Dimension Management ----- //
    function updateZoom() {
      const baseZoom = Math.floor(displaySize / sceneSize) || 1;
      illo.zoom = Math.max(0.1, baseZoom * params.zoom);
    }

    function updateDimensions() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const dpr = params.dpr;
      displaySize = Math.min(w, h);

      renderer.setPixelRatio(dpr);
      renderer.setSize(w, h, false);

      offscreenCanvas.width = Math.max(1, Math.floor(w * dpr));
      offscreenCanvas.height = Math.max(1, Math.floor(h * dpr));

      illo.dpr = dpr;
      illo.setSize(w, h);

      postProcessor.setSize(w, h, dpr);
      updateZoom();
    }

    // ----- Keyframe & Animation Logic ----- //
    const keyframes = [
      { x: 0, y: 0 },
      { x: 0, y: TAU },
      { x: TAU, y: TAU }
    ];

    let ticker = 0;
    const cycleCount = 180;
    const turnLimit = keyframes.length - 1;

    function update() {
      if (params.isSpinning && params.speed > 0) {
        ticker += params.speed;

        if (params.animation === 'Original Multi-Axis') {
          const progress = ticker / cycleCount;
          const tween = Zdog.easeInOut(progress % 1, 4);
          const turn = Math.floor(progress % turnLimit);
          const keyA = keyframes[turn];
          const keyB = keyframes[turn + 1];
          viewRotation.x = Zdog.lerp(keyA.x, keyB.x, tween);
          viewRotation.y = Zdog.lerp(keyA.y, keyB.y, tween);
          viewRotation.z = 0;

          solids.forEach(function(solid) {
            solid.rotate.set(viewRotation);
          });
        } else if (params.animation === 'Gentle Floating Orbit') {
          const t = ticker * 0.008;
          viewRotation.x = Math.sin(t * 0.7) * 0.35 + 0.2;
          viewRotation.y = t;
          viewRotation.z = Math.cos(t * 0.5) * 0.15;

          solids.forEach(function(solid) {
            solid.rotate.set(viewRotation);
          });
        } else if (params.animation === 'Harmonic Wave') {
          const t = ticker * 0.012;
          viewRotation.x = Math.sin(t * 0.8) * (TAU / 8);
          viewRotation.y = Math.cos(t * 0.6) * (TAU / 4);
          viewRotation.z = Math.sin(t * 0.4) * (TAU / 12);

          solids.forEach(function(solid) {
            solid.rotate.set(viewRotation);
          });
        } else if (params.animation === 'Individual Spin') {
          const t = ticker * 0.01;
          viewRotation.x = Math.sin(t * 0.3) * 0.2;
          viewRotation.y = t * 0.5;
          viewRotation.z = 0;

          solids.forEach(function(solid, idx) {
            solid.rotate.x = viewRotation.x + Math.sin(t + idx * 0.7) * 0.8;
            solid.rotate.y = viewRotation.y + t * (0.8 + (idx % 3) * 0.3);
            solid.rotate.z = Math.cos(t + idx * 0.5) * 0.4;
          });
        } else if (params.animation === 'Static (No Movement)') {
          viewRotation.x = -TAU / 16;
          viewRotation.y = TAU / 8;
          viewRotation.z = 0;

          solids.forEach(function(solid) {
            solid.rotate.set(viewRotation);
          });
        }
      } else {
        solids.forEach(function(solid) {
          solid.rotate.set(viewRotation);
        });
      }

      illo.updateGraph();
    }

    function animate() {
      update();

      // Render 3D Zdog solids into offscreen canvas
      illo.renderGraph();

      // Paint background behind 3D geometry
      const bg = params.greenscreen ? '#00ff00' : params.background;
      offscreenCtx.save();
      offscreenCtx.setTransform(1, 0, 0, 1, 0, 0);
      offscreenCtx.globalCompositeOperation = 'destination-over';
      offscreenCtx.fillStyle = bg;
      offscreenCtx.fillRect(0, 0, offscreenCanvas.width, offscreenCanvas.height);
      offscreenCtx.restore();

      // Pass texture through Three.js PostProcessor Pipeline
      canvasTexture.needsUpdate = true;
      postProcessor.render(canvasTexture);

      requestAnimationFrame(animate);
    }

    // ----- Color Helpers & Procedural Generation ----- //
    function hslToHex(h, s, l) {
      h = ((h % 360) + 360) % 360;
      s = Math.max(0, Math.min(100, s)) / 100;
      l = Math.max(0, Math.min(100, l)) / 100;
      const c = (1 - Math.abs(2 * l - 1)) * s;
      const x = c * (1 - Math.abs((h / 60) % 2 - 1));
      const m = l - c / 2;
      let r = 0, g = 0, b = 0;
      if (0 <= h && h < 60) { r = c; g = x; b = 0; }
      else if (60 <= h && h < 120) { r = x; g = c; b = 0; }
      else if (120 <= h && h < 180) { r = 0; g = c; b = x; }
      else if (180 <= h && h < 240) { r = 0; g = x; b = c; }
      else if (240 <= h && h < 300) { r = x; g = 0; b = c; }
      else if (300 <= h && h < 360) { r = c; g = 0; b = x; }
      const toHex = function(n) {
        const hex = Math.round((n + m) * 255).toString(16);
        return hex.length === 1 ? '0' + hex : hex;
      };
      return '#' + toHex(r) + toHex(g) + toHex(b);
    }

    function generateRandomTheme() {
      const mode = Math.floor(Math.random() * 5);
      const baseHue = Math.floor(Math.random() * 360);
      let bg, c1, c2, c3, c4, c5;

      if (mode === 0) { // Dark Cyber Neon
        bg = hslToHex(baseHue, 60, 7);
        c1 = hslToHex(baseHue, 95, 60);
        c2 = hslToHex((baseHue + 60) % 360, 90, 55);
        c3 = hslToHex((baseHue + 150) % 360, 95, 60);
        c4 = hslToHex((baseHue + 210) % 360, 90, 65);
        c5 = hslToHex((baseHue + 280) % 360, 95, 70);
      } else if (mode === 1) { // Light Pastel
        bg = hslToHex(baseHue, 35, 93);
        c1 = hslToHex((baseHue + 30) % 360, 65, 55);
        c2 = hslToHex((baseHue + 80) % 360, 60, 50);
        c3 = hslToHex((baseHue + 160) % 360, 55, 45);
        c4 = hslToHex((baseHue + 210) % 360, 70, 60);
        c5 = hslToHex((baseHue + 290) % 360, 60, 55);
      } else if (mode === 2) { // High Contrast Triadic
        bg = hslToHex(baseHue, 20, 92);
        c1 = hslToHex(baseHue, 80, 45);
        c2 = hslToHex((baseHue + 120) % 360, 85, 50);
        c3 = hslToHex((baseHue + 240) % 360, 80, 55);
        c4 = hslToHex((baseHue + 60) % 360, 90, 60);
        c5 = hslToHex((baseHue + 180) % 360, 85, 40);
      } else if (mode === 3) { // Deep Vibrant Minimal
        bg = hslToHex(baseHue, 40, 12);
        c1 = hslToHex((baseHue + 45) % 360, 85, 65);
        c2 = hslToHex((baseHue + 90) % 360, 80, 60);
        c3 = hslToHex((baseHue + 180) % 360, 90, 70);
        c4 = hslToHex((baseHue + 240) % 360, 75, 65);
        c5 = hslToHex((baseHue + 315) % 360, 85, 75);
      } else { // Warm Sunset / Earthy
        bg = hslToHex(baseHue, 30, 88);
        c1 = hslToHex(baseHue, 75, 40);
        c2 = hslToHex((baseHue + 30) % 360, 85, 50);
        c3 = hslToHex((baseHue + 60) % 360, 90, 55);
        c4 = hslToHex((baseHue + 90) % 360, 80, 60);
        c5 = hslToHex((baseHue + 140) % 360, 70, 45);
      }
      return { background: bg, color1: c1, color2: c2, color3: c3, color4: c4, color5: c5 };
    }

    function randomizeScene() {
      // 1. New Visual Theme
      const theme = generateRandomTheme();
      params.preset = 'Custom';
      params.background = theme.background;
      params.color1 = theme.color1;
      params.color2 = theme.color2;
      params.color3 = theme.color3;
      params.color4 = theme.color4;
      params.color5 = theme.color5;

      // 2. Geometric Parameters
      params.spacing = +(3.2 + Math.random() * 2.2).toFixed(2);
      params.scale = +(0.8 + Math.random() * 0.45).toFixed(2);

      // 3. Motion Parameters
      const animList = ['Original Multi-Axis', 'Gentle Floating Orbit', 'Harmonic Wave', 'Individual Spin'];
      params.animation = animList[Math.floor(Math.random() * animList.length)];
      params.speed = +(0.6 + Math.random() * 1.2).toFixed(2);

      // Apply changes
      rebuildScene();
      updateGuiDisplays(gui);
    }

    function updateGuiDisplays(targetGui) {
      if (!targetGui) return;
      if (targetGui.controllers) {
        targetGui.controllers.forEach(c => c.updateDisplay());
      }
      if (targetGui.folders) {
        targetGui.folders.forEach(f => updateGuiDisplays(f));
      }
    }

    // ----- Wheel Zoom & Screen Drag Handling ----- //
    window.addEventListener('wheel', function(e) {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.08 : 0.925;
      params.zoom = Math.max(0.15, Math.min(12.0, +(params.zoom * zoomFactor).toFixed(3)));
      updateZoom();
      updateGuiDisplays(gui);
    }, { passive: false });

    let isPointerDown = false;
    let isPanning = false;
    let isRotating = false;
    let startTranslateX = 0, startTranslateY = 0;
    let startRotX = 0, startRotY = 0;
    let downX = 0, downY = 0;
    const dragThreshold = 5;
    let didDrag = false;

    visibleCanvas.addEventListener('pointerdown', function(e) {
      if (e.target !== visibleCanvas) return;

      isPointerDown = true;
      didDrag = false;
      downX = e.clientX;
      downY = e.clientY;

      if (e.button === 2 || e.shiftKey || e.altKey || params.dragMode === 'Rotate Scene') {
        isRotating = true;
        isPanning = false;
        startRotX = viewRotation.x;
        startRotY = viewRotation.y;
      } else if (e.button === 0) {
        isPanning = true;
        isRotating = false;
        startTranslateX = illo.translate.x;
        startTranslateY = illo.translate.y;
      }
    });

    window.addEventListener('pointermove', function(e) {
      if (!isPointerDown) return;
      const dx = e.clientX - downX;
      const dy = e.clientY - downY;

      if (Math.hypot(dx, dy) > dragThreshold) {
        didDrag = true;
      }

      if (isPanning) {
        const currentZoom = illo.zoom || 1;
        illo.translate.x = startTranslateX + (dx / currentZoom);
        illo.translate.y = startTranslateY + (dy / currentZoom);
      } else if (isRotating) {
        const dSize = displaySize || Math.min(window.innerWidth, window.innerHeight);
        viewRotation.x = startRotX - (dy / dSize * TAU);
        viewRotation.y = startRotY - (dx / dSize * TAU);
      }
    });

    window.addEventListener('pointerup', function(e) {
      if (!isPointerDown) return;
      isPointerDown = false;

      // Click without drag triggers procedural variation if enabled
      if (!didDrag && e.target === visibleCanvas && e.button === 0 && !e.shiftKey && !e.altKey) {
        if (params.randomizeOnClick) {
          randomizeScene();
        }
      }
      isPanning = false;
      isRotating = false;
    });

    visibleCanvas.addEventListener('contextmenu', function(e) {
      e.preventDefault();
    });

    // ----- Hide / Show UI with "H" Key ----- //
    window.addEventListener('keydown', function(e) {
      if (e.key === 'h' || e.key === 'H') {
        if (gui._hidden) {
          gui.show();
        } else {
          gui.hide();
        }
      }
    });

    window.addEventListener('resize', function() {
      updateDimensions();
    });

    // ----- Lil-GUI Setup ----- //
    const gui = new GUI({ title: 'Scene Controls' });

    // Color Folder
    const fColors = gui.addFolder('Colors & Theme');
    fColors.add(params, 'preset', ['Original Sunset', 'Black & White', 'White & Black', 'Cyber Neon', 'Nordic Pastel', 'Custom'])
      .name('Color Scheme')
      .onChange(function(val) {
        if (val !== 'Custom' && colorPresets[val]) {
          const p = colorPresets[val];
          params.background = p.background;
          params.color1 = p.color1;
          params.color2 = p.color2;
          params.color3 = p.color3;
          params.color4 = p.color4;
          params.color5 = p.color5;
          rebuildScene();
          updateGuiDisplays(gui);
        }
      });

    fColors.add(params, 'greenscreen')
      .name('Greenscreen (#00ff00)');

    fColors.addColor(params, 'background')
      .name('Background')
      .onChange(function() {
        params.preset = 'Custom';
        updateGuiDisplays(gui);
      });

    fColors.addColor(params, 'color1')
      .name('Color 1')
      .onChange(function() {
        params.preset = 'Custom';
        rebuildScene();
        updateGuiDisplays(gui);
      });

    fColors.addColor(params, 'color2')
      .name('Color 2')
      .onChange(function() {
        params.preset = 'Custom';
        rebuildScene();
        updateGuiDisplays(gui);
      });

    fColors.addColor(params, 'color3')
      .name('Color 3')
      .onChange(function() {
        params.preset = 'Custom';
        rebuildScene();
        updateGuiDisplays(gui);
      });

    fColors.addColor(params, 'color4')
      .name('Color 4')
      .onChange(function() {
        params.preset = 'Custom';
        rebuildScene();
        updateGuiDisplays(gui);
      });

    fColors.addColor(params, 'color5')
      .name('Color 5')
      .onChange(function() {
        params.preset = 'Custom';
        rebuildScene();
        updateGuiDisplays(gui);
      });

    // Animation Folder
    const fAnim = gui.addFolder('Animation');
    fAnim.add(params, 'animation', [
      'Original Multi-Axis',
      'Gentle Floating Orbit',
      'Harmonic Wave',
      'Individual Spin',
      'Static (No Movement)'
    ]).name('Animation');

    fAnim.add(params, 'speed', 0.0, 3.0, 0.05).name('Speed');
    fAnim.add(params, 'isSpinning').name('Auto Animate');

    // Geometry & Display Folder
    const fGeom = gui.addFolder('Geometry & Display');
    fGeom.add(params, 'zoom', 0.2, 5.0, 0.05)
      .name('Zoom')
      .onChange(function() {
        updateZoom();
      });

    fGeom.add(params, 'spacing', 2.0, 7.0, 0.1)
      .name('Grid Spacing')
      .onChange(function() {
        rebuildScene();
      });

    fGeom.add(params, 'scale', 0.4, 2.0, 0.05)
      .name('Shape Scale')
      .onChange(function() {
        rebuildScene();
      });

    fGeom.add(params, 'dpr', 0.5, 3.0, 0.25)
      .name('DPR (Pixel Ratio)')
      .onChange(function() {
        updateDimensions();
      });

    fGeom.add(params, 'resetView').name('Reset View');

    // Interaction Folder
    const fInteract = gui.addFolder('Interaction');
    fInteract.add(params, 'dragMode', ['Pan Object', 'Rotate Scene']).name('Drag Action');
    fInteract.add(params, 'randomizeOnClick').name('Click Randomize');
    fInteract.add(params, 'randomizeNow').name('Randomize Now');

    // PostProcessor GUI Folder
    postProcessor.attachGUI(gui, 'Post-Processing');

    // ----- Initialize & Start Animation ----- //
    updateDimensions();
    rebuildScene();
    animate();
  </script>
</body>
</html>
