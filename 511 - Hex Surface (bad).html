/* Helpers                                                             */

const DEG = Math.PI / 180;
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (t, a, b) => a + t * (b - a);
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

function hash2(i, j) {
  let h = Math.imul(i, 374761393) + Math.imul(j, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
}

function hsl(h, s, l) {
  h = ((h % 360) + 360) % 360;
  s = clamp(s, 0, 1); l = clamp(l, 0, 1);
  const a = s * Math.min(l, 1 - l);
  const f = (n) => {
    const k = (n + h / 30) % 12;
    const c = l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1));
    return Math.round(c * 255).toString(16).padStart(2, '0');
  };
  return '#' + f(0) + f(8) + f(4);
}

/* Improved Perlin noise (3D) */
const PERM = new Uint8Array(512);
(function () {
  const p = Array.from({ length: 256 }, (_, i) => i);
  let s = 1337;
  const r = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
  for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; }
  for (let i = 0; i < 512; i++) PERM[i] = p[i & 255];
})();
const fade = (t) => t * t * t * (t * (t * 6 - 15) + 10);
function grad(h, x, y, z) {
  h &= 15;
  const u = h < 8 ? x : y;
  const v = h < 4 ? y : (h === 12 || h === 14 ? x : z);
  return ((h & 1) ? -u : u) + ((h & 2) ? -v : v);
}
function noise3(x, y, z) {
  const X = Math.floor(x), Y = Math.floor(y), Z = Math.floor(z);
  x -= X; y -= Y; z -= Z;
  const xi = X & 255, yi = Y & 255, zi = Z & 255;
  const u = fade(x), v = fade(y), w = fade(z);
  const A = PERM[xi] + yi, AA = PERM[A] + zi, AB = PERM[A + 1] + zi;
  const B = PERM[xi + 1] + yi, BA = PERM[B] + zi, BB = PERM[B + 1] + zi;
  return lerp(w,
    lerp(v, lerp(u, grad(PERM[AA], x, y, z), grad(PERM[BA], x - 1, y, z)),
            lerp(u, grad(PERM[AB], x, y - 1, z), grad(PERM[BB], x - 1, y - 1, z))),
    lerp(v, lerp(u, grad(PERM[AA + 1], x, y, z - 1), grad(PERM[BA + 1], x - 1, y, z - 1)),
            lerp(u, grad(PERM[AB + 1], x, y - 1, z - 1), grad(PERM[BB + 1], x - 1, y - 1, z - 1))));
}

function setDir(light, on, intensity, color, az, el) {
  light.intensity = on ? intensity * P.lightScale : 0;
  light.color.set(color);
  const a = az * DEG, e = el * DEG;
  light.position.set(Math.cos(e) * Math.cos(a), Math.sin(e), Math.cos(e) * Math.sin(a)).multiplyScalar(100);
}

  const k = P.lightScale;

}

/* ------------------------------------------------------------------ */
/* Tile geometry                                                       */
/* ------------------------------------------------------------------ */
function buildGeometry(shape, relief, skirt) {
  const pos = [];
  const V = [];
  for (let i = 0; i < 6; i++) {
    const a = (30 + 60 * i) * DEG;
    V.push([Math.cos(a), Math.sin(a)]);
  }
  const pt = (i, y, s = 1) => [V[i % 6][0] * s, y, V[i % 6][1] * s];

  const tri = (a, b, c, hint) => {
    const ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2];
    const vx = c[0] - a[0], vy = c[1] - a[1], vz = c[2] - a[2];
    const nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
    if (nx * hint[0] + ny * hint[1] + nz * hint[2] < 0) { const t = b; b = c; c = t; }
    pos.push(...a, ...b, ...c);
  };
  const quad = (a, b, c, d, hint) => { tri(a, b, c, hint); tri(a, c, d, hint); };
  const UP = [0, 1, 0];

  const ringY = [0, 0, 0, 0, 0, 0];
  const h = relief;

  if (shape === 'Cube' || shape === 'Inverted Cube') {
    /* three planar rhombi meeting at a raised (or sunken) corner: reads as a small cube */
    const u = shape === 'Cube' ? h : -h;
    for (let i = 0; i < 6; i++) ringY[i] = (i % 2 === 0) ? 0 : -u;
    const apex = [0, u, 0];
    for (let k = 0; k < 3; k++) {
      quad(apex, pt(2 * k, ringY[2 * k]), pt(2 * k + 1, ringY[(2 * k + 1) % 6]), pt(2 * k + 2, ringY[(2 * k + 2) % 6]), UP);
    }
  } else if (shape === 'Pyramid') {
    const apex = [0, h, 0];
    for (let i = 0; i < 6; i++) tri(apex, pt(i, 0), pt(i + 1, 0), UP);
  } else if (shape === 'Gem') {
    const top = h * 0.9, s = 0.55;
    const c = [0, top, 0];
    for (let i = 0; i < 6; i++) {
      tri(c, pt(i, top, s), pt(i + 1, top, s), UP);
      quad(pt(i, 0), pt(i + 1, 0), pt(i + 1, top, s), pt(i, top, s), UP);
    }
  } else { // Prism
    const c = [0, 0, 0];
    for (let i = 0; i < 6; i++) tri(c, pt(i, 0), pt(i + 1, 0), UP);
  }

  /* side walls so neighbouring tiles at different heights never show holes */
  const floorY = Math.min(...ringY) - skirt;
  for (let i = 0; i < 6; i++) {
    const j = (i + 1) % 6;
    const am = (30 + 60 * i + 30) * DEG;
    quad(pt(i, ringY[i]), pt(j, ringY[j]), pt(j, floorY), pt(i, floorY), [Math.cos(am), 0, Math.sin(am)]);
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pos), 3));
  g.computeVertexNormals(); // non-indexed -> flat facets
  return g;
}

/* ------------------------------------------------------------------ */
/* Instanced grid (infinite surface: a window that follows the target) */
/* ------------------------------------------------------------------ */
let mesh = null;
let grid = null;
const MAX_TILES = 60000;

function rebuildMesh() {
  if (mesh) { scene.remove(mesh); mesh.geometry.dispose(); mesh.dispose(); }
  const R = P.tileSize;
  const dx = Math.sqrt(3) * R, dz = 1.5 * R;
  let rad = P.gridRadius;
  let cols = Math.ceil(2 * rad / dx) + 2, rows = Math.ceil(2 * rad / dz) + 2;
  while (cols * rows > MAX_TILES) {
    rad *= 0.95;
    cols = Math.ceil(2 * rad / dx) + 2; rows = Math.ceil(2 * rad / dz) + 2;
  }
  grid = { R, dx, dz, rad, cols, rows };
  const cap = cols * rows;
  const geo = buildGeometry(P.shape, P.relief, P.skirt);
  mesh = new THREE.InstancedMesh(geo, material, cap);
  mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  const arr = mesh.instanceMatrix.array;
  for (let i = 0; i < cap; i++) arr[i * 16 + 15] = 1;
  mesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(cap * 3), 3);
  mesh.instanceColor.setUsage(THREE.DynamicDrawUsage);
  mesh.frustumCulled = false;
  mesh.count = 0;
  scene.add(mesh);
}

    _c.set(P['c' + i]);
    pal[i * 3] = _c.r; pal[i * 3 + 1] = _c.g; pal[i * 3 + 2] = _c.b;

}

function updateTiles() {
  const { R, dx, dz, rad, cols, rows } = grid;
  const T = simTime;
  const mArr = mesh.instanceMatrix.array;
  const cArr = mesh.instanceColor.array;

  const wA = P.dirAmount, wC = P.crossAmount, wR = P.radialAmount, wN = P.noiseAmount;
  const wSum = wA + wC + wR + wN;
  const invW = wSum > 1e-4 ? 1 / wSum : 0;
  const a1 = P.dirAngle * DEG, ca = Math.cos(a1), sa = Math.sin(a1);
  const a2 = (P.dirAngle + P.crossAngle) * DEG, cb = Math.cos(a2), sb = Math.sin(a2);
  const k1 = TAU / P.dirWavelength, ph1 = T * P.dirSpeed;
  const k2 = TAU / (P.dirWavelength * 0.63), ph2 = T * P.dirSpeed * 0.8;
  const kr = TAU / P.radialWavelength, phr = T * P.radialSpeed;
  const rcx = Math.cos(T * 0.05) * P.radialRoam, rcz = Math.sin(T * 0.037) * P.radialRoam;
  const ns = 1 / P.noiseWavelength, nt = T * P.noiseSpeed, seed = P.noiseSeed, warp = P.warp;
  const crest = 1 + 2 * P.sharp;
  const steps = Math.round(P.steps), stepW = 0.5 * (1 - P.stepSharp) + 0.02;
  const amp = P.amplitude, sizeXZ = R * P.tileGap, fadeW = Math.max(0.02, P.edgeFade);

  const phase0 = P.colorOffset + T * P.colorFlow;
  const cH = P.colorByHeight, jit = P.colorJitter;
  const sa2 = P.spreadAngle * DEG;
  const csx = Math.cos(sa2) * P.colorSpread * 0.01, csz = Math.sin(sa2) * P.colorSpread * 0.01;
  const pn1 = palN - 1;

  const tx = view.x, tz = view.z;
  const i0 = Math.round(tx / dx), j0 = Math.round(tz / dz);
  const hc = cols >> 1, hr = rows >> 1;
  let n = 0;

  for (let j = 0; j < rows; j++) {
    const jw = j0 + j - hr;
    const z = jw * dz;
    const odd = (jw & 1) ? 0.5 : 0;
    const ddz = z - tz;
    for (let i = 0; i < cols; i++) {
      const iw = i0 + i - hc;
      const x = (iw + odd) * dx;
      const ddx = x - tx;
      const dn = Math.sqrt(ddx * ddx + ddz * ddz) / rad;
      if (dn >= 1) continue;

      let f = 1;
      const tf = (1 - dn) / fadeW;
      if (tf < 1) f = tf * tf * (3 - 2 * tf);

      let v = 0;
      if (wA > 0) v += wA * Math.sin((x * ca + z * sa) * k1 - ph1);
      if (wC > 0) v += wC * Math.sin((x * cb + z * sb) * k2 - ph2 + 1.7);
      if (wR > 0) {
        const rx = x - rcx, rz = z - rcz;
        const d = Math.sqrt(rx * rx + rz * rz);
        v += wR * Math.sin(d * kr - phr) / (1 + d * 0.007);
      }
      if (wN > 0) {
        let px = x * ns + seed, pz = z * ns + seed * 0.37;
        if (warp > 0) {
          const wx = noise3(px * 0.7 + 3.1, pz * 0.7 + 1.7, nt * 0.8) * warp;
          const wz = noise3(px * 0.7 + 7.7, pz * 0.7 + 9.2, nt * 0.8) * warp;
          px += wx; pz += wz;
        }
        const nv = (noise3(px, pz, nt) * 0.65 + noise3(px * 2.1 + 11, pz * 2.1 + 5, nt * 1.3) * 0.35) * 1.4;
        v += wN * nv;
      }
      v *= invW;
      v = v < -1 ? -1 : v > 1 ? 1 : v;
      if (crest !== 1) v = Math.pow((v + 1) * 0.5, crest) * 2 - 1;
      if (steps > 0) {
        const kk = (v + 1) * 0.5 * steps;
        const fl = Math.floor(kk);
        const s = smoothstep(0.5 - stepW, 0.5 + stepW, kk - fl);
        v = ((fl + s) / steps) * 2 - 1;
      }

      const y = v * amp;
      const o = n * 16;
      const sxz = sizeXZ * f;
      mArr[o] = sxz; mArr[o + 5] = Math.max(0.001, R * f); mArr[o + 10] = sxz;
      mArr[o + 12] = x; mArr[o + 13] = y; mArr[o + 14] = z;

      /* color flows through the palette (ping-pong so it is always continuous) */
      let ph = phase0 + (v + 1) * 0.5 * cH + (x * csx + z * csz);
      if (jit > 0) ph += hash2(iw, jw) * jit;
      ph -= Math.floor(ph * 0.5) * 2;
      const pp = ph > 1 ? 2 - ph : ph;
      const fi = pp * pn1;
      let ii = fi | 0; if (ii > pn1 - 1) ii = pn1 - 1;
      const fr = fi - ii;
      const p0 = ii * 3, p1 = p0 + 3, c3 = n * 3;
      cArr[c3] = pal[p0] + (pal[p1] - pal[p0]) * fr;
      cArr[c3 + 1] = pal[p0 + 1] + (pal[p1 + 1] - pal[p0 + 1]) * fr;
      cArr[c3 + 2] = pal[p0 + 2] + (pal[p1 + 2] - pal[p0 + 2]) * fr;
      n++;
    }
  }
  mesh.count = n;
  mesh.instanceMatrix.needsUpdate = true;
  mesh.instanceColor.needsUpdate = true;
}

/* ------------------------------------------------------------------ */
/* Camera                                                              */
/* ------------------------------------------------------------------ */
function applyCamera() {
  P.camTilt = clamp(P.camTilt, 5, 80);
  P.camDistance = clamp(P.camDistance, 6, 500);
  P.camAzimuth = ((P.camAzimuth % 360) + 360) % 360;
  if (camera.fov !== P.fov) { camera.fov = P.fov; camera.updateProjectionMatrix(); }
  const t = P.camTilt * DEG, a = P.camAzimuth * DEG, d = P.camDistance;
  camera.position.set(view.x + d * Math.sin(t) * Math.sin(a), d * Math.cos(t), view.z + d * Math.sin(t) * Math.cos(a));
  camera.lookAt(view.x, 0, view.z);
  camera.updateMatrixWorld(true);
}

/* Camera animation is applied as incremental deltas, so manual zoom/tilt/pan is never reset. */
function animateCamera(dT) {
  if (dT <= 0) return;
  const tm = simTime - dT * 0.5;
  if (P.orbitSpeed) P.camAzimuth += P.orbitSpeed * dT;
  if (P.sway) { const w = P.swaySpeed; P.camAzimuth += P.sway * w * Math.cos(w * tm) * dT; }
  if (P.swing) { const w = P.swingSpeed; P.camTilt += P.swing * w * Math.cos(w * tm) * dT; }
  if (P.breathe) { const w = P.breatheSpeed; P.camDistance *= Math.exp(P.breathe * w * Math.cos(w * tm) * dT); }
  if (P.drift) {
    const a = P.driftAngle * DEG;
    view.x += Math.cos(a) * P.drift * dT;
    view.z += Math.sin(a) * P.drift * dT;
  }
}

const _v = new THREE.Vector3();
function groundPoint(cx, cy) {
  const nx = (cx / innerWidth) * 2 - 1, ny = -(cy / innerHeight) * 2 + 1;
  _v.set(nx, ny, 0.5).unproject(camera).sub(camera.position).normalize();
  if (_v.y > -1e-3) return null;
  const t = -camera.position.y / _v.y;
  return { x: camera.position.x + _v.x * t, z: camera.position.z + _v.z * t };
}

/* ------------------------------------------------------------------ */
/* Pointer interaction: drag = move surface, wheel = zoom,             */
/* right/shift-drag = rotate, click = new random theme                 */
/* ------------------------------------------------------------------ */
const pointers = new Map();
let gesture = null, downInfo = null;

app.addEventListener('contextmenu', (e) => e.preventDefault());
app.addEventListener('pointerdown', (e) => {
  app.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1) {
    downInfo = { x: e.clientX, y: e.clientY, t: performance.now(), moved: false, button: e.button };
    const rotate = e.button === 2 || e.button === 1 || e.shiftKey || e.ctrlKey;
    gesture = { mode: rotate ? 'rot' : 'pan', grab: groundPoint(e.clientX, e.clientY), lx: e.clientX, ly: e.clientY };
  } else if (pointers.size === 2) {
    const [p, q] = [...pointers.values()];
    gesture = { mode: 'pinch', d: Math.hypot(p.x - q.x, p.y - q.y) };
    if (downInfo) downInfo.moved = true;
  }
});
app.addEventListener('pointermove', (e) => {
  if (!pointers.has(e.pointerId) || !gesture) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (gesture.mode === 'pinch' && pointers.size >= 2) {
    const [p, q] = [...pointers.values()];
    const d = Math.hypot(p.x - q.x, p.y - q.y);
    if (d > 1 && gesture.d > 1) { P.camDistance *= gesture.d / d; applyCamera(); }
    gesture.d = d;
    return;
  }
  if (pointers.size !== 1 || !downInfo) return;
  if (Math.hypot(e.clientX - downInfo.x, e.clientY - downInfo.y) > 4) downInfo.moved = true;
  if (!downInfo.moved) return;
  if (gesture.mode === 'pan') {
    const hit = groundPoint(e.clientX, e.clientY);
    if (hit && gesture.grab) {
      view.x += gesture.grab.x - hit.x;
      view.z += gesture.grab.z - hit.z;
      applyCamera();
    }
  } else if (gesture.mode === 'rot') {
    P.camAzimuth -= (e.clientX - gesture.lx) * 0.25;
    P.camTilt -= (e.clientY - gesture.ly) * 0.2;
    applyCamera();
  }
  gesture.lx = e.clientX; gesture.ly = e.clientY;
});
function endPointer(e) {
  if (!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  if (pointers.size === 0) {
    if (downInfo && !downInfo.moved && downInfo.button === 0 && e.type === 'pointerup' &&
        performance.now() - downInfo.t < 600 && P.clickRandomize) {
      randomizeTheme();
    }
    gesture = null; downInfo = null;
  } else {
    gesture = null;
    if (downInfo) downInfo.moved = true;
  }
}
app.addEventListener('pointerup', endPointer);
app.addEventListener('pointercancel', endPointer);
app.addEventListener('wheel', (e) => {
  e.preventDefault();
  const before = groundPoint(e.clientX, e.clientY);
  const delta = e.deltaMode === 1 ? e.deltaY * 33 : e.deltaY;
  P.camDistance = clamp(P.camDistance * Math.exp(delta * 0.0012), 6, 500);
  applyCamera();
  const after = groundPoint(e.clientX, e.clientY);
  if (before && after) {
    view.x += before.x - after.x;
    view.z += before.z - after.z;
    applyCamera();
  }
}, { passive: false });

/* ------------------------------------------------------------------ */
/* Scheme / preset / random logic                                      */
/* ------------------------------------------------------------------ */
let dirtyMesh = true, dirtyPalette = true, dirtyRenderer = false;
const ctrl = { c: [] };
let gui = null;

function applyScheme(name) {
  const sch = SCHEMES[name];
  if (!sch) return;
  const out = sch.gen ? sch.gen(P.baseHue, P.saturation / 100) : sch;
  P.colorCount = Math.min(6, out.colors.length);
  out.colors.forEach((c, i) => { if (i < 6) P['c' + i] = c; });
  if (P.autoBg) P.background = out.bg;
  dirtyPalette = true;
}

function applyPreset(name) {
  const pr = PRESETS[name];
  if (!pr) return;
  Object.assign(P, pr);
  dirtyMesh = true;
}

function syncUI() {
  if (!gui) return;
  const gen = !!(SCHEMES[P.scheme] && SCHEMES[P.scheme].gen);
  ctrl.hue.show(gen); ctrl.sat.show(gen);
  ctrl.c[5].show(P.colorCount > 5);
  gui.controllersRecursive().forEach((c) => c.updateDisplay());
}

function randomizeTheme() {
  /* color theme */
  P.scheme = pick(SCHEME_LIST);
  P.baseHue = Math.floor(rnd(0, 360));
  P.saturation = Math.round(rnd(55, 92));
  applyScheme(P.scheme);
  P.colorOffset = +rnd(0, 2).toFixed(2);
  P.colorFlow = +rnd(0.02, 0.1).toFixed(3);
  P.colorByHeight = +rnd(0.2, 1.5).toFixed(2);
  P.colorSpread = +rnd(0, 0.8).toFixed(2);
  P.spreadAngle = Math.floor(rnd(0, 360));
  P.colorJitter = +rnd(0, 0.12).toFixed(3);

  /* geometry */
  P.shape = pick(SHAPES);
  P.tileSize = +rnd(1.0, 2.4).toFixed(2);
  P.tileGap = +rnd(0.9, 1.0).toFixed(3);
  P.relief = +rnd(0.35, 1.1).toFixed(3);
  P.skirt = +rnd(0.8, 2.2).toFixed(2);

  /* motion (kept slow and smooth) */
  P.amplitude = +rnd(1.5, 7).toFixed(2);
  P.dirAmount = +rnd(0, 1).toFixed(2);
  P.dirWavelength = Math.round(rnd(25, 80));
  P.dirAngle = Math.floor(rnd(0, 360));
  P.dirSpeed = +rnd(0.15, 0.55).toFixed(2);
  P.crossAmount = Math.random() < 0.6 ? +rnd(0.2, 0.8).toFixed(2) : 0;
  P.crossAngle = Math.floor(rnd(30, 150));
  P.radialAmount = Math.random() < 0.4 ? +rnd(0.3, 1).toFixed(2) : 0;
  P.radialWavelength = Math.round(rnd(18, 50));
  P.radialSpeed = +rnd(0.2, 0.8).toFixed(2);
  P.radialRoam = Math.round(rnd(0, 30));
  P.noiseAmount = +rnd(0, 1).toFixed(2);
  P.noiseWavelength = Math.round(rnd(25, 90));
  P.noiseSpeed = +rnd(0.04, 0.2).toFixed(3);
  P.warp = +rnd(0, 1.4).toFixed(2);
  P.sharp = +rnd(0, 0.8).toFixed(2);
  P.noiseSeed = Math.floor(rnd(0, 1000));
  if (Math.random() < 0.3) { P.steps = Math.floor(rnd(4, 10)); P.stepSharp = +rnd(0.2, 0.8).toFixed(2); }
  else { P.steps = 0; }
  if (P.dirAmount + P.crossAmount + P.radialAmount + P.noiseAmount < 0.3) P.dirAmount = 1;

  /* camera motion */
  P.cameraAnim = true;
  P.orbitSpeed = +(rnd(1.2, 3.5) * (Math.random() < 0.5 ? -1 : 1)).toFixed(2);
  P.sway = Math.random() < 0.3 ? +rnd(5, 14).toFixed(1) : 0;
  P.swing = Math.random() < 0.4 ? +rnd(2, 6).toFixed(1) : 0;
  P.breathe = Math.random() < 0.4 ? +rnd(0.03, 0.1).toFixed(3) : 0;
  P.drift = Math.random() < 0.3 ? +rnd(1, 3).toFixed(1) : 0;
  P.driftAngle = Math.floor(rnd(0, 360));

  P.preset = 'Custom';
  dirtyMesh = true;
  syncUI();
}

  const k = e.property;
  if (k === 'preset') {
    if (e.value !== 'Custom') { applyPreset(e.value); syncUI(); }
    return;
  }
  if (k === 'scheme') {
    if (e.value !== 'Custom') applyScheme(e.value);
    syncUI();
    return;
  }
  if (k === 'baseHue' || k === 'saturation') { applyScheme(P.scheme); syncUI(); return; }
  if (/^c[0-5]$/.test(k)) {
    P.scheme = 'Custom'; dirtyPalette = true; syncUI();
    return;
  }
  if (k === 'shape' || k === 'relief' || k === 'skirt' || k === 'tileSize' || k === 'gridRadius') dirtyMesh = true;
  if (k === 'pixelRatio') { renderer.setPixelRatio(P.pixelRatio); renderer.setSize(innerWidth, innerHeight); }
  if (k === 'antialias') dirtyRenderer = true;
  if (k === 'toneMapping') { renderer.toneMapping = TONE[P.toneMapping]; material.needsUpdate = true; }
  if (MOTION_KEYS.includes(k) && P.preset !== 'Custom') { P.preset = 'Custom'; ctrl.preset.updateDisplay(); }
});

  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
});

/* ------------------------------------------------------------------ */
/* Main loop                                                           */
/* ------------------------------------------------------------------ */
applyPreset(P.preset);
applyScheme(P.scheme);
syncUI();

let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;

  if (dirtyRenderer) { createRenderer(); dirtyRenderer = false; }
  if (dirtyMesh) { rebuildMesh(); dirtyMesh = false; }
  if (dirtyPalette) { rebuildPalette(); dirtyPalette = false; }

  const dT = dt * P.speed;
  simTime += dT;
  if (P.cameraAnim) animateCamera(dT);
  applyCamera();

  const bg = P.greenscreen ? '#00ff00' : P.background;
  if (bg !== lastBg) {
    renderer.setClearColor(bg, 1);
    scene.fog.color.set(bg);
    document.body.style.background = bg;
    lastBg = bg;
  }
  scene.fog.density = P.greenscreen ? 0 : P.fog;
  renderer.toneMappingExposure = P.exposure;
  material.roughness = P.roughness;
  material.metalness = P.metalness;

  updateLights();
  updateTiles();
  renderer.render(scene, camera);
}
camera.aspect = innerWidth / innerHeight;
camera.updateProjectionMatrix();
requestAnimationFrame(frame);
</script>
</body>
</html>
