    // --- LIQUID ECTOPLASM TRAIL RIBBON SHADER ---
    function buildLiquidEctoplasmTrail() {
      const maxPoints = 120;
      const vertexCount = maxPoints * 2;
      const positions = new Float32Array(vertexCount * 3);
      const uvs = new Float32Array(vertexCount * 2);
      const ages = new Float32Array(vertexCount);
      const indices = [];

      for (let i = 0; i < maxPoints - 1; i++) {
        const i2 = i * 2;
        indices.push(i2, i2 + 1, i2 + 2);
        indices.push(i2 + 2, i2 + 1, i2 + 3);
      }

      ribbonGeo = new THREE.BufferGeometry();
      ribbonGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      ribbonGeo.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
      ribbonGeo.setAttribute('aAge', new THREE.BufferAttribute(ages, 1));
      ribbonGeo.setIndex(indices);

      ribbonMat = new THREE.ShaderMaterial({
        uniforms: {
          uTime: { value: 0 },
          uColor1: { value: new THREE.Color(params.ectoplasmColor) },
          uColor2: { value: new THREE.Color(params.coreColor) },
          uTurbulence: { value: params.trailTurbulence },
          uOpacity: { value: 0.95 }
        },
        vertexShader: `
          attribute float aAge;
          varying vec2 vUv;
          varying float vAge;
          uniform float uTime;
          uniform float uTurbulence;

          void main() {
            vUv = uv;
            vAge = aAge;
            vec3 pos = position;
            float wave = sin(aAge * 22.0 - uTime * 6.0) * cos(uv.y * 3.14159) * 0.04 * uTurbulence;
            pos.y += wave;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
          }
        `,
        fragmentShader: `
          varying vec2 vUv;
          varying float vAge;
          uniform vec3 uColor1;
          uniform vec3 uColor2;
          uniform float uTime;
          uniform float uOpacity;

          void main() {
            if (vAge >= 1.0) discard;
            float distFromCenter = abs(vUv.y - 0.5) * 2.0;
            float core = pow(clamp(1.0 - distFromCenter, 0.0, 1.0), 2.2);
            float glow = pow(clamp(1.0 - distFromCenter, 0.0, 1.0), 0.75);

            float noise = 0.8 + 0.2 * sin(vAge * 36.0 - uTime * 6.0 + sin(vUv.y * 12.0));
            float life = clamp(1.0 - vAge, 0.0, 1.0);
            float alpha = (core * 0.95 + glow * 0.55) * life * noise * uOpacity;

            vec3 col = mix(uColor1, uColor2, core);
            col += uColor2 * pow(core, 4.0) * 1.5;

            gl_FragColor = vec4(col, alpha);
          }
        `,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        side: THREE.DoubleSide
      });

      ribbonMesh = new THREE.Mesh(ribbonGeo, ribbonMat);
      ribbonMesh.frustumCulled = false;
      scene.add(ribbonMesh);
    }

    // --- FLOATING ECTOPLASM SPARKS SYSTEM ---
    function buildEctoplasmSparks() {
      const sparkCount = 200;
      const sparkPositions = new Float32Array(sparkCount * 3);
      const sparkAges = new Float32Array(sparkCount);
      const sparkVelocities = [];

      for (let i = 0; i < sparkCount; i++) {
        sparkPositions[i * 3] = 0;
        sparkPositions[i * 3 + 1] = 0.3;
        sparkPositions[i * 3 + 2] = 0;
        sparkAges[i] = Math.random();
        sparkVelocities.push(new THREE.Vector3(
          (Math.random() - 0.5) * 0.3,
          0.08 + Math.random() * 0.18,
          (Math.random() - 0.5) * 0.3
        ));
      }

      sparkGeo = new THREE.BufferGeometry();
      sparkGeo.setAttribute('position', new THREE.BufferAttribute(sparkPositions, 3));
      sparkGeo.setAttribute('aAge', new THREE.BufferAttribute(sparkAges, 1));
      sparkGeo.userData = { velocities: sparkVelocities };

      const pCanvas = document.createElement('canvas');
      pCanvas.width = 64;
      pCanvas.height = 64;
      const pCtx = pCanvas.getContext('2d');
      const grad = pCtx.createRadialGradient(32, 32, 0, 32, 32, 32);
      grad.addColorStop(0, 'rgba(255,255,255,1)');
      grad.addColorStop(0.3, 'rgba(255,255,255,0.7)');
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      pCtx.fillStyle = grad;
      pCtx.fillRect(0, 0, 64, 64);
      const pTex = new THREE.CanvasTexture(pCanvas);

      sparkMat = new THREE.PointsMaterial({
        color: new THREE.Color(params.ectoplasmColor),
        size: 0.18,
        map: pTex,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      sparkSystem = new THREE.Points(sparkGeo, sparkMat);
      scene.add(sparkSystem);
    }

    // --- UPDATE ECTOPLASM TRAIL RIBBON ---
    function updateEctoplasmTrail(delta) {
      if (!planchetteGroup) return;

      const lensWorldPos = planchetteGroup.position;

      const minDistance = 0.035;
      const lastPoint = trailPoints[0];
      const dist = lastPoint ? lensWorldPos.distanceTo(lastPoint.pos) : 999;

      if (dist > minDistance) {
        trailPoints.unshift({
          pos: lensWorldPos.clone(),
          time: animTime
        });
      }

      const maxPoints = Math.min(params.trailLength, 120);
      while (trailPoints.length > maxPoints) {
        trailPoints.pop();
      }

      if (trailPoints.length < 2) return;

      const posAttr = ribbonGeo.attributes.position;
      const uvAttr = ribbonGeo.attributes.uv;
      const ageAttr = ribbonGeo.attributes.aAge;
      const baseWidth = 0.52;

      for (let i = 0; i < trailPoints.length; i++) {
        const pt = trailPoints[i];
        const age = i / (trailPoints.length - 1);

        const prev = trailPoints[Math.max(0, i - 1)].pos;
        const next = trailPoints[Math.min(trailPoints.length - 1, i + 1)].pos;
        const tangent = new THREE.Vector3().subVectors(next, prev).normalize();
        if (tangent.lengthSq() < 0.001) tangent.set(0, 0, -1);

        const normal = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();

        const taper = Math.sin(age * Math.PI * 0.5);
        const width = baseWidth * (1.0 - taper * 0.85) * (age < 0.08 ? (age / 0.08) : 1.0);

        const leftX = pt.pos.x - normal.x * width;
        const leftZ = pt.pos.z - normal.z * width;
        const rightX = pt.pos.x + normal.x * width;
        const rightZ = pt.pos.z + normal.z * width;
        const y = 0.215;

        posAttr.setXYZ(i * 2, leftX, y, leftZ);
        posAttr.setXYZ(i * 2 + 1, rightX, y, rightZ);

        uvAttr.setXY(i * 2, age, 0);
        uvAttr.setXY(i * 2 + 1, age, 1);

        ageAttr.setX(i * 2, age);
        ageAttr.setX(i * 2 + 1, age);
      }

      posAttr.needsUpdate = true;
      uvAttr.needsUpdate = true;
      ageAttr.needsUpdate = true;
      ribbonGeo.setDrawRange(0, (trailPoints.length - 1) * 6);

      const sPos = sparkGeo.attributes.position;
      const sAge = sparkGeo.attributes.aAge;
      const vels = sparkGeo.userData.velocities;
      const sparkCount = sAge.count;

      for (let i = 0; i < sparkCount; i++) {
        let age = sAge.getX(i) + delta * 0.65 * params.animationSpeed;
        if (age >= 1.0) {
          age = 0;
          sPos.setXYZ(i, lensWorldPos.x + (Math.random() - 0.5) * 0.2, 0.26, lensWorldPos.z + (Math.random() - 0.5) * 0.2);
          vels[i].set(
            (Math.random() - 0.5) * 0.25,
            0.08 + Math.random() * 0.16,
            (Math.random() - 0.5) * 0.25
          );
        } else {
          const x = sPos.getX(i) + vels[i].x * delta * params.animationSpeed;
          const y = sPos.getY(i) + vels[i].y * delta * params.animationSpeed;
          const z = sPos.getZ(i) + vels[i].z * delta * params.animationSpeed;
          sPos.setXYZ(i, x, y, z);
        }
        sAge.setX(i, age);
      }
      sPos.needsUpdate = true;
      sAge.needsUpdate = true;

      ribbonMat.uniforms.uTime.value = animTime;
    }

    // --- 8 PRECONFIGURED ANIMATION ENGINES ---
    const targetPlanchettePos = new THREE.Vector3();

    function updatePreconfiguredAnimation(delta) {
      if (isDraggingPlanchette) return;

      const speed = params.animationSpeed;
      animTime += delta * speed;

      switch (params.animation) {
        case "Spirit Summoning": {
          const t = animTime * 0.45;
          const scaleX = 4.2;
          const scaleZ = 2.0;
          const denom = 1 + Math.sin(t) * Math.sin(t);
          targetPlanchettePos.x = (scaleX * Math.cos(t)) / denom;
          targetPlanchettePos.z = 0.15 + (scaleZ * Math.sin(t) * Math.cos(t)) / denom;

          camera.position.x = Math.sin(animTime * 0.12) * 2.5;
          camera.position.z = 9.5 + Math.cos(animTime * 0.12) * 0.8;
          break;
        }

        case "Spelling SÉANCE": {
          const spellSequence = ['S', 'E', 'A', 'N', 'C', 'E', 'CENTER'];
          const totalLetters = spellSequence.length;
          const cycleDuration = 3.2;
          const totalCycle = totalLetters * cycleDuration;
          const curCycle = (animTime % totalCycle);
          const letterIndex = Math.floor(curCycle / cycleDuration);
          const nextIndex = (letterIndex + 1) % totalLetters;
          const progress = (curCycle % cycleDuration) / cycleDuration;

          let t = progress;
          let factor;
          if (t < 0.65) {
            const p = t / 0.65;
            factor = p * p * (3 - 2 * p);
          } else {
            factor = 1.0 + Math.sin((t - 0.65) * 20.0) * 0.012;
          }

          const fromPos = LETTER_COORDS[spellSequence[letterIndex]] || LETTER_COORDS['CENTER'];
          const toPos = LETTER_COORDS[spellSequence[nextIndex]] || LETTER_COORDS['CENTER'];

          targetPlanchettePos.lerpVectors(fromPos, toPos, Math.min(factor, 1.0));
          break;
        }

        case "Yes / No Hesitation": {
          const t = (animTime * 0.35) % (Math.PI * 2);
          const yesPos = LETTER_COORDS['YES'];
          const noPos = LETTER_COORDS['NO'];
          const gbPos = LETTER_COORDS['GOODBYE'];

          if (t < Math.PI * 0.7) {
            const jitter = Math.sin(animTime * 8.0) * 0.08;
            targetPlanchettePos.set(yesPos.x + jitter, 0.325, yesPos.z + Math.cos(animTime * 7.0) * 0.06);
          } else if (t < Math.PI * 1.4) {
            const p = (t - Math.PI * 0.7) / (Math.PI * 0.7);
            const easeP = p * p * (3 - 2 * p);
            const archY = Math.sin(p * Math.PI) * 1.0;
            targetPlanchettePos.set(yesPos.x + easeP * (noPos.x - yesPos.x), 0.325, yesPos.z - archY);
          } else {
            const p = (t - Math.PI * 1.4) / (Math.PI * 0.6);
            const easeP = p * p * (3 - 2 * p);
            targetPlanchettePos.set(noPos.x + easeP * (yesPos.x - noPos.x), 0.325, noPos.z + Math.sin(p * Math.PI) * (gbPos.z - noPos.z));
          }
          break;
        }

        case "Whispering Orbit": {
          const t = animTime * 0.35;
          targetPlanchettePos.x = 5.4 * Math.cos(t);
          targetPlanchettePos.z = 0.15 + 3.0 * Math.sin(t);

          camera.position.x = Math.sin(animTime * 0.16) * 4.2;
          camera.position.z = 8.8 + Math.cos(animTime * 0.16) * 1.4;
          break;
        }

        case "Alphabet Tour": {
          const cycle = (animTime * 0.20) % 2.0;
          if (cycle < 1.0) {
            const u = -1.0 + 2.0 * cycle;
            const lx = 1024 + u * 650;
            const ly = 460 + (u * u) * 110;
            targetPlanchettePos.x = (lx - 1024) / 128;
            targetPlanchettePos.z = (ly - 640) / 128;
          } else {
            const p = cycle - 1.0;
            const u = 1.0 - 2.0 * p;
            const lx = 1024 + u * 600;
            const ly = 640 + (u * u) * 90;
            targetPlanchettePos.x = (lx - 1024) / 128;
            targetPlanchettePos.z = (ly - 640) / 128;
          }
          break;
        }

        case "Phantom Spiral": {
          const t = animTime * 0.45;
          const r = 0.8 + 3.2 * (0.5 + 0.5 * Math.sin(t * 0.55));
          const angle = t * 2.2;
          targetPlanchettePos.x = r * Math.cos(angle);
          targetPlanchettePos.z = 0.15 + r * 0.58 * Math.sin(angle);
          break;
        }

        case "Eerie Tremor": {
          const t = animTime * 0.22;
          const tremorX = (Math.random() - 0.5) * 0.08;
          const tremorZ = (Math.random() - 0.5) * 0.08;
          targetPlanchettePos.x = 3.5 * Math.sin(t * 0.8) + 1.8 * Math.cos(t * 1.7) + tremorX;
          targetPlanchettePos.z = 0.15 + 1.9 * Math.cos(t * 0.9) + 1.1 * Math.sin(t * 1.5) + tremorZ;
          break;
        }

        case "Static Séance (No Camera)": {
          const t = animTime * 0.45;
          targetPlanchettePos.x = 3.6 * Math.cos(t) + 1.4 * Math.cos(3 * t);
          targetPlanchettePos.z = 0.15 + 1.9 * Math.sin(t) - 0.9 * Math.sin(3 * t);
          camera.position.set(0, 11.5, 9.5);
          controls.target.set(0, 0.2, 0.2);
          break;
        }
      }

      const lerpSpeed = Math.min(delta * 10.0, 1.0);
      planchetteGroup.position.x = THREE.MathUtils.lerp(planchetteGroup.position.x, targetPlanchettePos.x, lerpSpeed);
      planchetteGroup.position.z = THREE.MathUtils.lerp(planchetteGroup.position.z, targetPlanchettePos.z, lerpSpeed);
      planchetteGroup.position.y = 0.325;

      planchetteVelocity.subVectors(planchetteGroup.position, lastPlanchettePos);
      lastPlanchettePos.copy(planchetteGroup.position);

      if (planchetteVelocity.lengthSq() > 0.00001) {
        const targetRotY = Math.atan2(-planchetteVelocity.x, -planchetteVelocity.z);
        let diff = targetRotY - planchetteGroup.rotation.y;
        while (diff < -Math.PI) diff += Math.PI * 2;
        while (diff > Math.PI) diff -= Math.PI * 2;
        planchetteGroup.rotation.y += diff * 0.12;

        planchetteGroup.rotation.x = 0;
        planchetteGroup.rotation.z = THREE.MathUtils.clamp(-diff * 0.08, -0.02, 0.02);
      }
    }

    // --- COLOR PALETTES & THEME SWITCHER ---
    function applyColorScheme(schemeName, animate = true) {
      const scheme = COLOR_SCHEMES[schemeName] || COLOR_SCHEMES["Neutral + Accent"];
      params.colorScheme = schemeName;
      params.woodColor = scheme.wood;
      params.boardColor = scheme.board;
      params.brassColor = scheme.brass;
      params.ectoplasmColor = scheme.ectoplasm;
      params.coreColor = scheme.core;

      if (!params.greenscreen) {
        if (animate) {
          gsap.to(scene.background, {
            r: new THREE.Color(scheme.bg).r,
            g: new THREE.Color(scheme.bg).g,
            b: new THREE.Color(scheme.bg).b,
            duration: 0.8
          });
        } else {
          scene.background.set(scheme.bg);
        }
      }

      createBoardCanvas(params.boardColor, params.woodColor, params.brassColor, params.coreColor);
      boardTexture.needsUpdate = true;

      if (planchetteGroup) {
        planchetteGroup.children[0].material.color.set(params.woodColor);

        const brassColorObj = new THREE.Color(params.brassColor);
        planchetteGroup.children[1].material.color.copy(brassColorObj);
        planchetteGroup.children[2].material.color.copy(brassColorObj);
        planchetteGroup.children[3].material.color.copy(brassColorObj);
        planchetteGroup.children[4].material.color.copy(brassColorObj);

        lensLight.color.set(params.ectoplasmColor);
        lensMesh.material.attenuationColor.set(params.coreColor);
      }

      ribbonMat.uniforms.uColor1.value.set(params.ectoplasmColor);
      ribbonMat.uniforms.uColor2.value.set(params.coreColor);
      sparkMat.color.set(params.ectoplasmColor);

      candlePoint.color.set(scheme.light || '#ffab4e');
    }

    // --- PROCEDURAL RANDOMIZATION ON USER CLICK ---
    // NOTE: Does NOT shuffle or alter postprocessing settings!
    function randomizeScene(userTriggered = false) {
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];

      params.animationSpeed = parseFloat((0.5 + Math.random() * 1.5).toFixed(2));
      params.trailLength = Math.floor(45 + Math.random() * 65);
      params.trailTurbulence = parseFloat((0.5 + Math.random() * 1.5).toFixed(2));
      params.exposure = parseFloat((1.0 + Math.random() * 0.4).toFixed(2));
      params.candleLight = parseFloat((1.2 + Math.random() * 1.0).toFixed(2));
      params.overheadLight = parseFloat((0.8 + Math.random() * 0.8).toFixed(2));
      params.ectoplasmLight = parseFloat((1.6 + Math.random() * 1.6).toFixed(2));

      applyColorScheme(randomScheme, true);
      updateLightingParameters();

      if (userTriggered) {
        gsap.to(lensLight, {
          intensity: params.ectoplasmLight * 3.5,
          duration: 0.15,
          yoyo: true,
          repeat: 1
        });
      }

      // Sync GUI scene controllers only (PostProcessor settings remain completely untouched)
      if (gui) {
        gui.controllersRecursive().forEach(c => {
          if (c.property in params) {
            c.updateDisplay();
          }
        });
      }
    }

    function updateLightingParameters() {
      renderer.toneMappingExposure = params.exposure;
      ambientLightSource.intensity = params.ambientLight * params.masterLight;
      candlePoint.intensity = params.candleLight * params.masterLight;
      overheadLight.intensity = params.overheadLight * params.masterLight;
      moonDirect.intensity = params.moonlightKey * params.masterLight;
      lensLight.intensity = params.ectoplasmLight * params.masterLight;
      ribbonMat.uniforms.uTurbulence.value = params.trailTurbulence;
    }

    // --- USER INTERACTION: DRAG & ZOOM & CLICK TO RANDOMIZE ---
    function setupPointerInteractions() {
      window.addEventListener('pointerdown', onPointerDown);
      window.addEventListener('pointermove', onPointerMove);
      window.addEventListener('pointerup', onPointerUp);

      window.addEventListener('keydown', (e) => {
        if (e.key === 'h' || e.key === 'H') {
          if (gui) {
            gui._hidden ? gui.show() : gui.hide();
          }
        }
      });
    }

    function onPointerDown(e) {
      pointerDownCoord.x = e.clientX;
      pointerDownCoord.y = e.clientY;
      pointerDownCoord.time = performance.now();

      mousePos.x = (e.clientX / window.innerWidth) * 2 - 1;
      mousePos.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mousePos, camera);

      if (params.dragMode !== "Camera Orbit Only") {
        const hits = raycaster.intersectObject(planchetteCollider, true);
        if (hits.length > 0 || params.dragMode === "Drag Planchette Only") {
          isDraggingPlanchette = true;
          controls.enabled = false;
          container.style.cursor = 'grabbing';

          const planeIntersect = new THREE.Vector3();
          if (raycaster.ray.intersectPlane(dragPlane, planeIntersect)) {
            dragOffset.subVectors(planchetteGroup.position, planeIntersect);
          }
          return;
        }
      }
    }

    function onPointerMove(e) {
      mousePos.x = (e.clientX / window.innerWidth) * 2 - 1;
      mousePos.y = -(e.clientY / window.innerHeight) * 2 + 1;

      if (isDraggingPlanchette) {
        raycaster.setFromCamera(mousePos, camera);
        const planeIntersect = new THREE.Vector3();
        if (raycaster.ray.intersectPlane(dragPlane, planeIntersect)) {
          const newPos = planeIntersect.add(dragOffset);
          newPos.x = THREE.MathUtils.clamp(newPos.x, -7.2, 7.2);
          newPos.z = THREE.MathUtils.clamp(newPos.z, -4.4, 4.4);
          newPos.y = 0.325;

          const dragVel = new THREE.Vector3().subVectors(newPos, planchetteGroup.position);
          if (dragVel.lengthSq() > 0.0001) {
            const targetRotY = Math.atan2(-dragVel.x, -dragVel.z);
            let diff = targetRotY - planchetteGroup.rotation.y;
            while (diff < -Math.PI) diff += Math.PI * 2;
            while (diff > Math.PI) diff -= Math.PI * 2;
            planchetteGroup.rotation.y += diff * 0.25;

            planchetteGroup.rotation.x = 0;
            planchetteGroup.rotation.z = THREE.MathUtils.clamp(-diff * 0.1, -0.02, 0.02);
          }

          planchetteGroup.position.copy(newPos);
        }
      } else {
        raycaster.setFromCamera(mousePos, camera);
        const hits = raycaster.intersectObject(planchetteCollider, true);
        container.style.cursor = hits.length > 0 ? 'grab' : 'default';
      }
    }

    function onPointerUp(e) {
      const movedDist = Math.hypot(e.clientX - pointerDownCoord.x, e.clientY - pointerDownCoord.y);
      const elapsed = performance.now() - pointerDownCoord.time;

      if (isDraggingPlanchette) {
        isDraggingPlanchette = false;
        controls.enabled = true;
        container.style.cursor = 'grab';
      }

      if (movedDist < 6 && elapsed < 350) {
        if (params.clickToRandomize) {
          randomizeScene(true);
        }
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      if (postProcessor) {
        postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);
      }
    }

    // --- LIL-GUI CONTROL PANEL (DEFAULT STYLING) ---
    let gui;
    function buildGUI() {
      gui = new GUI({ title: 'Victorian Ouija Settings' });

      // 1. Theme & Colors Folder
      const themeFolder = gui.addFolder('Theme & Color Scheme');
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      themeFolder.add(params, 'colorScheme', schemeKeys).name('18 Color Schemes').onChange((v) => applyColorScheme(v, true));

      themeFolder.add(params, 'greenscreen').name('Green Screen (#00ff00)').onChange((enabled) => {
        if (enabled) {
          scene.background = new THREE.Color(0x00ff00);
          tableMesh.visible = false;
          roomMesh.visible = false;
        } else {
          scene.background = new THREE.Color(COLOR_SCHEMES[params.colorScheme].bg);
          tableMesh.visible = true;
          roomMesh.visible = true;
        }
      });

      themeFolder.addColor(params, 'woodColor').name('Planchette Wood').onChange(() => {
        planchetteGroup.children[0].material.color.set(params.woodColor);
      });
      themeFolder.addColor(params, 'brassColor').name('Brass Inlays').onChange(() => {
        const c = new THREE.Color(params.brassColor);
        planchetteGroup.children[1].material.color.copy(c);
        planchetteGroup.children[2].material.color.copy(c);
        planchetteGroup.children[3].material.color.copy(c);
        planchetteGroup.children[4].material.color.copy(c);
        createBoardCanvas(params.boardColor, params.woodColor, params.brassColor, params.coreColor);
        boardTexture.needsUpdate = true;
      });
      themeFolder.addColor(params, 'ectoplasmColor').name('Ectoplasm Stream').onChange(() => {
        ribbonMat.uniforms.uColor1.value.set(params.ectoplasmColor);
        sparkMat.color.set(params.ectoplasmColor);
        lensLight.color.set(params.ectoplasmColor);
      });
      themeFolder.addColor(params, 'coreColor').name('Ectoplasm Core').onChange(() => {
        ribbonMat.uniforms.uColor2.value.set(params.coreColor);
        lensMesh.material.attenuationColor.set(params.coreColor);
      });
      themeFolder.addColor(params, 'boardColor').name('Board Wood Tone').onChange(() => {
        createBoardCanvas(params.boardColor, params.woodColor, params.brassColor, params.coreColor);
        boardTexture.needsUpdate = true;
      });

      // 2. Animations Folder (8 Preconfigured Options)
      const animFolder = gui.addFolder('Séance Animations');
      const animationOptions = [
        "Spirit Summoning",
        "Spelling SÉANCE",
        "Yes / No Hesitation",
        "Whispering Orbit",
        "Alphabet Tour",
        "Phantom Spiral",
        "Eerie Tremor",
        "Static Séance (No Camera)"
      ];
      animFolder.add(params, 'animation', animationOptions).name('Preset Animation');
      animFolder.add(params, 'animationSpeed', 0.1, 3.0, 0.05).name('Animation Speed');
      animFolder.add(params, 'trailLength', 20, 120, 1).name('Trail Persistence');
      animFolder.add(params, 'trailTurbulence', 0.0, 2.5, 0.05).name('Liquid Turbulence').onChange((v) => {
        ribbonMat.uniforms.uTurbulence.value = v;
      });
      animFolder.add(params, 'dragMode', [
        "Auto (Planchette / Orbit)",
        "Drag Planchette Only",
        "Camera Orbit Only"
      ]).name('Drag Mode');

      // 3. Lighting & Exposure Folder
      const lightFolder = gui.addFolder('Lighting & Exposure');
      lightFolder.add(params, 'exposure', 0.2, 3.0, 0.05).name('Exposure').onChange(updateLightingParameters);
      lightFolder.add(params, 'masterLight', 0.1, 3.0, 0.05).name('Scene Light Master').onChange(updateLightingParameters);
      lightFolder.add(params, 'candleLight', 0.0, 3.0, 0.05).name('Candle Spot').onChange(updateLightingParameters);
      lightFolder.add(params, 'overheadLight', 0.0, 3.0, 0.05).name('Chandelier Fill').onChange(updateLightingParameters);
      lightFolder.add(params, 'moonlightKey', 0.0, 3.0, 0.05).name('Moonlight Key').onChange(updateLightingParameters);
      lightFolder.add(params, 'ectoplasmLight', 0.0, 4.0, 0.05).name('Ectoplasm Lens Glow').onChange(updateLightingParameters);
      lightFolder.add(params, 'ambientLight', 0.0, 1.5, 0.05).name('Ambient Light').onChange(updateLightingParameters);

      // 4. Attach PostProcessor Pipeline (Bloom, Godrays, Anamorphic, Lens Optics)
      if (postProcessor) {
        postProcessor.attachGUI(gui, "Post-Processing Suite");
      }

      // 5. System, Renderer & Randomization Folder
      const sysFolder = gui.addFolder('Quality & Procedural');
      sysFolder.add(params, 'dpr', 0.5, 2.5, 0.1).name('Pixel Ratio (DPR)').onChange((v) => {
        renderer.setPixelRatio(v);
        if (postProcessor) {
          postProcessor.setSize(window.innerWidth, window.innerHeight, v);
        }
      });
      sysFolder.add(params, 'antialias').name('Antialias (Default On)').onChange((v) => {
        initRenderer(v);
      });
      sysFolder.add(params, 'clickToRandomize').name('Click Scene to Re-roll');
      sysFolder.add(params, 'randomize').name('Generate Random Variation');
    }

    // --- MAIN ANIMATION TICK LOOP ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = Math.min(clock.getDelta(), 0.1);

      if (candlePoint) {
        const candleFlicker = 0.92 + 0.08 * Math.sin(animTime * 12.0) + 0.04 * Math.cos(animTime * 23.0);
        candlePoint.intensity = params.candleLight * params.masterLight * candleFlicker;
      }

      if (lensLight) {
        const pulse = 0.92 + 0.08 * Math.sin(animTime * 7.0);
        lensLight.intensity = params.ectoplasmLight * params.masterLight * pulse;
      }

      updatePreconfiguredAnimation(delta);
      updateEctoplasmTrail(delta);

      controls.update();

      if (postProcessor && postProcessor.settings.raysEnabled) {
        postProcessor.setMoonScreenPosition(camera, candlePoint.position);
      }

      if (postProcessor) {
        postProcessor.renderScene(scene, camera);
      } else {
        renderer.render(scene, camera);
      }
    }

    // Start
    initScene();
    animate();
  </script>
</body>
</html>
