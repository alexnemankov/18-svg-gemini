<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Butterflies Swarm 3D</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
      user-select: none;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: block;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <script type="module">
    import { GUI } from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

    const nbButterflies = 100;
    let conf, scene, camera, cameraCtrl, renderer;
    let whw, whh;

    let butterflies = [];
    let bodyTexture, wingTexture1, wingTexture2, wingTexture3, bodyTexture4, wingTexture4;
    let destination = new THREE.Vector3();

    let mouse = new THREE.Vector2();
    let mouseOver = false;
    let mousePlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
    let mousePosition = new THREE.Vector3();
    let raycaster = new THREE.Raycaster();

    let cameraAngle = 0;
    let animClock = new THREE.Clock();

    let dragStartX = 0;
    let dragStartY = 0;

    const colorSchemes = {
      'Original Natural': {
        bg: '#ffffff',
        butterflyColors: ['#ffffff', '#ffffff', '#ffffff']
      },
      'Cyberpunk Neon': {
        bg: '#0b0e14',
        butterflyColors: ['#00f3ff', '#ff007f', '#39ff14', '#ffe600']
      },
      'Golden Sunset': {
        bg: '#1f140e',
        butterflyColors: ['#ffb703', '#fb8500', '#ff70a6', '#ffd166']
      },
      'Enchanted Forest': {
        bg: '#081c15',
        butterflyColors: ['#52b788', '#74c69d', '#d8f3dc', '#e9c46a']
      },
      'Celestial Twilight': {
        bg: '#0d081a',
        butterflyColors: ['#b5179e', '#7209b7', '#4895ef', '#4cc9f0']
      }
    };

    function init() {
      conf = {
        greenscreen: false,
        bgColor: '#ffffff',
        colorScheme: 'Original Natural',
        customTint: '#ffffff',
        useCustomTint: false,
        attraction: 0.03,
        velocityLimit: 1.2,
        move: true,
        followMouse: true,
        animSpeed: 1.0,
        dpr: Math.min(window.devicePixelRatio, 2),
        animationPreset: 'Gentle Spiral Orbit',
        clickRegenerate: true,
        shuffle: shuffle,
        regenerateNow: proceduralRegenerate
      };

      scene = new THREE.Scene();
      scene.background = new THREE.Color(conf.bgColor);

      camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 75);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(conf.dpr);
      document.body.appendChild(renderer.domElement);

      cameraCtrl = new THREE.OrbitControls(camera, renderer.domElement);
      cameraCtrl.enableDamping = true;
      cameraCtrl.dampingFactor = 0.05;
      cameraCtrl.enableZoom = true;
      cameraCtrl.enablePan = true;
      cameraCtrl.enableRotate = true;

      initTexturesAndScene();
      setupGUI();

      onWindowResize();
      window.addEventListener('resize', onWindowResize, false);
      document.addEventListener('mousemove', onMouseMove, false);
      document.addEventListener('mouseout', () => { mouseOver = false; }, false);

      renderer.domElement.addEventListener('pointerdown', (e) => {
        dragStartX = e.clientX;
        dragStartY = e.clientY;
      });

      renderer.domElement.addEventListener('pointerup', (e) => {
        const dist = Math.hypot(e.clientX - dragStartX, e.clientY - dragStartY);
        if (dist < 6 && conf.clickRegenerate) {
          proceduralRegenerate();
        }
      });

      window.addEventListener('keydown', (e) => {
        if (e.key === 'h' || e.key === 'H') {
          if (gui._hidden) {
            gui.show();
          } else {
            gui.hide();
          }
        }
      });

      animate();
    }

    function initTexturesAndScene() {
      const loader = new THREE.TextureLoader();
      bodyTexture = loader.load('https://klevron.github.io/codepen/butterflies/b1.png');
      wingTexture1 = loader.load('https://klevron.github.io/codepen/butterflies/b1w.png');
      wingTexture2 = loader.load('https://klevron.github.io/codepen/butterflies/b2w.png');
      wingTexture3 = loader.load('https://klevron.github.io/codepen/butterflies/b3w.png');
      bodyTexture4 = loader.load('https://klevron.github.io/codepen/butterflies/b4.png');
      wingTexture4 = loader.load('https://klevron.github.io/codepen/butterflies/b4w.png');

      butterflies = [];
      for (let i = 0; i < nbButterflies; i++) {
        let b = new Butterfly(i);
        butterflies.push(b);
        scene.add(b.o3d);
      }

      applyColorScheme(conf.colorScheme);
      shuffle();
    }

    let gui;
    function setupGUI() {
      gui = new GUI({ title: 'Scene Settings' });

      const procFolder = gui.addFolder('Procedural Mode');
      procFolder.add(conf, 'clickRegenerate').name('Click to Regenerate');
      procFolder.add(conf, 'regenerateNow').name('⚡ Regenerate Scene');

      const bgFolder = gui.addFolder('Background & Colors');
      bgFolder.add(conf, 'greenscreen').name('Greenscreen (#00ff00)').onChange(() => {
        updateBackgroundColor();
      });
      bgFolder.add(conf, 'colorScheme', Object.keys(colorSchemes)).name('Color Scheme').onChange((schemeName) => {
        applyColorScheme(schemeName);
      });
      bgFolder.addColor(conf, 'bgColor').name('Background Color').onChange((c) => {
        if (!conf.greenscreen) {
          scene.background.set(c);
        }
      });
      bgFolder.add(conf, 'useCustomTint').name('Use Custom Tint').onChange(() => {
        updateButterflyColors();
      });
      bgFolder.addColor(conf, 'customTint').name('Custom Tint').onChange(() => {
        if (conf.useCustomTint) updateButterflyColors();
      });

      const animFolder = gui.addFolder('Animation');
      animFolder.add(conf, 'animationPreset', [
        'Static (Manual Orbit)',
        'Gentle Spiral Orbit',
        'Floating Ocean Wave',
        'Cinematic Zoom Pulse',
        'Swarm Breeze Flow'
      ]).name('Camera Animation');
      animFolder.add(conf, 'animSpeed', 0.1, 3.0, 0.1).name('Animation Speed');
      animFolder.add(conf, 'move').name('Enable Swarm Flight');
      animFolder.add(conf, 'followMouse').name('Follow Mouse');
      animFolder.add(conf, 'attraction', 0.01, 0.1, 0.005).name('Attraction');
      animFolder.add(conf, 'velocityLimit', 0.1, 3.0, 0.1).name('Velocity Limit');

      const sysFolder = gui.addFolder('System');
      sysFolder.add(conf, 'dpr', 0.5, 2.5, 0.1).name('Pixel Ratio (DPR)').onChange((val) => {
        renderer.setPixelRatio(val);
      });
      sysFolder.add(conf, 'shuffle').name('Shuffle Butterflies');
    }

    function proceduralRegenerate() {
      const schemeNames = Object.keys(colorSchemes);
      const randomScheme = schemeNames[Math.floor(Math.random() * schemeNames.length)];
      conf.colorScheme = randomScheme;
      
      conf.useCustomTint = Math.random() > 0.4;
      if (conf.useCustomTint) {
        conf.customTint = '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0');
        if (!conf.greenscreen) {
          conf.bgColor = '#' + Math.floor(Math.random() * 0x333333).toString(16).padStart(6, '0');
        }
      } else {
        conf.bgColor = colorSchemes[randomScheme].bg;
      }
      updateBackgroundColor();

      conf.attraction = parseFloat((Math.random() * 0.07 + 0.01).toFixed(3));
      conf.velocityLimit = parseFloat((Math.random() * 2.0 + 0.4).toFixed(1));
      conf.animSpeed = parseFloat((Math.random() * 1.8 + 0.4).toFixed(1));

      const presets = [
        'Static (Manual Orbit)',
        'Gentle Spiral Orbit',
        'Floating Ocean Wave',
        'Cinematic Zoom Pulse',
        'Swarm Breeze Flow'
      ];
      conf.animationPreset = presets[Math.floor(Math.random() * presets.length)];

      for (let i = 0; i < butterflies.length; i++) {
        butterflies[i].flapSpeed = rnd(12, false) + 6;
        butterflies[i].flapPhase = Math.random() * Math.PI * 2;
        butterflies[i].shuffle();
      }
      updateButterflyColors();

      if (gui) {
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      }
    }

    function updateBackgroundColor() {
      if (conf.greenscreen) {
        scene.background.set('#00ff00');
      } else {
        scene.background.set(conf.bgColor);
      }
    }

    function applyColorScheme(schemeName) {
      const scheme = colorSchemes[schemeName];
      if (!scheme) return;
      conf.bgColor = scheme.bg;
      updateBackgroundColor();
      updateButterflyColors();
    }

    function updateButterflyColors() {
      const scheme = colorSchemes[conf.colorScheme];
      butterflies.forEach((b, idx) => {
        let colorHex;
        if (conf.useCustomTint) {
          colorHex = conf.customTint;
        } else {
          colorHex = scheme.butterflyColors[idx % scheme.butterflyColors.length];
        }
        b.setColor(colorHex);
      });
    }

    function Butterfly(id) {
      this.id = id;
      this.minWingRotation = -Math.PI / 6;
      this.maxWingRotation = Math.PI / 2 - 0.1;
      this.wingRotation = 0;
      this.flapPhase = Math.random() * Math.PI * 2;
      this.flapSpeed = rnd(8, false) + 10;

      this.velocity = new THREE.Vector3(rnd(1, true), rnd(1, true), rnd(1, true));
      this.destination = destination;

      const confs = [
        { bodyTexture: bodyTexture, bodyW: 10, bodyH: 15, wingTexture: wingTexture1, wingW: 10, wingH: 15, wingX: 5.5 },
        { bodyTexture: bodyTexture, bodyW: 6, bodyH: 9, wingTexture: wingTexture2, wingW: 15, wingH: 20, wingX: 7.5 },
        { bodyTexture: bodyTexture, bodyW: 8, bodyH: 12, wingTexture: wingTexture3, wingW: 10, wingH: 15, wingX: 5.5 },
        { bodyTexture: bodyTexture4, bodyW: 6, bodyH: 10, bodyY: 2, wingTexture: wingTexture4, wingW: 15, wingH: 20, wingX: 8 }
      ];

      this.init(confs[Math.floor(rnd(4))]);
    }

    Butterfly.prototype.init = function (bconf) {
      const geometry = new THREE.PlaneGeometry(bconf.wingW, bconf.wingH);
      this.wingMaterial = new THREE.MeshBasicMaterial({
        transparent: true,
        map: bconf.wingTexture,
        side: THREE.DoubleSide,
        depthTest: false
      });
      
      const lwmesh = new THREE.Mesh(geometry, this.wingMaterial);
      lwmesh.position.x = -bconf.wingX;
      this.lwing = new THREE.Object3D();
      this.lwing.add(lwmesh);

      const rwmesh = new THREE.Mesh(geometry, this.wingMaterial);
      rwmesh.rotation.y = Math.PI;
      rwmesh.position.x = bconf.wingX;
      this.rwing = new THREE.Object3D();
      this.rwing.add(rwmesh);

      const bodyGeom = new THREE.PlaneGeometry(bconf.bodyW, bconf.bodyH);
      this.bodyMaterial = new THREE.MeshBasicMaterial({
        transparent: true,
        map: bconf.bodyTexture,
        side: THREE.DoubleSide,
        depthTest: false
      });
      this.body = new THREE.Mesh(bodyGeom, this.bodyMaterial);
      if (bconf.bodyY) this.body.position.y = bconf.bodyY;

      this.group = new THREE.Object3D();
      this.group.add(this.body);
      this.group.add(this.lwing);
      this.group.add(this.rwing);
      this.group.rotation.x = Math.PI / 2;
      this.group.rotation.y = Math.PI;

      this.o3d = new THREE.Object3D();
      this.o3d.add(this.group);
    };

    Butterfly.prototype.setColor = function (hex) {
      const c = new THREE.Color(hex);
      if (this.wingMaterial) this.wingMaterial.color.copy(c);
      if (this.bodyMaterial) this.bodyMaterial.color.copy(c);
    };

    Butterfly.prototype.move = function (delta) {
      let dest;
      if (mouseOver && conf.followMouse) {
        dest = mousePosition;
      } else {
        dest = this.destination;
      }

      const dv = dest.clone().sub(this.o3d.position).normalize();
      const speedFactor = conf.animSpeed;

      this.velocity.x += conf.attraction * dv.x * speedFactor;
      this.velocity.y += conf.attraction * dv.y * speedFactor;
      this.velocity.z += conf.attraction * dv.z * speedFactor;
      this.limitVelocity();

      const speed = this.velocity.length();
      this.flapPhase += delta * (this.flapSpeed + speed * 5) * conf.animSpeed;
      const flapFactor = (Math.sin(this.flapPhase) + 1) / 2;
      this.wingRotation = THREE.MathUtils.lerp(this.minWingRotation, this.maxWingRotation, flapFactor);

      this.setWingRotation(this.wingRotation);
      
      if (this.velocity.lengthSq() > 0.00001) {
        const lookTarget = this.o3d.position.clone().add(this.velocity);
        this.o3d.lookAt(lookTarget);
      }

      this.o3d.position.addScaledVector(this.velocity, speedFactor);
    };

    Butterfly.prototype.limitVelocity = function () {
      this.velocity.x = limit(this.velocity.x, -conf.velocityLimit, conf.velocityLimit);
      this.velocity.y = limit(this.velocity.y, -conf.velocityLimit, conf.velocityLimit);
      this.velocity.z = limit(this.velocity.z, -conf.velocityLimit, conf.velocityLimit);
    };

    Butterfly.prototype.setWingRotation = function (y) {
      this.lwing.rotation.y = y;
      this.rwing.rotation.y = -y;
    };

    Butterfly.prototype.shuffle = function () {
      this.velocity = new THREE.Vector3(rnd(1, true), rnd(1, true), rnd(1, true));
      const p = new THREE.Vector3(rnd(1, true), rnd(1, true), rnd(1, true)).normalize().multiplyScalar(100);
      this.o3d.position.set(p.x, p.y, p.z);
      const scale = rnd(0.4) + 0.1;
      this.o3d.scale.set(scale, scale, scale);
    };

    function shuffle() {
      for (let i = 0; i < butterflies.length; i++) {
        butterflies[i].shuffle();
      }
    }

    function animate() {
      requestAnimationFrame(animate);

      const delta = Math.min(animClock.getDelta(), 0.1);

      updateCameraAnimation(delta);

      cameraCtrl.update();

      if (conf.move) {
        for (let i = 0; i < butterflies.length; i++) {
          butterflies[i].move(delta);
        }
      }

      renderer.render(scene, camera);
    }

    function updateCameraAnimation(delta) {
      if (conf.animationPreset === 'Static (Manual Orbit)') {
        return;
      }

      cameraAngle += delta * 0.3 * conf.animSpeed;

      const radius = 75;
      if (conf.animationPreset === 'Gentle Spiral Orbit') {
        camera.position.x = Math.sin(cameraAngle) * radius;
        camera.position.z = Math.cos(cameraAngle) * radius;
        camera.lookAt(0, 0, 0);
      } else if (conf.animationPreset === 'Floating Ocean Wave') {
        camera.position.x = Math.sin(cameraAngle) * radius;
        camera.position.z = Math.cos(cameraAngle) * radius;
        camera.position.y = Math.sin(cameraAngle * 2) * 20;
        camera.lookAt(0, 0, 0);
      } else if (conf.animationPreset === 'Cinematic Zoom Pulse') {
        const pulseRadius = radius + Math.sin(cameraAngle * 1.5) * 35;
        camera.position.x = Math.sin(cameraAngle) * pulseRadius;
        camera.position.z = Math.cos(cameraAngle) * pulseRadius;
        camera.position.y = Math.cos(cameraAngle * 0.8) * 15;
        camera.lookAt(0, 0, 0);
      } else if (conf.animationPreset === 'Swarm Breeze Flow') {
        camera.position.x = Math.sin(cameraAngle * 0.8) * radius;
        camera.position.y = Math.sin(cameraAngle * 1.2) * 25;
        camera.position.z = Math.cos(cameraAngle * 0.8) * radius;
        destination.x = Math.sin(cameraAngle * 0.5) * 30;
        destination.y = Math.cos(cameraAngle * 0.7) * 20;
        destination.z = Math.sin(cameraAngle * 0.3) * 15;
        camera.lookAt(destination);
      }
    }

    function limit(number, min, max) {
      return Math.min(Math.max(number, min), max);
    }

    function rnd(max, negative) {
      return negative ? Math.random() * 2 * max - max : Math.random() * max;
    }

    function onWindowResize() {
      whw = window.innerWidth / 2;
      whh = window.innerHeight / 2;
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function onMouseMove(event) {
      const v = new THREE.Vector3();
      camera.getWorldDirection(v);
      v.normalize();
      mousePlane.normal = v;

      mouseOver = true;
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      raycaster.ray.intersectPlane(mousePlane, mousePosition);
    }

    init();
  </script>
</body>
</html>
