<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Flower Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chroma-js/2.4.2/chroma.min.js"></script>
  <style>
    :root {
      --anim-speed: 1;
    }

    body {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.9rem;
      color: #000;
      text-shadow: 1px 1px 1px #fff;
      overflow: hidden;
      background-color: #ffffff;
      transition: background-color 0.3s ease;
    }

    #svg {
      position: fixed;
      width: 100%;
      height: 100%;
      cursor: none;
      filter: drop-shadow(0 0 4px #000);
      user-select: none;
      touch-action: none;
    }

    .lil-gui, header, footer {
      cursor: auto;
    }

    .flower path {
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .layer {
      animation-name: layerAnim1;
      animation-duration: calc(4s / var(--anim-speed, 1));
      animation-fill-mode: both; 
      transform-box: fill-box;
      transform-origin: center center;
    }

    .layer path {
      stroke: rgba(0, 0, 0, 0.7);
      stroke-width: 0.75px;
    }

    a {
      color: #555;
      text-decoration: none;
      border-bottom: 0.25rem solid transparent;
      transition: all 0.4s;
    }
    a:hover {
      color: #000;
      border-bottom-color: rgba(0, 0, 0, 0.7);
    }

    header, footer {
      position: absolute;
      width: 100%;
      text-align: center;
      pointer-events: auto;
      z-index: 10;
    }
    header h1 {
      font-size: 2em;
      margin: 0.5em 0 0;
    }
    footer {
      bottom: 0.5em;
    }

    @-moz-document url-prefix() {
      #svg {
        filter: none;
      }
      .layer {
        filter: drop-shadow(0 0 2px #000);
      }
    }

    @keyframes layerAnim1 {
      from, to { animation-timing-function: ease-out; }
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes layerAnim2 {
      from, to { animation-timing-function: ease-out; }
      from { opacity: 0; transform: scale3d(0.2, 0.2, 0.2); }
      to { opacity: 1; transform: scale3d(1, 1, 1); }
    }

    @keyframes layerAnim3 {
      from, to { animation-timing-function: ease-out; }
      from { opacity: 0; transform: rotateZ(-270deg); }
      to { opacity: 1; opacity: 1; transform: rotateZ(0deg); }
    }

    @keyframes layerAnim4 {
      from, to { animation-timing-function: ease-out; }
      from { opacity: 0; transform: rotateZ(360deg) scale3d(0.2, 0.2, 0.2); }
      to { opacity: 1; opacity: 1; transform: rotateZ(0deg) scale3d(1, 1, 1); }
    }

    @keyframes layerAnim5 {
      from, 20%, 40%, 60%, 80%, to {
        animation-timing-function: cubic-bezier(0.215, 0.61, 0.355, 1);
      }

      0% {
        opacity: 0;
        transform: scale3d(0.3, 0.3, 0.3);
      }

      20% {
        transform: scale3d(1.1, 1.1, 1.1);
      }

      40% {
        transform: scale3d(0.9, 0.9, 0.9);
      }

      60% {
        transform: scale3d(1.03, 1.03, 1.03);
      }

      80% {
        transform: scale3d(0.97, 0.97, 0.97);
      }

      to {
        opacity: 1;
        transform: scale3d(1, 1, 1);
      }
    }

    @keyframes layerAnim6 {
      from, 20%, 40%, 60%, 80%, to {
        animation-timing-function: cubic-bezier(0.215, 0.61, 0.355, 1);
      }

      0% {
        opacity: 0;
        transform: rotateZ(180deg) scale3d(0.3, 0.3, 0.3);
      }

      20% {
        transform: rotateZ(-25.71deg) scale3d(1.1, 1.1, 1.1);
      }

      40% {
        transform: rotateZ(25.71deg) scale3d(0.9, 0.9, 0.9);
      }

      60% {
        transform: rotateZ(-7.71deg) scale3d(1.03, 1.03, 1.03);
      }

      80% {
        transform: rotateZ(7.71deg) scale3d(0.97, 0.97, 0.97);
      }

      to {
        opacity: 1;
        transform: rotateZ(0deg) scale3d(1, 1, 1);
      }
    }

    @keyframes layerAnim7 {
      from, 20%, 40%, 60%, 80%, to {
        animation-timing-function: cubic-bezier(0.215, 0.61, 0.355, 1);
      }

      0% {
        opacity: 0;
        transform: rotateZ(-180deg) scale3d(0.3, 0.3, 0.3);
      }

      20% {
        transform: rotateZ(25.71deg) scale3d(1.1, 1.1, 1.1);
      }

      40% {
        transform: rotateZ(-25.71deg) scale3d(0.9, 0.9, 0.9);
      }

      60% {
        transform: rotateZ(7.71deg) scale3d(1.03, 1.03, 1.03);
      }

      80% {
        transform: rotateZ(-7.71deg) scale3d(0.97, 0.97, 0.97);
      }

      to {
        opacity: 1;
        transform: rotateZ(0deg) scale3d(1, 1, 1);
      }
    }

    @keyframes layerAnim8 {
      from, to { animation-timing-function: ease-out; }
      from { opacity: 0; transform: rotate3d(1, 1, 1, 360deg); }
      to { opacity: 1; transform: rotate3d(1, 1, 1, 0deg); }
    }

    @keyframes layerAnim9 {
      from, to { animation-timing-function: ease-out; }
      from { opacity: 0; transform: rotate3d(1, 1, 1, 360deg) scale3d(0.1, 0.1, 0.1); }
      to { opacity: 1; transform: rotate3d(1, 1, 1, 0deg) scale3d(1, 1, 1); }
    }

    @keyframes layerAnim10 {
      from, to { animation-timing-function: ease-out; }
      from { opacity: 0; transform: scale3d(2, 2, 2); }
      to { opacity: 1; transform: scale3d(1, 1, 1); }
    }

    @keyframes layerAnim11 {
      from, to { animation-timing-function: ease-out; }
      from { opacity: 0; transform: rotateZ(-360deg) scale3d(2, 2, 2); }
      to { opacity: 1; transform: rotateZ(0deg) scale3d(1, 1, 1); }
    }
  </style>
</head>
<body>
  <svg id="svg">
    <g id="main-group"></g>
  </svg>

  <header>
    <h1>Random Flower Generator</h1>
    <a href="https://codepen.io/collection/DPjZxo/" target="_blank">SVG Collection</a>
  </header>
  <footer>
    Click to generate random flowers
  </footer>

  <script type="module">
    import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

    const { random, PI, sin, cos, round, floor, ceil, min, max } = Math;

    // 5 presetupped original & popular color schemes
    const COLOR_SCHEMES = {
      'Cyber Neon': ['#ff007f', '#7f00ff', '#00f3ff', '#ffea00'],
      'Pastel Dream': ['#ffb3ba', '#ffdfba', '#ffffba', '#baffc9', '#bae1ff'],
      'Sunset Radiance': ['#2d004b', '#7b0051', '#d9383a', '#ff8c00', '#ffea00'],
      'Emerald Garden': ['#053f31', '#107a53', '#27c47a', '#7ef09c', '#f5ff9e'],
      'Cosmic Nebula': ['#0d1b2a', '#415a77', '#778da9', '#e0e1dd', '#ff006e']
    };

    // 5 presetupped smooth animations (including static)
    const ANIMATION_PRESETS = {
      'Static (No Camera Movement)': 'static',
      'Gentle Floating Breeze': 'breeze',
      'Slow Orbit & Pulse': 'orbit',
      'Hypnotic Radial Spin': 'spin',
      'Infinite Kaleidoscope Bloom': 'bloom'
    };

    function App() {
      const svg = document.getElementById('svg');
      const mainGroup = document.getElementById('main-group');
      let width, height, cx, cy;

      let zoom = 100;
      let baseVbOX = 0;
      let baseVbOY = 0;
      let vbOX = 0;
      let vbOY = 0;

      const settings = {
        greenscreen: false,
        bgColor: '#ffffff',
        colorScheme: 'Cyber Neon',
        primaryColor: '#ff007f',
        secondaryColor: '#00f3ff',
        useCustomColors: false,
        dpr: window.devicePixelRatio || 1,
        animationSpeed: 1.0,
        presetAnimation: 'Static (No Camera Movement)',
        autoSpawn: true,
        spawnInterval: 1.5,
        clickToRegenerate: true,
        clearFlowers: () => {
          mainGroup.innerHTML = '';
          activeFlowers = [];
        }
      };

      let activeFlowers = [];
      let gui;
      let isDragging = false;
      let dragStartX = 0;
      let dragStartY = 0;
      let dragStartVbX = 0;
      let dragStartVbY = 0;
      let totalDragDist = 0;
      let guiVisible = true;
      let lastSpawnTime = 0;

      init();

      function init() {
        onResize();
        initGUI();
        initEventHandlers();
        createInitialFlower();
        requestAnimationFrame(animate);
      }

      function createInitialFlower() {
        spawnRandomFlower();
      }

      function regenerateScene() {
        mainGroup.innerHTML = '';
        activeFlowers = [];

        const schemeNames = Object.keys(COLOR_SCHEMES);
        settings.colorScheme = schemeNames[floor(random() * schemeNames.length)];
        settings.useCustomColors = false;

        const animNames = Object.keys(ANIMATION_PRESETS);
        settings.presetAnimation = animNames[floor(random() * animNames.length)];

        settings.animationSpeed = round((rnd(0.5, 2.0)) * 10) / 10;
        document.documentElement.style.setProperty('--anim-speed', settings.animationSpeed);

        updateAllGUIControllers(gui);

        const flowerCount = rndInt(3, 7);
        for (let i = 0; i < flowerCount; i++) {
          spawnRandomFlower();
        }
      }

      function updateAllGUIControllers(folder) {
        if (!folder) return;
        if (folder.controllers) {
          folder.controllers.forEach(c => c.updateDisplay());
        }
        if (folder.folders) {
          folder.folders.forEach(f => updateAllGUIControllers(f));
        }
      }

      function spawnRandomFlower() {
        if (!width || !height) return;
        const vbW = (width * 100) / zoom;
        const vbH = (height * 100) / zoom;
        const currVbX = vbOX - vbW / 2;
        const currVbY = vbOY - vbH / 2;

        const margin = 20;
        const targetX = rnd(currVbX + margin, currVbX + vbW - margin);
        const targetY = rnd(currVbY + margin, currVbY + vbH - margin);

        createFlower({
          x: targetX,
          y: targetY,
        });

        if (activeFlowers.length > 30) {
          const oldest = activeFlowers.shift();
          if (oldest && oldest.group && oldest.group.parentNode) {
            oldest.group.parentNode.removeChild(oldest.group);
          }
        }
      }

      function getCurrentColors() {
        if (settings.useCustomColors) {
          return [settings.primaryColor, settings.secondaryColor];
        }
        return COLOR_SCHEMES[settings.colorScheme] || COLOR_SCHEMES['Cyber Neon'];
      }

      function initGUI() {
        gui = new GUI({ title: 'Flower Settings' });

        gui.add(settings, 'clickToRegenerate').name('Click to Regenerate Scene');

        const bgFolder = gui.addFolder('Background');
        bgFolder.add(settings, 'greenscreen').name('Greenscreen (#00ff00)').onChange(v => {
          if (v) {
            document.body.style.backgroundColor = '#00ff00';
          } else {
            document.body.style.backgroundColor = settings.bgColor;
          }
        });

        bgFolder.addColor(settings, 'bgColor').name('Background Color').onChange(v => {
          if (!settings.greenscreen) {
            document.body.style.backgroundColor = v;
          }
        });

        const colorFolder = gui.addFolder('Colors');
        colorFolder.add(settings, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Preset Scheme').onChange(() => {
          settings.useCustomColors = false;
        });
        colorFolder.add(settings, 'useCustomColors').name('Use Custom Colors');
        colorFolder.addColor(settings, 'primaryColor').name('Primary Color').onChange(() => {
          settings.useCustomColors = true;
        });
        colorFolder.addColor(settings, 'secondaryColor').name('Secondary Color').onChange(() => {
          settings.useCustomColors = true;
        });

        const renderFolder = gui.addFolder('Rendering');
        renderFolder.add(settings, 'dpr', 0.5, 3.0, 0.1).name('DPR (Pixel Ratio)').onChange(v => {
          updateDPR(v);
        });

        const animFolder = gui.addFolder('Animation');
        animFolder.add(settings, 'animationSpeed', 0.1, 3.0, 0.1).name('Animation Speed').onChange(v => {
          document.documentElement.style.setProperty('--anim-speed', v);
        });
        animFolder.add(settings, 'presetAnimation', Object.keys(ANIMATION_PRESETS)).name('Preset Animation');
        animFolder.add(settings, 'autoSpawn').name('Auto Spawn Flowers');
        animFolder.add(settings, 'spawnInterval', 0.3, 5.0, 0.1).name('Spawn Interval (s)');

        gui.add(settings, 'clearFlowers').name('Clear Canvas');
      }

      function updateDPR(ratio) {
        const svgEl = document.getElementById('svg');
        svgEl.style.transform = `scale(${1 / ratio})`;
        svgEl.style.transformOrigin = '0 0';
        svgEl.style.width = `${100 * ratio}%`;
        svgEl.style.height = `${100 * ratio}%`;
      }

      function initEventHandlers() {
        window.addEventListener('resize', onResize);
        window.addEventListener('wheel', onWheel, { passive: false });

        window.addEventListener('pointerdown', onPointerDown);
        window.addEventListener('pointermove', onPointerMove);
        window.addEventListener('pointerup', onPointerUp);

        window.addEventListener('keydown', onKeyDown);
      }

      function onWheel(e) {
        e.preventDefault();
        const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
        zoom = clamp(zoom * zoomFactor, 10, 2000);
        updateViewBox();
      }

      function onPointerDown(e) {
        if (e.target.closest('.lil-gui') || e.target.closest('header') || e.target.closest('footer')) return;

        isDragging = true;
        dragStartX = e.clientX;
        dragStartY = e.clientY;
        dragStartVbX = baseVbOX;
        dragStartVbY = baseVbOY;
        totalDragDist = 0;
      }

      function onPointerMove(e) {
        if (!isDragging) return;
        const dx = e.clientX - dragStartX;
        const dy = e.clientY - dragStartY;
        totalDragDist = Math.hypot(dx, dy);

        const scale = 100 / zoom;
        baseVbOX = dragStartVbX - dx * scale;
        baseVbOY = dragStartVbY - dy * scale;
        updateViewBox();
      }

      function onPointerUp(e) {
        if (!isDragging) return;
        isDragging = false;

        if (totalDragDist < 5 && !e.target.closest('.lil-gui') && !e.target.closest('header') && !e.target.closest('footer')) {
          if (settings.clickToRegenerate) {
            regenerateScene();
          }
        }
      }

      function onKeyDown(e) {
        if (e.key === 'h' || e.key === 'H') {
          guiVisible = !guiVisible;
          gui.domElement.style.display = guiVisible ? '' : 'none';
          const header = document.querySelector('header');
          const footer = document.querySelector('footer');
          if (header) header.style.display = guiVisible ? '' : 'none';
          if (footer) footer.style.display = guiVisible ? '' : 'none';
        }
      }

      function createFlower(params) {
        const iRadiusCoef = rnd(1, 7);
        const oRadiusCoef = rnd(iRadiusCoef, 7);
        const flower = new Flower({
          parent: mainGroup,
          petals: rndInt(4, 12),
          rings: rndInt(3, 8),
          step: rndInt(3, 8),
          colors: getCurrentColors(),
          alpha: rnd(0.7, 1),
          angle: rnd(PI),
          iRadius: rnd(2, 5),
          iRadiusCoef,
          oRadius: rnd(5, 10),
          oRadiusCoef,
          ...params
        });
        activeFlowers.push(flower);
      }

      function onResize() {
        const r = svg.getBoundingClientRect();
        width = r.width;
        height = r.height;
        cx = width / 2;
        cy = height / 2;
        updateViewBox();
      }

      function updateViewBox() {
        const vbW = (width * 100) / zoom;
        const vbH = (height * 100) / zoom;
        const x = vbOX - vbW / 2;
        const y = vbOY - vbH / 2;
        svg.setAttribute('viewBox', `${x} ${y} ${vbW} ${vbH}`);
      }

      let lastTime = performance.now();
      let animTime = 0;

      function animate(now) {
        const dt = (now - lastTime) / 1000;
        lastTime = now;
        animTime += dt * settings.animationSpeed;

        if (settings.autoSpawn && (now - lastSpawnTime) > (settings.spawnInterval * 1000)) {
          lastSpawnTime = now;
          spawnRandomFlower();
        }

        const animType = ANIMATION_PRESETS[settings.presetAnimation] || 'breeze';

        if (animType === 'static') {
          vbOX = baseVbOX;
          vbOY = baseVbOY;
          mainGroup.setAttribute('transform', '');
        } else if (animType === 'breeze') {
          vbOX = baseVbOX + sin(animTime * 0.8) * 45;
          vbOY = baseVbOY + cos(animTime * 0.6) * 30;
          mainGroup.setAttribute('transform', `rotate(${sin(animTime * 0.3) * 3})`);
        } else if (animType === 'orbit') {
          vbOX = baseVbOX + cos(animTime * 0.5) * 60;
          vbOY = baseVbOY + sin(animTime * 0.5) * 60;
          mainGroup.setAttribute('transform', `rotate(${animTime * 4})`);
        } else if (animType === 'spin') {
          vbOX = baseVbOX;
          vbOY = baseVbOY;
          mainGroup.setAttribute('transform', `rotate(${animTime * 12})`);
        } else if (animType === 'bloom') {
          vbOX = baseVbOX + sin(animTime * 0.4) * 20;
          vbOY = baseVbOY + cos(animTime * 0.4) * 20;
          const scaleVal = 1 + sin(animTime * 0.7) * 0.08;
          const rotVal = sin(animTime * 0.25) * 10;
          mainGroup.setAttribute('transform', `scale(${scaleVal}) rotate(${rotVal})`);
        }

        updateViewBox();
        requestAnimationFrame(animate);
      }
    }

    class Flower {
      constructor(conf) {
        this.conf = {
          alpha: 1,
          angle: 0,
          iRadius: 2, iRadiusCoef: 5,
          oRadius: 5, oRadiusCoef: 10,
          layerAnim: 'layerAnim' + (rndInt(1, 12)),
          reverseDelay: rnd(1) > 0.5,
          ...conf
        };
        this.create();
      }
      create() {
        let { parent, x, y, petals, rings, step, colors, alpha, angle, iRadius, iRadiusCoef, oRadius, oRadiusCoef, layerAnim, reverseDelay } = this.conf;

        this.group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        this.group.classList.add('flower');
        parent.appendChild(this.group);

        if (!colors || colors.length === 0) {
          colors = [chroma.random(), chroma.random()];
          if (rings > 6) colors.push(chroma.random());
        }

        const cscale = chroma.scale(colors);
        let layer, np, color, di;
        for (let i = rings; i > 0; i--) {
          layer = document.createElementNS('http://www.w3.org/2000/svg', 'g');
          layer.classList.add('layer');

          np = floor((i + step - 1) / step) * petals;
          color = cscale(i * 1 / rings).alpha(alpha);
          this.createPetalsRing(layer, x, y, np, iRadius + i * iRadiusCoef, oRadius + i * oRadiusCoef, angle + i % 2 * PI / np, color);

          di = reverseDelay ? (rings - i + 1) : i;
          layer.style.animationName = layerAnim;
          layer.style.animationDuration = (rings * 0.3) + 's';
          layer.style.animationDelay = (di * 0.15) + 's';
          this.group.appendChild(layer);
        }
      }
      createPetalsRing(parent, x, y, n, iRadius, oRadius, angle, fill) {
        const da = 2 * PI / n;
        const dr = oRadius - iRadius;
        const cpda = rnd(0.5 * da / 5, 1.5 * da / 5);
        const cpdr = rnd(dr * 0.25, dr * 1.1);
        let a;
        for (let i = 0; i < n; i++) {
          a = angle + i * da;
          new Petal({
            parent,
            x, y,
            startA: a,
            endA: a + da,
            iRadius,
            oRadius,
            cpda,
            cpdr,
            fill,
          });
        }
      }
    }

    class Petal {
      constructor({ parent, x, y, startA, endA, iRadius, oRadius, cpda, cpdr, fill }) {
        this.parent = parent;
        this.fill = fill;

        const da = endA - startA;
        const iRadius0 = iRadius / 5;
        this.sp = [x + cos(startA + da / 2) * iRadius0, y + sin(startA + da / 2) * iRadius0];
        this.cp1 = [x + cos(startA - cpda) * (iRadius + cpdr), y + sin(startA - cpda) * (iRadius + cpdr)];
        this.cp2 = [x + cos(endA + cpda) * (iRadius + cpdr), y + sin(endA + cpda) * (iRadius + cpdr)];
        this.ep = [x + cos(startA + da / 2) * oRadius, y + sin(startA + da / 2) * oRadius];

        this.curve1 = new QCurve({ sp: this.sp, cp: this.cp1, ep: this.ep });
        this.curve2 = new QCurve({ sp: this.sp, cp: this.cp2, ep: this.ep });
        this.create();
      }
      create() {
        this.path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        this.path.setAttribute('d', this.pathD());
        this.path.style.fill = this.fill;
        this.parent.appendChild(this.path);
      }
      pathD() {
        return [
          this.curve1.pathD(),
          this.curve2.pathD(),
        ].join(' ');
      }
    }

    class QCurve {
      constructor({ sp, cp, ep }) {
        this.sp = sp;
        this.cp = cp;
        this.ep = ep;
      }
      pathD() {
        return [
          `M${this.sp[0]} ${this.sp[1]}`,
          `Q${this.cp[0]} ${this.cp[1]}`,
          `${this.ep[0]} ${this.ep[1]}`,
        ].join(' ');
      }
    }

    function clamp(v, minVal, maxVal) {
      return min(max(v, minVal), maxVal);
    }

    function rnd(minVal, maxVal) {
      if (maxVal === undefined) { maxVal = minVal; minVal = 0; }
      return random() * (maxVal - minVal) + minVal;
    }

    function rndInt(minVal, maxVal) {
      if (maxVal === undefined) { maxVal = minVal; minVal = 0; }
      minVal = ceil(minVal);
      maxVal = floor(maxVal);
      return floor(random() * (maxVal - minVal)) + minVal;
    }

    App();
  </script>
</body>
</html>
