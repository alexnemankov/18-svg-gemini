<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kaleidoscopic Bouquet Vortex</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
    }
  }

  <style>
    :root {
      --bg-base: #0d021a;
      --bg-stop-1: hsla(58, 100%, 50%, 0.95);
      --bg-stop-2: deeppink;
      --bg-stop-3: rgba(255, 255, 255, 1);
      --bg-stop-4: #00ffff;

      --rot-duration: 40s;
      --hue-duration: 60s;
      --mue-duration: 40s;
      --anim-play-state: running;

      --bouquet-contrast: 2.0;
      --bouquet-brightness: 1.0;
      --bouquet-scale: 1.0;
      --hue-rotate-offset: 0deg;

      --blend-grid: difference;
      --blend-ggrid: difference;
      --blend-gridd: screen;
      --blend-canvas: difference;

      --exposure: 1.0;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      position: relative;
      background-color: var(--bg-base);
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      transition: background-color 0.3s ease;
    }

    body.grabbing {
      cursor: grabbing;
    }

    body.greenscreen {
      background-color: #00ff00 !important;
      background-image: none !important;
    }

    body.greenscreen #bg-rot,
    body.greenscreen #bg-hue {
      display: none !important;
    }

    body.greenscreen #grid {
      mix-blend-mode: normal !important;
    }
    body.greenscreen #ggrid {
      mix-blend-mode: normal !important;
    }
    body.greenscreen #gridd {
      mix-blend-mode: screen !important;
    }
    body.greenscreen #canv {
      mix-blend-mode: screen !important;
    }

    body.antialias-on {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      image-rendering: auto;
    }

    body.antialias-off {
      -webkit-font-smoothing: none;
      -moz-osx-font-smoothing: none;
      image-rendering: pixelated;
    }

    /* Three.js Ambient Stardust & Lighting Overlay */
    #webgl-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 10;
      display: block;
    }

    /* Fixed Atmospheric Background Layers */
    #bg-rot {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-image: linear-gradient(-45deg, var(--bg-stop-1), var(--bg-stop-2) 50%, var(--bg-stop-3));
      animation: rot var(--rot-duration) cubic-bezier(0.1, 1.21, 1.00, 0.99) infinite alternate;
      animation-play-state: var(--anim-play-state);
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    @keyframes rot {
      0% {
        background-image: linear-gradient(45deg, hsla(178, 100%, 50%, 0.5), hsla(180, 60%, 50%, 0.01) 50%, rgba(0, 0, 255, 0.9));
        background-blend-mode: xor;
        mix-blend-mode: difference;
        z-index: -4;
        transform: scale(1);
      }
      100% {
        transform: scale(1.1);
        background-image: linear-gradient(-45deg, hsla(18, 100%, 50%, 0.95), hsla(100, 90%, 60%, 0.2) 50%, rgba(0, 0, 0, 1));
        background-blend-mode: multiply;
        mix-blend-mode: color; 
        filter: invert(0) contrast(calc(1.3 * var(--bouquet-contrast))) brightness(calc(1.2 * var(--bouquet-brightness))) hue-rotate(calc(1218deg + var(--hue-rotate-offset)));
        z-index: 5;
      }
    }

    #bg-hue {
      background-image: url("https://assets.codepen.io/194946/bouquet.png");
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center right;
      background-blend-mode: multiply;
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      height: 120vh;
      width: 120vw;
      z-index: 2;
      overflow: hidden;
      filter: brightness(var(--bouquet-brightness)) contrast(var(--bouquet-contrast)) invert(1);
      animation: hue var(--hue-duration) cubic-bezier(1.00, 1.1, 0.05, -1.9) infinite;
      animation-play-state: var(--anim-play-state);
      pointer-events: none;
    }

    @keyframes hue {
      0% {
        background-image: url("https://assets.codepen.io/194946/full_strips.jpg");
        background-position: center; 
        background-size: cover;
        filter: hue-rotate(calc(110deg + var(--hue-rotate-offset))) brightness(calc(1.5 * var(--bouquet-brightness))) invert(1);
        z-index: 0;
        transform: translate(-50%, -50%) rotate(-1deg) scale(1.05);
      }
      50% {
        background-image: url("https://assets.codepen.io/194946/full_strips.jpg");
        background-position: center; 
        background-size: cover;
        background-blend-mode: color-dodge;
        mix-blend-mode: difference;
        z-index: 2;
        filter: contrast(calc(2.1 * var(--bouquet-contrast))) brightness(var(--bouquet-brightness)) grayscale(0) hue-rotate(calc(2000deg + var(--hue-rotate-offset))) invert(1);
        transform: translate(-50%, -50%) scale(1);
      }
      70% {
        background-image: url("https://assets.codepen.io/194946/bouquet.png");
        background-position: center; 
        background-size: cover;
        background-blend-mode: xor;
        mix-blend-mode: difference;
        z-index: 2;
        filter: contrast(calc(2.1 * var(--bouquet-contrast))) brightness(var(--bouquet-brightness)) grayscale(0) hue-rotate(calc(2000deg + var(--hue-rotate-offset))) invert(1);
        transform: translate(-50%, -50%) scale(0.99);
      }
      100% {
        background-image: url("https://assets.codepen.io/194946/bouquet.png");
        background-position: center; 
        background-size: cover;
        background-blend-mode: xor;
        mix-blend-mode: difference;
        z-index: 2;
        filter: contrast(calc(2.1 * var(--bouquet-contrast))) brightness(var(--bouquet-brightness)) grayscale(0) hue-rotate(calc(2000deg + var(--hue-rotate-offset))) invert(0.9);
        transform: translate(-50%, -50%) scale(1);
      }
    }

    /* World Stage (Zoomable & Draggable Scene Container) */
    #world-stage {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100vw;
      height: 100vh;
      margin-top: -50vh;
      margin-left: -50vw;
      transform-origin: center center;
      transform-style: preserve-3d;
      will-change: transform;
      z-index: 6;
      pointer-events: none;
    }

    #canv {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      height: 110vh;
      width: 110vw;
      mix-blend-mode: var(--blend-canvas);
      background-blend-mode: color;
      z-index: 3;
      animation: mue var(--mue-duration) cubic-bezier(0.001, 0.033, 0.001, 0.50) infinite;
      animation-play-state: var(--anim-play-state);
      overflow: hidden;
      pointer-events: none;
    }

    @keyframes mue {
      0% {
        transform: translate(-50%, -50%);
        filter: invert(1) hue-rotate(calc(1580deg + var(--hue-rotate-offset)));
        mix-blend-mode: difference;
        background-blend-mode: color;
        z-index: -1;
      }
      20% {
        transform: skew(-2deg, 1deg) translate(-50%, -50%);
        filter: contrast(calc(4 * var(--bouquet-contrast))) brightness(var(--bouquet-brightness)) hue-rotate(calc(289deg + var(--hue-rotate-offset))) invert(0.9);
        mix-blend-mode: difference;
        background-blend-mode: color;
        z-index: -7;
      }
      42% { 
        transform: translate(-50%, -50%);
        filter: contrast(calc(2 * var(--bouquet-contrast))) brightness(var(--bouquet-brightness)) hue-rotate(calc(29deg + var(--hue-rotate-offset))) invert(0.5);
        mix-blend-mode: difference;
        background-blend-mode: color-dodge;
        z-index: -7;
      }
      70% {  
        filter: contrast(calc(1 * var(--bouquet-contrast))) brightness(calc(2 * var(--bouquet-brightness))) hue-rotate(calc(89deg + var(--hue-rotate-offset))) invert(0.8);
        transform: translate(-50%, -50%);
        z-index: -5;
      }
      100% {
        transform: skew(-1deg, 1deg) translate(-50%, -50%);
        filter: contrast(calc(4 * var(--bouquet-contrast))) brightness(var(--bouquet-brightness)) hue-rotate(calc(4289deg + var(--hue-rotate-offset))) invert(0);
        mix-blend-mode: xor;
        background-blend-mode: darken;
        z-index: -7;
      }
    }

    #grid {
      background-image: url("https://assets.codepen.io/194946/bouquet_2.png");
      background-repeat: no-repeat;
      background-size: contain;
      background-position: center bottom;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(var(--bouquet-scale));
      height: 100vh;
      width: 100vw;
      filter: contrast(var(--bouquet-contrast)) brightness(var(--bouquet-brightness)) hue-rotate(var(--hue-rotate-offset));
      z-index: 9;
      mix-blend-mode: var(--blend-grid);
      pointer-events: none;
    }

    #ggrid {
      background-image: url("https://assets.codepen.io/194946/bouquet_2.png");
      background-repeat: no-repeat;
      background-size: calc(110vmax * var(--bouquet-scale));
      background-position: 50% bottom;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(var(--bouquet-scale));
      height: 100vh;
      width: 100vw;
      filter: contrast(var(--bouquet-contrast)) brightness(var(--bouquet-brightness)) hue-rotate(var(--hue-rotate-offset));
      z-index: 7;
      mix-blend-mode: var(--blend-ggrid);
      pointer-events: none;
    }

    #gridd {
      background-image: url("https://assets.codepen.io/194946/bouquet_2.png");
      background-repeat: no-repeat;
      background-size: calc(130vmax * var(--bouquet-scale));
      background-position: 50% bottom;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(var(--bouquet-scale));
      height: 100vh;
      width: 100vw;
      filter: contrast(var(--bouquet-contrast)) brightness(var(--bouquet-brightness)) hue-rotate(var(--hue-rotate-offset));
      z-index: 7;
      mix-blend-mode: var(--blend-gridd);
      pointer-events: none;
    }
  </style>
</head>

    /* ==========================================================================

    /* ==========================================================================
       Three.js Ambient Lighting & Stardust Overlay

    let renderer, threeScene, threeCamera;
    let ambientLight, directionalLight, pointLight;
    let particlePoints, particleMat, particleGeo;

    function initThree() {
      if (renderer) {
        renderer.dispose();
      }

      renderer = new THREE.WebGLRenderer({
        canvas: webglCanvas,
        antialias: settings.antialias,
        alpha: true,
        powerPreference: 'high-performance'
      });
      renderer.setPixelRatio(settings.dpr);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = settings.exposure;

      threeScene = new THREE.Scene();
      threeCamera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      threeCamera.position.z = 120;

      // Lights
      ambientLight = new THREE.AmbientLight(settings.ambientColor, settings.ambientIntensity * settings.sceneLightIntensity);
      threeScene.add(ambientLight);

      directionalLight = new THREE.DirectionalLight(settings.mainLightColor, settings.mainLightIntensity * settings.sceneLightIntensity);
      directionalLight.position.set(settings.mainLightX, settings.mainLightY, settings.mainLightZ);
      threeScene.add(directionalLight);

      pointLight = new THREE.PointLight(settings.rimLightColor, settings.rimLightIntensity * settings.sceneLightIntensity, 700);
      pointLight.position.set(settings.rimLightX, settings.rimLightY, settings.rimLightZ);
      threeScene.add(pointLight);

      // Stardust points
      const particleCount = 750;
      particleGeo = new THREE.BufferGeometry();
      const posArray = new Float32Array(particleCount * 3);
      for (let i = 0; i < particleCount * 3; i += 3) {
        posArray[i] = (Math.random() - 0.5) * 250;
        posArray[i + 1] = (Math.random() - 0.5) * 170;
        posArray[i + 2] = (Math.random() - 0.5) * 150;
      }
      particleGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));

      particleMat = new THREE.PointsMaterial({
        size: settings.stardustSize,
        color: new THREE.Color(settings.stardustColor),
        transparent: true,
        opacity: Math.min(1.0, settings.stardustIntensity * 0.75),
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      particlePoints = new THREE.Points(particleGeo, particleMat);
      threeScene.add(particlePoints);
    }

    initThree();

    /* ==========================================================================
       2D Procedural Vortex Canvas Engine
       ========================================================================== */
    let animCounter = 0;

    function random(min, max) {
      return Math.random() * (max - min) + min;
    }

    const tri = {
      draw_: function($) {
        const rot = Math.atan2(Math.sqrt(20), Math.floor(-3.2)) * Math.abs(23) * Math.PI;
        $.globalCompositeOperation = 'source-over';

        for (let n = 0; n < 5; ++n) {
          $.scale(1.43, 1.78);
          $.beginPath();
          $.fillStyle = getCanvasColor1();
          $.fillRect(1.5, 6.5, 0.015, 0.075);
          $.fill();

          $.globalCompositeOperation = 'xor';
          $.beginPath();
          $.fillStyle = getCanvasColor2();
          $.arc(
            Math.floor(random(50, 72)),
            Math.floor(random(30, 62)),
            Math.round(1.099),
            random(-0.08, 0.8),
            Math.PI * 9,
            false
          );
          $.fill();
        }

        $.rotate(rot);
        $.beginPath();
        $.globalCompositeOperation = 'xor';
        $.fillStyle = getCanvasColor3();
        $.arc(
          Math.floor(random(10, 20)),
          random(1.3, 3),
          Math.sqrt(4),
          0.02,
          random(8, Math.sqrt(8.77)) * Math.PI,
          false
        );
        $.fill();
      }
    };

    function Obj(mid, off_, step) {
      this.mid = mid;
      this.off_ = off_;
      this.step = step;
    }

    Obj.prototype.draw = function($) {
      this.step += (Math.PI / settings.canvasStepDivisor) * settings.speed;
      $.save();
      $.translate(this.mid.x + 10, this.mid.y - 10);
      $.rotate(this.step + this.off_);
      tri.draw_($);
      $.restore();
    };

    let particleArr = [];

    function initArr() {
      particleArr = [];
      const count = Math.floor(settings.objectCount / 0.85);
      const centerX = (canv.width / settings.dpr) / 2;
      const centerY = (canv.height / settings.dpr) / 2;

      for (let k = 0; k < count; k++) {
        const t = (k * Math.PI * 200) / settings.objectCount;
        particleArr.push(
          new Obj(
            {
              x: centerX + settings.vortexRadius * Math.cos(t * 5),
              y: centerY + settings.vortexRadius * Math.sin(t * -5)
            },
            t,
            (Math.PI * k) / 0.2
          )
        );
      }
    }

    function resizeCanvas2D() {
      canv.width = Math.floor(window.innerWidth * settings.dpr);
      canv.height = Math.floor(window.innerHeight * settings.dpr);
      initArr();
    }

    resizeCanvas2D();

    /* ==========================================================================
       Color Scheme Harmonization & CSS Sync Engine
       ========================================================================== */
    function hexToRgba(hex, alpha = 1.0) {
      if (!hex || hex.startsWith('hsl') || hex.startsWith('rgb')) return hex;
      let clean = hex.replace('#', '');
      if (clean.length === 3) {
        clean = clean.split('').map(ch => ch + ch).join('');
      }
      const num = parseInt(clean, 16);
      const r = (num >> 16) & 255;
      const g = (num >> 8) & 255;
      const b = num & 255;
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function getCanvasColor1() {
      if (settings.colorScheme === 'Original') {
        return `hsla(${Math.abs(animCounter * 30) % 360}, 80%, 100%, 0.51)`;
      }
      return hexToRgba(settings.particleColor1, 0.65);
    }

    function getCanvasColor2() {
      if (settings.colorScheme === 'Original') {
        return `hsla(${Math.abs(animCounter * 360) % 360}, 80%, 50%, 1.0)`;
      }
      return hexToRgba(settings.particleColor2, 0.95);
    }

    function getCanvasColor3() {
      if (settings.colorScheme === 'Original') {
        return `hsla(${Math.abs(animCounter * 250) % 360}, 100%, 90%, 0.061)`;
      }
      return hexToRgba(settings.particleColor3, 0.12);
    }

    function getTrailStyle() {
      const scheme = COLOR_SCHEMES[settings.colorScheme];
      if (settings.colorScheme === 'Original') {
        return `hsla(78, 100%, 20%, ${settings.trailAlpha})`;
      }
      if (scheme && scheme.trailColor) {
        return scheme.trailColor;
      }
      return hexToRgba(settings.bgBase, settings.trailAlpha * 2.5);
    }

    function updateCSSVariables() {
      if (settings.greenScreen) {
        document.body.classList.add('greenscreen');
      } else {
        document.body.classList.remove('greenscreen');
      }

      root.style.setProperty('--bg-base', settings.bgBase);
      root.style.setProperty('--bg-stop-1', settings.bgStop1);
      root.style.setProperty('--bg-stop-2', settings.bgStop2);
      root.style.setProperty('--bg-stop-3', settings.bgStop3);
      root.style.setProperty('--bg-stop-4', settings.bgStop4);

      root.style.setProperty('--bouquet-contrast', settings.bouquetContrast);
      root.style.setProperty('--bouquet-brightness', settings.bouquetBrightness);
      root.style.setProperty('--bouquet-scale', settings.bouquetScale);
      root.style.setProperty('--hue-rotate-offset', `${settings.hueOffsetDeg}deg`);

      root.style.setProperty('--blend-grid', settings.gridBlend);
      root.style.setProperty('--blend-ggrid', settings.gridBlend);
      root.style.setProperty('--blend-gridd', settings.griddBlend);
      root.style.setProperty('--blend-canvas', settings.canvasBlend);

      const durRot = settings.speed > 0 ? (40 / settings.speed).toFixed(2) : 999999;
      const durHue = settings.speed > 0 ? (60 / settings.speed).toFixed(2) : 999999;
      const durMue = settings.speed > 0 ? (40 / settings.speed).toFixed(2) : 999999;
      root.style.setProperty('--rot-duration', `${durRot}s`);
      root.style.setProperty('--hue-duration', `${durHue}s`);
      root.style.setProperty('--mue-duration', `${durMue}s`);
      root.style.setProperty('--anim-play-state', settings.paused ? 'paused' : 'running');

      // Three.js Lighting & Stardust Materials Update
      if (ambientLight) {
        ambientLight.color.set(settings.ambientColor);
        ambientLight.intensity = settings.ambientIntensity * settings.sceneLightIntensity;
      }
      if (directionalLight) {
        directionalLight.color.set(settings.mainLightColor);
        directionalLight.intensity = settings.mainLightIntensity * settings.sceneLightIntensity;
        directionalLight.position.set(settings.mainLightX, settings.mainLightY, settings.mainLightZ);
      }
      if (pointLight) {
        pointLight.color.set(settings.rimLightColor);
        pointLight.intensity = settings.rimLightIntensity * settings.sceneLightIntensity;
        pointLight.position.set(settings.rimLightX, settings.rimLightY, settings.rimLightZ);
      }
      if (particleMat) {
        particleMat.color.set(settings.stardustColor);
        particleMat.size = settings.stardustSize;
        particleMat.opacity = Math.min(1.0, settings.stardustIntensity * 0.75);
      }
      if (renderer) {
        renderer.toneMappingExposure = settings.exposure;
      }
    }

    function applyColorScheme(name) {
      const scheme = COLOR_SCHEMES[name];
      if (!scheme) return;

      settings.colorScheme = name;
      settings.bgBase = scheme.bgBase;
      settings.bgStop1 = scheme.bgStop1;
      settings.bgStop2 = scheme.bgStop2;
      settings.bgStop3 = scheme.bgStop3;
      settings.bgStop4 = scheme.bgStop4;

      settings.particleColor1 = scheme.palette[0] || '#ffffff';
      settings.particleColor2 = scheme.palette[1] || scheme.accentColor;
      settings.particleColor3 = scheme.palette[2] || '#00ffff';

      settings.ambientColor = scheme.ambientColor;
      settings.mainLightColor = scheme.mainLightColor;
      settings.rimLightColor = scheme.rimLightColor;
      settings.stardustColor = scheme.accentColor;
      settings.hueOffsetDeg = scheme.hueOffset || 0;

      updateCSSVariables();
      syncGUIControllers();
    }

    function resetCameraView() {
      settings.zoom = 1.0;
      settings.panX = 0;
      settings.panY = 0;

    function randomizeScene(manual = false) {
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      applyColorScheme(randomScheme);

      // Re-roll geometric & motion parameters
      settings.vortexRadius = Math.floor(220 + Math.random() * 260);
      settings.objectCount = Math.floor(24 + Math.random() * 26);
      settings.canvasStepDivisor = Math.floor(320 + Math.random() * 260);
      settings.speed = +(0.6 + Math.random() * 1.3).toFixed(2);
      settings.exposure = +(0.8 + Math.random() * 0.5).toFixed(2);
      settings.sceneLightIntensity = +(0.8 + Math.random() * 0.5).toFixed(2);
      settings.bouquetContrast = +(1.3 + Math.random() * 1.5).toFixed(1);
      settings.bouquetBrightness = +(0.85 + Math.random() * 0.5).toFixed(2);
      settings.bouquetScale = +(0.85 + Math.random() * 0.35).toFixed(2);

      // Re-scatter stardust positions
      if (particleGeo) {
        const positions = particleGeo.attributes.position.array;
        for (let i = 0; i < positions.length; i += 3) {
          positions[i] = (Math.random() - 0.5) * 250;
          positions[i + 1] = (Math.random() - 0.5) * 170;
          positions[i + 2] = (Math.random() - 0.5) * 150;
        }
        particleGeo.attributes.position.needsUpdate = true;
      }

      initArr();
      updateCSSVariables();
      syncGUIControllers();

    /* ==========================================================================
       Interactive Controls: Zoom (Wheel) & Drag (Pointer)
       ========================================================================== */
    let isPointerDown = false;
    let startPointerX = 0;
    let startPointerY = 0;
    let startPanX = 0;
    let startPanY = 0;
    let hasDragged = false;
    let pointerDownTime = 0;

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.lil-gui')) return;
      isPointerDown = true;
      startPointerX = e.clientX;
      startPointerY = e.clientY;
      startPanX = settings.panX;
      startPanY = settings.panY;
      hasDragged = false;
      pointerDownTime = performance.now();
      document.body.classList.add('grabbing');
    });

    window.addEventListener('pointermove', (e) => {
      if (!isPointerDown) return;
      const dx = e.clientX - startPointerX;
      const dy = e.clientY - startPointerY;

      if (Math.hypot(dx, dy) > 5) {
        hasDragged = true;
      }

      if (e.buttons === 2 || e.shiftKey) {
        // 3D perspective rotation with right-click or shift-drag
        settings.rotY += (e.movementX || 0) * 0.35;
        settings.rotX -= (e.movementY || 0) * 0.35;
        settings.rotX = Math.max(-75, Math.min(75, settings.rotX));
        gui.controllersRecursive().forEach(c => {
          if (['rotX', 'rotY'].includes(c.property)) c.updateDisplay();
        });
      } else {
        // Drag object across screen
        settings.panX = startPanX + dx;
        settings.panY = startPanY + dy;
        gui.controllersRecursive().forEach(c => {
          if (['panX', 'panY'].includes(c.property)) c.updateDisplay();
        });
      }
    });

    window.addEventListener('pointerup', (e) => {
      if (!isPointerDown) return;
      isPointerDown = false;
      document.body.classList.remove('grabbing');

      // Click on scene detection for procedural variation
      const duration = performance.now() - pointerDownTime;
      if (!hasDragged && duration < 380 && settings.clickRandomize) {
        if (!e.target.closest('.lil-gui')) {
          randomizeScene();
        }
      }
    });

    // Zoom with wheel
    window.addEventListener('wheel', (e) => {
      if (e.target.closest('.lil-gui')) return;
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
      settings.zoom = Math.min(Math.max(settings.zoom * zoomFactor, 0.2), 5.0);
      gui.controllersRecursive().forEach(c => {
        if (c.property === 'zoom') c.updateDisplay();
      });
    }, { passive: false });

    fColors.addColor(settings, 'bgBase').name('Background Deep').onChange(() => updateCSSVariables());
    fColors.addColor(settings, 'bgStop1').name('Gradient Color 1').onChange(() => updateCSSVariables());
    fColors.addColor(settings, 'bgStop2').name('Gradient Color 2').onChange(() => updateCSSVariables());
    fColors.addColor(settings, 'bgStop3').name('Gradient Color 3').onChange(() => updateCSSVariables());
    fColors.addColor(settings, 'bgStop4').name('Gradient Color 4').onChange(() => updateCSSVariables());
    fColors.addColor(settings, 'particleColor1').name('Vortex Particle 1').onChange(() => updateCSSVariables());
    fColors.addColor(settings, 'particleColor2').name('Vortex Particle 2').onChange(() => updateCSSVariables());
    fColors.addColor(settings, 'particleColor3').name('Vortex Particle 3').onChange(() => updateCSSVariables());
    fColors.add(settings, 'hueOffsetDeg', -180, 180, 1).name('Bouquet Hue Shift').onChange(() => updateCSSVariables());

    /* ==========================================================================
       Main Infinite Render & Animation Loop
       ========================================================================== */
    let animTime = 0;
    let lastClock = performance.now();

    function drawCanvasFrame() {
      ctx.save();
      ctx.setTransform(settings.dpr, 0, 0, settings.dpr, 0, 0);

      // Trailing fade rectangle
      ctx.fillStyle = getTrailStyle();
      ctx.fillRect(0, 0, canv.width / settings.dpr, canv.height / settings.dpr);

      ctx.globalCompositeOperation = 'exclusion';
      for (let i = 0; i < particleArr.length; i++) {
        particleArr[i].draw(ctx);
      }
      ctx.restore();
    }

    function renderLoop() {
      requestAnimationFrame(renderLoop);

      const now = performance.now();
      const dt = (now - lastClock) * 0.001;
      lastClock = now;

      if (!settings.paused) {
        animTime += dt * settings.speed;
        animCounter -= Math.pow(0.0033, 0.6) * settings.speed;
      }

      // Draw 2D Procedural Vortex
      drawCanvasFrame();

      // Compute Camera Motion Offsets from the 8 preconfigured animations
      let animPanX = 0;
      let animPanY = 0;
      let animRotX = 0;
      let animRotY = 0;
      let animZoom = 1.0;

      const t = animTime;

      switch (settings.animationPreset) {
        case 'Static (No Camera Movement)':
          break;

        case 'Hypnotic Mystic Drift':
          animPanX = Math.sin(t * 0.25) * 40;
          animPanY = Math.cos(t * 0.2) * 25;
          animRotY = Math.sin(t * 0.15) * 6;
          animRotX = Math.cos(t * 0.12) * 4;
          animZoom = 1.0 + Math.sin(t * 0.1) * 0.04;
          break;

        case 'Kaleidoscopic Orbit':
          animPanX = Math.cos(t * 0.2) * 50;
          animPanY = Math.sin(t * 0.2) * 35;
          animRotY = Math.cos(t * 0.2) * 10;
          animRotX = Math.sin(t * 0.18) * 6;
          animZoom = 1.0 + Math.sin(t * 0.12) * 0.05;
          break;

        case 'Gentle Cosmic Pulse':
          animZoom = 1.0 + Math.sin(t * 0.22) * 0.08;
          animPanX = Math.sin(t * 0.15) * 20;
          animPanY = Math.cos(t * 0.18) * 15;
          animRotX = Math.sin(t * 0.14) * 3;
          animRotY = Math.cos(t * 0.16) * 4;
          break;

        case 'Lissajous Infinity Glide':
          animPanX = Math.sin(t * 0.22) * 45;
          animPanY = Math.sin(t * 0.44) * 22;
          animRotY = Math.sin(t * 0.22) * 8;
          animRotX = Math.cos(t * 0.22) * 4;
          animZoom = 1.0 + Math.sin(t * 0.2) * 0.03;
          break;

        case 'Ethereal Horizon Float':
          animPanX = Math.sin(t * 0.18) * 60;
          animPanY = Math.cos(t * 0.12) * 15;
          animRotY = Math.sin(t * 0.18) * 8;
          animRotX = -2 + Math.cos(t * 0.15) * 3;
          animZoom = 1.02 + Math.sin(t * 0.14) * 0.03;
          break;

        case 'Harmonic Pendulum Sway':
          animPanX = Math.sin(t * 0.28) * 38;
          animPanY = Math.abs(Math.sin(t * 0.28)) * 14;
          animRotY = Math.sin(t * 0.28) * 7;
          animRotX = Math.cos(t * 0.2) * 3;
          animZoom = 1.0 + Math.sin(t * 0.15) * 0.02;
          break;

        case 'Deep Spiral Zoom':
          animZoom = 1.0 + Math.sin(t * 0.25) * 0.12;
          animRotY = Math.sin(t * 0.25) * 12;
          animRotX = Math.cos(t * 0.25) * 6;
          animPanX = Math.sin(t * 0.25) * 25;
          animPanY = Math.cos(t * 0.25) * 18;
          break;
      }

      // Apply transform to the world stage
      const finalPanX = settings.panX + animPanX;
      const finalPanY = settings.panY + animPanY;
      const finalZoom = settings.zoom * animZoom;
      const finalRotX = settings.rotX + animRotX;
      const finalRotY = settings.rotY + animRotY;

      stage.style.transform = `translate3d(${finalPanX.toFixed(2)}px, ${finalPanY.toFixed(2)}px, 0) scale(${finalZoom.toFixed(4)}) rotateX(${finalRotX.toFixed(2)}deg) rotateY(${finalRotY.toFixed(2)}deg)`;

      // Render Three.js ambient stardust & lights
      if (renderer && threeScene && threeCamera) {
        if (particlePoints) {
          particlePoints.visible = !settings.greenScreen;
          particlePoints.rotation.y = animTime * 0.03;
          particlePoints.rotation.x = animTime * 0.015;
        }
        renderer.render(threeScene, threeCamera);
      }
    }

    // Initial Engine Bootstrap
    updateCSSVariables();
    renderLoop();
  </script>
</body>
</html>
