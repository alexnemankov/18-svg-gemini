<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffe3d4">
  <meta name="description" content="A living pastel painting. Procedural clouds of ivory, coral, and powder blue drift through a seamless fifty-second loop.">
  <link rel="icon" href="data:,">
  <title>Softly, In Color</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background:
        radial-gradient(ellipse at 67% 78%, #ff956f 0%, transparent 45%),
        radial-gradient(ellipse at 21% 43%, #fff0e2 0%, transparent 60%),
        linear-gradient(100deg, #f7cdd0 12%, #ffe3d4 65%, #a8d2f1 100%);
    }
    canvas { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
    canvas.dragging { cursor: grabbing; }
  </style>
</head>
<body>
<script type="module">
/*
 * SOFTLY, IN COLOR
 * One plane, one shader, no textures or post-processing.
 * Open directly in a browser; pinned Three.js and lil-gui load from CDNs.
 * Field positions use reference-image coordinates: x rightward, y downward.
 */
let THREE;
try {
  THREE = await import('https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js');
} catch {
  try {
    THREE = await import('https://unpkg.com/three@0.180.0/build/three.module.js');
  } catch (error) {
    console.warn('The pastel painting could not load Three.js.', error);
  }
}

if (THREE) {
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({
      alpha: false, antialias: false, depth: false, stencil: false,
      powerPreference: 'low-power', precision: 'highp'
    });
  } catch (error) {
    // The CSS painting remains visible on devices without WebGL.
    console.warn('WebGL is unavailable; displaying the still painting.', error);
  }

  if (renderer) {
    renderer.setClearColor(0xffe3d4, 1);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.NoToneMapping;
    renderer.domElement.setAttribute('role', 'img');
    renderer.domElement.setAttribute('aria-label', 'Soft ivory and peach light above a drifting coral cloud, with powder blue along the right edge.');
    document.body.appendChild(renderer.domElement);

    let GUI;
    try {
      ({ default: GUI } = await import('https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js'));
    } catch {
      try {
        ({ default: GUI } = await import('https://cdn.jsdelivr.net/npm/lil-gui@0.19.1/dist/lil-gui.esm.min.js'));
      } catch (error) {
        console.warn('The settings panel could not load.', error);
      }
    }

    // Nine pigment roles preserve this painting's ivory veil and coral bank.
    const pigmentNames = ['Ivory light', 'Peach atmosphere', 'Blush', 'Salmon',
                          'Coral cloud', 'Deep coral', 'Cool field', 'Sky light', 'Lavender'];
    function rgb(hex) {
      const value = parseInt(hex.replace('#', ''), 16);
      return new THREE.Vector3((value >> 16 & 255) / 255, (value >> 8 & 255) / 255, (value & 255) / 255);
    }
    function tint(hex, amount) {
      const color = rgb(hex).lerp(new THREE.Vector3(1, 1, 1), amount);
      return '#' + [color.x, color.y, color.z].map(v => Math.round(v * 255).toString(16).padStart(2, '0')).join('');
    }
    function palette(hexes) {
      const p = hexes.map(hex => '#' + hex);
      return { colors: [tint(p[0], 0.72), tint(p[0], 0.42), p[3], p[0], p[1], p[2], p[p.length - 2], p[0], p[p.length - 1]], background: p[p.length - 1] };
    }
    const schemes = {
      'Original': { colors: ['#fff0e2', '#ffe3d4', '#f7cdd0', '#f8ab94', '#ff835d', '#f77953', '#a8d2f1', '#c5e2f4', '#dfd5e9'], background: '#ffe3d4' },
      'Monochromatic': { colors: ['#fff0e7', '#f9d9c8', '#edc4b2', '#e8aa90', '#d98b6d', '#bd6e53', '#cba18e', '#ecd0bf', '#dec1b2'], background: '#f3dfd1' },
      'Analogous': { colors: ['#fff2d9', '#ffe4c7', '#f6c7c1', '#f7ab93', '#f9956d', '#e98264', '#e6b2c8', '#f4d5dd', '#ddc0d8'], background: '#ffe9d8' },
      'Complementary': { colors: ['#fff0df', '#ffe2cf', '#f2c6ba', '#f4ae91', '#f28b63', '#dc7657', '#8fc8df', '#c2e3ed', '#b9c7df'], background: '#fce9db' },
      'Split-complementary': { colors: ['#fff0de', '#ffe4d3', '#e9ccd7', '#f4ac96', '#f58c68', '#dc785e', '#a1d4c6', '#c9e7d9', '#b8c5e8'], background: '#fbe7dc' },
      'Triadic': { colors: ['#fff1d6', '#f6e3c6', '#e6c7df', '#eeb39e', '#ef9875', '#d88064', '#a8c9e4', '#c8e3ee', '#caadd7'], background: '#f8eadb' },
      'Tetradic': { colors: ['#fff1dc', '#fbe3cf', '#edbdd0', '#e9ae8f', '#ec8c70', '#cd735e', '#a2c9bc', '#c7e1d5', '#b9b8dd'], background: '#f3e7da' },
      'Double split-complementary': { colors: ['#fcf2da', '#f9dfc7', '#eabed0', '#f0ac91', '#ec9275', '#d77964', '#9ccfc7', '#c8dfdf', '#b6b9df'], background: '#f5e6db' },
      'Achromatic': { colors: ['#ffffff', '#ededed', '#d4d4d4', '#969696', '#282828', '#000000', '#555555', '#c9c9c9', '#a0a0a0'], background: '#ffffff', monochrome: true },
      'Achromatic + Accent': { colors: ['#ffffff', '#ededed', '#d4d4d4', '#969696', '#ff0000', '#ff0000', '#333333', '#c9c9c9', '#858585'], background: '#ffffff', monochrome: true },
      'Neutral + accent': { colors: ['#f4eee4', '#e4ddd0', '#bcb4a7', '#ada69c', '#c7845f', '#a96849', '#9fa9a7', '#ccd0ca', '#d2c9be'], background: '#e5dfd5' },
      'Amber / Ember': palette(['F6AA1C', 'BC3908', '941B0C', 'F6AA1C', '220901']),
      'Sea Glass': palette(['63D1CF', '5BC0BE', '4BAD9E', '4BAD9E', '0B132B', '000000']),
      'Orchid / Mauve': palette(['AA60C8', 'D69ADE', 'C9A3C6', 'CFB5C2', '0D001D', '120A12']),
      'Saffron / Petrol': palette(['FEF1BE', 'FFBA00', '008189', '00474D', '061210']),
      'Chartreuse / Jade': palette(['D4FFB0', '7FFF00', '00B894', '0A3322', '05140A']),
      'Apricot / Aubergine': palette(['FFE8CC', 'FF8C00', 'C7501A', '3D1050', '0E0618']),
      'Lavender / Indigo': palette(['E8E0FF', 'B38FFF', '6A3DE8', '1A1250', '090612']),
      'Cyan / Fuchsia': palette(['E0FBFF', '00F0FF', 'D40078', '1E0A3D', '05020F'])
    };
    const animationNames = ['Cloud Drift', 'Breathing Light', 'Silk Flow', 'Tidal Sway',
                            'Slow Orbit', 'Floating Frame', 'Quiet Approach', 'Static'];
    const settings = {
      scheme: 'Original', inverted: false, background: '#ffe3d4', greenscreen: false,
      animation: 'Cloud Drift', speed: 1, motion: 1, zoom: 1, panX: 0, panY: 0,
      angle: 0, tilt: 0, pixelRatio: Math.min(window.devicePixelRatio || 1, 1.75),
      softness: 1, warp: 0.045, grain: 0.010, seed: 0, spread: 1, shape: 1,
      clickRandomize: true
    };
    schemes.Original.colors.forEach((hex, i) => { settings['color' + i] = hex; });

    const uniforms = {
      uTime: { value: 0 },
      uLoopDuration: { value: 50 },
      uResolution: { value: new THREE.Vector2() },
      uWarpStrength: { value: 0.045 },
      uGrainAmount: { value: 0.010 },
      uColorSoftness: { value: 1.0 },
      uAnimationSpeed: { value: 1.0 },
      uPigments: { value: schemes.Original.colors.map(rgb) },
      uBackground: { value: rgb(settings.background) },
      uGreenscreen: { value: 0 },
      uZoom: { value: 1 },
      uPan: { value: new THREE.Vector2() },
      uViewAngle: { value: 0 },
      uViewTilt: { value: 0 },
      uAnimation: { value: 0 },
      uMotion: { value: 1 },
      uSeed: { value: 0 },
      uSpread: { value: 1 },
      uShape: { value: 1 }
    };

    const material = new THREE.ShaderMaterial({
      uniforms,
      depthTest: false,
      depthWrite: false,
      toneMapped: false,
      vertexShader: /* glsl */`
        void main() {
          gl_Position = vec4(position.xy, 0.0, 1.0);
        }
      `,
      fragmentShader: /* glsl */`
        precision highp float;
        uniform float uTime;
        uniform float uLoopDuration;
        uniform vec2 uResolution;
        uniform float uWarpStrength;
        uniform float uGrainAmount;
        uniform float uColorSoftness;
        uniform float uAnimationSpeed;
        uniform vec3 uPigments[9];
        uniform vec3 uBackground;
        uniform float uGreenscreen;
        uniform float uZoom;
        uniform vec2 uPan;
        uniform float uViewAngle;
        uniform float uViewTilt;
        uniform int uAnimation;
        uniform float uMotion;
        uniform float uSeed;
        uniform float uSpread;
        uniform float uShape;

        const float TAU = 6.28318530718;
        // Display-space pigments, mixed directly without another gamma transform.
        #define IVORY uPigments[0]
        #define PEACH uPigments[1]
        #define BLUSH uPigments[2]
        #define SALMON uPigments[3]
        #define CORAL uPigments[4]
        #define DEEP_CORAL uPigments[5]
        #define BLUE uPigments[6]
        #define SKY uPigments[7]
        #define LAVENDER uPigments[8]

        float hash(vec2 p) {
          vec3 q = fract(vec3(p.xyx) * 0.1031);
          q += dot(q, q.yzx + 33.33);
          return fract((q.x + q.y) * q.z);
        }

        float noise(vec2 p) {
          vec2 i = floor(p);
          vec2 f = fract(p);
          // Quintic interpolation keeps the broad deformation exceptionally soft.
          vec2 s = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
          return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), s.x),
                     mix(hash(i + vec2(0.0, 1.0)), hash(i + 1.0), s.x), s.y);
        }

        float fbm(vec2 p) {
          float result = 0.0;
          float weight = 0.65;
          const mat2 turn = mat2(0.8, -0.6, 0.6, 0.8);
          for (int i = 0; i < 4; i++) {
            result += weight * noise(p);
            p = turn * p * 1.92 + vec2(7.3, 2.8);
            weight *= 0.28;
          }
          return result / 0.8972288;
        }

        float cloud(vec2 p, vec2 center, vec2 radius, float angle) {
          float identity = dot(center, vec2(9.37, 7.19));
          float variation = step(0.001, uSeed);
          center = (center - 0.5) * uSpread + 0.5;
          center += vec2(sin(identity + uSeed), cos(identity * 1.7 + uSeed)) * 0.055 * variation;
          radius *= vec2(uShape, 1.0 / uShape);
          angle += sin(identity + uSeed * 0.3) * 0.20 * variation;
          vec2 q = p - center;
          float c = cos(angle), s = sin(angle);
          q = mat2(c, -s, s, c) * q;
          q /= radius * uColorSoftness;
          return exp(-dot(q, q) * 1.45);
        }

        void main() {
          vec2 uv = gl_FragCoord.xy / uResolution;
          uv.y = 1.0 - uv.y;

          // Cover-crop the 918 x 653 composition; every ellipse retains its shape.
          const float referenceAspect = 918.0 / 653.0;
          float aspect = uResolution.x / uResolution.y;
          // All temporal inputs are circular: the complete shader repeats at 50s.
          float phase = uAnimation == 7 ? 0.0 : TAU * mod(uTime * uAnimationSpeed, uLoopDuration) / uLoopDuration;
          vec2 viewOffset = vec2(0.0);
          float viewZoom = 1.0;
          float viewAngle = uViewAngle;
          float viewTilt = uViewTilt;
          if (uAnimation == 3) {
            viewOffset = vec2(0.035 * sin(phase), 0.015 * sin(phase * 2.0)) * uMotion;
          } else if (uAnimation == 4) {
            viewOffset = vec2(0.035 * (cos(phase) - 1.0), 0.02 * sin(phase)) * uMotion;
            viewAngle += sin(phase) * 0.16 * uMotion;
            viewTilt += sin(phase * 2.0) * 0.12 * uMotion;
          } else if (uAnimation == 5) {
            viewOffset = vec2(0.045 * sin(phase), 0.035 * (cos(phase) - 1.0)) * uMotion;
            viewAngle += sin(phase) * 0.045 * uMotion;
          } else if (uAnimation == 6) {
            // A multiplicative camera move never overwrites the user's zoom.
            viewZoom = exp(sin(phase) * 0.12 * uMotion);
            viewAngle += sin(phase) * 0.025 * uMotion;
          }
          vec2 world = ((uv - 0.5) * vec2(aspect, 1.0) - uPan - viewOffset) / (uZoom * viewZoom);
          float ca = cos(viewAngle), sa = sin(viewAngle);
          world = mat2(ca, -sa, sa, ca) * world;
          world.y /= max(cos(viewTilt), 0.35);
          float coverScale = max(aspect / referenceAspect, 1.0);
          vec2 p = world / vec2(referenceAspect, 1.0) / coverScale + 0.5;
          // Favor the warm/cool meeting point when a portrait viewport crops in.
          p.x += (1.0 - min(aspect / referenceAspect, 1.0)) * 0.28;

          vec2 orbit = vec2(cos(phase), sin(phase));
          vec2 travel = (orbit - vec2(1.0, 0.0)) * 0.115 * uMotion;
          vec2 seedOffset = vec2(uSeed * 0.37, uSeed * 0.61);
          vec2 warp = vec2(
            fbm(p * 2.25 + vec2(1.7, 4.2) + travel + seedOffset),
            fbm(p * 2.05 + vec2(8.3, 2.6) + travel.yx + seedOffset)
          ) - 0.5;
          vec2 q = p + warp * uWarpStrength;
          if (uAnimation == 2) {
            q += vec2(sin(q.y * 4.0 + phase) - sin(q.y * 4.0),
                      cos(q.x * 3.0 + phase) - cos(q.x * 3.0)) * 0.018 * uMotion;
          }
          vec2 drift = vec2(sin(phase), cos(phase) - 1.0) * uMotion;
          float breath = 1.0 + (uAnimation == 1 ? 0.055 : 0.018) * sin(phase) * uMotion;

          vec3 color = mix(uBackground, PEACH, uGreenscreen);
          color = mix(color, BLUSH, 0.46 * cloud(q, vec2(0.32, -0.08), vec2(0.68, 0.55), -0.25));
          color = mix(color, BLUSH, 0.16 * cloud(q, vec2(-0.12, 0.56), vec2(0.43, 0.63), 0.1));

          // The cool field stays mostly on the right, bending around the warm tip.
          float blueEdge = 0.778 - 0.025 * sin(q.y * 5.0 + 0.4)
                         + 0.011 * drift.x + warp.x * 0.045;
          float blueMask = smoothstep(blueEdge - 0.155, blueEdge + 0.19, q.x);
          vec3 cool = mix(SKY, BLUE, 0.80);
          cool = mix(cool, LAVENDER, 0.28 * cloud(q, vec2(0.89, 1.05), vec2(0.33, 0.34), 0.0));
          color = mix(color, cool, blueMask);

          // Broad salmon underpainting ties the lower-left edge into the coral.
          float salmon = cloud(q, vec2(0.16, 1.00) + drift * 0.008,
                               vec2(0.62, 0.43), -0.22);
          color = mix(color, SALMON, salmon * 0.66);
          color = mix(color, BLUSH, 0.30 * cloud(q, vec2(-0.08, 0.83), vec2(0.30, 0.45), 0.18));

          // Unequal overlapping lobes make one diffuse, asymmetrical coral bank.
          float lower = cloud(q, vec2(0.52, 1.045) + drift * vec2(0.012, 0.009),
                              vec2(0.31, 0.42) * breath, -0.23);
          float shoulder = cloud(q, vec2(0.635, 0.79) + drift * 0.009,
                                 vec2(0.25, 0.32) * breath, -0.42);
          float tip = cloud(q, vec2(0.744, 0.645) + drift * vec2(0.010, 0.007),
                            vec2(0.142, 0.195) * breath, 0.48);
          float bank = 1.0 - (1.0 - lower * 0.95) * (1.0 - shoulder * 0.84) * (1.0 - tip * 0.96);
          vec3 pigment = mix(CORAL, DEEP_CORAL, lower * 0.25);
          color = mix(color, PEACH, tip * 0.34);
          color = mix(color, pigment, bank);

          // Luminous cream hangs over the left side of the coral, like frosted silk.
          float cream = cloud(q, vec2(0.275, 0.40) + drift * 0.006,
                              vec2(0.385, 0.335), -0.15);
          float veil = cloud(q, vec2(0.47, 0.30), vec2(0.34, 0.33), 0.4);
          color = mix(color, IVORY, cream * 0.87);
          color = mix(color, IVORY, veil * 0.20);
          color = mix(color, PEACH, 0.13 * cloud(q, vec2(0.04, 0.10), vec2(0.30, 0.31), 0.0));

          // A finite feathered painting can be freely moved over a clean backdrop.
          vec2 boundary = abs(p - 0.5);
          float footprint = 1.0 - smoothstep(0.50, 0.66, max(boundary.x, boundary.y));
          float silhouette = max(max(bank, cream * 0.9), max(salmon * 0.52, blueMask * 0.62));
          float matte = footprint * mix(1.0, smoothstep(0.15, 0.73, silhouette), uGreenscreen);

          // Grain belongs only to the painting; clear key-green stays exactly #00ff00.
          float grain = (hash(gl_FragCoord.xy) + hash(gl_FragCoord.yx + 19.19) - 1.0);
          color += grain * uGrainAmount;
          color = mix(uBackground, color, matte);
          gl_FragColor = vec4(clamp(color, 0.0, 1.0), 1.0);
        }
      `
    });

    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const geometry = new THREE.PlaneGeometry(2, 2);
    const painting = new THREE.Mesh(geometry, material);
    painting.frustumCulled = false;
    scene.add(painting);

    let gui;
    let inverseController;
    const canvas = renderer.domElement;
    const clamp = THREE.MathUtils.clamp;
    const radians = THREE.MathUtils.degToRad;

    function refreshPanel() {
      gui?.controllersRecursive().forEach(controller => controller.updateDisplay());
      inverseController?.enable(!!schemes[settings.scheme].monochrome);
    }

    function updateUniforms() {
      uniforms.uPigments.value.forEach((color, i) => color.copy(rgb(settings['color' + i])));
      uniforms.uBackground.value.copy(rgb(settings.greenscreen ? '#00ff00' : settings.background));
      uniforms.uGreenscreen.value = Number(settings.greenscreen);
      uniforms.uZoom.value = settings.zoom;
      uniforms.uPan.value.set(settings.panX, settings.panY);
      uniforms.uViewAngle.value = radians(settings.angle);
      uniforms.uViewTilt.value = radians(settings.tilt);
      uniforms.uAnimation.value = animationNames.indexOf(settings.animation);
      uniforms.uMotion.value = settings.motion;
      uniforms.uWarpStrength.value = settings.warp;
      uniforms.uGrainAmount.value = settings.grain;
      uniforms.uColorSoftness.value = settings.softness;
      uniforms.uSeed.value = settings.seed;
      uniforms.uSpread.value = settings.spread;
      uniforms.uShape.value = settings.shape;
    }

    function applyScheme() {
      const scheme = schemes[settings.scheme];
      if (!scheme.monochrome) settings.inverted = false;
      const invert = hex => '#' + (parseInt(hex.slice(1), 16) ^ 0xffffff).toString(16).padStart(6, '0');
      scheme.colors.forEach((hex, i) => {
        const redAccent = settings.scheme === 'Achromatic + Accent' && (i === 4 || i === 5);
        settings['color' + i] = settings.inverted && !redAccent ? invert(hex) : hex;
      });
      settings.background = settings.inverted ? invert(scheme.background) : scheme.background;
      updateUniforms();
      refreshPanel();
    }

    function resetView() {
      Object.assign(settings, { zoom: 1, panX: 0, panY: 0, angle: 0, tilt: 0 });
      updateUniforms();
      refreshPanel();
    }

    function randomize() {
      const keys = Object.keys(schemes);
      // A reroll always selects a different theme, retaining the user's framing.
      settings.scheme = keys[(keys.indexOf(settings.scheme) + 1 + Math.floor(Math.random() * (keys.length - 1))) % keys.length];
      settings.inverted = !!schemes[settings.scheme].monochrome && Math.random() < 0.5;
      settings.seed = Math.round((1 + Math.random() * 999) * 100) / 100;
      settings.spread = 0.86 + Math.random() * 0.28;
      settings.shape = 0.80 + Math.random() * 0.43;
      settings.softness = 0.84 + Math.random() * 0.35;
      settings.warp = 0.025 + Math.random() * 0.055;
      settings.animation = animationNames[Math.floor(Math.random() * 7)];
      settings.speed = 0.4 + Math.random() * 0.7;
      settings.motion = 0.65 + Math.random() * 0.7;
      applyScheme();
    }

    if (GUI) {
      // Keep lil-gui's original styling; the scene has no instructional overlay.
      gui = new GUI({ title: 'Softly, In Color' });
      gui.add(settings, 'scheme', Object.keys(schemes)).name('Color scheme').onChange(applyScheme);
      inverseController = gui.add(settings, 'inverted').name('Invert B/W').onChange(applyScheme);
      inverseController.disable();
      gui.add(settings, 'animation', animationNames).name('Animation').onChange(updateUniforms);
      gui.add(settings, 'speed', 0, 100, 0.01).name('Animation speed');
      gui.add(settings, 'greenscreen').name('Greenscreen').onChange(updateUniforms);
      gui.addColor(settings, 'background').name('Background').onChange(updateUniforms);
      gui.add(settings, 'clickRandomize').name('Randomize on click');
      gui.add({ randomize }, 'randomize').name('New variation');

      const colors = gui.addFolder('Pigments');
      pigmentNames.forEach((name, i) => colors.addColor(settings, 'color' + i).name(name).onChange(updateUniforms));
      colors.close();

      const view = gui.addFolder('View');
      view.add(settings, 'zoom', 0.2, 8, 0.01).name('Zoom').onChange(updateUniforms);
      view.add(settings, 'panX', -3, 3, 0.01).name('Position X').onChange(updateUniforms);
      view.add(settings, 'panY', -3, 3, 0.01).name('Position Y').onChange(updateUniforms);
      view.add(settings, 'angle', -180, 180, 0.1).name('Camera angle').onChange(updateUniforms);
      view.add(settings, 'tilt', -55, 55, 0.1).name('Camera tilt').onChange(updateUniforms);
      view.add({ resetView }, 'resetView').name('Reset view');
      view.close();

      const atmosphere = gui.addFolder('Atmosphere');
      atmosphere.add(settings, 'motion', 0, 2, 0.01).name('Motion amount').onChange(updateUniforms);
      atmosphere.add(settings, 'softness', 0.55, 1.6, 0.01).name('Cloud softness').onChange(updateUniforms);
      atmosphere.add(settings, 'warp', 0, 0.14, 0.001).name('Organic warp').onChange(updateUniforms);
      atmosphere.add(settings, 'spread', 0.65, 1.4, 0.01).name('Cloud spread').onChange(updateUniforms);
      atmosphere.add(settings, 'shape', 0.65, 1.5, 0.01).name('Cloud shape').onChange(updateUniforms);
      atmosphere.add(settings, 'grain', 0, 0.025, 0.001).name('Film grain').onChange(updateUniforms);
      atmosphere.add(settings, 'seed', 0, 1000, 0.01).name('Variation seed').onChange(updateUniforms);
      atmosphere.close();

      const rendering = gui.addFolder('Rendering');
      rendering.add(settings, 'pixelRatio', 0.5, 3, 0.05).name('DPR / Pixel ratio').onChange(resize);
      rendering.close();
    }

    // A selectable DPR is honored directly instead of being silently capped.
    function resize() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      renderer.setPixelRatio(settings.pixelRatio);
      renderer.setSize(width, height);
      renderer.getDrawingBufferSize(uniforms.uResolution.value);
      renderer.render(scene, camera);
    }
    window.addEventListener('resize', resize, { passive: true });

    let frame = 0;
    let elapsed = 0;
    let previous = null;
    let contextLost = false;

    function animate(now) {
      frame = 0;
      if (document.hidden || contextLost) { previous = null; return; }
      // Integrate speed: editing it changes velocity without jumping in phase.
      if (previous !== null && settings.animation !== 'Static') {
        elapsed += Math.min((now - previous) / 1000, 0.1) * settings.speed;
      }
      previous = now;
      elapsed %= uniforms.uLoopDuration.value;
      uniforms.uTime.value = elapsed;
      renderer.render(scene, camera);
      frame = requestAnimationFrame(animate);
    }

    function resume() {
      cancelAnimationFrame(frame);
      previous = null;
      if (!document.hidden && !contextLost) frame = requestAnimationFrame(animate);
    }

    document.addEventListener('visibilitychange', resume);

    // The view is a shader-space orthographic camera. Its user offsets are never
    // assigned by an animation preset, so zoom, pan and orbit-angle edits persist.
    function animatedOffset() {
      const phase = settings.animation === 'Static' ? 0 : Math.PI * 2 * elapsed / uniforms.uLoopDuration.value;
      const sin = Math.sin(phase), cos = Math.cos(phase), m = settings.motion;
      switch (settings.animation) {
        case 'Tidal Sway': return [0.035 * sin * m, 0.015 * Math.sin(phase * 2) * m];
        case 'Slow Orbit': return [0.035 * (cos - 1) * m, 0.02 * sin * m];
        case 'Floating Frame': return [0.045 * sin * m, 0.035 * (cos - 1) * m];
        default: return [0, 0];
      }
    }

    canvas.addEventListener('wheel', event => {
      event.preventDefault();
      const delta = event.deltaY * (event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? innerHeight : 1);
      const nextZoom = clamp(settings.zoom * Math.exp(-clamp(delta, -500, 500) * 0.0015), 0.2, 8);
      const ratio = nextZoom / settings.zoom;
      const rect = canvas.getBoundingClientRect();
      const x = (event.clientX - rect.left - rect.width / 2) / rect.height;
      const y = (event.clientY - rect.top - rect.height / 2) / rect.height;
      const offset = animatedOffset();
      settings.panX = x - (x - settings.panX - offset[0]) * ratio - offset[0];
      settings.panY = y - (y - settings.panY - offset[1]) * ratio - offset[1];
      settings.zoom = nextZoom;
      updateUniforms();
      refreshPanel();
    }, { passive: false });

    let drag = null;
    canvas.addEventListener('pointerdown', event => {
      if (drag || (event.button !== 0 && event.button !== 2)) return;
      canvas.setPointerCapture(event.pointerId);
      drag = {
        id: event.pointerId, x: event.clientX, y: event.clientY,
        lastX: event.clientX, lastY: event.clientY, moved: false,
        rotate: event.button === 2 || event.shiftKey, button: event.button
      };
      canvas.classList.add('dragging');
    });
    canvas.addEventListener('pointermove', event => {
      if (!drag || drag.id !== event.pointerId) return;
      if (Math.hypot(event.clientX - drag.x, event.clientY - drag.y) > 4) drag.moved = true;
      if (!drag.moved) return;
      const dx = event.clientX - drag.lastX, dy = event.clientY - drag.lastY;
      if (drag.rotate) {
        settings.angle = ((settings.angle + dx * 0.22 + 540) % 360) - 180;
        settings.tilt = clamp(settings.tilt + dy * 0.16, -55, 55);
      } else {
        settings.panX += dx / canvas.clientHeight;
        settings.panY += dy / canvas.clientHeight;
      }
      drag.lastX = event.clientX;
      drag.lastY = event.clientY;
      updateUniforms();
      refreshPanel();
    });
    function endDrag(event) {
      if (!drag || drag.id !== event.pointerId) return;
      const clicked = event.type === 'pointerup' && !drag.moved && drag.button === 0 && !drag.rotate;
      const id = drag.id;
      drag = null;
      canvas.classList.remove('dragging');
      if (canvas.hasPointerCapture(id)) canvas.releasePointerCapture(id);
      if (clicked && settings.clickRandomize) randomize();
    }
    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);
    canvas.addEventListener('lostpointercapture', endDrag);
    canvas.addEventListener('contextmenu', event => event.preventDefault());

    let uiVisible = true;
    window.addEventListener('keydown', event => {
      if (event.code !== 'KeyH' || event.repeat || event.ctrlKey || event.altKey || event.metaKey) return;
      if (event.target instanceof Element && event.target.closest('input, textarea, select, [contenteditable="true"]')) return;
      uiVisible = !uiVisible;
      gui?.show(uiVisible);
    });
    renderer.domElement.addEventListener('webglcontextlost', event => {
      event.preventDefault();
      contextLost = true;
      cancelAnimationFrame(frame);
      previous = null;
    });
    renderer.domElement.addEventListener('webglcontextrestored', () => {
      contextLost = false;
      resize();
      resume();
    });
    window.addEventListener('pagehide', () => {
      cancelAnimationFrame(frame);
      previous = null;
    });
    window.addEventListener('pageshow', resume);
    updateUniforms();
    resize();
    resume();
  }
}
</script>
</body>
</html>
