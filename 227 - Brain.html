<script>
  const manhattan = `
    vec2 N22(vec2 p){
      vec3 a = fract(p.xyx * vec3(123.34, 234.34, 345.65));
      a += dot(a, a + 34.45);
      return fract(vec2(a.x * a.y, a.y * a.z));
    }
    
    vec4 manhattan(vec2 p){
      vec2 gv = fract(p) - 0.5;
      vec2 id = floor(p);
      vec2 cid = vec2(0);
      float minDist = 100.;
      for(float y = -1.; y <= 1.; y++){
        for(float x = -1.; x <= 1.; x++){
          vec2 offset = vec2(x, y);
          vec2 current = id + offset;
          vec2 n = N22(current);
          vec2 p = offset + sin(n * time * 0.25) * 0.5;
          p -= gv;
          float d = abs(p.x) + abs(p.y);
          if (d < minDist) {
            minDist = d;
            cid = current;
          }
        }
      }
      return vec4(cid, minDist, 0.);
    }
  `;
</script>
<script>
  const simplex = `
    // Simplex 3D Noise 
    // by Ian McEwan, Stefan Gustavson (https://github.com/stegu/webgl-noise)
    vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x, 289.0);}
    vec4 taylorInvSqrt(vec4 r){return 1.79284291400159 - 0.85373472095314 * r;}

    float snoise(vec3 v){ 
      const vec2 C = vec2(1.0/6.0, 1.0/3.0);
      const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);

      // First corner
      vec3 i = floor(v + dot(v, C.yyy));
      vec3 x0 = v - i + dot(i, C.xxx);

      // Other corners
      vec3 g = step(x0.yzx, x0.xyz);
      vec3 l = 1.0 - g;
      vec3 i1 = min(g.xyz, l.zxy);
      vec3 i2 = max(g.xyz, l.zxy);

      vec3 x1 = x0 - i1 + 1.0 * C.xxx;
      vec3 x2 = x0 - i2 + 2.0 * C.xxx;
      vec3 x3 = x0 - 1. + 3.0 * C.xxx;

      // Permutations
      i = mod(i, 289.0); 
      vec4 p = permute(permute(permute( 
                 i.z + vec4(0.0, i1.z, i2.z, 1.0))
               + i.y + vec4(0.0, i1.y, i2.y, 1.0)) 
               + i.x + vec4(0.0, i1.x, i2.x, 1.0));

      // Gradients
      float n_ = 1.0/7.0;
      vec3 ns = n_ * D.wyz - D.xzx;

      vec4 j = p - 49.0 * floor(p * ns.z * ns.z);

      vec4 x_ = floor(j * ns.z);
      vec4 y_ = floor(j - 7.0 * x_);

      vec4 x = x_ * ns.x + ns.yyyy;
      vec4 y = y_ * ns.x + ns.yyyy;
      vec4 h = 1.0 - abs(x) - abs(y);

      vec4 b0 = vec4(x.xy, y.xy);
      vec4 b1 = vec4(x.zw, y.zw);

      vec4 s0 = floor(b0) * 2.0 + 1.0;
      vec4 s1 = floor(b1) * 2.0 + 1.0;
      vec4 sh = -step(h, vec4(0.0));

      vec4 a0 = b0.xzyw + s0.xzyw * sh.xxyy;
      vec4 a1 = b1.xzyw + s1.xzyw * sh.zzww;

      vec3 p0 = vec3(a0.xy, h.x);
      vec3 p1 = vec3(a0.zw, h.y);
      vec3 p2 = vec3(a1.xy, h.z);
      vec3 p3 = vec3(a1.zw, h.w);

      // Normalise gradients
      vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
      p0 *= norm.x;
      p1 *= norm.y;
      p2 *= norm.z;
      p3 *= norm.w;

      // Mix final noise value
      vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
      m = m * m;
      return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
    }
  `;
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import GUI from "lil-gui";

console.clear();

// -------------------------------------------------------------
// PostProcessor Suite Inlined (Standalone file:// compatibility)
// -------------------------------------------------------------
const orthoVertexShader = `
precision highp float;
in vec3 position;
out vec2 vUv;
void main() {
  vUv = position.xy * 0.5 + 0.5;
  gl_Position = vec4(position, 1.0);
}
`;

const brightFragmentShader = `
precision highp float;
uniform sampler2D inputTexture;
uniform float bloomThreshold;
in vec2 vUv;
out vec4 fragColor;

void main() {
  vec4 color = texture(inputTexture, vUv);
  float luminance = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
  float knee = 0.1;
  float soft = luminance - bloomThreshold + knee;
  soft = clamp(soft, 0.0, 2.0 * knee);
  soft = (soft * soft) / (4.0 * knee + 0.00001);
  float contribution = max(soft, luminance - bloomThreshold);
  contribution /= max(luminance, 0.00001);
  fragColor = vec4(color.rgb * contribution, color.a);
}
`;

const blur13ShaderChunk = `
vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
  vec2 resolution = vec2(textureSize(image, 0));
  vec4 color = vec4(0.0);
  vec2 off1 = vec2(1.411764705882353) * direction;
  vec2 off2 = vec2(3.2941176470588234) * direction;
  vec2 off3 = vec2(5.176470588235294) * direction;
  color += texture(image, uv) * 0.1964825501511404;
  color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
  color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
  color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
  color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
  color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
  color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
  return color;
}
`;

const blurFragmentShader = `
precision highp float;
uniform sampler2D inputTexture;
uniform vec2 direction;
in vec2 vUv;
out vec4 color;
${blur13ShaderChunk}
void main() {
  color = blur13(inputTexture, vUv, direction);
}
`;

const finalFragmentShader = `
precision highp float;
uniform vec2 resolution;
uniform sampler2D inputTexture;
uniform sampler2D blur0Texture;
uniform sampler2D blur1Texture;
uniform sampler2D blur2Texture;
uniform sampler2D blur3Texture;
uniform sampler2D blur4Texture;
uniform bool bloomEnabled;
uniform float bloomStrength;
uniform float vignetteBoost;
uniform float vignetteReduction;
uniform float noiseIntensity;
uniform float time;
in vec2 vUv;
out vec4 fragColor;

float vignette(vec2 uv, float boost, float reduction) {
  vec2 position = vUv - 0.5;
  return boost - length(position) * reduction;
}

float hash1(uint n) {
  n = (n << 13U) ^ n;
  n = n * (n * n * 15731U + 789221U) + 1376312589U;
  return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
}

float noise(in vec2 uv, in float timeVal) {
  uvec2 p = uvec2(uv);
  return hash1(p.x + 1920U * p.y + (1920U * 1080U) * uint(timeVal));
}

void main() {
  vec4 color = texture(inputTexture, vUv);

  if (bloomEnabled && bloomStrength > 0.001) {
    vec4 b0 = texture(blur0Texture, vUv);
    vec4 b1 = texture(blur1Texture, vUv);
    vec4 b2 = texture(blur2Texture, vUv);
    vec4 b3 = texture(blur3Texture, vUv);
    vec4 b4 = texture(blur4Texture, vUv);

    vec4 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
    color += bloomSum * bloomStrength;
  }

  color.rgb *= vignette(vUv, vignetteBoost, vignetteReduction);
  color.rgb += noiseIntensity * noise(gl_FragCoord.xy, time);
  fragColor = vec4(color.rgb, 1.0);
}
`;

const chromaticAberrationShaderChunk = `
vec2 barrelDistortion(vec2 coord, float amt) {
  vec2 cc = coord - 0.5;
  float dist = dot(cc, cc);
  return coord + cc * dist * amt;
}
float sat(float t) { return clamp(t, 0.0, 1.0); }
float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
vec4 spectrum_offset(float t) {
  float lo = step(t, 0.5);
  float hi = 1.0 - lo;
  float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
  vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
  return pow(ret, vec4(1.0 / 2.2));
}
const float max_distort = 2.2;
const int num_iter = 8;
const float reci_num_iter_f = 1.0 / float(num_iter);
vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
  vec4 sumcol = vec4(0.0);
  vec4 sumw = vec4(0.0);
  for (int i = 0; i < num_iter; ++i) {
    float t = float(i) * reci_num_iter_f;
    vec4 w = spectrum_offset(t);
    sumw += w;
    sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
  }
  return sumcol / sumw;
}
`;

const colorFragmentShader = `
precision highp float;
uniform sampler2D inputTexture;
uniform float chromaticAberrationAmount;
uniform float minInputLevel;
uniform float maxInputLevel;
uniform float gammaLevel;
uniform float time;
in vec2 vUv;
out vec4 fragColor;

${chromaticAberrationShaderChunk}

vec3 gammaCorrect(vec3 color, vec3 gamma) {
  return pow(max(color, vec3(0.0)), 1.0 / gamma);
}
vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
  return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
}
vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
  return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
}
void main() {
  vec2 uv = 0.8 * (vUv - 0.5) + 0.5;
  fragColor = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (vUv - 0.5));
  fragColor.rgb = finalLevels(fragColor.rgb, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
  fragColor.a = 1.0;
}
`;

const copyFragmentShader = `
precision highp float;
uniform sampler2D inputTexture;
in vec2 vUv;
out vec4 fragColor;
void main() {
  fragColor = texture(inputTexture, vUv);
}
`;

function createFBO(w, h, options = {}) {
  return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
    wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
    wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
    minFilter: options.minFilter || THREE.LinearFilter,
    magFilter: options.magFilter || THREE.LinearFilter,
    format: options.format || THREE.RGBAFormat,
    type: options.type || THREE.HalfFloatType,
    stencilBuffer: options.stencilBuffer || false,
    depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : true,
    samples: options.samples || 0,
  });
}

class ShaderPass {
  constructor(shader, options = {}) {
    this.shader = shader;
    this.orthoScene = new THREE.Scene();
    this.fbo = createFBO(1, 1, options);
    this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
    this.orthoScene.add(this.orthoQuad);
    this.texture = this.fbo.texture;
  }
  render(renderer, toScreen = false) {
    if (!toScreen) {
      renderer.setRenderTarget(this.fbo);
    }
    renderer.render(this.orthoScene, this.orthoCamera);
    if (!toScreen) {
      renderer.setRenderTarget(null);
    }
  }
  setSize(width, height) {
    this.fbo.setSize(Math.max(1, width), Math.max(1, height));
    this.orthoQuad.scale.set(width, height, 1);
  }
}

class ShaderPingPongPass {
  constructor(shader, options = {}) {
    this.shader = shader;
    this.orthoScene = new THREE.Scene();
    this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
    this.currentFBO = 0;
    this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
    this.orthoScene.add(this.orthoQuad);
  }
  render(renderer) {
    renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
    renderer.render(this.orthoScene, this.orthoCamera);
    renderer.setRenderTarget(null);
    this.currentFBO = 1 - this.currentFBO;
  }
  get current() { return this.fbos[this.currentFBO]; }
  get texture() { return this.current.texture; }
  setSize(width, height) {
    const w = Math.max(1, width);
    const h = Math.max(1, height);
    this.orthoQuad.scale.set(w, h, 1);
    this.fbos[0].setSize(w, h);
    this.fbos[1].setSize(w, h);
  }
}

class BloomPass {
  constructor(strength = 0.8, radius = 0.5, threshold = 0.2, levels = 5) {
    this.strength = strength;
    this.radius = radius;
    this.threshold = threshold;
    this.enabled = true;
    this.levels = levels;

    this.brightShader = new THREE.RawShaderMaterial({
      uniforms: {
        inputTexture: { value: null },
        bloomThreshold: { value: this.threshold },
      },
      vertexShader: orthoVertexShader,
      fragmentShader: brightFragmentShader,
      glslVersion: THREE.GLSL3,
    });
    this.brightPass = new ShaderPass(this.brightShader, {
      format: THREE.RGBAFormat,
      type: THREE.HalfFloatType,
    });

    this.blurShader = new THREE.RawShaderMaterial({
      uniforms: {
        inputTexture: { value: null },
        direction: { value: new THREE.Vector2(0, 1) },
      },
      vertexShader: orthoVertexShader,
      fragmentShader: blurFragmentShader,
      glslVersion: THREE.GLSL3,
    });

    this.blurPasses = [];
    for (let i = 0; i < this.levels; i++) {
      this.blurPasses.push(new ShaderPingPongPass(this.blurShader, {
        format: THREE.RGBAFormat,
        type: THREE.HalfFloatType,
      }));
    }
  }

  setSize(w, h) {
    let tw = Math.max(1, w);
    let th = Math.max(1, h);
    this.brightPass.setSize(tw, th);
    for (let i = 0; i < this.levels; i++) {
      tw = Math.max(1, Math.round(tw / 2));
      th = Math.max(1, Math.round(th / 2));
      this.blurPasses[i].setSize(tw, th);
    }
  }

  set source(texture) {
    this.brightShader.uniforms.inputTexture.value = texture;
  }

  render(renderer) {
    if (!this.enabled || this.strength <= 0.001) return;

    this.brightShader.uniforms.bloomThreshold.value = this.threshold;
    this.brightPass.render(renderer);

    const baseOffset = Math.max(0.1, this.radius * 2.0);
    const u = this.blurShader.uniforms;

    for (let j = 0; j < this.levels; j++) {
      const blurPass = this.blurPasses[j];
      const stepOffset = baseOffset * (1.0 + j * 0.5);

      u.direction.value.set(stepOffset, 0);
      u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
      blurPass.render(renderer);

      u.direction.value.set(0, stepOffset * 0.5);
      u.inputTexture.value = blurPass.current.texture;
      blurPass.render(renderer);
    }
  }
}

class PostProcessor {
  constructor(renderer, params = {}) {
    this.renderer = renderer;

    this.settings = {
      enabled: params.enabled !== undefined ? params.enabled : true,
      bloomEnabled: params.bloomEnabled !== undefined ? params.bloomEnabled : true,
      bloomStrength: params.bloomStrength !== undefined ? params.bloomStrength : 0.75,
      bloomRadius: params.bloomRadius !== undefined ? params.bloomRadius : 0.45,
      bloomThreshold: params.bloomThreshold !== undefined ? params.bloomThreshold : 0.25,
      chromaticAberration: params.chromaticAberration !== undefined ? params.chromaticAberration : 0.025,
      vignetteBoost: params.vignetteBoost !== undefined ? params.vignetteBoost : 1.0,
      vignetteReduction: params.vignetteReduction !== undefined ? params.vignetteReduction : 0.45,
      noiseIntensity: params.noiseIntensity !== undefined ? params.noiseIntensity : 0.015,
      gamma: params.gamma !== undefined ? params.gamma : 1.0,
      minInputLevel: params.minInputLevel !== undefined ? params.minInputLevel : 0.0,
      maxInputLevel: params.maxInputLevel !== undefined ? params.maxInputLevel : 1.0,
    };

    this.sceneTarget = createFBO(1, 1, { type: THREE.HalfFloatType });

    this.bloomPass = new BloomPass(
      this.settings.bloomStrength,
      this.settings.bloomRadius,
      this.settings.bloomThreshold,
      5
    );

    this.finalShader = new THREE.RawShaderMaterial({
      uniforms: {
        resolution: { value: new THREE.Vector2(1, 1) },
        bloomEnabled: { value: this.settings.bloomEnabled },
        bloomStrength: { value: this.settings.bloomStrength },
        vignetteBoost: { value: this.settings.vignetteBoost },
        vignetteReduction: { value: this.settings.vignetteReduction },
        noiseIntensity: { value: this.settings.noiseIntensity },
        inputTexture: { value: null },
        blur0Texture: { value: null },
        blur1Texture: { value: null },
        blur2Texture: { value: null },
        blur3Texture: { value: null },
        blur4Texture: { value: null },
        time: { value: 0 },
      },
      vertexShader: orthoVertexShader,
      fragmentShader: finalFragmentShader,
      glslVersion: THREE.GLSL3,
    });
    this.finalPass = new ShaderPass(this.finalShader);

    this.rgbShader = new THREE.RawShaderMaterial({
      uniforms: {
        inputTexture: { value: this.finalPass.texture },
        chromaticAberrationAmount: { value: this.settings.chromaticAberration },
        minInputLevel: { value: this.settings.minInputLevel },
        maxInputLevel: { value: this.settings.maxInputLevel },
        gammaLevel: { value: this.settings.gamma },
        time: { value: 0 },
      },
      vertexShader: orthoVertexShader,
      fragmentShader: colorFragmentShader,
      glslVersion: THREE.GLSL3,
    });
    this.rgbPass = new ShaderPass(this.rgbShader);

    this.copyShader = new THREE.RawShaderMaterial({
      uniforms: {
        inputTexture: { value: null },
      },
      vertexShader: orthoVertexShader,
      fragmentShader: copyFragmentShader,
      glslVersion: THREE.GLSL3,
    });
    this.copyPass = new ShaderPass(this.copyShader);
  }

  updateSettings() {
    this.bloomPass.enabled = this.settings.bloomEnabled;
    this.bloomPass.strength = this.settings.bloomStrength;
    this.bloomPass.radius = this.settings.bloomRadius;
    this.bloomPass.threshold = this.settings.bloomThreshold;

    this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
    this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
    this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
    this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
    this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;

    this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
    this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
    this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
    this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
  }

  setSize(w0, h0, dpr = 1) {
    const w = Math.max(1, Math.floor(w0 * dpr));
    const h = Math.max(1, Math.floor(h0 * dpr));
    this.sceneTarget.setSize(w, h);
    this.finalPass.setSize(w, h);
    this.finalShader.uniforms.resolution.value.set(w, h);
    this.bloomPass.setSize(w, h);
    this.rgbPass.setSize(w, h);
    this.copyPass.setSize(w, h);
  }

  renderScene(scene, camera) {
    if (!this.settings.enabled) {
      this.renderer.render(scene, camera);
      return;
    }
    this.renderer.setRenderTarget(this.sceneTarget);
    this.renderer.render(scene, camera);
    this.renderer.setRenderTarget(null);
    this.render(this.sceneTarget.texture);
  }

  render(sourceTexture) {
    if (!this.settings.enabled) {
      this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
      this.copyPass.render(this.renderer, true);
      return;
    }

    this.updateSettings();

    this.bloomPass.source = sourceTexture;
    this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
    this.bloomPass.render(this.renderer);

    this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
    this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
    this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
    this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
    this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

    const randomTime = Math.random() * 100000;
    this.finalPass.shader.uniforms.time.value = randomTime;
    this.rgbPass.shader.uniforms.time.value = randomTime;

    this.finalPass.render(this.renderer);
    this.rgbPass.render(this.renderer, true);
  }

  attachGUI(gui, title = "Post-Processing Suite") {
    const root = gui.addFolder(title);
    root.add(this.settings, "enabled").name("Enable Suite");

    const bloom = root.addFolder("Bloom");
    bloom.add(this.settings, "bloomEnabled").name("Enable Bloom").onChange(() => this.updateSettings());
    bloom.add(this.settings, "bloomStrength", 0, 3.0, 0.05).name("Strength").onChange(() => this.updateSettings());
    bloom.add(this.settings, "bloomRadius", 0, 2.0, 0.05).name("Radius").onChange(() => this.updateSettings());
    bloom.add(this.settings, "bloomThreshold", 0, 1.0, 0.01).name("Threshold").onChange(() => this.updateSettings());

    const lens = root.addFolder("Lens & Color");
    lens.add(this.settings, "chromaticAberration", 0, 0.1, 0.002).name("Chromatic Aberration").onChange(() => this.updateSettings());
    lens.add(this.settings, "vignetteBoost", 0, 2.0, 0.05).name("Vignette Boost").onChange(() => this.updateSettings());
    lens.add(this.settings, "vignetteReduction", 0, 2.0, 0.05).name("Vignette Falloff").onChange(() => this.updateSettings());
    lens.add(this.settings, "noiseIntensity", 0, 0.1, 0.005).name("Film Grain").onChange(() => this.updateSettings());
    lens.add(this.settings, "gamma", 0.2, 2.0, 0.05).name("Gamma").onChange(() => this.updateSettings());
    lens.add(this.settings, "minInputLevel", 0, 0.5, 0.01).name("Black Level").onChange(() => this.updateSettings());
    lens.add(this.settings, "maxInputLevel", 0.5, 1.0, 0.01).name("White Level").onChange(() => this.updateSettings());

    return root;
  }
}

// -------------------------------------------------------------
const mu = THREE.MathUtils;

const model = (await loader.loadAsync("https://cywarr.github.io/small-shop/ali_brain.gltf")).scene.children[0].children[0];

const ANIMATION_MODES = [
  "Orbit Gentle",
  "Zenith Flow (Figure-8)",
  "Dual Horizon Wave",
  "Slow Floating Drift",
  "Static (No Camera Motion)"
];

const params = {
  preset: "Dualism Monochrome (Original)",
  greenscreen: false,
  bgColor: PRESETS["Dualism Monochrome (Original)"].bgColor,
  baseColor: PRESETS["Dualism Monochrome (Original)"].baseColor,
  orderColor: PRESETS["Dualism Monochrome (Original)"].orderColor,
  disorderColor: PRESETS["Dualism Monochrome (Original)"].disorderColor,
  patternScale: 5.0,
  patternIntensity: 1.0,
  noiseSpeed: 1.0,
  roughness: 0.0,
  metalness: 0.0,

  animSpeed: 1.0,
  animationMode: "Orbit Gentle",
  dpr: Math.min(window.devicePixelRatio || 1, 2),
  clickRandomize: true
};

const gu = {
  time: { value: 0 },
  aspect: { value: innerWidth / innerHeight },
  polar: { value: 0 },
  azimuth: { value: 0 },
  baseColor: { value: new THREE.Color(params.baseColor) },
  orderColor: { value: new THREE.Color(params.orderColor) },
  disorderColor: { value: new THREE.Color(params.disorderColor) },
  patternScale: { value: params.patternScale },
  patternIntensity: { value: params.patternIntensity },
  noiseSpeed: { value: params.noiseSpeed }
};

class Brain extends THREE.Group {
  constructor() {
    super();
    this.model = model;
    
    this.model.material = new THREE.MeshStandardMaterial({
      metalness: params.metalness,
      roughness: params.roughness,
      onBeforeCompile: shader => {
        shader.uniforms.time = gu.time;
        shader.uniforms.aspect = gu.aspect;
        shader.uniforms.polar = gu.polar;
        shader.uniforms.azimuth = gu.azimuth;
        shader.uniforms.baseColor = gu.baseColor;
        shader.uniforms.orderColor = gu.orderColor;
        shader.uniforms.disorderColor = gu.disorderColor;
        shader.uniforms.patternScale = gu.patternScale;
        shader.uniforms.patternIntensity = gu.patternIntensity;
        shader.uniforms.noiseSpeed = gu.noiseSpeed;
        
        shader.vertexShader = `
          varying vec3 vPos;
          varying vec4 vProjPos;
          ${shader.vertexShader}
        `.replace(
          `#include <project_vertex>`,
          `#include <project_vertex>
            vPos = position;
            vProjPos = gl_Position;
          `
        );
        
        shader.fragmentShader = `
          uniform float time;
          uniform float aspect;
          uniform float polar;
          uniform float azimuth;
          uniform vec3 baseColor;
          uniform vec3 orderColor;
          uniform vec3 disorderColor;
          uniform float patternScale;
          uniform float patternIntensity;
          uniform float noiseSpeed;
          
          varying vec3 vPos;
          varying vec4 vProjPos;
          
          ${manhattan}
          ${simplex}
          ${shader.fragmentShader}
        `.replace(
          `vec4 diffuseColor = vec4( diffuse, opacity );`,
          `
          float fHalven = smoothstep(0., 0.05, vPos.x);
          
          vec2 uv = (vProjPos.xy / vProjPos.w) * vec2(aspect, 1.);
          uv *= patternScale;
          
          float f = 0.;
          
          vec4 mData = manhattan(uv);
          float fm = max(mData.z, 1. - smoothstep(0., 0.2, abs(mData.z - 0.65)));
          fm *= fm;
          fm = 1. - fm;
          
          float fs = 1. - smoothstep(0.1, 0.3, pow(abs(snoise(vec3(uv, time * noiseSpeed))), 0.5));
          
          f = mix(fs, fm, fHalven);
          
          vec3 hemiColor = mix(disorderColor, orderColor, fHalven);
          vec3 col = mix(baseColor, hemiColor, clamp(f * patternIntensity, 0.0, 1.0));
          
          vec4 diffuseColor = vec4( col, opacity );
          `
        );
      }
    });
    
    this.add(this.model);
  }
}

const scene = new THREE.Scene();
scene.background = new THREE.Color(params.greenscreen ? "#00ff00" : params.bgColor);

const camera = new THREE.PerspectiveCamera(
  45,
  innerWidth / innerHeight,
  0.1,
  100
);
camera.position.set(0, 0, 1).setLength(3.25);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(params.dpr);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const postProcessor = new PostProcessor(renderer, {
  bloomEnabled: true,
  bloomStrength: 0.75,
  bloomRadius: 0.45,
  bloomThreshold: 0.25,
  chromaticAberration: 0.02,
  vignetteBoost: 1.0,
  vignetteReduction: 0.4,
  noiseIntensity: 0.015,
  gamma: 1.0
});
postProcessor.setSize(innerWidth, innerHeight, params.dpr);

const pmremGenerator = new THREE.PMREMGenerator(renderer);
scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = params.envIntensity;

const light = new THREE.DirectionalLight(0xffffff, 1.2);
light.position.set(2, 3, 2);
scene.add(light);

const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambientLight);

const brain = new Brain();
scene.add(brain);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.enablePan = true;
controls.enableZoom = true;
controls.enableRotate = true;

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  postProcessor.setSize(innerWidth, innerHeight, params.dpr);
  gu.aspect.value = camera.aspect;
});

// Update functions
function applyColorsAndParams() {
  gu.baseColor.value.set(params.baseColor);
  gu.orderColor.value.set(params.orderColor);
  gu.disorderColor.value.set(params.disorderColor);
  gu.patternScale.value = params.patternScale;
  gu.patternIntensity.value = params.patternIntensity;
  gu.noiseSpeed.value = params.noiseSpeed;
  
  if (brain && brain.model && brain.model.material) {
    brain.model.material.roughness = params.roughness;
    brain.model.material.metalness = params.metalness;
  }
  
  scene.environmentIntensity = params.envIntensity;
  scene.background.set(params.greenscreen ? "#00ff00" : params.bgColor);
}

function applyPreset(name) {
  const p = PRESETS[name];
  if (!p) return;
  params.preset = name;
  params.bgColor = p.bgColor;
  params.baseColor = p.baseColor;
  params.orderColor = p.orderColor;
  params.disorderColor = p.disorderColor;
  params.patternScale = p.patternScale;
  params.patternIntensity = p.patternIntensity;
  params.noiseSpeed = p.noiseSpeed;
  params.roughness = p.roughness;
  params.metalness = p.metalness;
  params.envIntensity = p.envIntensity;
  
  applyColorsAndParams();
  updateGuiDisplay();
}

function updateGuiDisplay() {
  function syncFolder(f) {
    f.controllers.forEach(c => c.updateDisplay());
    f.folders.forEach(sub => syncFolder(sub));
  }
  syncFolder(gui);
}

// Procedural randomizer on scene click
function hslToHex(h, s, l) {
  const col = new THREE.Color();
  col.setHSL(h, s, l);
  return "#" + col.getHexString();
}

function randomizeScene() {
  const h1 = Math.random();
  const h2 = (h1 + 0.35 + Math.random() * 0.3) % 1.0;
  
  const isDarkBase = Math.random() > 0.15;
  const baseL = isDarkBase ? (0.02 + Math.random() * 0.08) : (0.8 + Math.random() * 0.15);
  const bgL = isDarkBase ? (0.02 + Math.random() * 0.06) : (0.7 + Math.random() * 0.15);
  
  params.preset = "Custom";
  params.bgColor = hslToHex(h1, 0.4, bgL);
  params.baseColor = hslToHex(h1, 0.6, baseL);
  params.orderColor = hslToHex(h1, 0.9, 0.65);
  params.disorderColor = hslToHex(h2, 0.9, 0.6);
  
  params.patternScale = +(2.5 + Math.random() * 6.5).toFixed(1);
  params.patternIntensity = +(0.7 + Math.random() * 0.7).toFixed(2);
  params.noiseSpeed = +(0.5 + Math.random() * 1.5).toFixed(2);
  params.roughness = +(Math.random() * 0.4).toFixed(2);
  params.metalness = +(Math.random() * 0.6).toFixed(2);
  params.envIntensity = +(0.5 + Math.random() * 1.0).toFixed(2);
  params.animSpeed = +(0.6 + Math.random() * 1.0).toFixed(2);
  
  applyColorsAndParams();
  updateGuiDisplay();
}

// GUI Setup
const gui = new GUI({ title: "Brain Controls" });

const fPresets = gui.addFolder("Color Schemes");
fPresets.add(params, "preset", Object.keys(PRESETS).concat(["Custom"])).name("Theme").onChange(applyPreset);
fPresets.add(params, "greenscreen").name("Greenscreen (#00ff00)").onChange(applyColorsAndParams);
fPresets.addColor(params, "bgColor").name("Background Color").onChange(() => {
  params.preset = "Custom";
  applyColorsAndParams();
  updateGuiDisplay();
});
fPresets.addColor(params, "baseColor").name("Base Brain Color").onChange(() => {
  params.preset = "Custom";
  applyColorsAndParams();
  updateGuiDisplay();
});
fPresets.addColor(params, "orderColor").name("Order (Grid) Color").onChange(() => {

  updateGuiDisplay();

fPresets.addColor(params, "disorderColor").name("Disorder (Noise) Color").onChange(() => {

});

const fAnim = gui.addFolder("Animation & Motion");
fAnim.add(params, "animationMode", ANIMATION_MODES).name("Camera Animation");
fAnim.add(params, "animSpeed", 0.0, 3.0, 0.05).name("Global Speed");
fAnim.add(params, "noiseSpeed", 0.1, 3.0, 0.05).name("Noise Flow Speed").onChange(applyColorsAndParams);

const fGeo = gui.addFolder("Material & Geometry");
fGeo.add(params, "patternScale", 1.0, 12.0, 0.1).name("Pattern Scale").onChange(applyColorsAndParams);

fGeo.add(params, "roughness", 0.0, 1.0, 0.01).name("Roughness").onChange(applyColorsAndParams);
fGeo.add(params, "metalness", 0.0, 1.0, 0.01).name("Metalness").onChange(applyColorsAndParams);

// PostProcessor controls attached directly to GUI
postProcessor.attachGUI(gui);

const fSettings = gui.addFolder("Settings & Interaction");
fSettings.add(params, "dpr", 0.5, 3.0, 0.1).name("Pixel Ratio (DPR)").onChange(v => {
  renderer.setPixelRatio(v);

});
fSettings.add(params, "clickRandomize").name("Click Scene to Randomize");

// Hide/show UI with "H" key
window.addEventListener("keydown", (e) => {
  if (e.key === "h" || e.key === "H") {
    if (gui._hidden) {
      gui.show();
    } else {
      gui.hide();
    }
  }
});

// Click detection for randomizer
let pointerDownPos = { x: 0, y: 0 };
let pointerDownTime = 0;

window.addEventListener("pointerdown", (e) => {
  if (e.target.closest && e.target.closest(".lil-gui")) return;
  pointerDownPos = { x: e.clientX, y: e.clientY };
  pointerDownTime = performance.now();
});

window.addEventListener("pointerup", (e) => {
  if (e.target.closest && e.target.closest(".lil-gui")) return;
  const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
  const elapsed = performance.now() - pointerDownTime;
  if (dist < 5 && elapsed < 350 && params.clickRandomize) {
    randomizeScene();
  }
});

// Animation loop
const clock = new THREE.Clock();
let animTime = 0;
let currentCamDistance = 3.25;
let isUserInteracting = false;

controls.addEventListener("start", () => {
  isUserInteracting = true;
});

controls.addEventListener("end", () => {
  isUserInteracting = false;
  currentCamDistance = camera.position.distanceTo(controls.target);
});

renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  animTime += dt * params.animSpeed;
  gu.time.value = animTime;

  if (!isUserInteracting && params.animationMode !== "Static (No Camera Motion)") {
    const target = controls.target;
    let x = 0, y = 0, z = currentCamDistance;

    if (params.animationMode === "Orbit Gentle") {
      const angle = animTime * 0.25;
      x = Math.sin(angle) * currentCamDistance;
      z = Math.cos(angle) * currentCamDistance;
      y = Math.sin(animTime * 0.35) * 0.35;
    } else if (params.animationMode === "Zenith Flow (Figure-8)") {
      const angle = animTime * 0.2;
      x = Math.sin(angle) * currentCamDistance * 0.95;
      z = Math.cos(angle * 0.5) * currentCamDistance * 1.05;
      y = Math.sin(angle * 2.0) * 0.6 + 0.3;
    } else if (params.animationMode === "Dual Horizon Wave") {
      const angle = Math.sin(animTime * 0.35) * (Math.PI * 0.55);
      x = Math.sin(angle) * currentCamDistance;
      z = Math.cos(angle) * currentCamDistance;
      y = Math.sin(animTime * 0.25) * 0.25;
    } else if (params.animationMode === "Slow Floating Drift") {
      const dist = currentCamDistance + Math.sin(animTime * 0.2) * 0.35;
      const yaw = Math.sin(animTime * 0.15) * 0.8;
      const pitch = Math.cos(animTime * 0.18) * 0.35;
      x = Math.sin(yaw) * Math.cos(pitch) * dist;
      y = Math.sin(pitch) * dist;
      z = Math.cos(yaw) * Math.cos(pitch) * dist;
    }

    camera.position.set(target.x + x, target.y + y, target.z + z);
    camera.lookAt(target);
  } else {
    currentCamDistance = camera.position.distanceTo(controls.target);
  }

  controls.update();
  gu.polar.value = controls.getPolarAngle() / Math.PI;
  gu.azimuth.value = controls.getAzimuthalAngle() / Math.PI;
  
  postProcessor.renderScene(scene, camera);
});
