<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procedural Planetary Core</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #010102;
            user-select: none;
            font-family: sans-serif;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #theme-panel {
            position: absolute;
            bottom: 30px;
            left: 30px;
            z-index: 10;
            transition: opacity 0.3s ease;
        }

        .animating-border-btn {
            position: relative;
            padding: 2px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.05);
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .animating-border-btn::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(transparent, transparent, transparent, var(--theme-color, #00d2ff));
            animation: rotate-border 4s linear infinite;
        }

        @keyframes rotate-border {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .btn-content {
            position: relative;
            background: rgba(10, 12, 18, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 10px;
            display: flex;
            align-items: center;
            z-index: 1;
        }

        .thumbs-container {
            display: flex;
            gap: 8px;
        }

        .thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
            box-sizing: border-box;
            border: 2px solid transparent;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), border-color 0.2s, box-shadow 0.2s;
        }

        .thumb[data-theme="0"] { background: linear-gradient(135deg, #00d2ff, #ff5500); }
        .thumb[data-theme="1"] { background: linear-gradient(135deg, #ff00ff, #00ff00); }
        .thumb[data-theme="2"] { background: linear-gradient(135deg, #0055ff, #ffdd00); }
        .thumb[data-theme="3"] { background: linear-gradient(135deg, #00ffaa, #0077aa); }
        .thumb[data-theme="4"] { background: linear-gradient(135deg, #9d4edd, #ff70a6); }

        .thumb:hover {
            transform: scale(1.15);
        }

        .thumb.active {
            border-color: #ffffff;
            box-shadow: 0 0 10px var(--theme-color, #ffffff);
            transform: scale(1.15);
        }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
                "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
            }
        }
    </script>
</head>
<body>
    <div id="theme-panel">
        <div class="animating-border-btn">
            <div class="btn-content">
                <div class="thumbs-container">
                    <div class="thumb active" data-theme="0" data-color="#00d2ff" title="Magma & Cyan"></div>
                    <div class="thumb" data-theme="1" data-color="#ff00ff" title="Neon Void"></div>
                    <div class="thumb" data-theme="2" data-color="#ffdd00" title="Solar Flare"></div>
                    <div class="thumb" data-theme="3" data-color="#00ffaa" title="Abyssal Bioluminescence"></div>
                    <div class="thumb" data-theme="4" data-color="#ff70a6" title="Celestial Amethyst"></div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import GUI from 'lil-gui';

        const themes = [
            {
                name: 'Magma & Cyan',
                core: [new THREE.Color(0.1, 0.0, 0.0), new THREE.Color(0.9, 0.05, 0.0), new THREE.Color(1.0, 0.4, 0.0), new THREE.Color(1.0, 0.9, 0.2)],
                vein: { surface: new THREE.Color(0.0, 0.8, 1.0), coreA: new THREE.Color(0.8, 0.1, 0.0), coreB: new THREE.Color(1.0, 0.6, 0.0) },
                boundary: new THREE.Color(0.0, 1.5, 3.0),
                map: new THREE.Color(0x006699),
                glass: new THREE.Color(0x001133),
                volcano: new THREE.Color(0xff5500),
                dust: new THREE.Color(0x223355),
                bg: new THREE.Color(0x010102),
                colorHex: '#00d2ff'
            },
            {
                name: 'Neon Void',
                core: [new THREE.Color(0.05, 0.0, 0.1), new THREE.Color(0.5, 0.0, 0.5), new THREE.Color(1.0, 0.0, 0.8), new THREE.Color(1.0, 0.5, 1.0)],
                vein: { surface: new THREE.Color(0.2, 1.0, 0.2), coreA: new THREE.Color(0.8, 0.0, 0.8), coreB: new THREE.Color(0.0, 0.8, 1.0) },
                boundary: new THREE.Color(2.0, 0.0, 1.5), 
                map: new THREE.Color(0x330055),
                glass: new THREE.Color(0x110022),
                volcano: new THREE.Color(0x00ff00), 
                dust: new THREE.Color(0x2a0044),
                bg: new THREE.Color(0x020005),
                colorHex: '#ff00ff'
            },
            {
                name: 'Solar Flare',
                core: [new THREE.Color(0.05, 0.02, 0.0), new THREE.Color(0.8, 0.4, 0.0), new THREE.Color(1.0, 0.8, 0.2), new THREE.Color(1.5, 1.5, 1.5)],
                vein: { surface: new THREE.Color(0.0, 0.3, 2.0), coreA: new THREE.Color(1.0, 0.8, 0.0), coreB: new THREE.Color(1.0, 0.3, 0.0) },
                boundary: new THREE.Color(1.5, 1.5, 2.5), 
                map: new THREE.Color(0x112244),
                glass: new THREE.Color(0x221100),
                volcano: new THREE.Color(0xffdd00),
                dust: new THREE.Color(0x443311),
                bg: new THREE.Color(0x000103),
                colorHex: '#ffdd00'
            },
            {
                name: 'Abyssal Bioluminescence',
                core: [new THREE.Color(0.0, 0.05, 0.05), new THREE.Color(0.0, 0.6, 0.5), new THREE.Color(0.1, 0.9, 0.7), new THREE.Color(0.8, 1.0, 0.9)],
                vein: { surface: new THREE.Color(0.0, 1.0, 0.7), coreA: new THREE.Color(0.0, 0.5, 0.9), coreB: new THREE.Color(0.2, 1.0, 0.4) },
                boundary: new THREE.Color(0.2, 2.0, 1.8),
                map: new THREE.Color(0x003333),
                glass: new THREE.Color(0x001a1a),
                volcano: new THREE.Color(0x00ffaa),
                dust: new THREE.Color(0x0a2a24),
                bg: new THREE.Color(0x000806),
                colorHex: '#00ffaa'
            },
            {
                name: 'Celestial Amethyst',
                core: [new THREE.Color(0.08, 0.0, 0.12), new THREE.Color(0.4, 0.1, 0.7), new THREE.Color(0.9, 0.2, 0.8), new THREE.Color(1.0, 0.8, 1.0)],
                vein: { surface: new THREE.Color(0.4, 0.6, 1.0), coreA: new THREE.Color(0.9, 0.1, 0.6), coreB: new THREE.Color(0.6, 0.2, 1.0) },
                boundary: new THREE.Color(1.8, 0.8, 2.5),
                map: new THREE.Color(0x2b0d38),
                glass: new THREE.Color(0x160520),
                volcano: new THREE.Color(0xff66cc),
                dust: new THREE.Color(0x2d123a),
                bg: new THREE.Color(0x05010a),
                colorHex: '#ff70a6'
            }
        ];
        
        let activeTheme = 0;

        const currentSettings = {
            theme: 'Magma & Cyan',
            greenScreen: false,
            greenScreenColor: '#00ff00',
            dpr: Math.min(window.devicePixelRatio, 2),
            animSpeed: 1.0,
            animationMode: 'Orbital Float',
            randomizeOnClick: true,
            
            // Shader & Visual settings
            coreDisplacement: 0.15,
            veinPulseSpeed: 0.3,
            bloomStrength: 2.0,
            bloomRadius: 0.5,
            bloomThreshold: 0.85,
            dustSpeed: 0.02,

            // Custom Color Palette bindings
            bgColor: '#' + themes[0].bg.getHexString(),
            coreDark: '#' + themes[0].core[0].getHexString(),
            coreRed: '#' + themes[0].core[1].getHexString(),
            coreOrange: '#' + themes[0].core[2].getHexString(),
            coreYellow: '#' + themes[0].core[3].getHexString(),
            veinSurface: '#' + themes[0].vein.surface.getHexString(),
            veinCoreA: '#' + themes[0].vein.coreA.getHexString(),
            veinCoreB: '#' + themes[0].vein.coreB.getHexString(),
            boundaryColor: '#' + themes[0].boundary.getHexString(),
            volcanoColor: '#' + themes[0].volcano.getHexString(),
            dustColor: '#' + themes[0].dust.getHexString()
        };

        const targetColors = {
            cDark: themes[0].core[0].clone(),
            cRed: themes[0].core[1].clone(),
            cOrange: themes[0].core[2].clone(),
            cYellow: themes[0].core[3].clone(),
            cSurface: themes[0].vein.surface.clone(),
            cCoreA: themes[0].vein.coreA.clone(),
            cCoreB: themes[0].vein.coreB.clone(),
            boundary: themes[0].boundary.clone(),
            volcano: themes[0].volcano.clone(),
            dust: themes[0].dust.clone(),
            bg: themes[0].bg.clone()
        };

        const thumbs = document.querySelectorAll('.thumb');
        function applyTheme(index) {
            activeTheme = index;
            thumbs.forEach((t, i) => {
                if (i === index) t.classList.add('active');
                else t.classList.remove('active');
            });
            const t = themes[index];
            document.documentElement.style.setProperty('--theme-color', t.colorHex);
            currentSettings.theme = t.name;

            targetColors.cDark.copy(t.core[0]);
            targetColors.cRed.copy(t.core[1]);
            targetColors.cOrange.copy(t.core[2]);
            targetColors.cYellow.copy(t.core[3]);
            targetColors.cSurface.copy(t.vein.surface);
            targetColors.cCoreA.copy(t.vein.coreA);
            targetColors.cCoreB.copy(t.vein.coreB);
            targetColors.boundary.copy(t.boundary);
            targetColors.volcano.copy(t.volcano);
            targetColors.dust.copy(t.dust);
            targetColors.bg.copy(t.bg);

            currentSettings.bgColor = '#' + t.bg.getHexString();
            currentSettings.coreDark = '#' + t.core[0].getHexString();
            currentSettings.coreRed = '#' + t.core[1].getHexString();
            currentSettings.coreOrange = '#' + t.core[2].getHexString();
            currentSettings.coreYellow = '#' + t.core[3].getHexString();
            currentSettings.veinSurface = '#' + t.vein.surface.getHexString();
            currentSettings.veinCoreA = '#' + t.vein.coreA.getHexString();
            currentSettings.veinCoreB = '#' + t.vein.coreB.getHexString();
            currentSettings.boundaryColor = '#' + t.boundary.getHexString();
            currentSettings.volcanoColor = '#' + t.volcano.getHexString();
            currentSettings.dustColor = '#' + t.dust.getHexString();

            gui.controllersRecursive().forEach(c => c.updateDisplay());
        }

        thumbs.forEach(thumb => {
            thumb.addEventListener('click', (e) => {
                const idx = parseInt(e.currentTarget.getAttribute('data-theme'));
                applyTheme(idx);
            });
        });

        const snoise3GLSL = `
            vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
            vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

            float snoise(vec3 v) {
                const vec2  C = vec2(1.0/6.0, 1.0/3.0) ;
                const vec4  D = vec4(0.0, 0.5, 1.0, 2.0);
                vec3 i  = floor(v + dot(v, C.yyy) );
                vec3 x0 = v - i + dot(i, C.xxx) ;
                vec3 g = step(x0.yzx, x0.xyz);
                vec3 l = 1.0 - g;
                vec3 i1 = min( g.xyz, l.zxy );
                vec3 i2 = max( g.xyz, l.zxy );
                vec3 x1 = x0 - i1 + C.xxx;
                vec3 x2 = x0 - i2 + C.yyy; 
                vec3 x3 = x0 - D.yyy;      
                i = mod289(i);
                vec4 p = permute( permute( permute( i.z + vec4(0.0, i1.z, i2.z, 1.0 )) + i.y + vec4(0.0, i1.y, i2.y, 1.0 )) + i.x + vec4(0.0, i1.x, i2.x, 1.0 ));
                float n_ = 0.142857142857; 
                vec3  ns = n_ * D.wyz - D.xzx;
                vec4 j = p - 49.0 * floor(p * ns.z * ns.z);  
                vec4 x_ = floor(j * ns.z);
                vec4 y_ = floor(j - 7.0 * x_ );    
                vec4 x = x_ *ns.x + ns.yyyy;
                vec4 y = y_ *ns.x + ns.yyyy;
                vec4 h = 1.0 - abs(x) - abs(y);
                vec4 b0 = vec4( x.xy, y.xy );
                vec4 b1 = vec4( x.zw, y.zw );
                vec4 s0 = floor(b0)*2.0 + 1.0;
                vec4 s1 = floor(b1)*2.0 + 1.0;
                vec4 sh = -step(h, vec4(0.0));
                vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ;
                vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ;
                vec3 p0 = vec3(a0.xy,h.x);
                vec3 p1 = vec3(a0.zw,h.y);
                vec3 p2 = vec3(a1.xy,h.z);
                vec3 p3 = vec3(a1.zw,h.w);
                vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
                p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
                vec4 m = max(0.5 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
                m = m * m;
                return 42.0 * dot( m*m, vec4( dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3) ) );
            }
        `;

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(themes[0].bg.getHex(), 0.012);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(15, 10, 25);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(currentSettings.dpr);
        document.body.appendChild(renderer.domElement);

        const textureLoader = new THREE.TextureLoader();
        const earthTex = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_specular_2048.jpg');

        const renderScene = new RenderPass(scene, camera);
        
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), currentSettings.bloomStrength, currentSettings.bloomRadius, currentSettings.bloomThreshold);
        
        const composer = new EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.enableZoom = true;
        controls.enablePan = true;
        controls.enableRotate = true;
        controls.screenSpacePanning = true;
        controls.panSpeed = 1.0;
        controls.rotateSpeed = 0.8;
        controls.zoomSpeed = 1.2;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.8;
        controls.maxDistance = 60;
        controls.minDistance = 6;

        const mainGroup = new THREE.Group();
        scene.add(mainGroup);

        const CORE_RADIUS = 2.2;
        const OUTER_RADIUS = 10.0;
        const NUM_VEINS = 1200; 
        const POINTS_PER_VEIN = 45;

        const uniforms = {
            time: { value: 0 },
            displacementScale: { value: currentSettings.coreDisplacement },
            veinSpeed: { value: currentSettings.veinPulseSpeed },
            cDark: { value: themes[0].core[0].clone() },
            cRed: { value: themes[0].core[1].clone() },
            cOrange: { value: themes[0].core[2].clone() },
            cYellow: { value: themes[0].core[3].clone() },
            cSurface: { value: themes[0].vein.surface.clone() },
            cCoreA: { value: themes[0].vein.coreA.clone() },
            cCoreB: { value: themes[0].vein.coreB.clone() },
            boundaryColor: { value: themes[0].boundary.clone() },
            tEarth: { value: earthTex }
        };

        const dustGeo = new THREE.BufferGeometry();
        const dustPositions = [];
        for(let i = 0; i < 2000; i++) {
            dustPositions.push((Math.random() - 0.5) * 100, (Math.random() - 0.5) * 100, (Math.random() - 0.5) * 100);
        }
        dustGeo.setAttribute('position', new THREE.Float32BufferAttribute(dustPositions, 3));
        const dustMat = new THREE.PointsMaterial({
            color: themes[0].dust.clone(),
            size: 0.1,
            transparent: true,
            opacity: 0.3,
            blending: THREE.AdditiveBlending
        });
        const dustMesh = new THREE.Points(dustGeo, dustMat);
        scene.add(dustMesh);

        const coreGeo = new THREE.SphereGeometry(CORE_RADIUS, 128, 128);
        const coreMat = new THREE.ShaderMaterial({
            uniforms: uniforms,
            vertexShader: `
                uniform float time;
                uniform float displacementScale;
                varying vec3 vPosition;
                varying vec3 vNormal;
                ${snoise3GLSL}
                void main() {
                    vPosition = position;
                    vNormal = normal;
                    float displacement = snoise(position * 1.8 + time * 0.4) * displacementScale;
                    vec3 newPosition = position + normal * displacement;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(newPosition, 1.0);
                }
            `,
            fragmentShader: `
                uniform float time;
                
                uniform vec3 cDark;
                uniform vec3 cRed;
                uniform vec3 cOrange;
                uniform vec3 cYellow;

                varying vec3 vPosition;
                varying vec3 vNormal;
                ${snoise3GLSL}
                
                void main() {
                    float n1 = snoise(vPosition * 1.5 - time * 0.5);
                    float n2 = snoise(vPosition * 4.0 + time * 0.3);
                    float noiseVal = n1 * 0.6 + n2 * 0.4;

                    vec3 color;
                    if (noiseVal < -0.1) {
                        color = mix(cDark, cRed, smoothstep(-0.5, -0.1, noiseVal));
                    } else if (noiseVal < 0.3) {
                        color = mix(cRed, cOrange, smoothstep(-0.1, 0.3, noiseVal));
                    } else {
                        color = mix(cOrange, cYellow, smoothstep(0.3, 0.8, noiseVal));
                    }

                    float fresnel = dot(vNormal, vec3(0.0, 0.0, 1.0));
                    fresnel = clamp(1.0 - fresnel, 0.0, 1.0);
                    color += cOrange * pow(fresnel, 2.0) * 0.8;

                    color *= 1.5;

                    gl_FragColor = vec4(color, 1.0);
                }
            `
        });
        const coreMesh = new THREE.Mesh(coreGeo, coreMat);
        mainGroup.add(coreMesh);

        function getPointOnSphere(radius) {
            const u = Math.random();
            const v = Math.random();
            const theta = 2 * Math.PI * u;
            const phi = Math.acos(2 * v - 1);
            return new THREE.Vector3(
                radius * Math.sin(phi) * Math.cos(theta),
                radius * Math.sin(phi) * Math.sin(theta),
                radius * Math.cos(phi)
            );
        }

        const volcanoPoints = [];
        for (let i = 0; i < 150; i++) {
            volcanoPoints.push(getPointOnSphere(OUTER_RADIUS));
        }

        const veinPositions = [];
        const veinProgress = [];
        const veinOffsets = [];
        const veinRands = [];

        for (let i = 0; i < NUM_VEINS; i++) {
            const start = getPointOnSphere(OUTER_RADIUS);
            const end = start.clone().normalize().multiplyScalar(CORE_RADIUS * 0.85); 

            const mid = new THREE.Vector3().lerpVectors(start, end, 0.5);
            mid.normalize().multiplyScalar(OUTER_RADIUS * 0.55);
            
            const tangent = new THREE.Vector3().crossVectors(start, new THREE.Vector3(0,1,0)).normalize();
            const bitangent = new THREE.Vector3().crossVectors(start, tangent).normalize();
            
            mid.add(tangent.multiplyScalar((Math.random() - 0.5) * 6));
            mid.add(bitangent.multiplyScalar((Math.random() - 0.5) * 6));

            const curve = new THREE.QuadraticBezierCurve3(start, mid, end);
            const points = curve.getPoints(POINTS_PER_VEIN);
            const offset = Math.random(); 
            const randSeed = Math.random();

            for (let j = 0; j < POINTS_PER_VEIN; j++) {
                veinPositions.push(points[j].x, points[j].y, points[j].z);
                veinPositions.push(points[j+1].x, points[j+1].y, points[j+1].z);
                veinProgress.push(j / POINTS_PER_VEIN, (j + 1) / POINTS_PER_VEIN);
                veinOffsets.push(offset, offset);
                veinRands.push(randSeed, randSeed);
            }
        }

        const veinGeo = new THREE.BufferGeometry();
        veinGeo.setAttribute('position', new THREE.Float32BufferAttribute(veinPositions, 3));
        veinGeo.setAttribute('progress', new THREE.Float32BufferAttribute(veinProgress, 1));
        veinGeo.setAttribute('offset', new THREE.Float32BufferAttribute(veinOffsets, 1));
        veinGeo.setAttribute('randomSeed', new THREE.Float32BufferAttribute(veinRands, 1));

        const veinMat = new THREE.ShaderMaterial({
            uniforms: uniforms,
            vertexShader: `
                attribute float progress;
                attribute float offset;
                attribute float randomSeed;
                varying float vProgress;
                varying float vOffset;
                varying float vRandom;
                void main() {
                    vProgress = progress;
                    vOffset = offset;
                    vRandom = randomSeed;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform float time;
                uniform float veinSpeed;
                uniform vec3 cSurface;
                uniform vec3 cCoreA;
                uniform vec3 cCoreB;

                varying float vProgress;
                varying float vOffset;
                varying float vRandom;
                
                void main() {
                    vec3 targetCoreColor = mix(cCoreA, cCoreB, vRandom);
                    vec3 color = mix(cSurface, targetCoreColor, pow(vProgress, 1.5));

                    float phase = vProgress - time * veinSpeed + vOffset * 10.0;
                    float flow = fract(phase);
                    float pulse = exp(-flow * 10.0);
                    
                    vec3 pulseGlow = color * pulse * 10.0; 
                    color += pulseGlow;

                    float alphaBase = 0.02; 
                    float alphaPulse = pulse * 0.9;
                    float alpha = alphaBase + alphaPulse;
                    
                    alpha *= smoothstep(0.0, 0.05, vProgress) * smoothstep(1.0, 0.8, vProgress);

                    gl_FragColor = vec4(color, alpha);
                }
            `,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        const veinMesh = new THREE.LineSegments(veinGeo, veinMat);
        mainGroup.add(veinMesh);

        const earthGlobeGeo = new THREE.SphereGeometry(OUTER_RADIUS * 0.995, 128, 128);
        const earthGlobeMat = new THREE.ShaderMaterial({
            uniforms: uniforms,
            vertexShader: `
                varying vec2 vUv;
                varying vec3 vNormal;
                void main() {
                    vUv = uv;
                    vNormal = normalize(normalMatrix * normal);
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D tEarth;
                uniform vec3 boundaryColor;
                varying vec2 vUv;
                varying vec3 vNormal;

                void main() {
                    vec2 texel = vec2(1.5 / 2048.0, 1.5 / 1024.0); 
                    
                    float c = texture2D(tEarth, vUv).r;
                    float r = texture2D(tEarth, vUv + vec2(texel.x, 0.0)).r;
                    float u = texture2D(tEarth, vUv + vec2(0.0, texel.y)).r;
                    float l = texture2D(tEarth, vUv + vec2(-texel.x, 0.0)).r;
                    float d = texture2D(tEarth, vUv + vec2(0.0, -texel.y)).r;
                    
                    float edge = abs(4.0 * c - r - u - l - d);
                    
                    float outline = smoothstep(0.1, 0.8, edge);
                    
                    vec3 color = boundaryColor * outline;
                    
                    color *= 2.5;
                    
                    float fresnel = pow(1.0 - max(dot(vNormal, vec3(0.0, 0.0, 1.0)), 0.0), 3.0);
                    color += boundaryColor * fresnel * 0.5;
                    
                    float alpha = outline * 0.8 + fresnel * 0.2;
                    
                    gl_FragColor = vec4(color, alpha);
                }
            `,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        const earthGlobeMesh = new THREE.Mesh(earthGlobeGeo, earthGlobeMat);
        mainGroup.add(earthGlobeMesh);

        const volcanoGeo = new THREE.BufferGeometry().setFromPoints(volcanoPoints);
        const volcanoMat = new THREE.ShaderMaterial({
            uniforms: {
                color: { value: themes[0].volcano.clone() },
                size: { value: 7.0 * window.devicePixelRatio },
                time: uniforms.time
            },
            vertexShader: `
                uniform float size;
                void main() {
                    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                    gl_PointSize = size * (20.0 / -mvPosition.z);
                    gl_Position = projectionMatrix * mvPosition;
                }
            `,
            fragmentShader: `
                uniform vec3 color;
                uniform float time;
                void main() {
                    vec2 pt = gl_PointCoord - vec2(0.5);
                    if(abs(pt.x) > 0.35 || abs(pt.y) > 0.35) discard;
                    
                    float throb = sin(time * 3.0 + gl_FragCoord.x) * 0.5 + 0.5;
                    gl_FragColor = vec4(color * (1.5 + throb), 0.9);
                }
            `,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        const volcanoMesh = new THREE.Points(volcanoGeo, volcanoMat);
        mainGroup.add(volcanoMesh);

        // Procedural scene generation function
        function randomizeScene() {
            const h = Math.random();
            const h2 = (h + 0.3 + Math.random() * 0.4) % 1.0;
            const h3 = (h + 0.6 + Math.random() * 0.3) % 1.0;

            const cDark = new THREE.Color().setHSL(h, 0.9, 0.05);
            const cRed = new THREE.Color().setHSL(h, 0.95, 0.4);
            const cOrange = new THREE.Color().setHSL(h2, 0.95, 0.6);
            const cYellow = new THREE.Color().setHSL(h2, 0.9, 0.85);

            const cSurf = new THREE.Color().setHSL(h3, 1.0, 0.6);
            const cCoreA = new THREE.Color().setHSL(h, 0.9, 0.5);
            const cCoreB = new THREE.Color().setHSL(h2, 0.9, 0.55);

            const bCol = new THREE.Color().setHSL(h3, 0.9, 0.7);
            const vCol = new THREE.Color().setHSL(h2, 1.0, 0.6);
            const dCol = new THREE.Color().setHSL(h, 0.4, 0.15);
            const bgCol = new THREE.Color().setHSL(h, 0.6, 0.015);

            targetColors.cDark.copy(cDark);
            targetColors.cRed.copy(cRed);
            targetColors.cOrange.copy(cOrange);
            targetColors.cYellow.copy(cYellow);
            targetColors.cSurface.copy(cSurf);
            targetColors.cCoreA.copy(cCoreA);
            targetColors.cCoreB.copy(cCoreB);
            targetColors.boundary.copy(bCol);
            targetColors.volcano.copy(vCol);
            targetColors.dust.copy(dCol);
            targetColors.bg.copy(bgCol);

            currentSettings.bgColor = '#' + bgCol.getHexString();
            currentSettings.coreDark = '#' + cDark.getHexString();
            currentSettings.coreRed = '#' + cRed.getHexString();
            currentSettings.coreOrange = '#' + cOrange.getHexString();
            currentSettings.coreYellow = '#' + cYellow.getHexString();
            currentSettings.veinSurface = '#' + cSurf.getHexString();
            currentSettings.veinCoreA = '#' + cCoreA.getHexString();
            currentSettings.veinCoreB = '#' + cCoreB.getHexString();
            currentSettings.boundaryColor = '#' + bCol.getHexString();
            currentSettings.volcanoColor = '#' + vCol.getHexString();
            currentSettings.dustColor = '#' + dCol.getHexString();

            currentSettings.coreDisplacement = 0.08 + Math.random() * 0.25;
            currentSettings.veinPulseSpeed = 0.15 + Math.random() * 0.45;
            currentSettings.bloomStrength = 1.4 + Math.random() * 1.5;
            currentSettings.dustSpeed = 0.01 + Math.random() * 0.03;

            uniforms.displacementScale.value = currentSettings.coreDisplacement;
            uniforms.veinSpeed.value = currentSettings.veinPulseSpeed;
            bloomPass.strength = currentSettings.bloomStrength;

            currentSettings.theme = 'Custom / Procedural';
            thumbs.forEach(t => t.classList.remove('active'));
            document.documentElement.style.setProperty('--theme-color', '#' + cSurf.getHexString());

            gui.controllersRecursive().forEach(c => c.updateDisplay());
        }

        // Lil-GUI Setup
        const gui = new GUI({ title: 'Controls & Settings' });

        const themeFolder = gui.addFolder('Presets & Colors');
        themeFolder.add(currentSettings, 'theme', [
            'Magma & Cyan',
            'Neon Void',
            'Solar Flare',
            'Abyssal Bioluminescence',
            'Celestial Amethyst',
            'Custom / Procedural'
        ]).name('Color Scheme').onChange(val => {
            const idx = themes.findIndex(t => t.name === val);
            if (idx !== -1) applyTheme(idx);
        });

        themeFolder.add(currentSettings, 'greenScreen').name('Green Screen (#00ff00)').onChange(val => {
            if (val) {
                targetColors.bg.set(currentSettings.greenScreenColor);
            } else {
                targetColors.bg.set(currentSettings.bgColor);
            }
        });

        const colorSubfolder = themeFolder.addFolder('Custom Color Palette').close();
        colorSubfolder.addColor(currentSettings, 'bgColor').name('Background').onChange(val => {
            targetColors.bg.set(val);
            if (!currentSettings.greenScreen) scene.fog.color.set(val);
        });
        colorSubfolder.addColor(currentSettings, 'coreDark').name('Core Dark').onChange(val => targetColors.cDark.set(val));
        colorSubfolder.addColor(currentSettings, 'coreRed').name('Core Mid 1').onChange(val => targetColors.cRed.set(val));
        colorSubfolder.addColor(currentSettings, 'coreOrange').name('Core Mid 2').onChange(val => targetColors.cOrange.set(val));
        colorSubfolder.addColor(currentSettings, 'coreYellow').name('Core Highlight').onChange(val => targetColors.cYellow.set(val));
        colorSubfolder.addColor(currentSettings, 'veinSurface').name('Vein Surface').onChange(val => targetColors.cSurface.set(val));
        colorSubfolder.addColor(currentSettings, 'veinCoreA').name('Vein Core A').onChange(val => targetColors.cCoreA.set(val));
        colorSubfolder.addColor(currentSettings, 'veinCoreB').name('Vein Core B').onChange(val => targetColors.cCoreB.set(val));
        colorSubfolder.addColor(currentSettings, 'boundaryColor').name('Globe Boundary').onChange(val => targetColors.boundary.set(val));
        colorSubfolder.addColor(currentSettings, 'volcanoColor').name('Volcano Sparks').onChange(val => targetColors.volcano.set(val));
        colorSubfolder.addColor(currentSettings, 'dustColor').name('Cosmic Dust').onChange(val => targetColors.dust.set(val));

        const animFolder = gui.addFolder('Animation & Camera');
        animFolder.add(currentSettings, 'animationMode', [
            'Orbital Float',
            'Hypnotic Breathing',
            'Polar Helix Glide',
            'Core Flow Focus',
            'Static (No Camera Move)'
        ]).name('Camera Preset').onChange(mode => {
            if (mode === 'Static (No Camera Move)') {
                controls.autoRotate = false;
            } else if (mode === 'Orbital Float' || mode === 'Hypnotic Breathing') {
                controls.autoRotate = true;
            } else {
                controls.autoRotate = false;
            }
        });

        animFolder.add(currentSettings, 'animSpeed', 0.1, 3.0, 0.05).name('Animation Speed');
        animFolder.add(currentSettings, 'veinPulseSpeed', 0.05, 1.5, 0.05).name('Vein Flow Speed').onChange(val => {
            uniforms.veinSpeed.value = val;
        });
        animFolder.add(currentSettings, 'coreDisplacement', 0.0, 0.5, 0.01).name('Core Turbulence').onChange(val => {
            uniforms.displacementScale.value = val;
        });
        animFolder.add(currentSettings, 'dustSpeed', 0.0, 0.1, 0.005).name('Dust Drift Speed');

        const renderFolder = gui.addFolder('Rendering & FX');
        renderFolder.add(currentSettings, 'dpr', 0.5, 3.0, 0.1).name('Pixel Ratio (DPR)').onChange(val => {
            renderer.setPixelRatio(val);
            composer.setPixelRatio(val);
            volcanoMat.uniforms.size.value = 7.0 * val;
        });
        renderFolder.add(currentSettings, 'bloomStrength', 0.0, 4.0, 0.1).name('Bloom Glow').onChange(val => {
            bloomPass.strength = val;
        });
        renderFolder.add(currentSettings, 'bloomRadius', 0.0, 1.5, 0.05).name('Bloom Radius').onChange(val => {
            bloomPass.radius = val;
        });
        renderFolder.add(currentSettings, 'bloomThreshold', 0.0, 1.0, 0.05).name('Bloom Threshold').onChange(val => {
            bloomPass.threshold = val;
        });

        const proceduralFolder = gui.addFolder('Procedural Generation');
        proceduralFolder.add(currentSettings, 'randomizeOnClick').name('Randomize on Click');
        proceduralFolder.add({ randomize: randomizeScene }, 'randomize').name('⚡ Generate New Theme');

        // Click on scene detection (differentiating drag/pan from click)
        let pointerDownPos = { x: 0, y: 0 };
        let pointerDownTime = 0;

        window.addEventListener('pointerdown', (e) => {
            pointerDownPos = { x: e.clientX, y: e.clientY };
            pointerDownTime = performance.now();
        });

        window.addEventListener('pointerup', (e) => {
            const dt = performance.now() - pointerDownTime;
            const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
            const isCanvas = e.target.tagName.toLowerCase() === 'canvas';
            
            if (currentSettings.randomizeOnClick && isCanvas && dist < 6 && dt < 400) {
                randomizeScene();
            }
        });

        // Hide/show UI with 'H' key
        let uiVisible = true;
        window.addEventListener('keydown', (e) => {
            if (e.key === 'h' || e.key === 'H') {
                uiVisible = !uiVisible;
                const themePanel = document.getElementById('theme-panel');
                if (themePanel) themePanel.style.display = uiVisible ? 'block' : 'none';
                if (gui && gui.domElement) gui.domElement.style.display = uiVisible ? 'block' : 'none';
            }
        });

        const clock = new THREE.Clock();
        const LERP_SPEED = 0.05;
        let animatedTime = 0;

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            animatedTime += delta * currentSettings.animSpeed;

            uniforms.time.value = animatedTime;
            volcanoMat.uniforms.time.value = animatedTime;

            // Lerp uniforms towards target colors
            uniforms.cDark.value.lerp(targetColors.cDark, LERP_SPEED);
            uniforms.cRed.value.lerp(targetColors.cRed, LERP_SPEED);
            uniforms.cOrange.value.lerp(targetColors.cOrange, LERP_SPEED);
            uniforms.cYellow.value.lerp(targetColors.cYellow, LERP_SPEED);

            uniforms.cSurface.value.lerp(targetColors.cSurface, LERP_SPEED);
            uniforms.cCoreA.value.lerp(targetColors.cCoreA, LERP_SPEED);
            uniforms.cCoreB.value.lerp(targetColors.cCoreB, LERP_SPEED);

            uniforms.boundaryColor.value.lerp(targetColors.boundary, LERP_SPEED);
            volcanoMat.uniforms.color.value.lerp(targetColors.volcano, LERP_SPEED);
            dustMat.color.lerp(targetColors.dust, LERP_SPEED);

            if (currentSettings.greenScreen) {
                scene.fog.color.lerp(new THREE.Color(0x00ff00), LERP_SPEED);
                renderer.setClearColor(scene.fog.color);
            } else {
                scene.fog.color.lerp(targetColors.bg, LERP_SPEED);
                renderer.setClearColor(scene.fog.color);
            }

            dustMesh.rotation.y += currentSettings.dustSpeed * currentSettings.animSpeed * delta * 60.0 * 0.015;

            // Handle Camera Preset Animations
            const mode = currentSettings.animationMode;
            if (mode === 'Orbital Float') {
                controls.autoRotate = true;
                controls.autoRotateSpeed = 0.8 * currentSettings.animSpeed;
                camera.position.y += Math.sin(animatedTime * 0.6) * 0.035;
            } else if (mode === 'Hypnotic Breathing') {
                controls.autoRotate = true;
                controls.autoRotateSpeed = 0.35 * currentSettings.animSpeed;
                const breathOffset = Math.sin(animatedTime * 0.5) * 0.04;
                camera.position.addScaledVector(camera.position.clone().normalize(), breathOffset);
            } else if (mode === 'Polar Helix Glide') {
                controls.autoRotate = false;
                const radius = 28 + Math.sin(animatedTime * 0.25) * 3;
                const angle = animatedTime * 0.25;
                const elev = Math.sin(animatedTime * 0.2) * 14;
                camera.position.x = Math.cos(angle) * radius;
                camera.position.z = Math.sin(angle) * radius;
                camera.position.y = elev;
                camera.lookAt(controls.target);
            } else if (mode === 'Core Flow Focus') {
                controls.autoRotate = false;
                const r = 16.5 + Math.sin(animatedTime * 0.3) * 1.5;
                const a = animatedTime * 0.2;
                camera.position.x = Math.cos(a) * r;
                camera.position.z = Math.sin(a) * r;
                camera.position.y = Math.cos(animatedTime * 0.25) * 6.0;
                camera.lookAt(controls.target);
            } else if (mode === 'Static (No Camera Move)') {
                controls.autoRotate = false;
            }

            controls.update();
            composer.render();
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
