  <style>
    /* ============================================================
       CSS Reset & Viewport UX
       ============================================================ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #f8f9fa;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      cursor: grab;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    }

    body.grabbing {
      cursor: grabbing;
    }

    /* Edge-to-Edge Fullscreen Canvas Container */
    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      display: block;
      width: 100vw !important;
      height: 100vh !important;
      outline: none;

      --background-color: rgba(15, 18, 26, 0.88) !important;

    // ============================================================
    // Global Settings & Reactive Controls State
    // ============================================================
    const settings = {
      // Color & Visual Harmony
      colorScheme: 'Original',
      coloringMode: 'Harmonious Palette', // 'Harmonious Palette', 'Original Grayscale'
      invertColors: false,

      // Animation & Time Dynamics
      animSpeed: 1.0,
      isPaused: false,
      swayIntensity: 1.0,
      swaySpeed: 1.0,
      autoRotate: false,
      rotationSpeed: 0.5,

      // Colony & Spore Morphology
      maxnum: 500,
      spawnRate: 5,
      radialExpansionRate: 0.45,
      initialDelay: 90,
      stalkThickness: 0.5,
      headScale: 1.0,
      baseScale: 1.0,

      // Petri Dish Geometry
      showDish: true,
      dishRadius: 320,
      dishHeight: 50,
      dishOpacity: 0.25,
      showAgarBase: true,

      // Viewport & Camera Interaction
      primaryDrag: 'Pan (Drag across screen)', // 'Pan (Drag across screen)' | 'Orbit (Rotate 3D)'
      zoom: 1.0,
      panX: 0,
      panY: 0,
      rotX: -0.392699, // -PI / 8
      rotY: 0,
      clickToRandomize: true,

      // Action Handlers
      regenerate: () => regenerateScene(),
      randomize: () => randomizeAll(true),
      resetView: () => resetCamera(),
      exportPNG: () => saveArtwork()
    };

    // Simulation Growth State
    let spores = [];
    let r = 0;
    let simFrame = 0;
    let simTime = 0;

    // Camera Transform & Smooth Inertia Interpolation
    let targetPanX = 0, currentPanX = 0;
    let targetPanY = 0, currentPanY = 0;
    let targetZoom = 1.0, currentZoom = 1.0;
    let targetRotX = -Math.PI / 8, currentRotX = -Math.PI / 8;
    let targetRotY = 0, currentRotY = 0;

    // Pointer Interaction State
    let isPointerDown = false;
    let isDragging = false;
    let pointerStartX = 0, pointerStartY = 0;
    let pointerStartTime = 0;
    let lastPointerX = 0, lastPointerY = 0;
    let activeDragAction = 'pan'; // 'pan' or 'orbit'

    // GUI References
    let gui = null;
    let controllers = {};

    // ============================================================
    // Spore Class
    // ============================================================
    class Spore {
      constructor(pos, id) {
        this.pos = createVector(pos.x, 0, pos.y);
        this.ang = createVector(random(-PI / 16, PI / 16), 0, random(-PI / 16, PI / 16));
        this.r = 0;
        this.rv = random(0.1, 0.3);
        this.len = 0;
        this.lv = random(0.1, 0.3);
        this.maxlen = 40 - sin(map(this.pos.mag(), 0, 300, 0, HALF_PI)) * 10;
        this.maxr = random(40, 60);
        this.base = random(355);
        this.f = random(140, 180);
        this.id = id;
        this.d = this.pos.mag();
        this.type = random([0, 1, 2]);
      }

      show(theme) {
        push();
        translate(this.pos);

        // 1. Base Mycelium Disc on the Agar
        specularMaterial(20);
        if (settings.coloringMode === 'Original Grayscale' || settings.colorScheme === 'Original') {
          let b = constrain(this.base, 0, 255);
          fill(b);
        } else {
          // Harmonious palette mycelium tone
          let myc = theme.mycelium;
          let fFactor = map(this.base, 0, 355, 0.7, 1.25);
          fill(constrain(myc[0] * fFactor, 0, 255),
               constrain(myc[1] * fFactor, 0, 255),
               constrain(myc[2] * fFactor, 0, 255));
        }

        let dim = max(2, (this.r / 3) * settings.baseScale);
        ellipsoid(dim, dim / 8, dim, 12, 8);

        // 2. Organic sway noise calculation
        let noiseT = (simTime * 0.001 * settings.swaySpeed);
        let xtilt = (0.5 - noise(this.d / 10, noiseT)) * settings.swayIntensity;
        let ztilt = (0.5 - noise(this.d / 10 + 100, noiseT)) * settings.swayIntensity;

        // 3. Stalk Segments (3-part hypha)
        if (settings.coloringMode === 'Original Grayscale' || settings.colorScheme === 'Original') {
          fill(255, 150);
          specularMaterial(255);
        } else {
          let stk = theme.stalk;
          fill(stk[0], stk[1], stk[2], stk[3] || 175);
          specularMaterial(200);
        }

        let stalkThick = max(0.15, settings.stalkThickness);
        for (let i = 0; i < 3; i++) {
          rotateX(this.ang.x + xtilt);
          rotateZ(this.ang.z + ztilt);
          translate(0, -this.len / 2, 0);
          cylinder(stalkThick, this.len, 8, 1);
          translate(0, -this.len / 2, 0);
        }

        // 4. Sporangium / Spore Head
        specularMaterial(40);
        if (settings.coloringMode === 'Original Grayscale' || settings.colorScheme === 'Original') {
          fill(this.f, this.f, this.f / 2);
        } else {
          // Modulate head color with the life-cycle ripening factor (this.f)
          let sph = theme.sporeHead;
          let headBright = map(this.f, 100, 220, 0.75, 1.35);
          fill(constrain(sph[0] * headBright, 0, 255),
               constrain(sph[1] * headBright, 0, 255),
               constrain(sph[2] * headBright, 0, 255));
        }
        noStroke();
        sphere((this.len / 10) * settings.headScale, 10, 8);
        pop();

        // 5. Growth Lifecycle Progression (factoring in dynamic animation speed)
        let dt = settings.animSpeed;
        if (simFrame > this.id && this.r < this.maxr) {
          this.r = min(this.maxr, this.r + this.rv * dt);
        }
        if (simFrame > 2 * this.id && this.len < this.maxlen) {
          this.len = min(this.maxlen, this.len + this.lv * dt);
        }
        if (this.len >= this.maxlen) {
          if (this.type === 0) {
            this.f = max(20, this.f * Math.pow(0.995, dt));
          } else if (this.type === 1) {
            this.f = min(320, this.f * Math.pow(1.005, dt));
          }
        }
      }
    }

    // ============================================================
    // p5.js Lifecycle: setup, draw, windowResized
    // ============================================================
    function setup() {
      let canvas = createCanvas(windowWidth, windowHeight, WEBGL);
      canvas.parent('canvas-container');
      pixelDensity(Math.min(window.devicePixelRatio || 1, 2));

      initLilGui();
      setupEventListeners();
      regenerateScene();
    }

    function draw() {
      const theme = COLOR_SCHEMES[settings.colorScheme] || COLOR_SCHEMES['Original'];
      background(theme.bg);

      // Smooth camera interpolation
      currentPanX += (targetPanX - currentPanX) * 0.14;
      currentPanY += (targetPanY - currentPanY) * 0.14;
      currentZoom += (targetZoom - currentZoom) * 0.14;
      currentRotX += (targetRotX - currentRotX) * 0.14;
      currentRotY += (targetRotY - currentRotY) * 0.14;

      // Subtle turntable auto-rotation
      if (settings.autoRotate && !isDragging) {
        targetRotY += 0.003 * settings.rotationSpeed * settings.animSpeed;
      }

      // Responsive base coordinate scaling factor
      const refDim = Math.min(width, height);
      const responsiveScale = refDim / 760;

      // 3D Scene Lighting
      if (theme.isDark) {
        ambientLight(80, 85, 95);
        pointLight(255, 255, 255, -600, -300, 450);
        // Bioluminescent accent rim illumination
        let acc = theme.sporeHead;
        pointLight(acc[0], acc[1], acc[2], 450, 200, 350);
        directionalLight(90, 100, 115, 0.5, 1, -0.5);
      } else {
        ambientLight(135, 135, 140);
        pointLight(220, 220, 225, -600, -300, 400);
        directionalLight(120, 120, 130, 0.5, 1, -0.5);
      }

      // Camera Matrix Transformation
      push();
      translate(currentPanX, currentPanY, 0);
      scale(currentZoom * responsiveScale);
      rotateX(currentRotX);
      rotateY(currentRotY);

      noStroke();

      // Render Spores
      for (let s of spores) {
        s.show(theme);
      }

      // Render Petri Dish (Glass Cylindrical Wall & Agar Culture Base)
      if (settings.showDish) {
        renderPetriDish(theme);
      }

      pop();

      // Simulation Time & Colony Bloom Spawning
      if (!settings.isPaused && settings.animSpeed > 0) {
        simFrame += settings.animSpeed;
        simTime += deltaTime * settings.animSpeed;

        if (simFrame >= settings.initialDelay) {
          let spawnCount = Math.round(settings.spawnRate * settings.animSpeed);
          for (let i = 0; i < spawnCount; i++) {
            if (spores.length < settings.maxnum) {
              let pos = p5.Vector.random2D().mult(r);
              let s = new Spore(pos, 1.25 * simFrame);
              spores.push(s);
              r += settings.radialExpansionRate;
            }
          }
        }
      }
    }

    // ============================================================
    // Petri Dish Glassware Rendering
    // ============================================================
    function renderPetriDish(theme) {
      const dishR = settings.dishRadius;
      const dishH = settings.dishHeight;
      const op = settings.dishOpacity;

      // 1. Agar Gel Substrate Layer
      if (settings.showAgarBase) {
        push();
        translate(0, 3, 0);
        let ag = theme.dishAgar;
        fill(ag[0], ag[1], ag[2], Math.min(255, (ag[3] || 60) * (op / 0.25)));
        specularMaterial(40);
        cylinder(dishR - 2, 4, 64, 1, true, true);
        pop();
      }

      // 2. Pyrex Glass Outer Cylindrical Wall
      push();
      translate(0, -dishH / 2 + 3, 0);
      let rm = theme.dishRim;
      fill(rm[0], rm[1], rm[2], Math.min(255, (rm[3] || 55) * (op / 0.25)));
      specularMaterial(255, 30);
      cylinder(dishR, dishH, 64, 1, false, false);
      pop();

      // 3. Molded Rim Lip (Glass Bead Edge)
      push();
      translate(0, -dishH + 3, 0);
      fill(rm[0], rm[1], rm[2], Math.min(255, (rm[3] || 70) * 1.4 * (op / 0.25)));
      specularMaterial(255, 60);
      cylinder(dishR + 3, 5, 64, 1, false, true);
      pop();
    }

    // ============================================================
    // Procedural Theme & Parameter Randomizer
    // ============================================================
    function randomizeAll(updateGui = true) {
      // 1. Pick a random color scheme from all 19 curated schemes
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      settings.colorScheme = random(schemeKeys);

      // 2. Randomize spore morphology and growth dynamics
      settings.swayIntensity = round(random(0.6, 2.0), 2);
      settings.swaySpeed = round(random(0.7, 1.8), 2);
      settings.stalkThickness = round(random(0.35, 0.8), 2);
      settings.headScale = round(random(0.8, 1.5), 2);
      settings.baseScale = round(random(0.7, 1.4), 2);
      settings.maxnum = floor(random(380, 720));
      settings.spawnRate = floor(random(3, 7));
      settings.radialExpansionRate = round(random(0.35, 0.65), 2);
      settings.animSpeed = round(random(0.85, 1.6), 2);
      settings.dishOpacity = round(random(0.15, 0.4), 2);

      // 3. Randomize subtle auto-rotation
      if (random() > 0.6) {
        settings.autoRotate = true;
        settings.rotationSpeed = round(random(0.3, 1.0) * (random() > 0.5 ? 1 : -1), 2);
      }

      // 4. Regenerate colony growth
      regenerateScene();

      // 5. Synchronize lil-gui controllers
      if (updateGui && gui) {
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      }
    }

    function regenerateScene() {
      spores = [];
      r = 0;
      simFrame = 0;
      simTime = 0;
    }

    function resetCamera() {
      targetPanX = 0;
      targetPanY = 0;
      targetZoom = 1.0;
      targetRotX = -Math.PI / 8;
      targetRotY = 0;
      settings.zoom = 1.0;
      settings.panX = 0;
      settings.panY = 0;
      settings.rotX = -Math.PI / 8;
      settings.rotY = 0;
      if (controllers.zoom) controllers.zoom.updateDisplay();
      if (controllers.panX) controllers.panX.updateDisplay();
      if (controllers.panY) controllers.panY.updateDisplay();
      if (controllers.rotX) controllers.rotX.updateDisplay();
      if (controllers.rotY) controllers.rotY.updateDisplay();
    }

    function saveArtwork() {
      const cleanTheme = settings.colorScheme.toLowerCase().replace(/[^a-z0-9]/g, '-');
      saveCanvas(`rise-of-molds-${cleanTheme}-${Date.now()}`, 'png');
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
    }

    // ============================================================
    // User Interaction: Wheel Zoom, Drag Object & Randomize Click
    // ============================================================
    function setupEventListeners() {
      const container = document.getElementById('canvas-container');

      // Wheel Zoom Interaction
      window.addEventListener('wheel', (e) => {
        if (e.target && e.target.closest && e.target.closest('.lil-gui')) return;
        e.preventDefault();

        const zoomDelta = e.deltaY < 0 ? 1.09 : 0.91;
        targetZoom = constrain(targetZoom * zoomDelta, 0.25, 6.0);
        settings.zoom = targetZoom;

        if (controllers.zoom) controllers.zoom.updateDisplay();
      }, { passive: false });

      // Pointer Down
      window.addEventListener('pointerdown', (e) => {
        if (e.target && e.target.closest && e.target.closest('.lil-gui')) return;

        isPointerDown = true;
        isDragging = false;
        pointerStartX = e.clientX;
        pointerStartY = e.clientY;
        lastPointerX = e.clientX;
        lastPointerY = e.clientY;
        pointerStartTime = performance.now();

        // Determine drag action based on primary preference or modifier keys
        let isOrbitModifier = (e.button === 2) || e.shiftKey || e.altKey;
        if (settings.primaryDrag === 'Pan (Drag across screen)') {
          activeDragAction = isOrbitModifier ? 'orbit' : 'pan';
        } else {
          activeDragAction = isOrbitModifier ? 'pan' : 'orbit';
        }
      });

      // Pointer Move
      window.addEventListener('pointermove', (e) => {
        if (!isPointerDown) return;

        const dx = e.clientX - lastPointerX;
        const dy = e.clientY - lastPointerY;
        lastPointerX = e.clientX;
        lastPointerY = e.clientY;

        const totalDist = Math.hypot(e.clientX - pointerStartX, e.clientY - pointerStartY);
        if (totalDist > 5) {
          isDragging = true;
          document.body.classList.add('grabbing');
        }

        if (isDragging) {
          if (activeDragAction === 'pan') {
            // Drag object across the screen
            targetPanX += dx * 1.1;
            targetPanY += dy * 1.1;
            settings.panX = targetPanX;
            settings.panY = targetPanY;
            if (controllers.panX) controllers.panX.updateDisplay();
            if (controllers.panY) controllers.panY.updateDisplay();
          } else {
            // 3D Orbit camera rotation
            targetRotY += dx * 0.007;
            targetRotX -= dy * 0.007;
            targetRotX = constrain(targetRotX, -Math.PI * 0.48, Math.PI * 0.48);
            settings.rotX = targetRotX;
            settings.rotY = targetRotY;
            if (controllers.rotX) controllers.rotX.updateDisplay();
            if (controllers.rotY) controllers.rotY.updateDisplay();
          }
        }
      });

      // Pointer Up
      window.addEventListener('pointerup', (e) => {
        if (e.target && e.target.closest && e.target.closest('.lil-gui')) {
          isPointerDown = false;
          return;
        }

        const totalDist = Math.hypot(e.clientX - pointerStartX, e.clientY - pointerStartY);
        const timeDiff = performance.now() - pointerStartTime;

        document.body.classList.remove('grabbing');

        // Pure click detection (quick tap without drag)
        if (!isDragging && totalDist < 6 && timeDiff < 450) {
          if (settings.clickToRandomize) {
            randomizeAll(true);
          } else {
            regenerateScene();
          }
        }

        isPointerDown = false;
        isDragging = false;
      });

      // Prevent context menu on right click to allow effortless secondary drag
      window.addEventListener('contextmenu', (e) => {
        if (!e.target.closest('.lil-gui')) {
          e.preventDefault();
        }
      });

      // Keyboard Shortcuts
      window.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;

        if (e.code === 'Space' || e.key === ' ') {
          e.preventDefault();
          randomizeAll(true);
        } else if (e.key === 'r' || e.key === 'R') {
          e.preventDefault();
          regenerateScene();
        } else if (e.key === 'c' || e.key === 'C') {
          e.preventDefault();
          resetCamera();
        } else if (e.key === 'p' || e.key === 'P') {
          e.preventDefault();
          settings.isPaused = !settings.isPaused;
          if (controllers.isPaused) controllers.isPaused.updateDisplay();
        } else if (e.key === 's' || e.key === 'S') {
          e.preventDefault();
          saveArtwork();
        }
      });
    }

    // ============================================================
    // lil-gui Modern Parameter Control Panel
    // ============================================================
    function initLilGui() {
      gui = new lil.GUI({ title: 'The Rise of Molds' });

      // 1. Palette & Color Harmony Folder
      const fPalette = gui.addFolder('Palette & Harmony');
      fPalette.add(settings, 'colorScheme', Object.keys(COLOR_SCHEMES))
        .name('Theme')
        .onChange(() => {
          let theme = COLOR_SCHEMES[settings.colorScheme];
          if (theme) document.body.style.backgroundColor = theme.bg;
        });

      fPalette.add(settings, 'coloringMode', ['Harmonious Palette', 'Original Grayscale'])
        .name('Coloring Mode');

      // 2. Animation Dynamics Folder
      const fAnim = gui.addFolder('Animation Dynamics');
      fAnim.add(settings, 'animSpeed', 0.0, 4.0, 0.05).name('Speed');
      controllers.isPaused = fAnim.add(settings, 'isPaused').name('Pause');
      fAnim.add(settings, 'swayIntensity', 0.0, 3.0, 0.05).name('Sway Intensity');
      fAnim.add(settings, 'swaySpeed', 0.2, 3.0, 0.05).name('Sway Speed');
      fAnim.add(settings, 'autoRotate').name('Auto Turntable');
      fAnim.add(settings, 'rotationSpeed', -2.0, 2.0, 0.05).name('Turntable Speed');

      // 3. Colony & Spores Morphology Folder
      const fColony = gui.addFolder('Colony Morphology');
      fColony.add(settings, 'maxnum', 100, 1200, 10).name('Max Spores');
      fColony.add(settings, 'spawnRate', 1, 10, 1).name('Spawn Rate');
      fColony.add(settings, 'radialExpansionRate', 0.1, 1.2, 0.02).name('Expansion Speed');
      fColony.add(settings, 'initialDelay', 0, 180, 5).name('Germination Delay');
      fColony.add(settings, 'stalkThickness', 0.2, 2.0, 0.05).name('Stalk Thickness');
      fColony.add(settings, 'headScale', 0.4, 2.5, 0.05).name('Head Size');
      fColony.add(settings, 'baseScale', 0.4, 2.5, 0.05).name('Base Size');

      // 4. Petri Dish Geometry Folder
      const fDish = gui.addFolder('Petri Dish');
      fDish.add(settings, 'showDish').name('Show Dish');
      fDish.add(settings, 'dishRadius', 200, 450, 5).name('Radius');
      fDish.add(settings, 'dishHeight', 20, 100, 2).name('Height');
      fDish.add(settings, 'dishOpacity', 0.05, 0.8, 0.02).name('Glass Opacity');
      fDish.add(settings, 'showAgarBase').name('Show Agar Gel');

      // 5. Camera & Viewport Navigation Folder
      const fCamera = gui.addFolder('Camera & Viewport');
      fCamera.add(settings, 'primaryDrag', ['Pan (Drag across screen)', 'Orbit (Rotate 3D)']).name('Left Drag');
      controllers.zoom = fCamera.add(settings, 'zoom', 0.25, 6.0, 0.01).name('Zoom')
        .onChange(v => { targetZoom = v; });
      controllers.panX = fCamera.add(settings, 'panX', -800, 800, 1).name('Pan X')
        .onChange(v => { targetPanX = v; });
      controllers.panY = fCamera.add(settings, 'panY', -800, 800, 1).name('Pan Y')
        .onChange(v => { targetPanY = v; });
      controllers.rotX = fCamera.add(settings, 'rotX', -Math.PI * 0.48, Math.PI * 0.48, 0.01).name('Tilt Pitch')
        .onChange(v => { targetRotX = v; });
      controllers.rotY = fCamera.add(settings, 'rotY', -Math.PI, Math.PI, 0.01).name('Orbit Yaw')
        .onChange(v => { targetRotY = v; });
      fCamera.add(settings, 'clickToRandomize').name('Click to Randomize');
      fCamera.add(settings, 'resetView').name('Reset Camera');

      // 6. Actions Folder
      const fActions = gui.addFolder('Actions');
      fActions.add(settings, 'regenerate').name('↺ Replay Growth');
      fActions.add(settings, 'randomize').name('🎲 Randomize Scene');
      fActions.add(settings, 'exportPNG').name('📸 Save PNG');

      // Start with folders neatly organized
      fColony.close();
      fDish.close();
      fCamera.close();
    }
  </script>
