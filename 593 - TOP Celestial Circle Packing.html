  <style>
    /* ============================================================
       CSS Reset & Viewport UX
       ============================================================ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d0f12;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "JetBrains Mono", monospace;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #canvas-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      transition: width 0.3s ease, height 0.3s ease;
    }

    /* Boxed Aspect Ratio Framed Shadow */
    #canvas-container.boxed {
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }

    canvas {
      display: block;
      outline: none;
      cursor: crosshair;
    }

    /* ============================================================
       Glassmorphic Heads-Up Display (HUD)
       ============================================================ */
    #hud {
      position: fixed;
      bottom: 24px;
      left: 24px;
      z-index: 900;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: rgba(13, 15, 18, 0.72);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-left: 3px solid #ff0055;
      padding: 14px 18px;
      border-radius: 6px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.5);
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #hud.hidden {
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
    }

    .hud-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hud-title {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 2px;

    }

    .hud-badge {
      font-size: 9.5px;

      background: rgba(0, 229, 255, 0.18);
      color: #00e5ff;

      letter-spacing: 0.5px;

    .hud-meta span {

    }

    .hud-shortcuts {
      font-size: 9.5px;

    }

    .hud-shortcuts kbd {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      padding: 1px 4px;
      color: #eee;

    /* ============================================================
       Notification Toast Banner
       ============================================================ */
    #toast {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(-70px);
      z-index: 9999;
      pointer-events: none;
      background: rgba(16, 18, 22, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.18);

      padding: 10px 22px;

      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.65), 0 0 20px rgba(0, 229, 255, 0.2);
      display: flex;

  <!-- Hidden Image File Input -->

  <script>
    /*
    ========================================================================
    ORIGINAL ALGORITHM PRESERVATION & COMMENTS:
    2026/06/02 randomCrop() fix.
    When fetching images, `image()` is faster than `get()`!

    Artistic Circle Packing with Morphing Star Geometry, Dynamic Rotation,
    Clipped Synthetic/Custom Imagery, Noise Stippling, & Gaussian Dust Overlays.
    ========================================================================
    */

    // ----------------------------------------------------------------------
    // 19 Curated Color Schemes + Original 8 Palettes
    // ----------------------------------------------------------------------
    const COLOR_SCHEMES = {
      'Original 8 (Japanese Lacquer)': {
        background: '#f4f1de',
        colors: ["#F9F9F1", "#191A18", "#E15521", "#3391CF", "#E4901C", "#F5B2B1", "#009472"],
        accent: "#E15521"
      },
      'Original 1 (Indigo / Mint / Coral)': {
        background: '#131526',
        colors: ["#3c4cad", "#5FB49C", "#e8a49c", "#ffffff", "#21284a"],
        accent: "#5FB49C"
      },
      'Original 2 (Navy / Vermillion / Ivory)': {
        background: '#0d1829',
        colors: ["#1c3560", "#ff6343", "#f2efdb", "#fea985", "#3a6096"],
        accent: "#ff6343"
      },
      'Original 3 (Earth & Mineral Ochre)': {
        background: '#f1ede4',
        colors: ["#e0d7c5", "#488a50", "#b59a55", "#bf5513", "#3b6fb6", "#4f3224", "#9a7f6e"],
        accent: "#bf5513"
      },
      'Original 4 (Pistachio & Coral)': {
        background: '#1b2622',
        colors: ["#DEEFB7", "#5FB49C", "#ed6a5a", "#ffffff", "#2c4038"],
        accent: "#ed6a5a"
      },
      'Original 5 (Blueprint Twilight)': {
        background: '#141724',
        colors: ["#2B2B2B", "#91B3E1", "#2F5FB3", "#3D4B89", "#AE99E8", "#DBE2EC"],
        accent: "#AE99E8"
      },
      'Original 6 (Retro Rainbow Pop)': {
        background: '#121217',
        colors: ["#ffbe0b", "#fb5607", "#ff006e", "#8338ec", "#3a86ff"],
        accent: "#ff006e"
      },
      'Original 7 (Olive & Sky Blue)': {
        background: '#1e241c',
        colors: ["#A8C25D", "#5B7243", "#FFA088", "#FFFB42", "#a9cff0", "#2D6EA6"],
        accent: "#FFFB42"
      },
      'Monochromatic (Cobalt Sapphire)': {
        background: '#060e18',
        colors: ['#e0f2fe', '#bae6fd', '#38bdf8', '#0284c7', '#0369a1', '#082f49'],
        accent: '#38bdf8'
      },
      'Analogous (Sunset Amber Fire)': {
        background: '#140805',
        colors: ['#ffbe0b', '#fb8500', '#d62828', '#9d0208', '#370617', '#ff5400'],
        accent: '#fb8500'
      },
      'Complementary (Teal & Tangerine)': {
        background: '#071319',
        colors: ['#ff9f1c', '#ffbf69', '#2ec4b6', '#cbf3f0', '#011627', '#e71d36'],
        accent: '#2ec4b6'
      },
      'Split-Complementary (Emerald Watermelon)': {
        background: '#0c1417',
        colors: ['#06d6a0', '#118ab2', '#ffd166', '#ef476f', '#073b4c', '#f78c6b'],
        accent: '#ef476f'
      },
      'Triadic (Cyberpunk Magenta / Cyan)': {
        background: '#11071c',
        colors: ['#f72585', '#7209b7', '#4cc9f0', '#4361ee', '#ffb703', '#ffffff'],
        accent: '#4cc9f0'
      },
      'Tetradic (Prism Spectrum)': {
        background: '#090e14',
        colors: ['#ff5964', '#fec601', '#35ff69', '#05b292', '#38b6ff'],
        accent: '#ff5964'
      },
      'Double Split (Neon Matrix)': {
        background: '#080812',
        colors: ['#ff0054', '#ff5400', '#ffbd00', '#00f5d4', '#7b2cbf'],
        accent: '#00f5d4'
      },
      'Achromatic (High-Contrast B&W)': {
        background: '#0a0a0a',
        colors: ['#ffffff', '#e0e0e0', '#aaaaaa', '#666666', '#222222'],
        accent: '#ffffff',
        invertBg: '#ffffff',
        invertColors: ['#000000', '#222222', '#666666', '#aaaaaa', '#eeeeee']
      },
      'Achromatic + Accent (Crimson Ink)': {
        background: '#0a0a0c',
        colors: ['#ffffff', '#cccccc', '#777777', '#ff0033', '#aa0022'],
        accent: '#ff0033',
        invertBg: '#f6f6f6',
        invertColors: ['#111111', '#444444', '#999999', '#ff0033', '#88001a']
      },
      'Neutral + Accent (Slate & Solar Gold)': {
        background: '#18181b',
        colors: ['#fafafa', '#d4d4d8', '#a1a1aa', '#71717a', '#3f3f46', '#ffb703'],
        accent: '#ffb703'
      },
      'Vaporwave Dreams': {
        background: '#160a2b',
        colors: ['#ff71ce', '#01cdfe', '#05ffa1', '#b967ff', '#fffb96', '#ffffff'],
        accent: '#01cdfe'
      },
      'Matcha & Sakura': {
        background: '#1a1f18',
        colors: ['#5b7050', '#88a076', '#f6c1cc', '#e28f9d', '#fdf3f4', '#2d3827'],
        accent: '#f6c1cc'
      },
      'Deep Oceanic Abyss': {
        background: '#020d18',
        colors: ['#00f2fe', '#4facfe', '#004e92', '#000428', '#64ffda', '#1de9b6'],
        accent: '#64ffda'
      }
    };

    // ----------------------------------------------------------------------
    // Global State & Parameters
    // ----------------------------------------------------------------------
    const params = {
      // Color & Theme
      scheme: 'Original 8 (Japanese Lacquer)',
      backgroundColor: '#f4f1de',
      customBg: false,
      greenScreen: false,
      invertTheme: false,

      // Geometry & Circle Packing
      count: 1000,
      minRadius: 15,
      maxRadius: 200,
      spacingFactor: 0.6,
      minVertices: 3,
      maxVertices: 12,
      minDepth: 0.1,
      maxDepth: 0.95,
      strokeEnabled: true,
      strokeWeight: 1.5,
      strokeColorMode: 'Palette Contrast',

      // Motion & Dynamics
      vel: 0.5,
      rotationMode: 'Random Bi-directional',
      pulsingScale: false,
      isPaused: false,

      // Texture & Clipping Engine
      textureStyle: 'Cosmic Flow',
      blendMode: 'OVERLAY',
      textureRes: 1600,
      highlightRings: true,

      // Paper & Grain Overlays
      grainEnabled: true,
      grainDensity: 0.45,
      grainNoiseScale: 0.01,
      dustParticlesEnabled: true,
      dustCount: 1000,
      dustSpread: 0.3,

      // Randomization & Viewport UX
      clickRandomize: true,
      mouseInfluence: true,
      aspectRatio: 'Fullscreen',
      seed: 42891
    };

    // p5.js instance variables
    let num;
    let cs;
    let paletteSelected;
    let img;          // p5.Graphics or p5.Image for star clipping
    let pg;           // Fine noise stipple paper grain
    let pg2;          // Gaussian stardust cluster
    let t = 0.0;
    let packedStars = [];
    let isCustomUserImage = false;
    let mainCanvas = null;

    // Interaction tracking
    let pointerDownTime = 0;
    let pointerDownX = 0;
    let pointerDownY = 0;
    let lastFrameTime = performance.now();
    let frameCounter = 0;
    let currentFps = 60;
    let toastTimeout = null;

    // lil-gui instance reference
    let gui = null;

    // ----------------------------------------------------------------------
    // Color Helpers
    // ----------------------------------------------------------------------
    function getActivePalette() {
      const s = COLOR_SCHEMES[params.scheme];
      if (!s) return COLOR_SCHEMES['Original 8 (Japanese Lacquer)'].colors;
      if (params.invertTheme && s.invertColors) return s.invertColors;
      return s.colors;
    }

    function getEffectiveBgColor() {
      if (params.greenScreen) return '#00ff00';
      if (params.customBg) return params.backgroundColor;
      const s = COLOR_SCHEMES[params.scheme];
      if (!s) return '#f4f1de';
      if (params.invertTheme && s.invertBg) return s.invertBg;
      return s.background;
    }

    function randomColFromPalette() {
      const pal = getActivePalette();
      return random(pal);
    }

    // ----------------------------------------------------------------------
    // Helper: Global Composite Operation (Robust Blend Modes across browsers)
    // ----------------------------------------------------------------------
    function applyBlendMode(modeStr) {
      const map = {
        'OVERLAY': 'overlay',
        'HARD_LIGHT': 'hard-light',
        'MULTIPLY': 'multiply',
        'SCREEN': 'screen',
        'DIFFERENCE': 'difference',
        'SOFT_LIGHT': 'soft-light',
        'NORMAL': 'source-over'
      };
      const op = map[modeStr] || 'overlay';
      drawingContext.globalCompositeOperation = op;
    }

    function resetBlendMode() {
      drawingContext.globalCompositeOperation = 'source-over';
    }

    // ----------------------------------------------------------------------
    // Procedural High-Res Texture Synthesizer (Generates `img`)
    // ----------------------------------------------------------------------
    function generateSyntheticTexture() {
      if (isCustomUserImage && img) {
        // User loaded their own image, preserve it unless explicitly overwritten
        return;
      }

      const res = params.textureRes;
      const g = createGraphics(res, res);
      g.colorMode(RGB, 255);
      g.angleMode(DEGREES);
      randomSeed(params.seed + 777);
      noiseSeed(params.seed + 333);

      const pal = getActivePalette();
      const bg = getEffectiveBgColor();

      // Base fill
      g.background(bg);

      const style = params.textureStyle;

      if (style === 'Cosmic Flow') {
        // Rich fluid domain-warped noise with glowing ribbons
        g.noFill();
        const bands = 140;
        for (let i = 0; i < bands; i++) {
          const c = color(random(pal));
          c.setAlpha(random(120, 220));
          g.stroke(c);
          g.strokeWeight(random(4, 24));
          g.beginShape();
          let yBase = (res / bands) * i;
          for (let x = 0; x <= res; x += 15) {
            let n = noise(x * 0.002, yBase * 0.002, i * 0.01);
            let n2 = noise(x * 0.005 + n, yBase * 0.005 - n);
            let y = yBase + (n2 - 0.5) * (res * 0.45);
            g.vertex(x, y);
          }
          g.endShape();
        }

        // Nebular glowing centers
        g.noStroke();
        for (let k = 0; k < 60; k++) {
          const c = color(random(pal));
          c.setAlpha(random(30, 90));
          g.fill(c);
          const cx = random(res);
          const cy = random(res);
          const cr = random(res * 0.1, res * 0.35);
          g.ellipse(cx, cy, cr, cr);
        }

      } else if (style === 'Chromatic Waves') {
        // Hypnotic layered harmonic sine waves with iridescent gradient ribbons
        g.noFill();
        const count = 180;
        for (let i = 0; i < count; i++) {
          const col = color(random(pal));
          col.setAlpha(random(140, 240));
          g.stroke(col);
          g.strokeWeight(random(3, 16));
          g.beginShape();
          const freq = random(0.002, 0.008);
          const amp = random(res * 0.08, res * 0.28);
          const yOff = (res / count) * i;
          for (let x = -50; x <= res + 50; x += 15) {
            const y = yOff + sin(x * freq * 180) * amp + cos((x + yOff) * 0.004 * 180) * (amp * 0.5);
            g.vertex(x, y);
          }
          g.endShape();
        }

      } else if (style === 'Bauhaus Geometric') {
        // Modernist constructivist patterns: bold blocks, concentric arcs, stripes
        g.noStroke();
        for (let i = 0; i < 40; i++) {
          g.fill(random(pal));
          const w = random(res * 0.1, res * 0.5);
          const h = random(res * 0.1, res * 0.5);
          g.rect(random(res), random(res), w, h);
        }

        // Diagonal stripes
        g.strokeWeight(random(10, 30));
        for (let j = 0; j < 50; j++) {
          const c = color(random(pal));
          c.setAlpha(200);
          g.stroke(c);
          const p1 = random(-res * 0.5, res * 1.5);
          g.line(p1, 0, p1 + res, res);
        }

        // Concentric geometric target discs
        g.noFill();
        for (let k = 0; k < 12; k++) {
          const cx = random(res);
          const cy = random(res);
          const maxR = random(res * 0.15, res * 0.45);
          const rings = floor(random(4, 10));
          for (let r = 1; r <= rings; r++) {
            g.stroke(random(pal));
            g.strokeWeight(random(4, 14));
            g.ellipse(cx, cy, (maxR / rings) * r * 2, (maxR / rings) * r * 2);
          }
        }

      } else if (style === 'Fluid Marbling') {
        // Organic marble fluid swirls (Ebru style)
        g.noFill();
        const rings = 120;
        for (let i = 0; i < rings; i++) {
          const c = color(random(pal));
          c.setAlpha(random(130, 220));
          g.stroke(c);
          g.strokeWeight(random(4, 18));
          const cx = random(res * 0.2, res * 0.8);
          const cy = random(res * 0.2, res * 0.8);
          const rBase = random(res * 0.05, res * 0.4);
          g.beginShape();
          for (let a = 0; a <= 360; a += 5) {
            let n = noise(cos(a) + 1, sin(a) + 1, i * 0.05);
            let r = rBase + (n - 0.5) * (rBase * 0.8);
            let x = cx + cos(a) * r;
            let y = cy + sin(a) * r;
            g.vertex(x, y);
          }
          g.endShape(CLOSE);
        }

      } else if (style === 'Cyber Matrix') {
        // High-tech orthogonal circuit traces & luminous nodes
        g.strokeWeight(random(2, 6));
        for (let i = 0; i < 90; i++) {
          const c = color(random(pal));
          c.setAlpha(random(160, 240));
          g.stroke(c);
          let cx = floor(random(20)) * (res / 20);
          let cy = floor(random(20)) * (res / 20);
          let len = floor(random(3, 10)) * (res / 20);
          let dir = random(['h', 'v']);
          if (dir === 'h') {
            g.line(cx, cy, cx + len, cy);
            g.noStroke();
            g.fill(random(pal));
            g.ellipse(cx + len, cy, 14, 14);
          } else {
            g.line(cx, cy, cx, cy + len);
            g.noStroke();
            g.fill(random(pal));
            g.ellipse(cx, cy + len, 14, 14);
          }
        }

      } else if (style === 'Watercolor Splatter') {
        // Translucent watercolor stains with bleeding pigment rims
        g.noStroke();
        for (let i = 0; i < 110; i++) {
          const c = color(random(pal));
          c.setAlpha(random(25, 75));
          g.fill(c);
          const cx = random(res);
          const cy = random(res);
          const cr = random(res * 0.06, res * 0.28);
          g.ellipse(cx, cy, cr, cr);

          // Darker pigment rim
          c.setAlpha(random(80, 160));
          g.stroke(c);
          g.strokeWeight(random(1.5, 3.5));
          g.noFill();
          g.ellipse(cx, cy, cr * 0.98, cr * 0.98);
          g.noStroke();
        }
      }

      img = g;
    }

    // ----------------------------------------------------------------------
    // Stippling Noise Grain & Gaussian Stardust Buffers (`pg` & `pg2`)
    // ----------------------------------------------------------------------
    function generateOverlays() {
      // 1. pg: Procedural Fine Paper Stipple Noise Grain
      if (params.grainEnabled) {
        pg = createGraphics(width, height);
        pg.noStroke();
        randomSeed(params.seed);
        noiseSeed(params.seed);

        // Optimized particle count based on screen area & density slider
        const baseArea = width * height;
        const particleCount = floor(baseArea * 0.035 * params.grainDensity);
        const noiseScale = params.grainNoiseScale;
        const dotScale = (width + height) * 0.001;

        pg.fill(255, 120);
        for (let i = 0; i < particleCount; i++) {
          const x = random(width);
          const y = random(height);
          const n = noise(x * noiseScale, y * noiseScale) * dotScale;
          if (n > 0.25) {
            pg.rect(x - n * 0.5, y - n * 0.5, n, n);
          }
        }
      } else {
        pg = null;
      }

      // 2. pg2: 1000 Gaussian Distributed Palette Particles Centered
      if (params.dustParticlesEnabled && params.dustCount > 0) {
        pg2 = createGraphics(width, height);
        pg2.noStroke();
        randomSeed(params.seed + 101);

        const pal = getActivePalette();
        const spreadW = width * params.dustSpread;
        const spreadH = height * params.dustSpread;
        const count = params.dustCount;

        for (let j = 0; j < count; j++) {
          pg2.fill(random(pal));
          const px = randomGaussian(width * 0.5, spreadW);
          const py = randomGaussian(height * 0.5, spreadH);
          const isLarge = random() >= 0.9;
          const sz = isLarge ? width * random(0.004, 0.007) : width * random(0.001, 0.003);
          pg2.ellipse(px, py, sz, sz);
        }
      } else {
        pg2 = null;
      }
    }

    // ----------------------------------------------------------------------
    // Circle Packing Engine with Precomputed Star Geometry
    // ----------------------------------------------------------------------
    function rebuildStarPacking() {
      randomSeed(params.seed);
      noiseSeed(params.seed);

      packedStars = [];
      const points = [];
      const count = params.count;
      const minR = params.minRadius;
      const maxR = params.maxRadius;
      const spacing = params.spacingFactor;
      const pal = getActivePalette();

      // Ensure img texture exists
      if (!img) {
        generateSyntheticTexture();
      }

      // 1. Circle Packing Loop
      for (let i = 0; i < count; i++) {
        const s = random(minR, maxR);
        const x = random(width);
        const y = random(height);
        let canAdd = true;

        for (let j = 0; j < points.length; j++) {
          const p = points[j];
          if (dist(x, y, p.x, p.y) < (s + p.z) * spacing) {
            canAdd = false;
            break;
          }
        }

        if (canAdd) {
          points.push(createVector(x, y, s));
        }
      }

      // 2. Precompute star polygon geometry and texture crop regions
      for (let i = 0; i < points.length; i++) {
        const p = points[i];
        const s = p.z;
        const r = max(4, s - 5);
        const ran = random([-1, 1]);
        const rotOffset = random(0.85, 1.15);
        const verticesNums = floor(random(params.minVertices, params.maxVertices + 1));
        const depth = map(random(), 0, 1, params.minDepth, params.maxDepth);

        // Palette color assignments
        const fillCol = random(pal);
        let strokeCol = random(pal);
        if (strokeCol === fillCol && pal.length > 1) {
          strokeCol = pal[(pal.indexOf(fillCol) + 1) % pal.length];
        }

        // Safe Crop bounds inside img texture
        const cropW = r * 2;
        const cropH = r * 2;
        const maxCropX = max(1, img.width - cropW);
        const maxCropY = max(1, img.height - cropH);
        const cropX = random(0, maxCropX);
        const cropY = random(0, maxCropY);

        packedStars.push({
          x: p.x,
          y: p.y,
          s: s,
          r: r,
          ran: ran,
          rotOffset: rotOffset,
          verticesNums: verticesNums,
          depth: depth,
          fillCol: fillCol,
          strokeCol: strokeCol,
          cropX: cropX,
          cropY: cropY,
          cropW: cropW,
          cropH: cropH,
          phase: random(0, 360)
        });
      }

      // Update HUD metadata count
      const countEl = document.getElementById('hud-count');
      if (countEl) countEl.innerText = packedStars.length;
    }

    // ----------------------------------------------------------------------
    // Star Path Generator (Used for Drawing & HTML5 Canvas Clipping)
    // ----------------------------------------------------------------------
    function renderStarPolygon(ctx, x, y, radiusOuter, radiusInner, verticesNums) {
      ctx.beginPath();
      const angle = 360 / verticesNums;
      for (let i = 0; i < 360; i += angle) {
        const rad1 = i * (Math.PI / 180);
        const ex1 = x + radiusOuter * Math.cos(rad1);
        const ey1 = y + radiusOuter * Math.sin(rad1);
        if (i === 0) ctx.moveTo(ex1, ey1);
        else ctx.lineTo(ex1, ey1);

        const rad2 = (i + angle * 0.5) * (Math.PI / 180);
        const ex2 = x + radiusInner * Math.cos(rad2);
        const ey2 = y + radiusInner * Math.sin(rad2);
        ctx.lineTo(ex2, ey2);
      }
      ctx.closePath();
    }

    // ----------------------------------------------------------------------
    // Texture Cropper (Preserves input code's fast `image()` crop logic)
    // ----------------------------------------------------------------------
    function drawClippedCrop(x, y, w, star) {
      if (!img) return;
      push();
      translate(x, y);

      const srcW = min(star.cropW, img.width - star.cropX);
      const srcH = min(star.cropH, img.height - star.cropY);

      // Fast image blit using source and destination sub-rectangles
      image(img, 0, 0, w, w, star.cropX, star.cropY, srcW, srcH);
      pop();
    }

    // ----------------------------------------------------------------------
    // p5.js Core Lifecycle: setup()
    // ----------------------------------------------------------------------
    function setup() {
      // Calculate responsive dimensions based on aspect ratio setting
      updateCanvasDimensions();

      rectMode(CENTER);
      angleMode(DEGREES);

      // Initialize seed and parameters
      num = params.seed;
      paletteSelected = COLOR_SCHEMES[params.scheme].colors;

      // 1. Generate procedural clipping texture
      generateSyntheticTexture();

      // 2. Build Circle Packing and precalculate stars
      rebuildStarPacking();

      // 3. Build Noise Stipple & Gaussian overlays
      generateOverlays();

      // Initialize lil-gui and drag-drop handlers
      initGUI();
      initDragAndDrop();
      updateHUD();
    }

    // ----------------------------------------------------------------------
    // Responsive Canvas Resizing & Aspect Ratio Control
    // ----------------------------------------------------------------------
    function updateCanvasDimensions() {
      const container = document.getElementById('canvas-container');
      const ratio = params.aspectRatio;

      let w = windowWidth;
      let h = windowHeight;

      if (ratio === 'Fullscreen') {
        w = windowWidth;
        h = windowHeight;
        if (container) container.classList.remove('boxed');
      } else {
        if (container) container.classList.add('boxed');
        let targetAspect = 1.0;
        if (ratio === '1:1 Square') targetAspect = 1.0;
        else if (ratio === '4:5 Poster') targetAspect = 4 / 5;
        else if (ratio === '16:9 Cinema') targetAspect = 16 / 9;

        const maxW = windowWidth * 0.94;
        const maxH = windowHeight * 0.94;

        if (maxW / maxH > targetAspect) {
          h = maxH;
          w = h * targetAspect;
        } else {
          w = maxW;
          h = w / targetAspect;
        }
      }

      cs = min(w, h);

      if (!mainCanvas) {
        mainCanvas = createCanvas(w, h);
        mainCanvas.parent('canvas-container');
      } else {
        resizeCanvas(w, h);
      }
    }

    function windowResized() {
      updateCanvasDimensions();
      rebuildStarPacking();
      generateOverlays();
    }

    // ----------------------------------------------------------------------
    // p5.js Core Lifecycle: draw()
    // ----------------------------------------------------------------------
    function draw() {
      // 1. Clear background
      background(getEffectiveBgColor());

      // 2. Time progression
      if (!params.isPaused) {
        t += params.vel;
      }

      // 3. Interactive Mouse Drift calculation
      let mouseRotOffset = 0;
      if (params.mouseInfluence && mouseIsPressed) {
        mouseRotOffset = (mouseX - width * 0.5) * 0.05;
      }

      const ctx = drawingContext;
      const bMode = params.blendMode;

      // 4. Render All Precomputed Packed Stars with Clipped Image Overlay
      for (let i = 0; i < packedStars.length; i++) {
        const p = packedStars[i];

        push();
        translate(p.x, p.y);

        // Rotation calculation based on selected mode
        let currentAngle = 0;
        if (params.rotationMode === 'Random Bi-directional') {
          currentAngle = p.ran * (t * 0.5 * p.rotOffset) + mouseRotOffset;
        } else if (params.rotationMode === 'All Clockwise') {
          currentAngle = (t * 0.5 * p.rotOffset) + mouseRotOffset;
        } else if (params.rotationMode === 'All Counter-Clockwise') {
          currentAngle = -(t * 0.5 * p.rotOffset) + mouseRotOffset;
        } else if (params.rotationMode === 'Alternating') {
          currentAngle = (i % 2 === 0 ? 1 : -1) * (t * 0.5 * p.rotOffset) + mouseRotOffset;
        } else if (params.rotationMode === 'Harmonic') {
          currentAngle = sin(t * 0.8 + p.phase) * 60 + p.ran * (t * 0.2);
        }

        rotate(currentAngle);

        // Dynamic breathing scale if enabled
        let rOuter = p.r;
        if (params.pulsingScale) {
          rOuter *= 1 + 0.08 * sin(t * 1.5 + p.phase);
        }
        const rInner = rOuter * p.depth;

        // Step A: Base solid star fill
        fill(p.fillCol);
        if (params.strokeEnabled) {
          stroke(p.strokeCol);
          strokeWeight(params.strokeWeight);
        } else {
          noStroke();
        }

        renderStarPolygon(ctx, 0, 0, rOuter, rInner, p.verticesNums);
        ctx.fill();
        if (params.strokeEnabled) ctx.stroke();

        // Step B: Clip to star geometry & draw overlay texture
        ctx.save(); // Save canvas clipping state
        renderStarPolygon(ctx, 0, 0, rOuter, rInner, p.verticesNums);
        ctx.clip(); // Restrict subsequent drawing to this star

        applyBlendMode(params.blendMode);
        drawClippedCrop(-rOuter, -rOuter, rOuter * 2, p);
        ctx.restore(); // Restore clip context
        resetBlendMode();

        // Step C: Optional star highlight ring / overlay accent
        if (params.highlightRings) {
          applyBlendMode('OVERLAY');
          noFill();
          stroke(255, 70);
          strokeWeight(1.2);
          renderStarPolygon(ctx, 0, 0, rOuter, rInner, p.verticesNums);
          ctx.stroke();
          resetBlendMode();
        }

        pop();
      }

      // Reset blend mode back to normal
      resetBlendMode();

      // 5. Draw Gaussian Stardust Cluster Overlay (`pg2`)
      if (pg2) {
        image(pg2, 0, 0);
      }

      // 6. Draw Noise Stipple Grain Dust Paper Texture (`pg`)
      if (pg) {
        image(pg, 0, 0);
      }

      // 7. FPS counter calculation
      frameCounter++;
      const now = performance.now();
      if (now - lastFrameTime >= 500) {
        currentFps = Math.round((frameCounter * 1000) / (now - lastFrameTime));
        frameCounter = 0;
        lastFrameTime = now;
        const fpsEl = document.getElementById('hud-fps');
        if (fpsEl) fpsEl.innerText = `${currentFps} FPS`;
      }
    }

    // ----------------------------------------------------------------------
    // Randomization Engine (Requirement 6: Instant Procedural Variation)
    // ----------------------------------------------------------------------
    function randomizeScene() {
      // 1. Pick a random color scheme from COLOR_SCHEMES
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      params.scheme = random(schemeKeys);
      params.backgroundColor = COLOR_SCHEMES[params.scheme].background;

      // 2. Generate new procedural seed
      params.seed = floor(random(10000, 999999));
      num = params.seed;

      // 3. Randomize geometric packing & motion parameters
      params.count = floor(random(600, 1500));
      params.minRadius = floor(random(10, 25));
      params.maxRadius = floor(random(130, 240));
      params.spacingFactor = +(random(0.45, 0.75)).toFixed(2);
      params.minVertices = floor(random(3, 5));
      params.maxVertices = floor(random(8, 16));
      params.minDepth = +(random(0.15, 0.35)).toFixed(2);
      params.maxDepth = +(random(0.65, 0.95)).toFixed(2);
      params.vel = +(random(0.25, 0.95) * random([-1, 1])).toFixed(2);

      // 4. Randomize Texture style & blend mode
      const styles = ['Cosmic Flow', 'Chromatic Waves', 'Bauhaus Geometric', 'Fluid Marbling', 'Cyber Matrix', 'Watercolor Splatter'];
      params.textureStyle = random(styles);

      const blends = ['OVERLAY', 'HARD_LIGHT', 'MULTIPLY', 'SCREEN', 'DIFFERENCE'];
      params.blendMode = random(blends);

      // 5. Randomize grain & dust densities
      params.grainDensity = +(random(0.3, 0.65)).toFixed(2);
      params.dustCount = floor(random(600, 1600));

      // 6. Synthesize new procedural texture (if not custom uploaded)
      if (!isCustomUserImage) {
        generateSyntheticTexture();
      }

      // 7. Rebuild packing & overlays
      rebuildStarPacking();
      generateOverlays();

      // 8. Update GUI controls
      if (gui) {
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      }

      // 9. Update HUD and Toast banner
      updateHUD();
      showToast(`Variation #${params.seed} • ${params.scheme}`);
    }

    // ----------------------------------------------------------------------
    // Floating Toast Notification
    // ----------------------------------------------------------------------
    function showToast(message) {
      const toast = document.getElementById('toast');
      const text = document.getElementById('toast-text');
      if (!toast || !text) return;
      text.innerText = message;
      toast.classList.add('show');
      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('show');
      }, 2400);
    }

    // ----------------------------------------------------------------------
    // HUD Sync
    // ----------------------------------------------------------------------
    function updateHUD() {
      const themeEl = document.getElementById('hud-theme');
      const seedEl = document.getElementById('hud-seed');
      const countEl = document.getElementById('hud-count');
      const textureEl = document.getElementById('hud-texture');

      if (themeEl) themeEl.innerText = params.scheme.replace(/\s*\(.*?\)/, '');
      if (seedEl) seedEl.innerText = params.seed;
      if (countEl) countEl.innerText = packedStars.length;
      if (textureEl) textureEl.innerText = isCustomUserImage ? 'Custom Image' : params.textureStyle;
    }

    // ----------------------------------------------------------------------
    // Mouse & Touch Interaction Handling
    // ----------------------------------------------------------------------
    function mousePressed() {
      pointerDownTime = millis();
      pointerDownX = mouseX;
      pointerDownY = mouseY;
    }

    function mouseReleased(e) {
      // Check if click was inside GUI
      const evt = e || window.event;
      const target = evt ? evt.target : null;
      const guiEl = document.querySelector('.lil-gui');
      if (guiEl && target && guiEl.contains(target)) {
        return;
      }

      // If click was a clean tap (< 280ms duration and < 8px displacement)
      const duration = millis() - pointerDownTime;
      const moveDist = dist(mouseX, mouseY, pointerDownX, pointerDownY);

      if (params.clickRandomize && duration < 280 && moveDist < 8) {
        randomizeScene();
      }
    }

    // ----------------------------------------------------------------------
    // Keyboard Shortcuts
    // ----------------------------------------------------------------------
    function keyPressed(e) {
      if (document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'SELECT')) {
        return;
      }

      if (key === ' ') {
        if (e && e.preventDefault) e.preventDefault();
        randomizeScene();
      } else if (key === 'p' || key === 'P') {
        params.isPaused = !params.isPaused;
        if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
        showToast(params.isPaused ? 'ANIMATION PAUSED' : 'ANIMATION RESUMED');
      } else if (key === 'h' || key === 'H') {
        const hud = document.getElementById('hud');
        const guiEl = document.querySelector('.lil-gui');
        if (hud) hud.classList.toggle('hidden');
        if (guiEl) guiEl.classList.toggle('hidden');
      } else if (key === 's' || key === 'S') {
        saveCanvas(`593_Celestial_Packing_${params.seed}`, 'png');
        showToast('CAPTURED 4K PNG SCREENSHOT');
      } else if (key === 'f' || key === 'F') {
        const fs = fullscreen();
        fullscreen(!fs);
        showToast(!fs ? 'FULLSCREEN ENABLED' : 'FULLSCREEN DISABLED');
      } else if (key === 'r' || key === 'R') {
        params.seed = 42891;
        params.vel = 0.5;
        generateSyntheticTexture();
        rebuildStarPacking();
        generateOverlays();
        if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
        updateHUD();
        showToast('RESET TO INITIAL PARAMETERS');
      }
    }

    // ----------------------------------------------------------------------
    // Drag and Drop & Custom Image Upload
    // ----------------------------------------------------------------------
    function initDragAndDrop() {
      const dropOverlay = document.getElementById('drop-overlay');
      const fileInput = document.getElementById('file-input');

      window.addEventListener('dragover', (e) => {
        e.preventDefault();
        if (dropOverlay) dropOverlay.classList.add('active');
      });

      window.addEventListener('dragleave', (e) => {
        if (e.relatedTarget === null && dropOverlay) {
          dropOverlay.classList.remove('active');
        }
      });

      window.addEventListener('drop', (e) => {
        e.preventDefault();
        if (dropOverlay) dropOverlay.classList.remove('active');

        if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
          loadUserImageFile(e.dataTransfer.files[0]);
        }
      });

      if (fileInput) {
        fileInput.addEventListener('change', (e) => {
          if (e.target.files && e.target.files.length > 0) {
            loadUserImageFile(e.target.files[0]);
          }
        });
      }
    }

    function loadUserImageFile(file) {
      if (!file.type.startsWith('image/')) {
        showToast('PLEASE DROP A VALID IMAGE FILE');
        return;
      }
      const reader = new FileReader();
      reader.onload = (event) => {
        loadImage(event.target.result, (loaded) => {
          img = loaded;
          isCustomUserImage = true;
          rebuildStarPacking();
          updateHUD();
          showToast(`LOADED IMAGE: ${file.name}`);
        });
      };
      reader.readAsDataURL(file);
    }

      fRandom.add({ screenshot: () => {
        saveCanvas(`593_Celestial_Packing_${params.seed}`, 'png');
        showToast('CAPTURED 4K PNG SCREENSHOT');
      }}, 'screenshot').name('📷 Capture HD PNG (S)');

      fRandom.add({ toggleFS: () => {
        fullscreen(!fullscreen());
      }}, 'toggleFS').name('⛶ Toggle Fullscreen (F)');

      fRandom.add({ reset: () => {
        params.seed = 42891;
        params.vel = 0.5;
        params.scheme = 'Original 8 (Japanese Lacquer)';
        isCustomUserImage = false;
        generateSyntheticTexture();
        rebuildStarPacking();
        generateOverlays();
        gui.controllersRecursive().forEach(c => c.updateDisplay());
        updateHUD();
        showToast('RESET TO INITIAL PRESET');
      }}, 'reset').name('↺ Reset to Default');

      // Default to open
      gui.open();
    }
  </script>
</body>
