<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Wave-Activated Node Network</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #040814;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
    }
  }
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import GUI from 'lil-gui';

    // ==========================================
    // 19 Preconfigured Color Schemes
    // ==========================================
    const COLOR_SCHEMES = {
      'Original': {

        nodeColor: '#26d0ce',
        nodeHighlight: '#ffffff',

        pulseColor: '#00f5d4',
        ringColor: '#1dd1a1'
      },
      'Monochromatic': {
        background: '#030914',
        nodeColor: '#2575fc',
        nodeHighlight: '#e0f2fe',
        lineColor: '#12335c',
        pulseColor: '#60a5fa',
        ringColor: '#3b82f6'
      },
      'Analogous': {
        background: '#070514',
        nodeColor: '#8b5cf6',
        nodeHighlight: '#ede9fe',
        lineColor: '#2e1b59',
        pulseColor: '#06b6d4',
        ringColor: '#a855f7'
      },
      'Complementary': {
        background: '#060d16',
        nodeColor: '#14b8a6',
        nodeHighlight: '#fffbeb',
        lineColor: '#18374d',
        pulseColor: '#f97316',
        ringColor: '#fb923c'
      },
      'Split-complementary': {
        background: '#090717',
        nodeColor: '#38bdf8',
        nodeHighlight: '#fef3c7',

        pulseColor: '#f43f5e',

      },
      'Triadic': {

        lineColor: '#1d3052',
        pulseColor: '#ec4899',
        ringColor: '#eab308'
      },
      'Tetradic': {

        nodeColor: '#06b6d4',
        nodeHighlight: '#f0fdf4',
        lineColor: '#2a1d4d',
        pulseColor: '#84cc16',
        ringColor: '#d946ef'
      },
      'Double split-complementary': {
        background: '#0d0617',
        nodeColor: '#22c55e',
        nodeHighlight: '#fef3c7',
        lineColor: '#2e174a',
        pulseColor: '#ef4444',

      },
      'Achromatic (Black & White)': {

      },
      'Neutral + Accent': {

        nodeHighlight: '#fafaf9',
        lineColor: '#2e2a27',
        pulseColor: '#f59e0b',

      },
      'Palette 1 (Amber / Crimson)': {
        background: '#220901',
        nodeColor: '#F6AA1C',
        nodeHighlight: '#fef3c7',
        lineColor: '#7a1a0c',
        pulseColor: '#BC3908',
        ringColor: '#F6AA1C'
      },
      'Palette 2 (Cyan / Teal / Navy)': {
        background: '#0B132B',
        nodeColor: '#5BC0BE',
        nodeHighlight: '#e0f2fe',
        lineColor: '#203354',
        pulseColor: '#63D1CF',
        ringColor: '#4BAD9E'
      },
      'Palette 3 (Violet / Plum)': {
        background: '#0D001D',
        nodeColor: '#AA60C8',
        nodeHighlight: '#fae8ff',
        lineColor: '#34114d',
        pulseColor: '#D69ADE',
        ringColor: '#C9A3C6'
      },
      'Palette 4 (Gold / Teal / Forest)': {
        background: '#061210',
        nodeColor: '#008189',
        nodeHighlight: '#FEF1BE',
        lineColor: '#0a3d40',
        pulseColor: '#FFBA00',
        ringColor: '#008189'
      },
      'Palette 5 (Lime / Jade / Emerald)': {
        background: '#05140A',
        nodeColor: '#00B894',
        nodeHighlight: '#D4FFB0',
        lineColor: '#0e3825',
        pulseColor: '#7FFF00',
        ringColor: '#00B894'
      },
      'Palette 6 (Tangerine / Burgundy)': {
        background: '#0E0618',
        nodeColor: '#C7501A',
        nodeHighlight: '#FFE8CC',
        lineColor: '#3a154a',
        pulseColor: '#FF8C00',
        ringColor: '#C7501A'
      },
      'Palette 7 (Lavender / Royal Violet)': {
        background: '#090612',
        nodeColor: '#6A3DE8',
        nodeHighlight: '#E8E0FF',
        lineColor: '#1e134a',
        pulseColor: '#B38FFF',
        ringColor: '#6A3DE8'
      },
      'Palette 8 (Neon Cyan / Hot Magenta)': {
        background: '#05020F',
        nodeColor: '#00F0FF',
        nodeHighlight: '#E0FBFF',
        lineColor: '#280e4a',
        pulseColor: '#D40078',
        ringColor: '#00F0FF'
      }
    };

    // ==========================================
    // 8 Preconfigured Camera Animations
    // ==========================================
    const CAMERA_ANIMATIONS = [
      'Gentle Orbit',
      'Panoramic Drift',
      'Wave Sync Breathing',
      'Central Hub Spiral',
      'Cinematic Tilt & Pan',
      'Floating Observational',
      'Side Sweep',
      'Static (No Camera Movement)'
    ];

    // ==========================================
    // Parameters State
    // ==========================================
    const params = {
      // Color & Theme
      colorScheme: 'Original',
      greenscreen: false,
      backgroundColor: COLOR_SCHEMES['Original'].background,
      nodeColor: COLOR_SCHEMES['Original'].nodeColor,
      nodeHighlight: COLOR_SCHEMES['Original'].nodeHighlight,
      lineColor: COLOR_SCHEMES['Original'].lineColor,
      pulseColor: COLOR_SCHEMES['Original'].pulseColor,
      ringColor: COLOR_SCHEMES['Original'].ringColor,

      // Animation & Motion
      animationMode: 'Gentle Orbit',
      animationSpeed: 1.0,
      waveWidth: 1.6,
      waveIntensity: 1.2,
      waveMaxRadius: 25.0,

      // Network Structure
      nodeCount: 850,
      connectionDistance: 2.3,
      secondaryWebDistance: 4.8,
      hubCount: 8,
      nodeBaseSize: 2.4,

      // Lighting & Exposure
      exposure: 0.95,
      ambientIntensity: 0.4,
      ambientColor: '#ffffff',
      keyLightIntensity: 1.0,
      keyLightColor: '#ffffff',
      hubLightIntensity: 1.2,
      hubLightColor: COLOR_SCHEMES['Original'].pulseColor,
      waveLightIntensity: 1.0,
      waveLightColor: COLOR_SCHEMES['Original'].nodeColor,

      // Rendering & Interactivity
      dpr: Math.min(window.devicePixelRatio || 1, 2.0),
      antialias: true,
      clickToReroll: true,

      // Actions
      regenerateNetwork: () => generateNetwork()
    };

    // ==========================================
    // Three.js Scene Setup
    // ==========================================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(params.backgroundColor);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, -1.2, 26);

    let renderer = null;
    let controls = null;

    // Lights
    const ambientLight = new THREE.AmbientLight(params.ambientColor, params.ambientIntensity);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(params.keyLightColor, params.keyLightIntensity);
    keyLight.position.set(12, 18, 20);
    scene.add(keyLight);

    const hubPointLight = new THREE.PointLight(params.hubLightColor, params.hubLightIntensity, 25);
    hubPointLight.position.set(0, -1.5, 3.0);
    scene.add(hubPointLight);

    const wavePointLight = new THREE.PointLight(params.waveLightColor, params.waveLightIntensity, 20);
    wavePointLight.position.set(0, -1.5, 2.0);
    scene.add(wavePointLight);

    // Renderer Initialization with Antialias Support
    function initRenderer(antialias) {
      if (renderer) {
        if (renderer.domElement && renderer.domElement.parentNode) {
          renderer.domElement.parentNode.removeChild(renderer.domElement);
        }
        renderer.dispose();
      }

      renderer = new THREE.WebGLRenderer({
        antialias: antialias,
        powerPreference: 'high-performance'
      });
      renderer.setPixelRatio(params.dpr);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = params.exposure;
      renderer.setClearColor(params.greenscreen ? 0x00ff00 : params.backgroundColor, 1.0);
      document.body.appendChild(renderer.domElement);

      const oldTarget = controls ? controls.target.clone() : new THREE.Vector3(0, -1.2, 0);
      if (controls) {
        controls.dispose();
      }

      controls = new OrbitControls(camera, renderer.domElement);
      controls.target.copy(oldTarget);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.screenSpacePanning = true;
      controls.minDistance = 3.0;
      controls.maxDistance = 120.0;
    }

    initRenderer(params.antialias);

    // ==========================================
    // Network Shaders & Geometry Objects
    // ==========================================
    const networkGroup = new THREE.Group();
    scene.add(networkGroup);

    let pointsMesh = null;
    let linesMesh = null;
    let ringMeshes = [];
    let hubsData = [];

    // Node Points Shader (100% Round Luminous Cyber Spheres)
    const nodeVertexShader = `
      attribute float aSize;
      attribute float aType;
      attribute float aDistance;
      attribute float aPhase;

      uniform float uTime;
      uniform float uWaveRadius;
      uniform float uWaveWidth;
      uniform float uPixelRatio;
      uniform float uSpeed;

      varying float vWave;
      varying float vType;
      varying float vFlare;

      void main() {
        vType = aType;
        float dist = abs(aDistance - uWaveRadius);
        float wave = exp(- (dist * dist) / (2.0 * uWaveWidth * uWaveWidth));

        // Neighbor flaring with organic phase delay
        float flare = sin(uTime * 3.2 * uSpeed + aPhase * 6.28318) * 0.15 + 0.85;
        vWave = wave;
        vFlare = flare;

        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);

        // Responsive organic size expansion
        float sizeBoost = 1.0 + wave * 0.5 + (aType > 1.5 ? 0.35 : 0.0);
        gl_PointSize = (aSize * sizeBoost) * (95.0 / -mvPosition.z) * uPixelRatio;
        gl_Position = projectionMatrix * mvPosition;
      }
    `;

    const nodeFragmentShader = `
      uniform vec3 uColorNode;
      uniform vec3 uColorHighlight;
      uniform vec3 uColorPulse;

      varying float vWave;
      varying float vType;
      varying float vFlare;

      void main() {
        vec2 coord = gl_PointCoord - vec2(0.5);
        float dist = length(coord);

        // STRICT ROUND CUTOFF - Discards anything outside radius 0.5 (guarantees perfect circle)
        if (dist > 0.5) discard;

        // Antialiased circular silhouette
        float circleAlpha = smoothstep(0.5, 0.44, dist);

        // Soft radial spherical falloff
        float sphericalGlow = pow(clamp(1.0 - dist * 2.0, 0.0, 1.0), 1.5);

        // Inner glowing bead
        float bead = smoothstep(0.28, 0.12, dist);

        // White-hot star core
        float core = smoothstep(0.12, 0.0, dist);

        // Dynamic color mixing
        vec3 col = mix(uColorNode, uColorPulse, vWave);
        col = mix(col, uColorHighlight, vWave * 0.7);

        // Hot pinpoint center
        col += uColorHighlight * (core * 0.7 + bead * 0.3);
        if (vType > 1.5) {
          col += uColorHighlight * bead * 0.4;
        }

        float alpha = (bead * 0.75 + sphericalGlow * 0.4 + core * 0.35) * circleAlpha;
        alpha *= mix(0.55, 1.0, vWave) * vFlare;

        gl_FragColor = vec4(col, clamp(alpha, 0.0, 1.0));
      }
    `;

    // Connecting Lines Shader (Luminous Filaments with Moving Data Packets)
    const lineVertexShader = `
      attribute float aDistCenter;
      attribute float aLineRole;

      uniform float uWaveRadius;
      uniform float uWaveWidth;
      uniform float uTime;
      uniform float uSpeed;

      varying float vDistCenter;
      varying float vLineRole;
      varying float vWave;
      varying float vMicroPulse;

      void main() {
        vDistCenter = aDistCenter;
        vLineRole = aLineRole;

        float dist = abs(aDistCenter - uWaveRadius);
        vWave = exp(- (dist * dist) / (2.0 * uWaveWidth * uWaveWidth));

        // High-tech signal packets traveling smoothly outward from center
        float packet = fract(aDistCenter * 0.36 - uTime * 0.7 * uSpeed);
        vMicroPulse = smoothstep(0.85, 1.0, packet);

        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `;

    const lineFragmentShader = `
      uniform vec3 uColorLine;
      uniform vec3 uColorPulse;
      uniform vec3 uColorHighlight;

      varying float vDistCenter;
      varying float vLineRole;
      varying float vWave;
      varying float vMicroPulse;

      void main() {
        float baseAlpha = (vLineRole > 0.5) ? 0.15 : 0.32;
        float pulseFactor = clamp(vWave * 1.3 + vMicroPulse * 0.5, 0.0, 1.0);

        vec3 col = mix(uColorLine, uColorPulse, pulseFactor);
        col = mix(col, uColorHighlight, pow(vWave, 2.5) * 0.65);

        float alpha = mix(baseAlpha, 0.9, pulseFactor);
        gl_FragColor = vec4(col, alpha);
      }
    `;

    // Concentric Hub Rings Shader (Vector Precision with Arc Ticks)
    const ringVertexShader = `
      varying vec3 vLocalPos;
      void main() {
        vLocalPos = position;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `;

    const ringFragmentShader = `
      uniform float uRadius;
      uniform float uThickness;
      uniform vec3 uColorRing;
      uniform vec3 uColorHighlight;
      uniform float uWaveProximity;
      uniform float uTime;
      uniform float uDashSpeed;
      uniform float uDashCount;

      varying vec3 vLocalPos;

      void main() {
        float r = length(vLocalPos.xy);
        float angle = atan(vLocalPos.y, vLocalPos.x);

        // Technical dashed segment rotation
        float dash = sin(angle * uDashCount + uTime * uDashSpeed);
        if (dash < -0.2) discard;

        // Clean hair-thin edge falloff
        float edgeDist = abs(r - uRadius) / uThickness;
        if (edgeDist > 1.0) discard;
        float edgeAlpha = 1.0 - edgeDist * edgeDist;

        vec3 col = mix(uColorRing, uColorHighlight, uWaveProximity * 0.75);
        float alpha = edgeAlpha * mix(0.42, 0.95, uWaveProximity);
        gl_FragColor = vec4(col, alpha);
      }
    `;

    // ==========================================
    // Procedural Network Generation
    // ==========================================
    const epicenter = new THREE.Vector2(0, -1.5);

    function generateNetwork() {
      // Clear old meshes
      while (networkGroup.children.length > 0) {
        const obj = networkGroup.children[0];
        networkGroup.remove(obj);
        if (obj.geometry) obj.geometry.dispose();
        if (obj.material) {
          if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
          else obj.material.dispose();
        }
      }
      ringMeshes = [];
      hubsData = [];

      const nodeCount = params.nodeCount;
      const positions = [];
      const sizes = [];
      const types = [];
      const distances = [];
      const phases = [];

      const nodes = [];

      // Generate nodes filling the frame:
      // Density highest in center, thinning out toward edges, upper third sparser.
      const boundX = 18.0;
      const boundY = 12.5;

      let generated = 0;
      let attempts = 0;
      while (generated < nodeCount && attempts < nodeCount * 30) {
        attempts++;
        const x = (Math.random() * 2 - 1) * boundX;
        const y = (Math.random() * 2 - 1) * boundY;

        // Upper third sparseness rule: upper area (y > 2.5) has significantly lower density
        if (y > 2.5 && Math.random() > 0.28) {
          continue;
        }

        // Center concentration decay
        const dx = (x - epicenter.x) / boundX;
        const dy = (y - epicenter.y) / boundY;
        const radialNorm = Math.sqrt(dx * dx * 1.3 + dy * dy * 1.8);

        const acceptance = Math.exp(-radialNorm * 2.1) * 0.82 + 0.18;
        if (Math.random() > acceptance) {
          continue;
        }

        const z = (Math.random() - 0.5) * 0.8;
        const distFromCenter = Math.hypot(x - epicenter.x, y - epicenter.y);

        nodes.push({
          x, y, z,
          dist: distFromCenter,
          phase: Math.random(),
          connections: []
        });
        generated++;
      }

      // Sort nodes by distance from epicenter to select major hubs near center
      const sortedByDist = [...nodes].sort((a, b) => a.dist - b.dist);
      const hubCount = Math.min(params.hubCount, Math.floor(nodes.length / 10));

      for (let i = 0; i < hubCount; i++) {
        const hubNode = sortedByDist[Math.floor(i * 3.2 + Math.random() * 2)];
        if (hubNode) {
          hubNode.isHub = true;
          hubsData.push(hubNode);
        }
      }

      // Fill node attributes with calibrated round particle sizes
      for (let i = 0; i < nodes.length; i++) {
        const n = nodes[i];
        positions.push(n.x, n.y, n.z);
        distances.push(n.dist);
        phases.push(n.phase);

        if (n.isHub) {
          types.push(2.0);
          sizes.push(params.nodeBaseSize * 2.4);
        } else if (n.dist < 6.5 && Math.random() < 0.25) {
          types.push(1.0);
          sizes.push(params.nodeBaseSize * 1.45);
        } else {
          types.push(0.0);
          sizes.push(params.nodeBaseSize * (0.8 + Math.random() * 0.4));
        }
      }

      // Create Points Mesh (100% Round Nodes)
      const pointGeo = new THREE.BufferGeometry();
      pointGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      pointGeo.setAttribute('aSize', new THREE.Float32BufferAttribute(sizes, 1));
      pointGeo.setAttribute('aType', new THREE.Float32BufferAttribute(types, 1));
      pointGeo.setAttribute('aDistance', new THREE.Float32BufferAttribute(distances, 1));
      pointGeo.setAttribute('aPhase', new THREE.Float32BufferAttribute(phases, 1));

      const pointMat = new THREE.ShaderMaterial({
        vertexShader: nodeVertexShader,
        fragmentShader: nodeFragmentShader,
        uniforms: {
          uTime: { value: 0 },
          uWaveRadius: { value: 0 },
          uWaveWidth: { value: params.waveWidth },
          uPixelRatio: { value: params.dpr },
          uSpeed: { value: params.animationSpeed },
          uColorNode: { value: new THREE.Color(params.nodeColor) },
          uColorHighlight: { value: new THREE.Color(params.nodeHighlight) },
          uColorPulse: { value: new THREE.Color(params.pulseColor) }
        },
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });

      pointsMesh = new THREE.Points(pointGeo, pointMat);
      networkGroup.add(pointsMesh);

      // Construct Connecting Lines
      const linePositions = [];
      const lineDistances = [];
      const lineRoles = [];

      const connDistSq = params.connectionDistance * params.connectionDistance;
      const secDistMinSq = (params.connectionDistance * 1.1) ** 2;
      const secDistMaxSq = params.secondaryWebDistance ** 2;

      // Primary Proximity Links
      for (let i = 0; i < nodes.length; i++) {
        const nA = nodes[i];
        let connCount = 0;
        const maxConns = nA.isHub ? 7 : (nA.dist < 5.0 ? 5 : 3);

        for (let j = i + 1; j < nodes.length; j++) {
          const nB = nodes[j];
          const d2 = (nA.x - nB.x) ** 2 + (nA.y - nB.y) ** 2 + (nA.z - nB.z) ** 2;

          if (d2 <= connDistSq) {
            linePositions.push(nA.x, nA.y, nA.z, nB.x, nB.y, nB.z);
            lineDistances.push(nA.dist, nB.dist);
            lineRoles.push(0.0, 0.0); // 0.0 = primary
            connCount++;
            if (connCount >= maxConns) break;
          }
        }
      }

      // Secondary Delicate Web Connections
      let secondaryLinesAdded = 0;
      const maxSecondary = Math.floor(nodes.length * 0.35);

      for (let i = 0; i < nodes.length && secondaryLinesAdded < maxSecondary; i++) {
        if (Math.random() > 0.45) continue;
        const nA = nodes[i];

        for (let j = i + 2; j < nodes.length; j += 3) {
          const nB = nodes[j];
          const d2 = (nA.x - nB.x) ** 2 + (nA.y - nB.y) ** 2;

          if (d2 >= secDistMinSq && d2 <= secDistMaxSq) {
            linePositions.push(nA.x, nA.y, nA.z, nB.x, nB.y, nB.z);
            lineDistances.push(nA.dist, nB.dist);
            lineRoles.push(1.0, 1.0); // 1.0 = secondary web
            secondaryLinesAdded++;
            break;
          }
        }
      }

      // Create Lines Mesh
      const lineGeo = new THREE.BufferGeometry();
      lineGeo.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
      lineGeo.setAttribute('aDistCenter', new THREE.Float32BufferAttribute(lineDistances, 1));
      lineGeo.setAttribute('aLineRole', new THREE.Float32BufferAttribute(lineRoles, 1));

      const lineMat = new THREE.ShaderMaterial({
        vertexShader: lineVertexShader,
        fragmentShader: lineFragmentShader,
        uniforms: {
          uTime: { value: 0 },
          uWaveRadius: { value: 0 },
          uWaveWidth: { value: params.waveWidth },
          uSpeed: { value: params.animationSpeed },
          uColorLine: { value: new THREE.Color(params.lineColor) },
          uColorPulse: { value: new THREE.Color(params.pulseColor) },
          uColorHighlight: { value: new THREE.Color(params.nodeHighlight) }
        },
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });

      linesMesh = new THREE.LineSegments(lineGeo, lineMat);
      networkGroup.add(linesMesh);

      // Create Concentric Hub Tech Rings
      for (const hub of hubsData) {
        const ringRadii = [0.45, 0.82, 1.25];
        const hubRings = [];

        ringRadii.forEach((r, rIdx) => {
          const thickness = 0.022;
          const ringGeo = new THREE.RingGeometry(r - thickness * 1.5, r + thickness * 1.5, 64);
          const ringMat = new THREE.ShaderMaterial({
            vertexShader: ringVertexShader,
            fragmentShader: ringFragmentShader,
            uniforms: {
              uRadius: { value: r },
              uThickness: { value: thickness },
              uTime: { value: 0 },
              uWaveProximity: { value: 0 },
              uDashSpeed: { value: (rIdx % 2 === 0 ? 1.5 : -1.8) },
              uDashCount: { value: 8.0 + rIdx * 6.0 },
              uColorRing: { value: new THREE.Color(params.ringColor) },
              uColorHighlight: { value: new THREE.Color(params.nodeHighlight) }
            },
            transparent: true,
            depthWrite: false,
            side: THREE.DoubleSide,
            blending: THREE.AdditiveBlending
          });

          const mesh = new THREE.Mesh(ringGeo, ringMat);
          mesh.position.set(hub.x, hub.y, hub.z + 0.02 * (rIdx + 1));
          networkGroup.add(mesh);

          hubRings.push({
            mesh,
            baseRadius: r,
            rotSpeed: (rIdx % 2 === 0 ? 1 : -1) * (0.25 + rIdx * 0.15),
            dist: hub.dist
          });
        });

        ringMeshes.push(...hubRings);
      }
    }

    generateNetwork();

    // ==========================================
    // Color Schemes & Appearance Updates
    // ==========================================
    function applyColorScheme(schemeName) {
      const scheme = COLOR_SCHEMES[schemeName];
      if (!scheme) return;

      params.colorScheme = schemeName;
      params.backgroundColor = scheme.background;
      params.nodeColor = scheme.nodeColor;
      params.nodeHighlight = scheme.nodeHighlight;
      params.lineColor = scheme.lineColor;
      params.pulseColor = scheme.pulseColor;
      params.ringColor = scheme.ringColor;
      params.hubLightColor = scheme.pulseColor;
      params.waveLightColor = scheme.nodeColor;

      updateVisualColors();
      updateGUIControllers();
    }

    function updateVisualColors() {
      if (params.greenscreen) {
        scene.background = new THREE.Color(0x00ff00);
        renderer.setClearColor(0x00ff00, 1.0);
      } else {
        scene.background = new THREE.Color(params.backgroundColor);
        renderer.setClearColor(params.backgroundColor, 1.0);
      }

      if (pointsMesh && pointsMesh.material) {
        pointsMesh.material.uniforms.uColorNode.value.set(params.nodeColor);
        pointsMesh.material.uniforms.uColorHighlight.value.set(params.nodeHighlight);
        pointsMesh.material.uniforms.uColorPulse.value.set(params.pulseColor);
      }

      if (linesMesh && linesMesh.material) {
        linesMesh.material.uniforms.uColorLine.value.set(params.lineColor);
        linesMesh.material.uniforms.uColorPulse.value.set(params.pulseColor);
        linesMesh.material.uniforms.uColorHighlight.value.set(params.nodeHighlight);
      }

      ringMeshes.forEach(r => {
        if (r.mesh.material) {
          r.mesh.material.uniforms.uColorRing.value.set(params.ringColor);
          r.mesh.material.uniforms.uColorHighlight.value.set(params.nodeHighlight);
        }
      });

      ambientLight.color.set(params.ambientColor);
      ambientLight.intensity = params.ambientIntensity;

      keyLight.color.set(params.keyLightColor);
      keyLight.intensity = params.keyLightIntensity;

      hubPointLight.color.set(params.hubLightColor);
      hubPointLight.intensity = params.hubLightIntensity;

      wavePointLight.color.set(params.waveLightColor);
      wavePointLight.intensity = params.waveLightIntensity;

      renderer.toneMappingExposure = params.exposure;
    }

    // ==========================================
    // Camera Animation System
    // (Preserves User Zoom and Angle on Manual Input)
    // ==========================================
    const spherical = new THREE.Spherical();

    function updateCameraAnimation(delta, time) {
      if (params.animationMode === 'Static (No Camera Movement)') {
        return;
      }

      const target = controls.target;
      const offset = camera.position.clone().sub(target);
      const currentRadius = offset.length(); // User's manual zoom preserved!

      spherical.setFromVector3(offset);
      const spd = params.animationSpeed;

      switch (params.animationMode) {
        case 'Gentle Orbit':
          spherical.theta += 0.11 * delta * spd;
          break;

        case 'Panoramic Drift':
          spherical.theta += Math.sin(time * 0.35 * spd) * 0.002;
          break;

        case 'Wave Sync Breathing':
          spherical.phi = THREE.MathUtils.clamp(
            spherical.phi + Math.sin(time * 0.8 * spd) * 0.0016,
            0.25, Math.PI - 0.25
          );
          spherical.theta += 0.05 * delta * spd;
          break;

        case 'Central Hub Spiral':
          spherical.theta += 0.14 * delta * spd;
          spherical.phi = THREE.MathUtils.clamp(
            spherical.phi + Math.cos(time * 0.4 * spd) * 0.0014,
            0.3, Math.PI - 0.3
          );
          break;

        case 'Cinematic Tilt & Pan':
          spherical.theta += Math.cos(time * 0.3 * spd) * 0.0022;
          spherical.phi = THREE.MathUtils.clamp(
            spherical.phi + Math.sin(time * 0.22 * spd) * 0.0016,
            0.3, Math.PI - 0.3
          );
          break;

        case 'Floating Observational':
          spherical.theta += Math.sin(time * 0.25 * spd) * 0.0014 + 0.025 * delta * spd;
          spherical.phi = THREE.MathUtils.clamp(
            spherical.phi + Math.sin(time * 0.18 * spd) * 0.0011,
            0.2, Math.PI - 0.2
          );
          break;

        case 'Side Sweep':
          spherical.theta += Math.sin(time * 0.45 * spd) * 0.003;
          break;
      }

      spherical.radius = currentRadius; // Strictly preserve current zoom distance!
      offset.setFromSpherical(spherical);
      camera.position.copy(target).add(offset);
    }

    // ==========================================
    // Procedural Re-roll on Scene Click
    // ==========================================
    function triggerProceduralReroll() {
      // Pick random scheme from 19 schemes
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];

      // Re-roll motion and geometric parameters
      params.animationSpeed = THREE.MathUtils.randFloat(0.65, 1.6);
      params.waveWidth = THREE.MathUtils.randFloat(1.2, 2.0);
      params.connectionDistance = THREE.MathUtils.randFloat(1.9, 2.6);
      params.hubCount = THREE.MathUtils.randInt(5, 10);
      params.nodeBaseSize = THREE.MathUtils.randFloat(2.0, 3.2);

      // Select random animation
      params.animationMode = CAMERA_ANIMATIONS[Math.floor(Math.random() * CAMERA_ANIMATIONS.length)];

      applyColorScheme(randomScheme);
      generateNetwork();
      updateGUIControllers();

      // Gentle GSAP burst effect
      gsap.fromTo(hubPointLight, 
        { intensity: params.hubLightIntensity * 2.2 }, 
        { intensity: params.hubLightIntensity, duration: 1.0, ease: "power2.out" }
      );
    }

    let pointerDownPos = { x: 0, y: 0 };
    let pointerDownTime = 0;

    window.addEventListener('pointerdown', (e) => {
      if (gui && gui.domElement && gui.domElement.contains(e.target)) return;
      pointerDownPos.x = e.clientX;
      pointerDownPos.y = e.clientY;
      pointerDownTime = performance.now();
    });

    window.addEventListener('pointerup', (e) => {
      if (gui && gui.domElement && gui.domElement.contains(e.target)) return;
      const dx = e.clientX - pointerDownPos.x;
      const dy = e.clientY - pointerDownPos.y;
      const dist = Math.hypot(dx, dy);
      const elapsed = performance.now() - pointerDownTime;

      // Distinguish click from camera orbit/drag
      if (dist < 6 && elapsed < 350 && params.clickToReroll) {
        triggerProceduralReroll();
      }
    });

    // ==========================================
    // Lil-GUI Setup (Standard Unmodified Styles)
    // ==========================================
    const gui = new GUI({ title: 'Network Wave Controls' });

    // Color & Theme Folder
    const fTheme = gui.addFolder('Color & Themes');
    fTheme.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Palette Presets').onChange(applyColorScheme);
    fTheme.add(params, 'greenscreen').name('Greenscreen (#00ff00)').onChange(updateVisualColors);
    fTheme.addColor(params, 'backgroundColor').name('Background Color').onChange(updateVisualColors);
    fTheme.addColor(params, 'nodeColor').name('Node Base Color').onChange(updateVisualColors);
    fTheme.addColor(params, 'nodeHighlight').name('Highlight Color').onChange(updateVisualColors);
    fTheme.addColor(params, 'lineColor').name('Line Color').onChange(updateVisualColors);
    fTheme.addColor(params, 'pulseColor').name('Pulse Wave Color').onChange(updateVisualColors);
    fTheme.addColor(params, 'ringColor').name('Hub Ring Color').onChange(updateVisualColors);

    // Animation & Motion Folder
    const fAnim = gui.addFolder('Animation & Wave');
    fAnim.add(params, 'animationMode', CAMERA_ANIMATIONS).name('Camera Motion');
    fAnim.add(params, 'animationSpeed', 0.1, 3.0, 0.05).name('Animation Speed');
    fAnim.add(params, 'waveWidth', 0.5, 3.5, 0.1).name('Wave Pulse Width').onChange(v => {
      if (pointsMesh) pointsMesh.material.uniforms.uWaveWidth.value = v;
      if (linesMesh) linesMesh.material.uniforms.uWaveWidth.value = v;
    });

    // Network & Geometry Folder
    const fNet = gui.addFolder('Network Geometry');
    fNet.add(params, 'nodeCount', 300, 1600, 20).name('Node Count').onChange(() => generateNetwork());
    fNet.add(params, 'connectionDistance', 1.2, 3.5, 0.1).name('Link Distance').onChange(() => generateNetwork());
    fNet.add(params, 'secondaryWebDistance', 2.5, 6.5, 0.2).name('Secondary Web Span').onChange(() => generateNetwork());
    fNet.add(params, 'hubCount', 3, 14, 1).name('Hub Clusters').onChange(() => generateNetwork());
    fNet.add(params, 'nodeBaseSize', 1.0, 5.0, 0.2).name('Node Base Size').onChange(() => generateNetwork());
    fNet.add(params, 'regenerateNetwork').name('Rebuild Network');
    fNet.add(params, 'clickToReroll').name('Click Scene to Reroll');

    // Lighting & Exposure Folder
    const fLight = gui.addFolder('Lighting & Exposure');
    fLight.add(params, 'exposure', 0.2, 2.5, 0.05).name('Scene Exposure').onChange(updateVisualColors);
    fLight.add(params, 'ambientIntensity', 0.0, 2.0, 0.05).name('Ambient Intensity').onChange(updateVisualColors);
    fLight.addColor(params, 'ambientColor').name('Ambient Color').onChange(updateVisualColors);
    fLight.add(params, 'keyLightIntensity', 0.0, 3.0, 0.05).name('Key Light Intensity').onChange(updateVisualColors);
    fLight.addColor(params, 'keyLightColor').name('Key Light Color').onChange(updateVisualColors);
    fLight.add(params, 'hubLightIntensity', 0.0, 4.0, 0.1).name('Hub Light Intensity').onChange(updateVisualColors);
    fLight.addColor(params, 'hubLightColor').name('Hub Light Color').onChange(updateVisualColors);
    fLight.add(params, 'waveLightIntensity', 0.0, 4.0, 0.1).name('Wave Light Intensity').onChange(updateVisualColors);
    fLight.addColor(params, 'waveLightColor').name('Wave Light Color').onChange(updateVisualColors);

    // Rendering & Display Folder
    const fRender = gui.addFolder('Rendering');
    fRender.add(params, 'dpr', 0.5, 3.0, 0.25).name('Pixel Ratio (DPR)').onChange(v => {
      renderer.setPixelRatio(v);
      if (pointsMesh) pointsMesh.material.uniforms.uPixelRatio.value = v;
    });
    fRender.add(params, 'antialias').name('Antialiasing').onChange(v => {
      initRenderer(v);
    });

    function updateGUIControllers() {
      gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    // Toggle GUI visibility with "H" key
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        gui._hidden ? gui.show() : gui.hide();
      }
    });

    // ==========================================
    // Responsive Resize Handling
    // ==========================================
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ==========================================
    // Infinite Animation Loop
    // ==========================================
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = Math.min(clock.getDelta(), 0.1);
      const elapsedTime = clock.getElapsedTime();

      // Cyclical Harmonic Ping-Pong Wave Activation
      // The wave travels outward from center to edge, and returns back inward smoothly
      const wavePhase = (elapsedTime * params.animationSpeed * 0.6) % (Math.PI * 2);
      const waveRadius = (Math.sin(wavePhase - Math.PI / 2) * 0.5 + 0.5) * params.waveMaxRadius;

      // Update shader uniforms
      if (pointsMesh && pointsMesh.material) {
        pointsMesh.material.uniforms.uTime.value = elapsedTime;
        pointsMesh.material.uniforms.uWaveRadius.value = waveRadius;
        pointsMesh.material.uniforms.uSpeed.value = params.animationSpeed;
      }

      if (linesMesh && linesMesh.material) {
        linesMesh.material.uniforms.uTime.value = elapsedTime;
        linesMesh.material.uniforms.uWaveRadius.value = waveRadius;
        linesMesh.material.uniforms.uSpeed.value = params.animationSpeed;
      }

      // Hub Tech Rings Rotation and Wave Flare Response
      for (let i = 0; i < ringMeshes.length; i++) {
        const ring = ringMeshes[i];
        ring.mesh.rotation.z += ring.rotSpeed * delta * params.animationSpeed;

        const distDiff = Math.abs(ring.dist - waveRadius);
        const waveProx = Math.exp(- (distDiff * distDiff) / (2.0 * params.waveWidth * params.waveWidth));

        ring.mesh.material.uniforms.uTime.value = elapsedTime;
        ring.mesh.material.uniforms.uWaveProximity.value = waveProx;

        // Subtle tech reticle expansion when activated by wave
        const scaleVal = 1.0 + waveProx * 0.12;
        ring.mesh.scale.set(scaleVal, scaleVal, 1.0);
      }

      // Dynamic light tracking the activation wave
      const waveLightAngle = elapsedTime * 1.1 * params.animationSpeed;
      const waveLightR = Math.min(waveRadius, 14.0);
      wavePointLight.position.set(
        epicenter.x + Math.cos(waveLightAngle) * waveLightR,
        epicenter.y + Math.sin(waveLightAngle) * waveLightR * 0.7,
        2.5
      );

      // Camera Animation (smooth slow movements, preserving manual zoom and drag)
      updateCameraAnimation(delta, elapsedTime);

      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
