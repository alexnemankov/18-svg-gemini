<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050609">
  <meta name="description" content="An endless blue surface, distant pink light, and the delicate interference of an old analog memory. A procedural, seamlessly looping shader film.">
  <link rel="icon" href="data:,">
  <title>Blue Afterimage</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #050609; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
    canvas.dragging { cursor: grabbing; }
    .unavailable { position: fixed; inset: 0; display: grid; place-content: center; padding: 2rem; color: #aab7d0; text-align: center; font: 14px/1.7 system-ui, sans-serif; }
  </style>
</head>
<body>
<script type="module">
/*
 * BLUE AFTERIMAGE / a forty-second analog memory
 * All light, reflection, haze and grain are procedural. No texture assets.
 * Open directly; the pinned Three.js and lil-gui libraries need a connection.
 * Camera motion is composed with manual view offsets, never written over them.
 */
const SETTINGS = {
  loopDuration: 40,
  animationSpeed: 1,
  pixelRatioCap: 1.65,
  rippleIntensity: 0.85,
  glowIntensity: 1.0,
  noiseStrength: 0.030,
  distortionAmount: 0.8,
  exposure: 1.20,
  palette: {
    black: [0.004, 0.006, 0.008],
    blue: [0.105, 0.218, 0.480],
    lavender: [0.340, 0.410, 0.640],
    pink: [1.000, 0.420, 0.690],
    cyan: [0.170, 0.720, 1.000],
    white: [1.000, 0.855, 0.930]
  }
};

let renderer;
try {
  let THREE;
  try {
    THREE = await import('https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js');
  } catch {
    THREE = await import('https://unpkg.com/three@0.180.0/build/three.module.js');
  }
  let GUI;
  try {
    ({ default: GUI } = await import('https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js'));
  } catch {
    ({ default: GUI } = await import('https://cdn.jsdelivr.net/npm/lil-gui@0.19.1/dist/lil-gui.esm.min.js'));
  }

  // Eleven harmony families + the eight supplied palettes = nineteen presets.
  // Both achromatic families share an inversion control for their two variants.
  const schemes = {
    'Original': ['#ffdaed','#ff6bb0','#1b387a','#5769a3','#2bb8ff','#050609'],
    'Monochromatic': ['#e0edff','#8faee5','#254f91','#6387bd','#b1d3ff','#040914'],
    'Analogous': ['#e8e0ff','#b48aff','#383d9c','#858bd4','#55c6e3','#08091b'],
    'Complementary': ['#fff0d5','#f2ad59','#264b99','#8b9bcb','#5db9ea','#080d1a'],
    'Split-complementary': ['#fff2e8','#f6a56b','#354ba3','#b79bd9','#7de5b8','#0b0c1b'],
    'Triadic': ['#fff1ed','#fc82ac','#355ab2','#b8a4dc','#89db82','#090b18'],
    'Tetradic': ['#fff7db','#f58db4','#395fa2','#ada1db','#65d1ba','#090d17'],
    'Double split-complementary': ['#fff0df','#ed8eaa','#376ca0','#b8a2d3','#9bd592','#0d1019'],
    'Achromatic': ['#ffffff','#dddddd','#666666','#aaaaaa','#eeeeee','#000000'],
    'Achromatic + Accent': ['#ffffff','#ff293b','#666666','#aaaaaa','#eeeeee','#000000'],
    'Neutral + accent': ['#fff5df','#f6aa1c','#575b61','#aaa69b','#8d9298','#151619'],
    'Amber / Ember': ['#F6AA1C','#BC3908','#941B0C','#F6AA1C','#F6AA1C','#220901'],
    'Turquoise / Midnight': ['#63D1CF','#5BC0BE','#4BAD9E','#4BAD9E','#0B132B','#000000'],
    'Orchid / Aubergine': ['#D69ADE','#AA60C8','#C9A3C6','#CFB5C2','#0D001D','#120A12'],
    'Saffron / Deep Teal': ['#FEF1BE','#FFBA00','#008189','#00474D','#008189','#061210'],
    'Lime / Evergreen': ['#D4FFB0','#7FFF00','#00B894','#0A3322','#00B894','#05140A'],
    'Tangerine / Plum': ['#FFE8CC','#FF8C00','#C7501A','#3D1050','#C7501A','#0E0618'],
    'Lavender / Ultraviolet': ['#E8E0FF','#B38FFF','#6A3DE8','#1A1250','#B38FFF','#090612'],
    'Cyan / Fuchsia': ['#E0FBFF','#00F0FF','#D40078','#1E0A3D','#00F0FF','#05020F']
  };
  const motionNames = ['Static', 'Slow drift', 'Soft orbit', 'Horizon glide', 'Gentle dolly', 'Floating arc', 'Tidal sway', 'Lemniscate', 'Quiet spiral'];
  const toHex = values => '#' + values.map(v => Math.round(v*255).toString(16).padStart(2,'0')).join('');
  const controls = {
    scheme: 'Original', invert: false, greenscreen: false, clickVariations: true,
    background: '#050609',
    surface: toHex(SETTINGS.palette.blue), hazeColor: toHex(SETTINGS.palette.lavender),
    primary: toHex(SETTINGS.palette.pink), secondary: toHex(SETTINGS.palette.cyan),
    cores: toHex(SETTINGS.palette.white),
    animation: 'Static', speed: 1, motionAmount: 1,
    pixelRatio: Math.min(devicePixelRatio || 1, SETTINGS.pixelRatioCap),
    zoom: 1, panX: 0, panY: 0, yaw: 0, pitch: 0, roll: 0,
    seed: 0, spread: 1, lightScale: 1, reflectionLength: 1, rippleScale: 1, haze: 1,
    ripple: SETTINGS.rippleIntensity, glow: SETTINGS.glowIntensity,
    grain: SETTINGS.noiseStrength, distortion: SETTINGS.distortionAmount, exposure: SETTINGS.exposure
  };

  renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, SETTINGS.pixelRatioCap));
  renderer.setClearColor(0x050609, 1);
  renderer.domElement.setAttribute('role', 'img');
  renderer.domElement.setAttribute('aria-label', 'Slowly shimmering pink and cyan lights reflected across an infinite blue surface in darkness.');
  document.body.appendChild(renderer.domElement);

  const uniforms = {
    uResolution: { value: new THREE.Vector2() },
    uTime: { value: 0 },
    uLoopDuration: { value: SETTINGS.loopDuration },
    uRipple: { value: SETTINGS.rippleIntensity },
    uGlow: { value: SETTINGS.glowIntensity },
    uGrain: { value: SETTINGS.noiseStrength },
    uDistortion: { value: SETTINGS.distortionAmount },
    uExposure: { value: SETTINGS.exposure },
    uBackground: { value: new THREE.Vector3(5/255,6/255,9/255) },
    uGreen: { value: 0 }, uMono: { value: 0 }, uInvert: { value: 0 },
    uView: { value: new THREE.Vector4(1,0,0,0) },
    uPan: { value: new THREE.Vector2() },
    uSeed: { value: 0 }, uSpread: { value: 1 }, uLightScale: { value: 1 },
    uReflectionLength: { value: 1 }, uRippleScale: { value: 1 }, uHaze: { value: 1 }
  };
  for (const [name, color] of Object.entries(SETTINGS.palette)) {
    uniforms['u' + name[0].toUpperCase() + name.slice(1)] = { value: new THREE.Vector3(...color) };
  }

  const material = new THREE.ShaderMaterial({
    uniforms,
    depthTest: false,
    depthWrite: false,
    vertexShader: /* glsl */`
      varying vec2 vUv;
      void main() {
        vUv = position.xy * 0.5 + 0.5;
        gl_Position = vec4(position.xy, 0.0, 1.0);
      }
    `,
    fragmentShader: /* glsl */`
      precision highp float;
      varying vec2 vUv;
      uniform vec2 uResolution;
      uniform float uTime, uLoopDuration, uRipple, uGlow, uGrain, uDistortion, uExposure;
      uniform vec3 uBlack, uBlue, uLavender, uPink, uCyan, uWhite;
      uniform vec3 uBackground;
      uniform vec4 uView;
      uniform vec2 uPan;
      uniform float uGreen, uMono, uInvert, uSeed, uSpread, uLightScale;
      uniform float uReflectionLength, uRippleScale, uHaze;
      const float TAU = 6.283185307179586;
      const float HORIZON = 0.395;
      vec2 loopTime;
      float phase;

      float hash21(vec2 p) {
        p += uSeed*vec2(0.017,0.031);
        vec3 q = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973));
        q += dot(q, q.yzx + 33.33);
        return fract((q.x + q.y) * q.z);
      }
      float noise(vec2 p) {
        vec2 i = floor(p), f = fract(p);
        f = f*f*(3.0-2.0*f);
        return mix(mix(hash21(i), hash21(i+vec2(1,0)), f.x),
                   mix(hash21(i+vec2(0,1)), hash21(i+vec2(1,1)), f.x), f.y);
      }
      float fbm(vec2 p) {
        float sum = 0.0, amplitude = 0.5;
        mat2 turn = mat2(0.8, -0.6, 0.6, 0.8);
        for (int i=0; i<4; i++) {
          sum += amplitude * noise(p);
          p = turn*p*2.03 + 17.1;
          amplitude *= 0.5;
        }
        return sum;
      }
      // Circular time-domain sampling: every noise field returns to its origin.
      float periodicNoise(vec2 p, float radius) {
        return noise(p + radius*loopTime);
      }
      float gaussian(vec2 p, vec2 radius) {
        vec2 q = p/radius;
        return exp(-dot(q,q));
      }
      vec2 reflectiveUV(vec2 p) {
        float depth = max(p.y-HORIZON, 0.014);
        return vec2(p.x/depth, 0.24/depth)*uRippleScale;
      }
      float surfaceRipples(vec2 world, float y) {
        // Reduce frequencies before the vanishing point to avoid aliasing.
        float detail = smoothstep(HORIZON+0.015, HORIZON+0.10, y);
        float a = sin(world.y*19.0 + world.x*0.7 + 0.75*sin(phase));
        float b = sin(world.y*41.0 - world.x*1.4 + 0.65*cos(phase));
        float c = sin(world.y*83.0 + world.x*3.1 + sin(phase+1.0));
        return (a*0.52+b*0.30+c*0.18)*detail;
      }
      float reflectionDisplacement(float y, float seed) {
        float coarse = periodicNoise(vec2(y*91.0, seed), 0.8)-0.5;
        float fine = periodicNoise(vec2(y*492.0, seed+23.0), 1.1)-0.5;
        return (coarse*0.016 + fine*0.010) * uRipple;
      }
      vec3 bloom(vec2 q, vec2 size, vec3 tint) {
        size *= uLightScale;
        float core = gaussian(q,size);
        float skirt = gaussian(q,size*3.6);
        float halo = gaussian(q,size*11.0);
        return uWhite*core*2.6 + tint*(skirt*0.48+halo*0.075);
      }
      vec3 lightSource(vec2 p, vec2 center, vec2 size, float seed) {
        vec2 q = p-center;
        q.x += reflectionDisplacement(p.y,seed)*0.65;
        float flicker = 0.94+0.045*sin(phase+seed)+0.015*sin(phase*3.0+seed);
        float breakup = 0.64+0.36*periodicNoise(vec2(p.y*710.0,seed),0.9);
        vec3 light = bloom(q,size,uPink);
        float fringe = 0.0061*uDistortion;
        light += uCyan * gaussian(q+vec2(fringe,0.001),size*1.6)*1.20;
        light += uPink * gaussian(q-vec2(fringe,0.001),size*1.8)*1.00;
        light += uPink*gaussian(q,vec2(size.x*9.0,size.y*0.42))*0.30;
        light += uBlue*gaussian(q,vec2(0.145,0.023))*0.15;
        return light*flicker*breakup;
      }
      vec3 reflection(vec2 p, vec2 source, float reach, float width, float seed, vec2 world) {
        reach *= uReflectionLength;
        width *= uLightScale;
        float dy = p.y-source.y;
        float gate = smoothstep(-0.008,0.017,dy);
        float t = max(dy,0.0)/reach;
        float envelope = exp(-t*t*2.6)*gate;
        float drift = reflectionDisplacement(p.y,seed);
        float ripple = surfaceRipples(world,p.y);
        float x = p.x-source.x + drift + ripple*0.0025*uRipple;
        x += sin(p.y*45.0+sin(phase)+seed)*0.003*uRipple;
        float spread = width + max(dy,0.0)*0.095;
        float narrow = exp(-pow(x/spread,2.0));
        float broad = exp(-pow(x/(spread*4.0+0.018),2.0));
        float rows = periodicNoise(vec2(p.y*623.0,seed+5.0),1.3);
        float cells = periodicNoise(vec2(p.x*171.0,p.y*811.0+seed),0.75);
        float bands = pow(max(0.0,0.5+0.5*ripple),3.0);
        float fragments = (0.13+1.25*rows*rows)*(0.30+0.70*cells);
        float hot = narrow*fragments*(0.45+1.9*bands);
        vec3 col = mix(uPink,uWhite,rows*0.65)*hot;
        float split = exp(-pow((x+0.004*uDistortion)/spread,2.0));
        col += uCyan*split*(0.12+0.24*bands)*cells;
        col += uPink*broad*0.075;
        return col*envelope;
      }
      float tracking(vec2 p) {
        float center = 0.57+0.22*sin(phase);
        float band = exp(-pow((p.y-center)/0.006,2.0));
        return (periodicNoise(vec2(p.y*440.0,8.1),0.5)-0.5)*0.003
             + band*0.002*sin(p.y*1700.0+sin(phase));
      }
      vec3 analogGrade(vec3 color, vec2 p) {
        float lines = sin((1.0-vUv.y)*uResolution.y*TAU*0.5);
        color *= 0.985+0.015*lines;
        color *= 1.0+0.012*sin(p.y*1320.0+2.0*sin(phase));
        // Evolving continuous grain, with no frame counter or discontinuous seed.
        vec2 pixel = floor(vUv*uResolution);
        float grainA = hash21(pixel);
        float grainB = hash21(pixel+vec2(71.0,193.0));
        float grain = (grainA-0.5)*cos(phase*7.0)+(grainB-0.5)*sin(phase*7.0);
        color = vec3(1.0)-exp(-max(color,0.0)*uExposure);
        color = pow(color,vec3(0.87,0.91,0.96));
        color += grain*uGrain*(0.28+0.72*smoothstep(0.10,0.65,p.y));
        vec2 edge = (vUv-0.5)*vec2(1.0,0.88);
        color *= 1.0-0.50*smoothstep(0.12,0.72,dot(edge,edge));
        return clamp(color,0.0,1.0);
      }
      vec2 sourcePosition(vec2 center, float salt) {
        float variation = step(0.5,uSeed);
        center += (vec2(hash21(vec2(salt,2.0)),hash21(vec2(salt,9.0)))-0.5)
                * vec2(0.065,0.030)*variation;
        center.x *= uSpread;
        return center;
      }
      vec2 viewCoordinates(vec2 p) {
        p -= vec2(0.0,0.5)+uPan;
        p /= uView.x;
        float c = cos(uView.w), s = sin(uView.w);
        p = mat2(c,-s,s,c)*p;
        float perspective = max(0.35,1.0+p.x*sin(uView.y)*0.8+p.y*sin(uView.z)*0.9);
        p /= perspective;
        p.x /= max(0.40,cos(uView.y));
        p.y /= max(0.55,cos(uView.z));
        p.x += sin(uView.y)*p.y*0.38;
        p.y += sin(uView.z)*0.13;
        return p+vec2(0.0,0.5);
      }
      void main() {
        phase = TAU*mod(uTime,uLoopDuration)/uLoopDuration;
        loopTime = vec2(cos(phase),sin(phase));
        float aspect = uResolution.x/uResolution.y;
        // Preserve the light cluster on wide screens; allow breathing room in portrait.
        vec2 p = vec2((vUv.x-0.5)*max(aspect,0.70),1.0-vUv.y);
        p = viewCoordinates(p);
        p.x += tracking(p)*uDistortion;
        vec2 world = reflectiveUV(p);
        float surface = smoothstep(HORIZON-0.065,HORIZON+0.115,p.y);
        float atmosphere = fbm(vec2(p.x*2.5,p.y*5.0)+loopTime*0.13);
        float horizonGlow = exp(-pow((p.y-0.475)/0.110,2.0));
        float foreground = exp(-pow((p.y-0.715)/0.265,2.0));
        float sideLight = 0.67+0.33*exp(-pow((p.x+0.23)/0.52,2.0));
        vec3 color = vec3(0.0);
        color += uBlue*horizonGlow*(0.15+0.16*atmosphere)*uHaze;
        color += uBlue*surface*(0.20+foreground*1.16)*sideLight;
        color += uLavender*surface*foreground*0.13*uHaze;
        color *= 0.86+0.26*atmosphere;

        // A broad optical trough between reflections, with no visible geometry.
        float trough = gaussian(p-vec2(-0.055,0.518),vec2(0.185,0.034));
        color *= 1.0-trough*0.58;
        float ripple = surfaceRipples(world,p.y);
        float micro = periodicNoise(vec2(world.x*140.0,world.y*365.0),0.9);
        float speckle = pow(max(micro-0.38,0.0),2.0);
        color += uBlue*(ripple*0.018+(micro-0.5)*0.040)*surface;
        float sheen = gaussian(p-vec2(-0.075,0.700),vec2(0.37,0.073));
        color += mix(uBlue,uPink,0.58)*speckle*sheen;

        vec2 distant = sourcePosition(vec2(-0.080,0.327),1.0);
        vec2 middle = sourcePosition(vec2(-0.094,0.427),3.0);
        vec2 left = sourcePosition(vec2(-0.267,0.514),6.0);
        vec2 right = sourcePosition(vec2(0.139,0.505),9.0);
        distant.x += 0.0015*sin(phase);
        middle.x += 0.002*sin(phase+0.4);
        vec3 lights = lightSource(p,distant,vec2(0.0050,0.0058),1.0)*0.72;
        lights += lightSource(p,middle,vec2(0.0064,0.0055),3.0)*0.95;
        lights += lightSource(p,left,vec2(0.0230,0.0070),6.0)*0.73;
        lights += lightSource(p,right,vec2(0.0270,0.0066),9.0)*1.05;
        lights += lightSource(p,middle+vec2(0.016,0.030),vec2(0.004,0.009),4.0)*0.62;
        lights += uBlue*gaussian(p-left,vec2(0.16,0.075))*0.26;
        lights += uCyan*gaussian(p-distant,vec2(0.028,0.023))*0.055;

        vec3 reflected = reflection(p,distant,0.24,0.0033,1.0,world)*0.38;
        reflected += reflection(p,middle,0.29,0.0055,3.0,world)*0.74;
        reflected += reflection(p,left,0.18,0.014,6.0,world)*0.48;
        reflected += reflection(p,right,0.16,0.021,9.0,world)*0.58;
        // Foreground caustic: the central reflection resolves into a soft broken flare.
        vec2 q = p-vec2(middle.x-0.006+reflectionDisplacement(p.y,11.0),middle.y+0.259*uReflectionLength);
        float broken = 0.25+0.75*periodicNoise(vec2(p.y*600.0,2.8),0.8);
        reflected += bloom(q,vec2(0.015,0.024),uPink)*broken*0.66;
        reflected += uPink*gaussian(q,vec2(0.19,0.047))*speckle*0.92;

        // Faint chromatic vertical bleed above the remote central signal.
        lights += mix(uCyan,uPink,periodicNoise(vec2(p.y*150.0,2.0),0.5))
                * gaussian(p-(distant-vec2(0.0,0.052)),vec2(0.008,0.089))*0.024;
        color += uGlow*(lights+reflected*surface);
        vec3 graded = analogGrade(color,p);
        float emissionAlpha = max(max(graded.r,graded.g),graded.b);
        float luminance = dot(graded,vec3(0.2126,0.7152,0.0722));
        if (uMono>0.5) {
          graded = vec3(mix(luminance,1.0-luminance,uInvert));
          if (uMono>1.5) {
            float accent = smoothstep(0.05,0.65,length(lights+reflected*surface))
                         *(1.0-smoothstep(0.78,0.99,luminance))*0.82;
            graded = mix(graded,uPink,accent);
          }
        }
        float lightEnergy = max(max(lights.r,lights.g),lights.b)*uGlow;
        float skySignal = smoothstep(0.0015,0.006,lightEnergy);
        vec3 background = mix(uBackground,vec3(0.0,1.0,0.0),uGreen);
        vec3 skyEmission = graded*skySignal;
        float skyAlpha = max(max(skyEmission.r,skyEmission.g),skyEmission.b);
        if (uMono>0.5 && uInvert>0.5) {
          skyAlpha = emissionAlpha*skySignal;
          skyEmission = graded*skyAlpha;
        }
        // Background is composited last: key green stays exactly #00ff00,
        // unaffected by grain, exposure, palette, vignette or B/W inversion.
        // Premultiplied emission avoids dark bloom fringes on bright backgrounds.
        vec3 sky = skyEmission+background*(1.0-skyAlpha);
        gl_FragColor = vec4(mix(sky,graded,surface),1.0);
      }
    `
  });

  // A single oversized triangle covers the screen without a diagonal seam.
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute([-1,-1,0, 3,-1,0, -1,3,0],3));
  const scene = new THREE.Scene();
  const camera = new THREE.Camera();
  const mesh = new THREE.Mesh(geometry, material);
  mesh.frustumCulled = false;
  scene.add(mesh);

  const gui = new GUI({ title: 'Blue Afterimage', width: 300 });
  const cameraControllers = [];
  const colorKeys = { surface: 'uBlue', hazeColor: 'uLavender', primary: 'uPink', secondary: 'uCyan', cores: 'uWhite', background: 'uBackground' };
  function setRGB(uniform, hex) {
    const value = Number.parseInt(hex.slice(1),16);
    uniforms[uniform].value.set(((value>>16)&255)/255,((value>>8)&255)/255,(value&255)/255);
  }
  function updateColors() {
    for (const [key,uniform] of Object.entries(colorKeys)) setRGB(uniform,controls[key]);
    uniforms.uGreen.value = Number(controls.greenscreen);
    uniforms.uMono.value = controls.scheme === 'Achromatic' ? 1 : controls.scheme === 'Achromatic + Accent' ? 2 : 0;
    uniforms.uInvert.value = Number(controls.invert);
    document.body.style.backgroundColor = controls.greenscreen ? '#00ff00' : controls.background;
  }
  function applyScheme() {
    [controls.cores,controls.primary,controls.surface,controls.hazeColor,controls.secondary,controls.background] = schemes[controls.scheme];
    if (controls.scheme.startsWith('Achromatic')) controls.background = controls.invert ? '#ffffff' : '#000000';
    updateColors();
    gui.controllersRecursive().forEach(controller => controller.updateDisplay());
  }
  const parameterKeys = {
    ripple: 'uRipple', glow: 'uGlow', grain: 'uGrain', distortion: 'uDistortion', exposure: 'uExposure',
    seed: 'uSeed', spread: 'uSpread', lightScale: 'uLightScale', reflectionLength: 'uReflectionLength',
    rippleScale: 'uRippleScale', haze: 'uHaze'
  };
  function updateParameters() {
    for (const [key,uniform] of Object.entries(parameterKeys)) uniforms[uniform].value = controls[key];
  }
  const theme = gui.addFolder('Theme');
  theme.add(controls,'scheme',Object.keys(schemes)).name('Color scheme').onChange(applyScheme);
  theme.add(controls,'invert').name('Invert achromatic').onChange(() => {
    if (controls.scheme.startsWith('Achromatic')) {
      controls.background = controls.invert ? '#ffffff' : '#000000';
      gui.controllersRecursive().forEach(controller => controller.updateDisplay());
    }
    updateColors();
  });
  theme.add(controls,'greenscreen').name('Greenscreen').onChange(updateColors);
  theme.add(controls,'clickVariations').name('Click variations');
  const colorFolder = theme.addFolder('Colors').close();
  for (const [key,label] of Object.entries({ background: 'Background', surface: 'Surface', hazeColor: 'Haze', primary: 'Primary glow', secondary: 'Secondary glow', cores: 'Light cores' })) {
    colorFolder.addColor(controls,key).name(label).onChange(updateColors);
  }

  let previousMotion = controls.animation;
  let motionTransition = 1;
  const motionFolder = gui.addFolder('Animation');
  motionFolder.add(controls,'animation',motionNames).name('Motion').onChange(() => { motionTransition = 0; });
  motionFolder.add(controls,'speed',0,2,0.01).name('Animation speed');
  motionFolder.add(controls,'motionAmount',0,1.5,0.01).name('Motion amount');
  const viewFolder = gui.addFolder('View').close();
  for (const [key,label,min,max,step] of [
    ['zoom','Zoom',0.35,4,0.01], ['panX','Position X',-2,2,0.001], ['panY','Position Y',-1.5,1.5,0.001],
    ['yaw','Yaw',-55,55,0.1], ['pitch','Pitch',-35,35,0.1], ['roll','Roll',-35,35,0.1]
  ]) cameraControllers.push(viewFolder.add(controls,key,min,max,step).name(label));
  const actions = {
    resetView() {
      Object.assign(controls,{ zoom: 1, panX: 0, panY: 0, yaw: 0, pitch: 0, roll: 0 });
      cameraControllers.forEach(controller => controller.updateDisplay());
    },
    newVariation() {
      const random = (min,max) => min+Math.random()*(max-min);
      const names = Object.keys(schemes);
      controls.scheme = names[Math.floor(Math.random()*names.length)];
      controls.seed = 1+crypto.getRandomValues(new Uint32Array(1))[0]%9999;
      controls.spread = random(0.70,1.35);
      controls.lightScale = random(0.7,1.45);
      controls.reflectionLength = random(0.65,1.35);
      controls.rippleScale = random(0.65,1.6);
      controls.ripple = random(0.35,1.3);
      controls.glow = random(0.75,1.45);
      controls.haze = random(0.6,1.4);
      controls.distortion = random(0.35,1.2);
      controls.speed = random(0.35,0.85);
      controls.motionAmount = random(0.4,1.0);
      // Pick a different camera path, while preserving manual position and zoom.
      const candidates = motionNames.slice(1).filter(name => name !== controls.animation);
      controls.animation = candidates[Math.floor(Math.random()*candidates.length)];
      motionTransition = 0;
      applyScheme();
      updateParameters();
    }
  };
  viewFolder.add(actions,'resetView').name('Reset view');
  theme.add(actions,'newVariation').name('New variation');
  const sceneFolder = gui.addFolder('Surface & light').close();
  for (const [key,label,min,max,step] of [
    ['seed','Seed',0,9999,1], ['spread','Light spacing',0.5,1.6,0.01], ['lightScale','Light size',0.4,2,0.01],
    ['reflectionLength','Reflection length',0.4,1.8,0.01], ['rippleScale','Ripple frequency',0.4,2,0.01],
    ['ripple','Ripple intensity',0,2,0.01], ['glow','Glow',0,2.5,0.01], ['haze','Haze intensity',0,2,0.01],
    ['grain','Grain',0,0.1,0.001], ['distortion','Analog distortion',0,2,0.01], ['exposure','Exposure',0.4,2,0.01]
  ]) sceneFolder.add(controls,key,min,max,step).name(label).onChange(updateParameters);
  const renderingFolder = gui.addFolder('Rendering').close();
  renderingFolder.add(controls,'pixelRatio',0.5,3,0.05).name('Pixel ratio (DPR)').onChange(resize);
  updateColors();
  updateParameters();

  let uiVisible = true;
  window.addEventListener('keydown', event => {
    if (event.code !== 'KeyH' || event.repeat || event.ctrlKey || event.metaKey || event.altKey) return;
    uiVisible = !uiVisible;
    if (!uiVisible && gui.domElement.contains(document.activeElement)) document.activeElement.blur();
    gui.show(uiVisible);
  });

  const canvas = renderer.domElement;
  const pointers = new Map();
  let gesture = null;
  let clickCandidate = null;
  function refreshView() { cameraControllers.forEach(controller => controller.updateDisplay()); }
  function pointerSnapshot() {
    const points = [...pointers.values()];
    if (points.length < 2) return null;
    return {
      x: (points[0].x+points[1].x)/2, y: (points[0].y+points[1].y)/2,
      distance: Math.hypot(points[0].x-points[1].x,points[0].y-points[1].y),
      zoom: controls.zoom, panX: controls.panX, panY: controls.panY
    };
  }
  canvas.addEventListener('pointerdown', event => {
    if (event.button !== 0 && event.button !== 2) return;
    canvas.setPointerCapture(event.pointerId);
    pointers.set(event.pointerId,{ x: event.clientX, y: event.clientY });
    canvas.classList.add('dragging');
    if (pointers.size === 1) {
      gesture = { x: event.clientX, y: event.clientY, panX: controls.panX, panY: controls.panY,
        yaw: controls.yaw, pitch: controls.pitch, rotate: event.button === 2 || event.shiftKey || event.altKey };
      clickCandidate = event.button === 0 && !gesture.rotate ? { x: event.clientX, y: event.clientY } : null;
    } else {
      gesture = pointerSnapshot();
      clickCandidate = null;
    }
  });
  canvas.addEventListener('pointermove', event => {
    if (!pointers.has(event.pointerId) || !gesture) return;
    pointers.set(event.pointerId,{ x: event.clientX, y: event.clientY });
    if (clickCandidate && Math.hypot(event.clientX-clickCandidate.x,event.clientY-clickCandidate.y)>5) clickCandidate = null;
    if (pointers.size >= 2) {
      const current = pointerSnapshot();
      controls.zoom = THREE.MathUtils.clamp(gesture.zoom*current.distance/Math.max(gesture.distance,1),0.35,4);
      controls.panX = THREE.MathUtils.clamp(gesture.panX+(current.x-gesture.x)/innerWidth*Math.max(innerWidth/innerHeight,0.7),-2,2);
      controls.panY = THREE.MathUtils.clamp(gesture.panY+(current.y-gesture.y)/innerHeight,-1.5,1.5);
    } else if (gesture.rotate) {
      controls.yaw = THREE.MathUtils.clamp(gesture.yaw+(event.clientX-gesture.x)*0.12,-55,55);
      controls.pitch = THREE.MathUtils.clamp(gesture.pitch+(event.clientY-gesture.y)*0.10,-35,35);
    } else {
      controls.panX = THREE.MathUtils.clamp(gesture.panX+(event.clientX-gesture.x)/innerWidth*Math.max(innerWidth/innerHeight,0.7),-2,2);
      controls.panY = THREE.MathUtils.clamp(gesture.panY+(event.clientY-gesture.y)/innerHeight,-1.5,1.5);
    }
    refreshView();
  });
  function endPointer(event) {
    const active = pointers.has(event.pointerId);
    const shouldVary = active && event.type === 'pointerup' && clickCandidate && controls.clickVariations
      && Math.hypot(event.clientX-clickCandidate.x,event.clientY-clickCandidate.y)<=5;
    pointers.delete(event.pointerId);
    clickCandidate = null;
    if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
    if (pointers.size === 1) {
      const point = [...pointers.values()][0];
      gesture = { x: point.x, y: point.y, panX: controls.panX, panY: controls.panY, yaw: controls.yaw, pitch: controls.pitch, rotate: false };
    } else if (pointers.size === 0) { gesture = null; canvas.classList.remove('dragging'); }
    if (shouldVary) actions.newVariation();
  }
  canvas.addEventListener('pointerup',endPointer);
  canvas.addEventListener('pointercancel',endPointer);
  canvas.addEventListener('lostpointercapture',endPointer);
  canvas.addEventListener('contextmenu',event => event.preventDefault());
  canvas.addEventListener('wheel',event => {
    event.preventDefault();
    const delta = event.deltaY*(event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? innerHeight : 1);
    controls.zoom = THREE.MathUtils.clamp(controls.zoom*Math.exp(-delta*0.001),0.35,4);
    refreshView();
  }, { passive: false });

  function resize() {
    renderer.setPixelRatio(controls.pixelRatio);
    renderer.setSize(innerWidth, innerHeight);
    renderer.getDrawingBufferSize(uniforms.uResolution.value);
  }
  window.addEventListener('resize', resize, { passive: true });
  resize();

  let elapsed = 0;
  let previous = null;
  let frame = 0;
  function cameraMotion(name,phase) {
    const s = Math.sin(phase), c = Math.cos(phase), s2 = Math.sin(phase*2);
    // x, y, yaw, pitch, roll, relative zoom. All paths are forty-second loops.
    switch (name) {
      case 'Slow drift': return [0.032*s,0.014*s2,0,0,0,1];
      case 'Soft orbit': return [0.018*s,0.008*(1-c),0.16*s,0.07*(1-c),0,1+0.025*(1-c)];
      case 'Horizon glide': return [0.075*s,0,0.04*s,0,0,1];
      case 'Gentle dolly': return [0,0.010*(1-c),0,0.025*s,0,1+0.09*(1-c)];
      case 'Floating arc': return [0.04*s,0.025*(1-c),0.08*s,0.04*(1-c),0.012*s,1];
      case 'Tidal sway': return [0.014*s2,0.018*s,0.04*s,0.045*s,0.014*s,1+0.025*(1-c)];
      case 'Lemniscate': return [0.055*s,0.022*s2,0.07*s2,0.025*s,0,1+0.035*(1-c)];
      case 'Quiet spiral': return [0.030*s,0.018*(1-c),0.08*s,0.03*s2,0.018*s,1+0.055*(1-c)];
      default: return [0,0,0,0,0,1];
    }
  }
  function updateView(delta) {
    const phase = Math.PI*2*uniforms.uTime.value/SETTINGS.loopDuration;
    let motion = cameraMotion(controls.animation,phase);
    if (motionTransition < 1) {
      motionTransition = Math.min(1,motionTransition+delta/2);
      const t = motionTransition*motionTransition*(3-2*motionTransition);
      const from = cameraMotion(previousMotion,phase);
      motion = motion.map((value,index) => THREE.MathUtils.lerp(from[index],value,t));
    } else previousMotion = controls.animation;
    const amount = controls.motionAmount;
    uniforms.uPan.value.set(controls.panX+motion[0]*amount,controls.panY+motion[1]*amount);
    uniforms.uView.value.set(
      controls.zoom*(1+(motion[5]-1)*amount),
      THREE.MathUtils.degToRad(controls.yaw)+motion[2]*amount,
      THREE.MathUtils.degToRad(controls.pitch)+motion[3]*amount,
      THREE.MathUtils.degToRad(controls.roll)+motion[4]*amount
    );
  }
  function animate(now) {
    const delta = previous === null ? 0 : Math.max(0,(now-previous)*0.001);
    elapsed += delta*controls.speed;
    previous = now;
    uniforms.uTime.value = elapsed % SETTINGS.loopDuration;
    updateView(delta);
    renderer.render(scene,camera);
    frame = requestAnimationFrame(animate);
  }
  function start() {
    previous = null;
    cancelAnimationFrame(frame);
    frame = requestAnimationFrame(animate);
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { cancelAnimationFrame(frame); previous = null; }
    else start();
  });
  renderer.domElement.addEventListener('webglcontextlost', (event) => {
    event.preventDefault();
    cancelAnimationFrame(frame);
  });
  renderer.domElement.addEventListener('webglcontextrestored', start);
  window.addEventListener('pagehide', event => {
    cancelAnimationFrame(frame);
    if (event.persisted) return;
    gui.destroy();
    geometry.dispose();
    material.dispose();
    renderer.dispose();
  });
  window.addEventListener('pageshow',event => { if (event.persisted) start(); });
  start();
} catch (error) {
  console.error('Blue Afterimage could not start:',error);
  renderer?.dispose();
  const message = document.createElement('div');
  message.className = 'unavailable';
  message.textContent = 'This scene needs WebGL 2 and a connection to load Three.js. Please open it in a current browser.';
  document.body.appendChild(message);
}
</script>
</body>
</html>
