<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Witch's Cauldron with Volumetric Brew & Rising Bubbles</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #05080c;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      left: 0;
      top: 0;
      display: block;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
    }
  }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import GUI from 'lil-gui';

    // =========================================================================================
    // POST PROCESSOR SUITE (Inlined from postprocessing/PostProcessor.js for file:// execution)
    // =========================================================================================
    const orthoVertexShader = `
    precision highp float;
    in vec3 position;
    out vec2 vUv;
    void main() {
      vUv = position.xy * 0.5 + 0.5;
      gl_Position = vec4(position, 1.0);
    }
    `;

    const brightFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float bloomThreshold;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float luminance = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float knee = 0.1;
      float soft = luminance - bloomThreshold + knee;
      soft = clamp(soft, 0.0, 2.0 * knee);
      soft = (soft * soft) / (4.0 * knee + 0.00001);
      float contribution = max(soft, luminance - bloomThreshold);
      contribution /= max(luminance, 0.00001);
      fragColor = vec4(color.rgb * contribution, color.a);
    }
    `;

    const blur13ShaderChunk = `
    vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
      vec2 resolution = vec2(textureSize(image, 0));
      vec4 color = vec4(0.0);
      vec2 off1 = vec2(1.411764705882353) * direction;
      vec2 off2 = vec2(3.2941176470588234) * direction;
      vec2 off3 = vec2(5.176470588235294) * direction;
      color += texture(image, uv) * 0.1964825501511404;
      color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
      color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
      return color;
    }
    `;

    const blurFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 direction;
    in vec2 vUv;
    out vec4 color;
    ${blur13ShaderChunk}
    void main() {
      color = blur13(inputTexture, vUv, direction);
    }
    `;

    const finalFragmentShader = `
    precision highp float;
    uniform vec2 resolution;
    uniform sampler2D inputTexture;
    uniform sampler2D blur0Texture;
    uniform sampler2D blur1Texture;
    uniform sampler2D blur2Texture;
    uniform sampler2D blur3Texture;
    uniform sampler2D blur4Texture;
    uniform bool bloomEnabled;
    uniform float bloomStrength;
    uniform float vignetteBoost;
    uniform float vignetteReduction;
    uniform float noiseIntensity;
    uniform float time;
    in vec2 vUv;
    out vec4 fragColor;

    float vignette(vec2 uv, float boost, float reduction) {
      vec2 position = vUv - 0.5;
      return boost - length(position) * reduction;
    }

    float hash1(uint n) {
      n = (n << 13U) ^ n;
      n = n * (n * n * 15731U + 789221U) + 1376312589U;
      return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
    }

    float noise(in vec2 uv, in float timeVal) {
      uvec2 p = uvec2(uv);
      return hash1(p.x + 1920U * p.y + (1920U * 1080U) * uint(timeVal));
    }

    void main() {
      vec4 color = texture(inputTexture, vUv);

      if (bloomEnabled && bloomStrength > 0.001) {
        vec4 b0 = texture(blur0Texture, vUv);
        vec4 b1 = texture(blur1Texture, vUv);
        vec4 b2 = texture(blur2Texture, vUv);
        vec4 b3 = texture(blur3Texture, vUv);
        vec4 b4 = texture(blur4Texture, vUv);

        vec4 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
        color += bloomSum * bloomStrength;
      }

      color.rgb *= vignette(vUv, vignetteBoost, vignetteReduction);
      color.rgb += noiseIntensity * noise(gl_FragCoord.xy, time);
      fragColor = vec4(color.rgb, 1.0);
    }
    `;

    const chromaticAberrationShaderChunk = `
    vec2 barrelDistortion(vec2 coord, float amt) {
      vec2 cc = coord - 0.5;
      float dist = dot(cc, cc);
      return coord + cc * dist * amt;
    }
    float sat(float t) { return clamp(t, 0.0, 1.0); }
    float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
    float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
    vec4 spectrum_offset(float t) {
      float lo = step(t, 0.5);
      float hi = 1.0 - lo;
      float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
      vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
      return pow(ret, vec4(1.0 / 2.2));
    }
    const float max_distort = 2.2;
    const int num_iter = 8;
    const float reci_num_iter_f = 1.0 / float(num_iter);
    vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
      vec4 sumcol = vec4(0.0);
      vec4 sumw = vec4(0.0);
      for (int i = 0; i < num_iter; ++i) {
        float t = float(i) * reci_num_iter_f;
        vec4 w = spectrum_offset(t);
        sumw += w;
        sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
      }
      return sumcol / sumw;
    }
    `;

    const colorFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float exposure;
    uniform float chromaticAberrationAmount;
    uniform float minInputLevel;
    uniform float maxInputLevel;
    uniform float gammaLevel;
    uniform float fisheyeStrength;
    uniform float fisheyeRadius;
    uniform float time;
    in vec2 vUv;
    out vec4 fragColor;

    ${chromaticAberrationShaderChunk}

    vec2 applyFisheye(vec2 uv, float strength, float radius) {
      if (abs(strength) < 0.0001) return uv;
      vec2 p = uv - 0.5;
      float d = length(p);
      if (d > radius * 1.5) return uv;
      float r = d / max(radius, 0.001);
      float theta = atan(p.y, p.x);
      float rDist = r + strength * (r * r * r);
      return 0.5 + vec2(cos(theta), sin(theta)) * (rDist * radius);
    }

    vec3 gammaCorrect(vec3 color, vec3 gamma) {
      return pow(max(color, vec3(0.0)), 1.0 / gamma);
    }
    vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
      return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
    }
    vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
      return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
    }
    void main() {
      vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
      fragColor = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
      fragColor.rgb *= exposure;
      fragColor.rgb = finalLevels(fragColor.rgb, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
      fragColor.a = 1.0;
    }
    `;

    const copyFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      fragColor = texture(inputTexture, vUv);
    }
    `;

    function createFBO(w, h, options = {}) {
      return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
        wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
        wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
        minFilter: options.minFilter || THREE.LinearFilter,
        magFilter: options.magFilter || THREE.LinearFilter,
        format: options.format || THREE.RGBAFormat,
        type: options.type || THREE.HalfFloatType,
        stencilBuffer: options.stencilBuffer || false,
        depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : true,
        samples: options.samples || 0,
      });
    }

    class ShaderPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbo = createFBO(1, 1, options);
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
        this.texture = this.fbo.texture;
      }
      render(renderer, toScreen = false) {
        if (!toScreen) {
          renderer.setRenderTarget(this.fbo);
        }
        renderer.render(this.orthoScene, this.orthoCamera);
        if (!toScreen) {
          renderer.setRenderTarget(null);
        }
      }
      setSize(width, height) {
        this.fbo.setSize(Math.max(1, width), Math.max(1, height));
        this.orthoQuad.scale.set(width, height, 1);
      }
    }

    class ShaderPingPongPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
        this.currentFBO = 0;
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
      }
      render(renderer) {
        renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
        renderer.render(this.orthoScene, this.orthoCamera);
        renderer.setRenderTarget(null);
        this.currentFBO = 1 - this.currentFBO;
      }
      get current() { return this.fbos[this.currentFBO]; }
      get texture() { return this.current.texture; }
      setSize(width, height) {
        const w = Math.max(1, width);
        const h = Math.max(1, height);
        this.orthoQuad.scale.set(w, h, 1);
        this.fbos[0].setSize(w, h);
        this.fbos[1].setSize(w, h);
      }
    }

    class BloomPass {
      constructor(strength = 0.8, radius = 0.5, threshold = 0.2, levels = 5) {
        this.strength = strength;
        this.radius = radius;
        this.threshold = threshold;
        this.enabled = true;
        this.levels = levels;

        this.brightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            bloomThreshold: { value: this.threshold },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: brightFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.brightPass = new ShaderPass(this.brightShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.blurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            direction: { value: new THREE.Vector2(0, 1) },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: blurFragmentShader,
          glslVersion: THREE.GLSL3,
        });

        this.blurPasses = [];
        for (let i = 0; i < this.levels; i++) {
          this.blurPasses.push(new ShaderPingPongPass(this.blurShader, {
            format: THREE.RGBAFormat,
            type: THREE.HalfFloatType,
          }));
        }
      }

      setSize(w, h) {
        let tw = Math.max(1, w);
        let th = Math.max(1, h);
        this.brightPass.setSize(tw, th);
        for (let i = 0; i < this.levels; i++) {
          tw = Math.max(1, Math.round(tw / 2));
          th = Math.max(1, Math.round(th / 2));
          this.blurPasses[i].setSize(tw, th);
        }
      }

      set source(texture) {
        this.brightShader.uniforms.inputTexture.value = texture;
      }

      render(renderer) {
        if (!this.enabled || this.strength <= 0.001) return;

        this.brightShader.uniforms.bloomThreshold.value = this.threshold;
        this.brightPass.render(renderer);

        const baseOffset = Math.max(0.1, this.radius * 2.0);
        const u = this.blurShader.uniforms;

        for (let j = 0; j < this.levels; j++) {
          const blurPass = this.blurPasses[j];
          const stepOffset = baseOffset * (1.0 + j * 0.5);

          u.direction.value.set(stepOffset, 0);
          u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
          blurPass.render(renderer);

          u.direction.value.set(0, stepOffset * 0.5);
          u.inputTexture.value = blurPass.current.texture;
          blurPass.render(renderer);
        }
      }
    }

    class PostProcessor {
      constructor(renderer, params = {}) {
        this.renderer = renderer;

        this.settings = {
          enabled: params.enabled !== undefined ? params.enabled : true,
          antialias: params.antialias !== undefined ? params.antialias : true,
          exposure: params.exposure !== undefined ? params.exposure : 1.35,
          bloomEnabled: params.bloomEnabled !== undefined ? params.bloomEnabled : true,
          bloomStrength: params.bloomStrength !== undefined ? params.bloomStrength : 0.85,
          bloomRadius: params.bloomRadius !== undefined ? params.bloomRadius : 0.5,
          bloomThreshold: params.bloomThreshold !== undefined ? params.bloomThreshold : 0.28,
          fisheyeStrength: params.fisheyeStrength !== undefined ? params.fisheyeStrength : 0.0,
          fisheyeRadius: params.fisheyeRadius !== undefined ? params.fisheyeRadius : 1.0,
          chromaticAberration: params.chromaticAberration !== undefined ? params.chromaticAberration : 0.012,
          vignetteBoost: params.vignetteBoost !== undefined ? params.vignetteBoost : 1.05,
          vignetteReduction: params.vignetteReduction !== undefined ? params.vignetteReduction : 0.45,
          noiseIntensity: params.noiseIntensity !== undefined ? params.noiseIntensity : 0.015,
          gamma: params.gamma !== undefined ? params.gamma : 1.0,
          minInputLevel: params.minInputLevel !== undefined ? params.minInputLevel : 0.0,
          maxInputLevel: params.maxInputLevel !== undefined ? params.maxInputLevel : 1.0,
        };

        this.sceneTarget = createFBO(1, 1, {
          type: THREE.HalfFloatType,
          samples: this.settings.antialias ? 4 : 0
        });

        this.bloomPass = new BloomPass(
          this.settings.bloomStrength,
          this.settings.bloomRadius,
          this.settings.bloomThreshold,
          5
        );

        this.finalShader = new THREE.RawShaderMaterial({
          uniforms: {
            resolution: { value: new THREE.Vector2(1, 1) },
            bloomEnabled: { value: this.settings.bloomEnabled },
            bloomStrength: { value: this.settings.bloomStrength },
            vignetteBoost: { value: this.settings.vignetteBoost },
            vignetteReduction: { value: this.settings.vignetteReduction },
            noiseIntensity: { value: this.settings.noiseIntensity },
            inputTexture: { value: null },
            blur0Texture: { value: null },
            blur1Texture: { value: null },
            blur2Texture: { value: null },
            blur3Texture: { value: null },
            blur4Texture: { value: null },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: finalFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.finalPass = new ShaderPass(this.finalShader);

        this.rgbShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: this.finalPass.texture },
            exposure: { value: this.settings.exposure },
            fisheyeStrength: { value: this.settings.fisheyeStrength },
            fisheyeRadius: { value: this.settings.fisheyeRadius },
            chromaticAberrationAmount: { value: this.settings.chromaticAberration },
            minInputLevel: { value: this.settings.minInputLevel },
            maxInputLevel: { value: this.settings.maxInputLevel },
            gammaLevel: { value: this.settings.gamma },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: colorFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.rgbPass = new ShaderPass(this.rgbShader);

        this.copyShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: copyFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.copyPass = new ShaderPass(this.copyShader);
      }

      setAntialias(enabled) {
        this.settings.antialias = enabled;
        const targetSamples = enabled ? 4 : 0;
        if (this.sceneTarget.samples !== targetSamples) {
          this.sceneTarget.samples = targetSamples;
          this.sceneTarget.dispose();
        }
      }

      updateSettings() {
        this.bloomPass.enabled = this.settings.bloomEnabled;
        this.bloomPass.strength = this.settings.bloomStrength;
        this.bloomPass.radius = this.settings.bloomRadius;
        this.bloomPass.threshold = this.settings.bloomThreshold;

        this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
        this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
        this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
        this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
        this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;

        this.rgbShader.uniforms.exposure.value = this.settings.exposure;
        this.rgbShader.uniforms.fisheyeStrength.value = this.settings.fisheyeStrength;
        this.rgbShader.uniforms.fisheyeRadius.value = this.settings.fisheyeRadius;
        this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
        this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
        this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
        this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
      }

      setSize(w0, h0, dpr = 1) {
        const w = Math.max(1, Math.floor(w0 * dpr));
        const h = Math.max(1, Math.floor(h0 * dpr));
        this.sceneTarget.setSize(w, h);
        this.finalPass.setSize(w, h);
        this.finalShader.uniforms.resolution.value.set(w, h);
        this.bloomPass.setSize(w, h);
        this.rgbPass.setSize(w, h);
        this.copyPass.setSize(w, h);
      }

      renderScene(scene, camera) {
        if (!this.settings.enabled) {
          this.renderer.render(scene, camera);
          return;
        }
        this.renderer.setRenderTarget(this.sceneTarget);
        this.renderer.render(scene, camera);
        this.renderer.setRenderTarget(null);
        this.render(this.sceneTarget.texture);
      }

      render(sourceTexture) {
        if (!this.settings.enabled) {
          this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
          this.copyPass.render(this.renderer, true);
          return;
        }

        this.updateSettings();

        this.bloomPass.source = sourceTexture;
        this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
        this.bloomPass.render(this.renderer);

        this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
        this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
        this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
        this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
        this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

        const randomTime = Math.random() * 100000;
        this.finalPass.shader.uniforms.time.value = randomTime;
        this.rgbPass.shader.uniforms.time.value = randomTime;

        this.finalPass.render(this.renderer);
        this.rgbPass.render(this.renderer, true);
      }

      attachGUI(gui, title = "Post-Processing Suite") {
        const root = gui.addFolder(title);
        root.add(this.settings, "enabled").name("Enable Suite");
        root.add(this.settings, "antialias").name("Antialias (MSAA)").onChange(v => {
          this.setAntialias(v);
          if (params.antialias !== v) {
            params.antialias = v;
            syncGuiControllers();
          }
        });

        const bloom = root.addFolder("Bloom");
        bloom.add(this.settings, "bloomEnabled").name("Enable Bloom").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomStrength", 0, 3.0, 0.05).name("Strength").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomRadius", 0, 2.0, 0.05).name("Radius").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomThreshold", 0, 1.0, 0.01).name("Threshold").onChange(() => this.updateSettings());

        const lens = root.addFolder("Lens, Optics & Fisheye");
        lens.add(this.settings, "fisheyeStrength", -1.0, 1.5, 0.01).name("Fisheye Distortion").onChange(() => this.updateSettings());
        lens.add(this.settings, "fisheyeRadius", 0.2, 2.0, 0.05).name("Fisheye Radius").onChange(() => this.updateSettings());
        lens.add(this.settings, "chromaticAberration", 0, 0.2, 0.005).name("Chromatic Aberration").onChange(() => this.updateSettings());
        lens.add(this.settings, "vignetteBoost", 0, 2.0, 0.05).name("Vignette Boost").onChange(() => this.updateSettings());
        lens.add(this.settings, "vignetteReduction", 0, 2.0, 0.05).name("Vignette Falloff").onChange(() => this.updateSettings());
        lens.add(this.settings, "noiseIntensity", 0, 0.1, 0.005).name("Film Grain").onChange(() => this.updateSettings());
        lens.add(this.settings, "gamma", 0.2, 2.0, 0.05).name("Gamma").onChange(() => this.updateSettings());
        lens.add(this.settings, "minInputLevel", 0, 0.5, 0.01).name("Black Level").onChange(() => this.updateSettings());
        lens.add(this.settings, "maxInputLevel", 0.5, 1.0, 0.01).name("White Level").onChange(() => this.updateSettings());

        return root;
      }
    }

    // --- 18 PRECONFIGURED COLOR SCHEMES ---
    const COLOR_SCHEMES = {
      'Monochromatic': {
        liquid: '#00ff66',
        liquidDeep: '#023a15',
        bubble: '#55ff99',
        underglow: '#ff5500',
        smoke: '#267344',
        cauldron: '#343b40',
        background: '#040907'
      },
      'Analogous': {
        liquid: '#00e5ff',
        liquidDeep: '#00474f',
        bubble: '#76ff03',
        underglow: '#ff6600',
        smoke: '#38d9a9',
        cauldron: '#2e383e',
        background: '#030d0f'
      },
      'Complementary': {
        liquid: '#00ff66',
        liquidDeep: '#003816',
        bubble: '#33ff88',

    function generateIronBumpTexture() {
      const size = 256;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      const imgData = ctx.createImageData(size, size);
      const d = imgData.data;
      for (let i = 0; i < size * size; i++) {
        const val = Math.floor(Math.random() * 90 + 110);
        d[i * 4] = val;
        d[i * 4 + 1] = val;
        d[i * 4 + 2] = val;
        d[i * 4 + 3] = 255;
      }
      ctx.putImageData(imgData, 0, 0);
      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(6, 6);
      return texture;
    }
    const ironBumpMap = generateIronBumpTexture();

    function generateRippleNormalMap() {
      const size = 256;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      const imgData = ctx.createImageData(size, size);
      const d = imgData.data;

      const height = new Float32Array(size * size);
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const u = (x / size) * Math.PI * 4;
          const v = (y / size) * Math.PI * 4;
          const h = Math.sin(u) * Math.cos(v) * 0.5 +
                    Math.sin(u * 2 + v) * 0.25 +
                    Math.cos(u - v * 2) * 0.25;
          height[y * size + x] = h;
        }
      }

      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const xL = (x - 1 + size) % size;
          const xR = (x + 1) % size;
          const yU = (y - 1 + size) % size;
          const yD = (y + 1) % size;

          const dx = (height[y * size + xR] - height[y * size + xL]) * 2.2;
          const dy = (height[yD * size + x] - height[yU * size + x]) * 2.2;
          const len = Math.sqrt(dx * dx + dy * dy + 1.0);

          const nx = (-dx / len) * 0.5 + 0.5;
          const ny = (-dy / len) * 0.5 + 0.5;
          const nz = (1.0 / len) * 0.5 + 0.5;

          const idx = (y * size + x) * 4;
          d[idx] = Math.floor(nx * 255);
          d[idx + 1] = Math.floor(ny * 255);
          d[idx + 2] = Math.floor(nz * 255);
          d[idx + 3] = 255;
        }
      }
      ctx.putImageData(imgData, 0, 0);
      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      return texture;
    }

    function generateSmokeTexture() {
      const size = 256;

      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      ctx.clearRect(0, 0, size, size);

      const puffs = [
        { x: 128, y: 128, r: 100, a: 0.35 },
        { x: 110, y: 115, r: 80, a: 0.25 },
        { x: 145, y: 120, r: 75, a: 0.22 },
        { x: 120, y: 145, r: 70, a: 0.25 },
        { x: 138, y: 140, r: 65, a: 0.20 }
      ];

      for (const p of puffs) {
        const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
        grad.addColorStop(0, `rgba(255, 255, 255, ${p.a})`);
        grad.addColorStop(0.4, `rgba(255, 255, 255, ${p.a * 0.6})`);
        grad.addColorStop(0.8, `rgba(255, 255, 255, ${p.a * 0.15})`);
        grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }

      return new THREE.CanvasTexture(canvas);
    }

      const ringGeo = new THREE.TorusGeometry(0.25, 0.05, 16, 32);

      ring.position.set(side * 1.68, 1.92, 0);
      ring.rotation.y = Math.PI / 2;
      ring.rotation.x = side * 0.22;
      cauldronGroup.add(ring);
    }

    // --- 4. VOLUMETRIC BREW LIQUID SURFACE WITH VERTEX DISPLACEMENT & NORMAL MAP SHADER ---
    const LIQUID_Y = 2.18;
    const LIQUID_RADIUS = 1.28;
    const liquidGeo = new THREE.CircleGeometry(LIQUID_RADIUS, 96, 48);
    liquidGeo.rotateX(-Math.PI / 2);

    const liquidUniforms = {
      uTime: { value: 0 },
      uColor: { value: new THREE.Color(params.liquidColor) },
      uDeepColor: { value: new THREE.Color(params.liquidDeepColor) },
      uUnderglowColor: { value: new THREE.Color(params.underglowColor) },
      uNormalMap: { value: liquidNormalMap },
      uWaveHeight: { value: params.waveHeight },
      uWaveFreq: { value: params.waveFreq },
      uViscosity: { value: params.viscosity },
      uNormalScale: { value: params.normalScale },
      uCameraPos: { value: camera.position },
      uLightPos: { value: dirLight.position }
    };

    const liquidVertShader = `
      uniform float uTime;
      uniform float uWaveHeight;
      uniform float uWaveFreq;
      uniform float uViscosity;
      varying vec2 vUv;
      varying vec3 vWorldPos;
      varying vec3 vNormalVec;
      varying float vElevation;

      float calculateWave(vec2 p, float t) {
        float r = length(p);
        float w1 = sin(r * uWaveFreq * 3.5 - t * 3.2 * uViscosity) * 0.45;
        float w2 = sin(p.x * uWaveFreq * 2.8 + t * 2.2) * cos(p.y * uWaveFreq * 2.8 - t * 1.9) * 0.35;
        float w3 = sin((p.x + p.y) * uWaveFreq * 3.2 + t * 3.6) * 0.22;
        float angle = atan(p.y, p.x);
        float w4 = sin(angle * 4.0 + r * uWaveFreq * 4.2 - t * 2.4) * 0.16;

        float rimDamp = smoothstep(1.30, 0.40, r);
        return (w1 + w2 + w3 + w4) * uWaveHeight * rimDamp;
      }

      void main() {
        vUv = uv;
        vec3 pos = position;

        float h = calculateWave(pos.xz, uTime);
        pos.y += h;
        vElevation = h;

        float eps = 0.025;
        float hX = calculateWave(pos.xz + vec2(eps, 0.0), uTime);
        float hZ = calculateWave(pos.xz + vec2(0.0, eps), uTime);
        vec3 tangX = vec3(eps, hX - h, 0.0);
        vec3 tangZ = vec3(0.0, hZ - h, eps);
        vec3 computedNormal = normalize(cross(tangZ, tangX));

        vNormalVec = normalize(normalMatrix * computedNormal);
        vec4 wPos = modelMatrix * vec4(pos, 1.0);
        vWorldPos = wPos.xyz;
        gl_Position = projectionMatrix * viewMatrix * wPos;
      }
    `;

    const liquidFragShader = `
      uniform vec3 uColor;
      uniform vec3 uDeepColor;
      uniform vec3 uUnderglowColor;
      uniform vec3 uCameraPos;
      uniform vec3 uLightPos;
      uniform sampler2D uNormalMap;
      uniform float uTime;
      uniform float uNormalScale;
      varying vec2 vUv;
      varying vec3 vWorldPos;
      varying vec3 vNormalVec;
      varying float vElevation;

      void main() {
        vec2 uv1 = vUv * 3.5 + vec2(uTime * 0.04, uTime * 0.025);
        vec2 uv2 = vUv * 5.0 - vec2(uTime * 0.03, -uTime * 0.045);
        vec3 n1 = texture2D(uNormalMap, uv1).rgb * 2.0 - 1.0;
        vec3 n2 = texture2D(uNormalMap, uv2).rgb * 2.0 - 1.0;
        vec3 rippleNormal = normalize(n1 + n2);

        vec3 N = normalize(vNormalVec + vec3(rippleNormal.x, rippleNormal.z, rippleNormal.y) * uNormalScale);
        vec3 V = normalize(uCameraPos - vWorldPos);
        vec3 L = normalize(uLightPos - vWorldPos);
        vec3 H = normalize(L + V);

        float diff = max(dot(N, L), 0.0);
        float spec = pow(max(dot(N, H), 0.0), 64.0);
        float fresnel = pow(1.0 - max(dot(N, V), 0.0), 2.8);

        float depth = clamp((vElevation * 7.0) + 0.5, 0.0, 1.0);
        vec3 brewColor = mix(uDeepColor, uColor, depth);

        float r = length(vWorldPos.xz);
        float rimFoam = smoothstep(1.05, 1.28, r) * 0.55;

        vec3 color = brewColor * (0.50 + 0.50 * diff)
                   + uColor * fresnel * 0.95
                   + vec3(1.0) * spec * 0.90
                   + uUnderglowColor * (0.25 + 0.75 * fresnel)
                   + uColor * rimFoam;

        gl_FragColor = vec4(color, 0.98);
      }
    `;

    const liquidMaterial = new THREE.ShaderMaterial({
      vertexShader: liquidVertShader,
      fragmentShader: liquidFragShader,
      uniforms: liquidUniforms,
      transparent: true,
      side: THREE.DoubleSide
    });

    const liquidMesh = new THREE.Mesh(liquidGeo, liquidMaterial);
    liquidMesh.position.y = LIQUID_Y;
    cauldronGroup.add(liquidMesh);

    // --- 5. RISING INSTANCED BUBBLES WITH PROCEDURAL SCALING & POPPING CYCLES ---
    const BUBBLE_COUNT = 140;
    const bubbleGeo = new THREE.SphereGeometry(1, 24, 18);
    const bubbleMat = new THREE.MeshPhysicalMaterial({
      color: new THREE.Color(params.bubbleColor),
      emissive: new THREE.Color(params.bubbleColor),
      emissiveIntensity: 0.75,
      roughness: 0.08,
      metalness: 0.12,
      transmission: 0.82,
      ior: 1.34,
      thickness: 0.45,
      transparent: true,
      opacity: 0.92,
      depthWrite: false
    });

    const bubblesMesh = new THREE.InstancedMesh(bubbleGeo, bubbleMat, BUBBLE_COUNT);
    bubblesMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    cauldronGroup.add(bubblesMesh);

    const bubbleData = [];
    const dummyObj = new THREE.Object3D();

    function initBubble(i, randomInitialLife = true) {
      const radiusDist = Math.sqrt(Math.random()) * 0.92;
      const angle = Math.random() * Math.PI * 2;
      return {
        x: Math.cos(angle) * radiusDist,
        z: Math.sin(angle) * radiusDist,
        startY: 1.25 + Math.random() * 0.65,
        targetScale: 0.045 + Math.random() * 0.12,
        speed: 0.28 + Math.random() * 0.42,
        wobbleSpeed: 2.2 + Math.random() * 2.8,
        wobbleAmp: 0.015 + Math.random() * 0.03,
        phase: Math.random() * Math.PI * 2,
        life: randomInitialLife ? Math.random() : 0.0,
        popping: false
      };
    }

    for (let i = 0; i < BUBBLE_COUNT; i++) {
      bubbleData.push(initBubble(i, true));
    }

    function getBrewHeight(x, z, time) {
      const r = Math.sqrt(x * x + z * z);
      const w1 = Math.sin(r * params.waveFreq * 3.5 - time * 3.2 * params.viscosity) * 0.45;
      const w2 = Math.sin(x * params.waveFreq * 2.8 + time * 2.2) * Math.cos(z * params.waveFreq * 2.8 - time * 1.9) * 0.35;
      const w3 = Math.sin((x + z) * params.waveFreq * 3.2 + time * 3.6) * 0.22;
      const angle = Math.atan2(z, x);
      const w4 = Math.sin(angle * 4.0 + r * params.waveFreq * 4.2 - time * 2.4) * 0.16;
      const rimDamp = Math.max(0, Math.min(1, (1.30 - r) / (1.30 - 0.40)));
      return (w1 + w2 + w3 + w4) * params.waveHeight * rimDamp;
    }

    // --- 6. RISING VAPOR CLOUDS PARTICLE SYSTEM ---
    const VAPOR_COUNT = 450;
    const vaporGeo = new THREE.BufferGeometry();
    const vaporPositions = new Float32Array(VAPOR_COUNT * 3);
    const vaporSizes = new Float32Array(VAPOR_COUNT);
    const vaporAlphas = new Float32Array(VAPOR_COUNT);
    const vaporHeights = new Float32Array(VAPOR_COUNT);

    const vaporData = [];

    function initVaporParticle(i, randomizeAge = true) {
      const angle = Math.random() * Math.PI * 2;
      const rad = Math.sqrt(Math.random()) * 1.05;
      const life = randomizeAge ? Math.random() : 0.0;
      return {
        x: Math.cos(angle) * rad,
        y: LIQUID_Y + 0.05 + life * 3.8,
        z: Math.sin(angle) * rad,
        vx: (Math.random() - 0.5) * 0.06,
        vy: 0.40 + Math.random() * 0.50,
        vz: (Math.random() - 0.5) * 0.06,
        scale: 0.35 + Math.random() * 0.45,
        life: life,
        maxLife: 3.8 + Math.random() * 2.2
      };
    }

    for (let i = 0; i < VAPOR_COUNT; i++) {
      vaporData.push(initVaporParticle(i, true));
      vaporPositions[i * 3] = vaporData[i].x;
      vaporPositions[i * 3 + 1] = vaporData[i].y;
      vaporPositions[i * 3 + 2] = vaporData[i].z;
      vaporSizes[i] = 1.0;
      vaporAlphas[i] = 0.5;
      vaporHeights[i] = 0.0;
    }

    vaporGeo.setAttribute('position', new THREE.BufferAttribute(vaporPositions, 3));
    vaporGeo.setAttribute('size', new THREE.BufferAttribute(vaporSizes, 1));
    vaporGeo.setAttribute('alpha', new THREE.BufferAttribute(vaporAlphas, 1));
    vaporGeo.setAttribute('heightProg', new THREE.BufferAttribute(vaporHeights, 1));

    const vaporMat = new THREE.ShaderMaterial({
      uniforms: {
        uTexture: { value: smokeTexture },
        uLiquidColor: { value: new THREE.Color(params.liquidColor) },
        uSmokeColor: { value: new THREE.Color(params.smokeColor) },
        uOpacity: { value: params.vaporOpacity }
      },
      vertexShader: `
        attribute float size;
        attribute float alpha;
        attribute float heightProg;
        varying float vAlpha;
        varying float vHeightProg;

        void main() {
          vAlpha = alpha;
          vHeightProg = heightProg;
          vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
          gl_PointSize = size * (340.0 / -mvPosition.z);
          gl_Position = projectionMatrix * mvPosition;
        }
      `,
      fragmentShader: `
        uniform sampler2D uTexture;
        uniform vec3 uLiquidColor;
        uniform vec3 uSmokeColor;
        uniform float uOpacity;
        varying float vAlpha;
        varying float vHeightProg;

        void main() {
          vec4 tex = texture2D(uTexture, gl_PointCoord);
          vec3 cloudColor = mix(uLiquidColor * 1.3, uSmokeColor, smoothstep(0.05, 0.65, vHeightProg));
          gl_FragColor = vec4(cloudColor, tex.a * vAlpha * uOpacity);
        }
      `,
      transparent: true,
      depthWrite: false,
      blending: THREE.NormalBlending
    });

    const vaporPoints = new THREE.Points(vaporGeo, vaporMat);
    scene.add(vaporPoints);

    function triggerPopVapor(x, y, z) {
      for (let i = 0; i < 5; i++) {
        const randIdx = Math.floor(Math.random() * VAPOR_COUNT);
        const p = vaporData[randIdx];
        p.x = x + (Math.random() - 0.5) * 0.06;
        p.y = y + 0.04;
        p.z = z + (Math.random() - 0.5) * 0.06;
        p.vx = (Math.random() - 0.5) * 0.18;
        p.vy = 0.65 + Math.random() * 0.55;
        p.vz = (Math.random() - 0.5) * 0.18;
        p.life = 0;
        p.maxLife = 2.2;
      }
    }

    // --- COLOR PALETTE APPLIER ---
    function applyColorScheme(schemeName) {
      const s = COLOR_SCHEMES[schemeName] || COLOR_SCHEMES['Monochromatic'];
      params.colorScheme = schemeName;
      params.liquidColor = s.liquid;
      params.liquidDeepColor = s.liquidDeep;
      params.bubbleColor = s.bubble;
      params.underglowColor = s.underglow;
      params.smokeColor = s.smoke;
      params.cauldronColor = s.cauldron;
      params.backgroundColor = s.background;

      updateMaterialsColors();
      syncGuiControllers();
    }

    function updateMaterialsColors() {
      liquidUniforms.uColor.value.set(params.liquidColor);
      liquidUniforms.uDeepColor.value.set(params.liquidDeepColor);
      liquidUniforms.uUnderglowColor.value.set(params.underglowColor);

      bubbleMat.color.set(params.bubbleColor);
      bubbleMat.emissive.set(params.bubbleColor);

      vaporMat.uniforms.uLiquidColor.value.set(params.liquidColor);
      vaporMat.uniforms.uSmokeColor.value.set(params.smokeColor);

      cauldronMat.color.set(params.cauldronColor);
      cauldronMat.metalness = params.cauldronMetalness;
      cauldronMat.roughness = params.cauldronRoughness;

      underLight.color.set(params.underglowColor);
      brewLight.color.set(params.liquidColor);
      emberMat.uniforms.uColor.value.set(params.underglowColor);
      sparkMat.color.set(params.underglowColor);

      if (!params.greenScreen) {
        scene.background.set(params.backgroundColor);
        scene.fog.color.set(params.backgroundColor);
      }
    }

    function applyGreenScreen(enabled) {
      if (enabled) {
        scene.background.set(0x00ff00);
        scene.fog.color.set(0x00ff00);
        floor.visible = false;
        hearthShadow.visible = false;
        postProcessor.settings.vignetteReduction = 0.0;
      } else {
        scene.background.set(params.backgroundColor);
        scene.fog.color.set(params.backgroundColor);
        floor.visible = true;
        hearthShadow.visible = true;
        postProcessor.settings.vignetteReduction = 0.45;
      }
      postProcessor.updateSettings();
    }

    // --- PROCEDURAL RE-ROLL / RANDOMIZE ON CLICK ---
    function randomizeScene() {
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      applyColorScheme(randomScheme);

      params.waveHeight = THREE.MathUtils.randFloat(0.04, 0.15);
      params.waveFreq = THREE.MathUtils.randFloat(2.2, 5.2);
      params.viscosity = THREE.MathUtils.randFloat(0.6, 1.8);
      params.normalScale = THREE.MathUtils.randFloat(0.6, 1.4);

      params.bubbleSpeed = THREE.MathUtils.randFloat(0.6, 1.8);
      params.bubbleScale = THREE.MathUtils.randFloat(0.6, 1.4);
      params.bubbleWobble = THREE.MathUtils.randFloat(0.5, 1.4);
      params.vaporOpacity = THREE.MathUtils.randFloat(0.35, 0.75);

      params.exposure = THREE.MathUtils.randFloat(1.1, 1.6);

      dirLight.intensity = params.keyLightIntensity;

      liquidUniforms.uWaveHeight.value = params.waveHeight;
      liquidUniforms.uWaveFreq.value = params.waveFreq;
      liquidUniforms.uViscosity.value = params.viscosity;
      liquidUniforms.uNormalScale.value = params.normalScale;
      vaporMat.uniforms.uOpacity.value = params.vaporOpacity;
      underLight.intensity = params.underglowIntensity;

      syncGuiControllers();
    }

    // --- LIL-GUI INITIALIZATION ---
    const gui = new GUI({ title: "Witch's Cauldron" });

    // Folder 1: Scene & Animation
    const fScene = gui.addFolder('Scene & Animation');

    fScene.add(params, 'animationSpeed', 0.0, 3.0, 0.05).name('Speed');

    // Folder 3: Post-Processing Suite Controls

    fColors.addColor(params, 'backgroundColor').name('Background').onChange(() => updateMaterialsColors()).listen();

    // Folder 5: Volumetric Brew & Waves
    const fBrew = gui.addFolder('Volumetric Brew & Waves');

    // Folder 6: Bubbles & Vapor
    const fParticles = gui.addFolder('Bubbles & Vapor');

    function syncGuiControllers() {
      gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    // --- KEYBOARD LISTENER (H to Hide/Show UI) ---
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        if (gui._hidden) {
          gui.show();
        } else {
          gui.hide();
        }
      }
    });

    // --- INTERACTION: CLICK TO RANDOMIZE (Distinguish Click vs Drag) ---
    let pointerDownPos = { x: 0, y: 0 };
    let pointerDownTime = 0;

    window.addEventListener('pointerdown', (e) => {
      pointerDownPos.x = e.clientX;
      pointerDownPos.y = e.clientY;
      pointerDownTime = performance.now();
    });

    window.addEventListener('pointerup', (e) => {
      if (e.target.closest && e.target.closest('.lil-gui')) return;

      const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
      const timeDiff = performance.now() - pointerDownTime;

      if (dist < 6 && timeDiff < 350) {
        if (params.clickToRandomize) {
          randomizeScene();
        }
      }
    });

    // --- ANIMATION LOOP ---
    const clock = new THREE.Clock();
    let animTimer = 0;

    function animate() {
      requestAnimationFrame(animate);

      const rawDelta = clock.getDelta();
      const dt = Math.min(rawDelta, 0.1) * params.animationSpeed;
      animTimer += dt;

      liquidUniforms.uTime.value = animTimer;
      liquidUniforms.uCameraPos.value.copy(camera.position);

      const flicker = 1.0 + Math.sin(animTimer * 12.0) * 0.08 + Math.cos(animTimer * 23.0) * 0.06;
      underLight.intensity = params.underglowIntensity * flicker;
      emberMat.uniforms.uIntensity.value = flicker;
      emberMat.uniforms.uTime.value = animTimer;
      brewLight.intensity = params.brewLightIntensity + Math.sin(animTimer * 5.0) * 0.3;

      // Update Sparks
      const sparkPosAttr = sparkGeo.attributes.position;
      const spArr = sparkPosAttr.array;
      for (let i = 0; i < SPARK_COUNT; i++) {
        const sp = sparkData[i];
        sp.y += sp.speed * dt;
        sp.x += sp.drift * dt;
        if (sp.y > 1.8) {
          sp.y = 0.05;
          const angle = Math.random() * Math.PI * 2;
          const rad = 0.2 + Math.random() * 0.6;
          sp.x = Math.cos(angle) * rad;
          sp.z = Math.sin(angle) * rad;
        }
        spArr[i * 3] = sp.x;
        spArr[i * 3 + 1] = sp.y;
        spArr[i * 3 + 2] = sp.z;
      }
      sparkPosAttr.needsUpdate = true;

      // Update Instanced Bubbles with Strict Boundary Clamping
      for (let i = 0; i < BUBBLE_COUNT; i++) {
        const b = bubbleData[i];
        b.life += dt * b.speed * params.bubbleSpeed;

        if (b.life < 0.72) {
          const riseProg = b.life / 0.72;
          const wobble = Math.sin(animTimer * b.wobbleSpeed + b.phase) * b.wobbleAmp * params.bubbleWobble;
          let currX = b.x + wobble;
          let currZ = b.z + Math.cos(animTimer * b.wobbleSpeed + b.phase) * b.wobbleAmp * params.bubbleWobble;
          const currY = b.startY + riseProg * (LIQUID_Y - b.startY);

          const curScale = b.targetScale * params.bubbleScale * THREE.MathUtils.smoothstep(riseProg, 0.0, 0.3);

          const maxAllowedRadius = Math.max(0.2, 1.18 - curScale);
          const currentRadius = Math.hypot(currX, currZ);
          if (currentRadius > maxAllowedRadius && currentRadius > 0.001) {
            const factor = maxAllowedRadius / currentRadius;
            currX *= factor;
            currZ *= factor;
          }

          dummyObj.position.set(currX, currY, currZ);
          dummyObj.scale.set(curScale, curScale, curScale);
          dummyObj.rotation.set(0, 0, 0);
        } else if (b.life < 0.93) {
          const surfaceProgress = (b.life - 0.72) / (0.93 - 0.72);
          const wobble = Math.sin(animTimer * b.wobbleSpeed + b.phase) * b.wobbleAmp * 0.4 * params.bubbleWobble;
          let currX = b.x + wobble;
          let currZ = b.z + Math.cos(animTimer * b.wobbleSpeed + b.phase) * b.wobbleAmp * 0.4 * params.bubbleWobble;

          const baseS = b.targetScale * params.bubbleScale * (1.0 + surfaceProgress * 0.25);

          const maxAllowedRadius = Math.max(0.2, 1.18 - baseS);
          const currentRadius = Math.hypot(currX, currZ);
          if (currentRadius > maxAllowedRadius && currentRadius > 0.001) {
            const factor = maxAllowedRadius / currentRadius;
            currX *= factor;
            currZ *= factor;
          }

          const waveElevation = getBrewHeight(currX, currZ, animTimer);
          const currY = LIQUID_Y + waveElevation;

          dummyObj.position.set(currX, currY + baseS * 0.45, currZ);
          dummyObj.scale.set(baseS * 1.12, baseS * 0.88, baseS * 1.12);
        } else if (b.life <= 1.0) {
          const popProgress = (b.life - 0.93) / 0.07;
          if (!b.popping) {
            b.popping = true;
            triggerPopVapor(b.x, LIQUID_Y, b.z);
          }

          let popScale = 0.0001;
          if (popProgress < 0.35) {
            popScale = b.targetScale * params.bubbleScale * (1.20 + popProgress * 1.3);
          } else {
            popScale = 0.0001;
          }

          let currX = b.x;
          let currZ = b.z;
          const maxAllowedRadius = Math.max(0.2, 1.18 - popScale);
          const currentRadius = Math.hypot(currX, currZ);
          if (currentRadius > maxAllowedRadius && currentRadius > 0.001) {
            const factor = maxAllowedRadius / currentRadius;
            currX *= factor;
            currZ *= factor;
          }

          const currY = LIQUID_Y + getBrewHeight(currX, currZ, animTimer);
          dummyObj.position.set(currX, currY, currZ);
          dummyObj.scale.set(popScale, popScale, popScale);
        } else {
          bubbleData[i] = initBubble(i, false);
          dummyObj.position.set(0, -20, 0);
          dummyObj.scale.set(0.0001, 0.0001, 0.0001);
        }

        dummyObj.updateMatrix();
        bubblesMesh.setMatrixAt(i, dummyObj.matrix);
      }
      bubblesMesh.instanceMatrix.needsUpdate = true;

      // Update Vapor / Smoke Particles
      const posAttr = vaporGeo.attributes.position;
      const sizeAttr = vaporGeo.attributes.size;
      const alphaAttr = vaporGeo.attributes.alpha;
      const heightAttr = vaporGeo.attributes.heightProg;
      const pArr = posAttr.array;
      const sArr = sizeAttr.array;
      const aArr = alphaAttr.array;
      const hArr = heightAttr.array;

      for (let i = 0; i < VAPOR_COUNT; i++) {
        const vp = vaporData[i];
        vp.life += dt * params.vaporFlowRate;

        if (vp.life >= vp.maxLife) {
          vaporData[i] = initVaporParticle(i, false);
        } else {
          const progress = vp.life / vp.maxLife;

          vp.x += (vp.vx + Math.sin(animTimer * 1.4 + vp.y * 1.8) * 0.009) * dt * 2.2;
          vp.z += (vp.vz + Math.cos(animTimer * 1.4 + vp.y * 1.8) * 0.009) * dt * 2.2;
          vp.y += vp.vy * dt * 1.25;

          pArr[i * 3] = vp.x;
          pArr[i * 3 + 1] = vp.y;
          pArr[i * 3 + 2] = vp.z;

          sArr[i] = (vp.scale + progress * 2.2) * 1.6;
          const fadeIn = THREE.MathUtils.smoothstep(progress, 0.0, 0.12);
          const fadeOut = 1.0 - THREE.MathUtils.smoothstep(progress, 0.40, 1.0);
          aArr[i] = fadeIn * fadeOut;
          hArr[i] = progress;
        }
      }
      posAttr.needsUpdate = true;
      sizeAttr.needsUpdate = true;
      alphaAttr.needsUpdate = true;
      heightAttr.needsUpdate = true;

      applyCameraMotion(animTimer);

      controls.update();

      // Render Scene via PostProcessor Pipeline
      postProcessor.renderScene(scene, camera);
    }

    function applyCameraMotion(t) {
      const mode = params.cameraAnimation;
      if (mode === 'Static (No Camera Motion)') {
        return;
      }

      if (mode === 'Gentle Orbit') {
        const radius = 6.2;
        const angle = t * 0.22;
        camera.position.x = Math.cos(angle) * radius;
        camera.position.z = Math.sin(angle) * radius;
        camera.position.y = 3.6 + Math.sin(t * 0.3) * 0.35;
        controls.target.set(0, 1.95, 0);
      } else if (mode === 'Slow Cauldron Breathing') {
        camera.position.x = 4.0 + Math.cos(t * 0.35) * 0.5;
        camera.position.z = 4.4 + Math.sin(t * 0.25) * 0.5;
        camera.position.y = 3.2 + Math.sin(t * 0.45) * 0.5;
        controls.target.set(0, 1.95, 0);
      } else if (mode === 'Overhead Cauldron Gaze') {
        const angle = t * 0.18;
        const radius = 2.8;
        camera.position.x = Math.cos(angle) * radius;
        camera.position.z = Math.sin(angle) * radius;
        camera.position.y = 5.0 + Math.sin(t * 0.3) * 0.3;
        controls.target.set(0, 2.1, 0);
      } else if (mode === 'Creeping Mist Dolly') {
        const dollyDist = 4.6 + Math.sin(t * 0.35) * 1.4;
        camera.position.x = Math.sin(t * 0.15) * 1.1;
        camera.position.z = dollyDist;
        camera.position.y = 3.2 + Math.cos(t * 0.25) * 0.4;
        controls.target.set(0, 2.0, 0);
      } else if (mode === 'Low Ember Arc') {
        const arc = Math.sin(t * 0.25) * 0.8;
        const radius = 4.5;
        camera.position.x = Math.sin(arc) * radius;
        camera.position.z = Math.cos(arc) * radius;
        camera.position.y = 1.35 + Math.sin(t * 0.4) * 0.25;
        controls.target.set(0, 1.8, 0);
      } else if (mode === 'Mystic Pendulum') {
        const pendulum = Math.sin(t * 0.4) * 1.1;
        const radius = 5.2;
        camera.position.x = Math.sin(pendulum) * radius;
        camera.position.z = Math.cos(pendulum) * radius;
        camera.position.y = 3.4 + Math.abs(Math.sin(t * 0.4)) * 0.4;
        controls.target.set(0, 1.95, 0);
      } else if (mode === 'Spiraling Ascend') {
        const cycle = Math.sin(t * 0.2);
        const height = 1.8 + (cycle * 0.5 + 0.5) * 3.2;
        const angle = t * 0.35;
        const radius = 3.6 + (1.0 - (cycle * 0.5 + 0.5)) * 1.8;
        camera.position.x = Math.cos(angle) * radius;
        camera.position.z = Math.sin(angle) * radius;
        camera.position.y = height;
        controls.target.set(0, 1.95, 0);
      }
    }

    // --- RESIZE HANDLER ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);
    });

    animate();
  </script>
</body>
</html>
