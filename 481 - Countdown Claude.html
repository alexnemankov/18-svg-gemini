<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

/* ------------------------------------------------------------------ *
 *  Helpers
 * ------------------------------------------------------------------ */
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
const easeInCubic = (t) => t * t * t;
const easeOutBack = (t) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const smooth01 = (t) => t * t * (3 - 2 * t);
const wrapPi = (a) => Math.atan2(Math.sin(a), Math.cos(a));
const mixHex = (a, b, k) => '#' + new THREE.Color(a).lerp(new THREE.Color(b), k).getHexString();
const hsl = (h, s, l) =>
  '#' + new THREE.Color().setHSL(((h % 1) + 1) % 1, s, l, THREE.SRGBColorSpace).getHexString(THREE.SRGBColorSpace);

/* ------------------------------------------------------------------ *
 *  Color schemes (19 presets)
 * ------------------------------------------------------------------ */
function harmony(h, offs, ip, is, ia) {
  const hues = offs.map((o) => h + o / 360);
  return {
    bg: hsl(hues[0], 0.55, 0.045),
    bg2: hsl(hues[hues.length - 1], 0.5, 0.13),
    primary: hsl(hues[ip], 0.9, 0.55),
    secondary: hsl(hues[is], 0.65, 0.82),
    accent: hsl(hues[ia], 0.95, 0.6),
    confetti: hues.flatMap((x) => [hsl(x, 0.9, 0.55), hsl(x, 0.8, 0.78)])
  };
}

function monochrome(h) {
  return {
    bg: hsl(h, 0.5, 0.045),
    bg2: hsl(h, 0.45, 0.13),
    primary: hsl(h, 0.9, 0.5),
    secondary: hsl(h, 0.55, 0.85),
    accent: hsl(h, 1, 0.66),
    confetti: [0.3, 0.45, 0.6, 0.75, 0.9].map((l) => hsl(h, 0.9, l))
  };
}

function fromPalette(hexes) {
  const list = [...new Set(hexes.map((x) => x.toLowerCase()))].map((x) => {
    const c = new THREE.Color('#' + x);
    const o = {}; c.getHSL(o, THREE.SRGBColorSpace);
    return { hex: '#' + x, s: o.s, l: o.l };
  });
  const byL = [...list].sort((a, b) => a.l - b.l);
  const bg = byL[0], bg2 = byL[1];
  const rest = byL.slice(2);
  const score = (o) => o.s * (1 - Math.abs(o.l - 0.55) * 1.2);
  const primary = [...rest].sort((a, b) => score(b) - score(a))[0];
  const secondary = rest[rest.length - 1];
  const others = rest.filter((o) => o !== primary);
  const accent = others.length ? [...others].sort((a, b) => score(b) - score(a))[0] : primary;
  const confetti = rest.map((o) => o.hex);
  if (bg2.l > 0.18) confetti.push(bg2.hex);
  return {
    bg: bg.hex,
    bg2: mixHex(bg.hex, bg2.hex, 0.8),
    primary: primary.hex, secondary: secondary.hex, accent: accent.hex, confetti
  };
}

const PALETTES = [
  ['Palette 1 · Amber Ember', ['F6AA1C', 'BC3908', '941B0C', 'F6AA1C', '220901']],
  ['Palette 2 · Teal Lagoon', ['63D1CF', '5BC0BE', '4BAD9E', '4BAD9E', '0B132B', '000000']],
  ['Palette 3 · Orchid Haze', ['AA60C8', 'D69ADE', 'C9A3C6', 'CFB5C2', '0D001D', '120A12']],
  ['Palette 4 · Honey Teal', ['FEF1BE', 'FFBA00', '008189', '00474D', '061210']],
  ['Palette 5 · Neon Lime', ['D4FFB0', '7FFF00', '00B894', '0A3322', '05140A']],
  ['Palette 6 · Sunset Plum', ['FFE8CC', 'FF8C00', 'C7501A', '3D1050', '0E0618']],
  ['Palette 7 · Violet Night', ['E8E0FF', 'B38FFF', '6A3DE8', '1A1250', '090612']],
  ['Palette 8 · Cyber Ice', ['E0FBFF', '00F0FF', 'D40078', '1E0A3D', '05020F']]

const SCHEMES = {
  'Original': () => ({
    bg: '#07090f', bg2: '#1a2036', primary: '#f4b73d', secondary: '#cfe8ff', accent: '#ffd98a',
    confetti: ['#f4b73d', '#ffe08a', '#cfe8ff', '#ffffff', '#8fd3ff', '#ff9f5a']
  }),
  'Monochromatic': (h) => monochrome(h),
  'Analogous': (h) => harmony(h, [0, -30, 30], 0, 1, 2),
  'Complementary': (h) => harmony(h, [0, 180], 0, 0, 1),
  'Split-complementary': (h) => harmony(h, [0, 150, 210], 0, 1, 2),
  'Triadic': (h) => harmony(h, [0, 120, 240], 0, 1, 2),
  'Tetradic': (h) => harmony(h, [0, 90, 180, 270], 0, 1, 2),
  'Double split-complementary': (h) => harmony(h, [-30, 30, 150, 210], 0, 2, 3),
  'Achromatic': (h, inv) => inv

  'Neutral + Accent': () => ({

    confetti: ['#d9cdbd', '#a89f91', '#6e675d', '#f1ece4', '#e4572e', '#e4572e']

};
PALETTES.forEach(([name, list]) => { SCHEMES[name] = () => fromPalette(list); });

  confetti: 1,
  sway: 1,
  cameraAnim: 'Gentle Sway',
  envRotate: true,

const geo = { thickness: 0.42, depth: 0.6, width: 1.9, height: 3.2, bevel: 0.06, facets: 2, slant: 0, spacing: 0.35 };
const colors = { digit: '#f4b73d', glass: '#cfe8ff', accent: '#ffd98a', bg1: '#07090f', bg2: '#1a2036' };
const theme = { confetti: [] };

/* ------------------------------------------------------------------ *
 *  Scene, camera, renderer

const stage = document.getElementById('stage');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 200);
const BASE_DIST = 14;
let renderer = null;
let envTarget = null;

function createRenderer() {
  if (renderer) {
    if (envTarget) envTarget.dispose();
    renderer.dispose();
    renderer.forceContextLoss();
    renderer.domElement.remove();
  }
  renderer = new THREE.WebGLRenderer({ antialias: settings.antialias, powerPreference: 'high-performance' });
  renderer.setPixelRatio(settings.pixelRatio);
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = settings.exposure;
  stage.appendChild(renderer.domElement);

  const pmrem = new THREE.PMREMGenerator(renderer);
  const room = new RoomEnvironment();
  envTarget = pmrem.fromScene(room, 0.04);
  scene.environment = envTarget.texture;
  scene.environmentIntensity = settings.envIntensity;
  room.dispose();
  pmrem.dispose();
}

/* ------------------------------------------------------------------ *
 *  Backdrop (gradient / flat greenscreen)
 * ------------------------------------------------------------------ */
const bdMat = new THREE.ShaderMaterial({
  uniforms: {
    uA: { value: new THREE.Color() },
    uB: { value: new THREE.Color() },
    uAspect: { value: 1 },
    uTime: { value: 0 },
    uFlat: { value: 0 },
    uFlatColor: { value: new THREE.Color('#00ff00') }
  },
  vertexShader: /* glsl */`
    varying vec2 vUv;
    void main() { vUv = uv; gl_Position = vec4(position.xy, 1.0, 1.0); }
  `,
  fragmentShader: /* glsl */`
    uniform vec3 uA, uB, uFlatColor;
    uniform float uAspect, uTime, uFlat;
    varying vec2 vUv;
    float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    void main() {
      vec3 col;
      if (uFlat > 0.5) {
        col = uFlatColor;
      } else {
        vec2 c = vec2(0.5 + 0.08 * sin(uTime * 0.15), 0.5 + 0.06 * cos(uTime * 0.11));
        float d = length((vUv - c) * vec2(uAspect, 1.0));
        col = mix(uB, uA, smoothstep(0.0, 1.05, d));
        col += (hash(gl_FragCoord.xy + uTime) - 0.5) / 255.0;
      }
      gl_FragColor = vec4(col, 1.0);
      #include <colorspace_fragment>
    }
  `,
  depthTest: false,
  depthWrite: false
});
const backdrop = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), bdMat);
backdrop.frustumCulled = false;
backdrop.renderOrder = -100;
scene.add(backdrop);

/* ------------------------------------------------------------------ *
 *  Textures
 * ------------------------------------------------------------------ */
function makeGlowTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(128, 128, 0, 128, 128, 128);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.25, 'rgba(255,255,255,0.55)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g;
  x.fillRect(0, 0, 256, 256);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const glowTex = makeGlowTexture();

/* ------------------------------------------------------------------ *
 *  Dust particles
 * ------------------------------------------------------------------ */
const dust = (() => {
  const n = 380;
  const pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    pos[i * 3] = rand(-16, 16);
    pos[i * 3 + 1] = rand(-10, 10);
    pos[i * 3 + 2] = rand(-14, 8);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const m = new THREE.PointsMaterial({
    size: 0.11, map: glowTex, transparent: true, opacity: 0.55, depthWrite: false,
    blending: THREE.AdditiveBlending, sizeAttenuation: true
  });
  const p = new THREE.Points(g, m);
  p.frustumCulled = false;
  scene.add(p);
  return p;
})();

/* ------------------------------------------------------------------ *
 *  Lights
 * ------------------------------------------------------------------ */
const LIGHTS = {};
function addLight(name, type, intensity, pos, max, anim) {
  let light;
  if (type === 'ambient') light = new THREE.AmbientLight(0xffffff, intensity);
  else if (type === 'dir') light = new THREE.DirectionalLight(0xffffff, intensity);
  else if (type === 'point') light = new THREE.PointLight(0xffffff, intensity, 0, 2);
  else { light = new THREE.SpotLight(0xffffff, intensity, 0, 0.5, 1, 2); }
  if (pos) light.position.set(pos[0], pos[1], pos[2]);
  scene.add(light);
  LIGHTS[name] = {
    light, type, max, anim, def: { intensity, pos },
    cfg: { enabled: true, intensity, color: '#ffffff', x: pos ? pos[0] : 0, y: pos ? pos[1] : 0, z: pos ? pos[2] : 0 }
  };
}
addLight('Ambient', 'ambient', 0.25, null, 3);
addLight('Key', 'dir', 2.4, [5, 7, 8], 12, null);
addLight('Fill', 'dir', 0.9, [-7, 2, 6], 12, null);
addLight('Rim Left', 'point', 140, [-6, 3, -4], 800, { w: 0.31, p: 0, a: 0.55 });
addLight('Rim Right', 'point', 110, [6, -2, -3], 800, { w: 0.27, p: 2.1, a: 0.55 });
addLight('Top Spot', 'spot', 180, [0, 9, 5], 900, { w: 0.23, p: 4.2, a: 0.35 });
addLight('Flash', 'point', 300, [0, 0, 6], 2000, null);

function tintLights() {
  const L = (n, c) => { LIGHTS[n].cfg.color = c; };
  L('Ambient', mixHex(colors.bg2, '#ffffff', 0.4));
  L('Key', mixHex(colors.glass, '#ffffff', 0.7));
  L('Fill', mixHex(colors.digit, '#ffffff', 0.5));
  L('Rim Left', colors.accent);
  L('Rim Right', mixHex(colors.digit, '#ffffff', 0.2));
  L('Top Spot', mixHex(colors.accent, '#ffffff', 0.5));
  L('Flash', mixHex(colors.accent, '#ffffff', 0.35));
}

function updateLights() {
  for (const name in LIGHTS) {
    const o = LIGHTS[name], c = o.cfg;
    o.light.visible = c.enabled;
    o.light.color.set(c.color);
    o.light.intensity = (name === 'Flash' ? c.intensity * fx.glow : c.intensity) * settings.lightMaster;
    if (o.type !== 'ambient') {
      let x = c.x, y = c.y, z = c.z;
      if (settings.lightsAnimate && o.anim) {
        const a = Math.sin(tt * o.anim.w + o.anim.p) * o.anim.a;
        const ca = Math.cos(a), sa = Math.sin(a);
        const nx = x * ca + z * sa;
        z = -x * sa + z * ca; x = nx;
        y += Math.sin(tt * 0.5 + o.anim.p) * 0.6;
      }
      o.light.position.set(x, y, z);
    }
  }
}

/* ------------------------------------------------------------------ *
 *  Materials
 * ------------------------------------------------------------------ */
const glassMat = new THREE.MeshPhysicalMaterial({
  color: 0xffffff, metalness: 0, roughness: settings.glassRough, transmission: 1,
  thickness: settings.thickness, ior: settings.ior, attenuationDistance: 2.5,
  clearcoat: 1, clearcoatRoughness: 0.05, flatShading: true,
  emissive: 0xffffff, emissiveIntensity: 0
});
glassMat.dispersion = settings.dispersion;
const goldMat = new THREE.MeshPhysicalMaterial({
  color: 0xf4b73d, metalness: 1, roughness: settings.goldRough,
  clearcoat: 0.35, clearcoatRoughness: 0.15, flatShading: true,
  emissive: 0xffffff, emissiveIntensity: 0
});

function applyMaterialParams() {
  goldMat.roughness = settings.goldRough;
  glassMat.roughness = settings.glassRough;
  glassMat.ior = settings.ior;
  glassMat.dispersion = settings.dispersion;
  glassMat.thickness = settings.thickness;
  for (const m of [goldMat, glassMat]) {
    if (m.flatShading !== settings.flat) { m.flatShading = settings.flat; m.needsUpdate = true; }
  }
  scene.environmentIntensity = settings.envIntensity;
  if (renderer) renderer.toneMappingExposure = settings.exposure;
}

const matFor = (n) =>
  settings.material === 'Gold' ? goldMat :
  settings.material === 'Faceted Glass' ? glassMat :
  (n % 2 === 0 ? glassMat : goldMat);

/* ------------------------------------------------------------------ *
 *  Digit geometry (faceted 7-segment glyphs)
 * ------------------------------------------------------------------ */
const SEGMENTS = {
  0: 'abcdef', 1: 'bc', 2: 'abdeg', 3: 'abcdg', 4: 'bcfg',
  5: 'acdfg', 6: 'acdefg', 7: 'abc', 8: 'abcdefg', 9: 'abcdfg'
};

function segmentShape(kind) {
  const t = geo.thickness, W = geo.width, H = geo.height;
  const g = 0.07 + geo.bevel * 1.5;
  const xc = W / 2 - t / 2, yc = H / 2 - t / 2;
  const hexH = (cy, x0, x1) => [[x0, cy], [x0 + t / 2, cy + t / 2], [x1 - t / 2, cy + t / 2], [x1, cy], [x1 - t / 2, cy - t / 2], [x0 + t / 2, cy - t / 2]];
  const hexV = (cx, y0, y1) => [[cx, y1], [cx + t / 2, y1 - t / 2], [cx + t / 2, y0 + t / 2], [cx, y0], [cx - t / 2, y0 + t / 2], [cx - t / 2, y1 - t / 2]];
  let pts;
  switch (kind) {
    case 'a': pts = hexH(yc, -(xc - g), xc - g); break;
    case 'g': pts = hexH(0, -(xc - g), xc - g); break;
    case 'd': pts = hexH(-yc, -(xc - g), xc - g); break;
    case 'b': pts = hexV(xc, g, yc - g); break;
    case 'c': pts = hexV(xc, -(yc - g), -g); break;
    case 'f': pts = hexV(-xc, g, yc - g); break;
    default:  pts = hexV(-xc, -(yc - g), -g); break; // e
  }
  const s = new THREE.Shape();
  pts.forEach(([x, y], i) => {
    const px = x + geo.slant * y;
    if (i === 0) s.moveTo(px, y); else s.lineTo(px, y);
  });
  s.closePath();
  return s;
}

const glyphCache = new Map();
function getGlyph(d) {
  if (glyphCache.has(d)) return glyphCache.get(d);
  const parts = [...SEGMENTS[d]].map((k) => {
    const gm = new THREE.ExtrudeGeometry(segmentShape(k), {
      depth: geo.depth, bevelEnabled: true, bevelThickness: geo.bevel, bevelSize: geo.bevel,
      bevelOffset: 0, bevelSegments: Math.round(geo.facets), steps: 1, curveSegments: 1
    });
    gm.translate(0, 0, -geo.depth / 2);
    return gm;
  });
  const merged = mergeGeometries(parts, false);
  parts.forEach((p) => p.dispose());
  merged.computeBoundingBox();
  glyphCache.set(d, merged);
  return merged;
}

function buildNumberChildren(group, n) {
  let cursor = 0;
  for (const ch of String(n)) {
    const g = getGlyph(+ch);
    const bb = g.boundingBox;
    const m = new THREE.Mesh(g, matFor(n));
    m.position.x = cursor - bb.min.x;
    group.add(m);
    cursor += bb.max.x - bb.min.x + geo.spacing;
  }
  const total = cursor - geo.spacing;
  group.children.forEach((m) => { m.position.x -= total / 2; });
}

let geoDirty = false;
function rebuildGlyphs() {
  glyphCache.forEach((g) => g.dispose());
  glyphCache.clear();
  for (const o of numbers) {
    o.obj.clear();
    buildNumberChildren(o.obj, o.n);
  }
}

/* ------------------------------------------------------------------ *
 *  Holder, ring, ticks, FX
 * ------------------------------------------------------------------ */
const holder = new THREE.Group();
scene.add(holder);

const RING_R = 3.5;
const ringGroup = new THREE.Group();
ringGroup.position.z = -0.35;
holder.add(ringGroup);

const ringBase = new THREE.Mesh(
  new THREE.RingGeometry(RING_R - 0.02, RING_R + 0.02, 160, 1),
  new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.14, depthWrite: false })
);
ringGroup.add(ringBase);

const ringArc = new THREE.Mesh(
  new THREE.RingGeometry(RING_R - 0.045, RING_R + 0.045, 200, 1),
  new THREE.ShaderMaterial({
    uniforms: { uColor: { value: new THREE.Color() }, uRemain: { value: 1 }, uOpacity: { value: 0.95 } },
    vertexShader: /* glsl */`
      varying vec2 vP;
      void main() { vP = position.xy; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
    `,
    fragmentShader: /* glsl */`
      uniform vec3 uColor; uniform float uRemain, uOpacity;
      varying vec2 vP;
      void main() {
        float a = fract(atan(vP.x, vP.y) / 6.2831853);
        float vis = 1.0 - smoothstep(uRemain - 0.004, uRemain, a);
        if (vis < 0.01) discard;
        gl_FragColor = vec4(uColor, vis * uOpacity);
        #include <colorspace_fragment>
      }
    `,
    transparent: true, depthWrite: false
  })
);
ringArc.position.z = 0.01;
ringGroup.add(ringArc);

const tickMesh = new THREE.InstancedMesh(
  new THREE.OctahedronGeometry(0.11), new THREE.MeshBasicMaterial({ color: 0xffffff }), 10
);
tickMesh.frustumCulled = false;
{
  const m = new THREE.Matrix4();
  for (let k = 1; k <= 10; k++) {
    const a = (k / 10) * Math.PI * 2;
    m.makeTranslation(Math.sin(a) * (RING_R + 0.36), Math.cos(a) * (RING_R + 0.36), 0);
    tickMesh.setMatrixAt(k - 1, m);
    tickMesh.setColorAt(k - 1, new THREE.Color(1, 1, 1));
  }
}
ringGroup.add(tickMesh);

let curN = 10;
function updateTicks() {
  const lit = new THREE.Color(colors.accent);
  const dim = new THREE.Color(colors.accent).multiplyScalar(0.16);
  for (let k = 1; k <= 10; k++) tickMesh.setColorAt(k - 1, k <= curN ? lit : dim);
  tickMesh.instanceColor.needsUpdate = true;
}

/* FX group: always faces camera, follows holder */
const fxGroup = new THREE.Group();
scene.add(fxGroup);
const glowSprite = new THREE.Sprite(new THREE.SpriteMaterial({
  map: glowTex, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthTest: false, depthWrite: false
}));
glowSprite.renderOrder = 20;
fxGroup.add(glowSprite);
const shockRing = new THREE.Mesh(
  new THREE.RingGeometry(0.92, 1, 96),
  new THREE.MeshBasicMaterial({
    color: 0xffffff, transparent: true, opacity: 0, blending: THREE.AdditiveBlending,
    depthTest: false, depthWrite: false, side: THREE.DoubleSide
  })
);
shockRing.renderOrder = 19;
fxGroup.add(shockRing);

const fx = { glow: 0, ringAge: 1, ringAmp: 0 };
const flash = (s) => { fx.glow = Math.max(fx.glow, s); };
const shock = (a) => { fx.ringAge = 0; fx.ringAmp = a; };

function updateFx(dt) {
  fx.glow *= Math.exp(-dt * 7);
  if (fx.glow < 0.002) fx.glow = 0;
  glowSprite.material.opacity = Math.min(fx.glow, 1) * 0.85;
  glowSprite.scale.setScalar(7 + fx.glow * 4);
  const e = fx.glow * 0.55;
  glassMat.emissiveIntensity = e;
  goldMat.emissiveIntensity = e;
  fx.ringAge = Math.min(1, fx.ringAge + dt / 0.85);
  shockRing.scale.setScalar(1 + easeOutCubic(fx.ringAge) * 8);
  shockRing.material.opacity = Math.pow(1 - fx.ringAge, 2) * fx.ringAmp * 0.8;
  shockRing.visible = shockRing.material.opacity > 0.003;
  fxGroup.position.copy(holder.position);
  fxGroup.quaternion.copy(camera.quaternion);
}

/* ------------------------------------------------------------------ *
 *  Confetti
 * ------------------------------------------------------------------ */
const CN = 1400;
const confMesh = new THREE.InstancedMesh(
  new THREE.PlaneGeometry(0.11, 0.2),
  new THREE.MeshStandardMaterial({ side: THREE.DoubleSide, roughness: 0.35, metalness: 0.5 }),
  CN
);
confMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
confMesh.frustumCulled = false;
scene.add(confMesh);
const C = {
  pos: new Float32Array(CN * 3), vel: new Float32Array(CN * 3),
  rot: new Float32Array(CN * 3), ang: new Float32Array(CN * 3),
  life: new Float32Array(CN), max: new Float32Array(CN), size: new Float32Array(CN),
  hidden: new Uint8Array(CN)
};
{
  const z = new THREE.Matrix4().makeScale(0, 0, 0);
  const c = new THREE.Color(1, 1, 1);
  for (let i = 0; i < CN; i++) { confMesh.setMatrixAt(i, z); confMesh.setColorAt(i, c); C.hidden[i] = 1; }
}
let cCursor = 0;
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler(), _p = new THREE.Vector3(), _s = new THREE.Vector3();

function emitConfetti(origin, count, speed, mode) {
  count = Math.round(count);
  for (let k = 0; k < count; k++) {
    const i = cCursor; cCursor = (cCursor + 1) % CN;
    C.pos[i * 3] = origin.x + rand(-0.5, 0.5);
    C.pos[i * 3 + 1] = origin.y + rand(-0.5, 0.5);
    C.pos[i * 3 + 2] = origin.z + rand(-0.3, 0.3);
    let dx, dy, dz;
    if (mode === 'burst') {
      const u = Math.random() * 2 - 1, a = Math.random() * Math.PI * 2, r = Math.sqrt(1 - u * u);
      dx = r * Math.cos(a); dy = u * 0.9 + 0.25; dz = r * Math.sin(a) * 0.8 + 0.25;
    } else {
      dx = rand(-1, 1); dy = rand(0.6, 1.4); dz = rand(-0.3, 0.9);
    }
    const sp = speed * rand(0.35, 1);
    C.vel[i * 3] = dx * sp; C.vel[i * 3 + 1] = dy * sp; C.vel[i * 3 + 2] = dz * sp;
    C.rot[i * 3] = rand(0, 6.28); C.rot[i * 3 + 1] = rand(0, 6.28); C.rot[i * 3 + 2] = rand(0, 6.28);
    C.ang[i * 3] = rand(-12, 12); C.ang[i * 3 + 1] = rand(-12, 12); C.ang[i * 3 + 2] = rand(-12, 12);
    C.life[i] = C.max[i] = rand(1.6, 3.2);
    C.size[i] = rand(0.6, 1.4);
    C.hidden[i] = 0;
    confMesh.setColorAt(i, confettiColors[Math.floor(Math.random() * confettiColors.length)]);
  }
  confMesh.instanceColor.needsUpdate = true;
}

function updateConfetti(dt) {
  let dirty = false;
  const drag = Math.exp(-1.4 * dt);
  for (let i = 0; i < CN; i++) {
    if (C.life[i] <= 0) {
      if (!C.hidden[i]) { _m.makeScale(0, 0, 0); confMesh.setMatrixAt(i, _m); C.hidden[i] = 1; dirty = true; }
      continue;
    }
    C.life[i] -= dt;
    const i3 = i * 3;
    C.vel[i3 + 1] -= 7 * dt;
    C.vel[i3] += Math.sin(tt * 9 + i) * 1.5 * dt;
    C.vel[i3] *= drag; C.vel[i3 + 1] *= drag; C.vel[i3 + 2] *= drag;
    C.pos[i3] += C.vel[i3] * dt; C.pos[i3 + 1] += C.vel[i3 + 1] * dt; C.pos[i3 + 2] += C.vel[i3 + 2] * dt;
    C.rot[i3] += C.ang[i3] * dt; C.rot[i3 + 1] += C.ang[i3 + 1] * dt; C.rot[i3 + 2] += C.ang[i3 + 2] * dt;
    const f = Math.max(C.life[i], 0) / C.max[i];
    const sc = C.size[i] * Math.min(1, f * 4);
    _p.set(C.pos[i3], C.pos[i3 + 1], C.pos[i3 + 2]);
    _e.set(C.rot[i3], C.rot[i3 + 1], C.rot[i3 + 2]);
    _q.setFromEuler(_e);
    _s.set(sc, sc, sc);
    _m.compose(_p, _q, _s);
    confMesh.setMatrixAt(i, _m);
    dirty = true;
  }
  if (dirty) confMesh.instanceMatrix.needsUpdate = true;
}

/* ------------------------------------------------------------------ *
 *  Countdown numbers & transitions
 * ------------------------------------------------------------------ */
let numbers = [];
let tt = 0;
let tickTimer = 0;
let tickCount = 0;
const MIX_ORDER = ['flash', 'confetti', 'drop'];

function chooseStyle() {
  switch (settings.transition) {
    case 'Light Flash': return 'flash';
    case 'Confetti Burst': return 'confetti';
    case 'Kinetic Drop': return 'drop';
    default: return MIX_ORDER[tickCount % MIX_ORDER.length];
  }
}

function spawnNumber(n, style) {
  const obj = new THREE.Group();
  buildNumberChildren(obj, n);
  holder.add(obj);
  const o = {
    n, obj, mode: style, phase: 'in', age: 0, x: 0, y: 0, vy: 0, rx: 0, ry: 0, rz: 0,
    vrx: 0, vrz: 0, s: 1, sq: 0, free: false, dead: false
  };
  if (style === 'drop') {
    o.y = 5.5; o.rx = rand(-0.25, 0.25); o.rz = rand(-0.2, 0.2);
    o.vrx = rand(-1, 1); o.vrz = rand(-1, 1);
  } else if (style === 'flash') o.s = 0.86;
  else o.s = 0;
  numbers.push(o);
  return o;
}

function startOut(o, style) {
  o.phase = 'out'; o.mode = style; o.age = 0;
  if (style === 'flash') o.dead = true;
  else if (style === 'drop') {
    o.free = true; o.vy = 0;
    const sgn = Math.random() < 0.5 ? -1 : 1;
    o.vrx = rand(1.5, 3) * sgn; o.vrz = rand(-2, 2);
  }
}

function advance() {
  tickCount++;
  curN = curN > 1 ? curN - 1 : 10;
  const wrap = curN === 10;
  const style = chooseStyle();
  for (const o of numbers) if (o.phase !== 'out') startOut(o, style);
  spawnNumber(curN, style);
  const amt = settings.confetti;
  const center = holder.position;
  if (style === 'flash') { flash(1); shock(0.9); }
  else if (style === 'confetti') { flash(0.4); shock(0.4); emitConfetti(center, 70 * amt, 7, 'burst'); }
  else flash(0.15);
  if (wrap) { flash(1.7); shock(1); emitConfetti(center, 260 * amt, 10, 'burst'); }
  updateTicks();
}

const _imp = new THREE.Vector3();
function onImpact(o, impact) {
  _imp.copy(holder.position); _imp.y -= 1.6;
  emitConfetti(_imp, 26 * settings.confetti, 3 + impact * 0.12, 'spray');
  flash(0.25); shock(0.5);
}

function stepNumber(o, h) {
  o.age += h;
  if (o.phase !== 'out') {
    if (o.mode === 'flash') {
      const p = clamp(o.age / 0.5, 0, 1), e = easeOutCubic(p);
      o.s = 0.86 + 0.14 * e; o.ry = (1 - e) * 0.6;
      if (p >= 1) o.phase = 'live';
    } else if (o.mode === 'confetti') {
      const p = clamp(o.age / 0.6, 0, 1), e = easeOutCubic(p);
      o.s = Math.max(easeOutBack(p), 0); o.ry = (1 - e) * -1.4; o.rz = (1 - e) * 0.3;
      if (p >= 1) o.phase = 'live';
    } else if (o.phase === 'in') {
      o.vy -= 48 * h; o.y += o.vy * h;
      o.vrx += (-o.rx * 14 - o.vrx * 4) * h; o.vrz += (-o.rz * 14 - o.vrz * 4) * h;
      o.rx += o.vrx * h; o.rz += o.vrz * h;
      if (o.y <= 0 && o.vy < 0) {
        const impact = -o.vy;
        o.y = 0;
        if (impact > 2) { o.sq = clamp(impact / 30, 0, 0.35); onImpact(o, impact); }
        o.vy = -o.vy * 0.32;
        if (o.vy < 1.5) { o.vy = 0; o.phase = 'live'; }
      }
    } else {
      o.vrx += (-o.rx * 14 - o.vrx * 4) * h; o.vrz += (-o.rz * 14 - o.vrz * 4) * h;
      o.rx += o.vrx * h; o.rz += o.vrz * h;
    }
    o.sq *= Math.exp(-h * 12);
  } else {
    if (o.mode === 'confetti') {
      const p = clamp(o.age / 0.32, 0, 1);
      o.s = (1 + 0.15 * Math.sin(p * Math.PI)) * (1 - easeInCubic(p));
      o.rz += h * 6;
      if (p >= 1) o.dead = true;
    } else if (o.mode === 'drop') {
      o.vy -= 48 * h; o.y += o.vy * h;
      o.rx += o.vrx * h; o.rz += o.vrz * h;
      if (o.y < -9) o.dead = true;
    } else o.dead = true;
  }
}

function updateNumbers(dt) {
  let rem = dt;
  while (rem > 1e-6) {
    const h = Math.min(rem, 1 / 60);
    rem -= h;
    for (const o of numbers) stepNumber(o, h);
  }
  numbers = numbers.filter((o) => {
    if (o.dead) { holder.remove(o.obj); return false; }
    return true;
  });
  const k = settings.sway;
  for (const o of numbers) {
    o.obj.position.set(o.x, o.y + Math.sin(tt * 0.9) * 0.08 * k, 0);
    o.obj.rotation.set(o.rx + Math.sin(tt * 0.45 + 1) * 0.08 * k, o.ry + Math.sin(tt * 0.6) * 0.24 * k, o.rz);
    const s = Math.max(o.s, 0.0001);
    o.obj.scale.set(s * (1 + o.sq * 0.4), s * (1 - o.sq), s * (1 + o.sq * 0.4));
  }
}

/* ------------------------------------------------------------------ *
 *  Camera animations (slow, smooth) + interaction state
 * ------------------------------------------------------------------ */
const CAM_ANIMS = {
  'Gentle Sway': (t) => ({ az: Math.sin(t * 0.35) * 0.42, el: 0.06 + Math.sin(t * 0.27) * 0.05, dm: 1, roll: 0 }),
  'Slow Orbit': (t) => ({ az: t * 0.1, el: 0.12 + Math.sin(t * 0.2) * 0.08, dm: 1, roll: 0 }),
  'Breathing Dolly': (t) => ({ az: Math.sin(t * 0.2) * 0.15, el: 0.05, dm: 1 + Math.sin(t * 0.45) * 0.14, roll: 0 }),
  'Lissajous Drift': (t) => ({ az: Math.sin(t * 0.28) * 0.55, el: 0.08 + Math.sin(t * 0.42) * 0.22, dm: 1, roll: 0 }),
  'Crane Rise': (t) => {
    const p = Math.sin(t * 0.22 - 1.2) * 0.5 + 0.5;
    return { az: Math.sin(t * 0.15) * 0.25, el: 0.03 + p * 0.55, dm: 1.04 - p * 0.1, roll: 0 };
  },
  'Cinematic Push': (t) => {
    const s = smooth01(Math.sin(t * 0.18) * 0.5 + 0.5);
    return { az: -0.3 + s * 0.6, el: 0.06, dm: 1.2 - 0.34 * s, roll: 0 };
  },
  'Pendulum Roll': (t) => ({ az: Math.sin(t * 0.4) * 0.65, el: 0.05, dm: 1, roll: Math.sin(t * 0.4 + 0.7) * 0.05 }),
  'Floating Helix': (t) => ({
    az: Math.sin(t * 0.18) * 0.9, el: Math.cos(t * 0.18) * 0.28,
    dm: 1 + Math.sin(t * 0.36) * 0.08, roll: Math.sin(t * 0.18) * 0.03
  }),
  'Static (No Camera Movement)': () => ({ az: 0, el: 0, dm: 1, roll: 0 })
};

const rig = { az: 0, el: 0, dm: 1, roll: 0 };
let rigFrom = { ...rig }, rigBlend = 1;
function setCamMode() { rigFrom = { ...rig }; rigBlend = 0; }

let zoomTarget = 1, zoomCur = 1;
const userPos = new THREE.Vector3(), userPosCur = new THREE.Vector3();
const userRot = { x: 0, y: 0 };

function fitMul() { return Math.max(1, 0.87 / (innerWidth / innerHeight)); }

function updateCamera(raw) {
  const tgt = CAM_ANIMS[settings.cameraAnim](tt);
  if (rigBlend < 1) {
    rigBlend = Math.min(1, rigBlend + raw / 1.6);
    const s = smooth01(rigBlend);
    rig.az = rigFrom.az + wrapPi(tgt.az - rigFrom.az) * s;
    rig.el = rigFrom.el + (tgt.el - rigFrom.el) * s;
    rig.dm = rigFrom.dm + (tgt.dm - rigFrom.dm) * s;
    rig.roll = rigFrom.roll + (tgt.roll - rigFrom.roll) * s;
  } else { rig.az = tgt.az; rig.el = tgt.el; rig.dm = tgt.dm; rig.roll = tgt.roll; }
  zoomCur += (zoomTarget - zoomCur) * (1 - Math.exp(-raw * 8));
  const d = BASE_DIST * fitMul() * rig.dm * zoomCur;
  camera.position.set(Math.sin(rig.az) * Math.cos(rig.el) * d, Math.sin(rig.el) * d, Math.cos(rig.az) * Math.cos(rig.el) * d);
  camera.up.set(Math.sin(rig.roll), Math.cos(rig.roll), 0);
  camera.lookAt(0, 0, 0);
  camera.updateMatrixWorld();
  userPosCur.lerp(userPos, 1 - Math.exp(-raw * 14));
  holder.position.copy(userPosCur);
  holder.rotation.set(userRot.x, userRot.y, 0);
}

function applyColors() {
  goldMat.color.set(colors.digit);
  goldMat.emissive.set(colors.accent);
  glassMat.color.set(mixHex(colors.glass, '#ffffff', 0.5));
  glassMat.attenuationColor.set(colors.glass);
  glassMat.emissive.set(colors.accent);
  bdMat.uniforms.uA.value.set(colors.bg1);
  bdMat.uniforms.uB.value.set(colors.bg2);
  dust.material.color.set(mixHex(colors.glass, colors.accent, 0.3));
  glowSprite.material.color.set(mixHex(colors.accent, '#ffffff', 0.4));
  shockRing.material.color.set(mixHex(colors.accent, '#ffffff', 0.25));
  ringArc.material.uniforms.uColor.value.set(colors.accent);
  ringBase.material.color.set(colors.accent);
  confettiColors = [colors.digit, colors.glass, colors.accent, ...theme.confetti].map((c) => new THREE.Color(c));
  updateTicks();
}

function applyScheme() {
  const r = SCHEMES[settings.scheme](settings.baseHue, settings.invertAchromatic);
  colors.digit = r.primary; colors.glass = r.secondary; colors.accent = r.accent;
  colors.bg1 = r.bg; colors.bg2 = r.bg2;
  theme.confetti = r.confetti;
  tintLights();
  applyColors();
  refreshGUI();
}

function applyBackgroundMode() {
  const g = settings.greenscreen;
  bdMat.uniforms.uFlat.value = g ? 1 : 0;
  scene.background = g ? new THREE.Color('#00ff00') : null;
  dust.visible = settings.dust && !g;
}

/* ------------------------------------------------------------------ *
 *  Randomize (procedural variation on click)
 * ------------------------------------------------------------------ */
function randomizeTheme() {
  settings.scheme = pick(Object.keys(SCHEMES).filter((n) => n !== settings.scheme));
  settings.baseHue = Math.random();
  settings.invertAchromatic = Math.random() < 0.5;
  settings.material = pick(MATERIALS);
  settings.transition = pick(TRANSITIONS);
  settings.cameraAnim = pick(Object.keys(CAM_ANIMS));
  settings.sway = rand(0.4, 1.6);
  settings.confetti = rand(0.7, 1.6);
  settings.goldRough = rand(0.08, 0.4);
  settings.glassRough = rand(0, 0.18);
  settings.ior = rand(1.3, 2.1);
  settings.dispersion = rand(0, 1.6);
  settings.envIntensity = rand(0.7, 1.4);
  settings.exposure = rand(0.95, 1.3);
  Object.assign(geo, {
    thickness: rand(0.3, 0.5), depth: rand(0.35, 1.1), width: rand(1.7, 2.4), height: rand(2.8, 3.6),
    bevel: rand(0.03, 0.1), facets: Math.round(rand(1, 4)), slant: rand(-0.28, 0.28), spacing: rand(0.2, 0.6)
  });
  for (const name in LIGHTS) {
    const o = LIGHTS[name];
    if (name === 'Flash') continue;
    o.cfg.intensity = o.def.intensity * rand(0.6, 1.4);
    if (o.def.pos) {
      o.cfg.x = o.def.pos[0] + rand(-2, 2);
      o.cfg.y = o.def.pos[1] + rand(-1.5, 1.5);
      o.cfg.z = o.def.pos[2] + rand(-2, 2);
    }
  }
  applyMaterialParams();
  rebuildGlyphs();
  geoDirty = false;
  setCamMode();
  applyScheme();
  for (const o of numbers) o.obj.children.forEach((m) => { m.material = matFor(o.n); });
  flash(1.2); shock(0.8);
  emitConfetti(holder.position, 120 * settings.confetti, 8, 'burst');
}

  const fInt = gui.addFolder('Interaction');
  fInt.add(settings, 'clickRandomize').name('Click Randomizes Scene');
  fInt.add({ run: () => randomizeTheme() }, 'run').name('Randomize Now');
  fInt.add({ run: resetView }, 'run').name('Reset View');
}

/* ------------------------------------------------------------------ *
 *  Pointer / wheel / keyboard
 * ------------------------------------------------------------------ */
const pointers = new Map();
let press = null, pinchDist = 0;

stage.addEventListener('contextmenu', (e) => e.preventDefault());
stage.addEventListener('wheel', (e) => {
  e.preventDefault();
  const dy = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
  zoomTarget = clamp(zoomTarget * Math.exp(dy * 0.0012), 0.2, 3.5);
}, { passive: false });

stage.addEventListener('pointerdown', (e) => {
  stage.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1) {
    press = { t: performance.now(), moved: 0, button: e.button };
    stage.style.cursor = 'grabbing';
  } else if (pointers.size === 2) {
    if (press) press.moved = 999;
    const [a, b] = [...pointers.values()];
    pinchDist = Math.hypot(a.x - b.x, a.y - b.y);
  }
});

stage.addEventListener('pointermove', (e) => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinchDist > 0) zoomTarget = clamp(zoomTarget * (pinchDist / d), 0.2, 3.5);
    pinchDist = d;
  } else if (pointers.size === 1 && press) {
    press.moved += Math.abs(dx) + Math.abs(dy);
    if (press.button === 2 || e.shiftKey) {
      userRot.y += dx * 0.006;
      userRot.x = clamp(userRot.x + dy * 0.006, -1.3, 1.3);
    } else {
      const dist = camera.position.length();
      const wpp = (2 * dist * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2))) / innerHeight;
      const right = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 0);
      const up = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 1);
      userPos.addScaledVector(right, dx * wpp).addScaledVector(up, -dy * wpp);
      userPos.clampLength(0, 16);
    }
  }
});

function endPointer(e) {
  if (!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  if (pointers.size === 0) {
    stage.style.cursor = 'grab';
    if (e.type === 'pointerup' && press && press.button === 0 && press.moved < 6 && performance.now() - press.t < 600) {
      if (settings.clickRandomize) randomizeTheme();
    }
    press = null;
  }
}
stage.addEventListener('pointerup', endPointer);
stage.addEventListener('pointercancel', endPointer);

let uiHidden = false;
window.addEventListener('keydown', (e) => {
  if (e.code !== 'KeyH' && e.key !== 'h' && e.key !== 'H') return;
  if (e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
  e.preventDefault();
  uiHidden = !uiHidden;
  gui.show(!uiHidden);
}, true);

function onResize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  bdMat.uniforms.uAspect.value = camera.aspect;
}
window.addEventListener('resize', onResize);

/* ------------------------------------------------------------------ *
 *  Boot
 * ------------------------------------------------------------------ */
createRenderer();
applyScheme();
applyMaterialParams();
applyBackgroundMode();
buildGUI();
onResize();
spawnNumber(10, 'flash');
updateTicks();
flash(1);

const clock = new THREE.Clock();
let envRot = 0;

function frame() {
  requestAnimationFrame(frame);
  const raw = Math.min(clock.getDelta(), 0.05);
  const dt = raw * settings.speed;
  tt += dt;

  if (geoDirty) { rebuildGlyphs(); geoDirty = false; }

  const interval = Math.max(settings.interval, 0.05);
  tickTimer += dt;
  let guard = 0;
  while (tickTimer >= interval && guard++ < 4) { tickTimer -= interval; advance(); }
  ringArc.material.uniforms.uRemain.value = 1 - tickTimer / interval;

  updateCamera(raw);
  updateNumbers(dt);
  updateFx(dt);
  updateConfetti(dt);
  updateLights();

  if (settings.envRotate) envRot += dt * 0.08;
  scene.environmentRotation.y = envRot;
  dust.rotation.y = tt * 0.01;
  dust.position.y = Math.sin(tt * 0.2) * 0.4;
  bdMat.uniforms.uTime.value = tt;

  renderer.render(scene, camera);
}
frame();
</script>
</body>
