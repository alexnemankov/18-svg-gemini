<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Billboard Ecosystem</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas#webgl {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
    }
  }
  </script>
</head>
<body>
  <canvas id="webgl"></canvas>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';
    import GUI from 'lil-gui';

    // =========================================================================
    // POST PROCESSOR SUITE (Inlined from postprocessing/PostProcessor.js)
    // =========================================================================
    const orthoVertexShader = `
    precision highp float;
    in vec3 position;
    out vec2 vUv;
    void main() {
      vUv = position.xy * 0.5 + 0.5;
      gl_Position = vec4(position, 1.0);
    }
    `;

    const brightFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float bloomThreshold;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      vec4 color = texture(inputTexture, vUv);
      float luminance = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float knee = 0.1;
      float soft = luminance - bloomThreshold + knee;
      soft = clamp(soft, 0.0, 2.0 * knee);
      soft = (soft * soft) / (4.0 * knee + 0.00001);
      float contribution = max(soft, luminance - bloomThreshold);
      contribution /= max(luminance, 0.00001);
      fragColor = vec4(color.rgb * contribution, color.a);
    }
    `;

    const blur13ShaderChunk = `
    vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
      vec2 resolution = vec2(textureSize(image, 0));
      vec4 color = vec4(0.0);
      vec2 off1 = vec2(1.411764705882353) * direction;
      vec2 off2 = vec2(3.2941176470588234) * direction;
      vec2 off3 = vec2(5.176470588235294) * direction;
      color += texture(image, uv) * 0.1964825501511404;
      color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
      color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
      return color;
    }
    `;

    const blurFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 direction;
    in vec2 vUv;
    out vec4 color;
    ${blur13ShaderChunk}
    void main() {
      color = blur13(inputTexture, vUv, direction);
    }
    `;

    const godRaysDepthMaskShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float threshold;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      vec4 color = texture(inputTexture, vUv);
      float lum = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float factor = smoothstep(threshold, threshold + 0.15, lum);
      fragColor = vec4(vec3(factor), 1.0);
    }
    `;

    const godRaysGenerateShader = `
    precision highp float;
    #define TAPS_PER_PASS 6.0
    uniform sampler2D inputTexture;
    uniform vec3 vSunPositionScreenSpace;
    uniform float fStepSize;
    uniform float distanceAttenuation;
    uniform float maxDensity;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      vec2 delta = vSunPositionScreenSpace.xy - vUv;
      float dist = length(delta);
      vec2 stepv = fStepSize * delta / max(dist, 0.0001);
      float iters = dist / max(fStepSize, 0.00001);
      vec2 uv = vUv;
      float col = 0.0;
      float f = min(1.0, max(vSunPositionScreenSpace.z, 0.0));
      float atten = 1.0 / (1.0 + pow(dist, distanceAttenuation));
      if (0.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (1.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (2.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (3.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (4.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (5.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      float finalVal = min(col / TAPS_PER_PASS * atten, maxDensity);
      fragColor = vec4(vec3(finalVal), 1.0);
    }
    `;

    const anamorphicBrightShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float threshold;
    uniform float smoothWidth;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      vec4 color = texture(inputTexture, vUv);
      float v = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float alpha = smoothstep(threshold, threshold + smoothWidth, v);
      fragColor = mix(vec4(0.0), color, alpha);
    }
    `;

    const anamorphicBlurShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 resolution;
    uniform float samples;
    uniform float intensity;
    uniform vec3 tintColor;
    uniform float bloomRadius;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      int halfSamples = max(1, int(samples) / 2);
      float fHalfSamples = float(halfSamples);
      vec2 invSize = 1.0 / resolution;
      vec4 total = vec4(0.0);
      for (int i = -64; i <= 64; i++) {
        if (i < -halfSamples || i > halfSamples) continue;
        float softness = 1.0 - abs(float(i)) / fHalfSamples;
        softness = pow(softness, 2.0);
        vec2 shiftedUV = vec2(vUv.x + invSize.x * float(i) * (4.0 + bloomRadius * 8.0), vUv.y);
        shiftedUV = clamp(shiftedUV, 0.001, 0.999);
        total += texture(inputTexture, shiftedUV) * softness;
      }
      fragColor = (total / (samples / 3.0)) * vec4(tintColor, 1.0) * intensity;
    }
    `;

    const finalFragmentShader = `
    precision highp float;
    uniform vec2 resolution;
    uniform sampler2D inputTexture;
    uniform sampler2D blur0Texture;
    uniform sampler2D blur1Texture;
    uniform sampler2D blur2Texture;
    uniform sampler2D blur3Texture;
    uniform sampler2D blur4Texture;
    uniform sampler2D raysTexture;
    uniform sampler2D anamorphicTexture;
    uniform bool bloomEnabled;
    uniform float bloomStrength;
    uniform bool raysEnabled;
    uniform float raysStrength;
    uniform vec3 raysColor;
    uniform bool anamorphicEnabled;
    uniform float vignetteBoost;
    uniform float vignetteReduction;
    uniform float noiseIntensity;
    uniform float time;
    in vec2 vUv;
    out vec4 fragColor;

    float vignette(vec2 uv, float boost, float reduction) {
      vec2 position = vUv - 0.5;
      return boost - length(position) * reduction;
    }

    float hash1(uint n) {
      n = (n << 13U) ^ n;
      n = n * (n * n * 15731U + 789221U) + 1376312589U;
      return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
    }

    float noise(in vec2 uv, in float timeVal) {
      uvec2 p = uvec2(uv);
      return hash1(p.x + 1920U * p.y + (1920U * 1080U) * uint(timeVal));
    }

    void main() {
      vec4 color = texture(inputTexture, vUv);
      if (bloomEnabled && bloomStrength > 0.001) {
        vec4 b0 = texture(blur0Texture, vUv);
        vec4 b1 = texture(blur1Texture, vUv);
        vec4 b2 = texture(blur2Texture, vUv);
        vec4 b3 = texture(blur3Texture, vUv);
        vec4 b4 = texture(blur4Texture, vUv);
        vec4 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
        color += bloomSum * bloomStrength;
      }
      if (raysEnabled && raysStrength > 0.001) {
        vec4 r = texture(raysTexture, vUv);
        color.rgb += r.rgb * raysColor * raysStrength;
      }
      if (anamorphicEnabled) {
        vec4 a = texture(anamorphicTexture, vUv);
        color.rgb += a.rgb;
      }
      color.rgb *= vignette(vUv, vignetteBoost, vignetteReduction);
      color.rgb += noiseIntensity * noise(gl_FragCoord.xy, time);
      fragColor = vec4(color.rgb, 1.0);
    }
    `;

    const chromaticAberrationShaderChunk = `
    vec2 barrelDistortion(vec2 coord, float amt) {
      vec2 cc = coord - 0.5;
      float dist = dot(cc, cc);
      return coord + cc * dist * amt;
    }
    float sat(float t) { return clamp(t, 0.0, 1.0); }
    float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
    float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
    vec4 spectrum_offset(float t) {
      float lo = step(t, 0.5);
      float hi = 1.0 - lo;
      float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
      vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
      return pow(ret, vec4(1.0 / 2.2));
    }
    const float max_distort = 2.2;
    const int num_iter = 8;
    const float reci_num_iter_f = 1.0 / float(num_iter);
    vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
      vec4 sumcol = vec4(0.0);
      vec4 sumw = vec4(0.0);
      for (int i = 0; i < num_iter; ++i) {
        float t = float(i) * reci_num_iter_f;
        vec4 w = spectrum_offset(t);
        sumw += w;
        sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
      }
      return sumcol / sumw;
    }
    `;

    const colorFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float chromaticAberrationAmount;
    uniform float minInputLevel;
    uniform float maxInputLevel;
    uniform float gammaLevel;
    uniform float exposure;
    uniform float fisheyeStrength;
    uniform float fisheyeRadius;
    uniform float time;
    uniform int visionMode;
    uniform float thermalSensitivity;
    uniform float nightVisionNoise;
    uniform float nightVisionGain;
    uniform float crtIntensity;
    in vec2 vUv;
    out vec4 fragColor;
    ${chromaticAberrationShaderChunk}

    vec2 applyFisheye(vec2 uv, float strength, float radius) {
      if (abs(strength) < 0.0001) return uv;
      vec2 p = uv - 0.5;
      float d = length(p);
      if (d > radius * 1.5) return uv;
      float r = d / max(radius, 0.001);
      float theta = atan(p.y, p.x);
      float rDist = r + strength * (r * r * r);
      return 0.5 + vec2(cos(theta), sin(theta)) * (rDist * radius);
    }

    vec3 ACESFilmicToneMapping(vec3 color) {
      float a = 2.51;
      float b = 0.03;
      float c = 2.43;
      float d = 0.59;
      float e = 0.14;
      return clamp((color * (a * color + b)) / (color * (c * color + d) + e), 0.0, 1.0);
    }

    vec3 gammaCorrect(vec3 color, vec3 gamma) {
      return pow(max(color, vec3(0.0)), 1.0 / gamma);
    }
    vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
      return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
    }
    vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
      return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
    }

    void main() {
      vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
      vec4 col = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
      vec3 finalCol = col.rgb;
      vec3 exposedColor = finalCol * exposure;
      vec3 toneMappedColor = ACESFilmicToneMapping(exposedColor);
      finalCol = finalLevels(toneMappedColor, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
      if (crtIntensity > 0.0001) {
        float scanline = sin(uv.y * 900.0 + time * 2.0) * crtIntensity;
        finalCol -= scanline;
      }
      fragColor = vec4(finalCol, 1.0);
    }
    `;

    const copyFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      fragColor = texture(inputTexture, vUv);
    }
    `;

    function createFBO(w, h, options = {}) {
      return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
        wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
        wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
        minFilter: options.minFilter || THREE.LinearFilter,
        magFilter: options.magFilter || THREE.LinearFilter,
        format: options.format || THREE.RGBAFormat,
        type: options.type || THREE.HalfFloatType,
        stencilBuffer: options.stencilBuffer || false,
        depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : true,
        samples: options.samples || 0,
      });
    }

    class ShaderPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbo = createFBO(1, 1, options);
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
        this.texture = this.fbo.texture;
      }
      render(renderer, toScreen = false) {
        if (!toScreen) renderer.setRenderTarget(this.fbo);
        renderer.render(this.orthoScene, this.orthoCamera);
        if (!toScreen) renderer.setRenderTarget(null);
      }
      setSize(width, height) {
        this.fbo.setSize(Math.max(1, width), Math.max(1, height));
        this.orthoQuad.scale.set(width, height, 1);
      }
    }

    class ShaderPingPongPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
        this.currentFBO = 0;
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
      }
      render(renderer) {
        renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
        renderer.render(this.orthoScene, this.orthoCamera);
        renderer.setRenderTarget(null);
        this.currentFBO = 1 - this.currentFBO;
      }
      get current() { return this.fbos[this.currentFBO]; }
      get texture() { return this.current.texture; }
      setSize(width, height) {
        const w = Math.max(1, width);
        const h = Math.max(1, height);
        this.orthoQuad.scale.set(w, h, 1);
        this.fbos[0].setSize(w, h);
        this.fbos[1].setSize(w, h);
      }
    }

    class BloomPass {
      constructor(strength = 0.8, radius = 0.5, threshold = 0.2, levels = 5) {
        this.strength = strength;
        this.radius = radius;
        this.threshold = threshold;
        this.enabled = true;
        this.levels = levels;

        this.brightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            bloomThreshold: { value: this.threshold },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: brightFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.brightPass = new ShaderPass(this.brightShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.blurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            direction: { value: new THREE.Vector2(0, 1) },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: blurFragmentShader,
          glslVersion: THREE.GLSL3,
        });

        this.blurPasses = [];
        for (let i = 0; i < this.levels; i++) {
          this.blurPasses.push(new ShaderPingPongPass(this.blurShader, {
            format: THREE.RGBAFormat,
            type: THREE.HalfFloatType,
          }));
        }
      }

      setSize(w, h) {
        let tw = Math.max(1, w);
        let th = Math.max(1, h);
        this.brightPass.setSize(tw, th);
        for (let i = 0; i < this.levels; i++) {
          tw = Math.max(1, Math.round(tw / 2));
          th = Math.max(1, Math.round(th / 2));
          this.blurPasses[i].setSize(tw, th);
        }
      }

      set source(texture) {
        this.brightShader.uniforms.inputTexture.value = texture;
      }

      render(renderer) {
        if (!this.enabled || this.strength <= 0.001) return;
        this.brightShader.uniforms.bloomThreshold.value = this.threshold;
        this.brightPass.render(renderer);
        const baseOffset = Math.max(0.1, this.radius * 2.0);
        const u = this.blurShader.uniforms;
        for (let j = 0; j < this.levels; j++) {
          const blurPass = this.blurPasses[j];
          const stepOffset = baseOffset * (1.0 + j * 0.5);
          u.direction.value.set(stepOffset, 0);
          u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
          blurPass.render(renderer);
          u.direction.value.set(0, stepOffset * 0.5);
          u.inputTexture.value = blurPass.current.texture;
          blurPass.render(renderer);
        }
      }
    }

    const VISION_MODE_MAP = {
      'Normal (Cinematic)': 0,
      'Night Vision (Phosphor)': 1,
      'Thermal (Ironbow)': 2,
      'Thermal (White-Hot)': 3,
    };

    class PostProcessor {
      constructor(renderer, params = {}) {
        this.renderer = renderer;
        this.settings = {
          enabled: params.enabled !== undefined ? params.enabled : true,
          antialias: params.antialias !== undefined ? params.antialias : true,
          bloomEnabled: params.bloomEnabled !== undefined ? params.bloomEnabled : true,
          bloomStrength: params.bloomStrength !== undefined ? params.bloomStrength : 0.65,
          bloomRadius: params.bloomRadius !== undefined ? params.bloomRadius : 0.5,
          bloomThreshold: params.bloomThreshold !== undefined ? params.bloomThreshold : 0.45,
          raysEnabled: params.raysEnabled !== undefined ? params.raysEnabled : false,
          raysStrength: params.raysStrength !== undefined ? params.raysStrength : 0.6,
          raysDensity: params.raysDensity !== undefined ? params.raysDensity : 1.0,
          raysMaxDensity: params.raysMaxDensity !== undefined ? params.raysMaxDensity : 0.5,
          raysDistanceAttenuation: params.raysDistanceAttenuation !== undefined ? params.raysDistanceAttenuation : 2.0,
          raysThreshold: params.raysThreshold !== undefined ? params.raysThreshold : 0.2,
          raysColor: params.raysColor ? (params.raysColor.isColor ? params.raysColor.clone() : new THREE.Color(params.raysColor)) : new THREE.Color(0xf6aa1c),
          raysColorHex: params.raysColorHex || '#f6aa1c',
          anamorphicEnabled: params.anamorphicEnabled !== undefined ? params.anamorphicEnabled : false, // Default is OFF as requested!
          anamorphicIntensity: params.anamorphicIntensity !== undefined ? params.anamorphicIntensity : 4.0,
          anamorphicThreshold: params.anamorphicThreshold !== undefined ? params.anamorphicThreshold : 0.4,
          anamorphicSamples: params.anamorphicSamples !== undefined ? params.anamorphicSamples : 64,
          anamorphicRadius: params.anamorphicRadius !== undefined ? params.anamorphicRadius : 0.0,
          anamorphicSmoothWidth: params.anamorphicSmoothWidth !== undefined ? params.anamorphicSmoothWidth : 0.05,
          anamorphicColor: params.anamorphicColor ? (params.anamorphicColor.isColor ? params.anamorphicColor.clone() : new THREE.Color(params.anamorphicColor)) : new THREE.Color(0x7a8aff),
          anamorphicColorHex: params.anamorphicColorHex || '#7a8aff',
          visionMode: params.visionMode !== undefined ? params.visionMode : 'Normal (Cinematic)',
          thermalSensitivity: params.thermalSensitivity !== undefined ? params.thermalSensitivity : 1.4,
          nightVisionGain: params.nightVisionGain !== undefined ? params.nightVisionGain : 2.1,
          nightVisionNoise: params.nightVisionNoise !== undefined ? params.nightVisionNoise : 0.05,
          crtIntensity: params.crtIntensity !== undefined ? params.crtIntensity : 0.0,
          fisheyeStrength: params.fisheyeStrength !== undefined ? params.fisheyeStrength : 0.0,
          fisheyeRadius: params.fisheyeRadius !== undefined ? params.fisheyeRadius : 1.0,
          chromaticAberration: params.chromaticAberration !== undefined ? params.chromaticAberration : 0.005,
          vignetteBoost: params.vignetteBoost !== undefined ? params.vignetteBoost : 1.05,
          vignetteReduction: params.vignetteReduction !== undefined ? params.vignetteReduction : 0.35,
          noiseIntensity: params.noiseIntensity !== undefined ? params.noiseIntensity : 0.012,
          gamma: params.gamma !== undefined ? params.gamma : 1.0,
          minInputLevel: params.minInputLevel !== undefined ? params.minInputLevel : 0.0,
          maxInputLevel: params.maxInputLevel !== undefined ? params.maxInputLevel : 1.0,
          exposure: params.exposure !== undefined ? params.exposure : 1.0,
        };

        const maxSamples = (this.renderer && this.renderer.capabilities) ? (this.renderer.capabilities.maxSamples || 4) : 4;
        const targetSamples = this.settings.antialias ? Math.min(4, maxSamples) : 0;
        this.sceneTarget = createFBO(1, 1, { type: THREE.HalfFloatType, samples: targetSamples });

        this.bloomPass = new BloomPass(this.settings.bloomStrength, this.settings.bloomRadius, this.settings.bloomThreshold, 5);
        this.moonScreenPos = new THREE.Vector3(0.5, 0.7, 1.0);
        this.moonInFront = true;

        this.godRaysMaskShader = new THREE.RawShaderMaterial({
          uniforms: { inputTexture: { value: null }, threshold: { value: this.settings.raysThreshold } },
          vertexShader: orthoVertexShader, fragmentShader: godRaysDepthMaskShader, glslVersion: THREE.GLSL3,
        });
        this.godRaysMaskPass = new ShaderPass(this.godRaysMaskShader, { format: THREE.RGBAFormat, type: THREE.HalfFloatType });

        this.godRaysGenShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null }, vSunPositionScreenSpace: { value: this.moonScreenPos },
            fStepSize: { value: 1.0 }, distanceAttenuation: { value: this.settings.raysDistanceAttenuation },
            maxDensity: { value: this.settings.raysMaxDensity },
          },
          vertexShader: orthoVertexShader, fragmentShader: godRaysGenerateShader, glslVersion: THREE.GLSL3,
        });
        this.godRaysPingPong = new ShaderPingPongPass(this.godRaysGenShader, { format: THREE.RGBAFormat, type: THREE.HalfFloatType });

        this.anamorphicBrightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null }, threshold: { value: this.settings.anamorphicThreshold },
            smoothWidth: { value: this.settings.anamorphicSmoothWidth },
          },
          vertexShader: orthoVertexShader, fragmentShader: anamorphicBrightShader, glslVersion: THREE.GLSL3,
        });
        this.anamorphicBrightPass = new ShaderPass(this.anamorphicBrightShader, { format: THREE.RGBAFormat, type: THREE.HalfFloatType });

        this.anamorphicBlurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null }, resolution: { value: new THREE.Vector2(1, 1) },
            samples: { value: this.settings.anamorphicSamples }, intensity: { value: this.settings.anamorphicIntensity },
            tintColor: { value: this.settings.anamorphicColor }, bloomRadius: { value: this.settings.anamorphicRadius },
          },
          vertexShader: orthoVertexShader, fragmentShader: anamorphicBlurShader, glslVersion: THREE.GLSL3,
        });
        this.anamorphicBlurPass = new ShaderPass(this.anamorphicBlurShader, { format: THREE.RGBAFormat, type: THREE.HalfFloatType });

        this.finalShader = new THREE.RawShaderMaterial({
          uniforms: {
            resolution: { value: new THREE.Vector2(1, 1) }, bloomEnabled: { value: this.settings.bloomEnabled },
            bloomStrength: { value: this.settings.bloomStrength }, raysEnabled: { value: this.settings.raysEnabled },
            raysStrength: { value: this.settings.raysStrength }, raysColor: { value: this.settings.raysColor },
            anamorphicEnabled: { value: this.settings.anamorphicEnabled }, vignetteBoost: { value: this.settings.vignetteBoost },
            vignetteReduction: { value: this.settings.vignetteReduction }, noiseIntensity: { value: this.settings.noiseIntensity },
            inputTexture: { value: null }, blur0Texture: { value: null }, blur1Texture: { value: null },
            blur2Texture: { value: null }, blur3Texture: { value: null }, blur4Texture: { value: null },
            raysTexture: { value: null }, anamorphicTexture: { value: null }, time: { value: 0 },
          },
          vertexShader: orthoVertexShader, fragmentShader: finalFragmentShader, glslVersion: THREE.GLSL3,
        });
        this.finalPass = new ShaderPass(this.finalShader);

        this.rgbShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: this.finalPass.texture }, fisheyeStrength: { value: this.settings.fisheyeStrength },
            fisheyeRadius: { value: this.settings.fisheyeRadius }, chromaticAberrationAmount: { value: this.settings.chromaticAberration },
            minInputLevel: { value: this.settings.minInputLevel }, maxInputLevel: { value: this.settings.maxInputLevel },
            gammaLevel: { value: this.settings.gamma }, exposure: { value: this.settings.exposure },
            visionMode: { value: VISION_MODE_MAP[this.settings.visionMode] ?? 0 }, thermalSensitivity: { value: this.settings.thermalSensitivity },
            nightVisionGain: { value: this.settings.nightVisionGain }, nightVisionNoise: { value: this.settings.nightVisionNoise },
            crtIntensity: { value: this.settings.crtIntensity }, time: { value: 0 },
          },
          vertexShader: orthoVertexShader, fragmentShader: colorFragmentShader, glslVersion: THREE.GLSL3,
        });
        this.rgbPass = new ShaderPass(this.rgbShader);

        this.copyShader = new THREE.RawShaderMaterial({
          uniforms: { inputTexture: { value: null } },
          vertexShader: orthoVertexShader, fragmentShader: copyFragmentShader, glslVersion: THREE.GLSL3,
        });
        this.copyPass = new ShaderPass(this.copyShader);
      }

      updateSettings() {
        this.bloomPass.enabled = this.settings.bloomEnabled;
        this.bloomPass.strength = this.settings.bloomStrength;
        this.bloomPass.radius = this.settings.bloomRadius;
        this.bloomPass.threshold = this.settings.bloomThreshold;

        this.godRaysMaskShader.uniforms.threshold.value = this.settings.raysThreshold;
        this.godRaysGenShader.uniforms.distanceAttenuation.value = this.settings.raysDistanceAttenuation;
        this.godRaysGenShader.uniforms.maxDensity.value = this.settings.raysMaxDensity;

        this.anamorphicBrightShader.uniforms.threshold.value = this.settings.anamorphicThreshold;
        this.anamorphicBrightShader.uniforms.smoothWidth.value = this.settings.anamorphicSmoothWidth;
        this.anamorphicBlurShader.uniforms.samples.value = this.settings.anamorphicSamples;
        this.anamorphicBlurShader.uniforms.intensity.value = this.settings.anamorphicIntensity;
        this.anamorphicBlurShader.uniforms.tintColor.value.copy(this.settings.anamorphicColor);
        this.anamorphicBlurShader.uniforms.bloomRadius.value = this.settings.anamorphicRadius;

        this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
        this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
        this.finalShader.uniforms.raysEnabled.value = this.settings.raysEnabled && this.moonInFront;
        this.finalShader.uniforms.raysStrength.value = this.settings.raysStrength;
        this.finalShader.uniforms.raysColor.value.copy(this.settings.raysColor);
        this.finalShader.uniforms.anamorphicEnabled.value = this.settings.anamorphicEnabled;
        this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
        this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
        this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;

        this.rgbShader.uniforms.fisheyeStrength.value = this.settings.fisheyeStrength;
        this.rgbShader.uniforms.fisheyeRadius.value = this.settings.fisheyeRadius;
        this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
        this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
        this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
        this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
        this.rgbShader.uniforms.exposure.value = this.settings.exposure;
        this.rgbShader.uniforms.visionMode.value = VISION_MODE_MAP[this.settings.visionMode] ?? 0;
        this.rgbShader.uniforms.thermalSensitivity.value = this.settings.thermalSensitivity;
        this.rgbShader.uniforms.nightVisionGain.value = this.settings.nightVisionGain;
        this.rgbShader.uniforms.nightVisionNoise.value = this.settings.nightVisionNoise;
        this.rgbShader.uniforms.crtIntensity.value = this.settings.crtIntensity;
      }

      setSize(w0, h0, dpr = 1) {
        const w = Math.max(1, Math.floor(w0 * dpr));
        const h = Math.max(1, Math.floor(h0 * dpr));
        this.sceneTarget.setSize(w, h);
        this.finalPass.setSize(w, h);
        this.finalShader.uniforms.resolution.value.set(w, h);
        this.bloomPass.setSize(w, h);

        const grW = Math.max(1, Math.round(w / 2));
        const grH = Math.max(1, Math.round(h / 2));
        this.godRaysMaskPass.setSize(grW, grH);
        this.godRaysPingPong.setSize(grW, grH);

        const anW = Math.max(1, Math.round(w / 4));
        const anH = Math.max(1, Math.round(h / 4));
        this.anamorphicBrightPass.setSize(anW, anH);
        this.anamorphicBlurPass.setSize(anW, anH);
        this.anamorphicBlurShader.uniforms.resolution.value.set(anW, anH);

        this.rgbPass.setSize(w, h);
        this.copyPass.setSize(w, h);
      }

      setAntialias(enabled) {
        this.settings.antialias = !!enabled;
        const maxSamples = (this.renderer && this.renderer.capabilities) ? (this.renderer.capabilities.maxSamples || 4) : 4;
        const samples = this.settings.antialias ? Math.min(4, maxSamples) : 0;
        if (this.sceneTarget.samples !== samples) {
          const oldTarget = this.sceneTarget;
          this.sceneTarget = createFBO(oldTarget.width, oldTarget.height, {
            type: THREE.HalfFloatType,
            samples: samples,
          });
          oldTarget.dispose();
        }
      }

      renderScene(scene, camera) {
        if (!this.settings.enabled) {
          this.renderer.setRenderTarget(null);
          this.renderer.render(scene, camera);
          return;
        }
        this.renderer.setRenderTarget(this.sceneTarget);
        this.renderer.render(scene, camera);
        this.renderer.setRenderTarget(null);
        this.render(this.sceneTarget.texture);
      }

      render(sourceTexture) {
        if (!this.settings.enabled) {
          this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
          this.copyPass.render(this.renderer, true);
          return;
        }
        this.updateSettings();

        // 1. Bloom
        this.bloomPass.source = sourceTexture;
        this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
        this.bloomPass.render(this.renderer);
        this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
        this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
        this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
        this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
        this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

        // 2. Godrays
        if (this.settings.raysEnabled && this.settings.raysStrength > 0.001 && this.moonInFront) {
          this.godRaysMaskShader.uniforms.inputTexture.value = sourceTexture;
          this.godRaysMaskShader.uniforms.threshold.value = this.settings.raysThreshold;
          this.godRaysMaskPass.render(this.renderer);

          const filterLen = this.settings.raysDensity;
          const tapsPerPass = 6.0;
          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -1.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysMaskPass.texture;
          this.godRaysPingPong.render(this.renderer);

          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -2.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysPingPong.texture;
          this.godRaysPingPong.render(this.renderer);

          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -3.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysPingPong.texture;
          this.godRaysPingPong.render(this.renderer);

          this.finalPass.shader.uniforms.raysTexture.value = this.godRaysPingPong.texture;
          this.finalPass.shader.uniforms.raysEnabled.value = true;
        } else {
          this.finalPass.shader.uniforms.raysEnabled.value = false;
        }

        // 3. Anamorphic Flare
        if (this.settings.anamorphicEnabled && this.settings.anamorphicIntensity > 0.001) {
          this.anamorphicBrightShader.uniforms.inputTexture.value = sourceTexture;
          this.anamorphicBrightShader.uniforms.threshold.value = this.settings.anamorphicThreshold;
          this.anamorphicBrightShader.uniforms.smoothWidth.value = this.settings.anamorphicSmoothWidth;
          this.anamorphicBrightPass.render(this.renderer);

          this.anamorphicBlurShader.uniforms.inputTexture.value = this.anamorphicBrightPass.texture;
          this.anamorphicBlurShader.uniforms.samples.value = this.settings.anamorphicSamples;
          this.anamorphicBlurShader.uniforms.intensity.value = this.settings.anamorphicIntensity;
          this.anamorphicBlurShader.uniforms.tintColor.value.copy(this.settings.anamorphicColor);
          this.anamorphicBlurShader.uniforms.bloomRadius.value = this.settings.anamorphicRadius;
          this.anamorphicBlurPass.render(this.renderer);

          this.finalPass.shader.uniforms.anamorphicTexture.value = this.anamorphicBlurPass.texture;
          this.finalPass.shader.uniforms.anamorphicEnabled.value = true;
        } else {
          this.finalPass.shader.uniforms.anamorphicEnabled.value = false;
        }

        const randomTime = Math.random() * 100000;
        this.finalPass.shader.uniforms.time.value = randomTime;
        this.rgbPass.shader.uniforms.time.value = randomTime;

        this.finalPass.render(this.renderer);
        this.rgbPass.render(this.renderer, true);
      }

      attachGUI(gui, title = "Post-Processing (PostProcessor.js)") {
        const root = gui.addFolder(title);
        root.add(this.settings, "enabled").name("Enable Post-Process");
        root.add(this.settings, "antialias").name("MSAA Antialias").onChange((v) => this.setAntialias(v));

        const bloom = root.addFolder("Atmospheric Bloom");
        bloom.add(this.settings, "bloomEnabled").name("Enable Bloom").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomStrength", 0, 3.0, 0.05).name("Bloom Strength").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomRadius", 0, 2.0, 0.05).name("Bloom Radius").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomThreshold", 0, 1.0, 0.01).name("Bloom Threshold").onChange(() => this.updateSettings());

        const anamorphic = root.addFolder("Three.js Anamorphic Flare");
        anamorphic.add(this.settings, "anamorphicEnabled").name("Enable Anamorphic").onChange(() => this.updateSettings());
        anamorphic.add(this.settings, "anamorphicIntensity", 0, 10.0, 0.1).name("Intensity").onChange(() => this.updateSettings());
        anamorphic.add(this.settings, "anamorphicThreshold", 0.0, 0.9, 0.01).name("Threshold").onChange(() => this.updateSettings());
        anamorphic.add(this.settings, "anamorphicRadius", 0.0, 1.0, 0.01).name("Bloom Radius").onChange(() => this.updateSettings());
        anamorphic.addColor(this.settings, "anamorphicColorHex").name("Tint Color").onChange((v) => {
          this.settings.anamorphicColor.set(v);
          this.updateSettings();
        });

        const lens = root.addFolder("Lens, Optics & Film Grain");
        lens.add(this.settings, "chromaticAberration", 0, 0.05, 0.001).name("Chromatic Aberration").onChange(() => this.updateSettings());
        lens.add(this.settings, "vignetteBoost", 0, 2.0, 0.05).name("Vignette Boost").onChange(() => this.updateSettings());
        lens.add(this.settings, "vignetteReduction", 0, 2.0, 0.05).name("Vignette Falloff").onChange(() => this.updateSettings());
        lens.add(this.settings, "noiseIntensity", 0, 0.08, 0.002).name("Film Grain").onChange(() => this.updateSettings());
        lens.add(this.settings, "gamma", 0.2, 2.0, 0.05).name("Gamma").onChange(() => this.updateSettings());

        return root;
      }

    // Initialize PostProcessor Suite (anamorphic default is OFF as requested)

    // =========================================================================
    // DYNAMIC PROCEDURAL BILLBOARD CANVASES

    function createCanvasTexture(width, height) {
      const c = document.createElement('canvas');
      c.width = width;
      c.height = height;
      const ctx = c.getContext('2d');
      const tex = new THREE.CanvasTexture(c);
      tex.minFilter = THREE.LinearFilter;
      tex.magFilter = THREE.LinearFilter;
      return { canvas: c, ctx, texture: tex };

    const screenSMPTE = createCanvasTexture(512, 288);
    const screenResort = createCanvasTexture(512, 288);
    const screenSignal = createCanvasTexture(512, 288);
    const screenVerticalBars = createCanvasTexture(512, 288);
    const screenBeach = createCanvasTexture(512, 288);

    let isDigitalStorm = false;
    let stormGlitchClock = 0;
    let nextStormTime = 14.0;

    function renderScreenTextures(time) {
      const isGlitchBurst = isDigitalStorm;

      // 1. SMPTE / OUT OF STOCK (Matching image2 left & center)
      {
        const { ctx, canvas: c, texture } = screenSMPTE;
        const w = c.width, h = c.height;
        const bars = ['#c8c8c8', '#d0c800', '#00c8c8', '#00c000', '#c800c8', '#c80000', '#0000c8'];
        const barW = w / bars.length;

        for (let i = 0; i < bars.length; i++) {
          ctx.fillStyle = bars[i];
          ctx.fillRect(i * barW, 0, barW + 1, h * 0.72);
        }

        const subBars = ['#0000c8', '#161616', '#c800c8', '#161616', '#00c8c8', '#161616', '#c8c8c8'];
        for (let i = 0; i < subBars.length; i++) {
          ctx.fillStyle = subBars[i];
          ctx.fillRect(i * barW, h * 0.72, barW + 1, h * 0.12);
        }

        ctx.fillStyle = '#00253b'; ctx.fillRect(0, h * 0.84, w * 0.18, h * 0.16);
        ctx.fillStyle = '#ffffff'; ctx.fillRect(w * 0.18, h * 0.84, w * 0.18, h * 0.16);
        ctx.fillStyle = '#330055'; ctx.fillRect(w * 0.36, h * 0.84, w * 0.18, h * 0.16);
        ctx.fillStyle = '#121212'; ctx.fillRect(w * 0.54, h * 0.84, w * 0.46, h * 0.16);

        // Scanlines
        ctx.fillStyle = 'rgba(0, 0, 0, 0.22)';
        for (let y = 0; y < h; y += 4) {
          ctx.fillRect(0, y, w, 2);
        }

        // Center Box
        const boxW = w * 0.74, boxH = 68;
        const bx = (w - boxW) / 2, by = (h * 0.42) - (boxH / 2);

        ctx.fillStyle = 'rgba(12, 12, 16, 0.94)';
        ctx.fillRect(bx, by, boxW, boxH);
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#ffffff';
        ctx.strokeRect(bx, by, boxW, boxH);

        ctx.font = '900 38px "Impact", "Arial Black", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#ffffff';
        ctx.fillText('OUT OF STOCK', w / 2, by + 28);

        ctx.font = '700 13px monospace';
        ctx.fillStyle = '#ff3344';
        ctx.fillText('ERR_0x992B: RESORT REQUISITION VOID', w / 2, by + 52);

        if (isGlitchBurst) {
          const sliceH = 20;
          const sliceY = (time * 150) % (h - sliceH);
          ctx.fillStyle = 'rgba(255, 0, 50, 0.35)';
          ctx.fillRect(0, sliceY, w, sliceH);
        }

        texture.needsUpdate = true;
      }

      // 2. LUXURY RESORTS Tropical Ad (Matching image2 right foreground & mid-left)
      {
        const { ctx, canvas: c, texture } = screenResort;
        const w = c.width, h = c.height;

        const skyGrad = ctx.createLinearGradient(0, 0, 0, h * 0.7);
        skyGrad.addColorStop(0, '#00a8ff');
        skyGrad.addColorStop(0.65, '#38d9a9');
        skyGrad.addColorStop(1, '#ffe066');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, w, h);

        ctx.fillStyle = '#fff9db';
        ctx.beginPath();
        ctx.arc(w * 0.85, h * 0.2, 34, 0, Math.PI * 2);
        ctx.fill();

        const seaGrad = ctx.createLinearGradient(0, h * 0.65, 0, h);
        seaGrad.addColorStop(0, '#00b4d8');
        seaGrad.addColorStop(1, '#0077b6');
        ctx.fillStyle = seaGrad;
        ctx.fillRect(0, h * 0.65, w, h * 0.35);

        // Waves
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.55)';
        ctx.lineWidth = 2;
        for (let row = 0; row < 3; row++) {
          ctx.beginPath();
          const wy = h * (0.7 + row * 0.08);
          for (let wx = 0; wx < w; wx += 20) {
            const dy = Math.sin(wx * 0.05 + time * 2.5 + row) * 3;
            if (wx === 0) ctx.moveTo(wx, wy + dy);
            else ctx.lineTo(wx, wy + dy);
          }
          ctx.stroke();
        }

        // Golden Sand Shore
        ctx.fillStyle = '#ffd166';
        ctx.beginPath();
        ctx.moveTo(w * 0.45, h);
        ctx.quadraticCurveTo(w * 0.65, h * 0.78, w, h * 0.82);
        ctx.lineTo(w, h);
        ctx.closePath();
        ctx.fill();

        // Palm Trees on Right
        const drawPalm = (px, py, scale, sway) => {
          ctx.save();
          ctx.translate(px, py);
          ctx.scale(scale, scale);
          ctx.lineWidth = 9;
          ctx.strokeStyle = '#7f4f24';
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.quadraticCurveTo(sway * 10, -50, sway * 15, -110);
          ctx.stroke();
          ctx.strokeStyle = '#2d6a4f';
          ctx.lineWidth = 5;
          const fronds = 7;
          for (let f = 0; f < fronds; f++) {
            const ang = (f / fronds) * Math.PI + 0.15 + (sway * 0.1);
            ctx.beginPath();
            ctx.moveTo(sway * 15, -110);
            const fx = sway * 15 + Math.cos(ang) * 55;
            const fy = -110 - Math.sin(ang) * 45;
            ctx.quadraticCurveTo(sway * 15 + Math.cos(ang) * 30, -110 - Math.sin(ang) * 60, fx, fy);
            ctx.stroke();
          }
          ctx.restore();
        };

        const sway = Math.sin(time * 1.8) * 0.5;
        drawPalm(w * 0.88, h * 0.95, 1.15, sway);
        drawPalm(w * 0.78, h * 0.98, 0.9, sway * 0.85);

        // Couple silhouette
        ctx.fillStyle = '#3a2312';
        ctx.beginPath();
        ctx.ellipse(w * 0.72, h * 0.88, 7, 14, 0, 0, Math.PI * 2);
        ctx.ellipse(w * 0.68, h * 0.89, 6, 13, 0, 0, Math.PI * 2);
        ctx.fill();

        // High saturated text
        ctx.textAlign = 'left';
        ctx.font = '900 36px "Impact", "Arial Black", sans-serif';
        ctx.fillStyle = '#0a2540';
        ctx.fillText('LUXURY RESORTS', 28, 48);
        ctx.fillStyle = '#ffffff';
        ctx.fillText('LUXURY RESORTS', 26, 46);

        ctx.font = '800 22px "Arial Black", sans-serif';
        ctx.fillStyle = '#005f73';
        ctx.fillText('TROPICAL BEACHES', 28, 78);
        ctx.fillStyle = '#00f5d4';
        ctx.fillText('TROPICAL BEACHES', 26, 76);

        // Orange "SHOP NOW" Button
        const btnX = 26, btnY = h - 68, btnW = 145, btnH = 38;
        ctx.fillStyle = '#ff7b00';
        ctx.beginPath();
        ctx.roundRect ? ctx.roundRect(btnX, btnY, btnW, btnH, 8) : ctx.rect(btnX, btnY, btnW, btnH);
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#ffe8d6';
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.font = '900 17px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('SHOP NOW >', btnX + btnW / 2, btnY + 24);

        if (isGlitchBurst) {
          ctx.fillStyle = 'rgba(255, 0, 50, 0.4)';
          ctx.fillRect(0, (time * 100) % h, w, 22);
        }

        texture.needsUpdate = true;
      }

      // 3. SIGNAL LOST Glitch CRT
      {
        const { ctx, canvas: c, texture } = screenSignal;
        const w = c.width, h = c.height;
        ctx.fillStyle = '#0a0a14';
        ctx.fillRect(0, 0, w, h);

        for (let i = 0; i < 7; i++) {
          const ly = ((time * 50 + i * 42) % h);
          ctx.fillStyle = (i % 2 === 0) ? 'rgba(0, 240, 255, 0.25)' : 'rgba(255, 0, 120, 0.25)';
          ctx.fillRect(0, ly, w, 14);
        }

        const boxW = 340, boxH = 75;
        const bx = (w - boxW) / 2, by = (h - boxH) / 2;
        ctx.fillStyle = 'rgba(12, 12, 22, 0.92)';
        ctx.fillRect(bx, by, boxW, boxH);
        ctx.strokeStyle = '#00f0ff';
        ctx.lineWidth = 3;
        ctx.strokeRect(bx, by, boxW, boxH);

        ctx.textAlign = 'center';
        ctx.font = '900 36px "Impact", monospace';
        ctx.fillStyle = '#ffffff';
        ctx.fillText('SIGNAL LOST', w / 2, by + 34);

        ctx.font = '700 13px monospace';
        ctx.fillStyle = '#00f0ff';
        const dots = '.'.repeat(1 + (Math.floor(time * 2.5) % 4));
        ctx.fillText('SEEKING AD SERVER' + dots, w / 2, by + 58);

        texture.needsUpdate = true;
      }

      // 4. VERTICAL GLITCH TEST STRIPES (Iconic center-left billboard in image2)
      {
        const { ctx, canvas: c, texture } = screenVerticalBars;
        const w = c.width, h = c.height;
        const stripColors = [
          '#64dfdf', '#7209b7', '#f72585', '#b5179e', '#4895ef',
          '#d8b4e2', '#cbf3f0', '#ffbf69', '#2b2d42', '#8d99ae',
          '#ffffff', '#00f5d4', '#e63946', '#f1faee', '#a8dadc'
        ];

        let curX = 0;
        let colIdx = 0;
        while (curX < w) {
          const sw = 14 + ((curX * 37) % 28);
          ctx.fillStyle = stripColors[(colIdx++) % stripColors.length];
          ctx.fillRect(curX, 0, sw, h);
          curX += sw;
        }

        const scanY = (time * 80) % h;
        ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
        ctx.fillRect(0, scanY, w, 20);

        texture.needsUpdate = true;
      }

      // 5. TROPICAL BEACHES Secondary Ad
      {
        const { ctx, canvas: c, texture } = screenBeach;
        const w = c.width, h = c.height;
        const bgGrad = ctx.createLinearGradient(0, 0, w, h);
        bgGrad.addColorStop(0, '#03045e');
        bgGrad.addColorStop(0.5, '#0077b6');
        bgGrad.addColorStop(1, '#00b4d8');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, w, h);

        ctx.fillStyle = '#ffd166';
        ctx.beginPath();
        ctx.arc(w * 0.25, h * 0.35, 42, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#06d6a0';
        ctx.beginPath();
        ctx.moveTo(w * 0.1, h);
        ctx.quadraticCurveTo(w * 0.5, h * 0.65, w * 0.95, h);
        ctx.fill();

        ctx.textAlign = 'right';
        ctx.font = '900 34px "Impact", sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.fillText('PARADISE NOW', w - 24, 48);

        ctx.font = '700 18px sans-serif';
        ctx.fillStyle = '#ffea00';
        ctx.fillText('ESCAPE THE WASTELAND', w - 24, 76);

        texture.needsUpdate = true;
      }
    }

    // =========================================================================
    // PROCEDURAL TERRAIN & REFLECTIVE PUDDLES (Matching image2)
    // =========================================================================
    const terrainGroup = new THREE.Group();
    scene.add(terrainGroup);
    const rocksGroup = new THREE.Group();
    scene.add(rocksGroup);

    let terrainMesh, puddlesMesh;

    function createTerrain(groundColorHex, puddleColorHex) {
      if (terrainMesh) {
        terrainGroup.remove(terrainMesh);
        terrainMesh.geometry.dispose();
      }
      if (puddlesMesh) {
        terrainGroup.remove(puddlesMesh);
        puddlesMesh.geometry.dispose();
      }

      const size = 120;
      const segments = 64;
      const geom = new THREE.PlaneGeometry(size, size, segments, segments);
      geom.rotateX(-Math.PI / 2);

      const pos = geom.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i);
        const z = pos.getZ(i);

        let y = Math.sin(x * 0.07) * Math.cos(z * 0.07) * 2.8;
        y += Math.sin(x * 0.16 + z * 0.12) * 1.3;
        y += Math.cos(x * 0.3 - z * 0.25) * 0.7;

        const distFromCenter = Math.hypot(x, z);
        if (distFromCenter > 32) {
          y += Math.pow((distFromCenter - 32) * 0.14, 1.7);
        }

        // Depressions for flat mud puddles
        if (y < -0.95) {
          y = -0.95 + (y + 0.95) * 0.2;
        }

        pos.setY(i, y);
      }

      geom.computeVertexNormals();
      groundMaterial.color.set(groundColorHex);
      terrainMesh = new THREE.Mesh(geom, groundMaterial);
      terrainMesh.receiveShadow = true;
      terrainGroup.add(terrainMesh);

      // Glassy Reflective Puddles Plane
      const puddleGeom = new THREE.PlaneGeometry(85, 85, 24, 24);
      puddleGeom.rotateX(-Math.PI / 2);
      puddleMaterial.color.set(puddleColorHex);
      puddlesMesh = new THREE.Mesh(puddleGeom, puddleMaterial);
      puddlesMesh.position.y = -0.88;
      puddlesMesh.receiveShadow = true;
      terrainGroup.add(puddlesMesh);

      // Low-poly debris and rocks
      while (rocksGroup.children.length > 0) {
        const obj = rocksGroup.children[0];
        rocksGroup.remove(obj);
        if (obj.geometry) obj.geometry.dispose();
      }

      const rockGeomBase = new THREE.DodecahedronGeometry(1, 0);
      const rockMat = groundMaterial.clone();
      rockMat.roughness = 0.95;

      const rockMergedList = [];
      for (let r = 0; r < 80; r++) {
        const rx = (Math.random() - 0.5) * 65;
        const rz = (Math.random() - 0.5) * 65;
        if (Math.hypot(rx, rz) < 5) continue;

        const g = rockGeomBase.clone();
        const s = 0.35 + Math.random() * 1.3;
        g.scale(s, s * (0.45 + Math.random() * 0.55), s);
        g.rotateX(Math.random() * Math.PI);
        g.rotateY(Math.random() * Math.PI);
        g.translate(rx, -0.85 + Math.random() * 0.35, rz);
        rockMergedList.push(g);
      }

      if (rockMergedList.length > 0) {
        const mergedRocks = BufferGeometryUtils.mergeGeometries(rockMergedList, false);
        const rocksMesh = new THREE.Mesh(mergedRocks, rockMat);
        rocksMesh.receiveShadow = true;
        rocksMesh.castShadow = true;
        rocksGroup.add(rocksMesh);
      }
    }

    createTerrain(params.groundColor, COLOR_SCHEMES['Original'].puddles);

    // =========================================================================
    // LOW-POLY FACETED STORM CLOUDS CANOPY (Overcast Dystopian Sky)
    // =========================================================================
    const skyGeom = new THREE.SphereGeometry(150, 24, 16, 0, Math.PI * 2, 0, Math.PI * 0.52);
    const skyPos = skyGeom.attributes.position;
    for (let i = 0; i < skyPos.count; i++) {
      const vx = skyPos.getX(i);
      const vy = skyPos.getY(i);
      const vz = skyPos.getZ(i);
      const noise = Math.sin(vx * 0.05) * Math.cos(vz * 0.05) * 8.0 + Math.sin(vy * 0.1) * 4.0;
      skyPos.setXYZ(i, vx + noise * 0.3, vy + noise * 0.4, vz + noise * 0.3);
    }
    skyGeom.computeVertexNormals();

    const skyMaterial = new THREE.MeshBasicMaterial({
      color: new THREE.Color(params.skyColor),
      side: THREE.BackSide,
      fog: false
    });
    const skyDome = new THREE.Mesh(skyGeom, skyMaterial);
    scene.add(skyDome);

    // Subtle drifting atmospheric particles (no harsh stars or strobes)
    const particleCount = 450;
    const particleGeom = new THREE.BufferGeometry();
    const particlePos = new Float32Array(particleCount * 3);
    const particleVels = [];

    for (let p = 0; p < particleCount; p++) {
      particlePos[p * 3] = (Math.random() - 0.5) * 100;
      particlePos[p * 3 + 1] = Math.random() * 40;
      particlePos[p * 3 + 2] = (Math.random() - 0.5) * 100;
      particleVels.push({
        x: -0.1 - Math.random() * 0.2,
        y: -0.15 - Math.random() * 0.2,
        z: (Math.random() - 0.5) * 0.1
      });
    }

    particleGeom.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));
    const particleMat = new THREE.PointsMaterial({
      color: 0x90a4ae,
      size: 0.28,
      transparent: true,
      opacity: 0.5
    });
    const stormParticles = new THREE.Points(particleGeom, particleMat);
    scene.add(stormParticles);

    // =========================================================================
    // TOWER & BILLBOARD MONOLITHS (Matching image2 layout & cel-shaded lines)
    // =========================================================================
    const billboardGroup = new THREE.Group();
    scene.add(billboardGroup);
    const cablesGroup = new THREE.Group();
    scene.add(cablesGroup);

    const towerAnchorPoints = [];

    function buildTrussPylonGeometry(height, width = 2.4, depth = 2.4) {
      const geoms = [];
      const colThick = 0.32;
      const hw = width / 2;
      const hd = depth / 2;

      // 4 Main Columns
      const colGeom = new THREE.BoxGeometry(colThick, height, colThick);
      colGeom.translate(0, height / 2, 0);

      const c1 = colGeom.clone(); c1.translate(-hw, 0, -hd); geoms.push(c1);
      const c2 = colGeom.clone(); c2.translate(hw, 0, -hd); geoms.push(c2);
      const c3 = colGeom.clone(); c3.translate(-hw, 0, hd); geoms.push(c3);
      const c4 = colGeom.clone(); c4.translate(hw, 0, hd); geoms.push(c4);

      // Section cross beams and X-braces
      const sectionH = 2.8;
      const numSections = Math.floor(height / sectionH);

      for (let s = 0; s < numSections; s++) {
        const yBase = s * sectionH;
        const yTop = (s + 1) * sectionH;

        const hxGeom = new THREE.BoxGeometry(width, 0.22, 0.22);
        hxGeom.translate(0, yTop, 0);
        const hzGeom = new THREE.BoxGeometry(0.22, 0.22, depth);
        hzGeom.translate(0, yTop, 0);

        const hb1 = hxGeom.clone(); hb1.translate(0, 0, -hd); geoms.push(hb1);
        const hb2 = hxGeom.clone(); hb2.translate(0, 0, hd); geoms.push(hb2);
        const hb3 = hzGeom.clone(); hb3.translate(-hw, 0, 0); geoms.push(hb3);
        const hb4 = hzGeom.clone(); hb4.translate(hw, 0, 0); geoms.push(hb4);

        const diagLen = Math.hypot(width, sectionH);
        const diagAng = Math.atan2(sectionH, width);

        const dFront1 = new THREE.BoxGeometry(diagLen, 0.16, 0.16);
        dFront1.rotateZ(diagAng);
        dFront1.translate(0, yBase + sectionH / 2, -hd);
        geoms.push(dFront1);

        const dFront2 = new THREE.BoxGeometry(diagLen, 0.16, 0.16);
        dFront2.rotateZ(-diagAng);
        dFront2.translate(0, yBase + sectionH / 2, -hd);
        geoms.push(dFront2);

        const diagSideLen = Math.hypot(depth, sectionH);
        const diagSideAng = Math.atan2(sectionH, depth);

        const dSide1 = new THREE.BoxGeometry(0.16, diagSideLen, 0.16);
        dSide1.rotateX(diagSideAng);
        dSide1.translate(-hw, yBase + sectionH / 2, 0);
        geoms.push(dSide1);

        const dSide2 = new THREE.BoxGeometry(0.16, diagSideLen, 0.16);
        dSide2.rotateX(-diagSideAng);
        dSide2.translate(-hw, yBase + sectionH / 2, 0);
        geoms.push(dSide2);
      }

      // Catwalk Platform at Top
      const platGeom = new THREE.BoxGeometry(width * 1.8, 0.35, depth * 1.6);
      platGeom.translate(0, height, 0);
      geoms.push(platGeom);

      // Railings
      const railH = 1.2;
      const railPost = new THREE.BoxGeometry(0.12, railH, 0.12);
      railPost.translate(-hw * 1.7, height + railH / 2, -hd * 1.5); geoms.push(railPost);
      const railPost2 = new THREE.BoxGeometry(0.12, railH, 0.12);
      railPost2.translate(hw * 1.7, height + railH / 2, -hd * 1.5); geoms.push(railPost2);

      const topRail = new THREE.BoxGeometry(width * 1.8, 0.1, 0.1);
      topRail.translate(0, height + railH, -hd * 1.5);
      geoms.push(topRail);

      return BufferGeometryUtils.mergeGeometries(geoms, false);
    }

    function createBillboardScreen(width, height, texture, emissiveColorHex, pitchX = 0) {
      const group = new THREE.Group();

      // Backing metal box
      const frameGeom = new THREE.BoxGeometry(width + 0.6, height + 0.5, 0.6);
      const frameMesh = new THREE.Mesh(frameGeom, frameMaterial);
      frameMesh.castShadow = true;
      group.add(frameMesh);

      // Graphic novel / cel-shaded ink outline
      const edges = new THREE.EdgesGeometry(frameGeom, 35);
      const outline = new THREE.LineSegments(edges, outlineMaterial);
      group.add(outline);

      // Emissive screen
      const screenGeom = new THREE.PlaneGeometry(width, height);
      const screenMat = new THREE.MeshStandardMaterial({
        map: texture,
        roughness: 0.25,
        metalness: 0.1,
        emissive: new THREE.Color(emissiveColorHex),
        emissiveMap: texture,
        emissiveIntensity: params.billboardGlowIntensity
      });
      const screenMesh = new THREE.Mesh(screenGeom, screenMat);
      screenMesh.position.z = 0.31;
      group.add(screenMesh);

      // Downward screen spotlight illuminating ground and trusses
      const light = new THREE.PointLight(emissiveColorHex, params.billboardGlowIntensity * 1.3, 36, 1.4);
      light.position.set(0, -1, 3.8);
      group.add(light);
      billboardLights.push({ light, material: screenMat, baseColor: emissiveColorHex });

      if (pitchX !== 0) {
        group.rotation.x = pitchX;
      }

      return { group, screenMesh, light };
    }

    function buildEcosystemTowers() {
      while (billboardGroup.children.length > 0) {
        const obj = billboardGroup.children[0];
        billboardGroup.remove(obj);
        if (obj.geometry) obj.geometry.dispose();
      }
      billboardLights.length = 0;
      towerAnchorPoints.length = 0;

      TOWER_SPECS.forEach((spec) => {
        const towerObj = new THREE.Group();
        towerObj.position.set(spec.x, 0, spec.z);
        towerObj.rotation.y = spec.rotY;

        const trussGeom = buildTrussPylonGeometry(spec.height, 2.4, 2.4);
        const trussMesh = new THREE.Mesh(trussGeom, towerMaterial);
        trussMesh.castShadow = true;
        trussMesh.receiveShadow = true;
        towerObj.add(trussMesh);

        // Cel-shaded dark edges on towers
        const trussEdges = new THREE.EdgesGeometry(trussGeom, 40);
        const trussOutline = new THREE.LineSegments(trussEdges, outlineMaterial);
        towerObj.add(trussOutline);

        const mainSc = createBillboardScreen(
          spec.primaryScreen.w, spec.primaryScreen.h,
          spec.primaryScreen.tex, spec.primaryScreen.color,
          spec.primaryScreen.pitchX || 0
        );
        mainSc.group.position.set(0, spec.height + spec.primaryScreen.yOff, 1.4);
        towerObj.add(mainSc.group);

        if (spec.secondaryScreen) {
          const secSc = createBillboardScreen(
            spec.secondaryScreen.w, spec.secondaryScreen.h,
            spec.secondaryScreen.tex, spec.secondaryScreen.color,
            spec.secondaryScreen.pitchX || 0
          );
          secSc.group.position.set(0, spec.height + spec.secondaryScreen.yOff, 1.4);
          towerObj.add(secSc.group);
        }

        billboardGroup.add(towerObj);

        towerAnchorPoints.push({
          worldTop: new THREE.Vector3(spec.x, spec.height, spec.z),
          worldMid: new THREE.Vector3(spec.x, spec.height * 0.65, spec.z),
          id: spec.id
        });
      });
    }

    buildEcosystemTowers();

    // =========================================================================
    // DROOPING SAGGING CABLES (Vines of the Billboard Ecosystem)
    // =========================================================================
    function buildDroopingCables() {
      while (cablesGroup.children.length > 0) {
        const obj = cablesGroup.children[0];
        cablesGroup.remove(obj);
        if (obj.geometry) obj.geometry.dispose();
      }

      const cableMergedGeoms = [];
      const sagBase = 4.4 * params.cableSagFactor;

      for (let i = 0; i < 5; i++) {
        const tA = towerAnchorPoints[i];
        const tB = towerAnchorPoints[i + 1];
        if (!tA || !tB) continue;

        // 6 cables per top span looping gracefully between towers
        const cablesInBundle = 6;
        for (let c = 0; c < cablesInBundle; c++) {
          const yOffsetA = (c - 2.5) * 0.55;
          const yOffsetB = (c - 2.5) * 0.5;
          const xSpread = (Math.random() - 0.5) * 1.6;
          const zSpread = (Math.random() - 0.5) * 1.6;

          const p0 = new THREE.Vector3(tA.worldTop.x + xSpread, tA.worldTop.y + yOffsetA - 1.0, tA.worldTop.z + zSpread);
          const p3 = new THREE.Vector3(tB.worldTop.x - xSpread, tB.worldTop.y + yOffsetB - 1.0, tB.worldTop.z - zSpread);

          const mid = new THREE.Vector3().addVectors(p0, p3).multiplyScalar(0.5);
          const sag = sagBase + (c * 0.85) + (Math.random() * 0.5);
          mid.y -= sag;

          const p1 = new THREE.Vector3().lerpVectors(p0, mid, 0.52);
          const p2 = new THREE.Vector3().lerpVectors(mid, p3, 0.52);

          const curve = new THREE.CubicBezierCurve3(p0, p1, p2, p3);
          const tube = new THREE.TubeGeometry(curve, 32, 0.1 + Math.random() * 0.05, 6, false);
          cableMergedGeoms.push(tube);
        }

        // Secondary mid cables
        for (let c = 0; c < 3; c++) {
          const p0 = new THREE.Vector3(tA.worldMid.x, tA.worldMid.y - c * 0.5, tA.worldMid.z);
          const p3 = new THREE.Vector3(tB.worldMid.x, tB.worldMid.y - c * 0.5, tB.worldMid.z);
          const mid = new THREE.Vector3().addVectors(p0, p3).multiplyScalar(0.5);
          mid.y -= (sagBase * 0.72 + c * 0.6);

          const p1 = new THREE.Vector3().lerpVectors(p0, mid, 0.5);
          const p2 = new THREE.Vector3().lerpVectors(mid, p3, 0.5);
          const curve = new THREE.CubicBezierCurve3(p0, p1, p2, p3);
          const tube = new THREE.TubeGeometry(curve, 26, 0.08, 6, false);
          cableMergedGeoms.push(tube);
        }
      }

      if (cableMergedGeoms.length > 0) {
        const mergedCables = BufferGeometryUtils.mergeGeometries(cableMergedGeoms, false);
        const cablesMesh = new THREE.Mesh(mergedCables, cableMaterial);
        cablesMesh.castShadow = true;
        cablesGroup.add(cablesMesh);
      }
    }

    buildDroopingCables();

    // =========================================================================
    // COLOR SCHEME APPLICATION
    // =========================================================================
    function applyColorScheme(schemeName) {
      const scheme = COLOR_SCHEMES[schemeName];
      if (!scheme) return;

      params.colorScheme = schemeName;
      params.groundColor = scheme.ground;
      params.towerColor = scheme.towers;
      params.cableColor = scheme.cables;
      params.skyColor = scheme.sky;
      params.ambientColor = scheme.ambient;
      params.stormLightColor = scheme.stormLight;
      params.screenAccentColor = scheme.screenAccent;

      groundMaterial.color.set(scheme.ground);
      puddleMaterial.color.set(scheme.puddles);
      towerMaterial.color.set(scheme.towers);
      cableMaterial.color.set(scheme.cables);

      ambientLight.color.set(scheme.ambient);
      directionalLight.color.set(scheme.stormLight);

      if (!params.greenscreen) {
        scene.background.set(scheme.sky);
        if (scene.fog) scene.fog.color.set(scheme.fog);
        skyMaterial.color.set(scheme.sky);
        skyDome.visible = true;
      }

      billboardLights.forEach((bl, i) => {
        const tint = (i % 2 === 0) ? scheme.screenAccent : scheme.screenGlow;
        bl.light.color.set(tint);
        bl.material.emissive.set(tint);
      });
    }

    function toggleGreenscreen(enabled) {
      params.greenscreen = enabled;
      if (enabled) {
        scene.background.set(0x00ff00);
        scene.fog = null;
        skyDome.visible = false;
      } else {
        const scheme = COLOR_SCHEMES[params.colorScheme] || COLOR_SCHEMES['Original'];
        scene.background.set(params.skyColor);
        scene.fog = new THREE.FogExp2(scheme.fog, params.fogDensity);
        skyMaterial.color.set(params.skyColor);
        skyDome.visible = true;
      }
    }

    // =========================================================================
    // 8 PRECONFIGURED CINEMATIC CAMERA ANIMATIONS
    // (With user zoom in/out freedom during animation!)
    // =========================================================================
    let cameraAnimTimer = 0;
    function updateCinematicCamera(dt) {
      if (params.animationMode === 'Static View' || params.animationSpeed === 0) {
        controls.update();
        return;
      }

      cameraAnimTimer += dt * params.animationSpeed * 0.12;
      const t = cameraAnimTimer;
      const target = controls.target;
      const dir = new THREE.Vector3();

      switch (params.animationMode) {
        case 'Wasteland Drone': {
          // Smooth orbital sweep around target
          const theta = t * 0.45;
          const phi = 0.28 + Math.sin(t * 0.3) * 0.08;
          dir.set(
            Math.sin(theta) * Math.cos(phi),
            -Math.sin(phi),
            Math.cos(theta) * Math.cos(phi)
          ).normalize();
          break;
        }

        case 'Low Mud Glide': {
          // Low tracking shot skimming across reflective mud puddles
          const sweep = Math.sin(t * 0.4) * 0.55;
          const phi = 0.36 + Math.sin(t * 0.6) * 0.05;
          dir.set(
            Math.sin(sweep) * Math.cos(phi),
            -Math.sin(phi),
            Math.cos(sweep) * Math.cos(phi)
          ).normalize();
          break;
        }

        case 'Towering Monoliths': {
          // Vertical crane ascent rising towards the stormy clouds
          const cycle = (Math.sin(t * 0.35) + 1) * 0.5;
          const phi = 0.42 - cycle * 0.32;
          const ang = -0.2 + Math.sin(t * 0.2) * 0.25;
          dir.set(
            Math.sin(ang) * Math.cos(phi),
            -Math.sin(phi),
            Math.cos(ang) * Math.cos(phi)
          ).normalize();
          break;
        }

        case 'Billboard Panorama': {
          // Wide horizontal sweep panning across the screens
          const panAng = Math.sin(t * 0.3) * 0.65;
          const phi = 0.26 + Math.cos(t * 0.3) * 0.05;
          dir.set(
            Math.sin(panAng) * Math.cos(phi),
            -Math.sin(phi),
            Math.cos(panAng) * Math.cos(phi)
          ).normalize();
          break;
        }

        case 'Digital Storm Drift': {
          // Atmospheric slow figure-eight swaying drift
          const xAngle = Math.sin(t * 0.4) * 0.42;
          const phi = 0.28 + Math.sin(t * 0.5) * 0.08;
          dir.set(
            Math.sin(xAngle) * Math.cos(phi),
            -Math.sin(phi),
            Math.cos(xAngle) * Math.cos(phi)
          ).normalize();
          break;
        }

        case 'Cyber Flyover': {
          // Forward and backward gliding path
          const sweep = Math.sin(t * 0.25) * 0.35;
          const phi = 0.22 + Math.sin(t * 0.4) * 0.06;
          dir.set(
            Math.sin(sweep) * Math.cos(phi),
            -Math.sin(phi),
            Math.cos(sweep) * Math.cos(phi)
          ).normalize();
          break;
        }

        case 'Lost Signal Orbit': {
          // Slow high-angle 360-degree orbit
          const theta = t * 0.35;
          const phi = 0.16 + Math.sin(t * 0.2) * 0.06;
          dir.set(
            Math.cos(theta) * Math.cos(phi),
            -Math.sin(phi),
            Math.sin(theta) * Math.cos(phi)
          ).normalize();
          break;
        }

        default:
          break;
      }

      // Position camera at target + dir * userZoomDistance
      // (User zoom in/out with wheel or touch is fully respected and NEVER snaps back!)
      camera.position.copy(target).addScaledVector(dir, userZoomDistance);

      if (camera.position.y < 0.6) {
        camera.position.y = 0.6;
      }

      controls.update();
    }

    // =========================================================================
    // PROCEDURAL RE-ROLL ON CLICK (Preserving PostProcessor Settings!)
    // =========================================================================
    function randomizeScene() {
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const chosenScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      applyColorScheme(chosenScheme);

      // Re-roll motion and geometric parameters
      params.animationSpeed = 0.6 + Math.random() * 0.8;
      params.cableSagFactor = 0.85 + Math.random() * 0.7;

      const animModes = [
        'Wasteland Drone', 'Low Mud Glide', 'Towering Monoliths',
        'Billboard Panorama', 'Digital Storm Drift', 'Cyber Flyover', 'Lost Signal Orbit'
      ];
      params.animationMode = animModes[Math.floor(Math.random() * animModes.length)];

      buildDroopingCables();

      // Trigger gentle glitch wave without light strobes
      isDigitalStorm = true;
      stormGlitchClock = 0;

      // IMPORTANT: DO NOT shuffle or change Postprocessing settings!
      // Only update GUI displays for scene folders without touching PostProcessor
      gui.folders.forEach(folder => {
        if (folder._title !== 'Post-Processing (PostProcessor.js)') {
          folder.controllersRecursive().forEach(c => c.updateDisplay());
        }
      });
    }

    let pointerDownPos = { x: 0, y: 0, time: 0 };
    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.lil-gui')) return;
      pointerDownPos.x = e.clientX;
      pointerDownPos.y = e.clientY;
      pointerDownPos.time = performance.now();
    });

    window.addEventListener('pointerup', (e) => {
      if (e.target.closest('.lil-gui')) return;
      const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
      const duration = performance.now() - pointerDownPos.time;
      if (dist < 6 && duration < 380 && params.clickToRandomize) {
        randomizeScene();
      }
    });

    // =========================================================================
    // RENDERER REBUILD & ANTIALIAS TOGGLE
    // =========================================================================
    function rebuildRenderer() {
      const oldCanvas = renderer.domElement;
      renderer.dispose();

      renderer = new THREE.WebGLRenderer({
        canvas: oldCanvas,
        antialias: params.antialias,
        powerPreference: 'high-performance'
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(params.dpr);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = params.exposure;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      controls.dispose();
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.enableZoom = true;
      controls.zoomSpeed = 1.0;
      controls.enablePan = true;
      controls.panSpeed = 1.0;
      controls.screenSpacePanning = true;
      controls.maxPolarAngle = Math.PI / 2 - 0.01;
      controls.minDistance = 2.0;
      controls.maxDistance = 140;
      controls.target.set(0, 9.2, -4.0);

      controls.addEventListener('change', () => {
        if (controls.state !== -1) {
          userZoomDistance = camera.position.distanceTo(controls.target);
        }
      });

      postProcessor.renderer = renderer;
      postProcessor.setAntialias(params.antialias);
      postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);
    }

    // Handle Window Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);
    });

    // =========================================================================
    // MAIN ANIMATION LOOP (Steady cinematic motion, no harsh strobes)
    // =========================================================================
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const time = clock.getElapsedTime() * params.animationSpeed;

      // Gentle storm glitch cycle without light strobing
      if (time > nextStormTime) {
        isDigitalStorm = true;
        stormGlitchClock += delta * params.animationSpeed;

        if (stormGlitchClock > 3.2) {
          isDigitalStorm = false;
          stormGlitchClock = 0;
          nextStormTime = time + 14.0 + Math.random() * 8.0;
        }
      }

      // Update screen textures
      renderScreenTextures(time);

      // Keep lighting steady and cinematic (no violent strobes)
      directionalLight.intensity = params.stormLightIntensity;
      billboardLights.forEach(bl => {
        bl.light.intensity = params.billboardGlowIntensity * 1.3;
        bl.material.emissiveIntensity = params.billboardGlowIntensity;
      });

      // Animate drifting particles at constant smooth speed
      const pPos = particleGeom.attributes.position.array;
      for (let p = 0; p < particleCount; p++) {
        pPos[p * 3] += particleVels[p].x * (delta * 50);
        pPos[p * 3 + 1] += particleVels[p].y * (delta * 50);
        pPos[p * 3 + 2] += particleVels[p].z * (delta * 50);

        if (pPos[p * 3 + 1] < -0.8) {
          pPos[p * 3 + 1] = 38.0;
          pPos[p * 3] = (Math.random() - 0.5) * 90;
          pPos[p * 3 + 2] = (Math.random() - 0.5) * 90;
        }
        if (pPos[p * 3] < -50) pPos[p * 3] = 50;
      }
      particleGeom.attributes.position.needsUpdate = true;

      // Update camera animation (retains user zoom!)
      updateCinematicCamera(delta);

      // Render through PostProcessor Suite pipeline
      postProcessor.renderScene(scene, camera);
    }

    animate();
  </script>
