<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procedural Wave Grid</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111111;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    svg {
      width: 100vw;
      height: 100vh;
      display: block;
      cursor: grab;
      touch-action: none;
    }
    svg:active {
      cursor: grabbing;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
  <svg id="svgScene" viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
    <g id="panZoomGroup">
      <g id="gridGroup"></g>
    </g>
  </svg>

  <script type="module">
    import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

    const svg = document.getElementById('svgScene');
    const panZoomGroup = document.getElementById('panZoomGroup');
    const gridGroup = document.getElementById('gridGroup');

    const COLOR_PRESETS = {
      'Monochrome Minimal': {
        bgColor: '#111111',
        fillStart: '#111111',
        fillEnd: '#444444',
        strokeColor: '#000000',
        strokeOpacity: 0.25,
        strokeWidth: 0.5
      },
      'Cyberpunk Neon': {
        bgColor: '#080811',
        fillStart: '#110b29',
        fillEnd: '#00f0ff',
        strokeColor: '#ff0055',
        strokeOpacity: 0.35,
        strokeWidth: 0.4
      },
      'Midnight Gold': {
        bgColor: '#0c0e12',
        fillStart: '#181b22',
        fillEnd: '#ffd700',
        strokeColor: '#e6a100',
        strokeOpacity: 0.3,
        strokeWidth: 0.4
      },
      'Emerald Matrix': {
        bgColor: '#030f08',
        fillStart: '#092113',
        fillEnd: '#00ff66',
        strokeColor: '#003816',
        strokeOpacity: 0.4,
        strokeWidth: 0.45
      },
      'Sunset Velvet': {
        bgColor: '#12071f',
        fillStart: '#260b3b',
        fillEnd: '#ff4b72',
        strokeColor: '#ff9052',
        strokeOpacity: 0.35,
        strokeWidth: 0.45
      }
    };

    const ANIMATION_PRESETS = [
      'Center Ripple',
      'Diagonal Flow',
      'Radial Vortex',
      'Perimeter Pulse',
      'Static Matrix'
    ];

    const params = {
      // Color & Preset
      colorPreset: 'Monochrome Minimal',
      greenScreen: false,
      bgColor: '#111111',
      fillStart: '#111111',
      fillEnd: '#444444',
      strokeColor: '#000000',
      strokeOpacity: 0.25,
      strokeWidth: 0.5,

      // Animation
      animationPreset: 'Center Ripple',
      speed: 1.0,
      isPlaying: true,

      // Geometry & Transform
      groupRotate: 45,
      groupScale: 1.4,
      rectWidth: 1.0,
      rectHeight: 0.5,
      cornerRadius: 0.4,
      targetRotate: 90,

      // View & Rendering
      dpr: Math.min(window.devicePixelRatio || 1, 2),
      zoom: 1.0,
      panX: 0,
      panY: 0,
      clickRandomize: true,

      // Actions
      resetView: () => resetPanZoom(),
      randomizeNow: () => randomizeScene()
    };

    // Build 50x50 Rect Grid
    const rects = [];
    const GRID_SIZE = 50;
    const fragment = document.createDocumentFragment();

    for (let x = 0; x < GRID_SIZE; x++) {
      for (let y = 0; y < GRID_SIZE; y++) {
        const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        fragment.appendChild(r);
        rects.push({ el: r, x, y });
      }
    }
    gridGroup.appendChild(fragment);

    let tl = null;

    function updateBackground() {
      if (params.greenScreen) {
        document.body.style.backgroundColor = '#00ff00';
      } else {
        document.body.style.backgroundColor = params.bgColor;
      }
    }

    function updatePanZoom() {
      gsap.set(panZoomGroup, {
        x: params.panX,
        y: params.panY,
        scale: params.zoom,
        svgOrigin: '25 25'
      });
    }

    function resetPanZoom() {
      params.zoom = 1.0;
      params.panX = 0;
      params.panY = 0;
      updatePanZoom();
      controllers.zoom?.updateDisplay();
      controllers.panX?.updateDisplay();
      controllers.panY?.updateDisplay();
    }

    function applyDPR() {
      const dpr = params.dpr;
      if (dpr < 0.9) {
        svg.setAttribute('shape-rendering', 'crispEdges');
      } else if (dpr > 1.8) {
        svg.setAttribute('shape-rendering', 'geometricPrecision');
      } else {
        svg.setAttribute('shape-rendering', 'auto');
      }
    }

    function updateBaseRects() {
      gsap.set(gridGroup, {
        svgOrigin: '25 25',
        rotate: params.groupRotate,
        scale: params.groupScale
      });

      const fill = params.fillStart;
      const stroke = params.strokeColor;
      const strokeOpacity = params.strokeOpacity;
      const strokeWidth = params.strokeWidth;
      const w = params.rectWidth;
      const h = params.rectHeight;
      const ry = params.cornerRadius;

      rects.forEach(({ el, x, y }) => {
        gsap.set(el, {
          x: x + 0.1,
          y: y + 0.1,
          transformOrigin: '0.5 -1',
          rotate: -45,
          attr: {
            width: w,
            height: h,
            ry: ry,
            fill: fill,
            stroke: stroke,
            'stroke-opacity': strokeOpacity,
            'stroke-width': strokeWidth
          }
        });
      });
    }

    function rebuildAnimation() {
      if (tl) {
        tl.kill();
        tl = null;
      }

      updateBackground();
      applyDPR();
      updateBaseRects();

      if (params.animationPreset === 'Static Matrix') {
        return;
      }

      let staggerConfig = {};
      let duration = 2.5;
      let ease = 'expo';
      let yoyoEase = 'sine.inOut';
      let rotate = params.targetRotate;
      let targetW = Math.max(0.1, params.rectWidth * 0.5);
      let targetH = Math.max(0.1, params.rectHeight * 1.0);
      let targetRy = Math.max(0, params.cornerRadius * 0.5);

      switch (params.animationPreset) {
        case 'Center Ripple':
          duration = 2.5;
          ease = 'expo';
          yoyoEase = 'sine.inOut';
          staggerConfig = {
            amount: 10,
            from: 'center',
            grid: [50, 50],
            repeat: -1,
            yoyo: true,
            ease: 'sine.inOut'
          };
          break;
        case 'Diagonal Flow':
          duration = 3.0;
          ease = 'power2.inOut';
          yoyoEase = 'power2.inOut';
          staggerConfig = {
            amount: 8,
            from: [0, 0],
            grid: [50, 50],
            repeat: -1,
            yoyo: true,
            ease: 'power2.inOut'
          };
          break;
        case 'Radial Vortex':
          duration = 3.5;
          ease = 'sine.inOut';
          yoyoEase = 'expo.inOut';
          staggerConfig = {
            amount: 12,
            from: 'center',
            grid: [50, 50],
            repeat: -1,
            yoyo: true,
            ease: 'sine.inOut'
          };
          break;
        case 'Perimeter Pulse':
          duration = 2.8;
          ease = 'circ.inOut';
          yoyoEase = 'circ.inOut';
          staggerConfig = {
            amount: 9,
            from: 'edges',
            grid: [50, 50],
            repeat: -1,
            yoyo: true,
            ease: 'circ.inOut'
          };
          break;
      }

      tl = gsap.to(gridGroup.children, {
        duration: duration,
        ease: ease,
        yoyoEase: yoyoEase,
        attr: {
          height: targetH,
          width: targetW,
          ry: targetRy,
          'stroke-width': 0,
          fill: params.fillEnd
        },
        rotate: rotate,
        stagger: staggerConfig
      });

      tl.timeScale(params.speed);
      if (!params.isPlaying) {
        tl.pause();
      } else {
        tl.play(99);
      }
    }

    function applyColorPreset(presetName) {
      const p = COLOR_PRESETS[presetName];
      if (!p) return;
      params.colorPreset = presetName;
      params.bgColor = p.bgColor;
      params.fillStart = p.fillStart;
      params.fillEnd = p.fillEnd;
      params.strokeColor = p.strokeColor;
      params.strokeOpacity = p.strokeOpacity;
      params.strokeWidth = p.strokeWidth;

      updateBackground();
      rebuildAnimation();
      updateAllGuiDisplays();
    }

    function randomizeScene() {
      // Procedural harmonious palette generator
      const hue = Math.floor(Math.random() * 360);
      const targetHue = (hue + 140 + Math.floor(Math.random() * 80)) % 360;
      const strokeHue = (hue + 280) % 360;

      params.bgColor = `hsl(${hue}, 35%, 6%)`;
      params.fillStart = `hsl(${hue}, 40%, 12%)`;
      params.fillEnd = `hsl(${targetHue}, 90%, 55%)`;
      params.strokeColor = `hsl(${strokeHue}, 85%, 50%)`;
      params.strokeOpacity = +(0.2 + Math.random() * 0.4).toFixed(2);
      params.strokeWidth = +(0.2 + Math.random() * 0.6).toFixed(2);

      // Re-roll geometric and motion parameters
      params.groupRotate = Math.round((Math.random() * 360 - 180) / 15) * 15;
      params.groupScale = +(0.8 + Math.random() * 1.1).toFixed(2);
      params.rectWidth = +(0.4 + Math.random() * 1.1).toFixed(2);
      params.rectHeight = +(0.25 + Math.random() * 0.7).toFixed(2);
      params.cornerRadius = +(Math.random() * 0.6).toFixed(2);

      const possibleRotations = [45, 90, 135, 180, 270, -90, -180];
      params.targetRotate = possibleRotations[Math.floor(Math.random() * possibleRotations.length)];

      const randomAnimations = ['Center Ripple', 'Diagonal Flow', 'Radial Vortex', 'Perimeter Pulse'];
      params.animationPreset = randomAnimations[Math.floor(Math.random() * randomAnimations.length)];
      params.speed = +(0.6 + Math.random() * 1.2).toFixed(2);
      params.colorPreset = 'Custom';

      updateBackground();
      rebuildAnimation();
      updateAllGuiDisplays();
    }

    function updateAllGuiDisplays() {
      gui.controllersRecursive().forEach(controller => controller.updateDisplay());
    }

    // Initialize GUI
    const gui = new GUI({ title: 'Scene Controls' });
    const controllers = {};

    // Presets & Procedural Folder
    const fPresets = gui.addFolder('Presets & Randomizer');
    controllers.colorPreset = fPresets.add(params, 'colorPreset', Object.keys(COLOR_PRESETS))
      .name('Color Preset')
      .onChange(val => applyColorPreset(val));
    controllers.animationPreset = fPresets.add(params, 'animationPreset', ANIMATION_PRESETS)
      .name('Animation Preset')
      .onChange(() => rebuildAnimation());
    controllers.clickRandomize = fPresets.add(params, 'clickRandomize')
      .name('Click to Randomize');
    fPresets.add(params, 'randomizeNow').name('🎲 Randomize Scene');

    // Color Controls Folder
    const fColors = gui.addFolder('Colors & Greenscreen');
    controllers.greenScreen = fColors.add(params, 'greenScreen')
      .name('Greenscreen (#00ff00)')
      .onChange(() => updateBackground());
    controllers.bgColor = fColors.addColor(params, 'bgColor')
      .name('Background')
      .onChange(() => {
        params.colorPreset = 'Custom';
        controllers.colorPreset?.updateDisplay();
        updateBackground();
      });
    controllers.fillStart = fColors.addColor(params, 'fillStart')
      .name('Fill Start')
      .onChange(() => {
        params.colorPreset = 'Custom';
        controllers.colorPreset?.updateDisplay();
        rebuildAnimation();
      });
    controllers.fillEnd = fColors.addColor(params, 'fillEnd')
      .name('Fill Animated')
      .onChange(() => {
        params.colorPreset = 'Custom';
        controllers.colorPreset?.updateDisplay();
        rebuildAnimation();
      });
    controllers.strokeColor = fColors.addColor(params, 'strokeColor')
      .name('Stroke Color')
      .onChange(() => {
        params.colorPreset = 'Custom';
        controllers.colorPreset?.updateDisplay();
        rebuildAnimation();
      });
    controllers.strokeOpacity = fColors.add(params, 'strokeOpacity', 0, 1, 0.01)
      .name('Stroke Opacity')
      .onChange(() => rebuildAnimation());
    controllers.strokeWidth = fColors.add(params, 'strokeWidth', 0, 2, 0.05)
      .name('Stroke Width')
      .onChange(() => rebuildAnimation());

    // Motion & Timing Folder
    const fMotion = gui.addFolder('Animation & Speed');
    controllers.speed = fMotion.add(params, 'speed', 0.1, 4.0, 0.05)
      .name('Speed')
      .onChange(val => {
        if (tl) tl.timeScale(val);
      });
    controllers.isPlaying = fMotion.add(params, 'isPlaying')
      .name('Playing')
      .onChange(val => {
        if (!tl) return;
        if (val) tl.play();
        else tl.pause();
      });
    controllers.targetRotate = fMotion.add(params, 'targetRotate', -360, 360, 15)
      .name('Target Rotate')
      .onChange(() => rebuildAnimation());

    // Geometry Folder
    const fGeometry = gui.addFolder('Geometry');
    controllers.groupRotate = fGeometry.add(params, 'groupRotate', -180, 180, 1)
      .name('Group Rotate')
      .onChange(() => updateBaseRects());
    controllers.groupScale = fGeometry.add(params, 'groupScale', 0.4, 3.0, 0.05)
      .name('Group Scale')
      .onChange(() => updateBaseRects());
    controllers.rectWidth = fGeometry.add(params, 'rectWidth', 0.1, 2.5, 0.05)
      .name('Rect Width')
      .onChange(() => rebuildAnimation());
    controllers.rectHeight = fGeometry.add(params, 'rectHeight', 0.1, 2.0, 0.05)
      .name('Rect Height')
      .onChange(() => rebuildAnimation());
    controllers.cornerRadius = fGeometry.add(params, 'cornerRadius', 0, 1.0, 0.02)
      .name('Corner Radius')
      .onChange(() => rebuildAnimation());

    // View & Display Folder
    const fView = gui.addFolder('View & DPR');
    controllers.dpr = fView.add(params, 'dpr', 0.5, 3.0, 0.25)
      .name('Pixel Ratio (DPR)')
      .onChange(() => applyDPR());
    controllers.zoom = fView.add(params, 'zoom', 0.2, 5.0, 0.05)
      .name('Zoom')
      .onChange(() => updatePanZoom());
    controllers.panX = fView.add(params, 'panX', -60, 60, 0.5)
      .name('Pan X')
      .onChange(() => updatePanZoom());
    controllers.panY = fView.add(params, 'panY', -60, 60, 0.5)
      .name('Pan Y')
      .onChange(() => updatePanZoom());
    fView.add(params, 'resetView').name('Reset Pan / Zoom');

    // Pan & Zoom with Pointer Drag and Mouse Wheel
    let isDragging = false;
    let startX = 0;
    let startY = 0;
    let initialPanX = 0;
    let initialPanY = 0;
    let movedDist = 0;

    window.addEventListener('wheel', (e) => {
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.08 : 0.92;
      params.zoom = Math.max(0.1, Math.min(10, +(params.zoom * factor).toFixed(3)));
      updatePanZoom();
      controllers.zoom?.updateDisplay();
    }, { passive: false });

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.lil-gui')) return;
      isDragging = true;
      startX = e.clientX;
      startY = e.clientY;
      initialPanX = params.panX;
      initialPanY = params.panY;
      movedDist = 0;
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      movedDist = Math.hypot(dx, dy);

      const scale = 50 / Math.min(window.innerWidth, window.innerHeight);
      params.panX = +(initialPanX + dx * scale).toFixed(2);
      params.panY = +(initialPanY + dy * scale).toFixed(2);
      updatePanZoom();
      controllers.panX?.updateDisplay();
      controllers.panY?.updateDisplay();
    });

    window.addEventListener('pointerup', (e) => {
      if (!isDragging) return;
      isDragging = false;
      if (e.target.closest('.lil-gui')) return;

      // Click on scene without drag triggers randomizer
      if (movedDist < 5) {
        if (params.clickRandomize) {
          randomizeScene();
        }
      }
    });

    // Keyboard 'H' key to toggle lil-gui visibility
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        if (gui._hidden) {
          gui.show();
        } else {
          gui.hide();
        }
      }
    });

    // Start scene
    rebuildAnimation();
    updatePanZoom();
  </script>
</body>
</html>
