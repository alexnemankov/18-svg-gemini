  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // =========================================================================
    // POST PROCESSOR SUITE (From postprocessing/PostProcessor.js)
    // Inlined for 100% standalone reliability under both http:// and file:// protocols
    // =========================================================================
    const orthoVertexShader = `
    precision highp float;
    in vec3 position;
    out vec2 vUv;
    void main() {
      vUv = position.xy * 0.5 + 0.5;
      gl_Position = vec4(position, 1.0);
    }
    `;

    const brightFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float bloomThreshold;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      vec4 color = texture(inputTexture, vUv);
      float luminance = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float knee = 0.1;
      float soft = luminance - bloomThreshold + knee;
      soft = clamp(soft, 0.0, 2.0 * knee);
      soft = (soft * soft) / (4.0 * knee + 0.00001);
      float contribution = max(soft, luminance - bloomThreshold);
      contribution /= max(luminance, 0.00001);
      fragColor = vec4(color.rgb * contribution, color.a);
    }
    `;

    const blur13ShaderChunk = `
    vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
      vec2 resolution = vec2(textureSize(image, 0));
      vec4 color = vec4(0.0);
      vec2 off1 = vec2(1.411764705882353) * direction;
      vec2 off2 = vec2(3.2941176470588234) * direction;
      vec2 off3 = vec2(5.176470588235294) * direction;
      color += texture(image, uv) * 0.1964825501511404;
      color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
      color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
      return color;
    }
    `;

    const blurFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 direction;
    in vec2 vUv;
    out vec4 color;
    ${blur13ShaderChunk}
    void main() {
      color = blur13(inputTexture, vUv, direction);
    }
    `;

    const godRaysDepthMaskShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float threshold;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      vec4 color = texture(inputTexture, vUv);
      float lum = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float factor = smoothstep(threshold, threshold + 0.15, lum);
      fragColor = vec4(vec3(factor), 1.0);
    }
    `;

    const godRaysGenerateShader = `
    precision highp float;
    #define TAPS_PER_PASS 6.0
    uniform sampler2D inputTexture;
    uniform vec3 vSunPositionScreenSpace;
    uniform float fStepSize;
    uniform float distanceAttenuation;
    uniform float maxDensity;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      vec2 delta = vSunPositionScreenSpace.xy - vUv;
      float dist = length(delta);
      vec2 stepv = fStepSize * delta / max(dist, 0.0001);
      float iters = dist / max(fStepSize, 0.00001);
      vec2 uv = vUv;
      float col = 0.0;
      float f = min(1.0, max(vSunPositionScreenSpace.z, 0.0));
      float atten = 1.0 / (1.0 + pow(dist, distanceAttenuation));
      if (0.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (1.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (2.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (3.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (4.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (5.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      float finalVal = min(col / TAPS_PER_PASS * atten, maxDensity);
      fragColor = vec4(vec3(finalVal), 1.0);
    }
    `;

    const anamorphicBrightShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float threshold;
    uniform float smoothWidth;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      vec4 color = texture(inputTexture, vUv);
      float v = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float alpha = smoothstep(threshold, threshold + smoothWidth, v);
      fragColor = mix(vec4(0.0), color, alpha);
    }
    `;

    const anamorphicBlurShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 resolution;
    uniform float samples;
    uniform float intensity;
    uniform vec3 tintColor;
    uniform float bloomRadius;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      int halfSamples = max(1, int(samples) / 2);
      float fHalfSamples = float(halfSamples);
      vec2 invSize = 1.0 / resolution;
      vec4 total = vec4(0.0);
      for (int i = -64; i <= 64; i++) {
        if (i < -halfSamples || i > halfSamples) continue;
        float softness = 1.0 - abs(float(i)) / fHalfSamples;
        softness = pow(softness, 2.0);
        vec2 shiftedUV = vec2(vUv.x + invSize.x * float(i) * (4.0 + bloomRadius * 8.0), vUv.y);
        shiftedUV = clamp(shiftedUV, 0.001, 0.999);
        total += texture(inputTexture, shiftedUV) * softness;
      }
      fragColor = (total / (samples / 3.0)) * vec4(tintColor, 1.0) * intensity;
    }
    `;

    const finalFragmentShader = `
    precision highp float;
    uniform vec2 resolution;
    uniform sampler2D inputTexture;
    uniform sampler2D blur0Texture;
    uniform sampler2D blur1Texture;
    uniform sampler2D blur2Texture;
    uniform sampler2D blur3Texture;
    uniform sampler2D blur4Texture;
    uniform sampler2D raysTexture;
    uniform sampler2D anamorphicTexture;
    uniform bool bloomEnabled;
    uniform float bloomStrength;
    uniform bool raysEnabled;
    uniform float raysStrength;
    uniform vec3 raysColor;
    uniform bool anamorphicEnabled;
    uniform float vignetteBoost;
    uniform float vignetteReduction;
    uniform float noiseIntensity;
    uniform float time;
    in vec2 vUv;
    out vec4 fragColor;

    float vignette(vec2 uv, float boost, float reduction) {
      vec2 position = vUv - 0.5;
      return boost - length(position) * reduction;
    }

    float hash1(uint n) {
      n = (n << 13U) ^ n;
      n = n * (n * n * 15731U + 789221U) + 1376312589U;
      return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
    }

    float noise(in vec2 uv, in float timeVal) {
      uvec2 p = uvec2(uv);
      return hash1(p.x + 1920U * p.y + (1920U * 1080U) * uint(timeVal));
    }

    void main() {
      vec4 color = texture(inputTexture, vUv);

      if (bloomEnabled && bloomStrength > 0.001) {
        vec4 b0 = texture(blur0Texture, vUv);
        vec4 b1 = texture(blur1Texture, vUv);
        vec4 b2 = texture(blur2Texture, vUv);
        vec4 b3 = texture(blur3Texture, vUv);
        vec4 b4 = texture(blur4Texture, vUv);
        vec4 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
        color += bloomSum * bloomStrength;
      }

      if (raysEnabled && raysStrength > 0.001) {
        vec4 r = texture(raysTexture, vUv);
        color.rgb += r.rgb * raysColor * raysStrength;
      }

      if (anamorphicEnabled) {
        vec4 a = texture(anamorphicTexture, vUv);
        color.rgb += a.rgb;
      }

      color.rgb *= vignette(vUv, vignetteBoost, vignetteReduction);
      color.rgb += noiseIntensity * noise(gl_FragCoord.xy, time);
      fragColor = vec4(color.rgb, 1.0);
    }
    `;

    const chromaticAberrationShaderChunk = `
    vec2 barrelDistortion(vec2 coord, float amt) {
      vec2 cc = coord - 0.5;
      float dist = dot(cc, cc);
      return coord + cc * dist * amt;
    }
    float sat(float t) { return clamp(t, 0.0, 1.0); }
    float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
    float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
    vec4 spectrum_offset(float t) {
      float lo = step(t, 0.5);
      float hi = 1.0 - lo;
      float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
      vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
      return pow(ret, vec4(1.0 / 2.2));
    }
    const float max_distort = 2.2;
    const int num_iter = 8;
    const float reci_num_iter_f = 1.0 / float(num_iter);
    vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
      vec4 sumcol = vec4(0.0);
      vec4 sumw = vec4(0.0);
      for (int i = 0; i < num_iter; ++i) {
        float t = float(i) * reci_num_iter_f;
        vec4 w = spectrum_offset(t);
        sumw += w;
        sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
      }
      return sumcol / sumw;
    }
    `;

    const colorFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float chromaticAberrationAmount;
    uniform float minInputLevel;
    uniform float maxInputLevel;
    uniform float gammaLevel;
    uniform float exposure;
    uniform float fisheyeStrength;
    uniform float fisheyeRadius;
    uniform float time;
    uniform int visionMode;
    uniform float thermalSensitivity;
    uniform float nightVisionNoise;
    uniform float nightVisionGain;
    uniform float crtIntensity;
    in vec2 vUv;
    out vec4 fragColor;

    ${chromaticAberrationShaderChunk}

    vec2 applyFisheye(vec2 uv, float strength, float radius) {
      if (abs(strength) < 0.0001) return uv;
      vec2 p = uv - 0.5;
      float d = length(p);
      if (d > radius * 1.5) return uv;
      float r = d / max(radius, 0.001);
      float theta = atan(p.y, p.x);
      float rDist = r + strength * (r * r * r);
      return 0.5 + vec2(cos(theta), sin(theta)) * (rDist * radius);
    }

    vec3 ACESFilmicToneMapping(vec3 color) {
      float a = 2.51;
      float b = 0.03;
      float c = 2.43;
      float d = 0.59;
      float e = 0.14;
      return clamp((color * (a * color + b)) / (color * (c * color + d) + e), 0.0, 1.0);
    }

    vec3 gammaCorrect(vec3 color, vec3 gamma) {
      return pow(max(color, vec3(0.0)), 1.0 / gamma);
    }
    vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
      return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
    }
    vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
      return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
    }

    void main() {
      vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
      vec4 col = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
      vec3 finalCol = col.rgb;

      vec3 exposedColor = finalCol * exposure;
      vec3 toneMappedColor = ACESFilmicToneMapping(exposedColor);
      finalCol = finalLevels(toneMappedColor, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));

      fragColor = vec4(finalCol, 1.0);
    }
    `;

    const copyFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      fragColor = texture(inputTexture, vUv);
    }
    `;

    function createFBO(w, h, options = {}) {
      return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
        wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
        wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
        minFilter: options.minFilter || THREE.LinearFilter,
        magFilter: options.magFilter || THREE.LinearFilter,
        format: options.format || THREE.RGBAFormat,
        type: options.type || THREE.HalfFloatType,
        stencilBuffer: options.stencilBuffer || false,
        depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : true,
        samples: options.samples || 0,
      });
    }

    class ShaderPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbo = createFBO(1, 1, options);
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
        this.texture = this.fbo.texture;
      }
      render(renderer, toScreen = false) {
        if (!toScreen) {
          renderer.setRenderTarget(this.fbo);
        }
        renderer.render(this.orthoScene, this.orthoCamera);
        if (!toScreen) {
          renderer.setRenderTarget(null);
        }
      }
      setSize(width, height) {
        this.fbo.setSize(Math.max(1, width), Math.max(1, height));
        this.orthoQuad.scale.set(width, height, 1);
      }
    }

    class ShaderPingPongPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
        this.currentFBO = 0;
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
      }
      render(renderer) {
        renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
        renderer.render(this.orthoScene, this.orthoCamera);
        renderer.setRenderTarget(null);
        this.currentFBO = 1 - this.currentFBO;
      }
      get current() { return this.fbos[this.currentFBO]; }
      get texture() { return this.current.texture; }
      setSize(width, height) {
        const w = Math.max(1, width);
        const h = Math.max(1, height);
        this.orthoQuad.scale.set(w, h, 1);
        this.fbos[0].setSize(w, h);
        this.fbos[1].setSize(w, h);
      }
    }

    class BloomPass {
      constructor(strength = 0.8, radius = 0.5, threshold = 0.2, levels = 5) {
        this.strength = strength;
        this.radius = radius;
        this.threshold = threshold;
        this.enabled = true;
        this.levels = levels;

        this.brightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            bloomThreshold: { value: this.threshold },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: brightFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.brightPass = new ShaderPass(this.brightShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.blurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            direction: { value: new THREE.Vector2(0, 1) },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: blurFragmentShader,
          glslVersion: THREE.GLSL3,
        });

        this.blurPasses = [];
        for (let i = 0; i < this.levels; i++) {
          this.blurPasses.push(new ShaderPingPongPass(this.blurShader, {
            format: THREE.RGBAFormat,
            type: THREE.HalfFloatType,
          }));
        }
      }

      setSize(w, h) {
        let tw = Math.max(1, w);
        let th = Math.max(1, h);
        this.brightPass.setSize(tw, th);
        for (let i = 0; i < this.levels; i++) {
          tw = Math.max(1, Math.round(tw / 2));
          th = Math.max(1, Math.round(th / 2));
          this.blurPasses[i].setSize(tw, th);
        }
      }

      set source(texture) {
        this.brightShader.uniforms.inputTexture.value = texture;
      }

      render(renderer) {
        if (!this.enabled || this.strength <= 0.001) return;
        this.brightShader.uniforms.bloomThreshold.value = this.threshold;
        this.brightPass.render(renderer);
        const baseOffset = Math.max(0.1, this.radius * 2.0);
        const u = this.blurShader.uniforms;
        for (let j = 0; j < this.levels; j++) {
          const blurPass = this.blurPasses[j];
          const stepOffset = baseOffset * (1.0 + j * 0.5);
          u.direction.value.set(stepOffset, 0);
          u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
          blurPass.render(renderer);
          u.direction.value.set(0, stepOffset * 0.5);
          u.inputTexture.value = blurPass.current.texture;
          blurPass.render(renderer);
        }
      }
    }

    class PostProcessor {
      constructor(renderer, params = {}) {
        this.renderer = renderer;

        this.settings = {
          enabled: params.enabled !== undefined ? params.enabled : true,
          antialias: params.antialias !== undefined ? params.antialias : true,
          bloomEnabled: params.bloomEnabled !== undefined ? params.bloomEnabled : true,
          bloomStrength: params.bloomStrength !== undefined ? params.bloomStrength : 0.85,
          bloomRadius: params.bloomRadius !== undefined ? params.bloomRadius : 0.45,
          bloomThreshold: params.bloomThreshold !== undefined ? params.bloomThreshold : 0.22,
          raysEnabled: params.raysEnabled !== undefined ? params.raysEnabled : false,
          raysStrength: params.raysStrength !== undefined ? params.raysStrength : 0.85,
          raysDensity: params.raysDensity !== undefined ? params.raysDensity : 1.0,
          raysMaxDensity: params.raysMaxDensity !== undefined ? params.raysMaxDensity : 0.5,
          raysDistanceAttenuation: params.raysDistanceAttenuation !== undefined ? params.raysDistanceAttenuation : 2.0,
          raysThreshold: params.raysThreshold !== undefined ? params.raysThreshold : 0.12,
          raysColor: new THREE.Color(0x00f0ff),
          raysColorHex: '#00f0ff',
          // Explicit requirement: anamorphic default is OFF
          anamorphicEnabled: params.anamorphicEnabled !== undefined ? params.anamorphicEnabled : false,
          anamorphicIntensity: params.anamorphicIntensity !== undefined ? params.anamorphicIntensity : 4.0,
          anamorphicThreshold: params.anamorphicThreshold !== undefined ? params.anamorphicThreshold : 0.35,
          anamorphicSamples: params.anamorphicSamples !== undefined ? params.anamorphicSamples : 64,
          anamorphicRadius: params.anamorphicRadius !== undefined ? params.anamorphicRadius : 0.0,
          anamorphicColor: new THREE.Color(0x00f0ff),
          anamorphicColorHex: '#00f0ff',
          fisheyeStrength: 0.0,
          fisheyeRadius: 1.0,
          chromaticAberration: 0.003,
          vignetteBoost: 1.05,
          vignetteReduction: 0.42,
          noiseIntensity: 0.012,
          gamma: 1.0,
          minInputLevel: 0.0,
          maxInputLevel: 1.0,
          exposure: 1.0,
        };

        const maxSamples = (this.renderer && this.renderer.capabilities) ? (this.renderer.capabilities.maxSamples || 4) : 4;
        const targetSamples = this.settings.antialias ? Math.min(4, maxSamples) : 0;
        this.sceneTarget = createFBO(1, 1, { type: THREE.HalfFloatType, samples: targetSamples });

        this.bloomPass = new BloomPass(this.settings.bloomStrength, this.settings.bloomRadius, this.settings.bloomThreshold, 5);

        this.finalShader = new THREE.RawShaderMaterial({
          uniforms: {
            resolution: { value: new THREE.Vector2(1, 1) },
            bloomEnabled: { value: this.settings.bloomEnabled },
            bloomStrength: { value: this.settings.bloomStrength },
            raysEnabled: { value: false },
            raysStrength: { value: this.settings.raysStrength },
            raysColor: { value: this.settings.raysColor },
            anamorphicEnabled: { value: this.settings.anamorphicEnabled },
            vignetteBoost: { value: this.settings.vignetteBoost },
            vignetteReduction: { value: this.settings.vignetteReduction },
            noiseIntensity: { value: this.settings.noiseIntensity },
            inputTexture: { value: null },
            blur0Texture: { value: null },
            blur1Texture: { value: null },
            blur2Texture: { value: null },
            blur3Texture: { value: null },
            blur4Texture: { value: null },
            raysTexture: { value: null },
            anamorphicTexture: { value: null },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: finalFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.finalPass = new ShaderPass(this.finalShader);

        this.rgbShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: this.finalPass.texture },
            fisheyeStrength: { value: this.settings.fisheyeStrength },
            fisheyeRadius: { value: this.settings.fisheyeRadius },
            chromaticAberrationAmount: { value: this.settings.chromaticAberration },
            minInputLevel: { value: this.settings.minInputLevel },
            maxInputLevel: { value: this.settings.maxInputLevel },
            gammaLevel: { value: this.settings.gamma },
            exposure: { value: this.settings.exposure },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: colorFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.rgbPass = new ShaderPass(this.rgbShader);

        this.copyShader = new THREE.RawShaderMaterial({
          uniforms: { inputTexture: { value: null } },
          vertexShader: orthoVertexShader,
          fragmentShader: copyFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.copyPass = new ShaderPass(this.copyShader);
      }

      updateSettings() {
        this.bloomPass.enabled = this.settings.bloomEnabled;
        this.bloomPass.strength = this.settings.bloomStrength;
        this.bloomPass.radius = this.settings.bloomRadius;
        this.bloomPass.threshold = this.settings.bloomThreshold;

        this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
        this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
        this.finalShader.uniforms.anamorphicEnabled.value = this.settings.anamorphicEnabled;
        this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
        this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
        this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;

        this.rgbShader.uniforms.fisheyeStrength.value = this.settings.fisheyeStrength;
        this.rgbShader.uniforms.fisheyeRadius.value = this.settings.fisheyeRadius;
        this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
        this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
        this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
        this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
        this.rgbShader.uniforms.exposure.value = this.settings.exposure;
      }

      setSize(w0, h0, dpr = 1) {
        const w = Math.max(1, Math.floor(w0 * dpr));
        const h = Math.max(1, Math.floor(h0 * dpr));
        this.sceneTarget.setSize(w, h);
        this.finalPass.setSize(w, h);
        this.finalShader.uniforms.resolution.value.set(w, h);
        this.bloomPass.setSize(w, h);
        this.rgbPass.setSize(w, h);
        this.copyPass.setSize(w, h);
      }

      setAntialias(enabled) {
        this.settings.antialias = !!enabled;
        const maxSamples = (this.renderer && this.renderer.capabilities) ? (this.renderer.capabilities.maxSamples || 4) : 4;
        const samples = this.settings.antialias ? Math.min(4, maxSamples) : 0;
        if (this.sceneTarget.samples !== samples) {
          const oldTarget = this.sceneTarget;
          this.sceneTarget = createFBO(oldTarget.width, oldTarget.height, {
            type: THREE.HalfFloatType,
            samples: samples,
          });
          oldTarget.dispose();
        }
      }

      renderScene(scene, camera) {
        if (!this.settings.enabled) {
          this.renderer.render(scene, camera);
          return;
        }
        this.renderer.setRenderTarget(this.sceneTarget);
        this.renderer.render(scene, camera);
        this.renderer.setRenderTarget(null);
        this.render(this.sceneTarget.texture);
      }

      render(sourceTexture) {
        if (!this.settings.enabled) {
          this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
          this.copyPass.render(this.renderer, true);
          return;
        }

        this.updateSettings();

        this.bloomPass.source = sourceTexture;
        this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
        this.bloomPass.render(this.renderer);

        this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
        this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
        this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
        this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
        this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

        const randomTime = Math.random() * 100000;
        this.finalPass.shader.uniforms.time.value = randomTime;
        this.rgbPass.shader.uniforms.time.value = randomTime;

        this.finalPass.render(this.renderer);
        this.rgbPass.render(this.renderer, true);
      }

      attachGUI(gui, title = "Post-Processing Suite") {
        const root = gui.addFolder(title);
        root.add(this.settings, "enabled").name("Enable Post-Process");
        root.add(this.settings, "antialias").name("MSAA Antialias").onChange((v) => this.setAntialias(v));

        const bloom = root.addFolder("Atmospheric Bloom");
        bloom.add(this.settings, "bloomEnabled").name("Enable Bloom").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomStrength", 0, 3.0, 0.05).name("Bloom Strength").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomRadius", 0, 2.0, 0.05).name("Bloom Radius").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomThreshold", 0, 1.0, 0.01).name("Bloom Threshold").onChange(() => this.updateSettings());

        const anamorphic = root.addFolder("Three.js Anamorphic Flare");
        anamorphic.add(this.settings, "anamorphicEnabled").name("Enable Anamorphic").onChange(() => this.updateSettings());
        anamorphic.add(this.settings, "anamorphicIntensity", 0, 10.0, 0.1).name("Intensity").onChange(() => this.updateSettings());
        anamorphic.add(this.settings, "anamorphicThreshold", 0.0, 0.9, 0.01).name("Threshold").onChange(() => this.updateSettings());
        anamorphic.addColor(this.settings, "anamorphicColorHex").name("Tint Color").onChange((v) => {
          this.settings.anamorphicColor.set(v);
          this.updateSettings();
        });

        const lens = root.addFolder("Lens, Optics & Film Grain");
        lens.add(this.settings, "chromaticAberration", 0, 0.05, 0.001).name("Chromatic Aberration").onChange(() => this.updateSettings());
        lens.add(this.settings, "vignetteBoost", 0, 2.0, 0.05).name("Vignette Boost").onChange(() => this.updateSettings());
        lens.add(this.settings, "vignetteReduction", 0, 2.0, 0.05).name("Vignette Falloff").onChange(() => this.updateSettings());
        lens.add(this.settings, "noiseIntensity", 0, 0.05, 0.002).name("Film Grain").onChange(() => this.updateSettings());
        lens.add(this.settings, "gamma", 0.5, 2.0, 0.05).name("Gamma").onChange(() => this.updateSettings());

        return root;
      }

    // Helper: Wrap text neatly inside canvas
    function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
      const words = text.split(' ');
      let line = '';
      let currentY = y;
      for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + ' ';
        const metrics = ctx.measureText(testLine);
        if (metrics.width > maxWidth && n > 0) {
          ctx.fillText(line, x, currentY);
          line = words[n] + ' ';
          currentY += lineHeight;
        } else {
          line = testLine;
        }
      }
      ctx.fillText(line, x, currentY);
    }

    // Helper: Draw pill badge
    function drawPill(ctx, text, x, y, bgColor, textColor) {
      ctx.save();
      ctx.font = '700 24px "SF Pro Display", -apple-system, BlinkMacSystemFont, monospace';
      const textMetrics = ctx.measureText(text);
      const paddingX = 18;
      const pillWidth = textMetrics.width + paddingX * 2;
      const pillHeight = 38;
      const radius = 19;

      ctx.fillStyle = bgColor;
      ctx.beginPath();
      ctx.roundRect(x - pillWidth + 8, y - 26, pillWidth, pillHeight, radius);
      ctx.fill();

      ctx.fillStyle = textColor;
      ctx.fillText(text, x - pillWidth + 8 + paddingX, y + 1);
      ctx.restore();
    }

    // Helper: Draw minimal progress bar
    function drawProgressBar(ctx, x, y, width, height, progress, fillColor) {
      ctx.save();
      ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
      ctx.beginPath();
      ctx.roundRect(x, y, width, height, height / 2);
      ctx.fill();

      ctx.fillStyle = fillColor;
      ctx.beginPath();
      ctx.roundRect(x, y, Math.max(height, width * THREE.MathUtils.clamp(progress, 0, 1)), height, height / 2);
      ctx.fill();
      ctx.restore();
    }

    // Generate high-resolution 2048x1152 canvas texture for each thesis plaque
    function createPlaqueCanvas(thesis, colors) {
      const canvas = document.createElement('canvas');
      canvas.width = 2048;
      canvas.height = 1152;
      const ctx = canvas.getContext('2d');

      renderPlaqueCanvas(ctx, canvas.width, canvas.height, thesis, colors);

      const texture = new THREE.CanvasTexture(canvas);
      texture.anisotropy = 16;
      texture.generateMipmaps = true;
      texture.minFilter = THREE.LinearMipmapLinearFilter;
      texture.magFilter = THREE.LinearFilter;

      return { canvas, ctx, texture, thesis };
    }

    function renderPlaqueCanvas(ctx, width, height, thesis, colors) {
      // Matte charcoal panel background
      ctx.fillStyle = colors.panelBg;
      ctx.fillRect(0, 0, width, height);

      // Subtle architectural hairline grid
      ctx.strokeStyle = colors.panelBorder;
      ctx.globalAlpha = 0.12;
      ctx.lineWidth = 1;
      for (let x = 0; x < width; x += 54) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
        ctx.stroke();
      }
      for (let y = 0; y < height; y += 54) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
      }
      ctx.globalAlpha = 1.0;

      // Outer bezel line
      ctx.strokeStyle = colors.panelBorder;
      ctx.lineWidth = 3;
      ctx.strokeRect(30, 30, width - 60, height - 60);

      // Accent laser corner brackets (┌ ┐ └ ┘)
      ctx.strokeStyle = colors.accentGlow;
      ctx.lineWidth = 6;
      const c = 48;
      // Top-Left
      ctx.beginPath();
      ctx.moveTo(30, 30 + c);
      ctx.lineTo(30, 30);
      ctx.lineTo(30 + c, 30);
      ctx.stroke();
      // Top-Right
      ctx.beginPath();
      ctx.moveTo(width - 30 - c, 30);
      ctx.lineTo(width - 30, 30);
      ctx.lineTo(width - 30, 30 + c);
      ctx.stroke();
      // Bottom-Left
      ctx.beginPath();
      ctx.moveTo(30, height - 30 - c);
      ctx.lineTo(30, height - 30);
      ctx.lineTo(30 + c, height - 30);
      ctx.stroke();
      // Bottom-Right
      ctx.beginPath();
      ctx.moveTo(width - 30 - c, height - 30);
      ctx.lineTo(width - 30, height - 30);
      ctx.lineTo(width - 30, height - 30 - c);
      ctx.stroke();

      // Top Status Row
      ctx.fillStyle = colors.accentGlow;
      ctx.fillRect(72, 70, 8, 30);

      ctx.font = '700 24px "SF Pro Display", -apple-system, BlinkMacSystemFont, monospace';
      ctx.fillStyle = colors.accentGlow;
      ctx.fillText(thesis.pillar, 94, 94);

      ctx.fillStyle = colors.textSecondary;
      ctx.font = '500 24px "SF Pro Display", -apple-system, BlinkMacSystemFont, monospace';
      ctx.fillText(thesis.ref, 920, 94);

      // Status indicator pip
      ctx.fillStyle = colors.accentGlow;
      ctx.beginPath();
      ctx.arc(1720, 88, 7, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = colors.textSecondary;
      ctx.font = '600 22px "SF Pro Display", -apple-system, BlinkMacSystemFont, monospace';
      ctx.fillText(thesis.date, 1740, 94);

      // Separator rule
      ctx.strokeStyle = colors.panelBorder;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(72, 126);
      ctx.lineTo(width - 72, 126);
      ctx.stroke();

      // Bold Title Typography
      ctx.fillStyle = colors.textPrimary;
      ctx.font = '800 62px "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
      ctx.letterSpacing = '0.5px';
      ctx.fillText(thesis.title, 72, 214);

      // Thesis Statement
      ctx.fillStyle = colors.textSecondary;
      ctx.font = '400 36px "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
      wrapText(ctx, thesis.thesis, 72, 298, width - 144, 54);

      // Mid separator rule with glowing notch
      ctx.strokeStyle = colors.panelBorder;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(72, 490);
      ctx.lineTo(width - 72, 490);
      ctx.stroke();

      ctx.fillStyle = colors.accentGlow;
      ctx.fillRect(72, 487, 80, 6);

      // METRICS SECTION (2 clean side-by-side metric boxes)
      const boxW = (width - 144 - 40) / 2;
      const boxH = 470;
      const boxY = 524;

      // Box 1
      ctx.fillStyle = 'rgba(255, 255, 255, 0.025)';
      ctx.fillRect(72, boxY, boxW, boxH);
      ctx.strokeStyle = colors.panelBorder;
      ctx.lineWidth = 2;
      ctx.strokeRect(72, boxY, boxW, boxH);

      ctx.fillStyle = colors.textSecondary;
      ctx.font = '700 24px "SF Pro Display", -apple-system, BlinkMacSystemFont, monospace';
      ctx.fillText(thesis.metric1Label, 108, boxY + 65);

      drawPill(ctx, thesis.metric1Badge, 72 + boxW - 32, boxY + 58, colors.accentGlow, colors.panelBg);

      ctx.fillStyle = colors.metricBadge || colors.textPrimary;
      ctx.font = '800 102px "SF Pro Display", -apple-system, BlinkMacSystemFont, sans-serif';
      ctx.fillText(thesis.metric1Val, 108, boxY + 236);

      drawProgressBar(ctx, 108, boxY + 330, boxW - 72, 16, thesis.progress, colors.accentGlow);

      ctx.fillStyle = colors.textSecondary;
      ctx.font = '600 20px monospace';
      ctx.fillText(`INDEX RATIO: ${(thesis.progress * 100).toFixed(1)}%`, 108, boxY + 400);

      // Box 2
      const box2X = 72 + boxW + 40;
      ctx.fillStyle = 'rgba(255, 255, 255, 0.025)';
      ctx.fillRect(box2X, boxY, boxW, boxH);
      ctx.strokeStyle = colors.panelBorder;
      ctx.lineWidth = 2;
      ctx.strokeRect(box2X, boxY, boxW, boxH);

      ctx.fillStyle = colors.textSecondary;
      ctx.font = '700 24px "SF Pro Display", -apple-system, BlinkMacSystemFont, monospace';
      ctx.fillText(thesis.metric2Label, box2X + 36, boxY + 65);

      drawPill(ctx, thesis.metric2Badge, box2X + boxW - 32, boxY + 58, colors.metricBadge, colors.panelBg);

      ctx.fillStyle = colors.textPrimary;
      ctx.font = '800 102px "SF Pro Display", -apple-system, BlinkMacSystemFont, sans-serif';
      ctx.fillText(thesis.metric2Val, box2X + 36, boxY + 236);

      drawProgressBar(ctx, box2X + 36, boxY + 330, boxW - 72, 16, Math.min(1.0, thesis.progress * 1.05), colors.metricBadge);

      ctx.fillStyle = colors.textSecondary;
      ctx.font = '600 20px monospace';
      ctx.fillText(`AUDITED INTEGRITY: 100%`, box2X + 36, boxY + 400);

      // Footer datum ticker
      ctx.fillStyle = colors.textSecondary;
      ctx.font = '500 22px "SF Pro Display", -apple-system, BlinkMacSystemFont, monospace';
      ctx.fillText('ANNUAL REPORT 2027 // SEC FORM 10-K // AUDITED RECORD // LATENCY: 0.04ms', 72, 1080);

      ctx.fillStyle = colors.accentGlow;
      ctx.font = '800 26px monospace';
      ctx.fillText(`CARD [${thesis.id}/10]`, width - 240, 1080);
    }

    let headerCanvasData = null;

    function updateAllTextures() {
      const colors = getActiveColors();
      plaqueCanvasData.forEach((item) => {
        renderPlaqueCanvas(item.ctx, item.canvas.width, item.canvas.height, item.thesis, colors);
        item.texture.needsUpdate = true;
      });

      if (headerCanvasData) {
        renderHeaderCanvas(headerCanvasData.ctx, headerCanvasData.canvas.width, headerCanvasData.canvas.height, colors);
        headerCanvasData.texture.needsUpdate = true;
      }

    function getActiveColors() {
      const scheme = COLOR_SCHEMES[params.colorScheme] || COLOR_SCHEMES['Original'];
      return {
        bg: params.customBg || scheme.bg,
        panelBg: params.customPanelBg || scheme.panelBg,
        panelBorder: params.customPanelBorder || scheme.panelBorder,
        metallicRim: params.customMetallicRim || scheme.metallicRim,
        textPrimary: params.customTextPrimary || scheme.textPrimary,
        textSecondary: params.customTextSecondary || scheme.textSecondary,
        accentGlow: params.customAccentGlow || scheme.accentGlow,
        metricBadge: params.customMetricBadge || scheme.metricBadge,
        ambient: scheme.ambient,
        keyLight: scheme.keyLight,
        fillLight: scheme.fillLight,
        rimLight: scheme.rimLight

    // =========================================================================
    // 3D SCENE CONSTRUCTION
    // =========================================================================
    function initRenderer() {
      if (renderer) {
        controls.dispose();
        renderer.dispose();
        if (renderer.domElement && renderer.domElement.parentNode) {
          renderer.domElement.parentNode.removeChild(renderer.domElement);
        }
      }

      renderer = new THREE.WebGLRenderer({
        antialias: params.antialias,
        powerPreference: 'high-performance',
        alpha: false
      });
      renderer.setPixelRatio(params.dpr);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = params.exposure;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.enableZoom = true;
      controls.zoomSpeed = 1.2;
      controls.enablePan = true;
      controls.panSpeed = 1.2;
      controls.screenSpacePanning = true;
      controls.mouseButtons = {
        LEFT: THREE.MOUSE.ROTATE,
        MIDDLE: THREE.MOUSE.DOLLY,
        RIGHT: THREE.MOUSE.PAN
      };
      controls.minDistance = 2.5;
      controls.maxDistance = 40.0;
      controls.maxPolarAngle = Math.PI / 2 + 0.15;

      // Initialize PostProcessor
      postProcessor = new PostProcessor(renderer, {
        enabled: true,
        antialias: params.antialias,
        bloomEnabled: true,
        bloomStrength: 0.85,
        bloomRadius: 0.45,
        bloomThreshold: 0.22,
        anamorphicEnabled: false, // Explicitly default OFF
        vignetteBoost: 1.05,
        vignetteReduction: 0.38,
        noiseIntensity: 0.012,
        chromaticAberration: 0.003
      });
      postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);
    }

    function initScene() {
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, params.cameraHeight, params.orbitRadius);
      camera.lookAt(0, 1.0, 0);

      initRenderer();

      // Root Groups
      mainRootGroup = new THREE.Group();
      scene.add(mainRootGroup);

      plaquesGroup = new THREE.Group();
      mainRootGroup.add(plaquesGroup);

      railsGroup = new THREE.Group();
      mainRootGroup.add(railsGroup);

      headerGroup = new THREE.Group();
      mainRootGroup.add(headerGroup);

      floorGroup = new THREE.Group();
      mainRootGroup.add(floorGroup);

      particlesGroup = new THREE.Group();
      mainRootGroup.add(particlesGroup);

      setupLighting();
      buildFloorGrid();
      buildHeaderBanner();
      buildThesisPlaques();
      buildDataDust();

      applyColorScheme(params.colorScheme);
    }

    function setupLighting() {
      ambientLight = new THREE.AmbientLight(params.ambientColor, params.ambientIntensity * params.masterLightIntensity);
      scene.add(ambientLight);

      keyLight = new THREE.DirectionalLight(params.keyColor, params.keyIntensity * params.masterLightIntensity);
      keyLight.position.set(params.keyPosX, params.keyPosY, params.keyPosZ);
      keyLight.castShadow = true;
      keyLight.shadow.mapSize.width = 2048;
      keyLight.shadow.mapSize.height = 2048;
      keyLight.shadow.bias = -0.0001;
      scene.add(keyLight);

      fillLight = new THREE.DirectionalLight(params.fillColor, params.fillIntensity * params.masterLightIntensity);
      fillLight.position.set(params.fillPosX, params.fillPosY, params.fillPosZ);
      scene.add(fillLight);

      rimLight = new THREE.DirectionalLight(params.rimColor, params.rimIntensity * params.masterLightIntensity);
      rimLight.position.set(params.rimPosX, params.rimPosY, params.rimPosZ);
      scene.add(rimLight);
    }

    function updateLights() {
      if (!ambientLight) return;
      const m = params.masterLightIntensity;
      ambientLight.intensity = params.ambientIntensity * m;
      ambientLight.color.set(params.ambientColor);

      keyLight.intensity = params.keyIntensity * m;
      keyLight.color.set(params.keyColor);
      keyLight.position.set(params.keyPosX, params.keyPosY, params.keyPosZ);

      fillLight.intensity = params.fillIntensity * m;
      fillLight.color.set(params.fillColor);
      fillLight.position.set(params.fillPosX, params.fillPosY, params.fillPosZ);

      rimLight.intensity = params.rimIntensity * m;
      rimLight.color.set(params.rimColor);
      rimLight.position.set(params.rimPosX, params.rimPosY, params.rimPosZ);

      renderer.toneMappingExposure = params.exposure;

      laserRailMaterials.forEach(mat => {
        if (mat.emissive) {
          mat.emissive.set(params.customAccentGlow);
          mat.emissiveIntensity = params.laserGlowIntensity;
        } else if (mat.color) {
          mat.color.set(params.customAccentGlow);
        }
      });
    }

    // Floor Architectural Datum Grid
    function buildFloorGrid() {
      floorGroup.clear();
      laserFloorMarkers = [];

      const colors = getActiveColors();

      // Matte dark ground plate
      const groundGeo = new THREE.PlaneGeometry(80, 80);
      const groundMat = new THREE.MeshStandardMaterial({
        color: colors.bg,
        roughness: 0.9,
        metalness: 0.15,
        depthWrite: true
      });
      const groundMesh = new THREE.Mesh(groundGeo, groundMat);
      groundMesh.rotation.x = -Math.PI / 2;
      groundMesh.position.y = -1.2;
      groundMesh.receiveShadow = true;
      floorGroup.add(groundMesh);

      // Concentric datum rings
      const ringGroup = new THREE.Group();
      for (let r = 3.0; r <= 24.0; r += 3.0) {
        const ringGeo = new THREE.RingGeometry(r - 0.015, r + 0.015, 128);
        const ringMat = new THREE.MeshBasicMaterial({
          color: colors.accentGlow,
          transparent: true,
          opacity: 0.16,
          side: THREE.DoubleSide
        });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = -Math.PI / 2;
        ring.position.y = -1.19;
        ringGroup.add(ring);
      }
      floorGroup.add(ringGroup);

      // Fine grid helper
      const gridHelper = new THREE.GridHelper(50, 50, colors.accentGlow, colors.panelBorder);
      gridHelper.position.y = -1.18;
      gridHelper.material.transparent = true;
      gridHelper.material.opacity = 0.18;
      floorGroup.add(gridHelper);

      // Precision radial spoke lines
      const spokes = 16;
      const spokeGeo = new THREE.BufferGeometry();
      const spokePositions = [];
      for (let i = 0; i < spokes; i++) {
        const angle = (i / spokes) * Math.PI * 2;
        spokePositions.push(Math.cos(angle) * 2.0, -1.17, Math.sin(angle) * 2.0);
        spokePositions.push(Math.cos(angle) * 24.0, -1.17, Math.sin(angle) * 24.0);
      }
      spokeGeo.setAttribute('position', new THREE.Float32BufferAttribute(spokePositions, 3));
      const spokeMat = new THREE.LineBasicMaterial({
        color: colors.accentGlow,
        transparent: true,
        opacity: 0.22
      });
      const spokeLines = new THREE.LineSegments(spokeGeo, spokeMat);
      floorGroup.add(spokeLines);
    }

    // Top Header Banner Object «ANNUAL REPORT / 2027 VISION»
    function buildHeaderBanner() {
      headerGroup.clear();

      const colors = getActiveColors();
      headerCanvasData = createHeaderCanvas(colors);

      const w = 6.4;
      const h = 0.96;
      const d = 0.06;

      const headerMeshGroup = new THREE.Group();
      headerMeshGroup.position.set(0, 3.6, -1.0);

      // Frame chassis with beveled metallic edge
      const frameGeo = new THREE.BoxGeometry(w + 0.1, h + 0.1, d);
      const frameMat = new THREE.MeshStandardMaterial({
        color: colors.metallicRim,
        metalness: params.plaqueMetalness,
        roughness: params.plaqueRoughness
      });
      const frameMesh = new THREE.Mesh(frameGeo, frameMat);
      frameMesh.castShadow = true;
      headerMeshGroup.add(frameMesh);
      plaqueRimMaterials.push(frameMat);

      // Front Face
      const faceGeo = new THREE.PlaneGeometry(w, h);
      const faceMat = new THREE.MeshStandardMaterial({
        map: headerCanvasData.texture,
        roughness: 0.35,
        metalness: 0.1
      });
      const faceMesh = new THREE.Mesh(faceGeo, faceMat);
      faceMesh.position.z = d / 2 + 0.002;
      headerMeshGroup.add(faceMesh);
      plaqueFaceMaterials.push(faceMat);

      // Precision horizontal laser guide rules
      const railGeo = new THREE.CylinderGeometry(0.008, 0.008, w + 0.6, 16);
      const railMat = new THREE.MeshStandardMaterial({
        color: colors.accentGlow,
        emissive: colors.accentGlow,
        emissiveIntensity: params.laserGlowIntensity,
        roughness: 0.2,
        metalness: 0.8
      });
      laserRailMaterials.push(railMat);

      const topRail = new THREE.Mesh(railGeo, railMat);
      topRail.rotation.z = Math.PI / 2;
      topRail.position.set(0, h / 2 + 0.08, 0);
      headerMeshGroup.add(topRail);

      const bottomRail = new THREE.Mesh(railGeo, railMat);
      bottomRail.rotation.z = Math.PI / 2;
      bottomRail.position.set(0, -h / 2 - 0.08, 0);
      headerMeshGroup.add(bottomRail);

      headerGroup.add(headerMeshGroup);
    }

    // Build the 10 Interactive Thesis Plaques with generous spacing
    function buildThesisPlaques() {
      plaquesGroup.clear();
      railsGroup.clear();

      plaqueMeshes = [];
      plaqueCanvasData = [];

      const colors = getActiveColors();
      const count = THESIS_DATA.length;

      // Card proportions: 3.8 width, 2.14 height, 0.07 depth (16:9)
      const cardW = 3.8;
      const cardH = 2.14;
      const cardD = 0.07;

      // Generous panoramic architectural arc: radius 15.0, angular step 0.34 rad
      // Arc distance = 15.0 * 0.34 = 5.1 units, card width = 3.8 units -> 1.3 units gap (NO OVERLAP!)
      const arcRadius = 15.0;
      const angleStep = 0.34;

      for (let i = 0; i < count; i++) {
        const thesis = THESIS_DATA[i];
        const canvasObj = createPlaqueCanvas(thesis, colors);
        plaqueCanvasData.push(canvasObj);

        const plaqueContainer = new THREE.Group();

        const angle = (i - 4.5) * angleStep;
        const baseX = Math.sin(angle) * arcRadius;
        const baseZ = -Math.cos(angle) * arcRadius + arcRadius - 4.0;
        const baseY = 0.8;

        plaqueContainer.position.set(baseX, baseY, baseZ);
        plaqueContainer.rotation.y = -angle;

        plaqueContainer.userData = {
          index: i,
          basePos: new THREE.Vector3(baseX, baseY, baseZ),
          baseRotY: -angle,
          currentFlyout: 0.0,
          targetFlyout: 0.0
        };

        // Frame Chassis
        const frameGeo = new THREE.BoxGeometry(cardW + 0.08, cardH + 0.08, cardD);
        const frameMat = new THREE.MeshStandardMaterial({
          color: colors.metallicRim,
          metalness: params.plaqueMetalness,
          roughness: params.plaqueRoughness,
          transparent: params.plaqueOpacity < 1.0,
          opacity: params.plaqueOpacity
        });
        const frameMesh = new THREE.Mesh(frameGeo, frameMat);
        frameMesh.castShadow = true;
        frameMesh.receiveShadow = true;
        plaqueContainer.add(frameMesh);
        plaqueRimMaterials.push(frameMat);

        // Front Face
        const faceGeo = new THREE.PlaneGeometry(cardW, cardH);
        const faceMat = new THREE.MeshStandardMaterial({
          map: canvasObj.texture,
          roughness: 0.38,
          metalness: 0.12,
          transparent: params.plaqueOpacity < 1.0,
          opacity: params.plaqueOpacity
        });
        const faceMesh = new THREE.Mesh(faceGeo, faceMat);
        faceMesh.position.z = cardD / 2 + 0.002;
        plaqueContainer.add(faceMesh);
        plaqueFaceMaterials.push(faceMat);

        // Precision Laser Glide Rails (clean mechanical slide track)
        const trackLen = 3.6;
        const trackGeo = new THREE.CylinderGeometry(0.008, 0.008, trackLen, 12);
        const trackMat = new THREE.MeshStandardMaterial({
          color: colors.accentGlow,
          emissive: colors.accentGlow,
          emissiveIntensity: params.laserGlowIntensity,
          roughness: 0.2,
          metalness: 0.8
        });
        laserRailMaterials.push(trackMat);

        // Left slide rail (strictly along local Z)
        const leftRail = new THREE.Mesh(trackGeo, trackMat);
        leftRail.rotation.x = Math.PI / 2;
        leftRail.position.set(-cardW / 2 + 0.15, -cardH / 2 - 0.04, -trackLen / 2 + 0.2);
        plaqueContainer.add(leftRail);

        // Right slide rail (strictly along local Z)
        const rightRail = new THREE.Mesh(trackGeo, trackMat);
        rightRail.rotation.x = Math.PI / 2;
        rightRail.position.set(cardW / 2 - 0.15, -cardH / 2 - 0.04, -trackLen / 2 + 0.2);
        plaqueContainer.add(rightRail);

        // Precision Floor Datum Plumb Line (drops straight down to floor)
        const plumbLineGeo = new THREE.CylinderGeometry(0.004, 0.004, 2.0, 8);
        const plumbMesh = new THREE.Mesh(plumbLineGeo, trackMat);
        plumbMesh.position.set(0, -1.0, 0);
        plaqueContainer.add(plumbMesh);

        // Floor Datum Target Marker
        const floorMarkerGroup = new THREE.Group();
        floorMarkerGroup.position.set(baseX, -1.18, baseZ);
        floorMarkerGroup.rotation.y = -angle;

        const targetRingGeo = new THREE.RingGeometry(0.24, 0.26, 32);
        const targetRingMat = new THREE.MeshBasicMaterial({
          color: colors.accentGlow,
          transparent: true,
          opacity: 0.35,
          side: THREE.DoubleSide
        });
        const targetRing = new THREE.Mesh(targetRingGeo, targetRingMat);
        targetRing.rotation.x = -Math.PI / 2;
        floorMarkerGroup.add(targetRing);

        floorGroup.add(floorMarkerGroup);
        laserFloorMarkers.push(floorMarkerGroup);

        // 4 Sleek Corner Brackets
        const bracketL = 0.18;
        const bracketT = 0.015;
        const bracketGeo = new THREE.BoxGeometry(bracketL, bracketT, 0.04);

        const bTL = new THREE.Mesh(bracketGeo, trackMat);
        bTL.position.set(-cardW / 2 + bracketL / 2, cardH / 2 + 0.02, cardD / 2 + 0.005);
        plaqueContainer.add(bTL);

        const bTR = new THREE.Mesh(bracketGeo, trackMat);
        bTR.position.set(cardW / 2 - bracketL / 2, cardH / 2 + 0.02, cardD / 2 + 0.005);
        plaqueContainer.add(bTR);

        const bBL = new THREE.Mesh(bracketGeo, trackMat);
        bBL.position.set(-cardW / 2 + bracketL / 2, -cardH / 2 - 0.02, cardD / 2 + 0.005);
        plaqueContainer.add(bBL);

        const bBR = new THREE.Mesh(bracketGeo, trackMat);
        bBR.position.set(cardW / 2 - bracketL / 2, -cardH / 2 - 0.02, cardD / 2 + 0.005);
        plaqueContainer.add(bBR);

        plaquesGroup.add(plaqueContainer);
        plaqueMeshes.push(plaqueContainer);
      }
    }

    // Floating micro-particles (data dust)
    function buildDataDust() {
      particlesGroup.clear();

      const particleCount = 240;
      const geo = new THREE.BufferGeometry();
      const pos = [];

      for (let i = 0; i < particleCount; i++) {
        const x = (Math.random() - 0.5) * 28;
        const y = Math.random() * 8 - 1.0;
        const z = (Math.random() - 0.5) * 22;
        pos.push(x, y, z);
      }

      geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));

      const colors = getActiveColors();
      const mat = new THREE.PointsMaterial({
        color: colors.accentGlow,
        size: 0.04,
        transparent: true,
        opacity: 0.4,
        blending: THREE.AdditiveBlending
      });

      const pSystem = new THREE.Points(geo, mat);
      particlesGroup.add(pSystem);
    }

    // =========================================================================
    // THEME & COLOR SCHEME MANAGEMENT
    // =========================================================================
    function applyColorScheme(schemeName) {
      params.colorScheme = schemeName;
      const colors = COLOR_SCHEMES[schemeName] || COLOR_SCHEMES['Original'];

      params.customBg = colors.bg;
      params.customPanelBg = colors.panelBg;
      params.customPanelBorder = colors.panelBorder;
      params.customMetallicRim = colors.metallicRim;
      params.customTextPrimary = colors.textPrimary;
      params.customTextSecondary = colors.textSecondary;
      params.customAccentGlow = colors.accentGlow;
      params.customMetricBadge = colors.metricBadge;

      params.ambientColor = colors.ambient;
      params.keyColor = colors.keyLight;
      params.fillColor = colors.fillLight;
      params.rimColor = colors.rimLight;

      applyThemeVisuals();
    }

    function applyThemeVisuals() {
      const colors = getActiveColors();

      if (params.greenscreen) {
        scene.background = new THREE.Color('#00ff00');
        if (floorGroup) floorGroup.visible = false;
        if (particlesGroup) particlesGroup.visible = false;
      } else {
        scene.background = new THREE.Color(colors.bg);
        if (floorGroup) floorGroup.visible = params.showFloorGrid;
        if (particlesGroup) particlesGroup.visible = params.showParticles;
      }

      plaqueRimMaterials.forEach(mat => {
        mat.color.set(colors.metallicRim);
        mat.metalness = params.plaqueMetalness;
        mat.roughness = params.plaqueRoughness;
        mat.opacity = params.plaqueOpacity;
        mat.transparent = params.plaqueOpacity < 1.0;
      });

      plaqueFaceMaterials.forEach(mat => {
        mat.opacity = params.plaqueOpacity;
        mat.transparent = params.plaqueOpacity < 1.0;
      });

      laserRailMaterials.forEach(mat => {
        if (mat.emissive) {
          mat.emissive.set(colors.accentGlow);
          mat.emissiveIntensity = params.laserGlowIntensity;
        }
        if (mat.color) {
          mat.color.set(colors.accentGlow);
        }
      });

      updateLights();
      updateAllTextures();
    }

    function applyMaterialFinish(finishName) {
      params.materialFinish = finishName;
      if (finishName === 'Matte Graphite') {
        params.plaqueMetalness = 0.25;
        params.plaqueRoughness = 0.75;
      } else if (finishName === 'Brushed Titanium') {
        params.plaqueMetalness = 0.88;
        params.plaqueRoughness = 0.26;
      } else if (finishName === 'Anodized Platinum') {
        params.plaqueMetalness = 0.95;
        params.plaqueRoughness = 0.18;
      } else if (finishName === 'Dark Ceramic') {
        params.plaqueMetalness = 0.45;
        params.plaqueRoughness = 0.12;
      }
      applyThemeVisuals();
    }

    function updateAntialias() {
      const curPos = camera.position.clone();
      const curTarget = controls.target.clone();

      initRenderer();

      camera.position.copy(curPos);
      controls.target.copy(curTarget);
      controls.update();

      applyThemeVisuals();
    }

    // =========================================================================
    // PROCEDURAL RANDOMIZATION (CLICK TO REROLL)
    // NOTE: Explicit requirement - DO NOT shuffle or change Postprocessing settings!
    // =========================================================================
    function randomizeScene() {
      // 1. Randomize Scene Colors
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      params.colorScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];

      // 2. Randomize Kinematics & Presentation
      params.animation = ANIMATION_PRESETS[Math.floor(Math.random() * ANIMATION_PRESETS.length)];
      params.activeThesisIndex = Math.floor(Math.random() * THESIS_DATA.length);
      params.flyoutDistance = 1.6 + Math.random() * 1.4;
      params.animationSpeed = 0.75 + Math.random() * 0.6;
      params.orbitRadius = 8.5 + Math.random() * 3.5;
      params.cameraHeight = 1.2 + Math.random() * 1.6;

      // 3. Randomize Surface Properties
      params.plaqueMetalness = 0.3 + Math.random() * 0.65;
      params.plaqueRoughness = 0.15 + Math.random() * 0.55;
      params.laserGlowIntensity = 1.6 + Math.random() * 1.8;

      // 4. Randomize Lighting
      params.exposure = 1.0 + Math.random() * 0.35;
      params.keyIntensity = 2.2 + Math.random() * 1.4;

      applyColorScheme(params.colorScheme);

      // Sync GUI controllers without touching PostProcessor
      if (gui) {
        gui.controllersRecursive().forEach(c => {
          // Do not update PostProcessor controllers since they were untouched
          if (!c.parent || c.parent.title !== 'Post-Processing Suite') {
            c.updateDisplay();
          }
        });
      }
    }

    // =========================================================================
    // ANIMATION PIPELINE (8 DISTINCT PRECONFIGURED MODES)
    // =========================================================================
    function updateAnimations(elapsedTime, delta) {
      const speed = params.animationSpeed;
      const t = elapsedTime * speed;

      // Auto cycle theses
      if (params.autoCycleTheses) {
        thesisCycleTimer += delta * speed;
        if (thesisCycleTimer >= params.cycleDuration) {
          thesisCycleTimer = 0;
          params.activeThesisIndex = (params.activeThesisIndex + 1) % THESIS_DATA.length;
          if (gui) {
            const c = gui.controllersRecursive().find(ctrl => ctrl.property === 'activeThesisIndex');
            if (c) c.updateDisplay();
          }
        }
      }

      // Smooth Plaque Flyout & Slide Kinematics
      const currentActive = params.activeThesisIndex;

      plaqueMeshes.forEach((plaque, idx) => {
        const u = plaque.userData;
        let targetFly = 0.0;

        if (params.animation === 'Plaque Cascade & Laser Rail') {
          // Harmonious sequential cascade wave with ample clearance
          const wave = Math.sin(t * 1.5 - idx * 0.6);
          targetFly = THREE.MathUtils.smoothstep(wave, 0.1, 0.9) * params.flyoutDistance;
        } else if (params.animation === 'Breathing Monolith Pulse') {
          const pulse = (Math.sin(t * 1.2) * 0.5 + 0.5);
          targetFly = (idx === currentActive ? params.flyoutDistance : 0.35 * pulse);
        } else {
          // Centered active hero card
          if (idx === currentActive) {
            targetFly = params.flyoutDistance;
          } else {
            const dist = Math.abs(idx - currentActive);
            targetFly = dist === 1 ? 0.35 : 0.0;
          }
        }

        // Smooth interpolation
        u.currentFlyout = THREE.MathUtils.lerp(u.currentFlyout, targetFly, delta * 4.5);

        // Compute forward normal vector along local orientation
        const forwardZ = Math.cos(u.baseRotY);
        const forwardX = Math.sin(u.baseRotY);

        plaque.position.x = u.basePos.x + forwardX * u.currentFlyout;
        plaque.position.z = u.basePos.z + forwardZ * u.currentFlyout;
        plaque.position.y = u.basePos.y + (u.currentFlyout * 0.12);

        if (params.animation === 'Floating Gallery Sway') {
          plaque.position.y += Math.sin(t * 1.4 + idx * 0.8) * 0.06;
          plaque.rotation.z = Math.sin(t * 1.1 + idx * 0.5) * 0.015;
        } else {
          plaque.rotation.z = 0;
        }
      });

      // Data dust slow drift
      if (particlesGroup.children.length > 0) {
        particlesGroup.children[0].rotation.y = t * 0.035;
      }

      // CAMERA BEHAVIOR FOR 8 PRESETS
      switch (params.animation) {
        case 'Executive Glide & Orbit': {
          const camAngle = t * 0.15;
          const r = params.orbitRadius;
          camera.position.x = Math.sin(camAngle) * r;
          camera.position.z = Math.cos(camAngle) * r;
          camera.position.y = params.cameraHeight + Math.sin(t * 0.2) * 0.3;
          controls.target.set(0, 1.0, 0);
          break;
        }

        case 'Static (Pure Executive Typography)': {
          camera.position.set(0, params.cameraHeight, params.orbitRadius);
          controls.target.set(0, 1.0, 0);
          break;
        }

        case 'Plaque Cascade & Laser Rail': {
          const panAngle = Math.sin(t * 0.22) * 0.35;
          const r = params.orbitRadius;
          camera.position.x = Math.sin(panAngle) * r;
          camera.position.z = Math.cos(panAngle) * r;
          camera.position.y = params.cameraHeight + Math.cos(t * 0.28) * 0.25;
          controls.target.set(0, 1.0, 0);
          break;
        }

        case 'Architectural Grid Elevation': {
          const elev = (Math.sin(t * 0.18) * 0.5 + 0.5);
          camera.position.x = Math.sin(t * 0.14) * 6.5;
          camera.position.z = 8.5 - elev * 1.5;
          camera.position.y = -0.1 + elev * 2.8;
          controls.target.set(0, 1.4, 0);
          break;
        }

        case 'Datum Coordinate Scan': {
          const scanPan = Math.sin(t * 0.3) * 4.5;
          camera.position.x = scanPan;
          camera.position.y = params.cameraHeight;
          camera.position.z = params.orbitRadius - 1.2;
          controls.target.set(scanPan * 0.35, 1.0, 0);
          break;
        }

        case 'Floating Gallery Sway': {
          const swayX = Math.sin(t * 0.2) * 3.0;
          const swayY = Math.cos(t * 0.25) * 0.6;
          camera.position.x = swayX;
          camera.position.y = params.cameraHeight + swayY;
          camera.position.z = params.orbitRadius;
          controls.target.set(0, 1.0, 0);
          break;
        }

        case 'Macro Metric Inspection': {
          const activePlaque = plaqueMeshes[currentActive];
          if (activePlaque) {
            const targetPos = activePlaque.position;
            camera.position.x = THREE.MathUtils.lerp(camera.position.x, targetPos.x * 0.8, delta * 2.2);
            camera.position.y = THREE.MathUtils.lerp(camera.position.y, targetPos.y + 0.05, delta * 2.2);
            camera.position.z = THREE.MathUtils.lerp(camera.position.z, targetPos.z + 4.8, delta * 2.2);
            controls.target.lerp(new THREE.Vector3(targetPos.x, targetPos.y, targetPos.z), delta * 2.5);
          }
          break;
        }

        case 'Breathing Monolith Pulse': {
          const breathe = Math.sin(t * 0.28) * 1.2;
          camera.position.set(0, params.cameraHeight + Math.sin(t * 0.35) * 0.25, params.orbitRadius + breathe);
          controls.target.set(0, 1.0, 0);
          break;
        }
      }
    }

    // Toggle UI visibility with 'H' key
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        if (gui) {
          gui.show(gui._hidden);
        }
      }
    });

    // Click on scene to randomly generate new visual theme & re-roll parameters
    let pointerDownPos = { x: 0, y: 0 };
    let pointerDownTime = 0;

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.lil-gui')) return;
      pointerDownPos.x = e.clientX;
      pointerDownPos.y = e.clientY;
      pointerDownTime = performance.now();
    });

    window.addEventListener('pointerup', (e) => {
      if (!params.clickToRandomize) return;
      if (e.target.closest('.lil-gui')) return;
      const dx = e.clientX - pointerDownPos.x;
      const dy = e.clientY - pointerDownPos.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const dt = performance.now() - pointerDownTime;
      // Quick click/tap without dragging
      if (dist < 6 && dt < 350) {
        randomizeScene();
      }
    });

    // Window Resizing
    window.addEventListener('resize', () => {
      if (camera && renderer) {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        if (postProcessor) {
          postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);
        }
      }
    });

    // =========================================================================
    // MAIN LOOP
    // =========================================================================
    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const elapsedTime = clock.getElapsedTime();

      controls.update();
      updateAnimations(elapsedTime, delta);

      if (postProcessor && postProcessor.settings.enabled) {
        postProcessor.renderScene(scene, camera);
      } else {
        renderer.render(scene, camera);
      }
    }

    // Run application
    initScene();
    initGUI();
    animate();
  </script>
</body>
</html>
