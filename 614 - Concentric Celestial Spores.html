    // ============================================================

      // Animation & Motion
      animationStyle: 'Concentric Breathing', // 'Concentric Breathing', 'Gyroscopic Eyes', 'Chromatic Shimmer', 'Living Coral Drift', 'Hypnotic Spiral', 'Static Fine Art'
      animSpeed: 1.0,
      isPlaying: true,
      pulseDepth: 0.12,
      eccentricity: 0.32,
      driftAmount: 3.5,
      interactiveCursor: true,
      cursorRadius: 180,

      // Viewport & Camera Interaction
      randomizeOnClick: true,
      zoom: 1.0,
      panX: 0,
      panY: 0,

      // Action Handlers
      regenerate: () => initSimulation(),
      randomizeScene: () => randomizeAll(true),
      resetView: () => resetCamera(),
      saveImage: () => exportImage()
    };

    // Base dimensions preserved from original snippet
    const BASE_WIDTH = 800;
    const BASE_HEIGHT = 800;

    // Simulation Domain Dimensions
    let domainWidth = BASE_WIDTH;
    let domainHeight = BASE_HEIGHT;

    // Active Spore Circle Array
    const circles = [];

    // Current Theme Reference
    let currentTheme = COLOR_SCHEMES[settings.colorScheme];

    // Animation Clock
    let animClock = 0;

    // Camera Transform & Smooth Inertia Interpolation
    let targetPanX = 0, currentPanX = 0;
    let targetPanY = 0, currentPanY = 0;
    let targetZoom = 1.0, currentZoom = 1.0;

    // Pointer Interaction State
    let isPointerDown = false;
    let isDragging = false;
    let pointerStartX = 0, pointerStartY = 0;
    let lastPointerX = 0, lastPointerY = 0;
    let pointerStartTime = 0;
    let rawMouseX = -9999, rawMouseY = -9999;
    let worldMouseX = -9999, worldMouseY = -9999;

    // GUI References
    let gui = null;
    let controllers = {};

    // ============================================================
    // SporeCircle Class (Preserving Original Algorithm & Math)
    // ============================================================
    class SporeCircle {
      constructor(x, y, r, baseIndex, gaussianVal) {
        this.x = x;
        this.y = y;
        this.homeX = x;
        this.homeY = y;
        this.r = r;
        this.baseIndex = baseIndex; // 0..4 mapped from ch
        this.gaussianVal = gaussianVal;
        this.phase = (x * 0.015 + y * 0.021 + Math.random() * Math.PI) % (Math.PI * 2);

        // Nested concentric rings: int l = int(random(2, 6)); float f = 0.8;
        const l = Math.floor(2 + Math.random() * 4);
        this.rings = [];
        let f = 0.8;
        for (let k = 0; k < l; k++) {
          const ringGaussian = randomGaussianNumber(0, 1);
          this.rings.push({
            f: f,
            ringGaussian: ringGaussian,
            phaseOffset: k * 1.1 + Math.random() * 0.5,
            accentChance: Math.random()
          });
          f *= 0.6 + Math.random() * 0.2; // f *= random(0.6, 0.8)
        }
      }

      // Draw method with full animation and LOD optimization
      draw(t, ctx, p5Inst) {
        // LOD Check: If transformed size is less than 0.5px, skip completely
        const screenR = this.r * currentZoom;
        if (screenR < 0.4) return;

        // Dynamic Position modulation (Living Coral Drift)
        let drawX = this.homeX;
        let drawY = this.homeY;
        if (settings.animationStyle === 'Living Coral Drift') {
          drawX += Math.sin(t * 1.2 + this.phase) * settings.driftAmount;
          drawY += Math.cos(t * 0.95 + this.phase * 1.3) * settings.driftAmount;
        }

        // Concentric Breathing radius pulsation
        let animatedR = this.r;
        if (settings.animationStyle === 'Concentric Breathing' || settings.animationStyle === 'Gyroscopic Eyes') {
          const breath = 1.0 + Math.sin(t * 2.2 + this.phase) * (settings.pulseDepth * 0.35);
          animatedR *= breath;
        }

        // Stroke Weight: float sw = map(r[ii], 0, rm, 0.05, 1.0);
        const baseSw = Math.max(0.2, (animatedR / settings.maxRadius) * settings.strokeMultiplier);

        // Determine base outer color
        const outerFill = this.getColor(this.baseIndex, this.gaussianVal, 0, false, t);

        // Stroke color determination
        let strokeColor = currentTheme.stroke;
        if (settings.strokeMode === 'No Stroke') {
          strokeColor = null;
        } else if (settings.strokeMode === 'Palette Match') {
          strokeColor = currentTheme.accent;
        } else if (settings.strokeMode === 'Subtle Glow') {
          strokeColor = 'rgba(255, 255, 255, 0.4)';
        }

        // Draw Outer Circle
        ctx.beginPath();
        ctx.arc(drawX, drawY, animatedR, 0, Math.PI * 2);
        ctx.fillStyle = outerFill;
        ctx.fill();

        if (strokeColor && screenR > 1.2) {
          ctx.strokeStyle = strokeColor;
          ctx.lineWidth = Math.max(0.5, baseSw);
          ctx.stroke();
        }

        // LOD Optimization: If circle is small on screen, skip inner nested rings
        if (screenR < 3.0) return;

        // Interactive Cursor Vector Calculation
        let cursorInfluence = 0;
        let cursorAngle = 0;
        if (settings.interactiveCursor && worldMouseX > -5000) {
          const distToCursor = Math.hypot(worldMouseX - drawX, worldMouseY - drawY);
          if (distToCursor < settings.cursorRadius) {
            cursorInfluence = Math.pow(1.0 - (distToCursor / settings.cursorRadius), 1.8);
            cursorAngle = Math.atan2(worldMouseY - drawY, worldMouseX - drawX);
          }
        }

        // Draw Nested Concentric Rings
        for (let k = 0; k < this.rings.length; k++) {
          const ring = this.rings[k];

          // Dynamic scale modulation (Iris breathing)
          let currentF = ring.f;
          if (settings.animationStyle === 'Concentric Breathing' || settings.animationStyle === 'Hypnotic Spiral') {
            const ringBreath = 1.0 + Math.sin(t * 3.0 + this.phase + ring.phaseOffset) * settings.pulseDepth;
            currentF = Math.max(0.02, Math.min(0.96, ring.f * ringBreath));
          }

          const ringRadius = animatedR * currentF;
          if (ringRadius * currentZoom < 0.6) continue;

          // Eccentric center offset for Gyroscopic Eyes / Hypnotic Spiral
          let ringCenterX = drawX;
          let ringCenterY = drawY;

          if (settings.animationStyle === 'Gyroscopic Eyes' || settings.animationStyle === 'Hypnotic Spiral') {
            const orbitAngle = t * 2.4 + this.phase + ring.phaseOffset;
            const maxShift = (animatedR - ringRadius) * settings.eccentricity;
            let ox = Math.cos(orbitAngle) * maxShift;
            let oy = Math.sin(orbitAngle) * maxShift;

            // Interactive gaze shift towards cursor
            if (cursorInfluence > 0) {
              const gazeDistance = maxShift * cursorInfluence * 1.2;
              ox = ox * (1 - cursorInfluence) + Math.cos(cursorAngle) * gazeDistance;
              oy = oy * (1 - cursorInfluence) + Math.sin(cursorAngle) * gazeDistance;
            }

            ringCenterX += ox;
            ringCenterY += oy;
          } else if (cursorInfluence > 0) {
            // Subtle gaze towards cursor even in breathing mode
            const maxShift = (animatedR - ringRadius) * settings.eccentricity * cursorInfluence * 0.6;
            ringCenterX += Math.cos(cursorAngle) * maxShift;
            ringCenterY += Math.sin(cursorAngle) * maxShift;
          }

          // Inner ring color: fill(int(c[ii] + 90 * randomGaussian()) % 360, 100, 100);
          const ringFill = this.getColor(this.baseIndex, ring.ringGaussian, k + 1, ring.accentChance < 0.18, t);

          ctx.beginPath();
          ctx.arc(ringCenterX, ringCenterY, ringRadius, 0, Math.PI * 2);
          ctx.fillStyle = ringFill;
          ctx.fill();

          if (strokeColor && ringRadius * currentZoom > 1.8) {
            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = Math.max(0.3, baseSw * 0.85);
            ctx.stroke();
          }
        }
      }

      // Color computation based on current theme, Gaussian offsets, and animations
      getColor(baseIndex, gVal, depth, isAccent, t) {
        if (currentTheme.mode === 'hsb') {
          // Original HSB Logic:
          // int [] palette = {60,200,240,250,255};
          // fill(int(c[ii]+90*randomGaussian())%360, 100, 100);
          const baseHue = currentTheme.palette[baseIndex] || 60;
          let hue = depth === 0 ? baseHue : (baseHue + 90 * gVal);
          
          if (settings.animationStyle === 'Chromatic Shimmer') {
            hue += Math.sin(t * 2.5 + (this.x + this.y) * 0.005) * 45;
          }

          hue = ((Math.floor(hue) % 360) + 360) % 360;
          return `hsl(${hue}, 100%, 50%)`;
        }

        // Palette or Accent Mode
        if (isAccent && currentTheme.accent) {
          return currentTheme.accent;
        }

        const colors = currentTheme.colors;
        if (depth === 0) {
          return colors[baseIndex % colors.length];
        }

        // Inner rings pick from harmonious palette variations
        let colorIdx = (baseIndex + Math.floor(Math.abs(gVal * 1.5))) % colors.length;
        if (settings.animationStyle === 'Chromatic Shimmer') {
          const shift = Math.floor(Math.sin(t * 2.0 + (this.x + this.y) * 0.004) * 2.5);
          colorIdx = (colorIdx + shift + colors.length * 2) % colors.length;
        }

        return colors[colorIdx];
      }
    }

    // Gaussian Random Helper preserving original randomGaussian() distribution
    function randomGaussianNumber(mean = 0, stdev = 1) {
      let u = 1 - Math.random();
      let v = Math.random();
      let z = Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
      return z * stdev + mean;
    }

    // ============================================================
    // Generative Simulation Initializer (Exact Circle Packing)
    // ============================================================
    function initSimulation() {
      circles.length = 0;

      // Update current theme reference
      currentTheme = COLOR_SCHEMES[settings.colorScheme] || COLOR_SCHEMES['Original'];

      // Configure simulation domain based on layout mode
      if (settings.layoutMode === 'Full Viewport') {
        domainWidth = Math.max(800, window.innerWidth);
        domainHeight = Math.max(800, window.innerHeight);
      } else {
        domainWidth = BASE_WIDTH;
        domainHeight = BASE_HEIGHT;
      }

      // Compute number of candidate targets proportional to area
      const areaRatio = (domainWidth * domainHeight) / (BASE_WIDTH * BASE_HEIGHT);
      const targetM = Math.round(settings.targetCount * (settings.layoutMode === 'Full Viewport' ? Math.max(1, areaRatio * 0.9) : 1.0));
      const rm = settings.maxRadius;

      // High-performance 2D Spatial Hash Grid (cell size = 2 * rm)
      // This produces 100% mathematically exact packing results in O(1) time
      const cellSize = rm * 2;
      const cols = Math.ceil(domainWidth / cellSize);
      const rows = Math.ceil(domainHeight / cellSize);
      const grid = Array.from({ length: cols * rows }, () => []);

      let attempts = 0;
      const maxAttempts = targetM * 35; // Generous collision rejection safety ceiling

      while (circles.length < targetM && attempts < maxAttempts) {
        attempts++;
        let rh = rm;
        let xh = rh + Math.random() * (domainWidth - 2 * rh);
        let yh = rh + Math.random() * (domainHeight - 2 * rh);

        let flag = false;

        const cx = Math.floor(xh / cellSize);
        const cy = Math.floor(yh / cellSize);

        // Check neighboring spatial grid cells for collision and radius shrinkage
        for (let dy = -1; dy <= 1 && !flag; dy++) {
          for (let dx = -1; dx <= 1 && !flag; dx++) {
            const nx = cx + dx, ny = cy + dy;
            if (nx >= 0 && nx < cols && ny >= 0 && ny < rows) {
              const cell = grid[ny * cols + nx];
              for (let j = 0; j < cell.length; j++) {
                const other = circles[cell[j]];
                const dis = Math.hypot(xh - other.x, yh - other.y);
                if (dis < other.r) {
                  flag = true;
                  break;
                } else {
                  if (dis - other.r < rh) {
                    rh = dis - other.r;
                  }
                }
              }
            }
          }
        }

        // Original placement logic and color mapping:
        // if (flag==false) {
        //   x[i]=xh; y[i]=yh; r[i]=rh;
        //   //float ch = map(dist(x[i],y[i],0,0),0,width/2,0,360);
        //   float ch = map(abs(y[i]-x[i]+90*randomGaussian()), 0, width/2, 0,2);
        //   if (ch>5) ch = 4;
        //   c[i]=palette[int(ch)];
        //   i++;
        // }
        if (!flag && rh >= settings.minRadius) {
          const gVal = randomGaussianNumber(0, 1);
          let ch = (Math.abs(yh - xh + settings.gaussianSpread * gVal)) / (domainWidth / 2) * settings.diagonalBands;
          if (ch > 4) ch = 4;
          const baseIndex = Math.max(0, Math.min(4, Math.floor(ch)));

          const circleIndex = circles.length;
          const newCircle = new SporeCircle(xh, yh, rh, baseIndex, gVal);
          circles.push(newCircle);

          // Insert into spatial hash grid
          const cellIdx = cy * cols + cx;
          if (cellIdx >= 0 && cellIdx < grid.length) {
            grid[cellIdx].push(circleIndex);
          }
        }
      }

      // Update document body background color
      document.body.style.backgroundColor = currentTheme.bg;
    }

    // ============================================================
    // p5.js Setup & Draw Lifecycle
    // ============================================================
    function setup() {
      const canvas = createCanvas(windowWidth, windowHeight);
      canvas.parent('canvas-container');

      pixelDensity(Math.min(window.devicePixelRatio || 1, 2));

      // Initialize Simulation
      initSimulation();

      // Initialize lil-gui interactive controls
      initGUI();

      // Attach event listeners for zoom, drag and click
      setupEventListeners();
    }

    function draw() {
      // Clear background with current palette theme
      background(currentTheme.bg);

      // Smooth inertia interpolation for Pan & Zoom
      currentPanX = lerp(currentPanX, targetPanX, 0.14);
      currentPanY = lerp(currentPanY, targetPanY, 0.14);
      currentZoom = lerp(currentZoom, targetZoom, 0.14);

      // Advance animation clock
      if (settings.isPlaying) {
        animClock += (deltaTime / 1000) * settings.animSpeed;
      }

      // Update world mouse coordinates for interactive cursor reaction
      if (rawMouseX > -5000) {
        worldMouseX = (rawMouseX - (width / 2 + currentPanX)) / currentZoom + domainWidth / 2;
        worldMouseY = (rawMouseY - (height / 2 + currentPanY)) / currentZoom + domainHeight / 2;
      } else {
        worldMouseX = -9999;
        worldMouseY = -9999;
      }

      // Center the simulation domain in the viewport with Pan & Zoom transforms
      push();
      translate(width / 2 + currentPanX, height / 2 + currentPanY);
      scale(currentZoom);
      translate(-domainWidth / 2, -domainHeight / 2);

      // Framed canvas shadow & boundary (if in Classic 800x800 mode)
      if (settings.layoutMode === 'Classic 800x800') {
        push();
        noFill();
        stroke(currentTheme.isDark ? 'rgba(255, 255, 255, 0.15)' : 'rgba(0, 0, 0, 0.12)');
        strokeWeight(1 / currentZoom);
        rect(0, 0, domainWidth, domainHeight);
        pop();
      }

      // Fast direct 2D canvas context access for optimal 60 FPS rendering
      const ctx = drawingContext;

      // Render each spore circle with nested concentric rings
      for (let i = 0; i < circles.length; i++) {
        circles[i].draw(animClock, ctx, this);
      }

      pop();
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
      if (settings.layoutMode === 'Full Viewport') {
        initSimulation();
      }
    }

    // ============================================================
    // Camera Reset & View Handling
    // ============================================================
    function resetCamera() {
      targetPanX = 0;
      targetPanY = 0;
      targetZoom = 1.0;
      settings.panX = 0;
      settings.panY = 0;
      settings.zoom = 1.0;
      if (controllers.panX) controllers.panX.updateDisplay();
      if (controllers.panY) controllers.panY.updateDisplay();
      if (controllers.zoom) controllers.zoom.updateDisplay();
    }

    // ============================================================
    // Randomize Scene & Theme Variation Generator (Requirement 6)
    // ============================================================
    function randomizeAll(regenerateGeometry = true) {
      // 1. Pick a random color scheme from the 19 schemes
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      settings.colorScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      currentTheme = COLOR_SCHEMES[settings.colorScheme];
      document.body.style.backgroundColor = currentTheme.bg;

      // 2. Randomize geometric parameters
      settings.maxRadius = Math.round((14 + Math.random() * 16) * 10) / 10;
      settings.gaussianSpread = Math.round(50 + Math.random() * 80);
      settings.diagonalBands = Math.round((1.2 + Math.random() * 2.2) * 10) / 10;

      // 3. Randomize animation & motion
      const styles = [
        'Concentric Breathing',
        'Gyroscopic Eyes',
        'Chromatic Shimmer',
        'Living Coral Drift',
        'Hypnotic Spiral'
      ];
      settings.animationStyle = styles[Math.floor(Math.random() * styles.length)];
      settings.animSpeed = Math.round((0.7 + Math.random() * 0.9) * 100) / 100;
      settings.pulseDepth = Math.round((0.08 + Math.random() * 0.12) * 100) / 100;
      settings.eccentricity = Math.round((0.15 + Math.random() * 0.28) * 100) / 100;
      settings.driftAmount = Math.round((2.0 + Math.random() * 3.5) * 10) / 10;

      // 4. Update all lil-gui controller displays to reflect procedural variations
      for (let key in controllers) {
        if (controllers[key] && typeof controllers[key].updateDisplay === 'function') {
          controllers[key].updateDisplay();
        }
      }

      // 5. Regenerate the geometric structure
      if (regenerateGeometry) {
        initSimulation();
      }
    }

    // ============================================================
    // Image Export Helper
    // ============================================================
    function exportImage() {
      const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
      saveCanvas(`concentric-spores-${timestamp}`, 'png');
    }

    // ============================================================
    // Interactive User Controls: Wheel Zoom, Drag & Click Randomize
    // ============================================================
    function setupEventListeners() {
      // Track Raw Mouse Coordinates for Interactive Gaze
      window.addEventListener('pointermove', (e) => {
        rawMouseX = e.clientX;
        rawMouseY = e.clientY;
      });

      window.addEventListener('pointerleave', () => {
        rawMouseX = -9999;
        rawMouseY = -9999;
      });

      // Wheel Zoom Interaction (Zooms towards cursor)
      window.addEventListener('wheel', (e) => {
        if (e.target && e.target.closest && e.target.closest('.lil-gui')) return;
        e.preventDefault();

        const zoomFactor = e.deltaY < 0 ? 1.1 : 0.909;
        const newZoom = Math.min(Math.max(targetZoom * zoomFactor, 0.2), 10.0);

        // Zoom relative to pointer position
        const mouseXRel = e.clientX - (window.innerWidth / 2 + targetPanX);
        const mouseYRel = e.clientY - (window.innerHeight / 2 + targetPanY);
        targetPanX -= mouseXRel * (newZoom / targetZoom - 1);
        targetPanY -= mouseYRel * (newZoom / targetZoom - 1);
        targetZoom = newZoom;

        settings.zoom = targetZoom;
        settings.panX = targetPanX;
        settings.panY = targetPanY;

        if (controllers.zoom) controllers.zoom.updateDisplay();
        if (controllers.panX) controllers.panX.updateDisplay();
        if (controllers.panY) controllers.panY.updateDisplay();
      }, { passive: false });

      // Pointer Down
      window.addEventListener('pointerdown', (e) => {
        if (e.target && e.target.closest && e.target.closest('.lil-gui')) return;

        isPointerDown = true;
        isDragging = false;
        pointerStartX = e.clientX;
        pointerStartY = e.clientY;
        lastPointerX = e.clientX;
        lastPointerY = e.clientY;
        pointerStartTime = performance.now();
      });

      // Pointer Move (Drag Object across Screen)
      window.addEventListener('pointermove', (e) => {
        if (!isPointerDown) return;

        const dx = e.clientX - lastPointerX;
        const dy = e.clientY - lastPointerY;
        lastPointerX = e.clientX;
        lastPointerY = e.clientY;

        const totalDist = Math.hypot(e.clientX - pointerStartX, e.clientY - pointerStartY);
        if (totalDist > 5) {
          isDragging = true;
          document.body.classList.add('grabbing');
        }

        if (isDragging) {
          targetPanX += dx;
          targetPanY += dy;
          settings.panX = targetPanX;
          settings.panY = targetPanY;
          if (controllers.panX) controllers.panX.updateDisplay();
          if (controllers.panY) controllers.panY.updateDisplay();
        }
      });

      // Pointer Up (Click Detection & Randomize)
      window.addEventListener('pointerup', (e) => {
        if (e.target && e.target.closest && e.target.closest('.lil-gui')) {
          isPointerDown = false;
          return;
        }

        document.body.classList.remove('grabbing');
        const clickDuration = performance.now() - pointerStartTime;
        const totalDist = Math.hypot(e.clientX - pointerStartX, e.clientY - pointerStartY);

        // Click on scene (without drag): randomly generate new visual theme and parameters
        if (!isDragging && totalDist < 6 && clickDuration < 380) {
          if (settings.randomizeOnClick) {
            randomizeAll(true);
          }
        }

        isPointerDown = false;
        isDragging = false;
      });

      // Keyboard Shortcuts
      window.addEventListener('keydown', (e) => {
        if (e.target && e.target.tagName === 'INPUT') return;

        if (e.code === 'Space') {
          e.preventDefault();
          if (settings.randomizeOnClick) {
            randomizeAll(true);
          } else {
            initSimulation();
          }
        } else if (e.key === 'r' || e.key === 'R') {
          resetCamera();
        } else if (e.key === 'p' || e.key === 'P') {
          settings.isPlaying = !settings.isPlaying;
          if (controllers.isPlaying) controllers.isPlaying.updateDisplay();
        }
      });
    }

    // ============================================================
    // lil-gui Interactive Controls Setup
    // ============================================================
    function initGUI() {
      gui = new lil.GUI({ title: 'Concentric Celestial Spores' });

      // 1. Color & Palette Folder (All 19 Schemes)
      const fColor = gui.addFolder('🎨 Color & Palette');
      controllers.colorScheme = fColor.add(settings, 'colorScheme', Object.keys(COLOR_SCHEMES))
        .name('Palette')
        .onChange((val) => {
          currentTheme = COLOR_SCHEMES[val];
          document.body.style.backgroundColor = currentTheme.bg;
        });

      controllers.strokeMode = fColor.add(settings, 'strokeMode', [
        'Dark Outline',
        'Palette Match',
        'Subtle Glow',
        'No Stroke'
      ]).name('Stroke Mode');

      controllers.strokeMultiplier = fColor.add(settings, 'strokeMultiplier', 0.2, 3.0, 0.05).name('Line Weight');

      // 2. Animation & Flow Folder
      const fAnim = gui.addFolder('🌀 Animation & Motion');
      controllers.animationStyle = fAnim.add(settings, 'animationStyle', [
        'Concentric Breathing',
        'Gyroscopic Eyes',
        'Chromatic Shimmer',
        'Living Coral Drift',
        'Hypnotic Spiral',
        'Static Fine Art'
      ]).name('Anim Style');

      controllers.animSpeed = fAnim.add(settings, 'animSpeed', 0.0, 3.0, 0.05).name('Anim Speed');
      controllers.isPlaying = fAnim.add(settings, 'isPlaying').name('Playing');
      controllers.pulseDepth = fAnim.add(settings, 'pulseDepth', 0.02, 0.35, 0.01).name('Pulse Depth');
      controllers.eccentricity = fAnim.add(settings, 'eccentricity', 0.0, 0.6, 0.02).name('Gyroscopic Orbit');
      controllers.driftAmount = fAnim.add(settings, 'driftAmount', 0.5, 12.0, 0.2).name('Drift Range');
      controllers.interactiveCursor = fAnim.add(settings, 'interactiveCursor').name('Cursor Reaction');

      // 3. Geometry & Packing Folder
      const fGeom = gui.addFolder('📐 Geometry & Circle Packing');
      controllers.layoutMode = fGeom.add(settings, 'layoutMode', ['Full Viewport', 'Classic 800x800'])
        .name('Layout Mode')
        .onChange(() => initSimulation());

      controllers.targetCount = fGeom.add(settings, 'targetCount', 1000, 10000, 200)
        .name('Circle Density')
        .onChange(() => initSimulation());

      controllers.maxRadius = fGeom.add(settings, 'maxRadius', 10.0, 35.0, 0.5)
        .name('Max Radius (rm)')
        .onChange(() => initSimulation());

      controllers.minRadius = fGeom.add(settings, 'minRadius', 0.4, 2.5, 0.1)
        .name('Min Radius')
        .onChange(() => initSimulation());

      controllers.gaussianSpread = fGeom.add(settings, 'gaussianSpread', 20.0, 200.0, 5.0)
        .name('Gaussian Jitter')
        .onChange(() => initSimulation());

      // 4. Viewport & Camera Interaction Folder
      const fView = gui.addFolder('🎥 Viewport & Camera');
      controllers.randomizeOnClick = fView.add(settings, 'randomizeOnClick').name('Click to Randomize');
      controllers.zoom = fView.add(settings, 'zoom', 0.2, 10.0, 0.05)
        .name('Zoom Level')
        .onChange((v) => { targetZoom = v; });
      controllers.panX = fView.add(settings, 'panX', -3000, 3000, 1)
        .name('Pan X')
        .onChange((v) => { targetPanX = v; });
      controllers.panY = fView.add(settings, 'panY', -3000, 3000, 1)
        .name('Pan Y')
        .onChange((v) => { targetPanY = v; });
      fView.add(settings, 'resetView').name('Reset Camera');

      // 5. Actions Folder
      const fActions = gui.addFolder('⚡ Actions');
      fActions.add(settings, 'regenerate').name('Regenerate');
      fActions.add(settings, 'randomizeScene').name('Randomize All');
      fActions.add(settings, 'saveImage').name('Export PNG');

      // Default folder open/closed states
      fColor.open();
      fAnim.open();
      fGeom.close();
      fView.close();
      fActions.open();
    }
  </script>
