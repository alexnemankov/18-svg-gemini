<!DOCTYPE html>
<html lang="en">
<head>

  <title>595 - Truchet Fluidity // Dynamic Wave Labyrinth</title>

  <!-- Styling: Glassmorphism UI, Responsive Viewport Lock & Fullscreen Canvas -->
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0a0a0a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      overflow: hidden;
      cursor: pointer;
    }

    canvas {
      display: block;
      width: 100vw !important;
      height: 100vh !important;
      pointer-events: auto;
    }

    /* Glassmorphism Heads-Up Display */
    #hud {
      position: fixed;
      bottom: 24px;
      left: 24px;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 7px;
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .hud-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hud-title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 0 0 16px rgba(255, 255, 255, 0.4), 0 2px 4px rgba(0, 0, 0, 0.8);
    }

    .hud-badge {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.2px;
      padding: 3px 9px;
      border-radius: 12px;
      background: rgba(255, 0, 127, 0.15);
      border: 1px solid rgba(255, 0, 127, 0.45);
      color: #ff3399;
      text-transform: uppercase;
      text-shadow: 0 0 8px rgba(255, 51, 153, 0.6);
    }

    .hud-meta {
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 1.1px;
      color: rgba(255, 255, 255, 0.65);
      display: flex;
      align-items: center;
      gap: 8px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
    }

    .hud-meta a {
      color: rgba(0, 240, 255, 0.95);
      text-decoration: none;
      pointer-events: auto;
      transition: color 0.2s ease, text-shadow 0.2s ease;
    }

    .hud-meta a:hover {
      color: #ffffff;
      text-shadow: 0 0 8px #00f0ff;
    }

    .hud-hints {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 3px;
      max-width: 620px;
    }

    .key-tag {
      background: rgba(14, 18, 28, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 3px 8px;
      border-radius: 5px;
      font-size: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: rgba(255, 255, 255, 0.85);
      letter-spacing: 0.4px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    .key-tag span {
      color: #00f0ff;
      font-weight: 700;
    }

    /* Floating Toast Notification for Procedural Re-rolls */
    #toast {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(-24px);
      background: rgba(12, 16, 26, 0.92);
      border: 1px solid rgba(0, 240, 255, 0.45);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7), 0 0 16px rgba(0, 240, 255, 0.25);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 9px 22px;
      border-radius: 30px;
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.8px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 9px;
      z-index: 1000;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #toast.toast-visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast-icon {
      font-size: 15px;
    }

    /* FPS & Tile Metric Monitor Badge */
    #fps-badge {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 10;
      font-size: 11px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: rgba(255, 255, 255, 0.8);
      background: rgba(12, 16, 26, 0.8);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 6px 14px;
      border-radius: 20px;
      pointer-events: none;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      gap: 8px;
      transition: opacity 0.3s ease;
    }

    #fps-badge .indicator {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #00ff88;
      box-shadow: 0 0 8px #00ff88;
    }

    /* Open UI Button (Visible when UI is toggled hidden) */
    #btn-open-ui {
      display: none;
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 999;
      background: rgba(14, 18, 28, 0.85);
      border: 1px solid rgba(0, 240, 255, 0.5);
      color: #00f0ff;
      padding: 7px 14px;
      font-family: ui-monospace, monospace;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 1px;
      border-radius: 20px;
      cursor: pointer;
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      transition: background 0.2s ease, transform 0.2s ease;
    }

    #btn-open-ui:hover {
      background: rgba(0, 240, 255, 0.2);
      transform: scale(1.04);
    }

    /* Custom Glassmorphic lil-gui Styling */
    .lil-gui.root {
      --background-color: rgba(12, 16, 26, 0.88);
      --text-color: #e2e8f0;
      --title-background-color: rgba(18, 24, 40, 0.95);
      --widget-color: rgba(28, 38, 60, 0.85);
      --hover-color: rgba(42, 58, 92, 0.9);
      --focus-color: rgba(0, 240, 255, 0.7);
      --number-color: #00f0ff;
      --string-color: #ffd166;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      --font-size: 11px;
      --folder-indent: 10px;

      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 100;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.65);
      max-height: calc(100vh - 36px);
      overflow-y: auto;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .lil-gui .title {
      font-weight: 700;
      letter-spacing: 0.6px;
    }

    /* Hidden UI State */
    body.hidden-ui #hud,
    body.hidden-ui .lil-gui.root,
    body.hidden-ui #fps-badge,
    body.hidden-ui #toast {
      opacity: 0 !important;
      transform: translateY(12px) !important;
      pointer-events: none !important;
    }

    body.hidden-ui #btn-open-ui {
      display: block;
    }
  </style>

<body>
  <div id="canvas-container"></div>
  <button id="btn-open-ui" onclick="toggleUI(true)">⚙️ SHOW CONTROLS (H)</button>

  <!-- Heads-Up Display -->
  <div id="hud">
    <div class="hud-header">
      <div class="hud-title">Truchet Fluidity</div>
      <div class="hud-badge">Wave Labyrinth</div>
    </div>
    <div class="hud-meta">
      <span>Dynamic Wave Modulation of Mathematical Truchet Arcs</span>
    </div>
    <div class="hud-hints">
      <div class="key-tag"><span>Click</span> Randomize Scene</div>
      <div class="key-tag"><span>Space</span> Pause/Play</div>
      <div class="key-tag"><span>R</span> Re-roll Variations</div>
      <div class="key-tag"><span>P</span> Next Palette</div>
      <div class="key-tag"><span>W</span> Wave Pattern</div>
      <div class="key-tag"><span>M</span> Toggle Click Mode</div>
      <div class="key-tag"><span>H</span> Toggle UI</div>
      <div class="key-tag"><span>F</span> Fullscreen</div>
      <div class="key-tag"><span>S</span> Snapshot</div>
    </div>
  </div>

  <!-- Floating Toast Notification -->
  <div id="toast">
    <span class="toast-icon">🎲</span>
    <span id="toast-text">Procedural Theme Loaded</span>
  </div>

  <!-- Real-Time Metrics Badge -->
  <div id="fps-badge">
    <div class="indicator"></div>
    <span id="fps-text">60 FPS</span>
    <span style="opacity: 0.35;">|</span>
    <span id="res-text">1920×1080</span>
    <span style="opacity: 0.35;">|</span>
    <span id="tile-text">1,200 Tiles</span>
  </div>

  <script>
    /**
     * TRUCHET FLUIDITY: Standalone Generative Art Engine
     * Seamlessly combines mathematical Truchet tiling with 7 automatic wave modulation algorithms,
     * 20 curated chromatic themes, procedural randomization on click, and hardware-accelerated 2D rendering.
     */

    // --- Curated Color Schemes (20 Designer Themes) ---
    const PALETTES = [
      { name: 'Tokyo Cyberpunk', a: '#0B0813', b: '#FF007F', accent: '#00F0FF', desc: 'Obsidian Night & Electric Magenta' },
      { name: 'Bauhaus Mono', a: '#0A0A0A', b: '#F5F5F0', accent: '#E63946', desc: 'Minimalist High-Contrast Black & Chalk' },
      { name: 'Solar Eclipse', a: '#140804', b: '#FFB703', accent: '#FB8500', desc: 'Coronal Dark & Radiant Sunburst Gold' },
      { name: 'Swiss Vermilion', a: '#F2EFE9', b: '#E63946', accent: '#1D3557', desc: 'Helvetica Cream & International Red' },
      { name: 'Nordic Frost', a: '#0A192F', b: '#64DFDF', accent: '#E0FAFF', desc: 'Arctic Fjord & Aurora Cyan' },
      { name: 'Matcha & Ink', a: '#131915', b: '#A7C957', accent: '#F2E8CF', desc: 'Japanese Sumi Carbon & Organic Green' },
      { name: 'Vaporwave 84', a: '#180B29', b: '#F72585', accent: '#4CC9F0', desc: 'Synthwave Twilight & Electric Neon' },
      { name: 'Deep Abyss', a: '#030E16', b: '#00F5D4', accent: '#7B2CBF', desc: 'Ocean Trench & Bioluminescent Cyan' },
      { name: 'Terracotta & Sage', a: '#F4ECE1', b: '#BC4749', accent: '#6A994E', desc: 'Sun-baked Clay & Botanical Sage' },
      { name: 'Ghost in Shell', a: '#080C0E', b: '#39FF14', accent: '#00E5FF', desc: 'Cyber Matrix & Phosphor Lime' },
      { name: 'Royal Velvet', a: '#190A28', b: '#E0AAFF', accent: '#FFD166', desc: 'Imperial Amethyst & Soft Lavender' },
      { name: 'Electric Coral', a: '#151518', b: '#FF5E7E', accent: '#FFAA00', desc: 'Volcanic Graphite & Sunset Coral' },
      { name: 'Cobalt Porcelain', a: '#F8F9FA', b: '#0047AB', accent: '#4361EE', desc: 'Ming White & Ultramarine Blue' },
      { name: 'Golden Obsidian', a: '#0D0D0D', b: '#D4AF37', accent: '#FFE8A3', desc: 'Polished Black Glass & 24K Gold' },
      { name: 'Lavender Haze', a: '#120F24', b: '#B5838D', accent: '#E5989B', desc: 'Midnight Mist & Velvet Mauve' },
      { name: 'Acid Modern', a: '#0B0B0C', b: '#CCFF00', accent: '#FFFFFF', desc: 'Matte Jet & High-Vis Acid Citron' },
      { name: 'Slate & Amber', a: '#1A2228', b: '#FFA62B', accent: '#16697A', desc: 'Anthracite & Molten Amber' },
      { name: 'Sakura Night', a: '#16121E', b: '#FFB3C6', accent: '#FB6F92', desc: 'Kyoto Sky & Cherry Blossom Petals' },
      { name: 'Bioluminescence', a: '#051622', b: '#1BA098', accent: '#DEB992', desc: 'Oceanic Hydrothermal Cyan' },
      { name: 'Blueprint CAD', a: '#0A1C2A', b: '#48CAE4', accent: '#90E0EF', desc: 'Engineering Drafting Indigo & Azure' }
    ];

    const WAVE_MODES = [
      'Ripples (Harmonic)',
      'Hypnotic Vortex',
      'Perlin Flow',
      'Quantum Shockwave',
      'Chladni Plate',
      'Radial Pulse',
      'Harmonic Orbits'
    ];

    const LAYOUT_MODES = [
      'Checkerboard Alternate',
      'Pure Stochastic',
      'Diagonal Bands',
      'Concentric Rings'
    ];

    // --- State and Simulation Parameters ---
    const params = {
      // Theme & Color
      paletteName: 'Tokyo Cyberpunk',
      invertColors: false,
      colorA: '#0B0813',
      colorB: '#FF007F',
      accentColor: '#00F0FF',
      enableGradientVignette: true,

      // Automatic Wave Animation
      waveMode: 'Ripples (Harmonic)',
      speed: 1.0,
      frequency: 1.0,
      contrast: 1.2,
      minRoundness: 0.0,
      maxRoundness: 0.5,
      invertWave: false,

      // Grid Geometry
      tileCols: 22,
      layoutMode: 'Checkerboard Alternate',
      showAccents: false,
      accentStyle: 'Dots',
      accentSize: 0.08,

      // Interaction & Randomization
      clickToRandomize: true,
      mouseInfluence: 0.3,
      paused: false,

      // Actions
      randomize: () => proceduralReRoll(true),
      nextPalette: () => cyclePalette(1),
      nextWaveMode: () => cycleWaveMode(1),
      togglePlay: () => { params.paused = !params.paused; },
      resetDefaults: () => resetToDefaults(),
      saveImage: () => captureSnapshot(),
      toggleFullscreen: () => toggleFullscreen()
    };

    // --- Engine Internal Variables ---
    let tileSize, cols, rows;
    let gridOffsetX, gridOffsetY;
    let tileGrid = [];
    let animTime = 0;
    let lastFrameTime = performance.now();
    let frameCountAccum = 0;
    let fpsTimer = 0;
    let clickRipples = []; // Active expanding shockwaves from user clicks
    let isUIHidden = false;
    let toastTimeout = null;
    let guiInstance = null;

    // --- Setup & Grid Initialization ---
    function setup() {
      const canvas = createCanvas(windowWidth, windowHeight);
      canvas.parent('canvas-container');
      pixelDensity(Math.min(window.devicePixelRatio || 1, 2));

      applyPalette(params.paletteName, false);
      buildGrid();
      initGUI();
      updateMetricsHUD();

      // Hook canvas pointer events directly for zero latency
      const container = document.getElementById('canvas-container');
      container.addEventListener('pointerdown', handleScenePointerDown);
    }

    function buildGrid() {
      // Fullscreen coverage calculation with zero black borders
      tileSize = Math.max(16, Math.floor(width / params.tileCols));
      cols = Math.ceil(width / tileSize) + 2;
      rows = Math.ceil(height / tileSize) + 2;

      gridOffsetX = Math.floor((width - (cols - 2) * tileSize) / 2) - tileSize;
      gridOffsetY = Math.floor((height - (rows - 2) * tileSize) / 2) - tileSize;

      tileGrid = [];
      const mode = params.layoutMode;
      const seedVal = Math.floor(random(1e8));
      randomSeed(seedVal);

      for (let r = 0; r < rows; r++) {
        tileGrid[r] = [];
        for (let c = 0; c < cols; c++) {
          let variant = 0;
          if (mode === 'Checkerboard Alternate') {
            const even = (c + r) % 2 === 0;
            variant = even ? random([0, 3]) : random([1, 2]);
          } else if (mode === 'Pure Stochastic') {
            variant = Math.floor(random(4));
          } else if (mode === 'Diagonal Bands') {
            const diag = (c - r + rows * 2) % 4;
            variant = diag === 0 ? 0 : (diag === 1 ? 1 : (diag === 2 ? 3 : 2));
          } else if (mode === 'Concentric Rings') {
            const distFromCenter = Math.floor(dist(c, r, cols / 2, rows / 2));
            variant = distFromCenter % 2 === 0 ? random([0, 3]) : random([1, 2]);
          }
          tileGrid[r][c] = variant;
        }
      }

      updateMetricsHUD();
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
      buildGrid();
    }

    // --- Main Render Loop ---
    function draw() {
      const now = performance.now();
      const dt = Math.min((now - lastFrameTime) / 1000, 0.1);
      lastFrameTime = now;

      if (!params.paused) {
        animTime += dt * params.speed * 2.5;
      }

      // Update click shockwave ripples
      for (let i = clickRipples.length - 1; i >= 0; i--) {
        clickRipples[i].radius += dt * 900;
        clickRipples[i].intensity -= dt * 1.4;
        if (clickRipples[i].intensity <= 0) {
          clickRipples.splice(i, 1);
        }
      }

      // Render Background & Optional Vignette
      const currentFillA = params.invertColors ? params.colorB : params.colorA;
      const currentFillB = params.invertColors ? params.colorA : params.colorB;

      const ctx = drawingContext;
      ctx.fillStyle = currentFillA;
      ctx.fillRect(0, 0, width, height);

      if (params.enableGradientVignette) {
        const cx = width * 0.5;
        const cy = height * 0.5;
        const maxR = Math.max(width, height) * 0.85;
        const vigGrad = ctx.createRadialGradient(cx, cy, maxR * 0.2, cx, cy, maxR);
        vigGrad.addColorStop(0, 'rgba(0,0,0,0)');
        vigGrad.addColorStop(1, 'rgba(0,0,0,0.42)');
        ctx.fillStyle = vigGrad;
        ctx.fillRect(0, 0, width, height);
      }

      // Render Truchet Grid
      const wMode = params.waveMode;
      const kFreq = (params.frequency * 8.0) / Math.min(width, height);
      const halfSize = tileSize * 0.5;
      const contrast = params.contrast;
      const minR = params.minRoundness * halfSize;
      const maxR = params.maxRoundness * halfSize;
      const invWave = params.invertWave;

      // Mouse interactive influence
      let mX = mouseX;
      let mY = mouseY;
      const isMouseActive = (params.mouseInfluence > 0.01) && (mX >= 0 && mX <= width && mY >= 0 && mY <= height);

      for (let r = 0; r < rows; r++) {
        const y = gridOffsetY + r * tileSize;
        // Viewport frustum culling
        if (y + tileSize < 0 || y > height) continue;

        for (let c = 0; c < cols; c++) {
          const x = gridOffsetX + c * tileSize;
          if (x + tileSize < 0 || x > width) continue;

          const centerX = x + halfSize;
          const centerY = y + halfSize;

          // 1. Calculate Base Wave Value in [0, 1]
          let wave = computeWaveValue(wMode, centerX, centerY, animTime, kFreq);

          // 2. Blend Mouse Ripple Attraction
          if (isMouseActive) {
            const dMouse = dist(centerX, centerY, mX, mY);
            const influenceRadius = tileSize * 7.5;
            if (dMouse < influenceRadius) {
              const falloff = Math.cos((dMouse / influenceRadius) * (Math.PI * 0.5));
              const mouseWave = Math.sin(dMouse * 0.05 - animTime * 4.0);
              wave = lerp(wave, 0.5 + 0.5 * mouseWave, falloff * params.mouseInfluence);
            }
          }

          // 3. Blend Expanding Click Ripples
          if (clickRipples.length > 0) {
            for (let i = 0; i < clickRipples.length; i++) {
              const rip = clickRipples[i];
              const dRip = dist(centerX, centerY, rip.x, rip.y);
              const ripDist = Math.abs(dRip - rip.radius);
              const waveBand = tileSize * 3.5;
              if (ripDist < waveBand) {
                const env = Math.cos((ripDist / waveBand) * (Math.PI * 0.5)) * rip.intensity;
                wave = Math.max(0, Math.min(1, wave + Math.sin(ripDist * 0.1) * env));
              }
            }
          }

          if (invWave) wave = 1.0 - wave;

          // 4. Apply Nonlinear Contrast & Dynamic Roundness
          if (contrast !== 1.0) {
            wave = (wave - 0.5) * contrast + 0.5;
            wave = Math.max(0, Math.min(1, wave));
          }

          const roundness = minR + wave * (maxR - minR);

          // 5. Render Individual Truchet Tile
          drawTruchetTileFast(ctx, tileGrid[r][c], x, y, tileSize, roundness, currentFillA, currentFillB);

          // 6. Optional Architectural Accents / Micro-Nodes
          if (params.showAccents) {
            drawAccent(ctx, x, y, tileSize, params.accentColor, params.accentStyle, params.accentSize);
          }
        }
      }

      // FPS & Diagnostic Monitoring
      frameCountAccum++;
      fpsTimer += dt;
      if (fpsTimer >= 0.5) {
        const currentFPS = Math.round(frameCountAccum / fpsTimer);
        document.getElementById('fps-text').textContent = `${currentFPS} FPS`;
        frameCountAccum = 0;
        fpsTimer = 0;
      }
    }

    // --- Automatic Wave Synthesis Algorithms ---
    function computeWaveValue(mode, x, y, t, k) {
      const cx = width * 0.5;
      const cy = height * 0.5;

      switch (mode) {
        case 'Ripples (Harmonic)': {
          // Three wandering harmonic emitters orbiting in Lissajous trajectories
          const e1x = cx + width * 0.32 * Math.sin(t * 0.85 + 0.4);
          const e1y = cy + height * 0.32 * Math.cos(t * 0.65);
          const e2x = cx + width * 0.36 * Math.cos(t * 0.55 + 2.2);
          const e2y = cy + height * 0.30 * Math.sin(t * 0.95 + 1.2);
          const e3x = cx + width * 0.25 * Math.sin(t * 1.2 + 3.8);
          const e3y = cy + height * 0.25 * Math.cos(t * 1.35 + 2.5);

          const d1 = dist(x, y, e1x, e1y);
          const d2 = dist(x, y, e2x, e2y);
          const d3 = dist(x, y, e3x, e3y);

          const w1 = Math.sin(d1 * k - t * 2.8);
          const w2 = Math.sin(d2 * k * 1.15 - t * 2.5);
          const w3 = Math.sin(d3 * k * 0.85 - t * 3.1);

          return 0.5 + 0.5 * ((w1 + w2 + w3) / 3.0);
        }

        case 'Hypnotic Vortex': {
          // Logarithmic & Archimedean rotating spiral wavefronts
          const dx = x - cx;
          const dy = y - cy;
          const r = Math.sqrt(dx * dx + dy * dy);
          const theta = Math.atan2(dy, dx);
          const spiralArms = 3.0;
          const val = Math.sin(spiralArms * theta + r * k * 1.2 - t * 3.0);
          return 0.5 + 0.5 * val;
        }

        case 'Perlin Flow': {
          // Multi-octave topological noise contour fields
          const s = k * 0.55;
          const n1 = noise(x * s + Math.cos(t * 0.35) * 0.6, y * s + Math.sin(t * 0.35) * 0.6, t * 0.45);
          const n2 = noise(x * s * 2.2 - t * 0.3, y * s * 2.2 + t * 0.3, t * 0.65);
          return Math.max(0, Math.min(1, n1 * 0.72 + n2 * 0.28));
        }

        case 'Quantum Shockwave': {
          // Dual orthogonal planar wave interference
          const ang = t * 0.12;
          const u = x * Math.cos(ang) + y * Math.sin(ang);
          const v = -x * Math.sin(ang) + y * Math.cos(ang);
          const w1 = Math.sin(u * k * 0.95 - t * 2.6);
          const w2 = Math.cos(v * k * 0.75 + t * 2.1);
          return 0.5 + 0.5 * (0.5 * w1 + 0.5 * w2);
        }

        case 'Chladni Plate': {
          // 2D Acoustic vibration nodal resonances
          const nx = Math.PI * (x - cx) / (width * 0.5);
          const ny = Math.PI * (y - cy) / (height * 0.5);
          const m = 3;
          const n = 2;
          const c1 = Math.sin(m * nx) * Math.cos(n * ny);
          const c2 = Math.cos(n * nx) * Math.sin(m * ny);
          const standingWave = c1 * Math.cos(t * 2.2) - c2 * Math.sin(t * 2.2);
          return 0.5 + 0.5 * (standingWave * 0.75);
        }

        case 'Radial Pulse': {
          // Expanding rhythmic heartbeat pulses
          const r = dist(x, y, cx, cy);
          const pulse = Math.sin(r * k * 1.1 - t * 3.5);
          return 0.5 + 0.5 * pulse;
        }

        case 'Harmonic Orbits': {
          // Gravitational dipole soliton wells
          const o1x = cx + width * 0.35 * Math.sin(t * 0.9);
          const o1y = cy + height * 0.25 * Math.cos(t * 1.2);
          const o2x = cx - width * 0.35 * Math.sin(t * 0.9);
          const o2y = cy - height * 0.25 * Math.cos(t * 1.2);

          const d1 = dist(x, y, o1x, o1y);
          const d2 = dist(x, y, o2x, o2y);
          const f1 = Math.cos(d1 * k * 0.9 - t * 2.5) / (1.0 + d1 * 0.003);
          const f2 = Math.cos(d2 * k * 0.9 + t * 2.5) / (1.0 + d2 * 0.003);

          return 0.5 + 0.5 * Math.max(-1, Math.min(1, (f1 + f2) * 0.75));
        }

        default:
          return 0.5;
      }
    }

    // --- High-Performance Truchet Tile Drawing ---
    function drawTruchetTileFast(ctx, variant, x, y, size, roundness, colA, colB) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(x, y, size, size);
      ctx.clip();

      const fillA = (variant === 0 || variant === 1) ? colA : colB;
      const fillB = (variant === 0 || variant === 1) ? colB : colA;

      // Base background square
      ctx.fillStyle = fillA;
      ctx.fillRect(x, y, size, size);

      // Morphing rounded quadrants
      ctx.fillStyle = fillB;
      if (variant === 0 || variant === 2) {
        fillRoundedRectCentered(ctx, x, y, size, size, roundness);
        fillRoundedRectCentered(ctx, x + size, y + size, size, size, roundness);
      } else {
        fillRoundedRectCentered(ctx, x + size, y, size, size, roundness);
        fillRoundedRectCentered(ctx, x, y + size, size, size, roundness);
      }

      ctx.restore();
    }

    // Centered rounded rectangle with seamless browser fallback
    function fillRoundedRectCentered(ctx, cx, cy, w, h, r) {
      const rx = cx - w * 0.5;
      const ry = cy - h * 0.5;
      ctx.beginPath();
      if (r <= 0.6) {
        ctx.rect(rx, ry, w, h);
      } else if (typeof ctx.roundRect === 'function') {
        ctx.roundRect(rx, ry, w, h, Math.min(r, w * 0.5));
      } else {
        const cr = Math.min(r, w * 0.5);
        ctx.moveTo(rx + cr, ry);
        ctx.arcTo(rx + w, ry, rx + w, ry + h, cr);
        ctx.arcTo(rx + w, ry + h, rx, ry + h, cr);
        ctx.arcTo(rx, ry + h, rx, ry, cr);
        ctx.arcTo(rx, ry, rx + w, ry, cr);
        ctx.closePath();
      }
      ctx.fill();
    }

    // Optional architectural micro-accents
    function drawAccent(ctx, x, y, size, color, style, relSize) {
      const radius = size * relSize;
      ctx.fillStyle = color;
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.5;

      const nodes = [
        [x, y],
        [x + size, y],
        [x, y + size],
        [x + size, y + size]
      ];

      for (let i = 0; i < nodes.length; i++) {
        const [nx, ny] = nodes[i];
        ctx.beginPath();
        if (style === 'Dots') {
          ctx.arc(nx, ny, radius, 0, Math.PI * 2);
          ctx.fill();
        } else if (style === 'Rings') {
          ctx.arc(nx, ny, radius, 0, Math.PI * 2);
          ctx.stroke();
        } else if (style === 'Crosses') {
          ctx.moveTo(nx - radius, ny);
          ctx.lineTo(nx + radius, ny);
          ctx.moveTo(nx, ny - radius);
          ctx.lineTo(nx, ny + radius);
          ctx.stroke();
        }
      }
    }

    // --- Interaction & Procedural Randomization ---
    function handleScenePointerDown(e) {
      // Ignore clicks when clicking on GUI or floating buttons
      if (e.target.closest('#hud') || e.target.closest('.lil-gui') || e.target.closest('#btn-open-ui')) {
        return;
      }

      const rect = e.currentTarget.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      // Always trigger an expanding visual shockwave
      clickRipples.push({
        x: clickX,
        y: clickY,
        radius: 0,
        intensity: 1.0
      });

      if (params.clickToRandomize) {
        proceduralReRoll(true);
      }
    }

    function proceduralReRoll(showToastNotice = true) {
      // 1. Pick a fresh palette
      let newPal;
      do {
        newPal = random(PALETTES);
      } while (newPal.name === params.paletteName && PALETTES.length > 1);
      applyPalette(newPal.name, false);

      // 2. Pick a fresh wave animation mode
      let newWave;
      do {
        newWave = random(WAVE_MODES);
      } while (newWave === params.waveMode && WAVE_MODES.length > 1);
      params.waveMode = newWave;

      // 3. Re-roll geometric and motion parameters
      params.speed = round(random(0.7, 2.2), 2);
      params.frequency = round(random(0.6, 2.2), 2);
      params.contrast = round(random(0.8, 2.4), 2);
      params.minRoundness = round(random([0.0, 0.05, 0.1]), 2);
      params.maxRoundness = round(random([0.4, 0.45, 0.5]), 2);
      params.invertWave = random() > 0.65;
      params.invertColors = random() > 0.7;

      // 4. Re-roll grid density & layout
      params.tileCols = Math.floor(random(14, 34));
      params.layoutMode = random(LAYOUT_MODES);

      // 5. Rebuild grid with new seed
      buildGrid();

      // 6. Refresh lil-gui controls
      syncGUIControllers();

      // 7. Surface visual notification
      if (showToastNotice) {
        showToast(`Theme: ${newPal.name} • ${params.waveMode} • ${params.tileCols} Cols`);
      }
    }

    function applyPalette(name, refreshGUI = true) {
      const pal = PALETTES.find(p => p.name === name) || PALETTES[0];
      params.paletteName = pal.name;
      params.colorA = pal.a;
      params.colorB = pal.b;
      params.accentColor = pal.accent;
      if (refreshGUI) syncGUIControllers();
    }

    function cyclePalette(dir = 1) {
      const idx = PALETTES.findIndex(p => p.name === params.paletteName);
      const nextIdx = (idx + dir + PALETTES.length) % PALETTES.length;
      applyPalette(PALETTES[nextIdx].name, true);
      showToast(`Palette: ${PALETTES[nextIdx].name} (${nextIdx + 1}/${PALETTES.length})`);
    }

    function cycleWaveMode(dir = 1) {
      const idx = WAVE_MODES.indexOf(params.waveMode);
      const nextIdx = (idx + dir + WAVE_MODES.length) % WAVE_MODES.length;
      params.waveMode = WAVE_MODES[nextIdx];
      syncGUIControllers();
      showToast(`Wave Mode: ${params.waveMode}`);
    }

    function resetToDefaults() {
      params.speed = 1.0;
      params.frequency = 1.0;
      params.contrast = 1.2;
      params.minRoundness = 0.0;
      params.maxRoundness = 0.5;
      params.invertWave = false;
      params.invertColors = false;
      params.tileCols = 22;
      params.layoutMode = 'Checkerboard Alternate';
      params.showAccents = false;
      params.mouseInfluence = 0.3;
      params.paused = false;
      applyPalette('Tokyo Cyberpunk', true);
      buildGrid();
      syncGUIControllers();
      showToast('Configuration Reset to Defaults');
    }

    function toggleUI(forceShow = false) {
      if (forceShow) {
        isUIHidden = false;
      } else {
        isUIHidden = !isUIHidden;
      }
      document.body.classList.toggle('hidden-ui', isUIHidden);
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    function captureSnapshot() {
      const dateStr = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
      saveCanvas(`Truchet-Fluidity-${params.paletteName.replace(/\s+/g, '_')}-${dateStr}`, 'png');
      showToast('📸 High-Resolution Screenshot Captured');
    }

    function showToast(text) {
      const toastEl = document.getElementById('toast');
      const textEl = document.getElementById('toast-text');
      textEl.textContent = text;
      toastEl.classList.add('toast-visible');

      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toastEl.classList.remove('toast-visible');
      }, 2400);
    }

    function updateMetricsHUD() {
      const resEl = document.getElementById('res-text');
      const tileEl = document.getElementById('tile-text');
      if (resEl) resEl.textContent = `${windowWidth}×${windowHeight}`;
      if (tileEl) tileEl.textContent = `${cols * rows} Tiles`;
    }

    // --- Lil-GUI Construction ---
    function initGUI() {
      if (typeof lil === 'undefined' || !lil.GUI) return;

      const gui = new lil.GUI({ title: 'Truchet Fluidity Controls' });
      guiInstance = gui;

      // Folder 1: Theme & Color
      const fTheme = gui.addFolder('🎨 Palette & Visuals');
      fTheme.add(params, 'paletteName', PALETTES.map(p => p.name)).name('Preset Theme').onChange(name => {
        applyPalette(name, true);
        showToast(`Theme: ${name}`);
      });
      fTheme.add(params, 'invertColors').name('Invert In/Out');
      fTheme.addColor(params, 'colorA').name('Color A (Fill)').listen();
      fTheme.addColor(params, 'colorB').name('Color B (Arcs)').listen();
      fTheme.addColor(params, 'accentColor').name('Accent Pin').listen();
      fTheme.add(params, 'enableGradientVignette').name('Depth Vignette');

      // Folder 2: Automatic Wave Dynamics
      const fWave = gui.addFolder('🌊 Automatic Wave Modulation');
      fWave.add(params, 'waveMode', WAVE_MODES).name('Wave Algorithm').listen().onChange(() => {
        showToast(`Wave Mode: ${params.waveMode}`);
      });
      fWave.add(params, 'speed', 0.1, 3.5, 0.05).name('Flow Speed').listen();
      fWave.add(params, 'frequency', 0.2, 3.0, 0.05).name('Spatial Freq').listen();
      fWave.add(params, 'contrast', 0.4, 3.0, 0.05).name('Wave Contrast').listen();
      fWave.add(params, 'minRoundness', 0.0, 0.5, 0.01).name('Min Radius').listen();
      fWave.add(params, 'maxRoundness', 0.1, 0.5, 0.01).name('Max Radius').listen();
      fWave.add(params, 'invertWave').name('Invert Wavefront').listen();

      // Folder 3: Grid Geometry & Accents
      const fGrid = gui.addFolder('📐 Geometry & Layout');
      fGrid.add(params, 'tileCols', 10, 48, 1).name('Grid Columns').listen().onChange(() => buildGrid());
      fGrid.add(params, 'layoutMode', LAYOUT_MODES).name('Tile Layout').listen().onChange(() => buildGrid());
      fGrid.add(params, 'showAccents').name('Node Pins');
      fGrid.add(params, 'accentStyle', ['Dots', 'Rings', 'Crosses']).name('Pin Style');
      fGrid.add(params, 'accentSize', 0.04, 0.2, 0.01).name('Pin Size');

      // Folder 4: Interaction & Settings
      const fInter = gui.addFolder('🖱️ Interaction & Behavior');
      fInter.add(params, 'clickToRandomize').name('Click Scene to Re-roll').listen();
      fInter.add(params, 'mouseInfluence', 0.0, 1.0, 0.05).name('Mouse Ripple Flux').listen();
      fInter.add(params, 'paused').name('Freeze Motion').listen();

      // Folder 5: Actions
      const fAct = gui.addFolder('⚡ Actions & Presets');
      fAct.add(params, 'randomize').name('🎲 Randomize Everything (R)');
      fAct.add(params, 'nextPalette').name('🎨 Next Palette (P)');
      fAct.add(params, 'nextWaveMode').name('🌊 Next Wave Pattern (W)');
      fAct.add(params, 'saveImage').name('📸 Save PNG Snapshot (S)');
      fAct.add(params, 'resetDefaults').name('🔄 Reset Defaults');
      fAct.add(params, 'toggleFullscreen').name('⛶ Toggle Fullscreen (F)');

      fTheme.open();
      fWave.open();
    }

    function syncGUIControllers() {
      if (!guiInstance) return;
      function updateFolder(folder) {
        if (!folder) return;
        folder.controllers.forEach(c => c.updateDisplay());
        folder.folders.forEach(f => updateFolder(f));
      }
      updateFolder(guiInstance);
    }

    // --- Keyboard Shortcuts ---
    window.addEventListener('keydown', (e) => {
      // Prevent shortcut interception if interacting with GUI text inputs
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;

      const key = e.key.toLowerCase();
      if (key === ' ') {
        e.preventDefault();
        params.paused = !params.paused;
        showToast(params.paused ? '⏸ Animation Paused' : '▶ Animation Resumed');
        syncGUIControllers();
      } else if (key === 'r') {
        proceduralReRoll(true);
      } else if (key === 'p') {
        cyclePalette(1);
      } else if (key === 'w') {
        cycleWaveMode(1);
      } else if (key === 'm') {
        params.clickToRandomize = !params.clickToRandomize;
        showToast(params.clickToRandomize ? '🎲 Click-to-Randomize: ON' : '🖱️ Click-to-Randomize: OFF (Ripples Only)');
        syncGUIControllers();
      } else if (key === 'h') {
        toggleUI();
      } else if (key === 'f') {
        toggleFullscreen();
      } else if (key === 's') {
        captureSnapshot();
      }
    });
  </script>
</body>
