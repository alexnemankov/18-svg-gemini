<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Type Garden — Botanical Typography Generator</title>
  <!-- Google Fonts: Playfair Display Bold (700) & DM Mono (400, 500) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --bg-paper: #F7F4EE;
      --bg-elevated: rgba(239, 234, 224, 0.82);
      --ink-primary: #181816;
      --ink-muted: #6E6A63;
      --ink-faint: #B8B2A6;
      --border-hairline: #DDD6C7;
      --stem-deep: #2D4C39;
      --rose-crimson: #C83E4D;
      --vignette-inner: rgba(255, 253, 249, 0.35);
      --vignette-outer: rgba(226, 219, 205, 0.45);
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-paper);
      color: var(--ink-primary);
      font-family: 'DM Mono', monospace;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.45s ease, color 0.45s ease;
    }

    /* Subtle warm radial vignette over the archival paper */
    .paper-atmosphere {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 48%, var(--vignette-inner) 0%, var(--vignette-outer) 100%);
      z-index: 1;
      transition: background 0.45s ease;
    }

    #garden-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 2;
      cursor: text;
    }

    /* HUD Glass Pill Styling */
    .hud-pill {
      background: var(--bg-elevated);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--border-hairline);
      color: var(--ink-muted);
      transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .hud-btn {
      background: var(--bg-elevated);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--border-hairline);
      color: var(--ink-primary);
      transition: all 0.18s ease;
      cursor: pointer;
    }

    .hud-btn:hover {
      background: rgba(180, 172, 158, 0.25);
      border-color: var(--ink-faint);
      transform: translateY(-1px);
    }

    .hud-btn:active {
      transform: translateY(0);
    }

    .swatch-dot {
      width: 10px;
      height: 10px;
      border-radius: 9999px;
      display: inline-block;
      border: 1px solid rgba(0, 0, 0, 0.15);
      transition: transform 0.2s ease;
    }

    .keycap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(128, 124, 116, 0.12);
      border: 1px solid var(--border-hairline);
      color: var(--ink-primary);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.06em;
      line-height: 1.2;
      transition: background 0.15s ease, transform 0.12s ease, color 0.2s ease;
    }

    .keycap.active-flash {
      background: var(--rose-crimson);
      color: #FFFDF9;
      border-color: var(--rose-crimson);
      transform: scale(1.08);
    }

    /* Hidden input for mobile virtual keyboard support */
    #mobile-proxy-input {
      position: fixed;
      opacity: 0;
      pointer-events: none;
      left: -9999px;
      top: 50%;
    }

    @keyframes pulse-gentle {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 0.9; }
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 9999px;
      background-color: var(--stem-deep);
      animation: pulse-gentle 2.8s infinite ease-in-out;
    }
  </style>
</head>
<body>
  <div class="paper-atmosphere"></div>

  <!-- Hidden proxy input so tapping on mobile or tablet opens keyboard -->
  <input id="mobile-proxy-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Type into the garden" />

  <!-- Primary Generative Canvas -->
  <canvas id="garden-canvas"></canvas>

  <!-- Top Bar HUD -->
  <header class="fixed top-0 left-0 right-0 z-10 flex items-center justify-between px-4 py-3.5 sm:px-7 sm:py-5 pointer-events-none">
    <!-- Left Brand & Live Garden Telemetry -->
    <div class="flex items-center gap-3 pointer-events-auto">
      <div class="hud-pill px-3.5 py-1.5 rounded-full flex items-center gap-2.5 shadow-sm">
        <span class="status-dot" id="garden-status-dot"></span>
        <span class="text-[11px] font-medium tracking-[0.08em] uppercase" style="color: var(--ink-primary);">Type Garden</span>
        <span style="color: var(--ink-faint);">·</span>
        <span id="telemetry-readout" class="text-[11px] tracking-[0.04em]" style="color: var(--ink-muted); font-variant-numeric: tabular-nums;">
          GARDENS 1 · BLOOMS 0
        </span>
      </div>

      <!-- Transient Action Toast (e.g., "STEMS CUT", "WITHERING", "CLEARED") -->
      <div id="action-badge" class="hud-pill px-3 py-1 rounded-full text-[10px] tracking-[0.08em] uppercase opacity-0 transition-opacity duration-300">
        READY
      </div>
    </div>

    <!-- Right Studio Actions -->
    <div class="flex items-center gap-2 pointer-events-auto flex-wrap justify-end">
      <button id="palette-btn" type="button" class="hud-btn px-3 py-1.5 rounded-full text-[11px] tracking-[0.06em] uppercase flex items-center gap-2 shadow-sm" title="Switch botanical color palette (or press Tab)">
        <span class="flex items-center -space-x-1" id="palette-swatches">
          <span class="swatch-dot" id="swatch-1"></span>
          <span class="swatch-dot" id="swatch-2"></span>
          <span class="swatch-dot" id="swatch-3"></span>
        </span>
        <span id="palette-label" class="font-medium">TUDOR ROSE</span>
      </button>
      <button id="toggle-ink-btn" type="button" class="hud-btn px-3 py-1.5 rounded-full text-[11px] tracking-[0.06em] uppercase flex items-center gap-1.5 shadow-sm" title="Cycle letter visibility">
        <span style="color: var(--ink-muted);">INK:</span>
        <span id="ink-mode-label" class="font-medium">FULL</span>
      </button>
      <button id="export-btn" type="button" class="hud-btn px-3.5 py-1.5 rounded-full text-[11px] tracking-[0.06em] uppercase font-medium shadow-sm" title="Save PNG snapshot of your Type Garden">
        EXPORT PNG
      </button>
    </div>
  </header>

  <!-- Bottom Control Bar Legend -->
  <footer class="fixed bottom-0 left-0 right-0 z-10 flex flex-col items-center justify-center px-4 pb-4 sm:pb-6 pointer-events-none">
    <div class="hud-pill px-4 py-2 rounded-full shadow-sm flex flex-wrap items-center justify-center gap-x-4 gap-y-1.5 pointer-events-auto text-[11px] tracking-[0.05em]">
      <div class="flex items-center gap-1.5">
        <span id="key-type" class="keycap">A–Z</span>
        <span>SPROUT</span>
      </div>
      <span style="color: var(--border-hairline);" class="hidden sm:inline">|</span>
      <button id="btn-space" type="button" class="flex items-center gap-1.5 transition-colors cursor-pointer" title="Cut stems so the next word grows a new garden">
        <span id="key-space" class="keycap">SPACE</span>
        <span>CUT STEMS</span>
      </button>
      <span style="color: var(--border-hairline);" class="hidden sm:inline">|</span>
      <button id="btn-backspace" type="button" class="flex items-center gap-1.5 transition-colors cursor-pointer" title="Wither the last letter and its roses">
        <span id="key-backspace" class="keycap">⌫</span>
        <span>WITHER</span>
      </button>
      <span style="color: var(--border-hairline);" class="hidden sm:inline">|</span>
      <button id="btn-enter" type="button" class="flex items-center gap-1.5 transition-colors cursor-pointer" title="Clear the garden">
        <span id="key-enter" class="keycap">ENTER</span>
        <span>CLEAR</span>
      </button>
      <span style="color: var(--border-hairline);" class="hidden sm:inline">|</span>
      <button id="btn-tab-palette" type="button" class="flex items-center gap-1.5 transition-colors cursor-pointer" title="Cycle botanical palette">
        <span id="key-tab" class="keycap">TAB</span>
        <span>PALETTE</span>
      </button>
    </div>
  </footer>

  <script>

          ],

        },
        {

          hudBorder: '#DFCFC2',

          inkFaint: '#BAA8A2',

          stemMid: '#4F423B',
          stemLight: '#6E6256',
          leafDark: '#3B4F3B',
          leafLight: '#587054',
          leafVein: '#8CA384',
          thorn: '#4A302C',
          swatches: ['#E06C78', '#F7B7C0', '#4F423B'],
          roseSets: [
            { deep: '#6B1D29', guard: '#AD394B', mid: '#DE6879', inner: '#F59FAD', blush: '#FFE3E8', stamen: '#E8A84E' },
            { deep: '#732624', guard: '#BA4741', mid: '#E3776F', inner: '#F7ADA6', blush: '#FFE8E5', stamen: '#DE9B43' },
            { deep: '#5E1929', guard: '#962E45', mid: '#C75870', inner: '#EB91A4', blush: '#FADCE3', stamen: '#EAB057' },
            { deep: '#75333B', guard: '#B55B65', mid: '#DE8A94', inner: '#F5BDC4', blush: '#FFF2F4', stamen: '#D98E3B' }
          ],
          witherStem: '#786862',
          witherLeaf: '#8A7970',
          witherPetalOuter: '#7A5255',
          witherPetalInner: '#B08B8E',
          witherInk: '#9E8E8A'
        }
      ];

      let currentPaletteIndex = 0;
      let PALETTE = PALETTES[0];

      // --- DOM Elements ---
      const canvas = document.getElementById('garden-canvas');
      const ctx = canvas.getContext('2d');
      const telemetryReadout = document.getElementById('telemetry-readout');
      const actionBadge = document.getElementById('action-badge');
      const toggleInkBtn = document.getElementById('toggle-ink-btn');
      const inkModeLabel = document.getElementById('ink-mode-label');
      const exportBtn = document.getElementById('export-btn');
      const paletteBtn = document.getElementById('palette-btn');
      const paletteLabel = document.getElementById('palette-label');
      const mobileInput = document.getElementById('mobile-proxy-input');

      function applyPaletteTheme(index) {
        currentPaletteIndex = (index + PALETTES.length) % PALETTES.length;
        PALETTE = PALETTES[currentPaletteIndex];

        const root = document.documentElement;
        root.style.setProperty('--bg-paper', PALETTE.paper);
        root.style.setProperty('--bg-elevated', PALETTE.hudBg);
        root.style.setProperty('--ink-primary', PALETTE.ink);
        root.style.setProperty('--ink-muted', PALETTE.inkMuted);
        root.style.setProperty('--ink-faint', PALETTE.inkFaint);
        root.style.setProperty('--border-hairline', PALETTE.hudBorder);
        root.style.setProperty('--stem-deep', PALETTE.stemMid);
        root.style.setProperty('--rose-crimson', PALETTE.roseSets[0].mid);
        root.style.setProperty('--vignette-inner', PALETTE.vignetteInner);
        root.style.setProperty('--vignette-outer', PALETTE.vignetteOuter);

        paletteLabel.textContent = PALETTE.name;
        document.getElementById('swatch-1').style.backgroundColor = PALETTE.swatches[0];
        document.getElementById('swatch-2').style.backgroundColor = PALETTE.swatches[1];
        document.getElementById('swatch-3').style.backgroundColor = PALETTE.swatches[2];
      }

      // Offscreen canvas for sampling Playfair Display Bold glyph contours
      const sampleCanvas = document.createElement('canvas');
      const sampleCtx = sampleCanvas.getContext('2d', { willReadFrequently: true });
      sampleCanvas.width = 260;
      sampleCanvas.height = 260;

      // Offscreen paper grain pattern canvas
      const grainCanvas = document.createElement('canvas');
      grainCanvas.width = 180;
      grainCanvas.height = 180;
      let grainPattern = null;

      // --- Math & Organic Noise Helpers ---
      const TAU = Math.PI * 2;
      const rand = (min = 0, max = 1) => min + Math.random() * (max - min);
      const randInt = (min, max) => Math.floor(rand(min, max + 1));
      const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
      const lerp = (a, b, t) => a + (b - a) * t;

      // Hex color interpolation for smooth withering transitions
      function lerpColor(hexA, hexB, t) {
        const u = clamp(t, 0, 1);
        const a = parseInt(hexA.slice(1), 16);
        const b = parseInt(hexB.slice(1), 16);
        const rA = (a >> 16) & 255, gA = (a >> 8) & 255, bA = a & 255;
        const rB = (b >> 16) & 255, gB = (b >> 8) & 255, bB = b & 255;
        const r = Math.round(lerp(rA, rB, u));
        const g = Math.round(lerp(gA, gB, u));
        const bl = Math.round(lerp(bA, bB, u));
        return `rgb(${r}, ${g}, ${bl})`;
      }

      // Smooth pseudo-noise for wind and stem curvature
      function organicNoise(x, y, z = 0) {
        return (
          Math.sin(x * 1.27 + z * 0.93) * 0.45 +
          Math.cos(y * 1.63 - z * 1.15) * 0.35 +
          Math.sin((x + y) * 0.89 + z * 1.7) * 0.2
        );
      }

      // Generate subtle archival paper texture once
      function initPaperGrain() {
        const gCtx = grainCanvas.getContext('2d');
        const img = gCtx.createImageData(grainCanvas.width, grainCanvas.height);
        const data = img.data;
        for (let i = 0; i < data.length; i += 4) {
          const v = randInt(0, 1) ? 24 : 230;
          data[i] = v;
          data[i + 1] = v - 5;
          data[i + 2] = v - 12;
          data[i + 3] = randInt(2, 7); // Very delicate alpha
        }
        gCtx.putImageData(img, 0, 0);
        grainPattern = ctx.createPattern(grainCanvas, 'repeat');
      }

      // --- Application State ---
      const state = {
        width: window.innerWidth,
        height: window.innerHeight,
        dpr: Math.min(window.devicePixelRatio || 1, 2),
        time: 0,
        inkModeIndex: 0, // 0: FULL, 1: GHOST, 2: BOTANICAL ONLY
        inkModes: ['FULL', 'GHOST', 'FLORA ONLY'],
        // Sequence of typed tokens: either { type: 'letter', ... } or { type: 'cut', ... }
        tokens: [],
        // Withered letters that are still animating their fall/decay before removal
        dyingLetters: [],
        // Detached falling petals & leaves during Backspace / Enter
        fallingParticles: [],
        // Visual scissor/cut sparks when Space cuts the stems
        cutEffects: [],
        // Current garden ID counter (increments on every Space stem-cut)
        currentGardenId: 1,
        fontReady: false,
        introTimer: null
      };

      // Cache of sampled glyph anchor points by character
      const glyphCache = new Map();

      /**
       * Renders a character onto an offscreen canvas in Playfair Display Bold
       * and extracts top, mid-body, and side contour points so stems and roses
       * nestle into and around the letterforms instead of only sprouting off the top.
       */
      function sampleGlyphContours(char) {
        if (glyphCache.has(char)) {
          return glyphCache.get(char);
        }

        const size = 160;
        const w = sampleCanvas.width;
        const h = sampleCanvas.height;
        sampleCtx.clearRect(0, 0, w, h);

        sampleCtx.fillStyle = '#000000';
        sampleCtx.font = `700 ${size}px "Playfair Display", Georgia, serif`;
        sampleCtx.textAlign = 'center';
        sampleCtx.textBaseline = 'alphabetic';

        const metrics = sampleCtx.measureText(char);
        const charWidth = Math.max(metrics.width, size * 0.28);

        const cx = w / 2;
        const baselineY = h * 0.72;
        sampleCtx.fillText(char, cx, baselineY);

        const imgData = sampleCtx.getImageData(0, 0, w, h).data;
        const topAnchors = [];
        const edgeAnchors = [];
        const sideLeftAnchors = [];
        const sideRightAnchors = [];
        const bodyAnchors = [];

        const step = 3;
        for (let y = 10; y < h - 10; y += step) {
          for (let x = 10; x < w - 10; x += step) {
            const idx = (y * w + x) * 4 + 3;
            if (imgData[idx] > 140) {
              const upIdx = ((y - step) * w + x) * 4 + 3;
              const downIdx = ((y + step) * w + x) * 4 + 3;
              const leftIdx = (y * w + (x - step)) * 4 + 3;
              const rightIdx = (y * w + (x + step)) * 4 + 3;

              // Normalized coordinates relative to glyph center and baseline
              const nx = (x - cx) / size;
              const ny = (y - baselineY) / size;

              // Interior stroke points where blooms can nestle right on the letter
              if (imgData[upIdx] > 140 && imgData[downIdx] > 140 && (x + y) % 9 === 0) {
                bodyAnchors.push({ nx, ny });
              }

              // Upper edge of strokes/serifs
              if (imgData[upIdx] <= 140) {
                topAnchors.push({ nx, ny, angleBias: -Math.PI / 2 + rand(-0.45, 0.45) });
                edgeAnchors.push({ nx, ny });
              }
              // Leftward edge
              if (imgData[leftIdx] <= 140) {
                sideLeftAnchors.push({ nx, ny, angleBias: Math.PI + rand(-0.45, 0.45) });
                edgeAnchors.push({ nx, ny });
              }
              // Rightward edge
              if (imgData[rightIdx] <= 140) {
                sideRightAnchors.push({ nx, ny, angleBias: rand(-0.45, 0.45) });
                edgeAnchors.push({ nx, ny });
              }
              // Bottom edge
              if (imgData[downIdx] <= 140) {
                edgeAnchors.push({ nx, ny });
              }
            }
          }
        }

        // Fallback if punctuation or very thin glyph
        if (topAnchors.length === 0) {
          topAnchors.push({ nx: 0, ny: -0.35, angleBias: -Math.PI / 2 });
        }
        if (sideLeftAnchors.length === 0) {
          sideLeftAnchors.push({ nx: -0.15, ny: -0.25, angleBias: Math.PI });
        }
        if (sideRightAnchors.length === 0) {
          sideRightAnchors.push({ nx: 0.15, ny: -0.25, angleBias: 0 });
        }
        if (bodyAnchors.length === 0) {
          bodyAnchors.push(...topAnchors);
        }

        const result = {
          charWidthRatio: charWidth / size,
          topAnchors,
          edgeAnchors,
          sideLeftAnchors,
          sideRightAnchors,
          bodyAnchors
        };

        glyphCache.set(char, result);
        return result;
      }

      /**
       * Sculptural Botanical Rose that blooms with Fibonacci spiral phyllotaxis,
       * ruffled outer guard petals, cupped inner whorls, and warm golden anthers.
       */
      class RoseBloom {
        constructor(options = {}) {
          this.maxRadius = options.maxRadius || rand(16, 28);
          this.paletteSlot = randInt(0, 3);
          this.isSideBud = Boolean(options.isSideBud);
          this.bloomProgress = 0;
          this.bloomSpeed = rand(0.024, 0.042);
          this.rotation = rand(0, TAU);
          this.swayPhase = rand(0, TAU);
          this.witherAmount = 0;
          this.detached = false;

          // Subtle 3D perspective tilt so every flower doesn't stare dead-flat
          this.tiltScaleY = rand(0.82, 0.98);
          this.cupOffsetX = rand(-0.12, 0.12);
          this.cupOffsetY = rand(-0.14, 0.06);

          // Generate organic golden-angle spiral petals (outer -> mid -> inner heart)
          this.petals = [];
          const goldenAngle = 2.399963229728653; // 137.508 degrees in radians
          const totalPetals = this.isSideBud ? 9 : 21;

          for (let i = 0; i < totalPetals; i++) {
            // u = 0 is outer guard petal, u = 1 is tight inner core
            const u = i / (totalPetals - 1);
            const invU = 1 - u;

            let layer = 'mid';
            if (u < 0.28) layer = 'deep';
            else if (u < 0.55) layer = 'guard';
            else if (u < 0.82) layer = 'mid';
            else layer = 'inner';

            this.petals.push({
              angle: i * goldenAngle + rand(-0.09, 0.09),
              distRatio: Math.pow(invU, 0.85) * 0.62,
              widthRatio: lerp(0.32, 0.88, Math.pow(invU, 0.7)) * rand(0.92, 1.08),
              lengthRatio: lerp(0.28, 0.78, Math.pow(invU, 0.75)) * rand(0.92, 1.08),
              cupCurve: rand(-0.18, 0.18),
              notchDepth: u < 0.5 ? rand(0.04, 0.11) : 0,
              layer,
              openThreshold: u * 0.32
            });
          }

          // Delicate golden stamen dots peeking around the inner rose heart
          this.stamens = [];
          const stamenCount = this.isSideBud ? 5 : 11;
          for (let i = 0; i < stamenCount; i++) {
            const a = (i / stamenCount) * TAU + rand(-0.2, 0.2);
            this.stamens.push({
              angle: a,
              distRatio: rand(0.08, 0.21),
              size: rand(0.9, 1.6)
            });
          }
        }

        get palette() {
          return PALETTE.roseSets[this.paletteSlot % PALETTE.roseSets.length];
        }

        update(parentGrowth, parentWither) {
          // Begin blooming earlier (at 45% stem growth) so flowers feel lush and immediate
          if (parentGrowth > 0.45 && parentWither === 0) {
            this.bloomProgress = clamp(this.bloomProgress + this.bloomSpeed, 0, 1);
          }
          if (parentWither > 0) {
            this.witherAmount = clamp(parentWither * 1.15, 0, 1);
          }
        }

        draw(ctx, x, y, stemAngle, time) {
          if (this.bloomProgress <= 0.01 || this.detached) return;

          const pal = this.palette;
          const t = this.bloomProgress;
          const easeOut = 1 - Math.pow(1 - t, 3);
          const witherScale = 1 - this.witherAmount * 0.25;
          const r = this.maxRadius * easeOut * witherScale;
          const windRot = Math.sin(time * 1.7 + this.swayPhase) * 0.06;

          ctx.save();
          ctx.translate(x, y + this.witherAmount * 9);

          // Soft ambient drop shadow beneath the bloom so it sits above the typography & foliage
          if (easeOut > 0.3) {
            ctx.fillStyle = 'rgba(18, 16, 14, 0.12)';
            ctx.beginPath();
            ctx.arc(1.5, 3, r * 0.82, 0, TAU);
            ctx.fill();
          }

          ctx.rotate(stemAngle + Math.PI / 2 + this.rotation + windRot);
          ctx.scale(1, this.tiltScaleY);

          // 1. Pointed Botanical Sepals (Calyx) peeking from beneath the bloom
          const sepalColor = lerpColor(PALETTE.leafDark, PALETTE.witherStem, this.witherAmount);
          ctx.fillStyle = sepalColor;
          const sepalCount = this.isSideBud ? 3 : 5;
          for (let i = 0; i < sepalCount; i++) {
            const sAngle = (i * TAU) / sepalCount + 0.25;
            ctx.save();
            ctx.rotate(sAngle);
            ctx.beginPath();
            ctx.moveTo(-r * 0.14, 0);
            ctx.quadraticCurveTo(-r * 0.22, -r * 0.65, 0, -r * 1.16);
            ctx.quadraticCurveTo(r * 0.22, -r * 0.65, r * 0.14, 0);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
          }

          // 2. Sculpted Spiral Rose Petals (drawn outside-in so inner cupped whorls nestle inside)
          for (let i = 0; i < this.petals.length; i++) {
            const p = this.petals[i];
            const localT = clamp((easeOut - p.openThreshold) / (1 - p.openThreshold), 0, 1);
            if (localT <= 0) continue;

            const dist = r * p.distRatio * localT;
            const pw = r * p.widthRatio * (0.45 + 0.55 * localT);
            const pl = r * p.lengthRatio * (0.45 + 0.55 * localT);

            let baseHex = pal.mid;
            let shadowHex = pal.deep;
            let rimHex = pal.inner;

            if (p.layer === 'deep') {
              baseHex = pal.guard;
              shadowHex = pal.deep;
              rimHex = pal.mid;
            } else if (p.layer === 'guard') {
              baseHex = pal.mid;
              shadowHex = pal.guard;
              rimHex = pal.inner;
            } else if (p.layer === 'mid') {
              baseHex = pal.inner;
              shadowHex = pal.mid;
              rimHex = pal.blush;
            } else {
              baseHex = pal.blush;
              shadowHex = pal.inner;
              rimHex = '#FFFFFF';
            }

            const targetWither = (p.layer === 'deep' || p.layer === 'guard')
              ? PALETTE.witherPetalOuter
              : PALETTE.witherPetalInner;

            const fillMain = lerpColor(baseHex, targetWither, this.witherAmount);
            const fillBase = lerpColor(shadowHex, PALETTE.witherPetalOuter, this.witherAmount);
            const lipStroke = lerpColor(rimHex, PALETTE.witherPetalInner, this.witherAmount);

            ctx.save();
            // Slight perspective shift toward the rose heart
            ctx.translate(r * this.cupOffsetX * (1 - p.distRatio), r * this.cupOffsetY * (1 - p.distRatio));
            ctx.rotate(p.angle);
            ctx.translate(0, -dist);

            // Organic velvety gradient from shadowed petal base to sunlit outer rim
            const grad = ctx.createLinearGradient(0, pl * 0.35, 0, -pl * 0.9);
            grad.addColorStop(0, fillBase);
            grad.addColorStop(0.55, fillMain);
            grad.addColorStop(1, lipStroke);

            // Ruffled, cupped rose petal silhouette
            ctx.beginPath();
            ctx.moveTo(0, pl * 0.32);
            // Left belly curve up to outer left lobe
            ctx.bezierCurveTo(
              -pw * (0.85 + p.cupCurve), pl * 0.12,
              -pw * 0.95, -pl * 0.68,
              -pw * 0.28, -pl * 0.88
            );
            // Subtle cleft/ruffle along top edge of petal
            ctx.quadraticCurveTo(0, -pl * (0.82 - p.notchDepth), pw * 0.28, -pl * 0.88);
            // Right outer lobe down to petal base
            ctx.bezierCurveTo(
              pw * 0.95, -pl * 0.68,
              pw * (0.85 - p.cupCurve), pl * 0.12,
              0, pl * 0.32
            );
            ctx.closePath();

            ctx.fillStyle = grad;
            ctx.fill();

            // Delicate sunlit highlight only along the upper curled lip of the petal
            ctx.beginPath();
            ctx.moveTo(-pw * 0.68, -pl * 0.46);
            ctx.quadraticCurveTo(-pw * 0.32, -pl * 0.9, -pw * 0.12, -pl * 0.85);
            ctx.quadraticCurveTo(0, -pl * (0.80 - p.notchDepth), pw * 0.12, -pl * 0.85);
            ctx.quadraticCurveTo(pw * 0.32, -pl * 0.9, pw * 0.68, -pl * 0.46);
            ctx.strokeStyle = lipStroke;
            ctx.globalAlpha = 0.55 * (1 - this.witherAmount * 0.6);
            ctx.lineWidth = 0.75;
            ctx.stroke();

            ctx.restore();
          }

          // 3. Glowing Rose Heart & Golden Stamen Anthers
          if (easeOut > 0.45) {
            const heartX = r * this.cupOffsetX;
            const heartY = r * this.cupOffsetY;
            ctx.save();
            ctx.translate(heartX, heartY);

            // Warm shadow recess in the very center
            const coreR = r * 0.19;
            const coreGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, coreR * 1.4);
            coreGrad.addColorStop(0, lerpColor(pal.deep, PALETTE.witherPetalOuter, this.witherAmount));
            coreGrad.addColorStop(0.65, lerpColor(pal.mid, PALETTE.witherPetalOuter, this.witherAmount));
            coreGrad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = coreGrad;
            ctx.beginPath();
            ctx.arc(0, 0, coreR * 1.4, 0, TAU);
            ctx.fill();

            // Golden stamen filaments & anther dots
            const stamenCol = lerpColor(pal.stamen, PALETTE.witherStem, this.witherAmount);
            ctx.fillStyle = stamenCol;
            ctx.strokeStyle = stamenCol;
            ctx.lineWidth = 0.55;

            for (const st of this.stamens) {
              const sd = r * st.distRatio * easeOut;
              const sx = Math.cos(st.angle) * sd;
              const sy = Math.sin(st.angle) * sd;

              ctx.globalAlpha = 0.45;
              ctx.beginPath();
              ctx.moveTo(0, 0);
              ctx.lineTo(sx, sy);
              ctx.stroke();

              ctx.globalAlpha = 0.92;
              ctx.beginPath();
              ctx.arc(sx, sy, st.size * easeOut, 0, TAU);
              ctx.fill();
            }

            // Tightly furled inner petal comma-swirl
            ctx.globalAlpha = 0.85;
            ctx.strokeStyle = lerpColor(pal.blush, PALETTE.witherPetalInner, this.witherAmount);
            ctx.lineWidth = 1.0;
            ctx.beginPath();
            ctx.arc(0, 0, coreR * 0.52, 0.2, Math.PI * 1.55);
            ctx.stroke();

            ctx.restore();
          }

          ctx.restore();
        }
      }

      /**
       * Organic Stem growing out of a letter contour or bridging between letters in the same word.
       * Engineered to hug and weave around the letters rather than shooting excessively tall.
       */
      class BotanicalStem {
        constructor(options) {
          this.anchorNx = options.anchorNx;
          this.anchorNy = options.anchorNy;
          this.isBridge = Boolean(options.isBridge);
          this.targetAnchor = options.targetAnchor || null;

          this.growth = 0;
          this.growthSpeed = options.growthSpeed || rand(0.022, 0.038);
          this.baseThickness = options.baseThickness || rand(2.0, 3.1);
          this.tipThickness = options.tipThickness || 0.75;

          this.nodes = [];
          this.leaves = [];
          this.thorns = [];
          this.tendril = null;
          this.rose = null;

          this.swaySeed = rand(0, 100);
          this.buildGeometry(options);
        }

        buildGeometry(options) {
          // Shorter, fuller stem segments so blooms stay intimately woven with the letters
          const totalSegments = this.isBridge
            ? 18
            : (options.stemLengthSegments || randInt(9, 16));

          if (this.isBridge && this.targetAnchor) {
            const startX = this.anchorNx;
            const startY = this.anchorNy;
            const endX = this.targetAnchor.nx;
            const endY = this.targetAnchor.ny;
            const midX = (startX + endX) * 0.5;
            const archY = Math.min(startY, endY) + rand(-0.18, 0.14);

            for (let i = 0; i <= totalSegments; i++) {
              const t = i / totalSegments;
              const inv = 1 - t;
              const bx = inv * inv * startX + 2 * inv * t * midX + t * t * endX;
              const by = inv * inv * startY + 2 * inv * t * archY + t * t * endY + Math.sin(t * Math.PI * 2) * 0.022;
              this.nodes.push({ nx: bx, ny: by });
            }
          } else {
            let cx = this.anchorNx;
            let cy = this.anchorNy;
            let angle = options.initialAngle !== undefined ? options.initialAngle : -Math.PI / 2 + rand(-0.85, 0.85);
            // Compact step length keeps the garden balanced and wide rather than towering
            const segLen = options.segLen || rand(0.018, 0.031);
            const curveBias = rand(-0.12, 0.12);
            const noiseSeed = rand(0, 50);
            const targetAngle = options.targetAngle !== undefined ? options.targetAngle : -Math.PI / 2 + rand(-0.55, 0.55);

            this.nodes.push({ nx: cx, ny: cy });

            for (let i = 1; i <= totalSegments; i++) {
              const angleDiff = Math.atan2(Math.sin(targetAngle - angle), Math.cos(targetAngle - angle));
              angle += angleDiff * 0.11 + curveBias + organicNoise(i * 0.3, noiseSeed) * 0.16;

              cx += Math.cos(angle) * segLen;
              cy += Math.sin(angle) * segLen;
              this.nodes.push({ nx: cx, ny: cy });
            }
          }

          // Attach lush paired & alternating botanical leaves along the stem
          const leafStep = Math.max(3, Math.floor(this.nodes.length / 4));
          for (let i = 2; i < this.nodes.length - 2; i += leafStep) {
            const side = (i % 2 === 0 ? 1 : -1);
            this.leaves.push({
              nodeIndex: i,
              side,
              sizeRatio: rand(0.10, 0.165),
              angleOffset: side * rand(0.55, 1.05)
            });
            // Occasional opposite paired leaflet
            if (Math.random() < 0.45) {
              this.leaves.push({
                nodeIndex: i,
                side: -side,
                sizeRatio: rand(0.075, 0.125),
                angleOffset: -side * rand(0.6, 1.0)
              });
            }
          }

          // Attach subtle rose thorns
          for (let i = 2; i < this.nodes.length - 2; i += randInt(3, 5)) {
            this.thorns.push({
              nodeIndex: i,
              side: i % 2 === 0 ? 1 : -1,
              sizeRatio: rand(0.025, 0.038)
            });
          }

          // Curling botanical tendril
          if (!this.isBridge && this.nodes.length > 10 && Math.random() < 0.5) {
            const branchIdx = Math.floor(this.nodes.length * rand(0.4, 0.68));
            this.tendril = {
              nodeIndex: branchIdx,
              side: Math.random() < 0.5 ? 1 : -1,
              lengthRatio: rand(0.14, 0.22)
            };
          }

          // Rose bloom at apex
          if (options.hasRose !== false) {
            this.rose = new RoseBloom({
              maxRadius: options.roseSize || rand(16, 26),
              isSideBud: options.isSideBud || false
            });
          }
        }

        update(witherProgress) {
          if (witherProgress === 0 && this.growth < 1) {
            this.growth = clamp(this.growth + this.growthSpeed, 0, 1);
          }
          if (this.rose) {
            this.rose.update(this.growth, witherProgress);
          }
        }

        /**
         * Renders the stem, thorns, leaves, curling tendrils, and rose bloom in screen coordinates.
         */
        draw(ctx, originX, originY, fontSize, time, witherProgress, prevOriginX, prevOriginY) {
          if (this.growth <= 0.01) return;

          const total = this.nodes.length - 1;
          const exactIdx = this.growth * total;
          const maxWholeIdx = Math.floor(exactIdx);
          const frac = exactIdx - maxWholeIdx;

          // Compute screen-space coordinates for grown nodes with wind sway & wither droop
          const screenPts = [];
          for (let i = 0; i <= maxWholeIdx; i++) {
            screenPts.push(this.getNodeScreenPoint(i, total, originX, originY, fontSize, time, witherProgress, prevOriginX, prevOriginY));
          }
          if (maxWholeIdx < total && frac > 0) {
            const pA = this.getNodeScreenPoint(maxWholeIdx, total, originX, originY, fontSize, time, witherProgress, prevOriginX, prevOriginY);
            const pB = this.getNodeScreenPoint(maxWholeIdx + 1, total, originX, originY, fontSize, time, witherProgress, prevOriginX, prevOriginY);
            screenPts.push({
              x: lerp(pA.x, pB.x, frac),
              y: lerp(pA.y, pB.y, frac)
            });
          }

          if (screenPts.length < 2) return;

          const stemDarkCol = lerpColor(PALETTE.stemDark, PALETTE.witherStem, witherProgress);
          const stemLightCol = lerpColor(PALETTE.stemMid, PALETTE.witherStem, witherProgress);

          // 1. Draw Thorns first
          ctx.fillStyle = lerpColor(PALETTE.thorn, PALETTE.witherStem, witherProgress);
          for (const thorn of this.thorns) {
            if (thorn.nodeIndex >= screenPts.length - 1) continue;
            const pt = screenPts[thorn.nodeIndex];
            const nextPt = screenPts[thorn.nodeIndex + 1];
            const ang = Math.atan2(nextPt.y - pt.y, nextPt.x - pt.x);
            const tSize = fontSize * thorn.sizeRatio * clamp((this.growth - thorn.nodeIndex / total) * 3, 0, 1);

            ctx.save();
            ctx.translate(pt.x, pt.y);
            ctx.rotate(ang + thorn.side * (Math.PI / 2));
            ctx.beginPath();
            ctx.moveTo(-tSize * 0.35, 0);
            ctx.quadraticCurveTo(0, -tSize * 0.9, tSize * 0.25, -tSize * 1.15);
            ctx.quadraticCurveTo(tSize * 0.15, -tSize * 0.3, tSize * 0.35, 0);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
          }

          // 2. Draw Tapering Stem Segments
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          for (let i = 0; i < screenPts.length - 1; i++) {
            const segT = i / total;
            const p0 = screenPts[i];
            const p1 = screenPts[i + 1];

            ctx.beginPath();
            ctx.moveTo(p0.x, p0.y);
            ctx.lineTo(p1.x, p1.y);
            ctx.lineWidth = lerp(this.baseThickness, this.tipThickness, segT);
            ctx.strokeStyle = i < total * 0.45 ? stemDarkCol : stemLightCol;
            ctx.stroke();
          }

          // 3. Draw Curling Tendril
          if (this.tendril && this.tendril.nodeIndex < screenPts.length - 1) {
            const tNode = this.tendril.nodeIndex;
            const localGrowth = clamp((this.growth - tNode / total) * 2.4, 0, 1);
            if (localGrowth > 0.05) {
              const pt = screenPts[tNode];
              const nextPt = screenPts[tNode + 1];
              const baseAng = Math.atan2(nextPt.y - pt.y, nextPt.x - pt.x);
              this.drawTendril(ctx, pt.x, pt.y, baseAng, this.tendril.side, fontSize * this.tendril.lengthRatio, localGrowth, stemLightCol);
            }
          }

          // 4. Draw Paired Botanical Leaves
          for (const leaf of this.leaves) {
            if (leaf.nodeIndex >= screenPts.length - 1) continue;
            const localGrowth = clamp((this.growth - leaf.nodeIndex / total) * 2.5, 0, 1);
            if (localGrowth <= 0.02) continue;

            const pt = screenPts[leaf.nodeIndex];
            const nextPt = screenPts[leaf.nodeIndex + 1];
            const stemAng = Math.atan2(nextPt.y - pt.y, nextPt.x - pt.x);
            const leafLen = fontSize * leaf.sizeRatio * localGrowth * (1 - witherProgress * 0.2);

            this.drawLeaf(
              ctx,
              pt.x,
              pt.y,
              stemAng + leaf.angleOffset + witherProgress * 0.45 * leaf.side,
              leafLen,
              witherProgress
            );
          }

          // 5. Draw Rose Bud or Unfurling Rose Bloom at Stem Tip
          const tipPt = screenPts[screenPts.length - 1];
          const prevPt = screenPts[Math.max(0, screenPts.length - 2)];
          const tipAngle = Math.atan2(tipPt.y - prevPt.y, tipPt.x - prevPt.x);

          if (this.rose) {
            // Draw small closed green/crimson bud while stem is still growing (< 0.72)
            if (this.growth > 0.25 && this.rose.bloomProgress < 0.35) {
              const budSize = clamp((this.growth - 0.25) * 2, 0, 1) * 5.5;
              ctx.save();
              ctx.translate(tipPt.x, tipPt.y);
              ctx.rotate(tipAngle + Math.PI / 2);
              ctx.fillStyle = lerpColor(this.rose.palette.guard, PALETTE.witherPetalOuter, witherProgress);
              ctx.beginPath();
              ctx.ellipse(0, -budSize * 0.5, budSize * 0.65, budSize, 0, 0, TAU);
              ctx.fill();
              ctx.restore();
            }

            this.rose.draw(ctx, tipPt.x, tipPt.y, tipAngle, time);
          }
        }

        getNodeScreenPoint(index, total, originX, originY, fontSize, time, witherProgress, prevOriginX, prevOriginY) {
          const node = this.nodes[index];
          const t = index / total;

          // If this is a bridge vine between two letters, blend origin from current letter to previous letter
          let baseX = originX + node.nx * fontSize;
          let baseY = originY + node.ny * fontSize;

          if (this.isBridge && prevOriginX !== undefined && prevOriginY !== undefined) {
            const startScreenX = originX + this.anchorNx * fontSize;
            const startScreenY = originY + this.anchorNy * fontSize;
            const endScreenX = prevOriginX + this.targetAnchor.nx * fontSize;
            const endScreenY = prevOriginY + this.targetAnchor.ny * fontSize;
            const archOffset = Math.sin(t * Math.PI) * (-fontSize * 0.16);

            baseX = lerp(startScreenX, endScreenX, t);
            baseY = lerp(startScreenY, endScreenY, t) + archOffset;
          }

          // Ambient breeze sway (stronger toward the stem tip)
          const swayAmp = Math.pow(t, 1.4) * (fontSize * 0.045);
          const windX = Math.sin(time * 1.65 + this.swaySeed + t * 2.2) * swayAmp;
          const windY = Math.cos(time * 1.35 + this.swaySeed + t * 1.8) * (swayAmp * 0.4);

          // Gravitational droop when withering via Backspace
          const droopY = Math.pow(t, 1.6) * witherProgress * (fontSize * 0.36);
          const shrinkX = (baseX - originX) * (witherProgress * 0.12);

          return {
            x: baseX + windX - shrinkX,
            y: baseY + windY + droopY
          };
        }

        drawLeaf(ctx, x, y, angle, length, witherProgress) {
          const width = length * 0.46;
          const darkHalfCol = lerpColor(PALETTE.leafDark, PALETTE.witherLeaf, witherProgress);
          const lightHalfCol = lerpColor(PALETTE.leafLight, PALETTE.witherLeaf, witherProgress);
          const veinCol = lerpColor(PALETTE.leafVein, PALETTE.witherStem, witherProgress);

          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(angle);

          // Upper half of leaflet (sunlit tone)
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.bezierCurveTo(length * 0.28, -width, length * 0.74, -width * 0.85, length, 0);
          ctx.closePath();
          ctx.fillStyle = lightHalfCol;
          ctx.fill();

          // Lower half of leaflet (shaded tone for botanical depth)
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.bezierCurveTo(length * 0.28, width, length * 0.74, width * 0.85, length, 0);
          ctx.closePath();
          ctx.fillStyle = darkHalfCol;
          ctx.fill();

          // Central midrib & delicate lateral veins
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(length * 0.92, 0);
          // 2 pairs of tiny lateral veins
          ctx.moveTo(length * 0.35, 0);
          ctx.lineTo(length * 0.52, -width * 0.45);
          ctx.moveTo(length * 0.35, 0);
          ctx.lineTo(length * 0.52, width * 0.45);
          ctx.moveTo(length * 0.6, 0);
          ctx.lineTo(length * 0.74, -width * 0.35);
          ctx.moveTo(length * 0.6, 0);
          ctx.lineTo(length * 0.74, width * 0.35);

          ctx.strokeStyle = veinCol;
          ctx.lineWidth = 0.65;
          ctx.stroke();

          ctx.restore();
        }

        drawTendril(ctx, x, y, baseAngle, side, maxLen, growth, strokeColor) {
          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(baseAngle + side * 0.6);

          ctx.beginPath();
          const steps = Math.floor(22 * growth);
          for (let i = 0; i <= steps; i++) {
            const u = i / 22;
            const spiralAngle = u * Math.PI * 3.2 * side;
            const radius = (1 - u * 0.65) * (maxLen * 0.28);
            const tx = u * maxLen * 0.72 + Math.cos(spiralAngle) * radius * u;
            const ty = Math.sin(spiralAngle) * radius * u;
            if (i === 0) ctx.moveTo(tx, ty);
            else ctx.lineTo(tx, ty);
          }
          ctx.strokeStyle = strokeColor;
          ctx.lineWidth = 0.9;
          ctx.stroke();
          ctx.restore();
        }
      }

      /**
       * Represents a single typed character in Playfair Display Bold along with
       * its sprouting stems, inter-letter garden vine, and rose blooms.
       */
      class BotanicalLetter {
        constructor(char, gardenId, prevLetterInSameGarden) {
          this.type = 'letter';
          this.char = char;
          this.gardenId = gardenId;
          this.contour = sampleGlyphContours(char);

          // Layout coordinates (smoothly interpolated when typing/wrapping)
          this.x = state.width / 2;
          this.y = state.height / 2;
          this.targetX = this.x;
          this.targetY = this.y;
          this.layoutInitialized = false;

          // Lifecycle states
          this.appearProgress = 0;
          this.witherProgress = 0;
          this.isWithering = false;
          this.petalsShed = false;

          // Botanical children
          this.stems = [];
          this.prevLetterRef = prevLetterInSameGarden || null;

          this.spawnBotanicals();
        }

        spawnBotanicals() {
          const { topAnchors, sideLeftAnchors, sideRightAnchors, edgeAnchors, bodyAnchors } = this.contour;

          // 1. Intimate "Nestled" Hero Rose that blooms right against the letter stroke/serif
          const bodyAnchor = bodyAnchors[randInt(0, bodyAnchors.length - 1)] || topAnchors[0];
          this.stems.push(
            new BotanicalStem({
              anchorNx: bodyAnchor.nx,
              anchorNy: bodyAnchor.ny,
              initialAngle: -Math.PI / 2 + rand(-0.9, 0.9),
              targetAngle: -Math.PI / 2 + rand(-0.7, 0.7),
              stemLengthSegments: randInt(5, 8),
              segLen: rand(0.012, 0.02),
              baseThickness: rand(2.2, 3.0),
              growthSpeed: rand(0.025, 0.04),
              hasRose: true,
              roseSize: rand(19, 28)
            })
          );

          // 2. Crown / Arching Stems (1 to 2 medium-height stems that frame the letter gracefully)
          const numCrownStems = randInt(1, 2);
          for (let i = 0; i < numCrownStems; i++) {
            const pool = i === 0 ? topAnchors : edgeAnchors;
            const anchor = pool[randInt(0, pool.length - 1)] || { nx: 0, ny: -0.35 };
            const spreadDir = i === 0 ? rand(-0.55, 0.55) : (Math.random() < 0.5 ? -1 : 1) * rand(0.45, 0.95);

            this.stems.push(
              new BotanicalStem({
                anchorNx: anchor.nx,
                anchorNy: anchor.ny,
                initialAngle: -Math.PI / 2 + spreadDir,
                targetAngle: -Math.PI / 2 + spreadDir * 0.75,
                stemLengthSegments: randInt(10, 15),
                segLen: rand(0.019, 0.028),
                baseThickness: rand(2.2, 3.1),
                growthSpeed: rand(0.02, 0.032),
                hasRose: true,
                roseSize: rand(16, 24)
              })
            );
          }

          // 3. Lateral / Outward-Weaving Shoot with a delicate side-bud or secondary blossom
          const sidePool = Math.random() < 0.5 ? sideLeftAnchors : sideRightAnchors;
          const sideAnchor = sidePool[randInt(0, sidePool.length - 1)];
          if (sideAnchor) {
            const isLeft = sidePool === sideLeftAnchors;
            const outAngle = isLeft ? -Math.PI * 0.78 + rand(-0.25, 0.25) : -Math.PI * 0.22 + rand(-0.25, 0.25);
            this.stems.push(
              new BotanicalStem({
                anchorNx: sideAnchor.nx,
                anchorNy: sideAnchor.ny,
                initialAngle: outAngle,
                targetAngle: outAngle + (isLeft ? 0.25 : -0.25),
                stemLengthSegments: randInt(8, 12),
                segLen: rand(0.016, 0.024),
                baseThickness: rand(1.6, 2.2),
                growthSpeed: rand(0.024, 0.038),
                hasRose: true,
                isSideBud: Math.random() < 0.55,
                roseSize: rand(12, 17)
              })
            );
          }

          // 4. Connecting Garden Vine to the previous letter (if not separated by Space!)
          if (this.prevLetterRef) {
            const startPool = this.contour.sideLeftAnchors;
            const targetPool = this.prevLetterRef.contour.sideRightAnchors;
            const startAnchor = startPool[randInt(0, startPool.length - 1)] || { nx: -0.15, ny: -0.25 };
            const targetAnchor = targetPool[randInt(0, targetPool.length - 1)] || { nx: 0.15, ny: -0.25 };

            this.stems.push(
              new BotanicalStem({
                anchorNx: startAnchor.nx,
                anchorNy: startAnchor.ny,
                isBridge: true,
                targetAnchor,
                baseThickness: 2.1,
                tipThickness: 1.5,
                growthSpeed: 0.038,
                hasRose: Math.random() < 0.5,
                isSideBud: true,
                roseSize: rand(12, 17)
              })
            );
          }
        }

        triggerWither(fontSize) {
          if (this.isWithering) return;
          this.isWithering = true;

          // Release fluttering petals & leaves from blooms into the air
          for (const stem of this.stems) {
            if (stem.rose && stem.rose.bloomProgress > 0.25) {
              const lastNode = stem.nodes[stem.nodes.length - 1];
              const rx = this.x + lastNode.nx * fontSize;
              const ry = this.y + lastNode.ny * fontSize;
              const petalCount = randInt(5, 9);

              for (let i = 0; i < petalCount; i++) {
                state.fallingParticles.push({
                  x: rx + rand(-10, 10),
                  y: ry + rand(-10, 10),
                  vx: rand(-1.2, 1.2),
                  vy: rand(0.6, 2.1),
                  size: rand(5, 10),
                  rotation: rand(0, TAU),
                  vRot: rand(-0.06, 0.06),
                  swayPhase: rand(0, TAU),
                  color: i % 2 === 0 ? stem.rose.palette.mid : stem.rose.palette.guard,
                  alpha: 1,
                  decay: rand(0.009, 0.017),
                  isLeaf: false
                });
              }
            }
          }
        }

        update(fontSize) {
          // Smooth positional spring toward target typographic layout
          if (!this.layoutInitialized) {
            this.x = this.targetX;
            this.y = this.targetY;
            this.layoutInitialized = true;
          } else {
            this.x = lerp(this.x, this.targetX, 0.18);
            this.y = lerp(this.y, this.targetY, 0.18);
          }

          if (this.appearProgress < 1 && !this.isWithering) {
            this.appearProgress = clamp(this.appearProgress + 0.08, 0, 1);
          }

          if (this.isWithering) {
            this.witherProgress = clamp(this.witherProgress + 0.028, 0, 1);
          }

          for (const stem of this.stems) {
            stem.update(this.witherProgress);
          }
        }

        drawGlyph(ctx, fontSize) {
          if (state.inkModeIndex === 2) return; // FLORA ONLY mode hides glyph ink

          const baseAlpha = state.inkModeIndex === 1 ? 0.18 : 1.0;
          const alpha = baseAlpha * this.appearProgress * (1 - Math.pow(this.witherProgress, 1.5));
          if (alpha <= 0.01) return;

          ctx.save();
          ctx.font = `700 ${fontSize}px "Playfair Display", Georgia, serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'alphabetic';

          const scale = 0.88 + 0.12 * this.appearProgress - 0.08 * this.witherProgress;
          ctx.translate(this.x, this.y + this.witherProgress * 12);
          ctx.scale(scale, scale);

          ctx.fillStyle = lerpColor(PALETTE.ink, PALETTE.witherInk, this.witherProgress);
          ctx.globalAlpha = alpha;
          ctx.fillText(this.char, 0, 0);
          ctx.restore();
        }

        drawBotanicals(ctx, fontSize, time) {
          const alpha = 1 - Math.pow(this.witherProgress, 2.2);
          if (alpha <= 0.01) return;

          ctx.save();
          ctx.globalAlpha = alpha;

          const prevX = this.prevLetterRef ? this.prevLetterRef.x : undefined;
          const prevY = this.prevLetterRef ? this.prevLetterRef.y : undefined;

          for (const stem of this.stems) {
            stem.draw(ctx, this.x, this.y, fontSize, time, this.witherProgress, prevX, prevY);
          }

          ctx.restore();
        }
      }

      /**
       * Dynamically lays out all active letters and garden breaks ("Space" cuts)
       * so the composition stays balanced and centered across any screen size.
       */
      function computeLayout() {
        const activeTokens = state.tokens;
        const letterCount = activeTokens.filter(t => t.type === 'letter').length;

        // Scale Playfair Display Bold size gracefully based on viewport and character count
        const minDim = Math.min(state.width, state.height);
        let baseFontSize = clamp(minDim * 0.17, 64, 152);
        if (letterCount > 18) {
          baseFontSize *= clamp(1 - (letterCount - 18) * 0.018, 0.52, 1);
        } else if (letterCount > 9) {
          baseFontSize *= clamp(1 - (letterCount - 9) * 0.02, 0.72, 1);
        }

        const tracking = baseFontSize * 0.04;
        const spaceGapWidth = baseFontSize * 0.46;
        const maxLineWidth = Math.max(state.width * 0.78, 280);
        const lineHeight = baseFontSize * 1.38;

        // Group tokens into words (separated by 'cut' space tokens or explicit linebreaks)
        const lines = [[]];
        let currentLineWidth = 0;

        // Build words so words don't split awkwardly mid-garden unless wider than screen
        const words = [];
        let currentWord = [];
        for (const token of activeTokens) {
          if (token.type === 'cut') {
            if (currentWord.length > 0) {
              words.push({ type: 'word', letters: currentWord });
              currentWord = [];
            }
            words.push({ type: 'cut', token });
          } else {
            currentWord.push(token);
          }
        }
        if (currentWord.length > 0) {
          words.push({ type: 'word', letters: currentWord });
        }

        for (const item of words) {
          if (item.type === 'cut') {
            lines[lines.length - 1].push({ type: 'cut', width: spaceGapWidth, token: item.token });
            currentLineWidth += spaceGapWidth;
          } else {
            let wordWidth = 0;
            for (const ltr of item.letters) {
              wordWidth += ltr.contour.charWidthRatio * baseFontSize + tracking;
            }
            if (currentLineWidth > 0 && currentLineWidth + wordWidth > maxLineWidth) {
              lines.push([]);
              currentLineWidth = 0;
            }
            for (const ltr of item.letters) {
              const w = ltr.contour.charWidthRatio * baseFontSize + tracking;
              lines[lines.length - 1].push({ type: 'letter', width: w, letter: ltr });
              currentLineWidth += w;
            }
          }
        }

        // Assign centered targetX and targetY to every letter
        const totalBlockHeight = (lines.length - 1) * lineHeight;
        // Balanced vertical baseline so the compact, intertwined bouquet sits centered in the frame
        const startBaselineY = state.height * 0.54 - totalBlockHeight * 0.45;

        lines.forEach((lineItems, lineIdx) => {
          const lineWidth = lineItems.reduce((sum, it) => sum + it.width, 0);
          let cursorX = (state.width - lineWidth) / 2;
          const baselineY = startBaselineY + lineIdx * lineHeight;

          for (const item of lineItems) {
            if (item.type === 'letter') {
              item.letter.targetX = cursorX + item.width / 2;
              item.letter.targetY = baselineY;
              // Prevent bridge vines from stretching across wrapped lines
              if (item.letter.prevLetterRef && Math.abs(item.letter.prevLetterRef.targetY - baselineY) > 10) {
                item.letter.prevLetterRef = null;
              }
            } else if (item.type === 'cut') {
              item.token.x = cursorX + item.width / 2;
              item.token.y = baselineY - baseFontSize * 0.32;
            }
            cursorX += item.width;
          }
        });

        return baseFontSize;
      }

      function flashKeycap(id) {
        const el = document.getElementById(id);
        if (!el) return;
        el.classList.add('active-flash');
        setTimeout(() => el.classList.remove('active-flash'), 160);
      }

      let badgeTimeout = null;
      function showActionBadge(text) {
        actionBadge.textContent = text;
        actionBadge.style.opacity = '1';
        clearTimeout(badgeTimeout);
        badgeTimeout = setTimeout(() => {
          actionBadge.style.opacity = '0';
        }, 1200);
      }

      function updateTelemetry() {
        const letters = state.tokens.filter(t => t.type === 'letter');
        const gardenIds = new Set(letters.map(l => l.gardenId));
        const gardenCount = Math.max(gardenIds.size, letters.length > 0 ? 1 : 0);

        let bloomCount = 0;
        for (const ltr of letters) {
          for (const s of ltr.stems) {
            if (s.rose) bloomCount++;
          }
        }

        telemetryReadout.textContent = `GARDENS ${gardenCount} · BLOOMS ${bloomCount}`;
      }

      /**
       * 1. Type Character -> Sprout stems & roses out of Playfair Display Bold
       */
      function addCharacter(char) {
        if (state.tokens.length >= 64) {
          showActionBadge('GARDEN FULL · PRESS ENTER');
          return;
        }

        // Check if the immediately preceding token is a letter in the same garden
        const lastToken = state.tokens[state.tokens.length - 1];
        const prevLetter = lastToken && lastToken.type === 'letter' ? lastToken : null;

        const letter = new BotanicalLetter(char, state.currentGardenId, prevLetter);
        state.tokens.push(letter);
        computeLayout();
        updateTelemetry();
        flashKeycap('key-type');
      }

      /**
       * 2. Space -> Cuts the stems so the next word grows a new garden
       */
      function cutStemsForNewGarden() {
        const lastToken = state.tokens[state.tokens.length - 1];
        if (!lastToken || lastToken.type === 'cut') return;

        state.currentGardenId += 1;
        const cutToken = {
          type: 'cut',
          gardenId: state.currentGardenId,
          x: lastToken.x + 30,
          y: lastToken.y - 30
        };
        state.tokens.push(cutToken);
        computeLayout();

        // Spawn a subtle botanical shear / snipping visual effect at the cut point
        state.cutEffects.push({
          x: cutToken.x,
          y: cutToken.y,
          progress: 0
        });

        // Also drop 2 tiny clipped green stem/leaf snippets
        for (let i = 0; i < 3; i++) {
          state.fallingParticles.push({
            x: cutToken.x + rand(-6, 6),
            y: cutToken.y + rand(-8, 8),
            vx: rand(-1.4, 1.4),
            vy: rand(-0.8, 1.2),
            size: rand(4, 7),
            rotation: rand(0, TAU),
            vRot: rand(-0.08, 0.08),
            swayPhase: rand(0, TAU),
            color: PALETTE.stemMid,
            alpha: 0.9,
            decay: 0.02,
            isLeaf: true
          });
        }

        showActionBadge('STEMS CUT · NEW GARDEN');
        flashKeycap('key-space');
        updateTelemetry();
      }

      /**
       * 3. Backspace -> Withers the last letter and its stems/roses
       */
      function witherLastToken() {
        // Remove trailing space-cuts first if any
        while (state.tokens.length > 0 && state.tokens[state.tokens.length - 1].type === 'cut') {
          state.tokens.pop();
        }

        if (state.tokens.length === 0) return;

        const popped = state.tokens.pop();
        if (popped && popped.type === 'letter') {
          const currentFontSize = computeLayout();
          popped.triggerWither(currentFontSize);
          state.dyingLetters.push(popped);
          showActionBadge('WITHERING');
          flashKeycap('key-backspace');
          updateTelemetry();
        }
      }

      /**
       * 4. Enter -> Clears the entire canvas with a sweeping petal release
       */
      function clearGarden() {
        if (state.tokens.length === 0 && state.dyingLetters.length === 0) return;

        const currentFontSize = computeLayout();
        for (const token of state.tokens) {
          if (token.type === 'letter') {
            token.triggerWither(currentFontSize);
            state.dyingLetters.push(token);
          }
        }
        state.tokens = [];
        state.currentGardenId = 1;

        showActionBadge('GARDEN CLEARED');
        flashKeycap('key-enter');
        updateTelemetry();
      }

      function updateAndDrawParticles(ctx, time) {
        // 1. Update & Draw Falling Petals & Leaves
        for (let i = state.fallingParticles.length - 1; i >= 0; i--) {
          const p = state.fallingParticles[i];
          p.x += p.vx + Math.sin(time * 2.5 + p.swayPhase) * 0.55;
          p.y += p.vy;
          p.vy += 0.018; // gentle gravity
          p.rotation += p.vRot;
          p.alpha -= p.decay;

          if (p.alpha <= 0 || p.y > state.height + 40) {
            state.fallingParticles.splice(i, 1);
            continue;
          }

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rotation);
          ctx.globalAlpha = clamp(p.alpha, 0, 1);
          ctx.fillStyle = p.color;

          ctx.beginPath();
          if (p.isLeaf) {
            ctx.ellipse(0, 0, p.size, p.size * 0.42, 0, 0, TAU);
          } else {
            // Cupped rose petal silhouette
            ctx.moveTo(0, p.size * 0.5);
            ctx.bezierCurveTo(-p.size, 0, -p.size * 0.7, -p.size, 0, -p.size * 0.8);
            ctx.bezierCurveTo(p.size * 0.7, -p.size, p.size, 0, 0, p.size * 0.5);
          }
          ctx.fill();
          ctx.restore();
        }

        // 2. Update & Draw Space "Stem Cut" Shear Glints
        for (let i = state.cutEffects.length - 1; i >= 0; i--) {
          const c = state.cutEffects[i];
          c.progress += 0.045;
          if (c.progress >= 1) {
            state.cutEffects.splice(i, 1);
            continue;
          }

          const alpha = 1 - c.progress;
          const len = 14 + c.progress * 18;
          ctx.save();
          ctx.translate(c.x, c.y);
          ctx.strokeStyle = `rgba(45, 76, 57, ${alpha * 0.65})`;
          ctx.lineWidth = 1.25;

          // Crossed shear lines
          ctx.beginPath();
          ctx.moveTo(-len * 0.5, -len * 0.7);
          ctx.lineTo(len * 0.5, len * 0.7);
          ctx.moveTo(len * 0.5, -len * 0.7);
          ctx.lineTo(-len * 0.5, len * 0.7);
          ctx.stroke();
          ctx.restore();
        }
      }

      function renderFrame(timestamp) {
        state.time = timestamp * 0.001;

        // 1. Archival Paper Fill & Grain
        ctx.fillStyle = PALETTE.paper;
        ctx.fillRect(0, 0, state.width, state.height);

        if (grainPattern) {
          ctx.fillStyle = grainPattern;
          ctx.fillRect(0, 0, state.width, state.height);
        }

        const fontSize = computeLayout();

        // 2. Update & Draw Withered Letters (Backspace / Clear)
        for (let i = state.dyingLetters.length - 1; i >= 0; i--) {
          const dying = state.dyingLetters[i];
          dying.update(fontSize);
          dying.drawGlyph(ctx, fontSize);
          dying.drawBotanicals(ctx, fontSize, state.time);
          if (dying.witherProgress >= 1) {
            state.dyingLetters.splice(i, 1);
          }
        }

        // 3. Update Active Letters
        const activeLetters = [];
        for (const token of state.tokens) {
          if (token.type === 'letter') {
            token.update(fontSize);
            activeLetters.push(token);
          }
        }

        // 4. First Pass: Render Playfair Display Bold Letterforms
        for (const letter of activeLetters) {
          letter.drawGlyph(ctx, fontSize);
        }

        // 5. Second Pass: Render Stems, Leaves, Tendrils, and Layered Roses over the Letters
        for (const letter of activeLetters) {
          letter.drawBotanicals(ctx, fontSize, state.time);
        }

        // 6. Third Pass: Subtle Blinking Botanical Cursor when Garden is Empty
        if (activeLetters.length === 0 && state.dyingLetters.length === 0) {
          ctx.save();
          ctx.font = `400 13px "DM Mono", monospace`;
          ctx.textAlign = 'center';
          ctx.fillStyle = '#8C857B';
          const pulse = 0.45 + 0.45 * Math.sin(state.time * 2.4);
          ctx.globalAlpha = pulse;
          ctx.fillText('TYPE ANY WORD TO SPROUT A GARDEN...', state.width / 2, state.height / 2);
          ctx.restore();
        }

        // 7. Falling Petals & Cut Sparks
        updateAndDrawParticles(ctx, state.time);

        requestAnimationFrame(renderFrame);
      }

      function handleResize() {
        state.width = window.innerWidth;
        state.height = window.innerHeight;
        state.dpr = Math.min(window.devicePixelRatio || 1, 2);

        canvas.width = state.width * state.dpr;
        canvas.height = state.height * state.dpr;
        ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);

        computeLayout();
      }

      function stopIntroIfRunning() {
        if (state.introTimer) {
          clearInterval(state.introTimer);
          state.introTimer = null;
        }
      }

      window.addEventListener('keydown', (e) => {
        if (e.metaKey || e.ctrlKey || e.altKey) return;

        if (e.key === 'Tab') {
          e.preventDefault();
          applyPaletteTheme(currentPaletteIndex + 1);
          showActionBadge(`PALETTE · ${PALETTE.name}`);
          flashKeycap('key-tab');
          return;
        }

        stopIntroIfRunning();

        if (e.key === 'Backspace') {
          e.preventDefault();
          witherLastToken();
        } else if (e.key === 'Enter') {
          e.preventDefault();
          clearGarden();
        } else if (e.key === ' ') {
          e.preventDefault();
          cutStemsForNewGarden();
        } else if (e.key.length === 1 && !e.repeat) {
          // Printable character
          e.preventDefault();
          addCharacter(e.key);
        }
      });

      // Mobile / Touch Input Proxy
      canvas.addEventListener('click', () => {
        if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
          mobileInput.focus();
        }
      });

      mobileInput.addEventListener('input', (e) => {
        stopIntroIfRunning();
        const val = mobileInput.value;
        if (val.length > 0) {
          const lastChar = val[val.length - 1];
          if (lastChar === ' ') {
            cutStemsForNewGarden();
          } else {
            addCharacter(lastChar);
          }
          mobileInput.value = '';
        }
      });

      // Interactive Bottom Legend Buttons
      document.getElementById('btn-space').addEventListener('click', () => {
        stopIntroIfRunning();
        cutStemsForNewGarden();
      });

      document.getElementById('btn-backspace').addEventListener('click', () => {
        stopIntroIfRunning();
        witherLastToken();
      });

      document.getElementById('btn-enter').addEventListener('click', () => {
        stopIntroIfRunning();
        clearGarden();
      });

      const cyclePalette = () => {
        applyPaletteTheme(currentPaletteIndex + 1);
        showActionBadge(`PALETTE · ${PALETTE.name}`);
        flashKeycap('key-tab');
      };

      paletteBtn.addEventListener('click', cyclePalette);
      document.getElementById('btn-tab-palette').addEventListener('click', cyclePalette);

      // Cycle Letter Ink Visibility Mode (FULL -> GHOST -> FLORA ONLY)
      toggleInkBtn.addEventListener('click', () => {
        state.inkModeIndex = (state.inkModeIndex + 1) % state.inkModes.length;
        inkModeLabel.textContent = state.inkModes[state.inkModeIndex];
        showActionBadge(`INK: ${state.inkModes[state.inkModeIndex]}`);
      });

      // High-Res PNG Snapshot Export
      exportBtn.addEventListener('click', () => {
        const dataUrl = canvas.toDataURL('image/png');
        const link = document.createElement('a');
        const wordSummary = state.tokens
          .filter(t => t.type === 'letter')
          .map(l => l.char)
          .join('')
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, '-') || 'specimen';
        link.download = `type-garden-${wordSummary}.png`;
        link.href = dataUrl;
        link.click();
        showActionBadge('SAVED PNG SPECIMEN');
      });

      window.addEventListener('resize', handleResize);

      window.onload = function () {
        applyPaletteTheme(0);
        handleResize();
        initPaperGrain();

        // Wait for Playfair Display Bold & DM Mono to finish loading before sampling contours
        const startGarden = () => {
          state.fontReady = true;
          requestAnimationFrame(renderFrame);

          // Automatically sprout an initial specimen ("Rose") so the garden is alive right away
          const starterWord = 'Rose';
          let idx = 0;
          state.introTimer = setInterval(() => {
            if (idx < starterWord.length) {
              addCharacter(starterWord[idx]);
              idx++;
            } else {
              clearInterval(state.introTimer);
              state.introTimer = null;
            }
          }, 240);
        };

        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(startGarden).catch(startGarden);
        } else {
          startGarden();
        }
      };
    })();
  </script>
</body>
</html>
