        let dustParticles;

        function addPrism(positions, p0, p1, w0, w1, h0, h1) {
            const dx = p1[0] - p0[0];
            const dy = p1[1] - p0[1];
            const len = Math.hypot(dx, dy);
            if (len < 0.0001) return;

            const wx = -dy / len;
            const wy = dx / len;

            const T0 = [p0[0], p0[1], p0[2] + h0];
            const B0 = [p0[0], p0[1], p0[2] - h0];
            const L0 = [p0[0] + wx * w0, p0[1] + wy * w0, p0[2]];
            const R0 = [p0[0] - wx * w0, p0[1] - wy * w0, p0[2]];

            const T1 = [p1[0], p1[1], p1[2] + h1];
            const B1 = [p1[0], p1[1], p1[2] - h1];
            const L1 = [p1[0] + wx * w1, p1[1] + wy * w1, p1[2]];
            const R1 = [p1[0] - wx * w1, p1[1] - wy * w1, p1[2]];

            function tri(a, b, c) {
                positions.push(a[0], a[1], a[2], b[0], b[1], b[2], c[0], c[1], c[2]);
            }

            if (w1 <= 0.001 && h1 <= 0.001) {
                tri(T0, L0, p1);
                tri(T0, p1, R0);
                tri(B0, p1, L0);
                tri(B0, R0, p1);
            } else {
                tri(T0, L0, L1);
                tri(T0, L1, T1);

                tri(T0, T1, R1);
                tri(T0, R1, R0);

                tri(B0, B1, L1);
                tri(B0, L1, L0);

                tri(B0, R0, R1);
                tri(B0, R1, B1);
            }
        }

        let snowflakeMesh = null;
        let innerCoreMesh = null;

        function buildSnowflake() {
            if (snowflakeMesh) {
                snowflakeGroup.remove(snowflakeMesh);
                snowflakeMesh.geometry.dispose();
            }
            if (innerCoreMesh) {
                snowflakeGroup.remove(innerCoreMesh);
                innerCoreMesh.geometry.dispose();
            }

            const positions = [];
            const innerPositions = [];

            const L = params.armLength;
            const H = params.thickness;
            const bScale = params.branchScale;
            const sub = params.subBranches;

            for (let arm = 0; arm < 6; arm++) {
                const theta = (arm * Math.PI) / 3;
                const cosT = Math.cos(theta);
                const sinT = Math.sin(theta);

                const pt = (r) => [cosT * r, sinT * r, 0];

                const r0 = 0.35;
                const r1 = L * 0.28;
                const r2 = L * 0.55;
                const r3 = L * 0.82;
                const r4 = L;

                addPrism(positions, pt(r0), pt(r1), 0.22, 0.18, H, H * 0.85);
                addPrism(positions, pt(r1), pt(r2), 0.18, 0.14, H * 0.85, H * 0.7);
                addPrism(positions, pt(r2), pt(r3), 0.14, 0.10, H * 0.7, H * 0.55);
                addPrism(positions, pt(r3), pt(r4), 0.10, 0.0, H * 0.55, 0.0);

                const addSideBranch = (rBase, angleOffset, length, w, h, hasSub) => {
                    const bAngle = theta + angleOffset;
                    const start = pt(rBase);
                    const bCos = Math.cos(bAngle);
                    const bSin = Math.sin(bAngle);
                    const end = [start[0] + bCos * length, start[1] + bSin * length, 0];
                    const mid = [start[0] + bCos * length * 0.5, start[1] + bSin * length * 0.5, 0];

                    if (hasSub && sub) {
                        addPrism(positions, start, mid, w, w * 0.7, h, h * 0.75);
                        addPrism(positions, mid, end, w * 0.7, 0.0, h * 0.75, 0.0);

                        const subL = length * 0.42;
                        const subAngle1 = bAngle + Math.PI / 3;
                        const subAngle2 = bAngle - Math.PI / 3;
                        const subEnd1 = [mid[0] + Math.cos(subAngle1) * subL, mid[1] + Math.sin(subAngle1) * subL, 0];
                        const subEnd2 = [mid[0] + Math.cos(subAngle2) * subL, mid[1] + Math.sin(subAngle2) * subL, 0];

                        addPrism(positions, mid, subEnd1, w * 0.5, 0.0, h * 0.55, 0.0);
                        addPrism(positions, mid, subEnd2, w * 0.5, 0.0, h * 0.55, 0.0);
                    } else {
                        addPrism(positions, start, end, w, 0.0, h, 0.0);
                    }
                };

                // 3 Tiers of dendritic lateral branches
                addSideBranch(r1, Math.PI / 3, 0.85 * bScale, 0.13, H * 0.75, false);
                addSideBranch(r1, -Math.PI / 3, 0.85 * bScale, 0.13, H * 0.75, false);

                addSideBranch(r2, Math.PI / 3, 1.45 * bScale, 0.15, H * 0.8, true);
                addSideBranch(r2, -Math.PI / 3, 1.45 * bScale, 0.15, H * 0.8, true);

                addSideBranch(r3, Math.PI / 3, 0.75 * bScale, 0.11, H * 0.6, false);
                addSideBranch(r3, -Math.PI / 3, 0.75 * bScale, 0.11, H * 0.6, false);

                // Inter-arm faceted diamond plate
                const midTheta = theta + Math.PI / 6;
                const plateRInner = 0.45;
                const plateROuter = params.centerStarRadius;
                const plateRMid = (plateRInner + plateROuter) * 0.5;

                const pIn = [Math.cos(midTheta) * plateRInner, Math.sin(midTheta) * plateRInner, 0];
                const pOut = [Math.cos(midTheta) * plateROuter, Math.sin(midTheta) * plateROuter, 0];
                const pArm1 = pt(plateRMid);
                const nextTheta = ((arm + 1) * Math.PI) / 3;
                const pArm2 = [Math.cos(nextTheta) * plateRMid, Math.sin(nextTheta) * plateRMid, 0];

                const cTop = [Math.cos(midTheta) * plateRMid, Math.sin(midTheta) * plateRMid, H * 0.7];
                const cBot = [Math.cos(midTheta) * plateRMid, Math.sin(midTheta) * plateRMid, -H * 0.7];

                function plateTri(a, b, c) {
                    positions.push(a[0], a[1], a[2], b[0], b[1], b[2], c[0], c[1], c[2]);
                }

                plateTri(cTop, pIn, pArm1);
                plateTri(cTop, pArm1, pOut);
                plateTri(cTop, pOut, pArm2);
                plateTri(cTop, pArm2, pIn);

                plateTri(cBot, pArm1, pIn);
                plateTri(cBot, pOut, pArm1);
                plateTri(cBot, pArm2, pOut);
                plateTri(cBot, pIn, pArm2);
            }

            // Central 12-point diamond star rosette
            const numStarPoints = 12;
            const topApex = [0, 0, H * 1.35];
            const botApex = [0, 0, -H * 1.35];

            for (let i = 0; i < numStarPoints; i++) {
                const a1 = (i * 2 * Math.PI) / numStarPoints;
                const a2 = ((i + 1) * 2 * Math.PI) / numStarPoints;

                const rA = (i % 2 === 0) ? 0.75 : 0.45;
                const rB = ((i + 1) % 2 === 0) ? 0.75 : 0.45;

                const pA = [Math.cos(a1) * rA, Math.sin(a1) * rA, 0];
                const pB = [Math.cos(a2) * rB, Math.sin(a2) * rB, 0];

                const midA = [pA[0] * 0.55, pA[1] * 0.55, H * 0.6];
                const midB = [pB[0] * 0.55, pB[1] * 0.55, H * 0.6];
                const midBotA = [pA[0] * 0.55, pA[1] * 0.55, -H * 0.6];
                const midBotB = [pB[0] * 0.55, pB[1] * 0.55, -H * 0.6];

                function triP(a, b, c) {
                    positions.push(a[0], a[1], a[2], b[0], b[1], b[2], c[0], c[1], c[2]);
                }

                triP(topApex, midA, midB);
                triP(midA, pA, pB);
                triP(midA, pB, midB);

                triP(botApex, midBotB, midBotA);
                triP(midBotA, pB, pA);
                triP(midBotA, midBotB, pB);
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.computeVertexNormals();

            snowflakeMesh = new THREE.Mesh(geometry, crystalMaterial);
            snowflakeGroup.add(snowflakeMesh);

            for (let i = 0; i < positions.length; i += 3) {
                innerPositions.push(
                    positions[i] * 0.86,
                    positions[i + 1] * 0.86,
                    positions[i + 2] * 0.7
                );
            }
            const innerGeometry = new THREE.BufferGeometry();
            innerGeometry.setAttribute('position', new THREE.Float32BufferAttribute(innerPositions, 3));
            innerGeometry.computeVertexNormals();

            innerCoreMesh = new THREE.Mesh(innerGeometry, crystalMaterial);
            snowflakeGroup.add(innerCoreMesh);
        }

        buildSnowflake();

        // --- 7. Build Volumetric Light Rays ---
        function buildVolumetricRays() {
            while (raysGroup.children.length > 0) {
                const child = raysGroup.children[0];
                raysGroup.remove(child);
                if (child.geometry) child.geometry.dispose();
            }

            if (!params.enableRays) return;

            const count = params.rayCount;
            const length = params.rayLength;
            const spread = params.raySpread;

            for (let i = 0; i < count; i++) {
                const baseR = 0.02;
                const tipR = params.rayWidth * (0.8 + Math.random() * 0.6);
                const rayGeo = new THREE.CylinderGeometry(tipR, baseR, length, 12, 1, true);
                rayGeo.translate(0, length * 0.5, 0);
                rayGeo.rotateX(Math.PI * 0.5);

                const rayMesh = new THREE.Mesh(rayGeo, rayMaterial);

                const phi = (i / count) * Math.PI * 2 + (Math.random() - 0.5) * 0.2;
                const theta = (Math.random() - 0.5) * spread;

                rayMesh.rotation.z = phi;
                rayMesh.rotation.x = theta;
                rayMesh.rotation.y = (Math.random() - 0.5) * 0.35;

                rayMesh.position.set(
                    (Math.random() - 0.5) * 0.3,
                    (Math.random() - 0.5) * 0.3,
                    -0.6
                );

                raysGroup.add(rayMesh);
            }

            if (dustParticles) {
                scene.remove(dustParticles);
                dustParticles.geometry.dispose();
            }

            const pCount = 350;
            const pPositions = new Float32Array(pCount * 3);
            for (let i = 0; i < pCount; i++) {
                const r = 0.5 + Math.random() * (length * 0.9);
                const angle = Math.random() * Math.PI * 2;
                const z = (Math.random() - 0.5) * 2.5;
                pPositions[i * 3] = Math.cos(angle) * r;
                pPositions[i * 3 + 1] = Math.sin(angle) * r;
                pPositions[i * 3 + 2] = z;
            }

            const pGeo = new THREE.BufferGeometry();
            pGeo.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));

            const pMat = new THREE.PointsMaterial({
                color: new THREE.Color(params.rayColor),
                size: 0.05,
                transparent: true,
                opacity: 0.75,
                blending: THREE.AdditiveBlending
            });

            dustParticles = new THREE.Points(pGeo, pMat);
            raysGroup.add(dustParticles);
        }

        buildVolumetricRays();

        // --- 8. Apply Color Scheme ---
        function applyColorScheme(schemeName) {
            const scheme = COLOR_SCHEMES[schemeName];
            if (!scheme) return;

            params.colorScheme = schemeName;
            params.crystalColor = scheme.crystal;
            params.facetGlintColor = scheme.facetGlint;
            params.dispersionTint = scheme.dispersion;
            params.rayColor = scheme.rays;
            params.backgroundColor = scheme.background;
            params.primaryLightColor = scheme.light1;
            params.fillLightColor = scheme.light2;
            params.rimLightColor = scheme.light3;
            params.ambientLightColor = scheme.ambient;

            crystalMaterial.uniforms.uCrystalColor.value.set(params.crystalColor);
            crystalMaterial.uniforms.uFacetGlintColor.value.set(params.facetGlintColor);
            crystalMaterial.uniforms.uDispersionTint.value.set(params.dispersionTint);

            rayMaterial.uniforms.uRayColor.value.set(params.rayColor);

            if (!params.greenScreen) {
                scene.background.set(params.backgroundColor);
            }

            primaryLight.color.set(params.primaryLightColor);
            fillLight.color.set(params.fillLightColor);
            rimLight.color.set(params.rimLightColor);
            ambientLight.color.set(params.ambientLightColor);

            gui.controllersRecursive().forEach(c => {
                if (c.parent && (c.parent._title === 'Post Processing' || (c.parent.parent && c.parent.parent._title === 'Post Processing'))) return;
                c.updateDisplay();
            });
        }

        // --- 9. Greenscreen Toggle (#00ff00) ---
        function toggleGreenScreen(enabled) {
            params.greenScreen = enabled;
            if (enabled) {
                scene.background.set('#00ff00');
            } else {
                scene.background.set(params.backgroundColor);
            }
        }

        // --- 10. Antialias Setting Toggle ---
        function updateRendererAntialias(antialiasState) {
            params.antialias = antialiasState;

            const oldDom = renderer.domElement;
            controls.dispose();
            renderer.dispose();

            renderer = new THREE.WebGLRenderer({
                antialias: params.antialias,
                powerPreference: 'high-performance'
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(params.dpr);
            renderer.outputColorSpace = THREE.SRGBColorSpace;

            document.body.replaceChild(renderer.domElement, oldDom);

            if (postProcessor) {
                postProcessor.renderer = renderer;
                postProcessor.setAntialias(params.antialias);
                postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);
            }

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.enableZoom = true;
            controls.zoomSpeed = 1.2;
            controls.enablePan = true;
            controls.screenSpacePanning = true;
            controls.panSpeed = 1.0;
            controls.mouseButtons = {
                LEFT: THREE.MOUSE.ROTATE,
                MIDDLE: THREE.MOUSE.DOLLY,
                RIGHT: THREE.MOUSE.PAN
            };
            controls.touches = {
                ONE: THREE.TOUCH.ROTATE,
                TWO: THREE.TOUCH.DOLLY_PAN
            };
        }

        // --- 11. Randomize On Click Generator ---
        function randomizeScene() {
            // IMPORTANT: DO NOT shuffle or change PostProcessor settings!
            // Postprocessing settings remain strictly preserved.

            // Pick a random color scheme from the 19 schemes
            const schemeNames = Object.keys(COLOR_SCHEMES);
            const randomScheme = schemeNames[Math.floor(Math.random() * schemeNames.length)];
            applyColorScheme(randomScheme);

            // Re-roll geometric parameters
            params.armLength = +(3.2 + Math.random() * 1.0).toFixed(2);
            params.thickness = +(0.24 + Math.random() * 0.18).toFixed(2);
            params.branchScale = +(0.8 + Math.random() * 0.45).toFixed(2);
            params.centerStarRadius = +(0.9 + Math.random() * 0.55).toFixed(2);
            params.subBranches = Math.random() > 0.25;
            buildSnowflake();

            // Re-roll motion & animation
            const animPool = ANIMATIONS.filter(a => a !== 'Static Crystal');
            params.animation = animPool[Math.floor(Math.random() * animPool.length)];
            params.animationSpeed = +(0.7 + Math.random() * 0.8).toFixed(2);
            params.rotationSpeed = +(0.6 + Math.random() * 0.8).toFixed(2);

            // Re-roll ray & dispersion parameters
            params.dispersionStrength = +(0.8 + Math.random() * 0.9).toFixed(2);
            params.rayIntensity = +(0.9 + Math.random() * 0.9).toFixed(2);
            params.raySpread = +(0.6 + Math.random() * 0.6).toFixed(2);
            buildVolumetricRays();

            // Update UI display for scene controllers without touching PostProcessor
            gui.controllersRecursive().forEach(c => {
                if (c.parent && (c.parent._title === 'Post Processing' || (c.parent.parent && c.parent.parent._title === 'Post Processing'))) return;
                c.updateDisplay();
            });
        }

        let pointerDownPos = { x: 0, y: 0 };
        let pointerDownTime = 0;

        window.addEventListener('pointerdown', (e) => {
            if (e.target === renderer.domElement) {
                pointerDownPos = { x: e.clientX, y: e.clientY };
                pointerDownTime = performance.now();
            }
        });

        window.addEventListener('pointerup', (e) => {
            if (e.target === renderer.domElement && params.randomizeOnClick) {
                const dx = e.clientX - pointerDownPos.x;
                const dy = e.clientY - pointerDownPos.y;
                const dist = Math.hypot(dx, dy);
                const dt = performance.now() - pointerDownTime;
                if (dist < 6 && dt < 350) {
                    randomizeScene();
                }
            }
        });

        // --- 12. Setup GUI (lil-gui standard styling) ---
        const gui = new GUI({ title: 'Crystal Snowflake' });

        // Presets & Modes Folder
        const fPresets = gui.addFolder('Presets & Modes');
        fPresets.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Color Scheme').onChange(applyColorScheme);
        fPresets.add(params, 'animation', ANIMATIONS).name('Animation Preset');
        fPresets.add(params, 'greenScreen').name('Green Screen (#00ff00)').onChange(toggleGreenScreen);
        fPresets.add(params, 'randomizeOnClick').name('Randomize on Click');

        // Animation & Performance Folder
        const fMotion = gui.addFolder('Animation & Motion');
        fMotion.add(params, 'animationSpeed', 0.0, 3.0, 0.05).name('Animation Speed');
        fMotion.add(params, 'rotationSpeed', -3.0, 3.0, 0.1).name('Rotation Speed');
        fMotion.add(params, 'dpr', 0.5, 3.0, 0.1).name('Pixel Ratio (DPR)').onChange(v => {
            renderer.setPixelRatio(v);
            if (postProcessor) {
                postProcessor.setSize(window.innerWidth, window.innerHeight, v);
            }
        });

        // Crystal Appearance Folder
        const fCrystal = gui.addFolder('Crystal Facets & Dispersion');
        fCrystal.addColor(params, 'crystalColor').name('Crystal Tint').onChange(v => {
            crystalMaterial.uniforms.uCrystalColor.value.set(v);
        });
        fCrystal.addColor(params, 'facetGlintColor').name('Facet Glint Color').onChange(v => {
            crystalMaterial.uniforms.uFacetGlintColor.value.set(v);
        });
        fCrystal.addColor(params, 'dispersionTint').name('Dispersion Tint').onChange(v => {
            crystalMaterial.uniforms.uDispersionTint.value.set(v);
        });
        fCrystal.add(params, 'dispersionStrength', 0.0, 2.5, 0.05).name('Prismatic Fire').onChange(v => {
            crystalMaterial.uniforms.uDispersionStrength.value = v;
        });
        fCrystal.add(params, 'facetSharpness', 16.0, 256.0, 4.0).name('Facet Sharpness').onChange(v => {
            crystalMaterial.uniforms.uFacetSharpness.value = v;
        });

        // Snowflake Geometry Folder
        const fGeo = gui.addFolder('Snowflake Geometry');
        fGeo.add(params, 'armLength', 2.0, 5.0, 0.1).name('Arm Radius').onChange(buildSnowflake);
        fGeo.add(params, 'thickness', 0.1, 0.7, 0.02).name('Crystal Depth').onChange(buildSnowflake);
        fGeo.add(params, 'branchScale', 0.5, 1.8, 0.05).name('Branch Scale').onChange(buildSnowflake);
        fGeo.add(params, 'centerStarRadius', 0.6, 2.0, 0.05).name('Center Star Size').onChange(buildSnowflake);
        fGeo.add(params, 'subBranches').name('Sub-Dendrites').onChange(buildSnowflake);

        // Volumetric Rays Folder
        const fRays = gui.addFolder('Volumetric Light Rays');
        fRays.add(params, 'enableRays').name('Enable Rays').onChange(buildVolumetricRays);
        fRays.addColor(params, 'rayColor').name('Ray Color').onChange(v => {
            rayMaterial.uniforms.uRayColor.value.set(v);
            if (dustParticles) dustParticles.material.color.set(v);
        });
        fRays.add(params, 'rayIntensity', 0.0, 3.0, 0.05).name('Ray Intensity').onChange(v => {
            rayMaterial.uniforms.uRayIntensity.value = v;
        });
        fRays.add(params, 'rayLength', 3.0, 15.0, 0.5).name('Ray Length').onChange(buildVolumetricRays);
        fRays.add(params, 'rayWidth', 0.05, 0.6, 0.02).name('Ray Thinness').onChange(buildVolumetricRays);
        fRays.add(params, 'raySpread', 0.2, 2.0, 0.05).name('Ray Spread').onChange(buildVolumetricRays);
        fRays.add(params, 'rayCount', 12, 64, 2).name('Ray Shafts Count').onChange(buildVolumetricRays);

        // Scene Lighting & Exposure Folder
        const fLighting = gui.addFolder('Lighting & Exposure');
        fLighting.add(params, 'exposure', 0.1, 4.0, 0.05).name('Scene Exposure').onChange(v => {
            if (postProcessor) {
                postProcessor.settings.exposure = v;
                postProcessor.updateSettings();
            }
        });
        fLighting.add(params, 'antialias').name('Scene Antialias').onChange(updateRendererAntialias);
        fLighting.addColor(params, 'backgroundColor').name('Background Color').onChange(v => {
            if (!params.greenScreen) scene.background.set(v);
        });

        // Primary Key Light
        const fLight1 = fLighting.addFolder('Primary Key Light');
        fLight1.add(params, 'primaryLightIntensity', 0.0, 6.0, 0.1).name('Intensity').onChange(v => {
            primaryLight.intensity = v;
            crystalMaterial.uniforms.uLight1Intensity.value = v;
        });
        fLight1.addColor(params, 'primaryLightColor').name('Color').onChange(v => {
            primaryLight.color.set(v);
            crystalMaterial.uniforms.uLight1Color.value.set(v);
        });
        fLight1.add(params, 'primaryLightPosX', -10, 10, 0.2).name('Pos X').onChange(v => {
            primaryLight.position.x = v;
        });
        fLight1.add(params, 'primaryLightPosY', -10, 10, 0.2).name('Pos Y').onChange(v => {
            primaryLight.position.y = v;
        });
        fLight1.add(params, 'primaryLightPosZ', -10, 10, 0.2).name('Pos Z').onChange(v => {
            primaryLight.position.z = v;
        });

        // Fill Light
        const fLight2 = fLighting.addFolder('Secondary Fill Light');
        fLight2.add(params, 'fillLightIntensity', 0.0, 5.0, 0.1).name('Intensity').onChange(v => {
            fillLight.intensity = v;
            crystalMaterial.uniforms.uLight2Intensity.value = v;
        });
        fLight2.addColor(params, 'fillLightColor').name('Color').onChange(v => {
            fillLight.color.set(v);
            crystalMaterial.uniforms.uLight2Color.value.set(v);
        });
        fLight2.add(params, 'fillLightPosX', -10, 10, 0.2).name('Pos X').onChange(v => {
            fillLight.position.x = v;
        });
        fLight2.add(params, 'fillLightPosY', -10, 10, 0.2).name('Pos Y').onChange(v => {
            fillLight.position.y = v;
        });
        fLight2.add(params, 'fillLightPosZ', -10, 10, 0.2).name('Pos Z').onChange(v => {
            fillLight.position.z = v;
        });

        // Rim Light
        const fLight3 = fLighting.addFolder('Rim / Back Light');
        fLight3.add(params, 'rimLightIntensity', 0.0, 5.0, 0.1).name('Intensity').onChange(v => {
            rimLight.intensity = v;
            crystalMaterial.uniforms.uLight3Intensity.value = v;
        });
        fLight3.addColor(params, 'rimLightColor').name('Color').onChange(v => {
            rimLight.color.set(v);
            crystalMaterial.uniforms.uLight3Color.value.set(v);
        });
        fLight3.add(params, 'rimLightPosX', -10, 10, 0.2).name('Pos X').onChange(v => {
            rimLight.position.x = v;
        });
        fLight3.add(params, 'rimLightPosY', -10, 10, 0.2).name('Pos Y').onChange(v => {
            rimLight.position.y = v;
        });
        fLight3.add(params, 'rimLightPosZ', -10, 10, 0.2).name('Pos Z').onChange(v => {
            rimLight.position.z = v;
        });

        // Ambient Light
        const fLightAmb = fLighting.addFolder('Ambient Light');
        fLightAmb.add(params, 'ambientLightIntensity', 0.0, 2.0, 0.05).name('Intensity').onChange(v => {
            ambientLight.intensity = v;
            crystalMaterial.uniforms.uAmbientIntensity.value = v;
        });
        fLightAmb.addColor(params, 'ambientLightColor').name('Color').onChange(v => {
            ambientLight.color.set(v);
            crystalMaterial.uniforms.uAmbientColor.value.set(v);
        });

        // Attach PostProcessor Suite to GUI
        postProcessor.attachGUI(gui, 'Post Processing');

        // Close subfolders for clean default view
        fGeo.close();
        fLighting.close();
        fLight1.close();
        fLight2.close();
        fLight3.close();
        fLightAmb.close();

        // --- 13. Hide / Show UI with "H" Key ---
        window.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (e.key === 'h' || e.key === 'H') {
                if (gui._hidden) {
                    gui.show();
                } else {
                    gui.hide();
                }
            }
        });

        // --- 14. Responsive Window Resize ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            if (postProcessor) {
                postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);
            }
        });

        // --- 15. Animation Loop ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            const time = clock.getElapsedTime();
            const speed = params.animationSpeed;
            const rotSpeed = params.rotationSpeed;

            crystalMaterial.uniforms.uTime.value = time * speed;
            rayMaterial.uniforms.uTime.value = time * speed;

            switch (params.animation) {
                case 'Gentle Axial Spin':
                    snowflakeGroup.rotation.z += 0.005 * speed * rotSpeed;
                    snowflakeGroup.rotation.x = Math.sin(time * 0.4 * speed) * 0.08;
                    snowflakeGroup.rotation.y = Math.cos(time * 0.3 * speed) * 0.08;
                    snowflakeGroup.position.set(0, 0, 0);
                    snowflakeGroup.scale.set(1, 1, 1);
                    raysGroup.rotation.z = snowflakeGroup.rotation.z * 0.7;
                    break;

                case 'Cosmic Floating & Tumbling':
                    snowflakeGroup.rotation.z += 0.004 * speed * rotSpeed;
                    snowflakeGroup.rotation.x = Math.sin(time * 0.35 * speed) * 0.25;
                    snowflakeGroup.rotation.y = Math.cos(time * 0.28 * speed) * 0.25;
                    snowflakeGroup.position.y = Math.sin(time * 0.75 * speed) * 0.18;
                    snowflakeGroup.scale.set(1, 1, 1);
                    raysGroup.rotation.copy(snowflakeGroup.rotation);
                    break;

                case 'Prismatic Zenith':
                    snowflakeGroup.rotation.x = 0.55 + Math.sin(time * 0.3 * speed) * 0.08;
                    snowflakeGroup.rotation.y = Math.cos(time * 0.4 * speed) * 0.12;
                    snowflakeGroup.rotation.z += 0.007 * speed * rotSpeed;
                    snowflakeGroup.position.set(0, 0, 0);
                    snowflakeGroup.scale.set(1, 1, 1);
                    raysGroup.rotation.z = snowflakeGroup.rotation.z;
                    break;

                case 'Orbiting Beacon':
                    snowflakeGroup.rotation.z += 0.003 * speed * rotSpeed;
                    snowflakeGroup.position.set(0, 0, 0);
                    snowflakeGroup.scale.set(1, 1, 1);
                    const orbitR = 7.5;
                    const camAngle = time * 0.18 * speed;
                    camera.position.x = Math.sin(camAngle) * orbitR;
                    camera.position.z = Math.cos(camAngle) * orbitR;
                    camera.position.y = Math.sin(time * 0.12 * speed) * 2.0;
                    camera.lookAt(controls.target);
                    raysGroup.rotation.z = -camAngle * 0.5;
                    break;

                case 'Pulsing Aurora Breathe':
                    snowflakeGroup.rotation.z += 0.004 * speed * rotSpeed;
                    snowflakeGroup.rotation.x = Math.sin(time * 0.3 * speed) * 0.06;
                    snowflakeGroup.rotation.y = Math.cos(time * 0.25 * speed) * 0.06;
                    const breathScale = 1.0 + 0.07 * Math.sin(time * 1.3 * speed);
                    snowflakeGroup.scale.set(breathScale, breathScale, breathScale);
                    rayMaterial.uniforms.uRayIntensity.value = params.rayIntensity * (1.0 + 0.35 * Math.sin(time * 1.3 * speed));
                    raysGroup.rotation.z = snowflakeGroup.rotation.z * 0.5;
                    break;

                case 'Crystalline Waltz':
                    snowflakeGroup.rotation.x = Math.sin(time * 0.6 * speed) * 0.32;
                    snowflakeGroup.rotation.y = Math.sin(time * 1.2 * speed) * 0.32;
                    snowflakeGroup.rotation.z += 0.006 * speed * rotSpeed;
                    snowflakeGroup.position.set(0, 0, 0);
                    snowflakeGroup.scale.set(1, 1, 1);
                    raysGroup.rotation.copy(snowflakeGroup.rotation);
                    break;

                case 'Ray Sweep & Shimmer':
                    snowflakeGroup.rotation.x = 0.2;
                    snowflakeGroup.rotation.y = 0.1;
                    snowflakeGroup.rotation.z += 0.003 * speed * rotSpeed;
                    snowflakeGroup.position.set(0, 0, 0);
                    snowflakeGroup.scale.set(1, 1, 1);
                    const sweepAngle = time * 0.8 * speed;
                    primaryLight.position.x = Math.sin(sweepAngle) * 6.0;
                    primaryLight.position.y = Math.cos(sweepAngle * 0.7) * 4.0;
                    raysGroup.rotation.z = Math.sin(sweepAngle * 0.5) * 0.6;
                    raysGroup.rotation.x = Math.cos(sweepAngle * 0.5) * 0.3;
                    break;

                case 'Static Crystal':
                default:
                    snowflakeGroup.rotation.set(0, 0, 0);
                    snowflakeGroup.position.set(0, 0, 0);
                    snowflakeGroup.scale.set(1, 1, 1);
                    break;
            }

            if (dustParticles) {
                dustParticles.rotation.z += 0.001 * speed;
            }

            controls.update();

            // Render through PostProcessor Suite
            if (postProcessor && postProcessor.settings.enabled) {
                if (postProcessor.settings.raysEnabled) {
                    postProcessor.setMoonScreenPosition(camera, primaryLight.position);
                }
                postProcessor.renderScene(scene, camera);
            } else {
                renderer.render(scene, camera);
            }
        }

        animate();
