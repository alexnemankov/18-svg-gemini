<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5279ad">
  <meta name="description" content="A living botanical print: cobalt water, drifting gold ink, rain rings, and ivory blossoms. Procedurally painted in Three.js and GLSL.">
  <link rel="icon" href="data:,">
  <title>Gold on Still Water</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #5279ad; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .unavailable { position: fixed; inset: 0; display: grid; place-content: center; margin: 0; padding: 2rem; color: #fff0ce; font: 16px/1.6 Georgia, serif; text-align: center; }
  </style>
</head>
<body>
<script>
/*
 * GOLD ON STILL WATER
 * Open 637.html in a modern browser. No build or installation required.
 * Pinned Three.js and lil-gui imports; no build step is needed.
 * All artwork is procedural: no images, fonts, textures, or video are loaded.
 * All interaction and appearance controls live in the standard lil-gui panel.
 */
(async () => {
  'use strict';

  let renderer;
  try {
    let THREE;
    try {
      THREE = await import('https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js');
    } catch {
      THREE = await import('https://unpkg.com/three@0.180.0/build/three.module.js');
    }
    let GUI;
    try {
      ({ default: GUI } = await import('https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js'));
    } catch {
      ({ default: GUI } = await import('https://cdn.jsdelivr.net/npm/lil-gui@0.19.1/dist/lil-gui.esm.min.js'));
    }

    const settings = {
      scheme: 'Original', inverted: false, greenScreen: false, randomizeOnClick: true,
      background: '#5279ad', shadow: '#223f6a', reflection: '#e7b66b', highlight: '#fff0ce',
      leaves: '#213627', blossoms: '#f3eadd', accent: '#c66843', stems: '#8a7c55',
      animation: 'Static camera', speed: 1, zoom: 1, angle: 0, azimuth: 0, roll: 0,
      panX: 0, panY: 0, dpr: Math.min(devicePixelRatio || 1, 1.65),
      seed: 637133, plantScale: 1, branchSpread: 1, leafSize: 1, leafWidth: 1, blossomSize: 1,
      rippleStrength: 1, rippleDensity: 1, flowSpeed: 1, sway: 1, grain: 1,
    };
    // Nineteen families. The polarity control supplies both requested achromatic variants.
    const colorKeys = ['background','shadow','reflection','highlight','leaves','blossoms','accent','stems'];
    const palette = (...colors) => Object.fromEntries(colorKeys.map((key,i) => [key,colors[i]]));
    const palettes = {
      'Original': palette('#5279ad','#223f6a','#e7b66b','#fff0ce','#213627','#f3eadd','#c66843','#8a7c55'),
      'Monochromatic': palette('#426184','#14263c','#8aaeca','#d9e8ed','#223c55','#d0dfe9','#6f95b5','#6c8294'),
      'Analogous': palette('#426e83','#173e52','#82c4b2','#d8e7ce','#214940','#ede8cf','#7096bc','#839b7b'),
      'Complementary': palette('#456e99','#20364f','#db955d','#ffe3bb','#233e44','#f4e5d4','#cb734b','#97816b'),
      'Split-complementary': palette('#546f96','#263453','#d7b06c','#f7e8c9','#3b4650','#eee1df','#c77a91','#a18b6e'),
      'Triadic': palette('#4c7395','#24394e','#d9b169','#fff0cf','#2b5848','#f1e5c9','#bd6672','#8e8962'),
      'Tetradic': palette('#466d8c','#233749','#cfa568','#f9e7c3','#40533c','#efe3d3','#b66f9b','#92906b'),
      'Double split-complementary': palette('#506e8b','#29394d','#d5ab7b','#f6e7cf','#3c5b51','#e8e0ec','#b97c91','#9b9070'),
      'Achromatic': palette('#171717','#030303','#aaa9a9','#f6f6f6','#777777','#eeeeee','#bbbbbb','#929292'),
      'Achromatic + Accent': palette('#171717','#030303','#b9b9b9','#f8f8f8','#777777','#eeeeee','#cd3c35','#929292'),
      'Neutral + accent': palette('#c9c2b4','#68675f','#978b72','#f9f1df','#3e443d','#efe8dc','#bb503b','#80755e'),
      'Amber / Vermilion': palette('#220901','#140500','#f6aa1c','#f6aa1c','#941b0c','#f6aa1c','#bc3908','#941b0c'),
      'Turquoise / Ink': palette('#0b132b','#000000','#5bc0be','#63d1cf','#4bad9e','#63d1cf','#4bad9e','#4bad9e'),
      'Orchid / Aubergine': palette('#0d001d','#120a12','#d69ade','#cfb5c2','#c9a3c6','#aa60c8','#cfb5c2','#c9a3c6'),
      'Saffron / Deep Teal': palette('#061210','#00474d','#ffba00','#fef1be','#008189','#fef1be','#ffba00','#00474d'),
      'Chartreuse / Emerald': palette('#05140a','#0a3322','#7fff00','#d4ffb0','#00b894','#d4ffb0','#7fff00','#0a3322'),
      'Tangerine / Plum': palette('#0e0618','#3d1050','#ff8c00','#ffe8cc','#c7501a','#ffe8cc','#ff8c00','#3d1050'),
      'Lavender / Indigo': palette('#090612','#1a1250','#b38fff','#e8e0ff','#6a3de8','#e8e0ff','#b38fff','#1a1250'),
      'Cyan / Magenta': palette('#05020f','#1e0a3d','#00f0ff','#e0fbff','#d40078','#e0fbff','#d40078','#1e0a3d'),
    };
    const animationNames = ['Static camera','Floating drift','Botanical orbit','Gentle breathing',
                            'Silk pendulum','Rain promenade','Slow turntable','Drifting close-up'];

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
    renderer.setClearColor(0x5279ad, 1);
    renderer.toneMapping = THREE.NoToneMapping;
    const canvas = renderer.domElement;
    canvas.setAttribute('role', 'img');
    canvas.setAttribute('aria-label', 'An animated botanical painting with flowing ink reflections, rain ripples, blossoms, and leaves.');
    document.body.appendChild(canvas);

    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, .5, -.5, .01, 20);
    camera.position.z = 8;
    const uniforms = {
      uTime: { value: 0 },
      uResolution: { value: new THREE.Vector2(1, 1) },
      uAspect: { value: 1 },
      uPixelRatio: { value: 1 },
      uPointer: { value: new THREE.Vector2(-10, -10) },
      uPointerTime: { value: -100 },
      uInverseViewProjection: { value: new THREE.Matrix4() },
      uGreenScreen: { value: false }, uPaletteMix: { value: 0 },
      uWater: { value: new THREE.Vector3() }, uShadow: { value: new THREE.Vector3() },
      uGold: { value: new THREE.Vector3() }, uHighlight: { value: new THREE.Vector3() },
      uLeaves: { value: new THREE.Vector3() }, uBlossoms: { value: new THREE.Vector3() },
      uAccent: { value: new THREE.Vector3() }, uStems: { value: new THREE.Vector3() },
      uVariation: { value: 0 }, uRippleStrength: { value: 1 }, uRippleDensity: { value: 1 },
      uFlowSpeed: { value: 1 }, uSway: { value: 1 }, uGrain: { value: 1 },
    };

    const noiseGLSL = /* glsl */`
      float hash21(vec2 p) {
        vec3 p3 = fract(vec3(p.xyx) * .1031);
        p3 += dot(p3, p3.yzx + 33.33);
        return fract((p3.x + p3.y) * p3.z);
      }
      float noise(vec2 p) {
        vec2 i = floor(p), f = fract(p);
        vec2 u = f*f*(3.0-2.0*f);
        return mix(mix(hash21(i), hash21(i+vec2(1,0)), u.x),
                   mix(hash21(i+vec2(0,1)), hash21(i+vec2(1,1)), u.x), u.y);
      }
      float fbm(vec2 p) {
        float sum = 0.0, amp = .533;
        mat2 turn = mat2(.8, .6, -.6, .8);
        for (int i=0; i<4; i++) {
          sum += amp * noise(p);
          p = turn*p*2.03 + vec2(13.1, 7.7);
          amp *= .48;
        }
        return sum;
      }
      // The weave and granulation stay fixed to the paper, never to time.
      float paper(vec2 pixel) {
        float dust = hash21(pixel) - .5;
        float tooth = noise(pixel*.64) - .5;
        float fiber = noise(vec2(pixel.x*.16, pixel.y*1.8)) - .5;
        return dust*.052 + tooth*.028 + fiber*.012;
      }
    `;

    const waterMaterial = new THREE.ShaderMaterial({
      uniforms,
      depthTest: false,
      depthWrite: false,
      vertexShader: /* glsl */`
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = vec4(position.xy, 0.0, 1.0);
        }
      `,
      fragmentShader: /* glsl */`
        precision highp float;
        uniform float uTime, uAspect, uPixelRatio, uPointerTime;
        uniform vec2 uResolution, uPointer;
        uniform mat4 uInverseViewProjection;
        uniform bool uGreenScreen;
        uniform vec3 uWater, uShadow, uGold, uHighlight;
        uniform float uPaletteMix, uVariation, uRippleStrength, uRippleDensity, uFlowSpeed, uGrain;
        varying vec2 vUv;
        ${noiseGLSL}
        const float TAU = 6.28318530718;

        // Derivative-based contours retain their fine ink edge at every resolution.
        float contour(float field, float width) {
          float d = abs(fract(field)-.5);
          float gradient = max(fwidth(field)*uPixelRatio, .00016);
          float aa = min(gradient,.045);
          // Let subpixel folds dry out instead of turning into broad, aliased ink patches.
          float resolved = 1.0-smoothstep(.10,.25,gradient);
          return (1.0-smoothstep(width*aa,(width+1.0)*aa,d))*resolved;
        }
        struct Ripple {
          vec2 displacement;
          float wave;
          float gold;
          float dark;
          float drop;
        };
        Ripple rain(vec2 p, vec2 center, float age, float period, float strength,
                    float seed, vec2 ellipse) {
          Ripple r;
          vec2 delta = (p-center)*ellipse;
          float angle = atan(delta.y, delta.x);
          float distanceToCenter = length(delta);
          float irregular = sin(angle*3.0+seed)*.015 + sin(angle*7.0-seed)*.006;
          float d = distanceToCenter*(1.0+irregular*2.0);
          d += (noise(p*18.0+seed)-.5)*.019*smoothstep(.015,.10,d);
          float radius = age*.0125;
          float life = smoothstep(0.0, 3.4, age)*(1.0-smoothstep(period-9.0,period,age));
          float front = 1.0-smoothstep(radius-.055, radius+.018, d);
          float core = smoothstep(.007,.035,d);
          float envelope = front*life*exp(-d*2.7)*strength*uRippleStrength;
          float phase = d*221.0-age*1.12+seed + .81*sin(d*37.0+angle*3.0+seed);
          phase += 1.25*noise(p*vec2(26.0,13.0)+seed);
          phase *= uRippleDensity;
          float breakup = .13+.87*smoothstep(.28,.65,noise(p*22.0+seed));
          r.wave = sin(phase)*envelope*core;
          r.displacement = delta/max(distanceToCenter,.001)*cos(phase)*envelope*.010*core;
          r.gold = max(contour(phase/TAU, .50),contour(phase/TAU+.12,.0)*.63)*envelope*core*breakup;
          r.dark = contour(phase/TAU+.19, 1.1)*envelope*core*(.3+.7*breakup);
          r.drop = (1.0-smoothstep(.0025,.0065,d))*exp(-age*.32)*life;
          return r;
        }
        void main() {
          if (uGreenScreen) { gl_FragColor=vec4(0.0,1.0,0.0,1.0); return; }
          vec2 ndc=gl_FragCoord.xy/uResolution*2.0-1.0;
          vec4 nearPoint=uInverseViewProjection*vec4(ndc,-1.0,1.0);
          vec4 farPoint=uInverseViewProjection*vec4(ndc,1.0,1.0);
          vec3 a=nearPoint.xyz/nearPoint.w,b=farPoint.xyz/farPoint.w;
          vec2 p=mix(a.xy,b.xy,-a.z/(b.z-a.z));
          float t = uTime;
          vec2 variation=vec2(uVariation*.71,uVariation*.43);
          vec2 flow = vec2(sin(t*uFlowSpeed*.019), cos(t*uFlowSpeed*.016))*.17;
          vec2 warp = vec2(fbm(p*3.8+flow+2.7+variation), fbm(p*4.1-flow+18.1-variation))-.5;
          vec2 displaced = p;
          float rings = 0.0, navy = 0.0, wave = 0.0, drops = 0.0;
          for (int i=0; i<4; i++) {
            vec2 uv;
            float period, offset, seed, strength;
            vec2 ellipse;
            if (i==0) {
              uv=vec2(.84,.80); period=46.0; offset=23.0; seed=1.8; strength=1.0; ellipse=vec2(1.0,1.15);
            } else if (i==1) {
              uv=vec2(.13,.245); period=53.0; offset=29.0; seed=5.3; strength=.93; ellipse=vec2(1.02,1.13);
            } else if (i==2) {
              uv=vec2(.48,.025); period=61.0; offset=37.0; seed=9.7; strength=.88; ellipse=vec2(1.0,1.04);
            } else {
              uv=vec2(.985,.435); period=43.0; offset=15.0; seed=13.2; strength=.82; ellipse=vec2(1.0,1.22);
            }
            float varied=step(.001,abs(uVariation));
            uv += vec2(sin(float(i)*3.1+uVariation),cos(float(i)*2.7+uVariation))*.055*varied;
            period *= 1.0+.12*sin(uVariation+float(i))*varied;
            offset += uVariation;
            vec2 center = (uv-.5)*vec2(uAspect,1.0);
            Ripple r = rain(p+warp*.012, center, mod(t+offset,period),period,strength,seed,ellipse);
            displaced += r.displacement;
            rings = max(rings,r.gold);
            navy = max(navy,r.dark);
            wave += r.wave;
            drops = max(drops,r.drop);
          }
          float pointerAge = t-uPointerTime;
          if (pointerAge>=0.0 && pointerAge<22.0) {
            Ripple r = rain(p,uPointer,pointerAge,22.0,.7,3.1,vec2(1.0,1.08));
            displaced += r.displacement;
            rings = max(rings,r.gold); navy=max(navy,r.dark); wave+=r.wave; drops=max(drops,r.drop);
          }

          // Slow domain deformation, with different scales in each local ink pool.
          vec2 q = displaced*vec2(2.5,7.2)+variation;
          vec2 bend = vec2(fbm(q*.72+flow+4.0), fbm(q*.63-flow+8.0));
          q += (bend-.5)*2.6 + vec2(warp.y*.9,warp.x*.55);
          float field = fbm(q+vec2(.09*sin(t*uFlowSpeed*.024),.07*cos(t*uFlowSpeed*.021)));
          field += .13*noise(q*2.1 + bend*1.9);
          field = field*7.4 + wave*.28;
          float pools = smoothstep(.27,.63,fbm(p*vec2(3.7,5.2)+vec2(18.2,2.6)));
          float openInk = smoothstep(.27,.51,noise(q*.71+vec2(3.6,9.1)));
          float ink = contour(field, .55)*pools*openInk;
          float twin = contour(field+.16+noise(q*.8)*.035, .20)*pools*openInk*.62;
          float edge = contour(field, 1.9)*pools*openInk;
          float fine = contour(field, .0)*pools*openInk;

          float pigment = fbm(p*8.5+4.7);
          float wash = noise(p*vec2(2.3,4.2)+3.1);
          vec3 blue = mix(vec3(.271,.424,.624),vec3(.384,.529,.733),.38+pigment*.48);
          vec3 tintedWater=mix(uWater*.89,min(uWater*1.10+vec3(.018),vec3(1.0)),.28+pigment*.65);
          blue=mix(blue,tintedWater,uPaletteMix);
          blue += (wash-.5)*.027;
          blue += wave*.015;
          blue = mix(blue,mix(vec3(.137,.247,.408),uShadow,uPaletteMix),navy*.34);
          blue = mix(blue,mix(vec3(.18,.29,.39),uShadow*.8,uPaletteMix),drops*.8);
          vec3 gold = mix(vec3(.827,.602,.335),vec3(.953,.797,.555),noise(p*73.0)*.6+.2);
          gold=mix(gold,mix(uGold*.83,uGold,noise(p*73.0)*.6+.2),uPaletteMix);
          vec3 color = mix(blue,gold,clamp(edge*.80+rings*.92,0.0,1.0));
          color = mix(color,mix(vec3(.977,.872,.673),mix(uGold,uHighlight,.6),uPaletteMix),clamp(ink*.95+twin*.8,0.0,1.0));
          color = mix(color,mix(vec3(1.0,.934,.801),uHighlight,uPaletteMix),max(fine*.52,rings*.50));
          color += paper(gl_FragCoord.xy/uPixelRatio)*uGrain;
          color += (noise(p*740.0)-.5)*.018*uGrain;
          // A little pigment settles at the frame, without a visible vignette.
          color *= 1.0-.025*pow(length(vUv-.5),2.0);
          gl_FragColor = vec4(color,1.0);
        }
      `,
    });
    const water = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), waterMaterial);
    water.frustumCulled = false;
    water.renderOrder = -10;
    scene.add(water);

    // Seeded illustration, built once. No canvas textures or per-frame geometry.
    let seed = 637133;
    const random = () => {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
    const range = (a,b) => a+(b-a)*random();
    const rgb = hex => [((hex>>16)&255)/255,((hex>>8)&255)/255,(hex&255)/255];
    const inkMaterial = new THREE.ShaderMaterial({
      uniforms,
      vertexColors: true,
      depthTest: false,
      depthWrite: false,
      side: THREE.DoubleSide,
      vertexShader: /* glsl */`
        uniform float uTime, uSway;
        attribute vec2 aInk;
        attribute float aKind, aSeed, aRole;
        varying vec2 vInk;
        varying vec3 vColor;
        varying float vKind, vSeed, vRole;
        void main() {
          vInk=aInk; vColor=color; vKind=aKind; vSeed=aSeed; vRole=aRole;
          vec3 posed=position;
          if(aKind>.5 && aKind<1.5) {
            posed.x+=sin(uTime*.14+aSeed)*.00016*aInk.y*aInk.y*uSway;
            posed.y+=cos(uTime*.11+aSeed)*.00007*aInk.y*uSway;
          }
          gl_Position=projectionMatrix*modelViewMatrix*vec4(posed,1.0);
        }
      `,
      fragmentShader: /* glsl */`
        precision highp float;
        uniform float uPixelRatio, uPaletteMix, uGrain;
        uniform vec3 uLeaves, uBlossoms, uAccent, uStems, uGold;
        varying vec2 vInk;
        varying vec3 vColor;
        varying float vKind, vSeed, vRole;
        ${noiseGLSL}
        void main() {
          vec3 color=vColor;
          float pigment=noise(vInk*vec2(65.0,31.0)+vSeed);
          if (vKind>.5 && vKind<1.5) {
            float bend=.035*sin(vInk.y*5.0+vSeed);
            float fold=exp(-abs(vInk.x-bend+.035)*24.0);
            float side=smoothstep(-.1,.14,vInk.x-bend);
            color *= .71 + side*.30;
            color += vec3(.16,.175,.12)*fold*(.36+.4*sin(vInk.y*3.0));
            color += (pigment-.5)*.048;
            // Narrow dry brush strokes follow the length of each leaf.
            color += vec3(.08,.085,.058)*pow(noise(vec2(vInk.x*140.0,vInk.y*5.0)+vSeed),9.0);
          } else if (vKind>1.5 && vKind<2.5) {
            float fold=sin(vInk.x*21.0+vInk.y*4.0+vSeed)*.025;
            float base=exp(-length(vInk*vec2(1.4,1.0))*3.0);
            float ridge=exp(-pow((vInk.x+.06)*10.0,2.0))*.042;
            color += fold+ridge+(pigment-.5)*.065;
            color -= vec3(.19,.17,.13)*base;
            color += vec3(.025,.022,.015)*smoothstep(.4,.9,vInk.y);
          } else if (vKind>2.5 && vKind<3.5) {
            color *= .78+.23*sin(vInk.y*2.4+.6);
            color += vec3(.1,.041,.013)*exp(-abs(vInk.x+.055)*15.0);
          } else if (vKind>3.5) {
            color += (noise(vInk*vec2(140.0,12.0)+vSeed)-.5)*.08;
          }
          float lightness=dot(clamp(color,0.0,1.0),vec3(.2126,.7152,.0722));
          vec3 tinted;
          if(vRole<1.5) {
            tinted=mix(uLeaves*.48,mix(uLeaves,uBlossoms,.4),smoothstep(.02,.58,lightness));
          } else if(vRole<2.5) {
            tinted=mix(uBlossoms*.54,uBlossoms,clamp((lightness-.36)/.61,0.0,1.0));
          } else if(vRole<3.5) {
            tinted=mix(uAccent,uGold,.12*smoothstep(.35,.7,lightness))*(.65+lightness*.9);
          } else {
            tinted=uStems*(.55+lightness*1.1);
          }
          color=mix(color,tinted,uPaletteMix);
          color += paper(gl_FragCoord.xy/uPixelRatio)*.82*uGrain;
          gl_FragColor=vec4(color,1.0);
        }
      `,
    });

    // Batch every branch into one mesh, including all of its fine pen strokes.
    class Painter {
      constructor() { this.positions=[]; this.colors=[]; this.inks=[]; this.kinds=[]; this.seeds=[]; this.roles=[]; this.role=1; }
      shape(shape, x, y, sx, sy, angle, color, kind=0, salt=random()*100) {
        const g=new THREE.ShapeGeometry(shape,22);
        const position=g.attributes.position;
        const c=rgb(color), ca=Math.cos(angle), sa=Math.sin(angle);
        const count=g.index ? g.index.count : position.count;
        for (let j=0;j<count;j++) {
          const i=g.index ? g.index.array[j] : j;
          const px=position.getX(i), py=position.getY(i);
          this.positions.push(x+ca*px*sx-sa*py*sy,y+sa*px*sx+ca*py*sy,0);
          this.inks.push(px,py); this.colors.push(...c); this.kinds.push(kind); this.seeds.push(salt);
          this.roles.push(this.role);
        }
        g.dispose();
      }
      polygon(points,color) {
        const s=new THREE.Shape(); s.moveTo(...points[0]);
        for(let i=1;i<points.length;i++) s.lineTo(...points[i]);
        s.closePath(); this.shape(s,0,0,1,1,0,color);
      }
      stroke(points,width,color,taper=.65) {
        // Ribbon geometry gives pen strokes a real width instead of platform-dependent GL lines.
        const curve=new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(p[0],p[1],0)));
        const pts=curve.getPoints(Math.max(8,points.length*9));
        const left=[],right=[];
        for(let i=0;i<pts.length;i++) {
          const prev=pts[Math.max(0,i-1)],next=pts[Math.min(pts.length-1,i+1)];
          const dx=next.x-prev.x,dy=next.y-prev.y,d=Math.hypot(dx,dy)||1;
          const w=width*.5*(1-taper*i/(pts.length-1));
          left.push([pts[i].x-dy/d*w,pts[i].y+dx/d*w]);

    let aspect=1,unit=1;

    function sampleMotion() {
      const t=elapsed-motionOrigin;
      const m={x:0,y:0,tilt:0,yaw:0,roll:0,zoom:1};
      switch(settings.animation) {
        case 'Floating drift':
          m.x=Math.sin(t*.035)*.028;m.y=Math.sin(t*.027)*.018;break;
        case 'Botanical orbit':
          m.x=Math.sin(t*.024)*.018;m.y=(Math.cos(t*.024)-1)*.012;
          m.tilt=.16+Math.sin(t*.021)*.035;m.yaw=t*.018;break;
        case 'Gentle breathing':
          m.zoom=1+Math.sin(t*.036)*.035;m.y=Math.sin(t*.023)*.009;break;
        case 'Silk pendulum':
          m.roll=Math.sin(t*.032)*.025;m.x=Math.sin(t*.025)*.015;break;
        case 'Rain promenade':
          m.x=Math.sin(t*.030)*.045;m.y=Math.sin(t*.060)*.022;
          m.tilt=Math.sin(t*.022)*.045;break;
        case 'Slow turntable':
          m.roll=t*.004;m.tilt=.065+Math.sin(t*.019)*.025;break;
        case 'Drifting close-up':
          m.zoom=1+Math.sin(t*.023)*.07;m.x=Math.sin(t*.019)*.045;
          m.y=Math.sin(t*.029)*.028;m.tilt=Math.sin(t*.021)*.055;break;

    function updateView(dt,instant=false) {

      pose.tilt+=(clamp(radians(settings.angle)+m.tilt,-.6,.95)-pose.tilt)*blend;
      const yaw=radians(settings.azimuth)+m.yaw,roll=radians(settings.roll)+m.roll;
      pose.yaw+=Math.atan2(Math.sin(yaw-pose.yaw),Math.cos(yaw-pose.yaw))*blend;
      pose.roll+=Math.atan2(Math.sin(roll-pose.roll),Math.cos(roll-pose.roll))*blend;
      pose.zoom+=(settings.zoom*m.zoom-pose.zoom)*blend;
      target.set(pose.x,pose.y,0);
      camera.position.set(Math.sin(pose.tilt)*Math.cos(pose.yaw),
        Math.sin(pose.tilt)*Math.sin(pose.yaw),Math.cos(pose.tilt)).multiplyScalar(8).add(target);
      camera.up.set(-Math.sin(pose.roll),Math.cos(pose.roll),0);

    function animate(now) {

    function worldPoint(x,y) {
      const rect=canvas.getBoundingClientRect();
      raycaster.setFromCamera(new THREE.Vector2((x-rect.left)/rect.width*2-1,1-(y-rect.top)/rect.height*2),camera);
      return raycaster.ray.intersectPlane(plane,new THREE.Vector3());
    }
    let drag=null;
    function pointerDown(event) {
      if(drag||event.button>2||event.button===1)return;
      drag={id:event.pointerId,startX:event.clientX,startY:event.clientY,x:event.clientX,y:event.clientY,
        moved:false,orbit:event.button===2||event.shiftKey};
      canvas.setPointerCapture(event.pointerId);
    }
    function pointerMove(event) {
      if(!drag||event.pointerId!==drag.id)return;
      const dx=event.clientX-drag.x,dy=event.clientY-drag.y;
      if(Math.hypot(event.clientX-drag.startX,event.clientY-drag.startY)>5)drag.moved=true;
      if(drag.moved) {
        if(drag.orbit) {
          settings.azimuth=((settings.azimuth+dx*.3+540)%360)-180;
          settings.angle=clamp(settings.angle+dy*.18,0,45);
        } else {
          const a=worldPoint(drag.x,drag.y),b=worldPoint(event.clientX,event.clientY);
          if(a&&b) {
            const x=b.x-a.x,y=b.y-a.y;
            settings.panX+=x;settings.panY+=y;pose.x-=x;pose.y-=y;
          }
        }
        updateView(0);refreshPanel();
      }
      drag.x=event.clientX;drag.y=event.clientY;
    }
    function pointerUp(event) {
      if(!drag||drag.id!==event.pointerId)return;
      const click=!drag.moved&&!drag.orbit;
      drag=null;
      if(canvas.hasPointerCapture(event.pointerId))canvas.releasePointerCapture(event.pointerId);
      if(click) {
        if(settings.randomizeOnClick)newVariation();
        else {
          const p=worldPoint(event.clientX,event.clientY);
          if(p){uniforms.uPointer.value.set(p.x,p.y);uniforms.uPointerTime.value=elapsed;}
        }
      }
    }
    function pointerCancel(event) {
      if(drag?.id===event.pointerId)drag=null;
    }
    function wheel(event) {
      event.preventDefault();
      const before=worldPoint(event.clientX,event.clientY);
      const delta=event.deltaY*(event.deltaMode===1?16:event.deltaMode===2?innerHeight:1);
      settings.zoom=clamp(settings.zoom*Math.exp(-delta*.0012),.25,5);
      pose.zoom=settings.zoom*sampleMotion().zoom;updateView(0);
      const after=worldPoint(event.clientX,event.clientY);
      if(before&&after) {
        const x=after.x-before.x,y=after.y-before.y;
        settings.panX+=x;settings.panY+=y;pose.x-=x;pose.y-=y;updateView(0);
      }
      refreshPanel();
    }
    function keyDown(event) {
      if(event.key.toLowerCase()!=='h'||event.repeat||event.ctrlKey||event.metaKey||event.altKey)return;
      event.preventDefault();
      event.stopPropagation();
      guiHidden=!guiHidden;gui.show(!guiHidden);
    }
    function contextMenu(event){event.preventDefault();}
    function onVisibility(){last=performance.now();}
    function onLost(event){event.preventDefault();lost=true;}
    function onRestored(){lost=false;last=performance.now();resize();}
    addEventListener('resize',resize,{passive:true});
    canvas.addEventListener('pointerdown',pointerDown);
    canvas.addEventListener('pointermove',pointerMove);
    canvas.addEventListener('pointerup',pointerUp);
    canvas.addEventListener('pointercancel',pointerCancel);
    canvas.addEventListener('lostpointercapture',pointerCancel);
    canvas.addEventListener('wheel',wheel,{passive:false});
    canvas.addEventListener('contextmenu',contextMenu);
    addEventListener('keydown',keyDown,true);
    canvas.addEventListener('webglcontextlost',onLost);
    canvas.addEventListener('webglcontextrestored',onRestored);
    document.addEventListener('visibilitychange',onVisibility);
    frame=requestAnimationFrame(animate);

    function cleanup(event) {
      if(event.persisted)return; // Preserve resources while held in the back/forward cache.
      disposed=true;cancelAnimationFrame(frame);
      removeEventListener('resize',resize);
      canvas.removeEventListener('pointerdown',pointerDown);
      canvas.removeEventListener('pointermove',pointerMove);
      canvas.removeEventListener('pointerup',pointerUp);
      canvas.removeEventListener('pointercancel',pointerCancel);
      canvas.removeEventListener('lostpointercapture',pointerCancel);
      canvas.removeEventListener('wheel',wheel);
      canvas.removeEventListener('contextmenu',contextMenu);
      removeEventListener('keydown',keyDown,true);
      canvas.removeEventListener('webglcontextlost',onLost);
      canvas.removeEventListener('webglcontextrestored',onRestored);
      document.removeEventListener('visibilitychange',onVisibility);
      removeEventListener('pagehide',cleanup);
      gui.destroy();water.geometry.dispose();waterMaterial.dispose();inkMaterial.dispose();
      for(const plant of plants)plant.mesh.geometry.dispose();
      renderer.dispose();
    }
    addEventListener('pagehide',cleanup);
  } catch(error) {
    console.error('[Gold on Still Water]',error);
    renderer?.dispose();renderer?.domElement.remove();
    const message=document.createElement('p');
    message.className='unavailable';message.setAttribute('role','alert');
    message.textContent='This painting needs WebGL 2 and an internet connection to load Three.js. Please open it in a current browser.';
    document.body.appendChild(message);
  }
})();
</script>
</body>
