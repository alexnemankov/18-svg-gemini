<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Subscription Chandelier</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0c1017;
      user-select: none;
      -webkit-user-select: none;
    }
    #webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
      }
    }
  </script>
</head>
<body>
  <canvas id="webgl-canvas"></canvas>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import GUI from 'lil-gui';

    // =========================================================================
    // INLINED POST PROCESSOR SUITE (from postprocessing/PostProcessor.js)
    // =========================================================================
    const orthoVertexShader = `
    precision highp float;
    in vec3 position;
    out vec2 vUv;
    void main() {
      vUv = position.xy * 0.5 + 0.5;
      gl_Position = vec4(position, 1.0);
    }
    `;

    const brightFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float bloomThreshold;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      vec4 color = texture(inputTexture, vUv);
      float luminance = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float knee = 0.1;
      float soft = luminance - bloomThreshold + knee;
      soft = clamp(soft, 0.0, 2.0 * knee);
      soft = (soft * soft) / (4.0 * knee + 0.00001);
      float contribution = max(soft, luminance - bloomThreshold);
      contribution /= max(luminance, 0.00001);
      fragColor = vec4(color.rgb * contribution, color.a);
    }
    `;

    const blur13ShaderChunk = `
    vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
      vec2 resolution = vec2(textureSize(image, 0));
      vec4 color = vec4(0.0);
      vec2 off1 = vec2(1.411764705882353) * direction;
      vec2 off2 = vec2(3.2941176470588234) * direction;
      vec2 off3 = vec2(5.176470588235294) * direction;
      color += texture(image, uv) * 0.1964825501511404;
      color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
      color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
      return color;
    }
    `;

    const blurFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 direction;
    in vec2 vUv;
    out vec4 color;
    ${blur13ShaderChunk}
    void main() {
      color = blur13(inputTexture, vUv, direction);
    }
    `;

    const godRaysDepthMaskShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float threshold;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      vec4 color = texture(inputTexture, vUv);
      float lum = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float factor = smoothstep(threshold, threshold + 0.15, lum);
      fragColor = vec4(vec3(factor), 1.0);
    }
    `;

    const godRaysGenerateShader = `
    precision highp float;
    #define TAPS_PER_PASS 6.0
    uniform sampler2D inputTexture;
    uniform vec3 vSunPositionScreenSpace;
    uniform float fStepSize;
    uniform float distanceAttenuation;
    uniform float maxDensity;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      vec2 delta = vSunPositionScreenSpace.xy - vUv;
      float dist = length(delta);
      vec2 stepv = fStepSize * delta / max(dist, 0.0001);
      float iters = dist / max(fStepSize, 0.00001);
      vec2 uv = vUv;
      float col = 0.0;
      float f = min(1.0, max(vSunPositionScreenSpace.z, 0.0));
      float atten = 1.0 / (1.0 + pow(dist, distanceAttenuation));
      if (0.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (1.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (2.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (3.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (4.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (5.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      float finalVal = min(col / TAPS_PER_PASS * atten, maxDensity);
      fragColor = vec4(vec3(finalVal), 1.0);
    }
    `;

    const anamorphicBrightShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float threshold;
    uniform float smoothWidth;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      vec4 color = texture(inputTexture, vUv);
      float v = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float alpha = smoothstep(threshold, threshold + smoothWidth, v);
      fragColor = mix(vec4(0.0), color, alpha);
    }
    `;

    const anamorphicBlurShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 resolution;
    uniform float samples;
    uniform float intensity;
    uniform vec3 tintColor;
    uniform float bloomRadius;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      int halfSamples = max(1, int(samples) / 2);
      float fHalfSamples = float(halfSamples);
      vec2 invSize = 1.0 / resolution;
      vec4 total = vec4(0.0);
      for (int i = -64; i <= 64; i++) {
        if (i < -halfSamples || i > halfSamples) continue;
        float softness = 1.0 - abs(float(i)) / fHalfSamples;
        softness = pow(softness, 2.0);
        vec2 shiftedUV = vec2(vUv.x + invSize.x * float(i) * (4.0 + bloomRadius * 8.0), vUv.y);
        shiftedUV = clamp(shiftedUV, 0.001, 0.999);
        total += texture(inputTexture, shiftedUV) * softness;
      }
      fragColor = (total / (samples / 3.0)) * vec4(tintColor, 1.0) * intensity;
    }
    `;

    const finalFragmentShader = `
    precision highp float;
    uniform vec2 resolution;
    uniform sampler2D inputTexture;
    uniform sampler2D blur0Texture;
    uniform sampler2D blur1Texture;
    uniform sampler2D blur2Texture;
    uniform sampler2D blur3Texture;
    uniform sampler2D blur4Texture;
    uniform sampler2D raysTexture;
    uniform sampler2D anamorphicTexture;
    uniform bool bloomEnabled;
    uniform float bloomStrength;
    uniform bool raysEnabled;
    uniform float raysStrength;
    uniform vec3 raysColor;
    uniform bool anamorphicEnabled;
    uniform float vignetteBoost;
    uniform float vignetteReduction;
    uniform float noiseIntensity;
    uniform float time;
    in vec2 vUv;
    out vec4 fragColor;

    float vignette(vec2 uv, float boost, float reduction) {
      vec2 position = vUv - 0.5;
      return boost - length(position) * reduction;
    }

    float hash1(uint n) {
      n = (n << 13U) ^ n;
      n = n * (n * n * 15731U + 789221U) + 1376312589U;
      return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
    }

    float noise(in vec2 uv, in float timeVal) {
      uvec2 p = uvec2(uv);
      return hash1(p.x + 1920U * p.y + uint(timeVal));
    }

    void main() {
      vec4 color = texture(inputTexture, vUv);
      if (bloomEnabled && bloomStrength > 0.001) {
        vec4 b0 = texture(blur0Texture, vUv);
        vec4 b1 = texture(blur1Texture, vUv);
        vec4 b2 = texture(blur2Texture, vUv);
        vec4 b3 = texture(blur3Texture, vUv);
        vec4 b4 = texture(blur4Texture, vUv);
        vec4 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
        color += bloomSum * bloomStrength;
      }
      if (raysEnabled && raysStrength > 0.001) {
        vec4 r = texture(raysTexture, vUv);
        color.rgb += r.rgb * raysColor * raysStrength;
      }
      if (anamorphicEnabled) {
        vec4 a = texture(anamorphicTexture, vUv);
        color.rgb += a.rgb;
      }
      color.rgb *= vignette(vUv, vignetteBoost, vignetteReduction);
      color.rgb += noiseIntensity * noise(gl_FragCoord.xy, time);
      fragColor = vec4(color.rgb, 1.0);
    }
    `;

    const chromaticAberrationShaderChunk = `
    vec2 barrelDistortion(vec2 coord, float amt) {
      vec2 cc = coord - 0.5;
      float dist = dot(cc, cc);
      return coord + cc * dist * amt;
    }
    float sat(float t) { return clamp(t, 0.0, 1.0); }
    float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
    float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
    vec4 spectrum_offset(float t) {
      float lo = step(t, 0.5);
      float hi = 1.0 - lo;
      float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
      vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
      return pow(ret, vec4(1.0 / 2.2));
    }
    const float max_distort = 2.2;
    const int num_iter = 8;
    const float reci_num_iter_f = 0.125;
    vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
      vec4 sumcol = vec4(0.0);
      vec4 sumw = vec4(0.0);
      for (int i = 0; i < num_iter; ++i) {
        float t = float(i) * reci_num_iter_f;
        vec4 w = spectrum_offset(t);
        sumw += w;
        sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
      }
      return sumcol / sumw;
    }
    `;

    const colorFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float chromaticAberrationAmount;
    uniform float minInputLevel;
    uniform float maxInputLevel;
    uniform float gammaLevel;
    uniform float fisheyeStrength;
    uniform float fisheyeRadius;
    uniform float time;
    in vec2 vUv;
    out vec4 fragColor;
    ${chromaticAberrationShaderChunk}

    vec2 applyFisheye(vec2 uv, float strength, float radius) {
      if (abs(strength) < 0.0001) return uv;
      vec2 p = uv - 0.5;
      float d = length(p);
      if (d > radius * 1.5) return uv;
      float r = d / max(radius, 0.001);
      float theta = atan(p.y, p.x);
      float rDist = r + strength * (r * r * r);
      return 0.5 + vec2(cos(theta), sin(theta)) * (rDist * radius);
    }

    vec3 gammaCorrect(vec3 color, vec3 gamma) {
      return pow(max(color, vec3(0.0)), 1.0 / gamma);
    }
    vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
      return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
    }
    vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
      return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
    }

    void main() {
      vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
      fragColor = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
      fragColor.rgb = finalLevels(fragColor.rgb, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
      fragColor.a = 1.0;
    }
    `;

    const copyFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      fragColor = texture(inputTexture, vUv);
    }
    `;

    function createFBO(w, h, options = {}) {
      return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
        wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
        wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
        minFilter: options.minFilter || THREE.LinearFilter,
        magFilter: options.magFilter || THREE.LinearFilter,
        format: options.format || THREE.RGBAFormat,
        type: options.type || THREE.HalfFloatType,
        stencilBuffer: options.stencilBuffer || false,
        depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : true,
        samples: options.samples || 0,
      });
    }

    class ShaderPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbo = createFBO(1, 1, options);
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoQuad.frustumCulled = false;
        this.orthoScene.add(this.orthoQuad);
        this.texture = this.fbo.texture;
      }
      render(renderer, toScreen = false) {
        if (!toScreen) renderer.setRenderTarget(this.fbo);
        renderer.render(this.orthoScene, this.orthoCamera);
        if (!toScreen) renderer.setRenderTarget(null);
      }
      setSize(width, height) {
        this.fbo.setSize(Math.max(1, width), Math.max(1, height));
        this.orthoQuad.scale.set(width, height, 1);
      }
    }

    class ShaderPingPongPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
        this.currentFBO = 0;
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoQuad.frustumCulled = false;
        this.orthoScene.add(this.orthoQuad);
      }
      render(renderer) {
        renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
        renderer.render(this.orthoScene, this.orthoCamera);
        renderer.setRenderTarget(null);
        this.currentFBO = 1 - this.currentFBO;
      }
      get current() { return this.fbos[this.currentFBO]; }
      get texture() { return this.current.texture; }
      setSize(width, height) {
        const w = Math.max(1, width);
        const h = Math.max(1, height);
        this.orthoQuad.scale.set(w, h, 1);
        this.fbos[0].setSize(w, h);
        this.fbos[1].setSize(w, h);
      }
    }

    class BloomPass {
      constructor(strength = 0.85, radius = 0.5, threshold = 0.18, levels = 5) {
        this.strength = strength;
        this.radius = radius;
        this.threshold = threshold;
        this.enabled = true;
        this.levels = levels;
        this.brightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            bloomThreshold: { value: this.threshold },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: brightFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.brightPass = new ShaderPass(this.brightShader, { format: THREE.RGBAFormat, type: THREE.HalfFloatType });
        this.blurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            direction: { value: new THREE.Vector2(0, 1) },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: blurFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.blurPasses = [];
        for (let i = 0; i < this.levels; i++) {
          this.blurPasses.push(new ShaderPingPongPass(this.blurShader, { format: THREE.RGBAFormat, type: THREE.HalfFloatType }));
        }
      }
      setSize(w, h) {
        let tw = Math.max(1, w);
        let th = Math.max(1, h);
        this.brightPass.setSize(tw, th);
        for (let i = 0; i < this.levels; i++) {
          tw = Math.max(1, Math.round(tw / 2));
          th = Math.max(1, Math.round(th / 2));
          this.blurPasses[i].setSize(tw, th);
        }
      }
      set source(texture) { this.brightShader.uniforms.inputTexture.value = texture; }
      render(renderer) {
        if (!this.enabled || this.strength <= 0.001) return;
        this.brightShader.uniforms.bloomThreshold.value = this.threshold;
        this.brightPass.render(renderer);
        const baseOffset = Math.max(0.1, this.radius * 2.0);
        const u = this.blurShader.uniforms;
        for (let j = 0; j < this.levels; j++) {
          const blurPass = this.blurPasses[j];
          const stepOffset = baseOffset * (1.0 + j * 0.5);
          u.direction.value.set(stepOffset, 0);
          u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
          blurPass.render(renderer);
          u.direction.value.set(0, stepOffset * 0.5);
          u.inputTexture.value = blurPass.current.texture;
          blurPass.render(renderer);
        }
      }
    }

    class PostProcessor {
      constructor(renderer, params = {}) {
        this.renderer = renderer;
        this.settings = {
          enabled: params.enabled !== undefined ? params.enabled : true,
          antialias: params.antialias !== undefined ? params.antialias : true,
          bloomEnabled: params.bloomEnabled !== undefined ? params.bloomEnabled : true,
          bloomStrength: params.bloomStrength !== undefined ? params.bloomStrength : 0.85,
          bloomRadius: params.bloomRadius !== undefined ? params.bloomRadius : 0.5,
          bloomThreshold: params.bloomThreshold !== undefined ? params.bloomThreshold : 0.18,
          raysEnabled: params.raysEnabled !== undefined ? params.raysEnabled : true,
          raysStrength: params.raysStrength !== undefined ? params.raysStrength : 0.75,
          raysDensity: params.raysDensity !== undefined ? params.raysDensity : 1.2,
          raysMaxDensity: params.raysMaxDensity !== undefined ? params.raysMaxDensity : 0.65,
          raysDistanceAttenuation: params.raysDistanceAttenuation !== undefined ? params.raysDistanceAttenuation : 1.8,
          raysThreshold: params.raysThreshold !== undefined ? params.raysThreshold : 0.15,
          raysColor: params.raysColor ? (params.raysColor.isColor ? params.raysColor.clone() : new THREE.Color(params.raysColor)) : new THREE.Color(0x5ca8ff),
          raysColorHex: params.raysColorHex || '#5ca8ff',
          // User requested: "anamorphic default is off"
          anamorphicEnabled: params.anamorphicEnabled !== undefined ? params.anamorphicEnabled : false,
          anamorphicIntensity: params.anamorphicIntensity !== undefined ? params.anamorphicIntensity : 4.0,
          anamorphicThreshold: params.anamorphicThreshold !== undefined ? params.anamorphicThreshold : 0.25,
          anamorphicSamples: params.anamorphicSamples !== undefined ? params.anamorphicSamples : 64,
          anamorphicRadius: params.anamorphicRadius !== undefined ? params.anamorphicRadius : 0.0,
          anamorphicColor: params.anamorphicColor ? (params.anamorphicColor.isColor ? params.anamorphicColor.clone() : new THREE.Color(params.anamorphicColor)) : new THREE.Color(0x64b5f6),
          anamorphicColorHex: params.anamorphicColorHex || '#64b5f6',
          fisheyeStrength: params.fisheyeStrength !== undefined ? params.fisheyeStrength : 0.0,
          fisheyeRadius: params.fisheyeRadius !== undefined ? params.fisheyeRadius : 1.0,
          chromaticAberration: params.chromaticAberration !== undefined ? params.chromaticAberration : 0.015,
          vignetteBoost: params.vignetteBoost !== undefined ? params.vignetteBoost : 1.08,
          vignetteReduction: params.vignetteReduction !== undefined ? params.vignetteReduction : 0.55,
          noiseIntensity: params.noiseIntensity !== undefined ? params.noiseIntensity : 0.012,
          gamma: params.gamma !== undefined ? params.gamma : 1.0,
          minInputLevel: params.minInputLevel !== undefined ? params.minInputLevel : 0.0,
          maxInputLevel: params.maxInputLevel !== undefined ? params.maxInputLevel : 1.0,
          exposure: params.exposure !== undefined ? params.exposure : 1.0,
        };

        this.sceneTarget = createFBO(1, 1, { type: THREE.HalfFloatType });

        this.bloomPass = new BloomPass(this.settings.bloomStrength, this.settings.bloomRadius, this.settings.bloomThreshold, 5);
        this.moonScreenPos = new THREE.Vector3(0.5, 0.65, 1.0);
        this.moonInFront = true;

        this.godRaysMaskShader = new THREE.RawShaderMaterial({
          uniforms: { inputTexture: { value: null }, threshold: { value: this.settings.raysThreshold } },
          vertexShader: orthoVertexShader,
          fragmentShader: godRaysDepthMaskShader,
          glslVersion: THREE.GLSL3,
        });
        this.godRaysMaskPass = new ShaderPass(this.godRaysMaskShader, { format: THREE.RGBAFormat, type: THREE.HalfFloatType });

        this.godRaysGenShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            vSunPositionScreenSpace: { value: this.moonScreenPos },
            fStepSize: { value: 1.0 },
            distanceAttenuation: { value: this.settings.raysDistanceAttenuation },
            maxDensity: { value: this.settings.raysMaxDensity },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: godRaysGenerateShader,
          glslVersion: THREE.GLSL3,
        });
        this.godRaysPingPong = new ShaderPingPongPass(this.godRaysGenShader, { format: THREE.RGBAFormat, type: THREE.HalfFloatType });

        this.anamorphicBrightShader = new THREE.RawShaderMaterial({
          uniforms: { inputTexture: { value: null }, threshold: { value: this.settings.anamorphicThreshold }, smoothWidth: { value: 0.05 } },
          vertexShader: orthoVertexShader,
          fragmentShader: anamorphicBrightShader,
          glslVersion: THREE.GLSL3,
        });
        this.anamorphicBrightPass = new ShaderPass(this.anamorphicBrightShader, { format: THREE.RGBAFormat, type: THREE.HalfFloatType });

        this.anamorphicBlurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            resolution: { value: new THREE.Vector2(1, 1) },
            samples: { value: this.settings.anamorphicSamples },
            intensity: { value: this.settings.anamorphicIntensity },
            tintColor: { value: this.settings.anamorphicColor },
            bloomRadius: { value: this.settings.anamorphicRadius },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: anamorphicBlurShader,
          glslVersion: THREE.GLSL3,
        });
        this.anamorphicBlurPass = new ShaderPass(this.anamorphicBlurShader, { format: THREE.RGBAFormat, type: THREE.HalfFloatType });

        this.finalShader = new THREE.RawShaderMaterial({
          uniforms: {
            resolution: { value: new THREE.Vector2(1, 1) },
            bloomEnabled: { value: this.settings.bloomEnabled },
            bloomStrength: { value: this.settings.bloomStrength },
            raysEnabled: { value: this.settings.raysEnabled },
            raysStrength: { value: this.settings.raysStrength },
            raysColor: { value: this.settings.raysColor },
            anamorphicEnabled: { value: this.settings.anamorphicEnabled },

            blur3Texture: { value: this.bloomPass.blurPasses[3].texture },
            blur4Texture: { value: this.bloomPass.blurPasses[4].texture },
            raysTexture: { value: this.godRaysPingPong.texture },
            anamorphicTexture: { value: this.anamorphicBlurPass.texture },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: finalFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.finalPass = new ShaderPass(this.finalShader);

        this.rgbShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: this.finalPass.texture },
            fisheyeStrength: { value: this.settings.fisheyeStrength },
            fisheyeRadius: { value: this.settings.fisheyeRadius },
            chromaticAberrationAmount: { value: this.settings.chromaticAberration },
            minInputLevel: { value: this.settings.minInputLevel },
            maxInputLevel: { value: this.settings.maxInputLevel },

            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: colorFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.rgbPass = new ShaderPass(this.rgbShader);

        this.copyShader = new THREE.RawShaderMaterial({
          uniforms: { inputTexture: { value: null } },
          vertexShader: orthoVertexShader,
          fragmentShader: copyFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.copyPass = new ShaderPass(this.copyShader);
      }

      updateSettings() {
        this.bloomPass.enabled = this.settings.bloomEnabled;
        this.bloomPass.strength = this.settings.bloomStrength;
        this.bloomPass.radius = this.settings.bloomRadius;
        this.bloomPass.threshold = this.settings.bloomThreshold;

        this.godRaysMaskShader.uniforms.threshold.value = this.settings.raysThreshold;
        this.godRaysGenShader.uniforms.distanceAttenuation.value = this.settings.raysDistanceAttenuation;
        this.godRaysGenShader.uniforms.maxDensity.value = this.settings.raysMaxDensity;

        this.anamorphicBrightShader.uniforms.threshold.value = this.settings.anamorphicThreshold;
        this.anamorphicBlurShader.uniforms.samples.value = this.settings.anamorphicSamples;
        this.anamorphicBlurShader.uniforms.intensity.value = this.settings.anamorphicIntensity;
        this.anamorphicBlurShader.uniforms.tintColor.value.copy(this.settings.anamorphicColor);
        this.anamorphicBlurShader.uniforms.bloomRadius.value = this.settings.anamorphicRadius;

        this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
        this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
        this.finalShader.uniforms.raysEnabled.value = this.settings.raysEnabled && this.moonInFront;
        this.finalShader.uniforms.raysStrength.value = this.settings.raysStrength;
        this.finalShader.uniforms.raysColor.value.copy(this.settings.raysColor);
        this.finalShader.uniforms.anamorphicEnabled.value = this.settings.anamorphicEnabled;
        this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
        this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
        this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;

        this.rgbShader.uniforms.fisheyeStrength.value = this.settings.fisheyeStrength;
        this.rgbShader.uniforms.fisheyeRadius.value = this.settings.fisheyeRadius;
        this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
        this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
        this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
        this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
      }

      setSize(w0, h0, dpr = 1) {
        const w = Math.max(1, Math.floor(w0 * dpr));
        const h = Math.max(1, Math.floor(h0 * dpr));
        this.sceneTarget.setSize(w, h);
        this.finalPass.setSize(w, h);
        this.finalShader.uniforms.resolution.value.set(w, h);
        this.bloomPass.setSize(w, h);

        const grW = Math.max(1, Math.round(w / 2));
        const grH = Math.max(1, Math.round(h / 2));
        this.godRaysMaskPass.setSize(grW, grH);
        this.godRaysPingPong.setSize(grW, grH);

        const anW = Math.max(1, Math.round(w / 4));
        const anH = Math.max(1, Math.round(h / 4));
        this.anamorphicBrightPass.setSize(anW, anH);
        this.anamorphicBlurPass.setSize(anW, anH);
        this.anamorphicBlurShader.uniforms.resolution.value.set(anW, anH);

        this.rgbPass.setSize(w, h);
        this.copyPass.setSize(w, h);
      }

      setAntialias(enabled) {
        this.settings.antialias = !!enabled;
      }

      setMoonScreenPosition(camera, moonWorldPos) {
        if (!this._camDir) {
          this._camDir = new THREE.Vector3();
          this._toMoon = new THREE.Vector3();
          this._ndc = new THREE.Vector3();
        }
        camera.getWorldDirection(this._camDir);
        this._toMoon.copy(moonWorldPos).sub(camera.position).normalize();
        const dot = this._camDir.dot(this._toMoon);
        if (dot <= 0.02) {
          this.moonInFront = false;
          this.finalShader.uniforms.raysEnabled.value = false;
          return;
        }
        this.moonInFront = true;
        const fade = THREE.MathUtils.clamp((dot - 0.02) / 0.15, 0.0, 1.0);
        this._ndc.copy(moonWorldPos).project(camera);
        const screenX = this._ndc.x * 0.5 + 0.5;
        const screenY = this._ndc.y * 0.5 + 0.5;
        const screenZ = fade;
        this.moonScreenPos.set(screenX, screenY, screenZ);
        this.godRaysGenShader.uniforms.vSunPositionScreenSpace.value.set(screenX, screenY, screenZ);
      }

      renderScene(scene, camera) {
        if (!this.settings.enabled) {
          this.renderer.render(scene, camera);
          return;
        }
        this.renderer.setRenderTarget(this.sceneTarget);
        this.renderer.render(scene, camera);
        this.renderer.setRenderTarget(null);
        this.render(this.sceneTarget.texture);
      }

      render(sourceTexture) {
        if (!this.settings.enabled) {
          this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
          this.copyPass.render(this.renderer, true);
          return;
        }
        this.updateSettings();

        // 1. Atmospheric Bloom
        this.bloomPass.source = sourceTexture;
        this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
        this.bloomPass.render(this.renderer);
        this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
        this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
        this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
        this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
        this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

        // 2. Three.js Godrays
        this.finalPass.shader.uniforms.raysTexture.value = this.godRaysPingPong.texture;
        if (this.settings.raysEnabled && this.settings.raysStrength > 0.001 && this.moonInFront) {
          this.godRaysMaskShader.uniforms.inputTexture.value = sourceTexture;
          this.godRaysMaskShader.uniforms.threshold.value = this.settings.raysThreshold;
          this.godRaysMaskPass.render(this.renderer);
          const filterLen = this.settings.raysDensity;
          const tapsPerPass = 6.0;
          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -1.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysMaskPass.texture;
          this.godRaysPingPong.render(this.renderer);
          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -2.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysPingPong.texture;
          this.godRaysPingPong.render(this.renderer);
          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -3.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysPingPong.texture;
          this.godRaysPingPong.render(this.renderer);
          this.finalPass.shader.uniforms.raysEnabled.value = true;
        } else {
          this.finalPass.shader.uniforms.raysEnabled.value = false;
        }

        // 3. Anamorphic Flare
        this.finalPass.shader.uniforms.anamorphicTexture.value = this.anamorphicBlurPass.texture;
        if (this.settings.anamorphicEnabled && this.settings.anamorphicIntensity > 0.001) {
          this.anamorphicBrightShader.uniforms.inputTexture.value = sourceTexture;
          this.anamorphicBrightShader.uniforms.threshold.value = this.settings.anamorphicThreshold;
          this.anamorphicBrightPass.render(this.renderer);
          this.anamorphicBlurShader.uniforms.inputTexture.value = this.anamorphicBrightPass.texture;
          this.anamorphicBlurShader.uniforms.samples.value = this.settings.anamorphicSamples;
          this.anamorphicBlurShader.uniforms.intensity.value = this.settings.anamorphicIntensity;
          this.anamorphicBlurShader.uniforms.tintColor.value.copy(this.settings.anamorphicColor);
          this.anamorphicBlurShader.uniforms.bloomRadius.value = this.settings.anamorphicRadius;
          this.anamorphicBlurPass.render(this.renderer);
          this.finalPass.shader.uniforms.anamorphicEnabled.value = true;
        } else {
          this.finalPass.shader.uniforms.anamorphicEnabled.value = false;
        }

        const randomTime = Math.random() * 1000.0;
        this.finalPass.shader.uniforms.time.value = randomTime;
        this.rgbPass.shader.uniforms.time.value = randomTime;

        this.finalPass.render(this.renderer);
        this.rgbPass.render(this.renderer, true);
      }

    // =========================================================================
    // TEXTURES: PUDDLE FLOOR & BRICK WALLS
    // =========================================================================
    function createPuddleTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#303030';
      ctx.fillRect(0, 0, 1024, 1024);

      // Noise grain
      const imgData = ctx.getImageData(0, 0, 1024, 1024);
      const data = imgData.data;
      for (let i = 0; i < data.length; i += 4) {
        const noise = (Math.random() - 0.5) * 45;
        data[i] = Math.min(255, Math.max(0, data[i] + noise));
        data[i+1] = Math.min(255, Math.max(0, data[i+1] + noise));
        data[i+2] = Math.min(255, Math.max(0, data[i+2] + noise));
      }
      ctx.putImageData(imgData, 0, 0);

      // Smooth reflective wet puddle pools
      for (let i = 0; i < 28; i++) {
        const px = Math.random() * 1024;
        const py = Math.random() * 1024;
        const rx = 80 + Math.random() * 160;
        const ry = 50 + Math.random() * 100;
        const angle = Math.random() * Math.PI;

        const pgrad = ctx.createRadialGradient(px, py, 15, px, py, rx);
        pgrad.addColorStop(0, 'rgba(12, 12, 12, 0.98)');
        pgrad.addColorStop(0.7, 'rgba(25, 25, 25, 0.85)');
        pgrad.addColorStop(1, 'rgba(48, 48, 48, 0)');

        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(angle);
        ctx.scale(1, ry / rx);
        ctx.fillStyle = pgrad;
        ctx.beginPath();
        ctx.arc(0, 0, rx, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(4, 4);
      return tex;
    }

    function createBrickTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#322822';
      ctx.fillRect(0, 0, 512, 512);

      const rows = 18;
      const rowHeight = 512 / rows;
      const brickWidth = 56;

      for (let r = 0; r < rows; r++) {
        const offset = (r % 2) * (brickWidth / 2);
        const y = r * rowHeight;
        for (let x = -brickWidth; x < 512 + brickWidth; x += brickWidth) {
          const shade = Math.floor(45 + Math.random() * 30);
          ctx.fillStyle = `rgb(${shade + 18}, ${shade + 8}, ${shade})`;
          ctx.fillRect(x + offset + 2, y + 2, brickWidth - 4, rowHeight - 4);
        }
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(6, 4);
      return tex;
    }

    // Soft feathered rectangle texture for floor light reflections
    function createFeatheredRectTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      const grad = ctx.createRadialGradient(128, 128, 20, 128, 128, 120);
      grad.addColorStop(0, 'rgba(255, 255, 255, 1.0)');
      grad.addColorStop(0.5, 'rgba(255, 255, 255, 0.6)');
      grad.addColorStop(0.85, 'rgba(255, 255, 255, 0.15)');
      grad.addColorStop(1.0, 'rgba(255, 255, 255, 0.0)');

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.roundRect(16, 32, 224, 192, 48);
      ctx.fill();

      return new THREE.CanvasTexture(canvas);
    }

    // Soft gradient texture for volumetric phone light beams
    function createBeamGradientTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createLinearGradient(0, 0, 0, 256);
      grad.addColorStop(0.0, 'rgba(255, 255, 255, 0.9)');
      grad.addColorStop(0.2, 'rgba(255, 255, 255, 0.55)');
      grad.addColorStop(0.65, 'rgba(255, 255, 255, 0.15)');
      grad.addColorStop(1.0, 'rgba(255, 255, 255, 0.0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 128, 256);
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.ClampToEdgeWrapping;
      return tex;
    }

    function initRenderer(antialiasBool) {
      const canvasEl = document.getElementById('webgl-canvas');
      if (renderer) renderer.dispose();

      renderer = new THREE.WebGLRenderer({
        canvas: canvasEl,
        antialias: antialiasBool,
        powerPreference: 'high-performance'
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(params.dpr);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = params.exposure;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      if (controls) controls.dispose();
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.enableZoom = true;
      controls.zoomSpeed = 1.0;
      controls.enablePan = true;
      controls.screenSpacePanning = true;
      controls.mouseButtons = {
        LEFT: params.dragPanMode ? THREE.MOUSE.PAN : THREE.MOUSE.ROTATE,
        MIDDLE: THREE.MOUSE.DOLLY,
        RIGHT: THREE.MOUSE.PAN
      };
      controls.touches = {
        ONE: params.dragPanMode ? THREE.TOUCH.PAN : THREE.TOUCH.ROTATE,
        TWO: THREE.TOUCH.DOLLY_PAN
      };
      controls.maxPolarAngle = Math.PI / 2 + 0.05;
      controls.minDistance = 4.0;
      controls.maxDistance = 140.0;
      controls.target.set(0, 8.8, 0);

      // Initialize PostProcessor Suite
      postProcessor = new PostProcessor(renderer, {
        enabled: true,
        antialias: params.antialias,
        bloomEnabled: true,
        bloomStrength: 0.9,
        bloomRadius: 0.5,
        bloomThreshold: 0.2,
        raysEnabled: true,
        raysStrength: 0.75,
        raysThreshold: 0.16,
        raysColorHex: '#5ca8ff',
        anamorphicEnabled: false, // Default off as requested
        chromaticAberration: 0.015,
        vignetteBoost: 1.08,
        vignetteReduction: 0.55,
        noiseIntensity: 0.012,
        exposure: params.exposure
      });
      postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);
    }

      // 4 Heavy Angled Arms supporting the main wheel

        arm.position.set(Math.cos(ang) * 4.2, 18.5, Math.sin(ang) * 4.2);

        chandelierGroup.add(arm);

      hub.position.y = 15.0;

        params.chandelierLightIntensity,
        50,
        1.5
      );
      chandelierPointLight.position.set(0, 14.5, 0);
      chandelierGroup.add(chandelierPointLight);

      // Main Outer Ring (Upper Tier)
      const ring1Radius = 11.2;
      const ring1 = new THREE.Mesh(new THREE.TorusGeometry(ring1Radius, 0.42, 16, 64), rustSteelMat);
      ring1.rotation.x = Math.PI / 2;
      ring1.position.y = 15.0;
      chandelierGroup.add(ring1);

      // Radial Spokes connecting to Hub
      const numSpokes = 12;
      for (let i = 0; i < numSpokes; i++) {
        const ang = (i / numSpokes) * Math.PI * 2;
        const px = Math.cos(ang) * ring1Radius;
        const pz = Math.sin(ang) * ring1Radius;

        const spoke = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, ring1Radius - 1.2, 8), rustSteelMat);
        spoke.position.set(px * 0.5, 15.0, pz * 0.5);
        spoke.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), new THREE.Vector3(px, 0, pz).normalize());
        chandelierGroup.add(spoke);

        // Heavy Pulley Spools mounted around outer rim (img 2)
        const pulley = new THREE.Mesh(new THREE.CylinderGeometry(0.95, 0.95, 0.45, 20), rustSteelMat);
        pulley.position.set(px, 15.3, pz);
        pulley.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), new THREE.Vector3(-pz, 0, px).normalize());
        chandelierGroup.add(pulley);

        const bracket = new THREE.Mesh(new THREE.BoxGeometry(0.35, 1.4, 0.65), rustSteelMat);
        bracket.position.set(px, 15.6, pz);
        bracket.rotation.y = -ang;
        chandelierGroup.add(bracket);
      }

      // Lower Secondary Concentric Ring (Inner Tier)
      const ring2Radius = 7.0;
      const ring2 = new THREE.Mesh(new THREE.TorusGeometry(ring2Radius, 0.32, 16, 48), rustSteelMat);
      ring2.rotation.x = Math.PI / 2;
      ring2.position.y = 9.2;
      chandelierGroup.add(ring2);

      // Connecting struts between Ring 1 and Ring 2
      for (let i = 0; i < 8; i++) {
        const ang = (i / 8) * Math.PI * 2;
        const strut = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 7.8, 8), rustSteelMat);
        const x1 = Math.cos(ang) * ring1Radius * 0.78;
        const z1 = Math.sin(ang) * ring1Radius * 0.78;
        const x2 = Math.cos(ang) * ring2Radius;
        const z2 = Math.sin(ang) * ring2Radius;
        strut.position.set((x1 + x2) / 2, 12.1, (z1 + z2) / 2);
        strut.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), new THREE.Vector3(x1 - x2, 5.8, z1 - z2).normalize());
        chandelierGroup.add(strut);
      }

      // =======================================================================
      // DANGLING SMARTPHONES & SOFT VOLUMETRIC GODRAY SHAFTS (matching img 2)
      // =======================================================================
      // Symmetrical tiered distribution forming the conical silhouette
      const tiers = [
        { count: 20, radius: 10.8, minY: 8.5, maxY: 12.8, ringY: 15.0 }, // Outer high ring
        { count: 16, radius: 7.8, minY: 6.2, maxY: 10.5, ringY: 15.0 },  // Mid ring
        { count: 12, radius: 5.2, minY: 4.0, maxY: 7.8, ringY: 9.2 },   // Inner lower ring
        { count: 6,  radius: 2.8, minY: 2.2, maxY: 5.5, ringY: 9.2 }    // Center lowest drop
      ];

      let phoneIndex = 0;

      tiers.forEach((tier) => {
        for (let i = 0; i < tier.count; i++) {
          const angle = (i / tier.count) * Math.PI * 2 + (Math.random() - 0.5) * 0.1;
          const r = tier.radius + (Math.random() - 0.5) * 0.5;
          const attachX = Math.cos(angle) * r;
          const attachZ = Math.sin(angle) * r;
          const attachY = tier.ringY;

          // Cascade height
          const phoneY = tier.minY + Math.random() * (tier.maxY - tier.minY);
          const cableLength = attachY - phoneY;

          const phoneHolder = new THREE.Group();
          phoneHolder.position.set(attachX, attachY, attachZ);

          // Suspension Cable
          const cableGeo = new THREE.CylinderGeometry(0.016, 0.016, cableLength, 6);
          const cable = new THREE.Mesh(cableGeo, rustSteelMat);
          cable.position.set(0, -cableLength / 2, 0);
          phoneHolder.add(cable);

          // Top Cable Ring Attachment
          const hangerRing = new THREE.Mesh(new THREE.TorusGeometry(0.12, 0.025, 8, 16), rustSteelMat);
          hangerRing.position.set(0, -cableLength, 0);
          phoneHolder.add(hangerRing);

          // Smartphone Assembly
          const phoneBodyGroup = new THREE.Group();
          phoneBodyGroup.position.set(0, -cableLength - 1.35, 0);

          // Dark Aluminum Chassis
          const bodyGeo = new THREE.BoxGeometry(1.35, 2.7, 0.12);
          const chassisMat = new THREE.MeshStandardMaterial({
            color: 0x141820,
            metalness: 0.9,
            roughness: 0.3
          });
          const body = new THREE.Mesh(bodyGeo, chassisMat);
          phoneBodyGroup.add(body);

          // Rear Camera Module
          const camBump = new THREE.Mesh(
            new THREE.BoxGeometry(0.5, 0.5, 0.05),
            new THREE.MeshStandardMaterial({ color: 0x080a0e, metalness: 0.95, roughness: 0.2 })
          );
          camBump.position.set(0.35, 0.95, -0.07);
          phoneBodyGroup.add(camBump);

          // Screen Canvas Texture
          const { canvas, render } = createNotificationCanvas(phoneIndex, themeColors);
          const screenTex = new THREE.CanvasTexture(canvas);
          screenTex.anisotropy = 4;

          const chosenColorHex = themeColors[phoneIndex % themeColors.length];
          const screenMat = new THREE.MeshStandardMaterial({
            map: screenTex,
            emissive: new THREE.Color(chosenColorHex),
            emissiveMap: screenTex,
            emissiveIntensity: params.screenGlowBoost,
            roughness: 0.08,
            metalness: 0.1
          });

          const screenGeo = new THREE.PlaneGeometry(1.28, 2.62);
          const screenMesh = new THREE.Mesh(screenGeo, screenMat);
          screenMesh.position.z = 0.065;
          phoneBodyGroup.add(screenMesh);

          // Orient screens to face mostly outward/camera like in img 2
          phoneBodyGroup.rotation.y = angle + Math.PI / 2 + (Math.random() - 0.5) * 0.35;

          phoneHolder.add(phoneBodyGroup);
          chandelierGroup.add(phoneHolder);

          // Soft Ethereal Volumetric Light Shaft (Hardware-reliable MeshBasicMaterial)
          const beamLength = phoneY + 1.2;
          const beamTopRadius = 0.4;
          const beamBottomRadius = 2.2 + Math.random() * 0.8;
          const beamGeo = new THREE.CylinderGeometry(beamTopRadius, beamBottomRadius, beamLength, 24, 1, true);

          const beamMat = new THREE.MeshBasicMaterial({
            map: beamGradientTex,
            color: new THREE.Color(chosenColorHex),
            transparent: true,
            opacity: 0.32 * params.volumetricIntensity,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            side: THREE.DoubleSide
          });

          const beamMesh = new THREE.Mesh(beamGeo, beamMat);
          beamMesh.position.set(0, -beamLength / 2, 0.4);
          beamMesh.rotation.x = 0.08;
          phoneBodyGroup.add(beamMesh);

          // Ground Light Strophes (Feathered colored rectangular reflections on wet floor from img 2)
          const patchGeo = new THREE.PlaneGeometry(2.4 + Math.random() * 1.2, 1.5 + Math.random() * 0.8);
          const patchMat = new THREE.MeshBasicMaterial({
            map: featheredRectTex,
            color: new THREE.Color(chosenColorHex),
            transparent: true,
            opacity: 0.55 * params.floorLightIntensity,
            blending: THREE.AdditiveBlending,
            depthWrite: false
          });

          const patchMesh = new THREE.Mesh(patchGeo, patchMat);
          patchMesh.rotation.x = -Math.PI / 2;
          patchMesh.rotation.z = angle + (Math.random() - 0.5) * 0.4;
          patchMesh.position.set(attachX * 1.05, 0.02, attachZ * 1.05);
          scene.add(patchMesh);
          floorPatches.push({ mesh: patchMesh, baseColor: chosenColorHex, angle, r: r * 1.05 });

          phoneMeshes.push({
            holder: phoneHolder,
            bodyGroup: phoneBodyGroup,
            cableLength,
            swayFreq: 0.6 + Math.random() * 0.5,
            swayPhase: Math.random() * Math.PI * 2,
            swayAmp: 0.035 + Math.random() * 0.045,
            canvasRender: render,
            screenTex,
            screenMat,
            beamMesh,
            beamMat,
            colorHex: chosenColorHex,
            index: phoneIndex
          });

          lightBeams.push(beamMesh);
          phoneIndex++;
        }
      });

      scene.add(chandelierGroup);
    }

    // =========================================================================
    // THEME APPLICATION
    // =========================================================================
    function applyTheme() {
      const active = COLOR_SCHEMES[params.colorScheme] || COLOR_SCHEMES['Original'];

      if (params.greenScreen) {
        scene.background = new THREE.Color(0x00ff00);
        scene.fog = null;
        if (warehouseGroup) warehouseGroup.visible = false;
        floorPatches.forEach(p => p.mesh.visible = false);
      } else {
        scene.background = new THREE.Color(active.bg);
        scene.fog = new THREE.FogExp2(new THREE.Color(params.fogColor || active.fog), params.fogDensity);
        if (warehouseGroup) warehouseGroup.visible = true;
        floorPatches.forEach(p => p.mesh.visible = true);
      }

      if (warehouseGroup) {
        warehouseGroup.traverse(obj => {
          if (obj.isMesh && obj !== floorMesh) {
            if (obj.material && obj.material.color) {
              if (obj.material.map) {
                obj.material.color.set(params.warehouseColor);
              } else {
                obj.material.color.set(params.steelColor);
              }
            }
          }
        });
      }

      if (floorMesh && floorMesh.material) {
        floorMesh.material.color.set(active.floorTint);
      }

      if (skylightDirect) {
        skylightDirect.color.set(active.skylight);
        skylightDirect.intensity = params.skylightIntensity;
      }

      if (hemiLight) {
        hemiLight.intensity = params.ambientIntensity;
      }

      if (ambientLight) {
        ambientLight.intensity = params.ambientIntensity * 0.5;
      }

      if (chandelierPointLight) {
        chandelierPointLight.color.set(active.chandelierLight);
        chandelierPointLight.intensity = params.chandelierLightIntensity;
      }

      // Update Screens, Beams, and Floor Reflections
      const themeColors = active.screens;
      phoneMeshes.forEach(item => {
        const chosenColor = themeColors[item.index % themeColors.length];
        item.colorHex = chosenColor;
        item.screenMat.emissive.set(chosenColor);
        item.screenMat.emissiveIntensity = params.screenGlowBoost;
        item.beamMat.color.set(chosenColor);
        item.beamMat.opacity = 0.32 * params.volumetricIntensity;
        item.canvasRender(clock.getElapsedTime());
        item.screenTex.needsUpdate = true;
      });

      floorPatches.forEach((patch, idx) => {
        const chosenColor = themeColors[idx % themeColors.length];
        patch.baseColor = chosenColor;
        patch.mesh.material.color.set(chosenColor);
        patch.mesh.material.opacity = 0.55 * params.floorLightIntensity;
      });
    }

    // =========================================================================
    // PROCEDURAL RE-ROLL VARIATION (NEVER modifies PostProcessor settings)
    // =========================================================================
    function rerollSceneVariation() {
      // Pick random color scheme
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      params.colorScheme = randomScheme;

      const newTheme = COLOR_SCHEMES[randomScheme];
      params.warehouseColor = newTheme.warehouse;
      params.steelColor = newTheme.steel;
      params.fogColor = newTheme.fog;

      // Randomize motion dynamics
      params.chandelierSpin = (Math.random() > 0.5 ? 1 : -1) * (0.15 + Math.random() * 0.35);
      params.pendulumSway = 0.3 + Math.random() * 0.6;
      params.exposure = 0.95 + Math.random() * 0.4;
      renderer.toneMappingExposure = params.exposure;

      params.screenGlowBoost = 1.6 + Math.random() * 1.4;
      params.volumetricIntensity = 0.8 + Math.random() * 0.6;
      params.floorLightIntensity = 0.9 + Math.random() * 0.6;

      const animations = [
        'Cinematic Orbit (Img 2)',
        'Low Floor Prowl',
        'Spiral Descent',
        'Screen Pendulum Float',
        'Catwalk Pan',
        'Crane Elevation',
        'Mist Wanderer'
      ];
      params.animationMode = animations[Math.floor(Math.random() * animations.length)];

      // IMPORTANT REQUIREMENT:
      // "when I click for random scene do not shuffle or change Postprocessing settings"
      // PostProcessor settings are strictly preserved!

      applyTheme();

      if (gui) {
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      }
    }

    // =========================================================================
    // 8 PRECONFIGURED CAMERA ANIMATIONS (Tailored to match img 2 aesthetic)
    // =========================================================================
    function updateCameraAnimation(time) {
      const t = time * params.animSpeed;

      switch (params.animationMode) {
        case 'Cinematic Orbit (Img 2)': {
          // Slow, stately orbit around chandelier at eye level exactly matching img 2
          const angle = t * 0.05;
          const r = 32.0;
          camera.position.x = Math.sin(angle) * r;
          camera.position.z = Math.cos(angle) * r;
          camera.position.y = 7.2 + Math.sin(t * 0.03) * 1.5;
          controls.target.set(0, 8.8, 0);
          break;
        }

        case 'Low Floor Prowl': {
          const angle = t * 0.045;
          const r = 24.0;
          camera.position.x = Math.sin(angle) * r;
          camera.position.z = Math.cos(angle) * r;
          camera.position.y = 1.6 + Math.sin(t * 0.08) * 0.4;
          controls.target.set(0, 9.5, 0);
          break;
        }

        case 'Spiral Descent': {
          const angle = t * 0.06;
          const cycle = (Math.sin(t * 0.04) * 0.5 + 0.5);
          camera.position.y = 4.5 + cycle * 20.0;
          const r = 18.0 + (1.0 - cycle) * 12.0;
          camera.position.x = Math.sin(angle) * r;
          camera.position.z = Math.cos(angle) * r;
          controls.target.set(0, camera.position.y * 0.5 + 4.0, 0);
          break;
        }

        case 'Screen Pendulum Float': {
          const dist = 18.0 + Math.sin(t * 0.1) * 6.0;
          const angle = t * 0.04;
          camera.position.x = Math.sin(angle) * dist;
          camera.position.z = Math.cos(angle) * dist;
          camera.position.y = 7.5 + Math.cos(t * 0.07) * 2.2;
          controls.target.set(Math.sin(angle) * 3.5, 8.5, Math.cos(angle) * 3.5);
          break;
        }

        case 'Catwalk Pan': {
          camera.position.x = 32.0 + Math.sin(t * 0.03) * 4.0;
          camera.position.y = 16.5 + Math.cos(t * 0.02) * 1.2;
          camera.position.z = 18.0 + Math.cos(t * 0.03) * 10.0;
          controls.target.set(0, 9.0, 0);
          break;
        }

        case 'Crane Elevation': {
          const angle = 0.35;
          const r = 28.0;
          const hNorm = Math.sin(t * 0.06) * 0.5 + 0.5;
          camera.position.y = 3.2 + hNorm * 24.0;
          camera.position.x = Math.sin(angle) * r;
          camera.position.z = Math.cos(angle) * r;
          controls.target.set(0, camera.position.y * 0.65 + 3.0, 0);
          break;
        }

        case 'Mist Wanderer': {
          camera.position.x = Math.sin(t * 0.05) * 28.0;
          camera.position.z = Math.sin(t * 0.1) * 20.0;
          camera.position.y = 6.8 + Math.cos(t * 0.06) * 2.8;
          controls.target.set(0, 8.8, 0);
          break;
        }

        case 'Static (Manual Orbit)':
        default:
          // Manual camera inspection
          break;
      }
    }

    // =========================================================================
    // WINDOW & POINTER EVENTS
    // =========================================================================
    function setupWindowEvents() {
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        if (postProcessor) {
          postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);
        }
      });

      // Press "H" to toggle UI visibility
      window.addEventListener('keydown', (e) => {
        if (e.key === 'h' || e.key === 'H') {
          gui._hidden ? gui.show() : gui.hide();
        }
      });

      // Click to re-roll scene variation (distinguishing click from orbit drag)
      let pointerDownX = 0;
      let pointerDownY = 0;
      let pointerDownTime = 0;

      window.addEventListener('pointerdown', (e) => {
        pointerDownX = e.clientX;
        pointerDownY = e.clientY;
        pointerDownTime = performance.now();
      });

      window.addEventListener('pointerup', (e) => {
        const dist = Math.hypot(e.clientX - pointerDownX, e.clientY - pointerDownY);
        const duration = performance.now() - pointerDownTime;

        if (e.target.closest('.lil-gui')) return;

        if (dist < 6 && duration < 350 && params.clickToReroll) {
          rerollSceneVariation();
        }
      });
    }

    // =========================================================================
    // ANIMATION & RENDER LOOP
    // =========================================================================
    let lastCountdownUpdate = 0;
    const chandelierCenterPos = new THREE.Vector3();

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const elapsed = clock.getElapsedTime() * params.animSpeed;

      // Slow majestic rotation of chandelier (matching img 2)
      if (chandelierGroup) {
        chandelierGroup.rotation.y += params.chandelierSpin * delta * params.animSpeed * 0.35;
      }

      // Smooth pendulum sway of dangling phones
      const swayPower = params.pendulumSway;
      phoneMeshes.forEach(phone => {
        const timeVal = elapsed * phone.swayFreq + phone.swayPhase;
        const swayAngleX = Math.sin(timeVal) * phone.swayAmp * swayPower;
        const swayAngleZ = Math.cos(timeVal * 0.9) * phone.swayAmp * swayPower;

        phone.bodyGroup.rotation.x = swayAngleX;
        phone.bodyGroup.rotation.z = swayAngleZ;

        // Soft rhythmic breathing of glow
        const pulse = 0.88 + Math.sin(elapsed * 2.5 + phone.index) * 0.12;
        phone.screenMat.emissiveIntensity = params.screenGlowBoost * pulse;
        phone.beamMat.opacity = 0.32 * params.volumetricIntensity * pulse;
      });

      // Synchronize floor light patches with chandelier rotation
      if (chandelierGroup) {
        const chanRotY = chandelierGroup.rotation.y;
        floorPatches.forEach((patch, idx) => {
          const curAngle = patch.angle + chanRotY;
          patch.mesh.position.x = chandelierGroup.position.x + Math.cos(curAngle) * patch.r;
          patch.mesh.position.z = chandelierGroup.position.z + Math.sin(curAngle) * patch.r;
          patch.mesh.rotation.z = curAngle;

          const pulse = 0.8 + Math.sin(elapsed * 2.0 + idx * 0.4) * 0.2;
          patch.mesh.material.opacity = 0.55 * params.floorLightIntensity * pulse;
        });
      }

      // Update countdowns & notifications
      if (elapsed - lastCountdownUpdate > 0.1) {
        lastCountdownUpdate = elapsed;
        phoneMeshes.forEach(phone => {
          if (phone.canvasRender) {
            phone.canvasRender(elapsed);
            phone.screenTex.needsUpdate = true;
          }
        });
      }

      // Update camera shot
      updateCameraAnimation(elapsed);
      controls.update();

      // Track chandelier center for Godrays screen position
      if (postProcessor && chandelierGroup) {
        chandelierCenterPos.set(chandelierGroup.position.x, chandelierGroup.position.y + 11.5, chandelierGroup.position.z);
        postProcessor.setMoonScreenPosition(camera, chandelierCenterPos);
        postProcessor.renderScene(scene, camera);
      } else {
        renderer.render(scene, camera);
      }
    }

    initEngine();
    animate();
  </script>
</body>
