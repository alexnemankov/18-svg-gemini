<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FLYING PAPERS BACKGROUND</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.140.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.140.0/examples/jsm/"
    }
  }
  </script>
  <style>
    body, html, #app {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    #app {
      overflow: hidden;
      touch-action: pan-up;
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      text-align: center;
      text-shadow: 0 0 5px #000000, 0 0 20px #000;
      user-select: none;
    }

    #app h1 {
      --fontSize: 50px;
      --lineHeight: 70px;
      width: auto;
      height: calc(2 * var(--lineHeight));
      line-height: var(--lineHeight);
      margin: calc(50vh - var(--lineHeight)) auto 0;
      font-size: var(--fontSize);
    }

    #app a {
      margin-top: 10px;
      display: inline-block;
      text-decoration: none;
      color: #fff;
    }

    #app canvas {
      display: block;
      position: fixed;
      z-index: -1;
      top: 0;
      left: 0;
    }

    body {
      cursor: none;
    }

    /* Modern Custom Glassmorphism UI Panel */
    #settings-panel {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 310px;
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      background: rgba(12, 14, 24, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      padding: 16px;
      color: #e0e0e0;
      font-family: 'Montserrat', sans-serif;
      font-size: 12px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
      z-index: 99999;
      transition: opacity 0.3s ease, transform 0.3s ease;
      cursor: auto !important;
    }

    #settings-panel * {
      cursor: auto !important;
      user-select: none;
    }

    #settings-panel.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateY(-10px);
    }

    .ui-title {
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      padding-bottom: 8px;
      color: #ffffff;
    }

    .ui-group {
      margin-bottom: 14px;
    }

    .ui-group-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: #00f0ff;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .ui-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .ui-row label {
      color: #cccccc;
      font-size: 12px;
      flex: 1;
    }

    .ui-input, .ui-select, .ui-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      color: #ffffff;
      padding: 5px 8px;
      font-size: 12px;
      outline: none;
      font-family: inherit;
      transition: background 0.2s, border-color 0.2s;
    }

    .ui-select {
      width: 150px;
    }

    .ui-select option {
      background: #121420;
      color: #ffffff;
    }

    .ui-input[type="color"] {
      width: 36px;
      height: 26px;
      padding: 2px;
      border-radius: 4px;
      cursor: pointer !important;
    }

    .ui-input[type="range"] {
      width: 120px;
      accent-color: #00f0ff;
    }

    .ui-btn {
      width: 100%;
      padding: 8px;
      margin-top: 4px;
      background: rgba(0, 240, 255, 0.15);
      border: 1px solid rgba(0, 240, 255, 0.4);
      color: #00f0ff;
      font-weight: 700;
      cursor: pointer !important;
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    .ui-btn:hover {
      background: rgba(0, 240, 255, 0.3);
    }

    .ui-btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.2);
      color: #bbbbbb;
    }

    .ui-btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
    }

    .ui-switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }

    .ui-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer !important;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(255, 255, 255, 0.2);
      transition: .3s;
      border-radius: 20px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #00f0ff;
    }

    input:checked + .slider:before {
      transform: translateX(16px);
    }
  </style>
</head>
<body>
  <div id="app">
   
  </div>

  <input type="file" id="texture-file-input" accept="image/*" style="display: none;">

  <!-- Custom Sleek Settings UI Panel -->
  <div id="settings-panel">
    <div class="ui-title">
      <span>⚙️ Settings</span>
      <span style="font-size: 10px; color: #888; text-transform: none;">[H] to hide</span>
    </div>

    <!-- Green Screen -->
    <div class="ui-group">
      <div class="ui-group-title">Background Mode</div>
      <div class="ui-row">
        <label for="green-screen-toggle">Green Screen (#00ff00)</label>
        <label class="ui-switch">
          <input type="checkbox" id="green-screen-toggle">
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <!-- Color Schemes & Custom Pickers -->
    <div class="ui-group">
      <div class="ui-group-title">Color Palette</div>
      <div class="ui-row">
        <label>Preset Scheme</label>
        <select id="color-scheme-select" class="ui-select"></select>
      </div>
      <div class="ui-row">
        <label>Color 1</label>
        <input type="color" id="col1-picker" class="ui-input">
      </div>
      <div class="ui-row">
        <label>Color 2</label>
        <input type="color" id="col2-picker" class="ui-input">
      </div>
      <div class="ui-row">
        <label>Background</label>
        <input type="color" id="bg-picker" class="ui-input">
      </div>
    </div>

    <!-- 3D Object Presets & Upload -->
    <div class="ui-group">
      <div class="ui-group-title">3D Objects & Texture</div>
      <div class="ui-row">
        <label>3D Object Model</label>
        <select id="object-model-select" class="ui-select"></select>
      </div>
      <button id="upload-tex-btn" class="ui-btn">📁 Upload Custom Texture</button>
      <button id="clear-tex-btn" class="ui-btn ui-btn-secondary">↺ Clear Custom Texture</button>
      <div class="ui-row" style="margin-top: 6px;">
        <label style="font-size: 10px; color: #aaa;">Active Texture:</label>
        <span id="tex-status" style="font-size: 10px; color: #00f0ff;">None</span>
      </div>
    </div>

    <!-- Motion & Animations -->
    <div class="ui-group">
      <div class="ui-group-title">Animation & Motion</div>
      <div class="ui-row">
        <label>Animation Pattern</label>
        <select id="anim-pattern-select" class="ui-select"></select>
      </div>
      <div class="ui-row">
        <label>Animation Speed</label>
        <input type="range" id="anim-speed-slider" class="ui-input" min="0.1" max="3.0" step="0.1" value="1.0">
      </div>
    </div>

    <!-- Display & System -->
    <div class="ui-group">
      <div class="ui-group-title">Display & System</div>
      <div class="ui-row">
        <label>Pixel Ratio (DPR)</label>
        <input type="range" id="dpr-slider" class="ui-input" min="0.5" max="2.5" step="0.1" value="1.0">
      </div>
      <div class="ui-row">
        <label for="hide-cursor-toggle">Hide Cursor</label>
        <label class="ui-switch">
          <input type="checkbox" id="hide-cursor-toggle" checked>
          <span class="slider"></span>
        </label>
      </div>
    </div>
  </div>

    // ----------------------------------------------------
    // Initialize Butterflies Background Scene
    // ----------------------------------------------------
    const butterflies = Rt({
      el: document.getElementById('app'),
      eventsEl: document.body,
      gpgpuSize: 96,
      background: 0x080414,
      material: 'phong',
      materialParams: { shininess: 20 },
      colors: [0xff007f, 0x00f0ff],
      wingsScale: [1, 1, 1],
      wingsWidthSegments: 8,
      wingsHeightSegments: 8,
      wingsSpeed: 0.75,
      wingsDisplacementScale: 1.25,
      noiseCoordScale: 0.01,
      noiseTimeCoef: 0.0005,
      noiseIntensity: 0.0025,
      attractionRadius1: 100,
      attractionRadius2: 150,
      maxVelocity: 0.1
    });

    const scene = butterflies.three.scene;
    const camera = butterflies.three.camera;
    const renderer = butterflies.three.renderer;

    // ----------------------------------------------------
    // Presets Configurations
    // ----------------------------------------------------
    const colorPresets = {
      'Neon Cyberpunk': { colors: [0xff007f, 0x00f0ff], col1: '#ff007f', col2: '#00f0ff', bg: '#080414' },
      'Golden Sunset':  { colors: [0xffaa00, 0xff3300], col1: '#ffaa00', col2: '#ff3300', bg: '#180508' },
      'Toxic Emerald':  { colors: [0x00ff88, 0x00b8ff], col1: '#00ff88', col2: '#00b8ff', bg: '#03120e' },
      'Pastel Dreams':  { colors: [0xffb7b2, 0xc7ceea], col1: '#ffb7b2', col2: '#c7ceea', bg: '#111625' },
      'Monochrome':     { colors: [0xffffff, 0x666666], col1: '#ffffff', col2: '#666666', bg: '#050505' }
    };

    const objectPresets = {
      'Flying Papers': [1.2, 1.6, 0.5],
      'Butterfly Wings': [1.8, 1.0, 1.0],
      'Curved Leaves': [0.8, 2.2, 0.6],
      'Diamond Shards': [1.5, 1.5, 1.5],
      'Ribbon Tags': [0.5, 3.0, 0.3]
    };

    const animationPresets = [
      'Orbit Drift',
      'Floating Vortex',
      'Gentle Wave',
      'Zen Pulse',
      'Static View'
    ];

    // State parameters
    const params = {
      greenScreen: false,
      colorPreset: 'Neon Cyberpunk',
      color1: colorPresets['Neon Cyberpunk'].col1,
      color2: colorPresets['Neon Cyberpunk'].col2,
      backgroundColor: colorPresets['Neon Cyberpunk'].bg,
      objectType: 'Flying Papers',
      animationPreset: 'Orbit Drift',
      animSpeed: 1.0,
      dpr: Math.min(window.devicePixelRatio, 2),
      hideCursor: true,
      customTextureName: 'None'
    };

    // ----------------------------------------------------
    // Custom UI DOM References & Setup
    // ----------------------------------------------------
    const panel = document.getElementById('settings-panel');
    const greenScreenToggle = document.getElementById('green-screen-toggle');
    const colorSchemeSelect = document.getElementById('color-scheme-select');
    const col1Picker = document.getElementById('col1-picker');
    const col2Picker = document.getElementById('col2-picker');
    const bgPicker = document.getElementById('bg-picker');
    const objectModelSelect = document.getElementById('object-model-select');
    const uploadTexBtn = document.getElementById('upload-tex-btn');
    const clearTexBtn = document.getElementById('clear-tex-btn');
    const texStatus = document.getElementById('tex-status');
    const animPatternSelect = document.getElementById('anim-pattern-select');
    const animSpeedSlider = document.getElementById('anim-speed-slider');
    const dprSlider = document.getElementById('dpr-slider');
    const hideCursorToggle = document.getElementById('hide-cursor-toggle');
    const fileInput = document.getElementById('texture-file-input');

    let customTexture = null;

    // Populate Dropdowns
    Object.keys(colorPresets).forEach(name => {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name;
      colorSchemeSelect.appendChild(opt);
    });

    Object.keys(objectPresets).forEach(name => {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name;
      objectModelSelect.appendChild(opt);
    });

    animationPresets.forEach(name => {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name;
      animPatternSelect.appendChild(opt);
    });

    // Set initial UI values
    colorSchemeSelect.value = params.colorPreset;
    col1Picker.value = params.color1;
    col2Picker.value = params.color2;
    bgPicker.value = params.backgroundColor;
    objectModelSelect.value = params.objectType;
    animPatternSelect.value = params.animationPreset;
    animSpeedSlider.value = params.animSpeed;
    dprSlider.value = params.dpr;
    hideCursorToggle.checked = params.hideCursor;

    // Green Screen Handler
    greenScreenToggle.addEventListener('change', (e) => {
      params.greenScreen = e.target.checked;
      if (params.greenScreen) {
        scene.background = new THREE.Color(0x00ff00);
      } else {
        scene.background = new THREE.Color(params.backgroundColor);
      }
    });

    // Color Scheme Handler
    colorSchemeSelect.addEventListener('change', (e) => {
      const presetName = e.target.value;
      const preset = colorPresets[presetName];
      params.colorPreset = presetName;
      params.color1 = preset.col1;
      params.color2 = preset.col2;
      params.backgroundColor = preset.bg;

      col1Picker.value = preset.col1;
      col2Picker.value = preset.col2;
      bgPicker.value = preset.bg;

      if (!params.greenScreen) {
        scene.background = new THREE.Color(params.backgroundColor);
      }
      butterflies.setColors([new THREE.Color(preset.col1), new THREE.Color(preset.col2)]);
    });

    // Custom Color Pickers
    function updateColorsFromPickers() {
      params.color1 = col1Picker.value;
      params.color2 = col2Picker.value;
      params.backgroundColor = bgPicker.value;

      if (!params.greenScreen) {
        scene.background = new THREE.Color(params.backgroundColor);
      }
      butterflies.setColors([new THREE.Color(params.color1), new THREE.Color(params.color2)]);
    }

    col1Picker.addEventListener('input', updateColorsFromPickers);
    col2Picker.addEventListener('input', updateColorsFromPickers);
    bgPicker.addEventListener('input', updateColorsFromPickers);

    // 3D Object Model Handler
    objectModelSelect.addEventListener('change', (e) => {
      params.objectType = e.target.value;
      const scale = objectPresets[params.objectType];
      butterflies.uniforms.uWingsScale.value.set(scale[0], scale[1], scale[2]);
    });

    // Texture Upload Handler
    uploadTexBtn.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            if (customTexture) customTexture.dispose();
            customTexture = new THREE.CanvasTexture(img);
            customTexture.wrapS = THREE.RepeatWrapping;
            customTexture.wrapT = THREE.RepeatWrapping;
            
            scene.traverse((child) => {
              if (child.isInstancedMesh) {
                child.material.map = customTexture;
                child.material.needsUpdate = true;
              }
            });
            params.customTextureName = file.name;
            texStatus.textContent = file.name;
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    clearTexBtn.addEventListener('click', () => {
      if (customTexture) {
        customTexture.dispose();
        customTexture = null;
      }
      scene.traverse((child) => {
        if (child.isInstancedMesh) {
          child.material.map = null;
          child.material.needsUpdate = true;
        }
      });
      params.customTextureName = 'None';
      texStatus.textContent = 'None';
    });

    // Animation Handlers
    animPatternSelect.addEventListener('change', (e) => {
      params.animationPreset = e.target.value;
    });

    animSpeedSlider.addEventListener('input', (e) => {
      params.animSpeed = parseFloat(e.target.value);
      butterflies.uniforms.uWingsSpeed.value = 0.75 * params.animSpeed;
    });

    // DPR Handler
    dprSlider.addEventListener('input', (e) => {
      params.dpr = parseFloat(e.target.value);
      renderer.setPixelRatio(params.dpr);
    });

    // Hide Cursor Handler
    hideCursorToggle.addEventListener('change', (e) => {
      params.hideCursor = e.target.checked;
      document.body.style.cursor = params.hideCursor ? 'none' : 'auto';
    });

    // ----------------------------------------------------
    // Keyboard Shortcut "H" to Hide/Show UI
    // ----------------------------------------------------
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        panel.classList.toggle('hidden');
      }
    });

    // ----------------------------------------------------
    // Custom Animation Update Loop Integration
    // ----------------------------------------------------
    const clock = new THREE.Clock();

    function customAnimationLoop() {
      requestAnimationFrame(customAnimationLoop);
      const time = clock.getElapsedTime() * params.animSpeed;

      // Update camera preset animations
      const orbitControls = butterflies.three.options.orbitControls;
      if (params.animationPreset === 'Orbit Drift') {
        if (typeof orbitControls === 'object') orbitControls.autoRotate = true;
        camera.position.x = Math.sin(time * 0.2) * 70;
        camera.position.z = Math.cos(time * 0.2) * 70;
        camera.lookAt(0, 0, 0);
      } else if (params.animationPreset === 'Floating Vortex') {
        camera.position.x = Math.sin(time * 0.4) * 60;
        camera.position.y = 50 + Math.sin(time * 0.6) * 15;
        camera.position.z = Math.cos(time * 0.4) * 60;
        camera.lookAt(0, 0, 0);
        butterflies.uniforms.uNoiseIntensity.value = 0.005;
      } else if (params.animationPreset === 'Gentle Wave') {
        camera.position.x = Math.sin(time * 0.15) * 40;
        camera.position.y = 40 + Math.cos(time * 0.2) * 10;
        camera.position.z = 70;
        camera.lookAt(0, 0, 0);
        butterflies.uniforms.uWingsDisplacementScale.value = 2.0;
      } else if (params.animationPreset === 'Zen Pulse') {
        camera.position.z = 70 + Math.sin(time * 0.3) * 20;
        camera.lookAt(0, 0, 0);
        butterflies.uniforms.uWingsDisplacementScale.value = 1.0;
      } else if (params.animationPreset === 'Static View') {
        // Static camera view without camera movement
        butterflies.uniforms.uWingsDisplacementScale.value = 1.25;
      }
    }

    customAnimationLoop();
  </script>
</body>
</html>
