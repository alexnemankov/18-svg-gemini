    // ============================================================
    // MATHEMATICAL WAVE CALCULATION
    // ============================================================
    const degToRad = Math.PI / 180;

    function getWaveElevation(x, z, time) {
      // 1. S-curve lateral offset in X across Z depth (replicates original S-curve)
      const sOffset = PARAMS.sCurveAmp * Math.sin(z * PARAMS.sCurveFreq + time * 0.42);

      // 2. Wave amplitude traveling along Z slices (sin((frames + Y) * rad))
      const sliceAmp = PARAMS.waveAmp * Math.sin((z * PARAMS.waveFreq * 0.035 + time * PARAMS.travelSpeed * 1.8));

      // 3. Local coordinate relative to traveling wave center
      const u = x - sOffset;
      const halfW = PARAMS.packetWidth * 0.5;

      let hump = 0;
      if (Math.abs(u) <= halfW) {
        // Smooth localized cosine packet bump as in the codepen:
        // cos(rad * (x - offset) * I) smoothly tapering to 0 at edges
        const theta = (u / halfW) * Math.PI; // -PI to +PI
        hump = sliceAmp * (Math.cos(theta) + 1.0) * 0.5;
      }

      // 4. Subtle harmonic secondary fluid ripple for breathtaking 3D organic motion
      const ripple = PARAMS.rippleAmp * (
        Math.sin(x * 0.08 + time * 1.1) * Math.cos(z * 0.06 + time * 0.8)
      );

      return hump + ripple;
    }

    // ============================================================
    // 3D GEOMETRY BUILDER
    // ============================================================
    function buildWaveGeometry() {
      if (waveGroup) {
        scene.remove(waveGroup);
        if (ribbonMesh) {
          ribbonMesh.geometry.dispose();
        }
        if (ridgeLineSegments) {
          ridgeLineSegments.geometry.dispose();
        }
      }

      waveGroup = new THREE.Group();
      waveGroup.name = "waveLandscapeGroup";

      const M = PARAMS.ribbonCount;
      const N = PARAMS.xSegments;
      const W = PARAMS.widthSpan;
      const D = PARAMS.depthSpan;

      // Base Materials
      ribbonMaterial = new THREE.MeshPhysicalMaterial({
        color: new THREE.Color(PARAMS.objectColor),
        roughness: PARAMS.materialRoughness,
        metalness: PARAMS.materialMetalness,
        clearcoat: PARAMS.materialClearcoat,
        clearcoatRoughness: 0.1,
        transmission: PARAMS.materialTransmission,
        ior: 1.45,
        wireframe: PARAMS.wireframe || (PARAMS.geometryStyle === "Wireframe Landscape"),
        side: THREE.DoubleSide,
        flatShading: false
      });

      ridgeMaterial = new THREE.LineBasicMaterial({
        color: new THREE.Color(PARAMS.accentColor),
        linewidth: 2,
        transparent: true,
        opacity: 0.95
      });

      const style = PARAMS.geometryStyle;

      if (style === "3D Ribbon Curtains" || style === "Wireframe Landscape") {
        // Individual vertical ribbon curtains with top ridge line highlights
        const vertexCount = M * N * 2;
        const positions = new Float32Array(vertexCount * 3);
        const indices = [];

        for (let i = 0; i < M; i++) {
          const rowOffset = i * N * 2;
          for (let j = 0; j < N - 1; j++) {
            const topA = rowOffset + j * 2;
            const botA = topA + 1;
            const topB = rowOffset + (j + 1) * 2;
            const botB = topB + 1;

            // Two triangles for quad strip
            indices.push(topA, botA, topB);
            indices.push(topB, botA, botB);
          }
        }

        const geom = new THREE.BufferGeometry();
        geom.setAttribute("position", new THREE.BufferAttribute(positions, 3));
        geom.setIndex(indices);
        ribbonMesh = new THREE.Mesh(geom, ribbonMaterial);
        ribbonMesh.castShadow = true;
        ribbonMesh.receiveShadow = true;
        waveGroup.add(ribbonMesh);

        // Ridge lines along the top rim of every ribbon
        const lineVertexCount = M * (N - 1) * 2;
        const linePositions = new Float32Array(lineVertexCount * 3);
        const lineGeom = new THREE.BufferGeometry();
        lineGeom.setAttribute("position", new THREE.BufferAttribute(linePositions, 3));
        ridgeLineSegments = new THREE.LineSegments(lineGeom, ridgeMaterial);
        waveGroup.add(ridgeLineSegments);

      } else if (style === "Continuous Surface Matrix") {
        // Continuous 3D parametric wave terrain plane
        const geom = new THREE.PlaneGeometry(W, D, N - 1, M - 1);
        geom.rotateX(-Math.PI / 2);
        ribbonMesh = new THREE.Mesh(geom, ribbonMaterial);
        ribbonMesh.castShadow = true;
        ribbonMesh.receiveShadow = true;
        waveGroup.add(ribbonMesh);

        // Contour ridge lines along each X span
        const lineVertexCount = M * (N - 1) * 2;
        const linePositions = new Float32Array(lineVertexCount * 3);
        const lineGeom = new THREE.BufferGeometry();
        lineGeom.setAttribute("position", new THREE.BufferAttribute(linePositions, 3));
        ridgeLineSegments = new THREE.LineSegments(lineGeom, ridgeMaterial);
        waveGroup.add(ridgeLineSegments);

      } else if (style === "Tubular Wave Matrix") {
        // Grid of sleek curved wave ribbon bands
        const vertexCount = M * N * 2;
        const positions = new Float32Array(vertexCount * 3);
        const indices = [];

        for (let i = 0; i < M; i++) {
          const rowOffset = i * N * 2;
          for (let j = 0; j < N - 1; j++) {
            const topA = rowOffset + j * 2;
            const botA = topA + 1;
            const topB = rowOffset + (j + 1) * 2;
            const botB = topB + 1;
            indices.push(topA, botA, topB);
            indices.push(topB, botA, botB);
          }
        }

        const geom = new THREE.BufferGeometry();
        geom.setAttribute("position", new THREE.BufferAttribute(positions, 3));
        geom.setIndex(indices);
        ribbonMesh = new THREE.Mesh(geom, ribbonMaterial);
        waveGroup.add(ribbonMesh);

        const lineVertexCount = M * (N - 1) * 2;
        const linePositions = new Float32Array(lineVertexCount * 3);
        const lineGeom = new THREE.BufferGeometry();
        lineGeom.setAttribute("position", new THREE.BufferAttribute(linePositions, 3));
        ridgeLineSegments = new THREE.LineSegments(lineGeom, ridgeMaterial);
        waveGroup.add(ridgeLineSegments);
      }

      scene.add(waveGroup);
      updateWaveVertices(0);
    }

    // ============================================================
    // DYNAMIC VERTEX UPDATE (CALLED EVERY FRAME)
    // ============================================================
    function updateWaveVertices(time) {
      if (!ribbonMesh) return;

      const M = PARAMS.ribbonCount;
      const N = PARAMS.xSegments;
      const W = PARAMS.widthSpan;
      const D = PARAMS.depthSpan;
      const halfW = W * 0.5;
      const halfD = D * 0.5;
      const skirt = PARAMS.skirtDepth;
      const style = PARAMS.geometryStyle;

      if (style === "3D Ribbon Curtains" || style === "Wireframe Landscape" || style === "Tubular Wave Matrix") {
        const posAttr = ribbonMesh.geometry.attributes.position;
        const pos = posAttr.array;
        let vIdx = 0;

        const linePos = ridgeLineSegments ? ridgeLineSegments.geometry.attributes.position.array : null;
        let lIdx = 0;

        for (let i = 0; i < M; i++) {
          const z = -halfD + (i / (M - 1)) * D;

          let prevX = 0, prevY = 0;

          for (let j = 0; j < N; j++) {
            const x = -halfW + (j / (N - 1)) * W;
            const yTop = getWaveElevation(x, z, time);
            const yBot = yTop - skirt;

            // Top vertex
            pos[vIdx] = x;
            pos[vIdx + 1] = yTop;
            pos[vIdx + 2] = z;

            // Bottom vertex
            pos[vIdx + 3] = x;
            pos[vIdx + 4] = yBot;
            pos[vIdx + 5] = z;

            vIdx += 6;

            // Ridge line segments connecting adjacent top vertices
            if (linePos && j > 0) {
              linePos[lIdx] = prevX;
              linePos[lIdx + 1] = prevY + 0.05;
              linePos[lIdx + 2] = z;

              linePos[lIdx + 3] = x;
              linePos[lIdx + 4] = yTop + 0.05;
              linePos[lIdx + 5] = z;

              lIdx += 6;
            }

            prevX = x;
            prevY = yTop;
          }
        }

        posAttr.needsUpdate = true;
        ribbonMesh.geometry.computeVertexNormals();

        if (ridgeLineSegments) {
          ridgeLineSegments.geometry.attributes.position.needsUpdate = true;
        }

      } else if (style === "Continuous Surface Matrix") {
        const posAttr = ribbonMesh.geometry.attributes.position;
        const pos = posAttr.array;
        let vIdx = 0;

        const linePos = ridgeLineSegments ? ridgeLineSegments.geometry.attributes.position.array : null;
        let lIdx = 0;

        for (let i = 0; i < M; i++) {
          const z = -halfD + (i / (M - 1)) * D;
          let prevX = 0, prevY = 0;

          for (let j = 0; j < N; j++) {
            const x = -halfW + (j / (N - 1)) * W;
            const y = getWaveElevation(x, z, time);

            pos[vIdx] = x;
            pos[vIdx + 1] = y;
            pos[vIdx + 2] = z;
            vIdx += 3;

            if (linePos && j > 0) {
              linePos[lIdx] = prevX;
              linePos[lIdx + 1] = prevY + 0.05;
              linePos[lIdx + 2] = z;

              linePos[lIdx + 3] = x;
              linePos[lIdx + 4] = y + 0.05;
              linePos[lIdx + 5] = z;
              lIdx += 6;
            }

            prevX = x;
            prevY = y;
          }
        }

        posAttr.needsUpdate = true;
        ribbonMesh.geometry.computeVertexNormals();

        if (ridgeLineSegments) {
          ridgeLineSegments.geometry.attributes.position.needsUpdate = true;
        }
      }
    }

    // ============================================================
    // LIGHTING & SCENE ILLUMINATION
    // ============================================================
    function initLights() {
      hemiLight = new THREE.HemisphereLight(
        PARAMS.hemiSky,
        PARAMS.hemiGround,
        PARAMS.hemiIntensity * PARAMS.masterLightIntensity
      );
      scene.add(hemiLight);

      keyLight = new THREE.DirectionalLight(
        PARAMS.keyColor,
        PARAMS.keyIntensity * PARAMS.masterLightIntensity
      );
      keyLight.position.set(PARAMS.keyX, PARAMS.keyY, PARAMS.keyZ);
      keyLight.castShadow = true;
      keyLight.shadow.mapSize.width = 2048;
      keyLight.shadow.mapSize.height = 2048;
      keyLight.shadow.camera.near = 0.5;
      keyLight.shadow.camera.far = 300;
      keyLight.shadow.camera.left = -90;
      keyLight.shadow.camera.right = 90;
      keyLight.shadow.camera.top = 90;
      keyLight.shadow.camera.bottom = -90;
      keyLight.shadow.bias = -0.0005;
      scene.add(keyLight);

      fillLight = new THREE.DirectionalLight(
        PARAMS.fillColor,
        PARAMS.fillIntensity * PARAMS.masterLightIntensity
      );
      fillLight.position.set(PARAMS.fillX, PARAMS.fillY, PARAMS.fillZ);
      scene.add(fillLight);

      rimLight = new THREE.DirectionalLight(
        PARAMS.rimColor,
        PARAMS.rimIntensity * PARAMS.masterLightIntensity
      );
      rimLight.position.set(PARAMS.rimX, PARAMS.rimY, PARAMS.rimZ);
      scene.add(rimLight);

      pointLight = new THREE.PointLight(
        PARAMS.pointColor,
        PARAMS.pointIntensity * PARAMS.masterLightIntensity,
        180,
        1.2
      );
      pointLight.position.set(PARAMS.pointX, PARAMS.pointY, PARAMS.pointZ);
      scene.add(pointLight);
    }

    function updateLights() {
      if (!hemiLight) return;
      const m = PARAMS.masterLightIntensity;

      hemiLight.color.set(PARAMS.hemiSky);
      hemiLight.groundColor.set(PARAMS.hemiGround);
      hemiLight.intensity = PARAMS.hemiIntensity * m;

      keyLight.color.set(PARAMS.keyColor);
      keyLight.intensity = PARAMS.keyIntensity * m;
      keyLight.position.set(PARAMS.keyX, PARAMS.keyY, PARAMS.keyZ);

      fillLight.color.set(PARAMS.fillColor);
      fillLight.intensity = PARAMS.fillIntensity * m;
      fillLight.position.set(PARAMS.fillX, PARAMS.fillY, PARAMS.fillZ);

      rimLight.color.set(PARAMS.rimColor);
      rimLight.intensity = PARAMS.rimIntensity * m;
      rimLight.position.set(PARAMS.rimX, PARAMS.rimY, PARAMS.rimZ);

      pointLight.color.set(PARAMS.pointColor);
      pointLight.intensity = PARAMS.pointIntensity * m;
      pointLight.position.set(PARAMS.pointX, PARAMS.pointY, PARAMS.pointZ);

      if (renderer) {
        renderer.toneMappingExposure = PARAMS.exposure;
      }
    }

    // ============================================================
    // THEME & COLOR MANAGEMENT
    // ============================================================
    function updateColorsAndMaterials() {
      if (ribbonMaterial) {
        ribbonMaterial.color.set(PARAMS.objectColor);
        ribbonMaterial.roughness = PARAMS.materialRoughness;
        ribbonMaterial.metalness = PARAMS.materialMetalness;
        ribbonMaterial.clearcoat = PARAMS.materialClearcoat;
        ribbonMaterial.transmission = PARAMS.materialTransmission;
        ribbonMaterial.wireframe = PARAMS.wireframe || (PARAMS.geometryStyle === "Wireframe Landscape");
        ribbonMaterial.needsUpdate = true;
      }

      if (ridgeMaterial) {
        ridgeMaterial.color.set(PARAMS.accentColor);
        ridgeMaterial.needsUpdate = true;
      }

      if (PARAMS.greenScreen) {
        scene.background = new THREE.Color("#00ff00");
      } else {
        scene.background = new THREE.Color(PARAMS.backgroundColor);
      }
    }

    function applyColorScheme(name) {
      const scheme = COLOR_SCHEMES[name];
      if (!scheme) return;

      PARAMS.colorScheme = name;
      PARAMS.backgroundColor = scheme.background;
      PARAMS.objectColor = scheme.objectColor;
      PARAMS.accentColor = scheme.accentColor;
      PARAMS.secondaryColor = scheme.secondaryColor;

      PARAMS.hemiSky = scheme.skyColor;
      PARAMS.hemiGround = scheme.groundColor;
      PARAMS.keyColor = scheme.keyColor;
      PARAMS.fillColor = scheme.fillColor;
      PARAMS.rimColor = scheme.rimColor;
      PARAMS.pointColor = scheme.pointColor;

      updateColorsAndMaterials();
      updateLights();
    }

    // ============================================================
    // RENDERER & CONTROLS SETUP
    // ============================================================
    function initRenderer(antialias = true) {
      renderer = new THREE.WebGLRenderer({
        canvas: canvas,
        antialias: antialias,
        alpha: false,
        powerPreference: "high-performance"
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(PARAMS.dpr);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      if (THREE.SRGBColorSpace) {
        renderer.outputColorSpace = THREE.SRGBColorSpace;
      } else {
        renderer.outputEncoding = THREE.sRGBEncoding;
      }

      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = PARAMS.exposure;
    }

    function initControls() {
      controls = new OrbitControls(camera, canvas);
      controls.target.copy(baseTarget);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.rotateSpeed = 0.8;
      controls.zoomSpeed = 1.0;
      controls.panSpeed = 1.0;
      controls.enableZoom = true;   // Zoom with wheel enabled
      controls.enablePan = true;    // Drag object across screen enabled
      controls.screenSpacePanning = true;

      applyDragMode();
    }

    function applyDragMode() {
      if (!controls) return;
      if (PARAMS.dragMode === "Pan (Left) / Rotate (Right)") {
        controls.mouseButtons = {
          LEFT: THREE.MOUSE.PAN,
          MIDDLE: THREE.MOUSE.DOLLY,
          RIGHT: THREE.MOUSE.ROTATE
        };
      } else {
        controls.mouseButtons = {
          LEFT: THREE.MOUSE.ROTATE,
          MIDDLE: THREE.MOUSE.DOLLY,
          RIGHT: THREE.MOUSE.PAN
        };
      }
    }

    // Rebuilds renderer when antialiasing toggle changes
    function setAntialiasSetting(val) {
      PARAMS.antialias = val;
      const oldCanvas = canvas;
      const newCanvas = oldCanvas.cloneNode(false);
      oldCanvas.parentNode.replaceChild(newCanvas, oldCanvas);
      canvas = newCanvas;

      renderer.dispose();
      initRenderer(val);

      controls.dispose();
      initControls();
      bindCanvasEvents();
    }

    // ============================================================
    // PROCEDURAL RANDOMIZER (CALLED ON SCENE CLICK OR BUTTON)
    // ============================================================
    function proceduralRandomize() {
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const chosenScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      applyColorScheme(chosenScheme);

      // Randomize animation preset (smooth, beautiful camera paths)
      const dynamicAnimPresets = ANIMATION_PRESETS.filter(a => a !== "Static (No camera movement)");
      PARAMS.animation = dynamicAnimPresets[Math.floor(Math.random() * dynamicAnimPresets.length)];
      PARAMS.speed = parseFloat((0.6 + Math.random() * 1.4).toFixed(2));

      // Randomize geometry style and parameters
      PARAMS.geometryStyle = GEOMETRIES_RANDOM_CHOICE();
      PARAMS.waveAmp = parseFloat((16.0 + Math.random() * 26.0).toFixed(1));
      PARAMS.packetWidth = parseFloat((32.0 + Math.random() * 30.0).toFixed(1));
      PARAMS.waveFreq = parseFloat((0.6 + Math.random() * 1.5).toFixed(2));
      PARAMS.sCurveAmp = parseFloat((16.0 + Math.random() * 22.0).toFixed(1));
      PARAMS.sCurveFreq = parseFloat((0.025 + Math.random() * 0.035).toFixed(3));
      PARAMS.travelSpeed = parseFloat((0.9 + Math.random() * 1.4).toFixed(2));
      PARAMS.rippleAmp = parseFloat((0.8 + Math.random() * 2.8).toFixed(1));
      PARAMS.skirtDepth = parseFloat((8.0 + Math.random() * 14.0).toFixed(1));

      // Randomize material parameters
      PARAMS.materialRoughness = parseFloat((0.15 + Math.random() * 0.45).toFixed(2));
      PARAMS.materialMetalness = parseFloat((Math.random() * 0.35).toFixed(2));
      PARAMS.materialClearcoat = parseFloat((0.2 + Math.random() * 0.8).toFixed(2));

      // Randomize lighting slightly
      PARAMS.exposure = parseFloat((0.85 + Math.random() * 0.45).toFixed(2));
      PARAMS.masterLightIntensity = parseFloat((0.85 + Math.random() * 0.5).toFixed(2));
      PARAMS.pointIntensity = parseFloat((3.0 + Math.random() * 4.5).toFixed(1));

      buildWaveGeometry();
      updateColorsAndMaterials();
      updateLights();

      if (gui) {
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      }
    }

    function GEOMETRIES_RANDOM_CHOICE() {
      const styles = ["3D Ribbon Curtains", "Continuous Surface Matrix", "Wireframe Landscape", "Tubular Wave Matrix"];
      return styles[Math.floor(Math.random() * styles.length)];
    }

    // ============================================================
    // CANVAS EVENT HANDLERS (CLICK RANDOMIZE & INTERACTIONS)
    // ============================================================
    function bindCanvasEvents() {
      canvas.addEventListener("pointerdown", (e) => {
        isPointerDown = true;
        pointerDownPos = { x: e.clientX, y: e.clientY, time: performance.now() };
      });

      window.addEventListener("pointerup", (e) => {
        isPointerDown = false;
        const dx = e.clientX - pointerDownPos.x;
        const dy = e.clientY - pointerDownPos.y;
        const dt = performance.now() - pointerDownPos.time;
        const dist = Math.hypot(dx, dy);

        // Click detection: distinction between dragging/orbiting and a single click
        if (dist < 6 && dt < 320) {
          if (PARAMS.clickToRandomize) {
            proceduralRandomize();
          }
        }
      });
    }

    // ============================================================
    // KEYBOARD SHORTCUTS
    // ============================================================
    window.addEventListener("keydown", (e) => {
      if (e.key === "h" || e.key === "H") {
        if (gui) {
          gui._hidden ? gui.show() : gui.hide();
        }
      }
    });

    // Window Resize
    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ============================================================
    // LIL-GUI CONTROL PANEL (DEFAULT STYLING)
    // ============================================================
    function initGUI() {
      gui = new GUI({ title: "Wave Landscape Controls" });

      // 1. Theme & Colors
      const folderColor = gui.addFolder("Theme & Colors");
      folderColor.add(PARAMS, "greenScreen").name("Greenscreen (#00ff00)").onChange(updateColorsAndMaterials);
      folderColor.add(PARAMS, "colorScheme", Object.keys(COLOR_SCHEMES)).name("Preset Scheme").onChange(v => {
        applyColorScheme(v);
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      });
      folderColor.addColor(PARAMS, "backgroundColor").name("Background Color").onChange(updateColorsAndMaterials);
      folderColor.addColor(PARAMS, "objectColor").name("Ribbon Body Color").onChange(updateColorsAndMaterials);
      folderColor.addColor(PARAMS, "accentColor").name("Ridge Stroke Color").onChange(updateColorsAndMaterials);
      folderColor.addColor(PARAMS, "secondaryColor").name("Secondary Color").onChange(updateColorsAndMaterials);

      // 2. Camera & Animation
      const folderAnim = gui.addFolder("Camera & Animation");
      folderAnim.add(PARAMS, "animation", ANIMATION_PRESETS).name("Animation Preset");
      folderAnim.add(PARAMS, "speed", 0.0, 3.0, 0.05).name("Animation Speed");
      folderAnim.add(PARAMS, "dragMode", [
        "Rotate (Left) / Pan (Right)",
        "Pan (Left) / Rotate (Right)"
      ]).name("Drag Mode").onChange(applyDragMode);

      // 3. Wave Dynamics & Geometry
      const folderGeom = gui.addFolder("Wave Dynamics & Math");
      folderGeom.add(PARAMS, "geometryStyle", GEOMETRY_STYLES).name("Geometry Style").onChange(buildWaveGeometry);
      folderGeom.add(PARAMS, "ribbonCount", 20, 130, 1).name("Ribbon Count").onChange(buildWaveGeometry);
      folderGeom.add(PARAMS, "waveAmp", 5.0, 65.0, 0.5).name("Wave Amplitude");
      folderGeom.add(PARAMS, "packetWidth", 15.0, 90.0, 1.0).name("Packet Width");
      folderGeom.add(PARAMS, "waveFreq", 0.2, 3.0, 0.05).name("Wave Frequency");
      folderGeom.add(PARAMS, "sCurveAmp", 5.0, 60.0, 1.0).name("S-Curve Offset");
      folderGeom.add(PARAMS, "sCurveFreq", 0.01, 0.1, 0.002).name("S-Curve Curvature");
      folderGeom.add(PARAMS, "travelSpeed", 0.1, 4.0, 0.05).name("Travel Speed");
      folderGeom.add(PARAMS, "rippleAmp", 0.0, 8.0, 0.1).name("Fluid Ripple");
      folderGeom.add(PARAMS, "skirtDepth", 2.0, 35.0, 0.5).name("Skirt Depth");

      // 4. Material & Surface
      const folderMat = gui.addFolder("Material & Surface");
      folderMat.add(PARAMS, "materialRoughness", 0.0, 1.0, 0.01).name("Roughness").onChange(updateColorsAndMaterials);
      folderMat.add(PARAMS, "materialMetalness", 0.0, 1.0, 0.01).name("Metalness").onChange(updateColorsAndMaterials);
      folderMat.add(PARAMS, "materialClearcoat", 0.0, 1.0, 0.01).name("Clearcoat").onChange(updateColorsAndMaterials);
      folderMat.add(PARAMS, "materialTransmission", 0.0, 1.0, 0.01).name("Glass Transmission").onChange(updateColorsAndMaterials);
      folderMat.add(PARAMS, "wireframe").name("Wireframe Mode").onChange(updateColorsAndMaterials);

      // 5. Lighting & Exposure
      const folderLight = gui.addFolder("Lighting & Exposure");
      folderLight.add(PARAMS, "exposure", 0.1, 3.0, 0.05).name("Scene Exposure").onChange(updateLights);
      folderLight.add(PARAMS, "masterLightIntensity", 0.0, 3.0, 0.05).name("Master Light Int.").onChange(updateLights);

      folderLight.add(PARAMS, "hemiIntensity", 0.0, 4.0, 0.1).name("Hemi Intensity").onChange(updateLights);
      folderLight.addColor(PARAMS, "hemiSky").name("Hemi Sky").onChange(updateLights);
      folderLight.addColor(PARAMS, "hemiGround").name("Hemi Ground").onChange(updateLights);

      folderLight.add(PARAMS, "keyIntensity", 0.0, 8.0, 0.1).name("Key Light Int.").onChange(updateLights);
      folderLight.addColor(PARAMS, "keyColor").name("Key Light Color").onChange(updateLights);
      folderLight.add(PARAMS, "keyX", -100, 100, 1).name("Key Pos X").onChange(updateLights);
      folderLight.add(PARAMS, "keyY", 0, 120, 1).name("Key Pos Y").onChange(updateLights);
      folderLight.add(PARAMS, "keyZ", -100, 100, 1).name("Key Pos Z").onChange(updateLights);

      folderLight.add(PARAMS, "fillIntensity", 0.0, 6.0, 0.1).name("Fill Light Int.").onChange(updateLights);
      folderLight.addColor(PARAMS, "fillColor").name("Fill Light Color").onChange(updateLights);

      folderLight.add(PARAMS, "rimIntensity", 0.0, 6.0, 0.1).name("Rim Light Int.").onChange(updateLights);
      folderLight.addColor(PARAMS, "rimColor").name("Rim Light Color").onChange(updateLights);

      folderLight.add(PARAMS, "pointIntensity", 0.0, 10.0, 0.2).name("Point Light Int.").onChange(updateLights);
      folderLight.addColor(PARAMS, "pointColor").name("Point Light Color").onChange(updateLights);
      folderLight.add(PARAMS, "pointX", -60, 60, 1).name("Point Pos X").onChange(updateLights);
      folderLight.add(PARAMS, "pointY", -20, 60, 1).name("Point Pos Y").onChange(updateLights);
      folderLight.add(PARAMS, "pointZ", -60, 60, 1).name("Point Pos Z").onChange(updateLights);

      // 6. Rendering & System
      const folderRender = gui.addFolder("Rendering & Procedural");
      folderRender.add(PARAMS, "antialias").name("Antialiasing (Default ON)").onChange(setAntialiasSetting);
      folderRender.add(PARAMS, "dpr", 0.5, 3.0, 0.25).name("Pixel Ratio (DPR)").onChange(v => renderer.setPixelRatio(v));
      folderRender.add(PARAMS, "clickToRandomize").name("Click Scene Randomizer");
      folderRender.add({ randomize: proceduralRandomize }, "randomize").name("🎲 Randomize Now");
      folderRender.add({ reset: () => { applyColorScheme("Original"); buildWaveGeometry(); } }, "reset").name("↺ Reset to Original");
    }

    // ============================================================
    // MAIN INITIALIZATION
    // ============================================================
    function init() {
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.5, 800);
      // Perspective positioned looking across the undulating 3D ribbon landscape
      camera.position.set(0, 48, 105);

      initRenderer(PARAMS.antialias);
      initControls();
      initLights();
      buildWaveGeometry();
      applyColorScheme(PARAMS.colorScheme);
      bindCanvasEvents();
      initGUI();

      animate();
    }

    // ============================================================
    // MAIN ANIMATION LOOP (INFINITE RUNTIME)
    // ============================================================
    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const speed = PARAMS.speed;

      simTime += delta * speed;
      animTime += delta * speed;

      // Update undulating wave mesh geometry
      updateWaveVertices(simTime);

      // ============================================================
      // CAMERA ANIMATION PRESETS
      // CRITICAL: Strictly preserves user wheel zoom & manual drag angles!
      // ============================================================
      if (PARAMS.animation === "Static (No camera movement)") {
        controls.autoRotate = false;
        controls.update();
      } else if (PARAMS.animation === "Slow Orbit") {
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.75 * speed;
        controls.update();
      } else {
        controls.autoRotate = false;
        controls.update();

        // When user is not manually dragging the camera, apply smooth organic motion
        // While strictly keeping spherical.radius (the user's wheel zoom!) intact
        if (!isPointerDown) {
          const offset = camera.position.clone().sub(controls.target);
          const spherical = new THREE.Spherical().setFromVector3(offset);

          if (PARAMS.animation === "Gentle Horizon Drift") {
            spherical.theta += Math.sin(animTime * 0.35) * 0.002 * speed;
            spherical.phi = THREE.MathUtils.clamp(
              spherical.phi + Math.cos(animTime * 0.28) * 0.001 * speed,
              0.15, Math.PI - 0.15
            );
          } else if (PARAMS.animation === "Cinematic Float & Tilt") {
            spherical.theta += 0.0025 * speed;
            spherical.phi = THREE.MathUtils.clamp(
              spherical.phi + Math.sin(animTime * 0.32) * 0.0016 * speed,
              0.18, Math.PI - 0.18
            );
          } else if (PARAMS.animation === "Breathing Elevation") {
            spherical.theta += 0.002 * speed;
            spherical.phi = THREE.MathUtils.clamp(
              spherical.phi + Math.sin(animTime * 0.45) * 0.0025 * speed,
              0.16, Math.PI - 0.16
            );
          } else if (PARAMS.animation === "Figure-8 Smooth Flow") {
            spherical.theta += Math.sin(animTime * 0.4) * 0.0035 * speed;
            spherical.phi = THREE.MathUtils.clamp(
              spherical.phi + Math.sin(animTime * 0.8) * 0.002 * speed,
              0.18, Math.PI - 0.18
            );
          } else if (PARAMS.animation === "Serpentine Ribbon Pan") {
            spherical.theta += 0.0028 * speed;
            spherical.phi = THREE.MathUtils.clamp(
              spherical.phi + Math.cos(animTime * 0.35) * 0.0015 * speed,
              0.18, Math.PI - 0.18
            );
          } else if (PARAMS.animation === "Dynamic Perspective Spiral") {
            spherical.theta += 0.0032 * speed;
            spherical.phi = THREE.MathUtils.clamp(
              spherical.phi + Math.sin(animTime * 0.38) * 0.0018 * speed,
              0.15, Math.PI - 0.15
            );
          }

          // Camera position updated from spherical coordinates, preserving radius (wheel zoom)
          camera.position.setFromSpherical(spherical).add(controls.target);
          camera.lookAt(controls.target);
        }
      }

      // Point light tracks the wave crest center to create gleaming organic highlights
      if (pointLight) {
        const crestX = PARAMS.sCurveAmp * Math.sin(0 * PARAMS.sCurveFreq + simTime * 0.42);
        const crestY = getWaveElevation(crestX, 0, simTime) + 16;
        pointLight.position.x = crestX;
        pointLight.position.y = crestY;
      }

      renderer.render(scene, camera);
    }

    // Launch scene on load
    init();
  </script>
</body>
