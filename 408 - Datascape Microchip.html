        // --- PRECONFIGURED ANIMATION PRESETS (8 Calm, Smooth Motions + Static) ---
        const animationModes = [
            'Static (No Camera Movement)',
            'Slow Linear Drift',

        ];

        // --- GLOBAL SCENE PARAMETERS ---
        const params = {
            // Preset

            // System & View
            dpr: Math.min(window.devicePixelRatio || 1, 2.0),

            // Colors
            substrateColor: colorPresets['Original'].substrateColor,
            traceColor: colorPresets['Original'].traceColor,

            // Lighting & Exposure
            exposure: 1.1,
            ambientIntensity: 0.35,
            dirLightIntensity: 1.2,
            dirLightColor: colorPresets['Original'].dirLightColor,
            dirLightAzimuth: 45.0,
            dirLightElevation: 55.0,
            beamEmission: 2.8,

            // Architecture & Raster
            chipDensity: 1.0,
            traceDensity: 1.0,
            beamSpeed: 0.6,
            beamWidth: 0.8,
            beamDirection: 'Horizontal (L->R)',
            scanlineDensity: 1.0,
            revealPersistence: 1.0,

        // --- THREE.JS SCENE SETUP ---
        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.01, 10);
        camera.position.z = 1;

        let renderer = new THREE.WebGLRenderer({
            antialias: params.antialias,
            powerPreference: 'high-performance'
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(params.dpr);
        document.body.appendChild(renderer.domElement);

        // --- SHADER UNIFORMS ---
        const uniforms = {
            u_time: { value: 0.0 },
            u_resolution: { value: new THREE.Vector2(window.innerWidth * params.dpr, window.innerHeight * params.dpr) },
            u_zoom: { value: params.zoom },
            u_pan: { value: new THREE.Vector2(params.panX, params.panY) },
            u_camPitch: { value: params.camPitch },
            u_camYaw: { value: params.camYaw },

            // Green Screen
            u_greenScreen: { value: params.greenScreen },
            u_greenScreenColor: { value: new THREE.Color(params.greenScreenColor) },

            // Colors
            u_substrateColor: { value: new THREE.Color(params.substrateColor) },
            u_traceColor: { value: new THREE.Color(params.traceColor) },
            u_beamColor: { value: new THREE.Color(params.beamColor) },
            u_sublayerColor: { value: new THREE.Color(params.sublayerColor) },
            u_accentColor: { value: new THREE.Color(params.accentColor) },
            u_siliconDieColor: { value: new THREE.Color(params.siliconDieColor) },

            // Lighting
            u_exposure: { value: params.exposure },
            u_ambientIntensity: { value: params.ambientIntensity },
            u_dirLightIntensity: { value: params.dirLightIntensity },
            u_dirLightColor: { value: new THREE.Color(params.dirLightColor) },
            u_dirLightDir: { value: new THREE.Vector3(0.5, 0.7, 0.5).normalize() },
            u_beamEmission: { value: params.beamEmission },
            u_traceGlow: { value: params.traceGlow },
            u_dataLayerIntensity: { value: params.dataLayerIntensity },

            // Circuit Architecture
            u_chipDensity: { value: params.chipDensity },
            u_traceDensity: { value: params.traceDensity },
            u_beamSpeed: { value: params.beamSpeed },
            u_beamWidth: { value: params.beamWidth },
            u_beamDirMode: { value: 0 }, // 0: L->R, 1: R->L, 2: T->B
            u_scanlineDensity: { value: params.scanlineDensity },
            u_revealPersistence: { value: params.revealPersistence },
            u_dataPulseSpeed: { value: params.dataPulseSpeed },
            u_darkAreaIntensity: { value: params.darkAreaIntensity },
            u_trailLength: { value: params.trailLength },
            u_decayExponent: { value: params.decayExponent }
        };

        function updateDirectionalLightVector() {
            const azRad = THREE.MathUtils.degToRad(params.dirLightAzimuth);
            const elRad = THREE.MathUtils.degToRad(params.dirLightElevation);
            const x = Math.cos(azRad) * Math.cos(elRad);
            const y = Math.sin(elRad);
            const z = Math.sin(azRad) * Math.cos(elRad);
            uniforms.u_dirLightDir.value.set(x, y, z).normalize();
        }
        updateDirectionalLightVector();

        function updateCanvasBackground() {
            const color = params.greenScreen ? params.greenScreenColor : '#000000';
            document.body.style.backgroundColor = color;
            renderer.setClearColor(color, 1);
        }
        updateCanvasBackground();

        // --- SHADER CODE ---
        const vertexShader = `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = vec4(position, 1.0);
            }
        `;

        const fragmentShader = `
            precision highp float;

            varying vec2 vUv;

            uniform float u_time;
            uniform vec2 u_resolution;
            uniform float u_zoom;
            uniform vec2 u_pan;
            uniform float u_camPitch;
            uniform float u_camYaw;

            uniform bool u_greenScreen;
            uniform vec3 u_greenScreenColor;

            uniform vec3 u_substrateColor;
            uniform vec3 u_traceColor;
            uniform vec3 u_beamColor;
            uniform vec3 u_sublayerColor;
            uniform vec3 u_accentColor;
            uniform vec3 u_siliconDieColor;

            uniform float u_exposure;
            uniform float u_ambientIntensity;
            uniform float u_dirLightIntensity;
            uniform vec3 u_dirLightColor;
            uniform vec3 u_dirLightDir;
            uniform float u_beamEmission;
            uniform float u_traceGlow;
            uniform float u_dataLayerIntensity;

            uniform float u_chipDensity;
            uniform float u_traceDensity;
            uniform float u_beamSpeed;
            uniform float u_beamWidth;
            uniform int u_beamDirMode;
            uniform float u_scanlineDensity;
            uniform float u_revealPersistence;
            uniform float u_dataPulseSpeed;
            uniform float u_darkAreaIntensity;
            uniform float u_trailLength;
            uniform float u_decayExponent;

            // --- HASH & NOISE UTILITIES ---
            float hash21(vec2 p) {
                p = fract(p * vec2(234.34, 435.345));
                p += dot(p, p + 34.23);
                return fract(p.x * p.y);
            }

            vec2 hash22(vec2 p) {
                float n = sin(dot(p, vec2(41.0, 289.0)));
                return fract(vec2(262144.0, 32768.0) * n);
            }

            float sdBox(vec2 p, vec2 b) {
                vec2 d = abs(p) - b;
                return length(max(d, 0.0)) + min(max(d.x, d.y), 0.0);
            }

            // --- PROCEDURAL SURFACE EVALUATION ---
            void evaluateMicrochip(
                vec2 p,
                out float height,
                out vec3 albedo,
                out float metallic,
                out float roughness,
                out float baseGlow,
                out float sublayerMask,
                out vec3 subDataPattern
            ) {
                // Scale coordinate to chip cell grid
                vec2 gridCoord = p * (0.85 * u_chipDensity);
                vec2 cellId = floor(gridCoord);
                vec2 cellUV = fract(gridCoord) - 0.5;
                float cellRand = hash21(cellId);

                // Default Substrate Base (Silicon wafer ground / FR4 base)
                height = 0.0;
                albedo = u_substrateColor;
                metallic = 0.2;
                roughness = 0.85;
                baseGlow = 0.0;
                sublayerMask = 0.0;
                subDataPattern = vec3(0.0);

                // Substrate micro-grid weave
                vec2 subGrid = abs(fract(p * 24.0 * u_traceDensity) - 0.5);
                float fineGround = smoothstep(0.04, 0.0, min(subGrid.x, subGrid.y));
                albedo += fineGround * u_substrateColor * 0.4;

                // 1. HIGH SPEED BUS CHANNELS & TRACES (Interconnect tracks)
                vec2 busUV = cellUV;
                float traceSp = 18.0 * u_traceDensity;
                float lineX = abs(fract(busUV.y * traceSp) - 0.5);
                float lineY = abs(fract(busUV.x * traceSp) - 0.5);
                float traceBand = min(lineX, lineY);

                // Check if this region has routing lines
                bool isRoutingZone = (cellRand > 0.45);
                if (isRoutingZone) {
                    float traceShape = smoothstep(0.12, 0.05, traceBand);
                    if (traceShape > 0.01) {
                        height = 0.04 * traceShape;
                        albedo = mix(albedo, u_traceColor * 0.8, traceShape);
                        metallic = 0.85;
                        roughness = 0.25;

                        // Animated micro-packets traveling along traces
                        float packetTravel = sin(busUV.x * 40.0 - u_time * u_dataPulseSpeed * 9.0 + cellId.y * 5.0);
                        float packet = step(0.91, packetTravel);
                        baseGlow += packet * traceShape * 2.2;
                    }

                    // Vias (circular plated through-holes with rings)
                    vec2 viaCell = fract(gridCoord * 3.0) - 0.5;
                    float dVia = length(viaCell);
                    float viaRing = smoothstep(0.24, 0.18, dVia) - smoothstep(0.12, 0.08, dVia);
                    float viaHole = smoothstep(0.08, 0.05, dVia);
                    if (viaRing > 0.01) {
                        height = max(height, 0.05);
                        albedo = mix(albedo, u_accentColor, viaRing);
                        metallic = 0.95;
                        roughness = 0.2;
                    }
                    if (viaHole > 0.5) {
                        height = 0.0;
                        albedo = vec3(0.01);
                    }
                }

                // 2. LARGE IC CHIPS / PROCESSOR DIES (Microprocessor packages)
                if (cellRand < 0.26) {
                    vec2 pkgSize = vec2(0.38, 0.38);
                    float dPkg = sdBox(cellUV, pkgSize) - 0.02;

                    // IC Body
                    if (dPkg < 0.0) {
                        float edgeBevel = smoothstep(-0.04, 0.0, dPkg);
                        height = mix(0.22, 0.16, edgeBevel);
                        albedo = u_siliconDieColor;
                        metallic = 0.4;
                        roughness = 0.65;

                        // Central Polished Silicon Die Window
                        float dDie = sdBox(cellUV, vec2(0.22, 0.22)) - 0.01;
                        if (dDie < 0.0) {
                            height = 0.25;
                            albedo = mix(u_siliconDieColor * 0.4, vec3(0.02, 0.03, 0.05), 0.7);
                            metallic = 0.95;
                            roughness = 0.08; // Mirror sheen silicon

                            // Sub-layer revealed logic matrix inside the die
                            sublayerMask = 1.0;
                            vec2 gateCoord = fract(cellUV * 50.0);
                            float gatePattern = step(0.48, hash21(floor(cellUV * 50.0) + floor(u_time * 2.5)));
                            float gateLine = smoothstep(0.1, 0.0, min(gateCoord.x, gateCoord.y));
                            subDataPattern = mix(u_sublayerColor, vec3(1.0), gatePattern * 0.8) * (gatePattern + gateLine * 0.5);
                        }

                        // Laser Etched Silicon Text / Silkscreen Marks
                        float markGrid = abs(sin(cellUV.x * 80.0) * cos(cellUV.y * 80.0));
                        if (dDie > 0.02 && dDie < 0.08) {
                            albedo += u_accentColor * markGrid * 0.15;
                        }
                    }

                    // IC Pins / Metal Leads around perimeter
                    vec2 absUV = abs(cellUV);
                    if (absUV.x > 0.38 || absUV.y > 0.38) {
                        if (absUV.x < 0.48 && absUV.y < 0.48) {
                            float pinWave = (cos(cellUV.x * 62.83) * 0.5 + 0.5) * step(0.36, absUV.y) +
                                            (cos(cellUV.y * 62.83) * 0.5 + 0.5) * step(0.36, absUV.x);
                            float pinMask = smoothstep(0.45, 0.65, pinWave);
                            if (pinMask > 0.1) {
                                height = max(height, 0.12);
                                albedo = mix(albedo, u_accentColor, pinMask);
                                metallic = 0.98;
                                roughness = 0.15;
                            }
                        }
                    }
                }

                // 3. PASSIVE CHIP CAPACITORS & INDUCTORS (SMD 0805 components)
                else if (cellRand >= 0.26 && cellRand < 0.45) {
                    vec2 smdUV = cellUV;
                    // Two components side by side
                    smdUV.x = abs(smdUV.x) - 0.22;
                    float dComp = sdBox(smdUV, vec2(0.11, 0.20)) - 0.01;

                    if (dComp < 0.0) {
                        height = 0.14;
                        // Ceramic body (tan or black) vs silver tin terminals
                        bool isTerminal = (abs(smdUV.y) > 0.12);
                        if (isTerminal) {
                            albedo = u_accentColor;
                            metallic = 0.95;
                            roughness = 0.2;
                            height = 0.15;
                        } else {
                            albedo = mix(u_substrateColor * 1.8, vec3(0.18, 0.14, 0.10), 0.5);
                            metallic = 0.1;
                            roughness = 0.6;
                        }
                    }
                }

                // 4. PLANAR COPPER INDUCTOR COILS & MEMORY ARRAYS
                else if (cellRand >= 0.78) {
                    vec2 spiralUV = abs(cellUV);
                    float maxDist = max(spiralUV.x, spiralUV.y);
                    if (maxDist < 0.38) {
                        float spiral = abs(fract(maxDist * 16.0) - 0.5);
                        float coil = smoothstep(0.15, 0.05, spiral);
                        if (coil > 0.1) {
                            height = max(height, 0.06);
                            albedo = mix(albedo, u_traceColor, coil);
                            metallic = 0.9;
                            roughness = 0.2;
                            baseGlow += coil * 0.4;
                        }

                        // Sub-layer data flow under spiral inductor
                        sublayerMask = max(sublayerMask, 0.7);
                        float subWave = sin(maxDist * 60.0 - u_time * u_dataPulseSpeed * 8.0);
                        subDataPattern = mix(subDataPattern, u_beamColor, step(0.6, subWave));
                    }
                }
            }

            // Normal calculation via finite differences of procedural height
            vec3 calculateNormal(vec2 p, float baseH) {
                float eps = 0.003 / max(u_zoom, 0.2);
                float hR, hU;
                vec3 dummyAlb, dummySub;
                float dummyMet, dummyRough, dummyGlow, dummyMask;

                evaluateMicrochip(p + vec2(eps, 0.0), hR, dummyAlb, dummyMet, dummyRough, dummyGlow, dummyMask, dummySub);
                evaluateMicrochip(p + vec2(0.0, eps), hU, dummyAlb, dummyMet, dummyRough, dummyGlow, dummyMask, dummySub);

                vec3 norm = normalize(vec3(
                    -(hR - baseH) / eps,
                    1.0,
                    -(hU - baseH) / eps
                ));

                // Apply subtle camera pitch/yaw tilt to normals if angled
                if (abs(u_camPitch) > 0.001 || abs(u_camYaw) > 0.001) {
                    norm.xy += vec2(u_camYaw * 0.3, u_camPitch * 0.3);
                    norm = normalize(norm);
                }

                return norm;
            }

            void main() {
                // Viewport & Pan/Zoom Screen Space Mapping
                vec2 centeredPixel = gl_FragCoord.xy - 0.5 * u_resolution.xy - u_pan;
                vec2 localPixel = centeredPixel / max(u_zoom, 0.001) + 0.5 * u_resolution.xy;

                // Screen-space coordinates (0.0 to 1.0)
                vec2 screenUV = gl_FragCoord.xy / u_resolution.xy;

                // World Chip Plane Coordinates (orthographic microchip space)
                vec2 p = (localPixel - 0.5 * u_resolution.xy) / u_resolution.y * 4.0;

                // --- EVALUATE CHIP SURFACE ---
                float height;
                vec3 albedo;
                float metallic;
                float roughness;
                float baseGlow;
                float sublayerMask;
                vec3 subDataPattern;

                evaluateMicrochip(p, height, albedo, metallic, roughness, baseGlow, sublayerMask, subDataPattern);
                vec3 N = calculateNormal(p, height);

                // --- 3D LIGHTING & SHADING ---
                vec3 L = normalize(u_dirLightDir);
                vec3 V = normalize(vec3(u_camYaw * 0.2, 1.0, u_camPitch * 0.2));
                vec3 H = normalize(L + V);

                // Diffuse
                float NdotL = max(dot(N, L), 0.0);
                vec3 diffuse = albedo * u_dirLightColor * NdotL * u_dirLightIntensity;

                // Specular (Blinn-Phong)
                float NdotH = max(dot(N, H), 0.0);
                float specPower = mix(12.0, 140.0, 1.0 - roughness);
                float specIntensity = pow(NdotH, specPower) * metallic;
                vec3 specular = u_dirLightColor * specIntensity * (1.2 * u_dirLightIntensity);

                // Ambient light & cavity occlusion
                float ao = smoothstep(0.0, 0.1, height) * 0.3 + 0.7;
                vec3 ambient = albedo * u_ambientIntensity * ao;

                // --- ILLUMINATION LEVELS: ACTIVE VS DORMANT (DARK AREA) ---
                // Full active illumination (ambient + diffuse + specular + circuit traces)
                vec3 fullyLitColor = ambient + diffuse + specular + (u_traceColor * (baseGlow * u_traceGlow));

                // Dormant / un-scanned silicon (darkened silhouette area)
                vec3 dormantDarkColor = albedo * (u_ambientIntensity * ao * u_darkAreaIntensity);

                // --- RASTER BEAM & DECAY SYSTEM ---
                float beamCoord;
                if (u_beamDirMode == 0) {
                    beamCoord = screenUV.x; // Horizontal Left to Right
                } else if (u_beamDirMode == 1) {
                    beamCoord = 1.0 - screenUV.x; // Horizontal Right to Left
                } else {
                    beamCoord = 1.0 - screenUV.y; // Vertical Top to Bottom
                }

                // Continuous sweeping beam position [0.0, 1.0)
                float beamPos = fract(u_time * u_beamSpeed * 0.12);

                // Distance behind the beam wavefront [0.0, 1.0)
                // - trailDist == 0.0 at the beam wavefront
                // - small positive values: area just scanned ("светлеет после него")
                // - larger values: decaying phosphor trail ("медленно затухает")
                // - values >= effTrailLength: ahead of beam / dormant dark area ("затемненная область")
                float trailDist = fract(beamPos - beamCoord);

                float effTrailLength = clamp(u_trailLength * u_revealPersistence, 0.15, 0.98);

                // Phosphor afterglow decay factor
                float afterglow = 0.0;
                if (trailDist < effTrailLength) {
                    float decayProgress = trailDist / effTrailLength;
                    afterglow = pow(1.0 - decayProgress, u_decayExponent);
                }

                // Smoothly illuminate the darkened area upon beam pass, slowly fading behind it
                vec3 surfaceColor = mix(dormantDarkColor, fullyLitColor, afterglow);

                // --- SUB-LAYER DATA REVELATION (Internal Silicon Architecture) ---
                // Revealed and activated behind the beam, slowly fading with afterglow
                if (afterglow > 0.01) {
                    // Orthogonal internal chip bus pathways
                    vec2 subGridUV = fract(p * 5.0) - 0.5;
                    float subBusLine = smoothstep(0.08, 0.03, min(abs(subGridUV.x), abs(subGridUV.y)));
                    float packetPulse = step(0.92, sin(p.x * 30.0 - u_time * u_dataPulseSpeed * 9.0));
                    vec3 subBusGlow = mix(u_sublayerColor, vec3(1.0), packetPulse * 0.8) * (subBusLine + packetPulse * 0.5);

                    // If inside IC Silicon Die, activate dense logic gate array
                    if (sublayerMask > 0.1) {
                        subBusGlow += subDataPattern * 2.5;
                    }

                    // Brighten internal data, glowing intense neon & white, fading gracefully
                    vec3 energizedData = subBusGlow * (u_dataLayerIntensity * afterglow);
                    energizedData += u_traceColor * (afterglow * 0.9);
                    surfaceColor += energizedData;
                }

                // --- THE FOCUSED RASTER BEAM (Laser / CRT scanline wavefront) ---
                float distToWavefront = min(trailDist, 1.0 - trailDist);

                // Focused laser core
                float laserCore = exp(-pow(distToWavefront / (0.0025 * max(u_beamWidth, 0.1)), 2.0));
                // High-energy optical beam glow
                float laserGlow = exp(-pow(distToWavefront / (0.018 * max(u_beamWidth, 0.1)), 2.0));

                // Subtle CRT horizontal scanline modulation
                float scanlineFreq = u_resolution.y * 0.45 * u_scanlineDensity;
                float rasterMod = 0.88 + 0.12 * sin(gl_FragCoord.y * scanlineFreq * 0.05);

                // Add the physical focused raster beam wavefront
                vec3 beamWavefrontLight = (vec3(1.0) * laserCore * 3.8 + u_beamColor * laserGlow * 2.0) * u_beamEmission;
                surfaceColor += beamWavefrontLight * rasterMod;

                // Master Exposure
                surfaceColor *= u_exposure;

                // --- GREEN SCREEN / OUTPUT MASKING ---
                if (u_greenScreen) {
                    // If user enabled greenscreen, background keys exact #00ff00
                    gl_FragColor = vec4(surfaceColor, 1.0);
                } else {
                    // Subtle CRT vignette around edges
                    vec2 vigUV = screenUV - 0.5;
                    float vignette = 1.0 - dot(vigUV, vigUV) * 0.45;
                    surfaceColor *= clamp(vignette, 0.0, 1.0);

                    gl_FragColor = vec4(surfaceColor, 1.0);
                }
            }
        `;

        // --- MESH & MATERIAL ---
        const material = new THREE.ShaderMaterial({
            vertexShader,
            fragmentShader,
            uniforms
        });

        const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
        scene.add(quad);

        // --- SYSTEM FUNCTIONS: PAN, ZOOM, RECREATE RENDERER ---
        function setPan(x, y) {
            params.panX = x;
            params.panY = y;
            uniforms.u_pan.value.set(x, y);
        }

        function setZoom(value) {
            params.zoom = THREE.MathUtils.clamp(value, 0.15, 25.0);
            uniforms.u_zoom.value = params.zoom;
        }

        function recreateRenderer(antialias) {
            const oldDom = renderer.domElement;
            renderer.dispose();

            renderer = new THREE.WebGLRenderer({
                antialias: antialias,
                powerPreference: 'high-performance'
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(params.dpr);
            oldDom.parentNode.replaceChild(renderer.domElement, oldDom);

            attachPointerListeners();
            updateCanvasBackground();
        }

        // Apply a Preconfigured Color Palette
        function applyColorPreset(presetName) {
            const pal = colorPresets[presetName];
            if (!pal) return;

            params.colorScheme = presetName;
            params.substrateColor = pal.substrateColor;
            params.traceColor = pal.traceColor;
            params.beamColor = pal.beamColor;
            params.sublayerColor = pal.sublayerColor;
            params.accentColor = pal.accentColor;
            params.siliconDieColor = pal.siliconDieColor;
            params.dirLightColor = pal.dirLightColor;

            uniforms.u_substrateColor.value.set(params.substrateColor);
            uniforms.u_traceColor.value.set(params.traceColor);
            uniforms.u_beamColor.value.set(params.beamColor);
            uniforms.u_sublayerColor.value.set(params.sublayerColor);
            uniforms.u_accentColor.value.set(params.accentColor);
            uniforms.u_siliconDieColor.value.set(params.siliconDieColor);
            uniforms.u_dirLightColor.value.set(params.dirLightColor);

            if (gui) {
                gui.controllersRecursive().forEach(c => c.updateDisplay());
            }
        }

        // Randomize Theme & Parameters upon Click
        function randomizeScene() {
            const presetKeys = Object.keys(colorPresets);
            const randomPreset = presetKeys[Math.floor(Math.random() * presetKeys.length)];
            applyColorPreset(randomPreset);

            // Re-roll geometric & motion parameters
            params.chipDensity = Number((0.7 + Math.random() * 0.8).toFixed(2));
            params.traceDensity = Number((0.7 + Math.random() * 0.8).toFixed(2));
            params.beamSpeed = Number((0.3 + Math.random() * 0.9).toFixed(2));
            params.beamWidth = Number((0.6 + Math.random() * 0.6).toFixed(2));
            params.dataPulseSpeed = Number((0.6 + Math.random() * 1.2).toFixed(2));
            params.darkAreaIntensity = Number((0.02 + Math.random() * 0.06).toFixed(3));
            params.trailLength = Number((0.50 + Math.random() * 0.35).toFixed(2));
            params.decayExponent = Number((1.2 + Math.random() * 1.2).toFixed(2));
            params.dirLightAzimuth = Math.floor(Math.random() * 360);
            params.dirLightElevation = Math.floor(25 + Math.random() * 55);

            uniforms.u_chipDensity.value = params.chipDensity;
            uniforms.u_traceDensity.value = params.traceDensity;
            uniforms.u_beamSpeed.value = params.beamSpeed;
            uniforms.u_beamWidth.value = params.beamWidth;
            uniforms.u_dataPulseSpeed.value = params.dataPulseSpeed;
            uniforms.u_darkAreaIntensity.value = params.darkAreaIntensity;
            uniforms.u_trailLength.value = params.trailLength;
            uniforms.u_decayExponent.value = params.decayExponent;
            updateDirectionalLightVector();

            if (gui) {
                gui.controllersRecursive().forEach(c => c.updateDisplay());
            }
        }

        // --- LIL-GUI CONFIGURATION ---
        const gui = new GUI({ title: 'Datascape Microchip' });

        // Presets Folder
        const fPresets = gui.addFolder('Presets & Animation');
        fPresets.add(params, 'colorScheme', Object.keys(colorPresets)).name('Color Theme').onChange(applyColorPreset);
        fPresets.add(params, 'animationMode', animationModes).name('Animation Flow');
        fPresets.add(params, 'clickToRandomize').name('Click Scene: Randomize');

        // System Folder
        const fSystem = gui.addFolder('System & Performance');
        fSystem.add(params, 'dpr', 0.5, 3.0, 0.1).name('Pixel Ratio (DPR)').onChange(v => {
            renderer.setPixelRatio(v);
            uniforms.u_resolution.value.set(window.innerWidth * v, window.innerHeight * v);
        });
        fSystem.add(params, 'antialias').name('Antialiasing').onChange(v => recreateRenderer(v));
        fSystem.add(params, 'animSpeed', 0.0, 3.0, 0.1).name('Animation Speed');

        // Green Screen Folder
        const fOutput = gui.addFolder('Green Screen & Background');
        fOutput.add(params, 'greenScreen').name('Enable Green Screen').onChange(v => {
            uniforms.u_greenScreen.value = v;
            updateCanvasBackground();
        });
        fOutput.addColor(params, 'greenScreenColor').name('Key Color').onChange(v => {
            uniforms.u_greenScreenColor.value.set(v);
            updateCanvasBackground();
        });

        // View Controls Folder
        const fView = gui.addFolder('View & Navigation');
        fView.add(params, 'zoom', 0.2, 10.0, 0.01).name('Zoom Level').listen().onChange(setZoom);
        fView.add(params, 'panX', -3000.0, 3000.0, 1.0).name('Pan X').listen().onChange(v => setPan(v, params.panY));
        fView.add(params, 'panY', -3000.0, 3000.0, 1.0).name('Pan Y').listen().onChange(v => setPan(params.panX, v));
        fView.add(params, 'camPitch', -0.8, 0.8, 0.02).name('Tilt Pitch (Zero=Top)').onChange(v => uniforms.u_camPitch.value = v);
        fView.add(params, 'camYaw', -0.8, 0.8, 0.02).name('Tilt Yaw').onChange(v => uniforms.u_camYaw.value = v);

        // Lighting & Exposure Folder
        const fLight = gui.addFolder('Exposure & Lighting');
        fLight.add(params, 'exposure', 0.2, 3.0, 0.05).name('Exposure').onChange(v => uniforms.u_exposure.value = v);
        fLight.add(params, 'ambientIntensity', 0.0, 2.0, 0.05).name('Ambient Light').onChange(v => uniforms.u_ambientIntensity.value = v);
        fLight.add(params, 'dirLightIntensity', 0.0, 3.0, 0.05).name('Grazing Light').onChange(v => uniforms.u_dirLightIntensity.value = v);
        fLight.addColor(params, 'dirLightColor').name('Light Color').onChange(v => uniforms.u_dirLightColor.value.set(v));
        fLight.add(params, 'dirLightAzimuth', 0, 360, 1).name('Light Azimuth').onChange(updateDirectionalLightVector);
        fLight.add(params, 'dirLightElevation', 5, 90, 1).name('Light Elevation').onChange(updateDirectionalLightVector);
        fLight.add(params, 'beamEmission', 0.5, 6.0, 0.1).name('Raster Emission').onChange(v => uniforms.u_beamEmission.value = v);
        fLight.add(params, 'traceGlow', 0.0, 4.0, 0.1).name('Trace Luminescence').onChange(v => uniforms.u_traceGlow.value = v);
        fLight.add(params, 'dataLayerIntensity', 0.2, 5.0, 0.1).name('Sub-Layer Glow').onChange(v => uniforms.u_dataLayerIntensity.value = v);

        // Theme Colors Folder
        const fColors = gui.addFolder('Theme Custom Colors');
        fColors.addColor(params, 'substrateColor').name('Silicon Substrate').listen().onChange(v => uniforms.u_substrateColor.value.set(v));
        fColors.addColor(params, 'traceColor').name('Circuit Traces').listen().onChange(v => uniforms.u_traceColor.value.set(v));
        fColors.addColor(params, 'beamColor').name('Raster Beam Wave').listen().onChange(v => uniforms.u_beamColor.value.set(v));
        fColors.addColor(params, 'sublayerColor').name('Hidden Data Layer').listen().onChange(v => uniforms.u_sublayerColor.value.set(v));
        fColors.addColor(params, 'accentColor').name('Pins & Terminals').listen().onChange(v => uniforms.u_accentColor.value.set(v));
        fColors.addColor(params, 'siliconDieColor').name('Silicon IC Package').listen().onChange(v => uniforms.u_siliconDieColor.value.set(v));

        // Microchip Architecture & Raster Beam Folder
        const fChip = gui.addFolder('Microchip & Beam FX');
        fChip.add(params, 'chipDensity', 0.4, 2.5, 0.05).name('Chip Scale Density').onChange(v => uniforms.u_chipDensity.value = v);
        fChip.add(params, 'traceDensity', 0.4, 2.5, 0.05).name('Trace Scale Density').onChange(v => uniforms.u_traceDensity.value = v);
        fChip.add(params, 'beamSpeed', 0.05, 3.0, 0.05).name('Raster Scan Speed').onChange(v => uniforms.u_beamSpeed.value = v);
        fChip.add(params, 'beamWidth', 0.2, 3.0, 0.1).name('Raster Beam Width').onChange(v => uniforms.u_beamWidth.value = v);
        fChip.add(params, 'beamDirection', ['Horizontal (L->R)', 'Horizontal (R->L)', 'Vertical (T->B)']).name('Beam Direction').onChange(v => {
            if (v === 'Horizontal (L->R)') uniforms.u_beamDirMode.value = 0;
            else if (v === 'Horizontal (R->L)') uniforms.u_beamDirMode.value = 1;
            else uniforms.u_beamDirMode.value = 2;
        });
        fChip.add(params, 'scanlineDensity', 0.2, 3.0, 0.1).name('CRT Scanline Lines').onChange(v => uniforms.u_scanlineDensity.value = v);
        fChip.add(params, 'revealPersistence', 0.2, 3.0, 0.1).name('Phosphor Trail Time').onChange(v => uniforms.u_revealPersistence.value = v);
        fChip.add(params, 'dataPulseSpeed', 0.1, 4.0, 0.1).name('Data Packet Speed').onChange(v => uniforms.u_dataPulseSpeed.value = v);
        fChip.add(params, 'darkAreaIntensity', 0.0, 0.25, 0.01).name('Dark Area Brightness').listen().onChange(v => uniforms.u_darkAreaIntensity.value = v);
        fChip.add(params, 'trailLength', 0.2, 1.0, 0.02).name('Fade Trail Length').listen().onChange(v => uniforms.u_trailLength.value = v);
        fChip.add(params, 'decayExponent', 0.5, 4.0, 0.1).name('Fade Decay Curve').listen().onChange(v => uniforms.u_decayExponent.value = v);

        fPresets.open();
        gui.close();

        // --- KEYBOARD UI TOGGLE ("H" Key) ---
        window.addEventListener('keydown', event => {
            if (event.key === 'h' || event.key === 'H') {
                if (gui._hidden) {
                    gui.show();
                } else {
                    gui.hide();
                }
            }
        });

        // --- POINTER & WHEEL CONTROLS (Pan, Zoom, and Click to Randomize) ---
        let isDragging = false;
        let startPointerX = 0;
        let startPointerY = 0;
        let lastPointerX = 0;
        let lastPointerY = 0;
        let pointerDownTime = 0;

        function attachPointerListeners() {
            const dom = renderer.domElement;

            dom.addEventListener('pointerdown', event => {
                if (event.target.closest('.lil-gui')) return;

                isDragging = true;
                startPointerX = event.clientX;
                startPointerY = event.clientY;
                lastPointerX = event.clientX;
                lastPointerY = event.clientY;
                pointerDownTime = performance.now();

                document.body.classList.add('dragging');
                dom.setPointerCapture(event.pointerId);
            });

            dom.addEventListener('pointermove', event => {
                if (!isDragging) return;

                const dpr = renderer.getPixelRatio();
                const deltaX = (event.clientX - lastPointerX) * dpr;
                const deltaY = (lastPointerY - event.clientY) * dpr;

                setPan(params.panX + deltaX, params.panY + deltaY);

                lastPointerX = event.clientX;
                lastPointerY = event.clientY;
            });

            function onPointerUp(event) {
                if (!isDragging) return;
                isDragging = false;
                document.body.classList.remove('dragging');

                if (dom.hasPointerCapture(event.pointerId)) {
                    dom.releasePointerCapture(event.pointerId);
                }

                // Check for clean click (distance < 6px and time < 350ms)
                const dist = Math.hypot(event.clientX - startPointerX, event.clientY - startPointerY);
                const duration = performance.now() - pointerDownTime;
                if (dist < 6 && duration < 350 && params.clickToRandomize) {
                    randomizeScene();
                }
            }

            dom.addEventListener('pointerup', onPointerUp);
            dom.addEventListener('pointercancel', onPointerUp);
            dom.addEventListener('lostpointercapture', onPointerUp);

            dom.addEventListener('wheel', event => {
                event.preventDefault();
                const zoomFactor = Math.exp(-event.deltaY * 0.0015);
                setZoom(params.zoom * zoomFactor);
            }, { passive: false });
        }
        attachPointerListeners();

        // --- WINDOW RESIZE HANDLING ---
        window.addEventListener('resize', () => {
            const width = window.innerWidth;
            const height = window.innerHeight;
            renderer.setSize(width, height);
            const dpr = renderer.getPixelRatio();
            uniforms.u_resolution.value.set(width * dpr, height * dpr);
        });

        // --- INFINITE AUTO ANIMATION LOOP ---
        const clock = new THREE.Clock();
        let animElapsed = 0;

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            const effectiveDelta = delta * params.animSpeed;
            animElapsed += effectiveDelta;

            uniforms.u_time.value = animElapsed;

            // Preconfigured Camera Motion Presets
            if (params.animationMode === 'Slow Linear Drift') {
                const speed = 0.08;
                const dpr = renderer.getPixelRatio();
                setPan(
                    params.panX + Math.sin(animElapsed * speed) * 0.8 * dpr,
                    params.panY + Math.cos(animElapsed * speed * 0.7) * 0.5 * dpr
                );
            } else if (params.animationMode === 'Micro-Inspection Hover') {
                const radius = 220.0 * renderer.getPixelRatio();
                const speed = 0.15;
                setPan(
                    Math.cos(animElapsed * speed) * radius,
                    Math.sin(animElapsed * speed) * radius
                );
            } else if (params.animationMode === 'Raster Synchronous Track') {
                // Synchronous glide with raster beam
                const cycle = (animElapsed * params.beamSpeed * 0.16) % 1.35;
                const screenSpan = window.innerWidth * renderer.getPixelRatio() * 0.35;
                setPan((cycle - 0.5) * screenSpan, params.panY);
            } else if (params.animationMode === 'Deep Zoom Breathe') {
                const breathZoom = 1.25 + 0.35 * Math.sin(animElapsed * 0.25);
                setZoom(breathZoom);
            } else if (params.animationMode === 'Diagonal Circuit Survey') {
                const diagSpeed = 0.6 * renderer.getPixelRatio();
                setPan(params.panX + diagSpeed, params.panY + diagSpeed * 0.5);
                if (params.panX > 2500) setPan(-2500, -1250);
            } else if (params.animationMode === 'Stepped Chip Patrol') {
                // Waypoint interpolation between 4 silicon blocks
                const tSegment = (animElapsed * 0.15) % 4.0;
                const index = Math.floor(tSegment);
                const frac = tSegment - index;
                const smoothFrac = frac * frac * (3.0 - 2.0 * frac); // Smoothstep

                const dpr = renderer.getPixelRatio();
                const waypoints = [
                    [0, 0],
                    [400 * dpr, 250 * dpr],
                    [-350 * dpr, 300 * dpr],
                    [-200 * dpr, -350 * dpr]
                ];
                const p0 = waypoints[index];
                const p1 = waypoints[(index + 1) % 4];

                setPan(
                    p0[0] + (p1[0] - p0[0]) * smoothFrac,
                    p0[1] + (p1[1] - p0[1]) * smoothFrac
                );
            } else if (params.animationMode === 'Harmonic Lissajous Glide') {
                const dpr = renderer.getPixelRatio();
                const scaleX = 350.0 * dpr;
                const scaleY = 220.0 * dpr;
                setPan(
                    Math.sin(animElapsed * 0.18) * scaleX,
                    Math.sin(animElapsed * 0.18 * 0.618033) * scaleY
                );
            }
            // If 'Static (No Camera Movement)', camera does not move automatically!

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
