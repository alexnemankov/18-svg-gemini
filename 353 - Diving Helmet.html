<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antique Diving Helmet with Abyssal Deep-Sea Entity</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #020508;
      user-select: none;
      -webkit-user-select: none;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>

  <!-- GSAP for smooth animations -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <!-- Import map for Three.js, lil-gui & PostProcessor -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js",
      "postprocessing/PostProcessor.js": "./postprocessing/PostProcessor.js"
    }
  }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import GUI from 'lil-gui';

    // =========================================================================
    // POST PROCESSOR SUITE (From postprocessing/PostProcessor.js)
    // =========================================================================
    const orthoVertexShader = `
    precision highp float;
    in vec3 position;
    out vec2 vUv;
    void main() {
      vUv = position.xy * 0.5 + 0.5;
      gl_Position = vec4(position, 1.0);
    }
    `;

    const brightFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float bloomThreshold;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float luminance = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float knee = 0.1;
      float soft = luminance - bloomThreshold + knee;
      soft = clamp(soft, 0.0, 2.0 * knee);
      soft = (soft * soft) / (4.0 * knee + 0.00001);
      float contribution = max(soft, luminance - bloomThreshold);
      contribution /= max(luminance, 0.00001);
      fragColor = vec4(color.rgb * contribution, color.a);
    }
    `;

    const blur13ShaderChunk = `
    vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
      vec2 resolution = vec2(textureSize(image, 0));
      vec4 color = vec4(0.0);
      vec2 off1 = vec2(1.411764705882353) * direction;
      vec2 off2 = vec2(3.2941176470588234) * direction;
      vec2 off3 = vec2(5.176470588235294) * direction;
      color += texture(image, uv) * 0.1964825501511404;
      color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
      color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
      return color;
    }
    `;

    const blurFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 direction;
    in vec2 vUv;
    out vec4 color;
    ${blur13ShaderChunk}
    void main() {
      color = blur13(inputTexture, vUv, direction);
    }
    `;

    const godRaysDepthMaskShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float threshold;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float lum = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float factor = smoothstep(threshold, threshold + 0.15, lum);
      fragColor = vec4(vec3(factor), 1.0);
    }
    `;

    const godRaysGenerateShader = `
    precision highp float;
    #define TAPS_PER_PASS 6.0

    uniform sampler2D inputTexture;
    uniform vec3 vSunPositionScreenSpace;
    uniform float fStepSize;
    uniform float distanceAttenuation;
    uniform float maxDensity;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec2 delta = vSunPositionScreenSpace.xy - vUv;
      float dist = length(delta);
      vec2 stepv = fStepSize * delta / max(dist, 0.0001);
      float iters = dist / max(fStepSize, 0.00001);

      vec2 uv = vUv;
      float col = 0.0;
      float f = min(1.0, max(vSunPositionScreenSpace.z, 0.0));

      float atten = 1.0 / (1.0 + pow(dist, distanceAttenuation));

      if (0.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (1.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (2.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (3.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (4.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (5.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;

      float finalVal = min(col / TAPS_PER_PASS * atten, maxDensity);
      fragColor = vec4(vec3(finalVal), 1.0);
    }
    `;

    const anamorphicBrightShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float threshold;
    uniform float smoothWidth;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float v = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float alpha = smoothstep(threshold, threshold + smoothWidth, v);
      fragColor = mix(vec4(0.0), color, alpha);
    }
    `;

    const anamorphicBlurShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 resolution;
    uniform float samples;
    uniform float intensity;
    uniform vec3 tintColor;
    uniform float bloomRadius;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      int halfSamples = max(1, int(samples) / 2);
      float fHalfSamples = float(halfSamples);
      vec2 invSize = 1.0 / resolution;
      vec4 total = vec4(0.0);

      for (int i = -64; i <= 64; i++) {
        if (i < -halfSamples || i > halfSamples) continue;
        float softness = 1.0 - abs(float(i)) / fHalfSamples;
        softness = pow(softness, 2.0);
        vec2 shiftedUV = vec2(vUv.x + invSize.x * float(i) * (4.0 + bloomRadius * 8.0), vUv.y);
        shiftedUV = clamp(shiftedUV, 0.001, 0.999);
        total += texture(inputTexture, shiftedUV) * softness;
      }

      fragColor = (total / (samples / 3.0)) * vec4(tintColor, 1.0) * intensity;
    }
    `;

    const finalFragmentShader = `
    precision highp float;
    uniform vec2 resolution;
    uniform sampler2D inputTexture;
    uniform sampler2D blur0Texture;
    uniform sampler2D blur1Texture;
    uniform sampler2D blur2Texture;
    uniform sampler2D blur3Texture;
    uniform sampler2D blur4Texture;
    uniform sampler2D raysTexture;
    uniform sampler2D anamorphicTexture;
    uniform bool bloomEnabled;
    uniform float bloomStrength;
    uniform bool raysEnabled;
    uniform float raysStrength;
    uniform vec3 raysColor;
    uniform bool anamorphicEnabled;
    uniform float vignetteBoost;
    uniform float vignetteReduction;
    uniform float noiseIntensity;
    uniform float time;
    in vec2 vUv;
    out vec4 fragColor;

    float vignette(vec2 uv, float boost, float reduction) {
      vec2 position = vUv - 0.5;
      return boost - length(position) * reduction;
    }

    float hash1(uint n) {
      n = (n << 13U) ^ n;
      n = n * (n * n * 15731U + 789221U) + 1376312589U;
      return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
    }

    float noise(in vec2 uv, in float timeVal) {
      uvec2 p = uvec2(uv);
      return hash1(p.x + 1920U * p.y + (1920U * 1080U) * uint(timeVal));
    }

    void main() {
      vec4 color = texture(inputTexture, vUv);

      if (bloomEnabled && bloomStrength > 0.001) {
        vec4 b0 = texture(blur0Texture, vUv);
        vec4 b1 = texture(blur1Texture, vUv);
        vec4 b2 = texture(blur2Texture, vUv);
        vec4 b3 = texture(blur3Texture, vUv);
        vec4 b4 = texture(blur4Texture, vUv);

        vec4 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
        color += bloomSum * bloomStrength;
      }

      if (raysEnabled && raysStrength > 0.001) {
        vec4 r = texture(raysTexture, vUv);
        color.rgb += r.rgb * raysColor * raysStrength;
      }

      if (anamorphicEnabled) {
        vec4 a = texture(anamorphicTexture, vUv);
        color.rgb += a.rgb;
      }

      color.rgb *= vignette(vUv, vignetteBoost, vignetteReduction);
      color.rgb += noiseIntensity * noise(gl_FragCoord.xy, time);
      fragColor = vec4(color.rgb, 1.0);
    }
    `;

    const chromaticAberrationShaderChunk = `
    vec2 barrelDistortion(vec2 coord, float amt) {
      vec2 cc = coord - 0.5;
      float dist = dot(cc, cc);
      return coord + cc * dist * amt;
    }
    float sat(float t) { return clamp(t, 0.0, 1.0); }
    float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
    float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
    vec4 spectrum_offset(float t) {
      float lo = step(t, 0.5);
      float hi = 1.0 - lo;
      float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
      vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
      return pow(ret, vec4(1.0 / 2.2));
    }
    const float max_distort = 2.2;
    const int num_iter = 8;
    const float reci_num_iter_f = 1.0 / float(num_iter);
    vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
      vec4 sumcol = vec4(0.0);
      vec4 sumw = vec4(0.0);
      for (int i = 0; i < num_iter; ++i) {
        float t = float(i) * reci_num_iter_f;
        vec4 w = spectrum_offset(t);
        sumw += w;
        sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
      }
      return sumcol / sumw;
    }
    `;

    const colorFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float chromaticAberrationAmount;
    uniform float minInputLevel;
    uniform float maxInputLevel;
    uniform float gammaLevel;
    uniform float exposure;
    uniform float fisheyeStrength;
    uniform float fisheyeRadius;
    uniform float time;
    uniform int visionMode;
    uniform float thermalSensitivity;
    uniform float nightVisionNoise;
    uniform float nightVisionGain;
    uniform float crtIntensity;
    in vec2 vUv;
    out vec4 fragColor;

    ${chromaticAberrationShaderChunk}

    vec2 applyFisheye(vec2 uv, float strength, float radius) {
      if (abs(strength) < 0.0001) return uv;
      vec2 p = uv - 0.5;
      float d = length(p);
      if (d > radius * 1.5) return uv;
      float r = d / max(radius, 0.001);
      float theta = atan(p.y, p.x);
      float rDist = r + strength * (r * r * r);
      return 0.5 + vec2(cos(theta), sin(theta)) * (rDist * radius);
    }

    vec3 ACESFilmicToneMapping(vec3 color) {
      float a = 2.51;
      float b = 0.03;
      float c = 2.43;
      float d = 0.59;
      float e = 0.14;
      return clamp((color * (a * color + b)) / (color * (c * color + d) + e), 0.0, 1.0);
    }

    vec3 gammaCorrect(vec3 color, vec3 gamma) {
      return pow(max(color, vec3(0.0)), 1.0 / gamma);
    }
    vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
      return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
    }
    vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
      return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
    }

    vec3 applyNightVision(vec3 color, vec2 uv, float timeVal, float noiseAmt, float gain, float crt) {
      float lum = dot(color, vec3(0.299, 0.587, 0.114));
      float amplified = pow(lum * gain, 0.72);
      vec3 phosphorColor = mix(vec3(0.02, 0.12, 0.03), vec3(0.18, 1.0, 0.32), clamp(amplified, 0.0, 1.0));
      phosphorColor += vec3(0.7, 1.0, 0.8) * max(0.0, amplified - 0.75) * 1.8;

      vec2 p = uv - 0.5;
      float tubeDist = length(p);
      float tubeMask = smoothstep(0.72, 0.44, tubeDist);

      float n = fract(sin(dot(uv * 280.0 + timeVal * 0.05, vec2(12.9898, 78.233))) * 43758.5453);
      float scanline = sin(uv.y * 650.0) * crt;

      phosphorColor += (n - 0.5) * noiseAmt * 2.0 + scanline;
      return clamp(phosphorColor * tubeMask, 0.0, 1.0);
    }

    vec3 ironbow(float t) {
      t = clamp(t, 0.0, 1.0);
      vec3 c0 = vec3(0.02, 0.01, 0.18);
      vec3 c1 = vec3(0.22, 0.02, 0.48);
      vec3 c2 = vec3(0.82, 0.05, 0.25);
      vec3 c3 = vec3(1.0, 0.62, 0.02);
      vec3 c4 = vec3(1.0, 1.0, 0.92);

      if (t < 0.25) return mix(c0, c1, t * 4.0);
      if (t < 0.50) return mix(c1, c2, (t - 0.25) * 4.0);
      if (t < 0.75) return mix(c2, c3, (t - 0.50) * 4.0);
      return mix(c3, c4, (t - 0.75) * 4.0);
    }

    vec3 applyThermal(vec3 color, vec2 uv, float sensitivity, float crt, bool whiteHot) {
      float lum = dot(color, vec3(0.299, 0.587, 0.114));
      float heat = clamp(lum * sensitivity, 0.0, 1.0);
      float sensorRaster = sin(uv.y * 900.0) * (crt * 0.3);
      heat = clamp(heat + sensorRaster, 0.0, 1.0);

      if (whiteHot) {
        float grad = pow(heat, 0.85);
        return vec3(grad);
      } else {
        return ironbow(heat);
      }
    }

    void main() {
      vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
      vec4 col = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
      vec3 finalCol = col.rgb;

      if (visionMode == 1) {
        finalCol = applyNightVision(finalCol, uv, time, nightVisionNoise, nightVisionGain, crtIntensity);
      } else if (visionMode == 2) {
        finalCol = applyThermal(finalCol, uv, thermalSensitivity, crtIntensity, false);
      } else if (visionMode == 3) {
        finalCol = applyThermal(finalCol, uv, thermalSensitivity, crtIntensity, true);
      } else {
        vec3 exposedColor = finalCol * exposure;
        vec3 toneMappedColor = ACESFilmicToneMapping(exposedColor);
        finalCol = finalLevels(toneMappedColor, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
      }

      fragColor = vec4(finalCol, 1.0);
    }
    `;

    const copyFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      fragColor = texture(inputTexture, vUv);
    }
    `;

    function createFBO(w, h, options = {}) {
      return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
        wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
        wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
        minFilter: options.minFilter || THREE.LinearFilter,
        magFilter: options.magFilter || THREE.LinearFilter,
        format: options.format || THREE.RGBAFormat,
        type: options.type || THREE.HalfFloatType,
        stencilBuffer: options.stencilBuffer || false,
        depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : true,
        samples: options.samples || 0,
      });
    }

    class ShaderPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbo = createFBO(1, 1, options);
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
        this.texture = this.fbo.texture;
      }
      render(renderer, toScreen = false) {
        if (!toScreen) {
          renderer.setRenderTarget(this.fbo);
        }
        renderer.render(this.orthoScene, this.orthoCamera);
        if (!toScreen) {
          renderer.setRenderTarget(null);
        }
      }
      setSize(width, height) {
        this.fbo.setSize(Math.max(1, width), Math.max(1, height));
        this.orthoQuad.scale.set(width, height, 1);
      }
    }

    class ShaderPingPongPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
        this.currentFBO = 0;
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
      }
      render(renderer) {
        renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
        renderer.render(this.orthoScene, this.orthoCamera);
        renderer.setRenderTarget(null);
        this.currentFBO = 1 - this.currentFBO;
      }
      get current() { return this.fbos[this.currentFBO]; }
      get texture() { return this.current.texture; }
      setSize(width, height) {
        const w = Math.max(1, width);
        const h = Math.max(1, height);
        this.orthoQuad.scale.set(w, h, 1);
        this.fbos[0].setSize(w, h);
        this.fbos[1].setSize(w, h);
      }
    }

    class BloomPass {
      constructor(strength = 0.8, radius = 0.5, threshold = 0.2, levels = 5) {
        this.strength = strength;
        this.radius = radius;
        this.threshold = threshold;
        this.enabled = true;
        this.levels = levels;

        this.brightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            bloomThreshold: { value: this.threshold },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: brightFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.brightPass = new ShaderPass(this.brightShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.blurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            direction: { value: new THREE.Vector2(0, 1) },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: blurFragmentShader,
          glslVersion: THREE.GLSL3,
        });

        this.blurPasses = [];
        for (let i = 0; i < this.levels; i++) {
          this.blurPasses.push(new ShaderPingPongPass(this.blurShader, {
            format: THREE.RGBAFormat,
            type: THREE.HalfFloatType,
          }));
        }
      }

      setSize(w, h) {
        let tw = Math.max(1, w);
        let th = Math.max(1, h);
        this.brightPass.setSize(tw, th);
        for (let i = 0; i < this.levels; i++) {
          tw = Math.max(1, Math.round(tw / 2));
          th = Math.max(1, Math.round(th / 2));
          this.blurPasses[i].setSize(tw, th);
        }
      }

      set source(texture) {
        this.brightShader.uniforms.inputTexture.value = texture;
      }

      render(renderer) {
        if (!this.enabled || this.strength <= 0.001) return;

        this.brightShader.uniforms.bloomThreshold.value = this.threshold;
        this.brightPass.render(renderer);

        const baseOffset = Math.max(0.1, this.radius * 2.0);
        const u = this.blurShader.uniforms;

        for (let j = 0; j < this.levels; j++) {
          const blurPass = this.blurPasses[j];
          const stepOffset = baseOffset * (1.0 + j * 0.5);

          u.direction.value.set(stepOffset, 0);
          u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
          blurPass.render(renderer);

          u.direction.value.set(0, stepOffset * 0.5);
          u.inputTexture.value = blurPass.current.texture;
          blurPass.render(renderer);
        }
      }
    }

    const VISION_MODE_MAP = {
      'Normal (Cinematic)': 0,
      'Night Vision (Phosphor)': 1,
      'Thermal (Ironbow)': 2,
      'Thermal (White-Hot)': 3,
    };

    class InlinePostProcessor {
      constructor(renderer, params = {}) {
        this.renderer = renderer;

        this.settings = {
          enabled: params.enabled !== undefined ? params.enabled : true,
          bloomEnabled: params.bloomEnabled !== undefined ? params.bloomEnabled : true,
          bloomStrength: params.bloomStrength !== undefined ? params.bloomStrength : 1.1,
          bloomRadius: params.bloomRadius !== undefined ? params.bloomRadius : 0.5,
          bloomThreshold: params.bloomThreshold !== undefined ? params.bloomThreshold : 0.18,

          raysEnabled: params.raysEnabled !== undefined ? params.raysEnabled : true,
          raysStrength: params.raysStrength !== undefined ? params.raysStrength : 0.75,
          raysDensity: params.raysDensity !== undefined ? params.raysDensity : 1.0,
          raysMaxDensity: params.raysMaxDensity !== undefined ? params.raysMaxDensity : 0.5,
          raysDistanceAttenuation: params.raysDistanceAttenuation !== undefined ? params.raysDistanceAttenuation : 2.0,
          raysThreshold: params.raysThreshold !== undefined ? params.raysThreshold : 0.14,
          raysColor: params.raysColor ? (params.raysColor.isColor ? params.raysColor.clone() : new THREE.Color(params.raysColor)) : new THREE.Color(0x4ed4e6),
          raysColorHex: params.raysColorHex || (typeof params.raysColor === 'string' ? params.raysColor : '#4ed4e6'),

          anamorphicEnabled: params.anamorphicEnabled !== undefined ? params.anamorphicEnabled : false,
          anamorphicIntensity: params.anamorphicIntensity !== undefined ? params.anamorphicIntensity : 4.0,
          anamorphicThreshold: params.anamorphicThreshold !== undefined ? params.anamorphicThreshold : 0.35,
          anamorphicSamples: params.anamorphicSamples !== undefined ? params.anamorphicSamples : 64,
          anamorphicRadius: params.anamorphicRadius !== undefined ? params.anamorphicRadius : 0.0,
          anamorphicSmoothWidth: params.anamorphicSmoothWidth !== undefined ? params.anamorphicSmoothWidth : 0.05,
          anamorphicColor: params.anamorphicColor ? (params.anamorphicColor.isColor ? params.anamorphicColor.clone() : new THREE.Color(params.anamorphicColor)) : new THREE.Color(0x4ed4e6),
          anamorphicColorHex: params.anamorphicColorHex || '#4ed4e6',

          visionMode: params.visionMode !== undefined ? params.visionMode : 'Normal (Cinematic)',
          thermalSensitivity: params.thermalSensitivity !== undefined ? params.thermalSensitivity : 1.4,
          nightVisionGain: params.nightVisionGain !== undefined ? params.nightVisionGain : 2.1,
          nightVisionNoise: params.nightVisionNoise !== undefined ? params.nightVisionNoise : 0.05,
          crtIntensity: params.crtIntensity !== undefined ? params.crtIntensity : 0.0,

          fisheyeStrength: params.fisheyeStrength !== undefined ? params.fisheyeStrength : 0.0,
          fisheyeRadius: params.fisheyeRadius !== undefined ? params.fisheyeRadius : 1.0,
          chromaticAberration: params.chromaticAberration !== undefined ? params.chromaticAberration : 0.015,
          vignetteBoost: params.vignetteBoost !== undefined ? params.vignetteBoost : 1.15,
          vignetteReduction: params.vignetteReduction !== undefined ? params.vignetteReduction : 0.7,
          noiseIntensity: params.noiseIntensity !== undefined ? params.noiseIntensity : 0.012,

          gamma: params.gamma !== undefined ? params.gamma : 1.0,
          minInputLevel: params.minInputLevel !== undefined ? params.minInputLevel : 0.0,
          maxInputLevel: params.maxInputLevel !== undefined ? params.maxInputLevel : 1.0,
          exposure: params.exposure !== undefined ? params.exposure : 1.0,
        };

        this.sceneTarget = createFBO(1, 1, { type: THREE.HalfFloatType });
        this.bloomPass = new BloomPass(
          this.settings.bloomStrength,
          this.settings.bloomRadius,
          this.settings.bloomThreshold,
          5
        );

        this.moonScreenPos = new THREE.Vector3(0.5, 0.7, 1.0);
        this.moonInFront = true;

        this.godRaysMaskShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            threshold: { value: this.settings.raysThreshold },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: godRaysDepthMaskShader,
          glslVersion: THREE.GLSL3,
        });
        this.godRaysMaskPass = new ShaderPass(this.godRaysMaskShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.godRaysGenShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            vSunPositionScreenSpace: { value: this.moonScreenPos },
            fStepSize: { value: 1.0 },
            distanceAttenuation: { value: this.settings.raysDistanceAttenuation },
            maxDensity: { value: this.settings.raysMaxDensity },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: godRaysGenerateShader,
          glslVersion: THREE.GLSL3,
        });
        this.godRaysPingPong = new ShaderPingPongPass(this.godRaysGenShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.anamorphicBrightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            threshold: { value: this.settings.anamorphicThreshold },
            smoothWidth: { value: this.settings.anamorphicSmoothWidth },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: anamorphicBrightShader,
          glslVersion: THREE.GLSL3,
        });
        this.anamorphicBrightPass = new ShaderPass(this.anamorphicBrightShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.anamorphicBlurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            resolution: { value: new THREE.Vector2(1, 1) },
            samples: { value: this.settings.anamorphicSamples },
            intensity: { value: this.settings.anamorphicIntensity },
            tintColor: { value: this.settings.anamorphicColor },
            bloomRadius: { value: this.settings.anamorphicRadius },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: anamorphicBlurShader,
          glslVersion: THREE.GLSL3,
        });
        this.anamorphicBlurPass = new ShaderPass(this.anamorphicBlurShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.finalShader = new THREE.RawShaderMaterial({
          uniforms: {
            resolution: { value: new THREE.Vector2(1, 1) },
            bloomEnabled: { value: this.settings.bloomEnabled },
            bloomStrength: { value: this.settings.bloomStrength },
            raysEnabled: { value: this.settings.raysEnabled },
            raysStrength: { value: this.settings.raysStrength },
            raysColor: { value: this.settings.raysColor },
            anamorphicEnabled: { value: this.settings.anamorphicEnabled },
            vignetteBoost: { value: this.settings.vignetteBoost },
            vignetteReduction: { value: this.settings.vignetteReduction },
            noiseIntensity: { value: this.settings.noiseIntensity },
            inputTexture: { value: null },
            blur0Texture: { value: null },
            blur1Texture: { value: null },
            blur2Texture: { value: null },
            blur3Texture: { value: null },
            blur4Texture: { value: null },
            raysTexture: { value: null },
            anamorphicTexture: { value: null },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: finalFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.finalPass = new ShaderPass(this.finalShader);

        this.rgbShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: this.finalPass.texture },
            fisheyeStrength: { value: this.settings.fisheyeStrength },
            fisheyeRadius: { value: this.settings.fisheyeRadius },
            chromaticAberrationAmount: { value: this.settings.chromaticAberration },
            minInputLevel: { value: this.settings.minInputLevel },
            maxInputLevel: { value: this.settings.maxInputLevel },
            gammaLevel: { value: this.settings.gamma },
            exposure: { value: this.settings.exposure },
            visionMode: { value: VISION_MODE_MAP[this.settings.visionMode] ?? 0 },
            thermalSensitivity: { value: this.settings.thermalSensitivity },
            nightVisionGain: { value: this.settings.nightVisionGain },
            nightVisionNoise: { value: this.settings.nightVisionNoise },
            crtIntensity: { value: this.settings.crtIntensity },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: colorFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.rgbPass = new ShaderPass(this.rgbShader);

        this.copyShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: copyFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.copyPass = new ShaderPass(this.copyShader);
      }

      updateSettings() {
        this.bloomPass.enabled = this.settings.bloomEnabled;
        this.bloomPass.strength = this.settings.bloomStrength;
        this.bloomPass.radius = this.settings.bloomRadius;
        this.bloomPass.threshold = this.settings.bloomThreshold;

        this.godRaysMaskShader.uniforms.threshold.value = this.settings.raysThreshold;
        this.godRaysGenShader.uniforms.distanceAttenuation.value = this.settings.raysDistanceAttenuation;
        this.godRaysGenShader.uniforms.maxDensity.value = this.settings.raysMaxDensity;

        this.anamorphicBrightShader.uniforms.threshold.value = this.settings.anamorphicThreshold;
        this.anamorphicBrightShader.uniforms.smoothWidth.value = this.settings.anamorphicSmoothWidth;
        this.anamorphicBlurShader.uniforms.samples.value = this.settings.anamorphicSamples;
        this.anamorphicBlurShader.uniforms.intensity.value = this.settings.anamorphicIntensity;
        this.anamorphicBlurShader.uniforms.tintColor.value.copy(this.settings.anamorphicColor);
        this.anamorphicBlurShader.uniforms.bloomRadius.value = this.settings.anamorphicRadius;

        this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
        this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
        this.finalShader.uniforms.raysEnabled.value = this.settings.raysEnabled && this.moonInFront;
        this.finalShader.uniforms.raysStrength.value = this.settings.raysStrength;
        this.finalShader.uniforms.raysColor.value.copy(this.settings.raysColor);
        this.finalShader.uniforms.anamorphicEnabled.value = this.settings.anamorphicEnabled;
        this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
        this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
        this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;

        this.rgbShader.uniforms.fisheyeStrength.value = this.settings.fisheyeStrength;
        this.rgbShader.uniforms.fisheyeRadius.value = this.settings.fisheyeRadius;
        this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
        this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
        this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
        this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
        this.rgbShader.uniforms.exposure.value = this.settings.exposure;
        this.rgbShader.uniforms.visionMode.value = VISION_MODE_MAP[this.settings.visionMode] ?? 0;
        this.rgbShader.uniforms.thermalSensitivity.value = this.settings.thermalSensitivity;
        this.rgbShader.uniforms.nightVisionGain.value = this.settings.nightVisionGain;
        this.rgbShader.uniforms.nightVisionNoise.value = this.settings.nightVisionNoise;
        this.rgbShader.uniforms.crtIntensity.value = this.settings.crtIntensity;
      }

      setSize(w0, h0, dpr = 1) {
        const w = Math.max(1, Math.floor(w0 * dpr));
        const h = Math.max(1, Math.floor(h0 * dpr));
        this.sceneTarget.setSize(w, h);
        this.finalPass.setSize(w, h);
        this.finalShader.uniforms.resolution.value.set(w, h);
        this.bloomPass.setSize(w, h);

        const grW = Math.max(1, Math.round(w / 2));
        const grH = Math.max(1, Math.round(h / 2));
        this.godRaysMaskPass.setSize(grW, grH);
        this.godRaysPingPong.setSize(grW, grH);

        const anW = Math.max(1, Math.round(w / 4));
        const anH = Math.max(1, Math.round(h / 4));
        this.anamorphicBrightPass.setSize(anW, anH);
        this.anamorphicBlurPass.setSize(anW, anH);
        this.anamorphicBlurShader.uniforms.resolution.value.set(anW, anH);

        this.rgbPass.setSize(w, h);
        this.copyPass.setSize(w, h);
      }

      setMoonScreenPosition(camera, moonWorldPos) {
        if (!this._camDir) {
          this._camDir = new THREE.Vector3();
          this._toMoon = new THREE.Vector3();
          this._ndc = new THREE.Vector3();
        }
        camera.getWorldDirection(this._camDir);
        this._toMoon.copy(moonWorldPos).sub(camera.position).normalize();
        const dot = this._camDir.dot(this._toMoon);

        if (dot <= 0.02) {
          this.moonInFront = false;
          this.finalShader.uniforms.raysEnabled.value = false;
          return;
        }

        this.moonInFront = true;
        const fade = THREE.MathUtils.clamp((dot - 0.02) / 0.15, 0.0, 1.0);

        this._ndc.copy(moonWorldPos).project(camera);
        const screenX = this._ndc.x * 0.5 + 0.5;
        const screenY = this._ndc.y * 0.5 + 0.5;
        const screenZ = fade;

        this.moonScreenPos.set(screenX, screenY, screenZ);
        this.godRaysGenShader.uniforms.vSunPositionScreenSpace.value.set(screenX, screenY, screenZ);
      }

      renderScene(scene, camera) {
        if (!this.settings.enabled) {
          this.renderer.render(scene, camera);
          return;
        }
        this.renderer.setRenderTarget(this.sceneTarget);
        this.renderer.render(scene, camera);
        this.renderer.setRenderTarget(null);
        this.render(this.sceneTarget.texture);
      }

      render(sourceTexture) {
        if (!this.settings.enabled) {
          this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
          this.copyPass.render(this.renderer, true);
          return;
        }

        this.updateSettings();

        this.bloomPass.source = sourceTexture;
        this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
        this.bloomPass.render(this.renderer);

        this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
        this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
        this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
        this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
        this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

        if (this.settings.raysEnabled && this.settings.raysStrength > 0.001 && this.moonInFront) {
          this.godRaysMaskShader.uniforms.inputTexture.value = sourceTexture;
          this.godRaysMaskShader.uniforms.threshold.value = this.settings.raysThreshold;
          this.godRaysMaskPass.render(this.renderer);

          const filterLen = this.settings.raysDensity;
          const tapsPerPass = 6.0;

          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -1.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysMaskPass.texture;
          this.godRaysPingPong.render(this.renderer);

          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -2.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysPingPong.texture;
          this.godRaysPingPong.render(this.renderer);

          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -3.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysPingPong.texture;
          this.godRaysPingPong.render(this.renderer);

          this.finalPass.shader.uniforms.raysTexture.value = this.godRaysPingPong.texture;
          this.finalPass.shader.uniforms.raysEnabled.value = true;
        } else {
          this.finalPass.shader.uniforms.raysEnabled.value = false;
        }

        if (this.settings.anamorphicEnabled && this.settings.anamorphicIntensity > 0.001) {
          this.anamorphicBrightShader.uniforms.inputTexture.value = sourceTexture;
          this.anamorphicBrightShader.uniforms.threshold.value = this.settings.anamorphicThreshold;
          this.anamorphicBrightShader.uniforms.smoothWidth.value = this.settings.anamorphicSmoothWidth;
          this.anamorphicBrightPass.render(this.renderer);

          this.anamorphicBlurShader.uniforms.inputTexture.value = this.anamorphicBrightPass.texture;
          this.anamorphicBlurShader.uniforms.samples.value = this.settings.anamorphicSamples;
          this.anamorphicBlurShader.uniforms.intensity.value = this.settings.anamorphicIntensity;
          this.anamorphicBlurShader.uniforms.tintColor.value.copy(this.settings.anamorphicColor);
          this.anamorphicBlurShader.uniforms.bloomRadius.value = this.settings.anamorphicRadius;
          this.anamorphicBlurPass.render(this.renderer);

          this.finalPass.shader.uniforms.anamorphicTexture.value = this.anamorphicBlurPass.texture;
          this.finalPass.shader.uniforms.anamorphicEnabled.value = true;
        } else {
          this.finalPass.shader.uniforms.anamorphicEnabled.value = false;
        }

        const randomTime = Math.random() * 100000;
        this.finalPass.shader.uniforms.time.value = randomTime;
        this.rgbPass.shader.uniforms.time.value = randomTime;

        this.finalPass.render(this.renderer);
        this.rgbPass.render(this.renderer, true);
      }

        return root;
      }
    }

    // --- PROCEDURAL TEXTURES (CANVAS GENERATION) ---
    function createCorrosionTexture(baseColorHex, verdigrisHex, brassHex) {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = baseColorHex;
      ctx.fillRect(0, 0, 1024, 1024);

      const vCol = new THREE.Color(verdigrisHex);
      const bCol = new THREE.Color(brassHex);

      for (let i = 0; i < 110; i++) {
        const x = Math.random() * 1024;
        const y = Math.random() * 1024;
        const r = 15 + Math.random() * 95;
        const grad = ctx.createRadialGradient(x, y, 4, x, y, r);
        const alpha = 0.3 + Math.random() * 0.45;
        grad.addColorStop(0, `rgba(${Math.floor(vCol.r*255)}, ${Math.floor(vCol.g*255)}, ${Math.floor(vCol.b*255)}, ${alpha})`);
        grad.addColorStop(0.65, `rgba(${Math.floor(vCol.r*190)}, ${Math.floor(vCol.g*190)}, ${Math.floor(vCol.b*190)}, ${alpha * 0.5})`);
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }

      for (let i = 0; i < 50; i++) {
        const x = Math.random() * 1024;
        const y = Math.random() * 1024;
        const r = 8 + Math.random() * 32;
        const grad = ctx.createRadialGradient(x, y, 2, x, y, r);
        grad.addColorStop(0, `rgba(${Math.floor(bCol.r*255)}, ${Math.floor(bCol.g*255)}, ${Math.floor(bCol.b*255)}, 0.45)`);
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }

      const imgData = ctx.getImageData(0, 0, 1024, 1024);
      const data = imgData.data;
      for (let i = 0; i < data.length; i += 4) {
        const noise = (Math.random() - 0.5) * 32;
        data[i] = Math.min(255, Math.max(0, data[i] + noise));
        data[i+1] = Math.min(255, Math.max(0, data[i+1] + noise));
        data[i+2] = Math.min(255, Math.max(0, data[i+2] + noise));
      }
      ctx.putImageData(imgData, 0, 0);

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      return { canvas, ctx, texture };
    }

    function createBumpTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#808080';
      ctx.fillRect(0, 0, 512, 512);

      for (let i = 0; i < 200; i++) {
        const x = Math.random() * 512;
        const y = Math.random() * 512;
        const r = 3 + Math.random() * 14;
        ctx.fillStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.2)' : 'rgba(0,0,0,0.22)';
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }
      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      return texture;
    }

    function createVisorGrimeTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      const grad = ctx.createRadialGradient(256, 256, 120, 256, 256, 256);
      grad.addColorStop(0, 'rgba(0,0,0,0)');
      grad.addColorStop(0.65, 'rgba(15,45,35,0.25)');
      grad.addColorStop(1, 'rgba(8,30,22,0.85)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 512);

      ctx.strokeStyle = 'rgba(200,240,230,0.25)';
      ctx.lineWidth = 1.2;
      for (let i = 0; i < 24; i++) {
        ctx.beginPath();
        const sx = Math.random() * 512;
        const sy = Math.random() * 512;
        ctx.moveTo(sx, sy);
        ctx.lineTo(sx + (Math.random() - 0.5) * 70, sy + (Math.random() - 0.5) * 70);
        ctx.stroke();
      }

      return new THREE.CanvasTexture(canvas);
    }

    // 2.6 Top Observation Viewport
    const topPortGroup = new THREE.Group();
    topPortGroup.position.set(0, 0.95, 0.24);

    helmetGroup.add(topPortGroup);

    const topBezel = new THREE.Mesh(new THREE.TorusGeometry(0.18, 0.032, 14, 28), brassMaterial);
    topBezel.position.z = 0.04;
    topPortGroup.add(topBezel);

    const topGlass = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.17, 0.018, 24), visorGlassMaterial);
    topGlass.rotation.x = Math.PI / 2;
    topGlass.position.z = 0.03;
    topPortGroup.add(topGlass);

    // 2.7 Crown Top Lifting Ring Loop
    const crownLoopGeo = new THREE.TorusGeometry(0.11, 0.028, 12, 24);

    crownLoop.position.set(0, 1.16, 0);
    crownLoop.rotation.y = Math.PI / 2;

    helmetGroup.add(crownLoop);

    // 2.8 Exhaust Valve Assembly
    const exhaustGroup = new THREE.Group();
    exhaustGroup.position.set(0.66, 0.22, -0.22);
    exhaustGroup.rotation.set(0, -Math.PI / 3, -Math.PI / 4);
    helmetGroup.add(exhaustGroup);

    const exhaustBody = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.09, 0.20, 16), brassMaterial);
    exhaustBody.castShadow = true;
    exhaustGroup.add(exhaustBody);

    const exhaustKnob = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 0.05, 12), brassMaterial);
    exhaustKnob.position.y = 0.12;
    exhaustGroup.add(exhaustKnob);

    // 2.9 Rear Air Intake Elbow & Coiling Hose
    const airElbow = new THREE.Mesh(new THREE.TorusGeometry(0.11, 0.045, 12, 20, Math.PI / 2), brassMaterial);
    airElbow.position.set(-0.32, 0.08, -0.66);
    airElbow.rotation.set(Math.PI / 2, 0, -Math.PI / 4);
    helmetGroup.add(airElbow);

    const hoseCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(-0.38, 0.06, -0.74),
      new THREE.Vector3(-0.72, -0.22, -1.1),
      new THREE.Vector3(-1.25, -0.46, -0.85),
      new THREE.Vector3(-1.55, -0.52, -0.2),

    const hoseGeo = new THREE.TubeGeometry(hoseCurve, 64, 0.06, 16, false);
    const hoseMat = new THREE.MeshStandardMaterial({
      color: 0x141815,
      roughness: 0.88,

    // ==========================================
    // 3. THE ABYSSAL DEEP-SEA ENTITY (LEVIATHAN)
    // ==========================================
    // Glides gracefully in the open water in front of the circular visor port!
    const entityGroup = new THREE.Group();
    sceneRoot.add(entityGroup);

    const ENTITY_SEGMENTS = 28;
    const segmentMeshes = [];
    const finMeshes = [];

    for (let i = 0; i < ENTITY_SEGMENTS; i++) {
      let radius;
      if (i < 4) {
        radius = 0.12 + (i / 4) * 0.08;
      } else {
        radius = 0.20 * Math.pow(1.0 - (i - 4) / (ENTITY_SEGMENTS - 3), 0.72);
      }
      radius = Math.max(0.02, radius);

      const segGeo = new THREE.SphereGeometry(radius, 16, 12);
      segGeo.scale(1.0, 1.35, 0.85);
      const segMesh = new THREE.Mesh(segGeo, entityMaterial);
      segMesh.castShadow = true;
      entityGroup.add(segMesh);
      segmentMeshes.push(segMesh);

      if (i >= 3 && i < ENTITY_SEGMENTS - 3 && i % 2 === 0) {
        const dFinGeo = new THREE.PlaneGeometry(0.16, radius * 2.5);
        const dFin = new THREE.Mesh(dFinGeo, finMaterial);
        dFin.position.y = radius * 0.95;
        dFin.rotation.x = Math.PI / 2;
        segMesh.add(dFin);
        finMeshes.push(dFin);

        [-1, 1].forEach(side => {
          const lFin = new THREE.Mesh(new THREE.PlaneGeometry(0.12, radius * 1.6), finMaterial);
          lFin.position.set(side * radius * 0.92, -radius * 0.2, 0);
          lFin.rotation.y = side * Math.PI / 4;
          segMesh.add(lFin);
          finMeshes.push(lFin);
        });
      }
    }

    // MULTI-EYED CLUSTER (7 Glowing Alien Eyes on the head segment)
    const headSegment = segmentMeshes[2];
    const eyeOffsets = [
      { x: 0.08, y: 0.07, z: 0.11, r: 0.042 },
      { x: -0.08, y: 0.07, z: 0.11, r: 0.042 },
      { x: 0.13, y: 0.01, z: 0.05, r: 0.030 },
      { x: -0.13, y: 0.01, z: 0.05, r: 0.030 },
      { x: 0.11, y: 0.12, z: -0.02, r: 0.025 },
      { x: -0.11, y: 0.12, z: -0.02, r: 0.025 },
      { x: 0.00, y: 0.16, z: 0.07, r: 0.036 }
    ];

    const eyeMeshes = [];
    eyeOffsets.forEach((eInfo) => {
      const eyeGeo = new THREE.SphereGeometry(eInfo.r, 16, 16);
      const eyeMesh = new THREE.Mesh(eyeGeo, eyeMaterial);
      eyeMesh.position.set(eInfo.x, eInfo.y, eInfo.z);

      const pupilGeo = new THREE.BoxGeometry(eInfo.r * 0.28, eInfo.r * 1.5, eInfo.r * 0.5);
      const pupilMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
      const pupil = new THREE.Mesh(pupilGeo, pupilMat);
      pupil.position.z = eInfo.r * 0.72;
      eyeMesh.add(pupil);

      headSegment.add(eyeMesh);
      eyeMeshes.push(eyeMesh);
    });

    const entityEyeLight = new THREE.PointLight(
      PALETTES[params.palette].entityEyes,
      params.entityGlowIntensity,
      3.5,
      1.8
    );
    headSegment.add(entityEyeLight);

    const barbels = [];
    [-0.05, 0.0, 0.05].forEach((bx) => {
      const barbelCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(bx, -0.06, 0.12),
        new THREE.Vector3(bx * 1.4, -0.18, 0.24),
        new THREE.Vector3(bx * 1.8, -0.32, 0.36)
      ]);
      const barbelGeo = new THREE.TubeGeometry(barbelCurve, 12, 0.010, 6, false);
      const barbelMesh = new THREE.Mesh(barbelGeo, finMaterial);
      segmentMeshes[1].add(barbelMesh);
      barbels.push(barbelMesh);
    });

    // ==========================================
    // 4. VOLUMETRIC LIGHT BEAM (GOD RAYS)
    // ==========================================
    const beamVertexShader = `
      varying vec2 vUv;
      varying vec3 vNormal;
      varying vec3 vWorldPosition;
      void main() {
        vUv = uv;
        vNormal = normalize(normalMatrix * normal);
        vec4 worldPos = modelMatrix * vec4(position, 1.0);
        vWorldPosition = worldPos.xyz;
        gl_Position = projectionMatrix * viewMatrix * worldPos;
      }
    `;

    const beamFragmentShader = `
      uniform vec3 uColor;
      uniform float uIntensity;
      uniform float uTime;
      varying vec2 vUv;
      varying vec3 vNormal;
      varying vec3 vWorldPosition;

      float hash(vec2 p) {
        return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
      }
      float noise(vec2 p) {
        vec2 i = floor(p);
        vec2 f = fract(p);
        vec2 u = f*f*(3.0-2.0*f);
        return mix(mix(hash(i + vec2(0.0,0.0)), hash(i + vec2(1.0,0.0)), u.x),
                   mix(hash(i + vec2(0.0,1.0)), hash(i + vec2(1.0,1.0)), u.x), u.y);
      }

      void main() {
        float lengthFade = sin(vUv.y * 3.14159265);
        lengthFade = pow(lengthFade, 0.62);

        float rim = 1.0 - abs(dot(vNormal, vec3(0.0, 0.0, 1.0)));
        rim = pow(rim, 1.35);

        float caustic1 = noise(vec2(vUv.x * 10.0 + uTime * 0.4, vUv.y * 16.0 - uTime * 0.7));
        float caustic2 = noise(vec2(vUv.x * 20.0 - uTime * 0.5, vUv.y * 28.0 + uTime * 0.3));
        float caustics = (caustic1 * 0.6 + caustic2 * 0.4) * 0.8 + 0.45;

        float alpha = lengthFade * rim * caustics * uIntensity * 0.32;
        gl_FragColor = vec4(uColor, alpha);
      }
    `;

    const beamUniforms = {
      uColor: { value: new THREE.Color(PALETTES[params.palette].lightBeam) },
      uIntensity: { value: params.volumetricIntensity },
      uTime: { value: 0 }
    };

    const beamMat = new THREE.ShaderMaterial({
      vertexShader: beamVertexShader,
      fragmentShader: beamFragmentShader,
      uniforms: beamUniforms,
      transparent: true,
      blending: THREE.AdditiveBlending,
      side: THREE.DoubleSide,
      depthWrite: false
    });

    const beamGeo = new THREE.CylinderGeometry(0.12, 0.75, 4.2, 36, 16, true);
    beamGeo.translate(0, 2.1, 0);
    beamGeo.rotateX(Math.PI / 2);

    const beamMesh = new THREE.Mesh(beamGeo, beamMat);
    beamMesh.position.set(0.65, 1.8, 3.4);
    beamMesh.lookAt(0, 0.35, 0.82);
    sceneRoot.add(beamMesh);

    const beamSpotLight = new THREE.SpotLight(
      PALETTES[params.palette].lightBeam,
      params.beamLightIntensity,
      14.0,
      Math.PI / 6.5,
      0.65,
      1.1
    );
    beamSpotLight.position.copy(beamMesh.position);
    beamSpotLight.target.position.set(0, 0.35, 0.8);
    beamSpotLight.castShadow = true;
    beamSpotLight.shadow.mapSize.width = 1024;
    beamSpotLight.shadow.mapSize.height = 1024;
    beamSpotLight.shadow.bias = -0.001;
    sceneRoot.add(beamSpotLight);
    sceneRoot.add(beamSpotLight.target);

    const visorSpillGeo = new THREE.CylinderGeometry(0.36, 0.06, 1.5, 24, 8, true);
    visorSpillGeo.translate(0, 0.75, 0);
    visorSpillGeo.rotateX(-Math.PI / 2);
    const visorSpillMesh = new THREE.Mesh(visorSpillGeo, beamMat);
    visorSpillMesh.position.set(0, 0.35, 0.8);
    helmetGroup.add(visorSpillMesh);

    // ==========================================
    // 5. SCENE LIGHTING RIG
    // ==========================================
    const ambientLight = new THREE.AmbientLight(
      PALETTES[params.palette].ambientLight,
      params.ambientLightIntensity * params.sceneLightIntensity
    );
    scene.add(ambientLight);

    const fillLight = new THREE.DirectionalLight(
      PALETTES[params.palette].helmetVerdigris,
      params.fillLightIntensity * params.sceneLightIntensity
    );
    fillLight.position.set(-3.5, -0.4, 2.5);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(
      PALETTES[params.palette].lightBeam,
      params.rimLightIntensity * params.sceneLightIntensity
    );
    rimLight.position.set(0, 4.5, -4.0);
    scene.add(rimLight);

    // ==========================================
    // 6. PARTICLES: MARINE SNOW & RISING BUBBLES
    // ==========================================
    const snowCount = params.marineSnowDensity;
    const snowGeo = new THREE.BufferGeometry();
    const snowPos = new Float32Array(snowCount * 3);
    const snowVelocities = [];

    for (let i = 0; i < snowCount; i++) {
      snowPos[i * 3] = (Math.random() - 0.5) * 8.0;
      snowPos[i * 3 + 1] = -0.55 + Math.random() * 4.2;
      snowPos[i * 3 + 2] = (Math.random() - 0.5) * 8.0;
      snowVelocities.push({
        y: -0.002 - Math.random() * 0.004,
        x: (Math.random() - 0.5) * 0.002,
        z: (Math.random() - 0.5) * 0.002,
        wobble: Math.random() * Math.PI * 2
      });
    }
    snowGeo.setAttribute('position', new THREE.BufferAttribute(snowPos, 3));

    const pCanvas = document.createElement('canvas');
    pCanvas.width = 64;
    pCanvas.height = 64;
    const pCtx = pCanvas.getContext('2d');
    const pGrad = pCtx.createRadialGradient(32, 32, 2, 32, 32, 30);
    pGrad.addColorStop(0, 'rgba(255,255,255,1)');
    pGrad.addColorStop(0.3, 'rgba(200,240,255,0.7)');
    pGrad.addColorStop(1, 'rgba(0,0,0,0)');
    pCtx.fillStyle = pGrad;
    pCtx.fillRect(0, 0, 64, 64);
    const particleTex = new THREE.CanvasTexture(pCanvas);

    const snowMat = new THREE.PointsMaterial({
      color: 0xffffff,
      size: 0.045,
      map: particleTex,
      transparent: true,
      opacity: 0.65,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const marineSnow = new THREE.Points(snowGeo, snowMat);
    sceneRoot.add(marineSnow);

    const bubbleCount = 45;
    const bubbleGeo = new THREE.BufferGeometry();
    const bubblePos = new Float32Array(bubbleCount * 3);
    const bubbleData = [];

    for (let i = 0; i < bubbleCount; i++) {
      bubblePos[i * 3] = 0.66 + (Math.random() - 0.5) * 0.06;
      bubblePos[i * 3 + 1] = 0.25 + Math.random() * 2.6;
      bubblePos[i * 3 + 2] = -0.22 + (Math.random() - 0.5) * 0.06;
      bubbleData.push({
        baseX: 0.66,
        baseZ: -0.22,
        speed: 0.012 + Math.random() * 0.018,
        phase: Math.random() * Math.PI * 2
      });
    }
    bubbleGeo.setAttribute('position', new THREE.BufferAttribute(bubblePos, 3));

    const bubbleMat = new THREE.PointsMaterial({
      color: new THREE.Color(PALETTES[params.palette].lightBeam),
      size: 0.055,
      map: particleTex,
      transparent: true,
      opacity: 0.85,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const bubblePoints = new THREE.Points(bubbleGeo, bubbleMat);
    helmetGroup.add(bubblePoints);

    // ==========================================
    // 7. COLOR PALETTE APPLICATION WITH GSAP
    // ==========================================
    function applyPalette(paletteName, animate = true) {
      const p = PALETTES[paletteName] || PALETTES["Complementary"];
      const dur = animate ? 1.2 : 0.0;

      params.helmetColor = p.helmetBase;
      params.verdigrisColor = p.helmetVerdigris;
      params.brassColor = p.helmetBrass;
      params.lightBeamColor = p.lightBeam;
      params.entityEyeColor = p.entityEyes;
      params.waterFogColor = p.waterFog;

      const cData = createCorrosionTexture(p.helmetBase, p.helmetVerdigris, p.helmetBrass);
      helmetMaterial.map.dispose();
      helmetMaterial.map = cData.texture;
      helmetMaterial.needsUpdate = true;

      if (dur > 0) {
        gsap.to(brassMaterial.color, {
          r: new THREE.Color(p.helmetBrass).r,
          g: new THREE.Color(p.helmetBrass).g,
          b: new THREE.Color(p.helmetBrass).b,
          duration: dur
        });
        gsap.to(visorGlassMaterial.color, {
          r: new THREE.Color(p.glassTint).r,
          g: new THREE.Color(p.glassTint).g,
          b: new THREE.Color(p.glassTint).b,
          duration: dur
        });
        gsap.to(entityMaterial.color, {
          r: new THREE.Color(p.entityBody).r,
          g: new THREE.Color(p.entityBody).g,
          b: new THREE.Color(p.entityBody).b,
          duration: dur
        });
        gsap.to(eyeMaterial.color, {
          r: new THREE.Color(p.entityEyes).r,
          g: new THREE.Color(p.entityEyes).g,
          b: new THREE.Color(p.entityEyes).b,
          duration: dur
        });
        gsap.to(eyeMaterial.emissive, {
          r: new THREE.Color(p.entityEyes).r,
          g: new THREE.Color(p.entityEyes).g,
          b: new THREE.Color(p.entityEyes).b,
          duration: dur
        });
        gsap.to(finMaterial.color, {
          r: new THREE.Color(p.entityEyes).r,
          g: new THREE.Color(p.entityEyes).g,
          b: new THREE.Color(p.entityEyes).b,
          duration: dur
        });
        gsap.to(finMaterial.emissive, {
          r: new THREE.Color(p.entityEyes).r,
          g: new THREE.Color(p.entityEyes).g,
          b: new THREE.Color(p.entityEyes).b,
          duration: dur
        });
        gsap.to(beamUniforms.uColor.value, {
          r: new THREE.Color(p.lightBeam).r,
          g: new THREE.Color(p.lightBeam).g,
          b: new THREE.Color(p.lightBeam).b,
          duration: dur
        });
        gsap.to(beamSpotLight.color, {
          r: new THREE.Color(p.lightBeam).r,
          g: new THREE.Color(p.lightBeam).g,
          b: new THREE.Color(p.lightBeam).b,
          duration: dur
        });
        gsap.to(entityEyeLight.color, {
          r: new THREE.Color(p.entityEyes).r,
          g: new THREE.Color(p.entityEyes).g,
          b: new THREE.Color(p.entityEyes).b,
          duration: dur
        });
        gsap.to(bubbleMat.color, {
          r: new THREE.Color(p.lightBeam).r,
          g: new THREE.Color(p.lightBeam).g,
          b: new THREE.Color(p.lightBeam).b,
          duration: dur
        });
        gsap.to(seabedMat.color, {
          r: new THREE.Color(p.seabed).r,
          g: new THREE.Color(p.seabed).g,
          b: new THREE.Color(p.seabed).b,
          duration: dur
        });
        gsap.to(ambientLight.color, {
          r: new THREE.Color(p.ambientLight).r,
          g: new THREE.Color(p.ambientLight).g,
          b: new THREE.Color(p.ambientLight).b,
          duration: dur
        });
        gsap.to(fillLight.color, {
          r: new THREE.Color(p.helmetVerdigris).r,
          g: new THREE.Color(p.helmetVerdigris).g,
          b: new THREE.Color(p.helmetVerdigris).b,
          duration: dur
        });
        gsap.to(rimLight.color, {
          r: new THREE.Color(p.lightBeam).r,
          g: new THREE.Color(p.lightBeam).g,
          b: new THREE.Color(p.lightBeam).b,
          duration: dur
        });

        if (!params.greenscreen) {
          gsap.to(scene.background, {
            r: new THREE.Color(p.waterBg).r,
            g: new THREE.Color(p.waterBg).g,
            b: new THREE.Color(p.waterBg).b,
            duration: dur
          });
          if (scene.fog) {
            gsap.to(scene.fog.color, {
              r: new THREE.Color(p.waterFog).r,
              g: new THREE.Color(p.waterFog).g,
              b: new THREE.Color(p.waterFog).b,
              duration: dur
            });
          }
        }
      } else {
        brassMaterial.color.set(p.helmetBrass);
        visorGlassMaterial.color.set(p.glassTint);
        entityMaterial.color.set(p.entityBody);
        eyeMaterial.color.set(p.entityEyes);
        eyeMaterial.emissive.set(p.entityEyes);
        finMaterial.color.set(p.entityEyes);
        finMaterial.emissive.set(p.entityEyes);
        beamUniforms.uColor.value.set(p.lightBeam);
        beamSpotLight.color.set(p.lightBeam);
        entityEyeLight.color.set(p.entityEyes);
        bubbleMat.color.set(p.lightBeam);
        seabedMat.color.set(p.seabed);
        ambientLight.color.set(p.ambientLight);
        fillLight.color.set(p.helmetVerdigris);
        rimLight.color.set(p.lightBeam);

        if (!params.greenscreen) {
          scene.background.set(p.waterBg);
          if (scene.fog) scene.fog.color.set(p.waterFog);
        }
      }

      gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    // --- GREENSCREEN TOGGLE ---
    function toggleGreenscreen(val) {
      if (val) {
        scene.background.set(0x00ff00);
        scene.fog = null;
        seabedGroup.visible = false;
      } else {
        const p = PALETTES[params.palette] || PALETTES["Complementary"];
        scene.background.set(p.waterBg);
        scene.fog = new THREE.FogExp2(p.waterFog, 0.08);
        seabedGroup.visible = true;
      }
    }

    // --- LIGHTING INTENSITIES UPDATE ---
    function updateLighting() {
      beamSpotLight.intensity = params.beamLightIntensity * params.sceneLightIntensity;
      beamUniforms.uIntensity.value = params.volumetricIntensity * params.sceneLightIntensity;
      ambientLight.intensity = params.ambientLightIntensity * params.sceneLightIntensity;
      entityEyeLight.intensity = params.entityGlowIntensity * params.sceneLightIntensity;
      eyeMaterial.emissiveIntensity = params.entityGlowIntensity;
      finMaterial.emissiveIntensity = params.entityGlowIntensity * 0.45;
      fillLight.intensity = params.fillLightIntensity * params.sceneLightIntensity;
      rimLight.intensity = params.rimLightIntensity * params.sceneLightIntensity;
      renderer.toneMappingExposure = params.exposure;
    }

    // --- REBUILD RENDERER FOR ANTIALIAS TOGGLE ---
    function rebuildRenderer(antialias) {
      const oldCanvas = renderer.domElement;
      renderer.dispose();

      renderer = new THREE.WebGLRenderer({
        antialias: antialias,
        powerPreference: "high-performance"
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(params.dpr);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = params.exposure;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      container.replaceChild(renderer.domElement, oldCanvas);

      controls.dispose();
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.enableZoom = true;
      controls.enablePan = true;
      controls.screenSpacePanning = true;
      controls.target.set(0, 0.35, 0);
      controls.maxDistance = 10.0;
      controls.minDistance = 1.2;
      configureControls(params.mouseDragMode);

      bindPointerEvents();

      if (postProcessor) {
        postProcessor.renderer = renderer;
        postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);
      }
    }

    // --- PROCEDURAL VARIATION ON CLICK ---
    // NOTE: Per user request, postprocessing settings are strictly preserved
    // and NEVER shuffled or changed when clicking for a random scene!
    function randomizeScene(animate = true) {
      const paletteKeys = Object.keys(PALETTES);
      const chosenPalette = paletteKeys[Math.floor(Math.random() * paletteKeys.length)];
      params.palette = chosenPalette;

      params.volumetricIntensity = 1.8 + Math.random() * 2.2;
      params.entityGlowIntensity = 2.0 + Math.random() * 2.5;
      params.entityUndulation = 0.75 + Math.random() * 0.75;
      params.entitySpeed = 0.8 + Math.random() * 0.7;
      params.exposure = 1.05 + Math.random() * 0.45;

      gsap.to(helmetGroup.rotation, {
        x: 0.04 + (Math.random() - 0.5) * 0.08,
        y: -0.12 + (Math.random() - 0.5) * 0.22,
        z: 0.03 + (Math.random() - 0.5) * 0.06,
        duration: animate ? 1.4 : 0
      });

      applyPalette(chosenPalette, animate);
      updateLighting();
      // Notice: postProcessor.settings are completely untouched here!
    }

    let pointerDownPos = { x: 0, y: 0 };
    function bindPointerEvents() {
      renderer.domElement.addEventListener('pointerdown', (e) => {
        pointerDownPos = { x: e.clientX, y: e.clientY };
      });

      renderer.domElement.addEventListener('pointerup', (e) => {
        const dx = e.clientX - pointerDownPos.x;
        const dy = e.clientY - pointerDownPos.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 6 && params.randomizeOnClick) {
          randomizeScene(true);
        }
      });
    }
    bindPointerEvents();

    // --- LIL-GUI CONTROL PANEL (DEFAULT STYLES) ---
    const gui = new GUI({ title: "Abyssal Diving Helmet" });

    // 1. Color Schemes Folder
    const fColor = gui.addFolder("Color Scheme");
    fColor.add(params, 'palette', Object.keys(PALETTES)).name('Color Scheme').onChange(v => applyPalette(v, true));
    fColor.addColor(params, 'helmetColor').name('Bonnet Copper').onChange(v => {
      params.helmetColor = v;
      const c = createCorrosionTexture(v, params.verdigrisColor, params.brassColor);
      helmetMaterial.map = c.texture;
      helmetMaterial.needsUpdate = true;
    });
    fColor.addColor(params, 'verdigrisColor').name('Patina Verdigris').onChange(v => {
      params.verdigrisColor = v;
      const c = createCorrosionTexture(params.helmetColor, v, params.brassColor);
      helmetMaterial.map = c.texture;
      helmetMaterial.needsUpdate = true;
    });
    fColor.addColor(params, 'brassColor').name('Fittings Brass').onChange(v => {
      params.brassColor = v;
      brassMaterial.color.set(v);
    });
    fColor.addColor(params, 'lightBeamColor').name('Light Beam Color').onChange(v => {
      params.lightBeamColor = v;
      beamUniforms.uColor.value.set(v);
      beamSpotLight.color.set(v);
      bubbleMat.color.set(v);
    });
    fColor.addColor(params, 'entityEyeColor').name('Entity Eyes Color').onChange(v => {
      params.entityEyeColor = v;
      eyeMaterial.color.set(v);
      eyeMaterial.emissive.set(v);
      finMaterial.color.set(v);
      finMaterial.emissive.set(v);
      entityEyeLight.color.set(v);
    });

    // 2. Camera & Animation Modes Folder
    const fAnim = gui.addFolder("Animations & Camera");
    fAnim.add(params, 'animationMode', [
      "Static (No Camera Movement)",
      "Slow Orbit (360°)",
      "Visor Port Gaze (Gentle Push)",
      "Abyssal Trench Drift",
      "Cinematic Seabed Glide",
      "Porthole Inspection Arc",
      "Leviathan Silhouette Tracker",
      "Deep Sea Current Sway"
    ]).name('Camera Preset');
    fAnim.add(params, 'animationSpeed', 0.1, 3.0, 0.05).name('Animation Speed');
    fAnim.add(params, 'mouseDragMode', [
      "Drag Object (Left-click) / Rotate (Right)",
      "Rotate Camera (Left-click) / Pan (Right)"
    ]).name('Mouse Drag Mode').onChange(configureControls);

    // 3. Lighting & Environment Folder
    const fLight = gui.addFolder("Lighting & Exposure");
    fLight.add(params, 'exposure', 0.2, 3.0, 0.05).name('Exposure').onChange(v => renderer.toneMappingExposure = v);
    fLight.add(params, 'sceneLightIntensity', 0.1, 3.0, 0.05).name('Master Light Mult').onChange(updateLighting);
    fLight.add(params, 'beamLightIntensity', 0.0, 8.0, 0.1).name('Beam Spot Intensity').onChange(updateLighting);
    fLight.add(params, 'volumetricIntensity', 0.0, 6.0, 0.1).name('Volumetric Glow').onChange(updateLighting);
    fLight.add(params, 'entityGlowIntensity', 0.0, 6.0, 0.1).name('Entity Eye Glow').onChange(updateLighting);
    fLight.add(params, 'ambientLightIntensity', 0.0, 3.0, 0.05).name('Ambient Light').onChange(updateLighting);
    fLight.add(params, 'fillLightIntensity', 0.0, 4.0, 0.1).name('Fill Light').onChange(updateLighting);
    fLight.add(params, 'rimLightIntensity', 0.0, 4.0, 0.1).name('Rim Light').onChange(updateLighting);

    // 4. Abyssal Leviathan & Effects Folder
    const fEntity = gui.addFolder("Abyssal Leviathan");
    fEntity.add(params, 'entitySpeed', 0.2, 3.0, 0.05).name('Swim Speed');
    fEntity.add(params, 'entityUndulation', 0.2, 2.5, 0.05).name('Sinuous Motion');

    // 5. PostProcessor Suite Settings Folder
    postProcessor.attachGUI(gui, "Post Processing");

    // 6. Engine & Display Settings Folder
    const fEngine = gui.addFolder("Engine Settings");
    fEngine.add(params, 'greenscreen').name('Greenscreen (#00ff00)').onChange(toggleGreenscreen);
    fEngine.add(params, 'dpr', 0.5, 3.0, 0.25).name('Pixel Ratio (DPR)').onChange(v => {
      renderer.setPixelRatio(v);
      postProcessor.setSize(window.innerWidth, window.innerHeight, v);
    });
    fEngine.add(params, 'antialias').name('Antialias (Rebuild)').onChange(rebuildRenderer);

    // 7. Procedural Variation Folder
    const fProc = gui.addFolder("Procedural Variation");
    fProc.add(params, 'randomizeOnClick').name('Randomize on Click');
    fProc.add({ randomize: () => randomizeScene(true) }, 'randomize').name('🎲 Re-roll Scene Now');

    // --- HIDE / SHOW UI WITH "H" KEY ---
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        gui.show(gui._hidden);
      }
    });

    // ==========================================
    // 8. LEVIATHAN TRAJECTORY MATHEMATICS
    // ==========================================
    function getLeviathanPath(t, undulationScale = 1.0) {
      const angle = t * 0.38;
      const x = Math.sin(angle) * 1.55 + Math.sin(angle * 2.1) * 0.35;
      const y = 0.42 + Math.sin(angle * 1.4) * 0.32 + Math.cos(angle * 0.75) * 0.16;
      const z = 1.75 + Math.cos(angle) * 0.60;

      return new THREE.Vector3(x, y, z);
    }

    // ==========================================
    // 9. ANIMATION LOOP
    // ==========================================
    const clock = new THREE.Clock();
    let animTime = 0;

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const speed = params.animationSpeed;
      animTime += delta * speed;

      beamUniforms.uTime.value = animTime;

      const beamFlicker = (Math.sin(animTime * 12.0) * 0.5 + 0.5) * 0.12 +
                          (Math.cos(animTime * 24.0) * 0.5 + 0.5) * 0.06;
      beamUniforms.uIntensity.value = params.volumetricIntensity * params.sceneLightIntensity * (1.0 + beamFlicker);
      beamSpotLight.intensity = params.beamLightIntensity * params.sceneLightIntensity * (1.0 + beamFlicker);

      const swimTime = animTime * params.entitySpeed;
      const undulation = params.entityUndulation;

      for (let i = 0; i < ENTITY_SEGMENTS; i++) {
        const segDelay = i * 0.12;
        const pt = getLeviathanPath(swimTime - segDelay, undulation);

        const waveAngle = swimTime * 3.4 - i * 0.38;
        const latWave = Math.sin(waveAngle) * 0.05 * undulation * (i / ENTITY_SEGMENTS);
        const vertWave = Math.cos(waveAngle * 0.7) * 0.035 * undulation * (i / ENTITY_SEGMENTS);

        segmentMeshes[i].position.set(pt.x + latWave, pt.y + vertWave, pt.z);

        if (i > 0) {
          segmentMeshes[i - 1].lookAt(segmentMeshes[i].position);
        }
      }

      const eyePulse = Math.sin(animTime * 3.5) * 0.25 + 0.75;
      const currentEyeIntensity = params.entityGlowIntensity * eyePulse;
      eyeMaterial.emissiveIntensity = currentEyeIntensity;
      entityEyeLight.intensity = currentEyeIntensity * params.sceneLightIntensity;

      kelpLeaves.forEach(leaf => {
        const kTime = animTime * leaf.userData.speed + leaf.userData.phase;
        leaf.rotation.z = Math.sin(kTime) * 0.18;
        leaf.rotation.x = Math.cos(kTime * 0.8) * 0.12;
      });

      const snowArray = snowGeo.attributes.position.array;
      for (let i = 0; i < snowCount; i++) {
        const vel = snowVelocities[i];
        vel.wobble += delta * 1.5;
        snowArray[i * 3 + 1] += vel.y * speed;
        snowArray[i * 3] += Math.sin(vel.wobble) * 0.0015;
        snowArray[i * 3 + 2] += Math.cos(vel.wobble) * 0.0015;

        if (snowArray[i * 3 + 1] < -0.55) {
          snowArray[i * 3 + 1] = 3.6;
        }
      }
      snowGeo.attributes.position.needsUpdate = true;

      const bArray = bubbleGeo.attributes.position.array;
      for (let i = 0; i < bubbleCount; i++) {
        const b = bubbleData[i];
        b.phase += delta * 4.0;
        bArray[i * 3 + 1] += b.speed * speed;
        bArray[i * 3] = b.baseX + Math.sin(b.phase) * 0.025;
        bArray[i * 3 + 2] = b.baseZ + Math.cos(b.phase) * 0.025;

        if (bArray[i * 3 + 1] > 2.8) {
          bArray[i * 3 + 1] = 0.25;
        }
      }
      bubbleGeo.attributes.position.needsUpdate = true;

      // 8 Camera Preset Animations
      if (!controls.state || controls.state === -1) {
        const mode = params.animationMode;
        if (mode === "Static (No Camera Movement)") {
          // Stable atmospheric vantage point
        } else if (mode === "Slow Orbit (360°)") {
          const orbitRadius = 4.2;
          const angle = animTime * 0.12;
          camera.position.x = Math.sin(angle) * orbitRadius;
          camera.position.z = Math.cos(angle) * orbitRadius;
          camera.position.y = 0.75 + Math.sin(animTime * 0.06) * 0.25;
          controls.target.set(0, 0.35, 0);
        } else if (mode === "Visor Port Gaze (Gentle Push)") {
          const dist = 1.95 + (Math.sin(animTime * 0.18) * 0.5 + 0.5) * 1.9;
          camera.position.x = Math.sin(animTime * 0.08) * 0.18;
          camera.position.y = 0.36 + Math.sin(animTime * 0.1) * 0.08;
          camera.position.z = dist;
          controls.target.set(0, 0.35, 0.7);
        } else if (mode === "Abyssal Trench Drift") {
          camera.position.x = Math.sin(animTime * 0.2) * 1.8;
          camera.position.y = 0.65 + Math.cos(animTime * 0.15) * 0.35;
          camera.position.z = 3.4 + Math.sin(animTime * 0.12) * 0.6;
          controls.target.set(Math.sin(animTime * 0.1) * 0.2, 0.3, 0.2);
        } else if (mode === "Cinematic Seabed Glide") {
          const sweep = animTime * 0.15;
          camera.position.x = Math.sin(sweep) * 2.8;
          camera.position.y = -0.25 + Math.sin(animTime * 0.08) * 0.06;
          camera.position.z = 2.6 + Math.cos(sweep) * 0.8;
          controls.target.set(0, 0.4, 0);
        } else if (mode === "Porthole Inspection Arc") {
          const arcAngle = Math.sin(animTime * 0.22) * 0.85;
          camera.position.x = Math.sin(arcAngle) * 2.5;
          camera.position.z = Math.cos(arcAngle) * 2.5;
          camera.position.y = 0.42 + Math.cos(animTime * 0.14) * 0.12;
          controls.target.set(0, 0.35, 0.5);
        } else if (mode === "Leviathan Silhouette Tracker") {
          const headPos = segmentMeshes[2].position;
          camera.position.x = headPos.x * 0.75 + Math.sin(animTime * 0.15) * 0.35;
          camera.position.y = 0.5 + headPos.y * 0.4;
          camera.position.z = 3.2 + Math.cos(animTime * 0.12) * 0.4;
          controls.target.set(headPos.x * 0.4, 0.35, 0.8);
        } else if (mode === "Deep Sea Current Sway") {
          camera.position.x = Math.sin(animTime * 0.25) * 0.8;
          camera.position.y = 0.8 + Math.sin(animTime * 0.35) * 0.28;
          camera.position.z = 3.8 + Math.cos(animTime * 0.2) * 0.35;
          camera.rotation.z = Math.sin(animTime * 0.25) * 0.03;
          controls.target.set(0, 0.35, 0);
        }
      }

      controls.update();

      // Synchronize godrays screen projection with the volumetric light beam
      if (postProcessor && postProcessor.settings.raysEnabled) {
        postProcessor.setMoonScreenPosition(camera, beamMesh.position);
      }

      // Render through PostProcessor pipeline
      if (postProcessor) {
        postProcessor.renderScene(scene, camera);
      } else {
        renderer.render(scene, camera);
      }
    }

    // --- WINDOW RESIZE HANDLER ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      if (postProcessor) {
        postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);
      }
    });

    // Start auto infinite animation
    animate();
  </script>
</body>
</html>
