<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>505 - Procedural Wave Particles</title>
  <style>
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      font-size: 62.5%;
      background: #000;
      overflow: hidden;
      color: #FFF;
      font-family: sans-serif;
      overscroll-behavior: none;
    }

    #loading {
      background: black;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      visibility: visible;
      opacity: 1;
      transition: visibility 1.6s, opacity 1.6s;
    }

    #loading .circle {
      width: 50px;
      height: 50px;
      background: white;
      border-radius: 50%;
      opacity: 0;
      transform: scale(0, 0);
      animation: circle-animation 1.6s ease-in-out 0s infinite normal none;
    }

    #loading.loaded {
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }

    #container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }

    /** css animation */
    @keyframes circle-animation {
      0% {
        opacity: 0;
        transform: scale(0, 0);
      }
      50% {
        opacity: 1;
        transform: scale(1, 1);
      }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/stats.js/r17/Stats.min.js"></script>
</head>
<body>
  <div id="loading">
    <div class="circle"></div>
  </div>
  <div id="container"></div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.121.1/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.121.1/examples/jsm/controls/OrbitControls.js';
    import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

    /**
     * 19 Preconfigured Color Schemes
     */
    const SCHEMES = {
      'Original': {
        colors: ['#ffffff', '#ffffff', '#ffffff', '#ffffff', '#ffffff'],
        bg: '#000000'
      },
      'Monochromatic': {
        colors: ['#0055ff', '#3388ff', '#66bbff', '#99ddff', '#e0f4ff'],
        bg: '#040a18'
      },
      'Analogous': {
        colors: ['#ff2a5f', '#ff5e36', '#ff9f00', '#ffd000', '#ffea60'],
        bg: '#140508'
      },
      'Complementary': {
        colors: ['#00f0ff', '#0077ff', '#ffffff', '#ff6600', '#ffaa00'],
        bg: '#030d18'
      },
      'Split-complementary': {
        colors: ['#7b1fa2', '#ba68c8', '#ffffff', '#76ff03', '#ffc107'],
        bg: '#0c0416'
      },
      'Triadic': {
        colors: ['#00f5d4', '#7b2cbf', '#ff007f', '#ffd600', '#00bbf9'],
        bg: '#08020e'
      },
      'Tetradic': {
        colors: ['#00e676', '#2979ff', '#ff1744', '#ffea00', '#ffffff'],
        bg: '#030b0e'
      },
      'Double split-complementary': {
        colors: ['#d500f9', '#651fff', '#c6ff00', '#ffd600', '#ffffff'],
        bg: '#0c0214'
      },
      'Achromatic (black and white version, white and black)': {
        colors: ['#ffffff', '#cccccc', '#888888', '#444444', '#f0f0f0'],
        bg: '#000000'
      },
      'Achromatic + Accent (black and white + red, white and black + red)': {
        colors: ['#ffffff', '#808080', '#ff0033', '#e0e0e0', '#ff1a40'],
        bg: '#0a0a0a'
      },
      'Neutral + accent': {
        colors: ['#d8cfc4', '#9b8e82', '#00f0ff', '#5a534c', '#f0e6d8'],
        bg: '#141210'
      },
      '(F6AA1C, BC3908, 941B0C, F6AA1C, 220901)': {
        colors: ['#f6aa1c', '#bc3908', '#941b0c', '#f6aa1c', '#ff7a3d'],
        bg: '#220901'
      },
      '(63D1CF, 5BC0BE, 4BAD9E, 4BAD9E, 0B132B, 000000)': {
        colors: ['#63d1cf', '#5bc0be', '#4bad9e', '#4bad9e', '#88ebe9'],
        bg: '#0b132b'
      },
      '(AA60C8, D69ADE, C9A3C6, CFB5C2, 0D001D, 120A12)': {
        colors: ['#aa60c8', '#d69ade', '#c9a3c6', '#cfb5c2', '#e8c5e4'],
        bg: '#0d001d'
      },
      '(FEF1BE, FFBA00, 008189, 00474D, 061210)': {
        colors: ['#fef1be', '#ffba00', '#008189', '#00474d', '#36b5bd'],
        bg: '#061210'
      },
      '(D4FFB0, 7FFF00, 00B894, 0A3322, 05140A)': {
        colors: ['#d4ffb0', '#7fff00', '#00b894', '#55efc4', '#99ff66'],
        bg: '#05140a'
      },
      '(FFE8CC, FF8C00, C7501A, 3D1050, 0E0618)': {
        colors: ['#ffe8cc', '#ff8c00', '#c7501a', '#ff9f43', '#8e28b0'],
        bg: '#0e0618'
      },
      '(E8E0FF, B38FFF, 6A3DE8, 1A1250, 090612)': {
        colors: ['#e8e0ff', '#b38fff', '#6a3de8', '#9b6cff', '#d3bdff'],
        bg: '#090612'
      },
      '(E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)': {
        colors: ['#e0fbff', '#00f0ff', '#d40078', '#ff4db3', '#7209b7'],
        bg: '#05020f'
      }
    };

    /** vertex shader source */
    const vertexShader = `
    attribute float aIndex;

    uniform float uTime;
    uniform float uTotalCount;
    uniform float uAngleBase;
    uniform float uSpiralSpeed;
    uniform float uSpiralRadius;
    uniform float uWaveSpeed;
    uniform float uWaveFreq;
    uniform float uWaveAmp;
    uniform float uPointSize;

    uniform vec3 uColor1;
    uniform vec3 uColor2;
    uniform vec3 uColor3;
    uniform vec3 uColor4;
    uniform vec3 uColor5;
    uniform float uColorCycles;
    uniform float uColorSpeed;

    varying vec3 vColor;

    const float PI = 3.14159265358979323846;

    vec3 samplePalette(float t) {
      t = fract(t);
      if (t < 0.2) {
        return mix(uColor1, uColor2, t / 0.2);
      } else if (t < 0.4) {
        return mix(uColor2, uColor3, (t - 0.2) / 0.2);
      } else if (t < 0.6) {
        return mix(uColor3, uColor4, (t - 0.4) / 0.2);
      } else if (t < 0.8) {
        return mix(uColor4, uColor5, (t - 0.6) / 0.2);
      } else {
        return mix(uColor5, uColor1, (t - 0.8) / 0.2);
      }
    }

    void main() {
      vec3 pos = position;
      
      float angle = (uAngleBase + uTime * uSpiralSpeed) * (PI / 180.0) * pos.z;
      float rad = pos.z * uSpiralRadius;
      pos.x = cos(angle) * rad;
      pos.y = sin(angle) * rad;
      
      float len = length(pos) * 0.05;
      float waveAngle = uTime * uWaveSpeed + len * PI * uWaveFreq / 180.0;
      pos.z = abs(tan(waveAngle)) * uWaveAmp;
      
      vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
      
      gl_PointSize = uPointSize * (16.0 / max(-mvPosition.z, 0.001));
      gl_Position = projectionMatrix * mvPosition;

      float normIdx = aIndex / max(uTotalCount, 1.0);
      float colorT = normIdx * uColorCycles + uTime * (uColorSpeed * 0.1);
      vColor = samplePalette(colorT);
    }
    `;

    /** fragment shader source */
    const fragmentShader = `
    varying vec3 vColor;
    uniform float uDotRadius;
    uniform float uDotSoftness;

    void main () {
      float f = length(gl_PointCoord - vec2(0.5, 0.5));
      if (f > uDotRadius) discard;
      
      float alpha = 1.0;
      if (uDotSoftness > 0.001) {
        alpha = smoothstep(uDotRadius, max(0.0, uDotRadius - uDotSoftness), f);
      }
      
      gl_FragColor = vec4(vColor, alpha);
    }
    `;

    /**
     * class Sketch
     */
    class Sketch {
      constructor() {
        this.renderer = new THREE.WebGLRenderer({
          antialias: true,
          alpha: true
        });
        document.getElementById('container').appendChild(this.renderer.domElement);
        
        this.statsInit();
        this.initSettings();
        this.init();
        this.setupGui();
      }

      statsInit() {
        if (typeof Stats !== 'undefined') {
          this.stats = new Stats();
          this.stats.showPanel(0);
          this.stats.domElement.style.position = 'absolute';
          this.stats.domElement.style.left = '0';
          this.stats.domElement.style.top = '0';
          this.stats.domElement.style.zIndex = '100';
          this.stats.domElement.id = 'stats';
          document.getElementById('container').appendChild(this.stats.domElement);
        } else {
          this.stats = {
            begin: () => {},
            end: () => {},
            domElement: { style: {} }
          };
        }
      }

      initSettings() {
        this.settings = {
          // Greenscreen & Background
          greenscreen: false,
          backgroundColor: '#000000',

          // Control & Interaction
          dragMode: 'Rotate',
          clickToRandomize: true,
          blending: 'Additive',

          // Color System
          colorScheme: 'Original',
          color1: '#ffffff',
          color2: '#ffffff',
          color3: '#ffffff',
          color4: '#ffffff',
          color5: '#ffffff',
          colorCycles: 3.0,
          colorSpeed: 0.2,

          // Geometry & Wave Math
          angleBase: 275.0,
          spiralSpeed: 0.01,
          spiralRadius: 0.001,
          waveSpeed: 1.0,
          waveFrequency: 0.5,
          waveAmplitude: -0.3,
          timeScale: 1.0,

          // Particles
          particleCount: 20000,
          pointSize: 8.0,
          dotRadius: 0.35,
          dotSoftness: 0.15
        };
      }
      
      init() {
        /** time */
        this.clock = new THREE.Clock(true);
        this.elapsedTime = 0;
        
        /** mouse & drag tracking */
        this.mouse = new THREE.Vector2();
        this.pointerDownPos = { x: 0, y: 0 };
        this.pointerDownTime = 0;
        
        /** canvas size */
        this.width = window.innerWidth;
        this.height = window.innerHeight;

        /** scene */
        this.scene = new THREE.Scene();
        
        /** setup and render */
        this.setupCanvas();
        this.setupCamera();
        this.setupShape();
        this.setupEvents();
        
        this.render();
      }
      
      setupCanvas() {
        this.renderer.setSize(this.width, this.height);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        this.updateBackground();
        
        this.renderer.domElement.style.position = 'fixed';
        this.renderer.domElement.style.top = '0';
        this.renderer.domElement.style.left = '0';
        this.renderer.domElement.style.zIndex = '0';
        this.renderer.domElement.style.outline = 'none';
      }

      updateBackground() {
        const targetColor = this.settings.greenscreen ? '#00ff00' : this.settings.backgroundColor;
        const color = new THREE.Color(targetColor);
        this.renderer.setClearColor(color, 1.0);
        document.body.style.backgroundColor = targetColor;
      }
      
      setupCamera() {
        const fov = 70;
        this.camera = new THREE.PerspectiveCamera(
          fov,
          this.width / this.height,
          0.01,
          1000
        );
        this.camera.position.set(0, 2.0, 8.0);
        this.camera.lookAt(new THREE.Vector3());
        this.scene.add(this.camera);

        this.controls = new OrbitControls(this.camera, this.renderer.domElement);
        this.controls.enableDamping = true;
        this.controls.dampingFactor = 0.05;
        this.controls.enableZoom = true;
        this.controls.zoomSpeed = 1.0;
        this.controls.enablePan = true;
        this.controls.panSpeed = 1.0;
        this.controls.screenSpacePanning = true;
        this.updateDragMode();
      }

      updateDragMode() {
        if (!this.controls) return;
        if (this.settings.dragMode === 'Pan') {
          this.controls.mouseButtons = {
            LEFT: THREE.MOUSE.PAN,
            MIDDLE: THREE.MOUSE.DOLLY,
            RIGHT: THREE.MOUSE.ROTATE
          };
        } else {
          this.controls.mouseButtons = {
            LEFT: THREE.MOUSE.ROTATE,
            MIDDLE: THREE.MOUSE.DOLLY,
            RIGHT: THREE.MOUSE.PAN
          };
        }
      }
      
      setupShape() {
        this.shapes = [];
        const s = new Shape(this);
        this.shapes.push(s);
      }

      updateUniforms() {
        if (!this.shapes || !this.shapes[0]) return;
        const mat = this.shapes[0].material;
        if (!mat || !mat.uniforms) return;

        const s = this.settings;
        mat.uniforms.uAngleBase.value = s.angleBase;
        mat.uniforms.uSpiralSpeed.value = s.spiralSpeed;
        mat.uniforms.uSpiralRadius.value = s.spiralRadius;
        mat.uniforms.uWaveSpeed.value = s.waveSpeed;
        mat.uniforms.uWaveFreq.value = s.waveFrequency;
        mat.uniforms.uWaveAmp.value = s.waveAmplitude;
        mat.uniforms.uPointSize.value = s.pointSize;
        mat.uniforms.uDotRadius.value = s.dotRadius;
        mat.uniforms.uDotSoftness.value = s.dotSoftness;
        mat.uniforms.uColorCycles.value = s.colorCycles;
        mat.uniforms.uColorSpeed.value = s.colorSpeed;

        mat.uniforms.uColor1.value.set(s.color1);
        mat.uniforms.uColor2.value.set(s.color2);
        mat.uniforms.uColor3.value.set(s.color3);
        mat.uniforms.uColor4.value.set(s.color4);
        mat.uniforms.uColor5.value.set(s.color5);

        mat.blending = s.blending === 'Additive' ? THREE.AdditiveBlending : THREE.NormalBlending;
        mat.needsUpdate = true;
      }

      applyScheme(name) {
        const scheme = SCHEMES[name];
        if (!scheme) return;
        this.settings.colorScheme = name;
        this.settings.color1 = scheme.colors[0];
        this.settings.color2 = scheme.colors[1];
        this.settings.color3 = scheme.colors[2];
        this.settings.color4 = scheme.colors[3];
        this.settings.color5 = scheme.colors[4];
        this.settings.backgroundColor = scheme.bg;
        
        this.updateBackground();
        this.updateUniforms();
        this.updateGuiDisplay();
      }

      randomize() {
        const schemeKeys = Object.keys(SCHEMES);
        const randomSchemeKey = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
        const scheme = SCHEMES[randomSchemeKey];

        this.settings.colorScheme = randomSchemeKey;
        this.settings.color1 = scheme.colors[0];
        this.settings.color2 = scheme.colors[1];
        this.settings.color3 = scheme.colors[2];
        this.settings.color4 = scheme.colors[3];
        this.settings.color5 = scheme.colors[4];
        this.settings.backgroundColor = scheme.bg;

        // Re-roll geometric & motion parameters
        this.settings.angleBase = +(15.0 + Math.random() * 345.0).toFixed(1);
        const randSign = Math.random() > 0.5 ? 1 : -1;
        this.settings.spiralSpeed = +(randSign * (0.005 + Math.random() * 0.035)).toFixed(4);
        this.settings.spiralRadius = +(0.0004 + Math.random() * 0.0022).toFixed(4);
        this.settings.waveSpeed = +(0.3 + Math.random() * 2.2).toFixed(2);
        this.settings.waveFrequency = +(0.05 + Math.random() * 0.8).toFixed(2);
        const ampSign = Math.random() > 0.5 ? 1 : -1;
        this.settings.waveAmplitude = +(ampSign * (0.15 + Math.random() * 0.65)).toFixed(2);
        this.settings.pointSize = +(4.0 + Math.random() * 12.0).toFixed(1);
        this.settings.dotSoftness = +(0.05 + Math.random() * 0.3).toFixed(2);
        this.settings.colorCycles = +(1.0 + Math.random() * 6.0).toFixed(1);
        this.settings.colorSpeed = +(0.05 + Math.random() * 0.8).toFixed(2);
        this.settings.timeScale = +(0.6 + Math.random() * 1.4).toFixed(2);

        this.updateBackground();
        this.updateUniforms();
        this.updateGuiDisplay();
      }

      updateGuiDisplay() {
        if (!this.gui) return;
        const traverse = (folder) => {
          if (folder.controllers) {
            folder.controllers.forEach(c => c.updateDisplay());
          }
          if (folder.folders) {
            folder.folders.forEach(f => traverse(f));
          }
        };
        traverse(this.gui);
      }
      
      setupGui() {
        this.gui = new GUI({ title: 'Scene Controls' });

        // Folder: Display & Background
        const fDisplay = this.gui.addFolder('Display & Greenscreen');
        fDisplay.add(this.settings, 'greenscreen').name('Greenscreen (#00ff00)').onChange(() => {
          this.updateBackground();
        });
        fDisplay.addColor(this.settings, 'backgroundColor').name('Background Color').onChange(() => {
          if (!this.settings.greenscreen) {
            this.updateBackground();
          }
        });
        fDisplay.add(this.settings, 'blending', ['Additive', 'Normal']).name('Blending Mode').onChange(() => {
          this.updateUniforms();
        });
        fDisplay.add(this.settings, 'dragMode', ['Rotate', 'Pan']).name('Mouse Drag Mode').onChange(() => {
          this.updateDragMode();
        });
        fDisplay.add(this.settings, 'clickToRandomize').name('Click Scene to Randomize');

        // Folder: Color Schemes & Palette
        const fColors = this.gui.addFolder('Color Schemes');
        fColors.add(this.settings, 'colorScheme', Object.keys(SCHEMES)).name('Preset Scheme').onChange((val) => {
          this.applyScheme(val);
        });
        fColors.addColor(this.settings, 'color1').name('Color 1').onChange(() => this.updateUniforms());
        fColors.addColor(this.settings, 'color2').name('Color 2').onChange(() => this.updateUniforms());
        fColors.addColor(this.settings, 'color3').name('Color 3').onChange(() => this.updateUniforms());
        fColors.addColor(this.settings, 'color4').name('Color 4').onChange(() => this.updateUniforms());
        fColors.addColor(this.settings, 'color5').name('Color 5').onChange(() => this.updateUniforms());
        fColors.add(this.settings, 'colorCycles', 0.2, 12.0, 0.1).name('Color Frequency').onChange(() => this.updateUniforms());
        fColors.add(this.settings, 'colorSpeed', 0.0, 3.0, 0.05).name('Color Flow Speed').onChange(() => this.updateUniforms());

        // Folder: Geometry & Motion Parameters
        const fMotion = this.gui.addFolder('Geometry & Motion');
        fMotion.add(this.settings, 'angleBase', 0, 360, 1).name('Base Angle').onChange(() => this.updateUniforms());
        fMotion.add(this.settings, 'spiralSpeed', -0.05, 0.05, 0.001).name('Spiral Speed').onChange(() => this.updateUniforms());
        fMotion.add(this.settings, 'spiralRadius', 0.0002, 0.003, 0.0001).name('Spiral Radius').onChange(() => this.updateUniforms());
        fMotion.add(this.settings, 'waveSpeed', 0.0, 4.0, 0.05).name('Wave Speed').onChange(() => this.updateUniforms());
        fMotion.add(this.settings, 'waveFrequency', 0.01, 1.5, 0.01).name('Wave Frequency').onChange(() => this.updateUniforms());
        fMotion.add(this.settings, 'waveAmplitude', -1.5, 1.5, 0.05).name('Wave Amplitude').onChange(() => this.updateUniforms());
        fMotion.add(this.settings, 'timeScale', 0.0, 3.0, 0.05).name('Time Scale');

        // Folder: Particles
        const fParticles = this.gui.addFolder('Particle Style');
        fParticles.add(this.settings, 'particleCount', 5000, 40000, 1000).name('Count').onFinishChange(() => {
          if (this.shapes && this.shapes[0]) {
            this.shapes[0].rebuildGeometry();
          }
        });
        fParticles.add(this.settings, 'pointSize', 1.0, 30.0, 0.5).name('Point Size').onChange(() => this.updateUniforms());
        fParticles.add(this.settings, 'dotRadius', 0.1, 0.48, 0.01).name('Dot Radius').onChange(() => this.updateUniforms());
        fParticles.add(this.settings, 'dotSoftness', 0.0, 0.4, 0.01).name('Dot Softness').onChange(() => this.updateUniforms());

        // Folder: Actions
        const fActions = this.gui.addFolder('Procedural Actions');
        fActions.add({ randomize: () => this.randomize() }, 'randomize').name('Randomize Scene');
        fActions.add({ reset: () => {
          this.initSettings();
          this.applyScheme('Original');
          this.updateDragMode();
          if (this.shapes && this.shapes[0]) {
            this.shapes[0].rebuildGeometry();
          }
        }}, 'reset').name('Reset to Default');

        // Keep all folders open for immediate access
        fDisplay.open();
        fColors.open();
        fMotion.open();
      }
      
      render() {
        if (this.stats && this.stats.begin) this.stats.begin();
        
        const delta = this.clock.getDelta();
        this.elapsedTime += delta * this.settings.timeScale;
        
        /** controls update for smooth damping, zoom, pan */
        if (this.controls) {
          this.controls.update();
        }

        /** update shapes */
        for (let i = 0; i < this.shapes.length; i++) {
          this.shapes[i].update(this.elapsedTime);
        }
        
        this.renderer.render(this.scene, this.camera);
        
        if (this.stats && this.stats.end) this.stats.end();
        this.animationId = requestAnimationFrame(this.render.bind(this));
      }
      
      setupEvents() {
        window.addEventListener('resize', this.onResize.bind(this), false);
        window.addEventListener('mousemove', this.onMousemove.bind(this), false);
        
        // Track pointer down/up for click vs drag detection
        window.addEventListener('pointerdown', (e) => {
          this.pointerDownPos = { x: e.clientX, y: e.clientY };
          this.pointerDownTime = performance.now();
        }, false);

        window.addEventListener('pointerup', (e) => {
          if (e.button !== 0) return;
          // Ignore clicks originating inside GUI or Stats
          if (e.target && e.target.closest && (e.target.closest('.lil-gui') || e.target.closest('#stats'))) {
            return;
          }
          const dist = Math.hypot(e.clientX - this.pointerDownPos.x, e.clientY - this.pointerDownPos.y);
          const time = performance.now() - this.pointerDownTime;
          
          // Pure click threshold (< 6px movement and < 350ms elapsed)
          if (dist < 6 && time < 350) {
            if (this.settings.clickToRandomize) {
              this.randomize();
            }
          }
        }, false);

        // Hide / show UI on "H" key
        window.addEventListener('keydown', (e) => {
          if (e.code === 'KeyH' || e.key === 'h' || e.key === 'H') {
            if (this.gui) {
              const isHidden = this.gui.domElement.style.display === 'none' || this.gui._hidden;
              if (isHidden) {
                this.gui.show();
              } else {
                this.gui.hide();
              }
            }
            if (this.stats && this.stats.domElement) {
              this.stats.domElement.style.display =
                this.stats.domElement.style.display === 'none' ? 'block' : 'none';
            }
          }
        }, false);
      }
      
      onResize() {
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.camera.aspect = this.width / this.height;
        this.camera.updateProjectionMatrix();
        this.renderer.setSize(this.width, this.height);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      }
      
      onMousemove(event) {
        this.mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        this.mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
      }
    }

    /**
     * shape class
     */
    class Shape {
      constructor(sketch) {
        this.sketch = sketch;
        this.init();
      }
      
      init() {
        this.count = this.sketch.settings.particleCount;
        this.geometry = new THREE.BufferGeometry();
        this.vertices = new Float32Array(this.count * 3);
        const indices = new Float32Array(this.count);
        
        for (let i = 0; i < this.count; i++) {
          this.vertices[i * 3 + 0] = 0;
          this.vertices[i * 3 + 1] = 0;
          this.vertices[i * 3 + 2] = i;
          indices[i] = i;
        }
        
        this.geometry.setAttribute('position', new THREE.BufferAttribute(this.vertices, 3));
        this.geometry.setAttribute('aIndex', new THREE.BufferAttribute(indices, 1));
        
        const s = this.sketch.settings;
        this.material = new THREE.ShaderMaterial({
          side: THREE.DoubleSide,
          uniforms: {
            uTime: { value: 0 },
            uTotalCount: { value: this.count },
            uAngleBase: { value: s.angleBase },
            uSpiralSpeed: { value: s.spiralSpeed },
            uSpiralRadius: { value: s.spiralRadius },
            uWaveSpeed: { value: s.waveSpeed },
            uWaveFreq: { value: s.waveFrequency },
            uWaveAmp: { value: s.waveAmplitude },
            uPointSize: { value: s.pointSize },
            uDotRadius: { value: s.dotRadius },
            uDotSoftness: { value: s.dotSoftness },
            uColor1: { value: new THREE.Color(s.color1) },
            uColor2: { value: new THREE.Color(s.color2) },
            uColor3: { value: new THREE.Color(s.color3) },
            uColor4: { value: new THREE.Color(s.color4) },
            uColor5: { value: new THREE.Color(s.color5) },
            uColorCycles: { value: s.colorCycles },
            uColorSpeed: { value: s.colorSpeed }
          },
          blending: s.blending === 'Additive' ? THREE.AdditiveBlending : THREE.NormalBlending,
          transparent: true,
          depthWrite: false,
          vertexShader: vertexShader,
          fragmentShader: fragmentShader
        });
        
        this.mesh = new THREE.Points(this.geometry, this.material);
        this.mesh.rotation.set(-90 * Math.PI / 180, 0.0, 0.0);
        this.sketch.scene.add(this.mesh);
      }

      rebuildGeometry() {
        if (this.geometry) this.geometry.dispose();
        this.count = this.sketch.settings.particleCount;
        this.vertices = new Float32Array(this.count * 3);
        const indices = new Float32Array(this.count);
        
        for (let i = 0; i < this.count; i++) {
          this.vertices[i * 3 + 0] = 0;
          this.vertices[i * 3 + 1] = 0;
          this.vertices[i * 3 + 2] = i;
          indices[i] = i;
        }
        
        this.geometry = new THREE.BufferGeometry();
        this.geometry.setAttribute('position', new THREE.BufferAttribute(this.vertices, 3));
        this.geometry.setAttribute('aIndex', new THREE.BufferAttribute(indices, 1));
        this.mesh.geometry = this.geometry;

        if (this.material && this.material.uniforms.uTotalCount) {
          this.material.uniforms.uTotalCount.value = this.count;
        }
      }
      
      update(time) {
        if (this.mesh && this.mesh.material && this.mesh.material.uniforms) {
          this.mesh.material.uniforms.uTime.value = time;
        }
      }
    }

    (() => {
      window.addEventListener('load', () => {
        const loading = document.getElementById('loading');
        if (loading) {
          loading.classList.add('loaded');
        }
        new Sketch();
      });
    })();
  </script>
</body>
