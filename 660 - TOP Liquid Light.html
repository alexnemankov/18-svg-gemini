<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020812">
  <meta name="description" content="Enormous, defocused blue light forms breathe through a dark liquid in a seamless forty-second loop. A procedural Three.js and GLSL study.">
  <link rel="icon" href="data:,">
  <title>Below the Light</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background-color: #020812;
      background-image:
        radial-gradient(ellipse 18% 32% at 53% 0%, #91bddd 0%, #245e91 40%, transparent 85%),
        radial-gradient(ellipse 25% 22% at 12% 44%, #91c9f2 0%, #245e91 38%, transparent 85%),
        radial-gradient(ellipse 18% 25% at 18% 104%, #91c9f2 0%, #245e91 35%, transparent 85%),
        radial-gradient(ellipse 15% 24% at 48% 108%, #91c9f2 0%, #245e91 35%, transparent 85%);
    }
    canvas { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
  </style>
</head>
<body>
<script type="module">
/*
 * BELOW THE LIGHT — a single-pass, texture-free optical field.
 * Open directly; Three.js and unmodified lil-gui are loaded from pinned CDNs.
 * The optical camera is a shader transform so the fullscreen plane never ends.
 */
const settings = {
  loopDuration: 40,
  glowIntensity: 1.0,
  warpStrength: 0.064,
  softness: 1.0,
  motionSpeed: 1.0,
  grain: 0.005,
  pixelRatio: Math.min(window.devicePixelRatio || 1, 1.75),
  palette: 'Original',
  invertAchromatic: false,
  highlight: '#b5d7f2',
  body: '#8cbae0',
  halo: '#163b79',
  accent: '#91c9f2',
  shadow: '#102a43',
  background: '#020812',
  accentAmount: 0,
  greenscreen: false,
  animation: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'Static' : 'Liquid breathing',
  cameraAmount: 1,
  zoom: 1,
  panX: 0,
  panY: 0,
  angle: 0,
  orbitTilt: 35,
  seed: 17,
  variation: 0,
  size: 1,
  clickRandomize: true
};

// Nineteen entries; the two achromatic schemes each offer both polarities.
// Color roles: highlight, body, halo, accent, [shadow], background.
const palettes = {
  'Original': ['b5d7f2', '8cbae0', '163b79', '91c9f2', '102a43', '020812'],
  'Monochromatic': ['e0eeff', '8fb8ee', '3159a3', 'adcfff', '142747', '030915'],
  'Analogous': ['deefff', '7eabed', '565bc0', '65d7d0', '18263f', '060b19'],
  'Complementary': ['ffe2b2', 'e9a45e', '274e86', '6cc3ef', '172238', '070d17'],
  'Split-complementary': ['ffe9bd', 'eda674', '475ca0', '86d6bd', '202338', '0b101b'],
  'Triadic': ['ffdfcc', 'e99693', '377f98', 'bb9be5', '202a3c', '080d18'],
  'Tetradic': ['ffe6be', 'eab975', '466e95', 'bc75a7', '27433e', '080f14'],
  'Double split-complementary': ['f6dfbd', 'd9a28e', '587ea8', 'b7ca87', '554164', '0c1019'],
  'Achromatic': ['ffffff', 'bcbcbc', '606060', 'ffffff', '242424', '000000'],
  'Achromatic + Accent': ['ffffff', 'bcbcbc', '606060', 'ff263b', '242424', '000000'],
  'Neutral + accent': ['f2ede3', 'b5b1aa', '6b7072', 'efad45', '363b40', '121619'],
  'Amber / Ember': ['F6AA1C', 'BC3908', '941B0C', 'F6AA1C', '220901'],
  'Turquoise / Midnight': ['63D1CF', '5BC0BE', '4BAD9E', '4BAD9E', '0B132B', '000000'],
  'Orchid / Plum': ['AA60C8', 'D69ADE', 'C9A3C6', 'CFB5C2', '0D001D', '120A12'],
  'Saffron / Lagoon': ['FEF1BE', 'FFBA00', '008189', '00474D', '061210'],
  'Lime / Forest': ['D4FFB0', '7FFF00', '00B894', '0A3322', '05140A'],
  'Tangerine / Aubergine': ['FFE8CC', 'FF8C00', 'C7501A', '3D1050', '0E0618'],
  'Lavender / Indigo': ['E8E0FF', 'B38FFF', '6A3DE8', '1A1250', '090612'],
  'Cyan / Magenta': ['E0FBFF', '00F0FF', 'D40078', '1E0A3D', '05020F']
};
const animations = ['Static', 'Liquid breathing', 'Slow drift', 'Tidal sway',
                    'Gentle orbit', 'Deep float', 'Slow roll', 'Lateral passage'];

let THREE;
try {
  THREE = await import('https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js');
} catch {
  try {
    THREE = await import('https://unpkg.com/three@0.180.0/build/three.module.js');
  } catch (error) {
    console.warn('Could not load Three.js; showing the still light study.', error);
  }
}

if (THREE) {
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({
      antialias: false, alpha: false, depth: false, stencil: false,
      powerPreference: 'high-performance', precision: 'highp'
    });
  } catch (error) {
    console.warn('WebGL is unavailable; showing the still light study.', error);
  }

  if (renderer) {
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.NoToneMapping;
    renderer.setClearColor(0x020812, 1);
    // The shader supplies grain; avoid driver dithering varying between frames.
    const gl = renderer.getContext();
    gl.disable(gl.DITHER);
    renderer.domElement.setAttribute('role', 'img');
    renderer.domElement.setAttribute('aria-label', 'Giant, soft icy-blue light formations drifting through deep navy darkness.');
    document.body.appendChild(renderer.domElement);

    const uniforms = {
      uTime: { value: 0 },
      uResolution: { value: new THREE.Vector2() },
      uAspect: { value: 1 },
      uLoopDuration: { value: settings.loopDuration },
      uGlowIntensity: { value: settings.glowIntensity },
      uWarpStrength: { value: settings.warpStrength },
      uSoftness: { value: settings.softness },
      uMotionSpeed: { value: settings.motionSpeed },
      uGrain: { value: settings.grain },
      uHighlight: { value: new THREE.Vector3() },
      uBody: { value: new THREE.Vector3() },
      uHalo: { value: new THREE.Vector3() },
      uAccent: { value: new THREE.Vector3() },
      uShadow: { value: new THREE.Vector3() },
      uBackground: { value: new THREE.Vector3() },
      uAccentAmount: { value: settings.accentAmount },
      uGreenscreen: { value: false },
      uZoom: { value: 1 },
      uPan: { value: new THREE.Vector2() },
      uAngle: { value: 0 },
      uSeed: { value: settings.seed },
      uVariation: { value: settings.variation },
      uSize: { value: settings.size }
    };

    const material = new THREE.ShaderMaterial({
      uniforms, depthTest: false, depthWrite: false, toneMapped: false,
      vertexShader: /* glsl */`
        void main() {
          gl_Position = vec4(position.xy, 0.0, 1.0);
        }
      `,
      fragmentShader: /* glsl */`
        precision highp float;
        uniform float uTime;
        uniform vec2 uResolution;
        uniform float uAspect;
        uniform float uLoopDuration;
        uniform float uGlowIntensity;
        uniform float uWarpStrength;
        uniform float uSoftness;
        uniform float uMotionSpeed;
        uniform float uGrain;
        uniform vec3 uHighlight;
        uniform vec3 uBody;
        uniform vec3 uHalo;
        uniform vec3 uAccent;
        uniform vec3 uShadow;
        uniform vec3 uBackground;
        uniform float uAccentAmount;
        uniform bool uGreenscreen;
        uniform float uZoom;
        uniform vec2 uPan;
        uniform float uAngle;
        uniform float uSeed;
        uniform float uVariation;
        uniform float uSize;
        const float TAU = 6.283185307179586;
        const float REFERENCE_ASPECT = 1.7856;

        // 2D simplex gradient noise. The few octaves stay deliberately broad.
        vec3 mod289(vec3 x) { return x - floor(x / 289.0) * 289.0; }
        vec2 mod289(vec2 x) { return x - floor(x / 289.0) * 289.0; }
        vec3 permute(vec3 x) { return mod289((x * 34.0 + 1.0) * x); }
        float simplex(vec2 v) {
          const vec4 C = vec4(0.211324865405187, 0.366025403784439,
                             -0.577350269189626, 0.024390243902439);
          vec2 i = floor(v + dot(v, C.yy));
          vec2 x0 = v - i + dot(i, C.xx);
          vec2 i1 = x0.x > x0.y ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
          vec4 x12 = x0.xyxy + C.xxzz;
          x12.xy -= i1;
          i = mod289(i);
          vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0))
                                   + i.x + vec3(0.0, i1.x, 1.0));
          vec3 m = max(0.5 - vec3(dot(x0, x0), dot(x12.xy, x12.xy),
                                dot(x12.zw, x12.zw)), 0.0);
          m = m * m;
          m = m * m;
          vec3 x = 2.0 * fract(p * C.www) - 1.0;
          vec3 h = abs(x) - 0.5;
          vec3 ox = floor(x + 0.5);
          vec3 a0 = x - ox;
          m *= 1.79284291400159 - 0.85373472095314 * (a0 * a0 + h * h);
          vec3 g;
          g.x = a0.x * x0.x + h.x * x0.y;
          g.yz = a0.yz * x12.xz + h.yz * x12.yw;
          return 130.0 * dot(m, g);
        }

        float fbm(vec2 p) {
          mat2 turn = mat2(0.80, -0.60, 0.60, 0.80);
          float n = 0.58 * simplex(p);
          p = turn * p * 1.93 + vec2(7.3, 2.8);
          n += 0.27 * simplex(p);
          p = turn * p * 1.91 + vec2(4.2, 9.1);
          return n + 0.12 * simplex(p);
        }

        float smoothMin(float a, float b, float k) {
          float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
          return mix(b, a, h) - k * h * (1.0 - h);
        }

        // Elliptical distance approximation, in viewport-height units.
        // Centers remain composed at the edges on both wide and tall screens.
        float ellipse(vec2 p, vec2 center, vec2 radius, float angle) {
          vec2 identity = center;
          center += uVariation * 0.045 * sin(center * vec2(23.7, 19.3) + uSeed);
          radius *= uSize * (1.0 + uVariation * 0.19 * sin(identity.yx * 17.1 + uSeed));
          angle += uVariation * 0.22 * sin(uSeed + identity.x * 11.3);
          center = (center - 0.5) * vec2(uAspect, 1.0);
          radius.x *= mix(uAspect, REFERENCE_ASPECT, 0.22);
          vec2 q = p - center;
          float c = cos(angle), s = sin(angle);
          q = mat2(c, -s, s, c) * q;
          return (length(q / radius) - 1.0) * min(radius.x, radius.y);
        }

        float grain(vec2 p) {
          return fract(52.9829189 * fract(dot(p, vec2(0.06711056, 0.00583715))));
        }

        vec3 toLinear(vec3 c) {
          return mix(c / 12.92, pow((c + 0.055) / 1.055, vec3(2.4)),
                     step(vec3(0.04045), c));
        }

        void main() {
          vec2 uv = gl_FragCoord.xy / uResolution;
          uv.y = 1.0 - uv.y;
          vec2 p = (uv - 0.5) * vec2(uAspect, 1.0);
          p = (p - uPan) / uZoom;
          float ca = cos(uAngle), sa = sin(uAngle);
          p = mat2(ca, -sa, sa, ca) * p;
          float phase = TAU * mod(uTime * uMotionSpeed, uLoopDuration) / uLoopDuration;
          vec2 orbit = vec2(cos(phase), sin(phase));
          vec2 path = (orbit - vec2(1.0, 0.0)) * 0.30;
          vec2 drift = vec2(sin(phase), cos(phase) - 1.0);
          vec2 seedOffset = vec2(sin(uSeed), cos(uSeed)) * uVariation * 8.0;
          vec2 warp = vec2(fbm(p * 2.05 + path + vec2(2.1, 7.8) + seedOffset),
                           fbm(p * 1.92 + path.yx + vec2(9.4, 1.3) + seedOffset));
          float opticalScale = min(1.0, sqrt(uAspect / REFERENCE_ASPECT));
          vec2 q = p + warp * uWarpStrength * opticalScale;
          q += 0.010 * opticalScale * vec2(sin(p.y * 5.0 + phase), cos(p.x * 3.0 - phase));
          float breath = 1.0 + 0.035 * sin(phase);

          // Left: a wide, irregular opening with a sloping lower lip.
          float left = ellipse(q, vec2(0.105, 0.425) + drift * vec2(0.007, 0.012),
                               vec2(0.119, 0.120) * breath, -0.12);
          left = smoothMin(left, ellipse(q, vec2(0.220, 0.399), vec2(0.077, 0.093), -0.45), 0.070);
          left = smoothMin(left, ellipse(q, vec2(0.139, 0.491), vec2(0.072, 0.077), 0.12), 0.055);
          left = smoothMin(left, ellipse(q, vec2(-0.055, 0.385), vec2(0.130, 0.106), 0.0), 0.070);

          // The upper opening narrows into a neck, then pools toward the right.
          float top = ellipse(q, vec2(0.525, -0.070), vec2(0.062, 0.248), -0.03);
          top = smoothMin(top, ellipse(q, vec2(0.517, 0.176) + drift * 0.009,
                                      vec2(0.074, 0.101) * breath, -0.20), 0.080);
          top = smoothMin(top, ellipse(q, vec2(0.595, 0.282), vec2(0.108, 0.103), -0.22), 0.070);
          top = smoothMin(top, ellipse(q, vec2(0.605, 0.355), vec2(0.057, 0.067), 0.1), 0.055);

          // Cropped lights imply much larger formations beyond the frame.
          float distanceField = smoothMin(left, top, 0.060);
          distanceField = smoothMin(distanceField,
            ellipse(q, vec2(0.858, -0.035), vec2(0.119, 0.121), 0.10), 0.050);
          distanceField = smoothMin(distanceField,
            ellipse(q, vec2(0.233, -0.050), vec2(0.056, 0.103), -0.25), 0.045);

          float bottom = ellipse(q, vec2(0.151, 1.066), vec2(0.079, 0.221), 0.39);
          bottom = smoothMin(bottom,
            ellipse(q, vec2(0.183, 0.900) + drift * 0.009, vec2(0.057, 0.122), 0.23), 0.045);
          bottom = smoothMin(bottom,
            ellipse(q, vec2(0.466, 1.050), vec2(0.057, 0.193) / breath, 0.17), 0.045);
          bottom = smoothMin(bottom,
            ellipse(q, vec2(0.701, 1.068), vec2(0.053, 0.176), 0.44), 0.045);
          distanceField = smoothMin(distanceField, bottom, 0.045);

          float d = distanceField;
          float softness = max(uSoftness, 0.15) * opticalScale;
          // These nested diffusion profiles are an analytic bloom approximation.
          // No sharp surface or bright outline: light lives inside the medium.
          float inner = 1.0 - smoothstep(-0.040 * softness, 0.021 * softness, d);
          float body = exp(-max(d, 0.0) / (0.048 * softness));
          float halo = exp(-max(d, 0.0) / (0.095 * softness));
          float scatter = exp(-max(d, 0.0) / (0.192 * softness));
          float core = 1.0 - smoothstep(-0.085 * softness, -0.012 * softness, d);

          // Palette colors are display-space RGB, converted once at output.
          float accentField = smoothstep(0.10, 0.65,
            simplex(p * 1.35 + seedOffset + vec2(3.1, 8.7))) * uAccentAmount;
          vec3 haloTint = mix(uHalo, uAccent, accentField * 0.60);
          vec3 color = uShadow * scatter * 0.22;
          color += haloTint * halo * 0.82;
          color += uBody * body * 0.33;
          vec3 ice = mix(uBody, uHighlight, core);
          ice = mix(ice, uAccent, accentField * 0.88);
          float depth = 0.97 + 0.030 * simplex(p * 2.6 + path * 0.4 + 5.8);
          color = mix(color, ice * depth, inner * 0.96);
          color *= uGlowIntensity * (1.0 + 0.018 * sin(phase));

          // Keep the central channel deep and give the corners a little falloff.
          vec2 fieldUV = p / vec2(uAspect, 1.0) + 0.5;
          float centerShade = exp(-dot((fieldUV - vec2(0.52, 0.65)) / vec2(0.34, 0.22),
                                      (fieldUV - vec2(0.52, 0.65)) / vec2(0.34, 0.22)));
          color *= 1.0 - 0.32 * centerShade;
          color *= 1.0 - 0.11 * smoothstep(0.40, 0.83, length(uv - 0.5));
          // Static fine grain prevents banding without flicker or a loop seam.
          color += (grain(gl_FragCoord.xy) - 0.5) * uGrain;
          // Composite only the light layer. Empty chroma-key pixels stay #00ff00,
          // unaffected by film grain, illumination, intensity, or vignetting.
          float coverage = 1.0 - smoothstep(0.018 * softness,
                                           (uGreenscreen ? 0.145 : 0.30) * softness, d);
          vec3 background = uGreenscreen ? vec3(0.0, 1.0, 0.0) : uBackground;
          color = mix(background, clamp(color, 0.0, 1.0), coverage);
          gl_FragColor = vec4(toLinear(clamp(color, 0.0, 1.0)), 1.0);
          #include <colorspace_fragment>
        }
      `
    });

    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const geometry = new THREE.PlaneGeometry(2, 2);
    const surface = new THREE.Mesh(geometry, material);
    surface.frustumCulled = false;
    scene.add(surface);

    let gui;
    let uiHidden = false;
    const motion = { x: 0, y: 0, angle: 0, zoom: 0 };
    const radians = degrees => degrees * Math.PI / 180;
    const clamp = THREE.MathUtils.clamp;
    const refreshPanel = () => gui?.controllersRecursive().forEach(control => control.updateDisplay());

    function setRGB(target, hex) {
      const n = parseInt(hex.replace('#', ''), 16);
      target.set(((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255);
    }

    function syncSettings() {
      for (const key of ['highlight', 'body', 'halo', 'accent', 'shadow', 'background']) {
        setRGB(uniforms['u' + key[0].toUpperCase() + key.slice(1)].value, settings[key]);
      }
      uniforms.uGlowIntensity.value = settings.glowIntensity;
      uniforms.uWarpStrength.value = settings.warpStrength;
      uniforms.uSoftness.value = settings.softness;
      uniforms.uGrain.value = settings.grain;
      uniforms.uAccentAmount.value = settings.accentAmount;
      uniforms.uGreenscreen.value = settings.greenscreen;
      uniforms.uSeed.value = settings.seed;
      uniforms.uVariation.value = settings.variation;
      uniforms.uSize.value = settings.size;
      uniforms.uLoopDuration.value = settings.loopDuration;
      // Speed is integrated in JS, so changing it never jumps to another phase.
      uniforms.uMotionSpeed.value = 1;
      document.body.style.background = settings.greenscreen ? '#00ff00' : settings.background;
      applyView();
    }

    function applyPalette() {
      const colors = palettes[settings.palette].map(hex => '#' + hex.toLowerCase());
      [settings.highlight, settings.body, settings.halo, settings.accent] = colors;
      settings.shadow = colors.length === 6 ? colors[4] : colors[2];
      settings.background = colors.at(-1);
      const achromatic = settings.palette.startsWith('Achromatic');
      if (achromatic && settings.invertAchromatic) {
        for (const key of ['highlight', 'body', 'halo', 'shadow', 'background']) {
          settings[key] = '#' + (0xffffff ^ parseInt(settings[key].slice(1), 16)).toString(16).padStart(6, '0');
        }
        if (settings.palette === 'Achromatic') settings.accent = '#000000';
      }
      settings.accentAmount = settings.palette === 'Original' || settings.palette === 'Monochromatic'
        || settings.palette === 'Achromatic' ? 0 : settings.palette.includes('Accent')
        || settings.palette === 'Neutral + accent' ? 0.90 : 0.60;
      syncSettings();
      refreshPanel();
    }

    function applyView() {
      uniforms.uZoom.value = settings.zoom * Math.exp(motion.zoom);
      uniforms.uPan.value.set(settings.panX + motion.x, settings.panY + motion.y);
      uniforms.uAngle.value = radians(settings.angle) + motion.angle;
    }

    function updateMotion(dt, phase) {
      const s = Math.sin(phase), c = Math.cos(phase);
      let x = 0, y = 0, angle = 0, zoom = 0;
      switch (settings.animation) {
        case 'Slow drift': x = 0.045 * s; y = 0.024 * Math.sin(phase * 2); break;
        case 'Tidal sway': x = 0.055 * s; angle = 0.035 * s; break;
        case 'Gentle orbit': {
          const heading = phase + radians(settings.angle);
          x = 0.065 * Math.cos(heading);
          y = 0.065 * Math.sin(heading) * Math.sin(radians(settings.orbitTilt));
          angle = 0.025 * s;
          break;
        }
        case 'Deep float': y = 0.032 * s; zoom = 0.065 * (1 - c); break;
        case 'Slow roll': angle = 0.070 * s; zoom = 0.022 * (1 - c); break;
        case 'Lateral passage': x = 0.090 * s; y = 0.016 * (1 - c); break;
      }
      const amount = settings.cameraAmount;
      const blend = 1 - Math.exp(-dt * 2.5);
      motion.x += (x * amount - motion.x) * blend;
      motion.y += (y * amount - motion.y) * blend;
      motion.angle += (angle * amount - motion.angle) * blend;
      motion.zoom += (zoom * amount - motion.zoom) * blend;
      applyView();
    }

    function resetView() {
      settings.zoom = 1;
      settings.panX = settings.panY = settings.angle = 0;
      settings.orbitTilt = 35;
      applyView();
      refreshPanel();
    }

    function randomize() {
      const random = (a, b) => a + Math.random() * (b - a);
      const names = Object.keys(palettes);
      settings.palette = names[Math.floor(Math.random() * names.length)];
      settings.invertAchromatic = Math.random() < 0.5;
      settings.seed = Math.floor(random(1, 10000));
      settings.variation = random(0.25, 1);
      settings.size = random(0.78, 1.23);
      settings.warpStrength = random(0.025, 0.105);
      settings.softness = random(0.75, 1.35);
      settings.glowIntensity = random(0.85, 1.22);
      settings.motionSpeed = random(0.35, 1.05);
      settings.cameraAmount = random(0.3, 1.1);
      settings.orbitTilt = random(15, 65);
      settings.animation = animations[1 + Math.floor(Math.random() * (animations.length - 1))];
      applyPalette();
    }

    function resize() {
      const width = Math.max(1, window.innerWidth);
      const height = Math.max(1, window.innerHeight);
      renderer.setPixelRatio(settings.pixelRatio);
      renderer.setSize(width, height);
      renderer.getDrawingBufferSize(uniforms.uResolution.value);
      uniforms.uAspect.value = width / height;
      renderer.render(scene, camera);
    }

    let frame = 0;
    let elapsed = 0;
    let previous = null;
    let contextLost = false;

    function animate(now) {
      frame = 0;
      if (document.hidden || contextLost) { previous = null; return; }
      const dt = previous === null ? 0 : Math.min((now - previous) * 0.001, 0.1);
      previous = now;
      if (settings.animation !== 'Static' && settings.motionSpeed > 0) {
        elapsed = (elapsed + dt * settings.motionSpeed) % settings.loopDuration;
        updateMotion(dt, elapsed / settings.loopDuration * Math.PI * 2);
      }
      uniforms.uTime.value = elapsed;
      renderer.render(scene, camera);
      frame = requestAnimationFrame(animate);
    }

    function resume() {
      cancelAnimationFrame(frame);
      previous = null;
      if (!document.hidden && !contextLost) frame = requestAnimationFrame(animate);
    }

    window.addEventListener('resize', resize, { passive: true });
    document.addEventListener('visibilitychange', resume);
    renderer.domElement.addEventListener('webglcontextlost', event => {
      event.preventDefault();
      contextLost = true;
      cancelAnimationFrame(frame);
      previous = null;
    });
    renderer.domElement.addEventListener('webglcontextrestored', () => {
      contextLost = false;
      resize();
      resume();
    });
    window.addEventListener('pagehide', () => {
      cancelAnimationFrame(frame);
      previous = null;
    });
    window.addEventListener('pageshow', resume);
    syncSettings();
    resize();
    resume();

    // Scene gestures are attached only to the canvas; GUI input cannot re-roll it.
    const canvas = renderer.domElement;
    let gesture = null;
    canvas.addEventListener('contextmenu', event => event.preventDefault());
    canvas.addEventListener('pointerdown', event => {
      if (gesture || !event.isPrimary || ![0, 2].includes(event.button)) return;
      gesture = { id: event.pointerId, x: event.clientX, y: event.clientY,
        startX: event.clientX, startY: event.clientY, moved: false,
        rotate: event.button === 2 || event.shiftKey, button: event.button };
      canvas.setPointerCapture(event.pointerId);
    });
    canvas.addEventListener('pointermove', event => {
      if (!gesture || event.pointerId !== gesture.id) return;
      const dx = event.clientX - gesture.x, dy = event.clientY - gesture.y;
      if (Math.hypot(event.clientX - gesture.startX, event.clientY - gesture.startY) > 5) gesture.moved = true;
      if (!gesture.moved) return;
      if (gesture.rotate) {
        settings.angle = ((settings.angle + dx * 0.20 + 180) % 360 + 360) % 360 - 180;
        settings.orbitTilt = clamp(settings.orbitTilt + dy * 0.16, -75, 75);
      } else {
        settings.panX = clamp(settings.panX + dx / window.innerHeight, -3, 3);
        settings.panY = clamp(settings.panY + dy / window.innerHeight, -3, 3);
      }
      gesture.x = event.clientX;
      gesture.y = event.clientY;
      applyView();
      refreshPanel();
    });
    function finishGesture(event) {
      if (!gesture || event.pointerId !== gesture.id) return;
      const click = event.type === 'pointerup' && !gesture.moved && gesture.button === 0;
      gesture = null;
      if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
      if (click && settings.clickRandomize) randomize();
    }
    canvas.addEventListener('pointerup', finishGesture);
    canvas.addEventListener('pointercancel', finishGesture);
    canvas.addEventListener('lostpointercapture', event => {
      // A queued release from the previous drag must not cancel a new capture.
      if (!canvas.hasPointerCapture(event.pointerId)) gesture = null;
    });
    canvas.addEventListener('wheel', event => {
      event.preventDefault();
      const unit = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? window.innerHeight : 1;
      const oldZoom = settings.zoom;
      settings.zoom = clamp(oldZoom * Math.exp(-clamp(event.deltaY * unit, -300, 300) * 0.0012), 0.2, 6);
      const ratio = settings.zoom / oldZoom;
      const x = (event.clientX / window.innerWidth - 0.5) * uniforms.uAspect.value;
      const y = event.clientY / window.innerHeight - 0.5;
      settings.panX = clamp(x - (x - settings.panX - motion.x) * ratio - motion.x, -3, 3);
      settings.panY = clamp(y - (y - settings.panY - motion.y) * ratio - motion.y, -3, 3);
      applyView();
      refreshPanel();
    }, { passive: false });
    window.addEventListener('keydown', event => {
      if (event.repeat || event.ctrlKey || event.altKey || event.metaKey || event.key.toLowerCase() !== 'h') return;
      const editing = event.target instanceof HTMLElement
        && (event.target.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(event.target.tagName));
      if (editing) return;
      uiHidden = !uiHidden;
      gui?.show(!uiHidden);
    });

    let GUI;
    try {
      ({ default: GUI } = await import('https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js'));
    } catch {
      try {
        ({ default: GUI } = await import('https://cdn.jsdelivr.net/npm/lil-gui@0.19.1/dist/lil-gui.esm.min.js'));
      } catch (error) {
        console.warn('The settings panel could not load.', error);
      }
    }
    if (GUI) {
      gui = new GUI({ title: 'Below the Light', width: 300 });
      gui.show(!uiHidden);
      gui.add(settings, 'palette', Object.keys(palettes)).name('Color scheme').onChange(applyPalette);
      gui.add(settings, 'invertAchromatic').name('Invert achromatic').onChange(() => {
        if (settings.palette.startsWith('Achromatic')) applyPalette();
      });
      gui.add(settings, 'greenscreen').name('Greenscreen');
      gui.add(settings, 'animation', animations).name('Animation').onChange(value => {
        if (value === 'Static') {
          motion.x = motion.y = motion.angle = motion.zoom = 0;
          applyView();
        }
      });
      gui.add(settings, 'motionSpeed', 0, 2, 0.01).name('Animation speed');
      gui.add(settings, 'pixelRatio', 0.5, 3, 0.05).name('Pixel ratio (DPR)').onChange(resize);
      gui.add(settings, 'clickRandomize').name('Click to randomize');
      gui.add({ randomize }, 'randomize').name('New variation');

      const colors = gui.addFolder('Colors');
      colors.addColor(settings, 'background').name('Background');
      colors.addColor(settings, 'highlight').name('Highlights');
      colors.addColor(settings, 'body').name('Light body');
      colors.addColor(settings, 'halo').name('Halo');
      colors.addColor(settings, 'accent').name('Accent');
      colors.addColor(settings, 'shadow').name('Atmosphere');
      colors.add(settings, 'accentAmount', 0, 1, 0.01).name('Accent amount');
      colors.close();

      const optics = gui.addFolder('Light & form');
      optics.add(settings, 'glowIntensity', 0.2, 2, 0.01).name('Glow intensity');
      optics.add(settings, 'softness', 0.4, 2, 0.01).name('Diffusion');
      optics.add(settings, 'warpStrength', 0, 0.18, 0.001).name('Liquid warp');
      optics.add(settings, 'size', 0.5, 1.6, 0.01).name('Shape size');
      optics.add(settings, 'variation', 0, 1, 0.01).name('Shape variation');
      optics.add(settings, 'seed', 0, 10000, 1).name('Seed');
      optics.add(settings, 'grain', 0, 0.02, 0.0005).name('Film grain');
      optics.add(settings, 'loopDuration', 20, 120, 1).name('Loop seconds');
      optics.close();

      const view = gui.addFolder('Camera');
      view.add(settings, 'zoom', 0.2, 6, 0.01).name('Zoom');
      view.add(settings, 'panX', -3, 3, 0.001).name('Position X');
      view.add(settings, 'panY', -3, 3, 0.001).name('Position Y');
      view.add(settings, 'angle', -180, 180, 0.1).name('Camera angle');
      view.add(settings, 'orbitTilt', -75, 75, 0.1).name('Orbit tilt');
      view.add(settings, 'cameraAmount', 0, 2, 0.01).name('Camera motion');
      view.add({ resetView }, 'resetView').name('Reset view');
      view.close();
      gui.onChange(syncSettings);
    }
  }
}
</script>
</body>
</html>
