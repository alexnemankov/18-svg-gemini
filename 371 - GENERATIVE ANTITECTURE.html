      prism([[x-0.09,y-sy*0.34],[x+0.09,y-sy*0.34],[x+0.09,y+sy*0.16],[x-0.09,y+sy*0.16]],
        pz,H,{stroke:INK,lw:0.5,alpha:0.42,fill:P[3],a:0.1,dt:2});
    }
    if(DLV>=2) for(let f=0;f<fl;f++) for(let b=0;b<bays;b++){
      if(!ch(0.34)) continue;                  // painted loggia backs
      const x=-W/2+W*(b+0.5)/bays, z=pz+f*fh;
      quad([[x-W/bays*0.34,y+sy*0.1,z+0.2],[x+W/bays*0.34,y+sy*0.1,z+0.2],
            [x+W/bays*0.34,y+sy*0.1,z+fh*0.82],[x-W/bays*0.34,y+sy*0.1,z+fh*0.82]],
        {stroke:INK,lw:0.4,fill:pick(P),a:0.35,dt:3});
      bump('LOGGIE');
    }
    bump('BRISE',bays);
  }
  // roof terrace: parapet, ventilation stack, curved wall, gymnasium volume, ramp
  const rz=pz+H;
  prism(planShape(W+0.3,D+0.3,'RECT'),rz,0.22,{stroke:INK,lw:1.0,alpha:0.65,fill:P[3],a:0.14});
  const par=1.0;
  for(const sy of [-1,1])
    prism([[-W/2,sy*D/2-sy*0.12],[W/2,sy*D/2-sy*0.12],[W/2,sy*D/2+sy*0.12],[-W/2,sy*D/2+sy*0.12]],
      rz+0.22,par,{stroke:INK,lw:0.7,alpha:0.55,fill:P[2],a:0.12});
  // ventilation stacks — tapered cylinders
  for(const sx of [-0.28,0.16]){
    const cxp=W*sx, r0=rr(0.7,1.0);
    cyl(cxp,0,rz+0.22,r0,rr(1.6,2.6),{seg:14,rings:2,lw:0.6,alpha:0.55});
    ring(cxp,0,rz+0.22+2.3,r0*0.78,16,{stroke:INK,lw:0.6,alpha:0.5});
    bump('STACKS');
  }
  // the curved screen wall
  {
    const cxp=W*0.34, rr2=D*0.42, pts=[];
    for(let i=0;i<=14;i++){ const a=-Math.PI/2+Math.PI*i/14;
      pts.push([cxp+Math.cos(a)*rr2, Math.sin(a)*rr2, rz+0.22]); }
    poly(pts,{stroke:INK,lw:0.9,alpha:0.65});
    poly(pts.map(p=>[p[0],p[1],p[2]+1.7]),{stroke:INK,lw:0.9,alpha:0.6});
    for(let i=0;i<=14;i+=2) seg(pts[i],[pts[i][0],pts[i][1],pts[i][2]+1.7],
      {stroke:INK,lw:0.5,alpha:0.45,dt:2});
    bump('SOLARIVM');
  }
  // running track / ramp along the roof
  if(DLV>=2){
    for(const o of [-D*0.3,D*0.3])
      seg([-W*0.42,o,rz+0.24],[W*0.42,o,rz+0.24],{stroke:INK,lw:0.5,alpha:0.4,dt:2});
    bump('AMBVLACRVM');
  }
  bump('SLAB'); bump('PARAPET',2);
  return rz+3.4;
}

/* ---- AUDITORIUM: 1920s Japanese academic Gothic, brick and stone ---- */
function sysAuditorium(cfg){
  const P=cfg.pal.c;
  const W=rr(9,12), D=rr(5.5,7), fl=3, fh=rr(1.6,2.0);
  const H=fl*fh;
  const wingW=W*0.34, coreW=W-wingW*2;
  const brick={stroke:INK,lw:0.95,alpha:0.62,fill:P[3],a:0.16,
               pat:DLV>=2?'grid':null,patFace:1,pa:0.22};

  /* --- pointed arch opening --- */
  const lancet=(cx,cy,z,w,h,dep,axis)=>{
    const R=w*0.9, half=w/2;
    for(const o of [-dep/2,dep/2]){
      const pts=[];
      const px=(t,zz)=> axis? [cx+o,cy+t,zz] : [cx+t,cy+o,zz];
      pts.push(px(-half,z));
      for(let i=0;i<=8;i++){                       // left arc
        const a=Math.PI-Math.acos(Math.max(-1,Math.min(1,(half)/R)))*(i/8);
        pts.push(px(-half+ (R*Math.cos(Math.PI-a)+half)*0, z));
      }
      pts.length=0;
      pts.push(px(-half,z),px(-half,z+h*0.62));
      for(let i=0;i<=10;i++){                      // two-centred head
        const t=i/10, xx=-half+w*t;
        const c=(t<0.5)? half*0.6 : -half*0.6;
        const zz=z+h*0.62+Math.sqrt(Math.max(0,(R*R)-(xx-c)*(xx-c)))-Math.sqrt(Math.max(0,R*R-half*half*2.56))*0.0;
        pts.push(px(xx, z+h*0.62+(h*0.38)*Math.sin(Math.PI*t)*1.0));
      }
      pts.push(px(half,z+h*0.62),px(half,z));
      poly(pts,{stroke:INK,lw:0.7,alpha:0.6,dt:1});
    }
    bump('ARCVS');
  };
  /* --- steep tiled roof with dormers --- */
  const gable=(x,y,w,d,z,rise,o={})=>{
    const X=x+w, Y=y+d, mx=x+w/2;
    quad([[X,y,z],[X,Y,z],[mx,Y,z+rise],[mx,y,z+rise]],
      {stroke:INK,lw:0.85,alpha:0.65,fill:P[0],a:0.2,pat:DLV>=2?'rule':null,pa:0.3});
    quad([[x,y,z],[x,Y,z],[mx,Y,z+rise],[mx,y,z+rise]],
      {stroke:INK,lw:0.85,alpha:0.5,fill:P[0],a:0.14});
    poly([[x,y,z],[X,y,z],[mx,y,z+rise]],{stroke:INK,lw:0.8,alpha:0.6,close:true,
      fill:P[3],a:0.16,pat:DLV>=2?'grid':null,pa:0.2});
    poly([[x,Y,z],[X,Y,z],[mx,Y,z+rise]],{stroke:INK,lw:0.8,alpha:0.45,close:true});
    seg([mx,y,z+rise],[mx,Y,z+rise],{stroke:INK,lw:1.0,alpha:0.75});
    if(DLV>=2){
      const n=Math.max(3,Math.round(d/0.7));
      for(let i=1;i<n;i++){ const yy=y+d*i/n;
        seg([X,yy,z],[mx,yy,z+rise],{stroke:INK,lw:0.32,alpha:0.22,dt:3}); }
      for(let k=0;k<(o.dormers||0);k++){          // dormers
        const yy=y+d*(k+0.5)/(o.dormers), dw=0.55;
        const dz=z+rise*0.42;
        box(X-rise*0.42-0.1,yy-dw/2,dz,0.5,dw,0.7,
          {stroke:INK,lw:0.55,alpha:0.5,fill:P[3],a:0.14,hidden:false,dt:2});
        poly([[X-rise*0.42-0.1,yy-dw/2,dz+0.7],[X-rise*0.42-0.1,yy+dw/2,dz+0.7],
              [X-rise*0.42-0.1,yy,dz+1.05]],{stroke:INK,lw:0.5,alpha:0.5,close:true,dt:2});
        bump('DORMERS');
      }
    }
    bump('TEGVLAE');
  };

  /* --- plinth and body --- */
  prism(planShape(W+0.7,D+0.7,'RECT'),-0.3,0.4,
    {stroke:INK,lw:0.9,alpha:0.6,fill:P[3],a:0.18,pat:DLV>=2?'stipple':null,patFace:2,pa:0.2});
  prism(planShape(coreW,D,'RECT'),0,H,brick);
  for(const sx of [-1,1]){
    const x=sx*(coreW/2+wingW/2);
    prism(rotPlan(planShape(wingW,D*0.92,'RECT'),0,x,0),0,H*0.86,brick);
    gable(x-wingW/2,-D*0.46,wingW,D*0.92,H*0.86,wingW*0.55,{dormers:ri(2,3)});
    // buttresses
    for(let i=0;i<3;i++){
      const bx=x-wingW/2+wingW*(i+0.5)/3;
      prism([[bx-0.22,-D*0.46-0.45],[bx+0.22,-D*0.46-0.45],[bx+0.22,-D*0.46],[bx-0.22,-D*0.46]],
        0,H*0.72,{stroke:INK,lw:0.7,alpha:0.55,fill:P[3],a:0.14});
      poly([[bx-0.22,-D*0.46-0.45,H*0.72],[bx+0.22,-D*0.46-0.45,H*0.72],
            [bx,-D*0.46-0.1,H*0.82]],{stroke:INK,lw:0.55,alpha:0.5,close:true,dt:2});
      bump('BVTTRESS');
    }
    // tall mullioned windows
    if(DLV>=1) for(let i=0;i<4;i++){
      const wx=x-wingW/2+wingW*(i+0.5)/4;
      lancet(wx,-D*0.46,H*0.22,wingW/6,H*0.5,0.16,false);
      bump('FENESTRAE');
    }
  }
  gable(-coreW/2,-D/2,coreW,D,H,coreW*0.42,{dormers:ri(3,5)});

  /* --- the clock tower --- */
  const tw=coreW*0.42, tz=H*rr(2.0,2.5);
  prism(planShape(tw,tw,'RECT'),0,tz,
    {stroke:INK,lw:1.05,alpha:0.68,fill:P[3],a:0.18,pat:DLV>=2?'grid':null,patFace:1,pa:0.24});
  for(const zz of [H*0.9,tz*0.62,tz*0.86]){       // string courses
    prism(planShape(tw+0.26,tw+0.26,'RECT'),zz,0.18,
      {stroke:INK,lw:0.7,alpha:0.55,fill:P[3],a:0.14});
    bump('CORNICE');
  }
  for(const sx of [-1,1]) for(const sy of [-1,1])  // corner buttresses
    prism([[sx*tw/2-0.16,sy*tw/2-0.16],[sx*tw/2+0.16,sy*tw/2-0.16],
           [sx*tw/2+0.16,sy*tw/2+0.16],[sx*tw/2-0.16,sy*tw/2+0.16]],0,tz*0.9,
      {stroke:INK,lw:0.7,alpha:0.55,fill:P[3],a:0.14});
  // belfry openings
  for(let i=0;i<2;i++) lancet(0,-tw/2,tz*0.66+i*0.0,tw*0.5,tz*0.18,0.14,false);
  // clock face
  {
    const cz=tz*0.5, r2=tw*0.28;
    const rg=[];
    for(let k=0;k<=20;k++){ const a=k/20*6.2832;
      rg.push([Math.cos(a)*r2,-tw/2-0.02,cz+Math.sin(a)*r2]); }
    poly(rg,{stroke:INK,lw:0.8,alpha:0.7,close:true,fill:P[2],a:0.24});
    if(DLV>=2) for(let k=0;k<12;k++){ const a=k/12*6.2832;
      seg([Math.cos(a)*r2*0.82,-tw/2-0.03,cz+Math.sin(a)*r2*0.82],
          [Math.cos(a)*r2*0.95,-tw/2-0.03,cz+Math.sin(a)*r2*0.95],
          {stroke:INK,lw:0.4,alpha:0.5,dt:2}); }
    seg([0,-tw/2-0.04,cz],[r2*0.5,-tw/2-0.04,cz+r2*0.4],{stroke:INK,lw:0.6,alpha:0.6});
    seg([0,-tw/2-0.04,cz],[0,-tw/2-0.04,cz+r2*0.66],{stroke:INK,lw:0.6,alpha:0.6});
    bump('HOROLOGIVM');
  }
  // octagonal upper stage and spire
  const oz=tz, orad=tw*0.62;
  const oct=[];
  for(let i=0;i<8;i++){ const a=i/8*6.2832+Math.PI/8;
    oct.push([Math.cos(a)*orad,Math.sin(a)*orad]); }
  prism(oct,oz,tw*0.72,{stroke:INK,lw:0.9,alpha:0.62,fill:P[3],a:0.16});
  for(let i=0;i<8;i++){
    const a=i/8*6.2832+Math.PI/8;
    post(Math.cos(a)*orad,Math.sin(a)*orad,oz,tw*0.72,0.13,{alpha:0.55,dt:2});
  }
  const sp=tw*rr(1.5,2.1);
  for(let i=0;i<8;i++){
    const a=i/8*6.2832+Math.PI/8, b=(i+1)/8*6.2832+Math.PI/8;
    quad([[Math.cos(a)*orad,Math.sin(a)*orad,oz+tw*0.72],
          [Math.cos(b)*orad,Math.sin(b)*orad,oz+tw*0.72],
          [0,0,oz+tw*0.72+sp],[0,0,oz+tw*0.72+sp]],
      {stroke:INK,lw:0.7,alpha:0.6,fill:P[0],a:0.18});
  }
  post(0,0,oz+tw*0.72+sp,rr(0.5,1.0),0.1,{alpha:0.6,dt:2});
  // corner pinnacles
  for(const sx of [-1,1]) for(const sy of [-1,1]){
    const px=sx*orad*0.98, py=sy*orad*0.98;
    post(px,py,oz,tw*0.5,0.16,{alpha:0.5,fill:P[3],a:0.14,dt:2});
    poly([[px-0.14,py,oz+tw*0.5],[px+0.14,py,oz+tw*0.5],[px,py,oz+tw*0.5+0.55]],
      {stroke:INK,lw:0.5,alpha:0.5,close:true,dt:2});
    bump('PINNACVLA');
  }
  /* --- entrance: portal, steps, forecourt --- */
  lancet(0,-D/2,0.4,coreW*0.30,H*0.62,0.5,false);
  for(let i=0;i<6;i++){
    const t=i/6;
    quad([[-coreW*0.24,-D/2-0.5-t*1.5,0.4-t*0.4],[coreW*0.24,-D/2-0.5-t*1.5,0.4-t*0.4],
          [coreW*0.24,-D/2-0.75-t*1.5,0.4-t*0.4],[-coreW*0.24,-D/2-0.75-t*1.5,0.4-t*0.4]],
      {stroke:INK,lw:0.5,alpha:0.45,dt:2});
  }
  bump('PORTAL'); bump('GRADVS',6); bump('AVLA');
  return oz+tw*0.72+sp+1.4;
}

const ORDO = {
  TVSCANICVS:{h:7.0, ent:1/4, base:0.5, cap:0.5, flutes:0,  taper:0.83, frieze:'plain'},
  DORICVS:   {h:8.0, ent:1/4, base:0.35,cap:0.5, flutes:20, taper:0.82, frieze:'triglyph'},
  IONICVS:   {h:9.0, ent:1/5, base:0.5, cap:0.33,flutes:24, taper:0.84, frieze:'dentil'},
  CORINTHIVS:{h:10.0,ent:1/5, base:0.5, cap:1.16,flutes:24, taper:0.85, frieze:'modillion'}
};

/* solid of revolution from a profile [[radius, height], …] */
function lathe(cx,cy,z0,prof,o={}){
  const n=o.seg||(DLV>=2?10:7);
  for(let k=0;k<prof.length;k++){
    if(o.everyRing===false && k%2) continue;
    ring(cx,cy,z0+prof[k][1],prof[k][0],n*2,
      {stroke:INK,lw:o.lw||0.45,alpha:o.alpha||0.4,dt:o.dt||2});
  }
  for(let i=0;i<n;i++){
    const a=i/n*6.2832, line=[];
    for(const [r,h] of prof) line.push([cx+Math.cos(a)*r, cy+Math.sin(a)*r, z0+h]);
    poly(line,{stroke:INK,lw:o.lw2||0.55,alpha:o.alpha2||0.55,dt:1});
  }
}

/* a full column of a given order: attic base, entasis shaft, capital */
function column(x,y,z,D,ord,o={}){
  const O=ORDO[ord]||ORDO.TVSCANICVS;
  const H=(o.H!==undefined)?o.H:D*O.h;
  const bh=D*O.base*0.5, cph=D*O.cap*0.5;
  const sh=H-bh-cph;
  const R=D/2;

  /* --- base --- */
  if(ord!=='DORICVS'||DLV>=2){
    box(x-D*0.72,y-D*0.72,z,D*1.44,D*1.44,bh*0.34,
      {stroke:INK,lw:0.5,alpha:0.5,hidden:false,dt:1});                 // plinth
    lathe(x,y,z+bh*0.34,[[R*1.32,0],[R*1.30,bh*0.20],[R*1.12,bh*0.42],
                          [R*1.22,bh*0.52],[R*1.02,bh*0.66]],{dt:2});   // torus & scotia
  }
  /* --- shaft with entasis --- */
  const lv=DLV>=2?7:4, prof=[];
  for(let k=0;k<=lv;k++){
    const t=k/lv;
    const s=t*t*(3-2*t);                                   // smooth taper
    const swell=Math.sin(t*Math.PI)*0.012;                 // entasis swelling
    prof.push([R*((1-s*(1-O.taper))+swell), bh+sh*t]);
  }
  lathe(x,y,z,prof,{seg:DLV>=2?10:7,lw:0.4,alpha:0.32,lw2:0.6,alpha2:0.6});
  if(DLV>=3 && O.flutes){
    const nf=Math.min(12,O.flutes/2);
    for(let i=0;i<nf;i++){
      const a=i/nf*6.2832+0.25, line=[];
      for(const [r,h] of prof) line.push([x+Math.cos(a)*r*0.97, y+Math.sin(a)*r*0.97, z+h]);
      poly(line,{stroke:INK,lw:0.3,alpha:0.2,dt:3});
    }
  }
  /* --- capital --- */
  const cz=z+bh+sh, Rt=R*O.taper;
  if(ord==='DORICVS'||ord==='TVSCANICVS'){
    // annulets, echinus, abacus
    lathe(x,y,cz,[[Rt,0],[Rt*1.02,cph*0.14],[Rt*1.02,cph*0.22],
                  [Rt*1.24,cph*0.52],[Rt*1.34,cph*0.66]],{dt:2});
    box(x-Rt*1.42,y-Rt*1.42,cz+cph*0.66,Rt*2.84,Rt*2.84,cph*0.34,
      {stroke:INK,lw:0.55,alpha:0.62,hidden:false,dt:1});
  }else if(ord==='IONICVS'){
    lathe(x,y,cz,[[Rt,0],[Rt*1.04,cph*0.16],[Rt*1.14,cph*0.34]],{dt:2});
    if(DLV>=2){                                   // egg-and-dart on the echinus
      for(let i=0;i<12;i++){
        const a=i/12*6.2832;
        seg([x+Math.cos(a)*Rt*1.08,y+Math.sin(a)*Rt*1.08,cz+cph*0.18],
            [x+Math.cos(a)*Rt*1.16,y+Math.sin(a)*Rt*1.16,cz+cph*0.30],
            {stroke:INK,lw:0.3,alpha:0.3,dt:3});
      }
    }
    // volutes on the two principal faces, balusters on the flanks
    for(const fy of [y-Rt*1.1, y+Rt*1.1]){
      for(const sg of [-1,1]){
        const vx=x+sg*Rt*1.26, spir=[];
        for(let k=0;k<=18;k++){
          const a=k/18*6.0, rr2=Rt*0.44*(1-k/24);
          spir.push([vx-sg*Math.cos(a)*rr2, fy, cz+cph*0.46+Math.sin(a)*rr2]);
        }
        poly(spir,{stroke:INK,lw:0.45,alpha:0.5,dt:2});
      }
      seg([x-Rt*1.26,fy,cz+cph*0.46],[x+Rt*1.26,fy,cz+cph*0.46],
        {stroke:INK,lw:0.4,alpha:0.4,dt:2});
    }
    box(x-Rt*1.5,y-Rt*1.5,cz+cph*0.66,Rt*3.0,Rt*3.0,cph*0.34,
      {stroke:INK,lw:0.55,alpha:0.6,hidden:false,dt:1});
  }else{
    /* ---- CORINTHIVS: kalathos, two ranks of acanthus, caulicoli,
            helices, corner volutes, concave abacus with fleuron ---- */
    lathe(x,y,cz,[[Rt*0.98,0],[Rt*1.0,cph*0.08],[Rt*1.10,cph*0.46],
                  [Rt*1.26,cph*0.76]],{dt:2,alpha:0.3});
    const leaf=(a,z0,hh,r0,r1,tip)=>{
      const line=[];
      for(let k=0;k<=4;k++){
        const t=k/4;
        const rr2=r0+(r1-r0)*Math.pow(t,0.8)+(t>0.82?tip:0);
        const zz=z0+hh*(t<0.85? t*1.1 : 0.94-(t-0.85)*1.1);
        line.push([x+Math.cos(a)*rr2, y+Math.sin(a)*rr2, zz]);
      }
      poly(line,{stroke:INK,lw:0.42,alpha:0.5,dt:2});
      if(DLV>=3) for(const off of [-0.10,0.10]){
        const rib=line.map((pt,k)=>{
          const t=k/4, rr2=Math.hypot(pt[0]-x,pt[1]-y)*(1-0.06*Math.abs(off)*10);
          return [x+Math.cos(a+off)*rr2, y+Math.sin(a+off)*rr2, pt[2]];
        });
        poly(rib,{stroke:INK,lw:0.28,alpha:0.28,dt:3});
      }
    };
    for(let i=0;i<8;i++) leaf(i/8*6.2832,        cz+cph*0.02, cph*0.34, Rt*0.99, Rt*1.16, Rt*0.10);
    for(let i=0;i<8;i++) leaf(i/8*6.2832+0.3927, cz+cph*0.30, cph*0.34, Rt*1.06, Rt*1.28, Rt*0.12);
    if(DLV>=2){
      for(let i=0;i<4;i++){                        // caulicoli and inner helices
        const a=i/4*6.2832+0.7854, st=[];
        for(let k=0;k<=8;k++){
          const t=k/8, ang=a+t*0.9, rr2=Rt*(1.05+0.18*t)-Rt*0.5*t*t;
          st.push([x+Math.cos(ang)*rr2, y+Math.sin(ang)*rr2, cz+cph*(0.60+0.22*t)]);
        }
        poly(st,{stroke:INK,lw:0.38,alpha:0.42,dt:3});
      }
      for(const [sx,sy] of [[-1,-1],[1,-1],[1,1],[-1,1]]){     // corner volutes
        const sp=[];
        for(let k=0;k<=12;k++){
          const t=k/12, ang=t*4.2, rr2=Rt*0.30*(1-t*0.62);
          sp.push([x+sx*(Rt*1.30-Math.cos(ang)*rr2),
                   y+sy*(Rt*1.30-Math.cos(ang)*rr2)*0.55,
                   cz+cph*0.70+Math.sin(ang)*rr2+t*cph*0.16]);
        }
        poly(sp,{stroke:INK,lw:0.42,alpha:0.5,dt:3});
      }
    }
    // abacus with concave sides and a central fleuron on each face
    const ab=Rt*1.62, az=cz+cph*0.86, at=cph*0.14;
    for(const zz of [az,az+at]){
      const pts=[];
      for(let e=0;e<4;e++){
        const c1=[[-1,-1],[1,-1],[1,1],[-1,1]][e], c2=[[1,-1],[1,1],[-1,1],[-1,-1]][e];
        for(let k=0;k<=5;k++){
          const t=k/5, bow=Math.sin(t*Math.PI)*ab*0.16;
          const px=(c1[0]+(c2[0]-c1[0])*t)*ab, py=(c1[1]+(c2[1]-c1[1])*t)*ab;
          const len=Math.hypot(px,py)||1;
          pts.push([x+px-px/len*bow, y+py-py/len*bow, zz]);
        }
      }
      poly(pts,{stroke:INK,lw:0.5,alpha:0.55,close:true,dt:1});
    }
    for(const [sx,sy] of [[-1,-1],[1,-1],[1,1],[-1,1]])
      seg([x+sx*ab,y+sy*ab,az],[x+sx*ab,y+sy*ab,az+at],{stroke:INK,lw:0.45,alpha:0.5,dt:2});
    if(DLV>=2) for(let e=0;e<4;e++){
      const a=e*Math.PI/2+Math.PI/4*0;
      const fx=x+Math.cos(e*Math.PI/2)*ab*0.86, fy=y+Math.sin(e*Math.PI/2)*ab*0.86;
      for(let k=0;k<6;k++){
        const b=k/6*6.2832;
        seg([fx,fy,az+at*0.5],
            [fx+Math.cos(b)*Rt*0.1,fy+Math.sin(b)*Rt*0.05,az+at*0.5+Math.sin(b)*Rt*0.1],
            {stroke:INK,lw:0.28,alpha:0.3,dt:3});
      }
    }
    bump('FLORES',4);
  }
  bump('COLVMNAE');
  return z+H;
}

/* entablature: architrave, frieze (triglyphs / dentils / modillions), cornice */
function entablature(x,y,z,w,d,D,ord,o={}){
  const O=ORDO[ord]||ORDO.TVSCANICVS;
  const E=D*O.h*O.ent;
  const ah=E*0.30, fh=E*0.30, ch2=E*0.40;
  const P=o.fill||null;
  const bw=o.beam!==undefined?o.beam:Math.min(w,d)*0.5;   // ring width
  const ring4=(zz,hh,al)=>{
    if(bw>=Math.min(w,d)*0.49){
      box(x,y,zz,w,d,hh,{stroke:INK,lw:0.7,alpha:al,fill:P,a:0.12,hidden:false,dt:1});
      return;
    }
    box(x,y,zz,w,bw,hh,{stroke:INK,lw:0.7,alpha:al,fill:P,a:0.12,hidden:false,dt:1});
    box(x,y+d-bw,zz,w,bw,hh,{stroke:INK,lw:0.7,alpha:al,fill:P,a:0.12,hidden:false,dt:1});
    box(x,y+bw,zz,bw,d-bw*2,hh,{stroke:INK,lw:0.7,alpha:al,fill:P,a:0.12,hidden:false,dt:1});
    box(x+w-bw,y+bw,zz,bw,d-bw*2,hh,{stroke:INK,lw:0.7,alpha:al,fill:P,a:0.12,hidden:false,dt:1});
  };
  ring4(z,ah,0.6);
  if(DLV>=2){                                    // architrave fasciae
    for(const f of [0.4,0.72])
      poly([[x,y,z+ah*f],[x+w,y,z+ah*f]],{stroke:INK,lw:0.35,alpha:0.3,dt:2});
  }
  ring4(z+ah,fh,0.55);
  if(DLV>=2){
    if(O.frieze==='triglyph'){
      const n=Math.max(2,Math.round(w/(D*1.25)));
      for(let i=0;i<=n;i++){
        const tx=x+w*i/n;
        box(tx-D*0.16,y-0.02,z+ah,D*0.32,d+0.04,fh,
          {stroke:INK,lw:0.4,alpha:0.45,hidden:false,dt:2});
        for(const g of [-0.05,0.05])
          seg([tx+g*D,y,z+ah],[tx+g*D,y,z+ah+fh],{stroke:INK,lw:0.3,alpha:0.3,dt:3});
      }
      bump('TRIGLYPHI',Math.max(2,Math.round(w/(D*1.25))));
    }else if(O.frieze==='dentil'){
      const n=Math.round(w/(D*0.34));
      for(let i=0;i<n;i++){
        const tx=x+w*(i+0.3)/n;
        seg([tx,y,z+ah+fh*0.55],[tx,y,z+ah+fh*0.95],{stroke:INK,lw:0.35,alpha:0.3,dt:3});
      }
      bump('DENTICVLI',n);
    }
  }
  // cornice with projecting corona
  const pj=E*0.22;
  { const sv=bw; const W2=w+pj*2, D2=d+pj*2, X2=x-pj, Y2=y-pj, b2=sv+pj*2;
    if(b2>=Math.min(W2,D2)*0.49){
      box(X2,Y2,z+ah+fh,W2,D2,ch2,{stroke:INK,lw:0.75,alpha:0.65,fill:P,a:0.14,hidden:false,dt:1});
    }else{
      box(X2,Y2,z+ah+fh,W2,b2,ch2,{stroke:INK,lw:0.75,alpha:0.65,fill:P,a:0.14,hidden:false,dt:1});
      box(X2,Y2+D2-b2,z+ah+fh,W2,b2,ch2,{stroke:INK,lw:0.75,alpha:0.65,fill:P,a:0.14,hidden:false,dt:1});
      box(X2,Y2+b2,z+ah+fh,b2,D2-b2*2,ch2,{stroke:INK,lw:0.75,alpha:0.6,fill:P,a:0.14,hidden:false,dt:1});
      box(X2+W2-b2,Y2+b2,z+ah+fh,b2,D2-b2*2,ch2,{stroke:INK,lw:0.75,alpha:0.6,fill:P,a:0.14,hidden:false,dt:1});
    } }
  if(DLV>=2 && O.frieze==='modillion'){
    const n=Math.round(w/(D*0.62));
    for(let i=0;i<n;i++){
      const tx=x+w*(i+0.5)/n;
      poly([[tx,y-pj,z+ah+fh],[tx,y-pj,z+ah+fh+ch2*0.4],[tx,y,z+ah+fh+ch2*0.4]],
        {stroke:INK,lw:0.3,alpha:0.28,close:true,dt:3});
    }
    bump('MVTVLI',n);
  }
  bump('EPISTYLIVM');
  return z+E;
}

/* ============================================================
   FASTIGIVM — the pediment.  Vitruvius III.5.12: the tympanum
   rises one ninth of the span of the cornice.  The raking cornice
   is a distinct member that sits ON the horizontal geison and
   returns over it at the eaves; the tympanum is recessed behind
   both.  Variants after late-antique practice: arcuated (the
   "Syrian" arch), segmental, and broken.
   ============================================================ */
const FASTIGIA=['TRIANGVLARE','TRIANGVLARE','TRIANGVLARE','ARCVATVM','SEGMENTALE','FRACTVM'];

/* extrude a moulded bar along a profile given as [[u,h],…] on the gable plane */
function rakeBand(pts, y, face, pj, ct, o={}){
  const sgn=face;                       // +1 → band projects toward −y
  for(let i=0;i<pts.length-1;i++){
    const a=pts[i], b=pts[i+1];
    const yo=y-sgn*pj;
    // corona face
    quad([[a[0],yo,a[1]],[b[0],yo,b[1]],[b[0],yo,b[1]+ct],[a[0],yo,a[1]+ct]],
      {stroke:INK,lw:0.6,alpha:0.6,fill:o.fill||null,a:0.14,dt:1});
    // upper bed
    quad([[a[0],yo,a[1]+ct],[b[0],yo,b[1]+ct],[b[0],y,b[1]+ct],[a[0],y,a[1]+ct]],
      {stroke:INK,lw:0.5,alpha:0.5,fill:o.fill||null,a:0.1,dt:1});
    // soffit
    quad([[a[0],yo,a[1]],[b[0],yo,b[1]],[b[0],y,b[1]],[a[0],y,a[1]]],
      {stroke:INK,lw:0.45,alpha:0.4,dt:2});
    // cyma + fillet lines
    if(DLV>=2) for(const f of [0.34,0.68])
      seg([a[0],yo,a[1]+ct*f],[b[0],yo,b[1]+ct*f],{stroke:INK,lw:0.3,alpha:0.3,dt:2});
  }
}

function pediment(x,y,z,w,d,D,ord,o={}){
  const kind=o.kind||'TRIANGVLARE';
  const rise=(kind==='SEGMENTALE')? w/13 : w/9;      // Vitruvius' one ninth
  const mx=x+w/2, P=o.fill||null;
  const ct=Math.max(D*0.26,w*0.020);                 // cornice depth
  const pj=ct*0.85;                                  // projection
  const rec=ct*0.9;                                  // tympanum set back

  /* --- horizontal geison: the member the rakes sit upon --- */
  for(const [fy,face] of [[y,1],[y+d,-1]]){
    const yo=fy-face*pj;
    quad([[x,yo,z-ct*0.9],[x+w,yo,z-ct*0.9],[x+w,yo,z],[x,yo,z]],
      {stroke:INK,lw:0.65,alpha:face>0?0.62:0.42,fill:P,a:0.14,dt:1});
    quad([[x,yo,z],[x+w,yo,z],[x+w,fy,z],[x,fy,z]],
      {stroke:INK,lw:0.5,alpha:face>0?0.5:0.34,dt:1});
    if(DLV>=2){
      seg([x,yo,z-ct*0.55],[x+w,yo,z-ct*0.55],{stroke:INK,lw:0.3,alpha:0.3,dt:2});
      const n=Math.round(w/(D*0.5));                 // dentils under the geison
      for(let i=0;i<n;i++){
        const px=x+w*(i+0.3)/n;
        seg([px,yo,z-ct*0.86],[px,yo,z-ct*0.58],{stroke:INK,lw:0.28,alpha:0.28,dt:3});
      }
    }
  }

  /* --- the rake profile --- */
  let prof;
  if(kind==='SEGMENTALE'){
    prof=[];
    const R=(w*w/4+rise*rise)/(2*rise);
    for(let k=0;k<=14;k++){
      const t=-1+2*k/14, u=mx+t*w/2;
      prof.push([u, z+Math.sqrt(Math.max(0,R*R-(u-mx)*(u-mx)))-(R-rise)]);
    }
  }else{
    prof=[[x,z],[mx,z+rise],[x+w,z]];
  }
  const gap=w*0.14;
  if(kind==='FRACTVM'){
    prof=[[x,z],[mx-gap/2, z+rise*(1-gap/w*2)],
          [mx+gap/2, z+rise*(1-gap/w*2)],[x+w,z]];
    prof.splice(2,0);
  }

  for(const [fy,face] of [[y,1],[y+d,-1]]){
    if(kind==='FRACTVM'){
      rakeBand([prof[0],prof[1]],fy,face,pj,ct,{fill:P});
      rakeBand([prof[2],prof[3]],fy,face,pj,ct,{fill:P});
      // returns at the break
      for(const p of [prof[1],prof[2]]){
        const dir=(p[0]<mx)?1:-1;
        rakeBand([[p[0],p[1]],[p[0]+dir*ct*1.2,p[1]]],fy,face,pj,ct,{fill:P});
      }
    }else{
      rakeBand(prof,fy,face,pj,ct,{fill:P});
    }
    /* eaves returns: the raking cornice turns back over the geison */
    for(const px of [x,x+w]){
      const dir=(px===x)?1:-1;
      rakeBand([[px,z],[px+dir*ct*1.6,z]],fy,face,pj,ct,{fill:P});
    }
  }

  /* --- tympanum, recessed behind both cornices --- */
  const tri=(fy,face)=>{
    const yo=fy+face*rec;
    if(kind==='SEGMENTALE'){
      const pts=prof.map(p=>[p[0]*0.985+mx*0.015, yo, p[1]-ct*0.5]);
      pts.push([x+w*0.985-w*0.0,yo,z]); pts.unshift([x+w*0.015,yo,z]);
      poly(pts,{stroke:INK,lw:0.6,alpha:face>0?0.6:0.35,close:true,
        fill:P,a:0.14,pat:(DLV>=2&&face>0)?'stipple':null,pa:0.22});
    }else if(kind==='FRACTVM'){
      poly([[x+ct*1.5,yo,z],[mx-gap/2,yo,z+rise*0.72],
            [mx+gap/2,yo,z+rise*0.72],[x+w-ct*1.5,yo,z]],
        {stroke:INK,lw:0.6,alpha:face>0?0.6:0.35,close:true,fill:P,a:0.14,
         pat:(DLV>=2&&face>0)?'stipple':null,pa:0.2});
    }else{
      poly([[x+ct*1.5,yo,z],[x+w-ct*1.5,yo,z],[mx,yo,z+rise-ct*1.35]],
        {stroke:INK,lw:0.6,alpha:face>0?0.6:0.35,close:true,fill:P,a:0.14,
         pat:(DLV>=2&&face>0)?'stipple':null,pa:0.2});
    }
  };
  tri(y,1); tri(y+d,-1);

  /* --- the arcuated variant: an arch springs into the tympanum --- */
  if(kind==='ARCVATVM'){
    const R=w*0.20;
    for(const [fy,face] of [[y,1],[y+d,-1]]){
      const yo=fy-face*pj*0.75;
      for(const k of [1.0,1.20]){
        const arc=[];
        for(let i=0;i<=16;i++){
          const a=Math.PI*i/16;
          arc.push([mx-Math.cos(a)*R*k, yo, z+Math.sin(a)*R*k]);
        }
        poly(arc,{stroke:INK,lw:k===1?0.7:0.5,alpha:face>0?0.62:0.4,dt:k===1?1:2});
      }
      if(DLV>=2) for(let i=0;i<=8;i++){
        const a=Math.PI*i/8;
        seg([mx-Math.cos(a)*R,yo,z+Math.sin(a)*R],
            [mx-Math.cos(a)*R*1.20,yo,z+Math.sin(a)*R*1.20],
            {stroke:INK,lw:0.3,alpha:0.32,dt:2});
      }
      // the geison is interrupted; the arch rests on two brackets
      for(const sg of [-1,1])
        box(mx+sg*R-ct*0.5,fy-face*pj,z-ct*0.9,ct,pj,ct*1.5,
          {stroke:INK,lw:0.45,alpha:0.45,hidden:false,dt:2});
    }
    // barrel soffit of the arch
    for(let i=0;i<=8;i++){
      const a=Math.PI*i/8;
      seg([mx-Math.cos(a)*R,y-pj*0.75,z+Math.sin(a)*R],
          [mx-Math.cos(a)*R,y+d+pj*0.75,z+Math.sin(a)*R],
          {stroke:INK,lw:0.35,alpha:0.3,dt:2});
    }
    bump('ARCVS');
  }

  /* --- acroteria --- */
  if(DLV>=2){
    const apex=(kind==='FRACTVM')? null : mx;
    const spots=[x,x+w].concat(apex!==null?[apex]:[]);
    for(const px of spots){
      const zz=z+((px===apex)?rise:0);
      box(px-D*0.24,y-D*0.18,zz,D*0.48,d+D*0.36,ct*0.9,
        {stroke:INK,lw:0.4,alpha:0.5,hidden:false,dt:2});
      poly([[px-D*0.22,y-D*0.18,zz+ct*0.9],[px,y-D*0.18,zz+ct*0.9+D*0.5],
            [px+D*0.22,y-D*0.18,zz+ct*0.9]],
        {stroke:INK,lw:0.4,alpha:0.45,close:true,fill:P,a:0.16,dt:2});
    }
    bump('ACROTERIA',spots.length);
  }
  bump('FASTIGIVM');
  return rise+ct;
}

/* low tiled roof of a temple or hall */
function tileRoof(x,y,z,w,d,rise,o={}){
  const X=x+w, Y=y+d, mx=x+w/2;
  const fa=o.a!==undefined?o.a:0.16;
  quad([[X,y,z],[X,Y,z],[mx,Y,z+rise],[mx,y,z+rise]],
    {stroke:INK,lw:0.7,alpha:0.6,fill:o.fill||null,a:fa,pat:DLV>=2?'rule':null,pa:0.24});
  quad([[x,y,z],[x,Y,z],[mx,Y,z+rise],[mx,y,z+rise]],
    {stroke:INK,lw:0.7,alpha:0.45,fill:o.fill||null,a:fa*0.7});
  seg([mx,y,z+rise],[mx,Y,z+rise],{stroke:INK,lw:0.85,alpha:0.7});
  if(DLV>=2){
    const n=Math.max(4,Math.round(d/0.55));
    for(let i=1;i<n;i++){ const yy=y+d*i/n;
      seg([X,yy,z],[mx,yy,z+rise],{stroke:INK,lw:0.3,alpha:0.22,dt:3}); }
    for(let i=0;i<=n;i+=2){ const yy=y+d*i/n;      // antefixes along the eaves
      poly([[X,yy-0.06,z],[X,yy+0.06,z],[X,yy,z+0.16]],
        {stroke:INK,lw:0.3,alpha:0.3,close:true,dt:3}); }
  }
  bump('TEGVLAE');
}

/* an arched bay framed by an engaged order — the "Roman arch order" */
function archOrder(cx,cy,z,bw,bh2,depth,ax,D,ord,o={}){
  const P=o.fill||null;
  const half=bw/2, dz=depth/2;
  const pt=(t,zz,dd)=> ax? [cx+dd, cy+t, zz] : [cx+t, cy+dd, zz];
  const openW=bw*0.52, R=openW/2;
  const springZ=z+bh2*0.46;
  // piers
  for(const sg of [-1,1]){
    const a=pt(sg*(half+R)/2 - sg*0, z, 0);
    const px=sg*(R+ (half-R)/2);
    const p1=pt(px-(half-R)/2, z, -dz), p2=pt(px+(half-R)/2, z, dz);
    box(Math.min(p1[0],p2[0]),Math.min(p1[1],p2[1]),z,
        Math.abs(p2[0]-p1[0])||depth, Math.abs(p2[1]-p1[1])||depth, bh2,
        {stroke:INK,lw:0.7,alpha:0.55,fill:P,a:0.1,hidden:false,
         pat:(DLV>=2&&ch(0.3))?'grid':null,patFace:1,pa:0.16,dt:1});
  }
  // arch: intrados, extrados, voussoir joints
  for(const dd of [-dz,dz]){
    const intr=[], extr=[];
    for(let i=0;i<=14;i++){
      const a=Math.PI*i/14;
      intr.push(pt(-Math.cos(a)*R, springZ+Math.sin(a)*R, dd));
      extr.push(pt(-Math.cos(a)*R*1.22, springZ+Math.sin(a)*R*1.22, dd));
    }
    poly(intr,{stroke:INK,lw:0.75,alpha:0.6});
    if(DLV>=2){
      poly(extr,{stroke:INK,lw:0.5,alpha:0.45,dt:2});
      for(let i=0;i<=7;i++){ const a=Math.PI*i/7;
        seg(pt(-Math.cos(a)*R, springZ+Math.sin(a)*R, dd),
            pt(-Math.cos(a)*R*1.22, springZ+Math.sin(a)*R*1.22, dd),
            {stroke:INK,lw:0.35,alpha:0.32,dt:2}); }
      // impost mouldings
      for(const sg of [-1,1])
        seg(pt(sg*R*1.35, springZ, dd), pt(sg*R*0.75, springZ, dd),
          {stroke:INK,lw:0.45,alpha:0.4,dt:2});
    }
  }
  for(let i=0;i<=6;i++){ const a=Math.PI*i/6;
    seg(pt(-Math.cos(a)*R, springZ+Math.sin(a)*R, -dz),
        pt(-Math.cos(a)*R, springZ+Math.sin(a)*R,  dz),{stroke:INK,lw:0.4,alpha:0.3,dt:2}); }
  // engaged half-columns on the piers
  if(D>0 && DLV>=1){
    for(const sg of [-1,1]){
      const c=pt(sg*(R+ (half-R)*0.55), z, -dz*0.72);
      column(c[0],c[1],z,D,ord,{H:bh2*0.86});
    }
    const e=pt(-half,z,0);
    entablature(ax?cx-dz:cx-half, ax?cy-half:cy-dz,
      z+bh2*0.86, ax?depth:bw, ax?bw:depth, D, ord, {fill:P});
  }
  bump('ARCVS');
  return z+bh2;
}


/* ============================================================
   ANTIQUITY — temples, colossal arches, and hybrids with the
   modern city
   ============================================================ */
function podiumBlock2(x,y,z,w,d,h,o={}){
  prism(planShape(w,d,'RECT').map(p=>[p[0]+x+w/2,p[1]+y+d/2]),z,h,
    {stroke:INK,lw:0.95,alpha:0.65,fill:o.fill||null,a:0.15,
     pat:DLV>=2?'grid':null,patFace:1,pa:0.18});
  if(DLV>=2) for(const f of [0.10,0.90]){
    const pj=0.12;
    poly([[x-pj,y-pj,z+h*f],[x+w+pj,y-pj,z+h*f],[x+w+pj,y+d+pj,z+h*f],[x-pj,y+d+pj,z+h*f]],
      {stroke:INK,lw:0.5,alpha:0.45,close:true,dt:2});
  }
  bump('PODIVM');
}
function stepFlight(x,y,z,w,depth,h,n){
  for(let i=0;i<n;i++){
    const t=i/n, zz=z-h*t, yy=y-depth*t;
    quad([[x,yy,zz],[x+w,yy,zz],[x+w,yy-depth/n,zz],[x,yy-depth/n,zz]],
      {stroke:INK,lw:0.5,alpha:0.45,dt:2});
    seg([x,yy,zz],[x+w,yy,zz],{stroke:INK,lw:0.55,alpha:0.55,dt:1});
  }
  bump('STEPS',n);
}

/* ---- TEMPLE: eustyle, after Vitruvius III.3.6 ---- */
function sysTemple(cfg){
  const P=cfg.pal.c;
  const ord=pick(['CORINTHIVS','IONICVS','CORINTHIVS','DORICVS']);
  cfg.order=ord;
  const nFront=pick([4,6,6,8]);
  const parts=({4:11.5,6:18,8:24.5})[nFront];
  const front=rr(6.0,8.0), D=front/parts;
  const inter=D*2.25, interMid=D*3.0, colH=D*9.5;
  const plan=pick(['PROSTYLOS','PSEVDOPERIPTEROS','PERIPTEROS']);
  cfg.plan=plan;
  const nFlank = plan==='PERIPTEROS' ? (nFront*2-1) : Math.round(nFront*1.7);
  const xs=[]; let cx=-front/2+D/2;
  for(let i=0;i<nFront;i++){ xs.push(cx); cx += D + ((i===nFront/2-1)?interMid:inter); }
  const depth=(nFlank-1)*(D+inter)+D, podH=colH*0.40, y0=-depth/2;

  podiumBlock2(-front/2-D*0.6,y0-D*0.6,0,front+D*1.2,depth+D*1.2,podH,{fill:P[3]});
  stepFlight(-front*0.34,y0-D*0.6,podH,front*0.68,podH*1.55,podH,ri(6,11));
  const pronaos=(D+inter)*2.2;
  const cw=(plan==='PERIPTEROS')? front-2*(D+inter) : front-D*1.2;
  const cd=depth-pronaos-D;
  prism(planShape(cw,cd,'RECT').map(p=>[p[0],p[1]+y0+pronaos+cd/2]),podH,colH*0.92,
    {stroke:INK,lw:0.85,alpha:0.6,fill:P[0],a:0.10,pat:DLV>=2?'grid':null,patFace:2,pa:0.16});
  const put=(px,py,eng)=>{ if(eng&&DLV<2) return;
    column(px,py,podH,D*(eng?0.85:1),ord,{H:eng?colH*0.98:colH}); };
  for(const px of xs) put(px,y0+D/2,false);
  if(plan!=='PROSTYLOS'){
    for(const px of xs) put(px,y0+depth-D/2,plan!=='PERIPTEROS');
    for(let j=1;j<nFlank-1;j++){
      const py=y0+D/2+j*(D+inter);
      put(-front/2+D/2,py,plan==='PSEVDOPERIPTEROS');
      put( front/2-D/2,py,plan==='PSEVDOPERIPTEROS');
    }
  }else{
    for(let j=1;j<3;j++){ const py=y0+D/2+j*(D+inter);
      put(-front/2+D/2,py,true); put(front/2-D/2,py,true); }
  }
  const ez=podH+colH;
  const eh=entablature(-front/2-D*0.5,y0-D*0.5,ez,front+D,depth+D,D,ord,
    {fill:P[1],beam:D*2.1})-ez;
  const rise=pediment(-front/2-D*0.7,y0-D*0.6,ez+eh,front+D*1.4,depth+D*1.2,D,ord,
    {fill:P[1],kind:pick(FASTIGIA)});
  tileRoof(-front/2-D*0.7,y0-D*0.6,ez+eh,front+D*1.4,depth+D*1.2,rise,{fill:P[0],a:0.12});
  const ah=D*1.1;
  prism(planShape(D*2.2,D*1.5,'RECT').map(p=>[p[0],p[1]+y0-podH*1.55-D*2.0]),0,ah,
    {stroke:INK,lw:0.7,alpha:0.6,fill:P[3],a:0.16});
  bump('CELLA'); bump('ALTAR');
  return ez+eh+rise+0.4;
}

/* ---- COLOSSAL ARCH: a triumphal arch, or a tiered aqueduct ---- */
function sysColossalArch(cfg){
  const P=cfg.pal.c;
  const kind=ch(0.55)?'TRIUMPHAL':'AQUEDUCT';
  cfg.plan=kind;
  const ord='CORINTHIVS'; cfg.order=ord;
  if(kind==='AQUEDUCT'){
    const span=rr(2.6,3.6), rise=rr(4.2,5.6), n1=ri(5,7);
    let z=0;
    for(let i=0;i<n1;i++)
      archOrder(0,(i-(n1-1)/2)*span,z,span,rise,1.7,true,0,'TVSCANICVS',{fill:P[3]});
    z+=rise*1.16;
    const n2=Math.round(n1*1.8), s2=n1*span/n2;
    for(let i=0;i<n2;i++)
      archOrder(0,(i-(n2-1)/2)*s2,z,s2,rise*0.78,1.4,true,0,'TVSCANICVS',{fill:P[3]});
    z+=rise*0.78*1.16;
    const n3=Math.round(n1*5), s3=n1*span/n3;
    for(let i=0;i<n3;i++)
      archOrder(0,(i-(n3-1)/2)*s3,z,s3,rise*0.34,1.0,true,0,'TVSCANICVS',{fill:P[3]});
    z+=rise*0.34*1.16;
    const L2=n1*span/2;
    prism([[-0.5,-L2],[0.5,-L2],[0.5,L2],[-0.5,L2]],z,0.55,
      {stroke:INK,lw:0.7,alpha:0.6,fill:P[2],a:0.18});
    bump('SPECVS'); bump('PIERS',n1+n2+n3);
    return z+1.2;
  }
  // triumphal arch: a great central bay flanked by two lesser ones
  const cw=rr(4.6,6.0), ch2=rr(8.5,11.5), dep=rr(2.4,3.4);
  const D=cw*0.115, sw=cw*0.52;
  podiumBlock2(-cw*1.1,-dep/2-0.4,-0.4,cw*2.2,dep+0.8,0.4,{fill:P[3]});
  archOrder(0,0,0,cw,ch2*0.78,dep,false,0,ord,{fill:P[3]});
  for(const sg of [-1,1])
    archOrder(sg*(cw*0.5+sw*0.62),0,0,sw,ch2*0.46,dep*0.86,false,0,ord,{fill:P[3]});
  // engaged columns on tall pedestals
  for(const sg of [-1,1]) for(const k of [0,1]){
    const px=sg*(cw*0.5+sw*0.62)+ (k? sg*sw*0.62 : -sg*sw*0.62);
    prism(planShape(D*2.6,D*2.6,'RECT').map(p=>[p[0]+px,p[1]-dep/2-D*0.6]),0,ch2*0.16,
      {stroke:INK,lw:0.7,alpha:0.6,fill:P[3],a:0.16});
    column(px,-dep/2-D*0.6,ch2*0.16,D,ord,{H:ch2*0.60});
    bump('COLVMNAE');
  }
  const ez=ch2*0.16+ch2*0.60;
  entablature(-cw*1.12,-dep/2-D*1.2,ez,cw*2.24,dep+D*2.4,D,ord,{fill:P[1],beam:D*2.4});
  // attic storey with an inscription panel
  const az=ez+D*9.5*(1/5)+0.1;
  prism(planShape(cw*2.0,dep+D*1.2,'RECT'),az,ch2*0.24,
    {stroke:INK,lw:0.95,alpha:0.65,fill:P[3],a:0.16,pat:DLV>=2?'stipple':null,patFace:1,pa:0.2});
  if(DLV>=2){
    const pw=cw*1.2, ph=ch2*0.13;
    poly([[-pw/2,-dep/2-D*0.62,az+ch2*0.055],[pw/2,-dep/2-D*0.62,az+ch2*0.055],
          [pw/2,-dep/2-D*0.62,az+ch2*0.055+ph],[-pw/2,-dep/2-D*0.62,az+ch2*0.055+ph]],
      {stroke:INK,lw:0.6,alpha:0.6,close:true,fill:P[2],a:0.2,dt:1});
    for(let i=0;i<4;i++)                                    // lines of lettering
      seg([-pw*0.42,-dep/2-D*0.64,az+ch2*0.055+ph*(0.2+i*0.2)],
          [pw*0.42*rr(0.6,1),-dep/2-D*0.64,az+ch2*0.055+ph*(0.2+i*0.2)],
          {stroke:INK,lw:0.5,alpha:0.4,dt:2});
    bump('INSCRIPTION');
  }
  // quadriga plinths on the attic
  for(const sg of [-1,0,1]){
    const px=sg*cw*0.72;
    prism(planShape(D*2.2,D*2.2,'RECT').map(p=>[p[0]+px,p[1]]),az+ch2*0.24,D*1.4,
      {stroke:INK,lw:0.7,alpha:0.55,fill:P[3],a:0.14});
    if(DLV>=2) post(px,0,az+ch2*0.24+D*1.4,D*2.0,D*0.5,{alpha:0.5,fill:P[0],a:0.2,dt:2});
    bump('STATVES');
  }
  bump('ARCH');
  return az+ch2*0.24+D*3.6;
}

/* ---- HYBRID: a modern volume grafted onto a classical order ---- */
function sysHybrid(cfg){
  const P=cfg.pal.c;
  const ord=pick(['CORINTHIVS','IONICVS','DORICVS']); cfg.order=ord;
  const W=rr(9,12), Dp=rr(6.5,8.5);
  const D=rr(0.42,0.58), colH=D*9.5, podH=colH*0.30;
  cfg.plan='GRAFT / '+ord;
  podiumBlock2(-W/2,-Dp/2,0,W,Dp,podH,{fill:P[3]});
  stepFlight(-W*0.30,-Dp/2,podH,W*0.60,podH*1.5,podH,ri(5,9));
  // a surviving peristyle: some columns stand, others are stumps
  const nx=Math.max(4,Math.round(W/(D+D*2.25))), ny=Math.max(3,Math.round(Dp/(D+D*2.25)));
  const alive=[];
  for(let i=0;i<=nx;i++) for(let j=0;j<=ny;j++){
    if(i>0&&i<nx&&j>0&&j<ny) continue;
    const x=-W/2+D+ (W-D*2)*i/nx, y=-Dp/2+D+ (Dp-D*2)*j/ny;
    if(ch(0.16)){                                   // a broken shaft
      const hh=colH*rr(0.15,0.55);
      column(x,y,podH,D,ord,{H:hh});
      if(DLV>=2) poly([[x-D*0.5,y,podH+hh],[x+D*0.5,y,podH+hh+D*0.2],
                       [x+D*0.3,y+D*0.4,podH+hh]],{stroke:INK,lw:0.5,alpha:0.45,close:true,dt:2});
      bump('RVINS'); continue;
    }
    column(x,y,podH,D,ord,{H:colH});
    alive.push([x,y]);
  }
  const ez=podH+colH;
  entablature(-W/2,-Dp/2,ez,W,Dp,D,ord,{fill:P[1],beam:D*2.2});
  const eh=D*9.5/5;
  // the modern insertion: a glazed slab set across the ancient frame
  const mz=ez+eh+0.15, mw=W*rr(0.52,0.78), md=Dp*rr(0.55,0.8);
  const mkind=pick(['RECT','ROUNDED','CHAMFER','ONEROUND']);
  archPrism(rotPlan(planShape(mw,md,mkind,0.4),rr(-0.25,0.25)),mz,rr(5,10),
    {stroke:INK,lw:1.05,fill:P[0],a:0.13,fh:rr(1.0,1.3)});
  // the transfer structure that carries it
  for(const [x,y] of alive){
    if(!ch(0.5)) continue;
    seg([x,y,ez],[x*0.55,y*0.55,mz],{stroke:INK,lw:0.6,alpha:0.45,dt:1});
  }
  prism(planShape(mw*1.08,md*1.08,'RECT'),mz-0.42,0.42,
    {stroke:INK,lw:1.0,alpha:0.65,fill:P[2],a:0.18});
  bump('TRANSFER'); bump('GRAFT');
  // a lone arch in the forecourt
  archOrder(0,-Dp/2-2.2,0,W*0.30,colH*0.9,1.2,false,D*0.8,ord,{fill:P[3]});
  return mz+11;
}




/* ============================================================
   AIRFIELD — a runway, taxiways, an apron and a tower
   ============================================================ */
function buildAirfield(cfg,S,occupied){
  const P=cfg.pal.c;
  const ax=ch(0.5), sgn=ch(0.5)?1:-1;
  const RW=rr(2.4,3.1), L2=S*0.98;
  /* the strip runs along a contour of the terrain — constant u, so it is level.
     we search outward in u for a lane the buildings do not stand in. */
  /* the field occupies one half of the plate outright, so nothing crowds it */
  let off=null, side=sgn, plat=0, best=-1;
  const cands=[];
  for(const sd of [sgn,-sgn]) for(const f of [0.42,0.52,0.62,0.72,0.82,0.34])
    cands.push([sd, sd*S*f]);
  for(const [sd,cand] of cands){
    const tally={}; let blocked=false;
    for(let k=0;k<=14;k++){
      const v=-L2+2*L2*k/14, c=XY(cand,v);
      if(occupied(c[0],c[1],RW*0.95)) { blocked=true; break; }
      if(inRiver(c[0],c[1],RW*0.75)) { blocked=true; break; }
      const lv2=Math.round(terrH(c[0],c[1]));
      tally[lv2]=(tally[lv2]||0)+1;
    }
    if(blocked) continue;
    // the field is levelled: take the prevailing terrace and cut/fill to it
    let mode=0, cnt=0;
    for(const k in tally) if(tally[k]>cnt){ cnt=tally[k]; mode=+k; }
    const share=cnt/15;
    if(share>best){ best=share; off=cand; side=sd; plat=mode; }
    if(share>=0.999) break;
  }
  if(off===null || best<0.55){ cfg.field='CORRIDOR'; return; }
  const zFlat=TERR.riseH*plat+0.05;
  const zAt=()=>zFlat;
  const C=(u,v)=>{ const c=XY(off+u,v); return [c[0],c[1]]; };

  /* runway */
  const strip=[];
  for(let k=0;k<=24;k++){
    const v=-L2+2*L2*k/24;
    strip.push([...C(0,v), zFlat]);
  }
  const nn1=XY(RW/2,0), nn0=XY(0,0);
  const nx=nn1[0]-nn0[0], ny=nn1[1]-nn0[1];
  for(let k=0;k<24;k++){
    const a=strip[k], b=strip[k+1];
    quad([[a[0]-nx,a[1]-ny,a[2]],[b[0]-nx,b[1]-ny,b[2]],
          [b[0]+nx,b[1]+ny,b[2]],[a[0]+nx,a[1]+ny,a[2]]],
      {stroke:INK,lw:0.55,alpha:0.4,fill:P[3],a:0.16,
       pat:(DLV>=2&&k%3===0)?'stipple':null,pa:0.18});
  }
  // edge lines, centreline, thresholds, aiming bars
  for(const sg of [-1,1]){
    const e=[];
    for(let k=0;k<=24;k++){
      const v=-L2+2*L2*k/24, c=C(sg*RW/2,v);
      e.push([c[0],c[1],zFlat+0.01]);
    }
    poly(e,{stroke:INK,lw:1.15,alpha:0.8});
  }
  for(let k=0;k<34;k++){
    const v=-L2*0.94+1.88*L2*k/34;
    const a=C(0,v), b=C(0,v+L2*0.028);
    seg([a[0],a[1],zFlat+0.02],[b[0],b[1],zFlat+0.02],{stroke:INK,lw:0.9,alpha:0.72,dt:1});
  }
  for(const end of [-1,1]){
    for(let i=0;i<6;i++){
      const uu=-RW*0.38+RW*0.76*i/5;
      const v0=end*L2*0.96, v1=end*(L2*0.96-L2*0.055);
      const a=C(uu,v0), b=C(uu,v1);
      seg([a[0],a[1],zFlat+0.02],[b[0],b[1],zFlat+0.02],{stroke:INK,lw:1.5,alpha:0.85,dt:1});
    }
    for(const sg of [-1,1]) for(let i=0;i<3;i++){
      const uu=sg*RW*0.18, v0=end*(L2*0.72-i*L2*0.03);
      const a=C(uu-0.06,v0), b=C(uu+0.06,v0-end*L2*0.022);
      seg([a[0],a[1],zFlat+0.02],[b[0],b[1],zFlat+0.02],{stroke:INK,lw:0.9,alpha:0.55,dt:2});
    }
    for(let i=1;i<=6;i++){
      const v=end*(L2*0.99+i*1.5);
      const a=C(-0.7,v), b=C(0.7,v);
      seg([a[0],a[1],zFlat+0.02],[b[0],b[1],zFlat+0.02],{stroke:INK,lw:0.55,alpha:0.4,dt:2});
      bump('APPROACH');
    }
  }
  if(TERR.river){                                  // causeway where the strip meets water
    const vC=riverV(off), half=TERR.rw+1.6;
    const wz=zFlat-TERR.wDep-1.4;
    const a=C(-RW*0.62, vC-half), b=C(RW*0.62, vC+half);
    prism([[a[0],a[1]],[C(RW*0.62,vC-half)[0],C(RW*0.62,vC-half)[1]],
           [b[0],b[1]],[C(-RW*0.62,vC+half)[0],C(-RW*0.62,vC+half)[1]]],
      wz, zFlat-wz,
      {stroke:INK,lw:0.85,alpha:0.55,fill:P[3],a:0.14,
       pat:DLV>=2?'stipple':null,patFace:1,pa:0.18});
    for(const sg of [-1,1]){                        // culvert mouths
      const c1=C(0, vC+sg*half);
      const arc=[];
      for(let q=0;q<=10;q++){
        const ang=Math.PI*q/10;
        const cc2=C(-Math.cos(ang)*RW*0.34, vC+sg*half);
        arc.push([cc2[0],cc2[1], wz+0.4+Math.sin(ang)*0.9]);
      }
      poly(arc,{stroke:INK,lw:0.7,alpha:0.6});
    }
    bump('CAUSEWAY');
  }
  bump('RUNWAY');

  /* taxiway, parallel, with two connectors */
  const dirIn = (Math.abs(off) > S*0.5) ? -side : side;   // keep the apron on the plate
  const tv=dirIn*S*rr(0.11,0.15);
  const taxi=[];
  for(let k=0;k<=20;k++){
    const v=-L2*0.9+1.8*L2*k/20, c=C(tv,v);
    taxi.push([c[0],c[1],zFlat]);
  }
  for(const sg of [-1,1]){
    const e=[];
    for(let k=0;k<=20;k++){
      const v=-L2*0.9+1.8*L2*k/20, c=C(tv+sg*0.75,v);
      e.push([c[0],c[1],zFlat+0.01]);
    }
    poly(e,{stroke:INK,lw:0.6,alpha:0.45,dt:1});
  }
  for(const end of [-1,1]){
    const a=C(0,end*L2*0.86), b=C(tv,end*L2*0.7);
    seg([a[0],a[1],zFlat],[b[0],b[1],zFlat],{stroke:INK,lw:0.7,alpha:0.5,dt:1});
    bump('TAXIWAY');
  }

  /* apron, terminal and piers */
  const av=tv + dirIn*S*rr(0.12,0.16);
  const tc=C(av,0);
  const tw=L2*0.62, td=2.2;
  const along=TERR.AX?0:1;                    // the terminal runs with the strip
  archPrism(planShape(along?tw:td, along?td:tw,'ROUNDED',0.3).map(q=>[q[0]+tc[0],q[1]+tc[1]]),
    zFlat,rr(3.0,4.2),{stroke:INK,lw:1.0,fill:P[0],a:0.12,fh:1.4});
  const gates=[];
  for(let i=0;i<3;i++){
    const v=(i-1)*tw*0.32;
    const pc=C(av-dirIn*2.6, v);
    prism(planShape(along?1.5:4.4, along?4.4:1.5,'RECT').map(q=>[q[0]+pc[0],q[1]+pc[1]]),
      zFlat,2.4,{stroke:INK,lw:0.85,alpha:0.6,fill:P[0],a:0.1});
    for(const sg of [-1,1]){
      const g=C(av-dirIn*4.6, v+sg*1.6);
      gates.push([g[0],g[1],zFlat]);
      const j=C(av-dirIn*3.4, v+sg*1.6);
      seg([j[0],j[1],zFlat+1.4],[g[0],g[1],zFlat+1.4],{stroke:INK,lw:0.6,alpha:0.5,dt:1});
      bump('GATES');
    }
    bump('PIER');
  }
  /* control tower */
  {
    const cc=C(av + dirIn*1.6, tw*0.42);
    const h=rr(7,10);
    cyl(cc[0],cc[1],zFlat,0.55,h,{seg:12,rings:4,lw:0.6,alpha:0.55});
    prism(planShape(2.4,2.4,'ROUNDED',0.4).map(q=>[q[0]+cc[0],q[1]+cc[1]]),
      zFlat+h,1.5,{stroke:INK,lw:0.95,alpha:0.68,fill:P[2],a:0.24});
    post(cc[0],cc[1],zFlat+h+1.5,rr(1.5,2.6),0.14,{alpha:0.6,dt:2});
    bump('TOWER');
  }
  cfg.fieldZone=(x,y,pad)=>{                 // the whole half belongs to the field
    const u=uOf(x,y);
    return side>0 ? u > S*0.06 : u < -S*0.06;
  };
  PATHS.runway=mkPath(strip,false);
  PATHS.taxi=mkPath(taxi,false);
  PATHS.gates=gates;
  PATHS.rwAx=ax;
  cfg.field='AIRPORT';
}

/* one aircraft movement on the runway */
function movementState(mv,t){
  const P2=PATHS.runway, L=P2.len;
  const ph=(((t+mv.t0)/mv.period)%1+1)%1;
  const d=mv.dir;
  const at=f=>{
    const u=d>0? L*f : L*(1-f);
    return atPath(P2,Math.max(0,Math.min(L,u)));
  };
  const ramp=(x,a,b)=>Math.max(0,Math.min(1,(x-a)/(b-a)));
  let f, z=0, vis=1;
  if(mv.kind==='DEP'){
    if(ph<0.12){ f=0.02; vis=ramp(ph,0.00,0.06); }            // lining up
    else if(ph<0.54){ const q=(ph-0.12)/0.42; f=0.02+0.72*q*q; }
    else { const q=(ph-0.54)/0.46; f=0.74+0.95*q; z=q*q*22;
           vis=1-ramp(q,0.42,0.78); }                          // gone well before the wrap
  }else{
    if(ph<0.40){ const q=ph/0.40; f=-0.72+0.92*q; z=(1-q)*(1-q)*20;
                 vis=ramp(ph,0.00,0.06); }
    else if(ph<0.84){ const q=(ph-0.40)/0.44; f=0.20+0.72*q; }
    else { const q=(ph-0.84)/0.16; f=0.92+0.05*q; vis=1-ramp(q,0.05,0.55); }
  }
  const u0=d>0? L*f : L*(1-f);
  const pos=atPath(P2,Math.max(-L,Math.min(L*2,u0)));
  // extrapolate beyond the ends so the aircraft leaves the field
  let ex=[pos[0],pos[1],pos[2]+z];
  if(u0<0||u0>L){
    const e=u0<0?atPath(P2,0):atPath(P2,L);
    const e2=u0<0?atPath(P2,1.2):atPath(P2,L-1.2);
    const dx=(e[0]-e2[0])/1.2, dy=(e[1]-e2[1])/1.2;
    const over=Math.min(L*0.9, u0<0? -u0 : u0-L);
    ex=[e[0]+dx*over, e[1]+dy*over, e[2]+z];
  }
  const ah=atPath(P2,Math.max(0,Math.min(L,u0+ (d>0?1:-1)*0.8)));
  let hx=ah[0]-ex[0], hy=ah[1]-ex[1];
  if(u0<0||u0>L){ const e=atPath(P2,d>0?L*0.5:L*0.5); }
  const m=Math.hypot(hx,hy)||1;
  if(m<0.001){ hx=1; hy=0; }
  const sgnh = (u0>L||u0<0) ? (d>0?1:-1) : (d>0?1:-1);
  const hd=atPath(P2,Math.max(0,Math.min(L,u0)) + (d>0?0.9:-0.9));
  const base=atPath(P2,Math.max(0,Math.min(L,u0)));
  let gx=hd[0]-base[0], gy=hd[1]-base[1];
  const gm=Math.hypot(gx,gy)||1;
  return {pos:ex, hx:gx/gm, hy:gy/gm, z, vis:Math.max(0,vis), onGround:z<0.4};
}

/* ============================================================
   RAIL — six kinds of railway, each with its own rolling stock
   ============================================================ */
const RAILS=['LOOP','TERMINUS','THROUGH','SHINKANSEN','MONORAIL','STEAM'];
/* the weighted draw: steam is the one worth waiting for, so it comes round often */
const RAIL_ODDS=['LOOP','LOOP','TERMINUS','TERMINUS','THROUGH','THROUGH',
                 'SHINKANSEN','SHINKANSEN','MONORAIL','MONORAIL',
                 'STEAM','STEAM','STEAM','STEAM','STEAM'];

/* two rails, sleepers, and either a girder on piers or a ballasted bed */
function trackway(pts,o={}){
  const n=pts.length, closed=!!o.closed, gauge=o.gauge||0.34;
  const nrm=i=>{
    const a=pts[i], b=pts[(i+1)%n]||pts[i];
    let dx=b[0]-a[0], dy=b[1]-a[1];
    const L2=Math.hypot(dx,dy)||1;
    return [-dy/L2*gauge, dx/L2*gauge];
  };
  for(const sg of [-1,1]){
    const line=[];
    for(let i=0;i<(closed?n+1:n);i++){
      const k=i%n, m=nrm(k===0?(closed?n-1:0):k-1), m2=nrm(k);
      line.push([pts[k][0]+(m[0]+m2[0])/2*sg, pts[k][1]+(m[1]+m2[1])/2*sg, pts[k][2]+0.16]);
    }
    poly(line,{stroke:INK,lw:0.85,alpha:0.72});
  }
  for(let i=0;i<n;i++){
    if(DLV<2 && i%2) continue;
    const m=nrm(i);
    seg([pts[i][0]-m[0]*1.6,pts[i][1]-m[1]*1.6,pts[i][2]+0.04],
        [pts[i][0]+m[0]*1.6,pts[i][1]+m[1]*1.6,pts[i][2]+0.04],
        {stroke:INK,lw:0.5,alpha:0.4,dt:2});
  }
  if(o.elevated){
    const gd=o.girder||0.45;
    const ring2=closed?pts.concat([pts[0]]):pts;
    poly(ring2,{stroke:INK,lw:1.0,alpha:0.6});
    poly(ring2.map(p=>[p[0],p[1],p[2]-gd]),{stroke:INK,lw:0.8,alpha:0.5});
    for(let i=0;i<n;i+=2)
      seg([pts[i][0],pts[i][1],pts[i][2]],[pts[i][0],pts[i][1],pts[i][2]-gd],
        {stroke:INK,lw:0.45,alpha:0.35,dt:2});
    for(let i=0;i<n;i+=(o.pierEvery||3)){
      const p=pts[i], g0=gz(p[0],p[1]);
      post(p[0],p[1],g0,p[2]-gd-g0,o.pierW||0.34,{alpha:0.6,dt:1});
      poly([[p[0]-0.55,p[1],p[2]-gd],[p[0],p[1],p[2]-gd-1.5],[p[0]+0.55,p[1],p[2]-gd]],
        {stroke:INK,lw:0.6,alpha:0.4,dt:2});
      bump('PIERS');
    }
  }else{
    const m0=nrm(0);
    for(let i=0;i<n-1;i++){                       // ballast shoulders
      const m=nrm(i), m2=nrm(i+1);
      quad([[pts[i][0]-m[0]*2.1,pts[i][1]-m[1]*2.1,pts[i][2]-0.14],
            [pts[i+1][0]-m2[0]*2.1,pts[i+1][1]-m2[1]*2.1,pts[i+1][2]-0.14],
            [pts[i+1][0]+m2[0]*2.1,pts[i+1][1]+m2[1]*2.1,pts[i+1][2]-0.14],
            [pts[i][0]+m[0]*2.1,pts[i][1]+m[1]*2.1,pts[i][2]-0.14]],
        {stroke:INK,lw:0.5,alpha:0.35,pat:DLV>=2&&i%4===0?'stipple':null,pa:0.16});
    }
  }
  bump('RAILS',2);
}
/* a tunnel portal where a line meets an embankment */
function portal(p,dirx,diry,w,h,P){
  const nx=-diry, ny=dirx;
  prism([[p[0]-nx*w-dirx*0.4,p[1]-ny*w-diry*0.4],[p[0]+nx*w-dirx*0.4,p[1]+ny*w-diry*0.4],
         [p[0]+nx*w+dirx*0.4,p[1]+ny*w+diry*0.4],[p[0]-nx*w+dirx*0.4,p[1]-ny*w+diry*0.4]],
    p[2]-0.3,h,{stroke:INK,lw:0.95,alpha:0.65,fill:P[3],a:0.18,
      pat:DLV>=2?'grid':null,patFace:1,pa:0.22});
  const arc=[];
  for(let k=0;k<=12;k++){
    const a=Math.PI*k/12;
    arc.push([p[0]-nx*Math.cos(a)*w*0.6-dirx*0.42, p[1]-ny*Math.cos(a)*w*0.6-diry*0.42,
              p[2]+Math.sin(a)*h*0.62]);
  }
  poly(arc,{stroke:INK,lw:0.8,alpha:0.7});
  bump('PORTAL');
}

function buildRail(cfg,S,gl,road,occupied){
  const P=cfg.pal.c;
  const clearOf=(x,y,pad)=> !(cfg.fieldZone && cfg.fieldZone(x,y,pad||1.5));
  const kind = cfg.railSel && cfg.railSel!=='auto' ? cfg.railSel : pick(RAIL_ODDS);
  cfg.rail=kind;
  PATHS.rails=[]; PATHS.railStop=null;
  const base=TERR.riseH*TERR.nSteps;
  const addLine=(pts,o)=>{
    trackway(pts,o);
    PATHS.rails.push({path:mkPath(pts,!!o.closed), kind, closed:!!o.closed,
                      elevated:!!o.elevated, gauge:o.gauge||0.34});
  };

  if(kind==='LOOP'||kind==='MONORAIL'){
    let rwd=S*rr(0.62,0.80), rdp=S*rr(0.58,0.78);
    if(cfg.fieldZone){                       // shrink the ring away from the field
      for(let g2=0; g2<8; g2++){
        let hits=false;
        for(let q=0;q<24;q++){
          const a=q/24*6.2832;
          const px=Math.cos(a)*rwd, py=Math.sin(a)*rdp;
          if(!clearOf(px,py,1.8)){ hits=true; break; }
        }
        if(!hits) break;
        rwd*=0.88; rdp*=0.88;
      }
    }
    const rz=base+(kind==='MONORAIL'?rr(5.0,7.0):rr(4.2,6.2));
    const ring2=roundRect3(rwd,rdp,rz,Math.min(rwd,rdp)*0.35,7);
    if(kind==='MONORAIL'){
      // a single straddle beam, no rails
      const n=ring2.length;
      for(const dz of [0,-0.55]){
        poly(ring2.map(p=>[p[0],p[1],p[2]+dz]).concat([[ring2[0][0],ring2[0][1],ring2[0][2]+dz]]),
          {stroke:INK,lw:1.05,alpha:0.72});
      }
      for(let i=0;i<n;i+=2)
        seg([ring2[i][0],ring2[i][1],ring2[i][2]],[ring2[i][0],ring2[i][1],ring2[i][2]-0.55],
          {stroke:INK,lw:0.5,alpha:0.4,dt:2});
      for(let i=0;i<n;i+=4){
        const p=ring2[i], g0=gz(p[0],p[1]);
        post(p[0],p[1],g0,p[2]-0.6-g0,0.30,{alpha:0.6,dt:1});
        bump('PIERS');
      }
      PATHS.rails.push({path:mkPath(ring2,true),kind,closed:true,elevated:true,gauge:0});
      bump('BEAM');
    }else{
      addLine(ring2,{closed:true,elevated:true,pierEvery:3});
    }
    {
      const P0=PATHS.rails[0].path, su=P0.len*rr(0.05,0.95);
      const sp=atPath(P0,su), ah=atPath(P0,su+0.8);
      let hx=ah[0]-sp[0], hy=ah[1]-sp[1];
      const mm=Math.hypot(hx,hy)||1; hx/=mm; hy/=mm;
      const nx2=-hy, ny2=hx;
      const styl=pick(['CANOPY','CANOPY','OPEN','SINGLE','BOX']);
      const HL=rr(2.6,3.6);
      const side=(styl==='SINGLE') ? (ch(0.5)?1:-1) : 0;
      const HW=(styl==='SINGLE') ? 0.62 : 0.92;
      const rect=(a,b2)=>[sp[0]+hx*a+nx2*(b2+side*0.95), sp[1]+hy*a+ny2*(b2+side*0.95)];
      const dz=sp[2]-0.42;
      prism([rect(-HL,-HW),rect(HL,-HW),rect(HL,HW),rect(-HL,HW)],dz,0.30,
        {stroke:INK,lw:0.9,alpha:0.62,fill:P[3],a:0.16,
         pat:DLV>=2?'rule':null,patFace:1,pa:0.22});
      for(const o of (side?[side>0?-1:1]:[-1,1]))     // edge nosing
        seg([...rect(-HL*0.95,o*HW*0.88),dz+0.32],[...rect(HL*0.95,o*HW*0.88),dz+0.32],
          {stroke:INK,lw:0.6,alpha:0.5,dt:2});
      const cz=dz+0.32;
      if(styl==='CANOPY'){                            // posts and a light roof
        for(let i=0;i<=4;i++){
          const f=-HL*0.82+2*HL*0.82*i/4;
          for(const o of (side?[0]:[-HW*0.8,HW*0.8])) post(...rect(f,o),cz,1.9,0.085,{alpha:0.5,dt:2});
        }
        prism([rect(-HL*0.92,-HW*1.12),rect(HL*0.92,-HW*1.12),
               rect(HL*0.92,HW*1.12),rect(-HL*0.92,HW*1.12)],cz+1.9,0.15,
          {stroke:INK,lw:0.85,alpha:0.6,fill:P[0],a:0.16,
           pat:DLV>=2?'rule':null,patFace:0,pa:0.24});
        bump('CANOPY');
      }else if(styl==='BOX'){                         // a glazed enclosure, like a metro hall
        prism([rect(-HL*0.9,-HW*1.05),rect(HL*0.9,-HW*1.05),
               rect(HL*0.9,HW*1.05),rect(-HL*0.9,HW*1.05)],cz,2.1,
          {stroke:INK,lw:0.95,alpha:0.62,fill:P[2],a:0.20,
           pat:DLV>=2?'grid':null,patFace:1,pa:0.2});
        bump('HALL');
      }else if(styl==='OPEN'){                        // nothing but the deck and a railing
        for(const o of (side?[side>0?1:-1]:[-1,1])){
          const a=rect(-HL*0.95,o*HW*0.95), b2=rect(HL*0.95,o*HW*0.95);
          seg([a[0],a[1],cz],[a[0],a[1],cz+0.6],{stroke:INK,lw:0.5,alpha:0.45});
          seg([b2[0],b2[1],cz],[b2[0],b2[1],cz+0.6],{stroke:INK,lw:0.5,alpha:0.45});
          seg([a[0],a[1],cz+0.6],[b2[0],b2[1],cz+0.6],{stroke:INK,lw:0.55,alpha:0.5});
          for(let i=1;i<6;i++){
            const q=rect(-HL*0.95+2*HL*0.95*i/6,o*HW*0.95);
            seg([q[0],q[1],cz],[q[0],q[1],cz+0.6],{stroke:INK,lw:0.4,alpha:0.32,dt:2});
          }
        }
        bump('RAILING');
      }
      cfg.railStopKind=styl;
      // stair down to the street
      { const a=rect(HL*0.5,HW+0.45), b2=rect(HL*0.5-1.9,HW+0.45);
        const g0=gz(a[0],a[1]);
        seg([a[0],a[1],dz],[a[0],a[1],g0],{stroke:INK,lw:0.7,alpha:0.45});
        seg([b2[0],b2[1],dz],[b2[0],b2[1],g0],{stroke:INK,lw:0.7,alpha:0.45});
        const nst=Math.max(3,Math.round((dz-g0)/0.55));
        for(let k2=0;k2<nst;k2++)
          seg([a[0],a[1],g0+(dz-g0)*k2/nst],[b2[0],b2[1],g0+(dz-g0)*k2/nst],
            {stroke:INK,lw:0.4,alpha:0.26});
        bump('SCALAE');
      }
      // waiting passengers walk the platform
      for(const o of (side?[0]:[-HW*0.45,HW*0.45])){
        const wp=[];
        for(let k2=0;k2<=6;k2++) wp.push([...rect(-HL*0.85+2*HL*0.85*k2/6,o),dz+0.32]);
        PATHS.walk.push(mkPath(wp,false));
      }
      const c0=rect(0,0);
      PATHS.railStop={u:su, x:c0[0], y:c0[1], z:dz+0.32,
                      hx, hy, nx:nx2, ny:ny2, HL, HW, styl};
      bump('STATION'); bump('PLATFORM');
    }
    return;
  }

  if(kind==='TERMINUS'){
    const ax=ch(0.5);
    let sgn=ch(0.5)?1:-1;
    if(cfg.fieldZone && !clearOf(...(ax?[0,sgn*S*0.6]:[sgn*S*0.6,0]),3)) sgn=-sgn;
    const nT=ri(3,5), pitch=1.5;
    // pick a head position whose apron is as level as possible, then cut to it
    let headU=sgn*S*rr(0.30,0.55), zSt=0, bestShare=-1;
    for(const f of [0.30,0.38,0.46,0.54,0.24]){
      const cand=sgn*S*f, tally={};
      for(let k=0;k<=10;k++) for(const vv2 of [-pitch*nT/2,0,pitch*nT/2]){
        const u=cand+(sgn*S*1.0-cand)*(k/10);
        const c=ax?[vv2,u]:[u,vv2];
        const lv=Math.round(terrH(c[0],c[1]));
        tally[lv]=(tally[lv]||0)+1;
      }
      let mode=0,cnt=0,tot=0;
      for(const k in tally){ tot+=tally[k]; if(tally[k]>cnt){ cnt=tally[k]; mode=+k; } }
      const share=cnt/tot;
      if(share>bestShare){ bestShare=share; headU=cand; zSt=TERR.riseH*mode; }
      if(share>0.999) break;
    }
    const throatU=headU+sgn*S*0.75;
    for(let t=0;t<nT;t++){
      const v=(t-(nT-1)/2)*pitch;
      const pts=[];
      for(let k=0;k<=16;k++){
        const f=k/16;
        const u=headU+(sgn*S*1.25-headU)*f;
        // the tracks fan out of a throat, then run parallel
        const conv=Math.max(0,1-Math.abs(u-throatU)/(S*0.5));
        const vv=v*(1-conv*0.72);
        const c=ax?[vv,u]:[u,vv];
        pts.push([c[0],c[1],zSt+0.12]);            // dead level, whatever the ground does
      }
      addLine(pts,{});
      // platform between every second pair of tracks
      if(t%2===0 && t<nT-1){
        const a=ax?[v+pitch*0.5,headU]:[headU,v+pitch*0.5];
        const b=ax?[v+pitch*0.5,headU+sgn*S*0.55]:[headU+sgn*S*0.55,v+pitch*0.5];
        const w=0.9;
        prism([[a[0]-(ax?w:0.0),a[1]-(ax?0:w)],[b[0]-(ax?w:0),b[1]-(ax?0:w)],
               [b[0]+(ax?w:0),b[1]+(ax?0:w)],[a[0]+(ax?w:0),a[1]+(ax?0:w)]],
          zSt,0.35,{stroke:INK,lw:0.7,alpha:0.55,fill:P[3],a:0.14,
            pat:DLV>=2?'rule':null,patFace:1,pa:0.2});
        bump('PLATFORM');
      }
    }
    // train shed over the heads of the tracks
    {
      const w=nT*pitch*0.62, L2=S*0.5;
      const c0=ax?[0,headU+sgn*L2*0.5]:[headU+sgn*L2*0.5,0];
      const hz=zSt;
      const ribs=Math.max(4,Math.round(L2/1.4));
      for(let r2=0;r2<=ribs;r2++){
        const u=headU+sgn*L2*r2/ribs, arc=[];
        for(let k=0;k<=14;k++){
          const a=Math.PI*k/14;
          const vv=-Math.cos(a)*w;
          const c=ax?[vv,u]:[u,vv];
          arc.push([c[0],c[1],hz+0.4+Math.sin(a)*w*0.72]);
        }
        poly(arc,{stroke:INK,lw:(r2===0||r2===ribs)?1.0:0.5,
                  alpha:(r2===0||r2===ribs)?0.7:0.34,dt:r2%2?2:1});
      }
      for(let k=0;k<=14;k+=2){
        const a=Math.PI*k/14, vv=-Math.cos(a)*w, zz=hz+0.4+Math.sin(a)*w*0.72;
        const c1=ax?[vv,headU]:[headU,vv], c2=ax?[vv,headU+sgn*L2]:[headU+sgn*L2,vv];
        seg([c1[0],c1[1],zz],[c2[0],c2[1],zz],{stroke:INK,lw:0.5,alpha:0.4});
      }
      // head-house
      const hc=ax?[0,headU-sgn*1.6]:[headU-sgn*1.6,0];
      archPrism(planShape(ax?w*2.2:3.2, ax?3.2:w*2.2,'RECT').map(q=>[q[0]+hc[0],q[1]+hc[1]]),
        hz,rr(3.5,5.5),{stroke:INK,lw:1.0,fill:P[0],a:0.12,fh:1.2});
      bump('CONCOURSE'); bump('SHED',ribs);
    }
    return;
  }

  // THROUGH / SHINKANSEN / STEAM — a line that crosses the sheet
  {
    const ax=ch(0.5);
    let off=(ch(0.5)?1:-1)*S*rr(0.30,0.72);
    if(cfg.fieldZone){                       // choose a corridor outside the field
      for(const cand of [off,-off,S*0.24,-S*0.24,S*0.46,-S*0.46,S*0.66,-S*0.66]){
        let ok2=true;
        for(let q=0;q<=10;q++){
          const u=-S+2*S*q/10, c=ax?[cand,u]:[u,cand];
          if(!clearOf(c[0],c[1],2.0)){ ok2=false; break; }
        }
        if(ok2){ off=cand; break; }
      }
    }
    const elevated = kind==='SHINKANSEN' ? true : ch(0.35);
    const ez = base + (elevated?rr(4.0,6.5):0);
    const pts=[];
    for(let k=0;k<=40;k++){
      const u=-S*1.22+2.44*S*k/40;
      const wob=Math.sin(u*0.16+off)*(kind==='STEAM'?1.6:0.5);
      const c=ax?[off+wob,u]:[u,off+wob];
      pts.push([c[0],c[1], elevated? ez : gzRamp(c[0],c[1])+0.12]);
    }
    addLine(pts,{elevated,pierEvery:2,gauge:kind==='SHINKANSEN'?0.42:0.34});
    if(!elevated && ch(0.7)){                      // cuttings and a tunnel portal
      for(const idx of [4,36]){
        const p=pts[idx], q=pts[idx+(idx<20?1:-1)];
        let dx=q[0]-p[0], dy=q[1]-p[1];
        const L2=Math.hypot(dx,dy)||1;
        portal(p,dx/L2,dy/L2,1.5,2.6,P);
      }
    }
    // a wayside station
    const si=ri(12,28), sp=pts[si];
    prism(planShape(ax?4.0:2.0, ax?2.0:4.0,'RECT').map(q=>[q[0]+sp[0],q[1]+sp[1]+ (ax?0:1.6)]),
      sp[2]-0.1,0.4,{stroke:INK,lw:0.7,alpha:0.55,fill:P[3],a:0.14});
    prism(planShape(ax?3.0:1.6, ax?1.6:3.0,'RECT').map(q=>[q[0]+sp[0]+(ax?2.4:0),q[1]+sp[1]+(ax?0:2.4)]),
      gz(sp[0],sp[1]),rr(2.2,3.2),{stroke:INK,lw:0.85,alpha:0.6,fill:P[0],a:0.12});
    bump('STATION'); bump('PLATFORM');

    /* --- a turntable and roundhouse for the steam shed --- */
    if(kind==='STEAM' && ch(0.80)){
      let lp=null, nrm2=null, cx=0, cy=0, ok=false;
      for(let tryN=0; tryN<22 && !ok; tryN++){
        const li=ri(6,32);
        lp=pts[Math.min(pts.length-2,li)];
        const q=pts[Math.min(pts.length-1,li+1)]||pts[li-1];
        let dx=q[0]-lp[0], dy=q[1]-lp[1]; const L3=Math.hypot(dx,dy)||1;
        nrm2=[-dy/L3, dx/L3];
        const lat=(tryN%2?-1:1)*rr(5.0,8.5);
        cx=lp[0]+nrm2[0]*lat; cy=lp[1]+nrm2[1]*lat;
        if(Math.abs(cx)>S*0.95||Math.abs(cy)>S*0.95) continue;
        if(occupied(cx,cy,5.0)) continue;
        if(inRiver(cx,cy,3.2)) continue;
        ok=true;
      }
      if(ok){
        const zt=gz(cx,cy), R2=rr(2.2,2.9);
        // the pit
        ring(cx,cy,zt,R2,32,{stroke:INK,lw:1.0,alpha:0.7});
        ring(cx,cy,zt-0.55,R2*0.96,32,{stroke:INK,lw:0.7,alpha:0.5});
        for(let i=0;i<24;i++){
          const a=i/24*6.2832;
          seg([cx+Math.cos(a)*R2,cy+Math.sin(a)*R2,zt],
              [cx+Math.cos(a)*R2*0.96,cy+Math.sin(a)*R2*0.96,zt-0.55],
              {stroke:INK,lw:0.45,alpha:0.35,dt:2});
        }
        // lead track from the running line into the pit
        seg([lp[0],lp[1],lp[2]],[cx-nrm2[0]*R2,cy-nrm2[1]*R2,zt+0.1],
          {stroke:INK,lw:0.8,alpha:0.6});
        // the roundhouse: a fan of stalls
        const nS=ri(5,8), a0=Math.atan2(nrm2[1],nrm2[0]), spread=1.9;
        for(let i=0;i<nS;i++){
          const a=a0-spread/2+spread*i/(nS-1);
          const r0=R2*1.1, r1=R2*rr(2.5,3.1);
          const w2=0.62;
          const ux=Math.cos(a), uy=Math.sin(a), vx=-uy, vy=ux;
          const q=[[cx+ux*r0-vx*w2, cy+uy*r0-vy*w2],[cx+ux*r1-vx*w2*1.25, cy+uy*r1-vy*w2*1.25],
                   [cx+ux*r1+vx*w2*1.25, cy+uy*r1+vy*w2*1.25],[cx+ux*r0+vx*w2, cy+uy*r0+vy*w2]];
          prism(q,zt,rr(2.0,2.6),{stroke:INK,lw:0.8,alpha:0.6,fill:P[3],a:0.12,
            pat:(DLV>=2&&i%2===0)?'grid':null,patFace:2,pa:0.18});
          seg([cx+ux*r0,cy+uy*r0,zt+0.06],[cx+ux*r1,cy+uy*r1,zt+0.06],
            {stroke:INK,lw:0.55,alpha:0.45,dt:1});
          if(DLV>=2){                                  // smoke vent over each stall
            const mx=cx+ux*r1*0.78, my=cy+uy*r1*0.78;
            cyl(mx,my,zt+2.3,0.14,0.5,{seg:8,rings:1,lw:0.45,alpha:0.45});
          }
          bump('STALLS');
        }
        const stalls=[];
        for(let i=0;i<nS;i++) stalls.push(a0-spread/2+spread*i/(nS-1));
        PATHS.turntable={cx,cy,z:zt,r:R2,a0,
          aLead:Math.atan2(lp[1]-cy,lp[0]-cx),
          lead:[lp[0],lp[1],lp[2]], stalls, stallR:R2*2.7};
        bump('TURNTABLE');
      }
    }
  }
}

/* ---- ancient works laid across the city: arches, arcades, aqueducts ---- */
function ancientWorks(cfg,S,gl,road,occupied){
  const P=cfg.pal.c;
  const anti = cfg.theme==='ANTIQUE';
  const ord=pick(['CORINTHIVS','IONICVS','DORICVS']);

  /* --- a triumphal arch straddling a street --- */
  if(ch(anti?0.75:0.24) && gl.length){
    const v=pick(gl), u=rr(-S*0.7,S*0.7);
    const c=XY(u,v);
    if(!occupied(c[0],c[1],3.5) && !inRiver(c[0],c[1],1.2)){
      const z=gzRamp(c[0],c[1]);
      const cw=road*rr(1.5,2.1), ch2=rr(6.5,9.0), dep=rr(1.6,2.4);
      const D=cw*0.12;
      archOrder(c[0],c[1],z,cw,ch2*0.78,dep,TERR.AX?false:true,0,ord,{fill:P[3]});
      for(const sg of [-1,1]){
        const pc=XY(u+sg*cw*0.62, v);
        prism(planShape(D*2.4,D*2.4,'RECT').map(q=>[q[0]+pc[0],q[1]+pc[1]-dep/2-D*0.5]),
          z,ch2*0.14,{stroke:INK,lw:0.7,alpha:0.6,fill:P[3],a:0.16});
        column(pc[0],pc[1]-dep/2-D*0.5,z+ch2*0.14,D,ord,{H:ch2*0.56});
      }
      const ez=z+ch2*0.14+ch2*0.56;
      const a0=XY(u-cw*1.0,v-dep/2-D*1.0);
      entablature(a0[0],a0[1],ez,cw*2.0,dep+D*2.0,D,ord,{fill:P[1],beam:D*2.2});
      const az=ez+D*9.5/5+0.1;
      prism(planShape(cw*1.9,dep+D*1.0,'RECT').map(q=>[q[0]+c[0],q[1]+c[1]]),az,ch2*0.22,
        {stroke:INK,lw:0.95,alpha:0.65,fill:P[3],a:0.16,
         pat:DLV>=2?'stipple':null,patFace:1,pa:0.2});
      for(const sg of [-1,0,1]){
        const pc=XY(u+sg*cw*0.66, v);
        prism(planShape(D*2.0,D*2.0,'RECT').map(q=>[q[0]+pc[0],q[1]+pc[1]]),
          az+ch2*0.22,D*1.2,{stroke:INK,lw:0.7,alpha:0.55,fill:P[3],a:0.14});
        if(DLV>=2) post(pc[0],pc[1],az+ch2*0.22+D*1.2,D*1.8,D*0.5,
          {alpha:0.5,fill:P[0],a:0.2,dt:2});
      }
      bump('TRIVMPHAL');
    }
  }

  /* --- an arcaded portico running along a street --- */
  if(ch(anti?0.8:0.28) && gl.length){
    const v=pick(gl)+ (ch(0.5)?1:-1)*(road/2+1.5);
    const n=ri(7,13), sp=rr(1.5,2.1);
    const u0=rr(-S*0.55,S*0.2);
    const D=sp*0.20, ch2=rr(3.4,4.8);
    let placed=0;
    for(let i=0;i<n;i++){
      const u=u0+i*sp, c=XY(u,v);
      if(Math.abs(u)>S*0.95) break;
      if(occupied(c[0],c[1],2.2)||inRiver(c[0],c[1],0.8)) continue;
      const z=gz(c[0],c[1]);
      archOrder(c[0],c[1],z,sp*0.96,ch2,1.1,TERR.AX?true:false,0,'TVSCANICVS',{fill:P[3]});
      if(DLV>=2){
        const cc=XY(u,v-0.66);
        column(cc[0],cc[1],z,D,ord,{H:ch2*0.88});
      }
      placed++;
    }
    if(placed>1){
      const a=XY(u0-sp*0.5,v-0.9), b=XY(u0+(placed-0.5)*sp,v+0.9);
      const x0=Math.min(a[0],b[0]), y0=Math.min(a[1],b[1]);
      entablature(x0,y0,gz(a[0],a[1])+ch2*1.16,Math.abs(b[0]-a[0])||1.8,
        Math.abs(b[1]-a[1])||1.8,D,ord,{fill:P[1],beam:D*2.4});
      bump('PORTICVS',placed);
    }
  }

  /* --- a great aqueduct striding across the whole site --- */
  if(ch(anti?0.7:0.26)){
    const ax=ch(0.5), off=(ch(0.5)?1:-1)*S*rr(0.42,0.80);
    const span=rr(2.8,3.8), n1=Math.ceil(2.4*S/span);
    const rise=rr(5.0,7.0);
    let topZ=0;
    for(let i=0;i<n1;i++){
      const t=-S*1.18+span*i;
      if(t>S*1.18) break;
      const c=ax?[off,t]:[t,off];
      if(occupied(c[0],c[1],2.6)) continue;
      const z=gz(c[0],c[1]);
      archOrder(c[0],c[1],z,span,rise,1.7,ax,0,'TVSCANICVS',{fill:P[3]});
      const t1=z+rise*1.16;
      // the upper tier of smaller arches
      const m=2, s2=span/m;
      for(let k=0;k<m;k++){
        const tt=t-span/2+s2*(k+0.5);
        const c2=ax?[off,tt]:[tt,off];
        archOrder(c2[0],c2[1],t1,s2,rise*0.42,1.35,ax,0,'TVSCANICVS',{fill:P[3]});
      }
      const t2=t1+rise*0.42*1.16;
      topZ=Math.max(topZ,t2);
      // specus, carried on top
      const a=ax?[off-0.55,t-span/2]:[t-span/2,off-0.55];
      const b=ax?[off+0.55,t+span/2]:[t+span/2,off+0.55];
      prism([[a[0],a[1]],[b[0],a[1]],[b[0],b[1]],[a[0],b[1]]],t2,0.62,
        {stroke:INK,lw:0.75,alpha:0.6,fill:P[2],a:0.18});
      bump('PILAE');
    }
    if(topZ>0) bump('AQVAEDVCTVS');
  }

  /* --- a ruined colonnade left standing in the open --- */
  if(ch(anti?0.6:0.16)){
    const a0=rr(0,6.2832), d=S*rr(0.35,0.7);
    const cx=Math.cos(a0)*d, cy=Math.sin(a0)*d;
    if(!occupied(cx,cy,4)){
      const n=ri(5,9), sp=rr(1.4,2.0), D=rr(0.24,0.36), colH=D*9.5;
      const dir=rr(0,6.2832);
      podiumBlock2(cx-sp*n/2,cy-1.0,gz(cx,cy),sp*n,2.0,0.45,{fill:P[3]});
      for(let i=0;i<n;i++){
        const x=cx-sp*n/2+sp*(i+0.5), y=cy;
        const hh=ch(0.35)? colH*rr(0.2,0.6) : colH;
        column(x,y,gz(cx,cy)+0.45,D,ord,{H:hh});
        if(hh<colH && DLV>=2)
          cyl(x+rr(-1,1),y+rr(-1.2,1.2),gz(cx,cy)+0.45,D*0.5,D*0.9,
            {seg:8,rings:1,lw:0.5,alpha:0.45});
        bump('RVINS');
      }
      if(DLV>=2)
        entablature(cx-sp*n/2,cy-D,gz(cx,cy)+0.45+colH,sp*n*0.55,D*2,D,ord,
          {fill:P[1],beam:D*2.2});
    }
  }
}

/* ---- an antique quarter for the city fabric ---- */
function classicalBlock(bx,by,half,base0,P){
  const roll=R();
  const D=rr(0.20,0.30), colH=D*9;
  if(roll<0.34){                                    // colonnaded courtyard house
    const w=half*1.7, d=half*1.5;
    for(const [ox,oy,ow,od] of [[bx-w/2,by-d/2,w,d*0.3],[bx-w/2,by+d/2-d*0.3,w,d*0.3],
                                [bx-w/2,by-d/2,w*0.3,d],[bx+w/2-w*0.3,by-d/2,w*0.3,d]]){
      if(R()<0.14) continue;
      prism(planShape(ow,od,'RECT').map(p=>[p[0]+ox+ow/2,p[1]+oy+od/2]),base0,rr(1.6,2.3),
        {stroke:INK,lw:0.8,alpha:0.55,fill:null,pat:DLV>=2&&ch(0.3)?'grid':null,patFace:1,pa:0.18});
      bump('DOMVS');
    }
    const gw=w*0.4, gd=d*0.4;
    quad([[bx-gw,by-gd,base0+0.03],[bx+gw,by-gd,base0+0.03],
          [bx+gw,by+gd,base0+0.03],[bx-gw,by+gd,base0+0.03]],
      {stroke:INK,lw:0.6,alpha:0.5,pat:DLV>=2?'dots':null,pa:0.16});
    for(let i=0;i<=4;i++){
      column(bx-gw+2*gw*i/4,by-gd,base0,D,'DORICVS',{H:colH});
      column(bx-gw+2*gw*i/4,by+gd,base0,D,'DORICVS',{H:colH});
    }
    bump('PERISTYLE'); return;
  }
  if(roll<0.58){                                    // a small distyle shrine
    const w=half*0.9, d=half*1.2, ph=rr(0.6,1.0);
    podiumBlock2(bx-w/2,by-d/2,base0,w,d,ph,{fill:P[3]});
    stepFlight(bx-w*0.34,by-d/2,base0+ph,w*0.68,ph*1.4,ph,4);
    for(let i=0;i<4;i++){
      const x=bx-w/2+D+ (w-D*2)*i/3;
      column(x,by-d/2+D,base0+ph,D,'IONICVS',{H:colH});
    }
    prism(planShape(w*0.6,d*0.6,'RECT').map(p=>[p[0]+bx,p[1]+by+d*0.12]),base0+ph,colH*0.9,
      {stroke:INK,lw:0.8,alpha:0.6,fill:P[0],a:0.1});
    const ez=base0+ph+colH;
    entablature(bx-w/2,by-d/2,ez,w,d,D,'IONICVS',{fill:P[1],beam:D*2.2});
    const eh=D*9/5;
    const rise=pediment(bx-w/2,by-d/2,ez+eh,w,d,D,'IONICVS',{fill:P[1],kind:'TRIANGVLARE'});
    tileRoof(bx-w/2,by-d/2,ez+eh,w,d,rise,{fill:P[0],a:0.12});
    bump('SHRINE'); return;
  }
  if(roll<0.78){                                    // an arcaded street front
    const n=ri(3,5), sp=half*1.7/n;
    for(let i=0;i<n;i++)
      archOrder(bx-half*0.85+sp*(i+0.5),by-half*0.5,base0,sp*0.92,rr(2.2,3.0),0.8,false,0,
        'TVSCANICVS',{fill:P[3]});
    prism(planShape(half*1.7,half*0.9,'RECT').map(p=>[p[0]+bx,p[1]+by+half*0.1]),base0,rr(2.6,3.6),
      {stroke:INK,lw:0.8,alpha:0.55,fill:null,pat:DLV>=2?'grid':null,patFace:1,pa:0.18});
    bump('ARCADE',n); return;
  }
  // a ruined colonnade standing in an open lot
  {
    const n=ri(4,8);
    for(let i=0;i<n;i++){
      const x=bx-half*0.8+half*1.6*i/(n-1), y=by+rr(-half*0.3,half*0.3);
      const hh=colH*(ch(0.4)?rr(0.2,0.6):1);
      column(x,y,base0,D,pick(['DORICVS','IONICVS','CORINTHIVS']),{H:hh});
      bump('RVINS');
    }
    for(let i=0;i<ri(2,5);i++){                     // fallen drums
      const x=bx+rr(-half,half), y=by+rr(-half,half);
      cyl(x,y,base0,D*0.5,D*0.9,{seg:8,rings:1,lw:0.5,alpha:0.45});
    }
  }
}

let PATHS={roads:[],rail:null,air:[],metro:[],drone:[],walk:[]};

function dist3(a,b){ return Math.hypot(b[0]-a[0],b[1]-a[1],b[2]-a[2]); }
function mkPath(pts,closed){
  const P={pts,closed:!!closed,cum:[0],len:0};
  for(let i=1;i<pts.length;i++){ P.len+=dist3(pts[i-1],pts[i]); P.cum.push(P.len); }
  if(closed){ P.len+=dist3(pts[pts.length-1],pts[0]); P.cum.push(P.len); }
  return P;
}
function atPath(P,s){
  if(!P||P.len<=0) return [0,0,0];
  s=((s%P.len)+P.len)%P.len;
  let i=1; while(i<P.cum.length && P.cum[i]<s) i++;
  const a=P.pts[(i-1)%P.pts.length], b=P.pts[i%P.pts.length];
  const d=Math.max(1e-6,P.cum[i]-P.cum[i-1]), t=(s-P.cum[i-1])/d;
  return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];
}
function roundRect3(hw,hd,z,r,n){
  const pts=[], corners=[[hw-r,hd-r,1,1],[-hw+r,hd-r,-1,1],[-hw+r,-hd+r,-1,-1],[hw-r,-hd+r,1,-1]];
  const a0=[0,Math.PI/2,Math.PI,-Math.PI/2];
  for(let c=0;c<4;c++){
    const [cx,cy,sx,sy]=corners[c];
    const base=[0,Math.PI/2,Math.PI,Math.PI*1.5][c];
    for(let i=0;i<=n;i++){
      const a=base+i/n*Math.PI/2;
      pts.push([cx*1+Math.cos(a)*r*0+ (cx) + Math.cos(a)*r*0, 0,0]);
    }
  }
  // simple sampled rounded rectangle
  pts.length=0;
  const seq=[[hw-r,hd-r,0],[-(hw-r),hd-r,Math.PI/2],[-(hw-r),-(hd-r),Math.PI],[hw-r,-(hd-r),Math.PI*1.5]];
  for(const [cx,cy,a0b] of seq){
    for(let i=0;i<=n;i++){
      const a=a0b+i/n*Math.PI/2;
      pts.push([cx+Math.cos(a)*r, cy+Math.sin(a)*r, z]);
    }
  }
  return pts;
}


/* ============================================================
   VEGETATION — silhouettes baked at build time, so they never
   shimmer while the view turns, and scaled from world height
   ============================================================ */
function makeTreeShape(){
  const kind=pick(['BROAD','BROAD','BROAD','CONIFER','CONIFER','COLUMNAR','BARE']);
  const sh={kind, lean:rr(-0.12,0.12), trunk:rr(0.30,0.46), tw:rr(0.030,0.055)};
  if(kind==='BROAD'){
    sh.lobes=[];
    const n=ri(3,6);
    for(let i=0;i<n;i++){
      const a=rr(0,6.2832), d=rr(0,0.19);
      const lobe={x:Math.cos(a)*d, y:-0.62+Math.sin(a)*d*0.55, r:rr(0.13,0.25), rad:[]};
      const m=12;
      for(let k=0;k<m;k++) lobe.rad.push(rr(0.74,1.22));
      sh.lobes.push(lobe);
    }
    sh.branch=[];
    for(let i=0;i<ri(2,4);i++)
      sh.branch.push({a:rr(-1.1,1.1), l:rr(0.16,0.30), b:rr(-0.5,0.5)});
  }else if(kind==='CONIFER'){
    sh.tiers=[]; const n=ri(6,10);
    for(let i=0;i<n;i++){
      const t=i/(n-1);
      sh.tiers.push({w:(0.30-0.26*t)*rr(0.78,1.2), y:-0.26-0.72*t, drop:rr(0.02,0.07),
                     l:rr(0.85,1.15), r:rr(0.85,1.15)});
    }
  }else if(kind==='COLUMNAR'){
    sh.rad=[]; const m=16;
    for(let k=0;k<m;k++) sh.rad.push(rr(0.72,1.2));
    sh.w=rr(0.10,0.17);
  }else{
    sh.limbs=[];
    const grow=(x,y,a,len,depth)=>{
      if(depth>3) return;
      const x2=x+Math.cos(a)*len, y2=y+Math.sin(a)*len;
      sh.limbs.push([x,y,x2,y2,depth]);
      const n=ri(2,3);
      for(let i=0;i<n;i++) grow(x2,y2,a+rr(-0.7,0.7),len*rr(0.55,0.78),depth+1);
    };
    grow(0,-0.34,-Math.PI/2+rr(-0.15,0.15),0.28,0);
  }
  return sh;
}
function drawTreeShape(sx,sy,hh,sh){
  const X=v=>sx+v*hh, Y=v=>sy+v*hh;
  ctx.save(); ctx.lineJoin='round'; ctx.lineCap='round';
  const lean=sh.lean;
  if(sh.kind!=='BARE'){                                   // tapered trunk
    ctx.globalAlpha=0.72; ctx.strokeStyle=INK; ctx.lineWidth=Math.max(0.5,hh*sh.tw);
    ctx.beginPath();
    ctx.moveTo(X(0),Y(0));
    ctx.quadraticCurveTo(X(lean*0.3),Y(-sh.trunk*0.6),X(lean),Y(-sh.trunk));
    ctx.stroke();
    ctx.lineWidth=Math.max(0.4,hh*sh.tw*0.5); ctx.globalAlpha=0.45;
    ctx.beginPath();                                      // root flare
    ctx.moveTo(X(-sh.tw*1.6),Y(0)); ctx.lineTo(X(0),Y(-sh.trunk*0.14));
    ctx.lineTo(X(sh.tw*1.6),Y(0)); ctx.stroke();
  }
  if(sh.kind==='BROAD'){
    ctx.globalAlpha=0.4; ctx.lineWidth=Math.max(0.35,hh*0.014);
    for(const b of sh.branch){
      ctx.beginPath();
      ctx.moveTo(X(lean),Y(-sh.trunk));
      ctx.quadraticCurveTo(X(lean+Math.cos(b.a)*b.l*0.5),Y(-sh.trunk-b.l*0.4),
                           X(lean+Math.cos(b.a)*b.l),Y(-sh.trunk-Math.abs(Math.sin(b.a))*b.l*0.6-b.l*0.2));
      ctx.stroke();
    }
    for(const lo of sh.lobes){
      ctx.beginPath();
      const m=lo.rad.length;
      for(let k=0;k<=m;k++){
        const a=k/m*6.2832, rr2=lo.r*lo.rad[k%m];
        const px=X(lean+lo.x+Math.cos(a)*rr2), py=Y(lo.y+Math.sin(a)*rr2*0.86);
        k?ctx.lineTo(px,py):ctx.moveTo(px,py);
      }
      ctx.closePath();
      ctx.globalAlpha=0.055; ctx.fillStyle=INK; ctx.fill();
      ctx.globalAlpha=0.5; ctx.strokeStyle=INK; ctx.lineWidth=Math.max(0.4,hh*0.012);
      ctx.stroke();
    }
  }else if(sh.kind==='CONIFER'){
    ctx.globalAlpha=0.5; ctx.strokeStyle=INK; ctx.lineWidth=Math.max(0.4,hh*0.013);
    ctx.beginPath();
    ctx.moveTo(X(lean),Y(-1.02));
    for(let i=sh.tiers.length-1;i>=0;i--){                // down the left side
      const t=sh.tiers[i];
      ctx.lineTo(X(lean-t.w*t.l),Y(t.y));
      ctx.lineTo(X(lean-t.w*t.l*0.45),Y(t.y+t.drop));
    }
    ctx.lineTo(X(lean),Y(-sh.trunk*0.7));
    for(let i=0;i<sh.tiers.length;i++){                   // up the right side
      const t=sh.tiers[i];
      ctx.lineTo(X(lean+t.w*t.r*0.45),Y(t.y+t.drop));
      ctx.lineTo(X(lean+t.w*t.r),Y(t.y));
    }
    ctx.closePath();
    ctx.globalAlpha=0.05; ctx.fillStyle=INK; ctx.fill();
    ctx.globalAlpha=0.55; ctx.stroke();
  }else if(sh.kind==='COLUMNAR'){
    ctx.beginPath();
    const m=sh.rad.length;
    for(let k=0;k<=m;k++){
      const t=k/m*6.2832;
      const px=X(lean+Math.cos(t)*sh.w*sh.rad[k%m]);
      const py=Y(-0.62+Math.sin(t)*0.40*sh.rad[k%m]);
      k?ctx.lineTo(px,py):ctx.moveTo(px,py);
    }
    ctx.closePath();
    ctx.globalAlpha=0.055; ctx.fillStyle=INK; ctx.fill();
    ctx.globalAlpha=0.52; ctx.strokeStyle=INK; ctx.lineWidth=Math.max(0.4,hh*0.012);
    ctx.stroke();
  }else{
    ctx.globalAlpha=0.55; ctx.strokeStyle=INK;
    for(const [x1,y1,x2,y2,d] of sh.limbs){
      ctx.lineWidth=Math.max(0.35,hh*0.026/(d+1));
      ctx.beginPath(); ctx.moveTo(X(x1),Y(y1)); ctx.lineTo(X(x2),Y(y2)); ctx.stroke();
    }
  }
  ctx.restore(); ctx.globalAlpha=1;
}
/* place a tree in the world; its size comes from a real height */
function plantTree(x,y,z,o={}){
  const sh=makeTreeShape();
  const th=(o.h!==undefined?o.h:rr(0.85,1.7));
  sprite([x,y,z],(sx,sy)=>{
    const p1=pr(x,y,z+th);
    const hh=sy-p1[1];
    if(hh<3){ ctx.globalAlpha=0.5; ctx.fillStyle=INK;
      ctx.fillRect(sx-1,sy-Math.max(2,hh),2,Math.max(2,hh)); ctx.globalAlpha=1; return; }
    drawTreeShape(sx,sy,hh,sh);
  },{dt:0});
  bump('TREES');
}

/* ============================================================
   INDUSTRY — sheds, tank farms, container yards, gantries
   ============================================================ */
function shedRoof(x,y,w,d,z,rise,teeth,P){
  const t=Math.max(2,teeth||Math.round(w/1.6));
  for(let i=0;i<t;i++){
    const x0=x+w*i/t, x1=x+w*(i+1)/t;
    quad([[x0,y,z],[x1,y,z+rise],[x1,y+d,z+rise],[x0,y+d,z]],
      {stroke:INK,lw:0.7,alpha:0.6,fill:P[0],a:0.14});
    quad([[x1,y,z+rise],[x1,y,z],[x1,y+d,z],[x1,y+d,z+rise]],
      {stroke:INK,lw:0.6,alpha:0.55,fill:P[2],a:0.3,pat:DLV>=2?'grid':null,pa:0.3});
    bump('SAWTOOTH');
  }
  poly([[x,y,z],[x+w,y,z]],{stroke:INK,lw:0.8,alpha:0.6});
}
function industrialBlock(bx,by,half,base0,P){
  const roll=R();
  if(roll<0.26){                                   // shed with north lights
    const w=half*1.8, d=half*1.5, h=rr(2.0,3.2);
    prism(planShape(w,d,'RECT').map(p=>[p[0]+bx,p[1]+by]),base0,h,
      {stroke:INK,lw:0.85,alpha:0.6,fill:null,pat:DLV>=2?'rule':null,patFace:1,pa:0.2});
    shedRoof(bx-w/2,by-d/2,w,d,base0+h,rr(0.6,1.0),0,P);
    if(DLV>=2) for(let i=0;i<ri(1,3);i++){          // roof extract fans
      const fx=bx+rr(-w*0.3,w*0.3), fy=by+rr(-d*0.3,d*0.3);
      cyl(fx,fy,base0+h+0.9,0.24,0.4,{seg:8,rings:1,lw:0.5,alpha:0.5});
    }
    bump('SHEDS'); return;
  }
  if(roll<0.46){                                   // container yard
    const nx=ri(3,5), ny=ri(2,4);
    for(let i=0;i<nx;i++) for(let j=0;j<ny;j++){
      const st=ri(1,3);
      for(let k=0;k<st;k++){
        const cw=half*2/nx*0.82, cd=half*2/ny*0.5, chh=0.55;
        box(bx-half+ (i+0.1)*half*2/nx, by-half+ (j+0.25)*half*2/ny, base0+k*chh,
            cw,cd,chh,
            {stroke:INK,lw:0.6,alpha:0.6,fill:pick(P),a:0.34,hidden:false,
             pat:(DLV>=2&&ch(0.3))?'rule':null,patFace:1,pa:0.3});
        bump('CONTAINERS');
      }
    }
    return;
  }
  if(roll<0.66){                                   // tank farm
    const n=ri(2,4);
    for(let i=0;i<n;i++){
      const a=i/n*6.2832+0.4, r2=rr(0.9,1.5), hh=rr(1.6,3.2);
      const tx=bx+Math.cos(a)*half*0.5, ty=by+Math.sin(a)*half*0.5;
      cyl(tx,ty,base0,r2,hh,{seg:14,rings:3,lw:0.65,alpha:0.55});
      ring(tx,ty,base0+hh+0.12,r2*0.9,16,{stroke:INK,lw:0.6,alpha:0.5});
      if(DLV>=2){                                   // spiral stair
        const sp=[];
        for(let k=0;k<=18;k++){ const t=k/18;
          sp.push([tx+Math.cos(t*6.2832)*r2*1.08, ty+Math.sin(t*6.2832)*r2*1.08, base0+hh*t]); }
        poly(sp,{stroke:INK,lw:0.45,alpha:0.42,dt:2});
      }
      // bund wall
      ring(tx,ty,base0+0.02,r2*1.6,20,{stroke:INK,lw:0.5,alpha:0.35,dt:2});
      bump('TANKS');
    }
    return;
  }
  if(roll<0.82){                                   // pipe rack and manifold
    const L2=half*1.8, hh=rr(1.6,2.4);
    for(let i=0;i<=5;i++){
      const x=bx-L2/2+L2*i/5;
      post(x,by-0.5,base0,hh,0.16,{alpha:0.55,dt:1});
      post(x,by+0.5,base0,hh,0.16,{alpha:0.55,dt:1});
      seg([x,by-0.5,base0+hh],[x,by+0.5,base0+hh],{stroke:INK,lw:0.6,alpha:0.5});
    }
    for(const o of [-0.34,0,0.34]) for(const zz of [hh*0.62,hh*0.92]){
      seg([bx-L2/2,by+o,base0+zz],[bx+L2/2,by+o,base0+zz],
        {stroke:INK,lw:0.6,alpha:0.55,dt:1});
      bump('PIPES');
    }
    if(DLV>=2) for(let i=0;i<ri(1,3);i++){          // riser and elbow
      const x=bx+rr(-L2*0.4,L2*0.4);
      seg([x,by,base0+hh*0.92],[x,by,base0+hh*1.7],{stroke:INK,lw:0.6,alpha:0.5});
      seg([x,by,base0+hh*1.7],[x+0.8,by,base0+hh*1.7],{stroke:INK,lw:0.6,alpha:0.5});
    }
    bump('RACKS'); return;
  }
  // chimney with banding
  {
    const r2=rr(0.5,0.85), hh=rr(6,11);
