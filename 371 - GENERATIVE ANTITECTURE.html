
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111110">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>GENERATIVE ANTITECTURE — ISOMETRIC STRATA</title>
<style>
  :root{
    --shell:#111110; --panel:#1b1a18; --line:#332f2b;
    --fg:#e2ded6; --dim:#807a70; --hot:#c9c3b8; --hotink:#15140f;
    --bar:64px; --safe:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--shell);color:var(--fg);
    font:400 11px/1.4 "Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;
    overscroll-behavior:none}
  #top{position:fixed;top:0;left:0;right:0;height:52px;z-index:6;display:flex;
    align-items:center;justify-content:space-between;gap:12px;padding:0 14px;
    padding-top:env(safe-area-inset-top,0px);height:calc(52px + env(safe-area-inset-top,0px));
    background:rgba(17,17,16,.94);border-bottom:1px solid var(--line)}
  .ttl b{display:block;font-weight:500;letter-spacing:.2em;font-size:11px}
  .ttl span{display:block;letter-spacing:.18em;font-size:8.5px;color:var(--dim);margin-top:3px}
  #meta{letter-spacing:.14em;font-size:8.5px;color:var(--dim);text-align:right;
    max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  #stage{position:fixed;top:calc(52px + env(safe-area-inset-top,0px));left:0;right:0;
    bottom:calc(var(--bar) + var(--safe));overflow:auto;-webkit-overflow-scrolling:touch;
    display:flex;align-items:flex-start;justify-content:center;padding:8px;
    background:#0b0b0a;touch-action:none;cursor:grab}
  #stage.dragging{cursor:grabbing}
  canvas{display:block;flex:0 0 auto;box-shadow:0 10px 40px rgba(0,0,0,.65)}

  #busy{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;
    background:rgba(11,11,10,.72);letter-spacing:.3em;font-size:10px;color:var(--fg)}

  #bottom{position:fixed;left:0;right:0;bottom:0;z-index:7;height:calc(var(--bar) + var(--safe));
    padding:0 10px var(--safe);display:flex;align-items:center;gap:8px;
    background:rgba(17,17,16,.96);border-top:1px solid var(--line)}
  #bottom button{flex:1;height:44px;min-width:0;background:transparent;color:var(--fg);
    border:1px solid var(--line);border-radius:3px;letter-spacing:.16em;font-size:9.5px;
    cursor:pointer;padding:0 4px}
  #bottom button.pri{flex:1.5;background:var(--hot);border-color:var(--hot);color:var(--hotink);font-weight:500}
  #bottom button.act{border-color:var(--fg)}
  #bottom button:active{opacity:.7}

  #sheetbg{position:fixed;inset:0;z-index:7;background:rgba(0,0,0,.5);opacity:0;
    pointer-events:none;transition:opacity .2s}
  #sheet{position:fixed;left:0;right:0;bottom:0;z-index:8;
    transform:translateY(110%);transition:transform .26s cubic-bezier(.22,.9,.3,1);
    background:var(--panel);border-top:1px solid var(--line);
    padding:16px 14px calc(16px + var(--bar) + var(--safe));border-radius:10px 10px 0 0}
  #sheet.on{transform:translateY(0)}
  #sheetbg.on{opacity:1;pointer-events:auto}
  .grip{width:36px;height:3px;border-radius:2px;background:#3d3934;margin:0 auto 14px}
  .row{display:flex;gap:10px;margin-bottom:12px}
  .fld{flex:1;min-width:0}
  .fld label{display:block;letter-spacing:.18em;font-size:8.5px;color:var(--dim);margin-bottom:6px}
  select,input{width:100%;height:44px;background:#141312;color:var(--fg);
    border:1px solid var(--line);border-radius:3px;padding:0 10px;
    font:400 11px/1 "Helvetica Neue",Arial,sans-serif;letter-spacing:.1em;
    appearance:none;-webkit-appearance:none;outline:none}
  select{background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),
    linear-gradient(135deg,var(--dim) 50%,transparent 50%);
    background-position:calc(100% - 16px) 20px,calc(100% - 11px) 20px;
    background-size:5px 5px,5px 5px;background-repeat:no-repeat}
  select:focus,input:focus{border-color:var(--hot)}
  .sbtn{height:44px;padding:0 16px;background:transparent;color:var(--fg);
    border:1px solid var(--line);border-radius:3px;letter-spacing:.16em;font-size:9.5px;cursor:pointer}
  .sbtn.pri{background:var(--hot);border-color:var(--hot);color:var(--hotink)}
  .hint{letter-spacing:.14em;font-size:8.5px;color:#5d5850;margin-top:2px}

  @media (min-width:821px){
    #stage{padding:18px}
    #bottom{justify-content:center;gap:10px}
    #bottom button{flex:0 0 auto;min-width:120px}
    #bottom button.pri{flex:0 0 auto;min-width:150px}
    #sheet{left:50%;right:auto;transform:translate(-50%,110%);width:720px;
      border-radius:10px 10px 0 0}
    #sheet.on{transform:translate(-50%,0)}
  }
  @media (prefers-reduced-motion:reduce){ #sheet,#sheetbg{transition:none} }
</style>

<body>

<div id="stage"><canvas id="cv"></canvas></div>

<div id="sheetbg"></div>
<div id="sheet">
  <div class="grip"></div>
  <div class="row">
    <div class="fld"><label>MODE</label>
      <select id="mode">
        <option value="auto">AUTO</option>
        <option value="prairie">PRAIRIE</option><option value="shell">THIN SHELL</option>

<script>


"use strict";
/* ============================================================
   GENERATIVE ANTITECTURE — single file, vanilla JS, Canvas 2D
   Isometric technical drawing generator
   ============================================================ */

const W = 1600, H = 2263;                 // sheet (≈ ISO ratio, portrait)
const cv = document.getElementById('cv');
let ctx = cv.getContext('2d');
let RS = 1;                                // render scale (device-adaptive)
function setRes(s){
  RS = s; cv.width = Math.round(W*s); cv.height = Math.round(H*s);
}
const A4RS = 2480/1600;                   // 2480 x 3508 px = A4 at 300 dpi
setRes(1);

/* ---------- deterministic RNG ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let R = mulberry32(1), RR = mulberry32(2);
const rr=(a,b)=>a+(b-a)*R();
const ri=(a,b)=>Math.floor(a+(b-a+1)*R());
const pick=a=>a[Math.floor(R()*a.length)];
const ch=p=>R()<p;
const jr=(a)=>(RR()-0.5)*a;

/* ---------- ink & paper ---------- */
const INK_DAY='#1a1a1c', INK_NIGHT='#e6e3dc';
const PAPER_DAY='#eae8e4', PAPER_NIGHT='#141416';
let INK = INK_DAY;
let NIGHT = false;
let PAPER = {base:PAPER_DAY, grain:0.055};
function inkRGBA(a){
  const h=INK.replace('#','');
  const r=parseInt(h.slice(0,2),16), g=parseInt(h.slice(2,4),16), b=parseInt(h.slice(4,6),16);
  return `rgba(${r},${g},${b},${a})`;
}
function setSky(night){
  if(night===NIGHT) return;
  NIGHT=night;
  INK = night?INK_NIGHT:INK_DAY;
  PAPER.base = night?PAPER_NIGHT:PAPER_DAY;
  for(const k in toneCache) delete toneCache[k];
  for(const k in grainCache) delete grainCache[k];
  bgKey=''; fgKey='';
}

/* ---------- palettes ---------- */
const PALETTES = [
  {name:'RDS ORANGE', c:['#FF4300','#1a1a1c','#8d8b86','#c9c6c0'], wash:0.30},
  {name:'SIGNAL',     c:['#FF4300','#4a4a4d','#b7b4ae','#242427'], wash:0.26},
  {name:'CHEROKEE AUTUMN', c:['#c0563f','#8b9a63','#c99433','#8d6144'], wash:0.30},
  {name:'MONOCHROME',      c:['#6d6c68','#575652','#7d7c78','#484742'], wash:0.10},
  {name:'CLIMATRON ALUM',  c:['#7d95a4','#c88a3d','#93a79d','#9aab86'], wash:0.20},
  {name:'TRENCADIS',       c:['#cf5049','#dfa634','#4ca39d','#4d7cbb'], wash:0.34},
  {name:'GRAPHITE',        c:['#4f4d49','#6e6b66','#8d8983','#3a3835'], wash:0.22},
  {name:'OXIDE',           c:['#8c4a34','#b98a55','#6b6f63','#3f4a52'], wash:0.26},
  {name:'BLUEPRINT',       c:['#3c5a78','#6d88a3','#9fb2c2','#2b3b4d'], wash:0.24}
];

/* ---------- free axonometric camera ----------
   AZ/EL define an orthographic view; AA normalises it so that the default
   AZ 45° / EL 35.26° reproduces the classic 30° drafting isometric exactly. */
const AA = Math.sqrt(3/2);                       // 1.22474
const DEF_AZ = Math.PI/4, DEF_EL = Math.asin(1/Math.sqrt(3));
let AZ = DEF_AZ, EL = DEF_EL;
let SA = Math.sin(AZ), CA = Math.cos(AZ), SE = Math.sin(EL), CE = Math.cos(EL);
function setView(az, el){
  AZ = az; EL = Math.max(0.06, Math.min(1.505, el));
  SA = Math.sin(AZ); CA = Math.cos(AZ); SE = Math.sin(EL); CE = Math.cos(EL);
}
let U = 26, CX = W/2, CY = H*0.545;
const pr = (x,y,z)=>[
  CX + (x*SA - y*CA) * AA * U,
  CY + ((x*CA + y*SA) * SE - z*CE) * AA * U
];
const dep = p => p[0]*CA*CE + p[1]*SA*CE + p[2]*SE;   // distance along view axis

/* ---------- scene buffer ---------- */
let items = [];
let LWK=1, ALK=1, KEEP=0;
function push(o){
  if(LWK!==1){ o.lw=(o.lw||1)*LWK; if(o.alpha!==undefined) o.alpha=Math.min(1,o.alpha*ALK); }
  if(KEEP){ o.keep=1; o.dt=0; }
  items.push(o);
}
function tp(p){
  const c=Math.cos(T.rot), s=Math.sin(T.rot);
  const X=p[0]*T.s, Y=p[1]*T.s;
  return [T.x+X*c-Y*s, T.y+X*s+Y*c, p[2]*T.z+T.zo];
}
function quad(p,o={}){ push({k:'q',p:p.map(tp),d:0,...o}); }
function poly(p,o={}){ push({k:'p',p:p.map(tp),d:0,...o}); }
function seg(a,b,o={}){ push({k:'p',p:[tp(a),tp(b)],d:0,...o}); }
function sprite(pt,fn,o={}){ push({k:'s',p:[tp(pt)],d:0,fn,...o}); }
function resortByView(){
  for(const it of items){ let d=0; for(const v of it.p) d+=dep(v); it.d = d/it.p.length; }
  items.sort((a,b)=>a.d-b.d);
}

/* box → 3 visible faces + wire */
function box(x,y,z,w,dd,h,o={}){
  const X=x+w, Y=y+dd, Z=z+h;
  const top=[[x,y,Z],[X,y,Z],[X,Y,Z],[x,Y,Z]];
  const fx =[[X,y,z],[X,Y,z],[X,Y,Z],[X,y,Z]];
  const fy =[[x,Y,z],[X,Y,z],[X,Y,Z],[x,Y,Z]];
  quad(top,{...o,sh:1.00});
  quad(fx ,{...o,sh:0.80});
  quad(fy ,{...o,sh:0.62});
  if(o.hidden!==false){
    poly([[x,y,z],[X,y,z]],{stroke:o.stroke,lw:(o.lw||1)*0.7,alpha:0.28});
    poly([[x,y,z],[x,Y,z]],{stroke:o.stroke,lw:(o.lw||1)*0.7,alpha:0.28});
    poly([[x,y,z],[x,y,Z]],{stroke:o.stroke,lw:(o.lw||1)*0.7,alpha:0.28});
  }
}

/* ============================================================
   RENDERING PRIMITIVES
   ============================================================ */
const toneCache={};
function tone(kind){
  if(toneCache[kind]) return toneCache[kind];
  const c=document.createElement('canvas'); c.width=c.height=24;
  const g=c.getContext('2d');
  g.strokeStyle=inkRGBA(0.85); g.fillStyle=inkRGBA(0.85); g.lineWidth=0.7;
  const q=mulberry32(kind.length*7717+kind.charCodeAt(0));
  if(kind==='dots'){
    for(let x=2;x<24;x+=6) for(let y=2;y<24;y+=6){
      g.beginPath(); g.arc(x,y,0.95,0,6.2832); g.fill(); }
  }else if(kind==='grid'){
    for(let i=0;i<24;i+=4){ g.globalAlpha=(i%12===0)?0.9:0.45;
      g.beginPath(); g.moveTo(i,0); g.lineTo(i,24); g.moveTo(0,i); g.lineTo(24,i); g.stroke(); }
  }else if(kind==='hatch'){
    for(let i=-24;i<24;i+=5){ g.beginPath(); g.moveTo(i,0); g.lineTo(i+24,24); g.stroke(); }
  }else if(kind==='cross'){
    for(let i=-24;i<24;i+=6){
      g.beginPath(); g.moveTo(i,0); g.lineTo(i+24,24);
      g.moveTo(i,24); g.lineTo(i+24,0); g.stroke(); }
  }else if(kind==='stipple'){
    for(let i=0;i<70;i++){ g.globalAlpha=0.3+q()*0.55;
      g.beginPath(); g.arc(q()*24,q()*24,0.5+q()*0.7,0,6.2832); g.fill(); }
  }else{
    for(let y=1.5;y<24;y+=3){ g.beginPath(); g.moveTo(0,y); g.lineTo(24,y); g.stroke(); }
  }
  const pt=g.createPattern(c,'repeat');
  toneCache[kind]=pt; return pt;
}
const TONES=['dots','grid','hatch','cross','stipple','rule'];
function tonalFill(pts2,kind,a){
  ctx.save(); path2(pts2,true); ctx.clip();
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const p of pts2){ if(p[0]<x0)x0=p[0]; if(p[0]>x1)x1=p[0]; if(p[1]<y0)y0=p[1]; if(p[1]>y1)y1=p[1]; }
  ctx.globalAlpha=a||0.42; ctx.fillStyle=tone(kind);
  ctx.fillRect(x0,y0,x1-x0,y1-y0);
  ctx.restore(); ctx.globalAlpha=1;
}

const grainCache = {};
function grainPat(color){
  if(grainCache[color]) return grainCache[color];
  const s=96, c=document.createElement('canvas'); c.width=c.height=s;
  const g=c.getContext('2d'); const q=mulberry32(color.length*7919+color.charCodeAt(1));
  for(let i=0;i<2600;i++){
    g.globalAlpha=0.10+q()*0.42; g.fillStyle=color;
    const rad=0.35+q()*1.15;
    g.beginPath(); g.arc(q()*s,q()*s,rad,0,6.2832); g.fill();
  }
  const p = ctx.createPattern(c,'repeat'); grainCache[color]=p; return p;
}

function path2(pts2, close){
  ctx.beginPath(); ctx.moveTo(pts2[0][0],pts2[0][1]);
  for(let i=1;i<pts2.length;i++) ctx.lineTo(pts2[i][0],pts2[i][1]);
  if(close) ctx.closePath();
}

/* resample + jitter for hand-drawn feel */
function rough(pts2, amp, step){
  const out=[];
  for(let i=0;i<pts2.length-1;i++){
    const [x1,y1]=pts2[i], [x2,y2]=pts2[i+1];
    const L=Math.hypot(x2-x1,y2-y1), n=Math.max(1,Math.round(L/step));
    for(let j=0;j<n;j++){
      const t=j/n;
      out.push([x1+(x2-x1)*t+jr(amp), y1+(y2-y1)*t+jr(amp)]);
    }
  }
  const e=pts2[pts2.length-1]; out.push([e[0]+jr(amp), e[1]+jr(amp)]);
  return out;
}

function stroke2(pts2,{lw=1.05,color=INK,alpha=0.8,passes=2,amp=1.5,close=false,over=0}={}){
  if(pts2.length<2) return;
  let base = pts2;
  if(over>0 && !close){
    base = pts2.slice();
    const a=base[0], b=base[1], y=base[base.length-1], x=base[base.length-2];
    const n1=Math.hypot(b[0]-a[0],b[1]-a[1])||1, n2=Math.hypot(y[0]-x[0],y[1]-x[1])||1;
    base[0]=[a[0]-(b[0]-a[0])/n1*over, a[1]-(b[1]-a[1])/n1*over];
    base[base.length-1]=[y[0]+(y[0]-x[0])/n2*over, y[1]+(y[1]-x[1])/n2*over];
  }
  ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle=color;
  for(let p=0;p<passes;p++){
    const j = rough(base, amp*(p?1.35:1), (typeof Q!=='undefined'&&Q.step)||12);
    ctx.beginPath(); ctx.moveTo(j[0][0],j[0][1]);
    for(let i=1;i<j.length-1;i++){
      const mx=(j[i][0]+j[i+1][0])/2, my=(j[i][1]+j[i+1][1])/2;
      ctx.quadraticCurveTo(j[i][0],j[i][1],mx,my);
    }
    ctx.lineTo(j[j.length-1][0], j[j.length-1][1]);
    if(close) ctx.closePath();
    ctx.globalAlpha = alpha*(p?0.38:1);
    ctx.lineWidth = lw*(p?0.7:1);
    ctx.stroke();
  }
  ctx.globalAlpha=1;
}

const WASH_K=0.62;
function washFill(pts2, color, a){
  a*=WASH_K;
  if(!color||a<=0.005) return;
  ctx.save(); path2(pts2,true);
  ctx.globalAlpha=a*0.55; ctx.fillStyle=color; ctx.fill();
  if(Q.grain){ ctx.globalAlpha=Math.min(0.95,a*1.6); ctx.fillStyle=grainPat(color); ctx.fill(); }
  else { ctx.globalAlpha=a*0.9; ctx.fillStyle=color; ctx.fill(); }
  ctx.restore(); ctx.globalAlpha=1;
}

/* type — manual letter-spacing, doubled ink pass */
function txt(s,x,y,{size=11,ls=1.7,color=INK,align='left',weight=400,alpha=0.86,face=''}={}){
  ctx.font = face==='mono'
    ? `${weight} ${size}px "SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace`
    : `${weight} ${size}px "Helvetica Neue","Arial Narrow",Arial,sans-serif`;
  const cs=[...s], ws=cs.map(c=>ctx.measureText(c).width);
  let total=ls*(cs.length-1); for(const w of ws) total+=w;
  let cx=x; if(align==='center')cx=x-total/2; if(align==='right')cx=x-total;
  ctx.fillStyle=color;
  for(let pass=0;pass<2;pass++){
    let p=cx; ctx.globalAlpha = pass? alpha*0.30 : alpha;
    for(let i=0;i<cs.length;i++){
      ctx.fillText(cs[i], p+(pass?jr(0.7):0), y+(pass?jr(0.7):0));
      p+=ws[i]+ls;
    }
  }
  ctx.globalAlpha=1; return total;
}

/* ============================================================
   PAPER
   ============================================================ */
function drawPaper(){
  const q = mulberry32(9001);
  ctx.fillStyle=PAPER.base; ctx.fillRect(0,0,W,H);

  // large tonal blotches
  for(let i=0;i<58;i++){
    const x=q()*W, y=q()*H, r=90+q()*430;
    const g=ctx.createRadialGradient(x,y,0,x,y,r);
    const dark = q()<0.55;
    g.addColorStop(0, NIGHT
      ? (dark?'rgba(0,0,0,0.10)':'rgba(120,150,200,0.035)')
      : (dark?'rgba(126,118,102,0.030)':'rgba(255,254,249,0.055)'));
    g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g; ctx.fillRect(x-r,y-r,r*2,r*2);
  }

  // fibre noise (transform-safe, resolution-adaptive)
  const tf=ctx.getTransform();
  ctx.setTransform(1,0,0,1,0,0);
  const cw=cv.width, chh=cv.height;
  const id=ctx.getImageData(0,0,cw,chh), d=id.data;
  const amt = 17;
  for(let i=0;i<d.length;i+=4){
    const n=(q()-0.5)*amt;
    d[i]+=n; d[i+1]+=n*0.97; d[i+2]+=n*0.9;
  }
  ctx.putImageData(id,0,0);
  ctx.setTransform(tf);

  // faint engineering grid
  ctx.save(); ctx.strokeStyle='#8c93a2'; ctx.lineWidth=1;
  ctx.strokeStyle=NIGHT?'#7f93b8':'#8c93a2';
  for(let x=0;x<W;x+=15){ ctx.globalAlpha=NIGHT?((x%75===0)?0.10:0.05):((x%75===0)?0.075:0.038);
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for(let y=0;y<H;y+=15){ ctx.globalAlpha=NIGHT?((y%75===0)?0.10:0.05):((y%75===0)?0.075:0.038);
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  ctx.restore();

  // ghost arcs / compass sweeps
  ctx.save(); ctx.strokeStyle=NIGHT?'#8a8f9c':'#6b665c';
  for(let i=0;i<9;i++){
    ctx.globalAlpha=0.05+q()*0.05; ctx.lineWidth=0.7+q()*1.2;
    const x=q()*W, y=q()*H, r=200+q()*900, a0=q()*6.28;
    ctx.beginPath(); ctx.arc(x,y,r,a0,a0+0.35+q()*1.1); ctx.stroke();
  }
  // stray scratches
  for(let i=0;i<16;i++){
    ctx.globalAlpha=0.06+q()*0.08; ctx.lineWidth=0.6+q()*0.9;
    const x=q()*W, y=q()*H, L=30+q()*260, a=q()*6.28;
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+Math.cos(a)*L, y+Math.sin(a)*L); ctx.stroke();
  }
  ctx.restore();

  // pixel-block registration marks
  ctx.save();
  for(let i=0;i<7;i++){
    const bx = q()<0.5 ? 20+q()*90 : W-110+q()*80;
    const by = 200+q()*(H-500), n=ri2(q,3,6), s=3+q()*2;
    ctx.globalAlpha=0.16+q()*0.18; ctx.fillStyle=NIGHT?'#8f95a4':'#54504a';
    for(let a=0;a<n;a++) for(let b=0;b<n;b++)
      if(q()<0.55) ctx.fillRect(bx+a*s, by+b*s, s*0.85, s*0.85);
  }
  ctx.restore();

  // edge shading
  const v=ctx.createRadialGradient(W/2,H/2,H*0.30,W/2,H/2,H*0.78);
  v.addColorStop(0,'rgba(0,0,0,0)');
  v.addColorStop(1,NIGHT?'rgba(0,0,0,0.34)':'rgba(78,70,58,0.065)');
  ctx.fillStyle=v; ctx.fillRect(0,0,W,H);

}
const ri2=(q,a,b)=>Math.floor(a+(b-a+1)*q());

/* ============================================================
   PLACEMENT TRANSFORM  — every volume is authored around the
   origin at footprint radius ≈5, then placed by the composer.
   ============================================================ */
let T={x:0,y:0,s:1,z:1,zo:0,rot:0};
function setT(o){ T={x:o.x||0,y:o.y||0,s:o.s||1,z:o.z||1,zo:o.zo||0,rot:o.rot||0}; }
function resetT(){ T={x:0,y:0,s:1,z:1,zo:0,rot:0}; }

/* ============================================================
   MODEL BUILDERS
   ============================================================ */
let CNT={}, BRIEFS=[];
const bump=(k,n=1)=>{ CNT[k]=(CNT[k]||0)+n; };

/* -- shared solids ------------------------------------------------ */
function box(x,y,z,w,dd,h,o={}){
  const X=x+w, Y=y+dd, Z=z+h;
  // a face may carry a screen tone; the solid is always closed
  if(DLV>=2 && !o.pat && Math.min(w,dd)>0.55 && h>0.8 && ch(0.26))
    o={...o, pat:pick(TONES), patFace:ri(1,4), pa:rr(0.14,0.30)};
  const pf=o.pat?(o.patFace!==undefined?o.patFace:1):-1;
  quad([[x,y,Z],[X,y,Z],[X,Y,Z],[x,Y,Z]],{...o,sh:1.00,pat:pf===0?o.pat:null});
  quad([[X,y,z],[X,Y,z],[X,Y,Z],[X,y,Z]],{...o,sh:0.80,pat:pf===1?o.pat:null});
  quad([[x,Y,z],[X,Y,z],[X,Y,Z],[x,Y,Z]],{...o,sh:0.62,pat:pf===2?o.pat:null});
  quad([[x,y,z],[x,Y,z],[x,Y,Z],[x,y,Z]],{...o,sh:0.72,pat:pf===3?o.pat:null});
  quad([[x,y,z],[X,y,z],[X,y,Z],[x,y,Z]],{...o,sh:0.56,pat:pf===4?o.pat:null});
  if(o.hidden!==false){
    poly([[x,y,z],[X,y,z]],{stroke:o.stroke,lw:(o.lw||1)*0.6,alpha:0.16});
    poly([[x,y,z],[x,Y,z]],{stroke:o.stroke,lw:(o.lw||1)*0.6,alpha:0.16});
  }
}
let DLV=2;                                   // 1 minimal · 2 moderate · 3 detailed

/* a habitable mass: structure, floors, mullions, parapet, glazing */
function archBox(x,y,z,w,d,h,o={}){
  if(DLV>=2 && !o.pat && ch(0.46)) o={...o, pat:pick(TONES), patFace:ri(1,4), pa:rr(0.16,0.32)};
  box(x,y,z,w,d,h,o);
  if(DLV<1 || h<0.45) return;
  const X=x+w, Y=y+d, Z=z+h;
  const fh=o.fh||0.86, n=Math.min(28,Math.floor(h/fh));
  // floor plates read on the two facing elevations
  for(let i=1;i<=n;i++){
    const zz=z+i*fh;
    seg([X,y,zz],[X,Y,zz],{stroke:INK,lw:0.45,alpha:0.3,dt:2});
    seg([x,Y,zz],[X,Y,zz],{stroke:INK,lw:0.45,alpha:0.2,dt:2});
    seg([x,y,zz],[x,Y,zz],{stroke:INK,lw:0.4,alpha:0.2,dt:3});
    seg([x,y,zz],[X,y,zz],{stroke:INK,lw:0.4,alpha:0.16,dt:3});
  }
  // corner structure
  const cw=Math.min(0.22,Math.max(0.08,Math.min(w,d)*0.06));
  for(const cx of [x,X]) for(const cy of [y,Y])
    post(cx,cy,z,h,cw,{alpha:0.55,dt:1});
  if(DLV>=2){
    const bay=o.bay||0.9;
    const nd=Math.min(20,Math.max(1,Math.round(d/bay)));
    for(let i=1;i<nd;i++){ const yy=y+d*i/nd;
      seg([X,yy,z],[X,yy,Z],{stroke:INK,lw:0.4,alpha:0.2,dt:3});
      seg([x,yy,z],[x,yy,Z],{stroke:INK,lw:0.4,alpha:0.15,dt:3}); }
    const nw=Math.min(20,Math.max(1,Math.round(w/bay)));
    for(let i=1;i<nw;i++){ const xx=x+w*i/nw;
      seg([xx,Y,z],[xx,Y,Z],{stroke:INK,lw:0.4,alpha:0.14,dt:3});
      seg([xx,y,z],[xx,y,Z],{stroke:INK,lw:0.4,alpha:0.12,dt:3}); }
    // parapet
    if(o.parapet!==false){
      const pp=Math.min(0.26,h*0.06);
      poly([[x,y,Z+pp],[X,y,Z+pp],[X,Y,Z+pp],[x,Y,Z+pp]],
        {stroke:INK,lw:0.6,alpha:0.5,close:true,dt:2});
      for(const c of [[x,y],[X,y],[X,Y],[x,Y]])
        seg([c[0],c[1],Z],[c[0],c[1],Z+pp],{stroke:INK,lw:0.5,alpha:0.4,dt:2});
    }
  }
  if(DLV>=3 && o.fill){
    for(let q=0;q<ri(1,4);q++){
      const zz=z+Math.max(1,Math.floor(rr(1,Math.max(2,n))))*fh, sq=Math.min(0.3,d*0.12);
      const py=y+rr(sq,d-sq);
      quad([[X,py-sq,zz-sq],[X,py+sq,zz-sq],[X,py+sq,zz+sq],[X,py-sq,zz+sq]],
        {stroke:INK,lw:0.45,fill:o.fill,a:0.45,dt:3});
    }
  }
}

/* ---------- plan geometry: straight lines, arcs and diagonals ---------- */
const PLANS=['RECT','RECT','ROUNDED','ONEROUND','CHAMFER','DIAGONAL','APSIDAL','LOBED'];
function planShape(w,d,kind,seed){
  const hw=w/2, hd=d/2, pts=[];
  const arc=(cx,cy,r,a0,a1,n)=>{
    for(let i=0;i<=n;i++){ const a=a0+(a1-a0)*i/n;
      pts.push([cx+Math.cos(a)*r, cy+Math.sin(a)*r]); }
  };
  const N=DLV>=2?5:3;
  const m=Math.min(hw,hd);
  if(kind==='ROUNDED'){
    const r=m*(seed||0.42);
    arc( hw-r,-hd+r,r,-Math.PI/2,0,N);
    arc( hw-r, hd-r,r,0,Math.PI/2,N);
    arc(-hw+r, hd-r,r,Math.PI/2,Math.PI,N);
    arc(-hw+r,-hd+r,r,Math.PI,Math.PI*1.5,N);
  }else if(kind==='ONEROUND'){
    const r=m*1.0;
    pts.push([hw,-hd]);
    arc(hw-r,hd-r,r,0,Math.PI/2,N*2);
    pts.push([-hw,hd],[-hw,-hd]);
  }else if(kind==='CHAMFER'){
    const c=m*0.34;
    pts.push([hw-c,-hd],[hw,-hd+c],[hw,hd-c],[hw-c,hd],
             [-hw+c,hd],[-hw,hd-c],[-hw,-hd+c],[-hw+c,-hd]);
  }else if(kind==='DIAGONAL'){
    const c=m*0.85;
    pts.push([hw,-hd],[hw,hd],[-hw+c,hd],[-hw,hd-c],[-hw,-hd]);
  }else if(kind==='APSIDAL'){
    pts.push([-hw,-hd],[hw-hd,-hd]);
    arc(hw-hd,0,hd,-Math.PI/2,Math.PI/2,N*3);
    pts.push([-hw,hd]);
  }else if(kind==='LOBED'){
    const b=m*0.30;
    pts.push([hw,-hd]);
    arc(hw-b*1.4,0,Math.hypot(b*1.4,hd)*0.0+hd*1.0,-Math.PI/2,Math.PI/2,N*2);
    pts.push([-hw,hd]);
    arc(-hw+b*1.4,0,hd*1.0,Math.PI/2,Math.PI*1.5,N*2);
  }else{
    pts.push([hw,-hd],[hw,hd],[-hw,hd],[-hw,-hd]);
  }
  return pts;
}
function rotPlan(pts,a,ox,oy){
  const c=Math.cos(a||0), s2=Math.sin(a||0);
  return pts.map(p=>[(ox||0)+p[0]*c-p[1]*s2, (oy||0)+p[0]*s2+p[1]*c]);
}
/* extrude a plan into a closed solid, lit from a fixed direction */
function prism(pl,z,h,o={}){
  const n=pl.length;
  const top=pl.map(p=>[p[0],p[1],z+h]);
  quad(top,{...o,sh:1.0,pat:o.patFace===0?o.pat:null});
  const face=(o.patFace!==undefined&&o.patFace>0)?((o.patFace-1)%n):-1;
  for(let i=0;i<n;i++){
    const a=pl[i], b=pl[(i+1)%n];
    let nx=b[1]-a[1], ny=-(b[0]-a[0]);
    const L=Math.hypot(nx,ny)||1; nx/=L; ny/=L;
    const sh=0.50+0.32*Math.max(0,nx*0.62+ny*0.78);
    quad([[a[0],a[1],z],[b[0],b[1],z],[b[0],b[1],z+h],[a[0],a[1],z+h]],
      {...o,sh,pat:i===face?o.pat:null});
  }
  return z+h;
}
/* an inhabited prism: floor plates, mullions, corner posts, parapet */
function archPrism(pl,z,h,o={}){
  if(DLV>=2 && !o.pat && ch(0.4)) o={...o, pat:pick(TONES), patFace:ri(1,pl.length), pa:rr(0.14,0.30)};
  prism(pl,z,h,o);
  if(DLV<1||h<0.5) return z+h;
  const fh=o.fh||0.86, n=Math.min(26,Math.floor(h/fh));
  for(let i=1;i<=n;i++){
    const zz=z+i*fh;
    poly(pl.concat([pl[0]]).map(p=>[p[0],p[1],zz]),
      {stroke:INK,lw:0.45,alpha:0.26,dt:2});
  }
  const cw=Math.min(0.24,Math.max(0.09,h*0.02));
  for(const p of pl) post(p[0],p[1],z,h,cw,{alpha:0.55,dt:1});
  if(DLV>=2 && o.parapet!==false){
    const pp=Math.min(0.28,h*0.06);
    poly(pl.concat([pl[0]]).map(p=>[p[0],p[1],z+h+pp]),
      {stroke:INK,lw:0.6,alpha:0.5,dt:2});
    for(const p of pl) seg([p[0],p[1],z+h],[p[0],p[1],z+h+pp],{stroke:INK,lw:0.5,alpha:0.4,dt:2});
  }
  return z+h;
}

/* a column drawn as a real (very slender) prism */
function post(x,y,z,h,w,o={}){
  const t2=(w||0.13)/2;
  box(x-t2,y-t2,z,t2*2,t2*2,h,
    {stroke:INK,lw:o.lw||0.55,alpha:o.alpha||0.5,fill:o.fill||null,a:o.a||0.18,
     hidden:false,dt:o.dt||1});
}

/* colonnade beneath a slab */
function colonnade(x,y,z,w,d,h,o={}){
  const n=Math.max(2,Math.round(w/(o.bay||1.5))), m=Math.max(2,Math.round(d/(o.bay||1.5)));
  for(let i=0;i<=n;i++) for(let j=0;j<=m;j++){
    if(i>0&&i<n&&j>0&&j<m) continue;
    const px=x+w*i/n, py=y+d*j/m;
    post(px,py,z,h,0.16,{alpha:0.5,dt:1});
    if(DLV>=2) poly([[px-0.12,py,z+h],[px+0.12,py,z+h],[px,py,z+h-0.22]],
      {stroke:INK,lw:0.4,alpha:0.3,close:true,dt:3});
  }
}

/* dimension line with extension ticks and a label */
function dimension(a,b,z,off,label,o={}){
  if(DLV<2) return;
  let dx=b[0]-a[0], dy=b[1]-a[1];
  const L=Math.hypot(dx,dy)||1; dx/=L; dy/=L;
  const nx=-dy*off, ny=dx*off;
  const A=[a[0]+nx,a[1]+ny,z], B=[b[0]+nx,b[1]+ny,z];
  seg([a[0],a[1],z],[A[0],A[1],z],{stroke:INK,lw:0.45,alpha:0.35,dt:2});
  seg([b[0],b[1],z],[B[0],B[1],z],{stroke:INK,lw:0.45,alpha:0.35,dt:2});
  seg(A,B,{stroke:INK,lw:0.6,alpha:0.55,dt:2});
  for(const P of [A,B])
    seg([P[0]-dx*0.35-nx*0.06,P[1]-dy*0.35-ny*0.06,z],
        [P[0]+dx*0.35+nx*0.06,P[1]+dy*0.35+ny*0.06,z],{stroke:INK,lw:0.7,alpha:0.6,dt:2});
  sprite([(A[0]+B[0])/2,(A[1]+B[1])/2,z],(sx,sy)=>{
    txt(label,sx,sy-5,{size:8.5,ls:1.3,align:'center',alpha:0.55});
  },{dt:2});
}
/* circled detail callout with a leader */
function callout(p,letter,o={}){
  if(DLV<2) return;
  sprite(p,(sx,sy)=>{
    const r=11, lx=sx+(o.dx||26), ly=sy-(o.dy||22);
    ctx.save(); ctx.globalAlpha=0.5; ctx.strokeStyle=INK; ctx.lineWidth=0.7;
    ctx.beginPath(); ctx.arc(lx,ly,r,0,6.2832); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx,sy);
    ctx.lineTo(lx-(o.dx>0?r:-r)*0.7,ly+r*0.7); ctx.stroke();
    ctx.globalAlpha=0.35;
    ctx.beginPath(); ctx.arc(sx,sy,2,0,6.2832); ctx.stroke();
    ctx.restore();
    txt(letter,lx,ly+3.5,{size:10,ls:1,align:'center',alpha:0.65});
  },{dt:2});
}

/* entrance works at grade: steps, canopy, forecourt */
function groundWorks(cx,cy,r,o={}){
  if(DLV<1) return;
  const st=ri(3,6), a=rr(0,6.2832), ca=Math.cos(a), sa=Math.sin(a);
  for(let i=0;i<st;i++){
    const rr2=r*(1.0+i*0.075), z=0.42-i*0.42/st, hw=r*0.42;
    const p1=[cx+ca*rr2-sa*hw, cy+sa*rr2+ca*hw, z];
    const p2=[cx+ca*rr2+sa*hw, cy+sa*rr2-ca*hw, z];
    seg(p1,p2,{stroke:INK,lw:0.55,alpha:0.45,dt:2});
  }
  // canopy
  const cr=r*1.02, hw=r*0.5, cz=rr(1.3,2.1);
  const q=[[cx+ca*(cr-r*0.25)-sa*hw, cy+sa*(cr-r*0.25)+ca*hw, cz],
           [cx+ca*(cr+r*0.35)-sa*hw, cy+sa*(cr+r*0.35)+ca*hw, cz],
           [cx+ca*(cr+r*0.35)+sa*hw, cy+sa*(cr+r*0.35)-ca*hw, cz],
           [cx+ca*(cr-r*0.25)+sa*hw, cy+sa*(cr-r*0.25)-ca*hw, cz]];
  quad(q,{stroke:INK,lw:0.7,alpha:0.6,fill:o.fill,a:0.2,dt:2});
  for(const c of [q[1],q[2]]) seg([c[0],c[1],0],[c[0],c[1],cz],{stroke:INK,lw:0.6,alpha:0.5,dt:2});
  // forecourt paving
  if(DLV>=2){
    for(let i=1;i<5;i++){
      const pts=[];
      for(let k=0;k<=20;k++){ const t=k/20*6.2832;
        pts.push([cx+Math.cos(t)*r*(1.1+i*0.16), cy+Math.sin(t)*r*(1.1+i*0.16), 0.03]); }
      poly(pts,{stroke:INK,lw:0.4,alpha:0.2,close:true,dt:3});
    }
  }
}

function ring(x,y,z,r,n,o={}){
  const p=[]; for(let i=0;i<=n;i++){const a=i/n*6.2832; p.push([x+Math.cos(a)*r,y+Math.sin(a)*r,z]);}
  poly(p,o); return p;
}
function cyl(x,y,z,r,h,o={}){
  const n=o.seg||16;
  for(let i=0;i<n;i++){ const a=i/n*6.2832;
    seg([x+Math.cos(a)*r,y+Math.sin(a)*r,z],[x+Math.cos(a)*r,y+Math.sin(a)*r,z+h],
        {stroke:INK,lw:(o.lw||0.7),alpha:o.alpha!==undefined?o.alpha:0.5}); }
  const rings=o.rings||2;
  for(let k=0;k<=rings;k++) ring(x,y,z+h*k/rings,r,24,{stroke:INK,lw:(o.lw||0.8),alpha:0.6});
}
function cone(x,y,z,r,h,o={}){
  const n=o.seg||14;
  for(let i=0;i<n;i++){const a=i/n*6.2832;
    seg([x+Math.cos(a)*r,y+Math.sin(a)*r,z],[x,y,z+h],{stroke:INK,lw:0.6,alpha:0.5});}
  ring(x,y,z,r,24,{stroke:INK,lw:0.8,alpha:0.6});
}

/* =====================  SYSTEMS  ===================== */
/* Each authors a volume of footprint radius ≈5 around the origin. */

function sysPrairie(cfg){
  const P=cfg.pal.c, fl=ri(2,4), fh=rr(2.6,3.6), sp=rr(1.05,1.45), gs=ri(2,3);
  const top=fl*fh+rr(0.8,1.8);
  const bs=rr(3.8,5.0);
  box(-bs,-bs,-0.4,bs*2,bs*2,0.4,{stroke:INK,lw:1.1,fill:P[1],a:0.10});
  bump('TERRACE',ri(4,8));
  groundWorks(0,0,bs*0.75,{fill:P[0]});
  for(let i=0;i<=gs;i++)for(let j=0;j<=gs;j++){
    box((i-gs/2)*sp*2-0.22,(j-gs/2)*sp*2-0.22,0,0.44,0.44,top,{stroke:INK,lw:0.95,fill:P[0],a:0.26});
    bump('PIERS');
  }
  const hw=gs*sp*0.86;
  box(-hw*0.42,-hw*0.42,0,hw*0.84,hw*0.84,top*0.95,{stroke:INK,lw:0.9,fill:P[3],a:0.15});
  bump('HEARTH',ri(1,2));
  for(let f=1;f<=fl;f++){
    const z=f*fh, w=gs*sp*rr(1.5,2.1);
    box(-w/2,-w/2,z,w,w,0.34,{stroke:INK,lw:1.0,fill:P[0],a:0.26}); bump('BANDS');
    if(f<fl) colonnade(-w/2*0.8,-w/2*0.8,z+0.2,w*0.8,w*0.8,fh*0.9,{bay:1.2});
    for(let k=0;k<ri(2,3);k++){
      const dir=ri(0,3), L=rr(2.2,4.8), Wd=rr(1.5,2.9);
      let x,y,ww,dd;
      if(dir===0){x=w/2-0.2;y=-Wd/2;ww=L;dd=Wd;}
      else if(dir===1){x=-Wd/2;y=w/2-0.2;ww=Wd;dd=L;}
      else if(dir===2){x=-w/2-L+0.2;y=-Wd/2;ww=L;dd=Wd;}
      else {x=-Wd/2;y=-w/2-L+0.2;ww=Wd;dd=L;}
      box(x,y,z+rr(-0.08,0.2),ww,dd,0.30,{stroke:INK,lw:0.95,fill:P[0],a:0.32});
      bump('WINGS'); bump('EAVES');
    }
    const vw=gs*sp*rr(0.85,1.2);
    archBox(-vw/2,-vw/2,z+0.2,vw,vw,fh*rr(0.34,0.55),
      {stroke:INK,lw:0.9,fill:P[1],a:0.22,fh:0.7,bay:0.7,parapet:false});
    bump('SCREENS',ri(6,14));
  }
  const rw=gs*sp*1.35;
  box(-rw/2,-rw/2,top-0.34,rw,rw,0.34,{stroke:INK,lw:1.0,fill:P[1],a:0.34});
  bump('PERGOLA',ri(1,3)); bump('PLANTER',ri(2,5));
  return top+0.6;
}

/* ---- THIN SHELL: six distinct roof geometries ---------------- */
const ROOFS=['UMBRELLA','HYPAR','BARREL','FOLDED','CATENARY','GROIN'];
function sysShell(cfg){
  const P=cfg.pal.c, nx=ri(2,3), ny=ri(2,3), cell=rr(1.9,2.5);
  const h=rr(8,12);
  const kind=pick(ROOFS); cfg.roof=kind;
  const xmin=-(nx-1)/2*cell*2-cell, xmax=(nx-1)/2*cell*2+cell;
  const ymin=-(ny-1)/2*cell*2-cell, ymax=(ny-1)/2*cell*2+cell;
  const W2=xmax-xmin, D2=ymax-ymin;

  // tapered columns on pad footings
  for(let i=0;i<nx;i++) for(let j=0;j<ny;j++){
    const x=(i-(nx-1)/2)*cell*2, y=(j-(ny-1)/2)*cell*2;
    box(x-0.8,y-0.8,0,1.6,1.6,0.25,{stroke:INK,lw:1.0,fill:null});
    const sg=6;
    for(let s=0;s<sg;s++){
      const z0=0.25+h*s/sg, z1=0.25+h*(s+1)/sg;
      const w0=0.55-0.34*(s/sg), w1=0.55-0.34*((s+1)/sg);
      poly([[x-w0,y-w0,z0],[x+w0,y-w0,z0],[x+w1,y-w1,z1],[x-w1,y-w1,z1]],{stroke:INK,lw:0.9,alpha:0.7,close:true});
      poly([[x+w0,y-w0,z0],[x+w0,y+w0,z0],[x+w1,y+w1,z1],[x+w1,y-w1,z1]],{stroke:INK,lw:0.9,alpha:0.7,close:true});
      poly([[x-w0,y+w0,z0],[x+w0,y+w0,z0],[x+w1,y+w1,z1],[x-w1,y+w1,z1]],{stroke:INK,lw:0.9,alpha:0.45,close:true});
    }
    bump('SUPPORTS',ri(2,4));
  }
  const z0=h+0.25;
  let topZ=z0;

  const TH=rr(0.26,0.42);                       // structural depth of the shell
  const meshSurface=(zAt,diag)=>{
    const res=6, NX=nx*2*res, NY=ny*2*res, gp=[];
    for(let i=0;i<=NX;i++){ gp[i]=[];
      for(let j=0;j<=NY;j++){
        const x=xmin+W2*i/NX, y=ymin+D2*j/NY;
        gp[i][j]=[x,y,zAt(x,y)];
      } }
    if(diag){
      for(let d=-NY;d<=NX;d+=2){ const L=[];
        for(let i=0;i<=NX;i++){const j=i-d; if(j<0||j>NY)continue; L.push(gp[i][j]);}
        if(L.length>1) poly(L,{stroke:INK,lw:0.6,alpha:0.5}); }
      for(let d=2;d<=NX+NY;d+=2){ const L=[];
        for(let i=0;i<=NX;i++){const j=d-i; if(j<0||j>NY)continue; L.push(gp[i][j]);}
        if(L.length>1) poly(L,{stroke:INK,lw:0.6,alpha:0.5}); }
    }else{
      for(let i=0;i<=NX;i+=2) poly(gp[i],{stroke:INK,lw:0.55,alpha:0.45});
      for(let j=0;j<=NY;j+=2){ const L=[];
        for(let i=0;i<=NX;i++) L.push(gp[i][j]);
        poly(L,{stroke:INK,lw:0.55,alpha:0.45}); }
    }
    const rim=[];
    for(let i=0;i<=NX;i++) rim.push(gp[i][0]);
    for(let j=0;j<=NY;j++) rim.push(gp[NX][j]);
    for(let i=NX;i>=0;i--) rim.push(gp[i][NY]);
    for(let j=NY;j>=0;j--) rim.push(gp[0][j]);
    poly(rim,{stroke:INK,lw:1.3,alpha:0.85,close:true});
    // edge fascia and soffit — the shell is a slab, not a sheet
    const low=rim.map(p=>[p[0],p[1],p[2]-TH]);
    poly(low,{stroke:INK,lw:0.9,alpha:0.55,close:true});
    for(let i=0;i<rim.length-1;i+=2){
      quad([rim[i],rim[i+1],low[i+1],low[i]],
        {stroke:INK,lw:0.55,alpha:0.5,fill:P[0],a:0.14});
    }
    for(let i=0;i<=NX;i+=6){                    // soffit ribs
      const L=[];
      for(let j=0;j<=NY;j++) L.push([gp[i][j][0],gp[i][j][1],gp[i][j][2]-TH]);
      poly(L,{stroke:INK,lw:0.4,alpha:0.28,dt:2});
    }
    let mx=z0;
    for(let i=0;i<=NX;i++) for(let j=0;j<=NY;j++) if(gp[i][j][2]>mx) mx=gp[i][j][2];
    return mx;
  };

  if(kind==='UMBRELLA'){
    const amp=rr(1.0,1.8);
    topZ=meshSurface((x,y)=>z0+amp*Math.cos(Math.PI*x/cell)*Math.cos(Math.PI*y/cell),true);
    bump('SHELLS',nx*ny);
  }else if(kind==='HYPAR'){
    // one warped saddle: a ruled surface, drawn with its straight generators
    const k=rr(0.22,0.42), lift=rr(1.6,3.0);
    const cor=[[xmin,ymin],[xmax,ymin],[xmax,ymax],[xmin,ymax]];
    const zc=[z0+lift,z0-lift*0.35,z0+lift,z0-lift*0.35];
    const P4=(u,v)=>{
      const a=[xmin+(xmax-xmin)*u, ymin, z0+lift+(-lift*1.35)*u];
      const b=[xmin+(xmax-xmin)*u, ymax, z0-lift*0.35+(lift*1.35)*u];
      return [a[0], a[1]+(b[1]-a[1])*v, a[2]+(b[2]-a[2])*v];
    };
    const N=16;
    for(let i=0;i<=N;i++){
      const L1=[],L2=[];
      for(let q=0;q<=10;q++){ L1.push(P4(i/N,q/10)); L2.push(P4(q/10,i/N)); }
      poly(L1,{stroke:INK,lw:i%4?0.5:0.75,alpha:i%4?0.42:0.6});
      poly(L2,{stroke:INK,lw:i%4?0.5:0.75,alpha:i%4?0.42:0.6});
    }
    const rimH=[P4(0,0),P4(1,0),P4(1,1),P4(0,1)];
    poly(rimH,{stroke:INK,lw:1.3,alpha:0.85,close:true});
    const lowH=rimH.map(p=>[p[0],p[1],p[2]-TH]);
    poly(lowH,{stroke:INK,lw:0.9,alpha:0.55,close:true});
    for(let i=0;i<4;i++)
      quad([rimH[i],rimH[(i+1)%4],lowH[(i+1)%4],lowH[i]],
        {stroke:INK,lw:0.6,alpha:0.55,fill:P[0],a:0.16});
    for(let i=0;i<=N;i+=4){                      // soffit generators
      const L=[]; for(let q=0;q<=10;q++){ const p=P4(i/N,q/10); L.push([p[0],p[1],p[2]-TH]); }
      poly(L,{stroke:INK,lw:0.4,alpha:0.3,dt:2});
    }
    topZ=z0+lift; bump('SHELLS',1); bump('RULINGS',N*2);
  }else if(kind==='BARREL'){
    // a row of half-cylinder vaults with transverse ribs
    const n=Math.max(2,nx*2-1), sp=W2/n, R=sp*0.5, ribs=10;
    for(let v=0;v<n;v++){
      const cx=xmin+sp*(v+0.5);
      for(const yy of [ymin,ymax]){
        const arc=[], inn=[];
        for(let k2=0;k2<=14;k2++){ const a=Math.PI*k2/14;
          arc.push([cx-Math.cos(a)*R, yy, z0+Math.sin(a)*R]);
          inn.push([cx-Math.cos(a)*(R-TH), yy, z0+Math.sin(a)*(R-TH)]); }
        poly(arc,{stroke:INK,lw:0.9,alpha:0.7});
        poly(inn,{stroke:INK,lw:0.6,alpha:0.5});
        for(let k2=0;k2<=14;k2+=2)
          seg(arc[k2],inn[k2],{stroke:INK,lw:0.4,alpha:0.35,dt:2});
      }
      for(let k2=0;k2<=8;k2+=2){                 // the soffit runs the length
        const a=Math.PI*k2/8;
        seg([cx-Math.cos(a)*(R-TH),ymin,z0+Math.sin(a)*(R-TH)],
            [cx-Math.cos(a)*(R-TH),ymax,z0+Math.sin(a)*(R-TH)],
            {stroke:INK,lw:0.4,alpha:0.3,dt:2});
      }
      for(let r2=1;r2<ribs;r2++){
        const yy=ymin+D2*r2/ribs, arc=[];
        for(let k2=0;k2<=12;k2++){ const a=Math.PI*k2/12;
          arc.push([cx-Math.cos(a)*R, yy, z0+Math.sin(a)*R]); }
        poly(arc,{stroke:INK,lw:0.45,alpha:0.3,dt:2});
      }
      for(let k2=0;k2<=8;k2+=2){ const a=Math.PI*k2/8;
        seg([cx-Math.cos(a)*R,ymin,z0+Math.sin(a)*R],[cx-Math.cos(a)*R,ymax,z0+Math.sin(a)*R],
          {stroke:INK,lw:0.5,alpha:0.4}); }
      bump('SHELLS');
    }
    topZ=z0+R;
  }else if(kind==='FOLDED'){
    // folded plate: alternating ridges and valleys as flat facets
    const n=Math.max(4,nx*3), sp=W2/n, rise=rr(1.4,2.4);
    for(let v=0;v<n;v++){
      const x0=xmin+sp*v, x1=xmin+sp*(v+1);
      const za=(v%2)?z0:z0+rise, zb=(v%2)?z0+rise:z0;
      quad([[x0,ymin,za],[x1,ymin,zb],[x1,ymax,zb],[x0,ymax,za]],
        {stroke:INK,lw:0.75,alpha:0.6,fill:P[0],a:0.12,pat:DLV>=2?'rule':null,pa:0.2});
      quad([[x0,ymin,za-TH],[x1,ymin,zb-TH],[x1,ymax,zb-TH],[x0,ymax,za-TH]],
        {stroke:INK,lw:0.5,alpha:0.4});
      for(const yy of [ymin,ymax])              // end fascia of the fold
        quad([[x0,yy,za],[x1,yy,zb],[x1,yy,zb-TH],[x0,yy,za-TH]],
          {stroke:INK,lw:0.55,alpha:0.5,fill:P[0],a:0.16});
      if(DLV>=2) for(let r2=1;r2<6;r2++){
        const yy=ymin+D2*r2/6;
        seg([x0,yy,za],[x1,yy,zb],{stroke:INK,lw:0.35,alpha:0.24,dt:3});
      }
      bump('SHELLS');
    }
    for(const yy of [ymin,ymax]){
      const L=[];
      for(let v=0;v<=n;v++) L.push([xmin+sp*v,yy,(v%2)?z0:z0+rise]);
      poly(L,{stroke:INK,lw:1.1,alpha:0.8});
    }
    topZ=z0+rise;
  }else if(kind==='CATENARY'){
    // a hanging roof slung between edge beams
    const sag=rr(1.6,2.8), lift=rr(0.8,1.6);
    topZ=meshSurface((x,y)=>{
      const u=(x-xmin)/W2, v=(y-ymin)/D2;
      return z0+lift - sag*Math.sin(Math.PI*u)*Math.sin(Math.PI*v)*1.0;
    },false);
    for(const yy of [ymin,ymax]){
      const L=[];
      for(let i=0;i<=12;i++){ const x=xmin+W2*i/12;
        L.push([x,yy,z0+lift+Math.sin(Math.PI*i/12)*0.35]); }
      poly(L,{stroke:INK,lw:1.2,alpha:0.8});
    }
    for(let i=0;i<=6;i++){                     // back-stays to ground anchors
      const x=xmin+W2*i/6;
      for(const yy of [ymin,ymax]){
        const sgn=yy<0?-1:1;
        seg([x,yy,z0+lift],[x,yy+sgn*2.2,0],{stroke:INK,lw:0.45,alpha:0.35,dt:2});
      }
    }
    bump('SHELLS',1); bump('RULINGS',24);
  }else{
    // groin-vaulted bays
    const bx=nx*2-1, by2=ny*2-1;
    const sx=W2/bx, sy=D2/by2, R=Math.min(sx,sy)*0.5;
    for(let i=0;i<bx;i++) for(let j=0;j<by2;j++){
      const cx=xmin+sx*(i+0.5), cy=ymin+sy*(j+0.5);
      for(const [ax,ay] of [[1,0],[0,1]]){
        for(const off of [-1,1]){
          const arc=[];
          for(let k2=0;k2<=10;k2++){ const a=Math.PI*k2/10;
            arc.push([cx-ax*Math.cos(a)*sx/2 + (ax?0:off*sx/2),
                      cy-ay*Math.cos(a)*sy/2 + (ay?0:off*sy/2),
                      z0+Math.sin(a)*R]); }
          poly(arc,{stroke:INK,lw:0.55,alpha:0.42,dt:1});
          const inn=arc.map(p=>[p[0],p[1],p[2]-TH]);
          poly(inn,{stroke:INK,lw:0.4,alpha:0.3,dt:2});
        }
      }
      for(const dg of [[1,1],[1,-1]]){          // the groins themselves
        const g=[];
        for(let k2=0;k2<=10;k2++){ const t=k2/10;
          g.push([cx+(-0.5+t)*sx*dg[0], cy+(-0.5+t)*sy*dg[1], z0+Math.sin(t*Math.PI)*R]); }
        poly(g,{stroke:INK,lw:0.7,alpha:0.55});
      }
      bump('GROINS',2);
    }
    topZ=z0+R; bump('SHELLS',bx*by2);
  }

  for(let k=0;k<ri(2,4);k++){
    const L=rr(6,12), horiz=ch(0.5), x=rr(-10,4), y=rr(-10,4);
    if(horiz) box(x,y,0,L,0.5,rr(1.2,2.2),{stroke:INK,lw:0.85,fill:null});
    else box(x,y,0,0.5,L,rr(1.2,2.2),{stroke:INK,lw:0.85,fill:null});
    bump('WALLS');
  }
  bump('GLAZING',ri(1,4)); bump('CONTOURS',ri(1,3));
  bump('DECKS',ri(1,3)); bump('RIBS',ri(0,4)); bump('COFFERS',ri(0,3));
  return topZ+0.6;
}

/* ---- TOWER: eight high-rise typologies --------------------- */
const TOWERS=['PRISM','SETBACK','TWIST','BUNDLE','DIAGRID','XBRACE','STACK','TRIPOD'];
function sysTower(cfg){
  const P=cfg.pal.c;
  const kind=pick(TOWERS); cfg.tower=kind;
  const H=rr(16,26), W=rr(3.0,4.4), fh=rr(0.9,1.2);
  const fl=Math.round(H/fh);
  const plate=(x,y,w,d,z,rot)=>{
    const c=Math.cos(rot||0), s=Math.sin(rot||0);
    const p=[[-w/2,-d/2],[w/2,-d/2],[w/2,d/2],[-w/2,d/2]]
      .map(q=>[x+q[0]*c-q[1]*s, y+q[0]*s+q[1]*c, z]);
    return p;
  };

  const pkind=pick(PLANS), pseed=rr(0.25,0.5);
  cfg.plan=pkind;
  if(kind==='PRISM'||kind==='DIAGRID'||kind==='XBRACE'){
    const d=W*rr(0.55,0.95);
    if(kind==='PRISM')
      archPrism(planShape(W,d,pkind,pseed),0,H,{stroke:INK,lw:1.0,fill:P[0],a:0.14,fh:fh});
    else
      archBox(-W/2,-d/2,0,W,d,H,{stroke:INK,lw:1.0,fill:P[0],a:0.14,fh:fh,bay:0.9});
    if(kind==='DIAGRID'){
      const n=8, seg2=Math.max(4,Math.round(H/(fh*4)));
      for(let s=0;s<seg2;s++){
        const z1=H*s/seg2, z2=H*(s+1)/seg2;
        for(let i=0;i<n;i++){
          const t1=i/n, t2=(i+1)/n;
          const pt=(t,z)=>{
            const per=2*(W+d), l=t*per;
            let x,y;
            if(l<W){ x=-W/2+l; y=-d/2; }
            else if(l<W+d){ x=W/2; y=-d/2+(l-W); }
            else if(l<2*W+d){ x=W/2-(l-W-d); y=d/2; }
            else { x=-W/2; y=d/2-(l-2*W-d); }
            return [x,y,z];
          };
          seg(pt(t1,z1),pt(t2,z2),{stroke:INK,lw:0.55,alpha:0.5,dt:1});
          seg(pt(t2,z1),pt(t1,z2),{stroke:INK,lw:0.55,alpha:0.5,dt:1});
        }
      }
      bump('DIAGRID',seg2*8);
    }
    if(kind==='XBRACE'){
      const seg2=Math.max(3,Math.round(H/(fh*6)));
      for(let s=0;s<seg2;s++){
        const z1=H*s/seg2, z2=H*(s+1)/seg2;
        seg([-W/2,-d/2,z1],[W/2,-d/2,z2],{stroke:INK,lw:0.9,alpha:0.62,dt:1});
        seg([W/2,-d/2,z1],[-W/2,-d/2,z2],{stroke:INK,lw:0.9,alpha:0.62,dt:1});
        seg([W/2,-d/2,z1],[W/2,d/2,z2],{stroke:INK,lw:0.9,alpha:0.5,dt:1});
        seg([W/2,d/2,z1],[W/2,-d/2,z2],{stroke:INK,lw:0.9,alpha:0.5,dt:1});
        poly([[-W/2,-d/2,z1],[W/2,-d/2,z1],[W/2,d/2,z1],[-W/2,d/2,z1]],
          {stroke:INK,lw:0.7,alpha:0.5,close:true,dt:1});
      }
      bump('BRACES',seg2*4);
    }
    for(const c of [[-W/2,-d/2],[W/2,-d/2],[W/2,d/2],[-W/2,d/2]])
      post(c[0],c[1],H,rr(1.2,3.0),0.16,{alpha:0.55,dt:2});
    bump('CROWN');
    return H+3.0;
  }
  if(kind==='SETBACK'){
    let w=W*1.5, d=W*1.15, z=0, i=0;
    while(z<H*0.92 && i<7){
      const hh=H*rr(0.10,0.22);
      archPrism(planShape(w,d,pkind,pseed),z,hh,
        {stroke:INK,lw:1.0,fill:i%2?P[0]:P[2],a:0.13,fh:fh,parapet:false});
      if(DLV>=2)                                   // setback terrace
        poly([[-w/2,-d/2,z+hh],[w/2,-d/2,z+hh],[w/2,d/2,z+hh],[-w/2,d/2,z+hh]],
          {stroke:INK,lw:0.6,alpha:0.5,close:true,dt:2});
      z+=hh; w*=rr(0.76,0.88); d*=rr(0.76,0.88); i++;
      bump('SETBACKS');
    }
    for(let k=0;k<5;k++)                             // stepped spire
      box(-w*0.18+k*0.02,-d*0.18+k*0.02,z+k*0.9,w*0.36-k*0.04,d*0.36-k*0.04,0.9,
        {stroke:INK,lw:0.7,alpha:0.55,hidden:false,dt:1});
    post(0,0,z+4.5,rr(2,4),0.14,{alpha:0.6,dt:1});
    return z+8;
  }
  if(kind==='TWIST'){
    const d=W*0.9, tw=rr(0.5,1.4);
    const basePl=planShape(W,d,pkind,pseed);
    for(let f=0;f<=fl;f++){
      const t=f/fl, rot=t*tw, z=t*H;
      const sc=(1-t*0.12);
      const p=rotPlan(basePl.map(q=>[q[0]*sc,q[1]*sc]),rot).map(q=>[q[0],q[1],z]);
      poly(p,{stroke:INK,lw:f%4?0.45:0.75,alpha:f%4?0.32:0.6,close:true,dt:f%4?2:1});
      if(f<fl){
        const s2=(1-(f+1)/fl*0.12);
        const q=rotPlan(basePl.map(r2=>[r2[0]*s2,r2[1]*s2]),(f+1)/fl*tw)
                  .map(r2=>[r2[0],r2[1],H*(f+1)/fl]);
        for(let k=0;k<p.length;k++) seg(p[k],q[k],{stroke:INK,lw:0.4,alpha:0.3,dt:2});
      }
      bump('PLATES');
    }
    post(0,0,H,rr(1.5,3),0.16,{alpha:0.55,dt:2});
    return H+3;
  }
  if(kind==='BUNDLE'){
    const n=ri(2,3), cw=W/n*1.35;
    const hs=[];
    for(let i=0;i<n;i++) for(let j=0;j<n;j++){
      if(ch(0.18)) continue;
      const x=(i-(n-1)/2)*cw, y=(j-(n-1)/2)*cw;
      const hh=H*rr(0.45,1.0);
      archBox(x-cw*0.46,y-cw*0.46,0,cw*0.92,cw*0.92,hh,
        {stroke:INK,lw:0.95,fill:P[(i+j)%P.length],a:0.13,fh:fh,bay:0.85});
      if(ch(0.5)) post(x,y,hh,rr(0.8,2.2),0.13,{alpha:0.5,dt:2});
      hs.push(hh); bump('TVBES');

    return Math.max(...hs)+2.4;
  }
  if(kind==='STACK'){

      const w=W*rr(0.7,1.25), d=W*rr(0.55,1.0);
      const ox=rr(-W*0.35,W*0.35), oy=rr(-W*0.3,W*0.3);
      const hh=H/boxes*rr(0.8,1.2);
      archPrism(rotPlan(planShape(w,d,ch(0.5)?pkind:'RECT',pseed),0,ox,oy),z,hh,
        {stroke:INK,lw:1.0,fill:i%2?P[0]:P[2],a:0.15,fh:fh,parapet:false});
      if(DLV>=2 && (Math.abs(ox)>W*0.18||Math.abs(oy)>W*0.18)){
        const px=ox>0?ox-w*0.4:ox+w*0.4, py=oy>0?oy-d*0.4:oy+d*0.4;
        post(px,py,0,z,0.2,{alpha:0.45,dt:2});    // the prop that makes it stand
      }
      z+=hh; bump('MODVLES');
    }
    post(0,0,0,z,0.55,{alpha:0.5,fill:P[3],a:0.16,dt:1});  // service core
    return z+1.5;
  }
  // TRIPOD
  const legs=3, sp=W*1.25, shaftZ=H*0.42;
  for(let i=0;i<legs;i++){
    const a=i/legs*6.2832;
    const bx=Math.cos(a)*sp, by=Math.sin(a)*sp;
    const line=[];
    for(let k=0;k<=6;k++){
      const t=k/6;
      line.push([bx*(1-t*t), by*(1-t*t), shaftZ*t]);
    }
    for(const off of [-0.22,0.22]){
      poly(line.map(p=>[p[0]+off,p[1],p[2]]),{stroke:INK,lw:0.9,alpha:0.65});
    }
    box(bx-0.5,by-0.5,0,1.0,1.0,0.4,{stroke:INK,lw:0.8,alpha:0.6,fill:P[3],a:0.16,hidden:false});
    bump('CRVRA');
  }
  archBox(-W*0.42,-W*0.42,shaftZ,W*0.84,W*0.84,H-shaftZ,
    {stroke:INK,lw:1.0,fill:P[0],a:0.14,fh:fh,bay:0.85});
  for(let k=0;k<3;k++)                                   // observation collar
    ring(0,0,H*rr(0.72,0.95),W*rr(0.6,0.85),18,{stroke:INK,lw:0.6,alpha:0.5,dt:2});
  post(0,0,H,rr(2,4),0.16,{alpha:0.55,dt:2});
  bump('SHAFT');
  return H+4;
}

function icosphere(freq){
  const t=(1+Math.sqrt(5))/2;
  const V=[[-1,t,0],[1,t,0],[-1,-t,0],[1,-t,0],[0,-1,t],[0,1,t],[0,-1,-t],[0,1,-t],
           [t,0,-1],[t,0,1],[-t,0,-1],[-t,0,1]].map(v=>{const l=Math.hypot(...v);return v.map(c=>c/l);});
  const F=[[0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],[1,5,9],[5,11,4],[11,10,2],[10,7,6],
           [7,1,8],[3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],[4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]];
  const E=new Map(), f=v=>v.map(c=>c.toFixed(4)).join(',');
  const key=(a,b)=>{const ka=f(a),kb=f(b);return ka<kb?ka+'|'+kb:kb+'|'+ka;};
  const nrm=v=>{const l=Math.hypot(...v);return v.map(c=>c/l);};
  for(const fc of F){
    const A=V[fc[0]],B=V[fc[1]],C=V[fc[2]], g=[];
    for(let i=0;i<=freq;i++){ g[i]=[];
      for(let j=0;j<=i;j++){ const a=(freq-i)/freq,b=(i-j)/freq,c=j/freq;
        g[i][j]=nrm([A[0]*a+B[0]*b+C[0]*c,A[1]*a+B[1]*b+C[1]*c,A[2]*a+B[2]*b+C[2]*c]); } }
    for(let i=0;i<freq;i++) for(let j=0;j<=i;j++){
      const p=g[i][j],q=g[i+1][j],r=g[i+1][j+1];
      for(const [u,v] of [[p,q],[q,r],[r,p]]) E.set(key(u,v),[u,v]);
    }
  }
  return [...E.values()];
}
function truncIcosa(){
  const p=(1+Math.sqrt(5))/2, V=[];
  const cyc=(a,b,c)=>[[a,b,c],[b,c,a],[c,a,b]];
  for(const s of [[0,1,3*p],[1,2+p,2*p],[p,2,2*p+1]]){
    for(const t of cyc(s[0],s[1],s[2]))
      for(let sx=-1;sx<=1;sx+=2) for(let sy=-1;sy<=1;sy+=2) for(let sz=-1;sz<=1;sz+=2){
        const v=[t[0]*sx,t[1]*sy,t[2]*sz];
        if(!V.some(w=>Math.hypot(w[0]-v[0],w[1]-v[1],w[2]-v[2])<1e-6)) V.push(v);
      }
  }
  let mn=1e9;
  for(let i=0;i<V.length;i++) for(let j=i+1;j<V.length;j++)
    mn=Math.min(mn,Math.hypot(V[i][0]-V[j][0],V[i][1]-V[j][1],V[i][2]-V[j][2]));
  const E=[], L=Math.hypot(...V[0]);
  for(let i=0;i<V.length;i++) for(let j=i+1;j<V.length;j++){
    const d=Math.hypot(V[i][0]-V[j][0],V[i][1]-V[j][1],V[i][2]-V[j][2]);
    if(d<mn*1.06) E.push([V[i].map(c=>c/L),V[j].map(c=>c/L)]);
  }
  return E;
}

    bump('MASTS'); }

             [rr(0,0.9),rr(-0.3,0.9),rr(4,5.4),rr(1.7,2.2),truncIcosa()]];
  for(const [sx,sy,sz,rad,E] of sph){

        {stroke:INK,lw:0.6,alpha:0.6});

  const px=rr(2.6,3.6), py=rr(-0.6,0.6), ph=rr(7.5,10);

  bump('FOOTINGS',ri(12,22)); bump('SHELTERS',ri(3,6));

function sysModernisme(cfg){
  const P=cfg.pal.c;
  const nCol=ri(10,16), baseR=rr(2.6,3.4), topR=rr(0.8,1.4), hgt=rr(14,20);
  const lvl=ri(4,7);
  for(let i=0;i<nCol;i++){
    const a=i/nCol*6.2832+rr(-0.05,0.05);
    const bx=Math.cos(a)*baseR, by=Math.sin(a)*baseR;
    const tx=Math.cos(a)*topR*rr(0.85,1.15), ty=Math.sin(a)*topR*rr(0.85,1.15);
    const L=[], sg=9;
    for(let s=0;s<=sg;s++){ const t=s/sg, e=Math.pow(t,1.35);
      L.push([bx+(tx-bx)*e+(s?jr(0.12):0), by+(ty-by)*e+(s?jr(0.12):0), hgt*t]); }
    const off=0.26;
    poly(L.map(p=>[p[0]+off,p[1],p[2]]),{stroke:INK,lw:1.0,alpha:0.78});
    poly(L.map(p=>[p[0]-off,p[1],p[2]]),{stroke:INK,lw:1.0,alpha:0.78});
    if(ch(0.5)){ const bi=Math.round(sg*rr(0.45,0.7)), p0=L[bi], ba=a+rr(-0.7,0.7);
      poly([p0,[p0[0]+Math.cos(ba)*1.0,p0[1]+Math.sin(ba)*1.0,p0[2]+hgt*0.16]],{stroke:INK,lw:0.9,alpha:0.65});
      bump('COLUMNS'); }
    bump('COLUMNS');
  }
  for(let f=1;f<=lvl;f++){
    const t=f/lvl, z=hgt*t*0.82, rad=baseR+(topR-baseR)*Math.pow(t,1.35);
    ring(0,0,z,rad,nCol,{stroke:INK,lw:0.8,alpha:0.55}); bump('VAULTS');
    for(let i=0;i<nCol;i++){
      if(!ch(0.5)) continue;
      const a=i/nCol*6.2832,b=(i+1)/nCol*6.2832, hh=hgt*0.09;
      quad([[Math.cos(a)*rad,Math.sin(a)*rad,z],[Math.cos(b)*rad,Math.sin(b)*rad,z],
            [Math.cos(b)*rad,Math.sin(b)*rad,z+hh],[Math.cos(a)*rad,Math.sin(a)*rad,z+hh]],
        {stroke:INK,lw:0.7,fill:pick(P),a:0.34,sh:1});
      bump('MOSAIC');
    }
  }
  const cz=hgt*0.86;
  for(let k=0;k<ri(3,6);k++){
    const a=rr(0,6.2832), rad=topR*rr(0.2,1.0);
    const sx=Math.cos(a)*rad, sy=Math.sin(a)*rad, sh=hgt*rr(0.16,0.30);
    poly([[sx-0.22,sy,cz],[sx,sy,cz+sh]],{stroke:P[0],lw:1.5,alpha:0.8});
    poly([[sx+0.22,sy,cz],[sx,sy,cz+sh]],{stroke:P[0],lw:1.5,alpha:0.8});
    poly([[sx-0.18,sy,cz+sh*0.86],[sx,sy,cz+sh*0.72],[sx+0.18,sy,cz+sh*0.86],[sx,sy,cz+sh*0.98]],
      {stroke:INK,lw:0.9,alpha:0.8,close:true,fill:INK,a:0.5});
    bump('PORTA');
  }
  for(let k=0;k<ri(6,14);k++){
    const a1=rr(0,6.2832), a2=a1+rr(0.6,2.2);
    const z1=hgt*rr(0.35,0.85), z2=hgt*rr(0.2,0.6);
    const r1=baseR+(topR-baseR)*(z1/hgt), r2=baseR+(topR-baseR)*(z2/hgt);
    const A=[Math.cos(a1)*r1,Math.sin(a1)*r1,z1];
    const B=[Math.cos(a2)*(r2+rr(1,4)),Math.sin(a2)*(r2+rr(1,4)),z2*rr(0.3,0.7)];
    const cur=[], sag=rr(0.8,2.2);
    for(let s=0;s<=10;s++){const t=s/10;
      cur.push([A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t-sag*Math.sin(Math.PI*t)]);}
    poly(cur,{stroke:INK,lw:0.65,alpha:0.5}); bump('CATENARY');
  }
  bump('RULED',ri(14,26)); bump('WAVEWALL',ri(6,14)); bump('CHIMNEY',ri(6,14));
  bump('PAVILION',ri(2,5)); bump('CERAMIC',ri(3,9));
  archBox(-baseR*1.2,-baseR*1.2,0,baseR*2.4,baseR*2.4,hgt*0.13,
    {stroke:INK,lw:1.0,fill:P[2],a:0.20,fh:1.2,bay:1.0});
  groundWorks(0,0,baseR*1.15,{fill:P[1]});
  return hgt*1.16;

/* ---- NEW: ZIGGURAT — asymmetric setback mass ---- */
function sysZiggurat(cfg){
  const P=cfg.pal.c, lv=ri(4,9);
  const zk=pick(PLANS), zs=rr(0.25,0.5); cfg.plan=zk;
  let w=rr(7.5,9.5), z=0, px=-w/2, py=-w/2;
  for(let i=0;i<lv;i++){
    const h=rr(1.0,2.4);
    if(zk==='RECT') archBox(px,py,z,w,w,h,{stroke:INK,lw:1.05,fill:i%2?P[0]:P[2],
      a:0.15+0.04*(i%2),fh:0.8,bay:1.1});
    else archPrism(rotPlan(planShape(w,w,zk,zs),0,px+w/2,py+w/2),z,h,
      {stroke:INK,lw:1.05,fill:i%2?P[0]:P[2],a:0.15+0.04*(i%2),fh:0.8,parapet:false});
    bump('TIERS');
    if(DLV>=2 && i>0){                       // terrace planting on the setback
      for(let q=0;q<ri(2,5);q++){
        const tx=px+rr(0.2,w-0.2), ty=py+rr(0.2,w-0.2);
        seg([tx,ty,z],[tx,ty,z+0.5],{stroke:INK,lw:0.5,alpha:0.4,dt:3});
        poly([[tx-0.28,ty,z+0.5],[tx,ty,z+0.85],[tx+0.28,ty,z+0.5]],
          {stroke:INK,lw:0.45,alpha:0.35,close:true,dt:3});
      }
    }
    // slot / colonnade on the long face
    const n=Math.max(2,Math.round(w*0.9));
    for(let k=0;k<n;k++){
      const ux=px+w*(k+0.5)/n;
      seg([ux,py+w,z+h*0.15],[ux,py+w,z+h*0.85],{stroke:INK,lw:0.55,alpha:0.4});
      bump('SLOTS');
    }
    const shrink=rr(0.62,0.84);
    const nw=w*shrink;
    px += (w-nw)*rr(0.05,0.95); py += (w-nw)*rr(0.05,0.95);
    z += h;                                 // tiers stack without gaps
    if(ch(0.22)) bump('VOIDS');

  }

  post(px+w/2,py+w/2,z,rr(2,5),0.2,{alpha:0.7,dt:1});
  bump('MASTS');
  groundWorks(0,0,4.2,{fill:P[2]}); bump('RAMPS',ri(2,6)); bump('PLINTH',ri(1,3)); bump('CORNICE',lv);
  bump('STAIRS',ri(3,9)); bump('PARAPET',ri(2,6));
  return z+5;
}

/* ---- NEW: PLUG-IN — metabolist frame with capsule pods ---- */
function sysPlugin(cfg){
  const P=cfg.pal.c;
  const cores=ri(1,2), H=rr(12,18), gx=rr(1.5,2.2), gz=rr(1.6,2.3);
  const cpos=[];
  for(let c=0;c<cores;c++){

    archBox(x-0.7,y-0.7,0,1.4,1.4,H,{stroke:INK,lw:1.1,fill:P[3],a:0.2,fh:1.0,bay:0.7,parapet:false});
    cpos.push([x,y]); bump('CORES');
  }
  // orthogonal cage
  const nx=3, ny=2, nz=Math.round(H/gz);
  const nodes=[];
  for(let i=0;i<=nx;i++) for(let j=0;j<=ny;j++){
    const x=(i-nx/2)*gx, y=(j-ny/2)*gx;
    post(x,y,0,H,0.14,{alpha:0.45,dt:1}); bump('FRAME');
    for(let k=0;k<=nz;k++) nodes.push([x,y,k*gz]);
  }
  for(let k=0;k<=nz;k++){
    const z=k*gz;
    for(let j=0;j<=ny;j++) seg([-nx/2*gx,(j-ny/2)*gx,z],[nx/2*gx,(j-ny/2)*gx,z],{stroke:INK,lw:0.6,alpha:0.42});
    for(let i=0;i<=nx;i++) seg([(i-nx/2)*gx,-ny/2*gx,z],[(i-nx/2)*gx,ny/2*gx,z],{stroke:INK,lw:0.6,alpha:0.42});
    bump('TRUSS',2);
  }
  // capsules
  const pods=ri(14,30);
  for(let p=0;p<pods;p++){
    const n=nodes[Math.floor(R()*nodes.length)];
    if(n[2]<gz*0.8) continue;
    const dir=ri(0,3), L=rr(1.2,2.2), s=rr(0.5,0.85);
    let x=n[0], y=n[1];
    if(dir===0) x+=L*0.5; else if(dir===1) y+=L*0.5;
    else if(dir===2) x-=L*0.5; else y-=L*0.5;
    const w=(dir%2===0)?L:s*1.6, d=(dir%2===0)?s*1.6:L;
    const pc=pick(P);
    box(x-w/2,y-d/2,n[2]-s*0.5,w,d,s*1.5,{stroke:INK,lw:0.85,fill:pc,a:0.36});
    if(DLV>=2){                               // capsule ribs + docking collar
      for(let q=1;q<3;q++){
        const zz=n[2]-s*0.5+s*1.5*q/3;
        seg([x+w/2,y-d/2,zz],[x+w/2,y+d/2,zz],{stroke:INK,lw:0.4,alpha:0.3,dt:3});
      }
      seg([n[0],n[1],n[2]],[x,y,n[2]],{stroke:INK,lw:0.6,alpha:0.45,dt:2});
    }
    // porthole
    poly([[x-w/2,y-d/2+d*0.5-0.18,n[2]-0.18],[x-w/2,y-d/2+d*0.5+0.18,n[2]-0.18],
          [x-w/2,y-d/2+d*0.5+0.18,n[2]+0.18],[x-w/2,y-d/2+d*0.5-0.18,n[2]+0.18]],
      {stroke:INK,lw:0.5,alpha:0.45,close:true});
    bump('CAPSULES');
  }
  bump('SERVICE',ri(4,10)); bump('CONDUIT',ri(6,16)); bump('JOINTS',nodes.length);
  bump('CRANE',ri(1,2)); bump('CHUTES',ri(2,6));
  // service crane
  const cx=nx/2*gx+rr(0.5,1.2);
  seg([cx,0,0],[cx,0,H+rr(1,3)],{stroke:INK,lw:1.0,alpha:0.7});
  seg([cx,0,H+2],[cx-rr(3,5),0,H+2],{stroke:INK,lw:0.9,alpha:0.65});
  return H+4;
}

/* ---- NEW: SUSPENDED — hung floor plates ---- */

  for(let i=0;i<4;i++){
    const a=i*Math.PI/2+Math.PI/4;
    const x=Math.cos(a)*hr, y=Math.sin(a)*hr;
    poly([[0,0,H],[x,y,H-1.4],[x,y,H+0.5],[0,0,H+1.6]],{stroke:INK,lw:0.9,alpha:0.7,close:true});
    bump('HANGERS');
  }
  const fl=ri(4,8), gap=rr(1.4,2.1), z0=H-rr(1.8,2.6);
  for(let f=0;f<fl;f++){
    const z=z0-f*gap;
    if(z<1.2) break;
    const w=hr*(0.75+0.55*(f/fl))*rr(0.92,1.08);
    prism(planShape(w*2,w*2,spk,0.4),z,0.32,{stroke:INK,lw:1.0,fill:P[0],a:0.20}); bump('PLATES');
    if(DLV>=2){                                // glazed storey hung under the plate
      const gh=gap*0.62;
      archBox(-w*0.94,-w*0.94,z-gh,w*1.88,w*1.88,gh,
        {stroke:INK,lw:0.6,alpha:0.4,fh:gh,bay:0.8,parapet:false});
    }
    for(let i=0;i<4;i++){
      const a=i*Math.PI/2+Math.PI/4;
      seg([Math.cos(a)*hr,Math.sin(a)*hr,H-1.2],[Math.cos(a)*w*1.34,Math.sin(a)*w*1.34,z],
        {stroke:INK,lw:0.6,alpha:0.5}); bump('CABLES');
    }
    if(ch(0.4)){
      const n=Math.max(3,Math.round(w*2));
      for(let k=0;k<n;k++) seg([-w+2*w*(k+0.5)/n,w,z+0.18],[-w+2*w*(k+0.5)/n,w,z+gap*0.55],
        {stroke:INK,lw:0.5,alpha:0.35});
      bump('MULLIONS',n);
    }
  }
  bump('TIE',ri(4,10)); bump('PODIUM',1); bump('ANCHOR',4); bump('LIFTS',ri(2,4));
  box(-hr*1.15,-hr*1.15,0,hr*2.3,hr*2.3,0.5,{stroke:INK,lw:1.0,fill:P[2],a:0.16});
  groundWorks(0,0,hr*1.0,{fill:P[0]});
  return H+3;
}

/* ---- NEW: VAULT — barrel vault series ---- */
function sysVault(cfg){
  const P=cfg.pal.c, n=ri(3,6), span=rr(1.5,2.2), len=rr(7,10);
  const lift=rr(0.9,1.6);
  for(let v=0;v<n;v++){
    const x=(v-(n-1)/2)*span*2.05;
    const L=len*rr(0.6,1.0), z0=rr(1.2,2.6);
    // piers
    for(const sx of [-1,1]) for(const sy of [-1,1]){
      box(x+sx*span-0.2,sy*L/2-0.2,0,0.4,0.4,z0,{stroke:INK,lw:0.9,fill:P[3],a:0.18});
      if(DLV>=2){                              // capital + base mouldings
        for(const zz of [z0-0.22,0.22])
          poly([[x+sx*span-0.32,sy*L/2-0.32,zz],[x+sx*span+0.32,sy*L/2-0.32,zz],
                [x+sx*span+0.32,sy*L/2+0.32,zz],[x+sx*span-0.32,sy*L/2+0.32,zz]],
            {stroke:INK,lw:0.5,alpha:0.4,close:true,dt:2});
      }
    }
    // ribs
    const ribs=Math.max(3,Math.round(L/0.9));
    for(let r=0;r<=ribs;r++){
      const y=-L/2+L*r/ribs, arc=[];
      for(let k=0;k<=12;k++){ const a=Math.PI*k/12;
        arc.push([x-Math.cos(a)*span, y, z0+Math.sin(a)*span*lift]); }
      poly(arc,{stroke:INK,lw:(r===0||r===ribs)?1.05:0.6,alpha:(r===0||r===ribs)?0.8:0.45});
      bump('RIBS');
    }
    // longitudinals
    for(let k=0;k<=12;k+=2){ const a=Math.PI*k/12;
      seg([x-Math.cos(a)*span,-L/2,z0+Math.sin(a)*span*lift],
          [x-Math.cos(a)*span, L/2,z0+Math.sin(a)*span*lift],{stroke:INK,lw:0.55,alpha:0.4});
      bump('COURSES');
    }
    // end infill
    quad([[x-span,-L/2,z0],[x+span,-L/2,z0],[x+span,-L/2,z0+span*lift*0.55],[x-span,-L/2,z0+span*lift*0.55]],
      {stroke:INK,lw:0.8,fill:P[v%P.length],a:0.26});
    bump('BAYS'); bump('OCULUS',ri(0,2));
  }
  groundWorks(0,0,span*2.2,{fill:P[1]});
  bump('ABUTMENT',ri(4,10)); bump('SPANDREL',ri(3,8)); bump('CLERESTORY',ri(2,6));
  bump('APSE',ri(0,2)); bump('NARTHEX',ri(1,3));
  return rr(4,6.5);
}

/* ---- NEW: SILO — cylinder cluster + gantries ---- */
function sysSilo(cfg){
  const P=cfg.pal.c, n=ri(4,9), tops=[];
  for(let i=0;i<n;i++){
    const a=i/n*6.2832+rr(-0.15,0.15), rad=(i%2? rr(1.6,2.6):rr(2.6,3.6));
    const x=Math.cos(a)*rad, y=Math.sin(a)*rad;
    const r=rr(0.8,1.5), h=rr(5,13);
    cyl(x,y,0,r,h,{seg:14,rings:ri(2,4),lw:0.65,alpha:0.45});
    if(ch(0.55)) cone(x,y,h,r,rr(0.7,1.6));
    else ring(x,y,h+0.25,r*0.6,14,{stroke:INK,lw:0.7,alpha:0.6});
    quad([[x-r,y-r,0.02],[x+r,y-r,0.02],[x+r,y+r,0.02],[x-r,y+r,0.02]],{stroke:INK,lw:0.6,alpha:0.35});
    tops.push([x,y,h,r]); bump('VESSELS'); bump('HOOPS',ri(2,4));
  }
  // gantries between tall neighbours
  tops.sort((a,b)=>b[2]-a[2]);
  for(let i=0;i<Math.min(tops.length-1,ri(2,4));i++){
    const A=tops[i], B=tops[i+1], z=Math.min(A[2],B[2])*rr(0.75,0.95);
    seg([A[0],A[1],z],[B[0],B[1],z],{stroke:INK,lw:0.9,alpha:0.65});
    seg([A[0],A[1],z+0.5],[B[0],B[1],z+0.5],{stroke:INK,lw:0.6,alpha:0.45});
    bump('GANTRY');
  }
  // annex
  const aw=rr(2.5,4.5), ad=rr(1.6,2.6);
  const axp=rr(-4,1), ayp=rr(-4.5,-3), ah=rr(1.6,3);
  archBox(axp,ayp,0,aw,ad,ah,{stroke:INK,lw:1.0,fill:P[1],a:0.22,fh:0.8,bay:0.8});
  bump('ANNEX'); bump('DUCTS',ri(4,12)); bump('VALVES',ri(6,18));
  bump('STACKS',ri(1,4)); bump('HOPPER',ri(2,6));
  return tops[0][2]+3;
}

/* ============================================================
   EXPO 1970 — pneumatic, tensile, space-frame, capsule and
   ruled-surface structures
   ============================================================ */

/* ---- PNEVMA: air-inflated tubes / air-supported membrane ---- */
function sysPneuma(cfg){
  const P=cfg.pal.c;
  const tubes=ch(0.55);
  if(tubes){
    // a bundle of inflated arch tubes over a circular plan
    const n=ri(11,17), R=rr(5.4,6.8), tr=rr(0.34,0.52);
    for(let i=0;i<n;i++){
      const y=(-1+2*i/(n-1))*R*0.92;
      const c=Math.sqrt(Math.max(0.4,R*R-y*y));      // half chord
      const h=c*rr(0.95,1.1);
      const mid=[],up=[],dn=[];
      for(let k=0;k<=16;k++){
        const t=Math.PI*k/16;
        const x=-Math.cos(t)*c, z=Math.sin(t)*h;
        mid.push([x,y,z]); up.push([x,y,z+tr]); dn.push([x,y,Math.max(0.04,z-tr)]);
      }
      poly(up,{stroke:INK,lw:0.85,alpha:0.7});
      poly(dn,{stroke:INK,lw:0.7,alpha:0.5});
      // inflated section rings
      for(let k=0;k<=16;k+=2){
        const p=mid[k];
        const rg=[];
        for(let q=0;q<=12;q++){
          const a=q/12*6.2832;
          rg.push([p[0]+Math.cos(a)*tr*0.15,p[1]+Math.sin(a)*tr,p[2]+Math.cos(a)*tr]);
        }
        poly(rg,{stroke:INK,lw:0.4,alpha:0.3,close:true,dt:2});
      }
      // anchorage
      for(const sg of [-1,1])
        box(sg*c-0.32,y-tr*0.9,0,0.64,tr*1.8,0.45,
          {stroke:INK,lw:0.6,alpha:0.55,fill:P[3],a:0.16,hidden:false,dt:1});
      bump('TVBI');
    }
    if(DLV>=2) for(let k=0;k<ri(3,6);k++){          // binding straps
      const t=Math.PI*rr(0.15,0.85), strap=[];
      for(let i=0;i<n;i++){
        const y=(-1+2*i/(n-1))*R*0.92;
        const c=Math.sqrt(Math.max(0.4,R*R-y*y));
        strap.push([-Math.cos(t)*c,y,Math.sin(t)*c*1.02]);
      }
      poly(strap,{stroke:INK,lw:0.5,alpha:0.4,dt:2});
      bump('CINCTVRA');
    }
    // deck and air locks
    ring(0,0,0.03,R,36,{stroke:INK,lw:0.9,alpha:0.6});
    for(const sg of [-1,1]) cyl(sg*R*0.86,0,0,0.7,1.3,{seg:10,rings:1,lw:0.6,alpha:0.5});
    bump('CAMERA',2); bump('BLOWER',ri(2,4)); bump('MEMBRANA',n);
    return R*1.15;
  }
  // air-supported membrane on a compression ring
  const A=rr(6.0,7.6), B=A*rr(0.62,0.82), h=A*rr(0.36,0.5);
  for(let i=0;i<20;i++){                            // cable net, first family
    const t=-1+2*i/19, arc=[];
    for(let k=0;k<=18;k++){
      const u=-1+2*k/18;
      const rr2=Math.max(0,1-t*t-u*u*0.0);
      const zz=h*Math.sqrt(Math.max(0,1-t*t-u*u));
      if(zz<=0) continue;
      arc.push([u*A,t*B,zz+0.5]);
    }
    if(arc.length>1) poly(arc,{stroke:INK,lw:0.5,alpha:0.45,dt:i%2?2:1});
  }
  for(let i=0;i<20;i++){
    const u=-1+2*i/19, arc=[];
    for(let k=0;k<=18;k++){
      const t=-1+2*k/18;
      const zz=h*Math.sqrt(Math.max(0,1-t*t-u*u));
      if(zz<=0) continue;
      arc.push([u*A,t*B,zz+0.5]);
    }
    if(arc.length>1) poly(arc,{stroke:INK,lw:0.5,alpha:0.45,dt:i%2?2:1});
  }
  const cr=[];
  for(let i=0;i<=40;i++){ const a=i/40*6.2832; cr.push([Math.cos(a)*A,Math.sin(a)*B,0.5]); }
  poly(cr,{stroke:INK,lw:1.1,alpha:0.75,close:true});
  poly(cr.map(p=>[p[0],p[1],0]),{stroke:INK,lw:0.8,alpha:0.5,close:true});
  for(let i=0;i<24;i++){
    const a=i/24*6.2832;
    seg([Math.cos(a)*A,Math.sin(a)*B,0],[Math.cos(a)*A,Math.sin(a)*B,0.5],
      {stroke:INK,lw:0.5,alpha:0.4,dt:2});
  }
  for(const sg of [-1,1]) cyl(sg*A*0.98,0,0,0.75,1.4,{seg:10,rings:1,lw:0.6,alpha:0.5});
  bump('MEMBRANA',40); bump('CAMERA',2); bump('BLOWER',ri(3,6)); bump('ANVLVS',1);
  return h+1.2;
}

/* ---- TENSILE: masts, cable net, catenary edges ---- */
function sysTensile(cfg){
  const P=cfg.pal.c;
  const nM=ri(3,6), Ra=rr(6.4,8.4);
  const masts=[];
  for(let i=0;i<nM;i++){
    const a=i/nM*6.2832+rr(-0.3,0.3), d=rr(0.6,2.6);
    masts.push({x:Math.cos(a)*d, y:Math.sin(a)*d, h:rr(7,12)});
  }
  const nA=ri(6,9), anch=[];
  for(let i=0;i<nA;i++){
    const a=i/nA*6.2832+rr(-0.12,0.12);
    anch.push({x:Math.cos(a)*Ra*rr(0.9,1.1), y:Math.sin(a)*Ra*rr(0.9,1.1), h:rr(0.4,1.2)});
  }
  const surf=(x,y)=>{
    let z=0.2, wsum=0.001, acc=0;
    for(const m of masts){
      const d=Math.hypot(x-m.x,y-m.y);
      const w=1/(0.4+d*d*0.5);
      acc+=m.h*w*Math.exp(-d*0.28); wsum+=w;
    }
    z=acc/wsum;
    const dr=Math.hypot(x,y)/Ra;
    return Math.max(0.3, z*(1-Math.pow(Math.min(1,dr),2.2))+0.5);
  };
  const NR=DLV>=2?11:8, NA=DLV>=2?26:18;
  for(let i=1;i<=NR;i++){
    const rad=Ra*i/NR, line=[];
    for(let k=0;k<=NA;k++){
      const a=k/NA*6.2832;
      line.push([Math.cos(a)*rad,Math.sin(a)*rad,surf(Math.cos(a)*rad,Math.sin(a)*rad)]);
    }
    poly(line,{stroke:INK,lw:i%3?0.42:0.6,alpha:i%3?0.32:0.5,close:true,dt:i%3?2:1});
  }
  for(let k=0;k<NA;k++){
    const a=k/NA*6.2832, line=[];
    for(let i=0;i<=NR;i++){
      const rad=Ra*i/NR;
      line.push([Math.cos(a)*rad,Math.sin(a)*rad,surf(Math.cos(a)*rad,Math.sin(a)*rad)]);
    }
    poly(line,{stroke:INK,lw:k%3?0.42:0.6,alpha:k%3?0.32:0.5,dt:k%3?2:1});
    bump('RETE');
  }
  // masts through the membrane, with head rings and guys
  for(const m of masts){
    post(m.x,m.y,0,m.h+0.8,0.24,{alpha:0.65,fill:P[3],a:0.18,dt:1});
    ring(m.x,m.y,m.h,0.5,10,{stroke:INK,lw:0.6,alpha:0.55,dt:1});
    for(let k=0;k<4;k++){
      const a=k/4*6.2832+0.6, d=rr(2.2,4.0);
      seg([m.x,m.y,m.h+0.7],[m.x+Math.cos(a)*d,m.y+Math.sin(a)*d,0],
        {stroke:INK,lw:0.4,alpha:0.35,dt:2});
    }
    bump('MALVS');
  }
  // catenary edge cable through the anchors
  const edge=[];
  for(let k=0;k<=nA;k++){
    const a1=anch[k%nA], a2=anch[(k+1)%nA];
    for(let q=0;q<6;q++){
      const t=q/6;
      const x=a1.x+(a2.x-a1.x)*t, y=a1.y+(a2.y-a1.y)*t;
      edge.push([x,y,a1.h+(a2.h-a1.h)*t+Math.sin(t*Math.PI)*0.9]);
    }
  }
  poly(edge,{stroke:INK,lw:0.85,alpha:0.65,close:true});
  for(const a of anch){
    box(a.x-0.3,a.y-0.3,0,0.6,0.6,a.h,{stroke:INK,lw:0.6,alpha:0.55,fill:P[3],a:0.16,hidden:false});
    bump('ANCORA');
  }
  bump('MEMBRANA',NR*NA/6|0); bump('FVNES',nA*3);
  return Math.max(...masts.map(m=>m.h))+1.2;
}

/* ---- BIG ROOF: a double-layer space frame on giant columns ---- */
function sysSpaceFrame(cfg){
  const P=cfg.pal.c;
  const W=rr(12,15.5), Dp=rr(7.5,10), H=rr(9,13), th=rr(1.1,1.7);
  const cx=Math.max(4,Math.round(W/1.5)), cy=Math.max(3,Math.round(Dp/1.5));
  const gx=W/cx, gy=Dp/cy;
  const top=(i,j)=>[-W/2+i*gx, -Dp/2+j*gy, H+th];
  const bot=(i,j)=>[-W/2+(i+0.5)*gx, -Dp/2+(j+0.5)*gy, H];
  for(let i=0;i<=cx;i++) for(let j=0;j<=cy;j++){
    if(i<cx) seg(top(i,j),top(i+1,j),{stroke:INK,lw:0.55,alpha:0.5});
    if(j<cy) seg(top(i,j),top(i,j+1),{stroke:INK,lw:0.55,alpha:0.5});
  }
  for(let i=0;i<cx;i++) for(let j=0;j<cy;j++){
    if(i<cx-1) seg(bot(i,j),bot(i+1,j),{stroke:INK,lw:0.45,alpha:0.38,dt:1});
    if(j<cy-1) seg(bot(i,j),bot(i,j+1),{stroke:INK,lw:0.45,alpha:0.38,dt:1});
    for(const [a,b] of [[i,j],[i+1,j],[i,j+1],[i+1,j+1]])
      seg(bot(i,j),top(a,b),{stroke:INK,lw:0.35,alpha:0.26,dt:2});
    bump('NODI');
  }
  // six lattice columns
  const cols=[[-W*0.42,-Dp*0.34],[0,-Dp*0.34],[W*0.42,-Dp*0.34],
              [-W*0.42, Dp*0.34],[0, Dp*0.34],[W*0.42, Dp*0.34]];
  for(const [x,y] of cols){
    const r=0.55;
    for(let k=0;k<6;k++){
      const a=k/6*6.2832;
      post(x+Math.cos(a)*r,y+Math.sin(a)*r,0,H,0.19,{alpha:0.55,fill:P[3],a:0.1,dt:1});
    }
    for(let z=0.8;z<H;z+=1.1) ring(x,y,z,r,12,{stroke:INK,lw:0.4,alpha:0.3,dt:2});
    box(x-0.9,y-0.9,-0.2,1.8,1.8,0.35,{stroke:INK,lw:0.7,alpha:0.5,hidden:false,dt:1});
    bump('COLVMNAE');
  }
  // capsules plugged into the frame
  for(let k=0;k<ri(6,14);k++){
    const i=ri(0,cx-1), j=ri(0,cy-1);
    const b=bot(i,j), s=rr(0.6,1.1), below=ch(0.6);
    box(b[0]-s,b[1]-s*0.7,below?b[2]-s*1.7:H+th,s*2,s*1.4,s*1.5,
      {stroke:INK,lw:0.8,alpha:0.6,fill:pick(P),a:0.34,hidden:false});
    if(below) seg([b[0],b[1],b[2]],[b[0],b[1],b[2]-s*0.3],{stroke:INK,lw:0.5,alpha:0.4});
    bump('CAPSVLAE');
  }
  // the totem that pierces the roof
  const tz=H+th;
  cyl(0,0,0,1.0,tz+rr(2.5,4.5),{seg:10,rings:4,lw:0.6,alpha:0.5});
  for(const zz of [tz*0.42,tz*0.78,tz+1.6]){
    const rr2=zz>tz?1.7:1.3;
    for(let i=0;i<10;i++){
      const a=i/10*6.2832;
      seg([0,0,zz],[Math.cos(a)*rr2,Math.sin(a)*rr2,zz+rr(-0.3,0.4)],{stroke:INK,lw:0.45,alpha:0.4,dt:2});
    }
    ring(0,0,zz,rr2,16,{stroke:INK,lw:0.55,alpha:0.5,dt:1});
  }
  for(const sg of [-1,1])                              // outstretched arms
    poly([[0,0,tz*0.72],[sg*3.2,0,tz*0.86],[sg*3.6,0,tz*0.64]],
      {stroke:INK,lw:0.8,alpha:0.6,fill:P[0],a:0.22});
  bump('TOTEM'); bump('TRABES',cx*cy*2); bump('PLATEA',1);
  return tz+5.0;
}

/* ---- CAPSVLA: bent-pipe frames with inserted units ---- */
function sysCapsuleFrame(cfg){
  const P=cfg.pal.c;
  const nx=ri(4,5), nz=ri(4,6), sp=rr(2.2,2.8), fh=rr(2.0,2.5);
  const dep=rr(4.6,6.4), pr2=0.2;
  // staple frames: a bent pipe per bay, repeated in depth
  for(let i=0;i<=nx;i++){
    const x=(i-nx/2)*sp;
    for(let d=0;d<=1;d++){
      const y=(d-0.5)*dep;
      const line=[];
      line.push([x,y,0]);
      for(let k=0;k<=nz;k++) line.push([x,y,k*fh]);
      poly(line,{stroke:INK,lw:0.9,alpha:0.65,dt:1});
    }
    for(let k=0;k<=nz;k++){                       // the bend across the top of each bay
      const z=k*fh, curve=[];
      for(let q=0;q<=8;q++){
        const t=q/8;
        curve.push([x, -dep/2+dep*t, z]);
      }
      poly(curve,{stroke:INK,lw:0.7,alpha:0.5,dt:1});
    }
    bump('FISTVLAE');
  }
  // capsules inserted between the frames, some bays left void
  for(let i=0;i<nx;i++) for(let k=0;k<nz;k++){
    if(ch(0.24)){ bump('VACVVM'); continue; }
    const x=(i-nx/2)*sp+sp*0.5, z=k*fh;
    const out=ch(0.35)?rr(0.4,1.1):0;             // cantilevering units
    const w=sp*0.82, d2=dep*rr(0.6,0.9)+out, h=fh*0.86;
    box(x-w/2,-d2/2,z+fh*0.07,w,d2,h,
      {stroke:INK,lw:0.85,alpha:0.62,fill:pick(P),a:0.3,hidden:false,
       pat:(DLV>=2&&ch(0.4))?pick(TONES):null,patFace:1,pa:0.22});
    if(DLV>=2){                                    // round porthole
      const cxp=x, cz=z+fh*0.5;
      const rg=[];
      for(let q=0;q<=12;q++){ const a=q/12*6.2832;
        rg.push([cxp+Math.cos(a)*w*0.2, -d2/2, cz+Math.sin(a)*w*0.2]); }
      poly(rg,{stroke:INK,lw:0.45,alpha:0.45,close:true,dt:2});
    }
    bump('CAPSVLAE');
  }
  // service tower and gangways
  const tx=(nx/2+0.9)*sp;
  for(let k=0;k<4;k++){
    const a=k/4*6.2832+0.78;
    seg([tx+Math.cos(a)*0.5,Math.sin(a)*0.5,0],[tx+Math.cos(a)*0.5,Math.sin(a)*0.5,nz*fh+1.2],
      {stroke:INK,lw:0.6,alpha:0.55,dt:1});
  }
  for(let k=1;k<=nz;k++){
    ring(tx,0,k*fh,0.7,10,{stroke:INK,lw:0.45,alpha:0.4,dt:2});
    seg([tx,0,k*fh],[(nx/2)*sp,0,k*fh],{stroke:INK,lw:0.5,alpha:0.4,dt:1});
  }
  box(-nx/2*sp-0.6,-dep/2-0.6,-0.25,nx*sp+1.2,dep+1.2,0.3,
    {stroke:INK,lw:0.7,alpha:0.5,fill:P[3],a:0.14,hidden:false});
  bump('SCALAE',nz); bump('IVNCTVRAE',nx*nz); bump('PODIVM',1);
  return nz*fh+2.0;
}

/* ---- HYPERBOLOID: ruled-surface lattice towers ---- */
function sysHyperboloid(cfg){
  const P=cfg.pal.c;
  const n=ri(1,3), tops=[];
  for(let t=0;t<n;t++){
    const a0=rr(0,6.28), d=(n===1)?0:rr(3.2,5.4);
    const cx=Math.cos(a0)*d, cy=Math.sin(a0)*d;
    const R0=rr(2.6,3.8)/(n>1?1.35:1), R1=R0*rr(0.45,0.8), H=rr(11,16)/(n>1?1.2:1);
    const N=DLV>=2?18:12, tw=ri(4,7);
    const waist=rr(0.55,0.8);
    const rAt=z=>{
      const t2=z/H, w=0.42;
      return R0+(R1-R0)*t2 + (Math.abs(t2-w)<1?0:0) - Math.sin(Math.PI*Math.min(1,t2/w*0.5+0.5))*R0*(1-waist)*0.55;
    };
    for(let i=0;i<N;i++){
      for(const dir of [1,-1]){
        const a=i/N*6.2832, b=a+dir*tw/N*6.2832;
        const line=[];
        for(let k=0;k<=8;k++){
          const t2=k/8, ang=a+(b-a)*t2, z=H*t2;
          const rad=R0+(R1-R0)*t2;
          const bulge=1-Math.sin(t2*Math.PI)*(1-waist);
          line.push([cx+Math.cos(ang)*rad*bulge, cy+Math.sin(ang)*rad*bulge, z]);
        }
        poly(line,{stroke:INK,lw:0.5,alpha:0.45,dt:dir>0?1:2});
      }
      bump('GENERATRIX',2);
    }
    for(let k=0;k<=6;k++){
      const t2=k/6, z=H*t2;
      const rad=(R0+(R1-R0)*t2)*(1-Math.sin(t2*Math.PI)*(1-waist));
      ring(cx,cy,z,rad,24,{stroke:INK,lw:k%2?0.45:0.7,alpha:k%2?0.34:0.55,dt:k%2?2:1});
      bump('ANVLVS');
    }
    // observation pod at the head
    const pod=R1*1.5;
    for(let k=0;k<2;k++)
      ring(cx,cy,H+0.35+k*0.7,pod*(k?0.8:1),20,{stroke:INK,lw:0.7,alpha:0.6});
    for(let i=0;i<12;i++){
      const a=i/12*6.2832;
      seg([cx+Math.cos(a)*pod,cy+Math.sin(a)*pod,H+0.35],
          [cx+Math.cos(a)*pod*0.8,cy+Math.sin(a)*pod*0.8,H+1.05],{stroke:INK,lw:0.45,alpha:0.4,dt:2});
    }
    box(cx-0.35,cy-0.35,0,0.7,0.7,H+1.4,{stroke:INK,lw:0.6,alpha:0.45,fill:P[3],a:0.14,hidden:false,dt:1});
    box(cx-pod*1.2,cy-pod*1.2,-0.2,pod*2.4,pod*2.4,0.35,
      {stroke:INK,lw:0.7,alpha:0.5,fill:P[3],a:0.14,hidden:false});
    tops.push(H+1.6); bump('SPECVLA');
  }
  // sky bridges between towers
  if(n>1) for(let k=0;k<n-1;k++) bump('PONS');
  bump('BASIS',n);
  return Math.max(...tops)+0.6;
}

/* ---- LATTICE: timber screens, deep eaves, a low horizontal mass ---- */
function sysLattice(cfg){
  const P=cfg.pal.c;
  const W=rr(7,9.5), D=rr(5,7), fl=ri(2,3), fh=rr(1.5,1.9);
  const H=fl*fh;
  const ov=rr(0.55,0.90);                    // eaves overhang
  // stone plinth and engawa deck
  prism(planShape(W+ov*1.4,D+ov*1.4,'RECT'),-0.35,0.35,
    {stroke:INK,lw:0.9,alpha:0.6,fill:P[3],a:0.16,pat:DLV>=2?'stipple':null,patFace:2,pa:0.2});
  quad([[-W/2-ov,-D/2-ov,0.02],[W/2+ov,-D/2-ov,0.02],[W/2+ov,D/2+ov,0.02],[-W/2-ov,D/2+ov,0.02]],
    {stroke:INK,lw:0.7,alpha:0.5,pat:DLV>=2?'rule':null,pa:0.2});
  // the inhabited volume, glazed and set back behind the screen
  archPrism(planShape(W*0.86,D*0.86,ch(0.4)?'CHAMFER':'RECT'),0,H,
    {stroke:INK,lw:0.9,fill:P[0],a:0.10,fh:fh,parapet:false});
  // the screen: fine timber slats on every face, with rails
  const step=DLV>=2?0.30:0.5;
  for(const [sx,sy,len,axis] of [[0,-D/2,W,0],[0,D/2,W,0],[-W/2,0,D,1],[W/2,0,D,1]]){
    const n=Math.floor(len/step);
    for(let i=0;i<=n;i++){
      const t=-len/2+len*i/n;
      const x=axis?sx:t, y=axis?t:sy;
      post(x,y,0,H+0.25,0.075,{alpha:0.5,fill:P[1],a:0.18,dt:2});
    }
    for(let r2=1;r2<=fl;r2++){                // horizontal rails
      const z=r2*fh;
      const a=axis?[sx,-len/2,z]:[-len/2,sy,z], b=axis?[sx,len/2,z]:[len/2,sy,z];
      seg(a,b,{stroke:INK,lw:0.6,alpha:0.5,dt:1});
    }
    bump('LAMELLAE',n);
  }
  // a woven diagonal lattice over one elevation
  if(DLV>=2){
    const n=14;
    for(let i=-n;i<=n;i++){
      for(const dir of [1,-1]){
        const x0=-W/2+ (i+n)/(2*n)*W;
        seg([x0,-D/2-0.12,0],[x0+dir*H*0.9,-D/2-0.12,H],{stroke:INK,lw:0.4,alpha:0.3,dt:3});
      }
    }
    bump('TEXTVRA',n*2);
  }
  // deep eaves: a thin plate with real fascia, carried on brackets
  const ez=H+0.3;
  prism(planShape(W+ov*1.5,D+ov*1.5,'RECT'),ez,0.22,
    {stroke:INK,lw:1.0,alpha:0.7,fill:P[0],a:0.16,pat:DLV>=2?'rule':null,patFace:2,pa:0.26});
  for(let i=0;i<8;i++){
    const a=i/8*6.2832;
    const bx=Math.cos(a)*W*0.44, by=Math.sin(a)*D*0.44;
    poly([[bx,by,ez],[bx*1.5,by*1.5,ez],[bx*1.5,by*1.5,ez-0.55]],
      {stroke:INK,lw:0.5,alpha:0.45,close:true,dt:2});
    bump('BRACKETS');
  }
  // water basin and stepping stones
  const bw=W*0.34;
  quad([[-bw/2,D/2+ov*0.4,0.03],[bw/2,D/2+ov*0.4,0.03],
        [bw/2,D/2+ov*1.3,0.03],[-bw/2,D/2+ov*1.3,0.03]],
    {stroke:INK,lw:0.6,alpha:0.55,fill:P[2],a:0.30});
  for(let i=0;i<ri(3,6);i++)
    prism(planShape(0.45,0.35,'ROUNDED'),0.03,0.1,
      {stroke:INK,lw:0.5,alpha:0.5}).valueOf?0:0;
  bump('ENGAWA'); bump('BASIN'); bump('PLINTH');
  return ez+0.6;
}

/* ---- WARPED TERRACE: a courtyard block with a sweeping roofline ---- */
function sysWarp(cfg){
  const P=cfg.pal.c;
  const W=rr(9,12), D=rr(7,9.5), band=rr(1.6,2.3);
  const hLow=rr(2.0,3.2), hHigh=rr(11,16);
  const a0=rr(0,6.2832);                     // direction of the rise
  const N=DLV>=2?26:16;
  const hAt=(x,y)=>{
    const u=(Math.cos(a0)*x+Math.sin(a0)*y)/Math.max(W,D)*2;
    const t=Math.max(0,Math.min(1,(u+1)/2));
    return hLow+(hHigh-hLow)*Math.pow(t,1.5);
  };
  // perimeter ring, segment by segment, each stepping back as it rises
  const per=[];
  for(let i=0;i<N;i++){
    const t=i/N*6.2832;
    const ox=Math.cos(t), oy=Math.sin(t);
    const k=1/Math.max(Math.abs(ox)/(W/2),Math.abs(oy)/(D/2));
    per.push([ox*k,oy*k]);
  }
  for(let i=0;i<N;i++){
    const a=per[i], b=per[(i+1)%N];
    const h=hAt((a[0]+b[0])/2,(a[1]+b[1])/2);
    const steps=Math.max(1,Math.round(h/2.4));
    for(let s=0;s<steps;s++){
      const inset=band*(s/steps)*0.55;
      const z=h*s/steps, hh=h/steps;
      const ai=[a[0]*(1-0.0)-a[0]/Math.hypot(a[0],a[1])*inset,
                a[1]-a[1]/Math.hypot(a[0],a[1])*inset];
      const bi=[b[0]-b[0]/Math.hypot(b[0],b[1])*inset,
                b[1]-b[1]/Math.hypot(b[0],b[1])*inset];
      const aiIn=[ai[0]*(1-band/Math.hypot(ai[0],ai[1])), ai[1]*(1-band/Math.hypot(ai[0],ai[1]))];
      const biIn=[bi[0]*(1-band/Math.hypot(bi[0],bi[1])), bi[1]*(1-band/Math.hypot(bi[0],bi[1]))];
      prism([ai,bi,biIn,aiIn],z,hh,
        {stroke:INK,lw:0.85,alpha:0.6,fill:s%2?P[0]:P[2],a:0.13,
         pat:(DLV>=2&&ch(0.2))?'grid':null,patFace:1,pa:0.18});
      // terrace rail and planting on the setback
      if(DLV>=2){
        seg([ai[0],ai[1],z+hh],[bi[0],bi[1],z+hh],{stroke:INK,lw:0.5,alpha:0.45,dt:2});
        if(ch(0.5)){
          const mx=(ai[0]+bi[0])/2, my=(ai[1]+bi[1])/2;
          sprite([mx,my,z+hh],(sx,sy)=>{
            stroke2([[sx,sy],[sx,sy-7]],{lw:0.6,alpha:0.5,passes:1,amp:0.5});
            ctx.save(); ctx.globalAlpha=0.4; ctx.strokeStyle=INK; ctx.lineWidth=0.6;
            ctx.beginPath(); ctx.ellipse(sx,sy-9,4.4,2.0,0,0,6.2832); ctx.stroke(); ctx.restore();
          },{dt:3});
        }
      }
      bump('TERRACES');
    }
    // structure at every second segment
    if(i%2===0) post(a[0]*0.94,a[1]*0.94,0,h,0.18,{alpha:0.5,dt:1});
  }
  // the courtyard floor and a cut-through at the low side
  const inner=per.map(p=>[p[0]*(1-band/Math.hypot(p[0],p[1])*1.02),
                          p[1]*(1-band/Math.hypot(p[0],p[1])*1.02)]);
  quad(inner.map(p=>[p[0],p[1],0.04]),{stroke:INK,lw:0.8,alpha:0.55,
    pat:DLV>=2?'dots':null,pa:0.16});
  bump('CORTILE'); bump('SLOPE');
  return hHigh+0.8;
}

/* ---- UNITÉ: pilotis, brise-soleil, a sculptural roof ---- */
function sysUnite(cfg){
  const P=cfg.pal.c;
  const W=rr(10,13), D=rr(3.2,4.2), fl=ri(7,11), fh=rr(1.25,1.55);
  const pz=rr(2.6,3.6);                       // height of the pilotis
  const H=fl*fh;
  // pilotis: tapered, cast in pairs
  const np=Math.max(4,Math.round(W/2.2));
  for(let i=0;i<np;i++){
    const x=-W/2+W*(i+0.5)/np;
    for(const sy of [-1,1]){
      const y=sy*D*0.26;
      for(let s=0;s<4;s++){
        const t0=s/4, t1=(s+1)/4;
        const w0=0.62-0.22*t0, w1=0.62-0.22*t1;
        prism([[x-w0/2,y-w0/2],[x+w0/2,y-w0/2],[x+w0/2,y+w0/2],[x-w0/2,y+w0/2]],
          pz*t0,pz*(t1-t0),{stroke:INK,lw:0.8,alpha:0.6,fill:P[3],a:0.14});
      }
      bump('PILOTIS');
    }
  }
  // the slab
  const pl=planShape(W,D,'RECT');
  prism(pl,pz,H,{stroke:INK,lw:1.05,alpha:0.62,fill:P[0],a:0.10});
  // brise-soleil: a deep grid of loggia frames on both long elevations
  const bays=Math.max(6,Math.round(W/1.5));
  for(const sy of [-1,1]){
    const y=sy*D/2;
    for(let f=0;f<=fl;f++){                    // floor slabs, projecting
      const z=pz+f*fh;
      prism([[-W/2,y-sy*0.34],[W/2,y-sy*0.34],[W/2,y+sy*0.16],[-W/2,y+sy*0.16]],z,0.16,
        {stroke:INK,lw:0.6,alpha:0.5,fill:P[3],a:0.12,dt:1});
    }
    for(let b=0;b<=bays;b++){                  // mullion fins
      const x=-W/2+W*b/bays;
