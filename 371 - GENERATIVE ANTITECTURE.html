    const sv=bg.v>=0?1:-1;                       // which way it is actually making way
    const u=m<L?m:2*L-m, dir=(m<L?1:-1)*sv;
    const pos=atPath(bg.path,u), ahead=atPath(bg.path,u+0.5*dir);
    let hx=ahead[0]-pos[0], hy=ahead[1]-pos[1];
    const mm=Math.hypot(hx,hy)||1; hx/=mm; hy/=mm;
    boat(pos,hx,hy,2.1,0.66,bg.col,0.8,t,bg.s);
  }

  /* --- drones --- */
  for(let i=0;i<AGENTS.drones.length;i++){
    const d=AGENTS.drones[i];
    const s = d.hover ? d.s : d.s+d.v*t;
    const pos=atPath(d.path,s), ahead=atPath(d.path,s+0.35);
    let hx=ahead[0]-pos[0], hy=ahead[1]-pos[1];
    const mm=Math.hypot(hx,hy)||1; hx/=mm; hy/=mm;
    const nx=-hy, ny=hx;
    const z=pos[2]+Math.sin(t*2.1+d.bob)*0.35;
    const A=0.82, arm=0.82;
    // cross frame + rotor discs
    for(const [ax,ay] of [[hx,hy],[nx,ny]])
      qline([pos[0]-ax*arm,pos[1]-ay*arm,z],[pos[0]+ax*arm,pos[1]+ay*arm,z],{lw:0.8,alpha:A});
    for(const [ax,ay] of [[hx,hy],[-hx,-hy],[nx,ny],[-nx,-ny]]){
      const c=pr(pos[0]+ax*arm,pos[1]+ay*arm,z);
      ctx.globalAlpha=0.55; ctx.strokeStyle=INK; ctx.lineWidth=0.7;
      ctx.beginPath(); ctx.ellipse(c[0],c[1],5.6,5.6*Math.max(0.25,SE),0,0,6.2832); ctx.stroke();
    }
    ctx.globalAlpha=1;
    // body + status light
    const b=pr(pos[0],pos[1],z);
    ctx.globalAlpha=0.5; ctx.fillStyle=d.col||INK;
    ctx.beginPath(); ctx.arc(b[0],b[1],2.9,0,6.2832); ctx.fill();
    ctx.globalAlpha=0.3+0.6*((Math.sin(t*5.4+i)+1)/2); ctx.fillStyle=CFG.pal.c[0];
    ctx.beginPath(); ctx.arc(b[0],b[1]-3,1.5,0,6.2832); ctx.fill(); ctx.globalAlpha=1;
    if(d.pkg) qpoly([[pos[0]-0.22,pos[1]-0.22,z-0.75],[pos[0]+0.22,pos[1]-0.22,z-0.75],
                     [pos[0]+0.22,pos[1]+0.22,z-0.75],[pos[0]-0.22,pos[1]+0.22,z-0.75]],
                    {lw:0.6,alpha:0.6,fill:d.col,fa:0.35});
    // survey cone to ground
    ctx.save(); ctx.setLineDash([3,5]); ctx.globalAlpha=0.22;
    ctx.strokeStyle=INK; ctx.lineWidth=0.5; ctx.beginPath();
    const g0=pr(pos[0],pos[1],0.08);
    ctx.moveTo(b[0],b[1]); ctx.lineTo(g0[0],g0[1]); ctx.stroke(); ctx.restore();
    ctx.globalAlpha=0.28; ctx.strokeStyle=INK; ctx.lineWidth=0.6;
    ctx.beginPath(); ctx.ellipse(g0[0],g0[1],7,7*Math.max(0.22,SE),0,0,6.2832); ctx.stroke();
    ctx.globalAlpha=1;
  }

  /* --- beacons --- */
  const blink=(Math.sin(t*3.1)+1)/2;
  for(const b of (CFG.briefs||[])){
    const p=pr(b.x,b.y,b.top+0.4);
    ctx.globalAlpha=0.25+blink*0.6; ctx.fillStyle=CFG.pal.c[0];
    ctx.beginPath(); ctx.arc(p[0],p[1],2.1,0,6.2832); ctx.fill();
    ctx.globalAlpha=0.18+blink*0.25; ctx.strokeStyle=CFG.pal.c[0]; ctx.lineWidth=0.8;
    ctx.beginPath(); ctx.arc(p[0],p[1],4.5+blink*3,0,6.2832); ctx.stroke();
  }
  ctx.globalAlpha=1;
}

/* ============================================================
   COMPOSITION
   ============================================================ */
const SHAPES=['DIAGONAL','RECTANGLE','USHAPE','TSHAPE','LSHAPE','CROSS','RADIAL'];
const INKS=['FINE','MEDIUM','BOLD'];
const PAPERS=['STANDARD','ROUGH','LAID','VELLUM'];
const DENSITY=['MINIMAL','MODERATE','MANY'];
const DETAIL=['MINIMAL','MODERATE','TECHNICAL','DETAILED'];
const GRIDS=['SMALL','MEDIUM','LARGE'];
const SITES=['FOREST','INDUSTRIAL','HILLSIDE','LITTORAL','TUNDRA','QUARRY','DELTA','OLD TOWN','MEADOW'];

let CFG=null, CFG_RAILSEL='auto', CFG_AIRSEL='auto', CFG_LANDSEL='auto';
let U0=26, CX0=W/2, CY0=H*0.6, WZ=1;

function build(seed){
  R=mulberry32(seed>>>0); RR=mulberry32((seed*2654435761)>>>0);
  items=[]; CNT={}; BRIEFS=[]; resetT();

  const modeSel=$('mode').value;
  const primary = modeSel==='auto' ? pick(SYSKEYS) : modeSel;
  const S1=SYS[primary];

  const palSel=$('pal').value;
  let piX = palSel==='auto' ? (ch(0.45)?ri(0,1):ri(2,PALETTES.length-1)) : +palSel;
  const pal=PALETTES[piX];

  const denSel=$('den').value;
  const density = denSel==='auto' ? ri(0,2) : +denSel;

  const massSel=$('mass') ? $('mass').value : 'auto';
  let mk = massSel==='auto' ? pick(MASSKEYS) : massSel;
  if((mk==='graft'||mk==='totem') && !SYS[primary].flat) mk='podium';

  const gi=ri(0,2);
  CFG={
    seed, primary, M:{label:S1.label}, S1, mk, mass:MASS[mk].label,
    pal, density, site:15.0,
    gridSize:[1.1,1.5,2.1][gi], gridName:GRIDS[gi],
    blocksN:[1,3,6][density]+ri(0,3),
    ground:'CITY GRID', contours:ch(0.3),
    style:pick(S1.styles), site_name:pick(SITES), shape:pick(SHAPES),
    ink:pick(INKS), paperName:pick(PAPERS),
    night:false,
    detail: ($('det')&&$('det').value!=='auto') ? DETAIL[+$('det').value] : pick(DETAIL),
    project:ri(1000,9999), dwg:'IS-'+ri(10000,99999)+String.fromCharCode(65+ri(0,5)),
    floors:ri(3,6), mixed:false
  };
  CFG_RAILSEL=$('rail')?$('rail').value:'auto';
  CFG_AIRSEL=$('air')?$('air').value:'auto';
  CFG_LANDSEL=$('land')?$('land').value:'auto';
  const thSel=$('theme')?$('theme').value:'auto';
  CFG.theme = thSel==='auto' ? pick(['CIVIC','CIVIC','INDUSTRY','INDUSTRY','ANTIQUE'])
    : ['CIVIC','INDUSTRY','ANTIQUE'][+thSel];
  const skySel=$('sky')?$('sky').value:'auto';
  CFG.night = skySel==='auto' ? ch(0.22) : skySel==='1';
  setSky(CFG.night);
  if(CFG.night){
    const stars=[];
    for(let i=0;i<520;i++){
      stars.push({az:rr(0,6.2832), alt:rr(0.06,1.5),
                  r:ch(0.88)?rr(0.5,1.15):rr(1.1,1.9), a:rr(0.12,0.72)});
    }
    const mr=rr(42,66), md=Math.ceil(mr*2)+6;
    const disc=document.createElement('canvas'); disc.width=disc.height=md;
    const g2=disc.getContext('2d'), c0=md/2;
    g2.fillStyle='#e9e6d6'; g2.beginPath(); g2.arc(c0,c0,mr,0,6.2832); g2.fill();
    g2.globalAlpha=0.17; g2.fillStyle='#8d8a7c';
    for(let i=0;i<10;i++){
      const a=rr(0,6.2832), d=rr(0,mr*0.7);
      g2.beginPath(); g2.arc(c0+Math.cos(a)*d,c0+Math.sin(a)*d,mr*rr(0.08,0.25),0,6.2832); g2.fill();
    }
    g2.globalAlpha=1;
    if(ch(0.45)){                              // a true thin crescent
      const R2=mr*rr(1.55,2.0);                // shadow disc, larger than the moon
      const wdt=mr*rr(0.10,0.22);              // the sliver that survives
      const off=(mr-wdt)-R2;                   // its edge lands just inside the limb
      const dir=ch(0.5)?1:-1;
      g2.globalCompositeOperation='destination-out';
      g2.beginPath(); g2.arc(c0+off*dir, c0+mr*rr(-0.05,0.05), R2, 0, 6.2832); g2.fill();
      g2.globalCompositeOperation='source-over';
    }
    CFG.sky={stars, disc, moonR:mr, moonAz:AZ+Math.PI+rr(-1.0,1.0), moonAlt:rr(0.92,1.35)};
  }
  DLV = {MINIMAL:1,MODERATE:2,TECHNICAL:2,DETAILED:3}[CFG.detail]||2;
  U=26; CX=W/2; CY=H*0.60;

  // ---- massing (footprints first, so the city can carve around them) ----
  const briefs=MASS[mk].make();
  const tops=[]; let top=6;
  const mixP = briefs.length>1 ? 0.45 : 0;
  const K1=1.30;                      // volumes are authored at r≈5; scale to site
  briefs.forEach(b=>{ b.r*=K1; b.z*=K1; b.x*=1.15; b.y*=1.15; });
  CFG.landSel=CFG_LANDSEL;
  terrainInit(CFG);                     // the ground is known before anything is sited
  /* volumes clear one another, and keep out of the water */
  {
    const S0=CFG.site, rad=b=>5*b.r;
    const keep=briefs.map(b=> b.stackOn!==undefined
      ? {dx:b.x-briefs[b.stackOn].x, dy:b.y-briefs[b.stackOn].y} : null);
    // volumes in the same stack are one assembly and must never be prised apart
    const rootOf=i=>{ let k=i,g=0; while(briefs[k].stackOn!==undefined && g++<8) k=briefs[k].stackOn; return k; };
    for(let it=0; it<24; it++){
      let moved=false;
      for(let i=0;i<briefs.length;i++) for(let j=i+1;j<briefs.length;j++){
        const A=briefs[i], B=briefs[j];
        if(rootOf(i)===rootOf(j)) continue;                // the same assembly
        let dx=B.x-A.x, dy=B.y-A.y, d=Math.hypot(dx,dy);
        const need=(rad(A)+rad(B))*0.62;
        if(d<need-0.01){
          if(d<1e-3){ const a=R()*6.2832; dx=Math.cos(a); dy=Math.sin(a); d=1; }
          const push=(need-d)/2;
          if(A.stackOn===undefined){ A.x-=dx/d*push; A.y-=dy/d*push; }
          if(B.stackOn===undefined){ B.x+=dx/d*push; B.y+=dy/d*push; }
          moved=true;
        }
      }
      // push anything standing in the river onto the nearer bank
      if(TERR.river) for(const b of briefs){
        if(b.stackOn!==undefined) continue;
        const u=uOf(b.x,b.y), v=vOf(b.x,b.y), rv=riverV(u);
        const need=TERR.rw + rad(b)*0.88;
        const d=v-rv;
        if(Math.abs(d)<need){
          const sgn = (Math.abs(d)<1e-3) ? (ch(0.5)?1:-1) : (d>=0?1:-1);
          const c=XY(u, rv+sgn*need);
          b.x=c[0]; b.y=c[1]; moved=true;
        }
      }
      // stacked volumes ride along with whatever carries them
      briefs.forEach((b,i)=>{ if(keep[i]){
        b.x=briefs[b.stackOn].x+keep[i].dx; b.y=briefs[b.stackOn].y+keep[i].dy; } });
      if(!moved) break;
    }
    for(const b of briefs){                                // and stay on the site
      const lim=S0*0.80;
      b.x=Math.max(-lim,Math.min(lim,b.x));
      b.y=Math.max(-lim,Math.min(lim,b.y));
    }
    briefs.forEach((b,i)=>{ if(keep[i]){
      b.x=briefs[b.stackOn].x+keep[i].dx; b.y=briefs[b.stackOn].y+keep[i].dy; } });
  }
  LWK=0.9; ALK=0.86;
  CFG.railSel=CFG_RAILSEL; CFG.airSel=CFG_AIRSEL;
  buildCity(CFG, briefs);
  LWK=1; ALK=1;
  briefs.forEach((b,i)=>{
    b.sys = (i===0 || !ch(mixP)) ? primary : pick(SYSKEYS);
    if(b.sys!==primary) CFG.mixed=true;
    const g0 = gz(b.x,b.y);
    let zo = g0;
    if(b.stackOn!==undefined && tops[b.stackOn]!==undefined){
      zo = g0 + (tops[b.stackOn]-g0)*0.80;          // set into the mass, not perched on it
      const r=5*b.r*0.92, P0=CFG.pal.c;
      box(b.x-r,b.y-r,zo-0.5,r*2,r*2,0.5,
        {stroke:INK,lw:1.05,fill:P0[3],a:0.18,hidden:false});   // transfer slab
      for(const sx of [-1,1]) for(const sy of [-1,1]){
        const px=b.x+sx*r*0.78, py=b.y+sy*r*0.78, pz=gz(px,py);
        box(px-0.26,py-0.26,pz,0.52,0.52,zo-0.5-pz,
          {stroke:INK,lw:0.9,alpha:0.6,fill:P0[3],a:0.12,hidden:false});
        for(let q=1;q<4;q++){                                    // cross bracing
          const z1=pz+(zo-0.5-pz)*(q-1)/3, z2=pz+(zo-0.5-pz)*q/3;
          seg([px,py,z1],[b.x+sx*r*0.78*0.35,b.y+sy*r*0.78*0.35,z2],
            {stroke:INK,lw:0.45,alpha:0.3,dt:2});
        }
        bump('PILOTIS');
      }
      bump('TRANSFER');
    }
    if(SYS[b.sys].iso) b.z = b.r;                 // domes/arches/cylinders stay undistorted
    else b.z = b.r * Math.max(0.55, Math.min(1.9, b.z/b.r));
    setT({x:b.x,y:b.y,s:b.r,z:b.z,zo,rot:b.rot});
    LWK=1.30; ALK=1.16;
    const lt = SYS[b.sys].f(CFG);
    LWK=1; ALK=1;
    tops[i]= zo + lt*b.z; b.top=tops[i];
    if(b.top>top) top=b.top;
  });
  resetT();

  // bridge link
  if(mk==='bridge' && briefs.length===2){
    const A=briefs[0], B=briefs[1], z=Math.min(A.top,B.top)*rr(0.62,0.82);
    const dx=B.x-A.x, dy=B.y-A.y, L=Math.hypot(dx,dy), nx=-dy/L*0.9, ny=dx/L*0.9;
    quad([[A.x+nx,A.y+ny,z],[B.x+nx,B.y+ny,z],[B.x-nx,B.y-ny,z],[A.x-nx,A.y-ny,z]],
      {stroke:INK,lw:1.1,fill:CFG.pal.c[0],a:0.3});
    for(let k=0;k<=10;k++){
      const t=k/10;
      seg([A.x+dx*t+nx,A.y+dy*t+ny,z],[A.x+dx*t+nx,A.y+dy*t+ny,z+1.6],{stroke:INK,lw:0.6,alpha:0.45});
    }
    poly([[A.x+nx,A.y+ny,z+1.6],[B.x+nx,B.y+ny,z+1.6]],{stroke:INK,lw:0.9,alpha:0.6});
    bump('BLOCKS',2);
  }

  // ---- drafting annotations on the principal volume ----
  if(briefs.length){
    const b0=briefs[0], r0=5*b0.r, g0=gz(b0.x,b0.y);
    dimension([b0.x-r0,b0.y-r0*1.28],[b0.x+r0,b0.y-r0*1.28],g0,0,
      (r0*2*3).toFixed(0)+' M');
    const letters=['A','B','C','D'];
    for(let k=0;k<Math.min(3,briefs.length+1);k++){
      const bb=briefs[Math.min(k,briefs.length-1)];
      callout([bb.x+5*bb.r*0.7, bb.y-5*bb.r*0.7, bb.top*rr(0.3,0.85)],
        letters[k],{dx:ch(0.5)?30:-30,dy:20+k*4});
    }
  }
  BRIEFS=briefs; CFG.briefs=briefs; CFG.top=top;
  spawnAgents(CFG);

  // ---- fit to current camera ----
  const S=CFG.site;
  const D=CFG.dep||6;
  const probe=[[S,S,0],[S,-S,0],[-S,S,0],[-S,-S,0],[S,S,-D],[-S,-S,-D],[S,-S,-D],[-S,S,-D]];
  for(const b of briefs) probe.push([b.x,b.y,b.top]);
  const wantTop=330, wantBot=H-372;
  const ext=()=>{
    let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
    for(const c of probe){ const p=pr(c[0],c[1],c[2]);
      if(p[0]<x0)x0=p[0]; if(p[0]>x1)x1=p[0]; if(p[1]<y0)y0=p[1]; if(p[1]>y1)y1=p[1]; }
    return [x0,x1,y0,y1];
  };
  let [x0,x1,y0,y1]=ext();
  const kx=(Rt-L)/Math.max(1,x1-x0), ky=(wantBot-wantTop)/Math.max(1,y1-y0);
  U *= Math.max(0.45, Math.min(2.6, Math.min(kx,ky)*0.94));
  [x0,x1,y0,y1]=ext();
  CX += ((L+Rt)/2)-(x0+x1)/2;
  CY += ((wantTop+wantBot)/2)-(y0+y1)/2;
  U0=U; CX0=CX; CY0=CY; WZ=1;                 // the fitted frame, and the live zoom
}

/* ---------- paper cache + quality tiers ---------- */
const bg=document.createElement('canvas');
let bgKey='';
function ensurePaper(){
  const key=CFG.seed+'|'+cv.width+'x'+cv.height;
  if(key===bgKey) return;
  bg.width=cv.width; bg.height=cv.height;
  const main=ctx; ctx=bg.getContext('2d');
  ctx.setTransform(RS,0,0,RS,0,0); drawPaper(); ctx=main; bgKey=key;
}
const Q_FULL={passes:2,grain:true,furniture:true,step:12,min:0,maxDT:3};
const Q_MOVE={passes:1,grain:false,furniture:true,step:26,min:0.34,maxDT:2};
let Q={...Q_FULL};

/* the celestial sphere: fixed in the world, so it swings as the view turns */
const RSKY=760;
function skyPoint(az,alt){
  const dx=Math.cos(az), dy=Math.sin(az);
  return [CX + (dx*SA - dy*CA)*AA*RSKY*0.50,
          CY + ((dx*CA + dy*SA)*SE - alt*CE)*AA*RSKY,
          Math.cos(az-AZ)];                       // >0 → on the near side
}
function drawSky(){
  if(!NIGHT||!CFG.sky) return;
  const S0=CFG.sky;
  for(const st of S0.stars){
    const p=skyPoint(st.az,st.alt);
    if(p[2]>0.05) continue;
    const fade=Math.max(0,Math.min(1,(0.05-p[2])/0.45));
    if(p[0]<40||p[0]>W-40||p[1]<60||p[1]>H*0.72) continue;
    ctx.globalAlpha=st.a*fade; ctx.fillStyle='#eceadf';
    ctx.beginPath(); ctx.arc(p[0],p[1],st.r,0,6.2832); ctx.fill();
  }
  ctx.globalAlpha=1;
  const m=skyPoint(S0.moonAz,S0.moonAlt);
  if(m[1]<300) m[1]=300+(300-m[1])*0.18;   // never let it collide with the masthead
  if(m[1]>H*0.40) m[1]=H*0.40-(m[1]-H*0.40)*0.12;  // and it never sinks into the city
  const vis=Math.max(0,Math.min(1,(-0.02-m[2])/0.40));
  if(vis<=0.01) return;
  const mr=S0.moonR;
  ctx.save();
  const halo=ctx.createRadialGradient(m[0],m[1],mr*0.85,m[0],m[1],mr*4.2);
  halo.addColorStop(0,'rgba(226,224,208,'+(0.14*vis)+')');
  halo.addColorStop(1,'rgba(226,224,208,0)');
  ctx.fillStyle=halo; ctx.beginPath(); ctx.arc(m[0],m[1],mr*4.2,0,6.2832); ctx.fill();
  ctx.globalAlpha=0.94*vis;
  ctx.drawImage(S0.disc, m[0]-S0.disc.width/2, m[1]-S0.disc.height/2);
  ctx.restore(); ctx.globalAlpha=1;
}

function render(){
  RR=mulberry32((CFG.seed*40503+7)>>>0);
  ensurePaper();
  ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.drawImage(bg,0,0); ctx.restore();
  ctx.save();
  ctx.beginPath(); ctx.rect(0,96,W-BAND,H-96-104); ctx.clip();
  drawSky();
  resortByView();
  const lwK=CFG.ink==='FINE'?0.78:CFG.ink==='BOLD'?1.42:1.0;
  const washK=CFG.pal.wash;
  let si=0;
  for(const it of items){
    if(it.k==='s'){
      const [sx,sy]=pr(it.p[0][0],it.p[0][1],it.p[0][2]); it.fn(sx,sy); continue;
    }
    if(Q.maxDT!==undefined && (it.dt||0)>Q.maxDT) continue;
    if(Q.min && !it.keep && !it.fill && it.alpha!==undefined && it.alpha<Q.min) continue;
    const p2=it.p.map(v=>pr(v[0],v[1],v[2]));
    if(it.k==='q'){
      if(it.fill) washFill(p2,it.fill,(it.a!==undefined?it.a:0.28)*washK/0.30*(it.sh||1));
      if(it.pat) tonalFill(p2,it.pat,(it.pa||0.4)*(Q.grain===false?0.85:1));
      stroke2(p2,{lw:(it.lw||1)*lwK,alpha:(it.alpha!==undefined?it.alpha:0.72),
        close:true,amp:1.35,passes:Q.passes,color:it.stroke||INK});
    }else{
      if(it.fill) washFill(p2,it.fill,(it.a!==undefined?it.a:0.25)*washK/0.30);
      stroke2(p2,{lw:(it.lw||1)*lwK,alpha:(it.alpha!==undefined?it.alpha:0.7),
        close:!!it.close,amp:1.25,passes:Q.passes,color:it.stroke||INK,over:it.close?0:1.5});
    }
  }
  ctx.restore();
  if(Q.furniture){ ensureFurniture();
    ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.drawImage(fg,0,0); ctx.restore();
    drawSheetLive();
  }
}

/* ============================================================
   SHEET  —  "RDS" layout: black label bars, one hot accent,
   bold grotesque headlines against monospaced technical caps
   ============================================================ */
const BAND=78, OUT=40, SPX=54, L=92, Rt=W-BAND-58;
const ACCENT='#FF4300';

function rect(x,y,w,h,{lw=1,alpha=0.7}={}){
  stroke2([[x,y],[x+w,y],[x+w,y+h],[x,y+h]],{lw,alpha,close:true,amp:0.8,passes:1});
}
function hline(x1,y,x2,o={}){ stroke2([[x1,y],[x2,y]],{lw:o.lw||1,alpha:o.alpha||0.7,amp:0.7,passes:1}); }
function vline(x,y1,y2,o={}){ stroke2([[x,y1],[x,y2]],{lw:o.lw||1,alpha:o.alpha||0.7,amp:0.7,passes:1}); }
function dash(x1,y,x2,{lw=1.0,alpha=0.5,d=9,g=7,color=null}={}){
  ctx.save(); ctx.setLineDash([d,g]); ctx.globalAlpha=alpha;
  ctx.strokeStyle=color||INK; ctx.lineWidth=lw;
  ctx.beginPath(); ctx.moveTo(x1,y); ctx.lineTo(x2,y); ctx.stroke(); ctx.restore();
}
function swatch(x,y,w,h,color){
  if(color===undefined){ color=h; h=w; }
  ctx.save(); ctx.globalAlpha=0.9; ctx.fillStyle=color; ctx.fillRect(x,y,w,h); ctx.restore();
}
function slab(x,y,w,h,{color=INK,a=0.92}={}){
  ctx.save(); ctx.globalAlpha=a; ctx.fillStyle=color; ctx.fillRect(x,y,w,h);
  ctx.globalAlpha=0.10; ctx.fillStyle=tone('stipple'); ctx.fillRect(x,y,w,h);
  ctx.restore();
}
/* monospaced technical caps */
function mono(s,x,y,{size=11,ls=1.9,color=null,align='left',alpha=0.82,weight=400}={}){
  return txt(s,x,y,{size,ls,color:color||INK,align,alpha,weight,face:'mono'});
}
/* the bold grotesque headline, set tight and in mixed case */
function head(s,x,y,{size=74,color=null,alpha=0.95,align='left'}={}){
  ctx.font=`700 ${size}px "Helvetica Neue",Helvetica,Arial,sans-serif`;
  const w=ctx.measureText(s).width;
  ctx.save();
  ctx.globalAlpha=alpha; ctx.fillStyle=color||INK;
  ctx.textAlign=align==='right'?'right':'left';
  ctx.fillText(s,x,y);
  ctx.globalAlpha=alpha*0.22;
  ctx.fillText(s,x+0.7,y+0.7);
  ctx.restore();
  return w;
}
const titleCase=s=>s.toLowerCase().replace(/(^|[\s\-\/])([a-z])/g,(m,a,b)=>a+b.toUpperCase());
function arrows(x,y,n,{size=15,alpha=0.45,color=null}={}){
  let s=''; for(let i=0;i<n;i++) s+='>';
  mono(s,x,y,{size,ls:2.6,alpha,color});
}
/* hazard patch: seven black diagonals at an even pitch */
function cautionMark(x,y,w,h,n,o={}){
  ctx.save();
  ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();
  ctx.globalAlpha=o.alpha||0.92; ctx.strokeStyle=o.color||INK; ctx.lineCap='butt';
  const span=w+h, step=span/n;
  ctx.lineWidth=step*(o.weight||0.23);
  for(let i=0;i<n;i++){
    if(o.trim && (i===0 || i===n-1)) continue;    // drop the clipped corner slivers
    const px=x-h+step*(i+0.5);
    if(o.flip){ ctx.beginPath(); ctx.moveTo(px,y);   ctx.lineTo(px+h,y+h); ctx.stroke(); }
    else      { ctx.beginPath(); ctx.moveTo(px,y+h); ctx.lineTo(px+h,y);   ctx.stroke(); }
  }
  ctx.restore(); ctx.globalAlpha=1;
}
function tinyGlyph(x,y,i){
  ctx.save(); ctx.globalAlpha=0.75; ctx.fillStyle=INK;
  const s=6;
  switch(i%4){
    case 0: ctx.fillRect(x-s/2,y-s/2,s,s); break;
    case 1: ctx.beginPath(); ctx.arc(x,y,s/2,0,6.2832); ctx.fill(); break;
    case 2: ctx.beginPath(); ctx.moveTo(x-s/2,y+s/2); ctx.lineTo(x,y-s/2);
            ctx.lineTo(x+s/2,y+s/2); ctx.closePath(); ctx.fill(); break;
    default: ctx.fillRect(x-s/2,y-1,s,2);
  }
  ctx.restore();
}
function regMark(x,y){
  ctx.save(); ctx.globalAlpha=0.45; ctx.strokeStyle=INK; ctx.lineWidth=1.1;
  ctx.beginPath(); ctx.arc(x,y,8,0,6.2832); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x-13,y); ctx.lineTo(x+13,y); ctx.moveTo(x,y-13); ctx.lineTo(x,y+13);
  ctx.stroke(); ctx.restore();
}
function vtext(s,x,y,o={}){
  ctx.save(); ctx.translate(x,y); ctx.rotate(-Math.PI/2); txt(s,0,0,o); ctx.restore();
}
function keyPlan(x,y,size){
  const S=CFG.site, k=size/(S*2.3);
  const cx=x+size/2, cy=y+size/2;
  ctx.save(); ctx.globalAlpha=0.08; ctx.fillStyle=INK; ctx.fillRect(x,y,size,size); ctx.restore();
  ctx.save(); ctx.globalAlpha=0.4; ctx.strokeStyle=INK; ctx.lineWidth=0.9;
  ctx.setLineDash([4,4]);
  ctx.strokeRect(cx-S*k,cy-S*k,S*2*k,S*2*k); ctx.restore();
  for(const b of (CFG.briefs||[])){
    const r=5*b.r*k, bx=cx+b.x*k, by=cy-b.y*k;
    ctx.save(); ctx.translate(bx,by); ctx.rotate(-(b.rot||0));
    ctx.globalAlpha=0.95; ctx.fillStyle=ACCENT; ctx.fillRect(-r,-r,r*2,r*2);
    ctx.restore();
  }
}

/* ---------- live overlay ---------- */
function drawSheetLive(){
  const azd=Math.round(((AZ*180/Math.PI)%360+360)%360), eld=Math.round(EL*180/Math.PI);
  mono('VIEW: AZ '+azd+'\u00b0 / EL '+eld+'\u00b0'+(Math.abs(WZ-1)>0.02?'  \u00d7'+WZ.toFixed(2):''),
    Rt,224,{size:12,ls:2.2,alpha:0.7,align:'right'});

  mono('[INDEX]',c1,zy+30,{size:12.5,ls:2.4,alpha:0.92,weight:700});
  for(let i=0;i<10;i++){
    const col=i%2, row=(i-col)/2;
    const x=c1+col*176, y=zy+54+row*24;
    tinyGlyph(x+5,y-3,i);
    const k=S1.legend[i];
    mono('[M'+String(i+1).padStart(2,'0')+'] '+k,x+18,y+1,{size:9.5,ls:1.2,alpha:0.72});
    mono(String(CNT[k]||0).padStart(3,'0'),x+160,y+1,{size:9.5,ls:1.2,alpha:0.45,align:'right'});
  }

  mono('[SCALE]',c2,zy+30,{size:12.5,ls:2.4,alpha:0.92,weight:700});
  const sxA=c2, sxB=c2+290, sy=zy+62;
  ctx.save();
  for(let i=0;i<6;i++){
    ctx.globalAlpha=(i%2)?0.10:0.9; ctx.fillStyle=(i%2)?INK:ACCENT;
    ctx.fillRect(sxA+(sxB-sxA)*i/6, sy, (sxB-sxA)/6, 12);
  }
  ctx.globalAlpha=0.6; ctx.strokeStyle=INK; ctx.lineWidth=1;
  ctx.strokeRect(sxA,sy,sxB-sxA,12); ctx.restore();
  mono('0',sxA,sy+26,{size:9.5,ls:1,align:'center',alpha:0.6});
  mono('1:100',sxA+(sxB-sxA)/2,sy+26,{size:9.5,ls:2,align:'center',alpha:0.7});
  mono('40 M',sxB,sy+26,{size:9.5,ls:1,align:'center',alpha:0.6});
  mono('PROJECTION: AXONOMETRIC',c2,zy+112,{size:9.5,ls:1.6,alpha:0.5});
  mono('PALETTE: '+CFG.pal.name,c2,zy+132,{size:9.5,ls:1.6,alpha:0.5});
  mono('PAPER: '+CFG.paperName+' / INK: '+CFG.ink,c2,zy+152,{size:9.5,ls:1.6,alpha:0.5});
  mono('GRID: '+CFG.gridName+' / FLOORS: '+CFG.floors,c2,zy+172,{size:9.5,ls:1.6,alpha:0.5});

  mono('[CONFIGURATION]',c3,zy+30,{size:12.5,ls:2.4,alpha:0.92,weight:700});
  const cfgList=[['MODE',S1.label],['PLAN',CFG.plan||CFG.roof||CFG.tower||'\u2014'],
                 ['ORDER',CFG.order||'\u2014'],
                 ['DISPOSITION',CFG.mass],['TERRAIN',CFG.ground],
                 ['BRIDGE',CFG.bridge||'\u2014'],
                 ['SKY',CFG.night?'NOCTURNE':'DAYLIGHT'],['STRUCT',DENSITY[CFG.density]]];
  cfgList.forEach((r,i)=>{
    const y=zy+56+i*22;
    mono(r[0],c3,y,{size:9.5,ls:1.5,alpha:0.5});
    mono(String(r[1]),Rt,y,{size:10,ls:1.5,alpha:0.9,align:'right',weight:700});
    dash(c3,y+6,Rt,{alpha:0.14,lw:0.7,d:3,g:5});
  });

  cautionMark(W-BAND+10,H-300,BAND-10,208,11,{color:'#eae8e4',alpha:0.95,trim:true});

  /* --- foot bar, bleeding left and bottom --- */
  const fy=H-104;
  slab(0,fy,W-BAND,104);
  slab(0,fy,L+180,104,{color:ACCENT,a:0.96});
  head(String(CFG.project%100).padStart(2,'0'),26,fy+76,
    {size:66,color:'#141414',alpha:0.95});
  mono(S1.type,L+56,fy+58,{size:17,ls:3.2,color:'#141414',alpha:0.98});
  mono('SHEET 1 / 1',L+230,fy+58,{size:12,ls:2.6,color:PB,alpha:0.8});
  arrows(L+400,fy+58,10,{size:13,alpha:0.5,color:PB});
  head(CFG.dwg,W-BAND-26,fy+65,{size:36,color:PB,align:'right',alpha:0.98});
}

const fg=document.createElement('canvas');
let fgKey='';
function ensureFurniture(){
  const key=CFG.seed+'|'+cv.width+'x'+cv.height+'|'+U.toFixed(2);
  if(key===fgKey) return;
  fg.width=cv.width; fg.height=cv.height;
  const main=ctx, rrSave=RR;
  ctx=fg.getContext('2d'); ctx.setTransform(RS,0,0,RS,0,0);
  RR=mulberry32((CFG.seed*7717+3)>>>0);
  drawSheet();
  ctx=main; RR=rrSave; fgKey=key;
}


/* ============================================================
   DRIVER + MOBILE SHELL
   ============================================================ */
const $ = id => document.getElementById(id);
const stage=$('stage'), busy=$('busy'), sheet=$('sheet');
const isCoarse = matchMedia('(pointer:coarse)').matches;
const smallScreen = () => Math.min(innerWidth, innerHeight) < 760;

/* preview resolution: full sheet on desktop, half on phones */
function previewRes(){
  if(!smallScreen()) return 1;
  const px = innerWidth * (window.devicePixelRatio||1);
  return px > 1100 ? 0.62 : 0.5;
}

let ZOOMS=[1,1.6,2.6], zi=0;
function fitWidth(){
  const availW = stage.clientWidth - 16;
  const availH = stage.clientHeight - 16;
  return Math.min(availW, availH*W/H);
}
function applyZoom(){
  const w = fitWidth()*ZOOMS[zi];
  cv.style.width = w+'px'; cv.style.height = (w*H/W)+'px';
  $('zoomb').textContent = zi===0 ? 'FIT' : ZOOMS[zi]+'\u00d7';
}

const plate=document.createElement('canvas');
function paintNow(){
  if(plate.width!==cv.width||plate.height!==cv.height){
    plate.width=cv.width; plate.height=cv.height;
  }
  const main=ctx;
  ctx=plate.getContext('2d');
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,plate.width,plate.height);
  ctx.setTransform(RS,0,0,RS,0,0);
  render();
  ctx=main;
  composite();
}
function composite(){
  ctx.save(); ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,cv.width,cv.height); ctx.drawImage(plate,0,0); ctx.restore();
  ctx.setTransform(RS,0,0,RS,0,0);
  ctx.save();
  ctx.beginPath(); ctx.rect(0,96,W-BAND,H-96-104); ctx.clip();
  drawAgents(animT);
  ctx.restore();
}
let dirty=false, idleT=null;
function requestDraw(){ dirty=true; }
function orbitStart(){
  DRAGGING=true;
  if(typeof stopCruise==='function') stopCruise(false);
  clearTimeout(idleT2);
  Q={...Q_MOVE};
  stage.classList.add('dragging');
  clearTimeout(idleT);
}
function orbitEnd(){
  DRAGGING=false;
  stage.classList.remove('dragging');
  clearTimeout(idleT);
  idleT=setTimeout(()=>{ if(!cruising){ Q={...Q_FULL}; dirty=true; } poke(); }, 90);
}
function resetView(){
  stopCruise(false);
  setView(DEF_AZ, DEF_EL);
  WZ=1;
  build(CFG.seed); paintNow(); poke();
}

function go(seed){
  const s = seed===undefined ? Math.floor(Math.random()*1e9) : seed;
  $('seed').value = s;
  busy.style.display='flex';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    setRes(previewRes());
    build(s);
    if(AUTO_MS && !REDUCE && AUTO_MS<=1000){        // enter already in motion
      cruising=true; elBase=EL; phase=0; acc=0; degraded=false; lastT=0;
      Q={...Q_MOVE};
    }
    paintNow(); applyZoom();
    $('meta').textContent = CFG.S1.label+' · '+CFG.mass+' · #'+CFG.project;
    busy.style.display='none';
    poke();
  }));
}

/* ---- save: re-render at full sheet resolution, then share/download ---- */
function savePNG(){
  busy.style.display='flex'; busy.textContent='EXPORTING\u2026';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    stopCruise(false);
    const prev = RS;
    const vU=U, vCX=CX, vCY=CY, vWZ=WZ;         // keep whatever the viewer is looking at
    Q={...Q_FULL};
    setRes(A4RS); build(CFG.seed);              // A4 at 300 dpi
    U=vU; CX=vCX; CY=vCY; WZ=vWZ; fgKey='';     // re-apply the zoom and pan
    paintNow();
    const name = `antitecture_${CFG.S1.label.replace(/[ +]/g,'-')}_${CFG.seed}.png`;
    const done = ()=>{
      setRes(prev); build(CFG.seed);
      U=vU; CX=vCX; CY=vCY; WZ=vWZ; fgKey=''; paintNow();
      applyZoom(); busy.style.display='none'; busy.textContent='DRAWING\u2026';
    };
    cv.toBlob(async blob=>{
      if(!blob){ done(); return; }
      // share sheets belong on touch devices; a desktop just downloads the file
      const touch = matchMedia('(pointer:coarse)').matches && !matchMedia('(pointer:fine)').matches;
      if(touch) try{
        const file = new File([blob], name, {type:'image/png'});
        if(navigator.canShare && navigator.canShare({files:[file]})){
          await navigator.share({files:[file], title:name});
          done(); return;
        }
      }catch(e){ /* share cancelled — fall through to download */ }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 6000);
      done();
    },'image/png');
  }));
}

/* ---- idle auto-orbit ---------------------------------------------- */
const REDUCE = matchMedia('(prefers-reduced-motion:reduce)').matches;
let idleT2=null, cruising=false, rafId=0, lastT=0, elBase=EL, phase=0;
let DRAGGING=false;
let animT=0;
let AUTO_MS = REDUCE ? 0 : 600;   // rotation is the default state
let SPD = 0.16;                       // radians / second at DRIFT

let acc=0, degraded=false;
function stopCruise(repaint){
  if(cruising){
    cruising=false; degraded=false;
    Q={...Q_FULL};
    if(repaint!==false) paintNow();
  }
}
function startCruise(){
  if(!AUTO_MS || REDUCE || document.hidden || cruising) return;
  cruising=true; elBase=EL; phase=0; acc=0; degraded=false;
  Q={...Q_MOVE};
}

/* one loop drives both the traffic and the idle orbit */
function loop(t){
  rafId=requestAnimationFrame(loop);
  if(document.hidden) { lastT=0; return; }
  if(!lastT) lastT=t;
  let dt=Math.min(0.12,(t-lastT)/1000); lastT=t;
  acc+=dt;
  if(acc<(DRAGGING?0.012:0.032)) return;      // faster while steering
  const step=acc; acc=0;
  if(ANIM_ON) animT+=step;
  if(cruising){
    phase+=step;
    setView(AZ + step*SPD, elBase + Math.sin(phase*0.22)*0.16);
    const t0=performance.now();
    paintNow();
    if(performance.now()-t0>46 && !degraded){
      degraded=true; Q={...Q_MOVE, step:36, min:0.46, lite:true};
    }
  }else if(dirty){
    dirty=false;
    paintNow();                               // one full repaint per frame, at most
  }else if(ANIM_ON){
    composite();                              // cheap: cached plate + agents
  }
}
requestAnimationFrame(loop);
/* any interaction wakes it up and restarts the idle countdown */
function poke(immediate){
  if(DRAGGING) return;                                // hands off while steering
  stopCruise(false);
  clearTimeout(idleT2);
  if(!AUTO_MS) return;
  if(immediate || AUTO_MS<=1000) idleT2=setTimeout(startCruise, 260);
  else idleT2=setTimeout(startCruise, AUTO_MS);
}
['pointerdown','touchstart','keydown','wheel'].forEach(ev=>
  addEventListener(ev, poke, {passive:true}));
stage.addEventListener('scroll', poke, {passive:true});
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden){ stopCruise(false); lastT=0; } else poke();
});

/* ---- controls ---- */
$('gen').onclick = ()=>go();
$('png').onclick = savePNG;
$('rand').onclick = ()=>{ $('seed').value=''; go(); };
$('reset').onclick = ()=>{ closeSheet(); resetView(); };
$('apply').onclick = ()=>{
  const v=$('seed').value.trim();
  closeSheet(); go(v && /^\d+$/.test(v) ? +v : undefined);
};
$('zoomb').onclick = ()=>{ zi=(zi+1)%ZOOMS.length; applyZoom(); };
['mode','pal','den','mass','det','sky','theme','rail','air','land'].forEach(id => { const el=$(id); if(el) el.onchange=()=>go(); });
$('auto').onchange = e => { AUTO_MS = +e.target.value; poke(); };
$('spd').onchange = e => { SPD = 0.16*(+e.target.value); poke(); };
$('anim').onchange = e => { ANIM_ON = e.target.value==='1'; paintNow(); poke(); };

function openSheet(){ sheet.classList.add('on'); $('sheetbg').classList.add('on'); $('opt').classList.add('act'); }
function closeSheet(){ sheet.classList.remove('on'); $('sheetbg').classList.remove('on'); $('opt').classList.remove('act'); }
$('opt').onclick = ()=> sheet.classList.contains('on') ? closeSheet() : openSheet();
$('sheetbg').onclick = closeSheet;

/* ---- orbit (1 finger / mouse drag) · pinch-zoom + pan (2 fingers) ---- */
const SENS_AZ = 0.0080, SENS_EL = 0.0075;

/* drag = grabbing the model: pull right and the near face swings right,
   pull down and the top tips toward you */
function orbitTo(dx, dy, a0, e0){
  setView(a0 + dx*SENS_AZ, e0 + dy*SENS_EL);
  requestDraw();
}

/* mouse */
let mdrag=null;
stage.addEventListener('mousedown', e=>{
  if(e.button!==0) return;
  mdrag={x:e.clientX, y:e.clientY, az:AZ, el:EL, moved:false};
  orbitStart(); e.preventDefault();
});
addEventListener('mousemove', e=>{
  if(!mdrag) return;
  const dx=e.clientX-mdrag.x, dy=e.clientY-mdrag.y;
  if(Math.abs(dx)+Math.abs(dy)>2) mdrag.moved=true;
  orbitTo(dx, dy, mdrag.az, mdrag.el);
});
addEventListener('mouseup', ()=>{ if(mdrag){ mdrag=null; orbitEnd(); } });
stage.addEventListener('dblclick', e=>{ e.preventDefault(); resetView(); });

/* touch */
let tdrag=null, pinch=null, lastTap=0;
stage.addEventListener('touchstart', e=>{
  if(e.touches.length===1){
    const t=Date.now();
    if(t-lastTap<300){ e.preventDefault(); lastTap=0; tdrag=null; resetView(); return; }
    lastTap=t;
    const p=e.touches[0];
    tdrag={x:p.clientX, y:p.clientY, az:AZ, el:EL};
    orbitStart();
  }else if(e.touches.length===2){
    tdrag=null; orbitEnd();
    const [a,b]=e.touches;
    pinch={ d:Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY), w:cv.clientWidth,
            cx:(a.clientX+b.clientX)/2, cy:(a.clientY+b.clientY)/2 };
  }
},{passive:false});
stage.addEventListener('touchmove', e=>{
  if(tdrag && e.touches.length===1){
    e.preventDefault();
    const p=e.touches[0];
    orbitTo(p.clientX-tdrag.x, p.clientY-tdrag.y, tdrag.az, tdrag.el);
  }else if(pinch && e.touches.length===2){
    e.preventDefault();
    const [a,b]=e.touches;
    const d=Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
    const w=Math.max(fitWidth()*0.9, Math.min(fitWidth()*5, pinch.w*d/pinch.d));
    cv.style.width=w+'px'; cv.style.height=(w*H/W)+'px';
    $('zoomb').textContent=(w/fitWidth()).toFixed(1)+'\u00d7';
    const cx=(a.clientX+b.clientX)/2, cy=(a.clientY+b.clientY)/2;
    stage.scrollLeft -= cx-pinch.cx; stage.scrollTop -= cy-pinch.cy;
    pinch.cx=cx; pinch.cy=cy;
  }
},{passive:false});
stage.addEventListener('touchend', e=>{
  if(e.touches.length===0){ pinch=null; if(tdrag){ tdrag=null; orbitEnd(); } }
},{passive:false});

/* ---- wheel zooms the city, not the sheet ---- */
function worldZoom(k, ax, ay){
  const nz=Math.max(0.35, Math.min(6, WZ*k));
  const f=nz/WZ;
  if(Math.abs(f-1)<1e-4) return;
  WZ=nz;
  U*=f; CX = ax - f*(ax-CX); CY = ay - f*(ay-CY);
  fgKey='';                                   // the datum labels follow the drawing
  requestDraw();
}
stage.addEventListener('wheel', e=>{
  e.preventDefault();
  const r=cv.getBoundingClientRect();
  const sx=(e.clientX-r.left)*(W/r.width);
  const sy=(e.clientY-r.top)*(H/r.height);
  worldZoom(Math.exp(-e.deltaY*0.0016), sx, sy);
  poke();
},{passive:false});

/* ---- keyboard (desktop) ---- */
addEventListener('keydown', e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
  if(e.code==='Space'){ e.preventDefault(); go(); }
  if(e.key==='s'||e.key==='S') savePNG();
  if(e.key==='r'||e.key==='R') resetView();
  const step=Math.PI/36;
  if(e.key==='ArrowLeft'){ e.preventDefault(); setView(AZ-step,EL); requestDraw(); }
  if(e.key==='ArrowRight'){ e.preventDefault(); setView(AZ+step,EL); requestDraw(); }
  if(e.key==='ArrowUp'){ e.preventDefault(); setView(AZ,EL+step); requestDraw(); }
  if(e.key==='ArrowDown'){ e.preventDefault(); setView(AZ,EL-step); requestDraw(); }
});

/* ---- responsive ---- */
let rt;
addEventListener('resize', ()=>{
  clearTimeout(rt);
  rt=setTimeout(()=>{
    applyZoom();
    const want=previewRes();
    if(Math.abs(want-RS)>0.01 && CFG){ setRes(want); build(CFG.seed); paintNow(); applyZoom(); }
  },220);
});

go();
if(REDUCE) $('auto').value='0';

</script>
</body>
