    cyl(bx,by,base0,r2,hh,{seg:12,rings:6,lw:0.6,alpha:0.55});
    for(let k=1;k<5;k++) ring(bx,by,base0+hh*k/5,r2*1.06,16,{stroke:INK,lw:0.7,alpha:0.5,dt:2});
    ring(bx,by,base0+hh,r2*0.86,16,{stroke:INK,lw:0.8,alpha:0.6});
    prism(planShape(r2*3.2,r2*3.2,'RECT').map(p=>[p[0]+bx,p[1]+by]),base0,0.5,
      {stroke:INK,lw:0.7,alpha:0.55,fill:P[3],a:0.16});
    bump('STACKS');
  }
}
/* a portal gantry crane on rails */
function gantryCrane(cx,cy,span,h,P){
  const legs=[[-span/2,-1.1],[-span/2,1.1],[span/2,-1.1],[span/2,1.1]];
  for(const [lx,ly] of legs){
    post(cx+lx,cy+ly,gz(cx+lx,cy+ly),h,0.24,{alpha:0.6,fill:P[3],a:0.12,dt:1});
    if(DLV>=2) for(let k=1;k<4;k++)
      seg([cx+lx,cy+ly,gz(cx+lx,cy+ly)+h*k/4],
          [cx+lx*0.82,cy+ly,gz(cx+lx,cy+ly)+h*(k+1)/4],{stroke:INK,lw:0.4,alpha:0.3,dt:2});
  }
  const z=gz(cx,cy)+h;
  for(const o of [-1.1,1.1]){
    prism([[cx-span/2-0.6,cy+o-0.16],[cx+span/2+0.6,cy+o-0.16],
           [cx+span/2+0.6,cy+o+0.16],[cx-span/2-0.6,cy+o+0.16]],z,0.5,
      {stroke:INK,lw:0.75,alpha:0.6,fill:P[3],a:0.14});
    if(DLV>=2) for(let i=0;i<12;i++){               // lattice web
      const x0=cx-span/2+span*i/12, x1=cx-span/2+span*(i+1)/12;
      seg([x0,cy+o,z],[x1,cy+o,z+0.5],{stroke:INK,lw:0.35,alpha:0.28,dt:3});
      seg([x1,cy+o,z],[x0,cy+o,z+0.5],{stroke:INK,lw:0.35,alpha:0.28,dt:3});
    }
  }
  // trolley and hook
  const tx=cx+rr(-span*0.35,span*0.35);
  prism([[tx-0.5,cy-0.7],[tx+0.5,cy-0.7],[tx+0.5,cy+0.7],[tx-0.5,cy+0.7]],z-0.55,0.55,
    {stroke:INK,lw:0.7,alpha:0.6,fill:P[0],a:0.3});
  seg([tx,cy,z-0.55],[tx,cy,gz(tx,cy)+rr(0.4,2.2)],{stroke:INK,lw:0.45,alpha:0.45});
  // ground rails
  for(const o of [-1.1,1.1]){
    seg([cx-span*0.8,cy+o-0.1,gz(cx,cy)+0.04],[cx+span*0.8,cy+o-0.1,gz(cx,cy)+0.04],
      {stroke:INK,lw:0.6,alpha:0.5});
    seg([cx-span*0.8,cy+o+0.1,gz(cx,cy)+0.04],[cx+span*0.8,cy+o+0.1,gz(cx,cy)+0.04],
      {stroke:INK,lw:0.6,alpha:0.5});
  }
  bump('GANTRY');
}

/* ============================================================
   TERRAIN  — stepped plateaus, river, cataracts
   ============================================================ */
let TERR=null;

const LANDFORMS=['SLOPE','SLOPE','TERRACES','CORNER','BASIN','RIDGE','VALLEY','VALLEY','MESA'];
function terrainInit(cfg){
  const S=cfg.site;
  const AX = ch(0.5) ? 0 : 1;
  let kind = (cfg.landSel && cfg.landSel!=='auto') ? cfg.landSel : pick(LANDFORMS);
  const nSteps = kind==='FLAT'?0:pick([1,2,2,3,3,4]);
  const riseH = rr(1.5,2.9);
  const thr=[];
  for(let k=1;k<=nSteps;k++) thr.push(-S + 2*S*(k/(nSteps+1)) + rr(-1.2,1.2));
  thr.sort((a,b)=>a-b);
  const corner=[ch(0.5)?1:-1, ch(0.5)?1:-1];
  const mesas=[];
  for(let i=0;i<2;i++) mesas.push({x:rr(-S*0.55,S*0.55), y:rr(-S*0.55,S*0.55), r:rr(S*0.28,S*0.5)});

  const river = kind==='VALLEY' ? true : ch(0.40);
  const rw = kind==='VALLEY' ? rr(2.0,3.4) : rr(1.6,3.0);
  const v0 = kind==='VALLEY' ? rr(-S*0.28,S*0.28) : (ch(0.5)?1:-1)*S*rr(0.30,0.62);
  const mAmp = rr(0.8,2.6), mFrq = rr(0.10,0.22), mPh = rr(0,6.28);
  const wDep = rr(0.9,1.6);
  const flank = rr(0.42,0.70);                 // how far the valley sides run
  const maxDep=rr(1.0,2.4), bFrq=rr(0.12,0.30), bPh=rr(0,6.28), bAsym=rr(-0.45,0.45);

  TERR={AX,kind,nSteps,riseH,thr,river,rw,v0,mAmp,mFrq,mPh,wDep,S,
        corner,mesas,flank,maxDep,bFrq,bPh,bAsym};
  cfg.terr=TERR;
  const NAME={SLOPE:'SLOPED',TERRACES:'TERRACED',CORNER:'HEADLAND',BASIN:'BASIN',
              RIDGE:'RIDGE',VALLEY:'VALLEY',MESA:'MESAS',FLAT:'CITY GRID'};
  cfg.ground = nSteps ? (NAME[kind]+(river?' / RIVER':'')) : (river?'RIVERINE':'CITY GRID');
  cfg.riseH=riseH; cfg.nSteps=nSteps;
  return TERR;
}
const uOf=(x,y)=> TERR.AX? y : x;
const vOf=(x,y)=> TERR.AX? x : y;
function XY(u,v){ return TERR.AX ? [v,u] : [u,v]; }
function riverV(u){ return TERR.v0 + Math.sin(u*TERR.mFrq+TERR.mPh)*TERR.mAmp; }
function inRiver(x,y,pad){
  if(!TERR.river) return false;
  return Math.abs(vOf(x,y)-riverV(uOf(x,y))) < TERR.rw+(pad||0);
}
/* continuous height, measured in terrace steps (0 = lowest) */
function terrH(x,y){
  const S=TERR.S, n=TERR.nSteps;
  if(!n) return 0;
  const u=uOf(x,y), v=vOf(x,y);
  const cl=q=>Math.max(0,Math.min(1,q));
  let f=0;
  switch(TERR.kind){
    case 'SLOPE': {                                    // one continuous fall
      f = cl((S-u)/(2*S)); break; }
    case 'TERRACES': {                                 // discrete bands, as before
      let i=0; for(const t of TERR.thr) if(u>t) i++;
      return n - i; }
    case 'CORNER': {                                   // one corner stands high
      const dx=(x-TERR.corner[0]*S)/(2.1*S), dy=(y-TERR.corner[1]*S)/(2.1*S);
      f = cl(1-Math.hypot(dx,dy)*1.25); break; }
    case 'BASIN': {                                    // a hollow in the middle
      f = cl(Math.hypot(x,y)/(S*0.95)); break; }
    case 'RIDGE': {                                    // high ground at the centre
      f = cl(1-Math.hypot(x,y)/(S*0.95)); break; }
    case 'VALLEY': {                                   // sides rising from the river
      const d=Math.abs(v-riverV(u))-TERR.rw;
      f = cl(d/(S*TERR.flank)); break; }
    case 'MESA': {                                     // isolated tables
      for(const m of TERR.mesas)
        f = Math.max(f, cl(1.25-Math.hypot(x-m.x,y-m.y)/m.r));
      break; }
    default: f=0;
  }
  return f*n;
}
function gz(x,y){ return TERR.riseH*Math.round(terrH(x,y)); }
function gzRamp(x,y){                                  // streets ramp between terraces
  const h=terrH(x,y), f=Math.floor(h), fr=h-f;
  const t=Math.max(0,Math.min(1,(fr-0.34)/0.32));
  return TERR.riseH*(f + t*t*(3-2*t));
}
function levelZ(u){ const c=XY(u,TERR.river?riverV(u):0); return gz(c[0],c[1]); }
function roadZ(u){ const c=XY(u,0); return gzRamp(c[0],c[1]); }
function bedDepth(u,t){
  const along=0.5+0.5*Math.sin(u*TERR.bFrq+TERR.bPh);
  const d=Math.abs(t-TERR.bAsym*0.5)/(1+Math.abs(TERR.bAsym)*0.5);
  return TERR.maxDep*(0.25+0.75*along)*Math.max(0,1-Math.pow(Math.min(1,d),1.7));
}

function drawTerrain(cfg){
  const S=cfg.site, P=cfg.pal.c;
  /* the terraced field, cell by cell: tops, and risers where levels differ */
  const N = DLV>=2 ? 20 : 14, st = 2*S/N;
  const lvl=[];
  for(let i=0;i<=N;i++){ lvl[i]=[];
    for(let j=0;j<=N;j++){
      const x=-S+st*i, y=-S+st*j;
      lvl[i][j]=Math.round(terrH(x+st*0.5,y+st*0.5));
    } }
  for(let i=0;i<N;i++) for(let j=0;j<N;j++){
    const x=-S+st*i, y=-S+st*j, k=lvl[i][j], z=TERR.riseH*k;
    quad([[x,y,z],[x+st,y,z],[x+st,y+st,z],[x,y+st,z]],
      {stroke:INK,lw:0.4,alpha:0.16,dt:2});
    // riser toward +x
    const kx = i<N-1 ? lvl[i+1][j] : k;
    if(kx!==k){
      const za=TERR.riseH*k, zb=TERR.riseH*kx;
      quad([[x+st,y,za],[x+st,y+st,za],[x+st,y+st,zb],[x+st,y,zb]],
        {stroke:INK,lw:0.95,alpha:0.6,fill:P[3],a:0.10});
      if(DLV>=2) for(let q=1;q<3;q++){
        const zz=za+(zb-za)*q/3;
        seg([x+st,y,zz],[x+st,y+st,zz],{stroke:INK,lw:0.4,alpha:0.24,dt:3});
      }
      bump('RETAINING');
    }
    const ky = j<N-1 ? lvl[i][j+1] : k;
    if(ky!==k){
      const za=TERR.riseH*k, zb=TERR.riseH*ky;
      quad([[x,y+st,za],[x+st,y+st,za],[x+st,y+st,zb],[x,y+st,zb]],
        {stroke:INK,lw:0.95,alpha:0.55,fill:P[3],a:0.10});
      if(DLV>=2) for(let q=1;q<3;q++){
        const zz=za+(zb-za)*q/3;
        seg([x,y+st,zz],[x+st,y+st,zz],{stroke:INK,lw:0.4,alpha:0.24,dt:3});
      }
      bump('RETAINING');
    }
  }
  /* the perimeter, so the block reads as a cut sample */
  for(let i=0;i<N;i++){
    for(const [px,py,qx,qy] of [[-S,-S+st*i,-S,-S+st*(i+1)],
                                [S,-S+st*i,S,-S+st*(i+1)],
                                [-S+st*i,-S,-S+st*(i+1),-S],
                                [-S+st*i,S,-S+st*(i+1),S]]){
      const za=gz(px+0.01*Math.sign(-px||1),py), zb=gz(qx+0.01*Math.sign(-qx||1),qy);
      seg([px,py,za],[qx,qy,zb],{stroke:INK,lw:1.15,alpha:0.7});
    }
  }

  /* river + cataracts */
  if(TERR.river){
    const step=0.7;
    for(let u=-S;u<S;u+=step){
      const v1=riverV(u), v2=riverV(u+step);
      const z1=levelZ(u)-TERR.wDep, z2=levelZ(u+step)-TERR.wDep;
      const a=XY(u,v1-TERR.rw), b=XY(u,v1+TERR.rw);
      const c=XY(u+step,v2+TERR.rw), d=XY(u+step,v2-TERR.rw);
      quad([[a[0],a[1],z1],[b[0],b[1],z1],[c[0],c[1],z2],[d[0],d[1],z2]],
        {stroke:null,lw:0,alpha:0,fill:P[3],a:0.22});
      // banks
      seg([a[0],a[1],z1+TERR.wDep],[d[0],d[1],z2+TERR.wDep],{stroke:INK,lw:0.85,alpha:0.6});
      seg([b[0],b[1],z1+TERR.wDep],[c[0],c[1],z2+TERR.wDep],{stroke:INK,lw:0.85,alpha:0.6});
      // ripples
      for(let q=0;q<2;q++){
        if(!ch(0.5)) continue;
        const off=rr(-TERR.rw*0.75,TERR.rw*0.75), ln=rr(0.7,2.2);
        const r1=XY(u,v1+off), r2=XY(u,v1+off+ln);
        seg([r1[0],r1[1],z1],[r2[0],r2[1],z1],{stroke:INK,lw:0.5,alpha:0.34});
      }
      bump('WATER');
      if(DLV>=2){                                  // channel cross-section
        const sec=[];
        for(let k=0;k<=10;k++){
          const t=-1+2*k/10, c2=XY(u, v1+t*TERR.rw);
          sec.push([c2[0],c2[1],z1-bedDepth(u,t)]);
        }
        const bankA=XY(u,v1-TERR.rw), bankB=XY(u,v1+TERR.rw);
        poly([[bankA[0],bankA[1],z1+TERR.wDep]].concat(sec)
             .concat([[bankB[0],bankB[1],z1+TERR.wDep]]),
          {stroke:INK,lw:0.5,alpha:0.4,dt:2});
      }
    }
    // longitudinal bed lines, and gravel where the water runs shallow
    for(const t of [-0.72,-0.36,0,0.36,0.72]){
      const line=[];
      for(let u=-S;u<=S;u+=step){
        const v1=riverV(u), c2=XY(u,v1+t*TERR.rw);
        line.push([c2[0],c2[1],levelZ(u)-TERR.wDep-bedDepth(u,t)]);
      }
      poly(line,{stroke:INK,lw:t===0?0.75:0.5,alpha:t===0?0.55:0.38,dt:t===0?1:2});
    }
    if(DLV>=2) for(let u=-S;u<S;u+=step*1.5){
      const t=rr(-0.9,0.9), dp=bedDepth(u,t);
      if(dp>TERR.maxDep*0.35) continue;
      const v1=riverV(u), z=levelZ(u)-TERR.wDep-dp;
      for(let q=0;q<ri(2,5);q++){
        const g=XY(u+rr(-0.3,0.3), v1+t*TERR.rw+rr(-0.35,0.35));
        seg([g[0],g[1],z],[g[0]+0.16,g[1]+0.1,z],{stroke:INK,lw:0.4,alpha:0.3,dt:3});
      }
      bump('SHALLOWS');
    }
    bump('CHANNEL');

    /* falls at every terrace edge */
    for(const t of TERR.thr){
      const vC=riverV(t), zA=levelZ(t-0.01)-TERR.wDep, zB=levelZ(t+0.01)-TERR.wDep;
      const lipA=XY(t,vC-TERR.rw), lipB=XY(t,vC+TERR.rw);
      poly([[lipA[0],lipA[1],zA],[lipB[0],lipB[1],zA]],{stroke:INK,lw:1.2,alpha:0.8});
      for(let q=0;q<=16;q++){
        const vv=vC-TERR.rw+2*TERR.rw*q/16;
        const p=XY(t+jr(0.12),vv);
        const strand=[];
        for(let r=0;r<=5;r++){
          const f=r/5;
          strand.push([p[0]+(TERR.AX?0:f*f*0.5),p[1]+(TERR.AX?f*f*0.5:0), zA+(zB-zA)*f]);
        }
        poly(strand,{stroke:INK,lw:0.55,alpha:0.42});
      }
      // plunge pool + foam
      const pc=XY(t+1.2,vC);
      for(let q=0;q<3;q++){
        const rr2=TERR.rw*(0.5+q*0.28), pts=[];
        for(let i=0;i<=18;i++){
          const a=i/18*6.2832;
          const pp=XY(t+1.2+Math.cos(a)*rr2*0.7, vC+Math.sin(a)*rr2);
          pts.push([pp[0],pp[1],zB]);
        }
        poly(pts,{stroke:INK,lw:0.5,alpha:0.3-q*0.07,close:true});
      }
      for(let q=0;q<10;q++){
        const pp=XY(t+rr(0.2,2.2), vC+rr(-TERR.rw,TERR.rw));
        seg([pp[0],pp[1],zB+rr(0,0.6)],[pp[0],pp[1],zB+rr(0.6,1.2)],{stroke:INK,lw:0.45,alpha:0.28});
      }
      bump('CATARACT');
    }
  }
}


/* ============================================================
   BRIDGES — six ways to get across the water
   ============================================================ */
const BRIDGES=['ARCH','TRUSS','SUSPENSION','CABLE','BEAM','TIED'];
function buildBridge(u,road,P){
  const vC=riverV(u), span=TERR.rw*2.0;
  const A=XY(u,vC-span), B=XY(u,vC+span);
  const z=Math.max(gz(A[0],A[1]),gz(B[0],B[1]))+0.14;
  const wz=levelZ(u)-TERR.wDep;
  const kind=pick(BRIDGES);
  const at=(t,o)=>{ const c=XY(u+o, vC-span+2*span*t); return [c[0],c[1],z]; };
  const deck=(t)=>at(t,0);

  // deck slab, edges and parapet
  quad([at(0,-road/2),at(1,-road/2),at(1,road/2),at(0,road/2)],
    {stroke:INK,lw:0.9,alpha:0.62,fill:P[3],a:0.12});
  for(const o of [-road/2,road/2]){
    poly([at(0,o),at(1,o)],{stroke:INK,lw:0.85,alpha:0.65});
    const pr2=[at(0,o),at(1,o)].map(p=>[p[0],p[1],p[2]+0.55]);
    poly(pr2,{stroke:INK,lw:0.7,alpha:0.55});
    for(let q=0;q<=10;q++){
      const p=at(q/10,o);
      seg(p,[p[0],p[1],p[2]+0.55],{stroke:INK,lw:0.45,alpha:0.4,dt:2});
    }
  }
  const H=z-wz;
  if(kind==='ARCH'){        // a Roman aqueduct bridge: tiers of arches on piers
    const tiers = H>7 ? 3 : 2;
    const counts = tiers===3 ? [2,4,10] : [2,5];
    const share  = tiers===3 ? [0.42,0.34,0.24] : [0.60,0.40];
    let zBase = wz - 0.35;
    for(let ti=0; ti<tiers; ti++){
      const n=counts[ti], hT=(z-zBase)*share[ti]/(share.slice(ti).reduce((a,b)=>a+b,0));
      const zTop = ti===tiers-1 ? z : zBase+hT;
      const clear = zTop-zBase;
      const pierW = 0.42/(ti+1) + 0.16;
      for(let i=0;i<n;i++){
        const t0=i/n, t1=(i+1)/n, tc=(t0+t1)/2;
        const half=(t1-t0)/2;
        const rise=Math.min(clear*0.74, (2*span*half)*0.92);
        const spring=zTop-rise;
        for(const o of [-road/2, road/2]){
          const intr=[], extr=[];
          for(let q=0;q<=12;q++){
            const a=Math.PI*q/12;
            const f=tc - Math.cos(a)*half*0.92;
            const p=at(f,o);
            intr.push([p[0],p[1],spring+Math.sin(a)*rise]);
            const pe=at(tc - Math.cos(a)*half*1.08, o);
            extr.push([pe[0],pe[1],spring+Math.sin(a)*rise*1.16]);
          }
          poly(intr,{stroke:INK,lw:0.85,alpha:0.62});
          if(DLV>=2){
            poly(extr,{stroke:INK,lw:0.5,alpha:0.4,dt:2});
            for(let q=0;q<=12;q+=2) seg(intr[q],extr[q],{stroke:INK,lw:0.35,alpha:0.3,dt:2});
          }
          // the springing line, and the piers either side
          const pa=at(t0,o), pb=at(t1,o);
          seg([pa[0],pa[1],spring],[pa[0],pa[1],zBase],{stroke:INK,lw:0.75,alpha:0.55});
          seg([pb[0],pb[1],spring],[pb[0],pb[1],zBase],{stroke:INK,lw:0.75,alpha:0.55});
          seg([pa[0],pa[1],spring],[at(t0+half*0.2,o)[0],at(t0+half*0.2,o)[1],spring],
            {stroke:INK,lw:0.5,alpha:0.4,dt:2});
        }
        // the barrel, spanning between the two faces
        for(let q=0;q<=12;q+=3){
          const a=Math.PI*q/12, f=tc-Math.cos(a)*half*0.92;
          const p1=at(f,-road/2), p2=at(f,road/2);
          seg([p1[0],p1[1],spring+Math.sin(a)*rise],[p2[0],p2[1],spring+Math.sin(a)*rise],
            {stroke:INK,lw:0.4,alpha:0.3,dt:2});
        }
        bump('ARCHES');
      }
      // pier stacks and the string course that caps the tier
      for(let i=0;i<=n;i++){
        const p=deck(i/n);
        prism([[p[0]-pierW,p[1]-pierW],[p[0]+pierW,p[1]-pierW],
               [p[0]+pierW,p[1]+pierW],[p[0]-pierW,p[1]+pierW]],zBase,zTop-zBase,
          {stroke:INK,lw:0.7,alpha:0.5,fill:P[3],a:0.10});
      }
      for(const o of [-road/2, road/2]){
        const a=at(0,o), b=at(1,o);
        seg([a[0],a[1],zTop],[b[0],b[1],zTop],{stroke:INK,lw:0.85,alpha:0.6});
        if(DLV>=2){
          seg([a[0],a[1],zTop-0.22],[b[0],b[1],zTop-0.22],{stroke:INK,lw:0.45,alpha:0.35,dt:2});
          for(let q=0;q<=10;q++){                    // projecting putlog blocks
            if(!ch(0.45)) continue;
            const p=at(q/10,o);
            seg([p[0],p[1],zTop-0.5],[p[0]+(o>0?0.34:-0.34)*0,p[1],zTop-0.5],
              {stroke:INK,lw:0.5,alpha:0.35,dt:3});
          }
        }
      }
      bump('PIERS',n+1);
      zBase = zTop;
    }
    // the water channel carried on top, as a specus
    if(DLV>=1) for(const o of [-road*0.30, road*0.30]){
      const a=at(0,o), b=at(1,o);
      seg([a[0],a[1],z+0.24],[b[0],b[1],z+0.24],{stroke:INK,lw:0.6,alpha:0.45,dt:2});
    }
  }else if(kind==='TRUSS'){                        // a through truss
    const th=road*0.9, n=8;
    for(const o of [-road/2,road/2]){
      const bot=[], top=[];
      for(let q=0;q<=n;q++){
        const p=at(q/n,o);
        bot.push(p); top.push([p[0],p[1],p[2]+th]);
      }
      poly(top,{stroke:INK,lw:0.85,alpha:0.65});
      for(let q=0;q<=n;q++) seg(bot[q],top[q],{stroke:INK,lw:0.6,alpha:0.5});
      for(let q=0;q<n;q++)
        seg(bot[q],top[q+1],{stroke:INK,lw:0.55,alpha:0.45,dt:1});
      for(let q=0;q<n;q++)
        seg(top[q],bot[q+1],{stroke:INK,lw:0.55,alpha:0.45,dt:1});
    }
    for(const t of [0,0.5,1]){                     // portal bracing
      const a=at(t,-road/2), b=at(t,road/2);
      seg([a[0],a[1],a[2]+th],[b[0],b[1],b[2]+th],{stroke:INK,lw:0.6,alpha:0.5});
    }
    for(const sg of [0,1]){
      const p=deck(sg);
      prism([[p[0]-0.5,p[1]-0.5],[p[0]+0.5,p[1]-0.5],[p[0]+0.5,p[1]+0.5],[p[0]-0.5,p[1]+0.5]],
        wz-0.4,H*0.9,{stroke:INK,lw:0.75,alpha:0.55,fill:P[3],a:0.12});
    }
    bump('TRUSS',n*2);
  }else if(kind==='SUSPENSION'){
    const th=H*1.5+3.0;
    const towers=[0.22,0.78];
    for(const t of towers) for(const o of [-road/2,road/2]){
      const p=at(t,o);
      post(p[0],p[1],wz-0.3,th,0.26,{alpha:0.65,fill:P[3],a:0.12});
      seg([p[0],p[1],z+th*0.55],[p[0],p[1],z+th*0.62],{stroke:INK,lw:0.7,alpha:0.5});
    }
    for(const o of [-road/2,road/2]){
      const cab=[];
      for(let q=0;q<=16;q++){
        const t=q/16, p=at(t,o);
        let zz;
        if(t<towers[0]) zz=z+ (towers[0]-t)/towers[0]*th*0.62 + th*0.0;
        else if(t>towers[1]) zz=z+ (t-towers[1])/(1-towers[1])*th*0.62;
        else{
          const f=(t-towers[0])/(towers[1]-towers[0]);
          zz=z+th*0.62 - Math.sin(f*Math.PI)*th*0.5;
        }
        cab.push([p[0],p[1],zz]);
      }
      poly(cab,{stroke:INK,lw:0.9,alpha:0.7});
      for(let q=1;q<16;q++){
        const p=at(q/16,o);
        if(cab[q][2]-z<0.25) continue;
        seg([p[0],p[1],z],cab[q],{stroke:INK,lw:0.45,alpha:0.4,dt:1});
      }
    }
    bump('CABLES',32);
  }else if(kind==='CABLE'){                        // cable-stayed, one pylon
    const t0=ch(0.5)?0.28:0.72, th=H*1.4+4.0;
    for(const o of [-road/2,road/2]){
      const p=at(t0,o);
      post(p[0],p[1],wz-0.3,th,0.3,{alpha:0.68,fill:P[3],a:0.12});
      for(let q=1;q<=6;q++){
        const f=t0 + (q/6)*(1-t0)*0.92, g=t0 - (q/6)*t0*0.92;
        const a=at(f,o), b=at(g,o);
        seg([p[0],p[1],z+th*(0.55+q*0.06)],a,{stroke:INK,lw:0.5,alpha:0.45,dt:1});
        seg([p[0],p[1],z+th*(0.55+q*0.06)],b,{stroke:INK,lw:0.5,alpha:0.45,dt:1});
      }
    }
    bump('STAYS',24);
  }else if(kind==='TIED'){                         // a steel arch over the deck
    const rise=H*0.9+2.6;
    for(const o of [-road/2,road/2]){
      const arc=[];
      for(let q=0;q<=14;q++){
        const t=q/14, p=at(t,o);
        arc.push([p[0],p[1],z+Math.sin(t*Math.PI)*rise]);
      }
      poly(arc,{stroke:INK,lw:0.95,alpha:0.7});
      for(let q=2;q<13;q+=2){
        const p=at(q/14,o);
        seg([p[0],p[1],z],arc[q],{stroke:INK,lw:0.45,alpha:0.4,dt:1});
      }
    }
    for(let q=3;q<12;q+=3){                        // cross bracing overhead
      const t=q/14, a=at(t,-road/2), b=at(t,road/2);
      const zz=z+Math.sin(t*Math.PI)*rise;
      seg([a[0],a[1],zz],[b[0],b[1],zz],{stroke:INK,lw:0.5,alpha:0.4,dt:2});
    }
    bump('ARCHES',2);
  }else{                                           // plate girder on piers
    for(const o of [-road*0.34,road*0.34]){
      const g1=at(0,o), g2=at(1,o);
      quad([[g1[0],g1[1],z],[g2[0],g2[1],z],[g2[0],g2[1],z-0.7],[g1[0],g1[1],z-0.7]],
        {stroke:INK,lw:0.8,alpha:0.6,fill:P[3],a:0.12});
    }
    for(const t of [0.28,0.72]){
      const p=deck(t);
      prism([[p[0]-0.55,p[1]-0.4],[p[0]+0.55,p[1]-0.4],[p[0]+0.55,p[1]+0.4],[p[0]-0.55,p[1]+0.4]],
        wz-0.5,H*0.95,{stroke:INK,lw:0.8,alpha:0.6,fill:P[3],a:0.14});
      if(DLV>=2) for(let q=1;q<4;q++){
        const zz=wz-0.5+H*0.95*q/4;
        seg([p[0]-0.55,p[1],zz],[p[0]+0.55,p[1],zz],{stroke:INK,lw:0.4,alpha:0.3,dt:3});
      }
    }
    bump('GIRDERS',2);
  }
  bump('BRIDGES');
  return kind;
}

/* ============================================================
   CITY FABRIC
   ============================================================ */
function buildCity(cfg, briefs){
  const S=cfg.site, P=cfg.pal.c;
  PATHS.bridgeU=[];
  if(!cfg.terr) terrainInit(cfg);
  drawTerrain(cfg);

  const g=5, cell=2*S/g, road=rr(1.2,1.7);
  const occupied=(x,y,pad)=> briefs.some(b=>Math.hypot(x-b.x,y-b.y) < 5*b.r+pad);

  /* ---- airfield: reserved before anything else is laid out ---- */
  PATHS.runway=null; PATHS.taxi=null; PATHS.gates=[]; cfg.fieldZone=null;
  const airSel = cfg.airSel && cfg.airSel!=='auto' ? cfg.airSel : (ch(0.42)?'AIRPORT':'CORRIDOR');
  cfg.field = airSel;
  if(airSel==='AIRPORT') buildAirfield(cfg,S,occupied);
  const inField=(x,y,pad)=> !!(cfg.fieldZone && cfg.fieldZone(x,y,pad||0));

  /* ---- streets ---- */
  const gl=[]; for(let i=1;i<g;i++) gl.push(-S+cell*i);
  // streets running along the downhill axis (constant v)
  for(const v of gl){
    if(inRiver(...XY(0,v),0) && !TERR.river) continue;
    const pts=[], ptsL=[], ptsR=[];
    for(let u=-S;u<=S;u+=1.0){
      if(TERR.river && Math.abs(v-riverV(u))<TERR.rw*0.9) continue;   // no road in the water
      const c=XY(u,v);
      if(inField(c[0],c[1],road*0.8)) continue;                        // nor across the field
      const z=gzRamp(c[0],c[1])+0.03;
      const a=XY(u,v-road/2), b=XY(u,v+road/2);
      pts.push([c[0],c[1],z]); ptsL.push([a[0],a[1],z]); ptsR.push([b[0],b[1],z]);
    }
    if(ptsL.length>1){ poly(ptsL,{stroke:INK,lw:0.9,alpha:0.6}); poly(ptsR,{stroke:INK,lw:0.9,alpha:0.6}); }
    for(let i=0;i<pts.length;i+=3){
      const p=pts[i]; seg(p,[p[0]+(TERR.AX?0:0.5),p[1]+(TERR.AX?0.5:0),p[2]],{stroke:INK,lw:0.5,alpha:0.32});
    }
    bump('AVENUES');
  }
  // cross streets (constant u) — these bridge the river
  for(const u of gl){
    const z=roadZ(u)+0.03;
    { const step=1.2; let run=[];
      const flush=()=>{
        if(run.length>1){
          const v0=run[0], v1=run[run.length-1];
          const a=XY(u-road/2,v0), b=XY(u+road/2,v0);
          const c2=XY(u+road/2,v1), d=XY(u-road/2,v1);
          quad([[a[0],a[1],z],[b[0],b[1],z],[c2[0],c2[1],z],[d[0],d[1],z]],
            {stroke:INK,lw:0.9,alpha:0.6,fill:P[3],a:0.07});
        }
        run=[];
      };
      for(let v=-S;v<=S;v+=step){
        const c2=XY(u,v);
        if(inField(c2[0],c2[1],road*0.8)){ flush(); continue; }
        run.push(v);
      }
      flush();
    }
    if(TERR.river && !inField(...XY(u,riverV(u)),road)){
      cfg.bridge = buildBridge(u,road,P);
      (PATHS.bridgeU=PATHS.bridgeU||[]).push(u);
    }
    bump('AVENUES');
  }

  /* ---- blocks ---- */
  for(let i=0;i<g;i++) for(let j=0;j<g;j++){
    const bx=-S+cell*(i+0.5), by=-S+cell*(j+0.5);
    const half=cell/2-road*0.55;
    if(occupied(bx,by,cell*0.30)) continue;
    if(inRiver(bx,by,half*0.8)) continue;
    if(cfg.fieldZone && cfg.fieldZone(bx,by,half)) continue;
    const base0=gz(bx,by);
    const rad=Math.hypot(bx,by)/S, roll=R();

    if(roll<0.16){
      quad([[bx-half,by-half,base0+0.02],[bx+half,by-half,base0+0.02],
            [bx+half,by+half,base0+0.02],[bx-half,by+half,base0+0.02]],{stroke:INK,lw:0.7,alpha:0.4});
      for(let k=0;k<ri(6,13);k++){
        const tx=bx+rr(-half,half), ty=by+rr(-half,half);
        plantTree(tx,ty,gz(tx,ty),{h:rr(0.9,1.8)});
      }
      bump('PARKS'); continue;
    }
    if(roll<0.26){
      quad([[bx-half,by-half,base0+0.02],[bx+half,by-half,base0+0.02],
            [bx+half,by+half,base0+0.02],[bx-half,by+half,base0+0.02]],{stroke:INK,lw:0.8,alpha:0.5});
      const st=half*2/6;
      for(let k=1;k<6;k++){
        seg([bx-half+st*k,by-half,base0+0.03],[bx-half+st*k,by+half,base0+0.03],{stroke:INK,lw:0.5,alpha:0.28});
        seg([bx-half,by-half+st*k,base0+0.03],[bx+half,by-half+st*k,base0+0.03],{stroke:INK,lw:0.5,alpha:0.28});
      }
      bump('PLAZAS'); continue;
    }

    if(roll>0.955 && DLV>=1){                 // a site under construction
      const w=half*1.5, d=half*1.5, x=bx, y=by, bz=base0;
      const fl2=ri(3,7), fh2=0.75;
      for(let f=0;f<=fl2;f++){
        const z=bz+f*fh2;
        poly([[x-w/2,y-d/2,z],[x+w/2,y-d/2,z],[x+w/2,y+d/2,z],[x-w/2,y+d/2,z]],
          {stroke:INK,lw:0.6,alpha:f===fl2?0.5:0.38,close:true,dt:1});
      }
      for(const cx2 of [-1,1]) for(const cy2 of [-1,1])
        post(x+cx2*w/2,y+cy2*d/2,bz,fl2*fh2+0.6,0.16,{alpha:0.55,dt:1});
      for(let q=0;q<ri(3,6);q++)
        post(x+rr(-w/2,w/2),y+rr(-d/2,d/2),bz,fl2*fh2*rr(0.4,1),0.12,{alpha:0.4,dt:2});
      // tower crane
      const cxp=x+w*0.72, cyp=y+d*0.55, ch3=fl2*fh2+rr(3,6);
      post(cxp,cyp,bz,ch3,0.26,{alpha:0.6,dt:1});
      for(let q=1;q<6;q++){
        const z=bz+ch3*q/6;
        poly([[cxp-0.13,cyp-0.13,z],[cxp+0.13,cyp-0.13,z],
              [cxp+0.13,cyp+0.13,z],[cxp-0.13,cyp+0.13,z]],
          {stroke:INK,lw:0.4,alpha:0.35,close:true,dt:2});
      }
      const ja=rr(0,6.2832), jl=rr(4,7);
      const jx=cxp+Math.cos(ja)*jl, jy=cyp+Math.sin(ja)*jl;
      seg([cxp,cyp,bz+ch3],[jx,jy,bz+ch3],{stroke:INK,lw:0.8,alpha:0.6,dt:1});
      seg([cxp,cyp,bz+ch3],[cxp-Math.cos(ja)*2.0,cyp-Math.sin(ja)*2.0,bz+ch3],
        {stroke:INK,lw:0.8,alpha:0.6,dt:1});
      seg([cxp,cyp,bz+ch3+1.4],[jx,jy,bz+ch3],{stroke:INK,lw:0.45,alpha:0.4,dt:2});
      seg([jx,jy,bz+ch3],[jx,jy,bz+rr(0.5,2.5)],{stroke:INK,lw:0.45,alpha:0.45,dt:1});
      // hoarding
      poly([[x-w/2-0.4,y-d/2-0.4,bz],[x+w/2+0.4,y-d/2-0.4,bz],
            [x+w/2+0.4,y+d/2+0.4,bz],[x-w/2-0.4,y+d/2+0.4,bz]],
        {stroke:INK,lw:0.6,alpha:0.45,close:true,dt:2});
      bump('WORKS'); continue;
    }

    if(cfg.theme==='ANTIQUE' ? R()<0.85 : R()<0.07){
      classicalBlock(bx,by,half,base0,P);
      LWK=1; ALK=1; continue;
    }
    if(cfg.theme==='INDUSTRY' ? R()<0.82 : R()<0.12){
      industrialBlock(bx,by,half,base0,P);
      LWK=1; ALK=1; continue;
    }
    const n = roll<0.62 ? 1 : (roll<0.88 ? 2 : 3);
    for(let k=0;k<n;k++){
      const fat = n===1 ? rr(1.25,1.85) : rr(0.7,1.15);
      const w=Math.min(half*1.9,half*fat*rr(0.75,1.25));
      const d=Math.min(half*1.9,half*fat*rr(0.75,1.25));
      const x=bx+(n===1?rr(-0.3,0.3):rr(-half+w/2,half-w/2)*0.9);
      const y=by+(n===1?rr(-0.3,0.3):rr(-half+d/2,half-d/2)*0.9);
      if(occupied(x,y,1.5)||inRiver(x,y,1.0)) continue;
      const bz=gz(x,y);
      const dice=R();
      const base = dice<0.60 ? rr(1.2,3.4) : dice<0.87 ? rr(3.5,8) : rr(8,17);
      const h=base*(1.30-rad*0.60)*(cfg.density*0.12+0.94);
      const bk=ch(0.26)?pick(['ROUNDED','CHAMFER','ONEROUND','DIAGONAL']):'RECT';
      if(bk==='RECT')
        box(x-w/2,y-d/2,bz,w,d,h,{stroke:INK,lw:0.85,alpha:0.55,fill:null,hidden:false,
          pat: (DLV>=2 && ch(0.34)) ? pick(TONES) : null, patFace:ri(1,4), pa:rr(0.16,0.34)});
      else
        prism(rotPlan(planShape(w,d,bk,rr(0.3,0.5)),0,x,y),bz,h,
          {stroke:INK,lw:0.85,alpha:0.55,fill:null,
           pat:(DLV>=2&&ch(0.3))?pick(TONES):null, patFace:ri(1,4), pa:rr(0.14,0.30)});
      if(DLV>=2 && ch(0.45)){                 // shopfront awning at street level
        const aw2=w*rr(0.35,0.8);
        quad([[x+w/2,y-aw2/2,bz+0.95],[x+w/2,y+aw2/2,bz+0.95],
              [x+w/2+0.55,y+aw2/2,bz+0.6],[x+w/2+0.55,y-aw2/2,bz+0.6]],
          {stroke:INK,lw:0.5,alpha:0.45,fill:pick(P),a:0.3,dt:3});
      }
      if(DLV>=2 && h>3 && ch(0.35)){          // fire stair on the flank
        const nz2=Math.floor(h/0.7);
        for(let q=0;q<nz2;q++){
          const z1=bz+q*0.7, z2=bz+(q+1)*0.7, sx2=(q%2)?-1:1;
          seg([x-w/2,y+d*0.5*sx2*0.6,z1],[x-w/2,y-d*0.5*sx2*0.6,z2],
            {stroke:INK,lw:0.4,alpha:0.3,dt:3});
        }
      }
      const fh=0.62, nb=Math.min(16,Math.floor(h/fh));
      for(let b=1;b<=nb;b++){
        const z=bz+b*fh;
        seg([x+w/2,y-d/2,z],[x+w/2,y+d/2,z],{stroke:INK,lw:0.45,alpha:0.3});
        seg([x-w/2,y+d/2,z],[x+w/2,y+d/2,z],{stroke:INK,lw:0.45,alpha:0.22});
      }
      const nLit=NIGHT?ri(4,14):ri(0,5);
      for(let q=0;q<nLit;q++){
        const z=bz+Math.max(0.5,Math.floor(rr(1,nb))*fh)+0.18, sq=0.16;
        const face=NIGHT&&ch(0.45);
        const py=y+rr(-d/2+0.2,d/2-0.2), px=x+rr(-w/2+0.2,w/2-0.2);
        const col=NIGHT?'#ffcf7d':P[q%P.length];
        if(face)
          quad([[px-sq,y+d/2,z-sq],[px+sq,y+d/2,z-sq],[px+sq,y+d/2,z+sq],[px-sq,y+d/2,z+sq]],
            {stroke:INK,lw:0.4,fill:col,a:NIGHT?0.85:0.4});
        else
          quad([[x+w/2,py-sq,z-sq],[x+w/2,py+sq,z-sq],[x+w/2,py+sq,z+sq],[x+w/2,py-sq,z+sq]],
            {stroke:INK,lw:0.4,fill:col,a:NIGHT?0.85:0.4});
      }
      if(h<6 && ch(0.55)){
        const rw2=w*rr(0.2,0.4), rd2=d*rr(0.2,0.4);
        box(x-rw2/2,y-rd2/2,bz+h,rw2,rd2,rr(0.3,0.8),{stroke:INK,lw:0.6,alpha:0.5,fill:null,hidden:false});
      }
      if(h>6 && ch(0.45)) seg([x,y,bz+h],[x,y,bz+h+rr(0.8,2.6)],{stroke:INK,lw:0.7,alpha:0.6});
      bump('BLOCKS');
    }
  }

  /* ---- street trees, for scale ---- */
  for(const v of gl){
    for(const sg of [-1,1]){
      const lat=v+sg*(road/2+0.75);
      for(let u=-S*0.94;u<=S*0.94;u+=rr(2.4,4.2)){
        if(ch(0.42)) continue;
        const c=XY(u,lat);
        if(occupied(c[0],c[1],1.4)) continue;
        if(inRiver(c[0],c[1],0.6)) continue;
        plantTree(c[0],c[1],gzRamp(c[0],c[1]),{h:rr(0.95,1.6)});
      }
    }
  }
  for(let k=0;k<ri(10,22);k++){                 // loose planting at the margins
    const x=rr(-S,S), y=rr(-S,S);
    if(Math.abs(x)<S*0.6 && Math.abs(y)<S*0.6) continue;
    if(occupied(x,y,2)||inRiver(x,y,0.8)) continue;
    if(cfg.fieldZone && cfg.fieldZone(x,y,1)) continue;
    plantTree(x,y,gz(x,y),{h:rr(0.8,1.7)});
  }

  /* ---- ancient works across the city ---- */
  ancientWorks(cfg,S,gl,road,occupied);

  /* ---- gantries over the yards ---- */
  if(cfg.theme==='INDUSTRY'){
    for(let k=0;k<ri(1,3);k++){
      const a=rr(0,6.2832), d=S*rr(0.45,0.8);
      const gx=Math.cos(a)*d, gy=Math.sin(a)*d;
      if(occupied(gx,gy,4)) continue;
      gantryCrane(gx,gy,rr(5,8),rr(3.5,5.5),P);
    }
  }

  /* ---- railway ---- */
  buildRail(cfg,S,gl,road,occupied);

  /* ---- road circuits for traffic (terrain-following) ---- */
  const onBridge=(x,y)=>{
    const u=uOf(x,y);
    return (PATHS.bridgeU||[]).some(bu=>Math.abs(u-bu)<road*1.05);
  };
  const pathClear=(pts,pad)=>{
    for(const p of pts){
      if(occupied(p[0],p[1],pad||0.9)) return false;
      if(inField(p[0],p[1],1.2)) return false;                          // nor onto the airfield
      if(inRiver(p[0],p[1],0.35) && !onBridge(p[0],p[1])) return false;  // no driving on water
    }
    return true;
  };
  const mkRoad=(corners,closed,dir)=>{
    const out=[];
    const n=corners.length;
    for(let i=0;i<n-(closed?0:1);i++){
      const a=corners[i], b=corners[(i+1)%n];
      const L=Math.hypot(b[0]-a[0],b[1]-a[1]), steps=Math.max(1,Math.round(L));
      for(let k=0;k<steps;k++){
        const t=k/steps, x=a[0]+(b[0]-a[0])*t, y=a[1]+(b[1]-a[1])*t;
        out.push([x,y,gzRamp(x,y)+0.09]);
      }
    }
    if(!closed) out.push([corners[n-1][0],corners[n-1][1],gzRamp(corners[n-1][0],corners[n-1][1])+0.09]);
    const okPt=p=>{
      if(occupied(p[0],p[1],1.0)) return false;
      if(inField(p[0],p[1],1.2)) return false;
      if(inRiver(p[0],p[1],0.35) && !onBridge(p[0],p[1])) return false;
      return true;
    };
    if(closed){
      if(!out.every(okPt)) return null;             // a ring has to be whole
    }else{
      // an open lane is trimmed to its longest clear run instead of being dropped
      let best=[], run=[];
      for(const p of out){
        if(okPt(p)) run.push(p);
        else { if(run.length>best.length) best=run; run=[]; }
      }
      if(run.length>best.length) best=run;
      if(best.length<6) return null;
      out.length=0; for(const p of best) out.push(p);
    }
    const pth=mkPath(out,closed); pth.dir=dir||1;
    return pth;
  };
  const pushRoad=r=>{ if(r) PATHS.roads.push(r); };
  PATHS.roads=[];
  for(let a=0;a<gl.length-1;a++) for(let b=0;b<gl.length-1;b++){
    if(R()<0.45) continue;
    const off=road*0.30;
    const c=[XY(gl[a]+off,gl[b]+off),XY(gl[a+1]-off,gl[b]+off),
             XY(gl[a+1]-off,gl[b+1]-off),XY(gl[a]+off,gl[b+1]-off)];
    pushRoad(mkRoad(c,true));
  }
  for(const u of gl){                              // a carriageway each way
    if(ch(0.35)) continue;
    for(const sg of [-1,1]){
      const lane=u+sg*road*0.26;
      const a=XY(lane,-S*1.08), b=XY(lane,S*1.08);
      pushRoad(mkRoad(sg>0?[a,b]:[b,a],false,sg));
    }
  }
  for(const v of gl){
    if(ch(0.45)) continue;
    for(const sg of [-1,1]){
      const lane=v+sg*road*0.26;
      const a=XY(-S*1.08,lane), b=XY(S*1.08,lane);
      pushRoad(mkRoad(sg>0?[a,b]:[b,a],false,sg));
    }
  }
  // make sure the town always has a few usable circuits
  for(const f of [0.60,0.72,0.84,0.94,0.52]){
    if(PATHS.roads.length>=3) break;
    pushRoad(mkRoad([[-S*f,-S*f],[S*f,-S*f],[S*f,S*f],[-S*f,S*f]],true));
  }

  /* ---- pavements ---- */
  PATHS.walk=[];
  const wOff=road/2+0.42;
  for(const v of gl) for(const sg of [-1,1]){
    const pts=[];
    for(let u=-S*0.98;u<=S*0.98;u+=1.1){
      if(TERR.river && Math.abs(v+sg*wOff-riverV(u))<TERR.rw*0.95) continue;
      const c=XY(u,v+sg*wOff);
      pts.push([c[0],c[1],roadZ(u)+0.06]);
    }
    if(pts.length>3 && pathClear(pts,0.8)) PATHS.walk.push(mkPath(pts,false));
  }
  for(const u of gl) for(const sg of [-1,1]){
    const pts=[];
    for(let v=-S*0.98;v<=S*0.98;v+=1.1){
      const c=XY(u+sg*wOff,v);
      pts.push([c[0],c[1],roadZ(u+sg*wOff)+0.06]);
    }
    if(pts.length>3 && pathClear(pts,0.8)) PATHS.walk.push(mkPath(pts,false));
  }
  // a loop around each open block, so plazas and parks have footfall too
  for(let i=0;i<g;i++) for(let j=0;j<g;j++){
    if(R()<0.55) continue;
    const bx=-S+cell*(i+0.5), by=-S+cell*(j+0.5), hf=cell/2-road*0.75;
    if(inRiver(bx,by,hf)) continue;
    if(occupied(bx,by,cell*0.28)) continue;
    const c=[[bx-hf,by-hf],[bx+hf,by-hf],[bx+hf,by+hf],[bx-hf,by+hf]];
    const pts=[];
    for(let k=0;k<4;k++){
      const a=c[k], b=c[(k+1)%4], L=Math.hypot(b[0]-a[0],b[1]-a[1]), n2=Math.max(2,Math.round(L));
      for(let q=0;q<n2;q++){
        const t=q/n2, x=a[0]+(b[0]-a[0])*t, y=a[1]+(b[1]-a[1])*t;
        pts.push([x,y,gz(x,y)+0.06]);
      }
    }
    PATHS.walk.push(mkPath(pts,true));
  }

  /* ---- river navigation ---- */
  PATHS.river=null;
  if(TERR.river){
    const pts=[];
    for(let u=-S*1.05;u<=S*1.05;u+=1.2){
      const p=XY(u,riverV(u));
      pts.push([p[0],p[1],gz(p[0],p[1])-TERR.wDep+0.12]);
    }
    PATHS.river=mkPath(pts,false);
  }

  /* ---- multi-level subsurface ---- */
  LWK=1; ALK=1; KEEP=1;
  const lv = pick([1,1,2,2,3,4]);
  const lvH = rr(2.6,3.4);
  const baseZ = 0;                                    // datum
  const DEEP = ch(0.38);                              // a deep-level metro?
  const deepZ = DEEP ? -(lv*lvH + rr(1.2,2.2) + rr(6,11)) : 0;
  const dep = DEEP ? (-deepZ + rr(1.6,2.6)) : (lv*lvH + rr(1.2,2.2));
  cfg.dep=dep; cfg.levels=lv;
  quad([[-S,-S,-dep],[S,-S,-dep],[S,S,-dep],[-S,S,-dep]],{stroke:INK,lw:0.9,alpha:0.4});
  for(const c of [[S,-S],[S,S],[-S,S],[-S,-S]])
    seg([c[0],c[1],gz(c[0],c[1])],[c[0],c[1],-dep],{stroke:INK,lw:0.8,alpha:0.4});
  for(let k=0;k<26;k++){
    const t=k/26;
    seg([S,-S+2*S*t,-0.15],[S,-S+2*S*t-1.1,-1.35],{stroke:INK,lw:0.45,alpha:0.22});
    seg([-S+2*S*t,S,-0.15],[-S+2*S*t-1.1,S,-1.35],{stroke:INK,lw:0.45,alpha:0.22});
  }
  const slabs=[];
  for(let k=1;k<=lv;k++){
    const z=baseZ-k*lvH, inset=S*(0.90-k*0.045);
    slabs.push(z);
    quad([[-inset,-inset,z],[inset,-inset,z],[inset,inset,z],[-inset,inset,z]],
      {stroke:INK,lw:0.8,alpha:0.45});
    // column grid
    const cn=5, sp=inset*2/cn;
    for(let i=0;i<=cn;i++) for(let j=0;j<=cn;j++){
      if(R()<0.35) continue;
      const x=-inset+i*sp, y=-inset+j*sp;
      seg([x,y,z],[x,y,z+lvH*0.9],{stroke:INK,lw:0.5,alpha:0.3});
    }
    if(DLV>=1){                                      // a vehicle ramp to the level above
      const rx=rr(-inset*0.6,inset*0.6), ry=rr(-inset*0.6,inset*0.6);
      const ax2=ch(0.5), len=lvH*2.6;
      quad([[rx,ry,z],[rx+(ax2?len:1.4),ry+(ax2?1.4:len),z+lvH],
            [rx+(ax2?len:1.4)+(ax2?0:1.4),ry+(ax2?1.4:len)+(ax2?1.4:0),z+lvH],
            [rx+(ax2?0:1.4),ry+(ax2?1.4:0),z]],
        {stroke:INK,lw:0.55,alpha:0.38,pat:DLV>=2?'rule':null,pa:0.16});
      bump('RAMPS');
    }
    // parking bays on some levels
    if(ch(0.85)){
      const rows=ri(2,4);
      for(let r2=0;r2<rows;r2++){
        const y=rr(-inset*0.8,inset*0.8);
        for(let q=0;q<ri(5,11);q++){
          const x=-inset*0.8+q*1.3;
          if(x>inset*0.8) break;
          quad([[x,y,z+0.05],[x+1.0,y,z+0.05],[x+1.0,y+0.55,z+0.05],[x,y+0.55,z+0.05]],
            {stroke:INK,lw:0.4,alpha:0.3,fill:ch(0.3)?pick(P):null,a:0.3});
        }
      }
      bump('PARKING',ri(10,30));
    }
    bump('SUBLEVEL');
  }
  // vertical cores punching all levels
  for(let k=0;k<ri(2,4);k++){
    const x=rr(-S*0.6,S*0.6), y=rr(-S*0.6,S*0.6);
    box(x-0.7,y-0.7,-dep+0.3,1.4,1.4,dep+gz(x,y),{stroke:INK,lw:0.8,alpha:0.45,fill:null,hidden:false});
    bump('SHAFTS');
  }

  /* ---- metro, one line per level, sometimes one driven deep ---- */
  PATHS.metro=[]; PATHS.metroStops=[];
  const deepIdx = DEEP ? 0 : -1;
  const nLines=Math.min(lv,ri(1,3));
  for(let m=0;m<nLines;m++){
    const isDeep = (m===deepIdx);
    const a=rr(0,6.2832), c=Math.cos(a), sn=Math.sin(a);
    const off=rr(-S*0.35,S*0.35);
    const tz=isDeep ? deepZ
      : (slabs[Math.min(slabs.length-1,m)]!==undefined
          ? slabs[Math.min(slabs.length-1,m)] - lvH*0.45 : -dep*0.6);
    const pts=[];
    for(let k=0;k<=4;k++){
      const t=(k/4*2-1)*S*1.18, w=Math.sin(k/4*Math.PI)*rr(-3,3);
      pts.push([c*t-sn*(off+w), sn*t+c*(off+w), tz]);
    }
    const P2=mkPath(pts,false);
    PATHS.metro.push(P2);
    const stopsHere=[]; PATHS.metroStops.push(stopsHere);
    { const bedA=pts.map(q=>[q[0]-sn*0.95,q[1]+c*0.95,q[2]-0.8]);
      const bedB=pts.slice().reverse().map(q=>[q[0]+sn*0.95,q[1]-c*0.95,q[2]-0.8]);
      quad(bedA.concat(bedB),{stroke:INK,lw:0.5,alpha:0.3,fill:P[2],a:0.13}); }
    for(const o of [-0.62,0.62]){
      poly(pts.map(q=>[q[0]-sn*o,q[1]+c*o,q[2]]),{stroke:INK,lw:0.85,alpha:0.6});
    }
    const tube = isDeep ? true : ch(0.5);
    if(tube){                                       // a bored tube, ring by ring
      const R2=1.05, nR=40;
      for(let k=0;k<=nR;k++){
        const q=atPath(P2,P2.len*k/nR), rg=[];
        for(let i=0;i<=14;i++){
          const a2=i/14*6.2832;
          rg.push([q[0]-sn*Math.cos(a2)*R2, q[1]+c*Math.cos(a2)*R2, q[2]+0.15+Math.sin(a2)*R2]);
        }
        poly(rg,{stroke:INK,lw:k%4?0.4:0.6,alpha:k%4?0.26:0.45,close:true,dt:k%4?2:1});
      }
      for(const a2 of [Math.PI*0.25,Math.PI*0.75,Math.PI*1.25,Math.PI*1.75]){
        const ln=[];
        for(let k=0;k<=nR;k++){
          const q=atPath(P2,P2.len*k/nR);
          ln.push([q[0]-sn*Math.cos(a2)*R2, q[1]+c*Math.cos(a2)*R2, q[2]+0.15+Math.sin(a2)*R2]);
        }
        poly(ln,{stroke:INK,lw:0.5,alpha:0.35,dt:2});
      }
      bump('TVBE',nR);
    }else{
      for(let k=0;k<=30;k++){
        const q=atPath(P2,P2.len*k/30);
        poly([[q[0]-sn*0.95,q[1]+c*0.95,q[2]-0.8],[q[0]-sn*0.95,q[1]+c*0.95,q[2]+0.8],
              [q[0]+sn*0.95,q[1]-c*0.95,q[2]+0.8],[q[0]+sn*0.95,q[1]-c*0.95,q[2]-0.8]],
          {stroke:INK,lw:0.5,alpha:0.36,close:true});
      }
    }
    bump('TUNNEL');
    // one station to a line, or none at all — and it may sit near either end
    const nSt = isDeep ? 1 : (ch(0.32) ? 0 : 1);
    for(let st=0;st<nSt;st++){
      const f = rr(0.12,0.88);
      const q=atPath(P2,P2.len*f);
      stopsHere.push(P2.len*f);
      // the box lies along the line: long in the running direction, narrow across
      const HL = isDeep?4.6:3.6, HW = isDeep?1.9:1.5, hh = isDeep?3.0:2.4;
      const nx2=-sn, ny2=c;
      const rect=(a,b2)=>[q[0]+c*a+nx2*b2, q[1]+sn*a+ny2*b2];
      prism([rect(-HL,-HW),rect(HL,-HW),rect(HL,HW),rect(-HL,HW)],q[2]-1.0,hh,
        {stroke:INK,lw:0.95,alpha:0.62,fill:P[2],a:0.16,
         pat:(DLV>=2&&isDeep)?'grid':null,patFace:1,pa:0.18});
      const top=gz(q[0],q[1]);
      // platform edges, both sides of the track
      for(const o of [-1,1])
        seg([...rect(-HL*0.92,o*0.78),q[2]-0.9],[...rect(HL*0.92,o*0.78),q[2]-0.9],
          {stroke:INK,lw:0.55,alpha:0.45,dt:2});
      if(isDeep){
        // a shaft set beside the platform: escalators, a lift, a surface hall
        const sc2=rect(HL*0.55, HW+1.1);
        const sx=sc2[0], sy=sc2[1];
        prism([[sx-1.5,sy-1.1],[sx+1.5,sy-1.1],[sx+1.5,sy+1.1],[sx-1.5,sy+1.1]],
          q[2]+hh-1.0, top-(q[2]+hh-1.0),
          {stroke:INK,lw:0.8,alpha:0.5,fill:null});
        const n=Math.max(4,Math.round((top-q[2])/1.5));
        for(let k=0;k<n;k++){
          const z0=q[2]+hh-0.8+(top-q[2]-hh+0.8)*k/n;
          const z1=q[2]+hh-0.8+(top-q[2]-hh+0.8)*(k+1)/n;
          for(const o of [-0.7,0.1]){
            const a1=[sx+c*o-nx2*0.9+nx2*1.8*k/n, sy+sn*o-ny2*0.9+ny2*1.8*k/n];
            const a2=[sx+c*(o+0.65)-nx2*0.9+nx2*1.8*(k+1)/n,
                      sy+sn*(o+0.65)-ny2*0.9+ny2*1.8*(k+1)/n];
            seg([a1[0],a1[1],z0],[a2[0],a2[1],z1],{stroke:INK,lw:0.5,alpha:0.4,dt:1});
          }
        }
        const lf=[sx+c*1.15, sy+sn*1.15];
        seg([lf[0],lf[1],q[2]+hh-0.8],[lf[0],lf[1],top],{stroke:INK,lw:0.7,alpha:0.5});
        prism(planShape(3.4,2.4,'ROUNDED',0.35).map(w2=>[w2[0]+sx,w2[1]+sy]),top,1.5,
          {stroke:INK,lw:0.9,alpha:0.62,fill:P[0],a:0.14});
        bump('SHAFT');
      }else{
        // a stair barrel up to a street entrance, alongside the platform
        const e0=rect(HL*0.5, HW+0.6), e1=rect(HL*0.5-2.0, HW+0.6);
        seg([e0[0],e0[1],q[2]+1.4],[e0[0],e0[1],top],{stroke:INK,lw:0.7,alpha:0.45});
        seg([e1[0],e1[1],q[2]+1.4],[e1[0],e1[1],top],{stroke:INK,lw:0.7,alpha:0.45});
        const steps=Math.max(2,Math.round((top-q[2]-1.4)/0.55));
        for(let k=0;k<steps;k++)
          seg([e0[0],e0[1],q[2]+1.4+k*0.55],[e1[0],e1[1],q[2]+1.4+k*0.55],
            {stroke:INK,lw:0.4,alpha:0.24});
        const ec=rect(HL*0.5-1.0, HW+1.3);
        prism([[ec[0]-0.7,ec[1]-0.6],[ec[0]+0.7,ec[1]-0.6],[ec[0]+0.7,ec[1]+0.6],
               [ec[0]-0.7,ec[1]+0.6]],top,0.9,{stroke:INK,lw:0.8,alpha:0.6,fill:P[0],a:0.12});
      }
      {                                            // passengers, walking the platform
        for(const o of [-0.85,0.85]){
          const wp=[];
          for(let k=0;k<=6;k++){
            const f2=-HL*0.9+2*HL*0.9*k/6;
            wp.push([q[0]+c*f2+nx2*o, q[1]+sn*f2+ny2*o, q[2]-0.85]);
          }
          PATHS.walk.push(mkPath(wp,false));
        }
        if(isDeep){
          const cw=[];
          for(let k=0;k<=5;k++)
            cw.push([q[0]+nx2*(-1.4+2.8*k/5), q[1]+ny2*(-1.4+2.8*k/5), q[2]-0.85]);
          PATHS.walk.push(mkPath(cw,false));
        }
      }
      bump('STATION');
    }
    if(isDeep) cfg.deepMetro=nSt;
  }

  KEEP=0; LWK=1; ALK=1;
  /* ---- drone corridors ---- */
  PATHS.drone=[];
  cfg.drones = ch(0.55);
  if(cfg.drones){
    for(let k=0;k<ri(3,7);k++){
      const cx=rr(-S*0.9,S*0.9), cy=rr(-S*0.9,S*0.9);
      const rad=rr(2.0,5.5), z=TERR.riseH*TERR.nSteps+rr(5,14), n=ri(4,6), pts=[];
      for(let i=0;i<n;i++){
        const a=i/n*6.2832+rr(-0.2,0.2), rd=rad*rr(0.7,1.25);
        pts.push([cx+Math.cos(a)*rd, cy+Math.sin(a)*rd, z+rr(-0.8,0.8)]);
      }
      PATHS.drone.push(mkPath(pts,true));
    }
  }

  /* ---- flight corridors ---- */
  PATHS.air=[];
  for(let k=0;k<ri(2,3);k++){
    const a=rr(0,6.2832), z=TERR.riseH*TERR.nSteps+rr(20,32), off=rr(-S*0.7,S*0.7);
    const c=Math.cos(a), s2=Math.sin(a), D=S*2.4;
    PATHS.air.push(mkPath([[-c*D-s2*off,-s2*D+c*off,z],[c*D-s2*off,s2*D+c*off,z]],false));
  }
}

/* ============================================================
   AGENTS — drawn live on top of the cached plate
   ============================================================ */
let AGENTS={cars:[],train:[],planes:[],metro:[],drones:[],barges:[],peds:[]};

function spawnAgents(cfg){
  AGENTS={cars:[],train:[],planes:[],metro:[],drones:[],barges:[],peds:[]};
  const P=cfg.pal.c;
  const nCars=[10,18,28][cfg.density];
  {
    // each lane carries only what it can hold, and the cars start evenly spaced
    const lanes=(PATHS.roads||[]).map(p=>({path:p,
      cap:Math.max(2, Math.floor(p.len/5.0)), placed:0}));
    let guard=0;
    for(let i=0;i<nCars && lanes.length;i++){
      let pick2=null;
      for(let q=0;q<lanes.length;q++){                 // the emptiest lane first
        const L2=lanes[(i+q)%lanes.length];
        if(L2.placed<L2.cap){ pick2=L2; break; }
      }
      if(!pick2) break;
      const path=pick2.path;
      const cyc=path.closed?path.len:path.len*1.10;
      const slot=pick2.placed++;
      const spd=rr(1.9,3.2);
      AGENTS.cars.push({path,
        u:(slot+0.5)/pick2.cap*cyc + rr(-0.6,0.6),
        v:spd, v0:spd, col:ch(0.45)?pick(P):null, len:rr(0.50,0.72),
        kind:pick(['SEDAN','SEDAN','SEDAN','VAN','TRUCK'])});
      if(guard++>400) break;
    }
  }
  AGENTS.trains=[];
  // a terminus does not fill every platform at once: one train, sometimes two
  let allow=null;
  {
    const term=(PATHS.rails||[]).map((l,i)=>l.kind==='TERMINUS'?i:-1).filter(i=>i>=0);
    if(term.length>1){
      const want=ch(0.40)?2:1;
      allow=new Set();
      while(allow.size<Math.min(want,term.length))
        allow.add(term[Math.floor(R()*term.length)]);
    }
  }
  let li2=-1;
  for(const line of (PATHS.rails||[])){
    li2++;
    if(allow && line.kind==='TERMINUS' && !allow.has(li2)) continue;
    const k=line.kind;
    const nCars = k==='SHINKANSEN'? ri(4,7) : k==='STEAM'? ri(3,6)
                : k==='MONORAIL'? ri(2,4) : k==='TERMINUS'? ri(2,3) : ri(2,4);
    const v = k==='SHINKANSEN'? rr(7,11) : k==='STEAM'? rr(1.6,2.6)
            : k==='MONORAIL'? rr(3.0,4.4) : k==='TERMINUS'? rr(3.4,5.0) : rr(2.6,4.2);
    const carL = k==='SHINKANSEN'? 2.8 : k==='STEAM'? 1.5 : k==='MONORAIL'? 2.4 : 2.4;
    AGENTS.trains.push({line, s:R()*line.path.len, v:v*(ch(0.5)?1:-1),
      stopU:(line.closed&&PATHS.railStop)?PATHS.railStop.u:null,
      n:nCars, len:carL, kind:k, col:cfg.pal.c[0],
      t0:(k==='TERMINUS'? AGENTS.trains.length*7.5+rr(0,3) : rr(0,30)),
      dwell:rr(2.5,5.5), pause:rr(4.5,9.5)});
  }
  cfg.railN=AGENTS.trains.length;
  AGENTS.moves=[]; AGENTS.taxi=[]; AGENTS.parked=[];
  if(PATHS.runway){
    const n=ri(2,3), per=rr(20,30);
    for(let i=0;i<n;i++)
      AGENTS.moves.push({kind:ch(0.5)?'DEP':'ARR', dir:ch(0.5)?1:-1,
        period:per, t0:per*i/n, sz:rr(1.0,1.5),   // evenly spaced, never coincident
        col:ch(0.5)?cfg.pal.c[0]:null});
    if(PATHS.taxi) for(let i=0;i<ri(1,2);i++)
      AGENTS.taxi.push({path:PATHS.taxi, s:R()*PATHS.taxi.len,
        v:rr(0.5,0.9)*(ch(0.5)?1:-1), sz:rr(0.9,1.3),
        col:ch(0.4)?cfg.pal.c[0]:null});
    for(const g of (PATHS.gates||[])){
      if(ch(0.35)) continue;
      const a=rr(0,6.2832);
      AGENTS.parked.push({pos:[g[0],g[1],g[2]+0.05], hx:Math.cos(a), hy:Math.sin(a),
        sz:rr(0.9,1.3), col:ch(0.4)?cfg.pal.c[0]:null, ph:rr(0,6.28)});
    }
    bump('MOVEMENTS',AGENTS.moves.length);
  }
  for(const p of PATHS.air){
    AGENTS.planes.push({path:p, s:R()*p.len, v:rr(5,9), sz:rr(0.8,1.25), col:ch(0.4)?P[0]:null, trail:[]});
  }
  for(let mi=0; mi<PATHS.metro.length; mi++){ const mp=PATHS.metro[mi];
    {
      const L=mp.len, v=rr(3.0,5.0), dw=rr(2.6,4.4);
      const n=ri(2,4), gap=1.95, consist=(n-1)*gap;
      // the line continues beyond the sheet: the train leaves it entirely and waits
      const aMin=-(consist+0.8), aMax=L+0.8, hide=rr(3.5,7.0);
      const span=Math.max(0.6, L-consist);
      let stops=(PATHS.metroStops&&PATHS.metroStops[mi])||[];
      stops=stops.map(u=>Math.max(0,Math.min(span, u-consist*0.5)))
                 .filter(a=>a>span*0.04 && a<span*0.96).sort((a,b)=>a-b);
      const legs=[]; let prev=aMin, dir=1;
      const addRun=(from,to,d)=>legs.push({k:'run',from,to,dur:Math.abs(to-from)/v,dir:d});
      for(const a of stops){ addRun(prev,a,1); legs.push({k:'stop',at:a,dur:dw,dir:1}); prev=a; }
      addRun(prev,aMax,1); legs.push({k:'stop',at:aMax,dur:hide,dir:1});   // away, off sheet
      prev=aMax;
      for(let i=stops.length-1;i>=0;i--){
        addRun(prev,stops[i],-1); legs.push({k:'stop',at:stops[i],dur:dw,dir:-1}); prev=stops[i];
      }
      addRun(prev,aMin,-1); legs.push({k:'stop',at:aMin,dur:hide,dir:-1});
      const T=legs.reduce((x,l)=>x+l.dur,0);
      AGENTS.metro.push({path:mp, legs, T, t0:rr(0,T), n, gap});
    }
    bump('METRO');
  }
  AGENTS.barges=[];
  if(PATHS.river){
    for(let k=0;k<ri(1,3);k++)
      AGENTS.barges.push({path:PATHS.river, s:R()*PATHS.river.len, v:rr(0.7,1.4)*(ch(0.5)?1:-1),
        col:ch(0.5)?cfg.pal.c[1]:null});
    bump('BARGE',AGENTS.barges.length);
  }
  for(const dp of PATHS.drone){
    AGENTS.drones.push({path:dp, s:R()*dp.len, v:rr(1.2,2.6),
      hover:ch(0.3), bob:rr(0,6.28), col:ch(0.5)?cfg.pal.c[0]:null, pkg:ch(0.35)});
  }
  cfg.nDrones=AGENTS.drones.length;
  {                                              // group the cars by lane
    const map=new Map();
    for(const c of AGENTS.cars){
      if(!map.has(c.path)) map.set(c.path,[]);
      map.get(c.path).push(c);
    }
    AGENTS.lanes=[...map.entries()].map(([path,cars])=>({path,cars}));
  }
  const nPed=[26,44,70][cfg.density];
  for(let i=0;i<nPed;i++){
    const path=PATHS.walk[Math.floor(R()*PATHS.walk.length)];
    if(!path) break;
    const build2=pick(['STRAIGHT','STRAIGHT','SKIRT','SKIRT','COAT','CHILD']);
    AGENTS.peds.push({build:build2, scale: build2==='CHILD'?rr(0.62,0.76):rr(0.9,1.1),
      broad: rr(0.85,1.15),
      path, s:R()*path.len, v:rr(0.13,0.24)*(ch(0.5)?1:-1),
      ph:rr(0,6.28), pause:ch(0.14)?rr(2,7):0, col:ch(0.12)?pick(P):null});
    if(ch(0.22)){                              // companions walk in pairs
      const last=AGENTS.peds[AGENTS.peds.length-1];
      AGENTS.peds.push({build:pick(['STRAIGHT','SKIRT','COAT','CHILD']),
        scale:rr(0.7,1.08), broad:rr(0.85,1.15),
        path, s:last.s+rr(0.25,0.5), v:last.v, ph:last.ph+rr(0.6,2.4),
        pause:last.pause, col:null});
      i++;
    }
  }
  bump('FOOTFALL', AGENTS.peds.length);
  bump('TRANSIT', nCars+(AGENTS.trains?AGENTS.trains.length:0));
  bump('DRONES', AGENTS.drones.length);
}


/* ---- a road vehicle: body, greenhouse, wheels ---------------- */
function carBody(pos,hx,hy,L,W,col,alpha,o={}){
  const kind=o.kind||'SEDAN';
  const sc=(kind==='TRUCK')?1:0.8;                // a car is smaller than a lorry
  L*=sc; W*=sc;
  const nx=-hy, ny=hx;
  const th=Math.atan(o.slope||0), ct=Math.cos(th), st=Math.sin(th);
  const F=(f,l,z)=>{                              // pitch about the lateral axis
    const fw=f*L*ct-(z||0)*st;
    return [pos[0]+hx*fw+nx*l*W, pos[1]+hy*fw+ny*l*W, pos[2]+f*L*st+(z||0)*ct];
  };
  const bh = kind==='TRUCK'?0.22:0.26;
  const belt=[F(0.50,0,bh),F(0.44,0.42,bh),F(-0.44,0.46,bh),F(-0.50,0,bh),
              F(-0.44,-0.46,bh),F(0.44,-0.42,bh)];
  qpoly(belt,{lw:0.65,alpha,fill:col,fa:0.4});
  const sill=belt.map(p=>[p[0],p[1],p[2]-bh+0.07]);
  qpoly(sill,{lw:0.55,alpha:alpha*0.6});
  for(let i=0;i<belt.length;i++) qline(sill[i],belt[i],{lw:0.5,alpha:alpha*0.7});
  if(kind==='SEDAN'){
    const rz=bh+0.30;
    const top=[F(0.16,0.30,rz),F(-0.26,0.32,rz),F(-0.34,0,rz),F(-0.26,-0.32,rz),F(0.16,-0.30,rz)];
    qpoly(top,{lw:0.6,alpha,fill:col,fa:0.3});
    qline(F(0.40,0.34,bh),F(0.16,0.30,rz),{lw:0.5,alpha:alpha*0.8});
    qline(F(0.40,-0.34,bh),F(0.16,-0.30,rz),{lw:0.5,alpha:alpha*0.8});
    qline(F(-0.42,0.36,bh),F(-0.30,0.32,rz),{lw:0.5,alpha:alpha*0.7});
    qline(F(-0.42,-0.36,bh),F(-0.30,-0.32,rz),{lw:0.5,alpha:alpha*0.7});
    qline(F(0.16,0.30,rz),F(0.16,-0.30,rz),{lw:0.45,alpha:alpha*0.6});
  }else if(kind==='VAN'){
    const rz=bh+0.44;
    const top=[F(0.30,0.40,rz),F(-0.46,0.42,rz),F(-0.46,-0.42,rz),F(0.30,-0.40,rz)];
    qpoly(top,{lw:0.6,alpha,fill:col,fa:0.28});
    for(const c of [[0.30,0.40],[-0.46,0.42],[-0.46,-0.42],[0.30,-0.40]])
      qline(F(c[0],c[1],bh),F(c[0],c[1],rz),{lw:0.5,alpha:alpha*0.75});
    qline(F(0.48,0.34,bh),F(0.30,0.40,rz),{lw:0.5,alpha:alpha*0.8});
    qline(F(0.48,-0.34,bh),F(0.30,-0.40,rz),{lw:0.5,alpha:alpha*0.8});
  }else{
    const cz=bh+0.36, bz=bh+0.52;
    const cab=[F(0.50,0.36,cz),F(0.18,0.36,cz),F(0.18,-0.36,cz),F(0.50,-0.36,cz)];
    qpoly(cab,{lw:0.6,alpha,fill:col,fa:0.3});
    for(const c of [[0.50,0.36],[0.18,0.36],[0.18,-0.36],[0.50,-0.36]])
      qline(F(c[0],c[1],bh),F(c[0],c[1],cz),{lw:0.5,alpha:alpha*0.75});
    const bx=[F(0.12,0.44,bz),F(-0.50,0.44,bz),F(-0.50,-0.44,bz),F(0.12,-0.44,bz)];
    qpoly(bx,{lw:0.65,alpha,fill:col,fa:0.22});
    for(const c of [[0.12,0.44],[-0.50,0.44],[-0.50,-0.44],[0.12,-0.44]])
      qline(F(c[0],c[1],bh),F(c[0],c[1],bz),{lw:0.5,alpha:alpha*0.7});
  }
  for(const f of [0.34,-0.34]) for(const sg of [-1,1])
    qline(F(f,sg*0.46,0.02),F(f,sg*0.46,0.17),{lw:1.4,alpha:alpha*0.8});
}

/* ---- a hull: raked stem, flared sides, transom stern --------- */
function boat(pos,hx,hy,L,W,col,alpha,t,ph){
  const nx=-hy, ny=hx;
  const F=(f,l,z)=>[pos[0]+hx*f*L+nx*l*W, pos[1]+hy*f*L+ny*l*W, pos[2]+(z||0)];
  const sheer=0.30, draft=0.22;
  // deck outline
  const deck=[F(0.60,0,sheer*1.22),F(0.44,0.26,sheer*1.05),F(0.22,0.44,sheer),
              F(-0.16,0.50,sheer*0.92),F(-0.48,0.44,sheer*0.95),
              F(-0.48,-0.44,sheer*0.95),F(-0.16,-0.50,sheer*0.92),
              F(0.22,-0.44,sheer),F(0.44,-0.26,sheer*1.05)];
  qpoly(deck,{lw:0.85,alpha,fill:col,fa:0.34});
  // waterline, narrower and lower — gives the hull its flare
  const wl=[F(0.52,0,0),F(0.40,0.17,0),F(0.20,0.31,0),
            F(-0.16,0.36,0),F(-0.46,0.32,0),
            F(-0.46,-0.32,0),F(-0.16,-0.36,0),
            F(0.20,-0.31,0),F(0.40,-0.17,0)];
  qpoly(wl,{lw:0.7,alpha:alpha*0.75});
  for(let i=0;i<deck.length;i++)
    qline(deck[i],wl[i],{lw:0.55,alpha:alpha*0.7});
  // keel line below the waterline
  qpoly([F(0.56,0,0),F(0.24,0,-draft),F(-0.42,0,-draft),F(-0.46,0,0)],
    {lw:0.6,alpha:alpha*0.5,close:false});
  // the transom itself
  qpoly([F(-0.48,-0.44,sheer*0.95),F(-0.48,0.44,sheer*0.95),
         F(-0.46,0.32,0),F(-0.46,-0.32,0)],{lw:0.7,alpha:alpha*0.8,fill:col,fa:0.24});
  // deckhouse and funnel
  qpoly([F(-0.05,-0.26,sheer),F(0.20,-0.26,sheer),F(0.20,0.26,sheer),F(-0.05,0.26,sheer)],
    {lw:0.6,alpha:alpha*0.8});
  const dh=[F(-0.05,-0.26,sheer+0.42),F(0.20,-0.26,sheer+0.42),
            F(0.20,0.26,sheer+0.42),F(-0.05,0.26,sheer+0.42)];
  qpoly(dh,{lw:0.7,alpha,fill:col,fa:0.26});
  for(const c of [[-0.05,-0.26],[0.20,-0.26],[0.20,0.26],[-0.05,0.26]])
    qline(F(c[0],c[1],sheer),F(c[0],c[1],sheer+0.42),{lw:0.6,alpha:alpha*0.8});
  qline(F(0.02,0,sheer+0.42),F(0.02,0,sheer+0.95),{lw:1.3,alpha});     // funnel
  qline(F(-0.30,0,sheer),F(-0.30,0,sheer+0.85),{lw:0.6,alpha:alpha*0.8}); // mast
  // wake
  ctx.save(); ctx.globalAlpha=0.26*alpha; ctx.strokeStyle=INK; ctx.lineWidth=0.55;
  for(const sg of [-1,1]){
    const a=pr(...F(-0.45,sg*0.3,0)), b=pr(pos[0]-hx*L*2.4+nx*sg*W*1.5,
                                           pos[1]-hy*L*2.4+ny*sg*W*1.5, pos[2]);
    ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
  }
  ctx.restore(); ctx.globalAlpha=1;
}

/* ---- an airliner, drawn from its planform ------------------- */
function airliner(pos,hx,hy,SZ,col,alpha,t,ph,o={}){
  const nx=-hy, ny=hx;
  const F=(f,l,v)=>[pos[0]+hx*f*SZ+nx*l*SZ, pos[1]+hy*f*SZ+ny*l*SZ, pos[2]+(v||0)*SZ];
  qpoly([F(2.3,0),F(1.7,0.20),F(-1.5,0.20),F(-2.3,0.07),
         F(-2.3,-0.07),F(-1.5,-0.20),F(1.7,-0.20)],
    {lw:0.85,alpha:alpha,fill:col,fa:0.34});
  for(const sg of [1,-1]){
    qpoly([F(0.75,sg*0.18),F(-0.55,sg*2.05),F(-1.05,sg*2.05),F(-0.35,sg*0.18)],
      {lw:0.75,alpha:alpha*0.88,fill:col,fa:0.24});
    qpoly([F(0.15,sg*0.85),F(0.15,sg*1.15),F(-0.45,sg*1.15),F(-0.45,sg*0.85)],
      {lw:0.6,alpha:alpha*0.72});
  }
  for(const sg of [1,-1])
    qpoly([F(-1.65,sg*0.14),F(-2.15,sg*0.85),F(-2.35,sg*0.85),F(-2.05,sg*0.14)],
      {lw:0.65,alpha:alpha*0.78,fill:col,fa:0.2});
  qpoly([F(-1.45,0,0),F(-2.3,0,0),F(-2.35,0,0.62),F(-1.85,0,0.66)],
    {lw:0.75,alpha:alpha*0.9,fill:col,fa:0.22});
  if(o.gear){
    for(const g of [[1.5,0],[-0.4,0.55],[-0.4,-0.55]])
      qline(F(g[0],g[1],0),F(g[0],g[1],-0.34),{lw:0.55,alpha:alpha*0.7});
  }
  const st=(Math.sin(t*6.0+(ph||0))+1)/2;
  const wt=pr(...F(-0.55,2.05));
  ctx.globalAlpha=(0.2+st*0.7)*alpha; ctx.fillStyle=CFG.pal.c[0];
  ctx.beginPath(); ctx.arc(wt[0],wt[1],1.6,0,6.2832); ctx.fill(); ctx.globalAlpha=1;
}

/* ---- rolling stock ---------------------------------------- */
function railCar(pos,hx,hy,L,Wd,Ht,col,alpha,o={}){
  const nx=-hy, ny=hx, rz=(o.rideZ||0.18);
  const th=Math.atan(o.slope||0), ct=Math.cos(th), st=Math.sin(th);
  const F=(f,l,z)=>{
    const fw=f*L*ct-(z||0)*st;
    return [pos[0]+hx*fw+nx*l*Wd, pos[1]+hy*fw+ny*l*Wd, pos[2]+f*L*st+(z||0)*ct];
  };
  const c=(a,b)=>F(a,b,rz);
  const z0=pos[2]+rz, z1=z0+Ht;
  const q0=[[0.5,-0.5],[0.5,0.5],[-0.5,0.5],[-0.5,-0.5]];
  const q=q0.map(k=>c(k[0],k[1]));
  qpoly(q0.map(k=>F(k[0],k[1],rz+Ht)),{lw:0.85,alpha,fill:col,fa:(o.fa||0.4)});
  qpoly(q,{lw:0.7,alpha:alpha*0.6});
  for(const k of q0) qline(F(k[0],k[1],rz),F(k[0],k[1],rz+Ht),{lw:0.7,alpha:alpha*0.85});
  qline(F(0.5,0,rz+Ht),F(-0.5,0,rz+Ht),{lw:0.75,alpha:alpha*0.7});   // roof ridge
  // window band
  if(o.windows!==false){
    const wz=z0+Ht*0.52;
    qline(F(0.44,-0.5,rz+Ht*0.52),F(-0.44,-0.5,rz+Ht*0.52),{lw:0.5,alpha:alpha*0.6});
    qline(F(0.44,0.5,rz+Ht*0.52),F(-0.44,0.5,rz+Ht*0.52),{lw:0.5,alpha:alpha*0.6});
  }
  // nose taper for high-speed stock
  if(o.nose){
    const tip=F(0.86,0,rz+Ht*0.42);
    qpoly([F(0.5,-0.5,rz+Ht),F(0.5,0.5,rz+Ht),tip],{lw:0.75,alpha,fill:col,fa:0.3});
    qpoly([F(0.5,-0.5,rz),F(0.5,0.5,rz),tip],{lw:0.7,alpha:alpha*0.7});
  }
  // skirt that straddles a monorail beam
  if(o.straddle){
    const s2=[[0.42,-0.5],[0.42,0.5],[-0.42,0.5],[-0.42,-0.5]];
    qpoly(s2.map(k=>F(k[0],k[1],-0.5)),{lw:0.6,alpha:alpha*0.7});
    for(const k of s2) qline(F(k[0],k[1],-0.5),F(k[0],k[1],rz),{lw:0.55,alpha:alpha*0.6});
  }else if(o.bogies!==false){
    for(const t of [-0.32,0.32])
      qline(F(t,-0.42,0.06),F(t,0.42,0.06),{lw:0.6,alpha:alpha*0.7});
  }
}
function steamLoco(pos,hx,hy,col,alpha,t){
  const nx=-hy, ny=hx;
  const F=(f,l,z)=>[pos[0]+hx*f+nx*l, pos[1]+hy*f+ny*l, pos[2]+z];
  // boiler
  const bz=pos[2]+0.26;
  for(const s of [-1,1])
    qpoly([F(0.95,s*0.24,0.26),F(-0.25,s*0.24,0.26),F(-0.25,s*0.24,0.78),F(0.95,s*0.24,0.78)],
      {lw:0.8,alpha,fill:col,fa:0.34});
  qpoly([F(0.95,-0.24,0.78),F(0.95,0.24,0.78),F(-0.25,0.24,0.78),F(-0.25,-0.24,0.78)],
    {lw:0.75,alpha:alpha*0.9,fill:col,fa:0.3});
  qpoly([F(0.95,-0.24,0.26),F(0.95,0.24,0.26),F(0.95,0.24,0.78),F(0.95,-0.24,0.78)],
    {lw:0.75,alpha});
  // cab
  qpoly([F(-0.28,-0.28,0.26),F(-1.0,-0.28,0.26),F(-1.0,-0.28,1.06),F(-0.28,-0.28,1.06)],
    {lw:0.8,alpha,fill:col,fa:0.32});
  qpoly([F(-0.28,0.28,0.26),F(-1.0,0.28,0.26),F(-1.0,0.28,1.06),F(-0.28,0.28,1.06)],
    {lw:0.7,alpha:alpha*0.7});
  qpoly([F(-0.28,-0.28,1.06),F(-0.28,0.28,1.06),F(-1.0,0.28,1.06),F(-1.0,-0.28,1.06)],
    {lw:0.75,alpha:alpha*0.9,fill:col,fa:0.28});
  // chimney and dome
  const st=F(0.78,0,0.78), sp=pr(st[0],st[1],st[2]+0.42);
  qline(F(0.78,0,0.78),F(0.78,0,1.20),{lw:1.5,alpha});
  qline(F(0.30,0,0.78),F(0.30,0,0.98),{lw:1.1,alpha:alpha*0.8});
  // wheels
  for(const f of [0.62,0.18,-0.30,-0.78]){
    const c=pr(...F(f,0,0.2));
    ctx.globalAlpha=alpha*0.75; ctx.strokeStyle=INK; ctx.lineWidth=0.7;
    ctx.beginPath(); ctx.arc(c[0],c[1],f>0?3.4:4.2,0,6.2832); ctx.stroke();
  }
  ctx.globalAlpha=1;
  // smoke, drifting back
  ctx.save();
  for(let i=0;i<7;i++){
    const ph=(t*0.55+i*0.16)%1;
    const p=pr(pos[0]-hx*ph*4.2, pos[1]-hy*ph*4.2, pos[2]+1.25+ph*2.6);
    ctx.globalAlpha=0.22*(1-ph); ctx.fillStyle=INK;
    ctx.beginPath(); ctx.arc(p[0],p[1],2.2+ph*7.5,0,6.2832); ctx.fill();
  }
  ctx.restore(); ctx.globalAlpha=1;
}

/* quick immediate-mode helpers (no jitter — these move every frame) */
function qline(a,b,{lw=0.8,alpha=0.7,color=INK}={}){
  const p=pr(a[0],a[1],a[2]), q=pr(b[0],b[1],b[2]);
  ctx.globalAlpha=alpha; ctx.strokeStyle=color; ctx.lineWidth=lw;
  ctx.beginPath(); ctx.moveTo(p[0],p[1]); ctx.lineTo(q[0],q[1]); ctx.stroke();
  ctx.globalAlpha=1;
}
function qpoly(pts,{lw=0.8,alpha=0.7,color=INK,fill=null,fa=0.3,close=true}={}){
  ctx.beginPath();
  pts.forEach((v,i)=>{ const p=pr(v[0],v[1],v[2]); i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]); });
  if(close) ctx.closePath();
  if(fill){ ctx.globalAlpha=fa; ctx.fillStyle=fill; ctx.fill(); }
  ctx.globalAlpha=alpha; ctx.strokeStyle=color; ctx.lineWidth=lw; ctx.stroke();
  ctx.globalAlpha=1;
}
function vehicle(pos,hx,hy,L,Wd,Ht,col,alpha,o={}){
  const nx=-hy, ny=hx;
  const th=Math.atan(o.slope||0), ct=Math.cos(th), st=Math.sin(th);
  const F=(f,l,z)=>{
    const fw=f*L*ct-(z||0)*st;
    return [pos[0]+hx*fw+nx*l*Wd, pos[1]+hy*fw+ny*l*Wd, pos[2]+f*L*st+(z||0)*ct];
  };
  const q0=[[0.5,-0.5],[0.5,0.5],[-0.5,0.5],[-0.5,-0.5]];
  qpoly(q0.map(c=>F(c[0],c[1],Ht)),{lw:0.8,alpha,fill:col,fa:0.42});
  qpoly(q0.map(c=>F(c[0],c[1],0)),{lw:0.7,alpha:alpha*0.6});
  for(const c of q0) qline(F(c[0],c[1],0),F(c[0],c[1],Ht),{lw:0.7,alpha:alpha*0.8});
}

let ANIM_ON=true;
function drawAgents(t){
  if(!ANIM_ON || !CFG) return;
  ctx.lineCap='round'; ctx.lineJoin='round';

  /* --- road traffic --- */
  const dtc=Math.min(0.25,Math.max(0,t-(AGENTS._t===undefined?t:AGENTS._t)));
  AGENTS._t=t;
  for(const g of (AGENTS.lanes||[])){
    const L=g.path.len, cycle=g.path.closed?L:L*1.10;
    for(const c of g.cars){                       // follow the car in front
      const minGap=c.len*2.4, safe=c.len*6.0, look=c.len*9.0;
      let best=1e9, lead=null;
      for(const o of g.cars){
        if(o===c) continue;
        if(!g.path.closed && o.u>L) continue;     // that one is off the sheet
        const d=((o.u-c.u)%cycle+cycle)%cycle;
        if(d>0.001 && d<best){ best=d; lead=o; }
      }
      let target=c.v0;
      if(lead && best<look){
        const gap=best-minGap;
        target=Math.max(c.v0*0.14,                // always creeping, never locked
               Math.min(c.v0, lead.v*0.95+(gap/safe)*c.v0*0.5));
      }
      c.v += (target-c.v)*Math.min(1,dtc*3.5);
      c.v = Math.max(c.v, c.v0*0.12);
      c.u = (c.u + c.v*dtc) % cycle;
    }
  }
  for(const g of (AGENTS.lanes||[])) for(const c of g.cars){
    const L=g.path.len;
    if(!g.path.closed && c.u>L) continue;         // between passes, off the sheet
    const pos=atPath(g.path,Math.min(c.u,L));
    const ahead=atPath(g.path,Math.min(L,c.u+0.25));
    let hx=ahead[0]-pos[0], hy=ahead[1]-pos[1];
    const m=Math.hypot(hx,hy)||1; hx/=m; hy/=m;
    const slope=(ahead[2]-pos[2])/m;              // the car pitches with the road
    carBody(pos,hx,hy,c.len*2.3,c.len*0.82,NIGHT?null:c.col,0.78,{slope,kind:c.kind});
    if(NIGHT){
      const hp=pr(pos[0]+hx*c.len*1.15,pos[1]+hy*c.len*1.15,pos[2]+c.len*0.4);
      const g=ctx.createRadialGradient(hp[0],hp[1],0,hp[0],hp[1],11);
      g.addColorStop(0,'rgba(255,226,160,0.85)'); g.addColorStop(1,'rgba(255,226,160,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(hp[0],hp[1],11,0,6.2832); ctx.fill();
      const tp=pr(pos[0]-hx*c.len*1.15,pos[1]-hy*c.len*1.15,pos[2]+c.len*0.4);
      ctx.globalAlpha=0.7; ctx.fillStyle='#ff6a55';
      ctx.beginPath(); ctx.arc(tp[0],tp[1],1.5,0,6.2832); ctx.fill(); ctx.globalAlpha=1;
    }
  }

  /* --- pedestrians --- */
  {
    ctx.strokeStyle=INK; ctx.lineCap='round';
    for(const pd of AGENTS.peds){
      const L=pd.path.len;
      let u, dir=1, walked;
      if(pd.pause){ u=pd.s; walked=0; }
      else if(pd.path.closed){ u=pd.s+pd.v*t; walked=u; }
      else{
        const m=(((pd.s+pd.v*t)%(2*L))+2*L)%(2*L);
        u=m<L?m:2*L-m; dir=m<L?1:-1; walked=pd.s+pd.v*t;
      }
      const pos=atPath(pd.path,u);
      const p0=pr(pos[0],pos[1],pos[2]);
      const p1=pr(pos[0],pos[1],pos[2]+0.57*(pd.scale||1));
      const hh=p0[1]-p1[1];
      if(hh<3.2){                               // too small to articulate
        ctx.globalAlpha=0.5; ctx.fillStyle=pd.col||INK;
        ctx.fillRect(p0[0]-0.8,p0[1]-1.9,1.6,1.9); continue;
      }
      const cyc = pd.pause?0:(walked*6.6+pd.ph);
      const bob = pd.pause?0:Math.abs(Math.sin(cyc))*hh*0.012;
      const X=p0[0], G=p0[1];
      const hipY=G-hh*0.47+bob, shY=G-hh*0.78+bob, headY=G-hh*0.905+bob;
      const bw=(pd.broad||1);
      const build2=pd.build||'STRAIGHT';
      const shoulder=hh*(build2==='CHILD'?0.088:0.100)*bw;
      const waist=hh*(build2==='SKIRT'?0.058:0.070)*bw;
      ctx.fillStyle=pd.col||INK; ctx.strokeStyle=pd.col||INK;
      ctx.globalAlpha=pd.col?0.72:0.66;
      // the torso: a coat flares, a skirt widens below the waist
      ctx.beginPath();
      if(build2==='SKIRT'){
        ctx.moveTo(X-shoulder,shY); ctx.lineTo(X+shoulder,shY);
        ctx.lineTo(X+waist,hipY-hh*0.09);
        ctx.lineTo(X+waist*1.85,hipY+hh*0.06);
        ctx.lineTo(X-waist*1.85,hipY+hh*0.06);
        ctx.lineTo(X-waist,hipY-hh*0.09);
      }else if(build2==='COAT'){
        ctx.moveTo(X-shoulder*1.1,shY); ctx.lineTo(X+shoulder*1.1,shY);
        ctx.lineTo(X+shoulder*0.95,hipY+hh*0.05);
        ctx.lineTo(X-shoulder*0.95,hipY+hh*0.05);
      }else{
        ctx.moveTo(X-shoulder,shY); ctx.lineTo(X+shoulder,shY);
        ctx.lineTo(X+waist,hipY); ctx.lineTo(X-waist,hipY);
      }
      ctx.closePath(); ctx.fill();
      // legs: the swing leg bends and lifts, the stance leg stays straight
      const legTop = build2==='SKIRT' ? hipY+hh*0.05 : hipY;
      ctx.globalAlpha=0.78; ctx.lineWidth=Math.max(0.5,hh*0.048);
      ctx.beginPath();
      for(let i=0;i<2;i++){
        const a=cyc+i*Math.PI;
        const sw2=Math.sin(a);                    // hip swing, forward positive
        const swing=Math.max(0,-Math.cos(a));     // 1 while the foot is off the ground
        const kneeX=X+sw2*hh*0.085;
        const kneeY=legTop+(G-legTop)*0.52 - swing*hh*0.018;
        const footX=X+sw2*hh*0.150;
        const footY=G - swing*swing*hh*0.055;     // the foot clears the ground
        ctx.moveTo(X,legTop); ctx.lineTo(kneeX,kneeY); ctx.lineTo(footX,footY);
        ctx.moveTo(footX,footY); ctx.lineTo(footX+sw2*hh*0.030,footY+hh*0.004);
      }
      ctx.stroke();
      // arms, opposed to the legs
      ctx.lineWidth=Math.max(0.42,hh*0.038);
      ctx.beginPath();
      for(let i=0;i<2;i++){
        const a=cyc+i*Math.PI;
        const sw2=-Math.sin(a);
        const sx2=X+(i?shoulder:-shoulder)*0.85;
        const ex=sx2+sw2*hh*0.075, ey=shY+hh*0.17;
        ctx.moveTo(sx2,shY+hh*0.02); ctx.lineTo(ex,ey);
        ctx.lineTo(ex+sw2*hh*0.035, shY+hh*0.31);
      }
      ctx.stroke();
      // neck and a small head
      ctx.lineWidth=Math.max(0.38,hh*0.032);
      ctx.beginPath(); ctx.moveTo(X,shY); ctx.lineTo(X,headY+hh*0.042); ctx.stroke();
      ctx.globalAlpha=pd.col?0.72:0.68;
      ctx.beginPath();
      ctx.ellipse(X,headY,Math.max(0.8,hh*0.055),Math.max(0.9,hh*0.064),0,0,6.2832);
      ctx.fill();
    }
    ctx.globalAlpha=1;
  }

  /* --- passengers boarding at the elevated platform --- */
  if(PATHS.railStop && AGENTS.trains && AGENTS.trains.length){
    const S0=PATHS.railStop;
    const tr=AGENTS.trains.find(x=>x.line.closed && x.stopU!=null);
    if(tr){
      const vv2=Math.abs(tr.v), lap=tr.line.path.len/vv2, dwl=tr.dwell||3.5, per=lap+dwl;
      const ph2=(((t+(tr.t0||0))%per)+per)%per;
      if(ph2<dwl){
        const q=ph2/dwl;
        for(let i=0;i<5;i++){
          const f=(-0.7+0.35*i)*S0.HL;
          const off=i%2? 1 : -1;                    // some board, some alight
          const e=Math.max(0,Math.min(1,(q-0.12*i)/0.45));
          const lat=off>0 ? S0.HW*0.55*(1-e) + S0.HW*0.05*e
                          : S0.HW*0.10*(1-e) + S0.HW*0.6*e;
          const px=S0.x+S0.hx*f+S0.nx*lat*(i%3?1:-1);
          const py=S0.y+S0.hy*f+S0.ny*lat*(i%3?1:-1);
          const p0=pr(px,py,S0.z), p1=pr(px,py,S0.z+0.5);
          const hh=Math.max(3,p0[1]-p1[1]);
          ctx.save(); ctx.fillStyle=INK; ctx.globalAlpha=0.72;
          ctx.beginPath();
          ctx.moveTo(p0[0]-hh*0.10,p0[1]-hh*0.78);
          ctx.lineTo(p0[0]+hh*0.10,p0[1]-hh*0.78);
          ctx.lineTo(p0[0]+hh*0.07,p0[1]-hh*0.47);
          ctx.lineTo(p0[0]-hh*0.07,p0[1]-hh*0.47);
          ctx.closePath(); ctx.fill();
          ctx.lineWidth=Math.max(0.5,hh*0.05); ctx.strokeStyle=INK;
          ctx.beginPath();
          ctx.moveTo(p0[0],p0[1]-hh*0.47); ctx.lineTo(p0[0]-hh*0.06,p0[1]);
          ctx.moveTo(p0[0],p0[1]-hh*0.47); ctx.lineTo(p0[0]+hh*0.06,p0[1]);
          ctx.stroke();
          ctx.beginPath(); ctx.arc(p0[0],p0[1]-hh*0.88,Math.max(0.8,hh*0.06),0,6.2832);
          ctx.fill(); ctx.restore(); ctx.globalAlpha=1;
        }
      }
    }
  }

  /* --- the turntable: a locomotive is run on, turned, and run off --- */
  if(PATHS.turntable){
    const T=PATHS.turntable, cyc=22;
    const ph=((t%cyc)+cyc)%cyc/cyc;
    const ease=x=>x*x*(3-2*x);
    const idx=Math.floor((t/cyc)%T.stalls.length);
    const aStall=T.stalls[idx];
    let ang=T.aLead, loco=null, lvis=1, lang=T.aLead;
    if(ph<0.22){                                   // running in along the lead
      const q=ph/0.22;
      loco=[T.lead[0]+(T.cx-T.lead[0])*q, T.lead[1]+(T.cy-T.lead[1])*q, T.z+0.1];
      lang=Math.atan2(T.cy-T.lead[1],T.cx-T.lead[0]);
      ang=T.aLead;
    }else if(ph<0.42){                             // turning
      const q=ease((ph-0.22)/0.20);
      ang=T.aLead+(aStall-T.aLead)*q;
      lang=ang; loco=[T.cx,T.cy,T.z+0.1];
    }else if(ph<0.62){                             // running off into the shed
      const q=(ph-0.42)/0.20;
      ang=aStall; lang=aStall;
      const d=T.r*0.1+q*T.stallR;
      loco=[T.cx+Math.cos(aStall)*d, T.cy+Math.sin(aStall)*d, T.z+0.1];
      lvis=1-Math.max(0,(q-0.72)/0.28);
    }else if(ph<0.80){                             // the empty bridge returns
      ang=aStall+(T.aLead-aStall)*ease((ph-0.62)/0.18);
    }
    const ux=Math.cos(ang), uy=Math.sin(ang), vx=-uy, vy=ux;
    const A=[T.cx-ux*T.r,T.cy-uy*T.r,T.z+0.05], B=[T.cx+ux*T.r,T.cy+uy*T.r,T.z+0.05];
    for(const o of [-0.34,0.34])
      qline([A[0]+vx*o,A[1]+vy*o,A[2]],[B[0]+vx*o,B[1]+vy*o,B[2]],{lw:0.9,alpha:0.75});
    for(const o of [-0.5,0.5])
      qline([A[0]+vx*o,A[1]+vy*o,A[2]-0.1],[B[0]+vx*o,B[1]+vy*o,B[2]-0.1],{lw:0.7,alpha:0.6});
    for(let i=0;i<=8;i++){
      const f=i/8;
      const px=A[0]+(B[0]-A[0])*f, py=A[1]+(B[1]-A[1])*f;
      qline([px+vx*0.5,py+vy*0.5,A[2]-0.1],[px+vx*0.5,py+vy*0.5,A[2]+0.45],{lw:0.45,alpha:0.4});
      qline([px-vx*0.5,py-vy*0.5,A[2]-0.1],[px-vx*0.5,py-vy*0.5,A[2]+0.45],{lw:0.45,alpha:0.4});
    }
    qline([T.cx,T.cy,T.z-0.5],[T.cx,T.cy,T.z+0.3],{lw:0.8,alpha:0.6});
    if(loco && lvis>0.02)
      steamLoco(loco,Math.cos(lang),Math.sin(lang),CFG.pal.c[0],0.82*lvis,t);
  }

  /* --- trains --- */
  for(const tr of (AGENTS.trains||[])){
    const P2=tr.line.path, L=P2.len;
    let base = tr.s + tr.v*t;
    let atStop=false;
    if(P2.closed && tr.stopU!==null && tr.stopU!==undefined){
      // round the ring, then stand at the platform while passengers change
      const vv2=Math.abs(tr.v), lap=L/vv2, dwl=tr.dwell||3.5, per=lap+dwl;
      const ph2=(((t+(tr.t0||0))%per)+per)%per;
      const run=Math.max(0,ph2-dwl);
      atStop = ph2<dwl;
      base = tr.stopU + (tr.v>=0?1:-1)*run*vv2 + (tr.n-1)*tr.len*1.06*0.5;
    }
    const dir = tr.v>=0?1:-1;
    const gap=tr.len*1.06;
    // it runs off one edge, waits out of sight, then re-enters at the other
    const vv=Math.abs(tr.v), consist=(tr.n-1)*gap;
    const cycle=L + consist + vv*(tr.pause||6);
    const prog=((vv*t+tr.s)%cycle+cycle)%cycle;
    const head = dir>0 ? prog : L-prog;
    // a terminus: stand at the buffers, run out of the sheet, wait, come back
    let tailU=0, tdir=1;
    if(tr.kind==='TERMINUS' && !P2.closed){
      const consist=(tr.n-1)*gap;
      const runLen=L+consist+0.5;                    // until the last car is clear
      const vv=Math.max(0.4,Math.abs(tr.v)), runT=runLen/vv;
      const dw=tr.dwell||3.5, pz=(tr.pause||6)*0.7;
      const per=2*runT+dw+pz;
      const ph=(((t+(tr.t0||0))%per)+per)%per;
      if(ph<dw){ tailU=0; tdir=1; }                                     // at the buffers
      else if(ph<dw+runT){ tailU=((ph-dw)/runT)*runLen; tdir=1; }       // departing
      else if(ph<dw+runT+pz){ tailU=runLen; tdir=1; }                   // away, off sheet
      else { tailU=runLen*(1-(ph-dw-runT-pz)/runT); tdir=-1; }          // arriving
    }
    for(let k=0;k<tr.n;k++){
      let u, d2=dir;
      if(P2.closed){ u=base-k*gap; }
      else if(tr.kind==='TERMINUS'){
        u=tailU+k*gap; d2=1;                     // stock is symmetrical: it never turns round
        if(u<-0.1||u>L+0.1) continue;            // that car has left the sheet
      }else{
        u=head-dir*k*gap;
        if(u<-0.1||u>L+0.1) continue;            // that car is still off the sheet
      }
      // a ring wraps; only an open line is clamped to its ends
      const uu = P2.closed ? u : Math.max(0,Math.min(L,u));
      const pos=atPath(P2,uu);
      const ah=atPath(P2, P2.closed ? uu+0.6*d2 : Math.max(0,Math.min(L,uu+0.6*d2)));
      let hx=ah[0]-pos[0], hy=ah[1]-pos[1];
      const mm=Math.hypot(hx,hy)||1; hx/=mm; hy/=mm;
      if(tr.kind==='STEAM' && k===0){ steamLoco(pos,hx,hy,tr.col,0.82,t); continue; }
      const rslope=(ah[2]-pos[2])/mm;
      railCar(pos,hx,hy,tr.len,
        tr.kind==='SHINKANSEN'?0.66:tr.kind==='MONORAIL'?0.70:0.74,
        tr.kind==='SHINKANSEN'?0.70:0.92,
        NIGHT?'#ffd79a':(tr.col||CFG.pal.c[0]), 0.95,
        {nose: tr.kind==='SHINKANSEN' && k===0,
         straddle: tr.kind==='MONORAIL',
         slope: rslope, fa:0.62,
         rideZ: tr.kind==='MONORAIL'?0.34:0.30});
      if(NIGHT){                                   // window glow along the side
        for(let q=0;q<3;q++){
          const f=(q-1)*tr.len*0.28;
          const wp=pr(pos[0]+hx*f,pos[1]+hy*f,pos[2]+0.62);
          ctx.globalAlpha=0.5; ctx.fillStyle='#ffe6b4';
          ctx.beginPath(); ctx.arc(wp[0],wp[1],1.5,0,6.2832); ctx.fill();
        }
        ctx.globalAlpha=1;
      }
      if(NIGHT && k===0){
        const hp=pr(pos[0]+hx*tr.len*0.7,pos[1]+hy*tr.len*0.7,pos[2]+0.5);
        const g=ctx.createRadialGradient(hp[0],hp[1],0,hp[0],hp[1],13);
        g.addColorStop(0,'rgba(255,232,180,0.9)'); g.addColorStop(1,'rgba(255,232,180,0)');
        ctx.fillStyle=g; ctx.beginPath(); ctx.arc(hp[0],hp[1],13,0,6.2832); ctx.fill();
      }
    }
  }

  /* --- aircraft --- */
  for(const pl of AGENTS.planes){
    const s=((pl.s+pl.v*t)%(pl.path.len*1.35));
    if(s>pl.path.len) continue;
    const pos=atPath(pl.path,s), ahead=atPath(pl.path,Math.min(pl.path.len,s+0.6));
    let hx=ahead[0]-pos[0], hy=ahead[1]-pos[1];
    const m=Math.hypot(hx,hy)||1; hx/=m; hy/=m;
    airliner(pos,hx,hy,pl.sz||0.95,pl.col,0.82,t,pl.s);
    // altitude leader + ground mark
    qline([pos[0],pos[1],pos[2]],[pos[0],pos[1],0.1],{lw:0.5,alpha:0.22});
    qline([pos[0]-0.6,pos[1],0.1],[pos[0]+0.6,pos[1],0.1],{lw:0.5,alpha:0.3});
    qline([pos[0],pos[1]-0.6,0.1],[pos[0],pos[1]+0.6,0.1],{lw:0.5,alpha:0.3});
    ctx.save(); ctx.setLineDash([5,7]); ctx.globalAlpha=0.28;
    ctx.strokeStyle=INK; ctx.lineWidth=0.6; ctx.beginPath();
    const ca=pr(pos[0]-hx*9,pos[1]-hy*9,pos[2]), cb=pr(pos[0]-hx*2.6,pos[1]-hy*2.6,pos[2]);
    ctx.moveTo(ca[0],ca[1]); ctx.lineTo(cb[0],cb[1]); ctx.stroke(); ctx.restore();
    continue;
  }

  /* --- runway movements --- */
  for(const mv of (AGENTS.moves||[])){
    const st=movementState(mv,t);
    if(st.vis<=0.02) continue;
    airliner(st.pos,st.hx,st.hy,mv.sz,mv.col,0.85*st.vis,t,mv.t0,{gear:st.onGround});
    if(st.z>0.5){                                   // the shadow it casts on the field
      const g=pr(st.pos[0],st.pos[1],gz(st.pos[0],st.pos[1])+0.06);
      ctx.globalAlpha=0.16*st.vis; ctx.fillStyle=INK;
      ctx.beginPath(); ctx.ellipse(g[0],g[1],7,7*Math.max(0.2,SE),0,0,6.2832); ctx.fill();
      ctx.globalAlpha=1;
    }
  }
  for(const tx of (AGENTS.taxi||[])){
    const L=tx.path.len, m=(((tx.s+tx.v*t)%(2*L))+2*L)%(2*L);
    const u=m<L?m:2*L-m, d=m<L?1:-1;
    const pos=atPath(tx.path,u), ah=atPath(tx.path,u+0.8*d);
    let hx2=ah[0]-pos[0], hy2=ah[1]-pos[1];
    const mm=Math.hypot(hx2,hy2)||1;
    airliner(pos,hx2/mm,hy2/mm,tx.sz,tx.col,0.75,t,tx.s,{gear:true});
  }
  for(const gp of (AGENTS.parked||[])){
    airliner(gp.pos,gp.hx,gp.hy,gp.sz,gp.col,0.7,t,gp.ph,{gear:true});
  }
  if(false){
    const nx=-hy, ny=hx, SZ=0.95;
    const F=(f,l,v)=>[pos[0]+hx*f*SZ+nx*l*SZ, pos[1]+hy*f*SZ+ny*l*SZ, pos[2]+(v||0)*SZ];
    // fuselage
    qpoly([F(2.3,0),F(1.7,0.20),F(-1.5,0.20),F(-2.3,0.07),
           F(-2.3,-0.07),F(-1.5,-0.20),F(1.7,-0.20)],
      {lw:0.85,alpha:0.82,fill:pl.col,fa:0.34});
    // swept wings
    for(const sg of [1,-1]){
      qpoly([F(0.75,sg*0.18),F(-0.55,sg*2.05),F(-1.05,sg*2.05),F(-0.35,sg*0.18)],
        {lw:0.75,alpha:0.72,fill:pl.col,fa:0.24});
      // engine nacelle
      qpoly([F(0.15,sg*0.85),F(0.15,sg*1.15),F(-0.45,sg*1.15),F(-0.45,sg*0.85)],
        {lw:0.6,alpha:0.6});
    }
    // tailplane
    for(const sg of [1,-1])
      qpoly([F(-1.65,sg*0.14),F(-2.15,sg*0.85),F(-2.35,sg*0.85),F(-2.05,sg*0.14)],
        {lw:0.65,alpha:0.65,fill:pl.col,fa:0.2});
    // vertical fin
    qpoly([F(-1.45,0,0),F(-2.3,0,0),F(-2.35,0,0.62),F(-1.85,0,0.66)],
      {lw:0.75,alpha:0.75,fill:pl.col,fa:0.22});
    // nav strobe
    const st=(Math.sin(t*6.0+pl.s)+1)/2;
    const wt=pr(...F(-0.55,2.05));
    ctx.globalAlpha=0.2+st*0.7; ctx.fillStyle=CFG.pal.c[0];
    ctx.beginPath(); ctx.arc(wt[0],wt[1],1.6,0,6.2832); ctx.fill(); ctx.globalAlpha=1;
    // altitude leader + ground mark
    qline([pos[0],pos[1],pos[2]],[pos[0],pos[1],0.1],{lw:0.5,alpha:0.22});
    qline([pos[0]-0.6,pos[1],0.1],[pos[0]+0.6,pos[1],0.1],{lw:0.5,alpha:0.3});
    qline([pos[0],pos[1]-0.6,0.1],[pos[0],pos[1]+0.6,0.1],{lw:0.5,alpha:0.3});
    // dashed contrail
    ctx.save(); ctx.setLineDash([5,7]); ctx.globalAlpha=0.28;
    ctx.strokeStyle=INK; ctx.lineWidth=0.6; ctx.beginPath();
    const a=pr(pos[0]-hx*9,pos[1]-hy*9,pos[2]), b=pr(pos[0]-hx*2.6,pos[1]-hy*2.6,pos[2]);
    ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke(); ctx.restore();
  }

  /* --- metro (subsurface: lighter ink reads as "below datum") --- */
  for(const mt of AGENTS.metro){
    const L=mt.path.len;
    // run to the next station, stand while passengers board, then go on
    let ph=(((t+mt.t0)%mt.T)+mt.T)%mt.T, tail=0, dir=1;
    for(const l of mt.legs){
      if(ph>l.dur){ ph-=l.dur; continue; }
      if(l.k==='run'){ const q=ph/l.dur; tail=l.from+(l.to-l.from)*q; }
      else tail=l.at;
      dir=l.dir||1;
      break;
    }
    for(let k=0;k<mt.n;k++){
      const u=tail + k*mt.gap;
      if(u<-0.1||u>L+0.1) continue;               // that car is out beyond the sheet
      const pos=atPath(mt.path,u);
      const ahead=atPath(mt.path,Math.max(0,Math.min(L,u+0.4*dir)));
      let hx=ahead[0]-pos[0], hy=ahead[1]-pos[1];
      const mm=Math.hypot(hx,hy)||1; hx/=mm; hy/=mm;
      vehicle(pos,hx,hy,2.1,0.62,0.74,NIGHT?'#ffd79a':CFG.pal.c[1],0.8);
    }
  }

  /* --- river craft --- */
  for(const bg of (AGENTS.barges||[])){
    const L=bg.path.len, m=(((bg.s+bg.v*t)%(2*L))+2*L)%(2*L);
