    // Interpolation targets for smooth camera interaction

    // =========================================================================
    // SHADER SOURCE CODE
    // =========================================================================
    const vertexShader = `
      varying vec2 vUv;
      void main() {
        vUv = position.xy * 0.5 + 0.5;
        gl_Position = vec4(position.xy, 0.0, 1.0);
      }
    `;

    const fragmentShader = `
      precision highp float;

      uniform vec2  uResolution;
      uniform float uTime;
      uniform float uAnimAngle;
      uniform float uAnimElevation;
      uniform float uPulseScale;
      uniform float uColorPhase;
      uniform float uSway;

      // Camera Navigation
      uniform float uZoom;
      uniform vec2  uPan;
      uniform float uRotX;
      uniform float uRotY;
      uniform float uRotZ;

      // Geometric & Wave Parameters
      uniform float uTwist;
      uniform float uWaveScale;
      uniform float uWaveFreq;
      uniform float uColumnHeight;
      uniform float uStepDivisor;
      uniform float uFilamentScale;
      uniform float uFilamentOffset;
      uniform int   uMaxSteps;
      uniform float uGlowDamp;

      // Color Scheme Uniforms
      uniform int   uSchemeType;
      uniform vec3  uColor1;
      uniform vec3  uColor2;
      uniform vec3  uColor3;
      uniform vec3  uColor4;
      uniform vec3  uColor5;
      uniform vec3  uBgColor;
      uniform float uGreenScreen;
      uniform float uGlowIntensity;
      uniform float uSaturation;
      uniform float uColorShift;
      uniform float uAccentMix;

      // Lighting Uniforms
      uniform float uExposure;
      uniform float uSceneLightIntensity;
      uniform vec3  uKeyLightDir;
      uniform vec3  uKeyLightColor;
      uniform float uKeyLightIntensity;
      uniform vec3  uFillLightDir;
      uniform vec3  uFillLightColor;
      uniform float uFillLightIntensity;
      uniform vec3  uRimLightColor;
      uniform float uRimLightIntensity;
      uniform vec3  uCoreLightColor;
      uniform float uCoreLightIntensity;

      // 2D Rotation Helper
      mat2 rotate2D(float a) {
        float c = cos(a);
        float s = sin(a);
        return mat2(c, -s, s, c);
      }

      // Safe Hyperbolic Tangent Function for High Dynamic Range Soft Tonemapping
      vec3 safeTanh(vec3 x) {
        x = clamp(x, 0.0, 15.0);
        vec3 e2x = exp(2.0 * x);
        return (e2x - vec3(1.0)) / (e2x + vec3(1.0));
      }

      // Smooth multi-band palette interpolation
      vec3 getPaletteColor(float t) {
        t = fract(t);
        if (t < 0.25) {
          return mix(uColor1, uColor2, t / 0.25);
        } else if (t < 0.5) {
          return mix(uColor2, uColor3, (t - 0.25) / 0.25);
        } else if (t < 0.75) {
          return mix(uColor3, uColor4, (t - 0.5) / 0.25);
        } else {
          return mix(uColor4, uColor5, (t - 0.75) / 0.25);
        }
      }

      void main() {
        // Screen aspect coordinates
        vec2 fc = gl_FragCoord.xy;
        vec2 res = uResolution;
        vec2 uv = (2.0 * fc - res) / min(res.x, res.y);

        // Zoom and Pan interaction
        uv = (uv - uPan) / max(uZoom, 0.01);

        // Ray direction in camera space
        vec3 rayDir = normalize(vec3(uv, -1.0));

        // Interactive & animated 3D rotation
        float totalRotX = uRotX + uAnimAngle;
        float totalRotY = uRotY + uAnimElevation;
        float totalRotZ = uRotZ + uSway;

        rayDir.yz = rotate2D(totalRotY) * rayDir.yz;
        rayDir.xz = rotate2D(totalRotX) * rayDir.xz;
        rayDir.xy = rotate2D(totalRotZ) * rayDir.xy;

        // Camera origin orbiting around the volumetric column
        vec3 camPos = vec3(0.0, 0.0, 9.0);
        camPos.yz = rotate2D(totalRotY) * camPos.yz;
        camPos.xz = rotate2D(totalRotX) * camPos.xz;
        camPos.xy = rotate2D(totalRotZ) * camPos.xy;

        // Lighting directions
        vec3 keyDir = normalize(uKeyLightDir);
        vec3 fillDir = normalize(uFillLightDir);

        float z = 0.0;
        float d = 0.0;
        float a = 0.0;
        float T = uTime;

        vec3 accumColor = vec3(0.0);

        // Volumetric Raymarch Loop (90 iterations default)
        for (int i = 0; i < 120; i++) {
          if (i >= uMaxSteps) break;

          vec3 p = camPos + z * rayDir;
          vec3 t = p;

          // Spiral coordinate & conical twist
          a = (p.y - length(p.xz)) / uTwist;

          vec4 m = cos(a + vec4(0.0, 5.0, 8.0, 0.0));
          mat2 rotMat = mat2(m.x, m.y, m.z, m.w);
          p.xz *= rotMat;

          d = 2.0;

          // 7-Octave Domain Warping Wave Hierarchy
          for (int j = 0; j < 7; j++) {
            d /= uWaveScale;
            p += sin(p.yzx * d - vec3(T, 0.0, 0.0) * uWaveFreq) / d;
          }

          // Capped Cylinder Distance & Periodic Breathing Modulation
          float radialDist = length(p.xz);
          float heightBound = uColumnHeight - abs(p.y);
          float breathing = 2.0 + cos(a - T + uPulseScale);
          d = min(radialDist, heightBound) / uStepDivisor / max(breathing, 0.2);

          z += max(d, 0.003);

          // Filament caustic proximity denominator
          vec2 causticTerm = (p.xz / uFilamentScale + vec2(uFilamentOffset)) * sin(T - a);
          float denom = length(t.xz + causticTerm);
          denom = max(denom, 0.002);

          // Directional Lighting Estimation
          vec3 pNorm = normalize(p + vec3(0.0001));
          float keyDot = max(dot(pNorm, keyDir), 0.0);
          float fillDot = max(dot(pNorm, fillDir), 0.0);
          float rimDot = pow(clamp(1.0 - abs(dot(rayDir, pNorm)), 0.0, 1.0), 2.2);

          vec3 lightFactor = (uKeyLightColor * (keyDot * uKeyLightIntensity)) +
                             (uFillLightColor * (fillDot * uFillLightIntensity)) +
                             (uRimLightColor * (rimDot * uRimLightIntensity)) +
                             (uCoreLightColor * uCoreLightIntensity);

          // Base Color Synthesis based on active scheme
          vec3 baseColor;
          if (uSchemeType == 0) {
            // Original tweet harmonic color ratios: (7.0, 5.0, z)
            vec3 origCol = vec3(7.0, 5.0, z);
            if (uColorShift > 0.001) {
              vec3 shifted = getPaletteColor(z * 0.08 + uColorShift) * (7.0 + z * 0.5);
              origCol = mix(origCol, shifted, uColorShift);
            }
            baseColor = origCol;
          } else if (uSchemeType == 1) {
            // Harmonic Palette Gradient mapping
            float coord = fract(z * 0.07 + a * 0.04 + uColorPhase + uColorShift);
            vec3 pal = getPaletteColor(coord);
            baseColor = pal * (6.0 + z * 0.45);
          } else {
            // Achromatic / Neutral + Accent Shading
            float coord = fract(z * 0.06 + a * 0.03 + uColorPhase);
            vec3 pal = getPaletteColor(coord);
            if (uAccentMix > 0.0) {
              float causticAccent = smoothstep(0.4, 0.95, 1.0 / (denom * 16.0 + 1.0));
              pal = mix(pal, uColor3, causticAccent * uAccentMix);
            }
            baseColor = pal * (6.0 + z * 0.45);
          }

          // Saturation control
          float luma = dot(baseColor, vec3(0.299, 0.587, 0.114));
          baseColor = mix(vec3(luma), baseColor, uSaturation);

          // Step glow accumulation
          vec3 stepGlow = (baseColor * (d / denom)) * (lightFactor * uSceneLightIntensity * 0.28) * uGlowIntensity;
          accumColor += stepGlow;
        }

        // Hyperbolic Tangent Tonemapping & Dynamic Range Compression
        vec3 finalColor = (accumColor * accumColor) / max(uGlowDamp, 1.0);
        finalColor *= uExposure;
        finalColor = safeTanh(finalColor);

        // Volumetric alpha mask estimation for background blending
        float alpha = clamp(length(finalColor) * 1.6, 0.0, 1.0);

        // Greenscreen vs Custom Background Compositing
        if (uGreenScreen > 0.5) {
          vec3 green = vec3(0.0, 1.0, 0.0);
          vec3 composite = mix(green, finalColor, smoothstep(0.03, 0.22, alpha));
          gl_FragColor = vec4(composite, 1.0);
        } else {
          vec3 composite = mix(uBgColor, finalColor, smoothstep(0.01, 0.16, alpha));
          gl_FragColor = vec4(composite, 1.0);
        }
      }
    `;

    // =========================================================================

    function initThree(antialias) {
      if (renderer) {
        renderer.dispose();
        if (renderer.domElement && renderer.domElement.parentElement) {
          renderer.domElement.parentElement.removeChild(renderer.domElement);
        }
      }

      renderer = new THREE.WebGLRenderer({
        antialias: antialias,
        powerPreference: 'high-performance'
      });
      renderer.setPixelRatio(settings.dpr);
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      scene = new THREE.Scene();
      camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

      material = new THREE.ShaderMaterial({
        vertexShader,
        fragmentShader,
        uniforms,
        depthWrite: false,
        depthTest: false
      });

      const geometry = new THREE.PlaneGeometry(2, 2);
      mesh = new THREE.Mesh(geometry, material);
      scene.add(mesh);

      onWindowResize();
      setupPointerEvents(renderer.domElement);
    }

    function onWindowResize() {
      if (!renderer) return;
      const w = window.innerWidth;
      const h = window.innerHeight;
      renderer.setSize(w, h);
      renderer.setPixelRatio(settings.dpr);
      uniforms.uResolution.value.set(w * settings.dpr, h * settings.dpr);
    }

    window.addEventListener('resize', onWindowResize);

    // =========================================================================
    // SMOOTH INTERACTIVE CONTROLS (WHEEL ZOOM, DRAG ACROSS SCREEN, ROTATE)
    // =========================================================================
    let isPointerDown = false;
    let pointerStartX = 0;
    let pointerStartY = 0;
    let lastPointerX = 0;
    let lastPointerY = 0;
    let pointerDownTime = 0;
    let hasMoved = false;

    function setupPointerEvents(canvasElement) {
      canvasElement.addEventListener('pointerdown', (e) => {
        if (e.target.closest('.lil-gui')) return;
        isPointerDown = true;
        hasMoved = false;
        pointerStartX = e.clientX;
        pointerStartY = e.clientY;
        lastPointerX = e.clientX;
        lastPointerY = e.clientY;
        pointerDownTime = performance.now();
        document.body.classList.add('grabbing');
      });

      window.addEventListener('pointermove', (e) => {
        if (!isPointerDown) return;
        const dx = e.clientX - lastPointerX;
        const dy = e.clientY - lastPointerY;
        lastPointerX = e.clientX;
        lastPointerY = e.clientY;

        const totalDist = Math.hypot(e.clientX - pointerStartX, e.clientY - pointerStartY);
        if (totalDist > 5) {
          hasMoved = true;
        }

        const isPan = (e.buttons === 2) || e.shiftKey || (settings.dragAction === 'Drag Across Screen (Pan)');

        if (isPan) {
          // Drag object across screen
          const panSens = 2.0 / Math.min(window.innerWidth, window.innerHeight);
          targetNav.panX += dx * panSens;
          targetNav.panY -= dy * panSens;
          settings.panX = targetNav.panX;
          settings.panY = targetNav.panY;
          if (controllers.panX) controllers.panX.updateDisplay();
          if (controllers.panY) controllers.panY.updateDisplay();
        } else {
          // 3D camera rotation
          targetNav.rotX += dx * 0.007;
          targetNav.rotY += dy * 0.007;
          settings.rotX = targetNav.rotX;
          settings.rotY = targetNav.rotY;
          if (controllers.rotX) controllers.rotX.updateDisplay();
          if (controllers.rotY) controllers.rotY.updateDisplay();
        }
      });

      window.addEventListener('pointerup', (e) => {
        if (!isPointerDown) return;
        isPointerDown = false;
        document.body.classList.remove('grabbing');

        const duration = performance.now() - pointerDownTime;
        const totalDist = Math.hypot(e.clientX - pointerStartX, e.clientY - pointerStartY);

        // Clean user click on scene (not dragged) -> Trigger procedural variation
        if (!hasMoved && totalDist < 6 && duration < 350) {
          if (!e.target.closest('.lil-gui') && settings.clickToRandomize) {
            randomizeScene();
          }
        }
      });

      // Smooth Wheel Zoom
      canvasElement.addEventListener('wheel', (e) => {
        e.preventDefault();
        const factor = e.deltaY < 0 ? 1.08 : 0.92;
        targetNav.zoom = Math.max(0.15, Math.min(8.0, targetNav.zoom * factor));
        settings.zoom = targetNav.zoom;
        if (controllers.zoom) controllers.zoom.updateDisplay();
      }, { passive: false });

      // Prevent context menu on right click to allow smooth right-button panning
      canvasElement.addEventListener('contextmenu', (e) => {
        e.preventDefault();
      });
    }

    // =========================================================================
    // COLOR SCHEME APPLICATOR
    // =========================================================================
    function applyColorScheme(name) {
      const scheme = COLOR_SCHEMES[name];
      if (!scheme) return;
      settings.colorScheme = name;
      settings.color1 = scheme.c1;
      settings.color2 = scheme.c2;
      settings.color3 = scheme.c3;
      settings.color4 = scheme.c4;
      settings.color5 = scheme.c5;
      settings.bgColor = scheme.bg;
      settings.glowIntensity = scheme.glow;
      settings.saturation = scheme.saturation;
      settings.accentMix = scheme.accentMix;

      syncUniformsFromSettings();

      if (gui) {
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      }
    }

    // =========================================================================
    // PROCEDURAL RANDOMIZER (TRIGGERED ON SCENE CLICK)
    // =========================================================================
    function randomizeScene() {
      // 1. Pick a random color scheme from the 19+ preconfigured schemes
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const chosenScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      applyColorScheme(chosenScheme);

      // Subtle phase/hue variety
      if (Math.random() > 0.4) {
        settings.colorShift = +(Math.random() * 0.9).toFixed(2);
      } else {
        settings.colorShift = 0.0;
      }

      // 2. Re-roll geometric & wave parameters within visually compelling bounds
      settings.twist = +(1.4 + Math.random() * 1.5).toFixed(2);
      settings.waveScale = +(0.85 + Math.random() * 0.12).toFixed(3);
      settings.waveFreq = +(4.5 + Math.random() * 3.5).toFixed(1);
      settings.columnHeight = +(6.5 + Math.random() * 4.0).toFixed(1);
      settings.stepDivisor = +(12.0 + Math.random() * 6.0).toFixed(1);
      settings.filamentScale = +(1.5 + Math.random() * 1.5).toFixed(2);

      // 3. Re-roll smooth animation mode and speed
      const chosenAnim = ANIMATION_MODES[Math.floor(Math.random() * ANIMATION_MODES.length)];
      settings.animation = chosenAnim;
      settings.animationSpeed = +(0.65 + Math.random() * 0.85).toFixed(2);

      // 4. Re-roll lighting parameters
      settings.exposure = +(0.85 + Math.random() * 0.4).toFixed(2);
      settings.sceneLightIntensity = +(0.85 + Math.random() * 0.4).toFixed(2);
      settings.keyLightIntensity = +(0.8 + Math.random() * 0.8).toFixed(2);
      settings.fillLightIntensity = +(0.5 + Math.random() * 0.6).toFixed(2);
      settings.rimLightIntensity = +(1.1 + Math.random() * 0.9).toFixed(2);
      settings.coreLightIntensity = +(0.7 + Math.random() * 0.6).toFixed(2);

      syncUniformsFromSettings();

      if (gui) {
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      }
    }

    function resetNavigation() {
      targetNav.zoom = 1.0;
      targetNav.panX = 0.0;
      targetNav.panY = 0.0;
      targetNav.rotX = 0.0;
      targetNav.rotY = 0.0;
      targetNav.rotZ = 0.0;

      settings.zoom = 1.0;
      settings.panX = 0.0;
      settings.panY = 0.0;
      settings.rotX = 0.0;
      settings.rotY = 0.0;
      settings.rotZ = 0.0;

      syncUniformsFromSettings();

      if (gui) {
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      }
    }

    // =========================================================================
    // LIL-GUI SETUP (CLEAN, UNTOUCHED NATIVE STYLING)
    // =========================================================================
    const gui = new GUI({ title: 'Vortex Spire Studio' });
    const controllers = {};

    // Folder 1: Scene & Presets
    const fPresets = gui.addFolder('Scene & Presets');
    controllers.colorScheme = fPresets.add(settings, 'colorScheme', Object.keys(COLOR_SCHEMES))
      .name('Color Scheme')
      .onChange(applyColorScheme);

    controllers.greenScreen = fPresets.add(settings, 'greenScreen')
      .name('Greenscreen (#00ff00)')
      .onChange(syncUniformsFromSettings);

    controllers.animation = fPresets.add(settings, 'animation', ANIMATION_MODES)
      .name('Animation');

    controllers.animationSpeed = fPresets.add(settings, 'animationSpeed', 0.0, 3.0, 0.05)
      .name('Anim Speed');

    controllers.clickToRandomize = fPresets.add(settings, 'clickToRandomize')
      .name('Click to Randomize');

    fPresets.add({ randomize: randomizeScene }, 'randomize')
      .name('Randomize Now');

    // Folder 2: Navigation & Camera
    const fNav = gui.addFolder('Navigation & Camera');
    controllers.zoom = fNav.add(settings, 'zoom', 0.15, 8.0, 0.01)
      .name('Zoom')
      .onChange(v => { targetNav.zoom = v; syncUniformsFromSettings(); });

    controllers.panX = fNav.add(settings, 'panX', -3.0, 3.0, 0.01)
      .name('Pan X')
      .onChange(v => { targetNav.panX = v; syncUniformsFromSettings(); });

    controllers.panY = fNav.add(settings, 'panY', -3.0, 3.0, 0.01)
      .name('Pan Y')
      .onChange(v => { targetNav.panY = v; syncUniformsFromSettings(); });

    controllers.rotX = fNav.add(settings, 'rotX', -Math.PI * 2, Math.PI * 2, 0.01)
      .name('Rotate X')
      .onChange(v => { targetNav.rotX = v; syncUniformsFromSettings(); });

    controllers.rotY = fNav.add(settings, 'rotY', -Math.PI * 2, Math.PI * 2, 0.01)
      .name('Rotate Y')
      .onChange(v => { targetNav.rotY = v; syncUniformsFromSettings(); });

    controllers.dragAction = fNav.add(settings, 'dragAction', ['Drag Across Screen (Pan)', 'Rotate (3D)'])
      .name('Left Drag Mode');

    fNav.add({ reset: resetNavigation }, 'reset')
      .name('Reset Camera');

    // Folder 3: Lighting & Exposure
    const fLight = gui.addFolder('Lighting & Exposure');
    controllers.exposure = fLight.add(settings, 'exposure', 0.1, 3.0, 0.05)
      .name('Exposure')
      .onChange(syncUniformsFromSettings);

    controllers.sceneLightIntensity = fLight.add(settings, 'sceneLightIntensity', 0.0, 3.0, 0.05)
      .name('Scene Light Mult')
      .onChange(syncUniformsFromSettings);

    const fKey = fLight.addFolder('Key Light');
    fKey.add(settings, 'keyLightIntensity', 0.0, 3.0, 0.05).name('Intensity').onChange(syncUniformsFromSettings);
    fKey.addColor(settings, 'keyLightColor').name('Color').onChange(syncUniformsFromSettings);
    fKey.add(settings, 'keyLightDirX', -3.0, 3.0, 0.1).name('Dir X').onChange(syncUniformsFromSettings);
    fKey.add(settings, 'keyLightDirY', -3.0, 3.0, 0.1).name('Dir Y').onChange(syncUniformsFromSettings);
    fKey.add(settings, 'keyLightDirZ', -3.0, 3.0, 0.1).name('Dir Z').onChange(syncUniformsFromSettings);

    const fFill = fLight.addFolder('Fill Light');
    fFill.add(settings, 'fillLightIntensity', 0.0, 3.0, 0.05).name('Intensity').onChange(syncUniformsFromSettings);
    fFill.addColor(settings, 'fillLightColor').name('Color').onChange(syncUniformsFromSettings);
    fFill.add(settings, 'fillLightDirX', -3.0, 3.0, 0.1).name('Dir X').onChange(syncUniformsFromSettings);
    fFill.add(settings, 'fillLightDirY', -3.0, 3.0, 0.1).name('Dir Y').onChange(syncUniformsFromSettings);
    fFill.add(settings, 'fillLightDirZ', -3.0, 3.0, 0.1).name('Dir Z').onChange(syncUniformsFromSettings);

    const fRim = fLight.addFolder('Rim Light');
    fRim.add(settings, 'rimLightIntensity', 0.0, 3.0, 0.05).name('Intensity').onChange(syncUniformsFromSettings);
    fRim.addColor(settings, 'rimLightColor').name('Color').onChange(syncUniformsFromSettings);

    const fCore = fLight.addFolder('Core Glow');
    fCore.add(settings, 'coreLightIntensity', 0.0, 3.0, 0.05).name('Intensity').onChange(syncUniformsFromSettings);
    fCore.addColor(settings, 'coreLightColor').name('Color').onChange(syncUniformsFromSettings);

    // Folder 4: Colors & Palette
    const fColors = gui.addFolder('Colors & Palette');
    fColors.addColor(settings, 'color1').name('Color 1').onChange(syncUniformsFromSettings);
    fColors.addColor(settings, 'color2').name('Color 2').onChange(syncUniformsFromSettings);
    fColors.addColor(settings, 'color3').name('Color 3').onChange(syncUniformsFromSettings);
    fColors.addColor(settings, 'color4').name('Color 4').onChange(syncUniformsFromSettings);
    fColors.addColor(settings, 'color5').name('Color 5').onChange(syncUniformsFromSettings);
    fColors.addColor(settings, 'bgColor').name('Background Color').onChange(syncUniformsFromSettings);
    fColors.add(settings, 'glowIntensity', 0.1, 3.0, 0.05).name('Glow Density').onChange(syncUniformsFromSettings);
    fColors.add(settings, 'saturation', 0.0, 1.0, 0.01).name('Saturation').onChange(syncUniformsFromSettings);
    fColors.add(settings, 'colorShift', 0.0, 1.0, 0.01).name('Hue / Phase Shift').onChange(syncUniformsFromSettings);
    fColors.add(settings, 'accentMix', 0.0, 1.0, 0.02).name('Accent Mix').onChange(syncUniformsFromSettings);

    // Folder 5: Geometric & Fractal Dynamics
    const fGeo = gui.addFolder('Vortex Geometry');
    fGeo.add(settings, 'twist', 0.8, 4.0, 0.05).name('Spiral Twist').onChange(syncUniformsFromSettings);
    fGeo.add(settings, 'waveScale', 0.75, 1.1, 0.01).name('Wave Octave Scale').onChange(syncUniformsFromSettings);
    fGeo.add(settings, 'waveFreq', 2.0, 12.0, 0.2).name('Wave Frequency').onChange(syncUniformsFromSettings);
    fGeo.add(settings, 'columnHeight', 3.0, 14.0, 0.2).name('Column Height').onChange(syncUniformsFromSettings);
    fGeo.add(settings, 'stepDivisor', 8.0, 25.0, 0.5).name('Step Divisor').onChange(syncUniformsFromSettings);
    fGeo.add(settings, 'filamentScale', 0.8, 5.0, 0.1).name('Filament Scale').onChange(syncUniformsFromSettings);
    fGeo.add(settings, 'maxSteps', 40, 120, 1).name('Raymarch Steps').onChange(syncUniformsFromSettings);

    // Folder 6: Quality & Performance
    const fQuality = gui.addFolder('Quality & Performance');
    fQuality.add(settings, 'antialias')
      .name('Three.js Antialias')
      .onChange(v => {
        initThree(v);
        syncUniformsFromSettings();
      });

    fQuality.add(settings, 'dpr', 0.5, 2.5, 0.1)
      .name('Pixel Ratio (DPR)')
      .onChange(onWindowResize);

    // Keyboard shortcut "H" to toggle GUI visibility
    let isGuiVisible = true;
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        isGuiVisible = !isGuiVisible;
        gui.show(isGuiVisible);
      }
    });

    // =========================================================================
    // INFINITE ANIMATION LOOP
    // =========================================================================
    const clock = new THREE.Clock();
    let animTime = 0.0;

    function animate() {
      requestAnimationFrame(animate);

      const delta = Math.min(clock.getDelta(), 0.06);
      animTime += delta * settings.animationSpeed;

      // Smooth interpolation for interactive navigation
      settings.zoom += (targetNav.zoom - settings.zoom) * 0.12;
      settings.panX += (targetNav.panX - settings.panX) * 0.12;
      settings.panY += (targetNav.panY - settings.panY) * 0.12;
      settings.rotX += (targetNav.rotX - settings.rotX) * 0.12;
      settings.rotY += (targetNav.rotY - settings.rotY) * 0.12;
      settings.rotZ += (targetNav.rotZ - settings.rotZ) * 0.12;

      uniforms.uZoom.value = settings.zoom;
      uniforms.uPan.value.set(settings.panX, settings.panY);
      uniforms.uRotX.value = settings.rotX;
      uniforms.uRotY.value = settings.rotY;
      uniforms.uRotZ.value = settings.rotZ;

      uniforms.uTime.value = animTime;

      // Evaluate selected smooth animation preset
      let animAngle = 0.0;
      let animElevation = 0.0;
      let pulseScale = 0.0;
      let colorPhase = 0.0;
      let sway = 0.0;

      switch (settings.animation) {
        case 'Static (No Movement)':
          animAngle = 0.0;
          animElevation = 0.0;
          pulseScale = 0.0;
          sway = 0.0;
          colorPhase = 0.0;
          break;

        case 'Cosmic Turntable':
          animAngle = animTime * 0.16;
          animElevation = Math.sin(animTime * 0.08) * 0.06;
          break;

        case 'Ascending Helix':
          animAngle = animTime * 0.12;
          animElevation = Math.sin(animTime * 0.14) * 0.18;
          sway = Math.cos(animTime * 0.1) * 0.05;
          break;

        case 'Breathing Caustics':
          animAngle = animTime * 0.05;
          pulseScale = Math.sin(animTime * 0.32) * 0.065;
          break;

        case 'Slow Orbital Drift':
          animAngle = animTime * 0.18;
          animElevation = Math.sin(animTime * 0.12) * 0.16;
          sway = Math.cos(animTime * 0.14) * 0.08;
          break;

        case 'Harmonic Pendulum':
          animAngle = Math.sin(animTime * 0.14) * 0.28;
          animElevation = Math.cos(animTime * 0.11) * 0.07;
          sway = Math.sin(animTime * 0.13) * 0.1;
          break;

        case 'Hypnotic Torus Twist':
          animAngle = animTime * 0.13;
          animElevation = Math.sin(animTime * 0.16) * 0.11;
          pulseScale = Math.sin(animTime * 0.22) * 0.035;
          sway = Math.cos(animTime * 0.09) * 0.06;
          break;

        case 'Ethereal Caustic Waves':
          animAngle = 0.0;
          animElevation = 0.0;
          colorPhase = animTime * 0.12;
          pulseScale = Math.sin(animTime * 0.35) * 0.02;
          break;
      }

      uniforms.uAnimAngle.value = animAngle;
      uniforms.uAnimElevation.value = animElevation;
      uniforms.uPulseScale.value = pulseScale;
      uniforms.uColorPhase.value = colorPhase;
      uniforms.uSway.value = sway;

      renderer.render(scene, camera);
    }

    // =========================================================================
    // STARTUP
    // =========================================================================
    initThree(settings.antialias);
    syncUniformsFromSettings();
    animate();
  </script>
</body>
</html>
