<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSG Intersected Bars Visualizer</title>
  <style>
    body {
      overflow: hidden;
      margin: 0;
      background-color: #ffffff;
      user-select: none;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.182.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.182.0/examples/jsm/",
        "three-mesh-bvh": "https://unpkg.com/three-mesh-bvh@0.9.2/build/index.module.js",
        "three-bvh-csg": "https://unpkg.com/three-bvh-csg@0.0.17/build/index.module.js",
        "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
      }
    }
  </script>
</head>
<body>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { mergeGeometries } from "three/addons/utils/BufferGeometryUtils.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { INTERSECTION, Brush, Evaluator } from "three-bvh-csg";
import GUI from "lil-gui";

console.clear();

// 5 Curated & Distinct Color Schemes
const COLOR_SCHEMES = {
  "Studio Minimalist": {
    bg: "#ffffff",
    meshColor: "#555555",
    meshWireColor: "#000000",
    meshWireOpacity: 0.9,
    boxWireColor: "#000000",
    boxWireOpacity: 0.2,
    metalness: 0.9,
    roughness: 0.4
  },
  "Cyber Cyan": {
    bg: "#070b12",
    meshColor: "#00e5ff",
    meshWireColor: "#ffffff",
    meshWireOpacity: 0.95,
    boxWireColor: "#0077aa",
    boxWireOpacity: 0.28,
    metalness: 0.95,
    roughness: 0.2
  },
  "Obsidian Gold": {
    bg: "#0d0d0f",
    meshColor: "#e5b842",
    meshWireColor: "#fff2b2",
    meshWireOpacity: 0.9,
    boxWireColor: "#6b521b",
    boxWireOpacity: 0.32,
    metalness: 1.0,
    roughness: 0.25
  },
  "Crimson Core": {
    bg: "#0c0406",
    meshColor: "#ff2a5f",
    meshWireColor: "#ffa3be",
    meshWireOpacity: 0.92,
    boxWireColor: "#661226",
    boxWireOpacity: 0.3,
    metalness: 0.85,
    roughness: 0.3
  },
  "Emerald Matrix": {
    bg: "#040f0a",
    meshColor: "#00f59b",
    meshWireColor: "#a8ffe0",
    meshWireOpacity: 0.95,
    boxWireColor: "#0e4d34",
    boxWireOpacity: 0.3,
    metalness: 0.9,
    roughness: 0.22
  }
};

const params = {
  colorScheme: "Studio Minimalist",
  greenscreen: false,
  bgColor: "#ffffff",
  meshColor: "#555555",
  meshWireColor: "#000000",
  meshWireOpacity: 0.9,
  boxWireColor: "#000000",
  boxWireOpacity: 0.2,
  metalness: 0.9,
  roughness: 0.4,
  showSolid: true,
  showSolidWire: true,
  showBrushWires: true,

  // Geometry
  barCount: 15,
  barLength: 10.0,
  barWidth: 0.5,
  barHeight: 1.0,
  spread: 5.0,

  // Motion & Animation
  animationMode: "Gentle Orbit",
  animSpeed: 1.0,
  rotSpeedMult: 1.0,

  // Render & System
  dpr: Math.min(window.devicePixelRatio || 1, 2),
  clickToRandomize: true
};

class IntersectedBars extends THREE.Group {
  constructor(amount = params.barCount, length = params.barLength, width = params.barWidth, height = params.barHeight, spread = params.spread) {
    super();
    this.amount = amount;
    this.barLength = length;
    this.barWidth = width;
    this.barHeight = height;
    this.spread = spread;

    this.brushes = Array.from({ length: amount }, () => {
      const brushG = new THREE.BoxGeometry(this.barLength, this.barWidth, this.barHeight).toNonIndexed();
      const brush = new Brush(brushG);
      brush.position.random().subScalar(0.5).multiplyScalar(this.spread);
      brush.rotation.set(
        Math.random() * Math.PI * 2,
        Math.random() * Math.PI * 2,
        Math.random() * Math.PI * 2
      );
      brush.userData = {
        rotInit: new THREE.Vector3()
          .random()
          .subScalar(0.5)
          .multiplyScalar(Math.PI * 2),
        rotSpeed: new THREE.Vector3()
          .random()
          .subScalar(0.5)
          .multiplyScalar(Math.PI)
          .setZ(0)
      };

      const wireMat = new THREE.LineBasicMaterial({
        color: params.boxWireColor,
        transparent: true,
        opacity: params.boxWireOpacity,
        visible: params.showBrushWires
      });
      const view = new THREE.LineSegments(
        new THREE.EdgesGeometry(brushG),
        wireMat
      );
      brush.view = view;
      this.add(view);

      return brush;
    });

    this.evaluator = new Evaluator();
    this.evaluator.useGroups = false;
    this.intersections = [];

    this.resultMat = new THREE.MeshStandardMaterial({
      color: params.meshColor,
      roughness: params.roughness,
      metalness: params.metalness,
      visible: params.showSolid
    });

    this.result = new THREE.Mesh(
      new THREE.BufferGeometry(),
      this.resultMat
    );

    this.wireMat = new THREE.LineBasicMaterial({
      color: params.meshWireColor,
      transparent: true,
      opacity: params.meshWireOpacity,
      visible: params.showSolidWire
    });

    this.resultWire = new THREE.LineSegments(
      new THREE.BufferGeometry(),
      this.wireMat
    );

    this.add(this.result, this.resultWire);
  }

  update(t) {
    const speedMult = params.rotSpeedMult;
    this.brushes.forEach((brush) => {
      const ud = brush.userData;
      brush.rotation.set(
        ud.rotInit.x + ud.rotSpeed.x * t * speedMult,
        ud.rotInit.y + ud.rotSpeed.y * t * speedMult,
        ud.rotInit.z + ud.rotSpeed.z * t * speedMult
      );
      brush.updateMatrixWorld();
      if (brush.view) {
        brush.view.position.copy(brush.position);
        brush.view.rotation.copy(brush.rotation);
      }
    });

    this.intersections = [];

    for (let i = 0; i < this.amount; i++) {
      for (let j = i + 1; j < this.amount; j++) {
        const brushA = this.brushes[i];
        const brushB = this.brushes[j];
        const result = this.evaluator.evaluate(brushA, brushB, INTERSECTION);
        if (result && result.geometry && result.geometry.attributes.position && result.geometry.attributes.position.count > 0) {
          this.intersections.push(result.geometry);
        }
      }
    }

    if (this.intersections.length > 0) {
      const gMain = mergeGeometries(this.intersections);
      if (gMain && gMain.attributes.position && gMain.attributes.position.count > 0) {
        const gMainWire = new THREE.EdgesGeometry(gMain);
        if (this.result.geometry) this.result.geometry.dispose();
        this.result.geometry = gMain;
        if (this.resultWire.geometry) this.resultWire.geometry.dispose();
        this.resultWire.geometry = gMainWire;
      } else {
        if (this.result.geometry) this.result.geometry.dispose();
        this.result.geometry = new THREE.BufferGeometry();
        if (this.resultWire.geometry) this.resultWire.geometry.dispose();
        this.resultWire.geometry = new THREE.BufferGeometry();
      }
    } else {
      if (this.result.geometry) this.result.geometry.dispose();
      this.result.geometry = new THREE.BufferGeometry();
      if (this.resultWire.geometry) this.resultWire.geometry.dispose();
      this.resultWire.geometry = new THREE.BufferGeometry();
    }
  }

  dispose() {
    this.brushes.forEach((brush) => {
      if (brush.geometry) brush.geometry.dispose();
      if (brush.view) {
        if (brush.view.geometry) brush.view.geometry.dispose();
        if (brush.view.material) brush.view.material.dispose();
        this.remove(brush.view);
      }
    });
    if (this.result.geometry) this.result.geometry.dispose();
    if (this.resultMat) this.resultMat.dispose();
    if (this.resultWire.geometry) this.resultWire.geometry.dispose();
    if (this.wireMat) this.wireMat.dispose();
  }

  updateMaterials() {
    this.resultMat.color.set(params.meshColor);
    this.resultMat.roughness = params.roughness;
    this.resultMat.metalness = params.metalness;
    this.resultMat.visible = params.showSolid;

    this.wireMat.color.set(params.meshWireColor);
    this.wireMat.opacity = params.meshWireOpacity;
    this.wireMat.visible = params.showSolidWire;

    this.brushes.forEach((brush) => {
      if (brush.view && brush.view.material) {
        brush.view.material.color.set(params.boxWireColor);
        brush.view.material.opacity = params.boxWireOpacity;
        brush.view.material.visible = params.showBrushWires;
      }
    });
  }
}

// Scene setup
const scene = new THREE.Scene();
scene.background = new THREE.Color(params.bgColor);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
camera.position.set(0, 0, 1).setLength(15);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(params.dpr);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.enableZoom = true;
controls.enablePan = true;
controls.screenSpacePanning = true;

const pmremGenerator = new THREE.PMREMGenerator(renderer);
scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

// Lighting to complement RoomEnvironment
const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
dirLight.position.set(5, 10, 7);
scene.add(dirLight);

const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);

let intersectedBars = new IntersectedBars();
scene.add(intersectedBars);

// Background update logic
function updateBackground() {
  if (params.greenscreen) {
    scene.background = new THREE.Color("#00ff00");
  } else {
    scene.background = new THREE.Color(params.bgColor);
  }
}

// Rebuild scene geometry
function rebuildScene() {
  scene.remove(intersectedBars);
  intersectedBars.dispose();
  intersectedBars = new IntersectedBars(
    params.barCount,
    params.barLength,
    params.barWidth,
    params.barHeight,
    params.spread
  );
  scene.add(intersectedBars);
}

// Apply predefined color scheme
function applyColorScheme(name) {
  const scheme = COLOR_SCHEMES[name];
  if (!scheme) return;
  params.bgColor = scheme.bg;
  params.meshColor = scheme.meshColor;
  params.meshWireColor = scheme.meshWireColor;
  params.meshWireOpacity = scheme.meshWireOpacity;
  params.boxWireColor = scheme.boxWireColor;
  params.boxWireOpacity = scheme.boxWireOpacity;
  params.metalness = scheme.metalness;
  params.roughness = scheme.roughness;

  intersectedBars.updateMaterials();
  updateBackground();
}

// Procedural random palette generator
function getRandomAestheticPalette() {
  const hue = Math.random();
  const hueAlt = (hue + 0.3 + Math.random() * 0.4) % 1.0;
  const isDark = Math.random() > 0.25;

  const bg = new THREE.Color().setHSL(Math.random(), 0.2, isDark ? 0.04 : 0.96);
  const mesh = new THREE.Color().setHSL(hue, 0.9, isDark ? 0.6 : 0.25);
  const meshWire = isDark
    ? (Math.random() > 0.5 ? new THREE.Color("#ffffff") : new THREE.Color().setHSL(hueAlt, 0.8, 0.85))
    : (Math.random() > 0.5 ? new THREE.Color("#000000") : new THREE.Color().setHSL(hueAlt, 0.9, 0.2));
  const boxWire = new THREE.Color().setHSL(hue, 0.7, isDark ? 0.35 : 0.15);

  return {
    bg: "#" + bg.getHexString(),
    meshColor: "#" + mesh.getHexString(),
    meshWireColor: "#" + meshWire.getHexString(),
    boxWireColor: "#" + boxWire.getHexString(),
    meshWireOpacity: parseFloat((0.7 + Math.random() * 0.3).toFixed(2)),
    boxWireOpacity: parseFloat((0.15 + Math.random() * 0.25).toFixed(2)),
    metalness: parseFloat((0.5 + Math.random() * 0.5).toFixed(2)),
    roughness: parseFloat((0.1 + Math.random() * 0.5).toFixed(2))
  };
}

// Re-roll scene randomly
function randomizeScene() {
  const pal = getRandomAestheticPalette();
  params.colorScheme = "Custom";
  params.greenscreen = false;
  params.bgColor = pal.bg;
  params.meshColor = pal.meshColor;
  params.meshWireColor = pal.meshWireColor;
  params.meshWireOpacity = pal.meshWireOpacity;
  params.boxWireColor = pal.boxWireColor;
  params.boxWireOpacity = pal.boxWireOpacity;
  params.metalness = pal.metalness;
  params.roughness = pal.roughness;

  params.barCount = Math.floor(8 + Math.random() * 10);
  params.barLength = parseFloat((6.0 + Math.random() * 8.0).toFixed(1));
  params.barWidth = parseFloat((0.25 + Math.random() * 0.65).toFixed(2));
  params.barHeight = parseFloat((0.5 + Math.random() * 1.5).toFixed(2));
  params.spread = parseFloat((3.5 + Math.random() * 4.0).toFixed(1));
  params.rotSpeedMult = parseFloat((0.5 + Math.random() * 1.5).toFixed(2));

  updateBackground();
  rebuildScene();
  updateGuiDisplay();
}

// lil-gui setup
const gui = new GUI({ title: "Intersected Bars Settings" });

// 1. Theme & Colors Folder
const fTheme = gui.addFolder("Theme & Colors");
const schemeController = fTheme.add(params, "colorScheme", [
  "Studio Minimalist",
  "Cyber Cyan",
  "Obsidian Gold",
  "Crimson Core",
  "Emerald Matrix",
  "Custom"
]).name("Preset Scheme").onChange((val) => {
  if (val !== "Custom") {
    applyColorScheme(val);
    updateGuiDisplay();
  }
});

fTheme.add(params, "greenscreen").name("Greenscreen (#00ff00)").onChange(() => {
  updateBackground();
});

fTheme.addColor(params, "bgColor").name("Background").onChange((val) => {
  if (!params.greenscreen) scene.background.set(val);
  params.colorScheme = "Custom";
  schemeController.setValue("Custom");
});

fTheme.addColor(params, "meshColor").name("Solid Mesh Color").onChange(() => {
  intersectedBars.updateMaterials();
  params.colorScheme = "Custom";
  schemeController.setValue("Custom");
});

fTheme.addColor(params, "meshWireColor").name("Solid Wire Color").onChange(() => {
  intersectedBars.updateMaterials();
  params.colorScheme = "Custom";
  schemeController.setValue("Custom");
});

fTheme.add(params, "meshWireOpacity", 0.0, 1.0, 0.05).name("Solid Wire Opacity").onChange(() => {
  intersectedBars.updateMaterials();
});

fTheme.addColor(params, "boxWireColor").name("Box Outline Color").onChange(() => {
  intersectedBars.updateMaterials();
  params.colorScheme = "Custom";
  schemeController.setValue("Custom");
});

fTheme.add(params, "boxWireOpacity", 0.0, 1.0, 0.05).name("Box Outline Opacity").onChange(() => {
  intersectedBars.updateMaterials();
});

fTheme.add(params, "metalness", 0.0, 1.0, 0.01).name("Metalness").onChange(() => {
  intersectedBars.updateMaterials();
});

fTheme.add(params, "roughness", 0.0, 1.0, 0.01).name("Roughness").onChange(() => {
  intersectedBars.updateMaterials();
});

fTheme.add(params, "showSolid").name("Show Solid Mesh").onChange(() => {
  intersectedBars.updateMaterials();
});

fTheme.add(params, "showSolidWire").name("Show Solid Edges").onChange(() => {
  intersectedBars.updateMaterials();
});

fTheme.add(params, "showBrushWires").name("Show Box Outlines").onChange(() => {
  intersectedBars.updateMaterials();
});

// 2. Motion & Camera Folder
const fAnim = gui.addFolder("Motion & Camera");
fAnim.add(params, "animationMode", [
  "Gentle Orbit",
  "Breathing Float",
  "Figure-8 Infinity",
  "Zenith Spiral",
  "Static (Manual Orbit)"
]).name("Camera Mode");

fAnim.add(params, "animSpeed", 0.0, 3.0, 0.05).name("Animation Speed");
fAnim.add(params, "rotSpeedMult", 0.0, 3.0, 0.05).name("Bars Rotation Speed");

// 3. Geometry Folder
const fGeom = gui.addFolder("Geometry & CSG");
fGeom.add(params, "barCount", 3, 22, 1).name("Bars Count").onFinishChange(rebuildScene);
fGeom.add(params, "barLength", 3.0, 20.0, 0.5).name("Bar Length").onFinishChange(rebuildScene);
fGeom.add(params, "barWidth", 0.1, 2.5, 0.05).name("Bar Width").onFinishChange(rebuildScene);
fGeom.add(params, "barHeight", 0.2, 3.0, 0.05).name("Bar Height").onFinishChange(rebuildScene);
fGeom.add(params, "spread", 1.0, 10.0, 0.2).name("Spread Distance").onFinishChange(rebuildScene);

// 4. System & Render Folder
const fSys = gui.addFolder("System & Click Mode");
fSys.add(params, "dpr", 0.5, 3.0, 0.1).name("Pixel Ratio (DPR)").onChange((v) => {
  renderer.setPixelRatio(v);
});
fSys.add(params, "clickToRandomize").name("Click Scene to Re-roll");
fSys.add({ randomize: randomizeScene }, "randomize").name("Randomize Now");

function updateGuiDisplay() {
  gui.controllersRecursive().forEach((c) => c.updateDisplay());
}

// Hide / Show UI with 'H' key
window.addEventListener("keydown", (e) => {
  if (e.key === "h" || e.key === "H") {
    if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "SELECT")) return;
    if (gui._hidden) {
      gui.show();
    } else {
      gui.hide();
    }
  }
});

// Scene click detection for re-roll (filtering out drag / orbit)
let pointerDownPos = { x: 0, y: 0 };
let pointerDownTime = 0;

window.addEventListener("pointerdown", (e) => {
  pointerDownPos = { x: e.clientX, y: e.clientY };
  pointerDownTime = performance.now();
});

window.addEventListener("pointerup", (e) => {
  if (!params.clickToRandomize) return;
  // Ignore clicks on GUI
  if (e.target.closest && e.target.closest(".lil-gui")) return;

  const dx = e.clientX - pointerDownPos.x;
  const dy = e.clientY - pointerDownPos.y;
  const dt = performance.now() - pointerDownTime;
  const dist = Math.hypot(dx, dy);

  // If minimal movement and fast release, trigger procedural re-roll
  if (dist < 6 && dt < 350) {
    randomizeScene();
  }
});

// Resize listener
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Animation Loop
const clock = new THREE.Clock();
let t = 0;
const defaultDistance = 15;

renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  t += dt * params.animSpeed;

  // Handle Preset Camera Animations
  if (params.animationMode === "Gentle Orbit") {
    const camDist = defaultDistance;
    const angle = t * 0.12;
    camera.position.x = Math.sin(angle) * camDist;
    camera.position.z = Math.cos(angle) * camDist;
    camera.position.y = Math.sin(angle * 0.7) * 4.0;
  } else if (params.animationMode === "Breathing Float") {
    const breathe = defaultDistance + Math.sin(t * 0.3) * 3.5;
    const angle = t * 0.08;
    camera.position.x = Math.sin(angle) * breathe;
    camera.position.z = Math.cos(angle) * breathe;
    camera.position.y = 3.0 + Math.sin(t * 0.2) * 3.0;
  } else if (params.animationMode === "Figure-8 Infinity") {
    const scale = defaultDistance;
    const angle = t * 0.15;
    camera.position.x = Math.sin(angle) * scale;
    camera.position.y = Math.sin(angle * 2.0) * (scale * 0.35);
    camera.position.z = Math.cos(angle) * scale;
  } else if (params.animationMode === "Zenith Spiral") {
    const radius = 11.0 + Math.sin(t * 0.15) * 3.0;
    const angle = t * 0.1;
    camera.position.x = Math.cos(angle) * radius;
    camera.position.z = Math.sin(angle) * radius;
    camera.position.y = 7.0 + Math.sin(t * 0.2) * 4.0;
  }
  // If "Static (Manual Orbit)", camera position is driven solely by user OrbitControls

  controls.update();
  intersectedBars.update(t);
  renderer.render(scene, camera);
});

// Initialize background
updateBackground();
</script>
</body>
</html>
