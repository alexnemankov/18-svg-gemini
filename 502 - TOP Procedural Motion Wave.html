<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>502 - Procedural Motion Wave</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
      font-family: serif;
      overflow: hidden;
      position: relative;
      background: #000000;
      user-select: none;
      -webkit-user-select: none;
    }

    canvas {
      display: block;
      height: 100%;
      width: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      background: #000000;
      cursor: grab;
      touch-action: none;
    }

    canvas:active {
      cursor: grabbing;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script type="module">
    import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

    class Utils {
      static norm(value, min, max) {
        return (value - min) / (max - min);
      }

      static lerp(norm, min, max) {
        return (max - min) * norm + min;
      }

      static map(value, sourceMin, sourceMax, destMin, destMax) {
        return this.lerp(this.norm(value, sourceMin, sourceMax), destMin, destMax);
      }

      static clamp(value, min, max) {
        return Math.min(Math.max(value, min), max);
      }

      static distance(x0, y0, x1, y1) {
        const dx = x1 - x0;
        const dy = y1 - y0;
        return Math.sqrt(dx * dx + dy * dy);
      }

      static randomRange(min, max) {
        return min + Math.random() * (max - min);
      }

      static randomInt(min, max) {
        return Math.floor(min + Math.random() * (max - min + 1));
      }

      static randomDist(min, max, iterations) {
        let total = 0;
        for (let i = 0; i < iterations; i++) {
          total += this.randomRange(min, max);
        }
        return total / iterations;
      }

      static degreesToRads(degrees) {
        return (degrees / 180) * Math.PI;
      }

      static radsToDegrees(radians) {
        return (radians * 180) / Math.PI;
      }

      static roundToPlaces(value, places) {
        const mult = Math.pow(10, places);
        return Math.round(value * mult) / mult;
      }

      static roundNearest(value, nearest) {
        return Math.round(value / nearest) * nearest;
      }
    }

    const COLOR_SCHEMES = {
      'Original': {
        colors: ['#FF0000', '#00FF00', '#0000FF'],
        bg: '#000000',
        blend: 'lighter'
      },
      'Monochromatic': {
        colors: ['#00e5ff', '#0099cc', '#005580'],
        bg: '#000a12',
        blend: 'lighter'
      },
      'Analogous': {
        colors: ['#ff0055', '#ff5500', '#ffbb00'],
        bg: '#0f0404',
        blend: 'lighter'
      },
      'Complementary': {
        colors: ['#00f0ff', '#ff3366', '#00ffa3'],
        bg: '#050510',
        blend: 'lighter'
      },
      'Split-complementary': {
        colors: ['#ff0055', '#00e5ff', '#00ff66'],
        bg: '#050810',
        blend: 'lighter'
      },
      'Triadic': {
        colors: ['#ff0066', '#00f0ff', '#ffcc00'],
        bg: '#08020e',
        blend: 'lighter'
      },
      'Tetradic': {
        colors: ['#ff0055', '#ffaa00', '#00ffaa', '#7700ff'],
        bg: '#050510',
        blend: 'lighter'
      },
      'Double split-complementary': {
        colors: ['#ff0066', '#ff8800', '#00ddff', '#00ff88'],
        bg: '#040810',
        blend: 'lighter'
      },
      'Achromatic (Black & White)': {
        colors: ['#ffffff', '#cccccc', '#777777'],
        bg: '#000000',
        blend: 'lighter'
      },
      'Achromatic (White & Black)': {
        colors: ['#000000', '#333333', '#666666'],
        bg: '#ffffff',
        blend: 'source-over'
      },
      'Achromatic + Accent (B&W + Red)': {
        colors: ['#ffffff', '#888888', '#ff0033'],
        bg: '#000000',
        blend: 'lighter'
      },
      'Achromatic + Accent (W&B + Red)': {
        colors: ['#111111', '#555555', '#e50914'],
        bg: '#ffffff',
        blend: 'source-over'
      },
      'Neutral + Accent': {
        colors: ['#e0d6cc', '#9e9286', '#ff5400', '#423b38'],
        bg: '#161311',
        blend: 'lighter'
      },
      'Palette 1 (F6AA1C, BC3908, 941B0C, F6AA1C, 220901)': {
        colors: ['#F6AA1C', '#BC3908', '#941B0C', '#F6AA1C', '#220901'],
        bg: '#0a0301',
        blend: 'lighter'
      },
      'Palette 2 (63D1CF, 5BC0BE, 4BAD9E, 4BAD9E, 0B132B, 000000)': {
        colors: ['#63D1CF', '#5BC0BE', '#4BAD9E', '#4BAD9E', '#0B132B', '#000000'],
        bg: '#030712',
        blend: 'lighter'
      },
      'Palette 3 (AA60C8, D69ADE, C9A3C6, CFB5C2, 0D001D, 120A12)': {
        colors: ['#AA60C8', '#D69ADE', '#C9A3C6', '#CFB5C2', '#0D001D', '#120A12'],
        bg: '#070010',
        blend: 'lighter'
      },
      'Palette 4 (FEF1BE, FFBA00, 008189, 00474D, 061210)': {
        colors: ['#FEF1BE', '#FFBA00', '#008189', '#00474D', '#061210'],
        bg: '#030908',
        blend: 'lighter'
      },
      'Palette 5 (D4FFB0, 7FFF00, 00B894, 0A3322, 05140A)': {
        colors: ['#D4FFB0', '#7FFF00', '#00B894', '#0A3322', '#05140A'],
        bg: '#020a05',
        blend: 'lighter'
      },
      'Palette 6 (FFE8CC, FF8C00, C7501A, 3D1050, 0E0618)': {
        colors: ['#FFE8CC', '#FF8C00', '#C7501A', '#3D1050', '#0E0618'],
        bg: '#07030c',
        blend: 'lighter'
      },
      'Palette 7 (E8E0FF, B38FFF, 6A3DE8, 1A1250, 090612)': {
        colors: ['#E8E0FF', '#B38FFF', '#6A3DE8', '#1A1250', '#090612'],
        bg: '#040309',
        blend: 'lighter'
      },
      'Palette 8 (E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)': {
        colors: ['#E0FBFF', '#00F0FF', '#D40078', '#1E0A3D', '#05020F'],
        bg: '#020108',
        blend: 'lighter'
      }
    };

    let gui, canvas, c, width, height, id;
    let shapes = [];
    let size = 30;
    let num = 20;
    let maxDist = 0;
    let activeColors = [...COLOR_SCHEMES['Original'].colors];
    let isGuiVisible = true;

    const params = {
      // Color & Theme
      colorScheme: 'Original',
      color1: '#FF0000',
      color2: '#00FF00',
      color3: '#0000FF',
      color4: '#FFFF00',
      bgColor: '#000000',
      greenscreen: false,
      blendMode: 'lighter',

      // Geometry
      number: 20,
      size: 30,
      shapeType: 'circle',
      layout: 'grid',

      // Motion
      timeScale: 0.0005,
      amplitude: 100,
      layerDelay: 0.01,
      rotation: false,
      rotationSpeed: 1,

      // Transform & View
      zoom: 1,
      panX: 0,
      panY: 0,
      resetView: () => resetTransform(),
      toggleFullscreen: () => toggleFullscreen(),

      // Procedural Randomizer
      clickToRandomize: true,
      randomize: () => randomizeScene(),
      reset: () => resetDefaults()
    };

    const ctrls = {};

    const ease = (x) => {
      const c5 = (2 * Math.PI) / 4.5;
      return x === 0
        ? 0
        : x === 1
        ? 1
        : x < 0.5
        ? -(Math.pow(2, 20 * x - 10) * Math.sin((20 * x - 11.125) * c5)) / 2
        : (Math.pow(2, -20 * x + 10) * Math.sin((20 * x - 11.125) * c5)) / 2 + 1;
    };

    const applyColorScheme = (name) => {
      const scheme = COLOR_SCHEMES[name];
      if (!scheme) return;
      params.colorScheme = name;
      activeColors = [...scheme.colors];
      params.color1 = activeColors[0] || '#ffffff';
      params.color2 = activeColors[1] || '#ffffff';
      params.color3 = activeColors[2] || '#ffffff';
      params.color4 = activeColors[3] || (activeColors.length > 3 ? activeColors[3] : '#ffffff');
      params.bgColor = scheme.bg;
      params.blendMode = scheme.blend;

      updateBg();
      gui.controllersRecursive().forEach((c) => c.updateDisplay());
    };

    const updateBg = () => {
      const bg = params.greenscreen ? '#00ff00' : params.bgColor;
      canvas.style.backgroundColor = bg;
      document.body.style.backgroundColor = bg;
    };

    const resetTransform = () => {
      params.zoom = 1;
      params.panX = 0;
      params.panY = 0;
      ctrls.zoom?.updateDisplay();
      ctrls.panX?.updateDisplay();
      ctrls.panY?.updateDisplay();
    };

    const resetDefaults = () => {
      params.number = 20;
      params.size = 30;
      params.timeScale = 0.0005;
      params.amplitude = 100;
      params.layerDelay = 0.01;
      params.shapeType = 'circle';
      params.layout = 'grid';
      params.rotation = false;
      params.rotationSpeed = 1;
      params.greenscreen = false;
      resetTransform();
      applyColorScheme('Original');
      initialize();
    };

    const randomizeScene = () => {
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      applyColorScheme(randomScheme);

      params.number = Utils.randomInt(10, 26);
      params.size = Utils.randomInt(18, 60);
      const shapesList = ['circle', 'square', 'polygon', 'triangle', 'ring'];
      params.shapeType = shapesList[Math.floor(Math.random() * shapesList.length)];
      params.layout = Math.random() < 0.25 ? 'spiral' : 'grid';

      params.timeScale = Utils.randomRange(0.0008, 0.0035);
      params.amplitude = Utils.randomInt(45, 160);
      params.layerDelay = Utils.randomRange(0.006, 0.024);
      params.rotation = Math.random() < 0.45;
      params.rotationSpeed = Utils.randomRange(0.5, 2.5);

      gui.controllersRecursive().forEach((c) => c.updateDisplay());
      initialize();
    };

    const toggleFullscreen = () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    };

    const toggleUI = () => {
      isGuiVisible = !isGuiVisible;
      if (gui) {
        if (typeof gui.show === 'function') {
          gui.show(isGuiVisible);
        }
        if (gui.domElement) {
          gui.domElement.style.display = isGuiVisible ? '' : 'none';
        }
      }
    };

    const setupGui = () => {
      gui = new GUI({ title: 'Scene Controls' });

      const themeFolder = gui.addFolder('Theme & Colors');
      ctrls.colorScheme = themeFolder
        .add(params, 'colorScheme', Object.keys(COLOR_SCHEMES))
        .name('Color Scheme')
        .onChange((val) => applyColorScheme(val));

      ctrls.greenscreen = themeFolder
        .add(params, 'greenscreen')
        .name('Green Screen (#00ff00)')
        .onChange(() => updateBg());

      ctrls.bgColor = themeFolder
        .addColor(params, 'bgColor')
        .name('Background Color')
        .onChange(() => updateBg());

      ctrls.color1 = themeFolder
        .addColor(params, 'color1')
        .name('Color 1')
        .onChange((val) => {
          activeColors[0] = val;
        });

      ctrls.color2 = themeFolder
        .addColor(params, 'color2')
        .name('Color 2')
        .onChange((val) => {
          activeColors[1] = val;
        });

      ctrls.color3 = themeFolder
        .addColor(params, 'color3')
        .name('Color 3')
        .onChange((val) => {
          activeColors[2] = val;
        });

      ctrls.color4 = themeFolder
        .addColor(params, 'color4')
        .name('Color 4')
        .onChange((val) => {
          activeColors[3] = val;
        });

      ctrls.blendMode = themeFolder
        .add(params, 'blendMode', ['lighter', 'source-over', 'screen', 'difference', 'multiply'])
        .name('Blend Mode');

      const geomFolder = gui.addFolder('Geometry');
      ctrls.number = geomFolder
        .add(params, 'number', 2, 40, 1)
        .name('Count')
        .onChange(() => initialize());

      ctrls.size = geomFolder
        .add(params, 'size', 2, 250, 1)
        .name('Size')
        .onChange(() => initialize());

      ctrls.shapeType = geomFolder
        .add(params, 'shapeType', ['circle', 'square', 'polygon', 'triangle', 'ring'])
        .name('Shape');

      ctrls.layout = geomFolder
        .add(params, 'layout', ['grid', 'spiral'])
        .name('Layout')
        .onChange(() => initialize());

      const motionFolder = gui.addFolder('Motion & Waves');
      ctrls.timeScale = motionFolder
        .add(params, 'timeScale', 0.0001, 0.008, 0.0001)
        .name('Time Scale');

      ctrls.amplitude = motionFolder
        .add(params, 'amplitude', 0, 300, 1)
        .name('Wave Amplitude');

      ctrls.layerDelay = motionFolder
        .add(params, 'layerDelay', 0.001, 0.05, 0.001)
        .name('Layer Delay');

      ctrls.rotation = motionFolder
        .add(params, 'rotation')
        .name('Enable Rotation');

      ctrls.rotationSpeed = motionFolder
        .add(params, 'rotationSpeed', 0.1, 5, 0.1)
        .name('Rotation Speed');

      const viewFolder = gui.addFolder('View & Transform');
      ctrls.zoom = viewFolder
        .add(params, 'zoom', 0.05, 10, 0.01)
        .name('Zoom');

      ctrls.panX = viewFolder
        .add(params, 'panX', -1500, 1500, 1)
        .name('Pan X');

      ctrls.panY = viewFolder
        .add(params, 'panY', -1500, 1500, 1)
        .name('Pan Y');

      viewFolder.add(params, 'resetView').name('Reset Pan & Zoom');
      viewFolder.add(params, 'toggleFullscreen').name('Toggle Fullscreen');

      const procFolder = gui.addFolder('Procedural Mode');
      ctrls.clickToRandomize = procFolder
        .add(params, 'clickToRandomize')
        .name('Click Scene to Randomize');

      procFolder.add(params, 'randomize').name('Randomize Now');
      procFolder.add(params, 'reset').name('Reset Defaults');
    };

    const setupCanvas = () => {
      canvas = document.getElementById('canvas');
      c = canvas.getContext('2d');
      updateBg();
    };

    const initialize = () => {
      if (id) {
        cancelAnimationFrame(id);
      }

      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;

      shapes = [];
      size = params.size;
      num = params.number;
      maxDist = 0;

      if (params.layout === 'spiral') {
        const rings = Math.min(num, 18);
        for (let i = 1; i <= rings; i++) {
          const count = i * 6;
          for (let j = 0; j < count; j++) {
            const angle = ((Math.PI * 2) / count) * j;
            const dist = size * 0.9 * i;
            const x = Math.cos(angle) * dist;
            const y = Math.sin(angle) * dist;
            maxDist = Math.max(dist, maxDist);
            shapes.push({ x, y, d: dist });
          }
        }
      } else {
        const adjust = (num * size) / 2 - size / 2;
        for (let y = 0; y < num; y++) {
          for (let x = 0; x < num; x++) {
            const ny = size * y - adjust;
            const nx = size * x - adjust;
            const dist = Math.sqrt(nx * nx + ny * ny);
            maxDist = Math.max(dist, maxDist);
            shapes.push({ x: nx, y: ny, d: dist });
          }
        }
      }

      if (maxDist === 0) maxDist = 1;

      draw(performance.now());
    };

    const drawShape = (x, y, radius, type, fill) => {
      c.fillStyle = fill;
      c.beginPath();
      if (type === 'circle') {
        c.arc(x, y, radius, 0, Math.PI * 2, false);
        c.fill();
      } else if (type === 'square') {
        c.rect(x - radius, y - radius, radius * 2, radius * 2);
        c.fill();
      } else if (type === 'ring') {
        c.lineWidth = Math.max(1, radius * 0.35);
        c.strokeStyle = fill;
        c.arc(x, y, radius, 0, Math.PI * 2, false);
        c.stroke();
      } else if (type === 'triangle') {
        for (let k = 0; k < 3; k++) {
          const angle = (k / 3) * Math.PI * 2 - Math.PI / 2;
          const px = Math.cos(angle) * radius + x;
          const py = Math.sin(angle) * radius + y;
          if (k === 0) c.moveTo(px, py);
          else c.lineTo(px, py);
        }
        c.closePath();
        c.fill();
      } else if (type === 'polygon') {
        const sides = 6;
        for (let k = 0; k < sides; k++) {
          const angle = (k / sides) * Math.PI * 2;
          const px = Math.cos(angle) * radius + x;
          const py = Math.sin(angle) * radius + y;
          if (k === 0) c.moveTo(px, py);
          else c.lineTo(px, py);
        }
        c.closePath();
        c.fill();
      }
    };

    const draw = (t) => {
      t *= params.timeScale;

      c.save();
      c.clearRect(0, 0, width, height);

      // Transform object across screen with pan and zoom
      c.save();
      c.translate(width / 2 + params.panX, height / 2 + params.panY);
      c.scale(params.zoom, params.zoom);
      c.globalCompositeOperation = params.blendMode;

      const layers = activeColors;
      const numLayers = layers.length;

      for (let j = 0; j < numLayers; j++) {
        const color = layers[j];
        const layerShift = j * params.layerDelay;

        for (let i = 0; i < shapes.length; i++) {
          c.save();

          let scaledT = (t - layerShift - shapes[i].d / maxDist) % 1;
          if (scaledT < 0) scaledT += 1;
          scaledT = ease(scaledT);

          let moveY = 0;
          if (scaledT < 0.5) {
            moveY = Utils.map(scaledT, 0, 0.5, 0, params.amplitude);
          } else {
            moveY = Utils.map(scaledT, 0.5, 1.0, params.amplitude, 0);
          }

          if (params.rotation) {
            c.translate(shapes[i].x, shapes[i].y + moveY);
            c.rotate(scaledT * Math.PI * 2 * params.rotationSpeed);
            drawShape(0, 0, size / 2, params.shapeType, color);
          } else {
            drawShape(shapes[i].x, shapes[i].y + moveY, size / 2, params.shapeType, color);
          }

          c.restore();
        }
      }

      c.restore(); // end of transformed shapes

      // Render background behind all blended layers directly in the canvas buffer
      const currentBg = params.greenscreen ? '#00ff00' : params.bgColor;
      c.save();
      c.globalCompositeOperation = 'destination-over';
      c.fillStyle = currentBg;
      c.fillRect(0, 0, width, height);
      c.restore();

      c.restore();

      id = requestAnimationFrame(draw);
    };

    const setupInteractions = () => {
      let isDragging = false;
      let startX = 0, startY = 0;
      let initPanX = 0, initPanY = 0;
      let hasDragged = false;

      window.addEventListener('pointerdown', (e) => {
        if (e.target.closest && e.target.closest('.lil-gui')) return;
        isDragging = true;
        hasDragged = false;
        startX = e.clientX;
        startY = e.clientY;
        initPanX = params.panX;
        initPanY = params.panY;
      });

      window.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        if (Math.hypot(dx, dy) > 5) {
          hasDragged = true;
        }
        params.panX = initPanX + dx;
        params.panY = initPanY + dy;
        ctrls.panX?.updateDisplay();
        ctrls.panY?.updateDisplay();
      });

      window.addEventListener('pointerup', (e) => {
        if (!isDragging) return;
        isDragging = false;
        if (!hasDragged && params.clickToRandomize) {
          randomizeScene();
        }
      });

      window.addEventListener(
        'wheel',
        (e) => {
          if (e.target.closest && e.target.closest('.lil-gui')) return;
          e.preventDefault();

          const zoomFactor = e.deltaY < 0 ? 1.08 : 0.925;
          const newZoom = Utils.clamp(params.zoom * zoomFactor, 0.05, 20);

          const mx = e.clientX - width / 2;
          const my = e.clientY - height / 2;

          params.panX = mx - (mx - params.panX) * (newZoom / params.zoom);
          params.panY = my - (my - params.panY) * (newZoom / params.zoom);
          params.zoom = newZoom;

          ctrls.zoom?.updateDisplay();
          ctrls.panX?.updateDisplay();
          ctrls.panY?.updateDisplay();
        },
        { passive: false }
      );

      window.addEventListener('keydown', (e) => {
        if (['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement?.tagName)) return;

        if (e.key === 'h' || e.key === 'H') {
          toggleUI();
        } else if (e.key === 'f' || e.key === 'F') {
          toggleFullscreen();
        }
      });

      window.addEventListener('resize', () => {
        initialize();
      });

      document.addEventListener('fullscreenchange', () => {
        initialize();
      });
    };

    window.addEventListener('DOMContentLoaded', () => {
      setupCanvas();
      setupGui();
      setupInteractions();
      initialize();
    });
  </script>
</body>
</html>
