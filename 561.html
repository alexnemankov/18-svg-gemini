<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>T O O N E L V1 - EL MOTOR CREADOR | Rodri Reyes</title>
  
  <style>
    /* CSS Reset & Viewport Lock */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050505;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", monospace;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      overflow: hidden;
      cursor: crosshair;
    }

    canvas {
      display: block;
      width: 100vw !important;
      height: 100vh !important;
    }

    /* Floating UI Panel (Cyber / Brutalist High-Performance DOM) */
    #ui-panel {
      position: fixed;
      top: 14px;
      left: 14px;
      width: 310px;
      max-height: calc(100vh - 28px);
      background: rgba(10, 10, 12, 0.94);
      border-left: 4px solid #FF0044;
      border-radius: 4px;
      padding: 16px 18px;
      font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, "Courier New", monospace;
      color: #FFFFFF;
      font-size: 11px;
      line-height: 1.4;
      z-index: 9999;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8), 0 0 1px rgba(255, 0, 68, 0.5);
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: thin;
      scrollbar-color: #FF0044 rgba(20, 20, 20, 0.8);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    #ui-panel::-webkit-scrollbar {
      width: 4px;
    }
    #ui-panel::-webkit-scrollbar-track {
      background: rgba(20, 20, 20, 0.8);
    }
    #ui-panel::-webkit-scrollbar-thumb {
      background: #FF0044;
      border-radius: 2px;
    }

    .panel-header {
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .panel-title {
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #FFFFFF;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .fps-badge {
      font-size: 9px;
      font-weight: 700;
      color: #00E5FF;
      background: rgba(0, 229, 255, 0.12);
      padding: 2px 6px;
      border-radius: 2px;
      border: 1px solid rgba(0, 229, 255, 0.3);
      letter-spacing: 0.5px;
    }

    .panel-subtitle {
      font-size: 9.5px;
      color: rgba(255, 255, 255, 0.5);
      letter-spacing: 0.5px;
    }

    .row {
      margin-bottom: 9px;
      display: flex;
      flex-direction: column;
    }

    .row-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 3px;
    }

    .row label {
      font-weight: 700;
      color: #00E5FF;
      font-size: 10px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .val-badge {
      font-size: 9.5px;
      color: #FAFAFA;
      opacity: 0.75;
      font-family: inherit;
    }

    input[type=range] {
      width: 100%;
      height: 5px;
      background: #222226;
      border-radius: 3px;
      outline: none;
      accent-color: #FF0044;
      cursor: pointer;
      margin: 4px 0 2px 0;
    }

    select, input[type=text] {
      width: 100%;
      background: #18181c;
      color: #ffffff;
      border: 1px solid #33333d;
      padding: 5px 8px;
      font-family: inherit;
      font-size: 11px;
      border-radius: 3px;
      outline: none;
      transition: border-color 0.15s ease;
    }

    select:focus, input[type=text]:focus {
      border-color: #00E5FF;
    }

    .checkbox-row {
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      margin: 8px 0;
      padding: 6px 8px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 3px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      cursor: pointer;
    }

    .checkbox-row label {
      cursor: pointer;
      margin-bottom: 0;
    }

    .checkbox-row input[type=checkbox] {
      accent-color: #FF0044;
      cursor: pointer;
      width: 14px;
      height: 14px;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 10px;
    }

    button {
      background: #202026;
      color: #FFFFFF;
      border: 1px solid #383842;
      padding: 8px 6px;
      cursor: pointer;
      width: 100%;
      font-family: inherit;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.6px;
      border-radius: 3px;
      text-transform: uppercase;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    button:hover {
      background: #FF0044;
      border-color: #FF0044;
      color: #FFFFFF;
      box-shadow: 0 0 10px rgba(255, 0, 68, 0.5);
    }

    button:active {
      transform: scale(0.98);
    }

    button.btn-primary {
      background: #FF0044;
      border-color: #FF0044;
      grid-column: span 2;
      font-size: 11px;
      padding: 9px;
      box-shadow: 0 0 12px rgba(255, 0, 68, 0.4);
    }

    button.btn-primary:hover {
      background: #ff1f5a;
      box-shadow: 0 0 16px rgba(255, 31, 90, 0.7);
    }

    .glitch-active {
      background: #FF0044 !important;
      border-color: #FF0044 !important;
      font-weight: 900 !important;
      box-shadow: 0 0 12px rgba(255, 0, 68, 0.6);
    }

    .btn-paused {
      background: #ffaa00 !important;
      border-color: #ffaa00 !important;
      color: #000 !important;
    }

    hr {
      border: none;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      margin: 10px 0;
    }

    /* Floating Toast / Notification */
    #hud-toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 8px 14px;
      background: rgba(10, 10, 14, 0.9);
      border: 1px solid #00E5FF;
      border-radius: 3px;
      color: #00E5FF;
      font-family: inherit;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      pointer-events: none;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 10000;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6), 0 0 12px rgba(0, 229, 255, 0.3);
    }

    #hud-toast.active {
      opacity: 1;
      transform: translateY(0);
    }

    /* Mini Hint Bar (Bottom Left) */
    #quick-hints {
      position: fixed;
      bottom: 12px;
      left: 14px;
      font-family: inherit;
      font-size: 9px;
      color: rgba(255, 255, 255, 0.45);
      letter-spacing: 0.5px;
      pointer-events: none;
      z-index: 999;
      text-transform: uppercase;
    }

    /* Floating UI toggle button when panel is closed */
    #btn-open-ui {
      display: none;
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 9998;
      background: rgba(10, 10, 14, 0.85);
      border: 1px solid #FF0044;
      color: #FFF;
      padding: 7px 12px;
      font-family: inherit;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      border-radius: 3px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
    }

    #btn-open-ui:hover {
      background: #FF0044;
    }
  </style>

  <!-- p5.js Library: targeted precision (version 2.3.3 as required, with graceful failover) -->
  <script src="https://cdn.jsdelivr.net/npm/p5@2.3.3/lib/p5.min.js"></script>
  <script>
    if (typeof window.p5 === 'undefined') {
      document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"><\/script>');
    }
  </script>

<body>
  <div id="canvas-container"></div>
  <button id="btn-open-ui" onclick="toggleUI()">⚙️ MOSTRAR INTERFAZ (H)</button>
  <div id="quick-hints">[Click Escena] Randomize · [Arrastrar] Curvar Vuelo · [Espacio] Pausa · [H] Ocultar UI · [R] Invertir · [F] Pantalla Completa</div>
  <div id="hud-toast">CONFIGURACIÓN APLICADA</div>

  <script>
    /**
     * T O O N E L  V1 - EL MOTOR CREADOR (PERFORMANCE ABSOLUTA)  |  by:  _ixtam_ aka Rodri Reyes
     * Vertex Caching | Offscreen Buffering | Batch DOM | "Tunnel" ⛰️ #WCCChallenge
     * Enhanced with Procedural Theme Randomization, Multi-Geometry Suite & Zero-Latency Controls
     */

    // Polyfill to prevent any p5 randomSeed / _lcgSetSeed binding issues across p5 versions
    (function() {
      const m = 4294967296;
      const lcgSetSeed = function(stateProperty, val) {
        this[stateProperty] = (val == null ? Math.random() * m : val) >>> 0;
      };
      if (typeof window !== 'undefined') {
        if (typeof window._lcgSetSeed !== 'function') window._lcgSetSeed = lcgSetSeed;
      }
      if (typeof p5 !== 'undefined') {
        if (p5.prototype && typeof p5.prototype._lcgSetSeed !== 'function') {
          p5.prototype._lcgSetSeed = lcgSetSeed;
        }
        if (p5.Graphics && p5.Graphics.prototype && typeof p5.Graphics.prototype._lcgSetSeed !== 'function') {
          p5.Graphics.prototype._lcgSetSeed = lcgSetSeed;
        }
      }
    })();

    if (typeof p5 !== 'undefined' && p5.disableFriendlyErrors !== undefined) {
      p5.disableFriendlyErrors = true; // Apaga validaciones para maximizar FPS
    }

    // --- CORE GLOBALES ---
    let slices = [];
    let maxZ = 4000;
    let globalRot = 0;
    let fov = 400;

    // --- ESTADOS Y CACHÉ ---
    let dir = 1;
    let glitchMode = false;
    let isPaused = false;
    let randomizeOnClick = true; // Modo de aleatorización al hacer click en la escena
    let currentBg, currentCols;
    let cachedVertices = []; // Geometría pre-calculada
    let textBuffer; // Lienzo oculto para tipografía (Aceleración GPU)
    let noiseOffset = 0;

    // Interaction trackers
    let mousePressStartTime = 0;
    let mousePressStartX = 0;
    let mousePressStartY = 0;

    // Variables linkeadas a la UI (HTML crudo)
    let param = {
      speed: 15,
      rot: 0.005,
      density: 70,
      fov: 400,
      weight: 3,
      complexity: 5,
      deform: 0,
      drawMode: '1',
      shape: 'Polígonos',
      blend: 'BLEND',
      text: 'TÚNEL',
      glitch: 0
    };

    // Paletas expandidas (12 combinaciones cinematográficas y brutales)
    let palettes = {
      "Cyberpunk":    { bg: '#050505', cols: ['#FF0044', '#00E5FF', '#FAFAFA', '#4400FF'] },
      "Bauhaus":      { bg: '#EAEAEA', cols: ['#FF3300', '#000000', '#0000FF', '#FFCC00'] },
      "Ácido":        { bg: '#0A0A0A', cols: ['#39FF14', '#FF00FF', '#FFFFFF', '#00FFFF'] },
      "Brutalismo":   { bg: '#111111', cols: ['#FF2A2A', '#800000', '#FFFFFF', '#4D4D4D'] },
      "Monocromo":    { bg: '#F2F2F2', cols: ['#1A1A1A', '#4A4A4A', '#999999', '#CCCCCC'] },
      "Synthwave":    { bg: '#080114', cols: ['#FF007F', '#00F0FF', '#FFE600', '#7B2CBF'] },
      "Solar Flare":  { bg: '#0A0202', cols: ['#FF3B00', '#FF8800', '#FFD000', '#FFFFFF'] },
      "Toxic Matrix": { bg: '#010A03', cols: ['#00FF66', '#39FF14', '#00CC44', '#D4FF00'] },
      "Vapor Dreams": { bg: '#100B1E', cols: ['#FF74B1', '#635985', '#00E5FF', '#F9F5EB'] },
      "Deep Ocean":   { bg: '#020B1A', cols: ['#00D2FF', '#0078FF', '#50E3C2', '#FFFFFF'] },
      "Crimson Void": { bg: '#080004', cols: ['#FF0055', '#FF4D6D', '#990033', '#FFCCD5'] },
      "Gold Obsidian":{ bg: '#080806', cols: ['#D4AF37', '#F3E5AB', '#FFCC00', '#99804D'] }
    };

    let paletteKeys = Object.keys(palettes);
    let shapeList = ['Polígonos', 'Círculos', 'Cuadrados', 'Estrellas', 'Espiral', 'Cruces', 'Tipografía'];
    let drawModeList = ['1', '2', '3'];
    let blendModeList = ['BLEND', 'DIFFERENCE', 'EXCLUSION', 'SCREEN', 'ADD'];

    function setup() {
      let cnv = createCanvas(windowWidth, windowHeight);
      cnv.parent('canvas-container');
      frameRate(60);
      
      // Inicialización de Búfer para texto
      textBuffer = createGraphics(800, 800);
      textBuffer.textAlign(CENTER, CENTER);
      textBuffer.textFont('monospace');
      
      buildFastUI(); // Construcción instantánea del DOM
      applyPalette('Cyberpunk');
      rebuildGeometryCache();
      updateDensity();

      // Listeners directos del canvas para asegurar interacción touch/click perfecta
      cnv.mousePressed(handleCanvasPress);
      cnv.mouseReleased(handleCanvasRelease);
    }

    function draw() {
      if (!isPaused) {
        globalRot += param.rot * dir;
        noiseOffset += 0.02; // Evolución del ruido Perlin
      }
      
      // Boost de aceleración al mantener pulsado el ratón fuera de la UI
      let uiElem = document.getElementById('ui-panel');
      let isOverUI = uiElem && uiElem.style.display !== 'none' && mouseX < 340 && mouseY < uiElem.offsetHeight + 30;
      let currentSpeed = (mouseIsPressed && !isOverUI) ? param.speed * 3.5 : param.speed;

      blendMode(BLEND);
      background(currentBg);

      // Modo de fusión dinámico robusto
      let modeMap = {
        'BLEND': typeof BLEND !== 'undefined' ? BLEND : 'source-over',
        'DIFFERENCE': typeof DIFFERENCE !== 'undefined' ? DIFFERENCE : 'difference',
        'EXCLUSION': typeof EXCLUSION !== 'undefined' ? EXCLUSION : 'exclusion',
        'SCREEN': typeof SCREEN !== 'undefined' ? SCREEN : 'screen',
        'ADD': typeof ADD !== 'undefined' ? ADD : 'lighter'
      };
      let activeBlend = modeMap[param.blend] || (typeof BLEND !== 'undefined' ? BLEND : 'source-over');
      blendMode(activeBlend);

      // Glitch de cámara estático
      if (glitchMode && random() < (param.glitch / 100)) {
        translate(random(-param.glitch, param.glitch), random(-param.glitch, param.glitch));
      }

      slices.sort((a, b) => b.z - a.z);

      // Vuelo interpolado (Suavizado del punto de fuga)
      let targetMx = map(mouseX, 0, width, -width * 0.8, width * 0.8);
      let targetMy = map(mouseY, 0, height, -height * 0.8, height * 0.8);
      
      let baseSize = max(width, height) * 0.8;

      for (let s of slices) {
        s.update(currentSpeed);
        s.display(width / 2, height / 2, targetMx, targetMy, baseSize);
      }

      // Medidor de FPS
      if (frameCount % 20 === 0) {
        let fpsEl = document.getElementById('val_fps');
        if (fpsEl) fpsEl.innerText = Math.round(frameRate()) + ' FPS';
      }
    }

    // --- CLASE TUNNEL SLICE (ULTRALIGERA) ---
    class TunnelSlice {
      constructor(z) {
        this.z = z;
        this.refresh();
      }

      update(speed) {
        if (isPaused) return;
        this.z -= speed * dir;
        if (dir === 1 && this.z < 0) {
          this.z = maxZ;
          this.refresh();
        } else if (dir === -1 && this.z > maxZ) {
          this.z = 0;
          this.refresh();
        }
      }

      refresh() {
        this.col = random(currentCols);
        this.rotOffset = random(TWO_PI);
        this.noiseSeedOffset = random(1000); // Semilla única para deformación orgánica
      }

      display(cx, cy, mx, my, baseSize) {
        let scaleF = param.fov / (param.fov + this.z);
        
        // Culling hiper agresivo
        if (scaleF < 0.02 || scaleF > 6) return; 

        let drawX = cx + map(this.z, 0, maxZ, 0, mx);
        let drawY = cy + map(this.z, 0, maxZ, 0, my);

        push();
        translate(drawX, drawY);
        scale(scaleF);
        rotate(globalRot + this.rotOffset);

        // Glitch individual a nivel transform
        if (glitchMode && random() < (param.glitch / 200)) {
          scale(random(0.8, 1.2));
          stroke(255, 0, 0); 
        } else {
          stroke(this.col);
          fill(this.col);
        }

        // Modos de trazado (Outline, Fill, Glow)
        let sw = map(this.z, 0, maxZ, param.weight * 2, param.weight * 0.5);
        strokeWeight(sw);
        
        if (param.drawMode === '1') {
          noFill(); // Solo borde
        } else if (param.drawMode === '2') {
          noStroke(); // Solo relleno
        } else if (param.drawMode === '3') { // Glow falso transgresor
          drawingContext.shadowBlur = sw * 2.5;
          drawingContext.shadowColor = this.col.toString();
        }

        // Dibujado usando Caché
        let rad = baseSize / 2;
        
        if (param.shape === 'Tipografía') {
          imageMode(CENTER);
          tint(this.col);
          image(textBuffer, 0, 0, baseSize, baseSize);
          noTint();
        } 
        else if (param.shape === 'Círculos') {
          ellipse(0, 0, baseSize);
        } 
        else if (param.shape === 'Cuadrados') {
          rectMode(CENTER);
          rect(0, 0, baseSize, baseSize);
        } 
        else {
          // Dibuja desde caché de vértices (0 cálculos matemáticos por frame)
          beginShape();
          for (let i = 0; i < cachedVertices.length; i++) {
            let v = cachedVertices[i];
            
            // Deformación Perlin aplicada sobre el vector base
            let n = 0;
            if (param.deform > 0) {
              n = map(noise(v.x + noiseOffset, v.y + this.noiseSeedOffset), 0, 1, -param.deform, param.deform);
            }
            vertex(v.x * rad + n, v.y * rad + n);
          }
          endShape(param.shape === 'Cruces' ? LINES : CLOSE);
        }

        // Reseteo de sombra para evitar contaminación entre slices
        if (param.drawMode === '3') {
          drawingContext.shadowBlur = 0;
        }

        pop();
      }
    }

    // --- SISTEMA DE CACHÉ DE GEOMETRÍA (LA MAGIA DE LOS 60FPS) ---
    function rebuildGeometryCache() {
      cachedVertices = [];
      let n = param.complexity;
      let angle = TWO_PI / n;

      if (param.shape === 'Polígonos') {
        for (let a = 0; a < TWO_PI; a += angle) {
          cachedVertices.push(createVector(cos(a), sin(a)));
        }
      } 
      else if (param.shape === 'Estrellas') {
        let halfAngle = angle / 2.0;
        for (let a = 0; a < TWO_PI; a += angle) {
          cachedVertices.push(createVector(cos(a), sin(a)));
          cachedVertices.push(createVector(cos(a + halfAngle) * 0.4, sin(a + halfAngle) * 0.4));
        }
      } 
      else if (param.shape === 'Espiral') {
        for (let a = 0; a < TWO_PI * param.complexity; a += 0.4) {
          let r = map(a, 0, TWO_PI * param.complexity, 0.05, 1);
          cachedVertices.push(createVector(cos(a) * r, sin(a) * r));
        }
      } 
      else if (param.shape === 'Cruces') {
        let w = 0.28;
        let l = 1.0;
        // Geometría continua para cruz equilibrada
        let pts = [
          [-w, -l], [w, -l], [w, -w], [l, -w],
          [l, w], [w, w], [w, l], [-w, l],
          [-w, w], [-l, w], [-l, -w], [-w, -w]
        ];
        for (let p of pts) {
          cachedVertices.push(createVector(p[0], p[1]));
        }
      }
      else if (param.shape === 'Tipografía') {
        // Dibujar al buffer
        textBuffer.clear();
        textBuffer.push();
        textBuffer.translate(400, 400); // Centro del buffer 800x800
        textBuffer.fill(255);
        textBuffer.noStroke();
        textBuffer.textSize(800 * 0.09);
        
        let textContent = param.text && param.text.trim().length > 0 ? param.text : 'TÚNEL ';
        let txt = textContent.repeat(Math.max(1, Math.min(15, Math.floor(param.complexity / 2)))).split('');
        let aStep = TWO_PI / txt.length;
        
        for (let i = 0; i < txt.length; i++) {
          textBuffer.push();
          textBuffer.rotate(i * aStep);
          textBuffer.translate(0, -290);
          textBuffer.text(txt[i], 0, 0);
          textBuffer.pop();
        }
        textBuffer.pop();
      }
    }

    // --- LÓGICA DE DENSIDAD Y PALETA ---
    function updateDensity() {
      slices = [];
      for (let i = 0; i < param.density; i++) {
        slices.push(new TunnelSlice(map(i, 0, param.density, 0, maxZ)));
      }
    }

    function applyPalette(name) {
      let p = palettes[name] || palettes["Cyberpunk"];
      currentBg = color(p.bg);
      currentCols = p.cols.map(c => color(c));
      for (let s of slices) {
        s.col = random(currentCols);
      }
    }

    // --- PROCEDURAL RANDOMIZER (REQUIREMENT 6) ---
    function randomizeScene() {
      // 1. Nueva paleta aleatoria
      let randomPal = random(paletteKeys);
      param.paleta = randomPal;
      applyPalette(randomPal);

      // 2. Forma geométrica aleatoria
      param.shape = random(shapeList);

      // 3. Modos de trazado y fusión
      param.drawMode = random(drawModeList);
      param.blend = random(blendModeList);

      // 4. Parámetros de movimiento y cámara
      param.speed = Math.round(random(8, 40));
      param.rot = parseFloat((random(-0.035, 0.035)).toFixed(3));
      param.density = Math.round(random(40, 150));
      param.fov = Math.round(random(220, 750));
      param.weight = Math.round(random(2, 12));
      param.complexity = Math.round(random(3, 14));
      
      // Deformación Perlin orgánica: 50% de probabilidad
      param.deform = random() < 0.5 ? 0 : Math.round(random(10, 85));

      // Glitch aleatorio
      glitchMode = random() < 0.35;
      param.glitch = glitchMode ? Math.round(random(15, 65)) : 0;

      // 5. Reconstruir buffers y capas
      rebuildGeometryCache();
      updateDensity();

      // 6. Sincronizar todos los controles del DOM
      syncUIValues();

      // Notificación visual al usuario
      showToast(`VARIACIÓN: ${randomPal} // ${param.shape.toUpperCase()}`);
    }

    // Sincronizar valores en la UI
    function syncUIValues() {
      setElVal('p_pal', param.paleta);
      setElVal('p_shape', param.shape);
      setElVal('p_drawMode', param.drawMode);
      setElVal('p_blend', param.blend);

      setElVal('p_speed', param.speed);
      setElText('val_speed', param.speed);

      setElVal('p_rot', param.rot);
      setElText('val_rot', param.rot);

      setElVal('p_density', param.density);
      setElText('val_density', param.density);

      setElVal('p_fov', param.fov);
      setElText('val_fov', param.fov);

      setElVal('p_weight', param.weight);
      setElText('val_weight', param.weight);

      setElVal('p_complexity', param.complexity);
      setElText('val_complexity', param.complexity);

      setElVal('p_deform', param.deform);
      setElText('val_deform', param.deform);

      setElVal('p_glitch', param.glitch);
      setElText('val_glitch', param.glitch);

      let gBtn = document.getElementById('btn_glitch');
      if (gBtn) {
        gBtn.innerText = glitchMode ? 'GLITCH MASTER: ON' : 'GLITCH MASTER: OFF';
        gBtn.className = glitchMode ? 'glitch-active' : '';
      }
    }

    function setElVal(id, val) {
      let el = document.getElementById(id);
      if (el) el.value = val;
    }

    function setElText(id, txt) {
      let el = document.getElementById(id);
      if (el) el.innerText = txt;
    }

    function showToast(msg) {
      let t = document.getElementById('hud-toast');
      if (!t) return;
      t.innerText = msg;
      t.classList.add('active');
      clearTimeout(window.__toastTimeout);
      window.__toastTimeout = setTimeout(() => {
        t.classList.remove('active');
      }, 1800);
    }

    // --- CONSTRUCCIÓN INSTANTÁNEA DEL PANEL HTML ---
    function buildFastUI() {
      let panel = createDiv().id('ui-panel');

      // Opciones de paletas
      let palOptions = paletteKeys.map(k => `<option value="${k}" ${k === 'Cyberpunk' ? 'selected' : ''}>${k}</option>`).join('');

      let htmlString = `
        <div class="panel-header">
          <div class="panel-title">
            <span>T Ú N E L // MOTOR</span>
            <span class="fps-badge" id="val_fps">60 FPS</span>
          </div>
          <div class="panel-subtitle">_ixtam_ aka Rodri Reyes // WCCChallenge</div>
        </div>

        <button class="btn-primary" id="btn_random">🎲 ALEATORIZAR ESCENA (C)</button>

        <div class="checkbox-row" id="row_rand_click">
          <label for="chk_rand_click">Auto-Random al Clickear</label>
          <input type="checkbox" id="chk_rand_click" checked>
        </div>

        <div class="row">
          <label>Paleta de Color</label>
          <select id="p_pal">${palOptions}</select>
        </div>
        
        <div class="row">
          <label>Forma Maestra</label>
          <select id="p_shape">
            <option value="Polígonos">Polígonos</option>
            <option value="Círculos">Círculos</option>
            <option value="Cuadrados">Cuadrados</option>
            <option value="Estrellas">Estrellas</option>
            <option value="Espiral">Espiral</option>
            <option value="Cruces">Cruces</option>
            <option value="Tipografía">Tipografía</option>
          </select>
          <input type="text" id="p_text" value="TÚNEL " style="margin-top:5px;" placeholder="Texto para modo Tipografía">
        </div>

        <div class="row">
          <label>Modo de Trazado</label>
          <select id="p_drawMode">
            <option value="1">Línea (Outline)</option>
            <option value="2">Relleno Sólido</option>
            <option value="3">Neón / Glow</option>
          </select>
        </div>
        
        <div class="row">
          <label>Modo de Fusión</label>
          <select id="p_blend">
            <option value="BLEND">BLEND</option>
            <option value="DIFFERENCE">DIFFERENCE</option>
            <option value="EXCLUSION">EXCLUSION</option>
            <option value="SCREEN">SCREEN</option>
            <option value="ADD">ADD</option>
          </select>
        </div>

        <hr>

        <div class="row">
          <div class="row-header"><label>Velocidad Warp</label><span class="val-badge" id="val_speed">15</span></div>
          <input type="range" id="p_speed" min="0" max="100" value="15">
        </div>

        <div class="row">
          <div class="row-header"><label>Rotación Z</label><span class="val-badge" id="val_rot">0.005</span></div>
          <input type="range" id="p_rot" min="-0.05" max="0.05" step="0.001" value="0.005">
        </div>

        <div class="row">
          <div class="row-header"><label>Densidad de Capas</label><span class="val-badge" id="val_density">70</span></div>
          <input type="range" id="p_density" min="10" max="250" value="70">
        </div>

        <div class="row">
          <div class="row-header"><label>Curva FOV (Lente)</label><span class="val-badge" id="val_fov">400</span></div>
          <input type="range" id="p_fov" min="100" max="1000" value="400">
        </div>

        <div class="row">
          <div class="row-header"><label>Grosor del Trazo</label><span class="val-badge" id="val_weight">3</span></div>
          <input type="range" id="p_weight" min="1" max="25" value="3">
        </div>

        <div class="row">
          <div class="row-header"><label>Complejidad (Lados)</label><span class="val-badge" id="val_complexity">5</span></div>
          <input type="range" id="p_complexity" min="3" max="30" value="5">
        </div>

        <div class="row">
          <div class="row-header"><label>Deformación Orgánica</label><span class="val-badge" id="val_deform">0</span></div>
          <input type="range" id="p_deform" min="0" max="150" value="0">
        </div>

        <div class="row">
          <div class="row-header"><label>Intensidad Glitch</label><span class="val-badge" id="val_glitch">0</span></div>
          <input type="range" id="p_glitch" min="0" max="100" value="0">
        </div>

        <div class="btn-grid">
          <button id="btn_glitch">GLITCH: OFF</button>
          <button id="btn_dir">INVERTIR (R)</button>
          <button id="btn_pause">PAUSA (Espacio)</button>
          <button id="btn_snap">CAPTURAR (S)</button>
        </div>

        <button id="btn_hide" style="margin-top:6px;">OCULTAR INTERFAZ (H)</button>
      `;

      panel.html(htmlString);

      // Asignar Eventos a Variables (Mapeo ultra-rápido)
      const bindVal = (id, key, valId, isFloat = false) => {
        let el = document.getElementById(id);
        if (!el) return;
        el.addEventListener('input', (e) => {
          param[key] = isFloat ? parseFloat(e.target.value) : parseInt(e.target.value);
          let vEl = document.getElementById(valId);
          if (vEl) vEl.innerText = param[key];
        });
      };

      const bindStr = (id, key, callback = null) => {
        let el = document.getElementById(id);
        if (!el) return;
        el.addEventListener('change', (e) => {
          param[key] = e.target.value;
          if (callback) callback();
        });
      };

      bindStr('p_pal', 'paleta', () => applyPalette(document.getElementById('p_pal').value));
      bindStr('p_shape', 'shape', rebuildGeometryCache);
      
      let pText = document.getElementById('p_text');
      if (pText) {
        pText.addEventListener('input', (e) => {
          param.text = e.target.value;
          if (param.shape === 'Tipografía') rebuildGeometryCache();
        });
      }

      bindStr('p_drawMode', 'drawMode');
      bindStr('p_blend', 'blend');

      bindVal('p_speed', 'speed', 'val_speed');
      bindVal('p_rot', 'rot', 'val_rot', true);
      bindVal('p_fov', 'fov', 'val_fov');
      bindVal('p_weight', 'weight', 'val_weight');
      bindVal('p_glitch', 'glitch', 'val_glitch');
      bindVal('p_deform', 'deform', 'val_deform');

      // Sliders que requieren recalcular caché o arreglos
      let densInput = document.getElementById('p_density');
      if (densInput) {
        densInput.addEventListener('input', (e) => {
          let v = parseInt(e.target.value);
          param.density = v;
          setElText('val_density', v);
        });
        densInput.addEventListener('change', () => updateDensity());
      }

      let compInput = document.getElementById('p_complexity');
      if (compInput) {
        compInput.addEventListener('input', (e) => {
          let v = parseInt(e.target.value);
          param.complexity = v;
          setElText('val_complexity', v);
          rebuildGeometryCache();
        });
      }

      // Checkbox auto-random al clickear
      let chkRand = document.getElementById('chk_rand_click');
      if (chkRand) {
        chkRand.addEventListener('change', (e) => {
          randomizeOnClick = e.target.checked;
          showToast(`AUTO-RANDOM: ${randomizeOnClick ? 'ACTIVADO' : 'DESACTIVADO'}`);
        });
      }

      // Botón principal de aleatorización
      let btnRand = document.getElementById('btn_random');
      if (btnRand) btnRand.addEventListener('click', randomizeScene);

      // Botones auxiliares
      let btnGlitch = document.getElementById('btn_glitch');
      if (btnGlitch) {
        btnGlitch.addEventListener('click', (e) => {
          glitchMode = !glitchMode;
          if (glitchMode && param.glitch === 0) {
            param.glitch = 25;
            setElVal('p_glitch', 25);
            setElText('val_glitch', 25);
          }
          e.target.innerText = glitchMode ? 'GLITCH MASTER: ON' : 'GLITCH MASTER: OFF';
          e.target.className = glitchMode ? 'glitch-active' : '';
          showToast(`GLITCH: ${glitchMode ? 'ON' : 'OFF'}`);
        });
      }

      let btnDir = document.getElementById('btn_dir');
      if (btnDir) {
        btnDir.addEventListener('click', () => {
          dir *= -1;
          showToast(`DIRECCIÓN: ${dir === 1 ? 'FORWARD' : 'REVERSE'}`);
        });
      }

      let btnPause = document.getElementById('btn_pause');
      if (btnPause) {
        btnPause.addEventListener('click', (e) => {
          isPaused = !isPaused;
          e.target.innerText = isPaused ? 'REANUDAR (Espacio)' : 'PAUSA (Espacio)';
          e.target.className = isPaused ? 'btn-paused' : '';
        });
      }

      let btnSnap = document.getElementById('btn_snap');
      if (btnSnap) {
        btnSnap.addEventListener('click', () => {
          saveCanvas('TOONEL_' + Date.now(), 'png');
          showToast('CAPTURANDO IMAGEN HD...');
        });
      }

      let btnHide = document.getElementById('btn_hide');
      if (btnHide) btnHide.addEventListener('click', toggleUI);
    }

    function toggleUI() {
      let p = document.getElementById('ui-panel');
      let openBtn = document.getElementById('btn-open-ui');
      if (!p) return;
      let isHidden = p.style.display === 'none';
      p.style.display = isHidden ? 'block' : 'none';
      if (openBtn) openBtn.style.display = isHidden ? 'none' : 'block';
    }

    // Manejo de interacción de Click / Drag en el canvas
    function handleCanvasPress() {
      mousePressStartTime = millis();
      mousePressStartX = mouseX;
      mousePressStartY = mouseY;
    }

    function handleCanvasRelease() {
      let p = document.getElementById('ui-panel');
      let isOverPanel = p && p.style.display !== 'none' && mouseX < 330 && mouseY < p.offsetHeight + 20;

      if (!isOverPanel && randomizeOnClick) {
        let pressDuration = millis() - mousePressStartTime;
        let pressDist = dist(mouseX, mouseY, mousePressStartX, mousePressStartY);
        // Si fue un click limpio (< 300ms y menos de 10px de desplazamiento)
        if (pressDuration < 300 && pressDist < 10) {
          randomizeScene();
        }
      }
    }

    function keyPressed() {
      // Ignorar teclas si el foco está en un input de texto
      if (document.activeElement && document.activeElement.tagName === 'INPUT' && document.activeElement.type === 'text') {
        return;
      }

      if (key === 'h' || key === 'H') toggleUI();
      if (key === 'r' || key === 'R') {
        dir *= -1;
        showToast(`DIRECCIÓN: ${dir === 1 ? 'FORWARD' : 'REVERSE'}`);
      }
      if (key === ' ') {
        isPaused = !isPaused;
        let btnPause = document.getElementById('btn_pause');
        if (btnPause) {
          btnPause.innerText = isPaused ? 'REANUDAR (Espacio)' : 'PAUSA (Espacio)';
          btnPause.className = isPaused ? 'btn-paused' : '';
        }
        showToast(isPaused ? 'PAUSADO' : 'REANUDADO');
      }
      if (key === 'c' || key === 'C') {
        randomizeScene();
      }
      if (key === 'g' || key === 'G') {
        let gBtn = document.getElementById('btn_glitch');
        if (gBtn) gBtn.click();
      }
      if (key === 's' || key === 'S') {
        saveCanvas('TOONEL_' + Date.now(), 'png');
        showToast('CAPTURANDO IMAGEN HD...');
      }
      if (key === 'f' || key === 'F') {
        let fs = fullscreen();
        fullscreen(!fs);
        showToast(!fs ? 'PANTALLA COMPLETA: ACTIVADA' : 'PANTALLA COMPLETA: DESACTIVADA');
      }
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
    }
  </script>
</body>
</html>
