<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Global Supply Chain Logistics Globe</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      background-color: #080c14;
      user-select: none;
      -webkit-user-select: none;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      cursor: grab;
    }
    #canvas-container:active {
      cursor: grabbing;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
    }
  }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import GUI from 'lil-gui';

    // =========================================================================
    // POST PROCESSOR SUITE (Inlined from postprocessing/PostProcessor.js)
    // =========================================================================
    const orthoVertexShader = `
    precision highp float;
    in vec3 position;
    out vec2 vUv;
    void main() {
      vUv = position.xy * 0.5 + 0.5;
      gl_Position = vec4(position.xy, 0.0, 1.0);
    }
    `;

    const brightFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float bloomThreshold;
    in vec2 vUv;
    out vec4 fragColor;

    vec3 sanitize(vec3 v) {
      if (isnan(v.x) || isinf(v.x)) v.x = 0.0;
      if (isnan(v.y) || isinf(v.y)) v.y = 0.0;
      if (isnan(v.z) || isinf(v.z)) v.z = 0.0;
      return clamp(v, vec3(0.0), vec3(65000.0));
    }

    void main() {
      vec4 raw = texture(inputTexture, vUv);
      vec3 color = sanitize(raw.rgb);
      float luminance = max(0.0, dot(color, vec3(0.2126, 0.7152, 0.0722)));
      float knee = 0.1;
      float soft = luminance - bloomThreshold + knee;
      soft = clamp(soft, 0.0, 2.0 * knee);
      soft = (soft * soft) / (4.0 * knee + 0.00001);
      float contribution = max(soft, luminance - bloomThreshold);
      contribution /= max(luminance, 0.0001);
      vec3 result = color * contribution;
      fragColor = vec4(sanitize(result), clamp(raw.a, 0.0, 1.0));
    }
    `;

    const blur13ShaderChunk = `
    vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
      vec2 resolution = vec2(textureSize(image, 0));
      vec4 color = vec4(0.0);
      vec2 off1 = vec2(1.411764705882353) * direction;
      vec2 off2 = vec2(3.2941176470588234) * direction;
      vec2 off3 = vec2(5.176470588235294) * direction;
      color += texture(image, uv) * 0.1964825501511404;
      color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
      color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
      return color;
    }
    `;

    const blurFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 direction;
    in vec2 vUv;
    out vec4 color;
    ${blur13ShaderChunk}

    vec4 sanitize(vec4 v) {
      if (isnan(v.x) || isinf(v.x)) v.x = 0.0;
      if (isnan(v.y) || isinf(v.y)) v.y = 0.0;
      if (isnan(v.z) || isinf(v.z)) v.z = 0.0;
      return clamp(v, vec4(0.0), vec4(65000.0));
    }

    void main() {
      color = sanitize(blur13(inputTexture, vUv, direction));
    }
    `;

    const anamorphicBrightShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float threshold;
    uniform float smoothWidth;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float v = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float alpha = smoothstep(threshold, threshold + smoothWidth, v);
      fragColor = mix(vec4(0.0), color, alpha);
    }
    `;

    const anamorphicBlurShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 resolution;
    uniform float samples;
    uniform float intensity;
    uniform vec3 tintColor;
    uniform float bloomRadius;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      int halfSamples = max(1, int(samples) / 2);
      float fHalfSamples = float(halfSamples);
      vec2 invSize = 1.0 / resolution;
      vec4 total = vec4(0.0);

      for (int i = -64; i <= 64; i++) {
        if (i < -halfSamples || i > halfSamples) continue;
        float softness = 1.0 - abs(float(i)) / fHalfSamples;
        softness = pow(softness, 2.0);
        vec2 shiftedUV = vec2(vUv.x + invSize.x * float(i) * (4.0 + bloomRadius * 8.0), vUv.y);
        shiftedUV = clamp(shiftedUV, 0.001, 0.999);
        total += texture(inputTexture, shiftedUV) * softness;
      }

      fragColor = (total / (samples / 3.0)) * vec4(tintColor, 1.0) * intensity;
    }
    `;

    const finalFragmentShader = `
    precision highp float;
    uniform vec2 resolution;
    uniform sampler2D inputTexture;
    uniform sampler2D blur0Texture;
    uniform sampler2D blur1Texture;
    uniform sampler2D blur2Texture;
    uniform sampler2D blur3Texture;
    uniform sampler2D blur4Texture;
    uniform sampler2D anamorphicTexture;
    uniform bool bloomEnabled;
    uniform float bloomStrength;
    uniform bool anamorphicEnabled;
    uniform float vignetteBoost;
    uniform float vignetteReduction;
    uniform float noiseIntensity;
    uniform float time;
    in vec2 vUv;
    out vec4 fragColor;

    vec3 sanitize(vec3 v) {
      if (isnan(v.x) || isinf(v.x)) v.x = 0.0;
      if (isnan(v.y) || isinf(v.y)) v.y = 0.0;
      if (isnan(v.z) || isinf(v.z)) v.z = 0.0;
      return clamp(v, vec3(0.0), vec3(65000.0));
    }

    float vignette(vec2 uv, float boost, float reduction) {
      vec2 position = vUv - 0.5;
      return boost - length(position) * reduction;
    }

    float hash1(uint n) {
      n = (n << 13U) ^ n;
      n = n * (n * n * 15731U + 789221U) + 1376312589U;
      return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
    }

    float noise(in vec2 uv, in float timeVal) {
      uvec2 p = uvec2(uv);
      return hash1(p.x + 1920U * p.y + (1920U * 1080U) * (uint(timeVal) % 65536U));
    }

    void main() {
      vec4 raw = texture(inputTexture, vUv);
      vec3 color = sanitize(raw.rgb);

      if (bloomEnabled && bloomStrength > 0.001) {
        vec3 b0 = sanitize(texture(blur0Texture, vUv).rgb);
        vec3 b1 = sanitize(texture(blur1Texture, vUv).rgb);
        vec3 b2 = sanitize(texture(blur2Texture, vUv).rgb);
        vec3 b3 = sanitize(texture(blur3Texture, vUv).rgb);
        vec3 b4 = sanitize(texture(blur4Texture, vUv).rgb);
        vec3 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
        color += bloomSum * bloomStrength;
      }

      if (anamorphicEnabled) {
        vec3 a = sanitize(texture(anamorphicTexture, vUv).rgb);
        color += a;
      }

      float vig = max(0.0, vignette(vUv, vignetteBoost, vignetteReduction));
      color *= vig;
      color += max(0.0, noiseIntensity) * noise(gl_FragCoord.xy, time);
      fragColor = vec4(sanitize(color), 1.0);
    }
    `;

    const chromaticAberrationShaderChunk = `
    vec2 barrelDistortion(vec2 coord, float amt) {
      vec2 cc = coord - 0.5;
      float dist = dot(cc, cc);
      return coord + cc * dist * amt;
    }
    float sat(float t) { return clamp(t, 0.0, 1.0); }
    float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
    float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
    vec4 spectrum_offset(float t) {
      float lo = step(t, 0.5);
      float hi = 1.0 - lo;
      float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
      vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
      return pow(ret, vec4(1.0 / 2.2));
    }
    const float max_distort = 2.2;
    const int num_iter = 8;
    const float reci_num_iter_f = 1.0 / float(num_iter);
    vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
      vec4 sumcol = vec4(0.0);
      vec4 sumw = vec4(0.0);
      for (int i = 0; i < num_iter; ++i) {
        float t = float(i) * reci_num_iter_f;
        vec4 w = spectrum_offset(t);
        sumw += w;
        sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
      }
      return sumcol / sumw;
    }
    `;

    const colorFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float chromaticAberrationAmount;
    uniform float minInputLevel;
    uniform float maxInputLevel;
    uniform float gammaLevel;
    uniform float exposure;
    in vec2 vUv;
    out vec4 fragColor;

    ${chromaticAberrationShaderChunk}

    vec3 ACESFilmicToneMapping(vec3 color) {
      color = max(vec3(0.0), color);
      float a = 2.51;
      float b = 0.03;
      float c = 2.43;
      float d = 0.59;
      float e = 0.14;
      vec3 denom = max(color * (c * color + d) + e, vec3(0.0001));
      return clamp((color * (a * color + b)) / denom, 0.0, 1.0);
    }

    vec3 gammaCorrect(vec3 color, vec3 gamma) {
      return pow(max(color, vec3(0.0)), 1.0 / max(gamma, vec3(0.001)));
    }
    vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
      return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
    }
    vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
      return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
    }

    void main() {
      vec4 col = chromaticAberration(inputTexture, vUv, chromaticAberrationAmount, (vUv - 0.5));
      vec3 finalCol = col.rgb;
      if (isnan(finalCol.x) || isinf(finalCol.x)) finalCol.x = 0.0;
      if (isnan(finalCol.y) || isinf(finalCol.y)) finalCol.y = 0.0;
      if (isnan(finalCol.z) || isinf(finalCol.z)) finalCol.z = 0.0;
      finalCol = clamp(finalCol, vec3(0.0), vec3(65000.0));

      vec3 exposedColor = finalCol * exposure;
      vec3 toneMappedColor = ACESFilmicToneMapping(exposedColor);
      finalCol = finalLevels(toneMappedColor, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));

      fragColor = vec4(finalCol, 1.0);
    }
    `;

    function createFBO(w, h, options = {}) {
      return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
        wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
        wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
        minFilter: options.minFilter || THREE.LinearFilter,
        magFilter: options.magFilter || THREE.LinearFilter,
        format: options.format || THREE.RGBAFormat,
        type: options.type || THREE.HalfFloatType,
        stencilBuffer: false,
        depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : false,
        samples: options.samples || 0,
      });
    }

    class ShaderPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.shader.depthTest = false;
        this.shader.depthWrite = false;
        this.orthoScene = new THREE.Scene();
        this.fbo = createFBO(1, 1, options);
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
        this.texture = this.fbo.texture;
      }
      render(renderer, toScreen = false) {
        if (!toScreen) renderer.setRenderTarget(this.fbo);
        renderer.render(this.orthoScene, this.orthoCamera);
        if (!toScreen) renderer.setRenderTarget(null);
      }
      setSize(width, height) {
        this.fbo.setSize(Math.max(1, width), Math.max(1, height));
      }
    }

    class ShaderPingPongPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.shader.depthTest = false;
        this.shader.depthWrite = false;
        this.orthoScene = new THREE.Scene();
        this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
        this.currentFBO = 0;
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
      }
      render(renderer) {
        renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
        renderer.render(this.orthoScene, this.orthoCamera);
        renderer.setRenderTarget(null);
        this.currentFBO = 1 - this.currentFBO;
      }
      get current() { return this.fbos[this.currentFBO]; }
      get texture() { return this.current.texture; }
      setSize(width, height) {
        const w = Math.max(1, width);
        const h = Math.max(1, height);
        this.fbos[0].setSize(w, h);
        this.fbos[1].setSize(w, h);
      }
    }

    class BloomPass {
      constructor(strength = 0.8, radius = 0.5, threshold = 0.2, levels = 5) {
        this.strength = strength;
        this.radius = radius;
        this.threshold = threshold;
        this.enabled = true;
        this.levels = levels;

        this.brightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            bloomThreshold: { value: this.threshold },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: brightFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.brightPass = new ShaderPass(this.brightShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.blurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            direction: { value: new THREE.Vector2(0, 1) },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: blurFragmentShader,
          glslVersion: THREE.GLSL3,
        });

        this.blurPasses = [];
        for (let i = 0; i < this.levels; i++) {
          this.blurPasses.push(new ShaderPingPongPass(this.blurShader, {
            format: THREE.RGBAFormat,
            type: THREE.HalfFloatType,
          }));
        }
      }

      setSize(w, h) {
        let tw = Math.max(1, w);
        let th = Math.max(1, h);
        this.brightPass.setSize(tw, th);
        for (let i = 0; i < this.levels; i++) {
          tw = Math.max(1, Math.round(tw / 2));
          th = Math.max(1, Math.round(th / 2));
          this.blurPasses[i].setSize(tw, th);
        }
      }

      render(renderer, sourceTexture) {
        if (!this.enabled || this.strength <= 0.001) return;
        this.brightShader.uniforms.inputTexture.value = sourceTexture;
        this.brightShader.uniforms.bloomThreshold.value = this.threshold;
        this.brightPass.render(renderer);

        const baseOffset = Math.max(0.1, this.radius * 2.0);
        const u = this.blurShader.uniforms;

        for (let j = 0; j < this.levels; j++) {
          const blurPass = this.blurPasses[j];
          const stepOffset = baseOffset * (1.0 + j * 0.5);

          u.direction.value.set(stepOffset, 0);
          u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
          blurPass.render(renderer);

          u.direction.value.set(0, stepOffset * 0.5);
          u.inputTexture.value = blurPass.current.texture;
          blurPass.render(renderer);
        }
      }
    }

    class PostProcessor {
      constructor(renderer, params = {}) {
        this.renderer = renderer;

        this.settings = {
          enabled: params.enabled !== undefined ? params.enabled : true,
          antialias: params.antialias !== undefined ? params.antialias : true,
          bloomEnabled: params.bloomEnabled !== undefined ? params.bloomEnabled : true,
          bloomStrength: params.bloomStrength !== undefined ? params.bloomStrength : 1.1,
          bloomRadius: params.bloomRadius !== undefined ? params.bloomRadius : 0.5,
          bloomThreshold: params.bloomThreshold !== undefined ? params.bloomThreshold : 0.18,
          anamorphicEnabled: params.anamorphicEnabled !== undefined ? params.anamorphicEnabled : false, // Default is OFF
          anamorphicIntensity: params.anamorphicIntensity !== undefined ? params.anamorphicIntensity : 4.0,
          anamorphicThreshold: params.anamorphicThreshold !== undefined ? params.anamorphicThreshold : 0.35,
          anamorphicSamples: 64,
          anamorphicRadius: 0.0,
          anamorphicSmoothWidth: 0.05,
          anamorphicColor: new THREE.Color(0x7a8aff),
          anamorphicColorHex: '#7a8aff',
          chromaticAberration: params.chromaticAberration !== undefined ? params.chromaticAberration : 0.006,
          vignetteBoost: params.vignetteBoost !== undefined ? params.vignetteBoost : 1.05,
          vignetteReduction: params.vignetteReduction !== undefined ? params.vignetteReduction : 0.45,
          noiseIntensity: params.noiseIntensity !== undefined ? params.noiseIntensity : 0.008,
          gamma: 1.0,
          minInputLevel: 0.0,
          maxInputLevel: 1.0,
          exposure: 1.0,
        };

        const maxSamples = (this.renderer && this.renderer.capabilities) ? (this.renderer.capabilities.maxSamples || 4) : 4;
        const targetSamples = this.settings.antialias ? Math.min(4, maxSamples) : 0;
        this.sceneTarget = createFBO(1, 1, { type: THREE.HalfFloatType, samples: targetSamples, depthBuffer: true });

        this.bloomPass = new BloomPass(
          this.settings.bloomStrength,
          this.settings.bloomRadius,
          this.settings.bloomThreshold,
          5
        );

        this.anamorphicBrightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            threshold: { value: this.settings.anamorphicThreshold },
            smoothWidth: { value: this.settings.anamorphicSmoothWidth },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: anamorphicBrightShader,
          glslVersion: THREE.GLSL3,
        });
        this.anamorphicBrightPass = new ShaderPass(this.anamorphicBrightShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.anamorphicBlurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            resolution: { value: new THREE.Vector2(1, 1) },
            samples: { value: this.settings.anamorphicSamples },
            intensity: { value: this.settings.anamorphicIntensity },
            tintColor: { value: this.settings.anamorphicColor },
            bloomRadius: { value: this.settings.anamorphicRadius },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: anamorphicBlurShader,
          glslVersion: THREE.GLSL3,
        });
        this.anamorphicBlurPass = new ShaderPass(this.anamorphicBlurShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.finalShader = new THREE.RawShaderMaterial({
          uniforms: {
            resolution: { value: new THREE.Vector2(1, 1) },
            inputTexture: { value: null },
            bloomEnabled: { value: this.settings.bloomEnabled },
            bloomStrength: { value: this.settings.bloomStrength },
            anamorphicEnabled: { value: this.settings.anamorphicEnabled },
            vignetteBoost: { value: this.settings.vignetteBoost },
            vignetteReduction: { value: this.settings.vignetteReduction },
            noiseIntensity: { value: this.settings.noiseIntensity },
            blur0Texture: { value: null },
            blur1Texture: { value: null },
            blur2Texture: { value: null },
            blur3Texture: { value: null },
            blur4Texture: { value: null },
            anamorphicTexture: { value: null },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: finalFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.finalPass = new ShaderPass(this.finalShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.rgbShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            chromaticAberrationAmount: { value: this.settings.chromaticAberration },
            minInputLevel: { value: this.settings.minInputLevel },
            maxInputLevel: { value: this.settings.maxInputLevel },
            gammaLevel: { value: this.settings.gamma },
            exposure: { value: this.settings.exposure },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: colorFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.rgbPass = new ShaderPass(this.rgbShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.setSize(window.innerWidth, window.innerHeight);
        this.updateSettings();
      }

      updateSettings() {
        this.bloomPass.strength = this.settings.bloomStrength;
        this.bloomPass.radius = this.settings.bloomRadius;
        this.bloomPass.threshold = this.settings.bloomThreshold;
        this.bloomPass.enabled = this.settings.bloomEnabled;

        this.anamorphicBrightShader.uniforms.threshold.value = this.settings.anamorphicThreshold;
        this.anamorphicBrightShader.uniforms.smoothWidth.value = this.settings.anamorphicSmoothWidth;
        this.anamorphicBlurShader.uniforms.samples.value = this.settings.anamorphicSamples;
        this.anamorphicBlurShader.uniforms.intensity.value = this.settings.anamorphicIntensity;
        this.anamorphicBlurShader.uniforms.tintColor.value.copy(this.settings.anamorphicColor);
        this.anamorphicBlurShader.uniforms.bloomRadius.value = this.settings.anamorphicRadius;

        this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
        this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
        this.finalShader.uniforms.anamorphicEnabled.value = this.settings.anamorphicEnabled;
        this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
        this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
        this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;

        this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
        this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
        this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
        this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
        this.rgbShader.uniforms.exposure.value = this.settings.exposure;
      }

      setSize(w, h) {
        this.sceneTarget.setSize(w, h);
        this.bloomPass.setSize(w, h);
        this.finalPass.setSize(w, h);
        this.finalShader.uniforms.resolution.value.set(w, h);

        const anW = Math.max(1, Math.round(w / 4));
        const anH = Math.max(1, Math.round(h / 4));
        this.anamorphicBrightPass.setSize(anW, anH);
        this.anamorphicBlurPass.setSize(anW, anH);
        this.anamorphicBlurShader.uniforms.resolution.value.set(anW, anH);

        this.rgbPass.setSize(w, h);
      }

      render(scene, camera) {
        if (!this.settings.enabled) {
          this.renderer.setRenderTarget(null);
          this.renderer.render(scene, camera);
          return;
        }

        this.renderer.setRenderTarget(this.sceneTarget);
        this.renderer.render(scene, camera);
        this.renderer.setRenderTarget(null);

        const sourceTexture = this.sceneTarget.texture;

        if (this.settings.bloomEnabled) {
          this.bloomPass.render(this.renderer, sourceTexture);
          for (let i = 0; i < 5; i++) {
            this.finalShader.uniforms[`blur${i}Texture`].value = this.bloomPass.blurPasses[i].current.texture;
          }
        }

        if (this.settings.anamorphicEnabled && this.settings.anamorphicIntensity > 0.001) {
          this.anamorphicBrightShader.uniforms.inputTexture.value = sourceTexture;
          this.anamorphicBrightPass.render(this.renderer);

          this.anamorphicBlurShader.uniforms.inputTexture.value = this.anamorphicBrightPass.texture;
          this.anamorphicBlurPass.render(this.renderer);

          this.finalPass.shader.uniforms.anamorphicTexture.value = this.anamorphicBlurPass.texture;
          this.finalPass.shader.uniforms.anamorphicEnabled.value = true;
        } else {
          this.finalPass.shader.uniforms.anamorphicEnabled.value = false;
        }

        this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
        this.finalPass.shader.uniforms.time.value = performance.now() * 0.001;
        this.finalPass.render(this.renderer);

        this.rgbShader.uniforms.inputTexture.value = this.finalPass.texture;
        this.rgbPass.render(this.renderer, true);
      }

        ctx.beginPath();

          const y = ((90 - pts[i + 1]) / 180) * mapCanvas.height;

        -68, -55, -75, -50, -72, -35, -80, -8, -77, 12
      ]);

        28, 71, 16, 71, 8, 62, 4, 58, -5, 58, -5, 49, -9, 43, -9, 36

    drawWorldMap();

    function isLandCoordinate(lat, lon) {
      let x = Math.floor(((lon + 180) / 360) * mapCanvas.width);
      let y = Math.floor(((90 - lat) / 180) * mapCanvas.height);
      x = Math.max(0, Math.min(mapCanvas.width - 1, x));
      y = Math.max(0, Math.min(mapCanvas.height - 1, y));
      const idx = (y * mapCanvas.width + x) * 4;

    // --- SEAMLESS LOW-POLY GLOBE ---

    function buildGlobe() {
      if (globeMesh) {
        globeGroup.remove(globeMesh);
        globeMesh.geometry.dispose();
      }

      baseGlobeGeom = new THREE.IcosahedronGeometry(GLOBE_RADIUS, 4);
      baseGlobeGeom = baseGlobeGeom.toNonIndexed();

      const pos = baseGlobeGeom.attributes.position;
      const count = pos.count;
      const colors = new Float32Array(count * 3);

      const vA = new THREE.Vector3();
      const vB = new THREE.Vector3();
      const vC = new THREE.Vector3();
      const centroid = new THREE.Vector3();

      const oceanCol = new THREE.Color(params.oceanColor);
      const landGreenCol = new THREE.Color(params.landGreenColor);
      const landDesertCol = new THREE.Color(params.landDesertColor);
      const landSnowCol = new THREE.Color(params.landSnowColor);

      for (let i = 0; i < count; i += 3) {
        vA.fromBufferAttribute(pos, i);
        vB.fromBufferAttribute(pos, i + 1);
        vC.fromBufferAttribute(pos, i + 2);

        centroid.copy(vA).add(vB).add(vC).divideScalar(3);
        const r = centroid.length();

        const lat = Math.asin(centroid.y / r) * (180 / Math.PI);
        const lon = Math.atan2(centroid.x, centroid.z) * (180 / Math.PI);

        const isLand = isLandCoordinate(lat, lon);
        let faceColor = new THREE.Color();
        const facetJitter = (Math.sin(i * 12.9898 + lat * 7.12) * 0.5 + 0.5) * 0.1 - 0.05;

        if (isLand) {
          if (lat > 62 || lat < -62 || (lat > 56 && lon < -20 && lon > -58)) {
            faceColor.copy(landSnowCol);
          } else if ((lat > 14 && lat < 33 && lon > -18 && lon < 56) ||
                     (lat > -34 && lat < -18 && lon > 115 && lon < 142)) {
            faceColor.copy(landDesertCol);
          } else {
            faceColor.copy(landGreenCol);
          }
        } else {
          faceColor.copy(oceanCol);
        }

        faceColor.offsetHSL(0, 0, facetJitter);

        for (let j = 0; j < 3; j++) {
          colors[(i + j) * 3] = faceColor.r;
          colors[(i + j) * 3 + 1] = faceColor.g;
          colors[(i + j) * 3 + 2] = faceColor.b;
        }
      }

      baseGlobeGeom.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      baseGlobeGeom.computeVertexNormals();

      const globeMat = new THREE.MeshStandardMaterial({
        vertexColors: true,
        flatShading: true,
        roughness: 0.72,
        metalness: 0.16
      });

      globeMesh = new THREE.Mesh(baseGlobeGeom, globeMat);
      globeMesh.castShadow = true;
      globeMesh.receiveShadow = true;
      globeGroup.add(globeMesh);
    }

    // --- REFINED 3D DUAL-RAIL TRUSS TRACKS (NO OVERHANGS, NO SAW-TEETH) ---
    const tracksGroup = new THREE.Group();

    const trackGoldMat = new THREE.MeshStandardMaterial({

    function createOrbitCurve(radius, euler, waveAmp = 0.18, waveFreq = 2) {
      const pts = [];
      const steps = 96;
      const rotMat = new THREE.Matrix4().makeRotationFromEuler(euler);

      for (let i = 0; i <= steps; i++) {
        const theta = (i / steps) * Math.PI * 2;
        let x = Math.cos(theta) * radius;
        let z = Math.sin(theta) * radius;
        let y = Math.sin(theta * waveFreq) * waveAmp;

        const p = new THREE.Vector3(x, y, z);
        p.applyMatrix4(rotMat);
        p.add(globeCenter);
        pts.push(p);
      }
      return new THREE.CatmullRomCurve3(pts, true);
    }

    // 2 Primary elevated sky-freight tracks looping cleanly around the globe
    const curveGold = createOrbitCurve(4.25, new THREE.Euler(0.24, 0.36, 0.12), 0.2, 2);
    const curveSilver = createOrbitCurve(4.58, new THREE.Euler(-0.28, -0.42, 0.16), 0.22, 2);

    // Dedicated high-altitude aerial flight routes for airplanes
    const curveFlight1 = createOrbitCurve(5.1, new THREE.Euler(0.55, 0.72, -0.2), 0.28, 3);
    const curveFlight2 = createOrbitCurve(5.3, new THREE.Euler(-0.48, 0.85, 0.35), 0.24, 2);

    function buildTrussTrack(curve, trackMat, railSpacing = 0.32, tubeRadius = 0.024) {
      const group = new THREE.Group();
      const samples = 180;
      const leftPts = [];
      const rightPts = [];

      for (let i = 0; i <= samples; i++) {
        const u = i / samples;
        const pt = curve.getPointAt(u);
        const tangent = curve.getTangentAt(u).normalize();
        
        const up = pt.clone().sub(globeCenter).normalize();
        const right = new THREE.Vector3().crossVectors(up, tangent).normalize();

        leftPts.push(pt.clone().addScaledVector(right, -railSpacing * 0.5));
        rightPts.push(pt.clone().addScaledVector(right, railSpacing * 0.5));
      }

      const leftCurve = new THREE.CatmullRomCurve3(leftPts, true);
      const rightCurve = new THREE.CatmullRomCurve3(rightPts, true);

      // 1. Twin continuous tubular rails
      const railGeomL = new THREE.TubeGeometry(leftCurve, 160, tubeRadius, 8, true);
      const railGeomR = new THREE.TubeGeometry(rightCurve, 160, tubeRadius, 8, true);
      const meshL = new THREE.Mesh(railGeomL, trackMat);
      const meshR = new THREE.Mesh(railGeomR, trackMat);
      meshL.castShadow = true;
      meshR.castShadow = true;
      group.add(meshL);
      group.add(meshR);

      // 2. Mathematically Exact Cross-Ties (Connecting Left to Right with ZERO overhang)
      const tiesCount = 90;
      const unitCylinder = new THREE.CylinderGeometry(0.014, 0.014, 1.0, 6);
      const tiesInst = new THREE.InstancedMesh(unitCylinder, trackMat, tiesCount);
      const diagInst = new THREE.InstancedMesh(unitCylinder, trackMat, tiesCount);

      const dummy = new THREE.Object3D();
      const yUp = new THREE.Vector3(0, 1, 0);

      for (let i = 0; i < tiesCount; i++) {
        const u = i / tiesCount;
        const pL = leftCurve.getPointAt(u);
        const pR = rightCurve.getPointAt(u);

        // A. Cross tie bar
        const mid = pL.clone().add(pR).multiplyScalar(0.5);
        const dir = pR.clone().sub(pL);
        const len = dir.length();
        dir.normalize();

        dummy.position.copy(mid);
        dummy.quaternion.setFromUnitVectors(yUp, dir);
        dummy.scale.set(1, len, 1);
        dummy.updateMatrix();
        tiesInst.setMatrixAt(i, dummy.matrix);

        // B. Diagonal truss strut (clean zigzag lattice)
        const nextU = ((i + 1) % tiesCount) / tiesCount;
        const nextPR = rightCurve.getPointAt(nextU);
        const diagMid = pL.clone().add(nextPR).multiplyScalar(0.5);
        const diagDir = nextPR.clone().sub(pL);
        const diagLen = diagDir.length();
        diagDir.normalize();

        dummy.position.copy(diagMid);
        dummy.quaternion.setFromUnitVectors(yUp, diagDir);
        dummy.scale.set(1, diagLen, 1);
        dummy.updateMatrix();
        diagInst.setMatrixAt(i, dummy.matrix);
      }

      tiesInst.instanceMatrix.needsUpdate = true;
      diagInst.instanceMatrix.needsUpdate = true;
      group.add(tiesInst);
      group.add(diagInst);

      return { group, curve, leftCurve, rightCurve };
    }

    const track1 = buildTrussTrack(curveGold, trackGoldMat, 0.32, 0.026);
    const track2 = buildTrussTrack(curveSilver, trackSilverMat, 0.3, 0.024);

      const mid = p1.clone().add(p2).multiplyScalar(0.5);

      return new THREE.Vector3(
        -r * Math.sin(phi) * Math.cos(theta),
        r * Math.cos(phi) + GLOBE_CENTER_Y,
        r * Math.sin(phi) * Math.sin(theta)
      );
    }

    // 3. Realistic Air-Freight Commercial Cargo Jet

    // Dynamic fleets
    const trains = [];
    const singleVehicles = [];

    function populateFleet() {
      while (vehiclesGroup.children.length > 0) {
        const v = vehiclesGroup.children[0];
        vehiclesGroup.remove(v);
      }
      trains.length = 0;
      singleVehicles.length = 0;

      const activeTheme = PALETTES[params.theme] || PALETTES['Original'];

      // Train 1 on Track 1 (Gold)
      const trainCars1 = buildArticulatedTrain(activeTheme, 4);
      trains.push({ cars: trainCars1, curve: track1.curve, progress: 0.12, speed: 0.038, carSpacing: 0.025 });

      // Train 2 on Track 2 (Silver)
      const trainCars2 = buildArticulatedTrain(activeTheme, 4);
      trains.push({ cars: trainCars2, curve: track2.curve, progress: 0.58, speed: 0.034, carSpacing: 0.025 });

      // Container Ship on Track 1 (Gold Skyway)
      const ship1 = createContainerShip(activeTheme);
      vehiclesGroup.add(ship1);
      singleVehicles.push({ mesh: ship1, curve: track1.curve, progress: 0.68, speed: 0.03, lift: 0.06 });

      // Container Ship on Track 2 (Silver Skyway)
      const ship2 = createContainerShip(activeTheme);
      vehiclesGroup.add(ship2);
      singleVehicles.push({ mesh: ship2, curve: track2.curve, progress: 0.22, speed: 0.028, lift: 0.06 });

      // High-Altitude Cargo Plane 1
      const plane1 = createCargoPlane(activeTheme);
      vehiclesGroup.add(plane1);
      singleVehicles.push({ mesh: plane1, curve: curveFlight1, progress: 0.05, speed: 0.058, lift: 0.0 });

      // High-Altitude Cargo Plane 2
      const plane2 = createCargoPlane(activeTheme);
      vehiclesGroup.add(plane2);
      singleVehicles.push({ mesh: plane2, curve: curveFlight2, progress: 0.52, speed: 0.054, lift: 0.0 });
    }
    populateFleet();

    // --- STARFIELD ---
    let stars;
    function buildStarfield() {
      if (stars) {
        scene.remove(stars);
        stars.geometry.dispose();
        stars.material.dispose();
      }
      const starCount = params.starDensity;
      const starGeom = new THREE.BufferGeometry();
      const starPos = new Float32Array(starCount * 3);
      const starCols = new Float32Array(starCount * 3);

      for (let i = 0; i < starCount; i++) {
        const rad = 25 + Math.random() * 35;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(Math.random() * 2 - 1);

        starPos[i * 3] = rad * Math.sin(phi) * Math.cos(theta);
        starPos[i * 3 + 1] = rad * Math.cos(phi);
        starPos[i * 3 + 2] = rad * Math.sin(phi) * Math.sin(theta);

        const brightness = 0.5 + Math.random() * 0.5;
        starCols[i * 3] = brightness * 0.85;
        starCols[i * 3 + 1] = brightness * 0.95;
        starCols[i * 3 + 2] = brightness;
      }
      starGeom.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
      starGeom.setAttribute('color', new THREE.BufferAttribute(starCols, 3));

      const starMat = new THREE.PointsMaterial({
        size: 0.12,
        vertexColors: true,
        transparent: true,
        opacity: 0.85
      });
      stars = new THREE.Points(starGeom, starMat);
      scene.add(stars);
    }
    buildStarfield();

    // --- CAMERA ANIMATIONS ENGINE (RESPECTS USER ZOOM & ANGLES) ---
    let animClock = 0;

    function updateCamera(delta) {
      if (params.animationMode === 'Static View (No Camera Movement)') {
        return;
      }

      const speedFactor = params.animSpeed * params.autoOrbitSpeed;
      const dt = delta * speedFactor;
      animClock += dt;

      const currentDist = camera.position.distanceTo(controls.target);
      const offset = camera.position.clone().sub(controls.target);

      if (params.animationMode === 'Gentle Slow Orbit') {
        offset.applyAxisAngle(new THREE.Vector3(0, 1, 0), dt * 0.4);
        camera.position.copy(controls.target).add(offset);
      }
      else if (params.animationMode === 'Cinematic Logistics Survey') {
        offset.applyAxisAngle(new THREE.Vector3(0, 1, 0), dt * 0.35);
        const pitchDelta = Math.sin(animClock * 0.8) * 0.003;
        offset.y += pitchDelta * currentDist;
        camera.position.copy(controls.target).add(offset);
      }
      else if (params.animationMode === 'Northern Shipping Arcs') {
        offset.applyAxisAngle(new THREE.Vector3(0, 1, 0), dt * 0.3);
        offset.y = THREE.MathUtils.lerp(offset.y, currentDist * 0.5, 0.015);
        camera.position.copy(controls.target).add(offset.normalize().multiplyScalar(currentDist));
      }
      else if (params.animationMode === 'Close-Up Route Inspection') {
        offset.applyAxisAngle(new THREE.Vector3(0, 1, 0), dt * 0.25);
        camera.position.copy(controls.target).add(offset);
      }
      else if (params.animationMode === 'Dynamic Figure-8 Drift') {
        const thetaDelta = Math.sin(animClock * 0.6) * 0.005;
        const phiDelta = Math.cos(animClock * 1.2) * 0.003;
        offset.applyAxisAngle(new THREE.Vector3(0, 1, 0), thetaDelta);
        offset.y += phiDelta * currentDist;
        camera.position.copy(controls.target).add(offset.normalize().multiplyScalar(currentDist));
      }
      else if (params.animationMode === 'Ascending Orbital Spiral') {
        offset.applyAxisAngle(new THREE.Vector3(0, 1, 0), dt * 0.38);
        const elev = Math.sin(animClock * 0.4) * (currentDist * 0.3);
        offset.y = THREE.MathUtils.lerp(offset.y, elev, 0.01);
        camera.position.copy(controls.target).add(offset.normalize().multiplyScalar(currentDist));
      }
      else if (params.animationMode === 'Equatorial Cargo Highway') {
        offset.applyAxisAngle(new THREE.Vector3(0, 1, 0), dt * 0.42);
        offset.y = THREE.MathUtils.lerp(offset.y, currentDist * 0.15, 0.02);
        camera.position.copy(controls.target).add(offset.normalize().multiplyScalar(currentDist));
      }
    }

    // --- APPLY COLOR SCHEME ---
    function applyColorScheme(themeName) {
      params.theme = themeName;
      const theme = PALETTES[themeName];
      if (!theme) return;

      params.bgColor = theme.bg;
      params.oceanColor = theme.ocean;
      params.landGreenColor = theme.landGreen;
      params.landDesertColor = theme.landDesert;
      params.landSnowColor = theme.landSnow;
      params.trackGoldColor = theme.trackGold;
      params.trackSilverColor = theme.trackSilver;
      params.baseMetalColor = theme.baseMetal;
      params.neonAmberColor = theme.neonAmber;
      params.neonCyanColor = theme.neonCyan;

      if (!params.greenScreen) {
        scene.background.set(params.bgColor);
        if (stars) stars.visible = true;
      }

      buildGlobe();
      trackGoldMat.color.set(params.trackGoldColor);
      trackSilverMat.color.set(params.trackSilverColor);
      buildPedestal();

      arcsGroup.children.forEach(arc => {
        arc.material.color.set(params.neonCyanColor);
      });

      populateFleet();

      // Only update standard theme controllers, NEVER touch PostProcessor GUI
      gui.controllersRecursive().forEach(c => {
        if (!c.parent || !c.parent._title?.includes('Post Processor')) {
          c.updateDisplay();
        }
      });
    }

    // --- GREENSCREEN TOGGLE ---
    function setGreenScreen(enabled) {
      params.greenScreen = enabled;
      if (enabled) {
        scene.background.set('#00ff00');
        renderer.setClearColor('#00ff00', 1);
        if (stars) stars.visible = false;
      } else {
        scene.background.set(params.bgColor);
        renderer.setClearColor(params.bgColor, 1);
        if (stars) stars.visible = true;
      }
      gui.controllersRecursive().forEach(c => {
        if (!c.parent || !c.parent._title?.includes('Post Processor')) {
          c.updateDisplay();
        }
      });
    }

    // --- ANTIALIAS TOGGLE ---
    function updateAntialias(val) {
      params.antialias = val;
      const oldCanvas = renderer.domElement;
      renderer.dispose();
      container.removeChild(oldCanvas);

      renderer = new THREE.WebGLRenderer({
        antialias: params.antialias,
        powerPreference: 'high-performance',
        alpha: true
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(params.pixelRatio);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = params.toneMappingExposure;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      controls.domElement = renderer.domElement;
      postProcessor.renderer = renderer;
      postProcessor.settings.antialias = val;
      postProcessor.setSize(window.innerWidth, window.innerHeight);

      if (params.greenScreen) {
        scene.background.set('#00ff00');
        renderer.setClearColor('#00ff00', 1);
      }
    }

    // --- PROCEDURAL RANDOMIZER (DO NOT SHUFFLE POSTPROCESSING SETTINGS) ---
    function randomizeScene() {
      const keys = Object.keys(PALETTES);
      const randomKey = keys[Math.floor(Math.random() * keys.length)];
      applyColorScheme(randomKey);

      params.animSpeed = 0.6 + Math.random() * 1.2;
      params.toneMappingExposure = 0.9 + Math.random() * 0.5;
      renderer.toneMappingExposure = params.toneMappingExposure;

      params.keyLightIntensity = 1.8 + Math.random() * 1.0;
      keyLight.intensity = params.keyLightIntensity;

      params.ambientIntensity = 0.5 + Math.random() * 0.4;
      ambientLight.intensity = params.ambientIntensity;

      // Notice: postProcessor.settings are STRICTLY preserved and never shuffled!
      gui.controllersRecursive().forEach(c => {
        if (!c.parent || !c.parent._title?.includes('Post Processor')) {
          c.updateDisplay();
        }
      });
    }

    // Distinguish click from camera drag
    let pointerDownPos = { x: 0, y: 0 };
    window.addEventListener('pointerdown', (e) => {
      pointerDownPos.x = e.clientX;
      pointerDownPos.y = e.clientY;
    });

    window.addEventListener('pointerup', (e) => {
      if (e.target.closest('.lil-gui')) return;
      const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
      if (dist < 6 && params.clickToRandomize) {
        randomizeScene();
      }
    });

    // --- LIL-GUI SETUP ---
    const gui = new GUI({ title: 'Global Supply Chain Logistics' });

    // 1. Color Schemes & Theme
    const fColor = gui.addFolder('🎨 Color & Theme');
    fColor.add(params, 'theme', Object.keys(PALETTES)).name('Palette Preset').onChange(applyColorScheme);
    fColor.add(params, 'greenScreen').name('Green Screen (#00ff00)').onChange(setGreenScreen);
    fColor.addColor(params, 'bgColor').name('Background Color').onChange(c => {
      if (!params.greenScreen) scene.background.set(c);
    });
    fColor.addColor(params, 'oceanColor').name('Ocean Facets').onChange(() => buildGlobe());
    fColor.addColor(params, 'landGreenColor').name('Land (Forest)').onChange(() => buildGlobe());
    fColor.addColor(params, 'landDesertColor').name('Land (Desert)').onChange(() => buildGlobe());
    fColor.addColor(params, 'landSnowColor').name('Land (Polar/Ice)').onChange(() => buildGlobe());
    fColor.addColor(params, 'trackGoldColor').name('Main Track (Gold)').onChange(c => trackGoldMat.color.set(c));
    fColor.addColor(params, 'trackSilverColor').name('Cross Track (Silver)').onChange(c => trackSilverMat.color.set(c));
    fColor.addColor(params, 'baseMetalColor').name('Pedestal Base').onChange(() => buildPedestal());
    fColor.addColor(params, 'neonAmberColor').name('Neon Ring (Amber)').onChange(() => buildPedestal());
    fColor.addColor(params, 'neonCyanColor').name('Neon Ring (Cyan)').onChange(() => buildPedestal());

    // 2. Camera & Animation
    const fAnim = gui.addFolder('🎬 Camera & Motion');
    fAnim.add(params, 'animationMode', ANIMATION_OPTIONS).name('Camera Mode');
    fAnim.add(params, 'animSpeed', 0.0, 3.0, 0.05).name('Global Speed');
    fAnim.add(params, 'autoOrbitSpeed', 0.0, 2.0, 0.05).name('Orbit Rate');
    fAnim.add({ resetCamera: () => {
      camera.position.set(0, 3.2, 12.6);
      controls.target.set(0, GLOBE_CENTER_Y, 0);
      controls.update();
    }}, 'resetCamera').name('Reset Camera View');

    // 3. Lighting & Exposure
    const fLight = gui.addFolder('💡 Lighting & Exposure');
    fLight.add(params, 'toneMappingExposure', 0.2, 3.0, 0.05).name('Scene Exposure').onChange(v => {
      renderer.toneMappingExposure = v;
    });
    fLight.add(params, 'ambientIntensity', 0.0, 2.5, 0.05).name('Ambient Light').onChange(v => ambientLight.intensity = v);
    fLight.addColor(params, 'ambientColor').name('Ambient Color').onChange(c => ambientLight.color.set(c));

    fLight.add(params, 'keyLightIntensity', 0.0, 5.0, 0.1).name('Key Directional').onChange(v => keyLight.intensity = v);
    fLight.addColor(params, 'keyLightColor').name('Key Color').onChange(c => keyLight.color.set(c));

    fLight.add(params, 'fillLightIntensity', 0.0, 3.0, 0.1).name('Fill Light').onChange(v => fillLight.intensity = v);
    fLight.addColor(params, 'fillLightColor').name('Fill Color').onChange(c => fillLight.color.set(c));

    fLight.add(params, 'baseLightIntensity', 0.0, 6.0, 0.1).name('Base Uplight').onChange(v => basePointLight.intensity = v);
    fLight.addColor(params, 'baseLightColor').name('Base Light Color').onChange(c => basePointLight.color.set(c));

    // 4. Quality & Display Settings
    const fDisplay = gui.addFolder('⚙️ Quality & Graphics');
    fDisplay.add(params, 'pixelRatio', 0.5, 3.0, 0.25).name('Pixel Ratio (DPR)').onChange(v => {
      renderer.setPixelRatio(v);
      postProcessor.setSize(window.innerWidth, window.innerHeight);
    });
    fDisplay.add(params, 'antialias').name('Antialiasing').onChange(updateAntialias);
    fDisplay.add(params, 'atmosphereDome').name('Atmosphere Glass').onChange(v => atmoMesh.visible = v);
    fDisplay.add(params, 'starDensity', 200, 3000, 100).name('Star Density').onChange(() => buildStarfield());

    // 5. Procedural Variation on Click
    const fRandom = gui.addFolder('🎲 Procedural Variation');
    fRandom.add(params, 'clickToRandomize').name('Click Scene: Re-roll');
    fRandom.add({ triggerRandom: randomizeScene }, 'triggerRandom').name('Randomize Now');

    // 6. PostProcessor Controls
    postProcessor.attachGUI(gui, 'Post Processor (PostProcessor.js)');

    // Hide/Show GUI with 'H' Key
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        gui._hidden ? gui.show() : gui.hide();
      }
    });

    // Handle Window Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      postProcessor.setSize(window.innerWidth, window.innerHeight);
    });

    // --- MAIN ANIMATION LOOP ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const effectiveDt = delta * params.animSpeed;

      // 1. Update Camera Position / Orbit
      updateCamera(delta);
      controls.update();

      // 2. Slow Globe Self-Rotation
      if (globeGroup) {
        globeGroup.rotation.y += 0.02 * effectiveDt;
      }

      // 3. Move Articulated Freight Trains
      trains.forEach(t => {
        t.progress = (t.progress + t.speed * effectiveDt) % 1.0;
        t.cars.forEach((car, k) => {
          const carU = (t.progress - k * t.carSpacing + 1.0) % 1.0;
          const pt = t.curve.getPointAt(carU);
          const tangent = t.curve.getTangentAt(carU).normalize();

          const up = pt.clone().sub(globeCenter).normalize();
          const right = new THREE.Vector3().crossVectors(up, tangent).normalize();
          const orthoUp = new THREE.Vector3().crossVectors(tangent, right).normalize();

          const m = new THREE.Matrix4().makeBasis(right, orthoUp, tangent);
          car.quaternion.setFromRotationMatrix(m);
          car.position.copy(pt).addScaledVector(orthoUp, 0.05);
        });
      });

      // 4. Move Container Ships & High-Altitude Airplanes
      singleVehicles.forEach(item => {
        item.progress = (item.progress + item.speed * effectiveDt) % 1.0;
        const pt = item.curve.getPointAt(item.progress);
        const tangent = item.curve.getTangentAt(item.progress).normalize();

        const up = pt.clone().sub(globeCenter).normalize();
        const right = new THREE.Vector3().crossVectors(up, tangent).normalize();
        const orthoUp = new THREE.Vector3().crossVectors(tangent, right).normalize();

        const m = new THREE.Matrix4().makeBasis(right, orthoUp, tangent);
        item.mesh.quaternion.setFromRotationMatrix(m);
        item.mesh.position.copy(pt).addScaledVector(orthoUp, item.lift);
      });

      // 5. Subtle Pedestal Neon Ring Shimmer
      const shimmer = Math.sin(clock.getElapsedTime() * 2.5) * 0.12 + 0.95;
      basePointLight.intensity = params.baseLightIntensity * shimmer;

      // 6. PostProcessor Render Pipeline
      if (postProcessor && postProcessor.settings.enabled) {
        postProcessor.render(scene, camera);
      } else {
        renderer.render(scene, camera);
      }
    }

    animate();
  </script>
</body>
</html>
