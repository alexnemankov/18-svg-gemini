<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>625 - Deformed Tangram Grid</title>

  <!-- p5.js v2.3.3 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/p5@2.3.3/lib/p5.min.js"></script>
  <!-- lil-gui Modern Interactive Controls CDN -->
  <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.19.1/dist/lil-gui.umd.min.js"></script>

  <style>
    /* =========================================================================
       CSS RESET & FULL-VIEWPORT CANVAS UX
       ========================================================================= */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #050508;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "JetBrains Mono", monospace;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      transition: background-color 0.4s ease;
    }

    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: padding 0.35s cubic-bezier(0.16, 1, 0.3, 1), background 0.4s ease;
    }

    canvas {
      display: block;
      cursor: grab;
      touch-action: none;
      outline: none;
      transition: box-shadow 0.4s ease, border-radius 0.4s ease;
    }

    body.grabbing canvas,
    canvas.grabbing {
      cursor: grabbing !important;
    }

    /* Framed Mode (4:5 Generative Art Print Presentation) */
    body.mode-framed #canvas-container {
      padding: 40px;
      background: radial-gradient(circle at 50% 50%, #151b28 0%, #04060c 100%);
    }

    body.mode-framed canvas {
      border-radius: 12px;
      box-shadow: 
        0 30px 90px rgba(0, 0, 0, 0.9),
        0 12px 36px rgba(0, 0, 0, 0.7),
        0 0 0 1px rgba(255, 255, 255, 0.12),
        0 0 0 10px rgba(255, 255, 255, 0.02);
    }

    /* =========================================================================
       lil-gui CUSTOM DARK GLASSMORPHISM THEME
       ========================================================================= */
    .lil-gui.root {
      --background-color: rgba(10, 14, 24, 0.9);
      --text-color: #f1f5f9;
      --title-background-color: rgba(18, 25, 42, 0.96);
      --widget-color: rgba(30, 41, 59, 0.85);
      --hover-color: rgba(51, 65, 85, 0.9);
      --focus-color: #38bdf8;
      --number-color: #38bdf8;
      --string-color: #34d399;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "JetBrains Mono", monospace;
      --font-size: 11px;
      --folder-indent: 8px;

      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 1000;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 16px 44px rgba(0, 0, 0, 0.75);
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      transition: opacity 0.3s ease, transform 0.3s ease, pointer-events 0.3s ease;
    }

    .lil-gui .title {
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-size: 11px;
    }

    .lil-gui button {
      font-weight: 600;
      cursor: pointer;
    }

    /* Smooth UI Hiding (Triggered via 'H' key) */
    body.hidden-ui .lil-gui.root {
      opacity: 0 !important;
      transform: translateY(12px) !important;
      pointer-events: none !important;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <script>
    // For the #WCCChallenge «Tangram» (join the discord! https://discord.gg/S8c7qcjw2b)
    //
    // Playing with grid deformations. The sketch generates a grid, then deforms it using a combination of noise and sinusoidal functions.
    // Then, for each cell, it draws a tangram following the deformation.
    // Each piece is filled with a hatching pattern, this is done by using a clipping mask and drawing parallel lines

    /* =========================================================================
       19 PRECONFIGURED COLOR SCHEMES
       ========================================================================= */
    const COLOR_SCHEMES = {

          ["#ff1b6b", "#e03884", "#c1559c", "#a273b5", "#8390ce", "#64ade6", "#45caff"],
          ["#ff9900", "#ffc800", "#ffe000", "#fff700", "#b8f500", "#95e214", "#72ce27"],
          ["#f3f520", "#d9ef1b", "#c0e916", "#a6e311", "#8cdd0c", "#73d707", "#59d102"],
          ["#e9d022", "#e9af1e", "#e88e1a", "#e86e16", "#e74d11", "#e72c0d", "#e60b09"],
        ],
        type: 'original'
      },
      'Monochromatic': {

        colors: ["#0284c7", "#0369a1", "#075985", "#0c4a6e", "#38bdf8", "#7dd3fc", "#bae6fd"],

      },
      'Analogous': {

      },
      'Neutral + accent': {
        name: 'Neutral + accent (important!)',
        colors: ["#f5f5f4", "#d6d3d1", "#a8a29e", "#78716c", "#44403c", "#292524", "#ff6b35"],
        bg: '#141210'
      },
      'Palette 1 (F6AA1C, BC3908, 941B0C, F6AA1C, 220901)': {
        name: 'Flame Amber',
        colors: ["#F6AA1C", "#BC3908", "#941B0C", "#F6AA1C", "#220901", "#FFBA08", "#D00000"],
        bg: '#220901'
      },
      'Palette 2 (63D1CF, 5BC0BE, 4BAD9E, 4BAD9E, 0B132B, 000000)': {
        name: 'Oceanic Obsidian',
        colors: ["#63D1CF", "#5BC0BE", "#4BAD9E", "#4BAD9E", "#0B132B", "#000000", "#1C2541"],
        bg: '#000000'
      },
      'Palette 3 (AA60C8, D69ADE, C9A3C6, CFB5C2, 0D001D, 120A12)': {
        name: 'Cosmic Orchid',
        colors: ["#AA60C8", "#D69ADE", "#C9A3C6", "#CFB5C2", "#0D001D", "#120A12", "#E2AFDE"],
        bg: '#0D001D'
      },
      'Palette 4 (FEF1BE, FFBA00, 008189, 00474D, 061210)': {
        name: 'Golden Oasis',
        colors: ["#FEF1BE", "#FFBA00", "#008189", "#00474D", "#061210", "#00A896", "#FFE680"],
        bg: '#061210'
      },
      'Palette 5 (D4FFB0, 7FFF00, 00B894, 0A3322, 05140A)': {
        name: 'Bioluminescent Mint',
        colors: ["#D4FFB0", "#7FFF00", "#00B894", "#0A3322", "#05140A", "#55EFC4", "#006241"],
        bg: '#05140A'
      },
      'Palette 6 (FFE8CC, FF8C00, C7501A, 3D1050, 0E0618)': {
        name: 'Sunset Twilight',
        colors: ["#FFE8CC", "#FF8C00", "#C7501A", "#3D1050", "#0E0618", "#E85D04", "#6A1A5B"],
        bg: '#0E0618'
      },
      'Palette 7 (E8E0FF, B38FFF, 6A3DE8, 1A1250, 090612)': {
        name: 'Neon Lavender',
        colors: ["#E8E0FF", "#B38FFF", "#6A3DE8", "#1A1250", "#090612", "#8A5BF5", "#5117B8"],
        bg: '#090612'
      },
      'Palette 8 (E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)': {
        name: 'Cyberpunk Neon',
        colors: ["#E0FBFF", "#00F0FF", "#D40078", "#1E0A3D", "#05020F", "#9B00E8", "#FF007F"],
        bg: '#05020F'
      }
    };

    /* =========================================================================
       APPLICATION STATE & CONTROLS CONFIGURATION
       ========================================================================= */
    const params = {
      // 🎨 Color & Theme
      colorScheme: 'Original',
      originalPaletteIndex: 0,
      invertBg: false,
      bgDarkness: 0.18,

      // 🌊 Animation & Dynamics
      speed: 0.8,
      paused: false,
      animateGrid: true,
      animateHatching: true,
      hatchFlowSpeed: 0.6,
      waveSpeed: 0.8,
      shimmerStyle: 'Harmonic Wave', // 'Harmonic Wave', 'Analog Jitter', 'Steady'

      // 📐 Grid & Deformation
      cellSize: 110,
      deformationScaleX: 250,
      deformationScaleY: -220,
      noiseScale: 0.01,
      modeX: 0,
      modeY: 0,

      // ✏️ Tangram & Hatching
      lineSpacing: 5.5,
      strokeWeight: 1.2,
      variation: 2.5,
      doubleHatchChance: 0.45,
      drawOutline: true,
      outlineWidth: 2.5,

      // 🔍 Camera & Canvas UX
      viewZoom: 1.0,
      panX: 0.0,
      panY: 0.0,
      framedMode: false,

      // 🎲 Interaction
      clickToRandomize: true,
      spaceAction: 'Randomize', // 'Randomize' or 'Pause / Resume'
      hideUI: false,

      // 🔘 Actions
      randomize: () => randomizeScene(),
      resetDefaults: () => resetToDefaults(),
      resetView: () => resetCameraView(),
      savePNG: () => saveArtPNG()
    };

    // Global variables matching snippet
    let cols, rows;
    let deformationScaleX = 50;
    let deformationScaleY = -50;
    let colorPalette = [];
    let palettes = COLOR_SCHEMES['Original'].palettes;

    // Random parameters for variation
    let randomValues = [];
    let deformationAngles = [];
    let deformationModes = [];
    let variation;
    let sw, drawOutline;
    let bgColor;

    // Stable cell storage to ensure smooth, flick-free animations
    let cellConfigs = [];
    let animTime = 0;
    let guiInstance = null;
    let canvasElement = null;

    /* =========================================================================
       p5.js LIFECYCLE
       ========================================================================= */
    function setup() {
      let canvasW = windowWidth;
      let canvasH = windowHeight;
      if (params.framedMode) {
        let fit = calculateFramedDimensions();
        canvasW = fit.w;
        canvasH = fit.h;
      }

      const p5Canvas = createCanvas(canvasW, canvasH);
      p5Canvas.parent('canvas-container');
      canvasElement = p5Canvas.elt;

      colorMode(HSL, 360, 100, 100);
      strokeJoin(BEVEL);

      // Initialize parameters & cells
      initializeParameters();
      applyColorScheme();

      // Setup GUI
      initGUI();

      // Setup Pan/Zoom & Interaction Listeners
      setupInteractionListeners();
    }

    function draw() {
      // Compute delta time for frame-rate independent smooth animation
      if (!params.paused && params.speed > 0) {
        let dt = min(deltaTime / 1000, 0.1);
        animTime += dt * params.speed;
      }

      // Draw background
      background(bgColor);

      // Apply Pan & Zoom transformation
      push();
      translate(width / 2 + params.panX, height / 2 + params.panY);
      scale(params.viewZoom);
      translate(-width / 2, -height / 2);

      // Draw deformed grid with tangrams
      drawDeformedGridWithTangrams(animTime);

      pop();
    }

    function windowResized() {
      if (params.framedMode) {
        let fit = calculateFramedDimensions();
        resizeCanvas(fit.w, fit.h);
      } else {
        resizeCanvas(windowWidth, windowHeight);
      }
      updateGridDimensions();
    }

    function calculateFramedDimensions() {
      let pad = 80;
      let maxW = max(windowWidth - pad, 320);
      let maxH = max(windowHeight - pad, 320);
      let aspect = 4 / 5; // 4:5 Generative Art Print Presentation
      let w = maxW;
      let h = w / aspect;
      if (h > maxH) {
        h = maxH;
        w = h * aspect;
      }
      return { w: round(w), h: round(h) };
    }

    /* =========================================================================
       COLOR SCHEME MANAGER
       ========================================================================= */
    function applyColorScheme() {
      const scheme = COLOR_SCHEMES[params.colorScheme] || COLOR_SCHEMES['Original'];

      if (scheme.type === 'original') {
        let palList = scheme.palettes;
        let selectedPal = palList[params.originalPaletteIndex % palList.length];
        colorPalette = selectedPal.map((c) => color(c));

        // Original background algorithm
        let _bgColor = random(colorPalette);
        let h = hue(_bgColor);
        let s = saturation(_bgColor);
        let l = lightness(_bgColor) * (params.invertBg ? 1.8 : random(0.1, 0.25));
        bgColor = color(h, s, l);
      } else {
        colorPalette = scheme.colors.map((c) => color(c));
        let bgHex = scheme.bg || '#050508';
        if (params.invertBg) {
          bgColor = color(255);
        } else {
          let c = color(bgHex);
          let h = hue(c);
          let s = saturation(c);
          let l = lightness(c) * (params.bgDarkness / 0.18);
          bgColor = color(h, s, l);
        }
      }

      // Update body background to complement scene
      let bodyHex = '#030508';
      try {
        let h = hue(bgColor);
        let s = saturation(bgColor) * 0.5;
        let l = max(lightness(bgColor) * 0.6, 3);
        let darkC = color(h, s, l);
        bodyHex = '#' + [red(darkC), green(darkC), blue(darkC)].map(v => Math.round(v).toString(16).padStart(2, '0')).join('');
      } catch(e) {}
      document.body.style.backgroundColor = bodyHex;
    }

    /* =========================================================================
       CORE GENERATIVE PROCEDURAL ENGINE (Preserving Author Algorithms)
       ========================================================================= */
    function initializeParameters() {
      // Grid deformation scales
      deformationScaleX = params.deformationScaleX;
      deformationScaleY = params.deformationScaleY;

      // Calculate cols and rows based on canvas size
      updateGridDimensions();

      // Random values for variation (preserved from snippet)
      randomValues = new Array(6).fill(0).map(() => random());

      // Deformation angles (limit to PI or TAU for more structured variation)
      let angles = [PI, TAU];
      deformationAngles = [];
      for (let i = 0; i < 4; i++) {
        deformationAngles.push(random(angles));
      }

      // Deformation modes (0, 1, or 2 - different formula variations)
      deformationModes = [params.modeX, params.modeY];
      variation = params.variation;
      drawOutline = params.drawOutline;
      sw = params.outlineWidth;

      // Build stable cell structures for consistent animation
      rebuildCellConfigs();
    }

    function updateGridDimensions() {
      let cellSize = params.cellSize;
      cols = max(3, round(width / cellSize));
      rows = max(3, round(height / cellSize));
      rebuildCellConfigs();
    }

    function rebuildCellConfigs() {
      cellConfigs = [];
      for (let i = 0; i < cols; i++) {
        cellConfigs[i] = [];
        for (let j = 0; j < rows; j++) {
          let rotation = floor(random(4));
          let order = [0, 1, 2, 3, 4, 5, 6];
          shuffle(order, true);

          let hatchData = [];
          for (let p = 0; p < 7; p++) {
            hatchData.push({
              angle: random(-PI, PI),
              spacing: random(params.lineSpacing * 0.8, params.lineSpacing * 1.4),
              weight: random(params.strokeWeight * 0.8, params.strokeWeight * 1.3),
              hasDouble: random() < params.doubleHatchChance,
              doubleAngle: random(-PI, PI),
              seed: random(1000)
            });
          }

          cellConfigs[i][j] = {
            rotation,
            order,
            hatchData
          };
        }
      }
    }

    function drawDeformedGridWithTangrams(t = 0) {
      // Calculate deformed point positions with animation time
      let deformedPoints = calculateDeformedPoints(t);

      // Draw tangrams in each cell
      for (let i = 0; i < cols; i++) {
        for (let j = 0; j < rows; j++) {
          if (!deformedPoints[i] || !deformedPoints[i + 1]) continue;
          if (!deformedPoints[i][j] || !deformedPoints[i + 1][j + 1]) continue;

          let corners = [
            deformedPoints[i][j],
            deformedPoints[i + 1][j],
            deformedPoints[i + 1][j + 1],
            deformedPoints[i][j + 1],
          ];

          let cellCfg = cellConfigs[i] && cellConfigs[i][j] ? cellConfigs[i][j] : {
            rotation: 0,
            order: [0, 1, 2, 3, 4, 5, 6],
            hatchData: new Array(7).fill({ angle: 0, spacing: params.lineSpacing, weight: params.strokeWeight, hasDouble: false, doubleAngle: 0, seed: 0 })
          };

          let rotatedCorners = rotateCorners(corners, cellCfg.rotation);

          drawTangramInCell(
            rotatedCorners[0],
            rotatedCorners[1],
            rotatedCorners[2],
            rotatedCorners[3],
            cellCfg,
            t
          );
        }
      }
    }

    function calculateDeformedPoints(animT = 0) {
      let points = [];
      let marginX = width * 0.25;
      let marginY = height * 0.25;
      let timePhase = params.animateGrid ? animT * params.waveSpeed : 0;

      for (let i = 0; i <= cols; i++) {
        points[i] = [];
        for (let j = 0; j <= rows; j++) {
          let cellNoise = noise(
            i * params.noiseScale + timePhase * 0.05,
            j * params.noiseScale + timePhase * 0.04
          );

          // Base grid position with margin offset
          let x = map(i, 0, cols, -marginX, width + marginX);
          let y = map(j, 0, rows, -marginY, height + marginY);

          // Conditional index swapping for more variation
          let ii = cellNoise < 0.5 ? i : j;
          let jj = cellNoise < 0.5 ? i : j;

          // Apply deformation with time phase
          let deformX = calculateXDeformation(i, j, ii, jj, cellNoise, timePhase);
          let deformY = calculateYDeformation(i, j, ii, jj, cellNoise, timePhase);

          points[i][j] = createVector(x + deformX, y + deformY);
        }
      }

      return points;
    }

    function calculateXDeformation(i, j, ii, jj, noiseValue, timePhase = 0) {
      let deformX = 0;

      if (i !== 0 && i !== cols) {
        // Determine which indices to use based on random values
        let i1, j1;
        if (randomValues[0] < 0.5) {
          i1 = noiseValue < 0.5 ? i : ii;
          j1 = noiseValue < 0.5 ? j : jj;
        } else {
          i1 = randomValues[2] < 0.5 ? i : ii;
          j1 = randomValues[3] < 0.5 ? j : jj;
        }

        let p = timePhase * 0.5;

        // Apply different deformation formulas based on mode
        switch (params.modeX) {
          case 0:
            deformX =
              params.deformationScaleX *
              pow(noiseValue, 0.001) *
              (sin((deformationAngles[0] * j1) / rows + p) *
                cos(((deformationAngles[1] * i1) / cols) * sin(noiseValue) + p * 0.7));
            break;
          case 1:
            deformX =
              params.deformationScaleX *
              (sin((deformationAngles[0] * j1) / rows + p) *
                cos((deformationAngles[1] * i1) / cols + p * 0.8));
            break;
          case 2:
            deformX =
              params.deformationScaleX *
              sin((TWO_PI * j1) / rows + p) *
              cos((TWO_PI * i1) / cols + p * 0.9) *
              sin(1 + p * 0.3);
            break;
        }
      }

      return deformX;
    }

    function calculateYDeformation(i, j, ii, jj, noiseValue, timePhase = 0) {
      let deformY = 0;

      if (j !== 0 && j !== rows) {
        // Determine which indices to use based on random values
        let i1, j1;
        if (randomValues[1] < 0.5) {
          i1 = noiseValue < 0.5 ? i : ii;
          j1 = noiseValue < 0.5 ? j : jj;
        } else {
          i1 = randomValues[4] < 0.5 ? i : ii;
          j1 = randomValues[5] < 0.5 ? j : jj;
        }

        let p = timePhase * 0.5;

        // Apply different deformation formulas based on mode
        switch (params.modeY) {
          case 0:
            deformY =
              params.deformationScaleY *
              pow(1 - noiseValue, 0.001) *
              (cos((deformationAngles[2] * j1) / rows + p * 0.8) *
                sin((deformationAngles[3] * i1) / cols + p * 0.6));
            break;
          case 1:
            deformY =
              params.deformationScaleY *
              (cos((deformationAngles[2] * j1) / rows + p * 0.7) *
                sin((deformationAngles[3] * i1) / cols + p * 0.85));
            break;
          case 2:
            deformY =
              params.deformationScaleY *
              cos((TWO_PI * j1) / rows + p * 0.8) *
              sin((TWO_PI * i1) / cols + p * 0.6) *
              cos(1 + p * 0.3);
            break;
        }
      }

      return deformY;
    }

    function rotateCorners(corners, rotation) {
      // Rotate the array of corners: 0=ABCD, 1=BCDA, 2=CDAB, 3=DABC
      let rotated = [];
      for (let i = 0; i < 4; i++) {
        rotated.push(corners[(i + rotation) % 4]);
      }
      return rotated;
    }

    function drawTangramInCell(A, B, C, D, cellCfg, t = 0) {
      const { pieces } = tangramFromQuad(A, B, C, D);

      let pieceList = [
        pieces.big1,
        pieces.big2,
        pieces.medium,
        pieces.triA,
        pieces.triC,
        pieces.square,
        pieces.para,
      ];

      let order = cellCfg.order;

      for (let idx = 0; idx < order.length; idx++) {
        let pieceIdx = order[idx];
        let poly = pieceList[pieceIdx];
        let hInfo = cellCfg.hatchData[idx];

        stroke(colorPalette[idx % colorPalette.length]);
        hatchPoly(poly, hInfo.spacing, hInfo.angle, hInfo.weight, t, hInfo.seed);

        if (hInfo.hasDouble) {
          hatchPoly(poly, hInfo.spacing, hInfo.doubleAngle, hInfo.weight, t, hInfo.seed + 100);
        }
      }
    }

    function drawPoly(poly) {
      beginShape();
      for (const p of poly) {
        vertex(p.x, p.y);
      }
      endShape(CLOSE);
    }

    /**
     * Hatch-fill a polygon with parallel lines.
     * @param {Array} poly - Array of {x, y} points
     * @param {number} spacing - distance in px between lines
     * @param {number} angle - line angle in radians
     * @param {number} weight - strokeWeight for lines
     * @param {number} t - animation time
     * @param {number} pieceSeed - deterministic seed for stable lines
     */
    function hatchPoly(poly, spacing, angle, weight, t = 0, pieceSeed = 0) {
      if (spacing <= 0 || poly.length < 3) return;

      // Get bounding box
      let minX = Infinity, minY = Infinity;
      let maxX = -Infinity, maxY = -Infinity;
      for (const p of poly) {
        minX = min(minX, p.x);
        minY = min(minY, p.y);
        maxX = max(maxX, p.x);
        maxY = max(maxY, p.y);
      }

      const w = maxX - minX;
      const h = maxY - minY;
      const cx = minX + w / 2;
      const cy = minY + h / 2;

      push();

      // Create clipping mask with the polygon shape
      beginClip();
      beginShape();
      for (const p of poly) {
        vertex(p.x, p.y);
      }
      endShape(CLOSE);
      endClip();

      // Draw hatching lines
      translate(cx, cy);
      rotate(angle);

      const L = Math.hypot(w, h) * 1.15;
      const half = L / 2;

      strokeWeight(weight || params.strokeWeight);

      // Smooth kinetic flow offset
      let flowOffset = params.animateHatching ? (t * params.hatchFlowSpeed * 15) % spacing : 0;

      let sp = spacing;
      for (let tPos = -half - spacing; tPos <= half + spacing; tPos += sp) {
        let lineY = tPos + flowOffset;

        let jitter = 0;
        if (params.variation > 0) {
          if (params.shimmerStyle === 'Harmonic Wave') {
            jitter = sin(pieceSeed + tPos * 0.15 + t * 2.2) * params.variation;
          } else if (params.shimmerStyle === 'Analog Jitter') {
            jitter = random(-params.variation, params.variation);
          }
        }

        line(-half, lineY + jitter, half, lineY + jitter);
      }

      pop();

      if (params.drawOutline) {
        push();
        stroke(bgColor);
        strokeWeight(params.outlineWidth);
        noFill();
        beginShape();
        for (const p of poly) {
          vertex(p.x, p.y);
        }
        endShape(CLOSE);
        pop();
      }
    }

    // ===== Tangram Geometry =====

    const V = (x, y) => ({ x, y });
    const add = (a, b) => V(a.x + b.x, a.y + b.y);
    const sub = (a, b) => V(a.x - b.x, a.y - b.y);
    const mul = (a, s) => V(a.x * s, a.y * s);
    const len = (a) => Math.hypot(a.x, a.y);

    function midpoint(P, Q) {
      return V((P.x + Q.x) / 2, (P.y + Q.y) / 2);
    }

    function onSegmentAtDistance(P0, P1, d) {
      const u = sub(P1, P0);
      const L = len(u);
      if (L < 1e-9) return V(P0.x, P0.y);
      const t = Math.min(1, Math.max(0, d / L));
      return add(P0, mul(u, t));
    }

    function lineIntersection(P1, P2, P3, P4) {
      const x1 = P1.x,
        y1 = P1.y,
        x2 = P2.x,
        y2 = P2.y;
      const x3 = P3.x,
        y3 = P3.y,
        x4 = P4.x,
        y4 = P4.y;
      const den = (x1 - x2) * (y3 - y4) - (y1 - y2) * (x3 - x4);
      if (Math.abs(den) < 1e-9) return midpoint(P1, P2);
      const px =
        ((x1 * y2 - y1 * x2) * (x3 - x4) - (x1 - x2) * (x3 * y4 - y3 * x4)) / den;
      const py =
        ((x1 * y2 - y1 * x2) * (y3 - y4) - (y1 - y2) * (x3 * y4 - y3 * x4)) / den;
      return V(px, py);
    }

    function tangramFromQuad(A, B, C, D) {
      const M = lineIntersection(A, C, B, D);
      const X = midpoint(C, D);
      const Y = midpoint(D, A);
      const Z = midpoint(X, Y);
      const h = len(sub(X, Y)) / 2;

      const A2 = onSegmentAtDistance(A, M, h);
      const C2 = onSegmentAtDistance(C, M, h);

      const big1 = [A, B, M];
      const big2 = [B, C, M];
      const medium = [X, D, Y];

      const triA = [A, Y, A2];
      const triC = [M, Z, C2];

      const square = [A2, M, Z, Y];
      const para = [Z, C2, C, X];

      return {
        pieces: { big1, big2, medium, triA, triC, square, para },
      };
    }

    /* =========================================================================
       PROCEDURAL RANDOMIZATION & ACTIONS
       ========================================================================= */
    function randomizeScene() {
      // Pick random scheme from 19 schemes
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      params.colorScheme = random(schemeKeys);
      if (params.colorScheme === 'Original') {
        params.originalPaletteIndex = floor(random(palettes.length));
      }

      // Re-roll geometric parameters
      params.deformationScaleX = floor(random(-500, 500));
      params.deformationScaleY = floor(random(-500, 500));
      params.cellSize = round(random(70, 180));
      params.modeX = floor(random(3));
      params.modeY = floor(random(3));
      params.variation = round(random(0.5, 6.0) * 10) / 10;
      params.lineSpacing = round(random(3.5, 9.0) * 10) / 10;
      params.strokeWeight = round(random(0.8, 2.4) * 10) / 10;
      params.drawOutline = random() < 0.6;
      params.outlineWidth = round(random(1.5, 5.0) * 10) / 10;
      params.doubleHatchChance = round(random(0.2, 0.7) * 100) / 100;

      // Re-initialize engine
      initializeParameters();
      applyColorScheme();

      // Refresh GUI controls
      if (guiInstance) {
        guiInstance.controllersRecursive().forEach(c => c.updateDisplay());
      }
    }

    function resetToDefaults() {
      params.colorScheme = 'Original';
      params.originalPaletteIndex = 0;
      params.invertBg = false;
      params.bgDarkness = 0.18;
      params.speed = 0.8;
      params.paused = false;
      params.animateGrid = true;
      params.animateHatching = true;
      params.hatchFlowSpeed = 0.6;
      params.waveSpeed = 0.8;
      params.shimmerStyle = 'Harmonic Wave';
      params.cellSize = 110;
      params.deformationScaleX = 250;
      params.deformationScaleY = -220;
      params.noiseScale = 0.01;
      params.modeX = 0;
      params.modeY = 0;
      params.lineSpacing = 5.5;
      params.strokeWeight = 1.2;
      params.variation = 2.5;
      params.doubleHatchChance = 0.45;
      params.drawOutline = true;
      params.outlineWidth = 2.5;
      resetCameraView();

      initializeParameters();
      applyColorScheme();

      if (guiInstance) {
        guiInstance.controllersRecursive().forEach(c => c.updateDisplay());
      }
    }

    function resetCameraView() {
      params.viewZoom = 1.0;
      params.panX = 0.0;
      params.panY = 0.0;
      if (guiInstance) {
        guiInstance.controllersRecursive().forEach(c => {
          if (c.property === 'viewZoom' || c.property === 'panX' || c.property === 'panY') c.updateDisplay();
        });
      }
    }

    function saveArtPNG() {
      saveCanvas('deformed_tangram_' + Date.now(), 'png');
    }

    /* =========================================================================
       PAN, ZOOM & GESTURE INTERACTION
       ========================================================================= */
    function setupInteractionListeners() {
      let isDragging = false;
      let startX = 0, startY = 0;
      let initialPanX = 0, initialPanY = 0;
      let movedDistance = 0;

      // Wheel Zoom Centered on Pointer
      window.addEventListener('wheel', (e) => {
        if (e.target.closest('.lil-gui')) return;
        e.preventDefault();

        const zoomFactor = e.deltaY < 0 ? 1.09 : 0.91;
        const newZoom = Math.min(Math.max(params.viewZoom * zoomFactor, 0.15), 7.0);

        const mouseX = e.clientX;
        const mouseY = e.clientY;
        const rect = canvasElement.getBoundingClientRect();
        const cx = mouseX - rect.left;
        const cy = mouseY - rect.top;

        const dx = cx - (width / 2 + params.panX);
        const dy = cy - (height / 2 + params.panY);

        params.panX -= dx * (newZoom / params.viewZoom - 1);
        params.panY -= dy * (newZoom / params.viewZoom - 1);
        params.viewZoom = newZoom;

        if (guiInstance) {
          guiInstance.controllersRecursive().forEach(c => {
            if (c.property === 'viewZoom' || c.property === 'panX' || c.property === 'panY') c.updateDisplay();
          });
        }
      }, { passive: false });

      // Pointer Drag for Panning & Distinction from Click
      window.addEventListener('pointerdown', (e) => {
        if (e.target.closest('.lil-gui')) return;
        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;
        initialPanX = params.panX;
        initialPanY = params.panY;
        movedDistance = 0;
        document.body.classList.add('grabbing');
      });

      window.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        movedDistance = Math.hypot(dx, dy);

        params.panX = initialPanX + dx;
        params.panY = initialPanY + dy;

        if (guiInstance) {
          guiInstance.controllersRecursive().forEach(c => {
            if (c.property === 'panX' || c.property === 'panY') c.updateDisplay();
          });
        }
      });

      window.addEventListener('pointerup', (e) => {
        if (!isDragging) return;
        isDragging = false;
        document.body.classList.remove('grabbing');

        // Click detection: if moved less than 6px and click-to-randomize is enabled
        if (movedDistance < 6) {
          if (params.clickToRandomize) {
            randomizeScene();
          }
        }
      });

      // Keyboard Shortcuts
      window.addEventListener('keydown', (e) => {
        if (e.key === 'h' || e.key === 'H') {
          params.hideUI = !params.hideUI;
          document.body.classList.toggle('hidden-ui', params.hideUI);
        } else if (e.code === 'Space') {
          e.preventDefault();
          if (params.spaceAction === 'Randomize') {
            randomizeScene();
          } else {
            params.paused = !params.paused;
            if (guiInstance) {
              guiInstance.controllersRecursive().forEach(c => {
                if (c.property === 'paused') c.updateDisplay();
              });
            }
          }
        } else if (e.key === 'r' || e.key === 'R') {
          randomizeScene();
        } else if (e.key === 's' || e.key === 'S') {
          saveArtPNG();
        } else if (e.key === 'f' || e.key === 'F') {
          params.framedMode = !params.framedMode;
          document.body.classList.toggle('mode-framed', params.framedMode);
          windowResized();
          if (guiInstance) {
            guiInstance.controllersRecursive().forEach(c => {
              if (c.property === 'framedMode') c.updateDisplay();
            });
          }
        }
      });
    }

    /* =========================================================================
       lil-gui CONTROLS INITIALIZATION
       ========================================================================= */
    function initGUI() {
      if (typeof lil === 'undefined' || !lil.GUI) return;

      const gui = new lil.GUI({ title: 'Tangram Grid Deform' });
      guiInstance = gui;

      // 🎨 Color & Palettes Folder
      const fColor = gui.addFolder('🎨 Color & Schemes');
      fColor.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Palette Scheme').onChange(() => {
        applyColorScheme();
      });
      fColor.add(params, 'originalPaletteIndex', 0, 12, 1).name('Original Pal ID').onChange(() => {
        if (params.colorScheme === 'Original') applyColorScheme();
      });
      fColor.add(params, 'invertBg').name('Invert / Light BG').onChange(() => {
        applyColorScheme();
      });
      fColor.add(params, 'bgDarkness', 0.05, 0.5, 0.01).name('BG Darkness').onChange(() => {
        applyColorScheme();
      });

      // 🌊 Animation & Dynamics Folder
      const fAnim = gui.addFolder('🌊 Animation & Speed');
      fAnim.add(params, 'speed', 0.0, 3.0, 0.05).name('Anim Speed');
      fAnim.add(params, 'paused').name('Pause Motion');
      fAnim.add(params, 'animateGrid').name('Animate Grid Wave');
      fAnim.add(params, 'animateHatching').name('Flow Hatching Lines');
      fAnim.add(params, 'waveSpeed', 0.1, 2.5, 0.05).name('Wave Rate');
      fAnim.add(params, 'hatchFlowSpeed', 0.1, 2.0, 0.05).name('Hatch Flow Rate');
      fAnim.add(params, 'shimmerStyle', ['Harmonic Wave', 'Analog Jitter', 'Steady']).name('Line Dynamics');

      // 📐 Grid & Deformation Folder
      const fGrid = gui.addFolder('📐 Grid & Deformation');
      fGrid.add(params, 'cellSize', 50, 240, 5).name('Cell Size').onChange(() => {
        updateGridDimensions();
      });
      fGrid.add(params, 'deformationScaleX', -600, 600, 10).name('Deform Scale X').onChange(() => {
        deformationScaleX = params.deformationScaleX;
      });
      fGrid.add(params, 'deformationScaleY', -600, 600, 10).name('Deform Scale Y').onChange(() => {
        deformationScaleY = params.deformationScaleY;
      });
      fGrid.add(params, 'modeX', [0, 1, 2]).name('Formula Mode X');
      fGrid.add(params, 'modeY', [0, 1, 2]).name('Formula Mode Y');
      fGrid.add(params, 'noiseScale', 0.002, 0.03, 0.001).name('Noise Scale');

      // ✏️ Tangram & Hatching Folder
      const fHatch = gui.addFolder('✏️ Tangram & Hatching');
      fHatch.add(params, 'lineSpacing', 2.0, 16.0, 0.5).name('Line Spacing').onChange(() => {
        rebuildCellConfigs();
      });
      fHatch.add(params, 'strokeWeight', 0.5, 4.0, 0.1).name('Stroke Weight').onChange(() => {
        rebuildCellConfigs();
      });
      fHatch.add(params, 'variation', 0.0, 12.0, 0.2).name('Wobble / Variation');
      fHatch.add(params, 'doubleHatchChance', 0.0, 1.0, 0.05).name('Cross-Hatch %').onChange(() => {
        rebuildCellConfigs();
      });
      fHatch.add(params, 'drawOutline').name('Draw Outline');
      fHatch.add(params, 'outlineWidth', 0.5, 8.0, 0.2).name('Outline Width');

      // 🔍 Camera & Canvas Folder
      const fCam = gui.addFolder('🔍 Camera & Canvas');
      fCam.add(params, 'viewZoom', 0.2, 5.0, 0.05).name('Zoom').listen();
      fCam.add(params, 'panX', -1500, 1500, 1).name('Pan X').listen();
      fCam.add(params, 'panY', -1500, 1500, 1).name('Pan Y').listen();
      fCam.add(params, 'framedMode').name('Framed (4:5)').onChange((val) => {
        document.body.classList.toggle('mode-framed', val);
        windowResized();
      });
      fCam.add(params, 'resetView').name('Reset View / Pan');

      // 🎲 Interaction & Actions Folder
      const fActions = gui.addFolder('🎲 Interaction & Actions');
      fActions.add(params, 'clickToRandomize').name('Click to Randomize');
      fActions.add(params, 'spaceAction', ['Randomize', 'Pause / Resume']).name('Spacebar Action');
      fActions.add(params, 'randomize').name('Randomize Variation (R)');
      fActions.add(params, 'resetDefaults').name('Reset Defaults');
      fActions.add(params, 'savePNG').name('Save PNG Art (S)');

      // Open primary folders by default
      fColor.open();
      fAnim.open();
    }
  </script>
