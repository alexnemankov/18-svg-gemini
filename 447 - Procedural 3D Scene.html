        // --- GLOBAL PARAMETERS (FAITHFUL TO ORIGINAL CODE & ENHANCED) ---
        const PARAMS = {
            greenScreen: false,
            colorScheme: "Original",
            colors: {
                background: "#e3f6ff",

                accentColor: "#ffffff",
                wallColor: "#ffffff"

            animation: {

                dragMode: "Rotate" // "Rotate" (left click rotate, right click pan) or "Pan" (left click pan)

            geometry: {
                type: "Torus",
                scale: 1.0

            material: {

                rough: 0.4,

                thick: 0.58,

                hemiIntensity: 2.0,

                dpr: Math.min(window.devicePixelRatio || 1, 2.0),

                clickToRandomize: true

        // --- SYSTEM GLOBALS ---
        let canvas = document.getElementById("webgl-canvas");
        let renderer, scene, camera, controls, gui;
        let s_group, b_group, t_group;
        let c_mes, b_mes, w_mes;
        let a_light, p_light;
        let glassMaterial, wallMaterial, ballMaterial;
        let causticWallTexture, causticRefractTexture;

        const clock = new THREE.Clock();
        const baseTarget = new THREE.Vector3(0, 0, 0);
        const animTargetOffset = new THREE.Vector3(0, 0, 0);

        // --- PROCEDURAL CAUSTIC FALLBACK TEXTURE (INSTANT DISPLAY BEFORE NETWORK LOADS) ---
        function createProceduralCausticCanvas(w = 512, h = 512) {
            const c = document.createElement("canvas");
            c.width = w;
            c.height = h;
            const ctx = c.getContext("2d");
            ctx.fillStyle = "#338899";
            ctx.fillRect(0, 0, w, h);

            const imgData = ctx.getImageData(0, 0, w, h);
            const data = imgData.data;
            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    const idx = (y * w + x) * 4;
                    const fx = (x / w) * 22;
                    const fy = (y / h) * 22;
                    let v = Math.sin(fx + Math.cos(fy * 0.8 + 1.2)) +
                            Math.cos(fy + Math.sin(fx * 0.9 + 2.1)) +
                            Math.sin((fx + fy) * 0.7) +
                            Math.cos((fx - fy) * 0.6 + 0.5);
                    v = Math.pow(Math.max(0, (v + 4) / 8), 3.5);

                    data[idx] = Math.min(255, Math.floor(55 + v * 200));
                    data[idx + 1] = Math.min(255, Math.floor(135 + v * 120));
                    data[idx + 2] = Math.min(255, Math.floor(155 + v * 100));
                    data[idx + 3] = 255;
                }
            }
            ctx.putImageData(imgData, 0, 0);
            return c;
        }

        // --- TEXTURE LOADER WITH CAUSTIC POOL IMAGE ---
        function initTextures() {
            const fallbackCanvas = createProceduralCausticCanvas();
            const fallbackTex = new THREE.CanvasTexture(fallbackCanvas);
            fallbackTex.wrapS = fallbackTex.wrapT = THREE.MirroredRepeatWrapping;

            causticWallTexture = fallbackTex.clone();
            causticWallTexture.repeat.set(1, 1);

            causticRefractTexture = fallbackTex.clone();
            causticRefractTexture.mapping = THREE.EquirectangularRefractionMapping;
            causticRefractTexture.repeat.set(2, 2);

            // Load high-resolution authentic Unsplash caustic image
            const loader = new THREE.TextureLoader();
            loader.setCrossOrigin("anonymous");

            loader.load(TEMPLATE_URL, (tex) => {
                // Configure Refraction map for Torus glass
                causticRefractTexture.image = tex.image;
                causticRefractTexture.mapping = THREE.EquirectangularRefractionMapping;
                if (renderer) causticRefractTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();
                causticRefractTexture.magFilter = THREE.NearestFilter;
                causticRefractTexture.minFilter = THREE.LinearMipmapLinearFilter;
                causticRefractTexture.wrapS = causticRefractTexture.wrapT = THREE.MirroredRepeatWrapping;
                causticRefractTexture.repeat.set(2, 2);
                causticRefractTexture.needsUpdate = true;

                // Configure Wall backdrop map
                causticWallTexture.image = tex.image;
                if (renderer) causticWallTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();
                causticWallTexture.magFilter = THREE.LinearFilter;
                causticWallTexture.minFilter = THREE.LinearMipmapLinearFilter;
                causticWallTexture.wrapS = causticWallTexture.wrapT = THREE.MirroredRepeatWrapping;
                causticWallTexture.repeat.set(1, 1);
                causticWallTexture.needsUpdate = true;

                if (glassMaterial) glassMaterial.needsUpdate = true;
                if (wallMaterial) wallMaterial.needsUpdate = true;
            });
        }

        // --- APPLY COLOR SCHEME ---
        function applyColorScheme(name) {
            const scheme = COLOR_SCHEMES[name];
            if (!scheme) return;
            PARAMS.colorScheme = name;
            PARAMS.colors.background = scheme.background;
            PARAMS.colors.objectColor = scheme.objectColor;
            PARAMS.colors.accentColor = scheme.accentColor;
            PARAMS.colors.wallColor = scheme.wallColor;

            PARAMS.lighting.hemiSky = scheme.skyColor;
            PARAMS.lighting.hemiGround = scheme.groundColor;
            PARAMS.lighting.pointColor = scheme.pointLightColor;

            renderMaterial();
            updateLights();
        }

        // --- CREATE GEOMETRY ---
        function getGeometry(type) {
            switch (type) {
                case "Torus":
                    // Exact original Torus dimensions
                    return new THREE.TorusGeometry(1, 0.4, 32, 100);
                case "Torus Knot":
                    return new THREE.TorusKnotGeometry(0.8, 0.3, 132, 16, 4, 3);
                case "Icosahedron":
                    return new THREE.IcosahedronGeometry(1.0, 4);
                case "Sphere":
                    return new THREE.SphereGeometry(1.0, 64, 48);
                case "Dodecahedron":
                    return new THREE.DodecahedronGeometry(1.0, 2);
                default:
                    return new THREE.TorusGeometry(1, 0.4, 32, 100);
            }
        }

        function updateGeometry() {
            if (!c_mes) return;
            c_mes.geometry.dispose();
            c_mes.geometry = getGeometry(PARAMS.geometry.type);
            c_mes.scale.setScalar(PARAMS.geometry.scale);
        }

        // --- SCENE SETUP (EXACT HIERARCHY AS ORIGINAL) ---
        function initScene() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 0, 5);

            s_group = new THREE.Group();
            b_group = new THREE.Group();
            t_group = new THREE.Group();

            initTextures();

            // Wall Material with caustic water texture
            wallMaterial = new THREE.MeshBasicMaterial({
                map: causticWallTexture,
                color: new THREE.Color(PARAMS.colors.wallColor)
            });

            // Glass Physical Material (faithful to original setup)
            glassMaterial = new THREE.MeshPhysicalMaterial({
                aoMap: causticRefractTexture,
                normalMap: causticRefractTexture,
                envMap: causticRefractTexture,
                metalnessMap: causticRefractTexture,
                roughnessMap: causticRefractTexture,
                clearcoatMap: causticRefractTexture,
                displacementMap: causticRefractTexture,
                displacementScale: 0.0,
                color: new THREE.Color(PARAMS.colors.objectColor),
                emissive: 0x000000,
                metalness: PARAMS.material.metal,
                roughness: PARAMS.material.rough,
                transmission: Math.min(1.0, PARAMS.material.glass),
                thickness: PARAMS.material.thick,
                reflectivity: PARAMS.material.reflex,
                clearcoat: PARAMS.material.clearcoat * 5,
                clearcoatRoughness: PARAMS.material.coatrough,
                ior: PARAMS.material.ior,
                envMapIntensity: PARAMS.material.envInt,
                normalScale: new THREE.Vector2(PARAMS.material.normal, PARAMS.material.normal),
                aoMapIntensity: PARAMS.material.ao,
                sheen: PARAMS.material.sheen,
                dithering: PARAMS.material.dither,
                flatShading: false,
                combine: THREE.AddOperation
            });

            // Orbiting accent ball
            ballMaterial = new THREE.MeshBasicMaterial({
                color: new THREE.Color(PARAMS.colors.accentColor)
            });

            // Wall Plane: 4x4 at z = -3 (the square pool backdrop in the screenshot)
            const w_geo = new THREE.PlaneGeometry(4, 4);
            w_mes = new THREE.Mesh(w_geo, wallMaterial);
            w_mes.position.z = -3;
            w_mes.name = "wallpaper";

            // Orbiting Ball: IcosahedronGeometry(0.3, 2)
            const b_geo = new THREE.IcosahedronGeometry(0.3, 2);
            b_mes = new THREE.Mesh(b_geo, ballMaterial);

            // Primary Torus: TorusGeometry(1, 0.4, 32, 100), rotated 90 deg on Z facing camera
            c_mes = new THREE.Mesh(getGeometry(PARAMS.geometry.type), glassMaterial);
            c_mes.rotation.z = (90 * Math.PI) / 180;
            c_mes.name = "object3D";

            // Lights
            a_light = new THREE.HemisphereLight(
                PARAMS.lighting.hemiSky,
                PARAMS.lighting.hemiGround,
                PARAMS.lighting.hemiIntensity * PARAMS.lighting.sceneIntensity
            );

            p_light = new THREE.PointLight(
                PARAMS.lighting.pointColor,
                PARAMS.lighting.pointIntensity * PARAMS.lighting.sceneIntensity,
                30
            );
            p_light.position.set(PARAMS.lighting.pointX, PARAMS.lighting.pointY, PARAMS.lighting.pointZ);

            // Assemble matching original hierarchy:
            // s_group.add(createWall(), t_group);
            // b_group.add(createBall());
            // t_group.add(createElements(), b_group);
            b_group.add(b_mes);
            t_group.add(c_mes);
            t_group.add(b_group);

            s_group.add(w_mes);
            s_group.add(t_group);

            scene.add(s_group);
            scene.add(a_light);
            scene.add(p_light);

            applyColorScheme(PARAMS.colorScheme);
        }

        // --- RENDERER SETUP ---
        function initRenderer(antialias = true) {
            renderer = new THREE.WebGLRenderer({
                canvas: canvas,
                antialias: antialias,
                alpha: false,
                powerPreference: "high-performance"
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(PARAMS.rendering.dpr);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            if (THREE.SRGBColorSpace) {
                renderer.outputColorSpace = THREE.SRGBColorSpace;
            } else {
                renderer.outputEncoding = THREE.sRGBEncoding;
            }

            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = PARAMS.lighting.exposure;
        }

        // --- ORBIT CONTROLS SETUP ---
        function initControls() {
            controls = new OrbitControls(camera, canvas);
            controls.target.copy(baseTarget);
            controls.rotateSpeed = 0.5;
            controls.zoomSpeed = 1.0;
            controls.panSpeed = 0.8;
            controls.enableZoom = true; // Zoom with wheel enabled
            controls.enablePan = true;  // Drag object across screen enabled
            controls.screenSpacePanning = true;
            controls.enableDamping = true;
            controls.dampingFactor = 0.08;

            applyControlMode();
        }

        function applyControlMode() {
            if (!controls) return;
            if (PARAMS.controls.dragMode === "Pan") {
                controls.mouseButtons = {
                    LEFT: THREE.MOUSE.PAN,
                    MIDDLE: THREE.MOUSE.DOLLY,
                    RIGHT: THREE.MOUSE.ROTATE
                };
            } else {
                controls.mouseButtons = {
                    LEFT: THREE.MOUSE.ROTATE,
                    MIDDLE: THREE.MOUSE.DOLLY,
                    RIGHT: THREE.MOUSE.PAN
                };
            }
        }

        // --- RECREATE RENDERER FOR ANTIALIASING TOGGLE ---
        function setAntialias(val) {
            PARAMS.rendering.antialias = val;
            const oldCanvas = canvas;
            const newCanvas = oldCanvas.cloneNode(false);
            oldCanvas.parentNode.replaceChild(newCanvas, oldCanvas);
            canvas = newCanvas;

            renderer.dispose();
            initRenderer(val);

            controls.dispose();
            initControls();
            bindCanvasEvents();
        }

        // --- UPDATE MATERIAL AND LIGHTS IN RENDER LOOP ---
        function renderMaterial() {
            glassMaterial.color.set(PARAMS.colors.objectColor);
            glassMaterial.metalness = PARAMS.material.metal;
            glassMaterial.roughness = PARAMS.material.rough;
            glassMaterial.opacity = PARAMS.material.alpha;
            glassMaterial.transmission = Math.min(1.0, PARAMS.material.glass);
            glassMaterial.thickness = PARAMS.material.thick;
            glassMaterial.ior = PARAMS.material.ior;
            glassMaterial.reflectivity = PARAMS.material.reflex;
            glassMaterial.clearcoat = PARAMS.material.clearcoat * 5;
            glassMaterial.clearcoatRoughness = PARAMS.material.coatrough;
            glassMaterial.envMapIntensity = PARAMS.material.envInt;
            glassMaterial.displacementScale = PARAMS.material.disc * 0.1;
            glassMaterial.aoMapIntensity = PARAMS.material.ao;
            glassMaterial.normalScale.set(PARAMS.material.normal, PARAMS.material.normal);
            glassMaterial.dithering = PARAMS.material.dither;
            glassMaterial.attenuationDistance = PARAMS.material.sheen;
            glassMaterial.needsUpdate = true;

            ballMaterial.color.set(PARAMS.colors.accentColor);
            wallMaterial.color.set(PARAMS.colors.wallColor);
            wallMaterial.needsUpdate = true;

            if (PARAMS.greenScreen) {
                scene.background = new THREE.Color("#00ff00");
            } else {
                scene.background = new THREE.Color(PARAMS.colors.background);
            }
        }

        function updateLights() {
            a_light.color.set(PARAMS.lighting.hemiSky);
            a_light.groundColor.set(PARAMS.lighting.hemiGround);
            a_light.intensity = PARAMS.lighting.hemiIntensity * PARAMS.lighting.sceneIntensity;

            p_light.color.set(PARAMS.lighting.pointColor);
            p_light.intensity = PARAMS.lighting.pointIntensity * PARAMS.lighting.sceneIntensity;
            p_light.position.set(PARAMS.lighting.pointX, PARAMS.lighting.pointY, PARAMS.lighting.pointZ);

            if (renderer) {
                renderer.toneMappingExposure = PARAMS.lighting.exposure;
            }
        }

        // --- PROCEDURAL RANDOMIZER (CALLED ON SCENE CLICK OR BUTTON) ---
        function proceduralRandomize() {
            const schemeNames = Object.keys(COLOR_SCHEMES);
            const chosenScheme = schemeNames[Math.floor(Math.random() * schemeNames.length)];
            applyColorScheme(chosenScheme);

            // Randomize animation preset
            const animPresets = ANIMATION_PRESETS.filter(a => a !== "Static (No camera movement)");
            PARAMS.animation.preset = animPresets[Math.floor(Math.random() * animPresets.length)];
            PARAMS.animation.speed = parseFloat((0.5 + Math.random() * 1.5).toFixed(2));
            PARAMS.animation.wiggle = parseFloat((1.0 + Math.random() * 4.0).toFixed(1));

            // Randomize geometry
            PARAMS.geometry.type = GEOMETRIES[Math.floor(Math.random() * GEOMETRIES.length)];
            PARAMS.geometry.scale = parseFloat((0.8 + Math.random() * 0.4).toFixed(2));
            updateGeometry();

            // Randomize material properties within refined aesthetic bounds
            PARAMS.material.metal = parseFloat((Math.random() * 0.2).toFixed(2));
            PARAMS.material.rough = parseFloat((0.1 + Math.random() * 0.4).toFixed(2));
            PARAMS.material.glass = parseFloat((0.8 + Math.random() * 0.35).toFixed(2));
            PARAMS.material.thick = parseFloat((0.3 + Math.random() * 0.6).toFixed(2));
            PARAMS.material.reflex = parseFloat((0.3 + Math.random() * 0.5).toFixed(2));
            PARAMS.material.clearcoat = parseFloat((Math.random() * 0.5).toFixed(2));
            PARAMS.material.coatrough = parseFloat((0.02 + Math.random() * 0.15).toFixed(2));
            PARAMS.material.ior = parseFloat((1.0 + Math.random() * 0.4).toFixed(2));
            PARAMS.material.normal = parseFloat((0.8 + Math.random() * 1.6).toFixed(2));
            PARAMS.material.envInt = parseFloat((6.0 + Math.random() * 8.0).toFixed(1));

            // Randomize lighting
            PARAMS.lighting.exposure = parseFloat((0.8 + Math.random() * 0.5).toFixed(2));
            PARAMS.lighting.hemiIntensity = parseFloat((1.5 + Math.random() * 1.5).toFixed(2));
            PARAMS.lighting.pointIntensity = parseFloat((3.0 + Math.random() * 6.0).toFixed(2));
            PARAMS.lighting.pointX = parseFloat((Math.random() * 10 - 5).toFixed(1));
            PARAMS.lighting.pointY = parseFloat((Math.random() * 10 - 2).toFixed(1));
            PARAMS.lighting.pointZ = parseFloat((3 + Math.random() * 5).toFixed(1));

            renderMaterial();
            updateLights();

            if (gui) {
                gui.controllersRecursive().forEach(c => c.updateDisplay());
            }
        }

        // --- POINTER / CLICK EVENT HANDLING ---
        let pointerDownInfo = { x: 0, y: 0, time: 0 };
        function bindCanvasEvents() {
            canvas.addEventListener("pointerdown", (e) => {
                pointerDownInfo = { x: e.clientX, y: e.clientY, time: performance.now() };
            });

            canvas.addEventListener("pointerup", (e) => {
                const dx = e.clientX - pointerDownInfo.x;
                const dy = e.clientY - pointerDownInfo.y;
                const dt = performance.now() - pointerDownInfo.time;
                const dist = Math.hypot(dx, dy);

                // Distinguish between camera drag/pan and single click
                if (dist < 6 && dt < 300) {
                    if (PARAMS.rendering.clickToRandomize) {
                        proceduralRandomize();
                    }
                }
            });
        }

        // --- KEYBOARD SHORTCUTS ---
        window.addEventListener("keydown", (e) => {
            if (e.key === "h" || e.key === "H") {
                if (gui) {
                    const isHidden = gui.domElement.style.display === "none" || gui._hidden;
                    if (isHidden) {
                        gui.show();
                        gui.domElement.style.display = "";
                    } else {
                        gui.hide();
                        gui.domElement.style.display = "none";
                    }
                }
            }
        });

        // --- WINDOW RESIZE ---
        window.addEventListener("resize", () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- LIL-GUI SETUP ---
        function initGUI() {
            gui = new GUI({ title: "Configuration" });

            // Folder 1: Color Schemes & Theme
            const fColor = gui.addFolder("Color & Theme");
            fColor.add(PARAMS, "greenScreen").name("Green Screen (#00ff00)").onChange(renderMaterial);
            fColor.add(PARAMS, "colorScheme", Object.keys(COLOR_SCHEMES)).name("Preset Scheme").onChange(applyColorScheme);
            fColor.addColor(PARAMS.colors, "background").name("Background").onChange(renderMaterial);
            fColor.addColor(PARAMS.colors, "objectColor").name("Object Color").onChange(renderMaterial);
            fColor.addColor(PARAMS.colors, "accentColor").name("Accent Ball").onChange(renderMaterial);
            fColor.addColor(PARAMS.colors, "wallColor").name("Wall / Caustics").onChange(renderMaterial);

            // Folder 2: Animation & Camera
            const fAnim = gui.addFolder("Animation & Camera");
            fAnim.add(PARAMS.animation, "preset", ANIMATION_PRESETS).name("Animation");
            fAnim.add(PARAMS.animation, "speed", 0.05, 3.0, 0.05).name("Speed");
            fAnim.add(PARAMS.animation, "wiggle", 0.0, 5.0, 0.1).name("Wiggle");
            fAnim.add(PARAMS.controls, "dragMode", ["Rotate", "Pan"]).name("Mouse Drag Mode").onChange(applyControlMode);

            // Folder 3: Object & Geometry
            const fObj = gui.addFolder("Object & Material");
            fObj.add(PARAMS.geometry, "type", GEOMETRIES).name("Shape").onChange(updateGeometry);
            fObj.add(PARAMS.geometry, "scale", 0.3, 2.5, 0.05).name("Scale").onChange(updateGeometry);
            fObj.add(PARAMS.material, "metal", 0.01, 1.0, 0.01).name("Metalness").onChange(renderMaterial);
            fObj.add(PARAMS.material, "rough", 0.01, 1.0, 0.01).name("Roughness").onChange(renderMaterial);
            fObj.add(PARAMS.material, "glass", 0.01, 2.0, 0.01).name("Glass").onChange(renderMaterial);
            fObj.add(PARAMS.material, "thick", 0.01, 1.0, 0.01).name("Thickness").onChange(renderMaterial);
            fObj.add(PARAMS.material, "reflex", 0.01, 2.0, 0.01).name("Reflectivity").onChange(renderMaterial);
            fObj.add(PARAMS.material, "clearcoat", 0.0, 2.0, 0.01).name("Clearcoat").onChange(renderMaterial);
            fObj.add(PARAMS.material, "coatrough", 0.01, 2.0, 0.01).name("CCoatR").onChange(renderMaterial);
            fObj.add(PARAMS.material, "ior", 0.01, 2.0, 0.01).name("IOR").onChange(renderMaterial);
            fObj.add(PARAMS.material, "normal", 0.01, 4.0, 0.05).name("Normal").onChange(renderMaterial);
            fObj.add(PARAMS.material, "envInt", 0.0, 25.0, 0.5).name("Intensity").onChange(renderMaterial);
            fObj.add(PARAMS.material, "ao", 0.01, 2.0, 0.05).name("Ambient Oc").onChange(renderMaterial);
            fObj.add(PARAMS.material, "disc", 0.0, 1.0, 0.01).name("Disp Scale").onChange(renderMaterial);
            fObj.add(PARAMS.material, "dither").name("Dithering").onChange(renderMaterial);

            // Folder 4: Lighting & Exposure
            const fLight = gui.addFolder("Lighting & Exposure");
            fLight.add(PARAMS.lighting, "exposure", 0.1, 3.0, 0.05).name("Exposure").onChange(updateLights);
            fLight.add(PARAMS.lighting, "sceneIntensity", 0.0, 3.0, 0.05).name("Scene Light Int.").onChange(updateLights);
            fLight.add(PARAMS.lighting, "hemiIntensity", 0.0, 5.0, 0.1).name("Hemi Intensity").onChange(updateLights);
            fLight.addColor(PARAMS.lighting, "hemiSky").name("Hemi Sky").onChange(updateLights);
            fLight.addColor(PARAMS.lighting, "hemiGround").name("Hemi Ground").onChange(updateLights);
            fLight.add(PARAMS.lighting, "pointIntensity", 0.0, 20.0, 0.2).name("Point Intensity").onChange(updateLights);
            fLight.addColor(PARAMS.lighting, "pointColor").name("Point Color").onChange(updateLights);
            fLight.add(PARAMS.lighting, "pointX", -15, 15, 0.5).name("Point Light X").onChange(updateLights);
            fLight.add(PARAMS.lighting, "pointY", -15, 15, 0.5).name("Point Light Y").onChange(updateLights);
            fLight.add(PARAMS.lighting, "pointZ", -15, 15, 0.5).name("Point Light Z").onChange(updateLights);

            // Folder 5: Rendering & System
            const fRender = gui.addFolder("Rendering & Procedural");
            fRender.add(PARAMS.rendering, "antialias").name("Antialiasing").onChange(setAntialias);
            fRender.add(PARAMS.rendering, "dpr", 0.5, 3.0, 0.1).name("Pixel Ratio (DPR)").onChange(v => renderer.setPixelRatio(v));
            fRender.add(PARAMS.rendering, "clickToRandomize").name("Click Scene Randomizer");
            fRender.add({ randomize: proceduralRandomize }, "randomize").name("🎲 Randomize Now");
            fRender.add({ reset: () => applyColorScheme("Original") }, "reset").name("↺ Reset to Original");
        }

        // --- MAIN ANIMATION LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            const animSpeed = PARAMS.animation.speed;
            const elapsedTime = clock.getElapsedTime() * animSpeed * 2 * PARAMS.camera.speed;

            // --- CAMERA ANIMATION PRESETS ---
            // Preserves user wheel zoom and manual drag angles seamlessly
            animTargetOffset.set(0, 0, 0);

            switch (PARAMS.animation.preset) {
                case "Static (No camera movement)":
                    controls.autoRotate = false;
                    break;

                case "Gentle Orbit":
                    controls.autoRotate = true;
                    controls.autoRotateSpeed = 0.8 * animSpeed;
                    break;

                case "Slow Wobble & Drift":
                    controls.autoRotate = true;
                    controls.autoRotateSpeed = Math.sin(elapsedTime * 0.8) * 1.5 * animSpeed;
                    animTargetOffset.y = Math.sin(elapsedTime * 1.2) * 0.15;
                    break;

                case "Figure-8 Infinity Flow":
                    controls.autoRotate = true;
                    controls.autoRotateSpeed = Math.sin(elapsedTime * 0.9) * 1.8 * animSpeed;
                    animTargetOffset.x = Math.cos(elapsedTime * 0.9) * 0.25;
                    animTargetOffset.y = Math.sin(elapsedTime * 1.8) * 0.2;
                    break;

                case "Vertical Hover Drift":
                    controls.autoRotate = false;
                    animTargetOffset.y = Math.sin(elapsedTime * 1.1) * 0.35;
                    break;

                case "Cinematic Spiral":
                    controls.autoRotate = true;
                    controls.autoRotateSpeed = 0.9 * animSpeed;
                    animTargetOffset.y = Math.sin(elapsedTime * 0.7) * 0.25;
                    break;

                case "Harmonic Pendulum":
                    controls.autoRotate = true;
                    controls.autoRotateSpeed = Math.cos(elapsedTime * 0.75) * 2.2 * animSpeed;
                    animTargetOffset.x = Math.sin(elapsedTime * 0.75) * 0.15;
                    break;

                case "Deep Breathing Tilt":
                    controls.autoRotate = true;
                    controls.autoRotateSpeed = 0.35 * animSpeed;
                    animTargetOffset.y = Math.sin(elapsedTime * 0.5) * 0.25;
                    break;

                default:
                    controls.autoRotate = false;
                    break;
            }

            // Apply camera target offset and update OrbitControls
            // This preserves user zoom and lets user drag object across screen
            controls.target.copy(baseTarget).add(animTargetOffset);
            controls.update();
            // Absorb any user pan delta so dragging across screen accumulates smoothly
            baseTarget.copy(controls.target).sub(animTargetOffset);

            // Faithful original liquid wiggle motion on s_group
            s_group.rotation.y = ((Math.sin(elapsedTime * PARAMS.animation.wiggle) * Math.PI) / 180) * PARAMS.animation.wiggle;
            s_group.rotation.x = ((Math.cos(elapsedTime * PARAMS.animation.wiggle) * Math.PI) / 180) * PARAMS.animation.wiggle;

            // Orbiting accent ball
            b_group.position.x = Math.sin(elapsedTime * 3) * 1;
            b_group.position.y = Math.cos(elapsedTime * 3) * 1;

            renderMaterial();
            renderer.render(scene, camera);
        }

        // --- ENTRY POINT ---
        function main() {
            initScene();
            initRenderer(PARAMS.rendering.antialias);
            initControls();
            bindCanvasEvents();
            initGUI();
            animate();
        }

        window.addEventListener("load", main);
    </script>
</body>
</html>
