      const collarMesh = new THREE.Mesh(collarGeo, materials.containerCapMetal);
      collarMesh.position.y = -rRadius * 0.96;

      rootVisual.add(
        innerHaloSprite,
        outerHaloSprite,
        innerLatticeGroup,
        rootCoreMesh,
        rootGlassMesh,
        cageGroup,
        ring1Group,
        ring2Group,
        ring3,
        satellitesGroup,
        coreSparksPoints,
        collarMesh
      );
      nodesGroup.add(rootVisual);

      rootMeshRefs = {
        group: rootVisual,
        core: rootCoreMesh,
        innerLattice: innerLatticeGroup,
        innerCore: innerCoreSphere,
        glass: rootGlassMesh,
        cage: cageGroup,
        ring1: ring1Group,
        ring2: ring2Group,
        ring3,
        satellites: satellitesGroup,
        satelliteMeshes: satelliteCrystalMeshes,
        satelliteSprites,
        coreSparks: coreSparksPoints,
        haloInner: innerHaloSprite,
        haloOuter: outerHaloSprite
      };

      const rootNodeData = {
        id: 0,
        level: 0,
        indexInLevel: 0,
        position: rootPos,
        visual: rootVisual,
        children: [],
        branchesOut: [],
        keyMeshes: [],
        pulseGlow: 0,
        containerWidth: rRadius * 1.4,
        containerHeight: rRadius * 1.9
      };
      treeNodes.push(rootNodeData);

      // =======================================================================
      // 2. Shared Geometries for Child B-Tree Container Pods
      // =======================================================================
      // Dynamically scale down pods at deeper tiers so leaf tiers never crowd
      const basePodWidth = (1.1 + keysCount * 0.34) * params.nodeScale;
      const basePodHeight = 0.68 * params.nodeScale;
      const basePodDepth = 0.76 * params.nodeScale;

      let currentLevelNodes = [rootNodeData];
      const allLevels = [[rootNodeData]];

      for (let lvl = 1; lvl < levels; lvl++) {
        const nextLevelNodes = [];
        const totalInLevel = Math.pow(BF, lvl);

        // Scale factor per tier keeps deeper levels crisp and non-overlapping
        const tierScale = Math.pow(0.84, lvl - 1);
        const podW = basePodWidth * tierScale;
        const podH = basePodHeight * tierScale;
        const podD = basePodDepth * tierScale;

        const podGeo = new RoundedBoxGeometry(podW, podH, podD, 4, 0.1 * tierScale);
        const podFrameGeo = new THREE.BoxGeometry(podW * 1.02, podH * 1.02, podD * 1.02);
        const podEdgesGeo = new THREE.EdgesGeometry(podFrameGeo);
        podFrameGeo.dispose();

        const endCapGeo = new THREE.BoxGeometry(0.11 * tierScale, podH * 0.92, podD * 0.92);
        const routerHubGeo = new THREE.CylinderGeometry(
          0.14 * tierScale,
          0.22 * tierScale,
          0.16 * tierScale,
          16
        );
        const keyBarGeo = new RoundedBoxGeometry(
          (podW * 0.68) / keysCount,
          podH * 0.58,
          podD * 0.55,
          2,
          0.03 * tierScale
        );
        const holoRingGeo = new THREE.RingGeometry(podW * 0.56, podW * 0.62, 32);

        // Optional Architectural Tier Platform Ring
        if (params.showTierRings && params.topology !== 'Planar B-Tree Pyramid') {
          const samplePos = computeNodePosition(lvl, levels, 0, totalInLevel, rootNodeData, 0, BF, topY, vSpace, maxSpread);
          const ringRadius = Math.hypot(samplePos.x, samplePos.z);
          if (ringRadius > 0.5) {
            const pts = [];
            const segs = 96;
            for (let s = 0; s <= segs; s++) {
              const a = (s / segs) * Math.PI * 2;
              pts.push(new THREE.Vector3(Math.cos(a) * ringRadius, samplePos.y - podH * 0.65, Math.sin(a) * ringRadius));
            }
            const tRingGeo = new THREE.BufferGeometry().setFromPoints(pts);
            const tRingLine = new THREE.Line(tRingGeo, materials.tierRingLine);
            tierRingsGroup.add(tRingLine);
          }
        }

        for (let pIdx = 0; pIdx < currentLevelNodes.length; pIdx++) {
          const parentNode = currentLevelNodes[pIdx];

          for (let c = 0; c < BF; c++) {
            const globalIdx = pIdx * BF + c;
            const pos = computeNodePosition(
              lvl,
              levels,
              globalIdx,
              totalInLevel,
              parentNode,
              c,
              BF,
              topY,
              vSpace,
              maxSpread
            );

            // Create Child Container Pod Group
            const nodeGroup = new THREE.Group();
            nodeGroup.position.copy(pos);

            // Orient container cleanly outward from central vertical axis (or forward in planar mode)
            if (params.topology === 'Planar B-Tree Pyramid') {
              nodeGroup.rotation.y = 0;
            } else {
              const outwardTarget = new THREE.Vector3(pos.x * 2.0, pos.y, pos.z * 2.0);
              if (outwardTarget.lengthSq() > 0.001) {
                nodeGroup.lookAt(outwardTarget);
              }
            }

            // Glass Pod Body
            const bodyMesh = new THREE.Mesh(podGeo, materials.containerGlassBody);

            // Crisp Neon Edge Frame (no diagonal triangles!)
            const edgeLines = new THREE.LineSegments(podEdgesGeo, materials.containerEdgeLine);

            // Metallic Side End-Caps
            const leftCap = new THREE.Mesh(endCapGeo, materials.containerCapMetal);
            leftCap.position.x = -podW * 0.51;
            const rightCap = new THREE.Mesh(endCapGeo, materials.containerCapMetal);
            rightCap.position.x = podW * 0.51;

            // Top Receiver Router Hub
            const topHub = new THREE.Mesh(routerHubGeo, materials.containerCapMetal);
            topHub.position.y = podH * 0.56;

            nodeGroup.add(bodyMesh, edgeLines, leftCap, rightCap, topHub);

            // Bottom Emitter Ports (one for each outgoing child branch in B-Tree)
            if (lvl < levels - 1) {
              for (let bp = 0; bp < BF; bp++) {
                const portX = BF === 1 ? 0 : ((bp / (BF - 1)) - 0.5) * (podW * 0.65);
                const bottomPort = new THREE.Mesh(routerHubGeo, materials.containerCapMetal);
                bottomPort.scale.set(0.65, 0.75, 0.65);
                bottomPort.position.set(portX, -podH * 0.55, 0);
                nodeGroup.add(bottomPort);
              }
            }

            // Internal Sorted Data Key Cells [K1 | K2 | ... | Kn]
            const keyMeshes = [];
            for (let k = 0; k < keysCount; k++) {
              const kx = ((k + 0.5) / keysCount - 0.5) * (podW * 0.78);
              const isSearchKey = (globalIdx + k) % 2 === 0;
              const kMat = (isSearchKey ? materials.keyCellSearch : materials.keyCellSort).clone();
              const kMesh = new THREE.Mesh(keyBarGeo, kMat);

              // Ascending height profile inside container representing sorted B-Tree keys
              const sortedHeightScale = 0.55 + ((k + 1) / keysCount) * 0.55;
              kMesh.scale.y = sortedHeightScale;
              kMesh.position.set(kx, (sortedHeightScale - 1.0) * podH * 0.18, 0);
              kMesh.userData = {
                baseScaleY: sortedHeightScale,
                keyIndex: k,
                isSearchKey
              };

              nodeGroup.add(kMesh);
              keyMeshes.push(kMesh);
            }

            // Horizontal Holographic Base Ring under Container Pod
            const baseRingMesh = new THREE.Mesh(
              holoRingGeo,
              new THREE.MeshBasicMaterial({
                color: params.pulseSearchColor,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.28,
                blending: THREE.AdditiveBlending
              })
            );
            baseRingMesh.rotation.x = Math.PI * 0.5;
            baseRingMesh.position.y = -podH * 0.62;
            nodeGroup.add(baseRingMesh);

            // Soft additive glow sprite inside container
            const nodeGlowSprite = new THREE.Sprite(
              new THREE.SpriteMaterial({
                map: glowTexture,
                color: params.nodeSecondaryColor,
                transparent: true,
                opacity: 0.38,
                blending: THREE.AdditiveBlending,
                depthWrite: false
              })
            );
            nodeGlowSprite.scale.setScalar(podW * 1.9);
            nodeGroup.add(nodeGlowSprite);

            nodesGroup.add(nodeGroup);

            const childNodeData = {
              id: treeNodes.length,
              level: lvl,
              indexInLevel: globalIdx,
              childIndexInParent: c,
              position: pos,
              visual: nodeGroup,
              bodyMesh,
              baseRingMesh,
              nodeGlowSprite,
              parent: parentNode,
              children: [],
              branchesOut: [],
              keyMeshes,
              pulseGlow: 0,
              baseY: pos.y,
              containerWidth: podW,
              containerHeight: podH,
              phaseOffset: globalIdx * 0.65 + lvl * 1.4
            };

            parentNode.children.push(childNodeData);
            treeNodes.push(childNodeData);
            nextLevelNodes.push(childNodeData);

            // =================================================================
            // 3. Build Dual-Layer S-Curve Branch Conduit from Parent Key Slot
            // =================================================================
            // Calculate exact local departure point from parent's c-th pointer port
            const startPt = parentNode.position.clone();
            if (parentNode.level === 0) {
              const dirToChild = new THREE.Vector3(pos.x, 0, pos.z).normalize();
              startPt.addScaledVector(dirToChild, rRadius * 0.52);
              startPt.y -= rRadius * 0.95;
            } else {
              const localOffsetX = BF === 1
                ? 0
                : ((c / (BF - 1)) - 0.5) * (parentNode.containerWidth * 0.65);
              const localPort = new THREE.Vector3(localOffsetX, -parentNode.containerHeight * 0.58, 0);
              localPort.applyEuler(parentNode.visual.rotation);
              startPt.add(localPort);
            }

            const endPt = pos.clone();
            endPt.y += podH * 0.58;

            const deltaY = startPt.y - endPt.y;
            const tension = params.branchCurvature;

            const ctrl1 = new THREE.Vector3(
              THREE.MathUtils.lerp(startPt.x, endPt.x, 0.18),
              startPt.y - deltaY * tension,
              THREE.MathUtils.lerp(startPt.z, endPt.z, 0.18)
            );
            const ctrl2 = new THREE.Vector3(
              THREE.MathUtils.lerp(startPt.x, endPt.x, 0.82),
              endPt.y + deltaY * tension,
              THREE.MathUtils.lerp(startPt.z, endPt.z, 0.82)
            );

            const curve = new THREE.CubicBezierCurve3(startPt, ctrl1, ctrl2, endPt);
            const coreRadius = Math.max(0.025, (0.068 - lvl * 0.011) * params.nodeScale);

            // Inner glowing conduit core
            const coreTubeGeo = new THREE.TubeGeometry(curve, 32, coreRadius, 8, false);
            const coreTubeMesh = new THREE.Mesh(coreTubeGeo, materials.branchCoreTube);

            // Outer translucent glass sheath
            const sheathTubeGeo = new THREE.TubeGeometry(curve, 24, coreRadius * 2.1, 8, false);
            const sheathTubeMesh = new THREE.Mesh(sheathTubeGeo, materials.branchOuterSheath);

            branchesGroup.add(coreTubeMesh, sheathTubeMesh);

            const branchData = {
              parent: parentNode,
              child: childNodeData,
              curve,
              coreMesh: coreTubeMesh,
              sheathMesh: sheathTubeMesh,
              level: lvl
            };
            parentNode.branchesOut.push(branchData);
            treeBranches.push(branchData);
          }
        }

        allLevels.push(nextLevelNodes);
        currentLevelNodes = nextLevelNodes;
      }

      // =======================================================================
      // 4. B+ Tree Leaf/Sibling Horizontal Index Pointers
      // =======================================================================
      if (params.showSiblingLinks && allLevels.length > 1) {
        for (let l = 1; l < allLevels.length; l++) {
          const tierNodes = allLevels[l];
          if (tierNodes.length < 2) continue;

          const linkPoints = [];
          for (let i = 0; i < tierNodes.length; i++) {
            linkPoints.push(tierNodes[i].position.clone());
          }
          if (params.topology !== 'Planar B-Tree Pyramid' && tierNodes.length > 2) {
            linkPoints.push(tierNodes[0].position.clone());
          }
          const linkGeo = new THREE.BufferGeometry().setFromPoints(linkPoints);
          const linkLine = new THREE.Line(linkGeo, materials.siblingLink);
          branchesGroup.add(linkLine);
        }
      }

      // =======================================================================
      // 5. Build Cascading Energy Pulses (Search & Sort Operations)
      // =======================================================================
      buildEnergyPulses();

      // =======================================================================
      // 6. Build Volumetric Data Field Particles
      // =======================================================================
      buildAmbientParticles(topY, levels * vSpace, maxSpread);
    }

    function buildEnergyPulses() {
      clearGroup(pulsesGroup);
      activePulses = [];

      if (treeBranches.length === 0) return;

      const count = Math.round(params.pulseDensity);
      const headGeo = new THREE.SphereGeometry(0.14 * params.nodeScale, 14, 14);
      const trailGeo = new THREE.SphereGeometry(0.09 * params.nodeScale, 10, 10);

      for (let i = 0; i < count; i++) {
        const isSearch = params.operationMode === 'Search Cascade'
          ? true
          : params.operationMode === 'Sort Wave'
            ? false
            : (i % 2 === 0);

        const pulseColorHex = isSearch ? params.pulseSearchColor : params.pulseSortColor;
        const coreMat = isSearch ? materials.pulseSearchCore : materials.pulseSortCore;

        const pulseContainer = new THREE.Group();

        // Bright white-hot center + additive colored glow halo sprite
        const headMesh = new THREE.Mesh(headGeo, coreMat);
        const headSprite = new THREE.Sprite(
          new THREE.SpriteMaterial({
            map: glowTexture,
            color: pulseColorHex,
            transparent: true,
            opacity: 0.95,
            blending: THREE.AdditiveBlending,
            depthWrite: false
          })
        );
        headSprite.scale.setScalar(1.35 * params.nodeScale);
        headMesh.add(headSprite);
        pulseContainer.add(headMesh);

        // Comet tail spheres
        const trailMeshes = [];
        const trailCount = 6;
        for (let t = 1; t <= trailCount; t++) {
          const tMat = (isSearch ? materials.keyCellSearch : materials.keyCellSort);
          const tMesh = new THREE.Mesh(trailGeo, tMat);
          const s = Math.pow(1 - t / (trailCount + 1), 1.3);
          tMesh.scale.setScalar(s);
          pulseContainer.add(tMesh);
          trailMeshes.push(tMesh);
        }

        pulsesGroup.add(pulseContainer);

        const rootNode = treeNodes[0];
        const firstBranch = rootNode.branchesOut[i % rootNode.branchesOut.length];

        activePulses.push({
          group: pulseContainer,
          head: headMesh,
          headSprite,
          trails: trailMeshes,
          isSearch,
          currentBranch: firstBranch,
          t: (i / count) % 1.0,
          speedOffset: 0.78 + (i % 6) * 0.1
        });
      }
    }

    function buildAmbientParticles(topY, totalHeight, maxSpread) {
      clearGroup(ambientParticlesGroup);
      const pCount = 320;
      const positions = new Float32Array(pCount * 3);
      for (let i = 0; i < pCount; i++) {
        const r = (0.25 + Math.random() * 1.35) * maxSpread;
        const theta = Math.random() * Math.PI * 2;
        positions[i * 3] = Math.cos(theta) * r;
        positions[i * 3 + 1] = topY + 3 - Math.random() * (totalHeight + 6);
        positions[i * 3 + 2] = Math.sin(theta) * r;
      }
      const pGeo = new THREE.BufferGeometry();
      pGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const pMat = new THREE.PointsMaterial({
        map: glowTexture,
        color: params.pulseSearchColor,
        size: 0.42,
        transparent: true,
        opacity: 0.65,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      ambientPoints = new THREE.Points(pGeo, pMat);
      ambientParticlesGroup.add(ambientPoints);
    }

    // =========================================================================
    // Color Scheme Application & Updates
    // =========================================================================
    function applyColorScheme(schemeName) {
      const scheme = COLOR_SCHEMES[schemeName];
      if (!scheme) return;

      let rootC = scheme.root;
      let node1C = scheme.nodePrimary;
      let node2C = scheme.nodeSecondary;
      let branchC = scheme.branch;
      let searchC = scheme.pulseSearch;
      let sortC = scheme.pulseSort;
      let bgC = scheme.background;

      if (
        (schemeName === 'Achromatic (B&W / W&B)' || schemeName === 'Achromatic + Accent (Red)') &&
        params.achromaticInverted
      ) {
        bgC = '#f0f0f0';
        branchC = '#666666';
        node1C = '#d8d8d8';
        node2C = '#222222';
        if (schemeName === 'Achromatic (B&W / W&B)') {
          rootC = '#111111';
          searchC = '#000000';
          sortC = '#444444';
        } else {
          rootC = '#d90429';
          searchC = '#d90429';
          sortC = '#111111';
        }
      }

      params.rootColor = rootC;
      params.nodePrimaryColor = node1C;
      params.nodeSecondaryColor = node2C;
      params.branchColor = branchC;
      params.pulseSearchColor = searchC;
      params.pulseSortColor = sortC;
      params.backgroundColor = bgC;

      params.rootLightColor = rootC;
      params.dirLight2Color = node2C;
      params.bottomLightColor = searchC;

      syncMaterialsAndBackground();
      updateLights();
      refreshGUIDisplays();
    }

    function syncMaterialsAndBackground() {
      const effectiveBg = params.greenScreen ? '#00ff00' : params.backgroundColor;
      scene.background.set(effectiveBg);
      scene.fog.color.set(effectiveBg);
      scene.fog.density = params.greenScreen ? 0.0 : 0.011;
      document.body.style.backgroundColor = effectiveBg;

      rootCoreUniforms.uColorPrimary.value.set(params.rootColor);
      rootCoreUniforms.uColorAccent.value.set(params.pulseSearchColor);

      materials.rootGlassShell.color.set(params.rootColor);
      materials.rootGlassShell.emissive.set(params.rootColor);

      materials.rootGeodesicWire.color.set(params.rootColor);

      materials.rootRingPrimary.color.set(params.pulseSearchColor);
      materials.rootRingPrimary.emissive.set(params.pulseSearchColor);

      materials.rootRingSecondary.color.set(params.nodeSecondaryColor);
      materials.rootRingSecondary.emissive.set(params.nodeSecondaryColor);

      materials.rootRingTertiary.color.set(params.rootColor);
      materials.rootRingTertiary.emissive.set(params.rootColor);

      materials.rootJunctionNode.color.set(params.pulseSearchColor);
      materials.rootInnerWire1.color.set(params.pulseSearchColor);
      materials.rootInnerWire2.color.set(params.pulseSortColor);

      if (rootMeshRefs) {
        if (rootMeshRefs.haloInner) rootMeshRefs.haloInner.material.color.set(params.rootColor);
        if (rootMeshRefs.haloOuter) rootMeshRefs.haloOuter.material.color.set(params.pulseSearchColor);
        if (rootMeshRefs.satelliteMeshes) {
          rootMeshRefs.satelliteMeshes.forEach((sm) => {
            const hex = sm.userData.isSearch ? params.pulseSearchColor : params.pulseSortColor;
            if (sm.userData.mat) {
              sm.userData.mat.color.set(hex);
              sm.userData.mat.emissive.set(hex);
            }
          });
        }
        if (rootMeshRefs.satelliteSprites) {
          rootMeshRefs.satelliteSprites.forEach((sp, idx) => {
            const hex = (idx % 2 === 0) ? params.pulseSearchColor : params.pulseSortColor;
            sp.material.color.set(hex);
          });
        }
        if (rootMeshRefs.coreSparks) {
          rootMeshRefs.coreSparks.material.color.set(params.pulseSearchColor);
        }
      }

      materials.containerGlassBody.color.set(params.nodePrimaryColor);
      materials.containerGlassBody.emissive.set(params.nodePrimaryColor);

      materials.containerCapMetal.color.set(params.nodeSecondaryColor);
      materials.containerCapMetal.emissive.set(params.nodeSecondaryColor);

      materials.containerEdgeLine.color.set(params.nodeSecondaryColor);

      materials.keyCellSearch.color.set(params.pulseSearchColor);
      materials.keyCellSearch.emissive.set(params.pulseSearchColor);

      materials.keyCellSort.color.set(params.pulseSortColor);
      materials.keyCellSort.emissive.set(params.pulseSortColor);

      materials.branchCoreTube.color.set(params.branchColor);
      materials.branchCoreTube.emissive.set(params.branchColor);

      materials.branchOuterSheath.color.set(params.nodeSecondaryColor);
      materials.branchOuterSheath.emissive.set(params.branchColor);

      materials.siblingLink.color.set(params.nodeSecondaryColor);
      materials.tierRingLine.color.set(params.branchColor);

      if (ambientPoints && ambientPoints.material) {
        ambientPoints.material.color.set(params.pulseSearchColor);
      }

      for (let i = 1; i < treeNodes.length; i++) {
        const node = treeNodes[i];
        if (node.baseRingMesh) {
          node.baseRingMesh.material.color.set(params.pulseSearchColor);
        }
        if (node.nodeGlowSprite) {
          node.nodeGlowSprite.material.color.set(params.nodeSecondaryColor);
        }
        node.keyMeshes.forEach((km) => {
          const hex = km.userData.isSearchKey ? params.pulseSearchColor : params.pulseSortColor;
          km.material.color.set(hex);
          km.material.emissive.set(hex);
        });
      }

      for (let i = 0; i < activePulses.length; i++) {
        const p = activePulses[i];
        if (p.headSprite) {
          p.headSprite.material.color.set(p.isSearch ? params.pulseSearchColor : params.pulseSortColor);
        }
      }
    }

    // =========================================================================
    // User Interactions:
    // - Zoom with wheel (persists during camera animation)
    // - Drag object across screen (raycast drag on tree or Shift/Right drag)
    // - Change camera angle during orbit animation
    // - Click on scene to randomize theme, geometry, and motion
    // =========================================================================
    const raycaster = new THREE.Raycaster();
    const pointerNDC = new THREE.Vector2();
    const dragPlane = new THREE.Plane();
    const dragIntersectPoint = new THREE.Vector3();
    const dragStartWorldOffset = new THREE.Vector3();
    let pointerDownPos = { x: 0, y: 0 };
    let pointerMovedDistance = 0;

    function attachCanvasInteractions(canvas) {
      canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomFactor = 1 + Math.sign(e.deltaY) * 0.085;
        camState.userDistance = THREE.MathUtils.clamp(
          camState.userDistance * zoomFactor,
          6.0,
          110.0
        );
      }, { passive: false });

      canvas.addEventListener('pointerdown', (e) => {
        pointerDownPos.x = e.clientX;
        pointerDownPos.y = e.clientY;
        pointerMovedDistance = 0;

        pointerNDC.x = (e.clientX / window.innerWidth) * 2 - 1;
        pointerNDC.y = -(e.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(pointerNDC, camera);
        const hits = raycaster.intersectObjects(nodesGroup.children, true);

        if ((e.button === 0 && hits.length > 0) || e.shiftKey) {
          camState.isDraggingObject = true;
          controls.enabled = false;

          const camForward = new THREE.Vector3();
          camera.getWorldDirection(camForward);
          dragPlane.setFromNormalAndCoplanarPoint(camForward, treeWorldGroup.position);

          if (raycaster.ray.intersectPlane(dragPlane, dragIntersectPoint)) {
            dragStartWorldOffset.copy(treeWorldGroup.position).sub(dragIntersectPoint);
          }
        } else {
          camState.isUserOrbiting = true;
          const offset = camera.position.clone().sub(controls.target);
          const sph = new THREE.Spherical().setFromVector3(offset);
          camState.lastSphericalTheta = sph.theta;
          camState.lastSphericalPhi = sph.phi;
        }
      });

      window.addEventListener('pointermove', (e) => {
        const dx = e.clientX - pointerDownPos.x;
        const dy = e.clientY - pointerDownPos.y;
        pointerMovedDistance = Math.hypot(dx, dy);

        if (camState.isDraggingObject) {
          pointerNDC.x = (e.clientX / window.innerWidth) * 2 - 1;
          pointerNDC.y = -(e.clientY / window.innerHeight) * 2 + 1;
          raycaster.setFromCamera(pointerNDC, camera);

          if (raycaster.ray.intersectPlane(dragPlane, dragIntersectPoint)) {
            treeWorldGroup.position.copy(dragIntersectPoint).add(dragStartWorldOffset);
          }
        } else if (camState.isUserOrbiting && (e.buttons & 1)) {
          const offset = camera.position.clone().sub(controls.target);
          const sph = new THREE.Spherical().setFromVector3(offset);

          let dTheta = sph.theta - camState.lastSphericalTheta;
          if (dTheta > Math.PI) dTheta -= Math.PI * 2;
          if (dTheta < -Math.PI) dTheta += Math.PI * 2;
          const dPhi = sph.phi - camState.lastSphericalPhi;

          camState.userAzimuthOffset += dTheta;
          camState.userPolarOffset = THREE.MathUtils.clamp(
            camState.userPolarOffset + dPhi,
            -Math.PI * 0.42,
            Math.PI * 0.42
          );

          camState.lastSphericalTheta = sph.theta;
          camState.lastSphericalPhi = sph.phi;
        }
      });

      window.addEventListener('pointerup', (e) => {
        if (camState.isDraggingObject) {
          camState.isDraggingObject = false;
          controls.enabled = true;
        }
        camState.isUserOrbiting = false;

        if (e.target === canvas && pointerMovedDistance < 5 && e.button === 0 && params.clickToRandomize) {
          randomizeSceneVariation();
        }
      });
    }

    // =========================================================================
    // Procedural Scene Randomizer (Triggered on Click)
    // =========================================================================
    function randomizeSceneVariation() {
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      params.colorScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      params.achromaticInverted = Math.random() > 0.5;

      params.topology = TOPOLOGY_MODES[Math.floor(Math.random() * TOPOLOGY_MODES.length)];
      params.treeLevels = [3, 4, 4, 5][Math.floor(Math.random() * 4)];
      params.branchingFactor = params.treeLevels === 5
        ? 2
        : [2, 3, 4][Math.floor(Math.random() * 3)];
      params.keysPerContainer = 3 + Math.floor(Math.random() * 3);
      params.verticalSpacing = Number((4.0 + Math.random() * 1.8).toFixed(2));
      params.horizontalSpread = Number((10.0 + Math.random() * 5.5).toFixed(2));
      params.rootScale = Number((1.15 + Math.random() * 0.55).toFixed(2));
      params.nodeScale = Number((0.9 + Math.random() * 0.35).toFixed(2));
      params.branchCurvature = Number((0.35 + Math.random() * 0.45).toFixed(2));
      params.showTierRings = Math.random() > 0.2;
      params.showSiblingLinks = Math.random() > 0.25;

      const nonStaticAnims = ANIMATION_MODES.slice(0, 7);
      params.animationMode = nonStaticAnims[Math.floor(Math.random() * nonStaticAnims.length)];
      params.animationSpeed = Number((0.75 + Math.random() * 0.85).toFixed(2));
      params.pulseSpeed = Number((0.9 + Math.random() * 1.1).toFixed(2));
      params.pulseDensity = Math.floor(28 + Math.random() * 28);
      const opModes = ['Search Cascade', 'Sort Wave', 'Search & Sort Combined'];
      params.operationMode = opModes[Math.floor(Math.random() * opModes.length)];

      applyColorScheme(params.colorScheme);
      buildHierarchicalTree();

      gsap.fromTo(
        treeWorldGroup.scale,
        { x: 0.88, y: 0.88, z: 0.88 },
        { x: 1, y: 1, z: 1, duration: 0.65, ease: 'back.out(1.6)' }
      );

      refreshGUIDisplays();
    }

    // =========================================================================
    // GUI Setup (lil-gui)
    // =========================================================================
    const gui = new GUI({ title: 'Hierarchical Data Tree (B-Tree)' });
    const guiControllers = [];

    function registerController(ctrl) {
      guiControllers.push(ctrl);
      return ctrl;
    }

    function refreshGUIDisplays() {
      guiControllers.forEach((c) => c.updateDisplay());
    }

    // 1. Color & Theme Folder
    const colorFolder = gui.addFolder('Color & Theme (19 Schemes)');
    registerController(
      colorFolder
        .add(params, 'colorScheme', Object.keys(COLOR_SCHEMES))
        .name('Color Scheme')
        .onChange((val) => applyColorScheme(val))
    );
    registerController(
      colorFolder
        .add(params, 'achromaticInverted')
        .name('Invert Achromatic (W&B)')
        .onChange(() => applyColorScheme(params.colorScheme))
    );
    registerController(
      colorFolder
        .add(params, 'greenScreen')
        .name('Green Screen (#00ff00)')
        .onChange(() => syncMaterialsAndBackground())
    );
    registerController(
      colorFolder
        .addColor(params, 'backgroundColor')
        .name('Background Color')
        .onChange(() => syncMaterialsAndBackground())
    );
    registerController(
      colorFolder
        .addColor(params, 'rootColor')
        .name('Root Sphere Color')
        .onChange(() => syncMaterialsAndBackground())
    );
    registerController(
      colorFolder
        .addColor(params, 'nodePrimaryColor')
        .name('Container Pod Color')
        .onChange(() => syncMaterialsAndBackground())
    );
    registerController(
      colorFolder
        .addColor(params, 'nodeSecondaryColor')
        .name('Container Neon Frame')
        .onChange(() => syncMaterialsAndBackground())
    );
    registerController(
      colorFolder
        .addColor(params, 'branchColor')
        .name('Branch Conduit')
        .onChange(() => syncMaterialsAndBackground())
    );
    registerController(
      colorFolder
        .addColor(params, 'pulseSearchColor')
        .name('Search Pulse Color')
        .onChange(() => syncMaterialsAndBackground())
    );
    registerController(
      colorFolder
        .addColor(params, 'pulseSortColor')
        .name('Sort Pulse Color')
        .onChange(() => syncMaterialsAndBackground())
    );

    // 2. Camera & Animation Folder
    const animFolder = gui.addFolder('Camera & Animation');
    registerController(
      animFolder
        .add(params, 'animationMode', ANIMATION_MODES)
        .name('Camera Animation')
    );
    registerController(
      animFolder
        .add(params, 'animationSpeed', 0.0, 3.0, 0.05)
        .name('Animation Speed')
    );
    registerController(
      animFolder
        .add(params, 'pulseSpeed', 0.1, 3.5, 0.05)
        .name('Pulse Cascade Speed')
    );
    registerController(
      animFolder
        .add(params, 'pulseDensity', 10, 75, 1)
        .name('Active Energy Pulses')
        .onFinishChange(() => buildEnergyPulses())
    );
    registerController(
      animFolder
        .add(params, 'operationMode', ['Search Cascade', 'Sort Wave', 'Search & Sort Combined'])
        .name('Indexing Operation')
        .onChange(() => buildEnergyPulses())
    );
    registerController(
      animFolder
        .add(params, 'clickToRandomize')
        .name('Click Scene Randomize')
    );

    // 3. Tree Structure Folder
    const treeFolder = gui.addFolder('Tree Indexing Geometry');
    registerController(
      treeFolder
        .add(params, 'topology', TOPOLOGY_MODES)
        .name('Tree Topology')
        .onChange(() => buildHierarchicalTree())
    );
    registerController(
      treeFolder
        .add(params, 'treeLevels', 3, 5, 1)
        .name('Hierarchy Tiers')
        .onFinishChange(() => buildHierarchicalTree())
    );
    registerController(
      treeFolder
        .add(params, 'branchingFactor', 2, 4, 1)
        .name('Branching Factor')
        .onFinishChange(() => buildHierarchicalTree())
    );
    registerController(
      treeFolder
        .add(params, 'keysPerContainer', 2, 6, 1)
        .name('Keys Per Container')
        .onFinishChange(() => buildHierarchicalTree())
    );
    registerController(
      treeFolder
        .add(params, 'verticalSpacing', 3.0, 7.0, 0.1)
        .name('Tier Spacing')
        .onChange(() => buildHierarchicalTree())
    );
    registerController(
      treeFolder
        .add(params, 'horizontalSpread', 6.0, 18.0, 0.2)
        .name('Canopy Spread')
        .onChange(() => buildHierarchicalTree())
    );
    registerController(
      treeFolder
        .add(params, 'rootScale', 0.7, 2.2, 0.05)
        .name('Root Sphere Scale')
        .onChange(() => buildHierarchicalTree())
    );
    registerController(
      treeFolder
        .add(params, 'nodeScale', 0.6, 1.6, 0.05)
        .name('Child Pod Scale')
        .onChange(() => buildHierarchicalTree())
    );
    registerController(
      treeFolder
        .add(params, 'branchCurvature', 0.15, 0.9, 0.05)
        .name('Branch Curvature')
        .onChange(() => buildHierarchicalTree())
    );
    registerController(
      treeFolder
        .add(params, 'showTierRings')
        .name('Tier Horizon Rings')
        .onChange(() => buildHierarchicalTree())
    );
    registerController(
      treeFolder
        .add(params, 'showSiblingLinks')
        .name('B+ Leaf Pointers')
        .onChange(() => buildHierarchicalTree())
    );

    // 4. Lighting & Exposure Folder
    const lightFolder = gui.addFolder('Lights & Exposure');
    registerController(
      lightFolder
        .add(params, 'exposure', 0.2, 3.0, 0.05)
        .name('Scene Exposure')
        .onChange(() => updateLights())
    );
    registerController(
      lightFolder
        .add(params, 'sceneLightIntensity', 0.0, 3.0, 0.05)
        .name('Global Light Mult')
        .onChange(() => updateLights())
    );
    registerController(
      lightFolder
        .add(params, 'ambientIntensity', 0.0, 3.0, 0.05)
        .name('Ambient Intensity')
        .onChange(() => updateLights())
    );
    registerController(
      lightFolder
        .addColor(params, 'ambientColor')
        .name('Ambient Color')
        .onChange(() => updateLights())
    );
    registerController(
      lightFolder
        .add(params, 'rootLightIntensity', 0.0, 12.0, 0.1)
        .name('Root Light Intensity')
        .onChange(() => updateLights())
    );
    registerController(
      lightFolder
        .addColor(params, 'rootLightColor')
        .name('Root Light Color')
        .onChange(() => updateLights())
    );
    registerController(
      lightFolder
        .add(params, 'dirLight1Intensity', 0.0, 6.0, 0.1)
        .name('Key Light Intensity')
        .onChange(() => updateLights())
    );
    registerController(
      lightFolder
        .addColor(params, 'dirLight1Color')
        .name('Key Light Color')
        .onChange(() => updateLights())
    );
    registerController(
      lightFolder
        .add(params, 'dirLight2Intensity', 0.0, 6.0, 0.1)
        .name('Rim Light Intensity')
        .onChange(() => updateLights())
    );
    registerController(
      lightFolder
        .addColor(params, 'dirLight2Color')
        .name('Rim Light Color')
        .onChange(() => updateLights())
    );
    registerController(
      lightFolder
        .add(params, 'bottomLightIntensity', 0.0, 8.0, 0.1)
        .name('Leaf Fill Intensity')
        .onChange(() => updateLights())
    );
    registerController(
      lightFolder
        .addColor(params, 'bottomLightColor')
        .name('Leaf Fill Color')
        .onChange(() => updateLights())
    );

    // 5. Renderer Settings Folder
    const renderFolder = gui.addFolder('Renderer Settings');
    registerController(
      renderFolder
        .add(params, 'dpr', 0.5, 2.5, 0.25)
        .name('Pixel Ratio (DPR)')
        .onChange((val) => {
          if (renderer) renderer.setPixelRatio(val);
          if (postProcessor) postProcessor.setSize(window.innerWidth, window.innerHeight, val);
        })
    );
    registerController(
      renderFolder
        .add(params, 'antialias')
        .name('Antialias')
        .onChange((val) => {
          const savedPos = camera.position.clone();
          const savedTarget = controls.target.clone();
          createRendererAndControls();
          camera.position.copy(savedPos);
          controls.target.copy(savedTarget);
          controls.update();
          if (postProcessor) {
            postProcessor.setAntialias(val);
          }
        })
    );

    // 6. Post-Processing Suite Folder
    if (postProcessor) {
      postProcessor.attachGUI(gui, "Post-Processing Suite");
    }

    // Toggle UI visibility with "H" key
    let uiVisible = true;
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        if (document.activeElement && ['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
          return;
        }
        uiVisible = !uiVisible;
        if (uiVisible) {
          gui.show();
        } else {
          gui.hide();
        }
      }
    });

    // =========================================================================
    // Initialize Scene & Animation Loop
    // =========================================================================
    createRendererAndControls();
    camera.position.set(0, 4, camState.userDistance);
    applyColorScheme(params.colorScheme);
    buildHierarchicalTree();

    const clock = new THREE.Clock();
    const tempVec = new THREE.Vector3();

    function updateCameraAnimation(dt) {
      if (params.animationMode === '8. Static (No Camera Movement)') {
        if (!camState.isUserOrbiting) {
          const offset = camera.position.clone().sub(controls.target);
          if (offset.lengthSq() > 0.0001) {
            offset.setLength(THREE.MathUtils.lerp(offset.length(), camState.userDistance, 0.12));
            camera.position.copy(controls.target).add(offset);
          }
        }
        return;
      }

      if (camState.isUserOrbiting) {
        return;
      }

      camState.animTime += dt * params.animationSpeed;
      const t = camState.animTime;

      let theta = camState.userAzimuthOffset;
      let phi = Math.PI * 0.43 + camState.userPolarOffset;
      let radiusScale = 1.0;
      let targetYShift = -1.2;

      switch (params.animationMode) {
        case '1. Slow Orbital Inspection':
          theta += t * 0.2;
          phi += Math.sin(t * 0.18) * 0.07;
          break;

        case '2. Root-to-Leaf Cascade Descent':
          theta += t * 0.14;
          phi += Math.sin(t * 0.24) * 0.2;
          targetYShift = Math.cos(t * 0.24) * (params.verticalSpacing * 0.85);
          break;

        case '3. Helical Index Scan':
          theta += t * 0.26;
          phi += Math.sin(t * 0.32) * 0.24;
          radiusScale = 1.0 + Math.cos(t * 0.32) * 0.12;
          break;

        case '4. Pendulum Canopy Drift':
          theta += Math.sin(t * 0.2) * 1.1;
          phi += Math.cos(t * 0.15) * 0.09;
          break;

        case '5. Deep Branch Breathing':
          theta += t * 0.12;
          phi += Math.sin(t * 0.2) * 0.06;
          radiusScale = 1.0 + Math.sin(t * 0.3) * 0.16;
          break;

        case '6. Low-Angle Cathedral Rise':
          theta += t * 0.15;
          phi = THREE.MathUtils.clamp(
            Math.PI * 0.63 + camState.userPolarOffset + Math.sin(t * 0.18) * 0.1,
            0.15,
            Math.PI - 0.15
          );
          break;

        case '7. Isometric Data Survey':
          theta += t * 0.17;
          phi = THREE.MathUtils.clamp(
            Math.PI * 0.29 + camState.userPolarOffset + Math.sin(t * 0.15) * 0.05,
            0.15,
            Math.PI - 0.15
          );
          break;
      }

      phi = THREE.MathUtils.clamp(phi, 0.12, Math.PI - 0.12);
      const effectiveRadius = camState.userDistance * radiusScale;

      controls.target.y = THREE.MathUtils.lerp(controls.target.y, targetYShift, 0.05);

      const desiredOffset = new THREE.Vector3().setFromSphericalCoords(effectiveRadius, phi, theta);
      camera.position.copy(controls.target).add(desiredOffset);

      camState.lastSphericalTheta = theta;
      camState.lastSphericalPhi = phi;
    }

    function updateTreeAndPulses(dt, elapsed) {
      const speed = params.animationSpeed;
      rootCoreUniforms.uTime.value = elapsed * speed;

      // 1. Animate Top-Level Root Sphere & Gyroscopic Rings
      if (rootMeshRefs) {
        if (rootMeshRefs.innerLattice) {
          rootMeshRefs.innerLattice.rotation.y += dt * 0.85 * speed;
          rootMeshRefs.innerLattice.rotation.x -= dt * 0.45 * speed;
        }
        if (rootMeshRefs.cage) {
          rootMeshRefs.cage.rotation.y += dt * 0.28 * speed;
          rootMeshRefs.cage.rotation.x += dt * 0.14 * speed;
        }
        if (rootMeshRefs.ring1) rootMeshRefs.ring1.rotation.z += dt * 0.45 * speed;
        if (rootMeshRefs.ring2) rootMeshRefs.ring2.rotation.y -= dt * 0.38 * speed;
        if (rootMeshRefs.ring3) rootMeshRefs.ring3.rotation.x += dt * 0.32 * speed;
        if (rootMeshRefs.satellites) rootMeshRefs.satellites.rotation.y += dt * 0.65 * speed;

        if (rootMeshRefs.satelliteMeshes) {
          for (let s = 0; s < rootMeshRefs.satelliteMeshes.length; s++) {
            const sm = rootMeshRefs.satelliteMeshes[s];
            sm.rotation.y += dt * 1.6 * speed;
            sm.rotation.z += dt * 0.9 * speed;
            sm.position.y = sm.userData.baseY + Math.sin(elapsed * 2.8 * speed + sm.userData.phase) * 0.16;
          }
        }

        if (rootMeshRefs.coreSparks) {
          rootMeshRefs.coreSparks.rotation.y += dt * 0.75 * speed;
          rootMeshRefs.coreSparks.rotation.x = Math.sin(elapsed * 0.5 * speed) * 0.12;
        }

        const rootPulse = 1 + Math.sin(elapsed * 2.5 * speed) * 0.05;
        if (rootMeshRefs.core) rootMeshRefs.core.scale.setScalar(rootPulse);
        if (rootMeshRefs.innerCore) rootMeshRefs.innerCore.scale.setScalar(1 + Math.cos(elapsed * 3.5 * speed) * 0.08);
      }

      // 2. Animate Child Container Pods & Internal Sorted Data Keys
      for (let i = 1; i < treeNodes.length; i++) {
        const node = treeNodes[i];
        node.pulseGlow = Math.max(0, node.pulseGlow - dt * 2.4);

        const hoverY = Math.sin(elapsed * 1.5 * speed + node.phaseOffset) * 0.07;
        node.visual.position.y = node.baseY + hoverY;

        // Container expands & glows when an indexing pulse arrives
        const podScale = 1 + node.pulseGlow * 0.14;
        node.bodyMesh.scale.setScalar(podScale);

        if (node.baseRingMesh) {
          node.baseRingMesh.scale.setScalar(1 + node.pulseGlow * 0.35);
          node.baseRingMesh.material.opacity = 0.22 + node.pulseGlow * 0.65;
        }

        // Dynamic sorting wave inside container's key cells
        for (let k = 0; k < node.keyMeshes.length; k++) {
          const km = node.keyMeshes[k];
          const sortWave = Math.sin(elapsed * 3.5 * speed + node.phaseOffset + k * 0.9) * 0.15;
          const activeBoost = node.pulseGlow * 0.45;
          km.scale.y = Math.max(0.25, km.userData.baseScaleY + sortWave + activeBoost);
        }
      }

      // 3. Cascade Energy Pulses downward along the branches
      const pSpeed = dt * 0.58 * params.pulseSpeed * Math.max(0.15, speed);

      for (let i = 0; i < activePulses.length; i++) {
        const p = activePulses[i];
        if (!p.currentBranch) continue;

        p.t += pSpeed * p.speedOffset;

        if (p.t >= 1.0) {
          p.t -= 1.0;
          const arrivedNode = p.currentBranch.child;
          arrivedNode.pulseGlow = 1.0;

          if (arrivedNode.branchesOut.length > 0) {
            if (p.isSearch) {
              const nextIdx = Math.floor(Math.random() * arrivedNode.branchesOut.length);
              p.currentBranch = arrivedNode.branchesOut[nextIdx];
            } else {
              const nextIdx = (i + Math.floor(elapsed * 2)) % arrivedNode.branchesOut.length;
              p.currentBranch = arrivedNode.branchesOut[nextIdx];
            }
          } else {
            const rootNode = treeNodes[0];
            if (rootNode && rootNode.branchesOut.length > 0) {
              const startIdx = (i + Math.floor(Math.random() * rootNode.branchesOut.length)) % rootNode.branchesOut.length;
              p.currentBranch = rootNode.branchesOut[startIdx];
            }
          }
        }

        const curve = p.currentBranch.curve;
        curve.getPointAt(THREE.MathUtils.clamp(p.t, 0, 1), p.head.position);

        for (let tr = 0; tr < p.trails.length; tr++) {
          const trailT = THREE.MathUtils.clamp(p.t - (tr + 1) * 0.036, 0, 1);
          curve.getPointAt(trailT, tempVec);
          p.trails[tr].position.copy(tempVec);
        }
      }

      // 4. Slowly rotate ambient index particles
      if (ambientPoints) {
        ambientPoints.rotation.y += dt * 0.04 * speed;
      }
    }

    function animate() {
      requestAnimationFrame(animate);

      const dt = Math.min(clock.getDelta(), 0.1);
      const elapsed = clock.getElapsedTime();

      updateTreeAndPulses(dt, elapsed);
      updateCameraAnimation(dt);

      controls.update();

      if (postProcessor) {
        if (postProcessor.settings.raysEnabled && rootMeshRefs && rootMeshRefs.group) {
          postProcessor.setMoonScreenPosition(camera, rootMeshRefs.group.position);
        }
        postProcessor.renderScene(scene, camera);
      } else {
        renderer.render(scene, camera);
      }
    }

    animate();

    // =========================================================================
    // Responsive Resize
    // =========================================================================
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      if (renderer) {
        renderer.setSize(window.innerWidth, window.innerHeight);
        if (postProcessor) {
          postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);
        }
      }
    });
  </script>
</body>
