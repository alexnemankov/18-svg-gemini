<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mandelbox Kaleidoscopic Raymarcher</title>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
    }
  }
  </script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #05020a;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body.antialias-on canvas {
      image-rendering: auto;
    }

    body.antialias-off canvas {
      image-rendering: pixelated;
    }

    body.greenscreen {
      background-color: #00ff00 !important;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }
  </style>
</head>
<body>
  <script type="module">

    // ------------------------------------------------------------------------

    const colorSchemes = {

      },
      'Neutral + Accent': {

      },
      'Sunset Fire': {

        bg: '#220901', saturation: 0.9, glow: 1.25, accentMix: 0.0
      },
      'Cyber Teal': {
        type: 1,
        c1: '#63d1cf', c2: '#5bc0be', c3: '#4bad9e', c4: '#4bad9e', c5: '#0b132b',
        bg: '#0b132b', saturation: 0.85, glow: 1.15, accentMix: 0.0
      },
      'Lavender Dream': {
        type: 1,
        c1: '#aa60c8', c2: '#d69ade', c3: '#c9a3c6', c4: '#cfb5c2', c5: '#0d001d',
        bg: '#0d001d', saturation: 0.85, glow: 1.15, accentMix: 0.0
      },
      'Golden Teal': {
        type: 1,
        c1: '#fef1be', c2: '#ffba00', c3: '#008189', c4: '#00474d', c5: '#061210',
        bg: '#061210', saturation: 0.9, glow: 1.2, accentMix: 0.0
      },
      'Emerald Acid': {
        type: 1,
        c1: '#d4ffb0', c2: '#7fff00', c3: '#00b894', c4: '#0a3322', c5: '#05140a',
        bg: '#05140a', saturation: 0.95, glow: 1.25, accentMix: 0.0
      },
      'Warm Flame': {
        type: 1,
        c1: '#ffe8cc', c2: '#ff8c00', c3: '#c7501a', c4: '#3d1050', c5: '#0e0618',
        bg: '#0e0618', saturation: 0.95, glow: 1.25, accentMix: 0.0
      },
      'Neon Violet': {
        type: 1,
        c1: '#e8e0ff', c2: '#b38fff', c3: '#6a3de8', c4: '#1a1250', c5: '#090612',
        bg: '#090612', saturation: 0.95, glow: 1.25, accentMix: 0.0
      },
      'Cyberpunk Pastel': {
        type: 1,
        c1: '#e0fbff', c2: '#00f0ff', c3: '#d40078', c4: '#1e0a3d', c5: '#05020f',
        bg: '#05020f', saturation: 0.95, glow: 1.3, accentMix: 0.0
      }
    };

    // ------------------------------------------------------------------------
    // 8 Preconfigured Slow Smooth Animations
    // ------------------------------------------------------------------------
    const animationModes = [
      'Static (No Movement)',
      'Cosmic Drift',
      'Cathedral Breathing',
      'Cinematic Orbit',
      'Ascending Spire',
      'Misty Pendulum',
      'Hypercube Twist',
      'Ethereal Shimmer'
    ];

    // ------------------------------------------------------------------------
    // Scene Settings & State
    // ------------------------------------------------------------------------
    const settings = {
      colorScheme: 'Original',
      greenScreen: false,
      animation: 'Cosmic Drift',
      animationSpeed: 1.0,
      clickToRandomize: true,

      // Navigation & Drag
      zoom: 1.0,
      panX: 0.0,
      panY: 0.0,
      rotX: 0.0,
      rotY: 0.0,
      rotZ: 0.0,
      dragAction: 'Rotate (3D)',

      // Lighting & Exposure
      exposure: 1.0,
      sceneLightIntensity: 1.0,
      keyLightIntensity: 1.2,
      keyLightColor: '#fff2db',
      fillLightIntensity: 0.8,
      fillLightColor: '#a0dbf0',
      rimLightIntensity: 1.5,
      rimLightColor: '#ff66d0',
      coreLightIntensity: 1.0,
      coreLightColor: '#ffffff',

      // Color Overrides
      color1: colorSchemes['Original'].c1,
      color2: colorSchemes['Original'].c2,
      color3: colorSchemes['Original'].c3,
      color4: colorSchemes['Original'].c4,
      color5: colorSchemes['Original'].c5,
      bgColor: colorSchemes['Original'].bg,
      glowIntensity: 1.0,
      saturation: 0.2,
      colorShift: 0.0,
      accentMix: 0.0,

      // Fractal Geometry
      scaleMult: 1.05,
      inversion: 7.0,
      floorOffset: 0.0,
      foldA_x: 2.0,
      foldA_y: 4.0,
      foldA_z: 2.0,
      foldB_x: 6.0,
      foldB_y: 4.0,
      foldB_z: 3.0,

      // Quality
      antialias: true,
      dpr: Math.min(window.devicePixelRatio || 1.0, 2.0)
    };

    // Target values for smooth lerp navigation
    const targetNav = {
      zoom: 1.0,
      panX: 0.0,
      panY: 0.0,
      rotX: 0.0,
      rotY: 0.0,
      rotZ: 0.0
    };

    // ------------------------------------------------------------------------
    // Shader Definitions
    // ------------------------------------------------------------------------
    const vertexShader = /* glsl */ `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = vec4(position, 1.0);
      }
    `;

    const fragmentShader = /* glsl */ `
      precision highp float;

      uniform vec2 uResolution;
      uniform float uTime;
      uniform float uAnimAngle;
      uniform float uAnimElevation;
      uniform float uPulseScale;
      uniform float uColorPhase;
      uniform float uSway;

      // Navigation uniforms
      uniform float uZoom;
      uniform vec2 uPan;
      uniform float uRotX;
      uniform float uRotY;
      uniform float uRotZ;

      // Geometry uniforms
      uniform vec3 uFoldA;
      uniform vec3 uFoldB;
      uniform float uScaleMult;
      uniform float uInversion;
      uniform float uFloorOffset;

      // Lighting uniforms
      uniform float uExposure;
      uniform float uSceneLightIntensity;
      uniform vec3 uKeyLightDir;
      uniform vec3 uKeyLightColor;
      uniform float uKeyLightIntensity;
      uniform vec3 uFillLightDir;
      uniform vec3 uFillLightColor;
      uniform float uFillLightIntensity;
      uniform vec3 uRimLightDir;
      uniform vec3 uRimLightColor;
      uniform float uRimLightIntensity;
      uniform vec3 uCoreLightColor;
      uniform float uCoreLightIntensity;

      // Color uniforms
      uniform int uSchemeType; // 0: HSV, 1: Palette, 2: Achromatic/Accent
      uniform vec3 uColor1;
      uniform vec3 uColor2;
      uniform vec3 uColor3;
      uniform vec3 uColor4;
      uniform vec3 uColor5;
      uniform vec3 uBgColor;
      uniform float uGreenScreen;
      uniform float uGlowIntensity;
      uniform float uSaturation;
      uniform float uColorShift;
      uniform float uAccentMix;

      mat2 rotate2D(float a) {
        float c = cos(a);
        float s = sin(a);
        return mat2(c, -s, s, c);
      }

      vec3 hsv(float h, float s, float v) {
        vec4 K = vec4(1.0, 2.0 / 3.0, 1.0 / 3.0, 3.0);
        vec3 p = abs(fract(vec3(h) + K.xyz) * 6.0 - K.www);
        return v * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), s);
      }

      vec3 getPaletteColor(float t) {
        t = fract(t);
        if (t < 0.25) {
          return mix(uColor1, uColor2, t / 0.25);
        } else if (t < 0.5) {
          return mix(uColor2, uColor3, (t - 0.25) / 0.25);
        } else if (t < 0.75) {
          return mix(uColor3, uColor4, (t - 0.5) / 0.25);
        } else {
          return mix(uColor4, uColor5, (t - 0.75) / 0.25);
        }
      }

      void main() {
        vec2 r = uResolution;
        vec2 fc = gl_FragCoord.xy;

        // Normalized screen coordinates
        vec2 uv = (fc - 0.5 * r) / r.y;
        uv = (uv - uPan) / uZoom;

        vec3 o = vec3(0.0);
        float g = 0.0;
        float e = 0.0;
        float s = 0.0;

        vec3 keyDir = normalize(uKeyLightDir);
        vec3 fillDir = normalize(uFillLightDir);
        vec3 rimDir = normalize(uRimLightDir);

        float effScaleMult = uScaleMult + uPulseScale;

        for (int i = 0; i < 99; i++) {
          vec3 p = vec3(uv + vec2(uSway, 0.5 + uAnimElevation), (g - 0.5) / uZoom);

          // 3D rotations
          p.yz = rotate2D(uRotY) * p.yz;
          p.xz = rotate2D(uRotX + uAnimAngle) * p.xz;
          p.xy = rotate2D(uRotZ) * p.xy;

          s = 2.0;

          // Mandelbox folding iterations
          for (int j = 0; j < 8; j++) {
            float pDot = max(dot(p, p), 0.0001);
            e = (effScaleMult * uInversion) / pDot;
            s *= e;
            p = uFoldA - abs(abs(p) * e - uFoldB);
          }

          float dist = min(length(p), p.y + uFloorOffset);
          g += 2e-4 + dist / s;
          s = log(max(s, 1.0001));

          // Normal direction approximation from p
          vec3 pNorm = normalize(p);
          float keyDot = max(dot(pNorm, keyDir), 0.0);
          float fillDot = max(dot(pNorm, fillDir), 0.0);
          float rimVal = pow(clamp(1.0 - abs(pNorm.z), 0.0, 1.0), 2.5);

          vec3 lightFactor = (uKeyLightColor * (keyDot * uKeyLightIntensity)) +
                             (uFillLightColor * (fillDot * uFillLightIntensity)) +
                             (uRimLightColor * (rimVal * uRimLightIntensity)) +
                             (uCoreLightColor * uCoreLightIntensity);

          float val = (s / 900.0) * uGlowIntensity;
          vec3 stepCol = vec3(0.0);

          if (uSchemeType == 0) {
            stepCol = hsv(s / 15.0 + uColorShift + uColorPhase, uSaturation, val);
          } else if (uSchemeType == 1) {
            vec3 pal = getPaletteColor(s * 0.02 + uColorShift + uColorPhase);
            stepCol = pal * val;
          } else {
            vec3 pal = getPaletteColor(s * 0.015 + uColorPhase);
            float foldHighlight = smoothstep(2.3, 4.2, s);
            pal = mix(pal, uColor3, foldHighlight * uAccentMix);
            stepCol = pal * val;
          }

          stepCol *= lightFactor * uSceneLightIntensity;
          o += stepCol;
        }

        // Tone mapping & exposure
        o *= uExposure;
        o = o / (1.0 + o);
        o = pow(o, vec3(1.0 / 1.55));

        vec3 finalBg = uGreenScreen > 0.5 ? vec3(0.0, 1.0, 0.0) : uBgColor;
        float alpha = clamp(length(o) * 1.6, 0.0, 1.0);

        if (uGreenScreen > 0.5) {
          vec3 composite = mix(vec3(0.0, 1.0, 0.0), o, smoothstep(0.03, 0.18, alpha));
          gl_FragColor = vec4(composite, 1.0);
        } else {
          vec3 composite = mix(finalBg, o, smoothstep(0.01, 0.15, alpha));
          gl_FragColor = vec4(composite, 1.0);
        }
      }
    `;

    // ------------------------------------------------------------------------
    // Three.js Scene, Material & Uniforms
    // ------------------------------------------------------------------------
    let renderer, scene, camera, mesh, material;

    const uniforms = {
      uResolution: { value: new THREE.Vector2() },
      uTime: { value: 0.0 },
      uAnimAngle: { value: 0.0 },
      uAnimElevation: { value: 0.0 },
      uPulseScale: { value: 0.0 },
      uColorPhase: { value: 0.0 },
      uSway: { value: 0.0 },

      uZoom: { value: 1.0 },
      uPan: { value: new THREE.Vector2(0.0, 0.0) },
      uRotX: { value: 0.0 },
      uRotY: { value: 0.0 },
      uRotZ: { value: 0.0 },

      uFoldA: { value: new THREE.Vector3(2.0, 4.0, 2.0) },
      uFoldB: { value: new THREE.Vector3(6.0, 4.0, 3.0) },
      uScaleMult: { value: 1.05 },
      uInversion: { value: 7.0 },
      uFloorOffset: { value: 0.0 },

      uExposure: { value: 1.0 },
      uSceneLightIntensity: { value: 1.0 },
      uKeyLightDir: { value: new THREE.Vector3(1.0, 1.5, 0.8) },
      uKeyLightColor: { value: new THREE.Color('#fff2db') },
      uKeyLightIntensity: { value: 1.2 },
      uFillLightDir: { value: new THREE.Vector3(-1.0, -0.5, -0.5) },
      uFillLightColor: { value: new THREE.Color('#a0dbf0') },
      uFillLightIntensity: { value: 0.8 },
      uRimLightDir: { value: new THREE.Vector3(0.0, 1.0, -1.5) },
      uRimLightColor: { value: new THREE.Color('#ff66d0') },
      uRimLightIntensity: { value: 1.5 },
      uCoreLightColor: { value: new THREE.Color('#ffffff') },
      uCoreLightIntensity: { value: 1.0 },

      uSchemeType: { value: 0 },
      uColor1: { value: new THREE.Color(colorSchemes['Original'].c1) },
      uColor2: { value: new THREE.Color(colorSchemes['Original'].c2) },
      uColor3: { value: new THREE.Color(colorSchemes['Original'].c3) },
      uColor4: { value: new THREE.Color(colorSchemes['Original'].c4) },
      uColor5: { value: new THREE.Color(colorSchemes['Original'].c5) },
      uBgColor: { value: new THREE.Color(colorSchemes['Original'].bg) },
      uGreenScreen: { value: 0.0 },
      uGlowIntensity: { value: 1.0 },
      uSaturation: { value: 0.2 },
      uColorShift: { value: 0.0 },
      uAccentMix: { value: 0.0 }
    };

    function syncUniformsFromSettings() {
      uniforms.uZoom.value = settings.zoom;
      uniforms.uPan.value.set(settings.panX, settings.panY);
      uniforms.uRotX.value = settings.rotX;
      uniforms.uRotY.value = settings.rotY;
      uniforms.uRotZ.value = settings.rotZ;

      uniforms.uFoldA.value.set(settings.foldA_x, settings.foldA_y, settings.foldA_z);
      uniforms.uFoldB.value.set(settings.foldB_x, settings.foldB_y, settings.foldB_z);
      uniforms.uScaleMult.value = settings.scaleMult;
      uniforms.uInversion.value = settings.inversion;
      uniforms.uFloorOffset.value = settings.floorOffset;

      uniforms.uExposure.value = settings.exposure;
      uniforms.uSceneLightIntensity.value = settings.sceneLightIntensity;
      uniforms.uKeyLightColor.value.set(settings.keyLightColor);
      uniforms.uKeyLightIntensity.value = settings.keyLightIntensity;
      uniforms.uFillLightColor.value.set(settings.fillLightColor);
      uniforms.uFillLightIntensity.value = settings.fillLightIntensity;
      uniforms.uRimLightColor.value.set(settings.rimLightColor);
      uniforms.uRimLightIntensity.value = settings.rimLightIntensity;
      uniforms.uCoreLightColor.value.set(settings.coreLightColor);
      uniforms.uCoreLightIntensity.value = settings.coreLightIntensity;

      const scheme = colorSchemes[settings.colorScheme] || colorSchemes['Original'];
      uniforms.uSchemeType.value = scheme.type;
      uniforms.uColor1.value.set(settings.color1);
      uniforms.uColor2.value.set(settings.color2);
      uniforms.uColor3.value.set(settings.color3);
      uniforms.uColor4.value.set(settings.color4);
      uniforms.uColor5.value.set(settings.color5);
      uniforms.uBgColor.value.set(settings.bgColor);
      uniforms.uGreenScreen.value = settings.greenScreen ? 1.0 : 0.0;
      uniforms.uGlowIntensity.value = settings.glowIntensity;
      uniforms.uSaturation.value = settings.saturation;
      uniforms.uColorShift.value = settings.colorShift;
      uniforms.uAccentMix.value = settings.accentMix;

      if (settings.greenScreen) {
        document.body.classList.add('greenscreen');
      } else {
        document.body.classList.remove('greenscreen');
        document.body.style.backgroundColor = settings.bgColor;
      }
    }

    function initThree(antialias) {
      if (renderer) {
        renderer.dispose();
        if (renderer.domElement && renderer.domElement.parentElement) {
          renderer.domElement.parentElement.removeChild(renderer.domElement);
        }
      }

      renderer = new THREE.WebGLRenderer({
        antialias: antialias,
        powerPreference: 'high-performance'
      });
      renderer.setPixelRatio(settings.dpr);
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      if (antialias) {
        document.body.classList.add('antialias-on');
        document.body.classList.remove('antialias-off');
      } else {
        document.body.classList.add('antialias-off');
        document.body.classList.remove('antialias-on');
      }

      scene = new THREE.Scene();
      camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

      material = new THREE.ShaderMaterial({
        vertexShader,
        fragmentShader,
        uniforms,
        depthWrite: false,
        depthTest: false
      });

      const geometry = new THREE.PlaneGeometry(2, 2);
      mesh = new THREE.Mesh(geometry, material);
      scene.add(mesh);

      onWindowResize();
      setupPointerEvents(renderer.domElement);
    }

    function onWindowResize() {
      if (!renderer) return;
      const w = window.innerWidth;
      const h = window.innerHeight;
      renderer.setSize(w, h);
      renderer.setPixelRatio(settings.dpr);
      uniforms.uResolution.value.set(w * settings.dpr, h * settings.dpr);
    }

    window.addEventListener('resize', onWindowResize);

    // ------------------------------------------------------------------------
    // Drag & Zoom Interaction
    // ------------------------------------------------------------------------
    let isPointerDown = false;
    let pointerStartX = 0;
    let pointerStartY = 0;
    let lastPointerX = 0;
    let lastPointerY = 0;
    let pointerDownTime = 0;
    let hasMoved = false;

    function setupPointerEvents(canvasElement) {
      canvasElement.addEventListener('pointerdown', (e) => {
        if (e.target.closest('.lil-gui')) return;
        isPointerDown = true;
        hasMoved = false;
        pointerStartX = e.clientX;
        pointerStartY = e.clientY;
        lastPointerX = e.clientX;
        lastPointerY = e.clientY;
        pointerDownTime = performance.now();
      });

      window.addEventListener('pointermove', (e) => {
        if (!isPointerDown) return;
        const dx = e.clientX - lastPointerX;
        const dy = e.clientY - lastPointerY;
        lastPointerX = e.clientX;
        lastPointerY = e.clientY;

        const totalDist = Math.hypot(e.clientX - pointerStartX, e.clientY - pointerStartY);
        if (totalDist > 5) {
          hasMoved = true;
        }

        const isPan = (e.buttons === 2) || e.shiftKey || (settings.dragAction === 'Pan (Screen Drag)');

        if (isPan) {
          // Drag object across screen
          targetNav.panX += (dx / window.innerHeight) * 1.5;
          targetNav.panY -= (dy / window.innerHeight) * 1.5;
          settings.panX = targetNav.panX;
          settings.panY = targetNav.panY;
          if (controllers.panX) controllers.panX.updateDisplay();
          if (controllers.panY) controllers.panY.updateDisplay();
        } else {
          // 3D rotation
          targetNav.rotX += dx * 0.007;
          targetNav.rotY += dy * 0.007;
          settings.rotX = targetNav.rotX;
          settings.rotY = targetNav.rotY;
          if (controllers.rotX) controllers.rotX.updateDisplay();
          if (controllers.rotY) controllers.rotY.updateDisplay();
        }
      });

      window.addEventListener('pointerup', (e) => {
        if (!isPointerDown) return;
        isPointerDown = false;

        const duration = performance.now() - pointerDownTime;
        const totalDist = Math.hypot(e.clientX - pointerStartX, e.clientY - pointerStartY);

        // Clean user click detection (not dragged)
        if (!hasMoved && totalDist < 6 && duration < 320) {
          if (!e.target.closest('.lil-gui') && settings.clickToRandomize) {
            randomizeScene();
          }
        }
      });

      // Wheel Zoom
      canvasElement.addEventListener('wheel', (e) => {
        e.preventDefault();
        const factor = e.deltaY < 0 ? 1.08 : 0.92;
        targetNav.zoom = Math.max(0.15, Math.min(10.0, targetNav.zoom * factor));
        settings.zoom = targetNav.zoom;
        if (controllers.zoom) controllers.zoom.updateDisplay();
      }, { passive: false });

      // Prevent context menu on right-click to enable right-drag panning
      canvasElement.addEventListener('contextmenu', (e) => {
        e.preventDefault();
      });
    }

    // ------------------------------------------------------------------------
    // Apply Preset Helpers
    // ------------------------------------------------------------------------
    function applyColorScheme(name) {
      const scheme = colorSchemes[name];
      if (!scheme) return;
      settings.colorScheme = name;
      settings.color1 = scheme.c1;
      settings.color2 = scheme.c2;
      settings.color3 = scheme.c3;
      settings.color4 = scheme.c4;
      settings.color5 = scheme.c5;
      settings.bgColor = scheme.bg;
      settings.glowIntensity = scheme.glow;
      settings.saturation = scheme.saturation;
      settings.accentMix = scheme.accentMix;

      syncUniformsFromSettings();

      if (gui) {
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      }
    }

    // ------------------------------------------------------------------------
    // Procedural Theme & Geometry Randomizer (Triggered on User Click)
    // ------------------------------------------------------------------------
    function randomizeScene() {
      // 1. Pick a random color scheme from the 19 preconfigured schemes
      const schemeNames = Object.keys(colorSchemes);
      const randomScheme = schemeNames[Math.floor(Math.random() * schemeNames.length)];
      applyColorScheme(randomScheme);

      // Occasionally add a subtle procedural color shift for infinite variety
      if (Math.random() > 0.35) {
        settings.colorShift = Math.random();
      }

      // 2. Re-roll geometric parameters within aesthetic Mandelbox bounds
      settings.foldA_x = +(1.5 + Math.random() * 1.2).toFixed(2);
      settings.foldA_y = +(3.2 + Math.random() * 1.8).toFixed(2);
      settings.foldA_z = +(1.5 + Math.random() * 1.2).toFixed(2);

      settings.foldB_x = +(4.6 + Math.random() * 2.8).toFixed(2);
      settings.foldB_y = +(3.0 + Math.random() * 2.0).toFixed(2);
      settings.foldB_z = +(2.0 + Math.random() * 2.0).toFixed(2);

      settings.scaleMult = +(0.98 + Math.random() * 0.16).toFixed(3);
      settings.inversion = +(5.8 + Math.random() * 2.6).toFixed(2);
      settings.floorOffset = +(-0.3 + Math.random() * 0.6).toFixed(2);

      // 3. Re-roll motion & animation
      const randomAnim = animationModes[Math.floor(Math.random() * animationModes.length)];
      settings.animation = randomAnim;
      settings.animationSpeed = +(0.6 + Math.random() * 0.9).toFixed(2);

      // 4. Re-roll lighting parameters
      settings.keyLightIntensity = +(0.8 + Math.random() * 0.8).toFixed(2);
      settings.fillLightIntensity = +(0.5 + Math.random() * 0.6).toFixed(2);
      settings.rimLightIntensity = +(1.0 + Math.random() * 1.0).toFixed(2);
      settings.coreLightIntensity = +(0.7 + Math.random() * 0.7).toFixed(2);
      settings.exposure = +(0.85 + Math.random() * 0.35).toFixed(2);

      syncUniformsFromSettings();

      if (gui) {
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      }
    }

    // ------------------------------------------------------------------------
    // Reset Navigation
    // ------------------------------------------------------------------------
    function resetNavigation() {
      targetNav.zoom = 1.0;
      targetNav.panX = 0.0;
      targetNav.panY = 0.0;
      targetNav.rotX = 0.0;
      targetNav.rotY = 0.0;
      targetNav.rotZ = 0.0;

      settings.zoom = 1.0;
      settings.panX = 0.0;
      settings.panY = 0.0;
      settings.rotX = 0.0;
      settings.rotY = 0.0;
      settings.rotZ = 0.0;

      if (gui) {
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      }
    }

    // ------------------------------------------------------------------------
    // lil-gui Controls Panel Setup
    // ------------------------------------------------------------------------
    const gui = new GUI({ title: 'Kaleidoscope Studio' });
    const controllers = {};

    // 1. Scene & Presets Folder
    const fPresets = gui.addFolder('Scene & Presets');
    controllers.colorScheme = fPresets.add(settings, 'colorScheme', Object.keys(colorSchemes))
      .name('Color Scheme')
      .onChange(applyColorScheme);

    controllers.greenScreen = fPresets.add(settings, 'greenScreen')
      .name('Greenscreen (#00ff00)')
      .onChange(syncUniformsFromSettings);

    controllers.animation = fPresets.add(settings, 'animation', animationModes)
      .name('Animation');

    controllers.animationSpeed = fPresets.add(settings, 'animationSpeed', 0.0, 3.0, 0.05)
      .name('Anim Speed');

    controllers.clickToRandomize = fPresets.add(settings, 'clickToRandomize')
      .name('Click to Randomize');

    fPresets.add({ randomize: randomizeScene }, 'randomize')
      .name('Randomize Now');

    // 2. Navigation & Drag Folder
    const fNav = gui.addFolder('Navigation & Camera');
    controllers.zoom = fNav.add(settings, 'zoom', 0.2, 8.0, 0.01)
      .name('Zoom')
      .onChange(v => { targetNav.zoom = v; syncUniformsFromSettings(); });

    controllers.panX = fNav.add(settings, 'panX', -3.0, 3.0, 0.01)
      .name('Pan X')
      .onChange(v => { targetNav.panX = v; syncUniformsFromSettings(); });

    controllers.panY = fNav.add(settings, 'panY', -3.0, 3.0, 0.01)
      .name('Pan Y')
      .onChange(v => { targetNav.panY = v; syncUniformsFromSettings(); });

    controllers.rotX = fNav.add(settings, 'rotX', -Math.PI * 2, Math.PI * 2, 0.01)
      .name('Rotate X')
      .onChange(v => { targetNav.rotX = v; syncUniformsFromSettings(); });

    controllers.rotY = fNav.add(settings, 'rotY', -Math.PI * 2, Math.PI * 2, 0.01)
      .name('Rotate Y')
      .onChange(v => { targetNav.rotY = v; syncUniformsFromSettings(); });

    controllers.dragAction = fNav.add(settings, 'dragAction', ['Rotate (3D)', 'Pan (Screen Drag)'])
      .name('Left Drag Mode');

    fNav.add({ reset: resetNavigation }, 'reset')
      .name('Reset Camera');

    // 3. Lighting & Exposure Folder
    const fLight = gui.addFolder('Lighting & Exposure');
    controllers.exposure = fLight.add(settings, 'exposure', 0.1, 3.0, 0.05)
      .name('Exposure')
      .onChange(syncUniformsFromSettings);

    controllers.sceneLightIntensity = fLight.add(settings, 'sceneLightIntensity', 0.0, 3.0, 0.05)
      .name('Scene Light Mult')
      .onChange(syncUniformsFromSettings);

    const fKey = fLight.addFolder('Key Light');
    fKey.add(settings, 'keyLightIntensity', 0.0, 3.0, 0.05).name('Intensity').onChange(syncUniformsFromSettings);
    fKey.addColor(settings, 'keyLightColor').name('Color').onChange(syncUniformsFromSettings);

    const fFill = fLight.addFolder('Fill Light');
    fFill.add(settings, 'fillLightIntensity', 0.0, 3.0, 0.05).name('Intensity').onChange(syncUniformsFromSettings);
    fFill.addColor(settings, 'fillLightColor').name('Color').onChange(syncUniformsFromSettings);

    const fRim = fLight.addFolder('Rim Light');
    fRim.add(settings, 'rimLightIntensity', 0.0, 3.0, 0.05).name('Intensity').onChange(syncUniformsFromSettings);
    fRim.addColor(settings, 'rimLightColor').name('Color').onChange(syncUniformsFromSettings);

    const fCore = fLight.addFolder('Core Glow');
    fCore.add(settings, 'coreLightIntensity', 0.0, 3.0, 0.05).name('Intensity').onChange(syncUniformsFromSettings);
    fCore.addColor(settings, 'coreLightColor').name('Color').onChange(syncUniformsFromSettings);

    // 4. Color Palette Modifiers Folder
    const fColors = gui.addFolder('Colors & Palette');
    fColors.addColor(settings, 'color1').name('Color 1').onChange(syncUniformsFromSettings);
    fColors.addColor(settings, 'color2').name('Color 2').onChange(syncUniformsFromSettings);
    fColors.addColor(settings, 'color3').name('Color 3').onChange(syncUniformsFromSettings);
    fColors.addColor(settings, 'color4').name('Color 4').onChange(syncUniformsFromSettings);
    fColors.addColor(settings, 'color5').name('Color 5').onChange(syncUniformsFromSettings);
    fColors.addColor(settings, 'bgColor').name('Background Color').onChange(syncUniformsFromSettings);
    fColors.add(settings, 'glowIntensity', 0.1, 3.0, 0.05).name('Glow Density').onChange(syncUniformsFromSettings);
    fColors.add(settings, 'saturation', 0.0, 1.0, 0.01).name('Saturation').onChange(syncUniformsFromSettings);
    fColors.add(settings, 'colorShift', 0.0, 1.0, 0.01).name('Hue / Phase Shift').onChange(syncUniformsFromSettings);

    // 5. Fractal Geometry Folder
    const fGeo = gui.addFolder('Fractal Geometry');
    fGeo.add(settings, 'scaleMult', 0.85, 1.3, 0.01).name('Scale Multiplier').onChange(syncUniformsFromSettings);
    fGeo.add(settings, 'inversion', 4.0, 11.0, 0.1).name('Sphere Inversion').onChange(syncUniformsFromSettings);
    fGeo.add(settings, 'floorOffset', -1.0, 1.0, 0.02).name('Floor Offset').onChange(syncUniformsFromSettings);
    fGeo.add(settings, 'foldA_x', 0.5, 4.0, 0.05).name('Fold A.x').onChange(syncUniformsFromSettings);
    fGeo.add(settings, 'foldA_y', 0.5, 6.0, 0.05).name('Fold A.y').onChange(syncUniformsFromSettings);
    fGeo.add(settings, 'foldA_z', 0.5, 4.0, 0.05).name('Fold A.z').onChange(syncUniformsFromSettings);
    fGeo.add(settings, 'foldB_x', 1.0, 10.0, 0.1).name('Fold B.x').onChange(syncUniformsFromSettings);
    fGeo.add(settings, 'foldB_y', 1.0, 8.0, 0.1).name('Fold B.y').onChange(syncUniformsFromSettings);
    fGeo.add(settings, 'foldB_z', 1.0, 8.0, 0.1).name('Fold B.z').onChange(syncUniformsFromSettings);

    // 6. Quality & Performance Folder
    const fQuality = gui.addFolder('Quality & Performance');
    fQuality.add(settings, 'antialias')
      .name('Three.js Antialias')
      .onChange(v => {
        initThree(v);
        syncUniformsFromSettings();
      });

    fQuality.add(settings, 'dpr', 0.5, 2.5, 0.1)
      .name('Pixel Ratio (DPR)')
      .onChange(onWindowResize);

    // Keyboard shortcut "H" to toggle GUI visibility
    let isGuiVisible = true;
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        isGuiVisible = !isGuiVisible;
        gui.show(isGuiVisible);
      }
    });

    // ------------------------------------------------------------------------
    // Animation Loop
    // ------------------------------------------------------------------------
    const clock = new THREE.Clock();
    let animTime = 0.0;

    function animate() {
      requestAnimationFrame(animate);

      const delta = Math.min(clock.getDelta(), 0.06);
      animTime += delta * settings.animationSpeed;

      // Smooth interpolation for navigation (drag & wheel)
      settings.zoom += (targetNav.zoom - settings.zoom) * 0.12;
      settings.panX += (targetNav.panX - settings.panX) * 0.12;
      settings.panY += (targetNav.panY - settings.panY) * 0.12;
      settings.rotX += (targetNav.rotX - settings.rotX) * 0.12;
      settings.rotY += (targetNav.rotY - settings.rotY) * 0.12;
      settings.rotZ += (targetNav.rotZ - settings.rotZ) * 0.12;

      uniforms.uZoom.value = settings.zoom;
      uniforms.uPan.value.set(settings.panX, settings.panY);
      uniforms.uRotX.value = settings.rotX;
      uniforms.uRotY.value = settings.rotY;
      uniforms.uRotZ.value = settings.rotZ;

      uniforms.uTime.value = animTime;

      // Evaluate selected animation preset
      let animAngle = 0.0;
      let animElevation = 0.0;
      let pulseScale = 0.0;
      let colorPhase = 0.0;
      let sway = 0.0;

      switch (settings.animation) {
        case 'Static (No Movement)':
          // Perfectly motionless, camera static
          animAngle = 0.0;
          animElevation = 0.0;
          pulseScale = 0.0;
          sway = 0.0;
          colorPhase = 0.0;
          break;

        case 'Cosmic Drift':
          // Slow, hypnotic turntable rotation
          animAngle = animTime * 0.18;
          animElevation = Math.sin(animTime * 0.1) * 0.06;
          break;

        case 'Cathedral Breathing':
          // Gentle rhythmic dilation of fractal folding
          animAngle = animTime * 0.08;
          pulseScale = Math.sin(animTime * 0.3) * 0.045;
          break;

        case 'Cinematic Orbit':
          // Slow sweeping 360 orbit with elevation oscillation
          animAngle = animTime * 0.22;
          animElevation = Math.sin(animTime * 0.14) * 0.18;
          sway = Math.cos(animTime * 0.16) * 0.1;
          break;

        case 'Ascending Spire':
          // Continuous graceful ascension through towering arches
          animAngle = animTime * 0.06;
          animElevation = (Math.sin(animTime * 0.15) * 0.25);
          break;

        case 'Misty Pendulum':
          // Slow pendulum sway like a majestic aerial observer
          animAngle = Math.sin(animTime * 0.14) * 0.3;
          animElevation = Math.cos(animTime * 0.12) * 0.08;
          sway = Math.sin(animTime * 0.14) * 0.12;
          break;

        case 'Hypercube Twist':
          // Multi-axis harmonic spatial rotation
          animAngle = animTime * 0.12;
          animElevation = Math.sin(animTime * 0.18) * 0.14;
          pulseScale = Math.sin(animTime * 0.25) * 0.03;
          sway = Math.cos(animTime * 0.1) * 0.08;
          break;

        case 'Ethereal Shimmer':
          // Static camera angle with undulating light & color waves
          animAngle = 0.0;
          animElevation = 0.0;
          colorPhase = animTime * 0.12;
          pulseScale = Math.sin(animTime * 0.35) * 0.015;
          break;
      }

      uniforms.uAnimAngle.value = animAngle;
      uniforms.uAnimElevation.value = animElevation;
      uniforms.uPulseScale.value = pulseScale;
      uniforms.uColorPhase.value = colorPhase;
      uniforms.uSway.value = sway;

      renderer.render(scene, camera);
    }

    // ------------------------------------------------------------------------
    // Initialize Studio
    // ------------------------------------------------------------------------
    initThree(settings.antialias);
    syncUniformsFromSettings();
    animate();
  </script>
</body>
</html>
