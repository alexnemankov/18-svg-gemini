<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simulation Theory - Gyroid Fractal</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      user-select: none;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container">
    <canvas id="webgl-canvas"></canvas>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import GUI from 'lil-gui';

    // --- 19 Preconfigured Color Schemes ---
    const COLOR_SCHEMES = {
      'Original': {
        mode: 0,
        c1: '#0066ff', c2: '#00ccff', c3: '#6600cc', c4: '#330066', c5: '#000022'
      },
      'Monochromatic': {
        mode: 2,
        c1: '#061a40', c2: '#0063cc', c3: '#0099ff', c4: '#66c2ff', c5: '#b3e0ff'
      },
      'Analogous': {
        mode: 1,
        c1: '#310a5d', c2: '#5b189a', c3: '#1565c0', c4: '#00838f', c5: '#00e5ff'
      },
      'Complementary': {
        mode: 1,
        c1: '#022b3a', c2: '#00b4d8', c3: '#90e0ef', c4: '#ff7700', c5: '#e63946'
      },
      'Split-complementary': {
        mode: 1,
        c1: '#240046', c2: '#9d0208', c3: '#e85d04', c4: '#ffb703', c5: '#00f5d4'
      },
      'Triadic': {
        mode: 1,
        c1: '#140152', c2: '#020079', c3: '#d90429', c4: '#f77f00', c5: '#ffea00'
      },
      'Tetradic': {
        mode: 1,
        c1: '#3a0ca3', c2: '#4361ee', c3: '#4cc9f0', c4: '#f72585', c5: '#7209b7'
      },
      'Double split-complementary': {
        mode: 1,
        c1: '#1b1b3a', c2: '#6930c3', c3: '#ff5400', c4: '#ffb703', c5: '#00f5d4'
      },
      'Achromatic (B&W)': {
        mode: 3,
        c1: '#000000', c2: '#333333', c3: '#777777', c4: '#cccccc', c5: '#ffffff'
      },
      'Achromatic + Accent (B&W + Red)': {
        mode: 4,
        c1: '#000000', c2: '#222222', c3: '#ff0037', c4: '#888888', c5: '#ffffff'
      },
      'Neutral + Accent': {
        mode: 5,
        c1: '#171514', c2: '#2b2725', c3: '#59524c', c4: '#968c82', c5: '#ffb703'
      },
      'Palette 1 (F6AA1C, BC3908...)': {
        mode: 1,
        c1: '#F6AA1C', c2: '#BC3908', c3: '#941B0C', c4: '#F6AA1C', c5: '#220901'
      },
      'Palette 2 (63D1CF, 5BC0BE...)': {
        mode: 1,
        c1: '#63D1CF', c2: '#5BC0BE', c3: '#4BAD9E', c4: '#0B132B', c5: '#000000'
      },
      'Palette 3 (AA60C8, D69ADE...)': {
        mode: 1,
        c1: '#AA60C8', c2: '#D69ADE', c3: '#C9A3C6', c4: '#CFB5C2', c5: '#0D001D'
      },
      'Palette 4 (FEF1BE, FFBA00...)': {
        mode: 1,
        c1: '#FEF1BE', c2: '#FFBA00', c3: '#008189', c4: '#00474D', c5: '#061210'
      },
      'Palette 5 (D4FFB0, 7FFF00...)': {
        mode: 1,
        c1: '#D4FFB0', c2: '#7FFF00', c3: '#00B894', c4: '#0A3322', c5: '#05140A'
      },
      'Palette 6 (FFE8CC, FF8C00...)': {
        mode: 1,
        c1: '#FFE8CC', c2: '#FF8C00', c3: '#C7501A', c4: '#3D1050', c5: '#0E0618'
      },
      'Palette 7 (E8E0FF, B38FFF...)': {
        mode: 1,
        c1: '#E8E0FF', c2: '#B38FFF', c3: '#6A3DE8', c4: '#1A1250', c5: '#090612'
      },
      'Palette 8 (E0FBFF, 00F0FF...)': {
        mode: 1,
        c1: '#E0FBFF', c2: '#00F0FF', c3: '#D40078', c4: '#1E0A3D', c5: '#05020F'
      }
    };

    // --- 8 Preconfigured Animations ---
    const ANIMATION_MODES = [
      'Cosmic Drift',
      'Deep Pulse',
      'Quantum Flow',
      'Hypnotic Undulation',
      'Ethereal Float',
      'Zen Bloom',
      'Gravitational Tilt',
      'Static Zen'
    ];

    // --- Scene Parameters ---
    const params = {
      // Greenscreen & View
      greenscreen: false,
      zoom: 1.0,
      panX: 0.0,
      panY: 0.0,

      // Performance & Display
      dpr: Math.min(window.devicePixelRatio || 1, 2.0),
      antialias: true,

      // Animation
      animation: 'Cosmic Drift',
      speed: 1.0,

      // Color Scheme
      colorScheme: 'Original',
      color1: COLOR_SCHEMES['Original'].c1,
      color2: COLOR_SCHEMES['Original'].c2,
      color3: COLOR_SCHEMES['Original'].c3,
      color4: COLOR_SCHEMES['Original'].c4,
      color5: COLOR_SCHEMES['Original'].c5,

      // Lighting & Exposure
      exposure: 1.0,
      ambientIntensity: 0.85,
      ambientColor: '#ffffff',
      keyLightIntensity: 1.25,
      keyLightColor: '#fff5e6',
      keyLightAngle: 45.0,
      accentLightIntensity: 0.9,
      accentLightColor: '#00f0ff',

      // Procedural Geometry
      baseScale: 4.0,
      geoParam1: 0.5,
      geoParam2: 0.2,
      amp: 0.02,
      noiseStrength: 0.6,

      // Interaction
      clickToRandomize: true,
      resetView: () => {
        params.zoom = 1.0;
        params.panX = 0.0;
        params.panY = 0.0;
        updatePanZoomUniforms();
        gui.controllersRecursive().forEach(c => {
          if (['zoom', 'panX', 'panY'].includes(c.property)) c.updateDisplay();
        });
      },
      randomize: () => randomizeScene()
    };

    // --- Shaders ---
    const vertexShader = `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = vec4(position, 1.0);
      }
    `;

    const fragmentShader = `
      precision highp float;

      uniform vec2 uResolution;
      uniform float uTime;
      uniform float uZoom;
      uniform vec2 uPan;
      uniform mat3 uCamRot;

      // Dynamic animation parameters
      uniform float uMorphTime;
      uniform float uPulseOffset;

      // Geometric parameters
      uniform float uBaseScale;
      uniform float uGeoParam1;
      uniform float uGeoParam2;
      uniform float uAmp;
      uniform float uNoiseStrength;

      // Color uniforms
      uniform int uColorMode;
      uniform vec3 uColor1;
      uniform vec3 uColor2;
      uniform vec3 uColor3;
      uniform vec3 uColor4;
      uniform vec3 uColor5;

      // Greenscreen & Lighting
      uniform bool uGreenscreen;
      uniform float uExposure;
      uniform float uAmbientIntensity;
      uniform vec3 uAmbientColor;
      uniform float uKeyLightIntensity;
      uniform vec3 uKeyLightColor;
      uniform vec3 uKeyLightDir;
      uniform float uAccentLightIntensity;
      uniform vec3 uAccentLightColor;

      // HSV conversion helper from original shader
      vec3 hsv(float h, float s, float v) {
        vec4 t = vec4(1.0, 2.0 / 3.0, 1.0 / 3.0, 3.0);
        vec3 p = abs(fract(vec3(h) + t.xyz) * 6.0 - vec3(t.w));
        return v * mix(vec3(t.x), clamp(p - vec3(t.x), 0.0, 1.0), s);
      }

      // Smooth 5-color palette interpolator
      vec3 samplePalette(float t) {
        float f = clamp(t, 0.0, 1.0) * 4.0;
        if (f < 1.0) return mix(uColor1, uColor2, f);
        if (f < 2.0) return mix(uColor2, uColor3, f - 1.0);
        if (f < 3.0) return mix(uColor3, uColor4, f - 2.0);
        return mix(uColor4, uColor5, f - 3.0);
      }

      void main() {
        vec2 r = uResolution.xy;
        vec2 FC = gl_FragCoord.xy;
        float t = uMorphTime;
        vec4 o = vec4(0.0, 0.0, 0.0, 1.0);
        float i = 0.0;
        float e = 0.0;
        float g = 0.0;
        float R = 0.0;
        float s = 0.0;

        // View Ray Direction & Origin with Pan, Zoom and Camera Rotation
        vec2 uv = (FC.xy / r - vec2(0.6) - uPan) / uZoom;
        vec3 d = normalize(uCamRot * vec3(uv, 1.0));
        vec3 q = uCamRot * vec3(0.0, -1.0, -1.0);
        vec3 p = vec3(0.0);

        // Core Yohei Nishitsuji raymarching iteration loop (99 steps)
        for (int stepIdx = 0; stepIdx < 99; stepIdx++) {
          i += 1.0;
          e += i / 8e5;

          float energy = e * i / 40.0;

          // Color Scheme Accumulation
          if (uColorMode == 0) {
            // Original HSV formula
            o.rgb += hsv(0.6, R + g * 0.3, energy);
          } else if (uColorMode == 1) {
            // 5-Color Harmonic Gradient
            float tCol = clamp(fract(R * 0.35 + g * 0.2 + (i / 99.0) * 0.35), 0.0, 1.0);
            o.rgb += samplePalette(tCol) * energy;
          } else if (uColorMode == 2) {
            // Monochromatic gradation
            float tCol = clamp(R * 0.45 + g * 0.25, 0.0, 1.0);
            o.rgb += mix(uColor1, uColor2, tCol) * energy;
          } else if (uColorMode == 3) {
            // Achromatic (Pure Black & White)
            o.rgb += vec3(energy * 0.9);
          } else if (uColorMode == 4) {
            // Achromatic + Crimson Accent
            float accent = smoothstep(0.4, 0.9, sin(R * 5.0 + g * 2.0));
            vec3 bw = vec3(energy * 0.75);
            vec3 acc = uColor3 * energy * 1.6;
            o.rgb += mix(bw, acc, accent);
          } else if (uColorMode == 5) {
            // Neutral + Radiant Accent
            float accent = smoothstep(0.5, 0.95, sin(R * 3.5 + g * 3.0 + t * 0.5));
            vec3 neutral = mix(uColor1, uColor2, clamp(R * 0.3 + g * 0.3, 0.0, 1.0));
            o.rgb += mix(neutral * energy * 0.9, uColor5 * energy * 2.2, accent);
          }

          s = uBaseScale;
          p = (q += d * e * R * 0.2);
          g += p.y / s;

          // Geometric spatial transformation
          p = vec3(
            (R = length(p)) - (uGeoParam1 + uPulseOffset) + sin(t) * uAmp,
            exp2(mod(-p.z, s) / R) - uGeoParam2,
            p.x
          );

          // Inner multi-frequency noise loop
          p.y -= 1.0;
          e = p.y;
          for (int inner = 0; inner < 8; inner++) {
            if (s >= 1e3) break;
            e += 0.03 - abs(dot(sin(p.yzx * s), cos(p.xzz * s)) / s * uNoiseStrength);
            s += s;
          }
        }

        // Lighting calculation
        vec3 sceneLight = uAmbientColor * uAmbientIntensity;

        // Key light (Directional)
        float keyDiff = clamp(dot(d, -uKeyLightDir) * 0.5 + 0.5, 0.0, 1.0);
        sceneLight += uKeyLightColor * (keyDiff * uKeyLightIntensity);

        // Accent / Rim light
        float rim = pow(clamp(1.0 - abs(dot(d, vec3(0.0, 0.0, -1.0))), 0.0, 1.0), 2.2);
        sceneLight += uAccentLightColor * (rim * uAccentLightIntensity);

        // Apply lighting and exposure
        vec3 finalColor = o.rgb * sceneLight * uExposure;

        // Greenscreen background replacement
        if (uGreenscreen) {
          float density = clamp(length(o.rgb) * 1.6, 0.0, 1.0);
          vec3 greenBg = vec3(0.0, 1.0, 0.0);
          finalColor = mix(greenBg, finalColor, smoothstep(0.04, 0.32, density));
        }

        gl_FragColor = vec4(finalColor, 1.0);
      }
    `;

    // --- WebGL Setup ---
    const canvas = document.getElementById('webgl-canvas');
    let renderer, scene, camera, mesh, material;

    function hexToVec3(hex) {
      const col = new THREE.Color(hex);
      return new THREE.Vector3(col.r, col.g, col.b);
    }

    function getKeyLightDir(angleDeg) {
      const rad = (angleDeg * Math.PI) / 180;
      return new THREE.Vector3(Math.cos(rad), 0.75, Math.sin(rad)).normalize();
    }

    function initScene() {
      // Clean up previous renderer if re-initializing antialiasing
      if (renderer) {
        renderer.dispose();
      }

      renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: params.antialias,
        powerPreference: 'high-performance'
      });
      renderer.setPixelRatio(params.dpr);
      renderer.setSize(window.innerWidth, window.innerHeight);

      scene = new THREE.Scene();
      camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

      const activeScheme = COLOR_SCHEMES[params.colorScheme] || COLOR_SCHEMES['Original'];

      material = new THREE.ShaderMaterial({
        vertexShader,
        fragmentShader,
        uniforms: {
          uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
          uTime: { value: 0.0 },
          uZoom: { value: params.zoom },
          uPan: { value: new THREE.Vector2(params.panX, params.panY) },
          uCamRot: { value: new THREE.Matrix3().identity() },

          uMorphTime: { value: 0.0 },
          uPulseOffset: { value: 0.0 },

          uBaseScale: { value: params.baseScale },
          uGeoParam1: { value: params.geoParam1 },
          uGeoParam2: { value: params.geoParam2 },
          uAmp: { value: params.amp },
          uNoiseStrength: { value: params.noiseStrength },

          uColorMode: { value: activeScheme.mode },
          uColor1: { value: hexToVec3(params.color1) },
          uColor2: { value: hexToVec3(params.color2) },
          uColor3: { value: hexToVec3(params.color3) },
          uColor4: { value: hexToVec3(params.color4) },
          uColor5: { value: hexToVec3(params.color5) },

          uGreenscreen: { value: params.greenscreen },
          uExposure: { value: params.exposure },
          uAmbientIntensity: { value: params.ambientIntensity },
          uAmbientColor: { value: hexToVec3(params.ambientColor) },
          uKeyLightIntensity: { value: params.keyLightIntensity },
          uKeyLightColor: { value: hexToVec3(params.keyLightColor) },
          uKeyLightDir: { value: getKeyLightDir(params.keyLightAngle) },
          uAccentLightIntensity: { value: params.accentLightIntensity },
          uAccentLightColor: { value: hexToVec3(params.accentLightColor) }
        },
        depthWrite: false,
        depthTest: false
      });

      const geometry = new THREE.PlaneGeometry(2, 2);
      mesh = new THREE.Mesh(geometry, material);
      scene.add(mesh);
    }

    initScene();

    function onResize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      renderer.setSize(w, h);
      if (material) {
        material.uniforms.uResolution.value.set(w, h);
      }
    }
    window.addEventListener('resize', onResize);

    function updatePanZoomUniforms() {
      if (material) {
        material.uniforms.uPan.value.set(params.panX, params.panY);
        material.uniforms.uZoom.value = params.zoom;
      }
    }

    function applyColorScheme(name) {
      const scheme = COLOR_SCHEMES[name];
      if (!scheme) return;
      params.colorScheme = name;
      params.color1 = scheme.c1;
      params.color2 = scheme.c2;
      params.color3 = scheme.c3;
      params.color4 = scheme.c4;
      params.color5 = scheme.c5;

      material.uniforms.uColorMode.value = scheme.mode;
      material.uniforms.uColor1.value.copy(hexToVec3(params.color1));
      material.uniforms.uColor2.value.copy(hexToVec3(params.color2));
      material.uniforms.uColor3.value.copy(hexToVec3(params.color3));
      material.uniforms.uColor4.value.copy(hexToVec3(params.color4));
      material.uniforms.uColor5.value.copy(hexToVec3(params.color5));

      gui.controllersRecursive().forEach(c => {
        if (['colorScheme', 'color1', 'color2', 'color3', 'color4', 'color5'].includes(c.property)) {
          c.updateDisplay();
        }
      });
    }

    // --- Interactive Zoom and Drag Across Screen ---
    let isPointerDown = false;
    let pointerStart = { x: 0, y: 0 };
    let panStart = { x: 0, y: 0 };
    let totalDragDistance = 0;

    canvas.addEventListener('pointerdown', (e) => {
      if (e.button !== 0 && e.button !== 1) return;
      isPointerDown = true;
      pointerStart.x = e.clientX;
      pointerStart.y = e.clientY;
      panStart.x = params.panX;
      panStart.y = params.panY;
      totalDragDistance = 0;
      canvas.setPointerCapture(e.pointerId);
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!isPointerDown) return;
      const dx = e.clientX - pointerStart.x;
      const dy = e.clientY - pointerStart.y;
      totalDragDistance = Math.hypot(dx, dy);

      const minDim = Math.min(window.innerWidth, window.innerHeight);
      params.panX = panStart.x + (dx / minDim) * (1.6 / params.zoom);
      params.panY = panStart.y - (dy / minDim) * (1.6 / params.zoom);

      material.uniforms.uPan.value.set(params.panX, params.panY);
      gui.controllersRecursive().forEach(c => {
        if (c.property === 'panX' || c.property === 'panY') c.updateDisplay();
      });
    });

    canvas.addEventListener('pointerup', (e) => {
      if (!isPointerDown) return;
      isPointerDown = false;
      try {
        canvas.releasePointerCapture(e.pointerId);
      } catch (err) {}

      // Click detection: if mouse moved less than 5px and click-to-randomize is enabled
      if (totalDragDistance < 5 && params.clickToRandomize) {
        randomizeScene();
      }
    });

    // Mouse wheel zoom
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = Math.exp(-e.deltaY * 0.0015);
      params.zoom = Math.max(0.15, Math.min(8.0, params.zoom * zoomFactor));
      material.uniforms.uZoom.value = params.zoom;
      gui.controllersRecursive().forEach(c => {
        if (c.property === 'zoom') c.updateDisplay();
      });
    }, { passive: false });

    // --- Procedural Scene Randomizer ---
    function randomizeScene() {
      // Pick random color scheme
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      applyColorScheme(randomScheme);

      // Re-roll geometric parameters
      params.baseScale = +(3.4 + Math.random() * 1.4).toFixed(2);
      params.geoParam1 = +(0.42 + Math.random() * 0.16).toFixed(2);
      params.geoParam2 = +(0.15 + Math.random() * 0.12).toFixed(2);
      params.amp = +(0.012 + Math.random() * 0.028).toFixed(3);
      params.noiseStrength = +(0.45 + Math.random() * 0.35).toFixed(2);

      // Re-roll motion & animation
      params.animation = ANIMATION_MODES[Math.floor(Math.random() * (ANIMATION_MODES.length - 1))]; // avoid picking static by default
      params.speed = +(0.65 + Math.random() * 0.85).toFixed(2);

      // Re-roll lighting
      params.keyLightIntensity = +(0.9 + Math.random() * 0.9).toFixed(2);
      params.keyLightAngle = Math.floor(Math.random() * 360);
      params.accentLightIntensity = +(0.6 + Math.random() * 0.8).toFixed(2);

      // Random accent color
      const accentHues = ['#00f0ff', '#ff0055', '#ffaa00', '#00ffaa', '#bd00ff', '#ffffff'];
      params.accentLightColor = accentHues[Math.floor(Math.random() * accentHues.length)];

      // Push to uniforms
      material.uniforms.uBaseScale.value = params.baseScale;
      material.uniforms.uGeoParam1.value = params.geoParam1;
      material.uniforms.uGeoParam2.value = params.geoParam2;
      material.uniforms.uAmp.value = params.amp;
      material.uniforms.uNoiseStrength.value = params.noiseStrength;
      material.uniforms.uKeyLightIntensity.value = params.keyLightIntensity;
      material.uniforms.uKeyLightDir.value = getKeyLightDir(params.keyLightAngle);
      material.uniforms.uAccentLightIntensity.value = params.accentLightIntensity;
      material.uniforms.uAccentLightColor.value.copy(hexToVec3(params.accentLightColor));

      // Refresh GUI controls
      gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    // --- lil-gui Setup (Native UI style) ---
    const gui = new GUI({ title: 'Scene Controls' });

    // Scene & View Folder
    const fScene = gui.addFolder('Scene & View');
    fScene.add(params, 'greenscreen').name('Greenscreen (#00ff00)').onChange(val => {
      material.uniforms.uGreenscreen.value = val;
    });
    fScene.add(params, 'zoom', 0.2, 5.0, 0.05).name('Zoom (Wheel)').onChange(val => {
      material.uniforms.uZoom.value = val;
    });
    fScene.add(params, 'panX', -3.0, 3.0, 0.05).name('Pan X (Drag)').onChange(val => {
      material.uniforms.uPan.value.x = val;
    });
    fScene.add(params, 'panY', -3.0, 3.0, 0.05).name('Pan Y (Drag)').onChange(val => {
      material.uniforms.uPan.value.y = val;
    });
    fScene.add(params, 'dpr', 0.5, 3.0, 0.1).name('Pixel Ratio (DPR)').onChange(val => {
      renderer.setPixelRatio(val);
      onResize();
    });
    fScene.add(params, 'antialias').name('Antialiasing').onChange(val => {
      initScene();
      onResize();
    });
    fScene.add(params, 'exposure', 0.1, 3.0, 0.05).name('Exposure').onChange(val => {
      material.uniforms.uExposure.value = val;
    });
    fScene.add(params, 'resetView').name('Reset View');

    // Animation Folder
    const fAnim = gui.addFolder('Animation');
    fAnim.add(params, 'animation', ANIMATION_MODES).name('Mode');
    fAnim.add(params, 'speed', 0.0, 3.0, 0.05).name('Animation Speed');

    // Colors Folder
    const fColors = gui.addFolder('Color Schemes (19)');
    fColors.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Scheme').onChange(val => {
      applyColorScheme(val);
    });
    fColors.addColor(params, 'color1').name('Color 1').onChange(val => {
      material.uniforms.uColor1.value.copy(hexToVec3(val));
    });
    fColors.addColor(params, 'color2').name('Color 2').onChange(val => {
      material.uniforms.uColor2.value.copy(hexToVec3(val));
    });
    fColors.addColor(params, 'color3').name('Color 3').onChange(val => {
      material.uniforms.uColor3.value.copy(hexToVec3(val));
    });
    fColors.addColor(params, 'color4').name('Color 4').onChange(val => {
      material.uniforms.uColor4.value.copy(hexToVec3(val));
    });
    fColors.addColor(params, 'color5').name('Color 5').onChange(val => {
      material.uniforms.uColor5.value.copy(hexToVec3(val));
    });

    // Lighting Folder
    const fLight = gui.addFolder('Lighting');
    fLight.add(params, 'ambientIntensity', 0.0, 2.0, 0.05).name('Ambient Intensity').onChange(val => {
      material.uniforms.uAmbientIntensity.value = val;
    });
    fLight.addColor(params, 'ambientColor').name('Ambient Color').onChange(val => {
      material.uniforms.uAmbientColor.value.copy(hexToVec3(val));
    });
    fLight.add(params, 'keyLightIntensity', 0.0, 3.0, 0.05).name('Key Light Intensity').onChange(val => {
      material.uniforms.uKeyLightIntensity.value = val;
    });
    fLight.addColor(params, 'keyLightColor').name('Key Light Color').onChange(val => {
      material.uniforms.uKeyLightColor.value.copy(hexToVec3(val));
    });
    fLight.add(params, 'keyLightAngle', 0, 360, 1).name('Key Light Angle').onChange(val => {
      material.uniforms.uKeyLightDir.value = getKeyLightDir(val);
    });
    fLight.add(params, 'accentLightIntensity', 0.0, 3.0, 0.05).name('Accent Intensity').onChange(val => {
      material.uniforms.uAccentLightIntensity.value = val;
    });
    fLight.addColor(params, 'accentLightColor').name('Accent Color').onChange(val => {
      material.uniforms.uAccentLightColor.value.copy(hexToVec3(val));
    });

    // Procedural Geometry Folder
    const fGeo = gui.addFolder('Geometry & Procedural');
    fGeo.add(params, 'baseScale', 2.5, 6.0, 0.1).name('Base Scale').onChange(val => {
      material.uniforms.uBaseScale.value = val;
    });
    fGeo.add(params, 'geoParam1', 0.2, 0.9, 0.02).name('Cavity Radius').onChange(val => {
      material.uniforms.uGeoParam1.value = val;
    });
    fGeo.add(params, 'geoParam2', 0.05, 0.5, 0.02).name('Layer Thickness').onChange(val => {
      material.uniforms.uGeoParam2.value = val;
    });
    fGeo.add(params, 'amp', 0.0, 0.08, 0.002).name('Pulse Amplitude').onChange(val => {
      material.uniforms.uAmp.value = val;
    });
    fGeo.add(params, 'noiseStrength', 0.2, 1.2, 0.05).name('Noise Strength').onChange(val => {
      material.uniforms.uNoiseStrength.value = val;
    });
    fGeo.add(params, 'clickToRandomize').name('Click Scene to Re-roll');
    fGeo.add(params, 'randomize').name('Randomize Scene');

    // Toggle UI visibility with "H" key
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        gui._hidden ? gui.show() : gui.hide();
      }
    });

    // --- Main Animation Loop ---
    const clock = new THREE.Clock();
    let accumulatedTime = 0.0;
    const rotEuler = new THREE.Euler(0, 0, 0, 'XYZ');
    const rotMat4 = new THREE.Matrix4();
    const rotMat3 = new THREE.Matrix3();

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      accumulatedTime += delta * params.speed;
      const t = accumulatedTime;

      let rotX = 0.0;
      let rotY = 0.0;
      let rotZ = 0.0;
      let morphTime = t;
      let pulseOffset = 0.0;

      // 8 Smooth Animations
      switch (params.animation) {
        case 'Cosmic Drift':
          rotX = Math.sin(t * 0.14) * 0.18;
          rotY = Math.cos(t * 0.11) * 0.22;
          rotZ = Math.sin(t * 0.07) * 0.1;
          morphTime = t * 0.8;
          break;

        case 'Deep Pulse':
          rotX = 0.0;
          rotY = 0.0;
          rotZ = 0.0;
          morphTime = t * 0.5;
          pulseOffset = Math.sin(t * 0.85) * 0.035;
          break;

        case 'Quantum Flow':
          rotX = Math.sin(t * 0.08) * 0.1;
          rotY = Math.cos(t * 0.1) * 0.1;
          rotZ = 0.0;
          morphTime = t * 1.05;
          pulseOffset = Math.cos(t * 0.45) * 0.02;
          break;

        case 'Hypnotic Undulation':
          rotX = Math.sin(t * 0.2) * 0.12;
          rotY = Math.sin(t * 0.14) * 0.15;
          rotZ = Math.cos(t * 0.09) * 0.08;
          morphTime = t * 0.7;
          pulseOffset = Math.sin(t * 0.3) * 0.015;
          break;

        case 'Ethereal Float':
          rotX = Math.sin(t * 0.16) * 0.14;
          rotY = Math.sin(t * 0.08) * Math.cos(t * 0.08) * 0.3;
          rotZ = Math.sin(t * 0.11) * 0.08;
          morphTime = t * 0.75;
          break;

        case 'Zen Bloom':
          rotX = Math.sin(t * 0.06) * 0.06;
          rotY = Math.cos(t * 0.07) * 0.06;
          rotZ = 0.0;
          morphTime = t * 0.4;
          pulseOffset = Math.sin(t * 0.6) * 0.04;
          break;

        case 'Gravitational Tilt':
          rotX = Math.sin(t * 0.13) * 0.24;
          rotY = Math.cos(t * 0.17) * 0.18;
          rotZ = Math.sin(t * 0.09) * 0.12;
          morphTime = t * 0.65;
          break;

        case 'Static Zen':
          // Static animation without camera movement
          rotX = 0.0;
          rotY = 0.0;
          rotZ = 0.0;
          morphTime = 0.0;
          pulseOffset = 0.0;
          break;
      }

      // Compute camera rotation matrix
      rotEuler.set(rotX, rotY, rotZ);
      rotMat4.makeRotationFromEuler(rotEuler);
      rotMat3.setFromMatrix4(rotMat4);

      if (material) {
        material.uniforms.uTime.value = t;
        material.uniforms.uMorphTime.value = morphTime;
        material.uniforms.uPulseOffset.value = pulseOffset;
        material.uniforms.uCamRot.value.copy(rotMat3);
      }

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
