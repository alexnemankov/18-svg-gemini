    /* =========================================================================
       PAPER SCRAPS PROCEDURAL GENERATION (Preserved Source Logic)
       ========================================================================= */
    function generatePaperScraps() {
      paperPieces = [];
      resolveActivePalette();

      // Generate initial Voronoi points
      let points = [];
      // Calculate number of points based on scrap density parameter
      let areaPerPoint = (10000 / (params.scrapDensity / 45)) * random(0.85, 1.15);
      let numPoints = max(8, floor((cw * ch) / areaPerPoint));

      for (let i = 0; i < numPoints; i++) {
        points.push({
          x: random(-margin, cw + margin),
          y: random(-margin, ch + margin)
        });
      }

      // Generate Voronoi diagram
      voronoi = new Voronoi();
      let bbox = {
        xl: -margin,
        xr: cw + margin,
        yt: -margin,
        yb: ch + margin
      };
      diagram = voronoi.compute(points, bbox);
      if (!diagram || !diagram.cells || diagram.cells.length === 0) return;

      // Build adjacency map to find neighbors
      let siteToCellIdx = new Map();
      for (let i = 0; i < diagram.cells.length; i++) {
        siteToCellIdx.set(diagram.cells[i].site, i);
      }

      let adjacency = new Map();
      for (let edge of diagram.edges) {
        if (edge.lSite && edge.rSite) {
          let leftId = siteToCellIdx.get(edge.lSite);
          let rightId = siteToCellIdx.get(edge.rSite);

          if (leftId !== undefined && rightId !== undefined) {
            if (!adjacency.has(leftId)) adjacency.set(leftId, new Set());
            if (!adjacency.has(rightId)) adjacency.set(rightId, new Set());

            adjacency.get(leftId).add(rightId);
            adjacency.get(rightId).add(leftId);
          }
        }
      }

      // Randomly merge neighboring cells
      let merged = new Set();
      let groups = [];

      for (let i = 0; i < diagram.cells.length; i++) {
        if (merged.has(i)) continue;

        let group = new Set([i]);
        merged.add(i);

        // Randomly decide to merge with neighbors
        if (adjacency.has(i)) {
          for (let neighbor of adjacency.get(i)) {
            if (!merged.has(neighbor) && random() < params.neighborMergeChance) {
              group.add(neighbor);
              merged.add(neighbor);
            }
          }
        }

        groups.push(group);
      }

      // Create paper pieces from groups
      for (let group of groups) {
        let cellIndices = Array.from(group);

        // Find convex hull or boundary of merged region
        let boundaryPoints = getBoundaryPoints(cellIndices, diagram);
        if (boundaryPoints.length < 3) continue;

        // Calculate centroid for this piece
        let centroid = getCentroid(boundaryPoints);

        // Apply initial offset inward to create spacing between pieces
        let initialOffsetAmount = random(params.pieceSpacing * 0.5, params.pieceSpacing * 1.5);
        let initialOffsetPoints = boundaryPoints.map(p => {
          let d = dist(p.x, p.y, centroid.x, centroid.y);
          let ratio = d > 0.001 ? min(initialOffsetAmount / d, 0.8) : 0;
          return {
            x: lerp(p.x, centroid.x, ratio),
            y: lerp(p.y, centroid.y, ratio)
          };
        });

        // First, subdivide edges into smaller segments (5-10 pixels each)
        let subdividedPoints = subdivideEdges(initialOffsetPoints, params.minSegmentLength, params.maxSegmentLength);
        if (subdividedPoints.length < 3) continue;

        // Apply noise displacement to all points
        let displacedPoints = subdividedPoints.map(p => {
          let noiseScale = 0.1;
          let displacement = params.noiseDisplacement;
          let nx = (noise(p.x * noiseScale, p.y * noiseScale, 0) - 0.5) * 2 * displacement;
          let ny = (noise(p.x * noiseScale, p.y * noiseScale, 100) - 0.5) * 2 * displacement;
          return {
            x: p.x + nx,
            y: p.y + ny
          };
        });

        // Pick a color from active palette
        let colorHex = pickPieceColor();

        // Build precomputed torn paper layers
        let pieceLayers = buildTornLayers(displacedPoints, centroid, colorHex);

        paperPieces.push({
          points: displacedPoints,
          color: colorHex,
          centroid: { x: centroid.x, y: centroid.y },
          currentCentroid: { x: centroid.x, y: centroid.y },
          originalCentroid: { x: centroid.x, y: centroid.y },
          layers: pieceLayers,

          // Animated float & physics state
          angle: 0,
          baseAngle: random(-0.06, 0.06),
          phaseX: random(100),
          phaseY: random(100),
          phaseRot: random(100),
          phaseFloat: random(100),
          floatAmp: random(params.driftAmp * 0.6, params.driftAmp * 1.4),

          elevation: 1.0,
          targetElevation: 1.0,

          settleOffset: {
            x: random(-60, 60),
            y: random(-80, 80),
            rot: random(-0.4, 0.4)
          },
          settleProgress: params.settlePhysics ? 0.0 : 1.0,

          isDragging: false,
          isHovered: false
        });
      }
    }

    /* =========================================================================
       BUILD TORN PAPER LAYERS (Exact author math + Chroma Lab interpolation)
       ========================================================================= */
    function buildTornLayers(points, centroid, colorHex) {
      let layers = [];
      let numLayers = params.tornPaperLayers;
      let currentPoints = points;

      for (let layer = 0; layer < numLayers; layer++) {
        if (currentPoints.length < 3) break;

        // Add jags/irregularities to the points
        let jaggedPoints = addJagsToPoints(currentPoints, layer, centroid);

        // Interpolate from desaturated/grayish on edges to vibrant color in center
        let t = numLayers > 1 ? layer / (numLayers - 1) : 1;
        let originalColor = chroma(colorHex);
        let desatAmount = random(0.4, 2.0) * params.borderContrast;
        let darkenAmount = random(0.1, 0.35) * params.borderContrast;
        let desaturatedColor = originalColor.desaturate(desatAmount).darken(darkenAmount);
        let interpolatedColor = chroma.mix(desaturatedColor, originalColor, t, 'lab');

        let rgb = interpolatedColor.rgb();

        // Store relative points to centroid for rotation/translation/scale performance
        let relPoints = jaggedPoints.map(p => ({
          x: p.x - centroid.x,
          y: p.y - centroid.y
        }));

        layers.push({
          rgb: [rgb[0], rgb[1], rgb[2]],
          relativePoints: relPoints
        });

        // Offset points toward centroid for next layer
        let offsetFraction = random(0.03, 0.09);
        currentPoints = currentPoints.map(p => ({
          x: lerp(p.x, centroid.x, offsetFraction),
          y: lerp(p.y, centroid.y, offsetFraction)
        }));
      }

      return layers;
    }

    function reColorExistingPieces() {
      resolveActivePalette();
      for (let piece of paperPieces) {
        piece.color = pickPieceColor();
        piece.layers = buildTornLayers(piece.points, piece.centroid, piece.color);
      }
    }

    /* =========================================================================
       SUBDIVIDE EDGES (Preserved from source)
       ========================================================================= */
    function subdivideEdges(points, minSegmentLength, maxSegmentLength) {
      let subdividedPoints = [];

      for (let i = 0; i < points.length; i++) {
        let p1 = points[i];
        let p2 = points[(i + 1) % points.length];

        // Calculate edge length
        let dx = p2.x - p1.x;
        let dy = p2.y - p1.y;
        let edgeLength = sqrt(dx * dx + dy * dy);

        // Add the first point
        subdividedPoints.push(p1);

        // Subdivide this edge
        let remainingLength = edgeLength;
        let currentDist = 0;

        while (remainingLength > maxSegmentLength) {
          let segmentLength = random(minSegmentLength, maxSegmentLength);
          currentDist += segmentLength;

          let t = currentDist / edgeLength;
          subdividedPoints.push({
            x: p1.x + dx * t,
            y: p1.y + dy * t
          });

          remainingLength = edgeLength - currentDist;
        }
      }

      return subdividedPoints;
    }

    /* =========================================================================
       BOUNDARY EXTRACTION (Preserved from source)
       ========================================================================= */
    function getBoundaryPoints(cellIndices, diagram) {
      let edgeCount = new Map();

      for (let idx of cellIndices) {
        let cell = diagram.cells[idx];
        if (!cell || !cell.halfedges) continue;
        for (let halfedge of cell.halfedges) {
          let start = halfedge.getStartpoint();
          let end = halfedge.getEndpoint();
          if (!start || !end) continue;
          let key = getEdgeKey(start, end);
          edgeCount.set(key, (edgeCount.get(key) || 0) + 1);
        }
      }

      // Boundary edges appear only once
      let boundaryEdges = [];
      for (let [key, count] of edgeCount) {
        if (count === 1) {
          let [start, end] = key.split('|').map(s => {
            let [x, y] = s.split(',').map(Number);
            return { x, y };
          });
          boundaryEdges.push({ start, end });
        }
      }

      // Order boundary points
      if (boundaryEdges.length === 0) return [];

      let orderedPoints = [boundaryEdges[0].start, boundaryEdges[0].end];
      boundaryEdges.splice(0, 1);

      while (boundaryEdges.length > 0) {
        let lastPoint = orderedPoints[orderedPoints.length - 1];
        let foundIdx = boundaryEdges.findIndex(e =>
          pointsEqual(e.start, lastPoint) || pointsEqual(e.end, lastPoint)
        );

        if (foundIdx === -1) break;

        let edge = boundaryEdges[foundIdx];
        let nextPoint = pointsEqual(edge.start, lastPoint) ? edge.end : edge.start;

        if (!pointsEqual(nextPoint, orderedPoints[0])) {
          orderedPoints.push(nextPoint);
        }

        boundaryEdges.splice(foundIdx, 1);
      }

      return orderedPoints;
    }

    function getEdgeKey(p1, p2) {
      let key1 = `${p1.x.toFixed(2)},${p1.y.toFixed(2)}`;
      let key2 = `${p2.x.toFixed(2)},${p2.y.toFixed(2)}`;
      return key1 < key2 ? `${key1}|${key2}` : `${key2}|${key1}`;
    }

    function pointsEqual(p1, p2) {
      return Math.abs(p1.x - p2.x) < 0.01 && Math.abs(p1.y - p2.y) < 0.01;
    }

    function getCentroid(points) {
      let cx = 0, cy = 0;
      for (let p of points) {
        cx += p.x;
        cy += p.y;
      }
      return {
        x: cx / points.length,
        y: cy / points.length
      };
    }

    /* =========================================================================
       ADD JAGS TO POINTS (Preserved torn paper noise math from source)
       ========================================================================= */
    function addJagsToPoints(points, layerIndex, centroid) {
      let jaggedPoints = [];
      let noiseScale = 0.02;
      let jagAmount = (params.tearJaggedness || 10) / (1 + layerIndex * 0.5);

      for (let i = 0; i < points.length; i++) {
        let p = points[i];

        // Add the current point with some noise displacement
        let noiseVal = noise(p.x * noiseScale, p.y * noiseScale, layerIndex * 10);
        let angle = atan2(p.y - centroid.y, p.x - centroid.x);
        let displacement = (noiseVal - 0.5) * jagAmount;

        jaggedPoints.push({
          x: p.x + cos(angle) * displacement,
          y: p.y + sin(angle) * displacement
        });

        // Optionally add intermediate jagged points between vertices
        if (random() < 0.5 && layerIndex < 4) {
          let nextP = points[(i + 1) % points.length];
          let midX = (p.x + nextP.x) / 2;
          let midY = (p.y + nextP.y) / 2;

          let dx = nextP.x - p.x;
          let dy = nextP.y - p.y;
          let len = sqrt(dx * dx + dy * dy);
          if (len > 5) {
            let perpX = -dy / len;
            let perpY = dx / len;

            let midNoiseVal = noise(midX * noiseScale * 2, midY * noiseScale * 2, layerIndex * 10 + 50);
            let perpDisplacement = (midNoiseVal - 0.5) * jagAmount * 1.5;

            jaggedPoints.push({
              x: midX + perpX * perpDisplacement,
              y: midY + perpY * perpDisplacement
            });
          }
        }
      }

      return jaggedPoints;
    }

    /* =========================================================================
       DRAW PAPER PIECE (Enhanced with elevation, shadow & animations)
       ========================================================================= */
    function drawPaperPiece(piece, t) {
      push();

      let animSpeed = params.animationSpeed;
      let animX = 0;
      let animY = 0;
      let animRot = piece.baseAngle;

      if (animSpeed > 0 && !params.paused) {
        animX = Math.sin(t * 0.9 + piece.phaseX) * piece.floatAmp;
        animY = Math.cos(t * 0.7 + piece.phaseY) * piece.floatAmp;
        animRot += Math.sin(t * 0.5 + piece.phaseRot) * params.rotAmp;
      }

      // Settle animation (flutter and land onto the desk)
      if (piece.settleProgress < 1.0) {
        piece.settleProgress += (1.0 - piece.settleProgress) * 0.08 * (animSpeed > 0 ? animSpeed : 1.0);
        if (piece.settleProgress > 0.999) piece.settleProgress = 1.0;
      }
      let settleFactor = 1.0 - piece.settleProgress;
      let settleX = piece.settleOffset.x * settleFactor;
      let settleY = piece.settleOffset.y * settleFactor;
      let settleRot = piece.settleOffset.rot * settleFactor;

      // Elevation spring physics
      piece.elevation += (piece.targetElevation - piece.elevation) * 0.16;
      let currentElev = piece.elevation + settleFactor * 1.6;

      let posX = piece.currentCentroid.x + animX + settleX;
      let posY = piece.currentCentroid.y + animY + settleY;
      let totalAngle = piece.angle + animRot + settleRot;

      translate(posX, posY);
      rotate(totalAngle);
      scale(1.0 + (currentElev - 1.0) * 0.035);

      if (piece.layers && piece.layers.length > 0) {
        drawingContext.save();

        // Realistic soft physical paper shadow
        let shadowAlpha = params.shadowOpacity * (0.8 + 0.2 * (currentElev - 1.0));
        drawingContext.shadowColor = `rgba(20, 16, 12, ${shadowAlpha})`;
        drawingContext.shadowBlur = params.shadowBlur * currentElev;
        drawingContext.shadowOffsetX = (params.shadowDepth * 0.7 + animX * 0.2) * currentElev;
        drawingContext.shadowOffsetY = (params.shadowDepth + animY * 0.2) * currentElev;

        // Base Layer (casts paper shadow)
        let baseLayer = piece.layers[0];
        fill(baseLayer.rgb[0], baseLayer.rgb[1], baseLayer.rgb[2]);
        noStroke();
        beginShape();
        let flutterAmp = params.flutterFibers && animSpeed > 0 && !params.paused ? 0.7 : 0;
        for (let p of baseLayer.relativePoints) {
          let fl = flutterAmp > 0 ? Math.sin(t * 3.0 + p.x * 0.08 + p.y * 0.08) * flutterAmp : 0;
          vertex(p.x + fl, p.y + fl);
        }
        endShape(CLOSE);

        // Turn off canvas shadow blur for interior torn layers
        drawingContext.shadowColor = 'transparent';
        drawingContext.shadowBlur = 0;
        drawingContext.shadowOffsetX = 0;
        drawingContext.shadowOffsetY = 0;

        // Interior concentric torn layers
        for (let l = 1; l < piece.layers.length; l++) {
          let layer = piece.layers[l];
          fill(layer.rgb[0], layer.rgb[1], layer.rgb[2]);
          beginShape();
          for (let p of layer.relativePoints) {
            let fl = flutterAmp > 0 && l < 3 ? Math.sin(t * 3.0 + p.x * 0.08 + p.y * 0.08) * (flutterAmp * 0.5) : 0;
            vertex(p.x + fl, p.y + fl);
          }
          endShape(CLOSE);
        }

        drawingContext.restore();
      }

      pop();
    }

    /* =========================================================================
       POINT IN POLYGON CHECK (For Drag & Drop + Hover Detection)
       ========================================================================= */
    function pointInPolygon(px, py, vertices) {
      let inside = false;
      for (let i = 0, j = vertices.length - 1; i < vertices.length; j = i++) {
        let xi = vertices[i].x, yi = vertices[i].y;
        let xj = vertices[j].x, yj = vertices[j].y;
        let intersect = ((yi > py) !== (yj > py)) &&
          (px < (xj - xi) * (py - yi) / (yj - yi + 0.0000001) + xi);
        if (intersect) inside = !inside;
      }
      return inside;
    }

    function getPieceAt(worldX, worldY) {
      for (let i = paperPieces.length - 1; i >= 0; i--) {
        let piece = paperPieces[i];
        let dx = worldX - piece.currentCentroid.x;
        let dy = worldY - piece.currentCentroid.y;
        let distSq = dx * dx + dy * dy;
        if (distSq > 260 * 260) continue;

        let cosA = Math.cos(-piece.angle);
        let sinA = Math.sin(-piece.angle);
        let localX = dx * cosA - dy * sinA;
        let localY = dx * sinA + dy * cosA;

        if (piece.layers && piece.layers.length > 0 && pointInPolygon(localX, localY, piece.layers[0].relativePoints)) {
          return piece;
        }
      }
      return null;
    }

    /* =========================================================================
       RANDOMIZATION SYSTEM (Color Scheme, Geometry, Motion Re-roll)
       ========================================================================= */
    function randomizeAllThemeAndParams() {
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      params.colorScheme = random(schemeKeys);

      params.scrapDensity = floor(random(25, 75));
      params.neighborMergeChance = parseFloat(random(0.12, 0.35).toFixed(2));
      params.pieceSpacing = floor(random(6, 18));
      params.tearJaggedness = floor(random(6, 16));
      params.noiseDisplacement = floor(random(6, 16));
      params.tornPaperLayers = floor(random(6, 12));
      params.borderContrast = parseFloat(random(0.8, 1.4).toFixed(2));

      params.animationSpeed = parseFloat(random(0.6, 1.4).toFixed(2));
      params.driftAmp = parseFloat(random(3.5, 9.5).toFixed(1));
      params.rotAmp = parseFloat(random(0.02, 0.08).toFixed(3));
      params.shadowBlur = floor(random(12, 26));
      params.shadowDepth = floor(random(5, 14));

      if (gui) {
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      }

      generatePaperTexture();
      generatePaperScraps();
    }

    /* =========================================================================
       INTERACTION EVENT LISTENERS (Zoom, Drag, Click, Keyboard)
       ========================================================================= */
    function setupEventListeners() {
      const container = document.getElementById('canvas-container');

      // Wheel Zoom anchored at cursor position
      container.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
        const rect = container.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        const newZoom = Math.min(Math.max(params.zoom * zoomFactor, 0.25), 5.0);
        params.panX = mouseX - (mouseX - params.panX) * (newZoom / params.zoom);
        params.panY = mouseY - (mouseY - params.panY) * (newZoom / params.zoom);
        params.zoom = newZoom;

        if (gui) {
          gui.controllersRecursive().forEach(c => {
            if (['zoom', 'panX', 'panY'].includes(c.property)) c.updateDisplay();
          });
        }
      }, { passive: false });

      // Pointer / Mouse Down
      container.addEventListener('pointerdown', (e) => {
        pointerDownPos = { x: e.clientX, y: e.clientY };
        const rect = container.getBoundingClientRect();
        const screenX = e.clientX - rect.left;
        const screenY = e.clientY - rect.top;
        const worldX = (screenX - params.panX) / params.zoom;
        const worldY = (screenY - params.panY) / params.zoom;

        const hitPiece = getPieceAt(worldX, worldY);

        if (hitPiece && e.button === 0 && !e.shiftKey && !e.altKey) {
          draggedPiece = hitPiece;
          dragOffset.x = hitPiece.currentCentroid.x - worldX;
          dragOffset.y = hitPiece.currentCentroid.y - worldY;
          hitPiece.isDragging = true;
          hitPiece.targetElevation = 2.4;

          // Elevate to top of render queue
          const idx = paperPieces.indexOf(hitPiece);
          if (idx > -1) {
            paperPieces.splice(idx, 1);
            paperPieces.push(hitPiece);
          }
          container.classList.add('grabbing');
        } else {
          isPanning = true;
          panStartX = e.clientX - params.panX;
          panStartY = e.clientY - params.panY;
          container.classList.add('grabbing');
        }
      });

      // Pointer / Mouse Move
      window.addEventListener('pointermove', (e) => {
        const rect = container.getBoundingClientRect();
        const screenX = e.clientX - rect.left;
        const screenY = e.clientY - rect.top;
        const worldX = (screenX - params.panX) / params.zoom;
        const worldY = (screenY - params.panY) / params.zoom;

        if (draggedPiece) {
          draggedPiece.currentCentroid.x = worldX + dragOffset.x;
          draggedPiece.currentCentroid.y = worldY + dragOffset.y;
          draggedPiece.originalCentroid.x = draggedPiece.currentCentroid.x;
          draggedPiece.originalCentroid.y = draggedPiece.currentCentroid.y;
        } else if (isPanning) {
          params.panX = e.clientX - panStartX;
          params.panY = e.clientY - panStartY;
          if (gui) {
            gui.controllersRecursive().forEach(c => {
              if (['panX', 'panY'].includes(c.property)) c.updateDisplay();
            });
          }
        } else if (params.hoverElevation) {
          const hovered = getPieceAt(worldX, worldY);
          for (let p of paperPieces) {
            if (p === hovered) {
              p.targetElevation = 1.5;
              p.isHovered = true;
            } else if (!p.isDragging) {
              p.targetElevation = 1.0;
              p.isHovered = false;
            }
          }
          container.style.cursor = hovered ? 'pointer' : 'grab';
        }
      });

      // Pointer / Mouse Up
      window.addEventListener('pointerup', (e) => {
        let distMoved = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);

        if (draggedPiece) {
          draggedPiece.targetElevation = 1.0;
          draggedPiece.isDragging = false;
          draggedPiece = null;
        }
        isPanning = false;
        container.classList.remove('grabbing');

        // Check for click without dragging
        if (distMoved < 6 && (e.target === container || e.target.tagName === 'CANVAS')) {
          if (params.clickToRandomize) {
            randomizeAllThemeAndParams();
          } else {
            generatePaperScraps();
          }
        }
      });

      // Keyboard Shortcuts ('H' for UI hide/show, Space for regenerate, 'R' for randomize)
      window.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;

        if (e.key === 'h' || e.key === 'H') {
          e.preventDefault();
          document.body.classList.toggle('hidden-ui');
        } else if (e.code === 'Space') {
          e.preventDefault();
          generatePaperScraps();
        } else if (e.key === 'r' || e.key === 'R') {
          e.preventDefault();
          randomizeAllThemeAndParams();
        } else if (e.key === '0') {
          e.preventDefault();
          params.zoom = 1.0;
          params.panX = 0.0;
          params.panY = 0.0;
          if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
        }
      });
    }

    function windowResized() {
      updateDimensions();
      resizeCanvas(cw, ch);
      generatePaperTexture();
    }

    /* =========================================================================
       MODERN lil-gui CONTROLS PANEL
       ========================================================================= */
    function setupGUI() {
      gui = new lil.GUI({ title: 'Paper Scraps' });

      // 🎨 Color & Palette Folder
      const fColor = gui.addFolder('🎨 Color & Palette');
      fColor.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Scheme').onChange(() => {
        generatePaperTexture();
        reColorExistingPieces();
      });
      fColor.add(params, 'bgStyle', ['Warm Cream Paper', 'Kraft Cardboard', 'Chalkboard Dark', 'Minimal White', 'Auto']).name('Paper Mat').onChange(() => {
        generatePaperTexture();
      });
      fColor.add(params, 'tornPaperLayers', 3, 16, 1).name('Torn Layers').onChange(() => {
        for (let piece of paperPieces) {
          piece.layers = buildTornLayers(piece.points, piece.centroid, piece.color);
        }
      });
      fColor.add(params, 'borderContrast', 0.2, 2.0, 0.05).name('Fibers Contrast').onChange(() => {
        for (let piece of paperPieces) {
          piece.layers = buildTornLayers(piece.points, piece.centroid, piece.color);
        }
      });
      fColor.add({ reColor: reColorExistingPieces }, 'reColor').name('Re-color Scraps');

      // ✂️ Paper Geometry Folder
      const fGeom = gui.addFolder('✂️ Paper Geometry');
      fGeom.add(params, 'scrapDensity', 15, 100, 1).name('Scrap Density');
      fGeom.add(params, 'neighborMergeChance', 0.0, 0.5, 0.01).name('Merge Chance');
      fGeom.add(params, 'pieceSpacing', 2, 25, 1).name('Piece Spacing');
      fGeom.add(params, 'tearJaggedness', 2, 25, 1).name('Tear Jaggedness');
      fGeom.add(params, 'noiseDisplacement', 0, 25, 1).name('Noise Warp');
      fGeom.add({ rebuild: generatePaperScraps }, 'rebuild').name('Re-cut Collage');

      // 🌊 Motion & Animation Folder
      const fAnim = gui.addFolder('🌊 Motion & Animation');
      fAnim.add(params, 'animationSpeed', 0.0, 3.0, 0.05).name('Animation Speed');
      fAnim.add(params, 'paused').name('Pause Motion');
      fAnim.add(params, 'driftAmp', 0.0, 20.0, 0.5).name('Floating Drift');
      fAnim.add(params, 'rotAmp', 0.0, 0.20, 0.005).name('Rotation Sway');
      fAnim.add(params, 'flutterFibers').name('Edge Flutter');
      fAnim.add(params, 'settlePhysics').name('Settle Physics');
      fAnim.add({
        scatter: () => {
          for (let p of paperPieces) {
            p.settleProgress = 0.0;
            p.settleOffset = {
              x: random(-60, 60),
              y: random(-80, 80),
              rot: random(-0.4, 0.4)
            };
          }
        }
      }, 'scatter').name('Scatter & Settle');

      // ✨ Depth & Physics Folder
      const fDepth = gui.addFolder('✨ Depth & Physics');
      fDepth.add(params, 'clickToRandomize').name('Click to Randomize');
      fDepth.add(params, 'hoverElevation').name('Hover Lift');
      fDepth.add(params, 'shadowBlur', 0, 45, 1).name('Shadow Blur');
      fDepth.add(params, 'shadowDepth', 0, 30, 1).name('Shadow Depth');
      fDepth.add(params, 'shadowOpacity', 0.0, 0.7, 0.02).name('Shadow Opacity');
      fDepth.add({
        erodeFilter: () => {
          filter(ERODE);
          filter(DILATE);
        }
      }, 'erodeFilter').name('Erode & Dilate Pass');

      // 🔍 Viewport & Camera Folder
      const fCam = gui.addFolder('🔍 Viewport & Camera');
      fCam.add(params, 'displayMode', ['Full Viewport', 'Framed Art Print (4:5)']).name('Display Mode').onChange(() => {
        updateDimensions();
        resizeCanvas(cw, ch);
        generatePaperTexture();
      });
      fCam.add(params, 'zoom', 0.25, 5.0, 0.05).name('Zoom').listen();
      fCam.add(params, 'panX', -2000, 2000, 1).name('Pan X').listen();
      fCam.add(params, 'panY', -2000, 2000, 1).name('Pan Y').listen();
      fCam.add({
        resetView: () => {
          params.zoom = 1.0;
          params.panX = 0.0;
          params.panY = 0.0;
          gui.controllersRecursive().forEach(c => c.updateDisplay());
        }
      }, 'resetView').name('Reset View (0)');

      // ⚡ Actions Folder
      const fActions = gui.addFolder('⚡ Actions');
      fActions.add({ regen: generatePaperScraps }, 'regen').name('Regenerate (Space)');
      fActions.add({ rand: randomizeAllThemeAndParams }, 'rand').name('Randomize All (R)');
      fActions.add({
        savePNG: () => {
          saveCanvas('paper-scraps-' + Date.now(), 'png');
        }
      }, 'savePNG').name('Save Artwork (PNG)');

      fColor.close();
      fGeom.close();
      fDepth.close();
      fCam.close();
    }
  </script>
