<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конверт и письмо без текста</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a120c;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas#webgl {
            display: block;
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            outline: none;
        }
    </style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js",
            "gsap": "https://unpkg.com/gsap@3.12.5/index.js",
            "postprocessing/PostProcessor.js": "./postprocessing/PostProcessor.js"
        }
    }
    </script>
</head>
<body>
    <canvas id="webgl"></canvas>

    <script type="module">
        import * as THREE from 'three';
        import GUI from 'lil-gui';
        import gsap from 'gsap';

        // =========================================================================
        // POST PROCESSOR SUITE (From postprocessing/PostProcessor.js)
        // Inlined for complete standalone file:// protocol support & web servers
        // =========================================================================
        const orthoVertexShader = `
        precision highp float;
        in vec3 position;
        out vec2 vUv;
        void main() {
          vUv = position.xy * 0.5 + 0.5;
          gl_Position = vec4(position.xy, 0.0, 1.0);
        }
        `;

        const brightFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        uniform float bloomThreshold;
        in vec2 vUv;
        out vec4 fragColor;

        vec3 sanitize(vec3 v) {
          if (isnan(v.x) || isinf(v.x)) v.x = 0.0;
          if (isnan(v.y) || isinf(v.y)) v.y = 0.0;
          if (isnan(v.z) || isinf(v.z)) v.z = 0.0;
          return clamp(v, vec3(0.0), vec3(65000.0));
        }

        void main() {
          vec4 raw = texture(inputTexture, vUv);
          vec3 color = sanitize(raw.rgb);
          float luminance = max(0.0, dot(color, vec3(0.2126, 0.7152, 0.0722)));
          float knee = 0.1;
          float soft = luminance - bloomThreshold + knee;
          soft = clamp(soft, 0.0, 2.0 * knee);
          soft = (soft * soft) / (4.0 * knee + 0.00001);
          float contribution = max(soft, luminance - bloomThreshold);
          contribution /= max(luminance, 0.0001);
          vec3 result = color * contribution;
          fragColor = vec4(sanitize(result), clamp(raw.a, 0.0, 1.0));
        }
        `;

        const blur13ShaderChunk = `
        vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
          vec2 resolution = vec2(textureSize(image, 0));
          vec4 color = vec4(0.0);
          vec2 off1 = vec2(1.411764705882353) * direction;
          vec2 off2 = vec2(3.2941176470588234) * direction;
          vec2 off3 = vec2(5.176470588235294) * direction;
          color += texture(image, uv) * 0.1964825501511404;
          color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
          color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
          color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
          color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
          color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
          color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
          return color;
        }
        `;

        const blurFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        uniform vec2 direction;
        in vec2 vUv;
        out vec4 color;
        ${blur13ShaderChunk}

        vec4 sanitize(vec4 v) {
          if (isnan(v.x) || isinf(v.x)) v.x = 0.0;
          if (isnan(v.y) || isinf(v.y)) v.y = 0.0;
          if (isnan(v.z) || isinf(v.z)) v.z = 0.0;
          if (isnan(v.w) || isinf(v.w)) v.w = 0.0;
          return clamp(v, vec4(0.0), vec4(65000.0));
        }

        void main() {
          color = sanitize(blur13(inputTexture, vUv, direction));
        }
        `;

        const anamorphicBrightShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        uniform float threshold;
        uniform float smoothWidth;
        in vec2 vUv;
        out vec4 fragColor;

        void main() {
          vec4 color = texture(inputTexture, vUv);
          float v = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
          float alpha = smoothstep(threshold, threshold + smoothWidth, v);
          fragColor = mix(vec4(0.0), color, alpha);
        }
        `;

        const anamorphicBlurShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        uniform vec2 resolution;
        uniform float samples;
        uniform float intensity;
        uniform vec3 tintColor;
        uniform float bloomRadius;
        in vec2 vUv;
        out vec4 fragColor;

        void main() {
          int halfSamples = max(1, int(samples) / 2);
          float fHalfSamples = float(halfSamples);
          vec2 invSize = 1.0 / resolution;
          vec4 total = vec4(0.0);

          for (int i = -64; i <= 64; i++) {
            if (i < -halfSamples || i > halfSamples) continue;
            float softness = 1.0 - abs(float(i)) / fHalfSamples;
            softness = pow(softness, 2.0);
            vec2 shiftedUV = vec2(vUv.x + invSize.x * float(i) * (4.0 + bloomRadius * 8.0), vUv.y);
            shiftedUV = clamp(shiftedUV, 0.001, 0.999);
            total += texture(inputTexture, shiftedUV) * softness;
          }

          fragColor = (total / (samples / 3.0)) * vec4(tintColor, 1.0) * intensity;
        }
        `;

        const finalFragmentShader = `
        precision highp float;
        uniform vec2 resolution;
        uniform sampler2D inputTexture;
        uniform sampler2D blur0Texture;
        uniform sampler2D blur1Texture;
        uniform sampler2D blur2Texture;
        uniform sampler2D blur3Texture;
        uniform sampler2D blur4Texture;
        uniform sampler2D anamorphicTexture;
        uniform bool bloomEnabled;
        uniform bool anamorphicEnabled;
        uniform float bloomStrength;
        uniform float bloomRadius;
        uniform float vignetteBoost;
        uniform float vignetteReduction;
        uniform float time;
        in vec2 vUv;
        out vec4 fragColor;

        vec3 sanitize(vec3 v) {
          if (isnan(v.x) || isinf(v.x)) v.x = 0.0;
          if (isnan(v.y) || isinf(v.y)) v.y = 0.0;
          if (isnan(v.z) || isinf(v.z)) v.z = 0.0;
          return clamp(v, vec3(0.0), vec3(65000.0));
        }

        void main() {
          vec4 rawBase = texture(inputTexture, vUv);
          vec3 color = sanitize(rawBase.rgb);

          if (bloomEnabled) {
            vec3 b0 = sanitize(texture(blur0Texture, vUv).rgb);
            vec3 b1 = sanitize(texture(blur1Texture, vUv).rgb);
            vec3 b2 = sanitize(texture(blur2Texture, vUv).rgb);
            vec3 b3 = sanitize(texture(blur3Texture, vUv).rgb);
            vec3 b4 = sanitize(texture(blur4Texture, vUv).rgb);
            float r = clamp(bloomRadius, 0.0, 1.0);
            float w0 = 1.0 - 0.7 * r;
            float w1 = 0.8;
            float w2 = 0.6 + 0.4 * r;
            float w3 = 0.4 + 0.6 * r;
            float w4 = 0.2 + 0.8 * r;
            vec3 bloom = (b0 * w0 + b1 * w1 + b2 * w2 + b3 * w3 + b4 * w4) / (w0 + w1 + w2 + w3 + w4);
            color += bloom * bloomStrength;
          }

          if (anamorphicEnabled) {
            vec3 a = sanitize(texture(anamorphicTexture, vUv).rgb);
            color += a;
          }

          vec2 center = vUv - 0.5;
          float dist = length(center);
          float vig = 1.0 - smoothstep(vignetteBoost * 0.5, vignetteBoost * 0.5 + vignetteReduction * 0.5, dist);
          color *= clamp(vig, 0.0, 1.0);

          fragColor = vec4(sanitize(color), clamp(rawBase.a, 0.0, 1.0));
        }
        `;

        const rgbSplitFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        uniform float chromaticAberration;
        uniform float noiseIntensity;
        uniform float fisheyeStrength;
        uniform float fisheyeRadius;
        uniform float gamma;
        uniform float minInputLevel;
        uniform float maxInputLevel;
        uniform float exposure;
        uniform float time;
        in vec2 vUv;
        out vec4 fragColor;

        vec3 ACESFilmicToneMapping(vec3 x) {
          float a = 2.51;
          float b = 0.03;
          float c = 2.43;
          float d = 0.59;
          float e = 0.14;
          return clamp((x * (a * x + b)) / (x * (c * x + d) + e), 0.0, 1.0);
        }

        vec3 finalLevels(vec3 color, vec3 minIn, vec3 gammaIn, vec3 maxIn) {
          return pow(clamp((color - minIn) / max(maxIn - minIn, vec3(0.0001)), 0.0, 1.0), 1.0 / max(gammaIn, vec3(0.0001)));
        }

        float hash(vec2 p) {
          vec3 p3 = fract(vec3(p.xyx) * 0.1031);
          p3 += dot(p3, p3.yzx + 33.33);
          return fract((p3.x + p3.y) * p3.z);
        }

        void main() {
          vec2 uv = vUv;
          if (abs(fisheyeStrength) > 0.001) {
            vec2 d = uv - 0.5;
            float r = length(d) / max(fisheyeRadius, 0.001);
            float bind = (fisheyeStrength > 0.0) ? 0.7071 : 0.5;
            if (r < bind) {
              float factor = 1.0 + fisheyeStrength * (r * r);
              uv = 0.5 + d * factor;
            }
          }

          vec2 offset = (uv - 0.5) * chromaticAberration;
          float r = texture(inputTexture, uv - offset).r;
          float g = texture(inputTexture, uv).g;
          float b = texture(inputTexture, uv + offset).b;
          vec3 col = vec3(r, g, b);

          if (noiseIntensity > 0.0001) {
            float n = (hash(uv * 1234.5 + time) - 0.5) * noiseIntensity;
            col += n;
          }

          vec3 exposedColor = col * exposure;
          vec3 toneMappedColor = ACESFilmicToneMapping(exposedColor);
          vec3 finalCol = finalLevels(toneMappedColor, vec3(minInputLevel), vec3(gamma), vec3(maxInputLevel));

          fragColor = vec4(finalCol, 1.0);
        }
        `;

        function createFBO(w, h, options = {}) {
          return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
            wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
            wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
            minFilter: options.minFilter || THREE.LinearFilter,
            magFilter: options.magFilter || THREE.LinearFilter,
            format: options.format || THREE.RGBAFormat,
            type: options.type || THREE.HalfFloatType,
            stencilBuffer: options.stencilBuffer || false,
            depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : true,
            samples: options.samples || 0,
          });
        }

        class ShaderPass {
          constructor(shader, options = {}) {
            this.shader = shader;
            this.orthoScene = new THREE.Scene();
            this.fbo = createFBO(1, 1, options);
            this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
            this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
            this.orthoScene.add(this.orthoQuad);
            this.texture = this.fbo.texture;
          }
          render(renderer, toScreen = false) {
            if (!toScreen) renderer.setRenderTarget(this.fbo);
            renderer.render(this.orthoScene, this.orthoCamera);
            if (!toScreen) renderer.setRenderTarget(null);
          }
          setSize(width, height) {
            this.fbo.setSize(Math.max(1, width), Math.max(1, height));
            this.orthoQuad.scale.set(width, height, 1);
          }
        }

        class BloomPass {
          constructor(strength = 1.0, radius = 0.5, threshold = 0.2, levels = 5) {
            this.strength = strength;
            this.radius = radius;
            this.threshold = threshold;
            this.levels = levels;

            this.brightShader = new THREE.RawShaderMaterial({
              uniforms: {
                inputTexture: { value: null },
                bloomThreshold: { value: this.threshold },
              },
              vertexShader: orthoVertexShader,
              fragmentShader: brightFragmentShader,
              glslVersion: THREE.GLSL3,
            });
            this.brightPass = new ShaderPass(this.brightShader, {
              format: THREE.RGBAFormat,
              type: THREE.HalfFloatType,
            });

            this.blurShader = new THREE.RawShaderMaterial({
              uniforms: {
                inputTexture: { value: null },
                direction: { value: new THREE.Vector2(1, 0) },
              },
              vertexShader: orthoVertexShader,
              fragmentShader: blurFragmentShader,
              glslVersion: THREE.GLSL3,
            });

            this.blurPasses = [];
            for (let i = 0; i < this.levels; i++) {
              this.blurPasses.push(
                new ShaderPass(this.blurShader, {
                  format: THREE.RGBAFormat,
                  type: THREE.HalfFloatType,
                })
              );
            }
          }

          setSize(width, height) {
            this.brightPass.setSize(width, height);
            let w = width;
            let h = height;
            for (let i = 0; i < this.levels; i++) {
              w = Math.max(1, Math.floor(w / 2));
              h = Math.max(1, Math.floor(h / 2));
              this.blurPasses[i].setSize(w, h);
            }
          }

          render(renderer) {
            this.brightShader.uniforms.inputTexture.value = this.source;
            this.brightShader.uniforms.bloomThreshold.value = this.threshold;
            this.brightPass.render(renderer);

            let input = this.brightPass.texture;
            for (let i = 0; i < this.levels; i++) {
              const pass = this.blurPasses[i];
              this.blurShader.uniforms.inputTexture.value = input;
              this.blurShader.uniforms.direction.value.set(1, 0);
              pass.render(renderer);

              this.blurShader.uniforms.inputTexture.value = pass.texture;
              this.blurShader.uniforms.direction.value.set(0, 1);
              pass.render(renderer);

              input = pass.texture;
            }
          }
        }

        class PostProcessor {
          constructor(renderer, params = {}) {
            this.renderer = renderer;

            this.settings = {
              enabled: params.enabled !== undefined ? params.enabled : true,

              // 1. Universal Bloom
              bloomEnabled: params.bloomEnabled !== undefined ? params.bloomEnabled : true,
              bloomStrength: params.bloomStrength !== undefined ? params.bloomStrength : 0.85,
              bloomRadius: params.bloomRadius !== undefined ? params.bloomRadius : 0.5,
              bloomThreshold: params.bloomThreshold !== undefined ? params.bloomThreshold : 0.25,

              // 2. Anamorphic Flare (STRICTLY DEFAULT OFF as requested)
              anamorphicEnabled: params.anamorphicEnabled !== undefined ? params.anamorphicEnabled : false,
              anamorphicIntensity: params.anamorphicIntensity !== undefined ? params.anamorphicIntensity : 3.5,
              anamorphicThreshold: params.anamorphicThreshold !== undefined ? params.anamorphicThreshold : 0.4,
              anamorphicSamples: params.anamorphicSamples !== undefined ? params.anamorphicSamples : 64,
              anamorphicRadius: params.anamorphicRadius !== undefined ? params.anamorphicRadius : 0.0,
              anamorphicSmoothWidth: params.anamorphicSmoothWidth !== undefined ? params.anamorphicSmoothWidth : 0.05,
              anamorphicColor: params.anamorphicColor ? (params.anamorphicColor.isColor ? params.anamorphicColor.clone() : new THREE.Color(params.anamorphicColor)) : new THREE.Color(0xffb050),
              anamorphicColorHex: params.anamorphicColorHex || '#ffb050',

              // 3. Lens & Camera Optics
              fisheyeStrength: params.fisheyeStrength !== undefined ? params.fisheyeStrength : 0.0,
              fisheyeRadius: params.fisheyeRadius !== undefined ? params.fisheyeRadius : 1.0,
              chromaticAberration: params.chromaticAberration !== undefined ? params.chromaticAberration : 0.003,
              vignetteBoost: params.vignetteBoost !== undefined ? params.vignetteBoost : 1.05,
              vignetteReduction: params.vignetteReduction !== undefined ? params.vignetteReduction : 0.55,
              noiseIntensity: params.noiseIntensity !== undefined ? params.noiseIntensity : 0.008,

              // 4. Color Grading, Exposure & Tone
              gamma: params.gamma !== undefined ? params.gamma : 1.0,
              minInputLevel: params.minInputLevel !== undefined ? params.minInputLevel : 0.0,
              maxInputLevel: params.maxInputLevel !== undefined ? params.maxInputLevel : 1.0,
              exposure: params.exposure !== undefined ? params.exposure : 1.0,
            };

            const maxSamples = (this.renderer && this.renderer.capabilities) ? (this.renderer.capabilities.maxSamples || 4) : 4;
            this.sceneTarget = createFBO(1, 1, { type: THREE.HalfFloatType, samples: maxSamples, depthBuffer: true });

            this.bloomPass = new BloomPass(
              this.settings.bloomStrength,
              this.settings.bloomRadius,
              this.settings.bloomThreshold,
              5
            );

            // Anamorphic Passes
            this.anamorphicBrightShader = new THREE.RawShaderMaterial({
              uniforms: {
                inputTexture: { value: null },
                threshold: { value: this.settings.anamorphicThreshold },
                smoothWidth: { value: this.settings.anamorphicSmoothWidth },
              },
              vertexShader: orthoVertexShader,
              fragmentShader: anamorphicBrightShader,
              glslVersion: THREE.GLSL3,
            });
            this.anamorphicBrightPass = new ShaderPass(this.anamorphicBrightShader, {
              format: THREE.RGBAFormat,
              type: THREE.HalfFloatType,
            });

            this.anamorphicBlurShader = new THREE.RawShaderMaterial({
              uniforms: {
                inputTexture: { value: null },
                resolution: { value: new THREE.Vector2(1, 1) },
                samples: { value: this.settings.anamorphicSamples },
                intensity: { value: this.settings.anamorphicIntensity },
                tintColor: { value: this.settings.anamorphicColor },
                bloomRadius: { value: this.settings.anamorphicRadius },
              },
              vertexShader: orthoVertexShader,
              fragmentShader: anamorphicBlurShader,
              glslVersion: THREE.GLSL3,
            });
            this.anamorphicBlurPass = new ShaderPass(this.anamorphicBlurShader, {
              format: THREE.RGBAFormat,
              type: THREE.HalfFloatType,
            });

            // Final Composite Pass
            this.finalShader = new THREE.RawShaderMaterial({
              uniforms: {
                resolution: { value: new THREE.Vector2(1, 1) },
                inputTexture: { value: null },
                blur0Texture: { value: null },
                blur1Texture: { value: null },
                blur2Texture: { value: null },
                blur3Texture: { value: null },
                blur4Texture: { value: null },
                anamorphicTexture: { value: null },
                bloomEnabled: { value: this.settings.bloomEnabled },
                anamorphicEnabled: { value: this.settings.anamorphicEnabled },
                bloomStrength: { value: this.settings.bloomStrength },
                bloomRadius: { value: this.settings.bloomRadius },
                vignetteBoost: { value: this.settings.vignetteBoost },
                vignetteReduction: { value: this.settings.vignetteReduction },
                time: { value: 0 },
              },
              vertexShader: orthoVertexShader,
              fragmentShader: finalFragmentShader,
              glslVersion: THREE.GLSL3,
            });
            this.finalPass = new ShaderPass(this.finalShader, {
              format: THREE.RGBAFormat,
              type: THREE.HalfFloatType,
            });

            // RGB Split, Film Grain & Tone Curve Pass
            this.rgbShader = new THREE.RawShaderMaterial({
              uniforms: {
                inputTexture: { value: null },
                chromaticAberration: { value: this.settings.chromaticAberration },
                noiseIntensity: { value: this.settings.noiseIntensity },
                fisheyeStrength: { value: this.settings.fisheyeStrength },
                fisheyeRadius: { value: this.settings.fisheyeRadius },
                gamma: { value: this.settings.gamma },
                minInputLevel: { value: this.settings.minInputLevel },
                maxInputLevel: { value: this.settings.maxInputLevel },
                exposure: { value: this.settings.exposure },
                time: { value: 0 },
              },
              vertexShader: orthoVertexShader,
              fragmentShader: rgbSplitFragmentShader,
              glslVersion: THREE.GLSL3,
            });
            this.rgbPass = new ShaderPass(this.rgbShader, {
              format: THREE.RGBAFormat,
              type: THREE.HalfFloatType,
            });
          }

          updateSettings() {
            this.bloomPass.strength = this.settings.bloomStrength;
            this.bloomPass.radius = this.settings.bloomRadius;
            this.bloomPass.threshold = this.settings.bloomThreshold;

            this.anamorphicBrightShader.uniforms.threshold.value = this.settings.anamorphicThreshold;
            this.anamorphicBrightShader.uniforms.smoothWidth.value = this.settings.anamorphicSmoothWidth;
            this.anamorphicBlurShader.uniforms.samples.value = this.settings.anamorphicSamples;
            this.anamorphicBlurShader.uniforms.intensity.value = this.settings.anamorphicIntensity;
            this.anamorphicBlurShader.uniforms.tintColor.value.copy(this.settings.anamorphicColor);
            this.anamorphicBlurShader.uniforms.bloomRadius.value = this.settings.anamorphicRadius;

            this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
            this.finalShader.uniforms.anamorphicEnabled.value = this.settings.anamorphicEnabled;
            this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
            this.finalShader.uniforms.bloomRadius.value = this.settings.bloomRadius;
            this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
            this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;

            this.rgbShader.uniforms.chromaticAberration.value = this.settings.chromaticAberration;
            this.rgbShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;
            this.rgbShader.uniforms.fisheyeStrength.value = this.settings.fisheyeStrength;
            this.rgbShader.uniforms.fisheyeRadius.value = this.settings.fisheyeRadius;
            this.rgbShader.uniforms.gamma.value = this.settings.gamma;
            this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
            this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
            this.rgbShader.uniforms.exposure.value = this.settings.exposure;
          }

          setSize(width, height) {
            const w = Math.max(1, width);
            const h = Math.max(1, height);
            this.sceneTarget.setSize(w, h);
            this.bloomPass.setSize(w, h);
            this.finalPass.setSize(w, h);
            this.finalShader.uniforms.resolution.value.set(w, h);

            const anW = Math.max(1, Math.floor(w / 2));
            const anH = Math.max(1, Math.floor(h / 4));
            this.anamorphicBrightPass.setSize(anW, anH);
            this.anamorphicBlurPass.setSize(anW, anH);
            this.anamorphicBlurShader.uniforms.resolution.value.set(anW, anH);

            this.rgbPass.setSize(w, h);
          }

          renderScene(scene, camera) {
            if (!this.settings.enabled) {
              this.renderer.render(scene, camera);
              return;
            }

            this.renderer.setRenderTarget(this.sceneTarget);
            this.renderer.render(scene, camera);
            this.renderer.setRenderTarget(null);

            this.render(this.sceneTarget.texture);
          }

          render(sourceTexture) {
            if (this.settings.bloomEnabled) {
              this.bloomPass.source = sourceTexture;
              this.bloomPass.render(this.renderer);
              this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
              this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
              this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
              this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
              this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;
            }

            if (this.settings.anamorphicEnabled && this.settings.anamorphicIntensity > 0.001) {
              this.anamorphicBrightShader.uniforms.inputTexture.value = sourceTexture;
              this.anamorphicBrightShader.uniforms.threshold.value = this.settings.anamorphicThreshold;
              this.anamorphicBrightShader.uniforms.smoothWidth.value = this.settings.anamorphicSmoothWidth;
              this.anamorphicBrightPass.render(this.renderer);

              this.anamorphicBlurShader.uniforms.inputTexture.value = this.anamorphicBrightPass.texture;
              this.anamorphicBlurShader.uniforms.samples.value = this.settings.anamorphicSamples;
              this.anamorphicBlurShader.uniforms.intensity.value = this.settings.anamorphicIntensity;
              this.anamorphicBlurShader.uniforms.tintColor.value.copy(this.settings.anamorphicColor);
              this.anamorphicBlurShader.uniforms.bloomRadius.value = this.settings.anamorphicRadius;
              this.anamorphicBlurPass.render(this.renderer);

              this.finalPass.shader.uniforms.anamorphicTexture.value = this.anamorphicBlurPass.texture;
              this.finalPass.shader.uniforms.anamorphicEnabled.value = true;
            } else {
              this.finalPass.shader.uniforms.anamorphicEnabled.value = false;
            }

            const rTime = Math.random() * 10000;
            this.finalPass.shader.uniforms.time.value = rTime;
            this.rgbPass.shader.uniforms.time.value = rTime;

            this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
            this.finalPass.render(this.renderer);

            this.rgbPass.shader.uniforms.inputTexture.value = this.finalPass.texture;
            this.rgbPass.render(this.renderer, true);
          }

        // --- Procedural Texture Generators ---
        function generateProceduralTextures() {
            // 1. Warm Rich Walnut Wood Texture
            const woodCanvas = document.createElement('canvas');
            woodCanvas.width = 2048;
            woodCanvas.height = 2048;
            const wCtx = woodCanvas.getContext('2d');

            wCtx.fillStyle = '#482D1D';
            wCtx.fillRect(0, 0, 2048, 2048);

            for (let y = 0; y < 2048; y += 2) {
                const s1 = Math.sin(y * 0.012 + Math.sin(y * 0.003) * 6.0);
                const s2 = Math.sin(y * 0.045 + Math.cos(y * 0.01) * 4.0);
                const v = 0.5 + 0.35 * s1 + 0.15 * s2;
                const r = Math.floor(62 + v * 32);
                const g = Math.floor(38 + v * 22);
                const b = Math.floor(22 + v * 15);
                wCtx.fillStyle = `rgb(${r},${g},${b})`;
                wCtx.fillRect(0, y, 2048, 2);
            }

            wCtx.strokeStyle = 'rgba(25, 12, 6, 0.55)';
            wCtx.lineWidth = 4;
            for (let x = 512; x < 2048; x += 512) {
                wCtx.beginPath();
                wCtx.moveTo(x, 0);
                wCtx.lineTo(x, 2048);
                wCtx.stroke();

                wCtx.strokeStyle = 'rgba(110, 75, 48, 0.25)';
                wCtx.lineWidth = 2;
                wCtx.beginPath();
                wCtx.moveTo(x + 3, 0);
                wCtx.lineTo(x + 3, 2048);
                wCtx.stroke();
                wCtx.strokeStyle = 'rgba(25, 12, 6, 0.55)';
                wCtx.lineWidth = 4;
            }

            const imgData = wCtx.getImageData(0, 0, 2048, 2048);
            const d = imgData.data;
            for (let i = 0; i < d.length; i += 4) {
                const n = (Math.random() - 0.5) * 14;
                d[i] = Math.min(255, Math.max(0, d[i] + n));
                d[i + 1] = Math.min(255, Math.max(0, d[i + 1] + n));
                d[i + 2] = Math.min(255, Math.max(0, d[i + 2] + n));
            }
            wCtx.putImageData(imgData, 0, 0);

            woodTexture = new THREE.CanvasTexture(woodCanvas);
            woodTexture.wrapS = THREE.RepeatWrapping;
            woodTexture.wrapT = THREE.RepeatWrapping;
            woodTexture.repeat.set(1.5, 1.5);

            const rCanvas = document.createElement('canvas');
            rCanvas.width = 1024;
            rCanvas.height = 1024;
            const rCtx = rCanvas.getContext('2d');
            rCtx.fillStyle = '#6E6E6E';
            rCtx.fillRect(0, 0, 1024, 1024);
            for (let i = 0; i < 400; i++) {
                rCtx.fillStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.05)';
                const y = Math.random() * 1024;
                rCtx.fillRect(0, y, 1024, 2 + Math.random() * 4);
            }
            woodRoughnessTexture = new THREE.CanvasTexture(rCanvas);
            woodRoughnessTexture.wrapS = THREE.RepeatWrapping;
            woodRoughnessTexture.wrapT = THREE.RepeatWrapping;
            woodRoughnessTexture.repeat.set(2, 2);

            // 2. High-grade tactile paper texture (Smooth, no moiré)
            const pCanvas = document.createElement('canvas');
            pCanvas.width = 1024;
            pCanvas.height = 1024;
            const pCtx = pCanvas.getContext('2d');
            pCtx.fillStyle = '#FFFFFF';
            pCtx.fillRect(0, 0, 1024, 1024);

            const pData = pCtx.getImageData(0, 0, 1024, 1024);
            const pd = pData.data;
            for (let i = 0; i < pd.length; i += 4) {
                const n = (Math.random() - 0.5) * 12;
                pd[i] = Math.min(255, Math.max(0, pd[i] + n));
                pd[i + 1] = Math.min(255, Math.max(0, pd[i + 1] + n));
                pd[i + 2] = Math.min(255, Math.max(0, pd[i + 2] + n));
            }
            pCtx.putImageData(pData, 0, 0);

            pCtx.strokeStyle = 'rgba(180, 160, 140, 0.05)';
            pCtx.lineWidth = 1;
            for (let i = 0; i < 200; i++) {
                pCtx.beginPath();
                const sx = Math.random() * 1024;
                const sy = Math.random() * 1024;
                pCtx.moveTo(sx, sy);
                pCtx.lineTo(sx + (Math.random() - 0.5) * 12, sy + (Math.random() - 0.5) * 12);
                pCtx.stroke();
            }

            paperTexture = new THREE.CanvasTexture(pCanvas);
            paperTexture.wrapS = THREE.RepeatWrapping;
            paperTexture.wrapT = THREE.RepeatWrapping;
            paperTexture.generateMipmaps = true;
            paperTexture.minFilter = THREE.LinearMipmapLinearFilter;
            paperTexture.repeat.set(2, 2);

            paperBumpTexture = paperTexture;

            // 3. Soft Radial Glow Texture for Delicate Inner Light
            const gCanvas = document.createElement('canvas');
            gCanvas.width = 512;
            gCanvas.height = 512;
            const gCtx = gCanvas.getContext('2d');
            const grad = gCtx.createRadialGradient(256, 256, 0, 256, 256, 256);
            grad.addColorStop(0, 'rgba(255, 240, 200, 1)');
            grad.addColorStop(0.35, 'rgba(255, 210, 140, 0.6)');
            grad.addColorStop(0.7, 'rgba(255, 180, 100, 0.15)');
            grad.addColorStop(1, 'rgba(255, 160, 80, 0)');
            gCtx.fillStyle = grad;
            gCtx.fillRect(0, 0, 512, 512);

            softGlowTexture = new THREE.CanvasTexture(gCanvas);
        }

        // --- Create Realistic 3D Envelope & Enclosed Letter (No Leaks / No Model Outside) ---
        function createEnvelope() {
            envelopeGroup = new THREE.Group();
            envelopeGroup.position.copy(defaultTransforms.envelope.pos);
            envelopeGroup.rotation.copy(defaultTransforms.envelope.rot);
            envelopeGroup.userData = { isInteractable: true, id: 'envelope' };

            const w = 3.8;
            const h = 2.4;

            envelopeMaterial = new THREE.MeshPhysicalMaterial({
                color: new THREE.Color(settings.envelopeColor),
                map: paperTexture,
                bumpMap: paperBumpTexture,
                bumpScale: 0.003,
                roughness: 0.76,
                metalness: 0.01,
                sheen: 0.22,
                sheenColor: new THREE.Color(0xFFFFFF),
                side: THREE.DoubleSide
            });

            // 1. Front Face of Envelope (Bottom plate resting on desk)
            // Completely solid, no cutouts or seams
            const frontPlateGeo = new THREE.PlaneGeometry(w, h);
            const frontPlate = new THREE.Mesh(frontPlateGeo, envelopeMaterial);
            frontPlate.rotation.x = -Math.PI / 2;
            frontPlate.position.set(0, 0.005, 0);
            frontPlate.receiveShadow = true;
            frontPlate.castShadow = true;
            envelopeGroup.add(frontPlate);

            // 2. Back Face: Authentic 3-Flap Folded Sleeve Pocket
            // The bottom flap folds UP from bottom (+h/2) to z = -0.45, completely enclosing the letter!
            // Left & Right flaps fold inwards from edges
            const leftFlapShape = new THREE.Shape();
            leftFlapShape.moveTo(-w * 0.5, h * 0.5);
            leftFlapShape.lineTo(-w * 0.5, -h * 0.5);
            leftFlapShape.lineTo(-0.15, 0.0);
            leftFlapShape.closePath();
            const leftFlapGeo = new THREE.ShapeGeometry(leftFlapShape);
            const leftFlap = new THREE.Mesh(leftFlapGeo, envelopeMaterial);
            leftFlap.rotation.x = -Math.PI / 2;
            leftFlap.position.set(0, 0.032, 0);
            leftFlap.receiveShadow = true;
            leftFlap.castShadow = true;
            envelopeGroup.add(leftFlap);

            const rightFlapShape = new THREE.Shape();
            rightFlapShape.moveTo(w * 0.5, h * 0.5);
            rightFlapShape.lineTo(w * 0.5, -h * 0.5);
            rightFlapShape.lineTo(0.15, 0.0);
            rightFlapShape.closePath();
            const rightFlapGeo = new THREE.ShapeGeometry(rightFlapShape);
            const rightFlap = new THREE.Mesh(rightFlapGeo, envelopeMaterial);
            rightFlap.rotation.x = -Math.PI / 2;
            rightFlap.position.set(0, 0.032, 0);
            rightFlap.receiveShadow = true;
            rightFlap.castShadow = true;
            envelopeGroup.add(rightFlap);

            // Bottom Flap: Folds UP from +h/2 all the way to -0.45, covering 85% of the envelope height!
            const bottomFlapShape = new THREE.Shape();
            bottomFlapShape.moveTo(-w * 0.5, h * 0.5);
            bottomFlapShape.lineTo(w * 0.5, h * 0.5);
            bottomFlapShape.lineTo(0.0, -0.45);
            bottomFlapShape.closePath();
            const bottomFlapGeo = new THREE.ShapeGeometry(bottomFlapShape);
            const bottomFlap = new THREE.Mesh(bottomFlapGeo, envelopeMaterial);
            bottomFlap.rotation.x = -Math.PI / 2;
            bottomFlap.position.set(0, 0.036, 0);
            bottomFlap.receiveShadow = true;
            bottomFlap.castShadow = true;
            envelopeGroup.add(bottomFlap);

            // 3. Pristine Letter Inside (100% Contained, Never Outside the Envelope)
            // Letter dimensions: comfortably smaller than envelope (w=2.8 vs 3.8, h=1.7 vs 2.4)
            const letterW = 2.8;
            const letterH = 1.7;
            const letterGeo = new THREE.PlaneGeometry(letterW, letterH, 12, 12);
            const lPos = letterGeo.attributes.position;
            for (let i = 0; i < lPos.count; i++) {
                const lx = lPos.getX(i);
                const lz = 0.008 * Math.sin((lx / (letterW * 0.5)) * Math.PI);
                lPos.setZ(i, lz);
            }
            letterGeo.computeVertexNormals();

            letterMaterial = new THREE.MeshPhysicalMaterial({
                color: new THREE.Color(settings.letterColor),
                map: paperTexture,
                bumpMap: paperBumpTexture,
                bumpScale: 0.003,
                roughness: 0.68,
                metalness: 0.01,
                sheen: 0.35,
                sheenColor: new THREE.Color(0xFFFFFF),
                side: THREE.DoubleSide
            });

            letterMesh = new THREE.Mesh(letterGeo, letterMaterial);
            letterMesh.rotation.x = -Math.PI / 2;
            // Nestled inside sleeve: y=0.018 (strictly between front 0.005 and back flaps 0.032)
            // Base Z=0.35 (when closed, letter is completely deep inside the sleeve, top edge at -0.50)
            letterMesh.position.set(0, 0.018, 0.35);
            letterMesh.receiveShadow = true;
            letterMesh.castShadow = true;
            envelopeGroup.add(letterMesh);

            // 4. Smooth Opening Flap (Top triangular flap hinged at top crease z = -h/2 = -1.2)
            flapPivot = new THREE.Group();
            flapPivot.position.set(0, 0.038, -h * 0.5);

            // Flap triangle: reaches down to +1.44 when closed (overlapping bottom flap)
            const flapShape = new THREE.Shape();
            flapShape.moveTo(-w * 0.5, 0);
            flapShape.lineTo(w * 0.5, 0);
            flapShape.lineTo(0.06, h * 0.60);
            flapShape.bezierCurveTo(0.03, h * 0.62, -0.03, h * 0.62, -0.06, h * 0.60);
            flapShape.closePath();

            const flapGeo = new THREE.ShapeGeometry(flapShape, 24);
            const flapMesh = new THREE.Mesh(flapGeo, envelopeMaterial);
            flapMesh.rotation.x = -Math.PI / 2; // Flat on top pointing towards bottom when flapPivot.rotation.x = 0
            flapMesh.receiveShadow = true;
            flapMesh.castShadow = true;
            flapPivot.add(flapMesh);

            envelopeGroup.add(flapPivot);

            // 5. Subtle, Ethereal Warm Light Emerging from Throat ("тонкий свет")
            envelopeInnerLight = new THREE.PointLight(new THREE.Color(settings.innerGlowColor), 0, 3.2, 1.8);
            envelopeInnerLight.position.set(0, 0.08, -0.45);
            envelopeGroup.add(envelopeInnerLight);

            // Soft radial glow disc
            const glowGeo = new THREE.PlaneGeometry(2.0, 2.0);
            const glowMat = new THREE.MeshBasicMaterial({
                map: softGlowTexture,
                transparent: true,
                opacity: 0,
                blending: THREE.AdditiveBlending,
                side: THREE.DoubleSide,
                depthWrite: false
            });
            envelopeGlowMesh = new THREE.Mesh(glowGeo, glowMat);
            envelopeGlowMesh.rotation.x = -Math.PI / 2;
            envelopeGlowMesh.position.set(0, 0.04, -0.45);
            envelopeGroup.add(envelopeGlowMesh);

            scene.add(envelopeGroup);
        }

        // --- Realistic Dried Rose Lying Naturally on Table ---
        function createDriedRose() {
            roseGroup = new THREE.Group();
            roseGroup.position.copy(defaultTransforms.rose.pos);
            roseGroup.rotation.copy(defaultTransforms.rose.rot);
            roseGroup.userData = { isInteractable: true, id: 'rose' };

            // 1. Organic Curved Stem Lying on Wood
            const stemPoints = [
                new THREE.Vector3(0, 0.02, 1.3),
                new THREE.Vector3(0.14, 0.025, 0.65),
                new THREE.Vector3(-0.08, 0.03, 0.0),
                new THREE.Vector3(0.06, 0.038, -0.65),
                new THREE.Vector3(0, 0.05, -1.15)
            ];
            const stemCurve = new THREE.CatmullRomCurve3(stemPoints);
            const stemGeo = new THREE.TubeGeometry(stemCurve, 36, 0.026, 8, false);

            stemMaterial = new THREE.MeshStandardMaterial({
                color: new THREE.Color(settings.roseStemColor),
                roughness: 0.88,
                metalness: 0.04
            });

            const stemMesh = new THREE.Mesh(stemGeo, stemMaterial);
            stemMesh.castShadow = true;
            stemMesh.receiveShadow = true;
            roseGroup.add(stemMesh);

            // Tiny thorns on stem
            const thornGeo = new THREE.ConeGeometry(0.018, 0.055, 6);
            thornGeo.rotateX(Math.PI * 0.5);
            [0.26, 0.52, 0.78].forEach((t, i) => {
                const pt = stemCurve.getPointAt(t);
                const thornMesh = new THREE.Mesh(thornGeo, stemMaterial);
                thornMesh.position.copy(pt);
                thornMesh.rotation.y = (i % 2 === 0 ? 1.2 : -1.2);
                thornMesh.castShadow = true;
                roseGroup.add(thornMesh);
            });

            // 2. Dried Curled Leaves Resting on Desk
            const leafShape = new THREE.Shape();
            leafShape.moveTo(0, 0);
            leafShape.bezierCurveTo(0.12, 0.1, 0.18, 0.28, 0.03, 0.44);
            leafShape.bezierCurveTo(-0.14, 0.3, -0.1, 0.12, 0, 0);

            const leafGeo = new THREE.ShapeGeometry(leafShape, 12);
            const leafPos = leafGeo.attributes.position;
            for (let i = 0; i < leafPos.count; i++) {
                const lx = leafPos.getX(i);
                const ly = leafPos.getY(i);
                leafPos.setZ(i, Math.sin(lx * 6.0) * 0.03 - ly * 0.03);
            }
            leafGeo.computeVertexNormals();

            const leaf1 = new THREE.Mesh(leafGeo, stemMaterial);
            leaf1.position.set(0.12, 0.022, 0.5);
            leaf1.rotation.set(-1.52, 0.4, 0.2);
            leaf1.scale.set(0.65, 0.65, 0.65);
            leaf1.castShadow = true;
            leaf1.receiveShadow = true;
            roseGroup.add(leaf1);

            const leaf2 = new THREE.Mesh(leafGeo, stemMaterial);
            leaf2.position.set(-0.08, 0.025, -0.15);
            leaf2.rotation.set(-1.48, -0.5, -0.3);
            leaf2.scale.set(0.6, 0.6, 0.6);
            leaf2.castShadow = true;
            leaf2.receiveShadow = true;
            roseGroup.add(leaf2);

            // 3. Flower Blossom (Smooth, Curved Dried Petals Resting Gently)
            const flowerHead = new THREE.Group();
            flowerHead.position.set(0, 0.09, -1.2);
            flowerHead.rotation.set(-0.25, 0.35, -0.15);

            roseMaterial = new THREE.MeshStandardMaterial({
                color: new THREE.Color(settings.roseColor),
                roughness: 0.76,
                metalness: 0.02,
                side: THREE.DoubleSide
            });

            function createRosePetalGeometry(width, length, curl) {
                const geom = new THREE.PlaneGeometry(width, length, 12, 12);
                const pos = geom.attributes.position;
                for (let i = 0; i < pos.count; i++) {
                    const u = (pos.getX(i) / (width * 0.5));
                    const v = (pos.getY(i) / length);
                    let z = -Math.sin(v * Math.PI) * curl;
                    z += (Math.sin(u * 4.0) + Math.cos(v * 5.0)) * 0.012;
                    pos.setZ(i, z);
                }
                geom.computeVertexNormals();
                return geom;
            }

            const layers = [
                { count: 4, radius: 0.04, w: 0.16, l: 0.20, curl: 0.07, tilt: 0.18 },
                { count: 6, radius: 0.09, w: 0.22, l: 0.28, curl: 0.10, tilt: 0.38 },
                { count: 7, radius: 0.15, w: 0.30, l: 0.36, curl: 0.13, tilt: 0.62 },
                { count: 9, radius: 0.22, w: 0.38, l: 0.44, curl: 0.16, tilt: 0.88 }
            ];

            layers.forEach((layer, layerIdx) => {
                for (let p = 0; p < layer.count; p++) {
                    const angle = (p / layer.count) * Math.PI * 2 + (layerIdx * 0.55);
                    const petalGeo = createRosePetalGeometry(layer.w, layer.l, layer.curl);
                    const petalMesh = new THREE.Mesh(petalGeo, roseMaterial);

                    petalMesh.position.set(
                        Math.cos(angle) * layer.radius,
                        0.04 + layerIdx * 0.025,
                        Math.sin(angle) * layer.radius
                    );
                    petalMesh.rotation.y = -angle + Math.PI * 0.5;
                    petalMesh.rotation.x = layer.tilt + (Math.random() - 0.5) * 0.08;
                    petalMesh.rotation.z = (Math.random() - 0.5) * 0.12;

                    petalMesh.castShadow = true;
                    petalMesh.receiveShadow = true;
                    flowerHead.add(petalMesh);
                }
            });

            // Dried sepals
            for (let s = 0; s < 5; s++) {
                const sAngle = (s / 5) * Math.PI * 2;
                const sepalShape = new THREE.Shape();
                sepalShape.moveTo(0, 0);
                sepalShape.lineTo(0.035, 0.22);
                sepalShape.lineTo(-0.035, 0.22);
                sepalShape.closePath();
                const sepalGeo = new THREE.ShapeGeometry(sepalShape);
                const sepalMesh = new THREE.Mesh(sepalGeo, stemMaterial);
                sepalMesh.position.set(Math.cos(sAngle) * 0.11, -0.015, Math.sin(sAngle) * 0.11);
                sepalMesh.rotation.y = -sAngle + Math.PI * 0.5;
                sepalMesh.rotation.x = 1.35;
                sepalMesh.castShadow = true;
                flowerHead.add(sepalMesh);
            }

            roseGroup.add(flowerHead);

            // 4. Loose dried petals fallen on desk (completely separate from envelope)
            const fallenPetalGeo = createRosePetalGeometry(0.24, 0.32, 0.08);
            const fallenOffsets = [
                { x: 0.15, y: 0.012, z: 0.45, rotY: 0.6, rotZ: 0.08 },
                { x: -0.28, y: 0.012, z: 0.85, rotY: 2.0, rotZ: -0.1 },
                { x: 0.35, y: 0.012, z: -0.5, rotY: -1.1, rotZ: 0.06 }
            ];
            fallenOffsets.forEach(fo => {
                const fp = new THREE.Mesh(fallenPetalGeo, roseMaterial);
                fp.position.set(fo.x, fo.y, fo.z);
                fp.rotation.set(-Math.PI * 0.5 + fo.rotZ, fo.rotY, 0);
                fp.castShadow = true;
                fp.receiveShadow = true;
                roseGroup.add(fp);
            });

            scene.add(roseGroup);
        }

        // --- Elegant Wax Seal (Placed neatly beside envelope, no clipping) ---
        function createWaxSeal() {
            waxSealGroup = new THREE.Group();
            waxSealGroup.position.copy(defaultTransforms.waxSeal.pos);
            waxSealGroup.rotation.copy(defaultTransforms.waxSeal.rot);
            waxSealGroup.userData = { isInteractable: true, id: 'waxSeal' };

            waxMaterial = new THREE.MeshPhysicalMaterial({
                color: new THREE.Color(settings.waxSealColor),
                roughness: 0.25,
                metalness: 0.04,
                clearcoat: 0.6,
                clearcoatRoughness: 0.18
            });

            // 1. Organic Melted Wax Puddle Shape (Smooth Bevel, No Sharp Teeth)
            const outerShape = new THREE.Shape();
            const segments = 64;
            const baseR = 0.52;
            for (let i = 0; i <= segments; i++) {
                const theta = (i / segments) * Math.PI * 2;
                const r = baseR * (1.0 + 0.05 * Math.sin(5 * theta) + 0.03 * Math.cos(8 * theta));
                const x = Math.cos(theta) * r;
                const y = Math.sin(theta) * r;
                if (i === 0) outerShape.moveTo(x, y);
                else outerShape.lineTo(x, y);
            }

            const extrudeSettings = {
                depth: 0.035,
                bevelEnabled: true,
                bevelSegments: 5,
                steps: 1,
                bevelSize: 0.04,
                bevelThickness: 0.04
            };
            const puddleGeo = new THREE.ExtrudeGeometry(outerShape, extrudeSettings);
            const puddleMesh = new THREE.Mesh(puddleGeo, waxMaterial);
            puddleMesh.rotation.x = -Math.PI / 2;
            puddleMesh.position.y = 0.005;
            puddleMesh.castShadow = true;
            puddleMesh.receiveShadow = true;
            waxSealGroup.add(puddleMesh);

            // 2. Smooth Raised Inner Rim
            const rimGeo = new THREE.TorusGeometry(0.38, 0.03, 16, 64);
            const rimMesh = new THREE.Mesh(rimGeo, waxMaterial);
            rimMesh.rotation.x = -Math.PI / 2;
            rimMesh.position.y = 0.075;
            rimMesh.castShadow = true;
            rimMesh.receiveShadow = true;
            waxSealGroup.add(rimMesh);

            // 3. Smooth Central Seal Medallion (Без символов)
            const centerGeo = new THREE.CylinderGeometry(0.36, 0.36, 0.02, 48);
            const centerMesh = new THREE.Mesh(centerGeo, waxMaterial);
            centerMesh.position.y = 0.065;
            centerMesh.castShadow = true;
            centerMesh.receiveShadow = true;
            waxSealGroup.add(centerMesh);

            // 4. Two tiny cooled wax droplet drops nearby
            const dropGeo = new THREE.SphereGeometry(0.04, 16, 16);
            dropGeo.scale(1.2, 0.35, 1.2);
            [
                { x: 0.48, z: 0.25 },
                { x: -0.42, z: -0.28 }
            ].forEach(dp => {
                const dropMesh = new THREE.Mesh(dropGeo, waxMaterial);
                dropMesh.position.set(dp.x, 0.012, dp.z);
                dropMesh.castShadow = true;
                dropMesh.receiveShadow = true;
                waxSealGroup.add(dropMesh);
            });

            scene.add(waxSealGroup);
        }

        // --- Miniature Delicate Floating Rose Petals (Curved Organic Shapes, Not Confetti) ---
        function createFloatingPetals() {
            petalGroup = new THREE.Group();
            scene.add(petalGroup);

            const count = 42;

            // Organic teardrop curved rose petal shape
            const petalShape = new THREE.Shape();
            petalShape.moveTo(0, -0.05);
            petalShape.bezierCurveTo(0.06, -0.03, 0.09, 0.06, 0.05, 0.12);
            petalShape.bezierCurveTo(0.02, 0.15, -0.02, 0.15, -0.05, 0.12);
            petalShape.bezierCurveTo(-0.09, 0.06, -0.06, -0.03, 0, -0.05);

            const pGeo = new THREE.ShapeGeometry(petalShape, 12);
            const pPos = pGeo.attributes.position;
            for (let i = 0; i < pPos.count; i++) {
                const u = pPos.getX(i);
                const v = pPos.getY(i);
                pPos.setZ(i, -Math.sin((v + 0.05) * 8.0) * 0.02 + Math.cos(u * 12.0) * 0.01);
            }
            pGeo.computeVertexNormals();

            for (let i = 0; i < count; i++) {
                const pMat = new THREE.MeshStandardMaterial({
                    color: new THREE.Color(settings.roseColor),
                    roughness: 0.72,
                    metalness: 0.02,
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: 0.0
                });

                const mesh = new THREE.Mesh(pGeo, pMat);
                mesh.castShadow = true;

                const petalData = {
                    mesh: mesh,
                    originX: (Math.random() - 0.5) * 1.5,
                    originZ: -0.45 + (Math.random() - 0.5) * 0.3,
                    progress: Math.random(),
                    speed: 0.07 + Math.random() * 0.06,
                    swirlRadius: 0.35 + Math.random() * 0.6,
                    swirlFreq: 1.2 + Math.random() * 2.0,
                    phase: Math.random() * Math.PI * 2,
                    rotSpeedX: (Math.random() - 0.5) * 2.5,
                    rotSpeedY: (Math.random() - 0.5) * 3.0,
                    rotSpeedZ: (Math.random() - 0.5) * 2.0
                };

                petalParticles.push(petalData);
                petalGroup.add(mesh);
            }
        }
