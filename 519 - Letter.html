        // --- Apply Color Scheme with Smooth GSAP Transitions ---
        function applyColorScheme(schemeKey, animate = true) {
            const scheme = COLOR_SCHEMES[schemeKey];
            if (!scheme) return;

            settings.scheme = schemeKey;
            settings.bgColor = scheme.bgColor;
            settings.envelopeColor = scheme.envelopeColor;
            settings.letterColor = scheme.letterColor;
            settings.woodColor = scheme.woodColor;
            settings.roseColor = scheme.roseColor;
            settings.roseStemColor = scheme.roseStemColor;
            settings.waxSealColor = scheme.waxSealColor;
            settings.innerGlowColor = scheme.innerGlowColor;
            settings.windowLightColor = scheme.windowLightColor;
            settings.fillLightColor = scheme.fillLightColor;

            if (settings.greenScreen) {
                scene.background = new THREE.Color(0x00FF00);
            } else {
                if (animate) {
                    gsap.to(scene.background, {
                        r: new THREE.Color(scheme.bgColor).r,
                        g: new THREE.Color(scheme.bgColor).g,
                        b: new THREE.Color(scheme.bgColor).b,
                        duration: 0.9,
                        ease: 'power2.out'
                    });
                } else {
                    scene.background.set(scheme.bgColor);
                }
            }

            if (animate) {
                const targetEnv = new THREE.Color(scheme.envelopeColor);
                const targetLet = new THREE.Color(scheme.letterColor);
                const targetWood = new THREE.Color(scheme.woodColor);
                const targetRose = new THREE.Color(scheme.roseColor);
                const targetStem = new THREE.Color(scheme.roseStemColor);
                const targetWax = new THREE.Color(scheme.waxSealColor);
                const targetGlow = new THREE.Color(scheme.innerGlowColor);
                const targetWin = new THREE.Color(scheme.windowLightColor);
                const targetFill = new THREE.Color(scheme.fillLightColor);

                gsap.to(envelopeMaterial.color, { r: targetEnv.r, g: targetEnv.g, b: targetEnv.b, duration: 0.9 });
                gsap.to(letterMaterial.color, { r: targetLet.r, g: targetLet.g, b: targetLet.b, duration: 0.9 });
                gsap.to(woodMaterial.color, { r: targetWood.r, g: targetWood.g, b: targetWood.b, duration: 0.9 });
                gsap.to(roseMaterial.color, { r: targetRose.r, g: targetRose.g, b: targetRose.b, duration: 0.9 });
                gsap.to(stemMaterial.color, { r: targetStem.r, g: targetStem.g, b: targetStem.b, duration: 0.9 });
                gsap.to(waxMaterial.color, { r: targetWax.r, g: targetWax.g, b: targetWax.b, duration: 0.9 });
                gsap.to(windowLight.color, { r: targetWin.r, g: targetWin.g, b: targetWin.b, duration: 0.9 });
                gsap.to(fillLight.color, { r: targetFill.r, g: targetFill.g, b: targetFill.b, duration: 0.9 });
                gsap.to(envelopeInnerLight.color, { r: targetGlow.r, g: targetGlow.g, b: targetGlow.b, duration: 0.9 });

                petalParticles.forEach(p => {
                    gsap.to(p.mesh.material.color, { r: targetRose.r, g: targetRose.g, b: targetRose.b, duration: 0.9 });
                });
            } else {
                envelopeMaterial.color.set(scheme.envelopeColor);
                letterMaterial.color.set(scheme.letterColor);
                woodMaterial.color.set(scheme.woodColor);
                roseMaterial.color.set(scheme.roseColor);
                stemMaterial.color.set(scheme.roseStemColor);
                waxMaterial.color.set(scheme.waxSealColor);
                windowLight.color.set(scheme.windowLightColor);
                fillLight.color.set(scheme.fillLightColor);
                envelopeInnerLight.color.set(scheme.innerGlowColor);

                petalParticles.forEach(p => {
                    p.mesh.material.color.set(scheme.roseColor);
                });
            }

            if (gui) {
                gui.controllersRecursive().forEach(c => {
                    // Do NOT update or touch post-processing folder controllers
                    if (c._folder && c._folder._title && c._folder._title.includes('Post-Processing')) return;
                    c.updateDisplay();
                });
            }
        }

        // --- Update Greenscreen Mode ---
        function updateGreenScreen(enabled) {
            settings.greenScreen = enabled;
            if (enabled) {
                scene.background = new THREE.Color(0x00FF00);
            } else {
                scene.background = new THREE.Color(settings.bgColor);
            }
            if (gui) {
                gui.controllersRecursive().forEach(c => {
                    if (c._folder && c._folder._title && c._folder._title.includes('Post-Processing')) return;
                    c.updateDisplay();
                });
            }
        }

        // --- Procedural Scene Randomization on Click ---
        // IMPORTANT: NEVER SHUFFLE OR CHANGE POST-PROCESSING SETTINGS HERE!
        function randomizeProceduralScene() {
            const schemeKeys = Object.keys(COLOR_SCHEMES);
            const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
            applyColorScheme(randomScheme, true);

            // Re-roll motion and geometric parameters only
            settings.animSpeed = Number((0.65 + Math.random() * 0.75).toFixed(2));
            settings.petalFlowSpeed = Number((0.7 + Math.random() * 0.8).toFixed(2));
            settings.keyLightIntensity = Number((2.0 + Math.random() * 0.8).toFixed(2));
            settings.innerGlowIntensity = Number((1.0 + Math.random() * 0.6).toFixed(2));

            const envRotY = defaultTransforms.envelope.rot.y + (Math.random() - 0.5) * 0.12;
            const roseRotY = defaultTransforms.rose.rot.y + (Math.random() - 0.5) * 0.18;
            const waxRotY = defaultTransforms.waxSeal.rot.y + (Math.random() - 0.5) * 0.25;

            gsap.to(envelopeGroup.rotation, { y: envRotY, duration: 1.0, ease: 'power2.out' });
            gsap.to(roseGroup.rotation, { y: roseRotY, duration: 1.0, ease: 'power2.out' });
            gsap.to(waxSealGroup.rotation, { y: waxRotY, duration: 1.0, ease: 'power2.out' });

            // PostProcessor settings are strictly left unchanged!
            if (gui) {
                gui.controllersRecursive().forEach(c => {
                    if (c._folder && c._folder._title && c._folder._title.includes('Post-Processing')) return;
                    c.updateDisplay();
                });
            }
        }

        // --- Reset Camera & Objects to Default Transforms ---
        function resetScene() {
            gsap.to(settings, {
                userZoomDistance: 7.2,
                userOrbitYaw: 0.0,
                userOrbitPitch: 0.0,
                userPanX: 0.0,
                userPanY: 0.0,
                duration: 0.9,
                ease: 'power2.out',
                onUpdate: () => {
                    if (gui) {
                        gui.controllersRecursive().forEach(c => {
                            if (c._folder && c._folder._title && c._folder._title.includes('Post-Processing')) return;
                            c.updateDisplay();
                        });
                    }
                }
            });

            gsap.to(envelopeGroup.position, {
                x: defaultTransforms.envelope.pos.x,
                y: defaultTransforms.envelope.pos.y,
                z: defaultTransforms.envelope.pos.z,
                duration: 0.9,
                ease: 'power2.out'
            });
            gsap.to(envelopeGroup.rotation, {
                x: defaultTransforms.envelope.rot.x,
                y: defaultTransforms.envelope.rot.y,
                z: defaultTransforms.envelope.rot.z,
                duration: 0.9,
                ease: 'power2.out'
            });

            gsap.to(roseGroup.position, {
                x: defaultTransforms.rose.pos.x,
                y: defaultTransforms.rose.pos.y,
                z: defaultTransforms.rose.pos.z,
                duration: 0.9,
                ease: 'power2.out'
            });
            gsap.to(roseGroup.rotation, {
                x: defaultTransforms.rose.rot.x,
                y: defaultTransforms.rose.rot.y,
                z: defaultTransforms.rose.rot.z,
                duration: 0.9,
                ease: 'power2.out'
            });

            gsap.to(waxSealGroup.position, {
                x: defaultTransforms.waxSeal.pos.x,
                y: defaultTransforms.waxSeal.pos.y,
                z: defaultTransforms.waxSeal.pos.z,
                duration: 0.9,
                ease: 'power2.out'
            });
            gsap.to(waxSealGroup.rotation, {
                x: defaultTransforms.waxSeal.rot.x,
                y: defaultTransforms.waxSeal.rot.y,
                z: defaultTransforms.waxSeal.rot.z,
                duration: 0.9,
                ease: 'power2.out'
            });
        }

        // --- Recreate WebGL Renderer with Antialiasing Toggle ---
        function setAntialias(antialiasState) {
            settings.antialias = antialiasState;
            const canvas = document.getElementById('webgl');
            
            renderer.dispose();

            renderer = new THREE.WebGLRenderer({
                canvas: canvas,
                antialias: antialiasState,
                powerPreference: 'high-performance'
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(settings.dpr);
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = settings.exposure;
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            if (postProcessor) {
                postProcessor.renderer = renderer;
                postProcessor.setSize(window.innerWidth, window.innerHeight);
            }
        }

        // --- User Interaction Listeners ---
        function setupInteractions() {
            window.addEventListener('pointerdown', (e) => {
                if (e.target.closest('.lil-gui')) return;

                isPointerDown = true;
                pointerDownPos.set(e.clientX, e.clientY);
                lastPointerPos.set(e.clientX, e.clientY);

                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);

                const interactables = [envelopeGroup, roseGroup, waxSealGroup];
                const intersects = raycaster.intersectObjects(interactables, true);

                if (intersects.length > 0) {
                    let hitObj = intersects[0].object;
                    while (hitObj.parent && !hitObj.userData.isInteractable) {
                        hitObj = hitObj.parent;
                    }

                    if (hitObj.userData.isInteractable) {
                        isDraggingObject = true;
                        draggedObject = hitObj;

                        dragPlane.setFromNormalAndCoplanarPoint(new THREE.Vector3(0, 1, 0), draggedObject.position);
                        if (raycaster.ray.intersectPlane(dragPlane, planeIntersect)) {
                            dragOffset.copy(draggedObject.position).sub(planeIntersect);
                        }
                    }
                } else {
                    isDraggingObject = false;
                    draggedObject = null;
                }
            });

            window.addEventListener('pointermove', (e) => {
                if (!isPointerDown) return;

                const dx = e.clientX - lastPointerPos.x;
                const dy = e.clientY - lastPointerPos.y;
                lastPointerPos.set(e.clientX, e.clientY);

                if (isDraggingObject && draggedObject) {
                    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                    raycaster.setFromCamera(mouse, camera);

                    if (raycaster.ray.intersectPlane(dragPlane, planeIntersect)) {
                        const targetPos = planeIntersect.add(dragOffset);
                        draggedObject.position.x = targetPos.x;
                        draggedObject.position.z = targetPos.z;
                    }
                } else {
                    if (e.buttons === 2 || e.buttons === 4 || e.shiftKey) {
                        const panSpeed = 0.0055 * (settings.userZoomDistance / 7.2);
                        settings.userPanX -= dx * panSpeed;
                        settings.userPanY += dy * panSpeed;
                    } else {
                        const orbitSpeed = 0.0055;
                        settings.userOrbitYaw += dx * orbitSpeed;
                        settings.userOrbitPitch = THREE.MathUtils.clamp(settings.userOrbitPitch + dy * orbitSpeed, -0.65, 0.65);
                    }
                    if (gui) {
                        gui.controllersRecursive().forEach(c => {
                            if (c._folder && c._folder._title && c._folder._title.includes('Post-Processing')) return;
                            c.updateDisplay();
                        });
                    }
                }
            });

            window.addEventListener('pointerup', (e) => {
                if (!isPointerDown) return;
                const distMoved = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);

                if (distMoved < 6 && !isDraggingObject && settings.clickToRandomize && !e.target.closest('.lil-gui')) {
                    randomizeProceduralScene();
                }

                isPointerDown = false;
                isDraggingObject = false;
                draggedObject = null;
            });

            // Zoom with mouse wheel (persists smoothly during camera animation without resetting)
            window.addEventListener('wheel', (e) => {
                if (e.target.closest('.lil-gui')) return;
                e.preventDefault();

                const zoomFactor = Math.exp(e.deltaY * 0.0012);
                settings.userZoomDistance = THREE.MathUtils.clamp(settings.userZoomDistance * zoomFactor, 2.8, 16.0);
                if (gui) {
                    gui.controllersRecursive().forEach(c => {
                        if (c._folder && c._folder._title && c._folder._title.includes('Post-Processing')) return;
                        c.updateDisplay();
                    });
                }
            }, { passive: false });

            // Hide/Show UI with 'H' key
            window.addEventListener('keydown', (e) => {
                if (e.key === 'h' || e.key === 'H') {
                    if (gui) {
                        const isHidden = gui.domElement.style.display === 'none';
                        gui.domElement.style.display = isHidden ? '' : 'none';
                    }
                }
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(settings.dpr);
                if (postProcessor) {
                    postProcessor.setSize(window.innerWidth, window.innerHeight);
                }
            });
        }

        // --- Setup lil-gui Control Panel (Default styles, no overrides) ---
        function setupGUI() {
            gui = new GUI({ title: 'Конверт и письмо' });

            // Color Schemes & Palette
            const fColor = gui.addFolder('Цветовая гамма');
            fColor.add(settings, 'scheme', Object.keys(COLOR_SCHEMES)).name('Пресет палитры').onChange((val) => {
                applyColorScheme(val, true);
            });
            fColor.add(settings, 'greenScreen').name('Хромакей (#00ff00)').onChange(updateGreenScreen);
            fColor.addColor(settings, 'bgColor').name('Цвет фона').onChange((c) => {
                if (!settings.greenScreen) scene.background.set(c);
            });
            fColor.addColor(settings, 'envelopeColor').name('Конверт').onChange((c) => envelopeMaterial.color.set(c));
            fColor.addColor(settings, 'letterColor').name('Письмо').onChange((c) => letterMaterial.color.set(c));
            fColor.addColor(settings, 'woodColor').name('Дерево стола').onChange((c) => woodMaterial.color.set(c));
            fColor.addColor(settings, 'roseColor').name('Сухая роза').onChange((c) => {
                roseMaterial.color.set(c);
                petalParticles.forEach(p => p.mesh.material.color.set(c));
            });
            fColor.addColor(settings, 'roseStemColor').name('Стебель розы').onChange((c) => stemMaterial.color.set(c));
            fColor.addColor(settings, 'waxSealColor').name('Восковая печать').onChange((c) => waxMaterial.color.set(c));
            fColor.addColor(settings, 'innerGlowColor').name('Свет изнутри').onChange((c) => {
                envelopeInnerLight.color.set(c);
            });

            // Animations & Motion
            const fMotion = gui.addFolder('Анимация');
            fMotion.add(settings, 'animationPreset', ANIMATION_PRESETS).name('Режим камеры').listen();
            fMotion.add(settings, 'animSpeed', 0.1, 3.0, 0.05).name('Скорость').listen();
            fMotion.add(settings, 'petalFlowSpeed', 0.2, 3.0, 0.05).name('Скорость лепестков').listen();
            fMotion.add(settings, 'autoAnimateFlap').name('Авто-раскрытие клапана');
            fMotion.add(settings, 'flapProgress', 0.0, 1.0, 0.01).name('Клапан конверта').listen();

            // Camera & Procedural
            const fCamera = gui.addFolder('Камера и управление');
            fCamera.add(settings, 'userZoomDistance', 2.8, 16.0, 0.1).name('Дистанция (Zoom)').listen();
            fCamera.add(settings, 'clickToRandomize').name('Рандом при клике');
            fCamera.add({ reset: resetScene }, 'reset').name('Сбросить позицию');

            // Lighting & Rendering
            const fRender = gui.addFolder('Освещение и рендер');
            fRender.add(settings, 'exposure', 0.2, 2.5, 0.02).name('Экспозиция').onChange(v => {
                renderer.toneMappingExposure = v;
            });
            fRender.add(settings, 'keyLightIntensity', 0.0, 5.0, 0.1).name('Свет из окна').onChange(v => {
                windowLight.intensity = v;
            });
            fRender.addColor(settings, 'windowLightColor').name('Цвет окна').onChange(c => windowLight.color.set(c));
            fRender.add(settings, 'ambientLightIntensity', 0.0, 2.0, 0.05).name('Заполняющий свет').onChange(v => {
                ambientLight.intensity = v;
            });
            fRender.add(settings, 'fillLightIntensity', 0.0, 2.0, 0.05).name('Контровой свет').onChange(v => {
                fillLight.intensity = v;
            });
            fRender.addColor(settings, 'fillLightColor').name('Цвет контрового').onChange(c => fillLight.color.set(c));
            fRender.add(settings, 'innerGlowIntensity', 0.0, 4.0, 0.1).name('Яркость изнутри').listen();
            fRender.add(settings, 'dpr', 0.5, 3.0, 0.1).name('DPR (Pixel Ratio)').onChange(v => {
                renderer.setPixelRatio(v);
                if (postProcessor) postProcessor.setSize(window.innerWidth, window.innerHeight);
            });
            fRender.add(settings, 'antialias').name('Сглаживание (AA)').onChange(setAntialias);

            // PostProcessor Suite Integration
            if (postProcessor) {
                postProcessor.attachGUI(gui, "Post-Processing (PostProcessor.js)");
            }
        }

        // --- Main Render & Animation Loop ---
        let clock = new THREE.Clock();
        let animationTime = 0;

        function animate() {
            requestAnimationFrame(animate);

            const dt = clock.getDelta();
            const timeScale = settings.animSpeed;
            animationTime += dt * timeScale;

            // 1. Envelope Flap & Enclosed Letter Animation
            if (settings.autoAnimateFlap) {
                // Smooth breathing loop: stays gently open, closes softly, opens again
                const cycle = (Math.sin(animationTime * 0.45) + 1.0) * 0.5;
                settings.flapProgress = THREE.MathUtils.smoothstep(cycle, 0.1, 0.9);
            }

            // Flap rotates from 0 (closed, flat on front) backwards up and onto the desk (-2.6 rad)
            const maxFlapAngle = -Math.PI * 0.82;
            flapPivot.rotation.x = settings.flapProgress * maxFlapAngle;

            // Letter is nestled inside sleeve; when flap opens, letter smoothly glides forward/up from 0.35 to 0.0
            const letterSlide = settings.flapProgress * 0.35;
            letterMesh.position.z = 0.35 - letterSlide;

            // Delicate inner glow emerges softly as flap opens
            const glowPower = settings.flapProgress * settings.innerGlowIntensity;
            envelopeInnerLight.intensity = glowPower;
            envelopeGlowMesh.material.opacity = settings.flapProgress * 0.28;

            // 2. Floating Petals Animation
            const petalSpeedFactor = settings.petalFlowSpeed * timeScale;
            petalParticles.forEach(p => {
                p.progress += dt * p.speed * petalSpeedFactor;
                if (p.progress > 1.0) p.progress -= 1.0;

                const prog = p.progress;

                // Petal rises vertically out of the envelope mouth
                const currentY = 0.05 + Math.pow(prog, 1.2) * 3.2;

                // Spiral turbulence swirl
                const angle = prog * p.swirlFreq * Math.PI * 2 + p.phase;
                const radius = p.swirlRadius * Math.sin(prog * Math.PI * 0.85);

                const currentX = envelopeGroup.position.x + p.originX + Math.cos(angle) * radius;
                const currentZ = envelopeGroup.position.z + p.originZ + Math.sin(angle) * radius * 0.7;

                p.mesh.position.set(currentX, currentY, currentZ);

                // Organic tumbling rotation
                p.mesh.rotation.x += dt * p.rotSpeedX * petalSpeedFactor;
                p.mesh.rotation.y += dt * p.rotSpeedY * petalSpeedFactor;
                p.mesh.rotation.z += dt * p.rotSpeedZ * petalSpeedFactor;

                // Opacity: fades in when emerging, fades out near top, only active when flap is opening
                const visibility = THREE.MathUtils.smoothstep(prog, 0.02, 0.18) * (1.0 - THREE.MathUtils.smoothstep(prog, 0.75, 0.98));
                p.mesh.material.opacity = visibility * THREE.MathUtils.smoothstep(settings.flapProgress, 0.2, 0.65);
            });

            // 3. Camera Animation Presets (Maintaining user's zoom & manual angles)
            let baseYaw = 0.0;
            let basePitch = 0.98; // ~56 degrees elevation
            let baseTarget = new THREE.Vector3(settings.userPanX, 0.04, settings.userPanY);

            const preset = settings.animationPreset;

            if (preset === 'Gentle Romantic Drift') {
                baseYaw = Math.sin(animationTime * 0.25) * 0.22;
                basePitch = 0.98 + Math.cos(animationTime * 0.2) * 0.08;
            } else if (preset === 'Static (No Camera Motion)') {
                baseYaw = 0.0;
                basePitch = 0.98;
            } else if (preset === 'Slow Cinematic Orbit') {
                baseYaw = animationTime * 0.18;
                basePitch = 0.88 + Math.sin(animationTime * 0.15) * 0.12;
            } else if (preset === 'Top-Down Overhead Study') {
                baseYaw = Math.sin(animationTime * 0.18) * 0.12;
                basePitch = 1.35 + Math.cos(animationTime * 0.22) * 0.06;
            } else if (preset === 'Window Light & Long Shadows') {
                baseYaw = -0.75 + Math.sin(animationTime * 0.2) * 0.15;
                basePitch = 0.58 + Math.cos(animationTime * 0.18) * 0.06;
            } else if (preset === 'Macro Detail: Rose & Seal') {
                baseYaw = 0.45 + Math.sin(animationTime * 0.22) * 0.12;
                basePitch = 0.72 + Math.cos(animationTime * 0.2) * 0.06;
                baseTarget.set(1.1 + settings.userPanX, 0.08, 0.2 + settings.userPanY);
            } else if (preset === 'Ethereal Petal Ascent') {
                const ascentCycle = (Math.sin(animationTime * 0.3) + 1.0) * 0.5;
                baseYaw = Math.sin(animationTime * 0.2) * 0.2;
                basePitch = 0.75 + ascentCycle * 0.35;
                baseTarget.set(settings.userPanX, 0.04 + ascentCycle * 0.8, settings.userPanY);
            } else if (preset === 'Poetic Still-Life Infinity') {
                baseYaw = Math.sin(animationTime * 0.22) * 0.28;
                basePitch = 0.95 + Math.sin(animationTime * 0.44) * 0.12;
            }

            const totalYaw = baseYaw + settings.userOrbitYaw;
            const totalPitch = THREE.MathUtils.clamp(basePitch + settings.userOrbitPitch, 0.12, Math.PI * 0.48);
            const dist = settings.userZoomDistance;

            camera.position.x = baseTarget.x + dist * Math.sin(totalYaw) * Math.cos(totalPitch);
            camera.position.y = baseTarget.y + dist * Math.sin(totalPitch);
            camera.position.z = baseTarget.z + dist * Math.cos(totalYaw) * Math.cos(totalPitch);
            camera.lookAt(baseTarget);

            // Render through PostProcessor pipeline
            if (postProcessor && postProcessor.settings.enabled) {
                postProcessor.renderScene(scene, camera);
            } else {
                renderer.render(scene, camera);
            }
        }

        // --- Application Bootstrap ---
        function init() {
            const canvas = document.getElementById('webgl');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(settings.bgColor);

            camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 60);

            renderer = new THREE.WebGLRenderer({
                canvas: canvas,
                antialias: settings.antialias,
                powerPreference: 'high-performance'
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(settings.dpr);
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = settings.exposure;
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            // Initialize PostProcessor Suite with Anamorphic strictly OFF by default
            postProcessor = new PostProcessor(renderer, {
                enabled: true,
                bloomEnabled: true,
                bloomStrength: 0.85,
                bloomRadius: 0.5,
                bloomThreshold: 0.25,
                anamorphicEnabled: false, // Default is OFF
                chromaticAberration: 0.003,
                vignetteBoost: 1.05,
                vignetteReduction: 0.55,
                noiseIntensity: 0.008
            });
            postProcessor.setSize(window.innerWidth, window.innerHeight);

            generateProceduralTextures();
            setupLights();
            createDesk();
            createEnvelope();
            createDriedRose();
            createWaxSeal();
            createFloatingPetals();

            setupInteractions();
            setupGUI();

            animate();
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
