      },
      'Palette 5 (Toxic Lime)': {

      },
      'Palette 6 (Sunset Dusk)': {

      },
      'Palette 7 (Royal Violet)': {
        primary: '#E8E0FF',
        secondary: '#B38FFF',
        accent: '#6A3DE8',
        glow: '#B38FFF',
        bg: '#090612',
        light1: '#B38FFF',
        light2: '#6A3DE8'
      },
      'Palette 8 (Neon Cyberpunk)': {
        primary: '#E0FBFF',
        secondary: '#00F0FF',
        accent: '#D40078',
        glow: '#00F0FF',
        bg: '#05020F',
        light1: '#00F0FF',
        light2: '#D40078'

    // --- State & Parameters ---
    const initialScheme = colorSchemes['Original'];
    const params = {
      // Color
      colorScheme: 'Original',
      greenScreen: false,
      backgroundColor: initialScheme.bg,
      colorPrimary: initialScheme.primary,
      colorSecondary: initialScheme.secondary,
      colorAccent: initialScheme.accent,
      colorGlow: initialScheme.glow,

      // Geometry & Sculpting
      waveFreq: 1.0,
      waveAmp: 1.1,
      twist: 0.8,
      rippleStrength: 0.8,
      roughness: 0.3,
      opacity: 0.85,
      activeLayers: 5,
      blending: 'Normal Blending',
      wireframe: false,

      // Motion & Animations
      animation: 'Gentle Orbit',
      animationSpeed: 1.0,
      waveSpeed: 1.0,
      mouseMode: 'Rotate Camera (Orbit)',

      // Lighting & Exposure
      exposure: 1.35,
      ambientColor: '#222233',
      ambientIntensity: 0.8,
      dirLightColor: '#ffffff',
      dirLightIntensity: 2.2,
      dirLightX: 6.0,
      dirLightY: 9.0,
      dirLightZ: 7.0,
      pointLight1Color: initialScheme.light1,
      pointLight1Intensity: 3.0,
      pointLight1Distance: 24.0,
      pointLight2Color: initialScheme.light2,
      pointLight2Intensity: 2.8,
      pointLight2Distance: 24.0,

      // System
      antialias: true,
      dpr: Math.min(window.devicePixelRatio || 1, 2),
      randomizeOnClick: true
    };

    // --- Scene Setup ---
    let canvas = document.getElementById('glcanvas');
    let scene = new THREE.Scene();
    scene.background = new THREE.Color(params.backgroundColor);

    let camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 3.5, 12);
    const baseFov = 52;

    let renderer = new THREE.WebGLRenderer({
      canvas: canvas,
      antialias: params.antialias,
      powerPreference: 'high-performance'
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(params.dpr);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = params.exposure;

    let controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.enableZoom = true;
    controls.screenSpacePanning = true;
    controls.target.set(0, 0, 0);

    function updateMouseControls() {
      if (params.mouseMode === 'Pan / Drag Object') {
        controls.mouseButtons.LEFT = THREE.MOUSE.PAN;
        controls.mouseButtons.RIGHT = THREE.MOUSE.ROTATE;
      } else {
        controls.mouseButtons.LEFT = THREE.MOUSE.ROTATE;
        controls.mouseButtons.RIGHT = THREE.MOUSE.PAN;
      }
    }
    updateMouseControls();

    // --- Lights ---
    const ambientLight = new THREE.AmbientLight(params.ambientColor, params.ambientIntensity);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(params.dirLightColor, params.dirLightIntensity);
    dirLight.position.set(params.dirLightX, params.dirLightY, params.dirLightZ);
    scene.add(dirLight);

    const pointLight1 = new THREE.PointLight(params.pointLight1Color, params.pointLight1Intensity, params.pointLight1Distance);
    pointLight1.position.set(-7, 3, 4);
    scene.add(pointLight1);

    const pointLight2 = new THREE.PointLight(params.pointLight2Color, params.pointLight2Intensity, params.pointLight2Distance);
    pointLight2.position.set(7, -2, -4);
    scene.add(pointLight2);

    // --- Aurora Ribbon Shaders & Meshes ---
    const ribbonVertexShader = `
      uniform float uTime;
      uniform float uWaveSpeed;
      uniform float uWaveFreq;
      uniform float uWaveAmp;
      uniform float uTwist;
      uniform vec2 uPointer;
      uniform float uRippleStrength;
      uniform float uRippleTime;
      uniform float uLayerIndex;

      varying vec2 vUv;
      varying vec3 vNormal;
      varying vec3 vViewPosition;
      varying float vElevation;

      void main() {
        vUv = uv;
        vec3 pos = position;

        // Vertical weight: bottom edge pinned/softer, top undulating waves
        float vWeight = smoothstep(0.0, 0.45, uv.y);

        // Multi-octave harmonic flowing waves
        float t = uTime * uWaveSpeed * 0.55 + uLayerIndex * 1.45;
        float w1 = sin(pos.x * uWaveFreq * 0.42 + t) * uWaveAmp;
        float w2 = cos(pos.x * uWaveFreq * 0.85 - t * 0.72 + uLayerIndex * 0.8) * (uWaveAmp * 0.52);
        float w3 = sin(pos.x * uWaveFreq * 1.6 + pos.y * 0.6 + t * 1.15) * (uWaveAmp * 0.28);

        // Sculpted magnetic twist and curvature
        float twistOffset = sin(pos.x * 0.22 + uLayerIndex * 0.7) * uTwist * (pos.y + 2.5);
        pos.z += (w1 + w2 + w3 + twistOffset) * vWeight;
        pos.y += sin(pos.x * 0.32 + t * 0.6) * (uWaveAmp * 0.35) * vWeight;

        // Expanding interactive ripples from pointer interaction
        vec2 pCoord = (uv - uPointer) * vec2(2.4, 1.0);
        float pDist = length(pCoord);
        float rAge = max(0.0, uTime - uRippleTime);
        float rippleWave = exp(-rAge * 1.8) * exp(-pDist * 4.2) * sin(pDist * 32.0 - rAge * 9.0) * uRippleStrength;
        pos.z += rippleWave * 2.2;

        vElevation = pos.z;

        // Approximate analytical normal for specular & lighting calculations
        float dWdx = (cos(pos.x * uWaveFreq * 0.42 + t) * uWaveFreq * 0.42 * uWaveAmp -
                      sin(pos.x * uWaveFreq * 0.85 - t * 0.72) * uWaveFreq * 0.85 * (uWaveAmp * 0.52)) * vWeight;
        vec3 modNormal = normalize(vec3(-dWdx * 0.9, 0.15, 1.0));
        vNormal = normalMatrix * modNormal;

        vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
        vViewPosition = -mvPosition.xyz;
        gl_Position = projectionMatrix * mvPosition;
      }
    `;

    const ribbonFragmentShader = `
      uniform vec3 uColorPrimary;
      uniform vec3 uColorSecondary;
      uniform vec3 uColorAccent;
      uniform vec3 uColorGlow;
      uniform float uOpacity;
      uniform float uRoughness;
      uniform vec3 uDirLightColor;
      uniform vec3 uDirLightPos;
      uniform vec3 uPointLight1Color;
      uniform vec3 uPointLight1Pos;
      uniform vec3 uPointLight2Color;
      uniform vec3 uPointLight2Pos;
      uniform vec3 uAmbientColor;
      uniform float uTime;
      uniform float uSpeed;

      varying vec2 vUv;
      varying vec3 vNormal;
      varying vec3 vViewPosition;
      varying float vElevation;

      void main() {
        vec3 normal = normalize(vNormal);
        vec3 viewDir = normalize(vViewPosition);

        // Aurora vertical curtain gradient (Base: Accent -> Mid: Secondary -> Crest: Primary)
        vec3 auroraGrad = mix(uColorAccent, uColorSecondary, smoothstep(0.02, 0.52, vUv.y));
        auroraGrad = mix(auroraGrad, uColorPrimary, smoothstep(0.46, 0.98, vUv.y));

        // Shimmering vertical ionization rays / striations
        float striation = sin(vUv.x * 95.0 + vElevation * 2.8 + uTime * 0.75) * 0.5 + 0.5;
        striation = pow(striation, 3.2) * 0.38;

        // Traveling pulse of light across aurora ribbons
        float crestPulse = sin(vUv.x * 5.0 - uTime * uSpeed * 1.1) * 0.5 + 0.5;
        vec3 baseTone = auroraGrad + striation * uColorGlow + crestPulse * 0.22 * uColorPrimary;

        // Luminous Fresnel rim glow for celestial ethereal atmosphere
        float fresnel = pow(1.0 - max(dot(viewDir, normal), 0.0), 2.4);
        vec3 rimGlow = uColorGlow * fresnel * 1.35;

        // Directional Light diffuse & specular glint
        vec3 lightDir = normalize(uDirLightPos);
        float diff = max(dot(normal, lightDir), 0.0);
        vec3 halfDir = normalize(lightDir + viewDir);
        float spec = pow(max(dot(normal, halfDir), 0.0), 32.0 * (1.0 - uRoughness * 0.8));

        // Point Light 1 (Core Glow)
        vec3 p1Dir = normalize(uPointLight1Pos - vViewPosition);
        float p1Diff = max(dot(normal, p1Dir), 0.0) * 0.65;

        // Point Light 2 (Accent Glow)
        vec3 p2Dir = normalize(uPointLight2Pos - vViewPosition);
        float p2Diff = max(dot(normal, p2Dir), 0.0) * 0.65;

        vec3 lightSum = uAmbientColor +
                        uDirLightColor * (diff * 0.85 + spec * 0.45) +
                        uPointLight1Color * p1Diff +
                        uPointLight2Color * p2Diff;

        vec3 finalColor = baseTone * lightSum + rimGlow;

        // Graceful vertical edge feathering
        float edgeFade = smoothstep(0.0, 0.16, vUv.y) * smoothstep(1.0, 0.82, vUv.y);
        float alpha = (0.25 + 0.75 * fresnel + striation * 0.5) * uOpacity * edgeFade;

        gl_FragColor = vec4(finalColor, alpha);
      }
    `;

    // Create 6 layered aurora ribbons
    const ribbonGroup = new THREE.Group();
    scene.add(ribbonGroup);

    const ribbonMeshes = [];
    const ribbonMaterials = [];
    const ribbonGeom = new THREE.PlaneGeometry(26, 7.5, 180, 50);

    for (let i = 0; i < 6; i++) {
      const zOffset = (i - 2.5) * 1.55;
      const mat = new THREE.ShaderMaterial({
        vertexShader: ribbonVertexShader,
        fragmentShader: ribbonFragmentShader,
        uniforms: {
          uTime: { value: 0 },
          uWaveSpeed: { value: params.waveSpeed },
          uWaveFreq: { value: params.waveFreq },
          uWaveAmp: { value: params.waveAmp },
          uTwist: { value: params.twist },
          uPointer: { value: new THREE.Vector2(0.5, 0.5) },
          uRippleStrength: { value: params.rippleStrength },
          uRippleTime: { value: -100.0 },
          uLayerIndex: { value: i },

          uColorPrimary: { value: new THREE.Color(params.colorPrimary) },
          uColorSecondary: { value: new THREE.Color(params.colorSecondary) },
          uColorAccent: { value: new THREE.Color(params.colorAccent) },
          uColorGlow: { value: new THREE.Color(params.colorGlow) },
          uOpacity: { value: params.opacity },
          uRoughness: { value: params.roughness },

          uDirLightColor: { value: new THREE.Color(params.dirLightColor) },
          uDirLightPos: { value: new THREE.Vector3(params.dirLightX, params.dirLightY, params.dirLightZ) },
          uPointLight1Color: { value: new THREE.Color(params.pointLight1Color) },
          uPointLight1Pos: { value: pointLight1.position },
          uPointLight2Color: { value: new THREE.Color(params.pointLight2Color) },
          uPointLight2Pos: { value: pointLight2.position },
          uAmbientColor: { value: new THREE.Color(params.ambientColor) },
          uSpeed: { value: params.animationSpeed }
        },
        transparent: true,
        depthWrite: false,
        side: THREE.DoubleSide,
        wireframe: params.wireframe,
        blending: params.blending === 'Additive Blending' ? THREE.AdditiveBlending : THREE.NormalBlending
      });

      const mesh = new THREE.Mesh(ribbonGeom, mat);
      mesh.position.set(0, 0, zOffset);
      ribbonGroup.add(mesh);

      ribbonMaterials.push(mat);
      ribbonMeshes.push(mesh);
    }

    // --- Starfield / Cosmic Particle Dust ---
    const starCount = 1400;
    const starPos = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount * 3; i += 3) {
      starPos[i] = (Math.random() - 0.5) * 50;
      starPos[i + 1] = (Math.random() - 0.5) * 35;
      starPos[i + 2] = (Math.random() - 0.5) * 40;
    }
    const starGeom = new THREE.BufferGeometry();
    starGeom.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    const starMat = new THREE.PointsMaterial({
      color: 0xffffff,
      size: 0.12,
      transparent: true,
      opacity: 0.7,
      sizeAttenuation: true
    });
    const starField = new THREE.Points(starGeom, starMat);
    scene.add(starField);

    // --- Background and Uniforms Synchronizer ---
    function updateBackground() {
      if (params.greenScreen) {
        scene.background = new THREE.Color('#00ff00');
        renderer.setClearColor(0x00ff00, 1);
        starField.visible = false;
      } else {
        scene.background = new THREE.Color(params.backgroundColor);
        renderer.setClearColor(new THREE.Color(params.backgroundColor), 1);
        starField.visible = true;
      }
    }

    function updateLights() {
      ambientLight.color.set(params.ambientColor);
      ambientLight.intensity = params.ambientIntensity;

      dirLight.color.set(params.dirLightColor);
      dirLight.intensity = params.dirLightIntensity;
      dirLight.position.set(params.dirLightX, params.dirLightY, params.dirLightZ);

      pointLight1.color.set(params.pointLight1Color);
      pointLight1.intensity = params.pointLight1Intensity;
      pointLight1.distance = params.pointLight1Distance;

      pointLight2.color.set(params.pointLight2Color);
      pointLight2.intensity = params.pointLight2Intensity;
      pointLight2.distance = params.pointLight2Distance;
    }

    function updateUniforms() {
      ribbonMaterials.forEach((mat, idx) => {
        mat.uniforms.uWaveSpeed.value = params.waveSpeed;
        mat.uniforms.uWaveFreq.value = params.waveFreq;
        mat.uniforms.uWaveAmp.value = params.waveAmp;
        mat.uniforms.uTwist.value = params.twist;
        mat.uniforms.uRippleStrength.value = params.rippleStrength;
        mat.uniforms.uOpacity.value = params.opacity;
        mat.uniforms.uRoughness.value = params.roughness;
        mat.uniforms.uSpeed.value = params.animationSpeed;

        mat.uniforms.uColorPrimary.value.set(params.colorPrimary);
        mat.uniforms.uColorSecondary.value.set(params.colorSecondary);
        mat.uniforms.uColorAccent.value.set(params.colorAccent);
        mat.uniforms.uColorGlow.value.set(params.colorGlow);

        mat.uniforms.uDirLightColor.value.set(params.dirLightColor);
        mat.uniforms.uDirLightPos.value.set(params.dirLightX, params.dirLightY, params.dirLightZ);
        mat.uniforms.uPointLight1Color.value.set(params.pointLight1Color);
        mat.uniforms.uPointLight2Color.value.set(params.pointLight2Color);
        mat.uniforms.uAmbientColor.value.set(params.ambientColor);

        mat.wireframe = params.wireframe;
        mat.blending = params.blending === 'Additive Blending' ? THREE.AdditiveBlending : THREE.NormalBlending;
        mat.needsUpdate = true;
      });

      ribbonMeshes.forEach((mesh, idx) => {
        mesh.visible = idx < params.activeLayers;
      });
    }

    function applyColorScheme(schemeName) {
      const scheme = colorSchemes[schemeName];
      if (!scheme) return;
      params.colorPrimary = scheme.primary;
      params.colorSecondary = scheme.secondary;
      params.colorAccent = scheme.accent;
      params.colorGlow = scheme.glow;
      params.backgroundColor = scheme.bg;
      params.pointLight1Color = scheme.light1;
      params.pointLight2Color = scheme.light2;

      updateBackground();
      updateLights();
      updateUniforms();
      syncGuiDisplays();
    }

    // --- Procedural Scene Randomizer (Upon Click) ---
    function randomizeProceduralVariation() {
      // 1. Pick a random color scheme
      const schemeKeys = Object.keys(colorSchemes);
      const chosenKey = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      params.colorScheme = chosenKey;
      applyColorScheme(chosenKey);

      // 2. Re-roll geometric & wave parameters
      params.waveFreq = +(0.4 + Math.random() * 2.0).toFixed(2);
      params.waveAmp = +(0.5 + Math.random() * 1.6).toFixed(2);
      params.twist = +(0.2 + Math.random() * 1.5).toFixed(2);
      params.rippleStrength = +(0.3 + Math.random() * 1.4).toFixed(2);
      params.roughness = +(0.1 + Math.random() * 0.7).toFixed(2);
      params.opacity = +(0.65 + Math.random() * 0.35).toFixed(2);
      params.activeLayers = Math.floor(3 + Math.random() * 4); // 3 to 6

      // 3. Re-roll motion & speeds
      params.waveSpeed = +(0.5 + Math.random() * 1.8).toFixed(2);
      params.animationSpeed = +(0.6 + Math.random() * 1.5).toFixed(2);

      // 4. Re-roll lighting & exposure
      params.exposure = +(0.9 + Math.random() * 0.8).toFixed(2);
      params.ambientIntensity = +(0.4 + Math.random() * 0.7).toFixed(2);
      params.dirLightIntensity = +(1.2 + Math.random() * 2.2).toFixed(2);
      params.pointLight1Intensity = +(1.8 + Math.random() * 2.5).toFixed(2);
      params.pointLight2Intensity = +(1.8 + Math.random() * 2.5).toFixed(2);

      renderer.toneMappingExposure = params.exposure;
      updateLights();
      updateUniforms();
      syncGuiDisplays();
    }

    // --- Pointer & Click Interactions ---
    let pointerDownPos = { x: 0, y: 0 };
    let pointerDownTime = 0;

    function handlePointerDown(e) {
      pointerDownPos = { x: e.clientX, y: e.clientY };
      pointerDownTime = performance.now();
    }

    function handlePointerUp(e) {
      const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
      const duration = performance.now() - pointerDownTime;

      // Authentic click: minimal movement and short duration (distinguish from dragging/zooming)
      if (dist < 6 && duration < 260) {
        if (params.randomizeOnClick) {
          randomizeProceduralVariation();
        }
      }
    }

    function handlePointerMove(e) {
      const u = e.clientX / window.innerWidth;
      const v = 1.0 - (e.clientY / window.innerHeight);

      ribbonMaterials.forEach(mat => {
        mat.uniforms.uPointer.value.set(u, v);
        mat.uniforms.uRippleTime.value = totalTime;
      });
    }

    function attachPointerListeners(targetCanvas) {
      targetCanvas.addEventListener('pointerdown', handlePointerDown);
      targetCanvas.addEventListener('pointerup', handlePointerUp);
      targetCanvas.addEventListener('pointermove', handlePointerMove);
    }
    attachPointerListeners(canvas);

    // --- Antialiasing Setting / Renderer Re-initialization ---
    function recreateRenderer() {
      const oldCanvas = renderer.domElement;
      const parent = oldCanvas.parentElement;

      renderer.dispose();

      const newCanvas = document.createElement('canvas');
      newCanvas.id = 'glcanvas';
      parent.replaceChild(newCanvas, oldCanvas);
      canvas = newCanvas;

      renderer = new THREE.WebGLRenderer({
        canvas: newCanvas,
        antialias: params.antialias,
        powerPreference: 'high-performance'
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(params.dpr);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = params.exposure;

      updateBackground();

      // Preserve camera position and target
      const prevTarget = controls.target.clone();
      const prevPos = camera.position.clone();
      controls.dispose();
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.enableZoom = true;
      controls.screenSpacePanning = true;
      controls.target.copy(prevTarget);
      camera.position.copy(prevPos);
      updateMouseControls();

      attachPointerListeners(newCanvas);
    }

    // --- Window Resize ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- Preconfigured Animations Handler ---
    const Y_AXIS = new THREE.Vector3(0, 1, 0);
    let animClock = new THREE.Clock();
    let totalTime = 0;

    function applyCameraAnimation(dt, effectiveDt) {
      if (params.animation === 'Static (No Movement)' || params.animationSpeed <= 0) {
        if (camera.fov !== baseFov) {
          camera.fov = baseFov;
          camera.updateProjectionMatrix();
        }
        return;
      }

      const offset = new THREE.Vector3().subVectors(camera.position, controls.target);

      switch (params.animation) {
        case 'Gentle Orbit': {
          // Slow incremental orbit around current angle and distance
          const deltaAngle = 0.22 * effectiveDt;
          offset.applyAxisAngle(Y_AXIS, deltaAngle);
          camera.position.copy(controls.target).add(offset);
          break;
        }
        case 'Subtle Breathing': {
          // Subtle slow optical breathing without resetting user zoom distance
          camera.fov = baseFov + Math.sin(totalTime * 0.9) * 2.2;
          camera.updateProjectionMatrix();
          break;
        }
        case 'Floating Drift': {
          const dy = Math.sin(totalTime * 0.65) * 0.005 * params.animationSpeed;
          const dx = Math.cos(totalTime * 0.45) * 0.005 * params.animationSpeed;
          camera.position.y += dy;
          controls.target.y += dy;
          camera.position.x += dx;
          controls.target.x += dx;
          break;
        }
        case 'Horizon Sweep': {
          // Slow pendulum sweep across current orientation
          const sweepAngle = Math.cos(totalTime * 0.45) * 0.003 * params.animationSpeed;
          offset.applyAxisAngle(Y_AXIS, sweepAngle);
          camera.position.copy(controls.target).add(offset);
          break;
        }
        case 'Serene Wave Undulation': {
          const bobY = Math.sin(totalTime * 0.65) * 0.006 * params.animationSpeed;
          camera.position.y += bobY;
          const angle = Math.sin(totalTime * 0.35) * 0.0018 * params.animationSpeed;
          offset.applyAxisAngle(Y_AXIS, angle);
          camera.position.copy(controls.target).add(offset);
          break;
        }
        case 'Slow Spiral': {
          const deltaAngle = 0.18 * effectiveDt;
          offset.applyAxisAngle(Y_AXIS, deltaAngle);
          camera.position.copy(controls.target).add(offset);
          const spiralY = Math.sin(totalTime * 0.4) * 0.005 * params.animationSpeed;
          camera.position.y += spiralY;
          controls.target.y += spiralY;
          break;
        }
        case 'Cosmic Tilt': {
          const camDir = offset.clone().normalize();
          const right = new THREE.Vector3().crossVectors(Y_AXIS, camDir).normalize();
          if (right.lengthSq() > 0.001) {
            const tilt = Math.sin(totalTime * 0.5) * 0.0018 * params.animationSpeed;
            offset.applyAxisAngle(right, tilt);
            camera.position.copy(controls.target).add(offset);
          }
          break;
        }
      }
    }

    // --- GUI Setup (lil-gui with default styling) ---
    const gui = new GUI({ title: 'Aurora Settings' });

    // 1. Color Schemes & Appearance
    const fColor = gui.addFolder('Color Schemes & Background');
    fColor.add(params, 'colorScheme', Object.keys(colorSchemes)).name('Color Scheme').onChange(v => applyColorScheme(v));
    fColor.add(params, 'greenScreen').name('Green Screen (#00ff00)').onChange(() => updateBackground());
    fColor.addColor(params, 'backgroundColor').name('Background Color').onChange(() => updateBackground());
    fColor.addColor(params, 'colorPrimary').name('Primary Crest').onChange(() => updateUniforms());
    fColor.addColor(params, 'colorSecondary').name('Secondary Body').onChange(() => updateUniforms());
    fColor.addColor(params, 'colorAccent').name('Accent Base').onChange(() => updateUniforms());
    fColor.addColor(params, 'colorGlow').name('Emission Glow').onChange(() => updateUniforms());

    // 2. Geometry & Sculpting
    const fGeom = gui.addFolder('Aurora Sculpting & Geometry');
    fGeom.add(params, 'waveFreq', 0.1, 3.5, 0.05).name('Wave Frequency').onChange(() => updateUniforms());
    fGeom.add(params, 'waveAmp', 0.1, 2.8, 0.05).name('Wave Amplitude').onChange(() => updateUniforms());
    fGeom.add(params, 'twist', 0.0, 2.5, 0.05).name('Ribbon Twist').onChange(() => updateUniforms());
    fGeom.add(params, 'rippleStrength', 0.0, 2.5, 0.05).name('Ripple Strength').onChange(() => updateUniforms());
    fGeom.add(params, 'roughness', 0.0, 1.0, 0.02).name('Surface Roughness').onChange(() => updateUniforms());
    fGeom.add(params, 'opacity', 0.1, 1.0, 0.02).name('Transparency').onChange(() => updateUniforms());
    fGeom.add(params, 'activeLayers', 1, 6, 1).name('Curtain Layers').onChange(() => updateUniforms());
    fGeom.add(params, 'blending', ['Normal Blending', 'Additive Blending']).name('Blend Mode').onChange(() => updateUniforms());
    fGeom.add(params, 'wireframe').name('Wireframe').onChange(() => updateUniforms());

    // 3. Motion & Camera Animations
    const fMotion = gui.addFolder('Motion & Camera');
    const animOptions = [
      'Static (No Movement)',
      'Gentle Orbit',
      'Subtle Breathing',
      'Floating Drift',
      'Horizon Sweep',
      'Serene Wave Undulation',
      'Slow Spiral',
      'Cosmic Tilt'
    ];
    fMotion.add(params, 'animation', animOptions).name('Camera Animation');
    fMotion.add(params, 'animationSpeed', 0.0, 3.0, 0.05).name('Animation Speed');
    fMotion.add(params, 'waveSpeed', 0.1, 3.0, 0.05).name('Wave Flow Speed').onChange(() => updateUniforms());
    fMotion.add(params, 'mouseMode', ['Rotate Camera (Orbit)', 'Pan / Drag Object']).name('Left Mouse Drag').onChange(() => updateMouseControls());

    // 4. Lighting & Exposure
    const fLight = gui.addFolder('Lighting & Exposure');
    fLight.add(params, 'exposure', 0.1, 3.0, 0.05).name('Scene Exposure').onChange(v => { renderer.toneMappingExposure = v; });
    fLight.addColor(params, 'ambientColor').name('Ambient Color').onChange(() => { updateLights(); updateUniforms(); });
    fLight.add(params, 'ambientIntensity', 0.0, 3.0, 0.05).name('Ambient Intensity').onChange(() => updateLights());

    fLight.addColor(params, 'dirLightColor').name('Key Light Color').onChange(() => { updateLights(); updateUniforms(); });
    fLight.add(params, 'dirLightIntensity', 0.0, 4.0, 0.1).name('Key Light Intensity').onChange(() => updateLights());
    fLight.add(params, 'dirLightX', -15, 15, 0.5).name('Key Light X').onChange(() => { updateLights(); updateUniforms(); });
    fLight.add(params, 'dirLightY', -5, 20, 0.5).name('Key Light Y').onChange(() => { updateLights(); updateUniforms(); });
    fLight.add(params, 'dirLightZ', -15, 15, 0.5).name('Key Light Z').onChange(() => { updateLights(); updateUniforms(); });

    fLight.addColor(params, 'pointLight1Color').name('Core Light Color').onChange(() => { updateLights(); updateUniforms(); });
    fLight.add(params, 'pointLight1Intensity', 0.0, 5.0, 0.1).name('Core Light Intensity').onChange(() => updateLights());
    fLight.add(params, 'pointLight1Distance', 2.0, 40.0, 1.0).name('Core Light Distance').onChange(() => updateLights());

    fLight.addColor(params, 'pointLight2Color').name('Accent Light Color').onChange(() => { updateLights(); updateUniforms(); });
    fLight.add(params, 'pointLight2Intensity', 0.0, 5.0, 0.1).name('Accent Light Intensity').onChange(() => updateLights());
    fLight.add(params, 'pointLight2Distance', 2.0, 40.0, 1.0).name('Accent Light Distance').onChange(() => updateLights());

    // 5. System & Interaction
    const fSystem = gui.addFolder('System & Interaction');
    fSystem.add(params, 'antialias').name('Antialiasing').onChange(() => recreateRenderer());
    fSystem.add(params, 'dpr', 0.5, 3.0, 0.25).name('Pixel Ratio (DPR)').onChange(v => renderer.setPixelRatio(v));
    fSystem.add(params, 'randomizeOnClick').name('Randomize on Click');
    fSystem.add({ randomize: randomizeProceduralVariation }, 'randomize').name('Randomize Theme Now');

    // Helper to synchronize all lil-gui controller displays
    function syncGuiDisplays() {
      function recurseSync(folder) {
        if (!folder) return;
        if (folder.controllers) {
          folder.controllers.forEach(ctrl => ctrl.updateDisplay());
        }
        if (folder.folders) {
          folder.folders.forEach(f => recurseSync(f));
        }
      }
      recurseSync(gui);
    }

    // Toggle all UI visibility with "H" key
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        gui._hidden ? gui.show() : gui.hide();
      }
    });

    // --- Animation Loop ---
    function renderLoop() {
      requestAnimationFrame(renderLoop);

      const dt = Math.min(animClock.getDelta(), 0.1);
      const effectiveDt = dt * params.animationSpeed;
      totalTime += effectiveDt;

      // Update shader time uniforms
      ribbonMaterials.forEach(mat => {
        mat.uniforms.uTime.value = totalTime;
      });

      // Gently orbit point lights for vibrant dynamic highlights
      pointLight1.position.x = Math.sin(totalTime * 0.4) * 8.5;
      pointLight1.position.z = Math.cos(totalTime * 0.4) * 5.5;
      pointLight2.position.x = Math.cos(totalTime * 0.32) * 8.5;
      pointLight2.position.z = Math.sin(totalTime * 0.32) * 5.5;

      // Rotate subtle starfield
      if (starField.visible) {
        starField.rotation.y = totalTime * 0.015;
      }

      // Procedural camera animation (preserves user zoom and angle adjustments)
      applyCameraAnimation(dt, effectiveDt);

      // Controls update (handles mouse drag, wheel zoom, screen pan)
      controls.update();

      renderer.render(scene, camera);
    }

    renderLoop();
  </script>
</body>
