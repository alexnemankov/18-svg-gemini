<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electrophoresis Run</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #020907;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            touch-action: none;
            cursor: grab;
        }

        canvas:active {
            cursor: grabbing;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00f0ff;
            font-family: monospace;
            font-size: 14px;
            letter-spacing: 2px;
            pointer-events: none;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
        }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
                "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
            }
        }
    </script>
</head>
<body>
    <div id="loading">INITIALIZING ELECTROPHORESIS RUN...</div>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
        import GUI from 'lil-gui';

        // =========================================================================
        // 1. 18 PRECONFIGURED COLOR SCHEMES
        // =========================================================================
        const COLOR_PRESETS = {
            'Monochromatic': {
                c0: '#0a122c', c1: '#1d3557', c2: '#3a6ea5', c3: '#60a5fa', c4: '#93c5fd', bg: '#030712'
            },
            'Analogous': {
                c0: '#1e0836', c1: '#5b21b6', c2: '#7c3aed', c3: '#2563eb', c4: '#06b6d4', bg: '#080318'
            },
            'Complementary': {
                c0: '#002b36', c1: '#008189', c2: '#02c39a', c3: '#f07167', c4: '#fed9b7', bg: '#00141a'
            },
            'Split-complementary': {
                c0: '#2b0938', c1: '#7b1fa2', c2: '#00e5ff', c3: '#ffb703', c4: '#fb8500', bg: '#0a0212'
            },
            'Triadic': {
                c0: '#1a0033', c1: '#8a2be2', c2: '#00e676', c3: '#ff9100', c4: '#ff1744', bg: '#06000f'
            },
            'Tetradic': {
                c0: '#0d1b2a', c1: '#415a77', c2: '#00b4d8', c3: '#c77dff', c4: '#ff758f', bg: '#050a12'
            },
            'Double split-complementary': {
                c0: '#140152', c1: '#22007c', c2: '#49117c', c3: '#9d0208', c4: '#ff6978', bg: '#08001f'
            },
            'Achromatic (Black & White)': {
                c0: '#111111', c1: '#444444', c2: '#888888', c3: '#cccccc', c4: '#ffffff', bg: '#000000'
            },
            'Achromatic (White & Black)': {
                c0: '#ffffff', c1: '#cccccc', c2: '#888888', c3: '#444444', c4: '#111111', bg: '#ffffff'
            },
            'Neutral + Accent (Important!)': {
                c0: '#16181b', c1: '#2c3038', c2: '#525a69', c3: '#e2e8f0', c4: '#00f7ff', bg: '#0b0c0e'
            },
            'Palette (F6AA1C, BC3908, 941B0C, F6AA1C, 220901)': {
                c0: '#220901', c1: '#941b0c', c2: '#bc3908', c3: '#f6aa1c', c4: '#ffe8a3', bg: '#120401'
            },
            'Palette (63D1CF, 5BC0BE, 4BAD9E, 4BAD9E, 0B132B, 000000)': {
                c0: '#000000', c1: '#0b132b', c2: '#4bad9e', c3: '#5bc0be', c4: '#63d1cf', bg: '#02060f'
            },
            'Palette (AA60C8, D69ADE, C9A3C6, CFB5C2, 0D001D, 120A12)': {
                c0: '#0d001d', c1: '#120a12', c2: '#aa60c8', c3: '#c9a3c6', c4: '#d69ade', bg: '#080010'
            },
            'Palette (FEF1BE, FFBA00, 008189, 00474D, 061210)': {
                c0: '#061210', c1: '#00474d', c2: '#008189', c3: '#ffba00', c4: '#fef1be', bg: '#020907'
            },
            'Palette (D4FFB0, 7FFF00, 00B894, 0A3322, 05140A)': {
                c0: '#05140a', c1: '#0a3322', c2: '#00b894', c3: '#7fff00', c4: '#d4ffb0', bg: '#020a05'
            },
            'Palette (FFE8CC, FF8C00, C7501A, 3D1050, 0E0618)': {
                c0: '#0e0618', c1: '#3d1050', c2: '#c7501a', c3: '#ff8c00', c4: '#ffe8cc', bg: '#07020d'
            },
            'Palette (E8E0FF, B38FFF, 6A3DE8, 1A1250, 090612)': {
                c0: '#090612', c1: '#1a1250', c2: '#6a3de8', c3: '#b38fff', c4: '#e8e0ff', bg: '#040208'
            },
            'Palette (E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)': {
                c0: '#05020f', c1: '#1e0a3d', c2: '#d40078', c3: '#00f0ff', c4: '#e0fbff', bg: '#020107'
            }
        };

        // =========================================================================
        // 2. 8 PRECONFIGURED ANIMATION MODES (SMOOTH & SLOW)
        // =========================================================================
        const ANIMATION_MODES = {
            'Static Gel (No Camera Movement)': 0,
            'Gentle Gel Drift (Slow Orbit)': 1,
            'Gel Bed Breathing (FOV & Float)': 2,
            'Electrophoretic Migration Follow': 3,
            'Transilluminator Tilt & Rock': 4,
            'Transmitted Backlight Scan': 5,
            'Capillary Lissajous Drift': 6,
            'Macro Band Focus Sweep': 7
        };

        // =========================================================================
        // 3. SETTINGS & SCENE INITIALIZATION
        // =========================================================================
        const defaultPalette = COLOR_PRESETS['Palette (FEF1BE, FFBA00, 008189, 00474D, 061210)'];

        const SETTINGS = {
            colorScheme: 'Palette (FEF1BE, FFBA00, 008189, 00474D, 061210)',
            animMode: 'Gentle Gel Drift (Slow Orbit)',
            speed: 5.5,
            dpr: Math.min(window.devicePixelRatio || 1.0, 2.0),
            
            curveSoftness: 8.0,
            curveWidth: 0.3024,
            curveDepth: 0.9504,
            height: 1.2936,
            zoom: 1.0,
            objectX: 0.0,
            objectY: 0.0,
            wallTilt: 0.0,
            fov: 112.0,
            lineDensity: 1.0,
            particleSize: 11.0,
            
            bloomStrength: 0.38,
            bloomRadius: 1.15,
            chromaticAberration: 0.009,
            edgeBlurStrength: 0.012,
            
            greenScreen: false,
            greenScreenColor: '#00ff00',
            randomizeOnClick: true,
            
            color0: defaultPalette.c0,
            color1: defaultPalette.c1,
            color2: defaultPalette.c2,
            color3: defaultPalette.c3,
            color4: defaultPalette.c4,
            bgColor: defaultPalette.bg
        };

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(SETTINGS.bgColor, 0.002);
        scene.background = new THREE.Color(SETTINGS.bgColor);

        const camera = new THREE.PerspectiveCamera(SETTINGS.fov, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(SETTINGS.dpr);
        document.body.appendChild(renderer.domElement);

        const tunnelGroup = new THREE.Group();
        scene.add(tunnelGroup);

        // =========================================================================
        // 4. SHADERS (3-LAYER MW MIGRATION, DOMAIN-WARPED TRAILS, 1D LUT GRADIENT)
        // =========================================================================
        const wallVertexShader = `
            varying vec2 vUv;
            varying vec3 vPosition;
            uniform float uCurveSoftness;

            void main() {
                vUv = uv;
                vec3 pos = position;

                float angle = atan(pos.z, pos.x);
                float normX = cos(angle);
                float n = uCurveSoftness;

                float absZ = pow(max(0.00001, 1.0 - pow(abs(normX), n)), 1.0 / n) * 100.0;
                pos.z = sign(sin(angle)) * absZ;

                vPosition = pos;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
            }
        `;

        const wallFragmentShader = `
            varying vec2 vUv;
            varying vec3 vPosition;

            uniform float uTime;
            uniform float uSpeed;
            uniform float uLineDensity;
            uniform vec3 uColor0;
            uniform vec3 uColor1;
            uniform vec3 uColor2;
            uniform vec3 uColor3;
            uniform vec3 uColor4;
            uniform vec3 uBgColor;
            uniform float uIsGreenScreen;
            uniform vec3 uGreenScreenColor;

            float random(vec2 st) {
                return fract(sin(dot(st.xy, vec2(12.9898, 78.233))) * 43758.5453123);
            }

            float noise(vec2 st) {
                vec2 i = floor(st);
                vec2 f = fract(st);
                float a = random(i);
                float b = random(i + vec2(1.0, 0.0));
                float c = random(i + vec2(0.0, 1.0));
                float d = random(i + vec2(1.0, 1.0));
                vec2 u = f * f * (3.0 - 2.0 * f);
                return mix(a, b, u.x) + (c - a) * u.y * (1.0 - u.x) + (d - b) * u.x * u.y;
            }

            // Continuous Stain Chemistry 1D LUT Color Interpolation
            vec3 sampleStainLUT(float t) {
                t = clamp(t, 0.0, 1.0);
                if (t < 0.25) {
                    return mix(uColor0, uColor1, t / 0.25);
                } else if (t < 0.5) {
                    return mix(uColor1, uColor2, (t - 0.25) / 0.25);
                } else if (t < 0.75) {
                    return mix(uColor2, uColor3, (t - 0.5) / 0.25);
                } else {
                    return mix(uColor3, uColor4, (t - 0.75) / 0.25);
                }
            }

            // Fragment Layer: Molecular weight inversely proportional migration + domain-warped Gaussian trails
            vec3 getLineLayer(vec3 pos, float trackCount, float speedBase, float seed) {
                float trackHeight = 80.0 / trackCount;
                float trackId = floor((pos.y + 40.0) / trackHeight);

                float trackActive = random(vec2(trackId, seed));
                if (trackActive > 0.42) return vec3(0.0);

                float trackCenter = -40.0 + (trackId + 0.5) * trackHeight;
                float distY = abs(pos.y - trackCenter);

                float maxThickness = trackHeight * 0.38;
                float thickness = maxThickness * mix(0.35, 1.0, random(vec2(trackId, seed + 1.0)));

                // Smeared Gaussian cross-sectional band profile across gel lane
                float normDist = distY / max(thickness, 0.001);
                float profile = exp(-normDist * normDist * 2.8);
                if (profile < 0.005) return vec3(0.0);

                // Invert speedMult and apply pow(rand, 2.2) falloff for realistic molecular weight spread
                float weightRand = random(vec2(trackId, seed + 2.0));
                float weight = mix(0.22, 3.8, pow(weightRand, 2.2));
                float speedMult = 1.0 / weight;

                float angle = atan(pos.z, pos.x);
                float migrationTime = uTime * uSpeed * 0.012 * speedBase * speedMult;
                float currentAngle = angle + migrationTime;

                // Two-pass domain-warped noise (noise(pos + noise(pos))) to produce smeared, Gaussian-tailed trails
                float trackScale = mix(3.5, 9.0, random(vec2(trackId, seed + 4.0)));
                float trackCoord = (currentAngle + 3.14159265) * trackScale;
                vec2 noisePos = vec2(trackCoord, trackId * 1.73 + seed * 4.1);

                // Pass 1 & Pass 2 Domain Warping
                float n1 = noise(noisePos * 0.9);
                vec2 warp1 = noisePos + vec2(cos(n1 * 6.283), sin(n1 * 6.283)) * 1.4;
                float n2 = noise(warp1 + vec2(seed * 2.1, trackId * 0.4));
                vec2 warp2 = noisePos + vec2(n2 * 1.8, n1 * 1.2);
                float warpedNoise = noise(warp2);

                // Asymmetric band migration front with smeared Gaussian trailing tail
                float bandPeriod = fract(trackCoord * 0.22);
                float leadingEdge = smoothstep(0.0, 0.07, bandPeriod);
                float trailingTail = exp(-pow(max(0.0, bandPeriod - 0.07) * 3.6, 1.75));
                float bandEnvelope = leadingEdge * trailingTail;

                // Smeared Gaussian tail modulated by domain-warped noise
                float trailSmear = mix(bandEnvelope, warpedNoise * bandEnvelope * 2.0, 0.58);
                trailSmear = smoothstep(0.04, 0.92, trailSmear + warpedNoise * 0.32);

                // 1D LUT Continuous Interpolation keyed to trackId
                float lutKey = fract(random(vec2(trackId, seed + 7.0)) * 0.82 + trackId * 0.019);
                vec3 bandColor = sampleStainLUT(lutKey);

                // Intense fluorescent band core
                float core = exp(-normDist * normDist * 8.0);
                vec3 finalColor = bandColor * profile * trailSmear * 2.4 + vec3(core * trailSmear * 1.5);

                return finalColor;
            }

            vec3 getCompositeLines(vec3 pos, float isReflection) {
                vec3 color = vec3(0.0);

                float angle = atan(pos.z, pos.x);
                float normAngle = (angle + 3.14159265) / 6.2831853;

                // Flat diffuse backlight modulated only by low-frequency noise (translucent gel slab)
                vec2 gelUv = vec2(normAngle * 5.0, pos.y * 0.03);
                float gelNoise1 = noise(gelUv * 1.6 + vec2(uTime * 0.012 * uSpeed, 0.0));
                float gelNoise2 = noise(gelUv * 3.2 - vec2(0.0, uTime * 0.008 * uSpeed));
                float diffuseBacklight = mix(0.78, 1.22, gelNoise1 * 0.6 + gelNoise2 * 0.4);

                // Subsurface transillumination gel glow
                vec3 gelBacklightColor = mix(uBgColor, sampleStainLUT(0.35) * 0.22 + sampleStainLUT(0.75) * 0.14, 0.45);
                color += gelBacklightColor * diffuseBacklight * 0.6;

                // Three-layer fragment structure with realistic molecular weight migration
                color += getLineLayer(pos, 28.0 * uLineDensity, 0.9, 11.0);
                color += getLineLayer(pos, 65.0 * uLineDensity, 1.5, 22.0);
                color += getLineLayer(pos, 140.0 * uLineDensity, 2.5, 33.0);

                if (isReflection > 0.5) {
                    float fade = smoothstep(-35.0, -12.0, pos.y);
                    color *= 0.35 * fade;
                } else {
                    float fade = smoothstep(40.0, 20.0, pos.y);
                    color *= fade;
                }

                return color;
            }

            void main() {
                vec3 color = uBgColor;
                float floorLevel = -12.0;

                if (vPosition.y > floorLevel) {
                    color += getCompositeLines(vPosition, 0.0);
                } else {
                    vec3 reflectedPos = vPosition;
                    reflectedPos.y = floorLevel + (floorLevel - vPosition.y);
                    color += getCompositeLines(reflectedPos, 1.0);
                    color += uBgColor * 0.25;
                }

                // Buffer reservoir meniscus glow at floor horizon
                float horizonGlow = smoothstep(0.7, 0.0, abs(vPosition.y - floorLevel));
                color += sampleStainLUT(0.5) * horizonGlow * 0.28;

                if (uIsGreenScreen > 0.5) {
                    // When green screen is enabled, background is flat #00ff00
                    float alpha = clamp(length(color) * 1.5, 0.0, 1.0);
                    color = mix(uGreenScreenColor, color, alpha);
                }

                gl_FragColor = vec4(color, 1.0);
            }
        `;

        const uniforms = {
            uTime: { value: 0.0 },
            uSpeed: { value: SETTINGS.speed },
            uLineDensity: { value: SETTINGS.lineDensity },
            uCurveSoftness: { value: SETTINGS.curveSoftness },
            uColor0: { value: new THREE.Color(SETTINGS.color0) },
            uColor1: { value: new THREE.Color(SETTINGS.color1) },
            uColor2: { value: new THREE.Color(SETTINGS.color2) },
            uColor3: { value: new THREE.Color(SETTINGS.color3) },
            uColor4: { value: new THREE.Color(SETTINGS.color4) },
            uBgColor: { value: new THREE.Color(SETTINGS.bgColor) },
            uIsGreenScreen: { value: SETTINGS.greenScreen ? 1.0 : 0.0 },
            uGreenScreenColor: { value: new THREE.Color(SETTINGS.greenScreenColor) }
        };

        const material = new THREE.ShaderMaterial({
            vertexShader: wallVertexShader,
            fragmentShader: wallFragmentShader,
            uniforms,
            side: THREE.BackSide,
            transparent: false
        });

        const geometry = new THREE.CylinderGeometry(100, 100, 80, 256, 1, true);
        const wall = new THREE.Mesh(geometry, material);
        tunnelGroup.add(wall);

        // =========================================================================
        // 5. FLUORESCENT ION / BUFFER PARTICLES
        // =========================================================================
        const particleCount = 2400;
        const particleGeometry = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        const particleSpeeds = new Float32Array(particleCount);

        for (let i = 0; i < particleCount; i++) {
            const angle = Math.random() * Math.PI * 2;
            const radius = 98.2 + Math.random() * 1.6;
            const y = -11.0 + Math.random() * 48.0;

            particlePositions[i * 3] = Math.cos(angle) * radius;
            particlePositions[i * 3 + 1] = y;
            particlePositions[i * 3 + 2] = Math.sin(angle) * radius;
            
            // Inverted weight distribution with pow falloff for particle migration
            const pRand = Math.random();
            const pWeight = 0.3 + 3.2 * Math.pow(pRand, 2.2);
            particleSpeeds[i] = 1.0 / pWeight;
        }

        particleGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        particleGeometry.setAttribute('aSpeed', new THREE.BufferAttribute(particleSpeeds, 1));

        const particleUniforms = {
            uTime: { value: 0 },
            uSpeed: { value: SETTINGS.speed },
            uCurveSoftness: { value: SETTINGS.curveSoftness },
            uParticleSize: { value: SETTINGS.particleSize }
        };

        const particleMaterial = new THREE.ShaderMaterial({
            uniforms: particleUniforms,
            vertexShader: `
                uniform float uTime;
                uniform float uSpeed;
                uniform float uCurveSoftness;
                uniform float uParticleSize;
                attribute float aSpeed;
                varying float vAlpha;

                void main() {
                    vec3 pos = position;

                    float angle = atan(pos.z, pos.x);
                    float radius = length(pos.xz);
                    float currentAngle = angle - uTime * uSpeed * 0.012 * aSpeed;

                    float normX = cos(currentAngle);
                    float n = uCurveSoftness;
                    float absZ = pow(max(0.00001, 1.0 - pow(abs(normX), n)), 1.0 / n) * radius;

                    pos.x = cos(currentAngle) * radius;
                    pos.z = sign(sin(currentAngle)) * absZ;

                    vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                    gl_PointSize = (10.0 * uParticleSize / -mvPosition.z);
                    gl_Position = projectionMatrix * mvPosition;

                    vAlpha = smoothstep(38.0, 25.0, pos.y) * smoothstep(-12.0, -6.0, pos.y);
                }
            `,
            fragmentShader: `
                varying float vAlpha;

                void main() {
                    vec2 xy = gl_PointCoord.xy - vec2(0.5);
                    float d = length(xy);
                    if (d > 0.5) discard;

                    // Smooth fluorescent point dispersion
                    float glow = exp(-d * d * 12.0);
                    gl_FragColor = vec4(1.0, 1.0, 1.0, vAlpha * glow);
                }
            `,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const particles = new THREE.Points(particleGeometry, particleMaterial);
        tunnelGroup.add(particles);

        // =========================================================================
        // 6. POST-PROCESSING COMPOSER (BLOOM, CHROMATIC ABERRATION, SCREEN BLUR)
        // =========================================================================
        const composer = new EffectComposer(renderer);
        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);

        const PeripheralBlurShader = {
            uniforms: {
                tDiffuse: { value: null },
                uStrength: { value: SETTINGS.edgeBlurStrength },
                uAspect: { value: window.innerWidth / window.innerHeight }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D tDiffuse;
                uniform float uStrength;
                uniform float uAspect;
                varying vec2 vUv;

                void main() {
                    vec2 center = vec2(0.5, 0.5);
                    vec2 uvCorrection = vec2(uAspect, 1.0);
                    float dist = length((vUv - center) * uvCorrection);

                    float blurMask = smoothstep(0.18, 0.72, dist);

                    if (blurMask <= 0.0 || uStrength <= 0.0001) {
                        gl_FragColor = texture2D(tDiffuse, vUv);
                        return;
                    }

                    const int SAMPLES = 32;
                    const float GOLDEN_ANGLE = 2.39996323;
                    vec4 color = vec4(0.0);
                    float radius = uStrength * blurMask;

                    for (int i = 0; i < SAMPLES; i++) {
                        float r = sqrt(float(i) + 0.5) / sqrt(float(SAMPLES));
                        float theta = float(i) * GOLDEN_ANGLE;
                        vec2 offset = vec2(cos(theta), sin(theta)) * r * radius;
                        offset.x /= uAspect;
                        color += texture2D(tDiffuse, vUv + offset);
                    }
                    gl_FragColor = color / float(SAMPLES);
                }
            `
        };
        const peripheralBlurPass = new ShaderPass(PeripheralBlurShader);
        composer.addPass(peripheralBlurPass);

        const ChromaticAberrationShader = {
            uniforms: {
                tDiffuse: { value: null },
                uAmount: { value: SETTINGS.chromaticAberration }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D tDiffuse;
                uniform float uAmount;
                varying vec2 vUv;

                void main() {
                    if (uAmount <= 0.0001) {
                        gl_FragColor = texture2D(tDiffuse, vUv);
                        return;
                    }
                    vec2 offset = uAmount * (vec2(0.5) - vUv);
                    vec4 cr = texture2D(tDiffuse, vUv + offset);
                    vec4 cga = texture2D(tDiffuse, vUv);
                    vec4 cb = texture2D(tDiffuse, vUv - offset);
                    gl_FragColor = vec4(cr.r, cga.g, cb.b, cga.a);
                }
            `
        };
        const caPass = new ShaderPass(ChromaticAberrationShader);
        composer.addPass(caPass);

        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            SETTINGS.bloomStrength,
            SETTINGS.bloomRadius,
            0.08
        );
        composer.addPass(bloomPass);

        // =========================================================================
        // 7. HELPER FUNCTIONS & CONTROLS UPDATE
        // =========================================================================
        const updateBackground = () => {
            const activeBg = SETTINGS.greenScreen ? SETTINGS.greenScreenColor : SETTINGS.bgColor;
            uniforms.uBgColor.value.set(activeBg);
            uniforms.uIsGreenScreen.value = SETTINGS.greenScreen ? 1.0 : 0.0;
            uniforms.uGreenScreenColor.value.set(SETTINGS.greenScreenColor);
            scene.background.set(activeBg);
            scene.fog.color.set(activeBg);
            document.body.style.backgroundColor = activeBg;
        };

        const updateObjectTransform = () => {
            tunnelGroup.position.x = SETTINGS.objectX;
            tunnelGroup.position.y = SETTINGS.objectY;
            tunnelGroup.scale.set(
                SETTINGS.curveWidth * SETTINGS.zoom,
                SETTINGS.height * SETTINGS.zoom,
                SETTINGS.curveDepth * SETTINGS.zoom
            );
            tunnelGroup.rotation.z = SETTINGS.wallTilt * Math.PI / 180;
        };

        const applyColorScheme = (schemeName) => {
            const preset = COLOR_PRESETS[schemeName];
            if (!preset) return;

            SETTINGS.colorScheme = schemeName;
            SETTINGS.color0 = preset.c0;
            SETTINGS.color1 = preset.c1;
            SETTINGS.color2 = preset.c2;
            SETTINGS.color3 = preset.c3;
            SETTINGS.color4 = preset.c4;
            SETTINGS.bgColor = preset.bg;

            uniforms.uColor0.value.set(SETTINGS.color0);
            uniforms.uColor1.value.set(SETTINGS.color1);
            uniforms.uColor2.value.set(SETTINGS.color2);
            uniforms.uColor3.value.set(SETTINGS.color3);
            uniforms.uColor4.value.set(SETTINGS.color4);

            updateBackground();
            updateGuiDisplays();
        };

        const updateCustomColors = () => {
            uniforms.uColor0.value.set(SETTINGS.color0);
            uniforms.uColor1.value.set(SETTINGS.color1);
            uniforms.uColor2.value.set(SETTINGS.color2);
            uniforms.uColor3.value.set(SETTINGS.color3);
            uniforms.uColor4.value.set(SETTINGS.color4);
            updateBackground();
        };

        // Procedural Variation Generator (Randomizer)
        const randomizeScene = () => {
            const schemeKeys = Object.keys(COLOR_PRESETS);
            const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
            
            const animKeys = Object.keys(ANIMATION_MODES);
            const randomAnim = animKeys[Math.floor(Math.random() * animKeys.length)];

            SETTINGS.curveSoftness = parseFloat((4.0 + Math.random() * 6.0).toFixed(2));
            SETTINGS.curveWidth = parseFloat((0.2 + Math.random() * 0.6).toFixed(4));
            SETTINGS.curveDepth = parseFloat((0.5 + Math.random() * 0.8).toFixed(4));
            SETTINGS.height = parseFloat((0.8 + Math.random() * 0.9).toFixed(4));
            SETTINGS.lineDensity = parseFloat((0.6 + Math.random() * 1.4).toFixed(2));
            SETTINGS.speed = parseFloat((2.5 + Math.random() * 6.5).toFixed(1));
            SETTINGS.particleSize = parseFloat((6.0 + Math.random() * 10.0).toFixed(1));
            SETTINGS.bloomStrength = parseFloat((0.2 + Math.random() * 0.45).toFixed(2));
            SETTINGS.animMode = randomAnim;

            uniforms.uCurveSoftness.value = SETTINGS.curveSoftness;
            uniforms.uLineDensity.value = SETTINGS.lineDensity;
            uniforms.uSpeed.value = SETTINGS.speed;
            particleUniforms.uCurveSoftness.value = SETTINGS.curveSoftness;
            particleUniforms.uSpeed.value = SETTINGS.speed;
            particleUniforms.uParticleSize.value = SETTINGS.particleSize;
            bloomPass.strength = SETTINGS.bloomStrength;

            applyColorScheme(randomScheme);
            updateObjectTransform();
            updateGuiDisplays();
        };

        // =========================================================================
        // 8. LIL-GUI CONTROL PANEL
        // =========================================================================
        const gui = new GUI({ title: 'Electrophoresis Settings' });

        // Presets & Randomizer
        const fPresets = gui.addFolder('Presets & Modes');
        fPresets.add(SETTINGS, 'colorScheme', Object.keys(COLOR_PRESETS))
            .name('Color Scheme (18)')
            .listen()
            .onChange(applyColorScheme);

        fPresets.add(SETTINGS, 'animMode', Object.keys(ANIMATION_MODES))
            .name('Animation Mode (8)')
            .listen();

        fPresets.add(SETTINGS, 'randomizeOnClick')
            .name('Randomize on Click')
            .listen();

        fPresets.add({ randomize: randomizeScene }, 'randomize')
            .name('🎲 Generate New Variation');

        // View & Interactive Navigation
        const fView = gui.addFolder('View & Navigation');
        fView.add(SETTINGS, 'zoom', 0.15, 5.0, 0.05).name('Zoom (Wheel)').listen().onChange(updateObjectTransform);
        fView.add(SETTINGS, 'objectX', -80.0, 80.0, 0.1).name('Pan X (Drag)').listen().onChange(updateObjectTransform);
        fView.add(SETTINGS, 'objectY', -50.0, 50.0, 0.1).name('Pan Y (Drag)').listen().onChange(updateObjectTransform);
        fView.add(SETTINGS, 'fov', 30, 140).name('Camera FOV').listen().onChange(v => {
            camera.fov = v;
            camera.updateProjectionMatrix();
        });
        fView.add(SETTINGS, 'wallTilt', -180, 180).name('Gel Tilt (deg)').listen().onChange(updateObjectTransform);
        fView.add({
            resetView: () => {
                SETTINGS.zoom = 1.0;
                SETTINGS.objectX = 0.0;
                SETTINGS.objectY = 0.0;
                SETTINGS.wallTilt = 0.0;
                SETTINGS.fov = 112.0;
                camera.fov = 112.0;
                camera.updateProjectionMatrix();
                updateObjectTransform();
                updateGuiDisplays();
            }
        }, 'resetView').name('Reset View');

        // Gel Slab & Bands Geometry
        const fGeometry = gui.addFolder('Gel Matrix & Bands');
        fGeometry.add(SETTINGS, 'curveSoftness', 1.0, 10.0, 0.1).name('Curve Softness').listen().onChange(v => {
            uniforms.uCurveSoftness.value = v;
            particleUniforms.uCurveSoftness.value = v;
        });
        fGeometry.add(SETTINGS, 'curveWidth', 0.1, 2.5, 0.01).name('Gel Width').listen().onChange(updateObjectTransform);
        fGeometry.add(SETTINGS, 'curveDepth', 0.1, 2.5, 0.01).name('Gel Depth').listen().onChange(updateObjectTransform);
        fGeometry.add(SETTINGS, 'height', 0.2, 3.0, 0.01).name('Gel Height').listen().onChange(updateObjectTransform);
        fGeometry.add(SETTINGS, 'lineDensity', 0.1, 4.0, 0.05).name('Band Lane Density').listen().onChange(v => {
            uniforms.uLineDensity.value = v;
        });
        fGeometry.add(SETTINGS, 'particleSize', 1.0, 25.0, 0.5).name('Fluorophore Ion Size').listen().onChange(v => {
            particleUniforms.uParticleSize.value = v;
        });

        // Motion & Speed
        const fMotion = gui.addFolder('Motion');
        fMotion.add(SETTINGS, 'speed', 0.0, 15.0, 0.1).name('Migration Speed').listen().onChange(v => {
            uniforms.uSpeed.value = v;
            particleUniforms.uSpeed.value = v;
        });

        // System & Display
        const fSystem = gui.addFolder('System & Display');
        fSystem.add(SETTINGS, 'dpr', 0.2, 3.0, 0.1).name('Pixel Ratio (DPR)').onChange(v => {
            renderer.setPixelRatio(v);
            composer.setPixelRatio(v);
        });
        fSystem.add(SETTINGS, 'greenScreen').name('Green Screen').listen().onChange(updateBackground);
        fSystem.add(SETTINGS, 'greenScreenColor').name('Green Screen Color').listen().onChange(updateBackground);

        // Custom Colors & Stain Palette
        const fColors = gui.addFolder('Stain Chemistry Palette (1D LUT)');
        fColors.addColor(SETTINGS, 'color0').name('Stain C0 (Well Base)').listen().onChange(updateCustomColors);
        fColors.addColor(SETTINGS, 'color1').name('Stain C1 (High MW)').listen().onChange(updateCustomColors);
        fColors.addColor(SETTINGS, 'color2').name('Stain C2 (Mid MW)').listen().onChange(updateCustomColors);
        fColors.addColor(SETTINGS, 'color3').name('Stain C3 (Low MW)').listen().onChange(updateCustomColors);
        fColors.addColor(SETTINGS, 'color4').name('Stain C4 (Front Peak)').listen().onChange(updateCustomColors);
        fColors.addColor(SETTINGS, 'bgColor').name('Transilluminator Gel Bg').listen().onChange(updateCustomColors);

        // Post-Processing
        const fEffects = gui.addFolder('Post-Processing');
        fEffects.add(SETTINGS, 'bloomStrength', 0.0, 2.5, 0.01).name('Bloom Strength').listen().onChange(v => bloomPass.strength = v);
        fEffects.add(SETTINGS, 'bloomRadius', 0.0, 2.0, 0.02).name('Bloom Radius').listen().onChange(v => bloomPass.radius = v);
        fEffects.add(SETTINGS, 'chromaticAberration', 0.0, 0.04, 0.001).name('RGB Spectral Shift').listen().onChange(v => caPass.uniforms.uAmount.value = v);
        fEffects.add(SETTINGS, 'edgeBlurStrength', 0.0, 0.05, 0.001).name('Screen Edge Blur').listen().onChange(v => peripheralBlurPass.uniforms.uStrength.value = v);

        // Recursive GUI Controller Updater
        function updateGuiDisplays() {
            function updateFolder(folder) {
                folder.controllers.forEach(c => c.updateDisplay());
                folder.folders.forEach(f => updateFolder(f));
            }
            updateFolder(gui);
        }

        // =========================================================================
        // 9. INTERACTION (MOUSE DRAG, WHEEL ZOOM, CLICK-TO-RANDOMIZE, 'H' KEY)
        // =========================================================================
        const dragState = {
            active: false,
            pointerId: null,
            startX: 0,
            startY: 0,
            startObjectX: 0,
            startObjectY: 0,
            totalMovement: 0
        };

        renderer.domElement.addEventListener('wheel', event => {
            if (event.target.closest('.lil-gui')) return;
            event.preventDefault();
            const zoomFactor = event.deltaY > 0 ? 0.92 : 1.08;
            SETTINGS.zoom = THREE.MathUtils.clamp(SETTINGS.zoom * zoomFactor, 0.15, 5.0);
            updateObjectTransform();
            updateGuiDisplays();
        }, { passive: false });

        renderer.domElement.addEventListener('pointerdown', event => {
            if (event.button !== 0 || event.target.closest('.lil-gui')) return;
            dragState.active = true;
            dragState.pointerId = event.pointerId;
            dragState.startX = event.clientX;
            dragState.startY = event.clientY;
            dragState.startObjectX = SETTINGS.objectX;
            dragState.startObjectY = SETTINGS.objectY;
            dragState.totalMovement = 0;
            renderer.domElement.setPointerCapture(event.pointerId);
        });

        renderer.domElement.addEventListener('pointermove', event => {
            if (!dragState.active || event.pointerId !== dragState.pointerId) return;
            const dx = event.clientX - dragState.startX;
            const dy = event.clientY - dragState.startY;
            dragState.totalMovement += Math.hypot(event.movementX, event.movementY);

            const worldUnitsPerPixel = 0.12 / SETTINGS.zoom;
            SETTINGS.objectX = dragState.startObjectX + dx * worldUnitsPerPixel;
            SETTINGS.objectY = dragState.startObjectY - dy * worldUnitsPerPixel;
            updateObjectTransform();
        });

        const endDrag = event => {
            if (!dragState.active || event.pointerId !== dragState.pointerId) return;
            const wasClick = dragState.totalMovement < 6;
            dragState.active = false;
            dragState.pointerId = null;
            renderer.domElement.releasePointerCapture(event.pointerId);
            updateGuiDisplays();

            // Click to randomize scene variation
            if (wasClick && SETTINGS.randomizeOnClick) {
                randomizeScene();
            }
        };

        renderer.domElement.addEventListener('pointerup', endDrag);
        renderer.domElement.addEventListener('pointercancel', endDrag);

        // Hide/Show GUI with "H" key
        window.addEventListener('keydown', event => {
            if (event.key === 'h' || event.key === 'H') {
                gui.show(gui._hidden);
            }
        });

        // Hide loading message once ready
        const loadingElem = document.getElementById('loading');
        if (loadingElem) loadingElem.style.display = 'none';

        // =========================================================================
        // 10. ANIMATION & RENDER LOOP
        // =========================================================================
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const t = clock.getElapsedTime();
            const animSpeedVal = SETTINGS.speed * 0.3;

            uniforms.uTime.value = t;
            particleUniforms.uTime.value = t;

            const mode = ANIMATION_MODES[SETTINGS.animMode] !== undefined ? ANIMATION_MODES[SETTINGS.animMode] : 1;

            if (mode === 0) {
                // 0: Static Gel (Zero camera movement)
                camera.position.set(0, 0, 0);
                camera.rotation.set(0, 0, 0);
            }
            else if (mode === 1) {
                // 1: Gentle Gel Drift (Slow Orbit)
                camera.position.set(0, 0, 0);
                camera.rotation.set(0, t * 0.045, 0);
            }
            else if (mode === 2) {
                // 2: Gel Bed Breathing (FOV & Float)
                camera.position.set(0, Math.sin(t * 0.4) * 1.8, 0);
                camera.rotation.set(Math.cos(t * 0.3) * 0.02, t * 0.025, 0);
                camera.fov = SETTINGS.fov + Math.sin(t * 0.5) * 3.5;
                camera.updateProjectionMatrix();
            }
            else if (mode === 3) {
                // 3: Electrophoretic Migration Follow
                camera.position.set(0, Math.sin(t * 0.35) * 4.2, 0);
                camera.rotation.set(Math.cos(t * 0.35) * 0.04, Math.sin(t * 0.2) * 0.03, 0);
            }
            else if (mode === 4) {
                // 4: Transilluminator Tilt & Rock
                const roll = Math.sin(t * 0.3) * 0.06;
                const pitch = Math.cos(t * 0.25) * 0.04;
                const yaw = Math.sin(t * 0.18) * 0.05;
                camera.position.set(Math.sin(t * 0.2) * 1.5, Math.cos(t * 0.25) * 1.2, 0);
                camera.rotation.set(pitch, yaw, roll);
            }
            else if (mode === 5) {
                // 5: Transmitted Backlight Scan
                camera.position.set(Math.cos(t * 0.28) * 2.2, Math.sin(t * 0.32) * 2.0, Math.sin(t * 0.22) * 3.0);
                camera.rotation.set(0, t * 0.035, Math.sin(t * 0.15) * 0.03);
            }
            else if (mode === 6) {
                // 6: Capillary Lissajous Drift
                const posX = Math.sin(t * 0.25) * 2.4;
                const posY = Math.sin(t * 0.37) * 2.0;
                const posZ = Math.cos(t * 0.19) * 2.8;
                camera.position.set(posX, posY, posZ);
                camera.rotation.set(Math.sin(t * 0.22) * 0.03, t * 0.03, Math.cos(t * 0.18) * 0.02);
            }
            else if (mode === 7) {
                // 7: Macro Band Focus Sweep
                const zoomWave = Math.sin(t * 0.4) * 0.5 + 0.5;
                camera.position.set(0, Math.sin(t * 0.3) * 2.5, zoomWave * 5.0);
                camera.rotation.set(Math.sin(t * 0.25) * 0.03, t * 0.02, 0);
            }

            composer.render();
        }

        // Initialize display state
        updateBackground();
        updateObjectTransform();
        applyColorScheme(SETTINGS.colorScheme);
        animate();

        // Window resize handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
            peripheralBlurPass.uniforms.uAspect.value = window.innerWidth / window.innerHeight;
        });
    </script>
</body>
</html>
