<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import GUI from 'lil-gui';

// =========================================================================================
// POST PROCESSOR SUITE (Inlined from postprocessing/PostProcessor.js for standalone execution)
// =========================================================================================
const orthoVertexShader = `
precision highp float;
in vec3 position;
out vec2 vUv;
void main() {
  vUv = position.xy * 0.5 + 0.5;
  gl_Position = vec4(position, 1.0);
}
`;

const brightFragmentShader = `
precision highp float;
uniform sampler2D inputTexture;
uniform float bloomThreshold;
in vec2 vUv;
out vec4 fragColor;

void main() {
  vec4 color = texture(inputTexture, vUv);
  float luminance = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
  float knee = 0.1;
  float soft = luminance - bloomThreshold + knee;
  soft = clamp(soft, 0.0, 2.0 * knee);
  soft = (soft * soft) / (4.0 * knee + 0.00001);
  float contribution = max(soft, luminance - bloomThreshold);
  contribution /= max(luminance, 0.00001);
  fragColor = vec4(color.rgb * contribution, color.a);
}
`;

const blur13ShaderChunk = `
vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
  vec2 resolution = vec2(textureSize(image, 0));
  vec4 color = vec4(0.0);
  vec2 off1 = vec2(1.411764705882353) * direction;
  vec2 off2 = vec2(3.2941176470588234) * direction;
  vec2 off3 = vec2(5.176470588235294) * direction;
  color += texture(image, uv) * 0.1964825501511404;
  color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
  color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
  color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
  color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
  color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
  color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
  return color;
}
`;

const blurFragmentShader = `
precision highp float;
uniform sampler2D inputTexture;
uniform vec2 direction;
in vec2 vUv;
out vec4 color;
${blur13ShaderChunk}
void main() {
  color = blur13(inputTexture, vUv, direction);
}
`;

const godRaysDepthMaskShader = `
precision highp float;
uniform sampler2D inputTexture;
uniform float threshold;
in vec2 vUv;
out vec4 fragColor;

void main() {
  vec4 color = texture(inputTexture, vUv);
  float factor = smoothstep(threshold, threshold + 0.15, dot(color.rgb, vec3(0.2126, 0.7152, 0.0722)));
  fragColor = vec4(vec3(factor), 1.0);
}
`;

const godRaysGenerateShader = `
precision highp float;
#define TAPS_PER_PASS 6.0

uniform sampler2D inputTexture;
uniform vec3 vSunPositionScreenSpace;
uniform float fStepSize;
uniform float distanceAttenuation;
uniform float maxDensity;
in vec2 vUv;
out vec4 fragColor;

void main() {
  vec2 delta = vSunPositionScreenSpace.xy - vUv;
  float dist = length(delta);
  vec2 stepv = fStepSize * delta / max(dist, 0.0001);
  vec2 uv = vUv;
  float col = 0.0;
  float f = min(1.0, max(vSunPositionScreenSpace.z, 0.0));
  float atten = 1.0 / (1.0 + pow(dist, distanceAttenuation));

  for (float i = 0.0; i < TAPS_PER_PASS; i += 1.0) {
    col += texture(inputTexture, uv).r;
    uv += stepv;
  }

  fragColor = vec4(vec3(col * (1.0 / 6.0) * f * atten * maxDensity), 1.0);
}
`;

const anamorphicBrightShader = `
precision highp float;
uniform sampler2D inputTexture;
uniform float threshold;
uniform float smoothWidth;
in vec2 vUv;
out vec4 fragColor;

void main() {
  vec4 color = texture(inputTexture, vUv);
  float lum = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
  float factor = smoothstep(threshold, threshold + smoothWidth, lum);
  fragColor = vec4(color.rgb * factor, color.a);
}
`;

const anamorphicBlurShader = `
precision highp float;
uniform sampler2D inputTexture;
uniform vec2 resolution;
uniform float samples;
uniform float intensity;
uniform vec3 tintColor;
uniform float bloomRadius;
in vec2 vUv;
out vec4 fragColor;

void main() {
  vec4 sum = vec4(0.0);
  float totalWeight = 0.0;
  float baseRadius = 0.03 * (1.0 + bloomRadius * 1.5);
  int sampleCount = int(clamp(samples, 8.0, 96.0));
  float fSamples = float(sampleCount);

  for (int i = 0; i < 96; i++) {
    if (i >= sampleCount) break;
    float fi = float(i);
    float offset = (fi / (fSamples - 1.0) - 0.5) * 2.0;
    float weight = exp(-3.0 * offset * offset);
    vec2 sampleUV = vUv + vec2(offset * baseRadius, 0.0);
    sampleUV = clamp(sampleUV, vec2(0.0), vec2(1.0));
    sum += texture(inputTexture, sampleUV) * weight;
    totalWeight += weight;
  }

  vec4 bloom = (sum / totalWeight) * intensity;
  fragColor = vec4(bloom.rgb * tintColor, bloom.a);
}
`;

const finalFragmentShader = `
precision highp float;
uniform vec2 resolution;
uniform sampler2D inputTexture;
uniform sampler2D blur0Texture;
uniform sampler2D blur1Texture;
uniform sampler2D blur2Texture;
uniform sampler2D blur3Texture;
uniform sampler2D blur4Texture;
uniform sampler2D raysTexture;
uniform sampler2D anamorphicTexture;
uniform bool bloomEnabled;
uniform float bloomStrength;
uniform bool raysEnabled;
uniform float raysStrength;
uniform vec3 raysColor;
uniform bool anamorphicEnabled;
uniform float vignetteBoost;
uniform float vignetteReduction;
uniform float noiseIntensity;
uniform float time;
in vec2 vUv;
out vec4 fragColor;

float vignette(vec2 uv, float boost, float reduction) {
  vec2 position = vUv - 0.5;
  return boost - length(position) * reduction;
}

float hash1(uint n) {
  n = (n << 13U) ^ n;
  n = n * (n * n * 15731U + 789221U) + 1376312589U;
  return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
}

float noise(in vec2 uv, in float timeVal) {
  uvec2 p = uvec2(uv);
  return hash1(p.x + 1920U * p.y + (1920U * 1080U) * uint(timeVal));
}

void main() {
  vec4 color = texture(inputTexture, vUv);

  if (bloomEnabled && bloomStrength > 0.001) {
    vec4 b0 = texture(blur0Texture, vUv);
    vec4 b1 = texture(blur1Texture, vUv);
    vec4 b2 = texture(blur2Texture, vUv);
    vec4 b3 = texture(blur3Texture, vUv);
    vec4 b4 = texture(blur4Texture, vUv);

    vec4 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
    color += bloomSum * bloomStrength;
  }

  if (raysEnabled && raysStrength > 0.001) {
    vec4 r = texture(raysTexture, vUv);
    color.rgb += r.rgb * raysColor * raysStrength;
  }

  if (anamorphicEnabled) {
    vec4 a = texture(anamorphicTexture, vUv);
    color.rgb += a.rgb;
  }

  color.rgb *= vignette(vUv, vignetteBoost, vignetteReduction);
  color.rgb += noiseIntensity * noise(gl_FragCoord.xy, time);
  fragColor = vec4(color.rgb, 1.0);
}
`;

const chromaticAberrationShaderChunk = `
vec2 barrelDistortion(vec2 coord, float amt) {
  vec2 cc = coord - 0.5;
  float dist = dot(cc, cc);
  return coord + cc * dist * amt;
}
float sat(float t) { return clamp(t, 0.0, 1.0); }
float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
vec4 spectrum_offset(float t) {
  float lo = step(t, 0.5);
  float hi = 1.0 - lo;
  float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
  vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
  return pow(ret, vec4(1.0 / 2.2));
}
const float max_distort = 2.2;
const int num_iter = 8;
const float reci_num_iter_f = 1.0 / float(num_iter);
vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
  vec4 sumcol = vec4(0.0);
  vec4 sumw = vec4(0.0);
  for (int i = 0; i < num_iter; ++i) {
    float t = float(i) * reci_num_iter_f;
    vec4 w = spectrum_offset(t);
    sumw += w;
    sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
  }
  return sumcol / sumw;
}
`;

const colorFragmentShader = `
precision highp float;
uniform sampler2D inputTexture;
uniform float chromaticAberrationAmount;
uniform float minInputLevel;
uniform float maxInputLevel;
uniform float gammaLevel;
uniform float exposure;
uniform float fisheyeStrength;
uniform float fisheyeRadius;
uniform float time;
uniform int visionMode;
uniform float thermalSensitivity;
uniform float nightVisionNoise;
uniform float nightVisionGain;
uniform float crtIntensity;
in vec2 vUv;
out vec4 fragColor;

${chromaticAberrationShaderChunk}

vec2 applyFisheye(vec2 uv, float strength, float radius) {
  if (abs(strength) < 0.0001) return uv;
  vec2 p = uv - 0.5;
  float d = length(p);
  if (d > radius * 1.5) return uv;
  float r = d / max(radius, 0.001);
  float theta = atan(p.y, p.x);
  float rDist = r + strength * (r * r * r);
  return 0.5 + vec2(cos(theta), sin(theta)) * (rDist * radius);
}

vec3 ACESFilmicToneMapping(vec3 color) {
  float a = 2.51;
  float b = 0.03;
  float c = 2.43;
  float d = 0.59;
  float e = 0.14;
  return clamp((color * (a * color + b)) / (color * (c * color + d) + e), 0.0, 1.0);
}

vec3 gammaCorrect(vec3 color, vec3 gamma) {
  return pow(max(color, vec3(0.0)), 1.0 / gamma);
}
vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
  return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
}
vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
  return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
}

vec3 applyNightVision(vec3 color, vec2 uv, float timeVal, float noiseAmt, float gain, float crt) {
  float lum = dot(color, vec3(0.299, 0.587, 0.114));
  float amplified = pow(lum * gain, 0.72);
  vec3 phosphorColor = mix(vec3(0.02, 0.12, 0.03), vec3(0.18, 1.0, 0.32), clamp(amplified, 0.0, 1.0));
  phosphorColor += vec3(0.7, 1.0, 0.8) * max(0.0, amplified - 0.75) * 1.8;
  vec2 p = uv - 0.5;
  float tubeDist = length(p);
  float tubeMask = smoothstep(0.72, 0.44, tubeDist);
  float n = fract(sin(dot(uv * 280.0 + timeVal * 0.05, vec2(12.9898, 78.233))) * 43758.5453);
  float scanline = sin(uv.y * 650.0) * crt;
  phosphorColor += (n - 0.5) * noiseAmt * 2.0 + scanline;
  return clamp(phosphorColor * tubeMask, 0.0, 1.0);
}

vec3 ironbow(float t) {
  t = clamp(t, 0.0, 1.0);
  vec3 c0 = vec3(0.02, 0.01, 0.18);
  vec3 c1 = vec3(0.22, 0.02, 0.48);
  vec3 c2 = vec3(0.82, 0.05, 0.25);
  vec3 c3 = vec3(1.0, 0.62, 0.02);
  vec3 c4 = vec3(1.0, 1.0, 0.92);
  if (t < 0.25) return mix(c0, c1, t * 4.0);
  if (t < 0.50) return mix(c1, c2, (t - 0.25) * 4.0);
  if (t < 0.75) return mix(c2, c3, (t - 0.50) * 4.0);
  return mix(c3, c4, (t - 0.75) * 4.0);
}

vec3 applyThermal(vec3 color, vec2 uv, float sensitivity, float crt, bool whiteHot) {
  float lum = dot(color, vec3(0.299, 0.587, 0.114));
  float heat = clamp(lum * sensitivity, 0.0, 1.0);
  float sensorRaster = sin(uv.y * 900.0) * (crt * 0.3);
  heat = clamp(heat + sensorRaster, 0.0, 1.0);
  if (whiteHot) {
    float grad = pow(heat, 0.85);
    return vec3(grad);
  } else {
    return ironbow(heat);
  }
}

void main() {
  vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
  vec4 col = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
  vec3 finalCol = col.rgb;
  
  if (visionMode == 1) {
    finalCol = applyNightVision(finalCol, uv, time, nightVisionNoise, nightVisionGain, crtIntensity);
  } else if (visionMode == 2) {
    finalCol = applyThermal(finalCol, uv, thermalSensitivity, crtIntensity, false);
  } else if (visionMode == 3) {
    finalCol = applyThermal(finalCol, uv, thermalSensitivity, crtIntensity, true);
  } else {
    vec3 exposedColor = finalCol * exposure;
    vec3 toneMappedColor = ACESFilmicToneMapping(exposedColor);
    finalCol = finalLevels(toneMappedColor, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
  }

  fragColor = vec4(finalCol, 1.0);
}
`;

const copyFragmentShader = `
precision highp float;
uniform sampler2D inputTexture;
in vec2 vUv;
out vec4 fragColor;
void main() {
  fragColor = texture(inputTexture, vUv);
}
`;

function createFBO(w, h, options = {}) {
  return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
    wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
    wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
    minFilter: options.minFilter || THREE.LinearFilter,
    magFilter: options.magFilter || THREE.LinearFilter,
    format: options.format || THREE.RGBAFormat,
    type: options.type || THREE.HalfFloatType,
    stencilBuffer: options.stencilBuffer || false,
    depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : true,
    samples: options.samples || 0,
  });
}

class ShaderPass {
  constructor(shader, options = {}) {
    this.shader = shader;
    this.orthoScene = new THREE.Scene();
    this.fbo = createFBO(1, 1, options);
    this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
    this.orthoScene.add(this.orthoQuad);
    this.texture = this.fbo.texture;
  }
  render(renderer, toScreen = false) {
    if (!toScreen) {
      renderer.setRenderTarget(this.fbo);
    }
    renderer.render(this.orthoScene, this.orthoCamera);
    if (!toScreen) {
      renderer.setRenderTarget(null);
    }
  }
  setSize(width, height) {
    this.fbo.setSize(Math.max(1, width), Math.max(1, height));
    this.orthoQuad.scale.set(width, height, 1);
  }
}

class ShaderPingPongPass {
  constructor(shader, options = {}) {
    this.shader = shader;
    this.orthoScene = new THREE.Scene();
    this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
    this.currentFBO = 0;
    this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
    this.orthoScene.add(this.orthoQuad);
  }
  render(renderer) {
    renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
    renderer.render(this.orthoScene, this.orthoCamera);
    renderer.setRenderTarget(null);
    this.currentFBO = 1 - this.currentFBO;
  }
  get current() { return this.fbos[this.currentFBO]; }
  get texture() { return this.current.texture; }
  setSize(width, height) {
    const w = Math.max(1, width);
    const h = Math.max(1, height);
    this.orthoQuad.scale.set(w, h, 1);
    this.fbos[0].setSize(w, h);
    this.fbos[1].setSize(w, h);
  }
}

class BloomPass {
  constructor(strength = 0.8, radius = 0.5, threshold = 0.2, levels = 5) {
    this.strength = strength;
    this.radius = radius;
    this.threshold = threshold;
    this.enabled = true;
    this.levels = levels;

    this.brightShader = new THREE.RawShaderMaterial({
      uniforms: {
        inputTexture: { value: null },
        bloomThreshold: { value: this.threshold },
      },
      vertexShader: orthoVertexShader,
      fragmentShader: brightFragmentShader,
      glslVersion: THREE.GLSL3,
    });
    this.brightPass = new ShaderPass(this.brightShader, {
      format: THREE.RGBAFormat,
      type: THREE.HalfFloatType,
    });

    this.blurShader = new THREE.RawShaderMaterial({
      uniforms: {
        inputTexture: { value: null },
        direction: { value: new THREE.Vector2(0, 1) },
      },
      vertexShader: orthoVertexShader,
      fragmentShader: blurFragmentShader,
      glslVersion: THREE.GLSL3,
    });

    this.blurPasses = [];
    for (let i = 0; i < this.levels; i++) {
      this.blurPasses.push(new ShaderPingPongPass(this.blurShader, {
        format: THREE.RGBAFormat,
        type: THREE.HalfFloatType,
      }));
    }
  }

  setSize(w, h) {
    let tw = Math.max(1, w);
    let th = Math.max(1, h);
    this.brightPass.setSize(tw, th);
    for (let i = 0; i < this.levels; i++) {
      tw = Math.max(1, Math.round(tw / 2));
      th = Math.max(1, Math.round(th / 2));
      this.blurPasses[i].setSize(tw, th);
    }
  }

  set source(texture) {
    this.brightShader.uniforms.inputTexture.value = texture;
  }

  render(renderer) {
    if (!this.enabled || this.strength <= 0.001) return;

    this.brightShader.uniforms.bloomThreshold.value = this.threshold;
    this.brightPass.render(renderer);

    const baseOffset = Math.max(0.1, this.radius * 2.0);
    const u = this.blurShader.uniforms;

    for (let j = 0; j < this.levels; j++) {
      const blurPass = this.blurPasses[j];
      const stepOffset = baseOffset * (1.0 + j * 0.5);

      u.direction.value.set(stepOffset, 0);
      u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
      blurPass.render(renderer);

      u.direction.value.set(0, stepOffset * 0.5);
      u.inputTexture.value = blurPass.current.texture;
      blurPass.render(renderer);
    }
  }
}

const VISION_MODE_MAP = {
  'Normal (Cinematic)': 0,
  'Night Vision (Phosphor)': 1,
  'Thermal (Ironbow)': 2,
  'Thermal (White-Hot)': 3,
};

class PostProcessor {
  constructor(renderer, params = {}) {
    this.renderer = renderer;

    this.settings = {
      enabled: params.enabled !== undefined ? params.enabled : true,
      bloomEnabled: params.bloomEnabled !== undefined ? params.bloomEnabled : true,
      bloomStrength: params.bloomStrength !== undefined ? params.bloomStrength : 1.1,
      bloomRadius: params.bloomRadius !== undefined ? params.bloomRadius : 0.6,
      bloomThreshold: params.bloomThreshold !== undefined ? params.bloomThreshold : 0.25,

      raysEnabled: params.raysEnabled !== undefined ? params.raysEnabled : false,
      raysStrength: params.raysStrength !== undefined ? params.raysStrength : 0.85,
      raysDensity: params.raysDensity !== undefined ? params.raysDensity : 1.0,
      raysMaxDensity: params.raysMaxDensity !== undefined ? params.raysMaxDensity : 0.5,
      raysDistanceAttenuation: params.raysDistanceAttenuation !== undefined ? params.raysDistanceAttenuation : 2.0,
      raysThreshold: params.raysThreshold !== undefined ? params.raysThreshold : 0.15,
      raysColor: params.raysColor ? (params.raysColor.isColor ? params.raysColor.clone() : new THREE.Color(params.raysColor)) : new THREE.Color(0x00d4ff),
      raysColorHex: params.raysColorHex || '#00d4ff',

      anamorphicEnabled: params.anamorphicEnabled !== undefined ? params.anamorphicEnabled : false,
      anamorphicIntensity: params.anamorphicIntensity !== undefined ? params.anamorphicIntensity : 4.0,
      anamorphicThreshold: params.anamorphicThreshold !== undefined ? params.anamorphicThreshold : 0.3,
      anamorphicSamples: params.anamorphicSamples !== undefined ? params.anamorphicSamples : 64,
      anamorphicRadius: params.anamorphicRadius !== undefined ? params.anamorphicRadius : 0.0,
      anamorphicSmoothWidth: params.anamorphicSmoothWidth !== undefined ? params.anamorphicSmoothWidth : 0.05,
      anamorphicColor: params.anamorphicColor ? (params.anamorphicColor.isColor ? params.anamorphicColor.clone() : new THREE.Color(params.anamorphicColor)) : new THREE.Color(0x7a8aff),
      anamorphicColorHex: params.anamorphicColorHex || '#7a8aff',

      visionMode: params.visionMode !== undefined ? params.visionMode : 'Normal (Cinematic)',
      thermalSensitivity: params.thermalSensitivity !== undefined ? params.thermalSensitivity : 1.4,
      nightVisionGain: params.nightVisionGain !== undefined ? params.nightVisionGain : 2.1,
      nightVisionNoise: params.nightVisionNoise !== undefined ? params.nightVisionNoise : 0.05,
      crtIntensity: params.crtIntensity !== undefined ? params.crtIntensity : 0.0,

      fisheyeStrength: params.fisheyeStrength !== undefined ? params.fisheyeStrength : 0.0,
      fisheyeRadius: params.fisheyeRadius !== undefined ? params.fisheyeRadius : 1.0,
      chromaticAberration: params.chromaticAberration !== undefined ? params.chromaticAberration : 0.012,
      vignetteBoost: params.vignetteBoost !== undefined ? params.vignetteBoost : 1.05,
      vignetteReduction: params.vignetteReduction !== undefined ? params.vignetteReduction : 0.45,
      noiseIntensity: params.noiseIntensity !== undefined ? params.noiseIntensity : 0.01,

      gamma: params.gamma !== undefined ? params.gamma : 1.0,
      minInputLevel: params.minInputLevel !== undefined ? params.minInputLevel : 0.0,
      maxInputLevel: params.maxInputLevel !== undefined ? params.maxInputLevel : 1.0,
      exposure: params.exposure !== undefined ? params.exposure : 1.0,
    };

    this.sceneTarget = createFBO(1, 1, { type: THREE.HalfFloatType });
    this.bloomPass = new BloomPass(
      this.settings.bloomStrength,
      this.settings.bloomRadius,
      this.settings.bloomThreshold,
      5
    );

    this.moonScreenPos = new THREE.Vector3(0.5, 0.5, 1.0);
    this.moonInFront = true;

    this.godRaysMaskShader = new THREE.RawShaderMaterial({
      uniforms: {
        inputTexture: { value: null },
        threshold: { value: this.settings.raysThreshold },
      },
      vertexShader: orthoVertexShader,
      fragmentShader: godRaysDepthMaskShader,
      glslVersion: THREE.GLSL3,
    });
    this.godRaysMaskPass = new ShaderPass(this.godRaysMaskShader, {
      format: THREE.RGBAFormat,
      type: THREE.HalfFloatType,
    });

    this.godRaysGenShader = new THREE.RawShaderMaterial({
      uniforms: {
        inputTexture: { value: null },
        vSunPositionScreenSpace: { value: this.moonScreenPos },
        fStepSize: { value: 1.0 },
        distanceAttenuation: { value: this.settings.raysDistanceAttenuation },
        maxDensity: { value: this.settings.raysMaxDensity },
      },
      vertexShader: orthoVertexShader,
      fragmentShader: godRaysGenerateShader,
      glslVersion: THREE.GLSL3,
    });
    this.godRaysPingPong = new ShaderPingPongPass(this.godRaysGenShader, {
      format: THREE.RGBAFormat,
      type: THREE.HalfFloatType,
    });

    this.anamorphicBrightShader = new THREE.RawShaderMaterial({
      uniforms: {
        inputTexture: { value: null },
        threshold: { value: this.settings.anamorphicThreshold },
        smoothWidth: { value: this.settings.anamorphicSmoothWidth },
      },
      vertexShader: orthoVertexShader,
      fragmentShader: anamorphicBrightShader,
      glslVersion: THREE.GLSL3,
    });
    this.anamorphicBrightPass = new ShaderPass(this.anamorphicBrightShader, {
      format: THREE.RGBAFormat,
      type: THREE.HalfFloatType,
    });

    this.anamorphicBlurShader = new THREE.RawShaderMaterial({
      uniforms: {
        inputTexture: { value: null },
        resolution: { value: new THREE.Vector2(1, 1) },
        samples: { value: this.settings.anamorphicSamples },
        intensity: { value: this.settings.anamorphicIntensity },
        tintColor: { value: this.settings.anamorphicColor },
        bloomRadius: { value: this.settings.anamorphicRadius },
      },
      vertexShader: orthoVertexShader,
      fragmentShader: anamorphicBlurShader,
      glslVersion: THREE.GLSL3,
    });
    this.anamorphicBlurPass = new ShaderPass(this.anamorphicBlurShader, {
      format: THREE.RGBAFormat,
      type: THREE.HalfFloatType,
    });

    this.finalShader = new THREE.RawShaderMaterial({
      uniforms: {
        resolution: { value: new THREE.Vector2(1, 1) },
        bloomEnabled: { value: this.settings.bloomEnabled },
        bloomStrength: { value: this.settings.bloomStrength },
        raysEnabled: { value: this.settings.raysEnabled },
        raysStrength: { value: this.settings.raysStrength },
        raysColor: { value: this.settings.raysColor },
        anamorphicEnabled: { value: this.settings.anamorphicEnabled },
        vignetteBoost: { value: this.settings.vignetteBoost },
        vignetteReduction: { value: this.settings.vignetteReduction },
        noiseIntensity: { value: this.settings.noiseIntensity },
        inputTexture: { value: null },
        blur0Texture: { value: null },
        blur1Texture: { value: null },
        blur2Texture: { value: null },
        blur3Texture: { value: null },
        blur4Texture: { value: null },
        raysTexture: { value: null },
        anamorphicTexture: { value: null },
        time: { value: 0 },
      },
      vertexShader: orthoVertexShader,
      fragmentShader: finalFragmentShader,
      glslVersion: THREE.GLSL3,
    });
    this.finalPass = new ShaderPass(this.finalShader);

    this.rgbShader = new THREE.RawShaderMaterial({
      uniforms: {
        inputTexture: { value: this.finalPass.texture },
        fisheyeStrength: { value: this.settings.fisheyeStrength },
        fisheyeRadius: { value: this.settings.fisheyeRadius },
        chromaticAberrationAmount: { value: this.settings.chromaticAberration },
        minInputLevel: { value: this.settings.minInputLevel },
        maxInputLevel: { value: this.settings.maxInputLevel },
        gammaLevel: { value: this.settings.gamma },
        exposure: { value: this.settings.exposure },
        visionMode: { value: VISION_MODE_MAP[this.settings.visionMode] ?? 0 },
        thermalSensitivity: { value: this.settings.thermalSensitivity },
        nightVisionGain: { value: this.settings.nightVisionGain },
        nightVisionNoise: { value: this.settings.nightVisionNoise },
        crtIntensity: { value: this.settings.crtIntensity },
        time: { value: 0 },
      },
      vertexShader: orthoVertexShader,
      fragmentShader: colorFragmentShader,
      glslVersion: THREE.GLSL3,
    });
    this.rgbPass = new ShaderPass(this.rgbShader);

    this.copyShader = new THREE.RawShaderMaterial({
      uniforms: {
        inputTexture: { value: null },
      },
      vertexShader: orthoVertexShader,
      fragmentShader: copyFragmentShader,
      glslVersion: THREE.GLSL3,
    });
    this.copyPass = new ShaderPass(this.copyShader);
  }

  updateSettings() {
    this.bloomPass.enabled = this.settings.bloomEnabled;
    this.bloomPass.strength = this.settings.bloomStrength;
    this.bloomPass.radius = this.settings.bloomRadius;
    this.bloomPass.threshold = this.settings.bloomThreshold;

    this.godRaysMaskShader.uniforms.threshold.value = this.settings.raysThreshold;
    this.godRaysGenShader.uniforms.distanceAttenuation.value = this.settings.raysDistanceAttenuation;
    this.godRaysGenShader.uniforms.maxDensity.value = this.settings.raysMaxDensity;

    this.anamorphicBrightShader.uniforms.threshold.value = this.settings.anamorphicThreshold;
    this.anamorphicBrightShader.uniforms.smoothWidth.value = this.settings.anamorphicSmoothWidth;
    this.anamorphicBlurShader.uniforms.samples.value = this.settings.anamorphicSamples;
    this.anamorphicBlurShader.uniforms.intensity.value = this.settings.anamorphicIntensity;
    this.anamorphicBlurShader.uniforms.tintColor.value.copy(this.settings.anamorphicColor);
    this.anamorphicBlurShader.uniforms.bloomRadius.value = this.settings.anamorphicRadius;

    this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
    this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
    this.finalShader.uniforms.raysEnabled.value = this.settings.raysEnabled && this.moonInFront;
    this.finalShader.uniforms.raysStrength.value = this.settings.raysStrength;
    this.finalShader.uniforms.raysColor.value.copy(this.settings.raysColor);
    this.finalShader.uniforms.anamorphicEnabled.value = this.settings.anamorphicEnabled;
    this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
    this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
    this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;

    this.rgbShader.uniforms.fisheyeStrength.value = this.settings.fisheyeStrength;
    this.rgbShader.uniforms.fisheyeRadius.value = this.settings.fisheyeRadius;
    this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
    this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
    this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
    this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
    this.rgbShader.uniforms.exposure.value = this.settings.exposure;
    this.rgbShader.uniforms.visionMode.value = VISION_MODE_MAP[this.settings.visionMode] ?? 0;
    this.rgbShader.uniforms.thermalSensitivity.value = this.settings.thermalSensitivity;
    this.rgbShader.uniforms.nightVisionGain.value = this.settings.nightVisionGain;
    this.rgbShader.uniforms.nightVisionNoise.value = this.settings.nightVisionNoise;
    this.rgbShader.uniforms.crtIntensity.value = this.settings.crtIntensity;
  }

  setSize(w0, h0, dpr = 1) {
    const w = Math.max(1, Math.floor(w0 * dpr));
    const h = Math.max(1, Math.floor(h0 * dpr));
    this.sceneTarget.setSize(w, h);
    this.finalPass.setSize(w, h);
    this.finalShader.uniforms.resolution.value.set(w, h);
    this.bloomPass.setSize(w, h);

    const grW = Math.max(1, Math.round(w / 2));
    const grH = Math.max(1, Math.round(h / 2));
    this.godRaysMaskPass.setSize(grW, grH);
    this.godRaysPingPong.setSize(grW, grH);

    const anW = Math.max(1, Math.round(w / 4));
    const anH = Math.max(1, Math.round(h / 4));
    this.anamorphicBrightPass.setSize(anW, anH);
    this.anamorphicBlurPass.setSize(anW, anH);
    this.anamorphicBlurShader.uniforms.resolution.value.set(anW, anH);

    this.rgbPass.setSize(w, h);
    this.copyPass.setSize(w, h);
  }

  setMoonScreenPosition(camera, moonWorldPos) {
    if (!this._camDir) {
      this._camDir = new THREE.Vector3();
      this._toMoon = new THREE.Vector3();
      this._ndc = new THREE.Vector3();
    }
    camera.getWorldDirection(this._camDir);
    this._toMoon.copy(moonWorldPos).sub(camera.position).normalize();
    const dot = this._camDir.dot(this._toMoon);

    if (dot <= 0.02) {
      this.moonInFront = false;
      this.finalShader.uniforms.raysEnabled.value = false;
      return;
    }

    this.moonInFront = true;
    const fade = THREE.MathUtils.clamp((dot - 0.02) / 0.15, 0.0, 1.0);
    this._ndc.copy(moonWorldPos).project(camera);
    const screenX = this._ndc.x * 0.5 + 0.5;
    const screenY = this._ndc.y * 0.5 + 0.5;
    const screenZ = fade;

    this.moonScreenPos.set(screenX, screenY, screenZ);
    this.godRaysGenShader.uniforms.vSunPositionScreenSpace.value.set(screenX, screenY, screenZ);
  }

  renderScene(scene, camera) {
    if (!this.settings.enabled) {
      this.renderer.render(scene, camera);
      return;
    }
    this.renderer.setRenderTarget(this.sceneTarget);
    this.renderer.render(scene, camera);
    this.renderer.setRenderTarget(null);
    this.render(this.sceneTarget.texture);
  }

  render(sourceTexture) {
    if (!this.settings.enabled) {
      this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
      this.copyPass.render(this.renderer, true);
      return;
    }

    this.updateSettings();

    this.bloomPass.source = sourceTexture;
    this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
    this.bloomPass.render(this.renderer);

    this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
    this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
    this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
    this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
    this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

    if (this.settings.raysEnabled && this.settings.raysStrength > 0.001 && this.moonInFront) {
      this.godRaysMaskShader.uniforms.inputTexture.value = sourceTexture;
      this.godRaysMaskShader.uniforms.threshold.value = this.settings.raysThreshold;
      this.godRaysMaskPass.render(this.renderer);

      const filterLen = this.settings.raysDensity;
      const tapsPerPass = 6.0;

      this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -1.0);
      this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysMaskPass.texture;
      this.godRaysPingPong.render(this.renderer);

      this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -2.0);
      this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysPingPong.texture;
      this.godRaysPingPong.render(this.renderer);

      this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -3.0);
      this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysPingPong.texture;
      this.godRaysPingPong.render(this.renderer);

      this.finalPass.shader.uniforms.raysTexture.value = this.godRaysPingPong.texture;
      this.finalPass.shader.uniforms.raysEnabled.value = true;
    } else {
      this.finalPass.shader.uniforms.raysEnabled.value = false;
    }

    if (this.settings.anamorphicEnabled && this.settings.anamorphicIntensity > 0.001) {
      this.anamorphicBrightShader.uniforms.inputTexture.value = sourceTexture;
      this.anamorphicBrightShader.uniforms.threshold.value = this.settings.anamorphicThreshold;
      this.anamorphicBrightShader.uniforms.smoothWidth.value = this.settings.anamorphicSmoothWidth;
      this.anamorphicBrightPass.render(this.renderer);

      this.anamorphicBlurShader.uniforms.inputTexture.value = this.anamorphicBrightPass.texture;
      this.anamorphicBlurShader.uniforms.samples.value = this.settings.anamorphicSamples;
      this.anamorphicBlurShader.uniforms.intensity.value = this.settings.anamorphicIntensity;
      this.anamorphicBlurShader.uniforms.tintColor.value.copy(this.settings.anamorphicColor);
      this.anamorphicBlurShader.uniforms.bloomRadius.value = this.settings.anamorphicRadius;
      this.anamorphicBlurPass.render(this.renderer);

      this.finalPass.shader.uniforms.anamorphicTexture.value = this.anamorphicBlurPass.texture;
      this.finalPass.shader.uniforms.anamorphicEnabled.value = true;
    } else {
      this.finalPass.shader.uniforms.anamorphicEnabled.value = false;
    }

    const randomTime = Math.random() * 100000;
    this.finalPass.shader.uniforms.time.value = randomTime;
    this.rgbPass.shader.uniforms.time.value = randomTime;

    this.finalPass.render(this.renderer);
    this.rgbPass.render(this.renderer, true);
  }

  attachGUI(gui, title = "Post-Processing Suite") {
    const root = gui.addFolder(title);
    root.add(this.settings, "enabled").name("Enable Post-Process");

    const vision = root.addFolder("Thermal & Night Vision");
    vision.add(this.settings, "visionMode", Object.keys(VISION_MODE_MAP)).name("Vision Mode").onChange(() => this.updateSettings());
    vision.add(this.settings, "nightVisionGain", 0.5, 5.0, 0.1).name("NVG Gain").onChange(() => this.updateSettings());
    vision.add(this.settings, "nightVisionNoise", 0.0, 0.3, 0.01).name("NVG Noise").onChange(() => this.updateSettings());
    vision.add(this.settings, "thermalSensitivity", 0.5, 3.5, 0.05).name("Thermal Sens").onChange(() => this.updateSettings());
    vision.add(this.settings, "crtIntensity", 0.0, 0.1, 0.005).name("CRT Lines").onChange(() => this.updateSettings());
    vision.close();

    const rays = root.addFolder("Three.js Godrays");
    rays.add(this.settings, "raysEnabled").name("Enable Godrays").onChange(() => this.updateSettings());
    rays.add(this.settings, "raysStrength", 0, 3.0, 0.05).name("Intensity").onChange(() => this.updateSettings());
    rays.add(this.settings, "raysDensity", 0.1, 2.5, 0.05).name("Spread").onChange(() => this.updateSettings());
    rays.add(this.settings, "raysThreshold", 0.0, 0.8, 0.01).name("Threshold").onChange(() => this.updateSettings());
    rays.addColor(this.settings, "raysColorHex").name("Ray Tint").onChange((v) => {
      this.settings.raysColor.set(v);
      this.updateSettings();
    });
    rays.close();

    const anamorphic = root.addFolder("Anamorphic Flare");
    anamorphic.add(this.settings, "anamorphicEnabled").name("Enable Streak").onChange(() => this.updateSettings());
    anamorphic.add(this.settings, "anamorphicIntensity", 0, 10.0, 0.1).name("Intensity").onChange(() => this.updateSettings());
    anamorphic.add(this.settings, "anamorphicThreshold", 0.0, 0.9, 0.01).name("Threshold").onChange(() => this.updateSettings());
    anamorphic.addColor(this.settings, "anamorphicColorHex").name("Tint Color").onChange((v) => {
      this.settings.anamorphicColor.set(v);
      this.updateSettings();
    });
    anamorphic.close();

    const bloom = root.addFolder("Atmospheric Bloom");
    bloom.add(this.settings, "bloomEnabled").name("Enable Bloom").onChange(() => this.updateSettings());
    bloom.add(this.settings, "bloomStrength", 0, 3.0, 0.05).name("Strength").onChange(() => this.updateSettings());
    bloom.add(this.settings, "bloomRadius", 0, 2.0, 0.05).name("Radius").onChange(() => this.updateSettings());
    bloom.add(this.settings, "bloomThreshold", 0, 1.0, 0.01).name("Threshold").onChange(() => this.updateSettings());

    const lens = root.addFolder("Lens & Camera Optics");
    lens.add(this.settings, "fisheyeStrength", -1.0, 1.5, 0.01).name("Fisheye").onChange(() => this.updateSettings());
    lens.add(this.settings, "chromaticAberration", 0, 0.1, 0.002).name("Chromatic Aberr").onChange(() => this.updateSettings());
    lens.add(this.settings, "vignetteBoost", 0, 2.0, 0.05).name("Vignette Boost").onChange(() => this.updateSettings());
    lens.add(this.settings, "vignetteReduction", 0, 2.0, 0.05).name("Vignette Falloff").onChange(() => this.updateSettings());
    lens.add(this.settings, "noiseIntensity", 0, 0.1, 0.005).name("Film Grain").onChange(() => this.updateSettings());
    lens.add(this.settings, "gamma", 0.2, 2.0, 0.05).name("Gamma").onChange(() => this.updateSettings());
    lens.close();

    root.close();
    return root;
  }
}

function create24Palette(colorHexArray) {
  const n = colorHexArray.length;
  const cols = colorHexArray.map(c => new THREE.Color(c));
  const res = [];
  for (let i = 0; i < 24; i++) {
    const t = i / 23;
    const p = t * (n - 1);
    const idx0 = Math.floor(p);
    const idx1 = Math.min(n - 1, idx0 + 1);
    const frac = p - idx0;
    const c = new THREE.Color().copy(cols[idx0]).lerp(cols[idx1], frac);
    res.push(c);
  }
  return res;
}

const SITES = [];

  const v = new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize();

const palVec = COLOR_SCHEMES.Original.colors.map(h => new THREE.Color(h));
const uCam = { value: new THREE.Vector3() };
const uRip = { value: new Float32Array(16) };

const uKeyLightDir = { value: new THREE.Vector3(params.keyLightX, params.keyLightY, params.keyLightZ).normalize() };
const uKeyLightColor = { value: new THREE.Color(params.keyLightColor) };
const uKeyLightIntensity = { value: params.keyLightIntensity };

const uFillLightDir = { value: new THREE.Vector3(params.fillLightX, params.fillLightY, params.fillLightZ).normalize() };
const uFillLightColor = { value: new THREE.Color(params.fillLightColor) };
const uFillLightIntensity = { value: params.fillLightIntensity };

const uExposure = { value: params.exposure };
const uSceneLight = { value: params.sceneLight };
const uAmbientGlow = { value: params.ambientGlow };

const vertGLSL = disp => `
  uniform float uMorph; uniform vec3 uCam; uniform vec3 uL; uniform float uSize; uniform float uFog; uniform float uLight; uniform float uTime;
  uniform vec3 uSites[12]; uniform vec3 uPal[24];
  uniform vec3 uKeyLightDir; uniform vec3 uKeyLightColor; uniform float uKeyLightIntensity;
  uniform vec3 uFillLightDir; uniform vec3 uFillLightColor; uniform float uFillLightIntensity;
  uniform float uAmbientGlow;
  attribute vec3 iPos; attribute vec3 iCol; attribute vec4 iRot; attribute float iShiny; attribute float iScl;
  varying vec3 vCol; varying float vFog; varying float vAlpha;
  #define CYCLE 14.0
  float hash(float x){ return fract(sin(x*12.9898)*43758.5453); }
  vec3 rotv(vec3 v, vec3 ax, float cs, float sn){ return v*cs + cross(ax,v)*sn + ax*dot(ax,v)*(1.0-cs); }
  vec3 palAt(int idx){ vec3 r = vec3(0.0); for(int k=0;k<24;k++){ if(k==idx) r = uPal[k]; } return r; }
  vec3 terr(int site, int pick){
    float phase = uTime/CYCLE + hash(float(site)*7.1);
    float ep = floor(phase), fr = fract(phase);
    int palA = int(floor(hash(float(site)*3.3 + ep*11.7)*8.0));
    int palB = int(floor(hash(float(site)*3.3 + (ep+1.0)*11.7)*8.0));
    return mix(palAt(palA*3+pick), palAt(palB*3+pick), smoothstep(0.65, 1.0, fr));
  }
  ${disp}
  ${disp.includes('float glow')?'':'float glow(vec3 c){ return 0.0; }'}
  void main(){
    vec3 c = mod(iPos - uCam + 0.5*uL, uL) - 0.5*uL + uCam;
    c = displace(c);
    float pr = clamp(uMorph*1.7 - hash(dot(iCol, vec3(91.7, 45.3, 12.9)))*0.7, 0.0, 1.0);
    float mph = pr*pr*(3.0 - 2.0*pr);
    c = mix(c + (iCol - 0.5)*36.0, c, mph);
    float gl = glow(c);
    float ang = iRot.w*uTime + iCol.g*6.2831853 + gl*2.5;
    float cs = cos(ang), sn = sin(ang);
    vec3 p = rotv(position, iRot.xyz, cs, sn) * iScl;
    vec3 dir = normalize(c - uCam);
    float a = uTime*0.02; dir = vec3(dir.x*cos(a)-dir.z*sin(a), dir.y, dir.x*sin(a)+dir.z*cos(a));
    vec3 w1 = vec3(sin(4.1*dir.y + 1.7*dir.z + uTime*0.05), sin(3.7*dir.z + 2.3*dir.x - uTime*0.04), sin(4.3*dir.x + 1.9*dir.y + uTime*0.06));
    vec3 w2 = vec3(sin(9.2*dir.z + 3.1*dir.y), sin(8.7*dir.x + 2.9*dir.z), sin(9.8*dir.y + 3.3*dir.x));
    dir = normalize(dir + 0.30*w1 + 0.12*w2);
    int best = 0, second = 0; float bd = -2.0, sd = -2.0;
    for(int s=0;s<12;s++){ float d = dot(dir, uSites[s]);
      if(d > bd){ sd = bd; second = best; bd = d; best = s; }
      else if(d > sd){ sd = d; second = s; } }
    int pick = iCol.b < 0.6 ? 0 : (iCol.b < 0.9 ? 1 : 2);
    float m = smoothstep(0.0, 0.14, bd - sd);
    vec3 col = mix(mix(terr(second, pick), terr(best, pick), 0.5), terr(best, pick), m);
    vCol = col * uLight + vec3(1.0)*gl*1.3*uAmbientGlow; vAlpha = 0.16 + gl*0.6;
    #ifndef EDGE
      int fid = normal.x>0.5?0 : normal.x<-0.5?1 : normal.y>0.5?2 : normal.y<-0.5?3 : normal.z>0.5?4 : 5;
      float bit = mod(floor(iShiny / pow(2.0, float(fid))), 2.0);
      if(bit > 0.5){
        vec3 n = rotv(normal, iRot.xyz, cs, sn);
        vec3 view = normalize(uCam - (p*uSize + c));
        vec3 r = reflect(-view, n);
        vec3 key = normalize(uKeyLightDir), fill = normalize(uFillLightDir);
        float s1 = pow(max(dot(r, key),0.0), 48.0), s2 = pow(max(dot(r, fill),0.0), 24.0);
        float fres = pow(1.0 - max(dot(n, view),0.0), 3.0);
        vCol = col*0.7 + uKeyLightColor*s1*uKeyLightIntensity + uFillLightColor*s2*uFillLightIntensity + col*fres*0.8;
        vAlpha = 0.6;
      }
    #endif
    vec4 mv = modelViewMatrix * vec4(p*uSize + c, 1.0);
    float d = length(mv.xyz);
    vFog = exp(-uFog*uFog*d*d) * (0.03 + 0.97*mph);
    gl_Position = projectionMatrix * mv;
  }`;

function buildScene(pos, col, rot, shiny, scl, COUNT, Lvec, SIZE, FOG, disp, centerPt) {
  const uMorph = { value: 0, target: 1 };
  const uSizeVal = { value: SIZE };
  const uFogVal = { value: FOG };
  const mk = () => ({
    uMorph, uCam, uL: { value: Lvec }, uSize: uSizeVal, uFog: uFogVal,
    uLight: uSceneLight, uTime: { value: 0 }, uRip, uSites: { value: SITES }, uPal: { value: palVec },
    uKeyLightDir, uKeyLightColor, uKeyLightIntensity,
    uFillLightDir, uFillLightColor, uFillLightIntensity,
    uExposure, uAmbientGlow
  });
  const uFill = mk(), uEdge = mk();

  function instanced(base) {
    const g = new THREE.InstancedBufferGeometry();
    g.index = base.index;
    g.setAttribute('position', base.getAttribute('position'));
    if (base.getAttribute('normal')) g.setAttribute('normal', base.getAttribute('normal'));
    g.setAttribute('iPos', new THREE.InstancedBufferAttribute(pos, 3));
    g.setAttribute('iCol', new THREE.InstancedBufferAttribute(col, 3));
    g.setAttribute('iRot', new THREE.InstancedBufferAttribute(rot, 4));
    g.setAttribute('iShiny', new THREE.InstancedBufferAttribute(shiny, 1));
    g.setAttribute('iScl', new THREE.InstancedBufferAttribute(scl, 1));
    g.instanceCount = COUNT;
    return g;
  }

  const fill = new THREE.Mesh(instanced(new THREE.BoxGeometry(1, 1, 1)), new THREE.ShaderMaterial({
    uniforms: uFill, vertexShader: vertGLSL(disp), transparent: true, depthWrite: false, side: THREE.DoubleSide,
    fragmentShader: `uniform float uExposure; varying vec3 vCol; varying float vFog; varying float vAlpha; void main(){ gl_FragColor = vec4(vCol * uExposure, vAlpha*vFog); }`
  }));

  const edges = new THREE.LineSegments(instanced(new THREE.EdgesGeometry(new THREE.BoxGeometry(1, 1, 1))), new THREE.ShaderMaterial({
    uniforms: uEdge, defines: { EDGE: 1 }, vertexShader: vertGLSL(disp), transparent: true, depthWrite: false,
    fragmentShader: `uniform float uExposure; varying vec3 vCol; varying float vFog; varying float vAlpha; void main(){ gl_FragColor = vec4(vCol * (uExposure * 1.15), 0.7*vFog); }`
  }));

  fill.frustumCulled = edges.frustumCulled = false;
  const grp = new THREE.Group();
  grp.add(fill); grp.add(edges); grp.visible = false;
  scene.add(grp);

  return {
    grp,
    unis: [uFill, uEdge],
    uMorph,
    uSize: uSizeVal,
    uFog: uFogVal,
    baseSize: SIZE,
    baseFog: FOG,
    center: centerPt
  };
}

function fillCommon(i, col, rot, shiny, scl, s) {
  col.set([Math.random(), Math.random(), Math.random()], i * 3);
  const ax = new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize();
  rot.set([ax.x, ax.y, ax.z, (0.3 + Math.random() * 0.7) * (Math.random() < 0.5 ? -1 : 1)], i * 4);
  const f1 = Math.floor(Math.random() * 6);
  let m = 1 << f1;
  if (Math.random() < 0.45) { m |= 1 << ((f1 + 1 + Math.floor(Math.random() * 5)) % 6); }
  shiny[i] = m;
  scl[i] = s;
}

const SCENES = {};
function newBuf(COUNT) {
  return {
    pos: new Float32Array(COUNT * 3),
    col: new Float32Array(COUNT * 3),
    rot: new Float32Array(COUNT * 4),
    shiny: new Float32Array(COUNT),
    scl: new Float32Array(COUNT)
  };
}

// ── 1. CUBE LATTICE ──────────────────────────────
(() => {
  const K = 24, D = 0.9, GAPW = 3 * D, PITCH = K * D + GAPW, M = 2, L = M * PITCH, COUNT = (M * K) ** 3;
  const b = newBuf(COUNT);
  let i = 0;
  for (let bx = 0; bx < M; bx++) for (let by = 0; by < M; by++) for (let bz = 0; bz < M; bz++)
    for (let x = 0; x < K; x++) for (let y = 0; y < K; y++) for (let z = 0; z < K; z++) {

      fillCommon(i, b.col, b.rot, b.shiny, b.scl, 1);
      i++;
    }
  const s = buildScene(b.pos, b.col, b.rot, b.shiny, b.scl, COUNT, new THREE.Vector3(L, L, L), 0.12, 0.062, 'vec3 displace(vec3 c){ return c; }', new THREE.Vector3((K-1)*D/2, (K-1)*D/2, (K-1)*D/2));
  s.speed = 6;
  s.defaultCam = new THREE.Vector3((K-1)*D/2, (K-1)*D/2, (K-1)*D/2 + 20);

})();

// ── 2. DNA HELIX ─────────────────────────────────
(() => {
  const GRID = 5, GAPX = 16, R = 3.0, PITCHZ = 11, TURNS = 8, LZ = TURNS * PITCHZ, LX = GRID * GAPX;
  const PER_TURN = 36, RUNG_N = 9, RUNGS_PER_TURN = 10;
  const COUNT = GRID * GRID * TURNS * (PER_TURN * 2 + RUNGS_PER_TURN * RUNG_N);
  const b = newBuf(COUNT);
  let i = 0;
  for (let gx = 0; gx < GRID; gx++) for (let gy = 0; gy < GRID; gy++) {
    const cx = gx * GAPX, cy = gy * GAPX, ph = Math.random() * 6.283;
    for (let t = 0; t < TURNS; t++) {
      for (let k = 0; k < PER_TURN; k++) {
        const a = ph + (t + k / PER_TURN) * 6.283, z = (t + k / PER_TURN) * PITCHZ;
        b.pos.set([cx + R * Math.cos(a), cy + R * Math.sin(a), z], i * 3); fillCommon(i, b.col, b.rot, b.shiny, b.scl, 0.9 + Math.random() * 0.5); i++;
        b.pos.set([cx - R * Math.cos(a), cy - R * Math.sin(a), z], i * 3); fillCommon(i, b.col, b.rot, b.shiny, b.scl, 0.9 + Math.random() * 0.5); i++;
      }
      for (let r = 0; r < RUNGS_PER_TURN; r++) {
        const a = ph + (t + r / RUNGS_PER_TURN) * 6.283, z = (t + r / RUNGS_PER_TURN) * PITCHZ;
        for (let k = 0; k < RUNG_N; k++) {
          const u = -1 + 2 * (k + 0.5) / RUNG_N;
          b.pos.set([cx + u * R * Math.cos(a), cy + u * R * Math.sin(a), z], i * 3);
          fillCommon(i, b.col, b.rot, b.shiny, b.scl, 0.45 + Math.random() * 0.25);
          i++;
        }
      }
    }
  }
  for (let k = 0; k < COUNT; k++) b.rot[k * 4 + 3] *= 2.2;
  const DNA_DISP = `
  vec3 displace(vec3 c){
    vec2 ctr = floor(c.xy/${GAPX}.0 + 0.5)*${GAPX}.0;
    float sgn = hash(ctr.x*0.37 + ctr.y*0.91) < 0.5 ? -1.0 : 1.0;
    float a = uTime * 0.45 * sgn;
    vec2 d = c.xy - ctr;
    d = vec2(d.x*cos(a) - d.y*sin(a), d.x*sin(a) + d.y*cos(a));
    return vec3(ctr + d, c.z);
  }`;
  const s = buildScene(b.pos, b.col, b.rot, b.shiny, b.scl, COUNT, new THREE.Vector3(LX, LX, LZ), 0.28, 0.028, DNA_DISP, new THREE.Vector3(GAPX * 0.5, GAPX * 0.5, LZ * 0.5));
  s.speed = 6;
  s.defaultCam = new THREE.Vector3(GAPX * 0.5, GAPX * 0.5, 0);
  SCENES['DNA'] = s;
})();

// ── 3. OCEAN WAVES ───────────────────────────────
(() => {
  const NX = 180, NZ = 180, D = 0.85, LX = NX * D, LZ = NZ * D, LAYERS = 2, COUNT = NX * NZ * LAYERS;
  const b = newBuf(COUNT);
  let i = 0;
  for (let l = 0; l < LAYERS; l++) for (let x = 0; x < NX; x++) for (let z = 0; z < NZ; z++) {
    b.pos.set([x * D + (Math.random() - 0.5) * 0.3, -l * 6.0, z * D + (Math.random() - 0.5) * 0.3], i * 3);
    fillCommon(i, b.col, b.rot, b.shiny, b.scl, l == 0 ? 0.8 + Math.random() * 0.6 : 0.4 + Math.random() * 0.3);
    i++;
  }
  const s = buildScene(b.pos, b.col, b.rot, b.shiny, b.scl, COUNT, new THREE.Vector3(LX, 1e4, LZ), 0.26, 0.02, `
  float h2(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
  float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
    return mix(mix(h2(i),h2(i+vec2(1,0)),f.x), mix(h2(i+vec2(0,1)),h2(i+vec2(1,1)),f.x), f.y); }
  #define GW(A,LEN,DX,DZ,SP,Q) { vec2 k=normalize(vec2(DX,DZ)); float w=6.2831853/LEN; float ph=w*dot(k,xz)+SP*uTime; \
    float amp=A*env; q.xz += Q*amp*k*cos(ph); q.y += amp*sin(ph); }
  vec3 displace(vec3 c){
    vec3 q = c; vec2 xz = c.xz;
    float env = 0.45 + 1.0*vnoise(xz*0.03 + uTime*0.012);
    env *= (c.y < -3.0 ? 0.45 : 1.0);
    GW(1.3, 36.0,  1.0, 0.25, 0.75, 0.9)
    GW(0.85,22.0,  0.75,0.65, 1.0,  0.85)
    GW(0.6, 14.0,  1.0,-0.45, 1.35, 0.8)
    GW(0.35, 8.5,  0.3, 1.0,  1.8,  0.7)
    GW(0.22, 5.2, -0.55,0.8,  2.4,  0.6)
    GW(0.13, 3.1,  0.9,-0.9,  3.2,  0.5)
    GW(0.07, 1.9, -0.2,-1.0,  4.2,  0.4)
    q.y += 0.25*vnoise(xz*0.12 - uTime*0.05);
    return q;
  }`, new THREE.Vector3(0, 0, 0));
  s.speed = 5;
  s.defaultCam = new THREE.Vector3(0, 4.6, 18);
  SCENES['WAVES'] = s;
})();

// ── 4. DROPLETS ──────────────────────────────────
(() => {
  const G = 4, SP = 20, L = G * SP;
  const cells = [];
  for (let x = 0; x < G; x++) for (let y = 0; y < G; y++) for (let z = 0; z < G; z++) if (Math.random() < 0.62) cells.push([x, y, z]);
  const PER = 720, COUNT = cells.length * PER;
  const b = newBuf(COUNT);
  let i = 0;
  for (const [x, y, z] of cells) {
    const cx = x * SP, cy = y * SP, cz = z * SP, R = 3.0 + Math.random() * 3.2;
    for (let k = 0; k < PER; k++) {
      const v = new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize();
      const r = R * Math.pow(Math.random(), 0.45);
      b.pos.set([cx + v.x * r, cy + v.y * r, cz + v.z * r], i * 3);
      fillCommon(i, b.col, b.rot, b.shiny, b.scl, 0.7 + Math.random() * 0.8);
      i++;
    }
  }
  const DROP = `
  vec3 displace(vec3 c){
    vec3 ctr = floor(c/${SP}.0 + 0.5)*${SP}.0;
    float h  = hash(ctr.x*0.31 + ctr.y*0.57 + ctr.z*0.83);
    float h2 = fract(h*13.73), h3 = fract(h*57.31);
    vec3 r = c - ctr; float d = length(r); vec3 n = r/max(d,1e-3);
    float a = uTime*(0.06 + 0.1*h); vec3 ax = normalize(vec3(h-0.5, 0.7, h2-0.5));
    r = rotv(r, ax, cos(a), sin(a)); n = rotv(n, ax, cos(a), sin(a));
    vec3 e = normalize(vec3(sin(uTime*0.11 + h*6.28), cos(uTime*0.09 + h2*6.28), sin(uTime*0.13 + h3*6.28)));
    float ne = dot(n, e);
    float w = 1.0
      + (0.20 + 0.28*h2)*sin(2.0*n.x + 3.0*n.y + uTime*0.9 + h*6.28)
      + (0.15 + 0.22*h3)*sin(3.0*n.z - 2.0*n.x + uTime*1.3 + h*3.1)
      + 0.10*sin(4.0*n.y + 2.5*n.z + uTime*1.8 + h*9.4)
      + (0.25 + 0.45*h3)*ne*ne;
    w = max(w, 0.25);
    vec3 drift = ${SP}.0*0.42*vec3(sin(uTime*0.12 + h*6.28), sin(uTime*0.10 + h2*6.28), sin(uTime*0.15 + h3*6.28));
    return ctr + r*w + drift;
  }`;
  const s = buildScene(b.pos, b.col, b.rot, b.shiny, b.scl, COUNT, new THREE.Vector3(L, L, L), 0.22, 0.03, DROP, new THREE.Vector3(SP * 0.5, SP * 0.5, SP * 0.5));
  s.speed = 3;
  s.defaultCam = new THREE.Vector3(SP * 0.5, SP * 0.5, SP * 0.5 + 24);
  SCENES['DROPLETS'] = s;
})();

// ── 5. FLOW ──────────────────────────────────────
(() => {
  const L = 60, COUNT = 36000;
  const b = newBuf(COUNT);
  for (let i = 0; i < COUNT; i++) {
    b.pos.set([Math.random() * L, Math.random() * L, Math.random() * L], i * 3);
    fillCommon(i, b.col, b.rot, b.shiny, b.scl, 0.6 + Math.random() * 0.9);
  }
  const FLOW = `
  vec3 curlField(vec3 p, float t){
    vec3 a = vec3(sin(1.3*p.y + 0.7*p.z + t), sin(1.1*p.z + 0.9*p.x - 0.8*t), sin(0.8*p.x + 1.2*p.y + 0.6*t));
    vec3 da = vec3(cos(1.3*p.y + 0.7*p.z + t), cos(1.1*p.z + 0.9*p.x - 0.8*t), cos(0.8*p.x + 1.2*p.y + 0.6*t));
    return vec3(1.2*da.z - 1.1*da.y, 0.7*da.x - 0.8*da.z, 0.9*da.y - 1.3*da.x);
  }
  vec3 displace(vec3 c){
    vec3 p = c*0.07;
    vec3 v = curlField(p, uTime*0.25) + 0.5*curlField(p*2.3 + 7.0, uTime*0.4);
    return c + v*3.2;
  }`;
  const s = buildScene(b.pos, b.col, b.rot, b.shiny, b.scl, COUNT, new THREE.Vector3(L, L, L), 0.2, 0.04, FLOW, new THREE.Vector3(L / 2, L / 2, L / 2));
  s.speed = 3;
  s.defaultCam = new THREE.Vector3(L / 2, L / 2, L / 2 + 25);
  SCENES['FLOW'] = s;
})();

// =========================================================================================
// AUDIO SYSTEM (Ambient Web Audio Synthesizer)
// =========================================================================================
const AC = window.AudioContext || window.webkitAudioContext;
let ac = null, master = null, verb = null, dry = null, soundOn = false, musicWorld = null, nextT = 0, schedTimer = null;

function audioInit() {
  if (ac) return;
  ac = new AC();
  master = ac.createGain();
  master.gain.value = 0;
  master.connect(ac.destination);
  dry = ac.createGain();
  dry.gain.value = 0.6;
  dry.connect(master);
  const len = ac.sampleRate * 4.5, ir = ac.createBuffer(2, len, ac.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = ir.getChannelData(ch);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2);
  }
  verb = ac.createConvolver();
  verb.buffer = ir;
  const wet = ac.createGain();
  wet.gain.value = 0.7;
  verb.connect(wet);
  wet.connect(master);
  schedTimer = setInterval(schedule, 120);
}

const bus = {};
function worldBus(name) {
  if (!bus[name]) {
    const g = ac.createGain();
    g.gain.value = 0;
    g.connect(dry);
    g.connect(verb);
    bus[name] = g;
  }
  return bus[name];
}

const R = (a, b) => a + Math.random() * (b - a), pick = a => a[Math.floor(Math.random() * a.length)];
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

function tone(g, freq, t, dur, { type = 'sine', vol = 0.2, lp = 4000, atk = 0.02, glide = null, detune = 0 } = {}) {
  const o = ac.createOscillator(), f = ac.createBiquadFilter(), e = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(glide ? freq * glide : freq, t);
  if (glide) o.frequency.exponentialRampToValueAtTime(freq, t + 0.07);
  o.detune.value = detune;
  f.type = 'lowpass';
  f.frequency.value = lp;
  e.gain.setValueAtTime(0, t);
  e.gain.linearRampToValueAtTime(vol, t + atk);
  e.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  o.connect(f); f.connect(e); e.connect(g);
  o.start(t); o.stop(t + dur + 0.05);
}

function pad(g, freqs, t, dur, vol = 0.05, lp = 900) {
  for (const fq of freqs) {
    tone(g, fq, t, dur, { type: 'triangle', vol, lp, atk: dur * 0.4 });
    tone(g, fq, t, dur, { type: 'sine', vol: vol * 0.7, lp, atk: dur * 0.4, detune: 6 });
  }
}

const MUSIC = {
  LATTICE: {
    bar: 2.4,
    play(g, t) {
      const sc = [72, 74, 76, 79, 81, 84, 86, 88];
      for (let i = 0; i < 3; i++) if (Math.random() < 0.75) {
        const st = t + R(0, 2.2), m = pick(sc);
        tone(g, mtof(m), st, 3.5, { vol: 0.10, lp: 6000 });
        tone(g, mtof(m) * 2, st, 1.2, { vol: 0.03, lp: 8000 });
      }
      if (Math.random() < 0.4) pad(g, [mtof(48), mtof(55), mtof(64)], t, 6, 0.035);
    }
  },
  DNA: {
    bar: 3.43,
    play(g, t) {
      const step = 3.43 / 8;
      for (let i = 0; i < 8; i++) {
        if (i == 3 || i == 7) continue;
        tone(g, mtof(i % 4 == 0 ? 38 : 50), t + i * step, 0.34, { type: 'sine', vol: i % 4 == 0 ? 0.16 : 0.07, lp: 400, atk: 0.005 });
        tone(g, mtof(62), t + i * step, 0.09, { type: 'square', vol: 0.012, lp: 1800, atk: 0.002 });
      }
      pad(g, [mtof(50), mtof(53), mtof(57), mtof(64)], t, 7, 0.028, 420);
      if (Math.random() < 0.55) tone(g, mtof(pick([86, 89, 93, 96])), t + R(0.5, 3), 2.5, { vol: 0.035, lp: 9000, atk: 0.01 });
      if (Math.random() < 0.3) tone(g, mtof(26), t, 3.4, { type: 'triangle', vol: 0.10, lp: 160, atk: 0.3 });
    }
  },
  WAVES: {
    bar: 6.0,
    play(g, t) {
      const n = ac.createBufferSource(), len = ac.sampleRate * 6, b = ac.createBuffer(1, len, ac.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      n.buffer = b;
      const f = ac.createBiquadFilter();
      f.type = 'lowpass';
      f.Q.value = 0.7;
      f.frequency.setValueAtTime(220, t);
      f.frequency.linearRampToValueAtTime(1400, t + 2.6);
      f.frequency.linearRampToValueAtTime(200, t + 6);
      const e = ac.createGain();
      e.gain.setValueAtTime(0.0001, t);
      e.gain.exponentialRampToValueAtTime(0.16, t + 2.4);
      e.gain.exponentialRampToValueAtTime(0.0001, t + 6);
      n.connect(f); f.connect(e); e.connect(g);
      n.start(t); n.stop(t + 6.1);
      pad(g, [mtof(38), mtof(45), mtof(50)], t, 8, 0.05, 700);
      if (Math.random() < 0.5) tone(g, mtof(pick([74, 77, 81])), t + R(1, 4), 3, { vol: 0.05, lp: 5000 });
    }
  },
  DROPLETS: {
    bar: 2.0,
    play(g, t) {
      const sc = [77, 79, 81, 84, 86, 89, 91];
      const n = 2 + Math.floor(Math.random() * 4);
      for (let i = 0; i < n; i++) {
        tone(g, mtof(pick(sc)), t + R(0, 1.9), 0.9, { vol: 0.12, lp: 7000, atk: 0.004, glide: 1.6 });
      }
      if (Math.random() < 0.35) pad(g, [mtof(41), mtof(48), mtof(53)], t, 7, 0.03, 600);
    }
  },
  FLOW: {
    bar: 8.0,
    play(g, t) {
      for (const [m, dt] of [[40, -7], [40, 7], [47, 0], [52, -4], [59, 5]]) {
        tone(g, mtof(m), t, 9.5, { type: 'sawtooth', vol: 0.035, lp: 520, atk: 3.5, detune: dt });
      }
      if (Math.random() < 0.6) tone(g, mtof(pick([64, 67, 71, 74])), t + R(2, 6), 4, { vol: 0.05, lp: 3000, atk: 0.8 });
    }
  }
};

function schedule() {
  if (!soundOn || !musicWorld || !ac) return;
  const now = ac.currentTime, m = MUSIC[musicWorld];
  if (!m) return;
  if (nextT < now) nextT = now + 0.05;
  while (nextT < now + 0.6) {
    m.play(worldBus(musicWorld), nextT);
    nextT += m.bar;
  }
}

function musicSwitch(name) {
  musicWorld = name;
  if (!ac) return;
  const t = ac.currentTime;
  for (const k in bus) bus[k].gain.setTargetAtTime(k === name ? 1 : 0, t, 0.9);
  worldBus(name).gain.setTargetAtTime(1, t, 0.9);
  nextT = 0;
}

function toggleSound(forceState) {
  audioInit();
  ac.resume();
  soundOn = forceState !== undefined ? forceState : !soundOn;
  params.sound = soundOn;
  master.gain.setTargetAtTime(soundOn ? 0.5 : 0, ac.currentTime, 0.4);
  if (soundOn) musicSwitch(musicWorld || params.world);
  const sndBtn = document.querySelector('#ui .snd');
  if (sndBtn) sndBtn.classList.toggle('on', soundOn);
}

let active = null;

function show(name) {
  const prev = active;
  active = SCENES[name];
  if (!active) return;
  params.world = name;

  for (const [k, sc] of Object.entries(SCENES)) {
    if (k === name) {
      sc.grp.visible = true;
      sc.uMorph.value = 0;
      sc.uMorph.target = 1;
    } else {
      sc.uMorph.target = 0;
    }
  }

  if (active.center) {
    controls.target.copy(active.center);
    if (!prev) {
      camera.position.copy(active.defaultCam || new THREE.Vector3(0, 5, 25));
    }
    controls.update();
  }

  musicSwitch(name);
  document.querySelectorAll('#ui .row:first-child button').forEach(b => b.classList.toggle('on', b.dataset.n === name));
}

function setGreenScreen(enabled) {
  params.greenScreen = enabled;
  const bgHex = enabled ? '#00ff00' : (COLOR_SCHEMES[params.colorScheme]?.bg || params.bgColor || '#000000');
  scene.background.set(bgHex);
  renderer.setClearColor(bgHex, 1.0);
  document.body.style.backgroundColor = bgHex;

  if (postProcessor) {
    if (enabled) {
      postProcessor.settings.vignetteBoost = 1.0;
      postProcessor.settings.vignetteReduction = 0.0;
      postProcessor.settings.noiseIntensity = 0.0;
      postProcessor.settings.chromaticAberration = 0.0;
    } else {
      postProcessor.settings.vignetteBoost = 1.05;
      postProcessor.settings.vignetteReduction = 0.45;
      postProcessor.settings.noiseIntensity = 0.01;
      postProcessor.settings.chromaticAberration = 0.012;
    }
    postProcessor.updateSettings();
  }
}

function applyColorScheme(name) {
  const scheme = COLOR_SCHEMES[name];
  if (!scheme) return;
  params.colorScheme = name;

  if (scheme.channels) {
    params.color1 = scheme.channels[0];
    params.color2 = scheme.channels[1];
    params.color3 = scheme.channels[2];
    params.color4 = scheme.channels[3];
    params.color5 = scheme.channels[4];
    params.bgColor = scheme.bg;
  }

  if (scheme.colors) {
    for (let k = 0; k < 24; k++) {
      palVec[k].setHex(scheme.colors[k]);
    }
  } else {
    const colors = create24Palette([params.color1, params.color2, params.color3, params.color4, params.color5]);
    for (let k = 0; k < 24; k++) {
      palVec[k].copy(colors[k]);
    }
  }

  const bgHex = params.greenScreen ? '#00ff00' : params.bgColor;
  scene.background.set(bgHex);
  renderer.setClearColor(bgHex, 1.0);
  document.body.style.backgroundColor = bgHex;
  const isLight = new THREE.Color(bgHex).getHSL({ h: 0, s: 0, l: 0 }).l > 0.5;
  document.body.classList.toggle('light', isLight);
}

function updateCustomColors() {
  params.colorScheme = 'Custom';
  const colors = create24Palette([params.color1, params.color2, params.color3, params.color4, params.color5]);
  for (let k = 0; k < 24; k++) {
    palVec[k].copy(colors[k]);
  }
  const bgHex = params.greenScreen ? '#00ff00' : params.bgColor;
  scene.background.set(bgHex);
  renderer.setClearColor(bgHex, 1.0);
  document.body.style.backgroundColor = bgHex;
  const isLight = new THREE.Color(bgHex).getHSL({ h: 0, s: 0, l: 0 }).l > 0.5;
  document.body.classList.toggle('light', isLight);
}

function updateLighting() {
  uExposure.value = params.exposure;
  uSceneLight.value = params.sceneLight;
  uAmbientGlow.value = params.ambientGlow;

  uKeyLightIntensity.value = params.keyLightIntensity;
  uKeyLightColor.value.set(params.keyLightColor);
  uKeyLightDir.value.set(params.keyLightX, params.keyLightY, params.keyLightZ).normalize();

  uFillLightIntensity.value = params.fillLightIntensity;

// ── Rebuild renderer for antialias toggle ──
function rebuildRenderer(antialiasVal) {
  const oldCanvas = renderer.domElement;
  const parent = oldCanvas.parentNode;
  renderer.dispose();
  renderer = new THREE.WebGLRenderer({ antialias: antialiasVal, powerPreference: 'high-performance' });
  renderer.setPixelRatio(params.dpr);
  renderer.setSize(window.innerWidth, window.innerHeight);
  const bgHex = params.greenScreen ? 0x00ff00 : (scene.background ? scene.background : 0x000000);
  renderer.setClearColor(bgHex, 1.0);
  parent.replaceChild(renderer.domElement, oldCanvas);

  controls.dispose();
  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.enableZoom = true;
  controls.enablePan = true;
  controls.minDistance = 0.5;
  controls.maxDistance = 160;
  updateDragMode();

  postProcessor.renderer = renderer;
  postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);

  setupCanvasEvents(renderer.domElement);
}

function setupCanvasEvents(domEl) {
  let pStartX = 0, pStartY = 0, pStartTime = 0;

  domEl.addEventListener('pointerdown', e => {
    pStartX = e.clientX;
    pStartY = e.clientY;
    pStartTime = performance.now();
  });

  domEl.addEventListener('pointerup', e => {
    const dist = Math.hypot(e.clientX - pStartX, e.clientY - pStartY);
    const dur = performance.now() - pStartTime;
    if (dist < 6 && dur < 350) {
      if (params.clickToRandomize) {
        randomizeScene();
      }
    }
  });
}

// =========================================================================================
// CAMERA ANIMATION CONTROLLER
// =========================================================================================
function updateCameraAnimation(t, scaledDt) {
  if (!active) return;
  const preset = params.animationPreset;

  if (preset === 'Static (No Camera Movement)') {
    controls.autoRotate = false;
    return;
  }

  if (preset === 'Slow Cosmic Orbit') {
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.5 * params.animationSpeed;
    return;
  } else {
    controls.autoRotate = false;
  }

  if (preset === 'Gentle Forward Drift') {
    const dir = new THREE.Vector3();
    camera.getWorldDirection(dir);
    const move = dir.multiplyScalar(2.0 * scaledDt);
    camera.position.add(move);
    controls.target.add(move);
  } else if (preset === 'Smooth Corkscrew Spiral') {
    const dir = new THREE.Vector3();
    camera.getWorldDirection(dir);
    const move = dir.multiplyScalar(1.2 * scaledDt);
    camera.position.add(move);
    controls.target.add(move);
    camera.position.y += Math.sin(t * 0.4) * 0.04;
    controls.target.y += Math.sin(t * 0.4) * 0.02;
    const offset = camera.position.clone().sub(controls.target);
    offset.applyAxisAngle(new THREE.Vector3(0, 1, 0), 0.15 * scaledDt);
    camera.position.copy(controls.target).add(offset);
  } else if (preset === 'Floating Horizon Sway') {
    const swayX = Math.sin(t * 0.25) * 0.03;
    const swayY = Math.cos(t * 0.35) * 0.02;
    camera.position.x += swayX;
    camera.position.y += swayY;
    controls.target.x += swayX * 0.8;
    controls.target.y += swayY * 0.8;
  } else if (preset === 'Deep Infinity Dive') {
    const dir = new THREE.Vector3();
    camera.getWorldDirection(dir);
    const breath = Math.sin(t * 0.3) * 2.2 * scaledDt;
    camera.position.addScaledVector(dir, breath);
    controls.target.addScaledVector(dir, breath);
  } else if (preset === 'Zenith Lissajous Weave') {
    const lx = Math.sin(t * 0.18) * 0.04;
    const ly = Math.sin(t * 0.28) * 0.03;
    const lz = Math.cos(t * 0.15) * 0.03;
    camera.position.x += lx;
    camera.position.y += ly;
    camera.position.z += lz;
    controls.target.x += lx * 0.5;
    controls.target.y += ly * 0.5;
    controls.target.z += lz * 0.5;
  } else if (preset === 'Diagonal Space Glide') {
    const diag = new THREE.Vector3(1, 0.35, 1).normalize();
    const move = diag.multiplyScalar(1.5 * scaledDt);
    camera.position.add(move);
    controls.target.add(move);
  }
}

// =========================================================================================
// MAIN INFINITE ANIMATION LOOP
// =========================================================================================
show('FLOW');
applyColorScheme('Original');
updateLighting();
updateDragMode();

const clock = new THREE.Clock();
let elapsedTime = 0;

function tick() {
  requestAnimationFrame(tick);
  const rawDt = Math.min(clock.getDelta(), 0.05);
  const scaledDt = rawDt * params.animationSpeed;
  elapsedTime += scaledDt;

  controls.update();
  updateCameraAnimation(elapsedTime, scaledDt);

  uCam.value.copy(camera.position);
  for (const sc of Object.values(SCENES)) {
    if (!sc.grp.visible) continue;
    sc.uMorph.value += (sc.uMorph.target - sc.uMorph.value) * Math.min(1, scaledDt * 2.0);
    if (sc.uMorph.target === 0 && sc.uMorph.value < 0.02) sc.grp.visible = false;
    for (const u of sc.unis) u.uTime.value = elapsedTime;
  }

  if (soundOn && musicWorld && ac) {
    schedule();
  }

  if (postProcessor) {
    postProcessor.setMoonScreenPosition(camera, controls.target);
    postProcessor.renderScene(scene, camera);
  } else {
    renderer.render(scene, camera);
  }
}

tick();
</script>
