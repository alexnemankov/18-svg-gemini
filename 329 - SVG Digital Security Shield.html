<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Security Shield with Hexagonal Force Field</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #020912;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #viewport-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
    }
    #viewport-wrapper.grabbing {
      cursor: grabbing;
    }
    svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }
    .hud-text {
      font-family: 'Courier New', Courier, monospace;
      font-size: 10px;
      letter-spacing: 1.5px;
      font-weight: 600;
      text-shadow: 0 0 4px currentColor;
    }
  </style>
</head>
<body>
  <div id="viewport-wrapper">
    <svg id="shield-svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet">
      <defs>
        <!-- Atmospheric and Shield Gradients -->
        <radialGradient id="bg-ambient-grad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.18" id="stop-bg-amb-1" />
          <stop offset="60%" stop-color="#0088cc" stop-opacity="0.05" id="stop-bg-amb-2" />
          <stop offset="100%" stop-color="#000000" stop-opacity="0" id="stop-bg-amb-3" />
        </radialGradient>

        <linearGradient id="shield-stroke-grad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#00f0ff" id="stop-shield-str-1" />
          <stop offset="50%" stop-color="#b3f7ff" id="stop-shield-str-2" />
          <stop offset="100%" stop-color="#0088cc" id="stop-shield-str-3" />
        </linearGradient>

        <radialGradient id="shield-surface-grad" cx="50%" cy="45%" r="60%">
          <stop offset="0%" stop-color="#002838" stop-opacity="0.85" id="stop-shield-surf-1" />
          <stop offset="70%" stop-color="#020912" stop-opacity="0.95" id="stop-shield-surf-2" />
          <stop offset="100%" stop-color="#000000" stop-opacity="0.98" id="stop-shield-surf-3" />
        </radialGradient>

        <radialGradient id="core-glow-grad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#b3f7ff" stop-opacity="0.9" id="stop-core-1" />
          <stop offset="40%" stop-color="#00f0ff" stop-opacity="0.5" id="stop-core-2" />
          <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" id="stop-core-3" />
        </radialGradient>

        <linearGradient id="radar-beam-grad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.35" id="stop-radar-1" />
          <stop offset="70%" stop-color="#00f0ff" stop-opacity="0.08" id="stop-radar-2" />
          <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" id="stop-radar-3" />
        </linearGradient>

        <radialGradient id="solar-corona-grad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ffdf79" stop-opacity="0.8" id="stop-corona-1" />
          <stop offset="35%" stop-color="#f6aa1c" stop-opacity="0.4" id="stop-corona-2" />
          <stop offset="75%" stop-color="#bc3908" stop-opacity="0.15" id="stop-corona-3" />
          <stop offset="100%" stop-color="#220901" stop-opacity="0" />
        </radialGradient>

        <!-- Precision Vector Glow Filters -->
        <filter id="soft-glow" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur" />
          <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>

        <filter id="high-glow" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur1" />
          <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="blur2" />
          <feGaussianBlur in="SourceGraphic" stdDeviation="15" result="blur3" />
          <feMerge>
            <feMergeNode in="blur3" />
            <feMergeNode in="blur2" />
            <feMergeNode in="blur1" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
      </defs>

      <!-- Full Background Layer -->
      <rect id="bg-rect" x="0" y="0" width="1000" height="1000" fill="#020912" />

      <!-- Interactive Scene World (Camera / Pan / Zoom Rig) -->
      <g id="world-rig">
        <!-- Ambient Bloom / Core Spotlight -->
        <circle id="bg-ambient-orb" cx="500" cy="485" r="480" fill="url(#bg-ambient-grad)" />

        <!-- Mythic / Solar Aegis Corona Ray Flare Layer -->
        <g id="solar-corona-layer" opacity="0" style="display: none;">
          <circle cx="500" cy="485" r="450" fill="url(#solar-corona-grad)" opacity="0.6" />
          <g id="solar-rays-group"></g>
        </g>

        <!-- Tactical HUD Circular Coordinates & Angle Marks -->
        <g id="hud-tactical-layer">
          <circle id="hud-ring-outer" cx="500" cy="485" r="455" fill="none" stroke="#0088cc" stroke-width="0.8" stroke-dasharray="4 8" opacity="0.4" />
          <circle id="hud-ring-mid" cx="500" cy="485" r="375" fill="none" stroke="#00f0ff" stroke-width="0.6" stroke-dasharray="12 6 2 6" opacity="0.35" />
          <circle id="hud-ring-inner" cx="500" cy="485" r="280" fill="none" stroke="#0088cc" stroke-width="0.5" stroke-dasharray="2 6" opacity="0.3" />
          <g id="hud-tick-marks" opacity="0.35"></g>
        </g>

        <!-- Aegis Tactical Defense Telemetry & Directional Intercept Arcs -->
        <g id="aegis-telemetry-layer" opacity="0" style="display: none;">
          <!-- Bearing Indicators -->
          <text x="500" y="24" text-anchor="middle" fill="#ffcc00" class="hud-text">360° N // POLAR</text>
          <text x="975" y="488" text-anchor="end" fill="#ffcc00" class="hud-text">090° E</text>
          <text x="500" y="965" text-anchor="middle" fill="#ffcc00" class="hud-text">180° S // PERIMETER</text>
          <text x="25" y="488" text-anchor="start" fill="#ffcc00" class="hud-text">270° W</text>

          <!-- Telemetry Data Blocks -->
          <g transform="translate(60, 80)">
            <rect x="0" y="0" width="165" height="42" fill="#060b13" fill-opacity="0.75" stroke="#ffcc00" stroke-width="0.8" />
            <text x="8" y="16" fill="#ffcc00" class="hud-text">SEC-01 // 38°53'N</text>
            <text x="8" y="32" fill="#5a8fb8" class="hud-text">DEFCON 2 // C2 SYS</text>
          </g>
          <g transform="translate(775, 80)">
            <rect x="0" y="0" width="165" height="42" fill="#060b13" fill-opacity="0.75" stroke="#ffcc00" stroke-width="0.8" />
            <text x="8" y="16" fill="#ffcc00" class="hud-text">AZIMUTH: 184.2°</text>
            <text x="8" y="32" fill="#5a8fb8" class="hud-text">TRACK: INTERCEPT</text>
          </g>
          <g transform="translate(60, 880)">
            <rect x="0" y="0" width="165" height="34" fill="#060b13" fill-opacity="0.75" stroke="#ffcc00" stroke-width="0.8" />
            <text x="8" y="22" fill="#ffcc00" class="hud-text">RADAR: ACTIVE SWEEP</text>
          </g>
          <g transform="translate(775, 880)">
            <rect x="0" y="0" width="165" height="34" fill="#060b13" fill-opacity="0.75" stroke="#ffcc00" stroke-width="0.8" />
            <text x="8" y="22" fill="#5a8fb8" class="hud-text">AEGIS GRID: 44-X</text>
          </g>

          <!-- Intercept Sweep Arcs and Missile Lock Reticles -->
          <circle cx="500" cy="485" r="410" fill="none" stroke="#ffcc00" stroke-width="1.2" stroke-dasharray="80 120 40 80" opacity="0.6" />
          <g id="aegis-tracking-reticle" transform="translate(720, 310)">
            <circle cx="0" cy="0" r="14" fill="none" stroke="#ffcc00" stroke-width="1.2" stroke-dasharray="4 2" />
            <line x1="-18" y1="0" x2="18" y2="0" stroke="#ffcc00" stroke-width="1" />
            <line x1="0" y1="-18" x2="0" y2="18" stroke="#ffcc00" stroke-width="1" />
          </g>
        </g>

        <!-- CAD Blueprint Precision Alignment Reticles -->
        <g id="cad-reticles-layer" opacity="0" style="display: none;">
          <line x1="100" y1="485" x2="900" y2="485" stroke="#475569" stroke-width="0.6" stroke-dasharray="8 4 2 4" opacity="0.5" />
          <line x1="500" y1="85" x2="500" y2="885" stroke="#475569" stroke-width="0.6" stroke-dasharray="8 4 2 4" opacity="0.5" />
          <g id="cad-crosshairs-group"></g>
          <!-- Blueprint Dimension Callout Lines -->
          <path d="M 330 270 L 330 250 H 670 L 670 270" fill="none" stroke="#00f0ff" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.7" />
          <text x="500" y="244" text-anchor="middle" fill="#00f0ff" class="hud-text">WIDTH: 340.00 MM [TOL ±0.05]</text>
        </g>

        <!-- Concentric Expanding Shockwaves -->
        <g id="shockwave-layer"></g>

        <!-- Geometric Hexagonal Honeycomb Force Field -->
        <g id="forcefield-lattice-layer">
          <g id="hex-cells-group"></g>
          <g id="hex-edges-group"></g>
          <g id="hex-nodes-group"></g>
        </g>

        <!-- Radar Sweep Scanner Beam -->
        <g id="radar-layer">
          <path id="radar-sweep-beam" fill="url(#radar-beam-grad)" opacity="0.75" />
        </g>

        <!-- Digital Security Shield -->
        <g id="shield-master-group">
          <!-- Black-ICE Chromatic Dispersion Dual Aura -->
          <g id="blackice-dispersion-layer" opacity="0" style="display: none;">
            <path id="blackice-cyan-aura" fill="none" stroke="#00f0ff" stroke-width="6" opacity="0.55" filter="url(#soft-glow)" transform="translate(-3, 0)" />
            <path id="blackice-magenta-aura" fill="none" stroke="#ff007f" stroke-width="6" opacity="0.55" filter="url(#soft-glow)" transform="translate(3, 0)" />
          </g>

          <!-- Outer Silhouette Intense Glow Aura -->
          <path id="shield-aura-path" fill="none" stroke="#00f0ff" stroke-width="8" opacity="0.4" filter="url(#high-glow)" />

          <!-- Solid Defense Body Surface Fill -->
          <path id="shield-surface-path" fill="url(#shield-surface-grad)" stroke="none" />

          <!-- Outer Defense Contour Armor Rim -->
          <path id="shield-outer-path" fill="none" stroke="url(#shield-stroke-grad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft-glow)" />

          <!-- Inner Defense Border with Segmented Energy Flow -->
          <path id="shield-inner-path" fill="none" stroke="#00f0ff" stroke-width="1.8" stroke-dasharray="35 8 10 8" stroke-linecap="round" opacity="0.85" />

          <!-- Shield Edge Tech Brackets and Alignment Hashes -->
          <g id="shield-tactical-brackets"></g>

          <!-- Cyber Bus Circuit Traces -->
          <g id="shield-circuit-traces">
            <!-- Left Horizontal Bus -->
            <path id="circuit-bus-l1" d="M 458 485 H 410 L 388 463 H 368" fill="none" stroke="#0088cc" stroke-width="1.6" stroke-dasharray="6 3" />
            <!-- Right Horizontal Bus -->
            <path id="circuit-bus-r1" d="M 542 485 H 590 L 612 463 H 632" fill="none" stroke="#0088cc" stroke-width="1.6" stroke-dasharray="6 3" />
            <!-- Lower Left Diagonal Bus -->
            <path id="circuit-bus-l2" d="M 470 515 L 435 555 H 405" fill="none" stroke="#0088cc" stroke-width="1.4" stroke-dasharray="8 4" />
            <!-- Lower Right Diagonal Bus -->
            <path id="circuit-bus-r2" d="M 530 515 L 565 555 H 595" fill="none" stroke="#0088cc" stroke-width="1.4" stroke-dasharray="8 4" />
            <!-- Top Vertical Feeder -->
            <path id="circuit-bus-top" d="M 500 425 V 378 L 485 363" fill="none" stroke="#0088cc" stroke-width="1.4" stroke-dasharray="5 3" />
            <!-- Bottom Vertical Drain -->
            <path id="circuit-bus-bottom" d="M 500 540 V 610 L 515 625" fill="none" stroke="#0088cc" stroke-width="1.4" stroke-dasharray="5 3" />
          </g>

          <!-- Central Security Lock / Core Emblem -->
          <g id="shield-core-emblem">
            <!-- Outer Core Hexagonal Reticle -->
            <polygon id="core-hex-frame" points="500,432 546,458.5 546,511.5 500,538 454,511.5 454,458.5" fill="#020912" stroke="#00f0ff" stroke-width="2.2" filter="url(#soft-glow)" />

            <!-- Core Radial Energy Flare Orb -->
            <circle id="core-energy-orb" cx="500" cy="485" r="38" fill="url(#core-glow-grad)" />

            <!-- High-Tech Security Padlock Shackle -->
            <path id="lock-shackle" d="M 480 468 V 445 C 480 430 520 430 520 445 V 468" fill="none" stroke="#b3f7ff" stroke-width="4" stroke-linecap="round" />

            <!-- High-Tech Padlock Body Plate -->
            <rect id="lock-body" x="472" y="468" width="56" height="42" rx="5" fill="#002838" stroke="#00f0ff" stroke-width="1.8" />

            <!-- Radiant Cyber Keyhole Slot -->
            <circle id="keyhole-head" cx="500" cy="483" r="5.5" fill="#b3f7ff" filter="url(#high-glow)" />
            <polygon id="keyhole-slot" points="497,485 495.5,498 504.5,498 503,485" fill="#b3f7ff" filter="url(#high-glow)" />

            <!-- Micro Circuit Pulse Nodes -->
            <circle cx="368" cy="463" r="2.8" fill="#b3f7ff" />
            <circle cx="632" cy="463" r="2.8" fill="#b3f7ff" />
            <circle cx="405" cy="555" r="2.4" fill="#b3f7ff" />
            <circle cx="595" cy="555" r="2.4" fill="#b3f7ff" />
            <circle cx="485" cy="363" r="2.4" fill="#b3f7ff" />
            <circle cx="515" cy="625" r="2.4" fill="#b3f7ff" />
          </g>
        </g>

        <!-- Ambient Floating Energy Sparks -->
        <g id="particles-layer"></g>
      </g>
    </svg>
  </div>

  <script type="module">
    import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

    // ==========================================

    // ==========================================
    const COLOR_SCHEMES = {

      'Palette 3 (AA60C8, D69ADE...)': {

      },
      'Palette 4 (FEF1BE, FFBA00...)': {

      },
      'Palette 5 (D4FFB0, 7FFF00...)': {

      },
      'Palette 6 (FFE8CC, FF8C00...)': {

        accent: '#FFE8CC',

      },
      'Palette 7 (E8E0FF, B38FFF...)': {

      },
      'Palette 8 (E0FBFF, 00F0FF...)': {

        background: '#05020F'
      }
    };

    // ==========================================
    // 5 THEMATIC & AESTHETIC VARIATIONS
    // ==========================================
    const THEMATIC_PRESETS = {
      'Aegis Tactical Defense Grid': {
        colorScheme: 'Custom',
        primaryColor: '#5a8fb8',
        secondaryColor: '#1b2a47',
        accentColor: '#ffcc00',

        animationSpeed: 0.9,

      },
      'Cyberpunk Black-ICE': {
        colorScheme: 'Palette 8 (E0FBFF, 00F0FF...)',
        primaryColor: '#00f0ff',
        secondaryColor: '#8b00ff',
        accentColor: '#ff007f',
        surfaceColor: '#160028',
        backgroundColor: '#020108',
        animationMode: 'Defense Grid Surge',
        animationSpeed: 1.3,
        exposure: 1.35,

      },
      'Nanotech / Bio-Synthetic': {

        primaryColor: '#7fff00',
        secondaryColor: '#00b894',
        accentColor: '#d4ffb0',

      'Crystalline Monolith / CAD': {

    // ==========================================
    // 8 PRECONFIGURED ANIMATION PRESETS
    // ==========================================
    const ANIMATION_PRESETS = [
      'Static Surveillance',
      'Breathing Sentinel',
      'Orbital Scan',
      'Hexagonal Wave',
      'Radar Sweep',
      'Defense Grid Surge',
      'Quantum Drift',

    // ==========================================
    // MASTER CONFIGURATION PARAMETERS
    // ==========================================
    const defaultDpr = Math.min(window.devicePixelRatio || 1, 2);
    const params = {
      thematicPreset: 'Custom / Manual',
      themeMode: 'custom',

      colorScheme: 'Monochromatic',
      primaryColor: COLOR_SCHEMES['Monochromatic'].primary,
      secondaryColor: COLOR_SCHEMES['Monochromatic'].secondary,

      resetCamera: () => resetCameraTransform()
    };

    // ==========================================
    // SVG GEOMETRY SETUP
    // ==========================================
    const svg = document.getElementById('shield-svg');
    const container = document.getElementById('viewport-wrapper');
    const worldRig = document.getElementById('world-rig');
    const bgRect = document.getElementById('bg-rect');
    const bgAmbientOrb = document.getElementById('bg-ambient-orb');

    // Thematic Special Layers
    const aegisLayer = document.getElementById('aegis-telemetry-layer');
    const blackIceLayer = document.getElementById('blackice-dispersion-layer');
    const cadLayer = document.getElementById('cad-reticles-layer');
    const solarLayer = document.getElementById('solar-corona-layer');
    const solarRaysGroup = document.getElementById('solar-rays-group');
    const cadCrosshairsGroup = document.getElementById('cad-crosshairs-group');
    const blackiceCyanAura = document.getElementById('blackice-cyan-aura');
    const blackiceMagentaAura = document.getElementById('blackice-magenta-aura');
    const aegisTrackingReticle = document.getElementById('aegis-tracking-reticle');

    // Shield Elements
    const shieldAura = document.getElementById('shield-aura-path');
    const shieldSurface = document.getElementById('shield-surface-path');
    const shieldOuter = document.getElementById('shield-outer-path');
    const shieldInner = document.getElementById('shield-inner-path');
    const shieldBracketsGroup = document.getElementById('shield-tactical-brackets');
    const coreHexFrame = document.getElementById('core-hex-frame');
    const coreEnergyOrb = document.getElementById('core-energy-orb');
    const lockShackle = document.getElementById('lock-shackle');
    const lockBody = document.getElementById('lock-body');
    const keyholeHead = document.getElementById('keyhole-head');
    const keyholeSlot = document.getElementById('keyhole-slot');

    // Circuit Busses
    const circuitBusses = [
      document.getElementById('circuit-bus-l1'),
      document.getElementById('circuit-bus-r1'),
      document.getElementById('circuit-bus-l2'),
      document.getElementById('circuit-bus-r2'),
      document.getElementById('circuit-bus-top'),
      document.getElementById('circuit-bus-bottom')
    ];

    // Tactical Radar Elements
    const radarBeam = document.getElementById('radar-sweep-beam');
    const hudTicksGroup = document.getElementById('hud-tick-marks');
    const hudRingOuter = document.getElementById('hud-ring-outer');
    const hudRingMid = document.getElementById('hud-ring-mid');
    const hudRingInner = document.getElementById('hud-ring-inner');

    // Force Field Groups
    const hexCellsGroup = document.getElementById('hex-cells-group');
    const hexEdgesGroup = document.getElementById('hex-edges-group');
    const hexNodesGroup = document.getElementById('hex-nodes-group');
    const shockwaveLayer = document.getElementById('shockwave-layer');
    const particlesLayer = document.getElementById('particles-layer');

    // Shield Contour Path Data
    const shieldOuterD = `M 500,320 C 550,315 605,295 650,285 C 660,360 660,455 610,550 C 570,625 525,670 500,690 C 475,670 430,625 390,550 C 340,455 340,360 350,285 C 395,295 450,315 500,320 Z`;
    const shieldInnerD = `M 500,346 C 542,342 588,325 626,316 C 635,378 635,456 592,534 C 558,596 520,634 500,650 C 480,634 442,596 408,534 C 365,456 365,378 374,316 C 412,325 458,342 500,346 Z`;

    shieldAura.setAttribute('d', shieldOuterD);
    shieldSurface.setAttribute('d', shieldOuterD);
    shieldOuter.setAttribute('d', shieldOuterD);
    shieldInner.setAttribute('d', shieldInnerD);
    blackiceCyanAura.setAttribute('d', shieldOuterD);
    blackiceMagentaAura.setAttribute('d', shieldOuterD);

    // Populate Solar Corona Flare Rays
    for (let i = 0; i < 20; i++) {
      const angle = (i / 20) * Math.PI * 2;
      const rayLen = 340 + (i % 2 === 0 ? 90 : 40);
      const halfW = 0.05;
      const a1 = angle - halfW;
      const a2 = angle + halfW;
      const x1 = 500 + 80 * Math.cos(a1);
      const y1 = 485 + 80 * Math.sin(a1);
      const x2 = 500 + rayLen * Math.cos(angle);
      const y2 = 485 + rayLen * Math.sin(angle);
      const x3 = 500 + 80 * Math.cos(a2);
      const y3 = 485 + 80 * Math.sin(a2);

      const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
      poly.setAttribute('points', `${x1.toFixed(1)},${y1.toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)} ${x3.toFixed(1)},${y3.toFixed(1)}`);
      poly.setAttribute('fill', '#f6aa1c');
      poly.setAttribute('opacity', (0.15 + (i % 3 === 0 ? 0.2 : 0.08)).toFixed(2));
      solarRaysGroup.appendChild(poly);
    }

    // Populate Tactical HUD Ticks
    for (let deg = 0; deg < 360; deg += 10) {
      const rad = (deg * Math.PI) / 180;
      const isMajor = deg % 30 === 0;
      const r1 = 455;
      const r2 = isMajor ? 467 : 461;
      const x1 = 500 + r1 * Math.cos(rad);
      const y1 = 485 + r1 * Math.sin(rad);
      const x2 = 500 + r2 * Math.cos(rad);
      const y2 = 485 + r2 * Math.sin(rad);

      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', x1.toFixed(1));
      line.setAttribute('y1', y1.toFixed(1));
      line.setAttribute('x2', x2.toFixed(1));
      line.setAttribute('y2', y2.toFixed(1));
      line.setAttribute('stroke', '#0088cc');
      line.setAttribute('stroke-width', isMajor ? '1.4' : '0.8');
      hudTicksGroup.appendChild(line);
    }

    // Populate Tactical Edge Brackets on Shield Flank
    const bracketCoords = [
      { x: 358, y: 350, rot: -25 },
      { x: 642, y: 350, rot: 25 },
      { x: 348, y: 440, rot: -10 },
      { x: 652, y: 440, rot: 10 },
      { x: 388, y: 565, rot: 35 },
      { x: 612, y: 565, rot: -35 }
    ];
    bracketCoords.forEach(b => {
      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.setAttribute('transform', `translate(${b.x}, ${b.y}) rotate(${b.rot})`);
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', 'M -6 -8 L 0 0 L -6 8');
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', '#00f0ff');
      path.setAttribute('stroke-width', '1.6');
      g.appendChild(path);
      shieldBracketsGroup.appendChild(g);
    });

    // ==========================================
    // GENERATE HONEYCOMB FORCE FIELD LATTICE
    // ==========================================
    const HEX_RADIUS = 40;
    const HEX_W = Math.sqrt(3) * HEX_RADIUS;
    const HEX_H = 1.5 * HEX_RADIUS;
    const CENTER_X = 500;
    const CENTER_Y = 485;
    const MAX_FIELD_RADIUS = 450;

    const hexCells = [];
    const edgeMap = new Map();
    const nodeMap = new Map();

    function formatCoord(val) {
      return (Math.round(val * 10) / 10).toFixed(1);
    }

    // Generate Hexagonal Cells
    for (let r = -7; r <= 7; r++) {
      for (let q = -7; q <= 7; q++) {
        const cx = CENTER_X + HEX_W * (q + (r % 2 !== 0 ? 0.5 : 0));
        const cy = CENTER_Y + HEX_H * r;
        const distFromCenter = Math.hypot(cx - CENTER_X, cy - CENTER_Y);

        if (distFromCenter <= MAX_FIELD_RADIUS) {
          const vertices = [];
          for (let i = 0; i < 6; i++) {
            const angle = (Math.PI / 6) + (i * Math.PI / 3);
            const vx = cx + HEX_RADIUS * Math.cos(angle);
            const vy = cy + HEX_RADIUS * Math.sin(angle);
            vertices.push({ x: vx, y: vy });

            const nKey = `${formatCoord(vx)},${formatCoord(vy)}`;
            if (!nodeMap.has(nKey)) {
              nodeMap.set(nKey, {
                x: vx,
                y: vy,
                dist: Math.hypot(vx - CENTER_X, vy - CENTER_Y),
                angle: Math.atan2(vy - CENTER_Y, vx - CENTER_X),
                phase: Math.random() * Math.PI * 2
              });
            }
          }

          for (let i = 0; i < 6; i++) {
            const p1 = vertices[i];
            const p2 = vertices[(i + 1) % 6];
            const k1 = `${formatCoord(p1.x)},${formatCoord(p1.y)}`;
            const k2 = `${formatCoord(p2.x)},${formatCoord(p2.y)}`;
            const edgeKey = k1 < k2 ? `${k1}_${k2}` : `${k2}_${k1}`;

            if (!edgeMap.has(edgeKey)) {
              const mx = (p1.x + p2.x) / 2;
              const my = (p1.y + p2.y) / 2;
              edgeMap.set(edgeKey, {
                x1: p1.x,
                y1: p1.y,
                x2: p2.x,
                y2: p2.y,
                mx: mx,
                my: my,
                dist: Math.hypot(mx - CENTER_X, my - CENTER_Y),
                angle: Math.atan2(my - CENTER_Y, mx - CENTER_X),
                phase: Math.random() * Math.PI * 2,
                speedMultiplier: 0.8 + Math.random() * 0.4,
                isPerimeter: distFromCenter > 240 && distFromCenter < 380,
                element: null
              });
            }
          }

          const pointsStr = vertices.map(v => `${formatCoord(v.x)},${formatCoord(v.y)}`).join(' ');
          const isActive = Math.random() < 0.22 && distFromCenter > 160;
          hexCells.push({
            cx,
            cy,
            dist: distFromCenter,
            angle: Math.atan2(cy - CENTER_Y, cx - CENTER_X),
            points: pointsStr,
            isActive: isActive,
            phase: Math.random() * Math.PI * 2,
            element: null
          });
        }
      }
    }

    // Render Hex Cell Polygons
    hexCells.forEach(cell => {
      const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
      poly.setAttribute('points', cell.points);
      poly.setAttribute('fill', cell.isActive ? '#00f0ff' : '#0088cc');
      poly.setAttribute('fill-opacity', cell.isActive ? '0.08' : '0.02');
      poly.setAttribute('stroke', cell.isActive ? '#00f0ff' : 'none');
      poly.setAttribute('stroke-width', '0.6');
      poly.setAttribute('stroke-opacity', cell.isActive ? '0.3' : '0');
      hexCellsGroup.appendChild(poly);
      cell.element = poly;
    });

    // Render Individual Path Segments (Hex Edges)
    const edgeSegments = Array.from(edgeMap.values());
    edgeSegments.forEach(seg => {
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', formatCoord(seg.x1));
      line.setAttribute('y1', formatCoord(seg.y1));
      line.setAttribute('x2', formatCoord(seg.x2));
      line.setAttribute('y2', formatCoord(seg.y2));
      line.setAttribute('stroke', seg.isPerimeter ? '#00f0ff' : '#0088cc');
      line.setAttribute('stroke-width', seg.isPerimeter ? '1.8' : '1.1');
      line.setAttribute('stroke-linecap', 'round');
      line.setAttribute('stroke-opacity', '0.4');
      hexEdgesGroup.appendChild(line);
      seg.element = line;
    });

    // Render Hex Lattice Intersection Nodes & CAD Crosshairs
    const latticeNodes = Array.from(nodeMap.values());
    latticeNodes.forEach((node, idx) => {
      const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      circle.setAttribute('cx', formatCoord(node.x));
      circle.setAttribute('cy', formatCoord(node.y));
      circle.setAttribute('r', node.dist > 200 ? '1.8' : '1.3');
      circle.setAttribute('fill', '#b3f7ff');
      circle.setAttribute('opacity', '0.5');
      hexNodesGroup.appendChild(circle);
      node.element = circle;

      // Populate CAD crosshairs for every 4th node
      if (idx % 4 === 0) {
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        g.setAttribute('transform', `translate(${formatCoord(node.x)}, ${formatCoord(node.y)})`);
        const hL = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        hL.setAttribute('x1', '-4'); hL.setAttribute('y1', '0'); hL.setAttribute('x2', '4'); hL.setAttribute('y2', '0');
        hL.setAttribute('stroke', '#00f0ff'); hL.setAttribute('stroke-width', '0.6');
        const vL = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        vL.setAttribute('x1', '0'); vL.setAttribute('y1', '-4'); vL.setAttribute('x2', '0'); vL.setAttribute('y2', '4');
        vL.setAttribute('stroke', '#00f0ff'); vL.setAttribute('stroke-width', '0.6');
        g.appendChild(hL);
        g.appendChild(vL);
        cadCrosshairsGroup.appendChild(g);
      }
    });

    // Populate Dynamic Concentric Force Field Shockwave Rings
    const shockwaveRings = [];
    for (let i = 0; i < 3; i++) {
      const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
      const pts = [];
      for (let k = 0; k < 6; k++) {
        const a = (Math.PI / 6) + (k * Math.PI / 3);
        pts.push(`${(CENTER_X + 100 * Math.cos(a)).toFixed(1)},${(CENTER_Y + 100 * Math.sin(a)).toFixed(1)}`);
      }
      poly.setAttribute('points', pts.join(' '));
      poly.setAttribute('fill', 'none');
      poly.setAttribute('stroke', '#00f0ff');
      poly.setAttribute('stroke-width', '2');
      poly.setAttribute('opacity', '0');
      shockwaveLayer.appendChild(poly);
      shockwaveRings.push({
        element: poly,
        progress: i / 3
      });
    }

    // Populate Ambient Digital Sparks (Particles)
    const sparks = [];
    for (let i = 0; i < 28; i++) {
      const p = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      p.setAttribute('r', (1 + Math.random() * 1.6).toFixed(1));
      p.setAttribute('fill', '#b3f7ff');
      p.setAttribute('opacity', '0.6');
      particlesLayer.appendChild(p);

      const rad = Math.random() * Math.PI * 2;
      const dist = 60 + Math.random() * 380;
      sparks.push({
        element: p,
        x: CENTER_X + dist * Math.cos(rad),
        y: CENTER_Y + dist * Math.sin(rad),
        vx: (Math.random() - 0.5) * 0.4,
        vy: (Math.random() - 0.5) * 0.4,
        phase: Math.random() * Math.PI * 2
      });
    }

    // Helper: Reseed Lattice Phases for Procedural Variation
    function reseedLattice() {
      edgeSegments.forEach(seg => {
        seg.phase = Math.random() * Math.PI * 2;
        seg.speedMultiplier = 0.7 + Math.random() * 0.6;
        seg.isPerimeter = Math.random() < 0.35;
      });
      hexCells.forEach(cell => {
        cell.isActive = Math.random() < 0.25 && cell.dist > 140;
        cell.phase = Math.random() * Math.PI * 2;
      });
      latticeNodes.forEach(n => {
        n.phase = Math.random() * Math.PI * 2;
      });
    }

    // ==========================================
    // THEMATIC VARIATION & COLOR APPLICATION
    // ==========================================
    function applyThematicPreset(name) {
      if (name === 'Custom / Manual' || !THEMATIC_PRESETS[name]) {
        params.thematicPreset = 'Custom / Manual';
        params.themeMode = 'custom';
        updateThemeLayers();
        return;
      }
      const t = THEMATIC_PRESETS[name];
      params.thematicPreset = name;
      params.themeMode = t.themeMode;
      params.colorScheme = t.colorScheme;
      params.primaryColor = t.primaryColor;
      params.secondaryColor = t.secondaryColor;
      params.accentColor = t.accentColor;
      params.surfaceColor = t.surfaceColor;
      params.backgroundColor = t.backgroundColor;
      params.animationMode = t.animationMode;
      params.animationSpeed = t.animationSpeed;
      params.exposure = t.exposure;
      params.glowIntensity = t.glowIntensity;
      params.latticeOpacity = t.latticeOpacity;
      params.hexPulseRate = t.hexPulseRate;

      updateThemeLayers();
      applyColors();
      applyLighting();
      triggerShockwave();
      updateGuiControllers();
    }

    function updateThemeLayers() {
      const mode = params.themeMode;
      const isAegis = mode === 'aegis';
      const isBlackIce = mode === 'blackice';
      const isCad = mode === 'cad';
      const isSolar = mode === 'solaraegis';

      if (aegisLayer) {
        aegisLayer.style.display = isAegis ? '' : 'none';
        aegisLayer.setAttribute('opacity', isAegis ? '1' : '0');
      }
      if (blackIceLayer) {
        blackIceLayer.style.display = isBlackIce ? '' : 'none';
        blackIceLayer.setAttribute('opacity', isBlackIce ? '1' : '0');
      }
      if (cadLayer) {
        cadLayer.style.display = isCad ? '' : 'none';
        cadLayer.setAttribute('opacity', isCad ? '1' : '0');
      }
      if (solarLayer) {
        solarLayer.style.display = isSolar ? '' : 'none';
        solarLayer.setAttribute('opacity', isSolar ? '1' : '0');
      }

      // Adjust vector stroke widths for CAD blueprint vs normal
      if (isCad) {
        shieldOuter.setAttribute('stroke-width', '1.6');
        shieldInner.setAttribute('stroke-width', '0.9');
        edgeSegments.forEach(s => s.element.setAttribute('stroke-width', '0.8'));
      } else {
        shieldOuter.setAttribute('stroke-width', '3.5');
        shieldInner.setAttribute('stroke-width', '1.8');
        edgeSegments.forEach(s => s.element.setAttribute('stroke-width', s.isPerimeter ? '1.8' : '1.1'));
      }
    }

    function applyScheme(schemeName) {
      if (!COLOR_SCHEMES[schemeName]) return;
      const s = COLOR_SCHEMES[schemeName];
      params.colorScheme = schemeName;
      params.primaryColor = s.primary;
      params.secondaryColor = s.secondary;
      params.accentColor = s.accent;
      params.surfaceColor = s.surface;
      params.backgroundColor = s.background;
      applyColors();
    }

    function applyColors() {
      const isGreen = params.greenscreen;
      const bg = isGreen ? '#00ff00' : params.backgroundColor;

      document.body.style.backgroundColor = bg;
      bgRect.setAttribute('fill', bg);

      if (isGreen) {
        bgAmbientOrb.setAttribute('opacity', '0');
      } else {
        bgAmbientOrb.setAttribute('opacity', '1');
      }

      // Update Gradients
      document.getElementById('stop-bg-amb-1').setAttribute('stop-color', params.primaryColor);
      document.getElementById('stop-bg-amb-2').setAttribute('stop-color', params.secondaryColor);

      document.getElementById('stop-shield-str-1').setAttribute('stop-color', params.primaryColor);
      document.getElementById('stop-shield-str-2').setAttribute('stop-color', params.accentColor);
      document.getElementById('stop-shield-str-3').setAttribute('stop-color', params.secondaryColor);

      document.getElementById('stop-shield-surf-1').setAttribute('stop-color', params.surfaceColor);
      document.getElementById('stop-shield-surf-2').setAttribute('stop-color', isGreen ? '#00ff00' : params.backgroundColor);

      document.getElementById('stop-core-1').setAttribute('stop-color', params.accentColor);
      document.getElementById('stop-core-2').setAttribute('stop-color', params.primaryColor);

      document.getElementById('stop-radar-1').setAttribute('stop-color', params.primaryColor);
      document.getElementById('stop-radar-2').setAttribute('stop-color', params.secondaryColor);

      // Solar Corona Gradients
      document.getElementById('stop-corona-1').setAttribute('stop-color', params.accentColor);
      document.getElementById('stop-corona-2').setAttribute('stop-color', params.primaryColor);
      document.getElementById('stop-corona-3').setAttribute('stop-color', params.secondaryColor);
      solarRaysGroup.querySelectorAll('polygon').forEach(p => p.setAttribute('fill', params.primaryColor));

      // Apply to Shield Outline & Core Elements
      shieldAura.setAttribute('stroke', params.primaryColor);
      shieldOuter.setAttribute('stroke', 'url(#shield-stroke-grad)');
      shieldInner.setAttribute('stroke', params.primaryColor);
      coreHexFrame.setAttribute('stroke', params.primaryColor);
      lockShackle.setAttribute('stroke', params.accentColor);
      lockBody.setAttribute('stroke', params.primaryColor);
      lockBody.setAttribute('fill', params.surfaceColor);
      keyholeHead.setAttribute('fill', params.accentColor);
      keyholeSlot.setAttribute('fill', params.accentColor);

      // HUD & Circuitry
      hudRingOuter.setAttribute('stroke', params.secondaryColor);
      hudRingMid.setAttribute('stroke', params.primaryColor);
      hudRingInner.setAttribute('stroke', params.secondaryColor);
      hudTicksGroup.querySelectorAll('line').forEach(l => l.setAttribute('stroke', params.secondaryColor));
      shieldBracketsGroup.querySelectorAll('path').forEach(p => p.setAttribute('stroke', params.primaryColor));
      circuitBusses.forEach(b => b.setAttribute('stroke', params.secondaryColor));

      // Update Node and Spark fills
      latticeNodes.forEach(n => n.element.setAttribute('fill', params.accentColor));
      sparks.forEach(s => s.element.setAttribute('fill', params.accentColor));

      applyLighting();
    }

    function applyLighting() {
      const exp = params.exposure;
      const glow = params.glowIntensity;

      const softBlur = document.querySelector('#soft-glow feGaussianBlur');
      if (softBlur) softBlur.setAttribute('stdDeviation', (3 * glow).toFixed(1));

      const highBlur3 = document.querySelector('#high-glow feGaussianBlur[result="blur3"]');
      if (highBlur3) highBlur3.setAttribute('stdDeviation', (15 * glow).toFixed(1));

      worldRig.style.filter = `brightness(${exp}) contrast(${0.9 + exp * 0.1})`;
    }

    function applyDPR() {
      const filters = document.querySelectorAll('filter');
      const res = Math.round(512 * params.dpr);
      filters.forEach(f => {
        f.setAttribute('filterRes', `${res} ${res}`);
      });
      svg.style.shapeRendering = params.dpr >= 1.5 ? 'geometricPrecision' : 'auto';
    }

    // Trigger visual ripple burst
    function triggerShockwave() {
      shockwaveRings.forEach((r, idx) => {
        r.progress = idx * 0.3;
      });
    }

    // ==========================================
    // PAN & ZOOM CAMERA CONTROLS
    // ==========================================
    let isPointerDown = false;
    let dragStartX = 0, dragStartY = 0;
    let panX = 0, panY = 0;
    let targetPanX = 0, targetPanY = 0;
    let zoom = 1.0;
    let targetZoom = 1.0;
    let hasMoved = false;
    let downTime = 0;

    container.addEventListener('pointerdown', (e) => {
      isPointerDown = true;
      hasMoved = false;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      downTime = performance.now();
      container.classList.add('grabbing');
    });

    window.addEventListener('pointermove', (e) => {
      if (!isPointerDown) return;
      const dx = e.clientX - dragStartX;
      const dy = e.clientY - dragStartY;
      if (Math.hypot(dx, dy) > 5) {
        hasMoved = true;
      }
      targetPanX += dx;
      targetPanY += dy;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
    });

    window.addEventListener('pointerup', (e) => {
      if (!isPointerDown) return;
      isPointerDown = false;
      container.classList.remove('grabbing');
      const duration = performance.now() - downTime;
      if (!hasMoved && duration < 380) {
        if (params.clickToRandomize) {
          randomizeScene();
        }
      }
    });

    window.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.12 : 0.89;
      targetZoom = Math.max(0.25, Math.min(6.0, targetZoom * zoomFactor));
    }, { passive: false });

    function resetCameraTransform() {
      targetPanX = 0;
      targetPanY = 0;
      targetZoom = 1.0;
    }

    // Procedural Re-roll on Scene Click
    function randomizeScene() {
      // Choose between random thematic variation or procedural color scheme
      const rollThematic = Math.random() < 0.45;
      if (rollThematic) {
        const themeKeys = Object.keys(THEMATIC_PRESETS);
        const pickedTheme = themeKeys[Math.floor(Math.random() * themeKeys.length)];
        applyThematicPreset(pickedTheme);
      } else {
        const schemeKeys = Object.keys(COLOR_SCHEMES);
        const chosenScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
        params.thematicPreset = 'Custom / Manual';
        params.themeMode = 'custom';
        applyScheme(chosenScheme);

        const animKeys = ANIMATION_PRESETS;
        params.animationMode = animKeys[Math.floor(Math.random() * animKeys.length)];
        params.animationSpeed = +(0.7 + Math.random() * 1.1).toFixed(2);
        params.exposure = +(0.85 + Math.random() * 0.5).toFixed(2);
        params.hexPulseRate = +(0.8 + Math.random() * 1.2).toFixed(2);
        params.glowIntensity = +(0.8 + Math.random() * 1.0).toFixed(2);

        updateThemeLayers();
        reseedLattice();
        applyColors();
        applyLighting();
        triggerShockwave();
        updateGuiControllers();
      }
    }

    function updateGuiControllers() {
      if (typeof gui.controllersRecursive === 'function') {
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      } else {
        const traverse = (f) => {
          f.controllers.forEach(c => c.updateDisplay());
          f.folders.forEach(traverse);
        };
        traverse(gui);
      }
    }

    // ==========================================
    // LIL-GUI CONTROL SETUP (Default unstyled)
    // ==========================================
    const gui = new GUI({ title: 'Digital Shield Defense' });

    // 1. Thematic & Aesthetic Variations Folder
    const fThematic = gui.addFolder('Thematic Variations');
    fThematic.add(params, 'thematicPreset', [
      'Custom / Manual',
      'Aegis Tactical Defense Grid',
      'Cyberpunk Black-ICE',
      'Nanotech / Bio-Synthetic',
      'Crystalline Monolith / CAD',
      'Mythic / Solar Aegis'
    ]).name('Scene Preset').onChange(applyThematicPreset);

    // 2. Color & Theme Folder
    const fTheme = gui.addFolder('Theme & Colors');
    fTheme.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Color Scheme').onChange(applyScheme);
    fTheme.addColor(params, 'primaryColor').name('Primary Color').onChange(applyColors);
    fTheme.addColor(params, 'secondaryColor').name('Secondary Color').onChange(applyColors);
    fTheme.addColor(params, 'accentColor').name('Accent Color').onChange(applyColors);
    fTheme.addColor(params, 'surfaceColor').name('Surface Color').onChange(applyColors);
    fTheme.addColor(params, 'backgroundColor').name('Background Color').onChange(applyColors);
    fTheme.add(params, 'greenscreen').name('Green Screen (#00ff00)').onChange(applyColors);

    // 3. Scene & Optics Folder
    const fOptics = gui.addFolder('Scene & Optics');
    fOptics.add(params, 'exposure', 0.2, 2.5, 0.05).name('Exposure / Light').onChange(applyLighting);
    fOptics.add(params, 'glowIntensity', 0.0, 2.5, 0.05).name('Glow Bloom').onChange(applyLighting);
    fOptics.add(params, 'dpr', 0.5, 3.0, 0.25).name('Pixel Ratio (DPR)').onChange(applyDPR);

    // 4. Animation Dynamics Folder
    const fMotion = gui.addFolder('Animation Dynamics');
    fMotion.add(params, 'animationMode', ANIMATION_PRESETS).name('Animation Preset');
    fMotion.add(params, 'animationSpeed', 0.1, 3.0, 0.1).name('Animation Speed');
    fMotion.add(params, 'hexPulseRate', 0.2, 3.0, 0.1).name('Lattice Pulse Rate');
    fMotion.add(params, 'latticeOpacity', 0.2, 1.0, 0.05).name('Lattice Opacity');

    // 5. System Settings Folder
    const fSystem = gui.addFolder('System Controls');
    fSystem.add(params, 'clickToRandomize').name('Click to Randomize');
    fSystem.add(params, 'resetCamera').name('Reset Camera');

    // Toggle UI with "H" key
    let isGuiShown = true;
    window.addEventListener('keydown', (e) => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) return;
      if (e.key === 'h' || e.key === 'H') {
        isGuiShown = !isGuiShown;
        if (isGuiShown) {
          gui.show();
          gui.domElement.style.display = '';
        } else {
          gui.hide();
          gui.domElement.style.display = 'none';
        }
      }
    });

    // ==========================================
    // MAIN INFINITE ANIMATION LOOP
    // ==========================================
    let lastTime = performance.now();
    let globalTime = 0;
    let radarAngle = 0;

    function renderLoop(currentTime) {
      requestAnimationFrame(renderLoop);

      const dt = Math.min((currentTime - lastTime) / 1000, 0.1);
      lastTime = currentTime;
      globalTime += dt * params.animationSpeed;

      const speed = params.animationSpeed;
      const pulseRate = params.hexPulseRate;
      const mode = params.animationMode;
      const theme = params.themeMode;

      // 1. Smooth Camera Lerp
      panX += (targetPanX - panX) * 0.14;
      panY += (targetPanY - panY) * 0.14;
      zoom += (targetZoom - zoom) * 0.14;

      // 2. Camera Trajectory Calculation per Preset
      let camOffsetX = 0;
      let camOffsetY = 0;
      let camZoom = 1.0;
      let camRot = 0;

      switch (mode) {
        case 'Static Surveillance':
          camOffsetX = 0;
          camOffsetY = 0;
          camZoom = 1.0;
          camRot = 0;
          break;

        case 'Breathing Sentinel':
          camZoom = 1.0 + 0.045 * Math.sin(globalTime * 0.7);
          camOffsetY = 6 * Math.sin(globalTime * 0.4);
          break;

        case 'Orbital Scan':
          camOffsetX = 26 * Math.cos(globalTime * 0.35);
          camOffsetY = 15 * Math.sin(globalTime * 0.35);
          camRot = 1.2 * Math.sin(globalTime * 0.25);
          break;

        case 'Hexagonal Wave':
          camZoom = 1.0 + 0.03 * Math.cos(globalTime * 0.6);
          camOffsetY = 8 * Math.sin(globalTime * 0.5);
          break;

        case 'Radar Sweep':
          camOffsetX = 12 * Math.sin(globalTime * 0.2);
          camOffsetY = 8 * Math.cos(globalTime * 0.25);
          break;

        case 'Defense Grid Surge':
          camZoom = 1.0 + 0.04 * Math.sin(globalTime * 1.1);
          break;

        case 'Quantum Drift':
          camOffsetX = 28 * Math.sin(globalTime * 0.28);
          camOffsetY = 16 * Math.sin(globalTime * 0.56);
          camRot = 0.8 * Math.cos(globalTime * 0.3);
          break;

        case 'Harmonic Oscillation':
          camZoom = 1.0 + 0.035 * Math.sin(globalTime * 0.8);
          camRot = 1.6 * Math.sin(globalTime * 0.45);
          break;
      }

      // Apply Combined Transform to World Rig
      const finalPanX = panX + camOffsetX;
      const finalPanY = panY + camOffsetY;
      const finalZoom = zoom * camZoom;
      const finalRot = camRot;
      worldRig.setAttribute(
        'transform',
        `translate(${CENTER_X + finalPanX}, ${CENTER_Y + finalPanY}) scale(${finalZoom}) rotate(${finalRot}) translate(${-CENTER_X}, ${-CENTER_Y})`
      );

      // 3. Radar Beam Rotation & Geometry
      radarAngle = (globalTime * 0.85) % (Math.PI * 2);
      const sweepArc = Math.PI * 0.32;
      const rStartAngle = radarAngle - sweepArc;
      const rEndAngle = radarAngle;
      const rRadius = 455;

      const rx1 = CENTER_X + rRadius * Math.cos(rStartAngle);
      const ry1 = CENTER_Y + rRadius * Math.sin(rStartAngle);
      const rx2 = CENTER_X + rRadius * Math.cos(rEndAngle);
      const ry2 = CENTER_Y + rRadius * Math.sin(rEndAngle);

      radarBeam.setAttribute(
        'd',
        `M ${CENTER_X} ${CENTER_Y} L ${rx1.toFixed(1)} ${ry1.toFixed(1)} A ${rRadius} ${rRadius} 0 0 1 ${rx2.toFixed(1)} ${ry2.toFixed(1)} Z`
      );

      // Aegis Mode: Animate Tactical Tracking Reticle
      if (theme === 'aegis' && aegisTrackingReticle) {
        const reticleAngle = -globalTime * 0.4;
        const rDist = 390 + 20 * Math.sin(globalTime * 1.2);
        const tx = CENTER_X + rDist * Math.cos(reticleAngle);
        const ty = CENTER_Y + rDist * Math.sin(reticleAngle);
        aegisTrackingReticle.setAttribute('transform', `translate(${tx.toFixed(1)}, ${ty.toFixed(1)})`);
      }

      // Solar Aegis Mode: Rotate Corona Rays
      if (theme === 'solaraegis' && solarRaysGroup) {
        const solRot = (globalTime * 6) % 360;
        solarRaysGroup.setAttribute('transform', `rotate(${solRot.toFixed(2)}, ${CENTER_X}, ${CENTER_Y})`);
      }

      // Black-ICE Mode: Micro-voltage Jitter on Chromatic Dispersion Auras
      if (theme === 'blackice' && blackIceLayer) {
        const jitter = (Math.random() - 0.5) * 2.5;
        blackiceCyanAura.setAttribute('transform', `translate(${(-3 + jitter).toFixed(1)}, 0)`);
        blackiceMagentaAura.setAttribute('transform', `translate(${(3 - jitter).toFixed(1)}, 0)`);
        blackiceCyanAura.setAttribute('opacity', (0.45 + Math.random() * 0.3).toFixed(2));
        blackiceMagentaAura.setAttribute('opacity', (0.45 + Math.random() * 0.3).toFixed(2));
      }

      // 4. Update Honeycomb Path Segments (Stroke Opacity Pulsing)
      const baseLatticeAlpha = params.latticeOpacity;
      const isRadar = mode === 'Radar Sweep';
      const isWave = mode === 'Hexagonal Wave';
      const isSurge = mode === 'Defense Grid Surge';
      const isBio = theme === 'nanotech';

      edgeSegments.forEach(seg => {
        let opacity = 0.25;

        if (isBio) {
          // Asynchronous bio-synthetic cellular synaptic pulse
          const synapticPhase = Math.sin(globalTime * 2.8 * pulseRate + seg.phase * 2.2 + Math.cos(seg.dist * 0.03));
          opacity = 0.16 + 0.82 * Math.max(0, synapticPhase);
        } else if (isRadar) {
          let diff = ((seg.angle - radarAngle) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
          if (diff > Math.PI) diff = Math.PI * 2 - diff;
          const beamProximity = Math.max(0, 1 - diff / 0.7);
          opacity = 0.15 + 0.85 * (beamProximity ** 2.5);
        } else if (isWave) {
          const wavePhase = Math.sin(globalTime * 3.2 * pulseRate - seg.dist * 0.022);
          opacity = 0.12 + 0.78 * Math.max(0, wavePhase);
        } else if (isSurge) {
          const surgeCycle = Math.sin(globalTime * 2.0 * pulseRate);
          const distNorm = seg.dist / MAX_FIELD_RADIUS;
          opacity = 0.15 + 0.75 * Math.abs(Math.sin(surgeCycle * 2 + distNorm * 4));
        } else {
          // Standard / Static Harmonic Pulsing
          const sineVal = Math.sin(globalTime * 2.0 * pulseRate * seg.speedMultiplier + seg.phase + seg.dist * 0.012);
          opacity = 0.18 + 0.58 * (0.5 + 0.5 * sineVal);
        }

        if (seg.isPerimeter) {
          opacity = Math.min(1.0, opacity * 1.25);
        }

        seg.element.setAttribute('stroke-opacity', (opacity * baseLatticeAlpha).toFixed(2));
      });

      // 5. Update Hex Cells & Node Highlights
      hexCells.forEach(cell => {
        if (cell.isActive) {
          const cPulse = 0.05 + 0.22 * (0.5 + 0.5 * Math.sin(globalTime * 2.4 * pulseRate + cell.phase));
          cell.element.setAttribute('fill-opacity', (cPulse * baseLatticeAlpha).toFixed(2));
          cell.element.setAttribute('stroke-opacity', (cPulse * 2 * baseLatticeAlpha).toFixed(2));
        }
      });

      latticeNodes.forEach(node => {
        const nPulse = 0.2 + 0.7 * (0.5 + 0.5 * Math.sin(globalTime * 2.5 * pulseRate + node.phase));
        node.element.setAttribute('opacity', nPulse.toFixed(2));
      });

      // 6. Animate Circuit Traces & Shield Core
      const dashSpeedMultiplier = theme === 'blackice' ? 2.2 : 1.0;
      const dashOffset = (globalTime * 35 * dashSpeedMultiplier) % 60;
      circuitBusses.forEach((bus, i) => {
        const dir = i % 2 === 0 ? 1 : -1;
        bus.style.strokeDashoffset = (dir * dashOffset).toFixed(1);
      });
      shieldInner.style.strokeDashoffset = (-globalTime * 20).toFixed(1);

      // Core Keyhole Breathing Flare
      const coreScale = 1.0 + 0.12 * Math.sin(globalTime * 3.0 * pulseRate);
      coreEnergyOrb.setAttribute('r', (36 * coreScale).toFixed(1));
      coreEnergyOrb.setAttribute('opacity', (0.7 + 0.25 * Math.sin(globalTime * 3.0 * pulseRate)).toFixed(2));

      // 7. Shockwave Propagation
      shockwaveRings.forEach(sw => {
        sw.progress = (sw.progress + dt * 0.45 * speed) % 1.0;
        const currentRadius = 140 + sw.progress * 310;
        const pts = [];
        for (let k = 0; k < 6; k++) {
          const a = (Math.PI / 6) + (k * Math.PI / 3);
          pts.push(`${(CENTER_X + currentRadius * Math.cos(a)).toFixed(1)},${(CENTER_Y + currentRadius * Math.sin(a)).toFixed(1)}`);
        }
        sw.element.setAttribute('points', pts.join(' '));
        const alpha = Math.sin(sw.progress * Math.PI) * (1 - sw.progress);
        sw.element.setAttribute('opacity', (alpha * 0.65).toFixed(2));
      });

      // 8. Particles Motion
      sparks.forEach(s => {
        s.x += s.vx * speed;
        s.y += s.vy * speed;
        const d = Math.hypot(s.x - CENTER_X, s.y - CENTER_Y);
        if (d > 440) {
          s.vx = -s.vx;
          s.vy = -s.vy;
        }
        s.element.setAttribute('cx', s.x.toFixed(1));
        s.element.setAttribute('cy', s.y.toFixed(1));
        const pAlpha = 0.2 + 0.6 * (0.5 + 0.5 * Math.sin(globalTime * 3.0 + s.phase));
        s.element.setAttribute('opacity', pAlpha.toFixed(2));
      });
    }

    // Initialize Viewport and Rendering
    applyColors();
    applyLighting();
    applyDPR();
    updateThemeLayers();
    requestAnimationFrame(renderLoop);
  </script>
</body>
</html>
