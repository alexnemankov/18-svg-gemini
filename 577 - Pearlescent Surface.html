    // --- 8 Preconfigured Slow Elegant Animations ---
    const ANIMATIONS = [
      'Static (Zen Flow)',
      'Gentle Drift',
      'Slow Orbit',
      'Breathing Wave',
      'Diagonal Glide',
      'Figure-Eight',
      'Nacre Sway',
      'Deep Ocean Swell'
    ];

    // --- Global Configuration & Settings ---
    const initialSchemeKey = 'Original (Mother of Pearl)';
    const initialColors = COLOR_SCHEMES[initialSchemeKey];

    const settings = {
      // Color & Theme
      colorScheme: initialSchemeKey,
      color1: initialColors.color1,
      color2: initialColors.color2,
      color3: initialColors.color3,
      color4: initialColors.color4,
      color5: initialColors.color5,
      highlightColor: initialColors.highlight,
      shadowColor: initialColors.shadow,
      backgroundColor: initialColors.background,
      greenscreen: false,

      // Wave Geometry & Motion
      waveHeight: 0.95,
      waveFreqX: 0.30,
      waveFreqY: 0.24,
      waveSpeed: 0.50,

      // Optical Nacre & Iridescence
      iridStrength: 1.05,
      iridScale: 1.35,
      marblingStrength: 0.75,
      nacreFrequency: 0.40,
      nacreFlow: 0.55,
      peakSheen: 1.10,
      specularIntensity: 0.85,
      roughness: 38.0,

      // Grain & Atmosphere
      grainIntensity: 0.05,
      grainScale: 2.0,
      leftRightContrast: 1.15,

      // Lighting & Exposure
      exposure: 1.0,
      sceneIntensity: 1.0,
      
      keyLightColor: '#ffffff',
      keyLightIntensity: 1.0,
      keyLightPosX: -9.0,
      keyLightPosY: 5.0,
      keyLightPosZ: 7.0,

      fillLightColor: '#dbeafe',
      fillLightIntensity: 0.5,

      rimLightColor: '#f472b6',
      rimLightIntensity: 0.75,
      rimLightPosX: 9.0,
      rimLightPosY: -4.0,
      rimLightPosZ: 5.5,

      // Rendering & Performance
      pixelRatio: Math.min(window.devicePixelRatio, 2.0),
      antialias: true,

      // Animation & Interaction
      animation: 'Gentle Drift',
      animationSpeed: 1.0,
      clickToRandomize: true
    };

    // --- Three.js Setup ---
    const container = document.getElementById('canvas-container');
    let renderer, scene, camera, controls, material, mesh;
    let baseTarget = new THREE.Vector3(0, 0, 0);
    let animOffset = new THREE.Vector3(0, 0, 0);

    // --- Vertex Shader ---
    const vertexShader = `
      uniform float uTime;
      uniform vec2 uWaveFreq;
      uniform float uWaveHeight;
      uniform float uWaveSpeed;

      varying vec3 vWorldPosition;
      varying vec3 vNormal;
      varying vec2 vUv;
      varying float vWaveHeight;

      float getWaveDisplacement(vec2 p, float t) {
        float z = 0.0;
        // Primary deep silky swell
        z += sin(p.x * uWaveFreq.x + t * uWaveSpeed * 0.55) * (uWaveHeight * 0.45);
        z += cos(p.y * uWaveFreq.y + t * uWaveSpeed * 0.45) * (uWaveHeight * 0.38);

        // Diagonal flowing folds
        vec2 rot1 = vec2(p.x * 0.707 - p.y * 0.707, p.x * 0.707 + p.y * 0.707);
        z += sin(rot1.x * uWaveFreq.x * 1.15 + t * uWaveSpeed * 0.62) * (uWaveHeight * 0.28);
        z += cos(rot1.y * uWaveFreq.y * 1.05 - t * uWaveSpeed * 0.50) * (uWaveHeight * 0.22);

        // Delicate nacre micro-wave
        vec2 rot2 = vec2(p.x * 0.866 + p.y * 0.500, -p.x * 0.500 + p.y * 0.866);
        z += sin(rot2.x * uWaveFreq.x * 1.75 + t * uWaveSpeed * 0.85) * (uWaveHeight * 0.12);
        return z;
      }

      void main() {
        vUv = uv;
        vec3 pos = position;

        float z = getWaveDisplacement(pos.xy, uTime);
        pos.z += z;
        vWaveHeight = z;

        // Compute analytical normal via finite differences for smooth shading
        float eps = 0.04;
        float zX = getWaveDisplacement(pos.xy + vec2(eps, 0.0), uTime);
        float zY = getWaveDisplacement(pos.xy + vec2(0.0, eps), uTime);

        vec3 tangentX = vec3(eps, 0.0, zX - z);
        vec3 tangentY = vec3(0.0, eps, zY - z);
        vec3 calcNormal = normalize(cross(tangentX, tangentY));

        vNormal = normalize(normalMatrix * calcNormal);

        vec4 worldPos = modelMatrix * vec4(pos, 1.0);
        vWorldPosition = worldPos.xyz;

        gl_Position = projectionMatrix * viewMatrix * worldPos;
      }
    `;

    // --- Fragment Shader ---
    const fragmentShader = `
      uniform float uTime;
      uniform vec3 uColor1;
      uniform vec3 uColor2;
      uniform vec3 uColor3;
      uniform vec3 uColor4;
      uniform vec3 uColor5;

      uniform vec3 uHighlightColor;
      uniform vec3 uShadowColor;

      uniform float uIridStrength;
      uniform float uIridScale;
      uniform float uMarblingStrength;
      uniform float uNacreFrequency;
      uniform float uNacreFlow;

      uniform float uPeakSheen;
      uniform float uRoughness;
      uniform float uSpecularIntensity;

      uniform float uGrainIntensity;
      uniform float uGrainScale;

      uniform float uLeftRightContrast;
      uniform float uSceneIntensity;
      uniform float uWaveHeight;

      uniform vec3 uKeyLightPos;
      uniform vec3 uKeyLightColor;
      uniform float uKeyLightIntensity;

      uniform vec3 uFillLightColor;
      uniform float uFillLightIntensity;

      uniform vec3 uRimLightPos;
      uniform vec3 uRimLightColor;
      uniform float uRimLightIntensity;

      varying vec3 vWorldPosition;
      varying vec3 vNormal;
      varying vec2 vUv;
      varying float vWaveHeight;

      // Pseudo-random noise functions for thin-film swirling grain
      float hash(vec2 p) {
        return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
      }

      float noise(vec2 p) {
        vec2 i = floor(p);
        vec2 f = fract(p);
        vec2 u = f * f * (3.0 - 2.0 * f);
        return mix(mix(hash(i + vec2(0.0, 0.0)), hash(i + vec2(1.0, 0.0)), u.x),
                   mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);
      }

      float fbm(vec2 p) {
        float v = 0.0;
        float a = 0.5;
        vec2 shift = vec2(100.0);
        for (int i = 0; i < 3; ++i) {
          v += a * noise(p);
          p = p * 2.1 + shift;
          a *= 0.5;
        }
        return v;
      }

      // Smooth multi-stop cyclic palette with seamless continuous loop
      vec3 samplePalette(float t) {
        float x = fract(t);
        if (x < 0.20) {
          return mix(uColor1, uColor2, smoothstep(0.0, 0.20, x));
        } else if (x < 0.40) {
          return mix(uColor2, uColor3, smoothstep(0.20, 0.40, x));
        } else if (x < 0.60) {
          return mix(uColor3, uColor4, smoothstep(0.40, 0.60, x));
        } else if (x < 0.80) {
          return mix(uColor4, uColor5, smoothstep(0.60, 0.80, x));
        } else {
          return mix(uColor5, uColor1, smoothstep(0.80, 1.00, x));
        }
      }

      void main() {
        vec3 N = normalize(vNormal);
        vec3 V = normalize(cameraPosition - vWorldPosition);

        // Thin-film interference & Fresnel viewing angle
        float NdotV = clamp(dot(N, V), 0.0, 1.0);
        float fresnel = pow(1.0 - NdotV, 2.2);

        // Soft organic nacre marbling
        vec2 flowUv = vWorldPosition.xy * (uNacreFrequency * 0.20);
        float flowVal = fbm(flowUv + vec2(uTime * (uNacreFlow * 0.035), -uTime * (uNacreFlow * 0.025)));

        // Gentle iridescent coordinate: viewing angle + wave height + delicate marbling
        float iridCoord = (1.0 - NdotV) * (uIridScale * 0.48) 
                        + flowVal * (uMarblingStrength * 0.32) 
                        + (vWaveHeight / (uWaveHeight + 0.001)) * 0.18 
                        + uTime * (uNacreFlow * 0.05);

        vec3 iridColor = samplePalette(iridCoord);

        // Key Light (Left top luminous source)
        vec3 LKey = normalize(uKeyLightPos - vWorldPosition);
        float diffKey = max(dot(N, LKey), 0.0);
        float wrapDiffKey = (diffKey + 0.35) / 1.35;
        vec3 HKey = normalize(LKey + V);
        float specKey = pow(max(dot(N, HKey), 0.0), uRoughness);

        // Rim Light (Right glancing highlight)
        vec3 LRim = normalize(uRimLightPos - vWorldPosition);
        float diffRim = max(dot(N, LRim), 0.0);
        float wrapDiffRim = (diffRim + 0.25) / 1.25;
        vec3 HRim = normalize(LRim + V);
        float specRim = pow(max(dot(N, HRim), 0.0), uRoughness * 1.3);

        // Wave crests peak detection for metallic sheen
        float crestNorm = clamp((vWaveHeight + uWaveHeight * 0.45) / (uWaveHeight * 1.4 + 0.001), 0.0, 1.0);
        float crest = smoothstep(0.3, 0.9, crestNorm);
        float peakSheenMult = 1.0 + crest * uPeakSheen * 1.2;

        // Composition: Left area is bright and luminous, Right area has deep velvety shadows
        float xGrad = clamp((-vWorldPosition.x + 12.0) / 24.0, 0.0, 1.0);
        float sideRatio = pow(smoothstep(0.0, 1.0, xGrad), uLeftRightContrast);

        // Diffuse and ambient lighting assembly
        vec3 ambientLight = uFillLightColor * (uFillLightIntensity * 0.45);
        vec3 keyLight = uKeyLightColor * (wrapDiffKey * uKeyLightIntensity * 0.65);
        vec3 rimLight = uRimLightColor * (wrapDiffRim * uRimLightIntensity * 0.35);

        vec3 litSurface = iridColor * (ambientLight + keyLight + rimLight);

        // Shadow blend towards right
        float shadowFactor = mix(0.12, 1.0, sideRatio);
        vec3 finalColor = mix(uShadowColor, litSurface, shadowFactor);

        // Metallic specular sheen on crests
        float specTotal = (specKey * uKeyLightIntensity * 0.45 + specRim * uRimLightIntensity * 0.35) * uSpecularIntensity;
        specTotal *= peakSheenMult;
        specTotal = clamp(specTotal, 0.0, 1.2);

        vec3 specTint = mix(uHighlightColor, iridColor, 0.35);
        finalColor += specTint * specTotal;

        // Iridescent Fresnel edge aura
        vec3 edgeSheen = samplePalette(iridCoord + 0.25) * (fresnel * uIridStrength * 0.35 * shadowFactor);
        finalColor += edgeSheen;

        // Overall scene intensity
        finalColor *= uSceneIntensity;

        // Soft highlight shoulder compression so peaks never blow out
        finalColor = finalColor / (vec3(1.0) + finalColor * 0.40);

        // Tactile organic film grain
        vec2 grainCoord = gl_FragCoord.xy * (uGrainScale * 0.65);
        float g1 = hash(grainCoord + vec2(sin(uTime * 2.1), cos(uTime * 1.8)));
        float g2 = hash(grainCoord * 1.33 - vec2(cos(uTime * 2.4), sin(uTime * 3.1)));
        float grainVal = (g1 + g2) * 0.5 - 0.5;

        // Grain weight focused on midtones for tactile aesthetic
        float lum = dot(finalColor, vec3(0.299, 0.587, 0.114));
        float grainWeight = 1.0 - abs(lum - 0.5) * 1.4;
        grainWeight = clamp(grainWeight, 0.25, 1.0);

        finalColor += grainVal * (uGrainIntensity * grainWeight);

        gl_FragColor = vec4(clamp(finalColor, 0.0, 1.0), 1.0);
      }
    `;

    // --- Create Shader Uniforms ---
    const uniforms = {
      uTime: { value: 0.0 },
      uWaveFreq: { value: new THREE.Vector2(settings.waveFreqX, settings.waveFreqY) },
      uWaveHeight: { value: settings.waveHeight },
      uWaveSpeed: { value: settings.waveSpeed },

      uColor1: { value: new THREE.Color(settings.color1) },
      uColor2: { value: new THREE.Color(settings.color2) },
      uColor3: { value: new THREE.Color(settings.color3) },
      uColor4: { value: new THREE.Color(settings.color4) },
      uColor5: { value: new THREE.Color(settings.color5) },

      uHighlightColor: { value: new THREE.Color(settings.highlightColor) },
      uShadowColor: { value: new THREE.Color(settings.shadowColor) },

      uIridStrength: { value: settings.iridStrength },
      uIridScale: { value: settings.iridScale },
      uMarblingStrength: { value: settings.marblingStrength },
      uNacreFrequency: { value: settings.nacreFrequency },
      uNacreFlow: { value: settings.nacreFlow },

      uPeakSheen: { value: settings.peakSheen },
      uRoughness: { value: settings.roughness },
      uSpecularIntensity: { value: settings.specularIntensity },

      uGrainIntensity: { value: settings.grainIntensity },
      uGrainScale: { value: settings.grainScale },

      uLeftRightContrast: { value: settings.leftRightContrast },
      uSceneIntensity: { value: settings.sceneIntensity },

      uKeyLightPos: { value: new THREE.Vector3(settings.keyLightPosX, settings.keyLightPosY, settings.keyLightPosZ) },
      uKeyLightColor: { value: new THREE.Color(settings.keyLightColor) },
      uKeyLightIntensity: { value: settings.keyLightIntensity },

      uFillLightColor: { value: new THREE.Color(settings.fillLightColor) },
      uFillLightIntensity: { value: settings.fillLightIntensity },

      uRimLightPos: { value: new THREE.Vector3(settings.rimLightPosX, settings.rimLightPosY, settings.rimLightPosZ) },
      uRimLightColor: { value: new THREE.Color(settings.rimLightColor) },
      uRimLightIntensity: { value: settings.rimLightIntensity }
    };

    // --- Scene Initialization ---
    function initScene() {
      scene = new THREE.Scene();

      // Camera positioned to view full-frame silky waves
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, -0.6, 7.8);

      createRenderer();

      // Large subdivided surface geometry ensuring smooth continuous undulations
      const geometry = new THREE.PlaneGeometry(38, 26, 280, 280);
      material = new THREE.ShaderMaterial({
        vertexShader,
        fragmentShader,
        uniforms,
        side: THREE.DoubleSide
      });

      mesh = new THREE.Mesh(geometry, material);
      mesh.frustumCulled = false;
      scene.add(mesh);

      updateBackgroundColor();
    }

    // --- Renderer Setup & Antialias recreation ---
    function createRenderer() {
      if (renderer) {
        const oldCanvas = renderer.domElement;
        renderer.dispose();
        if (oldCanvas && oldCanvas.parentNode) {
          oldCanvas.parentNode.removeChild(oldCanvas);
        }
      }

      renderer = new THREE.WebGLRenderer({
        antialias: settings.antialias,
        powerPreference: 'high-performance'
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(settings.pixelRatio);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = settings.exposure;
      container.appendChild(renderer.domElement);

      setupControls();
      setupPointerEvents(renderer.domElement);
    }

    // --- OrbitControls Setup with preserved user zoom & drag ---
    function setupControls() {
      const prevDistance = controls ? controls.getDistance() : 7.8;
      const prevTarget = controls ? controls.target.clone() : new THREE.Vector3(0, 0, 0);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.screenSpacePanning = true; // Drag object/plane across screen
      controls.minDistance = 2.0;
      controls.maxDistance = 30.0;
      controls.target.copy(prevTarget);
      baseTarget.copy(prevTarget);

      // Auto-rotation will be selectively used by Orbit animation without breaking zoom/angle
      controls.autoRotate = false;
      controls.autoRotateSpeed = 0.6;
    }

    // --- Update Background & Greenscreen ---
    function updateBackgroundColor() {
      if (!renderer) return;
      const effectiveColor = settings.greenscreen ? '#00ff00' : settings.backgroundColor;
      renderer.setClearColor(effectiveColor, 1.0);
      document.body.style.backgroundColor = effectiveColor;
    }

    // --- Smooth Color Scheme Switcher ---
    function applyColorScheme(schemeKey, smooth = true) {
      const scheme = COLOR_SCHEMES[schemeKey];
      if (!scheme) return;

      settings.colorScheme = schemeKey;
      settings.color1 = scheme.color1;
      settings.color2 = scheme.color2;
      settings.color3 = scheme.color3;
      settings.color4 = scheme.color4;
      settings.color5 = scheme.color5;
      settings.highlightColor = scheme.highlight;
      settings.shadowColor = scheme.shadow;
      settings.backgroundColor = scheme.background;

      if (smooth && typeof gsap !== 'undefined') {
        const dur = 1.0;
        gsapColorTransition(uniforms.uColor1.value, scheme.color1, dur);
        gsapColorTransition(uniforms.uColor2.value, scheme.color2, dur);
        gsapColorTransition(uniforms.uColor3.value, scheme.color3, dur);
        gsapColorTransition(uniforms.uColor4.value, scheme.color4, dur);
        gsapColorTransition(uniforms.uColor5.value, scheme.color5, dur);
        gsapColorTransition(uniforms.uHighlightColor.value, scheme.highlight, dur);
        gsapColorTransition(uniforms.uShadowColor.value, scheme.shadow, dur);
      } else {
        uniforms.uColor1.value.set(scheme.color1);
        uniforms.uColor2.value.set(scheme.color2);
        uniforms.uColor3.value.set(scheme.color3);
        uniforms.uColor4.value.set(scheme.color4);
        uniforms.uColor5.value.set(scheme.color5);
        uniforms.uHighlightColor.value.set(scheme.highlight);
        uniforms.uShadowColor.value.set(scheme.shadow);
      }

      updateBackgroundColor();
      if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    function gsapColorTransition(targetColorObj, hexVal, duration) {
      const target = new THREE.Color(hexVal);
      gsap.to(targetColorObj, {
        r: target.r,
        g: target.g,
        b: target.b,
        duration,
        ease: 'power2.out'
      });
    }

    // --- Procedural Re-roll on Click / Instant Variation ---
    function randomizeScene() {
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const randomSchemeKey = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      applyColorScheme(randomSchemeKey, true);

      // Randomize subtle wave geometry & motion
      const newHeight = THREE.MathUtils.randFloat(0.70, 1.25);
      const newFreqX = THREE.MathUtils.randFloat(0.22, 0.38);
      const newFreqY = THREE.MathUtils.randFloat(0.18, 0.32);
      const newSpeed = THREE.MathUtils.randFloat(0.35, 0.70);

      // Randomize optical thin-film features
      const newIrid = THREE.MathUtils.randFloat(0.80, 1.30);
      const newMarbling = THREE.MathUtils.randFloat(0.50, 1.00);
      const newGrain = THREE.MathUtils.randFloat(0.035, 0.070);
      const newPeakSheen = THREE.MathUtils.randFloat(0.80, 1.40);

      // Randomize animation choice
      const randomAnim = ANIMATIONS[Math.floor(Math.random() * ANIMATIONS.length)];
      settings.animation = randomAnim;

      if (typeof gsap !== 'undefined') {
        const dur = 1.2;
        gsap.to(settings, {
          waveHeight: newHeight,
          waveFreqX: newFreqX,
          waveFreqY: newFreqY,
          waveSpeed: newSpeed,
          iridStrength: newIrid,
          marblingStrength: newMarbling,
          grainIntensity: newGrain,
          peakSheen: newPeakSheen,
          duration: dur,
          ease: 'power2.out',
          onUpdate: () => {
            uniforms.uWaveHeight.value = settings.waveHeight;
            uniforms.uWaveFreq.value.set(settings.waveFreqX, settings.waveFreqY);
            uniforms.uWaveSpeed.value = settings.waveSpeed;
            uniforms.uIridStrength.value = settings.iridStrength;
            uniforms.uMarblingStrength.value = settings.marblingStrength;
            uniforms.uGrainIntensity.value = settings.grainIntensity;
            uniforms.uPeakSheen.value = settings.peakSheen;
          }
        });
      } else {
        settings.waveHeight = newHeight;
        settings.waveFreqX = newFreqX;
        settings.waveFreqY = newFreqY;
        settings.waveSpeed = newSpeed;
        settings.iridStrength = newIrid;
        settings.marblingStrength = newMarbling;
        settings.grainIntensity = newGrain;
        settings.peakSheen = newPeakSheen;

        uniforms.uWaveHeight.value = settings.waveHeight;
        uniforms.uWaveFreq.value.set(settings.waveFreqX, settings.waveFreqY);
        uniforms.uWaveSpeed.value = settings.waveSpeed;
        uniforms.uIridStrength.value = settings.iridStrength;
        uniforms.uMarblingStrength.value = settings.marblingStrength;
        uniforms.uGrainIntensity.value = settings.grainIntensity;
        uniforms.uPeakSheen.value = settings.peakSheen;
      }

      if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    // --- Pointer Events: Drag vs Click Detection ---
    let pointerDownPos = new THREE.Vector2();
    let pointerDownTime = 0;

    function setupPointerEvents(canvasElement) {
      canvasElement.addEventListener('pointerdown', (e) => {
        pointerDownPos.set(e.clientX, e.clientY);
        pointerDownTime = performance.now();
      });

      canvasElement.addEventListener('pointerup', (e) => {
        const dist = pointerDownPos.distanceTo(new THREE.Vector2(e.clientX, e.clientY));
        const duration = performance.now() - pointerDownTime;

        // If distance moved is minimal and short click duration, treat as scene click
        if (dist < 6 && duration < 320 && settings.clickToRandomize) {
          randomizeScene();
        }
      });
    }

    // --- GUI Setup (lil-gui with default styling) ---
    let gui;
    function buildGUI() {
      gui = new GUI({ title: 'Pearlescent Surface Settings' });

      // 1. Color Schemes & Palette folder
      const fColors = gui.addFolder('Color Schemes & Palette');

      fColors.add(settings, 'colorScheme', Object.keys(COLOR_SCHEMES))
        .name('Color Scheme (19)')
        .onChange(v => applyColorScheme(v, true));

      fColors.add(settings, 'greenscreen')
        .name('Greenscreen (#00ff00)')
        .onChange(updateBackgroundColor);

      fColors.addColor(settings, 'backgroundColor')
        .name('Background Color')
        .onChange(v => {
          if (!settings.greenscreen) updateBackgroundColor();
        });

      fColors.addColor(settings, 'color1')
        .name('Stop 1 (Rosy Pearl)')
        .onChange(v => uniforms.uColor1.value.set(v));

      fColors.addColor(settings, 'color2')
        .name('Stop 2 (Soft Blue)')
        .onChange(v => uniforms.uColor2.value.set(v));

      fColors.addColor(settings, 'color3')
        .name('Stop 3 (Lavender)')
        .onChange(v => uniforms.uColor3.value.set(v));

      fColors.addColor(settings, 'color4')
        .name('Stop 4 (Golden Iris)')
        .onChange(v => uniforms.uColor4.value.set(v));

      fColors.addColor(settings, 'color5')
        .name('Stop 5 (Deep Lustre)')
        .onChange(v => uniforms.uColor5.value.set(v));

      fColors.addColor(settings, 'highlightColor')
        .name('Highlight Tint')
        .onChange(v => uniforms.uHighlightColor.value.set(v));

      fColors.addColor(settings, 'shadowColor')
        .name('Deep Shadow Tone')
        .onChange(v => uniforms.uShadowColor.value.set(v));

      // 2. Wave Surface & Motion
      const fWaves = gui.addFolder('Surface & Waves');
      fWaves.add(settings, 'waveHeight', 0.1, 2.5, 0.05).name('Wave Height').onChange(v => uniforms.uWaveHeight.value = v);
      fWaves.add(settings, 'waveFreqX', 0.1, 1.2, 0.02).name('Wave Freq X').onChange(v => uniforms.uWaveFreq.value.x = v);
      fWaves.add(settings, 'waveFreqY', 0.1, 1.2, 0.02).name('Wave Freq Y').onChange(v => uniforms.uWaveFreq.value.y = v);
      fWaves.add(settings, 'waveSpeed', 0.1, 3.0, 0.05).name('Surface Speed').onChange(v => uniforms.uWaveSpeed.value = v);

      // 3. Pearlescent Optics & Tactile Grain
      const fOptics = gui.addFolder('Optics & Tactile Grain');
      fOptics.add(settings, 'iridStrength', 0.0, 3.0, 0.05).name('Iridescence Glow').onChange(v => uniforms.uIridStrength.value = v);
      fOptics.add(settings, 'iridScale', 0.5, 4.0, 0.05).name('Dispersion Scale').onChange(v => uniforms.uIridScale.value = v);
      fOptics.add(settings, 'marblingStrength', 0.0, 3.0, 0.05).name('Nacre Marbling').onChange(v => uniforms.uMarblingStrength.value = v);
      fOptics.add(settings, 'nacreFrequency', 0.1, 2.0, 0.05).name('Grain Ribbons Freq').onChange(v => uniforms.uNacreFrequency.value = v);
      fOptics.add(settings, 'peakSheen', 0.0, 3.5, 0.05).name('Peak Metallic Sheen').onChange(v => uniforms.uPeakSheen.value = v);
      fOptics.add(settings, 'specularIntensity', 0.0, 3.0, 0.05).name('Specular Intensity').onChange(v => uniforms.uSpecularIntensity.value = v);
      fOptics.add(settings, 'roughness', 8.0, 80.0, 1.0).name('Shininess Exponent').onChange(v => uniforms.uRoughness.value = v);
      fOptics.add(settings, 'grainIntensity', 0.0, 0.25, 0.005).name('Tactile Grain Amount').onChange(v => uniforms.uGrainIntensity.value = v);
      fOptics.add(settings, 'grainScale', 0.5, 5.0, 0.1).name('Grain Scale').onChange(v => uniforms.uGrainScale.value = v);
      fOptics.add(settings, 'leftRightContrast', 0.5, 2.5, 0.05).name('Left/Right Contrast').onChange(v => uniforms.uLeftRightContrast.value = v);

      // 4. Lighting & Exposure
      const fLight = gui.addFolder('Lighting & Exposure');
      fLight.add(settings, 'exposure', 0.2, 2.5, 0.05).name('Tone Exposure').onChange(v => renderer.toneMappingExposure = v);
      fLight.add(settings, 'sceneIntensity', 0.2, 2.5, 0.05).name('Scene Light Intensity').onChange(v => uniforms.uSceneIntensity.value = v);

      const fKey = fLight.addFolder('Key Light (Left Bright)');
      fKey.addColor(settings, 'keyLightColor').name('Color').onChange(v => uniforms.uKeyLightColor.value.set(v));
      fKey.add(settings, 'keyLightIntensity', 0.0, 3.0, 0.05).name('Intensity').onChange(v => uniforms.uKeyLightIntensity.value = v);
      fKey.add(settings, 'keyLightPosX', -20.0, 0.0, 0.5).name('Pos X').onChange(v => uniforms.uKeyLightPos.value.x = v);
      fKey.add(settings, 'keyLightPosY', -10.0, 15.0, 0.5).name('Pos Y').onChange(v => uniforms.uKeyLightPos.value.y = v);
      fKey.add(settings, 'keyLightPosZ', 1.0, 15.0, 0.5).name('Pos Z').onChange(v => uniforms.uKeyLightPos.value.z = v);
      fKey.close();

      const fFill = fLight.addFolder('Fill Light (Soft Ambient)');
      fFill.addColor(settings, 'fillLightColor').name('Color').onChange(v => uniforms.uFillLightColor.value.set(v));
      fFill.add(settings, 'fillLightIntensity', 0.0, 2.0, 0.05).name('Intensity').onChange(v => uniforms.uFillLightIntensity.value = v);
      fFill.close();

      const fRim = fLight.addFolder('Rim Light (Right Glancing)');
      fRim.addColor(settings, 'rimLightColor').name('Color').onChange(v => uniforms.uRimLightColor.value.set(v));
      fRim.add(settings, 'rimLightIntensity', 0.0, 3.0, 0.05).name('Intensity').onChange(v => uniforms.uRimLightIntensity.value = v);
      fRim.add(settings, 'rimLightPosX', 0.0, 20.0, 0.5).name('Pos X').onChange(v => uniforms.uRimLightPos.value.x = v);
      fRim.add(settings, 'rimLightPosY', -15.0, 10.0, 0.5).name('Pos Y').onChange(v => uniforms.uRimLightPos.value.y = v);
      fRim.add(settings, 'rimLightPosZ', 1.0, 15.0, 0.5).name('Pos Z').onChange(v => uniforms.uRimLightPos.value.z = v);
      fRim.close();

      // 5. Camera & Animation Controls
      const fAnim = gui.addFolder('Camera & Animation');
      fAnim.add(settings, 'animation', ANIMATIONS).name('Animation Mode (8)');
      fAnim.add(settings, 'animationSpeed', 0.0, 3.0, 0.05).name('Animation Speed');
      fAnim.add(settings, 'clickToRandomize').name('Click to Randomize');
      fAnim.add({ randomize: randomizeScene }, 'randomize').name('🎲 Randomize Scene Now');

      // 6. System & Performance Settings
      const fSystem = gui.addFolder('Rendering');
      fSystem.add(settings, 'pixelRatio', 0.5, 3.0, 0.1).name('Pixel Ratio (DPR)').onChange(v => renderer.setPixelRatio(v));
      fSystem.add(settings, 'antialias').name('Antialias (Recreate)').onChange(v => createRenderer());
    }

    // --- Key 'H' to Hide/Show UI ---
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        if (gui) {
          gui._hidden ? gui.show() : gui.hide();
        }
      }
    });

    // --- Window Resize ---
    window.addEventListener('resize', () => {
      if (!camera || !renderer) return;
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- Animation & Render Loop ---
    let clock = new THREE.Clock();
    let animTime = 0.0;
    let prevAnimMode = '';

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const effDelta = delta * settings.animationSpeed;
      animTime += effDelta;

      // Update shader surface time
      uniforms.uTime.value = animTime;

      // Track manual pan/drag by user to preserve user modifications
      if (controls) {
        // If animation mode changed, reset controls autoRotate appropriately
        if (prevAnimMode !== settings.animation) {
          controls.autoRotate = (settings.animation === 'Slow Orbit');
          controls.autoRotateSpeed = 0.5 * settings.animationSpeed;
          prevAnimMode = settings.animation;
        }

        // Apply preconfigured animations while preserving user's manual zoom and drag position
        animOffset.set(0, 0, 0);

        switch (settings.animation) {
          case 'Static (Zen Flow)':
            controls.autoRotate = false;
            break;

          case 'Gentle Drift':
            controls.autoRotate = false;
            animOffset.x = Math.sin(animTime * 0.22) * 1.35;
            animOffset.y = Math.cos(animTime * 0.17) * 0.65;
            break;

          case 'Slow Orbit':
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.55 * settings.animationSpeed;
            break;

          case 'Breathing Wave':
            controls.autoRotate = false;
            animOffset.y = Math.sin(animTime * 0.35) * 0.45;
            animOffset.z = Math.sin(animTime * 0.28) * 0.6;
            break;

          case 'Diagonal Glide':
            controls.autoRotate = false;
            animOffset.x = Math.sin(animTime * 0.20) * 2.1;
            animOffset.y = Math.sin(animTime * 0.20) * 1.15;
            break;

          case 'Figure-Eight':
            controls.autoRotate = false;
            animOffset.x = Math.sin(animTime * 0.28) * 1.7;
            animOffset.y = Math.sin(animTime * 0.56) * 0.85;
            break;

          case 'Nacre Sway':
            controls.autoRotate = false;
            animOffset.x = Math.sin(animTime * 0.32) * 1.4;
            animOffset.z = (Math.cos(animTime * 0.32) - 1.0) * 0.45;
            break;

          case 'Deep Ocean Swell':
            controls.autoRotate = false;
            animOffset.x = Math.sin(animTime * 0.16) * 2.2;
            animOffset.y = Math.sin(animTime * 0.32) * 0.75;
            animOffset.z = Math.sin(animTime * 0.22) * 0.65;
            break;
        }

        // Smoothly combine base target with animation offset so user drag/pan is maintained
        if (controls.state === -1) {
          // Idle state: smoothly blend animation offset into target
          controls.target.set(
            baseTarget.x + animOffset.x,
            baseTarget.y + animOffset.y,
            baseTarget.z + animOffset.z
          );
        } else {
          // User is dragging or interacting: update baseTarget so pan is remembered
          baseTarget.copy(controls.target).sub(animOffset);
        }

        controls.update();
      }

      renderer.render(scene, camera);
    }

    // --- Start Application ---
    initScene();
    buildGUI();
    animate();
  </script>
</body>
</html>
