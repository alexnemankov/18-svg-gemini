// =====================================================================
// GLSL common code
// =====================================================================
const GLSL_COMMON = /* glsl */`
#define U_TILE ${U.toFixed(4)}
#define LS ${LS.toFixed(4)}
#define LIGHT_Y ${LIGHT_Y.toFixed(3)}
uniform vec3 uLightColor;
uniform float uCeilingLight;
uniform float uAmbient;
uniform vec3 uFogColor;
uniform vec3 uDarkColor;
uniform float uFogDensity;
uniform float uDarkStart;
uniform float uDarkEnd;
uniform float uStripHalf;

float hash11(float p){ p = fract(p * 0.1031); p *= p + 33.33; p *= p + p; return fract(p); }
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
vec2 hash22(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973)); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.xx + p3.yz) * p3.zy); }
vec3 hash32(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973)); p3 += dot(p3, p3.yxz + 33.33); return fract((p3.xxy + p3.yzz) * p3.zyx); }

// Diffuse irradiance from the periodic ceiling light strips + ambient
vec3 ceilDiffuse(vec3 wp, vec3 n, float twoSided){
  float k = floor(wp.z / LS);
  float acc = 0.0;
  for (int i = -1; i <= 2; i++){
    vec3 L = vec3(0.0, LIGHT_Y, (k + float(i)) * LS) - wp;
    float d2 = dot(L, L);
    L *= inversesqrt(d2);
    float nl = dot(n, L);
    nl = mix(max(nl, 0.0), abs(nl), twoSided);
    acc += nl / (0.6 + d2);
  }
  return acc * uLightColor * uCeilingLight * 0.35 + uAmbient * vec3(0.25, 0.35, 0.45);
}

// Specular from the strips, approximated as line lights
float ceilSpec(vec3 wp, vec3 r, float power){
  if (r.y <= 0.001) return 0.0;
  float t = (LIGHT_Y - wp.y) / r.y;
  float xh = clamp(wp.x + r.x * t, -uStripHalf, uStripHalf);
  float k = floor(wp.z / LS);
  float acc = 0.0;
  for (int i = -1; i <= 2; i++){
    vec3 L = vec3(xh, LIGHT_Y, (k + float(i)) * LS) - wp;
    float d2 = dot(L, L);
    L *= inversesqrt(d2);
    acc += pow(max(dot(r, L), 0.0), power) / (1.0 + d2 * 0.15);
  }
  return acc * uCeilingLight;
}

// Haze + fade to background/darkness at far end of corridor
vec3 applyFog(vec3 c, float depth){
  float f = 1.0 - exp(-uFogDensity * uFogDensity * depth * depth);
  c = mix(c, uFogColor, f);
  return mix(c, uDarkColor, smoothstep(uDarkStart, uDarkEnd, depth));
}

// Anti-aliased hexagonal perforation (returns hole coverage)
float hexDots(vec2 q, float period, float px){
  vec2 g = q / period;
  g.x += 0.5 * mod(floor(g.y), 2.0);
  float d = length(fract(g) - 0.5);
  float aa = px / period;
  float m = 1.0 - smoothstep(0.3 - aa, 0.3 + aa, d);
  return mix(m, 0.28, smoothstep(0.15, 0.45, aa));
}
`;

// Patch built-in materials so they use the same haze + end darkness
function patchFog(material){
  material.onBeforeCompile = (shader) => {
    shader.uniforms.uDarkStart = shared.uDarkStart;
    shader.uniforms.uDarkEnd = shared.uDarkEnd;
    shader.uniforms.uDarkColor = shared.uDarkColor;
    shader.fragmentShader = 'uniform float uDarkStart;\nuniform float uDarkEnd;\nuniform vec3 uDarkColor;\n' +
      shader.fragmentShader.replace('#include <fog_fragment>', `
        #ifdef USE_FOG
          float hazeF = 1.0 - exp( - fogDensity * fogDensity * vFogDepth * vFogDepth );
          gl_FragColor.rgb = mix( gl_FragColor.rgb, fogColor, hazeF );
          gl_FragColor.rgb = mix( gl_FragColor.rgb, uDarkColor, smoothstep( uDarkStart, uDarkEnd, vFogDepth ) );
        #endif
      `);
  };
  return material;
}

// =====================================================================
// Rack face shader (procedural equipment + blinking LEDs)
// =====================================================================
const rackFaceMaterial = new THREE.ShaderMaterial({
  uniforms: { ...shared },
  vertexShader: /* glsl */`
    attribute float aSeed;
    varying vec2 vLocal;
    varying vec3 vWorld;
    varying vec3 vNormalW;
    varying float vSeed;
    varying float vFogDepth;
    void main(){
      vLocal = uv * vec2(${RACK_W.toFixed(3)}, ${RACK_H.toFixed(3)});
      mat4 m = modelMatrix * instanceMatrix;
      vec4 wp = m * vec4(position, 1.0);
      vWorld = wp.xyz;
      vNormalW = normalize(mat3(m) * normal);
      vSeed = aSeed;
      vec4 mv = viewMatrix * wp;
      vFogDepth = -mv.z;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: /* glsl */`
    ${GLSL_COMMON}
    uniform float uTime;
    uniform float uBlinkSpeed;
    uniform float uBlinkRatio;
    uniform float uLedDensity;
    uniform float uLedIntensity;
    uniform float uGlassSheen;
    uniform float uDof;
    uniform vec3 uGreen;
    uniform vec3 uBlue;
    uniform vec3 uOrange;
    uniform vec3 uWhite;
    uniform vec3 uMetal;

    varying vec2 vLocal;
    varying vec3 vWorld;
    varying vec3 vNormalW;
    varying float vSeed;
    varying float vFogDepth;

    #define UH 0.04445
    #define SX0 0.062
    #define SX1 0.538
    #define SY0 0.11
    #define UNITS 44.0
    #define LED_R 0.0028

    // 0 = servers, 1 = blade chassis, 2 = network
    float rackType(float seed){
      float r = hash11(seed * 4.77 + 0.13);
      return r < 0.55 ? 0.0 : (r < 0.8 ? 1.0 : 2.0);
    }

    vec4 unitInfo(float u, float seed, float type){
      float fillTop = floor(mix(28.0, 44.5, hash11(seed * 3.71 + 0.3)));
      if (type < 0.5){
        float block = floor(u / 4.0);
        float h = hash12(vec2(block * 1.73, seed * 7.13 + 1.1));
        float size = h < 0.34 ? 1.0 : (h < 0.62 ? 2.0 : 4.0);
        float start = block * 4.0 + floor((u - block * 4.0) / size) * size;
        float used = step(h, 0.92) * step(start + size, fillTop + 0.5);
        return vec4(start, size, used, 0.0);
      } else if (type < 1.5){
        float c = floor((u - 1.0) / 10.0);
        float start = 1.0 + c * 10.0;
        float used = step(1.0, u) * step(c, 3.0) * step(start + 10.0, fillTop + 6.5);
        return vec4(start, 10.0, used, 1.0);
      }
      float h = hash12(vec2(u * 1.31, seed * 5.9 + 2.7));
      float kind = h < 0.55 ? 2.0 : (h < 0.8 ? 3.0 : 4.0);
      float used = step(u + 1.0, fillTop + 6.5);
      return vec4(u, 1.0, used, kind);
    }

    void main(){
      vec2 p = vLocal;
      vec2 fwp = fwidth(p);
      float px = max(max(fwp.x, fwp.y), 1e-5);
      vec3 toCam = cameraPosition - vWorld;
      float viewDist = length(toCam);
      vec3 V = toCam / viewDist;
      vec3 N = normalize(vNormalW);
      vec3 R = reflect(-V, N);
      vec3 lightD = ceilDiffuse(vWorld, N, 0.0);
      float seed = vSeed;
      float type = rackType(seed);

      vec3 inner = vec3(0.005, 0.007, 0.009);
      vec2 sp = p - vec2(SX0, SY0);
      float sw = SX1 - SX0;
      float shH = UNITS * UH;
      if (sp.x > 0.0 && sp.x < sw && sp.y > 0.0 && sp.y < shH){
        float u = floor(sp.y / UH);
        vec4 ui = unitInfo(u, seed, type);
        float yIn = sp.y - ui.x * UH;
        float hS = ui.y * UH;
        float edge = min(yIn, hS - yIn);
        float sepr = 1.0 - smoothstep(0.0006, 0.0006 + px, edge);
        float sh = hash11(ui.x * 1.37 + seed);
        vec3 plate = vec3(0.008, 0.01, 0.012);
        if (ui.z > 0.5){
          if (type < 0.5){
            plate = mix(vec3(0.018, 0.021, 0.026), vec3(0.04, 0.045, 0.05), sh);
            float bez = step(0.13, sp.x) * step(sp.x, 0.34) * step(0.004, yIn) * step(yIn, hS - 0.004);
            float hx = hexDots(sp, 0.004, px);
            plate = mix(plate, plate * 1.6, bez * (1.0 - hx));
            plate = mix(plate, vec3(0.003), bez * hx);
            if (ui.y > 1.5){
              float bx = sp.x - 0.35;
              if (bx > 0.0 && bx < 0.1 && yIn > 0.006 && yIn < hS - 0.006){
                float cw = 0.02;
                float lx = fract(bx / cw);
                float bayEdge = min(lx, 1.0 - lx) * cw;
                float bay = smoothstep(0.0007, 0.0007 + px, bayEdge);
                plate = mix(vec3(0.004), vec3(0.03, 0.034, 0.038), bay);
              }
            }
            float lh = hash11(ui.x * 3.1 + seed * 1.7);
            if (lh < 0.4){
              vec2 ld = abs(sp - vec2(0.02 + lh * 0.25, ui.x * UH + min(hS, UH) * 0.5)) - vec2(0.016, 0.0045);
              float lab = 1.0 - smoothstep(-px, px, max(ld.x, ld.y));
              plate = mix(plate, vec3(0.28, 0.3, 0.32), lab);
            }
          } else if (type < 1.5){
            float bladeW = sw / 14.0;
            float bxf = fract(sp.x / bladeW);
            float bEdge = min(bxf, 1.0 - bxf) * bladeW;
            float bsep = 1.0 - smoothstep(0.0007, 0.0007 + px, bEdge);
            plate = vec3(0.022, 0.026, 0.03);
            float mid = step(0.05, yIn) * step(yIn, hS - 0.09);
            float hx = hexDots(sp, 0.0035, px);
            plate = mix(plate, vec3(0.004), hx * mid);
            float hdl = step(0.018, yIn) * step(yIn, 0.032) * step(0.25, bxf) * step(bxf, 0.75);
            plate = mix(plate, vec3(0.07, 0.075, 0.08), hdl);
            float band = 1.0 - step(0.012, yIn) * step(yIn, hS - 0.012);
            plate = mix(plate, vec3(0.05, 0.055, 0.06), band);
            plate *= 1.0 - bsep * 0.8 * (1.0 - band);
          } else {
            float kind = ui.w;
            if (kind < 2.5){
              plate = vec3(0.02, 0.024, 0.028);
              float qx = sp.x - 0.02;
              if (qx > 0.0 && qx < 0.435){
                float cx = mod(qx, 0.0145) - 0.00725;
                float pr1 = max(abs(cx) - 0.0055, abs(yIn - 0.0095) - 0.0042);
                float pr2 = max(abs(cx) - 0.0055, abs(yIn - 0.0245) - 0.0042);
                float port = 1.0 - smoothstep(-px, px, min(pr1, pr2));
                port = mix(port, 0.45, smoothstep(0.003, 0.006, px));
                plate = mix(plate, vec3(0.002), port);
              }
            } else if (kind < 3.5){
              plate = vec3(0.04, 0.043, 0.047);
              float qx = sp.x - 0.03;
              if (qx > 0.0 && qx < 0.42){
                float cx = mod(qx, 0.0175) - 0.00875;
                float pr = max(abs(cx) - 0.005, abs(yIn - 0.02) - 0.0055);
                float port = 1.0 - smoothstep(-px, px, pr);
                port = mix(port, 0.33, smoothstep(0.003, 0.006, px));
                plate = mix(plate, vec3(0.003), port);
              }
              float strip = step(0.035, yIn) * step(yIn, 0.041) * step(0.03, sp.x) * step(sp.x, 0.45);
              plate = mix(plate, vec3(0.25, 0.26, 0.27), strip * 0.6);
            } else {
              plate = vec3(0.006, 0.007, 0.008);
              float br = abs(fract(yIn / 0.003) - 0.5);
              plate += vec3(0.006) * (1.0 - smoothstep(0.1, 0.3, br)) * (1.0 - smoothstep(0.001, 0.002, px));
              float loopD = abs(sin(sp.x * 90.0 + seed + u) * 0.008 + 0.022 - yIn);
              plate = mix(plate, vec3(0.02, 0.03, 0.045), 1.0 - smoothstep(0.0018 - px, 0.0018 + px, loopD));
            }
          }
        }
        plate *= 1.0 - sepr * 0.85;
        inner = plate;
      }

      float railY = step(SY0 - 0.01, p.y) * step(p.y, SY0 + shH + 0.01);
      float rail = max(step(abs(p.x - (SX0 - 0.006)), 0.006), step(abs(p.x - (SX1 + 0.006)), 0.006)) * railY;
      float holes = step(0.6, fract(p.y / (UH / 3.0))) * (1.0 - clamp(px / 0.004, 0.0, 1.0));
      inner = mix(inner, vec3(0.035, 0.04, 0.045) * (1.0 - holes * 0.6), rail);
      inner *= lightD;

      // LEDs
      vec3 leds = vec3(0.0);
      float blurAmt = uDof * (1.0 - smoothstep(0.6, 2.8, viewDist));
      float blurR = blurAmt * 0.011;
      float rackDens = 0.7 + 0.6 * hash11(seed * 9.1);
      float orangeBias = hash11(seed * 2.9) * 0.25;

      vec2 cellSize;
      vec2 origin = vec2(0.0);
      float ncols;
      if (type < 0.5){ cellSize = vec2(sw / 35.0, UH * 0.5); ncols = 35.0; }
      else if (type < 1.5){ cellSize = vec2(sw / 14.0, UH * 0.5); ncols = 14.0; }
      else { cellSize = vec2(0.0145, UH * 0.5); origin = vec2(0.02, 0.0); ncols = 30.0; }

      vec2 lp = sp - origin;
      if (lp.x > -0.015 && lp.x < ncols * cellSize.x + 0.015 && lp.y > -0.015 && lp.y < shH + 0.015){
        vec2 gc = floor(lp / cellSize);
        for (int j = -1; j <= 1; j++){
          for (int i = -1; i <= 1; i++){
            vec2 cell = gc + vec2(float(i), float(j));
            if (cell.x < 0.0 || cell.x >= ncols || cell.y < 0.0 || cell.y >= UNITS * 2.0) continue;
            vec4 ui = unitInfo(floor(cell.y * 0.5), seed, type);
            if (ui.z < 0.5) continue;

            float h = hash12(cell * vec2(1.0, 1.7) + seed * 17.0);
            float ch = hash12(cell * 1.31 + seed * 5.7);
            float row = cell.y - ui.x * 2.0;
            float exists = 0.0;
            float blinkBias = 0.0;
            float rateMul = 1.0;
            vec3 lc;

            if (type < 0.5){
              float sid = ui.x + seed * 13.37;
              vec3 sh = hash32(vec2(sid, seed + 3.1));
              float leftW = 2.0 + floor(sh.x * 6.0);
              float rightS = ncols - 2.0 - floor(sh.y * 8.0);
              float midS = 11.0 + floor(sh.z * 8.0);
              float midW = floor(hash11(sid * 1.91) * 5.0);
              float zone = max(max(step(cell.x, leftW - 1.0), step(rightS, cell.x)),
                               step(midS, cell.x) * step(cell.x, midS + midW - 1.0));
              float rowOk = row < 1.5 ? 1.0 : step(hash12(vec2(sid, row)), 0.35);
              float dens = uLedDensity * rackDens * (0.45 + hash11(sid * 5.31) * 0.9);
              exists = zone * rowOk * step(h, dens) + step(h, 0.03 * uLedDensity);
              lc = ch < (0.46 - orangeBias * 0.5) ? uGreen
                 : (ch < (0.76 - orangeBias) ? uBlue
                 : (ch < 0.95 ? uOrange : uWhite));
            } else if (type < 1.5){
              float bladeOn = step(hash12(vec2(cell.x, ui.x + seed * 3.3)), 0.88);
              float topZone = step(15.5, row) * step(row, 18.5);
              float botZone = step(row, 1.5);
              exists = bladeOn * (topZone * step(h, min(1.0, 1.5 * uLedDensity * rackDens)) + botZone * step(h, 0.35 * uLedDensity));
              lc = ch < 0.55 ? uBlue : (ch < 0.88 ? uGreen : (ch < 0.96 ? uOrange : uWhite));
            } else {
              exists = step(ui.w, 2.5) * step(0.5, row) * step(h, min(1.0, uLedDensity * 1.9));
              lc = ch < 0.55 ? uGreen : (ch < 0.95 ? uOrange : uWhite);
              blinkBias = 0.3;
              rateMul = 1.8;
            }
            if (exists < 0.5) continue;

            float bh = hash12(cell * 0.77 + seed * 3.1);
            float isBlink = step(bh, min(1.0, uBlinkRatio + blinkBias));
            float rate = mix(0.6, 7.5, hash12(cell + 11.3 + seed)) * uBlinkSpeed * rateMul;
            float tt = uTime * rate + bh * 57.0;
            float fi = floor(tt);
            float ff = fract(tt);
            float a0 = hash12(vec2(fi, bh * 113.0));
            float a1 = hash12(vec2(fi + 1.0, bh * 113.0));
            float state = mix(a0, a1, smoothstep(0.0, 0.18, ff));
            float on = smoothstep(0.35, 0.55, state);
            float steady = 0.75 + 0.25 * hash12(cell * 2.1 + seed);
            float bright = mix(steady, on, isBlink) * (0.55 + 0.65 * hash12(cell * 3.3 + seed));

            vec2 c = (cell + 0.5) * cellSize;
            if (type > 1.5) c.y += 0.007;
            if (type < 0.5) c.x += (hash12(cell + seed * 1.9) - 0.5) * 0.002;
            float d = length(lp - c);
            float re = max(LED_R + blurR, px * 0.85);
            float energy = pow(LED_R / re, 1.3);
            float disc = 1.0 - smoothstep(re * mix(0.45, 0.8, blurAmt), re, d);
            float core = (1.0 - smoothstep(0.0, re * 0.45, d)) * (1.0 - blurAmt);
            float halo = exp(-d * d / (re * re * 5.0 + 0.00002)) * 0.08;
            vec3 c3 = mix(lc, vec3(1.0), core * 0.45);
            leds += c3 * bright * (disc * energy + halo);
          }
        }
      }
      leds *= uLedIntensity;

      // Glass door
      float fres = pow(1.0 - clamp(dot(V, N), 0.0, 1.0), 5.0);
      float gspec = ceilSpec(vWorld, R, 90.0);
      vec3 glass = (uLightColor * 0.02 * fres + uLightColor * gspec * 0.03) * uGlassSheen;
      glass += uGlassSheen * vec3(0.003, 0.007, 0.011) * smoothstep(0.3, 2.2, p.y);

      vec3 col = inner * 0.8 + leds * 0.9 + glass;

      float dEdge = min(min(p.x - 0.045, 0.555 - p.x), min(p.y - 0.08, 2.16 - p.y));
      float doorFrame = 1.0 - smoothstep(0.014 - px, 0.014 + px, dEdge);
      vec3 dfCol = uMetal * lightD * 0.9 + uLightColor * ceilSpec(vWorld, R, 20.0) * 0.03;
      col = mix(col, dfCol, doorFrame);
      float bevel = exp(-abs(dEdge - 0.014) / max(0.0015, px * 1.5));
      col += uLightColor * bevel * 0.01;

      col = applyFog(col, vFogDepth);
      gl_FragColor = vec4(col, 1.0);
    }
  `
});

// =====================================================================
// Floor reflector shader (tiles + perforated grates)
// =====================================================================
const FloorShader = {
  name: 'FloorReflectorShader',
  uniforms: {
    color: { value: null },
    tDiffuse: { value: null },
    textureMatrix: { value: null }
  },
  vertexShader: /* glsl */`
    uniform mat4 textureMatrix;
    varying vec4 vUv;
    varying vec3 vWorld;
    varying float vFogDepth;
    void main(){
      vUv = textureMatrix * vec4(position, 1.0);
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorld = wp.xyz;
      vec4 mv = viewMatrix * wp;
      vFogDepth = -mv.z;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: /* glsl */`
    ${GLSL_COMMON}
    uniform sampler2D tDiffuse;
    uniform vec3 color;
    uniform float uReflect;
    uniform float uBlur;
    uniform float uAisle;
    uniform float uLedIntensity;
    uniform vec3 uGreen;
    uniform vec3 uBlue;
    varying vec4 vUv;
    varying vec3 vWorld;
    varying float vFogDepth;

    float ign(vec2 p){ return fract(52.9829189 * fract(dot(p, vec2(0.06711056, 0.00583715)))); }

    float seamLine(float e, float w, float fw){
      float line = 1.0 - smoothstep(w - fw, w + fw, e);
      return mix(line, 2.0 * w, smoothstep(0.1, 0.4, fw));
    }

    void main(){
      vec2 p = vWorld.xz;
      vec2 g = p / U_TILE;
      vec2 id = floor(g);
      vec2 f = fract(g);
      vec2 fw = fwidth(g);
      vec2 e = min(f, 1.0 - f);
      float seam = max(seamLine(e.x, 0.005, fw.x), seamLine(e.y, 0.005, fw.y));
      vec2 fwm = fwidth(p);
      float pxm = max(max(fwm.x, fwm.y), 1e-5);

      float inAisle = step(abs(id.x + 0.5) * U_TILE, uAisle * 0.5);
      float grateRow = step(abs(mod(id.y, 4.0) - 2.0), 0.5) * inAisle;
      vec2 lp = f * U_TILE;
      float gBorder = min(min(lp.x, U_TILE - lp.x), min(lp.y, U_TILE - lp.y));
      float gFrame = 1.0 - smoothstep(0.022 - pxm, 0.022 + pxm, gBorder);
      vec2 pitch = vec2(0.0125, 0.03);
      vec2 hq = mod(lp - 0.025, pitch) - pitch * 0.5;
      vec2 hd = abs(hq) - vec2(0.0035, 0.011);
      float hole = 1.0 - smoothstep(-pxm * 0.7, pxm * 0.7, max(hd.x, hd.y));
      hole = mix(hole, 0.41, smoothstep(0.2, 0.55, pxm / pitch.x));
      hole *= (1.0 - gFrame) * grateRow;

      float tv = 0.85 + 0.3 * hash12(id + 7.0);
      vec2 tilt = (hash22(id) - 0.5) * 0.004;

      vec3 V = normalize(cameraPosition - vWorld);
      float cosT = clamp(V.y, 0.0, 1.0);
      float fres = 0.04 + 0.96 * pow(1.0 - cosT, 5.0);

      vec2 ruv = vUv.xy / vUv.w + tilt * (1.0 - grateRow);
      float rad = uBlur * 0.02 + grateRow * 0.015;
      float ang = ign(gl_FragCoord.xy) * 6.2831;
      vec3 refl = vec3(0.0);
      float ws = 0.0;
      for (int i = 0; i < 12; i++){
        float fi = float(i);
        float r = sqrt((fi + 0.5) / 12.0);
        float a = fi * 2.39996 + ang;
        vec2 o = vec2(cos(a), sin(a)) * r * rad * vec2(0.35, 1.0);
        float w = 1.0 - 0.6 * r;
        refl += texture2D(tDiffuse, ruv + o).rgb * w;
        ws += w;
      }
      refl /= ws;

      float reflAmt = uReflect * mix(0.4, 1.0, fres) * (1.0 - seam * 0.8) * tv;
      reflAmt *= mix(1.0, 0.35 * (1.0 - hole), grateRow);

      vec3 light = ceilDiffuse(vWorld, vec3(0.0, 1.0, 0.0), 0.0);
      vec3 base = vec3(0.03, 0.045, 0.055) * tv * (1.0 - seam * 0.7);
      vec3 grateCol = mix(vec3(0.022, 0.028, 0.033), vec3(0.036, 0.043, 0.05), gFrame);
      grateCol = mix(grateCol, vec3(0.0005, 0.001, 0.0015), hole);
      base = mix(base, grateCol, grateRow);
      vec3 col = base * light;

      float edgeD = uAisle * 0.5 - abs(p.x);
      col += mix(uGreen, uBlue, 0.5) * exp(-max(edgeD, 0.0) * 4.0) * 0.004 * uLedIntensity;
      col += refl * reflAmt;

      col = applyFog(col, vFogDepth);
      gl_FragColor = vec4(col, 1.0);
    }
  `
};

// =====================================================================
// Ceiling shaders (wire trays, vents)
// =====================================================================
const wireVertex = /* glsl */`
  varying vec3 vWorld;
  varying float vFogDepth;
  void main(){
    vec4 wp = modelMatrix * vec4(position, 1.0);
    vWorld = wp.xyz;
    vec4 mv = viewMatrix * wp;
    vFogDepth = -mv.z;
    gl_Position = projectionMatrix * mv;
  }
`;
const wireFragment = /* glsl */`
  ${GLSL_COMMON}
  uniform vec3 uAcross;
  uniform vec3 uNormal;
  varying vec3 vWorld;
  varying float vFogDepth;
  float wireLine(float coord, float period, float width){
    float fw = fwidth(coord);
    float d = abs(fract(coord / period + 0.5) - 0.5) * period;
    float line = 1.0 - smoothstep(width - fw, width + fw, d);
    float avg = min(1.0, 2.0 * width / period);
    return mix(line, avg, smoothstep(period * 0.25, period * 0.6, fw));
  }
  void main(){
    float a = dot(vWorld, uAcross);
    float cov = max(wireLine(a, 0.05, 0.0018), wireLine(vWorld.z, 0.1, 0.0018));
    if (cov < 0.01) discard;
    vec3 lit = vec3(0.25, 0.28, 0.3) * ceilDiffuse(vWorld, uNormal, 1.0);
    gl_FragColor = vec4(applyFog(lit, vFogDepth), cov);
  }
`;
function makeWireMaterial(across, normal){
  return new THREE.ShaderMaterial({
    uniforms: { ...shared, uAcross: { value: across }, uNormal: { value: normal } },
    vertexShader: wireVertex,
    fragmentShader: wireFragment,
    transparent: true,
    depthWrite: false,
    side: THREE.DoubleSide
  });
}
const wireBottomMaterial = makeWireMaterial(new THREE.Vector3(1, 0, 0), new THREE.Vector3(0, 1, 0));
const wireSideMaterial = makeWireMaterial(new THREE.Vector3(0, 1, 0), new THREE.Vector3(1, 0, 0));

const ventMaterial = new THREE.ShaderMaterial({
  uniforms: { ...shared, uSize: { value: new THREE.Vector2(1, 1.5) } },
  vertexShader: /* glsl */`
    varying vec2 vUv;
    varying vec3 vWorld;
    varying float vFogDepth;
    void main(){
      vUv = uv;
      vec4 wp = modelMatrix * instanceMatrix * vec4(position, 1.0);
      vWorld = wp.xyz;
      vec4 mv = viewMatrix * wp;
      vFogDepth = -mv.z;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: /* glsl */`
    ${GLSL_COMMON}
    uniform vec2 uSize;
    varying vec2 vUv;
    varying vec3 vWorld;
    varying float vFogDepth;
    void main(){
      vec2 q = vUv * uSize;
      float border = min(min(q.x, uSize.x - q.x), min(q.y, uSize.y - q.y));
      float fw = max(fwidth(q.y), 1e-5);
      float frame = 1.0 - smoothstep(0.03 - fw, 0.03 + fw, border);
      float per = 0.022;
      float s = fract(q.y / per);
      float aa = fw / per;
      float slat = smoothstep(0.1 - aa, 0.1 + aa, s) * (1.0 - smoothstep(0.55 - aa, 0.55 + aa, s));
      slat = mix(slat, 0.45, clamp(aa * 2.0 - 0.5, 0.0, 1.0));
      vec3 base = mix(vec3(0.004, 0.006, 0.008), vec3(0.09, 0.11, 0.13), slat);
      base = mix(base, vec3(0.12, 0.14, 0.16), frame);
      vec3 col = base * ceilDiffuse(vWorld, vec3(0.0, -1.0, 0.0), 0.0);
      gl_FragColor = vec4(applyFog(col, vFogDepth), 1.0);
    }
  `
});

// =====================================================================
// Recycled rows (infinite corridor)
// =====================================================================
class RecycledRow {
  constructor(count, spacing, firstZ){
    this.count = count;
    this.spacing = spacing;
    this.length = count * spacing;
    this.z = new Float64Array(count);
    this.cycle = new Int32Array(count);
    this.changed = [];
    for (let i = 0; i < count; i++) this.z[i] = firstZ - i * spacing;
  }
  update(camZ){
    this.changed.length = 0;
    const front = camZ + BEHIND;
    for (let i = 0; i < this.count; i++){
      let moved = false;
      while (this.z[i] > front){ this.z[i] -= this.length; this.cycle[i]++; moved = true; }
      while (this.z[i] <= front - this.length){ this.z[i] += this.length; this.cycle[i]--; moved = true; }
      if (moved) this.changed.push(i);
    }
    return this.changed.length > 0;
  }
  shift(d){ for (let i = 0; i < this.count; i++) this.z[i] += d; }
}

const rackRow = new RecycledRow(RACK_N, U, U * 0.5 + U * 2);
const supportRow = new RecycledRow(36, U * 2, U);
const lightRow = new RecycledRow(16, LS, 0);
const ventRow = new RecycledRow(16, LS, -LS * 0.5);

// =====================================================================
// Racks
// =====================================================================
function mergeAndDispose(list){
  const g = mergeGeometries(list);
  list.forEach(x => x.dispose());
  return g;
}

function buildRackFrameGeometry(){
  const parts = [];
  const postW = 0.045, postD = 0.075;
  for (const s of [-1, 1]){
    const post = new RoundedBoxGeometry(postW, RACK_H, postD, 2, 0.008);
    post.translate(s * (RACK_W / 2 - postW / 2), RACK_H / 2, postD / 2 - 0.01);
    parts.push(post);
  }
  const inner = RACK_W - 2 * postW + 0.002;
  const header = new RoundedBoxGeometry(inner, 0.09, postD * 0.8, 2, 0.006);
  header.translate(0, RACK_H - 0.045, postD * 0.4 - 0.01);
  parts.push(header);
  const plinth = new RoundedBoxGeometry(inner, 0.08, postD * 0.7, 2, 0.005);
  plinth.translate(0, 0.04, postD * 0.35 - 0.01);
  parts.push(plinth);
  const handle = new RoundedBoxGeometry(0.02, 0.22, 0.03, 2, 0.006);
  handle.translate(RACK_W / 2 - postW - 0.02, 1.12, 0.015);
  parts.push(handle);
  const lock = new RoundedBoxGeometry(0.03, 0.05, 0.02, 2, 0.004);
  lock.translate(RACK_W / 2 - postW - 0.02, 0.96, 0.01);
  parts.push(lock);
  return mergeAndDispose(parts);
}

function buildRackCableGeometry(){
  const parts = [];
  const half = U / 2;
  for (let c = 0; c < 9; c++){
    const y = RACK_H + 0.045 + (c % 3) * 0.03;
    const z = -0.05 - c * 0.06;
    const r = 0.012 + (c % 3) * 0.006;
    const sag = 0.025 + ((c * 7) % 4) * 0.01;
    const curve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(-half, y, z),
      new THREE.Vector3(-half * 0.5, y - sag * 0.75, z + 0.012),
      new THREE.Vector3(0, y - sag, z + 0.02),
      new THREE.Vector3(half * 0.5, y - sag * 0.75, z + 0.012),
      new THREE.Vector3(half, y, z)
    ]);
    parts.push(new THREE.TubeGeometry(curve, 16, r, 6, false));
  }
  return mergeAndDispose(parts);
}

function buildRackDropGeometry(){
  const parts = [];
  for (let c = 0; c < 3; c++){
    const dx = -0.08 + c * 0.05;
    const curve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(dx, 2.74, -0.55),
      new THREE.Vector3(dx + 0.02, 2.55, -0.47),
      new THREE.Vector3(dx + 0.03, 2.4, -0.38),
      new THREE.Vector3(dx + 0.04, RACK_H + 0.07, -0.3)
    ]);
    parts.push(new THREE.TubeGeometry(curve, 14, 0.016 + c * 0.004, 6, false));
  }
  return mergeAndDispose(parts);
}

const rackBodyGeo = new THREE.BoxGeometry(RACK_W, RACK_H, RACK_D);
rackBodyGeo.translate(0, RACK_H / 2, -RACK_D / 2 - 0.012);
const rackFaceGeo = new THREE.PlaneGeometry(RACK_W, RACK_H);
rackFaceGeo.translate(0, RACK_H / 2, 0);
const seedAttr = new THREE.InstancedBufferAttribute(new Float32Array(RACK_N * 2), 1);
seedAttr.setUsage(THREE.DynamicDrawUsage);
rackFaceGeo.setAttribute('aSeed', seedAttr);

const rackBody = new THREE.InstancedMesh(rackBodyGeo, matRackBody, RACK_N * 2);
const rackFace = new THREE.InstancedMesh(rackFaceGeo, rackFaceMaterial, RACK_N * 2);
const rackFrame = new THREE.InstancedMesh(buildRackFrameGeometry(), matRackFrame, RACK_N * 2);
const rackCables = new THREE.InstancedMesh(buildRackCableGeometry(), matCable, RACK_N * 2);
const rackDrops = new THREE.InstancedMesh(buildRackDropGeometry(), matCable, RACK_N * 2);
const rackMeshes = [rackBody, rackFace, rackFrame, rackCables, rackDrops];
for (const m of rackMeshes){
  m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  m.frustumCulled = false;
  scene.add(m);
}

let globalSeed = 0;
function rackSeed(slot, cycle, side){
  let h = (slot * 374761393 + cycle * 668265263 + (side > 0 ? 1442695041 : 0) + globalSeed * 2246822519) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return ((h >>> 0) / 4294967296) * 97.0;
}

const dummy = new THREE.Object3D();
function setRack(i){
  const side = i < RACK_N ? -1 : 1;
  const slot = i % RACK_N;
  const seed = rackSeed(slot, rackRow.cycle[slot], side);
  dummy.position.set(side * PARAMS.geometry.aisleWidth * 0.5, 0, rackRow.z[slot]);
  dummy.rotation.set(0, side < 0 ? Math.PI / 2 : -Math.PI / 2, 0);
  dummy.scale.set(1, 1, 1);
  dummy.updateMatrix();
  rackBody.setMatrixAt(i, dummy.matrix);
  rackFace.setMatrixAt(i, dummy.matrix);
  rackFrame.setMatrixAt(i, dummy.matrix);
  rackCables.setMatrixAt(i, dummy.matrix);
  if (((seed * 7.31) % 1) > 0.3){
    dummy.scale.set(0, 0, 0);
    dummy.updateMatrix();
  }
  rackDrops.setMatrixAt(i, dummy.matrix);
  seedAttr.array[i] = seed;
}
function commitRacks(){
  for (const m of rackMeshes) m.instanceMatrix.needsUpdate = true;
  seedAttr.needsUpdate = true;
}

// =====================================================================
// Ceiling
// =====================================================================
function trayLayout(){
  const a = PARAMS.geometry.aisleWidth * 0.5;
  const t = [];
  for (const s of [-1, 1]){
    t.push({ x: s * (a + 0.55), y: 2.74, w: 0.6, h: 0.1, cables: 3 });
    t.push({ x: s * (a + 0.75), y: 3.08, w: 0.45, h: 0.08, cables: 2 });
    t.push({ x: s * (a - 0.28), y: 3.14, w: 0.42, h: 0.08, cables: 0 });
  }
  return t;
}
function ductWidth(){ return Math.min(1.2, PARAMS.geometry.aisleWidth * 0.5 - 0.1); }

let ceiling = null;
function disposeCeiling(){
  if (!ceiling) return;
  ceiling.follow.traverse(o => { if (o.geometry) o.geometry.dispose(); });
  scene.remove(ceiling.follow);
  for (const m of ceiling.instanced){ scene.remove(m); m.geometry.dispose(); m.dispose(); }
  ceiling = null;
}

function buildCeiling(){
  disposeCeiling();
  const trays = trayLayout();
  const dw = ductWidth();
  const a = PARAMS.geometry.aisleWidth * 0.5;
  const L = FOLLOW_LEN;
  const zc = -L / 2 + 6;
  const follow = new THREE.Group();

  const slab = new THREE.Mesh(new THREE.PlaneGeometry(24, L), matCeiling);
  slab.rotation.x = Math.PI / 2;
  slab.position.set(0, CEIL_Y, zc);
  follow.add(slab);

  const duct = new THREE.Mesh(new THREE.BoxGeometry(dw, CEIL_Y - DUCT_BOTTOM, L), matDuct);
  duct.position.set(0, (CEIL_Y + DUCT_BOTTOM) / 2, zc);
  follow.add(duct);

  const bottoms = [], sides = [], steel = [], cables = [];
  for (const t of trays){
    const b = new THREE.PlaneGeometry(t.w, L);
    b.rotateX(-Math.PI / 2);
    b.translate(t.x, t.y, zc);
    bottoms.push(b);
    for (const s of [-1, 1]){
      const sg = new THREE.PlaneGeometry(L, t.h);
      sg.rotateY(Math.PI / 2);
      sg.translate(t.x + s * t.w / 2, t.y + t.h / 2, zc);
      sides.push(sg);
      const r = new THREE.BoxGeometry(0.012, 0.012, L);
      r.translate(t.x + s * t.w / 2, t.y + t.h, zc);
      steel.push(r);
    }
    for (let c = 0; c < t.cables; c++){
      const rad = 0.035 - c * 0.006;
      const cg = new THREE.CylinderGeometry(rad, rad, L, 8);
      cg.rotateX(Math.PI / 2);
      cg.translate(t.x - t.w * 0.3 + c * t.w * 0.22, t.y + rad + 0.003, zc);
      cables.push(cg);
    }
  }
  for (const s of [-1, 1]){
    const beam = new THREE.BoxGeometry(0.05, 0.06, L);
    beam.translate(s * (dw / 2 + 0.025), DUCT_BOTTOM - 0.01, zc);
    steel.push(beam);
    const pipe = new THREE.CylinderGeometry(0.06, 0.06, L, 12);
    pipe.rotateX(Math.PI / 2);
    pipe.translate(s * (a + 1.35), 3.42, zc);
    cables.push(pipe);
  }
  follow.add(new THREE.Mesh(mergeAndDispose(bottoms), wireBottomMaterial));
  follow.add(new THREE.Mesh(mergeAndDispose(sides), wireSideMaterial));
  follow.add(new THREE.Mesh(mergeAndDispose(steel), matSteel));
  follow.add(new THREE.Mesh(mergeAndDispose(cables), matCable));
  follow.traverse(o => { o.frustumCulled = false; });
  scene.add(follow);

  const sParts = [];
  for (const t of trays){
    const bar = new THREE.BoxGeometry(t.w + 0.08, 0.025, 0.035);
    bar.translate(t.x, t.y - 0.0125, 0);
    sParts.push(bar);
    for (const s of [-1, 1]){
      const hgt = CEIL_Y - t.y;
      const rod = new THREE.CylinderGeometry(0.008, 0.008, hgt, 6);
      rod.translate(t.x + s * (t.w / 2 + 0.03), t.y + hgt / 2, 0);
      sParts.push(rod);
    }
  }
  for (const s of [-1, 1]){
    const strut = new THREE.BoxGeometry(1.6, 0.041, 0.041);
    strut.translate(s * (a + 0.25), 3.42, 0);
    sParts.push(strut);
  }
  const supports = new THREE.InstancedMesh(mergeAndDispose(sParts), matSteel, supportRow.count);

  const housingGeo = new THREE.BoxGeometry(dw * 0.94, 0.03, 0.14);
  housingGeo.translate(0, DUCT_BOTTOM - 0.015, 0);
  const housings = new THREE.InstancedMesh(housingGeo, matHousing, lightRow.count);

  const stripGeo = new THREE.BoxGeometry(dw * 0.9, 0.02, 0.08);
  stripGeo.translate(0, DUCT_BOTTOM - 0.035, 0);
  const strips = new THREE.InstancedMesh(stripGeo, matStrip, lightRow.count);

  const ventGeo = new THREE.PlaneGeometry(dw * 0.82, 1.5);
  ventGeo.rotateX(Math.PI / 2);
  ventGeo.translate(0, DUCT_BOTTOM - 0.004, 0);
  const vents = new THREE.InstancedMesh(ventGeo, ventMaterial, ventRow.count);
  ventMaterial.uniforms.uSize.value.set(dw * 0.82, 1.5);
  shared.uStripHalf.value = dw * 0.45;

  const instanced = [supports, housings, strips, vents];
  for (const m of instanced){ m.frustumCulled = false; scene.add(m); }
  ceiling = { follow, instanced, supports, housings, strips, vents };
}

const tmpMatrix = new THREE.Matrix4();
function setZ(mesh, i, z){ tmpMatrix.makeTranslation(0, 0, z); mesh.setMatrixAt(i, tmpMatrix); }

const rows = [
  { row: rackRow,
    apply: (i) => { setRack(i); setRack(i + RACK_N); },
    commit: commitRacks },
  { row: supportRow,
    apply: (i) => setZ(ceiling.supports, i, supportRow.z[i]),
    commit: () => { ceiling.supports.instanceMatrix.needsUpdate = true; } },
  { row: lightRow,
    apply: (i) => { setZ(ceiling.strips, i, lightRow.z[i]); setZ(ceiling.housings, i, lightRow.z[i]); },
    commit: () => { ceiling.strips.instanceMatrix.needsUpdate = true; ceiling.housings.instanceMatrix.needsUpdate = true; } },
  { row: ventRow,
    apply: (i) => setZ(ceiling.vents, i, ventRow.z[i]),
    commit: () => { ceiling.vents.instanceMatrix.needsUpdate = true; } }
];

function applyAllRows(){
  for (let r = 0; r < rows.length; r++){
    const e = rows[r];
    for (let i = 0; i < e.row.count; i++) e.apply(i);
    e.commit();
  }
}
function updateRows(camZ){
  for (let r = 0; r < rows.length; r++){
    const e = rows[r];
    if (e.row.update(camZ)){
      const ch = e.row.changed;
      for (let k = 0; k < ch.length; k++) e.apply(ch[k]);
      e.commit();
    }
  }
}

buildCeiling();

// =====================================================================
// Floor (planar reflection)
// =====================================================================
function reflectionSize(){
  const dpr = Math.min(PARAMS.performance.dpr, MAX_DPR);
  const s = PARAMS.performance.reflectionScale;
  return [Math.max(1, Math.floor(window.innerWidth * dpr * s)), Math.max(1, Math.floor(window.innerHeight * dpr * s))];
}
const [rw, rh] = reflectionSize();
const floor = new Reflector(new THREE.PlaneGeometry(10, 60), {
  clipBias: 0.003,
  textureWidth: rw,
  textureHeight: rh,
  color: 0xffffff,
  multisample: 0,
  shader: FloorShader
});
Object.assign(floor.material.uniforms, shared);
floor.rotation.x = -Math.PI / 2;
floor.frustumCulled = false;
scene.add(floor);

// =====================================================================
// Post processing
// =====================================================================
let initDpr = Math.min(PARAMS.performance.dpr, MAX_DPR);
let composerTarget = new THREE.WebGLRenderTarget(
  window.innerWidth * initDpr, window.innerHeight * initDpr,
  { type: THREE.HalfFloatType, samples: PARAMS.performance.antialias ? 4 : 0 }
);
const composer = new EffectComposer(renderer, composerTarget);
composer.setPixelRatio(initDpr);
composer.setSize(window.innerWidth, window.innerHeight);

composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  PARAMS.post.bloomStrength, PARAMS.post.bloomRadius, PARAMS.post.bloomThreshold
);
composer.addPass(bloomPass);
composer.addPass(new OutputPass());

const FinalShader = {
  uniforms: {
    tDiffuse: { value: null },
    uResolution: { value: new THREE.Vector2(1, 1) },
    uTime: { value: 0 },
    uVignette: { value: PARAMS.post.vignette },
    uGrain: { value: PARAMS.post.grain },
    uAberration: { value: PARAMS.post.aberration }
  },
  vertexShader: /* glsl */`
    varying vec2 vUv;
    void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
  `,
  fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse;
    uniform vec2 uResolution;
    uniform float uTime;
    uniform float uVignette;
    uniform float uGrain;
    uniform float uAberration;
    varying vec2 vUv;
    float h12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
    void main(){
      vec2 c = vUv - 0.5;
      vec2 ca = c * uAberration * (1.0 + 2.0 * dot(c, c)) * 2.0;
      vec3 col;
      col.r = texture2D(tDiffuse, vUv - ca).r;
      col.g = texture2D(tDiffuse, vUv).g;
      col.b = texture2D(tDiffuse, vUv + ca).b;
      float v = length(c) * 1.414;
      col *= mix(1.0, smoothstep(1.15, 0.25, v), uVignette);
      float n = h12(vUv * uResolution + fract(uTime * 7.13) * vec2(113.1, 71.7)) - 0.5;
      col += n * uGrain * 0.12 * (1.0 - col * 0.5);
      gl_FragColor = vec4(max(col, 0.0), 1.0);
    }
  `
};
const finalPass = new ShaderPass(FinalShader);
composer.addPass(finalPass);

// =====================================================================
// Lighting & Color State Management
// =====================================================================
function updateDarkness(){
  shared.uDarkStart.value = PARAMS.lighting.darkStart;
  shared.uDarkEnd.value = Math.max(PARAMS.lighting.darkEnd, PARAMS.lighting.darkStart + 1);
}

function updatePointLights(targetZ){
  const base = Math.ceil((targetZ + LS) / LS) * LS;
  const I = PARAMS.lighting.ceilingLight * PARAMS.lighting.sceneLightIntensity * PARAMS.lighting.pointLightsIntensity;
  for (let j = 0; j < POINT_LIGHTS; j++){
    const z = base - j * LS;
    const d = z - targetZ;
    const w = smoothstep(LS, 0.2 * LS, d) * smoothstep(-(POINT_LIGHTS - 2) * LS, -(POINT_LIGHTS - 3) * LS, d);
    const l = pointLights[j];
    l.position.set(0, LIGHT_Y, z);
    l.intensity = I * w;
  }
}

function updateLighting(){
  const master = PARAMS.lighting.sceneLightIntensity;
  renderer.toneMappingExposure = PARAMS.lighting.exposure;
  shared.uLedIntensity.value = PARAMS.lighting.ledIntensity * master;
  shared.uCeilingLight.value = PARAMS.lighting.ceilingLight * master;
  shared.uAmbient.value = PARAMS.lighting.ambient * master;
  hemi.intensity = PARAMS.lighting.ambient * master;
  hemi.color.set(PARAMS.lighting.hemiSkyColor);
  hemi.groundColor.set(PARAMS.lighting.hemiGroundColor);
  updateStripColor();
  updateDarkness();
}

function applyColors(){
  const isGreen = PARAMS.colors.greenscreen;
  const effectiveBg = isGreen ? '#00ff00' : PARAMS.colors.background;
  const effectiveFog = isGreen ? '#00ff00' : PARAMS.colors.haze;

  shared.uGreen.value.set(PARAMS.colors.ledGreen);
  shared.uBlue.value.set(PARAMS.colors.ledBlue);
  shared.uOrange.value.set(PARAMS.colors.ledOrange);
  shared.uWhite.value.set(PARAMS.colors.ledWhite);
  shared.uMetal.value.set(PARAMS.colors.metal);
  shared.uLightColor.value.set(PARAMS.colors.ceilingLight);
  shared.uFogColor.value.set(effectiveFog);
  shared.uDarkColor.value.set(effectiveBg);

  scene.fog.color.set(effectiveFog);
  renderer.setClearColor(new THREE.Color(effectiveBg), 1);
  scene.background = new THREE.Color(effectiveBg);

  if (isGreen) {
    finalPass.uniforms.uVignette.value = 0.0;
  } else {
    finalPass.uniforms.uVignette.value = PARAMS.post.vignette;
  }

  updateStripColor();
  for (let j = 0; j < POINT_LIGHTS; j++){
    pointLights[j].color.set(PARAMS.colors.ceilingLight);
  }
}

function setScheme(name){
  if (!COLOR_SCHEMES[name]) return;
  PARAMS.colors.scheme = name;
  const s = COLOR_SCHEMES[name];
  PARAMS.colors.ledGreen = s.ledGreen;
  PARAMS.colors.ledBlue = s.ledBlue;
  PARAMS.colors.ledOrange = s.ledOrange;
  PARAMS.colors.ledWhite = s.ledWhite;
  PARAMS.colors.metal = s.metal;
  PARAMS.colors.ceilingLight = s.ceilingLight;
  PARAMS.colors.haze = s.haze;
  PARAMS.colors.background = s.background;
  applyColors();
  updateAllGuiDisplays();
}

// =====================================================================
// Resize
// =====================================================================
function resize(){
  const w = window.innerWidth, h = window.innerHeight;
  const dpr = Math.min(PARAMS.performance.dpr, MAX_DPR);
  renderer.setPixelRatio(dpr);
  renderer.setSize(w, h);
  composerTarget.samples = PARAMS.performance.antialias ? 4 : 0;
  composerTarget.setSize(w * dpr, h * dpr);
  composer.setPixelRatio(dpr);
  composer.setSize(w, h);
  camera.aspect = w / h;
  camera.zoom = PARAMS.camera.zoom;
  camera.updateProjectionMatrix();
  const [a, b] = reflectionSize();
  floor.getRenderTarget().setSize(a, b);
  finalPass.uniforms.uResolution.value.set(w * dpr, h * dpr);
}
window.addEventListener('resize', resize);

// =====================================================================
// Interactive Controls (Wheel Zoom, Drag Across Screen, Angle Orbit)
// =====================================================================
let camZ = 0;
let orbitAngle = 0;

let isPointerDown = false;
let startX = 0, startY = 0;
let lastX = 0, lastY = 0;
let hasDragged = false;
let pointerButton = 0;

renderer.domElement.addEventListener('pointerdown', (e) => {
  isPointerDown = true;
  startX = e.clientX;
  startY = e.clientY;
  lastX = e.clientX;
  lastY = e.clientY;
  hasDragged = false;
  pointerButton = e.button;
});

window.addEventListener('pointermove', (e) => {
  if (!isPointerDown) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  const dist = Math.hypot(e.clientX - startX, e.clientY - startY);
  if (dist > 4) {
    hasDragged = true;
  }

  if (hasDragged) {
    if (PARAMS.animation.mode === 'Smooth Orbit') {
      // In Orbit mode:
      // Left click = rotate camera angle around cluster
      // Right click / Shift = pan across screen
      if (pointerButton === 2 || e.shiftKey) {
        PARAMS.camera.panX += (dx / window.innerHeight) * 2.5 / PARAMS.camera.zoom;
        PARAMS.camera.panY -= (dy / window.innerHeight) * 2.5 / PARAMS.camera.zoom;
      } else {
        PARAMS.camera.angleYaw += dx * 0.005;
        PARAMS.camera.anglePitch += dy * 0.005;
        PARAMS.camera.anglePitch = THREE.MathUtils.clamp(PARAMS.camera.anglePitch, -1.3, 1.3);
      }
    } else {
      // In other modes:
      // Left click = drag object/scene across screen (Pan)
      // Right click / Shift = look angle
      if (pointerButton === 2 || e.shiftKey) {
        PARAMS.camera.angleYaw -= dx * 0.004;
        PARAMS.camera.anglePitch -= dy * 0.004;
        PARAMS.camera.anglePitch = THREE.MathUtils.clamp(PARAMS.camera.anglePitch, -1.3, 1.3);
      } else {
        PARAMS.camera.panX += (dx / window.innerHeight) * 2.5 / PARAMS.camera.zoom;
        PARAMS.camera.panY -= (dy / window.innerHeight) * 2.5 / PARAMS.camera.zoom;
      }
    }
    updateAllGuiDisplays();
  }

  lastX = e.clientX;
  lastY = e.clientY;
});

window.addEventListener('pointerup', (e) => {
  if (!isPointerDown) return;
  isPointerDown = false;
  // If not dragged and was left click, trigger procedural random variation if enabled
  if (!hasDragged && e.button === 0) {
    if (PARAMS.interaction.clickToRandomize) {
      randomizeScene();
    }
  }
});

renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());

// Mouse wheel zoom: persistent, does not reset during animation
renderer.domElement.addEventListener('wheel', (e) => {
  e.preventDefault();
  const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
  PARAMS.camera.zoom = THREE.MathUtils.clamp(PARAMS.camera.zoom * zoomFactor, 0.25, 4.5);
  camera.zoom = PARAMS.camera.zoom;
  camera.updateProjectionMatrix();
  updateAllGuiDisplays();
}, { passive: false });

// =====================================================================
// Procedural Random Theme & Scene Variation
// =====================================================================
function randomizeScene(){
  const schemeNames = Object.keys(COLOR_SCHEMES);
  const randomScheme = schemeNames[Math.floor(Math.random() * schemeNames.length)];
  setScheme(randomScheme);

  // Geometric re-roll
  PARAMS.geometry.aisleWidth = +(2.0 + Math.random() * 1.3).toFixed(2);
  shared.uAisle.value = PARAMS.geometry.aisleWidth;
  buildCeiling();

  // Motion & camera parameters
  PARAMS.camera.height = +(0.5 + Math.random() * 1.6).toFixed(2);
  PARAMS.camera.sway = +(0.15 + Math.random() * 0.75).toFixed(2);
  PARAMS.camera.pitch = +((Math.random() - 0.5) * 0.15).toFixed(3);
  PARAMS.animation.speed = +(0.3 + Math.random() * 1.7).toFixed(2);
  PARAMS.animation.blinkSpeed = +(0.4 + Math.random() * 2.5).toFixed(2);
  PARAMS.animation.blinkRatio = +(0.2 + Math.random() * 0.65).toFixed(2);
  PARAMS.animation.ledDensity = +(0.2 + Math.random() * 0.8).toFixed(2);

  // Materials & Post
  PARAMS.material.floorReflection = +(0.4 + Math.random() * 0.8).toFixed(2);
  PARAMS.material.floorBlur = +(0.2 + Math.random() * 0.8).toFixed(2);
  PARAMS.post.bloomStrength = +(0.2 + Math.random() * 0.7).toFixed(2);

  // Hardware re-seed
  globalSeed = Math.floor(Math.random() * 100000);
  applyAllRows();

  // Apply updated parameters to uniforms
  shared.uBlinkSpeed.value = PARAMS.animation.blinkSpeed;
  shared.uBlinkRatio.value = PARAMS.animation.blinkRatio;
  shared.uLedDensity.value = PARAMS.animation.ledDensity;
  shared.uReflect.value = PARAMS.material.floorReflection;
  shared.uBlur.value = PARAMS.material.floorBlur;
  bloomPass.strength = PARAMS.post.bloomStrength;

  updateLighting();
  updateAllGuiDisplays();
}

// =====================================================================
// Camera Transformation Helper
// =====================================================================
function applyCameraTransform(bx, by, bz, bpitch, byaw, broll){
  camera.rotation.set(
    bpitch + PARAMS.camera.anglePitch,
    byaw + PARAMS.camera.angleYaw,
    broll
  );

  const right = new THREE.Vector3(1, 0, 0).applyEuler(camera.rotation);
  const up = new THREE.Vector3(0, 1, 0).applyEuler(camera.rotation);

  camera.position.set(bx, by, bz)
    .addScaledVector(right, PARAMS.camera.panX)
    .addScaledVector(up, PARAMS.camera.panY);
}

// =====================================================================
// Animation Loop
// =====================================================================
const clock = new THREE.Clock();
let elapsed = 0;
let curSpeed = 0.25;

function smoothstep(e0, e1, x){
  const t = THREE.MathUtils.clamp((x - e0) / (e1 - e0), 0, 1);
  return t * t * (3 - 2 * t);
}

applyAllRows();
applyColors();
updateLighting();
resize();

function frame(){
  const dt = Math.min(clock.getDelta(), 1 / 20);
  elapsed += dt;

  const mode = PARAMS.animation.mode;
  const speedScale = PARAMS.animation.speed;

  if (mode === 'Static (No Movement)') {
    // Static animation: no forward flight, LED/lighting animations continue, user can pan/zoom/orbit
    applyCameraTransform(0, PARAMS.camera.height, camZ, PARAMS.camera.pitch, 0, 0);

  } else if (mode === 'Smooth Orbit') {
    // Smooth Orbit around server equipment cluster
    orbitAngle += dt * 0.16 * speedScale;
    const radius = 2.2;
    const centerZ = camZ - 3.5;
    const orbYaw = orbitAngle + PARAMS.camera.angleYaw;
    const orbPitch = THREE.MathUtils.clamp(0.18 + PARAMS.camera.anglePitch, -1.3, 1.3);

    const ox = Math.sin(orbYaw) * Math.cos(orbPitch) * radius;
    const oy = Math.sin(orbPitch) * radius;
    const oz = Math.cos(orbYaw) * Math.cos(orbPitch) * radius;

    camera.position.set(ox, PARAMS.camera.height + oy, centerZ + oz);
    camera.lookAt(0, PARAMS.camera.height, centerZ);

    const right = new THREE.Vector3(1, 0, 0).applyEuler(camera.rotation);
    const up = new THREE.Vector3(0, 1, 0).applyEuler(camera.rotation);
    camera.position.addScaledVector(right, PARAMS.camera.panX).addScaledVector(up, PARAMS.camera.panY);

  } else if (mode === 'Slow Drift & Sway') {
    // Ultra-smooth zero-g style slow drift forward
    const targetSpeed = PARAMS.camera.flying ? 0.08 * speedScale : 0;
    curSpeed += (targetSpeed - curSpeed) * (1 - Math.exp(-dt * 2.5));
    camZ -= curSpeed * dt;

    const bx = Math.sin(elapsed * 0.3) * 0.28;
    const by = PARAMS.camera.height + Math.cos(elapsed * 0.25) * 0.16;
    const bp = PARAMS.camera.pitch + Math.sin(elapsed * 0.2) * 0.035;
    const byaw = Math.cos(elapsed * 0.22) * 0.045;
    const broll = Math.sin(elapsed * 0.18) * 0.02;
    applyCameraTransform(bx, by, camZ, bp, byaw, broll);

  } else if (mode === 'Low Angle Glide') {
    // Low floor glide emphasizing floor reflections
    const targetSpeed = PARAMS.camera.flying ? 0.22 * speedScale : 0;
    curSpeed += (targetSpeed - curSpeed) * (1 - Math.exp(-dt * 2.5));
    camZ -= curSpeed * dt;

    const bx = Math.sin(elapsed * 0.18) * 0.08;
    const by = 0.24;
    const bp = PARAMS.camera.pitch + 0.09;
    const byaw = Math.sin(elapsed * 0.14) * 0.02;
    applyCameraTransform(bx, by, camZ, bp, byaw, 0);

  } else if (mode === 'Ceiling Inspection') {
    // Elevated tracking shot looking up at wire trays and strip lights
    const targetSpeed = PARAMS.camera.flying ? 0.2 * speedScale : 0;
    curSpeed += (targetSpeed - curSpeed) * (1 - Math.exp(-dt * 2.5));
    camZ -= curSpeed * dt;

    const bx = Math.sin(elapsed * 0.22) * 0.14;
    const by = 2.42;
    const bp = PARAMS.camera.pitch - 0.28;
    const byaw = Math.sin(elapsed * 0.18) * 0.04;
    applyCameraTransform(bx, by, camZ, bp, byaw, 0);

  } else if (mode === 'Side Aisle Scanning') {
    // 40-degree angled scanning shot focused on server rack equipment
    const targetSpeed = PARAMS.camera.flying ? 0.22 * speedScale : 0;
    curSpeed += (targetSpeed - curSpeed) * (1 - Math.exp(-dt * 2.5));
    camZ -= curSpeed * dt;

    const bx = -0.32 + Math.sin(elapsed * 0.12) * 0.05;
    const by = PARAMS.camera.height + Math.sin(elapsed * 0.35) * 0.08;
    const bp = PARAMS.camera.pitch;
    const byaw = -0.52 + Math.sin(elapsed * 0.25) * 0.06;
    applyCameraTransform(bx, by, camZ, bp, byaw, 0);

  } else if (mode === 'Floating Drone Patrol') {
    // Smooth undulating figure-8 drone motion
    const targetSpeed = PARAMS.camera.flying ? 0.2 * speedScale : 0;
    curSpeed += (targetSpeed - curSpeed) * (1 - Math.exp(-dt * 2.5));
    camZ -= curSpeed * dt;

    const bx = Math.sin(elapsed * 0.42) * 0.62;
    const by = PARAMS.camera.height + Math.sin(elapsed * 0.84) * 0.42;
    const bp = PARAMS.camera.pitch + Math.sin(elapsed * 0.42) * 0.04;
    const byaw = Math.cos(elapsed * 0.42) * 0.06;
    const broll = -Math.cos(elapsed * 0.42) * 0.02;
    applyCameraTransform(bx, by, camZ, bp, byaw, broll);

  } else {
    // Default Flythrough
    const targetSpeed = PARAMS.camera.flying ? 0.25 * speedScale : 0;
    curSpeed += (targetSpeed - curSpeed) * (1 - Math.exp(-dt * 2.5));
    camZ -= curSpeed * dt;

    const s = PARAMS.camera.sway;
    const bx = s * (0.05 * Math.sin(elapsed * 0.21) + 0.018 * Math.sin(elapsed * 0.57 + 1.3));
    const by = PARAMS.camera.height + s * (0.025 * Math.sin(elapsed * 0.33 + 0.4) + 0.01 * Math.sin(elapsed * 0.9));
    const bp = PARAMS.camera.pitch + s * 0.006 * Math.sin(elapsed * 0.27);
    const byaw = s * 0.012 * Math.sin(elapsed * 0.17 + 2.0);
    const broll = s * 0.006 * Math.sin(elapsed * 0.19 + 0.7);
    applyCameraTransform(bx, by, camZ, bp, byaw, broll);
  }

  // Infinite corridor rebase
  if (camZ < -REBASE){
    camZ += REBASE;
    for (let r = 0; r < rows.length; r++) rows[r].row.shift(REBASE);
    applyAllRows();
  }

  updateRows(camZ);
  ceiling.follow.position.z = camZ;
  floor.position.z = camZ - 24;
  updatePointLights(camZ);

  shared.uTime.value = elapsed;
  finalPass.uniforms.uTime.value = elapsed;
  composer.render();
}

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) clock.getDelta();
});

renderer.setAnimationLoop(frame);
