      uAccentColor: { value: new THREE.Color(params.accentColor) },
      uBgColor: { value: new THREE.Color(params.bgColor) },
      uGreenscreen: { value: params.greenscreen ? 1.0 : 0.0 },
      uFogDensity: { value: params.fogDensity }
    };

    const particleMaterial = new THREE.ShaderMaterial({
      uniforms: particleUniforms,
      vertexShader: `
        uniform float uTime;
        uniform float uHeight;
        uniform float uFrequency;
        uniform float uComplexity;
        uniform float uPulseSpeed;
        uniform float uParticleSize;
        uniform float uFloatAmp;

        attribute vec4 aRandom;

        varying vec3 vWorldPos;
        varying float vFlash;
        varying float vPhase;

        ${glslTerrainWaveFunctions}

        void main() {
          vec2 flatPos = vec2(position.x, position.z);
          float terrainY = computeTerrainHeight(flatPos, uTime, uFrequency, uHeight, uComplexity, uPulseSpeed);

          float floatOffset = sin(uTime * aRandom.z * 1.8 + aRandom.w) * uFloatAmp + (aRandom.x * uFloatAmp * 0.8);
          vec3 displacedPos = vec3(position.x, terrainY + floatOffset + 0.35, position.z);

          vWorldPos = (modelMatrix * vec4(displacedPos, 1.0)).xyz;
          vec4 mvPos = viewMatrix * vec4(vWorldPos, 1.0);

          float sizeAttenuation = 200.0 / -mvPos.z;
          gl_PointSize = uParticleSize * sizeAttenuation * (0.6 + aRandom.y * 0.8);

          vFlash = sin(uTime * 2.5 + aRandom.w) * 0.5 + 0.5;
          vPhase = aRandom.x;

          gl_Position = projectionMatrix * mvPos;
        }
      `,
      fragmentShader: `
        uniform vec3 uParticleColor;
        uniform vec3 uAccentColor;
        uniform float uParticleAlpha;
        uniform vec3 uBgColor;
        uniform float uGreenscreen;
        uniform float uFogDensity;

        varying vec3 vWorldPos;
        varying float vFlash;
        varying float vPhase;

        void main() {
          vec2 coord = gl_PointCoord - vec2(0.5);
          float dist = length(coord);
          if (dist > 0.5) discard;

          float core = smoothstep(0.18, 0.0, dist);
          float halo = pow(1.0 - dist * 2.0, 1.8);

          vec3 nodeColor = mix(uParticleColor, uAccentColor, vPhase);
          vec3 finalColor = mix(nodeColor, vec3(1.0), core * 0.8);
          finalColor *= (1.0 + vFlash * 0.6);

          float alpha = (halo * 0.7 + core * 0.6) * uParticleAlpha;

          if (uGreenscreen < 0.5) {
            float distToCam = length(cameraPosition - vWorldPos);
            float fogFactor = 1.0 - exp(-distToCam * uFogDensity);
            finalColor = mix(finalColor, uBgColor, clamp(fogFactor, 0.0, 0.9));
          }

          gl_FragColor = vec4(finalColor, alpha);
        }
      `,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const particlesMesh = new THREE.Points(particleGeometry, particleMaterial);
    scene.add(particlesMesh);

    // =========================================================================
    // 3. VERTICAL BIG DATA BEACONS (ANOMALY SIGNAL SPILLARS)
    // =========================================================================
    const beaconGroup = new THREE.Group();
    scene.add(beaconGroup);

    const beaconData = [
      { x: -28, z: -22, pulsePhase: 0.0 },
      { x: 30, z: -18, pulsePhase: 1.2 },
      { x: -14, z: 26, pulsePhase: 2.4 },
      { x: 26, z: 22, pulsePhase: 3.6 },
      { x: 0, z: 0, pulsePhase: 4.8 }
    ];

    const beaconMeshes = [];

    const beaconBeamGeometry = new THREE.CylinderGeometry(0.12, 0.35, params.beaconHeight, 8, 1, true);
    beaconBeamGeometry.translate(0, params.beaconHeight / 2, 0);

    const beaconBeamMaterial = new THREE.MeshBasicMaterial({
      color: new THREE.Color(params.pointLightColor),
      transparent: true,
      opacity: 0.6,
      blending: THREE.AdditiveBlending,
      side: THREE.DoubleSide,
      depthWrite: false
    });

    const beaconHeadGeometry = new THREE.OctahedronGeometry(1.1, 0);
    const beaconHeadMaterial = new THREE.MeshBasicMaterial({
      color: new THREE.Color(params.peakColor),
      wireframe: true
    });

    const ringGeometry = new THREE.RingGeometry(1.2, 1.45, 24);
    ringGeometry.rotateX(-Math.PI / 2);
    const ringMaterial = new THREE.MeshBasicMaterial({
      color: new THREE.Color(params.accentColor),
      transparent: true,
      opacity: 0.75,
      blending: THREE.AdditiveBlending,
      side: THREE.DoubleSide,
      depthWrite: false
    });

    beaconData.forEach((data) => {
      const beaconSubGroup = new THREE.Group();
      beaconSubGroup.position.set(data.x, 0, data.z);

      const beam = new THREE.Mesh(beaconBeamGeometry, beaconBeamMaterial);
      beaconSubGroup.add(beam);

      const head = new THREE.Mesh(beaconHeadGeometry, beaconHeadMaterial);
      head.position.y = params.beaconHeight;
      beaconSubGroup.add(head);

      const ring = new THREE.Mesh(ringGeometry, ringMaterial);
      ring.position.y = 0.5;
      beaconSubGroup.add(ring);

      beaconGroup.add(beaconSubGroup);
      beaconMeshes.push({ group: beaconSubGroup, head, beam, ring, phase: data.pulsePhase });
    });

    // =========================================================================
    // 4. DATUM BASE PLANE (ANALYTICAL ZERO REFERENCE GRID)
    // =========================================================================
    const datumGrid = new THREE.GridHelper(130, 26, new THREE.Color(params.wireColor), new THREE.Color(params.accentColor));
    datumGrid.position.y = -params.waveHeight * 0.85;
    datumGrid.material.transparent = true;
    datumGrid.material.opacity = 0.18;
    datumGrid.material.depthWrite = false;
    scene.add(datumGrid);

    // =========================================================================
    // CPU TERRAIN ELEVATION CALCULATOR (ANCHORS BEACONS TO WAVE PEAKS)
    // =========================================================================
    function getTerrainHeightCPU(x, z, time) {
      const pX = x * params.waveFrequency;
      const pZ = z * params.waveFrequency;
      const w1 = Math.sin(pX * 1.6 + pZ * 1.3 + time * 1.1);
      const w2 = Math.cos(pX * 2.2 - pZ * 1.7 + time * 0.85);
      const dist = Math.sqrt(x * x + z * z);
      const w3 = Math.sin(dist * params.waveFrequency * 3.4 - time * (params.pulseSpeed * 1.6));
      const n1 = Math.sin(pX + time * 0.2) * Math.cos(pZ + time * 0.12) * 0.65;
      const wavePacket = Math.sin(dist * 0.18 - time * 2.2) * 0.4;
      return (w1 * 0.35 + w2 * 0.25 + w3 * 0.15 + n1 + wavePacket) * params.waveHeight;
    }

    // =========================================================================
    // INTERACTION & CAMERA MANAGEMENT
    // =========================================================================
    let userInteracting = false;
    let userInteractionTimer = null;
    let pointerDownPos = { x: 0, y: 0 };
    let pointerDownTime = 0;

    function bindInteractionEvents() {
      if (!renderer || !renderer.domElement) return;

      const dom = renderer.domElement;

      controls.addEventListener('start', () => {
        userInteracting = true;
        if (userInteractionTimer) clearTimeout(userInteractionTimer);
      });

      controls.addEventListener('end', () => {
        if (userInteractionTimer) clearTimeout(userInteractionTimer);
        userInteractionTimer = setTimeout(() => {
          userInteracting = false;
        }, 1200);
      });

      dom.addEventListener('pointerdown', (e) => {
        pointerDownPos = { x: e.clientX, y: e.clientY };
        pointerDownTime = performance.now();
      });

      dom.addEventListener('pointerup', (e) => {
        const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
        const duration = performance.now() - pointerDownTime;

        // Click detection without camera drag: triggers scene randomization
        if (dist < 6 && duration < 350 && params.randomizeOnClick) {
          randomizeScene();
        }
      });
    }

    // =========================================================================
    // COLOR SCHEME APPLIER
    // =========================================================================
    function applyColorScheme(schemeName) {
      const scheme = COLOR_SCHEMES[schemeName] || COLOR_SCHEMES['Original'];
      params.colorScheme = schemeName;
      params.bgColor = scheme.bg;
      params.wireColor = scheme.wire;
      params.accentColor = scheme.accent;
      params.peakColor = scheme.peaks;
      params.particleColor = scheme.particles;
      params.ambientColor = scheme.ambient;
      params.keyLightColor = scheme.keyLight;
      params.fillLightColor = scheme.fillLight;
      params.pointLightColor = scheme.pointLight;
      params.fogDensity = scheme.fogDensity || 0.007;

      updateSceneVisuals();

      if (gui) {
        // Update only scene, terrain, particle, lighting and color controllers.
        // NEVER touch or refresh post-processing controls upon scene randomization.
        const sceneFolders = [folderScene, folderTerrain, folderParticles, folderBeacons, folderLighting, folderColors];
        sceneFolders.forEach(folder => {
          if (folder) folder.controllersRecursive().forEach(c => c.updateDisplay());
        });
      }
    }

    function updateSceneVisuals() {
      const isGreen = params.greenscreen;

      // Background & Fog
      const effectiveBg = isGreen ? '#00ff00' : params.bgColor;
      scene.background = new THREE.Color(effectiveBg);
      renderer.setClearColor(effectiveBg, 1);

      if (isGreen) {
        scene.fog = null;
      } else {
        scene.fog = new THREE.FogExp2(params.bgColor, params.fogDensity);
      }

      // Lights
      ambientLight.color.set(params.ambientColor);
      ambientLight.intensity = params.ambientIntensity;

      keyLight.color.set(params.keyLightColor);
      keyLight.intensity = params.keyLightIntensity;
      keyLight.position.set(params.keyLightX, params.keyLightY, params.keyLightZ);

      fillLight.color.set(params.fillLightColor);
      fillLight.intensity = params.fillLightIntensity;
      fillLight.position.set(params.fillLightX, params.fillLightY, params.fillLightZ);

      beaconPointLight.color.set(params.pointLightColor);
      beaconPointLight.intensity = params.pointLightIntensity;
      beaconPointLight.distance = params.pointLightDistance;

      // Terrain Uniforms
      terrainUniforms.uHeight.value = params.waveHeight;
      terrainUniforms.uFrequency.value = params.waveFrequency;
      terrainUniforms.uComplexity.value = params.waveComplexity;
      terrainUniforms.uGridDensity.value = params.gridDensity;
      terrainUniforms.uContourDensity.value = params.contourDensity;
      terrainUniforms.uWireThickness.value = params.wireThickness;
      terrainUniforms.uSurfaceOpacity.value = params.surfaceOpacity;
      terrainUniforms.uPulseSpeed.value = params.pulseSpeed;
      terrainUniforms.uBgColor.value.set(params.bgColor);
      terrainUniforms.uWireColor.value.set(params.wireColor);
      terrainUniforms.uAccentColor.value.set(params.accentColor);
      terrainUniforms.uPeakColor.value.set(params.peakColor);
      terrainUniforms.uGreenscreen.value = isGreen ? 1.0 : 0.0;
      terrainUniforms.uFogDensity.value = params.fogDensity;
      terrainUniforms.uKeyLightColor.value.set(params.keyLightColor);
      terrainUniforms.uFillLightColor.value.set(params.fillLightColor);
      terrainUniforms.uAmbientColor.value.set(params.ambientColor);
      terrainUniforms.uBeaconColor.value.set(params.pointLightColor);

      // Particle Uniforms
      particleUniforms.uHeight.value = params.waveHeight;
      particleUniforms.uFrequency.value = params.waveFrequency;
      particleUniforms.uComplexity.value = params.waveComplexity;
      particleUniforms.uPulseSpeed.value = params.pulseSpeed;
      particleUniforms.uParticleSize.value = params.particleSize;
      particleUniforms.uParticleAlpha.value = params.particleAlpha;
      particleUniforms.uFloatAmp.value = params.floatAmplitude;
      particleUniforms.uParticleColor.value.set(params.particleColor);
      particleUniforms.uAccentColor.value.set(params.accentColor);
      particleUniforms.uBgColor.value.set(params.bgColor);
      particleUniforms.uGreenscreen.value = isGreen ? 1.0 : 0.0;
      particleUniforms.uFogDensity.value = params.fogDensity;
      particlesMesh.visible = params.particlesEnabled;

      // Beacons
      beaconGroup.visible = params.beaconsEnabled;
      beaconBeamMaterial.color.set(params.pointLightColor);
      beaconHeadMaterial.color.set(params.peakColor);
      ringMaterial.color.set(params.accentColor);

      // Datum Grid
      datumGrid.position.y = -params.waveHeight * 0.85;
      datumGrid.material.color.set(params.wireColor);
    }

    // =========================================================================
    // PROCEDURAL RANDOMIZATION ON CLICK (LEAVES POST-PROCESSING UNTOUCHED)
    // =========================================================================
    function randomizeScene() {
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const chosenScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];

      // Re-roll geometric wave and motion parameters within harmonious bounds
      params.waveHeight = +(8.0 + Math.random() * 16.0).toFixed(1);
      params.waveFrequency = +(0.03 + Math.random() * 0.045).toFixed(3);
      params.waveComplexity = +(1.2 + Math.random() * 1.8).toFixed(2);
      params.gridDensity = +(0.7 + Math.random() * 0.8).toFixed(2);
      params.contourDensity = +(0.2 + Math.random() * 0.4).toFixed(2);
      params.wireThickness = +(0.8 + Math.random() * 0.8).toFixed(2);
      params.pulseSpeed = +(0.8 + Math.random() * 1.4).toFixed(2);
      params.particleSize = +(2.8 + Math.random() * 3.2).toFixed(1);
      params.floatAmplitude = +(1.2 + Math.random() * 2.0).toFixed(1);

      // Apply the color scheme (does not shuffle or touch postProcessor.settings)
      applyColorScheme(chosenScheme);
    }

    // =========================================================================
    // LIL-GUI SETUP
    // =========================================================================
    const gui = new GUI({ title: 'Topographic Big Data Waves' });

    // Folder: Scene & Presets
    const folderScene = gui.addFolder('Scene & Presets');
    folderScene.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Color Scheme').onChange(applyColorScheme);
    folderScene.add(params, 'activeAnimation', ANIMATIONS).name('Camera Mode');
    folderScene.add(params, 'animationSpeed', 0.0, 3.0, 0.05).name('Animation Speed');
    folderScene.add(params, 'greenscreen').name('Greenscreen (#00ff00)').onChange(updateSceneVisuals);
    folderScene.add(params, 'dpr', 0.5, 3.0, 0.25).name('Pixel Ratio (DPR)').onChange(v => {
      renderer.setPixelRatio(v);
      if (postProcessor) postProcessor.setSize(window.innerWidth, window.innerHeight, v);
    });
    folderScene.add(params, 'antialias').name('Antialiasing').onChange(v => {
      initRenderer(v);
      updateSceneVisuals();
    });
    folderScene.add(params, 'randomizeOnClick').name('Randomize on Click');
    folderScene.add({ randomize: randomizeScene }, 'randomize').name('🎲 Randomize Scene');

    // Folder: Terrain Waves
    const folderTerrain = gui.addFolder('Terrain Waves');
    folderTerrain.add(params, 'waveHeight', 2.0, 35.0, 0.5).name('Wave Height').onChange(updateSceneVisuals);
    folderTerrain.add(params, 'waveFrequency', 0.015, 0.12, 0.002).name('Frequency').onChange(updateSceneVisuals);
    folderTerrain.add(params, 'waveComplexity', 0.5, 4.0, 0.1).name('Noise Complexity').onChange(updateSceneVisuals);
    folderTerrain.add(params, 'gridDensity', 0.3, 2.5, 0.05).name('Grid Density').onChange(updateSceneVisuals);
    folderTerrain.add(params, 'contourDensity', 0.05, 1.0, 0.02).name('Contour Density').onChange(updateSceneVisuals);
    folderTerrain.add(params, 'wireThickness', 0.4, 2.5, 0.05).name('Line Thickness').onChange(updateSceneVisuals);
    folderTerrain.add(params, 'surfaceOpacity', 0.0, 1.0, 0.02).name('Surface Opacity').onChange(updateSceneVisuals);
    folderTerrain.add(params, 'pulseSpeed', 0.0, 4.0, 0.1).name('Data Surge Speed').onChange(updateSceneVisuals);

    // Folder: Data Particles
    const folderParticles = gui.addFolder('Data Particles');
    folderParticles.add(params, 'particlesEnabled').name('Enabled').onChange(updateSceneVisuals);
    folderParticles.add(params, 'particleSize', 1.0, 12.0, 0.2).name('Size').onChange(updateSceneVisuals);
    folderParticles.add(params, 'particleAlpha', 0.1, 1.0, 0.05).name('Alpha / Brightness').onChange(updateSceneVisuals);
    folderParticles.add(params, 'floatAmplitude', 0.0, 5.0, 0.1).name('Float Drift').onChange(updateSceneVisuals);

    // Folder: Data Beacons
    const folderBeacons = gui.addFolder('Data Beacons');
    folderBeacons.add(params, 'beaconsEnabled').name('Enabled').onChange(updateSceneVisuals);
    folderBeacons.add(params, 'beaconHeight', 5.0, 40.0, 1.0).name('Pillar Height').onChange(v => {
      beaconBeamGeometry.dispose();
      const newGeom = new THREE.CylinderGeometry(0.12, 0.35, v, 8, 1, true);
      newGeom.translate(0, v / 2, 0);
      beaconMeshes.forEach(b => {
        b.beam.geometry = newGeom;
        b.head.position.y = v;
      });
    });

    // Folder: Lighting & Exposure
    const folderLighting = gui.addFolder('Lighting & Exposure');
    folderLighting.add(params, 'exposure', 0.2, 3.0, 0.05).name('Scene Exposure').onChange(v => {
      renderer.toneMappingExposure = v;
    });
    folderLighting.addColor(params, 'ambientColor').name('Ambient Color').onChange(updateSceneVisuals);
    folderLighting.add(params, 'ambientIntensity', 0.0, 3.0, 0.05).name('Ambient Intensity').onChange(updateSceneVisuals);
    folderLighting.addColor(params, 'keyLightColor').name('Key Light Color').onChange(updateSceneVisuals);
    folderLighting.add(params, 'keyLightIntensity', 0.0, 4.0, 0.1).name('Key Light Intensity').onChange(updateSceneVisuals);
    folderLighting.add(params, 'keyLightX', -100, 100, 1).name('Key Light X').onChange(updateSceneVisuals);
    folderLighting.add(params, 'keyLightY', 10, 150, 1).name('Key Light Y').onChange(updateSceneVisuals);
    folderLighting.add(params, 'keyLightZ', -100, 100, 1).name('Key Light Z').onChange(updateSceneVisuals);
    folderLighting.addColor(params, 'fillLightColor').name('Fill Light Color').onChange(updateSceneVisuals);
    folderLighting.add(params, 'fillLightIntensity', 0.0, 3.0, 0.1).name('Fill Light Intensity').onChange(updateSceneVisuals);
    folderLighting.addColor(params, 'pointLightColor').name('Beacon Light Color').onChange(updateSceneVisuals);
    folderLighting.add(params, 'pointLightIntensity', 0.0, 6.0, 0.1).name('Beacon Intensity').onChange(updateSceneVisuals);

    // Folder: Color Palette Customization
    const folderColors = gui.addFolder('Custom Palette');
    folderColors.addColor(params, 'bgColor').name('Background').onChange(updateSceneVisuals);
    folderColors.addColor(params, 'wireColor').name('Wireframe Line').onChange(updateSceneVisuals);
    folderColors.addColor(params, 'accentColor').name('Surge Accent').onChange(updateSceneVisuals);
    folderColors.addColor(params, 'peakColor').name('Peaks Glow').onChange(updateSceneVisuals);
    folderColors.addColor(params, 'particleColor').name('Data Particles').onChange(updateSceneVisuals);
    folderColors.add(params, 'fogDensity', 0.001, 0.03, 0.001).name('Depth Fog Density').onChange(updateSceneVisuals);

    // Attach Post-Processing Suite (PostProcessor.js)
    initRenderer(params.antialias);
    postProcessor.attachGUI(gui, 'Post-Processing Suite (PostProcessor.js)');

    // =========================================================================
    // "H" KEY SHORTCUT (TOGGLE ALL UI)
    // =========================================================================
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        if (gui._hidden) {
          gui.show();
        } else {
          gui.hide();
        }
      }
    });

    // =========================================================================
    // RESIZE LISTENER
    // =========================================================================
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      if (postProcessor) {
        postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);
      }
    });

    // =========================================================================
    // INITIALIZATION
    // =========================================================================
    applyColorScheme('Original');

    // =========================================================================
    // CINEMATIC ANIMATION & MAIN RENDER LOOP
    // =========================================================================
    let clock = new THREE.Clock();
    let simTime = 0;

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      simTime += delta * params.animationSpeed;

      // Update shader uniforms
      terrainUniforms.uTime.value = simTime;
      particleUniforms.uTime.value = simTime;

      // Anchor beacons to dynamic wave surface and animate radar markers
      if (params.beaconsEnabled) {
        beaconMeshes.forEach((beacon) => {
          const terrainY = getTerrainHeightCPU(beacon.group.position.x, beacon.group.position.z, simTime);
          beacon.group.position.y = terrainY;

          beacon.head.rotation.y += delta * 1.5;
          beacon.head.rotation.x += delta * 0.8;

          const ringProgress = (simTime * 0.8 + beacon.phase) % 1.0;
          beacon.ring.position.y = ringProgress * (params.beaconHeight * 0.85);
          const ringScale = 1.0 + ringProgress * 1.8;
          beacon.ring.scale.set(ringScale, ringScale, 1.0);
          beacon.ring.material.opacity = (1.0 - ringProgress) * 0.75;
        });

        const centerWaveH = getTerrainHeightCPU(0, 0, simTime);
        beaconPointLight.position.set(0, centerWaveH + 16, 0);
      }

      // Smooth Automated Camera Movements (8 modes, pauses smoothly when user is interacting)
      if (!userInteracting && params.activeAnimation !== 'Calm Analytical Flow (Static Camera)') {
        const t = simTime;
        const mode = params.activeAnimation;

        if (mode === 'Orbital Survey') {
          const radius = 72;
          const targetX = Math.cos(t * 0.12) * radius;
          const targetZ = Math.sin(t * 0.12) * radius;
          const targetY = 36 + Math.sin(t * 0.15) * 6;
          camera.position.lerp(new THREE.Vector3(targetX, targetY, targetZ), 0.035);
          controls.target.lerp(new THREE.Vector3(0, 2, 0), 0.04);
        } else if (mode === 'Topographic Flyover') {
          const pathX = Math.sin(t * 0.1) * 22;
          const pathY = 18 + Math.sin(t * 0.16) * 4;
          const cycleZ = 45 - ((t * 8.5) % 90);
          camera.position.lerp(new THREE.Vector3(pathX, pathY, cycleZ), 0.04);
          controls.target.lerp(new THREE.Vector3(pathX * 0.4, 4, cycleZ - 36), 0.04);
        } else if (mode === 'Pulse Radar Scan') {
          const scanAngle = Math.sin(t * 0.15) * 0.85 + Math.PI * 0.25;
          const scanDist = 65;
          const scanX = Math.cos(scanAngle) * scanDist;
          const scanZ = Math.sin(scanAngle) * scanDist;
          const scanY = 32 + Math.cos(t * 0.12) * 6;
          camera.position.lerp(new THREE.Vector3(scanX, scanY, scanZ), 0.035);
          controls.target.lerp(new THREE.Vector3(0, 2, 0), 0.04);
        } else if (mode === 'Deep Trench Drift') {
          const trenchX = Math.cos(t * 0.09) * 24;
          const trenchZ = Math.sin(t * 0.09) * 24;
          const trenchY = 10 + Math.sin(t * 0.18) * 3;
          camera.position.lerp(new THREE.Vector3(trenchX, trenchY, trenchZ), 0.035);
          controls.target.lerp(new THREE.Vector3(Math.sin(t * 0.09) * 14, 6, Math.cos(t * 0.09) * 14), 0.04);
        } else if (mode === 'Big Data Surge') {
          const surgeX = Math.sin(t * 0.12) * 55;
          const surgeZ = Math.cos(t * 0.08) * 55;
          const surgeY = 32 + Math.sin(t * 0.2) * 10;
          camera.position.lerp(new THREE.Vector3(surgeX, surgeY, surgeZ), 0.035);
          controls.target.lerp(new THREE.Vector3(0, 3, 0), 0.04);
        } else if (mode === 'High-Altitude Overview') {
          const highX = Math.sin(t * 0.08) * 20;
          const highZ = Math.cos(t * 0.08) * 20 + 15;
          const highY = 75 + Math.sin(t * 0.06) * 6;
          camera.position.lerp(new THREE.Vector3(highX, highY, highZ), 0.035);
          controls.target.lerp(new THREE.Vector3(0, 0, 0), 0.04);
        } else if (mode === 'Horizon Wave Crest') {
          const horizX = Math.sin(t * 0.14) * 44;
          const horizY = 24 + Math.sin(t * 0.1) * 4;
          const horizZ = 46;
          camera.position.lerp(new THREE.Vector3(horizX, horizY, horizZ), 0.035);
          controls.target.lerp(new THREE.Vector3(horizX * 0.25, 6, -10), 0.04);
        }
      }

      controls.update();

      // Render via PostProcessor pipeline
      if (postProcessor) {
        if (postProcessor.settings.raysEnabled) {
          postProcessor.setMoonScreenPosition(camera, beaconPointLight.position);
        }
        postProcessor.renderScene(scene, camera);
      } else {
        renderer.render(scene, camera);
      }
    }

    animate();
  </script>
</body>
