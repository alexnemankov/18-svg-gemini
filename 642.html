<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#031425">
  <meta name="description" content="A slow, seamless study of light through frosted glass. Procedural film light leaks in ivory, vermilion, turquoise, and midnight blue.">
  <link rel="icon" href="data:,">
  <title>Emulsion — a study in borrowed light</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #031425; }
    body { position: fixed; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; }
    canvas { touch-action: none; cursor: grab; }
    canvas.dragging { cursor: grabbing; }
    .unavailable {
      position: fixed; inset: 0; display: grid; place-content: center;
      padding: 2rem; margin: 0; color: #f4e7c7;
      font: 16px/1.6 system-ui, sans-serif; text-align: center;
    }
  </style>
</head>
<body>
  <canvas aria-label="Slowly drifting ivory and coral light dissolving into turquoise and midnight blue" role="img"></canvas>
  <script type="module">
    /*
     * EMULSION
     * One file, one draw call, no visual assets or postprocessing buffers.
     * Open in a modern browser, or serve this directory and visit /642.html.
     * Three.js and lil-gui are pinned to specific releases.
     *
     * Every animated input is a function of the same 80-second phase.
     * The two noise domains travel on circles; neither translates in time.
     * Bloom is an analytic, energy-normalized Gaussian convolution, avoiding
     * repeated full-resolution renders and keeping the soft highlights intact.
     */
    const LOOP_SECONDS = 80;
    const canvas = document.querySelector('canvas');
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
    const coarsePointer = matchMedia('(pointer: coarse)');
    let renderer, material, geometry, gui, frameId = 0;
    let disposed = false;

    function showError(message, error) {
      cancelAnimationFrame(frameId);
      const notice = document.createElement('p');
      notice.className = 'unavailable';
      notice.setAttribute('role', 'status');
      notice.textContent = message;
      document.querySelector('.unavailable')?.remove();
      document.body.append(notice);
      if (error) console.error(error);
    }

    try {
      const THREE = await import('https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js');
      const { default: GUI } = await import('https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js');

      // Nineteen presets; invert provides both polarities of the achromatic sets.
      const palettes = {
        'Original': ['#f4e7c7', '#ef4928', '#c62c44', '#70d6b4', '#123c56', '#031425'],
        'Monochromatic': ['#e4efff', '#8dbaff', '#547ddb', '#3e65ad', '#152e59', '#050b1b'],
        'Analogous': ['#fff0c7', '#ff9b58', '#ef5964', '#cc608c', '#44213b', '#140b1a'],
        'Complementary': ['#ffe5b8', '#f68f45', '#e96334', '#48c5dc', '#154b68', '#07131e'],
        'Split-complementary': ['#fff0c2', '#f2ad58', '#ce6caf', '#64c8bc', '#273552', '#090f1c'],
        'Triadic': ['#fff1b0', '#ed6970', '#aa8ae8', '#65d4b7', '#23384c', '#0b1022'],
        'Tetradic': ['#ffe4b3', '#ff8b54', '#dc70ba', '#57c5d0', '#516e46', '#0c1520'],
        'Double split-complementary': ['#fff1c2', '#ff9973', '#d47ac5', '#7fd0a8', '#527ab0', '#101523'],
        'Achromatic': ['#ffffff', '#c8c8c8', '#a0a0a0', '#858585', '#252525', '#000000'],
        'Achromatic + Accent': ['#ffffff', '#eeeeee', '#ff2525', '#bbbbbb', '#313131', '#000000'],
        'Neutral + accent': ['#f3e9d4', '#c7b59d', '#e96338', '#a5a99f', '#464642', '#171918'],
        'Amber · F6AA1C': ['#F6AA1C', '#BC3908', '#941B0C', '#F6AA1C', '#220901'],
        'Lagoon · 63D1CF': ['#63D1CF', '#5BC0BE', '#4BAD9E', '#4BAD9E', '#0B132B', '#000000'],
        'Orchid · AA60C8': ['#AA60C8', '#D69ADE', '#C9A3C6', '#CFB5C2', '#0D001D', '#120A12'],
        'Saffron · FEF1BE': ['#FEF1BE', '#FFBA00', '#008189', '#00474D', '#061210'],
        'Chlorophyll · D4FFB0': ['#D4FFB0', '#7FFF00', '#00B894', '#0A3322', '#05140A'],
        'Ember · FFE8CC': ['#FFE8CC', '#FF8C00', '#C7501A', '#3D1050', '#0E0618'],
        'Iris · E8E0FF': ['#E8E0FF', '#B38FFF', '#6A3DE8', '#1A1250', '#090612'],
        'Electric · E0FBFF': ['#E0FBFF', '#00F0FF', '#D40078', '#1E0A3D', '#05020F']
      };
      const animationNames = [
        'Static camera', 'Emulsion drift', 'Slow orbit', 'Pendulum',
        'Figure eight', 'Breathing', 'Diagonal glide', 'Gentle roll'
      ];
      const settings = {
        scheme: 'Original', invert: false, greenscreen: false,
        highlight: '#f4e7c7', warm: '#ef4928', accent: '#c62c44',
        cool: '#70d6b4', shadow: '#123c56', background: '#031425',
        pixelRatio: Math.min(window.devicePixelRatio || 1, coarsePointer.matches ? 1 : 1.5),
        speed: reducedMotion.matches ? 0 : 1, animation: 'Emulsion drift',
        amplitude: 0.55, zoom: 1, panX: 0, panY: 0, angle: 0,
        orbitAngle: 0, fieldStretch: 1, bandWidth: 1, warp: 1,
        tilt: 0, grain: 0.014, seed: 0, randomizeOnClick: true
      };
      let originalColors = true;

      renderer = new THREE.WebGLRenderer({
        canvas, antialias: false, alpha: false, depth: false, stencil: false,
        powerPreference: 'high-performance', preserveDrawingBuffer: false
      });
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.0;

      const uniforms = {
        uTime: { value: 0 },
        uResolution: { value: new THREE.Vector2(1, 1) },
        uPixelRatio: { value: 1 },
        uGrain: { value: 0.014 },
        uOriginal: { value: 1 },
        uHighlight: { value: new THREE.Color(settings.highlight) },
        uWarm: { value: new THREE.Color(settings.warm) },
        uAccent: { value: new THREE.Color(settings.accent) },
        uCool: { value: new THREE.Color(settings.cool) },
        uShadow: { value: new THREE.Color(settings.shadow) },
        uBackground: { value: new THREE.Color(settings.background) },
        uGreen: { value: 0 },
        uInvert: { value: 0 },
        uPreserveAccent: { value: 0 },
        uPan: { value: new THREE.Vector2() },
        uZoom: { value: 1 },
        uAngle: { value: 0 },
        uSeed: { value: 0 },
        uStretch: { value: 1 },
        uBandWidth: { value: 1 },
        uWarp: { value: 1 },
        uTilt: { value: 0 }
      };

      const vertexShader = /* glsl */`
        varying vec2 vUv;

        void main() {
          vUv = position.xy * 0.5 + 0.5;
          gl_Position = vec4(position.xy, 0.0, 1.0);
        }
      `;

      const fragmentShader = /* glsl */`
        precision highp float;

        uniform float uTime;
        uniform vec2 uResolution;
        uniform float uPixelRatio;
        uniform float uGrain;
        uniform float uOriginal;
        uniform vec3 uHighlight, uWarm, uAccent, uCool, uShadow, uBackground;
        uniform float uGreen, uInvert, uPreserveAccent, uZoom, uAngle, uSeed;
        uniform float uStretch, uBandWidth, uWarp, uTilt;
        uniform vec2 uPan;
        varying vec2 vUv;

        const float TAU = 6.283185307179586;
        const float LOOP = 80.0;
        const float REFERENCE_ASPECT = 1.777777778;

        vec3 pigment(vec3 original, vec3 replacement, float energy) {
          return mix(replacement * energy, original, uOriginal);
        }

        // ---- Low-frequency gradient noise ---------------------------------
        // Quintic interpolation keeps the moving noise domains C2 continuous.
        vec2 gradientHash(vec2 p) {
          vec3 q = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973));
          q += dot(q, q.yxz + 33.33);
          return -1.0 + 2.0 * fract((q.xx + q.yz) * q.zy);
        }

        float gradientNoise(vec2 p) {
          vec2 cell = floor(p);
          vec2 f = fract(p);
          vec2 w = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
          float a = dot(gradientHash(cell), f);
          float b = dot(gradientHash(cell + vec2(1.0, 0.0)), f - vec2(1.0, 0.0));
          float c = dot(gradientHash(cell + vec2(0.0, 1.0)), f - vec2(0.0, 1.0));
          float d = dot(gradientHash(cell + vec2(1.0)), f - vec2(1.0));
          return mix(mix(a, b, w.x), mix(c, d, w.x), w.y) * 1.7;
        }

        float softFbm(vec2 p) {
          // Only three smooth octaves: these warp clouds, never draw texture.
          const mat2 turn = mat2(0.80, -0.60, 0.60, 0.80);
          float n = 0.62 * gradientNoise(p);
          p = turn * p * 1.91 + vec2(12.7, 7.1);
          n += 0.27 * gradientNoise(p);
          p = turn * p * 1.87 + vec2(4.8, 19.3);
          return n + 0.11 * gradientNoise(p);
        }

        // ---- Loopable frosted-glass deformation ---------------------------
        vec2 domainWarp(vec2 p, vec2 orbit, float phase) {
          vec2 seed = vec2(uSeed * 1.37, uSeed * 0.83);
          vec2 n = vec2(
            softFbm(p * 1.55 + orbit * 0.36 + vec2(8.2, 2.7) + seed),
            softFbm(p * 1.42 + orbit.yx * 0.31 + vec2(21.7, 13.4) + seed)
          );
          vec2 drift = vec2(sin(phase), cos(phase) - 1.0) * vec2(0.016, 0.013);
          return p + n * vec2(0.105, 0.085) * uWarp + drift;
        }

        // ---- Anisotropic light fields and analytic bloom ------------------
        vec2 rotateField(vec2 p, float angle) {
          float c = cos(angle), s = sin(angle);
          return mat2(c, -s, s, c) * p;
        }

        float gaussian(vec2 p, vec2 center, vec2 radius, float angle) {
          vec2 d = rotateField(p - center, angle) / radius;
          return exp(-0.5 * dot(d, d));
        }

        float diffusedGaussian(vec2 delta, vec2 radius, float diffusion) {
          vec2 spread = sqrt(radius * radius + vec2(diffusion * diffusion));
          vec2 d = delta / spread;
          // Convolution preserves total light energy as its footprint grows.
          return (radius.x * radius.y) / (spread.x * spread.y)
            * exp(-0.5 * dot(d, d));
        }

        vec3 lightField(vec2 p, vec2 center, vec2 radius, float angle) {
          vec2 delta = rotateField(p - center, angle);
          return vec3(
            diffusedGaussian(delta, radius, 0.0),
            diffusedGaussian(delta, radius, 0.065),
            diffusedGaussian(delta, radius, 0.155)
          );
        }

        vec3 emitLight(vec3 field, vec3 pigment, vec3 halation) {
          return pigment * (field.x + 0.075 * field.y)
            + halation * (0.085 * field.y + 0.045 * field.z);
        }

        // Positions are authored against the reference's 16:9 framing.
        // On narrow screens the same masses reframe without cropping out cyan.
        vec2 anchor(float x, float y, float aspect) {
          return vec2(x * aspect, y);
        }

        vec3 composeLight(vec2 p, float aspect, float phase, vec2 orbit) {
          float stretch = clamp(aspect / REFERENCE_ASPECT, 0.48, 1.65) * uStretch;
          float breath = 1.0 + 0.024 * sin(phase);
          float lean = -0.26 * min(stretch, 1.2) + 0.016 * sin(phase) + uTilt;
          vec2 q = domainWarp(p, orbit, phase);

          // Blue-black film base. All pigments and emissions are linear RGB.
          vec3 color = vec3(0.0);
          color += pigment(vec3(0.0005, 0.010, 0.024), uShadow, 0.06)
            * gaussian(q, anchor(0.77, 0.40, aspect), vec2(0.57 * stretch, 0.62), -0.1);

          // Burgundy at opposite ends of the dark side; never a second river.
          color += pigment(vec3(0.32, 0.008, 0.018), uAccent, 0.32)
            * gaussian(q, anchor(0.98, -0.055, aspect), vec2(0.145 * stretch, 0.14), -0.3);
          color += pigment(vec3(0.105, 0.003, 0.013), uAccent, 0.11)
            * gaussian(q, anchor(0.65, 0.91, aspect), vec2(0.15 * stretch, 0.24), -0.45);

          // An irregular diagonal signed-distance band is the red light leak.
          float riverCenter = aspect * (0.205 + (0.255 + uTilt * 0.18) * q.y);
          riverCenter += 0.025 * stretch * sin(4.4 * q.y + 0.20 * sin(phase));
          float distanceToRiver = (q.x - riverCenter)
            / sqrt(1.0 + pow(0.255 * aspect, 2.0));
          float riverWidth = (0.196 - 0.032 * smoothstep(0.30, 0.98, q.y)) * stretch * uBandWidth;
          float river = exp(-0.5 * pow(distanceToRiver / riverWidth, 2.0));
          float outerBleed = exp(-0.5 * pow(distanceToRiver / (riverWidth * 1.57), 2.0));
          color += pigment(vec3(0.87, 0.045, 0.022), uWarm, 0.9) * river;
          color += pigment(vec3(0.15, 0.013, 0.018), uWarm, 0.16) * outerBleed;

          // Vermilion and coral wrap the hot ivory cores in a broad red halo.
          color += pigment(vec3(1.10, 0.065, 0.023), uWarm, 1.1)
            * gaussian(q, anchor(0.055, 0.015, aspect), vec2(0.21 * stretch, 0.23), -0.40);
          color += pigment(vec3(0.66, 0.065, 0.026), uWarm, 0.7)
            * gaussian(q, anchor(0.445, 0.29, aspect), vec2(0.15 * stretch, 0.32), lean);
          color += pigment(vec3(0.90, 0.065, 0.018), uWarm, 0.9)
            * gaussian(q, anchor(0.54, 1.04, aspect), vec2(0.14 * stretch, 0.25), lean);

          vec3 upper = lightField(q, anchor(0.255, 0.10, aspect),
            vec2(0.137 * stretch, 0.255) * breath, lean);
          vec3 middle = lightField(q, anchor(0.336, 0.43, aspect),
            vec2(0.122 * stretch, 0.198) / breath, lean - 0.06);
          vec3 lower = lightField(q, anchor(0.445, 0.955, aspect),
            vec2(0.074 * stretch, 0.245) * breath, lean + 0.10);
          vec3 peach = lightField(q, anchor(0.246, 0.665, aspect),
            vec2(0.135 * stretch, 0.15), -0.65 * stretch);

          color += emitLight(upper, pigment(vec3(2.25, 2.55, 0.48), uHighlight, 2.8), pigment(vec3(1.0, 0.17, 0.035), uWarm, 1.0));
          color += emitLight(middle, pigment(vec3(1.50, 1.65, 0.30), uHighlight, 1.9), pigment(vec3(1.0, 0.22, 0.055), uWarm, 1.0));
          color += emitLight(lower, pigment(vec3(1.90, 1.56, 0.25), uHighlight, 2.1), pigment(vec3(1.0, 0.16, 0.025), uWarm, 1.0));
          color += emitLight(peach, pigment(vec3(0.74, 0.45, 0.17), uAccent, 0.9), pigment(vec3(1.0, 0.29, 0.15), uWarm, 1.0));

          // Thin veils of colored emulsion interrupt the otherwise continuous
          // hot band, leaving soft peach pockets and a red upper-left edge.
          float peachVeil = gaussian(q, anchor(0.275, 0.64, aspect),
            vec2(0.105 * stretch, 0.145), -0.75 * stretch);
          color *= mix(vec3(1.0), pigment(vec3(0.94, 0.48, 0.62), vec3(0.9), 1.0), peachVeil * 0.72);
          float redEdge = gaussian(q, anchor(-0.025, 0.005, aspect),
            vec2(0.155 * stretch, 0.19), -0.30);
          color *= mix(vec3(1.0), pigment(vec3(1.0, 0.34, 0.70), vec3(0.82), 1.0), redEdge * 0.86);

          // Broad teal shadows and a pale mint light well on the lower left.
          vec2 coolPoint = q + vec2(0.007 * sin(phase), 0.009 * (cos(phase) - 1.0));
          float cyanVeil = gaussian(coolPoint, anchor(0.055, 0.59, aspect),
            vec2(0.155 * stretch, 0.180), 0.38 * stretch);
          float coolOcclusion = gaussian(q, anchor(0.062, 0.75, aspect),
            vec2(0.12 * stretch, 0.23), 0.40 * stretch);
          color *= 1.0 - 0.82 * coolOcclusion;
          color += pigment(vec3(0.006, 0.26, 0.36), uCool, 0.4) * cyanVeil;

          vec3 mint = lightField(coolPoint, anchor(0.102, 0.625, aspect),
            vec2(0.072 * stretch, 0.126) * (1.0 + 0.025 * sin(phase + 0.8)),
            0.48 * stretch);
          mint += 0.35 * lightField(coolPoint, anchor(0.16, 0.725, aspect),
            vec2(0.040 * stretch, 0.09), 0.62 * stretch);
          color += emitLight(mint, pigment(vec3(0.22, 0.94, 0.67), uCool, 1.1), pigment(vec3(0.02, 0.31, 0.30), uCool, 0.4));
          color += pigment(vec3(0.027, 0.11, 0.12), uCool, 0.15)
            * gaussian(q, anchor(0.205, 0.82, aspect), vec2(0.09 * stretch, 0.11), 0.65);

          // A separate, subdued cyan window floats within the navy right side.
          vec3 rightCloud = lightField(q, anchor(0.858, 0.325, aspect),
            vec2(0.102 * stretch, 0.103) * (1.0 + 0.025 * sin(phase - 1.1)),
            0.65 * stretch);
          color += emitLight(rightCloud, pigment(vec3(0.075, 0.205, 0.21), uCool, 0.3), pigment(vec3(0.006, 0.08, 0.11), uCool, 0.12));
          color += pigment(vec3(0.001, 0.019, 0.041), uShadow, 0.08)
            * gaussian(q, anchor(0.90, 0.49, aspect), vec2(0.26 * stretch, 0.21), 0.0);

          float lowerShadow = gaussian(q, anchor(0.005, 1.035, aspect),
            vec2(0.265 * stretch, 0.145), -0.12);
          color *= 1.0 - lowerShadow * 0.95;

          return color;
        }

        // ---- Fine, fixed photographic grain -------------------------------
        float pixelHash(vec2 p) {
          vec3 h = fract(vec3(p.xyx) * 0.1031);
          h += dot(h, h.yzx + 33.33);
          return fract((h.x + h.y) * h.z);
        }

        float filmGrain(vec2 pixel) {
          // Two independent hashes produce gentle triangular, zero-mean grain.
          // Static on the emulsion: no frame-to-frame sparkle or loop seam.
          return pixelHash(pixel) + pixelHash(pixel + vec2(137.3, 91.7)) - 1.0;
        }

        vec3 finishLinear(vec3 color, vec2 uv) {
          vec2 v = (uv - 0.5) * vec2(1.0, 0.86);
          float vignette = 1.0 - 0.14 * smoothstep(0.08, 0.67, dot(v, v));
          return max(color * vignette, vec3(0.0));
        }

        void main() {
          float aspect = uResolution.x / max(uResolution.y, 1.0);
          vec2 p = vec2(vUv.x * aspect, 1.0 - vUv.y);
          vec2 center = vec2(aspect * 0.5, 0.5);
          p = rotateField((p - center - uPan) / uZoom, uAngle) + center;
          float phase = TAU * fract(uTime / LOOP);
          vec2 orbit = vec2(cos(phase), sin(phase));
          vec3 color = composeLight(p, aspect, phase, orbit);
          float matte = smoothstep(0.025, 0.18, max(color.r, max(color.g, color.b)));

          gl_FragColor = vec4(finishLinear(color, vUv), 1.0);
          // Use Three.js's linear HDR -> filmic -> sRGB pipeline exactly once.
          #include <tonemapping_fragment>
          #include <colorspace_fragment>

          // Grain and dithering belong after display conversion. Keep it fine
          // at high DPR while retaining enough noise to break 8-bit banding.
          vec2 grainPixel = gl_FragCoord.xy / max(1.0, uPixelRatio * 0.78);
          float luminance = dot(gl_FragColor.rgb, vec3(0.2126, 0.7152, 0.0722));
          float grain = filmGrain(grainPixel) * uGrain
            * mix(0.45, 1.0, smoothstep(0.015, 0.35, luminance));
          gl_FragColor.rgb = clamp(gl_FragColor.rgb + grain, 0.0, 1.0);
          float redAccent = smoothstep(0.025, 0.2,
            gl_FragColor.r - max(gl_FragColor.g, gl_FragColor.b)) * uPreserveAccent;
          gl_FragColor.rgb = mix(gl_FragColor.rgb, 1.0 - gl_FragColor.rgb, uInvert * (1.0 - redAccent));
          vec3 background = mix(uBackground, vec3(0.0, 1.0, 0.0), uGreen);
          // Composite in display space: clean background pixels stay exactly
          // the selected hex value, including ungraded, grain-free #00ff00.
          gl_FragColor.rgb = mix(background, gl_FragColor.rgb, matte);
        }
      `;

      const scene = new THREE.Scene();
      const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
      geometry = new THREE.BufferGeometry();
      // One oversized triangle covers the viewport without a diagonal seam.
      geometry.setAttribute('position', new THREE.Float32BufferAttribute([
        -1, -1, 0, 3, -1, 0, -1, 3, 0
      ], 3));
      material = new THREE.ShaderMaterial({
        uniforms, vertexShader, fragmentShader,
        depthTest: false, depthWrite: false, transparent: false,
        precision: 'highp'
      });
      const artwork = new THREE.Mesh(geometry, material);
      artwork.frustumCulled = false;
      scene.add(artwork);

      function syncColors() {
        uniforms.uOriginal.value = originalColors ? 1 : 0;
        for (const role of ['highlight', 'warm', 'accent', 'cool', 'shadow']) {
          uniforms['u' + role[0].toUpperCase() + role.slice(1)].value.set(settings[role]);
        }
        uniforms.uBackground.value.set(settings.background).convertLinearToSRGB();
        uniforms.uGreen.value = settings.greenscreen ? 1 : 0;
        uniforms.uInvert.value = settings.invert && settings.scheme.startsWith('Achromatic') ? 1 : 0;
        uniforms.uPreserveAccent.value = settings.scheme === 'Achromatic + Accent' ? 1 : 0;
        // Invert the background too, without changing the saved color or green.
        if (uniforms.uInvert.value) {
          const color = uniforms.uBackground.value;
          color.setRGB(1 - color.r, 1 - color.g, 1 - color.b, THREE.LinearSRGBColorSpace);
        }
      }

      function applyPalette() {
        const colors = palettes[settings.scheme];
        [settings.highlight, settings.warm, settings.accent, settings.cool] = colors;
        settings.shadow = colors.length === 6 ? colors[4] : colors[3];
        settings.background = colors.at(-1);
        originalColors = settings.scheme === 'Original';
        syncColors();
        gui.controllersRecursive().forEach(controller => controller.updateDisplay());
      }

      function resize() {
        const width = Math.max(1, window.innerWidth);
        const height = Math.max(1, window.innerHeight);
        renderer.setPixelRatio(settings.pixelRatio);
        renderer.setSize(width, height, false);
        renderer.getDrawingBufferSize(uniforms.uResolution.value);
        uniforms.uPixelRatio.value = settings.pixelRatio;
      }

      let elapsed = 0;
      let lastTime = performance.now();
      // User transforms never get overwritten by the animation. Camera motion
      // is a separate, periodic offset around the user's framing.
      function viewAtTime() {
        const phase = Math.PI * 2 * elapsed / LOOP_SECONDS;
        const a = settings.amplitude;
        const orbitPhase = settings.orbitAngle * Math.PI / 180;
        let x = 0, y = 0, angle = 0, scale = 1;
        switch (settings.animation) {
          case 'Emulsion drift':
            x = 0.045 * a * Math.sin(phase);
            y = 0.025 * a * (Math.cos(phase) - 1);
            break;
          case 'Slow orbit':
            x = 0.14 * a * Math.cos(phase + orbitPhase);
            y = 0.08 * a * Math.sin(phase + orbitPhase);
            angle = 0.08 * a * Math.sin(phase + orbitPhase);
            break;
          case 'Pendulum':
            x = 0.09 * a * Math.sin(phase);
            angle = 0.055 * a * Math.sin(phase);
            break;
          case 'Figure eight':
            x = 0.1 * a * Math.sin(phase);
            y = 0.05 * a * Math.sin(2 * phase);
            break;
          case 'Breathing':
            scale = Math.exp(0.07 * a * Math.sin(phase));
            break;
          case 'Diagonal glide':
            x = 0.085 * a * Math.sin(phase);
            y = 0.06 * a * Math.sin(phase);
            break;
          case 'Gentle roll':
            angle = 0.12 * a * Math.sin(phase);
            y = 0.025 * a * (Math.cos(phase) - 1);
            break;
        }
        return {
          x: settings.panX + x, y: settings.panY + y,
          angle: settings.angle * Math.PI / 180 + angle,
          zoom: settings.zoom * scale
        };
      }

      function updateUniforms() {
        const view = viewAtTime();
        uniforms.uPan.value.set(view.x, view.y);
        uniforms.uZoom.value = view.zoom;
        uniforms.uAngle.value = view.angle;
        uniforms.uTime.value = elapsed % LOOP_SECONDS;
        uniforms.uSeed.value = settings.seed;
        uniforms.uStretch.value = settings.fieldStretch;
        uniforms.uBandWidth.value = settings.bandWidth;
        uniforms.uWarp.value = settings.warp;
        uniforms.uTilt.value = settings.tilt;
        uniforms.uGrain.value = settings.grain;
      }

      const random = (min, max) => min + Math.random() * (max - min);
      function randomize() {
        const names = Object.keys(palettes);
        // A palette provides a balanced starting point; small coordinated hue
        // shifts make each generated theme unique while preserving its roles.
        settings.scheme = names[Math.floor(Math.random() * names.length)];
        applyPalette();
        const hueShift = random(-0.055, 0.055);
        for (const role of ['highlight', 'warm', 'accent', 'cool', 'shadow']) {
          settings[role] = '#' + new THREE.Color(settings[role]).offsetHSL(hueShift, 0, 0).getHexString();
        }
        originalColors = false;
        settings.seed = random(0, 100);
        settings.fieldStretch = random(0.72, 1.35);
        settings.bandWidth = random(0.65, 1.4);
        settings.warp = random(0.45, 1.8);
        settings.tilt = random(-0.45, 0.45);
        settings.animation = animationNames[1 + Math.floor(Math.random() * 7)];
        settings.amplitude = random(0.25, 0.9);
        settings.speed = random(0.35, 1.1);
        syncColors();
        gui.controllersRecursive().forEach(controller => controller.updateDisplay());
      }

      gui = new GUI({ title: 'Emulsion' });
      const colors = gui.addFolder('Colors');
      colors.add(settings, 'scheme', Object.keys(palettes)).name('Color scheme').listen().onChange(applyPalette);
      colors.add(settings, 'invert').name('Invert achromatic').onChange(syncColors);
      for (const [role, label] of Object.entries({ highlight: 'Highlight', warm: 'Light leak', accent: 'Accent', cool: 'Cool light', shadow: 'Shadow' })) {
        colors.addColor(settings, role).name(label).listen().onChange(() => {
          originalColors = false;
          syncColors();
        });
      }
      colors.addColor(settings, 'background').name('Background').listen().onChange(syncColors);
      colors.add(settings, 'greenscreen').name('Greenscreen').onChange(syncColors);
      const motion = gui.addFolder('Animation');
      motion.add(settings, 'animation', animationNames).name('Movement').listen();
      motion.add(settings, 'speed', 0, 30, 0.01).name('Speed').listen();
      motion.add(settings, 'amplitude', 0, 1.5, 0.01).name('Motion amount').listen();
      const view = gui.addFolder('View');
      view.add(settings, 'zoom', 0.15, 8, 0.01).name('Zoom').listen();
      view.add(settings, 'panX', -4, 4, 0.001).name('Pan X').listen();
      view.add(settings, 'panY', -4, 4, 0.001).name('Pan Y').listen();
      view.add(settings, 'angle', -180, 180, 0.1).name('Camera angle').listen();
      view.add(settings, 'orbitAngle', -180, 180, 0.1).name('Orbit angle');
      view.add({ reset() {
        settings.zoom = 1; settings.panX = 0; settings.panY = 0;
        settings.angle = 0; settings.orbitAngle = 0;
      } }, 'reset').name('Reset view');
      const emulsion = gui.addFolder('Emulsion');
      emulsion.add(settings, 'fieldStretch', 0.5, 1.6, 0.01).name('Field stretch').listen();
      emulsion.add(settings, 'bandWidth', 0.4, 1.8, 0.01).name('Band width').listen();
      emulsion.add(settings, 'warp', 0, 2.5, 0.01).name('Glass distortion').listen();
      emulsion.add(settings, 'tilt', -0.7, 0.7, 0.01).name('Light lean').listen();
      emulsion.add(settings, 'grain', 0, 0.06, 0.001).name('Film grain');
      emulsion.add(settings, 'seed', 0, 100, 0.01).name('Seed').listen();
      const output = gui.addFolder('Settings');
      output.add(settings, 'pixelRatio', 0.5, 3, 0.1).name('Pixel ratio').onChange(resize);
      output.add(settings, 'randomizeOnClick').name('Randomize on click');
      output.add({ randomize }, 'randomize').name('New variation');
      view.close(); emulsion.close();

      const inputEvents = new AbortController();
      const inputOptions = { signal: inputEvents.signal };
      let uiVisible = true;
      let gesture = null;
      let suppressClickUntil = 0;
      canvas.addEventListener('pointerdown', event => {
        if (gesture || !event.isPrimary || event.button !== 0) return;
        gesture = {
          id: event.pointerId, startX: event.clientX, startY: event.clientY,
          lastX: event.clientX, lastY: event.clientY, moved: false,
          rotate: event.shiftKey
        };
        canvas.setPointerCapture(event.pointerId);
        canvas.classList.add('dragging');
      }, inputOptions);
      canvas.addEventListener('pointermove', event => {
        if (!gesture || gesture.id !== event.pointerId) return;
        const distance = Math.hypot(event.clientX - gesture.startX, event.clientY - gesture.startY);
        if (!gesture.moved && distance < 5) return;
        if (gesture.rotate) {
          settings.angle = THREE.MathUtils.euclideanModulo(settings.angle + (event.clientX - gesture.lastX) * 0.2 + 180, 360) - 180;
        } else {
          const height = Math.max(1, canvas.clientHeight);
          settings.panX += (event.clientX - gesture.lastX) / height;
          settings.panY += (event.clientY - gesture.lastY) / height;
        }
        gesture.moved = true;
        gesture.lastX = event.clientX;
        gesture.lastY = event.clientY;
      }, inputOptions);
      function endGesture(event) {
        if (!gesture || gesture.id !== event.pointerId) return;
        if (gesture.moved || event.type === 'pointercancel') suppressClickUntil = performance.now() + 350;
        gesture = null;
        canvas.classList.remove('dragging');
        if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
      }
      canvas.addEventListener('pointerup', endGesture, inputOptions);
      canvas.addEventListener('pointercancel', endGesture, inputOptions);
      canvas.addEventListener('lostpointercapture', endGesture, inputOptions);
      canvas.addEventListener('click', event => {
        if (event.button === 0 && settings.randomizeOnClick && performance.now() > suppressClickUntil) randomize();
      }, inputOptions);
      canvas.addEventListener('wheel', event => {
        event.preventDefault();
        const delta = event.deltaY * (event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? canvas.clientHeight : 1);
        const oldZoom = settings.zoom;
        settings.zoom = THREE.MathUtils.clamp(oldZoom * Math.exp(-delta * 0.001), 0.15, 8);
        const ratio = settings.zoom / oldZoom;
        const current = viewAtTime();
        const bounds = canvas.getBoundingClientRect();
        const x = (event.clientX - bounds.left - bounds.width * 0.5) / bounds.height;
        const y = (event.clientY - bounds.top - bounds.height * 0.5) / bounds.height;
        settings.panX += (x - current.x) * (1 - ratio);
        settings.panY += (y - current.y) * (1 - ratio);
      }, { ...inputOptions, passive: false });
      document.addEventListener('keydown', event => {
        const target = event.target;
        if (event.code !== 'KeyH' || event.repeat || event.ctrlKey || event.metaKey || event.altKey ||
          target?.matches('input, textarea, select, [contenteditable="true"]')) return;
        uiVisible = !uiVisible;
        gui.show(uiVisible);
      }, inputOptions);

      function render(now) {
        frameId = 0;
        if (disposed || document.hidden || renderer.getContext().isContextLost()) return;
        elapsed = (elapsed + Math.min((now - lastTime) / 1000, 0.1) * settings.speed) % LOOP_SECONDS;
        lastTime = now;
        updateUniforms();
        renderer.render(scene, camera);
        frameId = requestAnimationFrame(render);
      }

      function resume() {
        cancelAnimationFrame(frameId);
        lastTime = performance.now();
        if (!document.hidden && !disposed) frameId = requestAnimationFrame(render);
      }
      const onContextLost = event => { event.preventDefault(); cancelAnimationFrame(frameId); };
      const onContextRestored = () => { resize(); resume(); };
      const onVisibility = () => {
        if (document.hidden) cancelAnimationFrame(frameId);
        else resume();
      };
      window.addEventListener('resize', resize, { passive: true });
      document.addEventListener('visibilitychange', onVisibility);
      canvas.addEventListener('webglcontextlost', onContextLost);
      canvas.addEventListener('webglcontextrestored', onContextRestored);
      window.addEventListener('pagehide', event => {
        if (event.persisted) return;
        disposed = true;
        cancelAnimationFrame(frameId);
        inputEvents.abort();
        gui.destroy();
        geometry.dispose(); material.dispose(); renderer.dispose();
        window.removeEventListener('resize', resize);
        document.removeEventListener('visibilitychange', onVisibility);
        canvas.removeEventListener('webglcontextlost', onContextLost);
        canvas.removeEventListener('webglcontextrestored', onContextRestored);
      }, { once: true });

      syncColors();
      resize();
      resume();
    } catch (error) {
      gui?.destroy();
      geometry?.dispose();
      material?.dispose();
      renderer?.dispose();
      showError('This light study needs WebGL 2 and an internet connection to load its controls.', error);
    }
  </script>
</body>
</html>
