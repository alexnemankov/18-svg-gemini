    // ------------------------------------------------------------------------
    // Helper: Create Round Antialiased Particle Texture (Strictly Round)
    // ------------------------------------------------------------------------
    function createRoundParticleTexture() {
      const size = 128;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      const center = size / 2;
      const radius = size / 2;

      const grad = ctx.createRadialGradient(center, center, 0, center, center, radius);
      grad.addColorStop(0.0, 'rgba(255, 255, 255, 1.0)');
      grad.addColorStop(0.2, 'rgba(255, 255, 255, 0.9)');
      grad.addColorStop(0.45, 'rgba(255, 255, 255, 0.45)');
      grad.addColorStop(0.75, 'rgba(255, 255, 255, 0.12)');
      grad.addColorStop(1.0, 'rgba(255, 255, 255, 0.0)');

      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, size, size);

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.ClampToEdgeWrapping;
      texture.wrapT = THREE.ClampToEdgeWrapping;
      texture.needsUpdate = true;
      return texture;
    }

    const roundParticleMap = createRoundParticleTexture();

    // ------------------------------------------------------------------------

    // ------------------------------------------------------------------------

      // Lights

    // ------------------------------------------------------------------------
    // Renderer, Scene, Camera Setup
    // ------------------------------------------------------------------------
    const container = document.getElementById('webgl-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(params.bgColor);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(32, 18, 36);

    let renderer;
    let controls;

    function initRenderer(antialias) {
      if (renderer) {
        const oldDom = renderer.domElement;
        renderer.dispose();
        if (oldDom && oldDom.parentElement) {
          oldDom.parentElement.removeChild(oldDom);
        }
      }

      renderer = new THREE.WebGLRenderer({
        antialias: antialias,
        powerPreference: 'high-performance'
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(params.dpr);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = params.exposure;
      container.appendChild(renderer.domElement);

      if (controls) {
        controls.dispose();
      }

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.screenSpacePanning = true;
      controls.minDistance = 4;
      controls.maxDistance = 300;
      controls.target.set(0, 0, 0);

      bindPointerEvents(renderer.domElement);
    }

    // ------------------------------------------------------------------------
    // Lighting
    // ------------------------------------------------------------------------
    const ambientLight = new THREE.AmbientLight(params.ambientColor, params.ambientIntensity);
    scene.add(ambientLight);

    const dirLight1 = new THREE.DirectionalLight(params.dir1Color, params.dir1Intensity);
    dirLight1.position.set(40, 50, 30);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(params.dir2Color, params.dir2Intensity);
    dirLight2.position.set(-40, -30, -30);
    scene.add(dirLight2);

    const corePointLight = new THREE.PointLight(params.coreLightColor, params.coreLightIntensity, params.coreLightDistance);
    corePointLight.position.set(0, 0, 0);
    scene.add(corePointLight);

    // ------------------------------------------------------------------------
    // Deep Space Cosmic Environment (with ROUND particles)
    // ------------------------------------------------------------------------
    const backgroundGroup = new THREE.Group();
    scene.add(backgroundGroup);

    // Round Particle Starfield
    const starCount = 1800;
    const starGeo = new THREE.BufferGeometry();
    const starPositions = new Float32Array(starCount * 3);
    const starColors = new Float32Array(starCount * 3);
    const starSizes = new Float32Array(starCount);

    const colCore = new THREE.Color(params.coreColor);
    const colAccent = new THREE.Color(params.accentColor);

    for (let i = 0; i < starCount; i++) {
      starPositions[i * 3 + 0] = (Math.random() - 0.5) * 360;
      starPositions[i * 3 + 1] = (Math.random() - 0.5) * 250;
      starPositions[i * 3 + 2] = (Math.random() - 0.5) * 360;

      const mix = Math.random();
      const col = mix < 0.6 ? new THREE.Color(0x3d6699) : (mix < 0.85 ? colCore : colAccent);
      starColors[i * 3 + 0] = col.r;
      starColors[i * 3 + 1] = col.g;
      starColors[i * 3 + 2] = col.b;

      starSizes[i] = 1.0 + Math.random() * 2.5;

    starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    starGeo.setAttribute('color', new THREE.BufferAttribute(starColors, 3));

    // Futuristic Cyber Floor Grid with Depth Fade
    const cyberGrid = new THREE.GridHelper(220, 55, 0x224a77, 0x0c1b2c);

    // ------------------------------------------------------------------------
    // Custom Shaders
    // ------------------------------------------------------------------------

    // 1. Plasma Core Energy Shader (Fresnel + Animated Noise Waves)
    const CorePlasmaShader = {
      uniforms: {
        uTime: { value: 0 },
        uCoreColor: { value: new THREE.Color(params.coreColor) },
        uAccentColor: { value: new THREE.Color(params.accentColor) }
      },
      vertexShader: `
        varying vec3 vNormal;
        varying vec3 vPosition;
        varying vec3 vViewPosition;
        uniform float uTime;

        void main() {
          vNormal = normalize(normalMatrix * normal);
          vPosition = position;
          // Subtly pulsate vertices along normals
          float displacement = sin(position.x * 2.5 + uTime * 4.0) * cos(position.y * 2.5 + uTime * 3.0) * 0.12;
          vec3 newPos = position + normal * displacement;
          vec4 mvPosition = modelViewMatrix * vec4(newPos, 1.0);
          vViewPosition = -mvPosition.xyz;
          gl_Position = projectionMatrix * mvPosition;
        }
      `,
      fragmentShader: `
        varying vec3 vNormal;
        varying vec3 vPosition;
        varying vec3 vViewPosition;
        uniform float uTime;
        uniform vec3 uCoreColor;
        uniform vec3 uAccentColor;

        void main() {
          vec3 normal = normalize(vNormal);
          vec3 viewDir = normalize(vViewPosition);

          // Fresnel Rim Light
          float fresnel = 1.0 - max(0.0, dot(normal, viewDir));
          fresnel = pow(fresnel, 2.2);

          // Animated energy banding
          float wave = sin(vPosition.y * 4.0 + vPosition.x * 3.0 + uTime * 5.0) * 0.5 + 0.5;
          vec3 color = mix(uCoreColor, uAccentColor, wave * 0.6 + fresnel * 0.4);

          float alpha = clamp(0.55 + fresnel * 0.65, 0.0, 1.0);
          gl_FragColor = vec4(color * (1.2 + fresnel * 1.5), alpha);
        }
      `
    };

    const corePlasmaMaterial = new THREE.ShaderMaterial({
      uniforms: CorePlasmaShader.uniforms,
      vertexShader: CorePlasmaShader.vertexShader,
      fragmentShader: CorePlasmaShader.fragmentShader,
      transparent: true,
      blending: THREE.AdditiveBlending,
      side: THREE.DoubleSide,
      depthWrite: false
    });

    // 2. Holographic Hexagonal Firewall Barrier Shader
    const FiltrationBarrierShader = {
      uniforms: {
        uTime: { value: 0 },
        uColor: { value: new THREE.Color(params.filteredColor) },
        uAccent: { value: new THREE.Color(params.accentColor) },
        uOpacity: { value: params.shieldOpacity }
      },
      vertexShader: `
        varying vec2 vUv;
        varying vec3 vNormal;
        varying vec3 vViewPosition;

        void main() {
          vUv = uv;
          vNormal = normalize(normalMatrix * normal);
          vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
          vViewPosition = -mvPosition.xyz;
          gl_Position = projectionMatrix * mvPosition;
        }
      `,
      fragmentShader: `
        varying vec2 vUv;
        varying vec3 vNormal;
        varying vec3 vViewPosition;
        uniform float uTime;
        uniform vec3 uColor;
        uniform vec3 uAccent;
        uniform float uOpacity;

        // Hexagonal grid procedural generator
        float hexDist(vec2 p) {
          p = abs(p);
          float c = dot(p, normalize(vec2(1.0, 1.73205)));
          return max(c, p.x);
        }

        vec4 hexGrid(vec2 uv) {
          vec2 r = vec2(1.0, 1.73205);
          vec2 h = r * 0.5;
          vec2 a = mod(uv, r) - h;
          vec2 b = mod(uv - h, r) - h;
          vec2 gv = length(a) < length(b) ? a : b;
          float d = hexDist(gv);
          return vec4(gv, d, 0.0);
        }

        void main() {
          vec3 normal = normalize(vNormal);
          vec3 viewDir = normalize(vViewPosition);
          float fresnel = pow(1.0 - abs(dot(normal, viewDir)), 2.0);

          // Hex grid pattern
          vec4 hex = hexGrid(vUv * 36.0);
          float edge = smoothstep(0.44, 0.49, hex.z);

          // Scanning sweep beam
          float scan = sin(vUv.x * 24.0 - uTime * 6.0) * 0.5 + 0.5;
          scan = pow(scan, 8.0);

          // Radial fade for ring
          float rad = length(vUv - vec2(0.5));
          float radialGlow = smoothstep(0.5, 0.25, rad);

          vec3 baseCol = mix(uColor, uAccent, edge * 0.7 + scan * 0.5);
          float alpha = (edge * 0.8 + scan * 0.6 + fresnel * 0.7) * uOpacity * radialGlow;

          gl_FragColor = vec4(baseCol * (1.3 + scan), clamp(alpha, 0.0, 1.0));
        }
      `
    };

    const filtrationMaterial = new THREE.ShaderMaterial({
      uniforms: FiltrationBarrierShader.uniforms,
      vertexShader: FiltrationBarrierShader.vertexShader,
      fragmentShader: FiltrationBarrierShader.fragmentShader,
      transparent: true,

      side: THREE.DoubleSide,
      depthWrite: false

    // 3. High-Speed Outbound Conduit Flow Shader

      uniforms: {
        uTime: { value: 0 },
        uColor: { value: new THREE.Color(params.outboundColor) },
        uAccent: { value: new THREE.Color(params.accentColor) }

        varying vec2 vUv;
        varying vec3 vNormal;
        varying vec3 vViewPosition;

        void main() {
          vUv = uv;
          vNormal = normalize(normalMatrix * normal);
          vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
          vViewPosition = -mvPosition.xyz;
          gl_Position = projectionMatrix * mvPosition;
        }
      `,
      fragmentShader: `
        varying vec2 vUv;
        varying vec3 vNormal;
        varying vec3 vViewPosition;
        uniform float uTime;
        uniform vec3 uColor;
        uniform vec3 uAccent;

        void main() {
          vec3 normal = normalize(vNormal);
          vec3 viewDir = normalize(vViewPosition);
          float fresnel = pow(1.0 - abs(dot(normal, viewDir)), 2.8);

          // Longitudinal high-speed data flow pulses
          float flow = sin(vUv.x * 55.0 - uTime * 12.0) * 0.5 + 0.5;
          flow = pow(flow, 5.0);

          // Segment rings
          float rings = sin(vUv.x * 120.0) * 0.5 + 0.5;
          rings = smoothstep(0.7, 0.9, rings) * 0.4;

          vec3 col = mix(uColor, uAccent, flow * 0.7);
          float alpha = clamp(fresnel * 0.75 + flow * 0.55 + rings, 0.0, 0.95);

          gl_FragColor = vec4(col * (1.2 + flow * 1.5), alpha);
        }
      `
    };

    const conduitMaterial = new THREE.ShaderMaterial({
      uniforms: ConduitFlowShader.uniforms,
      vertexShader: ConduitFlowShader.vertexShader,
      fragmentShader: ConduitFlowShader.fragmentShader,
      transparent: true,
      blending: THREE.AdditiveBlending,
      side: THREE.DoubleSide,
      depthWrite: false
    });

    // ------------------------------------------------------------------------
    // Gateway Core Assembly
    // ------------------------------------------------------------------------
    const gatewayGroup = new THREE.Group();
    scene.add(gatewayGroup);

    const metalMat = new THREE.MeshStandardMaterial({

      metalness: 0.95,

      emissiveIntensity: 1.2,
      roughness: 0.2

    // Inner Faceted Nucleus
    const innerNucleus = new THREE.Mesh(new THREE.IcosahedronGeometry(2.1, 1), coreCrystalMat);
    gatewayGroup.add(innerNucleus);

    const plasmaShell = new THREE.Mesh(new THREE.IcosahedronGeometry(2.65, 3), corePlasmaMaterial);
    gatewayGroup.add(plasmaShell);

    // Rotating Geometric Cage (Nested octahedrons & wireframe)
    const cageGeo = new THREE.IcosahedronGeometry(3.35, 1);
    const cageMat = new THREE.MeshBasicMaterial({
      color: params.accentColor,
      wireframe: true,
      transparent: true,
      opacity: 0.65

    const coreCage = new THREE.Mesh(cageGeo, cageMat);
    gatewayGroup.add(coreCage);

    // Holographic Circular HUD / Reticle Rings
    const hudGroup = new THREE.Group();
    gatewayGroup.add(hudGroup);

    function createHudRing(radius, segments, color) {
      const geo = new THREE.BufferGeometry();
      const pos = [];
      for (let i = 0; i < segments; i++) {
        if (i % 3 === 0) continue; // broken tick-mark dashes
        const a1 = (i / segments) * Math.PI * 2;
        const a2 = ((i + 0.6) / segments) * Math.PI * 2;
        pos.push(0, Math.cos(a1) * radius, Math.sin(a1) * radius);
        pos.push(0, Math.cos(a2) * radius, Math.sin(a2) * radius);
      }
      geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      const mat = new THREE.LineBasicMaterial({
        color: color,
        transparent: true,
        opacity: 0.75,
        blending: THREE.AdditiveBlending
      });
      return new THREE.LineSegments(geo, mat);
    }

    // Central Stargate Aperture Ring

    apertureRing.rotation.y = Math.PI / 2;

    // Energy Conduit Spokes (connecting aperture to core)

    for (let i = 0; i < spokesCount; i++) {
      const angle = (i / spokesCount) * Math.PI * 2;
      const spoke = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 2.3, 8), accentMat);
      spoke.position.set(0, Math.sin(angle) * 3.5, Math.cos(angle) * 3.5);

    // ------------------------------------------------------------------------
    // Defensive Orbital Rings & Defense Sentinels
    // ------------------------------------------------------------------------
    const ringsGroup = new THREE.Group();
    gatewayGroup.add(ringsGroup);

    // Ring 1: High-Tech Gimbal Gyro Ring
    const ring1 = new THREE.Mesh(new THREE.TorusGeometry(7.2, 0.28, 16, 80), ringMat);
    ringsGroup.add(ring1);

    // Sensor Capacitor Nodes on Ring 1
    const nodeGeo = new THREE.BoxGeometry(0.65, 0.65, 0.9);

    // Ring 3: Outer Fortress Perimeter with Orbiting Firewall Sentinels

      chassis.rotation.z = Math.PI / 2;

    // Ring 4: Quantum Braided Particle Ring (ROUND PARTICLES)
    const ring4Count = 420;

    const ring4Pos = new Float32Array(ring4Count * 3);
    const ring4Colors = new Float32Array(ring4Count * 3);

    for (let i = 0; i < ring4Count; i++) {
      const a = (i / ring4Count) * Math.PI * 2;

      ring4Pos[i * 3 + 0] = Math.cos(a) * 17.5 + helix * 0.4;
      ring4Pos[i * 3 + 1] = Math.sin(a) * 17.5;
      ring4Pos[i * 3 + 2] = Math.cos(i * 0.25) * 1.2;

      const c = (i % 2 === 0) ? colCore : colAccent;
      ring4Colors[i * 3 + 0] = c.r;
      ring4Colors[i * 3 + 1] = c.g;
      ring4Colors[i * 3 + 2] = c.b;
    }
    ring4Geo.setAttribute('position', new THREE.BufferAttribute(ring4Pos, 3));
    ring4Geo.setAttribute('color', new THREE.BufferAttribute(ring4Colors, 3));

    const ring4Mat = new THREE.PointsMaterial({

      vertexColors: true,
      transparent: true,

      blending: THREE.AdditiveBlending,

    const ring4Points = new THREE.Points(ring4Geo, ring4Mat);
    ringsGroup.add(ring4Points);

    // ------------------------------------------------------------------------
    // Filtration Barrier & Firewall Zone (X = -4.5 to -3.5)
    // ------------------------------------------------------------------------
    const filtrationGroup = new THREE.Group();
    filtrationGroup.position.x = -4.2;
    scene.add(filtrationGroup);

    // Holographic Hexagonal Curtain
    const filterPlane = new THREE.Mesh(new THREE.PlaneGeometry(15, 15), filtrationMaterial);
    filterPlane.rotation.y = Math.PI / 2;

    // Heavy Shield Boundary Ring

    // Dynamic Deflection Sparks (ROUND PARTICLES)
    const sparkCount = 220;
    const sparkGeo = new THREE.BufferGeometry();
    const sparkPositions = new Float32Array(sparkCount * 3);
    const sparkVel = [];

    for (let i = 0; i < sparkCount; i++) {

      sparkPositions[i * 3 + 0] = (Math.random() - 0.5) * 1.8;
      sparkPositions[i * 3 + 1] = Math.sin(angle) * rad;
      sparkPositions[i * 3 + 2] = Math.cos(angle) * rad;

      sparkVel.push({

    const TRAIL_PER_PACKET = 4;
    const totalTrailCount = INBOUND_COUNT * TRAIL_PER_PACKET;
    const trailGeo = new THREE.BufferGeometry();
    const trailPositions = new Float32Array(totalTrailCount * 3);

    for (let i = 0; i < INBOUND_COUNT; i++) {

      const mesh = new THREE.Mesh(geo, inboundMat.clone());

      const scale = 0.55 + Math.random() * 0.85;
      mesh.scale.set(scale, scale, scale);

      const startX = -72 - Math.random() * 32;
      const startY = (Math.random() - 0.5) * 32;
      const startZ = (Math.random() - 0.5) * 32;

      inboundGroup.add(mesh);

      inboundPackets.push({
        mesh,
        progress: Math.random(),
        speed: 0.0028 + Math.random() * 0.0042,
        startX,
        startY,
        startZ,
        rotSpeed: new THREE.Vector3(

    // ------------------------------------------------------------------------

    const outboundGroup = new THREE.Group();

    const conduitGeo = new THREE.CylinderGeometry(3.6, 3.6, 52, 32, 1, true);
    conduitGeo.rotateZ(Math.PI / 2);
    conduitGeo.translate(28, 0, 0);
    const conduitMesh = new THREE.Mesh(conduitGeo, conduitMaterial);
    outboundGroup.add(conduitMesh);

    // Superconducting Guide Rails
    const railMat = new THREE.MeshStandardMaterial({
      color: params.outboundColor,
      emissive: params.outboundColor,
      emissiveIntensity: 0.8,
      roughness: 0.15,
      metalness: 0.95
    });

    const railGeo = new THREE.CylinderGeometry(0.12, 0.12, 54, 16);
    railGeo.rotateZ(Math.PI / 2);

    const railOffsets = [
      { y: 2.6, z: 2.6 },
      { y: -2.6, z: 2.6 },
      { y: 2.6, z: -2.6 },
      { y: -2.6, z: -2.6 }
    ];

    railOffsets.forEach(pos => {
      const rail = new THREE.Mesh(railGeo, railMat);
      rail.position.set(28, pos.y, pos.z);
      outboundGroup.add(rail);
    });

    // High-Tech Magnetic Accelerator Rings
    const accelRings = [];
    const accelRingGeo = new THREE.TorusGeometry(3.9, 0.22, 16, 64);
    accelRingGeo.rotateY(Math.PI / 2);
    const accelPositions = [6, 14, 22, 30, 38, 46];

    accelPositions.forEach((x, idx) => {
      const ringAssembly = new THREE.Group();
      ringAssembly.position.x = x;

      const mainRing = new THREE.Mesh(accelRingGeo, ringMat);
      ringAssembly.add(mainRing);

      // Armored energy brackets
      for (let b = 0; b < 4; b++) {
        const ang = (b / 4) * Math.PI * 2;
        const bracket = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), metalMat);
        bracket.position.set(0, Math.sin(ang) * 3.9, Math.cos(ang) * 3.9);

        const glowNode = new THREE.Mesh(new THREE.SphereGeometry(0.24, 10, 10), accentMat);
        bracket.add(glowNode);
        ringAssembly.add(bracket);
      }

      outboundGroup.add(ringAssembly);
      accelRings.push({ assembly: ringAssembly, mainRing, baseIdx: idx });
    });

    // Orderly Aligned Outbound Data Packets
    const outboundMat = new THREE.MeshStandardMaterial({
      color: params.outboundColor,
      emissive: params.outboundColor,
      emissiveIntensity: 1.1,
      roughness: 0.12,
      metalness: 0.95
    });

    const OUTBOUND_COUNT = 42;
    const outboundPackets = [];
    const packetGeo = new THREE.OctahedronGeometry(0.85, 0);

    const outboundTracks = [
      { y: 0, z: 0 },
      { y: 1.3, z: 1.3 },
      { y: -1.3, z: -1.3 }
    ];

    for (let i = 0; i < OUTBOUND_COUNT; i++) {
      const mesh = new THREE.Mesh(packetGeo, outboundMat);
      mesh.scale.set(0.65, 0.65, 1.45); // Aerodynamic cyber diamond
      mesh.rotation.y = Math.PI / 4;
      outboundGroup.add(mesh);

      const track = outboundTracks[i % outboundTracks.length];
      outboundPackets.push({
        mesh,
        progress: i / OUTBOUND_COUNT,
        speed: 0.0075,
        trackY: track.y,
        trackZ: track.z
      });
    }

    // ------------------------------------------------------------------------
    // Color Schemes & Dynamic Palettes Application
    // ------------------------------------------------------------------------
    function applyColorScheme(schemeName) {
      const scheme = COLOR_SCHEMES[schemeName];
      if (!scheme) return;

      params.colorScheme = schemeName;
      params.bgColor = scheme.bg;
      params.coreColor = scheme.core;
      params.ringsColor = scheme.rings;
      params.inboundColor = scheme.inboundRaw;
      params.filteredColor = scheme.filtered;
      params.outboundColor = scheme.outbound;
      params.accentColor = scheme.accent;

      updateVisualColors();
    }

    function updateVisualColors() {
      // Background & Visibility
      if (params.greenscreen) {
        scene.background.set('#00ff00');
        backgroundGroup.visible = false;
      } else {
        scene.background.set(params.bgColor);
        backgroundGroup.visible = true;
      }

      // Lights
      ambientLight.color.set(params.ambientColor);
      ambientLight.intensity = params.ambientIntensity;

      dirLight1.color.set(params.dir1Color);
      dirLight1.intensity = params.dir1Intensity;

      dirLight2.color.set(params.dir2Color);
      dirLight2.intensity = params.dir2Intensity;

      corePointLight.color.set(params.coreLightColor);
      corePointLight.intensity = params.coreLightIntensity;
      corePointLight.distance = params.coreLightDistance;

      // Gateway Materials
      coreCrystalMat.color.set(params.coreColor);
      coreCrystalMat.emissive.set(params.coreColor);

      ringMat.color.set(params.ringsColor);
      ringMat.emissive.set(params.ringsColor);

      accentMat.color.set(params.accentColor);
      accentMat.emissive.set(params.accentColor);

      coreCage.material.color.set(params.accentColor);
      hudRing1.material.color.set(params.accentColor);
      hudRing2.material.color.set(params.coreColor);

      // Shaders Uniforms
      CorePlasmaShader.uniforms.uCoreColor.value.set(params.coreColor);
      CorePlasmaShader.uniforms.uAccentColor.value.set(params.accentColor);

      FiltrationBarrierShader.uniforms.uColor.value.set(params.filteredColor);
      FiltrationBarrierShader.uniforms.uAccent.value.set(params.accentColor);
      FiltrationBarrierShader.uniforms.uOpacity.value = params.shieldOpacity;

      ConduitFlowShader.uniforms.uColor.value.set(params.outboundColor);
      ConduitFlowShader.uniforms.uAccent.value.set(params.accentColor);

      // Sparks & Trails
      sparkMat.color.set(params.accentColor);

      // Inbound & Outbound
      inboundMat.color.set(params.inboundColor);
      inboundMat.emissive.set(params.inboundColor);
      inboundPackets.forEach(p => {
        p.mesh.material.color.set(params.inboundColor);
        p.mesh.material.emissive.set(params.inboundColor);
      });

      railMat.color.set(params.outboundColor);
      railMat.emissive.set(params.outboundColor);

      outboundMat.color.set(params.outboundColor);
      outboundMat.emissive.set(params.outboundColor);

      // Update Starfield Colors
      const c1 = new THREE.Color(params.coreColor);
      const c2 = new THREE.Color(params.accentColor);
      const sc = starGeo.attributes.color.array;
      for (let i = 0; i < starCount; i++) {
        if (i % 3 === 0) {
          sc[i * 3 + 0] = c1.r;
          sc[i * 3 + 1] = c1.g;
          sc[i * 3 + 2] = c1.b;
        } else if (i % 3 === 1) {
          sc[i * 3 + 0] = c2.r;
          sc[i * 3 + 1] = c2.g;
          sc[i * 3 + 2] = c2.b;
        }
      }
      starGeo.attributes.color.needsUpdate = true;
    }

    // ------------------------------------------------------------------------
    // Procedural Variation & Click Randomizer
    // ------------------------------------------------------------------------
    let pointerDownPos = { x: 0, y: 0 };

    function bindPointerEvents(domElement) {
      domElement.addEventListener('pointerdown', (e) => {
        pointerDownPos = { x: e.clientX, y: e.clientY };
      });

      domElement.addEventListener('pointerup', (e) => {
        const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
        // Distinguish click from drag/orbit
        if (dist < 5 && params.randomizeOnClick && !e.target.closest('.lil-gui')) {
          randomizeScene();
        }
      });
    }

    function randomizeScene() {
      // Pick random color palette
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      applyColorScheme(randomScheme);

      // Re-roll motion and geometric parameters
      params.animSpeed = Number((0.65 + Math.random() * 1.35).toFixed(2));
      params.ringSpeed = Number((0.7 + Math.random() * 1.5).toFixed(2));
      params.ingestionSpeed = Number((0.75 + Math.random() * 1.5).toFixed(2));
      params.pipelineSpeed = Number((0.85 + Math.random() * 1.4).toFixed(2));
      params.coreScale = Number((0.95 + Math.random() * 0.45).toFixed(2));
      params.exposure = Number((1.0 + Math.random() * 0.5).toFixed(2));
      params.shieldOpacity = Number((0.35 + Math.random() * 0.45).toFixed(2));
      renderer.toneMappingExposure = params.exposure;

      // Rescale core
      gatewayGroup.scale.set(params.coreScale, params.coreScale, params.coreScale);

      // Randomize packet sizes
      inboundPackets.forEach(p => {
        const s = (0.45 + Math.random() * 0.95) * params.coreScale;
        p.mesh.scale.set(s, s, s);
      });

      // Update lil-gui controls display
      if (gui) {
        gui.controllersRecursive().forEach(ctrl => ctrl.updateDisplay());
      }
    }

      applyColorScheme(v);

    fTheme.add(params, 'dpr', 0.5, 3.0, 0.25).name('Pixel Ratio (DPR)').onChange(v => {

    fLight.addColor(params, 'dir1Color').name('Key Light Color').onChange(v => {

    });

    fColors.addColor(params, 'inboundColor').name('Inbound Raw Data').onChange(updateVisualColors);
    fColors.addColor(params, 'filteredColor').name('Filtration Barrier').onChange(updateVisualColors);
    fColors.addColor(params, 'outboundColor').name('Outbound Pipeline').onChange(updateVisualColors);
    fColors.addColor(params, 'accentColor').name('Accent Highlights').onChange(updateVisualColors);

    // Gateway & Pipeline Controls
    const fGateway = gui.addFolder('Gateway & Pipeline Settings');
    fGateway.add(params, 'coreScale', 0.5, 2.5, 0.05).name('Core Scale').onChange(v => {
      gatewayGroup.scale.set(v, v, v);
    });
    fGateway.add(params, 'ringSpeed', 0.0, 3.0, 0.05).name('Rings Rotation Speed');
    fGateway.add(params, 'ingestionSpeed', 0.0, 3.0, 0.05).name('Ingestion Velocity');
    fGateway.add(params, 'pipelineSpeed', 0.0, 3.0, 0.05).name('Pipeline Velocity');
    fGateway.add(params, 'shieldOpacity', 0.1, 1.0, 0.05).name('Firewall Shield Opacity').onChange(v => {
      FiltrationBarrierShader.uniforms.uOpacity.value = v;

    // Hide/Show UI with 'H' key

      if (e.key === 'h' || e.key === 'H') {
        gui._hidden ? gui.show() : gui.hide();
      }

    // ------------------------------------------------------------------------
    // Animation Loop
    // ------------------------------------------------------------------------
    const clock = new THREE.Clock();
    initRenderer(params.antialias);
    applyColorScheme('Original');
    gatewayGroup.scale.set(params.coreScale, params.coreScale, params.coreScale);

    // Camera animation handling that respects user wheel zoom and drag angle
    function updateCameraAnimation(delta, totalTime) {
      const mode = params.animationMode;
      const speed = params.animSpeed;

      if (mode === 'Static (Manual View)' || speed === 0) {
        controls.autoRotate = false;
        controls.update();
        return;
      }

      if (mode === 'Cinematic Gateway Orbit') {
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.85 * speed;
        controls.target.lerp(new THREE.Vector3(0, 0, 0), 0.03);
      } else if (mode === 'Defensive Perimeter Patrol') {
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.6 * speed;
        controls.target.y += (Math.sin(totalTime * 0.7) * 2.2 - controls.target.y) * 0.03;
      } else if (mode === 'Ingestion Flow Tracking') {
        controls.autoRotate = true;
        controls.autoRotateSpeed = -0.65 * speed;
        controls.target.lerp(new THREE.Vector3(-15, 0, 0), 0.03);
      } else if (mode === 'Outbound Pipeline View') {
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.55 * speed;
        controls.target.lerp(new THREE.Vector3(16, 0, 0), 0.03);
      } else if (mode === 'Zenith Core Surveillance') {
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.75 * speed;
        controls.target.lerp(new THREE.Vector3(0, 0, 0), 0.03);
      } else if (mode === 'Breathing Float Scan') {
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.9 * speed;
        controls.target.x += (Math.sin(totalTime * 0.6) * 5.0 - controls.target.x) * 0.02;
        controls.target.y += (Math.cos(totalTime * 0.5) * 2.5 - controls.target.y) * 0.02;
      } else if (mode === 'Harmonic Spiral Drift') {
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.15 * speed;
        controls.target.x += (Math.sin(totalTime * 0.4) * 8.0 - controls.target.x) * 0.025;
        controls.target.z += (Math.cos(totalTime * 0.4) * 4.0 - controls.target.z) * 0.025;
      }

      controls.update();
    }

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const totalTime = clock.getElapsedTime();
      const s = params.animSpeed;

      // 1. Camera Animation
      updateCameraAnimation(delta, totalTime);

      // 2. Update Shader Uniforms
      CorePlasmaShader.uniforms.uTime.value = totalTime * s;
      FiltrationBarrierShader.uniforms.uTime.value = totalTime * s;
      ConduitFlowShader.uniforms.uTime.value = totalTime * s;

      // 3. Core Gateway Dynamics
      const pulse = 1.0 + Math.sin(totalTime * 4.0 * s) * 0.08;
      innerNucleus.scale.set(pulse, pulse, pulse);
      innerNucleus.rotation.y += 0.02 * s * params.ringSpeed;
      innerNucleus.rotation.x += 0.012 * s * params.ringSpeed;

      plasmaShell.rotation.y -= 0.015 * s * params.ringSpeed;
      plasmaShell.rotation.z += 0.009 * s * params.ringSpeed;

      coreCage.rotation.y += 0.018 * s * params.ringSpeed;
      coreCage.rotation.x -= 0.01 * s * params.ringSpeed;

      hudRing1.rotation.x += 0.025 * s * params.ringSpeed;
      hudRing2.rotation.x -= 0.018 * s * params.ringSpeed;

      apertureRing.rotation.x += 0.022 * s * params.ringSpeed;

      // Core Light Breathing
      corePointLight.intensity = params.coreLightIntensity * (0.85 + Math.sin(totalTime * 4.5 * s) * 0.2);

      // 4. Defensive Orbital Rings Rotation & Sentinels
      ring1.rotation.z += 0.016 * s * params.ringSpeed;
      ring1.rotation.y += 0.011 * s * params.ringSpeed;

      ring2.rotation.z -= 0.022 * s * params.ringSpeed;
      ring2.rotation.x += 0.014 * s * params.ringSpeed;

      ring3.rotation.z += 0.01 * s * params.ringSpeed;
      ring3.rotation.y -= 0.018 * s * params.ringSpeed;

      ring4Points.rotation.z += 0.008 * s * params.ringSpeed;

      // Animate Sentinel Drone Beams
      sentinelDrones.forEach((item) => {
        item.drone.rotation.x += 0.035 * s;
        item.drone.rotation.y += 0.045 * s;
        item.laser.material.opacity = 0.25 + Math.sin(totalTime * 6.0 * s + item.offset) * 0.2;
      });

      // 5. Filtration Sparks Animation (ROUND PARTICLES)
      const sparkPosArray = sparkGeo.attributes.position.array;
      for (let i = 0; i < sparkCount; i++) {
        const vel = sparkVel[i];
        vel.life += 0.022 * s * params.sparkIntensity;
        if (vel.life > 1.0) {
          vel.life = 0.0;
          const a = Math.random() * Math.PI * 2;
          const r = 1.0 + Math.random() * 6.5;
          sparkPosArray[i * 3 + 0] = (Math.random() - 0.5) * 1.8;
          sparkPosArray[i * 3 + 1] = Math.sin(a) * r;
          sparkPosArray[i * 3 + 2] = Math.cos(a) * r;
        } else {
          sparkPosArray[i * 3 + 1] += vel.y * s * params.sparkIntensity;
          sparkPosArray[i * 3 + 2] += vel.z * s * params.sparkIntensity;
        }
      }
      sparkGeo.attributes.position.needsUpdate = true;

      // 6. Inbound Stream Simulation with ROUND Trails
      const trailPosArray = trailGeo.attributes.position.array;

      inboundPackets.forEach((p, pIdx) => {
        p.progress += p.speed * s * params.ingestionSpeed;
        if (p.progress >= 1.0) {
          p.progress = 0.0;
          p.history = [];
        }

        const t = p.progress;
        const currentX = p.startX + (-4.2 - p.startX) * t;

        // Funnel convergence into gateway intake
        const funnel = Math.pow(1.0 - t, 1.85);
        const currentY = p.startY * funnel;
        const currentZ = p.startZ * funnel;

        p.mesh.position.set(currentX, currentY, currentZ);

        // Tumble rotation
        p.mesh.rotation.x += p.rotSpeed.x * s;
        p.mesh.rotation.y += p.rotSpeed.y * s;
        p.mesh.rotation.z += p.rotSpeed.z * s;

        // Filtration threshold reaction: glow burst when crossing barrier
        if (t > 0.88) {
          const flash = (t - 0.88) / 0.12;
          p.mesh.material.emissiveIntensity = 0.7 + flash * 2.5;
        } else {
          p.mesh.material.emissiveIntensity = 0.7;
        }

        // Maintain particle trail history
        p.history.unshift(new THREE.Vector3(currentX, currentY, currentZ));
        if (p.history.length > TRAIL_PER_PACKET) {
          p.history.pop();
        }

        // Fill trail positions
        for (let tr = 0; tr < TRAIL_PER_PACKET; tr++) {
          const trailIdx = (pIdx * TRAIL_PER_PACKET + tr) * 3;
          if (tr < p.history.length) {
            trailPosArray[trailIdx + 0] = p.history[tr].x;
            trailPosArray[trailIdx + 1] = p.history[tr].y;
            trailPosArray[trailIdx + 2] = p.history[tr].z;
          } else {
            trailPosArray[trailIdx + 0] = currentX;
            trailPosArray[trailIdx + 1] = currentY;
            trailPosArray[trailIdx + 2] = currentZ;
          }
        }
      });
      trailGeo.attributes.position.needsUpdate = true;

      // 7. Outbound Pipeline Simulation
      outboundPackets.forEach(p => {
        p.progress += p.speed * s * params.pipelineSpeed;
        if (p.progress >= 1.0) {
          p.progress = 0.0;
        }

        const t = p.progress;
        const currentX = 3.6 + (54.0 - 3.6) * t;
        p.mesh.position.set(currentX, p.trackY, p.trackZ);

        // Synchronized axial spin
        p.mesh.rotation.x = currentX * 0.45;

        // Packet breathing pulse
        const packetPulse = 1.0 + Math.sin(totalTime * 4.5 + currentX * 0.25) * 0.14;
        p.mesh.scale.set(0.65 * packetPulse, 0.65 * packetPulse, 1.45);
      });

      // Pulse Magnetic Accelerator Rings with travelling wave
      accelRings.forEach(item => {
        const wave = Math.sin(totalTime * 4.5 * s - item.baseIdx * 1.05);
        const ringScale = 1.0 + Math.max(0, wave) * 0.14;
        item.assembly.scale.set(ringScale, ringScale, ringScale);
        item.mainRing.rotation.x += 0.02 * s;
      });

      // Render Scene
      renderer.render(scene, camera);
    }

    // ------------------------------------------------------------------------
    // Window Resize Handler
    // ------------------------------------------------------------------------
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
