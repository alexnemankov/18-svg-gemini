    // --- PROCEDURAL FALLBACK GENERATORS (Safety fallback) ---
    function createProceduralEarthTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 2048;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#0a2342';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#2d6a4f';
      const continents = [
        { x: 1050, y: 320, rx: 320, ry: 160 },
        { x: 1350, y: 360, rx: 240, ry: 140 },
        { x: 1020, y: 550, rx: 140, ry: 200 },
        { x: 420, y: 300, rx: 200, ry: 150 },
        { x: 540, y: 640, rx: 110, ry: 220 },
        { x: 1550, y: 680, rx: 110, ry: 90 }
      ];
      continents.forEach(c => {
        ctx.beginPath();
        ctx.ellipse(c.x, c.y, c.rx, c.ry, 0, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, 60);
      ctx.fillRect(0, canvas.height - 75, canvas.width, 75);
      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function createProceduralBumpMap() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#222222';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#888888';
      const continents = [
        { x: 520, y: 160, rx: 160, ry: 80 },
        { x: 675, y: 180, rx: 120, ry: 70 },
        { x: 510, y: 275, rx: 70, ry: 100 },
        { x: 210, y: 150, rx: 100, ry: 75 },
        { x: 270, y: 320, rx: 55, ry: 110 },
        { x: 775, y: 340, rx: 55, ry: 45 }
      ];
      continents.forEach(c => {
        ctx.beginPath();
        ctx.ellipse(c.x, c.y, c.rx, c.ry, 0, 0, Math.PI * 2);
        ctx.fill();
      });
      return new THREE.CanvasTexture(canvas);
    }

    function createProceduralSpecMask() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#eeeeee';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#111111';
      const continents = [
        { x: 520, y: 160, rx: 160, ry: 80 },
        { x: 675, y: 180, rx: 120, ry: 70 },
        { x: 510, y: 275, rx: 70, ry: 100 },
        { x: 210, y: 150, rx: 100, ry: 75 },
        { x: 270, y: 320, rx: 55, ry: 110 },
        { x: 775, y: 340, rx: 55, ry: 45 }
      ];
      continents.forEach(c => {
        ctx.beginPath();
        ctx.ellipse(c.x, c.y, c.rx, c.ry, 0, 0, Math.PI * 2);
        ctx.fill();
      });
      return new THREE.CanvasTexture(canvas);
    }

    // Notice: alphaMap in Three.js reads the GREEN channel! Black (0) = transparent, White (255) = clouds!
    function createProceduralCloudTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < 350; i++) {
        const x = Math.random() * canvas.width;
        const y = (0.2 + Math.random() * 0.6) * canvas.height;
        const rad = 20 + Math.random() * 60;
        const grad = ctx.createRadialGradient(x, y, 0, x, y, rad);
        grad.addColorStop(0.0, 'rgba(255, 255, 255, 0.9)');
        grad.addColorStop(0.5, 'rgba(255, 255, 255, 0.4)');
        grad.addColorStop(1.0, 'rgba(0, 0, 0, 0.0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(x, y, rad, 0, Math.PI * 2);
        ctx.fill();
      }
      return new THREE.CanvasTexture(canvas);
    }

    function createProceduralGlowTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
      grad.addColorStop(0.0, 'rgba(255, 255, 255, 1.0)');
      grad.addColorStop(0.2, 'rgba(0, 180, 255, 0.85)');
      grad.addColorStop(0.5, 'rgba(0, 120, 255, 0.4)');
      grad.addColorStop(0.8, 'rgba(0, 60, 220, 0.12)');
      grad.addColorStop(1.0, 'rgba(0, 0, 0, 0.0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 256, 256);
      return new THREE.CanvasTexture(canvas);
    }

    // --- TIME & ROTATION CALCULATIONS ---
    const degreeOffset = 90;
    function getEarthRotation() {
      const d = new Date();
      const minutes = d.getUTCHours() * 60 + d.getUTCMinutes();
      return (minutes / 3.9907) + degreeOffset;
    }

    let baseUtcDegrees = getEarthRotation();
    setInterval(() => {
      baseUtcDegrees = getEarthRotation();
    }, 60000);

    let earthContinuousAngle = 0;

    // --- THREE.JS SCENE SETUP ---
    const container = document.getElementById('container');
    const scene = new THREE.Scene();

    // Camera setup
    const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      1,
      30000
    );
    camera.position.set(0, 0, earthRadius * 4.0);

    // Renderer setup
    let renderer = new THREE.WebGLRenderer({
      antialias: params.antialias,
      powerPreference: 'high-performance',
      alpha: true
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(params.pixelRatio);
    renderer.toneMapping = THREE.LinearToneMapping;
    renderer.toneMappingExposure = params.toneMappingExposure;
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    // OrbitControls setup
    let controls = new OrbitControls(camera, renderer.domElement);
    function setupControls(ctrl) {
      ctrl.enableDamping = true;
      ctrl.dampingFactor = 0.08;
      ctrl.enableZoom = true;
      ctrl.zoomSpeed = 1.2;
      ctrl.enablePan = true;
      ctrl.panSpeed = 1.0;
      ctrl.screenSpacePanning = true;
      ctrl.minDistance = earthRadius * 1.15;
      ctrl.maxDistance = earthRadius * 14.0;
      ctrl.target.set(0, 0, 0);
      updateControlsMouseButtons(ctrl);
    }

    function updateControlsMouseButtons(ctrl) {
      if (params.mouseDragAction === 'Pan (Left Drag)') {
        ctrl.mouseButtons = {
          LEFT: THREE.MOUSE.PAN,
          MIDDLE: THREE.MOUSE.DOLLY,
          RIGHT: THREE.MOUSE.ROTATE
        };
      } else {
        ctrl.mouseButtons = {
          LEFT: THREE.MOUSE.ROTATE,
          MIDDLE: THREE.MOUSE.DOLLY,
          RIGHT: THREE.MOUSE.PAN
        };
      }
    }

    setupControls(controls);

    // --- SCENE HIERARCHY ---
    const worldRotationPoint = new THREE.Object3D();
    worldRotationPoint.position.set(0, 0, 0);
    scene.add(worldRotationPoint);

    // --- TEXTURE LOADER WITH CROSSORIGIN ---
    const loader = new THREE.TextureLoader();
    loader.setCrossOrigin('anonymous');

    // 1. Earth Textures & Material
    const earthTexture = loader.load(
      TEXTURE_PATH + 'ColorMap.jpg',
      (tex) => { tex.colorSpace = THREE.SRGBColorSpace; },
      undefined,
      () => { earthMaterial.map = createProceduralEarthTexture(); earthMaterial.needsUpdate = true; }
    );
    earthTexture.colorSpace = THREE.SRGBColorSpace;

    const bumpTexture = loader.load(
      TEXTURE_PATH + 'Bump.jpg',
      undefined,
      undefined,
      () => { earthMaterial.bumpMap = createProceduralBumpMap(); earthMaterial.needsUpdate = true; }
    );

    const specTexture = loader.load(
      TEXTURE_PATH + 'SpecMask.jpg',
      undefined,
      undefined,
      () => { earthMaterial.specularMap = createProceduralSpecMask(); earthMaterial.needsUpdate = true; }
    );

    const earthGeometry = new THREE.SphereGeometry(earthRadius, 128, 128);
    const earthMaterial = new THREE.MeshPhongMaterial({
      color: params.earthColor,
      shininess: params.earthShininess,
      map: earthTexture,
      specularMap: specTexture,
      specular: params.earthSpecColor,
      bumpMap: bumpTexture,
      bumpScale: params.earthBumpScale
    });

    const sphere = new THREE.Mesh(earthGeometry, earthMaterial);
    sphere.position.set(0, 0, 0);
    sphere.rotation.y = -1 * (8.7 * Math.PI / 17);
    worldRotationPoint.add(sphere);

    // 2. Earth Clouds Sphere
    const cloudGeometry = new THREE.SphereGeometry(earthRadius + params.cloudAltitude, 128, 128);
    const cloudAlpha = loader.load(
      TEXTURE_PATH + 'alphaMap.jpg',
      undefined,
      undefined,
      () => { cloudMaterial.alphaMap = createProceduralCloudTexture(); cloudMaterial.needsUpdate = true; }
    );

    const cloudMaterial = new THREE.MeshPhongMaterial({
      color: params.cloudColor,
      alphaMap: cloudAlpha,
      transparent: true,
      opacity: params.cloudOpacity,
      depthWrite: false
    });

    const sphereCloud = new THREE.Mesh(cloudGeometry, cloudMaterial);
    scene.add(sphereCloud);

    // 3. Atmosphere Glow Sprite
    const glowMap = loader.load(
      TEXTURE_PATH + 'glow.png',
      undefined,
      undefined,
      () => { spriteMaterial.map = createProceduralGlowTexture(); spriteMaterial.needsUpdate = true; }
    );

    const spriteMaterial = new THREE.SpriteMaterial({
      map: glowMap,
      color: params.glowColor,
      transparent: true,
      opacity: params.glowOpacity,
      blending: THREE.AdditiveBlending
    });
    const glowSprite = new THREE.Sprite(spriteMaterial);
    glowSprite.scale.set(earthRadius * params.glowScale, earthRadius * params.glowScale, 1.0);
    sphereCloud.add(glowSprite);

    // 4. Distant Sun Mesh
    const sunGeometry = new THREE.SphereGeometry(100, 24, 24);
    const sunMaterial = new THREE.MeshLambertMaterial({
      color: params.sunColor,
      emissive: params.sunColor,
      emissiveIntensity: params.sunEmissiveIntensity
    });
    const sunMesh = new THREE.Mesh(sunGeometry, sunMaterial);
    sunMesh.position.set(-9500, 0, 0);
    sunMesh.rotation.y = Math.PI;
    scene.add(sunMesh);

    // 5. Skybox Cube Texture (Original CodePen Background)
    const cubeLoader = new THREE.CubeTextureLoader();
    cubeLoader.setCrossOrigin('anonymous');
    const cubeUrls = [
      TEXTURE_PATH + 'test.jpg',
      TEXTURE_PATH + 'test.jpg',
      TEXTURE_PATH + 'test.jpg',
      TEXTURE_PATH + 'test.jpg',
      TEXTURE_PATH + 'test.jpg',
      TEXTURE_PATH + 'test.jpg',
    ];

    let textureCube = cubeLoader.load(cubeUrls, (tex) => {
      if (!params.greenScreen && params.showSkybox) {
        scene.background = tex;
      }
    });
    scene.background = textureCube;

    // --- LIGHTING SETUP (Calibrated with decay=0 for true legacy illumination) ---
    // Ambient light
    const ambientLight = new THREE.AmbientLight(params.ambientColor, params.ambientIntensity);
    scene.add(ambientLight);

    // Primary Sun Directional Light (Infinite parallel rays across daylight hemisphere)
    const sunDirLight = new THREE.DirectionalLight(params.sunLightColor, params.sunDirIntensity);
    sunDirLight.position.set(-400, 0, 100);
    scene.add(sunDirLight);

    // Sun PointLight (decay=0 ensures no inverse-square blackout across 400 units)
    const sunPointLight = new THREE.PointLight(params.sunLightColor, params.sunPointIntensity, params.sunLightDistance, 0);
    sunPointLight.position.set(-400, 0, 100);
    scene.add(sunPointLight);

    // Four fillers with decay=0 matching the original CodePen layout
    const filler2 = new THREE.PointLight(params.fillerColor, params.filler1Intensity * params.fillersMasterIntensity, 4000, 0);
    filler2.position.set(-400, 0, 250);
    scene.add(filler2);

    const filler3 = new THREE.PointLight(params.fillerColor, params.filler2Intensity * params.fillersMasterIntensity, 4000, 0);
    filler3.position.set(-400, 0, -150);
    scene.add(filler3);

    const filler4 = new THREE.PointLight(params.fillerColor, params.filler3Intensity * params.fillersMasterIntensity, 4000, 0);
    filler4.position.set(-400, 150, 100);
    scene.add(filler4);

    const filler5 = new THREE.PointLight(params.fillerColor, params.filler4Intensity * params.fillersMasterIntensity, 4000, 0);
    filler5.position.set(-400, -150, 100);
    scene.add(filler5);

    function updateFillerIntensities() {
      filler2.intensity = params.filler1Intensity * params.fillersMasterIntensity;
      filler3.intensity = params.filler2Intensity * params.fillersMasterIntensity;
      filler4.intensity = params.filler3Intensity * params.fillersMasterIntensity;
      filler5.intensity = params.filler4Intensity * params.fillersMasterIntensity;
    }

    // --- APPLY COLOR SCHEME ---
    function applyColorScheme(themeName) {
      params.theme = themeName;
      const t = PALETTES[themeName];
      if (!t) return;

      params.bgColor = t.bg;
      params.earthColor = t.earth;
      params.earthSpecColor = t.earthSpec;
      params.cloudColor = t.cloud;
      params.glowColor = t.glow;
      params.sunColor = t.sun;
      params.sunLightColor = t.sunLight;
      params.ambientColor = t.ambient;
      params.fillerColor = t.filler;

      if (!params.greenScreen) {
        if (params.showSkybox && textureCube) {
          scene.background = textureCube;
        } else {
          scene.background = new THREE.Color(params.bgColor);
        }
        renderer.setClearColor(params.bgColor, 1);
      } else {
        scene.background = new THREE.Color('#00ff00');
        renderer.setClearColor('#00ff00', 1);
      }

      earthMaterial.color.set(params.earthColor);
      earthMaterial.specular.set(params.earthSpecColor);
      cloudMaterial.color.set(params.cloudColor);
      spriteMaterial.color.set(params.glowColor);
      sunMaterial.color.set(params.sunColor);
      sunMaterial.emissive.set(params.sunColor);

      sunDirLight.color.set(params.sunLightColor);
      sunPointLight.color.set(params.sunLightColor);
      ambientLight.color.set(params.ambientColor);

      filler2.color.set(params.fillerColor);
      filler3.color.set(params.fillerColor);
      filler4.color.set(params.fillerColor);
      filler5.color.set(params.fillerColor);

      gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    // --- GREENSCREEN TOGGLE ---
    function setGreenScreen(enabled) {
      params.greenScreen = enabled;
      if (enabled) {
        scene.background = new THREE.Color('#00ff00');
        renderer.setClearColor('#00ff00', 1);
      } else {
        if (params.showSkybox && textureCube) {
          scene.background = textureCube;
        } else {
          scene.background = new THREE.Color(params.bgColor);
        }
        renderer.setClearColor(params.bgColor, 1);
      }
      gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    // --- RECREATE RENDERER (Antialias Setting) ---
    function updateAntialias(val) {
      params.antialias = val;
      const oldCanvas = renderer.domElement;
      renderer.dispose();
      if (oldCanvas && oldCanvas.parentNode) {
        oldCanvas.parentNode.removeChild(oldCanvas);
      }

      renderer = new THREE.WebGLRenderer({
        antialias: params.antialias,
        powerPreference: 'high-performance',
        alpha: true
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(params.pixelRatio);
      renderer.toneMapping = THREE[params.toneMapping + 'ToneMapping'] || THREE.LinearToneMapping;
      renderer.toneMappingExposure = params.toneMappingExposure;
      renderer.shadowMap.enabled = true;
      container.appendChild(renderer.domElement);

      controls.dispose();
      controls = new OrbitControls(camera, renderer.domElement);
      setupControls(controls);

      if (params.greenScreen) {
        scene.background = new THREE.Color('#00ff00');
        renderer.setClearColor('#00ff00', 1);
      } else {
        if (params.showSkybox && textureCube) {
          scene.background = textureCube;
        } else {
          scene.background = new THREE.Color(params.bgColor);
        }
        renderer.setClearColor(params.bgColor, 1);
      }
    }

    // --- PROCEDURAL RE-ROLL (Upon User Click) ---
    function randomizeScene() {
      const keys = Object.keys(PALETTES);
      const randomKey = keys[Math.floor(Math.random() * keys.length)];
      applyColorScheme(randomKey);

      params.earthShininess = Math.floor(4 + Math.random() * 40);
      earthMaterial.shininess = params.earthShininess;

      params.earthBumpScale = Number((0.5 + Math.random() * 1.5).toFixed(2));
      earthMaterial.bumpScale = params.earthBumpScale;

      params.cloudAltitude = Number((0.15 + Math.random() * 0.4).toFixed(2));
      sphereCloud.geometry.dispose();
      sphereCloud.geometry = new THREE.SphereGeometry(earthRadius + params.cloudAltitude, 128, 128);

      params.cloudOpacity = Number((0.7 + Math.random() * 0.3).toFixed(2));
      cloudMaterial.opacity = params.cloudOpacity;

      params.glowScale = Number((2.1 + Math.random() * 1.0).toFixed(2));
      glowSprite.scale.set(earthRadius * params.glowScale, earthRadius * params.glowScale, 1.0);

      params.animSpeed = Number((0.7 + Math.random() * 0.9).toFixed(2));
      params.earthRotationSpeed = Number((0.6 + Math.random() * 1.2).toFixed(2));
      params.cloudSpeed = Number((0.6 + Math.random() * 1.4).toFixed(2));

      params.toneMappingExposure = Number((0.85 + Math.random() * 0.45).toFixed(2));
      renderer.toneMappingExposure = params.toneMappingExposure;

      params.ambientIntensity = Number((0.5 + Math.random() * 0.5).toFixed(2));
      ambientLight.intensity = params.ambientIntensity;

      params.sunDirIntensity = Number((1.6 + Math.random() * 1.2).toFixed(2));
      sunDirLight.intensity = params.sunDirIntensity;

      params.fillersMasterIntensity = Number((0.4 + Math.random() * 0.4).toFixed(2));
      updateFillerIntensities();

      gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    // Distinguish quick click from drag
    let pointerDownPos = { x: 0, y: 0 };
    let pointerDownTime = 0;

    window.addEventListener('pointerdown', (e) => {
      pointerDownPos.x = e.clientX;
      pointerDownPos.y = e.clientY;
      pointerDownTime = performance.now();
    });

    window.addEventListener('pointerup', (e) => {
      if (e.target.closest('.lil-gui')) return;
      const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
      const duration = performance.now() - pointerDownTime;
      if (dist < 6 && duration < 350 && params.clickToRandomize) {
        randomizeScene();
      }
    });

    // --- LIL-GUI SETUP ---
    const gui = new GUI({ title: 'Earth 3D & Atmosphere Space Visualizer' });

    // 1. Color & Theme
    const fColor = gui.addFolder('🎨 Color & Theme');
    fColor.add(params, 'theme', Object.keys(PALETTES)).name('Color Scheme').onChange(applyColorScheme);
    fColor.add(params, 'greenScreen').name('Green Screen (#00ff00)').onChange(setGreenScreen);
    fColor.addColor(params, 'bgColor').name('Background Color').onChange(c => {
      if (!params.greenScreen && !params.showSkybox) {
        scene.background = new THREE.Color(c);
        renderer.setClearColor(c, 1);
      }
    });
    fColor.addColor(params, 'earthColor').name('Earth Tint').onChange(c => earthMaterial.color.set(c));
    fColor.addColor(params, 'earthSpecColor').name('Ocean Specular').onChange(c => earthMaterial.specular.set(c));
    fColor.addColor(params, 'cloudColor').name('Cloud Color').onChange(c => cloudMaterial.color.set(c));
    fColor.addColor(params, 'glowColor').name('Atmosphere Halo').onChange(c => spriteMaterial.color.set(c));
    fColor.addColor(params, 'sunColor').name('Sun Mesh Color').onChange(c => {
      sunMaterial.color.set(c);
      sunMaterial.emissive.set(c);
    });
    fColor.addColor(params, 'sunLightColor').name('Sun Light Color').onChange(c => {
      sunDirLight.color.set(c);
      sunPointLight.color.set(c);
    });
    fColor.addColor(params, 'ambientColor').name('Ambient Color').onChange(c => ambientLight.color.set(c));
    fColor.addColor(params, 'fillerColor').name('Filler Lights Color').onChange(c => {
      filler2.color.set(c);
      filler3.color.set(c);
      filler4.color.set(c);
      filler5.color.set(c);
    });

    // 2. Camera & Motion
    const fCamera = gui.addFolder('🎬 Camera & Motion');
    fCamera.add(params, 'animationMode', ANIMATION_OPTIONS).name('Camera Animation');
    fCamera.add(params, 'animSpeed', 0.0, 3.0, 0.05).name('Animation Speed');
    fCamera.add(params, 'autoOrbitSpeed', 0.0, 3.0, 0.05).name('Camera Drift Speed');
    fCamera.add(params, 'earthRotationSpeed', 0.0, 4.0, 0.1).name('Earth Spin Speed');
    fCamera.add(params, 'cloudSpeed', 0.0, 4.0, 0.1).name('Cloud Drift Speed');
    fCamera.add(params, 'mouseDragAction', ['Rotate (Left Drag)', 'Pan (Left Drag)']).name('Left Button Action').onChange(() => {
      updateControlsMouseButtons(controls);
    });
    fCamera.add({ resetCamera: () => {
      camera.position.set(0, 0, earthRadius * 4.0);
      controls.target.set(0, 0, 0);
      controls.update();
    }}, 'resetCamera').name('Reset Camera View');

    // 3. Lighting & Exposure
    const fLight = gui.addFolder('💡 Lighting & Exposure');
    fLight.add(params, 'toneMappingExposure', 0.2, 3.0, 0.05).name('Scene Exposure').onChange(v => {
      renderer.toneMappingExposure = v;
    });
    fLight.add(params, 'toneMapping', ['Linear', 'ACESFilmic', 'Reinhard', 'Cineon']).name('Tone Mapping').onChange(v => {
      renderer.toneMapping = THREE[v + 'ToneMapping'] || THREE.LinearToneMapping;
    });
    fLight.add(params, 'ambientIntensity', 0.0, 3.0, 0.05).name('Ambient Light').onChange(v => ambientLight.intensity = v);
    fLight.add(params, 'sunDirIntensity', 0.0, 6.0, 0.1).name('Sun Directional Light').onChange(v => sunDirLight.intensity = v);
    fLight.add(params, 'sunPointIntensity', 0.0, 5.0, 0.1).name('Sun Point Light').onChange(v => sunPointLight.intensity = v);
    fLight.add(params, 'sunLightDistance', 1000, 15000, 500).name('Sun Light Range').onChange(v => sunPointLight.distance = v);
    fLight.add(params, 'fillersMasterIntensity', 0.0, 3.0, 0.05).name('All Fillers Master').onChange(updateFillerIntensities);
    fLight.add(params, 'filler1Intensity', 0.0, 2.0, 0.05).name('Filler 1 (+Z)').onChange(updateFillerIntensities);
    fLight.add(params, 'filler2Intensity', 0.0, 2.0, 0.05).name('Filler 2 (-Z)').onChange(updateFillerIntensities);
    fLight.add(params, 'filler3Intensity', 0.0, 2.0, 0.05).name('Filler 3 (+Y)').onChange(updateFillerIntensities);
    fLight.add(params, 'filler4Intensity', 0.0, 2.0, 0.05).name('Filler 4 (-Y)').onChange(updateFillerIntensities);
    fLight.add(params, 'sunEmissiveIntensity', 0.0, 3.0, 0.1).name('Sun Orb Emissive').onChange(v => sunMaterial.emissiveIntensity = v);

    // 4. Atmosphere & Globe
    const fGlobe = gui.addFolder('🌍 Atmosphere & Globe');
    fGlobe.add(params, 'earthShininess', 1, 100, 1).name('Earth Shininess').onChange(v => earthMaterial.shininess = v);
    fGlobe.add(params, 'earthBumpScale', 0.0, 3.0, 0.05).name('Earth Bump Relief').onChange(v => earthMaterial.bumpScale = v);
    fGlobe.add(params, 'cloudAltitude', 0.05, 1.5, 0.05).name('Cloud Altitude').onChange(v => {
      sphereCloud.geometry.dispose();
      sphereCloud.geometry = new THREE.SphereGeometry(earthRadius + v, 128, 128);
    });
    fGlobe.add(params, 'cloudOpacity', 0.0, 1.0, 0.05).name('Cloud Opacity').onChange(v => cloudMaterial.opacity = v);
    fGlobe.add(params, 'glowScale', 1.5, 4.5, 0.1).name('Atmosphere Halo Size').onChange(v => {
      glowSprite.scale.set(earthRadius * v, earthRadius * v, 1.0);
    });
    fGlobe.add(params, 'glowOpacity', 0.1, 1.0, 0.05).name('Atmosphere Opacity').onChange(v => spriteMaterial.opacity = v);
    fGlobe.add(params, 'showSkybox').name('Starfield Skybox').onChange(v => {
      if (!params.greenScreen) {
        scene.background = v && textureCube ? textureCube : new THREE.Color(params.bgColor);
      }
    });

    // 5. Quality & Display Settings
    const fQuality = gui.addFolder('⚙️ Quality & Graphics');
    fQuality.add(params, 'pixelRatio', 0.5, 3.0, 0.25).name('Pixel Ratio (DPR)').onChange(v => renderer.setPixelRatio(v));
    fQuality.add(params, 'antialias').name('Antialiasing').onChange(updateAntialias);

    // 6. Procedural Variation on Click
    const fRandom = gui.addFolder('🎲 Procedural Variation');
    fRandom.add(params, 'clickToRandomize').name('Click Scene: Re-roll');
    fRandom.add({ triggerRandom: randomizeScene }, 'triggerRandom').name('Randomize Now');

    // Hide/Show GUI with 'H' Key
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        gui._hidden ? gui.show() : gui.hide();
      }
    });

    // Window Resize Handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- CAMERA MOTION CONTROLLER ---
    let animClock = 0;

    function updateCamera(delta) {
      if (params.animationMode === 'Static View (No Movement)') {
        return;
      }

      const speedFactor = params.animSpeed * params.autoOrbitSpeed;
      const dt = delta * speedFactor;
      animClock += dt;

      // Extract current offset and distance relative to target
      const offset = camera.position.clone().sub(controls.target);
      const currentDist = offset.length();
      if (currentDist < 0.1) return;

      const up = new THREE.Vector3(0, 1, 0);

      if (params.animationMode === 'Slow Equatorial Orbit') {
        offset.applyAxisAngle(up, dt * 0.12);
      }
      else if (params.animationMode === 'Polar Inclination Flyby') {
        offset.applyAxisAngle(up, dt * 0.09);
        const right = new THREE.Vector3().crossVectors(up, offset).normalize();
        if (right.lengthSq() > 0.001) {
          offset.applyAxisAngle(right, Math.sin(animClock * 0.22) * 0.0015);
        }
      }
      else if (params.animationMode === 'Gentle Atmospheric Drift') {
        const yawDelta = Math.sin(animClock * 0.28) * 0.0012;
        const right = new THREE.Vector3().crossVectors(up, offset).normalize();
        const pitchDelta = Math.cos(animClock * 0.21) * 0.0009;
        offset.applyAxisAngle(up, yawDelta);
        if (right.lengthSq() > 0.001) {
          offset.applyAxisAngle(right, pitchDelta);
        }
      }
      else if (params.animationMode === 'Cinematic Terminator Sweep') {
        offset.applyAxisAngle(up, Math.sin(animClock * 0.18) * 0.0016);
        const right = new THREE.Vector3().crossVectors(up, offset).normalize();
        if (right.lengthSq() > 0.001) {
          offset.applyAxisAngle(right, Math.cos(animClock * 0.14) * 0.0008);
        }
      }
      else if (params.animationMode === 'Deep Space Heliocentric Glide') {
        offset.applyAxisAngle(up, -dt * 0.08);
      }
      else if (params.animationMode === 'Subtle Figure-8 Cruise') {
        const figYaw = Math.sin(animClock * 0.24) * 0.0022;
        const right = new THREE.Vector3().crossVectors(up, offset).normalize();
        const figPitch = Math.cos(animClock * 0.48) * 0.0014;
        offset.applyAxisAngle(up, figYaw);
        if (right.lengthSq() > 0.001) {
          offset.applyAxisAngle(right, figPitch);
        }
      }
      else if (params.animationMode === 'Golden Hour Horizon Gaze') {
        offset.applyAxisAngle(up, dt * 0.06);
        const right = new THREE.Vector3().crossVectors(up, offset).normalize();
        if (right.lengthSq() > 0.001) {
          offset.applyAxisAngle(right, Math.sin(animClock * 0.35) * 0.0007);
        }
      }

      // Preserve wheel zoom distance & position relative to target
      offset.normalize().multiplyScalar(currentDist);
      camera.position.copy(controls.target).add(offset);
    }

    // --- MAIN ANIMATION LOOP ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const effectiveDt = delta * params.animSpeed;

      // 1. Update Celestial Spin & Clouds
      earthContinuousAngle += (0.0003 * params.earthRotationSpeed * effectiveDt * 60);
      worldRotationPoint.rotation.y = (baseUtcDegrees * Math.PI / 180) + earthContinuousAngle;
      sphereCloud.rotation.y += (0.00045 * params.cloudSpeed * effectiveDt * 60);

      // 2. Update Camera Animation & Controls
      updateCamera(delta);
      controls.update();

      // 3. Render
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
