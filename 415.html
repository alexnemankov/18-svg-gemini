      clickAction: "GSAP Reveal (Forward / Back)", // 'GSAP Reveal (Forward / Back)' | 'Randomize Scene' | 'None'
      toggleReveal: () => toggleGSAPReveal(),
      randomizeNow: () => triggerRandomize(),
      flipTrend: () => {
        params.trendType = (params.trendType === "Bullish (Growth)") ? "Bearish (Crash / Downtrend)" : "Bullish (Growth)";
        generateTrendData();
        updateSceneColors();
        if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
      }
    };

    // =========================================================================
    // THREE.JS SCENE SETUP
    // =========================================================================
    const container = document.getElementById('canvas-container');
    let scene, camera, renderer, controls, postProcessor;
    let mainGroup = new THREE.Group();
    let chartGroup = new THREE.Group();
    let gridGroup = new THREE.Group();
    let particlesGroup = new THREE.Group();
    let lightsGroup = new THREE.Group();

    // Lighting References
    let ambientLight, dirLight, fillLight, peakPointLight, floorPointLight;

    // Graph Elements References
    let barsData = []; // { mesh, wireMesh, baseHeight, targetHeight, x, z, phase }
    let trendCurveMesh, trendGlowMesh, trendHeadMarker;
    let peakMarkers = [];
    let gridHelper, floorMesh, wallGrid;
    let particlePoints, particlePositions, particleVelocities;
    let fullRawPoints = [];

    // GSAP Reveal Animation State
    const revealState = { progress: 1.0 };
    let isRevealed = true;
    let isGSAPAnimating = false;

    const clock = new THREE.Clock();
    let cameraAngle = 0;
    let baseCameraPos = new THREE.Vector3(30, 22, 36);
    let lookTarget = new THREE.Vector3(0, 8, 0);

    function initRenderer() {
      if (renderer) {
        controls.dispose();
        renderer.dispose();
        if (renderer.domElement && renderer.domElement.parentNode) {
          renderer.domElement.parentNode.removeChild(renderer.domElement);
        }
      }

      renderer = new THREE.WebGLRenderer({
        antialias: params.antialias,
        powerPreference: "high-performance"
      });
      renderer.setPixelRatio(params.dpr);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      container.appendChild(renderer.domElement);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.enableZoom = true;
      controls.enablePan = true;
      controls.screenSpacePanning = true;
      controls.target.copy(lookTarget);
      controls.minDistance = 6;
      controls.maxDistance = 180;

      // Initialize PostProcessor Suite
      postProcessor = new PostProcessor(renderer, {
        enabled: true,
        antialias: params.antialias,
        bloomEnabled: true,
        bloomStrength: 1.15,
        bloomRadius: 0.55,
        bloomThreshold: 0.18,
        raysEnabled: false,
        // ANAMORPHIC DEFAULT IS EXPLICITLY OFF
        anamorphicEnabled: false,
        exposure: 1.15
      });
      postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);
    }

    function initScene() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.5, 500);
      camera.position.copy(baseCameraPos);

      mainGroup.add(chartGroup);
      mainGroup.add(gridGroup);
      mainGroup.add(particlesGroup);
      scene.add(mainGroup);
      scene.add(lightsGroup);

      initLights();
      initRenderer();
      applyColorScheme(params.colorScheme);
      buildCoordinateGrid();
      generateTrendData();
      buildParticles();
    }

    // --- LIGHTING SETUP ---
    function initLights() {
      while (lightsGroup.children.length > 0) {
        lightsGroup.remove(lightsGroup.children[0]);
      }

      ambientLight = new THREE.AmbientLight(params.ambientColor, params.ambientIntensity);
      lightsGroup.add(ambientLight);

      dirLight = new THREE.DirectionalLight(params.dirLightColor, params.dirLightIntensity);
      dirLight.position.set(35, 50, 30);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 2048;
      dirLight.shadow.mapSize.height = 2048;
      dirLight.shadow.bias = -0.0005;
      lightsGroup.add(dirLight);

      fillLight = new THREE.DirectionalLight(params.fillLightColor, params.fillLightIntensity);
      fillLight.position.set(-30, 25, -25);
      lightsGroup.add(fillLight);

      peakPointLight = new THREE.PointLight(params.peakLightColor, params.peakLightIntensity, 50, 1.2);
      peakPointLight.position.set(12, 18, 0);
      lightsGroup.add(peakPointLight);

      floorPointLight = new THREE.PointLight(params.floorLightColor, params.floorLightIntensity, 40, 1.4);
      floorPointLight.position.set(-10, 4, 6);
      lightsGroup.add(floorPointLight);
    }

    function updateLightsFromParams() {
      if (ambientLight) {
        ambientLight.intensity = params.ambientIntensity;
        ambientLight.color.set(params.ambientColor);
      }
      if (dirLight) {
        dirLight.intensity = params.dirLightIntensity;
        dirLight.color.set(params.dirLightColor);
      }
      if (fillLight) {
        fillLight.intensity = params.fillLightIntensity;
        fillLight.color.set(params.fillLightColor);
      }
      if (peakPointLight) {
        peakPointLight.intensity = params.peakLightIntensity;
        peakPointLight.color.set(params.peakLightColor);
      }
      if (floorPointLight) {
        floorPointLight.intensity = params.floorLightIntensity;
        floorPointLight.color.set(params.floorLightColor);
      }
    }

    // --- GRID AND FLOOR ENVIRONMENT ---
    function buildCoordinateGrid() {
      while (gridGroup.children.length > 0) {
        const obj = gridGroup.children[0];
        if (obj.geometry) obj.geometry.dispose();
        if (obj.material) {
          if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
          else obj.material.dispose();
        }
        gridGroup.remove(obj);
      }

      const gridExtent = Math.max(params.graphWidth, params.graphDepth) * 1.8;
      const divisions = 36;

      // 1. Isometric Financial Floor Grid (Thin, elegant neon lines)
      gridHelper = new THREE.GridHelper(
        gridExtent,
        divisions,
        new THREE.Color(params.lineColor),
        new THREE.Color(params.gridColor)
      );
      gridHelper.position.y = 0.01;
      gridHelper.visible = params.showGrid;
      gridGroup.add(gridHelper);

      // 2. Base Reflective Plane (Controlled by params.showPlane - disabled by default to avoid clipping planes)
      const floorGeo = new THREE.PlaneGeometry(gridExtent * 1.4, gridExtent * 1.4);
      const floorMat = new THREE.MeshStandardMaterial({
        color: new THREE.Color(params.floorColor),
        roughness: 0.4,
        metalness: 0.5,
        transparent: true,
        opacity: 0.65
      });
      floorMesh = new THREE.Mesh(floorGeo, floorMat);
      floorMesh.rotation.x = -Math.PI / 2;
      floorMesh.position.y = -0.02;
      floorMesh.receiveShadow = true;
      floorMesh.visible = params.showPlane && !params.greenScreen;
      gridGroup.add(floorMesh);

      // 3. Vertical Backdrop coordinate grid
      wallGrid = new THREE.GridHelper(
        gridExtent,
        divisions,
        new THREE.Color(params.gridColor),
        new THREE.Color(params.floorColor)
      );
      wallGrid.position.set(0, gridExtent / 2, -params.graphDepth * 0.85);
      wallGrid.rotation.x = Math.PI / 2;
      wallGrid.material.opacity = 0.2;
      wallGrid.material.transparent = true;
      wallGrid.visible = params.showWallGrid && !params.greenScreen;
      gridGroup.add(wallGrid);
    }

    // =========================================================================
    // BULLISH (UP) & BEARISH (DOWN) TREND DATA GENERATOR
    // =========================================================================
    function generateTrendData() {
      // Clear previous graph objects
      while (chartGroup.children.length > 0) {
        const child = chartGroup.children[0];
        disposeHierarchy(child);
        chartGroup.remove(child);
      }
      barsData = [];
      peakMarkers = [];
      fullRawPoints = [];

      const count = params.barCount;
      const width = params.graphWidth;
      const startX = -width / 2;
      const stepX = width / (count - 1);
      const depth = params.graphDepth * 0.45;
      const isBearish = params.trendType.includes("Bearish");

      const barHeights = [];

      for (let i = 0; i < count; i++) {
        const progress = i / (count - 1); // 0 to 1
        let height;

        if (!isBearish) {
          // --- BULLISH (Ascending Growth) ---
          // Base accumulation -> dips -> massive breakout to All-Time High
          const macroGrowth = Math.pow(progress, 1.32) * params.trendHeight;
          const wave1 = Math.sin(progress * Math.PI * 4.2) * (1.6 * params.trendVolatility);
          const wave2 = Math.cos(progress * Math.PI * 8.4) * (0.8 * params.trendVolatility);
          const pullback = (progress > 0.42 && progress < 0.58) ? -1.9 * params.trendVolatility : 0;
          height = 2.4 + macroGrowth + wave1 + wave2 + pullback;
        } else {
          // --- BEARISH (Descending Crash & Capitulation) ---
          // Starts high at distribution peak -> panic sell-offs -> dead-cat bounces -> final bottom
          const invertedProgress = 1.0 - progress;
          const macroFall = Math.pow(invertedProgress, 1.28) * params.trendHeight;
          const wave1 = Math.sin(progress * Math.PI * 4.5) * (1.8 * params.trendVolatility);
          const wave2 = Math.cos(progress * Math.PI * 9.0) * (0.9 * params.trendVolatility);
          // Dead-cat bounce around 40-55% of the crash
          const deadCatBounce = (progress > 0.38 && progress < 0.54) ? 2.2 * params.trendVolatility : 0;
          height = 2.0 + macroFall + wave1 + wave2 + deadCatBounce;
        }

        if (height < 1.2) height = 1.2;
        barHeights.push(height);

        const px = startX + i * stepX;
        const pz = Math.sin(progress * Math.PI) * (depth * 0.4);
        fullRawPoints.push(new THREE.Vector3(px, height, pz));
      }

      // Detect peaks & significant market turning points
      const peaks = [];
      const maxOverallHeight = Math.max(...barHeights);
      const minOverallHeight = Math.min(...barHeights);

      for (let i = 1; i < count - 1; i++) {
        const h = barHeights[i];
        if (!isBearish) {
          if (h > barHeights[i - 1] && h > barHeights[i + 1] && h >= maxOverallHeight * params.peakThreshold) {
            peaks.push({ index: i, point: fullRawPoints[i], height: h, isATH: (h === maxOverallHeight) });
          }
        } else {
          // In bearish mode, mark major local highs and capitulation bottom
          if (h > barHeights[i - 1] && h > barHeights[i + 1] && h >= maxOverallHeight * 0.6) {
            peaks.push({ index: i, point: fullRawPoints[i], height: h, isATH: (h === maxOverallHeight) });
          }
        }
      }

      // Always include key culminating points
      if (!isBearish && barHeights[count - 1] >= maxOverallHeight * 0.95) {
        peaks.push({ index: count - 1, point: fullRawPoints[count - 1], height: barHeights[count - 1], isATH: true });
      } else if (isBearish) {
        peaks.push({ index: 0, point: fullRawPoints[0], height: barHeights[0], isATH: true });
        // Mark the crash capitulation bottom
        const minIdx = barHeights.indexOf(minOverallHeight);
        peaks.push({ index: minIdx, point: fullRawPoints[minIdx], height: minOverallHeight, isBottom: true });
      }

      // 1. Build Translucent 3D Glowing Histogram Bars
      const barBaseWidth = stepX * params.barWidthRatio;
      const barDepth = depth * 0.75;

      const barMaterial = new THREE.MeshPhysicalMaterial({
        color: new THREE.Color(params.barColor),
        emissive: new THREE.Color(params.barColor),
        emissiveIntensity: params.barEmissiveIntensity,
        roughness: params.barRoughness,
        metalness: 0.1,
        transmission: params.barTransmission,
        opacity: params.barOpacity,
        transparent: true,
        ior: 1.45,
        clearcoat: 0.8,
        clearcoatRoughness: 0.1
      });

      const wireMaterial = new THREE.LineBasicMaterial({
        color: new THREE.Color(params.barAccentColor),
        transparent: true,
        opacity: 0.85
      });

      const barUnitGeo = new THREE.BoxGeometry(barBaseWidth, 1, barDepth);
      const edgesGeo = new THREE.EdgesGeometry(barUnitGeo);

      for (let i = 0; i < count; i++) {
        const pt = fullRawPoints[i];
        const h = pt.y;

        const barMesh = new THREE.Mesh(barUnitGeo, barMaterial.clone());
        barMesh.castShadow = true;
        barMesh.receiveShadow = true;
        barMesh.position.set(pt.x, h / 2, pt.z);
        barMesh.scale.set(1, h, 1);

        const wireMesh = new THREE.LineSegments(edgesGeo, wireMaterial.clone());
        barMesh.add(wireMesh);

        // Gradient coloring towards top values
        const heightFactor = h / maxOverallHeight;
        barMesh.material.color.lerp(new THREE.Color(params.barAccentColor), heightFactor * 0.5);
        barMesh.material.emissive.lerp(new THREE.Color(params.barAccentColor), heightFactor * 0.4);

        chartGroup.add(barMesh);

        barsData.push({
          mesh: barMesh,
          wireMesh: wireMesh,
          baseHeight: h,
          currentScaleY: h,
          targetHeight: h,
          x: pt.x,
          z: pt.z,
          phase: i * 0.32
        });
      }

      // 2. Build Glowing 3D Trend Line (Tube Spline with High Emissive Bloom)
      buildTrendSpline(fullRawPoints);

      // 3. Build Light Markers on Peaks (Световые отметки пиков)
      if (params.showPeakBeacons) {
        peaks.forEach(peak => {
          const peakGroup = new THREE.Group();
          peakGroup.position.copy(peak.point);

          // Glowing diamond beacon
          const beaconGeo = new THREE.OctahedronGeometry(peak.isATH ? 0.85 : 0.6, 0);
          const beaconMat = new THREE.MeshStandardMaterial({
            color: new THREE.Color(peak.isATH ? params.peakColor : params.barAccentColor),
            emissive: new THREE.Color(params.lineColor),
            emissiveIntensity: peak.isATH ? 3.0 : 1.8,
            roughness: 0.1
          });
          const beaconMesh = new THREE.Mesh(beaconGeo, beaconMat);
          beaconMesh.position.y = 1.2;
          peakGroup.add(beaconMesh);

          // Floating pulsing beacon ring
          const ringGeo = new THREE.RingGeometry(0.9, 1.2, 32);
          const ringMat = new THREE.MeshBasicMaterial({
            color: new THREE.Color(params.lineColor),
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.75,
            blending: THREE.AdditiveBlending
          });
          const ringMesh = new THREE.Mesh(ringGeo, ringMat);
          ringMesh.rotation.x = Math.PI / 2;
          ringMesh.position.y = 0.3;
          peakGroup.add(ringMesh);

          // Vertical laser light pillar connecting peak to floor
          const beamGeo = new THREE.CylinderGeometry(0.08, 0.08, peak.height, 12);
          const beamMat = new THREE.MeshBasicMaterial({
            color: new THREE.Color(params.lineColor),
            transparent: true,
            opacity: 0.45,
            blending: THREE.AdditiveBlending
          });
          const beamMesh = new THREE.Mesh(beamGeo, beamMat);
          beamMesh.position.y = -peak.height / 2;
          peakGroup.add(beamMesh);

          // Floor target halo circle under peak
          const haloGeo = new THREE.RingGeometry(0.4, 1.5, 24);
          const haloMat = new THREE.MeshBasicMaterial({
            color: new THREE.Color(params.lineColor),
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.5,
            blending: THREE.AdditiveBlending
          });
          const haloMesh = new THREE.Mesh(haloGeo, haloMat);
          haloMesh.rotation.x = Math.PI / 2;
          haloMesh.position.y = -peak.height + 0.04;
          peakGroup.add(haloMesh);

          chartGroup.add(peakGroup);
          peakMarkers.push({
            group: peakGroup,
            beacon: beaconMesh,
            ring: ringMesh,
            halo: haloMesh,
            baseHeight: peak.height,
            isATH: peak.isATH
          });

          if (peak.isATH && peakPointLight) {
            peakPointLight.position.set(peak.point.x, peak.point.y + 4, peak.point.z);
          }
        });
      }

      // Re-apply reveal progress if currently in an animated state
      applyRevealProgress();
    }

    function buildTrendSpline(points) {
      if (trendCurveMesh) {
        chartGroup.remove(trendCurveMesh);
        trendCurveMesh.geometry.dispose();
      }
      if (trendGlowMesh) {
        chartGroup.remove(trendGlowMesh);
        trendGlowMesh.geometry.dispose();
      }
      if (trendHeadMarker) {
        chartGroup.remove(trendHeadMarker);
        trendHeadMarker.geometry.dispose();
      }

      if (!points || points.length < 2) return;

      const curve = new THREE.CatmullRomCurve3(points, false, 'catmullrom', 0.15);
      const tubeGeo = new THREE.TubeGeometry(curve, points.length * 6, 0.38, 16, false);
      const glowTubeGeo = new THREE.TubeGeometry(curve, points.length * 6, 0.85, 16, false);

      const lineMat = new THREE.MeshStandardMaterial({
        color: new THREE.Color(params.lineColor),
        emissive: new THREE.Color(params.lineColor),
        emissiveIntensity: 2.5, // High intensity catches PostProcessor Bloom
        roughness: 0.1,
        metalness: 0.9
      });

      const glowMat = new THREE.MeshBasicMaterial({
        color: new THREE.Color(params.lineGlowColor),
        transparent: true,
        opacity: 0.45,
        blending: THREE.AdditiveBlending
      });

      trendCurveMesh = new THREE.Mesh(tubeGeo, lineMat);
      trendCurveMesh.castShadow = true;
      chartGroup.add(trendCurveMesh);

      trendGlowMesh = new THREE.Mesh(glowTubeGeo, glowMat);
      chartGroup.add(trendGlowMesh);

      // Leading Head Indicator (Floating diamond at crest)
      const headGeo = new THREE.OctahedronGeometry(0.95, 0);
      const headMat = new THREE.MeshStandardMaterial({
        color: new THREE.Color(params.peakColor),
        emissive: new THREE.Color(params.lineColor),
        emissiveIntensity: 3.2,
        roughness: 0.05
      });
      trendHeadMarker = new THREE.Mesh(headGeo, headMat);
      const leadingPt = points[points.length - 1];
      trendHeadMarker.position.set(leadingPt.x, leadingPt.y + 0.6, leadingPt.z);
      chartGroup.add(trendHeadMarker);
    }

    // =========================================================================
    // GSAP ANIMATED REVEAL (FORWARD & BACK ON CLICK)
    // =========================================================================
    function applyRevealProgress() {
      const p = revealState.progress;
      const count = barsData.length;
      if (count === 0) return;

      // 1. Reveal Histogram Bars with staggered easing
      for (let i = 0; i < count; i++) {
        const item = barsData[i];
        const barNormalizedPos = i / (count - 1);
        // Staggered reveal window across the timeline
        const barReveal = THREE.MathUtils.clamp((p - barNormalizedPos * 0.65) / 0.35, 0, 1);
        const h = Math.max(0.02, item.baseHeight * barReveal);
        item.currentScaleY = h;
        item.mesh.scale.y = h;
        item.mesh.position.y = h / 2;
        item.mesh.visible = (barReveal > 0.001);
      }

      // 2. Reveal Trend Line progressively along the curve
      const revealedPointsCount = Math.max(2, Math.round(fullRawPoints.length * THREE.MathUtils.clamp(p, 0.05, 1.0)));
      const slicedPoints = fullRawPoints.slice(0, revealedPointsCount);
      if (slicedPoints.length >= 2) {
        buildTrendSpline(slicedPoints);
      }

      // 3. Reveal Peak Markers
      peakMarkers.forEach(pm => {
        const peakPos = pm.group.position.x;
        const width = params.graphWidth;
        const normalizedX = (peakPos + width / 2) / width;
        const markerReveal = THREE.MathUtils.clamp((p - normalizedX * 0.7) / 0.3, 0, 1);
        pm.group.scale.set(markerReveal, markerReveal, markerReveal);
        pm.group.visible = (markerReveal > 0.01);
      });
    }

    function toggleGSAPReveal() {
      if (isGSAPAnimating) return;
      isGSAPAnimating = true;

      if (isRevealed) {
        // --- ANIMATE BACK (Shrink down in reverse) ---
        gsap.to(revealState, {
          progress: 0.0,
          duration: 1.25,
          ease: "power2.inOut",
          onUpdate: applyRevealProgress,
          onComplete: () => {
            isRevealed = false;
            isGSAPAnimating = false;
          }
        });
      } else {
        // --- ANIMATE FORWARD (Ascend and reveal to 100%) ---
        gsap.to(revealState, {
          progress: 1.0,
          duration: 1.45,
          ease: "power2.out",
          onUpdate: applyRevealProgress,
          onComplete: () => {
            isRevealed = true;
            isGSAPAnimating = false;
          }
        });
      }
    }

    // --- FLOATING PARTICLES ---
    function buildParticles() {
      while (particlesGroup.children.length > 0) {
        const obj = particlesGroup.children[0];
        if (obj.geometry) obj.geometry.dispose();
        if (obj.material) obj.material.dispose();
        particlesGroup.remove(obj);
      }

      const count = params.particleCount;
      const geo = new THREE.BufferGeometry();
      particlePositions = new Float32Array(count * 3);
      particleVelocities = new Float32Array(count * 3);

      const spanX = params.graphWidth * 1.3;
      const spanZ = params.graphDepth * 1.5;
      const spanY = params.trendHeight * 1.6;

      for (let i = 0; i < count; i++) {
        const i3 = i * 3;
        particlePositions[i3] = (Math.random() - 0.5) * spanX;
        particlePositions[i3 + 1] = Math.random() * spanY;
        particlePositions[i3 + 2] = (Math.random() - 0.5) * spanZ;

        particleVelocities[i3] = (Math.random() - 0.5) * 0.3;
        particleVelocities[i3 + 1] = 0.5 + Math.random() * 1.5; // upward drift
        particleVelocities[i3 + 2] = (Math.random() - 0.5) * 0.3;
      }

      geo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));

      // Circular glowing particle texture
      const canvas = document.createElement('canvas');
      canvas.width = 32;
      canvas.height = 32;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
      grad.addColorStop(0, 'rgba(255,255,255,1)');
      grad.addColorStop(0.35, 'rgba(255,255,255,0.85)');
      grad.addColorStop(0.7, 'rgba(255,255,255,0.25)');
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 32, 32);
      const texture = new THREE.CanvasTexture(canvas);

      const mat = new THREE.PointsMaterial({
        color: new THREE.Color(params.lineColor),
        size: 0.65,
        map: texture,
        transparent: true,
        opacity: 0.85,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      particlePoints = new THREE.Points(geo, mat);
      particlesGroup.add(particlePoints);
    }

    // --- COLOR PALETTE APPLIER ---
    function applyColorScheme(schemeName) {
      const scheme = COLOR_SCHEMES[schemeName];
      if (!scheme) return;

      params.colorScheme = schemeName;
      params.lineColor = scheme.line;
      params.lineGlowColor = scheme.lineGlow;
      params.barColor = scheme.bar;
      params.barAccentColor = scheme.barAccent;
      params.peakColor = scheme.peak;
      params.gridColor = scheme.grid;
      params.floorColor = scheme.floor;
      params.bgColor = scheme.bg;
      params.peakLightColor = scheme.line;
      params.floorLightColor = scheme.barAccent;

      updateSceneColors();
    }

    function updateSceneColors() {
      // 1. Background / Clear Color & Plane
      if (params.greenScreen) {
        scene.background = new THREE.Color("#00ff00");
        renderer.setClearColor("#00ff00", 1.0);
        if (floorMesh) floorMesh.visible = false;
        if (wallGrid) wallGrid.visible = false;
      } else {
        scene.background = new THREE.Color(params.bgColor);
        renderer.setClearColor(params.bgColor, 1.0);
        if (floorMesh) {
          floorMesh.visible = params.showPlane;
          floorMesh.material.color.set(params.floorColor);
        }
        if (wallGrid) wallGrid.visible = params.showWallGrid;
      }

      // 2. Coordinate Grid
      if (gridHelper) {
        gridHelper.visible = params.showGrid;
        gridHelper.material.color.set(params.gridColor);
      }

      // 3. Trend Line
      if (trendCurveMesh) {
        trendCurveMesh.material.color.set(params.lineColor);
        trendCurveMesh.material.emissive.set(params.lineColor);
      }
      if (trendGlowMesh) {
        trendGlowMesh.material.color.set(params.lineGlowColor);
      }
      if (trendHeadMarker) {
        trendHeadMarker.material.color.set(params.peakColor);
        trendHeadMarker.material.emissive.set(params.lineColor);
      }

      // 4. Bars & Wireframe
      barsData.forEach(b => {
        if (b.mesh && b.mesh.material) {
          b.mesh.material.color.set(params.barColor);
          b.mesh.material.emissive.set(params.barColor);
          b.mesh.material.emissiveIntensity = params.barEmissiveIntensity;
          b.mesh.material.opacity = params.barOpacity;
          b.mesh.material.transmission = params.barTransmission;
          b.mesh.material.roughness = params.barRoughness;
        }
        if (b.wireMesh) {
          b.wireMesh.visible = params.wireframeBars;
          b.wireMesh.material.color.set(params.barAccentColor);
        }
      });

      // 5. Peak Beacons
      peakMarkers.forEach(p => {
        if (p.beacon) {
          p.beacon.material.color.set(p.isATH ? params.peakColor : params.barAccentColor);
          p.beacon.material.emissive.set(params.lineColor);
        }
        if (p.ring) p.ring.material.color.set(params.lineColor);
        if (p.halo) p.halo.material.color.set(params.lineColor);
      });

      // 6. Particles
      if (particlePoints && particlePoints.material) {
        particlePoints.material.color.set(params.lineColor);
      }

      // 7. Lights
      updateLightsFromParams();
    }

    function disposeHierarchy(obj) {
      if (!obj) return;
      if (obj.geometry) obj.geometry.dispose();
      if (obj.material) {
        if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
        else obj.material.dispose();
      }
      while (obj.children && obj.children.length > 0) {
        disposeHierarchy(obj.children[0]);
        obj.remove(obj.children[0]);
      }
    }

    // =========================================================================
    // PROCEDURAL RANDOMIZER (DOES NOT TOUCH POSTPROCESSOR SETTINGS!)
    // =========================================================================
    function triggerRandomize() {
      // 1. Pick a random color scheme from presets
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      applyColorScheme(randomScheme);

      // 2. Re-roll geometric parameters
      params.barCount = Math.floor(18 + Math.random() * 16);
      params.trendHeight = 12 + Math.random() * 8;
      params.trendVolatility = 0.8 + Math.random() * 1.0;
      params.barWidthRatio = 0.5 + Math.random() * 0.35;
      params.barOpacity = 0.65 + Math.random() * 0.3;
      params.barTransmission = 0.25 + Math.random() * 0.4;
      params.barEmissiveIntensity = 0.6 + Math.random() * 0.5;

      // 3. Re-roll scene lights (Ambient & Directional)
      params.ambientIntensity = 0.8 + Math.random() * 0.7;
      params.dirLightIntensity = 2.0 + Math.random() * 1.5;
      params.peakLightIntensity = 3.0 + Math.random() * 3.0;

      // NOTE: PostProcessor settings (bloom, lens, anamorphic, etc.) are strictly PRESERVED
      // and NOT shuffled or changed as explicitly requested!

      // 4. Rebuild scene
      buildCoordinateGrid();
      generateTrendData();
      buildParticles();
      updateSceneColors();

      // Reset GSAP reveal state to full
      revealState.progress = 1.0;
      isRevealed = true;

      // Synchronize lil-gui controllers
      if (gui) gui.controllersRecursive().forEach(ctrl => ctrl.updateDisplay());
    }

    // =========================================================================
    // POINTER CLICK DETECTION (Distinguishes Stationary Click from Drag/Pan)
    // =========================================================================
    let pointerDownPos = { x: 0, y: 0 };
    let pointerDownTime = 0;

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.lil-gui')) return;
      pointerDownPos.x = e.clientX;
      pointerDownPos.y = e.clientY;
      pointerDownTime = performance.now();
    });

    window.addEventListener('pointerup', (e) => {
      if (e.target.closest('.lil-gui')) return;

      const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
      const duration = performance.now() - pointerDownTime;

      // Clean stationary click
      if (dist < 6 && duration < 350) {
        if (params.clickAction === "GSAP Reveal (Forward / Back)") {
          toggleGSAPReveal();
        } else if (params.clickAction === "Randomize Scene") {
          triggerRandomize();
        }
      }
    });

    // Keyboard 'H' to toggle UI
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        if (gui) gui.show(gui._hidden);
      }
    });

    // Window Resize
    window.addEventListener('resize', () => {
      if (!camera || !renderer) return;
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      if (postProcessor) {
        postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);
      }
    });

    // =========================================================================
    // LIL-GUI SETUP
    // =========================================================================
    let gui;
    function initGUI() {
      gui = new GUI({ title: "Bullish & Bearish 3D Controls" });

      // Trend Mode & GSAP Reveal Folder
      const fTrend = gui.addFolder("Market Trend & GSAP Reveal");
      fTrend.add(params, 'trendType', ["Bullish (Growth)", "Bearish (Crash / Downtrend)"]).name("Trend Mode").onChange(() => {
        generateTrendData();
        updateSceneColors();
      });
      fTrend.add(params, 'flipTrend').name("Flip Trend (Up / Down)");
      fTrend.add(params, 'clickAction', ["GSAP Reveal (Forward / Back)", "Randomize Scene", "None"]).name("Scene Click Action");
      fTrend.add(params, 'toggleReveal').name("Toggle Reveal (GSAP)");

      // Environment & Plane Visibility Folder (Opportunity to disable plane)
      const fEnv = gui.addFolder("Environment & Plane Display");
      fEnv.add(params, 'showPlane').name("Show Floor Plane").onChange(updateSceneColors);
      fEnv.add(params, 'showGrid').name("Show Floor Grid Lines").onChange(updateSceneColors);
      fEnv.add(params, 'showWallGrid').name("Show Wall Grid").onChange(updateSceneColors);
      fEnv.add(params, 'greenScreen').name("Green Screen (#00ff00)").onChange(updateSceneColors);

      // Color Theme Folder
      const fTheme = gui.addFolder("Color & Theme");
      fTheme.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES)).name("Preset Scheme").onChange(val => {
        applyColorScheme(val);
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      });
      fTheme.addColor(params, 'lineColor').name("Trend Line Color").onChange(updateSceneColors);
      fTheme.addColor(params, 'lineGlowColor').name("Line Glow Color").onChange(updateSceneColors);
      fTheme.addColor(params, 'barColor').name("Histogram Bar Color").onChange(updateSceneColors);
      fTheme.addColor(params, 'barAccentColor').name("Bar Accent / Wire").onChange(updateSceneColors);
      fTheme.addColor(params, 'peakColor').name("Peak Marker Color").onChange(updateSceneColors);
      fTheme.addColor(params, 'gridColor').name("Grid Lines Color").onChange(updateSceneColors);
      fTheme.addColor(params, 'floorColor').name("Floor Base Color").onChange(updateSceneColors);
      fTheme.addColor(params, 'bgColor').name("Scene Background").onChange(updateSceneColors);

      // Animation Modes Folder (8 Preconfigured Slow Smooth Animations + Static)
      const fAnim = gui.addFolder("Animation & Motion");
      fAnim.add(params, 'animationMode', [
        "Static (No Camera Motion)",
        "Slow Cinematic Orbit",
        "Bullish Ascend Glide",
        "Isometric Harmonic Float",
        "Wall Street Low Sweep",
        "Apex Peak Spotlight",
        "Panoramic Flyover",
        "Side-Profile Horizon"
      ]).name("Animation Mode");
      fAnim.add(params, 'animSpeed', 0.0, 3.0, 0.1).name("Animation Speed");

      // Scene Lights Folder
      const fLight = gui.addFolder("Lighting & Exposure");
      fLight.add(params, 'ambientIntensity', 0.0, 3.0, 0.05).name("Ambient Intensity").onChange(updateLightsFromParams);
      fLight.addColor(params, 'ambientColor').name("Ambient Color").onChange(updateLightsFromParams);
      fLight.add(params, 'dirLightIntensity', 0.0, 5.0, 0.1).name("Key Light Intensity").onChange(updateLightsFromParams);
      fLight.addColor(params, 'dirLightColor').name("Key Light Color").onChange(updateLightsFromParams);
      fLight.add(params, 'fillLightIntensity', 0.0, 4.0, 0.1).name("Fill Light Intensity").onChange(updateLightsFromParams);
      fLight.addColor(params, 'fillLightColor').name("Fill Light Color").onChange(updateLightsFromParams);
      fLight.add(params, 'peakLightIntensity', 0.0, 8.0, 0.2).name("Peak Accent Light").onChange(updateLightsFromParams);
      fLight.addColor(params, 'peakLightColor').name("Peak Light Color").onChange(updateLightsFromParams);
      fLight.add(params, 'floorLightIntensity', 0.0, 6.0, 0.2).name("Floor Accent Light").onChange(updateLightsFromParams);
      fLight.addColor(params, 'floorLightColor').name("Floor Light Color").onChange(updateLightsFromParams);

      // Render & Quality Folder
      const fRender = gui.addFolder("Render & Quality");
      fRender.add(params, 'dpr', 0.5, 3.0, 0.25).name("DPR (Pixel Ratio)").onChange(val => {
        if (renderer) renderer.setPixelRatio(val);
        if (postProcessor) postProcessor.setSize(window.innerWidth, window.innerHeight, val);
      });
      fRender.add(params, 'antialias').name("Antialias (Re-init)").onChange(() => {
        const prevCamPos = camera.position.clone();
        const prevTarget = controls.target.clone();
        initRenderer();
        camera.position.copy(prevCamPos);
        controls.target.copy(prevTarget);
        updateSceneColors();
      });

      // Graph Geometry Folder
      const fGeom = gui.addFolder("Graph Geometry");
      fGeom.add(params, 'barCount', 14, 40, 1).name("Bar Count").onFinishChange(() => {
        generateTrendData();
        updateSceneColors();
      });
      fGeom.add(params, 'trendHeight', 8, 26, 0.5).name("Trend Height").onFinishChange(() => {
        generateTrendData();
        updateSceneColors();
      });
      fGeom.add(params, 'trendVolatility', 0.2, 2.5, 0.1).name("Wave Volatility").onFinishChange(() => {
        generateTrendData();
        updateSceneColors();
      });
      fGeom.add(params, 'barWidthRatio', 0.3, 0.95, 0.05).name("Bar Width Ratio").onFinishChange(() => {
        generateTrendData();
        updateSceneColors();
      });
      fGeom.add(params, 'barOpacity', 0.2, 1.0, 0.05).name("Bar Opacity").onChange(updateSceneColors);
      fGeom.add(params, 'barEmissiveIntensity', 0.1, 2.0, 0.05).name("Bar Glow Intensity").onChange(updateSceneColors);
      fGeom.add(params, 'barTransmission', 0.0, 1.0, 0.05).name("Bar Transmission").onChange(updateSceneColors);
      fGeom.add(params, 'barRoughness', 0.0, 1.0, 0.05).name("Bar Roughness").onChange(updateSceneColors);
      fGeom.add(params, 'wireframeBars').name("Bar Wireframes").onChange(updateSceneColors);
      fGeom.add(params, 'showPeakBeacons').name("Peak Light Markers").onFinishChange(() => {
        generateTrendData();
        updateSceneColors();
      });

      // Procedural Randomizer Folder
      const fProc = gui.addFolder("Procedural Engine");
      fProc.add(params, 'randomizeNow').name("Randomize Scene");

      // Attach PostProcessor Controls directly into lil-gui
      if (postProcessor) {
        postProcessor.attachGUI(gui, "Post-Processing Suite");
      }

      fTrend.open();
    }

    // =========================================================================
    // ANIMATION & RENDER LOOP
    // =========================================================================
    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const elapsed = clock.getElapsedTime() * params.animSpeed;

      // 1. Dynamic Market Data Breathing (Subtle micro-oscillations)
      if (!isGSAPAnimating && isRevealed && barsData.length > 0) {
        for (let i = 0; i < barsData.length; i++) {
          const item = barsData[i];
          const pulse = Math.sin(elapsed * 2.2 + item.phase) * 0.15;
          const targetY = item.baseHeight * (1.0 + pulse * 0.06);
          item.mesh.scale.y += (targetY - item.mesh.scale.y) * 0.1;
          item.mesh.position.y = item.mesh.scale.y / 2;
        }
      }

      // 2. Trend Line Glow & Peak Head Marker animation
      if (trendHeadMarker) {
        trendHeadMarker.rotation.y = elapsed * 1.5;
        trendHeadMarker.rotation.z = Math.sin(elapsed * 2.0) * 0.3;
      }
      if (trendGlowMesh) {
        const glowPulse = 0.38 + Math.sin(elapsed * 3.0) * 0.15;
        trendGlowMesh.material.opacity = glowPulse;
      }

      // 3. Peak Light Markers Animation
      for (let i = 0; i < peakMarkers.length; i++) {
        const p = peakMarkers[i];
        if (p.beacon) {
          p.beacon.rotation.y = elapsed * (p.isATH ? 2.0 : 1.2) + i;
          p.beacon.position.y = 1.2 + Math.sin(elapsed * 2.5 + i * 1.4) * 0.25;
        }
        if (p.ring) {
          p.ring.rotation.z = elapsed * 0.8;
          const ringScale = 1.0 + Math.sin(elapsed * 3.0 + i) * 0.2;
          p.ring.scale.set(ringScale, ringScale, ringScale);
        }
        if (p.halo) {
          p.halo.material.opacity = 0.35 + Math.sin(elapsed * 2.0 + i) * 0.25;
        }
      }

      // 4. Floating Rising Bullish Particles Animation
      if (particlePositions && particleVelocities && particlePoints) {
        const count = params.particleCount;
        const spanY = params.trendHeight * 1.8;

        for (let i = 0; i < count; i++) {
          const i3 = i * 3;
          particlePositions[i3 + 1] += particleVelocities[i3 + 1] * delta * params.animSpeed * 2.5;
          particlePositions[i3] += Math.sin(elapsed + i) * 0.03 * params.animSpeed;

          if (particlePositions[i3 + 1] > spanY) {
            particlePositions[i3 + 1] = 0;
            particlePositions[i3] = (Math.random() - 0.5) * params.graphWidth * 1.2;
            particlePositions[i3 + 2] = (Math.random() - 0.5) * params.graphDepth * 1.4;
          }
        }
        particlePoints.geometry.attributes.position.needsUpdate = true;
      }

      // 5. Camera Motion based on the 8 Selected Animation Modes
      applyCameraAnimation(elapsed, delta);

      controls.update();

      // 6. Render through PostProcessor Suite Pipeline
      if (postProcessor) {
        postProcessor.renderScene(scene, camera);
      } else {
        renderer.render(scene, camera);
      }
    }

    // --- 8 PRECONFIGURED CAMERA ANIMATION MODES ---
    function applyCameraAnimation(elapsed, delta) {
      if (params.animationMode === "Static (No Camera Motion)") {
        return;
      }

      const radius = 42;
      const centerY = 9;

      switch (params.animationMode) {
        case "Slow Cinematic Orbit": {
          cameraAngle += delta * 0.12 * params.animSpeed;
          const cx = Math.sin(cameraAngle) * radius;
          const cz = Math.cos(cameraAngle) * radius;
          const cy = 20 + Math.sin(cameraAngle * 0.5) * 4;
          camera.position.set(cx, cy, cz);
          controls.target.set(0, centerY, 0);
          break;
        }

        case "Bullish Ascend Glide": {
          const glidePhase = (elapsed * 0.08) % (Math.PI * 2);
          const t = (Math.sin(glidePhase) + 1) / 2;
          const startX = -params.graphWidth * 0.35;
          const endX = params.graphWidth * 0.4;
          const curX = THREE.MathUtils.lerp(startX, endX, t);
          const curY = THREE.MathUtils.lerp(8, params.trendHeight + 10, t);
          const curZ = 28 + Math.cos(glidePhase) * 6;

          camera.position.lerp(new THREE.Vector3(curX, curY, curZ), 0.05);
          controls.target.set(curX * 0.6, curY * 0.6, 0);
          break;
        }

        case "Isometric Harmonic Float": {
          const sx = 28 + Math.sin(elapsed * 0.25) * 5;
          const sy = 22 + Math.cos(elapsed * 0.35) * 3;
          const sz = 34 + Math.sin(elapsed * 0.18) * 4;
          camera.position.lerp(new THREE.Vector3(sx, sy, sz), 0.05);
          controls.target.set(0, 7, 0);
          break;
        }

        case "Wall Street Low Sweep": {
          const sweepAngle = Math.sin(elapsed * 0.15) * 0.65;
          const lx = Math.sin(sweepAngle) * 32;
          const lz = 24 + Math.cos(sweepAngle) * 8;
          const ly = 4.5 + Math.sin(elapsed * 0.2) * 1.5;
          camera.position.lerp(new THREE.Vector3(lx, ly, lz), 0.05);
          controls.target.set(0, params.trendHeight * 0.65, 0);
          break;
        }

        case "Apex Peak Spotlight": {
          const lastBarX = params.graphWidth * 0.42;
          const peakY = params.trendHeight;
          const spotAngle = elapsed * 0.2;
          const px = lastBarX + Math.sin(spotAngle) * 16;
          const pz = Math.cos(spotAngle) * 16;
          const py = peakY + 6 + Math.sin(elapsed * 0.4) * 2;
          camera.position.lerp(new THREE.Vector3(px, py, pz), 0.05);
          controls.target.set(lastBarX, peakY * 0.9, 0);
          break;
        }

        case "Panoramic Flyover": {
          const flyT = (Math.sin(elapsed * 0.12) + 1) / 2;
          const fx = THREE.MathUtils.lerp(-24, 24, flyT);
          const fz = THREE.MathUtils.lerp(36, 20, flyT);
          const fy = 32 + Math.cos(elapsed * 0.2) * 4;
          camera.position.lerp(new THREE.Vector3(fx, fy, fz), 0.05);
          controls.target.set(0, 6, 0);
          break;
        }

        case "Side-Profile Horizon": {
          const panX = Math.sin(elapsed * 0.18) * 18;
          camera.position.lerp(new THREE.Vector3(panX, 16, 42), 0.05);
          controls.target.set(panX * 0.4, 8, 0);
          break;
        }
      }
    }

    // --- INITIALIZE EVERYTHING ---
    initScene();
    initGUI();
    animate();
  </script>
</body>
