<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vector Flow Field</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
      user-select: none;
      -webkit-user-select: none;
    }
    #canv {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
      cursor: grab;
    }
    #canv:active {
      cursor: grabbing;
    }
  </style>
</head>
<body>
  <canvas id="canv"></canvas>

  <script type="module">
    import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

    const c = document.getElementById('canv');
    const $ = c.getContext('2d');

    let w = window.innerWidth;
    let h = window.innerHeight;

    // Pan & Zoom state
    const panZoom = {
      x: 0,
      y: 0,
      zoom: 1.0
    };

    // Configuration and Settings
    const settings = {
      // Greenscreen & Display
      greenscreen: false,
      dpr: Math.min(window.devicePixelRatio || 1, 2),
      
      // Color Theme
      colorScheme: 'Spectrum (Original)',
      customColor: '#00e5ff',
      saturation: 90,
      lightness: 60,
      colorSpread: 1.0,
      hueOffset: 0,

      // Motion & Field
      animationSpeed: 1.0,
      animationPreset: 'Gentle Drift',
      frequencyX: 45,
      frequencyY: 45,
      forceX: 3.33,
      forceY: 3.33,

      // Geometry & Particles
      particleCount: Math.min(3500, Math.max(800, Math.round((window.innerWidth * window.innerHeight) / 810))),
      outerRadius: 15.0,
      innerRadius: 8.0,
      outerAlpha: 0.1,
      innerAlpha: 1.0,

      // Interactivity
      clickToRandomize: true,
      randomizeNow: () => randomizeScene(),
      resetView: () => {
        panZoom.x = 0;
        panZoom.y = 0;
        panZoom.zoom = 1.0;
      }
    };

    let arr = [];

    function initParticles() {
      arr = [];
      for (let i = 0; i < settings.particleCount; i++) {
        arr.push({
          x: Math.random() * w,
          y: Math.random() * h,
          vx: 0,
          vy: 0
        });
      }
    }

    function resize() {
      w = window.innerWidth;
      h = window.innerHeight;
      const dpr = settings.dpr;
      c.width = Math.round(w * dpr);
      c.height = Math.round(h * dpr);
      c.style.width = w + 'px';
      c.style.height = h + 'px';
    }

    window.addEventListener('resize', resize, false);
    resize();
    initParticles();

    function _X(p) {
      return Math.sin(p.y / settings.frequencyY) * settings.forceX;
    }

    function _Y(p) {
      return Math.sin(p.x / settings.frequencyX) * settings.forceY;
    }

    function upd(i) {
      const n = arr[i];
      const spd = settings.animationSpeed;
      n.x += n.vx * spd;
      n.y += n.vy * spd;

      if (n.x < 0) {
        n.x = w + n.x;
      } else if (n.x >= w) {
        n.x -= w;
      }

      if (n.y < 0) {
        n.y = h + n.y;
      } else if (n.y >= h) {
        n.y -= h;
      }

      n.vy = _Y(n);
      n.vx = _X(n);
    }

    function getColor(i) {
      switch (settings.colorScheme) {
        case 'Spectrum (Original)': {
          const hue = (i * settings.colorSpread + settings.hueOffset) % 360;
          return `hsla(${hue}, ${settings.saturation}%, ${settings.lightness}%, 1)`;
        }
        case 'Black & White': {
          return `hsla(0, 0%, ${settings.lightness}%, 1)`;
        }
        case 'White & Black': {
          const darkLightness = Math.max(0, 100 - settings.lightness);
          return `hsla(0, 0%, ${darkLightness}%, 1)`;
        }
        case 'Cyberpunk Neon': {
          const hues = [315, 185, 275, 50, 150];
          const baseHue = hues[i % hues.length];
          const hue = (baseHue + settings.hueOffset) % 360;
          return `hsla(${hue}, 100%, ${Math.min(75, settings.lightness)}%, 1)`;
        }
        case 'Emerald Aurora': {
          const hues = [145, 170, 190, 125, 45];
          const baseHue = hues[i % hues.length];
          const hue = (baseHue + settings.hueOffset) % 360;
          return `hsla(${hue}, 95%, ${Math.min(70, settings.lightness)}%, 1)`;
        }
        case 'Custom': {
          return settings.customColor;
        }
        default: {
          const hue = (i * settings.colorSpread + settings.hueOffset) % 360;
          return `hsla(${hue}, ${settings.saturation}%, ${settings.lightness}%, 1)`;
        }
      }
    }

    function draw(i) {
      const n = arr[i];
      const col = getColor(i);
      const vSq = n.vx * n.vx + n.vy * n.vy;

      // Outer rings
      $.beginPath();
      $.fillStyle = col;
      $.globalAlpha = settings.outerAlpha;
      const outerR = Math.max(0.1, settings.outerRadius / Math.max(vSq, 0.5));
      $.arc(n.x, n.y, outerR, 0, 2 * Math.PI, false);
      $.closePath();
      $.fill();

      // Inner rings
      $.beginPath();
      $.globalAlpha = settings.innerAlpha;
      $.fillStyle = col;
      const innerR = Math.max(0.1, settings.innerRadius / Math.max(vSq, 0.8));
      $.arc(n.x, n.y, innerR, 0, 2 * Math.PI, false);
      $.closePath();
      $.fill();
    }

    let cameraTime = 0;

    function go() {
      cameraTime += 0.01 * settings.animationSpeed;

      // Calculate camera preset motion
      let animCamX = 0;
      let animCamY = 0;
      let animCamZoom = 1.0;

      switch (settings.animationPreset) {
        case 'Gentle Drift':
          animCamX = Math.sin(cameraTime * 0.4) * (w * 0.08);
          animCamY = Math.cos(cameraTime * 0.28) * (h * 0.08);
          animCamZoom = 1.0 + Math.sin(cameraTime * 0.35) * 0.08;
          break;
        case 'Slow Orbit':
          animCamX = Math.cos(cameraTime * 0.3) * (w * 0.12);
          animCamY = Math.sin(cameraTime * 0.3) * (h * 0.12);
          animCamZoom = 1.0 + Math.sin(cameraTime * 0.2) * 0.06;
          break;
        case 'Hypnotic Pulse':
          animCamX = Math.sin(cameraTime * 0.2) * (w * 0.04);
          animCamY = Math.cos(cameraTime * 0.25) * (h * 0.04);
          animCamZoom = 1.0 + Math.sin(cameraTime * 0.5) * 0.18;
          break;
        case 'Wandering Flow':
          animCamX = (Math.sin(cameraTime * 0.22) + Math.sin(cameraTime * 0.47) * 0.4) * (w * 0.1);
          animCamY = (Math.cos(cameraTime * 0.18) + Math.cos(cameraTime * 0.39) * 0.4) * (h * 0.1);
          animCamZoom = 1.0 + Math.sin(cameraTime * 0.16) * 0.12;
          break;
        case 'Static (No Movement)':
        default:
          animCamX = 0;
          animCamY = 0;
          animCamZoom = 1.0;
          break;
      }

      // Reset transforms with DPR
      $.setTransform(settings.dpr, 0, 0, settings.dpr, 0, 0);

      // Render background
      let bgColor = '#000000';
      if (settings.greenscreen) {
        bgColor = '#00ff00';
      } else if (settings.colorScheme === 'White & Black') {
        bgColor = '#ffffff';
      } else if (settings.colorScheme === 'Cyberpunk Neon') {
        bgColor = '#080314';
      } else if (settings.colorScheme === 'Emerald Aurora') {
        bgColor = '#02120e';
      }

      document.body.style.backgroundColor = bgColor;
      $.fillStyle = bgColor;
      $.globalAlpha = 1.0;
      $.fillRect(0, 0, w, h);

      // Apply viewport pan/zoom + animation transforms
      $.save();
      const totalZoom = panZoom.zoom * animCamZoom;
      const totalPanX = panZoom.x + animCamX;
      const totalPanY = panZoom.y + animCamY;

      $.translate(w / 2 + totalPanX, h / 2 + totalPanY);
      $.scale(totalZoom, totalZoom);
      $.translate(-w / 2, -h / 2);

      const totalParticles = arr.length;
      for (let i = 0; i < totalParticles; i++) {
        upd(i);
        draw(i);
      }
      $.restore();
    }

    function run() {
      window.requestAnimationFrame(run);
      go();
    }
    run();

    // Mouse & Touch Pan / Zoom interaction
    let isPointerDown = false;
    let startPointer = { x: 0, y: 0 };
    let startPan = { x: 0, y: 0 };
    let totalPointerMoveDist = 0;

    c.addEventListener('pointerdown', (e) => {
      if (e.target !== c) return;
      isPointerDown = true;
      startPointer = { x: e.clientX, y: e.clientY };
      startPan = { x: panZoom.x, y: panZoom.y };
      totalPointerMoveDist = 0;
      try { c.setPointerCapture(e.pointerId); } catch (_) {}
    });

    c.addEventListener('pointermove', (e) => {
      if (!isPointerDown) return;
      const dx = e.clientX - startPointer.x;
      const dy = e.clientY - startPointer.y;
      totalPointerMoveDist += Math.hypot(e.movementX || dx, e.movementY || dy);
      panZoom.x = startPan.x + dx;
      panZoom.y = startPan.y + dy;
    });

    c.addEventListener('pointerup', (e) => {
      if (!isPointerDown) return;
      isPointerDown = false;
      try { c.releasePointerCapture(e.pointerId); } catch (_) {}

      // If clicked without dragging, trigger randomization if enabled
      if (totalPointerMoveDist < 6 && settings.clickToRandomize) {
        randomizeScene();
      }
    });

    c.addEventListener('pointercancel', () => {
      isPointerDown = false;
    });

    // Zoom with mouse wheel
    window.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.09 : 0.917;
      const mouseX = e.clientX - w / 2;
      const mouseY = e.clientY - h / 2;

      panZoom.x = mouseX - (mouseX - panZoom.x) * zoomFactor;
      panZoom.y = mouseY - (mouseY - panZoom.y) * zoomFactor;
      panZoom.zoom = Math.max(0.05, Math.min(30, panZoom.zoom * zoomFactor));
    }, { passive: false });

    // Touch pinch to zoom support
    let initialPinchDistance = null;
    let initialPinchZoom = 1;

    window.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        initialPinchDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        initialPinchZoom = panZoom.zoom;
      }
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2 && initialPinchDistance) {
        const currentDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const scale = currentDist / initialPinchDistance;
        panZoom.zoom = Math.max(0.05, Math.min(30, initialPinchZoom * scale));
      }
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) {
        initialPinchDistance = null;
      }
    }, { passive: true });

    // Randomizer
    function randomizeScene() {
      const schemes = [
        'Spectrum (Original)',
        'Black & White',
        'White & Black',
        'Cyberpunk Neon',
        'Emerald Aurora'
      ];
      const anims = [
        'Static (No Movement)',
        'Gentle Drift',
        'Slow Orbit',
        'Hypnotic Pulse',
        'Wandering Flow'
      ];

      settings.colorScheme = schemes[Math.floor(Math.random() * schemes.length)];
      settings.animationPreset = anims[Math.floor(Math.random() * anims.length)];

      settings.frequencyX = Math.round(20 + Math.random() * 80);
      settings.frequencyY = Math.round(20 + Math.random() * 80);
      settings.forceX = parseFloat((1.5 + Math.random() * 4.5).toFixed(2));
      settings.forceY = parseFloat((1.5 + Math.random() * 4.5).toFixed(2));
      settings.animationSpeed = parseFloat((0.6 + Math.random() * 1.4).toFixed(2));

      settings.outerRadius = parseFloat((8 + Math.random() * 22).toFixed(1));
      settings.innerRadius = parseFloat((3 + Math.random() * 12).toFixed(1));
      settings.outerAlpha = parseFloat((0.04 + Math.random() * 0.18).toFixed(2));
      settings.innerAlpha = parseFloat((0.6 + Math.random() * 0.4).toFixed(2));

      settings.colorSpread = parseFloat((0.3 + Math.random() * 2.5).toFixed(2));
      settings.hueOffset = Math.round(Math.random() * 360);
      settings.saturation = Math.round(75 + Math.random() * 25);
      settings.lightness = Math.round(45 + Math.random() * 30);

      for (let j = 0; j < arr.length; j++) {
        arr[j].vx = _X(arr[j]);
        arr[j].vy = _Y(arr[j]);
      }

      updateGuiDisplays();
    }

    function updateGuiDisplays() {
      if (gui && typeof gui.controllersRecursive === 'function') {
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      }
    }

    // Initialize lil-gui
    const gui = new GUI({ title: 'Flow Field Controls' });

    // Display & View Folder
    const fDisplay = gui.addFolder('Display & View');
    fDisplay.add(settings, 'greenscreen').name('Greenscreen (#00ff00)');
    fDisplay.add(settings, 'dpr', 0.25, 3.0, 0.25).name('Pixel Ratio (DPR)').onChange(resize);
    fDisplay.add(settings, 'resetView').name('Reset Pan & Zoom');

    // Color & Theme Folder
    const fColor = gui.addFolder('Color & Theme');
    fColor.add(settings, 'colorScheme', [
      'Spectrum (Original)',
      'Black & White',
      'White & Black',
      'Cyberpunk Neon',
      'Emerald Aurora',
      'Custom'
    ]).name('Color Scheme');
    fColor.addColor(settings, 'customColor').name('Custom Color');
    fColor.add(settings, 'saturation', 0, 100, 1).name('Saturation %');
    fColor.add(settings, 'lightness', 0, 100, 1).name('Lightness %');
    fColor.add(settings, 'colorSpread', 0.1, 5.0, 0.05).name('Color Spread');
    fColor.add(settings, 'hueOffset', 0, 360, 1).name('Hue Offset');

    // Animation & Motion Folder
    const fMotion = gui.addFolder('Animation & Motion');
    fMotion.add(settings, 'animationPreset', [
      'Static (No Movement)',
      'Gentle Drift',
      'Slow Orbit',
      'Hypnotic Pulse',
      'Wandering Flow'
    ]).name('Camera Animation');
    fMotion.add(settings, 'animationSpeed', 0.0, 3.0, 0.05).name('Speed Multiplier');
    fMotion.add(settings, 'frequencyX', 10, 150, 1).name('Frequency X');
    fMotion.add(settings, 'frequencyY', 10, 150, 1).name('Frequency Y');
    fMotion.add(settings, 'forceX', 0.5, 10.0, 0.1).name('Force X');
    fMotion.add(settings, 'forceY', 0.5, 10.0, 0.1).name('Force Y');

    // Geometry & Particles Folder
    const fParticles = gui.addFolder('Particles & Rings');
    fParticles.add(settings, 'particleCount', 200, 6000, 100).name('Particle Count').onFinishChange(() => {
      initParticles();
    });
    fParticles.add(settings, 'outerRadius', 2.0, 50.0, 0.5).name('Outer Ring Size');
    fParticles.add(settings, 'innerRadius', 1.0, 30.0, 0.5).name('Inner Ring Size');
    fParticles.add(settings, 'outerAlpha', 0.01, 0.5, 0.01).name('Outer Glow Alpha');
    fParticles.add(settings, 'innerAlpha', 0.1, 1.0, 0.05).name('Inner Core Alpha');

    // Interactivity Folder
    const fInteract = gui.addFolder('Interactivity');
    fInteract.add(settings, 'clickToRandomize').name('Click Scene: Randomize');
    fInteract.add(settings, 'randomizeNow').name('🎲 Randomize Scene');

    // Toggle UI visibility with "H" key
    let isGuiVisible = true;
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        isGuiVisible = !isGuiVisible;
        if (typeof gui.show === 'function' && typeof gui.hide === 'function') {
          if (isGuiVisible) gui.show();
          else gui.hide();
        } else if (gui.domElement) {
          gui.domElement.style.display = isGuiVisible ? '' : 'none';
        }
      }
    });
  </script>
</body>
</html>
