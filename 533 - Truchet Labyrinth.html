<!DOCTYPE html>

  <title>533 - Kinetic Truchet Labyrinth</title>
  <style>
    * {
      padding: 0;
      margin: 0;
      overflow: hidden;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #080810;
      user-select: none;
      -webkit-user-select: none;
      overscroll-behavior: none;
    }
    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: block;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
      touch-action: none;
      cursor: grab;
    }
    canvas.dragging {
      cursor: grabbing;
    }
  </style>
</head>

    // =========================================================================

    // =========================================================================

      'Static (No Camera Move)',
      'Gentle Orbit (Slow 360°)',
      'Low Horizon Sweep',
      'Breathing Dolly Glide',
      'Slow Pitch & Roll Drift',
      'Figure-8 Smooth Flow',
      'Spiral Helix Orbit',
      'Pendulum Arc Swing'
    ];

    // =========================================================================
    // Application Parameters
    // =========================================================================
    const PARAMS = {
      // Color Themes & Background
      colorScheme: 'Original',
      greenScreen: false,
      backgroundColor: '#080810',
      c1: '#ffffff',
      c2: '#c0c0c0',
      c3: '#00ffff',
      c4: '#ff007f',
      c5: '#181824',

      // Camera & Navigation
      camDistance: 8.5,
      camTheta: 0.0,
      camPhi: Math.PI * 0.32,
      panX: 0.0,
      panY: 0.0,
      panZ: 0.0,
      fov: 50,
      mouseAction: 'Rotate Camera',

      // Animation & Motion
      cameraAnimation: 'Gentle Orbit (Slow 360°)',
      animationSpeed: 1.0,
      rotationSpeed: 0.8,
      waveFreq: 0.45,
      waveSpatial: 0.25,
      waveZHeight: 0.12,

      // Truchet Geometry Parameters
      gridSize: 14,
      tileSize: 0.95,
      tubeRadius: 0.075,
      showJoints: true,
      showBasePlates: true,
      metalness: 0.65,
      roughness: 0.28,
      clearcoat: 0.6,

      // Lighting & Exposure
      exposure: 1.1,
      masterLightIntensity: 1.0,
      light1Color: '#ffffff',
      light1Intensity: 1.2,
      light1PosX: 15.0,
      light1PosY: 25.0,
      light1PosZ: 18.0,

      light2Color: '#00ffff',
      light2Intensity: 1.0,
      light2PosX: -15.0,
      light2PosY: 12.0,
      light2PosZ: -12.0,

      ambientColor: '#202030',
      ambientIntensity: 0.8,

      // Renderer Settings
      dpr: Math.min(window.devicePixelRatio || 1, 2.0),
      antialias: true,

      // Procedural Re-roll on Click
      clickToRandomize: true
    };

    let savedCustomBg = PARAMS.backgroundColor;

    // =========================================================================
    // Kinetic Truchet Labyrinth App
    // =========================================================================
    class KineticApp {
      constructor() {
        this.container = document.getElementById('canvas-container');
        this.width = window.innerWidth;
        this.height = window.innerHeight;

        this.animTime = 0;
        this.panTarget = new THREE.Vector3(0, 0, 0);

        this.initRenderer();
        this.initScene();
        this.initCamera();
        this.initLights();
        this.initMaterials();
        this.buildTruchetGrid();
        this.setupEvents();
        this.setupGui();

        this.clock = new THREE.Clock();
        this.animate = this.animate.bind(this);
        requestAnimationFrame(this.animate);
      }

      initRenderer() {
        if (this.renderer) {
          if (this.renderer.domElement && this.renderer.domElement.parentNode) {
            this.renderer.domElement.parentNode.removeChild(this.renderer.domElement);
          }
          this.renderer.dispose();
        }

        this.renderer = new THREE.WebGLRenderer({
          antialias: PARAMS.antialias,
          powerPreference: 'high-performance'
        });
        this.renderer.setSize(this.width, this.height);
        this.renderer.setPixelRatio(PARAMS.dpr);
        this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
        this.renderer.toneMappingExposure = PARAMS.exposure;
        this.renderer.outputEncoding = THREE.sRGBEncoding;

        this.canvas = this.renderer.domElement;
        this.container.appendChild(this.canvas);

        this.updateBackgroundColor();
      }

      initScene() {
        this.scene = new THREE.Scene();
        this.gridGroup = new THREE.Group();
        this.scene.add(this.gridGroup);
      }

      initCamera() {
        this.camera = new THREE.PerspectiveCamera(PARAMS.fov, this.width / this.height, 0.1, 500);
        this.updateCameraPosition();
      }

      initLights() {
        // Directional (Key Light)
        this.dirLight = new THREE.DirectionalLight(PARAMS.light1Color, PARAMS.light1Intensity);
        this.dirLight.position.set(PARAMS.light1PosX, PARAMS.light1PosY, PARAMS.light1PosZ);
        this.scene.add(this.dirLight);

        // Point Light (Fill Light)
        this.pointLight = new THREE.PointLight(PARAMS.light2Color, PARAMS.light2Intensity, 100);
        this.pointLight.position.set(PARAMS.light2PosX, PARAMS.light2PosY, PARAMS.light2PosZ);
        this.scene.add(this.pointLight);

        // Ambient Light
        this.ambientLight = new THREE.AmbientLight(PARAMS.ambientColor, PARAMS.ambientIntensity);
        this.scene.add(this.ambientLight);
      }

      initMaterials() {
        const matConfig = {
          metalness: PARAMS.metalness,
          roughness: PARAMS.roughness,
          clearcoat: PARAMS.clearcoat,
          clearcoatRoughness: 0.15
        };

        this.matArc1 = new THREE.MeshPhysicalMaterial({ color: PARAMS.c1, ...matConfig });
        this.matArc2 = new THREE.MeshPhysicalMaterial({ color: PARAMS.c2, ...matConfig });
        this.matJoint = new THREE.MeshPhysicalMaterial({ color: PARAMS.c3, ...matConfig });
        this.matPlate = new THREE.MeshPhysicalMaterial({
          color: PARAMS.c5,
          metalness: 0.3,
          roughness: 0.65,
          clearcoat: 0.2
        });
      }

      updateMaterials() {
        this.matArc1.color.set(PARAMS.c1);
        this.matArc1.metalness = PARAMS.metalness;
        this.matArc1.roughness = PARAMS.roughness;
        this.matArc1.clearcoat = PARAMS.clearcoat;

        this.matArc2.color.set(PARAMS.c2);
        this.matArc2.metalness = PARAMS.metalness;
        this.matArc2.roughness = PARAMS.roughness;
        this.matArc2.clearcoat = PARAMS.clearcoat;

        this.matJoint.color.set(PARAMS.c3);
        this.matJoint.metalness = PARAMS.metalness;
        this.matJoint.roughness = PARAMS.roughness;
        this.matJoint.clearcoat = PARAMS.clearcoat;

        this.matPlate.color.set(PARAMS.c5);
      }

      updateLights() {
        const m = PARAMS.masterLightIntensity;
        this.dirLight.color.set(PARAMS.light1Color);
        this.dirLight.intensity = PARAMS.light1Intensity * m;
        this.dirLight.position.set(PARAMS.light1PosX, PARAMS.light1PosY, PARAMS.light1PosZ);

        this.pointLight.color.set(PARAMS.light2Color);
        this.pointLight.intensity = PARAMS.light2Intensity * m;
        this.pointLight.position.set(PARAMS.light2PosX, PARAMS.light2PosY, PARAMS.light2PosZ);

        this.ambientLight.color.set(PARAMS.ambientColor);
        this.ambientLight.intensity = PARAMS.ambientIntensity * m;

        this.renderer.toneMappingExposure = PARAMS.exposure;
      }

      updateBackgroundColor() {
        const hex = PARAMS.greenScreen ? '#00ff00' : PARAMS.backgroundColor;
        const col = new THREE.Color(hex);
        if (this.scene) this.scene.background = col;
        if (this.renderer) this.renderer.setClearColor(col, 1.0);
        document.body.style.backgroundColor = hex;
      }

      buildTruchetGrid() {
        // Dispose previous geometries and meshes
        while (this.gridGroup.children.length > 0) {
          const child = this.gridGroup.children[0];
          this.gridGroup.remove(child);
        }

        if (this.sharedArcGeom) this.sharedArcGeom.dispose();
        if (this.sharedJointGeom) this.sharedJointGeom.dispose();
        if (this.sharedPlateGeom) this.sharedPlateGeom.dispose();

        const S = PARAMS.tileSize;
        const R = S * 0.5;
        const rTube = PARAMS.tubeRadius;

        // Shared geometries for maximum performance and silky 60fps
        this.sharedArcGeom = new THREE.TorusGeometry(R, rTube, 20, 36, Math.PI / 2);
        this.sharedJointGeom = new THREE.SphereGeometry(rTube * 1.06, 16, 16);
        this.sharedPlateGeom = new THREE.BoxGeometry(S * 0.97, S * 0.97, 0.05);

        const N = PARAMS.gridSize;
        this.tiles = [];

        // Center entire grid around origin
        const halfExtent = (N - 1) * 0.5 * S;

        for (let y = 0; y < N; y++) {
          for (let x = 0; x < N; x++) {
            const tileGroup = new THREE.Group();
            const posX = x * S - halfExtent;
            const posY = y * S - halfExtent;
            tileGroup.position.set(posX, posY, 0);

            // Random initial state (0 or 1)
            const type = Math.random() < 0.5 ? 0 : 1;

            // Arc 1 (Top-Right quarter torus)
            const arcMesh1 = new THREE.Mesh(this.sharedArcGeom, (x + y) % 2 === 0 ? this.matArc1 : this.matArc2);
            arcMesh1.position.set(R, R, 0);
            arcMesh1.rotation.z = Math.PI;
            tileGroup.add(arcMesh1);

            // Arc 2 (Bottom-Left quarter torus)
            const arcMesh2 = new THREE.Mesh(this.sharedArcGeom, (x + y) % 2 === 0 ? this.matArc2 : this.matArc1);
            arcMesh2.position.set(-R, -R, 0);
            arcMesh2.rotation.z = 0;
            tileGroup.add(arcMesh2);

            // Joint beads at edge midpoints (optional decorative accent)
            if (PARAMS.showJoints) {
              const j1 = new THREE.Mesh(this.sharedJointGeom, this.matJoint);
              j1.position.set(0, R, 0);
              tileGroup.add(j1);

              const j2 = new THREE.Mesh(this.sharedJointGeom, this.matJoint);
              j2.position.set(R, 0, 0);
              tileGroup.add(j2);

              const j3 = new THREE.Mesh(this.sharedJointGeom, this.matJoint);
              j3.position.set(0, -R, 0);
              tileGroup.add(j3);

              const j4 = new THREE.Mesh(this.sharedJointGeom, this.matJoint);
              j4.position.set(-R, 0, 0);
              tileGroup.add(j4);
            }

            // Sleek architectural base plate underneath
            if (PARAMS.showBasePlates) {
              const plateMesh = new THREE.Mesh(this.sharedPlateGeom, this.matPlate);
              plateMesh.position.set(0, 0, -rTube - 0.03);
              tileGroup.add(plateMesh);
            }

            // Type 1 is simply type 0 rotated by 90 degrees
            const baseRot = type === 1 ? Math.PI * 0.5 : 0;
            tileGroup.rotation.z = baseRot;

            this.gridGroup.add(tileGroup);

            this.tiles.push({
              group: tileGroup,
              gridX: x,
              gridY: y,
              type: type,
              baseRot: baseRot
            });
          }
        }

        // Align master group with user's panning target
        this.gridGroup.position.copy(this.panTarget);
      }

      applyColorScheme(name) {
        const s = COLOR_SCHEMES[name];
        if (!s) return;
        PARAMS.colorScheme = name;

        if (!PARAMS.greenScreen) {
          PARAMS.backgroundColor = s.bg;
          savedCustomBg = s.bg;
        }

        PARAMS.c1 = s.c1;
        PARAMS.c2 = s.c2;
        PARAMS.c3 = s.c3;
        PARAMS.c4 = s.c4;
        PARAMS.c5 = s.c5;

        PARAMS.light1Color = s.light1Color;
        PARAMS.light1Intensity = s.light1Intensity;
        PARAMS.light2Color = s.light2Color;
        PARAMS.light2Intensity = s.light2Intensity;
        PARAMS.ambientColor = s.ambientColor;
        PARAMS.ambientIntensity = s.ambientIntensity;

        this.updateBackgroundColor();
        this.updateMaterials();
        this.updateLights();
        this.updateGuiDisplay();
      }

      updateCameraPosition(dDist = 0, dTheta = 0, dPhi = 0) {
        const curDist = Math.max(0.4, PARAMS.camDistance + dDist);
        const curTheta = PARAMS.camTheta + dTheta;
        const curPhi = THREE.MathUtils.clamp(PARAMS.camPhi + dPhi, 0.05, Math.PI - 0.05);

        this.camera.position.x = this.panTarget.x + curDist * Math.sin(curPhi) * Math.sin(curTheta);
        this.camera.position.y = this.panTarget.y + curDist * Math.cos(curPhi);
        this.camera.position.z = this.panTarget.z + curDist * Math.sin(curPhi) * Math.cos(curTheta);

        this.camera.lookAt(this.panTarget);
        this.camera.fov = PARAMS.fov;
        this.camera.updateProjectionMatrix();
      }

      randomizeScene() {
        // 1. Pick a random color scheme from the 19 schemes
        const schemeKeys = Object.keys(COLOR_SCHEMES);
        const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
        this.applyColorScheme(randomScheme);

        // 2. Re-roll geometric parameters
        PARAMS.gridSize = Math.floor(THREE.MathUtils.randFloat(10, 18));
        PARAMS.tubeRadius = +(THREE.MathUtils.randFloat(0.045, 0.11)).toFixed(3);
        PARAMS.metalness = +(THREE.MathUtils.randFloat(0.3, 0.9)).toFixed(2);
        PARAMS.roughness = +(THREE.MathUtils.randFloat(0.12, 0.45)).toFixed(2);
        PARAMS.clearcoat = +(THREE.MathUtils.randFloat(0.3, 0.95)).toFixed(2);
        PARAMS.showJoints = Math.random() < 0.65;
        PARAMS.showBasePlates = Math.random() < 0.75;
        PARAMS.waveZHeight = +(THREE.MathUtils.randFloat(0.0, 0.35)).toFixed(2);

        // 3. Re-roll motion & animation parameters
        PARAMS.cameraAnimation = CAMERA_ANIMATIONS[Math.floor(Math.random() * CAMERA_ANIMATIONS.length)];
        PARAMS.animationSpeed = +(THREE.MathUtils.randFloat(0.65, 1.6)).toFixed(2);
        PARAMS.rotationSpeed = +(THREE.MathUtils.randFloat(0.5, 1.4)).toFixed(2);
        PARAMS.waveFreq = +(THREE.MathUtils.randFloat(0.2, 0.75)).toFixed(2);
        PARAMS.waveSpatial = +(THREE.MathUtils.randFloat(0.1, 0.5)).toFixed(2);

        // 4. Re-roll lighting parameters
        PARAMS.exposure = +(THREE.MathUtils.randFloat(0.9, 1.4)).toFixed(2);
        PARAMS.masterLightIntensity = +(THREE.MathUtils.randFloat(0.85, 1.35)).toFixed(2);

        // Rebuild grid with newly seeded parameters
        this.buildTruchetGrid();
        this.updateMaterials();
        this.updateLights();
        this.updateGuiDisplay();
      }

      setupEvents() {
        this.pointer = {
          down: false,
          panning: false,
          rotating: false,
          startX: 0,
          startY: 0,
          lastX: 0,
          lastY: 0,
          startTime: 0
        };

        const onPointerDown = (e) => {
          this.pointer.down = true;
          this.pointer.startX = e.clientX;
          this.pointer.startY = e.clientY;
          this.pointer.lastX = e.clientX;
          this.pointer.lastY = e.clientY;
          this.pointer.startTime = performance.now();

          // Right click, middle click, shift key or "Drag Object" action drags across screen
          if (e.button === 2 || e.button === 1 || e.shiftKey || PARAMS.mouseAction === 'Drag Object Across Screen') {
            this.pointer.panning = true;
            this.pointer.rotating = false;
          } else if (e.button === 0) {
            this.pointer.rotating = true;
            this.pointer.panning = false;
          }

          this.canvas.classList.add('dragging');
        };

        const onPointerMove = (e) => {
          if (!this.pointer.down) return;
          const dx = e.clientX - this.pointer.lastX;
          const dy = e.clientY - this.pointer.lastY;
          this.pointer.lastX = e.clientX;
          this.pointer.lastY = e.clientY;

          if (this.pointer.panning) {
            // Drag object across screen (Pan 1:1 in screen view space)
            const fovRad = (this.camera.fov * Math.PI) / 180;
            const visibleHeight = 2.0 * Math.max(PARAMS.camDistance, 0.5) * Math.tan(fovRad * 0.5);
            const worldScale = visibleHeight / Math.max(window.innerHeight, 1);

            const right = new THREE.Vector3();
            const up = new THREE.Vector3();
            this.camera.matrix.extractBasis(right, up, new THREE.Vector3());

            this.panTarget.addScaledVector(right, -dx * worldScale);
            this.panTarget.addScaledVector(up, dy * worldScale);

            PARAMS.panX = +this.panTarget.x.toFixed(3);
            PARAMS.panY = +this.panTarget.y.toFixed(3);
            PARAMS.panZ = +this.panTarget.z.toFixed(3);

            this.gridGroup.position.copy(this.panTarget);
            this.updateCameraPosition();
            if (this.ctrlPanX) this.ctrlPanX.updateDisplay();
            if (this.ctrlPanY) this.ctrlPanY.updateDisplay();
            if (this.ctrlPanZ) this.ctrlPanZ.updateDisplay();
          } else if (this.pointer.rotating) {
            // Change camera angle during animation
            PARAMS.camTheta -= dx * 0.0055;
            PARAMS.camPhi = THREE.MathUtils.clamp(PARAMS.camPhi - dy * 0.0055, 0.05, Math.PI - 0.05);

            this.updateCameraPosition();
            if (this.ctrlTheta) this.ctrlTheta.updateDisplay();
            if (this.ctrlPhi) this.ctrlPhi.updateDisplay();
          }
        };

        const onPointerUp = (e) => {
          if (!this.pointer.down) return;
          const elapsed = performance.now() - this.pointer.startTime;
          const distMoved = Math.hypot(e.clientX - this.pointer.startX, e.clientY - this.pointer.startY);
          const wasRotating = this.pointer.rotating;

          this.pointer.down = false;
          this.pointer.panning = false;
          this.pointer.rotating = false;
          this.canvas.classList.remove('dragging');

          // Clean single click on scene triggers procedural randomize
          if (wasRotating && distMoved < 6 && elapsed < 320 && e.button === 0 && !e.shiftKey) {
            if (PARAMS.clickToRandomize) {
              this.randomizeScene();
            }
          }
        };

        const onWheel = (e) => {
          e.preventDefault();
          // Smooth zoom with wheel without snapping back during animation
          const zoomMultiplier = 1.0 + e.deltaY * 0.0012;
          PARAMS.camDistance = THREE.MathUtils.clamp(PARAMS.camDistance * zoomMultiplier, 0.8, 40.0);
          this.updateCameraPosition();
          if (this.ctrlDist) this.ctrlDist.updateDisplay();
        };

        this.canvas.addEventListener('pointerdown', onPointerDown);
        window.addEventListener('pointermove', onPointerMove);
        window.addEventListener('pointerup', onPointerUp);
        window.addEventListener('pointercancel', onPointerUp);
        this.canvas.addEventListener('wheel', onWheel, { passive: false });
        this.canvas.addEventListener('contextmenu', (e) => e.preventDefault());

        window.addEventListener('resize', () => {
          this.width = window.innerWidth;
          this.height = window.innerHeight;
          this.camera.aspect = this.width / this.height;
          this.camera.updateProjectionMatrix();
          this.renderer.setSize(this.width, this.height);
        });

        // Hide / Show all UI with 'H' key
        let uiVisible = true;
        window.addEventListener('keydown', (e) => {
          if (e.code === 'KeyH' || e.key === 'h' || e.key === 'H') {
            uiVisible = !uiVisible;
            if (this.gui) {
              this.gui.show(uiVisible);
            }
          }
        });
      }

      setupGui() {
        this.gui = new GUI({ title: 'Kinetic Labyrinth Settings' });

        // Procedural generator trigger
        this.gui.add(PARAMS, 'clickToRandomize').name('Click Scene Randomizes');
        this.gui.add(this, 'randomizeScene').name('🎲 Randomize Scene Now');

        // Folder: Colors & Theme
        const fColors = this.gui.addFolder('Colors & Themes');
        fColors.add(PARAMS, 'colorScheme', Object.keys(COLOR_SCHEMES))
          .name('Color Scheme (19)')
          .onChange((v) => this.applyColorScheme(v));

        fColors.add(PARAMS, 'greenScreen')
          .name('Green Screen (#00ff00)')
          .onChange((v) => {
            if (v) {
              savedCustomBg = PARAMS.backgroundColor;
              PARAMS.backgroundColor = '#00ff00';
            } else {
              PARAMS.backgroundColor = savedCustomBg || '#080810';
            }
            this.updateBackgroundColor();
            this.updateGuiDisplay();
          });

        fColors.addColor(PARAMS, 'backgroundColor')
          .name('Background Color')
          .onChange((v) => {
            PARAMS.greenScreen = (v.toLowerCase() === '#00ff00');
            savedCustomBg = v;
            this.updateBackgroundColor();
            this.updateGuiDisplay();
          });

        const fPalette = fColors.addFolder('Palette Colors (Editable)');
        fPalette.addColor(PARAMS, 'c1').name('Arc Tube Color 1').onChange(() => this.updateMaterials());
        fPalette.addColor(PARAMS, 'c2').name('Arc Tube Color 2').onChange(() => this.updateMaterials());
        fPalette.addColor(PARAMS, 'c3').name('Joint Beads Color').onChange(() => this.updateMaterials());
        fPalette.addColor(PARAMS, 'c4').name('Accent Color').onChange(() => this.updateMaterials());
        fPalette.addColor(PARAMS, 'c5').name('Base Plate Color').onChange(() => this.updateMaterials());

        // Folder: Camera & Navigation
        const fCam = this.gui.addFolder('Camera & View');
        this.ctrlDist = fCam.add(PARAMS, 'camDistance', 1.0, 30.0, 0.1).name('Camera Distance / Zoom').onChange(() => this.updateCameraPosition());
        this.ctrlTheta = fCam.add(PARAMS, 'camTheta', -Math.PI * 2, Math.PI * 2, 0.01).name('Azimuth (Theta)').onChange(() => this.updateCameraPosition());
        this.ctrlPhi = fCam.add(PARAMS, 'camPhi', 0.05, Math.PI - 0.05, 0.01).name('Elevation (Phi)').onChange(() => this.updateCameraPosition());

        this.ctrlPanX = fCam.add(PARAMS, 'panX', -15.0, 15.0, 0.1).name('Pan X (Right / Shift Drag)').onChange((v) => {
          this.panTarget.x = v;
          this.gridGroup.position.copy(this.panTarget);
          this.updateCameraPosition();
        });
        this.ctrlPanY = fCam.add(PARAMS, 'panY', -15.0, 15.0, 0.1).name('Pan Y (Right / Shift Drag)').onChange((v) => {
          this.panTarget.y = v;
          this.gridGroup.position.copy(this.panTarget);
          this.updateCameraPosition();
        });
        this.ctrlPanZ = fCam.add(PARAMS, 'panZ', -15.0, 15.0, 0.1).name('Pan Z').onChange((v) => {
          this.panTarget.z = v;
          this.gridGroup.position.copy(this.panTarget);
          this.updateCameraPosition();
        });

        fCam.add(PARAMS, 'fov', 25, 90, 1).name('Field of View').onChange(() => {
          this.camera.fov = PARAMS.fov;
          this.camera.updateProjectionMatrix();
        });

        fCam.add(PARAMS, 'mouseAction', ['Rotate Camera', 'Drag Object Across Screen']).name('Left Mouse Action');

        fCam.add({
          resetView: () => {
            PARAMS.camDistance = 8.5;
            PARAMS.camTheta = 0.0;
            PARAMS.camPhi = Math.PI * 0.32;
            PARAMS.panX = 0.0;
            PARAMS.panY = 0.0;
            PARAMS.panZ = 0.0;
            this.panTarget.set(0, 0, 0);
            this.gridGroup.position.copy(this.panTarget);
            this.updateCameraPosition();
            this.updateGuiDisplay();
          }
        }, 'resetView').name('Reset Camera & Pan');

        // Folder: Animation & Motion
        const fAnim = this.gui.addFolder('Animation & Motion');
        fAnim.add(PARAMS, 'cameraAnimation', CAMERA_ANIMATIONS).name('Camera Animation (8)');
        fAnim.add(PARAMS, 'animationSpeed', 0.0, 3.0, 0.05).name('Global Speed');
        fAnim.add(PARAMS, 'rotationSpeed', 0.1, 3.0, 0.05).name('Tile Rotation Speed');
        fAnim.add(PARAMS, 'waveFreq', 0.05, 1.5, 0.02).name('Row Wave Frequency');
        fAnim.add(PARAMS, 'waveSpatial', 0.0, 1.0, 0.02).name('Diagonal Wave Spread');
        fAnim.add(PARAMS, 'waveZHeight', 0.0, 0.8, 0.02).name('3D Wave Height (Z)');

        // Folder: Geometry & Structure
        const fGeom = this.gui.addFolder('Geometry & Structure');
        fGeom.add(PARAMS, 'gridSize', 6, 24, 1).name('Grid Size (N x N)').onFinishChange(() => this.buildTruchetGrid());
        fGeom.add(PARAMS, 'tubeRadius', 0.02, 0.16, 0.005).name('Pipe Tube Radius').onFinishChange(() => this.buildTruchetGrid());
        fGeom.add(PARAMS, 'showJoints').name('Show Connector Beads').onChange(() => this.buildTruchetGrid());
        fGeom.add(PARAMS, 'showBasePlates').name('Show Base Plates').onChange(() => this.buildTruchetGrid());
        fGeom.add(PARAMS, 'metalness', 0.0, 1.0, 0.02).name('Metalness').onChange(() => this.updateMaterials());
        fGeom.add(PARAMS, 'roughness', 0.0, 1.0, 0.02).name('Roughness').onChange(() => this.updateMaterials());
        fGeom.add(PARAMS, 'clearcoat', 0.0, 1.0, 0.02).name('Clearcoat Shine').onChange(() => this.updateMaterials());
        fGeom.add({ reseed: () => this.buildTruchetGrid() }, 'reseed').name('Re-seed Tile Orientations');

        // Folder: Lighting & Exposure
        const fLight = this.gui.addFolder('Lighting & Exposure');
        fLight.add(PARAMS, 'exposure', 0.2, 3.0, 0.05).name('Scene Exposure').onChange(() => this.updateLights());
        fLight.add(PARAMS, 'masterLightIntensity', 0.1, 3.0, 0.05).name('Master Light Intensity').onChange(() => this.updateLights());

        const fL1 = fLight.addFolder('Key Light (Directional)');
        fL1.addColor(PARAMS, 'light1Color').name('Color').onChange(() => this.updateLights());
        fL1.add(PARAMS, 'light1Intensity', 0.0, 3.0, 0.05).name('Intensity').onChange(() => this.updateLights());
        fL1.add(PARAMS, 'light1PosX', -40, 40, 1).name('Pos X').onChange(() => this.updateLights());
        fL1.add(PARAMS, 'light1PosY', -40, 40, 1).name('Pos Y').onChange(() => this.updateLights());
        fL1.add(PARAMS, 'light1PosZ', -40, 40, 1).name('Pos Z').onChange(() => this.updateLights());

        const fL2 = fLight.addFolder('Fill Light (Point)');
        fL2.addColor(PARAMS, 'light2Color').name('Color').onChange(() => this.updateLights());
        fL2.add(PARAMS, 'light2Intensity', 0.0, 3.0, 0.05).name('Intensity').onChange(() => this.updateLights());
        fL2.add(PARAMS, 'light2PosX', -40, 40, 1).name('Pos X').onChange(() => this.updateLights());
        fL2.add(PARAMS, 'light2PosY', -40, 40, 1).name('Pos Y').onChange(() => this.updateLights());
        fL2.add(PARAMS, 'light2PosZ', -40, 40, 1).name('Pos Z').onChange(() => this.updateLights());

        const fAmb = fLight.addFolder('Ambient Light');
        fAmb.addColor(PARAMS, 'ambientColor').name('Color').onChange(() => this.updateLights());
        fAmb.add(PARAMS, 'ambientIntensity', 0.0, 2.0, 0.05).name('Intensity').onChange(() => this.updateLights());

        // Folder: Renderer & Performance
        const fRender = this.gui.addFolder('Renderer & Quality');
        fRender.add(PARAMS, 'dpr', 0.5, 3.0, 0.1).name('Pixel Ratio (DPR)').onChange((v) => {
          this.renderer.setPixelRatio(v);
          this.renderer.setSize(this.width, this.height);
        });
        fRender.add(PARAMS, 'antialias').name('Three.js Antialias').onChange(() => {
          this.initRenderer();
          this.setupEvents();
        });

        this.gui.open();
      }

      updateGuiDisplay() {
        if (this.gui) {
          this.gui.controllersRecursive().forEach((c) => c.updateDisplay());
        }
      }

      updateAnimation(dt) {
        this.animTime += dt * PARAMS.animationSpeed;
        const t = this.animTime;

        // 1. Camera Motion Animations (Smooth, slow, elegant)
        let dDist = 0;
        let dTheta = 0;
        let dPhi = 0;

        switch (PARAMS.cameraAnimation) {
          case 'Static (No Camera Move)':
            break;

          case 'Gentle Orbit (Slow 360°)':
            dTheta = t * 0.14;
            break;

          case 'Low Horizon Sweep':
            dTheta = t * 0.12;
            dPhi = (Math.PI * 0.38 - PARAMS.camPhi) + Math.sin(t * 0.22) * 0.08;
            break;

          case 'Breathing Dolly Glide':
            dTheta = Math.sin(t * 0.12) * 0.2;
            dDist = Math.sin(t * 0.3) * (PARAMS.camDistance * 0.15);
            break;

          case 'Slow Pitch & Roll Drift':
            dTheta = t * 0.1;
            dPhi = Math.sin(t * 0.24) * 0.12;
            break;

          case 'Figure-8 Smooth Flow':
            dTheta = Math.sin(t * 0.18) * 0.32;
            dPhi = Math.sin(t * 0.36) * 0.14;
            break;

          case 'Spiral Helix Orbit':
            dTheta = t * 0.16;
            dPhi = Math.sin(t * 0.16) * 0.18;
            dDist = Math.cos(t * 0.2) * (PARAMS.camDistance * 0.12);
            break;

          case 'Pendulum Arc Swing':
            dTheta = Math.sin(t * 0.2) * 0.45;
            dPhi = Math.cos(t * 0.2) * 0.06;
            break;
        }

        this.updateCameraPosition(dDist, dTheta, dPhi);

        // 2. Kinetic Tile Rotation Animation
        // Faithfully recreating the Truchet wave rotation: when sin(phase) < 0 it rotates smoothly row by row
        if (this.tiles) {
          const rotSpeed = PARAMS.rotationSpeed;
          const wFreq = PARAMS.waveFreq;
          const wSpat = PARAMS.waveSpatial;
          const zAmp = PARAMS.waveZHeight;

          for (let i = 0; i < this.tiles.length; i++) {
            const tile = this.tiles[i];
            const x = tile.gridX;
            const y = tile.gridY;

            const u = t * rotSpeed + y * wFreq + x * wSpat;

            let rotAngle = 0;
            if (Math.sin(u) < 0) {
              rotAngle = u;
            } else {
              const k = Math.floor(u / Math.PI);
              rotAngle = k * Math.PI;
            }

            tile.group.rotation.z = tile.baseRot + rotAngle;

            if (zAmp > 0.001) {
              tile.group.position.z = Math.sin(t * 1.5 + y * 0.4 + x * 0.4) * zAmp;
            } else {
              tile.group.position.z = 0;
            }
          }
        }
      }

      animate() {
        const dt = this.clock.getDelta();
        this.updateAnimation(dt);
        this.renderer.render(this.scene, this.camera);
        requestAnimationFrame(this.animate);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      new KineticApp();
    });
  </script>
</body>
