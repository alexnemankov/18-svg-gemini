  <script type="module">
    import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

    // ----------------------------------------------------
    // Vector & Utility Math Helpers
    // ----------------------------------------------------
    class Vector {
      constructor(x = 0, y = 0) {
        this.x = x;
        this.y = y;
      }
      set(x, y) {
        this.x = x;
        this.y = y;
        return this;
      }
      copy() {
        return new Vector(this.x, this.y);
      }
      add(v) {
        this.x += v.x;
        this.y += v.y;
        return this;
      }
      sub(v) {
        this.x -= v.x;
        this.y -= v.y;
        return this;
      }
      mult(n) {
        this.x *= n;
        this.y *= n;
        return this;
      }
      div(n) {
        if (n !== 0) {
          this.x /= n;
          this.y /= n;
        }
        return this;
      }
      mag() {
        return Math.hypot(this.x, this.y);
      }
      setMag(m) {
        let heading = (this.x === 0 && this.y === 0) ? 0 : Math.atan2(this.y, this.x);
        this.x = Math.cos(heading) * m;
        this.y = Math.sin(heading) * m;
        return this;
      }
      heading() {
        return Math.atan2(this.y, this.x);
      }
      setHeading(h) {
        let m = this.mag();
        if (m === 0) m = 1;
        this.x = Math.cos(h) * m;
        this.y = Math.sin(h) * m;
        return this;
      }
      dist(v) {
        return Math.hypot(this.x - v.x, this.y - v.y);
      }
      angle(v) {
        return Math.atan2(v.y - this.y, v.x - this.x);
      }
    }

    const Util = {
      random(min, max) {
        return Math.random() * (max - min) + min;
      },
      map(value, low1, high1, low2, high2) {
        if (high1 === low1) return low2;
        return low2 + (high2 - low2) * ((value - low1) / (high1 - low1));
      }
    };

    const Tween = {
      linear(t, b, c, d) {
        if (d === 0) return b + c;
        return c * (t / d) + b;
      }
    };

    function normalizeHex(hex) {
      if (!hex) return "#000000";
      hex = hex.replace(/#/g, "");
      if (hex.length === 3) {
        hex = hex[0] + hex[0] + hex[1] + hex[1] + hex[2] + hex[2];
      }
      return "#" + hex;
    }

    function lerpColor(a, b, amount) {
      amount = Math.max(0, Math.min(1, amount));
      const ah = parseInt(normalizeHex(a).replace(/#/g, ""), 16);
      const ar = (ah >> 16) & 0xff;
      const ag = (ah >> 8) & 0xff;
      const ab = ah & 0xff;

      const bh = parseInt(normalizeHex(b).replace(/#/g, ""), 16);
      const br = (bh >> 16) & 0xff;
      const bg = (bh >> 8) & 0xff;
      const bb = bh & 0xff;

      const rr = Math.round(ar + amount * (br - ar));
      const rg = Math.round(ag + amount * (bg - ag));
      const rb = Math.round(ab + amount * (bb - ab));

      return "#" + (((1 << 24) + (rr << 16) + (rg << 8) + rb) | 0).toString(16).slice(1);
    }

    // ----------------------------------------------------
    // Application Parameters
    // ----------------------------------------------------

      // Color Scheme

      // Grass Colors

      grassBottom: "#3c33c9",

      // Interaction

    // ----------------------------------------------------
    // Canvas & Context Setup
    // ----------------------------------------------------
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    let W = canvas.width = window.innerWidth;
    let H = canvas.height = window.innerHeight;
    ctx.lineCap = "round";

    // View Transformation (Pan & Zoom)
    const transform = {
      x: 0,
      y: 0,
      scale: 1
    };

    // Cursor position in world coordinates
    let cursor = new Vector(W / 2, H / 1.2);
    let gravity = new Vector(0, params.gravityY);

    // ----------------------------------------------------
    // Physics Classes: Point, Link, Hair
    // ----------------------------------------------------
    class Point {
      constructor(x, y) {
        this.position = new Vector(x, y);
        this.old_position = new Vector(x, y);
        this.pinned = false;
      }
    }

    class Link {
      constructor(p0, p1) {
        this.p0 = p0;
        this.p1 = p1;
        this.length = p0.position.dist(p1.position);
      }
    }

    class Hair {
      constructor(x, y, angle, length, divisions) {
        this.position = new Vector(x, y);
        this.angle = angle || 0;
        this.length = length || 100;
        this.divisions = divisions || 3;
        this.points = [];
        this.links = [];
        this.thickness = 2;
        this.stiffness = 0.2;
        this.start_color = "#000";
        this.color = "#000";
        this.contact_color = "#fff";

        for (let i = 0; i < divisions; i++) {
          let separation = (this.length / divisions) * i;
          let v = new Vector(0, 0);
          v.setMag(separation);
          v.setHeading(angle);
          v.add(this.position);
          this.points.push(new Point(v.x, v.y));
        }

        this.points[0].pinned = true;
        for (let i = 0; i < divisions - 1; i++) {
          this.links.push(new Link(this.points[i], this.points[i + 1]));
        }
      }

      update() {
        for (let i = 0; i < this.points.length; i++) {
          let point = this.points[i];
          if (point.pinned) continue;

          let velocity = point.position.copy();
          velocity.sub(point.old_position);
          velocity.mult(0.98);
          point.old_position = point.position.copy();
          point.position.add(velocity);

          let stiffFactor = i > 0 ? (this.stiffness / i) : this.stiffness;
          point.position.x += Math.cos(this.angle) * stiffFactor;
          point.position.y += Math.sin(this.angle) * stiffFactor;

          let distance = point.position.dist(cursor);
          if (distance < force_contact.size) {
            let force = new Vector();
            let angle = point.position.angle(cursor);
            force.setMag(Util.map(distance, 0, force_contact.size, 1.6, 0));
            force.setHeading(angle);
            point.position.sub(force);
          }

          point.position.add(wind.value);
          point.position.add(gravity);
        }

        for (let i = 0; i < this.links.length; i++) {
          let link = this.links[i];
          let distance = link.p0.position.dist(link.p1.position);
          if (distance === 0) continue;
          let difference = link.length - distance;
          let percent = difference / distance / 2;
          let offset = new Vector(
            (link.p1.position.x - link.p0.position.x) * percent,
            (link.p1.position.y - link.p0.position.y) * percent
          );
          if (!link.p0.pinned) link.p0.position.sub(offset);
          if (!link.p1.pinned) link.p1.position.add(offset);
        }
      }

      draw() {
        let distance = this.points[0].position.dist(cursor);
        if (distance < force_contact.size) {
          this.color = lerpColor(
            this.contact_color,
            this.start_color,
            Util.map(distance, 0, force_contact.size, 0, 1)
          );
        } else {
          this.color = this.start_color;
        }

        ctx.strokeStyle = this.color;
        ctx.lineWidth = this.thickness;
        ctx.beginPath();
        smooth(this.points);
        ctx.stroke();
      }
    }

    // ----------------------------------------------------
    // Land Field Manager
    // ----------------------------------------------------
    const land = {
      field: [],
      init() {
        this.field = [];
        const div = Math.max(16, params.spacing);
        const marginX = div * 2;
        const marginY = div * 2;

        for (let y = H + marginY; y >= -marginY; y -= div) {
          for (let x = W + marginX; x >= -marginX; x -= div) {
            let new_pos = new Vector(0, 0);
            if (Math.abs(y) % (div * 2) < div) {
              new_pos = new Vector(x, y);
            } else {
              new_pos = new Vector(x - (div / 2), y);
            }

            let g = new Hair(
              new_pos.x,
              new_pos.y,
              -Math.PI / 2,
              Util.random(params.minLen, params.maxLen),
              params.divisions
            );

            this.applyColorToHair(g, y);
            g.thickness = Util.random(params.minThickness, params.maxThickness);
            g.stiffness = Util.random(params.minStiffness, params.maxStiffness);
            this.field.unshift(g);
          }
        }
      },

      applyColorToHair(hair, y) {
        if (y < H / 1.2) {
          hair.color = lerpColor(
            params.grassMid,
            params.grassTop,
            Util.map(y, 0, H / 1.2, 1, 0)
          );
        } else {
          hair.color = lerpColor(
            params.grassBottom,
            params.grassMid,
            Util.map(y, H / 1.2, H, 1, 0)
          );
        }
        hair.contact_color = lerpColor(
          params.contactStart,
          params.contactEnd,
          Util.map(y, 0, H, 1, 0)
        );
        hair.start_color = hair.color;
      },

      updateColors() {
        for (let i = 0; i < this.field.length; i++) {
          const hair = this.field[i];
          this.applyColorToHair(hair, hair.position.y);
        }
      },

      update() {
        for (let i = 0; i < this.field.length; i++) {
          this.field[i].update();
        }
      },

      draw() {
        for (let i = 0; i < this.field.length; i++) {
          this.field[i].draw();
        }
      },

      render() {
        this.update();
        this.draw();
      }
    };

    // ----------------------------------------------------
    // Wind Simulation
    // ----------------------------------------------------
    const wind = {
      value: new Vector(0, 0),
      waiting: false,
      reset() {
        this.time_start = performance.now();
        this.start = this.value.x;
        this.duration = Util.random(200, 1000);
        this.goal = Util.random(-params.windStrength, params.windStrength);
        this.waiting = false;
      },
      update() {
        let time = performance.now() - this.time_start;
        if (time < this.duration) {
          this.value.x = Tween.linear(
            time,
            this.start,
            this.goal - this.start,
            this.duration
          );
        } else if (!this.waiting) {
          this.waiting = true;
          setTimeout(() => {
            this.reset();
          }, Util.random(100, 1500));
        }
      }
    };
    wind.reset();

    // ----------------------------------------------------
    // Force Contact (Repulsion Orb & Glow)
    // ----------------------------------------------------
    const force_contact = {
      size: 0,
      current: 0,
      update() {
        this.size = params.forceContactMin + Math.abs(params.forceContactAmp * Math.cos(this.current / params.forceContactPeriod));
        this.current += 1;

        if (this.size > 0) {
          let gradient = ctx.createRadialGradient(cursor.x, cursor.y, 0, cursor.x, cursor.y, this.size);
          const innerColor = lerpColor(
            params.orbStart,
            params.orbEnd,
            Util.map(cursor.y, 0, H, 1, 0)
          );
          gradient.addColorStop(0, innerColor);
          gradient.addColorStop(1, 'rgba(255,150,150,0)');

          ctx.fillStyle = gradient;
          ctx.fillRect(cursor.x - this.size, cursor.y - this.size, this.size * 2, this.size * 2);
        }
      }
    };

    // ----------------------------------------------------
    // Curve Smoothing Helper
    // ----------------------------------------------------
    function smooth(points) {
      if (points.length < 2) return;
      const p0 = points[0].position;
      ctx.moveTo(p0.x, p0.y);
      for (let i = 1; i < points.length - 2; i++) {
        const pi = points[i].position;
        const pi1 = points[i + 1].position;
        const xc = (pi.x + pi1.x) * 0.5;
        const yc = (pi.y + pi1.y) * 0.5;
        ctx.quadraticCurveTo(pi.x, pi.y, xc, yc);
      }
      if (points.length >= 3) {
        const pn2 = points[points.length - 2].position;
        const pn1 = points[points.length - 1].position;
        ctx.quadraticCurveTo(pn2.x, pn2.y, pn1.x, pn1.y);
      } else {
        const p1 = points[1].position;
        ctx.lineTo(p1.x, p1.y);
      }
    }

    // ----------------------------------------------------
    // Automatic Animation Path Generator
    // ----------------------------------------------------
    let animTime = 0;
    let lastTime = performance.now();

    function updateAutoAnimation(now) {
      const dt = (now - lastTime) / 1000;
      lastTime = now;

      if (!params.autoAnimation) return;

      animTime += dt * params.autoSpeed;
      const t = animTime;
      const cx = W / 2;
      const cy = H * 0.65;
      const rx = W * 0.38;
      const ry = H * 0.28;

      switch (params.motionPattern) {
        case 'Figure 8':
          cursor.x = cx + Math.sin(t * 1.5) * rx;
          cursor.y = cy + Math.sin(t * 3.0) * (ry * 0.7);
          break;
        case 'Lissajous':
          cursor.x = cx + Math.sin(t * 1.3) * rx + Math.cos(t * 2.7) * (rx * 0.25);
          cursor.y = cy + Math.cos(t * 1.9) * ry + Math.sin(t * 3.1) * (ry * 0.2);
          break;
        case 'Circular Wave':
          cursor.x = cx + Math.cos(t * 1.8) * (rx * 0.85);
          cursor.y = cy + Math.sin(t * 1.8) * (ry * 0.85) + Math.sin(t * 5.4) * (ry * 0.2);
          break;
        case 'Spiral Drift': {
          const r = (0.35 + 0.65 * Math.abs(Math.sin(t * 0.4))) * rx;
          cursor.x = cx + Math.cos(t * 2.1) * r;
          cursor.y = cy + Math.sin(t * 2.1) * (r * (ry / rx));
          break;
        }
        case 'Chaos Wander':
        default:
          cursor.x = cx + (Math.sin(t * 1.1) * 0.6 + Math.sin(t * 2.3) * 0.3 + Math.cos(t * 3.7) * 0.1) * rx;
          cursor.y = cy + (Math.cos(t * 0.9) * 0.6 + Math.cos(t * 2.1) * 0.3 + Math.sin(t * 4.3) * 0.1) * ry;
          break;
      }
    }

    // ----------------------------------------------------
    // Color Scheme Application
    // ----------------------------------------------------
    function applyScheme(schemeName) {
      const scheme = colorSchemes[schemeName];
      if (!scheme) return;

      params.scheme = schemeName;
      params.bgTop = scheme.bgTop;
      params.bgMid = scheme.bgMid;
      params.bgBottom = scheme.bgBottom;
      params.bgColor = scheme.bgTop;
      params.grassTop = scheme.grassTop;
      params.grassMid = scheme.grassMid;
      params.grassBottom = scheme.grassBottom;
      params.contactStart = scheme.contactStart;
      params.contactEnd = scheme.contactEnd;
      params.orbStart = scheme.orbStart;
      params.orbEnd = scheme.orbEnd;

      land.updateColors();
      updateGuiDisplays();
    }

    // ----------------------------------------------------
    // Procedural Theme & Parameter Randomization
    // ----------------------------------------------------
    function randomizeScene() {
      const schemeKeys = Object.keys(colorSchemes);
      const chosenScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      applyScheme(chosenScheme);

      // Re-roll motion & dynamic parameters
      params.autoSpeed = parseFloat(Util.random(0.6, 2.2).toFixed(2));
      const patterns = ['Figure 8', 'Lissajous', 'Circular Wave', 'Spiral Drift', 'Chaos Wander'];
      params.motionPattern = patterns[Math.floor(Math.random() * patterns.length)];

      params.gravityY = parseFloat(Util.random(-0.5, -0.15).toFixed(2));
      gravity.y = params.gravityY;
      params.windStrength = parseFloat(Util.random(0.15, 0.6).toFixed(2));
      params.forceContactMin = Math.round(Util.random(40, 85));
      params.forceContactAmp = Math.round(Util.random(60, 160));
      params.forceContactPeriod = Math.round(Util.random(50, 120));

      // Re-roll geometry parameters
      params.spacing = Math.round(Util.random(26, 42));
      params.minLen = Math.round(Util.random(80, 160));
      params.maxLen = Math.round(Util.random(220, 380));
      params.minThickness = Math.round(Util.random(6, 16));
      params.maxThickness = Math.round(Util.random(18, 40));
      params.minStiffness = parseFloat(Util.random(0.005, 0.05).toFixed(3));
      params.maxStiffness = parseFloat(Util.random(1.2, 3.0).toFixed(2));
      params.divisions = Math.round(Util.random(5, 7));

      land.init();
      updateGuiDisplays();
    }

    function updateGuiDisplays() {
      if (gui) {
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      }
    }

    // ----------------------------------------------------
    // lil-gui Setup
    // ----------------------------------------------------
    const gui = new GUI({ title: 'Controls' });

    // Presets
    gui.add(params, 'scheme', Object.keys(colorSchemes))
      .name('Color Scheme')
      .onChange(applyScheme);

    // Background Folder
    const fBackground = gui.addFolder('Background');
    fBackground.add(params, 'greenscreen').name('Greenscreen (#00ff00)');
    fBackground.add(params, 'bgMode', ['Gradient', 'Solid']).name('Background Mode');
    fBackground.addColor(params, 'bgColor').name('Solid Color');
    fBackground.addColor(params, 'bgTop').name('Gradient Top');
    fBackground.addColor(params, 'bgMid').name('Gradient Mid');
    fBackground.addColor(params, 'bgBottom').name('Gradient Bottom');

    // Grass & Flare Colors Folder
    const fColors = gui.addFolder('Colors');
    fColors.addColor(params, 'grassTop').name('Grass Tip').onChange(() => land.updateColors());
    fColors.addColor(params, 'grassMid').name('Grass Mid').onChange(() => land.updateColors());
    fColors.addColor(params, 'grassBottom').name('Grass Root').onChange(() => land.updateColors());
    fColors.addColor(params, 'contactStart').name('Flare Color 1').onChange(() => land.updateColors());
    fColors.addColor(params, 'contactEnd').name('Flare Color 2').onChange(() => land.updateColors());
    fColors.addColor(params, 'orbStart').name('Orb Core').onChange(() => land.updateColors());
    fColors.addColor(params, 'orbEnd').name('Orb Glow').onChange(() => land.updateColors());

    // Dynamics & Motion Folder
    const fDynamics = gui.addFolder('Dynamics & Motion');
    fDynamics.add(params, 'autoAnimation').name('Auto Animation');
    fDynamics.add(params, 'autoSpeed', 0.1, 4.0, 0.05).name('Auto Speed');
    fDynamics.add(params, 'motionPattern', ['Figure 8', 'Lissajous', 'Circular Wave', 'Spiral Drift', 'Chaos Wander']).name('Pattern');
    fDynamics.add(params, 'gravityY', -1.5, 0.5, 0.02).name('Buoyancy / Gravity').onChange(v => gravity.y = v);
    fDynamics.add(params, 'windStrength', 0.0, 1.5, 0.05).name('Wind Strength');
    fDynamics.add(params, 'forceContactMin', 20, 150, 2).name('Contact Min');
    fDynamics.add(params, 'forceContactAmp', 10, 250, 5).name('Contact Amplitude');
    fDynamics.add(params, 'forceContactPeriod', 20, 200, 2).name('Contact Period');

    // Geometry Folder
    const fGeometry = gui.addFolder('Geometry');
    fGeometry.add(params, 'spacing', 18, 60, 2).name('Spacing (Density)').onFinishChange(() => land.init());
    fGeometry.add(params, 'minLen', 40, 250, 5).name('Min Length').onFinishChange(() => land.init());
    fGeometry.add(params, 'maxLen', 150, 500, 10).name('Max Length').onFinishChange(() => land.init());
    fGeometry.add(params, 'divisions', 3, 10, 1).name('Divisions').onFinishChange(() => land.init());
    fGeometry.add(params, 'minThickness', 2, 25, 1).name('Min Thickness').onFinishChange(() => land.init());
    fGeometry.add(params, 'maxThickness', 10, 60, 1).name('Max Thickness').onFinishChange(() => land.init());
    fGeometry.add(params, 'minStiffness', 0.001, 0.1, 0.002).name('Min Stiffness').onFinishChange(() => land.init());
    fGeometry.add(params, 'maxStiffness', 0.5, 5.0, 0.1).name('Max Stiffness').onFinishChange(() => land.init());

    // Interaction Folder
    const fInteraction = gui.addFolder('Interaction');
    fInteraction.add(params, 'randomizeOnClick').name('Randomize on Click');
    fInteraction.add(params, 'randomizeNow').name('Randomize Scene Now');
    fInteraction.add(params, 'resetTransform').name('Reset View (Pan/Zoom)');

    // ----------------------------------------------------
    // Hide / Show UI with "H" key
    // ----------------------------------------------------
    let guiVisible = true;
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key === 'h' || e.key === 'H') {
        guiVisible = !guiVisible;
        if (guiVisible) {
          gui.show();
        } else {
          gui.hide();
        }
      }
    });

    // ----------------------------------------------------
    // Zoom & Pan Handlers
    // ----------------------------------------------------
    window.addEventListener('wheel', (e) => {
      if (e.target.closest('.lil-gui')) return;
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
      const mouseX = e.clientX;
      const mouseY = e.clientY;

      const newScale = Math.max(0.15, Math.min(transform.scale * zoomFactor, 12));
      transform.x = mouseX - (mouseX - transform.x) * (newScale / transform.scale);
      transform.y = mouseY - (mouseY - transform.y) * (newScale / transform.scale);
      transform.scale = newScale;
    }, { passive: false });

    let isPointerDown = false;
    let startPointerX = 0;
    let startPointerY = 0;
    let dragStartX = 0;
    let dragStartY = 0;
    let isDragging = false;

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.lil-gui')) return;
      isPointerDown = true;
      isDragging = false;
      startPointerX = e.clientX;
      startPointerY = e.clientY;
      dragStartX = e.clientX - transform.x;
      dragStartY = e.clientY - transform.y;
    });

    window.addEventListener('pointermove', (e) => {
      if (isPointerDown) {
        const dist = Math.hypot(e.clientX - startPointerX, e.clientY - startPointerY);
        if (dist > 5) {
          isDragging = true;
          transform.x = e.clientX - dragStartX;
          transform.y = e.clientY - dragStartY;
        }
      }

      // If user disabled auto animation, mouse pointer directly drives cursor in world space
      if (!params.autoAnimation) {
        cursor.x = (e.clientX - transform.x) / transform.scale;
        cursor.y = (e.clientY - transform.y) / transform.scale;
      }
    });

    window.addEventListener('pointerup', (e) => {
      if (!isPointerDown) return;
      isPointerDown = false;
      if (!isDragging) {
        // Genuine scene click without dragging
        if (params.randomizeOnClick) {
          randomizeScene();
        }
      }
      isDragging = false;
    });

    // ----------------------------------------------------
    // Window Resize Handler
    // ----------------------------------------------------
    window.addEventListener('resize', () => {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
      land.init();
    });

    // Initialize Land field
    land.init();

    // ----------------------------------------------------
    // Main Render Loop
    // ----------------------------------------------------
    function loop(now) {
      updateAutoAnimation(now);

      // Render Background
      if (params.greenscreen) {
        ctx.fillStyle = "#00ff00";
        ctx.fillRect(0, 0, W, H);
      } else if (params.bgMode === "Solid") {
        ctx.fillStyle = params.bgColor;
        ctx.fillRect(0, 0, W, H);
      } else {
        const grad = ctx.createLinearGradient(0, 0, 0, H);
        grad.addColorStop(0, params.bgTop);
        grad.addColorStop(0.8, params.bgMid);
        grad.addColorStop(1, params.bgBottom);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);
      }

      // Update simulation dynamics
      wind.update();

      // Apply zoom and pan transformations to objects
      ctx.save();
      ctx.translate(transform.x, transform.y);
      ctx.scale(transform.scale, transform.scale);

      // Render force contact orb and waving grass
      force_contact.update();
      land.render();

      ctx.restore();

      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
