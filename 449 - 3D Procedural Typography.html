  <script id="vertex" type="x-shader/x-vertex">
    varying vec2 vUv;
    varying vec3 vNormal;
    varying vec3 vViewPosition;
    varying vec3 vWorldPosition;

    void main() {
      vUv = uv;
      vNormal = normalize(normalMatrix * normal);
      vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
      vViewPosition = -mvPosition.xyz;
      vWorldPosition = (modelMatrix * vec4(position, 1.0)).xyz;
      gl_Position = projectionMatrix * mvPosition;
    }
  </script>

  <script id="fragment" type="x-shader/x-fragment">
    #ifdef GL_ES
    precision highp float;
    #endif

    uniform vec2 u_resolution;
    uniform float u_time;
    uniform vec3 u_colorA;
    uniform vec3 u_colorB;
    uniform vec3 u_colorC;
    uniform float u_noiseScale;
    uniform float u_timeSpeed;
    uniform float u_isOriginal;
    uniform int u_coordMode;
    uniform float u_shadingMix;
    uniform float u_exposure;

    // Lighting uniforms
    uniform vec3 u_ambientColor;
    uniform float u_ambientIntensity;
    uniform vec3 u_keyLightColor;
    uniform vec3 u_keyLightDir;
    uniform float u_keyLightIntensity;
    uniform vec3 u_pointLightPos;
    uniform vec3 u_pointLightColor;
    uniform float u_pointLightIntensity;
    uniform float u_pointLightDistance;
    uniform vec3 u_rimLightColor;
    uniform float u_rimLightIntensity;

    varying vec2 vUv;
    varying vec3 vNormal;
    varying vec3 vViewPosition;
    varying vec3 vWorldPosition;

    vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
    vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
    vec3 permute(vec3 x) { return mod289(((x * 34.0) + 1.0) * x); }

    float snoise(vec2 v) {
      const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
      vec2 i = floor(v + dot(v, C.yy));
      vec2 x0 = v - i + dot(i, C.xx);
      vec2 i1;
      i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
      vec4 x12 = x0.xyxy + C.xxzz;
      x12.xy -= i1;
      i = mod289(i);
      vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0)) + i.x + vec3(0.0, i1.x, 1.0));

      vec3 m = max(0.5 - vec3(dot(x0, x0), dot(x12.xy, x12.xy), dot(x12.zw, x12.zw)), 0.0);
      m = m * m;
      m = m * m;
      vec3 x = 2.0 * fract(p * C.www) - 1.0;
      vec3 h = abs(x) - 0.5;
      vec3 ox = floor(x + 0.5);
      vec3 a0 = x - ox;
      m *= 1.79284291400159 - 0.85373472095314 * (a0 * a0 + h * h);
      vec3 g;
      g.x = a0.x * x0.x + h.x * x0.y;
      g.yz = a0.yz * x12.xz + h.yz * x12.yw;
      return 180.0 * dot(m, g);
    }

    void main() {
      vec2 pos;
      if (u_coordMode == 1) {
        // World Space coordinates
        pos = vWorldPosition.xy * u_noiseScale * 3.5;
      } else if (u_coordMode == 2) {
        // UV Space coordinates
        pos = vUv * u_noiseScale;
      } else {
        // Screen Space coordinates (Original)
        vec2 st = gl_FragCoord.xy / u_resolution.xy;
        st.x *= u_resolution.x / u_resolution.y;
        pos = st * u_noiseScale;
      }

      float DF = 0.0;
      vec2 vel = vec2(u_time * u_timeSpeed);
      DF += snoise(pos + vel) * 0.1 + 0.3;
      vel = vec2(sin(0.8), sin(0.8));
      DF += snoise(pos + vel) * 0.25 + 0.25;

      float f = fract(DF);
      float wave = smoothstep(0.70, 0.75, f);

      vec3 basePattern;
      if (u_isOriginal > 0.5) {
        vec3 origColor = vec3(wave, 0.59, 0.28);
        basePattern = 1.0 - origColor;
      } else {
        vec3 col = mix(u_colorA, u_colorB, wave);
        float edge = smoothstep(0.68, 0.72, f) * (1.0 - smoothstep(0.73, 0.77, f));
        basePattern = mix(col, u_colorC, edge * 0.85);
      }

      // 3D Lighting calculation
      vec3 N = normalize(vNormal);
      if (!gl_FrontFacing) N = -N;
      vec3 V = normalize(vViewPosition);

      // Key Directional Light
      vec3 L_key = normalize(u_keyLightDir);
      float diff_key = max(dot(N, L_key), 0.0);
      vec3 H_key = normalize(L_key + V);
      float spec_key = pow(max(dot(N, H_key), 0.0), 32.0);
      vec3 keyIllum = u_keyLightColor * (diff_key * 0.85 + spec_key * 0.45) * u_keyLightIntensity;

      // Ambient Light
      vec3 ambIllum = u_ambientColor * u_ambientIntensity;

      // Point Light
      vec3 lightVec = u_pointLightPos - vWorldPosition;
      float dist = length(lightVec);
      vec3 L_point = normalize(lightVec);
      float atten = 1.0 / (1.0 + (dist / u_pointLightDistance) * (dist / u_pointLightDistance));
      float diff_point = max(dot(N, L_point), 0.0);
      vec3 H_point = normalize(L_point + V);
      float spec_point = pow(max(dot(N, H_point), 0.0), 24.0);
      vec3 pointIllum = u_pointLightColor * (diff_point + spec_point * 0.45) * atten * u_pointLightIntensity;

      // Rim / Edge Back Light
      float rim = 1.0 - max(dot(N, V), 0.0);
      rim = smoothstep(0.4, 0.95, rim);
      vec3 rimIllum = u_rimLightColor * rim * u_rimLightIntensity;

      vec3 totalLight = ambIllum + keyIllum + pointIllum + rimIllum;

      // Composite base groovy pattern with lighting
      vec3 shadedColor = basePattern * totalLight + (spec_key * u_keyLightColor + spec_point * u_pointLightColor) * 0.35;
      vec3 finalColor = mix(basePattern, shadedColor, u_shadingMix);

      // Apply exposure
      finalColor *= u_exposure;

      gl_FragColor = vec4(finalColor, 1.0);
    }
  </script>

    function updateBackground() {
      if (params.greenscreen) {
        document.body.style.backgroundColor = '#00ff00';
        document.body.style.backgroundImage = 'none';
        renderer.setClearColor(0x00ff00, 1.0);
      } else {
        document.body.style.backgroundColor = params.bgColor;
        document.body.style.backgroundImage = getSvgPatternUrl(params.stripeColor);
        document.body.style.backgroundSize = '220px 220px';
        document.body.style.backgroundRepeat = 'repeat';
        renderer.setClearColor(0x000000, 0.0);
      }
    }

      renderer.setPixelRatio(params.pixelRatio);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = params.exposure;
      wrapper.appendChild(renderer.domElement);

      // Setup scene
      scene = new THREE.Scene();

      // Setup camera (Framed for initial view)
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.05, 100);
      camera.position.set(0, 0, 1.2);

      // Setup OrbitControls with screen space panning and wheel zoom
      setupControls();

      // Setup Lights
      setupLights();

      // Setup Shader Material
      setupShaderMaterial();

      // Groups
      objectGroup = new THREE.Group();
      typoGroup = new THREE.Group();
      objectGroup.add(typoGroup);
      scene.add(objectGroup);

      // Update background and renderer clear state
      updateBackground();

      // Setup GUI
      setupGui();

      // Setup Events
      setupEventListeners(renderer.domElement);

      // Load font and generate typography
      await initFont();

      // Start render loop
      requestAnimationFrame(render);
    }

    // =========================================================================
    // CONTROLS & CAMERA SYSTEM
    // Wheel zoom & pan drag are preserved during camera animations
    // =========================================================================
    function setupControls() {
      if (controls) controls.dispose();

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.screenSpacePanning = true; // Drag object across screen
      controls.minDistance = 0.15;
      controls.maxDistance = 25.0;

      updateMouseButtons();

      controls.addEventListener('start', () => {
        isPointerDown = true;
      });
      controls.addEventListener('end', () => {
        isPointerDown = false;
      });
    }

    function updateMouseButtons() {
      if (params.leftClickAction === 'Drag (Pan)') {
        controls.mouseButtons = {
          LEFT: THREE.MOUSE.PAN,
          MIDDLE: THREE.MOUSE.DOLLY,
          RIGHT: THREE.MOUSE.ROTATE
        };
      } else {
        controls.mouseButtons = {
          LEFT: THREE.MOUSE.ROTATE,
          MIDDLE: THREE.MOUSE.DOLLY,
          RIGHT: THREE.MOUSE.PAN
        };
      }
    }

    function resetCameraView() {
      controls.reset();
      camera.position.set(0, 0, 1.2);
      controls.target.set(0, 0, 0);
      controls.update();
    }

    // =========================================================================
    // LIGHTING SYSTEM
    // =========================================================================
    function setupLights() {
      ambientLight = new THREE.AmbientLight(params.ambientColor, params.ambientIntensity);
      scene.add(ambientLight);

      keyLight = new THREE.DirectionalLight(params.keyLightColor, params.keyLightIntensity);
      keyLight.position.set(params.keyLightX, params.keyLightY, params.keyLightZ);
      scene.add(keyLight);

      pointLight = new THREE.PointLight(params.pointLightColor, params.pointLightIntensity, params.pointLightDistance, 1.5);
      pointLight.position.set(params.pointLightX, params.pointLightY, params.pointLightZ);
      scene.add(pointLight);

      rimLight = new THREE.DirectionalLight(params.rimLightColor, params.rimLightIntensity);
      rimLight.position.set(-150, -100, -150);
      scene.add(rimLight);
    }

    function updateLights() {
      const master = params.sceneLightIntensity;

      ambientLight.intensity = params.ambientIntensity * master;
      ambientLight.color.set(params.ambientColor);
      uniforms.u_ambientIntensity.value = ambientLight.intensity;
      uniforms.u_ambientColor.value.copy(ambientLight.color);

      keyLight.intensity = params.keyLightIntensity * master;
      keyLight.color.set(params.keyLightColor);
      keyLight.position.set(params.keyLightX, params.keyLightY, params.keyLightZ);
      uniforms.u_keyLightIntensity.value = keyLight.intensity;
      uniforms.u_keyLightColor.value.copy(keyLight.color);
      uniforms.u_keyLightDir.value.copy(keyLight.position).normalize();

      pointLight.intensity = params.pointLightIntensity * master;
      pointLight.color.set(params.pointLightColor);
      pointLight.position.set(params.pointLightX, params.pointLightY, params.pointLightZ);
      pointLight.distance = params.pointLightDistance;
      uniforms.u_pointLightIntensity.value = pointLight.intensity;
      uniforms.u_pointLightColor.value.copy(pointLight.color);
      uniforms.u_pointLightPos.value.copy(pointLight.position);
      uniforms.u_pointLightDistance.value = pointLight.distance;

      rimLight.intensity = params.rimLightIntensity * master;
      rimLight.color.set(params.rimLightColor);
      uniforms.u_rimLightIntensity.value = rimLight.intensity;
      uniforms.u_rimLightColor.value.copy(rimLight.color);
    }

    // =========================================================================
    // SHADER MATERIAL & UNIFORMS
    // =========================================================================
    function setupShaderMaterial() {
      uniforms = {
        u_time: { value: 1.0 },
        u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
        u_colorA: { value: new THREE.Color(params.colorA) },
        u_colorB: { value: new THREE.Color(params.colorB) },
        u_colorC: { value: new THREE.Color(params.colorC) },
        u_noiseScale: { value: params.noiseScale },
        u_timeSpeed: { value: params.noiseSpeed },
        u_isOriginal: { value: params.useOriginalFormula ? 1.0 : 0.0 },
        u_coordMode: { value: 0 },
        u_shadingMix: { value: params.shadingMix },
        u_exposure: { value: params.exposure },

        u_ambientColor: { value: new THREE.Color(params.ambientColor) },
        u_ambientIntensity: { value: params.ambientIntensity },
        u_keyLightColor: { value: new THREE.Color(params.keyLightColor) },
        u_keyLightDir: { value: new THREE.Vector3(params.keyLightX, params.keyLightY, params.keyLightZ).normalize() },
        u_keyLightIntensity: { value: params.keyLightIntensity },
        u_pointLightPos: { value: new THREE.Vector3(params.pointLightX, params.pointLightY, params.pointLightZ) },
        u_pointLightColor: { value: new THREE.Color(params.pointLightColor) },
        u_pointLightIntensity: { value: params.pointLightIntensity },
        u_pointLightDistance: { value: params.pointLightDistance },
        u_rimLightColor: { value: new THREE.Color(params.rimLightColor) },
        u_rimLightIntensity: { value: params.rimLightIntensity }
      };

      const vertexShader = document.getElementById('vertex').textContent;
      const fragmentShader = document.getElementById('fragment').textContent;

      shaderMaterial = new THREE.ShaderMaterial({
        uniforms,
        vertexShader,
        fragmentShader,
        side: THREE.DoubleSide
      });
    }

    function updateUniformColors() {
      uniforms.u_colorA.value.set(params.colorA);
      uniforms.u_colorB.value.set(params.colorB);
      uniforms.u_colorC.value.set(params.colorC);
      uniforms.u_isOriginal.value = params.useOriginalFormula ? 1.0 : 0.0;
    }

    function updateCoordMode() {
      if (params.coordMode === 'World / 3D Space') {
        uniforms.u_coordMode.value = 1;
      } else if (params.coordMode === 'UV Surface') {
        uniforms.u_coordMode.value = 2;
      } else {
        uniforms.u_coordMode.value = 0;
      }
    }

    // =========================================================================
    // FONT LOADING & TYPOGRAPHY GENERATOR
    // =========================================================================
    async function initFont() {
      const fontUrls = [
        'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/fonts/helvetiker_bold.typeface.json',
        'https://unpkg.com/three@0.160.0/examples/fonts/helvetiker_bold.typeface.json',
        'https://threejs.org/examples/fonts/helvetiker_bold.typeface.json'
      ];

      const loader = new FontLoader();
      for (const url of fontUrls) {
        try {
          const res = await fetch(url);
          if (res.ok) {
            const fontData = await res.json();
            loadedFont = loader.parse(fontData);
            buildTypography();
            return;
          }
        } catch (err) {
          console.warn('Font CDN failed:', url, err);
        }
      }

      console.error('All font CDNs failed to load helvetiker_bold font.');
    }

    function buildTypography() {
      if (!loadedFont) return;

      if (textMesh) {
        typoGroup.remove(textMesh);
        if (textMesh.geometry) textMesh.geometry.dispose();
      }

      const textStr = (params.text && params.text.length > 0) ? params.text : ' ';

      const geom = new TextGeometry(textStr, {
        font: loadedFont,
        size: params.textSize,
        height: params.textDepth,
        curveSegments: 12,
        bevelEnabled: params.bevelEnabled,
        bevelThickness: params.bevelThickness,
        bevelSize: params.bevelSize,
        bevelOffset: 0,
        bevelSegments: 4
      });

      // Center geometry around (0,0,0)
      geom.computeBoundingBox();
      const center = new THREE.Vector3();
      geom.boundingBox.getCenter(center);
      geom.translate(-center.x, -center.y, -center.z);
      geom.computeVertexNormals();

      textMesh = new THREE.Mesh(geom, shaderMaterial);
      typoGroup.add(textMesh);
    }

    // =========================================================================
    // COLOR PALETTE SELECTION
    // =========================================================================
    function applyScheme(schemeKey) {
      params.colorScheme = schemeKey;
      const s = SCHEMES[schemeKey];
      if (!s) return;

      params.bgColor = s.bg;
      params.stripeColor = s.stripe;
      params.colorA = s.colorA;
      params.colorB = s.colorB;
      params.colorC = s.colorC;
      params.useOriginalFormula = !!s.isOriginal;

      if (s.ambientColor) params.ambientColor = s.ambientColor;
      if (s.keyLightColor) params.keyLightColor = s.keyLightColor;
      if (s.pointLightColor) params.pointLightColor = s.pointLightColor;
      if (s.rimLightColor) params.rimLightColor = s.rimLightColor;

      updateUniformColors();
      updateBackground();
      updateLights();

      if (gui) {
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      }
    }

    // =========================================================================
    // PROCEDURAL RANDOMIZATION (CLICK & BUTTON)
    // =========================================================================
    function randomizeScene() {
      // Pick random scheme
      const schemeKeys = Object.keys(SCHEMES);
      const chosenScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      applyScheme(chosenScheme);

      // Randomize animation
      const animChoices = ANIMATIONS.filter(a => a !== 'Static (No Movement)');
      params.animation = animChoices[Math.floor(Math.random() * animChoices.length)];

      // Randomize parameters
      params.animSpeed = parseFloat((0.6 + Math.random() * 1.2).toFixed(2));
      params.noiseScale = parseFloat((7.0 + Math.random() * 15.0).toFixed(1));
      uniforms.u_noiseScale.value = params.noiseScale;

      params.textDepth = parseFloat((0.03 + Math.random() * 0.14).toFixed(3));
      params.bevelEnabled = Math.random() > 0.25;
      params.shadingMix = parseFloat((0.2 + Math.random() * 0.45).toFixed(2));
      uniforms.u_shadingMix.value = params.shadingMix;

      params.exposure = parseFloat((0.85 + Math.random() * 0.4).toFixed(2));
      renderer.toneMappingExposure = params.exposure;
      uniforms.u_exposure.value = params.exposure;

      // Rebuild typography
      buildTypography();

      // Update GUI controllers
      if (gui) {
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      }
    }

    // =========================================================================
    // REBUILD RENDERER (ANTIALIASING TOGGLE)
    // =========================================================================
    function rebuildRenderer() {
      const oldCanvas = renderer.domElement;
      const parent = oldCanvas.parentNode;

      renderer.dispose();

      renderer = new THREE.WebGLRenderer({
        alpha: true,
        antialias: params.antialias,
        powerPreference: 'high-performance'
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(params.pixelRatio);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = params.exposure;

      parent.replaceChild(renderer.domElement, oldCanvas);

      setupControls();
      setupEventListeners(renderer.domElement);
      updateBackground();
      updateUniforms();
    }

    // =========================================================================
    // EVENTS SETUP
    // =========================================================================
    function setupEventListeners(domElement) {
      domElement.addEventListener('pointerdown', (e) => {
        pointerDownPos.x = e.clientX;
        pointerDownPos.y = e.clientY;
        pointerDownTime = performance.now();
      });

      domElement.addEventListener('pointerup', (e) => {
        const dt = performance.now() - pointerDownTime;
        const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);

        // Intentional click detection (dist < 6px, time < 350ms)
        if (dist < 6 && dt < 350) {
          if (params.randomizeOnClick) {
            randomizeScene();
          }
        }
      });

      window.addEventListener('pointermove', (e) => {
        if (params.interactiveHoverTilt && !isPointerDown) {
          const mx = (e.clientX / window.innerWidth) * 2 - 1;
          const my = -(e.clientY / window.innerHeight) * 2 + 1;
          targetTiltX = my * 0.25;
          targetTiltY = -mx * 0.25;
        }
      });
    }

    function updateUniforms() {
      renderer.setSize(window.innerWidth, window.innerHeight);
      uniforms.u_resolution.value.x = renderer.domElement.width;
      uniforms.u_resolution.value.y = renderer.domElement.height;
    }

    function onWindowResize() {
      updateUniforms();
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', onWindowResize);

    // Press 'H' to toggle UI visibility (ignores when typing in input)
    window.addEventListener('keydown', (e) => {
      if (['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName)) return;
      if (e.key === 'h' || e.key === 'H') {
        guiVisible = !guiVisible;
        if (guiVisible) {
          gui.show();
        } else {
          gui.hide();
        }
      }
    });

    // =========================================================================
    // LIL-GUI CONTROL PANEL
    // =========================================================================
    function setupGui() {
      gui = new GUI({ title: 'Roar Typo Controls' });

      // Typography Folder
      const typoFolder = gui.addFolder('Typography & Geometry');
      typoFolder.add(params, 'text').name('Text').onChange(() => buildTypography());
      typoFolder.add(params, 'textSize', 0.1, 1.0, 0.02).name('Font Size').onChange(() => buildTypography());
      typoFolder.add(params, 'textDepth', 0.0, 0.4, 0.01).name('Extrusion Depth').onChange(() => buildTypography());
      typoFolder.add(params, 'bevelEnabled').name('Bevel Enabled').onChange(() => buildTypography());
      typoFolder.add(params, 'bevelThickness', 0.001, 0.05, 0.001).name('Bevel Thickness').onChange(() => buildTypography());
      typoFolder.add(params, 'bevelSize', 0.001, 0.04, 0.001).name('Bevel Size').onChange(() => buildTypography());

      // Color & Palette Folder
      const colorFolder = gui.addFolder('Color & Themes');
      colorFolder.add(params, 'colorScheme', Object.keys(SCHEMES)).name('Color Scheme').onChange(applyScheme);
      colorFolder.add(params, 'greenscreen').name('Greenscreen (#00ff00)').onChange(updateBackground);
      colorFolder.addColor(params, 'bgColor').name('Background Color').onChange(() => {
        updateBackground();
      });
      colorFolder.addColor(params, 'stripeColor').name('Stripe Color').onChange(() => {
        updateBackground();
      });
      colorFolder.addColor(params, 'colorA').name('Groovy Primary').onChange(updateUniformColors);
      colorFolder.addColor(params, 'colorB').name('Groovy Secondary').onChange(updateUniformColors);
      colorFolder.addColor(params, 'colorC').name('Groovy Accent').onChange(updateUniformColors);
      colorFolder.add(params, 'useOriginalFormula').name('Original Shader Math').onChange(updateUniformColors);

      // Animation & Motion Folder
      const animFolder = gui.addFolder('Animation & Motion');
      animFolder.add(params, 'animation', ANIMATIONS).name('Camera / Motion Preset');
      animFolder.add(params, 'animSpeed', 0.0, 3.0, 0.05).name('Animation Speed');
      animFolder.add(params, 'noiseScale', 2.0, 30.0, 0.5).name('Noise Scale').onChange(v => {
        uniforms.u_noiseScale.value = v;
      });
      animFolder.add(params, 'noiseSpeed', 0.0, 1.0, 0.01).name('Wave Velocity').onChange(v => {
        uniforms.u_timeSpeed.value = v;
      });

      // Navigation & Camera Folder
      const navFolder = gui.addFolder('Navigation & Camera');
      navFolder.add(params, 'leftClickAction', ['Orbit (Rotate)', 'Drag (Pan)']).name('Left Mouse Action').onChange(updateMouseButtons);
      navFolder.add(params, 'interactiveHoverTilt').name('Interactive Cursor Tilt');
      navFolder.add(params, 'resetView').name('Reset Camera View');

      // Lighting & Exposure Folder
      const lightFolder = gui.addFolder('Lighting & Exposure');
      lightFolder.add(params, 'exposure', 0.1, 3.0, 0.05).name('Exposure').onChange(v => {
        renderer.toneMappingExposure = v;
        uniforms.u_exposure.value = v;
      });
      lightFolder.add(params, 'sceneLightIntensity', 0.0, 3.0, 0.05).name('Scene Light Intensity').onChange(updateLights);
      lightFolder.add(params, 'shadingMix', 0.0, 1.0, 0.05).name('3D Shading Mix').onChange(v => {
        uniforms.u_shadingMix.value = v;
      });

      const ambFolder = lightFolder.addFolder('Ambient Light');
      ambFolder.add(params, 'ambientIntensity', 0.0, 2.0, 0.05).name('Intensity').onChange(updateLights);
      ambFolder.addColor(params, 'ambientColor').name('Color').onChange(updateLights);
      ambFolder.close();

      const keyFolder = lightFolder.addFolder('Key Directional Light');
      keyFolder.add(params, 'keyLightIntensity', 0.0, 3.0, 0.05).name('Intensity').onChange(updateLights);
      keyFolder.addColor(params, 'keyLightColor').name('Color').onChange(updateLights);
      keyFolder.add(params, 'keyLightX', -500, 500, 10).name('Pos X').onChange(updateLights);
      keyFolder.add(params, 'keyLightY', -500, 500, 10).name('Pos Y').onChange(updateLights);
      keyFolder.add(params, 'keyLightZ', -500, 500, 10).name('Pos Z').onChange(updateLights);
      keyFolder.close();

      const ptFolder = lightFolder.addFolder('Point Light');
      ptFolder.add(params, 'pointLightIntensity', 0.0, 4.0, 0.05).name('Intensity').onChange(updateLights);
      ptFolder.addColor(params, 'pointLightColor').name('Color').onChange(updateLights);
      ptFolder.add(params, 'pointLightX', -500, 500, 10).name('Pos X').onChange(updateLights);
      ptFolder.add(params, 'pointLightY', -500, 500, 10).name('Pos Y').onChange(updateLights);
      ptFolder.add(params, 'pointLightZ', -500, 500, 10).name('Pos Z').onChange(updateLights);
      ptFolder.add(params, 'pointLightDistance', 50, 1000, 10).name('Distance').onChange(updateLights);
      ptFolder.close();

      const rimFolder = lightFolder.addFolder('Rim Light');
      rimFolder.add(params, 'rimLightIntensity', 0.0, 2.5, 0.05).name('Intensity').onChange(updateLights);
      rimFolder.addColor(params, 'rimLightColor').name('Color').onChange(updateLights);
      rimFolder.close();

      // Render & Quality Folder
      const renderFolder = gui.addFolder('Render & Quality');
      renderFolder.add(params, 'antialias').name('Antialiasing').onChange(rebuildRenderer);
      renderFolder.add(params, 'pixelRatio', 0.5, 3.0, 0.1).name('DPR (Pixel Ratio)').onChange(val => {
        renderer.setPixelRatio(val);
        updateUniforms();
      });
      renderFolder.add(params, 'coordMode', ['Screen Space (Original)', 'World / 3D Space', 'UV Surface']).name('Shader Mapping').onChange(updateCoordMode);

      // Procedural Generation Folder
      const procFolder = gui.addFolder('Procedural Variation');
      procFolder.add(params, 'randomizeOnClick').name('Randomize On Scene Click');
      procFolder.add(params, 'randomizeNow').name('🎲 Randomize Scene Now');
    }

    // =========================================================================
    // AUTO INFINITE ANIMATION & RENDER LOOP
    // Supports continuous camera angle adjustments and zoom during animations
    // =========================================================================
    function applyMotionPresets(dt) {
      animTime += dt * params.animSpeed;

      // Handle motion presets
      switch (params.animation) {
        case 'Slow Orbit':
          controls.autoRotate = true;
          controls.autoRotateSpeed = 1.0 * params.animSpeed;
          typoGroup.position.set(0, 0, 0);
          typoGroup.rotation.set(0, 0, 0);
          typoGroup.scale.set(1, 1, 1);
          break;

        case 'Floating Wave':
          controls.autoRotate = false;
          typoGroup.position.x = 0;
          typoGroup.position.y = Math.sin(animTime * 1.5) * 0.06;
          typoGroup.position.z = 0;
          typoGroup.rotation.x = Math.sin(animTime * 1.2) * 0.05;
          typoGroup.rotation.y = Math.cos(animTime * 0.9) * 0.06;
          typoGroup.rotation.z = Math.sin(animTime * 0.7) * 0.03;
          typoGroup.scale.set(1, 1, 1);
          break;

        case 'Figure-8 Infinity':
          controls.autoRotate = false;
          typoGroup.position.x = Math.sin(animTime * 1.0) * 0.10;
          typoGroup.position.y = Math.sin(animTime * 2.0) * 0.05;
          typoGroup.position.z = 0;
          typoGroup.rotation.x = Math.sin(animTime * 1.5) * 0.04;
          typoGroup.rotation.y = Math.cos(animTime * 1.0) * 0.08;
          typoGroup.rotation.z = Math.sin(animTime * 1.0) * 0.04;
          typoGroup.scale.set(1, 1, 1);
          break;

        case 'Pendulum Sway':
          controls.autoRotate = false;
          typoGroup.position.x = Math.sin(animTime * 1.2) * 0.08;
          typoGroup.position.y = (Math.cos(animTime * 2.4) - 1.0) * 0.02;
          typoGroup.position.z = 0;
          typoGroup.rotation.x = 0;
          typoGroup.rotation.y = Math.sin(animTime * 1.0) * 0.06;
          typoGroup.rotation.z = Math.sin(animTime * 1.2) * 0.12;
          typoGroup.scale.set(1, 1, 1);
          break;

        case 'Cinematic Dolly & Drift':
          controls.autoRotate = true;
          controls.autoRotateSpeed = 0.5 * params.animSpeed;
          typoGroup.position.x = 0;
          typoGroup.position.y = Math.sin(animTime * 0.8) * 0.03;
          typoGroup.position.z = 0;
          typoGroup.rotation.x = Math.cos(animTime * 0.6) * 0.04;
          typoGroup.rotation.y = 0;
          typoGroup.rotation.z = Math.sin(animTime * 0.4) * 0.02;
          typoGroup.scale.set(1, 1, 1);
          break;

        case 'Spiral Ascend':
          controls.autoRotate = true;
          controls.autoRotateSpeed = 0.8 * params.animSpeed;
          typoGroup.position.x = 0;
          typoGroup.position.y = Math.sin(animTime * 0.9) * 0.08;
          typoGroup.position.z = 0;
          typoGroup.rotation.x = 0;
          typoGroup.rotation.y = 0;
          typoGroup.rotation.z = Math.sin(animTime * 0.45) * 0.05;
          typoGroup.scale.set(1, 1, 1);
          break;

        case 'Breathing Pulse':
          controls.autoRotate = false;
          const s = 1.0 + Math.sin(animTime * 1.2) * 0.06;
          typoGroup.position.set(0, 0, 0);
          typoGroup.rotation.x = Math.sin(animTime * 0.8) * 0.04;
          typoGroup.rotation.y = Math.cos(animTime * 0.7) * 0.05;
          typoGroup.rotation.z = 0;
          typoGroup.scale.set(s, s, s);
          break;

        case 'Static (No Movement)':
        default:
          controls.autoRotate = false;
          typoGroup.position.set(0, 0, 0);
          typoGroup.rotation.set(0, 0, 0);
          typoGroup.scale.set(1, 1, 1);
          break;
      }

      // Smooth interactive hover tilt if enabled
      if (params.interactiveHoverTilt) {
        currentTiltX += (targetTiltX - currentTiltX) * 0.05;
        currentTiltY += (targetTiltY - currentTiltY) * 0.05;
        typoGroup.rotation.x += currentTiltX;
        typoGroup.rotation.y += currentTiltY;
      }
    }

    function render(now) {
      const delta = Math.min((now - lastTime) * 0.001, 0.1);
      lastTime = now;

      // Update shader time
      uniforms.u_time.value += delta * params.animSpeed * 1.5;

      // Update motion & camera systems
      applyMotionPresets(delta);

      // Update OrbitControls (supports user wheel zoom and drag uninterrupted)
      controls.update();

      // Render scene
      renderer.render(scene, camera);

      requestAnimationFrame(render);
    }

    // Initialize application
    init();
  </script>
</body>
