  }
  function updateColors() {
    const scheme=schemes[settings.palette];
    paletteUniforms.uPaletteMode.value=scheme.mode ?? 1;
    paletteUniforms.uInvert.value=settings.invert?1:0;
    paletteUniforms.uHue.value=(settings.hue/360+colorHue(settings.primaryColor)-colorHue('#f18b7e'))*TAU;
    paletteUniforms.uSaturation.value=settings.saturation;
    paletteUniforms.uAccent.value.copy(rgb(settings.accentColor));
    if(scheme.colors) {
      // Retain each supplied swatch as a separate color stop.
      const colors=scheme.colors.map(rgb).sort((a,b)=>luminance(a)-luminance(b));
      paletteUniforms.uPaletteCount.value=colors.length;
      for(let i=0;i<6;i++) {
        paletteUniforms.uPalette.value[i].copy(colors[Math.min(i,colors.length-1)]);
      }
    }
    backgroundUniforms.uGreen.value=settings.greenscreen?1:0;
    backgroundUniforms.uBackground.value.copy(rgb(settings.backgroundColor));
    backgroundUniforms.uGlow.value=settings.backgroundGlow?1:0;
    bodies.forEach(mesh=>{mesh.userData.shadow.visible=!settings.greenscreen;});
    if(invertControl)invertControl.show(scheme.mode===2 || scheme.mode===3);
  }
  function selectPalette(name) {
    settings.palette=name;
    settings.primaryColor='#f18b7e'; settings.hue=0; settings.saturation=1;
    const scheme=schemes[name];
    if(scheme.mode===2 || scheme.mode===3) {
      settings.backgroundColor=settings.invert?'#eeeeee':'#151515';
      settings.backgroundGlow=false;settings.accentColor='#e53935';
    } else if(scheme.mode===4) {
      settings.backgroundColor='#c7c0b3';settings.backgroundGlow=false;settings.accentColor='#e53935';
    } else if(name==='Original') {
      settings.backgroundColor='#99968c';settings.backgroundGlow=true;
    } else {
      settings.backgroundColor='#'+scheme.colors[scheme.colors.length-1];settings.backgroundGlow=false;
    }
    updateColors(); refreshPanel(); renderAt(elapsed);
  }
  // Stable PRNG: the seed in the panel reproduces geometry and pigment parameters.
  function seeded(seed) {
    let a=seed>>>0;
    return ()=>{
      a+=0x6D2B79F5;
      let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);
      return ((t^t>>>14)>>>0)/4294967296;
    };
  }
  function rebuildVariation() {
    const random=seeded(settings.seed);
    const amount=settings.shapeVariation;
    for(const mesh of bodies) {
      const spec=mesh.userData.spec,shadow=mesh.userData.shadow;
      const seed=spec.seed+(random()-.5)*18;
      const rx=spec.rx*(1+(random()-.5)*.22*amount);
      const ry=spec.ry*(1+(random()-.5)*.22*amount);
      const depth=spec.depth*(.87+random()*.26);
      const shape=random()<.25 ? Math.floor(random()*5) : spec.shape;
      const geometry=sculpt(rx,ry,depth,seed,shape);
      const previous=mesh.geometry;
      mesh.geometry=geometry; shadow.geometry=geometry; previous.dispose();
      const x=spec.x+(random()-.5)*.48*amount,y=spec.y+(random()-.5)*.42*amount;
      mesh.position.set(x,y,spec.z);mesh.userData.rest.copy(mesh.position);
      mesh.rotation.z=spec.angle+(random()-.5)*.25*amount;
      shadow.position.set(x+.1,y-.18,spec.z-depth-.1);shadow.rotation.z=mesh.rotation.z;
      const uniforms=mesh.material.uniforms;
      uniforms.uSeed.value=seed;
      uniforms.uDelay.value=spec.delay+(random()-.5)*.8;
      mesh.userData.patternBase=spec.density*(.78+random()*.44);
      uniforms.uDensity.value=mesh.userData.patternBase*settings.patternDensity;
    }
    const fold=objects.find(o=>o.userData.fold);
    fold.material.uniforms.uSeed.value=15+random()*15;
    fold.scale.set(1+(random()-.5)*.09*amount,1+(random()-.5)*.09*amount,1);
    updateDensity(); renderAt(elapsed);
  }
  function updateDensity() {
    bodies.forEach(mesh=>{
      mesh.material.uniforms.uDensity.value=(mesh.userData.patternBase ?? mesh.userData.spec.density)*settings.patternDensity;
    });
    objects.find(o=>o.userData.fold).material.uniforms.uDensity.value=.95*settings.patternDensity;
  }
  function randomize() {
    const pick=array=>array[Math.floor(Math.random()*array.length)];
    settings.seed=Math.floor(Math.random()*999999)+1;
    settings.palette=pick(Object.keys(schemes).filter(name=>name!==settings.palette));
    settings.animation=pick(Object.keys(animations).filter(name=>name!=='Static'));
    settings.speed=+(Math.random()*.5+.55).toFixed(2);
    settings.motionAmount=+(Math.random()*.7+.65).toFixed(2);
    settings.shapeVariation=+(Math.random()*.65+.7).toFixed(2);
    settings.patternDensity=+(Math.random()*.6+.75).toFixed(2);
    settings.primaryColor='#f18b7e'; settings.hue=0; settings.saturation=1;
    settings.invert=Math.random()>.5;
    settings.accentColor=pick(['#e53935','#ff795b','#e8a94c','#39bcb0','#af8ce8']);
    const theme=schemes[settings.palette];
    settings.backgroundColor=theme.colors ? '#'+theme.colors[theme.colors.length-1] : theme.mode===2||theme.mode===3 ? (settings.invert?'#eeeeee':'#151515') : pick(['#99968c','#d8d3c9','#21272b']);
    settings.backgroundGlow=settings.palette==='Original';
    if(theme.mode===3)settings.accentColor='#e53935';
    rebuildVariation(); updateColors(); refreshPanel();renderAt(elapsed);
  }
  function refreshPanel() { if(gui)gui.controllersRecursive().forEach(c=>c.updateDisplay()); }

  const target=new THREE.Vector3();
  const screenRight=new THREE.Vector3(), screenUp=new THREE.Vector3();
  function updateView(seconds,profile) {
    const t=seconds/16*TAU;
    const arc=THREE.MathUtils.degToRad(settings.orbitArc);
    let yaw=0,pitch=0,dolly=1,dx=0,dy=0;
    if(profile.camera==='orbit') {
      yaw=arc*Math.sin(t);pitch=arc*.43*Math.cos(t);
      dolly=1+.025*Math.sin(t-.3);
    } else if(profile.camera==='pendulum') {
      yaw=arc*Math.sin(t);pitch=arc*.25*Math.sin(2*t);
    } else if(profile.camera==='drift') {
      dx=.22*Math.sin(t);dy=.15*Math.cos(t);
      yaw=arc*.22*Math.sin(t);dolly=1+.035*Math.sin(t);
    }
    yaw+=THREE.MathUtils.degToRad(settings.azimuth);
    pitch+=THREE.MathUtils.degToRad(settings.elevation);
    pitch=THREE.MathUtils.clamp(pitch,-1.1,1.1);
    target.set(dx,dy,0);
    camera.position.set(35*Math.sin(yaw)*Math.cos(pitch)+dx,35*Math.sin(pitch)+dy,35*Math.cos(yaw)*Math.cos(pitch));
    camera.lookAt(target);camera.zoom=settings.zoom*dolly;camera.updateProjectionMatrix();camera.updateMatrixWorld();
    screenRight.setFromMatrixColumn(camera.matrixWorld,0);
    screenUp.setFromMatrixColumn(camera.matrixWorld,1);
    organismGroup.position.copy(screenRight).multiplyScalar(settings.panX).addScaledVector(screenUp,settings.panY);
  }
  function renderAt(seconds) {
    const profile=animations[settings.animation];
    const time=profile.static?0:seconds;
    phase.value=(((time%16)+16)%16)/16*TAU;
    motionStrength.value=profile.motion*settings.motionAmount;
    flowStrength.value=profile.flow;
    for(let i=0;i<bodies.length;i++) {
      const mesh=bodies[i],rest=mesh.userData.rest,spec=mesh.userData.spec;
      const t=phase.value-spec.delay;
      const shift=profile.wave?.075*Math.sin(t+i*.25)*settings.motionAmount:0;
      mesh.position.copy(rest); mesh.position.y+=shift;
      const breath=profile.breathing?1+.012*Math.sin(t)*settings.motionAmount:1;
      mesh.scale.set(breath,1/breath,1);
      const shadow=mesh.userData.shadow;
      shadow.position.x=mesh.position.x+.1;shadow.position.y=mesh.position.y-.18;
      shadow.scale.set(1.075*breath,1.07/breath,.025);
    }
    updateView(time,profile);renderer.render(scene,camera);
  }
  function resize() {
    const w=innerWidth,h=innerHeight,aspect=w/h,height=15;
    camera.left=-height*aspect/2;camera.right=height*aspect/2;
    camera.top=height/2;camera.bottom=-height/2;
    renderer.setPixelRatio(settings.pixelRatio);renderer.setSize(w,h,false);
    resolution.value.set(w,h);renderAt(elapsed);
  }
  function resetView() {
    Object.assign(settings,{zoom:1,azimuth:0,elevation:0,panX:0,panY:0});
    refreshPanel();renderAt(elapsed);
  }
  function frame(now) {
    if(disposed)return;
    if(active&&!manuallyPaused&&!reduced.matches)elapsed+=Math.min((now-last)*.001,.1)*settings.speed;
    last=now;
    if(active&&!manuallyPaused)renderAt(elapsed);
    raf=requestAnimationFrame(frame);
  }

  // Standard lil-gui 0.19.1 appearance; only the artwork receives custom CSS.
  gui=new LilGUI({title:'Opalescent organisms'});
  gui.add(settings,'palette',Object.keys(schemes)).name('Color scheme').onChange(selectPalette);
  gui.add(settings,'animation',Object.keys(animations)).name('Animation');
  gui.add(settings,'speed',0,2,.01).name('Animation speed');
  gui.add(settings,'greenscreen').name('Greenscreen').onChange(updateColors);
  const colorFolder=gui.addFolder('Colors');
  colorFolder.addColor(settings,'primaryColor').name('Primary color').onChange(updateColors);
  colorFolder.add(settings,'hue',-180,180,1).name('Hue shift').onChange(updateColors);
  colorFolder.add(settings,'saturation',0,1.5,.01).name('Saturation').onChange(updateColors);
  let invertControl=colorFolder.add(settings,'invert').name('Invert black / white').onChange(()=>{
    settings.backgroundColor=settings.invert?'#eeeeee':'#151515';
    updateColors();refreshPanel();
  });
  colorFolder.addColor(settings,'accentColor').name('Accent color').onChange(updateColors);
  colorFolder.addColor(settings,'backgroundColor').name('Background color').onChange(updateColors);
  colorFolder.add(settings,'backgroundGlow').name('Background glow').onChange(updateColors);
  colorFolder.close();
  const viewFolder=gui.addFolder('View');
  viewFolder.add(settings,'zoom',.25,4,.01).name('Zoom');
  viewFolder.add(settings,'azimuth',-45,45,.1).name('Camera angle');
  viewFolder.add(settings,'elevation',-40,40,.1).name('Camera elevation');
  viewFolder.add(settings,'orbitArc',0,25,.1).name('Orbit amplitude');
  viewFolder.add(settings,'panX',-20,20,.01).name('Position X');
  viewFolder.add(settings,'panY',-20,20,.01).name('Position Y');
  viewFolder.add(settings,'resetView').name('Reset view');viewFolder.close();
  const variationFolder=gui.addFolder('Procedural variation');
  variationFolder.add(settings,'clickToRandomize').name('Randomize on click');
  variationFolder.add(settings,'randomize').name('New variation');
  variationFolder.add(settings,'seed',1,999999,1).name('Geometry seed').onFinishChange(rebuildVariation);
  variationFolder.add(settings,'shapeVariation',0,1.5,.01).name('Shape variation').onFinishChange(rebuildVariation);
  variationFolder.add(settings,'patternDensity',.4,2,.01).name('Marbling density').onChange(updateDensity);
  variationFolder.add(settings,'motionAmount',0,2,.01).name('Pressure strength');variationFolder.close();
  const renderFolder=gui.addFolder('Rendering');
  renderFolder.add(settings,'pixelRatio',.5,3,.05).name('DPR / Pixel ratio').onChange(resize);renderFolder.close();
  gui.onChange(()=>renderAt(elapsed));

  let uiVisible=true;
  addEventListener('keydown',event=>{
    if(event.code!=='KeyH'||event.repeat||event.ctrlKey||event.altKey||event.metaKey)return;
    event.preventDefault();
    uiVisible=!uiVisible;gui.show(uiVisible);
  },{capture:true});
  canvas.addEventListener('wheel',event=>{
    event.preventDefault();
    const delta=event.deltaY*(event.deltaMode===1?16:event.deltaMode===2?innerHeight:1);
    settings.zoom=THREE.MathUtils.clamp(settings.zoom*Math.exp(-delta*.001),.25,4);
    refreshPanel();renderAt(elapsed);
  },{passive:false});
  let pointer=null;
  canvas.addEventListener('contextmenu',event=>event.preventDefault());
  canvas.addEventListener('pointerdown',event=>{
    if(pointer || (event.button!==0&&event.button!==2))return;
    pointer={id:event.pointerId,x:event.clientX,y:event.clientY,lastX:event.clientX,lastY:event.clientY,moved:false,orbit:event.button===2};
    canvas.setPointerCapture(event.pointerId);
  });
  canvas.addEventListener('pointermove',event=>{
    if(!pointer||pointer.id!==event.pointerId)return;
    if(Math.hypot(event.clientX-pointer.x,event.clientY-pointer.y)>4)pointer.moved=true;
    if(!pointer.moved)return;
    canvas.classList.add('dragging');
    const dx=event.clientX-pointer.lastX,dy=event.clientY-pointer.lastY;
    pointer.lastX=event.clientX;pointer.lastY=event.clientY;
    if(pointer.orbit) {
      settings.azimuth=THREE.MathUtils.clamp(settings.azimuth+dx*.12,-45,45);
      settings.elevation=THREE.MathUtils.clamp(settings.elevation+dy*.12,-40,40);
    } else {
      const unit=(camera.top-camera.bottom)/(innerHeight*camera.zoom);
      settings.panX=THREE.MathUtils.clamp(settings.panX+dx*unit,-20,20);
      settings.panY=THREE.MathUtils.clamp(settings.panY-dy*unit,-20,20);
    }
    refreshPanel();renderAt(elapsed);
  });
  function finishPointer(event) {
    if(!pointer||pointer.id!==event.pointerId)return;
    const reroll=event.type==='pointerup'&&!pointer.moved&&!pointer.orbit&&settings.clickToRandomize;
    pointer=null;canvas.classList.remove('dragging');
    if(canvas.hasPointerCapture(event.pointerId))canvas.releasePointerCapture(event.pointerId);
    if(reroll)randomize();
  }
  canvas.addEventListener('pointerup',finishPointer);
  canvas.addEventListener('pointercancel',finishPointer);
  canvas.addEventListener('lostpointercapture',finishPointer);
  document.addEventListener('visibilitychange',()=>{active=!document.hidden;last=performance.now();});
  addEventListener('resize',resize,{passive:true});
  addEventListener('pagehide',event=>{
    if(event.persisted)return;
    disposed=true;cancelAnimationFrame(raf);gui.destroy();
    const geometries=new Set(),materials=new Set();
    scene.traverse(o=>{if(o.geometry)geometries.add(o.geometry);if(o.material)materials.add(o.material);});
    geometries.forEach(g=>g.dispose());materials.forEach(m=>m.dispose());renderer.dispose();
  });
  window.artwork={
    duration:16,renderAt,settings,schemes,animations,randomize,selectPalette,rebuildVariation,
    pause(){manuallyPaused=true;},resume(){manuallyPaused=false;last=performance.now();},
    get renderer(){return renderer;},get camera(){return camera;},get group(){return organismGroup;},get gui(){return gui;}
  };
  updateColors();resize();raf=requestAnimationFrame(frame);
})();

</script>
</body>
</html>
