        // 1. DIORAMA BASE PEDESTAL
        function buildBase() {
            const baseGroup = new THREE.Group();

            // Top grass slab with beveled edges
            const grassGeo = new THREE.BoxGeometry(16, 0.8, 16);
            const grassMesh = new THREE.Mesh(grassGeo, mats.ground);
            grassMesh.position.y = -0.4;
            grassMesh.receiveShadow = true;
            baseGroup.add(grassMesh);

            // Soil layer
            const soilGeo = new THREE.BoxGeometry(15.8, 1.4, 15.8);
            const soilMesh = new THREE.Mesh(soilGeo, mats.dirtEdge);
            soilMesh.position.y = -1.5;
            soilMesh.receiveShadow = true;
            baseGroup.add(soilMesh);

            // Stone bedrock bottom
            const rockGeo = new THREE.BoxGeometry(15.6, 1.0, 15.6);
            const rockMesh = new THREE.Mesh(rockGeo, mats.stoneBase);
            rockMesh.position.y = -2.7;
            baseGroup.add(rockMesh);

            // Cobblestone path from barn to gate
            const pathPoints = [
                [-0.8, 0.01, 1.2], [-0.7, 0.01, 2.4], [-0.5, 0.01, 3.6],
                [-0.2, 0.01, 4.8], [0.2, 0.01, 5.8], [0.6, 0.01, 6.8]
            ];
            for (let i = 0; i < pathPoints.length; i++) {
                const numStones = 3 + Math.floor(Math.random() * 2);
                for (let s = 0; s < numStones; s++) {
                    const stoneR = 0.25 + Math.random() * 0.2;
                    const stoneGeo = new THREE.CylinderGeometry(stoneR, stoneR * 1.1, 0.04, 6);
                    const stone = new THREE.Mesh(stoneGeo, mats.pathCobble);
                    stone.position.set(
                        pathPoints[i][0] + (Math.random() - 0.5) * 0.8,
                        pathPoints[i][1],
                        pathPoints[i][2] + (Math.random() - 0.5) * 0.4
                    );
                    stone.rotation.y = Math.random() * Math.PI;
                    stone.receiveShadow = true;
                    baseGroup.add(stone);
                }
            }

            dioramaGroup.add(baseGroup);
        }

        // 2. MINIATURE BARN
        function buildBarn() {
            const barn = new THREE.Group();
            barn.position.set(-2.6, 0, -2.4);

            const bW = 5.2, bH = 3.6, bD = 5.6;

            // Main wall box
            const wallGeo = new THREE.BoxGeometry(bW, bH, bD);
            const walls = new THREE.Mesh(wallGeo, mats.barnWall);
            walls.position.y = bH / 2;
            walls.castShadow = true;
            walls.receiveShadow = true;
            barn.add(walls);

            // White Corner Trim Posts
            const trimW = 0.22;
            const corners = [
                [-bW/2, -bD/2], [bW/2, -bD/2],
                [-bW/2, bD/2], [bW/2, bD/2]
            ];
            corners.forEach(([cx, cz]) => {
                const post = new THREE.Mesh(new THREE.BoxGeometry(trimW, bH + 0.1, trimW), mats.barnTrim);
                post.position.set(cx, bH / 2, cz);
                post.castShadow = true;
                barn.add(post);
            });

            // Gambrel / Pitched Roof
            const roofH = 2.2;
            const roofGeo = new THREE.ConeGeometry(4.4, roofH, 4, 1, false, Math.PI / 4);
            roofGeo.scale(1.0, 1.0, 1.3);
            const roof = new THREE.Mesh(roofGeo, mats.barnRoof);
            roof.position.y = bH + roofH / 2;
            roof.castShadow = true;
            roof.receiveShadow = true;
            barn.add(roof);

            // Barn Front Double Doors with X-Bracing
            const doorGroup = new THREE.Group();
            doorGroup.position.set(0, 1.2, bD / 2 + 0.05);

            const doorFrame = new THREE.Mesh(new THREE.BoxGeometry(2.4, 2.5, 0.1), mats.barnTrim);

        // 3. ELEVATED CHICKEN COOP
        function buildCoop() {
            const coopGroup = new THREE.Group();
            coopGroup.position.set(4.5, 0, -3.2);

            const cW = 2.4, cH = 1.8, cD = 2.2;
            const stiltH = 0.9;

            // 4 Stilts
            const stilts = [
                [-cW/2 + 0.15, -cD/2 + 0.15], [cW/2 - 0.15, -cD/2 + 0.15],
                [-cW/2 + 0.15, cD/2 - 0.15], [cW/2 - 0.15, cD/2 - 0.15]
            ];
            stilts.forEach(([sx, sz]) => {
                const leg = new THREE.Mesh(new THREE.BoxGeometry(0.14, stiltH, 0.14), mats.woodDark);
                leg.position.set(sx, stiltH / 2, sz);
                leg.castShadow = true;
                coopGroup.add(leg);
            });

            // Coop House
            const coopBody = new THREE.Mesh(new THREE.BoxGeometry(cW, cH, cD), mats.coop);
            coopBody.position.y = stiltH + cH / 2;
            coopBody.castShadow = true;
            coopBody.receiveShadow = true;
            coopGroup.add(coopBody);

            // Coop Roof
            const coopRoofGeo = new THREE.ConeGeometry(2.1, 1.1, 4, 1, false, Math.PI / 4);
            coopRoofGeo.scale(1.0, 1.0, 1.2);
            const coopRoof = new THREE.Mesh(coopRoofGeo, mats.barnRoof);
            coopRoof.position.y = stiltH + cH + 0.5;
            coopRoof.castShadow = true;
            coopGroup.add(coopRoof);

            // Coop Door Arch & Open Hole
            const doorHole = new THREE.Mesh(new THREE.BoxGeometry(0.65, 0.75, 0.1), mats.woodDark);
            doorHole.position.set(-0.3, stiltH + 0.45, cD / 2 + 0.05);
            coopGroup.add(doorHole);

            // Chicken Ladder / Ramp
            const rampL = 2.2;
            const ramp = new THREE.Group();
            ramp.position.set(-0.3, 0, cD / 2 + 0.05);

            const rampBoard = new THREE.Mesh(new THREE.BoxGeometry(0.65, 0.06, rampL), mats.fence);
            rampBoard.position.set(0, stiltH / 2, rampL / 2 - 0.2);
            rampBoard.rotation.x = Math.atan2(stiltH, rampL - 0.4);
            rampBoard.castShadow = true;
            ramp.add(rampBoard);

            // Rungs on ramp
            for (let r = 0.3; r < rampL - 0.3; r += 0.35) {
                const rung = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.04, 0.05), mats.barnTrim);
                const ratio = r / rampL;
                rung.position.set(0, stiltH * (1 - ratio), r);
                ramp.add(rung);
            }
            coopGroup.add(ramp);

            // Nesting Box on side
            const nestBox = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.8, 1.4), mats.coop);
            nestBox.position.set(cW / 2 + 0.35, stiltH + 0.5, 0);
            nestBox.castShadow = true;
            coopGroup.add(nestBox);

            const nestLid = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.08, 1.5), mats.barnRoof);
            nestLid.position.set(cW / 2 + 0.4, stiltH + 0.92, 0);
            nestLid.rotation.z = -Math.PI / 12;
            coopGroup.add(nestLid);

            dioramaGroup.add(coopGroup);
        }

        // 4. FENCE & PERIMETER YARD
        function buildFence() {
            const fenceGroup = new THREE.Group();

            const fencePosts = [
                // Right side
                [6.8, -6.8], [6.8, -4.0], [6.8, -1.0], [6.8, 2.0], [6.8, 5.0], [6.8, 6.8],
                // Front side
                [6.8, 6.8], [4.2, 6.8], [1.6, 6.8],
                [-1.6, 6.8], [-4.2, 6.8], [-6.8, 6.8],
                // Left side
                [-6.8, 6.8], [-6.8, 4.0], [-6.8, 1.0], [-6.8, -2.0], [-6.8, -5.0], [-6.8, -6.8],
                // Back side
                [-6.8, -6.8], [-4.0, -6.8], [-1.0, -6.8], [2.0, -6.8], [5.0, -6.8]
            ];

            fencePosts.forEach(([px, pz]) => {
                const post = new THREE.Mesh(new THREE.BoxGeometry(0.16, 1.1, 0.16), mats.fence);
                post.position.set(px, 0.55, pz);
                post.castShadow = true;
                fenceGroup.add(post);
            });

            // Rails between consecutive posts (skipping the front gate opening between 1.6 and -1.6)
            for (let i = 0; i < fencePosts.length; i++) {
                const p1 = fencePosts[i];
                const p2 = fencePosts[(i + 1) % fencePosts.length];

                // Gate gap check
                if (Math.abs(p1[1] - 6.8) < 0.1 && Math.abs(p2[1] - 6.8) < 0.1) {
                    if ((p1[0] === 1.6 && p2[0] === -1.6) || (p1[0] === -1.6 && p2[0] === 1.6)) {
                        continue; // Farm gate gap!
                    }
                }

                const dx = p2[0] - p1[0];
                const dz = p2[1] - p1[1];
                const dist = Math.hypot(dx, dz);
                const angle = Math.atan2(dz, dx);

                for (let rY of [0.45, 0.85]) {
                    const rail = new THREE.Mesh(new THREE.BoxGeometry(dist, 0.08, 0.06), mats.fence);
                    rail.position.set((p1[0] + p2[0]) / 2, rY, (p1[1] + p2[1]) / 2);
                    rail.rotation.y = -angle;
                    rail.castShadow = true;
                    fenceGroup.add(rail);
                }
            }

            // Gate Posts & Swing Gate
            const gatePostL = new THREE.Mesh(new THREE.BoxGeometry(0.22, 1.3, 0.22), mats.fence);
            gatePostL.position.set(-1.6, 0.65, 6.8);
            gatePostL.castShadow = true;
            fenceGroup.add(gatePostL);

            const gatePostR = new THREE.Mesh(new THREE.BoxGeometry(0.22, 1.3, 0.22), mats.fence);
            gatePostR.position.set(1.6, 0.65, 6.8);
            gatePostR.castShadow = true;
            fenceGroup.add(gatePostR);

            // Partially open gate leaf
            const gateLeaf = new THREE.Group();
            gateLeaf.position.set(-1.6, 0, 6.8);
            gateLeaf.rotation.y = Math.PI / 4.5; // open outward

            const gateRail1 = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.08, 0.06), mats.barnTrim);
            gateRail1.position.set(0.7, 0.45, 0);
            gateLeaf.add(gateRail1);
            const gateRail2 = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.08, 0.06), mats.barnTrim);
            gateRail2.position.set(0.7, 0.85, 0);
            gateLeaf.add(gateRail2);
            const gateDiag = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.08, 0.05), mats.barnTrim);
            gateDiag.position.set(0.7, 0.65, 0);
            gateDiag.rotation.z = Math.PI / 6;
            gateLeaf.add(gateDiag);

            fenceGroup.add(gateLeaf);

            dioramaGroup.add(fenceGroup);
        }

        // 5. RUSTIC PROPS & ENVIRONMENT
        function populateProps() {
            dynamicPropsGroup.clear();

            // Stacked Hay Bales
            const hayConfigs = [
                { pos: [2.8, 0.3, -1.8], rot: 0.1, count: 4 },
                { pos: [-4.8, 0.3, 3.2], rot: -0.4, count: 3 },
                { pos: [4.8, 0.3, 3.5], rot: 0.3, count: 2 }
            ];

            hayConfigs.forEach(hc => {
                for (let b = 0; b < hc.count; b++) {
                    const bale = new THREE.Group();
                    const bMesh = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.55, 1.2), mats.hay);
                    bMesh.castShadow = true;
                    bMesh.receiveShadow = true;
                    bale.add(bMesh);

                    // Binding straps
                    const strap1 = new THREE.Mesh(new THREE.BoxGeometry(0.92, 0.57, 0.06), mats.woodDark);
                    strap1.position.z = 0.3;
                    bale.add(strap1);
                    const strap2 = new THREE.Mesh(new THREE.BoxGeometry(0.92, 0.57, 0.06), mats.woodDark);
                    strap2.position.z = -0.3;
                    bale.add(strap2);

                    const stackY = (b < 2 ? 0 : 0.55);
                    const stackX = (b === 1 ? 0.95 : 0);
                    bale.position.set(hc.pos[0] + stackX, hc.pos[1] + stackY, hc.pos[2]);
                    bale.rotation.y = hc.rot + (Math.random() - 0.5) * 0.1;
                    dynamicPropsGroup.add(bale);
                }
            });

            // Feeding Trough with Corn Grain
            const troughGroup = new THREE.Group();
            troughGroup.position.set(1.6, 0.2, 0.8);
            troughGroup.rotation.y = -Math.PI / 5;

            const troughWood = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.35, 0.6), mats.woodDark);
            troughWood.castShadow = true;
            troughGroup.add(troughWood);

            const cornGrain = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.1, 0.45), mats.props);
            cornGrain.position.y = 0.15;
            troughGroup.add(cornGrain);

            dynamicPropsGroup.add(troughGroup);

            // Water Trough / Basin
            const waterBasin = new THREE.Group();
            waterBasin.position.set(3.2, 0.25, 0.2);

            const basinMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.45, 0.5, 8), mats.woodDark);
            basinMesh.castShadow = true;
            waterBasin.add(basinMesh);

            const waterSurface = new THREE.Mesh(new THREE.CylinderGeometry(0.48, 0.48, 0.05, 8), mats.water);
            waterSurface.position.y = 0.2;
            waterBasin.add(waterSurface);

            dynamicPropsGroup.add(waterBasin);

            // Stylized Pumpkin Patch
            const pumpkinLocs = [
                [-4.2, 0, 1.2], [-4.8, 0, 0.6], [-3.8, 0, 0.4],
                [-4.5, 0, -0.4], [-5.2, 0, 1.5]
            ];
            pumpkinLocs.forEach(([px, py, pz]) => {
                const pGroup = new THREE.Group();
                const pScale = 0.35 + Math.random() * 0.25;

                const pBody = new THREE.Mesh(new THREE.DodecahedronGeometry(pScale, 1), mats.pumpkin);
                pBody.scale.set(1.15, 0.85, 1.15);
                pBody.castShadow = true;
                pGroup.add(pBody);

                const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.04 * pScale, 0.06 * pScale, 0.3 * pScale), mats.pumpkinStem);
                stem.position.y = 0.85 * pScale;
                stem.rotation.z = (Math.random() - 0.5) * 0.4;
                pGroup.add(stem);

                pGroup.position.set(px, pScale * 0.75, pz);
                dynamicPropsGroup.add(pGroup);
            });

            // Stylized Low-Poly Apple Tree & Pine Tree
            buildTree(-5.4, 4.8, 'apple');
            buildTree(5.5, 5.0, 'pine');
            buildTree(-5.2, -5.2, 'oak');

            // Grass Tufts & Wild Flowers
            for (let g = 0; g < 28; g++) {
                const gx = (Math.random() - 0.5) * 12.0;
                const gz = (Math.random() - 0.5) * 12.0;
                // Avoid placing inside barn
                if (gx < 0.2 && gx > -5.2 && gz < 0.4 && gz > -5.2) continue;

                const tuft = new THREE.Group();
                const blades = 3 + Math.floor(Math.random() * 3);
                for (let b = 0; b < blades; b++) {
                    const bladeH = 0.25 + Math.random() * 0.2;
                    const blade = new THREE.Mesh(new THREE.ConeGeometry(0.04, bladeH, 3), mats.ground);
                    blade.position.set((Math.random() - 0.5) * 0.15, bladeH / 2, (Math.random() - 0.5) * 0.15);
                    blade.rotation.x = (Math.random() - 0.5) * 0.4;
                    blade.rotation.z = (Math.random() - 0.5) * 0.4;
                    tuft.add(blade);
                }
                tuft.position.set(gx, 0, gz);
                dynamicPropsGroup.add(tuft);
            }
        }

        function buildTree(x, z, type) {
            const tree = new THREE.Group();
            tree.position.set(x, 0, z);

            if (type === 'apple') {
                const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.32, 1.8, 6), mats.trunk);
                trunk.position.y = 0.9;
                trunk.castShadow = true;
                tree.add(trunk);

                const foliage = new THREE.Mesh(new THREE.DodecahedronGeometry(1.4, 1), mats.leaf);
                foliage.position.y = 2.4;
                foliage.scale.set(1.2, 0.9, 1.2);
                foliage.castShadow = true;
                tree.add(foliage);

                // Hanging red apples
                for (let a = 0; a < 6; a++) {
                    const apple = new THREE.Mesh(new THREE.SphereGeometry(0.12, 5, 5), mats.chickenComb);
                    const theta = Math.random() * Math.PI * 2;
                    const phi = 0.3 + Math.random() * 1.2;
                    apple.position.set(
                        Math.sin(phi) * Math.cos(theta) * 1.3,
                        2.4 + Math.cos(phi) * 1.0,
                        Math.sin(phi) * Math.sin(theta) * 1.3
                    );
                    apple.castShadow = true;
                    tree.add(apple);
                }
            } else if (type === 'pine') {
                const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.28, 1.2, 6), mats.trunk);
                trunk.position.y = 0.6;
                trunk.castShadow = true;
                tree.add(trunk);

                for (let tier = 0; tier < 3; tier++) {
                    const coneR = 1.4 - tier * 0.32;
                    const coneH = 1.3 - tier * 0.2;
                    const pineCone = new THREE.Mesh(new THREE.ConeGeometry(coneR, coneH, 6), mats.leaf);
                    pineCone.position.y = 1.4 + tier * 0.75;
                    pineCone.castShadow = true;
                    tree.add(pineCone);
                }
            } else {
                // Oak Tree
                const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.36, 1.6, 6), mats.trunk);
                trunk.position.y = 0.8;
                trunk.castShadow = true;
                tree.add(trunk);

                const oakFoliage = new THREE.Mesh(new THREE.DodecahedronGeometry(1.6, 1), mats.leaf);
                oakFoliage.position.y = 2.3;
                oakFoliage.castShadow = true;
                tree.add(oakFoliage);
            }

            dynamicPropsGroup.add(tree);
        }

        // 6. LOW-POLY RIGGED CHICKENS & CHICKEN-CAM ENTITIES
        function createChickenMesh() {
            const chicken = new THREE.Group();

            // Root Body Node (for breathing / wobble)
            const bodyGroup = new THREE.Group();
            bodyGroup.position.y = 0.42;

            // Egg-shaped body
            const bodyGeo = new THREE.SphereGeometry(0.32, 7, 6);
            bodyGeo.scale(0.85, 1.0, 1.25);
            const bodyMesh = new THREE.Mesh(bodyGeo, mats.chickenBody);
            bodyMesh.castShadow = true;
            bodyGroup.add(bodyMesh);

            // Neck & Head Pivot Group
            const neckGroup = new THREE.Group();
            neckGroup.position.set(0, 0.18, 0.28);

            const headMesh = new THREE.Mesh(new THREE.SphereGeometry(0.18, 6, 6), mats.chickenBody);
            headMesh.position.set(0, 0.18, 0.08);
            headMesh.castShadow = true;
            neckGroup.add(headMesh);

            // Red Comb
            const combMesh = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.14, 0.26), mats.chickenComb);
            combMesh.position.set(0, 0.34, 0.06);
            combMesh.castShadow = true;
            neckGroup.add(combMesh);

            // Red Wattle
            const wattleMesh = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.1, 0.08), mats.chickenComb);
            wattleMesh.position.set(0, 0.08, 0.24);
            neckGroup.add(wattleMesh);

            // Yellow Beak
            const beakGeo = new THREE.ConeGeometry(0.07, 0.18, 4);
            beakGeo.rotateX(Math.PI / 2);
            const beakMesh = new THREE.Mesh(beakGeo, mats.chickenBeak);
            beakMesh.position.set(0, 0.18, 0.28);
            neckGroup.add(beakMesh);

            // Beady Eyes
            const eyeGeo = new THREE.SphereGeometry(0.035, 4, 4);
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
            const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
            eyeL.position.set(-0.14, 0.22, 0.16);
            neckGroup.add(eyeL);
            const eyeR = new THREE.Mesh(eyeGeo, eyeMat);
            eyeR.position.set(0.14, 0.22, 0.16);
            neckGroup.add(eyeR);

            bodyGroup.add(neckGroup);

            // Tail Feathers
            const tailGroup = new THREE.Group();
            tailGroup.position.set(0, 0.15, -0.32);

            for (let f = -1; f <= 1; f++) {
                const feather = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.32, 0.14), mats.chickenBody);
                feather.position.set(f * 0.08, 0.12, -0.06);
                feather.rotation.x = -Math.PI / 4;
                feather.rotation.z = f * 0.2;
                feather.castShadow = true;
                tailGroup.add(feather);
            }
            bodyGroup.add(tailGroup);

            // Flapping Wings
            const wingGeo = new THREE.BoxGeometry(0.06, 0.24, 0.38);
            const wingL = new THREE.Mesh(wingGeo, mats.chickenBody);
            wingL.position.set(-0.3, 0.02, 0);
            wingL.castShadow = true;
            bodyGroup.add(wingL);

            const wingR = new THREE.Mesh(wingGeo, mats.chickenBody);
            wingR.position.set(0.3, 0.02, 0);
            wingR.castShadow = true;
            bodyGroup.add(wingR);

            chicken.add(bodyGroup);

            // Articulated Legs
            const legGeo = new THREE.CylinderGeometry(0.03, 0.03, 0.38, 4);
            const footGeo = new THREE.BoxGeometry(0.14, 0.03, 0.2);

            const legLGroup = new THREE.Group();
            legLGroup.position.set(-0.14, 0.38, 0);
            const legL = new THREE.Mesh(legGeo, mats.chickenBeak);
            legL.position.y = -0.19;
            legLGroup.add(legL);
            const footL = new THREE.Mesh(footGeo, mats.chickenBeak);
            footL.position.set(0, -0.36, 0.06);
            legLGroup.add(footL);
            chicken.add(legLGroup);

            const legRGroup = new THREE.Group();
            legRGroup.position.set(0.14, 0.38, 0);
            const legR = new THREE.Mesh(legGeo, mats.chickenBeak);
            legR.position.y = -0.19;
            legRGroup.add(legR);
            const footR = new THREE.Mesh(footGeo, mats.chickenBeak);
            footR.position.set(0, -0.36, 0.06);
            legRGroup.add(footR);
            chicken.add(legRGroup);

            return {
                root: chicken,
                bodyGroup,
                neckGroup,
                tailGroup,
                wingL,
                wingR,
                legLGroup,
                legRGroup
            };
        }

        function createBabyChickMesh() {
            const chick = new THREE.Group();
            const body = new THREE.Mesh(new THREE.SphereGeometry(0.14, 6, 6), mats.chickBody);
            body.position.y = 0.16;
            body.scale.set(1.0, 1.1, 1.2);
            body.castShadow = true;
            chick.add(body);

            const beak = new THREE.Mesh(new THREE.ConeGeometry(0.04, 0.1, 4), mats.chickenBeak);
            beak.rotation.x = Math.PI / 2;
            beak.position.set(0, 0.18, 0.16);
            chick.add(beak);

            return chick;
        }

        class ChickenEntity {
            constructor(startX, startZ) {
                this.model = createChickenMesh();
                this.root = this.model.root;
                this.root.position.set(startX, 0, startZ);
                dioramaGroup.add(this.root);

                this.state = 'idle'; // 'walk', 'peck', 'flap', 'idle'
                this.stateTimer = 1 + Math.random() * 2;
                this.target = new THREE.Vector3(startX, 0, startZ);
                this.speed = 1.2 + Math.random() * 0.8;
                this.animPhase = Math.random() * Math.PI * 2;
                this.peckCount = 0;
            }

            pickNewTarget() {
                // Keep chickens in yard & avoiding barn
                let tx = (Math.random() - 0.5) * 9.0;
                let tz = (Math.random() - 0.5) * 9.0;
                // Barn bounds
                if (tx < 0.6 && tx > -5.4 && tz < 0.6 && tz > -5.4) {
                    tx = 1.5 + Math.random() * 3.5;
                    tz = 1.0 + Math.random() * 4.5;
                }
                this.target.set(tx, 0, tz);
            }

            update(dt) {
                this.animPhase += dt * 6.0;
                this.stateTimer -= dt;

                if (this.stateTimer <= 0) {
                    const r = Math.random();
                    if (r < 0.45) {
                        this.state = 'walk';
                        this.pickNewTarget();
                        this.stateTimer = 2.0 + Math.random() * 3.0;
                    } else if (r < 0.75) {
                        this.state = 'peck';
                        this.stateTimer = 1.5 + Math.random() * 2.0;
                        this.peckCount = 0;
                    } else if (r < 0.9) {
                        this.state = 'flap';
                        this.stateTimer = 1.2 + Math.random() * 1.0;
                    } else {
                        this.state = 'idle';
                        this.stateTimer = 1.5 + Math.random() * 2.5;
                    }
                }

                const m = this.model;

                if (this.state === 'walk') {
                    const toTarget = new THREE.Vector3().subVectors(this.target, this.root.position);
                    toTarget.y = 0;
                    const dist = toTarget.length();

                    if (dist > 0.1) {
                        toTarget.normalize();
                        const targetAngle = Math.atan2(toTarget.x, toTarget.z);
                        let diff = targetAngle - this.root.rotation.y;
                        while (diff < -Math.PI) diff += Math.PI * 2;
                        while (diff > Math.PI) diff -= Math.PI * 2;
                        this.root.rotation.y += diff * dt * 5.0;

                        this.root.position.addScaledVector(toTarget, this.speed * dt);

                        // Walking cadence
                        const stride = Math.sin(this.animPhase * 1.5);
                        m.legLGroup.rotation.x = stride * 0.7;
                        m.legRGroup.rotation.x = -stride * 0.7;
                        m.bodyGroup.position.y = 0.42 + Math.abs(stride) * 0.05;
                        m.neckGroup.position.z = 0.28 + stride * 0.06;
                        m.neckGroup.rotation.x = stride * 0.15;
                    } else {
                        this.state = 'peck';
                        this.stateTimer = 2.0;
                    }
                } else if (this.state === 'peck') {
                    m.legLGroup.rotation.x = 0;
                    m.legRGroup.rotation.x = 0;
                    const peckSpeed = 14.0;
                    const peck = Math.sin(this.animPhase * 2.2);
                    m.bodyGroup.rotation.x = Math.max(0, peck) * 0.35;
                    m.neckGroup.rotation.x = Math.max(0, peck) * 0.8;
                    m.neckGroup.position.y = 0.18 - Math.max(0, peck) * 0.12;
                    m.tailGroup.rotation.x = -Math.max(0, peck) * 0.4;
                } else if (this.state === 'flap') {
                    // Flapping wings excitedly and small jump
                    const flap = Math.sin(this.animPhase * 3.5);
                    m.wingL.rotation.z = flap * 0.8;
                    m.wingR.rotation.z = -flap * 0.8;
                    m.bodyGroup.position.y = 0.42 + Math.abs(flap) * 0.18;
                    m.neckGroup.rotation.x = -0.3;
                } else {
                    // Idle breathing & looking around
                    m.legLGroup.rotation.x = 0;
                    m.legRGroup.rotation.x = 0;
                    m.wingL.rotation.z = 0;
                    m.wingR.rotation.z = 0;
                    m.bodyGroup.position.y = 0.42 + Math.sin(this.animPhase * 0.5) * 0.02;
                    m.neckGroup.rotation.y = Math.sin(this.animPhase * 0.4) * 0.4;
                    m.neckGroup.rotation.x = 0;
                    m.neckGroup.position.set(0, 0.18, 0.28);
                }
            }

            destroy() {
                dioramaGroup.remove(this.root);
            }
        }

        function spawnFlock() {
            chickens.forEach(c => c.destroy());
            chickens = [];
            babyChicks.forEach(bc => dioramaGroup.remove(bc.mesh));
            babyChicks = [];

            const startCoords = [
                [0.8, 1.2], [-0.6, 2.8], [2.4, 3.2],
                [3.6, -1.2], [-2.8, 3.8], [1.8, 4.6]
            ];

            for (let i = 0; i < params.chickenCount; i++) {
                const sc = startCoords[i % startCoords.length];
                const jitterX = sc[0] + (Math.random() - 0.5) * 0.8;
                const jitterZ = sc[1] + (Math.random() - 0.5) * 0.8;
                chickens.push(new ChickenEntity(jitterX, jitterZ));
            }

            // Spawn 3 cute baby chicks following hen #0
            if (params.showBabyChicks && chickens.length > 0) {
                for (let b = 0; b < 3; b++) {
                    const chickMesh = createBabyChickMesh();
                    dioramaGroup.add(chickMesh);
                    babyChicks.push({
                        mesh: chickMesh,
                        offset: new THREE.Vector3((b - 1) * 0.4, 0, -0.6 - b * 0.35),
                        phase: b * 1.5
                    });
                }
            }
        }

        function updateBabyChicks(dt) {
            if (chickens.length === 0 || babyChicks.length === 0) return;
            const mother = chickens[0].root;

            babyChicks.forEach(bc => {
                bc.phase += dt * 8.0;
                // Target position trailing behind mother hen
                const desired = mother.position.clone().add(
                    bc.offset.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), mother.rotation.y)
                );
                bc.mesh.position.lerp(desired, dt * 4.0);
                bc.mesh.rotation.y = mother.rotation.y;
                bc.mesh.position.y = Math.abs(Math.sin(bc.phase)) * 0.06;
            });
        }

        // --- POST PROCESSING & TILT-SHIFT / DOF PASS ---
        const TiltShiftShader = {
            uniforms: {
                tDiffuse: { value: null },
                focusPos: { value: 0.5 },
                focusRange: { value: 0.22 },
                blurStrength: { value: 0.0055 },
                vignetteDarkness: { value: 0.35 },
                greenscreen: { value: 0.0 },
                aspectRatio: { value: window.innerWidth / window.innerHeight }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D tDiffuse;
                uniform float focusPos;
                uniform float focusRange;
                uniform float blurStrength;
                uniform float vignetteDarkness;
                uniform float greenscreen;
                uniform float aspectRatio;
                varying vec2 vUv;

                void main() {
                    vec4 baseColor = texture2D(tDiffuse, vUv);

                    // If greenscreen enabled, bypass tilt-shift vignette to keep pure #00ff00
                    if (greenscreen > 0.5) {
                        gl_FragColor = baseColor;
                        return;
                    }

                    // Calculate distance from horizontal tilt-shift focal line
                    float dist = abs(vUv.y - focusPos);
                    float blurFactor = smoothstep(focusRange * 0.5, focusRange * 1.4, dist);

                    vec4 sum = vec4(0.0);
                    float totalWeight = 0.0;
                    float radius = blurFactor * blurStrength;

                    // 12-sample Poisson-style circular bokeh blur
                    vec2 offsets[12];
                    offsets[0] = vec2(0.0, 1.0);
                    offsets[1] = vec2(0.866, 0.5);
                    offsets[2] = vec2(0.866, -0.5);
                    offsets[3] = vec2(0.0, -1.0);
                    offsets[4] = vec2(-0.866, -0.5);
                    offsets[5] = vec2(-0.866, 0.5);
                    offsets[6] = vec2(0.5, 0.866) * 0.5;
                    offsets[7] = vec2(0.866, 0.0) * 0.5;
                    offsets[8] = vec2(0.5, -0.866) * 0.5;
                    offsets[9] = vec2(-0.5, -0.866) * 0.5;
                    offsets[10] = vec2(-0.866, 0.0) * 0.5;
                    offsets[11] = vec2(-0.5, 0.866) * 0.5;

                    sum += baseColor * 2.0;
                    totalWeight += 2.0;

                    for (int i = 0; i < 12; i++) {
                        vec2 sampleUv = vUv + offsets[i] * vec2(radius / aspectRatio, radius);
                        sum += texture2D(tDiffuse, sampleUv);
                        totalWeight += 1.0;
                    }

                    vec4 finalColor = sum / totalWeight;

                    // Cozy soft diorama vignette
                    vec2 uvCentered = (vUv - 0.5) * vec2(aspectRatio, 1.0);
                    float vig = 1.0 - smoothstep(0.4, 0.95, length(uvCentered)) * vignetteDarkness;
                    finalColor.rgb *= vig;

                    gl_FragColor = finalColor;
                }
            `
        };

        const composer = new EffectComposer(renderer);
        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);

        const tiltShiftPass = new ShaderPass(TiltShiftShader);
        tiltShiftPass.renderToScreen = true;
        composer.addPass(tiltShiftPass);

        function updatePostProcess() {
            tiltShiftPass.enabled = params.tiltShiftEnabled;
            tiltShiftPass.uniforms.focusPos.value = params.focusPos;
            tiltShiftPass.uniforms.focusRange.value = params.focusRange;
            tiltShiftPass.uniforms.blurStrength.value = params.blurStrength;
            tiltShiftPass.uniforms.vignetteDarkness.value = params.vignetteDarkness;
            tiltShiftPass.uniforms.greenscreen.value = params.greenscreen ? 1.0 : 0.0;
            tiltShiftPass.uniforms.aspectRatio.value = window.innerWidth / window.innerHeight;
        }

        // --- GREENSCREEN TOGGLE ---
        function setGreenscreen(enable) {
            params.greenscreen = enable;
            if (enable) {
                scene.background.set('#00ff00');
                scene.fog.color.set('#00ff00');
                tiltShiftPass.uniforms.greenscreen.value = 1.0;
            } else {
                const p = COLOR_PALETTES[params.colorScheme] || COLOR_PALETTES['Classic Pastoral'];
                scene.background.set(p.sky);
                scene.fog.color.set(p.sky);
                tiltShiftPass.uniforms.greenscreen.value = 0.0;
            }
        }

        // --- CAMERA ANIMATIONS SYSTEM (8 MODES) ---
        let animClock = 0;

        function updateCameraAnimation(dt) {
            animClock += dt * params.animSpeed * 0.4;

            switch (params.animationMode) {
                case 'Lazy Orbit': {
                    const radius = 14.5;
                    camera.position.x = Math.sin(animClock * params.autoRotateSpeed) * radius;
                    camera.position.z = Math.cos(animClock * params.autoRotateSpeed) * radius;
                    camera.position.y = 8.5 + Math.sin(animClock * 0.5) * 1.0;
                    controls.target.set(0, 1.2, 0);
                    break;
                }
                case 'Bird\'s Eye Spiral': {
                    const radius = 10.0 + Math.sin(animClock * 0.6) * 3.5;
                    camera.position.x = Math.sin(animClock * 0.5) * radius;
                    camera.position.z = Math.cos(animClock * 0.5) * radius;
                    camera.position.y = 15.0 + Math.cos(animClock * 0.4) * 2.0;
                    controls.target.set(0, 0.8, 0);
                    break;
                }
                case 'Barnyard Close-Up': {
                    // Close-in tracking around coop and chicken yard
                    const camX = 2.5 + Math.sin(animClock * 0.8) * 4.5;
                    const camZ = 3.5 + Math.cos(animClock * 0.8) * 4.0;
                    camera.position.set(camX, 3.2 + Math.sin(animClock * 0.4) * 0.8, camZ);
                    controls.target.set(0.8, 0.6, 1.2);
                    break;
                }
                case 'Golden Hour Pan': {
                    // Slow sweeping horizontal arc
                    const panAngle = Math.sin(animClock * 0.5) * 0.65;
                    const dist = 13.5;
                    camera.position.set(Math.sin(panAngle) * dist, 5.8, Math.cos(panAngle) * dist);
                    controls.target.set(0, 1.4, 0);
                    break;
                }
                case 'Wanderlust Drift': {
                    // Smooth Lissajous figure-8 float
                    camera.position.x = Math.sin(animClock * 0.7) * 12.0;
                    camera.position.z = Math.cos(animClock * 0.35) * 12.0;
                    camera.position.y = 7.5 + Math.sin(animClock * 0.9) * 2.2;
                    controls.target.set(Math.sin(animClock * 0.5) * 0.8, 1.2, Math.cos(animClock * 0.5) * 0.8);
                    break;
                }
                case 'Peck & Roost Focus': {
                    // Low angle viewing the chickens & barn entrance
                    camera.position.x = Math.sin(animClock * 0.6) * 7.5;
                    camera.position.z = 6.8 + Math.cos(animClock * 0.4) * 2.5;
                    camera.position.y = 2.4 + Math.sin(animClock * 0.5) * 0.6;
                    controls.target.set(-0.5, 0.8, 0);
                    break;
                }
                case 'Pastoral Breeze': {
                    // Subtle bobbing diorama feel
                    const fixedAngle = Math.PI / 4.2;
                    const baseRadius = 14.0;
                    camera.position.x = Math.sin(fixedAngle) * baseRadius + Math.sin(animClock * 0.8) * 1.5;
                    camera.position.z = Math.cos(fixedAngle) * baseRadius + Math.cos(animClock * 0.7) * 1.5;
                    camera.position.y = 8.8 + Math.sin(animClock * 1.1) * 1.2;
                    controls.target.set(0, 1.2, 0);
                    break;
                }
                case 'Static (No Movement)':
                default:
                    // Stationary camera angle; allows free manual orbit & zoom
                    break;
            }
        }

        // --- PROCEDURAL RE-ROLL & RANDOMIZER ---
        function rerollScene() {
            // Pick a random color scheme from the 18 palettes
            const randomScheme = PALETTE_NAMES[Math.floor(Math.random() * PALETTE_NAMES.length)];
            applyPalette(randomScheme);

            // Randomize chicken count & behaviors
            params.chickenCount = 3 + Math.floor(Math.random() * 4);
            spawnFlock();

            // Re-populate props (hay stacks, pumpkins, flora)
            populateProps();

            // Randomize weather vane orientation
            if (weatherVaneGroup) {
                weatherVaneGroup.rotation.y = Math.random() * Math.PI * 2;
            }

            // Update all lil-gui controller displays
            if (gui) {
                gui.controllersRecursive().forEach(c => c.updateDisplay());
            }
        }

        // --- LIL-GUI CONTROL PANEL ---
        const gui = new GUI({ title: '🐔 Chicken-Cam Diorama' });

        // Preset Color Schemes
        const fTheme = gui.addFolder('🎨 Color & Theme');
        fTheme.add(params, 'colorScheme', PALETTE_NAMES).name('Color Scheme').onChange(applyPalette);
        fTheme.add(params, 'greenscreen').name('Greenscreen #00FF00').onChange(setGreenscreen);

        const fColors = fTheme.addFolder('Custom Color Pickers').close();
        fColors.addColor(params, 'colGround').name('Ground').onChange(v => { mats.ground.color.set(v); });
        fColors.addColor(params, 'colBarn').name('Barn Wall').onChange(v => { mats.barnWall.color.set(v); });
        fColors.addColor(params, 'colRoof').name('Barn Roof').onChange(v => { mats.barnRoof.color.set(v); });
        fColors.addColor(params, 'colTrim').name('Barn Trim').onChange(v => { mats.barnTrim.color.set(v); });
        fColors.addColor(params, 'colCoop').name('Coop').onChange(v => { mats.coop.color.set(v); });
        fColors.addColor(params, 'colFence').name('Fence').onChange(v => { mats.fence.color.set(v); });
        fColors.addColor(params, 'colChicken').name('Chicken Feather').onChange(v => { mats.chickenBody.color.set(v); });
        fColors.addColor(params, 'colComb').name('Chicken Comb').onChange(v => { mats.chickenComb.color.set(v); });

        // Camera Animations Dropdown
        const fCam = gui.addFolder('📷 Camera Animations');
        fCam.add(params, 'animationMode', ANIMATION_MODES).name('Animation Mode');
        fCam.add(params, 'autoRotateSpeed', 0.1, 2.5, 0.1).name('Orbit Speed');

        // Animation & Engine Settings
        const fAnim = gui.addFolder('⚙️ Animation & Engine');
        fAnim.add(params, 'animSpeed', 0.1, 3.0, 0.1).name('Anim Speed');
        fAnim.add(params, 'dpr', 0.5, 2.5, 0.25).name('Pixel Ratio (DPR)').onChange(v => {
            renderer.setPixelRatio(v);
            composer.setSize(window.innerWidth, window.innerHeight);
        });
        fAnim.add(params, 'clickToRandomize').name('Click to Randomize');

        // Tilt-Shift / DOF Post-Processing
        const fPost = gui.addFolder('✨ Tilt-Shift / Toy Diorama');
        fPost.add(params, 'tiltShiftEnabled').name('Enable Tilt-Shift').onChange(updatePostProcess);
        fPost.add(params, 'focusPos', 0.1, 0.9, 0.02).name('Focus Plane Y').onChange(updatePostProcess);
        fPost.add(params, 'focusRange', 0.05, 0.5, 0.02).name('Sharp Band Width').onChange(updatePostProcess);
        fPost.add(params, 'blurStrength', 0.001, 0.015, 0.0005).name('Bokeh Blur').onChange(updatePostProcess);
        fPost.add(params, 'vignetteDarkness', 0.0, 0.8, 0.05).name('Vignette').onChange(updatePostProcess);

        // Flock Parameters
        const fFlock = gui.addFolder('🌾 Barnyard Flock');
        fFlock.add(params, 'chickenCount', 1, 6, 1).name('Adult Chickens').onChange(spawnFlock);
        fFlock.add(params, 'showBabyChicks').name('Baby Chicks').onChange(spawnFlock);
        fFlock.add({ reRoll: rerollScene }, 'reRoll').name('🎲 Randomize Scene');

        // --- KEYBOARD LISTENER ("H" TO TOGGLE UI) ---
        window.addEventListener('keydown', (e) => {
            if (e.key === 'h' || e.key === 'H') {
                gui._hidden ? gui.show() : gui.hide();
            }
        });

        // --- POINTER CLICK DETECTION FOR SCENE RANDOMIZER ---
        let pointerDownPos = { x: 0, y: 0 };
        let pointerDownTime = 0;

        window.addEventListener('pointerdown', (e) => {
            pointerDownPos.x = e.clientX;
            pointerDownPos.y = e.clientY;
            pointerDownTime = performance.now();
        });

        window.addEventListener('pointerup', (e) => {
            // Ignore clicks inside GUI
            if (e.target.closest('.lil-gui')) return;

            const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
            const duration = performance.now() - pointerDownTime;

            // If clean click without dragging and under 350ms
            if (dist < 6 && duration < 350 && params.clickToRandomize) {
                rerollScene();
            }
        });

        // --- RESIZE HANDLER ---
        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
            composer.setSize(w, h);
            tiltShiftPass.uniforms.aspectRatio.value = w / h;
        });

        // --- BUILD WORLD INITIALLY ---
        buildBase();
        buildBarn();
        buildCoop();
        buildFence();
        populateProps();
        applyPalette(params.colorScheme);
        spawnFlock();
        updatePostProcess();

        // --- MAIN RENDER LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const dt = Math.min(clock.getDelta(), 0.1);
            const scaledDt = dt * params.animSpeed;

            // Update chickens
            chickens.forEach(c => c.update(scaledDt));
            updateBabyChicks(scaledDt);

            // Gentle weathercock vane sway
            if (weatherVaneGroup) {
                weatherVaneGroup.rotation.y += Math.sin(clock.getElapsedTime() * 1.5) * 0.008 * params.animSpeed;
            }

            // Update camera animation mode
            if (params.animationMode !== 'Static (No Movement)') {
                updateCameraAnimation(dt);
            }
            controls.update();

            // Render via composer with tilt-shift pass
            composer.render();
        }

        animate();
    </script>
</body>
