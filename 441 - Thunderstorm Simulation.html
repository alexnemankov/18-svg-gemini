    const ANIMATION_OPTIONS = [
      'Static View (No Movement)',
      'Slow Atmospheric Orbit',

      'Thunderhead Panorama',

    // =========================================================================
    // PARAMETERS OBJECT
    // =========================================================================
    const initialPalette = PALETTES['Original'];

    const params = {
      // Color & Theme
      theme: 'Original',
      greenScreen: false,
      bgColor: initialPalette.bg,
      fogColor: initialPalette.fog,
      cloudColor: initialPalette.clouds,
      rainColor: initialPalette.rain,

      animationMode: 'Slow Atmospheric Orbit',

      toneMappingExposure: 1.25,

      // Storm Environment
      rainCount: 15000,

      cloudOpacity: 0.62,
      fogDensity: 0.002,

      // Quality & Display

      // Procedural Click Re-roll
      clickToRandomize: true

    // =========================================================================
    // CORE THREE.JS GLOBALS & STATE
    // =========================================================================
    const container = document.getElementById('canvas-container');
    const clock = new THREE.Clock();
    let animClock = 0;
    let pointerDownPos = { x: 0, y: 0 };
    let scene, camera, renderer, controls;
    let cloudParticles = [], cloudGeo, cloudMaterial, cloudGroup;

    let ambient, directionalLight, flash;
    let flashCurrentIntensity = 0;

    // =========================================================================
    // PROCEDURAL TEXTURE GENERATORS
    // Ensures instant rendering without blank screens or external CORS dependencies
    // =========================================================================
    function createProceduralCloudTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, 512, 512);

      const puffs = [
        { x: 256, y: 256, r: 230, alpha: 0.22 },
        { x: 200, y: 220, r: 190, alpha: 0.32 },
        { x: 310, y: 230, r: 200, alpha: 0.32 },
        { x: 260, y: 310, r: 180, alpha: 0.28 },
        { x: 170, y: 280, r: 160, alpha: 0.26 },
        { x: 340, y: 290, r: 170, alpha: 0.26 },
        { x: 220, y: 170, r: 150, alpha: 0.24 },
        { x: 300, y: 170, r: 150, alpha: 0.24 },
        { x: 256, y: 256, r: 130, alpha: 0.38 }
      ];

      for (const p of puffs) {
        const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
        grad.addColorStop(0, `rgba(255, 255, 255, ${p.alpha})`);
        grad.addColorStop(0.35, `rgba(240, 246, 255, ${p.alpha * 0.75})`);
        grad.addColorStop(0.7, `rgba(220, 230, 245, ${p.alpha * 0.3})`);
        grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.ClampToEdgeWrapping;
      texture.wrapT = THREE.ClampToEdgeWrapping;
      return texture;
    }

    function createRainDropTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 16;
      canvas.height = 64;
      const ctx = canvas.getContext('2d');

      const grad = ctx.createLinearGradient(8, 0, 8, 64);
      grad.addColorStop(0, 'rgba(255, 255, 255, 0)');
      grad.addColorStop(0.2, 'rgba(255, 255, 255, 0.25)');
      grad.addColorStop(0.75, 'rgba(255, 255, 255, 0.85)');
      grad.addColorStop(1, 'rgba(255, 255, 255, 1.0)');

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.ellipse(8, 32, 4, 30, 0, 0, Math.PI * 2);
      ctx.fill();

      const texture = new THREE.CanvasTexture(canvas);
      return texture;
    }

    // =========================================================================
    // INITIALIZATION
    // =========================================================================
    function init() {
      scene = new THREE.Scene();

      // Camera setup matching original perspective tilt
      camera = new THREE.PerspectiveCamera(
        60,
        window.innerWidth / window.innerHeight,
        1,
        2500
      );
      camera.position.set(0, 100, 260);

      // Renderer setup
      renderer = new THREE.WebGLRenderer({
        antialias: params.antialias,
        powerPreference: 'high-performance'
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(params.pixelRatio);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = params.toneMappingExposure;

      // Fog & Background
      scene.fog = new THREE.FogExp2(params.fogColor, params.fogDensity);
      renderer.setClearColor(scene.fog.color, 1);
      scene.background = new THREE.Color(params.bgColor);

      container.appendChild(renderer.domElement);

      // OrbitControls for wheel zoom and dragging across screen
      controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 260, -100);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.screenSpacePanning = true;
      controls.enablePan = true;
      controls.enableZoom = true;
      controls.enableRotate = true;
      controls.minDistance = 15;
      controls.maxDistance = 1500;
      controls.update();

      // Lighting
      ambient = new THREE.AmbientLight(params.ambientColor, params.ambientIntensity);
      scene.add(ambient);

      directionalLight = new THREE.DirectionalLight(params.dirLightColor, params.dirLightIntensity);
      directionalLight.position.set(0, 1, 1);
      scene.add(directionalLight);

      flash = new THREE.PointLight(params.flashColor, 0, 1200, 1.7);
      flash.position.set(200, 420, 100);
      scene.add(flash);

      // Rain Points Setup
      buildRainParticles();

      // Cloud Particle Deck Setup
      buildClouds();

      // Start infinite animation loop
      animate();

      // Window resize
      window.addEventListener('resize', onWindowResize);
    }

    // =========================================================================
    // RAIN PARTICLES CREATION
    // =========================================================================
    function buildRainParticles() {
      if (rain) {
        scene.remove(rain);
        rain.geometry.dispose();
      }

      const rainPositions = new Float32Array(params.rainCount * 3);
      for (let i = 0; i < params.rainCount; i++) {
        const idx = i * 3;
        rainPositions[idx + 0] = (Math.random() - 0.5) * 600;
        rainPositions[idx + 1] = Math.random() * 700 - 200;
        rainPositions[idx + 2] = (Math.random() - 0.5) * 600 - 50;
      }

      rainGeo = new THREE.BufferGeometry();
      rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPositions, 3));

      rainMaterial = new THREE.PointsMaterial({
        color: new THREE.Color(params.rainColor),
        size: params.rainSize,
        map: createRainDropTexture(),
        transparent: true,
        opacity: params.rainOpacity,
        depthWrite: false,
        blending: THREE.NormalBlending
      });

      rain = new THREE.Points(rainGeo, rainMaterial);
      scene.add(rain);
    }

    // =========================================================================
    // CLOUD DECK CREATION
    // =========================================================================
    function buildClouds() {
      cloudGroup = new THREE.Group();
      scene.add(cloudGroup);

      cloudGeo = new THREE.PlaneGeometry(550, 550);

      // Initialize with crisp procedural cloud puff texture immediately
      const initialTexture = createProceduralCloudTexture();

      cloudMaterial = new THREE.MeshLambertMaterial({
        map: initialTexture,
        color: new THREE.Color(params.cloudColor),
        transparent: true,
        opacity: params.cloudOpacity,
        depthWrite: false
      });

      const cloudCount = 36;
      for (let p = 0; p < cloudCount; p++) {
        const cloud = new THREE.Mesh(cloudGeo, cloudMaterial);
        cloud.position.set(
          (Math.random() - 0.5) * 850,
          500 + (Math.random() - 0.5) * 70,
          Math.random() * 550 - 450
        );
        cloud.rotation.x = 1.16;
        cloud.rotation.y = -0.12;
        cloud.rotation.z = Math.random() * Math.PI * 2;
        cloudParticles.push(cloud);
        cloudGroup.add(cloud);
      }

      // Simultaneously load the external Vecteezy cloud texture with graceful fallback
      const loader = new THREE.TextureLoader();
      loader.load(
        'https://static.vecteezy.com/system/resources/previews/010/884/548/original/dense-fluffy-puffs-of-white-smoke-and-fog-on-transparent-background-abstract-smoke-clouds-movement-blurred-out-of-focus-smoking-blows-from-machine-dry-ice-fly-fluttering-in-air-effect-texture-png.png',
        (tex) => {
          tex.wrapS = THREE.ClampToEdgeWrapping;
          tex.wrapT = THREE.ClampToEdgeWrapping;
          cloudMaterial.map = tex;
          cloudMaterial.needsUpdate = true;
        },
        undefined,
        () => {
          // Graceful fallback to procedural puff texture already applied
        }
      );
    }

    // =========================================================================
    // COLOR SCHEME APPLICATION
    // =========================================================================
    function applyColorScheme(themeName) {
      params.theme = themeName;
      const t = PALETTES[themeName];
      if (!t) return;

      params.bgColor = t.bg;
      params.fogColor = t.fog;
      params.cloudColor = t.clouds;
      params.rainColor = t.rain;
      params.flashColor = t.flash;
      params.dirLightColor = t.dirLight;
      params.ambientColor = t.ambient;

      if (!scene || !renderer) return;

      if (params.greenScreen) {
        if (scene.background) scene.background.set('#00ff00');
        renderer.setClearColor('#00ff00', 1);
        if (scene.fog) scene.fog.color.set('#00ff00');
      } else {
        if (scene.background) scene.background.set(params.bgColor);
        renderer.setClearColor(params.fogColor, 1);
        if (scene.fog) scene.fog.color.set(params.fogColor);
      }

      if (cloudMaterial) {
        cloudMaterial.color.set(params.cloudColor);
      }
      if (rainMaterial) {
        rainMaterial.color.set(params.rainColor);
      }
      if (flash) {
        flash.color.set(params.flashColor);
      }
      if (directionalLight) {
        directionalLight.color.set(params.dirLightColor);
      }
      if (ambient) {
        ambient.color.set(params.ambientColor);
      }

      if (typeof gui !== 'undefined' && gui) {
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      }
    }

    // =========================================================================
    // GREENSCREEN TOGGLE (#00ff00)
    // =========================================================================
    function setGreenScreen(enabled) {
      params.greenScreen = enabled;
      if (!scene || !renderer) return;

      if (enabled) {
        if (scene.background) scene.background.set('#00ff00');
        renderer.setClearColor('#00ff00', 1);
        if (scene.fog) scene.fog.color.set('#00ff00');
      } else {
        if (scene.background) scene.background.set(params.bgColor);
        renderer.setClearColor(params.fogColor, 1);
        if (scene.fog) scene.fog.color.set(params.fogColor);
      }
      if (typeof gui !== 'undefined' && gui) {
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      }
    }

    // =========================================================================
    // ANTIALIAS TOGGLE (Renderer Re-creation)
    // =========================================================================
    function updateAntialias(val) {
      params.antialias = val;
      const oldCanvas = renderer.domElement;
      renderer.dispose();
      if (oldCanvas.parentElement) {
        oldCanvas.parentElement.removeChild(oldCanvas);
      }

      renderer = new THREE.WebGLRenderer({
        antialias: params.antialias,
        powerPreference: 'high-performance'
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(params.pixelRatio);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = params.toneMappingExposure;

      if (params.greenScreen) {
        scene.background.set('#00ff00');
        renderer.setClearColor('#00ff00', 1);
        scene.fog.color.set('#00ff00');
      } else {
        scene.background.set(params.bgColor);
        renderer.setClearColor(params.fogColor, 1);
        scene.fog.color.set(params.fogColor);
      }

      container.appendChild(renderer.domElement);
      controls.domElement = renderer.domElement;
    }

    // =========================================================================
    // PROCEDURAL RE-ROLL (Upon User Click on Scene)
    // =========================================================================
    function randomizeScene() {
      // 1. Pick a random color scheme from the 19+ preconfigured palettes
      const keys = Object.keys(PALETTES);
      const randomKey = keys[Math.floor(Math.random() * keys.length)];
      applyColorScheme(randomKey);

      // 2. Re-roll geometric and motion parameters
      params.rainSpeed = 160 + Math.random() * 260;
      params.rainSize = 0.12 + Math.random() * 0.28;
      params.rainOpacity = 0.5 + Math.random() * 0.45;
      params.windSpeed = (Math.random() - 0.5) * 35;

      params.cloudSpeed = 0.001 + Math.random() * 0.0035;
      params.cloudOpacity = 0.45 + Math.random() * 0.4;
      params.fogDensity = 0.0014 + Math.random() * 0.0016;

      params.flashFrequency = 0.04 + Math.random() * 0.12;
      params.flashIntensity = 500 + Math.random() * 1000;
      params.toneMappingExposure = 0.95 + Math.random() * 0.6;
      params.ambientIntensity = 0.4 + Math.random() * 0.6;
      params.dirLightIntensity = 0.9 + Math.random() * 1.3;

      // 3. Apply changes to scene objects
      if (rainMaterial) {
        rainMaterial.size = params.rainSize;
        rainMaterial.opacity = params.rainOpacity;
      }
      if (cloudMaterial) {
        cloudMaterial.opacity = params.cloudOpacity;
      }
      if (ambient) ambient.intensity = params.ambientIntensity;
      if (directionalLight) directionalLight.intensity = params.dirLightIntensity;
      if (renderer) renderer.toneMappingExposure = params.toneMappingExposure;
      if (scene && scene.fog) scene.fog.density = params.fogDensity;

      // 4. Update lil-gui controls
      if (typeof gui !== 'undefined' && gui) {
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      }
    }

    // Click Detection (Distinguish genuine click from OrbitControls drag)
    window.addEventListener('pointerdown', (e) => {
      pointerDownPos.x = e.clientX;
      pointerDownPos.y = e.clientY;
    });

    window.addEventListener('pointerup', (e) => {
      if (e.target.closest('.lil-gui')) return;
      const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
      if (dist < 6 && params.clickToRandomize) {
        randomizeScene();
      }
    });

    // =========================================================================
    // INITIALIZE SCENE & CONTROLS
    // =========================================================================
    init();

    // =========================================================================
    // LIL-GUI CONTROL SETUP
    // Standard unstyled lil-gui
    // =========================================================================
    gui = new GUI({ title: 'Realistic Rain & Storm' });

    // 1. Color Schemes & Greenscreen
    const fColor = gui.addFolder('🎨 Color & Theme');
    fColor.add(params, 'theme', Object.keys(PALETTES)).name('Color Scheme').onChange(applyColorScheme);
    fColor.add(params, 'greenScreen').name('Green Screen (#00ff00)').onChange(setGreenScreen);
    fColor.addColor(params, 'bgColor').name('Background Color').onChange(c => {
      if (!params.greenScreen) {
        scene.background.set(c);
      }
    });
    fColor.addColor(params, 'fogColor').name('Fog Color').onChange(c => {
      if (!params.greenScreen) {
        scene.fog.color.set(c);
        renderer.setClearColor(c, 1);
      }
    });
    fColor.addColor(params, 'cloudColor').name('Cloud Color').onChange(c => {
      if (cloudMaterial) cloudMaterial.color.set(c);
    });
    fColor.addColor(params, 'rainColor').name('Rain Color').onChange(c => {
      if (rainMaterial) rainMaterial.color.set(c);
    });
    fColor.addColor(params, 'flashColor').name('Lightning Color').onChange(c => {
      if (flash) flash.color.set(c);
    });
    fColor.addColor(params, 'ambientColor').name('Ambient Color').onChange(c => {
      if (ambient) ambient.color.set(c);
    });
    fColor.addColor(params, 'dirLightColor').name('Directional Color').onChange(c => {
      if (directionalLight) directionalLight.color.set(c);
    });

    // 2. Camera & Animations
    const fAnim = gui.addFolder('🎬 Camera & Motion');
    fAnim.add(params, 'animationMode', ANIMATION_OPTIONS).name('Camera Mode');
    fAnim.add(params, 'animSpeed', 0.0, 3.0, 0.05).name('Global Speed');
    fAnim.add(params, 'autoOrbitSpeed', 0.0, 3.0, 0.05).name('Orbit Velocity');
    fAnim.add({ resetCamera: () => {
      camera.position.set(0, 100, 260);
      controls.target.set(0, 260, -100);
      controls.update();
    }}, 'resetCamera').name('Reset Camera View');

    // 3. Lighting & Exposure
    const fLight = gui.addFolder('💡 Lighting & Exposure');
    fLight.add(params, 'toneMappingExposure', 0.2, 3.0, 0.05).name('Scene Exposure').onChange(v => {
      renderer.toneMappingExposure = v;
    });
    fLight.add(params, 'ambientIntensity', 0.0, 2.5, 0.05).name('Ambient Light').onChange(v => {
      if (ambient) ambient.intensity = v;
    });
    fLight.add(params, 'dirLightIntensity', 0.0, 4.0, 0.1).name('Directional Light').onChange(v => {
      if (directionalLight) directionalLight.intensity = v;
    });
    fLight.add(params, 'flashIntensity', 100, 3000, 50).name('Lightning Peak Power');
    fLight.add(params, 'flashFrequency', 0.01, 0.3, 0.01).name('Flash Frequency');
    fLight.add({ triggerLightning: () => {
      triggerStrike();
    }}, 'triggerLightning').name('⚡ Strike Lightning Now');

    // 4. Storm & Particle Settings
    const fStorm = gui.addFolder('🌧️ Storm Environment');
    fStorm.add(params, 'rainSpeed', 50, 600, 10).name('Rain Fall Speed');
    fStorm.add(params, 'rainSize', 0.05, 0.6, 0.01).name('Raindrop Size').onChange(v => {
      if (rainMaterial) rainMaterial.size = v;
    });
    fStorm.add(params, 'rainOpacity', 0.1, 1.0, 0.02).name('Rain Opacity').onChange(v => {
      if (rainMaterial) rainMaterial.opacity = v;
    });
    fStorm.add(params, 'windSpeed', -80, 80, 2).name('Wind Drift');
    fStorm.add(params, 'cloudSpeed', 0.0002, 0.01, 0.0002).name('Cloud Swirl Speed');
    fStorm.add(params, 'cloudOpacity', 0.1, 1.0, 0.02).name('Cloud Opacity').onChange(v => {
      if (cloudMaterial) cloudMaterial.opacity = v;
    });
    fStorm.add(params, 'fogDensity', 0.0005, 0.008, 0.0002).name('Fog Density').onChange(v => {
      scene.fog.density = v;
    });

    // 5. Quality & Display Settings
    const fDisplay = gui.addFolder('⚙️ Quality & Graphics');
    fDisplay.add(params, 'pixelRatio', 0.5, 3.0, 0.25).name('Pixel Ratio (DPR)').onChange(v => {
      renderer.setPixelRatio(v);
    });
    fDisplay.add(params, 'antialias').name('Antialiasing').onChange(updateAntialias);

    // 6. Procedural Variation on Click
    const fRandom = gui.addFolder('🎲 Procedural Variation');
    fRandom.add(params, 'clickToRandomize').name('Click Scene: Re-roll');
    fRandom.add({ triggerRandom: randomizeScene }, 'triggerRandom').name('Randomize Now');

    // Hide/Show GUI with 'H' Key
    window.addEventListener('keydown', (e) => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
      if (e.key === 'h' || e.key === 'H') {
        gui._hidden ? gui.show() : gui.hide();
      }
    });

    // =========================================================================
    // LIGHTNING STRIKE LOGIC
    // =========================================================================
    function triggerStrike() {
      flash.position.set(
        (Math.random() - 0.5) * 600,
        360 + Math.random() * 180,
        -100 + (Math.random() - 0.5) * 300
      );
      flashCurrentIntensity = params.flashIntensity * (0.8 + Math.random() * 0.5);

      if (!params.greenScreen) {
        scene.fog.color.lerp(new THREE.Color(params.flashColor), 0.4);
      }
    }

    function updateLightning(dt) {
      if (Math.random() < params.flashFrequency * dt * 60 && flashCurrentIntensity < 60) {
        triggerStrike();
      }

      if (flashCurrentIntensity > 1.0) {
        flashCurrentIntensity *= Math.pow(0.80, dt * 60);

        // Multi-strike flicker
        if (Math.random() < 0.16 && flashCurrentIntensity > 120) {
          flashCurrentIntensity += params.flashIntensity * 0.35;
        }
      } else {
        flashCurrentIntensity = 0;
        if (!params.greenScreen) {
          scene.fog.color.lerp(new THREE.Color(params.fogColor), dt * 6);
        }
      }

      flash.intensity = flashCurrentIntensity;
    }

    // =========================================================================
    // CAMERA MOTION CONTROLLER
    // Preserves user zoom & interactive orbit orientation seamlessly
    // =========================================================================
    function updateCameraMotion(delta) {
      if (params.animationMode === 'Static View (No Movement)') {
        return;
      }

      const speedFactor = params.animSpeed * params.autoOrbitSpeed;
      const dt = delta * speedFactor;
      animClock += dt;

      const offset = camera.position.clone().sub(controls.target);
      const currentDist = offset.length();
      if (currentDist < 0.001) return;

      const up = new THREE.Vector3(0, 1, 0);

      if (params.animationMode === 'Slow Atmospheric Orbit') {
        offset.applyAxisAngle(up, dt * 0.15);
        camera.position.copy(controls.target).add(offset);
      }
      else if (params.animationMode === 'Gentle Cloud Breathing') {
        const yawDelta = Math.sin(animClock * 0.4) * 0.0016;
        const right = new THREE.Vector3().crossVectors(up, offset).normalize();
        const pitchDelta = Math.cos(animClock * 0.3) * 0.0011;

        offset.applyAxisAngle(up, yawDelta);
        if (right.lengthSq() > 0.001) {
          offset.applyAxisAngle(right, pitchDelta);
        }
        offset.normalize().multiplyScalar(currentDist);
        camera.position.copy(controls.target).add(offset);
      }
      else if (params.animationMode === 'Subtle Rain Drift') {
        const yawRate = Math.cos(animClock * 0.28) * dt * 0.14;
        offset.applyAxisAngle(up, yawRate);
        camera.position.copy(controls.target).add(offset);
      }
      else if (params.animationMode === 'Low-Horizon Storm Sweep') {
        offset.applyAxisAngle(up, dt * 0.12);
        camera.position.copy(controls.target).add(offset);
      }
      else if (params.animationMode === 'Thunderhead Panorama') {
        const panYaw = Math.sin(animClock * 0.32) * dt * 0.18;
        offset.applyAxisAngle(up, panYaw);
        camera.position.copy(controls.target).add(offset);
      }
      else if (params.animationMode === 'Vertical Downpour Scan') {
        const vertPitch = Math.sin(animClock * 0.45) * 0.0018;
        const right = new THREE.Vector3().crossVectors(up, offset).normalize();
        if (right.lengthSq() > 0.001) {
          offset.applyAxisAngle(right, vertPitch);
        }
        offset.normalize().multiplyScalar(currentDist);
        camera.position.copy(controls.target).add(offset);
      }
      else if (params.animationMode === 'Smooth Figure-8 Storm Flight') {
        const figYaw = Math.sin(animClock * 0.3) * 0.0022;
        const right = new THREE.Vector3().crossVectors(up, offset).normalize();
        const figPitch = Math.cos(animClock * 0.6) * 0.0015;

        offset.applyAxisAngle(up, figYaw);
        if (right.lengthSq() > 0.001) {
          offset.applyAxisAngle(right, figPitch);
        }
        offset.normalize().multiplyScalar(currentDist);
        camera.position.copy(controls.target).add(offset);
      }
    }

    // =========================================================================
    // MAIN ANIMATION LOOP
    // Infinite Auto Animation
    // =========================================================================
    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const effectiveDt = delta * params.animSpeed;

      // 1. Update Camera Motion & OrbitControls
      updateCameraMotion(delta);
      controls.update();

      // 2. Rotate Cloud Deck with swirling turbulence
      cloudParticles.forEach((p, idx) => {
        const dir = (idx % 2 === 0) ? 1 : -0.7;
        p.rotation.z -= params.cloudSpeed * dir * effectiveDt * 60;
      });

      // 3. Fall & Wrap Rain Particles
      if (rainGeo) {
        const positions = rainGeo.attributes.position.array;
        const fallStep = params.rainSpeed * effectiveDt;
        const windStep = params.windSpeed * effectiveDt;

        for (let i = 0; i < params.rainCount; i++) {
          const idx = i * 3;
          positions[idx + 1] -= fallStep;
          positions[idx + 0] -= windStep;
          positions[idx + 2] -= windStep * 0.3;

          // Infinite wrap bounds
          if (positions[idx + 1] < -200) {
            positions[idx + 1] = 460 + Math.random() * 60;
            positions[idx + 0] = (Math.random() - 0.5) * 600;
            positions[idx + 2] = (Math.random() - 0.5) * 600 - 50;
          }
        }
        rainGeo.attributes.position.needsUpdate = true;
      }

      // 4. Update Thunderstorm Lightning Flash
      updateLightning(effectiveDt);

      // 5. Render Scene
      renderer.render(scene, camera);
    }

    // Window Resize Handler
    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
  </script>
</body>
