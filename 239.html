    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",

  <body>
    <script type="module">
      import * as THREE from 'three';
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
      import GUI from 'lil-gui';

      // =========================================================================================
      // POST PROCESSOR SUITE (Inlined from postprocessing/PostProcessor.js + Fisheye)
      // =========================================================================================
      const orthoVertexShader = `
        precision highp float;
        in vec3 position;
        out vec2 vUv;
        void main() {
          vUv = position.xy * 0.5 + 0.5;
          gl_Position = vec4(position, 1.0);
        }
      `;

      const brightFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        uniform float bloomThreshold;
        in vec2 vUv;
        out vec4 fragColor;

        void main() {
          vec4 color = texture(inputTexture, vUv);
          float luminance = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
          float knee = 0.1;
          float soft = luminance - bloomThreshold + knee;
          soft = clamp(soft, 0.0, 2.0 * knee);
          soft = (soft * soft) / (4.0 * knee + 0.00001);
          float contribution = max(soft, luminance - bloomThreshold);
          contribution /= max(luminance, 0.00001);
          fragColor = vec4(color.rgb * contribution, color.a);
        }
      `;

      const blur13ShaderChunk = `
        vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
          vec2 resolution = vec2(textureSize(image, 0));
          vec4 color = vec4(0.0);
          vec2 off1 = vec2(1.411764705882353) * direction;
          vec2 off2 = vec2(3.2941176470588234) * direction;
          vec2 off3 = vec2(5.176470588235294) * direction;
          color += texture(image, uv) * 0.1964825501511404;
          color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
          color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
          color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
          color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
          color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
          color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
          return color;
        }
      `;

      const blurFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        uniform vec2 direction;
        in vec2 vUv;
        out vec4 color;
        ${blur13ShaderChunk}
        void main() {
          color = blur13(inputTexture, vUv, direction);
        }
      `;

      const finalFragmentShader = `
        precision highp float;
        uniform vec2 resolution;
        uniform sampler2D inputTexture;
        uniform sampler2D blur0Texture;
        uniform sampler2D blur1Texture;
        uniform sampler2D blur2Texture;
        uniform sampler2D blur3Texture;
        uniform sampler2D blur4Texture;
        uniform bool bloomEnabled;
        uniform float bloomStrength;
        uniform float vignetteBoost;
        uniform float vignetteReduction;
        uniform float noiseIntensity;
        uniform float time;
        in vec2 vUv;
        out vec4 fragColor;

        float vignette(vec2 uv, float boost, float reduction) {
          vec2 position = vUv - 0.5;
          return boost - length(position) * reduction;
        }

        float hash1(uint n) {
          n = (n << 13U) ^ n;
          n = n * (n * n * 15731U + 789221U) + 1376312589U;
          return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
        }

        float noise(in vec2 uv, in float timeVal) {
          uvec2 p = uvec2(uv);
          return hash1(p.x + 1920U * p.y + (1920U * 1080U) * uint(timeVal));
        }

        void main() {
          vec4 color = texture(inputTexture, vUv);

          if (bloomEnabled && bloomStrength > 0.001) {
            vec4 b0 = texture(blur0Texture, vUv);
            vec4 b1 = texture(blur1Texture, vUv);
            vec4 b2 = texture(blur2Texture, vUv);
            vec4 b3 = texture(blur3Texture, vUv);
            vec4 b4 = texture(blur4Texture, vUv);

            vec4 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
            color += bloomSum * bloomStrength;
          }

          color.rgb *= vignette(vUv, vignetteBoost, vignetteReduction);
          color.rgb += noiseIntensity * noise(gl_FragCoord.xy, time);
          fragColor = vec4(color.rgb, 1.0);
        }
      `;

      const chromaticAberrationShaderChunk = `
        vec2 barrelDistortion(vec2 coord, float amt) {
          vec2 cc = coord - 0.5;
          float dist = dot(cc, cc);
          return coord + cc * dist * amt;
        }
        float sat(float t) { return clamp(t, 0.0, 1.0); }
        float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
        float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
        vec4 spectrum_offset(float t) {
          float lo = step(t, 0.5);
          float hi = 1.0 - lo;
          float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
          vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
          return pow(ret, vec4(1.0 / 2.2));
        }
        const float max_distort = 2.2;
        const int num_iter = 8;
        const float reci_num_iter_f = 1.0 / float(num_iter);
        vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
          vec4 sumcol = vec4(0.0);
          vec4 sumw = vec4(0.0);
          for (int i = 0; i < num_iter; ++i) {
            float t = float(i) * reci_num_iter_f;
            vec4 w = spectrum_offset(t);
            sumw += w;
            sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
          }
          return sumcol / sumw;
        }
      `;

      const colorFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        uniform float chromaticAberrationAmount;
        uniform float minInputLevel;
        uniform float maxInputLevel;
        uniform float gammaLevel;
        uniform float fisheyeStrength;
        uniform float fisheyeRadius;
        uniform float time;
        in vec2 vUv;
        out vec4 fragColor;

        ${chromaticAberrationShaderChunk}

        vec2 applyFisheye(vec2 uv, float strength, float radius) {
          if (abs(strength) < 0.0001) return uv;
          vec2 p = uv - 0.5;
          float d = length(p);
          if (d > radius * 1.5) return uv;
          float r = d / max(radius, 0.001);
          float theta = atan(p.y, p.x);
          float rDist = r + strength * (r * r * r);
          return 0.5 + vec2(cos(theta), sin(theta)) * (rDist * radius);
        }

        vec3 gammaCorrect(vec3 color, vec3 gamma) {
          return pow(max(color, vec3(0.0)), 1.0 / gamma);
        }
        vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
          return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
        }
        vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
          return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
        }
        void main() {
          vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
          fragColor = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
          fragColor.rgb = finalLevels(fragColor.rgb, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
          fragColor.a = 1.0;
        }
      `;

      const copyFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        in vec2 vUv;
        out vec4 fragColor;
        void main() {
          fragColor = texture(inputTexture, vUv);
        }
      `;

      function createFBO(w, h, options = {}) {
        return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
          wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
          wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
          minFilter: options.minFilter || THREE.LinearFilter,
          magFilter: options.magFilter || THREE.LinearFilter,
          format: options.format || THREE.RGBAFormat,
          type: options.type || THREE.HalfFloatType,
          stencilBuffer: options.stencilBuffer || false,
          depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : true,
          samples: options.samples || 0,
        });
      }

      class ShaderPass {
        constructor(shader, options = {}) {
          this.shader = shader;
          this.orthoScene = new THREE.Scene();
          this.fbo = createFBO(1, 1, options);
          this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
          this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
          this.orthoScene.add(this.orthoQuad);
          this.texture = this.fbo.texture;
        }
        render(renderer, toScreen = false) {
          if (!toScreen) {
            renderer.setRenderTarget(this.fbo);
          }
          renderer.render(this.orthoScene, this.orthoCamera);
          if (!toScreen) {
            renderer.setRenderTarget(null);
          }
        }
        setSize(width, height) {
          this.fbo.setSize(Math.max(1, width), Math.max(1, height));
          this.orthoQuad.scale.set(width, height, 1);
        }
      }

      class ShaderPingPongPass {
        constructor(shader, options = {}) {
          this.shader = shader;
          this.orthoScene = new THREE.Scene();
          this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
          this.currentFBO = 0;
          this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
          this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
          this.orthoScene.add(this.orthoQuad);
        }
        render(renderer) {
          renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
          renderer.render(this.orthoScene, this.orthoCamera);
          renderer.setRenderTarget(null);
          this.currentFBO = 1 - this.currentFBO;
        }
        get current() { return this.fbos[this.currentFBO]; }
        get texture() { return this.current.texture; }
        setSize(width, height) {
          const w = Math.max(1, width);
          const h = Math.max(1, height);
          this.orthoQuad.scale.set(w, h, 1);
          this.fbos[0].setSize(w, h);
          this.fbos[1].setSize(w, h);
        }
      }

      class BloomPass {
        constructor(strength = 0.8, radius = 0.5, threshold = 0.2, levels = 5) {
          this.strength = strength;
          this.radius = radius;
          this.threshold = threshold;
          this.enabled = true;
          this.levels = levels;

          this.brightShader = new THREE.RawShaderMaterial({
            uniforms: {
              inputTexture: { value: null },
              bloomThreshold: { value: this.threshold },
            },
            vertexShader: orthoVertexShader,
            fragmentShader: brightFragmentShader,
            glslVersion: THREE.GLSL3,
          });
          this.brightPass = new ShaderPass(this.brightShader, {
            format: THREE.RGBAFormat,
            type: THREE.HalfFloatType,
          });

          this.blurShader = new THREE.RawShaderMaterial({
            uniforms: {
              inputTexture: { value: null },
              direction: { value: new THREE.Vector2(0, 1) },
            },
            vertexShader: orthoVertexShader,
            fragmentShader: blurFragmentShader,
            glslVersion: THREE.GLSL3,
          });

          this.blurPasses = [];
          for (let i = 0; i < this.levels; i++) {
            this.blurPasses.push(new ShaderPingPongPass(this.blurShader, {
              format: THREE.RGBAFormat,
              type: THREE.HalfFloatType,
            }));
          }
        }

        setSize(w, h) {
          let tw = Math.max(1, w);
          let th = Math.max(1, h);
          this.brightPass.setSize(tw, th);
          for (let i = 0; i < this.levels; i++) {
            tw = Math.max(1, Math.round(tw / 2));
            th = Math.max(1, Math.round(th / 2));
            this.blurPasses[i].setSize(tw, th);
          }
        }

        set source(texture) {
          this.brightShader.uniforms.inputTexture.value = texture;
        }

        render(renderer) {
          if (!this.enabled || this.strength <= 0.001) return;

          this.brightShader.uniforms.bloomThreshold.value = this.threshold;
          this.brightPass.render(renderer);

          const baseOffset = Math.max(0.1, this.radius * 2.0);
          const u = this.blurShader.uniforms;

          for (let j = 0; j < this.levels; j++) {
            const blurPass = this.blurPasses[j];
            const stepOffset = baseOffset * (1.0 + j * 0.5);

            u.direction.value.set(stepOffset, 0);
            u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
            blurPass.render(renderer);

            u.direction.value.set(0, stepOffset * 0.5);
            u.inputTexture.value = blurPass.current.texture;
            blurPass.render(renderer);
          }
        }
      }

      class PostProcessor {
        constructor(renderer, params = {}) {
          this.renderer = renderer;

          this.settings = {
            // Global Switch (OFF by default as requested)
            enabled: params.enabled !== undefined ? params.enabled : false,

            // 1. Universal 3-Param Bloom Engine
            bloomEnabled: params.bloomEnabled !== undefined ? params.bloomEnabled : true,
            bloomStrength: params.bloomStrength !== undefined ? params.bloomStrength : 1.2,
            bloomRadius: params.bloomRadius !== undefined ? params.bloomRadius : 0.65,
            bloomThreshold: params.bloomThreshold !== undefined ? params.bloomThreshold : 0.15,

            // 2. Lens & Camera Optics + Fisheye
            fisheyeStrength: params.fisheyeStrength !== undefined ? params.fisheyeStrength : 0.0,
            fisheyeRadius: params.fisheyeRadius !== undefined ? params.fisheyeRadius : 1.0,
            chromaticAberration: params.chromaticAberration !== undefined ? params.chromaticAberration : 0.035,
            vignetteBoost: params.vignetteBoost !== undefined ? params.vignetteBoost : 1.0,
            vignetteReduction: params.vignetteReduction !== undefined ? params.vignetteReduction : 0.45,
            noiseIntensity: params.noiseIntensity !== undefined ? params.noiseIntensity : 0.018,

            // 3. Color Grading & Tone
            gamma: params.gamma !== undefined ? params.gamma : 1.0,
            minInputLevel: params.minInputLevel !== undefined ? params.minInputLevel : 0.0,
            maxInputLevel: params.maxInputLevel !== undefined ? params.maxInputLevel : 1.0,
          };

          this.sceneTarget = createFBO(1, 1, { type: THREE.HalfFloatType });

          this.bloomPass = new BloomPass(
            this.settings.bloomStrength,
            this.settings.bloomRadius,
            this.settings.bloomThreshold,
            5
          );

          this.finalShader = new THREE.RawShaderMaterial({
            uniforms: {
              resolution: { value: new THREE.Vector2(1, 1) },
              bloomEnabled: { value: this.settings.bloomEnabled },
              bloomStrength: { value: this.settings.bloomStrength },
              vignetteBoost: { value: this.settings.vignetteBoost },
              vignetteReduction: { value: this.settings.vignetteReduction },
              noiseIntensity: { value: this.settings.noiseIntensity },
              inputTexture: { value: null },
              blur0Texture: { value: null },
              blur1Texture: { value: null },
              blur2Texture: { value: null },
              blur3Texture: { value: null },
              blur4Texture: { value: null },
              time: { value: 0 },
            },
            vertexShader: orthoVertexShader,
            fragmentShader: finalFragmentShader,
            glslVersion: THREE.GLSL3,
          });
          this.finalPass = new ShaderPass(this.finalShader);

          this.rgbShader = new THREE.RawShaderMaterial({
            uniforms: {
              inputTexture: { value: this.finalPass.texture },
              fisheyeStrength: { value: this.settings.fisheyeStrength },
              fisheyeRadius: { value: this.settings.fisheyeRadius },
              chromaticAberrationAmount: { value: this.settings.chromaticAberration },
              minInputLevel: { value: this.settings.minInputLevel },
              maxInputLevel: { value: this.settings.maxInputLevel },
              gammaLevel: { value: this.settings.gamma },
              time: { value: 0 },
            },
            vertexShader: orthoVertexShader,
            fragmentShader: colorFragmentShader,
            glslVersion: THREE.GLSL3,
          });
          this.rgbPass = new ShaderPass(this.rgbShader);

          this.copyShader = new THREE.RawShaderMaterial({
            uniforms: {
              inputTexture: { value: null },
            },
            vertexShader: orthoVertexShader,
            fragmentShader: copyFragmentShader,
            glslVersion: THREE.GLSL3,
          });
          this.copyPass = new ShaderPass(this.copyShader);
        }

        updateSettings() {
          this.bloomPass.enabled = this.settings.bloomEnabled;
          this.bloomPass.strength = this.settings.bloomStrength;
          this.bloomPass.radius = this.settings.bloomRadius;
          this.bloomPass.threshold = this.settings.bloomThreshold;

          this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
          this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
          this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
          this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
          this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;

          this.rgbShader.uniforms.fisheyeStrength.value = this.settings.fisheyeStrength;
          this.rgbShader.uniforms.fisheyeRadius.value = this.settings.fisheyeRadius;
          this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
          this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
          this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
          this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
        }

        setSize(w0, h0, dpr = 1) {
          const w = Math.max(1, Math.floor(w0 * dpr));
          const h = Math.max(1, Math.floor(h0 * dpr));
          this.sceneTarget.setSize(w, h);
          this.finalPass.setSize(w, h);
          this.finalShader.uniforms.resolution.value.set(w, h);
          this.bloomPass.setSize(w, h);
          this.rgbPass.setSize(w, h);
          this.copyPass.setSize(w, h);
        }

        renderScene(scene, camera) {
          if (!this.settings.enabled) {
            this.renderer.render(scene, camera);
            return;
          }
          this.renderer.setRenderTarget(this.sceneTarget);
          this.renderer.render(scene, camera);
          this.renderer.setRenderTarget(null);
          this.render(this.sceneTarget.texture);
        }

        render(sourceTexture) {
          if (!this.settings.enabled) {
            this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
            this.copyPass.render(this.renderer, true);
            return;
          }

          this.updateSettings();

          this.bloomPass.source = sourceTexture;
          this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
          this.bloomPass.render(this.renderer);

          this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
          this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
          this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
          this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
          this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

          const randomTime = Math.random() * 100000;
          this.finalPass.shader.uniforms.time.value = randomTime;
          this.rgbPass.shader.uniforms.time.value = randomTime;

          this.finalPass.render(this.renderer);
          this.rgbPass.render(this.renderer, true);
        }

        attachGUI(gui, title = "Post-Processing Suite") {
          const root = gui.addFolder(title);
          root.add(this.settings, "enabled").name("Enable Post-Processing");

          const bloom = root.addFolder("Bloom (Glow)");
          bloom.add(this.settings, "bloomEnabled").name("Enable Bloom").onChange(() => this.updateSettings());
          bloom.add(this.settings, "bloomStrength", 0, 4.0, 0.05).name("Strength").onChange(() => this.updateSettings());
          bloom.add(this.settings, "bloomRadius", 0, 2.0, 0.05).name("Radius").onChange(() => this.updateSettings());
          bloom.add(this.settings, "bloomThreshold", 0, 1.0, 0.01).name("Threshold").onChange(() => this.updateSettings());

          const lens = root.addFolder("Lens, Optics & Fisheye");
          lens.add(this.settings, "fisheyeStrength", -1.0, 1.5, 0.01).name("Fisheye Distortion").onChange(() => this.updateSettings());
          lens.add(this.settings, "fisheyeRadius", 0.2, 2.0, 0.05).name("Fisheye Radius").onChange(() => this.updateSettings());
          lens.add(this.settings, "chromaticAberration", 0, 0.2, 0.005).name("Chromatic Aberration").onChange(() => this.updateSettings());
          lens.add(this.settings, "vignetteBoost", 0, 2.0, 0.05).name("Vignette Boost").onChange(() => this.updateSettings());
          lens.add(this.settings, "vignetteReduction", 0, 2.0, 0.05).name("Vignette Falloff").onChange(() => this.updateSettings());
          lens.add(this.settings, "noiseIntensity", 0, 0.1, 0.005).name("Film Grain").onChange(() => this.updateSettings());
          lens.add(this.settings, "gamma", 0.2, 2.0, 0.05).name("Gamma").onChange(() => this.updateSettings());
          lens.add(this.settings, "minInputLevel", 0, 0.5, 0.01).name("Black Level").onChange(() => this.updateSettings());
          lens.add(this.settings, "maxInputLevel", 0.5, 1.0, 0.01).name("White Level").onChange(() => this.updateSettings());

          return root;
        }
      }

      // =========================================================================================
      // 5 CURATED PRESET COLOR SCHEMES (Biological Roots / Neural / Veins)
      // =========================================================================================

          colorSignal3: '#ff1493',
          colorSignal4: '#7b2cbf',
          colorNode: '#f0f8ff'
        }
      };

      // =========================================================================================
      // CONFIGURATION & SIMULATION PARAMETERS
      // =========================================================================================
      const settings = {
        // Theme & Presets
        theme: 'Bio-Neural Synapse',
        animationPreset: 'Static Sanctuary',
        clickToRandomize: true,

        // Background & Display
        colorBg: COLOR_PALETTES['Bio-Neural Synapse'].colorBg,
        greenScreen: false,
        dpr: Math.min(window.devicePixelRatio || 1, 2),

        // Color Settings
        colorLine: COLOR_PALETTES['Bio-Neural Synapse'].colorLine,
        colorSignal1: COLOR_PALETTES['Bio-Neural Synapse'].colorSignal1,
        colorSignal2: COLOR_PALETTES['Bio-Neural Synapse'].colorSignal2,
        colorSignal3: COLOR_PALETTES['Bio-Neural Synapse'].colorSignal3,
        colorSignal4: COLOR_PALETTES['Bio-Neural Synapse'].colorSignal4,
        colorNode: COLOR_PALETTES['Bio-Neural Synapse'].colorNode,

        // Branch Geometry (Roots / Neural Network)
        treeClusters: 3,
        maxBranchDepth: 4,
        branchCurvature: 1.2,
        branchJitter: 0.35,
        trunkLength: 26,
        spreadRadius: 36,
        lineOpacity: 0.55,
        segmentResolution: 18,

        // Organic Motion & Waves
        waveSpeed: 1.4,
        waveHeight: 0.35,
        breathingSpeed: 0.8,
        breathingAmount: 0.08,

        // Signal Action Potentials (Particles)
        signalCount: 160,
        speedGlobal: 0.85,
        trailLength: 16,
        signalBrightness: 1.8,

        // Ambient Spores / Vesicles
        sporeCount: 350,
        sporeSize: 2.2,
        sporeSpeed: 0.4,

        // Camera Placement and Spherical Coordinates
        camPosX: 0.0,
        camPosY: 4.0,
        camPosZ: 82.0,
        targetX: 0.0,
        targetY: 6.0,
        targetZ: 0.0,
        fov: 50.0,
        polarAngle: 85.0,
        azimuthAngle: 0.0,
        camDistance: 82.0,

        // Interaction Parameters
        rotateSpeed: 1.0,
        panSpeed: 1.0,
        zoomSpeed: 1.2,
        dampingFactor: 0.05,
        autoRotate: false,
        autoRotateSpeed: 1.0,
      };

      // =========================================================================================
      // THREE.JS SCENE SETUP
      // =========================================================================================
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(settings.colorBg);
      scene.fog = new THREE.FogExp2(settings.colorBg, 0.005);

      const perspectiveCamera = new THREE.PerspectiveCamera(settings.fov, window.innerWidth / window.innerHeight, 0.5, 1000);
      perspectiveCamera.position.set(settings.camPosX, settings.camPosY, settings.camPosZ);

      const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(settings.dpr);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.2;
      document.body.appendChild(renderer.domElement);

      const controls = new OrbitControls(perspectiveCamera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = settings.dampingFactor;
      controls.rotateSpeed = settings.rotateSpeed;
      controls.panSpeed = settings.panSpeed;
      controls.zoomSpeed = settings.zoomSpeed;
      controls.target.set(settings.targetX, settings.targetY, settings.targetZ);
      controls.autoRotate = settings.autoRotate;
      controls.autoRotateSpeed = settings.autoRotateSpeed;
      controls.update();
      perspectiveCamera.updateMatrixWorld(true);

      const postProcessor = new PostProcessor(renderer, {
        enabled: false,
        bloomStrength: 1.2,
        bloomRadius: 0.65,
        bloomThreshold: 0.15,
        fisheyeStrength: 0.0,
        fisheyeRadius: 1.0,
        chromaticAberration: 0.035,
        vignetteBoost: 1.0,
        vignetteReduction: 0.45,
        noiseIntensity: 0.015
      });
      postProcessor.setSize(window.innerWidth, window.innerHeight, settings.dpr);

      // Dedicated Shader Uniforms for Camera & Scene Sync
      const globalShaderUniforms = {
        uTime: { value: 0 },
        uCameraPos: { value: new THREE.Vector3() },
        uCameraWorldMatrix: { value: new THREE.Matrix4() },
        uFov: { value: settings.fov },
        uResolution: { value: new THREE.Vector2(window.innerWidth * settings.dpr, window.innerHeight * settings.dpr) },
        uGreenScreen: { value: 0.0 },
        uColorBg: { value: new THREE.Color(settings.colorBg) },
        uColorLine: { value: new THREE.Color(settings.colorLine) },
        uColorNode: { value: new THREE.Color(settings.colorNode) },
        uWaveSpeed: { value: settings.waveSpeed },
        uWaveHeight: { value: settings.waveHeight }
      };

      // Content Root Group
      const treeGroup = new THREE.Group();
      scene.add(treeGroup);

      // =========================================================================================
      // ORGANIC BRANCHING TREE DATA STRUCTURE (Recursive Splines & Graph)
      // =========================================================================================
      let allBranches = [];
      let rootBranches = [];
      let backgroundLineMeshes = [];
      let signalParticles = [];
      let nodePointsMesh = null;
      let sporeParticlesMesh = null;

      const bgLineMaterial = new THREE.LineBasicMaterial({
        color: settings.colorLine,
        transparent: true,
        opacity: settings.lineOpacity,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      const signalMaterial = new THREE.LineBasicMaterial({
        vertexColors: true,
        blending: THREE.AdditiveBlending,
        transparent: true,
        depthWrite: false,
        depthTest: false
      });

      // Soft circular glow texture for synaptic junction nodes & spores
      function createSoftGlowTexture() {
        const size = 64;
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        const grad = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
        grad.addColorStop(0.0, 'rgba(255, 255, 255, 1.0)');
        grad.addColorStop(0.2, 'rgba(255, 255, 255, 0.85)');
        grad.addColorStop(0.55, 'rgba(255, 255, 255, 0.25)');
        grad.addColorStop(1.0, 'rgba(255, 255, 255, 0.0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, size, size);
        const texture = new THREE.CanvasTexture(canvas);
        texture.generateMipmaps = false;
        texture.minFilter = THREE.LinearFilter;
        return texture;
      }
      const glowSpriteTexture = createSoftGlowTexture();

      class Branch {
        constructor(startPoint, startDir, depth, maxDepth, length, seed) {
          this.depth = depth;
          this.maxDepth = maxDepth;
          this.children = [];
          this.parent = null;
          this.seed = seed;
          this.length = length;
          this.phase = Math.random() * Math.PI * 2;
          this.swayFactor = (depth + 1) / (maxDepth + 1);

          // Generate 3D control points with CatmullRomCurve3 and organic curl/jitter
          const controlPoints = [];
          const numControls = 5;
          let curPos = startPoint.clone();
          let curDir = startDir.clone().normalize();
          controlPoints.push(curPos.clone());

          const segmentLen = length / (numControls - 1);
          for (let i = 1; i < numControls; i++) {
            // Per-branch 3D jitter & organic curvature
            const jitterAngle = (Math.random() - 0.5) * settings.branchJitter * 1.5;
            const jitterAxis = new THREE.Vector3(
              (Math.random() - 0.5),
              (Math.random() - 0.5),
              (Math.random() - 0.5)
            ).normalize();

            curDir.applyAxisAngle(jitterAxis, jitterAngle);
            // Slight natural upward & outward curvature
            curDir.y += 0.08 * (1.0 - depth / maxDepth);
            curDir.normalize();

            curPos = curPos.clone().addScaledVector(curDir, segmentLen);
            controlPoints.push(curPos.clone());
          }

          this.curve = new THREE.CatmullRomCurve3(controlPoints, false, 'centripetal', 0.5);
          this.basePoints = this.curve.getPoints(settings.segmentResolution);
          this.endPoint = controlPoints[controlPoints.length - 1];
          this.endDir = curDir.clone();

          // Create background line geometry
          this.geometry = new THREE.BufferGeometry().setFromPoints(this.basePoints);
          this.lineMesh = new THREE.Line(this.geometry, bgLineMaterial);
          this.lineMesh.renderOrder = 0;

          // Recursively spawn 2-3 child branches at fork
          if (depth < maxDepth) {
            const numChildren = Math.floor(Math.random() * 2) + 2; // 2 or 3 children
            const forkOrigin = this.endPoint;

            for (let c = 0; c < numChildren; c++) {
              const spreadAngle = (0.45 + Math.random() * 0.4) * settings.branchCurvature;
              const angleOffset = (c / (numChildren - 1 || 1) - 0.5) * spreadAngle * 2;

              // Orthogonal basis for branching spread
              const up = Math.abs(this.endDir.y) < 0.9 ? new THREE.Vector3(0, 1, 0) : new THREE.Vector3(1, 0, 0);
              const right = new THREE.Vector3().crossVectors(this.endDir, up).normalize();
              const normal = new THREE.Vector3().crossVectors(this.endDir, right).normalize();

              const childDir = this.endDir.clone();
              const rotAxis = (c % 2 === 0) ? right : normal;
              childDir.applyAxisAngle(rotAxis, angleOffset + (Math.random() - 0.5) * 0.3);
              childDir.normalize();

              const childLength = length * (0.68 + Math.random() * 0.18);
              const child = new Branch(forkOrigin, childDir, depth + 1, maxDepth, childLength, seed + c * 10 + 1);
              child.parent = this;
              this.children.push(child);
            }
          }
        }

        collectAll(list) {
          list.push(this);
          for (let i = 0; i < this.children.length; i++) {
            this.children[i].collectAll(list);
          }
        }
      }

      function pickSignalColor() {
        const colors = [
          new THREE.Color(settings.colorSignal1),
          new THREE.Color(settings.colorSignal2),
          new THREE.Color(settings.colorSignal3),
          new THREE.Color(settings.colorSignal4)
        ];
        return colors[Math.floor(Math.random() * colors.length)];
      }

      function pickRandomRootBranch() {
        if (rootBranches.length === 0) return null;
        return rootBranches[Math.floor(Math.random() * rootBranches.length)];
      }

      function rebuildNeuralRoots() {
        // Dispose existing background lines
        backgroundLineMeshes.forEach(mesh => {
          treeGroup.remove(mesh);
          mesh.geometry.dispose();
        });
        backgroundLineMeshes = [];

        // Dispose existing signals
        signalParticles.forEach(sig => {
          treeGroup.remove(sig.mesh);
          sig.mesh.geometry.dispose();
        });
        signalParticles = [];

        if (nodePointsMesh) {
          treeGroup.remove(nodePointsMesh);
          nodePointsMesh.geometry.dispose();
          nodePointsMesh.material.dispose();
          nodePointsMesh = null;
        }

        allBranches = [];
        rootBranches = [];

        // Generate Multiple Tree Root / Neural Clusters
        const clusterCount = settings.treeClusters;
        for (let i = 0; i < clusterCount; i++) {
          const angle = (i / clusterCount) * Math.PI * 2 + (Math.random() - 0.5) * 0.4;
          const dist = (i === 0 && clusterCount > 1) ? 2.0 : (Math.random() * 8.0 + 4.0);
          const startX = Math.cos(angle) * dist;
          const startZ = Math.sin(angle) * dist;
          const startY = -22.0 + (Math.random() - 0.5) * 4.0;

          const startOrigin = new THREE.Vector3(startX, startY, startZ);
          const startDir = new THREE.Vector3(
            Math.cos(angle) * 0.25 + (Math.random() - 0.5) * 0.2,
            0.95 + Math.random() * 0.15,
            Math.sin(angle) * 0.25 + (Math.random() - 0.5) * 0.2
          ).normalize();

          const trunk = new Branch(startOrigin, startDir, 0, settings.maxBranchDepth, settings.trunkLength, i * 100);
          rootBranches.push(trunk);
          trunk.collectAll(allBranches);
        }

        // Add line meshes to scene
        allBranches.forEach(branch => {
          treeGroup.add(branch.lineMesh);
          backgroundLineMeshes.push(branch.lineMesh);
        });

        // Build Synaptic Junction Nodes (Branch Forks & Terminal Tips)
        const nodePositions = [];
        const nodeColors = [];
        const colNode = new THREE.Color(settings.colorNode);

        allBranches.forEach(branch => {
          nodePositions.push(branch.endPoint.x, branch.endPoint.y, branch.endPoint.z);
          const isTip = branch.children.length === 0;
          const tint = isTip ? pickSignalColor() : colNode;
          nodeColors.push(tint.r, tint.g, tint.b);
        });

        const nodeGeo = new THREE.BufferGeometry();
        nodeGeo.setAttribute('position', new THREE.Float32BufferAttribute(nodePositions, 3));
        nodeGeo.setAttribute('color', new THREE.Float32BufferAttribute(nodeColors, 3));

        const nodeMat = new THREE.PointsMaterial({
          size: 3.2,
          map: glowSpriteTexture,
          vertexColors: true,
          blending: THREE.AdditiveBlending,
          transparent: true,
          depthWrite: false
        });
        nodePointsMesh = new THREE.Points(nodeGeo, nodeMat);
        treeGroup.add(nodePointsMesh);

        // Build Signal Action Potentials (Traveling Bio-Pulses)
        rebuildSignals();
      }

      function rebuildSignals() {
        signalParticles.forEach(sig => {
          treeGroup.remove(sig.mesh);
          sig.mesh.geometry.dispose();
        });
        signalParticles = [];

        const maxTrail = 80;
        for (let i = 0; i < settings.signalCount; i++) {
          const geometry = new THREE.BufferGeometry();
          const positions = new Float32Array(maxTrail * 3);
          const colors = new Float32Array(maxTrail * 3);

          geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
          geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

          const mesh = new THREE.Line(geometry, signalMaterial);
          mesh.frustumCulled = false;
          mesh.renderOrder = 2;
          treeGroup.add(mesh);

          const startBranch = allBranches.length > 0
            ? allBranches[Math.floor(Math.random() * allBranches.length)]
            : pickRandomRootBranch();

          signalParticles.push({
            mesh,
            currentBranch: startBranch,
            progress: Math.random(),
            speed: 0.35 + Math.random() * 0.65,
            history: [],
            assignedColor: pickSignalColor()
          });
        }
      }

      // Build Ambient Drifting Spores / Vesicles
      function buildSpores() {
        if (sporeParticlesMesh) {
          scene.remove(sporeParticlesMesh);
          sporeParticlesMesh.geometry.dispose();
          sporeParticlesMesh.material.dispose();
        }

        const sporeGeo = new THREE.BufferGeometry();
        const sporePos = [];
        const sporeVel = [];
        const sporeColors = [];

        for (let i = 0; i < settings.sporeCount; i++) {
          const r = Math.random() * 45 + 5;
          const theta = Math.random() * Math.PI * 2;
          const y = (Math.random() - 0.4) * 60;
          sporePos.push(Math.cos(theta) * r, y, Math.sin(theta) * r);

          sporeVel.push(
            (Math.random() - 0.5) * 0.08,
            0.02 + Math.random() * 0.06,
            (Math.random() - 0.5) * 0.08
          );

          const col = pickSignalColor();
          sporeColors.push(col.r, col.g, col.b);
        }

        sporeGeo.setAttribute('position', new THREE.Float32BufferAttribute(sporePos, 3));
        sporeGeo.setAttribute('color', new THREE.Float32BufferAttribute(sporeColors, 3));
        sporeGeo.userData = { vel: sporeVel };

        const sporeMat = new THREE.PointsMaterial({
          size: settings.sporeSize,
          map: glowSpriteTexture,
          vertexColors: true,
          blending: THREE.AdditiveBlending,
          transparent: true,
          opacity: 0.75,
          depthWrite: false
        });

        sporeParticlesMesh = new THREE.Points(sporeGeo, sporeMat);
        scene.add(sporeParticlesMesh);
      }

      // =========================================================================================
      // THEME & COLOR PALETTE APPLICATION
      // =========================================================================================
      function setGreenScreen(enabled) {
        settings.greenScreen = enabled;
        const color = enabled ? '#00ff00' : settings.colorBg;
        document.body.style.backgroundColor = color;
        scene.background.set(color);
        scene.fog.color.set(color);
        renderer.setClearColor(color, 1);
        globalShaderUniforms.uGreenScreen.value = enabled ? 1.0 : 0.0;
        globalShaderUniforms.uColorBg.value.set(color);
      }

      function applyPalette(paletteName) {
        if (!COLOR_PALETTES[paletteName]) return;
        const pal = COLOR_PALETTES[paletteName];
        settings.theme = paletteName;
        settings.colorBg = pal.colorBg;
        settings.colorLine = pal.colorLine;
        settings.colorSignal1 = pal.colorSignal1;
        settings.colorSignal2 = pal.colorSignal2;
        settings.colorSignal3 = pal.colorSignal3;
        settings.colorSignal4 = pal.colorSignal4;
        settings.colorNode = pal.colorNode;

        if (!settings.greenScreen) {
          scene.background.set(settings.colorBg);
          scene.fog.color.set(settings.colorBg);
          document.body.style.backgroundColor = settings.colorBg;
          renderer.setClearColor(settings.colorBg, 1);
        }

        bgLineMaterial.color.set(settings.colorLine);
        globalShaderUniforms.uColorLine.value.set(settings.colorLine);
        globalShaderUniforms.uColorNode.value.set(settings.colorNode);

        // Update active signals with new palette
        signalParticles.forEach(sig => {
          sig.assignedColor = pickSignalColor();
        });

        if (gui) {
          gui.controllersRecursive().forEach(c => c.updateDisplay());
        }
      }

      // =========================================================================================
      // PROCEDURAL RANDOMIZER (Click to Randomize Scene)
      // =========================================================================================
      function hslToHex(h, s, l) {
        const c = new THREE.Color();
        c.setHSL(h, s, l);
        return '#' + c.getHexString();
      }

      function randomizeScene() {
        const themeKeys = Object.keys(COLOR_PALETTES);
        const usePreset = Math.random() < 0.6;

        if (usePreset) {
          const randTheme = themeKeys[Math.floor(Math.random() * themeKeys.length)];
          applyPalette(randTheme);
        } else {
          // Generate unique harmonious procedural palette
          const baseHue = Math.random();
          const compHue = (baseHue + 0.5) % 1.0;
          const triHue1 = (baseHue + 0.28) % 1.0;
          const triHue2 = (baseHue + 0.72) % 1.0;

          settings.colorBg = hslToHex(baseHue, 0.6, 0.03);
          settings.colorLine = hslToHex(compHue, 0.45, 0.18);
          settings.colorSignal1 = hslToHex(baseHue, 0.95, 0.55);
          settings.colorSignal2 = hslToHex(triHue1, 0.95, 0.6);
          settings.colorSignal3 = hslToHex(triHue2, 1.0, 0.58);
          settings.colorSignal4 = hslToHex((baseHue + 0.12) % 1.0, 0.9, 0.65);
          settings.colorNode = hslToHex(baseHue, 0.8, 0.75);

          if (!settings.greenScreen) {
            scene.background.set(settings.colorBg);
            scene.fog.color.set(settings.colorBg);
            document.body.style.backgroundColor = settings.colorBg;
            renderer.setClearColor(settings.colorBg, 1);
          }
          bgLineMaterial.color.set(settings.colorLine);
        }

        // Randomize Geometric & Dynamic Parameters
        settings.treeClusters = Math.floor(Math.random() * 3) + 2;
        settings.maxBranchDepth = Math.floor(Math.random() * 2) + 3;
        settings.branchCurvature = parseFloat((0.8 + Math.random() * 0.9).toFixed(2));
        settings.branchJitter = parseFloat((0.2 + Math.random() * 0.35).toFixed(2));
        settings.trunkLength = parseFloat((20 + Math.random() * 12).toFixed(1));
        settings.waveSpeed = parseFloat((0.8 + Math.random() * 1.8).toFixed(2));
        settings.waveHeight = parseFloat((0.15 + Math.random() * 0.45).toFixed(2));
        settings.speedGlobal = parseFloat((0.5 + Math.random() * 0.9).toFixed(2));
        settings.trailLength = Math.floor(Math.random() * 22) + 10;
        settings.signalCount = Math.floor(Math.random() * 120) + 100;

        rebuildNeuralRoots();
        buildSpores();

        if (gui) {
          gui.controllersRecursive().forEach(c => c.updateDisplay());
        }
      }

      // Pointer Event Tracking for Click vs Drag
      let pointerDownPos = { x: 0, y: 0 };
      let pointerDownTime = 0;

      window.addEventListener('pointerdown', (e) => {
        if (e.target.closest('.lil-gui')) return;
        pointerDownPos.x = e.clientX;
        pointerDownPos.y = e.clientY;
        pointerDownTime = performance.now();
      });

      window.addEventListener('pointerup', (e) => {
        if (e.target.closest('.lil-gui')) return;
        const dx = e.clientX - pointerDownPos.x;
        const dy = e.clientY - pointerDownPos.y;
        const dist = Math.hypot(dx, dy);
        const dt = performance.now() - pointerDownTime;

        if (dist < 6 && dt < 300 && settings.clickToRandomize) {
          randomizeScene();
        }
      });

      // =========================================================================================
      // CAMERA SYNCHRONIZATION HELPERS (Two-way Cartesian & Spherical Orbit Controls)
      // =========================================================================================
      function updateCameraFromAngles() {
        const r = settings.camDistance;
        const phi = THREE.MathUtils.degToRad(settings.polarAngle);
        const theta = THREE.MathUtils.degToRad(settings.azimuthAngle);

        perspectiveCamera.position.x = settings.targetX + r * Math.sin(phi) * Math.sin(theta);
        perspectiveCamera.position.y = settings.targetY + r * Math.cos(phi);
        perspectiveCamera.position.z = settings.targetZ + r * Math.sin(phi) * Math.cos(theta);

        perspectiveCamera.lookAt(controls.target);
        controls.update();
        perspectiveCamera.updateMatrixWorld(true);

        settings.camPosX = perspectiveCamera.position.x;
        settings.camPosY = perspectiveCamera.position.y;
        settings.camPosZ = perspectiveCamera.position.z;
      }

      function updateCameraFromPosition() {
        perspectiveCamera.position.set(settings.camPosX, settings.camPosY, settings.camPosZ);
        controls.target.set(settings.targetX, settings.targetY, settings.targetZ);
        perspectiveCamera.lookAt(controls.target);
        controls.update();
        perspectiveCamera.updateMatrixWorld(true);

        const offset = new THREE.Vector3().subVectors(perspectiveCamera.position, controls.target);
        settings.camDistance = parseFloat(offset.length().toFixed(2));
        settings.polarAngle = parseFloat(THREE.MathUtils.radToDeg(controls.getPolarAngle()).toFixed(2));
        settings.azimuthAngle = parseFloat(THREE.MathUtils.radToDeg(controls.getAzimuthalAngle()).toFixed(2));
      }

      function resetCameraView() {
        settings.camPosX = 0.0;
        settings.camPosY = 4.0;
        settings.camPosZ = 82.0;
        settings.targetX = 0.0;
        settings.targetY = 6.0;
        settings.targetZ = 0.0;
        settings.fov = 50.0;
        perspectiveCamera.fov = 50.0;
        perspectiveCamera.updateProjectionMatrix();
        updateCameraFromPosition();
      }

      // =========================================================================================
      // GUI SETUP (LIL-GUI) - Closed by default
      // =========================================================================================
      const gui = new GUI({ title: 'Roots & Neural Veins Settings' });

      // Folder 1: Presets & Themes
      const fPresets = gui.addFolder('Presets & Themes');
      fPresets.add(settings, 'theme', Object.keys(COLOR_PALETTES)).name('Color Scheme').onChange((val) => {
        applyPalette(val);
      });
      fPresets.add(settings, 'animationPreset', [
        'Static Sanctuary',
        'Gentle Orbit',
        'Arbor Swirl',
        'Synaptic Fly-Through',
        'Breathing Pendulum'
      ]).name('Animation');
      fPresets.add(settings, 'clickToRandomize').name('Click Scene to Re-roll');
      fPresets.add({ randomize: () => randomizeScene() }, 'randomize').name('Randomize Scene Now 🎲');

      // Folder 2: Colors
      const fColors = gui.addFolder('Colors');
      fColors.addColor(settings, 'colorBg').name('Background Color').onChange((v) => {
        if (!settings.greenScreen) {
          scene.background.set(v);
          scene.fog.color.set(v);
          document.body.style.backgroundColor = v;
          renderer.setClearColor(v, 1);
        }
      });
      fColors.addColor(settings, 'colorLine').name('Roots / Lines').onChange((v) => {
        bgLineMaterial.color.set(v);
      });
      fColors.addColor(settings, 'colorSignal1').name('Pulse Primary').onChange(() => rebuildSignals());
      fColors.addColor(settings, 'colorSignal2').name('Pulse Secondary').onChange(() => rebuildSignals());
      fColors.addColor(settings, 'colorSignal3').name('Pulse Accent 1').onChange(() => rebuildSignals());
      fColors.addColor(settings, 'colorSignal4').name('Pulse Accent 2').onChange(() => rebuildSignals());
      fColors.addColor(settings, 'colorNode').name('Synapse Nodes').onChange((v) => {
        if (nodePointsMesh) {
          nodePointsMesh.material.color.set(v);
        }
      });

      // Folder 3: System & Display
      const fSystem = gui.addFolder('System & Display');
      fSystem.add(settings, 'greenScreen').name('Green Screen (#00ff00)').onChange(setGreenScreen);
      fSystem.add(settings, 'dpr', 0.5, 3.0, 0.1).name('Pixel Ratio (DPR)').onChange((val) => {
        renderer.setPixelRatio(val);
        postProcessor.setSize(window.innerWidth, window.innerHeight, val);
      });
      fSystem.add(settings, 'speedGlobal', 0.0, 3.0, 0.05).name('Animation Speed');
      fSystem.add(settings, 'lineOpacity', 0.05, 1.0, 0.05).name('Lines Opacity').onChange((v) => {
        bgLineMaterial.opacity = v;
      });

      // Folder 4: Branch Geometry & Growth
      const fGeo = gui.addFolder('Roots & Neural Tree');
      fGeo.add(settings, 'treeClusters', 1, 6, 1).name('Root Clusters').onFinishChange(rebuildNeuralRoots);
      fGeo.add(settings, 'maxBranchDepth', 2, 5, 1).name('Branch Depth').onFinishChange(rebuildNeuralRoots);
      fGeo.add(settings, 'trunkLength', 10, 45, 1).name('Trunk Length').onFinishChange(rebuildNeuralRoots);
      fGeo.add(settings, 'branchCurvature', 0.2, 2.5, 0.05).name('Spread Angle').onFinishChange(rebuildNeuralRoots);
      fGeo.add(settings, 'branchJitter', 0.0, 0.8, 0.02).name('Organic Jitter').onFinishChange(rebuildNeuralRoots);
      fGeo.add(settings, 'waveSpeed', 0.0, 5.0, 0.1).name('Wave Sway Speed');
      fGeo.add(settings, 'waveHeight', 0.0, 1.5, 0.02).name('Wave Sway Height');

      // Folder 5: Signals & Action Potentials
      const fSignals = gui.addFolder('Signals / Action Potentials');
      fSignals.add(settings, 'signalCount', 20, 400, 10).name('Signal Count').onFinishChange(rebuildSignals);
      fSignals.add(settings, 'trailLength', 2, 60, 1).name('Comet Trail Length');
      fSignals.add(settings, 'sporeCount', 50, 800, 25).name('Ambient Spores').onFinishChange(buildSpores);
      fSignals.add(settings, 'sporeSize', 0.5, 6.0, 0.2).name('Spore Size').onChange((v) => {
        if (sporeParticlesMesh) sporeParticlesMesh.material.size = v;
      });

      // Folder 6: Camera Placement and Lens Settings
      const fCam = gui.addFolder('Camera Placement and Lens Settings');
      fCam.add(settings, 'camPosX', -150.0, 150.0, 0.5).name('Camera Pos X').listen().onChange(updateCameraFromPosition);
      fCam.add(settings, 'camPosY', -150.0, 150.0, 0.5).name('Camera Pos Y').listen().onChange(updateCameraFromPosition);
      fCam.add(settings, 'camPosZ', -150.0, 150.0, 0.5).name('Camera Pos Z').listen().onChange(updateCameraFromPosition);
      fCam.add(settings, 'polarAngle', 1.0, 179.0, 0.5).name('Polar Angle (Pitch °)').listen().onChange(updateCameraFromAngles);
      fCam.add(settings, 'azimuthAngle', -180.0, 180.0, 0.5).name('Azimuth Angle (Yaw °)').listen().onChange(updateCameraFromAngles);
      fCam.add(settings, 'camDistance', 5.0, 250.0, 0.5).name('Camera Distance').listen().onChange(updateCameraFromAngles);
      fCam.add(settings, 'targetX', -80.0, 80.0, 0.5).name('Target LookAt X').listen().onChange(updateCameraFromPosition);
      fCam.add(settings, 'targetY', -80.0, 80.0, 0.5).name('Target LookAt Y').listen().onChange(updateCameraFromPosition);
      fCam.add(settings, 'targetZ', -80.0, 80.0, 0.5).name('Target LookAt Z').listen().onChange(updateCameraFromPosition);
      fCam.add(settings, 'fov', 20.0, 110.0, 1.0).name('Camera FOV').listen().onChange((v) => {
        perspectiveCamera.fov = v;
        perspectiveCamera.updateProjectionMatrix();
        globalShaderUniforms.uFov.value = v;
      });

      const fMouse = fCam.addFolder('Interaction & Orbit Controls');
      fMouse.add(settings, 'rotateSpeed', 0.1, 3.0, 0.1).name('Rotate / Drag Speed').onChange((v) => (controls.rotateSpeed = v));
      fMouse.add(settings, 'panSpeed', 0.1, 3.0, 0.1).name('Pan Speed').onChange((v) => (controls.panSpeed = v));
      fMouse.add(settings, 'zoomSpeed', 0.1, 3.0, 0.1).name('Zoom Speed').onChange((v) => (controls.zoomSpeed = v));
      fMouse.add(settings, 'dampingFactor', 0.01, 0.2, 0.01).name('Damping (Inertia)').onChange((v) => (controls.dampingFactor = v));
      fMouse.add(settings, 'autoRotate').name('Auto-Rotate View').onChange((v) => (controls.autoRotate = v));
      fMouse.add(settings, 'autoRotateSpeed', -10.0, 10.0, 0.5).name('Auto-Rotate Speed').onChange((v) => (controls.autoRotateSpeed = v));
      fMouse.add({ reset: resetCameraView }, 'reset').name('Reset Camera View');

      // Folder 7: Post-Processing & Fisheye Suite (Inlined from PostProcessor.js)
      postProcessor.attachGUI(gui, 'Post-Processing & Fisheye');

      // Close GUI by default as requested
      gui.close();

      // Keyboard Toggle for GUI with 'H' key
      window.addEventListener('keydown', (e) => {
        if (e.key === 'h' || e.key === 'H') {
          if (gui._hidden) {
            gui.show();
          } else {
            gui.hide();
          }
        }
      });

      // Window Resize Listener
      window.addEventListener('resize', () => {
        const width = window.innerWidth;
        const height = window.innerHeight;
        perspectiveCamera.aspect = width / height;
        perspectiveCamera.updateProjectionMatrix();
        renderer.setSize(width, height);
        postProcessor.setSize(width, height, settings.dpr);
        globalShaderUniforms.uResolution.value.set(width * settings.dpr, height * settings.dpr);
      });

      // Initialize Neural Tree & Spores
      rebuildNeuralRoots();
      buildSpores();

      // =========================================================================================
      // MAIN ANIMATION LOOP
      // =========================================================================================
      const clock = new THREE.Clock();
      let animTime = 0;
      let animAngle = 0;

      function animate() {
        requestAnimationFrame(animate);

        const delta = clock.getDelta();
        const elapsedTime = clock.getElapsedTime();
        const speed = settings.speedGlobal;
        animTime += delta * speed;

        // 1. Camera Motion Presets
        if (settings.animationPreset !== 'Static Sanctuary') {
          animAngle += delta * speed * 0.3;

          if (settings.animationPreset === 'Gentle Orbit') {
            const r = settings.camDistance;
            perspectiveCamera.position.x = Math.sin(animAngle * 0.5) * r;
            perspectiveCamera.position.z = Math.cos(animAngle * 0.5) * r;
            perspectiveCamera.position.y = 8.0 + Math.sin(animAngle * 0.3) * 6.0;
            controls.target.set(0, 6.0, 0);
          } else if (settings.animationPreset === 'Arbor Swirl') {
            const r = 55.0 + Math.sin(animAngle * 0.4) * 15.0;
            perspectiveCamera.position.x = Math.cos(animAngle * 0.6) * r;
            perspectiveCamera.position.z = Math.sin(animAngle * 0.6) * r;
            perspectiveCamera.position.y = -8.0 + Math.sin(animAngle * 0.5) * 22.0;
            controls.target.set(0, Math.sin(animAngle * 0.3) * 8.0, 0);
          } else if (settings.animationPreset === 'Synaptic Fly-Through') {
            perspectiveCamera.position.x = Math.sin(animAngle * 0.4) * 28.0;
            perspectiveCamera.position.y = 4.0 + Math.cos(animAngle * 0.6) * 14.0;
            perspectiveCamera.position.z = 32.0 + Math.cos(animAngle * 0.35) * 24.0;
            controls.target.set(Math.sin(animAngle * 0.5) * 6.0, 8.0 + Math.sin(animAngle * 0.4) * 6.0, -8.0);
          } else if (settings.animationPreset === 'Breathing Pendulum') {
            perspectiveCamera.position.x = Math.sin(animAngle * 0.5) * 45.0;
            perspectiveCamera.position.y = 12.0 + Math.cos(animAngle * 0.8) * 8.0;
            perspectiveCamera.position.z = 68.0 + Math.sin(animAngle * 0.25) * 12.0;
            controls.target.set(Math.sin(animAngle * 0.3) * 4.0, 6.0, 0.0);
          }
        }

        controls.update();
        perspectiveCamera.updateMatrixWorld(true);

        // Update Shader Uniforms for Camera
        globalShaderUniforms.uTime.value = animTime;
        globalShaderUniforms.uCameraPos.value.copy(perspectiveCamera.position);
        globalShaderUniforms.uCameraWorldMatrix.value.copy(perspectiveCamera.matrixWorld);
        globalShaderUniforms.uFov.value = perspectiveCamera.fov;

        // Two-way synchronization of GUI sliders
        const camOffset = new THREE.Vector3().subVectors(perspectiveCamera.position, controls.target);
        settings.camDistance = parseFloat(camOffset.length().toFixed(2));
        settings.polarAngle = parseFloat(THREE.MathUtils.radToDeg(controls.getPolarAngle()).toFixed(2));
        settings.azimuthAngle = parseFloat(THREE.MathUtils.radToDeg(controls.getAzimuthalAngle()).toFixed(2));

        settings.camPosX = perspectiveCamera.position.x;
        settings.camPosY = perspectiveCamera.position.y;
        settings.camPosZ = perspectiveCamera.position.z;
        settings.targetX = controls.target.x;
        settings.targetY = controls.target.y;
        settings.targetZ = controls.target.z;
        settings.fov = perspectiveCamera.fov;

        // 2. Organic Wave Sway & Breathing on Neural Branches
        const wSpeed = settings.waveSpeed;
        const wHeight = settings.waveHeight;

        for (let b = 0; b < allBranches.length; b++) {
          const branch = allBranches[b];
          const positions = branch.geometry.attributes.position.array;
          const count = branch.basePoints.length;

          for (let p = 0; p < count; p++) {
            const base = branch.basePoints[p];
            const t = p / (count - 1);
            const sway = Math.sin(animTime * wSpeed + base.y * 0.08 + branch.phase) * wHeight * branch.swayFactor * t;
            const swayZ = Math.cos(animTime * wSpeed * 0.8 + base.x * 0.08 + branch.phase) * wHeight * branch.swayFactor * t;

            positions[p * 3] = base.x + sway;
            positions[p * 3 + 1] = base.y;
            positions[p * 3 + 2] = base.z + swayZ;
          }
          branch.geometry.attributes.position.needsUpdate = true;
        }

        // 3. Update Action Potential Signals (Intelligent Fork Choosing)
        const trailLen = Math.max(1, settings.trailLength);

        for (let s = 0; s < signalParticles.length; s++) {
          const sig = signalParticles[s];
          if (!sig.currentBranch) {
            sig.currentBranch = pickRandomRootBranch();
            sig.progress = 0;
            continue;
          }

          // Advance signal progress along current branch
          sig.progress += sig.speed * 0.008 * speed;

          // Fork decision when reaching end of branch
          if (sig.progress >= 1.0) {
            if (sig.currentBranch.children && sig.currentBranch.children.length > 0) {
              // Intelligently choose one child branch at fork
              const childIndex = Math.floor(Math.random() * sig.currentBranch.children.length);
              sig.currentBranch = sig.currentBranch.children[childIndex];
              sig.progress = 0.0;
            } else {
              // Terminal tip reached: reset to root trunk
              sig.currentBranch = pickRandomRootBranch();
              sig.progress = 0.0;
              sig.history = [];
              sig.assignedColor = pickSignalColor();
            }
          }

          // Compute 3D position on current branch curve
          const branch = sig.currentBranch;
          const rawPoint = branch.curve.getPoint(Math.min(1.0, Math.max(0.0, sig.progress)));
          const sway = Math.sin(animTime * wSpeed + rawPoint.y * 0.08 + branch.phase) * wHeight * branch.swayFactor * sig.progress;
          const swayZ = Math.cos(animTime * wSpeed * 0.8 + rawPoint.x * 0.08 + branch.phase) * wHeight * branch.swayFactor * sig.progress;

          const currentPos = new THREE.Vector3(rawPoint.x + sway, rawPoint.y, rawPoint.z + swayZ);
          sig.history.push(currentPos);

          if (sig.history.length > trailLen + 1) {
            sig.history.shift();
          }

          const positions = sig.mesh.geometry.attributes.position.array;
          const colors = sig.mesh.geometry.attributes.color.array;
          const currentLen = sig.history.length;

          for (let i = 0; i < trailLen; i++) {
            let index = currentLen - 1 - i;
            if (index < 0) index = 0;

            const pt = sig.history[index] || currentPos;
            positions[i * 3] = pt.x;
            positions[i * 3 + 1] = pt.y;
            positions[i * 3 + 2] = pt.z;

            let alpha = 1.0;
            if (trailLen > 1) {
              alpha = Math.max(0.0, 1.0 - i / trailLen);
              alpha = Math.pow(alpha, 1.4);
            }

            colors[i * 3] = sig.assignedColor.r * alpha * settings.signalBrightness;
            colors[i * 3 + 1] = sig.assignedColor.g * alpha * settings.signalBrightness;
            colors[i * 3 + 2] = sig.assignedColor.b * alpha * settings.signalBrightness;
          }

          sig.mesh.geometry.setDrawRange(0, Math.min(currentLen, trailLen));
          sig.mesh.geometry.attributes.position.needsUpdate = true;
          sig.mesh.geometry.attributes.color.needsUpdate = true;
        }

        // 4. Update Synaptic Nodes Breathing
        if (nodePointsMesh) {
          const breath = 1.0 + Math.sin(animTime * settings.breathingSpeed * 2.0) * settings.breathingAmount;
          nodePointsMesh.scale.set(breath, breath, breath);
        }

        // 5. Update Ambient Drifting Spores
        if (sporeParticlesMesh) {
          const positions = sporeParticlesMesh.geometry.attributes.position.array;
          const velocities = sporeParticlesMesh.geometry.userData.vel;
          const count = positions.length / 3;

          for (let i = 0; i < count; i++) {
            positions[i * 3] += velocities[i * 3] * speed;
            positions[i * 3 + 1] += velocities[i * 3 + 1] * speed;
            positions[i * 3 + 2] += velocities[i * 3 + 2] * speed;

            // Wrap around volume
            if (positions[i * 3 + 1] > 35.0) {
              positions[i * 3 + 1] = -25.0;
            }
          }
          sporeParticlesMesh.geometry.attributes.position.needsUpdate = true;
        }

        // 6. Render Scene (PostProcessor or Direct)
        if (postProcessor.settings.enabled) {
          postProcessor.renderScene(scene, perspectiveCamera);
        } else {
          renderer.render(scene, perspectiveCamera);
        }
      }

      animate();
    </script>
  </body>
</html>
