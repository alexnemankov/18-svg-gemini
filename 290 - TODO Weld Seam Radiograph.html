<!DOCTYPE html>

<head>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: #060709;
            user-select: none;
            -webkit-user-select: none;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: grab;
        }

        canvas:active {
            cursor: grabbing;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #d1d5db;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 13px;
            letter-spacing: 0.14em;
            pointer-events: none;
            font-weight: 600;
        }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="loading">INITIALIZING WELD SEAM RADIOGRAPH...</div>

    <script type="module">

        // 18 PRECONFIGURED COLOR SCHEMES

            },
            'Palette (FFE8CC, FF8C00, C7501A, 3D1050, 0E0618)': {

            },
            'Palette (E8E0FF, B38FFF, 6A3DE8, 1A1250, 090612)': {
                filmBase: '#090612',
                weldMetal: '#e8e0ff',
                heatZone: '#6a3de8',
                defectColor: '#1a1250',
                bgColor: '#090612',
                accentColor: '#b38fff'
            },
            'Palette (E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)': {
                filmBase: '#05020f',
                weldMetal: '#e0fbff',
                heatZone: '#1e0a3d',
                defectColor: '#d40078',
                bgColor: '#05020f',
                accentColor: '#00f0ff'
            }
        };

        const ANIMATIONS = [
            'Static (No Camera Motion)',
            'Circumferential Weld Scan (Continuous 360°)',
            'Pipe Penetration Orbit (Subtle Figure-8)',
            'Root Pass Depth Travel (Push/Pull Focus)',
            'NDT Lightbox Sweep (Horizontal Translation)',
            'Radiographic Tilt & Roll (C-Arm Gantry Glide)',
            'Film Exposure Breathing (Slow Gamma Pulse)',
            'Vertical Seam Traverse (Elevator Inspection)'
        ];

        const SETTINGS = {
            // General Preset & Animation
            colorScheme: 'Achromatic (White on Black)',
            animation: 'Circumferential Weld Scan (Continuous 360°)',
            animationSpeed: 0.8,
            streamSpeed: 3.2,
            randomizeOnClick: true,

            // Radiographic Seam & Noise Domain
            trackCount: 52.0,
            pitchVariance: 1.35,
            passThickness: 0.42,
            porosityRate: 0.35,
            porosityScale: 14.0,
            rootPenetration: 1.25,
            weldWaviness: 0.35,

            // Film & Radiography Radiometry
            filmGamma: 1.85,
            filmGrain: 0.16,
            filmContrast: 1.2,
            exposure: 1.15,
            invertDensity: false,

            // Geometry & Curvature
            curveSoftness: 7.2,
            curveWidth: 0.38,
            curveDepth: 0.95,
            height: 1.32,
            wallTilt: 0.0,
            fov: 110.0,

            // Post-Processing
            dpr: Math.min(window.devicePixelRatio || 1.0, 2.0),
            bloomStrength: 0.18,
            bloomRadius: 0.65,
            chromaticAberration: 0.0025,
            edgeBlurStrength: 0.009,

            // Camera & Navigation
            zoom: 1.0,
            objectX: 0.0,
            objectY: 0.0,
            cameraY: 0.0,
            cameraSpinSpeed: 0.0,

            // Colors
            filmBase: COLOR_SCHEMES['Achromatic (White on Black)'].filmBase,
            weldMetal: COLOR_SCHEMES['Achromatic (White on Black)'].weldMetal,
            heatZone: COLOR_SCHEMES['Achromatic (White on Black)'].heatZone,
            defectColor: COLOR_SCHEMES['Achromatic (White on Black)'].defectColor,
            bgColor: COLOR_SCHEMES['Achromatic (White on Black)'].bgColor,
            accentColor: COLOR_SCHEMES['Achromatic (White on Black)'].accentColor,

            // Greenscreen
            greenScreen: false,
            greenScreenColor: '#00ff00'
        };

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(SETTINGS.bgColor);

        const camera = new THREE.PerspectiveCamera(SETTINGS.fov, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, SETTINGS.cameraY, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(SETTINGS.dpr);
        document.body.appendChild(renderer.domElement);

        document.getElementById('loading').style.display = 'none';

        // HIGH-RESOLUTION INDUSTRIAL RADIOGRAPH FILM TEXTURE (CanvasTexture)
        // Includes lead identification markers, penetrameter (IQI) wires, seam stamps, tick graticules
        const canvasTexture = document.createElement('canvas');
        canvasTexture.width = 1024;
        canvasTexture.height = 1024;
        const ctx = canvasTexture.getContext('2d');

        function generateRadiographTexture() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, 1024, 1024);

            // 1. Lead Markers & Inspection Stamp Text
            ctx.font = 'bold 20px monospace';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';

            const stamps = [
                'WELD #290-RT', 'ISO 17636-2', 'EN 1435 CLASS B', 'SEAM-ROOT OK',
                'IQI 10 FE EN', 'PENETRATION 100%', 'X-RAY 220kV 5mA', 'GAMMA Ir-192',
                'POROSITY CHECK: PASS', 'NDT FILM D7', 'SECTOR 0-360', 'HEAT B-9844',
                'LOC A-14', 'THICKNESS 12.7mm', 'WELD PASS 1-4', 'DEFECT: NONE'
            ];

            const grid = 64;
            for (let y = 16; y < 1024; y += grid) {
                for (let x = 16; x < 1024; x += grid * 4) {
                    const rnd = Math.random();
                    if (rnd > 0.45) {
                        ctx.fillStyle = `rgba(255, 255, 255, ${0.4 + Math.random() * 0.55})`;
                        const stamp = stamps[Math.floor(Math.random() * stamps.length)];
                        ctx.fillText(stamp, x, y);
                    }
                }
            }

            // 2. Radiographic IQI (Image Quality Indicator / Wire Penetrameter) Wire Set
            for (let b = 0; b < 6; b++) {
                const startY = 80 + b * 150;
                for (let w = 1; w <= 7; w++) {
                    const wireWidth = Math.max(0.7, 4.0 - w * 0.45);
                    ctx.strokeStyle = `rgba(255, 255, 255, ${0.25 + w * 0.1})`;
                    ctx.lineWidth = wireWidth;
                    ctx.beginPath();
                    ctx.moveTo(30 + b * 160, startY + w * 12);
                    ctx.lineTo(130 + b * 160, startY + w * 12);
                    ctx.stroke();
                }
            }

            // 3. Inspection Tick Graticule along circumferential length
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.lineWidth = 1.5;
            for (let x = 0; x < 1024; x += 16) {
                const tickHeight = (x % 64 === 0) ? 14 : ((x % 32 === 0) ? 8 : 4);
                ctx.beginPath();
                ctx.moveTo(x, 10);
                ctx.lineTo(x, 10 + tickHeight);
                ctx.moveTo(x, 1014);
                ctx.lineTo(x, 1014 - tickHeight);
                ctx.stroke();
            }

            // 4. Clustered Porosity Reference Calibration Targets
            for (let p = 0; p < 18; p++) {
                const cx = Math.random() * 960 + 32;
                const cy = Math.random() * 960 + 32;
                const pCount = Math.floor(Math.random() * 6) + 3;
                for (let k = 0; k < pCount; k++) {
                    const ox = cx + (Math.random() - 0.5) * 28;
                    const oy = cy + (Math.random() - 0.5) * 28;
                    const rad = 1.0 + Math.random() * 3.5;
                    ctx.fillStyle = `rgba(255, 255, 255, ${0.4 + Math.random() * 0.5})`;
                    ctx.beginPath();
                    ctx.arc(ox, oy, rad, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }
        generateRadiographTexture();

        const dataTexture = new THREE.CanvasTexture(canvasTexture);
        dataTexture.wrapS = THREE.RepeatWrapping;
        dataTexture.wrapT = THREE.RepeatWrapping;
        dataTexture.minFilter = THREE.LinearMipmapLinearFilter;
        dataTexture.magFilter = THREE.LinearFilter;
        dataTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();

        const tunnelGroup = new THREE.Group();
        scene.add(tunnelGroup);

        // WELD SEAM RADIOGRAPH SHADER MATERIAL
        const wallVertexShader = `
            varying vec2 vUv;
            varying vec3 vPosition;
            uniform float uCurveSoftness;

            void main() {
                vUv = uv;
                vec3 pos = position;

                float angle = atan(pos.z, pos.x);
                float normX = cos(angle);
                float n = max(1.0, uCurveSoftness);

                float absZ = pow(max(0.00001, 1.0 - pow(abs(normX), n)), 1.0 / n) * 100.0;
                pos.z = sign(sin(angle)) * absZ;

                vPosition = pos;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
            }
        `;

        const wallFragmentShader = `
            varying vec2 vUv;
            varying vec3 vPosition;

            uniform float uTime;
            uniform float uSpeed;
            uniform float uTrackCount;
            uniform float uPitchVariance;
            uniform float uPassThickness;
            uniform float uPorosityRate;
            uniform float uPorosityScale;
            uniform float uRootPenetration;
            uniform float uWeldWaviness;

            uniform float uFilmGamma;
            uniform float uFilmGrain;
            uniform float uFilmContrast;
            uniform float uExposure;
            uniform float uInvertDensity;

            uniform vec3 uFilmBase;
            uniform vec3 uWeldMetal;
            uniform vec3 uHeatZone;
            uniform vec3 uDefectColor;
            uniform vec3 uBgColor;
            uniform vec3 uAccentColor;
            uniform sampler2D uDataTexture;

            // Pseudo-random generator
            float random(vec2 st) {
                return fract(sin(dot(st.xy, vec2(12.9898, 78.233))) * 43758.5453123);
            }

            // 2D Value Noise
            float noise(vec2 st) {
                vec2 i = floor(st);
                vec2 f = fract(st);
                float a = random(i);
                float b = random(i + vec2(1.0, 0.0));
                float c = random(i + vec2(0.0, 1.0));
                float d = random(i + vec2(1.0, 1.0));
                vec2 u = f * f * (3.0 - 2.0 * f);
                return mix(a, b, u.x) + (c - a) * u.y * (1.0 - u.x) + (d - b) * u.x * u.y;
            }

            // Fractal Brownian Motion for rich organic radiographic textures & metal crystallization
            float fbm(vec2 st) {
                float value = 0.0;
                float amplitude = 0.5;
                for (int i = 0; i < 4; i++) {
                    value += amplitude * noise(st);
                    st *= 2.1;
                    amplitude *= 0.5;
                }
                return value;
            }

            // Radiographic Weld Seam Layer
            // - Perturbs track pitch using noise(vec2(trackId, seed)) so bands read as irregular weld passes
            // - Repurposes dash pattern to punch small noise-shaped voids (porosity/inclusion defects)
            // - Collapses color accumulation into film-density curve (pow(profile, gamma))
            float getLineLayer(vec3 pos, float trackCount, float speedBase, float seed) {
                float baseHeight = 80.0 / max(1.0, trackCount);

                // Approximate trackId from Y coordinate
                float approxTrackId = floor((pos.y + 40.0) / baseHeight);

                // 1. Noise-domain pitch perturbation: perturb pitch with noise(vec2(trackId, seed))
                float pitchPerturb = noise(vec2(approxTrackId * 1.618, seed * 2.37));
                float trackHeight = baseHeight * mix(1.0 - 0.45 * uPitchVariance, 1.0 + 0.55 * uPitchVariance, pitchPerturb);

                // Re-evaluate precise trackId with perturbed pitch
                float trackId = floor((pos.y + 40.0) / max(0.5, trackHeight));

                // Active pass probability
                float trackActive = random(vec2(trackId, seed));
                if (trackActive > 0.48) return 0.0;

                // Center position with natural lateral pass oscillation (weld weaving)
                float angle = atan(pos.z, pos.x);
                float weaveWaviness = sin(angle * 8.0 + trackId * 1.5) * uWeldWaviness * (trackHeight * 0.35);
                float trackCenter = -40.0 + (trackId + 0.5) * trackHeight + weaveWaviness;
                float distY = abs(pos.y - trackCenter);

                // Pass thickness variation along circumferential run
                float thicknessBase = trackHeight * uPassThickness * mix(0.4, 1.15, random(vec2(trackId, seed + 1.0)));
                float thicknessMod = 1.0 + 0.25 * sin(angle * 14.0 + trackId * 3.7) * noise(vec2(angle * 4.0, trackId));
                float thickness = thicknessBase * thicknessMod;

                float aa = 0.035;
                float rawProfile = smoothstep(thickness + aa, thickness - aa, distY);
                if (rawProfile <= 0.0) return 0.0;

                // Circumferential motion for inspection sweep
                float speedMult = mix(0.6, 1.8, random(vec2(trackId, seed + 2.0)));
                float currentAngle = angle + uTime * uSpeed * 0.008 * speedBase * speedMult;

                // 2. Void punching (Weld Porosity / Slag Inclusion defects)
                // Instead of decorative dashes, punch small noise-shaped voids into the band
                vec2 defectCoord = vec2(currentAngle * uPorosityScale, (pos.y + trackId * 4.0) * 0.4);
                float defectNoise1 = noise(defectCoord + vec2(seed * 9.2, trackId * 5.1));
                float defectNoise2 = noise(defectCoord * 2.8 + vec2(trackId * 11.3, seed));
                float defectComposite = defectNoise1 * 0.65 + defectNoise2 * 0.35;

                // Multi-scale void thresholding: punch cavities into the weld bead
                float voidThreshold = 1.0 - uPorosityRate * 0.65;
                float voidMask = smoothstep(voidThreshold - 0.08, voidThreshold + 0.08, defectComposite);

                // Fine pinpoint gas pores / microporosity
                float microPoreNoise = random(vec2(floor(currentAngle * 45.0), floor(pos.y * 3.0 + trackId)));
                float microPoreMask = step(uPorosityRate * 0.28, microPoreNoise);
                voidMask *= microPoreMask;

                // 3. Film Density Curve: single luminance value driven by pow(profile, gamma)
                float densityProfile = pow(rawProfile, uFilmGamma);

                // High-density weld root core penetration
                float corePenetration = smoothstep(thickness * 0.45, 0.0, distY) * uRootPenetration;

                // Combine into single radiant metal density
                float passIntensity = (densityProfile * 0.8 + corePenetration * 0.65) * voidMask;

                return passIntensity;
            }

            // Radiographic Composite Surface
            vec3 getRadiographSurface(vec3 pos, float isReflection) {
                float angle = atan(pos.z, pos.x);
                float normAngle = (angle + 3.14159265359) / 6.28318530718;

                // Film baseline motion
                float filmAngle = normAngle + uTime * uSpeed * 0.003;
                vec2 filmUv = vec2(filmAngle * 16.0, (pos.y + 40.0) * 0.025);

                // Sample NDT identification stamps & lead markers
                float leadMarkerMask = texture2D(uDataTexture, filmUv).r;

                // Accumulated weld pass intensity
                float weldLuminance = 0.0;
                weldLuminance += getLineLayer(pos, uTrackCount * 0.5, 0.8, 11.1);
                weldLuminance += getLineLayer(pos, uTrackCount * 1.0, 1.2, 22.3);
                weldLuminance += getLineLayer(pos, uTrackCount * 1.8, 1.8, 33.7);
                weldLuminance += getLineLayer(pos, uTrackCount * 3.0, 2.4, 44.9);

                // Heat Affected Zone (HAZ) metal texture / grain background
                vec2 hazCoord = vec2(filmAngle * 64.0, pos.y * 0.25);
                float hazTexture = fbm(hazCoord);
                float hazGradient = smoothstep(38.0, 5.0, abs(pos.y));
                float hazLuminance = hazTexture * hazGradient * 0.38;

                // Total exposure before film grain
                float totalExposure = (weldLuminance * 1.45 + hazLuminance) * uExposure;

                // 4. Subtle random()-based Radiographic Film Grain across the frame
                float silverHalideGrain = (random(vUv * 650.0 + fract(uTime * 0.002)) - 0.5) * uFilmGrain;
                totalExposure += silverHalideGrain;

                // Contrast curve
                totalExposure = clamp(totalExposure, 0.0, 2.0);
                totalExposure = pow(totalExposure, uFilmContrast);

                // Invert density option (for positive radiograph paper print vs negative film)
                if (uInvertDensity > 0.5) {
                    totalExposure = max(0.0, 1.35 - totalExposure);
                }

                // 5. Film Density Color Mapping (No additive RGB glow - pure physical radiograph density)
                vec3 finalCol = uFilmBase;

                // Blend Heat-Affected Zone and Penetrating Weld Bead
                finalCol = mix(finalCol, uHeatZone, clamp(hazLuminance * 1.8, 0.0, 1.0));
                finalCol = mix(finalCol, uWeldMetal, clamp(weldLuminance * 1.25, 0.0, 1.0));

                // Lead Identification Markers & IQI wire imprint (high X-ray attenuation)
                if (leadMarkerMask > 0.08) {
                    vec3 markerCol = mix(uAccentColor, uWeldMetal, 0.6);
                    finalCol = mix(finalCol, markerCol, leadMarkerMask * 0.75);
                }

                // Porosity void contrast shadow
                if (weldLuminance < 0.15 && hazLuminance > 0.1) {
                    finalCol = mix(finalCol, uDefectColor, 0.4);
                }

                // Film boundary vignette & inspection edge fade
                if (isReflection == 1.0) {
                    float fade = smoothstep(-38.0, -12.0, pos.y);
                    finalCol = mix(uBgColor, finalCol * 0.42, fade);
                } else {
                    float fade = smoothstep(40.0, 18.0, pos.y);
                    finalCol = mix(uBgColor, finalCol, fade);
                }

                return finalCol;
            }

            void main() {
                float floorLevel = -12.0;
                vec3 col;

                if (vPosition.y > floorLevel) {
                    col = getRadiographSurface(vPosition, 0.0);
                } else {
                    vec3 reflectedPos = vPosition;
                    reflectedPos.y = floorLevel + (floorLevel - vPosition.y);
                    col = getRadiographSurface(reflectedPos, 1.0);
                    // Lightbox glossy reflection tint
                    col = mix(col, uBgColor * 0.8, 0.3);
                }

                // Inspection viewer lightbox horizon seam
                float horizonSeam = smoothstep(0.4, 0.0, abs(vPosition.y - floorLevel));
                col = mix(col, uWeldMetal * 0.4 + uBgColor * 0.6, horizonSeam * 0.25);

                gl_FragColor = vec4(col, 1.0);
            }
        `;

        const uniforms = {
            uTime: { value: 0.0 },
            uSpeed: { value: SETTINGS.streamSpeed * SETTINGS.animationSpeed },
            uTrackCount: { value: SETTINGS.trackCount },
            uPitchVariance: { value: SETTINGS.pitchVariance },
            uPassThickness: { value: SETTINGS.passThickness },
            uPorosityRate: { value: SETTINGS.porosityRate },
            uPorosityScale: { value: SETTINGS.porosityScale },
            uRootPenetration: { value: SETTINGS.rootPenetration },
            uWeldWaviness: { value: SETTINGS.weldWaviness },
            uFilmGamma: { value: SETTINGS.filmGamma },
            uFilmGrain: { value: SETTINGS.filmGrain },
            uFilmContrast: { value: SETTINGS.filmContrast },
            uExposure: { value: SETTINGS.exposure },
            uInvertDensity: { value: SETTINGS.invertDensity ? 1.0 : 0.0 },
            uCurveSoftness: { value: SETTINGS.curveSoftness },
            uFilmBase: { value: new THREE.Color(SETTINGS.filmBase) },
            uWeldMetal: { value: new THREE.Color(SETTINGS.weldMetal) },
            uHeatZone: { value: new THREE.Color(SETTINGS.heatZone) },
            uDefectColor: { value: new THREE.Color(SETTINGS.defectColor) },
            uBgColor: { value: new THREE.Color(SETTINGS.bgColor) },
            uAccentColor: { value: new THREE.Color(SETTINGS.accentColor) },
            uDataTexture: { value: dataTexture }
        };

        const material = new THREE.ShaderMaterial({
            vertexShader: wallVertexShader,
            fragmentShader: wallFragmentShader,
            uniforms,
            side: THREE.BackSide,
            transparent: false
        });

        const geometry = new THREE.CylinderGeometry(100, 100, 80, 160, 1, true);
        const wall = new THREE.Mesh(geometry, material);
        tunnelGroup.add(wall);

        // PARTICLES (Radiographic Ionization Sparks / Silver Emulsion Crystals)
        const particleCount = 1400;
        const particleGeometry = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        const particleSpeeds = new Float32Array(particleCount);

        for (let i = 0; i < particleCount; i++) {
            const angle = Math.random() * Math.PI * 2;
            const radius = 98.2 + Math.random() * 1.6;
            const y = -11.0 + Math.random() * 49.0;

            particlePositions[i * 3] = Math.cos(angle) * radius;
            particlePositions[i * 3 + 1] = y;
            particlePositions[i * 3 + 2] = Math.sin(angle) * radius;
            particleSpeeds[i] = 0.35 + Math.random() * 1.6;
        }

        particleGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        particleGeometry.setAttribute('aSpeed', new THREE.BufferAttribute(particleSpeeds, 1));

        const particleUniforms = {
            uTime: { value: 0.0 },
            uSpeed: { value: SETTINGS.streamSpeed * SETTINGS.animationSpeed },
            uCurveSoftness: { value: SETTINGS.curveSoftness },
            uParticleColor: { value: new THREE.Color(SETTINGS.weldMetal) }
        };

        const particleMaterial = new THREE.ShaderMaterial({
            uniforms: particleUniforms,
            vertexShader: `
                uniform float uTime;
                uniform float uSpeed;
                uniform float uCurveSoftness;
                attribute float aSpeed;
                varying float vAlpha;

                void main() {
                    vec3 pos = position;

                    float angle = atan(pos.z, pos.x);
                    float radius = length(pos.xz);
                    float currentAngle = angle - uTime * uSpeed * 0.006 * aSpeed;

                    float normX = cos(currentAngle);
                    float n = max(1.0, uCurveSoftness);
                    float absZ = pow(max(0.00001, 1.0 - pow(abs(normX), n)), 1.0 / n) * radius;

                    pos.x = cos(currentAngle) * radius;
                    pos.z = sign(sin(currentAngle)) * absZ;

                    vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                    gl_PointSize = (10.0 / -mvPosition.z);
                    gl_Position = projectionMatrix * mvPosition;

                    vAlpha = smoothstep(38.0, 24.0, pos.y) * smoothstep(-12.0, -6.0, pos.y);
                }
            `,
            fragmentShader: `
                uniform vec3 uParticleColor;
                varying float vAlpha;

                void main() {
                    vec2 xy = gl_PointCoord.xy - vec2(0.5);
                    float d = length(xy);
                    if (d > 0.5) discard;

                    float intensity = 1.0 - (d * 2.0);
                    gl_FragColor = vec4(uParticleColor, vAlpha * intensity * 0.6);
                }
            `,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const particles = new THREE.Points(particleGeometry, particleMaterial);
        tunnelGroup.add(particles);

        // POST-PROCESSING COMPOSER & PASSES
        const composer = new EffectComposer(renderer);
        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);

        const PeripheralBlurShader = {
            uniforms: {
                tDiffuse: { value: null },
                uStrength: { value: SETTINGS.edgeBlurStrength },
                uAspect: { value: window.innerWidth / window.innerHeight }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D tDiffuse;
                uniform float uStrength;
                uniform float uAspect;
                varying vec2 vUv;

                void main() {
                    vec2 center = vec2(0.5, 0.5);
                    vec2 uvCorrection = vec2(uAspect, 1.0);
                    float dist = length((vUv - center) * uvCorrection);
                    float blurMask = smoothstep(0.2, 0.8, dist);

                    if (blurMask <= 0.0) {
                        gl_FragColor = texture2D(tDiffuse, vUv);
                        return;
                    }

                    const int SAMPLES = 24;
                    const float GOLDEN_ANGLE = 2.39996323;
                    vec4 color = vec4(0.0);
                    float radius = uStrength * blurMask;

                    for (int i = 0; i < SAMPLES; i++) {
                        float r = sqrt(float(i) + 0.5) / sqrt(float(SAMPLES));
                        float theta = float(i) * GOLDEN_ANGLE;
                        vec2 offset = vec2(cos(theta), sin(theta)) * r * radius;
                        offset.x /= uAspect;
                        color += texture2D(tDiffuse, vUv + offset);
                    }
                    gl_FragColor = color / float(SAMPLES);
                }
            `
        };
        const peripheralBlurPass = new ShaderPass(PeripheralBlurShader);
        composer.addPass(peripheralBlurPass);

        const ChromaticAberrationShader = {
            uniforms: {
                tDiffuse: { value: null },
                uAmount: { value: SETTINGS.chromaticAberration }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D tDiffuse;
                uniform float uAmount;
                varying vec2 vUv;

                void main() {
                    vec2 offset = uAmount * (vec2(0.5) - vUv);
                    vec4 cr = texture2D(tDiffuse, vUv + offset);
                    vec4 cga = texture2D(tDiffuse, vUv);
                    vec4 cb = texture2D(tDiffuse, vUv - offset);
                    gl_FragColor = vec4(cr.r, cga.g, cb.b, cga.a);
                }
            `
        };
        const caPass = new ShaderPass(ChromaticAberrationShader);
        composer.addPass(caPass);

        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            SETTINGS.bloomStrength,
            SETTINGS.bloomRadius,
            0.2
        );
        composer.addPass(bloomPass);

        // TRANSFORMS & BACKGROUND UPDATES
        const updateBackground = () => {
            const activeBg = SETTINGS.greenScreen ? SETTINGS.greenScreenColor : SETTINGS.bgColor;
            uniforms.uBgColor.value.set(activeBg);
            scene.background.set(activeBg);
            document.body.style.backgroundColor = activeBg;
        };

        const updateColors = () => {
            uniforms.uFilmBase.value.set(SETTINGS.filmBase);
            uniforms.uWeldMetal.value.set(SETTINGS.weldMetal);
            uniforms.uHeatZone.value.set(SETTINGS.heatZone);
            uniforms.uDefectColor.value.set(SETTINGS.defectColor);
            uniforms.uAccentColor.value.set(SETTINGS.accentColor);
            particleUniforms.uParticleColor.value.set(SETTINGS.weldMetal);
            updateBackground();
        };

        const applyColorScheme = (name) => {
            const scheme = COLOR_SCHEMES[name];
            if (!scheme) return;
            SETTINGS.colorScheme = name;
            SETTINGS.filmBase = scheme.filmBase;
            SETTINGS.weldMetal = scheme.weldMetal;
            SETTINGS.heatZone = scheme.heatZone;
            SETTINGS.defectColor = scheme.defectColor;
            SETTINGS.bgColor = scheme.bgColor;
            SETTINGS.accentColor = scheme.accentColor;
            updateColors();
            gui.controllersRecursive().forEach(c => c.updateDisplay());
        };

        const updateObjectTransform = () => {
            tunnelGroup.position.x = SETTINGS.objectX;
            tunnelGroup.position.y = SETTINGS.objectY;
            tunnelGroup.scale.set(
                SETTINGS.curveWidth * SETTINGS.zoom,
                SETTINGS.height * SETTINGS.zoom,
                SETTINGS.curveDepth * SETTINGS.zoom
            );
            tunnelGroup.rotation.z = SETTINGS.wallTilt * Math.PI / 180;
        };

        // PROCEDURAL RANDOMIZATION FUNCTION
        const randomizeScene = () => {
            // Pick a random scheme
            const schemeKeys = Object.keys(COLOR_SCHEMES);
            const randomSchemeName = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
            applyColorScheme(randomSchemeName);

            // Re-roll geometric & motion parameters
            SETTINGS.trackCount = Math.floor(THREE.MathUtils.randFloat(24, 90));
            SETTINGS.pitchVariance = THREE.MathUtils.randFloat(0.5, 2.2);
            SETTINGS.passThickness = THREE.MathUtils.randFloat(0.2, 0.65);
            SETTINGS.porosityRate = THREE.MathUtils.randFloat(0.15, 0.6);
            SETTINGS.porosityScale = THREE.MathUtils.randFloat(8.0, 22.0);
            SETTINGS.rootPenetration = THREE.MathUtils.randFloat(0.8, 1.8);
            SETTINGS.weldWaviness = THREE.MathUtils.randFloat(0.1, 0.6);

            SETTINGS.filmGamma = THREE.MathUtils.randFloat(1.2, 2.8);
            SETTINGS.filmGrain = THREE.MathUtils.randFloat(0.08, 0.28);
            SETTINGS.filmContrast = THREE.MathUtils.randFloat(0.9, 1.6);
            SETTINGS.exposure = THREE.MathUtils.randFloat(0.9, 1.5);

            SETTINGS.curveSoftness = THREE.MathUtils.randFloat(2.5, 9.0);
            SETTINGS.curveWidth = THREE.MathUtils.randFloat(0.25, 0.6);
            SETTINGS.curveDepth = THREE.MathUtils.randFloat(0.65, 1.35);
            SETTINGS.wallTilt = THREE.MathUtils.randFloat(-20, 20);
            SETTINGS.streamSpeed = THREE.MathUtils.randFloat(1.5, 6.0);
            SETTINGS.bloomStrength = THREE.MathUtils.randFloat(0.05, 0.35);
            SETTINGS.chromaticAberration = THREE.MathUtils.randFloat(0.001, 0.006);

            // Pick a random animation preset
            SETTINGS.animation = ANIMATIONS[Math.floor(Math.random() * ANIMATIONS.length)];

            // Push updates to uniforms
            uniforms.uTrackCount.value = SETTINGS.trackCount;
            uniforms.uPitchVariance.value = SETTINGS.pitchVariance;
            uniforms.uPassThickness.value = SETTINGS.passThickness;
            uniforms.uPorosityRate.value = SETTINGS.porosityRate;
            uniforms.uPorosityScale.value = SETTINGS.porosityScale;
            uniforms.uRootPenetration.value = SETTINGS.rootPenetration;
            uniforms.uWeldWaviness.value = SETTINGS.weldWaviness;
            uniforms.uFilmGamma.value = SETTINGS.filmGamma;
            uniforms.uFilmGrain.value = SETTINGS.filmGrain;
            uniforms.uFilmContrast.value = SETTINGS.filmContrast;
            uniforms.uExposure.value = SETTINGS.exposure;
            uniforms.uCurveSoftness.value = SETTINGS.curveSoftness;
            particleUniforms.uCurveSoftness.value = SETTINGS.curveSoftness;
            bloomPass.strength = SETTINGS.bloomStrength;
            caPass.uniforms.uAmount.value = SETTINGS.chromaticAberration;

            // Refresh radiograph lead markers
            generateRadiographTexture();
            dataTexture.needsUpdate = true;

            updateObjectTransform();
            gui.controllersRecursive().forEach(c => c.updateDisplay());
        };

        // LIL-GUI INITIALIZATION
        const gui = new GUI({ title: 'Weld Seam Radiograph' });

        const fPresets = gui.addFolder('Presets & Animation');
        fPresets.add(SETTINGS, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Color Scheme').onChange(applyColorScheme);
        fPresets.add(SETTINGS, 'animation', ANIMATIONS).name('Animation Mode');
        fPresets.add(SETTINGS, 'animationSpeed', 0.1, 3.0).name('Anim Speed').onChange(v => {
            uniforms.uSpeed.value = SETTINGS.streamSpeed * v;
            particleUniforms.uSpeed.value = SETTINGS.streamSpeed * v;
        });
        fPresets.add(SETTINGS, 'streamSpeed', 0.0, 10.0).name('Sweep Speed').onChange(v => {
            uniforms.uSpeed.value = v * SETTINGS.animationSpeed;
            particleUniforms.uSpeed.value = v * SETTINGS.animationSpeed;
        });
        fPresets.add(SETTINGS, 'randomizeOnClick').name('Randomize On Click');
        fPresets.add({ randomize: randomizeScene }, 'randomize').name('🎲 Randomize Scene');

        const fSeam = gui.addFolder('Weld Passes & Defects');
        fSeam.add(SETTINGS, 'trackCount', 10, 140, 1).name('Pass Track Count').onChange(v => uniforms.uTrackCount.value = v);
        fSeam.add(SETTINGS, 'pitchVariance', 0.0, 3.0).name('Pitch Noise (Irreg)').onChange(v => uniforms.uPitchVariance.value = v);
        fSeam.add(SETTINGS, 'passThickness', 0.1, 0.9).name('Pass Thickness').onChange(v => uniforms.uPassThickness.value = v);
        fSeam.add(SETTINGS, 'porosityRate', 0.0, 1.0).name('Porosity Defects').onChange(v => uniforms.uPorosityRate.value = v);
        fSeam.add(SETTINGS, 'porosityScale', 4.0, 35.0).name('Pore Scale').onChange(v => uniforms.uPorosityScale.value = v);
        fSeam.add(SETTINGS, 'rootPenetration', 0.2, 3.0).name('Root Penetration').onChange(v => uniforms.uRootPenetration.value = v);
        fSeam.add(SETTINGS, 'weldWaviness', 0.0, 1.0).name('Pass Weaving').onChange(v => uniforms.uWeldWaviness.value = v);

        const fRadiography = gui.addFolder('Radiographic Film Density');
        fRadiography.add(SETTINGS, 'filmGamma', 0.5, 4.0).name('Film Gamma Curve').onChange(v => uniforms.uFilmGamma.value = v);
        fRadiography.add(SETTINGS, 'filmGrain', 0.0, 0.5).name('Film Grain (Halide)').onChange(v => uniforms.uFilmGrain.value = v);
        fRadiography.add(SETTINGS, 'filmContrast', 0.5, 2.5).name('Film Contrast').onChange(v => uniforms.uFilmContrast.value = v);
        fRadiography.add(SETTINGS, 'exposure', 0.2, 3.0).name('X-Ray Exposure').onChange(v => uniforms.uExposure.value = v);
        fRadiography.add(SETTINGS, 'invertDensity').name('Invert (Positive Print)').onChange(v => uniforms.uInvertDensity.value = v ? 1.0 : 0.0);

        const fGeometry = gui.addFolder('Geometry & Shape');
        fGeometry.add(SETTINGS, 'curveSoftness', 1.0, 10.0).name('Curve Softness').onChange(v => {
            uniforms.uCurveSoftness.value = v;
            particleUniforms.uCurveSoftness.value = v;
        });
        fGeometry.add(SETTINGS, 'curveWidth', 0.1, 3.0).name('Pipe Width').onChange(updateObjectTransform);
        fGeometry.add(SETTINGS, 'curveDepth', 0.1, 3.0).name('Pipe Depth').onChange(updateObjectTransform);
        fGeometry.add(SETTINGS, 'height', 0.2, 3.0).name('Seam Height').onChange(updateObjectTransform);
        fGeometry.add(SETTINGS, 'wallTilt', -180, 180).name('Gantry Tilt (deg)').onChange(updateObjectTransform);
        fGeometry.add(SETTINGS, 'zoom', 0.15, 5.0).name('Zoom').onChange(updateObjectTransform);
        fGeometry.add(SETTINGS, 'objectX', -100.0, 100.0).name('Object X').onChange(updateObjectTransform);
        fGeometry.add(SETTINGS, 'objectY', -60.0, 60.0).name('Object Y').onChange(updateObjectTransform);
        fGeometry.add(SETTINGS, 'fov', 30, 140).name('Camera FOV').onChange(v => {
            camera.fov = v;
            camera.updateProjectionMatrix();
        });

        const fColors = gui.addFolder('Colors & Film Base');
        fColors.addColor(SETTINGS, 'weldMetal').name('Weld Metal (Pass)').onChange(updateColors);
        fColors.addColor(SETTINGS, 'heatZone').name('Heat Affected Zone').onChange(updateColors);
        fColors.addColor(SETTINGS, 'defectColor').name('Void / Defect').onChange(updateColors);
        fColors.addColor(SETTINGS, 'filmBase').name('Film Density Base').onChange(updateColors);
        fColors.addColor(SETTINGS, 'bgColor').name('Lightbox BG').onChange(updateColors);
        fColors.addColor(SETTINGS, 'accentColor').name('Lead Marker/IQI').onChange(updateColors);
        fColors.add(SETTINGS, 'greenScreen').name('Green Screen').onChange(updateBackground);
        fColors.addColor(SETTINGS, 'greenScreenColor').name('Green Color').onChange(updateBackground);

        const fEffects = gui.addFolder('Post-Processing & Quality');
        fEffects.add(SETTINGS, 'dpr', 0.25, 3.0, 0.05).name('Pixel Ratio (DPR)').onChange(v => {
            renderer.setPixelRatio(v);
            composer.setPixelRatio(v);
        });
        fEffects.add(SETTINGS, 'bloomStrength', 0.0, 2.0).name('Scatter Bloom').onChange(v => bloomPass.strength = v);
        fEffects.add(SETTINGS, 'bloomRadius', 0.0, 2.0).name('Bloom Radius').onChange(v => bloomPass.radius = v);
        fEffects.add(SETTINGS, 'chromaticAberration', 0.0, 0.02).name('Beam Shift').onChange(v => caPass.uniforms.uAmount.value = v);
        fEffects.add(SETTINGS, 'edgeBlurStrength', 0.0, 0.04).name('Edge Blur').onChange(v => peripheralBlurPass.uniforms.uStrength.value = v);

        // KEYBOARD SHORTCUT: Toggle GUI with 'H'
        window.addEventListener('keydown', (e) => {
            if (e.key === 'h' || e.key === 'H') {
                gui._hidden ? gui.show() : gui.hide();
            }
        });

        // INTERACTIVE POINTER & ZOOM DRAG CONTROLS
        const dragState = {
            active: false,
            pointerId: null,
            startX: 0,
            startY: 0,
            objectX: 0,
            objectY: 0,
            totalTravel: 0
        };

        renderer.domElement.addEventListener('wheel', (event) => {
            event.preventDefault();
            const zoomFactor = event.deltaY > 0 ? 0.92 : 1.08;
            SETTINGS.zoom = THREE.MathUtils.clamp(SETTINGS.zoom * zoomFactor, 0.15, 5.0);
            updateObjectTransform();
            gui.controllersRecursive().find(controller => controller.property === 'zoom')?.updateDisplay();
        }, { passive: false });

        renderer.domElement.addEventListener('pointerdown', (event) => {
            if (event.button !== 0) return;
            dragState.active = true;
            dragState.pointerId = event.pointerId;
            dragState.startX = event.clientX;
            dragState.startY = event.clientY;
            dragState.objectX = SETTINGS.objectX;
            dragState.objectY = SETTINGS.objectY;
            dragState.totalTravel = 0;
            renderer.domElement.setPointerCapture(event.pointerId);
        });

        renderer.domElement.addEventListener('pointermove', (event) => {
            if (!dragState.active || event.pointerId !== dragState.pointerId) return;
            const dx = event.clientX - dragState.startX;
            const dy = event.clientY - dragState.startY;
            dragState.totalTravel += Math.hypot(dx, dy);

            const worldUnitsPerPixel = 0.12 / SETTINGS.zoom;
            SETTINGS.objectX = dragState.objectX + dx * worldUnitsPerPixel;
            SETTINGS.objectY = dragState.objectY - dy * worldUnitsPerPixel;
            updateObjectTransform();
        });

        const endDrag = (event) => {
            if (!dragState.active || event.pointerId !== dragState.pointerId) return;
            const wasClick = dragState.totalTravel < 6;
            dragState.active = false;
            dragState.pointerId = null;
            renderer.domElement.releasePointerCapture(event.pointerId);

            gui.controllersRecursive().forEach(controller => {
                if (controller.property === 'objectX' || controller.property === 'objectY') {
                    controller.updateDisplay();
                }
            });

            // Click-to-randomize if user performed a single click without dragging
            if (wasClick && SETTINGS.randomizeOnClick) {
                randomizeScene();
            }
        };

        renderer.domElement.addEventListener('pointerup', endDrag);
        renderer.domElement.addEventListener('pointercancel', endDrag);

        // ANIMATION LOOP
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const t = clock.getElapsedTime();
            const animSpeed = SETTINGS.animationSpeed;

            uniforms.uTime.value = t;
            particleUniforms.uTime.value = t;

            // Apply 8 preconfigured smooth inspection animations
            switch (SETTINGS.animation) {
                case 'Static (No Camera Motion)':
                    camera.position.set(0, SETTINGS.cameraY, 0);
                    camera.rotation.set(0, 0, 0);
                    break;

                case 'Circumferential Weld Scan (Continuous 360°)':
                    camera.position.set(0, SETTINGS.cameraY, 0);
                    camera.rotation.y = t * 0.12 * animSpeed;
                    camera.rotation.z = 0;
                    break;

                case 'Pipe Penetration Orbit (Subtle Figure-8)':
                    camera.position.x = Math.sin(t * 0.4 * animSpeed) * 10.0;
                    camera.position.y = SETTINGS.cameraY + Math.sin(t * 0.8 * animSpeed) * 3.0;
                    camera.position.z = Math.cos(t * 0.4 * animSpeed) * 5.0;
                    camera.rotation.y = Math.sin(t * 0.4 * animSpeed) * 0.1;
                    camera.rotation.z = Math.cos(t * 0.4 * animSpeed) * 0.02;
                    break;

                case 'Root Pass Depth Travel (Push/Pull Focus)':
                    camera.position.x = 0;
                    camera.position.y = SETTINGS.cameraY;
                    camera.position.z = Math.sin(t * 0.45 * animSpeed) * 14.0;
                    camera.rotation.set(0, 0, 0);
                    break;

                case 'NDT Lightbox Sweep (Horizontal Translation)':
                    camera.position.x = Math.sin(t * 0.35 * animSpeed) * 7.5;
                    camera.position.y = SETTINGS.cameraY + Math.cos(t * 0.2 * animSpeed) * 1.2;
                    camera.position.z = 0;
                    camera.rotation.y = Math.sin(t * 0.25 * animSpeed) * 0.07;
                    camera.rotation.z = 0;
                    break;

                case 'Radiographic Tilt & Roll (C-Arm Gantry Glide)':
                    camera.position.x = Math.sin(t * 0.28 * animSpeed) * 5.0;
                    camera.position.y = SETTINGS.cameraY + Math.sin(t * 0.5 * animSpeed) * 2.5;
                    camera.position.z = 0;
                    camera.rotation.x = Math.sin(t * 0.35 * animSpeed) * 0.04;
                    camera.rotation.z = Math.cos(t * 0.3 * animSpeed) * 0.05;
                    break;

                case 'Film Exposure Breathing (Slow Gamma Pulse)':
                    const pulse = Math.sin(t * 0.5 * animSpeed);
                    camera.position.set(0, SETTINGS.cameraY, pulse * 3.5);
                    camera.rotation.set(0, 0, 0);
                    uniforms.uFilmGamma.value = SETTINGS.filmGamma + pulse * 0.35;
                    break;

                case 'Vertical Seam Traverse (Elevator Inspection)':
                    camera.position.x = 0;
                    camera.position.y = SETTINGS.cameraY + Math.sin(t * 0.4 * animSpeed) * 11.0;
                    camera.position.z = 0;
                    camera.rotation.set(0, 0, 0);
                    break;
            }

            composer.render();
        }

        updateColors();
        updateObjectTransform();
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
            peripheralBlurPass.uniforms.uAspect.value = window.innerWidth / window.innerHeight;
        });
    </script>
</body>
