<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#030617">
  <meta name="description" content="An endless, forty-second study in flowing cyan and gold liquid metal.">
  <link rel="icon" href="data:,">
  <title>Aurum — Liquid Light</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #030617; }
    canvas { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
    canvas.dragging { cursor: grabbing; }
    #fallback { display: none; position: fixed; inset: 0; place-content: center; padding: 2rem;
      color: #a4e6e5; background: #030617; font: 16px/1.6 system-ui, sans-serif; text-align: center; }
    #fallback.visible { display: grid; }
  </style>
</head>
<body>
  <canvas aria-label="Slowly flowing ribbons of polished blue metal with cyan and molten gold reflections"></canvas>
  <div id="fallback" role="status"></div>
  <script type="module">
    const canvas = document.querySelector('canvas');
    const fallback = document.querySelector('#fallback');
    const showFallback = (message) => {
      fallback.textContent = message;
      fallback.classList.add('visible');
    };

    try {
      const [THREE, { default: GUI }] = await Promise.all([
        import('https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js'),
        import('https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js')
      ]);
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false,
        powerPreference: 'high-performance', depth: false, stencil: false });
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.NoToneMapping;

      const original = ['#030617', '#17132e', '#153d59', '#287f9c', '#42bcd5', '#a4e6e5', '#ffd27b', '#ff792f'];
      const schemes = {
        'Original': { colors: original, background: '#030617' },
        'Monochromatic': { colors: ['#07111d', '#132b40', '#214663', '#34769a', '#64b3d0', '#c4edf3', '#b5d9e8', '#4b91b5'], background: '#040c15' },
        'Analogous': { colors: ['#05141e', '#18324b', '#17475e', '#247b89', '#53c9bd', '#bbefe0', '#a2d6b4', '#5c999e'], background: '#041018' },
        'Complementary': { colors: ['#08111e', '#192a42', '#194464', '#267b9c', '#58bed2', '#cce7e6', '#ffc484', '#ed733c'], background: '#050b16' },
        'Split-complementary': { colors: ['#10101e', '#282242', '#334a78', '#6375a8', '#8faed8', '#e0dbee', '#e8bd69', '#d27483'], background: '#080a18' },
        'Triadic': { colors: ['#10141e', '#3a2245', '#195364', '#2d8c97', '#6bc7d1', '#e2eee3', '#e6bc64', '#ca638b'], background: '#080f19' },
        'Tetradic': { colors: ['#12151d', '#3f2d56', '#255063', '#438a9a', '#87c7d2', '#e6dfd2', '#d2bb70', '#d47c6c'], background: '#0b0e19' },
        'Double split-complementary': { colors: ['#121723', '#4a3c68', '#355d73', '#649989', '#90bec9', '#e3d9c3', '#d1a567', '#b56f8e'], background: '#090e18' },
        'Achromatic': { colors: ['#050505', '#151515', '#353535', '#777777', '#b7b7b7', '#ffffff', '#f0f0f0', '#a0a0a0'], background: '#000000' },
        'Achromatic + Accent': { colors: ['#050505', '#171717', '#383838', '#777777', '#bebebe', '#ffffff', '#ff3043', '#df1830'], background: '#000000' },
        'Neutral + accent': { colors: ['#191817', '#373430', '#55514b', '#858078', '#beb7ab', '#eee7da', '#ff6c38', '#e63e26'], background: '#100f0e' },
        'Amber / Oxblood': { palette: ['#F6AA1C', '#BC3908', '#941B0C', '#F6AA1C', '#220901'] },
        'Lagoon / Midnight': { palette: ['#63D1CF', '#5BC0BE', '#4BAD9E', '#4BAD9E', '#0B132B', '#000000'] },
        'Orchid / Aubergine': { palette: ['#AA60C8', '#D69ADE', '#C9A3C6', '#CFB5C2', '#0D001D', '#120A12'] },
        'Saffron / Petrol': { palette: ['#FEF1BE', '#FFBA00', '#008189', '#00474D', '#061210'] },
        'Chartreuse / Forest': { palette: ['#D4FFB0', '#7FFF00', '#00B894', '#0A3322', '#05140A'] },
        'Tangerine / Plum': { palette: ['#FFE8CC', '#FF8C00', '#C7501A', '#3D1050', '#0E0618'] },
        'Lavender / Violet': { palette: ['#E8E0FF', '#B38FFF', '#6A3DE8', '#1A1250', '#090612'] },
        'Cyan / Magenta': { palette: ['#E0FBFF', '#00F0FF', '#D40078', '#1E0A3D', '#05020F'] }
      };
      for (const scheme of Object.values(schemes)) {
        if (!scheme.palette) continue;
        const p = scheme.palette;
        scheme.colors = [p.at(-1), p.at(-2), p[2], p[1], p[0], p[3], p[0], p[1]];
        scheme.background = p.at(-1);
      }
      const animations = ['Liquid drift', 'Satin tide', 'Ribbon breathing', 'Traveling folds',
        'Light sweep', 'Slow orbit', 'Macro glide', 'Static'];
      const config = {
        scheme: 'Original', invert: false, greenscreen: false, background: '#030617',
        shadow: original[0], indigo: original[1], petrol: original[2], teal: original[3],
        cyan: original[4], ice: original[5], gold: original[6], orange: original[7],
        animation: 'Liquid drift', speed: 1, motion: 1, seed: 0,
        scale: 1, amplitude: 1, warp: 1, density: 7.2, channels: 0.25,
        contrast: 1.12, reflections: 1, sharpness: 1, bloom: 0.14,
        antialias: true, pixelRatio: Math.min(devicePixelRatio || 1, 1.75),
        zoom: 1, panX: 0, panY: 0, yaw: 0, pitch: 0, roll: 0,
        randomizeOnClick: true
      };
      const colorKeys = ['shadow', 'indigo', 'petrol', 'teal', 'cyan', 'ice', 'gold', 'orange'];

      const uniforms = {
        uTime: { value: 0 },
        uResolution: { value: new THREE.Vector2() },
        uLoopDuration: { value: 40 },
        uFlowSpeed: { value: 1 },
        uWaveScale: { value: 1 },
        uWaveAmplitude: { value: 1 },
        uWarpStrength: { value: 1 },
        uRibbonDensity: { value: 7.2 },
        uMetallicContrast: { value: 1.12 },
        uReflectionIntensity: { value: 1 },
        uHighlightSharpness: { value: 1 },
        uBloomIntensity: { value: 0.14 },
        uOrbit: { value: new THREE.Vector2(1, 0) },
        uSeed: { value: 0 },
        uZoom: { value: 1 },
        uPan: { value: new THREE.Vector2() },
        uView: { value: new THREE.Matrix3() },
        uLightOffset: { value: 0 },
        uChannelCut: { value: -0.018 },
        uGreenscreen: { value: false },
        uInvert: { value: false },
        uKeepAccent: { value: false },
        uBackground: { value: new THREE.Color(config.background) },
        uPalette: { value: original.map(color => new THREE.Color(color)) }
      };

      const material = new THREE.ShaderMaterial({
        uniforms,
        depthTest: false,
        depthWrite: false,
        vertexShader: /* glsl */`
          void main() {
            gl_Position = vec4(position.xy, 0.0, 1.0);
          }
        `,
        fragmentShader: /* glsl */`
          precision highp float;
          uniform vec2 uResolution;
          uniform float uTime, uLoopDuration, uFlowSpeed;
          uniform float uWaveScale, uWaveAmplitude, uWarpStrength, uRibbonDensity;
          uniform float uMetallicContrast, uReflectionIntensity;
          uniform float uHighlightSharpness, uBloomIntensity;
          uniform vec2 uOrbit, uPan;
          uniform mat3 uView;
          uniform float uSeed, uZoom, uLightOffset, uChannelCut;
          uniform bool uGreenscreen, uInvert, uKeepAccent;
          uniform vec3 uBackground, uPalette[8];
          const float TAU = 6.28318530718;

          float hash(vec2 p) {
            p = fract(p * vec2(123.34, 456.21));
            p += dot(p, p + 45.32);
            return fract(p.x * p.y);
          }

          // Quintic interpolation keeps both the field and its normals smooth.
          float noise(vec2 p) {
            vec2 i = floor(p), f = fract(p);
            vec2 w = f*f*f * (f*(f*6.0 - 15.0) + 10.0);
            return mix(mix(hash(i), hash(i + vec2(1, 0)), w.x),
                       mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), w.x), w.y);
          }

          float fbm(vec2 p) {
            float sum = 0.0, gain = 0.57;
            mat2 turn = mat2(0.80, -0.60, 0.60, 0.80);
            for (int i = 0; i < 3; i++) {
              sum += gain * noise(p);
              p = turn * p * 2.03 + vec2(7.1, 3.9);
              gain *= 0.46;
            }
            return sum;
          }

          // Every moving coordinate is a function of this single circular phase.
          // No translating noise or accumulating offsets: t and t + 40 match.
          vec2 flow(vec2 p, vec2 orbit) {
            p *= uWaveScale;
            p += 0.45*vec2(sin(uSeed*1.7), cos(uSeed*0.83) - 1.0);
            float y = p.y + 0.07*sin(p.x*2.8 + 0.6);
            float bend = 0.205 * sin(5.25*y + 0.65 + 0.18*orbit.x)
                       + 0.076 * sin(9.4*y - 0.7 + 2.2*p.x + 0.20*orbit.y)
                       + 0.035 * sin(2.8*y + 3.1*p.x + 0.24*orbit.x);
            float warp = fbm(vec2(p.x*1.65 + 2.4, y*2.1 - 3.8) + 0.065*orbit);
            float x = p.x + uWaveAmplitude*bend + 0.19*y;
            x += uWarpStrength * 0.075*(warp - 0.44);
            x += 0.009*sin(p.x*14.0 + y*4.0) + 0.005*sin(p.x*23.0 - y*2.0);
            x += 0.012 * sin(3.6*y + 2.2*p.x + orbit.y*0.45);
            return vec2(x, y);
          }

          float surface(vec2 p, vec2 orbit) {
            vec2 q = flow(p, orbit);
            float a = TAU * (q.x*uRibbonDensity + 0.11*sin(q.y*3.2 + q.x*7.0));
            // The harmonics form a round, broad shoulder and a tighter folded lip.
            float lip = 0.22 + 0.065*sin(q.x*8.2 + q.y*2.4);
            float profile = 0.72*sin(a) + lip*sin(2.0*a + 0.8)
                          + 0.055*sin(3.0*a + 0.5);
            float swell = 0.88 + 0.20*sin(q.y*4.0 + q.x*7.7 + 0.3*orbit.y);
            return 0.026 * profile * swell;
          }

          float band(float position, float center, float width) {
            // Reflections live on a circle; wrap the distance at the back of the
            // environment too, so no lighting seam can cut across a steep fold.
            float antialiasedWidth = max(width, 0.65*fwidth(position));
            float d = (mod(position-center + 0.5*TAU, TAU) - 0.5*TAU) / antialiasedWidth;
            return exp(-d*d);
          }

          vec3 invertColor(vec3 color) {
            float chroma = max(max(color.r, color.g), color.b) - min(min(color.r, color.g), color.b);
            float keep = uKeepAccent ? smoothstep(0.04, 0.25, chroma) : 0.0;
            return mix(vec3(1.0)-color, color, keep);
          }

          void main() {
            vec2 screen = (gl_FragCoord.xy - 0.5*uResolution) / min(uResolution.x, uResolution.y);
            vec3 rayOrigin = uView * vec3(screen/uZoom, 2.0);
            vec3 rayDirection = uView * vec3(0.0, 0.0, -1.0);
            vec2 p = (rayOrigin - rayDirection*(rayOrigin.z/rayDirection.z)).xy + uPan;
            vec2 orbit = uOrbit;
            vec2 q = flow(p, orbit);
            float h = surface(p, orbit);
            const float e = 0.00035;
            vec2 slope = vec2(surface(p + vec2(e, 0), orbit) - surface(p - vec2(e, 0), orbit),
                              surface(p + vec2(0, e), orbit) - surface(p - vec2(0, e), orbit)) / (2.0*e);
            vec3 normal = normalize(vec3(-slope, 1.0));
            vec3 reflected = reflect(rayDirection, normal);
            // Project onto the cross-ribbon normal before reflecting the studio.
            // This avoids a cylindrical environment's singularities at its poles.
            float azimuth = 2.0*atan(normal.x, normal.z) - atan(-rayDirection.x, -rayDirection.z);
            float elevation = reflected.y;

            vec3 navy = uPalette[0], indigo = uPalette[1];
            vec3 petrol = uPalette[2], teal = uPalette[3];
            vec3 cyan = uPalette[4], ice = uPalette[5];
            vec3 gold = uPalette[6], orange = uPalette[7];

            // A procedural studio environment: dark walls and long colored softboxes.
            float lighting = 0.88 + 0.12*sin(q.y*3.5 + q.x*2.3 + orbit.x*0.4);
            float coolAngle = azimuth + 0.16*elevation + uLightOffset;
            float broad = band(coolAngle, -1.62, 1.35);
            float cyanBox = band(coolAngle, -1.65, 0.85);
            float iceBox = band(coolAngle, -1.92 + 0.23*elevation, 0.36);
            float purpleBox = band(coolAngle, 1.75, 0.50);
            float blueRim = band(coolAngle, 1.94, 0.12);

            // The gold softbox is strongest where the ribbons turn into the light.
            float warmMask = smoothstep(-0.48, 0.54,
              elevation + 0.34*sin(q.y*4.8 + q.x*6.1 + 0.18*orbit.y));
            float warmCenter = -1.95 + 0.19*sin(q.y*3.3 + q.x*3.0 + orbit.y*0.3);
            float amberBox = band(coolAngle, warmCenter, 0.19) * warmMask;
            float goldBox = band(coolAngle, warmCenter - 0.12, 0.042/uHighlightSharpness);
            goldBox *= 0.22 + 0.78*warmMask;
            float filament = band(coolAngle, 2.10, 0.018/uHighlightSharpness);
            float iceFilament = band(coolAngle, 2.04, 0.018/uHighlightSharpness);

            float occlusion = smoothstep(-0.031, 0.024, h);
            vec3 color = mix(navy*0.66, navy + 0.26*indigo, 0.3 + 0.7*occlusion);
            vec3 environment = petrol*broad*0.70 + teal*broad*0.90;
            environment += cyan*cyanBox*0.50 + ice*iceBox*0.74;
            environment += indigo*purpleBox*1.75 + teal*blueRim*0.50;
            environment *= 1.0 - 0.72*amberBox;
            environment += orange*amberBox*1.18 + gold*goldBox*1.18;
            environment += gold*filament*(0.32 + 0.68*warmMask) + ice*iceFilament*0.75;
            float fresnel = pow(1.0 - clamp(dot(normal, -rayDirection), 0.0, 1.0), 3.0);
            color += environment * lighting * uReflectionIntensity * (0.72 + 0.28*occlusion);
            color += petrol * fresnel * 0.026;

            // Wide, low-energy lobes give the brightest lines a restrained optical halo.
            color += uBloomIntensity * (
              gold*band(coolAngle, warmCenter - 0.12, 0.105)*warmMask*0.32 +
              ice*band(coolAngle, 2.04, 0.065)*0.21);
            color = pow(max(color, vec3(0.0)), vec3(uMetallicContrast));
            // Separate the raised ribbons from their recessed, replaceable channels.
            float edge = max(fwidth(h)*0.8, 0.0001) + (uGreenscreen ? 0.0001 : 0.003);
            float coverage = smoothstep(uChannelCut - edge, uChannelCut + edge, h);
            // Composite in display space to keep chroma-key channels exactly #00ff00.
            gl_FragColor = vec4(mix(uBackground, color, coverage), 1.0);
            // Encode once here. The optional FXAA pass filters these display values.
            gl_FragColor = sRGBTransferOETF(gl_FragColor);
            if (uInvert) gl_FragColor.rgb = invertColor(gl_FragColor.rgb);
            if (uGreenscreen) {
              vec3 ribbon = color;
              ribbon = sRGBTransferOETF(vec4(ribbon, 1.0)).rgb;
              if (uInvert) ribbon = invertColor(ribbon);
              gl_FragColor.rgb = mix(vec3(0.0, 1.0, 0.0), ribbon, coverage);
            }
          }
        `
      });

      const scene = new THREE.Scene();
      const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
      const geometry = new THREE.PlaneGeometry(2, 2);
      scene.add(new THREE.Mesh(geometry, material));

      // FXAA handles shader-generated contours, which canvas MSAA alone cannot see.
      const target = new THREE.WebGLRenderTarget(1, 1, {
        depthBuffer: false, stencilBuffer: false, minFilter: THREE.LinearFilter,
        magFilter: THREE.LinearFilter, colorSpace: THREE.NoColorSpace
      });
      const fxaaUniforms = {
        tDiffuse: { value: target.texture },
        uTexel: { value: new THREE.Vector2() }
      };
      const fxaa = new THREE.ShaderMaterial({
        uniforms: fxaaUniforms, depthTest: false, depthWrite: false, toneMapped: false,
        vertexShader: material.vertexShader,
        fragmentShader: /* glsl */`
          precision highp float;
          uniform sampler2D tDiffuse;
          uniform vec2 uTexel;
          void main() {
            vec2 uv = gl_FragCoord.xy*uTexel;
            vec3 nw = texture2D(tDiffuse, uv + vec2(-1,-1)*uTexel).rgb;
            vec3 ne = texture2D(tDiffuse, uv + vec2(1,-1)*uTexel).rgb;
            vec3 sw = texture2D(tDiffuse, uv + vec2(-1,1)*uTexel).rgb;
            vec3 se = texture2D(tDiffuse, uv + vec2(1,1)*uTexel).rgb;
            vec3 center = texture2D(tDiffuse, uv).rgb;
            vec3 luma = vec3(0.299, 0.587, 0.114);
            float lnw = dot(nw,luma), lne = dot(ne,luma);
            float lsw = dot(sw,luma), lse = dot(se,luma), lm = dot(center,luma);
            float lo = min(lm, min(min(lnw,lne), min(lsw,lse)));
            float hi = max(lm, max(max(lnw,lne), max(lsw,lse)));
            if (hi-lo < max(0.025, hi*0.08)) {
              gl_FragColor = vec4(center,1);
              return;
            }
            vec2 direction = vec2(-((lnw+lne)-(lsw+lse)), (lnw+lsw)-(lne+lse));
            float reduce = max((lnw+lne+lsw+lse)*0.03125, 0.0078125);
            float inverse = 1.0/(min(abs(direction.x),abs(direction.y))+reduce);
            direction = clamp(direction*inverse, vec2(-6), vec2(6))*uTexel;
            vec3 a = 0.5*(texture2D(tDiffuse, uv-direction/6.0).rgb
                         + texture2D(tDiffuse, uv+direction/6.0).rgb);
            vec3 b = 0.5*a + 0.25*(texture2D(tDiffuse, uv-direction*0.5).rgb
                                  + texture2D(tDiffuse, uv+direction*0.5).rgb);
            float lb = dot(b,luma);
            gl_FragColor = vec4((lb < lo || lb > hi) ? a : b, 1);
          }
        `
      });
      const postScene = new THREE.Scene();
      postScene.add(new THREE.Mesh(geometry, fxaa));

      function draw() {
        if (config.antialias) {
          renderer.setRenderTarget(target);
          renderer.render(scene, camera);
          renderer.setRenderTarget(null);
          renderer.render(postScene, camera);
        } else {
          renderer.setRenderTarget(null);
          renderer.render(scene, camera);
        }
      }

      function resize() {
        // Respect the chosen DPR, bounded only by the GPU's texture dimensions.
        const limit = renderer.capabilities.maxTextureSize;
        const ratio = Math.min(config.pixelRatio, limit/innerWidth, limit/innerHeight);
        renderer.setPixelRatio(ratio);
        renderer.setSize(innerWidth, innerHeight, false);
        renderer.getDrawingBufferSize(uniforms.uResolution.value);
        target.setSize(uniforms.uResolution.value.x, uniforms.uResolution.value.y);
        fxaaUniforms.uTexel.value.set(1/uniforms.uResolution.value.x, 1/uniforms.uResolution.value.y);
      }
      addEventListener('resize', resize, { passive: true });
      resize();

      function sync() {
        uniforms.uFlowSpeed.value = config.speed;
        uniforms.uWaveAmplitude.value = config.amplitude;
        uniforms.uWarpStrength.value = config.warp;
        uniforms.uRibbonDensity.value = config.density;
        uniforms.uMetallicContrast.value = config.contrast;
        uniforms.uReflectionIntensity.value = config.reflections;
        uniforms.uHighlightSharpness.value = config.sharpness;
        uniforms.uBloomIntensity.value = config.bloom;
        uniforms.uSeed.value = config.seed;
        uniforms.uChannelCut.value = THREE.MathUtils.lerp(-0.028, 0.012, config.channels);
        uniforms.uGreenscreen.value = config.greenscreen;
        uniforms.uInvert.value = config.invert;
        uniforms.uKeepAccent.value = config.scheme === 'Achromatic + Accent' || config.scheme === 'Neutral + accent';
        uniforms.uBackground.value.set(config.background);
        colorKeys.forEach((key, i) => uniforms.uPalette.value[i].set(config[key]));
      }

      const gui = new GUI({ title: 'Aurum', width: 300 });
      function applyScheme() {
        const scheme = schemes[config.scheme];
        colorKeys.forEach((key, i) => { config[key] = scheme.colors[i]; });
        config.background = scheme.background;
        sync();
        gui.controllersRecursive().forEach(controller => controller.updateDisplay());
      }
      const palette = gui.addFolder('Color & background');
      palette.add(config, 'scheme', Object.keys(schemes)).name('Color scheme').onChange(applyScheme);
      palette.add(config, 'invert').name('Invert colors');
      palette.add(config, 'greenscreen').name('Greenscreen');
      palette.addColor(config, 'background').name('Background');
      const customColors = palette.addFolder('Material colors');
      const labels = ['Shadow', 'Indigo reflection', 'Deep metal', 'Midtone', 'Bright metal', 'Highlight', 'Gold reflection', 'Warm reflection'];
      colorKeys.forEach((key, i) => customColors.addColor(config, key).name(labels[i]));
      customColors.close();

      const motion = gui.addFolder('Animation');
      motion.add(config, 'animation', animations).name('Motion');
      motion.add(config, 'speed', 0, 2, 0.01).name('Speed');
      motion.add(config, 'motion', 0, 1.5, 0.01).name('Motion strength');

      const surface = gui.addFolder('Liquid metal');
      surface.add(config, 'density', 3, 13, 0.01).name('Ribbon density');
      surface.add(config, 'scale', 0.5, 2, 0.01).name('Wave scale');
      surface.add(config, 'amplitude', 0.3, 1.5, 0.01).name('Curvature');
      surface.add(config, 'warp', 0, 2, 0.01).name('Organic warp');
      surface.add(config, 'channels', 0, 0.85, 0.01).name('Channel width');
      surface.add(config, 'contrast', 0.75, 1.5, 0.01).name('Contrast');
      surface.add(config, 'reflections', 0.2, 1.8, 0.01).name('Reflections');
      surface.add(config, 'sharpness', 0.4, 2.5, 0.01).name('Highlight sharpness');
      surface.add(config, 'bloom', 0, 0.5, 0.01).name('Glow');
      surface.add(config, 'seed', 0, 9999, 1).name('Seed');
      surface.close();

      const view = gui.addFolder('Camera');
      view.add(config, 'zoom', 0.25, 5, 0.01).name('Zoom').listen();
      view.add(config, 'panX', -5, 5, 0.001).name('Pan X').listen();
      view.add(config, 'panY', -5, 5, 0.001).name('Pan Y').listen();
      view.add(config, 'yaw', -45, 45, 0.1).name('Yaw').listen();
      view.add(config, 'pitch', -45, 45, 0.1).name('Pitch').listen();
      view.add(config, 'roll', -180, 180, 0.1).name('Roll').listen();
      const actions = {
        resetView() {
          Object.assign(config, { zoom: 1, panX: 0, panY: 0, yaw: 0, pitch: 0, roll: 0 });
        },
        randomize() {
          const random = (min, max) => Math.round((min + Math.random()*(max-min))*100)/100;
          const names = Object.keys(schemes);
          const modes = animations.filter(name => name !== 'Static' && name !== config.animation);
          // Pick another palette and keep the user's framing and keying settings.
          config.scheme = names.filter(name => name !== config.scheme)[Math.floor(Math.random()*(names.length-1))];
          Object.assign(config, {
            seed: 1 + Math.floor(Math.random()*9999), density: random(5.0, 9.5),
            scale: random(0.8, 1.2), amplitude: random(0.65, 1.25), warp: random(0.4, 1.5),
            contrast: random(0.98, 1.22), reflections: random(0.8, 1.25),
            sharpness: random(0.8, 1.8), bloom: random(0.06, 0.22),
            animation: modes[Math.floor(Math.random()*modes.length)],
            speed: random(0.35, 0.95), motion: random(0.5, 1.15)
          });
          applyScheme();
        }
      };
      view.add(actions, 'resetView').name('Reset camera');
      view.close();
      const quality = gui.addFolder('Rendering');
      quality.add(config, 'antialias').name('Anti-aliasing (FXAA)');
      quality.add(config, 'pixelRatio', 0.5, 3, 0.05).name('Pixel ratio (DPR)').onChange(resize);
      quality.close();
      gui.add(config, 'randomizeOnClick').name('Randomize on click');
      gui.add(actions, 'randomize').name('New variation');
      gui.onChange(sync);
      sync();

      const rotation = new THREE.Matrix4();
      const angles = new THREE.Euler(0, 0, 0, 'YXZ');
      const radians = THREE.MathUtils.degToRad;
      function updateView() {
        const phase = Math.PI*2*(uniforms.uTime.value % uniforms.uLoopDuration.value)/uniforms.uLoopDuration.value;
        const mode = config.animation;
        const moving = mode !== 'Static';
        const t = moving ? phase : 0;
        const strength = config.motion;
        let yaw = config.yaw, pitch = config.pitch, roll = config.roll;
        let panX = config.panX, panY = config.panY, zoom = config.zoom;
        let scale = config.scale, cycle = t, deformation = moving ? strength : 0;
        if (mode === 'Satin tide') {
          panX += 0.028*(Math.cos(t)-1)*strength;
          panY += 0.035*Math.sin(t)*strength;
          deformation *= 0.75;
        } else if (mode === 'Ribbon breathing') {
          scale *= 1 + 0.06*Math.sin(t)*strength;
          zoom *= 1 + 0.025*Math.sin(t)*strength;
          deformation *= 0.6;
        } else if (mode === 'Traveling folds') {
          cycle = 2*t;
          deformation *= 0.7;
          panY += 0.022*Math.sin(t)*strength;
        } else if (mode === 'Light sweep') {
          deformation = 0;
        } else if (mode === 'Slow orbit') {
          yaw += 9*Math.sin(t)*strength;
          pitch += 6*(Math.cos(t)-1)*strength;
          roll += 2.5*Math.sin(t)*strength;
          deformation *= 0.55;
        } else if (mode === 'Macro glide') {
          panX += 0.055*Math.sin(t)*strength;
          panY += 0.07*(Math.cos(t)-1)*strength;
          yaw += 3*Math.sin(t)*strength;
          deformation *= 0.5;
        }
        // These are offsets around the user's view, never replacement camera values.
        angles.set(radians(pitch), radians(yaw), radians(roll), 'YXZ');
        rotation.makeRotationFromEuler(angles);
        uniforms.uView.value.setFromMatrix4(rotation);
        uniforms.uZoom.value = zoom;
        uniforms.uPan.value.set(panX, panY);
        uniforms.uWaveScale.value = scale;
        uniforms.uOrbit.value.set(1 + (Math.cos(cycle)-1)*deformation, Math.sin(cycle)*deformation);
        uniforms.uLightOffset.value = (mode === 'Light sweep' ? 0.35 : 0.045)*Math.sin(t)*strength;
      }

      // Pointer coordinates use the very same ray-plane projection as the shader.
      // Panning and cursor-anchored zoom therefore stay correct during an orbit.
      const pointerRay = new THREE.Vector3();
      const pointerOrigin = new THREE.Vector3();
      function projectPointer(x, y) {
        const size = Math.min(innerWidth, innerHeight);
        pointerOrigin.set((x-innerWidth*0.5)/size/uniforms.uZoom.value,
          (innerHeight*0.5-y)/size/uniforms.uZoom.value, 2).applyMatrix3(uniforms.uView.value);
        pointerRay.set(0, 0, -1).applyMatrix3(uniforms.uView.value);
        pointerOrigin.addScaledVector(pointerRay, -pointerOrigin.z/pointerRay.z);
        return new THREE.Vector2(pointerOrigin.x, pointerOrigin.y);
      }
      canvas.addEventListener('wheel', event => {
        event.preventDefault();
        updateView();
        const before = projectPointer(event.clientX, event.clientY);
        const delta = event.deltaY*(event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? innerHeight : 1);
        config.zoom = THREE.MathUtils.clamp(config.zoom*Math.exp(-delta*0.001), 0.25, 5);
        updateView();
        const after = projectPointer(event.clientX, event.clientY);
        config.panX += before.x-after.x;
        config.panY += before.y-after.y;
        updateView();
      }, { passive: false });

      let pointer = null;
      canvas.addEventListener('pointerdown', event => {
        if (pointer || (event.button !== 0 && event.button !== 2)) return;
        canvas.setPointerCapture(event.pointerId);
        pointer = { id: event.pointerId, startX: event.clientX, startY: event.clientY,
          x: event.clientX, y: event.clientY, moved: false,
          orbit: event.shiftKey || event.altKey || event.button === 2 };
      });
      canvas.addEventListener('pointermove', event => {
        if (!pointer || pointer.id !== event.pointerId) return;
        const distance = Math.hypot(event.clientX-pointer.startX, event.clientY-pointer.startY);
        if (!pointer.moved && distance <= 4) return;
        pointer.moved = true;
        canvas.classList.add('dragging');
        if (pointer.orbit) {
          config.yaw = THREE.MathUtils.clamp(config.yaw + (event.clientX-pointer.x)*0.15, -45, 45);
          config.pitch = THREE.MathUtils.clamp(config.pitch + (event.clientY-pointer.y)*0.15, -45, 45);
        } else {
          updateView();
          const before = projectPointer(pointer.x, pointer.y);
          const after = projectPointer(event.clientX, event.clientY);
          config.panX += before.x-after.x;
          config.panY += before.y-after.y;
        }
        pointer.x = event.clientX;
        pointer.y = event.clientY;
        updateView();
      });
      function releasePointer(event) {
        if (!pointer || pointer.id !== event.pointerId) return;
        const randomize = event.type === 'pointerup' && !pointer.moved && event.button === 0 && config.randomizeOnClick;
        pointer = null;
        canvas.classList.remove('dragging');
        if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
        if (randomize) actions.randomize();
      }
      canvas.addEventListener('pointerup', releasePointer);
      canvas.addEventListener('pointercancel', releasePointer);
      canvas.addEventListener('lostpointercapture', releasePointer);
      canvas.addEventListener('contextmenu', event => event.preventDefault());
      let uiVisible = true;
      addEventListener('keydown', event => {
        if (event.key.toLowerCase() !== 'h' || event.ctrlKey || event.metaKey || event.altKey || event.repeat) return;
        if (event.target.closest?.('input, textarea, select, [contenteditable="true"]')) return;
        uiVisible = !uiVisible;
        gui.show(uiVisible);
      });

      let elapsed = 0;
      let previous = null;
      let frame = 0;
      let contextLost = false;
      function render(now) {
        if (contextLost || document.hidden) return;
        if (previous !== null && config.animation !== 'Static') {
          elapsed += (now - previous) / 1000 * uniforms.uFlowSpeed.value;
        }
        previous = now;
        uniforms.uTime.value = elapsed % uniforms.uLoopDuration.value;
        updateView();
        draw();
        frame = requestAnimationFrame(render);
      }
      function resume() {
        previous = null;
        cancelAnimationFrame(frame);
        if (!document.hidden && !contextLost) frame = requestAnimationFrame(render);
      }
      document.addEventListener('visibilitychange', resume);
      canvas.addEventListener('webglcontextlost', (event) => {
        event.preventDefault();
        contextLost = true;
        cancelAnimationFrame(frame);
      });
      canvas.addEventListener('webglcontextrestored', () => {
        contextLost = false;
        resize();
        resume();
      });
      frame = requestAnimationFrame(render);
    } catch (error) {
      console.error('Unable to start the liquid-metal renderer:', error);
      showFallback('This artwork needs WebGL 2 and an internet connection to load Three.js.');
    }
  </script>
</body>
</html>
