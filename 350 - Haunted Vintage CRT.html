<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Haunted Vintage CRT Television with Static Manifestation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050805;
      user-select: none;
      -webkit-user-select: none;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>

  <!-- GSAP for smooth animations -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <!-- Import map for Three.js, lil-gui & PostProcessor -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js",
      "postprocessing/PostProcessor.js": "./postprocessing/PostProcessor.js"
    }
  }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import GUI from 'lil-gui';

    // =========================================================================================
    // POST PROCESSOR SUITE (Inlined from postprocessing/PostProcessor.js for standalone execution)
    // =========================================================================================

    const orthoVertexShader = `
    precision highp float;
    in vec3 position;
    out vec2 vUv;
    void main() {
      vUv = position.xy * 0.5 + 0.5;
      gl_Position = vec4(position, 1.0);
    }
    `;

    const brightFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float bloomThreshold;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float luminance = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float knee = 0.1;
      float soft = luminance - bloomThreshold + knee;
      soft = clamp(soft, 0.0, 2.0 * knee);
      soft = (soft * soft) / (4.0 * knee + 0.00001);
      float contribution = max(soft, luminance - bloomThreshold);
      contribution /= max(luminance, 0.00001);
      fragColor = vec4(color.rgb * contribution, color.a);
    }
    `;

    const blur13ShaderChunk = `
    vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
      vec2 resolution = vec2(textureSize(image, 0));
      vec4 color = vec4(0.0);
      vec2 off1 = vec2(1.411764705882353) * direction;
      vec2 off2 = vec2(3.2941176470588234) * direction;
      vec2 off3 = vec2(5.176470588235294) * direction;
      color += texture(image, uv) * 0.1964825501511404;
      color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
      color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
      return color;
    }
    `;

    const blurFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 direction;
    in vec2 vUv;
    out vec4 color;
    ${blur13ShaderChunk}
    void main() {
      color = blur13(inputTexture, vUv, direction);
    }
    `;

    const godRaysDepthMaskShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float threshold;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float lum = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float factor = smoothstep(threshold, threshold + 0.15, lum);
      fragColor = vec4(vec3(factor), 1.0);
    }
    `;

    const godRaysGenerateShader = `
    precision highp float;
    #define TAPS_PER_PASS 6.0

    uniform sampler2D inputTexture;
    uniform vec3 vSunPositionScreenSpace;
    uniform float fStepSize;
    uniform float distanceAttenuation;
    uniform float maxDensity;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec2 delta = vSunPositionScreenSpace.xy - vUv;
      float dist = length(delta);
      vec2 stepv = fStepSize * delta / max(dist, 0.0001);
      float iters = dist / max(fStepSize, 0.00001);

      vec2 uv = vUv;
      float col = 0.0;
      float f = min(1.0, max(vSunPositionScreenSpace.z, 0.0));

      float atten = 1.0 / (1.0 + pow(dist, distanceAttenuation));

      if (0.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (1.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (2.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (3.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (4.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (5.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;

      float finalVal = min(col / TAPS_PER_PASS * atten, maxDensity);
      fragColor = vec4(vec3(finalVal), 1.0);
    }
    `;

    const anamorphicBrightShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float threshold;
    uniform float smoothWidth;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float v = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float alpha = smoothstep(threshold, threshold + smoothWidth, v);
      fragColor = mix(vec4(0.0), color, alpha);
    }
    `;

    const anamorphicBlurShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 resolution;
    uniform float samples;
    uniform float intensity;
    uniform vec3 tintColor;
    uniform float bloomRadius;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      int halfSamples = max(1, int(samples) / 2);
      float fHalfSamples = float(halfSamples);
      vec2 invSize = 1.0 / resolution;
      vec4 total = vec4(0.0);

      for (int i = -64; i <= 64; i++) {
        if (i < -halfSamples || i > halfSamples) continue;
        float softness = 1.0 - abs(float(i)) / fHalfSamples;
        softness = pow(softness, 2.0);
        vec2 shiftedUV = vec2(vUv.x + invSize.x * float(i) * (4.0 + bloomRadius * 8.0), vUv.y);
        shiftedUV = clamp(shiftedUV, 0.001, 0.999);
        total += texture(inputTexture, shiftedUV) * softness;
      }

      fragColor = (total / (samples / 3.0)) * vec4(tintColor, 1.0) * intensity;
    }
    `;

    const finalFragmentShader = `
    precision highp float;
    uniform vec2 resolution;
    uniform sampler2D inputTexture;
    uniform sampler2D blur0Texture;
    uniform sampler2D blur1Texture;
    uniform sampler2D blur2Texture;
    uniform sampler2D blur3Texture;
    uniform sampler2D blur4Texture;
    uniform sampler2D raysTexture;
    uniform sampler2D anamorphicTexture;
    uniform bool bloomEnabled;
    uniform float bloomStrength;
    uniform bool raysEnabled;
    uniform float raysStrength;
    uniform vec3 raysColor;
    uniform bool anamorphicEnabled;
    uniform float vignetteBoost;
    uniform float vignetteReduction;
    uniform float noiseIntensity;
    uniform float time;
    in vec2 vUv;
    out vec4 fragColor;

    float vignette(vec2 uv, float boost, float reduction) {
      vec2 position = vUv - 0.5;
      return boost - length(position) * reduction;
    }

    float hash1(uint n) {
      n = (n << 13U) ^ n;
      n = n * (n * n * 15731U + 789221U) + 1376312589U;
      return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
    }

    float noise(in vec2 uv, in float timeVal) {
      uvec2 p = uvec2(uv);
      return hash1(p.x + 1920U * p.y + (1920U * 1080U) * uint(timeVal));
    }

    void main() {
      vec4 color = texture(inputTexture, vUv);

      if (bloomEnabled && bloomStrength > 0.001) {
        vec4 b0 = texture(blur0Texture, vUv);
        vec4 b1 = texture(blur1Texture, vUv);
        vec4 b2 = texture(blur2Texture, vUv);
        vec4 b3 = texture(blur3Texture, vUv);
        vec4 b4 = texture(blur4Texture, vUv);

        vec4 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
        color += bloomSum * bloomStrength;
      }

      // Three.js Godrays composite
      if (raysEnabled && raysStrength > 0.001) {
        vec4 r = texture(raysTexture, vUv);
        color.rgb += r.rgb * raysColor * raysStrength;
      }

      // Three.js Anamorphic bloom composite
      if (anamorphicEnabled) {
        vec4 a = texture(anamorphicTexture, vUv);
        color.rgb += a.rgb;
      }

      color.rgb *= vignette(vUv, vignetteBoost, vignetteReduction);
      color.rgb += noiseIntensity * noise(gl_FragCoord.xy, time);
      fragColor = vec4(color.rgb, 1.0);
    }
    `;

    const chromaticAberrationShaderChunk = `
    vec2 barrelDistortion(vec2 coord, float amt) {
      vec2 cc = coord - 0.5;
      float dist = dot(cc, cc);
      return coord + cc * dist * amt;
    }
    float sat(float t) { return clamp(t, 0.0, 1.0); }
    float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
    float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
    vec4 spectrum_offset(float t) {
      float lo = step(t, 0.5);
      float hi = 1.0 - lo;
      float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
      vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
      return pow(ret, vec4(1.0 / 2.2));
    }
    const float max_distort = 2.2;
    const int num_iter = 8;
    const float reci_num_iter_f = 1.0 / float(num_iter);
    vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
      vec4 sumcol = vec4(0.0);
      vec4 sumw = vec4(0.0);
      for (int i = 0; i < num_iter; ++i) {
        float t = float(i) * reci_num_iter_f;
        vec4 w = spectrum_offset(t);
        sumw += w;
        sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
      }
      return sumcol / sumw;
    }
    `;

    const colorFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float chromaticAberrationAmount;
    uniform float minInputLevel;
    uniform float maxInputLevel;
    uniform float gammaLevel;
    uniform float exposure;
    uniform float fisheyeStrength;
    uniform float fisheyeRadius;
    uniform float time;
    uniform int visionMode;
    uniform float thermalSensitivity;
    uniform float nightVisionNoise;
    uniform float nightVisionGain;
    uniform float crtIntensity;
    in vec2 vUv;
    out vec4 fragColor;

    ${chromaticAberrationShaderChunk}

    vec2 applyFisheye(vec2 uv, float strength, float radius) {
      if (abs(strength) < 0.0001) return uv;
      vec2 p = uv - 0.5;
      float d = length(p);
      if (d > radius * 1.5) return uv;
      float r = d / max(radius, 0.001);
      float theta = atan(p.y, p.x);
      float rDist = r + strength * (r * r * r);
      return 0.5 + vec2(cos(theta), sin(theta)) * (rDist * radius);
    }

    vec3 ACESFilmicToneMapping(vec3 color) {
      float a = 2.51;
      float b = 0.03;
      float c = 2.43;
      float d = 0.59;
      float e = 0.14;
      return clamp((color * (a * color + b)) / (color * (c * color + d) + e), 0.0, 1.0);
    }

    vec3 gammaCorrect(vec3 color, vec3 gamma) {
      return pow(max(color, vec3(0.0)), 1.0 / gamma);
    }
    vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
      return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
    }
    vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
      return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
    }

    vec3 applyNightVision(vec3 color, vec2 uv, float timeVal, float noiseAmt, float gain, float crt) {
      float lum = dot(color, vec3(0.299, 0.587, 0.114));
      float amplified = pow(lum * gain, 0.72);
      vec3 phosphorColor = mix(vec3(0.02, 0.12, 0.03), vec3(0.18, 1.0, 0.32), clamp(amplified, 0.0, 1.0));
      phosphorColor += vec3(0.7, 1.0, 0.8) * max(0.0, amplified - 0.75) * 1.8;
      
      vec2 p = uv - 0.5;
      float tubeDist = length(p);
      float tubeMask = smoothstep(0.72, 0.44, tubeDist);
      
      float n = fract(sin(dot(uv * 280.0 + timeVal * 0.05, vec2(12.9898, 78.233))) * 43758.5453);
      float scanline = sin(uv.y * 650.0) * crt;
      
      phosphorColor += (n - 0.5) * noiseAmt * 2.0 + scanline;
      return clamp(phosphorColor * tubeMask, 0.0, 1.0);
    }

    vec3 ironbow(float t) {
      t = clamp(t, 0.0, 1.0);
      vec3 c0 = vec3(0.02, 0.01, 0.18);
      vec3 c1 = vec3(0.22, 0.02, 0.48);
      vec3 c2 = vec3(0.82, 0.05, 0.25);
      vec3 c3 = vec3(1.0, 0.62, 0.02);
      vec3 c4 = vec3(1.0, 1.0, 0.92);
      
      if (t < 0.25) return mix(c0, c1, t * 4.0);
      if (t < 0.50) return mix(c1, c2, (t - 0.25) * 4.0);
      if (t < 0.75) return mix(c2, c3, (t - 0.50) * 4.0);
      return mix(c3, c4, (t - 0.75) * 4.0);
    }

    vec3 applyThermal(vec3 color, vec2 uv, float sensitivity, float crt, bool whiteHot) {
      float lum = dot(color, vec3(0.299, 0.587, 0.114));
      float heat = clamp(lum * sensitivity, 0.0, 1.0);
      float sensorRaster = sin(uv.y * 900.0) * (crt * 0.3);
      heat = clamp(heat + sensorRaster, 0.0, 1.0);
      
      if (whiteHot) {
        float grad = pow(heat, 0.85);
        return vec3(grad);
      } else {
        return ironbow(heat);
      }
    }

    void main() {
      vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
      vec4 col = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
      vec3 finalCol = col.rgb;
      
      if (visionMode == 1) {
        finalCol = applyNightVision(finalCol, uv, time, nightVisionNoise, nightVisionGain, crtIntensity);
      } else if (visionMode == 2) {
        finalCol = applyThermal(finalCol, uv, thermalSensitivity, crtIntensity, false);
      } else if (visionMode == 3) {
        finalCol = applyThermal(finalCol, uv, thermalSensitivity, crtIntensity, true);
      } else {
        vec3 exposedColor = finalCol * exposure;
        vec3 toneMappedColor = ACESFilmicToneMapping(exposedColor);
        finalCol = finalLevels(toneMappedColor, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
      }

      fragColor = vec4(finalCol, 1.0);
    }
    `;

    const copyFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      fragColor = texture(inputTexture, vUv);
    }
    `;

    function createFBO(w, h, options = {}) {
      return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
        wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
        wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
        minFilter: options.minFilter || THREE.LinearFilter,
        magFilter: options.magFilter || THREE.LinearFilter,
        format: options.format || THREE.RGBAFormat,
        type: options.type || THREE.HalfFloatType,
        stencilBuffer: options.stencilBuffer || false,
        depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : true,
        samples: options.samples || 0,
      });
    }

    class ShaderPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbo = createFBO(1, 1, options);
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
        this.texture = this.fbo.texture;
      }
      render(renderer, toScreen = false) {
        if (!toScreen) {
          renderer.setRenderTarget(this.fbo);
        }
        renderer.render(this.orthoScene, this.orthoCamera);
        if (!toScreen) {
          renderer.setRenderTarget(null);
        }
      }
      setSize(width, height) {
        this.fbo.setSize(Math.max(1, width), Math.max(1, height));
        this.orthoQuad.scale.set(width, height, 1);
      }
    }

    class ShaderPingPongPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
        this.currentFBO = 0;
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
      }
      render(renderer) {
        renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
        renderer.render(this.orthoScene, this.orthoCamera);
        renderer.setRenderTarget(null);
        this.currentFBO = 1 - this.currentFBO;
      }
      get current() { return this.fbos[this.currentFBO]; }
      get texture() { return this.current.texture; }
      setSize(width, height) {
        const w = Math.max(1, width);
        const h = Math.max(1, height);
        this.orthoQuad.scale.set(w, h, 1);
        this.fbos[0].setSize(w, h);
        this.fbos[1].setSize(w, h);
      }
    }

    class BloomPass {
      constructor(strength = 0.8, radius = 0.5, threshold = 0.2, levels = 5) {
        this.strength = strength;
        this.radius = radius;
        this.threshold = threshold;
        this.enabled = true;
        this.levels = levels;

        this.brightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            bloomThreshold: { value: this.threshold },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: brightFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.brightPass = new ShaderPass(this.brightShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.blurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            direction: { value: new THREE.Vector2(0, 1) },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: blurFragmentShader,
          glslVersion: THREE.GLSL3,
        });

        this.blurPasses = [];
        for (let i = 0; i < this.levels; i++) {
          this.blurPasses.push(new ShaderPingPongPass(this.blurShader, {
            format: THREE.RGBAFormat,
            type: THREE.HalfFloatType,
          }));
        }
      }

      setSize(w, h) {
        let tw = Math.max(1, w);
        let th = Math.max(1, h);
        this.brightPass.setSize(tw, th);
        for (let i = 0; i < this.levels; i++) {
          tw = Math.max(1, Math.round(tw / 2));
          th = Math.max(1, Math.round(th / 2));
          this.blurPasses[i].setSize(tw, th);
        }
      }

      set source(texture) {
        this.brightShader.uniforms.inputTexture.value = texture;
      }

      render(renderer) {
        if (!this.enabled || this.strength <= 0.001) return;

        this.brightShader.uniforms.bloomThreshold.value = this.threshold;
        this.brightPass.render(renderer);

        const baseOffset = Math.max(0.1, this.radius * 2.0);
        const u = this.blurShader.uniforms;

        for (let j = 0; j < this.levels; j++) {
          const blurPass = this.blurPasses[j];
          const stepOffset = baseOffset * (1.0 + j * 0.5);

          u.direction.value.set(stepOffset, 0);
          u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
          blurPass.render(renderer);

          u.direction.value.set(0, stepOffset * 0.5);
          u.inputTexture.value = blurPass.current.texture;
          blurPass.render(renderer);
        }
      }
    }

    const VISION_MODE_MAP = {
      'Normal (Cinematic)': 0,
      'Night Vision (Phosphor)': 1,
      'Thermal (Ironbow)': 2,
      'Thermal (White-Hot)': 3,
    };

    class PostProcessor {
      constructor(renderer, initialParams = {}) {
        this.renderer = renderer;

        this.settings = {
          enabled: initialParams.enabled !== undefined ? initialParams.enabled : true,

          bloomEnabled: initialParams.bloomEnabled !== undefined ? initialParams.bloomEnabled : true,
          bloomStrength: initialParams.bloomStrength !== undefined ? initialParams.bloomStrength : 0.9,
          bloomRadius: initialParams.bloomRadius !== undefined ? initialParams.bloomRadius : 0.5,
          bloomThreshold: initialParams.bloomThreshold !== undefined ? initialParams.bloomThreshold : 0.22,

          raysEnabled: initialParams.raysEnabled !== undefined ? initialParams.raysEnabled : false,
          raysStrength: initialParams.raysStrength !== undefined ? initialParams.raysStrength : 0.85,
          raysDensity: initialParams.raysDensity !== undefined ? initialParams.raysDensity : 1.0,
          raysMaxDensity: initialParams.raysMaxDensity !== undefined ? initialParams.raysMaxDensity : 0.5,
          raysDistanceAttenuation: initialParams.raysDistanceAttenuation !== undefined ? initialParams.raysDistanceAttenuation : 2.0,
          raysThreshold: initialParams.raysThreshold !== undefined ? initialParams.raysThreshold : 0.12,
          raysColor: initialParams.raysColor ? (initialParams.raysColor.isColor ? initialParams.raysColor.clone() : new THREE.Color(initialParams.raysColor)) : new THREE.Color(0x39ff14),
          raysColorHex: initialParams.raysColorHex || (typeof initialParams.raysColor === 'string' ? initialParams.raysColor : '#39ff14'),

          anamorphicEnabled: initialParams.anamorphicEnabled !== undefined ? initialParams.anamorphicEnabled : false,
          anamorphicIntensity: initialParams.anamorphicIntensity !== undefined ? initialParams.anamorphicIntensity : 4.0,
          anamorphicThreshold: initialParams.anamorphicThreshold !== undefined ? initialParams.anamorphicThreshold : 0.3,
          anamorphicSamples: initialParams.anamorphicSamples !== undefined ? initialParams.anamorphicSamples : 64,
          anamorphicRadius: initialParams.anamorphicRadius !== undefined ? initialParams.anamorphicRadius : 0.0,
          anamorphicSmoothWidth: initialParams.anamorphicSmoothWidth !== undefined ? initialParams.anamorphicSmoothWidth : 0.05,
          anamorphicColor: initialParams.anamorphicColor ? (initialParams.anamorphicColor.isColor ? initialParams.anamorphicColor.clone() : new THREE.Color(initialParams.anamorphicColor)) : new THREE.Color(0x7a8aff),
          anamorphicColorHex: initialParams.anamorphicColorHex || '#7a8aff',

          visionMode: initialParams.visionMode !== undefined ? initialParams.visionMode : 'Normal (Cinematic)',
          thermalSensitivity: initialParams.thermalSensitivity !== undefined ? initialParams.thermalSensitivity : 1.4,
          nightVisionGain: initialParams.nightVisionGain !== undefined ? initialParams.nightVisionGain : 2.1,
          nightVisionNoise: initialParams.nightVisionNoise !== undefined ? initialParams.nightVisionNoise : 0.05,
          crtIntensity: initialParams.crtIntensity !== undefined ? initialParams.crtIntensity : 0.0,

          fisheyeStrength: initialParams.fisheyeStrength !== undefined ? initialParams.fisheyeStrength : 0.0,
          fisheyeRadius: initialParams.fisheyeRadius !== undefined ? initialParams.fisheyeRadius : 1.0,
          chromaticAberration: initialParams.chromaticAberration !== undefined ? initialParams.chromaticAberration : 0.005,
          vignetteBoost: initialParams.vignetteBoost !== undefined ? initialParams.vignetteBoost : 1.05,
          vignetteReduction: initialParams.vignetteReduction !== undefined ? initialParams.vignetteReduction : 0.45,
          noiseIntensity: initialParams.noiseIntensity !== undefined ? initialParams.noiseIntensity : 0.012,

          gamma: initialParams.gamma !== undefined ? initialParams.gamma : 1.0,
          minInputLevel: initialParams.minInputLevel !== undefined ? initialParams.minInputLevel : 0.0,
          maxInputLevel: initialParams.maxInputLevel !== undefined ? initialParams.maxInputLevel : 1.0,
          exposure: initialParams.exposure !== undefined ? initialParams.exposure : 1.0,
        };

        this.sceneTarget = createFBO(1, 1, { type: THREE.HalfFloatType });

        this.bloomPass = new BloomPass(
          this.settings.bloomStrength,
          this.settings.bloomRadius,
          this.settings.bloomThreshold,
          5
        );

        this.moonScreenPos = new THREE.Vector3(0.5, 0.7, 1.0);
        this.moonInFront = true;

        this.godRaysMaskShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            threshold: { value: this.settings.raysThreshold },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: godRaysDepthMaskShader,
          glslVersion: THREE.GLSL3,
        });
        this.godRaysMaskPass = new ShaderPass(this.godRaysMaskShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.godRaysGenShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            vSunPositionScreenSpace: { value: this.moonScreenPos },
            fStepSize: { value: 1.0 },
            distanceAttenuation: { value: this.settings.raysDistanceAttenuation },
            maxDensity: { value: this.settings.raysMaxDensity },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: godRaysGenerateShader,
          glslVersion: THREE.GLSL3,
        });
        this.godRaysPingPong = new ShaderPingPongPass(this.godRaysGenShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.anamorphicBrightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            threshold: { value: this.settings.anamorphicThreshold },
            smoothWidth: { value: this.settings.anamorphicSmoothWidth },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: anamorphicBrightShader,
          glslVersion: THREE.GLSL3,
        });
        this.anamorphicBrightPass = new ShaderPass(this.anamorphicBrightShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.anamorphicBlurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            resolution: { value: new THREE.Vector2(1, 1) },
            samples: { value: this.settings.anamorphicSamples },
            intensity: { value: this.settings.anamorphicIntensity },
            tintColor: { value: this.settings.anamorphicColor },
            bloomRadius: { value: this.settings.anamorphicRadius },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: anamorphicBlurShader,
          glslVersion: THREE.GLSL3,
        });
        this.anamorphicBlurPass = new ShaderPass(this.anamorphicBlurShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.finalShader = new THREE.RawShaderMaterial({
          uniforms: {
            resolution: { value: new THREE.Vector2(1, 1) },
            bloomEnabled: { value: this.settings.bloomEnabled },
            bloomStrength: { value: this.settings.bloomStrength },
            raysEnabled: { value: this.settings.raysEnabled },
            raysStrength: { value: this.settings.raysStrength },
            raysColor: { value: this.settings.raysColor },
            anamorphicEnabled: { value: this.settings.anamorphicEnabled },
            vignetteBoost: { value: this.settings.vignetteBoost },
            vignetteReduction: { value: this.settings.vignetteReduction },
            noiseIntensity: { value: this.settings.noiseIntensity },
            inputTexture: { value: null },
            blur0Texture: { value: null },
            blur1Texture: { value: null },
            blur2Texture: { value: null },
            blur3Texture: { value: null },
            blur4Texture: { value: null },
            raysTexture: { value: null },
            anamorphicTexture: { value: null },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: finalFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.finalPass = new ShaderPass(this.finalShader);

        this.rgbShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: this.finalPass.texture },
            fisheyeStrength: { value: this.settings.fisheyeStrength },
            fisheyeRadius: { value: this.settings.fisheyeRadius },
            chromaticAberrationAmount: { value: this.settings.chromaticAberration },
            minInputLevel: { value: this.settings.minInputLevel },
            maxInputLevel: { value: this.settings.maxInputLevel },
            gammaLevel: { value: this.settings.gamma },
            exposure: { value: this.settings.exposure },
            visionMode: { value: VISION_MODE_MAP[this.settings.visionMode] ?? 0 },
            thermalSensitivity: { value: this.settings.thermalSensitivity },
            nightVisionGain: { value: this.settings.nightVisionGain },
            nightVisionNoise: { value: this.settings.nightVisionNoise },
            crtIntensity: { value: this.settings.crtIntensity },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: colorFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.rgbPass = new ShaderPass(this.rgbShader);

        this.copyShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: copyFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.copyPass = new ShaderPass(this.copyShader);
      }

      updateSettings() {
        this.bloomPass.enabled = this.settings.bloomEnabled;
        this.bloomPass.strength = this.settings.bloomStrength;
        this.bloomPass.radius = this.settings.bloomRadius;
        this.bloomPass.threshold = this.settings.bloomThreshold;

        this.godRaysMaskShader.uniforms.threshold.value = this.settings.raysThreshold;
        this.godRaysGenShader.uniforms.distanceAttenuation.value = this.settings.raysDistanceAttenuation;
        this.godRaysGenShader.uniforms.maxDensity.value = this.settings.raysMaxDensity;

        this.anamorphicBrightShader.uniforms.threshold.value = this.settings.anamorphicThreshold;
        this.anamorphicBrightShader.uniforms.smoothWidth.value = this.settings.anamorphicSmoothWidth;
        this.anamorphicBlurShader.uniforms.samples.value = this.settings.anamorphicSamples;
        this.anamorphicBlurShader.uniforms.intensity.value = this.settings.anamorphicIntensity;
        this.anamorphicBlurShader.uniforms.tintColor.value.copy(this.settings.anamorphicColor);
        this.anamorphicBlurShader.uniforms.bloomRadius.value = this.settings.anamorphicRadius;

        this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
        this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
        this.finalShader.uniforms.raysEnabled.value = this.settings.raysEnabled && this.moonInFront;
        this.finalShader.uniforms.raysStrength.value = this.settings.raysStrength;
        this.finalShader.uniforms.raysColor.value.copy(this.settings.raysColor);
        this.finalShader.uniforms.anamorphicEnabled.value = this.settings.anamorphicEnabled;

        // In greenscreen mode (#00ff00), keep the background clear of edge vignetting & noise distortion
        const isGreenscreen = Boolean(typeof params !== 'undefined' && params.greenscreen);
        this.finalShader.uniforms.vignetteBoost.value = isGreenscreen ? 1.0 : this.settings.vignetteBoost;
        this.finalShader.uniforms.vignetteReduction.value = isGreenscreen ? 0.0 : this.settings.vignetteReduction;
        this.finalShader.uniforms.noiseIntensity.value = isGreenscreen ? 0.0 : this.settings.noiseIntensity;

        this.rgbShader.uniforms.fisheyeStrength.value = this.settings.fisheyeStrength;
        this.rgbShader.uniforms.fisheyeRadius.value = this.settings.fisheyeRadius;
        this.rgbShader.uniforms.chromaticAberrationAmount.value = isGreenscreen ? 0.0 : this.settings.chromaticAberration;
        this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
        this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
        this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
        this.rgbShader.uniforms.exposure.value = this.settings.exposure;
        this.rgbShader.uniforms.visionMode.value = VISION_MODE_MAP[this.settings.visionMode] ?? 0;
        this.rgbShader.uniforms.thermalSensitivity.value = this.settings.thermalSensitivity;
        this.rgbShader.uniforms.nightVisionGain.value = this.settings.nightVisionGain;
        this.rgbShader.uniforms.nightVisionNoise.value = this.settings.nightVisionNoise;
        this.rgbShader.uniforms.crtIntensity.value = this.settings.crtIntensity;
      }

      setSize(w0, h0, dpr = 1) {
        const w = Math.max(1, Math.floor(w0 * dpr));
        const h = Math.max(1, Math.floor(h0 * dpr));
        this.sceneTarget.setSize(w, h);
        this.finalPass.setSize(w, h);
        this.finalShader.uniforms.resolution.value.set(w, h);
        this.bloomPass.setSize(w, h);

        const grW = Math.max(1, Math.round(w / 2));
        const grH = Math.max(1, Math.round(h / 2));
        this.godRaysMaskPass.setSize(grW, grH);
        this.godRaysPingPong.setSize(grW, grH);

        const anW = Math.max(1, Math.round(w / 4));
        const anH = Math.max(1, Math.round(h / 4));
        this.anamorphicBrightPass.setSize(anW, anH);
        this.anamorphicBlurPass.setSize(anW, anH);
        this.anamorphicBlurShader.uniforms.resolution.value.set(anW, anH);

        this.rgbPass.setSize(w, h);
        this.copyPass.setSize(w, h);
      }

      setMoonScreenPosition(camera, moonWorldPos) {
        if (!this._camDir) {
          this._camDir = new THREE.Vector3();
          this._toMoon = new THREE.Vector3();
          this._ndc = new THREE.Vector3();
        }
        camera.getWorldDirection(this._camDir);
        this._toMoon.copy(moonWorldPos).sub(camera.position).normalize();
        const dot = this._camDir.dot(this._toMoon);

        if (dot <= 0.02) {
          this.moonInFront = false;
          this.finalShader.uniforms.raysEnabled.value = false;
          return;
        }

        this.moonInFront = true;
        const fade = THREE.MathUtils.clamp((dot - 0.02) / 0.15, 0.0, 1.0);

        this._ndc.copy(moonWorldPos).project(camera);
        const screenX = this._ndc.x * 0.5 + 0.5;
        const screenY = this._ndc.y * 0.5 + 0.5;
        const screenZ = fade;

        this.moonScreenPos.set(screenX, screenY, screenZ);
        this.godRaysGenShader.uniforms.vSunPositionScreenSpace.value.set(screenX, screenY, screenZ);
      }

      renderScene(scene, camera) {
        if (!this.settings.enabled) {
          this.renderer.render(scene, camera);
          return;
        }
        this.renderer.setRenderTarget(this.sceneTarget);
        this.renderer.render(scene, camera);
        this.renderer.setRenderTarget(null);
        this.render(this.sceneTarget.texture);
      }

      render(sourceTexture) {
        if (!this.settings.enabled) {
          this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
          this.copyPass.render(this.renderer, true);
          return;
        }

        this.updateSettings();

        // 1. Atmospheric Bloom
        this.bloomPass.source = sourceTexture;
        this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
        this.bloomPass.render(this.renderer);

        this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
        this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
        this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
        this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
        this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

        // 2. Three.js Godrays
        if (this.settings.raysEnabled && this.settings.raysStrength > 0.001 && this.moonInFront) {
          this.godRaysMaskShader.uniforms.inputTexture.value = sourceTexture;
          this.godRaysMaskShader.uniforms.threshold.value = this.settings.raysThreshold;
          this.godRaysMaskPass.render(this.renderer);

          const filterLen = this.settings.raysDensity;
          const tapsPerPass = 6.0;

          // Pass 1
          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -1.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysMaskPass.texture;
          this.godRaysPingPong.render(this.renderer);

          // Pass 2
          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -2.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysPingPong.texture;
          this.godRaysPingPong.render(this.renderer);

          // Pass 3
          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -3.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysPingPong.texture;
          this.godRaysPingPong.render(this.renderer);

          this.finalPass.shader.uniforms.raysTexture.value = this.godRaysPingPong.texture;
          this.finalPass.shader.uniforms.raysEnabled.value = true;
        } else {
          this.finalPass.shader.uniforms.raysEnabled.value = false;
        }

        // 3. Three.js Anamorphic Flare
        if (this.settings.anamorphicEnabled && this.settings.anamorphicIntensity > 0.001) {
          this.anamorphicBrightShader.uniforms.inputTexture.value = sourceTexture;
          this.anamorphicBrightShader.uniforms.threshold.value = this.settings.anamorphicThreshold;
          this.anamorphicBrightShader.uniforms.smoothWidth.value = this.settings.anamorphicSmoothWidth;
          this.anamorphicBrightPass.render(this.renderer);

          this.anamorphicBlurShader.uniforms.inputTexture.value = this.anamorphicBrightPass.texture;
          this.anamorphicBlurShader.uniforms.samples.value = this.settings.anamorphicSamples;
          this.anamorphicBlurShader.uniforms.intensity.value = this.settings.anamorphicIntensity;
          this.anamorphicBlurShader.uniforms.tintColor.value.copy(this.settings.anamorphicColor);
          this.anamorphicBlurShader.uniforms.bloomRadius.value = this.settings.anamorphicRadius;
          this.anamorphicBlurPass.render(this.renderer);

          this.finalPass.shader.uniforms.anamorphicTexture.value = this.anamorphicBlurPass.texture;
          this.finalPass.shader.uniforms.anamorphicEnabled.value = true;
        } else {
          this.finalPass.shader.uniforms.anamorphicEnabled.value = false;
        }

        const randomTime = Math.random() * 100000;
        this.finalPass.shader.uniforms.time.value = randomTime;
        this.rgbPass.shader.uniforms.time.value = randomTime;

        this.finalPass.render(this.renderer);
        this.rgbPass.render(this.renderer, true);
      }

      attachGUI(gui, title = "Post-Processing Suite") {
        const root = gui.addFolder(title);
        root.add(this.settings, "enabled").name("Enable Post-Process");

        // 1. Special Vision Modes (Night Vision & Thermal)
        const vision = root.addFolder("Thermal & Night Vision");

        vision.add(this.settings, "nightVisionGain", 0.5, 5.0, 0.1).name("NVG Amplification").onChange(() => this.updateSettings());
        vision.add(this.settings, "nightVisionNoise", 0.0, 0.3, 0.01).name("NVG Sensor Noise").onChange(() => this.updateSettings());
        vision.add(this.settings, "thermalSensitivity", 0.5, 3.5, 0.05).name("Thermal Sensitivity").onChange(() => this.updateSettings());
        vision.add(this.settings, "crtIntensity", 0.0, 0.1, 0.005).name("CRT Scanlines").onChange(() => this.updateSettings());

        // 2. Three.js Godrays
        const rays = root.addFolder("Three.js Godrays");

        const anamorphic = root.addFolder("Three.js Anamorphic Flare");

        anamorphic.add(this.settings, "anamorphicThreshold", 0.0, 0.9, 0.01).name("Threshold").onChange(() => this.updateSettings());
        anamorphic.add(this.settings, "anamorphicSamples", 2, 128, 1).name("Samples").onChange(() => this.updateSettings());
        anamorphic.add(this.settings, "anamorphicRadius", 0.0, 1.0, 0.01).name("Bloom Radius").onChange(() => this.updateSettings());
        anamorphic.addColor(this.settings, "anamorphicColorHex").name("Tint Color").onChange((v) => {
          this.settings.anamorphicColor.set(v);
          this.updateSettings();
        });

        // 4. Atmospheric Bloom
        const bloom = root.addFolder("Atmospheric Bloom");
        bloom.add(this.settings, "bloomEnabled").name("Enable Bloom").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomStrength", 0, 3.0, 0.05).name("Bloom Strength").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomRadius", 0, 2.0, 0.05).name("Bloom Radius").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomThreshold", 0, 1.0, 0.01).name("Bloom Threshold").onChange(() => this.updateSettings());

        // 5. Lens, Optics & Film Grain
        const lens = root.addFolder("Lens, Optics & Film Grain");
        lens.add(this.settings, "fisheyeStrength", -1.0, 1.5, 0.01).name("Fisheye Distortion").onChange(() => this.updateSettings());
        lens.add(this.settings, "fisheyeRadius", 0.2, 2.0, 0.05).name("Fisheye Radius").onChange(() => this.updateSettings());
        lens.add(this.settings, "chromaticAberration", 0, 0.2, 0.005).name("Chromatic Aberration").onChange(() => this.updateSettings());
        lens.add(this.settings, "vignetteBoost", 0, 2.0, 0.05).name("Vignette Boost").onChange(() => this.updateSettings());
        lens.add(this.settings, "vignetteReduction", 0, 2.0, 0.05).name("Vignette Falloff").onChange(() => this.updateSettings());
        lens.add(this.settings, "noiseIntensity", 0, 0.1, 0.005).name("Film Grain").onChange(() => this.updateSettings());
        lens.add(this.settings, "exposure", 0.1, 3.0, 0.05).name("Optics Exposure").onChange(() => this.updateSettings());
        lens.add(this.settings, "gamma", 0.2, 2.0, 0.05).name("Gamma").onChange(() => this.updateSettings());
        lens.add(this.settings, "minInputLevel", 0, 0.5, 0.01).name("Black Level").onChange(() => this.updateSettings());
        lens.add(this.settings, "maxInputLevel", 0.5, 1.0, 0.01).name("White Level").onChange(() => this.updateSettings());

        return root;
      }
    }

    function createWoodCanvas(baseHex, darkHex) {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');
      updateWoodCanvas(canvas, ctx, baseHex, darkHex);
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(1.5, 1.5);
      return { canvas, ctx, texture: tex };
    }

    function updateWoodCanvas(canvas, ctx, baseHex, darkHex) {
      const baseColor = new THREE.Color(baseHex);
      const darkColor = new THREE.Color(darkHex);
      ctx.fillStyle = baseColor.getStyle();
      ctx.fillRect(0, 0, 1024, 1024);

      const imgData = ctx.getImageData(0, 0, 1024, 1024);
      const data = imgData.data;
      const r1 = baseColor.r * 255, g1 = baseColor.g * 255, b1 = baseColor.b * 255;
      const r2 = darkColor.r * 255, g2 = darkColor.g * 255, b2 = darkColor.b * 255;

      for (let y = 0; y < 1024; y++) {
        for (let x = 0; x < 1024; x++) {
          const nx = (x - 512) * 0.008;
          const ny = y * 0.0025;
          const dist = Math.sqrt(nx * nx + ny * ny);

          const ring = Math.sin(dist * 52.0 + Math.sin(x * 0.02) * 2.5 + Math.sin(y * 0.015) * 2.0);
          const grain = Math.sin(x * 1.8) * 0.07 + Math.sin(x * 0.4 + y * 0.03) * 0.12;
          const pore = Math.sin(x * 12.0) * 0.03;
          let factor = (ring * 0.5 + 0.5) * 0.65 + grain + pore + 0.12;
          factor = Math.max(0, Math.min(1, factor));

          const idx = (y * 1024 + x) * 4;
          data[idx] = r1 * (1 - factor) + r2 * factor;
          data[idx + 1] = g1 * (1 - factor) + g2 * factor;
          data[idx + 2] = b1 * (1 - factor) + b2 * factor;
          data[idx + 3] = 255;
        }
      }
      ctx.putImageData(imgData, 0, 0);
    }

    function createCurvedScreenGeometry(width, height, radius, segX = 48, segY = 48) {
      const geo = new THREE.PlaneGeometry(width, height, segX, segY);
      const pos = geo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i);
        const y = pos.getY(i);
        const distSq = x * x + y * y;
        const z = Math.sqrt(Math.max(0, radius * radius - distSq)) - radius;
        pos.setZ(i, -z * 0.42);
      }
      geo.computeVertexNormals();
      return geo;
    }

      function drawSkeletalHand(x, y, scaleX) {
        ctx.save();

          ctx.quadraticCurveTo(midX, midY, endX, endY);

      function drawEyeSocket(cx, cy) {
        const socketGrad = ctx.createRadialGradient(cx, cy, 2, cx, cy, 15);

        p3 += dot(p3, p3.yzx + 33.33);
        return fract((p3.x + p3.y) * p3.z);
      }

      float noise(vec2 p) {
        vec2 i = floor(p);
        vec2 f = fract(p);
        vec2 u = f * f * (3.0 - 2.0 * f);
        return mix(mix(hash12(i + vec2(0.0,0.0)), hash12(i + vec2(1.0,0.0)), u.x),
                   mix(hash12(i + vec2(0.0,1.0)), hash12(i + vec2(1.0,1.0)), u.x), u.y);
      }

      float fbm(vec2 p) {
        float val = 0.0;
        float amp = 0.5;
        mat2 rot = mat2(0.8, 0.6, -0.6, 0.8);
        for (int i = 0; i < 4; i++) {
          val += amp * noise(p);
          p = rot * p * 2.05 + vec2(17.1, 41.3);
          amp *= 0.5;
        }
        return val;
      }

      vec2 barrelDistort(vec2 uv, float k) {
        vec2 c = uv - 0.5;
        float r2 = dot(c, c);
        return uv + c * (r2 * k + r2 * r2 * k * 0.5);
      }

      void main() {
        vec2 uv = barrelDistort(vUv, uBarrelDistortion);

        // Tube bezel cutoff
        if (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) {
          gl_FragColor = vec4(0.01, 0.01, 0.01, 1.0);
          return;
        }

        float edgeDist = min(min(uv.x, 1.0 - uv.x), min(uv.y, 1.0 - uv.y));
        float tubeVignette = smoothstep(0.0, 0.06, edgeDist);
        tubeVignette *= pow(16.0 * uv.x * (1.0 - uv.x) * uv.y * (1.0 - uv.y), 0.18);

        // Sync tear glitches
        float glitchTrigger = step(0.93, hash12(vec2(floor(uTime * 14.0), 4.2))) * uGlitch;
        float lineGlitch = sin(uv.y * 32.0 + uTime * 24.0) * glitchTrigger * 0.03;
        uv.x += lineGlitch;

        // Aspect ratio and position centering (UV (0,0) is bottom-left, our ghost is drawn top-to-bottom)
        vec2 ghostCoord = uv;
        // Invert Y so texture matches screen coordinates
        ghostCoord.y = 1.0 - ghostCoord.y;
        // Subtle offset and scale to frame the ghost beautifully
        ghostCoord = (ghostCoord - vec2(0.5, 0.44)) * vec2(1.12, 1.06) + vec2(0.5, 0.5);

        // Organic spectral breathing and eerie vertical hovering
        ghostCoord.y += sin(uTime * 1.5) * 0.012;

        // Flowing shroud wave
        float clothWave = sin(ghostCoord.y * 6.5 - uTime * 2.2) * 0.014 * smoothstep(0.25, 0.9, ghostCoord.y);
        ghostCoord.x += clothWave;

        // Multi-octave domain warping for supernatural smoke / ectoplasmic dissolution
        vec2 ghostWarp = vec2(
          fbm(ghostCoord * 4.5 + vec2(uTime * 0.25, uTime * 0.1)),
          fbm(ghostCoord * 4.5 - vec2(uTime * 0.15, -uTime * 0.2))
        ) * 0.022;
        vec2 finalGhostUv = ghostCoord + ghostWarp;

        // Sample ghost texture with subtle chromatic edge fringing
        vec4 ghostTex = vec4(0.0);
        float caG = uChromaticAberration * 0.7;
        if (finalGhostUv.x >= 0.0 && finalGhostUv.x <= 1.0 && finalGhostUv.y >= 0.0 && finalGhostUv.y <= 1.0) {
          float gR = texture2D(uGhostMap, finalGhostUv + vec2(caG, 0.0)).r;
          float gG = texture2D(uGhostMap, finalGhostUv).g;
          float gB = texture2D(uGhostMap, finalGhostUv - vec2(caG, 0.0)).b;
          float gA = texture2D(uGhostMap, finalGhostUv).a;
          ghostTex = vec4(gR, gG, gB, gA);
        }

        // Burning supernatural pinpoint pupils nestled deep inside the dark orbital cavities
        // Eye centers in ghost texture UV are around (0.465, 0.25) and (0.535, 0.25)
        float eyeL = smoothstep(0.012, 0.002, length(finalGhostUv - vec2(0.465, 0.25)));
        float eyeR = smoothstep(0.012, 0.002, length(finalGhostUv - vec2(0.535, 0.25)));
        float pupilGlow = (eyeL + eyeR) * (1.6 + 0.5 * sin(uTime * 7.0)) * uManifestation;

        // Electromagnetic scanline distortion around the ghost's presence
        float distToHead = length(finalGhostUv - vec2(0.5, 0.26));
        float emDistort = sin(uv.y * 28.0 - uTime * 6.0) * 0.01 * smoothstep(0.45, 0.0, distToHead) * uManifestation;
        uv.x += emDistort;

        // Analog snow static noise
        float grainR = hash12(uv * 460.0 + vec2(uTime * 117.0, uTime * 43.0));
        float grainG = hash12(uv * 460.0 + vec2(uTime * 121.0, uTime * 47.0));
        float grainB = hash12(uv * 460.0 + vec2(uTime * 127.0, uTime * 53.0));
        vec3 staticGrain = vec3(grainR, grainG, grainB) * uStaticNoise;

        // Raster hum bar
        float humBar = sin(uv.y * 3.5 - uTime * 1.8) * 0.1 + 0.9;

        // Base static field
        vec3 staticColor = mix(uScreenBg, uScreenTint, staticGrain * humBar * 0.55);

        // --- COMPOSITING THE APPARITION WITH STATIC ---
        float ghostPresence = ghostTex.a * uManifestation;

        // 1. Dark core shadow: Hollow eyes, gaping mouth, hair, and shroud folds darken the white static noise
        float darkShadow = (1.0 - ghostTex.r * 0.75) * ghostPresence;
        vec3 baseWithShadow = mix(staticColor, uScreenBg * 0.22, clamp(darkShadow * 1.3, 0.0, 1.0));

        // 2. Phosphor luminescence: Pale flesh and flowing shroud glow with the screen phosphor tint
        vec3 ghostPhosphor = mix(uScreenTint, uGhostAccent, 0.45);
        vec3 ghostLuminescence = ghostTex.rgb * ghostPhosphor * ghostPresence * 1.45;

        // 3. Piercing unholy glint in the eyes
        vec3 burningEyes = uGhostAccent * pupilGlow * 3.0;

        vec3 combined = baseWithShadow + ghostLuminescence + burningEyes;

        // Scanlines
        float scanline = sin(uv.y * uScanlineCount * 3.14159265);
        scanline = 0.5 + 0.5 * scanline;
        scanline = pow(scanline, 1.2);
        combined *= mix(1.0, 0.35 + 0.65 * scanline, uScanlineIntensity);

        // Phosphor shadow mask triad
        vec2 screenCoord = gl_FragCoord.xy;
        float m = mod(screenCoord.x, 3.0);
        vec3 mask = vec3(0.75);
        if (m < 1.0) mask = vec3(1.12, 0.72, 0.72);
        else if (m < 2.0) mask = vec3(0.72, 1.12, 0.72);
        else mask = vec3(0.72, 0.72, 1.12);
        combined *= mask;

        // Glass specular reflection
        vec3 viewDir = normalize(-vPosition);
        float glassSpecular = pow(max(0.0, dot(vNormal, viewDir)), 18.0) * 0.2;
        combined += vec3(glassSpecular);

        combined *= tubeVignette;

          float flash = step(0.96, hash12(vec2(floor(uTime * 18.0), 7.7))) * (uManifestation - 0.82) * 2.8;
          combined += uGhostAccent * flash;
        }

        gl_FragColor = vec4(combined, 1.0);
      }
    `;

        ctx.fillRect(x, 0, 2, 1024);
        ctx.fillRect(x + plankWidth - 2, 0, 2, 1024);

      varying vec2 vUv;
      varying vec3 vWorldPos;

      void main() {
        vUv = uv;
        vec4 worldPos = modelMatrix * vec4(position, 1.0);
        vWorldPos = worldPos.xyz;
        gl_Position = projectionMatrix * viewMatrix * worldPos;
      }
    `;

    const groundFogFragmentShader = `
      uniform float uTime;
      uniform float uFogDensity;
      uniform float uFogSpeed;
      uniform vec3 uFogColor;
      uniform vec3 uScreenLightColor;
      uniform float uScreenLightIntensity;

      varying vec2 vUv;
      varying vec3 vWorldPos;

      float hash(vec2 p) {
        return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
      }

      float noise(vec2 p) {
        vec2 i = floor(p);
        vec2 f = fract(p);
        vec2 u = f * f * (3.0 - 2.0 * f);
        return mix(mix(hash(i + vec2(0.0,0.0)), hash(i + vec2(1.0,0.0)), u.x),
                   mix(hash(i + vec2(0.0,1.0)), hash(i + vec2(1.0,1.0)), u.x), u.y);
      }

      float fbmFog(vec2 p) {
        float v = 0.0;
        float a = 0.5;
        mat2 rot = mat2(0.8, 0.6, -0.6, 0.8);
        for (int i = 0; i < 4; i++) {
          v += a * noise(p);
          p = rot * p * 2.1 + vec2(11.3, 17.7);
          a *= 0.5;
        }
        return v;
      }

      void main() {
        float distFromCenter = length(vUv - 0.5) * 2.0;
        float radialMask = smoothstep(1.0, 0.25, distFromCenter);

        float t = uTime * uFogSpeed * 0.12;
        vec2 uv1 = vWorldPos.xz * 0.28 + vec2(t * 0.45, t * 0.2);
        vec2 uv2 = vWorldPos.xz * 0.42 - vec2(t * 0.25, -t * 0.35);

        float n1 = fbmFog(uv1);
        float n2 = fbmFog(uv2 + vec2(n1 * 0.5, 0.0));
        float mist = pow((n1 * 0.6 + n2 * 0.4), 1.5) * 1.9;

        // Dynamic screen illumination on the ground fog
        float distToScreen = length(vWorldPos.xz - vec2(0.0, 0.7));
        float screenGlow = smoothstep(3.5, 0.3, distToScreen) * uScreenLightIntensity * 0.55;

        vec3 finalColor = mix(uFogColor, uScreenLightColor, screenGlow);

        float alpha = mist * radialMask * uFogDensity;
        alpha = clamp(alpha, 0.0, 0.82);

        gl_FragColor = vec4(finalColor * (1.0 + screenGlow * 1.5), alpha);
      }
    `;

    const groundFogMaterial = new THREE.ShaderMaterial({
      uniforms: groundFogUniforms,
      vertexShader: groundFogVertexShader,
      fragmentShader: groundFogFragmentShader,
      transparent: true,
      depthWrite: false
    });

    const groundFogPlane = new THREE.Mesh(new THREE.PlaneGeometry(24, 24), groundFogMaterial);

    // --- SECONDARY VOLUMETRIC FOG PUFFS ON FLOOR ---
    function createPuffTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
      grad.addColorStop(0, 'rgba(255, 255, 255, 0.85)');
      grad.addColorStop(0.35, 'rgba(255, 255, 255, 0.4)');
      grad.addColorStop(0.7, 'rgba(255, 255, 255, 0.08)');
      grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 128, 128);
      return new THREE.CanvasTexture(canvas);
    }

    const puffTexture = createPuffTexture();
    const fogPuffsGroup = new THREE.Group();
    scene.add(fogPuffsGroup);

    const puffCount = 36;
    const puffMeshes = [];
    const puffMaterial = new THREE.MeshBasicMaterial({
      map: puffTexture,
      color: new THREE.Color(params.fogColor),
      transparent: true,
      opacity: 0.18,
      depthWrite: false,
      blending: THREE.NormalBlending
    });

    for (let i = 0; i < puffCount; i++) {
      const size = 1.8 + Math.random() * 1.8;
      const puff = new THREE.Mesh(new THREE.PlaneGeometry(size, size), puffMaterial.clone());
      puff.rotation.x = -Math.PI * 0.5;
      const angle = (i / puffCount) * Math.PI * 2 + (Math.random() - 0.5) * 0.5;
      const radius = 0.8 + Math.random() * 2.8;
      puff.position.set(
        Math.cos(angle) * radius,
        floorMesh.position.y + 0.12 + Math.random() * 0.25,
        Math.sin(angle) * radius
      );
      puff.userData = {
        baseX: puff.position.x,
        baseZ: puff.position.z,
        speed: 0.3 + Math.random() * 0.5,
        angle: angle,

      fogPuffsGroup.add(puff);
      puffMeshes.push(puff);

    // --- SOFT CIRCULAR PARANORMAL DUST PARTICLES ---

      gradient.addColorStop(0.25, 'rgba(255, 255, 255, 0.7)');
      gradient.addColorStop(0.65, 'rgba(255, 255, 255, 0.15)');
      gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 64, 64);
      return new THREE.CanvasTexture(canvas);
    }

        ease: "power2.out"
      });
      gsap.to(knobUHFGroup.rotation, {
        z: Math.random() * Math.PI * 2,
        duration: dur,
        ease: "power2.out"
      });

      smallKnobs.forEach(k => {
        gsap.to(k.rotation, {
          y: Math.random() * Math.PI * 2,
          duration: dur

      const animModes = [
        "Static (No Camera Movement)",
        "Slow Orbit (360°)",
        "Creepy Close-up Push",
        "Subtle Floating Drift",
        "Cinematic Low Angle Sweep",

        "Side Knobs & Screen Arc",
        "Haunted Oscillate (Figure-8)"

      params.animationMode = animModes[Math.floor(Math.random() * animModes.length)];

      if (smooth) {
        gsap.to(crtUniforms.uManifestation, { value: params.manifestation, duration: 0.6 });
        gsap.to(crtUniforms.uStaticNoise, { value: params.staticNoise, duration: 0.6 });
        gsap.to(crtUniforms.uScanlineCount, { value: params.scanlineCount, duration: 0.6 });
        gsap.to(crtUniforms.uBarrelDistortion, { value: params.barrelDistortion, duration: 0.6 });
        gsap.to(crtUniforms.uChromaticAberration, { value: params.chromaticAberration, duration: 0.6 });
        gsap.to(crtUniforms.uGlitch, { value: params.glitch, duration: 0.6 });
        gsap.to(groundFogUniforms.uFogDensity, { value: params.groundFogDensity, duration: 0.6 });
      } else {
        crtUniforms.uManifestation.value = params.manifestation;
        crtUniforms.uStaticNoise.value = params.staticNoise;
        crtUniforms.uScanlineCount.value = params.scanlineCount;
        crtUniforms.uBarrelDistortion.value = params.barrelDistortion;
        crtUniforms.uChromaticAberration.value = params.chromaticAberration;
        crtUniforms.uGlitch.value = params.glitch;
        groundFogUniforms.uFogDensity.value = params.groundFogDensity;
      }

      // NOTE: Post-Processing Suite settings are strictly preserved and never shuffled or altered on scene randomization
      gui.controllersRecursive().forEach(c => c.updateDisplay());

    function applyPalette(name, smooth = true) {
      const p = PALETTES[name];
      if (!p) return;

      params.screenTint = p.screenTint;
      params.screenBg = p.screenBg;
      params.ghostAccent = p.ghostAccent;
      params.cabinetColor = p.cabinet;
      params.cabinetDark = p.cabinetDark;
      params.lightKeyColor = p.lightKey;
      params.lightScreenColor = p.lightScreen;
      params.fogColor = p.fogColor;

      updateWoodCanvas(woodData.canvas, woodData.ctx, p.cabinet, p.cabinetDark);
      woodData.texture.needsUpdate = true;

      dustMat.color.set(p.screenTint);

      if (!params.greenscreen) {
        scene.background.set(p.bg);
        if (scene.fog) scene.fog.color.set(p.bg);
      }

      const dur = smooth ? 0.8 : 0;
      gsap.to(crtUniforms.uScreenTint.value, {
        r: new THREE.Color(p.screenTint).r,
        g: new THREE.Color(p.screenTint).g,
        b: new THREE.Color(p.screenTint).b,
        duration: dur
      });
      gsap.to(crtUniforms.uScreenBg.value, {
        r: new THREE.Color(p.screenBg).r,
        g: new THREE.Color(p.screenBg).g,
        b: new THREE.Color(p.screenBg).b,
        duration: dur
      });
      gsap.to(crtUniforms.uGhostAccent.value, {
        r: new THREE.Color(p.ghostAccent).r,
        g: new THREE.Color(p.ghostAccent).g,
        b: new THREE.Color(p.ghostAccent).b,
        duration: dur

      gsap.to(groundFogUniforms.uFogColor.value, {
        r: new THREE.Color(p.fogColor).r,
        g: new THREE.Color(p.fogColor).g,
        b: new THREE.Color(p.fogColor).b,

      gsap.to(groundFogUniforms.uScreenLightColor.value, {
        r: new THREE.Color(p.lightScreen).r,
        g: new THREE.Color(p.lightScreen).g,
        b: new THREE.Color(p.lightScreen).b,

      puffMeshes.forEach(puff => {

      gsap.to(screenLight.color, {
        r: new THREE.Color(p.lightScreen).r,
        g: new THREE.Color(p.lightScreen).g,
        b: new THREE.Color(p.lightScreen).b,
        duration: dur

      gsap.to(keyLight.color, {
        r: new THREE.Color(p.lightKey).r,
        g: new THREE.Color(p.lightKey).g,
        b: new THREE.Color(p.lightKey).b,
        duration: dur
      });

      gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    function toggleGreenscreen(val) {
      if (val) {
        scene.background.set(0x00ff00);

        groundFogPlane.visible = false;
        fogPuffsGroup.visible = false;

        scene.background.set(p.bg);
        scene.fog = new THREE.FogExp2(p.bg, params.sceneFogDensity);
        floorMesh.visible = true;
        groundFogPlane.visible = true;
        fogPuffsGroup.visible = true;
        dustPoints.visible = true;

      if (postProcessor) {
        postProcessor.updateSettings();
      }

      keyLight.intensity = params.keyLightIntensity * params.sceneLightIntensity;
      ambientLight.intensity = params.ambientLightIntensity * params.sceneLightIntensity;
      rimLight.intensity = params.rimLightIntensity * params.sceneLightIntensity;
    }

    // --- REBUILD RENDERER (FOR ANTIALIAS TOGGLE) ---
    function rebuildRenderer(antialias) {
      const oldCanvas = renderer.domElement;
      renderer.dispose();

      renderer = new THREE.WebGLRenderer({
        antialias: antialias,
        powerPreference: "high-performance"
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(params.dpr);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = params.exposure;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      container.replaceChild(renderer.domElement, oldCanvas);

      if (postProcessor) {
        postProcessor.renderer = renderer;
        postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);
      }

      controls.dispose();
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.enableZoom = true;
      controls.enablePan = true;
      controls.screenSpacePanning = true;
      controls.target.set(0, 0.05, 0);
      controls.maxDistance = 8.0;
      controls.minDistance = 1.4;
      applyMouseButtons();

    // --- ANIMATION LOOP ---
    const clock = new THREE.Clock();
    let animTime = 0;
    const tvScreenWorldPos = new THREE.Vector3();

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const speed = params.animationSpeed;
      animTime += delta * speed;

      // Update shader times
      crtUniforms.uTime.value = animTime;
      groundFogUniforms.uTime.value = animTime;

      // Dynamic screen light flicker and paranormal intensity pulse
      const flicker = (Math.sin(animTime * 36.0) * 0.5 + 0.5) * 0.15 +
                      (Math.sin(animTime * 14.0) * 0.5 + 0.5) * 0.1 +
                      (Math.random() < 0.02 ? -0.35 : 0.0);
      const manifestBoost = params.manifestation * 1.5;
      const currentScreenIntensity = Math.max(0.1, params.screenLightIntensity * params.sceneLightIntensity * (1.0 + flicker + manifestBoost));
      screenLight.intensity = currentScreenIntensity;
      groundFogUniforms.uScreenLightIntensity.value = currentScreenIntensity;

      // Slowly drift the secondary fog puffs in organic eddies
      puffMeshes.forEach(puff => {
        puff.userData.angle += delta * 0.08 * puff.userData.speed * speed;
        puff.position.x = Math.cos(puff.userData.angle) * puff.userData.radius;
        puff.position.z = Math.sin(puff.userData.angle) * puff.userData.radius;
        puff.rotation.z += delta * 0.05 * speed;
      });

      // Ethereal paranormal dust particle drift
      const dustPos = dustGeo.attributes.position.array;
      for (let i = 1; i < dustCount * 3; i += 3) {
        dustPos[i] += Math.sin(animTime * 0.6 + dustPos[i - 1]) * 0.002;
        if (dustPos[i] > 3.0) dustPos[i] = floorMesh.position.y + 0.1;
      }
      dustGeo.attributes.position.needsUpdate = true;

      // Antenna eerie micro-wobble
      leftAntennaGroup.rotation.y = Math.sin(animTime * 1.4) * 0.02;
      rightAntennaGroup.rotation.y = Math.cos(animTime * 1.6) * 0.02;

      // Camera preset animation processing
      if (!controls.state || controls.state === -1) {
        const mode = params.animationMode;
        if (mode === "Static (No Camera Movement)") {
          // Fixed vantage point
        } else if (mode === "Slow Orbit (360°)") {
          const radius = 4.2;
          const angle = animTime * 0.16;
          camera.position.x = Math.sin(angle) * radius;
          camera.position.z = Math.cos(angle) * radius;
          camera.position.y = 0.25 + Math.sin(animTime * 0.08) * 0.18;
          controls.target.set(0, 0.05, 0);
        } else if (mode === "Creepy Close-up Push") {
          const pushDist = 2.05 + (Math.sin(animTime * 0.2) * 0.5 + 0.5) * 2.2;
          camera.position.x = Math.sin(animTime * 0.08) * 0.22;
          camera.position.y = 0.08 + Math.sin(animTime * 0.1) * 0.1;
          camera.position.z = pushDist;
          controls.target.set(0, 0.05, 0);
        } else if (mode === "Subtle Floating Drift") {
          camera.position.x = Math.sin(animTime * 0.28) * 0.42;
          camera.position.y = 0.18 + Math.sin(animTime * 0.38) * 0.22;
          camera.position.z = 4.0 + Math.cos(animTime * 0.24) * 0.32;
          controls.target.set(Math.sin(animTime * 0.18) * 0.1, Math.cos(animTime * 0.22) * 0.05, 0);
        } else if (mode === "Cinematic Low Angle Sweep") {
          const sweep = animTime * 0.18;
          camera.position.x = Math.sin(sweep) * 2.2;
          camera.position.y = -0.45;
          camera.position.z = 2.9 + Math.cos(sweep) * 0.7;
          controls.target.set(0, 0.25, 0);
        } else if (mode === "Diagonal Slow Pan") {
          const t = Math.sin(animTime * 0.16);
          camera.position.x = t * 2.3;
          camera.position.y = -t * 0.6 + 0.2;
          camera.position.z = 3.6 + Math.cos(animTime * 0.16) * 0.5;
          controls.target.set(t * 0.3, 0, 0);
        } else if (mode === "Side Knobs & Screen Arc") {
          const arcAngle = 0.15 + Math.sin(animTime * 0.2) * 0.65;
          camera.position.x = Math.sin(arcAngle) * 3.5;
          camera.position.z = Math.cos(arcAngle) * 3.5;
          camera.position.y = 0.12 + Math.sin(animTime * 0.1) * 0.15;
          controls.target.set(0.25 * Math.sin(arcAngle), 0, 0);
        } else if (mode === "Haunted Oscillate (Figure-8)") {
          camera.position.x = Math.sin(animTime * 0.26) * 1.5;
          camera.position.y = 0.18 + Math.sin(animTime * 0.52) * 0.32;
          camera.position.z = 3.8 + Math.cos(animTime * 0.26) * 0.42;
          controls.target.set(0, 0.05, 0);
        }
      }

      controls.update();

      if (postProcessor && postProcessor.settings.enabled) {
        if (postProcessor.settings.raysEnabled && typeof screenMesh !== 'undefined') {
          screenMesh.getWorldPosition(tvScreenWorldPos);
          postProcessor.setMoonScreenPosition(camera, tvScreenWorldPos);
        }
        postProcessor.renderScene(scene, camera);
      } else {
        renderer.render(scene, camera);
      }
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      if (postProcessor) {
        postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);
      }
    });

    animate();
  </script>
</body>
</html>
