/* Background Scene (Bokeh Lights & Atmospheric Glow)                       */
/* ========================================================================= */
function buildBackgroundScene() {
  sceneBg = new THREE.Scene();

  const bgBackdropGeo = new THREE.PlaneGeometry(80, 60);
  bgBackdropMat = new THREE.ShaderMaterial({
    vertexShader: `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform vec3 uTopColor;
      uniform vec3 uBottomColor;
      uniform vec3 uCenterColor;
      varying vec2 vUv;
      void main() {
        vec3 col = mix(uBottomColor, uTopColor, vUv.y);
        float centerGlow = exp(-pow(vUv.y - 0.42, 2.0) * 14.0) * 0.45;
        col += uCenterColor * centerGlow;
        gl_FragColor = vec4(col, 1.0);
      }
    `,
    uniforms: {
      uTopColor: { value: new THREE.Color(P.background) },
      uBottomColor: { value: new THREE.Color(P.background) },
      uCenterColor: { value: new THREE.Color(P.bokehColors[0] || '#ff2d78') }
    },
    depthWrite: false
  });
  bgBackdropMesh = new THREE.Mesh(bgBackdropGeo, bgBackdropMat);
  bgBackdropMesh.position.z = -18;
  sceneBg.add(bgBackdropMesh);

  bokehGroup = new THREE.Group();
  sceneBg.add(bokehGroup);
  rebuildBokehLights();
}

function rebuildBokehLights() {
  while (bokehGroup.children.length > 0) {
    const c = bokehGroup.children[0];
    if (c.geometry) c.geometry.dispose();
    if (c.material) c.material.dispose();
    bokehGroup.remove(c);
  }
  bokehObjects.length = 0;

  const currentColors = P.bokehColors;
  const count = P.bokehCount;
  const geo = new THREE.PlaneGeometry(1, 1);

  for (let i = 0; i < count; i++) {
    const colHex = currentColors[i % currentColors.length];
    const col = new THREE.Color(colHex);

    const mat = new THREE.ShaderMaterial({
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform vec3 uColor;
        uniform float uOpacity;
        uniform float uSoftness;
        varying vec2 vUv;
        void main() {
          float d = length(vUv - 0.5) * 2.0;
          if (d > 1.0) discard;
          float rim = smoothstep(0.68, 0.98, d) * 0.28;
          float core = exp(-d * d * (2.2 / uSoftness));
          float alpha = (core + rim) * smoothstep(1.0, 0.82, d) * uOpacity;
          gl_FragColor = vec4(uColor * 1.5, alpha);
        }
      `,
      uniforms: {
        uColor: { value: col },
        uOpacity: { value: rnd(0.55, 0.95) },
        uSoftness: { value: P.bokehBlur }
      },
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });

    const mesh = new THREE.Mesh(geo, mat);
    const px = rnd(-14, 14);
    const py = rnd(-9, 9);
    const pz = rnd(-11, -3);
    mesh.position.set(px, py, pz);

    const scale = rnd(1.4, 4.8);
    mesh.scale.set(scale, scale, 1.0);

    bokehGroup.add(mesh);

    bokehObjects.push({
      mesh,
      mat,
      basePos: new THREE.Vector3(px, py, pz),
      baseScale: scale,
      speedX: rnd(0.08, 0.28),
      speedY: rnd(0.12, 0.32),
      speedZ: rnd(0.06, 0.18),
      ampX: rnd(0.35, 1.1),
      ampY: rnd(0.4, 1.2),
      phaseX: rnd(0, Math.PI * 2),
      phaseY: rnd(0, Math.PI * 2),
      phaseZ: rnd(0, Math.PI * 2)
    });
  }
}

function updateBokehLights() {
  for (let i = 0; i < bokehObjects.length; i++) {
    const b = bokehObjects[i];
    b.mesh.position.x = b.basePos.x + Math.sin(simTime * b.speedX + b.phaseX) * b.ampX;
    b.mesh.position.y = b.basePos.y + Math.cos(simTime * b.speedY + b.phaseY) * b.ampY;
    b.mesh.position.z = b.basePos.z + Math.sin(simTime * b.speedZ + b.phaseZ) * 0.5;

    const pulse = 1.0 + 0.12 * Math.sin(simTime * 0.75 + b.phaseX);
    b.mesh.scale.set(b.baseScale * pulse, b.baseScale * pulse, 1.0);
  }
}

/* ========================================================================= */
/* Glass Plane & Rain Droplets Shader                                        */
/* ========================================================================= */
function buildMainScene() {
  sceneMain = new THREE.Scene();

  const glassGeo = new THREE.PlaneGeometry(80, 80, 1, 1);

  glassMaterial = new THREE.ShaderMaterial({
    vertexShader: `
      varying vec2 vUv;
      varying vec3 vWorldPosition;
      varying vec3 vViewPosition;

      void main() {
        vUv = uv;
        vec4 worldPos = modelMatrix * vec4(position, 1.0);
        vWorldPosition = worldPos.xyz;
        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        vViewPosition = -mvPosition.xyz;
        gl_Position = projectionMatrix * mvPosition;
      }
    `,
    fragmentShader: `
      uniform sampler2D uBackgroundTex;
      uniform vec2 uResolution;
      uniform float uTime;
      uniform float uRainAngle;
      uniform float uRainSpeed;
      uniform float uDropDensity;
      uniform float uDropSize;
      uniform float uEdgeDropDensity;
      uniform float uCenterCalm;
      uniform float uMicroDewDensity;
      uniform float uCondensationAmount;
      uniform float uTrailIntensity;
      uniform float uRefractionStrength;
      uniform float uDispersion;
      uniform vec3 uGlassTint;
      uniform float uGlassTintIntensity;

      uniform vec3 uKeyLightDir;
      uniform vec3 uKeyLightColor;
      uniform float uKeyLightIntensity;
      uniform vec3 uFillLightDir;
      uniform vec3 uFillLightColor;
      uniform float uFillLightIntensity;
      uniform vec3 uAmbientColor;
      uniform float uAmbientIntensity;

      uniform bool uGreenscreen;
      uniform vec3 uGreenscreenColor;
      uniform float uSceneLightIntensity;

      varying vec2 vUv;
      varying vec3 vWorldPosition;
      varying vec3 vViewPosition;

      float hash11(float p) {
        p = fract(p * 0.1031);
        p *= p + 33.33;
        p *= p + p;
        return fract(p);
      }

      float hash12(vec2 p) {
        vec3 p3 = fract(vec3(p.xyx) * 0.1031);
        p3 += dot(p3, p3.yzx + 33.33);
        return fract((p3.x + p3.y) * p3.z);
      }

      vec2 hash22(vec2 p) {
        vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973));
        p3 += dot(p3, p3.yzx + 33.33);
        return fract((p3.xx + p3.yz) * p3.zy);
      }

      mat2 rotate2d(float a) {
        float s = sin(a), c = cos(a);
        return mat2(c, -s, s, c);
      }

      void main() {
        vec2 pos = vWorldPosition.xy * 0.35;

        vec2 centerNorm = vWorldPosition.xy / vec2(4.5, 2.7);
        float edgeDist = length(centerNorm);
        float edgeFactor = smoothstep(0.20, 0.95, edgeDist);
        float edgeScale = mix(1.0 - clamp(uCenterCalm, 0.0, 0.98), 1.0, edgeFactor);

        vec2 posRot = rotate2d(uRainAngle) * pos;

        // 1. Sliding Trickling Drops & Wet Trails
        vec2 slideUv = posRot * vec2(2.4 * uDropDensity, 0.9 * uDropDensity);
        vec2 sId = floor(slideUv);
        vec2 sGv = fract(slideUv) - 0.5;

        float sRand = hash11(sId.x * 123.45 + 1.23);
        float speed = (0.7 + 0.6 * sRand) * uRainSpeed;
        float dropTime = uTime * speed + sRand * 18.0;

        float cycle = fract(dropTime * 0.16);
        float slideProgress = smoothstep(0.32, 0.74, cycle);
        float dropY = 0.5 - slideProgress * 1.0;
        float dropX = (hash11(sId.x * 89.1 + sId.y * 31.7) - 0.5) * 0.52;
        vec2 dropPos = vec2(dropX, dropY);

        vec2 dDelta = sGv - dropPos;
        dDelta.y *= 0.85;
        float dSlide = length(dDelta);
        float slideRadius = uDropSize * (0.08 + 0.05 * hash11(sId.x * 47.9)) * edgeScale;

        vec2 totalNormal = vec2(0.0);
        float totalDropMask = 0.0;
        float trailMask = 0.0;

        if (dSlide < slideRadius && slideRadius > 0.002) {
          float h = sqrt(max(0.001, 1.0 - pow(dSlide / slideRadius, 2.0)));
          totalNormal += (dDelta / slideRadius) * h;
          totalDropMask = max(totalDropMask, smoothstep(slideRadius, slideRadius * 0.85, dSlide));
        }

        if (sGv.y > dropPos.y && sGv.y < 0.5) {
          float trailWidth = slideRadius * 0.36;
          float dTrailX = abs(sGv.x - dropPos.x);
          float fade = smoothstep(0.5, dropPos.y, sGv.y);
          float streak = smoothstep(trailWidth, 0.0, dTrailX) * fade * uTrailIntensity;

          float beadY = fract(sGv.y * 8.0) - 0.5;
          float beadDist = length(vec2(dTrailX * 2.2, beadY));
          if (beadDist < 0.22 && streak > 0.08) {
            totalNormal += vec2(dTrailX, beadY) * 1.6;
            totalDropMask = max(totalDropMask, 0.55);
          }
          trailMask = max(trailMask, streak);
        }

        // 2. Static Drops (Large edge drops + medium drops)
        vec2 stUv1 = posRot * 4.4;
        vec2 stId1 = floor(stUv1);
        vec2 stGv1 = fract(stUv1) - 0.5;
        vec2 stOffset1 = (hash22(stId1) - 0.5) * 0.65;
        vec2 stDelta1 = stGv1 - stOffset1;
        stDelta1.y += stDelta1.x * stDelta1.x * 0.28;
        float stDist1 = length(stDelta1);
        float stR1 = uDropSize * (0.10 + 0.08 * hash12(stId1 + 7.1)) * edgeFactor * uEdgeDropDensity;
        if (stDist1 < stR1 && stR1 > 0.005) {
          float h = sqrt(max(0.001, 1.0 - pow(stDist1 / stR1, 2.0)));
          totalNormal += (stDelta1 / stR1) * h;
          totalDropMask = max(totalDropMask, smoothstep(stR1, stR1 * 0.85, stDist1));
        }

        vec2 stUv2 = posRot * 8.0;
        vec2 stId2 = floor(stUv2);
        vec2 stGv2 = fract(stUv2) - 0.5;
        vec2 stOffset2 = (hash22(stId2 + 41.3) - 0.5) * 0.65;
        vec2 stDelta2 = stGv2 - stOffset2;
        float stDist2 = length(stDelta2);
        float stR2 = uDropSize * (0.055 + 0.05 * hash12(stId2 + 13.7)) * mix(0.18, 1.0, edgeFactor);
        if (stDist2 < stR2 && stR2 > 0.005) {
          float h = sqrt(max(0.001, 1.0 - pow(stDist2 / stR2, 2.0)));
          totalNormal += (stDelta2 / stR2) * h;
          totalDropMask = max(totalDropMask, smoothstep(stR2, stR2 * 0.85, stDist2));
        }

        // 3. Micro-Dew Layer between large drops
        vec2 dewUv = posRot * 28.0;
        vec2 dewId = floor(dewUv);
        vec2 dewGv = fract(dewUv) - 0.5;
        vec2 dewOffset = (hash22(dewId * 19.3 + 5.1) - 0.5) * 0.7;
        vec2 dewDelta = dewGv - dewOffset;
        float dewDist = length(dewDelta);
        float dewR = 0.10 * (0.4 + 0.6 * hash12(dewId * 29.7)) * uMicroDewDensity;
        if (dewDist < dewR) {
          float h = sqrt(max(0.001, 1.0 - pow(dewDist / dewR, 2.0)));
          totalNormal += (dewDelta / dewR) * h * 0.55;
          totalDropMask = max(totalDropMask, smoothstep(dewR, dewR * 0.75, dewDist));
        }

        // 4. Edge Condensation / Frosting
        float condensation = edgeFactor * uCondensationAmount;
        float noiseM = hash12(floor(vWorldPosition.xy * 24.0)) * 0.12;
        condensation = clamp(condensation + noiseM * edgeFactor, 0.0, 1.0);
        condensation *= (1.0 - totalDropMask * 0.96) * (1.0 - trailMask * 0.85);

        // 5. Inverted Lens Refraction & Optical Dispersion
        totalNormal = rotate2d(-uRainAngle) * totalNormal;

        float nLen = length(totalNormal);
        if (nLen > 0.95) {
          totalNormal = totalNormal * (0.95 / nLen);
        }

        vec3 N = vec3(totalNormal.x, totalNormal.y, sqrt(max(0.01, 1.0 - dot(totalNormal, totalNormal))));
        N = normalize(N);

        vec2 screenUv = gl_FragCoord.xy / uResolution;

        // Invert background lights inside drops
        vec2 refrOffset = -N.xy * (uRefractionStrength * 0.14);
        refrOffset += (hash22(vWorldPosition.xy * 45.0) - 0.5) * trailMask * 0.004;

        float disp = uDispersion * 0.035;
        vec2 uvR = screenUv + refrOffset * (1.0 + disp);
        vec2 uvG = screenUv + refrOffset;
        vec2 uvB = screenUv + refrOffset * (1.0 - disp);

        vec3 bgSample;
        if (uGreenscreen) {
          bgSample = uGreenscreenColor;
        } else {
          float blur = condensation * 0.012;
          float r = texture2D(uBackgroundTex, uvR).r * 0.5
                  + texture2D(uBackgroundTex, uvR + vec2(blur, blur)).r * 0.25
                  + texture2D(uBackgroundTex, uvR - vec2(blur, -blur)).r * 0.25;

          float g = texture2D(uBackgroundTex, uvG).g * 0.5
                  + texture2D(uBackgroundTex, uvG + vec2(-blur, blur)).g * 0.25
                  + texture2D(uBackgroundTex, uvG - vec2(blur, blur)).g * 0.25;

          float b = texture2D(uBackgroundTex, uvB).b * 0.5
                  + texture2D(uBackgroundTex, uvB + vec2(blur, -blur)).b * 0.25
                  + texture2D(uBackgroundTex, uvB - vec2(-blur, -blur)).b * 0.25;

          bgSample = vec3(r, g, b);
        }

        // 6. Lighting, Specular Glints & Glass Tint
        vec3 V = normalize(vViewPosition);

        vec3 L_key = normalize((viewMatrix * vec4(uKeyLightDir, 0.0)).xyz);
        vec3 H_key = normalize(L_key + V);
        float NdotH_key = max(0.0, dot(N, H_key));
        float specKey = pow(NdotH_key, 64.0) * uKeyLightIntensity;
        float glintKey = pow(NdotH_key, 256.0) * uKeyLightIntensity * 3.2;

        vec3 L_fill = normalize((viewMatrix * vec4(uFillLightDir, 0.0)).xyz);
        vec3 H_fill = normalize(L_fill + V);
        float NdotH_fill = max(0.0, dot(N, H_fill));
        float specFill = pow(NdotH_fill, 48.0) * uFillLightIntensity;

        float meniscus = smoothstep(0.28, 0.92, nLen) * totalDropMask;
        vec3 color = bgSample * (1.0 - meniscus * 0.45);

        vec3 specLight = (specKey + glintKey) * uKeyLightColor + specFill * uFillLightColor;
        color += specLight * (totalDropMask + trailMask * 0.28) * uSceneLightIntensity;

        color += condensation * uAmbientColor * uAmbientIntensity * 0.28;

        if (!uGreenscreen) {
          color = mix(color, color * uGlassTint * 1.45, uGlassTintIntensity);
        }

        float fresnel = pow(1.0 - max(0.0, dot(N, V)), 3.5);
        color += fresnel * 0.14 * uGlassTint;

        gl_FragColor = vec4(color, 1.0);
      }
    `,
    uniforms: {
      uBackgroundTex: { value: null },
      uResolution: { value: new THREE.Vector2(window.innerWidth * P.pixelRatio, window.innerHeight * P.pixelRatio) },
      uTime: { value: 0 },
      uRainAngle: { value: P.rainAngle * DEG2RAD },
      uRainSpeed: { value: P.rainSpeed },
      uDropDensity: { value: P.dropDensity },
      uDropSize: { value: P.dropSize },
      uEdgeDropDensity: { value: P.edgeDropDensity },
      uCenterCalm: { value: P.centerCalm },
      uMicroDewDensity: { value: P.microDew },
      uCondensationAmount: { value: P.condensation },
      uTrailIntensity: { value: P.trails },
      uRefractionStrength: { value: P.refraction },
      uDispersion: { value: P.dispersion },
      uGlassTint: { value: new THREE.Color(P.glassTint) },
      uGlassTintIntensity: { value: P.glassTintIntensity },

      uKeyLightDir: { value: new THREE.Vector3() },
      uKeyLightColor: { value: new THREE.Color(P.keyLightColor) },
      uKeyLightIntensity: { value: P.keyLightIntensity },

      uFillLightDir: { value: new THREE.Vector3() },
      uFillLightColor: { value: new THREE.Color(P.fillLightColor) },
      uFillLightIntensity: { value: P.fillLightIntensity },

      uAmbientColor: { value: new THREE.Color(P.ambientLightColor) },
      uAmbientIntensity: { value: P.ambientLightIntensity },

      uGreenscreen: { value: P.greenscreen },
      uGreenscreenColor: { value: new THREE.Color(P.greenscreenColor) },
      uSceneLightIntensity: { value: P.sceneLightIntensity }
    }
  });

  glassMesh = new THREE.Mesh(glassGeo, glassMaterial);
  glassMesh.position.set(0, 0, 0);
  sceneMain.add(glassMesh);

  updateLightVectors();
}

function updateLightVectors() {
  if (!glassMaterial) return;

  const kAz = P.keyLightAzimuth * DEG2RAD;
  const kEl = P.keyLightElevation * DEG2RAD;
  const keyDir = new THREE.Vector3(
    Math.cos(kEl) * Math.sin(kAz),
    Math.sin(kEl),
    Math.cos(kEl) * Math.cos(kAz)
  ).normalize();

  const fAz = P.fillLightAzimuth * DEG2RAD;
  const fEl = P.fillLightElevation * DEG2RAD;
  const fillDir = new THREE.Vector3(
    Math.cos(fEl) * Math.sin(fAz),
    Math.sin(fEl),
    Math.cos(fEl) * Math.cos(fAz)
  ).normalize();

  glassMaterial.uniforms.uKeyLightDir.value.copy(keyDir);
  glassMaterial.uniforms.uKeyLightColor.value.set(P.keyLightColor);
  glassMaterial.uniforms.uKeyLightIntensity.value = P.keyLightOn ? P.keyLightIntensity : 0;

  glassMaterial.uniforms.uFillLightDir.value.copy(fillDir);
  glassMaterial.uniforms.uFillLightColor.value.set(P.fillLightColor);
  glassMaterial.uniforms.uFillLightIntensity.value = P.fillLightOn ? P.fillLightIntensity : 0;

  glassMaterial.uniforms.uAmbientColor.value.set(P.ambientLightColor);
  glassMaterial.uniforms.uAmbientIntensity.value = P.ambientLightOn ? P.ambientLightIntensity : 0;

  glassMaterial.uniforms.uSceneLightIntensity.value = P.sceneLightIntensity;
  renderer.toneMappingExposure = P.exposure;
}

/* ========================================================================= */
/* Camera Setup & Smooth Motion                                              */
/* ========================================================================= */
function initCamera() {
  camera = new THREE.PerspectiveCamera(P.fov, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 0, P.camDistance);
}

function resetCameraView() {
  gsap.to(camera.position, {
    x: 0,
    y: 0,
    z: 5.0,
    duration: 1.2,
    ease: 'power2.inOut',
    onUpdate: () => {
      controls.update();
    }
  });
  gsap.to(controls.target, {
    x: 0,
    y: 0,
    z: 0,
    duration: 1.2,
    ease: 'power2.inOut',
    onUpdate: () => {
      baseTarget.set(0, 0, 0);
      controls.update();
    }
  });
  gsap.to(P, {
    fov: 48,
    duration: 1.2,
    ease: 'power2.inOut',
    onUpdate: () => {
      camera.fov = P.fov;
      camera.updateProjectionMatrix();
    }
  });
}

function updateCameraMotion(dT) {
  const anim = ANIMATIONS[P.animation] || ANIMATIONS['Gentle Drift'];

  if (P.animation === 'Static (No Movement)') {
    controls.autoRotate = false;
    camera.fov = P.fov;
    camera.updateProjectionMatrix();
    return;
  }

  controls.autoRotate = anim.autoRotate;
  controls.autoRotateSpeed = anim.orbitSpeed;

  if (anim.breathe > 0) {
    camera.fov = P.fov + Math.sin(simTime * anim.breatheSpeed) * (P.fov * anim.breathe);
    camera.updateProjectionMatrix();
  } else {
    camera.fov = P.fov;
    camera.updateProjectionMatrix();
  }

  if (!isUserInteracting && (anim.swayX > 0 || anim.swayY > 0)) {
    const sX = Math.sin(simTime * anim.swaySpeed) * anim.swayX;
    const sY = Math.cos(simTime * anim.swaySpeed * 0.72) * anim.swayY;
    controls.target.x = baseTarget.x + sX;
    controls.target.y = baseTarget.y + sY;
  }
}

/* ========================================================================= */
/* Scheme & Preset Application                                               */
/* ========================================================================= */
function applyScheme(name, animate = true) {
  const scheme = SCHEMES[name] || SCHEMES['Original'];
  P.scheme = name;

  if (animate && typeof gsap !== 'undefined') {
    gsap.to(renderer.domElement, {
      duration: 0.8,
      onStart: () => {
        P.background = scheme.bg;
        P.glassTint = scheme.tint;
        P.glassTintIntensity = scheme.tintIntensity;
        P.bokehColors = [...scheme.colors];

        updateThemeVisuals();
        syncGUI();
      }
    });
  } else {
    P.background = scheme.bg;
    P.glassTint = scheme.tint;
    P.glassTintIntensity = scheme.tintIntensity;
    P.bokehColors = [...scheme.colors];

    updateThemeVisuals();
    syncGUI();
  }
}

function updateThemeVisuals() {
  const bg = P.greenscreen ? P.greenscreenColor : P.background;
  document.body.style.background = bg;
  renderer.setClearColor(bg, 1);

  if (glassMaterial) {
    glassMaterial.uniforms.uGlassTint.value.set(P.glassTint);
    glassMaterial.uniforms.uGlassTintIntensity.value = P.glassTintIntensity;
    glassMaterial.uniforms.uGreenscreen.value = P.greenscreen;
    glassMaterial.uniforms.uGreenscreenColor.value.set(P.greenscreenColor);
  }

  if (bgBackdropMat) {
    bgBackdropMat.visible = !P.greenscreen;
    bgBackdropMat.uniforms.uTopColor.value.set(P.background);
    bgBackdropMat.uniforms.uBottomColor.value.set(P.background);
    bgBackdropMat.uniforms.uCenterColor.value.set(P.bokehColors[0] || '#ff2d78');
  }

  if (bokehGroup) {
    bokehGroup.visible = !P.greenscreen;
  }

  for (let i = 0; i < bokehObjects.length; i++) {
    const colHex = P.bokehColors[i % P.bokehColors.length];
    bokehObjects[i].mat.uniforms.uColor.value.set(colHex);
  }
}

/* ========================================================================= */
/* Procedural Randomizer (Click on Scene)                                    */
/* NOTE: Per user instruction, PostProcessor settings are strictly           */
/* PRESERVED and NEVER shuffled or changed on random scene!                  */
/* ========================================================================= */
function randomizeScene() {
  const newSchemeName = pick(SCHEME_NAMES);
  applyScheme(newSchemeName, true);

  // Re-roll motion & geometric parameters
  P.animation = pick(ANIMATION_NAMES);
  P.rainAngle = rnd(-28, 28);
  P.rainSpeed = rnd(0.7, 1.6);
  P.edgeDropDensity = rnd(0.9, 1.8);
  P.microDew = rnd(0.6, 1.5);
  P.condensation = rnd(0.6, 1.4);
  P.trails = rnd(0.7, 1.4);
  P.refraction = rnd(0.25, 0.55);
  P.dispersion = rnd(0.018, 0.045);
  P.bokehBlur = rnd(0.7, 1.5);
  P.exposure = rnd(1.1, 1.5);

  if (glassMaterial) {
    glassMaterial.uniforms.uRainAngle.value = P.rainAngle * DEG2RAD;
    glassMaterial.uniforms.uRainSpeed.value = P.rainSpeed;
    glassMaterial.uniforms.uEdgeDropDensity.value = P.edgeDropDensity;
    glassMaterial.uniforms.uMicroDewDensity.value = P.microDew;
    glassMaterial.uniforms.uCondensationAmount.value = P.condensation;
    glassMaterial.uniforms.uTrailIntensity.value = P.trails;
    glassMaterial.uniforms.uRefractionStrength.value = P.refraction;
    glassMaterial.uniforms.uDispersion.value = P.dispersion;
  }

  rebuildBokehLights();
  updateLightVectors();
  syncGUI();
}

/* ========================================================================= */
/* GUI Setup using lil-gui                                                   */
/* ========================================================================= */
let gui;
const ctrl = {};

function initGUI() {
  gui = new GUI({ title: 'Розовое стекло' });

  // 1. Scene Presets Folder
  const fScene = gui.addFolder('Presets & Theme');
  ctrl.scheme = fScene.add(P, 'scheme', SCHEME_NAMES).name('Color Scheme').onChange(v => applyScheme(v, true));
  ctrl.animation = fScene.add(P, 'animation', ANIMATION_NAMES).name('Animation');
  ctrl.speed = fScene.add(P, 'speed', 0.1, 3.0, 0.05).name('Animation Speed');
  ctrl.clickRandomize = fScene.add(P, 'clickRandomize').name('Click to Randomize');
  fScene.add(P, 'randomizeNow').name('Randomize Variation');

  // 2. Rain & Droplets Physics
  const fRain = gui.addFolder('Rain & Droplets');
  ctrl.rainAngle = fRain.add(P, 'rainAngle', -45, 45, 0.5).name('Rain Angle (deg)').onChange(v => {
    if (glassMaterial) glassMaterial.uniforms.uRainAngle.value = v * DEG2RAD;
  });
  ctrl.rainSpeed = fRain.add(P, 'rainSpeed', 0.1, 3.0, 0.05).name('Trickle Speed').onChange(v => {
    if (glassMaterial) glassMaterial.uniforms.uRainSpeed.value = v;
  });
  ctrl.dropDensity = fRain.add(P, 'dropDensity', 0.2, 2.5, 0.05).name('Drop Frequency').onChange(v => {
    if (glassMaterial) glassMaterial.uniforms.uDropDensity.value = v;
  });
  ctrl.dropSize = fRain.add(P, 'dropSize', 0.4, 2.0, 0.05).name('Drop Size').onChange(v => {
    if (glassMaterial) glassMaterial.uniforms.uDropSize.value = v;
  });
  ctrl.edgeDropDensity = fRain.add(P, 'edgeDropDensity', 0.2, 3.0, 0.05).name('Edge Clusters').onChange(v => {
    if (glassMaterial) glassMaterial.uniforms.uEdgeDropDensity.value = v;
  });
  ctrl.centerCalm = fRain.add(P, 'centerCalm', 0.0, 1.0, 0.02).name('Center Calmness').onChange(v => {
    if (glassMaterial) glassMaterial.uniforms.uCenterCalm.value = v;
  });
  ctrl.microDew = fRain.add(P, 'microDew', 0.0, 2.5, 0.05).name('Micro Dew Density').onChange(v => {
    if (glassMaterial) glassMaterial.uniforms.uMicroDewDensity.value = v;
  });
  ctrl.condensation = fRain.add(P, 'condensation', 0.0, 2.0, 0.05).name('Edge Condensation').onChange(v => {
    if (glassMaterial) glassMaterial.uniforms.uCondensationAmount.value = v;
  });
  ctrl.trails = fRain.add(P, 'trails', 0.0, 2.0, 0.05).name('Wet Streaks').onChange(v => {
    if (glassMaterial) glassMaterial.uniforms.uTrailIntensity.value = v;
  });
  ctrl.refraction = fRain.add(P, 'refraction', 0.05, 1.0, 0.01).name('Lens Inversion').onChange(v => {
    if (glassMaterial) glassMaterial.uniforms.uRefractionStrength.value = v;
  });
  ctrl.dispersion = fRain.add(P, 'dispersion', 0.0, 0.08, 0.002).name('Dispersion Rim').onChange(v => {
    if (glassMaterial) glassMaterial.uniforms.uDispersion.value = v;
  });

  // 3. Colors & Material
  const fColor = gui.addFolder('Colors & Material');
  ctrl.glassTint = fColor.addColor(P, 'glassTint').name('Glass Tint Color').onChange(v => {
    if (glassMaterial) glassMaterial.uniforms.uGlassTint.value.set(v);
  });
  ctrl.glassTintIntensity = fColor.add(P, 'glassTintIntensity', 0.0, 1.0, 0.02).name('Glass Tint Depth').onChange(v => {
    if (glassMaterial) glassMaterial.uniforms.uGlassTintIntensity.value = v;
  });
  ctrl.background = fColor.addColor(P, 'background').name('Background Color').onChange(v => {
    updateThemeVisuals();
  });
  ctrl.greenscreen = fColor.add(P, 'greenscreen').name('Greenscreen (#00ff00)').onChange(() => {
    updateThemeVisuals();
  });
  ctrl.bokehBlur = fColor.add(P, 'bokehBlur', 0.2, 2.5, 0.05).name('Bokeh Softness').onChange(v => {
    for (let b of bokehObjects) b.mat.uniforms.uSoftness.value = v;
  });
  ctrl.bokehCount = fColor.add(P, 'bokehCount', 10, 70, 1).name('Bokeh Lights Count').onChange(() => {
    rebuildBokehLights();
  });

  // 4. Lighting & Exposure
  const fLight = gui.addFolder('Lighting & Exposure');
  ctrl.exposure = fLight.add(P, 'exposure', 0.2, 3.5, 0.05).name('Exposure').onChange(v => {
    renderer.toneMappingExposure = v;
  });
  ctrl.sceneLightIntensity = fLight.add(P, 'sceneLightIntensity', 0.1, 3.0, 0.05).name('Light Multiplier').onChange(v => {
    if (glassMaterial) glassMaterial.uniforms.uSceneLightIntensity.value = v;
  });

  const fKey = fLight.addFolder('Key Light').close();
  ctrl.keyLightOn = fKey.add(P, 'keyLightOn').name('Enabled').onChange(updateLightVectors);
  ctrl.keyLightIntensity = fKey.add(P, 'keyLightIntensity', 0.0, 5.0, 0.05).name('Intensity').onChange(updateLightVectors);
  ctrl.keyLightColor = fKey.addColor(P, 'keyLightColor').name('Color').onChange(updateLightVectors);
  ctrl.keyLightAzimuth = fKey.add(P, 'keyLightAzimuth', 0, 360, 1).name('Azimuth').onChange(updateLightVectors);
  ctrl.keyLightElevation = fKey.add(P, 'keyLightElevation', 0, 90, 1).name('Elevation').onChange(updateLightVectors);

  const fFill = fLight.addFolder('Fill Light').close();
  ctrl.fillLightOn = fFill.add(P, 'fillLightOn').name('Enabled').onChange(updateLightVectors);
  ctrl.fillLightIntensity = fFill.add(P, 'fillLightIntensity', 0.0, 5.0, 0.05).name('Intensity').onChange(updateLightVectors);
  ctrl.fillLightColor = fFill.addColor(P, 'fillLightColor').name('Color').onChange(updateLightVectors);
  ctrl.fillLightAzimuth = fFill.add(P, 'fillLightAzimuth', 0, 360, 1).name('Azimuth').onChange(updateLightVectors);
  ctrl.fillLightElevation = fFill.add(P, 'fillLightElevation', 0, 90, 1).name('Elevation').onChange(updateLightVectors);

  const fAmb = fLight.addFolder('Ambient Light').close();
  ctrl.ambientLightOn = fAmb.add(P, 'ambientLightOn').name('Enabled').onChange(updateLightVectors);
  ctrl.ambientLightIntensity = fAmb.add(P, 'ambientLightIntensity', 0.0, 3.0, 0.05).name('Intensity').onChange(updateLightVectors);
  ctrl.ambientLightColor = fAmb.addColor(P, 'ambientLightColor').name('Color').onChange(updateLightVectors);

  // 5. Camera & Navigation
  const fCam = gui.addFolder('Camera & Navigation').close();
  ctrl.dragMode = fCam.add(P, 'dragMode', ['Orbit', 'Pan']).name('Left Drag Mode').onChange(updateDragMode);
  ctrl.camDistance = fCam.add(P, 'camDistance', 1.2, 25.0, 0.1).name('Camera Distance (Zoom)').listen().onChange(v => {
    if (controls) {
      const dir = new THREE.Vector3().subVectors(camera.position, controls.target).normalize();
      camera.position.copy(controls.target).addScaledVector(dir, v);
      controls.update();
    }
  });
  ctrl.fov = fCam.add(P, 'fov', 25, 80, 1).name('Field of View').onChange(v => {
    camera.fov = v;
    camera.updateProjectionMatrix();
  });
  fCam.add(P, 'resetView').name('Reset View');

  // 6. Post-Processing Suite Integration
  if (postProcessor) {
    postProcessor.attachGUI(gui, "Post Processing");
  }

  // 7. Render Quality
  const fRender = gui.addFolder('Render Quality').close();
  ctrl.pixelRatio = fRender.add(P, 'pixelRatio', 0.5, 2.5, 0.05).name('Pixel Ratio (DPR)').onChange(v => {
    renderer.setPixelRatio(v);
    resize();
  });
  ctrl.antialias = fRender.add(P, 'antialias').name('Antialias').onChange(recreateRenderer);
}

function syncGUI() {
  for (const k in ctrl) {
    if (ctrl[k] && typeof ctrl[k].updateDisplay === 'function') {
      ctrl[k].updateDisplay();
    }
  }
}

function recreateRenderer() {
  if (controls) controls.dispose();
  if (bgRenderTarget) bgRenderTarget.dispose();
  if (renderer) {
    const currentDom = renderer.domElement;
    if (currentDom) currentDom.remove();
    renderer.dispose();
  }
  initRenderer();
  if (postProcessor) {
    postProcessor.renderer = renderer;
    postProcessor.setAntialias(P.antialias);
    postProcessor.setSize(window.innerWidth, window.innerHeight, P.pixelRatio);
  }
  resize();
}

/* ========================================================================= */
/* Interaction & Pointer Handling                                            */
/* ========================================================================= */
let pointerDownPos = { x: 0, y: 0 };
let pointerDownTime = 0;

window.addEventListener('pointerdown', (e) => {
  if (e.target.closest('.lil-gui')) return;
  isUserInteracting = true;
  pointerDownPos.x = e.clientX;
  pointerDownPos.y = e.clientY;
  pointerDownTime = performance.now();
});

window.addEventListener('pointerup', (e) => {
  isUserInteracting = false;
  if (e.target.closest('.lil-gui')) return;

  const dx = e.clientX - pointerDownPos.x;
  const dy = e.clientY - pointerDownPos.y;
  const dist = Math.hypot(dx, dy);
  const duration = performance.now() - pointerDownTime;

  if (dist < 6 && duration < 350) {
    if (P.clickRandomize) {
      randomizeScene();
    }
  }
});

window.addEventListener('pointercancel', () => {
  isUserInteracting = false;
});

/* Toggle UI visibility with "H" key */
let uiVisible = true;
window.addEventListener('keydown', (e) => {
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) return;
  if (e.key === 'h' || e.key === 'H') {
    uiVisible = !uiVisible;
    gui.show(uiVisible);
  }
});

/* ========================================================================= */
/* Resizing                                                                  */
/* ========================================================================= */
function resize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const dpr = P.pixelRatio;

  renderer.setSize(w, h);
  renderer.setPixelRatio(dpr);

  bgRenderTarget.setSize(w * dpr, h * dpr);

  if (postProcessor) {
    postProcessor.setSize(w, h, dpr);
  }

  camera.aspect = w / h;
  camera.updateProjectionMatrix();

  if (glassMaterial) {
    glassMaterial.uniforms.uResolution.value.set(w * dpr, h * dpr);
  }
}
window.addEventListener('resize', resize);

/* ========================================================================= */
/* Render Loop                                                               */
/* ========================================================================= */
function animate() {
  requestAnimationFrame(animate);

  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;

  const dT = dt * P.speed;
  simTime += dT;

  // 1. Update camera motion (preserves user zoom and angles)
  updateCameraMotion(dT);
  controls.update();

  if (controls && controls.getDistance) {
    P.camDistance = parseFloat(controls.getDistance().toFixed(2));
  }

  // 2. Update background bokeh float
  updateBokehLights();

  // 3. Render background scene to offscreen render target
  renderer.setRenderTarget(bgRenderTarget);
  renderer.render(sceneBg, camera);
  renderer.setRenderTarget(null);

  // 4. Update glass material uniforms
  glassMaterial.uniforms.uTime.value = simTime;
  glassMaterial.uniforms.uBackgroundTex.value = bgRenderTarget.texture;

  // 5. Render final glass plane through postprocessing pipeline
  if (postProcessor) {
    if (postProcessor.settings.raysEnabled && glassMaterial) {
      const sunPos = new THREE.Vector3().copy(glassMaterial.uniforms.uKeyLightDir.value).multiplyScalar(15);
      postProcessor.setMoonScreenPosition(camera, sunPos);
    }
    postProcessor.renderScene(sceneMain, camera);
  } else {
    renderer.render(sceneMain, camera);
  }
}

/* ========================================================================= */
/* Initialization                                                            */
/* ========================================================================= */
initCamera();
initRenderer();
buildBackgroundScene();
buildMainScene();

// Initialize PostProcessor pipeline (anamorphic is OFF by default)
postProcessor = new PostProcessor(renderer, {
  enabled: true,
  antialias: P.antialias,
  bloomEnabled: true,
  bloomStrength: 0.85,
  bloomRadius: 0.5,
  bloomThreshold: 0.22,
  anamorphicEnabled: false, // Per user instruction: Anamorphic default is off
  raysEnabled: false,
  chromaticAberration: 0.008,
  vignetteBoost: 1.1,
  vignetteReduction: 0.65,
  noiseIntensity: 0.008
});
postProcessor.setSize(window.innerWidth, window.innerHeight, P.pixelRatio);

initGUI();
applyScheme(P.scheme, false);
resize();
animate();

</script>
