  <!-- Fallback shim for Chroma in isolated/offline environments -->
  <script>
    if (typeof window.chroma === 'undefined') {
      window.chroma = (function() {
        function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
        function parseHex(h) {
          h = String(h).replace('#', '');
          if (h.length === 3) h = h.split('').map(c => c + c).join('');
          let num = parseInt(h, 16) || 0;
          return [(num >> 16) & 255, (num >> 8) & 255, num & 255];
        }
        function rgbToHsl(r, g, b) {
          r /= 255; g /= 255; b /= 255;
          let max = Math.max(r, g, b), min = Math.min(r, g, b);
          let h = 0, s = 0, l = (max + min) / 2;
          if (max !== min) {
            let d = max - min;
            s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
            switch (max) {
              case r: h = (g - b) / d + (g < b ? 6 : 0); break;
              case g: h = (b - r) / d + 2; break;
              case b: h = (r - g) / d + 4; break;
            }
            h /= 6;
          }
          return [h * 360, s, l];
        }
        function hslToRgb(h, s, l) {
          h = (h % 360 + 360) % 360;
          let c = (1 - Math.abs(2 * l - 1)) * s;
          let x = c * (1 - Math.abs(((h / 60) % 2) - 1));
          let m = l - c / 2;
          let r = 0, g = 0, b = 0;
          if (h < 60) { r = c; g = x; }
          else if (h < 120) { r = x; g = c; }
          else if (h < 180) { g = c; b = x; }
          else if (h < 240) { g = x; b = c; }
          else if (h < 300) { r = x; b = c; }
          else { r = c; b = x; }
          return [Math.round((r + m) * 255), Math.round((g + m) * 255), Math.round((b + m) * 255)];
        }
        class Color {
          constructor(r, g, b, a = 1) {
            this.r = clamp(r, 0, 255);
            this.g = clamp(g, 0, 255);
            this.b = clamp(b, 0, 255);
            this.a = clamp(a, 0, 1);
          }
          get(prop) {
            if (prop === 'hsl.h') return rgbToHsl(this.r, this.g, this.b)[0];
            return 0;
          }
          set(prop, val) {
            if (prop === 'hsl.h') {
              let [, s, l] = rgbToHsl(this.r, this.g, this.b);
              let [nr, ng, nb] = hslToRgb(val, s, l);
              return new Color(nr, ng, nb, this.a);
            }
            return this;
          }
          alpha(a) { return new Color(this.r, this.g, this.b, a); }
          darken(d = 0.5) {
            let [h, s, l] = rgbToHsl(this.r, this.g, this.b);
            let [nr, ng, nb] = hslToRgb(h, s, clamp(l - d * 0.35, 0, 1));
            return new Color(nr, ng, nb, this.a);
          }
          brighten(b = 0.5) {
            let [h, s, l] = rgbToHsl(this.r, this.g, this.b);
            let [nr, ng, nb] = hslToRgb(h, s, clamp(l + b * 0.35, 0, 1));
            return new Color(nr, ng, nb, this.a);
          }
          saturate(s = 0.5) {
            let [h, curS, l] = rgbToHsl(this.r, this.g, this.b);
            let [nr, ng, nb] = hslToRgb(h, clamp(curS + s * 0.35, 0, 1), l);
            return new Color(nr, ng, nb, this.a);
          }
          desaturate(d = 0.5) {
            let [h, curS, l] = rgbToHsl(this.r, this.g, this.b);
            let [nr, ng, nb] = hslToRgb(h, clamp(curS - d * 0.35, 0, 1), l);
            return new Color(nr, ng, nb, this.a);
          }
          hex() {
            let toHex = n => Math.round(n).toString(16).padStart(2, '0');
            return '#' + toHex(this.r) + toHex(this.g) + toHex(this.b);
          }
          css(fmt) {
            if (fmt === 'rgba') return 'rgba(' + Math.round(this.r) + ',' + Math.round(this.g) + ',' + Math.round(this.b) + ',' + this.a.toFixed(3) + ')';
            return this.hex();
          }
        }
        return function chroma(a, b, c, d) {
          if (typeof a === 'string') {
            let [r, g, bl] = parseHex(a);
            return new Color(r, g, bl, 1);
          }
          return new Color(a, b, c, d !== undefined ? d : 1);
        };
      })();
    }

    // Polyfill splineVertex for universal p5 compatibility
    if (typeof window.splineVertex !== 'function') {
      window.splineVertex = function(x, y) {
        if (typeof curveVertex === 'function') curveVertex(x, y);
        else if (typeof vertex === 'function') vertex(x, y);
      };
    }
  </script>

  <script>
    // ============================================================

    // ============================================================

    let noiseScale, baseStrength, stepSize, seedSpacing, canvasMargin, sizeMult;
    let zones = [];

    // Authentic palettes from the original sketch
    const ORIGINAL_PALETTES = [

      [ "#71093b", "#990b52", "#cb8b15", "#eaaa34", "#ffffff", "#f1f4f9", "#749ed2", "#467ec3", "#023578", "#022450" ]
    ];

    // 19 Curated Color Schemes Pattern
    const COLOR_SCHEMES = {
      'Original': ORIGINAL_PALETTES[0],
      'Monochromatic': [ "#051923", "#003554", "#006494", "#0582ca", "#00a6fb", "#51c0fb", "#a0dcff", "#d0eeff" ],
      'Analogous': [ "#2b0938", "#571845", "#900c3f", "#c70039", "#ff5733", "#ff8d1a", "#ffc300", "#ffea00", "#ff6f59" ],
      'Complementary': [ "#001219", "#005f73", "#0a9396", "#94d2bd", "#ee9b00", "#ca6702", "#bb3e03", "#ae2012", "#9b2226", "#ffd166" ],
      'Split-complementary': [ "#0d1f18", "#174d38", "#2ec4b6", "#a7f3d0", "#3a0ca3", "#7209b7", "#b5179e", "#f72585", "#ff70a6" ],
      'Triadic': [ "#03045e", "#0077b6", "#00b4d8", "#90e0ef", "#d00000", "#f48c06", "#ffba08", "#38b000", "#70e000", "#ccff33" ],
      'Tetradic': [ "#181938", "#31a2ac", "#61e8e1", "#f25757", "#ff85a1", "#f2ae72", "#ffd166", "#5a189a", "#7b2cbf" ],
      'Double split-complementary': [ "#0c1b2a", "#1b3a4b", "#0077b6", "#00b4d8", "#e65100", "#f57c00", "#ffb703", "#fb8500", "#8338ec", "#3a0ca3" ],
      'Achromatic (Black & White)': [ "#000000", "#141414", "#2e2e2e", "#555555", "#888888", "#b8b8b8", "#e0e0e0", "#ffffff" ],
      'Achromatic + Accent (B&W + Red)': [ "#000000", "#141414", "#333333", "#666666", "#cccccc", "#ffffff", "#e60000", "#ff1a1a", "#990000" ],
      'Neutral + accent': [ "#141210", "#28231d", "#4a4237", "#7d7263", "#b5a895", "#ded6c9", "#f5f0e8", "#ffaa00", "#00f5d4" ],
      'Palette 12: F6AA1C, BC3908, 941B0C': [ "#F6AA1C", "#BC3908", "#941B0C", "#F6AA1C", "#220901" ],
      'Palette 13: 63D1CF, 5BC0BE, 4BAD9E': [ "#63D1CF", "#5BC0BE", "#4BAD9E", "#4BAD9E", "#0B132B", "#000000" ],
      'Palette 14: AA60C8, D69ADE, C9A3C6': [ "#AA60C8", "#D69ADE", "#C9A3C6", "#CFB5C2", "#0D001D", "#120A12" ],
      'Palette 15: FEF1BE, FFBA00, 008189': [ "#FEF1BE", "#FFBA00", "#008189", "#00474D", "#061210" ],
      'Palette 16: D4FFB0, 7FFF00, 00B894': [ "#D4FFB0", "#7FFF00", "#00B894", "#0A3322", "#05140A" ],
      'Palette 17: FFE8CC, FF8C00, C7501A': [ "#FFE8CC", "#FF8C00", "#C7501A", "#3D1050", "#0E0618" ],
      'Palette 18: E8E0FF, B38FFF, 6A3DE8': [ "#E8E0FF", "#B38FFF", "#6A3DE8", "#1A1250", "#090612" ],
      'Palette 19: E0FBFF, 00F0FF, D40078': [ "#E0FBFF", "#00F0FF", "#D40078", "#1E0A3D", "#05020F" ]
    };

    let palette;
    let basePairColors;
    let colorPool;
    let colorVariationCache = new Map();

    const PARAM_RANGES = {
      basePairCircleSize: [1.5, 3.5],
      sizeMult: [1.2, 2.5],
      noiseScale: [0.002, 0.04],
      baseStrength: [0.8, 1.8],
      lineLength: [100, 280],
      stepSize: [1.5, 5],
      seedSpacing: [40, 80],
      drawFraction: [0.6, 0.95],
      numZones: [5, 30],
      zoneRadius: [0.15, 0.42],
      zoneStrength: [1.5, 3.5],
      zoneMargin: 0.15,
      canvasMargin: [0.05, 0.1],
      helixSampleStep: [4, 20],
      torsion: [0.015, 0.08],
      helixRadius: [6, 14],
      dashLength: [18, 50],
      gapLength: [2, 10],
      radiusNoiseScale: [0.03, 0.08],
      rungSkipChance: [0.02, 0.1],
      numStrandStrokes: [4, 12],
      strandStrokeOffset: [1, 4],
      strandEndExtrapolation: [5, 40],
      strandEndExtrapolationPoints: [2, 20],
      numSploshCircles: [10, 20],
      sploshOffsetRange: [0.2, 0.9],
      sploshSizeVariation: [0.5, 1.3],
      sploshAlphaRange: [0.06, 0.22],
      backgroundGradientOpacity: [0.35, 0.75],
      frameWidth: [20, 50],
    };

    const ZONE_TYPES = [
      ["radial", 8],
      ["linear", 8],
      ["vortex", 8],
      ["dipole", 5],
      ["saddle", 5],
      ["noise", 4],
      ["sinusoidal", 5],
      ["bands", 5],
      ["flower", 3],
      ["spiral", 3],
      ["swirl", 3],
    ];

    // ============================================================
    // Global Interactive State & Settings
    // ============================================================
    const settings = {
      // Color Schemes (19 Schemes)
      colorScheme: 'Original',
      originalSubPaletteIndex: 0,

      // Animation & Motion
      animSpeed: 1.0,
      twistSpeed: 1.0,
      organicSway: 0.8,
      isPlaying: true,

      // Flow Field Dynamics
      baseStrength: 1.2,
      noiseScale: 0.015,
      stepSize: 3.5,
      numZones: 18,

      // DNA Geometry
      strandCount: 52,
      sizeMult: 1.6,
      helixRadius: 10.0,
      torsion: 0.04,
      strandDetail: 4,
      sploshParticles: 6,
      basePairCircleSize: 2.5,

      // Viewport & UX
      zoom: 1.0,
      clickToRandomize: true,

      // Actions
      regenerate: () => randomizeAll(true),
      resetView: () => resetCamera(),
      savePNG: () => saveCanvas('life_soup_dna_' + Date.now(), 'png')
    };

    let bgGraphics = null;
    let strands = [];

    // Camera Pan & Zoom Transform State
    let panX = 0, panY = 0;
    let targetPanX = 0, targetPanY = 0;
    let zoomLevel = 1.0, targetZoomLevel = 1.0;
    let isDragging = false;
    let hasDragged = false;
    let dragStartX = 0, dragStartY = 0;
    let startPanX = 0, startPanY = 0;

    let gui = null;

    // ============================================================
    // DNA Strand Class for Infinite Organic Motion
    // ============================================================
    class DNAStrand {
      constructor(x, y) {
        this.reset(x, y);
      }

      reset(x, y) {
        this.x = x !== undefined ? x : random(-width * 0.1, width * 1.1);
        this.y = y !== undefined ? y : random(-height * 0.1, height * 1.1);
        this.length = random(PARAM_RANGES.lineLength[0], PARAM_RANGES.lineLength[1]) * sizeMult;
        this.sampleStep = random(...PARAM_RANGES.helixSampleStep) * sizeMult;
        this.torsion = random(...PARAM_RANGES.torsion) / sizeMult;
        this.helixRadius = random(...PARAM_RANGES.helixRadius) * sizeMult;
        
        let pool = (colorPool && colorPool.length) ? colorPool : palette;
        this.strandColor = color(random(pool));
        
        this.speed = random(0.85, 1.6) * sizeMult;
        this.animPhase = random(TWO_PI);
        this.twistRate = random(0.8, 1.4);
        this.radiusNoiseScale = random(...PARAM_RANGES.radiusNoiseScale);
        this.radiusNoiseOffset = random(1000);
        this.numStrokes = floor(random(PARAM_RANGES.numStrandStrokes[0], min(8, PARAM_RANGES.numStrandStrokes[1])));
        this.rungSkipChance = random(...PARAM_RANGES.rungSkipChance);
        this.circleSize = random(...PARAM_RANGES.basePairCircleSize) * sizeMult;

        // Precalculated stable dash patterns
        this.dashes = makeRandomDash();

        // Precalculated stable splosh offsets for smooth non-jittering motion
        this.sploshData = [];
        let maxSplosh = 16;
        for (let i = 0; i < maxSplosh; i++) {
          this.sploshData.push({
            ox: random(-1, 1),
            oy: random(-1, 1),
            sizeMul: random(PARAM_RANGES.sploshSizeVariation[0], PARAM_RANGES.sploshSizeVariation[1])
          });
        }
      }

      update(dt, timeSec) {
        if (!settings.isPlaying || settings.animSpeed === 0) return;

        // Flow along the vector field
        let flow = getFlowField(this.x, this.y);
        let speed = this.speed * settings.animSpeed * dt;
        this.x += flow.x * speed;
        this.y += flow.y * speed;

        // Corkscrew helical rotation
        this.animPhase += settings.twistSpeed * this.twistRate * 0.05 * dt;

        // Seamless boundary wrap
        let m = max(width, height) * (canvasMargin * 3 + 0.15);
        if (this.x < -m) this.x = width + m - 10;
        else if (this.x > width + m) this.x = -m + 10;
        if (this.y < -m) this.y = height + m - 10;
        else if (this.y > height + m) this.y = -m + 10;
      }

      draw(timeSec) {
        let path = buildFullPath({ x: this.x, y: this.y }, this.length);
        if (!path || path.length < 2) return;

        drawAnimatedHelix(
          path, 
          this.sampleStep, 
          this.torsion, 
          this.helixRadius, 
          this.strandColor, 
          this.animPhase, 
          this.radiusNoiseScale, 
          this.radiusNoiseOffset,
          this.circleSize,
          this.rungSkipChance,
          this.dashes,
          this.sploshData,
          timeSec
        );
      }
    }

    // ============================================================
    // p5.js Core Lifecycle
    // ============================================================
    function setup() {
      const container = document.getElementById('canvas-container');
      const w = container.clientWidth || windowWidth;
      const h = container.clientHeight || windowHeight;

      let c = createCanvas(w, h);
      c.parent('canvas-container');
      pixelDensity(min(window.devicePixelRatio || 1, 2));

      bgGraphics = createGraphics(w, h);

      initColorPalette(settings.colorScheme);
      generateParameters();
      generateZones();
      rebuildBackground();
      initStrands();

      setupInteractions();
      buildGUI();
    }

    function draw() {
      // Camera smooth lerp
      panX += (targetPanX - panX) * 0.16;
      panY += (targetPanY - panY) * 0.16;
      zoomLevel += (targetZoomLevel - zoomLevel) * 0.16;

      let dt = min(deltaTime / 16.666, 2.5);
      let timeSec = millis() * 0.001;

      // Draw cached rich gradient background
      if (bgGraphics) {
        image(bgGraphics, 0, 0, width, height);
      } else {
        background(20);
      }

      // World Camera Transformation (Pan & Zoom)
      push();
      translate(width / 2 + panX, height / 2 + panY);
      scale(zoomLevel);
      translate(-width / 2, -height / 2);

      // Update and render all DNA strands in Life Soup
      for (let s of strands) {
        s.update(dt, timeSec);
        s.draw(timeSec);
      }

      pop();
    }

    function windowResized() {
      const container = document.getElementById('canvas-container');
      const w = container.clientWidth || windowWidth;
      const h = container.clientHeight || windowHeight;
      resizeCanvas(w, h);
      if (bgGraphics) {
        bgGraphics.resizeCanvas(w, h);
      }
      rebuildBackground();
    }

    // ============================================================
    // Flow Field & Procedural Math Algorithms
    // ============================================================
    function generateParameters() {
      sizeMult = random(...PARAM_RANGES.sizeMult);
      let r = random() ** 2;
      noiseScale = map(r, 0, 1, ...PARAM_RANGES.noiseScale);
      baseStrength = random(...PARAM_RANGES.baseStrength);
      stepSize = random(...PARAM_RANGES.stepSize) * sizeMult;
      seedSpacing = random(...PARAM_RANGES.seedSpacing) * sizeMult;
      canvasMargin = random(...PARAM_RANGES.canvasMargin);

      // Sync settings
      settings.sizeMult = sizeMult;
      settings.noiseScale = noiseScale;
      settings.baseStrength = baseStrength;
      settings.stepSize = stepSize;
    }

    function createZoneFn(type, cx, cy, radius) {
      switch (type) {
        case "sinusoidal": {
          let freq = random(0.008, 0.025);
          return (x, y) => ({
            x: sin((x - cx) * freq) * 1.5 + cos((y - cy) * freq) * 0.5,
            y: cos((x - cx) * freq) * 0.5 - sin((y - cy) * freq) * 1.5,
          });
        }
        case "linear": {
          let angle = random(TWO_PI);
          return (x, y) => ({ x: cos(angle), y: sin(angle) });
        }
        case "vortex": {
          let cw = random() < 0.5 ? 1 : -1;
          return (x, y) => {
            let dx = x - cx;
            let dy = y - cy;
            let r = sqrt(dx * dx + dy * dy) || 0.001;
            r = max(r, 10 * sizeMult);
            return { x: cw * (-dy / r), y: cw * (dx / r) };
          };
        }
        case "radial": {
          let outward = random() < 0.5 ? 1 : -1;
          return (x, y) => {
            let dx = x - cx;
            let dy = y - cy;
            let r = sqrt(dx * dx + dy * dy) || 0.001;
            return { x: outward * (dx / r), y: outward * (dy / r) };
          };
        }
        case "dipole": {
          let poleAngle = random(TWO_PI);
          let poleDirX = cos(poleAngle);
          let poleDirY = sin(poleAngle);
          const centerlineFalloff = 0.15;
          let fn = (x, y) => {
            let dx = x - cx;
            let dy = y - cy;
            let along = dx * poleDirX + dy * poleDirY;
            return {
              x: (along > 0 ? -1 : 1) * poleDirX,
              y: (along > 0 ? -1 : 1) * poleDirY,
            };
          };
          let attenuation = (x, y) => {
            if (!radius) return 1;
            let dx = x - cx;
            let dy = y - cy;
            let along = abs(dx * poleDirX + dy * poleDirY);
            let t = along / radius;
            return min(1, t / centerlineFalloff);
          };
          return { fn, attenuation };
        }
        case "saddle": {
          return (x, y) => {
            let dx = (x - cx) * 0.01;
            let dy = (y - cy) * 0.01;
            return { x: dx, y: -dy };
          };
        }
        case "noise": {
          let offset = random(1000);
          return (x, y) => {
            let angle =
              noise((x - cx) * 0.02 + offset, (y - cy) * 0.02 + offset) * TWO_PI * 2;
            return { x: cos(angle), y: sin(angle) };
          };
        }
        case "bands": {
          let bandDir = random() < 0.5 ? 0 : 1;
          let bandFreq = random(0.02, 0.06);
          return (x, y) => {
            let v =
              bandDir === 0 ? sin((y - cy) * bandFreq) : sin((x - cx) * bandFreq);
            if (bandDir === 0) return { x: v > 0 ? 1 : -1, y: 0 };
            return { x: 0, y: v > 0 ? 1 : -1 };
          };
        }
        case "flower": {
          let petals = int(random(3, 8));
          return (x, y) => {
            let dx = x - cx;
            let dy = y - cy;
            let r = sqrt(dx * dx + dy * dy) || 0.001;
            let theta = atan2(dy, dx);
            let petal = sin(theta * petals);
            return {
              x: (dx / r) * (petal > 0 ? 1 : -1),
              y: (dy / r) * (petal > 0 ? 1 : -1),
            };
          };
        }
        case "spiral": {
          let cw = random() < 0.5 ? 1 : -1;
          let pitch = random(0.01, 0.08);
          return (x, y) => {
            let dx = x - cx;
            let dy = y - cy;
            let r = sqrt(dx * dx + dy * dy) || 0.001;
            let theta = atan2(dy, dx);
            let spiralAngle = theta + cw * r * pitch;
            return { x: cos(spiralAngle), y: sin(spiralAngle) };
          };
        }
        case "swirl": {
          let sMix = random(0.3, 0.7);
          let cw = random() < 0.5 ? 1 : -1;
          return (x, y) => {
            let dx = x - cx;
            let dy = y - cy;
            let r = sqrt(dx * dx + dy * dy) || 0.001;
            let radialX = dx / r;
            let radialY = dy / r;
            let tangX = -dy / r;
            let tangY = dx / r;
            return {
              x: sMix * radialX + (1 - sMix) * cw * tangX,
              y: sMix * radialY + (1 - sMix) * cw * tangY,
            };
          };
        }
        default:
          return (x, y) => ({ x: 1, y: 0 });
      }
    }

    function weightedRandom(array) {
      let total = 0;
      for (let i = 0; i < array.length; i++) total += array[i][1];
      let r = random(total);
      for (let i = 0; i < array.length; i++) {
        if (r < array[i][1]) return array[i][0];
        r -= array[i][1];
      }
      return array[array.length - 1][0];
    }

    function generateZones() {
      zones = [];
      let m = PARAM_RANGES.zoneMargin;
      let minDim = min(width, height);
      let numZones = settings.numZones || int(random(...PARAM_RANGES.numZones));

      for (let i = 0; i < numZones; i++) {
        let cx = random(width * m, width * (1 - m));
        let cy = random(height * m, height * (1 - m));
        let radius = minDim * random(...PARAM_RANGES.zoneRadius) * sizeMult;
        let strength = random(...PARAM_RANGES.zoneStrength);
        let type = weightedRandom(ZONE_TYPES);

        let fnResult = createZoneFn(type, cx, cy, radius);
        let fn, attenuation;
        if (fnResult && typeof fnResult === "object" && fnResult.fn) {
          fn = fnResult.fn;
          attenuation = fnResult.attenuation;
        } else {
          fn = fnResult;
          attenuation = null;
        }
        zones.push({ cx, cy, radius, strength, type, fn, attenuation });
      }
    }

    function zoneWeight(x, y, zone) {
      let dx = x - zone.cx;
      let dy = y - zone.cy;
      let d = sqrt(dx * dx + dy * dy);
      if (d >= zone.radius) return 0;
      let t = d / zone.radius;
      return 1 - t * t;
    }

    function getFlowField(x, y) {
      let vx = 0;
      let vy = 0;
      let angle = noise(x * settings.noiseScale, y * settings.noiseScale) * TWO_PI * 2;
      vx += cos(angle) * settings.baseStrength;
      vy += sin(angle) * settings.baseStrength;

      for (let zone of zones) {
        let w = zoneWeight(x, y, zone);
        if (w > 0) {
          let att = zone.attenuation ? zone.attenuation(x, y) : 1;
          let v = zone.fn(x, y);
          let len = sqrt(v.x * v.x + v.y * v.y) || 1;
          vx += (v.x / len) * zone.strength * w * att;
          vy += (v.y / len) * zone.strength * w * att;
        }
      }

      let len = sqrt(vx * vx + vy * vy);
      if (len < 0.001) {
        vx = 1;
        vy = 0;
      } else {
        vx /= len;
        vy /= len;
      }
      return { x: vx, y: vy };
    }

    function traceLine(startX, startY, direction, length) {
      let path = [];
      let x = startX;
      let y = startY;
      let traveled = 0;
      let currentStep = settings.stepSize || (3.5 * sizeMult);

      while (traveled < length) {
        path.push({ x, y });
        let flow = getFlowField(x, y);
        let dx = flow.x * currentStep * direction;
        let dy = flow.y * currentStep * direction;
        x += dx;
        y += dy;
        traveled += currentStep;

        let m = max(width, height) * (1 + canvasMargin * 3);
        if (x < -m || x > width + m || y < -m || y > height + m) break;
      }
      return path;
    }

    function buildFullPath(seed, strandLength) {
      let halfLen = strandLength / 2;
      let pathBwd = traceLine(seed.x, seed.y, -1, halfLen);
      let pathFwd = traceLine(seed.x, seed.y, 1, halfLen);
      if (pathFwd.length < 2) return null;
      let path = [];
      for (let i = pathBwd.length - 1; i > 0; i--) path.push(pathBwd[i]);
      for (let p of pathFwd) path.push(p);
      return path;
    }

    function samplePathForHelix(pts, step) {
      let samples = [];
      let totalDist = 0;
      let nextSampleAt = 0;

      for (let i = 0; i < pts.length - 1; i++) {
        let a = pts[i];
        let b = pts[i + 1];
        let dx = b.x - a.x;
        let dy = b.y - a.y;
        let segLen = sqrt(dx * dx + dy * dy) || 0.001;
        let ux = dx / segLen;
        let uy = dy / segLen;

        let t = max(0, nextSampleAt - totalDist);
        while (t <= segLen) {
          let d = totalDist + t;
          samples.push({
            x: a.x + ux * t,
            y: a.y + uy * t,
            tangent: { x: ux, y: uy },
            dist: d,
          });
          nextSampleAt = d + step;
          t = nextSampleAt - totalDist;
        }
        totalDist += segLen;
      }
      return samples;
    }

    // ============================================================
    // Color Variations & Chromatic Synthesis
    // ============================================================
    function initColorPalette(schemeKey) {
      if (schemeKey === 'Original') {
        palette = ORIGINAL_PALETTES[settings.originalSubPaletteIndex % ORIGINAL_PALETTES.length];
      } else {
        palette = COLOR_SCHEMES[schemeKey] || ORIGINAL_PALETTES[0];
      }

      let shuffled = [...palette];
      shuffle(shuffled, true);
      let chosen = shuffled.slice(0, min(4, shuffled.length));
      basePairColors =
        chosen.length >= 4
          ? [
              [color(chosen[0]), color(chosen[1])],
              [color(chosen[2]), color(chosen[3])],
            ]
          : chosen.length >= 2
            ? [[color(chosen[0]), color(chosen[1])]]
            : [[color(chosen[0]), color(chosen[0])]];
      colorPool = shuffled.slice(min(4, shuffled.length));

      colorVariationCache.clear();
      for (let h of palette) {
        buildColorVariations(h);
        buildSploshColorVariations(h);
      }
    }

    function buildColorVariations(hex) {
      if (colorVariationCache.has(hex)) return colorVariationCache.get(hex);
      let variations = [];
      let base = chroma(hex);
      let n = 28;
      for (let i = 0; i < n; i++) {
        let h = base.get("hsl.h");
        let c = base
          .alpha(0.2 + random(0.5))
          .darken(random(0.3))
          .brighten(random(0.2))
          .saturate(random(0.4))
          .desaturate(random(0.3))
          .set("hsl.h", (h + random(-25, 25)) % 360);
        variations.push(c.css("rgba"));
      }
      colorVariationCache.set(hex, variations);
      return variations;
    }

    function getStrandStrokeColor(baseColor) {
      let h = chroma(red(baseColor), green(baseColor), blue(baseColor)).hex();
      let variations = buildColorVariations(h);
      return color(random(variations));
    }

    function buildSploshColorVariations(hex) {
      let k = hex + "_splosh";
      if (colorVariationCache.has(k)) return colorVariationCache.get(k);
      let [alphaMin, alphaMax] = PARAM_RANGES.sploshAlphaRange;
      let variations = [];
      let base = chroma(hex);
      let n = 20;
      for (let i = 0; i < n; i++) {
        let c = base
          .alpha(alphaMin + random(alphaMax - alphaMin))
          .darken(random(0.2))
          .brighten(random(0.15))
          .saturate(random(0.2))
          .desaturate(random(0.25));
        variations.push(c.css("rgba"));
      }
      colorVariationCache.set(k, variations);
      return variations;
    }

    function getSploshColor(baseColor) {
      let h = chroma(red(baseColor), green(baseColor), blue(baseColor)).hex();
      let variations = buildSploshColorVariations(h);
      return color(random(variations));
    }

    // ============================================================
    // Generative Painting & DNA Helix Rendering
    // ============================================================
    function rebuildBackground() {
      if (!bgGraphics) return;
      let ctx = bgGraphics.drawingContext;
      bgGraphics.background(220);

      let n = floor(random(1, 5));
      let shuffled = [...palette];
      shuffle(shuffled, true);

      for (let i = 0; i < n; i++) {
        let numColors = max(2, min(floor(random(3, 7)), shuffled.length));
        let picked = shuffle([...shuffled]).slice(0, numColors);
        let colors = [];
        for (let j = 0; j < numColors; j++) {
          let c = chroma(picked[j])
            .desaturate(random(1, 2))
            .brighten(random(0.4, 0.7))
            .alpha(random(...PARAM_RANGES.backgroundGradientOpacity));
          colors.push(c.css("rgba"));
        }
        let angle = random(TWO_PI);
        let d = max(width, height) * 1.5;
        let x0 = width / 2 + cos(angle) * d;
        let y0 = height / 2 + sin(angle) * d;
        let x1 = width / 2 - cos(angle) * d;
        let y1 = height / 2 - sin(angle) * d;
        let grad = ctx.createLinearGradient(x0, y0, x1, y1);
        for (let j = 0; j < colors.length; j++) {
          grad.addColorStop(j / (colors.length - 1), colors[j]);
        }
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, width, height);
      }
    }

    function initStrands() {
      strands = [];
      let count = settings.strandCount;
      let marginX = width * canvasMargin;
      let marginY = height * canvasMargin;

      for (let i = 0; i < count; i++) {
        let sx = random(-marginX, width + marginX);
        let sy = random(-marginY, height + marginY);
        strands.push(new DNAStrand(sx, sy));
      }
    }

    function extrapolateStrandEnds(points) {
      if (points.length < 2) return points;
      let totalExtent = random(...PARAM_RANGES.strandEndExtrapolation) * sizeMult;
      let nExtrap = floor(random(...PARAM_RANGES.strandEndExtrapolationPoints));
      let result = [...points];

      let dx0 = points[1].x - points[0].x;
      let dy0 = points[1].y - points[0].y;
      let len0 = sqrt(dx0 * dx0 + dy0 * dy0) || 0.001;
      let step0 = totalExtent / nExtrap;
      let perp0x = -dy0 / len0;
      let perp0y = dx0 / len0;
      for (let i = nExtrap; i >= 1; i--) {
        let d = step0 * i;
        let wander = random(-2, 2) * sizeMult;
        result.unshift({
          x: points[0].x - (dx0 / len0) * d + perp0x * wander,
          y: points[0].y - (dy0 / len0) * d + perp0y * wander,
        });
      }

      let dx1 = points[points.length - 1].x - points[points.length - 2].x;
      let dy1 = points[points.length - 1].y - points[points.length - 2].y;
      let len1 = sqrt(dx1 * dx1 + dy1 * dy1) || 0.001;
      let step1 = totalExtent / nExtrap;
      let perp1x = -dy1 / len1;
      let perp1y = dx1 / len1;
      let last = points[points.length - 1];
      for (let i = 1; i <= nExtrap; i++) {
        let d = step1 * i;
        let wander = random(-2, 2) * sizeMult;
        result.push({
          x: last.x + (dx1 / len1) * d + perp1x * wander,
          y: last.y + (dy1 / len1) * d + perp1y * wander,
        });
      }
      return result;
    }

    function makeRandomDash() {
      let dash = [];
      for (let i = 0; i < 10; i++) {
        let n = random(2, 5) * sizeMult;
        if (i % 2 === 0) {
          dash.push(n * random(2, 3));
        } else {
          dash.push(n);
        }
      }
      return dash;
    }

    function makeDottedDash() {
      let n = floor(random(2, 5));
      let dash = [];
      for (let i = 0; i < n; i++) {
        dash.push(random(0.8, 2.5) * sizeMult);
        dash.push(random(2, 6) * sizeMult);
      }
      return dash;
    }

    function drawStylizedStrand(points, baseColor, dashes, timeSec, strandIndex) {
      if (points.length < 2) return;
      points = extrapolateStrandEnds(points);
      let numStrokes = min(settings.strandDetail, 8);
      let maxOffset = random(...PARAM_RANGES.strandStrokeOffset) * sizeMult;

      for (let i = 0; i < numStrokes; i++) {
        let strokeOffset = (i - numStrokes / 2) * (maxOffset / numStrokes) * 1.5;
        let sway = sin(timeSec * 2.5 + i * 1.2 + strandIndex) * settings.organicSway * sizeMult * 0.4;
        let offsetPoints = [];

        for (let j = 0; j < points.length; j++) {
          let prev = points[max(0, j - 1)];
          let next = points[min(points.length - 1, j + 1)];
          let tx = next.x - prev.x;
          let ty = next.y - prev.y;
          let len = sqrt(tx * tx + ty * ty) || 0.001;
          let perpX = -ty / len;
          let perpY = tx / len;
          offsetPoints.push({
            x: points[j].x + perpX * (strokeOffset + sway),
            y: points[j].y + perpY * (strokeOffset + sway)
          });
        }

        stroke(getStrandStrokeColor(baseColor));
        strokeWeight(max(0.3, 0.85 * sizeMult));
        drawingContext.setLineDash(dashes);
        drawingContext.lineCap = "round";
        beginShape();
        for (let p of offsetPoints) {
          splineVertex(p.x, p.y);
        }
        endShape();
      }
    }

    function drawAnimatedSplosh(cx, cy, baseColor, baseSize, sploshData, nodeIndex, timeSec) {
      let count = min(settings.sploshParticles, sploshData.length);
      let offsetMax = 0.55 * baseSize;
      let breathe = 1.0 + 0.12 * sin(timeSec * 3.0 + nodeIndex * 0.8);
      noStroke();

      for (let i = 0; i < count; i++) {
        let item = sploshData[i];
        let ox = item.ox * offsetMax;
        let oy = item.oy * offsetMax;
        let r = baseSize * item.sizeMul * 0.5 * breathe;
        fill(getSploshColor(baseColor));
        circle(cx + ox, cy + oy, r * 2);
      }
    }

    function drawAnimatedHelix(
      path, 
      sampleStep, 
      torsion, 
      helixRadius, 
      strandColor, 
      animPhase, 
      radiusNoiseScale, 
      radiusNoiseOffset,
      circleSize,
      rungSkipChance,
      dashes,
      sploshData,
      timeSec
    ) {
      let samples = samplePathForHelix(path, sampleStep);
      if (samples.length < 2) return;

      let strand1 = [];
      let strand2 = [];

      for (let s of samples) {
        let perpX = -s.tangent.y;
        let perpY = s.tangent.x;
        // 3D double-helical coiling equation with real-time phase twist
        let phase = s.dist * torsion * TWO_PI + animPhase;
        let radiusMul = 0.8 + 0.4 * noise(s.dist * radiusNoiseScale + radiusNoiseOffset);
        let offset = helixRadius * radiusMul * cos(phase);

        strand1.push({ x: s.x + perpX * offset, y: s.y + perpY * offset });
        strand2.push({ x: s.x - perpX * offset, y: s.y - perpY * offset });
      }

      noFill();

      // Draw stylized fibrous outer strands
      drawStylizedStrand(strand1, strandColor, dashes, timeSec, 0);
      drawStylizedStrand(strand2, strandColor, dashes, timeSec, 1);

      // Draw Base Pair Splosh Clouds
      if (settings.sploshParticles > 0) {
        let cSize = settings.basePairCircleSize * sizeMult;
        for (let i = 0; i < strand1.length; i++) {
          if (i === 0 || i === strand1.length - 1) continue;
          if ((i % 5 === 0) && random() < rungSkipChance) continue;
          let pair = basePairColors[i % basePairColors.length];
          drawAnimatedSplosh(strand1[i].x, strand1[i].y, pair[0], cSize, sploshData, i, timeSec);
          drawAnimatedSplosh(strand2[i].x, strand2[i].y, pair[1], cSize, sploshData, i + 1, timeSec);
        }
      }

      // Draw Dotted Base Pair Rungs
      strokeWeight(1 * sizeMult);
      drawingContext.lineCap = "round";
      for (let i = 0; i < strand1.length; i++) {
        if (i === 0 || i === strand1.length - 1) continue;
        if ((i % 7 === 0) && random() < rungSkipChance) continue;
        let pair = basePairColors[i % basePairColors.length];
        let rungColor = pair[i % pair.length];
        stroke(red(rungColor), green(rungColor), blue(rungColor), 140);
        drawingContext.setLineDash(makeDottedDash());
        line(strand1[i].x, strand1[i].y, strand2[i].x, strand2[i].y);
      }
    }

    // ============================================================
    // Randomization & Theme Generation
    // ============================================================
    function randomizeAll(newTheme = true) {
      if (newTheme) {
        let schemeKeys = Object.keys(COLOR_SCHEMES);
        let pickedScheme = random(schemeKeys);
        settings.colorScheme = pickedScheme;
        if (pickedScheme === 'Original') {
          settings.originalSubPaletteIndex = floor(random(ORIGINAL_PALETTES.length));
        }
      }

      generateParameters();
      generateZones();
      initColorPalette(settings.colorScheme);
      rebuildBackground();
      initStrands();

      if (gui) {
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      }
    }

    function resetCamera() {
      targetPanX = 0;
      targetPanY = 0;
      targetZoomLevel = 1.0;
      settings.zoom = 1.0;
      if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    // ============================================================
    // Interactive Gestures (Wheel Zoom & Drag Pan)
    // ============================================================
    function setupInteractions() {
      const container = document.getElementById('canvas-container');

      // Wheel Zoom Centered on Mouse Cursor
      window.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
        const mouseX = e.clientX;
        const mouseY = e.clientY;

        const newZoom = Math.min(Math.max(targetZoomLevel * zoomFactor, 0.2), 8.0);
        const worldX = (mouseX - (width / 2 + targetPanX)) / targetZoomLevel;
        const worldY = (mouseY - (height / 2 + targetPanY)) / targetZoomLevel;

        targetZoomLevel = newZoom;
        settings.zoom = newZoom;
        targetPanX = mouseX - width / 2 - worldX * targetZoomLevel;
        targetPanY = mouseY - height / 2 - worldY * targetZoomLevel;

        if (gui) {
          let zoomCtrl = gui.controllersRecursive().find(c => c.property === 'zoom');
          if (zoomCtrl) zoomCtrl.updateDisplay();
        }
      }, { passive: false });

      // Drag to Pan & Click to Randomize
      window.addEventListener('pointerdown', (e) => {
        if (e.target.closest('.lil-gui')) return;
        isDragging = true;
        hasDragged = false;
        dragStartX = e.clientX;
        dragStartY = e.clientY;
        startPanX = targetPanX;
        startPanY = targetPanY;
      });

      window.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        const dx = e.clientX - dragStartX;
        const dy = e.clientY - dragStartY;
        if (Math.hypot(dx, dy) > 5) {
          hasDragged = true;
        }
        targetPanX = startPanX + dx;
        targetPanY = startPanY + dy;
      });

      window.addEventListener('pointerup', (e) => {
        if (!isDragging) return;
        isDragging = false;
        if (!hasDragged && !e.target.closest('.lil-gui')) {
          // Clean Click detected on canvas: if enabled, randomly regenerate theme & geometry!
          if (settings.clickToRandomize) {
            randomizeAll(true);
          }
        }
      });

      // Keyboard Shortcuts (No on-screen instructions required)
      window.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT') return;
        if (e.code === 'Space') {
          e.preventDefault();
          settings.isPlaying = !settings.isPlaying;
          if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
        } else if (e.code === 'KeyR') {
          e.preventDefault();
          randomizeAll(true);
        } else if (e.code === 'KeyC') {
          e.preventDefault();
          let keys = Object.keys(COLOR_SCHEMES);
          let nextIdx = (keys.indexOf(settings.colorScheme) + 1) % keys.length;
          settings.colorScheme = keys[nextIdx];
          initColorPalette(settings.colorScheme);
          rebuildBackground();
          if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
        } else if (e.code === 'KeyF') {
          e.preventDefault();
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(() => {});
          } else {
            document.exitFullscreen().catch(() => {});
          }
        } else if (e.code === 'KeyZ') {
          e.preventDefault();
          resetCamera();
        }
      });
    }

    // ============================================================
    // lil-gui Control Panel Construction
    // ============================================================
    function buildGUI() {
      gui = new lil.GUI({ title: 'Life Soup // Evolution' });

      // Folder 1: Color Themes (19 Curated Schemes)
      const fTheme = gui.addFolder('Color Schemes (19 Schemes)');
      fTheme.add(settings, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Palette Scheme').onChange((v) => {
        initColorPalette(v);
        rebuildBackground();
      });
      fTheme.add(settings, 'clickToRandomize').name('Click Scene to Roll');
      fTheme.add(settings, 'regenerate').name('🎲 Randomize Scene');

      // Folder 2: Motion & Simulation Speed
      const fAnim = gui.addFolder('Motion & Flow Dynamics');
      fAnim.add(settings, 'animSpeed', 0.0, 3.0, 0.05).name('Animation Speed');
      fAnim.add(settings, 'twistSpeed', 0.0, 3.0, 0.05).name('Helical Twist Speed');
      fAnim.add(settings, 'organicSway', 0.0, 2.0, 0.05).name('Organic Sway');
      fAnim.add(settings, 'isPlaying').name('Simulating');

      // Folder 3: Flow Field & Microscopic Currents
      const fFlow = gui.addFolder('Flow Field Vector Grid');
      fFlow.add(settings, 'baseStrength', 0.4, 2.5, 0.1).name('Base Current');
      fFlow.add(settings, 'noiseScale', 0.002, 0.04, 0.001).name('Noise Frequency');
      fFlow.add(settings, 'numZones', 5, 35, 1).name('Vector Vortices').onChange(() => {
        generateZones();
      });
      fFlow.add({ reseedZones: () => generateZones() }, 'reseedZones').name('Reseed Vortices');

      // Folder 4: DNA Molecular Geometry
      const fDNA = gui.addFolder('DNA Helix Parameters');
      fDNA.add(settings, 'strandCount', 15, 100, 1).name('Strand Density').onChange(() => {
        initStrands();
      });
      fDNA.add(settings, 'sizeMult', 0.8, 2.6, 0.1).name('Global Scale').onChange(() => {
        initStrands();
      });
      fDNA.add(settings, 'helixRadius', 4.0, 24.0, 0.5).name('Helix Width');
      fDNA.add(settings, 'strandDetail', 1, 8, 1).name('Fiber Strokes');
      fDNA.add(settings, 'sploshParticles', 0, 12, 1).name('Splosh Droplets');
      fDNA.add(settings, 'basePairCircleSize', 1.0, 5.0, 0.2).name('Base Pair Radius');

      // Folder 5: Camera & Viewport
      const fView = gui.addFolder('Camera & Viewport');
      fView.add({ toggleFullscreen: () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      }}, 'toggleFullscreen').name('Fullscreen (F)');
      fView.add(settings, 'zoom', 0.2, 5.0, 0.05).name('Zoom Level').onChange((v) => {
        targetZoomLevel = v;
      });
      fView.add(settings, 'resetView').name('Reset Camera (Z)');
      fView.add(settings, 'savePNG').name('Export Artwork (PNG)');

      // Initial state: close secondary folders for clean view
      fFlow.close();
      fDNA.close();
      fView.close();
    }
  </script>
</body>
</html>
