<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />
  <title>Enter to Other Dimension</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000000;
      user-select: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .lil-gui {
      --width: 310px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
  </style>
</head>
<body>
  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";
    import GUI from "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js";

    // ============================================================
    // SVG File Loader Setup
    // ============================================================

    const fileInput = document.createElement("input");
    fileInput.type = "file";
    fileInput.accept = ".svg";
    fileInput.style.display = "none";
    document.body.appendChild(fileInput);

    const svgCanvas = document.createElement("canvas");
    svgCanvas.width = 512;
    svgCanvas.height = 512;
    const svgCtx = svgCanvas.getContext("2d");

    // Default blank dummy texture for shader
    const dummyCanvas = document.createElement("canvas");
    dummyCanvas.width = 1;
    dummyCanvas.height = 1;
    const dummyCtx = dummyCanvas.getContext("2d");
    dummyCtx.fillStyle = "#ffffff";
    dummyCtx.fillRect(0, 0, 1, 1);
    const dummyTexture = new THREE.CanvasTexture(dummyCanvas);

    let activeSVGTexture = dummyTexture;

    // ============================================================
    // Scene parameters
    // ============================================================

    const params = {
      // General & Greenscreen
      greenscreen: false,
      greenscreenThreshold: 0.15,
      dpr: window.devicePixelRatio || 1.0,
      speedFactor: 1.0,

      // Interactive Zoom & Drag
      zoom: 1.0,
      panX: 0.0,
      panY: 0.0,

      // Presets
      preset: "Preset 1",
      colorScheme: "Cosmic Neon",
      animationPreset: "Hyper Warp",

      // Render configuration
      traceStepCount: 50,
      traceStartIndex: 30,
      domainLayerCount: 3,

      // Scene
      initialDepth: 1.46,
      safeMinimum: 0.0001,

      // Animation
      fieldTimeRate: 0.10,
      forwardTravelRate: 0.23,

      // Domain
      domainStrength: 1.69,
      domainScale: 3.84,
      domainAttenuation: 3.86,

      // Camera
      cameraFocalLength: 0.22,

      // Field
      fieldSlope: -0.10,
      fieldDetailScale: 4.60,

      // Distance
      distanceBase: 2.60,
      distanceDepthFactor: 0.45,

      // Tone mapping
      exposureScale: 2000.0,

      // Custom Color Palette Controls
      colorMode: 1.0, // 0 = original shader palette, 1 = custom cosine palette
      colorA: [0.5, 0.5, 0.5],
      colorB: [0.5, 0.5, 0.5],
      colorC: [1.0, 1.0, 1.0],
      colorD: [0.0, 0.33, 0.67],

      // SVG Form
      useSVG: false,
      svgScale: 1.0,
      uploadSVG: () => fileInput.click(),

      reset: () => resetParameters()
    };

    // 5 Preset Color Schemes
    const colorSchemes = {
      "Original Shader": {
        colorMode: 0.0,
        colorA: [0.5, 0.5, 0.5],
        colorB: [0.5, 0.5, 0.5],
        colorC: [1.0, 1.0, 1.0],
        colorD: [0.0, 0.0, 0.0]
      },
      "Cosmic Neon": {
        colorMode: 1.0,
        colorA: [0.5, 0.5, 0.5],
        colorB: [0.5, 0.5, 0.5],
        colorC: [1.0, 1.0, 1.0],
        colorD: [0.0, 0.33, 0.67]
      },
      "Hyper Gold": {
        colorMode: 1.0,
        colorA: [0.5, 0.5, 0.5],
        colorB: [0.5, 0.5, 0.5],
        colorC: [1.0, 1.0, 0.5],
        colorD: [0.0, 0.1, 0.2]
      },
      "Toxic Emerald": {
        colorMode: 1.0,
        colorA: [0.5, 0.5, 0.5],
        colorB: [0.5, 0.5, 0.5],
        colorC: [0.8, 1.0, 0.8],
        colorD: [0.3, 0.2, 0.8]
      },
      "Spectral Prism": {
        colorMode: 1.0,
        colorA: [0.8, 0.5, 0.4],
        colorB: [0.2, 0.4, 0.2],
        colorC: [2.0, 1.0, 1.0],
        colorD: [0.0, 0.25, 0.25]
      },
      "Abyssal Void": {
        colorMode: 1.0,
        colorA: [0.5, 0.5, 0.5],
        colorB: [0.5, 0.5, 0.5],
        colorC: [1.0, 1.0, 1.0],
        colorD: [0.5, 0.6, 0.7]
      }
    };

    // 5 Preset Animations + Static
    const animationPresets = {
      "Hyper Warp": {
        fieldTimeRate: 0.10,
        forwardTravelRate: 0.23,
        domainStrength: 1.69,
        fieldSlope: -0.10
      },
      "Dimensional Spiral": {
        fieldTimeRate: 0.25,
        forwardTravelRate: 0.15,
        domainStrength: 2.20,
        fieldSlope: 0.35
      },
      "Cosmic Breathing": {
        fieldTimeRate: 0.05,
        forwardTravelRate: 0.08,
        domainStrength: 3.10,
        fieldSlope: -0.05
      },
      "Quantum Drift": {
        fieldTimeRate: 0.35,
        forwardTravelRate: -0.18,
        domainStrength: 1.20,
        fieldSlope: -0.45
      },
      "Abyssal Flow": {
        fieldTimeRate: 0.03,
        forwardTravelRate: 0.45,
        domainStrength: 2.80,
        fieldSlope: 0.15
      },
      "Static": {
        fieldTimeRate: 0.0,
        forwardTravelRate: 0.0,
        domainStrength: 1.69,
        fieldSlope: -0.10
      }
    };

    const presets = {
      "Preset 1": {
        initialDepth: 1.46,
        safeMinimum: 0.0001,
        fieldTimeRate: 0.10,
        forwardTravelRate: 0.23,
        domainStrength: 1.69,
        domainScale: 3.84,
        domainAttenuation: 3.86,
        cameraFocalLength: 0.22,
        fieldSlope: -0.10,
        fieldDetailScale: 4.60,
        distanceBase: 2.60,
        distanceDepthFactor: 0.45,
        exposureScale: 2000.0,
        dpr: 1.0
      },

      "Preset 2": {
        initialDepth: 3.044,
        safeMinimum: 0.000001,
        fieldTimeRate: 0.10,
        forwardTravelRate: 0.351,
        domainStrength: 2.652,
        domainScale: 3.362,
        domainAttenuation: 3.194,
        cameraFocalLength: 0.321,
        fieldSlope: -0.459,
        fieldDetailScale: 2.276,
        distanceBase: 2.322,
        distanceDepthFactor: 0.515,
        exposureScale: 1673.0,
        dpr: 2.0
      }
    };

    // ============================================================
    // Renderer
    // ============================================================

    const renderer = new THREE.WebGLRenderer({
      antialias: false,
      alpha: false,
      powerPreference: "high-performance"
    });

    renderer.setPixelRatio(params.dpr);
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    renderer.setClearColor(0x000000, 1);
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    document.body.appendChild(renderer.domElement);

    // ============================================================
    // Scene and camera
    // ============================================================

    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

    // ============================================================
    // Fullscreen shader
    // ============================================================

    const uniforms = {
      uResolution: { value: new THREE.Vector2(1, 1) },
      uTime: { value: 0 },

      uZoom: { value: params.zoom },
      uPanOffset: { value: new THREE.Vector2(params.panX, params.panY) },

      uInitialDepth: { value: params.initialDepth },
      uSafeMinimum: { value: params.safeMinimum },

      uFieldTimeRate: { value: params.fieldTimeRate },
      uForwardTravelRate: { value: params.forwardTravelRate },

      uDomainStrength: { value: params.domainStrength },
      uDomainScale: { value: params.domainScale },
      uDomainAttenuation: { value: params.domainAttenuation },

      uCameraFocalLength: { value: params.cameraFocalLength },

      uFieldSlope: { value: params.fieldSlope },
      uFieldDetailScale: { value: params.fieldDetailScale },

      uDistanceBase: { value: params.distanceBase },
      uDistanceDepthFactor: { value: params.distanceDepthFactor },

      uExposureScale: { value: params.exposureScale },

      uGreenscreen: { value: 0.0 },
      uGreenscreenThreshold: { value: params.greenscreenThreshold },

      uColorMode: { value: 1.0 },
      uPaletteA: { value: new THREE.Vector3(...params.colorA) },
      uPaletteB: { value: new THREE.Vector3(...params.colorB) },
      uPaletteC: { value: new THREE.Vector3(...params.colorC) },
      uPaletteD: { value: new THREE.Vector3(...params.colorD) },

      uSVGTexture: { value: activeSVGTexture },
      uUseSVG: { value: 0.0 },
      uSVGScale: { value: params.svgScale }
    };

    const vertexShader = /* glsl */ `
      void main() {
        gl_Position = vec4(position, 1.0);
      }
    `;

    const fragmentShader = /* glsl */ `
      precision highp float;
      precision highp int;

      uniform vec2 uResolution;
      uniform float uTime;

      uniform float uZoom;
      uniform vec2 uPanOffset;

      uniform float uInitialDepth;
      uniform float uSafeMinimum;

      uniform float uFieldTimeRate;
      uniform float uForwardTravelRate;

      uniform float uDomainStrength;
      uniform float uDomainScale;
      uniform float uDomainAttenuation;

      uniform float uCameraFocalLength;

      uniform float uFieldSlope;
      uniform float uFieldDetailScale;

      uniform float uDistanceBase;
      uniform float uDistanceDepthFactor;

      uniform float uExposureScale;

      uniform float uGreenscreen;
      uniform float uGreenscreenThreshold;

      uniform float uColorMode;
      uniform vec3 uPaletteA;
      uniform vec3 uPaletteB;
      uniform vec3 uPaletteC;
      uniform vec3 uPaletteD;

      uniform sampler2D uSVGTexture;
      uniform float uUseSVG;
      uniform float uSVGScale;

      const int TRACE_STEP_COUNT = 50;
      const int TRACE_START_INDEX = 30;
      const int DOMAIN_LAYER_COUNT = 3;

      vec2 getScreenCoordinates(vec2 fragCoord) {
        vec2 viewport = max(uResolution, vec2(1.0));
        vec2 p = (2.0 * fragCoord - viewport) / viewport.y;
        return (p - uPanOffset) / uZoom;
      }

      vec3 getViewRay(vec2 screenPosition) {
        return normalize(
          vec3(screenPosition, uCameraFocalLength)
        );
      }

      vec3 deformDomain(
        vec3 samplePosition,
        float depth,
        float timeValue,
        float tracePhase
      ) {
        vec3 warpedPosition = samplePosition;

        for (int layerIndex = 0; layerIndex < DOMAIN_LAYER_COUNT; ++layerIndex) {
          float octave = float(layerIndex + 2);
          float frequency = octave * uDomainScale;
          float attenuation = octave + uDomainAttenuation;

          vec3 phase =
            warpedPosition.yzx * frequency
            - depth
            + timeValue
            + tracePhase;

          warpedPosition +=
            sin(phase) *
            (uDomainStrength / attenuation);
        }

        return warpedPosition;
      }

      float evaluateFieldDistance(
        vec3 warpedPosition,
        float localDepth,
        float rayDepth,
        vec2 screenPosition
      ) {
        float primaryShape = abs(
          warpedPosition.y +
          localDepth * uFieldSlope
        );

        vec3 secondaryShape =
          sin(warpedPosition - rayDepth) /
          uFieldDetailScale;

        vec4 fieldVector = vec4(
          primaryShape,
          secondaryShape
        );

        float depthNormalization =
          uDistanceBase +
          rayDepth * rayDepth * uDistanceDepthFactor;

        float dist = max(
          length(fieldVector) / depthNormalization,
          uSafeMinimum
        );

        if (uUseSVG > 0.5) {
          vec2 svgUV = (screenPosition / uSVGScale) * 0.5 + 0.5;
          if (svgUV.x >= 0.0 && svgUV.x <= 1.0 && svgUV.y >= 0.0 && svgUV.y <= 1.0) {
            vec4 svgCol = texture2D(uSVGTexture, svgUV);
            float svgMask = smoothstep(0.1, 0.9, svgCol.a * (1.0 - svgCol.r * 0.5));
            dist *= (0.3 + 0.7 * svgMask);
          } else {
            dist *= 2.5;
          }
        }

        return dist;
      }

      vec3 getTracePalette(float tracePhase) {
        if (uColorMode > 0.5) {
          return uPaletteA + uPaletteB * cos(6.28318 * (uPaletteC * tracePhase * 0.05 + uPaletteD));
        }
        return 0.9 + sin(tracePhase * 1.3 - vec3(4.8, -0.4, 1.2));
      }

      vec3 accumulateLight(
        vec3 palette,
        float fieldDistance,
        float rayDepth
      ) {
        float safeDepth = max(
          rayDepth,
          uInitialDepth
        );

        float densityDenominator = max(
          fieldDistance *
          fieldDistance *
          safeDepth,
          uSafeMinimum
        );

        vec3 concentratedLight =
          palette / densityDenominator;

        vec3 depthGlow =
          fieldDistance *
          rayDepth /
          vec3(1.000, 0.812, 0.600);

        return concentratedLight + depthGlow;
      }

      vec3 applyToneMapping(vec3 hdrColor) {
        vec3 value = clamp(
          hdrColor / uExposureScale,
          vec3(-10.0),
          vec3(10.0)
        );

        vec3 exponentialValue = exp(
          2.0 * value
        );

        vec3 mappedColor =
          (exponentialValue - 1.0) /
          max(
            exponentialValue + 1.0,
            vec3(uSafeMinimum)
          );

        return clamp(
          mappedColor,
          0.0,
          1.0
        );
      }

      void mainImage(out vec4 fragColor, in vec2 fragCoord) {
        vec2 screenPosition =
          getScreenCoordinates(fragCoord);

        vec3 rayDirection =
          getViewRay(screenPosition);

        float fieldTime =
          uTime * uFieldTimeRate;

        float cameraTravel =
          uTime * uForwardTravelRate;

        float rayDepth = uInitialDepth;
        vec3 accumulatedColor = vec3(0.0);

        for (
          int traceIndex = TRACE_START_INDEX;
          traceIndex < TRACE_STEP_COUNT;
          ++traceIndex
        ) {
          float tracePhase =
            float(traceIndex) + 13.0;

          vec3 rayPosition =
            rayDirection * rayDepth;

          vec3 travelingPosition = rayPosition;
          travelingPosition.z += cameraTravel;

          vec3 warpedPosition = deformDomain(
            travelingPosition,
            rayDepth,
            fieldTime,
            tracePhase
          );

          float localDepth =
            warpedPosition.z -
            cameraTravel;

          float fieldDistance =
            evaluateFieldDistance(
              warpedPosition,
              localDepth,
              rayDepth,
              screenPosition
            );

          vec3 palette =
            getTracePalette(tracePhase);

          accumulatedColor += accumulateLight(
            palette,
            fieldDistance,
            rayDepth
          );

          rayDepth += fieldDistance;
        }

        vec3 finalColor =
          applyToneMapping(accumulatedColor);

        if (uGreenscreen > 0.5) {
          float lum = dot(finalColor, vec3(0.299, 0.587, 0.114));
          if (lum < uGreenscreenThreshold) {
            finalColor = vec3(0.0, 1.0, 0.0);
          }
        }

        fragColor = vec4(finalColor, 1.0);
      }

      void main() {
        mainImage(gl_FragColor, gl_FragCoord.xy);
      }
    `;

    const material = new THREE.ShaderMaterial({
      uniforms,
      vertexShader,
      fragmentShader,
      depthTest: false,
      depthWrite: false
    });

    const geometry = new THREE.PlaneGeometry(2, 2);
    const fullscreenQuad = new THREE.Mesh(geometry, material);
    fullscreenQuad.frustumCulled = false;
    scene.add(fullscreenQuad);

    // ============================================================
    // SVG Upload Logic
    // ============================================================

    fileInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            svgCtx.clearRect(0, 0, 512, 512);
            svgCtx.drawImage(img, 0, 0, 512, 512);
            activeSVGTexture = new THREE.CanvasTexture(svgCanvas);
            activeSVGTexture.needsUpdate = true;

            uniforms.uSVGTexture.value = activeSVGTexture;
            params.useSVG = true;
            uniforms.uUseSVG.value = 1.0;
            refreshGui();
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    // ============================================================
    // Mouse Wheel Zoom & Drag Controls
    // ============================================================

    let isDragging = false;
    let previousPointerPosition = { x: 0, y: 0 };

    window.addEventListener("wheel", (e) => {
      if (e.target.closest(".lil-gui")) return;
      e.preventDefault();
      const zoomFactor = Math.exp(-e.deltaY * 0.0015);
      params.zoom = Math.max(0.1, Math.min(10.0, params.zoom * zoomFactor));
      uniforms.uZoom.value = params.zoom;
      refreshGui();
    }, { passive: false });

    window.addEventListener("pointerdown", (e) => {
      if (e.target.closest(".lil-gui")) return;
      isDragging = true;
      previousPointerPosition = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener("pointermove", (e) => {
      if (!isDragging) return;
      const deltaX = e.clientX - previousPointerPosition.x;
      const deltaY = e.clientY - previousPointerPosition.y;

      const viewportY = Math.max(window.innerHeight, 1.0);
      params.panX += (2.0 * deltaX) / viewportY;
      params.panY -= (2.0 * deltaY) / viewportY;

      uniforms.uPanOffset.value.set(params.panX, params.panY);
      previousPointerPosition = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener("pointerup", () => {
      isDragging = false;
    });

    // Toggle UI with "H" key
    window.addEventListener("keydown", (e) => {
      if (e.key === "h" || e.key === "H") {
        if (gui.domElement.style.display === "none") {
          gui.show();
        } else {
          gui.hide();
        }
      }
    });

    // ============================================================
    // GUI Setup
    // ============================================================

    const gui = new GUI({ title: "Dimension Controls" });

    // Display & Greenscreen Folder
    const displayFolder = gui.addFolder("Display & Environment");

    displayFolder
      .add(params, "greenscreen")
      .name("Green Screen (#00ff00)")
      .onChange((val) => {
        uniforms.uGreenscreen.value = val ? 1.0 : 0.0;
        if (val) {
          renderer.setClearColor(0x00ff00, 1);
        } else {
          renderer.setClearColor(0x000000, 1);
        }
      });

    displayFolder
      .add(params, "greenscreenThreshold", 0.01, 0.5, 0.01)
      .name("GS Key Threshold")
      .onChange((val) => {
        uniforms.uGreenscreenThreshold.value = val;
      });

    displayFolder
      .add(params, "dpr", 0.5, 3.0, 0.1)
      .name("Pixel Ratio (DPR)")
      .onChange((val) => {
        renderer.setPixelRatio(val);
        resize();
      });

    displayFolder
      .add(params, "speedFactor", 0.0, 3.0, 0.1)
      .name("Animation Speed");

    // Color Scheme Folder
    const colorFolder = gui.addFolder("Color Customization");

    colorFolder
      .add(params, "colorScheme", Object.keys(colorSchemes))
      .name("Color Presets")
      .onChange((schemeName) => {
        applyColorScheme(schemeName);
      });

    colorFolder
      .addColor(params, "colorA")
      .name("Color Tint A")
      .onChange(() => updatePaletteUniforms());

    colorFolder
      .addColor(params, "colorB")
      .name("Color Tint B")
      .onChange(() => updatePaletteUniforms());

    colorFolder
      .addColor(params, "colorC")
      .name("Frequency C")
      .onChange(() => updatePaletteUniforms());

    colorFolder
      .addColor(params, "colorD")
      .name("Phase D")
      .onChange(() => updatePaletteUniforms());

    // Animation Presets Folder
    const animFolder = gui.addFolder("Animation Paths");

    animFolder
      .add(params, "animationPreset", Object.keys(animationPresets))
      .name("Preset Animation")
      .onChange((animName) => {
        applyAnimationPreset(animName);
      });

    // Custom SVG Form Folder
    const svgFolder = gui.addFolder("Custom SVG Form");

    svgFolder
      .add(params, "uploadSVG")
      .name("Upload SVG Form");

    svgFolder
      .add(params, "useSVG")
      .name("Enable SVG Mask")
      .onChange((val) => {
        uniforms.uUseSVG.value = val ? 1.0 : 0.0;
      });

    svgFolder
      .add(params, "svgScale", 0.2, 5.0, 0.1)
      .name("SVG Form Scale")
      .onChange((val) => {
        uniforms.uSVGScale.value = val;
      });

    // View & Camera Controls Folder
    const viewFolder = gui.addFolder("View & Camera");

    viewFolder
      .add(params, "zoom", 0.1, 10.0, 0.05)
      .name("Zoom Scale")
      .onChange((val) => {
        uniforms.uZoom.value = val;
      });

    viewFolder
      .add(params, "panX", -5.0, 5.0, 0.05)
      .name("Pan Offset X")
      .onChange((val) => {
        uniforms.uPanOffset.value.x = val;
      });

    viewFolder
      .add(params, "panY", -5.0, 5.0, 0.05)
      .name("Pan Offset Y")
      .onChange((val) => {
        uniforms.uPanOffset.value.y = val;
      });

    // Scene Parameters Folder
    const sceneFolder = gui.addFolder("Scene Parameters");

    sceneFolder
      .add(params, "preset", Object.keys(presets))
      .name("Preset")
      .onChange((presetName) => {
        applyPreset(presetName);
      });

    sceneFolder
      .add(params, "fieldTimeRate", 0.0, 1.0, 0.001)
      .name("Field Time Rate")
      .onChange((value) => {
        uniforms.uFieldTimeRate.value = value;
      });

    sceneFolder
      .add(params, "forwardTravelRate", -1.0, 1.0, 0.001)
      .name("Forward Travel Rate")
      .onChange((value) => {
        uniforms.uForwardTravelRate.value = value;
      });

    sceneFolder
      .add(params, "cameraFocalLength", 0.03, 1.0, 0.001)
      .name("Focal Length")
      .onChange((value) => {
        uniforms.uCameraFocalLength.value = value;
      });

    sceneFolder
      .add(params, "initialDepth", 0.05, 8.0, 0.001)
      .name("Initial Depth")
      .onChange((value) => {
        uniforms.uInitialDepth.value = value;
      });

    sceneFolder
      .add(params, "domainStrength", 0.0, 5.0, 0.001)
      .name("Domain Strength")
      .onChange((value) => {
        uniforms.uDomainStrength.value = value;
      });

    sceneFolder
      .add(params, "domainScale", 0.1, 12.0, 0.001)
      .name("Domain Scale")
      .onChange((value) => {
        uniforms.uDomainScale.value = value;
      });

    sceneFolder
      .add(params, "domainAttenuation", 0.01, 12.0, 0.001)
      .name("Domain Attenuation")
      .onChange((value) => {
        uniforms.uDomainAttenuation.value = value;
      });

    sceneFolder
      .add(params, "fieldSlope", -2.0, 2.0, 0.001)
      .name("Field Slope")
      .onChange((value) => {
        uniforms.uFieldSlope.value = value;
      });

    sceneFolder
      .add(params, "fieldDetailScale", 0.1, 15.0, 0.001)
      .name("Detail Scale")
      .onChange((value) => {
        uniforms.uFieldDetailScale.value = value;
      });

    sceneFolder
      .add(params, "exposureScale", 50.0, 10000.0, 1.0)
      .name("Exposure Scale")
      .onChange((value) => {
        uniforms.uExposureScale.value = value;
      });

    gui.add(params, "reset").name("Reset All Parameters");

    // Helper functions
    function updatePaletteUniforms() {
      uniforms.uColorMode.value = params.colorMode;
      uniforms.uPaletteA.value.set(...params.colorA);
      uniforms.uPaletteB.value.set(...params.colorB);
      uniforms.uPaletteC.value.set(...params.colorC);
      uniforms.uPaletteD.value.set(...params.colorD);
    }

    function applyColorScheme(schemeName) {
      const scheme = colorSchemes[schemeName];
      if (!scheme) return;

      params.colorMode = scheme.colorMode;
      params.colorA = [...scheme.colorA];
      params.colorB = [...scheme.colorB];
      params.colorC = [...scheme.colorC];
      params.colorD = [...scheme.colorD];

      updatePaletteUniforms();
      refreshGui();
    }

    function applyAnimationPreset(animName) {
      const anim = animationPresets[animName];
      if (!anim) return;

      params.fieldTimeRate = anim.fieldTimeRate;
      params.forwardTravelRate = anim.forwardTravelRate;
      params.domainStrength = anim.domainStrength;
      params.fieldSlope = anim.fieldSlope;

      uniforms.uFieldTimeRate.value = anim.fieldTimeRate;
      uniforms.uForwardTravelRate.value = anim.forwardTravelRate;
      uniforms.uDomainStrength.value = anim.domainStrength;
      uniforms.uFieldSlope.value = anim.fieldSlope;

      refreshGui();
    }

    function resize() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      renderer.setSize(width, height, false);
      renderer.getDrawingBufferSize(uniforms.uResolution.value);
    }

    window.addEventListener("resize", resize, { passive: true });
    resize();

    function updateUniformsFromParameters() {
      uniforms.uZoom.value = params.zoom;
      uniforms.uPanOffset.value.set(params.panX, params.panY);
      uniforms.uInitialDepth.value = params.initialDepth;
      uniforms.uSafeMinimum.value = params.safeMinimum;
      uniforms.uFieldTimeRate.value = params.fieldTimeRate;
      uniforms.uForwardTravelRate.value = params.forwardTravelRate;
      uniforms.uDomainStrength.value = params.domainStrength;
      uniforms.uDomainScale.value = params.domainScale;
      uniforms.uDomainAttenuation.value = params.domainAttenuation;
      uniforms.uCameraFocalLength.value = params.cameraFocalLength;
      uniforms.uFieldSlope.value = params.fieldSlope;
      uniforms.uFieldDetailScale.value = params.fieldDetailScale;
      uniforms.uDistanceBase.value = params.distanceBase;
      uniforms.uDistanceDepthFactor.value = params.distanceDepthFactor;
      uniforms.uExposureScale.value = params.exposureScale;

      updatePaletteUniforms();
      renderer.setPixelRatio(params.dpr);
      resize();
    }

    function refreshGui() {
      gui.controllersRecursive().forEach((controller) => {
        controller.updateDisplay();
      });
    }

    function applyPreset(presetName) {
      const preset = presets[presetName];
      if (!preset) return;

      Object.assign(params, preset);
      params.preset = presetName;

      updateUniformsFromParameters();
      refreshGui();
    }

    function resetParameters() {
      params.zoom = 1.0;
      params.panX = 0.0;
      params.panY = 0.0;
      params.greenscreen = false;
      params.useSVG = false;
      uniforms.uGreenscreen.value = 0.0;
      uniforms.uUseSVG.value = 0.0;
      renderer.setClearColor(0x000000, 1);
      applyColorScheme("Cosmic Neon");
      applyAnimationPreset("Hyper Warp");
      applyPreset("Preset 1");
    }

    // Initialize default color scheme
    applyColorScheme("Cosmic Neon");

    // ============================================================
    // Animation Loop
    // ============================================================

    const clock = new THREE.Clock();
    let accumulatedTime = 0;

    function animate() {
      const delta = clock.getDelta();
      accumulatedTime += delta * params.speedFactor;

      uniforms.uTime.value = accumulatedTime;
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    animate();

    // ============================================================
    // Cleanup
    // ============================================================

    window.addEventListener("beforeunload", () => {
      geometry.dispose();
      material.dispose();
      renderer.dispose();
      gui.destroy();
    });
  </script>
</body>
</html>
