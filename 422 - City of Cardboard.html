<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Submerged City of Cardboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0f14;
      user-select: none;
      -webkit-user-select: none;
    }
    #webgl-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js",
        "postprocessing/PostProcessor.js": "./postprocessing/PostProcessor.js"
      }
    }
  </script>
</head>
<body>
  <canvas id="webgl-canvas"></canvas>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import GUI from 'lil-gui';

    // =========================================================================
    // POST PROCESSOR SUITE (Inlined from postprocessing/PostProcessor.js)
    // =========================================================================
    const orthoVertexShader = `
    precision highp float;
    in vec3 position;
    out vec2 vUv;
    void main() {
      vUv = position.xy * 0.5 + 0.5;
      gl_Position = vec4(position, 1.0);
    }
    `;

    const brightFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float bloomThreshold;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float luminance = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float knee = 0.1;
      float soft = luminance - bloomThreshold + knee;
      soft = clamp(soft, 0.0, 2.0 * knee);
      soft = (soft * soft) / (4.0 * knee + 0.00001);
      float contribution = max(soft, luminance - bloomThreshold);
      contribution /= max(luminance, 0.00001);
      fragColor = vec4(color.rgb * contribution, color.a);
    }
    `;

    const blur13ShaderChunk = `
    vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
      vec2 resolution = vec2(textureSize(image, 0));
      vec4 color = vec4(0.0);
      vec2 off1 = vec2(1.411764705882353) * direction;
      vec2 off2 = vec2(3.2941176470588234) * direction;
      vec2 off3 = vec2(5.176470588235294) * direction;
      color += texture(image, uv) * 0.1964825501511404;
      color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
      color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
      return color;
    }
    `;

    const blurFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 direction;
    in vec2 vUv;
    out vec4 color;
    ${blur13ShaderChunk}
    void main() {
      color = blur13(inputTexture, vUv, direction);
    }
    `;

    const godRaysDepthMaskShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float threshold;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float lum = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float factor = smoothstep(threshold, threshold + 0.15, lum);
      fragColor = vec4(vec3(factor), 1.0);
    }
    `;

    const godRaysGenerateShader = `
    precision highp float;
    #define TAPS_PER_PASS 6.0

    uniform sampler2D inputTexture;
    uniform vec3 vSunPositionScreenSpace;
    uniform float fStepSize;
    uniform float distanceAttenuation;
    uniform float maxDensity;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec2 delta = vSunPositionScreenSpace.xy - vUv;
      float dist = length(delta);
      vec2 stepv = fStepSize * delta / max(dist, 0.0001);
      float iters = dist / max(fStepSize, 0.00001);

      vec2 uv = vUv;
      float col = 0.0;
      float f = min(1.0, max(vSunPositionScreenSpace.z, 0.0));
      float atten = 1.0 / (1.0 + pow(dist, distanceAttenuation));

      if (0.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (1.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (2.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (3.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (4.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (5.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;

      float finalVal = min(col / TAPS_PER_PASS * atten, maxDensity);
      fragColor = vec4(vec3(finalVal), 1.0);
    }
    `;

    const anamorphicBrightShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float threshold;
    uniform float smoothWidth;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float v = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float alpha = smoothstep(threshold, threshold + smoothWidth, v);
      fragColor = mix(vec4(0.0), color, alpha);
    }
    `;

    const anamorphicBlurShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 resolution;
    uniform float samples;
    uniform float intensity;
    uniform vec3 tintColor;
    uniform float bloomRadius;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      int halfSamples = max(1, int(samples) / 2);
      float fHalfSamples = float(halfSamples);
      vec2 invSize = 1.0 / resolution;
      vec4 total = vec4(0.0);

      for (int i = -64; i <= 64; i++) {
        if (i < -halfSamples || i > halfSamples) continue;
        float softness = 1.0 - abs(float(i)) / fHalfSamples;
        softness = pow(softness, 2.0);
        vec2 shiftedUV = vec2(vUv.x + invSize.x * float(i) * (4.0 + bloomRadius * 8.0), vUv.y);
        shiftedUV = clamp(shiftedUV, 0.001, 0.999);
        total += texture(inputTexture, shiftedUV) * softness;
      }

      fragColor = (total / (samples / 3.0)) * vec4(tintColor, 1.0) * intensity;
    }
    `;

    const finalFragmentShader = `
    precision highp float;
    uniform vec2 resolution;
    uniform sampler2D inputTexture;
    uniform sampler2D blur0Texture;
    uniform sampler2D blur1Texture;
    uniform sampler2D blur2Texture;
    uniform sampler2D blur3Texture;
    uniform sampler2D blur4Texture;
    uniform sampler2D raysTexture;
    uniform sampler2D anamorphicTexture;
    uniform bool bloomEnabled;
    uniform float bloomStrength;
    uniform bool raysEnabled;
    uniform float raysStrength;
    uniform vec3 raysColor;
    uniform bool anamorphicEnabled;
    uniform float vignetteBoost;
    uniform float vignetteReduction;
    uniform float noiseIntensity;
    uniform float time;
    in vec2 vUv;
    out vec4 fragColor;

    float vignette(vec2 uv, float boost, float reduction) {
      vec2 position = vUv - 0.5;
      return boost - length(position) * reduction;
    }

    float hash1(uint n) {
      n = (n << 13U) ^ n;
      n = n * (n * n * 15731U + 789221U) + 1376312589U;
      return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
    }

    float noise(in vec2 uv, in float timeVal) {
      uvec2 p = uvec2(uv);
      return hash1(p.x + 1920U * p.y + (1920U * 1080U) * uint(timeVal));
    }

    void main() {
      vec4 color = texture(inputTexture, vUv);

      if (bloomEnabled && bloomStrength > 0.001) {
        vec4 b0 = texture(blur0Texture, vUv);
        vec4 b1 = texture(blur1Texture, vUv);
        vec4 b2 = texture(blur2Texture, vUv);
        vec4 b3 = texture(blur3Texture, vUv);
        vec4 b4 = texture(blur4Texture, vUv);
        vec4 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
        color += bloomSum * bloomStrength;
      }

      if (raysEnabled && raysStrength > 0.001) {
        vec4 r = texture(raysTexture, vUv);
        color.rgb += r.rgb * raysColor * raysStrength;
      }

      if (anamorphicEnabled) {
        vec4 a = texture(anamorphicTexture, vUv);
        color.rgb += a.rgb;
      }

      color.rgb *= vignette(vUv, vignetteBoost, vignetteReduction);
      color.rgb += noiseIntensity * noise(gl_FragCoord.xy, time);
      fragColor = vec4(color.rgb, 1.0);
    }
    `;

    const chromaticAberrationShaderChunk = `
    vec2 barrelDistortion(vec2 coord, float amt) {
      vec2 cc = coord - 0.5;
      float dist = dot(cc, cc);
      return coord + cc * dist * amt;
    }
    float sat(float t) { return clamp(t, 0.0, 1.0); }
    float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
    float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
    vec4 spectrum_offset(float t) {
      float lo = step(t, 0.5);
      float hi = 1.0 - lo;
      float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
      vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
      return pow(ret, vec4(1.0 / 2.2));
    }
    const float max_distort = 2.2;
    const int num_iter = 8;
    const float reci_num_iter_f = 1.0 / float(num_iter);
    vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
      vec4 sumcol = vec4(0.0);
      vec4 sumw = vec4(0.0);
      for (int i = 0; i < num_iter; ++i) {
        float t = float(i) * reci_num_iter_f;
        vec4 w = spectrum_offset(t);
        sumw += w;
        sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
      }
      return sumcol / sumw;
    }
    `;

    const colorFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float chromaticAberrationAmount;
    uniform float minInputLevel;
    uniform float maxInputLevel;
    uniform float gammaLevel;
    uniform float exposure;
    uniform float fisheyeStrength;
    uniform float fisheyeRadius;
    uniform float time;
    uniform int visionMode;
    uniform float thermalSensitivity;
    uniform float nightVisionNoise;
    uniform float nightVisionGain;
    uniform float crtIntensity;
    in vec2 vUv;
    out vec4 fragColor;

    ${chromaticAberrationShaderChunk}

    vec2 applyFisheye(vec2 uv, float strength, float radius) {
      if (abs(strength) < 0.0001) return uv;
      vec2 p = uv - 0.5;
      float d = length(p);
      if (d > radius * 1.5) return uv;
      float r = d / max(radius, 0.001);
      float theta = atan(p.y, p.x);
      float rDist = r + strength * (r * r * r);
      return 0.5 + vec2(cos(theta), sin(theta)) * (rDist * radius);
    }

    vec3 ACESFilmicToneMapping(vec3 color) {
      float a = 2.51;
      float b = 0.03;
      float c = 2.43;
      float d = 0.59;
      float e = 0.14;
      return clamp((color * (a * color + b)) / (color * (c * color + d) + e), 0.0, 1.0);
    }

    vec3 gammaCorrect(vec3 color, vec3 gamma) {
      return pow(max(color, vec3(0.0)), 1.0 / gamma);
    }
    vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
      return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
    }
    vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
      return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
    }

    vec3 applyNightVision(vec3 color, vec2 uv, float timeVal, float noiseAmt, float gain, float crt) {
      float lum = dot(color, vec3(0.299, 0.587, 0.114));
      float amplified = pow(lum * gain, 0.72);
      vec3 phosphorColor = mix(vec3(0.02, 0.12, 0.03), vec3(0.18, 1.0, 0.32), clamp(amplified, 0.0, 1.0));
      phosphorColor += vec3(0.7, 1.0, 0.8) * max(0.0, amplified - 0.75) * 1.8;
      vec2 p = uv - 0.5;
      float tubeDist = length(p);
      float tubeMask = smoothstep(0.72, 0.44, tubeDist);
      float n = fract(sin(dot(uv * 280.0 + timeVal * 0.05, vec2(12.9898, 78.233))) * 43758.5453);
      float scanline = sin(uv.y * 650.0) * crt;
      phosphorColor += (n - 0.5) * noiseAmt * 2.0 + scanline;
      return clamp(phosphorColor * tubeMask, 0.0, 1.0);
    }

    vec3 ironbow(float t) {
      t = clamp(t, 0.0, 1.0);
      vec3 c0 = vec3(0.02, 0.01, 0.18);
      vec3 c1 = vec3(0.22, 0.02, 0.48);
      vec3 c2 = vec3(0.82, 0.05, 0.25);
      vec3 c3 = vec3(1.0, 0.62, 0.02);
      vec3 c4 = vec3(1.0, 1.0, 0.92);
      if (t < 0.25) return mix(c0, c1, t * 4.0);
      if (t < 0.50) return mix(c1, c2, (t - 0.25) * 4.0);
      if (t < 0.75) return mix(c2, c3, (t - 0.50) * 4.0);
      return mix(c3, c4, (t - 0.75) * 4.0);
    }

    vec3 applyThermal(vec3 color, vec2 uv, float sensitivity, float crt, bool whiteHot) {
      float lum = dot(color, vec3(0.299, 0.587, 0.114));
      float heat = clamp(lum * sensitivity, 0.0, 1.0);
      float sensorRaster = sin(uv.y * 900.0) * (crt * 0.3);
      heat = clamp(heat + sensorRaster, 0.0, 1.0);
      return whiteHot ? vec3(pow(heat, 0.85)) : ironbow(heat);
    }

    void main() {
      vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
      vec4 col = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
      vec3 finalCol = col.rgb;

      if (visionMode == 1) {
        finalCol = applyNightVision(finalCol, uv, time, nightVisionNoise, nightVisionGain, crtIntensity);
      } else if (visionMode == 2) {
        finalCol = applyThermal(finalCol, uv, thermalSensitivity, crtIntensity, false);
      } else if (visionMode == 3) {
        finalCol = applyThermal(finalCol, uv, thermalSensitivity, crtIntensity, true);
      } else {
        vec3 exposedColor = finalCol * exposure;
        vec3 toneMappedColor = ACESFilmicToneMapping(exposedColor);
        finalCol = finalLevels(toneMappedColor, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
        if (crtIntensity > 0.0001) {
          float scanline = sin(uv.y * 900.0 + time * 2.0) * crtIntensity;
          finalCol -= scanline;
        }
      }

      fragColor = vec4(finalCol, 1.0);
    }
    `;

    const copyFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      fragColor = texture(inputTexture, vUv);
    }
    `;

    function createFBO(w, h, options = {}) {
      return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
        wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
        wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
        minFilter: options.minFilter || THREE.LinearFilter,
        magFilter: options.magFilter || THREE.LinearFilter,
        format: options.format || THREE.RGBAFormat,
        type: options.type || THREE.HalfFloatType,
        stencilBuffer: options.stencilBuffer || false,
        depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : true,
        samples: options.samples || 0,
      });
    }

    class ShaderPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbo = createFBO(1, 1, options);
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
        this.texture = this.fbo.texture;
      }
      render(renderer, toScreen = false) {
        if (!toScreen) renderer.setRenderTarget(this.fbo);
        renderer.render(this.orthoScene, this.orthoCamera);
        if (!toScreen) renderer.setRenderTarget(null);
      }
      setSize(width, height) {
        this.fbo.setSize(Math.max(1, width), Math.max(1, height));
        this.orthoQuad.scale.set(width, height, 1);
      }
    }

    class ShaderPingPongPass {
      constructor(shader, options = {}) {
        this.shader = shader;
        this.orthoScene = new THREE.Scene();
        this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
        this.currentFBO = 0;
        this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
        this.orthoScene.add(this.orthoQuad);
      }
      render(renderer) {
        renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
        renderer.render(this.orthoScene, this.orthoCamera);
        renderer.setRenderTarget(null);
        this.currentFBO = 1 - this.currentFBO;
      }
      get current() { return this.fbos[this.currentFBO]; }
      get texture() { return this.current.texture; }
      setSize(width, height) {
        const w = Math.max(1, width);
        const h = Math.max(1, height);
        this.orthoQuad.scale.set(w, h, 1);
        this.fbos[0].setSize(w, h);
        this.fbos[1].setSize(w, h);
      }
    }

    class BloomPass {
      constructor(strength = 0.8, radius = 0.5, threshold = 0.2, levels = 5) {
        this.strength = strength;
        this.radius = radius;
        this.threshold = threshold;
        this.enabled = true;
        this.levels = levels;

        this.brightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            bloomThreshold: { value: this.threshold },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: brightFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.brightPass = new ShaderPass(this.brightShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.blurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            direction: { value: new THREE.Vector2(0, 1) },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: blurFragmentShader,
          glslVersion: THREE.GLSL3,
        });

        this.blurPasses = [];
        for (let i = 0; i < this.levels; i++) {
          this.blurPasses.push(new ShaderPingPongPass(this.blurShader, {
            format: THREE.RGBAFormat,
            type: THREE.HalfFloatType,
          }));
        }
      }

      setSize(w, h) {
        let tw = Math.max(1, w);
        let th = Math.max(1, h);
        this.brightPass.setSize(tw, th);
        for (let i = 0; i < this.levels; i++) {
          tw = Math.max(1, Math.round(tw / 2));
          th = Math.max(1, Math.round(th / 2));
          this.blurPasses[i].setSize(tw, th);
        }
      }

      set source(texture) {
        this.brightShader.uniforms.inputTexture.value = texture;
      }

      render(renderer) {
        if (!this.enabled || this.strength <= 0.001) return;
        this.brightShader.uniforms.bloomThreshold.value = this.threshold;
        this.brightPass.render(renderer);

        const baseOffset = Math.max(0.1, this.radius * 2.0);
        const u = this.blurShader.uniforms;

        for (let j = 0; j < this.levels; j++) {
          const blurPass = this.blurPasses[j];
          const stepOffset = baseOffset * (1.0 + j * 0.5);
          u.direction.value.set(stepOffset, 0);
          u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
          blurPass.render(renderer);
          u.direction.value.set(0, stepOffset * 0.5);
          u.inputTexture.value = blurPass.current.texture;
          blurPass.render(renderer);
        }
      }
    }

    const VISION_MODE_MAP = {
      'Normal (Cinematic)': 0,
      'Night Vision (Phosphor)': 1,
      'Thermal (Ironbow)': 2,
      'Thermal (White-Hot)': 3,
    };

    class PostProcessor {
      constructor(renderer, params = {}) {
        this.renderer = renderer;

        this.settings = {
          enabled: params.enabled !== undefined ? params.enabled : true,
          antialias: params.antialias !== undefined ? params.antialias : true,
          bloomEnabled: params.bloomEnabled !== undefined ? params.bloomEnabled : true,
          bloomStrength: params.bloomStrength !== undefined ? params.bloomStrength : 1.1,
          bloomRadius: params.bloomRadius !== undefined ? params.bloomRadius : 0.55,
          bloomThreshold: params.bloomThreshold !== undefined ? params.bloomThreshold : 0.2,

          raysEnabled: params.raysEnabled !== undefined ? params.raysEnabled : true,
          raysStrength: params.raysStrength !== undefined ? params.raysStrength : 0.75,
          raysDensity: params.raysDensity !== undefined ? params.raysDensity : 1.0,
          raysMaxDensity: params.raysMaxDensity !== undefined ? params.raysMaxDensity : 0.5,
          raysDistanceAttenuation: params.raysDistanceAttenuation !== undefined ? params.raysDistanceAttenuation : 2.0,
          raysThreshold: params.raysThreshold !== undefined ? params.raysThreshold : 0.15,
          raysColor: params.raysColor ? (params.raysColor.isColor ? params.raysColor.clone() : new THREE.Color(params.raysColor)) : new THREE.Color(0xf6aa1c),
          raysColorHex: params.raysColorHex || '#f6aa1c',

          // Anamorphic flare default is explicitly OFF as requested
          anamorphicEnabled: false,
          anamorphicIntensity: 5.0,
          anamorphicThreshold: 0.35,
          anamorphicSamples: 64,
          anamorphicRadius: 0.0,
          anamorphicSmoothWidth: 0.05,
          anamorphicColor: new THREE.Color(0x7a8aff),
          anamorphicColorHex: '#7a8aff',

          visionMode: 'Normal (Cinematic)',
          thermalSensitivity: 1.4,
          nightVisionGain: 2.1,
          nightVisionNoise: 0.05,
          crtIntensity: 0.0,

          fisheyeStrength: 0.0,
          fisheyeRadius: 1.0,
          chromaticAberration: 0.015,
          vignetteBoost: 1.08,
          vignetteReduction: 0.6,
          noiseIntensity: 0.012,

          gamma: 1.0,
          minInputLevel: 0.0,
          maxInputLevel: 1.0,
          exposure: 1.0,
        };

        const maxSamples = (this.renderer && this.renderer.capabilities) ? (this.renderer.capabilities.maxSamples || 4) : 4;
        const targetSamples = this.settings.antialias ? Math.min(4, maxSamples) : 0;
        this.sceneTarget = createFBO(1, 1, { type: THREE.HalfFloatType, samples: targetSamples });

        this.bloomPass = new BloomPass(
          this.settings.bloomStrength,
          this.settings.bloomRadius,
          this.settings.bloomThreshold,
          5
        );

        this.moonScreenPos = new THREE.Vector3(0.5, 0.7, 1.0);
        this.moonInFront = true;

        this.godRaysMaskShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            threshold: { value: this.settings.raysThreshold },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: godRaysDepthMaskShader,
          glslVersion: THREE.GLSL3,
        });
        this.godRaysMaskPass = new ShaderPass(this.godRaysMaskShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.godRaysGenShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            vSunPositionScreenSpace: { value: this.moonScreenPos },
            fStepSize: { value: 1.0 },
            distanceAttenuation: { value: this.settings.raysDistanceAttenuation },
            maxDensity: { value: this.settings.raysMaxDensity },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: godRaysGenerateShader,
          glslVersion: THREE.GLSL3,
        });
        this.godRaysPingPong = new ShaderPingPongPass(this.godRaysGenShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.anamorphicBrightShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            threshold: { value: this.settings.anamorphicThreshold },
            smoothWidth: { value: this.settings.anamorphicSmoothWidth },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: anamorphicBrightShader,
          glslVersion: THREE.GLSL3,
        });
        this.anamorphicBrightPass = new ShaderPass(this.anamorphicBrightShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.anamorphicBlurShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
            resolution: { value: new THREE.Vector2(1, 1) },
            samples: { value: this.settings.anamorphicSamples },
            intensity: { value: this.settings.anamorphicIntensity },
            tintColor: { value: this.settings.anamorphicColor },
            bloomRadius: { value: this.settings.anamorphicRadius },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: anamorphicBlurShader,
          glslVersion: THREE.GLSL3,
        });
        this.anamorphicBlurPass = new ShaderPass(this.anamorphicBlurShader, {
          format: THREE.RGBAFormat,
          type: THREE.HalfFloatType,
        });

        this.finalShader = new THREE.RawShaderMaterial({
          uniforms: {
            resolution: { value: new THREE.Vector2(1, 1) },
            bloomEnabled: { value: this.settings.bloomEnabled },
            bloomStrength: { value: this.settings.bloomStrength },
            raysEnabled: { value: this.settings.raysEnabled },
            raysStrength: { value: this.settings.raysStrength },
            raysColor: { value: this.settings.raysColor },
            anamorphicEnabled: { value: this.settings.anamorphicEnabled },
            vignetteBoost: { value: this.settings.vignetteBoost },
            vignetteReduction: { value: this.settings.vignetteReduction },
            noiseIntensity: { value: this.settings.noiseIntensity },
            inputTexture: { value: null },
            blur0Texture: { value: null },
            blur1Texture: { value: null },
            blur2Texture: { value: null },
            blur3Texture: { value: null },
            blur4Texture: { value: null },
            raysTexture: { value: null },
            anamorphicTexture: { value: null },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: finalFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.finalPass = new ShaderPass(this.finalShader);

        this.rgbShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: this.finalPass.texture },
            fisheyeStrength: { value: this.settings.fisheyeStrength },
            fisheyeRadius: { value: this.settings.fisheyeRadius },
            chromaticAberrationAmount: { value: this.settings.chromaticAberration },
            minInputLevel: { value: this.settings.minInputLevel },
            maxInputLevel: { value: this.settings.maxInputLevel },
            gammaLevel: { value: this.settings.gamma },
            exposure: { value: this.settings.exposure },
            visionMode: { value: VISION_MODE_MAP[this.settings.visionMode] ?? 0 },
            thermalSensitivity: { value: this.settings.thermalSensitivity },
            nightVisionGain: { value: this.settings.nightVisionGain },
            nightVisionNoise: { value: this.settings.nightVisionNoise },
            crtIntensity: { value: this.settings.crtIntensity },
            time: { value: 0 },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: colorFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.rgbPass = new ShaderPass(this.rgbShader);

        this.copyShader = new THREE.RawShaderMaterial({
          uniforms: {
            inputTexture: { value: null },
          },
          vertexShader: orthoVertexShader,
          fragmentShader: copyFragmentShader,
          glslVersion: THREE.GLSL3,
        });
        this.copyPass = new ShaderPass(this.copyShader);
      }

      updateSettings() {
        this.bloomPass.enabled = this.settings.bloomEnabled;
        this.bloomPass.strength = this.settings.bloomStrength;
        this.bloomPass.radius = this.settings.bloomRadius;
        this.bloomPass.threshold = this.settings.bloomThreshold;

        this.godRaysMaskShader.uniforms.threshold.value = this.settings.raysThreshold;
        this.godRaysGenShader.uniforms.distanceAttenuation.value = this.settings.raysDistanceAttenuation;
        this.godRaysGenShader.uniforms.maxDensity.value = this.settings.raysMaxDensity;

        this.anamorphicBrightShader.uniforms.threshold.value = this.settings.anamorphicThreshold;
        this.anamorphicBrightShader.uniforms.smoothWidth.value = this.settings.anamorphicSmoothWidth;
        this.anamorphicBlurShader.uniforms.samples.value = this.settings.anamorphicSamples;
        this.anamorphicBlurShader.uniforms.intensity.value = this.settings.anamorphicIntensity;
        this.anamorphicBlurShader.uniforms.tintColor.value.copy(this.settings.anamorphicColor);
        this.anamorphicBlurShader.uniforms.bloomRadius.value = this.settings.anamorphicRadius;

        this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
        this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
        this.finalShader.uniforms.raysEnabled.value = this.settings.raysEnabled && this.moonInFront;
        this.finalShader.uniforms.raysStrength.value = this.settings.raysStrength;
        this.finalShader.uniforms.raysColor.value.copy(this.settings.raysColor);
        this.finalShader.uniforms.anamorphicEnabled.value = this.settings.anamorphicEnabled;
        this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
        this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
        this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;

        this.rgbShader.uniforms.fisheyeStrength.value = this.settings.fisheyeStrength;
        this.rgbShader.uniforms.fisheyeRadius.value = this.settings.fisheyeRadius;
        this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
        this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
        this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
        this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
        this.rgbShader.uniforms.exposure.value = this.settings.exposure;
        this.rgbShader.uniforms.visionMode.value = VISION_MODE_MAP[this.settings.visionMode] ?? 0;
        this.rgbShader.uniforms.thermalSensitivity.value = this.settings.thermalSensitivity;
        this.rgbShader.uniforms.nightVisionGain.value = this.settings.nightVisionGain;
        this.rgbShader.uniforms.nightVisionNoise.value = this.settings.nightVisionNoise;
        this.rgbShader.uniforms.crtIntensity.value = this.settings.crtIntensity;
      }

      setSize(w0, h0, dpr = 1) {
        const w = Math.max(1, Math.floor(w0 * dpr));
        const h = Math.max(1, Math.floor(h0 * dpr));
        this.sceneTarget.setSize(w, h);
        this.finalPass.setSize(w, h);
        this.finalShader.uniforms.resolution.value.set(w, h);
        this.bloomPass.setSize(w, h);

        const grW = Math.max(1, Math.round(w / 2));
        const grH = Math.max(1, Math.round(h / 2));
        this.godRaysMaskPass.setSize(grW, grH);
        this.godRaysPingPong.setSize(grW, grH);

        const anW = Math.max(1, Math.round(w / 4));
        const anH = Math.max(1, Math.round(h / 4));
        this.anamorphicBrightPass.setSize(anW, anH);
        this.anamorphicBlurPass.setSize(anW, anH);
        this.anamorphicBlurShader.uniforms.resolution.value.set(anW, anH);

        this.rgbPass.setSize(w, h);
        this.copyPass.setSize(w, h);
      }

      setAntialias(enabled) {
        this.settings.antialias = !!enabled;
        const maxSamples = (this.renderer && this.renderer.capabilities) ? (this.renderer.capabilities.maxSamples || 4) : 4;
        const samples = this.settings.antialias ? Math.min(4, maxSamples) : 0;
        if (this.sceneTarget.samples !== samples) {
          const oldTarget = this.sceneTarget;
          this.sceneTarget = createFBO(oldTarget.width, oldTarget.height, {
            type: THREE.HalfFloatType,
            samples: samples,
          });
          oldTarget.dispose();
        }
      }

      setMoonScreenPosition(camera, moonWorldPos) {
        if (!this._camDir) {
          this._camDir = new THREE.Vector3();
          this._toMoon = new THREE.Vector3();
          this._ndc = new THREE.Vector3();
        }
        camera.getWorldDirection(this._camDir);
        this._toMoon.copy(moonWorldPos).sub(camera.position).normalize();
        const dot = this._camDir.dot(this._toMoon);

        if (dot <= 0.02) {
          this.moonInFront = false;
          this.finalShader.uniforms.raysEnabled.value = false;
          return;
        }

        this.moonInFront = true;
        const fade = THREE.MathUtils.clamp((dot - 0.02) / 0.15, 0.0, 1.0);
        this._ndc.copy(moonWorldPos).project(camera);
        const screenX = this._ndc.x * 0.5 + 0.5;
        const screenY = this._ndc.y * 0.5 + 0.5;
        const screenZ = fade;

        this.moonScreenPos.set(screenX, screenY, screenZ);
        this.godRaysGenShader.uniforms.vSunPositionScreenSpace.value.set(screenX, screenY, screenZ);
      }

      renderScene(scene, camera) {
        if (!this.settings.enabled) {
          this.renderer.setRenderTarget(this.sceneTarget);
          this.renderer.render(scene, camera);
          this.renderer.setRenderTarget(null);
          this.copyPass.shader.uniforms.inputTexture.value = this.sceneTarget.texture;
          this.copyPass.render(this.renderer, true);
          return;
        }
        this.renderer.setRenderTarget(this.sceneTarget);
        this.renderer.render(scene, camera);
        this.renderer.setRenderTarget(null);
        this.render(this.sceneTarget.texture);
      }

      render(sourceTexture) {
        if (!this.settings.enabled) {
          this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
          this.copyPass.render(this.renderer, true);
          return;
        }

        this.updateSettings();

        // 1. Bloom
        this.bloomPass.source = sourceTexture;
        this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
        this.bloomPass.render(this.renderer);

        this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
        this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
        this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
        this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
        this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

        // 2. Godrays
        if (this.settings.raysEnabled && this.settings.raysStrength > 0.001 && this.moonInFront) {
          this.godRaysMaskShader.uniforms.inputTexture.value = sourceTexture;
          this.godRaysMaskShader.uniforms.threshold.value = this.settings.raysThreshold;
          this.godRaysMaskPass.render(this.renderer);

          const filterLen = this.settings.raysDensity;
          const tapsPerPass = 6.0;

          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -1.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysMaskPass.texture;
          this.godRaysPingPong.render(this.renderer);

          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -2.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysPingPong.texture;
          this.godRaysPingPong.render(this.renderer);

          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -3.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysPingPong.texture;
          this.godRaysPingPong.render(this.renderer);

          this.finalPass.shader.uniforms.raysTexture.value = this.godRaysPingPong.texture;
          this.finalPass.shader.uniforms.raysEnabled.value = true;
        } else {
          this.finalPass.shader.uniforms.raysEnabled.value = false;
        }

        // 3. Anamorphic Flare
        if (this.settings.anamorphicEnabled && this.settings.anamorphicIntensity > 0.001) {
          this.anamorphicBrightShader.uniforms.inputTexture.value = sourceTexture;
          this.anamorphicBrightShader.uniforms.threshold.value = this.settings.anamorphicThreshold;
          this.anamorphicBrightShader.uniforms.smoothWidth.value = this.settings.anamorphicSmoothWidth;
          this.anamorphicBrightPass.render(this.renderer);

          this.anamorphicBlurShader.uniforms.inputTexture.value = this.anamorphicBrightPass.texture;
          this.anamorphicBlurShader.uniforms.samples.value = this.settings.anamorphicSamples;
          this.anamorphicBlurShader.uniforms.intensity.value = this.settings.anamorphicIntensity;
          this.anamorphicBlurShader.uniforms.tintColor.value.copy(this.settings.anamorphicColor);
          this.anamorphicBlurShader.uniforms.bloomRadius.value = this.settings.anamorphicRadius;
          this.anamorphicBlurPass.render(this.renderer);

          this.finalPass.shader.uniforms.anamorphicTexture.value = this.anamorphicBlurPass.texture;
          this.finalPass.shader.uniforms.anamorphicEnabled.value = true;
        } else {
          this.finalPass.shader.uniforms.anamorphicEnabled.value = false;
        }

        const randomTime = Math.random() * 100000;
        this.finalPass.shader.uniforms.time.value = randomTime;
        this.rgbPass.shader.uniforms.time.value = randomTime;

        this.finalPass.render(this.renderer);
        this.rgbPass.render(this.renderer, true);
      }

      attachGUI(gui, title = "Post-Processing (PostProcessor.js)") {
        const root = gui.addFolder(title);
        root.add(this.settings, "enabled").name("Enable Post-Process");
        root.add(this.settings, "antialias").name("MSAA Antialias").onChange((v) => this.setAntialias(v));

        const vision = root.addFolder("Thermal & Night Vision");
        vision.add(this.settings, "visionMode", Object.keys(VISION_MODE_MAP)).name("Vision Mode").onChange(() => this.updateSettings());
        vision.add(this.settings, "nightVisionGain", 0.5, 5.0, 0.1).name("NVG Amplification").onChange(() => this.updateSettings());
        vision.add(this.settings, "nightVisionNoise", 0.0, 0.3, 0.01).name("NVG Sensor Noise").onChange(() => this.updateSettings());

        anamorphic.addColor(this.settings, "anamorphicColorHex").name("Tint Color").onChange((v) => {
          this.settings.anamorphicColor.set(v);
          this.updateSettings();
        });

        const bloom = root.addFolder("Atmospheric Bloom");
        bloom.add(this.settings, "bloomEnabled").name("Enable Bloom").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomStrength", 0, 3.0, 0.05).name("Bloom Strength").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomRadius", 0, 2.0, 0.05).name("Bloom Radius").onChange(() => this.updateSettings());
        bloom.add(this.settings, "bloomThreshold", 0, 1.0, 0.01).name("Bloom Threshold").onChange(() => this.updateSettings());

        const lens = root.addFolder("Lens, Optics & Film Grain");
        lens.add(this.settings, "fisheyeStrength", -1.0, 1.5, 0.01).name("Fisheye Distortion").onChange(() => this.updateSettings());
        lens.add(this.settings, "fisheyeRadius", 0.2, 2.0, 0.05).name("Fisheye Radius").onChange(() => this.updateSettings());
        lens.add(this.settings, "chromaticAberration", 0, 0.2, 0.005).name("Chromatic Aberration").onChange(() => this.updateSettings());
        lens.add(this.settings, "vignetteBoost", 0, 2.0, 0.05).name("Vignette Boost").onChange(() => this.updateSettings());
        lens.add(this.settings, "vignetteReduction", 0, 2.0, 0.05).name("Vignette Falloff").onChange(() => this.updateSettings());
        lens.add(this.settings, "noiseIntensity", 0, 0.1, 0.005).name("Film Grain").onChange(() => this.updateSettings());
        lens.add(this.settings, "gamma", 0.2, 2.0, 0.05).name("Gamma").onChange(() => this.updateSettings());
        lens.add(this.settings, "minInputLevel", 0, 0.5, 0.01).name("Black Level").onChange(() => this.updateSettings());
        lens.add(this.settings, "maxInputLevel", 0.5, 1.0, 0.01).name("White Level").onChange(() => this.updateSettings());

        return root;
      }
    }

      if (renderer) {

      ctx.fillStyle = 'rgba(255,255,255,0.04)';
      for (let y = 2; y < 512; y += 4) {
        ctx.fillRect(0, y, 512, 1.2);
      }

      // Edge shadow vignette
      const grad = ctx.createLinearGradient(0, 0, 512, 0);
      grad.addColorStop(0, 'rgba(0,0,0,0.12)');
      grad.addColorStop(0.08, 'transparent');
      grad.addColorStop(0.92, 'transparent');
      grad.addColorStop(1, 'rgba(0,0,0,0.14)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 512);

      // Central flap seam
      ctx.strokeStyle = 'rgba(0,0,0,0.25)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, 256);
      ctx.lineTo(512, 256);
      ctx.stroke();

      // Adhesive Kraft Packing Tape
      ctx.fillStyle = scheme.tape;
      ctx.globalAlpha = 0.72;
      ctx.fillRect(0, 234, 512, 44);
      ctx.fillStyle = 'rgba(255,255,255,0.2)';
      ctx.fillRect(0, 234, 512, 2);
      ctx.fillStyle = 'rgba(0,0,0,0.2)';
      ctx.fillRect(0, 276, 512, 2);
      ctx.globalAlpha = 1.0;

      // Draw Generic Placeholder Cargo & Technical Markings
      if (type === 'freight') {
        // GENERIC FREIGHT / CARGO EMBLEM (Geometric isometric box & hexagon)
        ctx.save();
        ctx.translate(130, 140);
        ctx.strokeStyle = scheme.cardboardDark;
        ctx.lineWidth = 4;

        // Isometric cargo box icon
        ctx.beginPath();
        ctx.moveTo(0, -32);
        ctx.lineTo(28, -16);
        ctx.lineTo(28, 16);
        ctx.lineTo(0, 32);
        ctx.lineTo(-28, 16);
        ctx.lineTo(-28, -16);
        ctx.closePath();
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(0, 32);
        ctx.moveTo(0, 0);
        ctx.lineTo(28, -16);
        ctx.moveTo(0, 0);
        ctx.lineTo(-28, -16);
        ctx.stroke();

        ctx.fillStyle = scheme.cardboardDark;
        ctx.font = '900 24px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('METROPOLIS', 0, 68);
        ctx.font = '700 20px sans-serif';
        ctx.fillText('FREIGHT 04', 0, 94);
        ctx.restore();

        // Technical cargo barcode sticker
        ctx.fillStyle = scheme.labelBg;
        ctx.fillRect(270, 70, 210, 120);
        ctx.fillStyle = '#000000';
        ctx.font = '700 12px monospace';
        ctx.fillText('HEAVY FREIGHT TRANSIT', 280, 88);
        for (let bx = 280; bx < 460; bx += Math.random() > 0.4 ? 6 : 3) {
          ctx.fillRect(bx, 96, Math.random() > 0.5 ? 2.5 : 1.5, 45);
        }
        ctx.font = '600 10px monospace';
        ctx.fillText('*MF-84091-C7*', 280, 155);
        ctx.fillText('SECTOR 4 / SUBMERGED BASIN', 280, 172);

      } else if (type === 'parcel') {
        // GENERIC PARCEL COURIER (Double chevrons / speed arrows)
        ctx.save();
        ctx.translate(256, 125);
        ctx.strokeStyle = scheme.accent;

        ctx.lineCap = 'round';

        ctx.fillText('RAPID POST', 0, 58);

        ctx.fillStyle = scheme.cardboardDark;
        ctx.font = '900 30px monospace';

        ctx.fillText('BATCH 01', 256, 378);

        // UNIVERSAL ISO FRAGILE STAMP
        ctx.save();

        ctx.strokeStyle = scheme.accent;
        ctx.lineWidth = 6;
        ctx.strokeRect(-120, -65, 240, 130);

        ctx.font = '900 38px sans-serif';

        ctx.arc(0, 16, 16, Math.PI, 0);
        ctx.lineTo(0, 36);

        ctx.save();

        ctx.fillStyle = scheme.cardboardDark;
        for (let ox of [-30, 30]) {

        ctx.fillStyle = scheme.tape;
        ctx.globalAlpha = 0.65;
        ctx.fillRect(234, 0, 44, 512);

        ctx.fillStyle = scheme.cardboardDark;
        ctx.font = '800 16px sans-serif';

      tex.colorSpace = THREE.SRGBColorSpace;
      tex.wrapS = THREE.ClampToEdgeWrapping;

      new THREE.BoxGeometry(1.6, 1.8, 1.6),
      new THREE.BoxGeometry(3.2, 1.5, 2.2)
    ];

    towerConfigs.forEach((cfg) => {
      let currentY = 0.4;
      const layers = Math.floor(cfg.count / 2.2);

      for (let layer = 0; layer < layers; layer++) {
        const boxesInLayer = Math.max(1, Math.floor(3.2 - (layer / layers) * 2.2));
        const layerHeight = 1.4 + Math.random() * 0.4;

        for (let b = 0; b < boxesInLayer; b++) {
          const geoIdx = Math.floor(Math.random() * standardBoxGeos.length);
          const matIdx = Math.floor(Math.random() * boxMaterials.length);
          const mat = boxMaterials[matIdx];

          const mesh = new THREE.Mesh(standardBoxGeos[geoIdx], mat);
          mesh.castShadow = true;
          mesh.receiveShadow = true;

          const offsetX = (Math.random() - 0.5) * (cfg.baseW * (1 - layer / layers * 0.65));
          const offsetZ = (Math.random() - 0.5) * (cfg.baseD * (1 - layer / layers * 0.65));
          const rotY = (Math.random() - 0.5) * 0.35;
          const rotX = (Math.random() - 0.5) * 0.08;
          const rotZ = (Math.random() - 0.5) * 0.08;

          mesh.position.set(cfg.x + offsetX, currentY + layerHeight * 0.5, cfg.z + offsetZ);
          mesh.rotation.set(rotX, rotY, rotZ);

          if (cfg.isCollapsingFront) {
            mesh.userData = {
              basePos: mesh.position.clone(),
              baseRot: mesh.rotation.clone(),
              baseScale: mesh.scale.clone(),
              layerIndex: layer,
              totalLayers: layers,
              phase: (layer / layers) * Math.PI + Math.random() * 0.5,
              decayProgress: (layer / layers) * 0.6 + Math.random() * 0.3,
              isSoggy: layer <= 2
            };
            collapsingBoxes.push(mesh);
          } else {
            staticBoxes.push(mesh);
          }

          cityGroup.add(mesh);
        }
        currentY += layerHeight;
      }
    });

    // Ambient box rain dropping from high fog
    const fallingBoxesRain = [];
    const rainCount = 42;

    for (let i = 0; i < rainCount; i++) {
      const geoIdx = Math.floor(Math.random() * standardBoxGeos.length);
      const matIdx = Math.floor(Math.random() * boxMaterials.length);
      const mesh = new THREE.Mesh(standardBoxGeos[geoIdx], boxMaterials[matIdx]);
      mesh.castShadow = true;

      const x = (Math.random() - 0.5) * 36;
      const z = (Math.random() - 0.5) * 32;
      const y = 30 + Math.random() * 45;

      mesh.position.set(x, y, z);
      mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
      const s = 0.75 + Math.random() * 0.5;
      mesh.scale.set(s, s, s);

      mesh.userData = {
        vy: -0.15 - Math.random() * 0.25,
        rotSpeedX: (Math.random() - 0.5) * 0.04,
        rotSpeedY: (Math.random() - 0.5) * 0.04,
        rotSpeedZ: (Math.random() - 0.5) * 0.04,
        targetY: 0.2 + Math.random() * 4.0,
        initialY: y
      };

      cityGroup.add(mesh);
      fallingBoxesRain.push(mesh);
    }

    // Floating Cardboard Debris
    const floatingDebris = [];
    const debrisGeos = [
      new THREE.BoxGeometry(1.6, 0.8, 1.4),
      new THREE.BoxGeometry(2.2, 0.4, 1.8),
      new THREE.BoxGeometry(1.2, 0.6, 1.2),
      new THREE.BoxGeometry(2.0, 0.3, 1.2)
    ];

    for (let i = 0; i < 48; i++) {
      const geo = debrisGeos[Math.floor(Math.random() * debrisGeos.length)];
      const mat = boxMaterials[Math.floor(Math.random() * boxMaterials.length)];
      const mesh = new THREE.Mesh(geo, mat);
      mesh.castShadow = true;
      mesh.receiveShadow = true;

      const angle = Math.random() * Math.PI * 2;
      const dist = 9 + Math.random() * 38;
      const x = Math.cos(angle) * dist + 2;
      const z = Math.sin(angle) * dist + 5;

      mesh.position.set(x, 0, z);
      mesh.rotation.set(
        (Math.random() - 0.5) * 0.25,
        Math.random() * Math.PI * 2,
        (Math.random() - 0.5) * 0.25
      );

      mesh.userData = {
        baseX: x,
        baseZ: z,
        phase: Math.random() * Math.PI * 2,
        bobSpeed: 0.8 + Math.random() * 0.8,
        driftSpeed: 0.05 + Math.random() * 0.1
      };

      cityGroup.add(mesh);
      floatingDebris.push(mesh);
    }

    // Splash Particles
    const splashShards = [];
    const shardGeo = new THREE.TetrahedronGeometry(0.35, 0);
    const shardMat = new THREE.MeshBasicMaterial({
      color: COLOR_SCHEMES[params.colorScheme].foam,
      flatShading: true
    });

    for (let i = 0; i < 50; i++) {
      const mesh = new THREE.Mesh(shardGeo, shardMat);
      mesh.visible = false;
      mesh.userData = {
        active: false,
        vx: 0,
        vy: 0,
        vz: 0,
        life: 0
      };
      scene.add(mesh);
      splashShards.push(mesh);
    }

    function triggerSplash(x, z, count = 6) {
      let spawned = 0;
      for (const shard of splashShards) {
        if (!shard.userData.active) {
          shard.visible = true;
          shard.position.set(x + (Math.random() - 0.5) * 1.5, 0.2, z + (Math.random() - 0.5) * 1.5);
          const speed = 0.15 + Math.random() * 0.25;
          const ang = Math.random() * Math.PI * 2;
          shard.userData.vx = Math.cos(ang) * speed;
          shard.userData.vy = 0.2 + Math.random() * 0.35;
          shard.userData.vz = Math.sin(ang) * speed;
          shard.userData.life = 1.0;
          shard.userData.active = true;
          spawned++;
          if (spawned >= count) break;
        }
      }
    }

    // =========================================================================
    // COLOR SCHEME UPDATE HANDLER
    // =========================================================================
    function applyColorScheme(schemeName) {
      params.colorScheme = schemeName;
      const scheme = COLOR_SCHEMES[schemeName];
      if (!scheme) return;

      buildMaterialsForScheme(schemeName);

      const updateMeshMat = (m) => {
        if (!m.userData.isSoggy) {
          m.material = boxMaterials[Math.floor(Math.random() * boxMaterials.length)];
        } else {
          m.material = soggyMaterial;
        }
      };

      staticBoxes.forEach(updateMeshMat);
      collapsingBoxes.forEach(updateMeshMat);
      fallingBoxesRain.forEach(updateMeshMat);
      floatingDebris.forEach(updateMeshMat);

      oceanMaterial.color.set(scheme.water);
      foamMat.color.set(scheme.foam);
      shardMat.color.set(scheme.foam);

      if (!params.greenScreen) {
        scene.background.set(scheme.fog);
        scene.fog.color.set(scheme.fog);
      }

      ambientLight.color.set(scheme.lightAmb);
      dirLight.color.set(scheme.lightDir);
    }

    function applyGreenScreen(enabled) {
      params.greenScreen = enabled;
      if (enabled) {
        scene.background.setHex(0x00ff00);
        scene.fog.color.setHex(0x00ff00);
      } else {
        const scheme = COLOR_SCHEMES[params.colorScheme];
        scene.background.set(scheme.fog);
        scene.fog.color.set(scheme.fog);
      }
    }

    // =========================================================================
    // 8 PRECONFIGURED CAMERA ANIMATIONS WITH PERSISTENT USER ZOOM SUPPORT
    // Zooming in/out with wheel alters distance smoothly and NEVER snaps back!
    // =========================================================================
    let animClock = 0;
    let isUserDragging = false;

    controls.addEventListener('start', () => {
      isUserDragging = true;
    });

    // Update spherical coordinates continuously during drag so orbit resumes seamlessly
    controls.addEventListener('change', () => {
      if (isUserDragging) {
        const offset = new THREE.Vector3().subVectors(camera.position, controls.target);
        spherical.setFromVector3(offset);
        userPolarAngle = THREE.MathUtils.clamp(spherical.phi, 0.04, Math.PI / 2 - 0.01);
        userOrbitRadius = THREE.MathUtils.clamp(spherical.radius, 4.0, 180.0);
        userAzimuthOffset = spherical.theta - (animClock * 0.35);
        userZoomMultiplier = userOrbitRadius / 38.0;

        params.orbitElevation = Math.round(THREE.MathUtils.radToDeg(Math.PI / 2 - userPolarAngle));
        params.orbitDistance = Math.round(userOrbitRadius);
      }
    });

    controls.addEventListener('end', () => {
      isUserDragging = false;
      const offset = new THREE.Vector3().subVectors(camera.position, controls.target);
      spherical.setFromVector3(offset);
      userPolarAngle = THREE.MathUtils.clamp(spherical.phi, 0.04, Math.PI / 2 - 0.01);
      userOrbitRadius = THREE.MathUtils.clamp(spherical.radius, 4.0, 180.0);
      userAzimuthOffset = spherical.theta - (animClock * 0.35);
      userZoomMultiplier = userOrbitRadius / 38.0;

      params.orbitElevation = Math.round(THREE.MathUtils.radToDeg(Math.PI / 2 - userPolarAngle));
      params.orbitDistance = Math.round(userOrbitRadius);
    });

    const nominalCamPos = new THREE.Vector3();
    const animTarget = new THREE.Vector3();
    const animOffset = new THREE.Vector3();

    function updateCameraPreset(delta) {
      if (isUserDragging) return;

      const preset = params.cameraAnimation;
      animClock += delta * 0.45;

      if (preset === 'Static Observation') {
        animTarget.set(0, 8.0, 0);
        controls.target.copy(animTarget);
        const r = userOrbitRadius;
        const currentTheta = userAzimuthOffset + 0.65;
        const currentPhi = userPolarAngle;
        camera.position.x = animTarget.x + r * Math.sin(currentPhi) * Math.sin(currentTheta);
        camera.position.y = animTarget.y + r * Math.cos(currentPhi);
        camera.position.z = animTarget.z + r * Math.sin(currentPhi) * Math.cos(currentTheta);
        return;
      }

      if (preset === 'Cinematic Orbit') {
        animTarget.set(0, 8.5, 0);
        controls.target.copy(animTarget);
        const currentTheta = animClock * 0.35 + userAzimuthOffset;
        const currentPhi = userPolarAngle;
        const r = userOrbitRadius;

        camera.position.x = animTarget.x + r * Math.sin(currentPhi) * Math.sin(currentTheta);
        camera.position.y = animTarget.y + r * Math.cos(currentPhi);
        camera.position.z = animTarget.z + r * Math.sin(currentPhi) * Math.cos(currentTheta);
        return;

      } else if (preset === 'Waterline Drift') {
        animTarget.set(6, 4.0, 4);
        const t = animClock * 0.3;
        nominalCamPos.set(
          Math.sin(t) * 16 + 5,
          2.4 + Math.sin(t * 1.5) * 0.6,
          Math.cos(t) * 12 + 20
        );
        animOffset.subVectors(nominalCamPos, animTarget);
        camera.position.copy(animTarget).addScaledVector(animOffset, userZoomMultiplier);
        controls.target.copy(animTarget);

      } else if (preset === 'Skyline Ascent') {
        const t = (Math.sin(animClock * 0.25) * 0.5 + 0.5);
        animTarget.set(0, 10 + t * 12, 0);
        nominalCamPos.set(
          22 + Math.cos(animClock * 0.2) * 5,
          4.0 + t * 28.0,
          32 - t * 8.0
        );
        animOffset.subVectors(nominalCamPos, animTarget);
        camera.position.copy(animTarget).addScaledVector(animOffset, userZoomMultiplier);
        controls.target.copy(animTarget);

      } else if (preset === 'Collapse Focus Track') {
        animTarget.set(8, 3.0, 6);
        const t = animClock * 0.4;
        nominalCamPos.set(
          13 + Math.sin(t * 0.6) * 4,
          5.5 + Math.cos(t * 0.5) * 1.5,
          18 + Math.cos(t * 0.6) * 4
        );
        animOffset.subVectors(nominalCamPos, animTarget);
        camera.position.copy(animTarget).addScaledVector(animOffset, userZoomMultiplier);
        controls.target.copy(animTarget);

      } else if (preset === 'Misty Harbor Pan') {
        animTarget.set(0, 8.0, 0);
        const t = Math.sin(animClock * 0.25);
        nominalCamPos.set(
          t * 26,
          12 + Math.cos(animClock * 0.25) * 2,
          36 - Math.abs(t) * 5
        );
        animOffset.subVectors(nominalCamPos, animTarget);
        camera.position.copy(animTarget).addScaledVector(animOffset, userZoomMultiplier);
        controls.target.copy(animTarget);

      } else if (preset === 'High Drone Survey') {
        animTarget.set(0, 5, 0);
        controls.target.copy(animTarget);
        const currentTheta = animClock * 0.25 + userAzimuthOffset;
        const currentPhi = THREE.MathUtils.clamp(userPolarAngle * 0.85, 0.04, 1.2);
        const r = userOrbitRadius * 1.15;

        camera.position.x = animTarget.x + r * Math.sin(currentPhi) * Math.sin(currentTheta);
        camera.position.y = animTarget.y + r * Math.cos(currentPhi) + 8.0;
        camera.position.z = animTarget.z + r * Math.sin(currentPhi) * Math.cos(currentTheta);
        return;

      } else if (preset === 'Ocean Swell Cam') {
        const swell = Math.sin(animClock * 1.2) * 1.2;
        const roll = Math.cos(animClock * 0.9) * 0.04;
        animTarget.set(2, 6.0 + swell * 0.5, 0);
        nominalCamPos.set(16, 5.0 + swell, 26);
        animOffset.subVectors(nominalCamPos, animTarget);
        camera.position.copy(animTarget).addScaledVector(animOffset, userZoomMultiplier);
        camera.rotation.z = roll;
        controls.target.copy(animTarget);
      }
    }

    // =========================================================================
    // PROCEDURAL RANDOMIZER (Invoked on Scene Click)
    // NOTE: Leaves PostProcessor settings completely untouched as requested!
    // =========================================================================
    function randomizeProceduralScene() {
      // Pick random color scheme
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const randomKey = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      applyColorScheme(randomKey);

      // Randomize geometric and environmental motion parameters ONLY
      params.waveHeight = 0.5 + Math.random() * 1.8;
      params.waveSpeed = 0.6 + Math.random() * 1.8;
      params.collapseSpeed = 0.6 + Math.random() * 1.6;
      params.exposure = 0.85 + Math.random() * 0.75;
      params.ambientIntensity = 0.5 + Math.random() * 1.0;
      params.dirLightIntensity = 1.4 + Math.random() * 2.2;

      renderer.toneMappingExposure = params.exposure;
      ambientLight.intensity = params.ambientIntensity;
      dirLight.intensity = params.dirLightIntensity;

      triggerSplash(8, 7, 18);

      // Refresh GUI displays without altering post-processing values
      gui.controllersRecursive().forEach(c => {
        // Do not update postProcessor controllers
        if (!c.parent || !c.parent._title || !c.parent._title.includes('Post-Processing')) {
          c.updateDisplay();
        }
      });
    }

    // Click vs Drag Detection
    let pointerDownPos = { x: 0, y: 0 };
    let pointerDownTime = 0;

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.lil-gui')) return;
      pointerDownPos.x = e.clientX;
      pointerDownPos.y = e.clientY;
      pointerDownTime = performance.now();
    });

    window.addEventListener('pointerup', (e) => {
      if (e.target.closest('.lil-gui')) return;
      const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
      const elapsed = performance.now() - pointerDownTime;

      if (dist < 6 && elapsed < 350) {
        if (params.randomizeOnClick) {
          randomizeProceduralScene();
        }
      }
    });

    // =========================================================================
    // LIL-GUI SETUP (Default unstyled styling, exact specified import)
    // =========================================================================
    const gui = new GUI({ title: 'The Submerged City' });

    // 1. General & Scene Folder
    const fGeneral = gui.addFolder('General & Scene');
    fGeneral.add(params, 'greenScreen').name('Green Screen (#00ff00)').onChange(applyGreenScreen);
    fGeneral.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Color Scheme').onChange(applyColorScheme);
    fGeneral.add(params, 'cameraAnimation', ANIMATION_PRESETS).name('Camera View');
    fGeneral.add(params, 'animationSpeed', 0.1, 3.0, 0.1).name('Animation Speed');
    fGeneral.add(params, 'dpr', 0.5, 2.5, 0.1).name('Pixel Ratio (DPR)').onChange(v => {
      renderer.setPixelRatio(v);
      postProcessor.setSize(window.innerWidth, window.innerHeight, v);
    });
    fGeneral.add(params, 'antialias').name('Antialiasing').onChange(v => {
      initRenderer(v);
      applyColorScheme(params.colorScheme);
    });
    fGeneral.add(params, 'orbitElevation', 2, 88, 1).name('Orbit Angle (Elevation °)').listen().onChange(v => {
      userPolarAngle = THREE.MathUtils.degToRad(90 - v);
    });
    fGeneral.add(params, 'orbitDistance', 6, 160, 1).name('Orbit Distance (Zoom)').listen().onChange(v => {
      userOrbitRadius = v;
      userZoomMultiplier = v / 38.0;
    });
    fGeneral.add(params, 'randomizeOnClick').name('Randomize on Click');

    // 2. Lighting & Exposure Folder
    const fLighting = gui.addFolder('Lighting & Exposure');
    fLighting.add(params, 'exposure', 0.2, 3.0, 0.05).name('Tone Exposure').onChange(v => renderer.toneMappingExposure = v);
    fLighting.add(params, 'ambientIntensity', 0.0, 2.5, 0.05).name('Ambient Intensity').onChange(v => ambientLight.intensity = v);
    fLighting.addColor(params, 'ambientColor').name('Ambient Color').onChange(c => ambientLight.color.set(c));
    fLighting.add(params, 'dirLightIntensity', 0.0, 5.0, 0.1).name('Sun Light Intensity').onChange(v => dirLight.intensity = v);
    fLighting.addColor(params, 'dirLightColor').name('Sun Light Color').onChange(c => dirLight.color.set(c));
    fLighting.add(params, 'rimLightIntensity', 0.0, 4.0, 0.1).name('Rim/Fill Intensity').onChange(v => rimLight.intensity = v);
    fLighting.addColor(params, 'rimLightColor').name('Rim/Fill Color').onChange(c => rimLight.color.set(c));

    // 3. Simulation & Dynamics Folder
    const fSim = gui.addFolder('Cardboard & Water Dynamics');
    fSim.add(params, 'waveHeight', 0.1, 3.0, 0.1).name('Wave Height');
    fSim.add(params, 'waveSpeed', 0.1, 3.0, 0.1).name('Wave Speed');
    fSim.add(params, 'collapseSpeed', 0.1, 3.0, 0.1).name('Collapse Rate');
    fSim.add(params, 'rainDensity', 5, 42, 1).name('Rain Boxes Count');

    // 4. Attach PostProcessor Controls Folder (PostProcessor.js integration)
    postProcessor.attachGUI(gui, "Post-Processing (PostProcessor.js)");

    // UI visibility toggle with "H" key
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        gui._hidden ? gui.show() : gui.hide();
      }
    });

    // =========================================================================
    // WINDOW RESIZE HANDLER
    // =========================================================================
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      if (postProcessor) {
        postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);
      }
    });

    // =========================================================================
    // MAIN ANIMATION LOOP (Continuous Infinite Time-Lapse)
    // =========================================================================
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const rawDelta = clock.getDelta();
      const delta = rawDelta * params.animationSpeed;
      const elapsedTime = clock.getElapsedTime() * params.animationSpeed;

      // 1. Animate Faceted Low-Poly Ocean Waves
      const waveTime = elapsedTime * params.waveSpeed;
      const pos = oceanGeo.attributes.position;

      for (let i = 0; i < pos.count; i++) {
        const vx = pos.getX(i);
        const vz = pos.getZ(i);

        const y = Math.sin(vx * 0.12 + waveTime * 1.4) * params.waveHeight * 0.6
                + Math.cos(vz * 0.16 + waveTime * 1.1) * params.waveHeight * 0.5
                + Math.sin((vx + vz) * 0.08 + waveTime * 0.9) * params.waveHeight * 0.3;

        pos.setY(i, y);
      }
      pos.needsUpdate = true;
      oceanGeo.computeVertexNormals();

      // 2. Animate Waterline Foam Patches
      foamPatches.forEach((f, idx) => {
        const pulse = 1.0 + Math.sin(elapsedTime * 2.2 + f.phase) * 0.25;
        f.mesh.scale.set(f.baseScale * pulse, f.baseScale * pulse, f.baseScale * pulse);
        f.mesh.position.y = 0.06 + Math.sin(elapsedTime * 1.8 + idx) * 0.05;
      });

      // 3. Time-Lapse Waterfront Collapse & Rebuilding Simulation
      const collapseCycleTime = elapsedTime * 0.35 * params.collapseSpeed;

      collapsingBoxes.forEach((mesh, idx) => {
        const u = mesh.userData;
        const progress = (collapseCycleTime + u.phase) % 1.0;

        if (progress < 0.45) {
          // Stage A: Sogginess wicks in -> Accordion compression & forward sag
          const sagRatio = progress / 0.45;
          mesh.scale.y = u.baseScale.y * (1.0 - sagRatio * 0.55);
          mesh.position.y = u.basePos.y - sagRatio * 1.4;
          mesh.rotation.x = u.baseRot.x + sagRatio * 0.45;
          mesh.rotation.z = u.baseRot.z + sagRatio * 0.25;

          if (u.layerIndex <= 2 && mesh.material !== soggyMaterial) {
            mesh.material = soggyMaterial;
            mesh.userData.isSoggy = true;
          }
        } else if (progress < 0.75) {
          // Stage B: Heavy collapse into the ocean depths
          const sinkRatio = (progress - 0.45) / 0.30;
          mesh.position.y = (u.basePos.y - 1.4) - sinkRatio * 6.5;
          mesh.rotation.x = u.baseRot.x + 0.45 + sinkRatio * 0.6;
          mesh.rotation.y = u.baseRot.y + sinkRatio * 0.4;
          mesh.scale.y = u.baseScale.y * (0.45 - sinkRatio * 0.3);

          if (sinkRatio > 0.05 && sinkRatio < 0.15 && Math.random() < 0.3) {
            triggerSplash(mesh.position.x, mesh.position.z, 4);
          }
        } else {
          // Stage C: Instant replacement dropping like rain from the high fog
          const dropRatio = (progress - 0.75) / 0.25;
          const highY = u.basePos.y + 35.0;
          const easeFall = dropRatio * dropRatio;
          mesh.position.y = highY - easeFall * 35.0;
          mesh.position.x = u.basePos.x;
          mesh.position.z = u.basePos.z;

          mesh.rotation.x = u.baseRot.x + (1.0 - dropRatio) * Math.PI * 2;
          mesh.rotation.z = u.baseRot.z + (1.0 - dropRatio) * Math.PI;

          if (mesh.userData.isSoggy && dropRatio > 0.1) {
            mesh.material = boxMaterials[idx % boxMaterials.length];
            mesh.userData.isSoggy = false;
          }

          mesh.scale.copy(u.baseScale);
        }
      });

      // 4. Animate Ambient Box Rain from the Sky
      const activeRain = Math.min(params.rainDensity, fallingBoxesRain.length);
      for (let i = 0; i < fallingBoxesRain.length; i++) {
        const box = fallingBoxesRain[i];
        if (i >= activeRain) {
          box.visible = false;
          continue;
        }
        box.visible = true;

        box.position.y += box.userData.vy * (params.collapseSpeed * 0.85);
        box.rotation.x += box.userData.rotSpeedX;
        box.rotation.y += box.userData.rotSpeedY;
        box.rotation.z += box.userData.rotSpeedZ;

        if (box.position.y <= box.userData.targetY) {
          triggerSplash(box.position.x, box.position.z, 3);
          box.position.y = 35 + Math.random() * 35;
          box.position.x = (Math.random() - 0.5) * 36;
          box.position.z = (Math.random() - 0.5) * 32;
        }
      }

      // 5. Animate Floating Debris Bobbing on the Ocean
      floatingDebris.forEach((deb) => {
        const u = deb.userData;
        const waveY = Math.sin(deb.position.x * 0.12 + waveTime * 1.4) * params.waveHeight * 0.6
                    + Math.cos(deb.position.z * 0.16 + waveTime * 1.1) * params.waveHeight * 0.5;

        deb.position.y = waveY + 0.15;
        deb.rotation.x = Math.sin(elapsedTime * u.bobSpeed + u.phase) * 0.18;
        deb.rotation.z = Math.cos(elapsedTime * u.bobSpeed + u.phase) * 0.18;
      });

      // 6. Animate Splash Particles
      splashShards.forEach((s) => {
        if (s.userData.active) {
          s.position.x += s.userData.vx * delta * 45;
          s.position.y += s.userData.vy * delta * 45;
          s.position.z += s.userData.vz * delta * 45;
          s.userData.vy -= 0.02 * delta * 45;

          s.userData.life -= delta * 1.8;
          s.scale.setScalar(Math.max(0.01, s.userData.life));

          if (s.userData.life <= 0 || s.position.y < -0.5) {
            s.userData.active = false;
            s.visible = false;
          }
        }
      });

      // 7. Update Camera with Persistent Zoom Multiplier
      updateCameraPreset(delta);

      controls.update();

      // 8. Render through PostProcessor Suite
      postProcessor.setMoonScreenPosition(camera, dirLight.position);
      postProcessor.renderScene(scene, camera);
    }

    animate();
  </script>
</body>
</html>
