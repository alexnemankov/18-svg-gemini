<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>IC-2026 / HYPERSPACE</title>
	<style>
		*,
		*::before,
		*::after {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		:root {
			--blue: #2b4bff;
			--ice: #aac6ff;
			--bg: #000000;
			--mono: "Courier New", Courier, monospace;
		}

		body {
			background: var(--bg);
			color: var(--ice);
			overflow: hidden;
			cursor: crosshair;
			user-select: none;
		}

		.webgl {
			position: fixed;
			inset: 0;
			width: 100%;
			height: 100%;
			z-index: 0;
			display: block;
		}

		/* vignette to deepen the edges like the reference */
		.vignette {
			position: fixed;
			inset: 0;
			z-index: 2;
			pointer-events: none;
			background: radial-gradient(
				ellipse at center,
				transparent 45%,
				rgba(0, 0, 0, 0.65) 100%
			);
			transition: opacity 0.3s ease;
		}

		nav {
			position: fixed;
			top: 0;
			left: 0;
			right: 0;
			z-index: 10;
			display: flex;
			justify-content: space-between;
			align-items: center;
			padding: 1.6rem 2.4rem;
			pointer-events: none;
			transition: opacity 0.3s ease;
		}

		.logo {
			font-family: var(--mono);
			font-size: 0.7rem;
			letter-spacing: 0.32em;
			opacity: 0.55;
		}

		.status {
			display: flex;
			align-items: center;
			gap: 0.55rem;
			font-family: var(--mono);
			font-size: 0.62rem;
			letter-spacing: 0.18em;
			color: var(--blue);
		}

		.dot {
			width: 6px;
			height: 6px;
			border-radius: 50%;
			background: var(--blue);
			box-shadow: 0 0 8px var(--blue);
			animation: blink 1.4s ease-in-out infinite;
		}

		@keyframes blink {
			0%,
			100% {
				opacity: 1;
			}
			50% {
				opacity: 0.2;
			}
		}

		.readout {
			position: fixed;
			bottom: 1.6rem;
			left: 2.4rem;
			z-index: 10;
			font-family: var(--mono);
			font-size: 0.6rem;
			letter-spacing: 0.14em;
			color: rgba(170, 198, 255, 0.4);
			line-height: 1.9;
			pointer-events: none;
			transition: opacity 0.3s ease;
		}
	</style>
	<script type="importmap">
		{
			"imports": {
				"three": "https://unpkg.com/three@0.160.0/build/three.module.js",
				"three/examples/jsm/": "https://unpkg.com/three@0.160.0/examples/jsm/",
				"lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
			}
		}
	</script>
</head>
<body>
	<canvas class="webgl"></canvas>
	<div class="vignette"></div>

	<nav>
		<span class="logo">IC-2026 / HYPERSPACE</span>
		<div class="status">
			<div class="dot"></div>
			TRAVELING · WEBGL
		</div>
	</nav>

	<div class="readout">
		VELOCITY: ∞<br />
		VECTOR: 0,0,−Z
	</div>

	<script type="module">
		import * as THREE from "three";
		import GUI from "lil-gui";
		import { EffectComposer } from "three/examples/jsm/postprocessing/EffectComposer.js";
		import { RenderPass } from "three/examples/jsm/postprocessing/RenderPass.js";
		import { UnrealBloomPass } from "three/examples/jsm/postprocessing/UnrealBloomPass.js";
		import { ShaderPass } from "three/examples/jsm/postprocessing/ShaderPass.js";
		import { FXAAShader } from "three/examples/jsm/shaders/FXAAShader.js";

		// 5 Preset Color Schemes
		const COLOR_SCHEMES = {
			"Cyberpunk Cobalt": { cubeColor: "#2b4bff", bgColor: "#000000" },
			"Neon Synthwave": { cubeColor: "#ff0055", bgColor: "#0a0017" },
			"Emerald Matrix": { cubeColor: "#00ff66", bgColor: "#000f07" },
			"Solar Flare": { cubeColor: "#ffaa00", bgColor: "#120202" },
			"Monochrome Hyper": { cubeColor: "#ffffff", bgColor: "#050505" }
		};

		// Parameters
		const params = {
			speed: 3.0,
			swirl: 0.15,
			parallax: 1.0,
			cubeColor: COLOR_SCHEMES["Cyberpunk Cobalt"].cubeColor,
			bgColor: COLOR_SCHEMES["Cyberpunk Cobalt"].bgColor,
			colorScheme: "Cyberpunk Cobalt",
			animationMode: "Hyper Infinite Warp",
			bloom: 0.7,
			bloomRadius: 0.35,
			exposure: 1.0,
			dpr: Math.min(window.devicePixelRatio, 2),
			greenscreen: false,
			randomOnClick: true,
			size: 2.0,
			spacing: 4.0
		};

		// Scene setup
		const scene = new THREE.Scene();
		const initialBg = new THREE.Color(params.bgColor);
		scene.background = initialBg;
		scene.fog = new THREE.Fog(initialBg, 8, 34);

		const tunnel = new THREE.Group();
		scene.add(tunnel);

		// Camera
		const camera = new THREE.PerspectiveCamera(
			70,
			window.innerWidth / window.innerHeight,
			0.1,
			200
		);
		let cameraZoomZ = 0;
		camera.position.set(0, 0, 0);

		// Renderer
		const renderer = new THREE.WebGLRenderer({
			canvas: document.querySelector(".webgl"),
			antialias: true
		});
		renderer.setSize(window.innerWidth, window.innerHeight);
		renderer.setPixelRatio(params.dpr);
		renderer.toneMapping = THREE.ACESFilmicToneMapping;
		renderer.toneMappingExposure = params.exposure;

		// Post-processing
		const composer = new EffectComposer(renderer);
		composer.addPass(new RenderPass(scene, camera));

		const bloomPass = new UnrealBloomPass(
			new THREE.Vector2(window.innerWidth, window.innerHeight),
			params.bloom,
			params.bloomRadius,
			0.0
		);
		composer.addPass(bloomPass);

		const fxaaPass = new ShaderPass(FXAAShader);
		fxaaPass.uniforms["resolution"].value.set(
			1 / window.innerWidth,
			1 / window.innerHeight
		);
		composer.addPass(fxaaPass);

		// Layout
		const COLS = 6;
		const OFFSETS = [];
		for (let i = 0; i < COLS; i++) {
			const o = (i + 0.5) * params.spacing * 0.75;
			OFFSETS.push(-o, o);
		}
		const LAYERS = 16;
		const DEPTH = LAYERS * params.spacing;

		// Geometry & Materials
		const boxGeo = new THREE.BoxGeometry(1, 1, 1);
		const edgeGeo = new THREE.EdgesGeometry(boxGeo);
		const occluderMat = new THREE.MeshBasicMaterial({ color: 0x000000 });

		const lineMat = new THREE.LineBasicMaterial({
			color: new THREE.Color(params.cubeColor),
			transparent: true,
			blending: THREE.AdditiveBlending,
			depthWrite: false
		});

		// Build cubes
		const cubes = [];
		for (let l = 0; l < LAYERS; l++) {
			for (let xi = 0; xi < OFFSETS.length; xi++) {
				for (let yi = 0; yi < OFFSETS.length; yi++) {
					const holder = new THREE.Group();
					holder.position.set(OFFSETS[xi], OFFSETS[yi], -l * params.spacing - 6);
					holder.scale.setScalar(params.size);

					const core = new THREE.Mesh(boxGeo, occluderMat);
					core.scale.setScalar(0.985);
					holder.add(core);

					const edges = new THREE.LineSegments(edgeGeo, lineMat);
					holder.add(edges);

					tunnel.add(holder);
					cubes.push(holder);
				}
			}
		}

		// Mouse Parallax & Dragging
		const mouse = new THREE.Vector2(0, 0);
		const targetMouse = new THREE.Vector2(0, 0);
		let isDragging = false;
		let dragStart = { x: 0, y: 0 };
		let dragPos = { x: 0, y: 0 };
		let currentDrag = { x: 0, y: 0 };
		let hasMovedFar = false;

		window.addEventListener("mousemove", (e) => {
			targetMouse.x = (e.clientX / window.innerWidth) * 2 - 1;
			targetMouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

			if (isDragging) {
				const dx = e.clientX - dragStart.x;
				const dy = e.clientY - dragStart.y;
				if (Math.hypot(dx, dy) > 3) {
					hasMovedFar = true;
				}
				dragPos.x += dx * 0.02;
				dragPos.y -= dy * 0.02;
				dragStart = { x: e.clientX, y: e.clientY };
			}
		});

		window.addEventListener("mousedown", (e) => {
			// Don't drag if clicking GUI
			if (e.target.closest(".lil-gui")) return;
			isDragging = true;
			hasMovedFar = false;
			dragStart = { x: e.clientX, y: e.clientY };
		});

		window.addEventListener("mouseup", (e) => {
			if (isDragging) {
				isDragging = false;
				// If simple click without dragging far, trigger random variation if enabled
				if (!hasMovedFar && params.randomOnClick && !e.target.closest(".lil-gui")) {
					triggerRandomVariation();
				}
			}
		});

		// Wheel Zoom
		window.addEventListener("wheel", (e) => {
			cameraZoomZ += e.deltaY * 0.015;
			cameraZoomZ = THREE.MathUtils.clamp(cameraZoomZ, -15, 30);
		}, { passive: true });

		// Functions to update scene colors & features
		function applyColors() {
			if (params.greenscreen) {
				scene.background.set("#00ff00");
				scene.fog.color.set("#00ff00");
				document.querySelector(".vignette").style.opacity = "0";
			} else {
				scene.background.set(params.bgColor);
				scene.fog.color.set(params.bgColor);
				document.querySelector(".vignette").style.opacity = "1";
			}
			lineMat.color.set(params.cubeColor);
		}

		function updateGuiDisplay(targetGui) {
			targetGui.controllers.forEach(c => c.updateDisplay());
			targetGui.folders.forEach(f => updateGuiDisplay(f));
		}

		function triggerRandomVariation() {
			// Random colors
			const hue = Math.random();
			const sat = 0.8 + Math.random() * 0.2;
			const light = 0.5 + Math.random() * 0.2;
			const mainColor = new THREE.Color().setHSL(hue, sat, light);
			params.cubeColor = "#" + mainColor.getHexString();

			const bgHue = (hue + 0.5) % 1.0;
			const bgColor = new THREE.Color().setHSL(bgHue, 0.4, 0.03);
			params.bgColor = "#" + bgColor.getHexString();

			// Random motion / shape parameters
			params.speed = parseFloat((Math.random() * 8 + 0.5).toFixed(1));
			params.swirl = parseFloat((Math.random() * 0.35).toFixed(2));
			params.parallax = parseFloat((Math.random() * 2.0).toFixed(2));
			params.bloom = parseFloat((Math.random() * 1.5 + 0.2).toFixed(2));
			bloomPass.strength = params.bloom;

			applyColors();
			updateGuiDisplay(gui);
		}

		// Animation Modes configuration
		function applyAnimationPreset(mode) {
			if (mode === "Hyper Infinite Warp") {
				params.speed = 4.5;
				params.swirl = 0.15;
				params.parallax = 1.0;
			} else if (mode === "Gentle Cosmic Drift") {
				params.speed = 1.2;
				params.swirl = 0.05;
				params.parallax = 1.5;
			} else if (mode === "Pulse & Wave Orbit") {
				params.speed = 2.5;
				params.swirl = 0.25;
				params.parallax = 0.8;
			} else if (mode === "Spiral Passage") {
				params.speed = 3.0;
				params.swirl = 0.4;
				params.parallax = 1.2;
			} else if (mode === "Static Void (No Camera Movement)") {
				params.speed = 0.0;
				params.swirl = 0.0;
				params.parallax = 0.0;
			}
			updateGuiDisplay(gui);
		}

		// GUI Setup
		const gui = new GUI({ title: "Settings" });

		const fAnimation = gui.addFolder("Animation & Motion");
		fAnimation
			.add(params, "animationMode", [
				"Hyper Infinite Warp",
				"Gentle Cosmic Drift",
				"Pulse & Wave Orbit",
				"Spiral Passage",
				"Static Void (No Camera Movement)"
			])
			.name("Preset")
			.onChange((v) => applyAnimationPreset(v));
		fAnimation.add(params, "speed", 0, 60, 0.5).name("Speed");
		fAnimation.add(params, "swirl", 0, 0.5, 0.01).name("Swirl");
		fAnimation.add(params, "parallax", 0, 3, 0.05).name("Parallax");

		const fColors = gui.addFolder("Visuals & Colors");
		fColors
			.add(params, "colorScheme", Object.keys(COLOR_SCHEMES))
			.name("Color Scheme")
			.onChange((v) => {
				params.cubeColor = COLOR_SCHEMES[v].cubeColor;
				params.bgColor = COLOR_SCHEMES[v].bgColor;
				applyColors();
				updateGuiDisplay(gui);
			});
		fColors
			.addColor(params, "cubeColor")
			.name("Cube Color")
			.onChange(() => applyColors());
		fColors
			.addColor(params, "bgColor")
			.name("Background")
			.onChange(() => applyColors());
		fColors
			.add(params, "greenscreen")
			.name("Greenscreen (#00ff00)")
			.onChange(() => applyColors());

		const fRender = gui.addFolder("Rendering & Effects");
		fRender
			.add(params, "dpr", 0.5, 3, 0.1)
			.name("DPR (Pixel Ratio)")
			.onChange((v) => {
				renderer.setPixelRatio(v);
				composer.setSize(window.innerWidth, window.innerHeight);
			});
		fRender
			.add(params, "bloom", 0, 3, 0.01)
			.name("Bloom Strength")
			.onChange((v) => (bloomPass.strength = v));
		fRender
			.add(params, "bloomRadius", 0, 1, 0.01)
			.name("Bloom Radius")
			.onChange((v) => (bloomPass.radius = v));
		fRender
			.add(renderer, "toneMappingExposure", 0, 3, 0.01)
			.name("Exposure");

		const fInteractive = gui.addFolder("Interactivity");
		fInteractive
			.add(params, "randomOnClick")
			.name("Random On Click");

		// Hide / Show UI with "H" key
		let uiVisible = true;
		window.addEventListener("keydown", (e) => {
			if (e.key === "h" || e.key === "H") {
				uiVisible = !uiVisible;
				const displayVal = uiVisible ? "" : "none";
				gui.domElement.style.display = displayVal;
				document.querySelector("nav").style.display = displayVal;
				document.querySelector(".readout").style.display = displayVal;
				document.querySelector(".vignette").style.display = params.greenscreen ? "none" : displayVal;
			}
		});

		// Clock & Tick
		const clock = new THREE.Clock();
		const RECYCLE_Z = 4;

		const tick = () => {
			const delta = Math.min(clock.getDelta(), 0.05);
			const elapsedTime = clock.getElapsedTime();

			// Parallax & Smooth Camera Positioning
			mouse.x += (targetMouse.x - mouse.x) * 0.05;
			mouse.y += (targetMouse.y - mouse.y) * 0.05;

			const isStaticMode = params.animationMode === "Static Void (No Camera Movement)";

			if (isStaticMode) {
				camera.position.x = 0;
				camera.position.y = 0;
				camera.position.z = THREE.MathUtils.lerp(camera.position.z, cameraZoomZ, 0.1);
				camera.lookAt(0, 0, -20);
			} else {
				camera.position.x = mouse.x * params.parallax;
				camera.position.y = mouse.y * params.parallax;
				camera.position.z = THREE.MathUtils.lerp(camera.position.z, cameraZoomZ, 0.1);
				camera.lookAt(0, 0, -20);
			}

			// Dragging offset applied to tunnel
			currentDrag.x += (dragPos.x - currentDrag.x) * 0.1;
			currentDrag.y += (dragPos.y - currentDrag.y) * 0.1;
			tunnel.position.x = currentDrag.x;
			tunnel.position.y = currentDrag.y;

			// Animation modes custom motion
			if (params.animationMode === "Gentle Cosmic Drift") {
				tunnel.rotation.z += params.swirl * delta;
				tunnel.rotation.x = Math.sin(elapsedTime * 0.5) * 0.08;
				tunnel.rotation.y = Math.cos(elapsedTime * 0.4) * 0.08;
			} else if (params.animationMode === "Pulse & Wave Orbit") {
				tunnel.rotation.z += params.swirl * delta;
				const pulse = 1.0 + Math.sin(elapsedTime * 1.5) * 0.05;
				tunnel.scale.set(pulse, pulse, 1.0);
			} else if (params.animationMode === "Spiral Passage") {
				tunnel.rotation.z += (params.swirl + 0.2) * delta;
			} else if (params.animationMode === "Hyper Infinite Warp") {
				tunnel.rotation.z += params.swirl * delta;
			}

			// Move & recycle cubes along Z axis
			for (const c of cubes) {
				c.position.z += params.speed * delta;
				if (c.position.z > RECYCLE_Z) {
					c.position.z -= DEPTH;
				}
			}

			composer.render();
			requestAnimationFrame(tick);
		};

		applyColors();
		tick();

		// Resize listener
		window.addEventListener("resize", () => {
			camera.aspect = window.innerWidth / window.innerHeight;
			camera.updateProjectionMatrix();
			renderer.setSize(window.innerWidth, window.innerHeight);
			renderer.setPixelRatio(params.dpr);
			composer.setSize(window.innerWidth, window.innerHeight);
			fxaaPass.uniforms["resolution"].value.set(
				1 / window.innerWidth,
				1 / window.innerHeight
			);
		});
	</script>
</body>
</html>
