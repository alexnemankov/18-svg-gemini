<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Fishes Background</title>
  <style>
    body, html, #app {
      margin: 0;
      width: 100%;
      height: 100%;
      cursor: none;
    }

    #app {
      overflow: hidden;
      touch-action: pan-up;
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      text-align: center;
      text-shadow: 0 0 5px #000000, 0 0 20px #000;
      user-select: none;
    }

    #app h1 {
      --fontSize: 50px;
      --lineHeight: 70px;
      width: auto;
      height: calc(2 * var(--lineHeight));
      line-height: var(--lineHeight);
      margin: calc(50vh - var(--lineHeight)) auto 0;
      font-size: var(--fontSize);
    }

    #app a {
      margin-top: 10px;
      display: inline-block;
      text-decoration: none;
      color: #fff;
      cursor: pointer;
    }

    #app canvas {
      display: block;
      position: fixed;
      z-index: -1;
      top: 0;
    }

    /* Show normal cursor over settings UI root without altering lil-gui layout */
    .lil-gui.root, .lil-gui.root * {
      cursor: auto;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="hero">
      <h1>🐠<br/>BACKGROUND</h1>
      <a target="_blank" href="https://github.com/klevron/threejs-toys">github/threejs-toys</a>
    </div>
  </div>

  <input type="file" id="fish-file-input" accept="image/*" style="display: none;" />

  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.140.0/build/three.module.js';
    import { fishesBackground } from 'https://unpkg.com/threejs-toys@0.0.8/build/threejs-toys.module.cdn.min.js';
    import { GUI } from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

    // 5 Presetupped Color Schemes (Fit to scene, popular and original)
    const COLOR_SCHEMES = {
      'Deep Ocean Glow': {
        colors: ['#00e5ff', '#3b82f6', '#1d4ed8'],
        bg: '#031f48'
      },
      'Neon Cyber Reef': {
        colors: ['#ff007f', '#00f0ff', '#7928ca'],
        bg: '#0d0221'
      },
      'Golden Koi Pond': {
        colors: ['#ff4500', '#ffa500', '#ffd700'],
        bg: '#1a0f00'
      },
      'Bioluminescent Abyss': {
        colors: ['#00ffaa', '#0077ff', '#a855f7'],
        bg: '#02131e'
      },
      'Coral Pastel Dream': {
        colors: ['#ff9a9e', '#fecfef', '#a1c4fd'],
        bg: '#1c1b29'
      }
    };

    const initialScheme = COLOR_SCHEMES['Deep Ocean Glow'];
    const appEl = document.getElementById('app');

    // Initialize fishesBackground
    const bg = fishesBackground({
      el: appEl,
      eventsEl: appEl,
      gpgpuSize: 96,
      background: parseInt(initialScheme.bg.replace('#', '0x')),
      fogDensity: 0.025,
      texture: 'https://assets.codepen.io/33787/fishes.png',
      textureCount: 8,
      material: 'phong',
      materialParams: {
        transparent: true,
        alphaTest: 0.5
      },
      fishScale: [1, 1, 1],
      fishWidthSegments: 8,
      fishSpeed: 1.5,
      noiseCoordScale: 0.01,
      noiseTimeCoef: 0.0005,
      noiseIntensity: 0.0005,
      attractionRadius1: 50,
      attractionRadius2: 150,
      maxVelocity: 0.1,
      orbitControls: true
    });

    // Apply initial colors
    bg.setColors(initialScheme.colors);

    // Settings Parameters
    const params = {
      colorScheme: 'Deep Ocean Glow',
      fishColor1: initialScheme.colors[0],
      fishColor2: initialScheme.colors[1],
      fishColor3: initialScheme.colors[2],
      bgColor: initialScheme.bg,
      greenscreen: false,
      dpr: Math.min(window.devicePixelRatio || 1, 2),
      animSpeed: 1.5,
      animationPreset: 'Orbit Serenade',
      uploadTexture: () => {
        document.getElementById('fish-file-input').click();
      }
    };

    // Set initial DPR
    bg.three.renderer.setPixelRatio(params.dpr);

    // Helper functions to update visual aspects
    function updateFishColors() {
      bg.setColors([params.fishColor1, params.fishColor2, params.fishColor3]);
    }

    function updateBackground() {
      const activeColor = params.greenscreen ? '#00ff00' : params.bgColor;
      if (bg.three && bg.three.scene) {
        bg.three.scene.background = new THREE.Color(activeColor);
        if (bg.three.scene.fog) {
          bg.three.scene.fog.color = new THREE.Color(activeColor);
        }
      }
    }

    // 5 Presetupped Animations (Nice, smooth, slow + static without camera movement)
    let animTime = 0;

    function animateCamera() {
      requestAnimationFrame(animateCamera);

      if (params.animationPreset === 'Static (No Movement)') {
        return;
      }

      animTime += 0.005 * params.animSpeed;
      const camera = bg.three.camera;
      if (!camera) return;

      switch (params.animationPreset) {
        case 'Orbit Serenade': {
          const radius = 70;
          camera.position.x = Math.sin(animTime * 0.5) * radius;
          camera.position.z = Math.cos(animTime * 0.5) * radius;
          camera.position.y = 20 + Math.sin(animTime * 0.3) * 10;
          camera.lookAt(0, 0, 0);
          break;
        }
        case 'Ocean Drift': {
          camera.position.x = Math.sin(animTime * 0.8) * 25;
          camera.position.y = 20 + Math.cos(animTime * 0.6) * 12;
          camera.position.z = 70 + Math.sin(animTime * 0.4) * 15;
          camera.lookAt(0, 0, 0);
          break;
        }
        case 'Deep Dive & Rise': {
          camera.position.x = Math.sin(animTime * 0.3) * 10;
          camera.position.y = 25 + Math.sin(animTime * 0.7) * 25;
          camera.position.z = 70 + Math.cos(animTime * 0.3) * 15;
          camera.lookAt(0, 0, 0);
          break;
        }
        case 'Spiral Voyage': {
          const r = 60 + Math.sin(animTime * 0.4) * 20;
          camera.position.x = Math.sin(animTime * 0.6) * r;
          camera.position.z = Math.cos(animTime * 0.6) * r;
          camera.position.y = 20 + Math.sin(animTime * 0.5) * 15;
          camera.lookAt(0, 0, 0);
          break;
        }
      }
    }

    animateCamera();

    // Setup lil-gui settings UI
    const gui = new GUI({ title: 'Settings' });

    // Stop pointer/mouse event propagation on lil-gui root element so OrbitControls does not capture clicks
    ['pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup', 'click', 'touchstart', 'touchend', 'contextmenu', 'wheel'].forEach(eventType => {
      gui.domElement.addEventListener(eventType, (e) => {
        e.stopPropagation();
      });
    });

    // Presets Folder
    const schemeFolder = gui.addFolder('Presets');
    schemeFolder.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES))
      .name('Color Scheme')
      .onChange((name) => {
        const scheme = COLOR_SCHEMES[name];
        if (!scheme) return;
        fishColor1Ctrl.setValue(scheme.colors[0]);
        fishColor2Ctrl.setValue(scheme.colors[1]);
        fishColor3Ctrl.setValue(scheme.colors[2]);
        bgColorCtrl.setValue(scheme.bg);
      });

    schemeFolder.add(params, 'animationPreset', [
      'Static (No Movement)',
      'Orbit Serenade',
      'Ocean Drift',
      'Deep Dive & Rise',
      'Spiral Voyage'
    ]).name('Animation');

    // Colors Folder
    const colorFolder = gui.addFolder('Colors');
    const fishColor1Ctrl = colorFolder.addColor(params, 'fishColor1').name('Fish Color 1').onChange(() => updateFishColors());
    const fishColor2Ctrl = colorFolder.addColor(params, 'fishColor2').name('Fish Color 2').onChange(() => updateFishColors());
    const fishColor3Ctrl = colorFolder.addColor(params, 'fishColor3').name('Fish Color 3').onChange(() => updateFishColors());
    const bgColorCtrl = colorFolder.addColor(params, 'bgColor').name('Background').onChange(() => updateBackground());
    colorFolder.add(params, 'greenscreen').name('Green Screen (#00ff00)').onChange(() => updateBackground());

    // Simulation & Performance Folder
    const simFolder = gui.addFolder('Simulation & Performance');
    simFolder.add(params, 'dpr', 0.5, 2.5, 0.1).name('Pixel Ratio (DPR)').onChange((v) => {
      bg.three.renderer.setPixelRatio(v);
    });

    simFolder.add(params, 'animSpeed', 0.1, 4.0, 0.1).name('Speed').onChange((v) => {
      if (bg.uniforms && bg.uniforms.uFishSpeed) {
        bg.uniforms.uFishSpeed.value = v;
      }
    });

    // Custom Fish Texture Upload Folder
    const textureFolder = gui.addFolder('Custom Fishes');
    textureFolder.add(params, 'uploadTexture').name('Upload Fish Texture');

    // Fish Texture Upload Handler
    const fileInput = document.getElementById('fish-file-input');
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const url = URL.createObjectURL(file);
        new THREE.TextureLoader().load(url, (tex) => {
          bg.three.scene.traverse((child) => {
            if (child.material) {
              if (Array.isArray(child.material)) {
                child.material.forEach(m => { if (m.map !== undefined) { m.map = tex; m.needsUpdate = true; } });
              } else if (child.material.map !== undefined) {
                child.material.map = tex;
                child.material.needsUpdate = true;
              }
            }
          });
        });
      }
    });

    // Hide/show UI with "H" key
    const heroEl = document.getElementById('hero');
    let uiVisible = true;

    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        uiVisible = !uiVisible;
        if (uiVisible) {
          gui.show();
          if (heroEl) heroEl.style.display = 'block';
        } else {
          gui.hide();
          if (heroEl) heroEl.style.display = 'none';
        }
      }
    });
  </script>
</body>
</html>
