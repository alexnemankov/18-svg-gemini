<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebGL Ripple Grid</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }

    canvas {
      display: block;
    }

    .collection {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 1000;
      font-family: sans-serif;
    }

    .collection a {
      color: #fff;
      text-decoration: none;
      background: rgba(0, 0, 0, 0.5);
      padding: 8px 12px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <p class="collection">
    <a href="https://codepen.io/collection/AGZywR" target="_blank">WebGL Collection</a>
  </p>

  <!-- External Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chroma-js/2.4.2/chroma.min.js"></script>

  <script type="module">
    import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

    function App() {
      const conf = {
        el: 'canvas',
        fov: 75,
        cameraZ: 100,
      };

      let renderer, scene, camera, cameraCtrl;
      let width, height, cx, cy, wWidth, wHeight;

      let ripple;
      let gridWWidth, gridWHeight;
      let gridWidth, gridHeight;

      let pointLight1, pointLight2, pointLight3, pointLight4;
      let gridMaterial;

      const mouse = new THREE.Vector2();
      const mousePlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
      const mousePosition = new THREE.Vector3();
      const raycaster = new THREE.Raycaster();
      let mouseOver = false;

      // 5 presetupped popular & original color schemes
      const colorSchemes = {
        'Cyberpunk Neon': {
          light1: '#ffff80',
          light2: '#de3578',
          light3: '#ff4040',
          light4: '#0247e5',
          gridColor: '#ffffff',
          bgColor: '#000000'
        },
        'Midnight Aurora': {
          light1: '#00ffaa',
          light2: '#4a00e0',
          light3: '#8e2de2',
          light4: '#00c9ff',
          gridColor: '#e0ffff',
          bgColor: '#020b14'
        },
        'Sunset Synthwave': {
          light1: '#ffb347',
          light2: '#dd2476',
          light3: '#ff512f',
          light4: '#6b11ff',
          gridColor: '#ffedbc',
          bgColor: '#10051a'
        },
        'Bio Luminescence': {
          light1: '#a8ff78',
          light2: '#005c97',
          light3: '#00e5ff',
          light4: '#001133',
          gridColor: '#d4fc79',
          bgColor: '#01161e'
        },
        'Solar Lava': {
          light1: '#fff0a5',
          light2: '#ff4500',
          light3: '#ff0000',
          light4: '#8b0000',
          gridColor: '#ffcc00',
          bgColor: '#140202'
        }
      };

      const settings = {
        greenScreen: false,
        colorScheme: 'Cyberpunk Neon',
        gridColor: '#ffffff',
        light1Color: '#ffff80',
        light2Color: '#de3578',
        light3Color: '#ff4040',
        light4Color: '#0247e5',
        bgColor: '#000000',
        dpr: Math.min(window.devicePixelRatio || 1, 2),
        animSpeed: 1.0,
        animationMode: 'Gentle Wave Orbit',
      };

      const animationModes = [
        'Static (No Camera Move)',
        'Gentle Wave Orbit',
        'Breathing Top Down',
        'Cinematic Flythrough',
        'Spiral Horizon'
      ];

      let gui;
      let animTime = 0;
      let lastTime = performance.now();
      let folders = {};

      init();

      function init() {
        renderer = new THREE.WebGLRenderer({ canvas: document.getElementById(conf.el), antialias: true });
        renderer.setPixelRatio(settings.dpr);

        camera = new THREE.PerspectiveCamera(conf.fov);
        camera.position.z = conf.cameraZ;

        updateSize();
        window.addEventListener('resize', updateSize, false);

        gridWHeight = wHeight;
        gridWWidth = wWidth;
        gridWidth = gridWWidth * width / wWidth;
        gridHeight = gridWHeight * height / wHeight;

        ripple = new RippleEffect(renderer, width, height);

        const getGridMP = function (e) {
          const v = new THREE.Vector3();
          camera.getWorldDirection(v);
          v.normalize();
          mouse.x = ((e.clientX / width) * 2 - 1);
          mouse.y = (-(e.clientY / height) * 2 + 1);
          raycaster.setFromCamera(mouse, camera);
          raycaster.ray.intersectPlane(mousePlane, mousePosition);
          return { x: 2 * mousePosition.x / gridWWidth, y: 2 * mousePosition.y / gridWHeight };
        };

        renderer.domElement.addEventListener('mousemove', e => {
          mouseOver = true;
          const gp = getGridMP(e);
          ripple.addDrop(gp.x, gp.y, 0.05, 0.1);
        });
        renderer.domElement.addEventListener('mouseleave', e => { mouseOver = false; });

        initScene();
        initGUI();
        animate();
      }

      function initScene() {
        scene = new THREE.Scene();

        pointLight1 = new THREE.PointLight(settings.light1Color);
        pointLight1.position.set(-wWidth / 2, wHeight / 2, 50);
        scene.add(pointLight1);

        pointLight2 = new THREE.PointLight(settings.light2Color);
        pointLight2.position.set(wWidth / 2, wHeight / 2, 50);
        scene.add(pointLight2);

        pointLight3 = new THREE.PointLight(settings.light3Color);
        pointLight3.position.set(-wWidth / 2, -wHeight / 2, 50);
        scene.add(pointLight3);

        pointLight4 = new THREE.PointLight(settings.light4Color);
        pointLight4.position.set(wWidth / 2, -wHeight / 2, 50);
        scene.add(pointLight4);

        renderer.domElement.addEventListener('mouseup', e => {
          if (e.target === renderer.domElement) {
            settings.light1Color = chroma.random().hex();
            settings.light2Color = chroma.random().hex();
            settings.light3Color = chroma.random().hex();
            settings.light4Color = chroma.random().hex();
            updateLightColors();
            if (gui) {
              gui.controllers.forEach(c => c.updateDisplay());
              if (folders.colorFolder) folders.colorFolder.controllers.forEach(c => c.updateDisplay());
            }
          }
        });

        gridMaterial = new THREE.MeshStandardMaterial({
          color: settings.gridColor,
          side: THREE.DoubleSide,
          metalness: 0.5,
          roughness: 0.5,
          onBeforeCompile: shader => {
            shader.uniforms.hmap = { value: ripple.hMap.texture };
            shader.vertexShader = "uniform sampler2D hmap;\n" + shader.vertexShader;
            const token = '#include <begin_vertex>';
            const customTransform = `
              vec3 transformed = vec3(position);
              vec4 info = texture2D(hmap, uv);
              vNormal = vec3(info.b, sqrt(1.0 - dot(info.ba, info.ba)), info.a).xzy;
              transformed.z = 20. * info.r;
            `;
            shader.vertexShader = shader.vertexShader.replace(token, customTransform);
          }
        });

        let nx = Math.round(gridWidth / 2), ny = Math.round(gridHeight / 20);
        let dx = gridWWidth / nx, dy = gridWHeight / ny;
        for (let j = 0; j <= ny; j++) {
          const geometry = new THREE.BufferGeometry();
          const positions = [], uvs = [];
          const y = - gridWHeight / 2 + j * dy;
          for (let i = 0; i <= nx; i++) {
            positions.push(- gridWWidth / 2 + i * dx, y, 0);
            uvs.push(i / nx, j / ny);
          }
          geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
          geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
          geometry.computeBoundingSphere();
          scene.add(new THREE.Line(geometry, gridMaterial));
        }

        nx = Math.round(gridWidth / 20); ny = Math.round(gridHeight / 2);
        dx = gridWWidth / nx; dy = gridWHeight / ny;
        for (let i = 0; i <= nx; i++) {
          const geometry = new THREE.BufferGeometry();
          const positions = [], uvs = [];
          const x = - gridWWidth / 2 + i * dx;
          for (let j = 0; j <= ny; j++) {
            positions.push(x, - gridWHeight / 2 + j * dy, 0);
            uvs.push(i / nx, j / ny);
          }
          geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
          geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
          geometry.computeBoundingSphere();
          scene.add(new THREE.Line(geometry, gridMaterial));
        }

        camera.position.set(0, -gridWHeight / 2, 100);
        camera.lookAt(new THREE.Vector3(0, -gridWHeight / 6, 0));

        cameraCtrl = new THREE.OrbitControls(camera, renderer.domElement);
        cameraCtrl.enableDamping = true;
        cameraCtrl.dampingFactor = 0.1;
        cameraCtrl.rotateSpeed = 0.5;
        cameraCtrl.enableZoom = true;
        cameraCtrl.enablePan = true;
        cameraCtrl.screenSpacePanning = true;

        updateBackground();
      }

      function updateBackground() {
        if (settings.greenScreen) {
          scene.background = new THREE.Color(0x00ff00);
          renderer.setClearColor(0x00ff00, 1);
          document.body.style.backgroundColor = '#00ff00';
        } else {
          scene.background = new THREE.Color(settings.bgColor);
          renderer.setClearColor(new THREE.Color(settings.bgColor), 1);
          document.body.style.backgroundColor = settings.bgColor;
        }
      }

      function updateLightColors() {
        pointLight1.color.set(settings.light1Color);
        pointLight2.color.set(settings.light2Color);
        pointLight3.color.set(settings.light3Color);
        pointLight4.color.set(settings.light4Color);
      }

      function applyColorScheme(schemeName) {
        const scheme = colorSchemes[schemeName];
        if (!scheme) return;
        settings.light1Color = scheme.light1;
        settings.light2Color = scheme.light2;
        settings.light3Color = scheme.light3;
        settings.light4Color = scheme.light4;
        settings.gridColor = scheme.gridColor;
        settings.bgColor = scheme.bgColor;

        gridMaterial.color.set(settings.gridColor);
        updateLightColors();
        updateBackground();

        if (gui) {
          gui.controllers.forEach(c => c.updateDisplay());
          if (folders.colorFolder) folders.colorFolder.controllers.forEach(c => c.updateDisplay());
        }
      }

      function initGUI() {
        gui = new GUI({ title: 'Scene Settings' });

        // Greenscreen Toggle (#00ff00)
        gui.add(settings, 'greenScreen').name('Green Screen (#00ff00)').onChange(updateBackground);

        // DPR (Pixel Ratio)
        gui.add(settings, 'dpr', 0.5, 2.5, 0.1).name('Pixel Ratio (DPR)').onChange(val => {
          renderer.setPixelRatio(val);
        });

        // Animation Speed
        gui.add(settings, 'animSpeed', 0.0, 3.0, 0.1).name('Animation Speed');

        // 5 Presetupped Animations Dropdown
        gui.add(settings, 'animationMode', animationModes).name('Camera Animation');

        // 5 Presetupped Color Schemes Dropdown
        gui.add(settings, 'colorScheme', Object.keys(colorSchemes)).name('Preset Palette').onChange(applyColorScheme);

        // Custom Color Options
        folders.colorFolder = gui.addFolder('Colors');
        folders.colorFolder.addColor(settings, 'gridColor').name('Grid Color').onChange(v => gridMaterial.color.set(v));
        folders.colorFolder.addColor(settings, 'bgColor').name('Background Color').onChange(updateBackground);
        folders.colorFolder.addColor(settings, 'light1Color').name('Light 1').onChange(updateLightColors);
        folders.colorFolder.addColor(settings, 'light2Color').name('Light 2').onChange(updateLightColors);
        folders.colorFolder.addColor(settings, 'light3Color').name('Light 3').onChange(updateLightColors);
        folders.colorFolder.addColor(settings, 'light4Color').name('Light 4').onChange(updateLightColors);

        // Hide/Show UI with "H" key
        window.addEventListener('keydown', (e) => {
          if (e.key === 'h' || e.key === 'H') {
            if (gui.domElement.style.display === 'none') {
              gui.show();
            } else {
              gui.hide();
            }
          }
        });
      }

      function animate() {
        const now = performance.now();
        const delta = (now - lastTime) * 0.001;
        lastTime = now;

        animTime += delta * settings.animSpeed;

        if (!mouseOver) {
          const x = Math.cos(animTime) * 0.2;
          const y = Math.sin(animTime) * 0.2;
          ripple.addDrop(x, y, 0.05, -0.04);
        }

        const targetCenter = new THREE.Vector3(0, -gridWHeight / 6, 0);
        const baseCamY = -gridWHeight / 2;
        const baseCamZ = conf.cameraZ;

        switch (settings.animationMode) {
          case 'Gentle Wave Orbit': {
            const rad = 25 * Math.sin(animTime * 0.4);
            camera.position.x = rad;
            camera.position.z = baseCamZ + Math.cos(animTime * 0.4) * 12;
            camera.lookAt(targetCenter);
            break;
          }
          case 'Breathing Top Down': {
            camera.position.x = Math.sin(animTime * 0.3) * 10;
            camera.position.y = baseCamY + Math.sin(animTime * 0.5) * 15;
            camera.position.z = baseCamZ + Math.cos(animTime * 0.3) * 20;
            camera.lookAt(targetCenter);
            break;
          }
          case 'Cinematic Flythrough': {
            camera.position.x = Math.sin(animTime * 0.2) * 35;
            camera.position.y = baseCamY + Math.cos(animTime * 0.25) * 10;
            camera.lookAt(new THREE.Vector3(Math.sin(animTime * 0.2) * 10, -gridWHeight / 6, 0));
            break;
          }
          case 'Spiral Horizon': {
            const r = 30;
            camera.position.x = Math.cos(animTime * 0.25) * r;
            camera.position.y = baseCamY + Math.sin(animTime * 0.25) * 15;
            camera.position.z = baseCamZ + Math.sin(animTime * 0.25) * 15;
            camera.lookAt(targetCenter);
            break;
          }
          case 'Static (No Camera Move)':
          default:
            break;
        }

        cameraCtrl.update();
        ripple.update();
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      }

      function updateSize() {
        width = window.innerWidth; cx = width / 2;
        height = window.innerHeight; cy = height / 2;
        renderer.setSize(width, height);
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
        const wsize = getRendererSize();
        wWidth = wsize[0]; wHeight = wsize[1];
      }

      function getRendererSize() {
        const cam = new THREE.PerspectiveCamera(camera.fov, camera.aspect);
        const vFOV = (cam.fov * Math.PI) / 180;
        const height = 2 * Math.tan(vFOV / 2) * Math.abs(conf.cameraZ);
        const width = height * cam.aspect;
        return [width, height];
      }
    }

    const RippleEffect = (function () {
      function RippleEffect(renderer, width, height) {
        this.renderer = renderer;
        this.width = 512;
        this.height = 512;
        this.delta = new THREE.Vector2(1 / this.width, 1 / this.height);

        this.hMap = new THREE.WebGLRenderTarget(this.width, this.height, { type: THREE.FloatType, depthBuffer: false, stencilBuffer: false });
        this.hMap1 = new THREE.WebGLRenderTarget(this.width, this.height, { type: THREE.FloatType, depthBuffer: false, stencilBuffer: false });
        this.fsQuad = new FullScreenQuad();

        this.initShaders();
      }

      RippleEffect.prototype.initShaders = function () {
        const defaultVertexShader = `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `;

        this.copyMat = new THREE.ShaderMaterial({
          uniforms: { 'tDiffuse': { value: null } },
          vertexShader: defaultVertexShader,
          fragmentShader: `
            uniform sampler2D tDiffuse;
            varying vec2 vUv;
            void main() {
              gl_FragColor = texture2D(tDiffuse, vUv);
            }
          `,
        });

        this.updateMat = new THREE.ShaderMaterial({
          uniforms: {
            'tDiffuse': { value: null },
            'delta': new THREE.Uniform(this.delta),
          },
          vertexShader: defaultVertexShader,
          fragmentShader: `
            uniform sampler2D tDiffuse;
            uniform vec2 delta;
            varying vec2 vUv;
            void main() {
              vec4 texel = texture2D(tDiffuse, vUv);

              vec2 dx = vec2(delta.x, 0.0);
              vec2 dy = vec2(0.0, delta.y);
              float average = (
                texture2D(tDiffuse, vUv - dx).r +
                texture2D(tDiffuse, vUv - dy).r +
                texture2D(tDiffuse, vUv + dx).r +
                texture2D(tDiffuse, vUv + dy).r
              ) * 0.25;
              texel.g += (average - texel.r) * 2.0;
              texel.g *= 0.995;
              texel.r += texel.g;

              gl_FragColor = texel;
            }
          `,
        });

        this.normalsMat = new THREE.ShaderMaterial({
          uniforms: {
            'tDiffuse': { value: null },
            'delta': new THREE.Uniform(this.delta),
          },
          vertexShader: defaultVertexShader,
          fragmentShader: `
          uniform sampler2D tDiffuse;
          uniform vec2 delta;
          varying vec2 vUv;
          void main() {
            vec4 texel = texture2D(tDiffuse, vUv);
            vec3 dx = vec3(delta.x, texture2D(tDiffuse, vec2(vUv.x + delta.x, vUv.y)).r - texel.r, 0.0);
            vec3 dy = vec3(0.0, texture2D(tDiffuse, vec2(vUv.x, vUv.y + delta.y)).r - texel.r, delta.y);
            texel.ba = normalize(cross(dy, dx)).xz;
            gl_FragColor = texel;
          }
        `,
        });

        this.dropMat = new THREE.ShaderMaterial({
          uniforms: {
            'tDiffuse': { value: null },
            'center': new THREE.Uniform(new THREE.Vector2()),
            'radius': { value: 0.05 },
            'strength': { value: 0.5 },
          },
          vertexShader: defaultVertexShader,
          fragmentShader: `
            const float PI = 3.1415926535897932384626433832795;
            uniform sampler2D tDiffuse;
            uniform vec2 center;
            uniform float radius;
            uniform float strength;
            varying vec2 vUv;
            void main() {
              vec4 texel = texture2D(tDiffuse, vUv);
              float drop = max(0.0, 1.0 - length(center * 0.5 + 0.5 - vUv) / radius);
              drop = 0.5 - cos(drop * PI) * 0.5;
              texel.r += drop * strength;
              gl_FragColor = texel;
            }
          `,
        });
      };

      RippleEffect.prototype.update = function () {
        this.updateHMap();
        this.updateHMapNormals();
      };

      RippleEffect.prototype.updateHMap = function () {
        this.updateMat.uniforms.tDiffuse.value = this.hMap.texture;
        this.renderShaderMat(this.updateMat, this.hMap1);
        this.swapBuffers();
      };

      RippleEffect.prototype.updateHMapNormals = function () {
        this.normalsMat.uniforms.tDiffuse.value = this.hMap.texture;
        this.renderShaderMat(this.normalsMat, this.hMap1);
        this.swapBuffers();
      };

      RippleEffect.prototype.addDrop = function (x, y, radius, strength) {
        this.dropMat.uniforms.tDiffuse.value = this.hMap.texture;
        this.dropMat.uniforms.center.value.set(x, y);
        this.dropMat.uniforms.radius.value = radius;
        this.dropMat.uniforms.strength.value = strength;
        this.renderShaderMat(this.dropMat, this.hMap1);
        this.swapBuffers();
      };

      RippleEffect.prototype.renderBuffer = function (buffer, target) {
        target = target ? target : null;
        this.copyMat.uniforms.tDiffuse.value = buffer.texture;
        this.renderShaderMat(this.copyMat, target);
      };

      RippleEffect.prototype.renderShaderMat = function (mat, target) {
        this.fsQuad.material = mat;
        const oldTarget = this.renderer.getRenderTarget();
        this.renderer.setRenderTarget(target);
        this.fsQuad.render(this.renderer);
        this.renderer.setRenderTarget(oldTarget);
      };

      RippleEffect.prototype.swapBuffers = function () {
        const temp = this.hMap;
        this.hMap = this.hMap1;
        this.hMap1 = temp;
      };

      const FullScreenQuad = (function () {
        const camera = new THREE.OrthographicCamera(- 1, 1, 1, - 1, 0, 1);
        const geometry = new THREE.PlaneBufferGeometry(2, 2);

        const FullScreenQuad = function (material) {
          this._mesh = new THREE.Mesh(geometry, material);
        };

        Object.defineProperty(FullScreenQuad.prototype, 'material', {
          get: function () { return this._mesh.material; },
          set: function (value) { this._mesh.material = value; }
        });

        Object.assign(FullScreenQuad.prototype, {
          render: function (renderer) {
            renderer.render(this._mesh, camera);
          }
        });

        return FullScreenQuad;
      })();

      return RippleEffect;
    })();

    App();
  </script>
</body>
</html>
