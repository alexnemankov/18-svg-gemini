<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>534 - Undulating Hexagonal Lattice</title>
  <style>
    * {
      padding: 0;
      margin: 0;
      overflow: hidden;
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #000000;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
      }
    }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import GUI from 'lil-gui';

    // 19 Preconfigured Color Schemes
    const COLOR_SCHEMES = {
      'Original': {
        bg: '#000000',
        colors: ['#ffffff', '#f0f0f0', '#ffffff', '#e4e4e4', '#ffffff']
      },
      'Monochromatic': {
        bg: '#060d17',
        colors: ['#001f54', '#034078', '#1282a2', '#00a6fb', '#90e0ef']
      },
      'Analogous': {
        bg: '#140508',
        colors: ['#ff0a54', '#ff477e', '#ff70a6', '#ff99c8', '#ffd166']
      },
      'Complementary': {
        bg: '#070e17',
        colors: ['#0077b6', '#00b4d8', '#ff7700', '#ff9e00', '#ffc300']
      },
      'Split-complementary': {
        bg: '#061314',
        colors: ['#06d6a0', '#118ab2', '#ffd166', '#f78c6b', '#ef476f']
      },
      'Triadic': {
        bg: '#0d0614',
        colors: ['#7209b7', '#3a0ca3', '#4cc9f0', '#fee440', '#f72585']
      },
      'Tetradic': {
        bg: '#080c14',
        colors: ['#ff595e', '#ffca3a', '#8ac926', '#1982c4', '#6a4c93']
      },
      'Double split-complementary': {
        bg: '#0b0716',
        colors: ['#3d348b', '#7678ed', '#f7b801', '#f18701', '#f35b04']
      },
      'Achromatic': {
        bg: '#000000',
        colors: ['#ffffff', '#cccccc', '#888888', '#444444', '#ffffff']
      },
      'Achromatic + Accent': {
        bg: '#0a0a0a',
        colors: ['#ffffff', '#cccccc', '#666666', '#ff1744', '#b71c1c']
      },
      'Neutral + accent': {
        bg: '#181716',
        colors: ['#dcd6cd', '#a8a29e', '#78716c', '#44403c', '#00e5ff']
      },
      'Palette 1 (Ember)': {
        bg: '#220901',
        colors: ['#F6AA1C', '#BC3908', '#941B0C', '#F6AA1C', '#220901']
      },
      'Palette 2 (Cyber Ocean)': {
        bg: '#0B132B',
        colors: ['#63D1CF', '#5BC0BE', '#4BAD9E', '#4BAD9E', '#0B132B', '#000000']
      },
      'Palette 3 (Lavender Dream)': {
        bg: '#0D001D',
        colors: ['#AA60C8', '#D69ADE', '#C9A3C6', '#CFB5C2', '#0D001D', '#120A12']
      },
      'Palette 4 (Golden Teal)': {
        bg: '#061210',
        colors: ['#FEF1BE', '#FFBA00', '#008189', '#00474D', '#061210']
      },
      'Palette 5 (Neon Bio)': {
        bg: '#05140A',
        colors: ['#D4FFB0', '#7FFF00', '#00B894', '#0A3322', '#05140A']
      },
      'Palette 6 (Sunset Violet)': {
        bg: '#0E0618',
        colors: ['#FFE8CC', '#FF8C00', '#C7501A', '#3D1050', '#0E0618']
      },
      'Palette 7 (Cosmic Indigo)': {
        bg: '#090612',
        colors: ['#E8E0FF', '#B38FFF', '#6A3DE8', '#1A1250', '#090612']
      },
      'Palette 8 (Synthwave Neon)': {
        bg: '#05020F',
        colors: ['#E0FBFF', '#00F0FF', '#D40078', '#1E0A3D', '#05020F']
      }
    };

    const ANIMATION_PRESETS = [
      'Static',
      'Slow Orbit',
      'Gentle Elevation Bob',
      'Radial Breath',
      'Spiral Ascent',
      'Figure Eight (Lissajous)',
      'Dramatic Low Angle',
      'Top-Down Zen Vortex'
    ];

    // Master configuration settings
    const params = {
      // Greenscreen & Colors
      greenscreen: false,
      backgroundColor: '#000000',
      colorScheme: 'Original',
      colorMode: 'Wave Height',
      customColor: '#ffffff',
      roughness: 0.3,
      metalness: 0.2,

      // Geometry & Wave
      rings: 24,
      sphereRadius: 10,
      elevationHeight: 50,
      waveFreq: 0.03,
      ringSpacing: 20,

      // Animation & Camera
      animationPreset: 'Slow Orbit',
      animSpeed: 1.0,
      waveSpeed: 1.0,

      // Lighting & Exposure
      exposure: 1.0,
      ambientIntensity: 0.6,
      ambientColor: '#ffffff',
      dirIntensity: 1.8,
      dirColor: '#ffffff',
      dirX: 250,
      dirY: 450,
      dirZ: 300,
      pointIntensity: 2.0,
      pointColor: '#60a5fa',
      pointX: -250,
      pointY: 180,
      pointZ: -250,
      hemiIntensity: 0.5,
      hemiSkyColor: '#ffffff',
      hemiGroundColor: '#1e293b',

      // Render & Interaction
      dpr: Math.min(window.devicePixelRatio || 1, 2),
      antialias: true,
      clickRandomize: true,
      guiVisible: true
    };

    // Scene & Camera Setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(params.backgroundColor);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 6000);
    camera.position.set(0, 420, 680);

    // Renderer setup
    let renderer = new THREE.WebGLRenderer({
      antialias: params.antialias,
      powerPreference: 'high-performance'
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(params.dpr);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = params.exposure;
    renderer.setClearColor(params.backgroundColor, 1.0);
    document.body.appendChild(renderer.domElement);

    // OrbitControls setup
    let controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.screenSpacePanning = true; // Drag object across screen!
    controls.minDistance = 30;
    controls.maxDistance = 3500;
    controls.target.set(0, 0, 0);

    // Spherical camera tracking for smooth animations that respect user zoom and angle
    const spherical = new THREE.Spherical();
    spherical.setFromVector3(camera.position.clone().sub(controls.target));
    let userBaseRadius = spherical.radius;
    let userBasePolar = spherical.phi;
    let isUserInteracting = false;

    controls.addEventListener('start', () => {
      isUserInteracting = true;
    });

    controls.addEventListener('end', () => {
      isUserInteracting = false;
      const offset = camera.position.clone().sub(controls.target);
      spherical.setFromVector3(offset);
      userBaseRadius = spherical.radius;
      userBasePolar = spherical.phi;
    });

    // Capture zoom wheel to update user base zoom dynamically without resetting during animation
    window.addEventListener('wheel', () => {
      requestAnimationFrame(() => {
        userBaseRadius = camera.position.distanceTo(controls.target);
      });
    }, { passive: true });

    // Lighting Setup
    const ambientLight = new THREE.AmbientLight(params.ambientColor, params.ambientIntensity);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(params.dirColor, params.dirIntensity);
    dirLight.position.set(params.dirX, params.dirY, params.dirZ);
    scene.add(dirLight);

    const pointLight = new THREE.PointLight(params.pointColor, params.pointIntensity, 2500);
    pointLight.position.set(params.pointX, params.pointY, params.pointZ);
    scene.add(pointLight);

    const hemiLight = new THREE.HemisphereLight(params.hemiSkyColor, params.hemiGroundColor, params.hemiIntensity);
    scene.add(hemiLight);

    // Geometry & InstancedMesh setup
    const MAX_RINGS = 34;
    const MAX_INSTANCES = (MAX_RINGS * (MAX_RINGS - 1) / 2) * 6; // ~3366 instances

    const sphereGeometry = new THREE.SphereGeometry(1, 24, 16);
    const sphereMaterial = new THREE.MeshStandardMaterial({
      roughness: params.roughness,
      metalness: params.metalness,
      envMapIntensity: 1.0
    });

    const instancedMesh = new THREE.InstancedMesh(sphereGeometry, sphereMaterial, MAX_INSTANCES);
    instancedMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    instancedMesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(MAX_INSTANCES * 3), 3);
    instancedMesh.instanceColor.setUsage(THREE.DynamicDrawUsage);
    scene.add(instancedMesh);

    // Wave computation buffers
    const dummy = new THREE.Object3D();
    const tempColor = new THREE.Color();
    const c1 = new THREE.Color();
    const c2 = new THREE.Color();
    let wavePhase = 0;

    function samplePalette(colors, t, targetColor) {
      t = Math.max(0, Math.min(1, t));
      const n = colors.length - 1;
      const p = t * n;
      const idx = Math.floor(p);
      const frac = p - idx;
      if (idx >= n) {
        targetColor.set(colors[n]);
      } else {
        c1.set(colors[idx]);
        c2.set(colors[idx + 1]);
        targetColor.copy(c1).lerp(c2, frac);
      }
      return targetColor;
    }

    function updateWave(dt) {
      wavePhase += dt * params.waveSpeed * 2.0;

      const currentScheme = COLOR_SCHEMES[params.colorScheme] || COLOR_SCHEMES['Original'];
      const palette = currentScheme.colors;
      const rings = params.rings;
      const spacing = params.ringSpacing;
      const baseSize = params.sphereRadius;
      const elevation = params.elevationHeight;
      const waveFreq = params.waveFreq;
      const colorMode = params.colorMode;
      const customColor = new THREE.Color(params.customColor);

      let idx = 0;

      for (let i = 1; i < rings; i++) {
        const ringCount = i * 6;
        const ringRadius = spacing * i;
        const ringNorm = i / rings;

        for (let j = 0; j < ringCount; j++) {
          if (idx >= MAX_INSTANCES) break;

          const angle = (Math.PI * 2 / ringCount) * j;
          const cx = Math.cos(angle) * ringRadius;
          const cz = Math.sin(angle) * ringRadius;

          const dist = Math.sqrt(cx * cx + cz * cz) * waveFreq;
          const theta = Math.atan2(cz, cx);

          // Canonical wave formula from original snippet
          const s = Math.sin(Math.sin(theta * (Math.PI / 180)) + dist - wavePhase) + 1;
          const posY = Math.sin(s / 2) * elevation;
          const scale = (baseSize / 2) * Math.max(0.08, s);

          dummy.position.set(cx, posY, cz);
          dummy.scale.set(scale, scale, scale);
          dummy.updateMatrix();
          instancedMesh.setMatrixAt(idx, dummy.matrix);

          // Color calculation
          if (colorMode === 'Wave Height') {
            samplePalette(palette, s / 2, tempColor);
          } else if (colorMode === 'Radial Ring') {
            samplePalette(palette, ringNorm, tempColor);
          } else if (colorMode === 'Spiral Angle') {
            samplePalette(palette, (theta + Math.PI) / (Math.PI * 2), tempColor);
          } else if (colorMode === 'Wave & Ring Mix') {
            samplePalette(palette, (s / 2) * 0.65 + ringNorm * 0.35, tempColor);
          } else {
            tempColor.copy(customColor);
          }

          instancedMesh.setColorAt(idx, tempColor);
          idx++;
        }
      }

      instancedMesh.count = idx;
      instancedMesh.instanceMatrix.needsUpdate = true;
      if (instancedMesh.instanceColor) {
        instancedMesh.instanceColor.needsUpdate = true;
      }
    }

    // Apply Background & Greenscreen
    function applyBackground() {
      if (params.greenscreen) {
        renderer.setClearColor(0x00ff00, 1.0);
        scene.background = new THREE.Color(0x00ff00);
      } else {
        renderer.setClearColor(new THREE.Color(params.backgroundColor), 1.0);
        scene.background = new THREE.Color(params.backgroundColor);
      }
    }

    // Rebuild Renderer for Antialias setting changes
    function rebuildRenderer() {
      const oldCanvas = renderer.domElement;
      const width = window.innerWidth;
      const height = window.innerHeight;

      renderer.dispose();
      if (oldCanvas.parentElement) {
        oldCanvas.parentElement.removeChild(oldCanvas);
      }

      renderer = new THREE.WebGLRenderer({
        antialias: params.antialias,
        powerPreference: 'high-performance'
      });
      renderer.setSize(width, height);
      renderer.setPixelRatio(params.dpr);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = params.exposure;
      applyBackground();
      document.body.appendChild(renderer.domElement);

      controls.domElement = renderer.domElement;
      controls.connect();
    }

    // Initialize UI with lil-gui
    const gui = new GUI({ title: 'Scene Controls' });

    function updateAllGuiDisplays(folder = gui) {
      if (!folder) return;
      if (folder.controllers) {
        folder.controllers.forEach(c => c.updateDisplay());
      }
      if (folder.folders) {
        folder.folders.forEach(f => updateAllGuiDisplays(f));
      }
    }

    // Colors & Theme Folder
    const fTheme = gui.addFolder('Colors & Themes');
    fTheme.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Scheme').onChange(schemeName => {
      const sc = COLOR_SCHEMES[schemeName];
      if (sc) {
        params.backgroundColor = sc.bg;
        applyBackground();
        updateAllGuiDisplays();
      }
    });

    fTheme.add(params, 'greenscreen').name('Greenscreen (#00ff00)').onChange(() => {
      applyBackground();
    });

    fTheme.addColor(params, 'backgroundColor').name('Background Color').onChange(() => {
      params.greenscreen = false;
      applyBackground();
      updateAllGuiDisplays();
    });

    fTheme.add(params, 'colorMode', ['Wave Height', 'Radial Ring', 'Spiral Angle', 'Wave & Ring Mix', 'Uniform']).name('Color Mode');
    fTheme.addColor(params, 'customColor').name('Custom Color');
    fTheme.add(params, 'roughness', 0, 1, 0.01).name('Roughness').onChange(v => { sphereMaterial.roughness = v; });
    fTheme.add(params, 'metalness', 0, 1, 0.01).name('Metalness').onChange(v => { sphereMaterial.metalness = v; });

    // Camera & Motion Folder
    const fCamera = gui.addFolder('Camera & Motion');
    fCamera.add(params, 'animationPreset', ANIMATION_PRESETS).name('Animation');
    fCamera.add(params, 'animSpeed', 0.0, 3.0, 0.05).name('Animation Speed');
    fCamera.add(params, 'waveSpeed', 0.1, 3.0, 0.05).name('Wave Speed');

    // Geometry & Wave Folder
    const fGeometry = gui.addFolder('Geometry & Wave');
    fGeometry.close();
    fGeometry.add(params, 'rings', 12, 32, 1).name('Rings');
    fGeometry.add(params, 'sphereRadius', 2, 22, 0.5).name('Base Size');
    fGeometry.add(params, 'elevationHeight', 0, 150, 1).name('Wave Height');
    fGeometry.add(params, 'waveFreq', 0.005, 0.08, 0.001).name('Frequency');
    fGeometry.add(params, 'ringSpacing', 10, 35, 1).name('Ring Spacing');

    // Lighting & Exposure Folder
    const fLight = gui.addFolder('Lighting & Exposure');
    fLight.close();
    fLight.add(params, 'exposure', 0.1, 3.0, 0.05).name('Exposure').onChange(v => {
      renderer.toneMappingExposure = v;
    });

    const fAmbient = fLight.addFolder('Ambient Light');
    fAmbient.close();
    fAmbient.add(params, 'ambientIntensity', 0, 3.0, 0.05).name('Intensity').onChange(v => { ambientLight.intensity = v; });
    fAmbient.addColor(params, 'ambientColor').name('Color').onChange(v => { ambientLight.color.set(v); });

    const fDir = fLight.addFolder('Key Light (Directional)');
    fDir.close();
    fDir.add(params, 'dirIntensity', 0, 5.0, 0.1).name('Intensity').onChange(v => { dirLight.intensity = v; });
    fDir.addColor(params, 'dirColor').name('Color').onChange(v => { dirLight.color.set(v); });
    fDir.add(params, 'dirX', -600, 600, 10).name('Pos X').onChange(() => { dirLight.position.set(params.dirX, params.dirY, params.dirZ); });
    fDir.add(params, 'dirY', 50, 800, 10).name('Pos Y').onChange(() => { dirLight.position.set(params.dirX, params.dirY, params.dirZ); });
    fDir.add(params, 'dirZ', -600, 600, 10).name('Pos Z').onChange(() => { dirLight.position.set(params.dirX, params.dirY, params.dirZ); });

    const fPoint = fLight.addFolder('Accent Light (Point)');
    fPoint.close();
    fPoint.add(params, 'pointIntensity', 0, 5.0, 0.1).name('Intensity').onChange(v => { pointLight.intensity = v; });
    fPoint.addColor(params, 'pointColor').name('Color').onChange(v => { pointLight.color.set(v); });
    fPoint.add(params, 'pointX', -600, 600, 10).name('Pos X').onChange(() => { pointLight.position.set(params.pointX, params.pointY, params.pointZ); });
    fPoint.add(params, 'pointY', 0, 600, 10).name('Pos Y').onChange(() => { pointLight.position.set(params.pointX, params.pointY, params.pointZ); });
    fPoint.add(params, 'pointZ', -600, 600, 10).name('Pos Z').onChange(() => { pointLight.position.set(params.pointX, params.pointY, params.pointZ); });

    const fHemi = fLight.addFolder('Fill Light (Hemisphere)');
    fHemi.close();
    fHemi.add(params, 'hemiIntensity', 0, 3.0, 0.05).name('Intensity').onChange(v => { hemiLight.intensity = v; });
    fHemi.addColor(params, 'hemiSkyColor').name('Sky Color').onChange(v => { hemiLight.color.set(v); });
    fHemi.addColor(params, 'hemiGroundColor').name('Ground Color').onChange(v => { hemiLight.groundColor.set(v); });

    // Render & Controls Folder
    const fRender = gui.addFolder('Render & Controls');
    fRender.close();
    fRender.add(params, 'dpr', 0.5, 3.0, 0.1).name('DPR (Pixel Ratio)').onChange(v => {
      renderer.setPixelRatio(v);
    });
    fRender.add(params, 'antialias').name('Antialias').onChange(() => {
      rebuildRenderer();
    });
    fRender.add(params, 'clickRandomize').name('Click to Re-roll Scene');

    // Procedural Theme & Geometry Randomizer on Scene Click
    function randomizeScene() {
      // Pick random color scheme
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      params.colorScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      const sc = COLOR_SCHEMES[params.colorScheme];
      if (sc && !params.greenscreen) {
        params.backgroundColor = sc.bg;
      }
      applyBackground();

      // Re-roll geometric parameters
      params.rings = Math.floor(Math.random() * 10) + 18; // 18 to 27
      params.sphereRadius = Math.round((Math.random() * 8 + 6) * 10) / 10; // 6 to 14
      params.elevationHeight = Math.round(Math.random() * 55 + 35); // 35 to 90
      params.waveFreq = Math.round((Math.random() * 0.025 + 0.02) * 1000) / 1000;
      params.ringSpacing = Math.round(Math.random() * 10 + 16);
      params.roughness = Math.round((Math.random() * 0.5 + 0.15) * 100) / 100;
      params.metalness = Math.round((Math.random() * 0.6 + 0.1) * 100) / 100;
      sphereMaterial.roughness = params.roughness;
      sphereMaterial.metalness = params.metalness;

      // Re-roll motion & animation parameters
      params.animSpeed = Math.round((Math.random() * 0.8 + 0.6) * 100) / 100;
      params.waveSpeed = Math.round((Math.random() * 0.8 + 0.7) * 100) / 100;
      params.animationPreset = ANIMATION_PRESETS[Math.floor(Math.random() * ANIMATION_PRESETS.length)];

      // Re-roll color mapping mode
      const modes = ['Wave Height', 'Radial Ring', 'Spiral Angle', 'Wave & Ring Mix'];
      params.colorMode = modes[Math.floor(Math.random() * modes.length)];

      // Re-roll lighting
      params.exposure = Math.round((Math.random() * 0.6 + 0.8) * 100) / 100;
      renderer.toneMappingExposure = params.exposure;
      params.dirIntensity = Math.round((Math.random() * 1.5 + 1.2) * 100) / 100;
      dirLight.intensity = params.dirIntensity;
      params.pointIntensity = Math.round((Math.random() * 2.0 + 1.2) * 100) / 100;
      pointLight.intensity = params.pointIntensity;

      updateAllGuiDisplays();
    }

    // Pointer click vs drag detection
    let pointerDownX = 0;
    let pointerDownY = 0;
    let pointerDownTime = 0;
    let pointerMoved = false;

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest && e.target.closest('.lil-gui')) return;
      pointerDownX = e.clientX;
      pointerDownY = e.clientY;
      pointerDownTime = performance.now();
      pointerMoved = false;
    });

    window.addEventListener('pointermove', (e) => {
      if (Math.hypot(e.clientX - pointerDownX, e.clientY - pointerDownY) > 6) {
        pointerMoved = true;
      }
    });

    window.addEventListener('pointerup', (e) => {
      if (e.target.closest && e.target.closest('.lil-gui')) return;
      const dist = Math.hypot(e.clientX - pointerDownX, e.clientY - pointerDownY);
      const duration = performance.now() - pointerDownTime;

      // Only trigger if it was a quick static click, not a drag/orbit/pan gesture
      if (!pointerMoved && dist < 6 && duration < 350) {
        if (params.clickRandomize) {
          randomizeScene();
        }
      }
    });

    // Keyboard shortcut 'H' to hide/show lil-gui
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        params.guiVisible = !params.guiVisible;
        if (gui.domElement) {
          gui.domElement.style.display = params.guiVisible ? '' : 'none';
        }
      }
    });

    // Window Resize Handling
    window.addEventListener('resize', () => {
      const width = window.innerWidth;
      const height = window.innerHeight;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    });

    // Render loop variables
    let animClock = 0;
    let lastTime = performance.now();

    // Auto Infinite Animation Loop
    function animate() {
      requestAnimationFrame(animate);

      const now = performance.now();
      const dt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;

      const animDelta = dt * params.animSpeed;
      animClock += animDelta;

      // Camera animations that respect manual zoom, drag, and rotation
      if (params.animationPreset === 'Static') {
        controls.update();
      } else {
        if (isUserInteracting) {
          // While user is dragging or zooming, controls take full precedence
          controls.update();
          const offset = camera.position.clone().sub(controls.target);
          spherical.setFromVector3(offset);
          userBaseRadius = spherical.radius;
          userBasePolar = spherical.phi;
        } else {
          // Read current spherical coordinates relative to controls.target
          spherical.setFromVector3(camera.position.clone().sub(controls.target));

          switch (params.animationPreset) {
            case 'Slow Orbit':
              spherical.theta += 0.15 * animDelta;
              break;

            case 'Gentle Elevation Bob':
              spherical.theta += 0.12 * animDelta;
              spherical.phi = THREE.MathUtils.clamp(
                userBasePolar + Math.sin(animClock * 0.7) * 0.22,
                0.12,
                Math.PI * 0.48
              );
              break;

            case 'Radial Breath':
              spherical.theta += 0.08 * animDelta;
              // Smoothly pulsate distance around user's chosen zoom
              spherical.radius = THREE.MathUtils.clamp(
                userBaseRadius * (1 + 0.14 * Math.sin(animClock * 0.5)),
                40,
                3000
              );
              break;

            case 'Spiral Ascent':
              spherical.theta += 0.22 * animDelta;
              spherical.phi = THREE.MathUtils.clamp(
                userBasePolar + Math.sin(animClock * 0.3) * 0.35,
                0.15,
                Math.PI * 0.48
              );
              break;

            case 'Figure Eight (Lissajous)':
              spherical.theta += (0.1 + Math.sin(animClock * 0.35) * 0.2) * animDelta;
              spherical.phi = THREE.MathUtils.clamp(
                userBasePolar + Math.sin(animClock * 0.7) * 0.18,
                0.15,
                Math.PI * 0.48
              );
              break;

            case 'Dramatic Low Angle':
              spherical.theta += 0.16 * animDelta;
              spherical.phi = THREE.MathUtils.clamp(
                1.44 + Math.sin(animClock * 0.4) * 0.07,
                1.25,
                1.54
              );
              break;

            case 'Top-Down Zen Vortex':
              spherical.theta += 0.1 * animDelta;
              spherical.phi = THREE.MathUtils.clamp(
                0.22 + Math.sin(animClock * 0.3) * 0.05,
                0.08,
                0.45
              );
              break;
          }

          // Apply new animated position relative to target
          const offset = new THREE.Vector3().setFromSpherical(spherical);
          camera.position.copy(controls.target).add(offset);
          camera.lookAt(controls.target);
          controls.update();
        }
      }

      // Update geometry waves & instanced mesh
      updateWave(animDelta);

      // Render
      renderer.render(scene, camera);
    }

    // Start auto infinite animation
    animate();
  </script>
</body>
</html>
