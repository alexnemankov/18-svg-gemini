    // =========================================================================
    // Hilbert Curve 2D Generator
    // =========================================================================
    function generateHilbertSegments(depth, totalSpan) {
      const segments = [];
      const gridSteps = Math.pow(2, depth) - 1;
      const stepLength = totalSpan / (gridSteps || 1);
      let angle = 0;
      let startX = -totalSpan / 2;
      let startY = -totalSpan / 2;

      function turn(deg) {
        angle += deg;
      }

      function step() {
        const rad = angle * Math.PI / 180;
        const nx = Math.cos(rad) * stepLength + startX;
        const ny = Math.sin(rad) * stepLength + startY;
        const mx = (startX + nx) * 0.5;
        const my = (startY + ny) * 0.5;
        const dist = Math.sqrt(mx * mx + my * my);
        const atan = Math.atan2(my, mx);

        segments.push({
          x1: startX,
          y1: startY,
          x2: nx,
          y2: ny,
          mx: mx,
          my: my,
          dist: dist,
          atan: atan
        });

        startX = nx;
        startY = ny;
      }

      function fractal(a, d) {
        if (d > 0) {
          turn(a);
          fractal(-a, d - 1);
          step();
          turn(-a);
          fractal(a, d - 1);
          step();
          fractal(a, d - 1);
          turn(-a);
          step();
          fractal(-a, d - 1);
          turn(a);
        }
      }

      fractal(90, depth);
      return segments;
    }

    // =========================================================================
    // Main Application Class
    // =========================================================================
    class HilbertApp {
      constructor() {
        this.container = document.getElementById('canvas-container');
        this.width = window.innerWidth;
        this.height = window.innerHeight;

        // Default parameters & settings
        this.settings = {
          // Color Scheme & Background
          colorScheme: 'Original',
          greenscreen: false,
          backgroundColor: '#000000',
          layer1Color: '#FF0000',
          layer2Color: '#00FF00',
          layer3Color: '#0000FF',
          emissiveIntensity: 0.45,
          roughness: 0.35,
          metalness: 0.65,

          // Animation & Motion
          cameraAnimation: 'Gentle Orbit',
          animationSpeed: 1.0,
          waveSpeed: 1.6,
          waveType: 'Original Tan Waves',
          waveAmpY: 2.2,
          waveAmpZ: 3.5,
          waveAmpX: 0.6,
          waveFreq: 0.14,
          layerPhase: 0.16,
          zLayerSpacing: 0.75,

          // Lighting & Exposure
          exposure: 1.15,
          sceneLightIntensity: 1.0,
          dirLightIntensity: 1.4,
          dirLightColor: '#ffffff',
          ambientIntensity: 0.4,
          ambientColor: '#222222',
          pointLight1Intensity: 1.8,
          pointLight1Color: '#ff0055',
          pointLight2Intensity: 1.8,
          pointLight2Color: '#00e5ff',

          // Geometry & Layers
          fractalDepth: 5,
          totalSpan: 28.0,
          tubeRadius: 0.08,
          showTubes: true,
          showLaserGlow: true,
          laserOpacity: 0.65,
          showJointSpheres: true,
          jointRadius: 0.10,

          // Controls & Navigation
          leftMouseAction: 'Rotate Camera',
          clickToRandomize: true,

          // Renderer
          dpr: Math.min(window.devicePixelRatio || 1, 2),
          antialias: true
        };

        // Interaction state
        this.animTimer = 0;
        this.userDistance = 44.0;
        this.isUserInteracting = false;
        this.clock = new THREE.Clock();

        // Cached math objects for zero-allocation animation loop
        this._p1 = new THREE.Vector3();
        this._p2 = new THREE.Vector3();
        this._mid = new THREE.Vector3();
        this._dir = new THREE.Vector3();
        this._up = new THREE.Vector3(0, 1, 0);
        this._quat = new THREE.Quaternion();
        this._scale = new THREE.Vector3();
        this._mat = new THREE.Matrix4();

        // Layer objects
        this.layers = [];
        this.sparkParticles = null;

        // Initialize application
        this.initRenderer();
        this.initScene();
        this.setupCamera();
        this.setupControls();
        this.setupLights();
        this.buildFractalGeometry();
        this.setupBackgroundParticles();
        this.applyColorScheme(this.settings.colorScheme);
        this.setupGui();
        this.setupEvents();

        // Start render loop
        this.render = this.render.bind(this);
        requestAnimationFrame(this.render);
      }

      initRenderer() {
        this.renderer = new THREE.WebGLRenderer({
          antialias: this.settings.antialias,
          powerPreference: 'high-performance'
        });
        this.renderer.setSize(this.width, this.height);
        this.renderer.setPixelRatio(this.settings.dpr);
        this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
        this.renderer.toneMappingExposure = this.settings.exposure;
        this.container.appendChild(this.renderer.domElement);
      }

      initScene() {
        this.scene = new THREE.Scene();
        this.updateBackground();
      }

      setupCamera() {
        const fov = 50;
        this.camera = new THREE.PerspectiveCamera(fov, this.width / this.height, 0.1, 1000);
        this.camera.position.set(0, 0, this.userDistance);
        this.camera.lookAt(0, 0, 0);
      }

      setupControls() {
        this.controls = new OrbitControls(this.camera, this.renderer.domElement);
        this.controls.enableDamping = true;
        this.controls.dampingFactor = 0.05;
        this.controls.screenSpacePanning = true;
        this.controls.enableZoom = true;
        this.controls.enablePan = true;
        this.controls.enableRotate = true;

        this.updateMouseButtons();

        this.controls.addEventListener('start', () => {
          this.isUserInteracting = true;
        });

        this.controls.addEventListener('end', () => {
          this.isUserInteracting = false;
          this.userDistance = this.camera.position.distanceTo(this.controls.target);
        });
      }

      updateMouseButtons() {
        if (this.settings.leftMouseAction === 'Drag / Pan Object') {
          this.controls.mouseButtons.LEFT = THREE.MOUSE.PAN;
          this.controls.mouseButtons.RIGHT = THREE.MOUSE.ROTATE;
        } else {
          this.controls.mouseButtons.LEFT = THREE.MOUSE.ROTATE;
          this.controls.mouseButtons.RIGHT = THREE.MOUSE.PAN;
        }
        this.controls.mouseButtons.MIDDLE = THREE.MOUSE.DOLLY;
      }

      setupLights() {
        // Master light container
        this.dirLight = new THREE.DirectionalLight(
          this.settings.dirLightColor,
          this.settings.dirLightIntensity * this.settings.sceneLightIntensity
        );
        this.dirLight.position.set(22, 35, 28);
        this.scene.add(this.dirLight);

        this.ambientLight = new THREE.AmbientLight(
          this.settings.ambientColor,
          this.settings.ambientIntensity * this.settings.sceneLightIntensity
        );
        this.scene.add(this.ambientLight);

        this.pointLight1 = new THREE.PointLight(
          this.settings.pointLight1Color,
          this.settings.pointLight1Intensity * this.settings.sceneLightIntensity,
          140
        );
        this.pointLight1.position.set(-20, 16, 22);
        this.scene.add(this.pointLight1);

        this.pointLight2 = new THREE.PointLight(
          this.settings.pointLight2Color,
          this.settings.pointLight2Intensity * this.settings.sceneLightIntensity,
          140
        );
        this.pointLight2.position.set(20, -16, -18);
        this.scene.add(this.pointLight2);
      }

      updateLights() {
        const master = this.settings.sceneLightIntensity;
        this.dirLight.intensity = this.settings.dirLightIntensity * master;
        this.dirLight.color.set(this.settings.dirLightColor);

        this.ambientLight.intensity = this.settings.ambientIntensity * master;
        this.ambientLight.color.set(this.settings.ambientColor);

        this.pointLight1.intensity = this.settings.pointLight1Intensity * master;
        this.pointLight1.color.set(this.settings.pointLight1Color);

        this.pointLight2.intensity = this.settings.pointLight2Intensity * master;
        this.pointLight2.color.set(this.settings.pointLight2Color);

        this.renderer.toneMappingExposure = this.settings.exposure;
      }

      updateBackground() {
        if (this.settings.greenscreen) {
          this.scene.background = new THREE.Color('#00ff00');
          this.renderer.setClearColor('#00ff00', 1.0);
        } else {
          const bgCol = new THREE.Color(this.settings.backgroundColor);
          this.scene.background = bgCol;
          this.renderer.setClearColor(bgCol, 1.0);
        }
      }

      buildFractalGeometry() {
        // Dispose existing layers
        if (this.layers && this.layers.length > 0) {
          for (const lyr of this.layers) {
            if (lyr.tubes) {
              this.scene.remove(lyr.tubes);
              lyr.tubes.geometry.dispose();
              lyr.tubes.material.dispose();
            }
            if (lyr.lines) {
              this.scene.remove(lyr.lines);
              lyr.lines.geometry.dispose();
              lyr.lines.material.dispose();
            }
            if (lyr.joints) {
              this.scene.remove(lyr.joints);
              lyr.joints.geometry.dispose();
              lyr.joints.material.dispose();
            }
          }
          this.layers = [];
        }

        // Generate base 2D Hilbert segments
        this.segments = generateHilbertSegments(this.settings.fractalDepth, this.settings.totalSpan);
        const count = this.segments.length;

        // Shared base geometries
        const cylinderGeo = new THREE.CylinderGeometry(1, 1, 1, 8, 1);
        const sphereGeo = new THREE.SphereGeometry(1, 10, 10);

        const layerColorProps = ['layer1Color', 'layer2Color', 'layer3Color'];

        for (let j = 0; j < 3; j++) {
          const hex = this.settings[layerColorProps[j]];

          // Volumetric 3D Tubes (MeshStandardMaterial responding to lights)
          const tubeMat = new THREE.MeshStandardMaterial({
            color: new THREE.Color(hex),
            emissive: new THREE.Color(hex),
            emissiveIntensity: this.settings.emissiveIntensity,
            roughness: this.settings.roughness,
            metalness: this.settings.metalness
          });
          const instancedTubes = new THREE.InstancedMesh(cylinderGeo, tubeMat, count);
          instancedTubes.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
          instancedTubes.visible = this.settings.showTubes;
          this.scene.add(instancedTubes);

          // Glowing Joint Spheres
          const jointMat = new THREE.MeshStandardMaterial({
            color: new THREE.Color(hex),
            emissive: new THREE.Color(hex),
            emissiveIntensity: this.settings.emissiveIntensity * 1.2,
            roughness: this.settings.roughness,
            metalness: this.settings.metalness
          });
          const instancedJoints = new THREE.InstancedMesh(sphereGeo, jointMat, count);
          instancedJoints.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
          instancedJoints.visible = this.settings.showJointSpheres;
          this.scene.add(instancedJoints);

          // Holographic Laser Lines (additive blending aura)
          const linePositions = new Float32Array(count * 2 * 3);
          const lineGeo = new THREE.BufferGeometry();
          lineGeo.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));
          lineGeo.attributes.position.setUsage(THREE.DynamicDrawUsage);

          const lineMat = new THREE.LineBasicMaterial({
            color: new THREE.Color(hex),
            transparent: true,
            opacity: this.settings.laserOpacity,
            blending: THREE.AdditiveBlending,
            depthWrite: false
          });
          const lines = new THREE.LineSegments(lineGeo, lineMat);
          lines.visible = this.settings.showLaserGlow;
          this.scene.add(lines);

          this.layers.push({
            tubes: instancedTubes,
            joints: instancedJoints,
            lines: lines,
            linePositions: linePositions
          });
        }
      }

      setupBackgroundParticles() {
        if (this.sparkParticles) {
          this.scene.remove(this.sparkParticles);
          this.sparkParticles.geometry.dispose();
          this.sparkParticles.material.dispose();
        }

        const pCount = 350;
        const positions = new Float32Array(pCount * 3);
        const radius = 60.0;
        for (let i = 0; i < pCount; i++) {
          positions[i * 3 + 0] = (Math.random() - 0.5) * radius * 1.5;
          positions[i * 3 + 1] = (Math.random() - 0.5) * radius * 1.5;
          positions[i * 3 + 2] = (Math.random() - 0.5) * radius * 1.5;
        }

        const pGeo = new THREE.BufferGeometry();
        pGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        const pMat = new THREE.PointsMaterial({
          color: new THREE.Color(this.settings.pointLight2Color),
          size: 0.45,
          transparent: true,
          opacity: 0.4,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        });

        this.sparkParticles = new THREE.Points(pGeo, pMat);
        this.scene.add(this.sparkParticles);
      }

      applyColorScheme(name) {
        const scheme = COLOR_SCHEMES[name];
        if (!scheme) return;

        this.settings.colorScheme = name;
        if (!this.settings.greenscreen) {
          this.settings.backgroundColor = scheme.bg;
          this.updateBackground();
        }

        this.settings.layer1Color = scheme.layers[0] || '#ff0000';
        this.settings.layer2Color = scheme.layers[1] || '#00ff00';
        this.settings.layer3Color = scheme.layers[2] || '#0000ff';

        this.settings.dirLightColor = scheme.dirLight;
        this.settings.ambientColor = scheme.ambient;
        this.settings.pointLight1Color = scheme.point1;
        this.settings.pointLight2Color = scheme.point2;

        this.updateLights();
        this.updateLayerMaterials();

        if (this.sparkParticles) {
          this.sparkParticles.material.color.set(scheme.accent || scheme.point2);
        }
      }

      updateLayerMaterials() {
        const cols = [
          this.settings.layer1Color,
          this.settings.layer2Color,
          this.settings.layer3Color
        ];

        this.layers.forEach((lyr, idx) => {
          const col = new THREE.Color(cols[idx]);

          if (lyr.tubes) {
            lyr.tubes.material.color.copy(col);
            lyr.tubes.material.emissive.copy(col);
            lyr.tubes.material.emissiveIntensity = this.settings.emissiveIntensity;
            lyr.tubes.material.roughness = this.settings.roughness;
            lyr.tubes.material.metalness = this.settings.metalness;
            lyr.tubes.material.needsUpdate = true;
            lyr.tubes.visible = this.settings.showTubes;
          }

          if (lyr.joints) {
            lyr.joints.material.color.copy(col);
            lyr.joints.material.emissive.copy(col);
            lyr.joints.material.emissiveIntensity = this.settings.emissiveIntensity * 1.2;
            lyr.joints.material.roughness = this.settings.roughness;
            lyr.joints.material.metalness = this.settings.metalness;
            lyr.joints.material.needsUpdate = true;
            lyr.joints.visible = this.settings.showJointSpheres;
          }

          if (lyr.lines) {
            lyr.lines.material.color.copy(col);
            lyr.lines.material.opacity = this.settings.laserOpacity;
            lyr.lines.material.needsUpdate = true;
            lyr.lines.visible = this.settings.showLaserGlow;
          }
        });
      }

      applyCameraAnimation(dt) {
        if (this.settings.cameraAnimation === 'Static (No Camera Move)') {
          return;
        }

        const offset = this.camera.position.clone().sub(this.controls.target);
        const currentDist = offset.length();
        if (currentDist < 0.0001) return;

        const spherical = new THREE.Spherical().setFromVector3(offset);

        // While user actively interacts (mouse drag/rotate/pan), synchronize distance and don't fight input
        if (this.isUserInteracting) {
          this.userDistance = currentDist;
          return;
        }

        // If user zoomed with wheel without dragging
        if (Math.abs(currentDist - this.userDistance) > 0.001) {
          this.userDistance = currentDist;
        }

        this.animTimer += dt * this.settings.animationSpeed;
        const speed = this.settings.animationSpeed;

        switch (this.settings.cameraAnimation) {
          case 'Gentle Orbit': {
            spherical.theta += 0.22 * dt * speed;
            break;
          }
          case 'Slow Figure-8': {
            spherical.theta += 0.18 * dt * speed;
            const phiDelta = Math.sin(this.animTimer * 0.7) * 0.0022 * speed;
            spherical.phi = THREE.MathUtils.clamp(spherical.phi + phiDelta, 0.15, Math.PI - 0.15);
            break;
          }
          case 'Vertical Bob & Sway': {
            spherical.theta += Math.sin(this.animTimer * 0.45) * 0.0035 * speed;
            const phiDelta = Math.cos(this.animTimer * 0.75) * 0.0028 * speed;
            spherical.phi = THREE.MathUtils.clamp(spherical.phi + phiDelta, 0.15, Math.PI - 0.15);
            break;
          }
          case 'Spiral Drift': {
            spherical.theta += 0.24 * dt * speed;
            const phiDelta = Math.sin(this.animTimer * 0.35) * 0.0025 * speed;
            spherical.phi = THREE.MathUtils.clamp(spherical.phi + phiDelta, 0.15, Math.PI - 0.15);
            break;
          }
          case 'Breathing Dolly': {
            spherical.theta += 0.08 * dt * speed;
            const pulse = 1.0 + Math.sin(this.animTimer * 1.1) * 0.09;
            spherical.radius = this.userDistance * pulse;
            break;
          }
          case 'Cinematic Sweep': {
            spherical.theta += 0.16 * dt * speed;
            const phiDelta = Math.sin(this.animTimer * 0.5) * 0.002 * speed;
            spherical.phi = THREE.MathUtils.clamp(spherical.phi + phiDelta, 0.15, Math.PI - 0.15);
            break;
          }
          case 'Elliptical Flyaround': {
            spherical.theta += 0.25 * dt * speed;
            const ellipsePulse = 1.0 + Math.cos(spherical.theta * 2.0) * 0.14;
            spherical.radius = this.userDistance * ellipsePulse;
            break;
          }
        }

        offset.setFromSpherical(spherical);
        this.camera.position.copy(this.controls.target).add(offset);
        this.camera.lookAt(this.controls.target);
      }

      randomizeScene() {
        // 1. Pick a random color scheme from 19 schemes
        const schemeKeys = Object.keys(COLOR_SCHEMES);
        const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
        this.applyColorScheme(randomScheme);

        // 2. Re-roll geometric parameters
        this.settings.waveAmpY = parseFloat(THREE.MathUtils.randFloat(1.2, 4.2).toFixed(2));
        this.settings.waveAmpZ = parseFloat(THREE.MathUtils.randFloat(1.5, 5.0).toFixed(2));
        this.settings.waveAmpX = parseFloat(THREE.MathUtils.randFloat(0.2, 1.2).toFixed(2));
        this.settings.waveFreq = parseFloat(THREE.MathUtils.randFloat(0.08, 0.24).toFixed(3));
        this.settings.tubeRadius = parseFloat(THREE.MathUtils.randFloat(0.05, 0.14).toFixed(3));
        this.settings.jointRadius = parseFloat(THREE.MathUtils.randFloat(0.06, 0.16).toFixed(3));
        this.settings.zLayerSpacing = parseFloat(THREE.MathUtils.randFloat(0.4, 1.4).toFixed(2));

        const waveTypes = ['Original Tan Waves', 'Smooth Harmonics', 'Dual Sine', 'Cosmic Ripple'];
        this.settings.waveType = waveTypes[Math.floor(Math.random() * waveTypes.length)];

        // 3. Re-roll motion parameters
        this.settings.animationSpeed = parseFloat(THREE.MathUtils.randFloat(0.6, 1.7).toFixed(2));
        this.settings.waveSpeed = parseFloat(THREE.MathUtils.randFloat(1.0, 2.8).toFixed(2));

        const animations = [
          'Static (No Camera Move)',
          'Gentle Orbit',
          'Slow Figure-8',
          'Vertical Bob & Sway',
          'Spiral Drift',
          'Breathing Dolly',
          'Cinematic Sweep',
          'Elliptical Flyaround'
        ];
        this.settings.cameraAnimation = animations[Math.floor(Math.random() * animations.length)];

        // 4. Re-roll lighting parameters
        this.settings.exposure = parseFloat(THREE.MathUtils.randFloat(0.9, 1.4).toFixed(2));
        this.settings.dirLightIntensity = parseFloat(THREE.MathUtils.randFloat(0.8, 1.8).toFixed(2));
        this.settings.ambientIntensity = parseFloat(THREE.MathUtils.randFloat(0.25, 0.6).toFixed(2));
        this.settings.pointLight1Intensity = parseFloat(THREE.MathUtils.randFloat(1.2, 2.5).toFixed(2));
        this.settings.pointLight2Intensity = parseFloat(THREE.MathUtils.randFloat(1.2, 2.5).toFixed(2));
        this.updateLights();

        // 5. Update materials & GUI displays
        this.updateLayerMaterials();
        this.updateAllGuiControllers();
      }

      updateAllGuiControllers() {
        const updateFolder = (folder) => {
          if (folder.controllers) folder.controllers.forEach(c => c.updateDisplay());
          if (folder.folders) folder.folders.forEach(f => updateFolder(f));
        };
        if (this.gui) updateFolder(this.gui);
      }

      recreateRenderer(antialiasVal) {
        const oldCanvas = this.renderer.domElement;
        const oldPos = this.camera.position.clone();
        const oldTarget = this.controls.target.clone();
        const oldDist = this.userDistance;

        this.controls.dispose();
        this.renderer.dispose();
        if (oldCanvas && oldCanvas.parentNode) {
          oldCanvas.parentNode.removeChild(oldCanvas);
        }

        this.settings.antialias = antialiasVal;
        this.initRenderer();
        this.setupControls();

        this.camera.position.copy(oldPos);
        this.controls.target.copy(oldTarget);
        this.userDistance = oldDist;
        this.controls.update();

        this.setupCanvasEvents();
      }

      setupCanvasEvents() {
        const canvas = this.renderer.domElement;
        let downPos = { x: 0, y: 0 };
        let downTime = 0;

        canvas.addEventListener('pointerdown', (e) => {
          downPos = { x: e.clientX, y: e.clientY };
          downTime = Date.now();
        });

        canvas.addEventListener('pointerup', (e) => {
          const dist = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
          const duration = Date.now() - downTime;

          // Clean click without drag on scene triggers procedural randomize
          if (dist < 6 && duration < 320 && this.settings.clickToRandomize) {
            this.randomizeScene();
          }
        });
      }

      setupEvents() {
        this.setupCanvasEvents();

        window.addEventListener('resize', () => {
          this.width = window.innerWidth;
          this.height = window.innerHeight;
          this.camera.aspect = this.width / this.height;
          this.camera.updateProjectionMatrix();
          this.renderer.setSize(this.width, this.height);
        });

        // Wheel listener to preserve user zoom without reverting to default
        window.addEventListener('wheel', () => {
          setTimeout(() => {
            if (this.camera && this.controls) {
              this.userDistance = this.camera.position.distanceTo(this.controls.target);
            }
          }, 25);
        }, { passive: true });

        // Toggle UI visibility with "H" key
        let uiVisible = true;
        window.addEventListener('keydown', (e) => {
          if (e.key === 'h' || e.key === 'H') {
            uiVisible = !uiVisible;
            if (this.gui) {
              this.gui.domElement.style.display = uiVisible ? '' : 'none';
            }
          }
        });
      }

      setupGui() {
        this.gui = new GUI({ title: 'Scene Controls' });

        // Folder: Colors & Theme
        const colorFolder = this.gui.addFolder('Colors & Theme');
        colorFolder.add(this.settings, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Color Scheme').onChange(val => {
          this.applyColorScheme(val);
          this.updateAllGuiControllers();
        });
        colorFolder.add(this.settings, 'greenscreen').name('Green Screen (#00ff00)').onChange(() => {
          this.updateBackground();
        });
        colorFolder.addColor(this.settings, 'backgroundColor').name('Background Color').onChange(() => {
          this.updateBackground();
        });
        colorFolder.addColor(this.settings, 'layer1Color').name('Layer 1 (Red) Color').onChange(() => {
          this.updateLayerMaterials();
        });
        colorFolder.addColor(this.settings, 'layer2Color').name('Layer 2 (Green) Color').onChange(() => {
          this.updateLayerMaterials();
        });
        colorFolder.addColor(this.settings, 'layer3Color').name('Layer 3 (Blue) Color').onChange(() => {
          this.updateLayerMaterials();
        });
        colorFolder.add(this.settings, 'emissiveIntensity', 0.0, 2.5, 0.05).name('Emissive Glow').onChange(() => {
          this.updateLayerMaterials();
        });
        colorFolder.add(this.settings, 'roughness', 0.0, 1.0, 0.02).name('Surface Roughness').onChange(() => {
          this.updateLayerMaterials();
        });
        colorFolder.add(this.settings, 'metalness', 0.0, 1.0, 0.02).name('Surface Metalness').onChange(() => {
          this.updateLayerMaterials();
        });

        // Folder: Animation & Motion
        const motionFolder = this.gui.addFolder('Animation & Motion');
        motionFolder.add(this.settings, 'cameraAnimation', [
          'Static (No Camera Move)',
          'Gentle Orbit',
          'Slow Figure-8',
          'Vertical Bob & Sway',
          'Spiral Drift',
          'Breathing Dolly',
          'Cinematic Sweep',
          'Elliptical Flyaround'
        ]).name('Camera Animation');
        motionFolder.add(this.settings, 'animationSpeed', 0.0, 3.0, 0.05).name('Animation Speed');
        motionFolder.add(this.settings, 'waveSpeed', 0.1, 4.0, 0.05).name('Wave Velocity');
        motionFolder.add(this.settings, 'waveType', [
          'Original Tan Waves',
          'Smooth Harmonics',
          'Dual Sine',
          'Cosmic Ripple'
        ]).name('Wave Function');
        motionFolder.add(this.settings, 'waveAmpY', 0.2, 12.0, 0.1).name('Wave Height (Y)');
        motionFolder.add(this.settings, 'waveAmpZ', 0.0, 10.0, 0.1).name('Wave Depth (Z)');
        motionFolder.add(this.settings, 'waveAmpX', 0.0, 4.0, 0.05).name('Wave Spread (X)');
        motionFolder.add(this.settings, 'waveFreq', 0.02, 0.4, 0.005).name('Wave Frequency');
        motionFolder.add(this.settings, 'layerPhase', 0.0, 0.8, 0.02).name('Layer Phase Offset');
        motionFolder.add(this.settings, 'zLayerSpacing', 0.0, 3.0, 0.05).name('Layer Z Spacing');

        // Folder: Lighting & Exposure
        const lightFolder = this.gui.addFolder('Lighting & Exposure');
        lightFolder.add(this.settings, 'exposure', 0.1, 3.0, 0.05).name('Scene Exposure').onChange(val => {
          this.renderer.toneMappingExposure = val;
        });
        lightFolder.add(this.settings, 'sceneLightIntensity', 0.1, 3.0, 0.05).name('Scene Light Master').onChange(() => {
          this.updateLights();
        });
        lightFolder.add(this.settings, 'dirLightIntensity', 0.0, 3.5, 0.05).name('Sun Light Intensity').onChange(() => {
          this.updateLights();
        });
        lightFolder.addColor(this.settings, 'dirLightColor').name('Sun Light Color').onChange(() => {
          this.updateLights();
        });
        lightFolder.add(this.settings, 'ambientIntensity', 0.0, 2.0, 0.05).name('Ambient Intensity').onChange(() => {
          this.updateLights();
        });
        lightFolder.addColor(this.settings, 'ambientColor').name('Ambient Color').onChange(() => {
          this.updateLights();
        });
        lightFolder.add(this.settings, 'pointLight1Intensity', 0.0, 4.0, 0.05).name('Point Light 1 Int.').onChange(() => {
          this.updateLights();
        });
        lightFolder.addColor(this.settings, 'pointLight1Color').name('Point Light 1 Color').onChange(() => {
          this.updateLights();
        });
        lightFolder.add(this.settings, 'pointLight2Intensity', 0.0, 4.0, 0.05).name('Point Light 2 Int.').onChange(() => {
          this.updateLights();
        });
        lightFolder.addColor(this.settings, 'pointLight2Color').name('Point Light 2 Color').onChange(() => {
          this.updateLights();
        });

        // Folder: Geometry & Structure
        const geomFolder = this.gui.addFolder('Geometry & Structure');
        geomFolder.add(this.settings, 'fractalDepth', 3, 6, 1).name('Fractal Recursion').onFinishChange(() => {
          this.buildFractalGeometry();
        });
        geomFolder.add(this.settings, 'tubeRadius', 0.01, 0.35, 0.005).name('Tube Thickness');
        geomFolder.add(this.settings, 'showTubes').name('Render 3D Tubes').onChange(() => {
          this.updateLayerMaterials();
        });
        geomFolder.add(this.settings, 'showLaserGlow').name('Render Laser Aura').onChange(() => {
          this.updateLayerMaterials();
        });
        geomFolder.add(this.settings, 'laserOpacity', 0.0, 1.0, 0.05).name('Laser Opacity').onChange(() => {
          this.updateLayerMaterials();
        });
        geomFolder.add(this.settings, 'showJointSpheres').name('Render Joint Nodes').onChange(() => {
          this.updateLayerMaterials();
        });
        geomFolder.add(this.settings, 'jointRadius', 0.01, 0.4, 0.005).name('Joint Radius');
        geomFolder.add({ randomize: () => this.randomizeScene() }, 'randomize').name('Re-roll Scene Theme');

        // Folder: Controls & Navigation
        const controlFolder = this.gui.addFolder('Controls & Navigation');
        controlFolder.add(this.settings, 'leftMouseAction', ['Rotate Camera', 'Drag / Pan Object']).name('Left Mouse Action').onChange(() => {
          this.updateMouseButtons();
        });
        controlFolder.add(this.settings, 'clickToRandomize').name('Click Scene Randomizes');
        controlFolder.add({
          resetView: () => {
            this.camera.position.set(0, 0, 44);
            this.controls.target.set(0, 0, 0);
            this.userDistance = 44.0;
            this.controls.update();
          }
        }, 'resetView').name('Reset Camera View');

        // Folder: Renderer
        const renderFolder = this.gui.addFolder('Renderer');
        renderFolder.add(this.settings, 'dpr', 0.5, 3.0, 0.1).name('Pixel Ratio (DPR)').onChange(val => {
          this.renderer.setPixelRatio(val);
          this.renderer.setSize(this.width, this.height);
        });
        renderFolder.add(this.settings, 'antialias').name('Antialias').onChange(val => {
          this.recreateRenderer(val);
        });
      }

      render() {
        const dt = this.clock.getDelta();
        const elapsedTime = this.clock.getElapsedTime();

        // Wave parameter evaluation
        const animTime = elapsedTime * this.settings.animationSpeed;
        const waveTime = animTime * this.settings.waveSpeed;

        const count = this.segments ? this.segments.length : 0;
        const radius = this.settings.tubeRadius;
        const jRadius = this.settings.jointRadius;

        // Update all 3 layers
        for (let j = 0; j < 3; j++) {
          const lyr = this.layers[j];
          if (!lyr) continue;

          const positions = lyr.linePositions;
          const zOffset = (j - 1) * this.settings.zLayerSpacing;
          const phaseOffset = j * this.settings.layerPhase;

          for (let i = 0; i < count; i++) {
            const seg = this.segments[i];
            const s = Math.sin(seg.dist * this.settings.waveFreq - waveTime) + 1.0;
            const theta = waveTime * 0.2 + s + phaseOffset;

            // Start & End Point Displacements
            const dy1 = Math.sin(theta) * this.settings.waveAmpY;
            let dy2;
            if (this.settings.waveType === 'Original Tan Waves') {
              dy2 = THREE.MathUtils.clamp(Math.tan(theta), -3.6, 3.6) * this.settings.waveAmpY;
            } else if (this.settings.waveType === 'Smooth Harmonics') {
              dy2 = Math.cos(theta) * this.settings.waveAmpY;
            } else if (this.settings.waveType === 'Dual Sine') {
              dy2 = Math.sin(theta * 1.5) * this.settings.waveAmpY;
            } else {
              dy2 = Math.sin(theta) * Math.cos(s * 0.5) * this.settings.waveAmpY;
            }

            const dz1 = Math.cos(theta * 0.8 + seg.atan) * this.settings.waveAmpZ + zOffset;
            const dz2 = Math.sin(theta * 0.8 + seg.atan) * this.settings.waveAmpZ + zOffset;

            const dx1 = Math.cos(s * 1.2 + j * 0.2) * this.settings.waveAmpX;
            const dx2 = Math.sin(s * 1.2 + j * 0.2) * this.settings.waveAmpX;

            this._p1.set(seg.x1 + dx1, seg.y1 + dy1, dz1);
            this._p2.set(seg.x2 + dx2, seg.y2 + dy2, dz2);

            // Update Cylinder Tube Instance
            if (this.settings.showTubes && lyr.tubes) {
              this._mid.copy(this._p1).add(this._p2).multiplyScalar(0.5);
              this._dir.subVectors(this._p2, this._p1);
              const len = this._dir.length();
              if (len > 0.0001) {
                this._dir.divideScalar(len);
                this._quat.setFromUnitVectors(this._up, this._dir);
                this._scale.set(radius, len, radius);
                this._mat.compose(this._mid, this._quat, this._scale);
                lyr.tubes.setMatrixAt(i, this._mat);
              }
            }

            // Update Joint Sphere Instance
            if (this.settings.showJointSpheres && lyr.joints) {
              this._scale.set(jRadius, jRadius, jRadius);
              this._quat.identity();
              this._mat.compose(this._p1, this._quat, this._scale);
              lyr.joints.setMatrixAt(i, this._mat);
            }

            // Update Laser Line Segments
            if (this.settings.showLaserGlow && positions) {
              const baseIdx = i * 6;
              positions[baseIdx + 0] = this._p1.x;
              positions[baseIdx + 1] = this._p1.y;
              positions[baseIdx + 2] = this._p1.z;
              positions[baseIdx + 3] = this._p2.x;
              positions[baseIdx + 4] = this._p2.y;
              positions[baseIdx + 5] = this._p2.z;
            }
          }

          if (this.settings.showTubes && lyr.tubes) {
            lyr.tubes.instanceMatrix.needsUpdate = true;
          }
          if (this.settings.showJointSpheres && lyr.joints) {
            lyr.joints.instanceMatrix.needsUpdate = true;
          }
          if (this.settings.showLaserGlow && lyr.lines) {
            lyr.lines.geometry.attributes.position.needsUpdate = true;
          }
        }

        // Slow drift for background particles
        if (this.sparkParticles) {
          this.sparkParticles.rotation.y = elapsedTime * 0.02;
          this.sparkParticles.rotation.x = elapsedTime * 0.01;
        }

        // Apply camera animation (respecting user zoom & angle)
        this.applyCameraAnimation(dt);

        this.controls.update();
        this.renderer.render(this.scene, this.camera);

        requestAnimationFrame(this.render);
      }
    }

    // Launch application on window load
    window.addEventListener('DOMContentLoaded', () => {
      new HilbertApp();
    });
  </script>
</body>
