<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kinetic Harmonic Resonator</title>
  <style>
    .wrapper, body, canvas, html {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #040714;
    }
    .wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100vw !important;
      height: 100vh !important;
      cursor: grab;
    }
    canvas:active {
      cursor: grabbing;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
      "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
    }
  }
  </script>
</head>
<body>
  <div class="wrapper" id="canvas-container"></div>

        c3: '#D40078',
        accent: '#00F0FF',
        core: '#FFFFFF',
        ambient: '#1E0A3D',
        key: '#00F0FF',
        fill: '#D40078',
        rim: '#E0FBFF'
      }

    // ============================================================================
    // Application Parameters
    // ============================================================
    const params = {
      // Color & Theme
      colorScheme: 'Original',
      greenscreen: false,
      backgroundColor: '#040714',
      primaryColor: '#00F0FF',
      secondaryColor: '#FF007F',
      accentColor: '#FFB800',
      coreColor: '#FFFFFF',

      // Camera & Motion
      animation: 'Slow Orbit',
      speed: 1.0,
      dragMode: 'Orbit (Left) / Pan (Right)',

      // Geometry & Dynamics
      shape: 'Fluted Torus Knot',
      scale: 1.0,
      waveAmp: 0.65,
      waveFreq: 1.8,
      twist: 1.5,
      segments: 220,
      roughness: 0.25,
      metalness: 0.85,
      clearcoat: 0.9,
      transmission: 0.15,
      wireframe: false,

      // Lighting & Exposure
      exposure: 1.1,
      masterIntensity: 1.2,
      ambientIntensity: 0.6,
      ambientColor: '#0d1326',
      keyIntensity: 2.2,
      keyColor: '#ffffff',
      keyPosX: 160,
      keyPosY: 220,
      keyPosZ: 180,
      fillIntensity: 1.8,
      fillColor: '#00f0ff',
      rimIntensity: 2.4,
      rimColor: '#ff007f',
      coreIntensity: 2.0,

      // System & Rendering
      antialias: true,
      dpr: Math.min(window.devicePixelRatio || 1, 2),
      randomizeOnClick: true
    };

    // ============================================================================
    // Scene, Camera, Renderer Setup
    // ============================================================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(params.backgroundColor);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 3500);
    camera.position.set(0, 45, 290);

    let renderer = new THREE.WebGLRenderer({
      antialias: params.antialias,
      powerPreference: 'high-performance'
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(params.dpr);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = params.exposure;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.screenSpacePanning = true;
    controls.minDistance = 25;
    controls.maxDistance = 2200;
    controls.target.set(0, 0, 0);

    function updateDragMode() {
      if (params.dragMode === 'Pan (Left) / Orbit (Right)') {
        controls.mouseButtons.LEFT = THREE.MOUSE.PAN;
        controls.mouseButtons.RIGHT = THREE.MOUSE.ROTATE;
      } else {
        controls.mouseButtons.LEFT = THREE.MOUSE.ROTATE;
        controls.mouseButtons.RIGHT = THREE.MOUSE.PAN;
      }
    }
    updateDragMode();

    // ============================================================================
    // Lighting Setup
    // ============================================================
    const ambientLight = new THREE.AmbientLight(params.ambientColor, params.ambientIntensity * params.masterIntensity);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(params.keyColor, params.keyIntensity * params.masterIntensity);
    keyLight.position.set(params.keyPosX, params.keyPosY, params.keyPosZ);
    scene.add(keyLight);

    const fillLight = new THREE.PointLight(params.fillColor, params.fillIntensity * params.masterIntensity, 1200, 1.2);
    fillLight.position.set(-200, -140, 160);
    scene.add(fillLight);

    const rimLight = new THREE.PointLight(params.rimColor, params.rimIntensity * params.masterIntensity, 1200, 1.2);
    rimLight.position.set(0, 180, -220);
    scene.add(rimLight);

    const coreLight = new THREE.PointLight(params.coreColor, params.coreIntensity * params.masterIntensity, 600, 1.5);
    coreLight.position.set(0, 0, 0);
    scene.add(coreLight);

    function updateLights() {
      ambientLight.color.set(params.ambientColor);
      ambientLight.intensity = params.ambientIntensity * params.masterIntensity;

      keyLight.color.set(params.keyColor);
      keyLight.intensity = params.keyIntensity * params.masterIntensity;
      keyLight.position.set(params.keyPosX, params.keyPosY, params.keyPosZ);

      fillLight.color.set(params.fillColor);
      fillLight.intensity = params.fillIntensity * params.masterIntensity;

      rimLight.color.set(params.rimColor);
      rimLight.intensity = params.rimIntensity * params.masterIntensity;

      coreLight.color.set(params.coreColor);
      coreLight.intensity = params.coreIntensity * params.masterIntensity;

      renderer.toneMappingExposure = params.exposure;
    }

    // ============================================================================
    // 3D Objects: Procedural Shell, Glowing Core & Particle Field
    // ============================================================
    const mainGroup = new THREE.Group();
    scene.add(mainGroup);

    // Primary Kinetic Mesh Material
    const meshMaterial = new THREE.MeshPhysicalMaterial({
      color: new THREE.Color(params.primaryColor),
      emissive: new THREE.Color(params.secondaryColor),
      emissiveIntensity: 0.25,
      roughness: params.roughness,
      metalness: params.metalness,
      clearcoat: params.clearcoat,
      clearcoatRoughness: 0.15,
      transmission: params.transmission,
      ior: 1.5,
      thickness: 1.8,
      wireframe: params.wireframe,
      side: THREE.DoubleSide
    });

    let mainMesh = null;

    function buildGeometry(shapeName) {
      let geo;
      const segs = Math.max(64, Math.floor(params.segments));

      switch (shapeName) {
        case 'Harmonic Gyroid Lattice':
          geo = new THREE.TorusGeometry(64, 24, 48, segs);
          break;
        case 'Kinetic Triple Braid':
          geo = new THREE.TorusKnotGeometry(60, 16, segs, 32, 2, 5);
          break;
        case 'Nested Vortex Rings':
          geo = new THREE.TorusGeometry(68, 14, 36, segs);
          break;
        case 'Stellated Polyhedral Star':
          geo = new THREE.IcosahedronGeometry(62, 4);
          break;
        case 'Fluted Torus Knot':
        default:
          geo = new THREE.TorusKnotGeometry(62, 18, segs, 36, 3, 7);
          break;
      }

      // Store base vertex positions for smooth non-destructive vertex displacement
      const posAttr = geo.attributes.position;
      const basePositions = new Float32Array(posAttr.array.length);
      basePositions.set(posAttr.array);
      geo.userData = {
        basePositions: basePositions,
        count: posAttr.count
      };

      return geo;
    }

    function createMainMesh() {
      if (mainMesh) {
        mainGroup.remove(mainMesh);
        if (mainMesh.geometry) mainMesh.geometry.dispose();
      }
      const geo = buildGeometry(params.shape);
      mainMesh = new THREE.Mesh(geo, meshMaterial);
      mainMesh.castShadow = true;
      mainMesh.receiveShadow = true;
      mainGroup.add(mainMesh);
    }
    createMainMesh();

    // Inner Crystalline Glowing Core
    const coreGeo = new THREE.IcosahedronGeometry(24, 1);
    const coreMat = new THREE.MeshStandardMaterial({
      color: new THREE.Color(params.coreColor),
      emissive: new THREE.Color(params.accentColor),
      emissiveIntensity: 1.5,
      roughness: 0.2,
      metalness: 0.9,
      wireframe: true
    });
    const coreMesh = new THREE.Mesh(coreGeo, coreMat);
    mainGroup.add(coreMesh);

    // Surrounding Orbital Micro-Particle Field
    const particleCount = 750;
    const particleGeo = new THREE.BufferGeometry();
    const particlePositions = new Float32Array(particleCount * 3);
    const particleSpeeds = new Float32Array(particleCount);
    const particleAngles = new Float32Array(particleCount);
    const particleRadii = new Float32Array(particleCount);
    const particleHeights = new Float32Array(particleCount);

    for (let i = 0; i < particleCount; i++) {
      particleRadii[i] = 85 + Math.random() * 115;
      particleAngles[i] = Math.random() * Math.PI * 2;
      particleHeights[i] = (Math.random() - 0.5) * 110;
      particleSpeeds[i] = (0.2 + Math.random() * 0.8) * (Math.random() > 0.5 ? 1 : -1);

      particlePositions[i * 3] = Math.cos(particleAngles[i]) * particleRadii[i];
      particlePositions[i * 3 + 1] = particleHeights[i];
      particlePositions[i * 3 + 2] = Math.sin(particleAngles[i]) * particleRadii[i];
    }

    particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
    const particleMat = new THREE.PointsMaterial({
      color: new THREE.Color(params.accentColor),
      size: 2.2,
      transparent: true,
      opacity: 0.85,
      blending: THREE.AdditiveBlending
    });
    const particleSystem = new THREE.Points(particleGeo, particleMat);
    mainGroup.add(particleSystem);

    // ============================================================================
    // Theme & Color Application
    // ============================================================
    function applyColorScheme(schemeName) {
      const scheme = COLOR_SCHEMES[schemeName];
      if (!scheme) return;

      params.colorScheme = schemeName;
      params.backgroundColor = scheme.background;
      params.primaryColor = scheme.c1;
      params.secondaryColor = scheme.c2;
      params.accentColor = scheme.accent || scheme.c3;
      params.coreColor = scheme.core || '#FFFFFF';

      if (scheme.ambient) params.ambientColor = scheme.ambient;
      if (scheme.key) params.keyColor = scheme.key;
      if (scheme.fill) params.fillColor = scheme.fill;
      if (scheme.rim) params.rimColor = scheme.rim;

      updateColors();
    }

    function updateColors() {
      if (params.greenscreen) {
        scene.background.set('#00ff00');
        document.body.style.backgroundColor = '#00ff00';
      } else {
        scene.background.set(params.backgroundColor);
        document.body.style.backgroundColor = params.backgroundColor;
      }

      meshMaterial.color.set(params.primaryColor);
      meshMaterial.emissive.set(params.secondaryColor);
      meshMaterial.roughness = params.roughness;
      meshMaterial.metalness = params.metalness;
      meshMaterial.clearcoat = params.clearcoat;
      meshMaterial.transmission = params.transmission;
      meshMaterial.wireframe = params.wireframe;

      coreMat.color.set(params.coreColor);
      coreMat.emissive.set(params.accentColor);

      particleMat.color.set(params.accentColor);

      updateLights();
    }

    // ============================================================================
    // Procedural Vertex Animation & Geometry Morphing
    // ============================================================
    function updateProceduralGeometry(time) {
      if (!mainMesh || !mainMesh.geometry || !mainMesh.geometry.userData.basePositions) return;

      const geo = mainMesh.geometry;
      const pos = geo.attributes.position;
      const base = geo.userData.basePositions;
      const count = geo.userData.count;
      const amp = params.waveAmp;
      const freq = params.waveFreq;
      const twist = params.twist;
      const shape = params.shape;

      const pArr = pos.array;

      for (let i = 0; i < count; i++) {
        const i3 = i * 3;
        const bx = base[i3];
        const by = base[i3 + 1];
        const bz = base[i3 + 2];

        const dist = Math.sqrt(bx * bx + by * by + bz * bz) || 1.0;
        const nx = bx / dist;
        const ny = by / dist;
        const nz = bz / dist;

        let displacement = 0;

        if (shape === 'Fluted Torus Knot') {
          // Helical fluting with smooth standing waves
          const angle = Math.atan2(by, bx);
          const zRel = bz / 30.0;
          const fluting = Math.sin(angle * 7.0 + zRel * twist * 3.0 + time * 1.6);
          const breathing = Math.cos(dist * freq * 0.05 - time * 2.0);
          displacement = (fluting * 5.0 + breathing * 7.0) * amp;
        } else if (shape === 'Harmonic Gyroid Lattice') {
          // 3D Harmonic standing wave dispersion
          const w1 = Math.sin(bx * 0.08 * freq + time * 1.5);
          const w2 = Math.cos(by * 0.08 * freq + time * 1.2);
          const w3 = Math.sin(bz * 0.08 * freq + time * 1.8);
          displacement = (w1 * w2 + w2 * w3 + w3 * w1) * 8.5 * amp;
        } else if (shape === 'Kinetic Triple Braid') {
          const u = Math.atan2(by, bx);
          const wave = Math.sin(u * 5.0 + bz * 0.1 * twist + time * 2.2);
          displacement = wave * 9.0 * amp;
        } else if (shape === 'Nested Vortex Rings') {
          const r = Math.sqrt(bx * bx + bz * bz);
          const ringWave = Math.sin(r * 0.12 * freq - time * 2.5);
          const ripple = Math.cos(by * 0.15 * twist + time * 1.8);
          displacement = (ringWave * 7.0 + ripple * 4.0) * amp;
        } else if (shape === 'Stellated Polyhedral Star') {
          const sp = Math.sin(nx * 6.0 * freq + time * 1.5) * Math.sin(ny * 6.0 * freq + time * 1.5) * Math.sin(nz * 6.0 * freq + time * 1.5);
          displacement = sp * 14.0 * amp;
        }

        pArr[i3] = bx + nx * displacement;
        pArr[i3 + 1] = by + ny * displacement;
        pArr[i3 + 2] = bz + nz * displacement;
      }

      pos.needsUpdate = true;
      geo.computeVertexNormals();
    }

    // ============================================================================
    // Smooth Cinematic Camera Animations
    // (Preserves user wheel zoom and camera angle during motion)
    // ============================================================
    let animTime = 0;

    function updateCameraAnimation(delta) {
      if (params.animation === 'Static (No Camera Movement)') {
        controls.update();
        return;
      }

      // Vector from target to camera
      const toCam = new THREE.Vector3().subVectors(camera.position, controls.target);
      const currentDistance = toCam.length();

      // Guard against zero length
      if (currentDistance < 1e-4) return;

      const effectiveSpeed = params.speed;

      switch (params.animation) {
        case 'Slow Orbit': {
          // Pure continuous azimuth orbit around controls.target at current distance & elevation
          const angleDelta = 0.25 * delta * effectiveSpeed;
          toCam.applyAxisAngle(new THREE.Vector3(0, 1, 0), angleDelta);
          camera.position.copy(controls.target).add(toCam);
          break;
        }
        case 'Gentle Elevation Wave': {
          // Orbit + subtle harmonic undulation in polar height
          const angleDelta = 0.22 * delta * effectiveSpeed;
          toCam.applyAxisAngle(new THREE.Vector3(0, 1, 0), angleDelta);
          const spherical = new THREE.Spherical().setFromVector3(toCam);
          const dPhi = Math.sin(animTime * 0.5) * 0.0025 * effectiveSpeed;
          spherical.phi = THREE.MathUtils.clamp(spherical.phi + dPhi, 0.15, Math.PI - 0.15);
          toCam.setFromSpherical(spherical);
          camera.position.copy(controls.target).add(toCam);
          break;
        }
        case 'Cinematic Figure-8': {
          // Figure-8 (Lissajous) spherical trajectory
          const dTheta = Math.sin(animTime * 0.35) * 0.0045 * effectiveSpeed;
          const dPhi = Math.sin(animTime * 0.70) * 0.0022 * effectiveSpeed;
          toCam.applyAxisAngle(new THREE.Vector3(0, 1, 0), dTheta);
          const spherical = new THREE.Spherical().setFromVector3(toCam);
          spherical.phi = THREE.MathUtils.clamp(spherical.phi + dPhi, 0.2, Math.PI - 0.2);
          toCam.setFromSpherical(spherical);
          camera.position.copy(controls.target).add(toCam);
          break;
        }
        case 'Pendulum Sway': {
          // Gentle left-right oscillation
          const dTheta = Math.cos(animTime * 0.45) * 0.0055 * effectiveSpeed;
          toCam.applyAxisAngle(new THREE.Vector3(0, 1, 0), dTheta);
          camera.position.copy(controls.target).add(toCam);
          break;
        }
        case 'Spiral Rise & Fall': {
          // Orbit + slow ascending and descending sweep
          const angleDelta = 0.26 * delta * effectiveSpeed;
          toCam.applyAxisAngle(new THREE.Vector3(0, 1, 0), angleDelta);
          const spherical = new THREE.Spherical().setFromVector3(toCam);
          const dPhi = Math.sin(animTime * 0.3) * 0.0035 * effectiveSpeed;
          spherical.phi = THREE.MathUtils.clamp(spherical.phi + dPhi, 0.18, Math.PI - 0.18);
          toCam.setFromSpherical(spherical);
          camera.position.copy(controls.target).add(toCam);
          break;
        }
        case 'Top-Down Orbital Sweep': {
          // High-elevation orbital sweep
          const angleDelta = 0.20 * delta * effectiveSpeed;
          toCam.applyAxisAngle(new THREE.Vector3(0, 1, 0), angleDelta);
          const spherical = new THREE.Spherical().setFromVector3(toCam);
          const targetPhi = 0.55 + Math.sin(animTime * 0.3) * 0.08;
          spherical.phi = THREE.MathUtils.lerp(spherical.phi, targetPhi, 0.02 * effectiveSpeed);
          toCam.setFromSpherical(spherical);
          camera.position.copy(controls.target).add(toCam);
          break;
        }
        case 'Subtle Horizon Drift': {
          // Low-angle equatorial panoramic drift
          const angleDelta = 0.14 * delta * effectiveSpeed;
          toCam.applyAxisAngle(new THREE.Vector3(0, 1, 0), angleDelta);
          const spherical = new THREE.Spherical().setFromVector3(toCam);
          const targetPhi = Math.PI * 0.48 + Math.sin(animTime * 0.35) * 0.04;
          spherical.phi = THREE.MathUtils.lerp(spherical.phi, targetPhi, 0.02 * effectiveSpeed);
          toCam.setFromSpherical(spherical);
          camera.position.copy(controls.target).add(toCam);
          break;
        }
      }

      controls.update();
    }

    // ============================================================================
    // Procedural Scene Randomizer (Upon Click)
    // ============================================================
    const SHAPE_LIST = [
      'Fluted Torus Knot',
      'Harmonic Gyroid Lattice',
      'Kinetic Triple Braid',
      'Nested Vortex Rings',
      'Stellated Polyhedral Star'
    ];

    const ANIMATION_LIST = [
      'Static (No Camera Movement)',
      'Slow Orbit',
      'Gentle Elevation Wave',
      'Cinematic Figure-8',
      'Pendulum Sway',
      'Spiral Rise & Fall',
      'Top-Down Orbital Sweep',
      'Subtle Horizon Drift'
    ];

    function updateAllGuiControllers(guiInstance) {
      if (!guiInstance) return;
      if (guiInstance.controllers) {
        guiInstance.controllers.forEach(c => c.updateDisplay());
      }
      if (guiInstance.folders) {
        guiInstance.folders.forEach(f => updateAllGuiControllers(f));
      }
    }

    function randomizeScene() {
      // Pick random scheme
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      applyColorScheme(randomScheme);

      // Re-roll geometric parameters
      params.shape = SHAPE_LIST[Math.floor(Math.random() * SHAPE_LIST.length)];
      params.scale = THREE.MathUtils.randFloat(0.85, 1.35);
      params.waveAmp = THREE.MathUtils.randFloat(0.3, 1.1);
      params.waveFreq = THREE.MathUtils.randFloat(1.0, 3.2);
      params.twist = THREE.MathUtils.randFloat(0.8, 2.8);
      params.roughness = THREE.MathUtils.randFloat(0.12, 0.55);
      params.metalness = THREE.MathUtils.randFloat(0.35, 0.95);
      params.clearcoat = THREE.MathUtils.randFloat(0.4, 1.0);
      params.transmission = Math.random() > 0.4 ? THREE.MathUtils.randFloat(0.1, 0.6) : 0.0;
      params.wireframe = Math.random() < 0.08;

      // Re-roll motion
      params.speed = THREE.MathUtils.randFloat(0.65, 1.75);
      params.animation = ANIMATION_LIST[Math.floor(Math.random() * ANIMATION_LIST.length)];

      // Rebuild geometry & update materials and lights
      createMainMesh();
      updateColors();

      // Refresh GUI
      updateAllGuiControllers(gui);
    }

    // Click Detection (Differentiates Drag from deliberate Click)
    let pointerStartX = 0;
    let pointerStartY = 0;
    let pointerStartTime = 0;

    function setupPointerEvents(domElement) {
      domElement.addEventListener('pointerdown', (e) => {
        pointerStartX = e.clientX;
        pointerStartY = e.clientY;
        pointerStartTime = performance.now();
      });

      domElement.addEventListener('pointerup', (e) => {
        const dx = e.clientX - pointerStartX;
        const dy = e.clientY - pointerStartY;
        const dt = performance.now() - pointerStartTime;
        const dist = Math.hypot(dx, dy);

        // Click threshold: moved < 5px and released within 400ms
        if (dist < 5 && dt < 400 && e.button === 0) {
          if (params.randomizeOnClick) {
            randomizeScene();
          }
        }
      });
    }
    setupPointerEvents(renderer.domElement);

    // ============================================================================
    // Renderer Rebuilder (for Antialias changes)
    // ============================================================
    function rebuildRenderer() {
      const oldCanvas = renderer.domElement;
      const parent = oldCanvas.parentElement;
      renderer.dispose();

      renderer = new THREE.WebGLRenderer({
        antialias: params.antialias,
        powerPreference: 'high-performance'
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(params.dpr);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = params.exposure;

      parent.replaceChild(renderer.domElement, oldCanvas);
      controls.domElement = renderer.domElement;
      setupPointerEvents(renderer.domElement);
    }

    // ============================================================================
    // lil-gui Control Panel Setup
    // ============================================================
    const gui = new GUI({ title: 'Scene Controls' });

    // Theme & Colors Folder
    const fTheme = gui.addFolder('Theme & Color Schemes');
    fTheme.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Color Scheme').onChange(val => {
      applyColorScheme(val);
      updateAllGuiControllers(gui);
    });

    fTheme.add(params, 'greenscreen').name('Greenscreen (#00ff00)').onChange(() => {
      updateColors();
    });

    fTheme.addColor(params, 'backgroundColor').name('Background Color').onChange(() => {
      if (!params.greenscreen) {
        scene.background.set(params.backgroundColor);
        document.body.style.backgroundColor = params.backgroundColor;
      }
    });

    fTheme.addColor(params, 'primaryColor').name('Primary Color').onChange(() => {
      meshMaterial.color.set(params.primaryColor);
    });

    fTheme.addColor(params, 'secondaryColor').name('Secondary Color').onChange(() => {
      meshMaterial.emissive.set(params.secondaryColor);
    });

    fTheme.addColor(params, 'accentColor').name('Accent Color').onChange(() => {
      coreMat.emissive.set(params.accentColor);
      particleMat.color.set(params.accentColor);
    });

    fTheme.addColor(params, 'coreColor').name('Core Color').onChange(() => {
      coreMat.color.set(params.coreColor);
      coreLight.color.set(params.coreColor);
    });

    // Camera & Motion Folder
    const fMotion = gui.addFolder('Camera & Motion');
    fMotion.add(params, 'animation', ANIMATION_LIST).name('Animation Mode');
    fMotion.add(params, 'speed', 0.0, 4.0, 0.05).name('Animation Speed');
    fMotion.add(params, 'dragMode', ['Orbit (Left) / Pan (Right)', 'Pan (Left) / Orbit (Right)']).name('Drag Mode').onChange(() => {
      updateDragMode();
    });

    // Geometry & Surface Dynamics Folder
    const fGeo = gui.addFolder('Geometry & Surface Dynamics');
    fGeo.add(params, 'shape', SHAPE_LIST).name('Shape Form').onChange(() => {
      createMainMesh();
    });
    fGeo.add(params, 'scale', 0.4, 2.5, 0.05).name('Scale').onChange(val => {
      mainGroup.scale.set(val, val, val);
    });
    fGeo.add(params, 'waveAmp', 0.0, 2.0, 0.05).name('Wave Amplitude');
    fGeo.add(params, 'waveFreq', 0.2, 5.0, 0.1).name('Wave Frequency');
    fGeo.add(params, 'twist', 0.0, 5.0, 0.1).name('Twist / Modulation');
    fGeo.add(params, 'segments', 64, 360, 16).name('Segments Density').onFinishChange(() => {
      createMainMesh();
    });
    fGeo.add(params, 'roughness', 0.0, 1.0, 0.02).name('Roughness').onChange(val => {
      meshMaterial.roughness = val;
    });
    fGeo.add(params, 'metalness', 0.0, 1.0, 0.02).name('Metalness').onChange(val => {
      meshMaterial.metalness = val;
    });
    fGeo.add(params, 'clearcoat', 0.0, 1.0, 0.02).name('Clearcoat').onChange(val => {
      meshMaterial.clearcoat = val;
    });
    fGeo.add(params, 'transmission', 0.0, 1.0, 0.02).name('Glass Transmission').onChange(val => {
      meshMaterial.transmission = val;
    });
    fGeo.add(params, 'wireframe').name('Wireframe').onChange(val => {
      meshMaterial.wireframe = val;
    });

    // Lighting & Exposure Folder
    const fLight = gui.addFolder('Lighting & Exposure');
    fLight.add(params, 'exposure', 0.1, 3.0, 0.05).name('Scene Exposure').onChange(val => {
      renderer.toneMappingExposure = val;
    });
    fLight.add(params, 'masterIntensity', 0.0, 3.5, 0.1).name('Master Light Intensity').onChange(() => {
      updateLights();
    });

    // Individual Light Sources
    const fAmbient = fLight.addFolder('Ambient Light');
    fAmbient.add(params, 'ambientIntensity', 0.0, 2.0, 0.05).name('Intensity').onChange(() => updateLights());
    fAmbient.addColor(params, 'ambientColor').name('Color').onChange(() => updateLights());

    const fKey = fLight.addFolder('Key Light (Directional)');
    fKey.add(params, 'keyIntensity', 0.0, 5.0, 0.1).name('Intensity').onChange(() => updateLights());
    fKey.addColor(params, 'keyColor').name('Color').onChange(() => updateLights());
    fKey.add(params, 'keyPosX', -300, 300, 10).name('Pos X').onChange(() => updateLights());
    fKey.add(params, 'keyPosY', -300, 300, 10).name('Pos Y').onChange(() => updateLights());
    fKey.add(params, 'keyPosZ', -300, 300, 10).name('Pos Z').onChange(() => updateLights());

    const fFill = fLight.addFolder('Fill Light (Point)');
    fFill.add(params, 'fillIntensity', 0.0, 4.0, 0.1).name('Intensity').onChange(() => updateLights());
    fFill.addColor(params, 'fillColor').name('Color').onChange(() => updateLights());

    const fRim = fLight.addFolder('Rim Light (Point)');
    fRim.add(params, 'rimIntensity', 0.0, 5.0, 0.1).name('Intensity').onChange(() => updateLights());
    fRim.addColor(params, 'rimColor').name('Color').onChange(() => updateLights());

    const fCoreLight = fLight.addFolder('Core Glow Light');
    fCoreLight.add(params, 'coreIntensity', 0.0, 5.0, 0.1).name('Intensity').onChange(() => updateLights());

    // System & Rendering Folder
    const fSys = gui.addFolder('System & Procedural Controls');
    fSys.add(params, 'antialias').name('Antialias (Rebuild)').onChange(() => {
      rebuildRenderer();
    });
    fSys.add(params, 'dpr', 0.5, 3.0, 0.1).name('Pixel Ratio (DPR)').onChange(val => {
      renderer.setPixelRatio(val);
    });
    fSys.add(params, 'randomizeOnClick').name('Click Scene to Randomize');
    fSys.add({ randomize: randomizeScene }, 'randomize').name('Randomize Now');

    fLight.close();
    fSys.close();

    // ============================================================================
    // Keyboard Shortcuts: 'H' Key to Hide/Show UI
    // ============================================================
    window.addEventListener('keydown', (e) => {
      if (e.code === 'KeyH' || e.key === 'h' || e.key === 'H') {
        if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
        if (gui._hidden) {
          gui.show();
        } else {
          gui.hide();
        }
      }
    });

    // Window Resize Handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ============================================================================
    // Main Infinite Animation Loop
    // ============================================================
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = Math.min(clock.getDelta(), 0.1);
      const effectiveSpeed = params.speed;
      animTime += delta * effectiveSpeed;

      // Kinetic Mesh Rotations & Breathing
      if (mainMesh) {
        mainMesh.rotation.x += 0.003 * effectiveSpeed;
        mainMesh.rotation.y += 0.006 * effectiveSpeed;
        mainMesh.rotation.z += 0.002 * effectiveSpeed;
      }

      // Procedural surface wave displacements
      updateProceduralGeometry(animTime);

      // Inner Core Counter-Rotation & Pulse
      if (coreMesh) {
        coreMesh.rotation.x -= 0.008 * effectiveSpeed;
        coreMesh.rotation.y -= 0.012 * effectiveSpeed;
        const pulse = 1.0 + Math.sin(animTime * 3.0) * 0.12;
        coreMesh.scale.set(pulse, pulse, pulse);
        coreMat.emissiveIntensity = (1.2 + Math.sin(animTime * 3.0) * 0.6) * params.masterIntensity;
      }

      // Orbital Stardust Particles
      if (particleSystem) {
        particleSystem.rotation.y += 0.0015 * effectiveSpeed;
        particleSystem.rotation.x = Math.sin(animTime * 0.4) * 0.05;
      }

      // Smooth camera motion (preserves user zoom & angles)
      updateCameraAnimation(delta);

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
