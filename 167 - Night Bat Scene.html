<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Night Bat Scene - Interactive Customizer</title>
  <style>
    :root {
      --bg: #113952;
      --moon: #c7edf8;
      --moon-shade: #b0e3f4;
      --bat: #122c41;
      --accent: #c22b6d;
      --moon-shade-dark: #8ecae6;
      --accent-light: #d64585;
      --bat-dark: #0c1f2e;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      padding: 0;
      margin: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }

    #viewport {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: grab;
      position: relative;
      user-select: none;
      -webkit-user-select: none;
    }

    #viewport:active {
      cursor: grabbing;
    }

    .container {
      width: 100%;
      max-width: 820px;
      height: 620px;
      position: relative;
      transform-origin: center center;
      will-change: transform;
    }

    /* Scope absolute positioning only to elements inside .container */
    .container *, .container *:before, .container *:after {
      box-sizing: border-box;
      position: absolute;
    }

    .stars-1 {
      width: 100%;
      height: 100%;
      z-index: 1;
      transform: translate3d(calc(var(--x, 0) * 1px), calc(var(--y, 0) * 1px), 0);
    }
    .stars-1 .star-1 {
      width: 10px;
      height: 10px;
      background-color: var(--moon);
      border-radius: 50%;
    }
    .stars-1 .star-1:nth-child(1) { top: 10%; left: 25%; }
    .stars-1 .star-1:nth-child(2) { top: 88%; left: 75%; }
    .stars-1 .star-1:nth-child(3) { top: 61%; left: 18%; }
    .stars-1 .star-1:nth-child(4) { top: 75%; left: 22%; }
    .stars-1 .star-1:nth-child(5) { top: 8%; left: 75%; }
    .stars-1 .star-1:nth-child(6) { top: 56%; left: 77%; }
    .stars-1 .star-1:nth-child(7) { top: 61%; left: 82%; }

    .stars-2 {
      width: 100%;
      height: 100%;
      z-index: 1;
      transform: translate3d(calc(var(--x, 0) * 1px), calc(var(--y, 0) * 1px), 0);
    }
    .stars-2 .star-2 {
      width: 20px;
      height: 20px;
      background-color: var(--moon);
      border-radius: 50%;
      box-shadow: 2px 2px 10px var(--moon);
      clip-path: polygon(
        50% 0, 60% 40%, 100% 50%, 60% 60%,
        50% 100%, 40% 60%, 0 50%, 40% 40%
      );
    }
    .stars-2 .star-2:nth-child(1) { top: 14%; left: 18%; }
    .stars-2 .star-2:nth-child(2) { top: 12%; left: 65%; }
    .stars-2 .star-2:nth-child(3) { top: 75%; left: 12%; }
    .stars-2 .star-2:nth-child(4) { top: 18%; left: 88%; }
    .stars-2 .star-2:nth-child(5) { top: 68%; left: 82%; }
    .stars-2 .star-2:nth-child(6) { top: 90%; left: 52%; }
    .stars-2 .star-2:nth-child(7) { top: 10%; left: 42%; }

    .clouds {
      width: 100%;
      height: 100%;
      z-index: 2;
      transform: translate3d(calc(var(--x, 0) * 1px), calc(var(--y, 0) * 1px), 0);
    }
    .cloud {
      background-color: var(--accent);
      width: 250px;
      height: 60px;
      top: 26%;
      left: 22%;
      border-radius: 80px 80px 10px 10px;
      box-shadow: 0 0 10px var(--accent-light), inset -5px -5px var(--accent-dark, var(--accent));
      z-index: 2;
    }
    .cloud:after {
      content: "";
      position: absolute;
      border-radius: 50%;
      width: 80px;
      height: 80px;
      background-color: var(--accent);
      top: -30px;
      right: 30px;
      box-shadow: -40px -10px 0 8px var(--accent), -80px -5px 0 1px var(--accent);
    }
    .cloud:nth-child(2) {
      top: 64%;
      left: 57%;
    }

    .moon {
      width: 400px;
      height: 400px;
      z-index: 1;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background-color: var(--moon);
      box-shadow: 0 0 100px var(--moon), inset -20px -20px var(--moon-shade);
    }
    .moon .craters {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background-color: var(--moon-shade);
      left: 20%;
      top: 20%;
      box-shadow: inset -5px -5px var(--moon-shade-dark);
    }
    .moon .craters:after {
      content: "";
      position: absolute;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background-color: var(--moon-shade);
      box-shadow: inset -5px -5px var(--moon-shade-dark);
      left: -30%;
      top: 200%;
    }
    .moon .craters:before {
      content: "";
      position: absolute;
      width: 70px;
      height: 68px;
      border-radius: 50%;
      background-color: var(--moon-shade);
      box-shadow: inset -5px -5px var(--moon-shade-dark);
      left: 230%;
      top: 125%;
    }

    .bats {
      width: 80%;
      height: 80%;
      top: 10%;
      left: 10%;
      z-index: 2;
    }

    .bat {
      width: 100px;
      height: 200px;
      transition: all 0.5s ease;
    }
    .bat .head {
      width: 80%;
      left: 10%;
      height: 80px;
      z-index: 4;
    }
    .bat .face {
      background-color: var(--bat);
      border-radius: 50% 50% 50% 50% / 65% 65% 35% 35%;
      box-shadow: inset -3px 3px 0 rgba(255, 255, 255, 0.1);
      width: 100%;
      top: 5%;
      height: 90%;
      z-index: 2;
    }
    .bat .mask {
      width: 100%;
      height: 42%;
      bottom: 0;
      border-radius: 0% 0% 60% 60% / 35% 65% 65% 65%;
      background: linear-gradient(to right, var(--moon-shade) 50%, var(--moon-shade-dark) 50%);
    }

    .bat .eyes {
      background-color: var(--accent);
      border-radius: 50%;
      width: 10px;
      height: 10px;
      left: 25%;
      top: 35%;
      box-shadow: 32px 0 0 var(--accent);
      z-index: 3;
    }
    .bat .ear {
      width: 50px;
      height: 45px;
      top: 0px;
      left: -12px;
      perspective: 90px;
      transform-style: preserve-3d;
      z-index: -1;
    }
    .bat .ear .ear-in {
      width: 100%;
      height: 100%;
      background-color: var(--bat);
      border-radius: 40%;
      transform: rotateY(70deg);
      transform-style: preserve-3d;
      box-shadow: inset -3px 3px 0 rgba(255, 255, 255, 0.1);
    }
    .bat .ear:nth-child(2) {
      right: -12px;
      left: auto;
    }
    .bat .ear:nth-child(2) .ear-in {
      transform: rotateY(-70deg);
    }

    .bat .body {
      top: 51px;
      width: 80%;
      height: 120px;
      left: 10%;
      background-color: var(--bat-dark);
      border-radius: 50% 50% 49% 51% / 35% 35% 65% 65%;
      box-shadow: 0 0 40px var(--bat);
      z-index: 2;
    }

    /* Original Wing CSS with Custom Flap Origins */
    .bat .wing {
      background-color: var(--bat);
      box-shadow: inset 0px 10px 0 rgba(255, 255, 255, 0.2);
      border-radius: 100px 100px 0 0;
      width: 183px;
      height: 100px;
      left: 22px;
      top: 50px;
      transform: rotate(-15deg);
      transform-origin: 140px 20px;
      z-index: 1;
      will-change: transform;
    }
    .bat .wing-right {
      transform: rotate(15deg);
      transform-origin: 43px 20px;
      right: 22px;
      left: auto;
    }
    .bat .wing-bottom {
      border-radius: 50%;
      width: 100px;
      height: 100px;
      top: 100px;
      box-shadow: 40px -40px 0 0px var(--bat);
      transform: rotate(-45deg);
      z-index: 2;
    }
    .bat .wing-bottom:nth-child(2) {
      left: 83px;
    }
    .bat .wing-bottom:nth-child(3) {
      left: 107px;
    }

    .bat-1 {
      top: 15%;
      left: 0%;
      transform: rotate(calc(var(--x, 0) * 1deg)) translate3d(calc(var(--x, 0) * 1px), calc(var(--y, 0) * 1px), 0);
    }
    .bat-2 {
      bottom: 0%;
      left: 40%;
      transform: rotate(calc(var(--y, 0) * 1deg)) translate3d(calc(var(--x, 0) * 1px), calc(var(--y, 0) * 1px), 0);
    }
    .bat-3 {
      top: 10%;
      right: 10%;
      transform: rotate(calc(var(--y, 0) * 1deg)) translate3d(calc(var(--x, 0) * 1px), calc(var(--y, 0) * 1px), 0);
    }

    .custom-svg-wrapper {
      width: 120px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .custom-svg-wrapper svg {
      width: 100%;
      height: 100%;
      fill: var(--bat);
      filter: drop-shadow(0 0 10px var(--accent));
    }

    #svgFileInput {
      display: none;
    }

    /* Reset lil-gui styles so it displays naturally */
    .lil-gui {
      user-select: auto !important;
      -webkit-user-select: auto !important;
      z-index: 9999;
    }
    .lil-gui, .lil-gui * {
      box-sizing: border-box !important;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.19"></script>
</head>
<body>
  <input type="file" id="svgFileInput" accept=".svg">

  <div id="viewport">
    <div class="container" id="sceneContainer">
      <div class="stars-1">
        <div class="star-1"></div>
        <div class="star-1"></div>
        <div class="star-1"></div>
        <div class="star-1"></div>
        <div class="star-1"></div>
        <div class="star-1"></div>
        <div class="star-1"></div>
      </div>
      <div class="stars-2">
        <div class="star-2"></div>
        <div class="star-2"></div>
        <div class="star-2"></div>
        <div class="star-2"></div>
        <div class="star-2"></div>
        <div class="star-2"></div>
        <div class="star-2"></div>
      </div>
      <div class="clouds">
        <div class="cloud"></div>
        <div class="cloud"></div>
      </div>
      <div class="moon">
        <div class="craters"></div>
      </div>
      <div class="bats" id="batsContainer">
        <div class="bat bat-1">
          <div class="wing wing-left">
            <div class="wing-bottom"></div>
            <div class="wing-bottom"></div>
          </div>
          <div class="wing wing-right">
            <div class="wing-bottom"></div>
            <div class="wing-bottom"></div>
          </div>
          <div class="body"></div>
          <div class="head">
            <div class="ear"><div class="ear-in"></div></div>
            <div class="ear"><div class="ear-in"></div></div>
            <div class="face"><div class="mask"></div></div>
            <div class="eyes"></div>
          </div>
        </div>
        <div class="bat bat-2">
          <div class="wing wing-left">
            <div class="wing-bottom"></div>
            <div class="wing-bottom"></div>
          </div>
          <div class="wing wing-right">
            <div class="wing-bottom"></div>
            <div class="wing-bottom"></div>
          </div>
          <div class="body"></div>
          <div class="head">
            <div class="ear"><div class="ear-in"></div></div>
            <div class="ear"><div class="ear-in"></div></div>
            <div class="face"><div class="mask"></div></div>
            <div class="eyes"></div>
          </div>
        </div>
        <div class="bat bat-3">
          <div class="wing wing-left">
            <div class="wing-bottom"></div>
            <div class="wing-bottom"></div>
          </div>
          <div class="wing wing-right">
            <div class="wing-bottom"></div>
            <div class="wing-bottom"></div>
          </div>
          <div class="body"></div>
          <div class="head">
            <div class="ear"><div class="ear-in"></div></div>
            <div class="ear"><div class="ear-in"></div></div>
            <div class="face"><div class="mask"></div></div>
            <div class="eyes"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    let GUIClass;
    if (window.lil && window.lil.GUI) {
      GUIClass = window.lil.GUI;
    } else {
      const module = await import('https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js');
      GUIClass = module.GUI;
    }

    const defaultBatsHTML = document.getElementById('batsContainer').innerHTML;

    function adjustColor(hex, percent) {
      let num = parseInt(hex.replace('#', ''), 16);
      let amt = Math.round(2.55 * percent);
      let R = (num >> 16) + amt;
      let G = (num >> 8 & 0x00FF) + amt;
      let B = (num & 0x0000FF) + amt;
      return '#' + (
        0x1000000 +
        (R < 255 ? (R < 0 ? 0 : R) : 255) * 0x10000 +
        (G < 255 ? (G < 0 ? 0 : G) : 255) * 0x100 +
        (B < 255 ? (B < 0 ? 0 : B) : 255)
      ).toString(16).slice(1);
    }

    // 5 Preset Color Schemes
    const colorSchemes = {
      'Midnight Gothic': {
        bg: '#113952',
        moon: '#c7edf8',
        moonShade: '#b0e3f4',
        bat: '#122c41',
        accent: '#c22b6d'
      },
      'Blood Moon Cyberpunk': {
        bg: '#190524',
        moon: '#ff3860',
        moonShade: '#c71585',
        bat: '#0f021e',
        accent: '#ffdd57'
      },
      'Neon Emerald': {
        bg: '#062c22',
        moon: '#a3f7bf',
        moonShade: '#52b788',
        bat: '#021b14',
        accent: '#00f5d4'
      },
      'Sunset Twilight': {
        bg: '#2b1e3a',
        moon: '#ffd166',
        moonShade: '#f4a261',
        bat: '#190e24',
        accent: '#e76f51'
      },
      'Monochrome Phantom': {
        bg: '#121212',
        moon: '#e0e0e0',
        moonShade: '#9e9e9e',
        bat: '#262626',
        accent: '#00adb5'
      }
    };

    const settings = {
      presetScheme: 'Midnight Gothic',
      greenScreen: false,
      bgColor: colorSchemes['Midnight Gothic'].bg,
      moonColor: colorSchemes['Midnight Gothic'].moon,
      moonShadeColor: colorSchemes['Midnight Gothic'].moonShade,
      batColor: colorSchemes['Midnight Gothic'].bat,
      accentColor: colorSchemes['Midnight Gothic'].accent,

      dpr: 1.0,
      animPreset: 'Gentle Orbit',
      animSpeed: 1.0,

      uploadSVG: () => {
        document.getElementById('svgFileInput').click();
      },
      resetForm: () => {
        document.getElementById('batsContainer').innerHTML = defaultBatsHTML;
      }
    };

    function applyColors() {
      const root = document.documentElement;
      const effectiveBg = settings.greenScreen ? '#00ff00' : settings.bgColor;
      document.body.style.backgroundColor = effectiveBg;
      root.style.setProperty('--bg', effectiveBg);
      root.style.setProperty('--moon', settings.moonColor);
      root.style.setProperty('--moon-shade', settings.moonShadeColor);
      root.style.setProperty('--bat', settings.batColor);
      root.style.setProperty('--accent', settings.accentColor);

      root.style.setProperty('--moon-shade-dark', adjustColor(settings.moonShadeColor, -15));
      root.style.setProperty('--accent-light', adjustColor(settings.accentColor, 15));
      root.style.setProperty('--bat-dark', adjustColor(settings.batColor, -10));
    }

    // Viewport transform state (Pan & Zoom)
    let zoomScale = 1.0;
    let panX = 0;
    let panY = 0;
    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;

    const viewport = document.getElementById('viewport');
    const sceneContainer = document.getElementById('sceneContainer');

    function updateTransform() {
      const totalScale = zoomScale * settings.dpr;
      sceneContainer.style.transform = `translate(${panX}px, ${panY}px) scale(${totalScale})`;
    }

    // Drag / Pan handlers
    viewport.addEventListener('mousedown', (e) => {
      if (e.target.closest('.lil-gui')) return;
      isDragging = true;
      dragStartX = e.clientX - panX;
      dragStartY = e.clientY - panY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      panX = e.clientX - dragStartX;
      panY = e.clientY - dragStartY;
      updateTransform();
    });

    window.addEventListener('mouseup', () => {
      isDragging = false;
    });

    // Wheel Zoom handler
    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
      zoomScale = Math.min(Math.max(0.2, zoomScale * zoomFactor), 5.0);
      updateTransform();
    }, { passive: false });

    // Mouse Parallax tracking
    let mousePos = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
    window.addEventListener('mousemove', (e) => {
      mousePos = { x: e.clientX, y: e.clientY };
    });

    const stars1 = document.querySelector(".stars-1");
    const stars2 = document.querySelector(".stars-2");
    const clouds = document.querySelector(".clouds");

    function followMouse(el, divisor, autoOffsetX = 0, autoOffsetY = 0) {
      if (!el) return;
      const elOffset = el.getBoundingClientRect();
      const centerX = elOffset.x + elOffset.width / 2;
      const centerY = elOffset.y + elOffset.height / 2;
      const targetX = Math.round(((mousePos.x - centerX) * 100) / window.innerWidth) + autoOffsetX;
      const targetY = Math.round(((mousePos.y - centerY) * 100) / window.innerHeight) + autoOffsetY;
      el.style.setProperty('--x', targetX / divisor);
      el.style.setProperty('--y', targetY / divisor);
    }

    // SVG Upload Handler
    document.getElementById('svgFileInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        const svgText = evt.target.result;
        const batsContainer = document.getElementById('batsContainer');
        batsContainer.innerHTML = `
          <div class="bat bat-1 custom-svg-wrapper">${svgText}</div>
          <div class="bat bat-2 custom-svg-wrapper">${svgText}</div>
          <div class="bat bat-3 custom-svg-wrapper">${svgText}</div>
        `;
      };
      reader.readAsText(file);
    });

    // Main Infinite Animation Loop
    let startTime = performance.now();
    function animate(now) {
      const elapsed = (now - startTime) * 0.001 * settings.animSpeed;

      let autoX = 0;
      let autoY = 0;

      // 5 Camera Animation Presets
      switch (settings.animPreset) {
        case 'Gentle Orbit':
          autoX = Math.cos(elapsed * 0.8) * 25;
          autoY = Math.sin(elapsed * 0.8) * 25;
          break;
        case 'Eerie Wave':
          autoX = Math.sin(elapsed * 1.2) * 35;
          autoY = Math.sin(elapsed * 2.4) * 20;
          break;
        case 'Night Flight Pulse':
          autoX = Math.cos(elapsed * 0.5) * 15;
          autoY = Math.sin(elapsed * 0.5) * 15;
          const pulse = 1 + Math.sin(elapsed * 1.5) * 0.05;
          sceneContainer.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomScale * settings.dpr * pulse})`;
          break;
        case 'Storm Sway':
          autoX = Math.sin(elapsed * 0.7) * 45 + Math.cos(elapsed * 1.7) * 10;
          autoY = Math.cos(elapsed * 0.9) * 30;
          break;
        case 'Static (No Movement)':
        default:
          autoX = 0;
          autoY = 0;
          break;
      }

      if (settings.animPreset !== 'Night Flight Pulse') {
        updateTransform();
      }

      followMouse(stars1, 50, autoX, autoY);
      followMouse(stars2, -50, -autoX, -autoY);
      followMouse(clouds, -20, autoX * 0.5, autoY * 0.5);

      const bat1 = document.querySelector(".bat-1");
      const bat2 = document.querySelector(".bat-2");
      const bat3 = document.querySelector(".bat-3");

      followMouse(bat1, 10, autoX, autoY);
      followMouse(bat2, 15, -autoX * 0.8, autoY * 0.8);
      followMouse(bat3, 5, autoX * 1.2, -autoY * 1.2);

      // Gentle wing flapping animation while keeping original SCSS design intact
      const leftWings = document.querySelectorAll('.wing-left');
      const rightWings = document.querySelectorAll('.wing-right');
      const flapAngle = Math.sin(elapsed * 4) * 6;

      leftWings.forEach(w => {
        w.style.transform = `rotate(${-15 + flapAngle}deg)`;
      });
      rightWings.forEach(w => {
        w.style.transform = `rotate(${15 - flapAngle}deg)`;
      });

      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);

    // Initialize lil-gui UI
    const gui = new GUIClass({ title: 'Scene Settings' });

    // Safe helper to update all GUI displays
    function updateGUIDisplays(targetGui) {
      targetGui.controllers.forEach(c => c.updateDisplay());
      targetGui.folders.forEach(f => updateGUIDisplays(f));
    }

    // Green Screen Control
    gui.add(settings, 'greenScreen').name('Green Screen (#00ff00)').onChange(applyColors);

    // 5 Preset Color Schemes & Color Pickers
    const colorFolder = gui.addFolder('Colors & Themes');
    colorFolder.add(settings, 'presetScheme', Object.keys(colorSchemes)).name('Theme Preset').onChange((val) => {
      const scheme = colorSchemes[val];
      settings.bgColor = scheme.bg;
      settings.moonColor = scheme.moon;
      settings.moonShadeColor = scheme.moonShade;
      settings.batColor = scheme.bat;
      settings.accentColor = scheme.accent;
      applyColors();
      updateGUIDisplays(gui);
    });

    colorFolder.addColor(settings, 'bgColor').name('Background').onChange(applyColors);
    colorFolder.addColor(settings, 'moonColor').name('Moon').onChange(applyColors);
    colorFolder.addColor(settings, 'moonShadeColor').name('Moon Shade').onChange(applyColors);
    colorFolder.addColor(settings, 'batColor').name('Bat Color').onChange(applyColors);
    colorFolder.addColor(settings, 'accentColor').name('Accent / Eyes').onChange(applyColors);

    // DPR Settings
    const displayFolder = gui.addFolder('Display & Camera');
    displayFolder.add(settings, 'dpr', [0.5, 0.75, 1.0, 1.25, 1.5, 2.0]).name('Pixel Ratio (DPR)').onChange(updateTransform);

    // 5 Preset Animations & Speed Controls
    const animFolder = gui.addFolder('Animations');
    animFolder.add(settings, 'animPreset', [
      'Static (No Movement)',
      'Gentle Orbit',
      'Eerie Wave',
      'Night Flight Pulse',
      'Storm Sway'
    ]).name('Camera Animation');
    animFolder.add(settings, 'animSpeed', 0.1, 3.0, 0.1).name('Animation Speed');

    // SVG Form Customization
    const svgFolder = gui.addFolder('Custom Shape (SVG)');
    svgFolder.add(settings, 'uploadSVG').name('Upload SVG Form...');
    svgFolder.add(settings, 'resetForm').name('Reset to Default Bats');

    // Keyboard shortcut: Toggle UI with 'H' key
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        gui._hidden ? gui.show() : gui.hide();
      }
    });

    // Initial setup
    applyColors();
    updateTransform();
  </script>
</body>
</html>
