<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bioluminescent Deep-Sea Volumetric Wave</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;

      }

    <!-- Import Maps for ES Modules -->
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
          "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
        }
      }
    </script>
  </head>
  <body>
    <script type="module">
      import * as THREE from 'three';
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
      import GUI from 'lil-gui';

      // =========================================================================
      // 1. PostProcessor Suite (with Fisheye & Full Cinematic Pipeline)
      // =========================================================================

      const orthoVertexShader = `
        precision highp float;
        in vec3 position;
        out vec2 vUv;
        void main() {
          vUv = position.xy * 0.5 + 0.5;
          gl_Position = vec4(position, 1.0);
        }
      `;

      const brightFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        uniform float bloomThreshold;
        in vec2 vUv;
        out vec4 fragColor;

        void main() {
          vec4 color = texture(inputTexture, vUv);
          float luminance = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
          float knee = 0.1;
          float soft = luminance - bloomThreshold + knee;
          soft = clamp(soft, 0.0, 2.0 * knee);
          soft = (soft * soft) / (4.0 * knee + 0.00001);
          float contribution = max(soft, luminance - bloomThreshold);
          contribution /= max(luminance, 0.00001);
          fragColor = vec4(color.rgb * contribution, color.a);
        }
      `;

      const blur13ShaderChunk = `
        vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
          vec2 resolution = vec2(textureSize(image, 0));
          vec4 color = vec4(0.0);
          vec2 off1 = vec2(1.411764705882353) * direction;
          vec2 off2 = vec2(3.2941176470588234) * direction;
          vec2 off3 = vec2(5.176470588235294) * direction;
          color += texture(image, uv) * 0.1964825501511404;
          color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
          color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
          color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
          color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
          color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
          color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
          return color;
        }
      `;

      const blurFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        uniform vec2 direction;
        in vec2 vUv;
        out vec4 color;
        ${blur13ShaderChunk}
        void main() {
          color = blur13(inputTexture, vUv, direction);
        }
      `;

      const finalFragmentShader = `
        precision highp float;
        uniform vec2 resolution;
        uniform sampler2D inputTexture;
        uniform sampler2D blur0Texture;
        uniform sampler2D blur1Texture;
        uniform sampler2D blur2Texture;
        uniform sampler2D blur3Texture;
        uniform sampler2D blur4Texture;
        uniform bool bloomEnabled;
        uniform float bloomStrength;
        uniform float vignetteBoost;
        uniform float vignetteReduction;
        uniform float noiseIntensity;
        uniform float time;
        in vec2 vUv;
        out vec4 fragColor;

        float vignette(vec2 uv, float boost, float reduction) {
          vec2 position = vUv - 0.5;
          return boost - length(position) * reduction;
        }

        float hash1(uint n) {
          n = (n << 13U) ^ n;
          n = n * (n * n * 15731U + 789221U) + 1376312589U;
          return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
        }

        float noise(in vec2 uv, in float timeVal) {
          uvec2 p = uvec2(uv);
          return hash1(p.x + 1920U * p.y + (1920U * 1080U) * uint(timeVal));
        }

        void main() {
          vec4 color = texture(inputTexture, vUv);

          if (bloomEnabled && bloomStrength > 0.001) {
            vec4 b0 = texture(blur0Texture, vUv);
            vec4 b1 = texture(blur1Texture, vUv);
            vec4 b2 = texture(blur2Texture, vUv);
            vec4 b3 = texture(blur3Texture, vUv);
            vec4 b4 = texture(blur4Texture, vUv);

            vec4 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
            color += bloomSum * bloomStrength;
          }

          color.rgb *= vignette(vUv, vignetteBoost, vignetteReduction);
          color.rgb += noiseIntensity * noise(gl_FragCoord.xy, time);
          fragColor = vec4(color.rgb, 1.0);
        }
      `;

      const chromaticAberrationShaderChunk = `
        vec2 barrelDistortion(vec2 coord, float amt) {
          vec2 cc = coord - 0.5;
          float dist = dot(cc, cc);
          return coord + cc * dist * amt;
        }
        float sat(float t) { return clamp(t, 0.0, 1.0); }
        float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
        float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
        vec4 spectrum_offset(float t) {
          float lo = step(t, 0.5);
          float hi = 1.0 - lo;
          float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
          vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
          return pow(ret, vec4(1.0 / 2.2));
        }
        const float max_distort = 2.2;
        const int num_iter = 8;
        const float reci_num_iter_f = 1.0 / float(num_iter);
        vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount) {
          vec4 sumcol = vec4(0.0);
          vec4 sumw = vec4(0.0);
          for (int i = 0; i < num_iter; ++i) {
            float t = float(i) * reci_num_iter_f;
            vec4 w = spectrum_offset(t);
            sumw += w;
            sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
          }
          return sumcol / sumw;
        }
      `;

      const colorFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        uniform float chromaticAberrationAmount;
        uniform float fisheyeStrength;
        uniform float minInputLevel;
        uniform float maxInputLevel;
        uniform float gammaLevel;
        uniform float time;
        in vec2 vUv;
        out vec4 fragColor;

        ${chromaticAberrationShaderChunk}

        vec2 applyFisheye(vec2 uv, float strength) {
          if (abs(strength) < 0.0001) return uv;
          vec2 p = uv - 0.5;
          float d = dot(p, p);
          return uv + p * d * strength * 2.0;
        }

        vec3 gammaCorrect(vec3 color, vec3 gamma) {
          return pow(max(color, vec3(0.0)), 1.0 / gamma);
        }
        vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
          return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
        }
        vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
          return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
        }
        void main() {
          vec2 distortedUv = applyFisheye(vUv, fisheyeStrength);
          
          // Edge clamping for fisheye
          if (distortedUv.x < 0.0 || distortedUv.x > 1.0 || distortedUv.y < 0.0 || distortedUv.y > 1.0) {
            fragColor = vec4(0.0, 0.0, 0.0, 1.0);
            return;
          }

          fragColor = chromaticAberration(inputTexture, distortedUv, chromaticAberrationAmount);
          fragColor.rgb = finalLevels(fragColor.rgb, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
          fragColor.a = 1.0;
        }
      `;

      const copyFragmentShader = `
        precision highp float;
        uniform sampler2D inputTexture;
        in vec2 vUv;
        out vec4 fragColor;
        void main() {
          fragColor = texture(inputTexture, vUv);
        }
      `;

      function createFBO(w, h, options = {}) {
        return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
          wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
          wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
          minFilter: options.minFilter || THREE.LinearFilter,
          magFilter: options.magFilter || THREE.LinearFilter,
          format: options.format || THREE.RGBAFormat,
          type: options.type || THREE.HalfFloatType,
          stencilBuffer: options.stencilBuffer || false,
          depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : true,
          samples: options.samples || 0,
        });
      }

      class ShaderPass {
        constructor(shader, options = {}) {
          this.shader = shader;
          this.orthoScene = new THREE.Scene();
          this.fbo = createFBO(1, 1, options);
          this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
          this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
          this.orthoScene.add(this.orthoQuad);
          this.texture = this.fbo.texture;
        }
        render(renderer, toScreen = false) {
          if (!toScreen) {
            renderer.setRenderTarget(this.fbo);
          }
          renderer.render(this.orthoScene, this.orthoCamera);
          if (!toScreen) {
            renderer.setRenderTarget(null);
          }
        }
        setSize(width, height) {
          this.fbo.setSize(Math.max(1, width), Math.max(1, height));
          this.orthoQuad.scale.set(width, height, 1);
        }
      }

      class ShaderPingPongPass {
        constructor(shader, options = {}) {
          this.shader = shader;
          this.orthoScene = new THREE.Scene();
          this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
          this.currentFBO = 0;
          this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
          this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
          this.orthoScene.add(this.orthoQuad);
        }
        render(renderer) {
          renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
          renderer.render(this.orthoScene, this.orthoCamera);
          renderer.setRenderTarget(null);
          this.currentFBO = 1 - this.currentFBO;
        }
        get current() { return this.fbos[this.currentFBO]; }
        get texture() { return this.current.texture; }
        setSize(width, height) {
          const w = Math.max(1, width);
          const h = Math.max(1, height);
          this.orthoQuad.scale.set(w, h, 1);
          this.fbos[0].setSize(w, h);
          this.fbos[1].setSize(w, h);
        }
      }

      class BloomPass {
        constructor(strength = 0.8, radius = 0.5, threshold = 0.2, levels = 5) {
          this.strength = strength;
          this.radius = radius;
          this.threshold = threshold;
          this.enabled = true;
          this.levels = levels;

          this.brightShader = new THREE.RawShaderMaterial({
            uniforms: {
              inputTexture: { value: null },
              bloomThreshold: { value: this.threshold },
            },
            vertexShader: orthoVertexShader,
            fragmentShader: brightFragmentShader,
            glslVersion: THREE.GLSL3,
          });
          this.brightPass = new ShaderPass(this.brightShader, {
            format: THREE.RGBAFormat,
            type: THREE.HalfFloatType,
          });

          this.blurShader = new THREE.RawShaderMaterial({
            uniforms: {
              inputTexture: { value: null },
              direction: { value: new THREE.Vector2(0, 1) },
            },
            vertexShader: orthoVertexShader,
            fragmentShader: blurFragmentShader,
            glslVersion: THREE.GLSL3,
          });

          this.blurPasses = [];
          for (let i = 0; i < this.levels; i++) {
            this.blurPasses.push(new ShaderPingPongPass(this.blurShader, {
              format: THREE.RGBAFormat,
              type: THREE.HalfFloatType,
            }));
          }
        }

        setSize(w, h) {
          let tw = Math.max(1, w);
          let th = Math.max(1, h);
          this.brightPass.setSize(tw, th);
          for (let i = 0; i < this.levels; i++) {
            tw = Math.max(1, Math.round(tw / 2));
            th = Math.max(1, Math.round(th / 2));
            this.blurPasses[i].setSize(tw, th);
          }
        }

        set source(texture) {
          this.brightShader.uniforms.inputTexture.value = texture;
        }

        render(renderer) {
          if (!this.enabled || this.strength <= 0.001) return;

          this.brightShader.uniforms.bloomThreshold.value = this.threshold;
          this.brightPass.render(renderer);

          const baseOffset = Math.max(0.1, this.radius * 2.0);
          const u = this.blurShader.uniforms;

          for (let j = 0; j < this.levels; j++) {
            const blurPass = this.blurPasses[j];
            const stepOffset = baseOffset * (1.0 + j * 0.5);

            u.direction.value.set(stepOffset, 0);
            u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
            blurPass.render(renderer);

            u.direction.value.set(0, stepOffset * 0.5);
            u.inputTexture.value = blurPass.current.texture;
            blurPass.render(renderer);
          }
        }
      }

      class PostProcessor {
        constructor(renderer, params = {}) {
          this.renderer = renderer;

          this.settings = {
            enabled: params.enabled !== undefined ? params.enabled : false, // Default is OFF as requested

            // Bloom
            bloomEnabled: params.bloomEnabled !== undefined ? params.bloomEnabled : true,
            bloomStrength: params.bloomStrength !== undefined ? params.bloomStrength : 0.8,
            bloomRadius: params.bloomRadius !== undefined ? params.bloomRadius : 0.5,
            bloomThreshold: params.bloomThreshold !== undefined ? params.bloomThreshold : 0.2,

            // Optics & Lens
            chromaticAberration: params.chromaticAberration !== undefined ? params.chromaticAberration : 0.04,
            fisheye: params.fisheye !== undefined ? params.fisheye : 0.0,
            vignetteBoost: params.vignetteBoost !== undefined ? params.vignetteBoost : 1.0,
            vignetteReduction: params.vignetteReduction !== undefined ? params.vignetteReduction : 0.5,
            noiseIntensity: params.noiseIntensity !== undefined ? params.noiseIntensity : 0.02,

            // Color Grading
            gamma: params.gamma !== undefined ? params.gamma : 1.0,
            minInputLevel: params.minInputLevel !== undefined ? params.minInputLevel : 0.0,
            maxInputLevel: params.maxInputLevel !== undefined ? params.maxInputLevel : 1.0,
          };

          this.sceneTarget = createFBO(1, 1, { type: THREE.HalfFloatType });

          this.bloomPass = new BloomPass(
            this.settings.bloomStrength,
            this.settings.bloomRadius,
            this.settings.bloomThreshold,
            5
          );

          this.finalShader = new THREE.RawShaderMaterial({
            uniforms: {
              resolution: { value: new THREE.Vector2(1, 1) },
              bloomEnabled: { value: this.settings.bloomEnabled },
              bloomStrength: { value: this.settings.bloomStrength },
              vignetteBoost: { value: this.settings.vignetteBoost },
              vignetteReduction: { value: this.settings.vignetteReduction },
              noiseIntensity: { value: this.settings.noiseIntensity },
              inputTexture: { value: null },
              blur0Texture: { value: null },
              blur1Texture: { value: null },
              blur2Texture: { value: null },
              blur3Texture: { value: null },
              blur4Texture: { value: null },
              time: { value: 0 },
            },
            vertexShader: orthoVertexShader,
            fragmentShader: finalFragmentShader,
            glslVersion: THREE.GLSL3,
          });
          this.finalPass = new ShaderPass(this.finalShader);

          this.rgbShader = new THREE.RawShaderMaterial({
            uniforms: {
              inputTexture: { value: this.finalPass.texture },
              chromaticAberrationAmount: { value: this.settings.chromaticAberration },
              fisheyeStrength: { value: this.settings.fisheye },
              minInputLevel: { value: this.settings.minInputLevel },
              maxInputLevel: { value: this.settings.maxInputLevel },
              gammaLevel: { value: this.settings.gamma },
              time: { value: 0 },
            },
            vertexShader: orthoVertexShader,
            fragmentShader: colorFragmentShader,
            glslVersion: THREE.GLSL3,
          });
          this.rgbPass = new ShaderPass(this.rgbShader);

          this.copyShader = new THREE.RawShaderMaterial({
            uniforms: {
              inputTexture: { value: null },
            },
            vertexShader: orthoVertexShader,
            fragmentShader: copyFragmentShader,
            glslVersion: THREE.GLSL3,
          });
          this.copyPass = new ShaderPass(this.copyShader);
        }

        updateSettings() {
          this.bloomPass.enabled = this.settings.bloomEnabled;
          this.bloomPass.strength = this.settings.bloomStrength;
          this.bloomPass.radius = this.settings.bloomRadius;
          this.bloomPass.threshold = this.settings.bloomThreshold;

          this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
          this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;
          this.finalShader.uniforms.vignetteBoost.value = this.settings.vignetteBoost;
          this.finalShader.uniforms.vignetteReduction.value = this.settings.vignetteReduction;
          this.finalShader.uniforms.noiseIntensity.value = this.settings.noiseIntensity;

          this.rgbShader.uniforms.chromaticAberrationAmount.value = this.settings.chromaticAberration;
          this.rgbShader.uniforms.fisheyeStrength.value = this.settings.fisheye;
          this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
          this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
          this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
        }

        setSize(w0, h0, dpr = 1) {
          const w = Math.max(1, Math.floor(w0 * dpr));
          const h = Math.max(1, Math.floor(h0 * dpr));
          this.sceneTarget.setSize(w, h);
          this.finalPass.setSize(w, h);
          this.finalShader.uniforms.resolution.value.set(w, h);
          this.bloomPass.setSize(w, h);
          this.rgbPass.setSize(w, h);
          this.copyPass.setSize(w, h);
        }

        renderScene(scene, camera) {
          if (!this.settings.enabled) {
            this.renderer.render(scene, camera);
            return;
          }
          this.renderer.setRenderTarget(this.sceneTarget);
          this.renderer.render(scene, camera);
          this.renderer.setRenderTarget(null);
          this.render(this.sceneTarget.texture);
        }

        render(sourceTexture) {
          if (!this.settings.enabled) {
            this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
            this.copyPass.render(this.renderer, true);
            return;
          }

          this.updateSettings();

          this.bloomPass.source = sourceTexture;
          this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
          this.bloomPass.render(this.renderer);

          this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
          this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
          this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
          this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
          this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

          const randomTime = Math.random() * 100000;
          this.finalPass.shader.uniforms.time.value = randomTime;
          this.rgbPass.shader.uniforms.time.value = randomTime;

          this.finalPass.render(this.renderer);
          this.rgbPass.render(this.renderer, true);
        }

        attachGUI(gui, title = "Post-Processing Suite") {
          const root = gui.addFolder(title);
          root.add(this.settings, "enabled").name("Enable Suite");

          const bloom = root.addFolder("Bloom");
          bloom.add(this.settings, "bloomEnabled").name("Enable Bloom").onChange(() => this.updateSettings());
          bloom.add(this.settings, "bloomStrength", 0, 3.0, 0.05).name("Strength").onChange(() => this.updateSettings());
          bloom.add(this.settings, "bloomRadius", 0, 2.0, 0.05).name("Radius").onChange(() => this.updateSettings());
          bloom.add(this.settings, "bloomThreshold", 0, 1.0, 0.01).name("Threshold").onChange(() => this.updateSettings());

          const lens = root.addFolder("Lens & Optics");
          lens.add(this.settings, "fisheye", -0.8, 0.8, 0.01).name("Fisheye Lens").onChange(() => this.updateSettings());
          lens.add(this.settings, "chromaticAberration", 0, 0.2, 0.005).name("Chromatic Aberration").onChange(() => this.updateSettings());
          lens.add(this.settings, "vignetteBoost", 0, 2.0, 0.05).name("Vignette Boost").onChange(() => this.updateSettings());
          lens.add(this.settings, "vignetteReduction", 0, 2.0, 0.05).name("Vignette Falloff").onChange(() => this.updateSettings());
          lens.add(this.settings, "noiseIntensity", 0, 0.1, 0.005).name("Film Grain").onChange(() => this.updateSettings());
          lens.add(this.settings, "gamma", 0.2, 2.0, 0.05).name("Gamma").onChange(() => this.updateSettings());
          lens.add(this.settings, "minInputLevel", 0, 0.5, 0.01).name("Black Level").onChange(() => this.updateSettings());
          lens.add(this.settings, "maxInputLevel", 0.5, 1.0, 0.01).name("White Level").onChange(() => this.updateSettings());

          return root;
        }
      }

      // =========================================================================
      // 2. Bioluminescent Deep-Sea Color Palettes (5 Curated Presets)
      // =========================================================================

      const COLOR_PALETTES = {
        'Abyssal Jellyfish': {
          color1: '#00f5d4', // Bioluminescent Teal
          color2: '#7b2cbf', // Royal Violet
          color3: '#ff007f', // Hot Pink Accent
          color4: '#e0fbfc', // Photophore Cyan-White
          ambient: '#020514' // Deep Abyssal Navy
        },
        'Mariana Trench': {
          color1: '#00f59b', // Electric Seafoam
          color2: '#3a0ca3', // Hadal Deep Indigo
          color3: '#f72585', // Neon Coral Magenta
          color4: '#d8f3dc', // Phosphor Pearl
          ambient: '#000208' // Pitch Black Abyss
        },
        'Neon Siphonophore': {
          color1: '#00b4d8', // Electric Turquoise
          color2: '#7209b7', // Velvet Purple
          color3: '#ff0054', // Radioactive Rose
          color4: '#90e0ef', // Bio Glow Center
          ambient: '#040212' // Midnight Abyss
        },
        'Luminescent Coral Garden': {
          color1: '#06d6a0', // Deep Aqua Mint
          color2: '#9b5de5', // Orchid Glow
          color3: '#f15bb5', // Flamingo Pink
          color4: '#fee440', // Coral Gold Sparkle
          ambient: '#010a15' // Deep Ocean Trench
        },
        'Hydrothermal Vent': {
          color1: '#00e5ff', // Luminescent Cyan
          color2: '#5a189a', // Thermal Violet
          color3: '#ff0033', // Volcanic Crimson Flame
          color4: '#ffaa00', // Amber Flare
          ambient: '#0a030d' // Basalt Obsidian
        }
      };

      // =========================================================================
      // 3. Settings & Configuration
      // =========================================================================

      const settings = {
        // Presets & Modes
        colorPreset: 'Abyssal Jellyfish',
        animationPreset: 'Static Sanctuary',
        clickToRandomize: true,

        // Display & Environment
        dpr: Math.min(window.devicePixelRatio || 1, 2.0),
        greenScreen: false,

        // Colors
        color1: COLOR_PALETTES['Abyssal Jellyfish'].color1,
        color2: COLOR_PALETTES['Abyssal Jellyfish'].color2,
        color3: COLOR_PALETTES['Abyssal Jellyfish'].color3,
        color4: COLOR_PALETTES['Abyssal Jellyfish'].color4,
        ambient: COLOR_PALETTES['Abyssal Jellyfish'].ambient,

        // Motion & Speed
        timeScale: 0.6,
        waveSpeed: 0.8,
        animationSpeed: 1.0,

        // Organic Perlin / Simplex Wave Settings
        waveHeight: 1.25,
        noiseScale: 0.85,
        noiseAmount: 0.45,
        noiseFreq: 0.35,

        // Wave Harmonics
        wave1Freq: 2.4,
        wave1Amp: 0.12,
        wave2Freq: 0.8,
        wave2Amp: -0.15,
        wave3FreqX: 0.5,
        wave3FreqZ: 0.6,
        wave3Amp: 0.18,

        // Bioluminescence & Glow Optics
        bioSpotDensity: 2.2,
        spotSharpness: 3.5,
        spotBrightness: 2.4,
        pulseIntensity: 1.8,
        pulseSpeed: 1.2,

        // Volumetric Raymarcher
        foldingOffset: 8.5,
        stepBase: 0.12,
        glowIntensity: 0.012,
        glowSpread: 4.5,
        fineNoiseAmount: 0.003,

        // Camera Placement & Lens Settings
        cameraPosX: 0.0,
        cameraPosY: 1.8,
        cameraPosZ: 4.8,
        targetX: 0.0,
        targetY: 0.2,
        targetZ: 0.0,
        cameraFov: 55.0
      };

      // =========================================================================
      // 4. Three.js Core Setup
      // =========================================================================

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(
        settings.cameraFov,
        window.innerWidth / window.innerHeight,
        0.1,
        100.0
      );
      camera.position.set(settings.cameraPosX, settings.cameraPosY, settings.cameraPosZ);

      const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
      renderer.setPixelRatio(settings.dpr);
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.target.set(settings.targetX, settings.targetY, settings.targetZ);
      controls.update();

      const postProcessor = new PostProcessor(renderer, { enabled: false });
      postProcessor.setSize(window.innerWidth, window.innerHeight, settings.dpr);

      // =========================================================================
      // 5. Volumetric Bioluminescent Shader Material
      // =========================================================================

      const uniforms = {
        iTime: { value: 0.0 },
        iResolution: { value: new THREE.Vector3() },
        uBackgroundColor: { value: new THREE.Color(settings.ambient) },
        uGreenScreen: { value: 0.0 },

        // Colors
        uColor1: { value: new THREE.Color(settings.color1) },
        uColor2: { value: new THREE.Color(settings.color2) },
        uColor3: { value: new THREE.Color(settings.color3) },
        uColor4: { value: new THREE.Color(settings.color4) },

        // Animation & Wave
        uTimeScale: { value: settings.timeScale },
        uWaveSpeed: { value: settings.waveSpeed },
        uWaveHeight: { value: settings.waveHeight },
        uNoiseScale: { value: settings.noiseScale },
        uNoiseAmount: { value: settings.noiseAmount },
        uNoiseFreq: { value: settings.noiseFreq },

        uWave1Freq: { value: settings.wave1Freq },
        uWave1Amp: { value: settings.wave1Amp },
        uWave2Freq: { value: settings.wave2Freq },
        uWave2Amp: { value: settings.wave2Amp },
        uWave3FreqX: { value: settings.wave3FreqX },
        uWave3FreqZ: { value: settings.wave3FreqZ },
        uWave3Amp: { value: settings.wave3Amp },

        // Bioluminescence
        uBioSpotDensity: { value: settings.bioSpotDensity },
        uSpotSharpness: { value: settings.spotSharpness },
        uSpotBrightness: { value: settings.spotBrightness },
        uPulseIntensity: { value: settings.pulseIntensity },
        uPulseSpeed: { value: settings.pulseSpeed },

        // Fractal & Optics
        uFoldingOffset: { value: settings.foldingOffset },
        uStepBase: { value: settings.stepBase },
        uGlowIntensity: { value: settings.glowIntensity },
        uGlowSpread: { value: settings.glowSpread },
        uFineNoiseAmount: { value: settings.fineNoiseAmount },

        // Camera Uniforms
        uCameraPos: { value: new THREE.Vector3() },
        uCameraTarget: { value: new THREE.Vector3() },
        uCameraFov: { value: settings.cameraFov },
        uAspect: { value: window.innerWidth / window.innerHeight }
      };

      const vertexShader = `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = vec4(position, 1.0);
        }
      `;

      const fragmentShader = `
        precision highp float;

        uniform vec3 iResolution;
        uniform float iTime;
        uniform vec3 uBackgroundColor;
        uniform float uGreenScreen;

        uniform vec3 uColor1;
        uniform vec3 uColor2;
        uniform vec3 uColor3;
        uniform vec3 uColor4;

        uniform float uTimeScale;
        uniform float uWaveSpeed;
        uniform float uWaveHeight;
        uniform float uNoiseScale;
        uniform float uNoiseAmount;
        uniform float uNoiseFreq;

        uniform float uWave1Freq;
        uniform float uWave1Amp;
        uniform float uWave2Freq;
        uniform float uWave2Amp;
        uniform float uWave3FreqX;
        uniform float uWave3FreqZ;
        uniform float uWave3Amp;

        uniform float uBioSpotDensity;
        uniform float uSpotSharpness;
        uniform float uSpotBrightness;
        uniform float uPulseIntensity;
        uniform float uPulseSpeed;

        uniform float uFoldingOffset;
        uniform float uStepBase;
        uniform float uGlowIntensity;
        uniform float uGlowSpread;
        uniform float uFineNoiseAmount;

        uniform vec3 uCameraPos;
        uniform vec3 uCameraTarget;
        uniform float uCameraFov;
        uniform float uAspect;

        // --- Fast 3D Simplex Noise ---
        vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec4 permute(vec4 x) { return mod289(((x * 34.0) + 1.0) * x); }
        vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

        float snoise(vec3 v) {
          const vec2 C = vec2(1.0 / 6.0, 1.0 / 3.0);
          const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);

          vec3 i = floor(v + dot(v, C.yyy));
          vec3 x0 = v - i + dot(i, C.xxx);

          vec3 g = step(x0.yzx, x0.xyz);
          vec3 l = 1.0 - g;
          vec3 i1 = min(g.xyz, l.zxy);
          vec3 i2 = max(g.xyz, l.zxy);

          vec3 x1 = x0 - i1 + C.xxx;
          vec3 x2 = x0 - i2 + C.yyy;
          vec3 x3 = x0 - D.yyy;

          i = mod289(i);
          vec4 p = permute(permute(permute(
                    i.z + vec4(0.0, i1.z, i2.z, 1.0))
                  + i.y + vec4(0.0, i1.y, i2.y, 1.0))
                  + i.x + vec4(0.0, i1.x, i2.x, 1.0));

          float n_ = 0.142857142857;
          vec3 ns = n_ * D.wyz - D.xzx;

          vec4 j = p - 49.0 * floor(p * ns.z * ns.z);

          vec4 x_ = floor(j * ns.z);
          vec4 y_ = floor(j - 7.0 * x_);

          vec4 x = x_ * ns.x + ns.yyyy;
          vec4 y = y_ * ns.x + ns.yyyy;
          vec4 h = 1.0 - abs(x) - abs(y);

          vec4 b0 = vec4(x.xy, y.xy);
          vec4 b1 = vec4(x.zw, y.zw);

          vec4 s0 = floor(b0) * 2.0 + 1.0;
          vec4 s1 = floor(b1) * 2.0 + 1.0;
          vec4 sh = -step(h, vec4(0.0));

          vec4 a0 = b0.xzyw + s0.xzyw * sh.xxyy;
          vec4 a1 = b1.xzyw + s1.xzyw * sh.zzww;

          vec3 p0 = vec3(a0.xy, h.x);
          vec3 p1 = vec3(a0.zw, h.y);
          vec3 p2 = vec3(a1.xy, h.z);
          vec3 p3 = vec3(a1.zw, h.w);

          vec4 norm = taylorInvSqrt(vec4(dot(p0, p0), dot(p1, p1), dot(p2, p2), dot(p3, p3)));
          p0 *= norm.x;
          p1 *= norm.y;
          p2 *= norm.z;
          p3 *= norm.w;

          vec4 m = max(0.6 - vec4(dot(x0, x0), dot(x1, x1), dot(x2, x2), dot(x3, x3)), 0.0);
          m = m * m;
          return 42.0 * dot(m * m, vec4(dot(p0, x0), dot(p1, x1), dot(p2, x2), dot(p3, x3)));
        }

        // --- Fine Dither Noise ---
        float generateFineNoise(vec2 p) {
          vec3 p3 = fract(vec3(p.xyx) * 8.6231);
          p3 += dot(p3, p3.yzx + 67.92);
          return fract((p3.x + p3.y) * p3.z);
        }

        // --- Organic Deep-Sea Wave with Perlin/Simplex Noise ---
        float getOrganicWave(vec3 p, float t) {
          float wTime = t * uWaveSpeed;

          // Organic Perlin/simplex noise modulation
          vec3 np = vec3(p.x * uNoiseFreq, p.z * uNoiseFreq, wTime * 0.18);
          float n1 = snoise(np * uNoiseScale);
          float n2 = snoise(np * uNoiseScale * 2.2 + vec3(4.1, 1.7, -wTime * 0.12)) * 0.5;
          float organicNoise = (n1 + n2) * uNoiseAmount;

          // Slower organic undulating waves
          float wave = sin(p.x * uWave1Freq + organicNoise * 2.5 + wTime * 0.6) * uWave1Amp
                     + cos(p.z * uWave2Freq - organicNoise * 2.0 - wTime * 0.4) * uWave2Amp
                     + sin((p.x * uWave3FreqX) - (p.z * uWave3FreqZ) + wTime * 0.8) * uWave3Amp;

          return (wave + organicNoise * 0.6) * uWaveHeight;
        }

        void main() {
          vec2 fragCoord = gl_FragCoord.xy;
          vec2 uv = (2.0 * fragCoord - iResolution.xy) / iResolution.y;

          // Camera Ray Generation
          vec3 forward = normalize(uCameraTarget - uCameraPos);
          vec3 right = normalize(cross(forward, vec3(0.0, 1.0, 0.0)));
          vec3 up = cross(right, forward);

          float fovRad = radians(uCameraFov * 0.5);
          float tanFov = tan(fovRad);
          vec3 rayDir = normalize(forward + uv.x * right * tanFov + uv.y * up * tanFov);
          vec3 rayOrigin = uCameraPos;

          // Raymarcher Initialization
          vec4 finalColor = vec4(0.0);
          float totalDistance = 0.0;
          float timeElapsed = iTime * uTimeScale;
          float pixelNoise = generateFineNoise(fragCoord) * uFineNoiseAmount;

          // Raymarching Loop
          for (int i = 0; i < 44; i++) {
            vec3 currentPos = rayOrigin + rayDir * totalDistance;

            // Distance to organic wave surface
            float waveH = getOrganicWave(currentPos, timeElapsed);
            float distToWave = abs(currentPos.y - waveH);

            // Folding and spatial transformation
            vec3 foldedPos = currentPos / uFoldingOffset;

            // Adaptive step size
            float stepSize = min(distToWave * 0.5 + 0.03, pixelNoise) + uStepBase;
            totalDistance += stepSize;

            // 1. Organic trigonometric interference
            float pattern1 = sin(foldedPos.x * 2.5 + cos(foldedPos.y * 3.0) * cos(foldedPos.z * 2.5));
            float pattern2 = sin(foldedPos.z * 2.5 + sin(foldedPos.y * 2.0) * cos(foldedPos.x * 2.5 + timeElapsed * 0.3));
            float bioPattern = smoothstep(0.45, 0.75, pattern1 * pattern2);

            // 2. Proximity glow
            float blendFactor = 0.16 / (distToWave * distToWave + 0.009);
            float mixedPattern = mix(bioPattern, 1.0, blendFactor);

            // 3. Localized glowing bioluminescent spots (photophores/coral nodes)
            vec3 spotCoord = currentPos * uBioSpotDensity + vec3(0.0, timeElapsed * 0.15, 0.0);
            float spotNoise = max(0.0, snoise(spotCoord));
            float spotGlow = pow(spotNoise, uSpotSharpness) * uSpotBrightness;

            // 4. Traveling electrical pulse waves
            float pulseWave = sin(length(currentPos.xz) * 1.6 - timeElapsed * uPulseSpeed * 2.0);
            float pulseGlow = smoothstep(0.82, 0.99, pulseWave) * uPulseIntensity;

            // 5. Glow intensity calculation
            float glow = uGlowIntensity / (uGlowSpread + stepSize * 2.5);

            // 6. Deep sea atmospheric depth fade
            float depthFade = smoothstep(40.0, 3.5, totalDistance);

            // 7. Bioluminescent color gradient: Teal -> Violet -> Hot Pink
            float colorPhase = fract(totalDistance * 0.14 + currentPos.y * 0.2 + timeElapsed * 0.08);
            vec3 paletteColor;
            if (colorPhase < 0.333) {
              paletteColor = mix(uColor1, uColor2, colorPhase / 0.333); // Teal to Violet
            } else if (colorPhase < 0.666) {
              paletteColor = mix(uColor2, uColor3, (colorPhase - 0.333) / 0.333); // Violet to Hot Pink
            } else {
              paletteColor = mix(uColor3, uColor1, (colorPhase - 0.666) / 0.334); // Hot Pink to Teal
            }

            // Photophore localized intense glow (Teal/White/Pink spark)
            vec3 spotColor = mix(uColor4, vec3(1.0), 0.6) * spotGlow * 1.8;
            vec3 pulseColor = uColor3 * pulseGlow * 1.5;

            // Accumulate color
            vec3 stepColor = (paletteColor * (mixedPattern + glow * 12.0) + spotColor + pulseColor) * glow * depthFade;
            finalColor.rgb += stepColor;
          }

          float sceneIntensity = max(finalColor.r, max(finalColor.g, finalColor.b));

          // Anti-banding dithering
          if (uGreenScreen < 0.5 || sceneIntensity > 0.002) {
            float dither = (generateFineNoise(fragCoord + vec2(12.34, 56.78)) - 0.5) / 128.0;
            finalColor.rgb += vec3(dither);
          }

          // Green screen chroma background or normal abyssal background
          if (uGreenScreen > 0.5 && sceneIntensity <= 0.002) {
            gl_FragColor = vec4(uBackgroundColor, 1.0);
          } else {
            gl_FragColor = vec4(uBackgroundColor + finalColor.rgb, 1.0);
          }
        }
      `;

      const material = new THREE.ShaderMaterial({
        vertexShader: vertexShader,
        fragmentShader: fragmentShader,
        uniforms: uniforms,
        depthWrite: false,
        depthTest: false
      });

      // Fullscreen quad in an orthographic display scene
      const quadScene = new THREE.Scene();
      const quadCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
      const quadMesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
      quadScene.add(quadMesh);

      // =========================================================================
      // 6. Greenscreen & Resolution Management
      // =========================================================================

      function setGreenScreen(enabled) {
        const color = enabled ? '#00ff00' : settings.ambient;
        document.body.style.backgroundColor = color;
        renderer.setClearColor(color, 1);
        uniforms.uBackgroundColor.value.set(color);
        uniforms.uGreenScreen.value = enabled ? 1.0 : 0.0;
      }

      function updateResolution() {
        const width = window.innerWidth;
        const height = window.innerHeight;
        renderer.setSize(width, height);
        camera.aspect = width / height;
        camera.updateProjectionMatrix();

        const pixelRatio = renderer.getPixelRatio();
        uniforms.iResolution.value.set(width * pixelRatio, height * pixelRatio, 1);
        uniforms.uAspect.value = width / height;

        postProcessor.setSize(width, height, pixelRatio);
      }

      window.addEventListener('resize', updateResolution);
      updateResolution();
      setGreenScreen(settings.greenScreen);

      // =========================================================================
      // 7. Palette & Theme Management
      // =========================================================================

      function applyPalette(paletteName) {
        const pal = COLOR_PALETTES[paletteName];
        if (!pal) return;

        settings.color1 = pal.color1;
        settings.color2 = pal.color2;
        settings.color3 = pal.color3;
        settings.color4 = pal.color4;
        settings.ambient = pal.ambient;

        uniforms.uColor1.value.set(pal.color1);
        uniforms.uColor2.value.set(pal.color2);
        uniforms.uColor3.value.set(pal.color3);
        uniforms.uColor4.value.set(pal.color4);
        if (!settings.greenScreen) {
          uniforms.uBackgroundColor.value.set(pal.ambient);
          document.body.style.backgroundColor = pal.ambient;
        }

        if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
      }

      function updateColorsFromSettings() {
        uniforms.uColor1.value.set(settings.color1);
        uniforms.uColor2.value.set(settings.color2);
        uniforms.uColor3.value.set(settings.color3);
        uniforms.uColor4.value.set(settings.color4);
        if (!settings.greenScreen) {
          uniforms.uBackgroundColor.value.set(settings.ambient);
          document.body.style.backgroundColor = settings.ambient;
        }
      }

      // =========================================================================
      // 8. Procedural Scene Randomizer
      // =========================================================================

      function randomizeScene() {
        const paletteKeys = Object.keys(COLOR_PALETTES);
        const randomPaletteKey = paletteKeys[Math.floor(Math.random() * paletteKeys.length)];
        settings.colorPreset = randomPaletteKey;
        applyPalette(randomPaletteKey);

        // Procedural organic geometric & motion parameters
        settings.waveHeight = parseFloat((0.8 + Math.random() * 1.2).toFixed(2));
        settings.noiseScale = parseFloat((0.5 + Math.random() * 0.9).toFixed(2));
        settings.noiseAmount = parseFloat((0.25 + Math.random() * 0.45).toFixed(2));
        settings.noiseFreq = parseFloat((0.2 + Math.random() * 0.4).toFixed(2));

        settings.wave1Freq = parseFloat((1.2 + Math.random() * 3.5).toFixed(1));
        settings.wave1Amp = parseFloat(((Math.random() - 0.5) * 0.3).toFixed(3));
        settings.wave2Freq = parseFloat((0.4 + Math.random() * 1.8).toFixed(2));
        settings.wave2Amp = parseFloat(((Math.random() - 0.5) * 0.3).toFixed(3));
        settings.wave3FreqX = parseFloat(((Math.random() - 0.5) * 1.5).toFixed(2));
        settings.wave3FreqZ = parseFloat(((Math.random() - 0.5) * 1.5).toFixed(2));
        settings.wave3Amp = parseFloat(((Math.random() - 0.5) * 0.3).toFixed(3));

        settings.bioSpotDensity = parseFloat((1.5 + Math.random() * 2.5).toFixed(1));
        settings.spotSharpness = parseFloat((2.5 + Math.random() * 3.0).toFixed(1));
        settings.spotBrightness = parseFloat((1.5 + Math.random() * 2.5).toFixed(1));
        settings.pulseIntensity = parseFloat((1.0 + Math.random() * 2.0).toFixed(1));
        settings.pulseSpeed = parseFloat((0.8 + Math.random() * 1.5).toFixed(2));

        settings.foldingOffset = parseFloat((6.0 + Math.random() * 5.0).toFixed(2));
        settings.stepBase = parseFloat((0.08 + Math.random() * 0.12).toFixed(3));
        settings.glowIntensity = parseFloat((0.008 + Math.random() * 0.015).toFixed(4));
        settings.glowSpread = parseFloat((3.0 + Math.random() * 4.0).toFixed(1));

        // Sync uniforms
        uniforms.uWaveHeight.value = settings.waveHeight;
        uniforms.uNoiseScale.value = settings.noiseScale;
        uniforms.uNoiseAmount.value = settings.noiseAmount;
        uniforms.uNoiseFreq.value = settings.noiseFreq;

        uniforms.uWave1Freq.value = settings.wave1Freq;
        uniforms.uWave1Amp.value = settings.wave1Amp;
        uniforms.uWave2Freq.value = settings.wave2Freq;
        uniforms.uWave2Amp.value = settings.wave2Amp;
        uniforms.uWave3FreqX.value = settings.wave3FreqX;
        uniforms.uWave3FreqZ.value = settings.wave3FreqZ;
        uniforms.uWave3Amp.value = settings.wave3Amp;

        uniforms.uBioSpotDensity.value = settings.bioSpotDensity;
        uniforms.uSpotSharpness.value = settings.spotSharpness;
        uniforms.uSpotBrightness.value = settings.spotBrightness;
        uniforms.uPulseIntensity.value = settings.pulseIntensity;
        uniforms.uPulseSpeed.value = settings.pulseSpeed;

        uniforms.uFoldingOffset.value = settings.foldingOffset;
        uniforms.uStepBase.value = settings.stepBase;
        uniforms.uGlowIntensity.value = settings.glowIntensity;
        uniforms.uGlowSpread.value = settings.glowSpread;

        if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
      }

      // Pointer Click vs Drag Handler
      let pointerDownX = 0;
      let pointerDownY = 0;
      let pointerDownTime = 0;

      window.addEventListener('pointerdown', (e) => {
        // Ignore clicks on lil-gui
        if (e.target.closest('.lil-gui')) return;
        pointerDownX = e.clientX;
        pointerDownY = e.clientY;
        pointerDownTime = performance.now();
      });

      window.addEventListener('pointerup', (e) => {
        if (e.target.closest('.lil-gui')) return;
        const dx = e.clientX - pointerDownX;
        const dy = e.clientY - pointerDownY;
        const dist = Math.hypot(dx, dy);
        const duration = performance.now() - pointerDownTime;

        if (dist < 6 && duration < 300 && settings.clickToRandomize) {
          randomizeScene();
        }
      });

      // =========================================================================
      // 9. Presetupped Camera Animations
      // =========================================================================

      const ANIMATION_PRESETS = [
        'Static Sanctuary',
        'Abyssal Oceanic Orbit',
        'Deep Wave Ascender',
        'Submersible Fly-Through',
        'Sinuous Current Drift'
      ];

      function updateCameraAnimation(time) {
        const anim = settings.animationPreset;
        const speed = settings.animationSpeed * 0.3;

        if (anim === 'Static Sanctuary') {
          // Static camera: user has full manual OrbitControls freedom
          return;
        }

        if (anim === 'Abyssal Oceanic Orbit') {
          const radius = 5.2;
          const angle = time * speed;
          camera.position.x = Math.sin(angle) * radius;
          camera.position.z = Math.cos(angle) * radius;
          camera.position.y = 1.8 + Math.sin(angle * 0.5) * 0.6;
          controls.target.set(0.0, 0.2, 0.0);
        } else if (anim === 'Deep Wave Ascender') {
          const t = time * speed;
          camera.position.x = Math.sin(t * 0.6) * 2.2;
          camera.position.y = 1.4 + Math.sin(t * 0.8) * 1.8;
          camera.position.z = 3.8 + Math.cos(t * 0.5) * 1.5;
          controls.target.set(0.0, 0.3 + Math.sin(t * 0.4) * 0.5, 0.0);
        } else if (anim === 'Submersible Fly-Through') {
          const t = time * speed;
          camera.position.x = Math.sin(t * 0.7) * 1.8;
          camera.position.y = 1.0 + Math.cos(t * 0.5) * 0.8;
          camera.position.z = 2.5 + Math.sin(t * 0.4) * 2.0;
          controls.target.set(Math.sin(t * 0.7 + 0.5) * 0.8, 0.0, Math.cos(t * 0.4) * 1.2);
        } else if (anim === 'Sinuous Current Drift') {
          const t = time * speed;
          // Figure-8 Lemniscate sway
          camera.position.x = Math.sin(t * 0.8) * 3.2;
          camera.position.y = 2.0 + Math.sin(t * 1.6) * 0.9;
          camera.position.z = 4.2 + Math.cos(t * 0.8) * 1.2;
          controls.target.set(Math.sin(t * 0.4) * 0.5, 0.2 + Math.cos(t * 0.6) * 0.3, 0.0);
        }

        controls.update();

        // Update settings representation
        settings.cameraPosX = parseFloat(camera.position.x.toFixed(2));
        settings.cameraPosY = parseFloat(camera.position.y.toFixed(2));
        settings.cameraPosZ = parseFloat(camera.position.z.toFixed(2));
        settings.targetX = parseFloat(controls.target.x.toFixed(2));
        settings.targetY = parseFloat(controls.target.y.toFixed(2));
        settings.targetZ = parseFloat(controls.target.z.toFixed(2));
      }

      // =========================================================================
      // 10. GUI Controls (lil-gui)
      // =========================================================================

      const gui = new GUI({ title: "Bioluminescent Abyssal Wave" });

      // Folder: Presets & Modes
      const fPresets = gui.addFolder("Presets & Modes");
      fPresets
        .add(settings, "colorPreset", Object.keys(COLOR_PALETTES))
        .name("Color Scheme")
        .onChange(applyPalette);
      fPresets
        .add(settings, "animationPreset", ANIMATION_PRESETS)
        .name("Animation Mode")
        .onChange((val) => {
          if (val === 'Static Sanctuary') {
            camera.position.set(0.0, 1.8, 4.8);
            controls.target.set(0.0, 0.2, 0.0);
            controls.update();
          }
        });
      fPresets
        .add(settings, "clickToRandomize")
        .name("Click to Randomize");

      // Folder: Display & Rendering
      const fRender = gui.addFolder("Rendering & Display");
      fRender
        .add(settings, "dpr", 0.5, 3.0, 0.1)
        .name("Device Pixel Ratio")
        .onChange((val) => {
          renderer.setPixelRatio(val);
          updateResolution();
        });
      fRender
        .add(settings, "greenScreen")
        .name("Green Screen (#00ff00)")
        .onChange(setGreenScreen);

      // Folder: Bioluminescent Colors
      const fColors = gui.addFolder("Color Palette");
      fColors.addColor(settings, "color1").name("Color 1 (Teal)").onChange(updateColorsFromSettings);
      fColors.addColor(settings, "color2").name("Color 2 (Violet)").onChange(updateColorsFromSettings);
      fColors.addColor(settings, "color3").name("Color 3 (Hot Pink)").onChange(updateColorsFromSettings);
      fColors.addColor(settings, "color4").name("Color 4 (Photophore)").onChange(updateColorsFromSettings);
      fColors.addColor(settings, "ambient").name("Ambient Base").onChange(updateColorsFromSettings);

      // Folder: Animation & Motion
      const fAnim = gui.addFolder("Animation & Speed");
      fAnim
        .add(settings, "timeScale", 0.0, 3.0, 0.05)
        .name("Shader Time Scale")
        .onChange((v) => (uniforms.uTimeScale.value = v));
      fAnim
        .add(settings, "waveSpeed", 0.0, 3.0, 0.05)
        .name("Wave Speed")
        .onChange((v) => (uniforms.uWaveSpeed.value = v));
      fAnim
        .add(settings, "animationSpeed", 0.0, 3.0, 0.05)
        .name("Camera Anim Speed");

      // Folder: Organic Perlin / Simplex Wave
      const fWave = gui.addFolder("Organic Wave & Noise");
      fWave
        .add(settings, "waveHeight", 0.0, 3.0, 0.01)
        .name("Global Height")
        .onChange((v) => (uniforms.uWaveHeight.value = v));
      fWave
        .add(settings, "noiseScale", 0.1, 3.0, 0.05)
        .name("Perlin Noise Scale")
        .onChange((v) => (uniforms.uNoiseScale.value = v));
      fWave
        .add(settings, "noiseAmount", 0.0, 1.5, 0.02)
        .name("Organic Noise Amp")
        .onChange((v) => (uniforms.uNoiseAmount.value = v));
      fWave
        .add(settings, "noiseFreq", 0.05, 2.0, 0.02)
        .name("Noise Frequency")
        .onChange((v) => (uniforms.uNoiseFreq.value = v));

      const fWaveHarmonics = fWave.addFolder("Wave Harmonics");
      fWaveHarmonics.add(settings, "wave1Freq", 0.0, 10.0, 0.1).name("Wave 1 Freq").onChange((v) => (uniforms.uWave1Freq.value = v));
      fWaveHarmonics.add(settings, "wave1Amp", -0.5, 0.5, 0.005).name("Wave 1 Amp").onChange((v) => (uniforms.uWave1Amp.value = v));
      fWaveHarmonics.add(settings, "wave2Freq", 0.0, 5.0, 0.05).name("Wave 2 Freq").onChange((v) => (uniforms.uWave2Freq.value = v));
      fWaveHarmonics.add(settings, "wave2Amp", -0.5, 0.5, 0.005).name("Wave 2 Amp").onChange((v) => (uniforms.uWave2Amp.value = v));
      fWaveHarmonics.add(settings, "wave3FreqX", -5.0, 5.0, 0.1).name("Wave 3 Freq X").onChange((v) => (uniforms.uWave3FreqX.value = v));
      fWaveHarmonics.add(settings, "wave3FreqZ", -5.0, 5.0, 0.1).name("Wave 3 Freq Z").onChange((v) => (uniforms.uWave3FreqZ.value = v));
      fWaveHarmonics.add(settings, "wave3Amp", -0.5, 0.5, 0.005).name("Wave 3 Amp").onChange((v) => (uniforms.uWave3Amp.value = v));

      // Folder: Bioluminescence & Photophores
      const fBio = gui.addFolder("Bioluminescent Glow");
      fBio.add(settings, "bioSpotDensity", 0.5, 6.0, 0.1).name("Spot Density").onChange((v) => (uniforms.uBioSpotDensity.value = v));
      fBio.add(settings, "spotSharpness", 1.0, 8.0, 0.1).name("Spot Focus").onChange((v) => (uniforms.uSpotSharpness.value = v));
      fBio.add(settings, "spotBrightness", 0.0, 6.0, 0.1).name("Spot Glow Brightness").onChange((v) => (uniforms.uSpotBrightness.value = v));
      fBio.add(settings, "pulseIntensity", 0.0, 5.0, 0.1).name("Pulse Wave Glow").onChange((v) => (uniforms.uPulseIntensity.value = v));
      fBio.add(settings, "pulseSpeed", 0.1, 4.0, 0.1).name("Pulse Travel Speed").onChange((v) => (uniforms.uPulseSpeed.value = v));
      fBio.add(settings, "glowIntensity", 0.001, 0.05, 0.001).name("Atmosphere Glow").onChange((v) => (uniforms.uGlowIntensity.value = v));
      fBio.add(settings, "glowSpread", 0.5, 10.0, 0.1).name("Glow Spread").onChange((v) => (uniforms.uGlowSpread.value = v));
      fBio.add(settings, "foldingOffset", 2.0, 20.0, 0.1).name("Fractal Fold").onChange((v) => (uniforms.uFoldingOffset.value = v));
      fBio.add(settings, "stepBase", 0.02, 0.3, 0.005).name("Step Base").onChange((v) => (uniforms.uStepBase.value = v));

      // Folder: Camera Placement & Lens Settings
      const fCam = gui.addFolder("Camera Placement & Lens");
      fCam.add(settings, "cameraPosX", -20.0, 20.0, 0.1).name("Camera Pos X").listen().onChange((v) => { camera.position.x = v; });
      fCam.add(settings, "cameraPosY", -20.0, 20.0, 0.1).name("Camera Pos Y").listen().onChange((v) => { camera.position.y = v; });
      fCam.add(settings, "cameraPosZ", -20.0, 30.0, 0.1).name("Camera Pos Z").listen().onChange((v) => { camera.position.z = v; });
      fCam.add(settings, "targetX", -10.0, 10.0, 0.1).name("Target X (LookAt)").listen().onChange((v) => { controls.target.x = v; controls.update(); });
      fCam.add(settings, "targetY", -10.0, 10.0, 0.1).name("Target Y (LookAt)").listen().onChange((v) => { controls.target.y = v; controls.update(); });
      fCam.add(settings, "targetZ", -10.0, 10.0, 0.1).name("Target Z (LookAt)").listen().onChange((v) => { controls.target.z = v; controls.update(); });
      fCam.add(settings, "cameraFov", 15.0, 120.0, 1.0).name("Camera FOV").onChange((v) => {
        camera.fov = v;
        camera.updateProjectionMatrix();
        uniforms.uCameraFov.value = v;
      });

      // Attach PostProcessor controls
      postProcessor.attachGUI(gui);

      // Close the GUI by default as required
      gui.close();

      // Keyboard 'H' key to toggle GUI visibility
      window.addEventListener('keydown', (e) => {
        if (e.key === 'h' || e.key === 'H') {
          gui._hidden ? gui.show() : gui.hide();
        }
      });

      // =========================================================================
      // 11. Main Animation & Render Loop
      // =========================================================================

      const clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);

        const elapsedTime = clock.getElapsedTime();
        uniforms.iTime.value = elapsedTime;

        // Update Camera Animation Presets
        updateCameraAnimation(elapsedTime);

        // Update Manual Orbit Controls
        if (settings.animationPreset === 'Static Sanctuary') {
          controls.update();
          settings.cameraPosX = parseFloat(camera.position.x.toFixed(2));
          settings.cameraPosY = parseFloat(camera.position.y.toFixed(2));
          settings.cameraPosZ = parseFloat(camera.position.z.toFixed(2));
          settings.targetX = parseFloat(controls.target.x.toFixed(2));
          settings.targetY = parseFloat(controls.target.y.toFixed(2));
          settings.targetZ = parseFloat(controls.target.z.toFixed(2));
        }

        // Pass camera uniforms to raymarching shader
        uniforms.uCameraPos.value.copy(camera.position);
        uniforms.uCameraTarget.value.copy(controls.target);
        uniforms.uCameraFov.value = camera.fov;

        // Render Scene via PostProcessor or Direct
        postProcessor.renderScene(quadScene, quadCamera);
      }

      animate();
    </script>
  </body>
</html>
