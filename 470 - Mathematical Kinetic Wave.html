<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mathematical Kinetic Wave Matrix</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
      "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
    }
  }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import GUI from 'lil-gui';

    // ============================================================
    // 19+ Preconfigured Color Schemes
    // ============================================================
    const COLOR_SCHEMES = {
      'Original': {
        background: '#000000',
        c1: '#FF0000',
        c2: '#00FF00',
        c3: '#0000FF',
        accent: '#ffffff',
        ambient: '#222222'
      },
      'Monochromatic': {
        background: '#06101e',
        c1: '#1e6091',
        c2: '#52b69a',
        c3: '#76c893',
        accent: '#b5e2fa',
        ambient: '#0b2545'
      },
      'Analogous': {
        background: '#021118',
        c1: '#00c2b2',
        c2: '#2deaa2',
        c3: '#38b0be',
        accent: '#d0ffff',
        ambient: '#041a24'
      },
      'Complementary': {
        background: '#070d18',
        c1: '#ff7b00',
        c2: '#00d4ff',
        c3: '#6698d0',
        accent: '#ffe4c2',
        ambient: '#121e33'
      },
      'Split-complementary': {
        background: '#060814',
        c1: '#ff9d00',
        c2: '#ff3366',
        c3: '#627ab5',
        accent: '#fff0d8',
        ambient: '#16132e'
      },
      'Triadic': {
        background: '#0a0814',
        c1: '#00f0ff',
        c2: '#ff1a60',
        c3: '#fff29e',
        accent: '#9d6ee0',
        ambient: '#1c1236'
      },
      'Tetradic': {
        background: '#0a0a14',
        c1: '#b53df5',
        c2: '#00f5c4',
        c3: '#f55d14',
        accent: '#80e800',
        ambient: '#1c1833'
      },
      'Double split-complementary': {
        background: '#070912',
        c1: '#f0388c',
        c2: '#5eead4',
        c3: '#fbbf24',
        accent: '#818cf8',
        ambient: '#1a1630'
      },
      'Achromatic (black and white)': {
        background: '#000000',
        c1: '#ffffff',
        c2: '#a8a8a8',
        c3: '#555555',
        accent: '#ffffff',
        ambient: '#1c1c1c'
      },
      'Achromatic (white and black)': {
        background: '#ffffff',
        c1: '#000000',
        c2: '#4a4a4a',
        c3: '#8a8a8a',
        accent: '#111111',
        ambient: '#e0e0e0'
      },
      'Achromatic + Accent (black and white + red)': {
        background: '#050505',
        c1: '#ffffff',
        c2: '#7f7f7f',
        c3: '#ff1e1e',
        accent: '#ff3333',
        ambient: '#220808'
      },
      'Achromatic + Accent (white and black + red)': {
        background: '#f5f5f5',
        c1: '#111111',
        c2: '#666666',
        c3: '#ff0033',
        accent: '#cc0029',
        ambient: '#f0d0d0'
      },
      'Neutral + accent': {
        background: '#141518',
        c1: '#8d939e',
        c2: '#ff9e00',
        c3: '#00e5ff',
        accent: '#fff0c8',
        ambient: '#1c1917'
      },
      'Palette 1 (F6AA1C, BC3908, 941B0C, F6AA1C, 220901)': {
        background: '#220901',
        c1: '#F6AA1C',
        c2: '#BC3908',
        c3: '#941B0C',
        accent: '#F6AA1C',
        ambient: '#331004'
      },
      'Palette 2 (63D1CF, 5BC0BE, 4BAD9E, 4BAD9E, 0B132B, 000000)': {
        background: '#000000',
        c1: '#63D1CF',
        c2: '#5BC0BE',
        c3: '#4BAD9E',
        accent: '#63D1CF',
        ambient: '#0B132B'
      },
      'Palette 3 (AA60C8, D69ADE, C9A3C6, CFB5C2, 0D001D, 120A12)': {
        background: '#0D001D',
        c1: '#AA60C8',
        c2: '#D69ADE',
        c3: '#C9A3C6',
        accent: '#CFB5C2',
        ambient: '#120A12'
      },
      'Palette 4 (FEF1BE, FFBA00, 008189, 00474D, 061210)': {
        background: '#061210',
        c1: '#FEF1BE',
        c2: '#FFBA00',
        c3: '#008189',
        accent: '#00474D',
        ambient: '#091c18'
      },
      'Palette 5 (D4FFB0, 7FFF00, 00B894, 0A3322, 05140A)': {
        background: '#05140A',
        c1: '#D4FFB0',
        c2: '#7FFF00',
        c3: '#00B894',
        accent: '#D4FFB0',
        ambient: '#0A3322'
      },
      'Palette 6 (FFE8CC, FF8C00, C7501A, 3D1050, 0E0618)': {
        background: '#0E0618',
        c1: '#FFE8CC',
        c2: '#FF8C00',
        c3: '#C7501A',
        accent: '#FFE8CC',
        ambient: '#3D1050'
      },
      'Palette 7 (E8E0FF, B38FFF, 6A3DE8, 1A1250, 090612)': {
        background: '#090612',
        c1: '#E8E0FF',
        c2: '#B38FFF',
        c3: '#6A3DE8',
        accent: '#B38FFF',
        ambient: '#1A1250'
      },
      'Palette 8 (E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)': {
        background: '#05020F',
        c1: '#E0FBFF',
        c2: '#00F0FF',
        c3: '#D40078',
        accent: '#00F0FF',
        ambient: '#1E0A3D'
      }
    };

    // ============================================================
    // Simulation & Visual Parameters
    // ============================================================
    const params = {
      // Color
      colorScheme: 'Original',
      greenscreen: false,
      backgroundColor: '#000000',
      c1: '#FF0000',
      c2: '#00FF00',
      c3: '#0000FF',
      accentColor: '#ffffff',

      // Camera & Animation
      animation: 'Slow Orbit',
      speed: 1.0,
      dragMode: 'Orbit (Left) / Pan (Right)',

      // Geometry & Dynamics
      shape: 'Boxes',
      scale: 1.0,
      waveAmp: 65.0,
      waveFreq: 1.0,
      zDepth: 55.0,
      twist: 0.8,
      channelDepth: 40.0,
      materialStyle: 'Physical Crystal',

      // Lighting & Exposure
      exposure: 1.0,
      masterIntensity: 1.0,
      ambientIntensity: 0.6,
      ambientColor: '#222222',
      keyIntensity: 2.2,
      keyColor: '#ffffff',
      fillIntensity: 1.8,
      fillColor: '#00d4ff',
      rimIntensity: 2.0,
      rimColor: '#ff0077',
      coreIntensity: 1.5,
      coreColor: '#ffffff',

      // Display & Interaction
      antialias: true,
      dpr: Math.min(window.devicePixelRatio || 1, 2),
      randomizeOnClick: true
    };

    // Grid configuration
    const GRID_ROWS = 36;
    const GRID_COLS = 36;
    const CHANNELS = 3;
    const INSTANCES_PER_CHANNEL = GRID_ROWS * GRID_COLS;
    const TOTAL_INSTANCES = INSTANCES_PER_CHANNEL * CHANNELS;

    // Soft bounded tangent wave to retain mathematical asymptotes smoothly
    function tanSoft(v, max = 5.0) {
      const tv = Math.tan(v);
      return tv < -max ? -max : (tv > max ? max : tv);
    }

    // ============================================================
    // Scene, Camera, Renderer Setup
    // ============================================================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(params.backgroundColor);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 3000);
    camera.position.set(0, 0, 360);

    let renderer = new THREE.WebGLRenderer({
      antialias: params.antialias,
      powerPreference: 'high-performance'
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(params.dpr);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = params.exposure;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.screenSpacePanning = true;
    controls.minDistance = 15;
    controls.maxDistance = 1600;
    controls.target.set(0, 0, 0);

    function updateDragMode() {
      if (params.dragMode === 'Pan (Left) / Orbit (Right)') {
        controls.mouseButtons.LEFT = THREE.MOUSE.PAN;
        controls.mouseButtons.RIGHT = THREE.MOUSE.ROTATE;
      } else {
        controls.mouseButtons.LEFT = THREE.MOUSE.ROTATE;
        controls.mouseButtons.RIGHT = THREE.MOUSE.PAN;
      }
    }
    updateDragMode();

    // ============================================================
    // Lights Setup
    // ============================================================
    const ambientLight = new THREE.AmbientLight(params.ambientColor, params.ambientIntensity * params.masterIntensity);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(params.keyColor, params.keyIntensity * params.masterIntensity);
    keyLight.position.set(160, 220, 180);
    scene.add(keyLight);

    const fillLight = new THREE.PointLight(params.fillColor, params.fillIntensity * params.masterIntensity, 900, 1.2);
    fillLight.position.set(-180, -120, 140);
    scene.add(fillLight);

    const rimLight = new THREE.PointLight(params.rimColor, params.rimIntensity * params.masterIntensity, 900, 1.2);
    rimLight.position.set(0, 160, -220);
    scene.add(rimLight);

    const coreLight = new THREE.PointLight(params.coreColor, params.coreIntensity * params.masterIntensity, 500, 1.5);
    coreLight.position.set(0, 0, 40);
    scene.add(coreLight);

    function updateLights() {
      ambientLight.color.set(params.ambientColor);
      ambientLight.intensity = params.ambientIntensity * params.masterIntensity;

      keyLight.color.set(params.keyColor);
      keyLight.intensity = params.keyIntensity * params.masterIntensity;

      fillLight.color.set(params.fillColor);
      fillLight.intensity = params.fillIntensity * params.masterIntensity;

      rimLight.color.set(params.rimColor);
      rimLight.intensity = params.rimIntensity * params.masterIntensity;

      coreLight.color.set(params.coreColor);
      coreLight.intensity = params.coreIntensity * params.masterIntensity;
    }

    // ============================================================
    // Instanced Geometry & Material Management
    // ============================================================
    function createShapeGeometry(shapeName) {
      switch (shapeName) {
        case 'Octahedra':
          return new THREE.OctahedronGeometry(2.4, 0);
        case 'Prisms':
          return new THREE.CylinderGeometry(2.2, 2.2, 3.2, 3);
        case 'Diamonds':
          return new THREE.ConeGeometry(2.2, 4.0, 4);
        case 'Spheres':
          return new THREE.SphereGeometry(2.2, 12, 10);
        case 'Rings':
          return new THREE.TorusGeometry(2.4, 0.7, 8, 16);
        case 'Boxes':
        default:
          return new THREE.BoxGeometry(3.2, 3.2, 3.2);
      }
    }

    function createMaterial(styleName) {
      if (styleName === 'Additive Hologram') {
        return new THREE.MeshBasicMaterial({
          transparent: true,
          opacity: 0.75,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        });
      }
      return new THREE.MeshPhysicalMaterial({
        roughness: 0.22,
        metalness: 0.45,
        clearcoat: 0.5,
        clearcoatRoughness: 0.15,
        reflectivity: 0.8,
        transmission: 0.15,
        transparent: true,
        opacity: 0.92
      });
    }

    let instancedMesh;
    const dummy = new THREE.Object3D();
    const tempColor = new THREE.Color();

    function rebuildInstancedMesh() {
      if (instancedMesh) {
        scene.remove(instancedMesh);
        instancedMesh.geometry.dispose();
        instancedMesh.material.dispose();
      }

      const geom = createShapeGeometry(params.shape);
      const mat = createMaterial(params.materialStyle);
      instancedMesh = new THREE.InstancedMesh(geom, mat, TOTAL_INSTANCES);
      instancedMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      if (instancedMesh.instanceColor) {
        instancedMesh.instanceColor.setUsage(THREE.DynamicDrawUsage);
      }

      updateInstanceBaseColors();
      scene.add(instancedMesh);
    }

    function updateInstanceBaseColors() {
      if (!instancedMesh) return;
      const c1Obj = new THREE.Color(params.c1);
      const c2Obj = new THREE.Color(params.c2);
      const c3Obj = new THREE.Color(params.c3);

      let idx = 0;
      for (let k = 0; k < CHANNELS; k++) {
        const baseC = (k === 0) ? c1Obj : (k === 1 ? c2Obj : c3Obj);
        for (let i = 0; i < INSTANCES_PER_CHANNEL; i++) {
          instancedMesh.setColorAt(idx, baseC);
          idx++;
        }
      }
      if (instancedMesh.instanceColor) {
        instancedMesh.instanceColor.needsUpdate = true;
      }
    }

    // Background and Greenscreen update
    function updateBackground() {
      if (params.greenscreen) {
        scene.background = new THREE.Color('#00ff00');
      } else {
        scene.background = new THREE.Color(params.backgroundColor);
      }
    }

    // Apply color preset
    function applyColorScheme(name) {
      const scheme = COLOR_SCHEMES[name];
      if (!scheme) return;
      params.backgroundColor = scheme.background;
      params.c1 = scheme.c1;
      params.c2 = scheme.c2;
      params.c3 = scheme.c3;
      params.accentColor = scheme.accent;
      params.ambientColor = scheme.ambient;
      params.keyColor = scheme.accent;
      params.fillColor = scheme.c2;
      params.rimColor = scheme.c1;
      params.coreColor = scheme.c3;

      updateBackground();
      updateLights();
      updateInstanceBaseColors();
    }

    // ============================================================
    // Interaction Tracking (Wheel Zoom & Click vs Drag Handling)
    // ============================================================
    let isUserInteracting = false;
    let pointerDownX = 0;
    let pointerDownY = 0;
    let pointerDownTime = 0;

    function attachCanvasEvents(domElem) {
      domElem.addEventListener('pointerdown', (e) => {
        if (e.target !== domElem || e.button !== 0) return;
        pointerDownX = e.clientX;
        pointerDownY = e.clientY;
        pointerDownTime = performance.now();
        isUserInteracting = true;
      });

      controls.addEventListener('start', () => {
        isUserInteracting = true;
      });

      controls.addEventListener('end', () => {
        isUserInteracting = false;
      });
    }
    attachCanvasEvents(renderer.domElement);

    window.addEventListener('pointerup', (e) => {
      isUserInteracting = false;
      if (e.target !== renderer.domElement || e.button !== 0) return;
      const dist = Math.hypot(e.clientX - pointerDownX, e.clientY - pointerDownY);
      const duration = performance.now() - pointerDownTime;

      // Click threshold: only randomize if user clicked, NOT dragged or orbited
      if (dist < 6 && duration < 320 && params.randomizeOnClick) {
        randomizeScene();
      }
    });

    // ============================================================
    // Procedural Scene Randomizer
    // ============================================================
    function randomizeScene() {
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      params.colorScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      applyColorScheme(params.colorScheme);

      const shapes = ['Boxes', 'Octahedra', 'Prisms', 'Diamonds', 'Spheres', 'Rings'];
      params.shape = shapes[Math.floor(Math.random() * shapes.length)];
      rebuildInstancedMesh();

      params.scale = +(0.5 + Math.random() * 1.5).toFixed(2);
      params.waveAmp = +(30 + Math.random() * 85).toFixed(1);
      params.waveFreq = +(0.4 + Math.random() * 2.0).toFixed(2);
      params.zDepth = +(25 + Math.random() * 90).toFixed(1);
      params.twist = +(0.1 + Math.random() * 2.0).toFixed(2);
      params.speed = +(0.4 + Math.random() * 1.6).toFixed(2);

      const anims = [
        'Static (No Camera Motion)',
        'Slow Orbit',
        'Gentle Drift',
        'Cosmic Spiral',
        'Pendulum Sway',
        'Breathing Pulse',
        'Vertical Wave Glide',
        'Cinematic Pan'
      ];
      params.animation = anims[Math.floor(Math.random() * anims.length)];

      params.exposure = +(0.7 + Math.random() * 0.7).toFixed(2);
      renderer.toneMappingExposure = params.exposure;
      params.keyIntensity = +(1.5 + Math.random() * 2.5).toFixed(1);
      params.fillIntensity = +(1.0 + Math.random() * 2.5).toFixed(1);
      params.rimIntensity = +(1.0 + Math.random() * 3.0).toFixed(1);
      params.coreIntensity = +(1.0 + Math.random() * 3.0).toFixed(1);
      updateLights();

      updateGuiDisplay();
    }

    // ============================================================
    // Antialias & Renderer Rebuilding
    // ============================================================
    function updateAntialiasSetting(enabled) {
      params.antialias = enabled;
      const oldCanvas = renderer.domElement;
      renderer.dispose();

      renderer = new THREE.WebGLRenderer({
        antialias: params.antialias,
        powerPreference: 'high-performance'
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(params.dpr);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = params.exposure;

      oldCanvas.parentNode.replaceChild(renderer.domElement, oldCanvas);
      controls.domElement = renderer.domElement;
      attachCanvasEvents(renderer.domElement);
    }

    // ============================================================
    // GUI Setup (lil-gui with default styling)
    // ============================================================
    const gui = new GUI({ title: 'Scene Controls' });

    // 1. Theme & Colors
    const folderColor = gui.addFolder('Theme & Colors');
    folderColor.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Color Scheme').onChange(v => {
      applyColorScheme(v);
      updateGuiDisplay();
    });
    folderColor.add(params, 'greenscreen').name('Greenscreen (#00ff00)').onChange(updateBackground);
    folderColor.addColor(params, 'backgroundColor').name('Background Color').onChange(updateBackground);
    folderColor.addColor(params, 'c1').name('Channel 1 Color').onChange(() => updateInstanceBaseColors());
    folderColor.addColor(params, 'c2').name('Channel 2 Color').onChange(() => updateInstanceBaseColors());
    folderColor.addColor(params, 'c3').name('Channel 3 Color').onChange(() => updateInstanceBaseColors());
    folderColor.addColor(params, 'accentColor').name('Accent Color');

    // 2. Animation & Camera
    const folderAnim = gui.addFolder('Camera & Animation');
    folderAnim.add(params, 'animation', [
      'Static (No Camera Motion)',
      'Slow Orbit',
      'Gentle Drift',
      'Cosmic Spiral',
      'Pendulum Sway',
      'Breathing Pulse',
      'Vertical Wave Glide',
      'Cinematic Pan'
    ]).name('Animation');
    folderAnim.add(params, 'speed', 0.0, 3.0, 0.05).name('Animation Speed');
    folderAnim.add(params, 'dragMode', [
      'Orbit (Left) / Pan (Right)',
      'Pan (Left) / Orbit (Right)'
    ]).name('Drag Mode').onChange(updateDragMode);

    // 3. Geometry & Mathematics
    const folderGeom = gui.addFolder('Geometry & Dynamics');
    folderGeom.add(params, 'shape', ['Boxes', 'Octahedra', 'Prisms', 'Diamonds', 'Spheres', 'Rings']).name('Shape').onChange(rebuildInstancedMesh);
    folderGeom.add(params, 'materialStyle', ['Physical Crystal', 'Additive Hologram']).name('Material Style').onChange(rebuildInstancedMesh);
    folderGeom.add(params, 'scale', 0.2, 3.0, 0.05).name('Scale');
    folderGeom.add(params, 'waveAmp', 5.0, 150.0, 1.0).name('Wave Amplitude');
    folderGeom.add(params, 'waveFreq', 0.1, 3.0, 0.05).name('Wave Frequency');
    folderGeom.add(params, 'zDepth', 5.0, 150.0, 1.0).name('Z-Depth');
    folderGeom.add(params, 'twist', 0.0, 3.0, 0.05).name('Spatial Twist');

    // 4. Lighting & Exposure
    const folderLight = gui.addFolder('Lighting & Exposure');
    folderLight.add(params, 'exposure', 0.1, 3.0, 0.05).name('Scene Exposure').onChange(v => {
      renderer.toneMappingExposure = v;
    });
    folderLight.add(params, 'masterIntensity', 0.0, 3.0, 0.05).name('Master Intensity').onChange(updateLights);
    folderLight.add(params, 'ambientIntensity', 0.0, 2.0, 0.05).name('Ambient Intensity').onChange(updateLights);
    folderLight.addColor(params, 'ambientColor').name('Ambient Color').onChange(updateLights);
    folderLight.add(params, 'keyIntensity', 0.0, 6.0, 0.1).name('Key Light Intensity').onChange(updateLights);
    folderLight.addColor(params, 'keyColor').name('Key Light Color').onChange(updateLights);
    folderLight.add(params, 'fillIntensity', 0.0, 6.0, 0.1).name('Fill Light Intensity').onChange(updateLights);
    folderLight.addColor(params, 'fillColor').name('Fill Light Color').onChange(updateLights);
    folderLight.add(params, 'rimIntensity', 0.0, 6.0, 0.1).name('Rim Light Intensity').onChange(updateLights);
    folderLight.addColor(params, 'rimColor').name('Rim Light Color').onChange(updateLights);
    folderLight.add(params, 'coreIntensity', 0.0, 6.0, 0.1).name('Core Light Intensity').onChange(updateLights);
    folderLight.addColor(params, 'coreColor').name('Core Light Color').onChange(updateLights);

    // 5. Display & Settings
    const folderDisplay = gui.addFolder('Display Settings');
    folderDisplay.add(params, 'antialias').name('Antialias (Default ON)').onChange(updateAntialiasSetting);
    folderDisplay.add(params, 'dpr', 0.5, 3.0, 0.25).name('Pixel Ratio (DPR)').onChange(v => {
      renderer.setPixelRatio(v);
    });
    folderDisplay.add(params, 'randomizeOnClick').name('Randomize on Click');

    function updateGuiDisplay() {
      function traverse(f) {
        if (f.controllers) f.controllers.forEach(c => c.updateDisplay());
        if (f.folders) f.folders.forEach(child => traverse(child));
      }
      traverse(gui);
    }

    // Toggle GUI visibility with 'H' key
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        gui._hidden ? gui.show() : gui.hide();
      }
    });

    // Window Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Initialize initial mesh and colors
    rebuildInstancedMesh();
    applyColorScheme('Original');

    // ============================================================
    // Animation & Render Loop
    // ============================================================
    let prevTime = performance.now();
    let simTime = 0;
    let animTime = 0;

    const baseC1 = new THREE.Color();
    const baseC2 = new THREE.Color();
    const baseC3 = new THREE.Color();

    function renderLoop(currentTime) {
      requestAnimationFrame(renderLoop);

      const delta = Math.min((currentTime - prevTime) / 1000, 0.1);
      prevTime = currentTime;

      simTime += delta * params.speed * 0.45;
      animTime += delta * params.speed;

      // ============================================================
      // 1. Camera Animation with Zoom & Angle Persistence
      // ============================================================
      if (params.animation === 'Static (No Camera Motion)') {
        controls.autoRotate = false;
        controls.update();
      } else if (params.animation === 'Slow Orbit') {
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.75 * params.speed;
        controls.update();
      } else {
        controls.autoRotate = false;
        controls.update();

        // Apply relative spherical deltas while preserving current camera distance & manual angle
        if (!isUserInteracting) {
          const offset = camera.position.clone().sub(controls.target);
          const spherical = new THREE.Spherical().setFromVector3(offset);
          // Note: spherical.radius is explicitly preserved, maintaining wheel zoom!

          if (params.animation === 'Gentle Drift') {
            spherical.theta += Math.sin(animTime * 0.35) * 0.003 * params.speed;
            spherical.phi = THREE.MathUtils.clamp(
              spherical.phi + Math.cos(animTime * 0.28) * 0.0016 * params.speed,
              0.15, Math.PI - 0.15
            );
          } else if (params.animation === 'Cosmic Spiral') {
            spherical.theta += 0.0045 * params.speed;
            spherical.phi = THREE.MathUtils.clamp(
              spherical.phi + Math.sin(animTime * 0.45) * 0.0022 * params.speed,
              0.2, Math.PI - 0.2
            );
          } else if (params.animation === 'Pendulum Sway') {
            spherical.theta += Math.cos(animTime * 0.55) * 0.0055 * params.speed;
          } else if (params.animation === 'Breathing Pulse') {
            spherical.theta += 0.0025 * params.speed;
            spherical.phi = THREE.MathUtils.clamp(
              spherical.phi + Math.sin(animTime * 0.35) * 0.0018 * params.speed,
              0.22, Math.PI - 0.22
            );
          } else if (params.animation === 'Vertical Wave Glide') {
            spherical.theta += 0.0025 * params.speed;
            spherical.phi = THREE.MathUtils.clamp(
              spherical.phi + Math.sin(animTime * 0.65) * 0.0032 * params.speed,
              0.25, Math.PI - 0.25
            );
          } else if (params.animation === 'Cinematic Pan') {
            spherical.theta += 0.0035 * params.speed;
          }

          camera.position.setFromSpherical(spherical).add(controls.target);
          camera.lookAt(controls.target);
        }
      }

      // ============================================================
      // 2. Kinetic Mathematical Generative Wave Calculation
      // Derived from: C.globalAlpha = tan(index^2 - t), x = tan(i*j - sin(...) + t)*j, etc.
      // ============================================================
      if (instancedMesh) {
        baseC1.set(params.c1);
        baseC2.set(params.c2);
        baseC3.set(params.c3);

        const spreadX = 130.0;
        const spreadY = 130.0;
        let instanceIdx = 0;

        for (let k = 0; k < CHANNELS; k++) {
          const kPhase = k * 0.18;
          const kDepth = (k - 1) * params.channelDepth;
          const baseColor = (k === 0) ? baseC1 : (k === 1 ? baseC2 : baseC3);

          for (let row = 0; row < GRID_ROWS; row++) {
            const v = (row - GRID_ROWS / 2) / (GRID_ROWS / 2); // -1 to 1

            for (let col = 0; col < GRID_COLS; col++) {
              const u = (col - GRID_COLS / 2) / (GRID_COLS / 2); // -1 to 1
              const index = row * GRID_COLS + col;

              // Tangent wave calculations
              const tanArg1 = u * v * params.waveFreq * 3.2 - Math.sin(index * 0.04 + kPhase) + simTime;
              const tanX = tanSoft(tanArg1, 5.5);

              const tanArg2 = index * 0.015 - simTime * 0.45;
              const tanZ = tanSoft(tanArg2, 4.0);

              const tanArg3 = index * 0.012 + (row + 1) / (col + 1) + simTime + kPhase;
              const tanScaleX = Math.abs(tanSoft(tanArg3, 3.5));

              const tanArg4 = (index * index * 0.00015) - simTime;
              const tanScaleY = Math.abs(tanSoft(tanArg4, 3.5));

              // 3D Spatial Positions
              const posX = u * spreadX + tanX * (Math.abs(u) * 0.6 + 0.4) * params.waveAmp * 0.35;
              const posY = v * spreadY + Math.sin(u * params.waveFreq * 2.2 + simTime * 0.8 + kPhase) * (params.waveAmp * 0.28);
              const posZ = kDepth + tanZ * (params.zDepth * 0.4) + Math.cos(u * 2.8 + v * 2.8 - simTime * 0.6) * 12.0;

              // 3D Dynamic Scales
              const scaleFactor = params.scale;
              const sX = THREE.MathUtils.clamp(tanScaleX * 0.45 + 0.2, 0.1, 3.2) * scaleFactor;
              const sY = THREE.MathUtils.clamp(tanScaleY * 0.45 + 0.2, 0.1, 3.2) * scaleFactor;
              const sZ = (0.7 + 0.5 * Math.sin(index * 0.08 + simTime + kPhase)) * scaleFactor;

              // Rotations
              const rotX = Math.sin(index * 0.035 + simTime * 0.6) * 1.1 + v * params.twist;
              const rotY = Math.cos(u * 2.2 + simTime * 0.5 + kPhase) * 1.1 + u * params.twist;
              const rotZ = tanSoft(u * v * 1.8 - simTime * 0.25, 2.0) * 0.35;

              dummy.position.set(posX, posY, posZ);
              dummy.rotation.set(rotX, rotY, rotZ);
              dummy.scale.set(sX, sY, sZ);
              dummy.updateMatrix();

              instancedMesh.setMatrixAt(instanceIdx, dummy.matrix);

              // Dynamic brightness / interference shimmer
              const alphaShimmer = 0.65 + 0.35 * Math.abs(Math.sin(tanArg4));
              tempColor.copy(baseColor).multiplyScalar(alphaShimmer);
              instancedMesh.setColorAt(instanceIdx, tempColor);

              instanceIdx++;
            }
          }
        }

        instancedMesh.instanceMatrix.needsUpdate = true;
        if (instancedMesh.instanceColor) {
          instancedMesh.instanceColor.needsUpdate = true;
        }
      }

      renderer.render(scene, camera);
    }

    requestAnimationFrame(renderLoop);
  </script>
</body>
