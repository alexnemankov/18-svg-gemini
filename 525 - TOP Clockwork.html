// ======================= ANIMATION PRESETS (8 DISTINCT MODES) =======================
const ANIMATION_PRESETS = {
  'Static': {
    getPose: (t, d) => ({
      pos: new THREE.Vector3(0, 0, d),
      target: new THREE.Vector3(0, 0, 0)
    })
  },
  'Slow Orbit': {
    getPose: (t, d) => {
      const speed = 0.12;
      const angle = t * speed;
      const elevation = Math.sin(t * 0.06) * 0.22;
      const r = d * Math.cos(elevation);
      return {
        pos: new THREE.Vector3(
          Math.sin(angle) * r,
          Math.sin(elevation) * d * 0.45,
          Math.cos(angle) * r
        ),
        target: new THREE.Vector3(0, 0, 0)
      };
    }
  },
  'Floating Drift': {
    getPose: (t, d) => {
      const swayX = Math.sin(t * 0.14) * 2.5;
      const swayY = Math.cos(t * 0.11) * 1.6;
      const swayZ = Math.sin(t * 0.08) * 1.8;
      return {
        pos: new THREE.Vector3(swayX, swayY, d + swayZ),
        target: new THREE.Vector3(swayX * 0.25, swayY * 0.25, 0)
      };
    }
  },
  'Clockmaker Close-Up': {
    getPose: (t, d) => {
      const closeD = d * 0.58 + Math.sin(t * 0.1) * 1.5;
      const ang = t * 0.07;
      const px = Math.cos(ang) * 3.5;
      const py = Math.sin(ang) * 2.2;
      return {
        pos: new THREE.Vector3(px, py, closeD),
        target: new THREE.Vector3(px * 0.4, py * 0.4, 0)
      };
    }
  },
  'Pendulum Arc': {
    getPose: (t, d) => {
      const pend = Math.sin(t * 0.22) * 0.35;
      return {
        pos: new THREE.Vector3(
          Math.sin(pend) * d,
          (1 - Math.cos(pend)) * 2.0,
          Math.cos(pend) * d
        ),
        target: new THREE.Vector3(0, 0, 0)
      };
    }
  },
  'Cinematic Low Sweep': {
    getPose: (t, d) => {
      const sweep = Math.sin(t * 0.12);
      return {
        pos: new THREE.Vector3(sweep * 10.0, -3.2 + sweep * 1.5, d * 0.8),
        target: new THREE.Vector3(sweep * 2.5, 0.2, 0)
      };
    }
  },
  'Infinity Figure-8': {
    getPose: (t, d) => {
      const f = t * 0.12;
      const scale = 3.2;
      const x = Math.sin(f) * scale;
      const y = Math.sin(f * 2) * (scale * 0.4);
      return {
        pos: new THREE.Vector3(x, y, d + Math.cos(f) * 1.5),
        target: new THREE.Vector3(x * 0.2, y * 0.2, 0)
      };
    }
  },
  'Radial Breathing Pulse': {
    getPose: (t, d) => {

      return {
        pos: new THREE.Vector3(pulse * 1.5, Math.cos(t * 0.1) * 1.0, d + pulse * 4.0),
        target: new THREE.Vector3(0, 0, 0)
      };
    }
  }
};

// ======================= ENVIRONMENT (procedural HDR photo studio) =======================
const envMaterial = new THREE.ShaderMaterial({
  depthTest: false,
  depthWrite: false,
  uniforms: {
    uKey: { value: PARAMS.lighting.keyLight },
    uStrip: { value: PARAMS.lighting.stripLights },
    uRim: { value: PARAMS.lighting.rimLights },
    uWarmth: { value: PARAMS.lighting.warmth }
  },
  vertexShader: /* glsl */`
    varying vec2 vUv;
    void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: /* glsl */`
    uniform float uKey;
    uniform float uStrip;
    uniform float uRim;
    uniform float uWarmth;
    varying vec2 vUv;
    const float PI = 3.141592653589793;

    vec3 dirFromUv(vec2 uv) {
      float phi = (uv.x - 0.5) * 2.0 * PI;
      float th = (uv.y - 0.5) * PI;
      return vec3(cos(th) * cos(phi), sin(th), cos(th) * sin(phi));
    }

    float sdRoundRect(vec2 p, vec2 b, float r) {
      vec2 q = abs(p) - b + r;
      return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r;
    }

    vec3 softbox(vec3 d, vec3 c, vec3 up, vec2 size, float radius, float feather, vec3 col) {
      float k = dot(d, c);
      if (k <= 0.0) return vec3(0.0);
      vec3 t = normalize(cross(up, c));
      vec3 b = cross(c, t);
      vec2 p = vec2(dot(d, t), dot(d, b)) / k;
      float sd = sdRoundRect(p, size, min(radius, min(size.x, size.y)));
      float mask = 1.0 - smoothstep(-feather, feather, sd);
      vec2 q = p / size;
      float hot = mix(0.7, 1.0, exp(-dot(q, q) * 1.4));
      return col * mask * hot;
    }

    void main() {
      vec3 d = dirFromUv(vUv);
      float y = d.y;
      vec3 UP = vec3(0.0, 1.0, 0.0);

      vec3 cool = vec3(0.93, 0.98, 1.08);
      vec3 warm = vec3(1.08, 0.99, 0.88);
      vec3 keyTint = mix(cool, warm, uWarmth * 0.6);
      vec3 rimTint = mix(cool, warm, 0.35 + uWarmth * 0.65);

      vec3 c = mix(vec3(0.018, 0.019, 0.022), vec3(0.075, 0.078, 0.086), smoothstep(-0.15, 0.95, y));
      c += vec3(0.045, 0.04, 0.035) * exp(-pow((y + 0.04) / 0.22, 2.0));
      c = mix(c, vec3(0.035, 0.033, 0.032), smoothstep(-0.05, -0.6, y));

      c += uKey * softbox(d, normalize(vec3(0.0, 0.34, 1.0)), UP, vec2(1.25, 0.15), 0.12, 0.2, 1.9 * keyTint);
      c += uKey * softbox(d, normalize(vec3(0.0, -0.34, 1.0)), UP, vec2(1.7, 0.16), 0.2, 0.25, 0.22 * keyTint);

      c += uStrip * softbox(d, normalize(vec3(-1.0, 0.08, 0.28)), UP, vec2(0.075, 1.7), 0.05, 0.035, 6.0 * keyTint);
      c += uStrip * softbox(d, normalize(vec3( 1.0, 0.04, 0.42)), UP, vec2(0.055, 1.5), 0.04, 0.03, 4.5 * keyTint);
      c += uStrip * softbox(d, normalize(vec3(0.0, 1.0, 0.22)), vec3(0.0, 0.0, -1.0), vec2(1.5, 0.07), 0.05, 0.03, 4.2 * keyTint);

      c += uRim * softbox(d, normalize(vec3( 0.65, 0.28, -1.0)), UP, vec2(0.34, 0.7), 0.16, 0.14, 3.0 * rimTint);
      c += uRim * softbox(d, normalize(vec3(-0.70, -0.12, -1.0)), UP, vec2(0.28, 0.6), 0.16, 0.14, 1.8 * cool);
      c += uRim * softbox(d, normalize(vec3( 0.0, -1.0, 0.15)), vec3(0.0, 0.0, -1.0), vec2(1.2, 0.35), 0.2, 0.4, 0.25 * rimTint);

      c += uStrip * softbox(d, normalize(vec3( 0.55, 0.62, 0.55)), UP, vec2(0.1), 0.1, 0.025, 9.0 * keyTint);
      c += uStrip * softbox(d, normalize(vec3(-0.60, 0.48, 0.70)), UP, vec2(0.07), 0.07, 0.02, 6.0 * keyTint);

      gl_FragColor = vec4(c, 1.0);
    }`
});
const envQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), envMaterial);

const envBakeTarget = new THREE.WebGLRenderTarget(2048, 1024, { type: THREE.HalfFloatType, depthBuffer: false });

const pmremGenerator = new THREE.PMREMGenerator(renderer);
let envRT = null;

function rebuildEnvironment() {
  const prev = renderer.getRenderTarget();
  renderer.setRenderTarget(envBakeTarget);
  renderer.render(envScene, envCamera);
  renderer.setRenderTarget(prev);
  const next = pmremGenerator.fromEquirectangular(envBakeTarget.texture);
  if (envRT) envRT.dispose();
  envRT = next;
  scene.environment = envRT.texture;
}
rebuildEnvironment();

// ======================= SOFT SHADOWS & LIGHTS =======================
const shadowUniforms = { uEnvShadow: { value: PARAMS.shadows.strength } };
function addEnvShadow(mat) {
  mat.onBeforeCompile = (shader) => {
    shader.uniforms.uEnvShadow = shadowUniforms.uEnvShadow;
    shader.fragmentShader = shader.fragmentShader
      .replace('void main() {', 'uniform float uEnvShadow;\nvoid main() {')
      .replace('#include <lights_fragment_end>', `#include <lights_fragment_end>
      #if defined( USE_SHADOWMAP ) && NUM_DIR_LIGHT_SHADOWS > 0
      {
        DirectionalLightShadow keyShadow = directionalLightShadows[ 0 ];
        float sh = getShadow( directionalShadowMap[ 0 ], keyShadow.shadowMapSize, keyShadow.shadowIntensity,
                              keyShadow.shadowBias, keyShadow.shadowRadius, vDirectionalShadowCoord[ 0 ] );
        float envShadow = mix( 1.0, sh, uEnvShadow );
        reflectedLight.indirectSpecular *= envShadow;
        reflectedLight.indirectDiffuse *= envShadow;
      }
      #endif`);
  };
}
Object.values(materials).forEach(addEnvShadow);

// Key directional light matching main softbox
const keyLight = new THREE.DirectionalLight(0xffffff, PARAMS.lighting.dirLightIntensity * PARAMS.lighting.sceneLightIntensity);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.radius = PARAMS.shadows.softness;
keyLight.shadow.blurSamples = 16;
keyLight.shadow.bias = -0.0004;
const sc = keyLight.shadow.camera;
sc.left = -21; sc.right = 21; sc.top = 13; sc.bottom = -13; sc.near = 1; sc.far = 80;
scene.add(keyLight, keyLight.target);

// Ambient light for additional fill control
const ambientLight = new THREE.AmbientLight(0xffffff, PARAMS.lighting.ambientLight * PARAMS.lighting.sceneLightIntensity);
scene.add(ambientLight);

function updateKeyLight() {
  const az = THREE.MathUtils.degToRad(PARAMS.shadows.azimuth);
  const el = THREE.MathUtils.degToRad(PARAMS.shadows.elevation);
  const dist = 35;
  keyLight.position.set(Math.cos(el) * Math.sin(az) * dist, Math.cos(el) * Math.cos(az) * dist, Math.sin(el) * dist);
  keyLight.target.position.set(0, 0, 0);
  keyLight.updateMatrixWorld();
  keyLight.target.updateMatrixWorld();
  sc.updateProjectionMatrix();
}
updateKeyLight();

function applyLighting() {
  const master = PARAMS.lighting.sceneLightIntensity;
  renderer.toneMappingExposure = PARAMS.lighting.exposure * master;
  keyLight.intensity = PARAMS.lighting.dirLightIntensity * master;
  ambientLight.intensity = PARAMS.lighting.ambientLight * master;
  scene.environmentIntensity = PARAMS.lighting.envIntensity * master;
  scene.environmentRotation.y = THREE.MathUtils.degToRad(PARAMS.lighting.envRotation);
  scene.backgroundRotation.y = scene.environmentRotation.y;
  for (const m of chromeMaterials) {
    m.envMapIntensity = PARAMS.lighting.envIntensity * master;
  }
}
applyLighting();

// ======================= LIVE REFLECTIONS =======================
let cubeRT = new THREE.WebGLCubeRenderTarget(PARAMS.reflections.resolution, { type: THREE.HalfFloatType });
const cubeCamera = new THREE.CubeCamera(0.05, 80, cubeRT);
cubeCamera.position.set(0, 0, 2.5);

function setReflectionResolution(size) {
  const old = cubeRT;
  cubeRT = new THREE.WebGLCubeRenderTarget(size, { type: THREE.HalfFloatType });
  cubeCamera.renderTarget = cubeRT;
  applyReflectionMaps();
  old.dispose();
}

function applyReflectionMaps() {
  const map = PARAMS.reflections.live ? cubeRT.texture : null;
  for (const m of chromeMaterials) m.envMap = map;
}

function captureReflections() {
  for (const m of chromeMaterials) m.envMap = null;
  const bg = scene.background;
  scene.background = envRT.texture;
  scene.backgroundIntensity = PARAMS.lighting.envIntensity * PARAMS.lighting.sceneLightIntensity;
  cubeCamera.update(renderer, scene);
  scene.background = bg;
  applyReflectionMaps();
}

// ======================= GEOMETRY HELPERS =======================
function frac(x) { return x - Math.floor(x); }

function withColor(geo, shade) {
  const g = geo.index ? geo.toNonIndexed() : geo;
  if (g !== geo) geo.dispose();
  const n = g.attributes.position.count;
  g.setAttribute('color', new THREE.BufferAttribute(new Float32Array(n * 3).fill(shade), 3));
  return g;
}

function sharpen(profile) {
  const out = [profile[0]];
  for (let i = 0; i < profile.length - 1; i++) {
    const a = profile[i], b = profile[i + 1];
    const len = Math.hypot(b[0] - a[0], b[1] - a[1]);
    const e = Math.min(0.003 / len, 0.2);
    out.push([a[0] + (b[0] - a[0]) * e, a[1] + (b[1] - a[1]) * e]);
    out.push([b[0] + (a[0] - b[0]) * e, b[1] + (a[1] - b[1]) * e]);
  }
  out.push(profile[profile.length - 1]);
  return out;
}

function lathe(profile, top, shade, segs) {
  const pts = profile.map(p => new THREE.Vector2(Math.max(0, p[0]), p[1]));
  let rMax = 0;
  for (const p of profile) rMax = Math.max(rMax, p[0]);
  const n = segs || clamp(Math.round(rMax * 48), 20, 128);
  const geo = new THREE.LatheGeometry(pts, n);
  geo.rotateX(Math.PI / 2);
  geo.translate(0, 0, top);
  return withColor(geo, shade);
}

function circlePoints(r, n, cx = 0, cy = 0) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = i / n * TAU;
    pts.push(new THREE.Vector2(cx + Math.cos(a) * r, cy + Math.sin(a) * r));
  }
  return pts;
}

const PROFILE_TRAP = [[-0.5, 0], [-0.36, 0], [-0.29, 0.3], [-0.22, 0.68], [-0.16, 0.92], [-0.11, 1], [0.11, 1], [0.16, 0.92], [0.22, 0.68], [0.29, 0.3], [0.36, 0]];
const PROFILE_ROUND = [[-0.5, 0], [-0.34, 0], [-0.29, 0.32], [-0.24, 0.62], [-0.18, 0.84], [-0.1, 0.97], [0, 1], [0.1, 0.97], [0.18, 0.84], [0.24, 0.62], [0.29, 0.32], [0.34, 0]];

function toothPoints(N, rp, m, style, internal) {
  const prof = style === 'round' ? PROFILE_ROUND : PROFILE_TRAP;
  const rRoot = internal ? rp + 1.25 * m : rp - 1.25 * m;
  const rTip = internal ? rp - m : rp + m;
  const p = TAU / N;
  const pts = [];
  for (let k = 0; k < N; k++) {
    for (const [f, h] of prof) {
      const a = (k + f) * p;
      const r = rRoot + (rTip - rRoot) * h;
      pts.push(new THREE.Vector2(Math.cos(a) * r, Math.sin(a) * r));
    }
  }
  return pts;
}

function sectorPath(r0, r1, a0, a1, spokeWidth, twist) {
  const wi = spokeWidth / r0, wo = spokeWidth / r1;
  const i0 = a0 + wi / 2, i1 = a1 - wi / 2;
  const o0 = a0 + wo / 2 + twist, o1 = a1 - wo / 2 + twist;
  if (i1 - i0 < 0.1 || o1 - o0 < 0.1) return null;
  const pts = [];
  const ni = Math.max(3, Math.ceil((i1 - i0) * r0 * 14));
  const no = Math.max(4, Math.ceil((o1 - o0) * r1 * 14));
  const ns = 5;
  for (let i = 0; i <= ni; i++) { const a = i0 + (i1 - i0) * i / ni; pts.push(new THREE.Vector2(Math.cos(a) * r0, Math.sin(a) * r0)); }
  for (let i = 1; i < ns; i++) { const s = i / ns; const r = r0 + (r1 - r0) * s; const a = i1 + (o1 - i1) * s; pts.push(new THREE.Vector2(Math.cos(a) * r, Math.sin(a) * r)); }
  for (let i = 0; i <= no; i++) { const a = o1 + (o0 - o1) * i / no; pts.push(new THREE.Vector2(Math.cos(a) * r1, Math.sin(a) * r1)); }
  for (let i = 1; i < ns; i++) { const s = i / ns; const r = r1 + (r0 - r1) * s; const a = o0 + (i0 - o0) * s; pts.push(new THREE.Vector2(Math.cos(a) * r, Math.sin(a) * r)); }
  return new THREE.Path(pts);
}

function gearThickness(m) { return 0.12 + m * 1.3; }

function extrudeBody(shape, t, bevel) {
  const bt = Math.min(0.022, t * 0.1);
  const depth = t - 2 * bt;
  const geo = new THREE.ExtrudeGeometry(shape, {
    depth, steps: 1, curveSegments: 4,
    bevelEnabled: true, bevelThickness: bt, bevelSize: bevel, bevelOffset: -bevel, bevelSegments: 1
  });
  geo.translate(0, 0, -depth / 2);
  return geo;
}

// ======================= GEAR PRESETS =======================
const PRESETS = [
  { body: 'spokes',     spokes: 5, hub: 'boss',  bolts: 4, rim: true,  tooth: 'trap',  mat: 'polished' },
  { body: 'perforated', rings: 2,  hub: 'cup',   bolts: 0, rim: false, tooth: 'trap',  mat: 'polished' },
  { body: 'solid',                 hub: 'rings', bolts: 0, rim: true,  tooth: 'trap',  mat: 'polished' },
  { body: 'curved',     spokes: 6, hub: 'boss',  bolts: 0, rim: true,  tooth: 'round', mat: 'satin' },
  { body: 'round',      holes: 5,  hub: 'dome',  bolts: 5, rim: false, tooth: 'trap',  mat: 'polished' },
  { body: 'spokes',     spokes: 3, hub: 'cup',   bolts: 0, rim: true,  tooth: 'trap',  mat: 'satin' },
  { body: 'perforated', rings: 1,  hub: 'boss',  bolts: 6, rim: true,  tooth: 'round', mat: 'satin' },
  { body: 'spokes',     spokes: 8, hub: 'rings', bolts: 0, rim: false, tooth: 'trap',  mat: 'polished' },
  { body: 'round',      holes: 4,  hub: 'cup',   bolts: 0, rim: true,  tooth: 'round', mat: 'polished' }
];

function addBolts(parts, n, ringR, boltR, z) {
  for (let i = 0; i < n; i++) {
    const a = i / n * TAU + 0.3;
    const cyl = new THREE.CylinderGeometry(boltR, boltR, 0.035, 6);
    cyl.rotateX(Math.PI / 2);
    cyl.translate(Math.cos(a) * ringR, Math.sin(a) * ringR, z + 0.0125);
    parts.push(withColor(cyl, 0.92));
  }
}

function addHub(parts, P, o) {
  const { rh, rb, s, top, r0, r1, bodyType } = o;
  if (P.hub === 'boss' || P.hub === 'rings') {
    if (P.hub === 'rings') {
      const rl = bodyType === 'solid' ? r1 : r0;
      const k = clamp(Math.floor((rl - rh * 1.1) / 0.11), 0, 5);
      if (k > 0) {
        const span = (rl - rh * 1.1) / k;
        for (let i = 0; i < k; i++) {
          const ro = rl - i * span, ri = ro - span * 0.62;
          const hh = (0.018 + 0.012 * i) * s + 0.006;
          parts.push(lathe(sharpen([[ro, 0], [ro, hh], [ri, hh], [ri, 0]]), top, i % 2 ? 0.78 : 1));
        }
      }
    }
    const h = 0.07 * s + 0.03, c = 0.022;
    parts.push(lathe(sharpen([[rh, 0], [rh, h], [rh - c, h + c], [rb + c, h + c], [rb, h], [rb, 0]]), top, 1));
    const ah = h + 0.12 * s;
    parts.push(lathe(sharpen([[rb * 0.78, -0.02], [rb * 0.78, ah], [rb * 0.5, ah + 0.025 * s + 0.01], [0, ah + 0.025 * s + 0.01]]), top, 1));
    if (P.bolts) addBolts(parts, P.bolts, (rh + rb) / 2 + 0.01, Math.max(0.012, (rh - rb) * 0.15), top + h + c);
  } else if (P.hub === 'cup') {
    const rc = rh * 1.15, hc = 0.11 * s + 0.04, l = 0.022;
    parts.push(lathe(sharpen([[rc, 0], [rc, hc], [rc - l, hc + l], [rc * 0.8, hc + l]]), top, 1));
    parts.push(lathe(sharpen([[rc * 0.8, hc + l], [rc * 0.74, 0.015], [rb * 0.75, 0.015]]), top, 0.09));
    parts.push(lathe(sharpen([[rb * 0.75, 0.015], [rb * 0.75, 0.07 * s], [rb * 0.45, 0.07 * s + 0.02], [0, 0.07 * s + 0.02]]), top, 1));
    if (P.bolts) addBolts(parts, P.bolts, rc + (r0 - rc) * 0.5, Math.max(0.012, (r0 - rc) * 0.3), top);
  } else if (P.hub === 'dome') {
    const rD = rh * 1.2, hb = 0.035, hd = Math.min(rD * 0.5, 0.16);
    const prof = [[rD, 0], [rD, hb]];
    for (let i = 1; i <= 12; i++) {
      const a = i / 12 * Math.PI / 2;
      prof.push([i === 12 ? 0 : rD * 0.9 * Math.cos(a), hb + hd * Math.sin(a)]);
    }
    parts.push(lathe(prof, top, 1));
    if (P.bolts) addBolts(parts, P.bolts, rD + (r0 - rD) * 0.5, Math.max(0.012, (r0 - rD) * 0.28), top);
  }
}

function buildGearGeometry(N, m, presetIndex) {
  const P = PRESETS[presetIndex];
  const rp = m * N / 2, rd = rp - 1.25 * m;
  const t = gearThickness(m);
  const s = clamp(rp / 1.4, 0.45, 1.1);
  const rh = clamp(rp * 0.24, 0.09, 0.6);
  const rb = rh * 0.42;
  const rimW = Math.max(0.08, rp * 0.13);
  const r0 = rh * 1.3 + 0.04, r1 = rd - rimW;
  const roomy = (r1 - r0) > 0.22 && N >= 16;
  const bodyType = roomy ? P.body : 'solid';

  const shape = new THREE.Shape(toothPoints(N, rp, m, P.tooth, false));
  shape.holes.push(new THREE.Path(circlePoints(rb, 24)));

  if (bodyType === 'spokes' || bodyType === 'curved') {
    const S = P.spokes;
    const sw = Math.max(0.045, rp * 0.075) * (S <= 3 ? 1.7 : 1);
    for (let k = 0; k < S; k++) {
      const path = sectorPath(r0, r1, k * TAU / S, (k + 1) * TAU / S, sw, bodyType === 'curved' ? 0.55 : 0);
      if (path) shape.holes.push(path);
    }
  } else if (bodyType === 'perforated') {
    const band = (r1 - r0) / P.rings;
    for (let j = 0; j < P.rings; j++) {
      const rr = r0 + band * (j + 0.5);
      const hr = Math.min(band * 0.3, 0.075);
      if (hr < 0.018) continue;
      const n = Math.floor(TAU * rr / (hr * 3.4));
      for (let i = 0; i < n; i++) {
        const a = (i + (j % 2) * 0.5) / n * TAU;
        shape.holes.push(new THREE.Path(circlePoints(hr, 10, Math.cos(a) * rr, Math.sin(a) * rr)));
      }
    }
  } else if (bodyType === 'round') {
    const n = P.holes;
    const rMid = (r0 + r1) / 2;
    const hr = Math.min((r1 - r0) * 0.4, Math.PI * rMid / n * 0.6);
    for (let i = 0; i < n; i++) {
      const a = i / n * TAU;
      shape.holes.push(new THREE.Path(circlePoints(hr, 28, Math.cos(a) * rMid, Math.sin(a) * rMid)));
    }
  }

  const parts = [withColor(extrudeBody(shape, t, Math.min(0.014, m * 0.16)), 1)];
  const top = t / 2 - 0.004;
  if (P.rim) {
    const rh2 = 0.03 * s + 0.012;
    parts.push(lathe(sharpen([[rd - 0.012, 0], [rd - 0.012, rh2], [rd - rimW * 0.72, rh2], [rd - rimW * 0.72, 0]]), top, 1));
  }
  addHub(parts, P, { rh, rb, s, top, r0, r1, bodyType });

  const geo = mergeGeometries(parts, false);
  parts.forEach(p => p.dispose());
  geo.computeBoundingSphere();
  return geo;
}

function buildRingGeometry() {
  const N = 136, m = 0.09, rp = m * N / 2, rd = rp - 1.25 * m, t = 0.5;
  const shape = new THREE.Shape(toothPoints(N, rp, m, 'trap', false));
  shape.holes.push(new THREE.Path(circlePoints(5.3, 220)));
  const parts = [withColor(extrudeBody(shape, t, 0.014), 1)];
  const top = t / 2 - 0.004;
  parts.push(lathe(sharpen([[rd - 0.015, 0], [rd - 0.015, 0.05], [rd - 0.13, 0.05], [rd - 0.13, 0]]), top, 1, 256));
  parts.push(lathe(sharpen([[5.84, 0], [5.84, 0.1], [5.79, 0.15], [5.52, 0.15], [5.46, 0.1], [5.46, 0]]), top, 1, 256));
  parts.push(lathe(sharpen([[5.4, 0], [5.4, 0.03], [5.33, 0.03], [5.33, 0]]), top, 0.55, 256));
  const geo = mergeGeometries(parts, false);
  parts.forEach(p => p.dispose());
  geo.computeBoundingSphere();
  return geo;
}

function buildInternalGeometry() {
  const shape = new THREE.Shape(circlePoints(5.36, 220));
  shape.holes.push(new THREE.Path(toothPoints(110, 4.95, 0.09, 'trap', true)));
  const geo = withColor(extrudeBody(shape, 0.28, 0.012), 0.9);
  geo.computeBoundingSphere();
  return geo;
}

function buildBarrelGeometry() {
  const N = 64, m = 0.06, rp = m * N / 2, rd = rp - 1.25 * m, t = gearThickness(m);
  const shape = new THREE.Shape(toothPoints(N, rp, m, 'trap', false));
  const parts = [withColor(extrudeBody(shape, t, 0.01), 1)];
  const top = t / 2 - 0.004;
  const prof = [[rd - 0.03, 0], [rd - 0.03, 0.22], [rd - 0.07, 0.26], [rd - 0.15, 0.26], [rd - 0.19, 0.22], [rd - 0.19, 0.05]];
  const g0 = rd - 0.19, g1 = 0.42, n = 28, w = (g0 - g1) / n;
  for (let i = 0; i < n; i++) {
    const ra = g0 - i * w;
    prof.push([ra - w * 0.5, 0.075], [ra - w, 0.05]);
  }
  prof.push([0.42, 0.3], [0.34, 0.36], [0.16, 0.36], [0.16, 0.42], [0, 0.42]);
  parts.push(lathe(sharpen(prof), top, 1, 180));
  const geo = mergeGeometries(parts, false);
  parts.forEach(p => p.dispose());
  geo.computeBoundingSphere();
  return geo;
}

// ======================= LAYOUT GENERATION =======================
const OUTER_N = [14, 16, 18, 21, 24, 28, 32, 38, 45, 54, 64];
const INNER_N = [12, 14, 16, 18, 21, 24, 28, 33, 40, 48, 56];
const MODULES = { outer: [0.08, 0.1, 0.12], inner: [0.05, 0.065, 0.08] };
const LAYERS = {
  'o-2': { z: -1.55, domain: 'outer', minR: 5.5, depth: 1.0 },
  'o-1': { z: -0.78, domain: 'outer', minR: 5.5, depth: 0.55 },
  'o0':  { z: 0,     domain: 'outer', minR: 0, depth: 0 },
  'o1':  { z: 0.64,  domain: 'outer', minR: 6.3, depth: 0 },
  'i-1': { z: -1.5,  domain: 'inner', maxR: 4.72, depth: 0.9 },
  'i0':  { z: -0.95, domain: 'inner', maxR: 4.72, depth: 0.45 },
  'i1':  { z: -0.4,  domain: 'inner', maxR: 4.72, depth: 0 }
};
const COAXIAL = {
  'o0':  [{ to: 'o1', p: 0.26, min: 0.35, max: 0.72 }, { to: 'o-1', p: 0.42, min: 0.6, max: 1.5 }],
  'o-1': [{ to: 'o-2', p: 0.35, min: 0.6, max: 1.6 }],
  'i0':  [{ to: 'i1', p: 0.3, min: 0.35, max: 0.72 }, { to: 'i-1', p: 0.35, min: 0.6, max: 1.4 }]
};
const BOUNDS = { x: 18, y: 10.5 };
const GAP = 0.05, MAX_RATIO = 30, MAX_GEARS = 1100;

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function generateLayout(seed) {
  const rng = mulberry32(seed);
  const gears = [];
  const lists = {};
  for (const k in LAYERS) lists[k] = [];
  const queue = [];

  const pickN = (domain) => {
    const list = domain === 'outer' ? OUTER_N : INNER_N;
    return list[Math.floor(Math.pow(rng(), 0.85) * list.length)];
  };
  const nearestN = (domain, target) => {
    const list = domain === 'outer' ? OUTER_N : INNER_N;
    let best = list[0];
    for (const n of list) if (Math.abs(n - target) < Math.abs(best - target)) best = n;
    return best;
  };
  const pickPreset = (N, m) => (N * 7 + Math.round(m * 1000) * 3 + Math.floor(rng() * 3)) % PRESETS.length;

  function fits(x, y, Ra, layer, exclude) {
    const L = LAYERS[layer];
    const d = Math.hypot(x, y);
    if (L.domain === 'outer') {
      if (Math.abs(x) > BOUNDS.x || Math.abs(y) > BOUNDS.y) return false;
      if (d - Ra < L.minR) return false;
    } else if (d + Ra > L.maxR) return false;
    for (const o of lists[layer]) {
      if (o === exclude) continue;
      const dx = o.x - x, dy = o.y - y, rr = o.Ra + Ra + GAP;
      if (dx * dx + dy * dy < rr * rr) return false;
    }
    return true;
  }

  function addGear(g) {
    g.Ra = g.rp + g.m;
    g.z = LAYERS[g.layer].z;
    g.shadeRand = rng();
    g.depth = LAYERS[g.layer].depth;
    if (g.preset === undefined) g.preset = pickPreset(g.N, g.m);
    gears.push(g);
    lists[g.layer].push(g);
    queue.push(g);
    return g;
  }

  function grow(g) {
    const L = LAYERS[g.layer];
    for (let a = 0; a < 16 && gears.length < MAX_GEARS; a++) {
      const N = pickN(L.domain);
      const rc = g.m * N / 2;
      const dist = g.rp + rc;
      const ang = rng() * TAU;
      const ratio = -g.ratio * g.N / N;
      if (Math.abs(ratio) > MAX_RATIO) continue;
      const x = g.x + Math.cos(ang) * dist, y = g.y + Math.sin(ang) * dist;
      if (!fits(x, y, rc + g.m, g.layer, g)) continue;
      const fp = frac((ang - g.phase) * g.N / TAU);
      const phase = ang + Math.PI - (TAU / N) * (0.5 - fp);
      addGear({ x, y, N, m: g.m, rp: rc, layer: g.layer, phase, ratio });
    }
    const rules = COAXIAL[g.layer];
    if (!rules || g.noCoax) return;
    for (const r of rules) {
      if (rng() > r.p || gears.length >= MAX_GEARS) continue;
      const m = MODULES[L.domain][Math.floor(rng() * 3)];
      const target = g.rp * (r.min + rng() * (r.max - r.min));
      const N = nearestN(L.domain, 2 * target / m);
      const rc = m * N / 2;
      if (!fits(g.x, g.y, rc + m, r.to, null)) continue;
      addGear({ x: g.x, y: g.y, N, m, rp: rc, layer: r.to, phase: rng() * TAU, ratio: g.ratio });
    }
  }
  const processQueue = () => { while (queue.length && gears.length < MAX_GEARS) grow(queue.shift()); };

  addGear({ x: 0, y: 0, N: 136, m: 0.09, rp: 6.12, layer: 'o0', phase: 0, ratio: 1, design: 'ring', noCoax: true });
  const barrel = addGear({ x: -1.65, y: -1.15, N: 64, m: 0.06, rp: 1.92, layer: 'i0', phase: 0, ratio: 1.6, design: 'barrel', noCoax: true });
  lists['i1'].push({ x: barrel.x, y: barrel.y, Ra: 2.0 });
  processQueue();

  const fillPlan = [['i0', 500], ['i1', 400], ['i-1', 600], ['o0', 300], ['o-1', 400], ['o-2', 500]];
  for (const [layer, tries] of fillPlan) {
    const L = LAYERS[layer];
    for (let i = 0; i < tries && gears.length < MAX_GEARS; i++) {
      let x, y;
      if (L.domain === 'outer') { x = (rng() * 2 - 1) * BOUNDS.x; y = (rng() * 2 - 1) * BOUNDS.y; }
      else { const a = rng() * TAU, r = Math.sqrt(rng()) * L.maxR; x = Math.cos(a) * r; y = Math.sin(a) * r; }
      const m = MODULES[L.domain][1];
      const N = pickN(L.domain);
      const rp = m * N / 2;
      if (!fits(x, y, rp + m, layer, null)) continue;
      addGear({ x, y, N, m, rp, layer, phase: rng() * TAU, ratio: (rng() < 0.5 ? -1 : 1) * (0.6 + rng() * 1.8) * (30 / N) });
      processQueue();
    }
  }

  gears.push({ x: 0, y: 0, z: -0.42, phase: 0, ratio: 1, design: 'internal', shadeRand: 0.3, depth: 0.3 });
  return gears;
}

// ======================= INSTANCED BATCHES =======================
const batches = [];

function designKey(g) { return g.design || `${g.N}|${g.m}|${g.preset}`; }

function createDesign(g) {
  if (g.design === 'ring') return { geo: buildRingGeometry(), mat: materials.polished };
  if (g.design === 'barrel') return { geo: buildBarrelGeometry(), mat: materials.polished };
  if (g.design === 'internal') return { geo: buildInternalGeometry(), mat: materials.satin };
  return { geo: buildGearGeometry(g.N, g.m, g.preset), mat: materials[PRESETS[g.preset].mat] };
}

function writeMatrices(b, M, full) {
  const arr = b.mesh.instanceMatrix.array;
  for (let i = 0; i < b.gears.length; i++) {
    const g = b.gears[i];
    const a = g.phase + g.ratio * M;
    const c = Math.cos(a), s = Math.sin(a);
    const o = i * 16;
    arr[o] = c; arr[o + 1] = s; arr[o + 4] = -s; arr[o + 5] = c;
    if (full) {
      arr[o + 2] = 0; arr[o + 3] = 0; arr[o + 6] = 0; arr[o + 7] = 0;
      arr[o + 8] = 0; arr[o + 9] = 0; arr[o + 10] = 1; arr[o + 11] = 0;
      arr[o + 12] = g.x; arr[o + 13] = g.y; arr[o + 14] = g.z; arr[o + 15] = 1;
    }
  }
  b.mesh.instanceMatrix.needsUpdate = true;
}

const tmpColor = new THREE.Color();
function updateInstanceColors() {
  for (const b of batches) {
    for (let i = 0; i < b.gears.length; i++) {
      const g = b.gears[i];
      tmpColor.setScalar((1 - PARAMS.material.variation * g.shadeRand) * (1 - PARAMS.material.depthShading * g.depth));
      b.mesh.setColorAt(i, tmpColor);
    }
    b.mesh.instanceColor.needsUpdate = true;
  }
}

function disposeGears() {
  for (const b of batches) {
    scene.remove(b.mesh);
    b.mesh.geometry.dispose();
    b.mesh.dispose();
  }
  batches.length = 0;
}

let masterAngle = 0;

function buildGears() {
  disposeGears();
  const gears = generateLayout(PARAMS.geometry.seed);
  const groups = new Map();
  for (const g of gears) {
    const key = designKey(g);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(g);
  }
  for (const list of groups.values()) {
    const { geo, mat } = createDesign(list[0]);
    const mesh = new THREE.InstancedMesh(geo, mat, list.length);
    mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    const b = { mesh, gears: list };
    writeMatrices(b, masterAngle, true);
    mesh.computeBoundingSphere();
    scene.add(mesh);
    batches.push(b);
  }
  updateInstanceColors();
  reflectionTimer = Infinity;
}
let reflectionTimer = Infinity;
buildGears();

// ======================= POST PROCESSING =======================
const AberrationShader = {
  uniforms: {
    tDiffuse: { value: null },
    amount: { value: PARAMS.post.aberration }
  },
  vertexShader: /* glsl */`
    varying vec2 vUv;
    void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse;
    uniform float amount;
    varying vec2 vUv;
    void main() {
      vec2 d = vUv - 0.5;
      vec2 off = d * amount * (0.6 + 2.0 * dot(d, d));
      vec4 c = texture2D(tDiffuse, vUv);
      float r = texture2D(tDiffuse, vUv + off).r;
      float b = texture2D(tDiffuse, vUv - off).b;
      gl_FragColor = vec4(r, c.g, b, c.a);
    }`
};

const VignetteShader = {
  uniforms: {
    tDiffuse: { value: null },
    strength: { value: PARAMS.post.vignette },
    softness: { value: PARAMS.post.vignetteSoftness },
    aspect: { value: window.innerWidth / window.innerHeight }
  },
  vertexShader: AberrationShader.vertexShader,
  fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse;
    uniform float strength;
    uniform float softness;
    uniform float aspect;
    varying vec2 vUv;
    void main() {
      vec4 c = texture2D(tDiffuse, vUv);
      vec2 k = vec2(mix(1.0, aspect, 0.35), 1.0);
      float r = length((vUv - 0.5) * k) / length(0.5 * k);
      float vig = 1.0 - strength * smoothstep(1.0 - softness, 1.0 + softness * 0.2, r);
      gl_FragColor = vec4(c.rgb * vig, c.a);
    }`
};

const composerTarget = new THREE.WebGLRenderTarget(1, 1, {
  type: THREE.HalfFloatType,
  samples: PARAMS.performance.antialias ? 4 : 0
});
const composer = new EffectComposer(renderer, composerTarget);
composer.setPixelRatio(PARAMS.performance.dpr);
composer.setSize(window.innerWidth, window.innerHeight);

const renderPass = new RenderPass(scene, camera);
const gtaoPass = new GTAOPass(scene, camera, window.innerWidth, window.innerHeight);
gtaoPass.updateGtaoMaterial({ radius: PARAMS.shadows.aoRadius, distanceExponent: 1.5, thickness: 1.2, scale: 1.0, samples: 16 });
gtaoPass.updatePdMaterial({ lumaPhi: 10, depthPhi: 2, normalPhi: 3, radius: 6, rings: 2, samples: 16 });
gtaoPass.blendIntensity = PARAMS.shadows.aoIntensity;
gtaoPass.enabled = PARAMS.shadows.contactAO;

const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), PARAMS.post.bloomStrength, PARAMS.post.bloomRadius, PARAMS.post.bloomThreshold);
bloomPass.enabled = PARAMS.post.bloom;

const aberrationPass = new ShaderPass(AberrationShader);
const outputPass = new OutputPass();
const vignettePass = new ShaderPass(VignetteShader);

composer.addPass(renderPass);
composer.addPass(gtaoPass);
composer.addPass(bloomPass);
composer.addPass(aberrationPass);
composer.addPass(outputPass);
composer.addPass(vignettePass);

function setAntialias(on) {
  PARAMS.performance.antialias = on;
  const n = on ? 4 : 0;
  composer.renderTarget1.samples = n;
  composer.renderTarget2.samples = n;
  composer.renderTarget1.dispose();
  composer.renderTarget2.dispose();
}

function applyDPR() {
  const dpr = clamp(PARAMS.performance.dpr, 0.5, MAX_DPR);
  renderer.setPixelRatio(dpr);
  composer.setPixelRatio(dpr);
  composer.setSize(window.innerWidth, window.innerHeight);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
  gtaoPass.setSize(window.innerWidth, window.innerHeight);
  vignettePass.uniforms.aspect.value = window.innerWidth / window.innerHeight;
});

// ======================= COLOR LOGIC & GREENSCREEN =======================
function updateColors() {
  if (PARAMS.colors.greenscreen) {
    scene.background = new THREE.Color('#00ff00');
    materials.backdrop.color.set('#00ff00');
    backdrop.visible = false;
    vignettePass.uniforms.strength.value = 0.0;
  } else {
    scene.background = new THREE.Color(PARAMS.colors.background);
    materials.backdrop.color.set(PARAMS.colors.gaps);
    backdrop.visible = true;
    vignettePass.uniforms.strength.value = PARAMS.post.vignette;
  }
  materials.polished.color.set(PARAMS.colors.metal);
  materials.satin.color.set(PARAMS.colors.metal);
  materials.plate.color.set(PARAMS.colors.interior);
  reflectionTimer = Infinity;
}

function applyColorScheme(name) {
  const scheme = COLOR_SCHEMES[name];
  if (!scheme) return;
  PARAMS.colors.scheme = name;
  PARAMS.colors.metal = scheme.metal;
  PARAMS.colors.interior = scheme.interior;
  PARAMS.colors.gaps = scheme.gaps;
  PARAMS.colors.background = scheme.background;
  updateColors();
  updateAllGuiDisplays();
}

// ======================= CAMERA UPDATE WITH USER INTERACTION =======================
const targetVec = new THREE.Vector3();
const camPosVec = new THREE.Vector3();
const offsetVec = new THREE.Vector3();

function updateCameraPosition(elapsedTime) {
  const preset = ANIMATION_PRESETS[PARAMS.animation.preset] || ANIMATION_PRESETS['Static'];
  const animPose = preset.getPose(elapsedTime, PARAMS.camera.distance);

  // Offset from target computed by animation
  offsetVec.copy(animPose.pos).sub(animPose.target);

  // Multiply by user persistent zoom factor
  offsetVec.multiplyScalar(PARAMS.camera.userZoom);

  // Apply user-defined yaw and pitch to camera angle during orbit
  const userRot = new THREE.Euler(PARAMS.camera.userAnglePitch, PARAMS.camera.userAngleYaw, 0, 'YXZ');
  offsetVec.applyEuler(userRot);

  // Center target + user drag pan offset
  targetVec.set(
    animPose.target.x - PARAMS.camera.userPanX,
    animPose.target.y - PARAMS.camera.userPanY,
    animPose.target.z
  );

  camPosVec.copy(targetVec).add(offsetVec);

  camera.fov = PARAMS.camera.fov;
  camera.position.copy(camPosVec);
  camera.lookAt(targetVec);
  camera.updateProjectionMatrix();
}

function resetCameraView() {
  PARAMS.camera.userZoom = 1.0;
  PARAMS.camera.userPanX = 0;
  PARAMS.camera.userPanY = 0;
  PARAMS.camera.userAngleYaw = 0;
  PARAMS.camera.userAnglePitch = 0;
  updateAllGuiDisplays();
}

// ======================= RANDOMIZE THEME & MOTION =======================
function randomizeScene() {
  const schemeNames = Object.keys(COLOR_SCHEMES);
  const randomScheme = schemeNames[Math.floor(Math.random() * schemeNames.length)];
  applyColorScheme(randomScheme);

  PARAMS.geometry.seed = 1 + Math.floor(Math.random() * 999);
  buildGears();

  const animKeys = Object.keys(ANIMATION_PRESETS);
  PARAMS.animation.preset = animKeys[Math.floor(Math.random() * animKeys.length)];
  PARAMS.animation.speed = parseFloat((0.03 + Math.random() * 0.12).toFixed(3));
  PARAMS.animation.reverse = Math.random() < 0.3;

  PARAMS.material.polishedRoughness = parseFloat((0.02 + Math.random() * 0.14).toFixed(3));
  PARAMS.material.satinRoughness = parseFloat((0.08 + Math.random() * 0.22).toFixed(3));
  PARAMS.material.variation = parseFloat((0.1 + Math.random() * 0.35).toFixed(3));
  PARAMS.material.depthShading = parseFloat((0.3 + Math.random() * 0.5).toFixed(3));
  materials.polished.roughness = PARAMS.material.polishedRoughness;
  materials.satin.roughness = PARAMS.material.satinRoughness;
  updateInstanceColors();

  updateAllGuiDisplays();
  reflectionTimer = Infinity;
}

// ======================= POINTER & WHEEL CONTROLS =======================
let isPointerDown = false;
let pointerButton = 0;
let pointerStartX = 0;
let pointerStartY = 0;
let pointerDownTime = 0;
let hasDragged = false;
let lastPointerX = 0;
let lastPointerY = 0;

window.addEventListener('contextmenu', (e) => {
  if (e.target === renderer.domElement) {
    e.preventDefault();
  }
});

renderer.domElement.addEventListener('pointerdown', (e) => {
  if (e.button !== 0 && e.button !== 1 && e.button !== 2) return;
  isPointerDown = true;
  pointerButton = e.button;
  pointerStartX = e.clientX;
  pointerStartY = e.clientY;
  lastPointerX = e.clientX;
  lastPointerY = e.clientY;
  pointerDownTime = performance.now();
  hasDragged = false;
  try { renderer.domElement.setPointerCapture(e.pointerId); } catch (_) {}
});

renderer.domElement.addEventListener('pointermove', (e) => {
  if (!isPointerDown) return;
  const dx = e.clientX - lastPointerX;
  const dy = e.clientY - lastPointerY;
  lastPointerX = e.clientX;
  lastPointerY = e.clientY;

  if (Math.hypot(e.clientX - pointerStartX, e.clientY - pointerStartY) > 5) {
    hasDragged = true;
  }

  let isOrbit = false;
  if (pointerButton === 2 || (pointerButton === 0 && e.shiftKey)) {
    isOrbit = true;
  } else if (pointerButton === 1) {
    isOrbit = false;
  } else if (pointerButton === 0) {
    isOrbit = (PARAMS.camera.dragMode === 'Rotate (Camera Angle)');
  }

  if (isOrbit) {
    PARAMS.camera.userAngleYaw += dx * 0.006;
    PARAMS.camera.userAnglePitch = THREE.MathUtils.clamp(
      PARAMS.camera.userAnglePitch + dy * 0.006,
      -Math.PI * 0.45,
      Math.PI * 0.45
    );
  } else {
    const dist = PARAMS.camera.distance * PARAMS.camera.userZoom;
    const vHeight = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5)) * dist;
    const factor = vHeight / window.innerHeight;
    PARAMS.camera.userPanX += dx * factor;
    PARAMS.camera.userPanY -= dy * factor;
  }
  updateAllGuiDisplays();
});

renderer.domElement.addEventListener('pointerup', (e) => {
  if (!isPointerDown) return;
  isPointerDown = false;
  try { renderer.domElement.releasePointerCapture(e.pointerId); } catch (_) {}

  const duration = performance.now() - pointerDownTime;
  if (!hasDragged && duration < 350 && pointerButton === 0) {
    if (PARAMS.interaction.clickToRandomize) {
      randomizeScene();
    }
  }
});

renderer.domElement.addEventListener('wheel', (e) => {
  e.preventDefault();
  const zoomFactor = e.deltaY < 0 ? 0.92 : 1.08;
  PARAMS.camera.userZoom = THREE.MathUtils.clamp(PARAMS.camera.userZoom * zoomFactor, 0.15, 6.0);
  updateAllGuiDisplays();
}, { passive: false });

// ======================= GUI CONTROLS =======================
const gui = new GUI({ title: 'Clockwork Settings' });

function updateAllGuiDisplays(folder = gui) {
  if (folder.controllers) {
    for (const c of folder.controllers) c.updateDisplay();
  }
  if (folder.folders) {
    for (const f of folder.folders) updateAllGuiDisplays(f);
  }
}

// 1. Color Schemes & Colors
const fCol = gui.addFolder('Colors & Schemes');
fCol.add(PARAMS.colors, 'scheme', Object.keys(COLOR_SCHEMES)).name('Color Scheme').onChange(applyColorScheme);
fCol.add(PARAMS.colors, 'greenscreen').name('Greenscreen (#00ff00)').onChange(updateColors);
fCol.addColor(PARAMS.colors, 'metal').name('Metal Color').onChange(v => { materials.polished.color.set(v); materials.satin.color.set(v); });
fCol.addColor(PARAMS.colors, 'interior').name('Interior Plate').onChange(v => materials.plate.color.set(v));
fCol.addColor(PARAMS.colors, 'gaps').name('Gaps / Backdrop').onChange(v => { materials.backdrop.color.set(v); if (!PARAMS.colors.greenscreen) scene.background.set(PARAMS.colors.background); });
fCol.addColor(PARAMS.colors, 'background').name('Background Color').onChange(v => { if (!PARAMS.colors.greenscreen) scene.background.set(v); });

// 2. Camera & Animation Presets
const fCam = gui.addFolder('Camera & Interaction');
fCam.add(PARAMS.animation, 'preset', Object.keys(ANIMATION_PRESETS)).name('Camera Animation');
fCam.add(PARAMS.camera, 'dragMode', ['Pan (Drag Object)', 'Rotate (Camera Angle)']).name('Left Drag Action');
fCam.add(PARAMS.interaction, 'clickToRandomize').name('Click to Randomize');
fCam.add({ randomize: randomizeScene }, 'randomize').name('Randomize Procedural 🎲');
fCam.add({ reset: resetCameraView }, 'reset').name('Reset Camera View');
fCam.add(PARAMS.camera, 'fov', 15, 50, 0.5).name('Camera FOV');
fCam.add(PARAMS.camera, 'distance', 15, 40, 0.1).name('Base Distance');
fCam.add(PARAMS.camera, 'userZoom', 0.2, 5.0, 0.01).name('User Zoom Factor');
fCam.add(PARAMS.camera, 'userPanX', -25, 25, 0.1).name('Pan X');
fCam.add(PARAMS.camera, 'userPanY', -25, 25, 0.1).name('Pan Y');
fCam.add(PARAMS.camera, 'userAngleYaw', -Math.PI, Math.PI, 0.01).name('Angle Yaw');
fCam.add(PARAMS.camera, 'userAnglePitch', -Math.PI * 0.45, Math.PI * 0.45, 0.01).name('Angle Pitch');

// 3. Animation Motion
const fAnim = gui.addFolder('Animation');
fAnim.add(PARAMS.animation, 'speed', 0, 0.3, 0.005).name('Speed');
fAnim.add(PARAMS.animation, 'reverse').name('Reverse');
fAnim.add(PARAMS.animation, 'paused').name('Paused');

// 4. Geometry
const fGeo = gui.addFolder('Geometry');
const seedCtrl = fGeo.add(PARAMS.geometry, 'seed', 1, 999, 1).name('Seed').onFinishChange(buildGears);
fGeo.add({ regenerate: () => { PARAMS.geometry.seed = 1 + Math.floor(Math.random() * 999); seedCtrl.updateDisplay(); buildGears(); } }, 'regenerate').name('Regenerate');

// 5. Material
const fMat = gui.addFolder('Material');
fMat.add(PARAMS.material, 'polishedRoughness', 0, 1, 0.01).name('Polished Roughness').onChange(v => { materials.polished.roughness = v; });
fMat.add(PARAMS.material, 'satinRoughness', 0, 1, 0.01).name('Satin Roughness').onChange(v => { materials.satin.roughness = v; });
fMat.add(PARAMS.material, 'variation', 0, 0.6, 0.01).name('Shade Variation').onChange(updateInstanceColors);
fMat.add(PARAMS.material, 'depthShading', 0, 0.9, 0.01).name('Depth Shading').onChange(updateInstanceColors);

// 6. Lighting & Light Sources
const fLight = gui.addFolder('Lighting');
fLight.add(PARAMS.lighting, 'exposure', 0.2, 3.0, 0.01).name('Tone Exposure').onChange(applyLighting);
fLight.add(PARAMS.lighting, 'sceneLightIntensity', 0, 3.0, 0.01).name('Scene Light Intensity').onChange(applyLighting);
fLight.add(PARAMS.lighting, 'dirLightIntensity', 0, 3.0, 0.01).name('Key Directional').onChange(applyLighting);
fLight.add(PARAMS.lighting, 'ambientLight', 0, 2.0, 0.01).name('Ambient Fill').onChange(applyLighting);
fLight.add(PARAMS.lighting, 'envIntensity', 0, 3.0, 0.01).name('Env Intensity').onChange(applyLighting);
fLight.add(PARAMS.lighting, 'envRotation', -180, 180, 1).name('Env Rotation').onChange(applyLighting);

const onStudioChange = () => {
  envMaterial.uniforms.uKey.value = PARAMS.lighting.keyLight;
  envMaterial.uniforms.uStrip.value = PARAMS.lighting.stripLights;
  envMaterial.uniforms.uRim.value = PARAMS.lighting.rimLights;
  envMaterial.uniforms.uWarmth.value = PARAMS.lighting.warmth;
  rebuildEnvironment();
  reflectionTimer = Infinity;
};
fLight.add(PARAMS.lighting, 'keyLight', 0, 3, 0.01).name('Key Softbox').onChange(onStudioChange);
fLight.add(PARAMS.lighting, 'stripLights', 0, 3, 0.01).name('Strip Softboxes').onChange(onStudioChange);
fLight.add(PARAMS.lighting, 'rimLights', 0, 3, 0.01).name('Rim Lights').onChange(onStudioChange);
fLight.add(PARAMS.lighting, 'warmth', 0, 1, 0.01).name('Warmth').onChange(onStudioChange);
fLight.add(PARAMS.reflections, 'live').name('Live Reflections').onChange(() => { applyReflectionMaps(); reflectionTimer = Infinity; });

// 7. Shadows
const fShadow = gui.addFolder('Shadows');
fShadow.add(PARAMS.shadows, 'enabled').name('Soft Shadows').onChange(v => {
  renderer.shadowMap.enabled = v;
  Object.values(materials).forEach(m => { m.needsUpdate = true; });
  reflectionTimer = Infinity;
});
fShadow.add(PARAMS.shadows, 'strength', 0, 1, 0.01).name('Shadow Strength').onChange(v => { shadowUniforms.uEnvShadow.value = v; });
fShadow.add(PARAMS.shadows, 'softness', 1, 25, 0.5).name('Shadow Softness').onChange(v => { keyLight.shadow.radius = v; });
fShadow.add(PARAMS.shadows, 'azimuth', -180, 180, 1).name('Light Azimuth').onChange(updateKeyLight);
fShadow.add(PARAMS.shadows, 'elevation', 20, 85, 1).name('Light Elevation').onChange(updateKeyLight);
fShadow.add(PARAMS.shadows, 'contactAO').name('Contact Shadows (AO)').onChange(v => { gtaoPass.enabled = v; });
fShadow.add(PARAMS.shadows, 'aoIntensity', 0, 1, 0.01).name('AO Intensity').onChange(v => { gtaoPass.blendIntensity = v; });
fShadow.add(PARAMS.shadows, 'aoRadius', 0.1, 3, 0.05).name('AO Radius').onChange(v => { gtaoPass.updateGtaoMaterial({ radius: v }); });

// 8. Post Processing
const fPost = gui.addFolder('Post Processing');
fPost.add(PARAMS.post, 'bloom').name('Bloom').onChange(v => { bloomPass.enabled = v; });
fPost.add(PARAMS.post, 'bloomStrength', 0, 1.5, 0.01).name('Bloom Strength').onChange(v => { bloomPass.strength = v; });
fPost.add(PARAMS.post, 'bloomRadius', 0, 1, 0.01).name('Bloom Radius').onChange(v => { bloomPass.radius = v; });
fPost.add(PARAMS.post, 'bloomThreshold', 0, 1.5, 0.01).name('Bloom Threshold').onChange(v => { bloomPass.threshold = v; });
fPost.add(PARAMS.post, 'aberration', 0, 0.02, 0.0005).name('Chromatic Aberration').onChange(v => { aberrationPass.uniforms.amount.value = v; });
fPost.add(PARAMS.post, 'vignette', 0, 1, 0.01).name('Vignette').onChange(v => { if (!PARAMS.colors.greenscreen) vignettePass.uniforms.strength.value = v; });
fPost.add(PARAMS.post, 'vignetteSoftness', 0.05, 1, 0.01).name('Vignette Softness').onChange(v => { vignettePass.uniforms.softness.value = v; });

// 9. Performance & Antialiasing
const fPerf = gui.addFolder('Performance');
fPerf.add(PARAMS.performance, 'dpr', 0.5, MAX_DPR, 0.25).name('DPR (Pixel Ratio)').onChange(applyDPR);
fPerf.add(PARAMS.performance, 'antialias').name('Antialiasing').onChange(setAntialias);
fPerf.add(PARAMS.reflections, 'fps', 1, 60, 1).name('Reflection FPS');
fPerf.add(PARAMS.reflections, 'resolution', [128, 256, 512]).name('Reflection Res').onChange(v => { setReflectionResolution(v); reflectionTimer = Infinity; });

gui.folders.forEach(f => f.close());

// ======================= TOGGLE UI KEY "H" =======================
let guiVisible = true;
window.addEventListener('keydown', (e) => {
  if (e.key === 'h' || e.key === 'H') {
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
    guiVisible = !guiVisible;
    if (typeof gui.show === 'function' && typeof gui.hide === 'function') {
      if (guiVisible) gui.show(); else gui.hide();
    } else {
      gui.domElement.style.display = guiVisible ? '' : 'none';
    }
  }
});

// ======================= ANIMATION LOOP (AUTO INFINITE) =======================
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  const elapsed = clock.getElapsedTime();

  if (!PARAMS.animation.paused) {
    masterAngle += dt * PARAMS.animation.speed * (PARAMS.animation.reverse ? -1 : 1);
  }
  for (const b of batches) writeMatrices(b, masterAngle, false);

  updateCameraPosition(elapsed);

  renderer.shadowMap.needsUpdate = true;
  if (PARAMS.reflections.live) {
    reflectionTimer += dt;
    if (reflectionTimer >= 1 / PARAMS.reflections.fps) {
      reflectionTimer = 0;
      captureReflections();
    }
  }
  composer.render();
});
</script>
