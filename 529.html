<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procedural Sphere Particles</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #000;
      overscroll-behavior: none;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #loading {
      background: black;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      visibility: visible;
      opacity: 1;
      transition: visibility 1.6s, opacity 1.6s;
      pointer-events: none;
    }

    #loading.loaded {
      visibility: hidden;
      opacity: 0;
    }

    #loading .circle {
      width: 50px;
      height: 50px;
      background: white;
      border-radius: 50%;
      opacity: 0;
      transform: scale(0, 0);
      animation: circle-animation 1.6s ease-in-out 0s infinite normal none;
    }

    #container {
      width: 100%;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      overflow: hidden;
    }

    #container canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 0;
      outline: none;
      display: block;
    }

    @keyframes circle-animation {
      0% {
        opacity: 0;
        transform: scale(0, 0);
      }
      50% {
        opacity: 1;
        transform: scale(1, 1);
      }
      100% {
        opacity: 0;
        transform: scale(0, 0);
      }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/stats.js/r17/Stats.min.js"></script>
</head>
<body>
  <div id="loading">
    <div class="circle"></div>
  </div>

  <div id="container"></div>

  <script type="module">

      },
      'Cyberpunk Pink': {
        mode: 18,
        c1: '#E0FBFF', c2: '#00F0FF', c3: '#D40078', c4: '#1E0A3D', c5: '#05020F',
        sphere: '#D40078',
        bg: '#05020F'

    };

    const vertexParticlesShaderSource = `
    uniform float uTime;
    uniform float uPointSize;
    uniform float uNoiseIntensity;
    uniform float uNoiseScale;
    uniform float uNoiseSpeed;

    varying vec3 vPosition;

    // Simplex 3D Noise by Ian McEwan, Ashima Arts
    vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x, 289.0);}
    vec4 taylorInvSqrt(vec4 r){return 1.79284291400159 - 0.85373472095314 * r;}

    float snoise(vec3 v){ 
      const vec2 C = vec2(1.0/6.0, 1.0/3.0);
      const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);

      vec3 i = floor(v + dot(v, C.yyy));
      vec3 x0 = v - i + dot(i, C.xxx);

      vec3 g = step(x0.yzx, x0.xyz);
      vec3 l = 1.0 - g;
      vec3 i1 = min(g.xyz, l.zxy);
      vec3 i2 = max(g.xyz, l.zxy);

      vec3 x1 = x0 - i1 + 1.0 * C.xxx;
      vec3 x2 = x0 - i2 + 2.0 * C.xxx;
      vec3 x3 = x0 - 1. + 3.0 * C.xxx;

      i = mod(i, 289.0); 
      vec4 p = permute(permute(permute( 
                 i.z + vec4(0.0, i1.z, i2.z, 1.0))
               + i.y + vec4(0.0, i1.y, i2.y, 1.0)) 
               + i.x + vec4(0.0, i1.x, i2.x, 1.0));

      float n_ = 1.0/7.0;
      vec3 ns = n_ * D.wyz - D.xzx;

      vec4 j = p - 49.0 * floor(p * ns.z * ns.z);

      vec4 x_ = floor(j * ns.z);
      vec4 y_ = floor(j - 7.0 * x_);

      vec4 x = x_ * ns.x + ns.yyyy;
      vec4 y = y_ * ns.x + ns.yyyy;
      vec4 h = 1.0 - abs(x) - abs(y);

      vec4 b0 = vec4(x.xy, y.xy);
      vec4 b1 = vec4(x.zw, y.zw);

      vec4 s0 = floor(b0) * 2.0 + 1.0;
      vec4 s1 = floor(b1) * 2.0 + 1.0;
      vec4 sh = -step(h, vec4(0.0));

      vec4 a0 = b0.xzyw + s0.xzyw * sh.xxyy;
      vec4 a1 = b1.xzyw + s1.xzyw * sh.zzww;

      vec3 p0 = vec3(a0.xy, h.x);
      vec3 p1 = vec3(a0.zw, h.y);
      vec3 p2 = vec3(a1.xy, h.z);
      vec3 p3 = vec3(a1.zw, h.w);

      vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
      p0 *= norm.x;
      p1 *= norm.y;
      p2 *= norm.z;
      p3 *= norm.w;

      vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
      m = m * m;
      return 42.0 * dot(m * m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
    }

    void main() {
      vPosition = position;
      vec3 p = position;
      float t = uTime * uNoiseSpeed;
      float noisy = snoise(position * uNoiseScale);
      
      p.x += cos(p.x + t) * noisy * uNoiseIntensity;
      float tanVal = clamp(abs(tan(p.y * 0.8 + t * 0.5)), 0.0, 15.0);
      p.y += tanVal * 0.1 * (uNoiseIntensity * 2.0);
      p.z += sin(p.z + t) * noisy * uNoiseIntensity;
      
      vec4 mvPosition = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = uPointSize * (1.0 / - mvPosition.z);
      gl_Position = projectionMatrix * mvPosition;
    }
    `;

    const fragmentParticlesShaderSource = `
    uniform float uTime;
    uniform int uColorScheme;
    uniform vec3 uColor1;
    uniform vec3 uColor2;
    uniform vec3 uColor3;
    uniform vec3 uColor4;
    uniform vec3 uColor5;

    uniform float uExposure;
    uniform vec3 uAmbientColor;
    uniform float uAmbientIntensity;
    uniform vec3 uDirLightColor;
    uniform float uDirLightIntensity;
    uniform vec3 uDirLightPos;
    uniform vec3 uPointLightColor;
    uniform float uPointLightIntensity;
    uniform vec3 uPointLightPos;

    varying vec3 vPosition;

    vec3 getPaletteColor(float t) {
      t = clamp(t, 0.0, 1.0);
      if (t < 0.25) {
        return mix(uColor1, uColor2, t / 0.25);
      } else if (t < 0.5) {
        return mix(uColor2, uColor3, (t - 0.25) / 0.25);
      } else if (t < 0.75) {
        return mix(uColor3, uColor4, (t - 0.5) / 0.25);
      } else {
        return mix(uColor4, uColor5, (t - 0.75) / 0.25);
      }
    }

    void main () {
      vec3 baseColor;
      if (uColorScheme == 0) {
        baseColor = vPosition * vPosition;
      } else {
        float len = length(vPosition) / 1.7;
        float h = clamp((vPosition.y / 1.7) * 0.5 + 0.5, 0.0, 1.0);
        float angle = atan(vPosition.z, vPosition.x) / 6.2831853 + 0.5;
        float t = clamp(h * 0.65 + sin(angle * 6.28318 + len * 3.14159) * 0.2 + len * 0.15, 0.0, 1.0);
        baseColor = getPaletteColor(t);
      }

      vec3 N = normalize(vPosition);
      vec3 Ldir = normalize(uDirLightPos);
      float diffDir = max(dot(N, Ldir), 0.0);

      vec3 Lpoint = uPointLightPos - vPosition;
      float distPoint = length(Lpoint);
      Lpoint = normalize(Lpoint);
      float atten = 1.0 / (1.0 + 0.04 * distPoint * distPoint);
      float diffPoint = max(dot(N, Lpoint), 0.0) * atten;

      vec3 lighting = uAmbientColor * uAmbientIntensity 
                    + uDirLightColor * (diffDir * uDirLightIntensity) 
                    + uPointLightColor * (diffPoint * uPointLightIntensity);

      vec3 finalColor = baseColor * lighting * uExposure;
      gl_FragColor = vec4(finalColor, 1.0);
    }
    `;

    const vertexSphereShaderSource = `
    uniform float uTime;
    varying vec3 vPosition;
    varying vec3 vNormal;

    void main() {
      vPosition = position;
      vNormal = normalize(normalMatrix * normal);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
    `;

    const fragmentSphereShaderSource = `
    uniform float uTime;
    uniform int uColorScheme;
    uniform vec3 uColor1;
    uniform vec3 uColor2;
    uniform vec3 uColor3;
    uniform vec3 uColor4;
    uniform vec3 uColor5;
    uniform vec3 uSphereColor;
    uniform float uSphereOpacity;

    uniform float uExposure;
    uniform vec3 uAmbientColor;
    uniform float uAmbientIntensity;
    uniform vec3 uDirLightColor;
    uniform float uDirLightIntensity;
    uniform vec3 uDirLightPos;
    uniform vec3 uPointLightColor;
    uniform float uPointLightIntensity;
    uniform vec3 uPointLightPos;

    varying vec3 vPosition;
    varying vec3 vNormal;

    vec3 getPaletteColor(float t) {
      t = clamp(t, 0.0, 1.0);
      if (t < 0.25) {
        return mix(uColor1, uColor2, t / 0.25);
      } else if (t < 0.5) {
        return mix(uColor2, uColor3, (t - 0.25) / 0.25);
      } else if (t < 0.75) {
        return mix(uColor3, uColor4, (t - 0.5) / 0.25);
      } else {
        return mix(uColor4, uColor5, (t - 0.75) / 0.25);
      }
    }

    void main () {
      vec3 baseColor;
      if (uColorScheme == 0) {
        baseColor = vPosition * vPosition;
      } else {
        float h = clamp((vPosition.y / 1.1) * 0.5 + 0.5, 0.0, 1.0);
        float angle = atan(vPosition.z, vPosition.x) / 6.2831853 + 0.5;
        float t = clamp(h * 0.7 + sin(angle * 6.28318 + uTime * 0.2) * 0.15, 0.0, 1.0);
        baseColor = mix(getPaletteColor(t), uSphereColor, 0.4);
      }

      vec3 N = normalize(vNormal);
      vec3 Ldir = normalize(uDirLightPos);
      float diffDir = max(dot(N, Ldir), 0.0);

      vec3 Lpoint = uPointLightPos - vPosition;
      float distPoint = length(Lpoint);
      Lpoint = normalize(Lpoint);
      float atten = 1.0 / (1.0 + 0.04 * distPoint * distPoint);
      float diffPoint = max(dot(N, Lpoint), 0.0) * atten;

      vec3 V = vec3(0.0, 0.0, 1.0);
      vec3 H = normalize(Ldir + V);
      float spec = pow(max(dot(N, H), 0.0), 32.0);

      vec3 lighting = uAmbientColor * uAmbientIntensity 
                    + uDirLightColor * (diffDir * uDirLightIntensity) 
                    + uPointLightColor * (diffPoint * uPointLightIntensity);

      vec3 finalColor = (baseColor * lighting + uDirLightColor * (spec * uDirLightIntensity * 0.4)) * uExposure;
      gl_FragColor = vec4(finalColor, uSphereOpacity);
    }
    `;

    class Sketch {
      constructor() {
        this.params = {
          // General & Screen
          greenscreen: false,
          backgroundColor: '#000000',
          antialias: true,
          pixelRatio: Math.min(window.devicePixelRatio || 1, 2),
          randomizeOnClick: true,

          // Color Scheme
          colorScheme: 'Original',
          color1: '#ffffff',
          color2: '#cccccc',
          color3: '#888888',
          color4: '#333333',
          color5: '#050505',
          sphereColor: '#ffffff',

          // Motion & Animation
          animation: 'Slow Orbit',
          animSpeed: 1.0,
          meshRotSpeedY: -0.2,
          meshRotSpeedZ: -0.1,
          leftMouseMode: 'Orbit (Rotate)',

          // Geometry
          pointSize: 8.0,
          noiseIntensity: 0.5,
          noiseScale: 1.0,
          noiseSpeed: 1.0,
          sphereRadius: 1.1,
          sphereOpacity: 1.0,

          // Lighting & Exposure
          exposure: 1.0,
          ambientIntensity: 0.8,
          ambientColor: '#ffffff',
          dirLightIntensity: 1.2,
          dirLightColor: '#ffffff',
          pointLightIntensity: 1.0,
          pointLightColor: '#ffffff'
        };

        this.simTime = 0;
        this.meshRotY = 0;
        this.meshRotZ = 0;
        this.isUserInteracting = false;
        this.uiVisible = true;

        this.initRenderer();
        this.statsInit();
        this.initScene();
        this.setupGUI();
        this.setupEvents();
        this.render();
      }

      initRenderer() {
        this.width = window.innerWidth;
        this.height = window.innerHeight;

        this.renderer = new THREE.WebGLRenderer({
          antialias: this.params.antialias,
          alpha: true,
          powerPreference: 'high-performance'
        });
        this.renderer.setSize(this.width, this.height);
        this.renderer.setPixelRatio(this.params.pixelRatio);
        this.renderer.setClearColor(0x000000, 1.0);

        this.renderer.domElement.style.position = 'fixed';
        this.renderer.domElement.style.top = '0';
        this.renderer.domElement.style.left = '0';
        this.renderer.domElement.style.zIndex = '0';
        this.renderer.domElement.style.outline = 'none';

        document.getElementById('container').appendChild(this.renderer.domElement);
      }

      statsInit() {
        if (typeof Stats !== 'undefined') {
          this.stats = new Stats();
          this.stats.setMode(0);
          this.stats.domElement.style.position = 'absolute';
          this.stats.domElement.style.left = '0';
          this.stats.domElement.style.top = '0';
          this.stats.domElement.style.zIndex = '100';
          document.getElementById('container').appendChild(this.stats.domElement);
        }
      }

      initScene() {
        this.clock = new THREE.Clock();
        this.scene = new THREE.Scene();

        // Camera
        const fov = 70;
        this.camera = new THREE.PerspectiveCamera(
          fov,
          this.width / this.height,
          0.01,
          1000
        );
        this.camera.position.set(0, 0, 5);
        this.camera.lookAt(0, 0, 0);
        this.scene.add(this.camera);

        // OrbitControls
        this.setupCameraControls();

        // Lights
        this.ambientLight = new THREE.AmbientLight(this.params.ambientColor, this.params.ambientIntensity);
        this.scene.add(this.ambientLight);

        this.directionalLight = new THREE.DirectionalLight(this.params.dirLightColor, this.params.dirLightIntensity);
        this.directionalLight.position.set(5, 5, 5);
        this.scene.add(this.directionalLight);

        this.pointLight = new THREE.PointLight(this.params.pointLightColor, this.params.pointLightIntensity, 25);
        this.pointLight.position.set(0, 5, 0);
        this.scene.add(this.pointLight);

        // Shape (particles & inner sphere)
        this.shape = new Shape(this);

        this.applyColorScheme(this.params.colorScheme);
        this.applyBackground();
      }

      setupCameraControls() {
        this.controls = new OrbitControls(this.camera, this.renderer.domElement);
        this.controls.enableDamping = true;
        this.controls.dampingFactor = 0.05;
        this.controls.enableZoom = true;
        this.controls.enablePan = true;
        this.controls.screenSpacePanning = true;
        this.controls.zoomSpeed = 1.0;
        this.controls.panSpeed = 1.0;
        this.controls.minDistance = 0.1;
        this.controls.maxDistance = 100.0;

        this.updateMouseAction();

        this.controls.addEventListener('start', () => {
          this.isUserInteracting = true;
        });

        this.controls.addEventListener('end', () => {
          this.isUserInteracting = false;
        });
      }

      updateMouseAction() {
        if (!this.controls) return;
        if (this.params.leftMouseMode === 'Pan (Drag Screen)') {
          this.controls.mouseButtons.LEFT = THREE.MOUSE.PAN;
        } else {
          this.controls.mouseButtons.LEFT = THREE.MOUSE.ROTATE;
        }
        this.controls.mouseButtons.RIGHT = THREE.MOUSE.PAN;
        this.controls.mouseButtons.MIDDLE = THREE.MOUSE.DOLLY;
      }

      recreateRenderer() {
        const container = document.getElementById('container');
        const oldCanvas = this.renderer.domElement;
        this.renderer.dispose();
        if (oldCanvas && oldCanvas.parentNode) {
          oldCanvas.parentNode.removeChild(oldCanvas);
        }

        this.renderer = new THREE.WebGLRenderer({
          antialias: this.params.antialias,
          alpha: true,
          powerPreference: 'high-performance'
        });
        this.renderer.setSize(this.width, this.height);
        this.renderer.setPixelRatio(this.params.pixelRatio);

        this.applyBackground();

        this.renderer.domElement.style.position = 'fixed';
        this.renderer.domElement.style.top = '0';
        this.renderer.domElement.style.left = '0';
        this.renderer.domElement.style.zIndex = '0';
        this.renderer.domElement.style.outline = 'none';
        container.appendChild(this.renderer.domElement);

        if (this.controls) {
          this.controls.dispose();
        }
        this.setupCameraControls();
      }

      applyBackground() {
        const bg = this.params.greenscreen ? '#00ff00' : this.params.backgroundColor;
        const color = new THREE.Color(bg);
        this.renderer.setClearColor(color, 1.0);
        document.body.style.background = bg;
      }

      applyColorScheme(name) {
        const sc = COLOR_SCHEMES[name] || COLOR_SCHEMES['Original'];
        this.params.colorScheme = name;
        this.params.color1 = sc.c1;
        this.params.color2 = sc.c2;
        this.params.color3 = sc.c3;
        this.params.color4 = sc.c4;
        this.params.color5 = sc.c5;
        this.params.sphereColor = sc.sphere;

        if (!this.params.greenscreen) {
          this.params.backgroundColor = sc.bg;
          this.applyBackground();
        }

        this.updateAllUniforms();
      }

      updateAllUniforms() {
        if (!this.shape) return;
        const pMat = this.shape.material;
        const sMat = this.shape.sphereMaterial;

        const sc = COLOR_SCHEMES[this.params.colorScheme] || COLOR_SCHEMES['Original'];
        const mode = sc.mode;

        // Uniforms for particles
        pMat.uniforms.uColorScheme.value = mode;
        pMat.uniforms.uColor1.value.set(this.params.color1);
        pMat.uniforms.uColor2.value.set(this.params.color2);
        pMat.uniforms.uColor3.value.set(this.params.color3);
        pMat.uniforms.uColor4.value.set(this.params.color4);
        pMat.uniforms.uColor5.value.set(this.params.color5);

        pMat.uniforms.uPointSize.value = this.params.pointSize;
        pMat.uniforms.uNoiseIntensity.value = this.params.noiseIntensity;
        pMat.uniforms.uNoiseScale.value = this.params.noiseScale;
        pMat.uniforms.uNoiseSpeed.value = this.params.noiseSpeed;

        pMat.uniforms.uExposure.value = this.params.exposure;
        pMat.uniforms.uAmbientIntensity.value = this.params.ambientIntensity;
        pMat.uniforms.uAmbientColor.value.set(this.params.ambientColor);
        pMat.uniforms.uDirLightIntensity.value = this.params.dirLightIntensity;
        pMat.uniforms.uDirLightColor.value.set(this.params.dirLightColor);
        pMat.uniforms.uPointLightIntensity.value = this.params.pointLightIntensity;
        pMat.uniforms.uPointLightColor.value.set(this.params.pointLightColor);

        // Uniforms for inner sphere
        sMat.uniforms.uColorScheme.value = mode;
        sMat.uniforms.uColor1.value.set(this.params.color1);
        sMat.uniforms.uColor2.value.set(this.params.color2);
        sMat.uniforms.uColor3.value.set(this.params.color3);
        sMat.uniforms.uColor4.value.set(this.params.color4);
        sMat.uniforms.uColor5.value.set(this.params.color5);
        sMat.uniforms.uSphereColor.value.set(this.params.sphereColor);
        sMat.uniforms.uSphereOpacity.value = this.params.sphereOpacity;

        sMat.uniforms.uExposure.value = this.params.exposure;
        sMat.uniforms.uAmbientIntensity.value = this.params.ambientIntensity;
        sMat.uniforms.uAmbientColor.value.set(this.params.ambientColor);
        sMat.uniforms.uDirLightIntensity.value = this.params.dirLightIntensity;
        sMat.uniforms.uDirLightColor.value.set(this.params.dirLightColor);
        sMat.uniforms.uPointLightIntensity.value = this.params.pointLightIntensity;
        sMat.uniforms.uPointLightColor.value.set(this.params.pointLightColor);

        // Scale sphere mesh
        this.shape.sphereMesh.scale.setScalar(this.params.sphereRadius / 1.1);

        // Update lights
        this.ambientLight.color.set(this.params.ambientColor);
        this.ambientLight.intensity = this.params.ambientIntensity;
        this.directionalLight.color.set(this.params.dirLightColor);
        this.directionalLight.intensity = this.params.dirLightIntensity;
        this.pointLight.color.set(this.params.pointLightColor);
        this.pointLight.intensity = this.params.pointLightIntensity;
      }

      randomizeScene() {
        const schemeKeys = Object.keys(COLOR_SCHEMES);
        const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
        this.applyColorScheme(randomScheme);

        // Procedural geometry & motion
        this.params.pointSize = parseFloat((4.0 + Math.random() * 14.0).toFixed(1));
        this.params.noiseIntensity = parseFloat((0.2 + Math.random() * 1.0).toFixed(2));
        this.params.noiseScale = parseFloat((0.5 + Math.random() * 1.8).toFixed(2));
        this.params.noiseSpeed = parseFloat((0.4 + Math.random() * 1.6).toFixed(2));
        this.params.sphereRadius = parseFloat((0.7 + Math.random() * 0.9).toFixed(2));
        this.params.sphereOpacity = parseFloat((0.4 + Math.random() * 0.6).toFixed(2));

        const animKeys = [
          'Slow Orbit', 'Floating Wave', 'Figure Eight',
          'Zenith Spiral', 'Gentle Breath', 'Diagonal Glide', 'Pendulum Sway'
        ];
        this.params.animation = animKeys[Math.floor(Math.random() * animKeys.length)];
        this.params.animSpeed = parseFloat((0.5 + Math.random() * 1.3).toFixed(2));
        this.params.meshRotSpeedY = parseFloat((-0.4 + Math.random() * 0.8).toFixed(2));
        this.params.meshRotSpeedZ = parseFloat((-0.3 + Math.random() * 0.6).toFixed(2));

        // Procedural lighting & exposure
        this.params.exposure = parseFloat((0.8 + Math.random() * 0.9).toFixed(2));
        this.params.ambientIntensity = parseFloat((0.3 + Math.random() * 0.9).toFixed(2));
        this.params.dirLightIntensity = parseFloat((0.6 + Math.random() * 1.4).toFixed(2));
        this.params.pointLightIntensity = parseFloat((0.4 + Math.random() * 1.6).toFixed(2));

        this.updateAllUniforms();
        this.updateGuiDisplay();
      }

      updateGuiDisplay() {
        if (!this.gui) return;
        const updateRec = (obj) => {
          if (obj.controllers) {
            obj.controllers.forEach(c => c.updateDisplay());
          }
          if (obj.folders) {
            obj.folders.forEach(f => updateRec(f));
          }
        };
        updateRec(this.gui);
      }

      setupGUI() {
        this.gui = new GUI({ title: 'Scene Controls' });

        // Presets & Click Randomizer
        const fScene = this.gui.addFolder('Presets & System');
        fScene.add(this.params, 'randomizeOnClick').name('Randomize On Scene Click');
        fScene.add({ randomize: () => this.randomizeScene() }, 'randomize').name('🎲 Randomize Now');
        fScene.add(this.params, 'greenscreen').name('Greenscreen (#00ff00)').onChange(() => this.applyBackground());
        fScene.addColor(this.params, 'backgroundColor').name('Background Color').onChange((v) => {
          if (this.params.greenscreen) {
            this.params.greenscreen = false;
          }
          this.applyBackground();
          this.updateGuiDisplay();
        });
        fScene.add(this.params, 'antialias').name('Antialias (Default ON)').onChange(() => this.recreateRenderer());
        fScene.add(this.params, 'pixelRatio', 0.5, 3.0, 0.1).name('Pixel Ratio (DPR)').onChange(v => {
          this.renderer.setPixelRatio(v);
        });

        // 19 Color Schemes
        const fColor = this.gui.addFolder('Color Schemes (19 Choices)');
        const schemeNames = Object.keys(COLOR_SCHEMES);
        fColor.add(this.params, 'colorScheme', schemeNames).name('Scheme Preset').onChange(v => {
          this.applyColorScheme(v);
          this.updateGuiDisplay();
        });
        fColor.addColor(this.params, 'color1').name('Color 1').onChange(() => this.updateAllUniforms());
        fColor.addColor(this.params, 'color2').name('Color 2').onChange(() => this.updateAllUniforms());
        fColor.addColor(this.params, 'color3').name('Color 3').onChange(() => this.updateAllUniforms());
        fColor.addColor(this.params, 'color4').name('Color 4').onChange(() => this.updateAllUniforms());
        fColor.addColor(this.params, 'color5').name('Color 5').onChange(() => this.updateAllUniforms());
        fColor.addColor(this.params, 'sphereColor').name('Core Sphere Color').onChange(() => this.updateAllUniforms());

        // Animations (8 preconfigured options)
        const fAnim = this.gui.addFolder('Camera & Animation');
        const animList = [
          'Slow Orbit',
          'Floating Wave',
          'Figure Eight',
          'Zenith Spiral',
          'Gentle Breath',
          'Diagonal Glide',
          'Pendulum Sway',
          'Static View'
        ];
        fAnim.add(this.params, 'animation', animList).name('Camera Motion');
        fAnim.add(this.params, 'animSpeed', 0.0, 3.0, 0.05).name('Animation Speed');
        fAnim.add(this.params, 'meshRotSpeedY', -1.0, 1.0, 0.02).name('Sphere Spin Y');
        fAnim.add(this.params, 'meshRotSpeedZ', -1.0, 1.0, 0.02).name('Sphere Spin Z');
        fAnim.add(this.params, 'leftMouseMode', ['Orbit (Rotate)', 'Pan (Drag Screen)']).name('Left Drag Action').onChange(() => {
          this.updateMouseAction();
        });
        fAnim.add({ resetCamera: () => {
          this.camera.position.set(0, 0, 5);
          this.controls.target.set(0, 0, 0);
          this.controls.update();
        }}, 'resetCamera').name('Reset Camera');

        // Geometry & Particles
        const fGeom = this.gui.addFolder('Geometry & Noise');
        fGeom.add(this.params, 'pointSize', 1.0, 30.0, 0.5).name('Point Size').onChange(() => this.updateAllUniforms());
        fGeom.add(this.params, 'noiseIntensity', 0.0, 2.5, 0.05).name('Noise Turbulence').onChange(() => this.updateAllUniforms());
        fGeom.add(this.params, 'noiseScale', 0.1, 3.0, 0.05).name('Noise Scale').onChange(() => this.updateAllUniforms());
        fGeom.add(this.params, 'noiseSpeed', 0.1, 3.0, 0.05).name('Noise Speed').onChange(() => this.updateAllUniforms());
        fGeom.add(this.params, 'sphereRadius', 0.4, 2.5, 0.05).name('Sphere Radius').onChange(() => this.updateAllUniforms());
        fGeom.add(this.params, 'sphereOpacity', 0.0, 1.0, 0.02).name('Sphere Opacity').onChange(() => this.updateAllUniforms());

        // Lighting & Exposure
        const fLight = this.gui.addFolder('Lighting & Exposure');
        fLight.add(this.params, 'exposure', 0.1, 3.5, 0.05).name('Scene Exposure').onChange(() => this.updateAllUniforms());
        fLight.add(this.params, 'ambientIntensity', 0.0, 3.0, 0.05).name('Ambient Intensity').onChange(() => this.updateAllUniforms());
        fLight.addColor(this.params, 'ambientColor').name('Ambient Color').onChange(() => this.updateAllUniforms());
        fLight.add(this.params, 'dirLightIntensity', 0.0, 3.0, 0.05).name('Dir Light Intensity').onChange(() => this.updateAllUniforms());
        fLight.addColor(this.params, 'dirLightColor').name('Dir Light Color').onChange(() => this.updateAllUniforms());
        fLight.add(this.params, 'pointLightIntensity', 0.0, 3.0, 0.05).name('Point Light Intensity').onChange(() => this.updateAllUniforms());
        fLight.addColor(this.params, 'pointLightColor').name('Point Light Color').onChange(() => this.updateAllUniforms());
      }

      setupEvents() {
        window.addEventListener('resize', this.onResize.bind(this), false);

        // Hide/Show UI with 'H' key
        window.addEventListener('keydown', (e) => {
          if (e.key === 'h' || e.key === 'H') {
            this.uiVisible = !this.uiVisible;
            if (this.gui) {
              if (this.uiVisible) {
                this.gui.show();
              } else {
                this.gui.hide();
              }
            }
            if (this.stats) {
              this.stats.domElement.style.display = this.uiVisible ? 'block' : 'none';
            }
          }
        });

        // Click on scene to randomly generate variation
        let downX = 0, downY = 0, downTime = 0;
        window.addEventListener('pointerdown', (e) => {
          if (e.target === this.renderer.domElement) {
            downX = e.clientX;
            downY = e.clientY;
            downTime = performance.now();
          }
        });

        window.addEventListener('pointerup', (e) => {
          if (e.target === this.renderer.domElement) {
            const dist = Math.hypot(e.clientX - downX, e.clientY - downY);
            const time = performance.now() - downTime;
            if (dist < 6 && time < 350) {
              if (this.params.randomizeOnClick) {
                this.randomizeScene();
              }
            }
          }
        });
      }

      onResize() {
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.camera.aspect = this.width / this.height;
        this.camera.updateProjectionMatrix();
        this.renderer.setSize(this.width, this.height);
      }

      render() {
        if (this.stats) this.stats.begin();

        const delta = this.clock.getDelta();
        this.simTime += delta * this.params.animSpeed;

        // Rotate object meshes
        this.meshRotY += delta * this.params.meshRotSpeedY * this.params.animSpeed;
        this.meshRotZ += delta * this.params.meshRotSpeedZ * this.params.animSpeed;

        if (this.shape) {
          this.shape.update(this.simTime, this.meshRotY, this.meshRotZ);
        }

        // Camera animation (preserves zoom distance r and user adjustments)
        const offset = this.camera.position.clone().sub(this.controls.target);
        const spherical = new THREE.Spherical().setFromVector3(offset);

        if (!this.isUserInteracting && this.params.animation !== 'Static View') {
          const rate = delta * this.params.animSpeed;
          switch (this.params.animation) {
            case 'Slow Orbit':
              spherical.theta += rate * 0.15;
              break;
            case 'Floating Wave':
              spherical.theta += rate * 0.12;
              spherical.phi += Math.sin(this.simTime * 0.6) * rate * 0.08;
              spherical.phi = Math.max(0.1, Math.min(Math.PI - 0.1, spherical.phi));
              break;
            case 'Figure Eight':
              spherical.theta += Math.cos(this.simTime * 0.35) * rate * 0.18;
              spherical.phi += Math.sin(this.simTime * 0.7) * rate * 0.12;
              spherical.phi = Math.max(0.1, Math.min(Math.PI - 0.1, spherical.phi));
              break;
            case 'Zenith Spiral':
              spherical.theta += rate * 0.10;
              spherical.phi += Math.sin(this.simTime * 0.25) * rate * 0.10;
              spherical.phi = Math.max(0.1, Math.min(Math.PI - 0.1, spherical.phi));
              break;
            case 'Gentle Breath':
              spherical.theta += Math.sin(this.simTime * 0.4) * rate * 0.08;
              spherical.phi += Math.cos(this.simTime * 0.5) * rate * 0.06;
              spherical.phi = Math.max(0.1, Math.min(Math.PI - 0.1, spherical.phi));
              break;
            case 'Diagonal Glide':
              spherical.theta += rate * 0.14;
              spherical.phi += Math.sin(this.simTime * 0.3) * rate * 0.07;
              spherical.phi = Math.max(0.1, Math.min(Math.PI - 0.1, spherical.phi));
              break;
            case 'Pendulum Sway':
              spherical.theta += Math.sin(this.simTime * 0.5) * rate * 0.15;
              break;
          }

          // spherical.radius is preserved! Never overwritten or clamped to default.
          offset.setFromSpherical(spherical);
          this.camera.position.copy(this.controls.target).add(offset);
          this.camera.lookAt(this.controls.target);
        }

        this.controls.update();

        this.renderer.render(this.scene, this.camera);

        if (this.stats) this.stats.end();
        requestAnimationFrame(this.render.bind(this));
      }
    }

    class Shape {
      constructor(sketch) {
        this.sketch = sketch;
        this.init();
      }

      init() {
        // Particles Material
        this.material = new THREE.ShaderMaterial({
          side: THREE.DoubleSide,
          uniforms: {
            uTime: { value: 0 },
            uPointSize: { value: 8.0 },
            uNoiseIntensity: { value: 0.5 },
            uNoiseScale: { value: 1.0 },
            uNoiseSpeed: { value: 1.0 },
            uColorScheme: { value: 0 },
            uColor1: { value: new THREE.Color('#ffffff') },
            uColor2: { value: new THREE.Color('#cccccc') },
            uColor3: { value: new THREE.Color('#888888') },
            uColor4: { value: new THREE.Color('#333333') },
            uColor5: { value: new THREE.Color('#050505') },
            uExposure: { value: 1.0 },
            uAmbientIntensity: { value: 0.8 },
            uAmbientColor: { value: new THREE.Color('#ffffff') },
            uDirLightIntensity: { value: 1.2 },
            uDirLightColor: { value: new THREE.Color('#ffffff') },
            uDirLightPos: { value: new THREE.Vector3(5, 5, 5) },
            uPointLightIntensity: { value: 1.0 },
            uPointLightColor: { value: new THREE.Color('#ffffff') },
            uPointLightPos: { value: new THREE.Vector3(0, 5, 0) }
          },
          blending: THREE.AdditiveBlending,
          transparent: true,
          vertexShader: vertexParticlesShaderSource,
          fragmentShader: fragmentParticlesShaderSource
        });

        // 300,000 Points Fibonacci Sphere
        const N = 300000;
        const positions = new Float32Array(N * 3);
        this.geometry = new THREE.BufferGeometry();

        const inc = Math.PI * (3 - Math.sqrt(5));
        const off = 2 / N;
        const rad = 1.7;

        for (let i = 0; i < N; i++) {
          const y = i * off - 1 + (off / 2);
          const r = Math.sqrt(1 - y * y);
          const phi = i * inc;

          positions[i * 3 + 0] = rad * Math.cos(phi) * r;
          positions[i * 3 + 1] = rad * y;
          positions[i * 3 + 2] = rad * Math.sin(phi) * r;
        }

        this.geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        this.mesh = new THREE.Points(this.geometry, this.material);
        this.sketch.scene.add(this.mesh);

        // Core Sphere Material & Mesh
        this.sphereMaterial = new THREE.ShaderMaterial({
          uniforms: {
            uTime: { value: 0 },
            uColorScheme: { value: 0 },
            uColor1: { value: new THREE.Color('#ffffff') },
            uColor2: { value: new THREE.Color('#cccccc') },
            uColor3: { value: new THREE.Color('#888888') },
            uColor4: { value: new THREE.Color('#333333') },
            uColor5: { value: new THREE.Color('#050505') },
            uSphereColor: { value: new THREE.Color('#ffffff') },
            uSphereOpacity: { value: 1.0 },
            uExposure: { value: 1.0 },
            uAmbientIntensity: { value: 0.8 },
            uAmbientColor: { value: new THREE.Color('#ffffff') },
            uDirLightIntensity: { value: 1.2 },
            uDirLightColor: { value: new THREE.Color('#ffffff') },
            uDirLightPos: { value: new THREE.Vector3(5, 5, 5) },
            uPointLightIntensity: { value: 1.0 },
            uPointLightColor: { value: new THREE.Color('#ffffff') },
            uPointLightPos: { value: new THREE.Vector3(0, 5, 0) }
          },
          transparent: true,
          vertexShader: vertexSphereShaderSource,
          fragmentShader: fragmentSphereShaderSource
        });

        this.sphereGeometry = new THREE.SphereGeometry(1.1, 32, 32);
        this.sphereMesh = new THREE.Mesh(this.sphereGeometry, this.sphereMaterial);
        this.sketch.scene.add(this.sphereMesh);
      }

      update(time, rotY, rotZ) {
        this.mesh.material.uniforms.uTime.value = time;
        this.mesh.rotation.y = rotY;
        this.mesh.rotation.z = rotZ;

        this.sphereMesh.material.uniforms.uTime.value = time;
        this.sphereMesh.rotation.y = rotY;
        this.sphereMesh.rotation.z = rotZ;
      }
    }

    window.addEventListener('load', () => {
      console.clear();

      const loading = document.getElementById('loading');
      if (loading) {
        loading.classList.add('loaded');
      }

      new Sketch();
    });
  </script>
