<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procedural Motion Matrix</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
      font-family: serif;
      overflow: hidden;
      position: relative;
      background: #000;
    }

    canvas {
      display: block;
      height: 100%;
      width: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      touch-action: none;
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }
  </style>
</head>
<body>

<script type="importmap">
{
  "imports": {
    "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
  }
}
</script>

<script type="module">
  import GUI from 'lil-gui';

  class Utils {
    static norm(value, min, max) {
      return (value - min) / (max - min);
    }

    static lerp(norm, min, max) {
      return (max - min) * norm + min;
    }

    static map(value, sourceMin, sourceMax, destMin, destMax) {
      return this.lerp(this.norm(value, sourceMin, sourceMax), destMin, destMax);
    }

    static clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    static distance(x0, y0, x1, y1) {
      const dx = x1 - x0;
      const dy = y1 - y0;
      return Math.sqrt(dx * dx + dy * dy);
    }

    static randomRange(min, max) {
      return min + Math.random() * (max - min);
    }

    static randomInt(min, max) {
      return Math.floor(min + Math.random() * (max - min + 1));
    }

    static randomDist(min, max, iterations) {
      let total = 0;
      for (let i = 0; i < iterations; i++) {
        total += this.randomRange(min, max);
      }
      return total / iterations;
    }

    static degreesToRads(degrees) {
      return degrees / 180 * Math.PI;
    }

    static radsToDegrees(radians) {
      return radians * 180 / Math.PI;
    }

    static roundToPlaces(value, places) {
      const mult = Math.pow(10, places);
      return Math.round(value * mult) / mult;
    }

    static roundNearest(value, nearest) {
      return Math.round(value / nearest) * nearest;
    }
  }

  // Preconfigured color schemes (13 color-theory harmonies + 8 specified palettes)
  const COLOR_SCHEMES = {
    'Original': {
      bg: '#000000',
      colors: ['#FF0000', '#00FF00', '#0000FF'],
      blendMode: 'lighter'
    },
    'Monochromatic': {
      bg: '#05101a',
      colors: ['#00e5ff', '#0088ff', '#55b3ff'],
      blendMode: 'lighter'
    },
    'Analogous': {
      bg: '#140508',
      colors: ['#ff0055', '#ff5500', '#ffaa00'],
      blendMode: 'lighter'
    },
    'Complementary': {
      bg: '#040b12',
      colors: ['#00f0ff', '#ff0055', '#00e5a3'],
      blendMode: 'lighter'
    },
    'Split-complementary': {
      bg: '#0c0517',
      colors: ['#8b5cf6', '#a3e635', '#f59e0b'],
      blendMode: 'lighter'
    },
    'Triadic': {
      bg: '#060a14',
      colors: ['#ec4899', '#06b6d4', '#eab308'],
      blendMode: 'lighter'
    },
    'Tetradic': {
      bg: '#090514',
      colors: ['#ff007f', '#00e5ff', '#ff9e00', '#9d4edd'],
      blendMode: 'lighter'
    },
    'Double split-complementary': {
      bg: '#060c14',
      colors: ['#00d4ff', '#ff5722', '#2979ff', '#ffab00'],
      blendMode: 'lighter'
    },
    'Achromatic (Black on White)': {
      bg: '#ffffff',
      colors: ['#111111', '#555555', '#888888'],
      blendMode: 'source-over'
    },
    'Achromatic (White on Black)': {
      bg: '#000000',
      colors: ['#ffffff', '#bbbbbb', '#777777'],
      blendMode: 'lighter'
    },
    'Achromatic + Accent (Black & White + Red)': {
      bg: '#ffffff',
      colors: ['#111111', '#666666', '#e60000'],
      blendMode: 'source-over'
    },
    'Achromatic + Accent (White & Black + Red)': {
      bg: '#000000',
      colors: ['#ffffff', '#888888', '#ff1744'],
      blendMode: 'lighter'
    },
    'Neutral + Accent': {
      bg: '#1c1917',
      colors: ['#e7e5e4', '#a8a29e', '#00f0ff'],
      blendMode: 'lighter'
    },
    'Amber Flame (F6AA1C, BC3908, 941B0C...)': {
      bg: '#220901',
      colors: ['#F6AA1C', '#BC3908', '#941B0C', '#F6AA1C'],
      blendMode: 'lighter'
    },
    'Aqua Marine (63D1CF, 5BC0BE, 4BAD9E...)': {
      bg: '#0B132B',
      colors: ['#63D1CF', '#5BC0BE', '#4BAD9E', '#4BAD9E'],
      blendMode: 'lighter'
    },
    'Lavender Orchid (AA60C8, D69ADE, C9A3C6...)': {
      bg: '#0D001D',
      colors: ['#AA60C8', '#D69ADE', '#C9A3C6', '#CFB5C2'],
      blendMode: 'lighter'
    },
    'Golden Teal (FEF1BE, FFBA00, 008189...)': {
      bg: '#061210',
      colors: ['#FEF1BE', '#FFBA00', '#008189', '#00474D'],
      blendMode: 'lighter'
    },
    'Electric Lime (D4FFB0, 7FFF00, 00B894...)': {
      bg: '#05140A',
      colors: ['#D4FFB0', '#7FFF00', '#00B894', '#0A3322'],
      blendMode: 'lighter'
    },
    'Sunset Twilight (FFE8CC, FF8C00, C7501A...)': {
      bg: '#0E0618',
      colors: ['#FFE8CC', '#FF8C00', '#C7501A', '#3D1050'],
      blendMode: 'lighter'
    },
    'Deep Lilac (E8E0FF, B38FFF, 6A3DE8...)': {
      bg: '#090612',
      colors: ['#E8E0FF', '#B38FFF', '#6A3DE8', '#1A1250'],
      blendMode: 'lighter'
    },
    'Cyberpunk Neon (E0FBFF, 00F0FF, D40078...)': {
      bg: '#05020F',
      colors: ['#E0FBFF', '#00F0FF', '#D40078', '#1E0A3D'],
      blendMode: 'lighter'
    }
  };

  let gui, canvas, c, offscreenCanvas, offscreenCtx;
  let width, height, animId, shapes;
  let size, num, maxDist;
  const ctrls = {};

  const params = {
    // Scene Settings
    clickToRandomize: true,
    randomize: () => randomizeScene(),
    reset: () => initialize(),

    // Color & Theme
    colorScheme: 'Original',
    greenScreen: false,
    bgColor: '#000000',
    blendMode: 'lighter',
    numLayers: 3,
    color1: '#FF0000',
    color2: '#00FF00',
    color3: '#0000FF',
    color4: '#FFFF00',
    color5: '#FF00FF',

    // Geometry & Layout
    number: 10,
    size: 30,
    shapeType: 'Circle',
    sizeMultiplier: 0.333,
    layout: 'Grid',

    // Motion & Dynamics
    timeScale: 0.0005,
    phaseOffset: 0.01,
    motionPattern: 'Square Loop',
    easing: 'Exponential',

    // Camera & Transform
    zoom: 1.0,
    panX: 0,
    panY: 0,
    resetView: () => resetCamera(),
    toggleFullscreen: () => toggleFullscreen()
  };

  const applyEase = (x, type) => {
    if (type === 'Linear') return x;
    if (type === 'Sine') return -(Math.cos(Math.PI * x) - 1) / 2;
    // Exponential (Original Easing from easings.net)
    return x === 0
      ? 0
      : x === 1
      ? 1
      : x < 0.5 ? Math.pow(2, 20 * x - 10) / 2
      : (2 - Math.pow(2, -20 * x + 10)) / 2;
  };

  const drawPolygon = (ctx, x, y, sides, radius) => {
    ctx.beginPath();
    for (let i = 0; i < sides; i++) {
      const angle = (i / sides) * Math.PI * 2 - Math.PI / 2;
      const nx = Math.cos(angle) * radius + x;
      const ny = Math.sin(angle) * radius + y;
      if (i === 0) ctx.moveTo(nx, ny);
      else ctx.lineTo(nx, ny);
    }
    ctx.closePath();
    ctx.fill();
  };

  const drawStar = (ctx, x, y, points, outerRadius, innerRadius) => {
    ctx.beginPath();
    for (let i = 0; i < points * 2; i++) {
      const r = (i % 2 === 0) ? outerRadius : innerRadius;
      const angle = (i / (points * 2)) * Math.PI * 2 - Math.PI / 2;
      const nx = Math.cos(angle) * r + x;
      const ny = Math.sin(angle) * r + y;
      if (i === 0) ctx.moveTo(nx, ny);
      else ctx.lineTo(nx, ny);
    }
    ctx.closePath();
    ctx.fill();
  };

  const renderShape = (ctx, x, y, radius, color, shapeType) => {
    ctx.fillStyle = color;
    ctx.strokeStyle = color;

    if (shapeType === 'Circle') {
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2, false);
      ctx.fill();
    } else if (shapeType === 'Square') {
      ctx.beginPath();
      ctx.rect(x - radius, y - radius, radius * 2, radius * 2);
      ctx.fill();
    } else if (shapeType === 'Triangle') {
      drawPolygon(ctx, x, y, 3, radius);
    } else if (shapeType === 'Hexagon') {
      drawPolygon(ctx, x, y, 6, radius);
    } else if (shapeType === 'Star') {
      drawStar(ctx, x, y, 5, radius, radius * 0.45);
    } else if (shapeType === 'Ring') {
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2, false);
      ctx.arc(x, y, radius * 0.5, 0, Math.PI * 2, true);
      ctx.fill();
    }
  };

  const applyColorScheme = (schemeKey) => {
    const scheme = COLOR_SCHEMES[schemeKey];
    if (!scheme) return;

    params.colorScheme = schemeKey;
    params.bgColor = scheme.bg;
    params.blendMode = scheme.blendMode;
    params.numLayers = scheme.colors.length;

    if (scheme.colors[0]) params.color1 = scheme.colors[0];
    if (scheme.colors[1]) params.color2 = scheme.colors[1];
    if (scheme.colors[2]) params.color3 = scheme.colors[2];
    if (scheme.colors[3]) params.color4 = scheme.colors[3];
    if (scheme.colors[4]) params.color5 = scheme.colors[4];

    updateAllGuiDisplays();
  };

  const updateAllGuiDisplays = () => {
    if (gui && typeof gui.controllersRecursive === 'function') {
      gui.controllersRecursive().forEach(ctrl => ctrl.updateDisplay());
    }
  };

  const resetCamera = () => {
    params.zoom = 1.0;
    params.panX = 0;
    params.panY = 0;
    updateAllGuiDisplays();
  };

  const toggleFullscreen = () => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else if (document.exitFullscreen) {
      document.exitFullscreen().catch(() => {});
    }
  };

  const randomizeScene = () => {
    const schemeKeys = Object.keys(COLOR_SCHEMES);
    const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
    applyColorScheme(randomScheme);

    // Randomize Geometric Parameters
    params.number = Utils.randomInt(6, 20);
    params.size = Utils.randomInt(24, 75);
    params.sizeMultiplier = Utils.roundToPlaces(Utils.randomRange(0.22, 0.52), 3);
    const shapeList = ['Circle', 'Square', 'Triangle', 'Hexagon', 'Star', 'Ring'];
    params.shapeType = shapeList[Utils.randomInt(0, shapeList.length - 1)];
    params.layout = Math.random() > 0.35 ? 'Grid' : 'Concentric Rings';

    // Randomize Motion Parameters
    params.timeScale = Utils.roundToPlaces(Utils.randomRange(0.0004, 0.0028), 5);
    params.phaseOffset = Utils.roundToPlaces(Utils.randomRange(0.006, 0.03), 4);
    const motionList = ['Square Loop', 'Circle Orbit', 'Figure Eight', 'Pulse'];
    params.motionPattern = motionList[Utils.randomInt(0, motionList.length - 1)];
    const easeList = ['Exponential', 'Linear', 'Sine'];
    params.easing = easeList[Utils.randomInt(0, easeList.length - 1)];

    updateAllGuiDisplays();
    initialize();
  };

  const setupGui = () => {
    gui = new GUI({ title: 'Procedural Matrix' });

    // Scene Randomization & Flow
    const sceneFolder = gui.addFolder('Scene Controls');
    sceneFolder.add(params, 'clickToRandomize').name('Click Scene: Randomize');
    sceneFolder.add(params, 'randomize').name('Randomize Now');
    sceneFolder.add(params, 'reset').name('Reset Parameters');

    // Color & Theme Management
    const themeFolder = gui.addFolder('Color & Scheme');
    ctrls.colorScheme = themeFolder.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES))
      .name('Color Scheme')
      .onChange((val) => applyColorScheme(val));
    ctrls.greenScreen = themeFolder.add(params, 'greenScreen').name('Green Screen (#00ff00)');
    ctrls.bgColor = themeFolder.addColor(params, 'bgColor').name('Background Color');
    ctrls.blendMode = themeFolder.add(params, 'blendMode', ['lighter', 'source-over', 'screen', 'multiply', 'difference']).name('Blend Mode');
    ctrls.numLayers = themeFolder.add(params, 'numLayers', 1, 5, 1).name('Active Layers');
    ctrls.color1 = themeFolder.addColor(params, 'color1').name('Color 1');
    ctrls.color2 = themeFolder.addColor(params, 'color2').name('Color 2');
    ctrls.color3 = themeFolder.addColor(params, 'color3').name('Color 3');
    ctrls.color4 = themeFolder.addColor(params, 'color4').name('Color 4');
    ctrls.color5 = themeFolder.addColor(params, 'color5').name('Color 5');

    // Geometry Controls
    const geomFolder = gui.addFolder('Geometry');
    ctrls.number = geomFolder.add(params, 'number', 1, 30, 1).name('Grid Density').onChange(() => initialize());
    ctrls.size = geomFolder.add(params, 'size', 1, 500, 1).name('Spacing & Scale').onChange(() => initialize());
    ctrls.shapeType = geomFolder.add(params, 'shapeType', ['Circle', 'Square', 'Triangle', 'Hexagon', 'Star', 'Ring']).name('Shape Type');
    ctrls.sizeMultiplier = geomFolder.add(params, 'sizeMultiplier', 0.05, 1.0, 0.01).name('Shape Radius Scale');
    ctrls.layout = geomFolder.add(params, 'layout', ['Grid', 'Concentric Rings']).name('Distribution Layout').onChange(() => initialize());

    // Dynamics & Motion
    const motionFolder = gui.addFolder('Motion');
    ctrls.timeScale = motionFolder.add(params, 'timeScale', 0.0001, 0.005, 0.0001).name('Animation Speed');
    ctrls.phaseOffset = motionFolder.add(params, 'phaseOffset', 0.001, 0.05, 0.001).name('Phase Separation');
    ctrls.motionPattern = motionFolder.add(params, 'motionPattern', ['Square Loop', 'Circle Orbit', 'Figure Eight', 'Pulse']).name('Orbit Path');
    ctrls.easing = motionFolder.add(params, 'easing', ['Exponential', 'Linear', 'Sine']).name('Easing Curve');

    // Camera Viewport
    const cameraFolder = gui.addFolder('Camera & Viewport');
    ctrls.zoom = cameraFolder.add(params, 'zoom', 0.1, 15, 0.01).name('Zoom Level');
    ctrls.panX = cameraFolder.add(params, 'panX', -2000, 2000, 1).name('Pan X');
    ctrls.panY = cameraFolder.add(params, 'panY', -2000, 2000, 1).name('Pan Y');
    cameraFolder.add(params, 'resetView').name('Reset Camera');
    cameraFolder.add(params, 'toggleFullscreen').name('Toggle Fullscreen');

    // Keep folders expanded for accessibility
    themeFolder.open();
  };

  const setupCanvas = () => {
    canvas = document.createElement('canvas');
    document.body.appendChild(canvas);
    c = canvas.getContext('2d');

    offscreenCanvas = document.createElement('canvas');
    offscreenCtx = offscreenCanvas.getContext('2d');
  };

  const initialize = () => {
    if (animId) {
      cancelAnimationFrame(animId);
    }

    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    offscreenCanvas.width = width;
    offscreenCanvas.height = height;

    shapes = [];
    size = params.size;
    num = params.number;
    maxDist = 0;

    if (params.layout === 'Grid') {
      const adjust = num * size / 2 - size / 2;

      for (let y = 0; y < num; y++) {
        for (let x = 0; x < num; x++) {
          const item = {};
          const ny = size * y - adjust;
          const nx = size * x - adjust;
          const dist = Math.sqrt(nx * nx + ny * ny);
          const angle = Math.atan2(ny, nx);
          const index = y * num + x;

          item.x = nx;
          item.y = ny;
          item.d = dist;
          item.a = angle;
          item.i = index;

          maxDist = Math.max(dist, maxDist);
          shapes.push(item);
        }
      }
    } else {
      // Concentric Rings Layout
      const rings = Math.max(3, Math.floor(num * 0.7));
      let count = 0;
      for (let i = 1; i <= rings; i++) {
        const ringDots = i * 6;
        const ringRadius = (size * 0.75) * i;
        for (let j = 0; j < ringDots; j++) {
          const angle = (Math.PI * 2 / ringDots) * j;
          const nx = Math.cos(angle) * ringRadius;
          const ny = Math.sin(angle) * ringRadius;
          const dist = Math.sqrt(nx * nx + ny * ny);

          shapes.push({
            x: nx,
            y: ny,
            d: dist,
            a: angle,
            i: count++
          });
          maxDist = Math.max(dist, maxDist);
        }
      }
    }

    draw(0);
  };

  const draw = (t) => {
    const scaledTime = t * params.timeScale;

    // 1. Offscreen layer rendering with isolated blend mode
    offscreenCtx.clearRect(0, 0, width, height);
    offscreenCtx.save();
    offscreenCtx.globalCompositeOperation = params.blendMode;

    // Apply Pan, Zoom and Center Translation
    offscreenCtx.translate(width / 2 + params.panX, height / 2 + params.panY);
    offscreenCtx.scale(params.zoom, params.zoom);

    const activeColors = [
      params.color1,
      params.color2,
      params.color3,
      params.color4,
      params.color5
    ].slice(0, params.numLayers);

    for (let j = 0; j < activeColors.length; j++) {
      const color = activeColors[j];

      for (let i = 0; i < shapes.length; i++) {
        offscreenCtx.save();

        let scaledT;
        if (i % 2 === 0) {
          scaledT = (scaledTime - j * params.phaseOffset - ((shapes.length - shapes[i].i) / shapes.length)) % 1;
        } else {
          scaledT = (scaledTime + j * params.phaseOffset + ((shapes.length - shapes[i].i) / shapes.length)) % 1;
        }

        scaledT = applyEase(Math.abs(scaledT), params.easing);

        let moveX = 0;
        let moveY = 0;

        if (params.motionPattern === 'Square Loop') {
          if (scaledT < 0.25) {
            moveX = Utils.map(scaledT, 0, 0.25, 0, size);
            moveY = Utils.map(scaledT, 0, 0.25, 0, 0);
          } else if (scaledT >= 0.25 && scaledT < 0.5) {
            moveX = Utils.map(scaledT, 0.25, 0.5, size, size);
            moveY = Utils.map(scaledT, 0.25, 0.5, 0, size);
          } else if (scaledT >= 0.5 && scaledT < 0.75) {
            moveX = Utils.map(scaledT, 0.5, 0.75, size, 0);
            moveY = Utils.map(scaledT, 0.5, 0.75, size, size);
          } else {
            moveX = Utils.map(scaledT, 0.75, 1.0, 0, 0);
            moveY = Utils.map(scaledT, 0.75, 1.0, size, 0);
          }
        } else if (params.motionPattern === 'Circle Orbit') {
          const angle = scaledT * Math.PI * 2;
          moveX = Math.cos(angle) * (size * 0.5);
          moveY = Math.sin(angle) * (size * 0.5);
        } else if (params.motionPattern === 'Figure Eight') {
          const angle = scaledT * Math.PI * 2;
          moveX = Math.sin(angle) * (size * 0.5);
          moveY = Math.sin(angle * 2) * (size * 0.25);
        } else if (params.motionPattern === 'Pulse') {
          const factor = Math.sin(scaledT * Math.PI * 2);
          moveX = factor * (size * 0.35);
          moveY = factor * (size * 0.35);
        }

        const shapeX = shapes[i].x + moveX;
        const shapeY = shapes[i].y + moveY;
        const shapeRadius = size * params.sizeMultiplier;

        renderShape(offscreenCtx, shapeX, shapeY, shapeRadius, color, params.shapeType);

        offscreenCtx.restore();
      }
    }

    offscreenCtx.restore();

    // 2. Render background onto main canvas
    c.clearRect(0, 0, width, height);
    const activeBg = params.greenScreen ? '#00ff00' : params.bgColor;
    c.fillStyle = activeBg;
    c.fillRect(0, 0, width, height);

    // 3. Composite offscreen particle pass cleanly on top
    c.save();
    c.globalCompositeOperation = 'source-over';
    c.drawImage(offscreenCanvas, 0, 0);
    c.restore();

    animId = requestAnimationFrame(draw);
  };

  // Setup pan, zoom, click-to-randomize and keyboard interaction
  const setupInteractions = () => {
    let isDragging = false;
    let startX = 0;
    let startY = 0;
    let initialPanX = 0;
    let initialPanY = 0;
    let dragDist = 0;
    let pointerDownTime = 0;

    canvas.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      isDragging = true;
      startX = e.clientX;
      startY = e.clientY;
      initialPanX = params.panX;
      initialPanY = params.panY;
      dragDist = 0;
      pointerDownTime = performance.now();
      canvas.setPointerCapture?.(e.pointerId);
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      dragDist = Math.hypot(dx, dy);

      params.panX = initialPanX + dx;
      params.panY = initialPanY + dy;

      ctrls.panX?.updateDisplay();
      ctrls.panY?.updateDisplay();
    });

    window.addEventListener('pointerup', (e) => {
      if (!isDragging) return;
      isDragging = false;
      canvas.releasePointerCapture?.(e.pointerId);

      const duration = performance.now() - pointerDownTime;
      // Scene Click Detection (< 6px movement and quick tap)
      if (dragDist < 6 && duration < 500) {
        if (params.clickToRandomize) {
          randomizeScene();
        }
      }
    });

    // Zoom with mouse wheel toward cursor focal point
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.09 : 0.917;
      const mouseX = e.clientX;
      const mouseY = e.clientY;

      const newZoom = Math.min(Math.max(params.zoom * zoomFactor, 0.1), 15);

      const worldX = (mouseX - width / 2 - params.panX) / params.zoom;
      const worldY = (mouseY - height / 2 - params.panY) / params.zoom;

      params.panX = mouseX - width / 2 - worldX * newZoom;
      params.panY = mouseY - height / 2 - worldY * newZoom;
      params.zoom = newZoom;

      ctrls.zoom?.updateDisplay();
      ctrls.panX?.updateDisplay();
      ctrls.panY?.updateDisplay();
    }, { passive: false });

    // Touch pinch to zoom
    let initialPinchDist = null;
    let initialPinchZoom = 1;

    canvas.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        initialPinchDist = Math.hypot(dx, dy);
        initialPinchZoom = params.zoom;
      }
    }, { passive: true });

    canvas.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2 && initialPinchDist) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const dist = Math.hypot(dx, dy);
        const factor = dist / initialPinchDist;
        params.zoom = Math.min(Math.max(initialPinchZoom * factor, 0.1), 15);
        ctrls.zoom?.updateDisplay();
      }
    }, { passive: true });

    canvas.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) {
        initialPinchDist = null;
      }
    }, { passive: true });

    // "H" key to toggle GUI visibility
    let isGuiVisible = true;
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        if (['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement?.tagName)) return;
        isGuiVisible = !isGuiVisible;
        if (typeof gui.show === 'function') {
          gui.show(isGuiVisible);
        } else if (gui.domElement) {
          gui.domElement.style.display = isGuiVisible ? '' : 'none';
        }
      }
    });
  };

  (() => {
    window.addEventListener('DOMContentLoaded', () => {
      console.clear();
      setupCanvas();
      setupGui();
      setupInteractions();
      initialize();
    });

    window.addEventListener('resize', () => {
      initialize();
    });
  })();
</script>
</body>
</html>
