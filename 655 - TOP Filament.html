<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#030719">
  <link rel="icon" href="data:,">
  <title>Liquid / Filament</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #030719; }
    canvas { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
    canvas.dragging { cursor: grabbing; }
  </style>
</head>
<body>
  <canvas aria-label="Slowly breathing folds of midnight-blue metallic silk, threaded with cyan and molten copper light"></canvas>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
    import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

    const originalColors = [
      [0.003, 0.008, 0.025], [0.012, 0.075, 0.18], [0, 0.59, 0.73],
      [1, 0.145, 0.027], [1, 0.59, 0.27], [1, 0.78, 0.53]
    ].map(rgb => '#' + new THREE.Color().setRGB(...rgb).getHexString());
    const palettes = {
      'Original': { colors: originalColors, background: '#030719' },
      'Monochromatic': { colors: ['#020b18', '#103c66', '#2480b4', '#4e9fca', '#a2dff0', '#e1f8ff'], background: '#020611' },
      'Analogous': { colors: ['#031821', '#0b3b60', '#00baca', '#17779e', '#35dfb7', '#bbf5e0'], background: '#020d18' },
      'Complementary': { colors: ['#061526', '#174574', '#2ebdd1', '#e95926', '#ffac51', '#ffe0a9'], background: '#030b18' },
      'Split-complementary': { colors: ['#10112d', '#29438a', '#6bb9ec', '#f06c78', '#f4b84b', '#ffe2af'], background: '#090818' },
      'Triadic': { colors: ['#091c2a', '#195578', '#39c7c8', '#b83c77', '#e7b851', '#fff0bb'], background: '#060d18' },
      'Tetradic': { colors: ['#101b25', '#215e79', '#40d2c2', '#da6b52', '#b48edb', '#efd78b'], background: '#060c16' },
      'Double split-complementary': { colors: ['#101d2a', '#396e8c', '#70c7b0', '#d7866c', '#c69ad2', '#ebcc91'], background: '#070d17' },
      'Achromatic': { colors: ['#000000', '#242424', '#989898', '#c0c0c0', '#e7e7e7', '#ffffff'], background: '#000000', saturation: 0 },
      'Achromatic + Accent': { colors: ['#000000', '#242424', '#989898', '#c0c0c0', '#e7e7e7', '#ffffff'], background: '#000000', saturation: 0, accent: '#ff233c', amount: 0.9 },
      'Neutral + accent': { colors: ['#171918', '#484b46', '#9baba2', '#b3a593', '#d6cebd', '#f2e9d9'], background: '#0b0e0d', accent: '#ff5934', amount: 0.85 },
      'Amber / Oxblood': { colors: ['#220901', '#941B0C', '#F6AA1C', '#BC3908', '#F6AA1C'], background: '#220901' },
      'Lagoon / Midnight': { colors: ['#000000', '#0B132B', '#63D1CF', '#5BC0BE', '#4BAD9E', '#4BAD9E'], background: '#000000' },
      'Orchid / Aubergine': { colors: ['#120A12', '#0D001D', '#AA60C8', '#D69ADE', '#C9A3C6', '#CFB5C2'], background: '#0D001D' },
      'Saffron / Petrol': { colors: ['#061210', '#00474D', '#008189', '#FFBA00', '#FEF1BE'], background: '#061210' },
      'Chartreuse / Forest': { colors: ['#05140A', '#0A3322', '#00B894', '#7FFF00', '#D4FFB0'], background: '#05140A' },
      'Tangerine / Plum': { colors: ['#0E0618', '#3D1050', '#C7501A', '#FF8C00', '#FFE8CC'], background: '#0E0618' },
      'Lavender / Violet': { colors: ['#090612', '#1A1250', '#6A3DE8', '#B38FFF', '#E8E0FF'], background: '#090612' },
      'Cyan / Magenta': { colors: ['#05020F', '#1E0A3D', '#00F0FF', '#D40078', '#E0FBFF'], background: '#05020F' }
    };
    const animationNames = [
      'Liquid breathing', 'Silk tide', 'Seam drift', 'Light sweep',
      'Macro glide', 'Slow orbit', 'Ribbon sway', 'Static'
    ];
    const settings = {
      scheme: 'Original', invert: false, greenscreen: false,
      color1: originalColors[0], color2: originalColors[1], color3: originalColors[2],
      color4: originalColors[3], color5: originalColors[4], color6: originalColors[5],
      accentColor: '#ff5934', accentAmount: 0, backgroundColor: '#030719',
      saturation: 1, shadowCutoff: 0.1,
      animation: 'Liquid breathing', speed: 1, motionStrength: 1,
      foldStrength: 1, seamBend: 1, foldWidth: 1, valleyShift: 0, seed: 0,
      lineDensity: 225, lineContrast: 0.82, metallic: 0.94, highlights: 1.12,
      zoom: 1, panX: 0, panY: 0, yaw: 0, pitch: 0, roll: 0,
      pixelRatio: Math.min(window.devicePixelRatio || 1, 1.75),
      antialiasing: true, clickRandomize: true
    };

    const canvas = document.querySelector('canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: 'high-performance' });
    renderer.setPixelRatio(settings.pixelRatio);
    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.01, 100);
    camera.position.z = 4;
    const uniforms = {
      uTime: { value: 0 },
      uResolution: { value: new THREE.Vector2() },
      uSpeed: { value: 1 },
      uFoldStrength: { value: 1 },
      uLineDensity: { value: 225 },
      uLineContrast: { value: 0.82 },
      uMetallic: { value: 0.94 },
      uHighlightIntensity: { value: 1.12 },
      uColorIntensity: { value: 1 },
      uNavy: { value: new THREE.Color(settings.color1) },
      uBlue: { value: new THREE.Color(settings.color2) },
      uCyan: { value: new THREE.Color(settings.color3) },
      uCopper: { value: new THREE.Color(settings.color4) },
      uGold: { value: new THREE.Color(settings.color5) },
      uPeach: { value: new THREE.Color(settings.color6) },
      uAccent: { value: new THREE.Color(settings.accentColor).convertLinearToSRGB() },
      uAccentAmount: { value: 0 },
      uInvert: { value: 0 },
      uBackground: { value: new THREE.Color(settings.backgroundColor).convertLinearToSRGB() },
      uKeyBackground: { value: 0 },
      uShadowCutoff: { value: settings.shadowCutoff },
      uMotionStrength: { value: 1 },
      uMode: { value: 0 },
      uSeed: { value: 0 },
      uSeamBend: { value: 1 },
      uFoldWidth: { value: 1 },
      uValleyShift: { value: 0 },
      uViewTilt: { value: new THREE.Vector2() }
    };

    const material = new THREE.ShaderMaterial({
      uniforms,
      depthTest: false,
      depthWrite: false,
      vertexShader: /* glsl */`
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: /* glsl */`
        precision highp float;
        varying vec2 vUv;
        uniform float uTime, uSpeed, uFoldStrength, uLineDensity;
        uniform float uLineContrast, uMetallic, uHighlightIntensity, uColorIntensity;
        uniform vec2 uResolution;
        uniform vec3 uNavy, uBlue, uCyan, uCopper, uGold, uPeach, uAccent, uBackground;
        uniform float uAccentAmount, uInvert, uKeyBackground, uShadowCutoff;
        uniform float uMotionStrength, uMode, uSeed, uSeamBend, uFoldWidth, uValleyShift;
        uniform vec2 uViewTilt;
        const float PI = 3.141592653589793;
        #define NAVY uNavy
        #define BLUE uBlue
        #define CYAN uCyan
        #define COPPER uCopper
        #define GOLD uGold
        #define PEACH uPeach

        float bell(float x, float width) { return exp(-x * x / (width * width)); }

        // A sculpted S-shaped pleat. Every moving term is periodic in phase.
        float seam(float y, vec2 cycle) {
          float drift = uMode == 2.0 ? 0.028 * cycle.x : 0.0;
          return 0.45 + 0.17 * uSeamBend * sin(6.0 * y - 0.55 + 0.27 * sin(uSeed))
            - 0.14 * bell(y - 0.69, 0.158)
            + 0.40 * smoothstep(0.72, 1.07, y)
            + 0.009 * cycle.x * sin(y * 5.1 + 0.8)
            + 0.006 * cycle.y * cos(y * 7.0)
            + 0.035 * sin(uSeed * 1.73) + drift;
        }

        // Height and material coordinates are evaluated together so the grooves
        // remain attached to the deforming sheet, including its compressed folds.
        vec3 surface(vec2 p, vec2 cycle) {
          float x = p.x, y = p.y;
          float d = x - seam(y, cycle);
          float turn = atan(d / ((0.041 + 0.019 * smoothstep(0.5, 0.9, y)) * uFoldWidth));
          float valley = y - (0.51 + uValleyShift + 0.17 * sin(x * 4.6 - 2.8 + 0.18 * sin(uSeed * 0.77)));
          float broad = 0.105 * sin(x * 3.4 + y * 2.6)
            + 0.07 * cos(y * 5.4 - x * 1.8);
          float h = broad - 0.105 * turn
            + 0.085 * bell(d + 0.04, 0.17)
            - 0.09 * atan(valley / 0.09) * smoothstep(0.44, 0.94, x)
            + 0.055 * sin(y * 6.0 + x * 2.1);
          h += 0.004 * cycle.x * sin(x * 5.0 + y * 3.0)
            + 0.004 * cycle.y * cos(y * 4.0 - x * 2.0);
          if (uMode == 1.0) h += 0.012 * cycle.x * sin(y * 4.0 + x * 2.0);
          if (uMode == 6.0) h += 0.009 * cycle.y * cos(x * 4.0 - y * 3.0);
          float coordinate = 0.9 * length(vec2((x + 0.35) * 0.75, (y - 0.94) * 1.1))
            + 0.164 * turn + 0.035 * sin(y * 6.0 - x * 2.0);
          coordinate += 0.006 * cycle.x * sin(x * 3.0 + y * 4.0)
            + 0.004 * cycle.y * cos(x * 4.0 - y * 3.0);
          return vec3(h * uFoldStrength, coordinate, d);
        }

        // Soft, elongated studio light panels reflected in polished metal.
        vec3 environment(vec3 r, vec2 p, vec2 cycle) {
          float vertical = r.y * 0.77 + r.x * 0.30;
          float cyanPanel = bell(vertical + 0.24, 0.17);
          float cyanEdge = bell(vertical + 0.47, 0.066);
          float warmPanel = bell(vertical - 0.43 - 0.015 * cycle.x, 0.075);
          float hotEdge = bell(vertical - 0.34, 0.017);
          float coolPanel = bell(r.x + r.y * 0.37 + 0.4, 0.42);
          vec3 color = NAVY * 0.55 + BLUE * (0.045 + coolPanel * 0.19);
          color += CYAN * (cyanPanel * 0.14 + cyanEdge * 0.27);
          color += COPPER * warmPanel * 0.82 + PEACH * hotEdge * 0.47;
          color += mix(BLUE, PEACH, 0.2) * bell(vertical - 0.65, 0.13) * 0.08;
          return color;
        }

        void main() {
          // uTime is integrated at uSpeed on the CPU, so speed changes never jump.
          float phase = 2.0 * PI * mod(uTime, 30.0) / 30.0;
          vec2 lightCycle = vec2(sin(phase), cos(phase)) * uMotionStrength;
          vec2 cycle = lightCycle;
          if (uMode == 3.0 || uMode == 7.0) cycle = vec2(0.0, 1.0);
          if (uMode == 7.0) lightCycle = vec2(0.0, 1.0);
          float aspect = uResolution.x / uResolution.y;
          // Cover the viewport with the portrait composition without stretching.
          vec2 p = vec2(vUv.x, 1.0 - vUv.y) - 0.5;
          p *= vec2(min(aspect / 0.8, 1.0), min(0.8 / aspect, 1.0));
          p += 0.5;
          vec3 field = surface(p, cycle);
          float d = field.z;
          // Invert the UV Jacobian: normals stay correct while orbiting or rolling.
          vec2 dx = dFdx(p), dy = dFdy(p);
          float determinant = dx.x * dy.y - dx.y * dy.x;
          float inverseDet = sign(determinant) / max(abs(determinant), 1e-12);
          vec2 grad = vec2(dy.y * dFdx(field.x) - dx.y * dFdy(field.x),
            dx.x * dFdy(field.x) - dy.x * dFdx(field.x)) * inverseDet;
          vec3 normal = normalize(vec3(-grad.x * 0.82, -grad.y * 0.82, 1.0));
          vec3 view = normalize(vec3((p - 0.5) * vec2(0.16, -0.13) + uViewTilt, 1.0));
          vec3 reflected = reflect(-view, normal);

          // Filter each harmonic before it reaches the pixel Nyquist limit.
          float linePhase = field.y * uLineDensity;
          float footprint = fwidth(linePhase);
          float visibility = 1.0 - smoothstep(0.28, 0.82, footprint);
          float primary = sin(linePhase * 2.0 * PI);
          float harmonic = sin(linePhase * 4.0 * PI + 0.6)
            * (1.0 - smoothstep(0.12, 0.44, footprint));
          float filament = primary * 0.76 + harmonic * 0.24;
          float bottomSoftness = 1.0 - 0.94 * smoothstep(0.64, 0.96, p.y);
          float thread = filament * visibility * bottomSoftness * uLineContrast;
          vec2 tangent = normalize(vec2(dFdy(field.y), -dFdx(field.y)) + vec2(0.000001));
          vec3 microNormal = normalize(normal + vec3(tangent.y, tangent.x, 0.0) * thread * 0.19);
          vec3 microReflection = reflect(-view, microNormal);
          vec3 color = environment(mix(reflected, microReflection, 0.66), p, lightCycle);

          // Broad convex blue lobe, compressed molten seam, and right-hand valley.
          float left = 1.0 - smoothstep(-0.025, 0.045, d);
          float leftLight = bell(d + 0.10, 0.15) * bell(p.y - 0.42, 0.28);
          float leftPool = bell(p.x - 0.115, 0.11) * bell(p.y - 0.54, 0.15);
          vec3 leftColor = NAVY * 0.4 + BLUE * (0.10 + 0.21 * bell(p.y - 0.31, 0.29));
          leftColor += CYAN * (leftLight * 0.23 + leftPool * 0.42);
          color = mix(color, leftColor, left * 0.95);
          float crest = bell(d + 0.012, 0.016 + 0.012 * p.y);
          float crestHalo = bell(d + 0.022, 0.05);
          float warmSide = bell(d - 0.075, 0.065) * (0.40 + 0.60 * bell(p.y - 0.48, 0.28));
          float warmThread = smoothstep(-0.4, 0.85, filament) * visibility * bottomSoftness;
          color += COPPER * crestHalo * 0.19;
          color += mix(COPPER, PEACH, 0.35 + 0.30 * primary) * crest * (0.15 + 0.62 * warmThread);
          color += mix(COPPER * 0.28, GOLD, warmThread) * warmSide * (0.12 + 0.65 * warmThread);
          float foldShadow = bell(d - 0.002, 0.008) * (0.65 + 0.35 * bell(p.y - 0.42, 0.25));
          color *= 1.0 - foldShadow * 0.86;
          color += CYAN * bell(d + 0.021, 0.006) * 0.19;

          float rightValley = p.y - (0.51 + uValleyShift + 0.17 * sin(p.x * 4.6 - 2.8 + 0.18 * sin(uSeed * 0.77)));
          float rightMask = smoothstep(0.015, 0.24, d);
          color += CYAN * bell(rightValley + 0.015, 0.075) * rightMask * 0.23;
          color += PEACH * bell(rightValley + 0.064, 0.012) * rightMask * (0.04 + warmThread * 0.39);
          color *= 1.0 + thread * (0.48 + 0.45 * left);
          color += CYAN * pow(max(0.0, primary), 8.0) * visibility * bottomSoftness
            * (leftLight * 0.08 + rightMask * 0.025);

          // Defocused reflected copper in the lower fold, with a dark silk pocket.
          float lower = smoothstep(0.62, 0.89, p.y);
          vec2 rounded = abs(p - vec2(0.93, 0.705)) - vec2(0.18, 0.08);
          float lowerArc = length(max(rounded, 0.0)) + min(max(rounded.x, rounded.y), 0.0) - 0.145;
          float lowerCopper = bell(lowerArc, 0.019) * smoothstep(0.67, 0.9, p.y);
          float lowerCyan = bell(lowerArc + 0.08, 0.09) * smoothstep(0.47, 0.81, p.x);
          vec3 lowerColor = NAVY * 0.30 + BLUE * 0.035 + CYAN * lowerCyan * 0.12;
          lowerColor += COPPER * lowerCopper * 1.1 + GOLD * bell(lowerArc + 0.019, 0.03)
            * smoothstep(0.68, 0.89, p.y) * 0.14;
          lowerColor += COPPER * bell(p.x - 0.58, 0.08) * bell(p.y - 0.82, 0.17) * 0.13;
          color = mix(color, lowerColor, lower * 0.96);

          float fresnel = pow(1.0 - max(dot(normal, view), 0.0), 3.0);
          color += mix(CYAN * 0.17, GOLD * 0.22, smoothstep(-0.01, 0.09, d))
            * fresnel * uMetallic * (1.0 - lower) * 0.35;
          float edgeShade = 1.0 - 0.34 * smoothstep(0.32, 0.79, length((p - 0.48) * vec2(0.95, 0.8)));
          color *= edgeShade * uHighlightIntensity;
          float luminance = dot(color, vec3(0.2126, 0.7152, 0.0722));
          color = mix(vec3(luminance), color, uColorIntensity);
          color = max(color, vec3(0.0));
          // A soft highlight shoulder retains colored highlights and deep blacks.
          color = (color * (2.51 * color + 0.03)) / (color * (2.43 * color + 0.59) + 0.14);
          color = pow(clamp(color, 0.0, 1.0), vec3(1.0 / 2.2));
          float materialLuma = dot(color, vec3(0.2126, 0.7152, 0.0722));
          // Accent is localized to luminous folds rather than tinting the neutrals.
          color = mix(color, vec3(1.0) - color, uInvert);
          float accentMask = clamp(crest * 0.85 + warmSide * 0.20 + lowerCopper * lower * 0.7, 0.0, 1.0);
          color = mix(color, uAccent * (0.55 + 0.45 * dot(color, vec3(0.2126, 0.7152, 0.0722))),
            accentMask * uAccentAmount);
          // Key only the darkest negative space; exposed canvas is also pure key green.
          float coverage = smoothstep(uShadowCutoff * 0.65, uShadowCutoff + 0.035,
            materialLuma);
          color = mix(uBackground, color, mix(1.0, coverage, uKeyBackground));
          gl_FragColor = vec4(color, 1.0);
        }
      `
    });
    const geometry = new THREE.PlaneGeometry(2, 2);
    const artwork = new THREE.Mesh(geometry, material);
    scene.add(artwork);

    // MSAA resolves geometry edges; FXAA and the shader's derivative filters
    // handle the embedded subpixel filaments. The pass also performs a plain
    // copy when AA is disabled, keeping background color handling identical.
    const postScene = new THREE.Scene();
    const postCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const postMaterial = new THREE.ShaderMaterial({
      depthTest: false, depthWrite: false,
      uniforms: {
        tImage: { value: null },
        uTexel: { value: new THREE.Vector2() },
        uEnabled: { value: true }
      },
      vertexShader: /* glsl */`
        varying vec2 vUv;
        void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
      `,
      fragmentShader: /* glsl */`
        precision highp float;
        varying vec2 vUv;
        uniform sampler2D tImage;
        uniform vec2 uTexel;
        uniform bool uEnabled;
        void main() {
          vec3 center = texture2D(tImage, vUv).rgb;
          if (!uEnabled) { gl_FragColor = vec4(center, 1.0); return; }
          vec3 nw = texture2D(tImage, vUv + vec2(-1.0, -1.0) * uTexel).rgb;
          vec3 ne = texture2D(tImage, vUv + vec2( 1.0, -1.0) * uTexel).rgb;
          vec3 sw = texture2D(tImage, vUv + vec2(-1.0,  1.0) * uTexel).rgb;
          vec3 se = texture2D(tImage, vUv + vec2( 1.0,  1.0) * uTexel).rgb;
          vec3 weights = vec3(0.299, 0.587, 0.114);
          float m = dot(center, weights), a = dot(nw, weights), b = dot(ne, weights);
          float c = dot(sw, weights), d = dot(se, weights);
          float low = min(m, min(min(a, b), min(c, d)));
          float high = max(m, max(max(a, b), max(c, d)));
          if (high - low < max(0.02, high * 0.10)) {
            gl_FragColor = vec4(center, 1.0); return;
          }
          vec2 direction = vec2(-(a + b - c - d), a + c - b - d);
          float reduce = max((a + b + c + d) * 0.03125, 0.0078125);
          direction = clamp(direction / (min(abs(direction.x), abs(direction.y)) + reduce),
            vec2(-6.0), vec2(6.0)) * uTexel;
          vec3 inner = 0.5 * (texture2D(tImage, vUv - direction / 6.0).rgb
            + texture2D(tImage, vUv + direction / 6.0).rgb);
          vec3 outer = inner * 0.5 + 0.25 * (texture2D(tImage, vUv - direction * 0.5).rgb
            + texture2D(tImage, vUv + direction * 0.5).rgb);
          float brightness = dot(outer, weights);
          gl_FragColor = vec4(brightness < low || brightness > high ? inner : outer, 1.0);
        }
      `
    });
    postScene.add(new THREE.Mesh(geometry, postMaterial));
    let target;

    function rebuildTarget() {
      if (target) target.dispose();
      const size = renderer.getDrawingBufferSize(new THREE.Vector2());
      target = new THREE.WebGLRenderTarget(size.x, size.y, {
        depthBuffer: false, stencilBuffer: false,
        minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
        samples: settings.antialiasing ? Math.min(4, renderer.capabilities.maxSamples) : 0
      });
      target.texture.generateMipmaps = false;
      postMaterial.uniforms.tImage.value = target.texture;
      postMaterial.uniforms.uTexel.value.set(1 / size.x, 1 / size.y);
      postMaterial.uniforms.uEnabled.value = settings.antialiasing;
    }

    function resize() {
      renderer.setPixelRatio(settings.pixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.getDrawingBufferSize(uniforms.uResolution.value);
      const aspect = window.innerWidth / window.innerHeight;
      camera.left = -aspect;
      camera.right = aspect;
      camera.top = 1;
      camera.bottom = -1;
      camera.updateProjectionMatrix();
      artwork.scale.set(aspect, 1, 1);
      rebuildTarget();
    }
    window.addEventListener('resize', resize, { passive: true });

    const colorUniforms = ['uNavy', 'uBlue', 'uCyan', 'uCopper', 'uGold', 'uPeach'];
    function syncColors() {
      colorUniforms.forEach((key, index) => uniforms[key].value.set(settings['color' + (index + 1)]));
      uniforms.uAccent.value.set(settings.accentColor).convertLinearToSRGB();
      uniforms.uAccentAmount.value = settings.accentAmount;
      uniforms.uColorIntensity.value = settings.saturation;
      uniforms.uInvert.value = settings.invert ? 1 : 0;
      const background = settings.greenscreen ? '#00ff00' : settings.backgroundColor;
      uniforms.uBackground.value.set(background).convertLinearToSRGB();
      uniforms.uKeyBackground.value = settings.greenscreen || settings.backgroundColor.toLowerCase() !== '#030719' ? 1 : 0;
      uniforms.uShadowCutoff.value = settings.shadowCutoff;
      // The art shader outputs display-space color into a NoColorSpace target.
      // Store the same display-space values in the clear color for exact key green.
      renderer.setClearColor(uniforms.uBackground.value, 1);
    }

    function applyPalette() {
      const palette = palettes[settings.scheme];
      for (let i = 0; i < 6; i++) settings['color' + (i + 1)] = palette.colors[Math.min(i, palette.colors.length - 1)];
      settings.backgroundColor = palette.background;
      settings.saturation = palette.saturation ?? 1;
      settings.accentColor = palette.accent ?? '#ff5934';
      settings.accentAmount = palette.amount ?? 0;
      settings.invert = false;
      syncColors();
      refreshGui();
    }

    function syncSurface() {
      uniforms.uFoldStrength.value = settings.foldStrength;
      uniforms.uLineDensity.value = settings.lineDensity;
      uniforms.uLineContrast.value = settings.lineContrast;
      uniforms.uMetallic.value = settings.metallic;
      uniforms.uHighlightIntensity.value = settings.highlights;
      uniforms.uSeamBend.value = settings.seamBend;
      uniforms.uFoldWidth.value = settings.foldWidth;
      uniforms.uValleyShift.value = settings.valleyShift;
      uniforms.uSeed.value = settings.seed;
    }

    const gui = new GUI({ title: 'Liquid / Filament', width: 300 });
    const colorsFolder = gui.addFolder('Color & background');
    colorsFolder.add(settings, 'scheme', Object.keys(palettes)).name('Color scheme').onChange(applyPalette);
    colorsFolder.add(settings, 'invert').name('Invert colors').onChange(() => {
      if (settings.scheme.startsWith('Achromatic')) settings.backgroundColor = settings.invert ? '#ffffff' : '#000000';
      syncColors();
      refreshGui();
    });
    const colorNames = ['Deep shadow', 'Blue / midtone', 'Cyan / silk', 'Copper / reflection', 'Gold / rim', 'Peach / highlight'];
    colorNames.forEach((label, i) => colorsFolder.addColor(settings, 'color' + (i + 1)).name(label).onChange(syncColors));
    colorsFolder.add(settings, 'saturation', 0, 1.8, 0.01).name('Color intensity').onChange(syncColors);
    colorsFolder.addColor(settings, 'accentColor').name('Accent color').onChange(syncColors);
    colorsFolder.add(settings, 'accentAmount', 0, 1, 0.01).name('Accent amount').onChange(syncColors);
    colorsFolder.addColor(settings, 'backgroundColor').name('Background').onChange(syncColors);
    colorsFolder.add(settings, 'greenscreen').name('Greenscreen').onChange(syncColors);
    colorsFolder.add(settings, 'shadowCutoff', 0.02, 0.3, 0.005).name('Background cutoff').onChange(syncColors);

    const motionFolder = gui.addFolder('Animation');
    motionFolder.add(settings, 'animation', animationNames).name('Animation');
    motionFolder.add(settings, 'speed', 0, 2, 0.01).name('Speed');
    motionFolder.add(settings, 'motionStrength', 0, 2, 0.01).name('Motion amount');

    const surfaceFolder = gui.addFolder('Fold & filament');
    surfaceFolder.add(settings, 'foldStrength', 0.25, 2, 0.01).name('Fold depth').onChange(syncSurface);
    surfaceFolder.add(settings, 'seamBend', 0.45, 1.65, 0.01).name('Seam curvature').onChange(syncSurface);
    surfaceFolder.add(settings, 'foldWidth', 0.45, 1.8, 0.01).name('Fold width').onChange(syncSurface);
    surfaceFolder.add(settings, 'valleyShift', -0.12, 0.12, 0.001).name('Valley position').onChange(syncSurface);
    surfaceFolder.add(settings, 'lineDensity', 70, 420, 1).name('Filament density').onChange(syncSurface);
    surfaceFolder.add(settings, 'lineContrast', 0, 1.2, 0.01).name('Filament contrast').onChange(syncSurface);
    surfaceFolder.add(settings, 'metallic', 0, 1.5, 0.01).name('Metallic rim').onChange(syncSurface);
    surfaceFolder.add(settings, 'highlights', 0.35, 1.8, 0.01).name('Highlight intensity').onChange(syncSurface);
    surfaceFolder.add(settings, 'seed', 0, 1000, 1).name('Variation seed').onChange(syncSurface);

    const viewFolder = gui.addFolder('Camera & quality');
    viewFolder.add(settings, 'zoom', 0.2, 5, 0.01).name('Zoom').listen();
    viewFolder.add(settings, 'panX', -5, 5, 0.01).name('Position X').listen();
    viewFolder.add(settings, 'panY', -5, 5, 0.01).name('Position Y').listen();
    viewFolder.add(settings, 'yaw', -65, 65, 0.1).name('Camera yaw').listen();
    viewFolder.add(settings, 'pitch', -65, 65, 0.1).name('Camera pitch').listen();
    viewFolder.add(settings, 'roll', -180, 180, 0.1).name('Rotation').listen();
    viewFolder.add(settings, 'pixelRatio', 0.5, 3, 0.05).name('Pixel ratio (DPR)').onChange(resize);
    viewFolder.add(settings, 'antialiasing').name('Anti-aliasing').onChange(rebuildTarget);
    const actions = {
      resetView() {
        Object.assign(settings, { zoom: 1, panX: 0, panY: 0, yaw: 0, pitch: 0, roll: 0 });
        refreshGui();
      },
      randomize() {
        const between = (a, b) => a + Math.random() * (b - a);
        const names = Object.keys(palettes).filter(name => name !== settings.scheme);
        settings.scheme = names[Math.floor(Math.random() * names.length)];
        applyPalette();
        Object.assign(settings, {
          seed: Math.floor(Math.random() * 1001),
          foldStrength: between(0.65, 1.4), seamBend: between(0.7, 1.3),
          foldWidth: between(0.65, 1.35), valleyShift: between(-0.075, 0.075),
          lineDensity: Math.round(between(140, 330)), lineContrast: between(0.5, 1.05),
          metallic: between(0.65, 1.2), highlights: between(0.85, 1.35),
          animation: animationNames[Math.floor(Math.random() * 7)],
          speed: between(0.35, 1.0), motionStrength: between(0.4, 1.25)
        });
        syncSurface();
        refreshGui();
      }
    };
    viewFolder.add(actions, 'resetView').name('Reset view');
    const variationFolder = gui.addFolder('Procedural variation');
    variationFolder.add(settings, 'clickRandomize').name('Randomize on click');
    variationFolder.add(actions, 'randomize').name('New variation');
    surfaceFolder.close();
    viewFolder.close();
    variationFolder.close();

    function refreshGui() { gui.controllersRecursive().forEach(controller => controller.updateDisplay()); }
    let uiVisible = true;
    window.addEventListener('keydown', event => {
      if (event.code !== 'KeyH' || event.repeat || event.ctrlKey || event.metaKey || event.altKey) return;
      if (event.target instanceof Element && event.target.closest('input, textarea, select, [contenteditable="true"]')) return;
      uiVisible = !uiVisible;
      gui.show(uiVisible);
    });

    let elapsed = 0;
    const targetPoint = new THREE.Vector3();
    function updateView() {
      const mode = animationNames.indexOf(settings.animation);
      const phase = elapsed * 2 * Math.PI / 30;
      const amount = settings.motionStrength;
      const orbit = mode === 5 ? amount : 0;
      const yaw = THREE.MathUtils.degToRad(settings.yaw) + Math.sin(phase) * 0.18 * orbit;
      const pitch = THREE.MathUtils.clamp(THREE.MathUtils.degToRad(settings.pitch)
        + (Math.cos(phase) - 1) * 0.065 * orbit, -1.3, 1.3);
      targetPoint.set(mode === 4 ? Math.sin(phase) * 0.055 * amount : 0,
        mode === 4 ? Math.sin(phase * 2) * 0.025 * amount : 0, 0);
      camera.position.set(4 * Math.sin(yaw) * Math.cos(pitch), 4 * Math.sin(pitch),
        4 * Math.cos(yaw) * Math.cos(pitch)).add(targetPoint);
      camera.lookAt(targetPoint);
      camera.zoom = settings.zoom;
      camera.updateProjectionMatrix();
      camera.updateMatrixWorld();
      artwork.position.set(settings.panX, settings.panY, 0);
      artwork.rotation.z = THREE.MathUtils.degToRad(settings.roll)
        + (mode === 6 ? Math.sin(phase) * 0.035 * amount : 0);
      artwork.updateMatrixWorld();
      uniforms.uViewTilt.value.set(Math.sin(yaw) * 0.35, Math.sin(pitch) * 0.35);
      uniforms.uMode.value = mode;
      uniforms.uMotionStrength.value = amount;
    }

    const raycaster = new THREE.Raycaster();
    const dragPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
    const pointerNdc = new THREE.Vector2();
    function scenePoint(clientX, clientY) {
      pointerNdc.set(clientX / window.innerWidth * 2 - 1, 1 - clientY / window.innerHeight * 2);
      raycaster.setFromCamera(pointerNdc, camera);
      return raycaster.ray.intersectPlane(dragPlane, new THREE.Vector3());
    }
    canvas.addEventListener('wheel', event => {
      event.preventDefault();
      const before = scenePoint(event.clientX, event.clientY);
      const delta = event.deltaY * (event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? window.innerHeight : 1);
      settings.zoom = THREE.MathUtils.clamp(settings.zoom * Math.exp(-delta * 0.001), 0.2, 5);
      updateView();
      const after = scenePoint(event.clientX, event.clientY);
      if (before && after) {
        settings.panX += after.x - before.x;
        settings.panY += after.y - before.y;
      }
      updateView();
    }, { passive: false });

    let drag = null;
    canvas.addEventListener('contextmenu', event => event.preventDefault());
    canvas.addEventListener('pointerdown', event => {
      if (drag || (event.button !== 0 && event.button !== 2)) return;
      canvas.setPointerCapture(event.pointerId);
      drag = { id: event.pointerId, x: event.clientX, y: event.clientY,
        lastX: event.clientX, lastY: event.clientY, point: scenePoint(event.clientX, event.clientY),
        orbit: event.button === 2 || event.shiftKey, moved: false, started: performance.now() };
      canvas.classList.add('dragging');
    });
    canvas.addEventListener('pointermove', event => {
      if (!drag || drag.id !== event.pointerId) return;
      if (Math.hypot(event.clientX - drag.x, event.clientY - drag.y) > 4) drag.moved = true;
      if (!drag.moved) return;
      if (drag.orbit) {
        settings.yaw = THREE.MathUtils.clamp(settings.yaw + (event.clientX - drag.lastX) * 0.16, -65, 65);
        settings.pitch = THREE.MathUtils.clamp(settings.pitch + (event.clientY - drag.lastY) * 0.16, -65, 65);
      } else {
        const point = scenePoint(event.clientX, event.clientY);
        if (point && drag.point) {
          settings.panX += point.x - drag.point.x;
          settings.panY += point.y - drag.point.y;
        }
        drag.point = point;
      }
      drag.lastX = event.clientX;
      drag.lastY = event.clientY;
      updateView();
    });
    function endDrag(event) {
      if (!drag || drag.id !== event.pointerId) return;
      const randomize = event.type === 'pointerup' && !drag.moved && !drag.orbit
        && performance.now() - drag.started < 600 && settings.clickRandomize;
      drag = null;
      canvas.classList.remove('dragging');
      if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
      if (randomize) actions.randomize();
    }
    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);
    canvas.addEventListener('lostpointercapture', endDrag);

    syncColors();
    syncSurface();
    resize();
    updateView();

    // Integrate speed rather than multiplying absolute time: editing speed,
    // pausing, or resuming never resets the phase or the user's view settings.
    let previous = performance.now();
    document.addEventListener('visibilitychange', () => { previous = performance.now(); });
    function animate(now) {
      const delta = Math.min((now - previous) / 1000, 0.1);
      previous = now;
      if (!document.hidden && settings.animation !== 'Static') elapsed = (elapsed + delta * settings.speed) % 30;
      uniforms.uTime.value = elapsed;
      uniforms.uSpeed.value = settings.speed;
      updateView();
      renderer.setRenderTarget(target);
      renderer.render(scene, camera);
      renderer.setRenderTarget(null);
      renderer.render(postScene, postCamera);
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
  </script>
</body>
</html>
