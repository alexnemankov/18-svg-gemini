<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kinetic Hexagon Matrix - 492</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #ffffff;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
      touch-action: none;
    }
    canvas:active {
      cursor: grabbing;
    }
  </style>
</head>
<body>
  <canvas></canvas>

  <script type="module">
    import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

    // 19 Preconfigured Color Schemes
    const colorSchemes = {
      'Original': {
        colors: ['#563672', '#8D3D77', '#C6427A', '#FD497F', '#FFAAA6'],
        bg: '#ffffff',
        stroke: '#ffffff'
      },
      'Monochromatic': {
        colors: ['#caf0f8', '#90e0ef', '#00b4d8', '#0077b6', '#03045e'],
        bg: '#020b14',
        stroke: '#caf0f8'
      },
      'Analogous': {
        colors: ['#ffd166', '#f77f00', '#d62828', '#ae2012', '#9b2226'],
        bg: '#140505',
        stroke: '#ffd166'
      },
      'Complementary': {
        colors: ['#06d6a0', '#118ab2', '#ffd166', '#ef476f', '#ff5400'],
        bg: '#070d12',
        stroke: '#ffffff'
      },
      'Split-complementary': {
        colors: ['#7209b7', '#f72585', '#4cc9f0', '#fee440', '#3a0ca3'],
        bg: '#0a0414',
        stroke: '#ffffff'
      },
      'Triadic': {
        colors: ['#00f5d4', '#7b2cbf', '#ff007f', '#ffbe0b', '#3a86ff'],
        bg: '#060512',
        stroke: '#ffffff'
      },
      'Tetradic': {
        colors: ['#00bbf9', '#00f5d4', '#fee440', '#f15bb5', '#9b5de5'],
        bg: '#090514',
        stroke: '#ffffff'
      },
      'Double split-complementary': {
        colors: ['#ff758f', '#ff4d6d', '#ffb703', '#2a9d8f', '#264653'],
        bg: '#0b0f14',
        stroke: '#ffffff'
      },
      'Achromatic (Black & White)': {
        colors: ['#ffffff', '#cccccc', '#888888', '#444444', '#111111'],
        bg: '#000000',
        stroke: '#ffffff'
      },
      'Achromatic + Accent (B&W + Red)': {
        colors: ['#ffffff', '#cccccc', '#ff1744', '#990000', '#222222'],
        bg: '#000000',
        stroke: '#ffffff'
      },
      'Neutral + Accent': {
        colors: ['#f4f1de', '#e07a5f', '#3d405b', '#81b29a', '#f2cc8f'],
        bg: '#181512',
        stroke: '#f4f1de'
      },
      'Palette 1 (F6AA1C, BC3908, 941B0C, F6AA1C, 220901)': {
        colors: ['#F6AA1C', '#BC3908', '#941B0C', '#F6AA1C', '#220901'],
        bg: '#220901',
        stroke: '#F6AA1C'
      },
      'Palette 2 (63D1CF, 5BC0BE, 4BAD9E, 4BAD9E, 0B132B, 000000)': {
        colors: ['#63D1CF', '#5BC0BE', '#4BAD9E', '#4BAD9E', '#0B132B'],
        bg: '#000000',
        stroke: '#63D1CF'
      },
      'Palette 3 (AA60C8, D69ADE, C9A3C6, CFB5C2, 0D001D, 120A12)': {
        colors: ['#AA60C8', '#D69ADE', '#C9A3C6', '#CFB5C2', '#0D001D'],
        bg: '#120A12',
        stroke: '#AA60C8'
      },
      'Palette 4 (FEF1BE, FFBA00, 008189, 00474D, 061210)': {
        colors: ['#FEF1BE', '#FFBA00', '#008189', '#00474D', '#061210'],
        bg: '#061210',
        stroke: '#FEF1BE'
      },
      'Palette 5 (D4FFB0, 7FFF00, 00B894, 0A3322, 05140A)': {
        colors: ['#D4FFB0', '#7FFF00', '#00B894', '#0A3322', '#05140A'],
        bg: '#05140A',
        stroke: '#D4FFB0'
      },
      'Palette 6 (FFE8CC, FF8C00, C7501A, 3D1050, 0E0618)': {
        colors: ['#FFE8CC', '#FF8C00', '#C7501A', '#3D1050', '#0E0618'],
        bg: '#0E0618',
        stroke: '#FFE8CC'
      },
      'Palette 7 (E8E0FF, B38FFF, 6A3DE8, 1A1250, 090612)': {
        colors: ['#E8E0FF', '#B38FFF', '#6A3DE8', '#1A1250', '#090612'],
        bg: '#090612',
        stroke: '#E8E0FF'
      },
      'Palette 8 (E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)': {
        colors: ['#E0FBFF', '#00F0FF', '#D40078', '#1E0A3D', '#05020F'],
        bg: '#05020F',
        stroke: '#E0FBFF'
      }
    };

    // Color utility functions
    function hexToRgb(hex) {
      if (!hex) return [0, 0, 0];
      hex = hex.replace('#', '');
      if (hex.length === 3) {
        hex = hex.split('').map(x => x + x).join('');
      }
      const num = parseInt(hex, 16);
      return [(num >> 16) & 255, (num >> 8) & 255, num & 255];
    }

    function interpolateColors(c1, c2, factor) {
      const rgb1 = hexToRgb(c1);
      const rgb2 = hexToRgb(c2);
      const r = Math.round(rgb1[0] + (rgb2[0] - rgb1[0]) * factor);
      const g = Math.round(rgb1[1] + (rgb2[1] - rgb1[1]) * factor);
      const b = Math.round(rgb1[2] + (rgb2[2] - rgb1[2]) * factor);
      return `rgb(${r}, ${g}, ${b})`;
    }

    function samplePalette(paletteArray, factor) {
      factor = ((factor % 1) + 1) % 1;
      const n = paletteArray.length;
      const pos = factor * n;
      const idx = Math.floor(pos);
      const nextIdx = (idx + 1) % n;
      const t = pos - idx;
      return interpolateColors(paletteArray[idx], paletteArray[nextIdx], t);
    }

    function adjustColorBrightness(rgbStr, factor) {
      const match = rgbStr.match(/\d+/g);
      if (!match) return rgbStr;
      let [r, g, b] = match.map(Number);
      r = Math.min(255, Math.max(0, Math.round(r * factor)));
      g = Math.min(255, Math.max(0, Math.round(g * factor)));
      b = Math.min(255, Math.max(0, Math.round(b * factor)));
      return `rgb(${r}, ${g}, ${b})`;
    }

    function invertRgbStr(rgbStr) {
      const match = rgbStr.match(/\d+/g);
      if (!match) return rgbStr;
      let [r, g, b] = match.map(Number);
      return `rgb(${255 - r}, ${255 - g}, ${255 - b})`;
    }

    // Parameters State
    const params = {
      // Color & Theme
      scheme: 'Original',
      greenscreen: false,
      bgColor: '#ffffff',
      strokeColor: '#ffffff',
      color1: '#563672',
      color2: '#8D3D77',
      color3: '#C6427A',
      color4: '#FD497F',
      color5: '#FFAAA6',
      colorMode: 'Palette Wave',
      invert: false,
      colorFreq: 1.0,
      colorSpeed: 0.2,
      fillOpacity: 0.9,
      strokeOpacity: 0.95,

      // Pan & Zoom
      zoom: 1.0,
      panX: 0,
      panY: 0,
      resetView: () => {
        params.zoom = 1.0;
        params.panX = 0;
        params.panY = 0;
        updateGuiDisplays();
      },

      // Geometry & Motion
      scale: 50,
      speed: 1.0,
      waveAmp: 100,
      tanFreq: 1.0,
      timeFreq: 0.2,
      modFreq: 0.2,
      maxAmp: 260,
      waveMode: 'Tangent x Sine',
      lineWidth: 2,
      faceShading: true,
      rotationAngle: 0,

      // Procedural Generation
      clickToRandomize: true,
      randomizeNow: () => randomizeScene()
    };

    let W = window;
    let M = Math;
    let c, C, WW, WH, CW, CH, CD, options, radian, animationId;
    let accumulatedTime = 0;
    let lastTimestamp = performance.now();
    let gui;

    const getRandomNumber = function (min, max) {
      return Math.floor(Math.random() * (max - min + 1) + min);
    };

    const getOptions = function () {
      const arr = [];
      const scale = params.scale;
      const gapY = M.cos(30 * M.PI / 180) * scale;
      const gapX = scale / 2;

      // Span a generous area around viewport for smooth pan & zoom
      const colBase = Math.floor(WW / scale);
      const rowBase = Math.floor(WH / gapY);
      const marginCols = Math.max(12, Math.floor(colBase * 0.7));
      const marginRows = Math.max(12, Math.floor(rowBase * 0.7));

      const startX = -marginCols;
      const endX = colBase + marginCols;
      const startY = -marginRows;
      const endY = rowBase + marginRows;

      for (let y = startY; y < endY; y++) {
        for (let x = startX; x < endX; x++) {
          const ny = y * gapY;
          let nx = x * scale;
          if (Math.abs(y) % 2 === 1) {
            nx += gapX;
          }

          const dx = CW - nx;
          const dy = CH - ny;
          const dist = M.sqrt(dx * dx + dy * dy) / CD * 1.5;
          const atan = M.atan2(dy, dx);
          const colorSeed = getRandomNumber(0, 4);

          arr.push([nx, ny, scale, dist, atan, colorSeed]);
        }
      }

      return arr;
    };

    function updateBackground() {
      const bg = params.greenscreen ? '#00ff00' : (params.invert ? invertColorHex(params.bgColor) : params.bgColor);
      if (c) c.style.background = bg;
      document.body.style.background = bg;
    }

    function invertColorHex(hex) {
      const [r, g, b] = hexToRgb(hex);
      return `rgb(${255 - r}, ${255 - g}, ${255 - b})`;
    }

    function applyScheme(schemeName) {
      const s = colorSchemes[schemeName];
      if (!s) return;
      params.scheme = schemeName;
      params.color1 = s.colors[0];
      params.color2 = s.colors[1];
      params.color3 = s.colors[2];
      params.color4 = s.colors[3];
      params.color5 = s.colors[4] || s.colors[0];
      params.bgColor = s.bg;
      params.strokeColor = s.stroke || '#ffffff';
      updateBackground();
      updateGuiDisplays();
    }

    function randomizeScene() {
      const schemeKeys = Object.keys(colorSchemes);
      const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      applyScheme(randomScheme);

      // Re-roll geometric and motion parameters
      params.scale = Math.floor(32 + Math.random() * 44);
      params.speed = parseFloat((0.4 + Math.random() * 1.8).toFixed(2));
      params.waveAmp = parseFloat((50 + Math.random() * 120).toFixed(1));
      params.tanFreq = parseFloat((0.5 + Math.random() * 1.3).toFixed(2));
      params.timeFreq = parseFloat((0.1 + Math.random() * 0.35).toFixed(2));
      params.lineWidth = parseFloat((1.2 + Math.random() * 2.5).toFixed(1));
      params.faceShading = Math.random() > 0.25;
      params.colorFreq = parseFloat((0.5 + Math.random() * 2.0).toFixed(2));
      params.colorSpeed = parseFloat((0.05 + Math.random() * 0.45).toFixed(2));

      const modes = ['Palette Wave', 'Height Shading', 'Palette Random'];
      params.colorMode = modes[Math.floor(Math.random() * modes.length)];

      options = getOptions();
      updateBackground();
      updateGuiDisplays();
    }

    function updateGuiDisplays() {
      if (!gui) return;
      gui.controllersRecursive().forEach(ctrl => ctrl.updateDisplay());
    }

    function initGui() {
      gui = new GUI({ title: 'Kinetic Matrix Controls' });

      // Theme & Color folder
      const fTheme = gui.addFolder('Theme & Color');
      fTheme.add(params, 'scheme', Object.keys(colorSchemes)).name('Color Scheme').onChange(applyScheme);
      fTheme.add(params, 'greenscreen').name('Greenscreen (#00ff00)').onChange(updateBackground);
      fTheme.addColor(params, 'bgColor').name('Background Color').onChange(updateBackground);
      fTheme.addColor(params, 'strokeColor').name('Stroke Color');
      fTheme.addColor(params, 'color1').name('Color 1');
      fTheme.addColor(params, 'color2').name('Color 2');
      fTheme.addColor(params, 'color3').name('Color 3');
      fTheme.addColor(params, 'color4').name('Color 4');
      fTheme.addColor(params, 'color5').name('Color 5');
      fTheme.add(params, 'colorMode', ['Palette Wave', 'Height Shading', 'Palette Random', 'Original HSL']).name('Color Mode');
      fTheme.add(params, 'invert').name('Invert Colors').onChange(updateBackground);
      fTheme.add(params, 'colorFreq', 0.1, 4.0, 0.05).name('Color Frequency');
      fTheme.add(params, 'colorSpeed', 0.0, 2.0, 0.02).name('Color Cycle Speed');
      fTheme.add(params, 'fillOpacity', 0.1, 1.0, 0.05).name('Fill Opacity');
      fTheme.add(params, 'strokeOpacity', 0.1, 1.0, 0.05).name('Stroke Opacity');

      // Transform (Pan & Zoom) folder
      const fTransform = gui.addFolder('Pan & Zoom');
      fTransform.add(params, 'zoom', 0.1, 10.0, 0.01).name('Zoom (Wheel)');
      fTransform.add(params, 'panX', -2000, 2000, 1).name('Pan X (Drag)');
      fTransform.add(params, 'panY', -2000, 2000, 1).name('Pan Y (Drag)');
      fTransform.add(params, 'resetView').name('Reset View');

      // Geometry & Dynamics folder
      const fMotion = gui.addFolder('Geometry & Dynamics');
      fMotion.add(params, 'scale', 20, 120, 1).name('Scale (Hex Radius)').onChange(() => {
        options = getOptions();
      });
      fMotion.add(params, 'speed', 0.0, 3.0, 0.05).name('Time Speed');
      fMotion.add(params, 'waveAmp', 0, 250, 1).name('Wave Amplitude');
      fMotion.add(params, 'tanFreq', 0.1, 3.0, 0.05).name('Spatial Frequency');
      fMotion.add(params, 'timeFreq', 0.02, 1.0, 0.01).name('Wave Speed');
      fMotion.add(params, 'waveMode', ['Tangent x Sine', 'Sine Wave', 'Cos x Tan', 'Ripple']).name('Wave Type');
      fMotion.add(params, 'lineWidth', 0.5, 8.0, 0.1).name('Line Width');
      fMotion.add(params, 'faceShading').name('3D Face Shading');
      fMotion.add(params, 'rotationAngle', 0, 360, 1).name('Grid Rotation (Deg)');

      // Procedural Generation folder
      const fRandom = gui.addFolder('Procedural Generation');
      fRandom.add(params, 'clickToRandomize').name('Click Scene to Randomize');
      fRandom.add(params, 'randomizeNow').name('Randomize Now');

      // Hide/Show UI with "H" key
      window.addEventListener('keydown', (e) => {
        if (['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement?.tagName)) return;
        if (e.key === 'h' || e.key === 'H' || e.code === 'KeyH') {
          if (gui._hidden) {
            gui.show();
          } else {
            gui.hide();
          }
        }
      });
    }

    function setupInteractions() {
      let isPointerDown = false;
      let startX = 0, startY = 0;
      let startPanX = 0, startPanY = 0;
      let hasDragged = false;

      c.addEventListener('pointerdown', (e) => {
        if (e.target && e.target.closest && e.target.closest('.lil-gui')) return;
        isPointerDown = true;
        hasDragged = false;
        startX = e.clientX;
        startY = e.clientY;
        startPanX = params.panX;
        startPanY = params.panY;
        try { c.setPointerCapture(e.pointerId); } catch (_) {}
      });

      c.addEventListener('pointermove', (e) => {
        if (isPointerDown) {
          const dx = e.clientX - startX;
          const dy = e.clientY - startY;
          if (Math.hypot(dx, dy) > 5) {
            hasDragged = true;
          }
          params.panX = startPanX + dx;
          params.panY = startPanY + dy;
          updateGuiDisplays();
        }
      });

      c.addEventListener('pointerup', (e) => {
        if (isPointerDown) {
          try { c.releasePointerCapture(e.pointerId); } catch (_) {}
          isPointerDown = false;
          if (!hasDragged && params.clickToRandomize) {
            randomizeScene();
          }
        }
      });

      c.addEventListener('pointercancel', () => {
        isPointerDown = false;
      });

      // Zoom with wheel centered around mouse cursor
      window.addEventListener('wheel', (e) => {
        if (e.target && e.target.closest && e.target.closest('.lil-gui')) return;
        e.preventDefault();

        const zoomFactor = e.deltaY < 0 ? 1.09 : 0.917;
        const mouseX = e.clientX;
        const mouseY = e.clientY;

        const oldZoom = params.zoom;
        const newZoom = Math.min(Math.max(oldZoom * zoomFactor, 0.1), 10.0);

        // Keep point under cursor fixed in world space
        params.panX = (mouseX - CW) - (mouseX - CW - params.panX) * (newZoom / oldZoom);
        params.panY = (mouseY - CH) - (mouseY - CH - params.panY) * (newZoom / oldZoom);
        params.zoom = newZoom;

        updateGuiDisplays();
      }, { passive: false });
    }

    // Render loop
    const render = function (timestamp) {
      const delta = (timestamp - lastTimestamp) * 0.001;
      lastTimestamp = timestamp;
      accumulatedTime += delta * params.speed;

      const currentBg = params.greenscreen ? '#00ff00' : (params.invert ? invertColorHex(params.bgColor) : params.bgColor);
      C.fillStyle = currentBg;
      C.fillRect(0, 0, WW, WH);

      const activePalette = [params.color1, params.color2, params.color3, params.color4, params.color5];
      let strokeCol = params.strokeColor;
      if (params.invert) {
        strokeCol = invertRgbStr(strokeCol.startsWith('#') ? interpolateColors(strokeCol, strokeCol, 0) : strokeCol);
      }

      C.save();

      // Pan & Zoom world transformation
      C.translate(CW + params.panX, CH + params.panY);
      C.scale(params.zoom, params.zoom);
      C.translate(-CW, -CH);

      C.lineWidth = params.lineWidth;
      const baseRot = Math.PI / 2 + (params.rotationAngle * Math.PI / 180);

      // Precalculate vertex trigonometry for regular hexagon
      const cosAngles = [];
      const sinAngles = [];
      for (let j = 0; j < 6; j++) {
        cosAngles.push(M.cos(radian * j + baseRot));
        sinAngles.push(M.sin(radian * j + baseRot));
      }

      const totalHexagons = options.length;
      for (let i = 0; i < totalHexagons; i++) {
        const hex = options[i];
        const hx = hex[0];
        const hy = hex[1];
        const r = hex[2];
        const dist = hex[3];
        const seed = hex[5];

        // Wave calculation
        let rawAmp = 0;
        const wavePhase = dist * params.tanFreq + accumulatedTime * params.timeFreq;
        const modPhase = accumulatedTime * params.modFreq;

        if (params.waveMode === 'Tangent x Sine') {
          rawAmp = M.tan(wavePhase) * (M.sin(modPhase) * params.waveAmp);
        } else if (params.waveMode === 'Sine Wave') {
          rawAmp = M.sin(wavePhase * 2.5) * (M.cos(modPhase) * params.waveAmp);
        } else if (params.waveMode === 'Cos x Tan') {
          rawAmp = M.cos(wavePhase) * (M.tan(modPhase) * params.waveAmp * 0.7);
        } else if (params.waveMode === 'Ripple') {
          rawAmp = M.sin(wavePhase * 3.0) * params.waveAmp;
        }

        const amp = M.max(-params.maxAmp, M.min(params.maxAmp, rawAmp));
        const x = hx;
        const y = hy + amp;

        // Viewport culling in screen coordinates
        const screenX = (x - CW) * params.zoom + CW + params.panX;
        const screenY = (y - CH) * params.zoom + CH + params.panY;
        const screenR = r * params.zoom * 1.5;

        if (
          screenX + screenR < 0 || screenX - screenR > WW ||
          screenY + screenR < 0 || screenY - screenR > WH
        ) {
          continue;
        }

        // Color resolution
        let baseColor;
        if (params.colorMode === 'Original HSL') {
          const hue = ((amp * 0.005 * params.colorFreq * 360 + accumulatedTime * 20) % 360 + 360) % 360;
          baseColor = `hsl(${hue}, 80%, 75%)`;
        } else if (params.colorMode === 'Height Shading') {
          const hFactor = (amp + params.maxAmp) / (params.maxAmp * 2);
          baseColor = samplePalette(activePalette, hFactor * params.colorFreq);
        } else if (params.colorMode === 'Palette Random') {
          const seedColor = activePalette[seed % activePalette.length];
          const brightnessMod = 0.8 + ((amp / params.maxAmp) * 0.35);
          baseColor = adjustColorBrightness(interpolateColors(seedColor, seedColor, 0), brightnessMod);
        } else {
          // 'Palette Wave'
          const waveColorCoord = (amp * 0.004 * params.colorFreq) + (dist * 0.15) + (accumulatedTime * params.colorSpeed);
          baseColor = samplePalette(activePalette, waveColorCoord);
        }

        if (params.invert) {
          baseColor = invertRgbStr(baseColor.startsWith('hsl') ? baseColor : interpolateColors(baseColor, baseColor, 0));
        }

        // Compute 6 vertices around rotated hexagon
        const vx = [];
        const vy = [];
        for (let j = 0; j < 6; j++) {
          vx.push(x + cosAngles[j] * r);
          vy.push(y + sinAngles[j] * r);
        }

        C.globalAlpha = params.fillOpacity;

        if (params.faceShading) {
          // Top Face diamond: center -> v2 -> v3 -> v4 -> center
          C.fillStyle = adjustColorBrightness(baseColor, 1.18);
          C.beginPath();
          C.moveTo(x, y);
          C.lineTo(vx[2], vy[2]);
          C.lineTo(vx[3], vy[3]);
          C.lineTo(vx[4], vy[4]);
          C.closePath();
          C.fill();

          // Right Face diamond: center -> v4 -> v5 -> v0 -> center
          C.fillStyle = adjustColorBrightness(baseColor, 0.82);
          C.beginPath();
          C.moveTo(x, y);
          C.lineTo(vx[4], vy[4]);
          C.lineTo(vx[5], vy[5]);
          C.lineTo(vx[0], vy[0]);
          C.closePath();
          C.fill();

          // Left Face diamond: center -> v0 -> v1 -> v2 -> center
          C.fillStyle = adjustColorBrightness(baseColor, 0.68);
          C.beginPath();
          C.moveTo(x, y);
          C.lineTo(vx[0], vy[0]);
          C.lineTo(vx[1], vy[1]);
          C.lineTo(vx[2], vy[2]);
          C.closePath();
          C.fill();
        } else {
          // Solid hexagon fill
          C.fillStyle = baseColor;
          C.beginPath();
          C.moveTo(vx[0], vy[0]);
          for (let j = 1; j < 6; j++) {
            C.lineTo(vx[j], vy[j]);
          }
          C.closePath();
          C.fill();
        }

        // Draw wireframe strokes & 3 isometric center spokes
        C.globalAlpha = params.strokeOpacity;
        C.strokeStyle = strokeCol;

        C.beginPath();
        C.moveTo(vx[0], vy[0]);
        for (let j = 1; j < 6; j++) {
          C.lineTo(vx[j], vy[j]);
        }
        C.closePath();
        C.stroke();

        // 3 internal isometric seams radiating to center
        C.beginPath();
        C.moveTo(vx[0], vy[0]);
        C.lineTo(x, y);
        C.moveTo(vx[2], vy[2]);
        C.lineTo(x, y);
        C.moveTo(vx[4], vy[4]);
        C.lineTo(x, y);
        C.stroke();
      }

      C.restore();
      animationId = requestAnimationFrame(render);
    };

    function initialize() {
      c = document.querySelector('canvas');
      C = c.getContext('2d');
      WW = c.width = window.innerWidth;
      WH = c.height = window.innerHeight;
      CW = WW / 2;
      CH = WH / 2;
      CD = M.sqrt(WW * WW + WH * WH) / 2;
      radian = (Math.PI * 2) / 6;
      options = getOptions();
      updateBackground();
    }

    window.addEventListener('DOMContentLoaded', () => {
      initialize();
      initGui();
      setupInteractions();
      lastTimestamp = performance.now();
      animationId = requestAnimationFrame(render);

      window.addEventListener('resize', () => {
        cancelAnimationFrame(animationId);
        initialize();
        lastTimestamp = performance.now();
        animationId = requestAnimationFrame(render);
      });
    });
  </script>
</body>
</html>
