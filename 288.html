<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Core Log Bore</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: #0a0705;
            user-select: none;
            -webkit-user-select: none;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: grab;
        }

        canvas:active {
            cursor: grabbing;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #d4a373;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            letter-spacing: 2px;
            pointer-events: none;
            z-index: 10;
        }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
                "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
            }
        }
    </script>
</head>
<body>
    <div id="loading">DRILLING CORE LOG BOREHOLE...</div>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
        import GUI from 'lil-gui';

        // 18 Preconfigured Color Palettes
        const COLOR_SCHEMES = {
            'Sediment Core (Ochre & Clay)': {
                c1: '#c68642',
                c2: '#7a847b',
                c3: '#2b1d0f',
                c4: '#9e381a',
                bg: '#0a0705'
            },
            'Monochromatic': {
                c1: '#8e9aaf',
                c2: '#cbc0d3',
                c3: '#4a5568',
                c4: '#2d3748',
                bg: '#0b0d11'
            },
            'Analogous': {
                c1: '#f59e0b',
                c2: '#d97706',
                c3: '#b45309',
                c4: '#78350f',
                bg: '#120904'
            },
            'Complementary': {
                c1: '#00b4d8',
                c2: '#e07a5f',
                c3: '#0077b6',
                c4: '#d95d39',
                bg: '#040d14'
            },
            'Split-complementary': {
                c1: '#10b981',
                c2: '#f59e0b',
                c3: '#e11d48',
                c4: '#047857',
                bg: '#07130e'
            },
            'Triadic': {
                c1: '#3b82f6',
                c2: '#eab308',
                c3: '#ef4444',
                c4: '#1d4ed8',
                bg: '#070a14'
            },
            'Tetradic': {
                c1: '#059669',
                c2: '#d97706',
                c3: '#dc2626',
                c4: '#7c3aed',
                bg: '#0a0612'
            },
            'Double split-complementary': {
                c1: '#06b6d4',
                c2: '#f97316',
                c3: '#a855f7',
                c4: '#eab308',
                bg: '#090714'
            },
            'Achromatic Dark (Black & White)': {
                c1: '#ffffff',
                c2: '#c0c0c0',
                c3: '#707070',
                c4: '#303030',
                bg: '#050505'
            },
            'Achromatic Light (White & Black)': {
                c1: '#1a1a1a',
                c2: '#404040',
                c3: '#757575',
                c4: '#b8b8b8',
                bg: '#f0f0f0'
            },
            'Neutral + Accent': {
                c1: '#ffb703',
                c2: '#8d99ae',
                c3: '#4a5568',
                c4: '#2b2d42',
                bg: '#0b0c10'
            },
            'Palette 1 (F6AA1C, BC3908, 941B0C, 220901)': {
                c1: '#f6aa1c',
                c2: '#bc3908',
                c3: '#941b0c',
                c4: '#f6aa1c',
                bg: '#220901'
            },
            'Palette 2 (63D1CF, 5BC0BE, 4BAD9E, 0B132B)': {
                c1: '#63d1cf',
                c2: '#5bc0be',
                c3: '#4bad9e',
                c4: '#4bad9e',
                bg: '#0b132b'
            },
            'Palette 3 (AA60C8, D69ADE, C9A3C6, CFB5C2, 0D001D)': {
                c1: '#aa60c8',
                c2: '#d69ade',
                c3: '#c9a3c6',
                c4: '#cfb5c2',
                bg: '#0d001d'
            },
            'Palette 4 (FEF1BE, FFBA00, 008189, 00474D, 061210)': {
                c1: '#fef1be',
                c2: '#ffba00',
                c3: '#008189',
                c4: '#00474d',
                bg: '#061210'
            },
            'Palette 5 (D4FFB0, 7FFF00, 00B894, 0A3322, 05140A)': {
                c1: '#d4ffb0',
                c2: '#7fff00',
                c3: '#00b894',
                c4: '#0a3322',
                bg: '#05140a'
            },
            'Palette 6 (FFE8CC, FF8C00, C7501A, 3D1050, 0E0618)': {
                c1: '#ffe8cc',
                c2: '#ff8c00',
                c3: '#c7501a',
                c4: '#3d1050',
                bg: '#0e0618'
            },
            'Palette 7 (E8E0FF, B38FFF, 6A3DE8, 1A1250, 090612)': {
                c1: '#e8e0ff',
                c2: '#b38fff',
                c3: '#6a3de8',
                c4: '#1a1250',
                bg: '#090612'
            },
            'Palette 8 (E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)': {
                c1: '#e0fbff',
                c2: '#00f0ff',
                c3: '#d40078',
                c4: '#1e0a3d',
                bg: '#05020f'
            }
        };

        const SETTINGS = {
            // Presets
            colorScheme: 'Sediment Core (Ochre & Clay)',
            animation: 'Slow Bore Drill (Continuous Rotation)',
            randomizeOnClick: true,

            // Core Geometry & Sediment Strata
            curveSoftness: 7.2,
            curveWidth: 0.34,
            curveDepth: 0.95,
            height: 1.35,
            fov: 105.0,
            lineDensity: 1.15,
            compaction: 1.0,
            speckleScale: 1.0,
            cutFaceSheen: 1.25,
            particleSize: 11.0,
            wallTilt: 0.0,

            // Motion
            speed: 4.5,
            cameraSpinSpeed: 0.35,
            cameraY: 0.0,

            // Transform & Zoom
            zoom: 1.0,
            objectX: 0.0,
            objectY: 0.0,

            // Post Processing & Rendering
            bloomStrength: 0.38,
            bloomRadius: 0.95,
            chromaticAberration: 0.0075,
            edgeBlurStrength: 0.012,
            dpr: Math.min(window.devicePixelRatio || 1, 2.0),

            // Colors
            greenScreen: false,
            greenScreenColor: '#00ff00',
            color1: COLOR_SCHEMES['Sediment Core (Ochre & Clay)'].c1,
            color2: COLOR_SCHEMES['Sediment Core (Ochre & Clay)'].c2,
            color3: COLOR_SCHEMES['Sediment Core (Ochre & Clay)'].c3,
            color4: COLOR_SCHEMES['Sediment Core (Ochre & Clay)'].c4,
            bgColor: COLOR_SCHEMES['Sediment Core (Ochre & Clay)'].bg
        };

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(SETTINGS.bgColor, 0.0025);
        scene.background = new THREE.Color(SETTINGS.bgColor);

        const camera = new THREE.PerspectiveCamera(SETTINGS.fov, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, SETTINGS.cameraY, 0);

        const renderer = new THREE.WebGLRenderer({
            antialias: true,
            powerPreference: 'high-performance',
            preserveDrawingBuffer: false
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(SETTINGS.dpr);
        document.body.appendChild(renderer.domElement);

        // Hide loading
        const loadingEl = document.getElementById('loading');
        if (loadingEl) loadingEl.style.display = 'none';

        // 1024x1024 Procedural Mineral Speckle & Micro-Crystalline Matrix Texture
        const canvasTexture = document.createElement('canvas');
        canvasTexture.width = 1024;
        canvasTexture.height = 1024;
        const ctx = canvasTexture.getContext('2d');

        ctx.fillStyle = '#0a0a0a';
        ctx.fillRect(0, 0, 1024, 1024);

        const imgData = ctx.getImageData(0, 0, 1024, 1024);
        const data = imgData.data;

        for (let y = 0; y < 1024; y++) {
            for (let x = 0; x < 1024; x++) {
                const idx = (y * 1024 + x) * 4;

                const r1 = Math.random();
                const r2 = Math.random();

                // Coarse sand and quartz granules
                const cellX = (x % 32) - 16;
                const cellY = (y % 32) - 16;
                const cellDist = Math.sqrt(cellX * cellX + cellY * cellY);
                const granule = Math.max(0, 1.0 - cellDist / 14.0) * (Math.random() > 0.45 ? 1.0 : 0.0);

                // Fine silt matrix
                const silt = (r1 * 0.7 + r2 * 0.3);

                // Mica / pyrite sparkle crystal flecks
                const mica = (Math.random() > 0.982) ? Math.pow(Math.random(), 2.5) * 255 : 0;

                // Micro-sediment lamination
                const microBand = Math.sin(y * 0.35) * 0.12 + Math.sin(y * 1.1) * 0.08;

                const rVal = Math.min(255, Math.max(0, Math.floor((silt * 0.55 + granule * 0.35 + microBand) * 255)));
                const gVal = Math.min(255, Math.max(0, Math.floor(mica)));
                const bVal = Math.min(255, Math.max(0, Math.floor((granule * 0.7 + silt * 0.3) * 255)));

                data[idx] = rVal;
                data[idx + 1] = gVal;
                data[idx + 2] = bVal;
                data[idx + 3] = 255;
            }
        }
        ctx.putImageData(imgData, 0, 0);

        const dataTexture = new THREE.CanvasTexture(canvasTexture);
        dataTexture.wrapS = THREE.RepeatWrapping;
        dataTexture.wrapT = THREE.RepeatWrapping;
        dataTexture.minFilter = THREE.LinearMipmapLinearFilter;
        dataTexture.magFilter = THREE.LinearFilter;
        dataTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();

        const tunnelGroup = new THREE.Group();
        scene.add(tunnelGroup);

        // Core Borehole Vertex Shader
        const wallVertexShader = `
            varying vec2 vUv;
            varying vec3 vPosition;
            varying vec3 vWorldPosition;
            varying vec3 vNormal;
            uniform float uCurveSoftness;

            void main() {
                vUv = uv;
                vec3 pos = position;

                float angle = atan(pos.z, pos.x);
                float normX = cos(angle);
                float n = uCurveSoftness;

                // Core cylindrical superellipse cross-section
                float absZ = pow(max(0.00001, 1.0 - pow(abs(normX), n)), 1.0 / n) * 100.0;
                pos.z = sign(sin(angle)) * absZ;

                vPosition = pos;
                vec4 worldPos = modelMatrix * vec4(pos, 1.0);
                vWorldPosition = worldPos.xyz;
                vNormal = normalize(normalMatrix * normal);
                gl_Position = projectionMatrix * viewMatrix * worldPos;
            }
        `;

        // Core Log Sediment Fragment Shader
        const wallFragmentShader = `
            varying vec2 vUv;
            varying vec3 vPosition;
            varying vec3 vWorldPosition;
            varying vec3 vNormal;

            uniform float uTime;
            uniform float uSpeed;
            uniform float uLineDensity;
            uniform float uCompaction;
            uniform float uSpeckleScale;
            uniform float uSheenStrength;
            uniform vec3 uColor1;
            uniform vec3 uColor2;
            uniform vec3 uColor3;
            uniform vec3 uColor4;
            uniform vec3 uBgColor;
            uniform sampler2D uDataTexture;

            float hash11(float p) {
                p = fract(p * 0.1031);
                p *= p + 33.33;
                p *= p + p;
                return fract(p);
            }

            float hash12(vec2 p) {
                vec3 p3  = fract(vec3(p.xyx) * 0.1031);
                p3 += dot(p3, p3.yzx + 33.33);
                return fract((p3.x + p3.y) * p3.z);
            }

            float noise1D(float x) {
                float i = floor(x);
                float f = fract(x);
                float u = f * f * (3.0 - 2.0 * f);
                return mix(hash11(i), hash11(i + 1.0), u);
            }

            float noise2D(vec2 st) {
                vec2 i = floor(st);
                vec2 f = fract(st);
                float a = hash12(i);
                float b = hash12(i + vec2(1.0, 0.0));
                float c = hash12(i + vec2(0.0, 1.0));
                float d = hash12(i + vec2(1.0, 1.0));
                vec2 u = f * f * (3.0 - 2.0 * f);
                return mix(a, b, u.x) + (c - a) * u.y * (1.0 - u.x) + (d - b) * u.x * u.y;
            }

            // Assign distinct geological sediment colors with subtle natural variance
            vec3 getSedimentColor(float id) {
                float r = hash11(id * 17.13 + 5.71);
                vec3 c;
                if (r < 0.25) {
                    c = mix(uColor1, uColor2, hash11(id * 31.7));
                } else if (r < 0.5) {
                    c = mix(uColor2, uColor3, hash11(id * 43.1));
                } else if (r < 0.75) {
                    c = mix(uColor3, uColor4, hash11(id * 29.3));
                } else {
                    c = mix(uColor4, uColor1, hash11(id * 83.9));
                }
                float toneVar = (hash11(id * 9.17) - 0.5) * 0.12;
                return clamp(c + vec3(toneVar), 0.0, 1.0);
            }

            vec3 getStratumLayer(vec3 pos, float trackCount, float speedBase, float seed) {
                // Reinterpret y-axis as depth and apply slow 1D noise for uneven compaction
                float depthRaw = pos.y + 40.0;
                float slowCompactionNoise = (noise1D(depthRaw * 0.08 * (trackCount / 30.0) + seed * 1.5) - 0.5) * 7.5
                                          + (noise1D(depthRaw * 0.025 + seed * 0.7) - 0.5) * 14.0;
                float compactedY = pos.y + slowCompactionNoise * uCompaction;

                float trackHeight = 80.0 / trackCount;
                float trackCoord = (compactedY + 40.0) / trackHeight;
                float trackId = floor(trackCoord);
                float localY = fract(trackCoord);

                float trackActive = hash12(vec2(trackId, seed));
                if (trackActive > 0.42) return vec3(0.0);

                // Barrel rotation angle
                float angle = atan(pos.z, pos.x);
                float barrelAngle = angle + uTime * uSpeed * 0.015 * speedBase * mix(0.6, 1.8, hash12(vec2(trackId, seed + 2.0)));

                // Stratum thickness and subtle cross-bedding undulation
                float thicknessNorm = mix(0.4, 0.95, hash12(vec2(trackId, seed + 1.0)));
                float undulation = sin(barrelAngle * 2.0 + hash11(trackId + seed) * 6.28) * 0.08;
                float distFromCenter = abs(localY - 0.5) * 2.0;
                distFromCenter = clamp(distFromCenter + undulation, 0.0, 1.0);

                float aa = 0.04;
                float profile = smoothstep(thicknessNorm + aa, thicknessNorm - aa, distFromCenter);
                if (profile <= 0.0) return vec3(0.0);

                // Sample texture at high frequency scaled by trackId for mineral speckle & crystal sparkle
                float grainFreqU = mix(24.0, 64.0, hash11(trackId * 11.3 + seed)) * uSpeckleScale;
                float grainFreqV = mix(16.0, 48.0, hash11(trackId * 7.7 + seed)) * uSpeckleScale;
                float normAngle = (barrelAngle + 3.14159265) / 6.2831853;
                vec2 speckleUv = vec2(normAngle * grainFreqU, (compactedY * 0.12) * grainFreqV);

                vec4 speckleSample = texture2D(uDataTexture, speckleUv);
                float mineralSpeckle = speckleSample.r;
                float crystalSparkle = pow(speckleSample.g, 2.5) * mix(1.0, 3.2, hash11(trackId + seed * 3.0));
                float speckleBoost = mix(0.65, 1.85, mineralSpeckle) + crystalSparkle * 0.7;

                // Color blending across boundaries (smooth sediment facies transition)
                vec3 currentColor = getSedimentColor(trackId + seed);
                float neighborId = localY > 0.5 ? (trackId + 1.0) : (trackId - 1.0);
                vec3 neighborColor = getSedimentColor(neighborId + seed);

                float boundaryDist = localY > 0.5 ? (1.0 - localY) : localY;
                float blendWidth = mix(0.12, 0.38, hash12(vec2(trackId, seed + 5.0)));
                float blendFactor = smoothstep(0.0, blendWidth, boundaryDist);
                vec3 blendedStratumColor = mix(neighborColor, currentColor, blendFactor);

                // Micro-laminations within the stratum
                float lamination = sin(localY * 3.14159265 * mix(2.0, 6.0, hash11(trackId * 3.1 + seed))) * 0.12;
                float core = smoothstep(thicknessNorm * 0.55, 0.0, distFromCenter);

                vec3 finalColor = blendedStratumColor * profile * 1.6 * speckleBoost * (1.0 + lamination)
                                + vec3(core * 0.5 * speckleBoost);

                return finalColor;
            }

            vec3 getCompositeCore(vec3 pos, float isReflection) {
                vec3 color = vec3(0.0);

                float angle = atan(pos.z, pos.x);
                float bgAngle = angle + uTime * uSpeed * 0.015 * 0.75;
                float normAngle = (bgAngle + 3.14159265) / 6.2831853;

                // Geological background formation matrix
                vec2 bgUv = vec2(normAngle * 48.0 * uSpeckleScale, pos.y * 0.12 * uSpeckleScale);
                vec4 bgSample = texture2D(uDataTexture, bgUv);
                float bgMask = smoothstep(0.2, 0.85, bgSample.r);

                float colId = floor(normAngle * 48.0 * 24.0);
                float rowId = floor(pos.y * 0.12 * 24.0);

                float bgVisibility = step(0.35, hash12(vec2(colId, 77.7)));
                bgVisibility *= step(0.12, hash12(vec2(colId, rowId)));

                float shimmerSpeed = mix(0.8, 4.0, hash12(vec2(colId, rowId + 1.0)));
                float shimmer = sin(uTime * shimmerSpeed + hash12(vec2(colId, rowId + 2.0)) * 6.283);
                float shimmerVis = mix(0.25, 1.0, smoothstep(-0.4, 0.4, shimmer));
                bgVisibility *= shimmerVis;

                vec3 baseFormationColor = mix(uColor4, uColor1, hash12(vec2(colId, 33.3)));
                color += baseFormationColor * bgMask * bgVisibility * 1.5;

                // Primary geological strata, intermediate beds, and fine laminations
                color += getStratumLayer(pos, 28.0 * uLineDensity, 1.0, 11.0);
                color += getStratumLayer(pos, 64.0 * uLineDensity, 1.4, 22.0);
                color += getStratumLayer(pos, 140.0 * uLineDensity, 2.2, 33.0);

                if (isReflection == 1.0) {
                    float fade = smoothstep(-35.0, -12.0, pos.y);
                    color *= 0.45 * fade;
                } else {
                    float fade = smoothstep(40.0, 18.0, pos.y);
                    color *= fade;
                }

                return color;
            }

            void main() {
                vec3 color = uBgColor;
                float floorLevel = -12.0;

                if (vPosition.y > floorLevel) {
                    color += getCompositeCore(vPosition, 0.0);
                } else {
                    vec3 reflectedPos = vPosition;
                    reflectedPos.y = floorLevel + (floorLevel - vPosition.y);
                    color += getCompositeCore(reflectedPos, 1.0);
                    color += mix(uBgColor, uColor4, 0.15) * 0.2;
                }

                // Repurposed horizonGlow: Faint specular sheen along the "cut face" / longitudinal split of the core
                float angle = atan(vPosition.z, vPosition.x);
                float barrelAngle = angle + uTime * uSpeed * 0.015;
                
                // Polished cut face sheen & moisture reflection on core boundary
                float cutFaceSheen = pow(abs(cos(barrelAngle)), 6.0) * 0.45
                                   + smoothstep(0.85, 1.0, sin(barrelAngle * 2.0 + 1.57)) * 0.3;
                
                float cutLine = smoothstep(0.9, 0.0, abs(vPosition.y - floorLevel));
                vec3 sheenHighlight = mix(uColor1, vec3(1.0, 0.96, 0.90), 0.55);
                color += sheenHighlight * (cutLine * 0.65 + cutFaceSheen * 0.35) * uSheenStrength;

                gl_FragColor = vec4(color, 1.0);
            }
        `;

        const uniforms = {
            uTime: { value: 0.0 },
            uSpeed: { value: SETTINGS.speed },
            uLineDensity: { value: SETTINGS.lineDensity },
            uCompaction: { value: SETTINGS.compaction },
            uSpeckleScale: { value: SETTINGS.speckleScale },
            uSheenStrength: { value: SETTINGS.cutFaceSheen },
            uCurveSoftness: { value: SETTINGS.curveSoftness },
            uColor1: { value: new THREE.Color(SETTINGS.color1) },
            uColor2: { value: new THREE.Color(SETTINGS.color2) },
            uColor3: { value: new THREE.Color(SETTINGS.color3) },
            uColor4: { value: new THREE.Color(SETTINGS.color4) },
            uBgColor: { value: new THREE.Color(SETTINGS.bgColor) },
            uDataTexture: { value: dataTexture }
        };

        const material = new THREE.ShaderMaterial({
            vertexShader: wallVertexShader,
            fragmentShader: wallFragmentShader,
            uniforms: uniforms,
            side: THREE.BackSide,
            transparent: false
        });

        const geometry = new THREE.CylinderGeometry(100, 100, 80, 128, 1, true);
        const wall = new THREE.Mesh(geometry, material);
        tunnelGroup.add(wall);

        // Suspended Mineral Crystal Flakes & Quartz Dust Particles
        const particleCount = 2200;
        const particleGeometry = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        const particleSpeeds = new Float32Array(particleCount);

        for (let i = 0; i < particleCount; i++) {
            const angle = Math.random() * Math.PI * 2;
            const radius = 98.5 + Math.random() * 1.2;
            const y = -11.0 + Math.random() * 48.0;

            particlePositions[i * 3] = Math.cos(angle) * radius;
            particlePositions[i * 3 + 1] = y;
            particlePositions[i * 3 + 2] = Math.sin(angle) * radius;
            particleSpeeds[i] = 0.4 + Math.random() * 2.2;
        }

        particleGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        particleGeometry.setAttribute('aSpeed', new THREE.BufferAttribute(particleSpeeds, 1));

        const particleUniforms = {
            uTime: { value: 0 },
            uSpeed: { value: SETTINGS.speed },
            uCurveSoftness: { value: SETTINGS.curveSoftness },
            uParticleSize: { value: SETTINGS.particleSize },
            uColor1: { value: new THREE.Color(SETTINGS.color1) },
            uColor2: { value: new THREE.Color(SETTINGS.color2) }
        };

        const particleMaterial = new THREE.ShaderMaterial({
            uniforms: particleUniforms,
            vertexShader: `
                uniform float uTime;
                uniform float uSpeed;
                uniform float uCurveSoftness;
                uniform float uParticleSize;
                attribute float aSpeed;
                varying float vAlpha;
                varying float vSpeed;

                void main() {
                    vec3 pos = position;
                    vSpeed = aSpeed;

                    float angle = atan(pos.z, pos.x);
                    float radius = length(pos.xz);
                    float currentAngle = angle - uTime * uSpeed * 0.015 * aSpeed;

                    float normX = cos(currentAngle);
                    float n = uCurveSoftness;
                    float absZ = pow(max(0.00001, 1.0 - pow(abs(normX), n)), 1.0 / n) * radius;

                    pos.x = cos(currentAngle) * radius;
                    pos.z = sign(sin(currentAngle)) * absZ;

                    vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                    gl_PointSize = (11.0 * uParticleSize / -mvPosition.z);
                    gl_Position = projectionMatrix * mvPosition;

                    vAlpha = smoothstep(38.0, 24.0, pos.y) * smoothstep(-12.0, -5.0, pos.y);
                }
            `,
            fragmentShader: `
                uniform vec3 uColor1;
                uniform vec3 uColor2;
                varying float vAlpha;
                varying float vSpeed;

                void main() {
                    vec2 xy = gl_PointCoord.xy - vec2(0.5);
                    float ll = length(xy);
                    if (ll > 0.5) discard;

                    float glow = 1.0 - (ll * 2.0);
                    vec3 pColor = mix(uColor1, uColor2, fract(vSpeed * 3.7));
                    pColor = mix(pColor, vec3(1.0, 0.98, 0.92), 0.5);

                    gl_FragColor = vec4(pColor, vAlpha * glow * 0.9);
                }
            `,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const particles = new THREE.Points(particleGeometry, particleMaterial);
        tunnelGroup.add(particles);

        // Transform updates
        const updateObjectTransform = () => {
            tunnelGroup.position.x = SETTINGS.objectX;
            tunnelGroup.position.y = SETTINGS.objectY;
            tunnelGroup.scale.set(
                SETTINGS.curveWidth * SETTINGS.zoom,
                SETTINGS.height * SETTINGS.zoom,
                SETTINGS.curveDepth * SETTINGS.zoom
            );
            tunnelGroup.rotation.z = SETTINGS.wallTilt * Math.PI / 180;
        };

        const updateBackground = () => {
            const activeBg = SETTINGS.greenScreen ? SETTINGS.greenScreenColor : SETTINGS.bgColor;
            uniforms.uBgColor.value.set(activeBg);
            scene.background.set(activeBg);
            scene.fog.color.set(activeBg);
            document.body.style.backgroundColor = activeBg;
        };

        const updateColors = () => {
            uniforms.uColor1.value.set(SETTINGS.color1);
            uniforms.uColor2.value.set(SETTINGS.color2);
            uniforms.uColor3.value.set(SETTINGS.color3);
            uniforms.uColor4.value.set(SETTINGS.color4);
            particleUniforms.uColor1.value.set(SETTINGS.color1);
            particleUniforms.uColor2.value.set(SETTINGS.color2);
            updateBackground();
        };

        const applyColorScheme = (schemeKey) => {
            const scheme = COLOR_SCHEMES[schemeKey];
            if (!scheme) return;
            SETTINGS.color1 = scheme.c1;
            SETTINGS.color2 = scheme.c2;
            SETTINGS.color3 = scheme.c3;
            SETTINGS.color4 = scheme.c4;
            SETTINGS.bgColor = scheme.bg;
            updateColors();
            gui.controllersRecursive().forEach(controller => {
                if (['color1', 'color2', 'color3', 'color4', 'bgColor'].includes(controller.property)) {
                    controller.updateDisplay();
                }
            });
        };

        // Post-Processing Pipeline
        const composer = new EffectComposer(renderer);
        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);

        const PeripheralBlurShader = {
            uniforms: {
                tDiffuse: { value: null },
                uStrength: { value: SETTINGS.edgeBlurStrength },
                uAspect: { value: window.innerWidth / window.innerHeight }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D tDiffuse;
                uniform float uStrength;
                uniform float uAspect;
                varying vec2 vUv;

                void main() {
                    vec2 center = vec2(0.5, 0.5);
                    vec2 uvCorrection = vec2(uAspect, 1.0);
                    float dist = length((vUv - center) * uvCorrection);

                    float blurMask = smoothstep(0.15, 0.72, dist);
                    if (blurMask <= 0.0 || uStrength <= 0.0) {
                        gl_FragColor = texture2D(tDiffuse, vUv);
                        return;
                    }

                    const int SAMPLES = 32;
                    const float GOLDEN_ANGLE = 2.39996323;
                    vec4 color = vec4(0.0);
                    float radius = uStrength * blurMask;

                    for (int i = 0; i < SAMPLES; i++) {
                        float r = sqrt(float(i) + 0.5) / sqrt(float(SAMPLES));
                        float theta = float(i) * GOLDEN_ANGLE;
                        vec2 offset = vec2(cos(theta), sin(theta)) * r * radius;
                        offset.x /= uAspect;
                        color += texture2D(tDiffuse, vUv + offset);
                    }
                    gl_FragColor = color / float(SAMPLES);
                }
            `
        };
        const peripheralBlurPass = new ShaderPass(PeripheralBlurShader);
        composer.addPass(peripheralBlurPass);

        const ChromaticAberrationShader = {
            uniforms: {
                tDiffuse: { value: null },
                uAmount: { value: SETTINGS.chromaticAberration }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D tDiffuse;
                uniform float uAmount;
                varying vec2 vUv;

                void main() {
                    if (uAmount <= 0.0) {
                        gl_FragColor = texture2D(tDiffuse, vUv);
                        return;
                    }
                    vec2 offset = uAmount * (vec2(0.5) - vUv);
                    vec4 cr = texture2D(tDiffuse, vUv + offset);
                    vec4 cga = texture2D(tDiffuse, vUv);
                    vec4 cb = texture2D(tDiffuse, vUv - offset);
                    gl_FragColor = vec4(cr.r, cga.g, cb.b, cga.a);
                }
            `
        };
        const caPass = new ShaderPass(ChromaticAberrationShader);
        composer.addPass(caPass);

        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            SETTINGS.bloomStrength,
            SETTINGS.bloomRadius,
            0.12
        );
        composer.addPass(bloomPass);

        // 8 Preconfigured Geological & Inspection Animations
        const ANIMATION_MODES = {
            'Static (Inspection)': (t) => {
                camera.position.x = 0;
                camera.position.y = SETTINGS.cameraY;
                camera.position.z = 0;
                camera.rotation.set(0, 0, 0);
            },
            'Slow Bore Drill (Continuous Rotation)': (t) => {
                camera.position.x = 0;
                camera.position.y = SETTINGS.cameraY;
                camera.position.z = 0;
                camera.rotation.y = t * SETTINGS.cameraSpinSpeed;
                camera.rotation.x = 0;
                camera.rotation.z = 0;
            },
            'Stratum Scan (Vertical Traverse)': (t) => {
                const scan = Math.sin(t * 0.45) * 5.5;
                camera.position.x = Math.sin(t * 0.2) * 1.2;
                camera.position.y = SETTINGS.cameraY + scan;
                camera.position.z = 0;
                camera.rotation.y = Math.sin(t * 0.3) * 0.18;
                camera.rotation.x = Math.cos(t * 0.45) * 0.05;
                camera.rotation.z = 0;
            },
            'Core Turntable (Orbit Inspection)': (t) => {
                camera.position.x = 0;
                camera.position.y = SETTINGS.cameraY;
                camera.position.z = 0;
                camera.rotation.y = t * 0.28;
                camera.rotation.x = Math.sin(t * 0.2) * 0.04;
                camera.rotation.z = 0;
            },
            'Borehole Descent (Deep Dive)': (t) => {
                const descent = Math.sin(t * 0.35) * 6.5;
                camera.position.x = Math.sin(t * 0.25) * 1.5;
                camera.position.y = SETTINGS.cameraY - descent;
                camera.position.z = 0;
                camera.rotation.y = t * 0.22;
                camera.rotation.x = 0.05;
                camera.rotation.z = Math.sin(t * 0.3) * 0.03;
            },
            'Compaction Wave (Breathing Drift)': (t) => {
                camera.position.x = Math.sin(t * 0.3) * 2.2;
                camera.position.y = SETTINGS.cameraY + Math.sin(t * 0.65) * 2.8;
                camera.position.z = 0;
                camera.rotation.y = Math.sin(t * 0.25) * 0.35;
                camera.rotation.x = Math.cos(t * 0.3) * 0.06;
                camera.rotation.z = Math.sin(t * 0.4) * 0.04;
            },
            'Surveyor Sweep (Figure-8 Pan)': (t) => {
                camera.position.x = Math.sin(t * 0.35) * 3.2;
                camera.position.y = SETTINGS.cameraY + Math.sin(t * 0.7) * 2.6;
                camera.position.z = 0;
                camera.rotation.y = Math.sin(t * 0.35) * 0.32;
                camera.rotation.x = Math.cos(t * 0.35) * 0.07;
                camera.rotation.z = Math.sin(t * 0.18) * 0.04;
            },
            'Geological Tremor (Micro Oscillations)': (t) => {
                const n1 = Math.sin(t * 1.9) * 0.35 + Math.sin(t * 3.7) * 0.15;
                const n2 = Math.cos(t * 1.4) * 0.35 + Math.cos(t * 2.8) * 0.15;
                camera.position.x = n1;
                camera.position.y = SETTINGS.cameraY + n2 * 0.8;
                camera.position.z = 0;
                camera.rotation.y = t * 0.12 + Math.sin(t * 1.2) * 0.06;
                camera.rotation.x = Math.sin(t * 2.5) * 0.03;
                camera.rotation.z = Math.cos(t * 2.1) * 0.02;
            }
        };

        // Procedural Variation Generator
        const randomizeScene = () => {
            const schemeKeys = Object.keys(COLOR_SCHEMES);
            const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
            SETTINGS.colorScheme = randomScheme;
            applyColorScheme(randomScheme);

            const animKeys = Object.keys(ANIMATION_MODES);
            SETTINGS.animation = animKeys[Math.floor(Math.random() * animKeys.length)];

            SETTINGS.curveSoftness = THREE.MathUtils.randFloat(3.0, 9.5);
            SETTINGS.curveWidth = THREE.MathUtils.randFloat(0.25, 0.85);
            SETTINGS.curveDepth = THREE.MathUtils.randFloat(0.5, 1.5);
            SETTINGS.height = THREE.MathUtils.randFloat(0.8, 1.8);
            SETTINGS.fov = THREE.MathUtils.randFloat(75, 120);
            SETTINGS.lineDensity = THREE.MathUtils.randFloat(0.6, 2.2);
            SETTINGS.compaction = THREE.MathUtils.randFloat(0.4, 2.2);
            SETTINGS.speckleScale = THREE.MathUtils.randFloat(0.5, 2.0);
            SETTINGS.cutFaceSheen = THREE.MathUtils.randFloat(0.5, 2.5);
            SETTINGS.particleSize = THREE.MathUtils.randFloat(5.0, 18.0);
            SETTINGS.speed = THREE.MathUtils.randFloat(2.0, 8.0);
            SETTINGS.cameraSpinSpeed = THREE.MathUtils.randFloat(-1.0, 1.0);
            SETTINGS.wallTilt = THREE.MathUtils.randFloatSpread(30.0);
            SETTINGS.bloomStrength = THREE.MathUtils.randFloat(0.15, 0.75);
            SETTINGS.chromaticAberration = THREE.MathUtils.randFloat(0.003, 0.015);

            uniforms.uCurveSoftness.value = SETTINGS.curveSoftness;
            uniforms.uLineDensity.value = SETTINGS.lineDensity;
            uniforms.uCompaction.value = SETTINGS.compaction;
            uniforms.uSpeckleScale.value = SETTINGS.speckleScale;
            uniforms.uSheenStrength.value = SETTINGS.cutFaceSheen;
            uniforms.uSpeed.value = SETTINGS.speed;

            particleUniforms.uCurveSoftness.value = SETTINGS.curveSoftness;
            particleUniforms.uParticleSize.value = SETTINGS.particleSize;
            particleUniforms.uSpeed.value = SETTINGS.speed;

            camera.fov = SETTINGS.fov;
            camera.updateProjectionMatrix();

            bloomPass.strength = SETTINGS.bloomStrength;
            caPass.uniforms.uAmount.value = SETTINGS.chromaticAberration;

            updateObjectTransform();

            gui.controllersRecursive().forEach(controller => controller.updateDisplay());
        };

        // Initialize GUI
        const gui = new GUI({ title: 'Core Log Bore' });

        const fPresets = gui.addFolder('Presets & Generation');
        fPresets.add(SETTINGS, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Color Scheme').onChange(applyColorScheme);
        fPresets.add(SETTINGS, 'animation', Object.keys(ANIMATION_MODES)).name('Animation Mode');
        fPresets.add(SETTINGS, 'randomizeOnClick').name('Click Scene to Re-roll');
        fPresets.add({ randomize: randomizeScene }, 'randomize').name('Randomize Now');

        const fGeom = gui.addFolder('Sediment Strata & Barrel');
        fGeom.add(SETTINGS, 'curveSoftness', 1.0, 10.0).name('Barrel Curvature').onChange(v => {
            uniforms.uCurveSoftness.value = v;
            particleUniforms.uCurveSoftness.value = v;
        });
        fGeom.add(SETTINGS, 'curveWidth', 0.1, 3.0).name('Core Width').onChange(updateObjectTransform);
        fGeom.add(SETTINGS, 'curveDepth', 0.1, 3.0).name('Core Depth').onChange(updateObjectTransform);
        fGeom.add(SETTINGS, 'height', 0.2, 3.0).name('Column Height').onChange(updateObjectTransform);
        fGeom.add(SETTINGS, 'zoom', 0.15, 5.0).name('Zoom').onChange(updateObjectTransform);
        fGeom.add(SETTINGS, 'objectX', -100.0, 100.0).name('Position X').onChange(updateObjectTransform);
        fGeom.add(SETTINGS, 'objectY', -60.0, 60.0).name('Position Y').onChange(updateObjectTransform);
        fGeom.add(SETTINGS, 'fov', 30, 140).name('Camera FOV').onChange(v => {
            camera.fov = v;
            camera.updateProjectionMatrix();
        });
        fGeom.add(SETTINGS, 'wallTilt', -180, 180).name('Core Tilt (deg)').onChange(updateObjectTransform);
        fGeom.add(SETTINGS, 'lineDensity', 0.1, 4.0).name('Strata Density').onChange(v => uniforms.uLineDensity.value = v);
        fGeom.add(SETTINGS, 'compaction', 0.0, 3.0).name('Compaction Noise').onChange(v => uniforms.uCompaction.value = v);
        fGeom.add(SETTINGS, 'speckleScale', 0.1, 4.0).name('Mineral Speckle Scale').onChange(v => uniforms.uSpeckleScale.value = v);
        fGeom.add(SETTINGS, 'cutFaceSheen', 0.0, 3.0).name('Cut Face Sheen').onChange(v => uniforms.uSheenStrength.value = v);
        fGeom.add(SETTINGS, 'particleSize', 1.0, 25.0).name('Crystal Dust Size').onChange(v => particleUniforms.uParticleSize.value = v);

        const fMotion = gui.addFolder('Motion & Dynamics');
        fMotion.add(SETTINGS, 'speed', 0, 12).name('Animation Speed').onChange(v => {
            uniforms.uSpeed.value = v;
            particleUniforms.uSpeed.value = v;
        });
        fMotion.add(SETTINGS, 'cameraSpinSpeed', -2.0, 2.0).name('Drill Spin Speed');
        fMotion.add(SETTINGS, 'cameraY', -12.0, 12.0).name('Depth Offset');

        const fEffects = gui.addFolder('Post-Processing & Optics');
        fEffects.add(SETTINGS, 'bloomStrength', 0, 4).name('Mineral Bloom').onChange(v => bloomPass.strength = v);
        fEffects.add(SETTINGS, 'bloomRadius', 0, 2).name('Bloom Radius').onChange(v => bloomPass.radius = v);
        fEffects.add(SETTINGS, 'chromaticAberration', 0, 0.05).name('Prism Shift').onChange(v => caPass.uniforms.uAmount.value = v);
        fEffects.add(SETTINGS, 'edgeBlurStrength', 0.0, 0.05).name('Peripheral Blur').onChange(v => peripheralBlurPass.uniforms.uStrength.value = v);
        fEffects.add(SETTINGS, 'dpr', 0.1, 3.0).step(0.1).name('DPR (Pixel Ratio)').onChange(v => {
            renderer.setPixelRatio(v);
            composer.setPixelRatio(v);
        });

        const fColors = gui.addFolder('Colors & Greenscreen');
        fColors.addColor(SETTINGS, 'color1').name('Stratum Color 1').onChange(updateColors);
        fColors.addColor(SETTINGS, 'color2').name('Stratum Color 2').onChange(updateColors);
        fColors.addColor(SETTINGS, 'color3').name('Stratum Color 3').onChange(updateColors);
        fColors.addColor(SETTINGS, 'color4').name('Stratum Color 4').onChange(updateColors);
        fColors.addColor(SETTINGS, 'bgColor').name('Background Color').onChange(updateColors);
        fColors.add(SETTINGS, 'greenScreen').name('Green Screen Mode').onChange(updateBackground);
        fColors.addColor(SETTINGS, 'greenScreenColor').name('Green Screen Color').onChange(updateBackground);

        gui.close();

        // Hide / Show UI with "H" key
        window.addEventListener('keydown', (e) => {
            if (e.key === 'h' || e.key === 'H') {
                gui._hidden = !gui._hidden;
                gui.domElement.style.display = gui._hidden ? 'none' : '';
            }
        });

        // Mouse Drag & Wheel Zoom Handling + Click Detection for Procedural Re-roll
        const dragState = {
            active: false,
            pointerId: null,
            startX: 0,
            startY: 0,
            startTime: 0,
            objectX: 0,
            objectY: 0,
            hasMovedSignificantly: false
        };

        renderer.domElement.addEventListener('wheel', (event) => {
            event.preventDefault();
            const zoomFactor = event.deltaY > 0 ? 0.92 : 1.08;
            SETTINGS.zoom = THREE.MathUtils.clamp(SETTINGS.zoom * zoomFactor, 0.15, 5.0);
            updateObjectTransform();
            gui.controllersRecursive().find(controller => controller.property === 'zoom')?.updateDisplay();
        }, { passive: false });

        renderer.domElement.addEventListener('pointerdown', (event) => {
            if (event.button !== 0) return;
            dragState.active = true;
            dragState.pointerId = event.pointerId;
            dragState.startX = event.clientX;
            dragState.startY = event.clientY;
            dragState.startTime = performance.now();
            dragState.objectX = SETTINGS.objectX;
            dragState.objectY = SETTINGS.objectY;
            dragState.hasMovedSignificantly = false;
            renderer.domElement.setPointerCapture(event.pointerId);
        });

        renderer.domElement.addEventListener('pointermove', (event) => {
            if (!dragState.active || event.pointerId !== dragState.pointerId) return;
            const deltaX = event.clientX - dragState.startX;
            const deltaY = event.clientY - dragState.startY;

            if (Math.hypot(deltaX, deltaY) > 5) {
                dragState.hasMovedSignificantly = true;
            }

            const worldUnitsPerPixel = 0.12 / SETTINGS.zoom;
            SETTINGS.objectX = dragState.objectX + deltaX * worldUnitsPerPixel;
            SETTINGS.objectY = dragState.objectY - deltaY * worldUnitsPerPixel;
            updateObjectTransform();
        });

        const endDrag = (event) => {
            if (!dragState.active || event.pointerId !== dragState.pointerId) return;

            const elapsedTime = performance.now() - dragState.startTime;
            const wasClick = !dragState.hasMovedSignificantly && elapsedTime < 400;

            dragState.active = false;
            dragState.pointerId = null;
            renderer.domElement.releasePointerCapture(event.pointerId);

            gui.controllersRecursive().forEach(controller => {
                if (controller.property === 'objectX' || controller.property === 'objectY') {
                    controller.updateDisplay();
                }
            });

            // If user clicked on the scene (and didn't drag), generate a new procedural variation
            if (wasClick && SETTINGS.randomizeOnClick) {
                randomizeScene();
            }
        };

        renderer.domElement.addEventListener('pointerup', endDrag);
        renderer.domElement.addEventListener('pointercancel', endDrag);

        // Animation Loop
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const t = clock.getElapsedTime();

            uniforms.uTime.value = t;
            particleUniforms.uTime.value = t;

            // Apply selected animation mode
            const currentAnimFn = ANIMATION_MODES[SETTINGS.animation] || ANIMATION_MODES['Slow Bore Drill (Continuous Rotation)'];
            currentAnimFn(t);

            composer.render();
        }

        updateBackground();
        updateColors();
        updateObjectTransform();
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
            peripheralBlurPass.uniforms.uAspect.value = window.innerWidth / window.innerHeight;
        });
    </script>
</body>
</html>
