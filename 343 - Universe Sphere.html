<body>

<script type="module">

import * as THREE from 'three';
import GUI from 'lil-gui';

// =========================================================================================
// POST PROCESSOR SUITE (Inlined from postprocessing/PostProcessor.js for standalone execution)
// =========================================================================================
const orthoVertexShader = `
precision highp float;
in vec3 position;
out vec2 vUv;
void main() {
  vUv = position.xy * 0.5 + 0.5;
  gl_Position = vec4(position, 1.0);
}
`;

const brightFragmentShader = `
precision highp float;
uniform sampler2D inputTexture;
uniform float bloomThreshold;
in vec2 vUv;
out vec4 fragColor;

void main() {
  vec4 color = texture(inputTexture, vUv);
  float luminance = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
  float knee = 0.1;
  float soft = luminance - bloomThreshold + knee;
  soft = clamp(soft, 0.0, 2.0 * knee);
  soft = (soft * soft) / (4.0 * knee + 0.00001);
  float contribution = max(soft, luminance - bloomThreshold);
  contribution /= max(luminance, 0.00001);
  fragColor = vec4(color.rgb * contribution, color.a);
}
`;

const blur13ShaderChunk = `
vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
  vec2 resolution = vec2(textureSize(image, 0));
  vec4 color = vec4(0.0);
  vec2 off1 = vec2(1.411764705882353) * direction;
  vec2 off2 = vec2(3.2941176470588234) * direction;
  vec2 off3 = vec2(5.176470588235294) * direction;
  color += texture(image, uv) * 0.1964825501511404;
  color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
  color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
  color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
  color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
  color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
  color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
  return color;
}
`;

const blurFragmentShader = `
precision highp float;
uniform sampler2D inputTexture;
uniform vec2 direction;
in vec2 vUv;
out vec4 color;
${blur13ShaderChunk}
void main() {
  color = blur13(inputTexture, vUv, direction);
}
`;

const finalFragmentShader = `
precision highp float;
uniform vec2 resolution;
uniform sampler2D inputTexture;
uniform sampler2D blur0Texture;
uniform sampler2D blur1Texture;
uniform sampler2D blur2Texture;
uniform sampler2D blur3Texture;
uniform sampler2D blur4Texture;
uniform bool bloomEnabled;
uniform float bloomStrength;
uniform float vignetteBoost;
uniform float vignetteReduction;
uniform float noiseIntensity;
uniform float time;
in vec2 vUv;
out vec4 fragColor;

float vignette(vec2 uv, float boost, float reduction) {
  vec2 position = vUv - 0.5;
  return boost - length(position) * reduction;
}

float hash1(uint n) {
  n = (n << 13U) ^ n;
  n = n * (n * n * 15731U + 789221U) + 1376312589U;
  return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
}

float noise(in vec2 uv, in float timeVal) {
  uvec2 p = uvec2(uv);
  return hash1(p.x + 1920U * p.y + (1920U * 1080U) * uint(timeVal));
}

void main() {
  vec4 color = texture(inputTexture, vUv);

  if (bloomEnabled && bloomStrength > 0.001) {
    vec4 b0 = texture(blur0Texture, vUv);
    vec4 b1 = texture(blur1Texture, vUv);
    vec4 b2 = texture(blur2Texture, vUv);
    vec4 b3 = texture(blur3Texture, vUv);
    vec4 b4 = texture(blur4Texture, vUv);

    vec4 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
    color += bloomSum * bloomStrength;
  }

  color.rgb *= vignette(vUv, vignetteBoost, vignetteReduction);
  color.rgb += noiseIntensity * noise(gl_FragCoord.xy, time);
  fragColor = vec4(color.rgb, 1.0);
}
`;

const chromaticAberrationShaderChunk = `
vec2 barrelDistortion(vec2 coord, float amt) {
  vec2 cc = coord - 0.5;
  float dist = dot(cc, cc);
  return coord + cc * dist * amt;
}
float sat(float t) { return clamp(t, 0.0, 1.0); }
float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
vec4 spectrum_offset(float t) {
  float lo = step(t, 0.5);
  float hi = 1.0 - lo;
  float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
  vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
  return pow(ret, vec4(1.0 / 2.2));
}
const float max_distort = 2.2;
const int num_iter = 8;
const float reci_num_iter_f = 1.0 / float(num_iter);
vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
  vec4 sumcol = vec4(0.0);
  vec4 sumw = vec4(0.0);
  for (int i = 0; i < num_iter; ++i) {
    float t = float(i) * reci_num_iter_f;
    vec4 w = spectrum_offset(t);
    sumw += w;
    sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
  }
  return sumcol / sumw;
}
`;

const colorFragmentShader = `
precision highp float;
uniform sampler2D inputTexture;
uniform float chromaticAberrationAmount;
uniform float minInputLevel;
uniform float maxInputLevel;
uniform float gammaLevel;
uniform float fisheyeStrength;
uniform float fisheyeRadius;
uniform float time;
in vec2 vUv;
out vec4 fragColor;

${chromaticAberrationShaderChunk}

vec2 applyFisheye(vec2 uv, float strength, float radius) {
  if (abs(strength) < 0.0001) return uv;
  vec2 p = uv - 0.5;
  float d = length(p);
  if (d > radius * 1.5) return uv;
  float r = d / max(radius, 0.001);
  float theta = atan(p.y, p.x);
  float rDist = r + strength * (r * r * r);
  return 0.5 + vec2(cos(theta), sin(theta)) * (rDist * radius);
}

vec3 gammaCorrect(vec3 color, vec3 gamma) {
  return pow(max(color, vec3(0.0)), 1.0 / gamma);
}
vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
  return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
}
vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
  return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
}
void main() {
  vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
  fragColor = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
  fragColor.rgb = finalLevels(fragColor.rgb, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
  fragColor.a = 1.0;
}
`;

const copyFragmentShader = `
precision highp float;
uniform sampler2D inputTexture;
in vec2 vUv;
out vec4 fragColor;
void main() {
  fragColor = texture(inputTexture, vUv);
}
`;

function createFBO(w, h, options = {}) {
  return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
    wrapS: options.wrapS || THREE.ClampToEdgeWrapping,
    wrapT: options.wrapT || THREE.ClampToEdgeWrapping,
    minFilter: options.minFilter || THREE.LinearFilter,
    magFilter: options.magFilter || THREE.LinearFilter,
    format: options.format || THREE.RGBAFormat,
    type: options.type || THREE.HalfFloatType,
    stencilBuffer: options.stencilBuffer || false,
    depthBuffer: options.depthBuffer !== undefined ? options.depthBuffer : true,
    samples: options.samples || 0,
  });
}

class ShaderPass {
  constructor(shader, options = {}) {
    this.shader = shader;
    this.orthoScene = new THREE.Scene();
    this.fbo = createFBO(1, 1, options);
    this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
    this.orthoScene.add(this.orthoQuad);
    this.texture = this.fbo.texture;
  }
  render(renderer, toScreen = false) {
    if (!toScreen) {
      renderer.setRenderTarget(this.fbo);
    }
    renderer.render(this.orthoScene, this.orthoCamera);
    if (!toScreen) {
      renderer.setRenderTarget(null);
    }
  }
  setSize(width, height) {
    this.fbo.setSize(Math.max(1, width), Math.max(1, height));
    this.orthoQuad.scale.set(width, height, 1);
  }
}

class ShaderPingPongPass {
  constructor(shader, options = {}) {
    this.shader = shader;
    this.orthoScene = new THREE.Scene();
    this.fbos = [createFBO(1, 1, options), createFBO(1, 1, options)];
    this.currentFBO = 0;
    this.orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    this.orthoQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.shader);
    this.orthoScene.add(this.orthoQuad);
  }
  render(renderer) {
    renderer.setRenderTarget(this.fbos[1 - this.currentFBO]);
    renderer.render(this.orthoScene, this.orthoCamera);
    renderer.setRenderTarget(null);
    this.currentFBO = 1 - this.currentFBO;
  }
  get current() { return this.fbos[this.currentFBO]; }
  get texture() { return this.current.texture; }
  setSize(width, height) {
    const w = Math.max(1, width);
    const h = Math.max(1, height);
    this.orthoQuad.scale.set(w, h, 1);
    this.fbos[0].setSize(w, h);
    this.fbos[1].setSize(w, h);
  }
}

class BloomPass {
  constructor(strength = 0.8, radius = 0.5, threshold = 0.2, levels = 5) {
    this.strength = strength;
    this.radius = radius;
    this.threshold = threshold;
    this.enabled = true;
    this.levels = levels;

    this.brightShader = new THREE.RawShaderMaterial({
      uniforms: {
        inputTexture: { value: null },
        bloomThreshold: { value: this.threshold },
      },
      vertexShader: orthoVertexShader,
      fragmentShader: brightFragmentShader,
      glslVersion: THREE.GLSL3,
    });
    this.brightPass = new ShaderPass(this.brightShader, {
      format: THREE.RGBAFormat,
      type: THREE.HalfFloatType,
    });

    this.blurShader = new THREE.RawShaderMaterial({
      uniforms: {
        inputTexture: { value: null },
        direction: { value: new THREE.Vector2(0, 1) },
      },
      vertexShader: orthoVertexShader,
      fragmentShader: blurFragmentShader,
      glslVersion: THREE.GLSL3,
    });

    this.blurPasses = [];
    for (let i = 0; i < this.levels; i++) {
      this.blurPasses.push(new ShaderPingPongPass(this.blurShader, {
        format: THREE.RGBAFormat,
        type: THREE.HalfFloatType,
      }));
    }
  }

  setSize(w, h) {
    let tw = Math.max(1, w);
    let th = Math.max(1, h);
    this.brightPass.setSize(tw, th);
    for (let i = 0; i < this.levels; i++) {
      tw = Math.max(1, Math.round(tw / 2));
      th = Math.max(1, Math.round(th / 2));
      this.blurPasses[i].setSize(tw, th);
    }
  }

  set source(texture) {
    this.brightShader.uniforms.inputTexture.value = texture;
  }

  render(renderer) {
    if (!this.enabled || this.strength <= 0.001) return;

    this.brightShader.uniforms.bloomThreshold.value = this.threshold;
    this.brightPass.render(renderer);

    const baseOffset = Math.max(0.1, this.radius * 2.0);
    const u = this.blurShader.uniforms;

    for (let j = 0; j < this.levels; j++) {
      const blurPass = this.blurPasses[j];
      const stepOffset = baseOffset * (1.0 + j * 0.5);

      u.direction.value.set(stepOffset, 0);
      u.inputTexture.value = (j === 0) ? this.brightPass.texture : this.blurPasses[j - 1].texture;
      blurPass.render(renderer);

      u.direction.value.set(0, stepOffset * 0.5);
      u.inputTexture.value = blurPass.current.texture;
      blurPass.render(renderer);
    }
  }
}

class PostProcessor {
  constructor(renderer, initialParams = {}) {
    this.renderer = renderer;

    this.settings = {
      enabled: initialParams.enabled !== undefined ? initialParams.enabled : true,
      bloomEnabled: initialParams.bloomEnabled !== undefined ? initialParams.bloomEnabled : true,
      bloomStrength: initialParams.bloomStrength !== undefined ? initialParams.bloomStrength : 1.2,
      bloomRadius: initialParams.bloomRadius !== undefined ? initialParams.bloomRadius : 0.5,
      bloomThreshold: initialParams.bloomThreshold !== undefined ? initialParams.bloomThreshold : 0.2,
      fisheyeStrength: initialParams.fisheyeStrength !== undefined ? initialParams.fisheyeStrength : 0.0,
      fisheyeRadius: initialParams.fisheyeRadius !== undefined ? initialParams.fisheyeRadius : 1.0,
      chromaticAberration: initialParams.chromaticAberration !== undefined ? initialParams.chromaticAberration : 0.015,
      vignetteBoost: initialParams.vignetteBoost !== undefined ? initialParams.vignetteBoost : 1.0,
      vignetteReduction: initialParams.vignetteReduction !== undefined ? initialParams.vignetteReduction : 0.45,
      noiseIntensity: initialParams.noiseIntensity !== undefined ? initialParams.noiseIntensity : 0.012,
      gamma: initialParams.gamma !== undefined ? initialParams.gamma : 1.0,
      minInputLevel: initialParams.minInputLevel !== undefined ? initialParams.minInputLevel : 0.0,
      maxInputLevel: initialParams.maxInputLevel !== undefined ? initialParams.maxInputLevel : 1.0,
    };

    this.sceneTarget = createFBO(1, 1, { type: THREE.HalfFloatType });

    this.bloomPass = new BloomPass(
      this.settings.bloomStrength,
      this.settings.bloomRadius,
      this.settings.bloomThreshold,
      5
    );

    this.finalShader = new THREE.RawShaderMaterial({
      uniforms: {
        resolution: { value: new THREE.Vector2(1, 1) },
        bloomEnabled: { value: this.settings.bloomEnabled },
        bloomStrength: { value: this.settings.bloomStrength },
        vignetteBoost: { value: this.settings.vignetteBoost },
        vignetteReduction: { value: this.settings.vignetteReduction },
        noiseIntensity: { value: this.settings.noiseIntensity },
        inputTexture: { value: null },
        blur0Texture: { value: null },
        blur1Texture: { value: null },
        blur2Texture: { value: null },
        blur3Texture: { value: null },
        blur4Texture: { value: null },
        time: { value: 0 },
      },
      vertexShader: orthoVertexShader,
      fragmentShader: finalFragmentShader,
      glslVersion: THREE.GLSL3,
    });
    this.finalPass = new ShaderPass(this.finalShader);

    this.rgbShader = new THREE.RawShaderMaterial({
      uniforms: {
        inputTexture: { value: this.finalPass.texture },
        fisheyeStrength: { value: this.settings.fisheyeStrength },
        fisheyeRadius: { value: this.settings.fisheyeRadius },
        chromaticAberrationAmount: { value: this.settings.chromaticAberration },
        minInputLevel: { value: this.settings.minInputLevel },
        maxInputLevel: { value: this.settings.maxInputLevel },
        gammaLevel: { value: this.settings.gamma },
        time: { value: 0 },
      },
      vertexShader: orthoVertexShader,
      fragmentShader: colorFragmentShader,
      glslVersion: THREE.GLSL3,
    });
    this.rgbPass = new ShaderPass(this.rgbShader);

    this.copyShader = new THREE.RawShaderMaterial({
      uniforms: {
        inputTexture: { value: null },
      },
      vertexShader: orthoVertexShader,
      fragmentShader: copyFragmentShader,
      glslVersion: THREE.GLSL3,
    });
    this.copyPass = new ShaderPass(this.copyShader);
  }

  updateSettings() {
    this.bloomPass.enabled = this.settings.bloomEnabled;
    this.bloomPass.strength = this.settings.bloomStrength;
    this.bloomPass.radius = this.settings.bloomRadius;
    this.bloomPass.threshold = this.settings.bloomThreshold;

    this.finalShader.uniforms.bloomEnabled.value = this.settings.bloomEnabled;
    this.finalShader.uniforms.bloomStrength.value = this.settings.bloomStrength;

    // When greenscreen mode is active, avoid edge darkening or chromatic color fringes on greenscreen
    const isGreenscreen = Boolean(params && params.greenscreen);
    this.finalShader.uniforms.vignetteBoost.value = isGreenscreen ? 1.0 : this.settings.vignetteBoost;
    this.finalShader.uniforms.vignetteReduction.value = isGreenscreen ? 0.0 : this.settings.vignetteReduction;
    this.finalShader.uniforms.noiseIntensity.value = isGreenscreen ? 0.0 : this.settings.noiseIntensity;

    this.rgbShader.uniforms.fisheyeStrength.value = this.settings.fisheyeStrength;
    this.rgbShader.uniforms.fisheyeRadius.value = this.settings.fisheyeRadius;
    this.rgbShader.uniforms.chromaticAberrationAmount.value = isGreenscreen ? 0.0 : this.settings.chromaticAberration;
    this.rgbShader.uniforms.gammaLevel.value = this.settings.gamma;
    this.rgbShader.uniforms.minInputLevel.value = this.settings.minInputLevel;
    this.rgbShader.uniforms.maxInputLevel.value = this.settings.maxInputLevel;
  }

  setSize(w0, h0, dpr = 1) {
    const w = Math.max(1, Math.floor(w0 * dpr));
    const h = Math.max(1, Math.floor(h0 * dpr));
    this.sceneTarget.setSize(w, h);
    this.finalPass.setSize(w, h);
    this.finalShader.uniforms.resolution.value.set(w, h);
    this.bloomPass.setSize(w, h);
    this.rgbPass.setSize(w, h);
    this.copyPass.setSize(w, h);
  }

  renderScene(scene, camera) {
    if (!this.settings.enabled) {
      this.renderer.render(scene, camera);
      return;
    }
    this.renderer.setRenderTarget(this.sceneTarget);
    this.renderer.render(scene, camera);
    this.renderer.setRenderTarget(null);
    this.render(this.sceneTarget.texture);
  }

  render(sourceTexture) {
    if (!this.settings.enabled) {
      this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
      this.copyPass.render(this.renderer, true);
      return;
    }

    this.updateSettings();

    this.bloomPass.source = sourceTexture;
    this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
    this.bloomPass.render(this.renderer);

    this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
    this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
    this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
    this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
    this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

    const randomTime = Math.random() * 100000;
    this.finalPass.shader.uniforms.time.value = randomTime;
    this.rgbPass.shader.uniforms.time.value = randomTime;

    this.finalPass.render(this.renderer);
    this.rgbPass.render(this.renderer, true);
  }

  attachGUI(gui, title = "Post-Processing Suite") {
    const root = gui.addFolder(title);
    root.add(this.settings, "enabled").name("Enable Suite");

    const bloom = root.addFolder("Bloom");
    bloom.add(this.settings, "bloomEnabled").name("Enable Bloom").onChange(() => this.updateSettings());
    bloom.add(this.settings, "bloomStrength", 0, 3.0, 0.05).name("Strength").onChange(() => this.updateSettings());
    bloom.add(this.settings, "bloomRadius", 0, 2.0, 0.05).name("Radius").onChange(() => this.updateSettings());
    bloom.add(this.settings, "bloomThreshold", 0, 1.0, 0.01).name("Threshold").onChange(() => this.updateSettings());

    const lens = root.addFolder("Lens, Optics & Fisheye");
    lens.add(this.settings, "fisheyeStrength", -1.0, 1.5, 0.01).name("Fisheye Distortion").onChange(() => this.updateSettings());
    lens.add(this.settings, "fisheyeRadius", 0.2, 2.0, 0.05).name("Fisheye Radius").onChange(() => this.updateSettings());
    lens.add(this.settings, "chromaticAberration", 0, 0.2, 0.005).name("Chromatic Aberration").onChange(() => this.updateSettings());
    lens.add(this.settings, "vignetteBoost", 0, 2.0, 0.05).name("Vignette Boost").onChange(() => this.updateSettings());
    lens.add(this.settings, "vignetteReduction", 0, 2.0, 0.05).name("Vignette Falloff").onChange(() => this.updateSettings());
    lens.add(this.settings, "noiseIntensity", 0, 0.1, 0.005).name("Film Grain").onChange(() => this.updateSettings());
    lens.add(this.settings, "gamma", 0.2, 2.0, 0.05).name("Gamma").onChange(() => this.updateSettings());
    lens.add(this.settings, "minInputLevel", 0, 0.5, 0.01).name("Black Level").onChange(() => this.updateSettings());
    lens.add(this.settings, "maxInputLevel", 0.5, 1.0, 0.01).name("White Level").onChange(() => this.updateSettings());

    return root;
  }
}

const vertexShader = /* glsl */`
void main() {
    gl_Position = vec4(position, 1.0);

// ============================================================
// Fragment shader
// ============================================================

const fragmentShader = /* glsl */`
precision highp float;
precision highp int;

uniform float iTime;
uniform vec2 iResolution;

uniform vec3 uSphereCenter;
uniform float uSphereRadius;

uniform float uCameraDistance;
uniform float uCameraZoom;

uniform float uSphereRotationSpeed;
uniform vec3 uSphereRotationEuler;

uniform float uGlassIOR;
uniform float uAirIOR;

uniform vec3 uGlassAbsorb;

uniform float uFlightSpeed;

uniform float uGlassFresnel;

uniform float uChromaGain;
uniform vec3 uChromaColor;

uniform float uOuterGlow;
uniform float uOuterGlowSize;
uniform float uOuterGlowFalloff;

uniform vec3 uStarColorRed;
uniform vec3 uStarColorWarm;
uniform vec3 uStarColorWhite;
uniform vec3 uStarColorBlue;
uniform vec3 uBackgroundColor;
uniform float uGreenscreen;
uniform float uExposure;

uniform float uCellSize;
uniform float uStarProbability;

uniform int uTraceSteps;

uniform float uMaxDistance;

uniform float uMinStarSize;
uniform float uMaxStarSize;

uniform float uPerspectiveScale;

uniform float uStarGlow;
uniform float uStarExposure;

uniform float uCenterFadeStart;
uniform float uCenterFadeEnd;

#define MAX_TRACE_STEPS 128

// ============================================================
// Hash
// ============================================================

vec3 hash33(vec3 p) {
    p = fract(p * vec3(0.169));
    p += dot(p, p.yxz + 33.33);
    return fract((p.xxy + p.yzz) * p.zyx);
}

// ============================================================
// Star palette
// ============================================================

vec3 starPalette(float t) {
    vec3 color = mix(
        uStarColorRed,
        uStarColorWarm,
        smoothstep(0.0, 0.55, t)
    );

    color = mix(
        color,
        uStarColorWhite,
        smoothstep(0.55, 0.85, t)
    );

    color = mix(
        color,
        uStarColorBlue,
        smoothstep(0.85, 1.0, t)
    );

    return color;
}

// ============================================================
// Sphere intersection
// ============================================================

vec2 sphereIntersection(
    vec3 rayOrigin,
    vec3 rayDirection,
    vec3 center,
    float radius
) {
    vec3 oc = rayOrigin - center;
    float projection = dot(oc, rayDirection);
    float discriminant =
        projection * projection
        - dot(oc, oc)
        + radius * radius;

    if (discriminant < 0.0) {
        return vec2(1.0, -1.0);
    }

    discriminant = sqrt(max(discriminant, 0.0));

    return vec2(
        -projection - discriminant,
        -projection + discriminant
    );
}

// ============================================================
// Refraction
// ============================================================

vec3 refractSafe(
    vec3 incident,
    vec3 normal,
    float fromIOR,
    float toIOR
) {
    if (dot(incident, normal) > 0.0) {
        normal = -normal;
    }

    float safeIOR =
        abs(toIOR) < 0.0001
        ? (toIOR < 0.0 ? -0.0001 : 0.0001)
        : toIOR;

    vec3 refracted = refract(
        incident,
        normal,
        fromIOR / safeIOR
    );

    if (dot(refracted, refracted) < 1e-8) {
        return normalize(reflect(incident, normal));
    }

    return normalize(refracted);
}

// ============================================================
// Rotations
// ============================================================

vec3 rotateY(vec3 p, float angle) {
    float c = cos(angle);
    float s = sin(angle);
    return vec3(
        c * p.x + s * p.z,
        p.y,
        -s * p.x + c * p.z
    );
}

vec3 rotateX(vec3 p, float angle) {
    float c = cos(angle);
    float s = sin(angle);
    return vec3(
        p.x,
        c * p.y - s * p.z,
        s * p.y + c * p.z
    );
}

// ============================================================
// Fresnel
// ============================================================

vec3 fresnelTerm(vec3 normal, vec3 direction) {
    float value = pow(
        1.0 - clamp(dot(normal, -direction), 0.0, 1.0),
        5.0
    );
    return vec3(value * uGlassFresnel);
}

// ============================================================
// Safe component
// ============================================================

float safeComponent(float value) {
    return value < 0.0 ? min(value, -1e-4) : max(value, 1e-4);
}

// ============================================================
// Outer glow
// ============================================================

float sphereOuterGlow(
    vec3 rayOrigin,
    vec3 rayDirection,
    vec3 center,
    float radius
) {
    vec3 oc = rayOrigin - center;
    float closestT = max(-dot(oc, rayDirection), 0.0);
    vec3 closestPoint = rayOrigin + rayDirection * closestT;

    float radialDistance = length(closestPoint - center);
    float outsideDistance = max(radialDistance - radius, 0.0);

    float glowSize = max(uOuterGlowSize, 0.0001);
    float normalizedDistance = outsideDistance / glowSize;

    float glow = exp(-normalizedDistance * max(uOuterGlowFalloff, 0.0001));
    return glow * uOuterGlow;
}

// ============================================================
// Star field
// ============================================================

vec3 renderStarField(vec3 direction) {
    direction = normalize(direction);

    float cellSize = max(uCellSize, 0.001);
    float maxDistance = max(uMaxDistance, 0.001);

    vec3 rayOrigin = vec3(
        cellSize * 0.5,
        cellSize * 0.5,
        -(iTime + 16.0) * uFlightSpeed
    );

    vec3 safeDirection = vec3(
        safeComponent(direction.x),
        safeComponent(direction.y),
        safeComponent(direction.z)
    );

    vec3 gridCell = floor(rayOrigin / cellSize);
    vec3 gridDirection = sign(safeDirection);

    vec3 nextBoundary = (
        (gridCell + step(vec3(0.0), safeDirection)) * cellSize - rayOrigin
    ) / safeDirection;

    vec3 boundaryStep = abs(vec3(cellSize) / safeDirection);

    vec3 accumulatedColor = vec3(0.0);
    float previousDistance = 0.0;

    for (int traceIndex = 0; traceIndex < MAX_TRACE_STEPS; traceIndex++) {
        if (traceIndex >= uTraceSteps) {
            break;
        }

        float nextDistance = min(
            nextBoundary.x,
            min(nextBoundary.y, nextBoundary.z)
        );

        float segmentEnd = min(nextDistance, maxDistance);

        if (segmentEnd > previousDistance) {
            vec3 randomValue = hash33(gridCell + vec3(1.7, 9.2, 5.4));

            if (randomValue.x < uStarProbability) {
                vec3 starRandom = hash33(gridCell + vec3(11.3, 7.1, 4.7));
                vec3 cellPosition = 0.32 + 0.36 * starRandom;
                vec3 starPosition = gridCell * cellSize + cellPosition * cellSize;

                float radialFade = smoothstep(
                    uCenterFadeStart,
                    uCenterFadeEnd,
                    length(starPosition.xy - rayOrigin.xy)
                );

                if (radialFade > 0.0) {
                    float starSize = randomValue.y;
                    starSize *= starSize;
                    starSize *= starSize;
                    starSize = mix(uMinStarSize, uMaxStarSize, starSize);

                    float closestDistance = clamp(
                        dot(starPosition - rayOrigin, direction),
                        previousDistance,
                        segmentEnd
                    );

                    vec3 starOffset = rayOrigin + direction * closestDistance - starPosition;

                    float footprint = max(
                        1.0,
                        closestDistance * uPerspectiveScale
                        / (1.1 * max(iResolution.y, 1.0))
                        / max(starSize, 0.0001)
                    );

                    float radius = starSize * starSize * footprint * footprint;
                    float distanceSquared = dot(starOffset, starOffset);

                    float edgeDistance = cellSize * min(
                        min(
                            min(cellPosition.x, 1.0 - cellPosition.x),
                            min(cellPosition.y, 1.0 - cellPosition.y)
                        ),
                        min(cellPosition.z, 1.0 - cellPosition.z)
                    );

                    float edgeDistanceSquared = edgeDistance * edgeDistance;

                    if (distanceSquared < edgeDistanceSquared) {
                        float edgeMask = 1.0 - smoothstep(
                            edgeDistanceSquared * 0.36,
                            edgeDistanceSquared,
                            distanceSquared
                        );

                        float glow = uStarGlow
                            / (distanceSquared / max(radius, 0.000001) + 0.015)
                            / sqrt(footprint)
                            * exp(-closestDistance * closestDistance * 10.0 / (maxDistance * maxDistance))
                            * edgeMask;

                        vec3 starColor = starPalette(pow(randomValue.z, 0.4));
                        accumulatedColor += starColor * glow * radialFade;
                    }
                }
            }
        }

        if (nextDistance > maxDistance) {
            break;
        }

        if (nextBoundary.x < nextBoundary.y) {
            if (nextBoundary.x < nextBoundary.z) {
                gridCell.x += gridDirection.x;
                previousDistance = nextBoundary.x;
                nextBoundary.x += boundaryStep.x;
            } else {
                gridCell.z += gridDirection.z;
                previousDistance = nextBoundary.z;
                nextBoundary.z += boundaryStep.z;
            }
        } else {
            if (nextBoundary.y < nextBoundary.z) {
                gridCell.y += gridDirection.y;
                previousDistance = nextBoundary.y;
                nextBoundary.y += boundaryStep.y;
            } else {
                gridCell.z += gridDirection.z;
                previousDistance = nextBoundary.z;
                nextBoundary.z += boundaryStep.z;
            }
        }

        if (previousDistance > maxDistance) {
            break;
        }
    }

    accumulatedColor *= uStarExposure;
    return accumulatedColor / (1.0 + accumulatedColor);
}

// ============================================================
// Main
// ============================================================

void main() {
    vec2 fragCoord = gl_FragCoord.xy;
    float viewportScale = max(min(iResolution.x, iResolution.y), 1.0);
    vec2 uv = (fragCoord - 0.5 * iResolution.xy) / viewportScale;

    vec3 rayOrigin = vec3(0.0, 0.0, uCameraDistance);
    vec3 rayDirection = normalize(vec3(uv, -uCameraZoom));

    vec2 sphereHit = sphereIntersection(
        rayOrigin,
        rayDirection,
        uSphereCenter,
        uSphereRadius
    );

    // External sphere glow
    float outerGlow = sphereOuterGlow(
        rayOrigin,
        rayDirection,
        uSphereCenter,
        uSphereRadius
    );

    if (sphereHit.y < 0.0) {
        if (uGreenscreen > 0.5) {
            gl_FragColor = vec4(0.0, 1.0, 0.0, 1.0);
            return;
        }

        vec3 glowColor = uBackgroundColor + uChromaColor * outerGlow;
        glowColor *= uExposure;

        gl_FragColor = vec4(
            clamp(glowColor, 0.0, 1.0),
            1.0
        );
        return;
    }

    // Sphere entry
    vec3 entryPosition = rayOrigin + rayDirection * max(sphereHit.x, 0.0);
    vec3 entryNormal = normalize(entryPosition - uSphereCenter);

    vec3 finalColor = fresnelTerm(entryNormal, rayDirection);

    vec3 glassDirection = refractSafe(
        rayDirection,
        entryNormal,
        uAirIOR,
        uGlassIOR
    );

    vec3 internalOrigin = entryPosition + glassDirection * 0.002;

    sphereHit = sphereIntersection(
        internalOrigin,
        glassDirection,
        uSphereCenter,
        uSphereRadius
    );

    if (sphereHit.y < 0.0) {
        finalColor *= uExposure;
        gl_FragColor = vec4(clamp(finalColor, 0.0, 1.0), 1.0);
        return;
    }

    vec3 exitPosition = internalOrigin + glassDirection * sphereHit.y;
    vec3 exitNormal = normalize(exitPosition - uSphereCenter);

    finalColor += fresnelTerm(-exitNormal, -glassDirection) * 0.5;

    vec3 exitDirection = refractSafe(
        glassDirection,
        exitNormal,
        uGlassIOR,
        uAirIOR
    );

    exitDirection = normalize(
        rotateY(
            rotateX(exitDirection, uSphereRotationEuler.x),
            uSphereRotationEuler.y + iTime * uSphereRotationSpeed
        )
    );

    float glassDistance = length(exitPosition - entryPosition);

    vec3 absorption = exp(-uGlassAbsorb * glassDistance * 0.55);

    finalColor += renderStarField(exitDirection) * absorption;

    float luminance = clamp(
        dot(finalColor, vec3(0.2126, 0.7152, 0.0722)) * 3.5,
        0.0,
        1.0
    );

    vec2 sphereScreenUV = (uSphereCenter.xy * uCameraZoom) / max(uCameraDistance, 0.001);
    float distFromSphereCenter = length(uv - sphereScreenUV);

    finalColor += uChromaColor * luminance * smoothstep(0.15, 0.95, distFromSphereCenter) * uChromaGain;

    finalColor *= uExposure;

    gl_FragColor = vec4(
        clamp(finalColor, 0.0, 1.0),
        1.0
    );
}
`;

const drawingBufferSize = new THREE.Vector2();

function resizeRenderer() {
    if (!renderer) return;

    const width = Math.max(1, window.innerWidth);
    const height = Math.max(1, window.innerHeight);

    renderer.setSize(width, height, false);
    renderer.getDrawingBufferSize(drawingBufferSize);

    uniforms.iResolution.value.copy(drawingBufferSize);

    if (postProcessor) {
        postProcessor.setSize(width, height, params.performance.dpr);
    }
}

window.addEventListener('resize', resizeRenderer, { passive: true });


// ============================================================
// Color Scheme Application
// ============================================================

function applyColorScheme(name) {
    const scheme = COLOR_SCHEMES[name];
    if (!scheme) return;

    params.colors.chroma = scheme.chroma;
    params.colors.starRed = scheme.starRed;
    params.colors.starWarm = scheme.starWarm;
    params.colors.starWhite = scheme.starWhite;
    params.colors.starBlue = scheme.starBlue;
    params.colors.background = scheme.background;

    updateUniformColors();
    updateBackgroundColor();
}

function updateUniformColors() {
    hexToRawVec3(params.colors.chroma, uniforms.uChromaColor.value);
    hexToRawVec3(params.colors.starRed, uniforms.uStarColorRed.value);
    hexToRawVec3(params.colors.starWarm, uniforms.uStarColorWarm.value);
    hexToRawVec3(params.colors.starWhite, uniforms.uStarColorWhite.value);
    hexToRawVec3(params.colors.starBlue, uniforms.uStarColorBlue.value);
    hexToRawVec3(params.colors.background, uniforms.uBackgroundColor.value);
}

function updateBackgroundColor() {
    if (params.greenscreen) {
        uniforms.uGreenscreen.value = 1.0;
        document.body.style.backgroundColor = '#00ff00';
        if (renderer) renderer.setClearColor(0x00ff00, 1);
    } else {
        uniforms.uGreenscreen.value = 0.0;
        document.body.style.backgroundColor = params.colors.background;
        if (renderer) {
            const hex = parseInt(params.colors.background.replace('#', ''), 16) || 0x000000;
            renderer.setClearColor(hex, 1);
        }
    }
}

function setupInteractionListeners(domElement) {
    domElement.addEventListener('pointerdown', onPointerDown);
    domElement.addEventListener('wheel', onWheel, { passive: false });

    if (!interactionListenersInitialized) {
        window.addEventListener('pointermove', onPointerMove);
        window.addEventListener('pointerup', onPointerUp);
        interactionListenersInitialized = true;
    }
}

function onPointerDown(e) {
    if (e.target.closest && e.target.closest('.lil-gui')) return;

    isDragging = true;
    pointerDownPos.x = e.clientX;
    pointerDownPos.y = e.clientY;
    pointerDownTime = performance.now();

    dragStartSphere.x = params.sphereCenter.x;
    dragStartSphere.y = params.sphereCenter.y;
}

function onPointerMove(e) {
    if (!isDragging) return;

    const dx = e.clientX - pointerDownPos.x;
    const dy = e.clientY - pointerDownPos.y;

    const viewportScale = Math.max(Math.min(window.innerWidth, window.innerHeight), 1.0);
    const factor = (params.camera.distance / Math.max(params.camera.zoom, 0.01)) / viewportScale;

    params.sphereCenter.x = dragStartSphere.x + dx * factor;
    params.sphereCenter.y = dragStartSphere.y - dy * factor;

    uniforms.uSphereCenter.value.x = params.sphereCenter.x;
    uniforms.uSphereCenter.value.y = params.sphereCenter.y;

    if (sphereXController) sphereXController.updateDisplay();
    if (sphereYController) sphereYController.updateDisplay();
}

function onPointerUp(e) {
    if (!isDragging) return;
    isDragging = false;

    const dx = e.clientX - pointerDownPos.x;
    const dy = e.clientY - pointerDownPos.y;
    const distanceMoved = Math.hypot(dx, dy);
    const clickDuration = performance.now() - pointerDownTime;

    // If click detected (minimal movement and quick release)
    if (distanceMoved < 6 && clickDuration < 400) {
        if (params.interaction.randomizeOnClick) {
            randomizeThemeAndParameters();
        }
    }
}

function onWheel(e) {
    if (e.target.closest && e.target.closest('.lil-gui')) return;
    e.preventDefault();

    const zoomDelta = e.deltaY * -0.0015;
    params.camera.zoom = THREE.MathUtils.clamp(
        params.camera.zoom * (1.0 + zoomDelta),
        0.15,
        3.5
    );

    uniforms.uCameraZoom.value = params.camera.zoom;
    if (cameraZoomController) cameraZoomController.updateDisplay();
}


// ============================================================
// Renderer & PostProcessor Setup
// ============================================================

let renderer;
let postProcessor;

function initRenderer(antialias) {
    if (renderer) {
        const oldCanvas = renderer.domElement;
        if (oldCanvas && oldCanvas.parentNode) {
            oldCanvas.parentNode.removeChild(oldCanvas);
        }
        renderer.dispose();
    }

    renderer = new THREE.WebGLRenderer({
        antialias: antialias,
        alpha: false,
        powerPreference: 'high-performance'
    });

    renderer.setPixelRatio(params.performance.dpr);
    updateBackgroundColor();

    renderer.domElement.style.width = '100%';
    renderer.domElement.style.height = '100%';

    document.body.appendChild(renderer.domElement);

    if (!postProcessor) {
        postProcessor = new PostProcessor(renderer);
    } else {
        postProcessor.renderer = renderer;
    }

    setupInteractionListeners(renderer.domElement);
    resizeRenderer();
}


// ============================================================
// Procedural Theme & Parameter Randomization on Scene Click
// ============================================================

function randomizeThemeAndParameters() {
    // 1. Pick a random color scheme from the 18 preconfigured schemes
    const schemeKeys = Object.keys(COLOR_SCHEMES);
    const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
    params.colorScheme = randomScheme;
    applyColorScheme(randomScheme);

    // 2. Pick a random active motion animation (exclude static for dynamic variation)
    const activeAnimations = ANIMATIONS.filter(a => !a.startsWith('Static'));
    params.animationType = activeAnimations[Math.floor(Math.random() * activeAnimations.length)];
    params.animation.speed = 0.6 + Math.random() * 1.2;
    params.animation.sphereRotationSpeed = (Math.random() - 0.5) * 0.24;
    params.animation.flightSpeed = 250.0 + Math.random() * 650.0;

    // 3. Re-roll geometric parameters
    params.geometry.sphereRadius = 9.0 + Math.random() * 8.0;
    params.geometry.cellSize = 250.0 + Math.random() * 450.0;
    params.geometry.starProbability = 0.15 + Math.random() * 0.35;
    params.geometry.minStarSize = 1.0 + Math.random() * 2.5;
    params.geometry.maxStarSize = 25.0 + Math.random() * 40.0;
    params.geometry.perspectiveScale = 2.0 + Math.random() * 3.5;
    params.geometry.centerFadeStart = 60.0 + Math.random() * 90.0;
    params.geometry.centerFadeEnd = params.geometry.centerFadeStart + 40.0 + Math.random() * 70.0;

    // 4. Re-roll material & optical properties
    params.material.glassIOR = 0.85 + Math.random() * 1.1;
    params.material.airIOR = -0.35 + Math.random() * 0.45;
    params.material.glassFresnel = 0.05 + Math.random() * 0.15;
    params.material.starGlow = 0.08 + Math.random() * 0.32;
    params.material.starExposure = 1.2 + Math.random() * 1.8;
    params.material.chromaGain = 3.0 + Math.random() * 6.5;
    params.material.outerGlow = 0.3 + Math.random() * 0.9;
    params.material.outerGlowSize = 0.9 + Math.random() * 1.8;
    params.material.outerGlowFalloff = 1.3 + Math.random() * 2.0;

    // 5. Update uniforms
    uniforms.uSphereRadius.value = params.geometry.sphereRadius;
    uniforms.uCellSize.value = params.geometry.cellSize;
    uniforms.uStarProbability.value = params.geometry.starProbability;
    uniforms.uMinStarSize.value = params.geometry.minStarSize;
    uniforms.uMaxStarSize.value = params.geometry.maxStarSize;
    uniforms.uPerspectiveScale.value = params.geometry.perspectiveScale;
    uniforms.uCenterFadeStart.value = params.geometry.centerFadeStart;
    uniforms.uCenterFadeEnd.value = params.geometry.centerFadeEnd;

    uniforms.uSphereRotationSpeed.value = params.animation.sphereRotationSpeed;
    uniforms.uFlightSpeed.value = params.animation.flightSpeed;

    uniforms.uGlassIOR.value = params.material.glassIOR;
    uniforms.uAirIOR.value = params.material.airIOR;
    uniforms.uGlassFresnel.value = params.material.glassFresnel;
    uniforms.uStarGlow.value = params.material.starGlow;
    uniforms.uStarExposure.value = params.material.starExposure;
    uniforms.uChromaGain.value = params.material.chromaGain;
    uniforms.uOuterGlow.value = params.material.outerGlow;
    uniforms.uOuterGlowSize.value = params.material.outerGlowSize;
    uniforms.uOuterGlowFalloff.value = params.material.outerGlowFalloff;

    // Note: Postprocessing settings are intentionally untouched as specified!

    // 6. Update GUI display
    if (gui) {
        gui.controllersRecursive().forEach(controller => controller.updateDisplay());
    }
}

// ============================================================
// Animation Loop & Dynamics
// ============================================================

const clock = new THREE.Clock();
let animTime = 0.0;
const animOffset = new THREE.Vector2(0, 0);

function updateAnimationDynamics() {
    const type = params.animationType;

    if (type === 'Static (No Camera Motion)') {
        animOffset.set(0, 0);
        uniforms.uSphereRotationEuler.value.set(0, 0, 0);
        uniforms.uFlightSpeed.value = 0.0;
        uniforms.uSphereRotationSpeed.value = 0.0;
        uniforms.uCameraZoom.value = params.camera.zoom;
        uniforms.uOuterGlow.value = params.material.outerGlow;
    } else if (type === 'Gentle Cosmic Orbit') {
        const angle = animTime * 0.35;
        animOffset.x = Math.sin(angle) * 3.5;
        animOffset.y = Math.cos(angle * 0.7) * 1.5;
        uniforms.uSphereRotationEuler.value.set(Math.sin(angle * 0.5) * 0.2, angle * 0.4, 0);
        uniforms.uFlightSpeed.value = params.animation.flightSpeed;
        uniforms.uSphereRotationSpeed.value = params.animation.sphereRotationSpeed;
        uniforms.uCameraZoom.value = params.camera.zoom;
        uniforms.uOuterGlow.value = params.material.outerGlow;
    } else if (type === 'Hyperspace Star Flight') {
        animOffset.x = Math.sin(animTime * 0.8) * 0.8;
        animOffset.y = Math.cos(animTime * 0.6) * 0.6;
        uniforms.uSphereRotationEuler.value.set(0, animTime * 0.1, 0);
        uniforms.uFlightSpeed.value = params.animation.flightSpeed * 1.6;
        uniforms.uSphereRotationSpeed.value = params.animation.sphereRotationSpeed * 1.3;
        uniforms.uCameraZoom.value = params.camera.zoom;
        uniforms.uOuterGlow.value = params.material.outerGlow;
    } else if (type === 'Figure-8 Infinity Drift') {
        const t = animTime * 0.35;
        animOffset.x = Math.sin(t) * 4.5;
        animOffset.y = Math.sin(t * 2.0) * 2.2;
        uniforms.uSphereRotationEuler.value.set(Math.cos(t * 2.0) * 0.15, Math.sin(t) * 0.3, 0);
        uniforms.uFlightSpeed.value = params.animation.flightSpeed * 0.9;
        uniforms.uSphereRotationSpeed.value = params.animation.sphereRotationSpeed;
        uniforms.uCameraZoom.value = params.camera.zoom;
        uniforms.uOuterGlow.value = params.material.outerGlow;
    } else if (type === 'Deep Cosmic Breathing') {
        const breath = Math.sin(animTime * 0.5);
        animOffset.x = Math.sin(animTime * 0.2) * 1.0;
        animOffset.y = Math.cos(animTime * 0.25) * 0.8;
        uniforms.uCameraZoom.value = params.camera.zoom * (1.0 + breath * 0.12);
        uniforms.uOuterGlow.value = params.material.outerGlow * (1.0 + breath * 0.25);
        uniforms.uFlightSpeed.value = params.animation.flightSpeed * 0.8;
        uniforms.uSphereRotationSpeed.value = params.animation.sphereRotationSpeed;
    } else if (type === 'Spiral Horizon') {
        const r = 2.2 + Math.sin(animTime * 0.2) * 1.2;
        animOffset.x = Math.cos(animTime * 0.3) * r;
        animOffset.y = Math.sin(animTime * 0.3) * r * 0.6;
        uniforms.uSphereRotationEuler.value.set(Math.sin(animTime * 0.3) * 0.25, animTime * 0.2, 0);
        uniforms.uFlightSpeed.value = params.animation.flightSpeed * 1.1;
        uniforms.uSphereRotationSpeed.value = params.animation.sphereRotationSpeed * 1.1;
        uniforms.uCameraZoom.value = params.camera.zoom;
        uniforms.uOuterGlow.value = params.material.outerGlow;
    } else if (type === 'Zenith Float & Roll') {
        animOffset.x = Math.cos(animTime * 0.25) * 1.2;
        animOffset.y = Math.sin(animTime * 0.4) * 3.2;
        uniforms.uSphereRotationEuler.value.set(Math.sin(animTime * 0.4) * 0.3, Math.cos(animTime * 0.25) * 0.2, 0);
        uniforms.uFlightSpeed.value = params.animation.flightSpeed;
        uniforms.uSphereRotationSpeed.value = params.animation.sphereRotationSpeed;
        uniforms.uCameraZoom.value = params.camera.zoom;
        uniforms.uOuterGlow.value = params.material.outerGlow;
    } else if (type === 'Galactic Core Wobble') {
        animOffset.x = (Math.sin(animTime * 0.55) + Math.sin(animTime * 0.23)) * 2.0;
        animOffset.y = (Math.cos(animTime * 0.42) + Math.cos(animTime * 0.17)) * 1.4;
        uniforms.uSphereRotationEuler.value.set(
            Math.sin(animTime * 0.3) * 0.2,
            animTime * 0.15,
            Math.cos(animTime * 0.3) * 0.15
        );
        uniforms.uFlightSpeed.value = params.animation.flightSpeed * (1.0 + Math.sin(animTime * 0.5) * 0.3);
        uniforms.uSphereRotationSpeed.value = params.animation.sphereRotationSpeed * (1.0 + Math.cos(animTime * 0.4) * 0.4);
        uniforms.uCameraZoom.value = params.camera.zoom;
        uniforms.uOuterGlow.value = params.material.outerGlow;
    }

    uniforms.uSphereCenter.value.set(
        params.sphereCenter.x + animOffset.x,
        params.sphereCenter.y + animOffset.y,
        params.sphereCenter.z
    );
}

function animate() {
    requestAnimationFrame(animate);

    const dt = clock.getDelta();
    if (params.animationType !== 'Static (No Camera Motion)') {
        animTime += dt * params.animation.speed;
    }

    uniforms.iTime.value = animTime;

    updateAnimationDynamics();

    if (postProcessor && postProcessor.settings.enabled) {
        postProcessor.renderScene(scene, camera);
    } else {
        renderer.render(scene, camera);
    }
}

animate();

    'pagehide',
    () => {
        geometry.dispose();
        material.dispose();
        if (renderer) renderer.dispose();
        gui.destroy();
