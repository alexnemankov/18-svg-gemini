<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warp & Weft</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #141210;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: grab;
        }

        canvas:active {
            cursor: grabbing;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #d4c5b2;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            pointer-events: none;
        }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="loading">Mounting Loom Inspection Grid...</div>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
        import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

        // 18 Preconfigured Color Palettes

            },

            },
            'Palette (63D1CF, 5BC0BE...)': {

            },
            'Palette (AA60C8, D69ADE...)': {

            },
            'Palette (FEF1BE, FFBA00...)': {

                color3: '#008189',

                bgColor: '#061210'
            },
            'Palette (D4FFB0, 7FFF00...)': {
                color1: '#D4FFB0',

                color3: '#00B894',
                color4: '#0A3322',
                bgColor: '#05140A'
            },
            'Palette (FFE8CC, FF8C00...)': {
                color1: '#FFE8CC',
                color2: '#FF8C00',
                color3: '#C7501A',
                color4: '#3D1050',
                bgColor: '#0E0618'
            },
            'Palette (E8E0FF, B38FFF...)': {
                color1: '#E8E0FF',
                color2: '#B38FFF',
                color3: '#6A3DE8',
                color4: '#1A1250',
                bgColor: '#090612'
            },
            'Palette (E0FBFF, 00F0FF...)': {
                color1: '#E0FBFF',
                color2: '#00F0FF',
                color3: '#D40078',
                color4: '#1E0A3D',
                bgColor: '#05020F'
            }
        };

        const SETTINGS = {
            // Palette & Colors
            colorScheme: 'Neutral + accent',
            color1: COLOR_SCHEMES['Neutral + accent'].color1,
            color2: COLOR_SCHEMES['Neutral + accent'].color2,
            color3: COLOR_SCHEMES['Neutral + accent'].color3,
            color4: COLOR_SCHEMES['Neutral + accent'].color4,
            bgColor: COLOR_SCHEMES['Neutral + accent'].bgColor,
            greenScreen: false,
            greenScreenColor: '#00ff00',

            // Animation
            animationMode: 'Raking Light Sweep',
            speed: 1.0,
            clickRandomize: true,

            // Geometry & Weave Quality
            curveSoftness: 5.5,
            curveWidth: 0.38,
            curveDepth: 0.95,
            height: 1.35,
            zoom: 1.0,
            objectX: 0.0,
            objectY: 0.0,
            wallTilt: 0.0,
            fov: 65.0,
            cameraY: 0.0,

            // Weft & Warp Parameters
            warpDensity: 1.0,
            weftDensity: 1.0,
            threadThickness: 0.95,
            tension: 0.85,
            sheenStrength: 0.35,

            // Raking Light Macro Inspection
            rakingAngle: 45.0,
            rakingElevation: 22.0,
            rakingIntensity: 1.2,

            // Optics & Lens
            bloomStrength: 0.04,
            bloomRadius: 0.5,
            chromaticAberration: 0.002,
            edgeBlurStrength: 0.012,
            dpr: Math.min(window.devicePixelRatio || 1.0, 2.0),
            moteDensity: 500
        };

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(SETTINGS.bgColor, 0.0025);
        scene.background = new THREE.Color(SETTINGS.bgColor);

        const camera = new THREE.PerspectiveCamera(SETTINGS.fov, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, SETTINGS.cameraY, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(SETTINGS.dpr);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.05;
        document.body.appendChild(renderer.domElement);

        document.getElementById('loading').style.display = 'none';

        // Procedural Micro-Fiber Canvas Texture Generator
        function createFiberNoiseTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#808080';
            ctx.fillRect(0, 0, 1024, 1024);

            const imgData = ctx.getImageData(0, 0, 1024, 1024);
            const data = imgData.data;
            for (let i = 0; i < data.length; i += 4) {
                const n1 = (Math.random() * 60 - 30) + 128;
                const n2 = (Math.random() * 60 - 30) + 128;
                data[i] = n1;
                data[i + 1] = n2;
                data[i + 2] = (Math.random() * 40 - 20) + 128;
                data[i + 3] = (Math.random() * 40 - 20) + 128;
            }
            ctx.putImageData(imgData, 0, 0);

            // Draw thousands of micro-filaments / twisted thread fibers
            ctx.lineWidth = 0.8;
            for (let i = 0; i < 5000; i++) {
                const x = Math.random() * 1024;
                const y = Math.random() * 1024;
                const len = 15 + Math.random() * 45;
                const isVertical = Math.random() > 0.5;
                const angle = (isVertical ? Math.PI / 2 : 0) + (Math.random() - 0.5) * 0.35;
                const isBright = Math.random() > 0.48;

                ctx.strokeStyle = isBright
                    ? `rgba(255, 255, 255, ${0.06 + Math.random() * 0.12})`
                    : `rgba(0, 0, 0, ${0.06 + Math.random() * 0.12})`;

                ctx.beginPath();
                ctx.moveTo(x, y);
                const cpX = x + Math.cos(angle) * len * 0.5 + (Math.random() - 0.5) * 6;
                const cpY = y + Math.sin(angle) * len * 0.5 + (Math.random() - 0.5) * 6;
                const endX = x + Math.cos(angle) * len;
                const endY = y + Math.sin(angle) * len;
                ctx.quadraticCurveTo(cpX, cpY, endX, endY);
                ctx.stroke();
            }

            // Draw small organic slub flecks
            for (let i = 0; i < 350; i++) {
                const nx = Math.random() * 1024;
                const ny = Math.random() * 1024;
                const rad = 1.0 + Math.random() * 2.2;
                ctx.fillStyle = Math.random() > 0.5 ? 'rgba(255, 255, 255, 0.18)' : 'rgba(0, 0, 0, 0.22)';
                ctx.beginPath();
                ctx.arc(nx, ny, rad, 0, Math.PI * 2);
                ctx.fill();
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.minFilter = THREE.LinearMipmapLinearFilter;
            tex.magFilter = THREE.LinearFilter;
            tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
            return tex;
        }

        const dataTexture = createFiberNoiseTexture();

        const tunnelGroup = new THREE.Group();
        scene.add(tunnelGroup);

        const wallVertexShader = `
            varying vec2 vUv;
            varying vec3 vPosition;
            varying vec3 vWorldNormal;
            uniform float uCurveSoftness;

            void main() {
                vUv = uv;
                vec3 pos = position;

                float angle = atan(pos.z, pos.x);
                float normX = cos(angle);
                float n = uCurveSoftness;

                float absZ = pow(max(0.00001, 1.0 - pow(abs(normX), n)), 1.0 / n) * 100.0;
                pos.z = sign(sin(angle)) * absZ;

                vPosition = pos;
                vWorldNormal = normalize(normalMatrix * normal);
                gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
            }
        `;

        const wallFragmentShader = `
            varying vec2 vUv;
            varying vec3 vPosition;
            varying vec3 vWorldNormal;

            uniform float uTime;
            uniform float uSpeed;
            uniform float uWarpDensity;
            uniform float uWeftDensity;
            uniform float uThreadThickness;
            uniform float uTension;
            uniform float uSheenStrength;
            uniform float uRakingAngle;
            uniform float uRakingElevation;
            uniform float uRakingIntensity;
            uniform float uWarpOffset;
            uniform float uWeftOffset;
            uniform float uTensionVibe;

            uniform vec3 uColor1;
            uniform vec3 uColor2;
            uniform vec3 uColor3;
            uniform vec3 uColor4;
            uniform vec3 uBgColor;
            uniform sampler2D uDataTexture;

            float hash(vec2 p) {
                return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
            }

            float hash21(vec2 p) {
                p = fract(p * vec2(233.34, 851.73));
                p += dot(p, p + 23.45);
                return fract(p.x * p.y);
            }

            void main() {
                float angle = atan(vPosition.z, vPosition.x);
                float normAngle = (angle + 3.1415926535) / 6.283185307;

                // Warp lines run vertically along height, Weft lines run horizontally around circumference
                float warpCoord = normAngle * 260.0 * uWarpDensity + uWarpOffset;
                float weftCoord = (vPosition.y + 45.0) * 3.4 * uWeftDensity + uWeftOffset;

                // Micro acoustic tension vibration
                warpCoord += sin(weftCoord * 3.8 + uTime * 4.0) * uTensionVibe;
                weftCoord += cos(warpCoord * 3.8 + uTime * 4.0) * uTensionVibe;

                float warpId = floor(warpCoord);
                float warpFract = fract(warpCoord) - 0.5;

                float weftId = floor(weftCoord);
                float weftFract = fract(weftCoord) - 0.5;

                // Thread slub & yarn gauge irregularity
                float warpSlub = mix(0.88, 1.12, hash(vec2(warpId, 19.3)));
                float weftSlub = mix(0.88, 1.12, hash(vec2(weftId, 83.7)));

                float warpRadius = 0.46 * uThreadThickness * warpSlub;
                float weftRadius = 0.46 * uThreadThickness * weftSlub;

                float dWarp = abs(warpFract);
                float dWeft = abs(weftFract);

                float hWarpProfile = sqrt(max(0.0, 1.0 - (dWarp / warpRadius) * (dWarp / warpRadius)));
                if (dWarp > warpRadius) hWarpProfile = 0.0;

                float hWeftProfile = sqrt(max(0.0, 1.0 - (dWeft / weftRadius) * (dWeft / weftRadius)));
                if (dWeft > weftRadius) hWeftProfile = 0.0;

                // Tabby Plain Weave over/under alternating thread crossings
                float parity = mod(warpId + weftId, 2.0);
                float isWarpTop = (parity < 0.5) ? 1.0 : 0.0;

                float warpZ = cos(3.14159265 * weftFract * 2.0) * uTension;
                float weftZ = -cos(3.14159265 * warpFract * 2.0) * uTension;

                float elevWarp = hWarpProfile * (isWarpTop > 0.5 ? (1.0 + 0.35 * warpZ) : (0.62 + 0.35 * warpZ));
                float elevWeft = hWeftProfile * (isWarpTop < 0.5 ? (1.0 + 0.35 * weftZ) : (0.62 + 0.35 * weftZ));

                // Smooth phase-offset blend representing thread overlap & occlusions
                float blendWarp = smoothstep(elevWeft - 0.08, elevWeft + 0.08, elevWarp);

                // Sample micro fiber texture from CanvasTexture
                vec2 fiberUv = vec2(normAngle * 18.0, vPosition.y * 0.09);
                vec4 fiberTex = texture2D(uDataTexture, fiberUv);

                // S-twist yarn striation lines
                float twistAngle = 0.52;
                float warpTwist = sin((warpFract * cos(twistAngle) + weftCoord * sin(twistAngle) * 0.15) * 58.0);
                float weftTwist = sin((weftFract * cos(twistAngle) - warpCoord * sin(twistAngle) * 0.15) * 58.0);

                float microFiberWarp = warpTwist * 0.12 + (fiberTex.r - 0.5) * 0.35;
                float microFiberWeft = weftTwist * 0.12 + (fiberTex.g - 0.5) * 0.35;

                float surfaceElev = max(elevWarp, elevWeft);

                // Raking Light directional vector calculation
                float rAngleRad = uRakingAngle * 0.0174532925;
                float rElevRad = uRakingElevation * 0.0174532925;
                vec3 lightDir = normalize(vec3(
                    cos(rAngleRad) * cos(rElevRad),
                    sin(rElevRad),
                    sin(rAngleRad) * cos(rElevRad)
                ));

                // Normal estimation with micro-fibril detail
                vec3 normalWarp = normalize(vec3(
                    -warpFract / (warpRadius + 0.001) + microFiberWarp,
                    -sin(3.14159265 * weftFract * 2.0) * 0.45,
                    hWarpProfile + 0.15
                ));

                vec3 normalWeft = normalize(vec3(
                    sin(3.14159265 * warpFract * 2.0) * 0.45,
                    -weftFract / (weftRadius + 0.001) + microFiberWeft,
                    hWeftProfile + 0.15
                ));

                vec3 surfNormal = normalize(mix(normalWeft, normalWarp, blendWarp));

                // Multiplicative Diffuse Model (Matte fabric, zero glowing emissive tunnel signature)
                float nDotL = dot(surfNormal, lightDir);
                float diffuse = clamp(nDotL * 0.92 + 0.08, 0.06, 1.0) * uRakingIntensity;

                // Over/under thread shadow mapping
                float threadShadow = 1.0;
                if (blendWarp > 0.5) {
                    float edgeDist = 1.0 - smoothstep(0.0, warpRadius, dWarp);
                    threadShadow = mix(0.42, 1.0, edgeDist);
                } else {
                    float edgeDist = 1.0 - smoothstep(0.0, weftRadius, dWeft);
                    threadShadow = mix(0.42, 1.0, edgeDist);
                }

                // Interstitial Pore Occlusion (contact shadows between warp & weft)
                float poreMask = smoothstep(0.03, 0.36, surfaceElev);
                float ambientOcclusion = mix(0.16, 1.0, poreMask) * threadShadow;

                // Anisotropic Textile Sheen
                vec3 viewDir = vec3(0.0, 0.0, 1.0);
                vec3 halfVec = normalize(lightDir + viewDir);

                vec3 warpTangent = vec3(0.0, 1.0, 0.0);
                vec3 weftTangent = vec3(1.0, 0.0, 0.0);
                vec3 fiberTangent = mix(weftTangent, warpTangent, blendWarp);

                float tDotH = dot(fiberTangent, halfVec);
                float anisoSpec = sqrt(max(0.0, 1.0 - tDotH * tDotH));
                float sheen = pow(anisoSpec, 8.0) * uSheenStrength * poreMask * clamp(nDotL, 0.0, 1.0);

                // Desaturated thread color variation
                float warpColorRand = hash(vec2(warpId, 45.1));
                float weftColorRand = hash(vec2(weftId, 91.7));

                vec3 warpColor = mix(uColor1, uColor3, warpColorRand * 0.7 + (fiberTex.b - 0.5) * 0.3);
                vec3 weftColor = mix(uColor2, uColor4, weftColorRand * 0.7 + (fiberTex.a - 0.5) * 0.3);

                vec3 yarnAlbedo = mix(weftColor, warpColor, blendWarp);

                // Linen nep flecks
                float nep = step(0.93, hash21(vec2(warpCoord * 2.0, weftCoord * 2.0))) * (1.0 - poreMask * 0.5);
                yarnAlbedo = mix(yarnAlbedo, yarnAlbedo * 1.35 + vec3(0.04), nep * 0.35);

                // Multiplicative shading composition
                vec3 shadedColor = yarnAlbedo * (diffuse * ambientOcclusion + 0.12 * (1.0 - ambientOcclusion * 0.5)) + vec3(sheen);

                // Interstitial dark cavity background
                vec3 finalColor = mix(uBgColor * 0.7, shadedColor, poreMask);

                // Vertical edge fadeout
                float edgeFade = smoothstep(38.0, 22.0, abs(vPosition.y));
                finalColor = mix(uBgColor, finalColor, edgeFade);

                gl_FragColor = vec4(finalColor, 1.0);
            }
        `;

        const uniforms = {
            uTime: { value: 0.0 },
            uSpeed: { value: SETTINGS.speed },
            uWarpDensity: { value: SETTINGS.warpDensity },
            uWeftDensity: { value: SETTINGS.weftDensity },
            uThreadThickness: { value: SETTINGS.threadThickness },
            uTension: { value: SETTINGS.tension },
            uSheenStrength: { value: SETTINGS.sheenStrength },
            uRakingAngle: { value: SETTINGS.rakingAngle },
            uRakingElevation: { value: SETTINGS.rakingElevation },
            uRakingIntensity: { value: SETTINGS.rakingIntensity },
            uWarpOffset: { value: 0.0 },
            uWeftOffset: { value: 0.0 },
            uTensionVibe: { value: 0.0 },
            uCurveSoftness: { value: SETTINGS.curveSoftness },
            uColor1: { value: new THREE.Color(SETTINGS.color1) },
            uColor2: { value: new THREE.Color(SETTINGS.color2) },
            uColor3: { value: new THREE.Color(SETTINGS.color3) },
            uColor4: { value: new THREE.Color(SETTINGS.color4) },
            uBgColor: { value: new THREE.Color(SETTINGS.bgColor) },
            uDataTexture: { value: dataTexture }
        };

        const material = new THREE.ShaderMaterial({
            vertexShader: wallVertexShader,
            fragmentShader: wallFragmentShader,
            uniforms,
            side: THREE.BackSide,
            transparent: false
        });

        const geometry = new THREE.CylinderGeometry(100, 100, 80, 256, 32, true);
        const wall = new THREE.Mesh(geometry, material);
        tunnelGroup.add(wall);

        // Floating Lint / Airborne Micro-Motes in Raking Beam
        const moteCount = 600;
        const moteGeometry = new THREE.BufferGeometry();
        const motePositions = new Float32Array(moteCount * 3);
        const moteSpeeds = new Float32Array(moteCount);
        const motePhases = new Float32Array(moteCount);

        for (let i = 0; i < moteCount; i++) {
            const angle = Math.random() * Math.PI * 2;
            const radius = 80.0 + Math.random() * 19.0;
            motePositions[i * 3] = Math.cos(angle) * radius;
            motePositions[i * 3 + 1] = -25.0 + Math.random() * 50.0;
            motePositions[i * 3 + 2] = Math.sin(angle) * radius;
            moteSpeeds[i] = 0.2 + Math.random() * 0.8;
            motePhases[i] = Math.random() * Math.PI * 2;
        }

        moteGeometry.setAttribute('position', new THREE.BufferAttribute(motePositions, 3));
        moteGeometry.setAttribute('aSpeed', new THREE.BufferAttribute(moteSpeeds, 1));
        moteGeometry.setAttribute('aPhase', new THREE.BufferAttribute(motePhases, 1));

        const moteUniforms = {
            uTime: { value: 0 },
            uSpeed: { value: SETTINGS.speed }
        };

        const moteMaterial = new THREE.ShaderMaterial({
            uniforms: moteUniforms,
            vertexShader: `
                uniform float uTime;
                uniform float uSpeed;
                attribute float aSpeed;
                attribute float aPhase;
                varying float vAlpha;

                void main() {
                    vec3 pos = position;
                    float t = uTime * uSpeed * 0.25 * aSpeed + aPhase;
                    pos.x += sin(t * 1.5) * 1.5;
                    pos.y += cos(t * 1.1) * 2.0;
                    pos.z += sin(t * 1.3) * 1.5;

                    vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                    gl_PointSize = clamp(35.0 / -mvPosition.z, 1.5, 9.0);
                    gl_Position = projectionMatrix * mvPosition;

                    vAlpha = smoothstep(36.0, 20.0, abs(pos.y)) * 0.45;
                }
            `,
            fragmentShader: `
                varying float vAlpha;
                void main() {
                    vec2 xy = gl_PointCoord.xy - vec2(0.5);
                    float d = length(xy);
                    if (d > 0.5) discard;
                    float soft = smoothstep(0.5, 0.05, d);
                    gl_FragColor = vec4(0.92, 0.88, 0.82, vAlpha * soft);
                }
            `,
            transparent: true,
            blending: THREE.NormalBlending,
            depthWrite: false
        });

        const motes = new THREE.Points(moteGeometry, moteMaterial);
        tunnelGroup.add(motes);

        const composer = new EffectComposer(renderer);
        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);

        // Macro Peripheral Blur (Soft Tilt-Shift Macro Depth of Field)
        const PeripheralBlurShader = {
            uniforms: {
                tDiffuse: { value: null },
                uStrength: { value: SETTINGS.edgeBlurStrength },
                uAspect: { value: window.innerWidth / window.innerHeight }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D tDiffuse;
                uniform float uStrength;
                uniform float uAspect;
                varying vec2 vUv;

                void main() {
                    vec2 center = vec2(0.5, 0.5);
                    vec2 uvCorrection = vec2(uAspect, 1.0);
                    float dist = length((vUv - center) * uvCorrection);

                    float blurMask = smoothstep(0.25, 0.78, dist);
                    if (blurMask <= 0.0) {
                        gl_FragColor = texture2D(tDiffuse, vUv);
                        return;
                    }

                    const int SAMPLES = 24;
                    const float GOLDEN_ANGLE = 2.39996323;
                    vec4 color = vec4(0.0);
                    float radius = uStrength * blurMask;

                    for (int i = 0; i < SAMPLES; i++) {
                        float r = sqrt(float(i) + 0.5) / sqrt(float(SAMPLES));
                        float theta = float(i) * GOLDEN_ANGLE;
                        vec2 offset = vec2(cos(theta), sin(theta)) * r * radius;
                        offset.x /= uAspect;
                        color += texture2D(tDiffuse, vUv + offset);
                    }
                    gl_FragColor = color / float(SAMPLES);
                }
            `
        };
        const peripheralBlurPass = new ShaderPass(PeripheralBlurShader);
        composer.addPass(peripheralBlurPass);

        // Macro Lens Subtle Chromatic Fringe
        const ChromaticAberrationShader = {
            uniforms: {
                tDiffuse: { value: null },
                uAmount: { value: SETTINGS.chromaticAberration }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D tDiffuse;
                uniform float uAmount;
                varying vec2 vUv;

                void main() {
                    vec2 offset = uAmount * (vec2(0.5) - vUv);
                    vec4 cr = texture2D(tDiffuse, vUv + offset);
                    vec4 cga = texture2D(tDiffuse, vUv);
                    vec4 cb = texture2D(tDiffuse, vUv - offset);
                    gl_FragColor = vec4(cr.r, cga.g, cb.b, cga.a);
                }
            `
        };
        const caPass = new ShaderPass(ChromaticAberrationShader);
        composer.addPass(caPass);

        // Subtle Macro Softness Bloom (Near Zero for Matte Textile Look)
        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            SETTINGS.bloomStrength,
            SETTINGS.bloomRadius,
            0.88
        );
        composer.addPass(bloomPass);

        const updateBackground = () => {
            const activeBg = SETTINGS.greenScreen ? SETTINGS.greenScreenColor : SETTINGS.bgColor;
            uniforms.uBgColor.value.set(activeBg);
            scene.background.set(activeBg);
            scene.fog.color.set(activeBg);
            document.body.style.backgroundColor = activeBg;
        };

        const updateColors = () => {
            uniforms.uColor1.value.set(SETTINGS.color1);
            uniforms.uColor2.value.set(SETTINGS.color2);
            uniforms.uColor3.value.set(SETTINGS.color3);
            uniforms.uColor4.value.set(SETTINGS.color4);
            updateBackground();
        };

        const applyColorScheme = (schemeName) => {
            if (COLOR_SCHEMES[schemeName]) {
                const s = COLOR_SCHEMES[schemeName];
                SETTINGS.color1 = s.color1;
                SETTINGS.color2 = s.color2;
                SETTINGS.color3 = s.color3;
                SETTINGS.color4 = s.color4;
                SETTINGS.bgColor = s.bgColor;
                updateColors();
                gui.controllersRecursive().forEach(c => {
                    if (['color1', 'color2', 'color3', 'color4', 'bgColor'].includes(c.property)) {
                        c.updateDisplay();
                    }
                });
            }
        };

        const updateObjectTransform = () => {
            tunnelGroup.position.x = SETTINGS.objectX;
            tunnelGroup.position.y = SETTINGS.objectY;
            tunnelGroup.scale.set(
                SETTINGS.curveWidth * SETTINGS.zoom,
                SETTINGS.height * SETTINGS.zoom,
                SETTINGS.curveDepth * SETTINGS.zoom
            );
            tunnelGroup.rotation.z = SETTINGS.wallTilt * Math.PI / 180;
        };

        // Procedural Variation Generator upon User Click
        const randomizeScene = () => {
            const schemeKeys = Object.keys(COLOR_SCHEMES);
            const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
            SETTINGS.colorScheme = randomScheme;
            applyColorScheme(randomScheme);

            SETTINGS.warpDensity = parseFloat((0.6 + Math.random() * 1.2).toFixed(2));
            SETTINGS.weftDensity = parseFloat((0.6 + Math.random() * 1.2).toFixed(2));
            SETTINGS.threadThickness = parseFloat((0.75 + Math.random() * 0.45).toFixed(2));
            SETTINGS.tension = parseFloat((0.5 + Math.random() * 0.9).toFixed(2));
            SETTINGS.sheenStrength = parseFloat((0.15 + Math.random() * 0.6).toFixed(2));
            SETTINGS.rakingAngle = Math.floor(Math.random() * 360);
            SETTINGS.rakingElevation = Math.floor(12 + Math.random() * 45);
            SETTINGS.curveSoftness = parseFloat((2.5 + Math.random() * 6.0).toFixed(1));

            uniforms.uWarpDensity.value = SETTINGS.warpDensity;
            uniforms.uWeftDensity.value = SETTINGS.weftDensity;
            uniforms.uThreadThickness.value = SETTINGS.threadThickness;
            uniforms.uTension.value = SETTINGS.tension;
            uniforms.uSheenStrength.value = SETTINGS.sheenStrength;
            uniforms.uRakingAngle.value = SETTINGS.rakingAngle;
            uniforms.uRakingElevation.value = SETTINGS.rakingElevation;
            uniforms.uCurveSoftness.value = SETTINGS.curveSoftness;

            updateObjectTransform();
            gui.controllersRecursive().forEach(c => c.updateDisplay());
        };

        // Initialize GUI
        const gui = new GUI({ title: 'Warp & Weft — Inspection Settings' });

        const fPalettes = gui.addFolder('Color Schemes');
        fPalettes.add(SETTINGS, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Palette Scheme').onChange(applyColorScheme);
        fPalettes.addColor(SETTINGS, 'color1').name('Warp Color 1').onChange(updateColors);
        fPalettes.addColor(SETTINGS, 'color2').name('Weft Color 2').onChange(updateColors);
        fPalettes.addColor(SETTINGS, 'color3').name('Warp Accent 3').onChange(updateColors);
        fPalettes.addColor(SETTINGS, 'color4').name('Weft Accent 4').onChange(updateColors);
        fPalettes.addColor(SETTINGS, 'bgColor').name('Background Color').onChange(updateColors);
        fPalettes.add(SETTINGS, 'greenScreen').name('Green Screen').onChange(updateBackground);
        fPalettes.addColor(SETTINGS, 'greenScreenColor').name('Green Color').onChange(updateBackground);

        const fAnim = gui.addFolder('Animation & Motion');
        const ANIMATION_MODES = [
            'Static (Macro Inspection)',
            'Raking Light Sweep',
            'Loom Weft Feed',
            'Tension Quality Scan',
            'Macro Depth Breathing',
            'Diagonal Warp Drift',
            'Textile Loom Roll',
            'Micro-Fibril Resonance'
        ];
        fAnim.add(SETTINGS, 'animationMode', ANIMATION_MODES).name('Animation Mode');
        fAnim.add(SETTINGS, 'speed', 0.0, 4.0).step(0.05).name('Animation Speed').onChange(v => {
            uniforms.uSpeed.value = v;
            moteUniforms.uSpeed.value = v;
        });
        fAnim.add(SETTINGS, 'clickRandomize').name('Click to Randomize');

        const fWeave = gui.addFolder('Weave & Thread Structure');
        fWeave.add(SETTINGS, 'warpDensity', 0.3, 3.0).step(0.05).name('Warp Density').onChange(v => uniforms.uWarpDensity.value = v);
        fWeave.add(SETTINGS, 'weftDensity', 0.3, 3.0).step(0.05).name('Weft Density').onChange(v => uniforms.uWeftDensity.value = v);
        fWeave.add(SETTINGS, 'threadThickness', 0.4, 1.6).step(0.02).name('Thread Gauge').onChange(v => uniforms.uThreadThickness.value = v);
        fWeave.add(SETTINGS, 'tension', 0.2, 1.8).step(0.02).name('Loom Tension').onChange(v => uniforms.uTension.value = v);
        fWeave.add(SETTINGS, 'sheenStrength', 0.0, 1.2).step(0.02).name('Fiber Sheen').onChange(v => uniforms.uSheenStrength.value = v);

        const fLight = gui.addFolder('Raking Light Inspection');
        fLight.add(SETTINGS, 'rakingAngle', 0, 360).step(1).name('Raking Angle (deg)').onChange(v => uniforms.uRakingAngle.value = v);
        fLight.add(SETTINGS, 'rakingElevation', 5, 80).step(1).name('Grazing Altitude').onChange(v => uniforms.uRakingElevation.value = v);
        fLight.add(SETTINGS, 'rakingIntensity', 0.2, 2.5).step(0.05).name('Beam Intensity').onChange(v => uniforms.uRakingIntensity.value = v);

        const fGeometry = gui.addFolder('Geometry & Framing');
        fGeometry.add(SETTINGS, 'curveSoftness', 1.0, 10.0).name('Cloth Curvature').onChange(v => uniforms.uCurveSoftness.value = v);
        fGeometry.add(SETTINGS, 'curveWidth', 0.2, 5.0).name('Loom Width').onChange(updateObjectTransform);
        fGeometry.add(SETTINGS, 'curveDepth', 0.2, 5.0).name('Loom Depth').onChange(updateObjectTransform);
        fGeometry.add(SETTINGS, 'height', 0.2, 3.0).name('Fabric Height').onChange(updateObjectTransform);
        fGeometry.add(SETTINGS, 'zoom', 0.15, 5.0).name('Macro Zoom').onChange(updateObjectTransform);
        fGeometry.add(SETTINGS, 'objectX', -100.0, 100.0).name('Position X').onChange(updateObjectTransform);
        fGeometry.add(SETTINGS, 'objectY', -60.0, 60.0).name('Position Y').onChange(updateObjectTransform);
        fGeometry.add(SETTINGS, 'wallTilt', -180, 180).name('Loom Tilt (deg)').onChange(updateObjectTransform);
        fGeometry.add(SETTINGS, 'fov', 20, 120).name('Camera FOV').onChange(v => {
            camera.fov = v;
            camera.updateProjectionMatrix();
        });

        const fOptics = gui.addFolder('Optics & Macro Lens');
        fOptics.add(SETTINGS, 'bloomStrength', 0.0, 0.6).step(0.01).name('Macro Softness').onChange(v => bloomPass.strength = v);
        fOptics.add(SETTINGS, 'bloomRadius', 0.0, 2.0).step(0.05).name('Softness Radius').onChange(v => bloomPass.radius = v);
        fOptics.add(SETTINGS, 'chromaticAberration', 0.0, 0.02).step(0.0005).name('Lens Fringe').onChange(v => caPass.uniforms.uAmount.value = v);
        fOptics.add(SETTINGS, 'edgeBlurStrength', 0.0, 0.05).step(0.001).name('Tilt-Shift Blur').onChange(v => peripheralBlurPass.uniforms.uStrength.value = v);
        fOptics.add(SETTINGS, 'dpr', 0.5, 3.0).step(0.1).name('DPR').onChange(v => {
            renderer.setPixelRatio(v);
            composer.setPixelRatio(v);
        });

        gui.close();

        // Drag & Zoom Interactivity
        const dragState = {
            active: false,
            pointerId: null,
            startX: 0,
            startY: 0,
            objX: 0,
            objY: 0
        };

        renderer.domElement.addEventListener('wheel', event => {
            event.preventDefault();
            const zoomFactor = event.deltaY > 0 ? 0.92 : 1.08;
            SETTINGS.zoom = THREE.MathUtils.clamp(SETTINGS.zoom * zoomFactor, 0.15, 5.0);
            updateObjectTransform();
            gui.controllersRecursive().find(controller => controller.property === 'zoom')?.updateDisplay();
        }, { passive: false });

        renderer.domElement.addEventListener('pointerdown', event => {
            if (event.button !== 0) return;
            dragState.active = true;
            dragState.pointerId = event.pointerId;
            dragState.startX = event.clientX;
            dragState.startY = event.clientY;
            dragState.objX = SETTINGS.objectX;
            dragState.objY = SETTINGS.objectY;
            renderer.domElement.setPointerCapture(event.pointerId);
        });

        renderer.domElement.addEventListener('pointermove', event => {
            if (!dragState.active || event.pointerId !== dragState.pointerId) return;
            const worldUnitsPerPixel = 0.12 / SETTINGS.zoom;
            SETTINGS.objectX = dragState.objX + (event.clientX - dragState.startX) * worldUnitsPerPixel;
            SETTINGS.objectY = dragState.objY - (event.clientY - dragState.startY) * worldUnitsPerPixel;
            updateObjectTransform();
        });

        const endDrag = event => {
            if (!dragState.active || event.pointerId !== dragState.pointerId) return;
            dragState.active = false;
            renderer.domElement.releasePointerCapture(event.pointerId);

            const dragDistance = Math.hypot(event.clientX - dragState.startX, event.clientY - dragState.startY);
            if (dragDistance < 6 && SETTINGS.clickRandomize) {
                randomizeScene();
            }

            gui.controllersRecursive().forEach(controller => {
                if (controller.property === 'objectX' || controller.property === 'objectY') {
                    controller.updateDisplay();
                }
            });
        };

        renderer.domElement.addEventListener('pointerup', endDrag);
        renderer.domElement.addEventListener('pointercancel', endDrag);

        // Hide/Show UI with 'H' Key
        window.addEventListener('keydown', event => {
            if (event.key === 'h' || event.key === 'H') {
                gui._hidden ? gui.show() : gui.hide();
            }
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsed = clock.getElapsedTime();
            const spd = SETTINGS.speed;

            uniforms.uTime.value = elapsed;
            moteUniforms.uTime.value = elapsed;

            // Handle 8 Preconfigured Animation Modes
            switch (SETTINGS.animationMode) {
                case 'Static (Macro Inspection)':
                    camera.position.set(0, SETTINGS.cameraY, 0);
                    camera.rotation.set(0, 0, 0);
                    uniforms.uWarpOffset.value = 0.0;
                    uniforms.uWeftOffset.value = 0.0;
                    uniforms.uTensionVibe.value = 0.0;
                    uniforms.uRakingAngle.value = SETTINGS.rakingAngle;
                    break;

                case 'Raking Light Sweep':
                    camera.position.set(0, SETTINGS.cameraY, 0);
                    camera.rotation.set(0, 0, 0);
                    uniforms.uRakingAngle.value = (SETTINGS.rakingAngle + elapsed * spd * 22.0) % 360.0;
                    uniforms.uWarpOffset.value = 0.0;
                    uniforms.uWeftOffset.value = 0.0;
                    uniforms.uTensionVibe.value = 0.0;
                    break;

                case 'Loom Weft Feed':
                    camera.position.set(0, SETTINGS.cameraY + Math.sin(elapsed * 0.6 * spd) * 0.4, 0);
                    camera.rotation.set(0, 0, 0);
                    uniforms.uWeftOffset.value = elapsed * spd * 1.4;
                    uniforms.uWarpOffset.value = 0.0;
                    uniforms.uTensionVibe.value = 0.0;
                    uniforms.uRakingAngle.value = SETTINGS.rakingAngle;
                    break;

                case 'Tension Quality Scan':
                    camera.position.x = Math.sin(elapsed * 0.3 * spd) * 1.6;
                    camera.position.y = SETTINGS.cameraY + Math.cos(elapsed * 0.35 * spd) * 1.2;
                    camera.position.z = 0;
                    camera.rotation.y = Math.sin(elapsed * 0.25 * spd) * 0.25;
                    camera.rotation.x = Math.cos(elapsed * 0.3 * spd) * 0.06;
                    uniforms.uWarpOffset.value = 0.0;
                    uniforms.uWeftOffset.value = 0.0;
                    uniforms.uTensionVibe.value = 0.0;
                    uniforms.uRakingAngle.value = SETTINGS.rakingAngle;
                    break;

                case 'Macro Depth Breathing':
                    camera.position.set(0, SETTINGS.cameraY, 0);
                    camera.rotation.set(0, 0, 0);
                    camera.fov = SETTINGS.fov + Math.sin(elapsed * 0.45 * spd) * 3.5;
                    camera.updateProjectionMatrix();
                    uniforms.uWarpOffset.value = Math.sin(elapsed * 0.2 * spd) * 0.5;
                    uniforms.uWeftOffset.value = Math.cos(elapsed * 0.2 * spd) * 0.5;
                    uniforms.uTensionVibe.value = 0.0;
                    uniforms.uRakingAngle.value = SETTINGS.rakingAngle;
                    break;

                case 'Diagonal Warp Drift':
                    camera.position.set(0, SETTINGS.cameraY, 0);
                    camera.rotation.set(0, 0, 0);
                    uniforms.uWarpOffset.value = elapsed * spd * 0.8;
                    uniforms.uWeftOffset.value = elapsed * spd * 0.8;
                    uniforms.uTensionVibe.value = 0.0;
                    uniforms.uRakingAngle.value = SETTINGS.rakingAngle;
                    break;

                case 'Textile Loom Roll':
                    camera.position.set(0, SETTINGS.cameraY, 0);
                    camera.rotation.x = 0;
                    camera.rotation.y = elapsed * spd * 0.08;
                    camera.rotation.z = 0;
                    uniforms.uWarpOffset.value = 0.0;
                    uniforms.uWeftOffset.value = 0.0;
                    uniforms.uTensionVibe.value = 0.0;
                    uniforms.uRakingAngle.value = SETTINGS.rakingAngle;
                    break;

                case 'Micro-Fibril Resonance':
                    camera.position.x = Math.sin(elapsed * 0.2 * spd) * 1.0;
                    camera.position.y = SETTINGS.cameraY + Math.cos(elapsed * 0.25 * spd) * 0.6;
                    camera.position.z = 0;
                    camera.rotation.y = Math.sin(elapsed * 0.15 * spd) * 0.15;
                    uniforms.uTensionVibe.value = Math.sin(elapsed * 9.0 * spd) * 0.04;
                    uniforms.uWarpOffset.value = 0.0;
                    uniforms.uWeftOffset.value = 0.0;
                    uniforms.uRakingAngle.value = SETTINGS.rakingAngle;
                    break;
            }

            composer.render();
        }

        updateBackground();
        updateObjectTransform();
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
            peripheralBlurPass.uniforms.uAspect.value = window.innerWidth / window.innerHeight;
        });
    </script>
</body>
</html>
