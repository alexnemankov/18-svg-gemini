  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0B132B;
    }
    #webgl {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
    }
  </style>

  <script type="importmap">

    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",

      "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
    }
  }
  </script>
</head>
<body>
  <canvas id="webgl"></canvas>

  <script type="module">

    // --- 18 PRECONFIGURED COLOR SCHEMES ---
    const COLOR_SCHEMES = {

      },

        spiderColor: '#090213',
        webColor: '#abf7d4',
        bgColor: '#070211',
        accentColor: '#07bbd9'
      },
      'Achromatic (black and white version)': {

      },

      },

      },
      'Palette 3 (AA60C8, D69ADE, C9A3C6, CFB5C2, 0D001D, 120A12)': {

        spiderColor: '#0D001D',

      },
      'Palette 4 (FEF1BE, FFBA00, 008189, 00474D, 061210)': {
        sacColor: '#00474D',
        sacGlow: '#008189',
        spiderColor: '#061210',
        webColor: '#FEF1BE',
        bgColor: '#061210',
        accentColor: '#FFBA00'
      },
      'Palette 5 (D4FFB0, 7FFF00, 00B894, 0A3322, 05140A)': {
        sacColor: '#0A3322',
        sacGlow: '#00B894',
        spiderColor: '#05140A',
        webColor: '#D4FFB0',
        bgColor: '#05140A',
        accentColor: '#7FFF00'
      },
      'Palette 6 (FFE8CC, FF8C00, C7501A, 3D1050, 0E0618)': {
        sacColor: '#3D1050',
        sacGlow: '#C7501A',
        spiderColor: '#0E0618',
        webColor: '#FFE8CC',
        bgColor: '#0E0618',
        accentColor: '#FF8C00'
      },
      'Palette 7 (E8E0FF, B38FFF, 6A3DE8, 1A1250, 090612)': {
        sacColor: '#1A1250',
        sacGlow: '#6A3DE8',
        spiderColor: '#090612',
        webColor: '#E8E0FF',
        bgColor: '#090612',
        accentColor: '#B38FFF'
      },
      'Palette 8 (E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)': {
        sacColor: '#1E0A3D',
        sacGlow: '#D40078',
        spiderColor: '#05020F',
        webColor: '#E0FBFF',
        bgColor: '#05020F',
        accentColor: '#00F0FF'
      }
    };

    // --- 8 PRECONFIGURED CAMERA ANIMATIONS ---
    const ANIMATIONS = [
      'Static Observation',
      'Slow Orbiting Crawl',
      'Gentle Pendulum Sway',
      'Breathing Macro Zoom',
      'Spiral Descent',
      'Creeping Tilt & Pan',
      'Suspended Drifting',
      'Egg Sac Inspection'
    ];

    // Initial Parameters
    const defaultSchemeKey = 'Palette 2 (63D1CF, 5BC0BE, 4BAD9E, 4BAD9E, 0B132B, 000000)';
    const initialScheme = COLOR_SCHEMES[defaultSchemeKey];

    const params = {
      colorScheme: defaultSchemeKey,
      sacColor: initialScheme.sacColor,
      sacGlow: initialScheme.sacGlow,
      spiderColor: initialScheme.spiderColor,
      webColor: initialScheme.webColor,
      bgColor: initialScheme.bgColor,
      accentColor: initialScheme.accentColor,
      greenscreen: false,

      animation: 'Slow Orbiting Crawl',
      animationSpeed: 1.0,
      pixelRatio: Math.min(window.devicePixelRatio || 1, 2),

      pulseRate: 0.95,
      pulseIntensity: 0.26,

      spiderSpeed: 1.0,
      spiderScale: 1.0,

      webOpacity: 0.45,
      clickToRandomize: true
    };

    // --- SETUP SCENE, RENDERER, CAMERA ---
    const canvas = document.getElementById('webgl');
    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(params.pixelRatio);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(params.bgColor);
    scene.fog = new THREE.FogExp2(params.bgColor, 0.05);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0.5, 6.2);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.enableZoom = true;
    controls.enablePan = true;
    controls.enableRotate = true;
    controls.target.set(0, 0.1, 0);

    // Track user drag interaction to blend camera animations smoothly
    let isUserInteracting = false;
    let userInteractCooldown = 0;
    controls.addEventListener('start', () => {
      isUserInteracting = true;
      userInteractCooldown = 2.0;
    });
    controls.addEventListener('end', () => {
      isUserInteracting = false;
    });

    // --- LIGHTING ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.35);
    scene.add(ambientLight);

    const internalLight = new THREE.PointLight(params.sacGlow, 4.0, 7.0, 1.4);
    internalLight.position.set(0, 0.15, 0);
    scene.add(internalLight);

    const keyLight = new THREE.DirectionalLight(0xffffff, 1.6);
    keyLight.position.set(4, 5, 4);
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(params.accentColor, 2.2);
    rimLight.position.set(-3.5, -2, -4);
    scene.add(rimLight);

    const topStalkLight = new THREE.PointLight(params.accentColor, 1.5, 4.0, 1.8);
    topStalkLight.position.set(0, 2.6, 0);
    scene.add(topStalkLight);

    // --- PULSE EQUATION (Sharp inflation, slow deflation) ---
    function getAsymmetricPulse(time, rate) {
      const cycle = (time * rate) % 1.0;
      if (cycle < 0.13) {
        // Sharp cardiac expansion
        const tIn = cycle / 0.13;
        return Math.sin(tIn * Math.PI * 0.5);
      } else {
        // Slow biological deflation with subtle dicrotic twitch
        const tDecay = (cycle - 0.13) / 0.87;
        const mainDecay = Math.exp(-tDecay * 3.7);
        const flutter = 0.16 * Math.exp(-Math.pow((cycle - 0.28) / 0.065, 2.0));
        return mainDecay + flutter;
      }
    }

    // --- EGG SAC PARAMETRIC SURFACE ---
    // Evaluates 3D coordinates & normal for any given UV and current pulse value
    function evaluateSacSurface(u, v, pulseVal, outPos, outNorm) {
      const theta = u * Math.PI * 2.0;
      const phi = v * Math.PI; // 0 = top suspension stalk, PI = bottom tip

      // Base teardrop / pear-shaped profile
      const baseRadius = 1.95;
      const profile = 1.0 + 0.38 * Math.sin(phi) - 0.28 * Math.cos(phi) - 0.16 * Math.sin(2.0 * phi);

      // Height distribution (stalk reaches up towards ceiling)
      const yBase = -2.65 * Math.cos(phi) + 0.2;

      // Radial extent in XZ plane
      let rXZ = baseRadius * Math.sin(phi) * profile;
      if (rXZ < 0.04) rXZ = 0.04;

      // Organic longitudinal veins & biological lobe bumps
      const veinTexture = 0.04 * Math.sin(7.0 * theta + 3.0 * phi) * Math.cos(4.0 * phi)
                        + 0.025 * Math.sin(13.0 * theta - 2.0 * phi);
      const lobeTexture = 0.03 * Math.sin(3.0 * theta) * Math.sin(phi);

      // Asymmetric pulse displacement along surface normal
      // Bulbous center expands most dramatically
      const bellyWeight = Math.pow(Math.sin(phi), 1.2);
      const pulseDisp = pulseVal * params.pulseIntensity * (0.35 + 0.9 * bellyWeight);

      const totalRadius = rXZ * (1.0 + veinTexture + lobeTexture) + pulseDisp;

      outPos.x = totalRadius * Math.cos(theta);
      outPos.y = yBase + pulseDisp * 0.1;
      outPos.z = totalRadius * Math.sin(theta);

      if (outNorm) {
        const eps = 0.005;
        // Tangent in U
        const u2 = (u + eps) % 1.0;
        const th2 = u2 * Math.PI * 2.0;
        const pUx = totalRadius * Math.cos(th2);
        const pUy = outPos.y;
        const pUz = totalRadius * Math.sin(th2);

        // Tangent in V
        const v2 = Math.min(0.99, Math.max(0.01, v + eps));
        const phi2 = v2 * Math.PI;
        const prof2 = 1.0 + 0.38 * Math.sin(phi2) - 0.28 * Math.cos(phi2) - 0.16 * Math.sin(2.0 * phi2);
        const y2 = -2.65 * Math.cos(phi2) + 0.2;
        const rXZ2 = Math.max(0.04, baseRadius * Math.sin(phi2) * prof2) + pulseDisp;
        const pVx = rXZ2 * Math.cos(theta);
        const pVy = y2 + pulseDisp * 0.1;
        const pVz = rXZ2 * Math.sin(theta);

        const dUx = pUx - outPos.x, dUy = pUy - outPos.y, dUz = pUz - outPos.z;
        const dVx = pVx - outPos.x, dVy = pVy - outPos.y, dVz = pVz - outPos.z;

        outNorm.x = dUy * dVz - dUz * dVy;
        outNorm.y = dUz * dVx - dUx * dVz;
        outNorm.z = dUx * dVy - dUy * dVx;
        outNorm.normalize();
      }
    }

    // --- CREATE PULSING EGG SAC MESH ---
    const sacSegmentsW = 128;
    const sacSegmentsH = 128;
    const sacGeometry = new THREE.SphereGeometry(1.0, sacSegmentsW, sacSegmentsH);
    const vertexCount = sacGeometry.attributes.position.count;

    // Precalculate baseline rest vertices, normals, and belly displacement weights
    const basePositions = new Float32Array(vertexCount * 3);
    const baseNormals = new Float32Array(vertexCount * 3);
    const bellyWeights = new Float32Array(vertexCount);

    const tempV = new THREE.Vector3();
    const tempN = new THREE.Vector3();

    for (let i = 0; i < vertexCount; i++) {
      const u = sacGeometry.attributes.uv.getX(i);
      const v = sacGeometry.attributes.uv.getY(i);

      evaluateSacSurface(u, v, 0.0, tempV, tempN);

      const i3 = i * 3;
      basePositions[i3] = tempV.x;
      basePositions[i3 + 1] = tempV.y;
      basePositions[i3 + 2] = tempV.z;

      baseNormals[i3] = tempN.x;
      baseNormals[i3 + 1] = tempN.y;
      baseNormals[i3 + 2] = tempN.z;

      const phi = v * Math.PI;
      bellyWeights[i] = 0.35 + 0.9 * Math.pow(Math.sin(phi), 1.2);
    }

    // Initialize position attribute to baseline
    sacGeometry.attributes.position.array.set(basePositions);
    sacGeometry.attributes.position.needsUpdate = true;
    sacGeometry.computeVertexNormals();

    // Silken membrane translucent PBR material
    const sacMaterial = new THREE.MeshPhysicalMaterial({
      color: new THREE.Color(params.sacColor),
      emissive: new THREE.Color(params.sacGlow),
      emissiveIntensity: 0.25,
      roughness: 0.38,
      metalness: 0.08,
      transmission: 0.65,
      thickness: 1.4,
      ior: 1.44,
      sheen: 1.0,
      sheenColor: new THREE.Color(params.accentColor),
      sheenRoughness: 0.45,
      clearcoat: 0.3,
      clearcoatRoughness: 0.25,
      side: THREE.DoubleSide
    });

    const sacMesh = new THREE.Mesh(sacGeometry, sacMaterial);
    scene.add(sacMesh);

    // --- CEILING SUSPENSION CABLES & FIBROUS SILK MESH ---
    const webGroup = new THREE.Group();
    scene.add(webGroup);

    // Ceiling Anchor structure
    const ceilingY = 5.2;
    const anchorCount = 18;
    const webLinePositions = [];

    // Suspension cords anchoring egg sac to ceiling
    for (let i = 0; i < anchorCount; i++) {
      const angle = (i / anchorCount) * Math.PI * 2.0;
      const spreadR = 2.4 + Math.sin(i * 3.0) * 0.8;
      const topAnchor = new THREE.Vector3(
        spreadR * Math.cos(angle),
        ceilingY,
        spreadR * Math.sin(angle)
      );

      // Upper stalk attachment points on sac
      const attachU = (i / anchorCount + 0.05 * Math.sin(i)) % 1.0;
      const attachV = 0.08 + (i % 3) * 0.06;
      evaluateSacSurface(attachU, attachV, 0.0, tempV, null);

      // Catmull-Rom silk curve with natural gravitational drape
      const midPoint = new THREE.Vector3().lerpVectors(topAnchor, tempV, 0.5);
      midPoint.x += (Math.random() - 0.5) * 0.3;
      midPoint.y -= 0.25 + Math.random() * 0.2;
      midPoint.z += (Math.random() - 0.5) * 0.3;

      const curve = new THREE.CatmullRomCurve3([topAnchor, midPoint, tempV.clone()]);
      const pts = curve.getPoints(24);
      for (let j = 0; j < pts.length - 1; j++) {
        webLinePositions.push(
          pts[j].x, pts[j].y, pts[j].z,
          pts[j + 1].x, pts[j + 1].y, pts[j + 1].z
        );
      }
    }

    // Tangled cocoon orbital strands wrapping the sac
    const orbitalWraps = 32;
    for (let w = 0; w < orbitalWraps; w++) {
      const vLevel = 0.15 + (w / orbitalWraps) * 0.72;
      const turns = 1.0 + (w % 2) * 0.5;
      const segs = 36;
      const wrapPts = [];

      for (let s = 0; s <= segs; s++) {
        const uVal = ((s / segs) * turns + w * 0.1) % 1.0;
        const vNoise = vLevel + Math.sin(s * 0.4 + w) * 0.03;
        evaluateSacSurface(uVal, Math.min(0.92, Math.max(0.08, vNoise)), 0.0, tempV, tempN);
        // Slightly offset outward from membrane
        tempV.addScaledVector(tempN, 0.03 + Math.random() * 0.04);
        wrapPts.push(tempV.clone());
      }

      for (let j = 0; j < wrapPts.length - 1; j++) {
        webLinePositions.push(
          wrapPts[j].x, wrapPts[j].y, wrapPts[j].z,
          wrapPts[j + 1].x, wrapPts[j + 1].y, wrapPts[j + 1].z
        );
      }
    }

    // Cross-connecting chaotic micro-filaments
    for (let c = 0; c < 120; c++) {
      const u1 = Math.random();
      const v1 = 0.18 + Math.random() * 0.68;
      evaluateSacSurface(u1, v1, 0.0, tempV, tempN);
      const p1 = tempV.clone().addScaledVector(tempN, 0.04 + Math.random() * 0.06);

      const u2 = (u1 + (Math.random() - 0.5) * 0.18 + 1.0) % 1.0;
      const v2 = Math.min(0.88, Math.max(0.12, v1 + (Math.random() - 0.5) * 0.15));
      evaluateSacSurface(u2, v2, 0.0, tempV, tempN);
      const p2 = tempV.clone().addScaledVector(tempN, 0.04 + Math.random() * 0.06);

      webLinePositions.push(p1.x, p1.y, p1.z, p2.x, p2.y, p2.z);
    }

    const webGeometry = new THREE.BufferGeometry();
    webGeometry.setAttribute('position', new THREE.Float32BufferAttribute(webLinePositions, 3));

    const webMaterial = new THREE.LineBasicMaterial({
      color: new THREE.Color(params.webColor),
      transparent: true,
      opacity: params.webOpacity,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const webMesh = new THREE.LineSegments(webGeometry, webMaterial);
    webGroup.add(webMesh);

    // --- INSTANCED MESH MICRO-SPIDERS ---
    function buildSpiderPrototypeGeometry() {
      const geoms = [];

      // Cephalothorax (head/midsection)
      const headGeo = new THREE.SphereGeometry(0.042, 8, 6);
      headGeo.scale(0.85, 0.5, 0.85);
      headGeo.translate(0, 0.03, 0.03);
      geoms.push(headGeo);

      // Abdomen (larger bulbous rear)
      const abdomenGeo = new THREE.SphereGeometry(0.065, 9, 7);
      abdomenGeo.scale(0.9, 0.8, 1.25);
      abdomenGeo.translate(0, 0.045, -0.075);
      geoms.push(abdomenGeo);

      // 8 Jointed Legs (4 pairs radiating out from cephalothorax)
      const legAngles = [0.35, 0.8, 1.35, 1.85];
      for (let side = -1; side <= 1; side += 2) {
        for (let i = 0; i < 4; i++) {
          const angle = legAngles[i];
          const lFemur = 0.085;
          const lTarsus = 0.105;

          // Femur (arching up and outward)
          const femurGeo = new THREE.CylinderGeometry(0.007, 0.005, lFemur, 4);
          femurGeo.translate(0, lFemur * 0.5, 0);
          femurGeo.rotateZ(side * 0.72);
          femurGeo.rotateY(side * (angle - Math.PI * 0.5));
          femurGeo.translate(side * 0.022, 0.03, 0.02 - i * 0.022);
          geoms.push(femurGeo);

          // Tarsus (pointing downward to grip surface)
          const tarsusGeo = new THREE.CylinderGeometry(0.005, 0.0025, lTarsus, 4);
          tarsusGeo.translate(0, -lTarsus * 0.5, 0);
          tarsusGeo.rotateZ(side * -0.62);
          tarsusGeo.rotateY(side * (angle - Math.PI * 0.5));

          const jX = side * 0.022 + Math.sin(side * 0.72) * lFemur * side;
          const jY = 0.03 + Math.cos(side * 0.72) * lFemur;
          const jZ = 0.02 - i * 0.022;
          tarsusGeo.translate(jX, jY, jZ);
          geoms.push(tarsusGeo);
        }
      }

      const merged = BufferGeometryUtils.mergeGeometries(geoms, false);
      geoms.forEach(g => g.dispose());
      return merged;
    }

    const spiderProtoGeo = buildSpiderPrototypeGeometry();
    const SPIDER_COUNT = 750;

    const spiderMaterial = new THREE.MeshStandardMaterial({
      color: new THREE.Color(params.spiderColor),
      roughness: 0.25,
      metalness: 0.35
    });

    const spiderInstancedMesh = new THREE.InstancedMesh(spiderProtoGeo, spiderMaterial, SPIDER_COUNT);
    spiderInstancedMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    scene.add(spiderInstancedMesh);

    // Micro-spiders state simulation
    const spiders = [];
    for (let i = 0; i < SPIDER_COUNT; i++) {
      spiders.push({
        u: Math.random(),
        v: 0.14 + Math.random() * 0.74,
        speed: 0.65 + Math.random() * 0.7,
        scurryState: 1.0,
        pauseTimer: Math.random() * 2.0,
        twitchOffset: Math.random() * Math.PI * 2,
        driftBias: (Math.random() - 0.5) * 0.04
      });
    }

    // Continuous 2D Flow Field over surface UV coordinates
    function getFlowField(u, v, time) {
      // Dynamic curling flow streams across longitude and latitude
      const f1 = Math.sin(v * 6.5 + time * 0.25) * 2.2 + Math.cos(u * 8.0) * 1.5;
      const f2 = Math.cos(u * 6.0 - time * 0.2) * 1.8 + Math.sin(v * 7.5) * 1.4;

      const du = Math.sin(f1) * 0.04 + 0.012;
      const dv = Math.cos(f2) * 0.028 + Math.sin(u * Math.PI * 4.0) * 0.01;

      return { du, dv };
    }

    // Temporary math objects for spider transforms
    const dummy = new THREE.Object3D();
    const spiderPos = new THREE.Vector3();
    const spiderNorm = new THREE.Vector3();
    const nextPos = new THREE.Vector3();
    const spiderFwd = new THREE.Vector3();
    const spiderRight = new THREE.Vector3();
    const rotMatrix = new THREE.Matrix4();

    // --- COLOR PALETTE APPLIER ---
    function applyColorScheme(schemeKey) {
      const scheme = COLOR_SCHEMES[schemeKey];
      if (!scheme) return;

      params.sacColor = scheme.sacColor;
      params.sacGlow = scheme.sacGlow;
      params.spiderColor = scheme.spiderColor;
      params.webColor = scheme.webColor;
      params.bgColor = scheme.bgColor;
      params.accentColor = scheme.accentColor;

      updateMaterialColors();
    }

    function updateMaterialColors() {
      if (params.greenscreen) {
        scene.background.set('#00ff00');
        scene.fog = null;
      } else {
        scene.background.set(params.bgColor);
        if (!scene.fog) {
          scene.fog = new THREE.FogExp2(params.bgColor, 0.05);
        } else {
          scene.fog.color.set(params.bgColor);
        }
      }

      sacMaterial.color.set(params.sacColor);
      sacMaterial.emissive.set(params.sacGlow);
      sacMaterial.sheenColor.set(params.accentColor);

      internalLight.color.set(params.sacGlow);
      rimLight.color.set(params.accentColor);
      topStalkLight.color.set(params.accentColor);

      spiderMaterial.color.set(params.spiderColor);
      webMaterial.color.set(params.webColor);
      webMaterial.opacity = params.webOpacity;
    }

    // --- PROCEDURAL RANDOMIZATION ON CLICK ---
    function randomizeScene() {
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const randomSchemeKey = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      params.colorScheme = randomSchemeKey;
      applyColorScheme(randomSchemeKey);

      params.pulseRate = THREE.MathUtils.randFloat(0.65, 1.45);
      params.pulseIntensity = THREE.MathUtils.randFloat(0.18, 0.38);
      params.spiderSpeed = THREE.MathUtils.randFloat(0.6, 1.8);
      params.spiderScale = THREE.MathUtils.randFloat(0.75, 1.35);
      params.webOpacity = THREE.MathUtils.randFloat(0.3, 0.7);

      const animKeys = ANIMATIONS.filter(a => a !== params.animation);
      params.animation = animKeys[Math.floor(Math.random() * animKeys.length)];

      // Scatter spiders with fresh scurrying energy
      spiders.forEach(sp => {
        sp.speed = 0.55 + Math.random() * 0.9;
        sp.driftBias = (Math.random() - 0.5) * 0.06;
      });

      gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    // Click Detection for scene canvas (distinguish clicks from orbit/pan drags)
    let pointerDownX = 0;
    let pointerDownY = 0;
    let pointerDownTimestamp = 0;

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.lil-gui')) return;
      pointerDownX = e.clientX;
      pointerDownY = e.clientY;
      pointerDownTimestamp = performance.now();
    });

    window.addEventListener('pointerup', (e) => {
      if (e.target.closest('.lil-gui')) return;
      const dx = e.clientX - pointerDownX;
      const dy = e.clientY - pointerDownY;
      const dist = Math.hypot(dx, dy);
      const duration = performance.now() - pointerDownTimestamp;

      // Click threshold: minor travel and quick release
      if (dist < 6 && duration < 350) {
        if (params.clickToRandomize) {
          randomizeScene();
        }
      }
    });

    // --- HIDE/SHOW UI WITH "H" KEY ---
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        if (gui._hidden) {
          gui.show();
        } else {
          gui.hide();
        }
      }
    });

    // --- LIL-GUI SETUP ---
    const gui = new GUI({ title: 'Egg Sac Settings' });

    // Color Schemes & Themes
    const folderColors = gui.addFolder('Colors & Themes');
    folderColors.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Palette Presets').onChange((val) => {
      applyColorScheme(val);
      gui.controllersRecursive().forEach(c => c.updateDisplay());
    });
    folderColors.addColor(params, 'sacColor').name('Sac Shell').onChange(updateMaterialColors);
    folderColors.addColor(params, 'sacGlow').name('Embryo Glow').onChange(updateMaterialColors);
    folderColors.addColor(params, 'spiderColor').name('Spider Chitin').onChange(updateMaterialColors);
    folderColors.addColor(params, 'webColor').name('Silken Webs').onChange(updateMaterialColors);
    folderColors.addColor(params, 'bgColor').name('Background').onChange(updateMaterialColors);
    folderColors.addColor(params, 'accentColor').name('Rim Accent').onChange(updateMaterialColors);
    folderColors.add(params, 'greenscreen').name('Greenscreen (#00ff00)').onChange(updateMaterialColors);

    // Animation & Motion Settings
    const folderAnim = gui.addFolder('Motion & Camera');
    folderAnim.add(params, 'animation', ANIMATIONS).name('Camera Mode');
    folderAnim.add(params, 'animationSpeed', 0.1, 3.0, 0.05).name('Global Speed');
    folderAnim.add(params, 'pulseRate', 0.4, 2.2, 0.05).name('Pulse Frequency');
    folderAnim.add(params, 'pulseIntensity', 0.05, 0.55, 0.01).name('Pulse Amplitude');

    // Micro-Spider Swarm
    const folderSpiders = gui.addFolder('Spider Swarm');
    folderSpiders.add(params, 'spiderSpeed', 0.2, 3.0, 0.05).name('Crawl Speed');
    folderSpiders.add(params, 'spiderScale', 0.5, 2.0, 0.05).name('Spider Size');
    folderSpiders.add(params, 'webOpacity', 0.1, 0.9, 0.02).name('Web Density').onChange(updateMaterialColors);

    // System & Interaction
    const folderSystem = gui.addFolder('System & Interactivity');
    folderSystem.add(params, 'pixelRatio', 0.5, 3.0, 0.1).name('Pixel Ratio (DPR)').onChange((val) => {
      renderer.setPixelRatio(val);
    });
    folderSystem.add(params, 'clickToRandomize').name('Click Scene to Re-roll');

    // --- ANIMATION CHOREOGRAPHY ---
    function updateCameraAnimation(time, delta) {
      if (userInteractCooldown > 0) {
        userInteractCooldown -= delta;
        return;
      }
      if (isUserInteracting) return;

      const anim = params.animation;
      if (anim === 'Static Observation') {
        // No automated camera motion
        return;
      }

      if (anim === 'Slow Orbiting Crawl') {
        const rad = 6.2;
        const speed = time * 0.07;
        camera.position.x = THREE.MathUtils.lerp(camera.position.x, rad * Math.sin(speed), 0.04);
        camera.position.z = THREE.MathUtils.lerp(camera.position.z, rad * Math.cos(speed), 0.04);
        camera.position.y = THREE.MathUtils.lerp(camera.position.y, 0.5 + 0.5 * Math.sin(time * 0.12), 0.04);
        controls.target.lerp(new THREE.Vector3(0, 0.1, 0), 0.04);
      }
      else if (anim === 'Gentle Pendulum Sway') {
        const swayX = 4.6 * Math.sin(time * 0.16);
        const swayY = 0.5 + 0.55 * Math.cos(time * 0.12);
        const swayZ = 4.8 + 1.2 * Math.cos(time * 0.16);
        camera.position.lerp(new THREE.Vector3(swayX, swayY, swayZ), 0.04);
        controls.target.lerp(new THREE.Vector3(0, 0.2, 0), 0.04);
      }
      else if (anim === 'Breathing Macro Zoom') {
        const dist = 4.5 + 1.9 * Math.cos(time * 0.14);
        const ang = time * 0.045;
        const targetX = dist * Math.sin(ang);
        const targetZ = dist * Math.cos(ang);
        const targetY = 0.25 + 0.4 * Math.sin(time * 0.09);
        camera.position.lerp(new THREE.Vector3(targetX, targetY, targetZ), 0.035);
        controls.target.lerp(new THREE.Vector3(0, 0.0, 0), 0.04);
      }
      else if (anim === 'Spiral Descent') {
        const progress = (time * 0.035) % 1.0;
        const spiralY = 3.0 - progress * 5.2;
        const spiralAng = time * 0.12;
        const rad = 5.2;
        const sX = rad * Math.sin(spiralAng);
        const sZ = rad * Math.cos(spiralAng);
        camera.position.lerp(new THREE.Vector3(sX, spiralY, sZ), 0.035);
        controls.target.lerp(new THREE.Vector3(0, spiralY * 0.4, 0), 0.04);
      }
      else if (anim === 'Creeping Tilt & Pan') {
        const pX = 3.4 * Math.sin(time * 0.09);
        const pY = -2.2 + 0.3 * Math.cos(time * 0.07);
        const pZ = 4.8 + 0.4 * Math.cos(time * 0.09);
        camera.position.lerp(new THREE.Vector3(pX, pY, pZ), 0.04);
        controls.target.lerp(new THREE.Vector3(0, 0.8, 0), 0.04);
      }
      else if (anim === 'Suspended Drifting') {
        const driftX = 5.4 * Math.sin(time * 0.08 + 0.6);
        const driftY = 0.4 + 1.4 * Math.sin(time * 0.06);
        const driftZ = 5.4 * Math.cos(time * 0.07);
        camera.position.lerp(new THREE.Vector3(driftX, driftY, driftZ), 0.03);
        controls.target.lerp(new THREE.Vector3(0, 0.2, 0), 0.04);
      }
      else if (anim === 'Egg Sac Inspection') {
        // Multi-stage inspection cycle
        const stage = (time * 0.08) % 3.0;
        let p = new THREE.Vector3(0, 0.5, 6.0);
        let t = new THREE.Vector3(0, 0, 0);

        if (stage < 1.0) {
          // Inspection of top silk stalk
          p.set(2.4 * Math.sin(time * 0.2), 3.2, 3.8);
          t.set(0, 2.2, 0);
        } else if (stage < 2.0) {
          // Inspection of pulsating center belly
          p.set(4.2 * Math.cos(time * 0.15), 0.2, 4.2 * Math.sin(time * 0.15));
          t.set(0, 0.1, 0);
        } else {
          // Inspection of swarming base
          p.set(-3.2, -1.8, 3.4);
          t.set(0, -1.5, 0);
        }
        camera.position.lerp(p, 0.03);
        controls.target.lerp(t, 0.04);
      }
    }

    // --- MAIN ANIMATION LOOP ---
    const clock = new THREE.Clock();
    let accumulatedTime = 0;

    function animate() {
      requestAnimationFrame(animate);

      const rawDelta = clock.getDelta();
      const delta = Math.min(rawDelta, 0.1) * params.animationSpeed;
      accumulatedTime += delta;

      // 1. Calculate Asymmetric Cardiac Pulse
      const pulseVal = getAsymmetricPulse(accumulatedTime, params.pulseRate);

      // 2. Displace Sac Geometry Vertices along Normals
      const posArray = sacGeometry.attributes.position.array;
      const pulseScaled = pulseVal * params.pulseIntensity;

      for (let i = 0; i < vertexCount; i++) {
        const i3 = i * 3;
        const disp = pulseScaled * bellyWeights[i];
        posArray[i3]     = basePositions[i3]     + baseNormals[i3] * disp;
        posArray[i3 + 1] = basePositions[i3 + 1] + baseNormals[i3 + 1] * disp;
        posArray[i3 + 2] = basePositions[i3 + 2] + baseNormals[i3 + 2] * disp;
      }
      sacGeometry.attributes.position.needsUpdate = true;
      sacGeometry.computeVertexNormals();

      // Dynamic internal embryonic glow synced with heartbeat
      internalLight.intensity = 2.4 + pulseVal * 8.5;
      sacMaterial.emissiveIntensity = 0.2 + pulseVal * 0.75;

      // 3. Update Crawling Micro-Spiders via 2D Flow Field
      for (let i = 0; i < SPIDER_COUNT; i++) {
        const sp = spiders[i];

        // Organic scurry burst and pause pattern
        if (sp.pauseTimer > 0) {
          sp.pauseTimer -= delta;
          sp.scurryState = THREE.MathUtils.lerp(sp.scurryState, 0.0, delta * 9.0);
        } else {
          if (Math.random() < 0.007) {
            sp.pauseTimer = 0.2 + Math.random() * 0.55;
          }
          sp.scurryState = THREE.MathUtils.lerp(sp.scurryState, 1.0 + Math.random() * 0.7, delta * 6.0);
        }

        const flow = getFlowField(sp.u, sp.v, accumulatedTime);
        const moveStep = delta * params.spiderSpeed * sp.speed * sp.scurryState;

        // Longitude wraps seamlessly
        sp.u = (sp.u + (flow.du + sp.driftBias) * moveStep + 1.0) % 1.0;
        sp.v += (flow.dv) * moveStep;

        // Latitude bounded with graceful turning near poles
        if (sp.v < 0.12) {
          sp.v = 0.12;
          sp.driftBias = Math.abs(sp.driftBias);
        } else if (sp.v > 0.88) {
          sp.v = 0.88;
          sp.driftBias = -Math.abs(sp.driftBias);
        }

        // Pinned to displaced surface using UV coordinates
        evaluateSacSurface(sp.u, sp.v, pulseVal, spiderPos, spiderNorm);

        // Look-ahead direction vector in flow field
        const lookAhead = 0.007;
        const nextU = (sp.u + flow.du * lookAhead + 1.0) % 1.0;
        const nextV = Math.min(0.9, Math.max(0.1, sp.v + flow.dv * lookAhead));
        evaluateSacSurface(nextU, nextV, pulseVal, nextPos, null);

        spiderFwd.subVectors(nextPos, spiderPos);
        if (spiderFwd.lengthSq() < 0.00001) {
          spiderFwd.set(1, 0, 0);
        } else {
          spiderFwd.normalize();
        }

        // Orthonormal basis: Norm, Right, Fwd
        spiderRight.crossVectors(spiderNorm, spiderFwd).normalize();
        spiderFwd.crossVectors(spiderRight, spiderNorm).normalize();

        // High-frequency scurry wobble when scurrying
        if (sp.scurryState > 0.15) {
          const wobble = Math.sin(accumulatedTime * 28.0 * sp.speed + sp.twitchOffset) * 0.14;
          spiderFwd.applyAxisAngle(spiderNorm, wobble);
          spiderRight.crossVectors(spiderNorm, spiderFwd).normalize();
        }

        rotMatrix.makeBasis(spiderRight, spiderNorm, spiderFwd);

        // Elevate slightly so claws grip the silken membrane
        dummy.position.copy(spiderPos).addScaledVector(spiderNorm, 0.016);
        dummy.quaternion.setFromRotationMatrix(rotMatrix);
        dummy.scale.setScalar(params.spiderScale);
        dummy.updateMatrix();

        spiderInstancedMesh.setMatrixAt(i, dummy.matrix);
      }
      spiderInstancedMesh.instanceMatrix.needsUpdate = true;

      // 4. Subtle Cobweb Vibration Synchronized with Cardiac Shockwave
      const webVibe = 1.0 + pulseVal * 0.025;
      webGroup.scale.set(webVibe, 1.0 + pulseVal * 0.012, webVibe);

      // 5. Camera & OrbitControls Update
      updateCameraAnimation(accumulatedTime, delta);
      controls.update();

      // 6. Render
      renderer.render(scene, camera);
    }

    // --- RESPONSIVE RESIZE ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Start auto infinite animation
    animate();
  </script>
</body>
