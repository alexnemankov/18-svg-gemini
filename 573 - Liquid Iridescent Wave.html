        bg: '#020908'
      },
      'Acid Flora': {

        colors: ['#05140A', '#0A3322', '#00B894', '#7FFF00', '#D4FFB0'],
        bg: '#020a05'
      },
      'Amber Velvet': {
        name: 'Amber Velvet (#FFE8CC, #FF8C00, #C7501A, #3D1050, #0E0618)',
        colors: ['#0E0618', '#3D1050', '#C7501A', '#FF8C00', '#FFE8CC'],
        bg: '#08030f'
      },
      'Cosmic Violet': {
        name: 'Cosmic Violet (#E8E0FF, #B38FFF, #6A3DE8, #1A1250, #090612)',
        colors: ['#090612', '#1A1250', '#6A3DE8', '#B38FFF', '#E8E0FF'],
        bg: '#05030b'
      },
      'Cyber Neon': {
        name: 'Cyber Neon (#E0FBFF, #00F0FF, #D40078, #1E0A3D, #05020F)',
        colors: ['#05020F', '#1E0A3D', '#D40078', '#00F0FF', '#E0FBFF'],
        bg: '#020108'
      }
    };

    // -------------------------------------------------------------
    // 2. Global Parameters
    // -------------------------------------------------------------
    const params = {
      // Color & Background
      colorScheme: 'Original',
      greenscreen: false,
      bgColor: COLOR_SCHEMES['Original'].bg,
      color1: COLOR_SCHEMES['Original'].colors[0],
      color2: COLOR_SCHEMES['Original'].colors[1],
      color3: COLOR_SCHEMES['Original'].colors[2],
      color4: COLOR_SCHEMES['Original'].colors[3],
      color5: COLOR_SCHEMES['Original'].colors[4],

      // Iridescence & Material
      iridescence: 1.25,
      fresnelPower: 3.5,
      crestHighlight: 1.4,
      specularIntensity: 1.5,
      specularSharpness: 120.0,
      grainIntensity: 0.038,

      // Wave Geometry & Flow
      amplitude: 1.35,
      diagFreq: 0.48,
      bandWidth: 3.4,
      crestSharpness: 1.7,
      fluidWarp: 0.72,
      animSpeed: 0.85,

      // Lighting & Exposure
      exposure: 1.15,
      keyLightIntensity: 2.4,
      keyLightColor: '#ffffff',
      keyLightPosX: 5.0,
      keyLightPosY: 9.0,
      keyLightPosZ: 5.0,
      fillLightIntensity: 1.3,
      fillLightColor: '#60a5fa',
      fillLightPosX: -6.0,
      fillLightPosY: 4.0,
      fillLightPosZ: -5.0,
      ambientIntensity: 0.35,
      ambientColor: '#ffffff',

      // Camera Animations
      cameraAnimation: 'Cinematic Diagonal Glide',
      cameraAnimSpeed: 0.65,

      // Rendering & Interaction
      dpr: Math.min(window.devicePixelRatio || 1, 2),
      antialias: true,
      clickRandomize: true
    };

    // -------------------------------------------------------------
    // 3. Scene, Camera, Shaders & Renderer Setup
    // -------------------------------------------------------------
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);

    let renderer = null;

    // Custom Interactive Camera Rig
    // Supports wheel zoom & drag pan across screen seamlessly during camera animations!
    const cameraRig = {
      distance: 12.0,
      azimuth: -Math.PI * 0.25,
      polar: Math.PI * 0.32,
      target: new THREE.Vector3(0, 0, 0),

      targetDistance: 12.0,
      targetAzimuth: -Math.PI * 0.25,
      targetPolar: Math.PI * 0.32,
      targetLookAt: new THREE.Vector3(0, 0, 0),

      animAzimuth: 0,
      animPolar: 0,
      animTarget: new THREE.Vector3(0, 0, 0),

      isPointerDown: false,
      pointerButton: 0,
      lastX: 0,
      lastY: 0,
      downX: 0,
      downY: 0,
      downTime: 0,
      touchStartDist: 0
    };

    // -------------------------------------------------------------
    // 4. Shader Definition: Liquid Iridescent Wave
    // -------------------------------------------------------------
    const waveVertexShader = /* glsl */ `
      uniform float uTime;
      uniform float uAmplitude;
      uniform float uDiagFreq;
      uniform float uBandWidth;
      uniform float uCrestSharpness;
      uniform float uWarp;

      varying vec2 vWorldXZ;
      varying float vHeight;
      varying vec3 vWorldPos;

      // Analytical wave height function
      float calculateWave(vec2 pos, float time) {
        // Rotate coordinates by 45 degrees:
        // d runs along the diagonal from bottom-left (-X, +Z) to top-right (+X, -Z)
        // p is perpendicular to this diagonal
        float d = (pos.x - pos.y) * 0.70710678;
        float p = (pos.x + pos.y) * 0.70710678;

        // Fluid domain warping
        float warp1 = sin(d * 0.65 + time * 0.75) * cos(p * 0.85 - time * 0.45) * uWarp;
        float warp2 = cos(d * 1.05 - time * 0.55) * sin(p * 0.75 + time * 0.65) * (uWarp * 0.8);
        float dW = d + warp1;
        float pW = p + warp2;

        // Harmonic multi-frequency waves
        float w1 = sin(dW * uDiagFreq - time * 1.1);
        float w2 = sin(dW * uDiagFreq * 2.15 + time * 0.85 + pW * 0.4) * 0.42;
        float w3 = cos(dW * uDiagFreq * 3.4 + time * 1.3 - pW * 0.7) * 0.18;
        float w4 = sin(pW * 0.6 + dW * 0.35 + time * 0.35) * 0.25;

        float rawSum = (w1 + w2 + w3 + w4) / 1.85;

        // Steep crest shaping with smooth broad troughs
        float shapedCrest = sign(rawSum) * pow(abs(rawSum), uCrestSharpness);

        // Envelope: broad along diagonal, fading to calm in top-left and bottom-right
        float distNorm = abs(p) / max(uBandWidth, 0.001);
        float envelope = exp(-distNorm * distNorm * 1.6);

        // Gentle breathing in calm regions
        float calmRipple = sin(d * 0.35 + time * 0.3) * cos(p * 0.35 - time * 0.2) * 0.04;

        return (shapedCrest * envelope + calmRipple) * uAmplitude;
      }

      void main() {
        vec3 displaced = position;
        float h = calculateWave(position.xz, uTime);
        displaced.y = h;

        vec4 worldPosition = modelMatrix * vec4(displaced, 1.0);
        vWorldPos = worldPosition.xyz;
        vWorldXZ = position.xz;
        vHeight = h;

        gl_Position = projectionMatrix * viewMatrix * worldPosition;
      }
    `;

    const waveFragmentShader = /* glsl */ `
      uniform float uTime;
      uniform float uAmplitude;
      uniform float uDiagFreq;
      uniform float uBandWidth;
      uniform float uCrestSharpness;
      uniform float uWarp;

      uniform vec3 uColor1;
      uniform vec3 uColor2;
      uniform vec3 uColor3;
      uniform vec3 uColor4;
      uniform vec3 uColor5;

      uniform float uIridescence;
      uniform float uFresnelPower;
      uniform float uCrestHighlight;
      uniform float uSpecularIntensity;
      uniform float uSpecularSharpness;
      uniform float uGrainIntensity;

      uniform float uExposure;
      uniform vec3 uKeyLightColor;
      uniform float uKeyLightIntensity;
      uniform vec3 uKeyLightPos;
      uniform vec3 uFillLightColor;
      uniform float uFillLightIntensity;
      uniform vec3 uFillLightPos;
      uniform vec3 uAmbientColor;
      uniform float uAmbientIntensity;

      varying vec2 vWorldXZ;
      varying float vHeight;
      varying vec3 vWorldPos;

      // Duplicate wave formula for mathematically pure finite-difference normals
      float calculateWaveFrag(vec2 pos, float time) {
        float d = (pos.x - pos.y) * 0.70710678;
        float p = (pos.x + pos.y) * 0.70710678;

        float warp1 = sin(d * 0.65 + time * 0.75) * cos(p * 0.85 - time * 0.45) * uWarp;
        float warp2 = cos(d * 1.05 - time * 0.55) * sin(p * 0.75 + time * 0.65) * (uWarp * 0.8);
        float dW = d + warp1;
        float pW = p + warp2;

        float w1 = sin(dW * uDiagFreq - time * 1.1);
        float w2 = sin(dW * uDiagFreq * 2.15 + time * 0.85 + pW * 0.4) * 0.42;
        float w3 = cos(dW * uDiagFreq * 3.4 + time * 1.3 - pW * 0.7) * 0.18;
        float w4 = sin(pW * 0.6 + dW * 0.35 + time * 0.35) * 0.25;

        float rawSum = (w1 + w2 + w3 + w4) / 1.85;
        float shapedCrest = sign(rawSum) * pow(abs(rawSum), uCrestSharpness);

        float distNorm = abs(p) / max(uBandWidth, 0.001);
        float envelope = exp(-distNorm * distNorm * 1.6);
        float calmRipple = sin(d * 0.35 + time * 0.3) * cos(p * 0.35 - time * 0.2) * 0.04;

        return (shapedCrest * envelope + calmRipple) * uAmplitude;
      }

      void main() {
        // High-precision finite differences for silky continuous normals
        float eps = 0.014;
        float hC = calculateWaveFrag(vWorldXZ, uTime);
        float hR = calculateWaveFrag(vWorldXZ + vec2(eps, 0.0), uTime);
        float hT = calculateWaveFrag(vWorldXZ + vec2(0.0, eps), uTime);
        vec3 normal = normalize(vec3(hC - hR, eps, hC - hT));

        // View vector and Fresnel calculation
        vec3 V = normalize(cameraPosition - vWorldPos);
        float NdotV = max(0.0, dot(normal, V));
        float fresnel = pow(1.0 - NdotV, uFresnelPower);

        // Normalized height along the wave
        float hNorm = clamp((vHeight / max(uAmplitude, 0.001) + 1.2) / 2.4, 0.0, 1.0);

        // Thin-film iridescent interference phase
        // Glancing angles and surface height shift color dramatically
        float filmPhase = (1.0 - NdotV) * 2.3 + hNorm * 1.7 + sin(vWorldXZ.x * 0.18 + vWorldXZ.y * 0.18 + uTime * 0.25) * 0.35;
        filmPhase = fract(filmPhase * uIridescence);

        // 1. Trough deep color: blend between uColor1 and uColor2
        vec3 troughColor = mix(uColor1, uColor2, smoothstep(0.0, 0.45, hNorm));

        // 2. Crest Iridescent Rainbow: cycle seamlessly through uColor2, uColor3, uColor4, uColor5
        vec3 crestRainbow;
        float phase4 = filmPhase * 4.0;
        if (phase4 < 1.0) {
          crestRainbow = mix(uColor2, uColor3, smoothstep(0.0, 1.0, fract(phase4)));
        } else if (phase4 < 2.0) {
          crestRainbow = mix(uColor3, uColor4, smoothstep(0.0, 1.0, fract(phase4)));
        } else if (phase4 < 3.0) {
          crestRainbow = mix(uColor4, uColor5, smoothstep(0.0, 1.0, fract(phase4)));
        } else {
          crestRainbow = mix(uColor5, uColor2, smoothstep(0.0, 1.0, fract(phase4)));
        }

        // Trough stays deep and dark; crest flourishes with vibrant iridescence
        float crestWeight = smoothstep(0.25, 0.82, hNorm);
        vec3 baseSurface = mix(troughColor, crestRainbow, crestWeight);
        baseSurface = mix(baseSurface, crestRainbow, fresnel * 0.5 * uIridescence);

        // 3. Lighting: Key Light & Fill/Rim Light
        vec3 L1 = normalize(uKeyLightPos);
        vec3 H1 = normalize(L1 + V);
        float diff1 = max(0.0, dot(normal, L1));
        float spec1 = pow(max(0.0, dot(normal, H1)), uSpecularSharpness) * uKeyLightIntensity;

        vec3 L2 = normalize(uFillLightPos);
        vec3 H2 = normalize(L2 + V);
        float diff2 = max(0.0, dot(normal, L2));
        float spec2 = pow(max(0.0, dot(normal, H2)), uSpecularSharpness * 0.5) * uFillLightIntensity;

        vec3 ambient = uAmbientColor * uAmbientIntensity;

        vec3 litColor = baseSurface * (ambient + uKeyLightColor * diff1 * uKeyLightIntensity + uFillLightColor * diff2 * uFillLightIntensity);
        litColor += (uKeyLightColor * spec1 + uFillLightColor * spec2) * uSpecularIntensity;

        // 4. Rare sharp specular highlights at curvature bends
        float sharpBend = pow(max(0.0, dot(normal, H1)), uSpecularSharpness * 2.8) * diff1;
        litColor += vec3(1.0, 0.98, 0.95) * sharpBend * 3.5 * uSpecularIntensity;

        // 5. Razor-thin white highlight along the upper crest edge
        float crestRidge = smoothstep(0.85, 0.98, hNorm);
        float crestCurvature = pow(1.0 - abs(normal.y - 0.72), 5.5);
        float crestGleam = pow(max(0.0, dot(normal, H1)), 190.0);
        float whiteHighlight = (crestCurvature * 0.65 + crestGleam * 2.5) * crestRidge * uCrestHighlight;
        litColor += vec3(1.0) * whiteHighlight;

        // 6. Filmic surface grain
        float grain = (fract(sin(dot(gl_FragCoord.xy + uTime * 15.0, vec2(12.9898, 78.233))) * 43758.5453) - 0.5) * uGrainIntensity;
        litColor += vec3(grain);

        // 7. Tone mapping and exposure
        litColor *= uExposure;
        litColor = litColor / (litColor + vec3(0.92));
        litColor = pow(litColor, vec3(1.0 / 2.2)); // gamma correction

        gl_FragColor = vec4(litColor, 1.0);
      }
    `;

    // High resolution mesh for silky smooth wave folds
    const planeGeo = new THREE.PlaneGeometry(24, 24, 280, 280);
    planeGeo.rotateX(-Math.PI / 2); // Orient horizontally

    const waveUniforms = {
      uTime: { value: 0 },
      uAmplitude: { value: params.amplitude },
      uDiagFreq: { value: params.diagFreq },
      uBandWidth: { value: params.bandWidth },
      uCrestSharpness: { value: params.crestSharpness },
      uWarp: { value: params.fluidWarp },

      uColor1: { value: new THREE.Color(params.color1) },
      uColor2: { value: new THREE.Color(params.color2) },
      uColor3: { value: new THREE.Color(params.color3) },
      uColor4: { value: new THREE.Color(params.color4) },
      uColor5: { value: new THREE.Color(params.color5) },

      uIridescence: { value: params.iridescence },
      uFresnelPower: { value: params.fresnelPower },
      uCrestHighlight: { value: params.crestHighlight },
      uSpecularIntensity: { value: params.specularIntensity },
      uSpecularSharpness: { value: params.specularSharpness },
      uGrainIntensity: { value: params.grainIntensity },

      uExposure: { value: params.exposure },
      uKeyLightColor: { value: new THREE.Color(params.keyLightColor) },
      uKeyLightIntensity: { value: params.keyLightIntensity },
      uKeyLightPos: { value: new THREE.Vector3(params.keyLightPosX, params.keyLightPosY, params.keyLightPosZ) },
      uFillLightColor: { value: new THREE.Color(params.fillLightColor) },
      uFillLightIntensity: { value: params.fillLightIntensity },
      uFillLightPos: { value: new THREE.Vector3(params.fillLightPosX, params.fillLightPosY, params.fillLightPosZ) },
      uAmbientColor: { value: new THREE.Color(params.ambientColor) },
      uAmbientIntensity: { value: params.ambientIntensity }
    };

    const waveMaterial = new THREE.ShaderMaterial({
      vertexShader: waveVertexShader,
      fragmentShader: waveFragmentShader,
      uniforms: waveUniforms,
      wireframe: false,
      side: THREE.DoubleSide
    });

    const waveMesh = new THREE.Mesh(planeGeo, waveMaterial);
    scene.add(waveMesh);

    // -------------------------------------------------------------
    // 5. Renderer Lifecycle & Antialiasing Management
    // -------------------------------------------------------------
    function updateBg() {
      const activeColor = params.greenscreen ? '#00ff00' : params.bgColor;
      const threeColor = new THREE.Color(activeColor);
      scene.background = threeColor;
      if (renderer) renderer.setClearColor(threeColor, 1);
      document.body.style.backgroundColor = activeColor;
    }

    function updateColors() {
      waveUniforms.uColor1.value.set(params.color1);
      waveUniforms.uColor2.value.set(params.color2);
      waveUniforms.uColor3.value.set(params.color3);
      waveUniforms.uColor4.value.set(params.color4);
      waveUniforms.uColor5.value.set(params.color5);
    }

    function initRenderer(antialiasEnabled) {
      const oldCanvas = renderer ? renderer.domElement : null;
      const newRenderer = new THREE.WebGLRenderer({
        antialias: antialiasEnabled,
        powerPreference: 'high-performance'
      });
      newRenderer.setSize(window.innerWidth, window.innerHeight);
      newRenderer.setPixelRatio(params.dpr);

      if (oldCanvas && oldCanvas.parentNode) {
        oldCanvas.parentNode.replaceChild(newRenderer.domElement, oldCanvas);
        renderer.dispose();
      } else {
        document.body.appendChild(newRenderer.domElement);
      }

      renderer = newRenderer;
      bindInteractionEvents(renderer.domElement);
      updateBg();
    }

    // -------------------------------------------------------------
    // 6. Camera Animations (8 distinct, slow, smooth trajectories)
    // -------------------------------------------------------------
    function updateCameraAnimation(t) {
      const speed = params.cameraAnimSpeed;
      const time = t * speed;

      switch (params.cameraAnimation) {
        case 'Static (Still Camera)':
          cameraRig.animAzimuth = 0;
          cameraRig.animPolar = 0;
          cameraRig.animTarget.set(0, 0, 0);
          break;

        case 'Cinematic Diagonal Glide':
          // Slow gliding along diagonal wave with subtle elevation breathing
          cameraRig.animTarget.x = Math.sin(time * 0.3) * 1.8;
          cameraRig.animTarget.z = -Math.sin(time * 0.3) * 1.8;
          cameraRig.animTarget.y = Math.cos(time * 0.25) * 0.4;
          cameraRig.animPolar = Math.sin(time * 0.2) * 0.08;
          cameraRig.animAzimuth = Math.cos(time * 0.2) * 0.12;
          break;

        case 'Slow Horizon Orbit':
          // Continuous 360-degree serene orbit around the wave center
          cameraRig.animAzimuth = time * 0.14;
          cameraRig.animPolar = Math.sin(time * 0.22) * 0.09;
          cameraRig.animTarget.set(0, 0, 0);
          break;

        case 'Trough & Crest Surge':
          // Rhythmic diving and rising between deep troughs and high crests
          cameraRig.animPolar = Math.sin(time * 0.35) * 0.18;
          cameraRig.animTarget.y = Math.cos(time * 0.35) * 0.7;
          cameraRig.animTarget.x = Math.sin(time * 0.2) * 0.6;
          cameraRig.animTarget.z = Math.cos(time * 0.2) * 0.6;
          cameraRig.animAzimuth = Math.sin(time * 0.25) * 0.15;
          break;

        case 'Figure-8 Infinity Loop':
          // Graceful Lemniscate path hovering above the diagonal crest
          cameraRig.animTarget.x = Math.sin(time * 0.3) * 2.2;
          cameraRig.animTarget.z = Math.sin(time * 0.6) * 1.2;
          cameraRig.animTarget.y = Math.cos(time * 0.3) * 0.35;
          cameraRig.animAzimuth = Math.sin(time * 0.3) * 0.18;
          cameraRig.animPolar = Math.cos(time * 0.3) * 0.07;
          break;

        case 'Macro Crest Skim':
          // Low-angle grazing scan highlighting the thin crest highlight
          cameraRig.animPolar = 0.2 + Math.sin(time * 0.25) * 0.07;
          cameraRig.animTarget.x = Math.cos(time * 0.25) * 1.5;
          cameraRig.animTarget.z = Math.sin(time * 0.25) * 1.5;
          cameraRig.animTarget.y = 0.2 + Math.cos(time * 0.25) * 0.3;
          cameraRig.animAzimuth = 0.3 + Math.sin(time * 0.25) * 0.15;
          break;

        case 'Pendulum Wave Sway':
          // Smooth harmonic pendulum swing across the diagonal axis
          cameraRig.animAzimuth = Math.sin(time * 0.38) * 0.4;
          cameraRig.animPolar = Math.abs(Math.sin(time * 0.38)) * 0.08;
          cameraRig.animTarget.x = Math.sin(time * 0.38) * 0.8;
          cameraRig.animTarget.z = -Math.sin(time * 0.38) * 0.8;
          break;

        case 'Celestial Skimming Arc':
          // Sweeping from high overview down to dramatic low angle
          cameraRig.animPolar = Math.sin(time * 0.22) * 0.24;
          cameraRig.animAzimuth = Math.cos(time * 0.18) * 0.28;
          cameraRig.animTarget.x = Math.cos(time * 0.2) * 1.0;
          cameraRig.animTarget.z = Math.sin(time * 0.2) * 1.0;
          break;
      }
    }

    // -------------------------------------------------------------
    // 7. Interactive Controls: Wheel Zoom & Pan Dragging
    // -------------------------------------------------------------
    function bindInteractionEvents(canvas) {
      // Wheel Zoom: modifies targetDistance and NEVER resets during camera animations
      canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomStep = e.deltaY * 0.006 * cameraRig.targetDistance;
        cameraRig.targetDistance = THREE.MathUtils.clamp(
          cameraRig.targetDistance + zoomStep,
          2.5,
          45.0
        );
      }, { passive: false });

      // Pointer Down
      canvas.addEventListener('pointerdown', (e) => {
        cameraRig.isPointerDown = true;
        cameraRig.pointerButton = e.button;
        cameraRig.lastX = e.clientX;
        cameraRig.lastY = e.clientY;
        cameraRig.downX = e.clientX;
        cameraRig.downY = e.clientY;
        cameraRig.downTime = performance.now();
        canvas.setPointerCapture(e.pointerId);
      });

      // Pointer Move: Left-drag orbits; Right/Middle-drag pans object across screen
      canvas.addEventListener('pointermove', (e) => {
        if (!cameraRig.isPointerDown) return;

        const deltaX = e.clientX - cameraRig.lastX;
        const deltaY = e.clientY - cameraRig.lastY;
        cameraRig.lastX = e.clientX;
        cameraRig.lastY = e.clientY;

        const isPan = cameraRig.pointerButton === 2 || cameraRig.pointerButton === 1 || e.shiftKey;

        if (isPan) {
          // Drag object across screen in view space
          const forward = new THREE.Vector3().subVectors(cameraRig.targetLookAt, camera.position).normalize();
          const right = new THREE.Vector3().crossVectors(forward, camera.up).normalize();
          const up = new THREE.Vector3().crossVectors(right, forward).normalize();
          const panFactor = cameraRig.distance * 0.0016;

          cameraRig.targetLookAt.addScaledVector(right, -deltaX * panFactor);
          cameraRig.targetLookAt.addScaledVector(up, deltaY * panFactor);
        } else {
          // Orbit angle: updates user angle during orbit animation without snapping back
          cameraRig.targetAzimuth -= deltaX * 0.005;
          cameraRig.targetPolar = THREE.MathUtils.clamp(
            cameraRig.targetPolar - deltaY * 0.005,
            0.05,
            Math.PI * 0.48
          );
        }
      });

      // Pointer Up: Handle Click-to-Randomize
      canvas.addEventListener('pointerup', (e) => {
        if (!cameraRig.isPointerDown) return;
        cameraRig.isPointerDown = false;

        const moveDist = Math.hypot(e.clientX - cameraRig.downX, e.clientY - cameraRig.downY);
        const elapsed = performance.now() - cameraRig.downTime;

        // Detect clean click vs drag
        if (moveDist < 6 && elapsed < 350 && params.clickRandomize && e.button === 0) {
          triggerRandomSceneVariation();
        }

        try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
      });

      canvas.addEventListener('contextmenu', (e) => e.preventDefault());

      // Touch pinch zoom and 2-finger pan
      canvas.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          cameraRig.touchStartDist = Math.hypot(dx, dy);
        }
      }, { passive: true });

      canvas.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2) {
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          const dist = Math.hypot(dx, dy);
          const diff = cameraRig.touchStartDist - dist;
          cameraRig.touchStartDist = dist;

          cameraRig.targetDistance = THREE.MathUtils.clamp(
            cameraRig.targetDistance + diff * 0.02,
            2.5,
            45.0
          );
        }
      }, { passive: true });
    }

    // -------------------------------------------------------------
    // 8. Color Scheme Transition & Procedural Randomizer
    // -------------------------------------------------------------
    function applyColorScheme(schemeKey, animate = true) {
      const scheme = COLOR_SCHEMES[schemeKey];
      if (!scheme) return;

      if (!animate) {
        params.color1 = scheme.colors[0];
        params.color2 = scheme.colors[1];
        params.color3 = scheme.colors[2];
        params.color4 = scheme.colors[3];
        params.color5 = scheme.colors[4];
        params.bgColor = scheme.bg;
        updateColors();
        updateBg();
        gui.controllersRecursive().forEach(c => c.updateDisplay());
        return;
      }

      const startC1 = new THREE.Color(params.color1);
      const startC2 = new THREE.Color(params.color2);
      const startC3 = new THREE.Color(params.color3);
      const startC4 = new THREE.Color(params.color4);
      const startC5 = new THREE.Color(params.color5);
      const startBg = new THREE.Color(params.bgColor);

      const targetC1 = new THREE.Color(scheme.colors[0]);
      const targetC2 = new THREE.Color(scheme.colors[1]);
      const targetC3 = new THREE.Color(scheme.colors[2]);
      const targetC4 = new THREE.Color(scheme.colors[3]);
      const targetC5 = new THREE.Color(scheme.colors[4]);
      const targetBg = new THREE.Color(scheme.bg);

      const tweenData = { progress: 0 };
      gsap.killTweensOf(tweenData);
      gsap.to(tweenData, {
        progress: 1,
        duration: 1.1,
        ease: 'power2.out',
        onUpdate: () => {
          const c1 = startC1.clone().lerp(targetC1, tweenData.progress);
          const c2 = startC2.clone().lerp(targetC2, tweenData.progress);
          const c3 = startC3.clone().lerp(targetC3, tweenData.progress);
          const c4 = startC4.clone().lerp(targetC4, tweenData.progress);
          const c5 = startC5.clone().lerp(targetC5, tweenData.progress);
          const bg = startBg.clone().lerp(targetBg, tweenData.progress);

          params.color1 = '#' + c1.getHexString();
          params.color2 = '#' + c2.getHexString();
          params.color3 = '#' + c3.getHexString();
          params.color4 = '#' + c4.getHexString();
          params.color5 = '#' + c5.getHexString();
          params.bgColor = '#' + bg.getHexString();

          updateColors();
          updateBg();
          gui.controllersRecursive().forEach(c => c.updateDisplay());
        }
      });
    }

    function triggerRandomSceneVariation() {
      // Pick random color scheme
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const randomSchemeKey = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      params.colorScheme = randomSchemeKey;
      applyColorScheme(randomSchemeKey, true);

      // Re-roll geometric & motion parameters
      const newAmp = THREE.MathUtils.randFloat(0.9, 2.3);
      const newFreq = THREE.MathUtils.randFloat(0.32, 0.75);
      const newBand = THREE.MathUtils.randFloat(2.4, 4.8);
      const newSharp = THREE.MathUtils.randFloat(1.2, 2.4);
      const newWarp = THREE.MathUtils.randFloat(0.4, 1.25);
      const newSpeed = THREE.MathUtils.randFloat(0.55, 1.5);
      const newIrid = THREE.MathUtils.randFloat(0.8, 1.8);
      const newExposure = THREE.MathUtils.randFloat(0.95, 1.35);

      // Smoothly morph parameters with GSAP
      gsap.to(params, {
        amplitude: newAmp,
        diagFreq: newFreq,
        bandWidth: newBand,
        crestSharpness: newSharp,
        fluidWarp: newWarp,
        animSpeed: newSpeed,
        iridescence: newIrid,
        exposure: newExposure,
        duration: 1.2,
        ease: 'power2.out',
        onUpdate: () => {
          waveUniforms.uAmplitude.value = params.amplitude;
          waveUniforms.uDiagFreq.value = params.diagFreq;
          waveUniforms.uBandWidth.value = params.bandWidth;
          waveUniforms.uCrestSharpness.value = params.crestSharpness;
          waveUniforms.uWarp.value = params.fluidWarp;
          waveUniforms.uIridescence.value = params.iridescence;
          waveUniforms.uExposure.value = params.exposure;
          gui.controllersRecursive().forEach(c => c.updateDisplay());
        }
      });
    }

    // -------------------------------------------------------------
    // 9. lil-gui Setup (Clean, standard styling, all in English)
    // -------------------------------------------------------------
    const gui = new GUI({ title: 'Liquid Iridescent Wave' });

    // Presets & Color Schemes Folder
    const presetsFolder = gui.addFolder('Color Schemes & Presets');
    presetsFolder.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES))
      .name('Color Scheme')
      .onChange((val) => applyColorScheme(val, true));

    presetsFolder.add(params, 'greenscreen')
      .name('Greenscreen (#00ff00)')
      .onChange(updateBg);

    presetsFolder.addColor(params, 'bgColor')
      .name('Background Color')
      .onChange(updateBg);

    presetsFolder.add(params, 'clickRandomize')
      .name('Randomize on Click');

    const resetCamAction = {
      reset: () => {
        gsap.to(cameraRig, {
          targetDistance: 12.0,
          targetAzimuth: -Math.PI * 0.25,
          targetPolar: Math.PI * 0.32,
          duration: 1.2,
          ease: 'power2.inOut'
        });
        gsap.to(cameraRig.targetLookAt, {
          x: 0,
          y: 0,
          z: 0,
          duration: 1.2,
          ease: 'power2.inOut'
        });
      }
    };
    presetsFolder.add(resetCamAction, 'reset').name('Reset Camera View');

    // Palette Fine-Tuning Folder
    const colorFolder = gui.addFolder('Palette Colors');
    colorFolder.addColor(params, 'color1').name('Color 1 (Deep Trough)').onChange(() => waveUniforms.uColor1.value.set(params.color1));
    colorFolder.addColor(params, 'color2').name('Color 2 (Lower Slope)').onChange(() => waveUniforms.uColor2.value.set(params.color2));
    colorFolder.addColor(params, 'color3').name('Color 3 (Mid Iridescent)').onChange(() => waveUniforms.uColor3.value.set(params.color3));
    colorFolder.addColor(params, 'color4').name('Color 4 (Upper Crest)').onChange(() => waveUniforms.uColor4.value.set(params.color4));
    colorFolder.addColor(params, 'color5').name('Color 5 (Peak Crest)').onChange(() => waveUniforms.uColor5.value.set(params.color5));
    colorFolder.add(params, 'iridescence', 0.1, 3.0, 0.05).name('Iridescence Phase').onChange(v => waveUniforms.uIridescence.value = v);
    colorFolder.add(params, 'fresnelPower', 1.0, 8.0, 0.1).name('Fresnel Power').onChange(v => waveUniforms.uFresnelPower.value = v);

    // Wave Geometry & Motion Folder
    const waveFolder = gui.addFolder('Wave Geometry & Motion');
    waveFolder.add(params, 'amplitude', 0.2, 3.5, 0.05).name('Wave Amplitude').onChange(v => waveUniforms.uAmplitude.value = v);
    waveFolder.add(params, 'diagFreq', 0.1, 1.5, 0.02).name('Diagonal Frequency').onChange(v => waveUniforms.uDiagFreq.value = v);
    waveFolder.add(params, 'bandWidth', 1.0, 8.0, 0.1).name('Band Width').onChange(v => waveUniforms.uBandWidth.value = v);
    waveFolder.add(params, 'crestSharpness', 0.6, 3.0, 0.05).name('Crest Sharpness').onChange(v => waveUniforms.uCrestSharpness.value = v);
    waveFolder.add(params, 'fluidWarp', 0.0, 2.0, 0.05).name('Fluid Warp Folds').onChange(v => waveUniforms.uWarp.value = v);
    waveFolder.add(params, 'animSpeed', 0.0, 3.0, 0.05).name('Animation Speed');

    // Lighting & Surface Highlights Folder
    const lightFolder = gui.addFolder('Lighting & Highlights');
    lightFolder.add(params, 'exposure', 0.2, 3.0, 0.05).name('Scene Exposure').onChange(v => waveUniforms.uExposure.value = v);
    lightFolder.add(params, 'crestHighlight', 0.0, 3.5, 0.05).name('Thin Crest Highlight').onChange(v => waveUniforms.uCrestHighlight.value = v);
    lightFolder.add(params, 'specularIntensity', 0.0, 3.0, 0.05).name('Specular Intensity').onChange(v => waveUniforms.uSpecularIntensity.value = v);
    lightFolder.add(params, 'specularSharpness', 10.0, 300.0, 5.0).name('Specular Sharpness').onChange(v => waveUniforms.uSpecularSharpness.value = v);
    lightFolder.add(params, 'grainIntensity', 0.0, 0.12, 0.005).name('Surface Grain').onChange(v => waveUniforms.uGrainIntensity.value = v);

    const keyLightSub = lightFolder.addFolder('Key Light');
    keyLightSub.add(params, 'keyLightIntensity', 0.0, 5.0, 0.1).name('Intensity').onChange(v => waveUniforms.uKeyLightIntensity.value = v);
    keyLightSub.addColor(params, 'keyLightColor').name('Color').onChange(v => waveUniforms.uKeyLightColor.value.set(v));
    keyLightSub.add(params, 'keyLightPosX', -20, 20, 0.5).name('Pos X').onChange(() => waveUniforms.uKeyLightPos.value.set(params.keyLightPosX, params.keyLightPosY, params.keyLightPosZ));
    keyLightSub.add(params, 'keyLightPosY', -20, 20, 0.5).name('Pos Y').onChange(() => waveUniforms.uKeyLightPos.value.set(params.keyLightPosX, params.keyLightPosY, params.keyLightPosZ));
    keyLightSub.add(params, 'keyLightPosZ', -20, 20, 0.5).name('Pos Z').onChange(() => waveUniforms.uKeyLightPos.value.set(params.keyLightPosX, params.keyLightPosY, params.keyLightPosZ));

    const fillLightSub = lightFolder.addFolder('Fill / Rim Light');
    fillLightSub.add(params, 'fillLightIntensity', 0.0, 5.0, 0.1).name('Intensity').onChange(v => waveUniforms.uFillLightIntensity.value = v);
    fillLightSub.addColor(params, 'fillLightColor').name('Color').onChange(v => waveUniforms.uFillLightColor.value.set(v));
    fillLightSub.add(params, 'fillLightPosX', -20, 20, 0.5).name('Pos X').onChange(() => waveUniforms.uFillLightPos.value.set(params.fillLightPosX, params.fillLightPosY, params.fillLightPosZ));
    fillLightSub.add(params, 'fillLightPosY', -20, 20, 0.5).name('Pos Y').onChange(() => waveUniforms.uFillLightPos.value.set(params.fillLightPosX, params.fillLightPosY, params.fillLightPosZ));
    fillLightSub.add(params, 'fillLightPosZ', -20, 20, 0.5).name('Pos Z').onChange(() => waveUniforms.uFillLightPos.value.set(params.fillLightPosX, params.fillLightPosY, params.fillLightPosZ));

    const ambientSub = lightFolder.addFolder('Ambient Light');
    ambientSub.add(params, 'ambientIntensity', 0.0, 2.0, 0.05).name('Intensity').onChange(v => waveUniforms.uAmbientIntensity.value = v);
    ambientSub.addColor(params, 'ambientColor').name('Color').onChange(v => waveUniforms.uAmbientColor.value.set(v));

    // Camera Animations Folder
    const animFolder = gui.addFolder('Camera Animations');
    const animationOptions = [
      'Static (Still Camera)',
      'Cinematic Diagonal Glide',
      'Slow Horizon Orbit',
      'Trough & Crest Surge',
      'Figure-8 Infinity Loop',
      'Macro Crest Skim',
      'Pendulum Wave Sway',
      'Celestial Skimming Arc'
    ];
    animFolder.add(params, 'cameraAnimation', animationOptions).name('Animation Mode');
    animFolder.add(params, 'cameraAnimSpeed', 0.1, 3.0, 0.05).name('Camera Speed');

    // Rendering & Quality Folder
    const renderFolder = gui.addFolder('Renderer & Quality');
    renderFolder.add(params, 'dpr', 0.5, 3.0, 0.25).name('Pixel Ratio (DPR)').onChange((val) => {
      if (renderer) renderer.setPixelRatio(val);
    });
    renderFolder.add(params, 'antialias').name('Antialiasing').onChange((val) => {
      initRenderer(val);
    });

    // Toggle GUI visibility with 'H' key
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        if (gui && gui.domElement) {
          const isHidden = gui.domElement.style.display === 'none';
          gui.domElement.style.display = isHidden ? '' : 'none';
        }
      }
    });

    // -------------------------------------------------------------
    // 10. Responsive Resizing
    // -------------------------------------------------------------
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      if (renderer) {
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(params.dpr);
      }
    });

    // -------------------------------------------------------------
    // 11. Main Render Loop (Auto Infinite Animation)
    // -------------------------------------------------------------
    initRenderer(params.antialias);

    const clock = new THREE.Clock();
    let accumulatedTime = 0;

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      accumulatedTime += delta * params.animSpeed;

      // Update shader time for infinite fluid animation
      waveUniforms.uTime.value = accumulatedTime;

      // Update camera animation trajectory
      updateCameraAnimation(clock.getElapsedTime());

      // Damped camera smoothing
      const damping = 0.085;
      cameraRig.distance += (cameraRig.targetDistance - cameraRig.distance) * damping;
      cameraRig.azimuth += (cameraRig.targetAzimuth - cameraRig.azimuth) * damping;
      cameraRig.polar += (cameraRig.targetPolar - cameraRig.polar) * damping;
      cameraRig.target.lerp(cameraRig.targetLookAt, damping);

      // Combine user camera controls with animation offsets
      const finalAzimuth = cameraRig.azimuth + cameraRig.animAzimuth;
      const finalPolar = THREE.MathUtils.clamp(
        cameraRig.polar + cameraRig.animPolar,
        0.05,
        Math.PI * 0.48
      );
      const finalTarget = cameraRig.target.clone().add(cameraRig.animTarget);

      // Spherical coordinate transformation
      camera.position.x = finalTarget.x + cameraRig.distance * Math.sin(finalPolar) * Math.sin(finalAzimuth);
      camera.position.y = finalTarget.y + cameraRig.distance * Math.cos(finalPolar);
      camera.position.z = finalTarget.z + cameraRig.distance * Math.sin(finalPolar) * Math.cos(finalAzimuth);
      camera.lookAt(finalTarget);

      if (renderer) {
        renderer.render(scene, camera);
      }
    }

    animate();
  </script>
