<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fully Connected Neural Graph / Graph Database (P2P Full Mesh Network)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;

      -webkit-user-select: none;
    }

      width: 100%;

      display: block;
      outline: none;
    }
  </style>

  <!-- GSAP Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <!-- Import Map for Three.js & lil-gui -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
    }
  }
  </script>
</head>
<body>
  <canvas id="webgl-canvas"></canvas>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import GUI from 'lil-gui';

    // =========================================================================================
    // POST PROCESSOR SUITE (Three.js Shader Post-Processing Pipeline)
    // Inline implementation from postprocessing/PostProcessor.js
    // =========================================================================================

    // Shaders: GLSL Code
    const orthoVertexShader = `
    precision highp float;
    in vec3 position;
    out vec2 vUv;
    void main() {
      vUv = position.xy * 0.5 + 0.5;
      gl_Position = vec4(position.xy, 0.0, 1.0);
    }
    `;

    const brightFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float bloomThreshold;
    in vec2 vUv;
    out vec4 fragColor;

    vec3 sanitize(vec3 v) {
      if (isnan(v.x) || isinf(v.x)) v.x = 0.0;
      if (isnan(v.y) || isinf(v.y)) v.y = 0.0;
      if (isnan(v.z) || isinf(v.z)) v.z = 0.0;
      return clamp(v, vec3(0.0), vec3(65000.0));
    }

    void main() {
      vec4 raw = texture(inputTexture, vUv);
      vec3 color = sanitize(raw.rgb);
      float luminance = max(0.0, dot(color, vec3(0.2126, 0.7152, 0.0722)));
      float knee = 0.1;
      float soft = luminance - bloomThreshold + knee;
      soft = clamp(soft, 0.0, 2.0 * knee);
      soft = (soft * soft) / (4.0 * knee + 0.00001);
      float contribution = max(soft, luminance - bloomThreshold);
      contribution /= max(luminance, 0.0001);
      vec3 result = color * contribution;
      fragColor = vec4(sanitize(result), clamp(raw.a, 0.0, 1.0));
    }
    `;

    const blur13ShaderChunk = `
    vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
      vec2 resolution = vec2(textureSize(image, 0));
      vec4 color = vec4(0.0);
      vec2 off1 = vec2(1.411764705882353) * direction;
      vec2 off2 = vec2(3.2941176470588234) * direction;
      vec2 off3 = vec2(5.176470588235294) * direction;
      color += texture(image, uv) * 0.1964825501511404;
      color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
      color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
      return color;
    }
    `;

    const blurFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 direction;
    in vec2 vUv;
    out vec4 color;
    ${blur13ShaderChunk}

    vec4 sanitize(vec4 v) {
      if (isnan(v.x) || isinf(v.x)) v.x = 0.0;
      if (isnan(v.y) || isinf(v.y)) v.y = 0.0;
      if (isnan(v.z) || isinf(v.z)) v.z = 0.0;
      if (isnan(v.w) || isinf(v.w)) v.w = 0.0;
      return clamp(v, vec4(0.0), vec4(65000.0));
    }

    void main() {
      color = sanitize(blur13(inputTexture, vUv, direction));
    }
    `;

    const godRaysDepthMaskShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float threshold;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float lum = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float factor = smoothstep(threshold, threshold + 0.15, lum);
      fragColor = vec4(vec3(factor), 1.0);
    }
    `;

    const godRaysGenerateShader = `
    precision highp float;
    #define TAPS_PER_PASS 6.0

    uniform sampler2D inputTexture;
    uniform vec3 vSunPositionScreenSpace;
    uniform float fStepSize;
    uniform float distanceAttenuation;
    uniform float maxDensity;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec2 delta = vSunPositionScreenSpace.xy - vUv;
      float dist = length(delta);
      vec2 stepv = fStepSize * delta / max(dist, 0.0001);
      float iters = dist / max(fStepSize, 0.00001);

      vec2 uv = vUv;
      float col = 0.0;
      float f = min(1.0, max(vSunPositionScreenSpace.z, 0.0));
      float atten = 1.0 / (1.0 + pow(dist, distanceAttenuation));

      if (0.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (1.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (2.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (3.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (4.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (5.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;

      float finalVal = min(col / TAPS_PER_PASS * atten, maxDensity);
      fragColor = vec4(vec3(finalVal), 1.0);
    }
    `;

    const anamorphicBrightShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float threshold;
    uniform float smoothWidth;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float v = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float alpha = smoothstep(threshold, threshold + smoothWidth, v);
      fragColor = mix(vec4(0.0), color, alpha);
    }
    `;

    const anamorphicBlurShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 resolution;
    uniform float samples;
    uniform float intensity;
    uniform vec3 tintColor;
    uniform float bloomRadius;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      int halfSamples = max(1, int(samples) / 2);
      float fHalfSamples = float(halfSamples);
      vec2 invSize = 1.0 / resolution;
      vec4 total = vec4(0.0);

      for (int i = -64; i <= 64; i++) {
        if (i < -halfSamples || i > halfSamples) continue;
        float softness = 1.0 - abs(float(i)) / fHalfSamples;
        softness = pow(softness, 2.0);
        vec2 shiftedUV = vec2(vUv.x + invSize.x * float(i) * (4.0 + bloomRadius * 8.0), vUv.y);
        shiftedUV = clamp(shiftedUV, 0.001, 0.999);
        total += texture(inputTexture, shiftedUV) * softness;
      }

      fragColor = (total / (samples / 3.0)) * vec4(tintColor, 1.0) * intensity;
    }
    `;

    const finalFragmentShader = `
    precision highp float;
    uniform vec2 resolution;
    uniform sampler2D inputTexture;
    uniform sampler2D blur0Texture;
    uniform sampler2D blur1Texture;
    uniform sampler2D blur2Texture;
    uniform sampler2D blur3Texture;
    uniform sampler2D blur4Texture;
    uniform sampler2D raysTexture;
    uniform sampler2D anamorphicTexture;
    uniform bool bloomEnabled;
    uniform float bloomStrength;
    uniform bool raysEnabled;
    uniform float raysStrength;
    uniform vec3 raysColor;
    uniform bool anamorphicEnabled;
    uniform float vignetteBoost;
    uniform float vignetteReduction;
    uniform float noiseIntensity;
    uniform float time;
    in vec2 vUv;
    out vec4 fragColor;

    vec3 sanitize(vec3 v) {
      if (isnan(v.x) || isinf(v.x)) v.x = 0.0;
      if (isnan(v.y) || isinf(v.y)) v.y = 0.0;
      if (isnan(v.z) || isinf(v.z)) v.z = 0.0;
      return clamp(v, vec3(0.0), vec3(65000.0));
    }

    float vignette(vec2 uv, float boost, float reduction) {
      vec2 position = vUv - 0.5;
      return boost - length(position) * reduction;
    }

    float hash1(uint n) {
      n = (n << 13U) ^ n;
      n = n * (n * n * 15731U + 789221U) + 1376312589U;
      return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
    }

    float noise(in vec2 uv, in float timeVal) {
      uvec2 p = uvec2(uv);
      return hash1(p.x + 1920U * p.y + (1920U * 1080U) * (uint(timeVal) % 65536U));
    }

    void main() {
      vec4 raw = texture(inputTexture, vUv);
      vec3 color = sanitize(raw.rgb);

      if (bloomEnabled && bloomStrength > 0.001) {
        vec3 b0 = sanitize(texture(blur0Texture, vUv).rgb);
        vec3 b1 = sanitize(texture(blur1Texture, vUv).rgb);
        vec3 b2 = sanitize(texture(blur2Texture, vUv).rgb);
        vec3 b3 = sanitize(texture(blur3Texture, vUv).rgb);
        vec3 b4 = sanitize(texture(blur4Texture, vUv).rgb);

        vec3 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
        color += bloomSum * bloomStrength;
      }

      if (raysEnabled && raysStrength > 0.001) {
        vec3 r = sanitize(texture(raysTexture, vUv).rgb);
        color += r * raysColor * raysStrength;
      }

      if (anamorphicEnabled) {
        vec3 a = sanitize(texture(anamorphicTexture, vUv).rgb);
        color += a;
      }

      float vig = max(0.0, vignette(vUv, vignetteBoost, vignetteReduction));
      color *= vig;
      color += max(0.0, noiseIntensity) * noise(gl_FragCoord.xy, time);
      fragColor = vec4(sanitize(color), 1.0);
    }
    `;

    const chromaticAberrationShaderChunk = `
    vec2 barrelDistortion(vec2 coord, float amt) {
      vec2 cc = coord - 0.5;
      float dist = dot(cc, cc);
      return coord + cc * dist * amt;
    }
    float sat(float t) { return clamp(t, 0.0, 1.0); }
    float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
    float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
    vec4 spectrum_offset(float t) {
      float lo = step(t, 0.5);
      float hi = 1.0 - lo;
      float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
      vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
      return pow(ret, vec4(1.0 / 2.2));
    }
    const float max_distort = 2.2;
    const int num_iter = 8;
    const float reci_num_iter_f = 1.0 / float(num_iter);
    vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
      vec4 sumcol = vec4(0.0);
      vec4 sumw = vec4(0.0);
      for (int i = 0; i < num_iter; ++i) {
        float t = float(i) * reci_num_iter_f;
        vec4 w = spectrum_offset(t);
        sumw += w;
        sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
      }
      return sumcol / sumw;
    }
    `;

    const colorFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float chromaticAberrationAmount;
    uniform float minInputLevel;
    uniform float maxInputLevel;
    uniform float gammaLevel;
    uniform float exposure;
    uniform float fisheyeStrength;
    uniform float fisheyeRadius;
    uniform float time;
    uniform int visionMode;
    uniform float thermalSensitivity;
    uniform float nightVisionNoise;
    uniform float nightVisionGain;
    uniform float crtIntensity;
    in vec2 vUv;
    out vec4 fragColor;

    ${chromaticAberrationShaderChunk}

    vec2 applyFisheye(vec2 uv, float strength, float radius) {
      if (abs(strength) < 0.0001) return uv;
      vec2 p = uv - 0.5;
      float d = length(p);
      if (d > radius * 1.5) return uv;
      float r = d / max(radius, 0.001);
      float theta = atan(p.y, p.x);
      float rDist = r + strength * (r * r * r);
      return 0.5 + vec2(cos(theta), sin(theta)) * (rDist * radius);
    }

    vec3 ACESFilmicToneMapping(vec3 color) {
      color = max(vec3(0.0), color);
      float a = 2.51;
      float b = 0.03;
      float c = 2.43;
      float d = 0.59;
      float e = 0.14;
      vec3 denom = max(color * (c * color + d) + e, vec3(0.0001));
      return clamp((color * (a * color + b)) / denom, 0.0, 1.0);
    }

    vec3 gammaCorrect(vec3 color, vec3 gamma) {
      return pow(max(color, vec3(0.0)), 1.0 / max(gamma, vec3(0.001)));
    }
    vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
      return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
    }
    vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
      return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
    }

    vec3 applyNightVision(vec3 color, vec2 uv, float timeVal, float noiseAmt, float gain, float crt) {
      float lum = dot(color, vec3(0.299, 0.587, 0.114));
      float amplified = pow(lum * gain, 0.72);
      vec3 phosphorColor = mix(vec3(0.02, 0.12, 0.03), vec3(0.18, 1.0, 0.32), clamp(amplified, 0.0, 1.0));
      phosphorColor += vec3(0.7, 1.0, 0.8) * max(0.0, amplified - 0.75) * 1.8;
      vec2 p = uv - 0.5;
      float tubeDist = length(p);
      float tubeMask = smoothstep(0.72, 0.44, tubeDist);
      float n = fract(sin(dot(uv * 280.0 + timeVal * 0.05, vec2(12.9898, 78.233))) * 43758.5453);
      float scanline = sin(uv.y * 650.0) * crt;
      phosphorColor += (n - 0.5) * noiseAmt * 2.0 + scanline;
      return clamp(phosphorColor * tubeMask, 0.0, 1.0);
    }

    vec3 ironbow(float t) {
      t = clamp(t, 0.0, 1.0);
      vec3 c0 = vec3(0.02, 0.01, 0.18);
      vec3 c1 = vec3(0.22, 0.02, 0.48);
      vec3 c2 = vec3(0.82, 0.05, 0.25);
      vec3 c3 = vec3(1.0, 0.62, 0.02);
      vec3 c4 = vec3(1.0, 1.0, 0.92);
      if (t < 0.25) return mix(c0, c1, t * 4.0);
      if (t < 0.50) return mix(c1, c2, (t - 0.25) * 4.0);
      if (t < 0.75) return mix(c2, c3, (t - 0.50) * 4.0);
      return mix(c3, c4, (t - 0.75) * 4.0);
    }

    vec3 applyThermal(vec3 color, vec2 uv, float sensitivity, float crt, bool whiteHot) {
      float lum = dot(color, vec3(0.299, 0.587, 0.114));
      float heat = clamp(lum * sensitivity, 0.0, 1.0);
      float sensorRaster = sin(uv.y * 900.0) * (crt * 0.3);
      heat = clamp(heat + sensorRaster, 0.0, 1.0);
      if (whiteHot) {
        float grad = pow(heat, 0.85);
        return vec3(grad);
      } else {
        return ironbow(heat);
      }
    }

    void main() {
      vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
      vec4 col = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
      vec3 finalCol = col.rgb;
      if (isnan(finalCol.x) || isinf(finalCol.x)) finalCol.x = 0.0;
      if (isnan(finalCol.y) || isinf(finalCol.y)) finalCol.y = 0.0;
      if (isnan(finalCol.z) || isinf(finalCol.z)) finalCol.z = 0.0;
      finalCol = clamp(finalCol, vec3(0.0), vec3(65000.0));

      if (visionMode == 1) {
        finalCol = applyNightVision(finalCol, uv, time, nightVisionNoise, nightVisionGain, crtIntensity);
      } else if (visionMode == 2) {
        finalCol = applyThermal(finalCol, uv, thermalSensitivity, crtIntensity, false);
      } else if (visionMode == 3) {
        finalCol = applyThermal(finalCol, uv, thermalSensitivity, crtIntensity, true);
      } else {
        vec3 exposedColor = finalCol * exposure;
        vec3 toneMappedColor = ACESFilmicToneMapping(exposedColor);
        finalCol = finalLevels(toneMappedColor, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
        if (crtIntensity > 0.0001) {
          float scanline = sin(uv.y * 900.0 + time * 2.0) * crtIntensity;
          finalCol -= scanline;
        }
      }

      fragColor = vec4(finalCol, 1.0);
    }
    `;

    const copyFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      fragColor = texture(inputTexture, vUv);
    }
    `;

    const fxaaFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 resolution;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec2 inverseVP = 1.0 / resolution;
      vec3 rgbNW = texture(inputTexture, vUv + vec2(-1.0, -1.0) * inverseVP).rgb;
      vec3 rgbNE = texture(inputTexture, vUv + vec2(1.0, -1.0) * inverseVP).rgb;
      vec3 rgbSW = texture(inputTexture, vUv + vec2(-1.0, 1.0) * inverseVP).rgb;
      vec3 rgbSE = texture(inputTexture, vUv + vec2(1.0, 1.0) * inverseVP).rgb;
      vec3 rgbM  = texture(inputTexture, vUv).rgb;

      vec3 luma = vec3(0.299, 0.587, 0.114);
      float lumaNW = dot(rgbNW, luma);
      float lumaNE = dot(rgbNE, luma);
      float lumaSW = dot(rgbSW, luma);
      float lumaSE = dot(rgbSE, luma);
      float lumaM  = dot(rgbM,  luma);

      float lumaMin = min(lumaM, min(min(lumaNW, lumaNE), min(lumaSW, lumaSE)));
      float lumaMax = max(lumaM, max(max(lumaNW, lumaNE), max(lumaSW, lumaSE)));

      vec2 dir;
      dir.x = -((lumaNW + lumaNE) - (lumaSW + lumaSE));
      dir.y =  ((lumaNW + lumaSW) - (lumaNE + lumaSE));

      float dirReduce = max((lumaNW + lumaNE + lumaSW + lumaSE) * (0.25 * (1.0 / 8.0)), 1.0 / 128.0);
      float rcpDirMin = 1.0 / (min(abs(dir.x), abs(dir.y)) + dirReduce);

      dir = min(vec2(8.0, 8.0), max(vec2(-8.0, -8.0), dir * rcpDirMin)) * inverseVP;

      vec3 rgbA = 0.5 * (
          texture(inputTexture, vUv + dir * (1.0 / 3.0 - 0.5)).rgb +
          texture(inputTexture, vUv + dir * (2.0 / 3.0 - 0.5)).rgb);
      vec3 rgbB = rgbA * 0.5 + 0.25 * (
          texture(inputTexture, vUv + dir * -0.5).rgb +
          texture(inputTexture, vUv + dir * 0.5).rgb);

      float lumaB = dot(rgbB, luma);
      if ((lumaB < lumaMin) || (lumaB > lumaMax)) {
          fragColor = vec4(rgbA, 1.0);
      } else {
          fragColor = vec4(rgbB, 1.0);
      }
    }
    `;

    const smaaFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 resolution;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec2 invRes = 1.0 / resolution;
      vec4 center = texture(inputTexture, vUv);

      vec3 cU = texture(inputTexture, vUv + vec2(0.0, -1.0) * invRes).rgb;
      vec3 cD = texture(inputTexture, vUv + vec2(0.0, 1.0) * invRes).rgb;
      vec3 cL = texture(inputTexture, vUv + vec2(-1.0, 0.0) * invRes).rgb;
      vec3 cR = texture(inputTexture, vUv + vec2(1.0, 0.0) * invRes).rgb;

      vec3 cUL = texture(inputTexture, vUv + vec2(-1.0, -1.0) * invRes).rgb;
      vec3 cUR = texture(inputTexture, vUv + vec2(1.0, -1.0) * invRes).rgb;
      vec3 cDL = texture(inputTexture, vUv + vec2(-1.0, 1.0) * invRes).rgb;
      vec3 cDR = texture(inputTexture, vUv + vec2(1.0, 1.0) * invRes).rgb;

      vec3 lumaW = vec3(0.299, 0.587, 0.114);
      float lM = dot(center.rgb, lumaW);
      float lU = dot(cU, lumaW);
      float lD = dot(cD, lumaW);
      float lL = dot(cL, lumaW);
      float lR = dot(cR, lumaW);

      float gx = (lR - lL) * 2.0 + (dot(cUR, lumaW) - dot(cUL, lumaW)) + (dot(cDR, lumaW) - dot(cDL, lumaW));
      float gy = (lD - lU) * 2.0 + (dot(cDL, lumaW) - dot(cUL, lumaW)) + (dot(cDR, lumaW) - dot(cUR, lumaW));
      float edgeStrength = length(vec2(gx, gy));

      if (edgeStrength < 0.04) {
        fragColor = center;
        return;
      }

      vec2 dir = normalize(vec2(-gy, gx)) * invRes * clamp(edgeStrength * 1.5, 0.5, 1.5);
      vec4 sampleA = texture(inputTexture, vUv + dir * 0.5);
      vec4 sampleB = texture(inputTexture, vUv - dir * 0.5);
      vec4 sampleC = texture(inputTexture, vUv + dir * 1.0);
      vec4 sampleD = texture(inputTexture, vUv - dir * 1.0);

      vec4 blended = (center * 2.0 + sampleA + sampleB + (sampleC + sampleD) * 0.5) / 5.0;
      fragColor = vec4(blended.rgb, center.a);
    }
    `;

    // Helper Functions & Passes

          this.setAntialiasMode(enabled ? 'MSAA 4x (Standard)' : 'Off (No Anti-Aliasing)');
        }
      }

      setMoonScreenPosition(camera, moonWorldPos) {
        if (!this._camDir) {
          this._camDir = new THREE.Vector3();
          this._toMoon = new THREE.Vector3();
          this._ndc = new THREE.Vector3();
        }
        camera.getWorldDirection(this._camDir);
        this._toMoon.copy(moonWorldPos).sub(camera.position).normalize();
        const dot = this._camDir.dot(this._toMoon);

        if (dot <= 0.02) {
          this.moonInFront = false;
          this.finalShader.uniforms.raysEnabled.value = false;
          return;
        }

        this.moonInFront = true;
        const fade = THREE.MathUtils.clamp((dot - 0.02) / 0.15, 0.0, 1.0);

        this._ndc.copy(moonWorldPos).project(camera);
        const screenX = this._ndc.x * 0.5 + 0.5;
        const screenY = this._ndc.y * 0.5 + 0.5;
        const screenZ = fade;

        this.moonScreenPos.set(screenX, screenY, screenZ);
        this.godRaysGenShader.uniforms.vSunPositionScreenSpace.value.set(screenX, screenY, screenZ);
      }

      renderScene(scene, camera) {
        if (!this.settings.enabled) {
          if (this.settings.fxaaEnabled || this.settings.smaaEnabled || (this.settings.msaaSamples && this.settings.msaaSamples > 0) || (this.settings.ssaaScale && this.settings.ssaaScale > 1.0)) {
            this.renderer.setRenderTarget(this.sceneTarget);
            this.renderer.render(scene, camera);
            this.renderer.setRenderTarget(null);
            if (this.settings.fxaaEnabled) {
              this.fxaaShader.uniforms.inputTexture.value = this.sceneTarget.texture;
              this.fxaaPass.render(this.renderer, true);
            } else if (this.settings.smaaEnabled) {
              this.smaaShader.uniforms.inputTexture.value = this.sceneTarget.texture;
              this.smaaPass.render(this.renderer, true);
            } else {
              this.copyPass.shader.uniforms.inputTexture.value = this.sceneTarget.texture;
              this.copyPass.render(this.renderer, true);
            }
          } else {
            this.renderer.setRenderTarget(null);
            this.renderer.render(scene, camera);
          }
          return;
        }
        this.renderer.setRenderTarget(this.sceneTarget);
        this.renderer.render(scene, camera);
        this.renderer.setRenderTarget(null);
        this.render(this.sceneTarget.texture);
      }

      render(sourceTexture) {
        if (!this.settings.enabled) {
          this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
          this.copyPass.render(this.renderer, true);
          return;
        }

        this.updateSettings();

        // 1. Atmospheric Bloom
        this.bloomPass.source = sourceTexture;
        this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
        this.bloomPass.render(this.renderer);

        this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
        this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
        this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
        this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
        this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

        // 2. Three.js Godrays
        if (this.settings.raysEnabled && this.settings.raysStrength > 0.001 && this.moonInFront) {
          this.godRaysMaskShader.uniforms.inputTexture.value = sourceTexture;
          this.godRaysMaskShader.uniforms.threshold.value = this.settings.raysThreshold;
          this.godRaysMaskPass.render(this.renderer);

          const filterLen = this.settings.raysDensity;
          const tapsPerPass = 6.0;

          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -1.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysMaskPass.texture;
          this.godRaysPingPong.render(this.renderer);

          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -2.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysPingPong.texture;
          this.godRaysPingPong.render(this.renderer);

          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -3.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysPingPong.texture;
          this.godRaysPingPong.render(this.renderer);

          this.finalPass.shader.uniforms.raysTexture.value = this.godRaysPingPong.texture;
          this.finalPass.shader.uniforms.raysEnabled.value = true;
        } else {
          this.finalPass.shader.uniforms.raysEnabled.value = false;
        }

        // 3. Three.js Anamorphic Flare
        if (this.settings.anamorphicEnabled && this.settings.anamorphicIntensity > 0.001) {
          this.anamorphicBrightShader.uniforms.inputTexture.value = sourceTexture;
          this.anamorphicBrightShader.uniforms.threshold.value = this.settings.anamorphicThreshold;
          this.anamorphicBrightShader.uniforms.smoothWidth.value = this.settings.anamorphicSmoothWidth;
          this.anamorphicBrightPass.render(this.renderer);

          this.anamorphicBlurShader.uniforms.inputTexture.value = this.anamorphicBrightPass.texture;
          this.anamorphicBlurShader.uniforms.samples.value = this.settings.anamorphicSamples;
          this.anamorphicBlurShader.uniforms.intensity.value = this.settings.anamorphicIntensity;
          this.anamorphicBlurShader.uniforms.tintColor.value.copy(this.settings.anamorphicColor);
          this.anamorphicBlurShader.uniforms.bloomRadius.value = this.settings.anamorphicRadius;
          this.anamorphicBlurPass.render(this.renderer);

          this.finalPass.shader.uniforms.anamorphicTexture.value = this.anamorphicBlurPass.texture;
          this.finalPass.shader.uniforms.anamorphicEnabled.value = true;
        } else {
          this.finalPass.shader.uniforms.anamorphicEnabled.value = false;
        }

        const randomTime = Math.random() * 100000;
        this.finalPass.shader.uniforms.time.value = randomTime;
        this.rgbPass.shader.uniforms.time.value = randomTime;

        this.finalPass.render(this.renderer);
        if (this.settings.fxaaEnabled || this.settings.useFxaa) {
          this.rgbPass.render(this.renderer, false);
          this.fxaaShader.uniforms.inputTexture.value = this.rgbPass.texture;
          this.fxaaPass.render(this.renderer, true);
        } else if (this.settings.smaaEnabled) {
          this.rgbPass.render(this.renderer, false);
          this.smaaShader.uniforms.inputTexture.value = this.rgbPass.texture;
          this.smaaPass.render(this.renderer, true);
        } else {
          this.rgbPass.render(this.renderer, true);
        }
      }

    // --- PROCEDURAL GLOW TEXTURE GENERATOR ---
    function createGlowTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
      grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
      grad.addColorStop(0.2, 'rgba(255, 255, 255, 0.85)');
      grad.addColorStop(0.5, 'rgba(255, 255, 255, 0.25)');
      grad.addColorStop(0.85, 'rgba(255, 255, 255, 0.03)');
      grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 128, 128);
      const texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;
      return texture;
    }
    const glowTexture = createGlowTexture();

    // --- SCENE, CAMERA, RENDERER INITIALIZATION ---

    let renderer = new THREE.WebGLRenderer({
      canvas: canvas,
      antialias: params.antialias,
      powerPreference: 'high-performance'
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(params.dpr);
    renderer.toneMapping = THREE.NoToneMapping; // Handled directly in PostProcessor

    let controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = params.damping;
    controls.screenSpacePanning = true;
    controls.minDistance = 3.0;
    controls.maxDistance = 160.0;

    let isUserInteracting = false;
    function bindControlEvents() {
      controls.addEventListener('start', () => { isUserInteracting = true; });
      controls.addEventListener('end', () => { isUserInteracting = false; });
    }
    bindControlEvents();

    // --- POST PROCESSOR INSTANCE (Anamorphic default is OFF) ---
    const postProcessor = new PostProcessor(renderer, {
      enabled: true,
      anamorphicEnabled: false, // Explicitly default OFF
      bloomEnabled: true,
      bloomStrength: 1.25,

    keyLight.position.set(params.keyLightPosX, params.keyLightPosY, params.keyLightPosZ);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(params.fillLightColor, params.fillLightIntensity * params.lightIntensityMultiplier);
    fillLight.position.set(params.fillLightPosX, params.fillLightPosY, params.fillLightPosZ);
    scene.add(fillLight);

    const coreLight = new THREE.PointLight(params.coreColor, params.coreLightIntensity * params.lightIntensityMultiplier, params.coreLightDistance, 1.2);
    coreLight.position.set(0, 0, 0);
    scene.add(coreLight);

    function updateLighting() {
      const mult = params.lightIntensityMultiplier;
      ambientLight.color.set(params.ambientColor);
      ambientLight.intensity = params.ambientIntensity * mult;

      keyLight.color.set(params.keyLightColor);
      keyLight.intensity = params.keyLightIntensity * mult;
      keyLight.position.set(params.keyLightPosX, params.keyLightPosY, params.keyLightPosZ);

      fillLight.color.set(params.fillLightColor);
      fillLight.intensity = params.fillLightIntensity * mult;
      fillLight.position.set(params.fillLightPosX, params.fillLightPosY, params.fillLightPosZ);

      coreLight.color.set(params.coreLightColor);
      coreLight.intensity = params.coreLightIntensity * mult;
      coreLight.distance = params.coreLightDistance;
    }

    // --- ROOT GRAPH CONTAINER ---
    const graphGroup = new THREE.Group();
    scene.add(graphGroup);

    // --- NEURAL NETWORK DATA STRUCTURES ---
    let nodeData = [];
    let edgeData = [];
    let adjacency = [];
    let pulses = [];

    let nodeInstancedMesh = null;
    let haloInstancedMesh = null;
    let edgeLineSegments = null;
    let pulseInstancedMesh = null;
    let ambientDustPoints = null;

    const dummyMatrix = new THREE.Matrix4();
    const dummyColor = new THREE.Color();
    const dummyPos = new THREE.Vector3();
    const dummyScale = new THREE.Vector3();

    const nodeMaterial = new THREE.MeshPhysicalMaterial({
      roughness: 0.22,
      metalness: 0.85,
      clearcoat: 0.6,
      clearcoatRoughness: 0.15,
      reflectivity: 0.9,
      transmission: 0.1,
      ior: 1.5
    });

    // --- GRAPH GENERATOR ---
    function buildNeuralGraph() {
      if (nodeInstancedMesh) graphGroup.remove(nodeInstancedMesh);
      if (haloInstancedMesh) graphGroup.remove(haloInstancedMesh);
      if (edgeLineSegments) graphGroup.remove(edgeLineSegments);
      if (pulseInstancedMesh) graphGroup.remove(pulseInstancedMesh);
      if (ambientDustPoints) graphGroup.remove(ambientDustPoints);

      nodeData = [];
      edgeData = [];
      adjacency = [];
      pulses = [];

      const count = Math.round(params.nodeCount);
      const R = params.clusterRadius;

      // 1. Generate Non-Uniform Spherical Cluster of Nodes
      for (let i = 0; i < count; i++) {
        const phi = Math.acos(1 - 2 * (i + 0.5) / count);
        const theta = Math.PI * (1 + Math.sqrt(5)) * i + (Math.random() - 0.5) * 0.4;
        const radialPow = Math.pow(Math.random(), 0.65);
        const r = R * (0.2 + 0.8 * radialPow);

        const x = r * Math.sin(phi) * Math.cos(theta);
        const y = r * Math.sin(phi) * Math.sin(theta);
        const z = r * Math.cos(phi);

        let tier = 'edge';
        let radius = 0.28 + Math.random() * 0.16;

        if (i < Math.max(5, Math.floor(count * 0.05))) {
          tier = 'core-hub';
          radius = 0.85 + Math.random() * 0.35;
        } else if (i < Math.floor(count * 0.28)) {
          tier = 'relay';
          radius = 0.48 + Math.random() * 0.22;
        }

        const basePos = new THREE.Vector3(x, y, z);
        nodeData.push({
          pos: basePos.clone(),
          basePos: basePos,
          radius: radius,
          tier: tier,
          degree: 0,
          phase: Math.random() * Math.PI * 2,
          driftSpeed: 0.4 + Math.random() * 0.8,
          driftOffset: new THREE.Vector3(
            (Math.random() - 0.5) * 0.5,
            (Math.random() - 0.5) * 0.5,
            (Math.random() - 0.5) * 0.5
          ),
          excitation: 0.0
        });
        adjacency.push([]);
      }

      // 2. Build Peer-to-Peer Full Mesh Network Edges
      const maxDist = params.maxPeerDistance;
      const minPeers = params.minPeersPerNode;

      for (let i = 0; i < count; i++) {
        const distances = [];
        for (let j = 0; j < count; j++) {
          if (i === j) continue;
          const d = nodeData[i].basePos.distanceTo(nodeData[j].basePos);
          distances.push({ index: j, dist: d });
        }
        distances.sort((a, b) => a.dist - b.dist);

        for (let k = 0; k < Math.min(minPeers, distances.length); k++) {
          addEdgeIfUnique(i, distances[k].index, distances[k].dist);
        }

        for (let k = minPeers; k < distances.length; k++) {
          if (distances[k].dist <= maxDist && adjacency[i].length < 9) {
            addEdgeIfUnique(i, distances[k].index, distances[k].dist);
          }
        }
      }

      const coreHubs = nodeData.map((n, idx) => ({ n, idx })).filter(item => item.n.tier === 'core-hub');
      for (let i = 0; i < coreHubs.length; i++) {
        for (let j = i + 1; j < coreHubs.length; j++) {
          const d = coreHubs[i].n.basePos.distanceTo(coreHubs[j].n.basePos);
          addEdgeIfUnique(coreHubs[i].idx, coreHubs[j].idx, d);
        }
      }

      function addEdgeIfUnique(idxA, idxB, dist) {
        const a = Math.min(idxA, idxB);
        const b = Math.max(idxA, idxB);
        const exists = edgeData.some(e => e.a === a && e.b === b);
        if (!exists) {
          const edgeIndex = edgeData.length;
          edgeData.push({ a, b, distance: dist });
          adjacency[a].push(edgeIndex);
          adjacency[b].push(edgeIndex);
          nodeData[a].degree++;
          nodeData[b].degree++;
        }
      }

      // 3. Create Node InstancedMesh
      const nodeGeo = new THREE.SphereGeometry(1, 28, 24);
      nodeInstancedMesh = new THREE.InstancedMesh(nodeGeo, nodeMaterial, count);
      nodeInstancedMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);

      // 4. Create Node Glowing Halos
      const haloGeo = new THREE.PlaneGeometry(1, 1);
      const haloMat = new THREE.MeshBasicMaterial({
        map: glowTexture,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        side: THREE.DoubleSide
      });
      haloInstancedMesh = new THREE.InstancedMesh(haloGeo, haloMat, count);
      haloInstancedMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);

      updateNodeColors();
      updateNodeTransforms(0);

      graphGroup.add(nodeInstancedMesh);
      graphGroup.add(haloInstancedMesh);

      // 5. Create Glowing Lines for Edges
      const edgePositions = new Float32Array(edgeData.length * 6);
      const edgeColors = new Float32Array(edgeData.length * 6);

      const colorEdge = new THREE.Color(params.edgeColor);
      const colorPrimary = new THREE.Color(params.nodePrimaryColor);
      const colorSecondary = new THREE.Color(params.nodeSecondaryColor);

      for (let e = 0; e < edgeData.length; e++) {
        const edge = edgeData[e];
        const posA = nodeData[edge.a].pos;
        const posB = nodeData[edge.b].pos;

        edgePositions[e * 6 + 0] = posA.x;
        edgePositions[e * 6 + 1] = posA.y;
        edgePositions[e * 6 + 2] = posA.z;
        edgePositions[e * 6 + 3] = posB.x;
        edgePositions[e * 6 + 4] = posB.y;
        edgePositions[e * 6 + 5] = posB.z;

        const cA = nodeData[edge.a].tier === 'core-hub' ? colorPrimary : colorSecondary;
        const cB = nodeData[edge.b].tier === 'core-hub' ? colorPrimary : colorEdge;

        edgeColors[e * 6 + 0] = cA.r;
        edgeColors[e * 6 + 1] = cA.g;
        edgeColors[e * 6 + 2] = cA.b;
        edgeColors[e * 6 + 3] = cB.r;
        edgeColors[e * 6 + 4] = cB.g;
        edgeColors[e * 6 + 5] = cB.b;
      }

      const lineGeo = new THREE.BufferGeometry();
      lineGeo.setAttribute('position', new THREE.BufferAttribute(edgePositions, 3));
      lineGeo.setAttribute('color', new THREE.BufferAttribute(edgeColors, 3));

      const lineMat = new THREE.LineBasicMaterial({
        vertexColors: true,
        transparent: true,
        opacity: params.edgeOpacity,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      edgeLineSegments = new THREE.LineSegments(lineGeo, lineMat);
      graphGroup.add(edgeLineSegments);

      // 6. Network Light Pulses
      const pulseGeo = new THREE.SphereGeometry(1, 14, 12);
      const pulseMat = new THREE.MeshBasicMaterial({
        color: new THREE.Color(params.pulseColor),
        blending: THREE.AdditiveBlending,
        transparent: true,
        opacity: 0.95
      });

      pulseInstancedMesh = new THREE.InstancedMesh(pulseGeo, pulseMat, params.pulseCount);
      pulseInstancedMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);

      for (let p = 0; p < params.pulseCount; p++) {
        const randomEdgeIdx = Math.floor(Math.random() * edgeData.length);
        pulses.push({
          edgeIndex: randomEdgeIdx,
          progress: Math.random(),
          speed: (0.6 + Math.random() * 1.1) * params.pulseSpeed,
          forward: Math.random() > 0.5,
          size: 0.22 + Math.random() * 0.24,
          glowMultiplier: 1.0 + Math.random() * 0.8
        });
      }
      graphGroup.add(pulseInstancedMesh);

      // 7. Ambient Synaptic Dust Particles
      const dustCount = 400;
      const dustGeo = new THREE.BufferGeometry();
      const dustPositions = new Float32Array(dustCount * 3);
      for (let d = 0; d < dustCount; d++) {
        const rad = R * 1.25 * Math.cbrt(Math.random());
        const u = Math.random();
        const v = Math.random();
        const th = u * 2.0 * Math.PI;
        const ph = Math.acos(2.0 * v - 1.0);
        dustPositions[d * 3 + 0] = rad * Math.sin(ph) * Math.cos(th);
        dustPositions[d * 3 + 1] = rad * Math.sin(ph) * Math.sin(th);
        dustPositions[d * 3 + 2] = rad * Math.cos(ph);
      }
      dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));
      const dustMat = new THREE.PointsMaterial({
        map: glowTexture,
        size: 0.7,
        color: new THREE.Color(params.nodePrimaryColor),
        transparent: true,
        opacity: 0.35,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      ambientDustPoints = new THREE.Points(dustGeo, dustMat);
      graphGroup.add(ambientDustPoints);
    }

    // --- NODE POSITION & SCALE UPDATE ---
    function updateNodeTransforms(time) {
      if (!nodeInstancedMesh) return;

      const baseScale = params.nodeScale;
      const camQuat = camera.quaternion;

      for (let i = 0; i < nodeData.length; i++) {
        const n = nodeData[i];
        const wave = Math.sin(time * n.driftSpeed + n.phase);
        n.pos.copy(n.basePos).addScaledVector(n.driftOffset, wave);

        const excitationScale = 1.0 + n.excitation * 0.75;
        const s = n.radius * baseScale * excitationScale;

        dummyMatrix.makeScale(s, s, s);
        dummyMatrix.setPosition(n.pos);
        nodeInstancedMesh.setMatrixAt(i, dummyMatrix);

        const haloScale = s * (n.tier === 'core-hub' ? 4.8 : 3.2);
        dummyMatrix.makeRotationFromQuaternion(camQuat);
        dummyMatrix.scale(dummyScale.set(haloScale, haloScale, haloScale));
        dummyMatrix.setPosition(n.pos);
        haloInstancedMesh.setMatrixAt(i, dummyMatrix);
      }

      nodeInstancedMesh.instanceMatrix.needsUpdate = true;
      haloInstancedMesh.instanceMatrix.needsUpdate = true;
    }

    // --- COLORS UPDATE LOGIC ---
    function updateNodeColors() {
      if (!nodeInstancedMesh) return;

      const cPrimary = new THREE.Color(params.nodePrimaryColor);
      const cSecondary = new THREE.Color(params.nodeSecondaryColor);
      const cCore = new THREE.Color(params.coreColor);

      for (let i = 0; i < nodeData.length; i++) {
        const n = nodeData[i];
        if (n.tier === 'core-hub') {
          dummyColor.copy(cCore).lerp(cPrimary, 0.4);
        } else if (n.tier === 'relay') {
          dummyColor.copy(cPrimary).lerp(cSecondary, 0.5);
        } else {
          dummyColor.copy(cSecondary);
        }
        nodeInstancedMesh.setColorAt(i, dummyColor);
      }
      if (nodeInstancedMesh.instanceColor) {
        nodeInstancedMesh.instanceColor.needsUpdate = true;
      }
    }

    function updateColors() {
      updateBackground();
      updateNodeColors();
      updateLighting();

      if (edgeLineSegments) {
        edgeLineSegments.material.opacity = params.edgeOpacity;
        const colAttr = edgeLineSegments.geometry.attributes.color;
        const colEdge = new THREE.Color(params.edgeColor);
        const colPrimary = new THREE.Color(params.nodePrimaryColor);
        const colSecondary = new THREE.Color(params.nodeSecondaryColor);

        for (let e = 0; e < edgeData.length; e++) {
          const edge = edgeData[e];
          const cA = nodeData[edge.a].tier === 'core-hub' ? colPrimary : colSecondary;
          const cB = nodeData[edge.b].tier === 'core-hub' ? colPrimary : colEdge;

          colAttr.setXYZ(e * 2 + 0, cA.r, cA.g, cA.b);
          colAttr.setXYZ(e * 2 + 1, cB.r, cB.g, cB.b);
        }
        colAttr.needsUpdate = true;
      }

      if (pulseInstancedMesh) {
        pulseInstancedMesh.material.color.set(params.pulseColor);
      }

      if (ambientDustPoints) {
        ambientDustPoints.material.color.set(params.nodePrimaryColor);
      }
    }

    function updateBackground() {
      if (params.greenScreen) {
        scene.background.set('#00ff00');
        document.body.style.backgroundColor = '#00ff00';
      } else {
        scene.background.set(params.bgColor);
        document.body.style.backgroundColor = params.bgColor;
      }
    }

    function applyColorScheme(schemeName) {
      const scheme = COLOR_SCHEMES[schemeName];
      if (!scheme) return;

      params.colorScheme = schemeName;
      params.bgColor = scheme.bg;
      params.nodePrimaryColor = scheme.nodePrimary;
      params.nodeSecondaryColor = scheme.nodeSecondary;
      params.edgeColor = scheme.edge;
      params.pulseColor = scheme.pulse;
      params.coreColor = scheme.core;
      params.ambientColor = scheme.ambient;
      params.keyLightColor = scheme.keyLight;
      params.fillLightColor = scheme.fillLight;
      params.coreLightColor = scheme.core;

      updateColors();
      gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    function updateAntialiasSetting(antialiasValue) {
      params.antialias = antialiasValue;
      postProcessor.setAntialias(antialiasValue);
    }

    // --- PROCEDURAL RANDOMIZATION ON USER CLICK ---
    // IMPORTANT: DOES NOT TOUCH OR SHUFFLE POSTPROCESSING SETTINGS!
    function randomizeScene() {
      // 1. Pick a random color scheme from the 21 presets
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const chosenScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      applyColorScheme(chosenScheme);

      // 2. Randomize geometric parameters only
      params.nodeCount = Math.floor(95 + Math.random() * 85);
      params.clusterRadius = +(11.0 + Math.random() * 6.5).toFixed(1);
      params.maxPeerDistance = +(6.0 + Math.random() * 3.5).toFixed(1);
      params.nodeScale = +(0.8 + Math.random() * 0.55).toFixed(2);
      params.edgeOpacity = +(0.35 + Math.random() * 0.35).toFixed(2);
      params.pulseCount = Math.floor(120 + Math.random() * 140);
      params.pulseSpeed = +(0.7 + Math.random() * 1.1).toFixed(2);

      // 3. Randomize camera motion animation preset
      const animPresets = [
        'Static (Internal Pulses Only)',
        'Gentle Orbit (360° Horizontal)',
        'Slow Pitch & Yaw (Lissajous Drift)',
        'Deep Core Spiral (Orbital Helix)',
        'Polar Zenith Drift (High Angle Float)',
        'Pulsing Wave Cam (Harmonic Float)',
        'Synaptic Sweep (Continuous Glide)',
        'Panoramic Roll (Slow Axial Drift)'
      ];
      params.animationPreset = animPresets[Math.floor(Math.random() * animPresets.length)];

      // 4. Rebuild the graph geometry
      buildNeuralGraph();

      // 5. GSAP pop transition
      gsap.fromTo(graphGroup.scale,
        { x: 0.82, y: 0.82, z: 0.82 },
        { x: 1.0, y: 1.0, z: 1.0, duration: 0.9, ease: 'back.out(1.8)' }
      );

      // 6. Update GUI display (postprocessing settings remain untouched)
      gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    // --- INTERACTIVE CLICK DETECTION (Distinguishes Drag vs Click) ---
    let pointerDownPos = { x: 0, y: 0 };
    let pointerDownTime = 0;

    window.addEventListener('pointerdown', (e) => {
      pointerDownPos = { x: e.clientX, y: e.clientY };
      pointerDownTime = performance.now();
    });

    window.addEventListener('pointerup', (e) => {
      if (e.target.closest && e.target.closest('.lil-gui')) return;

      const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
      const elapsed = performance.now() - pointerDownTime;

      if (dist < 6 && elapsed < 350) {
        if (params.clickToRandomize) {
          randomizeScene();
        }
      }
    });

    // --- KEYBOARD LISTENER (Hide/Show UI with 'H') ---
    window.addEventListener('keydown', (e) => {
      if (e.code === 'KeyH' || e.key === 'h' || e.key === 'H') {
        gui._hidden ? gui.show() : gui.hide();
      }
    });

    // --- WINDOW RESIZE ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);
    });

    // --- INITIAL GRAPH BUILD ---
    buildNeuralGraph();

    // --- LIL-GUI SETUP (Default Unmodified Styles, English Labels) ---
    const gui = new GUI({ title: 'Neural Graph Database' });

    // 1. Color Themes Folder
    const fTheme = gui.addFolder('Color Schemes & Background');
    fTheme.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Color Scheme').onChange(v => applyColorScheme(v));
    fTheme.add(params, 'greenScreen').name('Green Screen (#00ff00)').onChange(() => updateBackground());
    fTheme.addColor(params, 'bgColor').name('Background Color').onChange(() => updateBackground());
    fTheme.addColor(params, 'nodePrimaryColor').name('Node Primary Color').onChange(() => updateColors());
    fTheme.addColor(params, 'nodeSecondaryColor').name('Node Secondary Color').onChange(() => updateColors());
    fTheme.addColor(params, 'edgeColor').name('Edge Line Color').onChange(() => updateColors());
    fTheme.addColor(params, 'pulseColor').name('Light Pulse Color').onChange(() => updateColors());
    fTheme.addColor(params, 'coreColor').name('Core Glow Color').onChange(() => updateColors());

    // 2. Camera & Animation Modes Folder
    const fCamera = gui.addFolder('Camera & Animation Modes');
    const animOptions = [
      'Static (Internal Pulses Only)',
      'Gentle Orbit (360° Horizontal)',
      'Slow Pitch & Yaw (Lissajous Drift)',
      'Deep Core Spiral (Orbital Helix)',
      'Polar Zenith Drift (High Angle Float)',
      'Pulsing Wave Cam (Harmonic Float)',
      'Synaptic Sweep (Continuous Glide)',
      'Panoramic Roll (Slow Axial Drift)'
    ];
    fCamera.add(params, 'animationPreset', animOptions).name('Animation Mode');
    fCamera.add(params, 'animSpeed', 0.0, 3.0, 0.05).name('Animation Speed');
    fCamera.add(params, 'damping', 0.01, 0.15, 0.01).name('Controls Damping').onChange(v => { controls.dampingFactor = v; });

    // 3. Lighting & Exposure Folder
    const fLight = gui.addFolder('Lighting & Exposure');
    fLight.add(params, 'exposure', 0.1, 3.0, 0.05).name('Tone Exposure').onChange(v => {
      postProcessor.settings.exposure = v;
      postProcessor.updateSettings();
    });
    fLight.add(params, 'lightIntensityMultiplier', 0.1, 3.0, 0.05).name('Scene Light Intensity').onChange(() => updateLighting());
    fLight.addColor(params, 'ambientColor').name('Ambient Color').onChange(() => updateLighting());
    fLight.add(params, 'ambientIntensity', 0.0, 3.0, 0.05).name('Ambient Intensity').onChange(() => updateLighting());
    fLight.addColor(params, 'keyLightColor').name('Key Light Color').onChange(() => updateLighting());
    fLight.add(params, 'keyLightIntensity', 0.0, 4.0, 0.05).name('Key Light Intensity').onChange(() => updateLighting());
    fLight.add(params, 'keyLightPosX', -50, 50, 1).name('Key Light Pos X').onChange(() => updateLighting());
    fLight.add(params, 'keyLightPosY', -50, 50, 1).name('Key Light Pos Y').onChange(() => updateLighting());
    fLight.add(params, 'keyLightPosZ', -50, 50, 1).name('Key Light Pos Z').onChange(() => updateLighting());
    fLight.addColor(params, 'fillLightColor').name('Fill Light Color').onChange(() => updateLighting());
    fLight.add(params, 'fillLightIntensity', 0.0, 3.0, 0.05).name('Fill Light Intensity').onChange(() => updateLighting());
    fLight.addColor(params, 'coreLightColor').name('Core Light Color').onChange(() => updateLighting());
    fLight.add(params, 'coreLightIntensity', 0.0, 6.0, 0.1).name('Core Light Intensity').onChange(() => updateLighting());
    fLight.add(params, 'coreLightDistance', 10, 100, 1).name('Core Light Distance').onChange(() => updateLighting());

    // 4. Network Geometry & Mesh Topology Folder
    const fGraph = gui.addFolder('Network Graph Topology');
    fGraph.add(params, 'nodeCount', 60, 220, 1).name('Node Count').onFinishChange(() => buildNeuralGraph());
    fGraph.add(params, 'clusterRadius', 8.0, 22.0, 0.5).name('Cluster Radius').onFinishChange(() => buildNeuralGraph());
    fGraph.add(params, 'maxPeerDistance', 4.0, 12.0, 0.2).name('Max Peer Distance').onFinishChange(() => buildNeuralGraph());
    fGraph.add(params, 'nodeScale', 0.3, 2.5, 0.05).name('Node Scale Factor');
    fGraph.add(params, 'edgeOpacity', 0.1, 1.0, 0.02).name('Edge Line Opacity').onChange(v => {
      if (edgeLineSegments) edgeLineSegments.material.opacity = v;
    });
    fGraph.add(params, 'pulseCount', 40, 350, 10).name('Pulse Count').onFinishChange(() => buildNeuralGraph());
    fGraph.add(params, 'pulseSpeed', 0.2, 3.0, 0.05).name('Pulse Travel Speed');

    // 5. Render Settings & Randomization Folder
    const fRender = gui.addFolder('Render & Randomization');
    fRender.add(params, 'dpr', 0.5, 3.0, 0.1).name('Pixel Ratio (DPR)').onChange(v => {
      renderer.setPixelRatio(v);
      postProcessor.setSize(window.innerWidth, window.innerHeight, v);
    });
    fRender.add(params, 'antialias').name('Scene Antialias (Default On)').onChange(v => updateAntialiasSetting(v));
    fRender.add(params, 'clickToRandomize').name('Click Scene to Randomize');
    fRender.add(params, 'randomize').name('Generate Random Variation');

    // 6. PostProcessor Suite Integration
    postProcessor.attachGUI(gui, 'Post-Processing Suite');

    // --- ANIMATION LOOP (Preserving Zoom & Manual Angles) ---
    const clock = new THREE.Clock();
    let animVirtualTime = 0;

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const scaledDelta = delta * params.animSpeed;
      animVirtualTime += scaledDelta;

      // 1. OrbitControls handles user drag and wheel inputs
      controls.update();

      // 2. Camera Motion Animation Presets:
      // Preserves current user zoom distance and manual angle adjustments!
      if (!isUserInteracting && params.animationPreset !== 'Static (Internal Pulses Only)') {
        const offset = camera.position.clone().sub(controls.target);
        const currentDistance = offset.length();
        const spherical = new THREE.Spherical().setFromVector3(offset);

        switch (params.animationPreset) {
          case 'Gentle Orbit (360° Horizontal)':
            spherical.theta += 0.16 * scaledDelta;
            break;

          case 'Slow Pitch & Yaw (Lissajous Drift)':
            spherical.theta += 0.14 * scaledDelta;
            spherical.phi += Math.sin(animVirtualTime * 0.45) * 0.06 * scaledDelta;
            break;

          case 'Deep Core Spiral (Orbital Helix)':
            spherical.theta += 0.20 * scaledDelta;
            spherical.phi += Math.cos(animVirtualTime * 0.35) * 0.08 * scaledDelta;
            break;

          case 'Polar Zenith Drift (High Angle Float)':
            spherical.theta += 0.09 * scaledDelta;
            spherical.phi += Math.sin(animVirtualTime * 0.3) * 0.12 * scaledDelta;
            break;

          case 'Pulsing Wave Cam (Harmonic Float)':
            spherical.theta += Math.sin(animVirtualTime * 0.4) * 0.12 * scaledDelta;
            spherical.phi += Math.cos(animVirtualTime * 0.3) * 0.07 * scaledDelta;
            break;

          case 'Synaptic Sweep (Continuous Glide)':
            spherical.theta += 0.28 * scaledDelta;
            spherical.phi += Math.sin(animVirtualTime * 0.2) * 0.04 * scaledDelta;
            break;

          case 'Panoramic Roll (Slow Axial Drift)':
            spherical.theta -= 0.16 * scaledDelta;
            spherical.phi += Math.cos(animVirtualTime * 0.25) * 0.05 * scaledDelta;
            break;
        }

        spherical.phi = Math.max(0.08, Math.min(Math.PI - 0.08, spherical.phi));
        spherical.radius = currentDistance;

        offset.setFromSpherical(spherical);
        camera.position.copy(controls.target).add(offset);
        camera.lookAt(controls.target);
      }

      // 3. Update Nodes & Excitation Decay
      for (let i = 0; i < nodeData.length; i++) {
        if (nodeData[i].excitation > 0) {
          nodeData[i].excitation = Math.max(0, nodeData[i].excitation - scaledDelta * 3.2);
        }
      }
      updateNodeTransforms(animVirtualTime);

      // 4. Update Edge Line Segments
      if (edgeLineSegments) {
        const posAttr = edgeLineSegments.geometry.attributes.position;
        for (let e = 0; e < edgeData.length; e++) {
          const edge = edgeData[e];
          const posA = nodeData[edge.a].pos;
          const posB = nodeData[edge.b].pos;

          posAttr.setXYZ(e * 2 + 0, posA.x, posA.y, posA.z);
          posAttr.setXYZ(e * 2 + 1, posB.x, posB.y, posB.z);
        }
        posAttr.needsUpdate = true;
      }

      // 5. Update Light Pulses (Data Packets Jumping Across the Network)
      if (pulseInstancedMesh && edgeData.length > 0) {
        const pSpeedFactor = params.pulseSpeed;

        for (let p = 0; p < pulses.length; p++) {
          const pulse = pulses[p];
          pulse.progress += pulse.speed * pSpeedFactor * scaledDelta;

          const edge = edgeData[pulse.edgeIndex];
          const nodeStart = pulse.forward ? edge.a : edge.b;
          const nodeEnd = pulse.forward ? edge.b : edge.a;

          const posA = nodeData[nodeStart].pos;
          const posB = nodeData[nodeEnd].pos;

          if (pulse.progress >= 1.0) {
            nodeData[nodeEnd].excitation = 1.0;

            const adjEdges = adjacency[nodeEnd];
            if (adjEdges && adjEdges.length > 0) {
              const nextEdgeIdx = adjEdges[Math.floor(Math.random() * adjEdges.length)];
              pulse.edgeIndex = nextEdgeIdx;
              const nextEdge = edgeData[nextEdgeIdx];
              pulse.forward = (nextEdge.a === nodeEnd);
            } else {
              pulse.edgeIndex = Math.floor(Math.random() * edgeData.length);
              pulse.forward = Math.random() > 0.5;
            }
            pulse.progress = 0.0;
            pulse.speed = (0.6 + Math.random() * 1.1);
          }

          dummyPos.lerpVectors(posA, posB, pulse.progress);
          const pulseScale = pulse.size * (1.0 + Math.sin(animVirtualTime * 6.0 + p) * 0.25);
          dummyMatrix.makeScale(pulseScale, pulseScale, pulseScale);
          dummyMatrix.setPosition(dummyPos);
          pulseInstancedMesh.setMatrixAt(p, dummyMatrix);
        }
        pulseInstancedMesh.instanceMatrix.needsUpdate = true;
      }

      // 6. Slow Ambient Dust Drift
      if (ambientDustPoints) {
        ambientDustPoints.rotation.y += 0.03 * scaledDelta;
        ambientDustPoints.rotation.x += 0.015 * scaledDelta;
      }

      // 7. Post-Processing Multi-Pass Render
      postProcessor.setMoonScreenPosition(camera, coreLight.position);
      postProcessor.renderScene(scene, camera);
    }

    animate();
  </script>
</body>
