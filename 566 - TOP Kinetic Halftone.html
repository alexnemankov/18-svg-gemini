<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>571 - Kinetic Halftone Aperture</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #121316;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background: radial-gradient(circle at center, #1e2026 0%, #0d0e12 100%);
    }

    canvas {
      display: block;
      cursor: pointer;
      touch-action: none;
      transition: box-shadow 0.35s cubic-bezier(0.16, 1, 0.3, 1), transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Framed Presentation Mode for Art Print / Square aspect ratios */
    body.framed-mode canvas {
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.65), 0 0 0 14px rgba(255, 255, 255, 0.95), 0 0 0 16px rgba(0, 0, 0, 0.2);
      border-radius: 4px;
    }

    /* Glassmorphic Heads-Up Display */
    #hud {
      position: fixed;
      bottom: 24px;
      left: 24px;
      z-index: 100;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .hud-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hud-title {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 0 0 16px rgba(255, 255, 255, 0.35), 0 2px 4px rgba(0, 0, 0, 0.8);
    }

    .hud-badge {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1px;
      padding: 2px 8px;
      border-radius: 12px;
      background: rgba(255, 140, 0, 0.2);
      border: 1px solid rgba(255, 140, 0, 0.45);
      color: #ffa500;
      text-transform: uppercase;
      text-shadow: 0 0 8px rgba(255, 140, 0, 0.6);
    }

    .hud-meta {
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.8px;
      color: rgba(255, 255, 255, 0.65);
      display: flex;
      align-items: center;
      gap: 8px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
    }

    .hud-hints {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }

    .key-tag {
      background: rgba(18, 22, 32, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 3px 8px;
      border-radius: 5px;
      font-size: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: rgba(255, 255, 255, 0.85);
      letter-spacing: 0.5px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    .key-tag span {
      color: #ffa500;
      font-weight: 600;
    }

    /* Floating Toast Notification */
    #toast {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(18, 22, 32, 0.94);
      border: 1px solid rgba(255, 140, 0, 0.4);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7), 0 0 16px rgba(255, 140, 0, 0.25);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 9px 22px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.8px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 9px;
      z-index: 1000;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #toast.toast-visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast-icon {
      font-size: 14px;
    }

    /* FPS Counter Badge */
    #fps-badge {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 100;
      font-size: 11px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: rgba(255, 255, 255, 0.7);
      background: rgba(18, 22, 32, 0.82);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 5px 12px;
      border-radius: 20px;
      pointer-events: none;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      transition: opacity 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #fps-badge .indicator {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #00ff88;
      box-shadow: 0 0 8px #00ff88;
    }

    /* lil-gui Custom Dark Glass Styling */
    .lil-gui.root {
      --background-color: rgba(16, 20, 28, 0.92);
      --text-color: #e6ebf2;
      --title-background-color: rgba(26, 32, 45, 0.95);
      --widget-color: rgba(32, 40, 58, 0.85);
      --hover-color: rgba(48, 60, 85, 0.9);
      --focus-color: rgba(255, 140, 0, 0.85);
      --number-color: #38bdf8;
      --string-color: #fbcfe8;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      --font-size: 11px;
      --folder-indent: 10px;
      
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 1000;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.65);
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .lil-gui .title {
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* Hidden UI Mode (Gallery Presentation) */
    body.hidden-ui #hud,
    body.hidden-ui .lil-gui.root,
    body.hidden-ui #fps-badge,
    body.hidden-ui #toast {
      opacity: 0 !important;
      transform: translateY(10px);
      pointer-events: none !important;
    }
  </style>

  <!-- p5.js Library (2.3.3 as required, with robust CDN fallback) -->
  <script src="https://cdn.jsdelivr.net/npm/p5@2.3.3/lib/p5.min.js"></script>
  <script>
    if (typeof window.p5 === 'undefined') {
      document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.0/p5.min.js"><\/script>');
    }
  </script>
  <!-- lil-gui Library -->
  <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.19.1/dist/lil-gui.umd.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- HUD -->
  <div id="hud">
    <div class="hud-header">
      <div class="hud-title">Kinetic Halftone Aperture</div>
      <div class="hud-badge">Op-Art Moiré</div>
    </div>
    <div class="hud-meta">
      Procedural Multi-Layer Parallax Iris & Halftone Screen System
    </div>
    <div class="hud-hints">
      <div class="key-tag"><span>Click / Space</span> Randomize</div>
      <div class="key-tag"><span>H</span> Toggle UI</div>
      <div class="key-tag"><span>P</span> Play/Pause</div>
      <div class="key-tag"><span>S</span> Save PNG</div>
      <div class="key-tag"><span>F</span> Fullscreen</div>
    </div>
  </div>

  <!-- Floating Toast Notification -->
  <div id="toast">
    <span class="toast-icon">✨</span>
    <span id="toast-message">New Theme Generated</span>
  </div>

  <!-- FPS Badge -->
  <div id="fps-badge">
    <div class="indicator"></div>
    <span id="fps-val">60 FPS</span>
  </div>

  <script>
    /**
     * Kinetic Halftone Aperture
     * Enhanced Fullscreen Production Release with Procedural Randomization,
     * Automatic Hypnotic Motion Dynamics, 19 Curated Color Schemes & lil-gui.
     */

    // =========================================================================
    // 19 CURATED COLOR SCHEMES
    // =========================================================================
    const COLOR_SCHEMES = {
      'Solaris Amber & Cyan (Original)': {
        pens: ['yellow', 'orange', 'darkorange', 'red', 'darkcyan'],
        bg: '#d4d4d4', // 212 grayscale from original
        blend: 'MULTIPLY'
      },
      'Bauhaus Primary 1923': {
        pens: ['#f1c40f', '#e67e22', '#e74c3c', '#2980b9', '#1b2631'],
        bg: '#ece9df',
        blend: 'MULTIPLY'
      },
      'Tokyo Cyberpunk Risograph': {
        pens: ['#00f0ff', '#ff007f', '#7928ca', '#ffe600', '#00ff88'],
        bg: '#0c0e14',
        blend: 'SCREEN'
      },
      'Nordic Cobalt & Terracotta': {
        pens: ['#f4a261', '#e76f51', '#2a9d8f', '#264653', '#1d3557'],
        bg: '#dedad2',
        blend: 'MULTIPLY'
      },
      'Kyoto Bamboo & Ochre': {
        pens: ['#e8d8c8', '#c9a227', '#6b8e23', '#2e5a27', '#1b381e'],
        bg: '#f3efe6',
        blend: 'MULTIPLY'
      },
      'Editorial CMYK Separation': {
        pens: ['#ffff00', '#ff00aa', '#00e5ff', '#1a1a1a', '#ff4500'],
        bg: '#f0ede6',
        blend: 'MULTIPLY'
      },
      'Psychedelic Inversion': {
        pens: ['#ff0055', '#00ffcc', '#ffcc00', '#9900ff', '#0066ff'],
        bg: '#808080',
        blend: 'DIFFERENCE'
      },
      'Matcha & Rose Plum': {
        pens: ['#f2cc8f', '#e07a5f', '#81b29a', '#3d405b', '#2b2d42'],
        bg: '#ede8dd',
        blend: 'MULTIPLY'
      },
      'Vaporwave Horizon': {
        pens: ['#ff71ce', '#01cdfe', '#05ffa1', '#b967ff', '#fffb96'],
        bg: '#14092b',
        blend: 'SCREEN'
      },
      'Monochrome Ink & Charcoal': {
        pens: ['#ffffff', '#cccccc', '#888888', '#444444', '#111111'],
        bg: '#e4e4e4',
        blend: 'MULTIPLY'
      },
      'Mediterranean Majolica': {
        pens: ['#ffb703', '#fb8500', '#023047', '#219ebc', '#8ecae6'],
        bg: '#f8f5ee',
        blend: 'MULTIPLY'
      },
      'Autumn Maple Canopy': {
        pens: ['#ffbe0b', '#fb5607', '#ff006e', '#8338ec', '#3a86ff'],
        bg: '#f4ece0',
        blend: 'MULTIPLY'
      },
      'Bioluminescent Deep Sea': {
        pens: ['#64dfdf', '#48cae4', '#0077b6', '#023e8a', '#03045e'],
        bg: '#050811',
        blend: 'SCREEN'
      },
      'Sunset Desert Adobe': {
        pens: ['#ffd166', '#f78c6b', '#8338ec', '#3a86ff', '#06d6a0'],
        bg: '#ebdccb',
        blend: 'MULTIPLY'
      },
      'Swiss Modernist Red & Carbon': {
        pens: ['#ff2a2a', '#e60000', '#990000', '#333333', '#0a0a0a'],
        bg: '#dfdfdf',
        blend: 'MULTIPLY'
      },
      'Pastel Dream Halftone': {
        pens: ['#ffb3ba', '#ffdfba', '#ffffba', '#baffc9', '#bae1ff'],
        bg: '#fcfbfa',
        blend: 'MULTIPLY'
      },
      'Acid Rave 90s': {
        pens: ['#ccff00', '#ff007f', '#00ffff', '#7000ff', '#ffaa00'],
        bg: '#0c0c14',
        blend: 'SCREEN'
      },
      'Terracotta & Olive Mist': {
        pens: ['#ddb892', '#b08968', '#7f5539', '#588157', '#344e41'],
        bg: '#f4ece1',
        blend: 'MULTIPLY'
      },
      'Midnight Neon Eclipse': {
        pens: ['#ff003c', '#ff8400', '#ffe600', '#00f6ff', '#b000ff'],
        bg: '#08080c',
        blend: 'ADD'
      }
    };

    const SCHEME_KEYS = Object.keys(COLOR_SCHEMES);

    // =========================================================================
    // PARAMETERS & STATE CONFIGURATION
    // =========================================================================
    const params = {
      // Color & Theme
      paletteScheme: 'Solaris Amber & Cyan (Original)',
      bgColor: '#d4d4d4',
      blendMode: 'MULTIPLY',
      autoMatchThemeBg: true,
      layerOpacity: 1.0,

      // Geometry & Aperture Grid
      minNumSide: 4,
      spacingFactor: 0.95,
      sizeStepFactor: 0.05,
      holeScale: 1.0,
      shapeType: 'Circle', // 'Circle', 'Square', 'Rounded Rect', 'Diamond', 'Hexagon', 'Octagon'
      extraMargin: 2,

      // Automatic Animation Dynamics (Core user request)
      autoAnimate: true,
      motionMode: 'Lissajous', // 'Lissajous', 'Perlin Flow', 'Lemniscate (Figure-8)', 'Orbital Vortex', 'Hypnotic Spiral', 'Mouse Follow', 'Hybrid'
      animationSpeed: 1.0,
      freqX: 1.0,
      freqY: 0.8,
      phaseX: 0.0,
      phaseY: 1.57,
      amplitudeX: 0.055, // original 0.45..0.55 mapping = +/- 0.05
      amplitudeY: 0.055,
      orbitalBreathing: 0.35,
      mouseInfluence: 0.3,

      // Layer Ripple & Moiré Waves
      layerLag: 0.25, // cascading delay between layers
      layerRotation: 0.0, // aperture twist angle in degrees
      breathingAmp: 0.0, // hole scale breathing oscillation
      breathingFreq: 1.5,

      // Tactile Texture & Viewport
      paperGrain: 0.12, // subtle authentic risograph tactile grain
      viewMode: 'Full Viewport', // 'Full Viewport', '4:5 Art Print', '1:1 Square'
      isPaused: false,
      targetFPS: 60,

      // Procedural Randomization Settings (Requirement 6)
      clickToRandomize: true,
      spacebarRandomize: true
    };

    // Runtime Global State
    let t = 0.0;
    let seedNum = 12345;
    let activePens = [];
    let grainBuffer = null;
    let gui = null;
    let fpsValEl = null;
    let toastEl = null;
    let toastMsgEl = null;
    let toastTimeout = null;

    function choose(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    // =========================================================================
    // THEME & COLOR SETUP
    // =========================================================================
    function setPaletteByName(name, applyBg = true) {
      if (COLOR_SCHEMES[name]) {
        params.paletteScheme = name;
        const scheme = COLOR_SCHEMES[name];
        activePens = [...scheme.pens];
        if (applyBg && params.autoMatchThemeBg) {
          params.bgColor = scheme.bg;
          params.blendMode = scheme.blend;
        }
      } else {
        params.paletteScheme = SCHEME_KEYS[0];
        activePens = [...COLOR_SCHEMES[SCHEME_KEYS[0]].pens];
      }
    }

    // =========================================================================
    // PROCEDURAL RANDOMIZATION ENGINE (Requirement 6)
    // =========================================================================
    function randomizeScene(showToast = true) {
      seedNum = Math.floor(Math.random() * 10000000);

      // 1. Pick a new random color scheme
      const newScheme = choose(SCHEME_KEYS);
      setPaletteByName(newScheme, true);

      // 2. Re-roll geometric parameters
      params.minNumSide = Math.floor(random(3, 7));
      params.spacingFactor = parseFloat(random(0.88, 1.02).toFixed(2));
      params.sizeStepFactor = parseFloat(random(0.035, 0.075).toFixed(3));
      params.holeScale = parseFloat(random(0.85, 1.15).toFixed(2));
      params.shapeType = choose(['Circle', 'Circle', 'Circle', 'Circle', 'Square', 'Rounded Rect', 'Diamond', 'Hexagon']);

      // 3. Re-roll motion & animation dynamics
      params.motionMode = choose([
        'Lissajous',
        'Perlin Flow',
        'Lemniscate (Figure-8)',
        'Orbital Vortex',
        'Hypnotic Spiral'
      ]);
      params.animationSpeed = parseFloat(random(0.7, 1.5).toFixed(2));
      params.freqX = parseFloat(random(0.6, 1.8).toFixed(2));
      params.freqY = parseFloat(random(0.5, 1.6).toFixed(2));
      params.phaseX = parseFloat(random(0, Math.PI * 2).toFixed(2));
      params.phaseY = parseFloat(random(0, Math.PI * 2).toFixed(2));
      params.amplitudeX = parseFloat(random(0.04, 0.09).toFixed(3));
      params.amplitudeY = parseFloat(random(0.04, 0.09).toFixed(3));

      // 4. Subtle layer effects
      params.layerLag = choose([0.0, 0.15, 0.28, 0.45]);
      params.layerRotation = choose([0.0, 0.0, 4.0, 8.0, 15.0]);
      params.breathingAmp = choose([0.0, 0.0, 0.06, 0.12]);

      // 5. Update lil-gui controls
      if (gui) {
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      }

      if (showToast) {
        displayToast(`🎲 Theme: ${newScheme}`);
      }
    }

    function displayToast(msg) {
      if (!toastEl || !toastMsgEl) return;
      toastMsgEl.textContent = msg;
      toastEl.classList.add('toast-visible');
      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toastEl.classList.remove('toast-visible');
      }, 2400);
    }

    // =========================================================================
    // p5.js CORE LIFECYCLE
    // =========================================================================
    window.setup = function() {
      const container = document.getElementById('canvas-container');
      const cnv = createCanvas(windowWidth, windowHeight);
      cnv.parent(container);

      pixelDensity(window.devicePixelRatio ? Math.min(window.devicePixelRatio, 2) : 1);
      noStroke();
      rectMode(CORNER);
      ellipseMode(CENTER);
      frameRate(params.targetFPS);

      setPaletteByName(params.paletteScheme, true);
      generateGrainBuffer();

      setupLilGUI();
      setupDomEvents();
    };

    window.windowResized = function() {
      updateCanvasDimensions();
      generateGrainBuffer();
      redraw();
    };

    function updateCanvasDimensions() {
      if (params.viewMode === '4:5 Art Print') {
        document.body.classList.add('framed-mode');
        let maxH = windowHeight * 0.88;
        let maxW = windowWidth * 0.88;
        let h = maxH;
        let w = h * 0.8;
        if (w > maxW) {
          w = maxW;
          h = w / 0.8;
        }
        resizeCanvas(Math.round(w), Math.round(h));
      } else if (params.viewMode === '1:1 Square') {
        document.body.classList.add('framed-mode');
        let side = Math.min(windowWidth, windowHeight) * 0.85;
        resizeCanvas(Math.round(side), Math.round(side));
      } else {
        document.body.classList.remove('framed-mode');
        resizeCanvas(windowWidth, windowHeight);
      }
    }

    // =========================================================================
    // MAIN DRAW LOOP
    // =========================================================================
    window.draw = function() {
      // 1. Advance animation clock
      if (!params.isPaused && params.autoAnimate) {
        t += params.animationSpeed * 0.025;
      }

      // 2. Base canvas setup
      blendMode(BLEND);
      background(params.bgColor);

      // 3. Optional base tactile paper grain
      if (params.paperGrain > 0 && grainBuffer) {
        push();
        blendMode(MULTIPLY);
        tint(255, params.paperGrain * 180);
        image(grainBuffer, 0, 0, width, height);
        pop();
      }

      // 4. Set blending mode for overlapping pen layers
      const p5Blend = getP5BlendMode(params.blendMode);
      blendMode(p5Blend);

      push();

      // Compute primary focal center
      const mainCenter = computeCenterPosition(t);
      let cx = mainCenter.x;
      let cy = mainCenter.y;

      // Original geometric dimension math
      let szeS = min(width, height) / (2 * params.minNumSide);
      let nx = Math.floor(width / szeS / 2) + params.extraMargin;
      let ny = Math.floor(height / szeS / 2) + params.extraMargin;
      szeS *= params.spacingFactor;

      let szeD = szeS * params.sizeStepFactor;
      let sze = szeS - szeD * activePens.length;

      // Multi-layer aperture stack
      for (let p = 0; p < activePens.length; p++) {
        fill(0);
        sze += szeD;

        // Breathing modulation on hole radius
        let breathing = 1.0;
        if (params.breathingAmp > 0) {
          breathing += params.breathingAmp * Math.sin(t * params.breathingFreq + p * 0.45);
        }
        let szeO = sze * params.holeScale * breathing;

        push();
        let ff = p / activePens.length;

        // Layer Lag: dynamic phase delay creates a fluid ripple / accordion depth
        let layerCx = cx;
        let layerCy = cy;
        if (params.layerLag > 0) {
          const lagCenter = computeCenterPosition(t - ff * params.layerLag);
          layerCx = lagCenter.x;
          layerCy = lagCenter.y;
        }

        let tx = lerp(layerCx, width / 2, ff);
        let ty = lerp(layerCy, height / 2, ff);
        translate(tx, ty);

        // Optional iris rotation twist
        if (params.layerRotation !== 0) {
          let rotAngle = (ff - 0.5) * params.layerRotation * Math.sin(t * 0.7);
          rotate(radians(rotAngle));
        }

        // Clip out aperture openings using p5.js inverted clip
        beginClip({ invert: true });
        drawApertureGrid(nx, ny, sze, szeO, params.shapeType);
        endClip();

        // Render colored slab covering the aperture field
        let penCol = color(activePens[p]);
        penCol.setAlpha(params.layerOpacity * 255);
        fill(penCol);

        let rectW = 2 * nx * sze - sze + (params.extraMargin * sze * 2);
        let rectH = 2 * ny * sze - sze + (params.extraMargin * sze * 2);
        let startX = -sze / 2 - (nx - 1) * sze - (params.extraMargin * sze);
        let startY = -(sze / 2 + (ny - 1) * sze) - (params.extraMargin * sze);
        rect(startX, startY, rectW, rectH);

        pop();
      }

      pop();

      // Reset blend mode to BLEND for interface/overlays
      blendMode(BLEND);

      // Update FPS counter
      if (fpsValEl && frameCount % 12 === 0) {
        fpsValEl.textContent = `${Math.round(frameRate())} FPS`;
      }
    };

    // =========================================================================
    // APERTURE GRID & GEOMETRIC SHAPES
    // =========================================================================
    function drawApertureGrid(nx, ny, sze, szeO, shapeType) {
      for (let j = 0; j < ny; j++) {
        for (let i = 0; i < nx; i++) {
          const x = sze / 2 + i * sze;
          const y = sze / 2 + j * sze;

          // Four-quadrant mirrored symmetry preserved from original snippet
          drawSingleAperture(x, y, szeO, shapeType);
          drawSingleAperture(-x, y, szeO, shapeType);
          drawSingleAperture(x, -y, szeO, shapeType);
          drawSingleAperture(-x, -y, szeO, shapeType);
        }
      }
    }

    function drawSingleAperture(x, y, d, shapeType) {
      if (shapeType === 'Circle') {
        circle(x, y, d);
      } else if (shapeType === 'Square') {
        rect(x - d * 0.5, y - d * 0.5, d, d);
      } else if (shapeType === 'Rounded Rect') {
        rect(x - d * 0.5, y - d * 0.5, d, d, d * 0.28);
      } else if (shapeType === 'Diamond') {
        push();
        translate(x, y);
        rotate(QUARTER_PI);
        rect(-d * 0.38, -d * 0.38, d * 0.76, d * 0.76);
        pop();
      } else if (shapeType === 'Hexagon') {
        drawRegularPolygon(x, y, d * 0.52, 6);
      } else if (shapeType === 'Octagon') {
        drawRegularPolygon(x, y, d * 0.52, 8);
      }
    }

    function drawRegularPolygon(cx, cy, radius, npoints) {
      let angle = TWO_PI / npoints;
      beginShape();
      for (let a = 0; a < TWO_PI; a += angle) {
        let sx = cx + Math.cos(a) * radius;
        let sy = cy + Math.sin(a) * radius;
        vertex(sx, sy);
      }
      endShape(CLOSE);
    }

    // =========================================================================
    // AUTOMATIC MOTION ENGINE ("make animations automatic, not with cursor")
    // =========================================================================
    function computeCenterPosition(currentTime) {
      let ox = 0;
      let oy = 0;

      switch (params.motionMode) {
        case 'Lissajous': {
          // Multi-frequency harmonic resonance
          const a = currentTime * params.freqX + params.phaseX;
          const b = currentTime * params.freqY + params.phaseY;
          ox = Math.sin(a) * Math.cos(a * 0.37);
          oy = Math.cos(b) * Math.sin(b * 0.43);
          break;
        }
        case 'Perlin Flow': {
          // Smooth organic wandering
          const nx = noise(currentTime * params.freqX * 0.55, 23.45);
          const ny = noise(67.89, currentTime * params.freqY * 0.55);
          ox = (nx - 0.5) * 2.2;
          oy = (ny - 0.5) * 2.2;
          break;
        }
        case 'Lemniscate (Figure-8)': {
          // Infinity loop path
          const s = Math.sin(currentTime * params.freqX);
          const c = Math.cos(currentTime * params.freqX);
          const denom = 1 + s * s;
          ox = (c / denom) * 1.35;
          oy = ((s * c) / denom) * 1.8;
          break;
        }
        case 'Orbital Vortex': {
          // Orbiting ellipse with radial breathing
          const rad = 1.0 + params.orbitalBreathing * Math.sin(currentTime * 1.7);
          ox = Math.cos(currentTime * params.freqX) * rad;
          oy = Math.sin(currentTime * params.freqY) * rad;
          break;
        }
        case 'Hypnotic Spiral': {
          // Undulating inward-outward spiral
          const rad = 0.5 + 0.6 * Math.sin(currentTime * 0.85);
          ox = Math.cos(currentTime * params.freqX * 1.3) * rad;
          oy = Math.sin(currentTime * params.freqY * 1.3) * rad;
          break;
        }
        case 'Mouse Follow': {
          // Classic interactive cursor mapping
          if (mouseX > 0 && mouseX < width && mouseY > 0 && mouseY < height) {
            ox = map(mouseX, 0, width, -1, 1);
            oy = map(mouseY, 0, height, -1, 1);
          }
          break;
        }
        case 'Hybrid':
        default: {
          // Automatic Lissajous with gentle mouse guidance
          const a = currentTime * params.freqX + params.phaseX;
          const b = currentTime * params.freqY + params.phaseY;
          let autoX = Math.sin(a) * Math.cos(a * 0.37);
          let autoY = Math.cos(b) * Math.sin(b * 0.43);
          if (mouseX > 0 && mouseX < width && mouseY > 0 && mouseY < height) {
            let mX = map(mouseX, 0, width, -1, 1);
            let mY = map(mouseY, 0, height, -1, 1);
            ox = lerp(autoX, mX, params.mouseInfluence);
            oy = lerp(autoY, mY, params.mouseInfluence);
          } else {
            ox = autoX;
            oy = autoY;
          }
          break;
        }
      }

      let targetX = width * 0.5 + ox * params.amplitudeX * width;
      let targetY = height * 0.5 + oy * params.amplitudeY * height;

      return { x: targetX, y: targetY };
    }

    // =========================================================================
    // BLEND MODE TRANSLATION
    // =========================================================================
    function getP5BlendMode(name) {
      switch (name) {
        case 'MULTIPLY': return MULTIPLY;
        case 'SCREEN': return SCREEN;
        case 'DIFFERENCE': return DIFFERENCE;
        case 'ADD': return ADD;
        case 'DARKEST': return DARKEST;
        case 'LIGHTEST': return LIGHTEST;
        case 'OVERLAY': return OVERLAY;
        case 'EXCLUSION': return EXCLUSION;
        case 'BLEND':
        default: return BLEND;
      }
    }

    // =========================================================================
    // GRAIN TEXTURE GENERATOR
    // =========================================================================
    function generateGrainBuffer() {
      const gW = Math.min(width, 1024);
      const gH = Math.min(height, 1024);
      grainBuffer = createGraphics(gW, gH);
      grainBuffer.pixelDensity(1);
      grainBuffer.loadPixels();
      const d = grainBuffer.pixels;
      const numPix = gW * gH * 4;
      for (let i = 0; i < numPix; i += 4) {
        const val = 128 + Math.floor((Math.random() - 0.5) * 80);
        d[i] = val;
        d[i + 1] = val;
        d[i + 2] = val;
        d[i + 3] = 255;
      }
      grainBuffer.updatePixels();
    }

    // =========================================================================
    // LIL-GUI SETUP
    // =========================================================================
    function setupLilGUI() {
      if (typeof lil === 'undefined' || !lil.GUI) return;

      gui = new lil.GUI({ title: 'Aperture Moiré Controls' });

      // Folder 1: Color Themes & Blending
      const fColor = gui.addFolder('🎨 Theme & Palette');
      fColor.add(params, 'paletteScheme', SCHEME_KEYS).name('Color Scheme').onChange((val) => {
        setPaletteByName(val, params.autoMatchThemeBg);
        displayToast(`Theme: ${val}`);
        if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
      });
      fColor.addColor(params, 'bgColor').name('Background Color');
      fColor.add(params, 'blendMode', [
        'MULTIPLY',
        'SCREEN',
        'DIFFERENCE',
        'BLEND',
        'ADD',
        'OVERLAY',
        'EXCLUSION',
        'DARKEST',
        'LIGHTEST'
      ]).name('Blend Mode');
      fColor.add(params, 'autoMatchThemeBg').name('Auto Theme Settings');
      fColor.add(params, 'layerOpacity', 0.2, 1.0, 0.05).name('Layer Opacity');
      fColor.add(params, 'paperGrain', 0.0, 0.35, 0.01).name('Paper Tactile Grain');

      // Folder 2: Automatic Animation Dynamics
      const fAnim = gui.addFolder('🌀 Auto Animation');
      fAnim.add(params, 'autoAnimate').name('Enable Motion');
      fAnim.add(params, 'motionMode', [
        'Lissajous',
        'Perlin Flow',
        'Lemniscate (Figure-8)',
        'Orbital Vortex',
        'Hypnotic Spiral',
        'Mouse Follow',
        'Hybrid'
      ]).name('Motion Style');
      fAnim.add(params, 'animationSpeed', 0.1, 3.0, 0.05).name('Speed');
      fAnim.add(params, 'amplitudeX', 0.01, 0.20, 0.005).name('Amplitude X');
      fAnim.add(params, 'amplitudeY', 0.01, 0.20, 0.005).name('Amplitude Y');
      fAnim.add(params, 'freqX', 0.2, 3.0, 0.1).name('Freq X');
      fAnim.add(params, 'freqY', 0.2, 3.0, 0.1).name('Freq Y');
      fAnim.add(params, 'layerLag', 0.0, 1.2, 0.02).name('Layer Ripple Delay');
      fAnim.add(params, 'layerRotation', 0.0, 45.0, 0.5).name('Aperture Twist');
      fAnim.add(params, 'breathingAmp', 0.0, 0.35, 0.01).name('Breathing Pulse');
      fAnim.add(params, 'mouseInfluence', 0.0, 1.0, 0.05).name('Hybrid Mouse Bias');

      // Folder 3: Geometry & Aperture Grid
      const fGrid = gui.addFolder('📐 Grid & Geometry');
      fGrid.add(params, 'minNumSide', 2, 12, 1).name('Grid Density (Sides)');
      fGrid.add(params, 'shapeType', [
        'Circle',
        'Square',
        'Rounded Rect',
        'Diamond',
        'Hexagon',
        'Octagon'
      ]).name('Aperture Cutout');
      fGrid.add(params, 'spacingFactor', 0.7, 1.3, 0.01).name('Cell Spacing');
      fGrid.add(params, 'sizeStepFactor', 0.01, 0.15, 0.005).name('Layer Size Step');
      fGrid.add(params, 'holeScale', 0.4, 1.8, 0.02).name('Hole Diameter Scale');
      fGrid.add(params, 'extraMargin', 0, 5, 1).name('Bleed Margin');

      // Folder 4: Presentation & Viewport
      const fView = gui.addFolder('🖼️ Canvas & Presentation');
      fView.add(params, 'viewMode', ['Full Viewport', '4:5 Art Print', '1:1 Square']).name('Aspect Framing').onChange(() => {
        updateCanvasDimensions();
      });
      fView.add(params, 'isPaused').name('Pause Animation');

      // Folder 5: Procedural Randomization & Actions (Requirement 6)
      const fActions = gui.addFolder('🎲 Procedural Controls');
      fActions.add(params, 'clickToRandomize').name('Click Scene to Randomize');
      fActions.add(params, 'spacebarRandomize').name('Spacebar Randomize');
      fActions.add({ randomize: () => randomizeScene(true) }, 'randomize').name('🎲 Randomize Scene');
      fActions.add({ reset: () => resetToDefaults() }, 'reset').name('↺ Reset to Original');
      fActions.add({ save: () => saveArtwork() }, 'save').name('📸 Save PNG (S)');

      fColor.close();
      fAnim.open();
      fGrid.close();
      fView.close();
      fActions.open();
    }

    function resetToDefaults() {
      setPaletteByName('Solaris Amber & Cyan (Original)', true);
      params.minNumSide = 4;
      params.spacingFactor = 0.95;
      params.sizeStepFactor = 0.05;
      params.holeScale = 1.0;
      params.shapeType = 'Circle';
      params.motionMode = 'Lissajous';
      params.animationSpeed = 1.0;
      params.amplitudeX = 0.055;
      params.amplitudeY = 0.055;
      params.layerLag = 0.25;
      params.layerRotation = 0.0;
      params.breathingAmp = 0.0;
      params.viewMode = 'Full Viewport';
      updateCanvasDimensions();
      if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
      displayToast('↺ Reset to Original Defaults');
    }

    // =========================================================================
    // DOM & KEYBOARD EVENTS
    // =========================================================================
    function setupDomEvents() {
      fpsValEl = document.getElementById('fps-val');
      toastEl = document.getElementById('toast');
      toastMsgEl = document.getElementById('toast-message');

      // Canvas click triggers instant procedural variation
      window.addEventListener('pointerdown', (e) => {
        // Ignore clicks on lil-gui, HUD, or interactive links
        if (e.target.closest('.lil-gui') || e.target.closest('#hud') || e.target.closest('a')) {
          return;
        }
        if (params.clickToRandomize) {
          randomizeScene(true);
        }
      });

      // Keyboard navigation
      window.addEventListener('keydown', (e) => {
        // Spacebar: randomize
        if (e.code === 'Space' && params.spacebarRandomize) {
          e.preventDefault();
          randomizeScene(true);
        }
        // H: Toggle UI visibility
        if (e.key === 'h' || e.key === 'H') {
          document.body.classList.toggle('hidden-ui');
        }
        // P: Pause / Resume
        if (e.key === 'p' || e.key === 'P') {
          params.isPaused = !params.isPaused;
          if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
          displayToast(params.isPaused ? '⏸️ Paused' : '▶️ Resumed');
        }
        // S: Save screenshot
        if (e.key === 's' || e.key === 'S') {
          saveArtwork();
        }
        // F: Toggle Fullscreen
        if (e.key === 'f' || e.key === 'F') {
          toggleFullScreen();
        }
      });
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        }
      }
    }

    function saveArtwork() {
      displayToast('💾 Saving High-Res Artwork...');
      const dateStr = new Date().toISOString().slice(0, 10);
      const timeStr = Date.now().toString().slice(-4);
      saveCanvas(`kinetic-halftone-aperture-${dateStr}-${timeStr}`, 'png');
    }
  </script>
