<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hypnotic Tube Matrix - 487</title>
  <style>
    body {
      background: #000;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
      user-select: none;
      -webkit-user-select: none;
    }

    #loading {
      background: black;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      visibility: visible;
      opacity: 1;
      transition: visibility 1.6s, opacity 1.6s;
      pointer-events: auto;
    }

    #loading .circle {
      width: 50px;
      height: 50px;
      background: white;
      border-radius: 50%;
      opacity: 0;
      transform: scale(0, 0);
      animation: circle-animation 1.6s ease-in-out 0s infinite normal none;
    }

    #loading.loaded {
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }

    #container {
      width: 100%;
      height: 100vh;
      position: relative;
    }

    #container canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 0;
      outline: none;
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }

    #container canvas:active {
      cursor: grabbing;
    }

    /** css animation */
    @keyframes circle-animation {
      0% {
        opacity: 0;
        transform: scale(0, 0);
      }
      50% {
        opacity: 1;
        transform: scale(1, 1);
      }
      100% {
        opacity: 0;
        transform: scale(0, 0);
      }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="circle"></div>
  </div>
  <div id="container"></div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.121.1/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.121.1/examples/jsm/controls/OrbitControls.js';
    import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

    // 19 Preconfigured Color Schemes
    const colorSchemes = {

        colors: ['#63D1CF', '#5BC0BE', '#4BAD9E', '#4BAD9E', '#0B132B'],

      },
      'Palette 3 (AA60C8, D69ADE, C9A3C6, CFB5C2, 0D001D, 120A12)': {

      },

      'Palette 6 (FFE8CC, FF8C00, C7501A, 3D1050, 0E0618)': {

      },
      'Palette 7 (E8E0FF, B38FFF, 6A3DE8, 1A1250, 090612)': {
        colors: ['#E8E0FF', '#B38FFF', '#6A3DE8', '#1A1250', '#c4b5fd'],
        bg: '#090612',
        blend: 'Additive',
        mode: 0
      },
      'Palette 8 (E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)': {
        colors: ['#E0FBFF', '#00F0FF', '#D40078', '#1E0A3D', '#ff70a6'],
        bg: '#05020F',
        blend: 'Additive',
        mode: 0
      }
    };

    /** vertex shader source */
    const vertexShaderSource = `
      uniform float uTime;
      varying vec2 vUv;
      varying vec3 vPosition;

      void main() {
        vUv = uv;
        vPosition = position;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `;

    /** fragment shader source */
    const fragmentShaderSource = `
      uniform float uTime;
      uniform float uDashFrequency;
      uniform float uDashSpeed;
      uniform float uDashThreshold;
      uniform int uColorMode;
      uniform vec3 uColor1;
      uniform vec3 uColor2;
      uniform vec3 uColor3;
      uniform vec3 uColor4;
      uniform vec3 uColor5;
      uniform int uColorCount;
      uniform float uColorCycleSpeed;
      uniform float uColorFrequency;
      uniform float uColorOffset;
      uniform float uGlow;

      varying vec2 vUv;
      varying vec3 vPosition;

      /**
       * Inigo Quilez cosine palette formula
       * https://iquilezles.org/www/articles/palettes/palettes.htm
       */
      vec3 pal(in float t, in vec3 a, in vec3 b, in vec3 c, in vec3 d) {
        return a + b * cos(6.28318530718 * (c * t + d));
      }

      /**
       * Pseudo-random hash
       */
      float random(vec2 st) {
        return fract(sin(dot(st.xy, vec2(12.9898, 78.233))) * 43758.5453123);
      }

      vec3 getRampColor(float t) {
        float p = fract(t);
        if (uColorCount <= 1) {
          return uColor1;
        } else if (uColorCount == 2) {
          float f = p * 2.0;
          if (f < 1.0) return mix(uColor1, uColor2, smoothstep(0.0, 1.0, f));
          return mix(uColor2, uColor1, smoothstep(0.0, 1.0, f - 1.0));
        } else if (uColorCount == 3) {
          float f = p * 3.0;
          if (f < 1.0) return mix(uColor1, uColor2, smoothstep(0.0, 1.0, f));
          if (f < 2.0) return mix(uColor2, uColor3, smoothstep(0.0, 1.0, f - 1.0));
          return mix(uColor3, uColor1, smoothstep(0.0, 1.0, f - 2.0));
        } else if (uColorCount == 4) {
          float f = p * 4.0;
          if (f < 1.0) return mix(uColor1, uColor2, smoothstep(0.0, 1.0, f));
          if (f < 2.0) return mix(uColor2, uColor3, smoothstep(0.0, 1.0, f - 1.0));
          if (f < 3.0) return mix(uColor3, uColor4, smoothstep(0.0, 1.0, f - 2.0));
          return mix(uColor4, uColor1, smoothstep(0.0, 1.0, f - 3.0));
        } else {
          float f = p * 5.0;
          if (f < 1.0) return mix(uColor1, uColor2, smoothstep(0.0, 1.0, f));
          if (f < 2.0) return mix(uColor2, uColor3, smoothstep(0.0, 1.0, f - 1.0));
          if (f < 3.0) return mix(uColor3, uColor4, smoothstep(0.0, 1.0, f - 2.0));
          if (f < 4.0) return mix(uColor4, uColor5, smoothstep(0.0, 1.0, f - 3.0));
          return mix(uColor5, uColor1, smoothstep(0.0, 1.0, f - 4.0));
        }
      }

      void main() {
        float dash = sin(vUv.x * uDashFrequency - uTime * uDashSpeed);
        if (dash + uDashThreshold < random(vPosition.xz)) discard;

        float dist = distance(vPosition, vec3(0.0, 0.0, 0.0));
        float t = dist * uColorFrequency - uTime * uColorCycleSpeed + uColorOffset;

        vec3 col;
        if (uColorMode == 1) {
          col = pal(
            t,
            vec3(0.5, 0.5, 0.5),
            vec3(0.5, 0.5, 0.5),
            vec3(1.0, 1.0, 1.0),
            vec3(0.0, 0.10, 0.20)
          );
        } else {
          col = getRampColor(t);
        }

        col *= uGlow;
        gl_FragColor = vec4(col, 1.0);
      }
    `;

    /**
     * class Sketch
     */
    class Sketch {
      constructor() {
        this.renderer = new THREE.WebGLRenderer({
          antialias: true,
          alpha: true
        });
        document.getElementById('container').appendChild(this.renderer.domElement);

        this.statsInit();
        this.initParams();
        this.init();
      }

      statsInit() {
        this.stats = {
          begin() {},
          end() {}
        };
      }

      initParams() {
        this.params = {
          // Color schemes & background
          colorScheme: 'Original',
          greenscreen: false,
          backgroundColor: '#082852',
          color1: '#00f0ff',
          color2: '#ff00aa',
          color3: '#ffd700',
          color4: '#00ff88',
          color5: '#aa00ff',
          activeColors: 5,
          invertAchromatic: false,
          blendMode: 'Additive',
          glow: 1.0,

          // Geometry parameters
          tubeCount: 200,
          tubeRadius: 0.005,
          curveScale: 1.0,
          twistFactor: 1.0,
          zSpread: 0.1,

          // Motion & Shader parameters
          timeSpeed: 1.0,
          dashFrequency: 50.0,
          dashSpeed: 5.0,
          dashThreshold: 0.0,
          colorCycleSpeed: 0.5,
          colorFrequency: 1.0,
          rotationSpeed: 0.2,

          // Camera & Navigation
          dragMode: 'Orbit (Rotate)',
          zoomLevel: 3.0,

          // Interactivity
          clickToRandomize: true
        };
      }

      init() {
        this.time = new THREE.Clock(true);
        this.simulatedTime = 0;
        this.mouse = new THREE.Vector2();

        this.width = window.innerWidth;
        this.height = window.innerHeight;

        this.scene = new THREE.Scene();

        this.setupCanvas();
        this.setupCamera();
        this.setupLight();
        this.setupShape();
        this.setupGui();
        this.setupEvents();

        this.applyColorScheme(this.params.colorScheme);
        this.render();
      }

      setupCanvas() {
        this.renderer.setSize(this.width, this.height);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        this.renderer.setClearColor(new THREE.Color(this.params.backgroundColor), 1.0);

        this.renderer.domElement.style.position = 'fixed';
        this.renderer.domElement.style.top = '0';
        this.renderer.domElement.style.left = '0';
        this.renderer.domElement.style.zIndex = '0';
        this.renderer.domElement.style.outline = 'none';
      }

      setupCamera() {
        const fov = 70;
        this.camera = new THREE.PerspectiveCamera(
          fov,
          this.width / this.height,
          0.001,
          1000
        );
        this.camera.position.set(0, 0, 3);
        this.camera.lookAt(new THREE.Vector3(0, 0, 0));
        this.scene.add(this.camera);

        this.controls = new OrbitControls(this.camera, this.renderer.domElement);
        this.controls.enableDamping = true;
        this.controls.dampingFactor = 0.05;
        this.controls.screenSpacePanning = true;
        this.controls.enablePan = true;
        this.controls.enableZoom = true;
        this.controls.enableRotate = true;
        this.controls.panSpeed = 1.2;
        this.controls.rotateSpeed = 0.8;
        this.controls.zoomSpeed = 1.0;

        this.updateDragMode();
      }

      updateDragMode() {
        if (!this.controls) return;
        if (this.params.dragMode === 'Pan (Move)') {
          this.controls.mouseButtons = {
            LEFT: THREE.MOUSE.PAN,
            MIDDLE: THREE.MOUSE.DOLLY,
            RIGHT: THREE.MOUSE.ROTATE
          };
        } else {
          this.controls.mouseButtons = {
            LEFT: THREE.MOUSE.ROTATE,
            MIDDLE: THREE.MOUSE.DOLLY,
            RIGHT: THREE.MOUSE.PAN
          };
        }
      }

      setupLight() {
        this.directionalLight = new THREE.DirectionalLight(0xffffff, 1.0);
        this.directionalLight.position.set(5, 10, 7);
        this.scene.add(this.directionalLight);

        this.ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        this.scene.add(this.ambientLight);
      }

      setupShape() {
        this.shapes = [];
        this.shape = new Shape(this);
        this.shapes.push(this.shape);
      }

      updateBackground() {
        const bg = this.params.greenscreen ? '#00ff00' : this.params.backgroundColor;
        this.renderer.setClearColor(new THREE.Color(bg), 1.0);
        document.body.style.backgroundColor = bg;
        const container = document.getElementById('container');
        if (container) container.style.backgroundColor = bg;

        if (this.params.greenscreen) {
          if (this.shape && this.shape.material) {
            this.shape.material.blending = THREE.NormalBlending;
            this.shape.material.needsUpdate = true;
          }
        } else {
          this.updateBlendMode(this.params.blendMode);
        }
      }

      updateBlendMode(mode) {
        if (!this.shape || !this.shape.material) return;
        if (this.params.greenscreen) {
          this.shape.material.blending = THREE.NormalBlending;
        } else if (mode === 'Additive') {
          this.shape.material.blending = THREE.AdditiveBlending;
        } else if (mode === 'Normal') {
          this.shape.material.blending = THREE.NormalBlending;
        } else if (mode === 'Subtractive') {
          this.shape.material.blending = THREE.SubtractiveBlending;
        }
        this.shape.material.needsUpdate = true;
      }

      applyColorScheme(name) {
        const scheme = colorSchemes[name];
        if (!scheme) return;
        this.params.colorScheme = name;

        const isAchromatic = name.startsWith('Achromatic');
        const useInvert = isAchromatic && this.params.invertAchromatic;

        const activeColors = useInvert && scheme.invertColors ? scheme.invertColors : scheme.colors;
        const bg = useInvert && scheme.invertBg ? scheme.invertBg : scheme.bg;

        this.params.backgroundColor = bg;
        if (activeColors[0]) this.params.color1 = activeColors[0];
        if (activeColors[1]) this.params.color2 = activeColors[1];
        if (activeColors[2]) this.params.color3 = activeColors[2];
        if (activeColors[3]) this.params.color4 = activeColors[3];
        if (activeColors[4]) this.params.color5 = activeColors[4];
        this.params.activeColors = activeColors.length;

        if (useInvert) {
          this.params.blendMode = 'Normal';
        } else {
          this.params.blendMode = scheme.blend || 'Additive';
        }

        if (this.shape && this.shape.material) {
          this.shape.material.uniforms.uColorMode.value = (name === 'Original') ? 1 : 0;
        }

        this.updateColors();
        this.updateBackground();
        this.updateAllControllers(this.gui);
      }

      updateColors() {
        if (!this.shape || !this.shape.material) return;
        const u = this.shape.material.uniforms;
        u.uColor1.value.set(this.params.color1);
        u.uColor2.value.set(this.params.color2);
        u.uColor3.value.set(this.params.color3);
        u.uColor4.value.set(this.params.color4);
        u.uColor5.value.set(this.params.color5);
        u.uColorCount.value = this.params.activeColors;
        u.uGlow.value = this.params.glow;
      }

      updateAllControllers(folder) {
        if (!folder) return;
        if (folder.controllers) {
          folder.controllers.forEach(controller => controller.updateDisplay());
        }
        if (folder.folders) {
          folder.folders.forEach(subFolder => this.updateAllControllers(subFolder));
        }
      }

      randomizeScene() {
        const schemeKeys = Object.keys(colorSchemes);
        const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];

        this.params.greenscreen = false;
        if (randomScheme.startsWith('Achromatic')) {
          this.params.invertAchromatic = Math.random() < 0.5;
        }

        // Geometry re-roll
        this.params.tubeCount = Math.floor(120 + Math.random() * 140);
        this.params.tubeRadius = +(0.003 + Math.random() * 0.009).toFixed(4);
        this.params.curveScale = +(0.6 + Math.random() * 1.0).toFixed(2);
        this.params.twistFactor = +(0.6 + Math.random() * 1.5).toFixed(2);
        this.params.zSpread = +(0.04 + Math.random() * 0.12).toFixed(3);

        // Motion re-roll
        const dir = Math.random() < 0.25 ? -1 : 1;
        this.params.timeSpeed = +(dir * (0.6 + Math.random() * 1.8)).toFixed(2);
        this.params.dashFrequency = Math.floor(25 + Math.random() * 65);
        this.params.dashSpeed = +(2.5 + Math.random() * 8.0).toFixed(1);
        this.params.dashThreshold = +(-0.35 + Math.random() * 0.7).toFixed(2);
        this.params.colorCycleSpeed = +(0.3 + Math.random() * 1.2).toFixed(2);
        this.params.colorFrequency = +(0.5 + Math.random() * 1.8).toFixed(2);
        this.params.rotationSpeed = +((-0.3 + Math.random() * 0.6)).toFixed(2);

        this.applyColorScheme(randomScheme);
        if (this.shape) this.shape.build();
        this.updateAllControllers(this.gui);
      }

      setupGui() {
        this.gui = new GUI({ title: 'Scene Controls' });

        // 1. Color Schemes & Background
        const fTheme = this.gui.addFolder('Color Schemes & Background');
        fTheme.add(this.params, 'colorScheme', Object.keys(colorSchemes)).name('Scheme').onChange((v) => this.applyColorScheme(v));
        fTheme.add(this.params, 'greenscreen').name('Greenscreen (#00ff00)').onChange(() => this.updateBackground());
        fTheme.addColor(this.params, 'backgroundColor').name('Background Color').onChange(() => this.updateBackground());
        fTheme.add(this.params, 'invertAchromatic').name('Invert (White & Black)').onChange(() => this.applyColorScheme(this.params.colorScheme));
        fTheme.addColor(this.params, 'color1').name('Color 1').onChange(() => {
          if (this.shape && this.shape.material) this.shape.material.uniforms.uColorMode.value = 0;
          this.updateColors();
        });
        fTheme.addColor(this.params, 'color2').name('Color 2').onChange(() => {
          if (this.shape && this.shape.material) this.shape.material.uniforms.uColorMode.value = 0;
          this.updateColors();
        });
        fTheme.addColor(this.params, 'color3').name('Color 3').onChange(() => {
          if (this.shape && this.shape.material) this.shape.material.uniforms.uColorMode.value = 0;
          this.updateColors();
        });
        fTheme.addColor(this.params, 'color4').name('Color 4').onChange(() => {
          if (this.shape && this.shape.material) this.shape.material.uniforms.uColorMode.value = 0;
          this.updateColors();
        });
        fTheme.addColor(this.params, 'color5').name('Color 5').onChange(() => {
          if (this.shape && this.shape.material) this.shape.material.uniforms.uColorMode.value = 0;
          this.updateColors();
        });
        fTheme.add(this.params, 'activeColors', 1, 5, 1).name('Active Colors').onChange(() => this.updateColors());
        fTheme.add(this.params, 'blendMode', ['Additive', 'Normal', 'Subtractive']).name('Blend Mode').onChange((v) => this.updateBlendMode(v));
        fTheme.add(this.params, 'glow', 0.2, 3.0, 0.05).name('Glow / Brightness').onChange(() => this.updateColors());

        // 2. Geometry & Structure
        const fGeometry = this.gui.addFolder('Geometry & Structure');
        fGeometry.add(this.params, 'tubeCount', 50, 320, 10).name('Tube Count').onChange(() => this.shape.build());
        fGeometry.add(this.params, 'tubeRadius', 0.001, 0.02, 0.001).name('Tube Radius').onChange(() => this.shape.build());
        fGeometry.add(this.params, 'curveScale', 0.3, 2.5, 0.05).name('Curve Scale').onChange(() => this.shape.build());
        fGeometry.add(this.params, 'twistFactor', 0.2, 3.0, 0.05).name('Twist Factor').onChange(() => this.shape.build());
        fGeometry.add(this.params, 'zSpread', 0.02, 0.3, 0.01).name('Z Spread').onChange(() => this.shape.build());
        fGeometry.add({ rebuild: () => this.shape.build() }, 'rebuild').name('Rebuild Tubes');

        // 3. Animation & Motion
        const fMotion = this.gui.addFolder('Animation & Motion');
        fMotion.add(this.params, 'timeSpeed', -3.0, 3.0, 0.1).name('Flow Speed');
        fMotion.add(this.params, 'dashFrequency', 5.0, 120.0, 1.0).name('Dash Frequency');
        fMotion.add(this.params, 'dashSpeed', 0.5, 20.0, 0.5).name('Dash Speed');
        fMotion.add(this.params, 'dashThreshold', -0.8, 0.8, 0.05).name('Stipple Density');
        fMotion.add(this.params, 'colorCycleSpeed', 0.0, 3.0, 0.05).name('Color Cycle Speed');
        fMotion.add(this.params, 'colorFrequency', 0.1, 3.0, 0.05).name('Color Frequency');
        fMotion.add(this.params, 'rotationSpeed', -1.0, 1.0, 0.05).name('Orbit Rotation Speed');

        // 4. Camera & Navigation
        const fCamera = this.gui.addFolder('Camera & Navigation');
        fCamera.add(this.params, 'dragMode', ['Orbit (Rotate)', 'Pan (Move)']).name('Left Drag Action').onChange(() => this.updateDragMode());
        const zoomCtrl = fCamera.add(this.params, 'zoomLevel', 0.5, 10.0, 0.05).name('Camera Distance').onChange((val) => {
          const dir = this.camera.position.clone().sub(this.controls.target).normalize();
          this.camera.position.copy(this.controls.target).addScaledVector(dir, val);
        });
        this.zoomCtrl = zoomCtrl;
        fCamera.add(this.controls, 'panSpeed', 0.2, 3.0, 0.1).name('Pan Sensitivity');
        fCamera.add(this.controls, 'zoomSpeed', 0.2, 3.0, 0.1).name('Zoom Sensitivity');
        fCamera.add(this.controls, 'rotateSpeed', 0.2, 3.0, 0.1).name('Rotate Sensitivity');
        fCamera.add({
          resetView: () => {
            this.camera.position.set(0, 0, 3);
            this.controls.target.set(0, 0, 0);
            this.camera.lookAt(0, 0, 0);
            this.controls.update();
            this.params.zoomLevel = 3.0;
            zoomCtrl.updateDisplay();
          }
        }, 'resetView').name('Reset Camera');

        // 5. Procedural Variation
        const fInteraction = this.gui.addFolder('Procedural Variation');
        fInteraction.add(this.params, 'clickToRandomize').name('Click to Randomize');
        fInteraction.add({ randomize: () => this.randomizeScene() }, 'randomize').name('Randomize Scene');
      }

      setupEvents() {
        window.addEventListener('resize', this.resize.bind(this), false);

        // Click on scene detection (distinguish genuine click from dragging/panning)
        let downX = 0, downY = 0, downTime = 0;
        let isPointerActive = false;

        this.renderer.domElement.addEventListener('pointerdown', (e) => {
          if (e.target && e.target.closest && e.target.closest('.lil-gui')) return;
          downX = e.clientX;
          downY = e.clientY;
          downTime = performance.now();
          isPointerActive = true;
        });

        window.addEventListener('pointerup', (e) => {
          if (!isPointerActive) return;
          isPointerActive = false;
          if (e.target && e.target.closest && e.target.closest('.lil-gui')) return;

          const dist = Math.hypot(e.clientX - downX, e.clientY - downY);
          const elapsed = performance.now() - downTime;

          if (dist < 6 && elapsed < 350) {
            if (this.params.clickToRandomize) {
              this.randomizeScene();
            }
          }
        });

        // Hide/show all UI with "H" key
        window.addEventListener('keydown', (e) => {
          if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) return;
          if (e.code === 'KeyH' || e.key === 'h' || e.key === 'H') {
            if (!this.gui) return;
            if (this.gui._hidden) {
              this.gui.show();
            } else {
              this.gui.hide();
            }
          }
        });
      }

      resize() {
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.camera.aspect = this.width / this.height;
        this.camera.updateProjectionMatrix();
        this.renderer.setSize(this.width, this.height);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      }

      render() {
        this.stats.begin();

        const dt = this.time.getDelta();
        this.simulatedTime += dt * this.params.timeSpeed;

        if (this.controls) {
          this.controls.update();
          const dist = this.camera.position.distanceTo(this.controls.target);
          if (Math.abs(this.params.zoomLevel - dist) > 0.05) {
            this.params.zoomLevel = +dist.toFixed(2);
            if (this.zoomCtrl) this.zoomCtrl.updateDisplay();
          }
        }

        for (let i = 0; i < this.shapes.length; i++) {
          this.shapes[i].update(this.simulatedTime, dt);
        }

        this.renderer.render(this.scene, this.camera);

        this.stats.end();
        this.animationId = requestAnimationFrame(this.render.bind(this));
      }
    }

    /**
     * class Shape
     */
    class Shape {
      constructor(sketch) {
        this.sketch = sketch;
        this.group = new THREE.Group();
        this.sketch.scene.add(this.group);

        this.initMaterial();
        this.build();
      }

      initMaterial() {
        this.material = new THREE.ShaderMaterial({
          side: THREE.DoubleSide,
          uniforms: {
            uTime: { value: 0 },
            uDashFrequency: { value: 50.0 },
            uDashSpeed: { value: 5.0 },
            uDashThreshold: { value: 0.0 },
            uColorMode: { value: 1 },
            uColor1: { value: new THREE.Color('#00f0ff') },
            uColor2: { value: new THREE.Color('#ff00aa') },
            uColor3: { value: new THREE.Color('#ffd700') },
            uColor4: { value: new THREE.Color('#00ff88') },
            uColor5: { value: new THREE.Color('#aa00ff') },
            uColorCount: { value: 5 },
            uColorCycleSpeed: { value: 0.5 },
            uColorFrequency: { value: 1.0 },
            uColorOffset: { value: 0.0 },
            uGlow: { value: 1.0 }
          },
          transparent: true,
          blending: THREE.AdditiveBlending,
          vertexShader: vertexShaderSource,
          fragmentShader: fragmentShaderSource
        });
      }

      disposeMeshes() {
        while (this.group.children.length > 0) {
          const mesh = this.group.children[0];
          this.group.remove(mesh);
          if (mesh.geometry) mesh.geometry.dispose();
        }
      }

      build() {
        this.disposeMeshes();

        const count = this.sketch.params.tubeCount;
        const radius = this.sketch.params.tubeRadius;
        const scale = this.sketch.params.curveScale;
        const twist = this.sketch.params.twistFactor;
        const zSpread = this.sketch.params.zSpread;

        for (let i = 0; i < count; i++) {
          const points = this.getPoints(360 * Math.random(), scale, twist, zSpread);
          const path = new THREE.CatmullRomCurve3(points);
          const geometry = new THREE.TubeBufferGeometry(path, 8, radius, 8, false);
          const mesh = new THREE.Mesh(geometry, this.material);
          this.group.add(mesh);
        }
      }

      getPoints(index, scale, twist, zSpread) {
        const points = [];
        const rand = (Math.random() * 0.1 + 0.005) * (zSpread / 0.1);
        const startVec = new THREE.Vector3();
        const stepCount = 80;

        for (let i = 0; i < stepCount; i++) {
          const angle = (i * Math.PI / 180) * twist;
          const rot = index * Math.PI / 180;
          const x = (Math.sin(angle) * Math.cos(rot) / 100) * scale;
          const y = (Math.sin(angle) * Math.sin(rot) / 100) * scale;
          const z = rand;
          const v = new THREE.Vector3(x, y, z);

          startVec.add(v);
          points.push(startVec.clone());
        }

        return points;
      }

      update(time, dt) {
        const u = this.material.uniforms;
        u.uTime.value = time;
        u.uDashFrequency.value = this.sketch.params.dashFrequency;
        u.uDashSpeed.value = this.sketch.params.dashSpeed;
        u.uDashThreshold.value = this.sketch.params.dashThreshold;
        u.uColorCycleSpeed.value = this.sketch.params.colorCycleSpeed;
        u.uColorFrequency.value = this.sketch.params.colorFrequency;

        if (this.sketch.params.rotationSpeed !== 0) {
          this.group.rotation.z += this.sketch.params.rotationSpeed * dt * 0.5;
          this.group.rotation.y += this.sketch.params.rotationSpeed * dt * 0.25;
        }
      }
    }

    // App Startup
    window.addEventListener('load', () => {
      const loading = document.getElementById('loading');
      if (loading) {
        loading.classList.add('loaded');
      }
      new Sketch();
    });
  </script>
