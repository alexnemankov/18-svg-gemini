<body>

    <script type="module">

        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import GUI from 'lil-gui';

        // --- 18 Preconfigured Color Palettes ---

            },
            'Twilight Magma': {

            },
            'Deep Violet Flow': {
                bg: '#010005',
                c1: '#ffffff', c2: '#e8e0ff', c3: '#b38fff', c4: '#6a3de8', c5: '#1a1250'
            },
            'Cyber Neon Pulse': {
                bg: '#010006',
                c1: '#ffffff', c2: '#00f0ff', c3: '#d40078', c4: '#e0fbff', c5: '#1e0a3d'
            }
        };

        // --- 8 Preconfigured Slow / Meditative Camera Animations ---
        const ANIMATION_MODES = [
            'Zero Gravity Drift',
            'Galactic Core Rotation',
            'Deep Thought Dive',
            'Ethereal Oscillation',
            'Celestial Horizon',
            'Cosmic Pulse',
            'Vortex Ascent',
            'Static (No Camera Motion)'
        ];

        // --- Simulation Parameters & Configuration ---
        const params = {
            // Preset Selection
            palettePreset: 'Solar Flare',
            animationMode: 'Zero Gravity Drift',

            // Colors
            greenscreen: false,
            bgColor: '#000000',
            color1: '#ffffff',
            color2: '#f6aa1c',
            color3: '#bc3908',
            color4: '#941b0c',
            color5: '#220901',
            colorCycleSpeed: 0.12,
            blendingMode: 'Additive', // 'Additive', 'Normal'

            // Particle Dynamics & Fluid Flow
            particleCount: 250000,
            particleSize: 22.0,
            animationSpeed: 0.75,
            noiseScale: 0.28,
            curlStrength: 1.8,
            swirlSpeed: 0.65,
            spiralArms: 4.0,
            spiralTightness: 0.45,
            inkClumpingLFO: 0.75,
            inkDissipation: 0.35,
            coreGlow: 2.2,
            inkSoftness: 1.8,
            nebulaGasScale: 2.6,

            // System & Interaction
            dpr: '1.5',
            clickToRandomize: true
        };

        // --- WebGL & Scene Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 22, 54);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        setDPR(params.dpr);
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.rotateSpeed = 0.75;
        controls.zoomSpeed = 1.0;
        controls.panSpeed = 0.8;
        controls.target.set(0, 0, 0);

        function setDPR(val) {
            let ratio = 1;
            if (val === 'Auto' || val === 'Device') {
                ratio = window.devicePixelRatio || 1;
            } else {
                ratio = parseFloat(val) || 1;
            }
            renderer.setPixelRatio(Math.min(Math.max(ratio, 0.5), 3.0));
        }

        // --- Custom GLSL Shaders for Cosmic Ink Field ---
        const vertexShader = `
            uniform float uTime;
            uniform float uNoiseScale;
            uniform float uCurlStrength;
            uniform float uSwirlSpeed;
            uniform float uSpiralArms;
            uniform float uSpiralTightness;
            uniform float uClumpingLFO;
            uniform float uDissipation;
            uniform float uParticleSize;
            uniform float uNebulaGasScale;
            uniform float uPixelRatio;

            attribute vec3 aSeed;
            attribute float aPhase;
            attribute float aSpeed;
            attribute float aColorIndex;
            attribute float aType; // 0.0 = Gas/Smoke Blob, 1.0 = Filament Ribbon, 2.0 = Star Sparkle

            varying float vPhase;
            varying float vColorIndex;
            varying float vSpeed;
            varying float vType;
            varying float vDistance;
            varying vec3 vWorldPos;

            // --- Robust 3D Simplex Noise ---
            vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x, 289.0);}
            vec4 taylorInvSqrt(vec4 r){return 1.79284291400159 - 0.85373472095314 * r;}

            float snoise(vec3 v){
                const vec2  C = vec2(1.0/6.0, 1.0/3.0);
                const vec4  D = vec4(0.0, 0.5, 1.0, 2.0);

                vec3 i  = floor(v + dot(v, C.yyy));
                vec3 x0 = v - i + dot(i, C.xxx);

                vec3 g = step(x0.yzx, x0.xyz);
                vec3 l = 1.0 - g;
                vec3 i1 = min( g.xyz, l.zxy );
                vec3 i2 = max( g.xyz, l.zxy );

                vec3 x1 = x0 - i1 + 1.0 * C.xxx;
                vec3 x2 = x0 - i2 + 2.0 * C.xxx;
                vec3 x3 = x0 - 1.0 + 3.0 * C.xxx;

                i = mod(i, 289.0 );
                vec4 p = permute( permute( permute(
                            i.z + vec4(0.0, i1.z, i2.z, 1.0 ))
                        + i.y + vec4(0.0, i1.y, i2.y, 1.0 ))
                        + i.x + vec4(0.0, i1.x, i2.x, 1.0 ));

                float n_ = 0.142857142857;
                vec3  ns = n_ * D.wyz - D.xzx;

                vec4 j = p - 49.0 * floor(p * ns.z * ns.z);

                vec4 x_ = floor(j * ns.z);
                vec4 y_ = floor(j - 7.0 * x_ );

                vec4 x = x_ *ns.x + ns.yyyy;
                vec4 y = y_ *ns.x + ns.yyyy;
                vec4 h = 1.0 - abs(x) - abs(y);

                vec4 b0 = vec4( x.xy, y.xy );
                vec4 b1 = vec4( x.zw, y.zw );

                vec4 s0 = floor(b0)*2.0 + 1.0;
                vec4 s1 = floor(b1)*2.0 + 1.0;
                vec4 sh = -step(h, vec4(0.0));

                vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ;
                vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ;

                vec3 p0 = vec3(a0.xy,h.x);
                vec3 p1 = vec3(a0.zw,h.y);
                vec3 p2 = vec3(a1.xy,h.z);
                vec3 p3 = vec3(a1.zw,h.w);

                vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
                p0 *= norm.x;
                p1 *= norm.y;
                p2 *= norm.z;
                p3 *= norm.w;

                vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
                m = m * m;
                return 42.0 * dot( m*m, vec4( dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3) ) );
            }

            // --- Analytical Curl Noise Field ---
            vec3 computeCurl(vec3 p) {
                const float e = 0.1;
                float dx0 = snoise(p + vec3(e, 0.0, 0.0)) - snoise(p - vec3(e, 0.0, 0.0));
                float dy0 = snoise(p + vec3(0.0, e, 0.0)) - snoise(p - vec3(0.0, e, 0.0));
                float dz0 = snoise(p + vec3(0.0, 0.0, e)) - snoise(p - vec3(0.0, 0.0, e));

                float dx1 = snoise(p.yzx + vec3(e, 0.0, 0.0)) - snoise(p.yzx - vec3(e, 0.0, 0.0));
                float dy1 = snoise(p.yzx + vec3(0.0, e, 0.0)) - snoise(p.yzx - vec3(0.0, e, 0.0));
                float dz1 = snoise(p.yzx + vec3(0.0, 0.0, e)) - snoise(p.yzx - vec3(0.0, 0.0, e));

                return vec3(dy1 - dz0, dz1 - dx0, dx1 - dy0) / (2.0 * e);
            }

            void main() {
                vPhase = aPhase;
                vColorIndex = aColorIndex;
                vSpeed = aSpeed;
                vType = aType;

                float t = uTime * aSpeed * 0.15 + aPhase;

                // Base structured coordinate
                vec3 p0 = position;

                // 1. Keplerian / Galaxy Differential Swirl
                float radius = length(p0.xz);
                float baseAngle = atan(p0.z, p0.x + 0.00001);

                // Differential rotation: core spins faster, arms follow in winding spiral
                float angularVelocity = (uSwirlSpeed * 1.5) / (1.0 + radius * 0.28);
                float rotationAngle = baseAngle + angularVelocity * uTime * 0.4;

                // 2. LFO Gravitational Clumping & Ink Dispersal Cycle
                float lfoCycle = sin(uTime * 0.2 + aPhase * 0.4) * 0.5 + 0.5;
                float clumping = mix(0.3, 1.2, lfoCycle * uClumpingLFO);

                // Swirled spiral plane position
                vec3 swirledPos = vec3(
                    radius * cos(rotationAngle),
                    p0.y * (0.8 + 0.3 * sin(radius * 0.25 + t * 0.4)),
                    radius * sin(rotationAngle)
                );

                // 3. Multi-Octave Curl Flow (Zero-G Ink billows)
                vec3 flowSample = swirledPos * uNoiseScale + vec3(
                    sin(t * 0.3 + aSeed.x) * 0.5,
                    cos(t * 0.25 + aSeed.y) * 0.5,
                    sin(t * 0.35 + aSeed.z) * 0.5
                );

                vec3 curl1 = computeCurl(flowSample);
                vec3 curl2 = computeCurl(flowSample * 2.4 + vec3(4.1, 1.7, 2.9)) * 0.5;
                vec3 curlTotal = curl1 + curl2;

                // 4. Combine Galactic Spiral + Organic Ink Fluid Field
                vec3 finalPos = swirledPos;
                
                // Fluid displacement along curl lines
                finalPos += curlTotal * (uCurlStrength * (2.2 + clumping * 1.8));

                // Ink billow drift & vertical wave convection
                finalPos.y += sin(radius * 0.4 - t * 0.8) * 1.4 + (curlTotal.y * 3.0);
                
                // Fine dissipation flutter
                finalPos += vec3(
                    sin(t * 1.6 + p0.y * 0.4) * uDissipation * 1.8,
                    cos(t * 1.3 + p0.x * 0.4) * uDissipation * 1.8,
                    sin(t * 1.7 + p0.z * 0.4) * uDissipation * 1.8
                );

                vWorldPos = finalPos;
                vDistance = length(finalPos);

                vec4 mvPosition = modelViewMatrix * vec4(finalPos, 1.0);
                gl_Position = projectionMatrix * mvPosition;

                // 5. Multi-Scale Particle Sizing based on Layer Type
                float baseSize = uParticleSize * uPixelRatio;
                float typeScale = 1.0;
                if (aType < 0.5) {
                    // Volumetric Nebular Ink Gas (Large, ethereal, overlapping smoke clouds)
                    typeScale = uNebulaGasScale * (1.8 + 0.4 * sin(t + aPhase));
                } else if (aType < 1.5) {
                    // Filament Streamline (Medium, sleek fluid ribbons)
                    typeScale = 1.0 * (0.8 + 0.3 * cos(t * 1.5 + aPhase));
                } else {
                    // Star Sparkle / Stellar Core (Small, brilliant pinpoint)
                    typeScale = 0.55 * (1.0 + 0.8 * sin(uTime * 4.0 + aPhase * 6.28));
                }

                float distToCam = max(0.5, -mvPosition.z * 0.075 + 0.8);
                gl_PointSize = (baseSize * typeScale) / distToCam;
                gl_PointSize = clamp(gl_PointSize, 1.0, 180.0 * uPixelRatio);
            }
        `;

        const fragmentShader = `
            uniform vec3 uColor1; // Radiant Core (Highlight)
            uniform vec3 uColor2; // Primary Fluid
            uniform vec3 uColor3; // Filament Mid
            uniform vec3 uColor4; // Deep Current
            uniform vec3 uColor5; // Ambient Mist
            uniform float uColorCycle;
            uniform float uCoreGlow;
            uniform float uInkSoftness;
            uniform float uGreenscreen;

            varying float vPhase;
            varying float vColorIndex;
            varying float vSpeed;
            varying float vType;
            varying float vDistance;
            varying vec3 vWorldPos;

            // Smooth 5-Stop Gradient Ramp
            vec3 getPaletteColor(float factor) {
                float f = fract(factor);
                if (f < 0.25) {
                    return mix(uColor1, uColor2, f / 0.25);
                } else if (f < 0.5) {
                    return mix(uColor2, uColor3, (f - 0.25) / 0.25);
                } else if (f < 0.75) {
                    return mix(uColor3, uColor4, (f - 0.5) / 0.25);
                } else {
                    return mix(uColor4, uColor5, (f - 0.75) / 0.25);
                }
            }

            void main() {
                vec2 coord = gl_PointCoord - vec2(0.5);
                float dist = length(coord);
                if (dist > 0.5) discard;

                // Dynamic Palette mapping based on radial distance from galactic core, flow speed & seed
                float coreWeight = clamp(1.0 - (vDistance / 28.0), 0.0, 1.0);
                float colorMod = vColorIndex * 0.6 + uColorCycle + (1.0 - coreWeight) * 0.55 + (vSpeed * 0.15);
                vec3 baseColor = getPaletteColor(colorMod);

                float alpha = 0.0;
                vec3 finalColor = baseColor;

                if (vType < 0.5) {
                    // --- Volumetric Nebular Ink Gas ---
                    // Deep soft Gaussian bloom
                    float g = exp(-dist * dist * (4.5 * uInkSoftness));
                    alpha = g * 0.28;
                    finalColor = mix(baseColor, uColor4, 0.3) * (0.8 + 0.4 * coreWeight);
                } else if (vType < 1.5) {
                    // --- Filament Ribbon Droplets ---
                    float r = smoothstep(0.5, 0.0, dist);
                    alpha = pow(r, uInkSoftness) * 0.75;
                    float innerCore = smoothstep(0.3, 0.0, dist);
                    finalColor = baseColor + (uColor1 * innerCore * uCoreGlow * 0.6);
                } else {
                    // --- Brilliant Stellar Nuclei & Star Points ---
                    float s = smoothstep(0.5, 0.0, dist);
                    float starCenter = pow(s, 3.0);
                    alpha = s * 0.95;
                    finalColor = mix(baseColor, uColor1, 0.75) * (1.2 + starCenter * uCoreGlow * 2.0);
                }

                // Super-luminous Core Boost for particles near the center
                if (coreWeight > 0.6) {
                    finalColor += uColor1 * (coreWeight - 0.6) * 1.5;
                }

                if (uGreenscreen > 0.5) {
                    // Clean boundary for green-screen alpha keying
                    gl_FragColor = vec4(finalColor, alpha);
                } else {
                    // Radiant HDR glow for additive and normal blending
                    gl_FragColor = vec4(finalColor, alpha);
                }
            }
        `;

        // --- Create Structured Cosmic Ink Geometry ---
        let particleGeometry, particleMaterial, particleSystem;

        function initParticles() {
            if (particleSystem) {
                scene.remove(particleSystem);
                particleGeometry.dispose();
            }

            const count = params.particleCount;
            particleGeometry = new THREE.BufferGeometry();

            const origins = new Float32Array(count * 3);
            const seeds = new Float32Array(count * 3);
            const phases = new Float32Array(count);
            const speeds = new Float32Array(count);
            const colorIndices = new Float32Array(count);
            const types = new Float32Array(count);

            const numArms = 4;
            const armOffset = (Math.PI * 2) / numArms;

            for (let i = 0; i < count; i++) {
                const i3 = i * 3;
                const randType = Math.random();

                let x, y, z;
                let particleType = 1.0; // 0: Gas, 1: Filament, 2: Star

                if (i < count * 0.22) {
                    // --- 1. Radiant Galactic Core (22%) ---
                    // Dense exponential Gaussian spheroid
                    const u = Math.random();
                    const v = Math.random();
                    const theta = u * 2.0 * Math.PI;
                    const phi = Math.acos(2.0 * v - 1.0);
                    const r = Math.pow(Math.random(), 2.2) * 8.5;

                    x = r * Math.sin(phi) * Math.cos(theta);
                    y = r * Math.cos(phi) * 0.55;
                    z = r * Math.sin(phi) * Math.sin(theta);

                    particleType = randType < 0.35 ? 0.0 : (randType < 0.75 ? 1.0 : 2.0);
                } else if (i < count * 0.75) {
                    // --- 2. Logarithmic Spiral Galaxy Arms & Filaments (53%) ---
                    const armIndex = i % numArms;
                    const armAngle = armIndex * armOffset;

                    // Distance along spiral arm
                    const distRatio = Math.pow(Math.random(), 0.85);
                    const r = 2.5 + distRatio * 26.0;

                    // Logarithmic spiral angle + winding pitch
                    const spiralAngle = armAngle + Math.log(r * 0.4 + 1.0) * 2.6;

                    // Cross-sectional dispersion around the filament spine
                    const spread = (0.4 + distRatio * 1.8) * Math.pow(Math.random(), 1.5);
                    const spreadAngle = Math.random() * Math.PI * 2.0;

                    x = (r + Math.cos(spreadAngle) * spread) * Math.cos(spiralAngle);
                    y = (Math.sin(spreadAngle) * spread * 0.6) + (Math.sin(r * 0.3) * 0.8);
                    z = (r + Math.cos(spreadAngle) * spread) * Math.sin(spiralAngle);

                    particleType = randType < 0.28 ? 0.0 : (randType < 0.85 ? 1.0 : 2.0);
                } else {
                    // --- 3. Outer Zero-G Ink Billow Halo & Drifting Stardust (25%) ---
                    const u = Math.random();
                    const v = Math.random();
                    const theta = u * 2.0 * Math.PI;
                    const phi = Math.acos(2.0 * v - 1.0);
                    const r = 10.0 + Math.pow(Math.random(), 0.8) * 24.0;

                    x = r * Math.sin(phi) * Math.cos(theta);
                    y = r * Math.cos(phi) * 0.4 + (Math.sin(theta * 3.0) * 2.0);
                    z = r * Math.sin(phi) * Math.sin(theta);

                    particleType = randType < 0.45 ? 0.0 : (randType < 0.8 ? 1.0 : 2.0);
                }

                origins[i3] = x;
                origins[i3 + 1] = y;
                origins[i3 + 2] = z;

                seeds[i3] = Math.random() * 50.0;
                seeds[i3 + 1] = Math.random() * 50.0;
                seeds[i3 + 2] = Math.random() * 50.0;

                phases[i] = Math.random() * Math.PI * 2.0;
                speeds[i] = 0.7 + Math.random() * 0.6;
                colorIndices[i] = Math.random();
                types[i] = particleType;
            }

            particleGeometry.setAttribute('position', new THREE.BufferAttribute(origins, 3));
            particleGeometry.setAttribute('aSeed', new THREE.BufferAttribute(seeds, 3));
            particleGeometry.setAttribute('aPhase', new THREE.BufferAttribute(phases, 1));
            particleGeometry.setAttribute('aSpeed', new THREE.BufferAttribute(speeds, 1));
            particleGeometry.setAttribute('aColorIndex', new THREE.BufferAttribute(colorIndices, 1));
            particleGeometry.setAttribute('aType', new THREE.BufferAttribute(types, 1));
            particleGeometry.computeBoundingSphere();

            particleMaterial = new THREE.ShaderMaterial({
                vertexShader,
                fragmentShader,
                uniforms: {
                    uTime: { value: 0 },
                    uNoiseScale: { value: params.noiseScale },
                    uCurlStrength: { value: params.curlStrength },
                    uSwirlSpeed: { value: params.swirlSpeed },
                    uSpiralArms: { value: params.spiralArms },
                    uSpiralTightness: { value: params.spiralTightness },
                    uClumpingLFO: { value: params.inkClumpingLFO },
                    uDissipation: { value: params.inkDissipation },
                    uParticleSize: { value: params.particleSize },
                    uNebulaGasScale: { value: params.nebulaGasScale },
                    uPixelRatio: { value: renderer.getPixelRatio() },

                    uColor1: { value: new THREE.Color(params.color1) },
                    uColor2: { value: new THREE.Color(params.color2) },
                    uColor3: { value: new THREE.Color(params.color3) },
                    uColor4: { value: new THREE.Color(params.color4) },
                    uColor5: { value: new THREE.Color(params.color5) },
                    uColorCycle: { value: 0 },
                    uCoreGlow: { value: params.coreGlow },
                    uInkSoftness: { value: params.inkSoftness },
                    uGreenscreen: { value: params.greenscreen ? 1.0 : 0.0 }
                },
                transparent: true,
                depthWrite: false,
                blending: params.blendingMode === 'Additive' ? THREE.AdditiveBlending : THREE.NormalBlending
            });

            particleSystem = new THREE.Points(particleGeometry, particleMaterial);
            scene.add(particleSystem);
        }

        // --- Apply Palette Helper ---
        function applyPalette(paletteName) {
            const pal = PALETTES[paletteName];
            if (!pal) return;

            params.palettePreset = paletteName;
            params.bgColor = pal.bg;
            params.color1 = pal.c1;
            params.color2 = pal.c2;
            params.color3 = pal.c3;
            params.color4 = pal.c4;
            params.color5 = pal.c5;

            updateColors();
            gui.controllersRecursive().forEach(c => c.updateDisplay());
        }

        function updateColors() {
            if (params.greenscreen) {
                renderer.setClearColor(0x00ff00, 1.0);
                document.body.style.backgroundColor = '#00ff00';
            } else {
                renderer.setClearColor(new THREE.Color(params.bgColor), 1.0);
                document.body.style.backgroundColor = params.bgColor;
            }

            if (particleMaterial) {
                particleMaterial.uniforms.uColor1.value.set(params.color1);
                particleMaterial.uniforms.uColor2.value.set(params.color2);
                particleMaterial.uniforms.uColor3.value.set(params.color3);
                particleMaterial.uniforms.uColor4.value.set(params.color4);
                particleMaterial.uniforms.uColor5.value.set(params.color5);
                particleMaterial.uniforms.uGreenscreen.value = params.greenscreen ? 1.0 : 0.0;
                particleMaterial.blending = (params.blendingMode === 'Additive' && !params.greenscreen) 
                    ? THREE.AdditiveBlending 
                    : THREE.NormalBlending;
                particleMaterial.needsUpdate = true;
            }
        }

        // --- Randomize Scene Procedurally ---
        function randomizeScene() {
            const paletteKeys = Object.keys(PALETTES);
            const randomPaletteKey = paletteKeys[Math.floor(Math.random() * paletteKeys.length)];
            applyPalette(randomPaletteKey);

            // Randomize motion and geometric flow parameters
            params.animationSpeed = THREE.MathUtils.randFloat(0.4, 1.2);
            params.noiseScale = THREE.MathUtils.randFloat(0.18, 0.45);
            params.curlStrength = THREE.MathUtils.randFloat(1.0, 2.5);
            params.swirlSpeed = THREE.MathUtils.randFloat(0.35, 1.1);
            params.spiralTightness = THREE.MathUtils.randFloat(0.25, 0.65);
            params.inkClumpingLFO = THREE.MathUtils.randFloat(0.4, 0.95);
            params.inkDissipation = THREE.MathUtils.randFloat(0.15, 0.65);
            params.particleSize = THREE.MathUtils.randFloat(16.0, 28.0);
            params.coreGlow = THREE.MathUtils.randFloat(1.5, 3.5);
            params.inkSoftness = THREE.MathUtils.randFloat(1.2, 2.8);
            params.nebulaGasScale = THREE.MathUtils.randFloat(2.0, 3.5);

            // Randomly choose an animation mode
            const randomAnim = ANIMATION_MODES[Math.floor(Math.random() * ANIMATION_MODES.length)];
            params.animationMode = randomAnim;

            // Sync Uniforms
            if (particleMaterial) {
                particleMaterial.uniforms.uNoiseScale.value = params.noiseScale;
                particleMaterial.uniforms.uCurlStrength.value = params.curlStrength;
                particleMaterial.uniforms.uSwirlSpeed.value = params.swirlSpeed;
                particleMaterial.uniforms.uSpiralTightness.value = params.spiralTightness;
                particleMaterial.uniforms.uClumpingLFO.value = params.inkClumpingLFO;
                particleMaterial.uniforms.uDissipation.value = params.inkDissipation;
                particleMaterial.uniforms.uParticleSize.value = params.particleSize;
                particleMaterial.uniforms.uNebulaGasScale.value = params.nebulaGasScale;
                particleMaterial.uniforms.uCoreGlow.value = params.coreGlow;
                particleMaterial.uniforms.uInkSoftness.value = params.inkSoftness;
            }

            gui.controllersRecursive().forEach(c => c.updateDisplay());
        }

        // --- lil-gui Control Panel Setup ---
        const gui = new GUI({ title: 'Cosmic Ink Field' });

        // Preset Dropdowns Folder
        const fPresets = gui.addFolder('Presets & Animations');
        fPresets.add(params, 'palettePreset', Object.keys(PALETTES)).name('Color Scheme').onChange(val => {
            applyPalette(val);
        });
        fPresets.add(params, 'animationMode', ANIMATION_MODES).name('Animation Mode');

        // Color Customization Folder
        const fColors = gui.addFolder('Colors & Greenscreen');
        fColors.add(params, 'greenscreen').name('Greenscreen #00ff00').onChange(() => {
            updateColors();
            gui.controllersRecursive().forEach(c => c.updateDisplay());
        });
        fColors.addColor(params, 'bgColor').name('Background Color').onChange(updateColors);
        fColors.addColor(params, 'color1').name('Radiant Highlight (1)').onChange(updateColors);
        fColors.addColor(params, 'color2').name('Fluid Primary (2)').onChange(updateColors);
        fColors.addColor(params, 'color3').name('Filament Mid (3)').onChange(updateColors);
        fColors.addColor(params, 'color4').name('Deep Current (4)').onChange(updateColors);
        fColors.addColor(params, 'color5').name('Ambient Mist (5)').onChange(updateColors);
        fColors.add(params, 'colorCycleSpeed', 0.0, 1.0, 0.01).name('Color LFO Shift');
        fColors.add(params, 'blendingMode', ['Additive', 'Normal']).name('Blend Mode').onChange(updateColors);
        fColors.add(params, 'coreGlow', 0.5, 5.0, 0.1).name('Core Luminescence').onChange(v => {
            if (particleMaterial) particleMaterial.uniforms.uCoreGlow.value = v;
        });
        fColors.add(params, 'inkSoftness', 0.5, 4.0, 0.1).name('Ink Diffusion Softness').onChange(v => {
            if (particleMaterial) particleMaterial.uniforms.uInkSoftness.value = v;
        });

        // Fluid & Zero-G Dynamics Folder
        const fDynamics = gui.addFolder('Fluid & Field Dynamics');
        fDynamics.add(params, 'animationSpeed', 0.0, 3.0, 0.05).name('Animation Speed');
        fDynamics.add(params, 'particleSize', 4.0, 45.0, 0.5).name('Particle Size').onChange(v => {
            if (particleMaterial) particleMaterial.uniforms.uParticleSize.value = v;
        });
        fDynamics.add(params, 'nebulaGasScale', 1.0, 5.0, 0.1).name('Nebula Gas Volume').onChange(v => {
            if (particleMaterial) particleMaterial.uniforms.uNebulaGasScale.value = v;
        });
        fDynamics.add(params, 'noiseScale', 0.05, 1.0, 0.01).name('Noise Frequency').onChange(v => {
            if (particleMaterial) particleMaterial.uniforms.uNoiseScale.value = v;
        });
        fDynamics.add(params, 'curlStrength', 0.0, 4.0, 0.05).name('Curl Turbulence').onChange(v => {
            if (particleMaterial) particleMaterial.uniforms.uCurlStrength.value = v;
        });
        fDynamics.add(params, 'swirlSpeed', 0.0, 3.0, 0.05).name('Galaxy Swirl Speed').onChange(v => {
            if (particleMaterial) particleMaterial.uniforms.uSwirlSpeed.value = v;
        });
        fDynamics.add(params, 'spiralTightness', 0.05, 1.0, 0.01).name('Spiral Tightness').onChange(v => {
            if (particleMaterial) particleMaterial.uniforms.uSpiralTightness.value = v;
        });
        fDynamics.add(params, 'inkClumpingLFO', 0.0, 1.5, 0.05).name('LFO Gravitational Pulse').onChange(v => {
            if (particleMaterial) particleMaterial.uniforms.uClumpingLFO.value = v;
        });
        fDynamics.add(params, 'inkDissipation', 0.0, 2.0, 0.05).name('Zero-G Dissipation').onChange(v => {
            if (particleMaterial) particleMaterial.uniforms.uDissipation.value = v;
        });

        // System Settings Folder
        const fSystem = gui.addFolder('System & Controls');
        fSystem.add(params, 'dpr', ['0.5', '1.0', '1.5', '2.0', 'Auto']).name('Pixel Ratio (DPR)').onChange(v => {
            setDPR(v);
            if (particleMaterial) particleMaterial.uniforms.uPixelRatio.value = renderer.getPixelRatio();
        });
        fSystem.add(params, 'clickToRandomize').name('Click Scene to Reroll');
        fSystem.add({ randomize: randomizeScene }, 'randomize').name('Generate Procedural Theme');
        fSystem.add({ resetCam: () => {
            controls.reset();
            camera.position.set(0, 22, 54);
            controls.target.set(0, 0, 0);
        }}, 'resetCam').name('Reset Camera');

        // Open primary folders by default
        fPresets.open();

        // --- Setup Particles and Initial Colors ---
        initParticles();
        applyPalette(params.palettePreset);

        // --- Distinguish Drag from Click on Scene ---
        let pointerDownPos = { x: 0, y: 0 };
        let pointerDownTime = 0;

        window.addEventListener('pointerdown', (e) => {
            pointerDownPos.x = e.clientX;
            pointerDownPos.y = e.clientY;
            pointerDownTime = performance.now();
        });

        window.addEventListener('pointerup', (e) => {
            // Ignore if clicking inside lil-gui
            if (e.target.closest('.lil-gui')) return;

            const dx = e.clientX - pointerDownPos.x;
            const dy = e.clientY - pointerDownPos.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const duration = performance.now() - pointerDownTime;

            // Trigger only on pure click (not dragging camera)
            if (dist < 6 && duration < 350 && params.clickToRandomize) {
                randomizeScene();
            }
        });

        // --- Keyboard Shortcut: Toggle UI with 'H' ---
        window.addEventListener('keydown', (e) => {
            if (e.key === 'h' || e.key === 'H') {
                gui._hidden ? gui.show() : gui.hide();
            }
        });

        // --- Window Resize Handler ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            if (particleMaterial) {
                particleMaterial.uniforms.uPixelRatio.value = renderer.getPixelRatio();
            }
        });

        // --- Animation Loop ---
        const clock = new THREE.Clock();
        let simTime = 0;

        function updateCameraMotion(time) {
            const mode = params.animationMode;
            if (mode === 'Static (No Camera Motion)') {
                return;
            }

            const t = time * 0.22;

            switch (mode) {
                case 'Zero Gravity Drift': {
                    const radius = 54.0 + Math.sin(t * 0.45) * 8.0;
                    camera.position.x = Math.sin(t * 0.35) * radius;
                    camera.position.z = Math.cos(t * 0.35) * radius;
                    camera.position.y = 20.0 + Math.sin(t * 0.25) * 10.0;
                    controls.target.set(Math.sin(t * 0.2) * 2.5, Math.cos(t * 0.25) * 1.5, 0);
                    break;
                }
                case 'Galactic Core Rotation': {
                    const radius = 48.0;
                    camera.position.x = Math.sin(t * 0.55) * radius;
                    camera.position.z = Math.cos(t * 0.55) * radius;
                    camera.position.y = 14.0 + Math.sin(t * 0.35) * 4.0;
                    controls.target.set(0, 0, 0);
                    break;
                }
                case 'Deep Thought Dive': {
                    const dist = 28.0 + Math.sin(t * 0.6) * 18.0;
                    camera.position.x = Math.sin(t * 0.25) * (dist * 0.45);
                    camera.position.z = dist;
                    camera.position.y = 8.0 + Math.cos(t * 0.35) * 8.0;
                    controls.target.set(0, Math.sin(t * 0.25) * 2.0, 0);
                    break;
                }
                case 'Ethereal Oscillation': {
                    // Lissajous 3D figure-eight wave
                    camera.position.x = Math.sin(t * 0.45) * 46.0;
                    camera.position.z = Math.cos(t * 0.22) * 46.0;
                    camera.position.y = 16.0 + Math.sin(t * 0.9) * 12.0;
                    controls.target.set(Math.sin(t * 0.45) * 3.5, 0, Math.cos(t * 0.45) * 3.5);
                    break;
                }
                case 'Celestial Horizon': {
                    const radius = 55.0;
                    camera.position.x = Math.sin(t * 0.3) * radius;
                    camera.position.z = Math.cos(t * 0.3) * radius;
                    camera.position.y = 4.0 + Math.sin(t * 0.18) * 3.5;
                    controls.target.set(0, 4.0 + Math.sin(t * 0.25) * 2.5, 0);
                    break;
                }
                case 'Cosmic Pulse': {
                    const radius = 44.0 + Math.sin(t * 0.75) * 16.0;
                    camera.position.x = Math.sin(t * 0.18) * (radius * 0.55);
                    camera.position.z = Math.cos(t * 0.18) * radius;
                    camera.position.y = 18.0 + Math.sin(t * 0.55) * 6.0;
                    controls.target.set(0, 0, 0);
                    break;
                }
                case 'Vortex Ascent': {
                    const radius = 48.0 + Math.sin(t * 0.35) * 6.0;
                    const height = (Math.sin(t * 0.3) * 0.5 + 0.5) * 36.0 - 8.0;
                    camera.position.x = Math.sin(t * 0.5) * radius;
                    camera.position.z = Math.cos(t * 0.5) * radius;
                    camera.position.y = height;
                    controls.target.set(0, height * 0.25, 0);
                    break;
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            simTime += delta * params.animationSpeed;

            // Update particle uniforms
            if (particleMaterial) {
                particleMaterial.uniforms.uTime.value = simTime;
                particleMaterial.uniforms.uColorCycle.value = (simTime * params.colorCycleSpeed * 0.1) % 1.0;
            }

            // Update Camera Preset Animation
            updateCameraMotion(simTime);

            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
