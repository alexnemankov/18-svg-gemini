<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Retro Vaporwave</title>
	<style>
		body {
			margin: 0;
			padding: 0;
			overflow: hidden;
			background-color: #000;
			user-select: none;
			-webkit-user-select: none;
		}
	</style>
	<script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
	<script>
		window.sceneParams = {
			animSpeed: 1.0
		};

		AFRAME.registerComponent( 'max-anisotropy', {
			dependencies: [ 'material', 'geometry' ],
			init: function() {
				var el = this.el;
				var applyAniso = function() {
					var mesh = el.getObject3D( 'mesh' );
					if( mesh && mesh.material && mesh.material.map && el.sceneEl && el.sceneEl.renderer ) {
						mesh.material.map.anisotropy = el.sceneEl.renderer.capabilities.getMaxAnisotropy();
						mesh.material.map.needsUpdate = true;
					}
				};
				if (el.sceneEl && el.sceneEl.hasLoaded) {
					applyAniso();
				} else if (el.sceneEl) {
					el.sceneEl.addEventListener('loaded', applyAniso);
				}
				el.addEventListener('materialtextureloaded', applyAniso);
			}
		} );

		AFRAME.registerComponent( 'canvas-updater', {
			dependencies: [ 'material', 'geometry' ],
			tick: function() {
				var el = this.el;
				var mesh = el.getObject3D( 'mesh' );
				if( mesh && mesh.material ) {
					if( mesh.material.map ) {
						if (mesh.material.map.image && mesh.material.map.image.id === 'SunCanvas') {
							mesh.material.map.needsUpdate = true;
						} else if (mesh.material.map.needsUpdate) {
							mesh.material.map.needsUpdate = true;
						}
					}
					if( mesh.material.displacementMap && mesh.material.displacementMap.needsUpdate ) {
						mesh.material.displacementMap.needsUpdate = true;
					}
				}
			}
		} );

		AFRAME.registerComponent( 'position-loop', {
			schema: {
				duration: { type: 'int', default: 1000 },
				progress: { type: 'int', default: 0 },
				from: { type: 'vec3', default: { x: 0, y: 0, z: 0 } },
				to: { type: 'vec3', default: { x: 0, y: 0, z: 0 } }
			},
			tick: function( time, delta ) {
				var spd = (window.sceneParams && window.sceneParams.animSpeed !== undefined) ? window.sceneParams.animSpeed : 1.0;
				var a_duration = this.data.duration;
				var a_progress = this.data.progress + (delta * spd);
				if( a_progress > a_duration ) a_progress = a_progress % a_duration;
				var a_playhead = a_progress / a_duration; /* 0 to 1 */

				var from_x = this.data.from.x;
				var from_y = this.data.from.y;
				var from_z = this.data.from.z;

				var to_x = this.data.to.x;
				var to_y = this.data.to.y;
				var to_z = this.data.to.z;

				var progress_x = ( to_x - from_x ) * a_playhead;
				var progress_y = ( to_y - from_y ) * a_playhead;
				var progress_z = ( to_z - from_z ) * a_playhead;

				this.el.setAttribute( 'position', {
					x: from_x + progress_x,
					y: from_y + progress_y,
					z: from_z + progress_z
				} );
				this.el.setAttribute( 'position-loop', 'progress', a_progress );
			}
		} );

		AFRAME.registerComponent( 'vaporwave-tree', {
			schema: {
				trunkSegments: { type: 'int', default: 5 },
				trunkBend: { type: 'number', default: 0 },
				trunkColor: { type: 'color', default: '#00FFFF' },
				leafDensity: { type: 'int', default: 16 },
				leafColor: { type: 'color', default: '#00FFFF' },
				wireframe: { type: 'boolean', default: true }
			},
			init: function() {
				// Trunk height clamp...
				var trunkSegments = parseInt( this.data.trunkSegments );
				if( trunkSegments < 1 ) trunkSegments = 1;
				if( trunkSegments > 8 ) trunkSegments = 8;

				// Build trunk...
				var ParentTrunkEl = this.el;
				for( var _i = 0; _i <= trunkSegments - 1; _i ++ ) {
					// Trunk Primitive...
					var TrunkPrimitive = document.createElement( 'a-cone' );
					TrunkPrimitive.classList.add( 'tree-trunk-mesh' );
					TrunkPrimitive.setAttribute( 'height', '1' );
					TrunkPrimitive.setAttribute( 'segments-height', '1' );
					TrunkPrimitive.setAttribute( 'segments-radial', '6' );
					TrunkPrimitive.setAttribute( 'radius-bottom', '0.2' );
					TrunkPrimitive.setAttribute( 'radius-top', '0.25' );
					TrunkPrimitive.setAttribute( 'position', '0 0.5 0' );
					TrunkPrimitive.setAttribute( 'scale', '' + ( 1 - ( 0.1 * _i ) ) + ' 1 ' + ( 1 - ( 0.1 * _i ) ) );
					if( this.data.wireframe ) {
						TrunkPrimitive.setAttribute( 'material', 'shader: flat; wireframe: true; color: ' + this.data.trunkColor + ';' );
					} else {
						TrunkPrimitive.setAttribute( 'material', 'flatShading: true; color: ' + this.data.trunkColor + ';' );
					}

					// Trunk Wrapper...
					var TrunkRig = document.createElement( 'a-entity' );
					TrunkRig.setAttribute( 'position', '0 ' + ( _i ? '1' : '0' ) + ' 0' );
					TrunkRig.setAttribute( 'rotation', '0 0 ' + ( _i ? this.data.trunkBend : '0' ) );
					TrunkRig.appendChild( TrunkPrimitive );

					// Parent Append...
					ParentTrunkEl.appendChild( TrunkRig );

					// Become Parent...
					ParentTrunkEl = TrunkRig;
				}

				// Canopy density clamp...
				var leafDensity = parseInt( this.data.leafDensity );
				if( leafDensity < 1 ) leafDensity = 1;
				if( leafDensity > 32 ) leafDensity = 32;

				// Canopy rig...
				var CanopyRig = document.createElement( 'a-entity' );
				CanopyRig.setAttribute( 'position', '0 1 0' );
				CanopyRig.setAttribute( 'rotation', '0 0 ' + ( _i ? this.data.trunkBend : '0' ) );
				ParentTrunkEl.appendChild( CanopyRig );

				// Build canopy...
				for( var _i = 0; _i < leafDensity; _i ++ ) {
					// Leaf tip outer...
					var LeafTipOuter = document.createElement( 'a-cone' );
					LeafTipOuter.classList.add( 'tree-leaf-mesh' );
					LeafTipOuter.setAttribute( 'height', '0.75' );
					LeafTipOuter.setAttribute( 'segments-height', '1' );
					LeafTipOuter.setAttribute( 'segments-radial', '4' );
					LeafTipOuter.setAttribute( 'radius-bottom', '0.25' );
					LeafTipOuter.setAttribute( 'radius-top', '0' );
					LeafTipOuter.setAttribute( 'position', '0 0.375 0' );
					LeafTipOuter.setAttribute( 'scale', '0.1 1 1' );
					if( this.data.wireframe ) {
						LeafTipOuter.setAttribute( 'material', 'shader: flat; wireframe: true; color: ' + this.data.leafColor + ';' );
					} else {
						LeafTipOuter.setAttribute( 'material', 'flatShading: true; color: ' + this.data.leafColor + ';' );
					}
					var LeafTipOuterRig = document.createElement( 'a-entity' );
					LeafTipOuterRig.setAttribute( 'position', '0 0.5 0' );
					LeafTipOuterRig.setAttribute( 'rotation', '0 0 22.5' );
					LeafTipOuterRig.appendChild( LeafTipOuter );

					// Leaf tip inner...
					var LeafTipInner = document.createElement( 'a-cylinder' );
					LeafTipInner.classList.add( 'tree-leaf-mesh' );
					LeafTipInner.setAttribute( 'height', '0.5' );
					LeafTipInner.setAttribute( 'segments-height', '1' );
					LeafTipInner.setAttribute( 'segments-radial', '4' );
					LeafTipInner.setAttribute( 'radius', '0.25' );
					LeafTipInner.setAttribute( 'position', '0 0.25 0' );
					LeafTipInner.setAttribute( 'scale', '0.1 1 1' );
					if( this.data.wireframe ) {
						LeafTipInner.setAttribute( 'material', 'shader: flat; wireframe: true; color: ' + this.data.leafColor + ';' );
					} else {
						LeafTipInner.setAttribute( 'material', 'flatShading: true; color: ' + this.data.leafColor + ';' );
					}
					var LeafTipInnerRig = document.createElement( 'a-entity' );
					LeafTipInnerRig.setAttribute( 'position', '0 0.5 0' );
					LeafTipInnerRig.setAttribute( 'rotation', '0 0 22.5' );
					LeafTipInnerRig.appendChild( LeafTipInner );
					LeafTipInnerRig.appendChild( LeafTipOuterRig );

					// Leaf base inner...
					var LeafBaseInner = document.createElement( 'a-cylinder' );
					LeafBaseInner.classList.add( 'tree-leaf-mesh' );
					LeafBaseInner.setAttribute( 'height', '0.5' );
					LeafBaseInner.setAttribute( 'segments-height', '1' );
					LeafBaseInner.setAttribute( 'segments-radial', '4' );
					LeafBaseInner.setAttribute( 'radius', '0.25' );
					LeafBaseInner.setAttribute( 'position', '0 0.25 0' );
					LeafBaseInner.setAttribute( 'scale', '0.1 1 1' );
					if( this.data.wireframe ) {
						LeafBaseInner.setAttribute( 'material', 'shader: flat; wireframe: true; color: ' + this.data.leafColor + ';' );
					} else {
						LeafBaseInner.setAttribute( 'material', 'flatShading: true; color: ' + this.data.leafColor + ';' );
					}
					var LeafBaseInnerRig = document.createElement( 'a-entity' );
					LeafBaseInnerRig.setAttribute( 'position', '0 0.75 0' );
					LeafBaseInnerRig.setAttribute( 'rotation', '0 0 22.5' );
					LeafBaseInnerRig.appendChild( LeafBaseInner );
					LeafBaseInnerRig.appendChild( LeafTipInnerRig );

					// Leaf base outer...
					var LeafBaseOuter = document.createElement( 'a-cone' );
					LeafBaseOuter.classList.add( 'tree-leaf-mesh' );
					LeafBaseOuter.setAttribute( 'height', '0.75' );
					LeafBaseOuter.setAttribute( 'segments-height', '1' );
					LeafBaseOuter.setAttribute( 'segments-radial', '4' );
					LeafBaseOuter.setAttribute( 'radius-bottom', '0' );
					LeafBaseOuter.setAttribute( 'radius-top', '0.25' );
					LeafBaseOuter.setAttribute( 'position', '0 0.375 0' );
					LeafBaseOuter.setAttribute( 'scale', '0.1 1 1' );
					if( this.data.wireframe ) {
						LeafBaseOuter.setAttribute( 'material', 'shader: flat; wireframe: true; color: ' + this.data.leafColor + ';' );
					} else {
						LeafBaseOuter.setAttribute( 'material', 'flatShading: true; color: ' + this.data.leafColor + ';' );
					}
					var LeafBaseOuterRig = document.createElement( 'a-entity' );
					LeafBaseOuterRig.setAttribute( 'rotation', [ 0, Math.random() * 360 , ( Math.random() * 90 ) + 30 ].join( ' ' ) );
					LeafBaseOuterRig.setAttribute( 'scale', Array( 3 ).fill( ( Math.random() * 0.25 ) + 0.75 ).join( ' ' ) );
					LeafBaseOuterRig.appendChild( LeafBaseOuter );
					LeafBaseOuterRig.appendChild( LeafBaseInnerRig );
					
					// Attach to canopy...
					CanopyRig.appendChild( LeafBaseOuterRig );
				}
			}
		} );
	</script>

	<script type="module">
		import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

		/* CORE CANVASES & VARIABLES */
		const CameraRig = document.getElementById( 'CameraRig' );
		const MainCamera = document.getElementById( 'MainCamera' );
		const CameraLag = 16;
		const BaseRotation = [ 16.75, 0, 0 ];
		let CurrentRotation = [ 16.75, 0, 0 ];
		let OffsetX = 0, OffsetY = 0;

		const SunCanvasEl = document.getElementById( 'SunCanvas' );
		const SunCanvas2D = SunCanvasEl.getContext( '2d' );
		let SunCanvasPhase = 0;

		const SkyCanvasEl = document.getElementById( 'SkyCanvas' );
		const SkyCanvas2D = SkyCanvasEl.getContext( '2d' );

		const GridCanvasEl = document.getElementById( 'GridCanvas' );
		const GridCanvas2D = GridCanvasEl.getContext( '2d' );

		const HillsCanvasEl = document.getElementById( 'HillsCanvas' );
		const HillsCanvas2D = HillsCanvasEl.getContext( '2d' );

		function PickBetween( min, max ) {
			min = Math.ceil( min );
			max = Math.floor( max );
			return Math.floor( Math.random() * ( max - min + 1 ) + min );
		}

		function hexToRgba(hex, alpha) {
			let c = hex.replace('#', '');
			if (c.length === 3) {
				c = c.split('').map(x => x + x).join('');
			}
			const num = parseInt(c, 16);
			const r = (num >> 16) & 255;
			const g = (num >> 8) & 255;
			const b = num & 255;
			return `rgba(${r},${g},${b},${alpha})`;
		}

		function hslToHex(h, s, l) {
			h = ((h % 360) + 360) % 360;
			s /= 100;
			l /= 100;
			const a = s * Math.min(l, 1 - l);
			const f = n => {
				const k = (n + h / 30) % 12;
				const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
				return Math.round(255 * color).toString(16).padStart(2, '0');
			};
			return `#${f(0)}${f(8)}${f(4)}`;
		}

		/* CANVAS INITIALIZERS */
		function InitHillsCanvas(roughnessMultiplier = 1.0, valleyWidth = 1/3) {
			HillsCanvas2D.fillStyle = 'rgb(0,0,0)';
			HillsCanvas2D.fillRect( 0, 0, 32, 32 );

			for( let _y = 0; _y < 31; _y ++ ) {
				for( let _x = 0; _x < 31; _x ++ ) {
					let _z = Math.floor(PickBetween( 0, 255 ) * roughnessMultiplier);
					if (_z > 255) _z = 255;
					HillsCanvas2D.fillStyle = 'rgb(' + [ _z, _z, _z ].join(',') + ')';
					HillsCanvas2D.fillRect( _x , _y, 1, 1 );

					if( !_y ) HillsCanvas2D.fillRect( _x, 31, 1, 1 );
					if( !_x ) HillsCanvas2D.fillRect( 31, _y, 1, 1 );
					if( !_x && !_y ) HillsCanvas2D.fillRect( 31, 31, 1, 1 );
				}
			}

			let HillsGradient = HillsCanvas2D.createLinearGradient( 0, 0, 32, 0 );
			HillsGradient.addColorStop( 0, 'rgba(0,0,0,0.0)' );
			HillsGradient.addColorStop( valleyWidth, 'rgba(0,0,0,1.0)' );
			HillsGradient.addColorStop( 1 - valleyWidth, 'rgba(0,0,0,1.0)' );
			HillsGradient.addColorStop( 1, 'rgba(0,0,0,0.0)' );
			HillsCanvas2D.fillStyle = HillsGradient;
			HillsCanvas2D.fillRect( 0, 0, 32, 32 );

			const planes = document.querySelectorAll( '.grid-plane' );
			planes.forEach( plane => {
				const mesh = plane.getObject3D( 'mesh' );
				if( mesh && mesh.material && mesh.material.displacementMap ) {
					mesh.material.displacementMap.needsUpdate = true;
				}
			} );
		}
		InitHillsCanvas();

		function InitGridCanvas() {
			var GridGradient = GridCanvas2D.createLinearGradient( 0, 0, 2048, 0 );
			GridGradient.addColorStop( 0.000, params.gridColor1 );
			GridGradient.addColorStop( 0.100, params.gridColor1 );
			GridGradient.addColorStop( 0.500, params.gridColor2 );
			GridGradient.addColorStop( 0.900, params.gridColor1 );
			GridGradient.addColorStop( 1.000, params.gridColor1 );
			GridCanvas2D.fillStyle = GridGradient;
			GridCanvas2D.fillRect( 0, 0, 2048, 2048 );

			GridCanvas2D.fillStyle = params.gridFloorColor;
			for( let _y = 0; _y < 32; _y ++ ) {
				for( let _x = 0; _x < 32; _x ++ ) {
					GridCanvas2D.fillRect( ( _x * 64 ) + 1, ( _y * 64) + 1, 62, 62 );
				}
			}

			const planes = document.querySelectorAll( '.grid-plane' );
			planes.forEach( plane => {
				const mesh = plane.getObject3D( 'mesh' );
				if( mesh && mesh.material && mesh.material.map ) {
					mesh.material.map.needsUpdate = true;
				}
			} );
		}
		InitGridCanvas();

		function InitSkyCanvas(starsColor = '#FFFFFF', spaceColor = '#000000') {
			SkyCanvas2D.fillStyle = spaceColor;
			SkyCanvas2D.fillRect( 0, 0, 6400, 3200 );

			for( let i = 0; i < 1024; i ++ ) {
				SkyCanvas2D.beginPath();
				SkyCanvas2D.arc( PickBetween( 0, 6400 ), PickBetween( 0, 1600 ), ( PickBetween( 1, 3 ) / 2 ), 0, 2 * Math.PI );
				SkyCanvas2D.fillStyle = starsColor;
				SkyCanvas2D.fill();
			}

			var SkyGradient = SkyCanvas2D.createLinearGradient( 0, 0, 0, 3200 );
			SkyGradient.addColorStop( 0.00, hexToRgba(params.fogColor, 0.0) );
			SkyGradient.addColorStop( 0.375, hexToRgba(params.fogColor, 0.0) );
			SkyGradient.addColorStop( 0.5, hexToRgba(params.fogColor, 1.0) );
			SkyGradient.addColorStop( 1.00, hexToRgba(params.fogColor, 1.0) );
			SkyCanvas2D.fillStyle = SkyGradient;
			SkyCanvas2D.fillRect( 0, 0, 6400, 3200 );

			const skySphere = document.getElementById( 'SkySphere' );
			if( skySphere ) {
				const mesh = skySphere.getObject3D( 'mesh' );
				if( mesh && mesh.material && mesh.material.map ) {
					mesh.material.map.needsUpdate = true;
				}
			}
		}
		InitSkyCanvas();

		function UpdateSunCanvas() {
			SunCanvas2D.fillStyle = params.sunBgColor;
			SunCanvas2D.fillRect( 0, 0, 512, 512 );

			for( let i = 0; i < 32; i ++ ) {
				var vSize = 1 * ( i + 1 );
				var vOffset = ( SunCanvasPhase + ( 16 * i ) ) + vSize;
				SunCanvas2D.fillStyle = params.sunLineColor;
				SunCanvas2D.fillRect( 0, 512 - vOffset, 512, vSize );
			}
			SunCanvasPhase += 0.5 * (params.animSpeed || 1.0);
			if( SunCanvasPhase > 16 ) SunCanvasPhase -= 16;
		}
		UpdateSunCanvas();

		/* SCENE UPDATE HELPERS */
		function updateTreeMaterials() {
			const trunks = document.querySelectorAll( '.tree-trunk-mesh' );
			const leaves = document.querySelectorAll( '.tree-leaf-mesh' );
			trunks.forEach( el => {
				const mesh = el.getObject3D( 'mesh' );
				if( mesh && mesh.material ) {
					mesh.material.color.set( params.trunkColor );
					mesh.material.wireframe = params.treeWireframe;
					mesh.material.needsUpdate = true;
				}
			} );
			leaves.forEach( el => {
				const mesh = el.getObject3D( 'mesh' );
				if( mesh && mesh.material ) {
					mesh.material.color.set( params.leafColor );
					mesh.material.wireframe = params.treeWireframe;
					mesh.material.needsUpdate = true;
				}
			} );
		}

		function updateLights() {
			const pointLight = document.getElementById( 'pointLight' );
			const hemiLight = document.getElementById( 'hemiLight' );
			const scene = document.querySelector( 'a-scene' );

			if( scene && scene.renderer ) {
				scene.renderer.toneMappingExposure = params.exposure;
			}

			if( pointLight ) {
				const intensity = params.pointLightEnabled ? (params.pointLightIntensity * params.masterLightIntensity) : 0;
				pointLight.setAttribute( 'light', {
					type: 'point',
					color: params.pointLightColor,
					intensity: intensity,
					distance: params.pointLightDistance
				} );
			}

			if( hemiLight ) {
				const hemiIntensity = params.hemiLightEnabled ? (params.hemiLightIntensity * params.masterLightIntensity) : 0;
				hemiLight.setAttribute( 'light', {
					type: 'hemisphere',
					color: params.hemiSkyColor,
					groundColor: params.hemiGroundColor,
					intensity: hemiIntensity
				} );
			}
		}

		function updateGreenscreen() {
			const skySphere = document.getElementById( 'SkySphere' );
			const aSky = document.getElementById( 'sceneSky' );
			const scene = document.querySelector( 'a-scene' );

			if( params.greenscreen ) {
				if( skySphere ) skySphere.setAttribute( 'visible', 'false' );
				if( aSky ) aSky.setAttribute( 'material', 'color: ' + params.greenscreenColor + '; fog: false;' );
				document.body.style.backgroundColor = params.greenscreenColor;
				if( scene && scene.renderer ) {
					scene.renderer.setClearColor( params.greenscreenColor, 1.0 );
				}
				if( scene ) {
					scene.setAttribute( 'fog', 'type: linear; color: ' + params.greenscreenColor + '; far: 384;' );
				}
			} else {
				if( skySphere ) skySphere.setAttribute( 'visible', 'true' );
				if( aSky ) aSky.setAttribute( 'material', 'color: ' + params.fogColor + '; fog: false;' );
				document.body.style.backgroundColor = '#000000';
				if( scene && scene.renderer ) {
					scene.renderer.setClearColor( 0x000000, 1.0 );
				}
				if( scene ) {
					scene.setAttribute( 'fog', 'type: linear; color: ' + params.fogColor + '; far: 384;' );
				}
			}
		}

		function updateDPR() {
			const scene = document.querySelector( 'a-scene' );
			if( scene && scene.renderer ) {
				scene.renderer.setPixelRatio( params.dpr );

			const scene = document.querySelector( 'a-scene' );
			if( scene ) {
				scene.setAttribute( 'renderer', 'antialias: ' + params.antialias + '; logarithmicDepthBuffer: true;' );
			}

		function applyColorScheme(schemeName) {
			const s = COLOR_SCHEMES[ schemeName ];
			if( !s ) return;

			if( schemeName === 'Achromatic' && params.invertAchromatic ) {
				// White and black version
				params.gridColor1 = '#000000';
				params.gridColor2 = '#444444';
				params.gridFloorColor = '#f5f5f5';
				params.sunLineColor = '#000000';
				params.sunBgColor = '#dddddd';
				params.fogColor = '#e5e5e5';
				params.trunkColor = '#000000';
				params.leafColor = '#222222';
				params.pointLightColor = '#ffffff';
				params.hemiSkyColor = '#ffffff';
				params.hemiGroundColor = '#777777';
			} else if( schemeName === 'Achromatic + Accent' && params.invertAchromatic ) {
				// White and black + red version
				params.gridColor1 = '#ff0033';
				params.gridColor2 = '#000000';
				params.gridFloorColor = '#fafafa';
				params.sunLineColor = '#ff0033';
				params.sunBgColor = '#f0f0f0';
				params.fogColor = '#f5f5f5';
				params.trunkColor = '#000000';
				params.leafColor = '#ff0033';
				params.pointLightColor = '#ff2244';
				params.hemiSkyColor = '#ffffff';
				params.hemiGroundColor = '#ffccd4';
			} else {
				params.gridColor1 = s.grid1;
				params.gridColor2 = s.grid2;
				params.gridFloorColor = s.floor;
				params.sunLineColor = s.sunLine;
				params.sunBgColor = s.sunBg;
				params.fogColor = s.fog;
				params.trunkColor = s.trunk;
				params.leafColor = s.leaves;
				params.treeWireframe = s.wireframe;
				params.pointLightColor = s.pointLight;
				params.hemiSkyColor = s.hemiSky;
				params.hemiGroundColor = s.hemiGround;
			}

			InitGridCanvas();
			InitSkyCanvas(s.stars || '#FFFFFF', params.gridFloorColor);
			updateTreeMaterials();
			updateLights();
			updateGreenscreen();
			syncGUI();
		}

		/* PROCEDURAL RANDOM GENERATOR ON CLICK */
		function generateRandomVariation() {
			const primaryHue = Math.floor( Math.random() * 360 );
			const secondaryHue = ( primaryHue + 180 + Math.floor( ( Math.random() - 0.5 ) * 60 ) ) % 360;

			params.colorScheme = Object.keys( COLOR_SCHEMES )[ Math.floor( Math.random() * Object.keys( COLOR_SCHEMES ).length ) ];
			const s = COLOR_SCHEMES[ params.colorScheme ];

			// Procedurally blend variations
			params.gridColor1 = hslToHex( primaryHue, 95, 55 );
			params.gridColor2 = hslToHex( secondaryHue, 95, 55 );
			params.gridFloorColor = hslToHex( primaryHue, 60, 4 );
			params.sunLineColor = hslToHex( secondaryHue, 100, 60 );
			params.sunBgColor = hslToHex( primaryHue, 80, 16 );
			params.fogColor = hslToHex( primaryHue, 70, 14 );
			params.trunkColor = hslToHex( primaryHue, 90, 60 );
			params.leafColor = hslToHex( secondaryHue, 90, 60 );
			params.pointLightColor = hslToHex( secondaryHue, 100, 65 );
			params.hemiSkyColor = hslToHex( primaryHue, 90, 90 );
			params.hemiGroundColor = hslToHex( secondaryHue, 80, 20 );
			params.treeWireframe = Math.random() > 0.15;

			// Re-roll geometric parameters
			params.displacementScale = Math.floor( 35 + Math.random() * 60 );
			const planes = document.querySelectorAll( '.grid-plane' );
			planes.forEach( p => p.setAttribute( 'material', 'displacementScale', params.displacementScale ) );

			InitHillsCanvas( 0.6 + Math.random() * 0.9, 0.2 + Math.random() * 0.25 );
			InitGridCanvas();
			InitSkyCanvas( '#FFFFFF', params.gridFloorColor );
			updateTreeMaterials();

			// Re-roll motion parameters
			params.animSpeed = +( 0.6 + Math.random() * 1.4 ).toFixed( 2 );
			params.activeAnimation = ANIMATIONS[ Math.floor( Math.random() * ANIMATIONS.length ) ];

			// Re-roll lighting parameters
			params.exposure = +( 0.8 + Math.random() * 0.6 ).toFixed( 2 );
			params.pointLightIntensity = +( 1.5 + Math.random() * 2.5 ).toFixed( 1 );
			params.hemiLightIntensity = +( 1.2 + Math.random() * 2.0 ).toFixed( 1 );

			updateLights();
			updateGreenscreen();
			syncGUI();
		}

		/* CAMERA UPDATE WITH CONTINUOUS ANIMATION & PRESERVED ZOOM/ANGLE/PAN */
		function UpdateCameraRig(t) {
			if( !CameraRig || !MainCamera ) return;

			CurrentRotation = [
				CurrentRotation[ 0 ] + ( ( ( BaseRotation[ 0 ] + OffsetY ) - CurrentRotation[ 0 ] ) / CameraLag ),
				CurrentRotation[ 1 ] + ( ( ( BaseRotation[ 1 ] + OffsetX ) - CurrentRotation[ 1 ] ) / CameraLag ),
				0,
			];

			let animRotX = 0, animRotY = 0, animRotZ = 0;
			let animPosX = 0, animPosY = 0;

			switch ( params.activeAnimation ) {
				case 'Static (No Camera Motion)':
					break;
				case 'Horizon Drift':
					animRotY = Math.sin( t * 0.4 ) * 4.0;
					animRotZ = Math.cos( t * 0.4 ) * 0.8;
					animPosX = Math.sin( t * 0.4 ) * 20.0;
					break;
				case 'Synthwave Cruise':
					animRotX = Math.sin( t * 0.5 ) * 2.5;
					animRotZ = Math.cos( t * 0.3 ) * 1.5;
					animPosY = Math.sin( t * 0.5 ) * 10.0;
					break;
				case 'Gentle Orbit':
					animRotY = Math.sin( t * 0.3 ) * 12.0;
					animRotX = Math.cos( t * 0.3 ) * 2.0;
					animPosX = Math.sin( t * 0.3 ) * 45.0;
					break;
				case 'Low Altitude Glide':
					animPosY = -35.0 + Math.sin( t * 0.4 ) * 6.0;
					animRotX = -3.5 + Math.sin( t * 0.4 ) * 1.5;
					animPosX = Math.cos( t * 0.25 ) * 25.0;
					animRotY = Math.sin( t * 0.25 ) * 3.5;
					break;
				case 'Skyward Panoramic':
					animPosY = 45.0 + Math.sin( t * 0.35 ) * 10.0;
					animRotX = 5.0 + Math.sin( t * 0.35 ) * 1.5;
					animRotY = Math.cos( t * 0.2 ) * 6.0;
					break;
				case 'Figure-8 Wobble':
					animRotX = Math.sin( t * 0.4 ) * 2.2;
					animRotY = Math.sin( t * 0.2 ) * 6.5;
					animRotZ = Math.sin( t * 0.4 ) * 1.4;
					animPosX = Math.sin( t * 0.2 ) * 35.0;
					animPosY = Math.cos( t * 0.4 ) * 12.0;
					break;
				case 'Retro Synth Glide':
					animPosX = Math.sin( t * 0.25 ) * 65.0;
					animRotY = -Math.sin( t * 0.25 ) * 6.0;
					animRotZ = Math.cos( t * 0.25 ) * 1.8;
					break;
			}

			// Apply rotation: Base + Mouse lag + Animation + Manual User Angle Offset
			const finalRotX = CurrentRotation[ 0 ] + animRotX + params.angleX;
			const finalRotY = CurrentRotation[ 1 ] + animRotY + params.angleY;
			const finalRotZ = animRotZ;
			CameraRig.setAttribute( 'rotation', `${finalRotX} ${finalRotY} ${finalRotZ}` );

			// Apply position: Base (0, 192, -640) + Animation + Manual Pan Offset
			const finalPosX = 0 + animPosX + params.panX;
			const finalPosY = 192 + animPosY + params.panY;
			const finalPosZ = -640;
			CameraRig.setAttribute( 'position', `${finalPosX} ${finalPosY} ${finalPosZ}` );

			// Zoom along camera view axis (Base is 640): stays at user zoom level during animations
			const finalCamZ = 640 - params.zoom;
			MainCamera.setAttribute( 'position', `0 0 ${finalCamZ}` );
		}

		/* ANIMATION LOOP */
		let lastTimestamp = performance.now();
		let animElapsed = 0;

		function AnimationFrame(timestamp) {
			requestAnimationFrame( AnimationFrame );
			const delta = ( timestamp - lastTimestamp ) * 0.001;
			lastTimestamp = timestamp;

			animElapsed += delta * (params.animSpeed || 1.0);

			UpdateSunCanvas();
			UpdateCameraRig( animElapsed );
		}
		requestAnimationFrame( AnimationFrame );

		/* USER INTERACTIVITY: ZOOM & DRAG */
		let isDragging = false;
		let dragButton = 0;
		let prevMousePos = { x: 0, y: 0 };
		let pointerStartPos = { x: 0, y: 0 };

		window.addEventListener( 'mousemove', event => {
			OffsetX = ( -0.5 + ( event.clientX / window.innerWidth ) ) * 2;
			OffsetY = ( -0.5 + ( event.clientY / window.innerHeight ) ) * 1;

			if( !isDragging ) return;

			const dx = event.clientX - prevMousePos.x;
			const dy = event.clientY - prevMousePos.y;
			prevMousePos.x = event.clientX;
			prevMousePos.y = event.clientY;

			const isPan = dragButton === 2 || dragButton === 1 || event.shiftKey || params.dragMode === 'Pan Scene (Drag Object)';

			if( isPan ) {
				params.panX += dx * 0.8;
				params.panY -= dy * 0.8;
				guiControllers.panX.updateDisplay();
				guiControllers.panY.updateDisplay();
			} else {
				params.angleY -= dx * 0.25;
				params.angleX += dy * 0.2;
				params.angleX = Math.max( -45, Math.min( 45, params.angleX ) );
				guiControllers.angleX.updateDisplay();
				guiControllers.angleY.updateDisplay();
			}
		} );

		window.addEventListener( 'mousedown', event => {
			if( event.target.closest( '.lil-gui' ) ) return;
			isDragging = true;
			dragButton = event.button;
			prevMousePos.x = event.clientX;
			prevMousePos.y = event.clientY;
			pointerStartPos.x = event.clientX;
			pointerStartPos.y = event.clientY;
		} );

		window.addEventListener( 'mouseup', event => {
			if( isDragging ) {
				isDragging = false;
				if( !event.target.closest( '.lil-gui' ) ) {
					const dist = Math.hypot( event.clientX - pointerStartPos.x, event.clientY - pointerStartPos.y );
					if( dist < 5 && event.button === 0 && params.randomizeOnClick ) {
						generateRandomVariation();
					}
				}
			}
		} );

		window.addEventListener( 'contextmenu', event => {
			if( !event.target.closest( '.lil-gui' ) ) {
				event.preventDefault();
			}
		} );

		window.addEventListener( 'wheel', event => {
			if( event.target.closest( '.lil-gui' ) ) return;
			event.preventDefault();
			params.zoom += -event.deltaY * 0.3;
			params.zoom = Math.max( -300, Math.min( 450, params.zoom ) );
			guiControllers.zoom.updateDisplay();
		}, { passive: false } );

		/* LIL-GUI SETUP */
		const gui = new GUI({ title: 'Vaporwave Studio' });
		const guiControllers = {};

		// Folder: Scene & Environment
		const fScene = gui.addFolder( 'Scene & Environment' );
		guiControllers.greenscreen = fScene.add( params, 'greenscreen' ).name( 'Greenscreen' ).onChange( updateGreenscreen );
		guiControllers.greenscreenColor = fScene.addColor( params, 'greenscreenColor' ).name( 'Green Color' ).onChange( updateGreenscreen );
		guiControllers.antialias = fScene.add( params, 'antialias' ).name( 'Antialias' ).onChange( updateAntialias );
		guiControllers.dpr = fScene.add( params, 'dpr', 0.5, 3.0, 0.1 ).name( 'Pixel Ratio (DPR)' ).onChange( updateDPR );
		guiControllers.animSpeed = fScene.add( params, 'animSpeed', 0.1, 4.0, 0.05 ).name( 'Animation Speed' );
		guiControllers.randomizeOnClick = fScene.add( params, 'randomizeOnClick' ).name( 'Click Scene Randomize' );
		fScene.add( { randomize: () => generateRandomVariation() }, 'randomize' ).name( 'Randomize Scene Now' );

		// Folder: Color Schemes & Palette
		const fColor = gui.addFolder( 'Color Schemes & Palette' );
		guiControllers.colorScheme = fColor.add( params, 'colorScheme', Object.keys( COLOR_SCHEMES ) ).name( 'Color Scheme' ).onChange( v => applyColorScheme( v ) );
		guiControllers.invertAchromatic = fColor.add( params, 'invertAchromatic' ).name( 'Invert Achromatic (W&B)' ).onChange( () => applyColorScheme( params.colorScheme ) );
		guiControllers.gridColor1 = fColor.addColor( params, 'gridColor1' ).name( 'Grid Line 1' ).onChange( InitGridCanvas );
		guiControllers.gridColor2 = fColor.addColor( params, 'gridColor2' ).name( 'Grid Line 2' ).onChange( InitGridCanvas );
		guiControllers.gridFloorColor = fColor.addColor( params, 'gridFloorColor' ).name( 'Grid Floor / Tile' ).onChange( InitGridCanvas );
		guiControllers.sunLineColor = fColor.addColor( params, 'sunLineColor' ).name( 'Sun Stripes' );
		guiControllers.sunBgColor = fColor.addColor( params, 'sunBgColor' ).name( 'Sun Background' );
		guiControllers.fogColor = fColor.addColor( params, 'fogColor' ).name( 'Fog & Horizon' ).onChange( () => {
			InitSkyCanvas();
			updateGreenscreen();
		} );
		guiControllers.trunkColor = fColor.addColor( params, 'trunkColor' ).name( 'Trunk Color' ).onChange( updateTreeMaterials );
		guiControllers.leafColor = fColor.addColor( params, 'leafColor' ).name( 'Leaf Color' ).onChange( updateTreeMaterials );
		guiControllers.treeWireframe = fColor.add( params, 'treeWireframe' ).name( 'Tree Wireframe' ).onChange( updateTreeMaterials );
		guiControllers.displacementScale = fColor.add( params, 'displacementScale', 10, 120, 1 ).name( 'Terrain Height' ).onChange( v => {
			document.querySelectorAll( '.grid-plane' ).forEach( p => p.setAttribute( 'material', 'displacementScale', v ) );
		} );

		// Folder: Camera & Animations
		const fCamera = gui.addFolder( 'Camera & Animations' );
		guiControllers.activeAnimation = fCamera.add( params, 'activeAnimation', ANIMATIONS ).name( 'Camera Animation' );
		guiControllers.dragMode = fCamera.add( params, 'dragMode', [ 'Orbit Angle (Rotate)', 'Pan Scene (Drag Object)' ] ).name( 'Drag Mode' );
		guiControllers.zoom = fCamera.add( params, 'zoom', -300, 450, 1 ).name( 'Zoom' );
		guiControllers.panX = fCamera.add( params, 'panX', -500, 500, 1 ).name( 'Pan X' );
		guiControllers.panY = fCamera.add( params, 'panY', -300, 300, 1 ).name( 'Pan Y' );
		guiControllers.angleX = fCamera.add( params, 'angleX', -45, 45, 0.5 ).name( 'Angle Pitch' );
		guiControllers.angleY = fCamera.add( params, 'angleY', -90, 90, 0.5 ).name( 'Angle Yaw' );
		fCamera.add( { resetView: () => {
			params.zoom = 0;
			params.panX = 0;
			params.panY = 0;
			params.angleX = 0;
			params.angleY = 0;
			guiControllers.zoom.updateDisplay();
			guiControllers.panX.updateDisplay();
			guiControllers.panY.updateDisplay();
			guiControllers.angleX.updateDisplay();
			guiControllers.angleY.updateDisplay();
		} }, 'resetView' ).name( 'Reset Camera View' );

		// Folder: Lighting & Exposure
		const fLight = gui.addFolder( 'Lighting & Exposure' );
		guiControllers.exposure = fLight.add( params, 'exposure', 0.1, 3.0, 0.05 ).name( 'Exposure' ).onChange( updateLights );
		guiControllers.masterLightIntensity = fLight.add( params, 'masterLightIntensity', 0.0, 5.0, 0.1 ).name( 'Master Intensity' ).onChange( updateLights );
		guiControllers.pointLightEnabled = fLight.add( params, 'pointLightEnabled' ).name( 'Point Light On' ).onChange( updateLights );
		guiControllers.pointLightIntensity = fLight.add( params, 'pointLightIntensity', 0.0, 10.0, 0.1 ).name( 'Point Intensity' ).onChange( updateLights );
		guiControllers.pointLightColor = fLight.addColor( params, 'pointLightColor' ).name( 'Point Color' ).onChange( updateLights );
		guiControllers.pointLightDistance = fLight.add( params, 'pointLightDistance', 100, 2000, 10 ).name( 'Point Distance' ).onChange( updateLights );
		guiControllers.hemiLightEnabled = fLight.add( params, 'hemiLightEnabled' ).name( 'Hemi Light On' ).onChange( updateLights );
		guiControllers.hemiLightIntensity = fLight.add( params, 'hemiLightIntensity', 0.0, 10.0, 0.1 ).name( 'Hemi Intensity' ).onChange( updateLights );
		guiControllers.hemiSkyColor = fLight.addColor( params, 'hemiSkyColor' ).name( 'Hemi Sky Color' ).onChange( updateLights );
		guiControllers.hemiGroundColor = fLight.addColor( params, 'hemiGroundColor' ).name( 'Hemi Ground Color' ).onChange( updateLights );

		function syncGUI() {
			for( const key in guiControllers ) {
				if( guiControllers[ key ] && typeof guiControllers[ key ].updateDisplay === 'function' ) {
					guiControllers[ key ].updateDisplay();
				}
			}
		}

		/* KEYBOARD SHORTCUT: TOGGLE UI VISIBILITY WITH "H" KEY */
		window.addEventListener( 'keydown', event => {
			if( event.key === 'h' || event.key === 'H' ) {
				if( gui ) {
					gui._hidden ? gui.show() : gui.hide();
				}
			}
		} );

		// Scene initialization after load
		const sceneEl = document.querySelector( 'a-scene' );
		if (sceneEl.hasLoaded) {
			updateLights();
			updateDPR();
			updateAntialias();
			updateTreeMaterials();
		} else {
			sceneEl.addEventListener( 'loaded', () => {
				updateLights();
				updateDPR();
				updateAntialias();
				updateTreeMaterials();
			} );
		}
	</script>
</body>
</html>
