            }
        ];

        // --- Helper: Point in Polygon & GUI Update ---
        function isPointInPolygon(px, py, vs) {
            let inside = false;
            for (let i = 0, j = vs.length - 1; i < vs.length; j = i++) {
                const xi = vs[i].x, yi = vs[i].y;
                const xj = vs[j].x, yj = vs[j].y;
                const intersect = ((yi > py) !== (yj > py)) && (px < (xj - xi) * (py - yi) / (yj - yi) + xi);
                if (intersect) inside = !inside;
            }
            return inside;
        }

        function updateAllControllers(targetGUI = gui) {
            if (!targetGUI) return;
            if (targetGUI.controllers) {
                targetGUI.controllers.forEach(c => c.updateDisplay());
            }
            if (targetGUI.folders) {
                targetGUI.folders.forEach(f => updateAllControllers(f));
            }
        }

        // --- 3D Heart Geometry Creation ---
        function createHeartGeometry(scale = 1.0) {
            const shape = new THREE.Shape();
            shape.moveTo(0, 0.45 * scale);
            shape.bezierCurveTo(-0.18 * scale, 0.88 * scale, -0.85 * scale, 1.25 * scale, -1.38 * scale, 1.25 * scale);
            shape.bezierCurveTo(-2.15 * scale, 1.25 * scale, -2.5 * scale, 0.65 * scale, -2.5 * scale, -0.1 * scale);
            shape.bezierCurveTo(-2.5 * scale, -1.05 * scale, -1.55 * scale, -1.9 * scale, 0, -2.75 * scale);
            shape.bezierCurveTo(1.55 * scale, -1.9 * scale, 2.5 * scale, -1.05 * scale, 2.5 * scale, -0.1 * scale);
            shape.bezierCurveTo(2.5 * scale, 0.65 * scale, 2.15 * scale, 1.25 * scale, 1.38 * scale, 1.25 * scale);
            shape.bezierCurveTo(0.85 * scale, 1.25 * scale, 0.18 * scale, 0.88 * scale, 0, 0.45 * scale);

            const extrudeSettings = {
                depth: 0.38 * scale,
                bevelEnabled: true,
                bevelSegments: 26,
                steps: 2,
                bevelSize: 0.52 * scale,
                bevelThickness: 0.52 * scale,
                curveSegments: 48
            };

            const geom = new THREE.ExtrudeGeometry(shape, extrudeSettings);
            geom.center();

            const pos = geom.attributes.position;
            for (let i = 0; i < pos.count; i++) {
                let x = pos.getX(i);
                let y = pos.getY(i);
                let z = pos.getZ(i);

                let dist = Math.sqrt(x * x * 0.5 + y * y * 0.5);
                let puff = Math.cos(Math.min(Math.PI * 0.5, (dist / scale) * 0.68));
                z *= 1.0 + 0.42 * Math.max(0, puff);
                pos.setZ(i, z);
            }
            geom.computeVertexNormals();
            return { geometry: geom, shape: shape };
        }

        // --- Interior Bubbles Inside Hearts ---
        function createInteriorBubbles(heartShape, count) {
            const bubbleGroup = new THREE.Group();
            const bubbleGeom = new THREE.SphereGeometry(1, 14, 14);
            const bubbleMat = new THREE.MeshPhysicalMaterial({
                color: 0xffffff,
                transmission: 0.96,
                transparent: true,
                opacity: 0.88,
                roughness: 0.04,
                ior: 1.2,
                thickness: 0.35,
                emissive: new THREE.Color(settings.innerGlowColor),
                emissiveIntensity: 0.4,
                clearcoat: 1.0
            });

            const shapePoints = heartShape.getPoints(50);
            let placed = 0;
            let attempts = 0;
            while (placed < count && attempts < 2500) {
                attempts++;
                let px = (Math.random() - 0.5) * 4.2;
                let py = -2.5 + Math.random() * 3.6;
                let pz = (Math.random() - 0.5) * 0.75;

                if (isPointInPolygon(px, py, shapePoints)) {
                    const radius = 0.02 + Math.random() * 0.055;
                    const mesh = new THREE.Mesh(bubbleGeom, bubbleMat);
                    mesh.position.set(px, py, pz);
                    mesh.scale.setScalar(radius);
                    mesh.userData = {
                        origin: new THREE.Vector3(px, py, pz),
                        phase: Math.random() * Math.PI * 2,
                        speed: 0.6 + Math.random() * 1.8,
                        amp: 0.025 + Math.random() * 0.045
                    };
                    bubbleGroup.add(mesh);
                    placed++;
                }
            }
            return bubbleGroup;
        }

        // --- Smoky Veins Inside Heart ---
        function createSmokyVeins() {
            const veinGroup = new THREE.Group();
            for (let v = 0; v < 3; v++) {
                const points = [];
                const ptCount = 8;
                const offsetPhase = (v / 3) * Math.PI * 2;

                for (let j = 0; j < ptCount; j++) {
                    const t = j / (ptCount - 1);
                    const x = Math.sin(t * Math.PI * 2 + offsetPhase) * (0.55 + v * 0.15);
                    const y = (t - 0.5) * 2.1;
                    const z = Math.cos(t * Math.PI * 3 + offsetPhase * 1.5) * (0.2 + v * 0.08);
                    points.push(new THREE.Vector3(x, y, z));
                }

                const curve = new THREE.CatmullRomCurve3(points);
                const tubeGeom = new THREE.TubeGeometry(curve, 36, 0.038, 8, false);
                const tubeMat = new THREE.MeshStandardMaterial({
                    color: new THREE.Color(settings.innerGlowColor),
                    transparent: true,
                    opacity: 0.38,
                    blending: THREE.AdditiveBlending,
                    roughness: 0.35,
                    metalness: 0.1
                });

                const tubeMesh = new THREE.Mesh(tubeGeom, tubeMat);
                tubeMesh.userData = { phase: offsetPhase };
                veinGroup.add(tubeMesh);
            }
            return veinGroup;
        }

        // --- Procedural Circular Glow Particle Texture ---
        let roundGlowTexture = null;
        function getRoundGlowTexture() {
            if (roundGlowTexture) return roundGlowTexture;
            const c = document.createElement('canvas');
            c.width = 128;
            c.height = 128;
            const ctx = c.getContext('2d');
            const center = 64;

            const grad = ctx.createRadialGradient(center, center, 0, center, center, center);
            grad.addColorStop(0.0, 'rgba(255, 255, 255, 1.0)');     // Pure brilliant white center
            grad.addColorStop(0.2, 'rgba(255, 255, 255, 0.92)');    // Round bright core
            grad.addColorStop(0.45, 'rgba(255, 225, 240, 0.55)');   // Luminous soft halo
            grad.addColorStop(0.75, 'rgba(255, 180, 220, 0.16)');   // Fading aura
            grad.addColorStop(1.0, 'rgba(255, 180, 220, 0.0)');     // Transparent edge

            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 128, 128);

            roundGlowTexture = new THREE.CanvasTexture(c);
            roundGlowTexture.wrapS = THREE.ClampToEdgeWrapping;
            roundGlowTexture.wrapT = THREE.ClampToEdgeWrapping;
            roundGlowTexture.needsUpdate = true;
            return roundGlowTexture;
        }

        // --- Perimeter Edge Glints (Round Glowing Specks) ---
        function createEdgeGlints(heartShape, count = 26) {
            const glintsGroup = new THREE.Group();
            const glintGeom = new THREE.BufferGeometry();
            const positions = [];
            const phases = [];

            const sampledPoints = heartShape.getSpacedPoints(count);
            for (let i = 0; i < sampledPoints.length; i++) {
                const pt = sampledPoints[i];
                const z = (Math.random() - 0.5) * 0.7;
                const jitter = 1.02 + (Math.random() - 0.5) * 0.04;
                positions.push(pt.x * jitter, pt.y * jitter, z);
                phases.push(Math.random() * Math.PI * 2);
            }

            glintGeom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            glintGeom.setAttribute('aPhase', new THREE.Float32BufferAttribute(phases, 1));

            const glintShaderMat = new THREE.ShaderMaterial({
                uniforms: {
                    glowTexture: { value: getRoundGlowTexture() },
                    time: { value: 0 },
                    color: { value: new THREE.Color(0xffffff) }
                },
                vertexShader: `
                    attribute float aPhase;
                    uniform float time;
                    varying float vAlpha;
                    void main() {
                        float s = sin(time * 2.2 + aPhase);
                        // Occasional delicate flash rather than constant dotted ring
                        vAlpha = pow(clamp(s, 0.0, 1.0), 4.5);
                        vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
                        gl_PointSize = (40.0 / -mvPos.z) * (0.8 + vAlpha * 0.7);
                        gl_Position = projectionMatrix * mvPos;
                    }
                `,
                fragmentShader: `
                    uniform sampler2D glowTexture;
                    uniform vec3 color;
                    varying float vAlpha;
                    void main() {
                        if (vAlpha <= 0.01) discard;
                        vec4 tex = texture2D(glowTexture, gl_PointCoord);
                        gl_FragColor = vec4(color * tex.rgb, tex.a * vAlpha);
                    }
                `,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            const pointsMesh = new THREE.Points(glintGeom, glintShaderMat);
            glintsGroup.add(pointsMesh);
            return glintsGroup;
        }

        // --- Floating Zero-G Heart Particles System ---
        function createFloatingHeartParticles(count = 55) {
            const { geometry: miniGeom } = createHeartGeometry(0.18);
            const miniMat = new THREE.MeshPhysicalMaterial({
                color: new THREE.Color(settings.heartColor),
                transmission: 0.92,
                transparent: true,
                opacity: 0.88,
                roughness: 0.1,
                ior: 1.4,
                thickness: 0.5,
                emissive: new THREE.Color(settings.innerGlowColor),
                emissiveIntensity: 0.45,
                clearcoat: 1.0
            });

            miniHeartInstancedMesh = new THREE.InstancedMesh(miniGeom, miniMat, count);
            miniHeartData = [];

            const dummy = new THREE.Object3D();
            for (let i = 0; i < count; i++) {
                const pos = new THREE.Vector3(
                    (Math.random() - 0.5) * 9.5 - 0.5,
                    (Math.random() - 0.5) * 7.5,
                    (Math.random() - 0.5) * 6.0
                );
                const rot = new THREE.Euler(
                    Math.random() * Math.PI * 2,
                    Math.random() * Math.PI * 2,
                    Math.random() * Math.PI * 2
                );
                const rotSpeed = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.8,
                    (Math.random() - 0.5) * 0.8,
                    (Math.random() - 0.5) * 0.8
                );
                const scaleVal = 0.4 + Math.random() * 0.75;
                dummy.position.copy(pos);
                dummy.rotation.copy(rot);
                dummy.scale.setScalar(scaleVal);
                dummy.updateMatrix();
                miniHeartInstancedMesh.setMatrixAt(i, dummy.matrix);

                miniHeartData.push({
                    basePos: pos.clone(),
                    rot: rot,
                    rotSpeed: rotSpeed,
                    scale: scaleVal,
                    phase: Math.random() * Math.PI * 2,
                    driftSpeed: 0.3 + Math.random() * 0.7
                });
            }

            miniHeartInstancedMesh.instanceMatrix.needsUpdate = true;
            scene.add(miniHeartInstancedMesh);
        }

        // --- Ambient Zero-G Cosmic Dust Particles (Round Glowing Orbs) ---
        function createCosmicDust(count = 140) {
            const dustGeom = new THREE.BufferGeometry();
            const positions = [];
            for (let i = 0; i < count; i++) {
                positions.push(
                    (Math.random() - 0.5) * 14.0,
                    (Math.random() - 0.5) * 10.0,
                    (Math.random() - 0.5) * 8.0
                );
            }
            dustGeom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            const dustMat = new THREE.PointsMaterial({
                map: getRoundGlowTexture(),
                color: 0xffffff,
                size: 0.24,
                transparent: true,
                opacity: 0.75,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                sizeAttenuation: true
            });
            cosmicDustPoints = new THREE.Points(dustGeom, dustMat);
            scene.add(cosmicDustPoints);
        }

        // --- Background Shader Material (Gradient + GreenScreen) ---
        function createBackgroundMaterial() {
            return new THREE.ShaderMaterial({
                uniforms: {
                    colorTop: { value: new THREE.Color(settings.bgTop) },
                    colorBottom: { value: new THREE.Color(settings.bgBottom) },
                    isGreenScreen: { value: settings.greenScreen }
                },
                vertexShader: `
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        gl_Position = vec4(position.xy, 0.9999, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform vec3 colorTop;
                    uniform vec3 colorBottom;
                    uniform bool isGreenScreen;
                    varying vec2 vUv;
                    void main() {
                        if (isGreenScreen) {
                            gl_FragColor = vec4(0.0, 1.0, 0.0, 1.0);
                        } else {
                            float diagonal = clamp(vUv.y * 0.72 + (1.0 - vUv.x) * 0.28, 0.0, 1.0);
                            vec3 color = mix(colorBottom, colorTop, diagonal);
                            gl_FragColor = vec4(color, 1.0);
                        }
                    }
                `,
                depthWrite: false,
                depthTest: false
            });
        }

        // --- Dynamic Soft Studio Environment Map Generator ---
        function createStudioEnvironment(rend) {
            const pmrem = new THREE.PMREMGenerator(rend);
            pmrem.compileEquirectangularShader();

            const envScene = new THREE.Scene();
            const geom = new THREE.SphereGeometry(50, 32, 16);
            const mat = new THREE.ShaderMaterial({
                side: THREE.BackSide,
                vertexShader: `
                    varying vec3 vWorldPosition;
                    void main() {
                        vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                        vWorldPosition = worldPosition.xyz;
                        gl_Position = projectionMatrix * viewMatrix * worldPosition;
                    }
                `,
                fragmentShader: `
                    varying vec3 vWorldPosition;
                    void main() {
                        vec3 dir = normalize(vWorldPosition);
                        float top = clamp(dir.y * 0.5 + 0.5, 0.0, 1.0);
                        float keyLight = max(0.0, dot(dir, normalize(vec3(-0.7, 0.8, 0.6))));
                        vec3 col = mix(vec3(0.18, 0.06, 0.14), vec3(0.88, 0.78, 0.84), top);
                        col += vec3(1.0, 0.96, 0.92) * pow(keyLight, 8.0) * 2.8;
                        gl_FragColor = vec4(col, 1.0);
                    }
                `
            });
            envScene.add(new THREE.Mesh(geom, mat));
            const envTarget = pmrem.fromScene(envScene);
            pmrem.dispose();
            return envTarget.texture;
        }

        // --- Scene Initialization ---
        function initScene() {
            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0.65, 0.15, settings.userZoomDistance);

            renderer = new THREE.WebGLRenderer({
                canvas: canvas,
                antialias: settings.antialias,
                powerPreference: "high-performance"
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(settings.dpr);
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = settings.exposure;

            // Generate and assign soft studio environment map for jelly refraction
            scene.environment = createStudioEnvironment(renderer);

            // Background Quad
            const bgGeom = new THREE.PlaneGeometry(2, 2);
            bgMaterial = createBackgroundMaterial();
            bgMesh = new THREE.Mesh(bgGeom, bgMaterial);
            bgMesh.frustumCulled = false;
            scene.add(bgMesh);

            // Large soft light source from top-left giving long smooth reflections
            keyLight = new THREE.DirectionalLight(settings.keyLightColor, settings.keyLightIntensity);
            keyLight.position.set(-8.0, 10.0, 7.5);
            scene.add(keyLight);

            // Fill light from bottom right
            fillLight = new THREE.DirectionalLight(settings.fillLightColor, settings.fillLightIntensity);
            fillLight.position.set(7.0, -6.0, -3.0);
            scene.add(fillLight);

            // Ambient Light
            ambientLight = new THREE.AmbientLight(0xffffff, settings.ambientLightIntensity);
            scene.add(ambientLight);

            // Build Jelly Hearts
            const { geometry, shape } = createHeartGeometry(1.0);

            initialHeartConfigs.forEach((config, idx) => {
                const heartGroup = new THREE.Group();
                heartGroup.position.copy(config.pos);
                heartGroup.scale.setScalar(config.scale);

                const jellyMat = new THREE.MeshPhysicalMaterial({
                    color: new THREE.Color(settings.heartColor),
                    transmission: settings.transmission,
                    opacity: 1.0,
                    transparent: true,
                    roughness: Math.min(1.0, settings.roughness + config.roughnessBoost),
                    ior: settings.ior,
                    thickness: settings.thickness,
                    attenuationColor: new THREE.Color(settings.heartColor),
                    attenuationDistance: 1.35,
                    specularIntensity: 1.25,
                    specularColor: 0xffffff,
                    clearcoat: 1.0,
                    clearcoatRoughness: 0.05,
                    sheen: 0.75,
                    sheenColor: new THREE.Color(settings.innerGlowColor),
                    emissive: new THREE.Color(settings.innerGlowColor),
                    emissiveIntensity: 0.35
                });

                const mainMesh = new THREE.Mesh(geometry, jellyMat);
                heartGroup.add(mainMesh);

                const innerLight = new THREE.PointLight(
                    settings.innerGlowColor,
                    settings.innerGlowIntensity,
                    5.5,
                    1.8
                );
                innerLight.position.set(0, -0.3, 0);
                heartGroup.add(innerLight);

                const bubbles = createInteriorBubbles(shape, 40 + idx * 10);
                heartGroup.add(bubbles);

                const veins = createSmokyVeins();
                heartGroup.add(veins);

                const glints = createEdgeGlints(shape, 35);
                heartGroup.add(glints);

                heartGroup.userData = {
                    id: idx,
                    mainMesh: mainMesh,
                    innerLight: innerLight,
                    bubbles: bubbles,
                    veins: veins,
                    glints: glints,
                    basePos: config.pos.clone(),
                    rotSpeed: config.rotSpeed.clone(),
                    phase: idx * 2.15
                };

                scene.add(heartGroup);
                heartObjects.push(heartGroup);
            });

            // Create Floating Particles
            createFloatingHeartParticles(50);
            createCosmicDust(130);

            // Initialize PostProcessor
            postProcessor = new PostProcessor(renderer, {
                enabled: true,
                antialias: settings.antialias,
                bloomEnabled: true,
                bloomStrength: 0.95,
                bloomRadius: 0.65,
                bloomThreshold: 0.22,
                anamorphicEnabled: false, // Default OFF as requested
                chromaticAberration: 0.008,
                vignetteBoost: 1.05,
                vignetteReduction: 0.45,
                noiseIntensity: 0.006,
                exposure: 1.0
            });
            postProcessor.setSize(window.innerWidth, window.innerHeight, settings.dpr);
        }

        // --- Apply Color Scheme ---
        function applyColorScheme(schemeKey, animate = true) {
            const pal = COLOR_SCHEMES[schemeKey];
            if (!pal) return;

            settings.scheme = schemeKey;
            settings.bgTop = pal.bgTop;
            settings.bgBottom = pal.bgBottom;
            settings.heartColor = pal.heartColor;
            settings.innerGlowColor = pal.innerGlow || pal.innerGlowColor || '#FF1493';
            settings.keyLightColor = pal.keyLight;
            settings.fillLightColor = pal.fillLight;

            const glow = pal.innerGlow || pal.innerGlowColor || '#FF1493';

            if (animate) {
                const dummy = { t: 0 };
                const startBgTop = bgMaterial.uniforms.colorTop.value.clone();
                const startBgBottom = bgMaterial.uniforms.colorBottom.value.clone();
                const targetBgTop = new THREE.Color(pal.bgTop);
                const targetBgBottom = new THREE.Color(pal.bgBottom);

                const startHeartCol = heartObjects[0].userData.mainMesh.material.color.clone();
                const targetHeartCol = new THREE.Color(pal.heartColor);
                const targetInnerGlow = new THREE.Color(glow);
                const targetKey = new THREE.Color(pal.keyLight);
                const targetFill = new THREE.Color(pal.fillLight);

                gsap.to(dummy, {
                    t: 1,
                    duration: 0.9,
                    ease: "power2.out",
                    onUpdate: () => {
                        bgMaterial.uniforms.colorTop.value.lerpColors(startBgTop, targetBgTop, dummy.t);
                        bgMaterial.uniforms.colorBottom.value.lerpColors(startBgBottom, targetBgBottom, dummy.t);
                        keyLight.color.lerp(targetKey, dummy.t);
                        fillLight.color.lerp(targetFill, dummy.t);

                        heartObjects.forEach(h => {
                            const mat = h.userData.mainMesh.material;
                            mat.color.lerpColors(startHeartCol, targetHeartCol, dummy.t);
                            mat.attenuationColor.copy(mat.color);
                            mat.emissive.lerp(targetInnerGlow, dummy.t);
                            mat.sheenColor.lerp(targetInnerGlow, dummy.t);
                            h.userData.innerLight.color.lerp(targetInnerGlow, dummy.t);

                            h.userData.bubbles.children.forEach(b => b.material.emissive.lerp(targetInnerGlow, dummy.t));
                            h.userData.veins.children.forEach(v => v.material.color.lerp(targetInnerGlow, dummy.t));
                        });

                        if (miniHeartInstancedMesh) {
                            miniHeartInstancedMesh.material.color.lerpColors(startHeartCol, targetHeartCol, dummy.t);
                            miniHeartInstancedMesh.material.emissive.lerp(targetInnerGlow, dummy.t);
                        }
                    }
                });
            } else {
                bgMaterial.uniforms.colorTop.value.set(pal.bgTop);
                bgMaterial.uniforms.colorBottom.value.set(pal.bgBottom);
                keyLight.color.set(pal.keyLight);
                fillLight.color.set(pal.fillLight);

                heartObjects.forEach(h => {
                    const mat = h.userData.mainMesh.material;
                    mat.color.set(pal.heartColor);
                    mat.attenuationColor.set(pal.heartColor);
                    mat.emissive.set(glow);
                    mat.sheenColor.set(glow);
                    h.userData.innerLight.color.set(glow);

                    h.userData.bubbles.children.forEach(b => b.material.emissive.set(glow));
                    h.userData.veins.children.forEach(v => v.material.color.set(glow));
                });

                if (miniHeartInstancedMesh) {
                    miniHeartInstancedMesh.material.color.set(pal.heartColor);
                    miniHeartInstancedMesh.material.emissive.set(glow);
                }
            }

            if (gui) updateAllControllers(gui);
        }

        // --- Reset Camera & Objects ---
        function resetCameraAndObjects() {
            gsap.to(settings, {
                userZoomDistance: 10.0,
                userOrbitYaw: 0.0,
                userOrbitPitch: 0.0,
                userPanX: 0.0,
                userPanY: 0.0,
                duration: 0.8,
                ease: "power2.out",
                onUpdate: () => {
                    if (gui) updateAllControllers(gui);
                }
            });

            heartObjects.forEach((h, idx) => {
                const conf = initialHeartConfigs[idx];
                gsap.to(h.position, {
                    x: conf.pos.x,
                    y: conf.pos.y,
                    z: conf.pos.z,
                    duration: 0.8,
                    ease: "power2.out"
                });
                h.userData.basePos.copy(conf.pos);
            });
        }

        // --- Procedural Scene Randomization on Click ---
        // IMPORTANT: Do NOT shuffle or change Postprocessing settings!
        function randomizeProceduralScene() {
            const schemeKeys = Object.keys(COLOR_SCHEMES);
            const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
            applyColorScheme(randomScheme, true);

            settings.animSpeed = Number((0.6 + Math.random() * 0.9).toFixed(2));
            settings.floatIntensity = Number((0.7 + Math.random() * 0.8).toFixed(2));
            settings.transmission = Number((0.9 + Math.random() * 0.08).toFixed(2));
            settings.roughness = Number((0.04 + Math.random() * 0.12).toFixed(2));
            settings.ior = Number((1.35 + Math.random() * 0.18).toFixed(2));

            heartObjects.forEach((h, i) => {
                h.userData.rotSpeed.x = (Math.random() - 0.5) * 0.7;
                h.userData.rotSpeed.y = (Math.random() - 0.5) * 0.8;
                h.userData.rotSpeed.z = (Math.random() - 0.5) * 0.5;

                gsap.fromTo(h.scale, 
                    { x: initialHeartConfigs[i].scale * 1.25, y: initialHeartConfigs[i].scale * 1.25, z: initialHeartConfigs[i].scale * 1.25 },
                    { x: initialHeartConfigs[i].scale, y: initialHeartConfigs[i].scale, z: initialHeartConfigs[i].scale, duration: 1.0, ease: "elastic.out(1, 0.45)" }
                );
            });

            if (gui) updateAllControllers(gui);
        }

        // --- Pointer & Touch Interactions ---
        function setupInteractionListeners() {
            window.addEventListener('pointerdown', (e) => {
                if (e.target.closest('.lil-gui')) return;

                isPointerDown = true;
                pointerDownPos.x = e.clientX;
                pointerDownPos.y = e.clientY;
                lastPointerPos.x = e.clientX;
                lastPointerPos.y = e.clientY;

                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const hitMeshes = heartObjects.map(h => h.userData.mainMesh);
                const intersects = raycaster.intersectObjects(hitMeshes, false);

                if (intersects.length > 0) {
                    isDraggingHeart = true;
                    draggedHeart = intersects[0].object.parent;

                    const camDir = new THREE.Vector3();
                    camera.getWorldDirection(camDir);
                    dragPlane.setFromNormalAndCoplanarPoint(camDir.negate(), draggedHeart.position);

                    if (raycaster.ray.intersectPlane(dragPlane, planeIntersect)) {
                        dragOffset.copy(draggedHeart.position).sub(planeIntersect);
                    }
                } else {
                    isDraggingHeart = false;
                    draggedHeart = null;
                }
            });

            window.addEventListener('pointermove', (e) => {
                if (!isPointerDown) return;
                const dx = e.clientX - lastPointerPos.x;
                const dy = e.clientY - lastPointerPos.y;
                lastPointerPos.x = e.clientX;
                lastPointerPos.y = e.clientY;

                if (isDraggingHeart && draggedHeart) {
                    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                    raycaster.setFromCamera(mouse, camera);

                    if (raycaster.ray.intersectPlane(dragPlane, planeIntersect)) {
                        draggedHeart.position.copy(planeIntersect.add(dragOffset));
                        draggedHeart.userData.basePos.copy(draggedHeart.position);
                    }
                } else {
                    if (e.buttons === 2 || e.buttons === 4 || e.shiftKey) {
                        const panSpeed = 0.0055 * (settings.userZoomDistance / 10.0);
                        settings.userPanX -= dx * panSpeed;
                        settings.userPanY += dy * panSpeed;
                    } else {
                        const orbitSpeed = 0.005;
                        settings.userOrbitYaw += dx * orbitSpeed;
                        settings.userOrbitPitch = Math.max(-1.3, Math.min(1.3, settings.userOrbitPitch + dy * orbitSpeed));
                    }
                    if (gui) updateAllControllers(gui);
                }
            });

            window.addEventListener('pointerup', (e) => {
                if (!isPointerDown) return;
                const distMoved = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);

                if (distMoved < 6 && !isDraggingHeart && settings.clickToRandomize && !e.target.closest('.lil-gui')) {
                    randomizeProceduralScene();
                }

                isPointerDown = false;
                isDraggingHeart = false;
                draggedHeart = null;
            });

            window.addEventListener('wheel', (e) => {
                if (e.target.closest('.lil-gui')) return;
                e.preventDefault();
                const zoomFactor = Math.exp(e.deltaY * 0.0012);
                settings.userZoomDistance = Math.max(3.2, Math.min(26.0, settings.userZoomDistance * zoomFactor));
                if (gui) updateAllControllers(gui);
            }, { passive: false });

            window.addEventListener('keydown', (e) => {
                if (e.key === 'h' || e.key === 'H') {
                    if (gui) {
                        const isHidden = (gui._hidden !== undefined) ? gui._hidden : (gui.domElement.style.display === 'none');
                        gui.show(isHidden);
                    }
                }
            });

            window.addEventListener('contextmenu', (e) => {
                if (!e.target.closest('.lil-gui')) e.preventDefault();
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                if (postProcessor) {
                    postProcessor.setSize(window.innerWidth, window.innerHeight, settings.dpr);
                }
            });
        }

        // --- GUI Setup (lil-gui without overriding styles) ---
        function setupGUI() {
            gui = new GUI({ title: 'Гелевые сердца' });

            // Color Schemes & Background
            const fColor = gui.addFolder('Цветовая гамма & Фон');
            fColor.add(settings, 'scheme', Object.keys(COLOR_SCHEMES)).name('Пресет палитры').onChange(v => {
                applyColorScheme(v, true);
            });
            fColor.add(settings, 'greenScreen').name('Green Screen (#00ff00)').onChange(v => {
                bgMaterial.uniforms.isGreenScreen.value = v;
            });
            fColor.addColor(settings, 'bgTop').name('Фон верхний').onChange(v => {
                bgMaterial.uniforms.colorTop.value.set(v);
            }).listen();
            fColor.addColor(settings, 'bgBottom').name('Фон нижний').onChange(v => {
                bgMaterial.uniforms.colorBottom.value.set(v);
            }).listen();
            fColor.addColor(settings, 'heartColor').name('Цвет сердец').onChange(v => {
                heartObjects.forEach(h => {
                    h.userData.mainMesh.material.color.set(v);
                    h.userData.mainMesh.material.attenuationColor.set(v);
                });
                if (miniHeartInstancedMesh) miniHeartInstancedMesh.material.color.set(v);
            }).listen();
            fColor.addColor(settings, 'innerGlowColor').name('Внутреннее свечение').onChange(v => {
                heartObjects.forEach(h => {
                    h.userData.innerLight.color.set(v);
                    h.userData.mainMesh.material.emissive.set(v);
                    h.userData.mainMesh.material.sheenColor.set(v);
                    h.userData.bubbles.children.forEach(b => b.material.emissive.set(v));
                    h.userData.veins.children.forEach(t => t.material.color.set(v));
                });
                if (miniHeartInstancedMesh) miniHeartInstancedMesh.material.emissive.set(v);
            }).listen();

            // Motion & Animation Presets
            const fAnim = gui.addFolder('Анимация & Движение');
            fAnim.add(settings, 'animationPreset', ANIMATION_PRESETS).name('Режим анимации');
            fAnim.add(settings, 'animSpeed', 0.1, 3.0, 0.05).name('Скорость анимации').listen();
            fAnim.add(settings, 'floatIntensity', 0.0, 2.5, 0.05).name('Амплитуда парения').listen();

            // Lighting & Exposure Controls
            const fLight = gui.addFolder('Свет и Экспозиция');
            fLight.add(settings, 'exposure', 0.2, 3.0, 0.05).name('Экспозиция сцены').onChange(v => {
                renderer.toneMappingExposure = v;
            });
            fLight.add(settings, 'keyLightIntensity', 0.0, 5.0, 0.1).name('Главный свет (верх-лево)').onChange(v => {
                keyLight.intensity = v;
            });
            fLight.addColor(settings, 'keyLightColor').name('Цвет главного света').onChange(v => {
                keyLight.color.set(v);
            }).listen();
            fLight.add(settings, 'fillLightIntensity', 0.0, 3.0, 0.1).name('Заполняющий свет').onChange(v => {
                fillLight.intensity = v;
            });
            fLight.addColor(settings, 'fillLightColor').name('Цвет заполняющего').onChange(v => {
                fillLight.color.set(v);
            }).listen();
            fLight.add(settings, 'innerGlowIntensity', 0.0, 5.0, 0.1).name('Яркость свечения внутри').onChange(v => {
                heartObjects.forEach(h => h.userData.innerLight.intensity = v);
            });
            fLight.add(settings, 'ambientLightIntensity', 0.0, 2.0, 0.05).name('Окружающий свет').onChange(v => {
                ambientLight.intensity = v;
            });

            // Jelly Material Parameters
            const fMat = gui.addFolder('Свойства геля');
            fMat.add(settings, 'transmission', 0.0, 1.0, 0.01).name('Прозрачность (Gel)').onChange(v => {
                heartObjects.forEach(h => h.userData.mainMesh.material.transmission = v);
            }).listen();
            fMat.add(settings, 'roughness', 0.0, 1.0, 0.01).name('Шероховатость').onChange(v => {
                heartObjects.forEach((h, i) => {
                    h.userData.mainMesh.material.roughness = Math.min(1.0, v + initialHeartConfigs[i].roughnessBoost);
                });
            }).listen();
            fMat.add(settings, 'ior', 1.0, 2.3, 0.01).name('Преломление (IOR)').onChange(v => {
                heartObjects.forEach(h => h.userData.mainMesh.material.ior = v);
            }).listen();
            fMat.add(settings, 'thickness', 0.2, 5.0, 0.1).name('Толщина объема').onChange(v => {
                heartObjects.forEach(h => h.userData.mainMesh.material.thickness = v);
            });

            // PostProcessor GUI Folder
            postProcessor.attachGUI(gui);

            // Rendering & System Settings
            const fSys = gui.addFolder('Рендеринг и Система');
            fSys.add(settings, 'dpr', 0.5, 3.0, 0.25).name('Pixel Ratio (DPR)').onChange(v => {
                renderer.setPixelRatio(v);
                postProcessor.setSize(window.innerWidth, window.innerHeight, v);
            });
            fSys.add(settings, 'antialias').name('Antialiasing').onChange(v => {
                settings.antialias = v;
                postProcessor.setAntialias(v);
            });
            fSys.add(settings, 'clickToRandomize').name('Клик: процедурная генерация').listen();
            fSys.add(settings, 'resetView').name('Сбросить вид и позицию');

            fColor.open();
            fAnim.open();
        }

        // --- Master Animation Loop ---
        let clock = new THREE.Clock();
        const dummyInstance = new THREE.Object3D();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            const elapsedTime = clock.getElapsedTime();
            const scaledTime = elapsedTime * settings.animSpeed;

            // 1. Dynamic Camera Motion based on 8 Presets
            let animCamDist = 10.0;
            let animYaw = 0.0;
            let animPitch = 0.0;
            let animTargetX = 0.65;
            let animTargetY = 0.15;
            let animTargetZ = 0.0;

            const preset = settings.animationPreset;

            if (preset === 'Weightless Zero-G Drift') {
                animYaw = Math.sin(scaledTime * 0.18) * 0.08;
                animPitch = Math.cos(scaledTime * 0.14) * 0.04;
                animCamDist = 10.0 + Math.sin(scaledTime * 0.22) * 0.35;
            } else if (preset === 'Cosmic Heartbeat & Breathing') {
                const pulse = Math.pow(Math.sin(scaledTime * 1.2), 4) * 0.45;
                animCamDist = 9.8 - pulse * 0.4;
                animYaw = Math.sin(scaledTime * 0.12) * 0.05;
                animPitch = Math.cos(scaledTime * 0.1) * 0.03;
            } else if (preset === 'Gentle Orbit Drift') {
                animYaw = scaledTime * 0.12;
                animPitch = Math.sin(scaledTime * 0.1) * 0.12;
                animCamDist = 10.0 + Math.sin(scaledTime * 0.15) * 0.5;
            } else if (preset === 'Tidal Sway') {
                animYaw = Math.sin(scaledTime * 0.25) * 0.16;
                animPitch = Math.sin(scaledTime * 0.18 + 0.5) * 0.08;
                animTargetX = 0.65 + Math.cos(scaledTime * 0.2) * 0.3;
                animTargetY = 0.15 + Math.sin(scaledTime * 0.25) * 0.2;
            } else if (preset === 'Pendulum Float') {
                animYaw = Math.sin(scaledTime * 0.3) * 0.18;
                animPitch = -Math.abs(Math.sin(scaledTime * 0.15)) * 0.07;
                animCamDist = 9.9 + Math.cos(scaledTime * 0.3) * 0.4;
            } else if (preset === 'Deep Dive Glaze') {
                animCamDist = 8.5 + Math.sin(scaledTime * 0.3) * 2.2;
                animYaw = Math.sin(scaledTime * 0.15) * 0.1;
                animPitch = Math.cos(scaledTime * 0.2) * 0.06;
            } else if (preset === 'Ethereal Spiral') {
                animYaw = scaledTime * 0.18;
                animPitch = Math.cos(scaledTime * 0.16) * 0.18;
                animCamDist = 10.0 + Math.cos(scaledTime * 0.22) * 0.8;
            } else if (preset === 'Static Serene Stillness') {
                animYaw = 0.0;
                animPitch = 0.0;
                animCamDist = 10.0;
            }

            const finalDistance = animCamDist * (settings.userZoomDistance / 10.0);
            const finalYaw = animYaw + settings.userOrbitYaw;
            const finalPitch = Math.max(-1.45, Math.min(1.45, animPitch + settings.userOrbitPitch));

            const target = new THREE.Vector3(
                animTargetX + settings.userPanX,
                animTargetY + settings.userPanY,
                animTargetZ
            );

            const cosP = Math.cos(finalPitch);
            const sinP = Math.sin(finalPitch);
            const cosY = Math.cos(finalYaw);
            const sinY = Math.sin(finalYaw);

            camera.position.set(
                target.x + finalDistance * cosP * sinY,
                target.y + finalDistance * sinP,
                target.z + finalDistance * cosP * cosY
            );
            camera.lookAt(target);

            // 2. Animate Main Jelly Hearts
            heartObjects.forEach((heart, idx) => {
                const data = heart.userData;
                const p = data.phase;
                const flAmp = settings.floatIntensity;

                if (preset !== 'Static Serene Stillness') {
                    heart.rotation.x += data.rotSpeed.x * delta * settings.animSpeed * 0.7;
                    heart.rotation.y += data.rotSpeed.y * delta * settings.animSpeed * 0.85;
                    heart.rotation.z += data.rotSpeed.z * delta * settings.animSpeed * 0.6;

                    if (!isDraggingHeart || draggedHeart !== heart) {
                        const floatX = Math.sin(scaledTime * 0.6 + p) * 0.18 * flAmp;
                        const floatY = Math.cos(scaledTime * 0.75 + p * 1.3) * 0.24 * flAmp;
                        const floatZ = Math.sin(scaledTime * 0.5 + p * 0.7) * 0.15 * flAmp;

                        heart.position.set(
                            data.basePos.x + floatX,
                            data.basePos.y + floatY,
                            data.basePos.z + floatZ
                        );
                    }

                    if (preset === 'Cosmic Heartbeat & Breathing') {
                        const hb = 1.0 + Math.pow(Math.sin(scaledTime * 1.8 + p * 0.5), 6) * 0.08;
                        heart.scale.setScalar(initialHeartConfigs[idx].scale * hb);
                    }
                }

                // Bubbles movement
                data.bubbles.children.forEach(b => {
                    const bd = b.userData;
                    const bTime = scaledTime * bd.speed + bd.phase;
                    b.position.x = bd.origin.x + Math.sin(bTime) * bd.amp;
                    b.position.y = bd.origin.y + Math.cos(bTime * 1.2) * bd.amp;
                    b.position.z = bd.origin.z + Math.sin(bTime * 0.8) * bd.amp;
                });

                // Veins motion
                data.veins.children.forEach(v => {
                    const vd = v.userData;
                    v.rotation.z = Math.sin(scaledTime * 0.4 + vd.phase) * 0.15;
                    v.rotation.y = Math.cos(scaledTime * 0.3 + vd.phase) * 0.12;
                });

                // Glints time update
                const glintsMesh = data.glints.children[0];
                if (glintsMesh && glintsMesh.material.uniforms) {
                    glintsMesh.material.uniforms.time.value = scaledTime;
                }
            });

            // 3. Animate Floating Mini Heart Particles
            if (miniHeartInstancedMesh) {
                for (let i = 0; i < miniHeartData.length; i++) {
                    const md = miniHeartData[i];
                    md.rot.x += md.rotSpeed.x * delta * settings.animSpeed;
                    md.rot.y += md.rotSpeed.y * delta * settings.animSpeed;
                    md.rot.z += md.rotSpeed.z * delta * settings.animSpeed;

                    const floatY = Math.sin(scaledTime * md.driftSpeed + md.phase) * 0.28;
                    const floatX = Math.cos(scaledTime * (md.driftSpeed * 0.8) + md.phase) * 0.18;

                    dummyInstance.position.set(
                        md.basePos.x + floatX,
                        md.basePos.y + floatY,
                        md.basePos.z
                    );
                    dummyInstance.rotation.copy(md.rot);
                    dummyInstance.scale.setScalar(md.scale);
                    dummyInstance.updateMatrix();
                    miniHeartInstancedMesh.setMatrixAt(i, dummyInstance.matrix);
                }
                miniHeartInstancedMesh.instanceMatrix.needsUpdate = true;
            }

            // 4. Animate Cosmic Dust
            if (cosmicDustPoints) {
                cosmicDustPoints.rotation.y = scaledTime * 0.02;
                cosmicDustPoints.rotation.x = Math.sin(scaledTime * 0.015) * 0.05;
            }

            // 5. PostProcessor Render Pass
            postProcessor.renderScene(scene, camera);
        }

        // --- Start Application ---
        initScene();
        setupGUI();
        setupInteractionListeners();
        animate();
    </script>
</body>
