<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07142e">
  <meta name="description" content="A slowly breathing sculpture of satin strata, coral light, and midnight blue. A seamless 24-second WebGL study.">
  <title>Soft Strata</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #07142e; overscroll-behavior: none; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  </style>
</head>
<body>
  <canvas role="img" aria-label="An endlessly flowing sculpture of fine navy, coral, peach and pale blue folds"></canvas>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
    import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

    const defaults = {
      scheme: 'Original', customPalette: false, invert: false,
      color1: '#07142e', color2: '#8faeb4', color3: '#e6ddd6',
      color4: '#ff874d', color5: '#d82a76', color6: '#18334b',
      tint: '#ffffff', accent: '#ff2535', saturation: 1,
      background: '#07142e', greenscreen: false,
      pixelRatio: Math.min(devicePixelRatio || 1, 1.75),
      animation: 'Organic flow', speed: 1, motion: 1, orbitAmount: 15,
      zoom: 1, positionX: 0, positionY: 0, azimuth: 0, elevation: 0,
      seed: 0, curl: .98, shear: .67, ridges: 105, folds: 10, depth: 1,
      randomizeOnClick: true
    };
    const settings = { ...defaults };
    // Exactly 19 schemes. Invert provides both monochrome polarities.
    const schemes = {
      'Original': ['07142E', '8FAEB4', 'E6DDD6', 'FF874D', 'D82A76', '18334B'],
      'Monochromatic': ['07142E', '18334B', '36556B', '8FAEB4', 'BED3D2', '18334B'],
      'Analogous': ['31154C', '702760', 'D82A76', 'FF5429', 'FFB078', '451D4B'],
      'Complementary': ['073C4A', '248C9C', 'C4E5DF', 'FFB678', 'FF5429', '17334B'],
      'Split-complementary': ['211849', '6159A6', 'C8C4E6', 'FFB469', '89B994', '143F43'],
      'Triadic': ['261C55', '6956AB', 'D6C9E6', 'FF8757', '71BCA0', '153F40'],
      'Tetradic': ['352353', 'AF4A79', 'EADAC7', 'EDAA51', '3D9A9A', '163A52'],
      'Double split-complementary': ['46306E', 'BC537D', 'EDC59B', 'E9AE58', '70B9A0', '285A7B'],
      'Achromatic': ['000000', '303030', '8A8A8A', 'FFFFFF', 'A3A3A3', '080808'],
      'Achromatic + Accent': ['000000', '303030', '8A8A8A', 'FFFFFF', 'A3A3A3', '080808'],
      'Neutral + accent': ['242629', '656964', 'B5B1A5', 'EEE6D9', 'DE9156', '343B3D'],
      'Amber / Oxblood': ['F6AA1C', 'BC3908', '941B0C', 'F6AA1C', '220901'],
      'Lagoon / Midnight': ['63D1CF', '5BC0BE', '4BAD9E', '4BAD9E', '0B132B', '000000'],
      'Orchid / Ink': ['AA60C8', 'D69ADE', 'C9A3C6', 'CFB5C2', '0D001D', '120A12'],
      'Champagne / Teal': ['FEF1BE', 'FFBA00', '008189', '00474D', '061210'],
      'Chartreuse / Forest': ['D4FFB0', '7FFF00', '00B894', '0A3322', '05140A'],
      'Apricot / Aubergine': ['FFE8CC', 'FF8C00', 'C7501A', '3D1050', '0E0618'],
      'Lilac / Ultraviolet': ['E8E0FF', 'B38FFF', '6A3DE8', '1A1250', '090612'],
      'Ice / Fuchsia': ['E0FBFF', '00F0FF', 'D40078', '1E0A3D', '05020F']
    };
    const animations = ['Organic flow', 'Layered breathing', 'Traveling strata',
      'Chromatic tide', 'Depth swell', 'Gentle sway', 'Slow orbit', 'Elliptic drift', 'Static'];
    let paletteCount = 6;

    const canvas = document.querySelector('canvas');
    const renderer = new THREE.WebGLRenderer({
      canvas, antialias: true, alpha: false, depth: true, stencil: false,
      powerPreference: 'high-performance'
    });
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.NoToneMapping;
    renderer.setClearColor(0x07142e);

    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 30);
    camera.position.z = 6;
    const uniforms = {
      uPhase: { value: 0 },
      uSeed: { value: 0 }, uCurl: { value: .98 }, uShear: { value: .67 },
      uRidges: { value: 105 }, uFolds: { value: 10 }, uDepth: { value: 1 },
      uMotion: { value: 1 }, uTravel: { value: 0 }, uColorShift: { value: 0 },
      uOriginal: { value: 1 }, uInvert: { value: 0 }, uSaturation: { value: 1 },
      uAccentMode: { value: 0 }, uAccent: { value: new THREE.Color() },
      uTint: { value: new THREE.Color(0xffffff) }, uColorCount: { value: 6 },
      uColors: { value: Array.from({ length: 6 }, () => new THREE.Color()) },
      uPixel: { value: new THREE.Vector2() },
      uView: { value: new THREE.Vector2(2.4, 3.6) }
    };

    // Shared by both shaders: the mesh and its sub-pixel shading describe
    // exactly the same surface. Every time-dependent value is 2π periodic.
    const sculpture = /* glsl */`
      uniform float uPhase;
      uniform float uSeed, uCurl, uShear, uRidges, uFolds, uDepth, uMotion, uTravel;
      const float TAU = 6.283185307179586;

      float noise(vec2 p) {
        // Band-limited Fourier noise has continuous derivatives everywhere;
        // no lattice boundaries can imprint a seam on the fine strata.
        return .5 + .19 * sin(dot(p, vec2(1.73, .91)) + 1.2)
                        * cos(dot(p, vec2(-.83, 1.47)) - .9)
                  + .13 * sin(dot(p, vec2(2.21, -1.41)) + 2.4)
                  + .07 * sin(dot(p, vec2(3.77, 2.81)) + .8);
      }
      float fbm(vec2 p) {
        float a = .57 * noise(p);
        p = mat2(.8, -.6, .6, .8) * p * 2.03 + 7.1;
        return a + .28 * noise(p);
      }
      float bell(vec2 p, vec2 center, vec2 radius) {
        vec2 d = (p - center) / radius;
        return exp(-dot(d, d));
      }

      float strata(vec2 p) {
        vec2 cycle = vec2(cos(uPhase), sin(uPhase));
        // A coherent, tiny deformation of the whole folded landscape.
        p += .014 * uMotion * vec2(
          sin(4.0 * p.y + cycle.x) * cycle.y,
          cos(3.3 * p.x + cycle.y) * cycle.x);
        float n = fbm(p * 3.1 + .17 * cycle + uSeed * .071);
        vec2 w = p + .027 * vec2(n - .4, noise(p * 2.0 + 9.0) - .5);
        vec2 curlCenter = vec2(.72, .23) + .08 * sin(vec2(.73, .47) * uSeed);
        float curl = uCurl * bell(w, curlCenter, vec2(.40, .37));
        vec2 d = w - curlCenter;
        w = curlCenter + mat2(cos(curl), sin(curl), -sin(curl), cos(curl)) * d;
        float shear = uShear * smoothstep(-.10, 1.10, w.x);
        float q = w.y - shear;
        q += .21 * bell(w, vec2(.45, .83), vec2(.28, .40));
        q += .060 * sin(6.0 * w.x - 2.0 * w.y);
        q += .035 * sin(4.0 * w.x + 5.0 * w.y);
        q -= .24 * bell(w, vec2(1.0, 1.0), vec2(.37, .57));
        q -= .045 * bell(w, vec2(.67, .22), vec2(.25, .25));
        q += .12 * bell(p, vec2(.02, .04), vec2(.34, .38));
        q += .045 * sin(uSeed * .37) * sin(4.3 * w.x + 2.1 * w.y + uSeed * .13);
        return q;
      }

      // The irregular spacing makes long connected strata, with tiny secondary
      // creases tucked into the shoulders of the larger, rounded ledges.
      vec4 profile(float q, vec2 p) {
        float drift = uMotion * (.12 * sin(uPhase + 3.0 * q)
                    + .055 * cos(uPhase * 2.0 - 2.5 * p.x));
        float layers = q * uRidges + .63 * sin(q * 19.0)
                     + .26 * sin(q * 43.0 + p.x * 2.4) + drift + uTravel;
        float a = TAU * layers;
        float fine = sin(a) + .30 * sin(2.0 * a + .65)
                   + .12 * sin(3.0 * a + 1.3);
        float broad = q * uFolds + .23 * sin(q * 16.0) + .04 * uMotion * sin(uPhase);
        float angle = TAU * broad;
        float foldedAngle = angle + .55 * sin(angle);
        float shoulder = max(.5 + .5 * cos(foldedAngle), 0.0);
        float rolled = pow(shoulder, 1.7);
        float rollSlope = -.85 * pow(shoulder, .7) * sin(foldedAngle)
                        * (1.0 + .55 * cos(angle)) * TAU
                        * (uFolds + 3.68 * cos(q * 16.0));
        return vec4(fine, rolled, a, rollSlope);
      }

      float elevation(float q, vec2 p) {
        vec4 r = profile(q, p);
        float mass = .16 * sin(q * 6.7 - .35)
                   + .095 * sin(q * 13.0 + .6);
        mass += .13 * bell(p, vec2(.35, .83), vec2(.55, .37));
        mass += .17 * bell(p, vec2(.75, .23), vec2(.46, .34));
        float coldDistance = (q + .22) / .28;
        float coolFolds = exp(-coldDistance * coldDistance);
        float ledges = (.055 + .13 * coolFolds) * r.y * (.75 + .25 * sin(q * 31.0));
        return (mass + ledges) * uDepth;
      }

      vec3 sculptedPosition(float q, vec2 p) {
        vec4 r = profile(q, p);
        float cool = 1.0 - smoothstep(-.06, .20, q);
        vec2 xy = (p - .5) * vec2(2.4, 3.6);
        xy += vec2(-.12 * cool, .035) * r.y * uDepth;
        return vec3(xy, elevation(q, p));
      }
    `;

    const material = new THREE.ShaderMaterial({
      uniforms,
      side: THREE.DoubleSide,
      vertexShader: /* glsl */`
        uniform vec2 uView;
        varying vec2 vP;
        ${sculpture}
        void main() {
          vec2 xy = position.xy * (uView * .5 + vec2(.18, .10));
          vP = xy / vec2(2.4, 3.6) + .5;
          float q = strata(vP);
          vec3 displaced = sculptedPosition(q, vP);
          gl_Position = projectionMatrix * modelViewMatrix * vec4(displaced, 1.0);
        }
      `,
      fragmentShader: /* glsl */`
        precision highp float;
        uniform vec2 uPixel;
        uniform vec3 uColors[6], uTint, uAccent;
        uniform float uOriginal, uColorCount, uInvert, uSaturation, uAccentMode, uColorShift;
        varying vec2 vP;
        ${sculpture}

        vec3 linearColor(vec3 c) {
          return pow(c, vec3(2.2));
        }
        vec3 palette(float q) {
          q += uColorShift;
          vec3 c = vec3(.027, .054, .145);
          c = mix(c, vec3(.045, .092, .199), smoothstep(-.70, -.54, q));
          c = mix(c, vec3(.094, .200, .285), smoothstep(-.56, -.42, q));
          c = mix(c, vec3(.333, .447, .517), smoothstep(-.44, -.29, q));
          c = mix(c, vec3(.640, .753, .755), smoothstep(-.31, -.16, q));
          c = mix(c, vec3(.765, .826, .799), smoothstep(-.17, -.025, q));
          c = mix(c, vec3(.902, .837, .785), smoothstep(.015, .105, q));
          c = mix(c, vec3(1.0, .685, .532), smoothstep(.09, .235, q));
          c = mix(c, vec3(1.0, .428, .205), smoothstep(.22, .34, q));
          c = mix(c, vec3(1.0, .235, .100), smoothstep(.33, .425, q));
          c = mix(c, vec3(.875, .093, .272), smoothstep(.425, .485, q));
          c = mix(c, vec3(.390, .092, .262), smoothstep(.485, .535, q));
          c = mix(c, vec3(.087, .181, .265), smoothstep(.525, .585, q));
          c = mix(c, vec3(.027, .063, .130), smoothstep(.59, .92, q));
          float apricot = smoothstep(.64, .95, vP.x) * smoothstep(.55, .90, vP.y);
          c = mix(c, vec3(1.0, .675, .515), apricot);
          vec3 result = linearColor(c);
          if (uOriginal < .5) {
            float t = smoothstep(-.70, .92, q) * (uColorCount - 1.0);
            result = uColors[0];
            for (int i = 0; i < 5; i++) {
              result = mix(result, uColors[i + 1], smoothstep(float(i), float(i + 1), t));
            }
          }
          if (uInvert > .5) result = linearColor(1.0 - pow(max(result, 0.0), vec3(1.0 / 2.2)));
          float luminance = dot(result, vec3(.2126, .7152, .0722));
          result = max(mix(vec3(luminance), result, uSaturation), 0.0);
          if (uAccentMode > .5) {
            float accentBand = exp(-1200.0 * (q - .43) * (q - .43));
            result = mix(result, uAccent, accentBand);
          }
          return result * uTint;
        }

        void main() {
          vec2 p = vP;
          float q = strata(p);
          vec4 r = profile(q, p);
          // Differentiate the continuous parametric surface rather than its
          // triangles, so even rolled edges have smooth studio lighting.
          float cool = 1.0 - smoothstep(-.06, .20, q);
          float transition = clamp((q + .06) / .26, 0.0, 1.0);
          float coolSlope = -6.0 * transition * (1.0 - transition) / .26;
          float coldDistance = (q + .22) / .28;
          float cold = exp(-coldDistance * coldDistance);
          float coldSlope = -2.0 * (q + .22) / .0784 * cold;
          float amplitude = .055 + .13 * cold;
          float envelope = .75 + .25 * sin(q * 31.0);
          float ledgeSlope = amplitude * envelope * r.w
            + (.13 * coldSlope * envelope + amplitude * 7.75 * cos(q * 31.0)) * r.y;
          float massSlope = 1.072 * cos(q * 6.7 - .35) + 1.235 * cos(q * 13.0 + .6);
          vec3 shapeSlope = vec3(-.12 * (coolSlope * r.y + cool * r.w),
                                 .035 * r.w, massSlope + ledgeSlope) * uDepth;
          vec2 g1 = -.26 * (p - vec2(.35, .83)) / vec2(.3025, .1369)
                    * bell(p, vec2(.35, .83), vec2(.55, .37));
          vec2 g2 = -.34 * (p - vec2(.75, .23)) / vec2(.2116, .1156)
                    * bell(p, vec2(.75, .23), vec2(.46, .34));
          const float stepSize = .0006;
          vec2 gradient = vec2(
            strata(p + vec2(stepSize, 0)) - strata(p - vec2(stepSize, 0)),
            strata(p + vec2(0, stepSize)) - strata(p - vec2(0, stepSize))
          ) / (2.0 * stepSize);
          vec3 tangentX = vec3(2.4, 0, (g1.x + g2.x) * uDepth) + shapeSlope * gradient.x;
          vec3 tangentY = vec3(0, 3.6, (g1.y + g2.y) * uDepth) + shapeSlope * gradient.y;
          float layerSlope = uRidges + 11.97 * cos(q * 19.0)
                           + 11.18 * cos(q * 43.0 + p.x * 2.4)
                           + .36 * uMotion * cos(uPhase + 3.0 * q);
          float fineSlope = TAU * layerSlope *
            (cos(r.z) + .60 * cos(2.0 * r.z + .65) + .36 * cos(3.0 * r.z + 1.3));
          float filterWidth = dot(abs(gradient), uPixel) * layerSlope;
          float detail = 1.0 - smoothstep(.22, .60, filterWidth);
          float ridgeHeight = .00095 * (.7 + .3 * sin(q * 37.0));
          tangentX.z += fineSlope * ridgeHeight * gradient.x * detail;
          tangentY.z += fineSlope * ridgeHeight * gradient.y * detail;
          vec3 normal = normalize(cross(tangentX, tangentY));
          if (normal.z < 0.0) normal = -normal;
          vec3 light = normalize(vec3(.42, .63, 1.2));
          float diffuse = max(dot(normal, light), 0.0);
          float facing = max(normal.z, 0.0);
          float satin = pow(max(dot(normal, normalize(light + vec3(0, 0, 1))), 0.0), 28.0);

          float groove = .5 - .5 * sin(r.z + .45);
          float occlusion = 1.0 - .055 * pow(groove, 4.0) * detail;
          float foldShadow = .91 + .09 * smoothstep(.02, .65, r.y);
          vec3 color = palette(q);
          color *= (.49 + .62 * diffuse) * occlusion * foldShadow;
          color += linearColor(vec3(.74, .81, .85)) * .035 * satin;
          color += color * .065 * pow(1.0 - facing, 2.0);

          // A faint warm bounce connects the soft clay-like material across
          // adjacent strata without bloom or an emissive appearance.
          float warmDistance = (q - .30) / .24;
          float warm = exp(-warmDistance * warmDistance);
          color += vec3(.014, .0033, .0012) * warm * (.4 + .6 * facing)
                 * uOriginal * (1.0 - uInvert);
          gl_FragColor = vec4(color, 1.0);
          #include <colorspace_fragment>
        }
      `
    });

    const geometry = new THREE.PlaneGeometry(2, 2, 420, 640);
    const sculptureMesh = new THREE.Mesh(geometry, material);
    sculptureMesh.frustumCulled = false;
    scene.add(sculptureMesh);

    function resize() {
      const width = innerWidth, height = innerHeight;
      const aspect = width / height;
      // Crop the portrait composition; never stretch its shapes. At wide
      // aspect ratios the continuous procedural surface extends sideways.
      const viewHeight = THREE.MathUtils.lerp(3.6, 2.65,
        THREE.MathUtils.smoothstep(aspect, .7, 1.6));
      const viewWidth = viewHeight * aspect;
      camera.left = -viewWidth / 2;
      camera.right = viewWidth / 2;
      camera.top = viewHeight / 2;
      camera.bottom = -viewHeight / 2;
      camera.updateProjectionMatrix();
      uniforms.uView.value.set(viewWidth, viewHeight);
      renderer.setPixelRatio(settings.pixelRatio);
      renderer.setSize(width, height, false);
      const pixelRatio = renderer.getPixelRatio();
      uniforms.uPixel.value.set(viewWidth / (2.4 * width * pixelRatio),
                               viewHeight / (3.6 * height * pixelRatio));
    }
    addEventListener('resize', resize, { passive: true });
    resize();

    function updateColors() {
      uniforms.uOriginal.value = settings.scheme === 'Original' && !settings.customPalette ? 1 : 0;
      uniforms.uColorCount.value = paletteCount;
      uniforms.uInvert.value = Number(settings.invert);
      uniforms.uSaturation.value = settings.saturation;
      uniforms.uTint.value.set(settings.tint);
      uniforms.uAccent.value.set(settings.accent);
      uniforms.uAccentMode.value = settings.scheme === 'Achromatic + Accent' ? 1 : 0;
      uniforms.uColors.value.forEach((color, i) => color.set(settings['color' + (i + 1)]));
    }
    function updateBackground() {
      renderer.setClearColor(settings.greenscreen ? '#00ff00' : settings.background);
    }
    function selectScheme() {
      const colors = schemes[settings.scheme];
      paletteCount = colors.length;
      for (let i = 0; i < 6; i++) settings['color' + (i + 1)] = '#' + colors[Math.min(i, colors.length - 1)];
      settings.customPalette = false;
      updateColors();
      refreshPanel();
    }

    const gui = new GUI({ title: 'Soft Strata' });
    const refreshPanel = () => gui.controllersRecursive().forEach(control => control.updateDisplay());
    const colorFolder = gui.addFolder('Colors');
    colorFolder.add(settings, 'scheme', Object.keys(schemes)).name('Color scheme').onChange(selectScheme);
    colorFolder.add(settings, 'invert').name('Invert palette').onChange(updateColors);
    colorFolder.add(settings, 'saturation', 0, 2, .01).name('Saturation').onChange(updateColors);
    colorFolder.addColor(settings, 'tint').name('Tint').onChange(updateColors);
    colorFolder.addColor(settings, 'accent').name('Accent').onChange(updateColors);
    const customColors = colorFolder.addFolder('Custom palette');
    customColors.add(settings, 'customPalette').name('Use custom colors').onChange(() => {
      if (settings.customPalette) paletteCount = 6;
      else { selectScheme(); return; }
      updateColors();
    });
    for (let i = 1; i <= 6; i++) {
      customColors.addColor(settings, 'color' + i).name('Color ' + i).onChange(() => {
        settings.customPalette = true;
        paletteCount = 6;
        updateColors();
        refreshPanel();
      });
    }
    customColors.close();
    colorFolder.close();

    const backgroundFolder = gui.addFolder('Background');
    backgroundFolder.add(settings, 'greenscreen').name('Green screen').onChange(updateBackground);
    backgroundFolder.addColor(settings, 'background').name('Background color').onChange(updateBackground);
    backgroundFolder.close();

    const motionFolder = gui.addFolder('Animation');
    motionFolder.add(settings, 'animation', animations).name('Animation');
    motionFolder.add(settings, 'speed', 0, 3, .01).name('Speed');
    motionFolder.add(settings, 'motion', 0, 2, .01).name('Motion amount');
    motionFolder.add(settings, 'orbitAmount', 0, 35, .1).name('Orbit amplitude');
    motionFolder.close();

    const cameraFolder = gui.addFolder('Camera');
    cameraFolder.add(settings, 'zoom', .15, 8, .01).name('Zoom').listen();
    cameraFolder.add(settings, 'positionX', -12, 12, .01).name('Position X').listen();
    cameraFolder.add(settings, 'positionY', -12, 12, .01).name('Position Y').listen();
    cameraFolder.add(settings, 'azimuth', -70, 70, .1).name('Camera angle').listen();
    cameraFolder.add(settings, 'elevation', -55, 55, .1).name('Camera elevation').listen();
    cameraFolder.add({ resetView() {
      for (const key of ['zoom', 'positionX', 'positionY', 'azimuth', 'elevation']) settings[key] = defaults[key];
      refreshPanel();
    } }, 'resetView').name('Reset view');
    cameraFolder.close();

    const sculptureFolder = gui.addFolder('Sculpture');
    sculptureFolder.add(settings, 'seed', 0, 1000, 1).name('Seed');
    sculptureFolder.add(settings, 'curl', .1, 1.8, .01).name('Curl');
    sculptureFolder.add(settings, 'shear', .25, 1, .01).name('Diagonal flow');
    sculptureFolder.add(settings, 'ridges', 45, 180, 1).name('Fine ridges');
    sculptureFolder.add(settings, 'folds', 4, 18, .1).name('Broad folds');
    sculptureFolder.add(settings, 'depth', .25, 1.8, .01).name('Depth');
    sculptureFolder.close();

    gui.add(settings, 'pixelRatio', .5, 3, .05).name('Pixel ratio (DPR)').onChange(resize);
    gui.add(settings, 'randomizeOnClick').name('Randomize on click');
    const randomBetween = (min, max) => min + Math.random() * (max - min);
    function randomize() {
      const choices = Object.keys(schemes).filter(name => name !== settings.scheme);
      settings.scheme = choices[Math.floor(Math.random() * choices.length)];
      settings.tint = '#ffffff';
      settings.invert = Math.random() < .2;
      settings.saturation = randomBetween(.8, 1.2);
      settings.seed = Math.floor(randomBetween(1, 1000));
      settings.curl = randomBetween(.55, 1.5);
      settings.shear = randomBetween(.45, .9);
      settings.ridges = Math.round(randomBetween(70, 145));
      settings.folds = randomBetween(7, 14);
      settings.depth = randomBetween(.65, 1.35);
      settings.animation = animations[Math.floor(Math.random() * 8)];
      settings.speed = randomBetween(.45, 1.15);
      settings.motion = randomBetween(.6, 1.4);
      settings.orbitAmount = randomBetween(8, 24);
      selectScheme();
    }
    gui.add({ randomize }, 'randomize').name('New variation');
    gui.add({ restoreOriginal() {
      Object.assign(settings, defaults);
      paletteCount = 6;
      updateColors();
      updateBackground();
      resize();
      refreshPanel();
    } }, 'restoreOriginal').name('Restore original');
    updateColors();
    updateBackground();

    let uiVisible = true;
    addEventListener('keydown', event => {
      if (event.code !== 'KeyH' || event.repeat || event.ctrlKey || event.metaKey || event.altKey) return;
      if (event.target.closest?.('input, textarea, select, [contenteditable="true"]')) return;
      uiVisible = !uiVisible;
      gui.show(uiVisible);
    });

    // User framing is independent of the animation's small camera offsets.
    // Changing presets or advancing the orbit never overwrites these values.
    canvas.addEventListener('wheel', event => {
      event.preventDefault();
      const delta = event.deltaY * (event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? innerHeight : 1);
      settings.zoom = THREE.MathUtils.clamp(settings.zoom * Math.exp(-delta * .0012), .15, 8);
    }, { passive: false });
    let gesture = null;
    canvas.addEventListener('pointerdown', event => {
      if (gesture || (event.button !== 0 && event.button !== 2)) return;
      gesture = { id: event.pointerId, startX: event.clientX, startY: event.clientY,
        lastX: event.clientX, lastY: event.clientY, moved: false, orbit: event.button === 2,
        zoom: camera.zoom, width: camera.right - camera.left, height: camera.top - camera.bottom };
      canvas.setPointerCapture(event.pointerId);
    });
    canvas.addEventListener('pointermove', event => {
      if (!gesture || event.pointerId !== gesture.id) return;
      const dx = event.clientX - gesture.lastX, dy = event.clientY - gesture.lastY;
      if (Math.hypot(event.clientX - gesture.startX, event.clientY - gesture.startY) > 5) gesture.moved = true;
      if (gesture.moved) {
        if (gesture.orbit) {
          settings.azimuth = THREE.MathUtils.clamp(settings.azimuth + dx * .18, -70, 70);
          settings.elevation = THREE.MathUtils.clamp(settings.elevation + dy * .18, -55, 55);
        } else {
          settings.positionX = THREE.MathUtils.clamp(settings.positionX + dx / innerWidth * gesture.width / gesture.zoom, -12, 12);
          settings.positionY = THREE.MathUtils.clamp(settings.positionY - dy / innerHeight * gesture.height / gesture.zoom, -12, 12);
        }
      }
      gesture.lastX = event.clientX;
      gesture.lastY = event.clientY;
    });
    function endGesture(event) {
      if (!gesture || event.pointerId !== gesture.id) return;
      const clicked = event.type === 'pointerup' && !gesture.orbit && !gesture.moved
        && Math.hypot(event.clientX - gesture.startX, event.clientY - gesture.startY) <= 5;
      gesture = null;
      if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
      if (clicked && settings.randomizeOnClick) randomize();
    }
    canvas.addEventListener('pointerup', endGesture);
    canvas.addEventListener('pointercancel', endGesture);
    canvas.addEventListener('lostpointercapture', () => { gesture = null; });
    canvas.addEventListener('contextmenu', event => event.preventDefault());

    const loopDuration = 24;
    const cameraRight = new THREE.Vector3();
    const cameraUp = new THREE.Vector3();
    let seconds = 0, lastFrame, contextLost = false;
    function render(now) {
      requestAnimationFrame(render);
      if (document.hidden || contextLost) { lastFrame = undefined; return; }
      const dt = lastFrame === undefined ? 0 : Math.max(0, (now - lastFrame) * .001);
      lastFrame = now;
      const isStatic = settings.animation === 'Static';
      if (!isStatic) seconds += dt * settings.speed;
      const phase = isStatic ? 0 : Math.PI * 2 * (seconds % loopDuration) / loopDuration;
      const s = Math.sin(phase), c = Math.cos(phase);
      let motionScale = 1, depthScale = 1, yaw = 0, pitch = 0, panX = 0, panY = 0, zoomScale = 1;
      switch (settings.animation) {
        case 'Layered breathing': motionScale = .35; depthScale += .09 * s; break;
        case 'Traveling strata': motionScale = .35; break;
        case 'Chromatic tide': motionScale = .5; break;
        case 'Depth swell': motionScale = .5; depthScale += .16 * s; break;
        case 'Gentle sway': motionScale = .6; yaw = 3 * s; pitch = 2 * c; break;
        case 'Slow orbit': yaw = settings.orbitAmount * s; pitch = settings.orbitAmount * .45 * c; break;
        case 'Elliptic drift':
          panX = .12 * s; panY = .08 * Math.sin(phase * 2); zoomScale += .025 * s; break;
        case 'Static': motionScale = 0; break;
      }
      uniforms.uPhase.value = phase;
      uniforms.uMotion.value = settings.motion * motionScale;
      uniforms.uTravel.value = settings.animation === 'Traveling strata' ? phase / (Math.PI * 2) : 0;
      uniforms.uColorShift.value = settings.animation === 'Chromatic tide' ? .045 * s * settings.motion : 0;
      uniforms.uSeed.value = settings.seed;
      uniforms.uCurl.value = settings.curl;
      uniforms.uShear.value = settings.shear;
      uniforms.uRidges.value = settings.ridges;
      uniforms.uFolds.value = settings.folds;
      uniforms.uDepth.value = settings.depth * depthScale;

      const azimuth = THREE.MathUtils.degToRad(THREE.MathUtils.clamp(settings.azimuth + yaw, -80, 80));
      const elevation = THREE.MathUtils.degToRad(THREE.MathUtils.clamp(settings.elevation + pitch, -70, 70));
      camera.position.set(6 * Math.sin(azimuth) * Math.cos(elevation),
                          6 * Math.sin(elevation), 6 * Math.cos(azimuth) * Math.cos(elevation));
      camera.lookAt(0, 0, 0);
      camera.zoom = settings.zoom * zoomScale;
      camera.updateProjectionMatrix();
      cameraRight.set(1, 0, 0).applyQuaternion(camera.quaternion);
      cameraUp.set(0, 1, 0).applyQuaternion(camera.quaternion);
      sculptureMesh.position.copy(cameraRight).multiplyScalar(settings.positionX + panX)
        .addScaledVector(cameraUp, settings.positionY + panY);
      renderer.render(scene, camera);
    }
    document.addEventListener('visibilitychange', () => {
      lastFrame = undefined;
    });
    canvas.addEventListener('webglcontextlost', event => {
      event.preventDefault();
      contextLost = true;
    });
    canvas.addEventListener('webglcontextrestored', () => { contextLost = false; });
    requestAnimationFrame(render);
  </script>
</body>
</html>
