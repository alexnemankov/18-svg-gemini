function hexToRgb(hex) {
  hex = hex.replace('#', '').trim();
  const r = parseInt(hex.substring(0, 2), 16) / 255;
  const g = parseInt(hex.substring(2, 4), 16) / 255;
  const b = parseInt(hex.substring(4, 6), 16) / 255;
  return [
    parseFloat(r.toFixed(3)),
    parseFloat(g.toFixed(3)),
    parseFloat(b.toFixed(3))
  ];
}

let renderer = null;

// ============================================================
// Shaders
// ============================================================
const vertexShader = /* glsl */ `
void main() {
  gl_Position = vec4(position.xy, 0.0, 1.0);
}
`;

const fragmentShader = /* glsl */ `
out vec4 outColor;

uniform vec2  uResolution;
uniform float uTime;
uniform float uCameraZ;
uniform float uFractalTime;

uniform float uCameraFov;
uniform vec3  uCameraPos;
uniform mat3  uCameraRot;

uniform float uCorridorWidth;
uniform float uCorridorHeight;

uniform float uFractalScale;
uniform float uFractalRelief;
uniform float uFractalDetail;
uniform int   uFractalSteps;

uniform vec3  uColorA;
uniform vec3  uColorB;
uniform vec3  uColorC;
uniform vec3  uBackgroundColor;
uniform vec3  uFarGlowColor;
uniform bool  uGreenScreen;

uniform float uExposure;
uniform float uAmbientIntensity;

uniform vec3  uKeyLightDir;
uniform vec3  uKeyLightColor;
uniform float uKeyLightIntensity;

uniform vec3  uFillLightDir;
uniform vec3  uFillLightColor;
uniform float uFillLightIntensity;

uniform float uEmissiveIntensity;
uniform float uGlowStrength;
uniform float uFogDensity;
uniform bool  uUseGlow;

uniform float uReflectionStrength;
uniform float uReflectionFresnel;
uniform float uReflectionDistance;
uniform int   uReflectionSteps;

uniform int   uMarchSteps;
uniform float uMaxDistance;
uniform float uPixelConeScale;
uniform float uNormalEpsilon;
uniform float uBoundMargin;

// Derived values (computed on CPU)
uniform float uMaxRelief;
uniform float uPrimaryHitEpsilon;
uniform float uReflectionHitEpsilon;

// -------------------- Fractal field --------------------------

float fractalField(vec3 p)
{
  p *= uFractalScale;

  float time = uFractalTime;
  p.z -= time * 3.0;

  float accum = 0.0;
  float weight = 1.0;

  for (int i = 1; i <= uFractalSteps; ++i)
  {
    float f = float(i);
    p += cos(p.yzx * f + time) * (1.0 / f);

    accum += abs(
      sin(p.x * 1.35) *
      cos(p.y * 0.55) *
      sin(p.z * 0.55)
    ) * weight;

    weight *= 0.69;
  }

  return accum * uFractalDetail;
}

// -------------------- Scene SDF ------------------------------

float corridorDistance(vec3 p)
{
  return min(uCorridorWidth - abs(p.x), uCorridorHeight - abs(p.y));
}

float reliefHeight(float field)
{
  return uFractalRelief * smoothstep(0.11, 3.76, field);
}

float mapScene(vec3 p)
{
  return corridorDistance(p) - reliefHeight(fractalField(p));
}

// -------------------- Surface normal -------------------------

vec3 getNormal(vec3 p)
{
  float e = uNormalEpsilon * 0.57735;
  const vec2 k = vec2(1.0, -1.0);

  vec3 n = k.xyy * mapScene(p + k.xyy * e) +
           k.yyx * mapScene(p + k.yyx * e) +
           k.yxy * mapScene(p + k.yxy * e) +
           k.xxx * mapScene(p + k.xxx * e);

  return n / max(length(n), 1e-6);
}

// -------------------- Material -------------------------------

vec3 getFractalColor(vec3 p, float field)
{
  float blendA = 0.5 + 0.5 * cos(p.z * 0.45 + field * 3.8 - uTime * 0.8);
  vec3 color = mix(uColorA, uColorB, blendA);

  float accent = smoothstep(0.55, 1.15, field);
  return mix(color, uColorC, accent * 0.55);
}

// -------------------- Ray marching ---------------------------

float rayMarch(vec3 rayOrigin, vec3 rayDirection, float pixelCone,
               out float glow, out float hitField)
{
  float travel = 0.0;
  glow = 0.0;
  hitField = 0.0;

  for (int i = 0; i < uMarchSteps; ++i)
  {
    vec3 p = rayOrigin + rayDirection * travel;
    float wall = corridorDistance(p);
    float stepSize;

    if (!uUseGlow && wall > uMaxRelief + uBoundMargin)
    {
      stepSize = wall - uMaxRelief;
    }
    else
    {
      float field = fractalField(p);
      float d = wall - reliefHeight(field);

      if (uUseGlow)
        glow += exp(-abs(d) * 4.0) * uGlowStrength / (1.0 + travel * 0.05);

      if (d < max(uPrimaryHitEpsilon, travel * pixelCone))
      {
        hitField = field;
        return travel;
      }

      stepSize = clamp(d * 0.42, 0.012, 1.0);
    }

    if (travel > uMaxDistance)
      break;

    travel += stepSize;
  }

  return uMaxDistance;
}

float rayMarchReflection(vec3 rayOrigin, vec3 rayDirection, float pixelCone,
                         out float hitField)
{
  float travel = 0.06;
  hitField = 0.0;

  for (int i = 0; i < uReflectionSteps; ++i)
  {
    vec3 p = rayOrigin + rayDirection * travel;
    float wall = corridorDistance(p);
    float stepSize;

    if (wall > uMaxRelief + uBoundMargin)
    {
      stepSize = wall - uMaxRelief;
    }
    else
    {
      float field = fractalField(p);
      float d = wall - reliefHeight(field);

      if (d < max(uReflectionHitEpsilon, travel * pixelCone))
      {
        hitField = field;
        return travel;
      }

      stepSize = clamp(d * 0.58, 0.03, 1.5);
    }

    if (travel > uReflectionDistance)
      break;

    travel += stepSize;
  }

  return uReflectionDistance;
}

// -------------------- Reflection shading ---------------------

vec3 getReflectionColor(vec3 rayOrigin, vec3 rayDirection, float pixelCone)
{
  float field;
  float travel = rayMarchReflection(rayOrigin, rayDirection, pixelCone, field);

  vec3 effectiveBg = uGreenScreen ? vec3(0.0, 1.0, 0.0) : uBackgroundColor;

  if (travel >= uReflectionDistance)
    return effectiveBg;

  vec3 p = rayOrigin + rayDirection * travel;
  vec3 normal = getNormal(p);
  vec3 baseColor = getFractalColor(p, field);

  vec3 normKeyDir = normalize(uKeyLightDir);
  vec3 normFillDir = normalize(uFillLightDir);
  float keyDiff = max(dot(normal, normKeyDir), 0.0) * uKeyLightIntensity;
  float fillDiff = max(dot(normal, normFillDir), 0.0) * uFillLightIntensity;
  vec3 diffTerm = uKeyLightColor * keyDiff + uFillLightColor * fillDiff;

  float emissive = smoothstep(0.30, 1.20, field) * uEmissiveIntensity;

  vec3 reflectedLit = baseColor * (vec3(uAmbientIntensity) + diffTerm) + baseColor * emissive * 0.5;

  float fog = exp(-travel * uFogDensity * 1.5);
  return mix(effectiveBg, reflectedLit, fog);
}

// -------------------- Rendering ------------------------------

vec3 render(vec2 uv, out bool isBackground)
{
  vec3 cameraPosition = uCameraPos;
  vec3 rayDirection = normalize(uCameraRot * vec3(uv * uCameraFov, 1.0));

  // Angular size of one pixel, used for distance-scaled hit threshold
  float pixelCone = 2.0 * uCameraFov / uResolution.y * uPixelConeScale;

  float glow;
  float field;
  float travel = rayMarch(cameraPosition, rayDirection, pixelCone, glow, field);

  vec3 effectiveBg = uGreenScreen ? vec3(0.0, 1.0, 0.0) : uBackgroundColor;

  if (travel >= uMaxDistance)
  {
    isBackground = true;
    return effectiveBg;
  }

  isBackground = false;
  vec3 p = cameraPosition + rayDirection * travel;
  vec3 normal = getNormal(p);
  vec3 baseColor = getFractalColor(p, field);

  vec3 normKeyDir = normalize(uKeyLightDir);
  vec3 normFillDir = normalize(uFillLightDir);
  float keyDiff = max(dot(normal, normKeyDir), 0.0) * uKeyLightIntensity;
  float fillDiff = max(dot(normal, normFillDir), 0.0) * uFillLightIntensity;
  vec3 diffTerm = uKeyLightColor * keyDiff + uFillLightColor * fillDiff;

  float viewFacing = max(dot(normal, -rayDirection), 0.0);
  float invFacing = 1.0 - viewFacing;
  float fresnel = invFacing * invFacing * invFacing;

  float emissive = smoothstep(0.30, 1.20, field) * uEmissiveIntensity;

  vec3 litColor = baseColor * (vec3(uAmbientIntensity) + diffTerm + fresnel * 0.45) + baseColor * emissive;

  vec3 reflectionDirection = reflect(rayDirection, normal);
  vec3 reflectionOrigin = p + normal * 0.05;
  vec3 reflectionColor = getReflectionColor(reflectionOrigin, reflectionDirection, pixelCone * 2.0);

  float reflectionAmount = uReflectionStrength * (0.35 + uReflectionFresnel * fresnel);
  litColor = mix(litColor, reflectionColor, reflectionAmount);

  float fog = exp(-travel * uFogDensity);
  vec3 color = mix(effectiveBg, litColor, fog);

  if (uUseGlow)
    color += uFarGlowColor * glow;

  float farFade = smoothstep(uMaxDistance * 0.15, uMaxDistance, travel);
  color = mix(color, effectiveBg, farFade * 0.18);

  color *= uExposure;

  return color;
}

// -------------------- Main -----------------------------------

void main()
{
  vec2 uv = (gl_FragCoord.xy * 2.0 - uResolution) / uResolution.y;

  bool isBg;
  vec3 color = render(uv, isBg);

  if (isBg && uGreenScreen)
  {
    outColor = vec4(0.0, 1.0, 0.0, 1.0);
    return;
  }

  color = color / (0.8 + color);
  color = pow(max(color, 0.0), vec3(0.7645));

  outColor = vec4(color, 1.0);
}
`;

// Recompute values that depend on params
function updateDerived() {
  uniforms.uColorA.value.fromArray(params.colorA);
  uniforms.uColorB.value.fromArray(params.colorB);
  uniforms.uColorC.value.fromArray(params.colorC);
  uniforms.uFarGlowColor.value.fromArray(params.farGlowColor);

  if (params.greenScreen) {
    uniforms.uBackgroundColor.value.set(0.0, 1.0, 0.0);
    document.body.style.background = '#00ff00';
  } else {
    uniforms.uBackgroundColor.value
      .fromArray(params.backgroundColor)
      .multiplyScalar(params.backgroundIntensity);
    document.body.style.background = '#000000';
  }
  uniforms.uGreenScreen.value = params.greenScreen;

  uniforms.uExposure.value = params.exposure;
  uniforms.uAmbientIntensity.value = params.ambientIntensity;

  uniforms.uKeyLightDir.value.fromArray(params.keyLightDir);
  uniforms.uKeyLightColor.value.fromArray(params.keyLightColor);
  uniforms.uKeyLightIntensity.value = params.keyLightIntensity;

  uniforms.uFillLightDir.value.fromArray(params.fillLightDir);
  uniforms.uFillLightColor.value.fromArray(params.fillLightColor);
  uniforms.uFillLightIntensity.value = params.fillLightIntensity;

  uniforms.uEmissiveIntensity.value = params.emissiveIntensity;

  const g = params.farGlowColor;
  uniforms.uUseGlow.value = params.glowStrength !== 0 && (g[0] !== 0 || g[1] !== 0 || g[2] !== 0);

  uniforms.uMaxRelief.value = Math.max(params.fractalRelief, 0);
  uniforms.uPrimaryHitEpsilon.value = Math.max(0.002, Math.abs(params.surfaceEpsilon) * 0.02);
  uniforms.uReflectionHitEpsilon.value = Math.max(0.003, params.surfaceEpsilon * 0.8);
}
updateDerived();

// ============================================================
// Fullscreen triangle
// ============================================================
const geometry = new THREE.BufferGeometry();
geometry.setAttribute('position', new THREE.Float32BufferAttribute([
  -1, -1, 0,
   3, -1, 0,
  -1,  3, 0
], 3));

const material = new THREE.ShaderMaterial({
  glslVersion: THREE.GLSL3,
  vertexShader,
  fragmentShader,
  uniforms,
  depthTest: false,
  depthWrite: false
});

const quad = new THREE.Mesh(geometry, material);
quad.frustumCulled = false;
scene.add(quad);

// ============================================================
// Resize
// ============================================================
function resize() {
  if (!renderer) return;
  renderer.setPixelRatio(params.dpr);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.getDrawingBufferSize(uniforms.uResolution.value);
}
window.addEventListener('resize', resize);
resize();

// ============================================================
// Camera Math helpers
// ============================================================
const camEuler = new THREE.Euler(0, 0, 0, 'YXZ');
const camMatrix4 = new THREE.Matrix4();
const camMatrix3 = new THREE.Matrix3();

// ============================================================
// GUI & Settings
// ============================================================
const gui = new GUI({ title: 'Settings' });

function updateGuiDisplay(folder) {
  if (!folder) return;
  if (folder.controllers) {
    for (const c of folder.controllers) {
      c.updateDisplay();
    }
  }
  if (folder.folders) {
    for (const f of folder.folders) {
      updateGuiDisplay(f);
    }
  }
}

function bindNumber(folder, key, uniformName, min, max, step, label) {
  return folder.add(params, key, min, max, step).name(label).onChange((v) => {
    if (uniformName) uniforms[uniformName].value = v;
    updateDerived();
  });
}

// Procedural Theme & Scene Randomizer
function randomizeScene() {
  // 1. Random color scheme
  const schemeKeys = Object.keys(COLOR_SCHEMES);
  const randomSchemeKey = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
  params.colorScheme = randomSchemeKey;
  applyColorScheme(randomSchemeKey);

  // 2. Re-roll geometry
  params.corridorWidth = parseFloat((THREE.MathUtils.randFloat(3.5, 9.5)).toFixed(1));
  params.corridorHeight = parseFloat((THREE.MathUtils.randFloat(6.0, 16.0)).toFixed(1));
  params.fractalScale = parseFloat((THREE.MathUtils.randFloat(0.12, 0.42)).toFixed(2));
  params.fractalRelief = parseFloat((THREE.MathUtils.randFloat(1.8, 5.8)).toFixed(2));
  params.fractalDetail = parseFloat((THREE.MathUtils.randFloat(0.4, 1.4)).toFixed(2));
  params.fractalSteps = THREE.MathUtils.randInt(4, 9);

  // 3. Re-roll motion & animation
  const animKeys = [
    'Static (No Movement)',
    'Forward Cruise',
    'Gentle Orbit',
    'Corkscrew Twist',
    'Pendulum Sway',
    'Breathing Dive',
    'Infinity Wave (Figure-8)',
    'Panoramic Architecture Scan'
  ];
  params.animationType = animKeys[THREE.MathUtils.randInt(0, animKeys.length - 1)];
  params.cameraSpeed = parseFloat((THREE.MathUtils.randFloat(2.5, 8.5)).toFixed(1));
  params.fractalSpeed = parseFloat((THREE.MathUtils.randFloat(0.08, 0.40)).toFixed(2));
  params.animationSpeed = parseFloat((THREE.MathUtils.randFloat(0.7, 1.4)).toFixed(2));

  // 4. Re-roll lighting
  params.exposure = parseFloat((THREE.MathUtils.randFloat(0.85, 1.35)).toFixed(2));
  params.keyLightIntensity = parseFloat((THREE.MathUtils.randFloat(0.7, 1.5)).toFixed(2));
  params.fillLightIntensity = parseFloat((THREE.MathUtils.randFloat(0.2, 0.7)).toFixed(2));
  params.reflectionStrength = parseFloat((THREE.MathUtils.randFloat(0.5, 1.6)).toFixed(2));

  // Sync uniforms
  uniforms.uCorridorWidth.value = params.corridorWidth;
  uniforms.uCorridorHeight.value = params.corridorHeight;
  uniforms.uFractalScale.value = params.fractalScale;
  uniforms.uFractalRelief.value = params.fractalRelief;
  uniforms.uFractalDetail.value = params.fractalDetail;
  uniforms.uFractalSteps.value = params.fractalSteps;
  uniforms.uReflectionStrength.value = params.reflectionStrength;
  updateDerived();

  updateGuiDisplay(gui);
}

// Quick Randomize Controls
gui.add({ randomize: randomizeScene }, 'randomize').name('🎲 Randomize Scene');
gui.add(params, 'clickRandomize').name('Click Scene: Randomize');

// Color Schemes & Colors Folder
const fColors = gui.addFolder('Colors & Themes');

function applyColorScheme(name) {
  const scheme = COLOR_SCHEMES[name];
  if (!scheme) return;
  params.colorA = [...scheme.colorA];
  params.colorB = [...scheme.colorB];
  params.colorC = [...scheme.colorC];
  params.backgroundColor = [...scheme.backgroundColor];
  params.farGlowColor = [...scheme.farGlowColor];
  if (scheme.backgroundIntensity !== undefined) {
    params.backgroundIntensity = scheme.backgroundIntensity;
  }
  if (scheme.glowStrength !== undefined) {
    params.glowStrength = scheme.glowStrength;
    uniforms.uGlowStrength.value = params.glowStrength;
  }
  updateDerived();
  updateGuiDisplay(fColors);
  updateGuiDisplay(fLighting);
}

fColors.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Color Scheme').onChange(applyColorScheme);
fColors.add(params, 'greenScreen').name('Green Screen (#00ff00)').onChange(updateDerived);

fColors.addColor(params, 'colorA').name('Color A').onChange(updateDerived);
fColors.addColor(params, 'colorB').name('Color B').onChange(updateDerived);
fColors.addColor(params, 'colorC').name('Accent Color').onChange(updateDerived);
fColors.addColor(params, 'backgroundColor').name('Background Color').onChange(updateDerived);
bindNumber(fColors, 'backgroundIntensity', null, 0, 4, 0.01, 'Background Intensity');
fColors.addColor(params, 'farGlowColor').name('Glow Color').onChange(updateDerived);

fColors.add({
  invertAchromatic: () => {
    params.colorA = params.colorA.map(v => 1.0 - v);
    params.colorB = params.colorB.map(v => 1.0 - v);
    params.backgroundColor = params.backgroundColor.map(v => 1.0 - v);
    updateDerived();
    updateGuiDisplay(fColors);
  }
}, 'invertAchromatic').name('Invert B/W Scheme');

// Animations Folder
const fAnimation = gui.addFolder('Animation');
const ANIMATION_PRESETS = [
  'Static (No Movement)',
  'Forward Cruise',
  'Gentle Orbit',
  'Corkscrew Twist',
  'Pendulum Sway',
  'Breathing Dive',
  'Infinity Wave (Figure-8)',
  'Panoramic Architecture Scan'
];
fAnimation.add(params, 'animationType', ANIMATION_PRESETS).name('Preset Animation');
fAnimation.add(params, 'animationSpeed', 0.0, 3.0, 0.05).name('Anim Speed');
fAnimation.add(params, 'paused').name('Paused');
fAnimation.add({ reset: () => {
  uniforms.uTime.value = 0;
  uniforms.uCameraZ.value = 0;
  uniforms.uFractalTime.value = 0;
  animTime = 0;
} }, 'reset').name('Reset Time');

// Camera & View Folder
const fCamera = gui.addFolder('Camera & View');
bindNumber(fCamera, 'cameraSpeed', null, 0, 20, 0.1, 'Fly Speed');
fCamera.add(params, 'cameraFov', 0.25, 3.2, 0.01).name('FOV / Zoom').onChange((v) => {
  uniforms.uCameraFov.value = v;
});
fCamera.add(params, 'panX', -10, 10, 0.1).name('Pan X');
fCamera.add(params, 'panY', -15, 15, 0.1).name('Pan Y');
fCamera.add(params, 'camPitch', -1.5, 1.5, 0.01).name('Angle Pitch');
fCamera.add(params, 'camYaw', -Math.PI, Math.PI, 0.01).name('Angle Yaw');
fCamera.add(params, 'camRoll', -Math.PI, Math.PI, 0.01).name('Angle Roll');
fCamera.add({
  resetView: () => {
    params.panX = 0;
    params.panY = 0;
    params.camPitch = 0;
    params.camYaw = 0;
    params.camRoll = 0;
    params.cameraFov = 1.70;
    uniforms.uCameraFov.value = params.cameraFov;
    updateGuiDisplay(fCamera);
  }
}, 'resetView').name('Reset View');

// Lighting Folder
const fLighting = gui.addFolder('Lighting');
bindNumber(fLighting, 'exposure', 'uExposure', 0.1, 3.0, 0.05, 'Exposure (Intensity)');
bindNumber(fLighting, 'ambientIntensity', 'uAmbientIntensity', 0.0, 1.0, 0.02, 'Ambient Light');
bindNumber(fLighting, 'emissiveIntensity', 'uEmissiveIntensity', 0.0, 2.0, 0.05, 'Emissive Light');
bindNumber(fLighting, 'glowStrength', 'uGlowStrength', -10, 10, 0.01, 'Glow Strength');
bindNumber(fLighting, 'fogDensity', 'uFogDensity', 0, 0.1, 0.001, 'Fog Density');

// Key Light Subfolder
const fKeyLight = fLighting.addFolder('Key Light (Primary)');
fKeyLight.add(params, 'keyLightIntensity', 0.0, 3.0, 0.05).name('Intensity').onChange(updateDerived);
fKeyLight.addColor(params, 'keyLightColor').name('Color').onChange(updateDerived);
fKeyLight.add(params.keyLightDir, '0', -1.0, 1.0, 0.01).name('Dir X').onChange(updateDerived);
fKeyLight.add(params.keyLightDir, '1', -1.0, 1.0, 0.01).name('Dir Y').onChange(updateDerived);
fKeyLight.add(params.keyLightDir, '2', -1.0, 1.0, 0.01).name('Dir Z').onChange(updateDerived);

// Fill Light Subfolder
const fFillLight = fLighting.addFolder('Fill Light (Secondary)');
fFillLight.add(params, 'fillLightIntensity', 0.0, 2.0, 0.05).name('Intensity').onChange(updateDerived);
fFillLight.addColor(params, 'fillLightColor').name('Color').onChange(updateDerived);
fFillLight.add(params.fillLightDir, '0', -1.0, 1.0, 0.01).name('Dir X').onChange(updateDerived);
fFillLight.add(params.fillLightDir, '1', -1.0, 1.0, 0.01).name('Dir Y').onChange(updateDerived);
fFillLight.add(params.fillLightDir, '2', -1.0, 1.0, 0.01).name('Dir Z').onChange(updateDerived);

// Geometry Folder
const fGeometry = gui.addFolder('Geometry');
bindNumber(fGeometry, 'corridorWidth', 'uCorridorWidth', 1, 20, 0.1, 'Corridor Width');
bindNumber(fGeometry, 'corridorHeight', 'uCorridorHeight', 1, 30, 0.1, 'Corridor Height');

// Fractal Folder
const fFractal = gui.addFolder('Fractal');
bindNumber(fFractal, 'fractalScale', 'uFractalScale', 0.02, 1.0, 0.01, 'Scale');
bindNumber(fFractal, 'fractalSpeed', null, 0, 2, 0.01, 'Speed');
bindNumber(fFractal, 'fractalRelief', 'uFractalRelief', 0, 10, 0.01, 'Relief');
bindNumber(fFractal, 'fractalDetail', 'uFractalDetail', 0.05, 3, 0.01, 'Detail');
bindNumber(fFractal, 'fractalSteps', 'uFractalSteps', 1, 12, 1, 'Steps');

// Reflection Folder
const fReflection = gui.addFolder('Reflection');
bindNumber(fReflection, 'reflectionStrength', 'uReflectionStrength', 0, 2, 0.01, 'Strength');
bindNumber(fReflection, 'reflectionFresnel', 'uReflectionFresnel', 0, 2, 0.01, 'Fresnel');
bindNumber(fReflection, 'reflectionDistance', 'uReflectionDistance', 5, 200, 0.1, 'Distance');
bindNumber(fReflection, 'reflectionSteps', 'uReflectionSteps', 16, 600, 1, 'Steps');

// Ray Marching Quality Folder
const fQuality = gui.addFolder('Ray Marching');
bindNumber(fQuality, 'marchSteps', 'uMarchSteps', 32, 1024, 1, 'March Steps');
bindNumber(fQuality, 'maxDistance', 'uMaxDistance', 10, 200, 0.5, 'Max Distance');
bindNumber(fQuality, 'surfaceEpsilon', null, 0.001, 0.3, 0.001, 'Surface Epsilon');
bindNumber(fQuality, 'pixelConeScale', 'uPixelConeScale', 0, 2, 0.01, 'Pixel Cone Scale');
bindNumber(fQuality, 'normalEpsilon', 'uNormalEpsilon', 0.01, 3, 0.001, 'Normal Epsilon');
bindNumber(fQuality, 'boundMargin', 'uBoundMargin', 0, 1, 0.01, 'Bound Margin');

// Performance Folder
const fPerformance = gui.addFolder('Performance');
fPerformance.add(params, 'antialias').name('Antialiasing (MSAA)').onChange((enabled) => {
  renderer.setAnimationLoop(null);
  renderer.dispose();
  if (renderer.domElement && renderer.domElement.parentNode) {
    renderer.domElement.parentNode.removeChild(renderer.domElement);
  }
  renderer = createRenderer(enabled);
  setupAnimationLoop();
  resize();
});
fPerformance.add(params, 'dpr', 0.5, MAX_DPR, 0.05).name('DPR').onChange(resize);

gui.close();

// ============================================================
// Hide / Show UI with "H" key
// ============================================================
let isGuiVisible = true;
window.addEventListener('keydown', (e) => {
  if (e.key === 'h' || e.key === 'H') {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    isGuiVisible = !isGuiVisible;
    if (isGuiVisible) {
      if (typeof gui.show === 'function') gui.show();
      else gui.domElement.style.display = '';
    } else {
      if (typeof gui.hide === 'function') gui.hide();
      else gui.domElement.style.display = 'none';
    }
  }
});

// ============================================================
// Mouse & Gesture Controls: Drag across screen, Orbit & Zoom
// ============================================================
let isPointerDown = false;
let pointerButton = 0;
let pointerDownPos = { x: 0, y: 0, time: 0 };
let lastPointerPos = { x: 0, y: 0 };

window.addEventListener('pointerdown', (e) => {
  if (e.target.closest('.lil-gui')) return;
  isPointerDown = true;
  pointerButton = e.button;
  pointerDownPos = { x: e.clientX, y: e.clientY, time: performance.now() };
  lastPointerPos = { x: e.clientX, y: e.clientY };
});

window.addEventListener('pointermove', (e) => {
  if (!isPointerDown) return;
  const dx = e.clientX - lastPointerPos.x;
  const dy = e.clientY - lastPointerPos.y;
  lastPointerPos = { x: e.clientX, y: e.clientY };

  if (pointerButton === 2 || e.altKey || e.shiftKey) {
    // Rotate camera angle during navigation / orbit
    const rotSens = 0.005;
    params.camYaw += dx * rotSens;
    params.camPitch -= dy * rotSens;
    params.camPitch = THREE.MathUtils.clamp(params.camPitch, -1.5, 1.5);
  } else {
    // Drag object / corridor across screen (Pan X & Y)
    const panFactor = (params.cameraFov / window.innerHeight) * 4.0;
    params.panX -= dx * panFactor;
    params.panY += dy * panFactor;
  }
  updateGuiDisplay(fCamera);
});

window.addEventListener('pointerup', (e) => {
  if (!isPointerDown) return;
  isPointerDown = false;
  if (e.target.closest('.lil-gui')) return;

  const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
  const duration = performance.now() - pointerDownPos.time;

  // On quick click/tap on scene: Randomize procedural variation
  if (dist < 6 && duration < 350) {
    if (params.clickRandomize) {
      randomizeScene();
    }
  }
});

// Prevent context menu on canvas for right-click rotation
window.addEventListener('contextmenu', (e) => {
  if (!e.target.closest('.lil-gui')) {
    e.preventDefault();
  }
});

// Zoom with mouse wheel (modulates user zoom without resetting)
window.addEventListener('wheel', (e) => {
  if (e.target.closest('.lil-gui')) return;
  e.preventDefault();
  const zoomDelta = e.deltaY * 0.0015;
  params.cameraFov = THREE.MathUtils.clamp(params.cameraFov + zoomDelta, 0.25, 3.2);
  uniforms.uCameraFov.value = params.cameraFov;
  updateGuiDisplay(fCamera);
}, { passive: false });

// ============================================================
// Animation Loop & Camera Updates
// ============================================================
const clock = new THREE.Clock();
let animTime = 0;

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) clock.getDelta();
});

function updateAnimation(delta) {
  if (params.paused) return;

  const speed = delta * params.animationSpeed;
  animTime += speed;
  uniforms.uTime.value += speed;
  uniforms.uFractalTime.value += speed * params.fractalSpeed;

  let animPosX = 0;
  let animPosY = 0;
  let animPitch = 0;
  let animYaw = 0;
  let animRoll = 0;
  let animFovMultiplier = 1.0;

  switch (params.animationType) {
    case 'Static (No Movement)':
      // Camera is completely stationary: no Z movement, no camera sway
      break;

    case 'Forward Cruise':
      uniforms.uCameraZ.value += speed * params.cameraSpeed;
      break;

    case 'Gentle Orbit':
      uniforms.uCameraZ.value += speed * params.cameraSpeed;
      animPosX = Math.cos(animTime * 0.4) * 0.85;
      animPosY = Math.sin(animTime * 0.4) * 0.65;
      animYaw = Math.sin(animTime * 0.4) * 0.12;
      animPitch = Math.cos(animTime * 0.4) * 0.08;
      break;

    case 'Corkscrew Twist':
      uniforms.uCameraZ.value += speed * params.cameraSpeed;
      animPosX = Math.sin(animTime * 0.3) * 0.7;
      animPosY = Math.cos(animTime * 0.3) * 0.5;
      animRoll = Math.sin(animTime * 0.3) * 0.35;
      animYaw = Math.cos(animTime * 0.3) * 0.12;
      break;

    case 'Pendulum Sway':
      uniforms.uCameraZ.value += speed * params.cameraSpeed;
      animPosX = Math.sin(animTime * 0.5) * 1.5;
      animYaw = Math.sin(animTime * 0.5) * 0.18;
      animRoll = -Math.cos(animTime * 0.5) * 0.12;
      break;

    case 'Breathing Dive':
      uniforms.uCameraZ.value += speed * params.cameraSpeed;
      animPosY = Math.sin(animTime * 0.4) * 1.0;
      animPitch = Math.cos(animTime * 0.4) * 0.12;
      animFovMultiplier = 1.0 + Math.sin(animTime * 0.35) * 0.08;
      break;

    case 'Infinity Wave (Figure-8)':
      uniforms.uCameraZ.value += speed * params.cameraSpeed;
      animPosX = Math.sin(animTime * 0.35) * 1.4;
      animPosY = Math.sin(animTime * 0.70) * 0.85;
      animYaw = Math.cos(animTime * 0.35) * 0.16;
      animPitch = Math.cos(animTime * 0.70) * 0.10;
      break;

    case 'Panoramic Architecture Scan':
      uniforms.uCameraZ.value += speed * (params.cameraSpeed * 0.5);
      animYaw = Math.sin(animTime * 0.25) * 0.42;
      animPitch = Math.sin(animTime * 0.18) * 0.28;
      animPosX = Math.sin(animTime * 0.25) * 0.7;
      animPosY = Math.cos(animTime * 0.18) * 0.9;
      break;
  }

  // Combine user adjustments with animation offsets
  const effectivePosX = params.panX + animPosX;
  const effectivePosY = params.panY + animPosY;
  const effectivePitch = params.camPitch + animPitch;
  const effectiveYaw = params.camYaw + animYaw;
  const effectiveRoll = params.camRoll + animRoll;

  // Keep camera inside corridor bounds
  const boundMarginX = Math.max(0.2, params.corridorWidth - 0.8);
  const boundMarginY = Math.max(0.2, params.corridorHeight - 0.8);
  const clampedX = THREE.MathUtils.clamp(effectivePosX, -boundMarginX, boundMarginX);
  const clampedY = THREE.MathUtils.clamp(effectivePosY, -boundMarginY, boundMarginY);

  uniforms.uCameraPos.value.set(clampedX, clampedY, uniforms.uCameraZ.value);

  // Compute camera rotation matrix from Euler angles
  camEuler.set(effectivePitch, effectiveYaw, effectiveRoll, 'YXZ');
  camMatrix4.makeRotationFromEuler(camEuler);
  camMatrix3.setFromMatrix4(camMatrix4);
  uniforms.uCameraRot.value.copy(camMatrix3);

  // Apply zoom factor smoothly on top of user's zoom (never resets user's zoom)
  uniforms.uCameraFov.value = params.cameraFov * animFovMultiplier;
}

function animate() {
  const delta = Math.min(clock.getDelta(), 0.1);
  updateAnimation(delta);
  renderer.render(scene, camera);
}

function setupAnimationLoop() {
  renderer.setAnimationLoop(animate);
}

setupAnimationLoop();
</script>
