<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swarm Simulation</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    #app {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
<div id="app">
  <renderer ref="renderer" resize="window" :auto-clear="false" mouse-move mouse-raycast :orbit-ctrl="orbitOptions" :antialias="true">
    <camera ref="camera" :position="{ z: 300 }"></camera>
    <scene ref="scene" :background="currentBg">
      <ambient-light ref="ambLight" :color="params.ambientColor" :intensity="params.ambientIntensity * params.sceneIntensity"></ambient-light>
      <point-light ref="light1" :color="params.light1Color" :intensity="params.light1Intensity * params.sceneIntensity"></point-light>
      <point-light ref="light2" :color="params.light2Color" :intensity="params.light2Intensity * params.sceneIntensity"></point-light>
      <point-light ref="light3" :color="params.light3Color" :intensity="params.light3Intensity * params.sceneIntensity" :position="{ x: params.light3PosX }"></point-light>
      <point-light ref="light4" :color="params.light4Color" :intensity="params.light4Intensity * params.sceneIntensity" :position="{ x: params.light4PosX }"></point-light>

      <instanced-mesh ref="imesh" :count="NUM_INSTANCES">
        <box-geometry ref="geom" :width="params.boxWidth" :height="params.boxHeight" :depth="params.boxDepth"></box-geometry>
        <standard-material ref="mat" transparent :opacity="params.opacity" :metalness="params.metalness" :roughness="params.roughness" :color="params.meshColor"></standard-material>
      </instanced-mesh>
    </scene>

    <effect-composer ref="composer">
      <render-pass ref="rPass"></render-pass>
      <unreal-bloom-pass ref="bloomPass" :strength="params.bloomStrength"></unreal-bloom-pass>
      <halftone-pass ref="halfPass" :radius="params.halftoneRadius" :scatter="params.halftoneScatter"></halftone-pass>
      <fxaa-pass ref="fxaaPass"></fxaa-pass>
    </effect-composer>
  </renderer>
</div>

<script type="module">

  MathUtils,

  Color,
  BoxGeometry,

import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

const ANIMATIONS = [
  'Static (No camera move)',
  'Smooth Orbit',
  'Slow Figure-8 (Infinity)',
  'Gentle Spiral Ascent',
  'Breathing Pendulum',
  'Floating Wave',
  'Deep Dolly Drift',
  'Cinematic Fly-Around'
];

createApp({
  setup() {
    const NUM_INSTANCES = 2000;
    const instances = [];
    const target = new Vector3();
    const dummyO = new Object3D();
    const dummyV = new Vector3();
    const clock = new Clock();
    const spherical = new Spherical();
    const camOffset = new Vector3();

    const params = {
      // Color Schemes & Greenscreen
      colorScheme: 'Original',
      greenscreen: false,
      greenscreenColor: '#00ff00',
      bgColor: '#000000',

      // Lighting & Exposure
      exposure: 1.0,
      sceneIntensity: 1.0,
      ambientColor: '#808080',
      ambientIntensity: 1.0,
      light1Color: '#ff6000',
      light1Intensity: 1.0,
      light2Color: '#0060ff',
      light2Intensity: 0.5,
      light3Color: '#ff6000',
      light3Intensity: 0.5,
      light3PosX: 100,
      light4Color: '#0000ff',
      light4Intensity: 0.5,
      light4PosX: -100,

      // Material & Geometry
      boxWidth: 2,
      boxHeight: 2,
      boxDepth: 10,
      meshColor: '#ffffff',
      emissive: '#000000',
      metalness: 0.8,
      roughness: 0.5,
      opacity: 0.9,

      // Swarm Motion
      attraction: 0.03,
      vlimit: 1.2,
      speed: 1.0,

      // Camera & Animation
      animation: 'Smooth Orbit',
      dragMode: 'Rotate (Orbit)',

      // Post-Processing & Renderer
      bloomStrength: 1.0,
      halftoneRadius: 1.0,
      halftoneScatter: 0.0,
      dpr: Math.min(window.devicePixelRatio || 1, 2),
      antialias: true,

      // Procedural Click
      clickToRandomize: true
    };

    const orbitOptions = {
      enableDamping: true,
      dampingFactor: 0.05,
      enableZoom: true,
      zoomSpeed: 1.2,
      enablePan: true,
      panSpeed: 1.0,
      screenSpacePanning: true,
      minDistance: 20,
      maxDistance: 1500
    };

    for (let i = 0; i < NUM_INSTANCES; i++) {
      instances.push({
        position: new Vector3(rndFS(200), rndFS(200), rndFS(200)),
        scale: rnd(0.2, 1),
        scaleZ: rnd(0.1, 1),
        velocity: new Vector3(rndFS(2), rndFS(2), rndFS(2)),
        attraction: 0.03 + rnd(-0.01, 0.01),
        vlimit: 1.2 + rnd(-0.1, 0.1),
      });
    }

    return {
      NUM_INSTANCES,
      instances,
      target,
      dummyO,
      dummyV,
      clock,
      spherical,
      camOffset,
      params,
      orbitOptions,
      currentBg: '#000000',
      animTime: 0
    };
  },
  mounted() {
    this.renderer = this.$refs.renderer;
    this.imesh = this.$refs.imesh.mesh;
    this.mat = this.$refs.mat.material;
    this.camera = this.$refs.camera.camera;
    this.ambLight = this.$refs.ambLight.light;
    this.light1 = this.$refs.light1.light;
    this.light2 = this.$refs.light2.light;
    this.light3 = this.$refs.light3.light;
    this.light4 = this.$refs.light4.light;
    this.bloomPass = this.$refs.bloomPass.pass;
    this.halfPass = this.$refs.halfPass.pass;
    this.fxaaPass = this.$refs.fxaaPass.pass;

    this.init();
  },
  methods: {
    init() {
      // Setup initial matrix for instances
      for (let i = 0; i < this.NUM_INSTANCES; i++) {
        const { position, scale, scaleZ } = this.instances[i];
        this.dummyO.position.copy(position);
        this.dummyO.scale.set(scale, scale, scaleZ);
        this.dummyO.updateMatrix();
        this.imesh.setMatrixAt(i, this.dummyO.matrix);
      }
      this.imesh.instanceMatrix.needsUpdate = true;

      // Orbit controls reference
      this.orbitCtrl = this.renderer.three.orbitCtrl;
      if (this.orbitCtrl) {
        this.orbitCtrl.enableZoom = true;
        this.orbitCtrl.enablePan = true;
        this.orbitCtrl.screenSpacePanning = true;
        this.orbitCtrl.enableDamping = true;
        this.orbitCtrl.dampingFactor = 0.05;
        this.orbitCtrl.mouseButtons = {
          LEFT: MOUSE.ROTATE,
          MIDDLE: MOUSE.DOLLY,
          RIGHT: MOUSE.PAN
        };
      }

      // Configure DPR and Antialias
      if (this.renderer.three.renderer) {
        this.renderer.three.renderer.setPixelRatio(this.params.dpr);
      }
      if (this.fxaaPass) {
        this.fxaaPass.enabled = this.params.antialias;
      }

      // Setup GUI
      this.initGui();

      // Setup keyboard shortcut "H" to hide/show UI
      window.addEventListener('keydown', (e) => {
        if (e.key === 'h' || e.key === 'H') {
          if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName)) return;
          if (this.gui) {
            this.gui._hidden = !this.gui._hidden;
            this.gui.show(!this.gui._hidden);
            this.gui.domElement.style.display = this.gui._hidden ? 'none' : '';
          }
        }
      });

      // Setup click on scene for procedural randomize
      const dom = this.renderer.three.renderer.domElement;
      let pointerDownPos = { x: 0, y: 0 };
      let pointerDownTime = 0;

      dom.addEventListener('pointerdown', (e) => {
        pointerDownPos = { x: e.clientX, y: e.clientY };
        pointerDownTime = performance.now();
      });

      dom.addEventListener('pointerup', (e) => {
        const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
        const duration = performance.now() - pointerDownTime;
        // Fast click without drag
        if (dist < 5 && duration < 300) {
          if (this.params.clickToRandomize) {
            this.randomizeProcedural();
          }
        }
      });

      // Apply initial scene settings
      this.updateBackground();
      this.updateLights();
      this.updatePostProcessing();

      // Start render animation callback
      this.renderer.onBeforeRender(this.animate);
    },

    updateBackground() {
      const color = this.params.greenscreen ? this.params.greenscreenColor : this.params.bgColor;
      this.currentBg = color;
      if (this.renderer && this.renderer.three && this.renderer.three.scene) {
        this.renderer.three.scene.background = new Color(color);
        this.renderer.three.renderer.setClearColor(color, 1);
      }
    },

    applyColorScheme(schemeName) {
      const scheme = COLOR_SCHEMES[schemeName];
      if (!scheme) return;

      this.params.bgColor = scheme.bg;
      this.params.meshColor = scheme.meshColor;
      this.params.emissive = scheme.emissive;
      this.params.ambientColor = scheme.ambientColor;
      this.params.light1Color = scheme.light1Color;
      this.params.light2Color = scheme.light2Color;
      this.params.light3Color = scheme.light3Color;
      this.params.light4Color = scheme.light4Color;
      if (scheme.bloomStrength !== undefined) this.params.bloomStrength = scheme.bloomStrength;
      if (scheme.halftoneRadius !== undefined) this.params.halftoneRadius = scheme.halftoneRadius;

      this.updateBackground();
      this.updateMaterial();
      this.updateLights();
      this.updatePostProcessing();
      this.updateGuiDisplay();
    },

    updateGeometry() {
      if (this.imesh) {
        if (this.imesh.geometry) {
          this.imesh.geometry.dispose();
        }
        this.imesh.geometry = new BoxGeometry(
          this.params.boxWidth,
          this.params.boxHeight,
          this.params.boxDepth
        );
      }
    },

    updateMaterial() {
      if (this.mat) {
        this.mat.color.set(this.params.meshColor);
        this.mat.emissive.set(this.params.emissive);
        this.mat.metalness = this.params.metalness;
        this.mat.roughness = this.params.roughness;
        this.mat.opacity = this.params.opacity;
        this.mat.transparent = this.params.opacity < 1.0;
        this.mat.needsUpdate = true;
      }
    },

    updateLights() {
      const si = this.params.sceneIntensity;
      if (this.ambLight) {
        this.ambLight.color.set(this.params.ambientColor);
        this.ambLight.intensity = this.params.ambientIntensity * si;
      }
      if (this.light1) {
        this.light1.color.set(this.params.light1Color);
        this.light1.intensity = this.params.light1Intensity * si;
      }
      if (this.light2) {
        this.light2.color.set(this.params.light2Color);
        this.light2.intensity = this.params.light2Intensity * si;
      }
      if (this.light3) {
        this.light3.color.set(this.params.light3Color);
        this.light3.intensity = this.params.light3Intensity * si;
        this.light3.position.x = this.params.light3PosX;
      }
      if (this.light4) {
        this.light4.color.set(this.params.light4Color);
        this.light4.intensity = this.params.light4Intensity * si;
        this.light4.position.x = this.params.light4PosX;
      }
      if (this.renderer && this.renderer.three && this.renderer.three.renderer) {
        this.renderer.three.renderer.toneMappingExposure = this.params.exposure;
      }
    },

    updatePostProcessing() {
      if (this.bloomPass) {
        this.bloomPass.strength = this.params.bloomStrength;
      }
      if (this.halfPass && this.halfPass.uniforms) {
        if (this.halfPass.uniforms.radius) this.halfPass.uniforms.radius.value = this.params.halftoneRadius;
        if (this.halfPass.uniforms.scatter) this.halfPass.uniforms.scatter.value = this.params.halftoneScatter;
      }
    },

    updateDPR(val) {
      if (!this.renderer || !this.renderer.three || !this.renderer.three.renderer) return;
      const r = this.renderer.three.renderer;
      r.setPixelRatio(val);
      const w = window.innerWidth;
      const h = window.innerHeight;
      r.setSize(w, h, false);
      if (this.renderer.three.composer) {
        this.renderer.three.composer.setSize(w, h);
      }
      if (this.fxaaPass && this.fxaaPass.material) {
        this.fxaaPass.material.uniforms['resolution'].value.x = 1 / (w * val);
        this.fxaaPass.material.uniforms['resolution'].value.y = 1 / (h * val);
      }
    },

    updateDragMode(mode) {
      if (!this.orbitCtrl) return;
      if (mode === 'Pan (Drag Scene)') {
        this.orbitCtrl.mouseButtons.LEFT = MOUSE.PAN;
      } else {
        this.orbitCtrl.mouseButtons.LEFT = MOUSE.ROTATE;
      }
      this.orbitCtrl.mouseButtons.RIGHT = MOUSE.PAN;
    },

    randomizeProcedural() {
      // 1. Pick a random color scheme from 19 schemes
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      this.params.colorScheme = randomScheme;
      const scheme = COLOR_SCHEMES[randomScheme];

      this.params.bgColor = scheme.bg;
      this.params.meshColor = scheme.meshColor;
      this.params.emissive = scheme.emissive;
      this.params.ambientColor = scheme.ambientColor;
      this.params.light1Color = scheme.light1Color;
      this.params.light2Color = scheme.light2Color;
      this.params.light3Color = scheme.light3Color;
      this.params.light4Color = scheme.light4Color;

      // 2. Re-roll geometric parameters
      this.params.boxWidth = +(rnd(0.8, 3.5)).toFixed(1);
      this.params.boxHeight = +(rnd(0.8, 3.5)).toFixed(1);
      this.params.boxDepth = +(rnd(5, 25)).toFixed(1);
      this.params.metalness = +(rnd(0.2, 0.95)).toFixed(2);
      this.params.roughness = +(rnd(0.1, 0.85)).toFixed(2);
      this.params.opacity = +(rnd(0.7, 1.0)).toFixed(2);

      // 3. Re-roll motion parameters
      this.params.attraction = +(rnd(0.015, 0.06)).toFixed(3);
      this.params.vlimit = +(rnd(0.7, 2.4)).toFixed(2);
      this.params.speed = +(rnd(0.5, 1.8)).toFixed(2);

      // Re-roll per-instance parameters
      for (let i = 0; i < this.NUM_INSTANCES; i++) {
        this.instances[i].scale = rnd(0.2, 1.2);
        this.instances[i].scaleZ = rnd(0.1, 1.2);
        this.instances[i].attraction = this.params.attraction + rnd(-0.01, 0.01);
        this.instances[i].vlimit = this.params.vlimit + rnd(-0.15, 0.15);
      }

      // 4. Re-roll post-processing parameters
      this.params.bloomStrength = +(rnd(0.4, 2.2)).toFixed(2);
      this.params.halftoneRadius = +(rnd(0.5, 2.5)).toFixed(2);
      this.params.halftoneScatter = +(rnd(0.0, 0.4)).toFixed(2);

      // 5. Update scene
      this.updateBackground();
      this.updateGeometry();
      this.updateMaterial();
      this.updateLights();
      this.updatePostProcessing();

      // 6. Update GUI display
      this.updateGuiDisplay();
    },

    updateGuiDisplay() {
      if (!this.gui) return;
      this.gui.controllersRecursive().forEach(c => c.updateDisplay());
    },

    initGui() {
      const gui = new GUI({ title: 'Scene Controls' });
      this.gui = gui;

      // Color Themes & Greenscreen
      const themeFolder = gui.addFolder('Themes & Background');
      themeFolder.add(this.params, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Color Scheme').onChange((v) => {
        this.applyColorScheme(v);
      });
      themeFolder.add(this.params, 'greenscreen').name('Greenscreen (#00ff00)').onChange(() => {
        this.updateBackground();
      });
      themeFolder.addColor(this.params, 'greenscreenColor').name('Greenscreen Color').onChange(() => {
        this.updateBackground();
      });
      themeFolder.addColor(this.params, 'bgColor').name('Background Color').onChange(() => {
        this.updateBackground();
      });

      // Procedural Generation
      const proceduralFolder = gui.addFolder('Procedural Randomizer');
      proceduralFolder.add(this.params, 'clickToRandomize').name('Click Scene to Re-roll');
      proceduralFolder.add({ randomize: () => this.randomizeProcedural() }, 'randomize').name('⚡ Randomize Now');

      // Camera & Motion
      const animFolder = gui.addFolder('Camera & Animation');
      animFolder.add(this.params, 'animation', ANIMATIONS).name('Camera Animation');
      animFolder.add(this.params, 'speed', 0.0, 3.0, 0.05).name('Animation Speed');
      animFolder.add(this.params, 'dragMode', ['Rotate (Orbit)', 'Pan (Drag Scene)']).name('Left Mouse Drag').onChange((v) => {
        this.updateDragMode(v);
      });

      // Lighting & Exposure
      const lightFolder = gui.addFolder('Lighting & Exposure');
      lightFolder.add(this.params, 'exposure', 0.1, 3.0, 0.05).name('Scene Exposure').onChange(() => {
        this.updateLights();
      });
      lightFolder.add(this.params, 'sceneIntensity', 0.1, 3.0, 0.05).name('Master Light Multiplier').onChange(() => {
        this.updateLights();
      });

      const ambFolder = lightFolder.addFolder('Ambient Light').close();
      ambFolder.addColor(this.params, 'ambientColor').name('Color').onChange(() => this.updateLights());
      ambFolder.add(this.params, 'ambientIntensity', 0.0, 3.0, 0.05).name('Intensity').onChange(() => this.updateLights());

      const l1Folder = lightFolder.addFolder('Point Light 1 (Main)').close();
      l1Folder.addColor(this.params, 'light1Color').name('Color').onChange(() => this.updateLights());
      l1Folder.add(this.params, 'light1Intensity', 0.0, 5.0, 0.05).name('Intensity').onChange(() => this.updateLights());

      const l2Folder = lightFolder.addFolder('Point Light 2 (Target Follower)').close();
      l2Folder.addColor(this.params, 'light2Color').name('Color').onChange(() => this.updateLights());
      l2Folder.add(this.params, 'light2Intensity', 0.0, 5.0, 0.05).name('Intensity').onChange(() => this.updateLights());

      const l3Folder = lightFolder.addFolder('Point Light 3 (+X Offset)').close();
      l3Folder.addColor(this.params, 'light3Color').name('Color').onChange(() => this.updateLights());
      l3Folder.add(this.params, 'light3Intensity', 0.0, 5.0, 0.05).name('Intensity').onChange(() => this.updateLights());
      l3Folder.add(this.params, 'light3PosX', -300, 300, 5).name('Position X').onChange(() => this.updateLights());

      const l4Folder = lightFolder.addFolder('Point Light 4 (-X Offset)').close();
      l4Folder.addColor(this.params, 'light4Color').name('Color').onChange(() => this.updateLights());
      l4Folder.add(this.params, 'light4Intensity', 0.0, 5.0, 0.05).name('Intensity').onChange(() => this.updateLights());
      l4Folder.add(this.params, 'light4PosX', -300, 300, 5).name('Position X').onChange(() => this.updateLights());

      // Geometry & Material
      const geomFolder = gui.addFolder('Geometry & Material');
      geomFolder.add(this.params, 'boxWidth', 0.2, 8.0, 0.1).name('Box Width').onChange(() => this.updateGeometry());
      geomFolder.add(this.params, 'boxHeight', 0.2, 8.0, 0.1).name('Box Height').onChange(() => this.updateGeometry());
      geomFolder.add(this.params, 'boxDepth', 1.0, 40.0, 0.5).name('Box Depth').onChange(() => this.updateGeometry());
      geomFolder.addColor(this.params, 'meshColor').name('Color').onChange(() => this.updateMaterial());
      geomFolder.addColor(this.params, 'emissive').name('Emissive').onChange(() => this.updateMaterial());
      geomFolder.add(this.params, 'metalness', 0.0, 1.0, 0.01).name('Metalness').onChange(() => this.updateMaterial());
      geomFolder.add(this.params, 'roughness', 0.0, 1.0, 0.01).name('Roughness').onChange(() => this.updateMaterial());
      geomFolder.add(this.params, 'opacity', 0.05, 1.0, 0.01).name('Opacity').onChange(() => this.updateMaterial());

      // Swarm Physics
      const swarmFolder = gui.addFolder('Swarm Physics').close();
      swarmFolder.add(this.params, 'attraction', 0.005, 0.1, 0.002).name('Attraction');
      swarmFolder.add(this.params, 'vlimit', 0.2, 4.0, 0.05).name('Velocity Limit');

      // Post-Processing & Renderer
      const postFolder = gui.addFolder('Post-Processing & Renderer');
      postFolder.add(this.params, 'bloomStrength', 0.0, 3.0, 0.05).name('Bloom Strength').onChange(() => this.updatePostProcessing());
      postFolder.add(this.params, 'halftoneRadius', 0.0, 5.0, 0.05).name('Halftone Radius').onChange(() => this.updatePostProcessing());
      postFolder.add(this.params, 'halftoneScatter', 0.0, 2.0, 0.05).name('Halftone Scatter').onChange(() => this.updatePostProcessing());
      postFolder.add(this.params, 'dpr', 0.5, 3.0, 0.1).name('Pixel Ratio (DPR)').onChange((v) => this.updateDPR(v));
      postFolder.add(this.params, 'antialias').name('Antialias').onChange((v) => {
        if (this.fxaaPass) this.fxaaPass.enabled = v;
      });
    },

    animate() {
      const dt = this.clock.getDelta();
      const spd = this.params.speed;
      this.animTime += dt * spd;

      // Swarm target follows mouse raycast
      this.target.copy(this.renderer.three.mouseV3);
      if (this.light2) {
        this.light2.position.copy(this.target);
      }

      // Swarm particle integration
      if (spd > 0) {
        for (let i = 0; i < this.NUM_INSTANCES; i++) {
          const inst = this.instances[i];

          this.dummyV.copy(this.target).sub(inst.position).normalize().multiplyScalar(this.params.attraction * spd);
          inst.velocity.add(this.dummyV).clampScalar(-this.params.vlimit, this.params.vlimit);
          inst.position.addScaledVector(inst.velocity, spd);

          this.dummyO.position.copy(inst.position);
          this.dummyO.scale.set(inst.scale, inst.scale, inst.scaleZ);
          this.dummyO.lookAt(this.dummyV.copy(inst.position).add(inst.velocity));
          this.dummyO.updateMatrix();
          this.imesh.setMatrixAt(i, this.dummyO.matrix);
        }
        this.imesh.instanceMatrix.needsUpdate = true;
      }

      // Camera Animation (preserves user zoom and manual angle adjustments!)
      const cam = this.camera;
      const ctrl = this.orbitCtrl;

      if (cam && ctrl && this.params.animation !== 'Static (No camera move)') {
        // Read current offset relative to orbit target
        this.camOffset.copy(cam.position).sub(ctrl.target);
        this.spherical.setFromVector3(this.camOffset);

        const anim = this.params.animation;
        const time = this.animTime;

        if (anim === 'Smooth Orbit') {
          this.spherical.theta += 0.003 * spd;
        } else if (anim === 'Slow Figure-8 (Infinity)') {
          this.spherical.theta += 0.0025 * spd;
          const phiDelta = Math.sin(time * 0.8) * 0.0015 * spd;
          this.spherical.phi = clamp(this.spherical.phi + phiDelta, 0.2, Math.PI - 0.2);
        } else if (anim === 'Gentle Spiral Ascent') {
          this.spherical.theta += 0.0035 * spd;
          const phiDelta = Math.sin(time * 0.4) * 0.002 * spd;
          this.spherical.phi = clamp(this.spherical.phi + phiDelta, 0.3, Math.PI - 0.3);
        } else if (anim === 'Breathing Pendulum') {
          this.spherical.theta += Math.cos(time * 0.5) * 0.003 * spd;
          const phiDelta = Math.sin(time * 0.25) * 0.001 * spd;
          this.spherical.phi = clamp(this.spherical.phi + phiDelta, 0.3, Math.PI - 0.3);
        } else if (anim === 'Floating Wave') {
          this.spherical.theta += 0.002 * spd;
          const phiDelta = Math.sin(time * 1.1) * 0.0025 * spd;
          this.spherical.phi = clamp(this.spherical.phi + phiDelta, 0.25, Math.PI - 0.25);
        } else if (anim === 'Deep Dolly Drift') {
          this.spherical.theta += 0.0015 * spd;
          const phiDelta = Math.sin(time * 0.4) * 0.001 * spd;
          this.spherical.phi = clamp(this.spherical.phi + phiDelta, 0.2, Math.PI - 0.2);
        } else if (anim === 'Cinematic Fly-Around') {
          this.spherical.theta += 0.0028 * spd;
          const phiDelta = (Math.sin(time * 0.45) * 0.0018 + Math.cos(time * 0.22) * 0.001) * spd;
          this.spherical.phi = clamp(this.spherical.phi + phiDelta, 0.2, Math.PI - 0.2);
        }

        // Apply updated spherical coordinates back to camera
        this.camOffset.setFromSpherical(this.spherical);
        cam.position.copy(ctrl.target).add(this.camOffset);
        cam.lookAt(ctrl.target);
      }
    }
  }
}).mount('#app');
</script>
</body>
</html>
