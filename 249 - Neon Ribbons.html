<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    />

    <title>Neon Ribbons</title>

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #000000;
            user-select: none;
            -webkit-user-select: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
            cursor: grab;
        }

        canvas:active {
            cursor: grabbing;
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
            "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
        }
    }

</head>

<body>

<script type="module">

import * as THREE from "three";
import GUI from "lil-gui";


// ============================================================
// Main parameters & Constants
// ============================================================

const MAX_BANDS = 8;

const COLOR_PRESETS = {
    "Cyberpunk Neon": 0,
    "Acid Sunset": 1,
    "Bioluminescence": 2,
    "Ultraviolet": 3,
    "Solar Flare": 4,
    "Custom": 5
};

const params = {

    theme: {
        colorScheme: "Cyberpunk Neon",
        customColor1: "#00e5ff",
        customColor2: "#ff007f",
        greenscreen: false
    },

    animation: {
        preset: "Cosmic Drift",
        timeScale: 0.7
    },

    geometry: {
        bandCount: 4,
        bandThickness: 0.08
    },

    material: {
        lightFalloff: 23.4,
        coreRadius: 0.07,
        lightGain: 0.04,
        colorRate: 0.25
    },

    view: {
        zoom: 1.0,
        offsetX: 0.0,
        offsetY: 0.0,
        resetView: function() {
            params.view.zoom = 1.0;
            params.view.offsetX = 0.0;
            params.view.offsetY = 0.0;
            updateGuiDisplay();
        }
    },

    interaction: {
        clickToRandomize: true,
        randomizeNow: function() {
            randomizeScene();
        }
    },

    performance: {
        dpr: 1
    }

};


// ============================================================
// Renderer
// ============================================================

const renderer = new THREE.WebGLRenderer({
    antialias: false,
    alpha: false,
    powerPreference: "high-performance"
});

renderer.setPixelRatio(params.performance.dpr);
renderer.setSize(
    window.innerWidth,
    window.innerHeight,
    false
);

renderer.setClearColor(0x000000, 1);

renderer.toneMapping = THREE.NoToneMapping;
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;

document.body.appendChild(renderer.domElement);


// ============================================================
// Scene & Camera
// ============================================================

const scene = new THREE.Scene();

const camera = new THREE.OrthographicCamera(
    -1,
    1,
    1,
    -1,
    0,
    1
);


// ============================================================
// Resolution
// ============================================================

const drawingBufferSize = new THREE.Vector2();

renderer.getDrawingBufferSize(
    drawingBufferSize
);


// ============================================================
// Uniforms
// ============================================================

const uniforms = {

    iTime: {
        value: 0
    },

    iResolution: {
        value: drawingBufferSize.clone()
    },

    uOffset: {
        value: new THREE.Vector2(params.view.offsetX, params.view.offsetY)
    },

    uZoom: {
        value: params.view.zoom
    },

    uColorScheme: {
        value: COLOR_PRESETS[params.theme.colorScheme]
    },

    uCustomColor1: {
        value: new THREE.Color(params.theme.customColor1)
    },

    uCustomColor2: {
        value: new THREE.Color(params.theme.customColor2)
    },

    uGreenScreen: {
        value: params.theme.greenscreen ? 1.0 : 0.0
    },

    uLightFalloff: {
        value: params.material.lightFalloff
    },

    uCoreRadius: {
        value: params.material.coreRadius
    },

    uLightGain: {
        value: params.material.lightGain
    },

    uBandThickness: {
        value: params.geometry.bandThickness
    },

    uColorRate: {
        value: params.material.colorRate
    },

    uBandCount: {
        value: params.geometry.bandCount
    }

};


// ============================================================
// Vertex shader
// ============================================================

const vertexShader = /* glsl */`

void main()
{
    gl_Position = vec4(
        position.xy,
        0.0,
        1.0
    );
}

`;


// ============================================================
// Fragment shader
// ============================================================

const fragmentShader = /* glsl */`

precision highp float;
precision highp int;

uniform float iTime;
uniform vec2 iResolution;

uniform vec2 uOffset;
uniform float uZoom;

uniform int uColorScheme;
uniform vec3 uCustomColor1;
uniform vec3 uCustomColor2;
uniform float uGreenScreen;

uniform float uLightFalloff;
uniform float uCoreRadius;
uniform float uLightGain;

uniform float uBandThickness;
uniform float uColorRate;

uniform int uBandCount;

#define MAX_BANDS ${MAX_BANDS}


float spectralResponse(
    float frequency,
    float time
)
{
    vec4 offsets =
        vec4(
            -2.0,
            -15.6,
             2.0,
             1.0
        );

    vec4 phase =
        (frequency + offsets) * 0.07;

    vec4 response =
        vec4(0.1)
        - 0.1 * sin(
            phase + time * 1.1
        )
        + 0.1 * cos(
            phase * 1.6 - time
        );

    float centerPhase =
        frequency * 0.07;

    float center =
        0.1
        - 0.1 * sin(
            centerPhase + time * 1.1
        )
        + 0.1 * cos(
            centerPhase * 1.6 - time
        );

    return (
        dot(
            response,
            vec4(1.0)
        )
        + center
    ) / 5.1;
}


float bandGlow(
    float signedDistance,
    float thickness,
    float intensity
)
{
    float distanceToBand =
        max(
            abs(signedDistance)
            - thickness,
            0.0
        );

    float denominator =
        uLightFalloff
        * distanceToBand
        + uCoreRadius;

    return
        uLightGain
        * intensity
        / max(
            denominator,
            0.000001
        );
}


vec3 getEmissionTint(float layer, float time, float colorRate)
{
    float phase = time * colorRate + layer * 0.45;
    float s = sin(phase);
    float c = cos(phase);

    if (uColorScheme == 0)
    {
        // Cyberpunk Neon (Electric Cyan, Hot Pink, Laser Purple)
        vec3 colA = vec3(0.2, 2.6, 3.0);
        vec3 colB = vec3(3.0, 0.2, 2.2);
        vec3 colC = vec3(1.8, 0.4, 3.2);
        return mix(mix(colA, colB, 0.5 + 0.5 * s), colC, 0.5 + 0.5 * c);
    }
    else if (uColorScheme == 1)
    {
        // Acid Sunset (Neon Pink, Solar Gold, Warm Orange)
        vec3 colA = vec3(3.2, 0.2, 1.4);
        vec3 colB = vec3(3.0, 1.9, 0.1);
        vec3 colC = vec3(3.2, 0.8, 0.1);
        return mix(mix(colA, colB, 0.5 + 0.5 * s), colC, 0.5 + 0.5 * c);
    }
    else if (uColorScheme == 2)
    {
        // Bioluminescence (Toxic Emerald, Electric Aqua, Deep Sea)
        vec3 colA = vec3(0.2, 3.2, 1.4);
        vec3 colB = vec3(0.1, 2.6, 3.2);
        vec3 colC = vec3(0.1, 1.2, 3.0);
        return mix(mix(colA, colB, 0.5 + 0.5 * s), colC, 0.5 + 0.5 * c);
    }
    else if (uColorScheme == 3)
    {
        // Ultraviolet (Deep Cosmic Violet, Radiant Magenta, Blue-Purple)
        vec3 colA = vec3(1.8, 0.2, 3.6);
        vec3 colB = vec3(3.4, 0.1, 2.5);
        vec3 colC = vec3(0.8, 0.3, 3.2);
        return mix(mix(colA, colB, 0.5 + 0.5 * s), colC, 0.5 + 0.5 * c);
    }
    else if (uColorScheme == 4)
    {
        // Solar Flare (Molten Gold, Plasma Red, Solar Amber)
        vec3 colA = vec3(3.6, 2.2, 0.3);
        vec3 colB = vec3(3.6, 0.3, 0.1);
        vec3 colC = vec3(3.3, 1.2, 0.0);
        return mix(mix(colA, colB, 0.5 + 0.5 * s), colC, 0.5 + 0.5 * c);
    }
    else
    {
        // Custom Palette
        vec3 col1 = uCustomColor1 * 3.0;
        vec3 col2 = uCustomColor2 * 3.0;
        float t = 0.5 + 0.5 * sin(phase);
        return mix(col1, col2, t);
    }
}


void main()
{
    vec2 fragCoord =
        gl_FragCoord.xy;

    float safeHeight =
        max(
            iResolution.y,
            1.0
        );

    float aspect =
        iResolution.x
        / safeHeight;

    vec2 view =
        (
            fragCoord
            - 0.5
            * iResolution.xy
        )
        / safeHeight;

    // Apply pan & zoom
    view = (view - uOffset) / max(uZoom, 0.0001);

    vec2 screen =
        vec2(
            view.x
                / max(
                    aspect,
                    0.000001
                )
                + 0.5,

            view.y
                + 0.5
        );

    vec2 fieldCoord =
        -0.9
        + 1.7
        * screen;

    float time =
        iTime;

    float accumulatedY =
        fieldCoord.y;

    vec3 ribbonColor =
        vec3(0.0);

    float totalLight =
        0.0;

    for (
        int bandIndex = 0;
        bandIndex < MAX_BANDS;
        ++bandIndex
    )
    {
        if (bandIndex >= uBandCount)
        {
            break;
        }

        float layer =
            float(bandIndex)
            + 2.0;

        accumulatedY -=
            0.1
            * sin(
                fieldCoord.x
                + layer
                    * 0.55555556
                - time
                    * 0.2
            );

        float horizontalShape =
            sin(
                screen.x
                    * 13.0
                + time
                    * 1.2
                + layer
            );

        horizontalShape *=
            cos(
                screen.x
                    * 2.4
                - time
                    * 3.0
            );

        float frequency =
            layer
            * layer
            * 20.0;

        float modulation =
            spectralResponse(
                frequency,
                time
            );

        float centerDistance =
            accumulatedY
            + horizontalShape
                * modulation
                * 0.1;

        float rotationWave =
            sin(
                -screen.x
                    * 6.8
                - time
                    * 1.5
                + layer
                    * 2.0
            );

        float thickness =
            uBandThickness
            * (
                0.5
                + 0.5
                    * rotationWave
            );

        float triangularPhase =
            abs(
                2.0
                * fract(
                    0.5
                    * (
                        screen.x
                        + layer
                            * 1.7
                        + time
                    )
                )
                - 1.0
            );

        float intensity =
            0.2
            + 0.36
                * triangularPhase
                * triangularPhase;

        float light =
            bandGlow(
                centerDistance,
                thickness,
                intensity
            );

        vec3 emissionTint =
            getEmissionTint(layer, time, uColorRate);

        ribbonColor +=
            emissionTint
            * light;

        totalLight +=
            light;
    }

    vec3 finalColor;

    if (uGreenScreen > 0.5)
    {
        vec3 greenBg = vec3(0.0, 1.0, 0.0);
        float alpha = clamp(totalLight * 2.0, 0.0, 1.0);
        finalColor = mix(greenBg, ribbonColor, alpha);
    }
    else
    {
        finalColor = max(vec3(0.0), ribbonColor - vec3(0.1));
    }

    gl_FragColor =
        vec4(
            finalColor,
            1.0
        );
}

`;


// ============================================================
// Material
// ============================================================

const material = new THREE.ShaderMaterial({

    uniforms,

    vertexShader,

    fragmentShader,

    depthTest: false,
    depthWrite: false,

    transparent: false,

    toneMapped: false

});


// ============================================================
// Fullscreen triangle
// ============================================================

const geometry =
    new THREE.BufferGeometry();

geometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(
        [
            -1, -1, 0,
             3, -1, 0,
            -1,  3, 0
        ],
        3
    )
);

const fullscreenTriangle =
    new THREE.Mesh(
        geometry,
        material
    );

fullscreenTriangle.frustumCulled =
    false;

scene.add(
    fullscreenTriangle
);


// ============================================================
// lil-gui setup
// ============================================================

const gui = new GUI({
    title: "Settings"
});

// Presets & Themes Folder
const themeFolder =
    gui.addFolder("Theme & Colors");

themeFolder
    .add(
        params.theme,
        "colorScheme",
        Object.keys(COLOR_PRESETS)
    )
    .name("Color Scheme")
    .onChange((value) => {
        uniforms.uColorScheme.value = COLOR_PRESETS[value];
    });

themeFolder
    .addColor(
        params.theme,
        "customColor1"
    )
    .name("Custom Color 1")
    .onChange((value) => {
        uniforms.uCustomColor1.value.set(value);
    });

themeFolder
    .addColor(
        params.theme,
        "customColor2"
    )
    .name("Custom Color 2")
    .onChange((value) => {
        uniforms.uCustomColor2.value.set(value);
    });

themeFolder
    .add(
        params.theme,
        "greenscreen"
    )
    .name("Green Screen (#00ff00)")
    .onChange((value) => {
        uniforms.uGreenScreen.value = value ? 1.0 : 0.0;
        renderer.setClearColor(value ? 0x00ff00 : 0x000000, 1);
    });


// Animation Folder
const animationFolder =
    gui.addFolder("Animation");

animationFolder
    .add(
        params.animation,
        "preset",
        [
            "Cosmic Drift",
            "Harmonic Wave",
            "Hypnotic Pulse",
            "Infinity Flow",
            "Static Zen"
        ]
    )
    .name("Motion Style");

animationFolder
    .add(
        params.animation,
        "timeScale",
        0.0,
        3.0,
        0.01
    )
    .name("Animation Speed");


// Geometry Folder
const geometryFolder =
    gui.addFolder("Geometry");

geometryFolder
    .add(
        params.geometry,
        "bandCount",
        1,
        MAX_BANDS,
        1
    )
    .name("Band Count")
    .onChange((value) => {
        uniforms.uBandCount.value = Math.round(value);
    });

geometryFolder
    .add(
        params.geometry,
        "bandThickness",
        0.001,
        0.25,
        0.001
    )
    .name("Band Thickness")
    .onChange((value) => {
        uniforms.uBandThickness.value = value;
    });


// Material / Glow Folder
const materialFolder =
    gui.addFolder("Glow & Light");

materialFolder
    .add(
        params.material,
        "lightFalloff",
        1.0,
        60.0,
        0.1
    )
    .name("Light Falloff")
    .onChange((value) => {
        uniforms.uLightFalloff.value = value;
    });

materialFolder
    .add(
        params.material,
        "coreRadius",
        0.005,
        0.25,
        0.001
    )
    .name("Core Radius")
    .onChange((value) => {
        uniforms.uCoreRadius.value = value;
    });

materialFolder
    .add(
        params.material,
        "lightGain",
        0.001,
        0.15,
        0.001
    )
    .name("Light Gain")
    .onChange((value) => {
        uniforms.uLightGain.value = value;
    });

materialFolder
    .add(
        params.material,
        "colorRate",
        0.0,
        2.0,
        0.01
    )
    .name("Color Cycle Rate")
    .onChange((value) => {
        uniforms.uColorRate.value = value;
    });


// View & Camera Folder
const viewFolder =
    gui.addFolder("View & Camera");

viewFolder
    .add(
        params.view,
        "zoom",
        0.1,
        5.0,
        0.01
    )
    .name("Zoom")
    .listen();

viewFolder
    .add(
        params.view,
        "offsetX",
        -2.0,
        2.0,
        0.01
    )
    .name("Offset X")
    .listen();

viewFolder
    .add(
        params.view,
        "offsetY",
        -2.0,
        2.0,
        0.01
    )
    .name("Offset Y")
    .listen();

viewFolder
    .add(
        params.view,
        "resetView"
    )
    .name("Reset View");


// Interaction & Randomizer Folder
const interactionFolder =
    gui.addFolder("Interaction & Randomizer");

interactionFolder
    .add(
        params.interaction,
        "clickToRandomize"
    )
    .name("Click Scene to Randomize");

interactionFolder
    .add(
        params.interaction,
        "randomizeNow"
    )
    .name("Randomize Now");


// Performance Folder
const performanceFolder =
    gui.addFolder("Performance");

performanceFolder
    .add(
        params.performance,
        "dpr",
        {
            "0.5x": 0.5,
            "0.75x": 0.75,
            "1.0x (Standard)": 1,
            "1.5x (High)": 1.5,
            "2.0x (Ultra)": 2
        }
    )
    .name("DPR (Pixel Ratio)")
    .onChange(() => {
        updateRendererSize();
    });


gui.open();


// Helper to update all lil-gui controllers
function updateGuiDisplay()
{
    function updateRecursive(folder) {
        if (folder.controllers) {
            folder.controllers.forEach((c) => c.updateDisplay());
        }
        if (folder.folders) {
            folder.folders.forEach((f) => updateRecursive(f));
        }
    }

    if (typeof gui.controllersRecursive === "function") {
        gui.controllersRecursive().forEach((c) => c.updateDisplay());
    } else {
        updateRecursive(gui);
    }
}


// ============================================================
// Procedural Randomizer
// ============================================================

function randomizeScene()
{
    const schemes = [
        "Cyberpunk Neon",
        "Acid Sunset",
        "Bioluminescence",
        "Ultraviolet",
        "Solar Flare",
        "Custom"
    ];

    params.theme.colorScheme =
        schemes[Math.floor(Math.random() * schemes.length)];

    uniforms.uColorScheme.value =
        COLOR_PRESETS[params.theme.colorScheme];

    if (params.theme.colorScheme === "Custom") {
        const randomColor = () =>
            "#" + Math.floor(Math.random() * 16777215)
                .toString(16)
                .padStart(6, "0");

        params.theme.customColor1 = randomColor();
        params.theme.customColor2 = randomColor();

        uniforms.uCustomColor1.value.set(params.theme.customColor1);
        uniforms.uCustomColor2.value.set(params.theme.customColor2);
    }

    // Randomize motion style
    const animPresets = [
        "Cosmic Drift",
        "Harmonic Wave",
        "Hypnotic Pulse",
        "Infinity Flow",
        "Static Zen"
    ];
    params.animation.preset =
        animPresets[Math.floor(Math.random() * animPresets.length)];

    // Randomize animation speed
    params.animation.timeScale =
        parseFloat((Math.random() * 0.8 + 0.4).toFixed(2));

    // Randomize geometry
    params.geometry.bandCount =
        Math.floor(Math.random() * 6) + 2;
    uniforms.uBandCount.value =
        params.geometry.bandCount;

    params.geometry.bandThickness =
        parseFloat((Math.random() * 0.12 + 0.02).toFixed(3));
    uniforms.uBandThickness.value =
        params.geometry.bandThickness;

    // Randomize material & glow
    params.material.lightFalloff =
        parseFloat((Math.random() * 32.0 + 12.0).toFixed(1));
    uniforms.uLightFalloff.value =
        params.material.lightFalloff;

    params.material.coreRadius =
        parseFloat((Math.random() * 0.12 + 0.02).toFixed(3));
    uniforms.uCoreRadius.value =
        params.material.coreRadius;

    params.material.lightGain =
        parseFloat((Math.random() * 0.06 + 0.02).toFixed(3));
    uniforms.uLightGain.value =
        params.material.lightGain;

    params.material.colorRate =
        parseFloat((Math.random() * 0.6 + 0.1).toFixed(2));
    uniforms.uColorRate.value =
        params.material.colorRate;

    updateGuiDisplay();
}


// ============================================================
// Drag & Wheel Zoom Controls
// ============================================================

let isDragging = false;
let startPointerPos = { x: 0, y: 0 };
let pointerDownPos = { x: 0, y: 0 };
let startOffset = { x: 0, y: 0 };
let totalDragDistance = 0;

window.addEventListener("pointerdown", (e) => {
    if (e.target.closest && e.target.closest(".lil-gui")) return;

    isDragging = true;
    startPointerPos = { x: e.clientX, y: e.clientY };
    pointerDownPos = { x: e.clientX, y: e.clientY };
    startOffset = { x: params.view.offsetX, y: params.view.offsetY };
    totalDragDistance = 0;
});

window.addEventListener("pointermove", (e) => {
    if (!isDragging) return;

    const dx = e.clientX - startPointerPos.x;
    const dy = e.clientY - startPointerPos.y;
    totalDragDistance = Math.hypot(
        e.clientX - pointerDownPos.x,
        e.clientY - pointerDownPos.y
    );

    const safeHeight = Math.max(window.innerHeight, 1.0);
    params.view.offsetX = startOffset.x + (dx / safeHeight) * params.view.zoom;
    params.view.offsetY = startOffset.y - (dy / safeHeight) * params.view.zoom;
});

window.addEventListener("pointerup", (e) => {
    if (e.target.closest && e.target.closest(".lil-gui")) {
        isDragging = false;
        return;
    }

    if (isDragging) {
        isDragging = false;
        if (totalDragDistance < 6 && params.interaction.clickToRandomize) {
            randomizeScene();
        }
    }
});

// Wheel zoom
window.addEventListener(
    "wheel",
    (e) => {
        if (e.target.closest && e.target.closest(".lil-gui")) return;

        e.preventDefault();
        const zoomFactor = Math.exp(-e.deltaY * 0.0015);
        params.view.zoom = Math.min(
            Math.max(params.view.zoom * zoomFactor, 0.1),
            10.0
        );
    },
    {
        passive: false
    }
);


// ============================================================
// Hide / Show UI with 'H' key
// ============================================================

window.addEventListener("keydown", (e) => {
    if (e.key === "h" || e.key === "H") {
        if (gui && gui.domElement) {
            const isHidden = gui.domElement.style.display === "none";
            gui.domElement.style.display = isHidden ? "" : "none";
        }
    }
});


// ============================================================
// Resize
// ============================================================

function updateRendererSize()
{
    const width =
        window.innerWidth;

    const height =
        window.innerHeight;

    renderer.setPixelRatio(
        params.performance.dpr
    );

    renderer.setSize(
        width,
        height,
        false
    );

    renderer.getDrawingBufferSize(
        drawingBufferSize
    );

    uniforms.iResolution.value.copy(
        drawingBufferSize
    );
}


function handleResize()
{
    updateRendererSize();
}


window.addEventListener(
    "resize",
    handleResize,
    {
        passive: true
    }
);


// ============================================================
// Animation Loop
// ============================================================

const clock =
    new THREE.Clock();

let shaderTime = 0;


function animate()
{
    requestAnimationFrame(animate);

    const delta =
        Math.min(
            clock.getDelta(),
            0.1
        );

    shaderTime +=
        delta
        * params.animation.timeScale;

    uniforms.iTime.value =
        shaderTime;

    // Calculate motion preset modulation
    let animOffsetX = 0;
    let animOffsetY = 0;
    let animZoomFactor = 1.0;

    switch (params.animation.preset) {
        case "Cosmic Drift":
            animOffsetX = Math.sin(shaderTime * 0.35) * 0.08;
            animOffsetY = Math.cos(shaderTime * 0.25) * 0.05;
            animZoomFactor = 1.0 + Math.sin(shaderTime * 0.2) * 0.06;
            break;

        case "Harmonic Wave":
            animOffsetX = Math.sin(shaderTime * 0.5) * 0.12;
            animOffsetY = Math.sin(shaderTime * 1.0) * 0.05;
            animZoomFactor = 1.0 + Math.cos(shaderTime * 0.35) * 0.04;
            break;

        case "Hypnotic Pulse":
            animOffsetX = Math.sin(shaderTime * 0.2) * 0.03;
            animOffsetY = Math.cos(shaderTime * 0.2) * 0.03;
            animZoomFactor = 1.0 + Math.sin(shaderTime * 0.6) * 0.15;
            break;

        case "Infinity Flow":
            animOffsetX = Math.sin(shaderTime * 0.4) * 0.10;
            animOffsetY = Math.sin(shaderTime * 0.8) * 0.06;
            animZoomFactor = 1.0 + Math.sin(shaderTime * 0.3) * 0.05;
            break;

        case "Static Zen":
        default:
            animOffsetX = 0;
            animOffsetY = 0;
            animZoomFactor = 1.0;
            break;
    }

    // Apply combined user interaction + procedural motion
    uniforms.uOffset.value.set(
        params.view.offsetX + animOffsetX,
        params.view.offsetY + animOffsetY
    );

    uniforms.uZoom.value =
        params.view.zoom * animZoomFactor;

    renderer.render(
        scene,
        camera
    );
}


// ============================================================
// Start
// ============================================================

updateRendererSize();
animate();

</script>
