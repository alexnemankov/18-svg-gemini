      },
      'Palette 18: E8E0FF, B38FFF, 6A3DE8': {
        name: 'Palette 18: (E8E0FF, B38FFF, 6A3DE8, 1A1250, 090612)',
        skyTop: '#090612',
        skyBottom: '#1a1250',
        cloudRGB: [232, 224, 255],
        mistRGB: [179, 143, 255],
        shadowRGB: [9, 6, 18],
        highlightRGB: [232, 224, 255],
        conicA: '#1a1250',
        conicMid: '#6a3de8',
        boulderRGB: [179, 143, 255]
      },
      'Palette 19: E0FBFF, 00F0FF, D40078': {
        name: 'Palette 19: (E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)',
        skyTop: '#05020f',
        skyBottom: '#1e0a3d',
        cloudRGB: [224, 251, 255],
        mistRGB: [0, 240, 255],
        shadowRGB: [5, 2, 15],
        highlightRGB: [0, 240, 255],
        conicA: '#1e0a3d',
        conicMid: '#d40078',
        boulderRGB: [212, 0, 120]
      }
    };

    // ============================================================
    // Global Settings & Interactive Parameters
    // ============================================================
    const settings = {
      // Color Theme Selection
      colorScheme: 'Original',

      // Procedural Mountain Parameters
      numPoints: 5,
      noiseScale: 0.01,
      gravity: 0.03,
      lineCount: 60,
      cloudDensity: 4,
      cloudPasses: 1,
      boulderChance: 0.005,

      // Animation & Rendering Controls
      animSpeed: 4,
      isPlaying: true,

      // Camera & Interaction
      zoom: 1.0,
      randomizeOnClick: true,

      // Action Triggers
      instantFinish: () => finishInstant(),
      regenerate: () => startGeneration(),
      randomizeScene: () => randomizeAll(),
      resetCamera: () => resetView(),
      saveImage: () => saveCanvas('mountain_landscape_' + Date.now(), 'png')
    };

    // Current Theme State
    let currentTheme = COLOR_SCHEMES['Original'];

    // Original Landscape State Variables
    let noiseScale = 0.01;
    let gravity = 0.03;
    let initialPoints = [];
    let currentPointIndex = 0;
    let previousPointIndex = -1;
    let isDone = false;
    let mountainFrameCount = 0; // Frame counter per mountain, resets when mountain restarts
    let gen; // Generator for progressive rendering

    // Offscreen Buffer for High-Res Progressive Render & Smooth Pan/Zoom
    let pg = null;

    // Pan & Zoom Camera State
    let panX = 0, panY = 0;
    let targetPanX = 0, targetPanY = 0;
    let zoomLevel = 1.0, targetZoom = 1.0;
    let isDragging = false;
    let dragStartX = 0, dragStartY = 0;
    let startPanX = 0, startPanY = 0;
    let totalDragDist = 0;

    let gui = null;
    let zoomController = null;

    // ============================================================
    // Setup & Lifecycle
    // ============================================================
    function setup() {
      const canvas = createCanvas(windowWidth, windowHeight);
      canvas.parent('canvas-container');
      pixelDensity(1);

      // Create offscreen graphics buffer
      pg = createGraphics(windowWidth, windowHeight);
      pg.pixelDensity(1);

      // Initialize UI controls
      initGUI();
      initInteraction();

      // Begin generation
      startGeneration();
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
      // Main canvas automatically resizes, maintaining artwork in pg
    }

    function startGeneration() {
      noiseScale = settings.noiseScale;
      gravity = settings.gravity;

      currentPointIndex = 0;
      previousPointIndex = -1;
      isDone = false;
      mountainFrameCount = 0;

      // Recreate or resize pg if window size changed
      if (!pg || pg.width !== windowWidth || pg.height !== windowHeight) {
        if (pg) pg.remove();
        pg = createGraphics(windowWidth, windowHeight);
        pg.pixelDensity(1);
      }

      generateInitialPoints();
      gen = drawScene();
    }

    function generateInitialPoints() {
      let numPoints = settings.numPoints || random([4, 5, 6, 7]);
      let minDistance = max(pg.width, pg.height) / 6;
      let attempts = 0;
      let maxAttempts = 1000;

      initialPoints = [];

      while (initialPoints.length < numPoints && attempts < maxAttempts) {
        let newPoint = {
          x: random(pg.width / 5, (pg.width * 4) / 5),
          y: random(pg.height / 10, (pg.height * 2) / 3),
          vx: 0,
          vy: 0,
          previousX: 0,
        };
        newPoint.previousX = newPoint.x;

        // Check if point is far enough from existing points
        let valid = true;
        for (let existingPoint of initialPoints) {
          let d = dist(newPoint.x, newPoint.y, existingPoint.x, existingPoint.y);
          if (d < minDistance) {
            valid = false;
            break;
          }
        }

        if (valid) {
          initialPoints.push(newPoint);
        }

        attempts++;
      }
      // Sort points by y position
      initialPoints = initialPoints.sort((a, b) => a.y - b.y);
    }

    function edgeBiasedRandom(centerMin = 0.3) {
      while (true) {
        const u = Math.random(); // candidate value in [0, 1]
        const y = Math.random(); // threshold in [0, 1]

        // Parabolic weight: max 1 at edges, min `centerMin` at center
        const w = centerMin + (1 - centerMin) * 4 * Math.pow(u - 0.5, 2);

        if (y < w) {
          return u; // accepted
        }
        // else: reject and try again
      }
    }

    function updateParticle(point) {
      if (point.y >= pg.height) return;

      // Calculate noise detail based on y position
      let yNorm = point.y / pg.height;
      let nDetail = map(yNorm, 0, 1, 0.01, 1.5);

      // Get noise values based on position and frame
      let noiseX = noise(
        point.x * noiseScale,
        point.y * noiseScale,
        mountainFrameCount * 0.01,
      );
      let noiseY = noise(
        point.x * noiseScale + 100,
        point.y * noiseScale + 100,
        mountainFrameCount * 0.01,
      );

      // Map noise to angle and magnitude
      let angle = map(noiseX, 0, 1, -PI, PI);
      let normalizedX = abs(noiseY - 0.5) * 2;
      normalizedX = normalizedX ** 2.5;
      normalizedX = (1 - normalizedX) * (noiseY > 0.5 ? 1 : -1);
      let magnitude = normalizedX * nDetail;

      // Apply noise-based force
      point.vx += cos(angle) * magnitude * 0.3;
      point.vy += sin(angle) * magnitude * 0.1;

      // Apply gravity
      point.vy += gravity;

      // Update position
      point.x += point.vx;
      point.y += point.vy;

      // Apply damping
      point.vx *= 0.95;
      point.vy *= 0.95;
    }

    function handleMountainTransition() {
      // Check if point reached limits and switch to next
      let mPoint = initialPoints[currentPointIndex];
      if (mPoint.x < -pg.width / 4 || mPoint.x > (pg.width * 5) / 4 || mPoint.y >= pg.height) {
        currentPointIndex = currentPointIndex + 1;
        if (currentPointIndex >= initialPoints.length) {
          isDone = true;
        }
      }

      // Check if this is a new point
      let isNewPoint = currentPointIndex !== previousPointIndex;

      // Reset frame counter when starting a new mountain
      if (isNewPoint) {
        mountainFrameCount = 0;
      }

      // Increment frame counter
      mountainFrameCount++;

      // Add semi-transparent overlay between mountain layers
      if (isNewPoint && currentPointIndex > 0) {
        const m = currentTheme.mistRGB;
        pg.fill(m[0], m[1], m[2], 255 * random(0.03, 0.08));
        pg.noStroke();
        pg.rect(0, 0, pg.width, pg.height);
      }

      previousPointIndex = currentPointIndex;
      return isNewPoint;
    }

    function generateAngles(T, minAngle, maxAngle, numLines = 60) {
      let angles = [];
      for (let i = 0; i < numLines; i++) {
        let r = edgeBiasedRandom(0.2);
        let angle = map(r, 0, 1, minAngle, maxAngle);
        let a = angle < T ? map(angle, PI / 8, T, PI / 6, T) : angle;
        angles.push(a);
      }
      angles.sort((a, b) => a - b);
      return angles;
    }

    function maybeDrawBoulder(point, x, y, angle, T, maxAngle) {
      if (angle < T || abs(angle - maxAngle) <= PI / 50) return;

      // Use noise to create clusters
      let bNoiseScale = 10;
      let mountainOffset = currentPointIndex * 100;
      let noiseValue = noise(x * bNoiseScale, y * bNoiseScale, mountainOffset);

      // Threshold for clustering
      let noiseThreshold = 0.7;
      let noiseChance =
        noiseValue > noiseThreshold
          ? (noiseValue - noiseThreshold) / (1 - noiseThreshold)
          : 0;

      // Combine noise-based chance with random chance
      let randomChance = settings.boulderChance !== undefined ? settings.boulderChance : 0.005;
      let totalChance = noiseChance * 0.1 + randomChance;

      if (random() < totalChance) {
        // Calculate size based on distance from origin
        let distFromOrigin = dist(point.x, point.y, x, y);
        let maxDist = sqrt(pg.width * pg.width + pg.height * pg.height);
        let normalizedDist = distFromOrigin / maxDist;
        let objectSize = map(normalizedDist, 0, 1, 0.3, 1.0);

        drawBoulder(x, y, objectSize);
      }
    }

    function drawSegmentedLine(
      point,
      angle,
      capturePath,
      T,
      midAngle,
      maxAngle,
      lineIndex,
    ) {
      pg.drawingContext.setLineDash([
        random(20, 40),
        random(5, 10),
        random(20, 40),
        random(5, 10),
        random(20, 40),
        random(5, 10),
      ]);

      // Color: shadow tone if angle < T, highlight tone otherwise
      if (angle < T) {
        let base = currentTheme.shadowRGB;
        let j = random(-30, 30);
        pg.stroke(
          constrain(base[0] + j, 0, 255),
          constrain(base[1] + j, 0, 255),
          constrain(base[2] + j, 0, 255)
        );
      } else {
        let base = currentTheme.highlightRGB;
        let j = random(-30, 30);
        pg.stroke(
          constrain(base[0] + j, 0, 255),
          constrain(base[1] + j, 0, 255),
          constrain(base[2] + j, 0, 255)
        );
      }

      let currentX = point.x;
      let currentY = point.y;
      let currentAngle = angle;
      let segmentIndex = 0;
      let totalLength = 0;
      let path = capturePath ? [{ x: currentX, y: currentY }] : null;

      while (true) {
        // Check if starting point is outside canvas
        if (
          currentX < -pg.width / 4 ||
          currentX > (pg.width * 5) / 4 ||
          currentY < 0 ||
          currentY > pg.height
        ) {
          break;
        }

        let sw = map(totalLength, 0, 250, 1, 0.3, true);
        if (angle < T) {
          sw = sw * 3;
        }
        pg.strokeWeight(sw);

        // Calculate segment parameters based on distance from center
        let distToCenter = abs(currentAngle - midAngle);
        let minSegmentLength = map(distToCenter, 0, PI / 2, 10, 20);
        let maxSegmentLength = map(distToCenter, 0, PI / 2, 40, 80);
        let noiseRotationScale = map(distToCenter, 0, PI / 2, 0.1, 0.001);
        let rotationScale = map(distToCenter, 0, PI / 2, 5, 0.5);

        let segmentLength = random(minSegmentLength, maxSegmentLength);
        let nextX = currentX + cos(currentAngle) * segmentLength;
        let nextY = currentY + sin(currentAngle) * segmentLength;

        // Draw segment with random jitter
        let offsetX = random(-2, 6);
        let offsetY = random(-5, 5);
        pg.line(currentX, currentY, nextX + offsetX, nextY + offsetY);

        // Maybe draw boulder on white side
        if (angle >= T) {
          maybeDrawBoulder(
            point,
            nextX + offsetX,
            nextY + offsetY,
            angle,
            T,
            maxAngle,
          );
        }

        // Capture path point
        if (path) {
          path.push({ x: nextX, y: nextY });
        }

        totalLength += segmentLength;
        currentX = nextX;
        currentY = nextY;

        // Apply noise-based rotation
        let noiseValue = noise(
          currentX * noiseRotationScale,
          currentY * noiseRotationScale,
          currentPointIndex * 0.1 + lineIndex * 0.01 + segmentIndex * 0.05,
        );
        let rotation =
          (map(noiseValue, 0, 1, -rotationScale, rotationScale) * PI) / 180;
        currentAngle += rotation;
        currentAngle = constrain(currentAngle, 0, PI);
        segmentIndex++;
      }

      pg.drawingContext.setLineDash([]);
      return path;
    }

    function extendPathToEdge(path, angle, isRightEdge) {
      if (path.length < 2) return { x: path[0].x, y: path[0].y };

      let last = path[path.length - 1];
      let dir = atan2(
        last.y - path[path.length - 2].y,
        last.x - path[path.length - 2].x,
      );

      let edgeX = isRightEdge ? (pg.width * 5) / 4 : -pg.width / 4;
      let edgeY = last.y;

      if (abs(cos(dir)) > 0.001) {
        edgeY = last.y + tan(dir) * (edgeX - last.x);
        if (edgeY < 0) {
          edgeY = 0;
          edgeX = last.x + (edgeY - last.y) / tan(dir);
        } else if (edgeY > pg.height) {
          edgeY = pg.height;
          edgeX = last.x + (edgeY - last.y) / tan(dir);
        }
      } else {
        edgeY = pg.height;
      }

      return { x: edgeX, y: edgeY };
    }

    function drawMountainPolygon(point, lowestPath, highestPath, angles) {
      // Extend paths to canvas edges
      let rightEdge = extendPathToEdge(lowestPath, angles[0], true);
      let leftEdge = extendPathToEdge(highestPath, angles[angles.length - 1], false);

      // Create polygon
      let polygon = [];
      polygon.push({ x: point.x, y: point.y });
      for (let p of lowestPath) polygon.push(p);
      polygon.push({ x: rightEdge.x, y: rightEdge.y });
      polygon.push({ x: rightEdge.x, y: pg.height });
      polygon.push({ x: leftEdge.x, y: pg.height });
      polygon.push({ x: leftEdge.x, y: leftEdge.y });
      for (let i = highestPath.length - 1; i >= 0; i--)
        polygon.push(highestPath[i]);

      // Create conic gradient
      let lowestAngle = angles[0];
      let highestAngle = angles[angles.length - 1];
      let angleRange = highestAngle - lowestAngle;
      let highestOffset = constrain(angleRange / (2 * PI), 0.001, 0.999);

      let ctx = pg.drawingContext;
      let gradient;
      if (typeof ctx.createConicGradient === 'function') {
        gradient = ctx.createConicGradient(
          lowestAngle,
          point.x,
          point.y,
        );
        gradient.addColorStop(0, currentTheme.conicA);
        gradient.addColorStop(highestOffset, currentTheme.conicMid);
        gradient.addColorStop(1, currentTheme.conicA);
      } else {
        gradient = ctx.createLinearGradient(point.x, point.y, rightEdge.x, pg.height);
        gradient.addColorStop(0, currentTheme.conicA);
        gradient.addColorStop(1, currentTheme.conicMid);
      }

      ctx.fillStyle = gradient;
      pg.noStroke();
      pg.beginShape();
      for (let v of polygon) {
        pg.vertex(v.x, v.y);
      }
      pg.endShape(CLOSE);

      // Reset fill style
      ctx.fillStyle = "rgba(0, 0, 0, 0)";
      pg.noFill();
    }

    function *drawClouds(density = 4, passes = 1, perFrame = 50) {
      // density: how many strokes per cell (1 = original-ish, 2 = twice as dense, etc.)
      // passes: how many times to redraw the whole cloud field (subtle build-up)
      // perFrame: how many cells to process before yielding

      const baseR = currentTheme.cloudRGB[0];
      const baseG = currentTheme.cloudRGB[1];
      const baseB = currentTheme.cloudRGB[2];
      const _step = 5;
      let counter = 0;

      for (let p = 0; p < passes; p++) {
        const begin = random(50); // each pass shifts the noise

        let i = 0;
        for (let x = 0; x < pg.width; x += _step) {
          let j = 0;

          for (let y = 0; y < pg.height * 2 / 3; y += _step) {
            const alphaMax = map(y, 0, pg.height * 2 / 3, 255, 0);
            let n = noise(begin + i, begin + j);
            let alphaBase = map(n, 0.3, 1, 0, alphaMax);
            alphaBase = constrain(alphaBase, 0, 255);

            if (alphaBase > 5) {
              // Draw several strokes in this cell to increase density
              for (let k = 0; k < density; k++) {
                const _alpha = alphaBase * random(0.5, 1.0);

                let brightnessJitter = random(-10, 10);
                if (random() < 0.05) {
                  brightnessJitter = random(-30, -80);
                }
                const r = constrain(baseR + brightnessJitter, 0, 255);
                const g = constrain(baseG + brightnessJitter, 0, 255);
                const b = constrain(baseB + brightnessJitter, 0, 255);

                pg.strokeWeight(random(0.5, 3));
                pg.stroke(r, g, b, _alpha);

                const len = random(10, 20);
                const angle = random(-PI / 10, PI / 10);

                const x1 = x + random(-5, 5);
                const y1 = y + random(-5, 5);
                const x2 = x1 + cos(angle) * len;
                const y2 = y1 + sin(angle) * len;
                pg.line(x1, y1, x2, y2);

                // occasional crosshatch stroke
                if (random() < 0.5) {
                  pg.stroke(r, g, b, _alpha * 0.4);
                  const angle2 = angle + random(-PI / 3, PI / 3);
                  const x3 = x1 + cos(angle2) * (len * 0.6);
                  const y3 = y1 + sin(angle2) * (len * 0.6);
                  pg.line(x1, y1, x3, y3);
                }
              }
            }

            j += 0.06;
            counter++;
            
            // Yield periodically to show progress
            if (counter % perFrame === 0) {
              yield 1;
            }
          }

          i += 0.01;
        }
      }
    }

    function drawGradientBackground() {
      // Create linear gradient from top to background color at middle
      let midPoint = pg.height / 2;
      
      let gradient = pg.drawingContext.createLinearGradient(0, 0, 0, midPoint);
      gradient.addColorStop(0, currentTheme.skyTop);
      gradient.addColorStop(1, currentTheme.skyBottom);
      
      pg.drawingContext.fillStyle = gradient;
      pg.drawingContext.fillRect(0, 0, pg.width, midPoint);
      
      // Fill rest with background color
      pg.fill(currentTheme.skyBottom);
      pg.noStroke();
      pg.rect(0, midPoint, pg.width, pg.height - midPoint);
      
      // Reset fill style
      pg.drawingContext.fillStyle = "rgba(0, 0, 0, 0)";
    }

    function *drawScene() {
      // Draw gradient background first
      drawGradientBackground();
      
      // Draw clouds progressively
      let cloudGen = drawClouds(
        settings.cloudDensity,
        settings.cloudPasses,
        max(10, round(pg.width / 4))
      );
      for (let _ of cloudGen) {
        yield 1;
      }

      // Then draw mountains progressively
      while (!isDone) {
        // Get current point
        let mPoint = initialPoints[currentPointIndex];
        if (!mPoint) {
          isDone = true;
          break;
        }

        // Update particle physics
        updateParticle(mPoint);

        // Handle mountain transitions
        let isNewPoint = handleMountainTransition();

        // Get current point (may have changed)
        mPoint = initialPoints[currentPointIndex];
        if (!mPoint) {
          isDone = true;
          break;
        }

        // Calculate angle T and generate angles
        let T = PI / 2 + map(noise(mountainFrameCount * 0.02), 0, 1, -PI / 6, PI / 6);
        let minAngle = PI / 6;
        let maxAngle = PI - PI / 8;
        let midAngle = (minAngle + maxAngle) / 2;
        let angles = generateAngles(T, minAngle, maxAngle, settings.lineCount);

        // Capture paths on first frame
        let lowestPath = null;
        let highestPath = null;
        let capturePaths = isNewPoint;

        // Draw lines emanating from current point, yielding periodically
        for (let i = 0; i < angles.length; i++) {
          let a = angles[i];
          let isLowest = i === 0;
          let isHighest = i === angles.length - 1;

          let path = drawSegmentedLine(
            mPoint,
            a,
            capturePaths && (isLowest || isHighest),
            T,
            midAngle,
            maxAngle,
            i,
          );

          // Store captured paths
          if (capturePaths) {
            if (isLowest) {
              lowestPath = path;
            } else if (isHighest) {
              highestPath = path;
            }
          }
        }

        // Draw polygon on first frame
        if (capturePaths && lowestPath && highestPath) {
          drawMountainPolygon(mPoint, lowestPath, highestPath, angles);
        }
        if (mountainFrameCount % 4 === 0) {
          yield 1;
        }
      }
      yield 1;
    }

    function drawBoulder(x, y, size = 1.0) {
      pg.push();
      pg.translate(x, y);
      pg.scale(1, -1);
      pg.rotate(random(-PI / 6, PI / 6));
      let baseSize = random(5, 30) * size;
      let deltas = [2 * size, 5 * size];
      
      let bBase = currentTheme.boulderRGB;
      let j = random(-25, 25);
      pg.fill(
        constrain(bBase[0] + j, 0, 255),
        constrain(bBase[1] + j, 0, 255),
        constrain(bBase[2] + j, 0, 255)
      );
      pg.noStroke();
      // stroke(random(60, 120))
      // noFill()
      pg.beginShape();
      let angle = 0;
      for (; angle < PI; angle += random(PI / 10, PI / 5)) {
        let cx = baseSize * cos(angle);
        let cy = baseSize * sin(angle) * 0.5;
        pg.vertex(cx + random(...deltas), cy + random(...deltas));
      }
      // Now backwards from the last angle to 0
      for (; angle > 0; angle -= random(PI / 10, PI / 5)) {
        let cx = baseSize * cos(angle);
        let cy = baseSize * sin(angle) * 0.5;
        pg.vertex(cx - random(...deltas), cy - random(...deltas));
      }
      pg.endShape(CLOSE);
      pg.pop();
    }

    function finishInstant() {
      if (isDone || !gen) return;
      let maxSteps = 250000;
      let steps = 0;
      while (!isDone && gen && steps < maxSteps) {
        let v = gen.next();
        steps++;
        if (v.done) {
          isDone = true;
          break;
        }
      }
    }

    // ============================================================
    // Main Display Loop with Pan & Zoom Transform
    // ============================================================
    function draw() {
      // Advance generator according to animation speed setting
      if (!isDone && gen && settings.isPlaying) {
        let steps = settings.animSpeed;
        for (let s = 0; s < steps; s++) {
          let v = gen.next();
          if (v.done) {
            isDone = true;
            break;
          }
        }
      }

      // Smooth camera interpolation
      panX = lerp(panX, targetPanX, 0.18);
      panY = lerp(panY, targetPanY, 0.18);
      zoomLevel = lerp(zoomLevel, targetZoom, 0.18);

      // Background fill matching current atmosphere
      background(currentTheme.skyBottom);

      // Render offscreen canvas transformed by Pan & Zoom
      if (pg) {
        push();
        translate(width / 2 + panX, height / 2 + panY);
        scale(zoomLevel);
        translate(-pg.width / 2, -pg.height / 2);
        image(pg, 0, 0);
        pop();
      }
    }

    // ============================================================
    // Interactive Pan & Zoom UX (Wheel & Drag)
    // ============================================================
    function resetView() {
      targetPanX = 0;
      targetPanY = 0;
      targetZoom = 1.0;
      settings.zoom = 1.0;
      if (zoomController) zoomController.updateDisplay();
    }

    function randomizeAll() {
      // Pick random palette from 19 color schemes
      const paletteKeys = Object.keys(COLOR_SCHEMES);
      settings.colorScheme = random(paletteKeys);
      currentTheme = COLOR_SCHEMES[settings.colorScheme];

      // Re-roll geometric & motion parameters
      settings.numPoints = floor(random(4, 8));
      settings.noiseScale = Number(random(0.006, 0.016).toFixed(4));
      settings.gravity = Number(random(0.02, 0.045).toFixed(3));
      settings.lineCount = floor(random(45, 80));
      settings.cloudDensity = floor(random(2, 6));
      settings.cloudPasses = random([1, 1, 2]);
      settings.boulderChance = Number(random(0.003, 0.008).toFixed(4));

      // Update lil-gui controls display
      if (gui) {
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      }

      // Start new procedural generation
      startGeneration();
    }

    function initInteraction() {
      const container = document.getElementById('canvas-container');

      // Mouse Wheel Zoom centered at cursor
      window.addEventListener('wheel', (e) => {
        if (e.target && e.target.closest && e.target.closest('.lil-gui')) return;
        e.preventDefault();

        const zoomFactor = e.deltaY < 0 ? 1.12 : 0.893;
        const newZoom = constrain(targetZoom * zoomFactor, 0.2, 10.0);

        // Keep point under cursor invariant
        const mouseWorldX = (mouseX - (width / 2 + targetPanX)) / targetZoom;
        const mouseWorldY = (mouseY - (height / 2 + targetPanY)) / targetZoom;

        targetPanX = mouseX - width / 2 - mouseWorldX * newZoom;
        targetPanY = mouseY - height / 2 - mouseWorldY * newZoom;
        targetZoom = newZoom;

        settings.zoom = targetZoom;
        if (zoomController) zoomController.updateDisplay();
      }, { passive: false });

      // Mouse Drag to Pan
      window.addEventListener('mousedown', (e) => {
        if (e.target && e.target.closest && e.target.closest('.lil-gui')) return;
        if (e.button === 0) {
          isDragging = true;
          dragStartX = e.clientX;
          dragStartY = e.clientY;
          startPanX = targetPanX;
          startPanY = targetPanY;
          totalDragDist = 0;
        }
      });

      window.addEventListener('mousemove', (e) => {
        if (isDragging) {
          const dx = e.clientX - dragStartX;
          const dy = e.clientY - dragStartY;
          totalDragDist = Math.hypot(dx, dy);
          targetPanX = startPanX + dx;
          targetPanY = startPanY + dy;
        }
      });

      window.addEventListener('mouseup', (e) => {
        if (isDragging) {
          isDragging = false;
          // Scene Click Detection: triggers procedural randomize if drag was minimal (< 6px)
          if (totalDragDist < 6) {
            if (settings.randomizeOnClick) {
              randomizeAll();
            }
          }
        }
      });

      // Mobile Touch Support: Touch Pan & Pinch Zoom
      let touchStartDist = 0;
      let touchStartZoom = 1.0;

      container.addEventListener('touchstart', (e) => {
        if (e.target && e.target.closest && e.target.closest('.lil-gui')) return;
        if (e.touches.length === 1) {
          isDragging = true;
          dragStartX = e.touches[0].clientX;
          dragStartY = e.touches[0].clientY;
          startPanX = targetPanX;
          startPanY = targetPanY;
          totalDragDist = 0;
        } else if (e.touches.length === 2) {
          isDragging = false;
          touchStartDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          touchStartZoom = targetZoom;
        }
      }, { passive: true });

      container.addEventListener('touchmove', (e) => {
        if (isDragging && e.touches.length === 1) {
          const dx = e.touches[0].clientX - dragStartX;
          const dy = e.touches[0].clientY - dragStartY;
          totalDragDist = Math.hypot(dx, dy);
          targetPanX = startPanX + dx;
          targetPanY = startPanY + dy;
        } else if (e.touches.length === 2) {
          const distVal = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          if (touchStartDist > 0) {
            const factor = distVal / touchStartDist;
            targetZoom = constrain(touchStartZoom * factor, 0.2, 10.0);
            settings.zoom = targetZoom;
            if (zoomController) zoomController.updateDisplay();
          }
        }
      }, { passive: true });

      container.addEventListener('touchend', (e) => {
        if (isDragging) {
          isDragging = false;
          if (totalDragDist < 6 && settings.randomizeOnClick) {
            randomizeAll();
          }
        }
      }, { passive: true });

      // Keyboard Shortcuts
      window.addEventListener('keydown', (e) => {
        // Spacebar to randomize / reseed
        if (e.code === 'Space') {
          e.preventDefault();
          randomizeAll();
        }
        // 'R' key to reset pan & zoom
        if (e.code === 'KeyR') {
          resetView();
        }
        // 'P' key to toggle animation
        if (e.code === 'KeyP') {
          settings.isPlaying = !settings.isPlaying;
        }
        // 'H' key to toggle lil-gui visibility
        if (e.code === 'KeyH') {
          if (gui) {
            gui._hidden ? gui.show() : gui.hide();
          }
        }
      });
    }

    // ============================================================
    // lil-gui Interactive Control Panel
    // ============================================================
    function initGUI() {
      gui = new lil.GUI({ title: 'Mountain Landscape' });

      // 1. Color Palette Folder
      const fPalette = gui.addFolder('Palette & Atmosphere');
      fPalette.add(settings, 'colorScheme', Object.keys(COLOR_SCHEMES))
        .name('Color Scheme')
        .onChange(val => {
          currentTheme = COLOR_SCHEMES[val];
          startGeneration();
        });

      // 2. Mountain Morphology & Geometry Folder
      const fGeo = gui.addFolder('Landscape Parameters');
      fGeo.add(settings, 'numPoints', 3, 9, 1).name('Peak Count').onChange(() => startGeneration());
      fGeo.add(settings, 'noiseScale', 0.003, 0.03, 0.001).name('Noise Frequency').onChange(() => startGeneration());
      fGeo.add(settings, 'gravity', 0.01, 0.07, 0.002).name('Flow Gravity').onChange(() => startGeneration());
      fGeo.add(settings, 'lineCount', 30, 100, 2).name('Ridge Line Density').onChange(() => startGeneration());
      fGeo.add(settings, 'cloudDensity', 1, 8, 1).name('Cloud Density').onChange(() => startGeneration());
      fGeo.add(settings, 'cloudPasses', 1, 3, 1).name('Cloud Passes').onChange(() => startGeneration());
      fGeo.add(settings, 'boulderChance', 0.001, 0.02, 0.001).name('Boulder Chance');

      // 3. Animation & Rendering Speed
      const fAnim = gui.addFolder('Animation Speed');
      fAnim.add(settings, 'animSpeed', 1, 30, 1).name('Speed (Steps/Frame)');
      fAnim.add(settings, 'isPlaying').name('Drawing Active');
      fAnim.add(settings, 'instantFinish').name('Finish Instantly');

      // 4. Camera & View Controls
      const fCam = gui.addFolder('Camera & Viewport');
      zoomController = fCam.add(settings, 'zoom', 0.2, 10.0, 0.01).name('Zoom Level').onChange(v => {
        targetZoom = v;
      });
      fCam.add(settings, 'resetCamera').name('Reset Camera (R)');

      // 5. Actions & Procedural Randomization
      const fActions = gui.addFolder('Randomization & Export');
      fActions.add(settings, 'randomizeOnClick').name('Randomize on Click');
      fActions.add(settings, 'randomizeScene').name('Randomize All (Space)');
      fActions.add(settings, 'regenerate').name('Regenerate Scene');
      fActions.add(settings, 'saveImage').name('Save Image (PNG)');
    }
  </script>
