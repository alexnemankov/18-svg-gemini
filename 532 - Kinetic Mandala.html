<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>532 - Generative Kinetic Mandala</title>
  <style>
    * {
      padding: 0;
      margin: 0;
      overflow: hidden;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      background: #000;
      user-select: none;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
    }
  }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import GUI from 'lil-gui';

    // 19+ Preconfigured Color Schemes
    const COLOR_SCHEMES = {

      'Complementary': {

      },
      'Triadic': {

      'Tetradic': {

      'Achromatic (White and Black)': {

      },
      'Neutral + Accent': {

      },
      'Sunset Amber (F6AA1C, BC3908, 941B0C, F6AA1C, 220901)': {
        layer1: '#F6AA1C',
        layer2: '#BC3908',
        layer3: '#941B0C',
        accent: '#F6AA1C',
        bg: '#220901'
      },
      'Teal Abyss (63D1CF, 5BC0BE, 4BAD9E, 4BAD9E, 0B132B)': {
        layer1: '#63D1CF',
        layer2: '#5BC0BE',
        layer3: '#4BAD9E',
        accent: '#4BAD9E',
        bg: '#0B132B'
      },
      'Lilac Orchid (AA60C8, D69ADE, C9A3C6, CFB5C2, 0D001D)': {
        layer1: '#AA60C8',
        layer2: '#D69ADE',
        layer3: '#C9A3C6',
        accent: '#CFB5C2',
        bg: '#0D001D'
      },
      'Golden Emerald (FEF1BE, FFBA00, 008189, 00474D, 061210)': {
        layer1: '#FEF1BE',
        layer2: '#FFBA00',
        layer3: '#008189',
        accent: '#00474D',
        bg: '#061210'
      },
      'Acid Mint (D4FFB0, 7FFF00, 00B894, 0A3322, 05140A)': {
        layer1: '#D4FFB0',
        layer2: '#7FFF00',
        layer3: '#00B894',
        accent: '#0A3322',
        bg: '#05140A'
      },
      'Tangerine Night (FFE8CC, FF8C00, C7501A, 3D1050, 0E0618)': {
        layer1: '#FFE8CC',
        layer2: '#FF8C00',
        layer3: '#C7501A',
        accent: '#3D1050',
        bg: '#0E0618'
      },
      'Cosmic Violet (E8E0FF, B38FFF, 6A3DE8, 1A1250, 090612)': {
        layer1: '#E8E0FF',
        layer2: '#B38FFF',
        layer3: '#6A3DE8',
        accent: '#1A1250',
        bg: '#090612'
      },
      'Cyber Neon (E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)': {
        layer1: '#E0FBFF',
        layer2: '#00F0FF',
        layer3: '#D40078',
        accent: '#1E0A3D',
        bg: '#05020F'
      }
    };

    // 8 Preconfigured Animations
    const ANIMATIONS = [
      'Static (No Camera Movement)',
      'Gentle Turntable (Slow 360°)',
      'Floating Horizon (Vertical Sway)',
      'Cosmic Spiral (Dual-Axis Drift)',
      'Zen Pendulum (Smooth Arc)',
      'Low Altitude Drama (Majestic Rise)',
      'Celestial Top-Down (Vortex Spin)',
      'Lissajous Infinity Glide (8-Figure Flow)'
    ];

    // Master configuration parameters
    const params = {
      // Color & Theme
      colorScheme: 'Original',
      layer1Color: COLOR_SCHEMES['Original'].layer1,
      layer2Color: COLOR_SCHEMES['Original'].layer2,
      layer3Color: COLOR_SCHEMES['Original'].layer3,
      accentColor: COLOR_SCHEMES['Original'].accent,
      backgroundColor: COLOR_SCHEMES['Original'].bg,
      greenscreen: false,

      // Interaction
      dragMode: 'Rotate (Orbit) Left, Pan Right',
      randomizeOnClick: true,

      // Geometry & Shape
      nodeCount: 72,
      radius: 100,
      nodeSize: 8,
      waveFreq: 6,
      twistAngle: 1.0,
      twistSpeed: 0.5,
      depthAmplitude: 80,
      geometryShape: 'Sphere',
      showLines: true,
      showCore: true,

      // Motion
      animationSpeed: 1.0,
      timeScale: 1.0,
      phaseOffset: 0.08,
      cameraAnimation: 'Gentle Turntable (Slow 360°)',

      // Exposure & Lighting
      exposure: 1.1,
      masterLightIntensity: 1.0,
      ambientIntensity: 0.45,
      ambientColor: '#ffffff',
      dirIntensity: 1.2,
      dirColor: '#ffffff',
      dirX: 180,
      dirY: 220,
      dirZ: 150,
      point1Intensity: 1.4,
      point1Color: '#ff9944',
      point1X: -200,
      point1Y: 120,
      point1Z: -120,
      point2Intensity: 1.4,
      point2Color: '#4499ff',
      point2X: 200,
      point2Y: -120,
      point2Z: -150,

      // Rendering
      dpr: Math.min(window.devicePixelRatio || 1, 2),
      antialias: true
    };

    // Three.js Core Variables
    let scene, camera, renderer, controls;
    let mandalaGroup;
    let instancedMeshes = [];
    let lineSegments = [];
    let coreMesh = null;
    let ambientLight, dirLight, pointLight1, pointLight2;
    let layerMaterials = [];
    let lineMaterials = [];
    let coreMaterial;
    let gui;
    let animTime = 0;
    const clock = new THREE.Clock();

    // Initialize Scene
    function init() {
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 2000);
      camera.position.set(0, 0, 420);

      renderer = new THREE.WebGLRenderer({ antialias: params.antialias, powerPreference: 'high-performance' });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(params.dpr);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = params.exposure;
      document.body.appendChild(renderer.domElement);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.screenSpacePanning = true;
      controls.zoomSpeed = 1.0;
      controls.panSpeed = 1.0;
      controls.rotateSpeed = 0.8;
      updateDragMode();

      setupLighting();
      setupMandala();
      updateBackground();

      initGUI();
      attachCanvasEvents(renderer.domElement);

      window.addEventListener('resize', onWindowResize);
      window.addEventListener('keydown', onKeyDown);

      animate();
    }

    // Drag mode configuration
    function updateDragMode() {
      if (params.dragMode === 'Pan (Drag Object) Left, Rotate Right') {
        controls.mouseButtons = {
          LEFT: THREE.MOUSE.PAN,
          MIDDLE: THREE.MOUSE.DOLLY,
          RIGHT: THREE.MOUSE.ROTATE
        };
      } else {
        controls.mouseButtons = {
          LEFT: THREE.MOUSE.ROTATE,
          MIDDLE: THREE.MOUSE.DOLLY,
          RIGHT: THREE.MOUSE.PAN
        };
      }
    }

    // Scene Background Management
    function updateBackground() {
      const bgColor = params.greenscreen ? 0x00ff00 : params.backgroundColor;
      scene.background = new THREE.Color(bgColor);
      renderer.setClearColor(bgColor, 1);
    }

    // Lighting Setup
    function setupLighting() {
      ambientLight = new THREE.AmbientLight(params.ambientColor, params.ambientIntensity * params.masterLightIntensity);
      scene.add(ambientLight);

      dirLight = new THREE.DirectionalLight(params.dirColor, params.dirIntensity * params.masterLightIntensity);
      dirLight.position.set(params.dirX, params.dirY, params.dirZ);
      scene.add(dirLight);

      pointLight1 = new THREE.PointLight(params.point1Color, params.point1Intensity * params.masterLightIntensity, 900, 1.2);
      pointLight1.position.set(params.point1X, params.point1Y, params.point1Z);
      scene.add(pointLight1);

      pointLight2 = new THREE.PointLight(params.point2Color, params.point2Intensity * params.masterLightIntensity, 900, 1.2);
      pointLight2.position.set(params.point2X, params.point2Y, params.point2Z);
      scene.add(pointLight2);
    }

    function updateLighting() {
      const master = params.masterLightIntensity;
      if (ambientLight) {
        ambientLight.color.set(params.ambientColor);
        ambientLight.intensity = params.ambientIntensity * master;
      }
      if (dirLight) {
        dirLight.color.set(params.dirColor);
        dirLight.intensity = params.dirIntensity * master;
        dirLight.position.set(params.dirX, params.dirY, params.dirZ);
      }
      if (pointLight1) {
        pointLight1.color.set(params.point1Color);
        pointLight1.intensity = params.point1Intensity * master;
        pointLight1.position.set(params.point1X, params.point1Y, params.point1Z);
      }
      if (pointLight2) {
        pointLight2.color.set(params.point2Color);
        pointLight2.intensity = params.point2Intensity * master;
        pointLight2.position.set(params.point2X, params.point2Y, params.point2Z);
      }
      renderer.toneMappingExposure = params.exposure;
    }

    // Geometry Factory
    function createNodeGeometry() {
      switch (params.geometryShape) {
        case 'Icosahedron':
          return new THREE.IcosahedronGeometry(1, 1);
        case 'Torus':
          return new THREE.TorusGeometry(1, 0.4, 16, 24);
        case 'Octahedron':
          return new THREE.OctahedronGeometry(1, 0);
        case 'Sphere':
        default:
          return new THREE.SphereGeometry(1, 24, 24);
      }
    }

    // Mandala 3D Assembly
    function setupMandala() {
      if (mandalaGroup) {
        scene.remove(mandalaGroup);
        instancedMeshes.forEach(m => m.geometry.dispose());
        lineSegments.forEach(l => l.geometry.dispose());
        layerMaterials.forEach(m => m.dispose());
        lineMaterials.forEach(m => m.dispose());
        if (coreMesh) {
          coreMesh.geometry.dispose();
          coreMaterial.dispose();
        }
      }

      mandalaGroup = new THREE.Group();
      scene.add(mandalaGroup);

      instancedMeshes = [];
      lineSegments = [];
      layerMaterials = [];
      lineMaterials = [];

      const nodeGeom = createNodeGeometry();
      const num = params.nodeCount;

      const layerColors = [params.layer1Color, params.layer2Color, params.layer3Color];

      for (let j = 0; j < 3; j++) {
        // Physical Shader Material for reflective nodes
        const mat = new THREE.MeshPhysicalMaterial({
          color: layerColors[j],
          roughness: 0.18,
          metalness: 0.82,
          clearcoat: 0.6,
          clearcoatRoughness: 0.12,
          emissive: new THREE.Color(layerColors[j]),
          emissiveIntensity: 0.35
        });
        layerMaterials.push(mat);

        const mesh = new THREE.InstancedMesh(nodeGeom, mat, num);
        mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        mandalaGroup.add(mesh);
        instancedMeshes.push(mesh);

        // Connective Ring Wireframe
        const linePos = new Float32Array(num * 6);
        const lineGeom = new THREE.BufferGeometry();
        lineGeom.setAttribute('position', new THREE.BufferAttribute(linePos, 3));

        const lineMat = new THREE.LineBasicMaterial({
          color: params.accentColor,
          transparent: true,
          opacity: 0.4,
          blending: THREE.AdditiveBlending
        });
        lineMaterials.push(lineMat);

        const lineSeg = new THREE.LineSegments(lineGeom, lineMat);
        mandalaGroup.add(lineSeg);
        lineSegments.push(lineSeg);
      }

      // Central Sacred Core
      const coreGeom = new THREE.IcosahedronGeometry(1, 1);
      coreMaterial = new THREE.MeshPhysicalMaterial({
        color: params.accentColor,
        roughness: 0.1,
        metalness: 0.9,
        clearcoat: 1.0,
        emissive: new THREE.Color(params.accentColor),
        emissiveIntensity: 0.5,
        wireframe: false
      });
      coreMesh = new THREE.Mesh(coreGeom, coreMaterial);
      mandalaGroup.add(coreMesh);
    }

    // Material & Color Updates
    function updateColors() {
      const layerColors = [params.layer1Color, params.layer2Color, params.layer3Color];
      for (let j = 0; j < 3; j++) {
        if (layerMaterials[j]) {
          layerMaterials[j].color.set(layerColors[j]);
          layerMaterials[j].emissive.set(layerColors[j]);
        }
        if (lineMaterials[j]) {
          lineMaterials[j].color.set(params.accentColor);
        }
      }
      if (coreMaterial) {
        coreMaterial.color.set(params.accentColor);
        coreMaterial.emissive.set(params.accentColor);
      }
      updateBackground();
    }

    function applyColorScheme(schemeName) {
      const s = COLOR_SCHEMES[schemeName];
      if (!s) return;
      params.colorScheme = schemeName;
      params.layer1Color = s.layer1;
      params.layer2Color = s.layer2;
      params.layer3Color = s.layer3;
      params.accentColor = s.accent;
      params.backgroundColor = s.bg;
      updateColors();
      updateAllControllers();
    }

    // Procedural Re-roll on Scene Click
    function randomizeScene() {
      // Pick random color scheme
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const chosenScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      applyColorScheme(chosenScheme);

      // Re-roll geometric parameters
      params.radius = Math.floor(70 + Math.random() * 110);
      params.waveFreq = +(2.5 + Math.random() * 6.5).toFixed(1);
      params.nodeSize = +(5 + Math.random() * 9).toFixed(1);
      params.twistAngle = +(0.4 + Math.random() * 1.8).toFixed(2);
      params.twistSpeed = +(0.3 + Math.random() * 0.9).toFixed(2);
      params.depthAmplitude = Math.floor(40 + Math.random() * 130);
      params.timeScale = +(0.6 + Math.random() * 1.4).toFixed(2);
      params.phaseOffset = +(0.04 + Math.random() * 0.14).toFixed(3);

      const shapes = ['Sphere', 'Icosahedron', 'Torus', 'Octahedron'];
      params.geometryShape = shapes[Math.floor(Math.random() * shapes.length)];

      const counts = [48, 60, 72, 84, 96];
      params.nodeCount = counts[Math.floor(Math.random() * counts.length)];

      setupMandala();
      updateColors();
      updateAllControllers();
    }

    // Canvas Pointer Event (Distinguishes Drag vs Click)
    function attachCanvasEvents(domElement) {
      let downX = 0, downY = 0, downTime = 0;

      domElement.addEventListener('pointerdown', (e) => {
        downX = e.clientX;
        downY = e.clientY;
        downTime = performance.now();
      });

      domElement.addEventListener('pointerup', (e) => {
        const dist = Math.hypot(e.clientX - downX, e.clientY - downY);
        const duration = performance.now() - downTime;
        // Pure click: movement < 6px and duration < 350ms
        if (dist < 6 && duration < 350 && params.randomizeOnClick) {
          randomizeScene();
        }
      });
    }

    // Toggle Antialias with Renderer Recreation
    function setAntialias(enabled) {
      params.antialias = enabled;
      const prevCamPos = camera.position.clone();
      const prevTarget = controls.target.clone();

      renderer.dispose();
      if (renderer.domElement && renderer.domElement.parentNode) {
        renderer.domElement.parentNode.removeChild(renderer.domElement);
      }

      renderer = new THREE.WebGLRenderer({ antialias: enabled, powerPreference: 'high-performance' });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(params.dpr);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = params.exposure;
      document.body.appendChild(renderer.domElement);

      controls.dispose();
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.screenSpacePanning = true;
      controls.zoomSpeed = 1.0;
      controls.panSpeed = 1.0;
      controls.rotateSpeed = 0.8;
      camera.position.copy(prevCamPos);
      controls.target.copy(prevTarget);
      updateDragMode();

      attachCanvasEvents(renderer.domElement);
      updateBackground();
    }

    // lil-gui Controller Recursive Updater
    function updateAllControllers(folder = gui) {
      if (!folder) return;
      if (folder.controllers) {
        for (const c of folder.controllers) {
          c.updateDisplay();
        }
      }
      if (folder.folders) {
        for (const f of folder.folders) {
          updateAllControllers(f);
        }
      }
    }

    // Lil-GUI Initialization
    function initGUI() {
      gui = new GUI({ title: 'Mandala Controls' });

      // Theme & Presets Folder
      const themeFolder = gui.addFolder('Presets & Controls');
      themeFolder.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES)).name('Color Scheme').onChange(v => {
        applyColorScheme(v);
      });
      themeFolder.add(params, 'cameraAnimation', ANIMATIONS).name('Camera Animation');
      themeFolder.add(params, 'dragMode', ['Rotate (Orbit) Left, Pan Right', 'Pan (Drag Object) Left, Rotate Right']).name('Drag Mode').onChange(() => {
        updateDragMode();
      });
      themeFolder.add(params, 'randomizeOnClick').name('Randomize On Click');
      themeFolder.add({ randomize: () => randomizeScene() }, 'randomize').name('⚡ Randomize Theme Now');

      // Colors & Background Folder
      const colorFolder = gui.addFolder('Colors & Chroma');
      colorFolder.add(params, 'greenscreen').name('Green Screen (#00ff00)').onChange(() => {
        updateBackground();
      });
      colorFolder.addColor(params, 'backgroundColor').name('Background Color').onChange(() => {
        updateBackground();
      });
      colorFolder.addColor(params, 'layer1Color').name('Layer 1 Color').onChange(() => {
        updateColors();
      });
      colorFolder.addColor(params, 'layer2Color').name('Layer 2 Color').onChange(() => {
        updateColors();
      });
      colorFolder.addColor(params, 'layer3Color').name('Layer 3 Color').onChange(() => {
        updateColors();
      });
      colorFolder.addColor(params, 'accentColor').name('Accent / Web Color').onChange(() => {
        updateColors();
      });

      // Geometry & Shape Folder
      const geomFolder = gui.addFolder('Geometry & Dynamics');
      geomFolder.add(params, 'geometryShape', ['Sphere', 'Icosahedron', 'Torus', 'Octahedron']).name('Node Shape').onChange(() => {
        setupMandala();
      });
      geomFolder.add(params, 'nodeCount', 24, 120, 6).name('Nodes / Ring').onChange(() => {
        setupMandala();
      });
      geomFolder.add(params, 'radius', 40, 250, 1).name('Base Radius');
      geomFolder.add(params, 'nodeSize', 2, 22, 0.5).name('Node Scale');
      geomFolder.add(params, 'waveFreq', 1, 14, 0.2).name('Wave Frequency');
      geomFolder.add(params, 'twistAngle', 0, 3.14, 0.05).name('Twist Amplitude');
      geomFolder.add(params, 'twistSpeed', 0.1, 2.0, 0.05).name('Twist Speed');
      geomFolder.add(params, 'depthAmplitude', 0, 250, 2).name('3D Depth Extrusion');
      geomFolder.add(params, 'showLines').name('Connective Web Lines');
      geomFolder.add(params, 'showCore').name('Central Jewel Core');

      // Motion & Speed Folder
      const motionFolder = gui.addFolder('Motion Parameters');
      motionFolder.add(params, 'animationSpeed', 0.0, 3.0, 0.05).name('Master Speed');
      motionFolder.add(params, 'timeScale', 0.2, 3.0, 0.05).name('Harmonic Scale');
      motionFolder.add(params, 'phaseOffset', 0.0, 0.3, 0.01).name('Layer Phase Offset');

      // Lighting & Exposure Folder
      const lightFolder = gui.addFolder('Lighting & Exposure');
      lightFolder.add(params, 'exposure', 0.1, 3.0, 0.05).name('Scene Exposure').onChange(() => {
        updateLighting();
      });
      lightFolder.add(params, 'masterLightIntensity', 0.0, 3.0, 0.05).name('Master Light Power').onChange(() => {
        updateLighting();
      });

      // Individual Lights
      const ambFolder = lightFolder.addFolder('Ambient Light');
      ambFolder.add(params, 'ambientIntensity', 0.0, 2.0, 0.05).name('Intensity').onChange(() => updateLighting());
      ambFolder.addColor(params, 'ambientColor').name('Color').onChange(() => updateLighting());

      const dirFolder = lightFolder.addFolder('Key Directional Light');
      dirFolder.add(params, 'dirIntensity', 0.0, 3.0, 0.05).name('Intensity').onChange(() => updateLighting());
      dirFolder.addColor(params, 'dirColor').name('Color').onChange(() => updateLighting());
      dirFolder.add(params, 'dirX', -300, 300, 10).name('Pos X').onChange(() => updateLighting());
      dirFolder.add(params, 'dirY', -300, 300, 10).name('Pos Y').onChange(() => updateLighting());
      dirFolder.add(params, 'dirZ', -300, 300, 10).name('Pos Z').onChange(() => updateLighting());

      const p1Folder = lightFolder.addFolder('Fill Point Light 1 (Warm)');
      p1Folder.add(params, 'point1Intensity', 0.0, 4.0, 0.05).name('Intensity').onChange(() => updateLighting());
      p1Folder.addColor(params, 'point1Color').name('Color').onChange(() => updateLighting());
      p1Folder.add(params, 'point1X', -400, 400, 10).name('Pos X').onChange(() => updateLighting());
      p1Folder.add(params, 'point1Y', -400, 400, 10).name('Pos Y').onChange(() => updateLighting());
      p1Folder.add(params, 'point1Z', -400, 400, 10).name('Pos Z').onChange(() => updateLighting());

      const p2Folder = lightFolder.addFolder('Rim Point Light 2 (Cool)');
      p2Folder.add(params, 'point2Intensity', 0.0, 4.0, 0.05).name('Intensity').onChange(() => updateLighting());
      p2Folder.addColor(params, 'point2Color').name('Color').onChange(() => updateLighting());
      p2Folder.add(params, 'point2X', -400, 400, 10).name('Pos X').onChange(() => updateLighting());
      p2Folder.add(params, 'point2Y', -400, 400, 10).name('Pos Y').onChange(() => updateLighting());
      p2Folder.add(params, 'point2Z', -400, 400, 10).name('Pos Z').onChange(() => updateLighting());

      // Rendering Folder
      const renderFolder = gui.addFolder('Rendering');
      renderFolder.add(params, 'dpr', 0.5, 3.0, 0.25).name('Pixel Ratio (DPR)').onChange(v => {
        renderer.setPixelRatio(v);
      });
      renderFolder.add(params, 'antialias').name('Antialias (Recreates Canvas)').onChange(v => {
        setAntialias(v);
      });
    }

    // "H" key to toggle UI
    function onKeyDown(e) {
      if (e.key === 'h' || e.key === 'H') {
        if (gui._hidden) {
          gui.show();
          gui.domElement.style.display = '';
        } else {
          gui.hide();
          gui.domElement.style.display = 'none';
        }
      }
    }

    // Window Resize Handler
    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // Animation Loop
    const dummy = new THREE.Object3D();

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const speed = params.animationSpeed;
      animTime += delta * speed;

      // Camera Animation (Maintains Zoom & Interactive Angle)
      if (params.cameraAnimation !== 'Static (No Camera Movement)') {
        const camOffset = camera.position.clone().sub(controls.target);
        const currentDist = camOffset.length(); // Preserve user zoom!
        const rotDelta = 0.22 * delta * speed;

        switch (params.cameraAnimation) {
          case 'Gentle Turntable (Slow 360°)':
            camOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), rotDelta);
            break;

          case 'Floating Horizon (Vertical Sway)':
            camOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), rotDelta);
            const sway = Math.sin(animTime * 0.7) * 0.0035 * speed;
            camOffset.y += sway * currentDist;
            camOffset.setLength(currentDist);
            break;

          case 'Cosmic Spiral (Dual-Axis Drift)':
            camOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), rotDelta);
            const spiralTilt = Math.cos(animTime * 0.45) * 0.0028 * speed;
            camOffset.applyAxisAngle(new THREE.Vector3(1, 0, 0), spiralTilt);
            camOffset.setLength(currentDist);
            break;

          case 'Zen Pendulum (Smooth Arc)':
            const pendulumDelta = Math.cos(animTime * 0.8) * rotDelta * 1.6;
            camOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), pendulumDelta);
            break;

          case 'Low Altitude Drama (Majestic Rise)':
            camOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), rotDelta * 0.75);
            const targetY = -currentDist * 0.12 + Math.sin(animTime * 0.5) * currentDist * 0.08;
            camOffset.y += (targetY - camOffset.y) * 0.025;
            camOffset.setLength(currentDist);
            break;

          case 'Celestial Top-Down (Vortex Spin)':
            camOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), rotDelta * 1.15);
            const topY = currentDist * 0.65;
            camOffset.y += (topY - camOffset.y) * 0.025;
            camOffset.setLength(currentDist);
            break;

          case 'Lissajous Infinity Glide (8-Figure Flow)':
            const yawDelta = Math.sin(animTime * 0.55) * rotDelta * 1.3;
            const pitchDelta = Math.cos(animTime * 1.1) * rotDelta * 0.65;
            camOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), yawDelta);
            camOffset.applyAxisAngle(new THREE.Vector3(1, 0, 0), pitchDelta);
            camOffset.setLength(currentDist);
            break;
        }

        camera.position.copy(controls.target).add(camOffset);
      }

      controls.update();

      // Kinetic Sculpture Wave Mathematics
      const t = animTime;
      const num = params.nodeCount;
      const radius = params.radius;
      const rad = (Math.PI * 2) / num;

      // Group rotational vortex
      mandalaGroup.rotation.z = t * 0.15;

      for (let j = 0; j < 3; j++) {
        const mesh = instancedMeshes[j];
        const line = lineSegments[j];
        if (!mesh) continue;

        const linePos = line ? line.geometry.attributes.position.array : null;

        for (let i = 0; i < num; i++) {
          const r = rad * i;
          const baseX = Math.cos(r) * radius;
          const baseY = Math.sin(r) * radius;
          const a = Math.atan2(baseY, baseX);

          // Formula: q = sin(cos(a * (sin(t / 10) * waveFreq)) - t - j * phaseOffset)
          const wave = Math.sin(t / (10 * params.timeScale)) * params.waveFreq;
          const q = Math.sin(Math.cos(a * wave) - t - j * params.phaseOffset);

          const px = baseX * q;
          const py = baseY * q;

          // Twist around (baseX, baseY)
          const rot = Math.sin(t * params.twistSpeed) * params.twistAngle;
          const dx = px - baseX;
          const dy = py - baseY;
          const cosR = Math.cos(rot);
          const sinR = Math.sin(rot);
          const finalX = baseX + dx * cosR - dy * sinR;
          const finalY = baseY + dx * sinR + dy * cosR;

          // 3D Harmonic Depth Extrusion
          const finalZ = params.depthAmplitude * Math.cos(a * (params.waveFreq * 0.5) + t * 0.7 + j * 0.5) * q;

          // Adaptive dynamic node scale
          const nodeScale = Math.max(0.15, params.nodeSize * (Math.abs(q) * 1.25 + 0.2));

          dummy.position.set(finalX, finalY, finalZ);
          dummy.rotation.set(t * 0.35 + i * 0.05, t * 0.25 + j * 0.2, t * 0.45 + rot);
          dummy.scale.set(nodeScale, nodeScale, nodeScale);
          dummy.updateMatrix();

          mesh.setMatrixAt(i, dummy.matrix);

          if (linePos) {
            linePos[i * 6 + 0] = finalX;
            linePos[i * 6 + 1] = finalY;
            linePos[i * 6 + 2] = finalZ;
          }
        }

        mesh.instanceMatrix.needsUpdate = true;

        if (line) {
          line.visible = params.showLines;
          if (params.showLines && linePos) {
            for (let i = 0; i < num; i++) {
              const nextI = (i + 1) % num;
              linePos[i * 6 + 3] = linePos[nextI * 6 + 0];
              linePos[i * 6 + 4] = linePos[nextI * 6 + 1];
              linePos[i * 6 + 5] = linePos[nextI * 6 + 2];
            }
            line.geometry.attributes.position.needsUpdate = true;
          }
        }
      }

      // Central Crystal Jewel Core
      if (coreMesh) {
        coreMesh.visible = params.showCore;
        if (params.showCore) {
          const coreScale = params.nodeSize * 2.2 * (Math.abs(Math.sin(t * 0.8)) * 0.35 + 0.85);
          coreMesh.scale.set(coreScale, coreScale, coreScale);
          coreMesh.rotation.set(t * 0.4, t * 0.6, t * 0.2);
        }
      }

      renderer.render(scene, camera);
    }

    // Launch
    window.onload = init;
  </script>
</body>
</html>
