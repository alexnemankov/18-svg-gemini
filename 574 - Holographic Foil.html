<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Holographic Foil</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #05070a;
      user-select: none;
      -webkit-user-select: none;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
    }
  }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import GUI from 'lil-gui';

    // --- 19 PRECONFIGURED COLOR SCHEMES ---
    const COLOR_SCHEMES = {
      'Original': ['#FF77BC', '#4CE0D2', '#FFF078', '#C098FA', '#EAF2F8'],
      'Monochromatic': ['#FFFFFF', '#D0E1FD', '#9BBDF0', '#5B86E5', '#243B55'],
      'Analogous': ['#8A2BE2', '#9370DB', '#48D1CC', '#00CED1', '#20B2AA'],
      'Complementary': ['#00F2FE', '#4FACFE', '#FA709A', '#FEE140', '#FF0844'],
      'Split-complementary': ['#00E5FF', '#FF007F', '#FF7A00', '#7C4DFF', '#00FFA3'],
      'Triadic': ['#FF1361', '#FFF800', '#00F2FE', '#FF66B2', '#80FFEA'],
      'Tetradic': ['#FF0055', '#FFCC00', '#00FFCC', '#7700FF', '#FFFFFF'],
      'Double split-complementary': ['#FF3366', '#FF9933', '#33CCFF', '#3333FF', '#CC33FF'],
      'Achromatic': ['#FFFFFF', '#DCDCDC', '#888888', '#333333', '#0A0A0A'],
      'Achromatic + Accent': ['#FFFFFF', '#E0E0E0', '#757575', '#1A1A1A', '#FF003B'],
      'Neutral + accent': ['#F5F0EB', '#D8CFBC', '#8C827A', '#2B2625', '#7A00FF'],
      'Sunset Amber (F6AA1C...)': ['#F6AA1C', '#BC3908', '#941B0C', '#F6AA1C', '#220901'],
      'Marine Teal (63D1CF...)': ['#63D1CF', '#5BC0BE', '#4BAD9E', '#0B132B', '#000000'],
      'Velvet Orchid (AA60C8...)': ['#AA60C8', '#D69ADE', '#C9A3C6', '#CFB5C2', '#0D001D'],
      'Golden Peacock (FEF1BE...)': ['#FEF1BE', '#FFBA00', '#008189', '#00474D', '#061210'],
      'Emerald Aurora (D4FFB0...)': ['#D4FFB0', '#7FFF00', '#00B894', '#0A3322', '#05140A'],
      'Solar Flare (FFE8CC...)': ['#FFE8CC', '#FF8C00', '#C7501A', '#3D1050', '#0E0618'],
      'Cosmic Violet (E8E0FF...)': ['#E8E0FF', '#B38FFF', '#6A3DE8', '#1A1250', '#090612'],
      'Cyber Neon (E0FBFF...)': ['#E0FBFF', '#00F0FF', '#D40078', '#1E0A3D', '#05020F']
    };

    // --- APPLICATION STATE / PARAMETERS ---
    const params = {
      // Color
      colorScheme: 'Original',
      color1: COLOR_SCHEMES['Original'][0],
      color2: COLOR_SCHEMES['Original'][1],
      color3: COLOR_SCHEMES['Original'][2],
      color4: COLOR_SCHEMES['Original'][3],
      color5: COLOR_SCHEMES['Original'][4],
      
      // Background & Greenscreen
      greenScreen: false,
      bgColor: '#05070a',

      // Foil Geometry & Wrinkles
      foldFreq: 2.8,
      foldAmp: 0.55,
      edgeDensity: 2.4,
      rippleScale: 1.2,
      rippleAmp: 0.04,
      billowSpeed: 1.0,

      // Foil Shading & Iridescence
      iridescenceIntensity: 0.88,
      iridescenceScale: 4.5,
      fringeStrength: 0.75,
      roughness: 0.25,
      shininess: 110.0,
      specularIntensity: 1.6,

      // Lighting & Exposure
      exposure: 1.15,
      ambientColor: '#2b3445',
      ambientIntensity: 0.55,
      
      keyColor: '#ffffff',
      keyIntensity: 2.2,
      keyPosX: 5.0,
      keyPosY: 6.0,
      keyPosZ: 7.0,

      fillColor: '#9ecaff',
      fillIntensity: 1.2,
      fillPosX: -6.0,
      fillPosY: -3.0,
      fillPosZ: 5.0,

      rimColor: '#ffd4ec',
      rimIntensity: 1.5,
      rimPosX: 2.0,
      rimPosY: 6.5,
      rimPosZ: -2.0,

      // Animation & Camera
      animMode: 'Static (No Movement)',
      animSpeed: 1.0,

      // Procedural Click Re-roll
      randomizeOnClick: true,

      // Render & Quality
      antialias: true,
      dpr: Math.min(window.devicePixelRatio, 2)
    };

    // --- SCENE SETUP ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(params.bgColor);

    // Virtual Camera (Driven by OrbitControls for interactive input)
    const virtualCamera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    virtualCamera.position.set(0, 0, 7.8);

    // Actual Camera (Used for rendering, combines virtual camera + smooth animation offset)
    const camera = virtualCamera.clone();

    let renderer;
    let controls;

    // --- VERTEX SHADER ---
    const foilVertexShader = `
      uniform float uTime;
      uniform float uFoldFreq;
      uniform float uFoldAmp;
      uniform float uEdgeDensity;
      uniform float uRippleScale;
      uniform float uRippleAmp;
      uniform float uBillowSpeed;

      varying vec2 vUv;
      varying vec3 vWorldPosition;
      varying vec3 vNormal;
      varying vec3 vViewPosition;
      varying float vElevation;
      varying float vCurvature;

      float getFoilHeight(vec2 p, float t) {
        float u = p.x / 8.0; // Normalized horizontal span [-1, 1]
        float v = p.y / 5.5; // Normalized vertical span [-1, 1]
        
        // Edge factor: center is smooth, edges have denser, frequent folds
        float edge = clamp(abs(u), 0.0, 1.0);
        float edgeFactor = pow(edge, 1.6);
        
        // Vertical gentle organic drape curve
        float drape = sin(v * 2.2 + t * 0.3) * 0.12 * (0.3 + 0.7 * edge);
        float uWarp = u + drape;
        
        // Frequency increases smoothly towards edges
        float freq = uFoldFreq * (1.0 + edgeFactor * uEdgeDensity);
        
        // Primary vertical folds (softer in center, denser at edges)
        float fold1 = sin(uWarp * freq * 3.14159 + t * 0.4) * (0.28 + 0.72 * edgeFactor);
        float fold2 = sin(uWarp * freq * 6.0 + t * 0.25 + v * 1.3) * (0.16 * edgeFactor);
        float fold3 = cos(uWarp * freq * 1.5 - t * 0.15) * 0.35;
        
        // Slow vertical billowing
        float billow1 = sin(v * 2.8 + uWarp * 1.4 + t * 0.5) * 0.22;
        float billow2 = cos(v * 1.3 - uWarp * 0.9 + t * 0.3) * 0.16;
        
        // Fine ripple / micro-wrinkles
        float ripple = sin((uWarp * 30.0 + v * 18.0) * uRippleScale + t * 0.75) * 
                       cos((uWarp * 22.0 - v * 34.0) * uRippleScale - t * 0.55) * 
                       uRippleAmp * (0.35 + 0.65 * edgeFactor);
        
        return (fold1 + fold2 + fold3 + billow1 + billow2 + ripple) * uFoldAmp;
      }

      void main() {
        vUv = uv;
        float t = uTime * uBillowSpeed;
        
        float h = getFoilHeight(position.xy, t);
        vec3 displacedPos = vec3(position.xy, position.z + h);
        
        // Finite differences for accurate surface normals across folds
        float eps = 0.02;
        float hRight = getFoilHeight(position.xy + vec2(eps, 0.0), t);
        float hLeft  = getFoilHeight(position.xy - vec2(eps, 0.0), t);
        float hTop   = getFoilHeight(position.xy + vec2(0.0, eps), t);
        float hBot   = getFoilHeight(position.xy - vec2(0.0, eps), t);
        
        vec3 tangentX = normalize(vec3(2.0 * eps, 0.0, hRight - hLeft));
        vec3 tangentY = normalize(vec3(0.0, 2.0 * eps, hTop - hBot));
        vec3 objectNormal = normalize(cross(tangentX, tangentY));
        
        vNormal = normalize(normalMatrix * objectNormal);
        
        // Ridge curvature (second spatial derivative)
        vCurvature = abs(hRight + hLeft - 2.0 * h) / (eps * eps);
        vElevation = h;
        
        vec4 worldPos = modelMatrix * vec4(displacedPos, 1.0);
        vWorldPosition = worldPos.xyz;
        
        vec4 mvPos = modelViewMatrix * vec4(displacedPos, 1.0);
        vViewPosition = -mvPos.xyz;
        
        gl_Position = projectionMatrix * mvPos;
      }
    `;

    // --- FRAGMENT SHADER ---
    const foilFragmentShader = `
      uniform vec3 uColor1;
      uniform vec3 uColor2;
      uniform vec3 uColor3;
      uniform vec3 uColor4;
      uniform vec3 uColor5;

      uniform float uTime;
      uniform float uIridescenceIntensity;
      uniform float uIridescenceScale;
      uniform float uFringeStrength;
      uniform float uShininess;
      uniform float uSpecularIntensity;
      uniform float uRoughness;

      // Lights
      uniform vec3 uAmbientColor;
      uniform float uAmbientIntensity;

      uniform vec3 uKeyLightPos;
      uniform vec3 uKeyLightColor;
      uniform float uKeyLightIntensity;

      uniform vec3 uFillLightPos;
      uniform vec3 uFillLightColor;
      uniform float uFillLightIntensity;

      uniform vec3 uRimLightPos;
      uniform vec3 uRimLightColor;
      uniform float uRimLightIntensity;

      varying vec2 vUv;
      varying vec3 vWorldPosition;
      varying vec3 vNormal;
      varying vec3 vViewPosition;
      varying float vElevation;
      varying float vCurvature;

      // Smooth cyclic 5-color interpolation
      vec3 getPaletteColor(float phase, vec3 c1, vec3 c2, vec3 c3, vec3 c4, vec3 c5) {
        float t = fract(phase);
        float s = t * 5.0;
        int idx = int(floor(s));
        float f = fract(s);
        f = smoothstep(0.0, 1.0, f);
        
        if (idx == 0) return mix(c1, c2, f);
        if (idx == 1) return mix(c2, c3, f);
        if (idx == 2) return mix(c3, c4, f);
        if (idx == 3) return mix(c4, c5, f);
        return mix(c5, c1, f);
      }

      // Procedural micro-roughness noise
      float hash(vec2 p) {
        p = fract(p * vec2(127.1, 311.7));
        p += dot(p, p + 45.32);
        return fract(p.x * p.y);
      }

      void main() {
        vec3 N = normalize(vNormal);
        vec3 V = normalize(cameraPosition - vWorldPosition);
        
        // Procedural micro-grain roughness perturbation
        vec2 grainUv = vUv * 650.0;
        float nx = (hash(floor(grainUv)) - 0.5) * 2.0;
        float ny = (hash(floor(grainUv + vec2(19.3, 71.1))) - 0.5) * 2.0;
        vec3 perturbedNormal = normalize(N + vec3(nx, ny, 0.0) * (uRoughness * 0.12));
        
        float NdotV = clamp(dot(perturbedNormal, V), 0.001, 1.0);
        
        // Holographic thin-film interference phase
        // Colors shift from pink to turquoise to yellow depending on fold angle & elevation
        float phase = (1.0 - NdotV) * uIridescenceScale 
                    + (vElevation * 0.5) 
                    + (vCurvature * 0.015) 
                    + uTime * 0.045;
        
        // Palette color interpolation
        vec3 iridColor = getPaletteColor(phase, uColor1, uColor2, uColor3, uColor4, uColor5);
        
        // Thin rainbow iridescent lines along creases / curves
        float rainbowLines = pow(0.5 + 0.5 * sin(phase * 38.0), 3.5) * uFringeStrength;
        vec3 spectralFringes = vec3(
          0.5 + 0.5 * sin(phase * 42.0),
          0.5 + 0.5 * sin(phase * 42.0 + 2.094),
          0.5 + 0.5 * sin(phase * 42.0 + 4.188)
        );
        iridColor = mix(iridColor, spectralFringes, clamp(rainbowLines, 0.0, 1.0) * 0.45);
        
        // Light silvery base tone
        vec3 silveryBase = vec3(0.88, 0.90, 0.94);
        vec3 surfaceAlbedo = mix(silveryBase, iridColor, uIridescenceIntensity);
        
        // Ambient illumination
        vec3 totalIllum = uAmbientColor * uAmbientIntensity * surfaceAlbedo;
        
        // Ridge highlight boost (brilliant glints on ridges)
        float ridgeFactor = smoothstep(0.12, 0.7, vCurvature * 0.09) + smoothstep(0.2, 0.9, vElevation);
        
        // 1. Key Light (Main specular & directional diffuse)
        vec3 L1 = normalize(uKeyLightPos - vWorldPosition);
        vec3 H1 = normalize(L1 + V);
        float diff1 = max(dot(perturbedNormal, L1), 0.0);
        float spec1 = pow(max(dot(perturbedNormal, H1), 0.0), uShininess);
        vec3 keySpec = vec3(1.0) * spec1 * (uSpecularIntensity + ridgeFactor * 1.2);
        totalIllum += (surfaceAlbedo * diff1 + keySpec) * (uKeyLightColor * uKeyLightIntensity);
        
        // 2. Fill Light
        vec3 L2 = normalize(uFillLightPos - vWorldPosition);
        vec3 H2 = normalize(L2 + V);
        float diff2 = max(dot(perturbedNormal, L2), 0.0);
        float spec2 = pow(max(dot(perturbedNormal, H2), 0.0), uShininess * 0.75);
        vec3 fillSpec = vec3(0.96, 0.98, 1.0) * spec2 * uSpecularIntensity * 0.65;
        totalIllum += (surfaceAlbedo * diff2 + fillSpec) * (uFillLightColor * uFillLightIntensity);
        
        // 3. Rim Light (Edge grazing highlight)
        vec3 L3 = normalize(uRimLightPos - vWorldPosition);
        vec3 H3 = normalize(L3 + V);
        float diff3 = max(dot(perturbedNormal, L3), 0.0);
        float spec3 = pow(max(dot(perturbedNormal, H3), 0.0), uShininess * 1.15);
        vec3 rimSpec = vec3(1.0, 0.98, 0.96) * spec3 * uSpecularIntensity * 1.1;
        totalIllum += (surfaceAlbedo * diff3 + rimSpec) * (uRimLightColor * uRimLightIntensity);
        
        // Metallic Fresnel grazing reflection
        float fresnel = pow(1.0 - NdotV, 3.2);
        vec3 fresnelSheen = mix(vec3(0.92, 0.96, 1.0), iridColor, 0.55) * fresnel * 0.9;
        
        vec3 finalColor = totalIllum + fresnelSheen;
        
        gl_FragColor = vec4(finalColor, 1.0);
      }
    `;

    // --- MATERIAL & MESH ---
    const foilUniforms = {
      uTime: { value: 0 },
      uFoldFreq: { value: params.foldFreq },
      uFoldAmp: { value: params.foldAmp },
      uEdgeDensity: { value: params.edgeDensity },
      uRippleScale: { value: params.rippleScale },
      uRippleAmp: { value: params.rippleAmp },
      uBillowSpeed: { value: params.billowSpeed },

      uIridescenceIntensity: { value: params.iridescenceIntensity },
      uIridescenceScale: { value: params.iridescenceScale },
      uFringeStrength: { value: params.fringeStrength },
      uRoughness: { value: params.roughness },
      uShininess: { value: params.shininess },
      uSpecularIntensity: { value: params.specularIntensity },

      uColor1: { value: new THREE.Color(params.color1) },
      uColor2: { value: new THREE.Color(params.color2) },
      uColor3: { value: new THREE.Color(params.color3) },
      uColor4: { value: new THREE.Color(params.color4) },
      uColor5: { value: new THREE.Color(params.color5) },

      uAmbientColor: { value: new THREE.Color(params.ambientColor) },
      uAmbientIntensity: { value: params.ambientIntensity },

      uKeyLightPos: { value: new THREE.Vector3(params.keyPosX, params.keyPosY, params.keyPosZ) },
      uKeyLightColor: { value: new THREE.Color(params.keyColor) },
      uKeyLightIntensity: { value: params.keyIntensity },

      uFillLightPos: { value: new THREE.Vector3(params.fillPosX, params.fillPosY, params.fillPosZ) },
      uFillLightColor: { value: new THREE.Color(params.fillColor) },
      uFillLightIntensity: { value: params.fillIntensity },

      uRimLightPos: { value: new THREE.Vector3(params.rimPosX, params.rimPosY, params.rimPosZ) },
      uRimLightColor: { value: new THREE.Color(params.rimColor) },
      uRimLightIntensity: { value: params.rimIntensity }
    };

    const foilMaterial = new THREE.ShaderMaterial({
      vertexShader: foilVertexShader,
      fragmentShader: foilFragmentShader,
      uniforms: foilUniforms,
      side: THREE.DoubleSide
    });

    // Foil plane geometry: width 16, height 11, segments 400x400
    const foilGeometry = new THREE.PlaneGeometry(16, 11, 400, 400);
    const foilMesh = new THREE.Mesh(foilGeometry, foilMaterial);
    scene.add(foilMesh);

    // --- RENDERER CREATION & RECREATION ---
    function initRenderer(antialias) {
      if (renderer) {
        if (controls) controls.dispose();
        renderer.dispose();
        if (renderer.domElement && renderer.domElement.parentNode) {
          renderer.domElement.parentNode.removeChild(renderer.domElement);
        }
      }

      renderer = new THREE.WebGLRenderer({
        antialias: antialias,
        powerPreference: 'high-performance'
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(params.dpr);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = params.exposure;
      container.appendChild(renderer.domElement);

      controls = new OrbitControls(virtualCamera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.enablePan = true;
      controls.enableZoom = true;
      controls.target.set(0, 0, 0);

      attachPointerEvents(renderer.domElement);
    }

    // --- POINTER EVENTS (DRAG VS CLICK DETECTION) ---
    let pointerDownPos = { x: 0, y: 0 };
    let pointerDownTime = 0;

    function attachPointerEvents(domElement) {
      domElement.addEventListener('pointerdown', (e) => {
        if (e.target.closest && e.target.closest('.lil-gui')) return;
        pointerDownPos.x = e.clientX;
        pointerDownPos.y = e.clientY;
        pointerDownTime = performance.now();
      });

      domElement.addEventListener('pointerup', (e) => {
        if (e.target.closest && e.target.closest('.lil-gui')) return;
        if (!params.randomizeOnClick) return;
        const dx = e.clientX - pointerDownPos.x;
        const dy = e.clientY - pointerDownPos.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const dt = performance.now() - pointerDownTime;
        // Distinguish genuine click from dragging / panning
        if (dist < 6 && dt < 350) {
          triggerRandomVariation();
        }
      });
    }

    initRenderer(params.antialias);

    // --- PROCEDURAL RE-ROLL FUNCTION ---
    function triggerRandomVariation() {
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      const randomKey = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
      const cols = COLOR_SCHEMES[randomKey];

      params.colorScheme = randomKey;
      params.color1 = cols[0];
      params.color2 = cols[1];
      params.color3 = cols[2];
      params.color4 = cols[3];
      params.color5 = cols[4];

      applyColors();

      // Procedural geometric & motion variations
      const targetFoldFreq = 2.0 + Math.random() * 2.8;
      const targetFoldAmp = 0.35 + Math.random() * 0.45;
      const targetEdgeDensity = 1.6 + Math.random() * 2.6;
      const targetRippleScale = 0.8 + Math.random() * 1.6;
      const targetRippleAmp = 0.02 + Math.random() * 0.06;
      const targetIridescenceScale = 2.5 + Math.random() * 4.5;
      const targetFringeStrength = 0.4 + Math.random() * 0.9;
      const targetShininess = 70.0 + Math.random() * 110.0;
      const targetSpecularIntensity = 1.2 + Math.random() * 1.2;
      const targetRoughness = 0.15 + Math.random() * 0.35;

      gsap.to(params, {
        foldFreq: targetFoldFreq,
        foldAmp: targetFoldAmp,
        edgeDensity: targetEdgeDensity,
        rippleScale: targetRippleScale,
        rippleAmp: targetRippleAmp,
        iridescenceScale: targetIridescenceScale,
        fringeStrength: targetFringeStrength,
        shininess: targetShininess,
        specularIntensity: targetSpecularIntensity,
        roughness: targetRoughness,
        duration: 0.8,
        ease: 'power2.out',
        onUpdate: () => {
          foilUniforms.uFoldFreq.value = params.foldFreq;
          foilUniforms.uFoldAmp.value = params.foldAmp;
          foilUniforms.uEdgeDensity.value = params.edgeDensity;
          foilUniforms.uRippleScale.value = params.rippleScale;
          foilUniforms.uRippleAmp.value = params.rippleAmp;
          foilUniforms.uIridescenceScale.value = params.iridescenceScale;
          foilUniforms.uFringeStrength.value = params.fringeStrength;
          foilUniforms.uShininess.value = params.shininess;
          foilUniforms.uSpecularIntensity.value = params.specularIntensity;
          foilUniforms.uRoughness.value = params.roughness;
          gui.controllersRecursive().forEach(c => c.updateDisplay());
        }
      });
    }

    // --- COLOR MANAGEMENT ---
    function applyColors() {
      foilUniforms.uColor1.value.set(params.color1);
      foilUniforms.uColor2.value.set(params.color2);
      foilUniforms.uColor3.value.set(params.color3);
      foilUniforms.uColor4.value.set(params.color4);
      foilUniforms.uColor5.value.set(params.color5);
    }

    function setScheme(name) {
      const cols = COLOR_SCHEMES[name];
      if (!cols) return;
      params.colorScheme = name;
      params.color1 = cols[0];
      params.color2 = cols[1];
      params.color3 = cols[2];
      params.color4 = cols[3];
      params.color5 = cols[4];
      applyColors();
      gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    function updateBackground() {
      if (params.greenScreen) {
        scene.background.set('#00ff00');
      } else {
        scene.background.set(params.bgColor);
      }
    }

    // --- GUI SETUP (ALL IN ENGLISH, EXACT lil-gui IMPORT) ---
    const gui = new GUI({ title: 'Holographic Foil Controls' });

    // 1. Color Schemes & Colors
    const colorFolder = gui.addFolder('Color Schemes & Palette');
    colorFolder.add(params, 'colorScheme', Object.keys(COLOR_SCHEMES))
      .name('Preset Scheme')
      .onChange((val) => setScheme(val));

    colorFolder.addColor(params, 'color1').name('Color 1').onChange(() => applyColors());
    colorFolder.addColor(params, 'color2').name('Color 2').onChange(() => applyColors());
    colorFolder.addColor(params, 'color3').name('Color 3').onChange(() => applyColors());
    colorFolder.addColor(params, 'color4').name('Color 4').onChange(() => applyColors());
    colorFolder.addColor(params, 'color5').name('Color 5').onChange(() => applyColors());

    // 2. Background & Greenscreen
    const bgFolder = gui.addFolder('Background & Greenscreen');
    bgFolder.add(params, 'greenScreen').name('Green Screen (#00ff00)').onChange(() => updateBackground());
    bgFolder.addColor(params, 'bgColor').name('Background Color').onChange(() => updateBackground());

    // 3. Foil Surface & Folds
    const foilFolder = gui.addFolder('Foil Surface & Folds');
    foilFolder.add(params, 'foldFreq', 1.0, 7.0, 0.1).name('Fold Frequency').onChange(v => foilUniforms.uFoldFreq.value = v);
    foilFolder.add(params, 'foldAmp', 0.1, 1.3, 0.05).name('Fold Amplitude').onChange(v => foilUniforms.uFoldAmp.value = v);
    foilFolder.add(params, 'edgeDensity', 0.5, 5.0, 0.1).name('Edge Fold Density').onChange(v => foilUniforms.uEdgeDensity.value = v);
    foilFolder.add(params, 'rippleScale', 0.2, 3.0, 0.1).name('Ripple Scale').onChange(v => foilUniforms.uRippleScale.value = v);
    foilFolder.add(params, 'rippleAmp', 0.0, 0.12, 0.005).name('Ripple Amplitude').onChange(v => foilUniforms.uRippleAmp.value = v);
    foilFolder.add(params, 'roughness', 0.0, 1.0, 0.01).name('Micro Roughness').onChange(v => foilUniforms.uRoughness.value = v);

    // 4. Shading & Iridescence
    const iridFolder = gui.addFolder('Iridescence & Highlights');
    iridFolder.add(params, 'iridescenceIntensity', 0.0, 1.0, 0.02).name('Iridescence Mix').onChange(v => foilUniforms.uIridescenceIntensity.value = v);
    iridFolder.add(params, 'iridescenceScale', 1.0, 10.0, 0.1).name('Color Shift Scale').onChange(v => foilUniforms.uIridescenceScale.value = v);
    iridFolder.add(params, 'fringeStrength', 0.0, 2.0, 0.05).name('Rainbow Fringes').onChange(v => foilUniforms.uFringeStrength.value = v);
    iridFolder.add(params, 'shininess', 20.0, 260.0, 5.0).name('Specular Sharpness').onChange(v => foilUniforms.uShininess.value = v);
    iridFolder.add(params, 'specularIntensity', 0.0, 3.5, 0.1).name('Ridge Glint Power').onChange(v => foilUniforms.uSpecularIntensity.value = v);

    // 5. Lighting & Scene Exposure
    const lightFolder = gui.addFolder('Lighting & Exposure');
    lightFolder.add(params, 'exposure', 0.2, 3.0, 0.05).name('Scene Exposure').onChange(v => renderer.toneMappingExposure = v);

    const ambientSub = lightFolder.addFolder('Ambient Light');
    ambientSub.addColor(params, 'ambientColor').name('Color').onChange(v => foilUniforms.uAmbientColor.value.set(v));
    ambientSub.add(params, 'ambientIntensity', 0.0, 2.0, 0.05).name('Intensity').onChange(v => foilUniforms.uAmbientIntensity.value = v);

    const keySub = lightFolder.addFolder('Key Light');
    keySub.addColor(params, 'keyColor').name('Color').onChange(v => foilUniforms.uKeyLightColor.value.set(v));
    keySub.add(params, 'keyIntensity', 0.0, 5.0, 0.1).name('Intensity').onChange(v => foilUniforms.uKeyLightIntensity.value = v);
    keySub.add(params, 'keyPosX', -15, 15, 0.5).name('Pos X').onChange(v => foilUniforms.uKeyLightPos.value.x = v);
    keySub.add(params, 'keyPosY', -15, 15, 0.5).name('Pos Y').onChange(v => foilUniforms.uKeyLightPos.value.y = v);
    keySub.add(params, 'keyPosZ', -15, 15, 0.5).name('Pos Z').onChange(v => foilUniforms.uKeyLightPos.value.z = v);

    const fillSub = lightFolder.addFolder('Fill Light');
    fillSub.addColor(params, 'fillColor').name('Color').onChange(v => foilUniforms.uFillLightColor.value.set(v));
    fillSub.add(params, 'fillIntensity', 0.0, 5.0, 0.1).name('Intensity').onChange(v => foilUniforms.uFillLightIntensity.value = v);
    fillSub.add(params, 'fillPosX', -15, 15, 0.5).name('Pos X').onChange(v => foilUniforms.uFillLightPos.value.x = v);
    fillSub.add(params, 'fillPosY', -15, 15, 0.5).name('Pos Y').onChange(v => foilUniforms.uFillLightPos.value.y = v);
    fillSub.add(params, 'fillPosZ', -15, 15, 0.5).name('Pos Z').onChange(v => foilUniforms.uFillLightPos.value.z = v);

    const rimSub = lightFolder.addFolder('Rim Light');
    rimSub.addColor(params, 'rimColor').name('Color').onChange(v => foilUniforms.uRimLightColor.value.set(v));
    rimSub.add(params, 'rimIntensity', 0.0, 5.0, 0.1).name('Intensity').onChange(v => foilUniforms.uRimLightIntensity.value = v);
    rimSub.add(params, 'rimPosX', -15, 15, 0.5).name('Pos X').onChange(v => foilUniforms.uRimLightPos.value.x = v);
    rimSub.add(params, 'rimPosY', -15, 15, 0.5).name('Pos Y').onChange(v => foilUniforms.uRimLightPos.value.y = v);
    rimSub.add(params, 'rimPosZ', -15, 15, 0.5).name('Pos Z').onChange(v => foilUniforms.uRimLightPos.value.z = v);

    // 6. Camera Animations (8 Preconfigured Modes)
    const animFolder = gui.addFolder('Camera & Animation');
    const animModes = [
      'Static (No Movement)',
      'Gentle Horizon Orbit',
      'Pendulum Horizon Sway',
      'Breathing Vertical Tilt',
      'Figure-8 Infinity Float',
      'Floating Pan Drift',
      'Cinematic Roll & Glide',
      'Grazing Light Sweep'
    ];
    animFolder.add(params, 'animMode', animModes).name('Animation Mode');
    animFolder.add(params, 'animSpeed', 0.0, 3.0, 0.05).name('Animation Speed');

    // 7. Interaction & Procedural Variation
    const interactFolder = gui.addFolder('Interaction & Click');
    interactFolder.add(params, 'randomizeOnClick').name('Randomize on Click');
    interactFolder.add({ randomize: () => triggerRandomVariation() }, 'randomize').name('Randomize Theme Now');

    // 8. Render & Quality
    const qualityFolder = gui.addFolder('Render & Quality');
    qualityFolder.add(params, 'antialias').name('Antialias').onChange(v => initRenderer(v));
    qualityFolder.add(params, 'dpr', 0.5, 3.0, 0.1).name('Pixel Ratio (DPR)').onChange(v => renderer.setPixelRatio(v));

    // Hide/Show GUI with 'H' key
    window.addEventListener('keydown', (e) => {
      if (e.code === 'KeyH') {
        gui._hidden ? gui.show() : gui.hide();
      }
    });

    // Window Resize Handler
    window.addEventListener('resize', () => {
      const width = window.innerWidth;
      const height = window.innerHeight;
      virtualCamera.aspect = width / height;
      virtualCamera.updateProjectionMatrix();
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    });

    // --- ANIMATION LOOP ---
    const clock = new THREE.Clock();
    let animTime = 0;

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      animTime += delta * params.animSpeed;

      // Update shader time uniform for undulating ripples and flow
      foilUniforms.uTime.value = animTime;

      // Update controls to consume user mouse drag/pan and wheel zoom
      controls.update();

      // Compute camera position relative to user's interactive target and zoom distance
      const offset = new THREE.Vector3().subVectors(virtualCamera.position, controls.target);
      const animatedTarget = controls.target.clone();
      const animatedPos = new THREE.Vector3();
      let rollAngle = 0;

      const mode = params.animMode;
      const t = animTime;

      if (mode === 'Static (No Movement)') {
        // Direct interactive view: user has complete control over angle, pan, and zoom
        animatedPos.copy(virtualCamera.position);
      } else if (mode === 'Gentle Horizon Orbit') {
        // Continuous slow orbit around target Y-axis while preserving user's zoom & angle
        const orbitAngle = t * 0.18;
        offset.applyAxisAngle(new THREE.Vector3(0, 1, 0), orbitAngle);
        animatedPos.addVectors(controls.target, offset);
      } else if (mode === 'Pendulum Horizon Sway') {
        // Gentle horizontal sway
        const swayAngle = Math.sin(t * 0.35) * 0.14;
        offset.applyAxisAngle(new THREE.Vector3(0, 1, 0), swayAngle);
        animatedPos.addVectors(controls.target, offset);
      } else if (mode === 'Breathing Vertical Tilt') {
        // Gentle vertical breathing tilt
        const right = new THREE.Vector3().crossVectors(offset, new THREE.Vector3(0, 1, 0)).normalize();
        const tiltAngle = Math.sin(t * 0.4) * 0.09;
        offset.applyAxisAngle(right, tiltAngle);
        animatedPos.addVectors(controls.target, offset);
      } else if (mode === 'Figure-8 Infinity Float') {
        // Lissajous figure-8 motion in yaw and pitch
        const yaw = Math.sin(t * 0.3) * 0.12;
        const pitch = Math.sin(t * 0.6) * 0.07;
        const right = new THREE.Vector3().crossVectors(offset, new THREE.Vector3(0, 1, 0)).normalize();
        offset.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
        offset.applyAxisAngle(right, pitch);
        animatedPos.addVectors(controls.target, offset);
      } else if (mode === 'Floating Pan Drift') {
        // Gentle floating drift of both camera and target across the foil
        const driftX = Math.sin(t * 0.35) * 0.35;
        const driftY = Math.cos(t * 0.45) * 0.22;
        animatedTarget.x += driftX;
        animatedTarget.y += driftY;
        animatedPos.addVectors(animatedTarget, offset);
      } else if (mode === 'Cinematic Roll & Glide') {
        // Subtle diagonal glide plus delicate roll
        const glideX = Math.sin(t * 0.25) * 0.28;
        const glideY = Math.cos(t * 0.32) * 0.18;
        animatedTarget.x += glideX;
        animatedTarget.y += glideY;
        animatedPos.addVectors(animatedTarget, offset);
        rollAngle = Math.sin(t * 0.28) * 0.035;
      } else if (mode === 'Grazing Light Sweep') {
        // Slow grazing angle sweep across the ridges
        const sweepAngle = Math.sin(t * 0.25) * 0.22;
        offset.applyAxisAngle(new THREE.Vector3(0, 1, 0), sweepAngle);
        animatedPos.addVectors(controls.target, offset);
      }

      // Sync render camera
      camera.position.copy(animatedPos);
      camera.up.set(0, 1, 0);
      camera.lookAt(animatedTarget);

      if (rollAngle !== 0) {
        camera.rotateZ(rollAngle);
      }

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
