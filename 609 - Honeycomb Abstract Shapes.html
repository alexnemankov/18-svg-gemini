       CSS Reset & Edge-to-Edge Fullscreen UX
       ============================================================ */

      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      margin: 0;

    // ============================================================

    const COLOR_SCHEMES = {

      },
      'Palette 13: 63D1CF, 5BC0BE, 4BAD9E': {

        colors: ['#63d1cf', '#5bc0be', '#4bad9e', '#378a7c', '#0b132b', '#7ef5f3'],
        glow: 'rgba(99, 209, 207, 0.6)',

      },
      'Palette 14: AA60C8, D69ADE, C9A3C6': {
        name: 'Palette 14: (AA60C8, D69ADE, C9A3C6, CFB5C2, 0D001D, 120A12)',
        bg: '#0d001d',
        colors: ['#aa60c8', '#d69ade', '#c9a3c6', '#cfb5c2', '#120a12', '#7b2cbf', '#f0c6fa'],
        glow: 'rgba(214, 154, 222, 0.6)',
        isDark: true
      },
      'Palette 15: FEF1BE, FFBA00, 008189': {
        name: 'Palette 15: (FEF1BE, FFBA00, 008189, 00474D, 061210)',
        bg: '#061210',
        colors: ['#fef1be', '#ffba00', '#008189', '#00474d', '#00adb5', '#ffe066'],
        glow: 'rgba(255, 186, 0, 0.6)',
        isDark: true
      },
      'Palette 16: D4FFB0, 7FFF00, 00B894': {
        name: 'Palette 16: (D4FFB0, 7FFF00, 00B894, 0A3322, 05140A)',
        bg: '#05140a',
        colors: ['#d4ffb0', '#7fff00', '#00b894', '#0a3322', '#00e676', '#69f0ae'],
        glow: 'rgba(127, 255, 0, 0.6)',
        isDark: true
      },
      'Palette 17: FFE8CC, FF8C00, C7501A': {
        name: 'Palette 17: (FFE8CC, FF8C00, C7501A, 3D1050, 0E0618)',
        bg: '#0e0618',
        colors: ['#ffe8cc', '#ff8c00', '#c7501a', '#3d1050', '#e85d04', '#ffa94d'],
        glow: 'rgba(255, 140, 0, 0.6)',
        isDark: true
      },
      'Palette 18: E8E0FF, B38FFF, 6A3DE8': {
        name: 'Palette 18: (E8E0FF, B38FFF, 6A3DE8, 1A1250, 090612)',
        bg: '#090612',
        colors: ['#e8e0ff', '#b38fff', '#6a3de8', '#1a1250', '#9b5de5', '#c4a3ff'],
        glow: 'rgba(179, 143, 255, 0.6)',
        isDark: true
      },
      'Palette 19: E0FBFF, 00F0FF, D40078': {
        name: 'Palette 19: (E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)',
        bg: '#05020f',
        colors: ['#e0fbff', '#00f0ff', '#d40078', '#1e0a3d', '#ff007f', '#7df9ff'],
        glow: 'rgba(0, 240, 255, 0.6)',
        isDark: true
      }
    };

    // ============================================================
    // Global Settings & Interactive State
    // ============================================================
    const settings = {
      // Color & Visual Theme
      colorScheme: 'Original',
      invertColors: false,
      glowEffect: false,
      showGridWireframe: false,

      // Animation & Motion Dynamics
      isPlaying: true,
      animMode: 'Harmonic Waves',
      animSpeed: 1.0,
      pulseIntensity: 0.22,
      rotIntensity: 0.5,
      waveFrequency: 0.006,
      mouseInteraction: true,

      // Geometry & Shapes
      hexSize: 105,
      shapeScale: 0.8,
      strokeWeight: 0.05,
      shapeFilter: 'All Shapes (0-15)',

      // Camera & Viewport
      zoom: 1.0,
      clickToRandomize: true,

      // Quick Actions
      randomize: () => randomizeAll(true),
      regenerate: () => generateScene(),
      resetCamera: () => resetCamera(),
      savePNG: () => saveCanvas('okazz_honeycomb_609_' + Date.now(), 'png')
    };

    // Camera Pan & Zoom Transform State
    let panX = 0, panY = 0;
    let isDragging = false;
    let hasDragged = false;
    let dragStartX = 0, dragStartY = 0;
    let startPanX = 0, startPanY = 0;

    // Animation Time
    let animTime = 0;
    let gui = null;
    let zoomController = null;

    // Touch Support State
    let touchStartDist = 0;
    let initialZoom = 1.0;

    // ============================================================
    // Setup & Initialization
    // ============================================================
    function setup() {
      let canvas = createCanvas(windowWidth, windowHeight);
      canvas.parent('canvas-container');
      pixelDensity(Math.min(window.devicePixelRatio || 1, 2));
      colorMode(RGB, 255);
      ctx = drawingContext;
      centerX = width / 2;
      centerY = height / 2;

      initGUI();
      generateScene();
    }

    // ============================================================
    // Procedural Scene Generation
    // ============================================================
    function generateScene() {
      hexagons = [];
      let hexW = settings.hexSize;
      let hexH = hexW * sqrt(3) / 2;

      // Extend bounds generously so panning and zooming don't reveal blank canvas edges
      let marginX = Math.max(width * 0.7, 500);
      let marginY = Math.max(height * 0.7, 500);
      let startX = -marginX;
      let endX = width + marginX;
      let startY = -marginY;
      let endY = height + marginY;

      let minRow = Math.floor(startY / (hexW * 0.75));
      let maxRow = Math.ceil(endY / (hexW * 0.75));
      let minCol = Math.floor(startX / hexH);
      let maxCol = Math.ceil(endX / hexH);

      const activePalette = COLOR_SCHEMES[settings.colorScheme];
      const palLen = activePalette.colors.length;

      for (let r = minRow; r <= maxRow; r++) {
        let y = r * (hexW * 0.75);
        let offsetX = ((r % 2 + 2) % 2 === 1) ? (hexH / 2) : 0;

        for (let c = minCol; c <= maxCol; c++) {
          let x = c * hexH + offsetX;

          // Pick 3 distinct color indices for consistent theme remapping
          let c0 = floor(random(palLen));
          let c1 = (c0 + floor(random(1, palLen))) % palLen;
          let c2 = (c1 + floor(random(1, palLen - 1))) % palLen;

          let sclX = random([-1, 1]);
          let ang = int(random(6)) * (TAU / 6);
          let shapeType = getFilteredShapeType();

          hexagons.push({
            x: x,
            y: y,
            w: hexW,
            h: hexH,
            a: PI / 2,
            ang: ang,
            sclX: sclX,
            shapeType: shapeType,
            c0: c0,
            c1: c1,
            c2: c2,
            phase: random(TAU),
            speedMod: random(0.85, 1.15)
          });
        }
      }
    }

    function getFilteredShapeType() {
      if (settings.shapeFilter === 'Circles & Arcs') {
        return random([0, 2, 5, 6, 8, 10, 12, 13]);
      } else if (settings.shapeFilter === 'Polygons & Angles') {
        return random([1, 3, 7, 9, 11, 14, 15]);
      } else if (settings.shapeFilter === 'Minimal Lines') {
        return random([0, 4, 11, 12, 14, 15]);
      }
      return int(random(16)); // All shapes (0-15)
    }

    // ============================================================
    // Main Render Loop (60 FPS)
    // ============================================================
    function draw() {
      if (settings.isPlaying) {
        animTime += 0.0166 * settings.animSpeed;
      }

      const activePalette = COLOR_SCHEMES[settings.colorScheme];
      let bgColor = settings.invertColors 
        ? (activePalette.isDark ? '#fafafa' : '#0e0e11') 
        : activePalette.bg;

      background(bgColor);

      push();
      translate(panX, panY);
      scale(settings.zoom);

      // Frustum Culling: only process hexagons visible within viewport
      let visibleLeft = -panX / settings.zoom - settings.hexSize * 1.5;
      let visibleRight = (width - panX) / settings.zoom + settings.hexSize * 1.5;
      let visibleTop = -panY / settings.zoom - settings.hexSize * 1.5;
      let visibleBottom = (height - panY) / settings.zoom + settings.hexSize * 1.5;

      // Glow effect if enabled
      if (settings.glowEffect) {
        ctx.shadowBlur = 14 * settings.zoom;
        ctx.shadowColor = activePalette.glow || 'rgba(0, 0, 0, 0.3)';
      } else {
        ctx.shadowBlur = 0;
      }

      // Optional Wireframe Honeycomb Grid
      if (settings.showGridWireframe) {
        stroke(activePalette.isDark ? 'rgba(255, 255, 255, 0.08)' : 'rgba(0, 0, 0, 0.08)');
        strokeWeight(1);
        noFill();
        for (let i = 0; i < hexagons.length; i++) {
          let hex = hexagons[i];
          if (hex.x < visibleLeft || hex.x > visibleRight || hex.y < visibleTop || hex.y > visibleBottom) {
            continue;
          }
          drawHexagonOutline(hex.x, hex.y, hex.w);
        }
      }

      // Render Hexagonal Motifs
      let worldMouseX = (mouseX - panX) / settings.zoom;
      let worldMouseY = (mouseY - panY) / settings.zoom;

      for (let i = 0; i < hexagons.length; i++) {
        let hex = hexagons[i];

        // Frustum cull
        if (hex.x < visibleLeft || hex.x > visibleRight || hex.y < visibleTop || hex.y > visibleBottom) {
          continue;
        }

        // Distance from screen center and cursor
        let dxCenter = hex.x - width / 2;
        let dyCenter = hex.y - height / 2;
        let distCenter = Math.hypot(dxCenter, dyCenter);
        let angleCenter = Math.atan2(dyCenter, dxCenter);

        let scaleMod = 1.0;
        let rotMod = 0;
        let floatX = 0;
        let floatY = 0;

        // Dynamic Animation Modes
        if (settings.animMode === 'Harmonic Waves') {
          let wave = Math.sin(animTime * 2.2 - distCenter * settings.waveFrequency + hex.phase * 0.2);
          scaleMod = 1.0 + wave * settings.pulseIntensity;
          rotMod = wave * settings.rotIntensity * 0.45;
        } else if (settings.animMode === 'Stepped Hex Turn') {
          let progress = animTime * 0.8 * hex.speedMod + distCenter * 0.0018;
          let step = Math.floor(progress);
          let frac = progress - step;
          let ease = frac < 0.65 ? 0 : 0.5 - 0.5 * Math.cos((frac - 0.65) / 0.35 * Math.PI);
          rotMod = (step + ease) * (TAU / 6) * settings.rotIntensity;
          scaleMod = 1.0 + Math.sin(frac * Math.PI) * settings.pulseIntensity * 0.35;
        } else if (settings.animMode === 'Vortex Swirl') {
          let swirlAngle = angleCenter + Math.sin(animTime * 1.4) * 0.4;
          rotMod = (distCenter * 0.0025 + Math.sin(animTime * 2.0 + swirlAngle * 3.0)) * settings.rotIntensity;
          scaleMod = 1.0 + Math.sin(animTime * 2.5 - distCenter * settings.waveFrequency) * settings.pulseIntensity;
        } else if (settings.animMode === 'Pulse & Breathing') {
          let pulse = Math.sin(animTime * 2.8 + distCenter * settings.waveFrequency + hex.phase);
          scaleMod = 1.0 + pulse * settings.pulseIntensity;
          rotMod = Math.cos(animTime * 1.4 + hex.phase) * 0.25 * settings.rotIntensity;
        } else if (settings.animMode === 'Kinetic Float') {
          floatX = Math.sin(animTime * 1.8 + hex.x * 0.01) * 8 * settings.pulseIntensity;
          floatY = Math.cos(animTime * 1.4 + hex.y * 0.01) * 8 * settings.pulseIntensity;
          rotMod = Math.sin(animTime * 1.2 + hex.phase) * 0.35 * settings.rotIntensity;
          scaleMod = 1.0 + Math.sin(animTime * 2.0 + hex.phase) * 0.15 * settings.pulseIntensity;
        } else if (settings.animMode === 'Mouse Magnetic') {
          let dMouse = Math.hypot(hex.x - worldMouseX, hex.y - worldMouseY);
          let influence = Math.max(0, 1.0 - dMouse / 320);
          let smoothInf = influence * influence * (3 - 2 * influence);
          rotMod = (Math.sin(animTime * 1.5) * 0.15 + smoothInf * Math.PI * 0.8) * settings.rotIntensity;
          scaleMod = 1.0 + (Math.sin(animTime * 2.0) * 0.08 + smoothInf * 0.5) * settings.pulseIntensity;
        }

        // Additional cursor magnetic ripple in any mode
        if (settings.mouseInteraction && settings.animMode !== 'Mouse Magnetic') {
          let dMouse = Math.hypot(hex.x - worldMouseX, hex.y - worldMouseY);
          if (dMouse < 280) {
            let infl = (1 - dMouse / 280);
            let easeInfl = infl * infl;
            scaleMod += easeInfl * 0.35 * (settings.pulseIntensity + 0.1);
            rotMod += easeInfl * Math.sin(animTime * 4.0) * 0.35 * settings.rotIntensity;
          }
        }

        // Color resolution
        let pal = activePalette.colors;
        let c0 = pal[hex.c0 % pal.length];
        let c1 = pal[hex.c1 % pal.length];
        let c2 = pal[hex.c2 % pal.length];
        let cellColors = [c0, c1, c2];

        drawSomething(
          hex.x, 
          hex.y, 
          hex.w * settings.shapeScale, 
          hex.a + hex.ang, 
          hex.sclX, 
          hex.shapeType, 
          cellColors, 
          scaleMod, 
          rotMod, 
          floatX, 
          floatY
        );
      }

      pop();
    }

    // Helper: draw delicate hexagonal cell outline
    function drawHexagonOutline(cx, cy, w) {
      let r = w * 0.5;
      beginShape();
      for (let i = 0; i < 6; i++) {
        let a = i * (TAU / 6) + PI / 6;
        vertex(cx + r * cos(a), cy + r * sin(a));
      }
      endShape(CLOSE);
    }

    // ============================================================
    // Original Shape Geometry Suite (By OKAZZ 2026)
    // Preserves all 16 shapes (0 to 15) with mathematical precision
    // ============================================================
    function drawSomething(x, y, w, ang, sclX, shapeType, colors, scaleMod, rotMod, floatX, floatY) {
      let h = w * sqrt(3) / 2;
      let stClr = colors[2];
      let thisckness = w * settings.strokeWeight;

      push();
      translate(x + floatX, y + floatY);
      scale(sclX * scaleMod, scaleMod);
      rotate(ang + rotMod);
      noStroke();
      strokeCap(ROUND);
      strokeJoin(ROUND);
      strokeWeight(thisckness);
      fill(colors[0]);

      if (shapeType === 0) {
        circle(0, 0, w * 0.6);

        stroke(stClr);
        line(w * 0.2, 0, w * 0.5, 0);
        rotate(PI * 0.15);
        line(w * 0.2, 0, w * 0.4, 0);
      }
      else if (shapeType === 1) {
        beginShape();
        vertex(-w / 4, -h / 2);
        vertex(0, 0);
        vertex(-w / 4, h / 2);
        vertex(-w / 2, 0);
        endShape();

        noFill();
        stroke(stClr);
        beginShape();
        vertex(-w / 8, -h / 2);
        vertex(w / 8, 0);
        vertex(-w / 8, h / 2);
        endShape();
        beginShape();
        vertex(0, -h / 2);
        vertex(w / 4, 0);
        vertex(0, h / 2);
        endShape();
      }
      else if (shapeType === 2) {
        circle(0, -h * 0.25, w * 0.25);

        noFill();
        stroke(stClr);
        arc(0, -h / 4, h / 2, h / 2, PI * 0.5, PI * 2.1);
        arc(0, h / 4, h / 2, h / 2, -PI * 0.5, PI * 0.6);
      }
      else if (shapeType === 3) {
        beginShape();
        vertex(w / 2, 0);
        vertex(w / 4, h / 2);
        vertex(-w / 4, h / 2);
        endShape();

        noFill();
        stroke(stClr);
        beginShape();
        vertex(w / 4, h / 2);
        vertex(-w / 4, h / 2);
        vertex(-w / 2, 0);
        endShape();
      }
      else if (shapeType === 4) {
        rect(0, h / 8, w / 2, h / 4);

        noFill();
        stroke(stClr);
        arc(-w / 4, 0, w / 2, w / 2, -PI / 2, 0);
        arc(w / 4, 0, w / 2, w / 2, PI, PI * 1.5);
        line(0, 0, 0, h / 2);
      }
      else if (shapeType === 5) {
        circle(-w / 4, 0, w * 0.35);
        fill(colors[1]);
        circle(w * 0.1, 0, w * 0.2);

        noFill();
        stroke(stClr);
        line(w / 4, h / 2, -w / 4, h / 2);
        line(-w / 4, 0, 0, h / 2);
      }
      else if (shapeType === 6) {
        arc(0, 0, h, h, PI, TAU);
        fill(colors[1]);
        beginShape();
        vertex(-w * 0.2, h * 0.3);
        vertex(0, 0);
        vertex(w * 0.2, h * 0.3);
        endShape();

        noFill();
        stroke(stClr);
        beginShape();
        vertex(-w * 0.2, h * 0.1);
        vertex(0, -h * 0.2);
        vertex(w * 0.2, h * 0.1);
        endShape();
      }
      else if (shapeType === 7) {
        for (let i = 0; i < 2; i++) {
          if (i == 1) {
            fill(colors[1]);
          }

          beginShape();
          vertex(-w / 4, -h / 2);
          vertex(0, 0);
          vertex(-w / 4, h / 2);
          vertex(-w / 2, 0);
          endShape(CLOSE);
          rotate(TAU / 3);
        }
      }
      else if (shapeType === 8) {
        circle(0, 0, h * 0.8);
        fill(colors[1]);
        circle(w * 0.16, 0, h * 0.3);
      }
      else if (shapeType === 9) {
        beginShape();
        vertex(-w / 2, 0);
        vertex(-w / 4, -h / 2);
        vertex(-w / 4, h / 2);
        endShape();
        fill(colors[1]);
        beginShape();
        vertex(0, 0);
        vertex(w / 4, 0);
        vertex(0, h / 2);
        endShape();
      }
      else if (shapeType === 10) {
        beginShape();
        vertex(-w / 4, h / 2);
        vertex(-w / 4, -h / 2);
        vertex(w / 4, -h / 2);
        endShape();
        fill(colors[1]);
        circle(-w * 0.25, h * 0.2, h * 0.3);
      }
      else if (shapeType === 11) {
        beginShape();
        vertex(0, 0);
        vertex(-w / 4, h / 2);
        vertex(w / 4, h / 2);
        endShape();

        noFill();
        stroke(stClr);
        beginShape();
        vertex(-w / 8, -h / 4);
        vertex(-w / 8 * 3, h / 4);
        vertex(w / 8, h / 4);
        endShape();
      }
      else if (shapeType === 12) {
        arc(-w / 8, -h / 4, h / 2, h / 2, (TAU / 6), (TAU / 6) * 4);
        fill(colors[1]);
        arc(w / 8, h / 4, h / 2, h / 2, (TAU / 6) * 4, (TAU / 6));
        noFill();
        stroke(stClr);
        line(-w / 4, -h / 2, w / 4, h / 2);
      }
      else if (shapeType === 13) {
        circle(0, -h / 16 * 5, w * 0.2);
        circle(0, h / 16 * 5, w * 0.2);
        noFill();
        stroke(stClr);
        beginShape();
        vertex(w / 4, -h / 2);
        vertex(-w / 4, -h / 2);
        vertex(w / 4, h / 2);
        vertex(w / 4, h / 2);
        vertex(-w / 4, h / 2);
        endShape();
      }
      else if (shapeType === 14) {
        beginShape();
        vertex(-w / 8 * 3, h / 4);
        vertex(w / 8 * 3, h / 4);
        vertex(w / 4, h / 2);
        vertex(-w / 4, h / 2);
        endShape();
        fill(colors[1]);
        circle(0, -h * 0.2, w * 0.2);

        stroke(stClr);
        line(0, -h * 0.2, 0, h * 0.3);
      }
      else if (shapeType === 15) {
        beginShape();
        for (let i = 0; i < 6; i++) {
          let a = map(i, 0, 6, 0, TAU);
          let r = h * 0.25;
          vertex(r * cos(a), r * sin(a));
        }
        endShape();

        stroke(stClr);
        line(-w * 0.15, h * 0.3, w * 0.15, h * 0.3);
        line(-w * 0., h * 0.4, w * 0.2, h * 0.4);
      }
      pop();
    }

    // ============================================================
    // Theme & Parameter Randomizer (Triggered on Click / Spacebar)
    // ============================================================
    function randomizeAll(updateGui = true) {
      // 1. Pick a random color scheme from all 19 curated schemes
      const schemeKeys = Object.keys(COLOR_SCHEMES);
      settings.colorScheme = random(schemeKeys);
      settings.invertColors = random() > 0.75;
      settings.glowEffect = random() > 0.6;
      settings.showGridWireframe = random() > 0.7;

      // 2. Randomize animation dynamics
      const animModes = [
        'Harmonic Waves', 
        'Stepped Hex Turn', 
        'Vortex Swirl', 
        'Pulse & Breathing', 
        'Kinetic Float', 
        'Mouse Magnetic'
      ];
      settings.animMode = random(animModes);
      settings.animSpeed = round(random(0.6, 2.0), 2);
      settings.pulseIntensity = round(random(0.12, 0.45), 2);
      settings.rotIntensity = round(random(0.2, 1.0), 2);
      settings.waveFrequency = round(random(0.004, 0.015), 4);

      // 3. Randomize geometric parameters
      settings.hexSize = floor(random(75, 140));
      settings.shapeScale = round(random(0.68, 0.95), 2);
      settings.strokeWeight = round(random(0.03, 0.08), 3);

      const filterModes = ['All Shapes (0-15)', 'Circles & Arcs', 'Polygons & Angles', 'Minimal Lines'];
      settings.shapeFilter = random() > 0.3 ? 'All Shapes (0-15)' : random(filterModes);

      // 4. Re-generate honeycomb with fresh seed
      generateScene();

      // 5. Sync GUI
      if (updateGui && gui) {
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      }
    }

    function resetCamera() {
      panX = 0;
      panY = 0;
      settings.zoom = 1.0;
      if (zoomController) zoomController.updateDisplay();
    }

    // ============================================================
    // Viewport Resize & Window Event Handling
    // ============================================================
    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
      centerX = width / 2;
      centerY = height / 2;
      generateScene();
    }

    // ============================================================
    // Mouse Drag, Pan, Zoom & Click-to-Randomize Interaction
    // ============================================================
    function mouseWheel(event) {
      if (!event) return;
      let zoomFactor = event.deltaY < 0 ? 1.08 : 0.92;
      let oldZoom = settings.zoom;
      let newZoom = constrain(oldZoom * zoomFactor, 0.2, 8.0);

      // Smooth zoom centered towards mouse cursor
      let mouseWorldX = (mouseX - panX) / oldZoom;
      let mouseWorldY = (mouseY - panY) / oldZoom;

      panX = mouseX - mouseWorldX * newZoom;
      panY = mouseY - mouseWorldY * newZoom;
      settings.zoom = newZoom;

      if (zoomController) zoomController.updateDisplay();
      return false; // Prevent standard page scrolling
    }

    function mousePressed(event) {
      if (event && event.target && event.target.closest && event.target.closest('.lil-gui')) {
        return;
      }
      isDragging = true;
      hasDragged = false;
      dragStartX = mouseX;
      dragStartY = mouseY;
      startPanX = panX;
      startPanY = panY;
    }

    function mouseDragged(event) {
      if (!isDragging) return;
      if (event && event.target && event.target.closest && event.target.closest('.lil-gui')) {
        return;
      }
      let dx = mouseX - dragStartX;
      let dy = mouseY - dragStartY;
      if (Math.hypot(dx, dy) > 5) {
        hasDragged = true;
        document.body.style.cursor = 'grabbing';
      }
      panX = startPanX + dx;
      panY = startPanY + dy;
    }

    function mouseReleased(event) {
      if (event && event.target && event.target.closest && event.target.closest('.lil-gui')) {
        isDragging = false;
        return;
      }
      document.body.style.cursor = 'grab';

      // If user clicked without dragging, trigger randomization
      if (isDragging && !hasDragged) {
        if (settings.clickToRandomize) {
          randomizeAll(true);
        }
      }
      isDragging = false;
    }

    function doubleClicked() {
      resetCamera();
    }

    // Keyboard Shortcuts
    function keyPressed() {
      if (key === ' ' || keyCode === 32) {
        if (settings.clickToRandomize) {
          randomizeAll(true);
        } else {
          generateScene();
        }
        return false;
      }
      if (key === 'r' || key === 'R') {
        resetCamera();
      }
      if (key === 'p' || key === 'P') {
        settings.isPlaying = !settings.isPlaying;
        if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
      }
    }

    // Touch Support for Mobile / Tablet Devices
    function touchStarted(event) {
      if (touches && touches.length === 2) {
        touchStartDist = Math.hypot(touches[0].x - touches[1].x, touches[0].y - touches[1].y);
        initialZoom = settings.zoom;
        return false;
      } else if (touches && touches.length === 1) {
        mousePressed(event);
      }
      return true;
    }

    function touchMoved(event) {
      if (touches && touches.length === 2) {
        let currentDist = Math.hypot(touches[0].x - touches[1].x, touches[0].y - touches[1].y);
        if (touchStartDist > 0) {
          let factor = currentDist / touchStartDist;
          settings.zoom = constrain(initialZoom * factor, 0.2, 8.0);
          if (zoomController) zoomController.updateDisplay();
        }
        return false;
      } else if (touches && touches.length === 1) {
        mouseDragged(event);
      }
      return true;
    }

    function touchEnded(event) {
      if (touches && touches.length < 2) {
        touchStartDist = 0;
      }
      mouseReleased(event);
      return true;
    }

    // ============================================================
    // Modern lil-gui Controls Architecture
    // ============================================================
    function initGUI() {
      gui = new lil.GUI({ title: 'OKAZZ Honeycomb 609' });

      // Folder 1: Color Schemes & Theme
      const fTheme = gui.addFolder('Palette & Theme');
      fTheme.add(settings, 'colorScheme', Object.keys(COLOR_SCHEMES))
        .name('Scheme (19 Total)')
        .onChange(() => {});
      fTheme.add(settings, 'invertColors')
        .name('Invert Colors')
        .onChange(() => {});
      fTheme.add(settings, 'glowEffect')
        .name('Luminous Glow')
        .onChange(() => {});
      fTheme.add(settings, 'showGridWireframe')
        .name('Grid Wireframe')
        .onChange(() => {});

      // Folder 2: Animation & Motion
      const fAnim = gui.addFolder('Animation Dynamics');
      fAnim.add(settings, 'isPlaying')
        .name('Play Animation');
      fAnim.add(settings, 'animMode', [
        'Harmonic Waves', 
        'Stepped Hex Turn', 
        'Vortex Swirl', 
        'Pulse & Breathing', 
        'Kinetic Float', 
        'Mouse Magnetic',
        'Static / Frozen'
      ]).name('Motion Mode');
      fAnim.add(settings, 'animSpeed', 0.1, 3.0, 0.05)
        .name('Animation Speed');
      fAnim.add(settings, 'pulseIntensity', 0.0, 0.6, 0.01)
        .name('Pulse Amplitude');
      fAnim.add(settings, 'rotIntensity', 0.0, 1.5, 0.05)
        .name('Rotation Swing');
      fAnim.add(settings, 'waveFrequency', 0.001, 0.02, 0.001)
        .name('Wave Frequency');
      fAnim.add(settings, 'mouseInteraction')
        .name('Mouse Resonance');

      // Folder 3: Geometry & Proportions
      const fGeom = gui.addFolder('Honeycomb Geometry');
      fGeom.add(settings, 'hexSize', 40, 220, 5)
        .name('Hexagon Size')
        .onChange(() => generateScene());
      fGeom.add(settings, 'shapeScale', 0.3, 1.3, 0.02)
        .name('Shape Scale');
      fGeom.add(settings, 'strokeWeight', 0.01, 0.12, 0.005)
        .name('Stroke Weight');
      fGeom.add(settings, 'shapeFilter', [
        'All Shapes (0-15)', 
        'Circles & Arcs', 
        'Polygons & Angles', 
        'Minimal Lines'
      ]).name('Shape Filter')
        .onChange(() => generateScene());

      // Folder 4: Camera Viewport
      const fView = gui.addFolder('Camera & Viewport');
      zoomController = fView.add(settings, 'zoom', 0.2, 6.0, 0.05)
        .name('Zoom Level');
      fView.add(settings, 'resetCamera')
        .name('Reset Camera (R)');

      // Folder 5: Procedural Randomization & Actions
      const fActions = gui.addFolder('Procedural Actions');
      fActions.add(settings, 'clickToRandomize')
        .name('Click Scene Randomizer');
      fActions.add(settings, 'randomize')
        .name('Randomize Everything');
      fActions.add(settings, 'regenerate')
        .name('Reseed Geometry (Space)');
      fActions.add(settings, 'savePNG')
        .name('Export HD Image (S)');

      // Default state: Keep open for immediate exploration
      gui.open();
    }
  </script>
