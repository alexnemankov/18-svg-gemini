const ANIMATION_PRESETS = {
  'Static (No Camera Movement)': {
    getPose: (t, d) => ({
      pos: new THREE.Vector3(0, 0, d),
      target: new THREE.Vector3(0, 0, 0)
    })
  },
  'Slow Orbit': {
    getPose: (t, d) => {
      const angle = t * 0.12;
      const elev = Math.sin(t * 0.05) * 0.22 + 0.35;
      const r = d * Math.cos(elev);
      return {
        pos: new THREE.Vector3(
          Math.sin(angle) * r,
          Math.sin(elev) * d * 0.85,
          Math.cos(angle) * r
        ),
        target: new THREE.Vector3(0, 0, 0)
      };
    }
  },
  'Floating Drift': {
    getPose: (t, d) => {
      const swayX = Math.sin(t * 0.09) * (d * 0.18);
      const swayY = Math.cos(t * 0.07) * (d * 0.12);
      const swayZ = Math.sin(t * 0.05) * (d * 0.08);
      return {
        pos: new THREE.Vector3(swayX, swayY, d + swayZ),
        target: new THREE.Vector3(swayX * 0.15, swayY * 0.15, 0)
      };
    }
  },
  'Zenith Mandala (Top-Down Float)': {
    getPose: (t, d) => {
      const ang = t * 0.08;
      const drift = Math.sin(t * 0.11) * (d * 0.1);
      return {
        pos: new THREE.Vector3(
          Math.sin(ang) * drift,
          d * 0.95 + Math.cos(t * 0.09) * 0.5,
          Math.cos(ang) * drift + 0.01
        ),
        target: new THREE.Vector3(0, 0, 0)
      };
    }
  },
  'Cinematic Low Sweep': {
    getPose: (t, d) => {
      const sweep = Math.sin(t * 0.1);
      const ang = sweep * 0.8;
      return {
        pos: new THREE.Vector3(
          Math.sin(ang) * d * 0.85,
          -d * 0.35 + sweep * 0.5,
          Math.cos(ang) * d * 0.85
        ),
        target: new THREE.Vector3(0, 0.5, 0)
      };
    }
  },
  'Spiral Helix Orbit': {
    getPose: (t, d) => {
      const ang = t * 0.13;
      const height = Math.sin(t * 0.15) * (d * 0.38);
      const r = Math.sqrt(Math.max(d * d - height * height, 10.0));
      return {
        pos: new THREE.Vector3(
          Math.sin(ang) * r,
          height,
          Math.cos(ang) * r
        ),
        target: new THREE.Vector3(0, 0, 0)
      };
    }
  },
  'Hypnotic Pendulum': {
    getPose: (t, d) => {
      const pend = Math.sin(t * 0.16) * 0.55;
      return {
        pos: new THREE.Vector3(
          Math.sin(pend) * d,
          Math.cos(pend * 2.0) * 1.5 + 0.5,
          Math.cos(pend) * d
        ),
        target: new THREE.Vector3(0, 0, 0)
      };
    }
  },
  'Breathing Dolly Drift': {
    getPose: (t, d) => {
      const pulse = Math.sin(t * 0.14);
      const ang = t * 0.05;
      const dist = d * (0.85 + 0.25 * pulse);
      return {
        pos: new THREE.Vector3(
          Math.sin(ang) * 1.8,
          Math.cos(ang) * 1.2 + 0.5,
          dist
        ),
        target: new THREE.Vector3(0, 0, 0)
      };
    }
  }
};

// ============================================================================
// 14 PROCEDURAL 3D SHAPE BUILDERS (CORRESPONDING TO CODEPEN SHAPES 0..13)
// ============================================================================
function buildGlyphMesh(shapeType, size, mod, mat) {
  const group = new THREE.Group();
  const half = size * 0.5;
  const depth = size * PARAMS.geometry.extrusionDepth;

  switch (shapeType) {
    case 0: { // fillCircle
      const r = half * 0.92;
      const geom = new THREE.CylinderGeometry(r, r, depth, 36);
      geom.rotateX(Math.PI * 0.5);
      const m = new THREE.Mesh(geom, mat);
      m.castShadow = true;
      m.receiveShadow = true;
      group.add(m);
      break;
    }
    case 1: { // strokeCircle (ring)
      const r = half * 0.72;
      const tube = half * 0.2;
      const geom = new THREE.TorusGeometry(r, tube, 16, 40);
      const m = new THREE.Mesh(geom, mat);
      m.castShadow = true;
      m.receiveShadow = true;
      group.add(m);
      break;
    }
    case 2: { // tileFillCircle (3x3 grid of circles)
      const subR = (size / 6) * 0.82;
      const step = size / 3;
      for (let y = 0; y < 3; y++) {
        for (let x = 0; x < 3; x++) {
          const idx = y * 3 + x;
          if (idx % mod === 0) {
            const geom = new THREE.CylinderGeometry(subR, subR, depth, 24);
            geom.rotateX(Math.PI * 0.5);
            const m = new THREE.Mesh(geom, mat);
            m.position.set((x - 1) * step, (1 - y) * step, 0);
            m.castShadow = true;
            m.receiveShadow = true;
            group.add(m);
          }
        }
      }
      break;
    }
    case 3: { // tileStrokeCircle (3x3 grid of rings)
      const subR = (size / 6) * 0.62;
      const tube = (size / 6) * 0.18;
      const step = size / 3;
      for (let y = 0; y < 3; y++) {
        for (let x = 0; x < 3; x++) {
          const idx = y * 3 + x;
          if (idx % mod === 0) {
            const geom = new THREE.TorusGeometry(subR, tube, 12, 28);
            const m = new THREE.Mesh(geom, mat);
            m.position.set((x - 1) * step, (1 - y) * step, 0);
            m.castShadow = true;
            m.receiveShadow = true;
            group.add(m);
          }
        }
      }
      break;
    }
    case 4: { // stackCircle (concentric circles)
      const r1 = half * 0.85;
      const tube1 = half * 0.12;
      const g1 = new THREE.TorusGeometry(r1, tube1, 16, 36);
      const m1 = new THREE.Mesh(g1, mat);
      m1.castShadow = true;
      group.add(m1);

      const r2 = half * 0.42;
      const g2 = new THREE.CylinderGeometry(r2, r2, depth * 1.2, 32);
      g2.rotateX(Math.PI * 0.5);
      const m2 = new THREE.Mesh(g2, mat);
      m2.position.z = depth * 0.15;
      m2.castShadow = true;
      group.add(m2);
      break;
    }
    case 5: { // fillRect
      const geom = new THREE.BoxGeometry(size * 0.88, size * 0.88, depth);
      const m = new THREE.Mesh(geom, mat);
      m.castShadow = true;
      m.receiveShadow = true;
      group.add(m);
      break;
    }
    case 6: { // strokeRect (square frame)
      const w = size * 0.88;
      const lw = size * 0.18;
      const topGeom = new THREE.BoxGeometry(w, lw, depth);
      const mTop = new THREE.Mesh(topGeom, mat); mTop.position.set(0, (w - lw) * 0.5, 0);
      const mBot = new THREE.Mesh(topGeom, mat); mBot.position.set(0, -(w - lw) * 0.5, 0);
      const sideGeom = new THREE.BoxGeometry(lw, w - lw * 2, depth);
      const mLeft = new THREE.Mesh(sideGeom, mat); mLeft.position.set(-(w - lw) * 0.5, 0, 0);
      const mRight = new THREE.Mesh(sideGeom, mat); mRight.position.set((w - lw) * 0.5, 0, 0);
      [mTop, mBot, mLeft, mRight].forEach(m => { m.castShadow = true; group.add(m); });
      break;
    }
    case 7: { // tileFillRect (3x3 grid of boxes)
      const step = size / 3;
      const boxSize = step * 0.78;
      for (let y = 0; y < 3; y++) {
        for (let x = 0; x < 3; x++) {
          const idx = y * 3 + x;
          if (idx % mod === 0) {
            const geom = new THREE.BoxGeometry(boxSize, boxSize, depth);
            const m = new THREE.Mesh(geom, mat);
            m.position.set((x - 1) * step, (1 - y) * step, 0);
            m.castShadow = true;
            group.add(m);
          }
        }
      }
      break;
    }
    case 8: { // tileStrokeRect (3x3 grid of square frames)
      const step = size / 3;
      const w = step * 0.8;
      const lw = step * 0.18;
      for (let y = 0; y < 3; y++) {
        for (let x = 0; x < 3; x++) {
          const idx = y * 3 + x;
          if (idx % mod === 0) {
            const px = (x - 1) * step;
            const py = (1 - y) * step;
            const tg = new THREE.BoxGeometry(w, lw, depth);
            const mt = new THREE.Mesh(tg, mat); mt.position.set(px, py + (w - lw) * 0.5, 0);
            const mb = new THREE.Mesh(tg, mat); mb.position.set(px, py - (w - lw) * 0.5, 0);
            const sg = new THREE.BoxGeometry(lw, w - lw * 2, depth);
            const ml = new THREE.Mesh(sg, mat); ml.position.set(px - (w - lw) * 0.5, py, 0);
            const mr = new THREE.Mesh(sg, mat); mr.position.set(px + (w - lw) * 0.5, py, 0);
            [mt, mb, ml, mr].forEach(m => { m.castShadow = true; group.add(m); });
          }
        }
      }
      break;
    }
    case 9: { // stackStrokeRect (two square frames, one rotated 45°)
      const w = size * 0.84;
      const lw = size * 0.15;
      const makeFrame = (rot) => {
        const fGroup = new THREE.Group();
        const tg = new THREE.BoxGeometry(w, lw, depth);
        const mt = new THREE.Mesh(tg, mat); mt.position.set(0, (w - lw) * 0.5, 0);
        const mb = new THREE.Mesh(tg, mat); mb.position.set(0, -(w - lw) * 0.5, 0);
        const sg = new THREE.BoxGeometry(lw, w - lw * 2, depth);
        const ml = new THREE.Mesh(sg, mat); ml.position.set(-(w - lw) * 0.5, 0, 0);
        const mr = new THREE.Mesh(sg, mat); mr.position.set((w - lw) * 0.5, 0, 0);
        [mt, mb, ml, mr].forEach(m => { m.castShadow = true; fGroup.add(m); });
        fGroup.rotation.z = rot;
        return fGroup;
      };
      group.add(makeFrame(0));
      group.add(makeFrame(Math.PI * 0.25));
      break;
    }
    case 10: { // verLines (vertical slats)
      const slatW = (size / 5) * 0.72;
      const slatH = size * 0.88;
      for (let i = 0; i < 5; i++) {
        if (i % 2 === 0) {
          const posX = ((i - 2) / 2) * (size * 0.38);
          const geom = new THREE.BoxGeometry(slatW, slatH, depth);
          const m = new THREE.Mesh(geom, mat);
          m.position.set(posX, 0, 0);
          m.castShadow = true;
          group.add(m);
        }
      }
      break;
    }
    case 11: { // horLines (horizontal slats)
      const slatH = (size / 4) * 0.72;
      const slatW = size * 0.88;
      [-size * 0.26, 0, size * 0.26].forEach((posY, idx) => {
        if (idx % 2 === 0) {
          const geom = new THREE.BoxGeometry(slatW, slatH, depth);
          const m = new THREE.Mesh(geom, mat);
          m.position.set(0, posY, 0);
          m.castShadow = true;
          group.add(m);
        }
      });
      break;
    }
    case 12: { // crossLine (diagonal 'X')
      const barLen = size * 0.92;
      const barThick = size * 0.16;
      const g1 = new THREE.BoxGeometry(barLen, barThick, depth);
      const m1 = new THREE.Mesh(g1, mat); m1.rotation.z = Math.PI * 0.25; m1.castShadow = true;
      const g2 = new THREE.BoxGeometry(barLen, barThick, depth);
      const m2 = new THREE.Mesh(g2, mat); m2.rotation.z = -Math.PI * 0.25; m2.castShadow = true;
      group.add(m1);
      group.add(m2);
      break;
    }
    case 13: { // polygon (diamond / rotated square)
      const geom = new THREE.BoxGeometry(size * 0.64, size * 0.64, depth);
      const m = new THREE.Mesh(geom, mat);
      m.rotation.z = Math.PI * 0.25;
      m.castShadow = true;
      m.receiveShadow = true;
      group.add(m);
      break;
    }
  }

  return group;
}

// ============================================================================
// HIERARCHICAL GRID SCULPTURE CONSTRUCTION
// ============================================================================
let gridContainer = new THREE.Group();
scene.add(gridContainer);

let kineticElements = [];
let gridData = [];

function rebuildGrid() {
  while (gridContainer.children.length > 0) {
    const obj = gridContainer.children[0];
    gridContainer.remove(obj);
    if (obj.geometry) obj.geometry.dispose();
  }

  kineticElements = [];
  gridData = [];

  const num = PARAMS.geometry.num;
  const totalSize = PARAMS.geometry.gridSize;
  const s = totalSize / num;
  const s2 = s / num;
  const halfTotal = totalSize * 0.5;

  let globalIndex = 0;

  for (let y = 0; y < num; y++) {
    for (let x = 0; x < num; x++) {
      const cx = (x + 0.5) * s - halfTotal;
      const cy = (y + 0.5) * s - halfTotal;

      // Base tile backing plate
      const plateGeom = new THREE.BoxGeometry(s * 0.94, s * 0.94, 0.25);
      const plateMesh = new THREE.Mesh(plateGeom, plateMat);
      plateMesh.position.set(cx, cy, -0.2);
      plateMesh.receiveShadow = true;
      gridContainer.add(plateMesh);

      // Macro glyph
      const macroShape = Math.floor(Math.random() * 14);
      const macroMod = Math.floor(Math.random() * 5) + 1;
      const isMacroAccent = Math.random() > 0.88;
      const macroMat = isMacroAccent ? accentMat : (Math.random() > 0.5 ? primaryMat : baseMat);

      const macroMesh = buildGlyphMesh(macroShape, s * 0.88, macroMod, macroMat);
      macroMesh.position.set(cx, cy, 0.05);
      gridContainer.add(macroMesh);

      const macroEl = {
        mesh: macroMesh,
        origX: cx,
        origY: cy,
        origZ: 0.05,
        currentY: cy,
        fallIndex: globalIndex++,
        isFalling: (globalIndex % 3 === 0),
        size: s,
        seed: Math.random() * 100
      };
      kineticElements.push(macroEl);
      gridData.push({ x: cx, y: cy, s: s, shape: macroShape, mod: macroMod, isMacro: true });

      // Nested sub-cells (micro glyphs)
      for (let i = 0; i < num; i++) {
        for (let j = 0; j < num; j++) {
          const mx = cx + (j + 0.5) * s2 - s * 0.5;
          const my = cy + (i + 0.5) * s2 - s * 0.5;

          const microShape = Math.floor(Math.random() * 14);
          const microMod = Math.floor(Math.random() * 5) + 1;
          const microMat = (i + j) % 2 === 0 ? accentMat : secondaryMat;

          const microMesh = buildGlyphMesh(microShape, s2 * 0.85, microMod, microMat);
          microMesh.position.set(mx, my, 0.32);
          gridContainer.add(microMesh);

          const microEl = {
            mesh: microMesh,
            origX: mx,
            origY: my,
            origZ: 0.32,
            currentY: my,
            fallIndex: globalIndex++,
            isFalling: (globalIndex % 3 === 0),
            size: s2,
            seed: Math.random() * 100
          };
          kineticElements.push(microEl);
          gridData.push({ x: mx, y: my, s: s2, shape: microShape, mod: microMod, isMacro: false });
        }
      }
    }
  }

  updateColors();
  applyMaterialParams();
}

// Draw the authentic CodePen 2D XOR pattern onto offscreen canvas for Hybrid backdrop
function update2DXorCanvas(time) {
  if (PARAMS.geometry.displayMode !== 'Hybrid (3D + 2D XOR Backdrop)') return;

  xorCtx.fillStyle = PARAMS.colors.background;
  xorCtx.fillRect(0, 0, 1024, 1024);
  xorCtx.globalCompositeOperation = 'xor';

  const total = PARAMS.geometry.gridSize;
  const scale = 1024 / total;

  for (let i = 0; i < kineticElements.length; i++) {
    const el = kineticElements[i];
    const px = (el.origX + total * 0.5) * scale;
    const py = 1024 - (el.currentY + total * 0.5) * scale;
    const r = el.size * scale * 0.45;

    xorCtx.fillStyle = (i % 3 === 0) ? PARAMS.colors.accent : PARAMS.colors.primary;
    xorCtx.beginPath();
    xorCtx.arc(px, py, r, 0, Math.PI * 2);
    xorCtx.fill();
  }
  xorCtx.globalCompositeOperation = 'source-over';
  xorTexture.needsUpdate = true;
}

// ============================================================================
// KINETIC SCULPTURE MOTION UPDATE
// ============================================================================
function updateSculpture(time, delta) {
  const speed = PARAMS.animation.speed;
  const total = PARAMS.geometry.gridSize;
  const halfTotal = total * 0.5;

  for (let i = 0; i < kineticElements.length; i++) {
    const el = kineticElements[i];

    // 1. Classic CodePen falling columns animation
    if (PARAMS.animation.falling && el.isFalling && !PARAMS.animation.paused) {
      el.currentY -= delta * speed * 3.8;
      if (el.currentY < -halfTotal - el.size) {
        el.currentY += total + el.size * 2;
      }
    }

    el.mesh.position.y = el.currentY;

    // 2. 3D Wave ripples in Z
    const normX = el.origX / halfTotal;
    const normY = el.origY / halfTotal;
    const wave = Math.sin(
      normX * Math.PI * PARAMS.geometry.waveFreq +
      normY * Math.PI * PARAMS.geometry.waveFreq +
      time * PARAMS.animation.waveSpeed
    ) * PARAMS.geometry.waveHeight;

    el.mesh.position.z = el.origZ + wave;

    // 3. Subtle individual glyph kinetic rotation
    if (PARAMS.geometry.rotAmp > 0) {
      el.mesh.rotation.z = Math.sin(time * PARAMS.animation.rotSpeed + el.seed) * PARAMS.geometry.rotAmp;
    } else {
      el.mesh.rotation.z = 0;
    }
  }

  // Core point light subtle breathing pulse
  coreLight.intensity = PARAMS.lighting.coreLightIntensity * PARAMS.lighting.sceneLightIntensity * (1.0 + 0.28 * Math.sin(time * 2.2));
  coreLight.position.set(0, 0, 7.0 + 1.2 * Math.sin(time * 1.5));
}

// ============================================================================
// CAMERA RIG & ORBIT ANIMATION MATRIX
// ============================================================================
function updateCameraRig(animTime) {
  camera.fov = PARAMS.camera.fov;
  camera.updateProjectionMatrix();

  const preset = ANIMATION_PRESETS[PARAMS.animation.preset] || ANIMATION_PRESETS['Slow Orbit'];
  const pose = preset.getPose(animTime, PARAMS.camera.distance);

  const relPos = pose.pos.clone().sub(pose.target);

  // 1. Zoom with wheel: scales distance permanently during animation without snapping back
  relPos.multiplyScalar(PARAMS.camera.userZoom);

  // 2. Camera angle change during orbit: yaw & pitch
  relPos.applyAxisAngle(new THREE.Vector3(0, 1, 0), PARAMS.camera.userAngleYaw);
  const rightAxis = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), PARAMS.camera.userAngleYaw);
  relPos.applyAxisAngle(rightAxis, PARAMS.camera.userAnglePitch);

  // 3. Pan / Drag object across screen
  const camTarget = pose.target.clone();
  const panOffset = new THREE.Vector3(PARAMS.camera.userPanX, PARAMS.camera.userPanY, 0);
  panOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), PARAMS.camera.userAngleYaw);

  camTarget.add(panOffset);
  const finalCamPos = camTarget.clone().add(relPos);

  camera.position.copy(finalCamPos);
  camera.lookAt(camTarget);
}

// ============================================================================
// POINTER & TOUCH INTERACTIONS (ZOOM, DRAG, ORBIT, CLICK RANDOMIZE)
// ============================================================================
let isPointerDown = false;
let pointerButton = 0;
let pointerStartX = 0;
let pointerStartY = 0;
let lastPointerX = 0;
let lastPointerY = 0;
let pointerDownTime = 0;
let hasDragged = false;

function onPointerDown(e) {
  if (e.button !== 0 && e.button !== 1 && e.button !== 2) return;
  isPointerDown = true;
  pointerButton = e.button;
  pointerStartX = e.clientX;
  pointerStartY = e.clientY;
  lastPointerX = e.clientX;
  lastPointerY = e.clientY;
  pointerDownTime = performance.now();
  hasDragged = false;
  try { renderer.domElement.setPointerCapture(e.pointerId); } catch (_) {}
}

function onPointerMove(e) {
  if (!isPointerDown) return;
  const dx = e.clientX - lastPointerX;
  const dy = e.clientY - lastPointerY;
  lastPointerX = e.clientX;
  lastPointerY = e.clientY;

  if (Math.hypot(e.clientX - pointerStartX, e.clientY - pointerStartY) > 5) {
    hasDragged = true;
  }

  let isOrbit = false;
  if (pointerButton === 2 || (pointerButton === 0 && e.shiftKey)) {
    isOrbit = (PARAMS.camera.dragMode === 'Pan (Drag Object)');
  } else if (pointerButton === 1) {
    isOrbit = false;
  } else if (pointerButton === 0) {
    isOrbit = (PARAMS.camera.dragMode === 'Rotate (Camera Angle)');
  }

  if (isOrbit) {
    // Change camera angle during orbit
    PARAMS.camera.userAngleYaw += dx * 0.006;
    PARAMS.camera.userAnglePitch = THREE.MathUtils.clamp(
      PARAMS.camera.userAnglePitch + dy * 0.006,
      -Math.PI * 0.48,
      Math.PI * 0.48
    );
  } else {
    // Drag object across screen (Pan)
    const dist = PARAMS.camera.distance * PARAMS.camera.userZoom;
    const vHeight = 2.0 * Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5)) * dist;
    const factor = vHeight / Math.max(window.innerHeight, 1);
    PARAMS.camera.userPanX += dx * factor;
    PARAMS.camera.userPanY -= dy * factor;
  }
  updateAllGuiDisplays();
}

function onPointerUp(e) {
  if (!isPointerDown) return;
  isPointerDown = false;
  try { renderer.domElement.releasePointerCapture(e.pointerId); } catch (_) {}

  const duration = performance.now() - pointerDownTime;
  if (!hasDragged && duration < 320 && pointerButton === 0 && !e.shiftKey) {
    if (PARAMS.performance.clickRandomize) {
      randomizeScene();
    }
  }
}

function onWheel(e) {
  e.preventDefault();
  // Zoom with wheel permanently without returning to predefined animation zoom
  const factor = e.deltaY < 0 ? 0.92 : 1.08;
  PARAMS.camera.userZoom = THREE.MathUtils.clamp(PARAMS.camera.userZoom * factor, 0.15, 6.0);
  updateAllGuiDisplays();
}

function attachPointerListeners(canvas) {
  window.addEventListener('contextmenu', (e) => {
    if (e.target === canvas) e.preventDefault();
  });
  canvas.addEventListener('pointerdown', onPointerDown);
  canvas.addEventListener('pointermove', onPointerMove);
  canvas.addEventListener('pointerup', onPointerUp);
  canvas.addEventListener('pointercancel', onPointerUp);
  canvas.addEventListener('wheel', onWheel, { passive: false });
}

attachPointerListeners(renderer.domElement);

// ============================================================================
// POST-PROCESSING PIPELINE
// ============================================================================
const VignetteShader = {
  uniforms: {
    tDiffuse: { value: null },
    strength: { value: PARAMS.post.vignetteStrength },
    softness: { value: 0.65 },
    enabled: { value: 1.0 }
  },
  vertexShader: /* glsl */`
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse;
    uniform float strength;
    uniform float softness;
    uniform float enabled;
    varying vec2 vUv;
    void main() {
      vec4 col = texture2D(tDiffuse, vUv);
      if (enabled > 0.5) {
        vec2 uv = (vUv - 0.5) * 2.0;
        float dist = length(uv);
        float vig = smoothstep(0.8, 0.8 - softness, dist * strength);
        col.rgb *= vig;
      }
      gl_FragColor = col;
    }
  `
};

let composer, renderPass, bloomPass, vignettePass, outputPass;

function initComposer() {
  if (composer) {
    composer.renderTarget1.dispose();
    composer.renderTarget2.dispose();
  }
  composer = new EffectComposer(renderer);

  renderPass = new RenderPass(scene, camera);
  composer.addPass(renderPass);

  bloomPass = new UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight),
    PARAMS.post.bloomStrength,
    PARAMS.post.bloomRadius,
    PARAMS.post.bloomThreshold
  );
  bloomPass.enabled = PARAMS.post.bloom;
  composer.addPass(bloomPass);

  vignettePass = new ShaderPass(VignetteShader);
  vignettePass.uniforms.enabled.value = (PARAMS.post.vignette && !PARAMS.colors.greenscreen) ? 1.0 : 0.0;
  vignettePass.uniforms.strength.value = PARAMS.post.vignetteStrength;
  composer.addPass(vignettePass);

  outputPass = new OutputPass();
  composer.addPass(outputPass);
}

initComposer();

// ============================================================================
// PERFORMANCE & ANTIALIAS SWITCHING
// ============================================================================
function applyDPR(val) {
  PARAMS.performance.dpr = val;
  renderer.setPixelRatio(val);
  composer.setPixelRatio(val);
  composer.setSize(window.innerWidth, window.innerHeight);
}

function setAntialias(val) {
  PARAMS.performance.antialias = val;
  const oldCanvas = renderer.domElement;
  const parent = oldCanvas.parentNode;

  renderer.dispose();

  renderer = createRenderer(val);
  parent.replaceChild(renderer.domElement, oldCanvas);
  attachPointerListeners(renderer.domElement);
  initComposer();
}

// ============================================================================
// PROCEDURAL RANDOMIZATION (CLICK TO RANDOMIZE & MANUAL)
// ============================================================================
function randomizeScene() {
  // 1. Pick a random color scheme from the 19 schemes
  const schemeKeys = Object.keys(COLOR_SCHEMES);
  const randomScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
  PARAMS.colors.scheme = randomScheme;
  applyColorScheme(randomScheme);

  // 2. Re-roll geometric parameters
  const numOptions = [3, 4, 5];
  PARAMS.geometry.num = numOptions[Math.floor(Math.random() * numOptions.length)];
  PARAMS.geometry.extrusionDepth = THREE.MathUtils.randFloat(0.12, 0.35);
  PARAMS.geometry.waveHeight = THREE.MathUtils.randFloat(0.3, 2.2);
  PARAMS.geometry.waveFreq = THREE.MathUtils.randFloat(0.8, 3.0);
  PARAMS.geometry.rotAmp = THREE.MathUtils.randFloat(0.05, 0.45);

  // 3. Re-roll motion parameters
  PARAMS.animation.speed = THREE.MathUtils.randFloat(0.6, 1.8);
  PARAMS.animation.waveSpeed = THREE.MathUtils.randFloat(0.8, 2.4);
  PARAMS.animation.rotSpeed = THREE.MathUtils.randFloat(0.5, 2.0);

  // 4. Re-roll materials
  PARAMS.material.metalness = THREE.MathUtils.randFloat(0.2, 0.85);
  PARAMS.material.roughness = THREE.MathUtils.randFloat(0.08, 0.42);
  PARAMS.material.clearcoat = THREE.MathUtils.randFloat(0.3, 1.0);
  PARAMS.material.emissiveIntensity = THREE.MathUtils.randFloat(0.6, 2.2);

  // 5. Re-roll lighting
  PARAMS.lighting.keyLightIntensity = THREE.MathUtils.randFloat(1.2, 2.4);
  PARAMS.lighting.fillLightIntensity = THREE.MathUtils.randFloat(0.5, 1.6);
  PARAMS.lighting.coreLightIntensity = THREE.MathUtils.randFloat(1.2, 2.8);

  // 6. Rebuild and synchronize UI
  rebuildGrid();
  applyLighting();
  applyMaterialParams();
  updateAllGuiDisplays();
}

fMat.add(PARAMS.material, 'roughness', 0.0, 1.0, 0.02).name('Roughness').onChange(applyMaterialParams);
fMat.add(PARAMS.material, 'emissiveIntensity', 0.0, 4.0, 0.05).name('Emissive Intensity').onChange(applyMaterialParams);
fMat.add(PARAMS.material, 'wireframe').name('Wireframe Mode').onChange(applyMaterialParams);

// 6. Lighting & Light Sources
const fLight = gui.addFolder('Lighting & Exposure');
fLight.add(PARAMS.lighting, 'exposure', 0.2, 3.0, 0.01).name('Tone Exposure').onChange(applyLighting);
fLight.add(PARAMS.lighting, 'sceneLightIntensity', 0.0, 3.0, 0.01).name('Scene Light Intensity').onChange(applyLighting);
fLight.add(PARAMS.lighting, 'keyLightIntensity', 0.0, 4.0, 0.05).name('Key Light Intensity').onChange(applyLighting);
fLight.addColor(PARAMS.lighting, 'keyLightColor').name('Key Light Color').onChange(applyLighting);
fLight.add(PARAMS.lighting, 'fillLightIntensity', 0.0, 4.0, 0.05).name('Fill Light Intensity').onChange(applyLighting);
fLight.addColor(PARAMS.lighting, 'fillLightColor').name('Fill Light Color').onChange(applyLighting);
fLight.add(PARAMS.lighting, 'coreLightIntensity', 0.0, 4.0, 0.05).name('Core Light Intensity').onChange(applyLighting);
fLight.addColor(PARAMS.lighting, 'coreLightColor').name('Core Light Color').onChange(applyLighting);
fLight.add(PARAMS.lighting, 'ambientLightIntensity', 0.0, 2.0, 0.05).name('Ambient Intensity').onChange(applyLighting);
fLight.addColor(PARAMS.lighting, 'ambientLightColor').name('Ambient Color').onChange(applyLighting);

// 7. Post-Processing
const fPost = gui.addFolder('Post-Processing');
fPost.add(PARAMS.post, 'bloom').name('Bloom').onChange(v => { bloomPass.enabled = v; });
fPost.add(PARAMS.post, 'bloomStrength', 0.0, 2.5, 0.02).name('Bloom Strength').onChange(v => { bloomPass.strength = v; });
fPost.add(PARAMS.post, 'bloomRadius', 0.0, 1.5, 0.02).name('Bloom Radius').onChange(v => { bloomPass.radius = v; });
fPost.add(PARAMS.post, 'bloomThreshold', 0.0, 1.5, 0.02).name('Bloom Threshold').onChange(v => { bloomPass.threshold = v; });
fPost.add(PARAMS.post, 'vignette').name('Vignette').onChange(v => {
  if (!PARAMS.colors.greenscreen) vignettePass.uniforms.enabled.value = v ? 1.0 : 0.0;
});
fPost.add(PARAMS.post, 'vignetteStrength', 0.0, 1.0, 0.02).name('Vignette Strength').onChange(v => {
  vignettePass.uniforms.strength.value = v;
});

// 8. Performance & Antialiasing
const fPerf = gui.addFolder('Performance & Antialias');
fPerf.add(PARAMS.performance, 'dpr', 0.5, 2.5, 0.25).name('DPR (Pixel Ratio)').onChange(applyDPR);
fPerf.add(PARAMS.performance, 'antialias').name('Three.js Antialias').onChange(setAntialias);

gui.folders.forEach(f => f.close());

// ============================================================================
// HIDE / SHOW UI WITH "H" KEY
// ============================================================================
let guiVisible = true;
window.addEventListener('keydown', (e) => {
  if (e.key === 'h' || e.key === 'H' || e.code === 'KeyH') {
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
    guiVisible = !guiVisible;
    if (typeof gui.show === 'function' && typeof gui.hide === 'function') {
      if (guiVisible) gui.show(); else gui.hide();
    } else {
      gui.domElement.style.display = guiVisible ? '' : 'none';
    }
  }
});

// ============================================================================
// WINDOW RESIZE HANDLER
// ============================================================================
window.addEventListener('resize', () => {
  const width = window.innerWidth;
  const height = window.innerHeight;
  camera.aspect = width / height;
  camera.updateProjectionMatrix();
  renderer.setSize(width, height);
  composer.setSize(width, height);
});

// Build initial scene
rebuildGrid();
applyLighting();

// ============================================================================
// AUTO INFINITE ANIMATION LOOP
// ============================================================================
const clock = new THREE.Clock();
let sculptureTime = 0.0;
let cameraTime = 0.0;

renderer.setAnimationLoop(() => {
  const delta = Math.min(clock.getDelta(), 0.06);

  if (!PARAMS.animation.paused) {
    sculptureTime += delta;
    cameraTime += delta;
  }

  updateSculpture(sculptureTime, delta);
  updateCameraRig(cameraTime);
  update2DXorCanvas(sculptureTime);

  composer.render();
});
</script>
</body>
</html>
