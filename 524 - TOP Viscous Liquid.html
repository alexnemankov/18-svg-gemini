  const radAngle = THREE.MathUtils.degToRad(PARAMS.lighting.keyAngle);
  const radElev = THREE.MathUtils.degToRad(PARAMS.lighting.keyElevation);
  dirLight.position.set(
    Math.cos(radAngle) * Math.cos(radElev) * 5,
    Math.sin(radAngle) * Math.cos(radElev) * 5,
    Math.sin(radElev) * 5
  );
  dirLight.color.set(PARAMS.lighting.keyColor);
  dirLight.intensity = PARAMS.lighting.keyIntensity * PARAMS.lighting.sceneIntensity;

  ambLight.color.set(PARAMS.lighting.ambientColor);
  ambLight.intensity = PARAMS.lighting.ambientIntensity * PARAMS.lighting.sceneIntensity;

  rimLight.color.set(PARAMS.lighting.rimColor);
  rimLight.position.set(PARAMS.lighting.rimPosX, PARAMS.lighting.rimPosY, PARAMS.lighting.rimPosZ);
  rimLight.intensity = PARAMS.lighting.rimIntensity * PARAMS.lighting.sceneIntensity;

  renderer.toneMappingExposure = PARAMS.lighting.exposure;
}

quad.frustumCulled = false;

function blit(material, target) {
  quad.material = material;
  renderer.setRenderTarget(target);
  renderer.render(quadScene, quadCamera);
}

// ---------------------------------------------------------------------------
// Simulation Shaders
// ---------------------------------------------------------------------------
const baseVert = /* glsl */`
  uniform vec2 texelSize;
  varying vec2 vUv;
  varying vec2 vL;
  varying vec2 vR;
  varying vec2 vT;
  varying vec2 vB;
  void main() {
    vUv = position.xy * 0.5 + 0.5;
    vL = vUv - vec2(texelSize.x, 0.0);
    vR = vUv + vec2(texelSize.x, 0.0);
    vT = vUv + vec2(0.0, texelSize.y);
    vB = vUv - vec2(0.0, texelSize.y);
    gl_Position = vec4(position.xy, 0.0, 1.0);
  }
`;

const capsuleChunk = /* glsl */`
  uniform float aspectRatio;
  uniform vec2 pointA;
  uniform vec2 pointB;
  uniform float radius;
  float capsuleFalloff(vec2 uv) {
    vec2 p = uv, a = pointA, b = pointB;
    p.x *= aspectRatio; a.x *= aspectRatio; b.x *= aspectRatio;
    vec2 pa = p - a, ba = b - a;
    float h = clamp(dot(pa, ba) / max(dot(ba, ba), 1e-8), 0.0, 1.0);
    float d = length(pa - ba * h);
    return exp(-d * d / (radius * radius));
  }
`;

const velocitySplatFrag = /* glsl */`
  precision highp float;
  uniform sampler2D uTarget;
  uniform vec2 color;
  uniform float amount;
  varying vec2 vUv;
  ${capsuleChunk}
  void main() {
    float f = capsuleFalloff(vUv);
    vec2 base = texture2D(uTarget, vUv).xy;
    gl_FragColor = vec4(base + color * f * amount, 0.0, 1.0);
  }
`;

const dyeSplatFrag = /* glsl */`
  precision highp float;
  uniform sampler2D uTarget;
  uniform float amount;
  varying vec2 vUv;
  ${capsuleChunk}
  void main() {
    float f = capsuleFalloff(vUv);
    float base = texture2D(uTarget, vUv).x;
    gl_FragColor = vec4(min(base + f * amount, 1.0), 0.0, 0.0, 1.0);
  }
`;

const advectionFrag = /* glsl */`
  precision highp float;
  uniform sampler2D uVelocity;
  uniform sampler2D uSource;
  uniform vec2 texelSize;
  uniform float dt;
  uniform float dissipation;
  uniform float velocityScale;
  varying vec2 vUv;
  void main() {
    vec2 coord = vUv - dt * velocityScale * texture2D(uVelocity, vUv).xy * texelSize;
    gl_FragColor = texture2D(uSource, coord) / (1.0 + dissipation * dt);
  }
`;

const displacementFrag = /* glsl */`
  precision highp float;
  uniform sampler2D uVelocity;
  uniform sampler2D uDisplacement;
  uniform vec2 texelSize;
  uniform float dt;
  uniform sampler2D uDye;
  uniform float decay;
  uniform float drag;
  varying vec2 vUv;
  void main() {
    float wet = smoothstep(0.0, 0.2, texture2D(uDye, vUv).x);
    vec2 step = dt * drag * wet * texture2D(uVelocity, vUv).xy * texelSize;
    vec2 d = texture2D(uDisplacement, vUv - step).xy - step;
    d *= mix(decay * decay * decay, decay, wet);
    gl_FragColor = vec4(d, 0.0, 1.0);
  }
`;

const divergenceFrag = /* glsl */`
  precision highp float;
  uniform sampler2D uVelocity;
  varying vec2 vUv;
  varying vec2 vL;
  varying vec2 vR;
  varying vec2 vT;
  varying vec2 vB;
  void main() {
    float L = texture2D(uVelocity, vL).x;
    float R = texture2D(uVelocity, vR).x;
    float T = texture2D(uVelocity, vT).y;
    float B = texture2D(uVelocity, vB).y;
    vec2 C = texture2D(uVelocity, vUv).xy;
    if (vL.x < 0.0) L = -C.x;
    if (vR.x > 1.0) R = -C.x;
    if (vT.y > 1.0) T = -C.y;
    if (vB.y < 0.0) B = -C.y;
    gl_FragColor = vec4(0.5 * (R - L + T - B), 0.0, 0.0, 1.0);
  }
`;

const curlFrag = /* glsl */`
  precision highp float;
  uniform sampler2D uVelocity;
  varying vec2 vL;
  varying vec2 vR;
  varying vec2 vT;
  varying vec2 vB;
  void main() {
    float L = texture2D(uVelocity, vL).y;
    float R = texture2D(uVelocity, vR).y;
    float T = texture2D(uVelocity, vT).x;
    float B = texture2D(uVelocity, vB).x;
    gl_FragColor = vec4(0.5 * (R - L - T + B), 0.0, 0.0, 1.0);
  }
`;

const vorticityFrag = /* glsl */`
  precision highp float;
  uniform sampler2D uVelocity;
  uniform sampler2D uCurl;
  uniform float curl;
  uniform float dt;
  varying vec2 vUv;
  varying vec2 vL;
  varying vec2 vR;
  varying vec2 vT;
  varying vec2 vB;
  void main() {
    float L = texture2D(uCurl, vL).x;
    float R = texture2D(uCurl, vR).x;
    float T = texture2D(uCurl, vT).x;
    float B = texture2D(uCurl, vB).x;
    float C = texture2D(uCurl, vUv).x;
    vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));
    force /= length(force) + 0.0001;
    force *= curl * C;
    force.y *= -1.0;
    vec2 vel = texture2D(uVelocity, vUv).xy + force * dt;
    gl_FragColor = vec4(clamp(vel, -1000.0, 1000.0), 0.0, 1.0);
  }
`;

const clearFrag = /* glsl */`
  precision highp float;
  uniform sampler2D uTexture;
  uniform float value;
  varying vec2 vUv;
  void main() {
    gl_FragColor = value * texture2D(uTexture, vUv);
  }
`;

const pressureFrag = /* glsl */`
  precision highp float;
  uniform sampler2D uPressure;
  uniform sampler2D uDivergence;
  varying vec2 vUv;
  varying vec2 vL;
  varying vec2 vR;
  varying vec2 vT;
  varying vec2 vB;
  void main() {
    float L = texture2D(uPressure, vL).x;
    float R = texture2D(uPressure, vR).x;
    float T = texture2D(uPressure, vT).x;
    float B = texture2D(uPressure, vB).x;
    float div = texture2D(uDivergence, vUv).x;
    gl_FragColor = vec4((L + R + B + T - div) * 0.25, 0.0, 0.0, 1.0);
  }
`;

const gradientSubtractFrag = /* glsl */`
  precision highp float;
  uniform sampler2D uPressure;
  uniform sampler2D uVelocity;
  varying vec2 vUv;
  varying vec2 vL;
  varying vec2 vR;
  varying vec2 vT;
  varying vec2 vB;
  void main() {
    float L = texture2D(uPressure, vL).x;
    float R = texture2D(uPressure, vR).x;
    float T = texture2D(uPressure, vT).x;
    float B = texture2D(uPressure, vB).x;
    vec2 vel = texture2D(uVelocity, vUv).xy - vec2(R - L, T - B);
    gl_FragColor = vec4(vel, 0.0, 1.0);
  }
`;

// ---------------------------------------------------------------------------
// 3D Liquid Display Shader
// ---------------------------------------------------------------------------
const displayVert = /* glsl */`
  varying vec2 vUv;
  varying vec3 vWorldPosition;
  varying vec3 vNormal;
  void main() {
    vUv = uv;
    vec4 worldPos = modelMatrix * vec4(position, 1.0);
    vWorldPosition = worldPos.xyz;
    vNormal = normalize(normalMatrix * normal);
    gl_Position = projectionMatrix * viewMatrix * worldPos;
  }
`;

const displayFrag = /* glsl */`
  precision highp float;
  uniform sampler2D uMedia;
  uniform sampler2D uDisplacement;
  uniform sampler2D uDye;
  uniform sampler2D uVelocity;
  uniform vec2 uSimTexel;

  uniform float uMediaAspect;
  uniform float uRefraction;
  uniform float uChromatic;
  uniform float uSpecular;
  uniform float uShininess;
  uniform float uShading;
  uniform float uSurface;
  uniform float uRipple;
  uniform vec3 uHighlight;

  // Color schemes
  uniform int uColorMode;
  uniform float uColorMix;
  uniform vec3 uPalette0;
  uniform vec3 uPalette1;
  uniform vec3 uPalette2;
  uniform vec3 uPalette3;
  uniform vec3 uPalette4;
  uniform bool uInvertAchromatic;

  // Lighting & Exposure
  uniform float uExposure;
  uniform float uSceneLightIntensity;
  uniform vec3 uKeyLightDir;
  uniform vec3 uKeyLightColor;
  uniform float uKeyLightIntensity;
  uniform vec3 uAmbientColor;
  uniform float uAmbientIntensity;
  uniform vec3 uRimLightPos;
  uniform vec3 uRimLightColor;
  uniform float uRimLightIntensity;

  // Frame & Edge Softness
  uniform float uCornerRadius;
  uniform float uEdgeSoftness;

  varying vec2 vUv;
  varying vec3 vWorldPosition;
  varying vec3 vNormal;

  vec2 coverUv(vec2 uv) {
    float planeAspect = 16.0 / 9.0;
    float r = planeAspect / uMediaAspect;
    vec2 s = vec2(1.0);
    if (r > 1.0) s.y = 1.0 / r; else s.x = r;
    return clamp((uv - 0.5) * s + 0.5, 0.0, 1.0);
  }

  float surfaceHeight(vec2 uv) {
    float dye = texture2D(uDye, uv).x;
    float speed = length(texture2D(uVelocity, uv).xy);
    return dye * 0.6 + speed * uRipple * 0.004 * smoothstep(0.0, 0.3, dye);
  }

  vec3 spectralWeight(float t) {
    return max(1.0 - abs(t * 2.0 - vec3(0.0, 1.0, 2.0)), 0.0);
  }

  vec3 sample5Palette(float t) {
    if (uInvertAchromatic) t = 1.0 - t;
    t = clamp(t, 0.0, 1.0) * 4.0;
    if (t < 1.0) return mix(uPalette0, uPalette1, t);
    if (t < 2.0) return mix(uPalette1, uPalette2, t - 1.0);
    if (t < 3.0) return mix(uPalette2, uPalette3, t - 2.0);
    return mix(uPalette3, uPalette4, t - 3.0);
  }

  float roundedBoxSdf(vec2 p, vec2 b, float r) {
    vec2 d = abs(p) - b + vec2(r);
    return min(max(d.x, d.y), 0.0) + length(max(d, 0.0)) - r;
  }

  void main() {
    if (uCornerRadius > 0.001 || uEdgeSoftness > 0.001) {
      vec2 p = vUv - 0.5;
      float dist = roundedBoxSdf(p, vec2(0.5 - uEdgeSoftness), uCornerRadius);
      if (dist > 0.0) discard;
    }

    vec2 tx = vec2(uSimTexel.x, 0.0);
    vec2 ty = vec2(0.0, uSimTexel.y);
    vec2 grad = vec2(
      surfaceHeight(vUv + tx) - surfaceHeight(vUv - tx),
      surfaceHeight(vUv + ty) - surfaceHeight(vUv - ty)) * 0.5;

    vec3 n = normalize(vec3(-grad * uSurface * 6.0, 1.0));

    vec2 disp = texture2D(uDisplacement, vUv).xy;
    float dye = texture2D(uDye, vUv).x;
    float mask = smoothstep(0.0, 0.35, dye);

    // Refraction
    vec2 baseUv = vUv + disp - n.xy * uRefraction * 0.05;

    // Spectral dispersion
    vec2 spread = (n.xy * 0.035 + disp * 0.04) * uChromatic;
    vec3 col = vec3(0.0);
    vec3 wsum = vec3(0.0);
    for (int i = 0; i < 6; i++) {
      float t = float(i) / 5.0;
      vec2 uv = baseUv + spread * (t - 0.5);
      vec3 w = spectralWeight(t);
      col += texture2D(uMedia, coverUv(uv)).rgb * w;
      wsum += w;
    }
    col /= wsum;

    // Color Scheme Remapping
    float lum = dot(col, vec3(0.299, 0.587, 0.114));
    if (uColorMode == 8) {
      // Achromatic
      vec3 gray = sample5Palette(lum);
      col = mix(col, gray, uColorMix);
    } else if (uColorMode == 9) {
      // Achromatic + Accent
      vec3 gray = vec3(lum);
      float accentMask = smoothstep(0.04, 0.4, dye) * 0.9;
      vec3 withAccent = mix(gray, uPalette3, accentMask);
      col = mix(col, withAccent, uColorMix);
    } else if (uColorMix > 0.001) {
      vec3 mapped = sample5Palette(lum);
      col = mix(col, mapped, uColorMix);
    }

    // Directional Key Light
    vec3 L = normalize(uKeyLightDir);
    vec3 H = normalize(L + vec3(0.0, 0.0, 1.0));
    float nDotL = max(dot(n.xy, normalize(L.xy)), 0.0);
    col *= max(1.0 + nDotL * uShading * mask * uKeyLightIntensity, 0.0);

    // Ambient Light
    col += col * uAmbientColor * uAmbientIntensity;

    // Rim Light
    vec3 rimDir = normalize(uRimLightPos - vWorldPosition);
    float rimDiff = max(dot(n, rimDir), 0.0) * uRimLightIntensity;
    col += uRimLightColor * rimDiff * 0.25 * mask;

    // Specular Highlight
    float spec = pow(max(dot(n, H), 0.0), uShininess);
    col += uHighlight * spec * uSpecular * uKeyLightIntensity;

    // Exposure & Intensity
    col *= uExposure * uSceneLightIntensity;

    gl_FragColor = vec4(col, 1.0);
  }
`;

// ---------------------------------------------------------------------------
// Simulation Materials
// ---------------------------------------------------------------------------
const simTexel = new THREE.Vector2(1 / 256, 1 / 256);
const simSize = new THREE.Vector2(256, 256);

function makeMaterial(fragmentShader, uniforms) {
  return new THREE.ShaderMaterial({
    vertexShader: baseVert,
    fragmentShader,
    uniforms: Object.assign({ texelSize: { value: simTexel } }, uniforms),
    depthTest: false,
    depthWrite: false
  });
}

function capsuleUniforms() {
  return {
    uTarget: { value: null },
    aspectRatio: { value: 16 / 9 },
    pointA: { value: new THREE.Vector2() },
    pointB: { value: new THREE.Vector2() },
    radius: { value: PARAMS.interaction.radius }
  };
}

const velocitySplatMat = makeMaterial(velocitySplatFrag, Object.assign(capsuleUniforms(), {
  color: { value: new THREE.Vector2() },
  amount: { value: 1 }
}));
const dyeSplatMat = makeMaterial(dyeSplatFrag, Object.assign(capsuleUniforms(), {
  amount: { value: 1 }
}));
const advectionMat = makeMaterial(advectionFrag, {
  uVelocity: { value: null }, uSource: { value: null },
  dt: { value: 0 }, dissipation: { value: 0 }, velocityScale: { value: 1 }
});
const displacementMat = makeMaterial(displacementFrag, {
  uVelocity: { value: null }, uDisplacement: { value: null }, uDye: { value: null },
  dt: { value: 0 }, decay: { value: 1 }, drag: { value: PARAMS.animation.imageDrag }
});
const divergenceMat = makeMaterial(divergenceFrag, { uVelocity: { value: null } });
const curlMat = makeMaterial(curlFrag, { uVelocity: { value: null } });
const vorticityMat = makeMaterial(vorticityFrag, {
  uVelocity: { value: null }, uCurl: { value: null },
  curl: { value: PARAMS.animation.curl }, dt: { value: 0 }
});
const clearMat = makeMaterial(clearFrag, { uTexture: { value: null }, value: { value: PARAMS.animation.pressure } });
const pressureMat = makeMaterial(pressureFrag, { uPressure: { value: null }, uDivergence: { value: null } });
const gradientMat = makeMaterial(gradientSubtractFrag, { uPressure: { value: null }, uVelocity: { value: null } });

// ---------------------------------------------------------------------------
// 3D Display Material & Mesh
// ---------------------------------------------------------------------------
const keyLightDirVec = new THREE.Vector3();
function updateKeyLightVec() {
  const radAngle = THREE.MathUtils.degToRad(PARAMS.lighting.keyAngle);
  const radElev = THREE.MathUtils.degToRad(PARAMS.lighting.keyElevation);
  keyLightDirVec.set(
    Math.cos(radAngle) * Math.cos(radElev),
    Math.sin(radAngle) * Math.cos(radElev),
    Math.sin(radElev)
  ).normalize();
}
updateKeyLightVec();

const displayMat = new THREE.ShaderMaterial({
  vertexShader: displayVert,
  fragmentShader: displayFrag,
  uniforms: {
    uMedia: { value: null },
    uDisplacement: { value: null },
    uDye: { value: null },
    uVelocity: { value: null },
    uSimTexel: { value: simTexel },
    uMediaAspect: { value: 16 / 9 },
    uRefraction: { value: PARAMS.material.refraction },
    uChromatic: { value: PARAMS.material.chromatic },
    uSpecular: { value: PARAMS.material.specular },
    uShininess: { value: PARAMS.material.shininess },
    uShading: { value: PARAMS.lighting.shading },
    uSurface: { value: PARAMS.material.surface },
    uRipple: { value: PARAMS.material.ripple },
    uHighlight: { value: new THREE.Color(PARAMS.colors.highlight) },

    // Color Scheme
    uColorMode: { value: 0 },
    uColorMix: { value: PARAMS.colors.mix },
    uPalette0: { value: new THREE.Color(PARAMS.colors.color0) },
    uPalette1: { value: new THREE.Color(PARAMS.colors.color1) },
    uPalette2: { value: new THREE.Color(PARAMS.colors.color2) },
    uPalette3: { value: new THREE.Color(PARAMS.colors.color3) },
    uPalette4: { value: new THREE.Color(PARAMS.colors.color4) },
    uInvertAchromatic: { value: PARAMS.colors.invertAchromatic },

    // Lighting
    uExposure: { value: PARAMS.lighting.exposure },
    uSceneLightIntensity: { value: PARAMS.lighting.sceneIntensity },
    uKeyLightDir: { value: keyLightDirVec },
    uKeyLightColor: { value: new THREE.Color(PARAMS.lighting.keyColor) },
    uKeyLightIntensity: { value: PARAMS.lighting.keyIntensity },
    uAmbientColor: { value: new THREE.Color(PARAMS.lighting.ambientColor) },
    uAmbientIntensity: { value: PARAMS.lighting.ambientIntensity },
    uRimLightPos: { value: new THREE.Vector3(PARAMS.lighting.rimPosX, PARAMS.lighting.rimPosY, PARAMS.lighting.rimPosZ) },
    uRimLightColor: { value: new THREE.Color(PARAMS.lighting.rimColor) },
    uRimLightIntensity: { value: PARAMS.lighting.rimIntensity },

    // Frame
    uCornerRadius: { value: PARAMS.material.cornerRadius },
    uEdgeSoftness: { value: PARAMS.material.edgeSoftness }
  },
  depthTest: true,
  depthWrite: true,

});

// 16:9 Plane in 3D Scene
const planeGeo = new THREE.PlaneGeometry(3.2, 1.8, 64, 64);
const planeMesh = new THREE.Mesh(planeGeo, displayMat);
scene.add(planeMesh);

// ---------------------------------------------------------------------------
// Simulation Render Targets
// ---------------------------------------------------------------------------
function createTarget(w, h, filter) {
  return new THREE.WebGLRenderTarget(w, h, {
    type: THREE.HalfFloatType,
    format: THREE.RGBAFormat,
    minFilter: filter,
    magFilter: filter,
    wrapS: THREE.ClampToEdgeWrapping,
    wrapT: THREE.ClampToEdgeWrapping,
    depthBuffer: false,
    stencilBuffer: false,
    generateMipmaps: false
  });
}

function createDoubleTarget(w, h, filter) {
  return {
    read: createTarget(w, h, filter),
    write: createTarget(w, h, filter),
    swap() { const t = this.read; this.read = this.write; this.write = t; },
    dispose() { this.read.dispose(); this.write.dispose(); }
  };
}

const sim = { velocity: null, dye: null, displacement: null, pressure: null, divergence: null, curl: null };

function disposeSim() {
  if (!sim.velocity) return;
  sim.velocity.dispose();
  sim.dye.dispose();
  sim.displacement.dispose();
  sim.pressure.dispose();
  sim.divergence.dispose();
  sim.curl.dispose();
}

function buildSim() {
  const aspect = 16 / 9;
  const min = Math.round(PARAMS.performance.simResolution);
  const max = Math.round(PARAMS.performance.simResolution * aspect);
  const w = max, h = min;

  if (sim.velocity && simSize.x === w && simSize.y === h) return;

  disposeSim();
  simSize.set(w, h);
  simTexel.set(1 / w, 1 / h);
  sim.velocity = createDoubleTarget(w, h, THREE.LinearFilter);
  sim.dye = createDoubleTarget(w, h, THREE.LinearFilter);
  sim.displacement = createDoubleTarget(w, h, THREE.LinearFilter);
  sim.pressure = createDoubleTarget(w, h, THREE.NearestFilter);
  sim.divergence = createTarget(w, h, THREE.NearestFilter);
  sim.curl = createTarget(w, h, THREE.NearestFilter);
  clearFluid();
}

function clearTarget(target) {
  renderer.setRenderTarget(target);
  renderer.clear(true, false, false);
}

function clearFluid() {
  renderer.setClearColor(0x000000, 0);
  for (const key of ['velocity', 'dye', 'displacement', 'pressure']) {
    clearTarget(sim[key].read);
    clearTarget(sim[key].write);
  }
  renderer.setRenderTarget(null);
}

buildSim();

// ---------------------------------------------------------------------------
// Fluid Step
// ---------------------------------------------------------------------------
function setCapsule(mat, ax, ay, bx, by) {
  const u = mat.uniforms;
  u.aspectRatio.value = 16 / 9;
  u.pointA.value.set(ax, ay);
  u.pointB.value.set(bx, by);
  u.radius.value = PARAMS.interaction.radius;
}

function splat(ax, ay, bx, by, vx, vy) {
  const aspect = 16 / 9;
  const segment = Math.hypot((bx - ax) * aspect, by - ay);
  const amount = Math.min(segment / (PARAMS.interaction.radius * 1.8), 1.0);

  setCapsule(velocitySplatMat, ax, ay, bx, by);
  velocitySplatMat.uniforms.uTarget.value = sim.velocity.read.texture;
  velocitySplatMat.uniforms.color.value.set(vx, vy);
  velocitySplatMat.uniforms.amount.value = amount;
  blit(velocitySplatMat, sim.velocity.write);
  sim.velocity.swap();

  setCapsule(dyeSplatMat, ax, ay, bx, by);
  dyeSplatMat.uniforms.uTarget.value = sim.dye.read.texture;
  dyeSplatMat.uniforms.amount.value = amount;
  blit(dyeSplatMat, sim.dye.write);
  sim.dye.swap();
}

function stepFluid(dt) {
  curlMat.uniforms.uVelocity.value = sim.velocity.read.texture;
  blit(curlMat, sim.curl);

  vorticityMat.uniforms.uVelocity.value = sim.velocity.read.texture;
  vorticityMat.uniforms.uCurl.value = sim.curl.texture;
  vorticityMat.uniforms.curl.value = PARAMS.animation.curl;
  vorticityMat.uniforms.dt.value = dt;
  blit(vorticityMat, sim.velocity.write);
  sim.velocity.swap();

  divergenceMat.uniforms.uVelocity.value = sim.velocity.read.texture;
  blit(divergenceMat, sim.divergence);

  clearMat.uniforms.uTexture.value = sim.pressure.read.texture;
  clearMat.uniforms.value.value = PARAMS.animation.pressure;
  blit(clearMat, sim.pressure.write);
  sim.pressure.swap();

  pressureMat.uniforms.uDivergence.value = sim.divergence.texture;
  for (let i = 0; i < PARAMS.performance.pressureIterations; i++) {
    pressureMat.uniforms.uPressure.value = sim.pressure.read.texture;
    blit(pressureMat, sim.pressure.write);
    sim.pressure.swap();
  }

  gradientMat.uniforms.uPressure.value = sim.pressure.read.texture;
  gradientMat.uniforms.uVelocity.value = sim.velocity.read.texture;
  blit(gradientMat, sim.velocity.write);
  sim.velocity.swap();

  // Displacement
  displacementMat.uniforms.uVelocity.value = sim.velocity.read.texture;
  displacementMat.uniforms.uDisplacement.value = sim.displacement.read.texture;
  displacementMat.uniforms.uDye.value = sim.dye.read.texture;
  displacementMat.uniforms.dt.value = dt;
  displacementMat.uniforms.drag.value = PARAMS.animation.imageDrag;
  displacementMat.uniforms.decay.value = Math.exp(-PARAMS.animation.imageReturn * dt);
  blit(displacementMat, sim.displacement.write);
  sim.displacement.swap();

  // Dye Advection
  advectionMat.uniforms.uVelocity.value = sim.velocity.read.texture;
  advectionMat.uniforms.uSource.value = sim.dye.read.texture;
  advectionMat.uniforms.dt.value = dt;
  advectionMat.uniforms.dissipation.value = PARAMS.animation.liquidFade;
  advectionMat.uniforms.velocityScale.value = 0.35;
  blit(advectionMat, sim.dye.write);
  sim.dye.swap();

  // Velocity Self-Advection
  advectionMat.uniforms.uSource.value = sim.velocity.read.texture;
  advectionMat.uniforms.dissipation.value = PARAMS.animation.velocityFade;
  advectionMat.uniforms.velocityScale.value = 1.0;
  blit(advectionMat, sim.velocity.write);
  sim.velocity.swap();
}

// ---------------------------------------------------------------------------
// Autonomous Infinite Fluid Motion
// ---------------------------------------------------------------------------
function stepAutoFluid(t) {
  if (!PARAMS.animation.autoFluid) return;
  const speed = PARAMS.animation.speed;
  const st = t * speed * 0.75;

  const a1 = st * 0.7;
  const x1 = 0.5 + Math.sin(a1) * 0.28;
  const y1 = 0.5 + Math.cos(a1 * 1.3) * 0.28;
  const bx1 = x1 + Math.cos(a1 * 2.1) * 0.04;
  const by1 = y1 + Math.sin(a1 * 1.7) * 0.04;
  splat(x1, y1, bx1, by1, (bx1 - x1) * 600, (by1 - y1) * 600);

  const a2 = st * 0.5 + 2.5;
  const x2 = 0.5 + Math.cos(a2 * 1.1) * 0.24;
  const y2 = 0.5 + Math.sin(a2 * 0.8) * 0.24;
  const bx2 = x2 + Math.sin(a2 * 1.9) * 0.035;
  const by2 = y2 - Math.cos(a2 * 1.5) * 0.035;
  splat(x2, y2, bx2, by2, (bx2 - x2) * 500, (by2 - y2) * 500);
}

// ---------------------------------------------------------------------------
// Pointer & Raycasting Interactions
// ---------------------------------------------------------------------------
const raycaster = new THREE.Raycaster();
const pointer = {
  tx: 0.5, ty: 0.5,
  x: 0.5, y: 0.5,
  px: 0.5, py: 0.5,
  inside: false,
  down: false,
  ready: false
};

function snapPointer() {
  pointer.x = pointer.px = pointer.tx;
  pointer.y = pointer.py = pointer.ty;
  pointer.ready = true;
}

function updatePointerFromRaycast(e) {
  const rect = renderer.domElement.getBoundingClientRect();
  const mouseNdc = new THREE.Vector2(
    ((e.clientX - rect.left) / rect.width) * 2 - 1,
    -((e.clientY - rect.top) / rect.height) * 2 + 1
  );
  raycaster.setFromCamera(mouseNdc, camera);
  const hits = raycaster.intersectObject(planeMesh);
  if (hits.length > 0 && hits[0].uv) {
    pointer.tx = hits[0].uv.x;
    pointer.ty = hits[0].uv.y;
    pointer.inside = true;
    if (!pointer.ready) snapPointer();
    return true;
  } else {
    pointer.inside = false;
    return false;
  }
}

function updatePointer(dt) {
  pointer.px = pointer.x;
  pointer.py = pointer.y;
  const k = 1 - Math.exp(-dt * PARAMS.interaction.followSpeed);
  pointer.x += (pointer.tx - pointer.x) * k;
  pointer.y += (pointer.ty - pointer.y) * k;

  const active = PARAMS.interaction.trigger === 'Hover'
    ? (pointer.inside && pointer.ready)
    : (pointer.down && pointer.ready);

  if (!active) return;

  const dx = pointer.x - pointer.px;
  const dy = pointer.y - pointer.py;
  if (dx * dx + dy * dy < 1e-10) return;

  const f = PARAMS.interaction.force / dt;
  splat(pointer.px, pointer.py, pointer.x, pointer.y, dx * simSize.x * f, dy * simSize.y * f);
}

function randomSplash() {
  for (let i = 0; i < 5; i++) {
    const x = 0.15 + Math.random() * 0.7;
    const y = 0.15 + Math.random() * 0.7;
    const a = Math.random() * Math.PI * 2;
    const len = 0.08 + Math.random() * 0.12;
    const bx = x + Math.cos(a) * len;
    const by = y + Math.sin(a) * len;
    const s = 300 + Math.random() * 300;
    splat(x, y, bx, by, Math.cos(a) * s, Math.sin(a) * s);
  }
}

// ---------------------------------------------------------------------------
// Mouse Drag, Wheel Zoom & Click Handling
// ---------------------------------------------------------------------------
let isPointerDown = false;
let isDragging = false;
let pointerDownPos = { x: 0, y: 0 };
let lastClientPos = { x: 0, y: 0 };
let activeMouseButton = 0;

function attachCanvasEvents(dom) {
  dom.addEventListener('pointerdown', (e) => {
    isPointerDown = true;
    isDragging = false;
    activeMouseButton = e.button;
    pointerDownPos = { x: e.clientX, y: e.clientY };
    lastClientPos = { x: e.clientX, y: e.clientY };
    pointer.down = true;
    updatePointerFromRaycast(e);
  });

  dom.addEventListener('pointermove', (e) => {
    if (isPointerDown) {
      const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
      if (dist > 5) isDragging = true;
    }

    if (isDragging) {
      const dx = e.clientX - lastClientPos.x;
      const dy = e.clientY - lastClientPos.y;
      lastClientPos = { x: e.clientX, y: e.clientY };

      const isPan = activeMouseButton === 2 || (activeMouseButton === 0 && PARAMS.interaction.dragMode === 'Drag Object') || e.shiftKey;

      if (isPan) {
        // Drag Object across screen
        const panSpeed = 0.0028 * PARAMS.camera.distance;
        PARAMS.object.panX += dx * panSpeed;
        PARAMS.object.panY -= dy * panSpeed;
        guiControllers.panX?.updateDisplay();
        guiControllers.panY?.updateDisplay();
      } else {
        // Orbit camera angle
        PARAMS.camera.orbitY += dx * 0.005;
        PARAMS.camera.orbitX = Math.min(Math.max(PARAMS.camera.orbitX - dy * 0.005, -Math.PI * 0.45), Math.PI * 0.45);
        guiControllers.orbitX?.updateDisplay();
        guiControllers.orbitY?.updateDisplay();
      }
    }

    updatePointerFromRaycast(e);
  });

  dom.addEventListener('pointerup', (e) => {
    pointer.down = false;
    if (isPointerDown && !isDragging) {
      // Scene Click: Re-roll procedural variation if mode is enabled
      if (PARAMS.interaction.randomizeOnClick) {
        randomizeScene();
      }
    }
    isPointerDown = false;
    isDragging = false;
  });

  dom.addEventListener('pointerleave', () => {
    pointer.inside = false;
    pointer.down = false;
    pointer.ready = false;
    isPointerDown = false;
    isDragging = false;
  });

  // Zoom with Wheel
  dom.addEventListener('wheel', (e) => {
    e.preventDefault();
    const zoomFactor = 1.0 + Math.sign(e.deltaY) * 0.08;
    PARAMS.camera.distance = Math.min(Math.max(PARAMS.camera.distance * zoomFactor, 0.4), 8.0);
    guiControllers.cameraDistance?.updateDisplay();
  }, { passive: false });

  dom.addEventListener('contextmenu', (e) => e.preventDefault());
}

attachCanvasEvents(renderer.domElement);

// ---------------------------------------------------------------------------
// Media (Image / Video) Loader
// ---------------------------------------------------------------------------
const media = { texture: null, video: null, objectUrl: null };

function setMedia(texture, aspect, video = null, objectUrl = null) {
  if (media.texture) media.texture.dispose();
  if (media.video) { media.video.pause(); media.video.removeAttribute('src'); media.video.load(); }
  if (media.objectUrl) URL.revokeObjectURL(media.objectUrl);

  texture.colorSpace = THREE.NoColorSpace;
  texture.wrapS = THREE.MirroredRepeatWrapping;
  texture.wrapT = THREE.MirroredRepeatWrapping;
  texture.minFilter = THREE.LinearFilter;
  texture.magFilter = THREE.LinearFilter;
  texture.generateMipmaps = false;
  texture.needsUpdate = true;

  media.texture = texture;
  media.video = video;
  media.objectUrl = objectUrl;

  displayMat.uniforms.uMedia.value = texture;
  displayMat.uniforms.uMediaAspect.value = aspect;
}

function usePlaceholder() {
  const tex = new THREE.DataTexture(new Uint8Array([0, 0, 0, 255]), 1, 1);
  setMedia(tex, 16 / 9);
}

const textureLoader = new THREE.TextureLoader();
textureLoader.setCrossOrigin('anonymous');

function loadVideo(src, objectUrl = null) {
  const video = document.createElement('video');
  video.crossOrigin = 'anonymous';
  video.muted = true;
  video.loop = true;
  video.playsInline = true;
  video.autoplay = true;
  video.src = src;
  video.addEventListener('loadeddata', () => {
    const tex = new THREE.VideoTexture(video);
    setMedia(tex, video.videoWidth / video.videoHeight, video, objectUrl);
    video.play().catch(() => {});
  }, { once: true });
  video.addEventListener('error', () => {
    console.warn('Video failed to load:', src);
    if (objectUrl) URL.revokeObjectURL(objectUrl);
  }, { once: true });
}

function loadImage(src, objectUrl = null) {
  textureLoader.load(
    src,
    (tex) => setMedia(tex, tex.image.width / tex.image.height, null, objectUrl),
    undefined,
    () => {
      console.warn('Image failed to load (CORS or network):', src);
      if (objectUrl) URL.revokeObjectURL(objectUrl);
    }
  );
}

function loadFromUrl(url) {
  if (!url) return;
  if (/\.(mp4|webm|mov|ogv)(\?.*)?$/i.test(url)) loadVideo(url);
  else loadImage(url);
}

const fileInput = document.createElement('input');
fileInput.type = 'file';
fileInput.accept = 'image/*,video/*';
fileInput.style.display = 'none';
document.body.appendChild(fileInput);
fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  if (file.type.startsWith('video/')) loadVideo(url, url);
  else loadImage(url, url);
  fileInput.value = '';
});

usePlaceholder();
loadFromUrl(PARAMS.media.url);

// ---------------------------------------------------------------------------
// Color Scheme Application
// ---------------------------------------------------------------------------
function applyColorScheme(schemeName) {
  const def = SCHEME_DEFINITIONS[schemeName];
  if (!def) return;
  PARAMS.colors.scheme = schemeName;
  PARAMS.colors.mix = def.mix;
  PARAMS.colors.highlight = def.highlight;
  PARAMS.colors.color0 = def.colors[0];
  PARAMS.colors.color1 = def.colors[1];
  PARAMS.colors.color2 = def.colors[2];
  PARAMS.colors.color3 = def.colors[3];
  PARAMS.colors.color4 = def.colors[4];

  const modeIdx = SCHEME_NAMES.indexOf(schemeName);
  displayMat.uniforms.uColorMode.value = modeIdx;
  displayMat.uniforms.uColorMix.value = def.mix;
  displayMat.uniforms.uHighlight.value.set(def.highlight);
  displayMat.uniforms.uPalette0.value.set(def.colors[0]);
  displayMat.uniforms.uPalette1.value.set(def.colors[1]);
  displayMat.uniforms.uPalette2.value.set(def.colors[2]);
  displayMat.uniforms.uPalette3.value.set(def.colors[3]);
  displayMat.uniforms.uPalette4.value.set(def.colors[4]);

  updateAllGuiDisplays();
}

function updateColorsFromGui() {
  displayMat.uniforms.uColorMix.value = PARAMS.colors.mix;
  displayMat.uniforms.uHighlight.value.set(PARAMS.colors.highlight);
  displayMat.uniforms.uInvertAchromatic.value = PARAMS.colors.invertAchromatic;
  displayMat.uniforms.uPalette0.value.set(PARAMS.colors.color0);
  displayMat.uniforms.uPalette1.value.set(PARAMS.colors.color1);
  displayMat.uniforms.uPalette2.value.set(PARAMS.colors.color2);
  displayMat.uniforms.uPalette3.value.set(PARAMS.colors.color3);
  displayMat.uniforms.uPalette4.value.set(PARAMS.colors.color4);
}

// ---------------------------------------------------------------------------
// Dynamic Renderer Re-creation for Antialias Toggle
// ---------------------------------------------------------------------------
function recreateRenderer(antialiasEnabled) {
  PARAMS.performance.antialias = antialiasEnabled;
  const oldDom = renderer.domElement;
  const newRenderer = new THREE.WebGLRenderer({
    antialias: antialiasEnabled,
    powerPreference: 'high-performance'
  });
  newRenderer.setPixelRatio(Math.min(PARAMS.performance.dpr, MAX_DPR));
  newRenderer.setSize(window.innerWidth, window.innerHeight);
  newRenderer.toneMapping = THREE.ACESFilmicToneMapping;
  newRenderer.toneMappingExposure = PARAMS.lighting.exposure;
  newRenderer.autoClear = false;

  document.body.replaceChild(newRenderer.domElement, oldDom);
  renderer.dispose();
  renderer = newRenderer;

  attachCanvasEvents(renderer.domElement);
  buildSim();
  updateBackground();
}

// ---------------------------------------------------------------------------
// Procedural Variation Generator
// ---------------------------------------------------------------------------
function randomizeScene() {
  // Pick random color scheme
  const randScheme = SCHEME_NAMES[Math.floor(Math.random() * SCHEME_NAMES.length)];
  applyColorScheme(randScheme);

  // Geometric & material parameters
  PARAMS.material.refraction = Number((1.2 + Math.random() * 2.2).toFixed(2));
  PARAMS.material.chromatic = Number((0.2 + Math.random() * 1.5).toFixed(2));
  PARAMS.material.surface = Number((0.5 + Math.random() * 2.0).toFixed(2));
  PARAMS.material.ripple = Number((1.0 + Math.random() * 2.8).toFixed(2));
  PARAMS.material.specular = Number((0.8 + Math.random() * 2.2).toFixed(2));
  PARAMS.material.shininess = Math.round(40 + Math.random() * 260);

  // Motion parameters
  PARAMS.animation.curl = Math.round(5 + Math.random() * 35);
  PARAMS.animation.imageDrag = Number((0.4 + Math.random() * 1.0).toFixed(2));
  PARAMS.animation.imageReturn = Number((0.6 + Math.random() * 2.2).toFixed(2));
  PARAMS.animation.liquidFade = Number((0.4 + Math.random() * 1.4).toFixed(2));
  PARAMS.animation.speed = Number((0.6 + Math.random() * 1.4).toFixed(2));
  PARAMS.animation.preset = ANIMATION_PRESETS[Math.floor(Math.random() * ANIMATION_PRESETS.length)];

  // Lighting
  PARAMS.lighting.keyAngle = Math.round(Math.random() * 360);
  PARAMS.lighting.shading = Number((0.08 + Math.random() * 0.35).toFixed(2));

  // Sync uniforms
  displayMat.uniforms.uRefraction.value = PARAMS.material.refraction;
  displayMat.uniforms.uChromatic.value = PARAMS.material.chromatic;
  displayMat.uniforms.uSurface.value = PARAMS.material.surface;
  displayMat.uniforms.uRipple.value = PARAMS.material.ripple;
  displayMat.uniforms.uSpecular.value = PARAMS.material.specular;
  displayMat.uniforms.uShininess.value = PARAMS.material.shininess;
  displayMat.uniforms.uShading.value = PARAMS.lighting.shading;

  updateKeyLightVec();
  update3DLights();
  randomSplash();
  updateAllGuiDisplays();
}

window.addEventListener('keydown', (e) => {

// ---------------------------------------------------------------------------
// Resize & Visibility
// ---------------------------------------------------------------------------
function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  buildSim();
}
window.addEventListener('resize', onResize);

const clock = new THREE.Clock();
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) clock.getDelta();
});

// ---------------------------------------------------------------------------
// Main Animation Loop
// ---------------------------------------------------------------------------
renderer.setAnimationLoop(() => {
  const dt = Math.min(Math.max(clock.getDelta(), 1 / 240), 1 / 30);
  const totalTime = clock.getElapsedTime();

  if (!PARAMS.performance.paused) {
    stepAutoFluid(totalTime);
    updatePointer(dt);
    stepFluid(dt);
  }

  // Calculate Camera & Object Animation Offsets
  const animT = totalTime * PARAMS.animation.speed;
  let animDist = 0;
  let animAngleX = 0;
  let animAngleY = 0;
  let animPanX = 0;
  let animPanY = 0;

  switch (PARAMS.animation.preset) {
    case 'Static (No Movement)':
      break;
    case 'Slow Gentle Orbit':
      animAngleY = Math.sin(animT * 0.2) * 0.35;
      animAngleX = Math.cos(animT * 0.15) * 0.12;
      break;
    case 'Breathing Float':
      animDist = Math.sin(animT * 0.3) * 0.25;
      animAngleX = Math.sin(animT * 0.2) * 0.08;
      break;
    case 'Elegant Infinity (Figure-8)':
      animPanX = Math.sin(animT * 0.25) * 0.2;
      animPanY = Math.sin(animT * 0.5) * 0.1;
      animAngleY = Math.sin(animT * 0.25) * 0.12;
      break;
    case 'Cinematic Pan & Tilt':
      animPanX = Math.sin(animT * 0.2) * 0.3;
      animAngleY = -animPanX * 0.15;
      animAngleX = Math.cos(animT * 0.25) * 0.08;
      break;
    case 'Serpentine Wave':
      animPanX = Math.sin(animT * 0.22) * 0.2;
      animPanY = Math.cos(animT * 0.28) * 0.15;
      animAngleX = Math.sin(animT * 0.3) * 0.1;
      animAngleY = Math.cos(animT * 0.22) * 0.1;
      break;
    case 'Diagonal Glide':
      animPanX = Math.sin(animT * 0.18) * 0.25;
      animPanY = Math.sin(animT * 0.18) * 0.15;
      animDist = Math.cos(animT * 0.2) * 0.15;
      break;
    case 'Pendulum Sway':
      animAngleY = Math.sin(animT * 0.22) * 0.25;
      animPanX = Math.sin(animT * 0.22) * 0.15;
      animAngleX = Math.abs(Math.cos(animT * 0.22)) * 0.08;
      break;
  }

  // Maintain User Zoom & Angle during Camera Animations
  const finalDistance = Math.max(0.4, PARAMS.camera.distance + animDist);
  const finalAngleX = PARAMS.camera.orbitX + animAngleX;
  const finalAngleY = PARAMS.camera.orbitY + animAngleY;

  const cosX = Math.cos(finalAngleX);
  camera.position.x = finalDistance * Math.sin(finalAngleY) * cosX;
  camera.position.y = finalDistance * Math.sin(finalAngleX);
  camera.position.z = finalDistance * Math.cos(finalAngleY) * cosX;
  camera.lookAt(0, 0, 0);

  // Position Plane Mesh (combining user drag with animation pan)
  planeMesh.position.x = PARAMS.object.panX + animPanX;
  planeMesh.position.y = PARAMS.object.panY + animPanY;

  // Render 3D Scene
  displayMat.uniforms.uDisplacement.value = sim.displacement.read.texture;
  displayMat.uniforms.uDye.value = sim.dye.read.texture;
  displayMat.uniforms.uVelocity.value = sim.velocity.read.texture;

  renderer.setRenderTarget(null);
  renderer.render(scene, camera);
});
