<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clumsy Ninja</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #F4F5F7;
      user-select: none;
      -webkit-user-select: none;
    }

    canvas#canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #F4F5F7;
      cursor: grab;
      touch-action: none;
    }

    canvas#canvas.dragging {
      cursor: grabbing;
    }
  </style>
</head>
<body>
  <canvas id="canvas">Canvas not supported.</canvas>

  <script type="module">
    import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

    (function () {
      'use strict';

      var canvas = document.getElementById('canvas');
      if (!canvas || !canvas.getContext) {
        return;
      }
      var ctx = canvas.getContext('2d');

      /********************
        Random Number
      ********************/

      function rand(min, max) {
        return Math.floor(Math.random() * (max - min + 1) + min);
      }

      /********************
        19 Preconfigured Color Schemes
      ********************/

      var SCHEMES = {
        'Original': {
          bg: '#F4F5F7',
          blade: '#000000',
          blade2: '#1f1f1f',
          center: '#ffffff',
          palette: ['#000000', '#111111', '#1f1f1f', '#2b2b2b']
        },
        'Monochromatic': {
          bg: '#0B132B',
          blade: '#3B82F6',
          blade2: '#1D4ED8',
          center: '#DBEAFE',
          palette: ['#1E3A8A', '#1D4ED8', '#2563EB', '#3B82F6', '#60A5FA', '#93C5FD']
        },
        'Analogous': {
          bg: '#180802',
          blade: '#FF5722',
          blade2: '#FF9800',
          center: '#FFE082',
          palette: ['#D84315', '#F4511E', '#FF5722', '#FF9800', '#FFB300', '#FFC107']
        },
        'Complementary': {
          bg: '#06121E',
          blade: '#00E5FF',
          blade2: '#FF5252',
          center: '#FFFFFF',
          palette: ['#00E5FF', '#00B0FF', '#FF5252', '#FF1744', '#FF8A80']
        },
        'Split-complementary': {
          bg: '#110B24',
          blade: '#7C4DFF',
          blade2: '#FFB300',
          center: '#00E676',
          palette: ['#7C4DFF', '#651FFF', '#FFB300', '#FFC107', '#00E676', '#69F0AE']
        },
        'Triadic': {
          bg: '#0A0A1E',
          blade: '#00F5D4',
          blade2: '#F15BB5',
          center: '#FEE440',
          palette: ['#00F5D4', '#00BBF9', '#F15BB5', '#FEE440', '#9B5DE5']
        },
        'Tetradic': {
          bg: '#070619',
          blade: '#00F0FF',
          blade2: '#FF007F',
          center: '#76FF03',
          palette: ['#00F0FF', '#FF007F', '#76FF03', '#FF9100', '#D500F9']
        },
        'Double split-complementary': {
          bg: '#0C0A1C',
          blade: '#FF4081',
          blade2: '#00E676',
          center: '#FFD600',
          palette: ['#FF4081', '#00E676', '#651FFF', '#FFD600', '#00B0FF', '#FF6E40']
        },
        'Achromatic': {
          bg: '#000000',
          blade: '#FFFFFF',
          blade2: '#BDBDBD',
          center: '#757575',
          palette: ['#FFFFFF', '#E0E0E0', '#BDBDBD', '#757575', '#424242', '#212121']
        },
        'Achromatic + Accent': {
          bg: '#080808',
          blade: '#FFFFFF',
          blade2: '#9E9E9E',
          center: '#FF0033',
          palette: ['#FFFFFF', '#E0E0E0', '#9E9E9E', '#FF0033', '#D50000', '#1A1A1A']
        },
        'Neutral + accent': {
          bg: '#1C1917',
          blade: '#E7E5E4',
          blade2: '#A8A29E',
          center: '#F59E0B',
          palette: ['#E7E5E4', '#D6D3D1', '#A8A29E', '#78716C', '#44403C', '#F59E0B']
        },
        '(F6AA1C, BC3908, 941B0C, F6AA1C, 220901)': {
          bg: '#220901',
          blade: '#F6AA1C',
          blade2: '#BC3908',
          center: '#941B0C',
          palette: ['#F6AA1C', '#BC3908', '#941B0C', '#F6AA1C', '#220901']
        },
        '(63D1CF, 5BC0BE, 4BAD9E, 4BAD9E, 0B132B, 000000)': {
          bg: '#000000',
          blade: '#63D1CF',
          blade2: '#5BC0BE',
          center: '#4BAD9E',
          palette: ['#63D1CF', '#5BC0BE', '#4BAD9E', '#4BAD9E', '#0B132B', '#000000']
        },
        '(AA60C8, D69ADE, C9A3C6, CFB5C2, 0D001D, 120A12)': {
          bg: '#0D001D',
          blade: '#AA60C8',
          blade2: '#D69ADE',
          center: '#C9A3C6',
          palette: ['#AA60C8', '#D69ADE', '#C9A3C6', '#CFB5C2', '#0D001D', '#120A12']
        },
        '(FEF1BE, FFBA00, 008189, 00474D, 061210)': {
          bg: '#061210',
          blade: '#FFBA00',
          blade2: '#008189',
          center: '#FEF1BE',
          palette: ['#FEF1BE', '#FFBA00', '#008189', '#00474D', '#061210']
        },
        '(D4FFB0, 7FFF00, 00B894, 0A3322, 05140A)': {
          bg: '#05140A',
          blade: '#7FFF00',
          blade2: '#00B894',
          center: '#D4FFB0',
          palette: ['#D4FFB0', '#7FFF00', '#00B894', '#0A3322', '#05140A']
        },
        '(FFE8CC, FF8C00, C7501A, 3D1050, 0E0618)': {
          bg: '#0E0618',
          blade: '#FF8C00',
          blade2: '#C7501A',
          center: '#FFE8CC',
          palette: ['#FFE8CC', '#FF8C00', '#C7501A', '#3D1050', '#0E0618']
        },
        '(E8E0FF, B38FFF, 6A3DE8, 1A1250, 090612)': {
          bg: '#090612',
          blade: '#6A3DE8',
          blade2: '#B38FFF',
          center: '#E8E0FF',
          palette: ['#E8E0FF', '#B38FFF', '#6A3DE8', '#1A1250', '#090612']
        },
        '(E0FBFF, 00F0FF, D40078, 1E0A3D, 05020F)': {
          bg: '#05020F',
          blade: '#00F0FF',
          blade2: '#D40078',
          center: '#E0FBFF',
          palette: ['#E0FBFF', '#00F0FF', '#D40078', '#1E0A3D', '#05020F']
        }
      };

      /********************
        Variables & State
      ********************/

      var X = canvas.width = window.innerWidth;
      var Y = canvas.height = window.innerHeight;

      var params = {
        // Theme & Color
        colorScheme: 'Original',
        greenScreen: false,
        bgColor: '#F4F5F7',
        bladeColor: '#000000',
        secondaryBladeColor: '#1f1f1f',
        centerColor: '#ffffff',
        colorMode: 'Palette Variety',

        // Procedural Variations
        clickToRandomize: true,
        randomizeNow: function () {
          randomizeScene();
        },

        // Geometry
        bladeCount: 4,
        bladeWidthRatio: 3.0,
        centerRadiusRatio: 10.0,
        spinRate: 1.5,
        showCenter: true,

        // Motion & Physics
        gravity: 0.01,
        speedX: X < 768 ? 1.0 : 2.0,
        speedY: X < 768 ? 4.0 : 5.0,
        rotationSpeed: 1.0,
        growthRate: 1.0,
        shapeCount: X < 768 ? 300 : 500,
        compositeOperation: 'source-over',

        // Camera / Navigation
        zoom: 1.0,
        panX: 0,
        panY: 0,
        resetView: function () {
          params.zoom = 1.0;
          params.panX = 0;
          params.panY = 0;
          updateGuiControllers();
        }
      };

      var shapes = [];

      /********************
        Shape
      ********************/

      function Shape(ctx, x, y) {
        this.ctx = ctx;
        this.init(x, y);
      }

      Shape.prototype.init = function (x, y) {
        this.x = x;
        this.y = y;
        this.r = 1;
        this.c = rand(0, 360);
        this.a = rand(0, 360);
        this.rad = this.a * Math.PI / 180;
        this.inA = Math.random();
        this.inR = Math.random() * Math.random() * Math.random();
        this.v = {
          x: Math.sin(this.rad) * params.speedX,
          y: Math.cos(this.rad) * params.speedY
        };
        this.ga = Math.random();
        this.colorIdx = rand(0, 30);
        this.assignColors();
      };

      Shape.prototype.assignColors = function (palette) {
        var curScheme = SCHEMES[params.colorScheme];
        var pal = palette || (curScheme ? curScheme.palette : null);
        if (pal && pal.length > 0) {
          this.color1 = pal[this.colorIdx % pal.length];
          this.color2 = pal[(this.colorIdx + 2) % pal.length] || pal[0];
        } else {
          this.color1 = params.bladeColor;
          this.color2 = params.centerColor;
        }
      };

      Shape.prototype.draw = function () {
        var ctx = this.ctx;
        ctx.save();

        var bladeFill;
        if (params.colorMode === 'Uniform Custom') {
          bladeFill = params.bladeColor;
        } else if (params.colorMode === 'Two-Tone Blades') {
          bladeFill = params.bladeColor;
        } else {
          bladeFill = this.color1 || params.bladeColor;
        }

        ctx.fillStyle = bladeFill;
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rad * params.spinRate);
        ctx.scale(Math.sin(this.rad), Math.cos(this.rad));
        ctx.translate(-this.x, -this.y);

        var count = Math.max(2, Math.round(params.bladeCount));
        var stepAngle = (360 / count) * Math.PI / 180;
        var halfWidth = this.r / params.bladeWidthRatio;

        for (var i = 0; i < count; i++) {
          ctx.translate(this.x, this.y);
          ctx.rotate(stepAngle);
          ctx.translate(-this.x, -this.y);

          if (params.colorMode === 'Two-Tone Blades') {
            ctx.fillStyle = (i % 2 === 0) ? params.bladeColor : params.secondaryBladeColor;
          }

          ctx.beginPath();
          ctx.moveTo(this.x - halfWidth, this.y);
          ctx.lineTo(this.x, this.y - this.r);
          ctx.lineTo(this.x + halfWidth, this.y);
          ctx.closePath();
          ctx.fill();
        }

        if (params.showCenter) {
          var centerFill = (params.colorMode === 'Uniform Custom') ? params.centerColor : (this.color2 || params.centerColor);
          ctx.fillStyle = centerFill;
          ctx.beginPath();
          ctx.arc(this.x, this.y, Math.max(0.5, this.r / params.centerRadiusRatio), 0, Math.PI * 2, false);
          ctx.fill();
        }

        ctx.restore();
      };

      Shape.prototype.resize = function () {
        this.x = X / 2;
        this.y = Y / 2;
      };

      Shape.prototype.updatePosition = function () {
        this.v.y += params.gravity;
        this.x += this.v.x;
        this.y += this.v.y;
      };

      Shape.prototype.wrapPosition = function () {
        var wrapThreshold = Math.max(Y + 200, (canvas.height - params.panY) / Math.max(0.01, params.zoom) + 200);
        if (this.y - this.r > wrapThreshold || this.r > 2000) {
          this.init(X / 2, Y / 2);
        }
      };

      Shape.prototype.updateParams = function (i) {
        if (i % 2 === 0) {
          this.a += this.inA * params.rotationSpeed;
        } else {
          this.a -= this.inA * params.rotationSpeed;
        }
        this.rad = this.a * Math.PI / 180;
        this.r += this.inR * params.growthRate;
      };

      Shape.prototype.render = function (i) {
        this.updateParams(i);
        this.updatePosition();
        this.wrapPosition();
        this.draw();
      };

      /********************
        Initial Shapes Spawning
      ********************/

      for (var i = 0; i < Math.min(60, params.shapeCount); i++) {
        var s = new Shape(ctx, X / 2, Y / 2);
        s.r = 1 + Math.random() * 20;
        s.a = rand(0, 360);
        s.rad = s.a * Math.PI / 180;
        shapes.push(s);
      }

      var spawnInterval = setInterval(function () {
        for (var k = 0; k < 6; k++) {
          if (shapes.length < params.shapeCount) {
            shapes.push(new Shape(ctx, X / 2, Y / 2));
          } else {
            clearInterval(spawnInterval);
            break;
          }
        }
      }, 25);

      /********************
        Scheme & Color Management
      ********************/

      function applyScheme(schemeName) {
        var scheme = SCHEMES[schemeName];
        if (!scheme) return;
        params.colorScheme = schemeName;
        params.bgColor = scheme.bg;
        params.bladeColor = scheme.blade;
        params.secondaryBladeColor = scheme.blade2;
        params.centerColor = scheme.center;

        for (var i = 0; i < shapes.length; i++) {
          shapes[i].assignColors(scheme.palette);
        }
        updateCanvasBg();
        updateGuiControllers();
      }

      function updateCanvasBg() {
        var bg = params.greenScreen ? '#00ff00' : params.bgColor;
        canvas.style.backgroundColor = bg;
        document.body.style.backgroundColor = bg;
      }

      /********************
        Procedural Variation on Scene Click
      ********************/

      function randomizeScene() {
        var schemeKeys = Object.keys(SCHEMES);
        var nextScheme = schemeKeys[Math.floor(Math.random() * schemeKeys.length)];
        if (nextScheme === params.colorScheme && schemeKeys.length > 1) {
          nextScheme = schemeKeys[(schemeKeys.indexOf(nextScheme) + 1) % schemeKeys.length];
        }
        applyScheme(nextScheme);

        var bladeCounts = [3, 4, 4, 5, 6, 8];
        params.bladeCount = bladeCounts[Math.floor(Math.random() * bladeCounts.length)];
        params.bladeWidthRatio = +(Math.random() * 2.5 + 1.8).toFixed(1);
        params.centerRadiusRatio = +(Math.random() * 12 + 6).toFixed(1);
        params.spinRate = +(Math.random() * 2.2 + 0.8).toFixed(1);

        params.gravity = +(Math.random() * 0.025 + 0.005).toFixed(3);
        params.speedX = +(Math.random() * 3.5 + 1.0).toFixed(1);
        params.speedY = +(Math.random() * 6.0 + 2.5).toFixed(1);
        params.rotationSpeed = +(Math.random() * 1.5 + 0.5).toFixed(1);
        params.growthRate = +(Math.random() * 1.5 + 0.5).toFixed(1);
        params.compositeOperation = Math.random() < 0.25 ? 'lighter' : 'source-over';

        for (var i = 0; i < shapes.length; i++) {
          var s = shapes[i];
          s.inA = Math.random();
          s.inR = Math.random() * Math.random() * Math.random();
          s.v.x = Math.sin(s.rad) * params.speedX;
          s.v.y = Math.cos(s.rad) * params.speedY;
          s.assignColors();
        }

        updateGuiControllers();
      }

      /********************
        Render Loop
      ********************/

      function render() {
        var currentBg = params.greenScreen ? '#00ff00' : params.bgColor;

        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.fillStyle = currentBg;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.translate(params.panX, params.panY);
        ctx.scale(params.zoom, params.zoom);

        ctx.globalCompositeOperation = params.compositeOperation;

        for (var i = 0; i < shapes.length; i++) {
          shapes[i].render(i);
        }

        ctx.restore();

        requestAnimationFrame(render);
      }

      render();

      /********************
        Events: Window Resize
      ********************/

      function onResize() {
        X = canvas.width = window.innerWidth;
        Y = canvas.height = window.innerHeight;
        for (var i = 0; i < shapes.length; i++) {
          shapes[i].resize();
        }
      }

      window.addEventListener('resize', onResize);

      /********************
        Wheel Zoom (Centered on Cursor)
      ********************/

      canvas.addEventListener('wheel', function (e) {
        e.preventDefault();
        var zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
        var minZoom = 0.05;
        var maxZoom = 25.0;
        var oldZoom = params.zoom;
        var newZoom = Math.min(Math.max(oldZoom * zoomFactor, minZoom), maxZoom);

        var mouseX = e.clientX;
        var mouseY = e.clientY;

        params.panX = mouseX - (mouseX - params.panX) * (newZoom / oldZoom);
        params.panY = mouseY - (mouseY - params.panY) * (newZoom / oldZoom);
        params.zoom = newZoom;

        updateGuiControllers();
      }, { passive: false });

      /********************
        Mouse Dragging & Scene Click
      ********************/

      var isDragging = false;
      var dragStartX = 0;
      var dragStartY = 0;
      var dragStartPanX = 0;
      var dragStartPanY = 0;
      var dragMoved = false;

      canvas.addEventListener('mousedown', function (e) {
        if (e.button !== 0) return;
        isDragging = true;
        dragMoved = false;
        dragStartX = e.clientX;
        dragStartY = e.clientY;
        dragStartPanX = params.panX;
        dragStartPanY = params.panY;
        canvas.classList.add('dragging');
      });

      window.addEventListener('mousemove', function (e) {
        if (!isDragging) return;
        var dx = e.clientX - dragStartX;
        var dy = e.clientY - dragStartY;
        if (Math.hypot(dx, dy) > 5) {
          dragMoved = true;
        }
        params.panX = dragStartPanX + dx;
        params.panY = dragStartPanY + dy;
        updateGuiControllers();
      });

      window.addEventListener('mouseup', function (e) {
        if (!isDragging) return;
        isDragging = false;
        canvas.classList.remove('dragging');

        if (!dragMoved && e.target === canvas) {
          if (params.clickToRandomize) {
            randomizeScene();
          }
        }
      });

      /********************
        Touch Support: Drag, Pinch Zoom & Tap
      ********************/

      var initialPinchDist = 0;
      var initialPinchZoom = 1;

      canvas.addEventListener('touchstart', function (e) {
        if (e.touches.length === 1) {
          isDragging = true;
          dragMoved = false;
          dragStartX = e.touches[0].clientX;
          dragStartY = e.touches[0].clientY;
          dragStartPanX = params.panX;
          dragStartPanY = params.panY;
        } else if (e.touches.length === 2) {
          isDragging = false;
          initialPinchDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          initialPinchZoom = params.zoom;
        }
      }, { passive: false });

      window.addEventListener('touchmove', function (e) {
        if (e.touches.length === 1 && isDragging) {
          var dx = e.touches[0].clientX - dragStartX;
          var dy = e.touches[0].clientY - dragStartY;
          if (Math.hypot(dx, dy) > 5) dragMoved = true;
          params.panX = dragStartPanX + dx;
          params.panY = dragStartPanY + dy;
          updateGuiControllers();
        } else if (e.touches.length === 2 && initialPinchDist > 0) {
          var dist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          var midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
          var midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
          var newZoom = Math.min(Math.max(initialPinchZoom * (dist / initialPinchDist), 0.05), 25.0);
          params.panX = midX - (midX - params.panX) * (newZoom / params.zoom);
          params.panY = midY - (midY - params.panY) * (newZoom / params.zoom);
          params.zoom = newZoom;
          updateGuiControllers();
        }
      }, { passive: false });

      window.addEventListener('touchend', function (e) {
        if (isDragging && !dragMoved && e.touches.length === 0) {
          if (params.clickToRandomize) {
            randomizeScene();
          }
        }
        if (e.touches.length === 0) {
          isDragging = false;
          initialPinchDist = 0;
        }
      });

      /********************
        lil-gui Control Panel
      ********************/

      var gui = new GUI({ title: 'Scene Controls' });

      function updateGuiControllers() {
        if (!gui) return;
        gui.controllersRecursive().forEach(function (c) {
          c.updateDisplay();
        });
      }

      // Theme & Color Folder
      var themeFolder = gui.addFolder('Theme & Color');
      themeFolder.add(params, 'colorScheme', Object.keys(SCHEMES)).name('Color Scheme').onChange(applyScheme);
      themeFolder.add(params, 'greenScreen').name('Green Screen (#00ff00)').onChange(updateCanvasBg);
      themeFolder.addColor(params, 'bgColor').name('Background Color').onChange(updateCanvasBg);
      themeFolder.add(params, 'colorMode', ['Palette Variety', 'Two-Tone Blades', 'Uniform Custom']).name('Color Mode');
      themeFolder.addColor(params, 'bladeColor').name('Blade Color');
      themeFolder.addColor(params, 'secondaryBladeColor').name('Secondary Blade');
      themeFolder.addColor(params, 'centerColor').name('Center Core');

      // Procedural Variations Folder
      var randomFolder = gui.addFolder('Procedural Variations');
      randomFolder.add(params, 'clickToRandomize').name('Click Scene to Roll');
      randomFolder.add(params, 'randomizeNow').name('Randomize Now 🎲');

      // Geometry Folder
      var geomFolder = gui.addFolder('Geometry');
      geomFolder.add(params, 'bladeCount', 2, 12, 1).name('Blade Count');
      geomFolder.add(params, 'bladeWidthRatio', 1.0, 6.0, 0.1).name('Blade Width Ratio');
      geomFolder.add(params, 'centerRadiusRatio', 3.0, 25.0, 0.5).name('Center Core Ratio');
      geomFolder.add(params, 'spinRate', 0.1, 5.0, 0.1).name('Spin Rate');
      geomFolder.add(params, 'showCenter').name('Show Center Core');

      // Motion & Physics Folder
      var motionFolder = gui.addFolder('Motion & Physics');
      motionFolder.add(params, 'gravity', 0.0, 0.05, 0.001).name('Gravity');
      motionFolder.add(params, 'speedX', 0.1, 8.0, 0.1).name('Speed X');
      motionFolder.add(params, 'speedY', 0.5, 15.0, 0.1).name('Speed Y');
      motionFolder.add(params, 'rotationSpeed', 0.1, 4.0, 0.1).name('Rotation Speed');
      motionFolder.add(params, 'growthRate', 0.1, 4.0, 0.1).name('Growth Rate');
      motionFolder.add(params, 'shapeCount', 50, 1000, 10).name('Shape Count').onChange(function (val) {
        while (shapes.length < val) {
          shapes.push(new Shape(ctx, X / 2, Y / 2));
        }
        if (shapes.length > val) {
          shapes.length = val;
        }
      });
      motionFolder.add(params, 'compositeOperation', ['source-over', 'lighter', 'screen', 'xor', 'multiply']).name('Composite Mode');

      // Camera & Navigation Folder
      var viewFolder = gui.addFolder('Camera & Navigation');
      viewFolder.add(params, 'zoom', 0.05, 10.0, 0.01).name('Zoom');
      viewFolder.add(params, 'panX', -2000, 2000, 1).name('Pan X');
      viewFolder.add(params, 'panY', -2000, 2000, 1).name('Pan Y');
      viewFolder.add(params, 'resetView').name('Reset Pan & Zoom');

      /********************
        Hide / Show GUI with 'H' Key
      ********************/

      var isGuiVisible = true;
      window.addEventListener('keydown', function (e) {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT')) {
          return;
        }
        if (e.key === 'h' || e.key === 'H') {
          isGuiVisible = !isGuiVisible;
          if (typeof gui.show === 'function') {
            gui.show(isGuiVisible);
          }
          if (gui.domElement) {
            gui.domElement.style.display = isGuiVisible ? '' : 'none';
          }
        }
      });

      updateCanvasBg();

      console.log('File Name / clumsyNinja.js\nCreated Date / July 13, 2020\nAuthor / Toshiya Marukubo\nTwitter / https://twitter.com/toshiyamarukubo');
    })();
  </script>
