<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Arabesque Unfolding from the Center</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030712;
      user-select: none;
      -webkit-user-select: none;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js",
      "postprocessing/PostProcessor.js": "./postprocessing/PostProcessor.js"
    }
  }
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import GUI from 'lil-gui';

    // =========================================================================
    // POST PROCESSOR SUITE (From postprocessing/PostProcessor.js)
    // Supports direct ES module import with inline fallback for file:// protocol
    // =========================================================================
    const orthoVertexShader = `
    precision highp float;
    in vec3 position;
    out vec2 vUv;
    void main() {
      vUv = position.xy * 0.5 + 0.5;
      gl_Position = vec4(position.xy, 0.0, 1.0);
    }
    `;

    const brightFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float bloomThreshold;
    in vec2 vUv;
    out vec4 fragColor;

    vec3 sanitize(vec3 v) {
      if (isnan(v.x) || isinf(v.x)) v.x = 0.0;
      if (isnan(v.y) || isinf(v.y)) v.y = 0.0;
      if (isnan(v.z) || isinf(v.z)) v.z = 0.0;
      return clamp(v, vec3(0.0), vec3(65000.0));
    }

    void main() {
      vec4 raw = texture(inputTexture, vUv);
      vec3 color = sanitize(raw.rgb);
      float luminance = max(0.0, dot(color, vec3(0.2126, 0.7152, 0.0722)));
      float knee = 0.1;
      float soft = luminance - bloomThreshold + knee;
      soft = clamp(soft, 0.0, 2.0 * knee);
      soft = (soft * soft) / (4.0 * knee + 0.00001);
      float contribution = max(soft, luminance - bloomThreshold);
      contribution /= max(luminance, 0.0001);
      vec3 result = color * contribution;
      fragColor = vec4(sanitize(result), clamp(raw.a, 0.0, 1.0));
    }
    `;

    const blur13ShaderChunk = `
    vec4 blur13(sampler2D image, vec2 uv, vec2 direction) {
      vec2 resolution = vec2(textureSize(image, 0));
      vec4 color = vec4(0.0);
      vec2 off1 = vec2(1.411764705882353) * direction;
      vec2 off2 = vec2(3.2941176470588234) * direction;
      vec2 off3 = vec2(5.176470588235294) * direction;
      color += texture(image, uv) * 0.1964825501511404;
      color += texture(image, uv + (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv - (off1 / resolution)) * 0.2969069646728344;
      color += texture(image, uv + (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv - (off2 / resolution)) * 0.09447039785044732;
      color += texture(image, uv + (off3 / resolution)) * 0.010381362401148057;
      color += texture(image, uv - (off3 / resolution)) * 0.010381362401148057;
      return color;
    }
    `;

    const blurFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 direction;
    in vec2 vUv;
    out vec4 color;
    ${blur13ShaderChunk}

    vec4 sanitize(vec4 v) {
      if (isnan(v.x) || isinf(v.x)) v.x = 0.0;
      if (isnan(v.y) || isinf(v.y)) v.y = 0.0;
      if (isnan(v.z) || isinf(v.z)) v.z = 0.0;
      if (isnan(v.w) || isinf(v.w)) v.w = 0.0;
      return clamp(v, vec4(0.0), vec4(65000.0));
    }

    void main() {
      color = sanitize(blur13(inputTexture, vUv, direction));
    }
    `;

    const godRaysDepthMaskShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float threshold;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float lum = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float factor = smoothstep(threshold, threshold + 0.15, lum);
      fragColor = vec4(vec3(factor), 1.0);
    }
    `;

    const godRaysGenerateShader = `
    precision highp float;
    #define TAPS_PER_PASS 6.0

    uniform sampler2D inputTexture;
    uniform vec3 vSunPositionScreenSpace;
    uniform float fStepSize;
    uniform float distanceAttenuation;
    uniform float maxDensity;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec2 delta = vSunPositionScreenSpace.xy - vUv;
      float dist = length(delta);
      vec2 stepv = fStepSize * delta / max(dist, 0.0001);
      float iters = dist / max(fStepSize, 0.00001);

      vec2 uv = vUv;
      float col = 0.0;
      float f = min(1.0, max(vSunPositionScreenSpace.z, 0.0));
      float atten = 1.0 / (1.0 + pow(dist, distanceAttenuation));

      if (0.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (1.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (2.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (3.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (4.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;
      uv += stepv;
      if (5.0 <= iters && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) col += texture(inputTexture, uv).r * f;

      float finalVal = min(col / TAPS_PER_PASS * atten, maxDensity);
      fragColor = vec4(vec3(finalVal), 1.0);
    }
    `;

    const anamorphicBrightShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float threshold;
    uniform float smoothWidth;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec4 color = texture(inputTexture, vUv);
      float v = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      float alpha = smoothstep(threshold, threshold + smoothWidth, v);
      fragColor = mix(vec4(0.0), color, alpha);
    }
    `;

    const anamorphicBlurShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 resolution;
    uniform float samples;
    uniform float intensity;
    uniform vec3 tintColor;
    uniform float bloomRadius;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      int halfSamples = max(1, int(samples) / 2);
      float fHalfSamples = float(halfSamples);
      vec2 invSize = 1.0 / resolution;
      vec4 total = vec4(0.0);

      for (int i = -64; i <= 64; i++) {
        if (i < -halfSamples || i > halfSamples) continue;
        float softness = 1.0 - abs(float(i)) / fHalfSamples;
        softness = pow(softness, 2.0);
        vec2 shiftedUV = vec2(vUv.x + invSize.x * float(i) * (4.0 + bloomRadius * 8.0), vUv.y);
        shiftedUV = clamp(shiftedUV, 0.001, 0.999);
        total += texture(inputTexture, shiftedUV) * softness;
      }

      fragColor = (total / (samples / 3.0)) * vec4(tintColor, 1.0) * intensity;
    }
    `;

    const finalFragmentShader = `
    precision highp float;
    uniform vec2 resolution;
    uniform sampler2D inputTexture;
    uniform sampler2D blur0Texture;
    uniform sampler2D blur1Texture;
    uniform sampler2D blur2Texture;
    uniform sampler2D blur3Texture;
    uniform sampler2D blur4Texture;
    uniform sampler2D raysTexture;
    uniform sampler2D anamorphicTexture;
    uniform bool bloomEnabled;
    uniform float bloomStrength;
    uniform bool raysEnabled;
    uniform float raysStrength;
    uniform vec3 raysColor;
    uniform bool anamorphicEnabled;
    uniform float vignetteBoost;
    uniform float vignetteReduction;
    uniform float noiseIntensity;
    uniform float time;
    in vec2 vUv;
    out vec4 fragColor;

    vec3 sanitize(vec3 v) {
      if (isnan(v.x) || isinf(v.x)) v.x = 0.0;
      if (isnan(v.y) || isinf(v.y)) v.y = 0.0;
      if (isnan(v.z) || isinf(v.z)) v.z = 0.0;
      return clamp(v, vec3(0.0), vec3(65000.0));
    }

    float vignette(vec2 uv, float boost, float reduction) {
      vec2 position = vUv - 0.5;
      return boost - length(position) * reduction;
    }

    float hash1(uint n) {
      n = (n << 13U) ^ n;
      n = n * (n * n * 15731U + 789221U) + 1376312589U;
      return float(n & uint(0x7fffffffU)) / float(0x7fffffff);
    }

    float noise(in vec2 uv, in float timeVal) {
      uvec2 p = uvec2(uv);
      return hash1(p.x + 1920U * p.y + (1920U * 1080U) * (uint(timeVal) % 65536U));
    }

    void main() {
      vec4 raw = texture(inputTexture, vUv);
      vec3 color = sanitize(raw.rgb);

      if (bloomEnabled && bloomStrength > 0.001) {
        vec3 b0 = sanitize(texture(blur0Texture, vUv).rgb);
        vec3 b1 = sanitize(texture(blur1Texture, vUv).rgb);
        vec3 b2 = sanitize(texture(blur2Texture, vUv).rgb);
        vec3 b3 = sanitize(texture(blur3Texture, vUv).rgb);
        vec3 b4 = sanitize(texture(blur4Texture, vUv).rgb);
        vec3 bloomSum = (b0 * 0.3 + b1 * 0.25 + b2 * 0.2 + b3 * 0.15 + b4 * 0.1);
        color += bloomSum * bloomStrength;
      }

      if (raysEnabled && raysStrength > 0.001) {
        vec3 r = sanitize(texture(raysTexture, vUv).rgb);
        color += r * raysColor * raysStrength;
      }

      if (anamorphicEnabled) {
        vec3 a = sanitize(texture(anamorphicTexture, vUv).rgb);
        color += a;
      }

      float vig = max(0.0, vignette(vUv, vignetteBoost, vignetteReduction));
      color *= vig;
      color += max(0.0, noiseIntensity) * noise(gl_FragCoord.xy, time);
      fragColor = vec4(sanitize(color), 1.0);
    }
    `;

    const chromaticAberrationShaderChunk = `
    vec2 barrelDistortion(vec2 coord, float amt) {
      vec2 cc = coord - 0.5;
      float dist = dot(cc, cc);
      return coord + cc * dist * amt;
    }
    float sat(float t) { return clamp(t, 0.0, 1.0); }
    float linterp(float t) { return sat(1.0 - abs(2.0 * t - 1.0)); }
    float remap(float t, float a, float b) { return sat((t - a) / (b - a)); }
    vec4 spectrum_offset(float t) {
      float lo = step(t, 0.5);
      float hi = 1.0 - lo;
      float w = linterp(remap(t, 1.0/6.0, 5.0/6.0));
      vec4 ret = vec4(lo, 1.0, hi, 1.0) * vec4(1.0 - w, w, 1.0 - w, 1.0);
      return pow(ret, vec4(1.0 / 2.2));
    }
    const float max_distort = 2.2;
    const int num_iter = 8;
    const float reci_num_iter_f = 1.0 / float(num_iter);
    vec4 chromaticAberration(sampler2D inputTexture, vec2 uv, float amount, vec2 dir) {
      vec4 sumcol = vec4(0.0);
      vec4 sumw = vec4(0.0);
      for (int i = 0; i < num_iter; ++i) {
        float t = float(i) * reci_num_iter_f;
        vec4 w = spectrum_offset(t);
        sumw += w;
        sumcol += w * texture(inputTexture, barrelDistortion(uv, amount * max_distort * t));
      }
      return sumcol / sumw;
    }
    `;

    const colorFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform float chromaticAberrationAmount;
    uniform float minInputLevel;
    uniform float maxInputLevel;
    uniform float gammaLevel;
    uniform float exposure;
    uniform float fisheyeStrength;
    uniform float fisheyeRadius;
    uniform float time;
    uniform int visionMode;
    uniform float thermalSensitivity;
    uniform float nightVisionNoise;
    uniform float nightVisionGain;
    uniform float crtIntensity;
    in vec2 vUv;
    out vec4 fragColor;

    ${chromaticAberrationShaderChunk}

    vec2 applyFisheye(vec2 uv, float strength, float radius) {
      if (abs(strength) < 0.0001) return uv;
      vec2 p = uv - 0.5;
      float d = length(p);
      if (d > radius * 1.5) return uv;
      float r = d / max(radius, 0.001);
      float theta = atan(p.y, p.x);
      float rDist = r + strength * (r * r * r);
      return 0.5 + vec2(cos(theta), sin(theta)) * (rDist * radius);
    }

    vec3 ACESFilmicToneMapping(vec3 color) {
      color = max(vec3(0.0), color);
      float a = 2.51;
      float b = 0.03;
      float c = 2.43;
      float d = 0.59;
      float e = 0.14;
      vec3 denom = max(color * (c * color + d) + e, vec3(0.0001));
      return clamp((color * (a * color + b)) / denom, 0.0, 1.0);
    }

    vec3 gammaCorrect(vec3 color, vec3 gamma) {
      return pow(max(color, vec3(0.0)), 1.0 / max(gamma, vec3(0.001)));
    }
    vec3 levelRange(vec3 color, vec3 minInput, vec3 maxInput) {
      return min(max(color - minInput, vec3(0.0)) / max(maxInput - minInput, vec3(0.0001)), vec3(1.0));
    }
    vec3 finalLevels(vec3 color, vec3 minInput, vec3 gamma, vec3 maxInput) {
      return gammaCorrect(levelRange(color, minInput, maxInput), gamma);
    }

    vec3 applyNightVision(vec3 color, vec2 uv, float timeVal, float noiseAmt, float gain, float crt) {
      float lum = dot(color, vec3(0.299, 0.587, 0.114));
      float amplified = pow(lum * gain, 0.72);
      vec3 phosphorColor = mix(vec3(0.02, 0.12, 0.03), vec3(0.18, 1.0, 0.32), clamp(amplified, 0.0, 1.0));
      phosphorColor += vec3(0.7, 1.0, 0.8) * max(0.0, amplified - 0.75) * 1.8;
      vec2 p = uv - 0.5;
      float tubeDist = length(p);
      float tubeMask = smoothstep(0.72, 0.44, tubeDist);
      float n = fract(sin(dot(uv * 280.0 + timeVal * 0.05, vec2(12.9898, 78.233))) * 43758.5453);
      float scanline = sin(uv.y * 650.0) * crt;
      phosphorColor += (n - 0.5) * noiseAmt * 2.0 + scanline;
      return clamp(phosphorColor * tubeMask, 0.0, 1.0);
    }

    vec3 ironbow(float t) {
      t = clamp(t, 0.0, 1.0);
      vec3 c0 = vec3(0.02, 0.01, 0.18);
      vec3 c1 = vec3(0.22, 0.02, 0.48);
      vec3 c2 = vec3(0.82, 0.05, 0.25);
      vec3 c3 = vec3(1.0, 0.62, 0.02);
      vec3 c4 = vec3(1.0, 1.0, 0.92);
      if (t < 0.25) return mix(c0, c1, t * 4.0);
      if (t < 0.50) return mix(c1, c2, (t - 0.25) * 4.0);
      if (t < 0.75) return mix(c2, c3, (t - 0.50) * 4.0);
      return mix(c3, c4, (t - 0.75) * 4.0);
    }

    vec3 applyThermal(vec3 color, vec2 uv, float sensitivity, float crt, bool whiteHot) {
      float lum = dot(color, vec3(0.299, 0.587, 0.114));
      float heat = clamp(lum * sensitivity, 0.0, 1.0);
      float sensorRaster = sin(uv.y * 900.0) * (crt * 0.3);
      heat = clamp(heat + sensorRaster, 0.0, 1.0);
      if (whiteHot) {
        float grad = pow(heat, 0.85);
        return vec3(grad);
      } else {
        return ironbow(heat);
      }
    }

    void main() {
      vec2 uv = applyFisheye(vUv, fisheyeStrength, fisheyeRadius);
      vec4 col = chromaticAberration(inputTexture, uv, chromaticAberrationAmount, (uv - 0.5));
      vec3 finalCol = col.rgb;
      if (isnan(finalCol.x) || isinf(finalCol.x)) finalCol.x = 0.0;
      if (isnan(finalCol.y) || isinf(finalCol.y)) finalCol.y = 0.0;
      if (isnan(finalCol.z) || isinf(finalCol.z)) finalCol.z = 0.0;
      finalCol = clamp(finalCol, vec3(0.0), vec3(65000.0));

      if (visionMode == 1) {
        finalCol = applyNightVision(finalCol, uv, time, nightVisionNoise, nightVisionGain, crtIntensity);
      } else if (visionMode == 2) {
        finalCol = applyThermal(finalCol, uv, thermalSensitivity, crtIntensity, false);
      } else if (visionMode == 3) {
        finalCol = applyThermal(finalCol, uv, thermalSensitivity, crtIntensity, true);
      } else {
        vec3 exposedColor = finalCol * exposure;
        vec3 toneMappedColor = ACESFilmicToneMapping(exposedColor);
        finalCol = finalLevels(toneMappedColor, vec3(minInputLevel), vec3(gammaLevel), vec3(maxInputLevel));
        if (crtIntensity > 0.0001) {
          float scanline = sin(uv.y * 900.0 + time * 2.0) * crtIntensity;
          finalCol -= scanline;
        }
      }
      fragColor = vec4(finalCol, 1.0);
    }
    `;

    const copyFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    in vec2 vUv;
    out vec4 fragColor;
    void main() {
      fragColor = texture(inputTexture, vUv);
    }
    `;

    const fxaaFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 resolution;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec2 inverseVP = 1.0 / resolution;
      vec3 rgbNW = texture(inputTexture, vUv + vec2(-1.0, -1.0) * inverseVP).rgb;
      vec3 rgbNE = texture(inputTexture, vUv + vec2(1.0, -1.0) * inverseVP).rgb;
      vec3 rgbSW = texture(inputTexture, vUv + vec2(-1.0, 1.0) * inverseVP).rgb;
      vec3 rgbSE = texture(inputTexture, vUv + vec2(1.0, 1.0) * inverseVP).rgb;
      vec3 rgbM  = texture(inputTexture, vUv).rgb;

      vec3 luma = vec3(0.299, 0.587, 0.114);
      float lumaNW = dot(rgbNW, luma);
      float lumaNE = dot(rgbNE, luma);
      float lumaSW = dot(rgbSW, luma);
      float lumaSE = dot(rgbSE, luma);
      float lumaM  = dot(rgbM,  luma);

      float lumaMin = min(lumaM, min(min(lumaNW, lumaNE), min(lumaSW, lumaSE)));
      float lumaMax = max(lumaM, max(max(lumaNW, lumaNE), max(lumaSW, lumaSE)));

      vec2 dir;
      dir.x = -((lumaNW + lumaNE) - (lumaSW + lumaSE));
      dir.y =  ((lumaNW + lumaSW) - (lumaNE + lumaSE));

      float dirReduce = max((lumaNW + lumaNE + lumaSW + lumaSE) * (0.25 * (1.0 / 8.0)), 1.0 / 128.0);
      float rcpDirMin = 1.0 / (min(abs(dir.x), abs(dir.y)) + dirReduce);
      dir = min(vec2(8.0, 8.0), max(vec2(-8.0, -8.0), dir * rcpDirMin)) * inverseVP;

      vec3 rgbA = 0.5 * (
          texture(inputTexture, vUv + dir * (1.0 / 3.0 - 0.5)).rgb +
          texture(inputTexture, vUv + dir * (2.0 / 3.0 - 0.5)).rgb);
      vec3 rgbB = rgbA * 0.5 + 0.25 * (
          texture(inputTexture, vUv + dir * -0.5).rgb +
          texture(inputTexture, vUv + dir * 0.5).rgb);

      float lumaB = dot(rgbB, luma);
      if ((lumaB < lumaMin) || (lumaB > lumaMax)) {
          fragColor = vec4(rgbA, 1.0);
      } else {
          fragColor = vec4(rgbB, 1.0);
      }
    }
    `;

    const smaaFragmentShader = `
    precision highp float;
    uniform sampler2D inputTexture;
    uniform vec2 resolution;
    in vec2 vUv;
    out vec4 fragColor;

    void main() {
      vec2 invRes = 1.0 / resolution;
      vec4 center = texture(inputTexture, vUv);
      vec3 cU = texture(inputTexture, vUv + vec2(0.0, -1.0) * invRes).rgb;
      vec3 cD = texture(inputTexture, vUv + vec2(0.0, 1.0) * invRes).rgb;
      vec3 cL = texture(inputTexture, vUv + vec2(-1.0, 0.0) * invRes).rgb;
      vec3 cR = texture(inputTexture, vUv + vec2(1.0, 0.0) * invRes).rgb;
      vec3 cUL = texture(inputTexture, vUv + vec2(-1.0, -1.0) * invRes).rgb;
      vec3 cUR = texture(inputTexture, vUv + vec2(1.0, -1.0) * invRes).rgb;
      vec3 cDL = texture(inputTexture, vUv + vec2(-1.0, 1.0) * invRes).rgb;
      vec3 cDR = texture(inputTexture, vUv + vec2(1.0, 1.0) * invRes).rgb;

      vec3 lumaW = vec3(0.299, 0.587, 0.114);
      float lM = dot(center.rgb, lumaW);
      float lU = dot(cU, lumaW);
      float lD = dot(cD, lumaW);
      float lL = dot(cL, lumaW);
      float lR = dot(cR, lumaW);

      float gx = (lR - lL) * 2.0 + (dot(cUR, lumaW) - dot(cUL, lumaW)) + (dot(cDR, lumaW) - dot(cDL, lumaW));
      float gy = (lD - lU) * 2.0 + (dot(cDL, lumaW) - dot(cUL, lumaW)) + (dot(cDR, lumaW) - dot(cUR, lumaW));
      float edgeStrength = length(vec2(gx, gy));

      if (edgeStrength < 0.04) {
        fragColor = center;
        return;
      }

      vec2 dir = normalize(vec2(-gy, gx)) * invRes * clamp(edgeStrength * 1.5, 0.5, 1.5);
      vec4 sampleA = texture(inputTexture, vUv + dir * 0.5);
      vec4 sampleB = texture(inputTexture, vUv - dir * 0.5);
      vec4 sampleC = texture(inputTexture, vUv + dir * 1.0);
      vec4 sampleD = texture(inputTexture, vUv - dir * 1.0);
      vec4 blended = (center * 2.0 + sampleA + sampleB + (sampleC + sampleD) * 0.5) / 5.0;

          this._toMoon = new THREE.Vector3();
          this._ndc = new THREE.Vector3();
        }
        camera.getWorldDirection(this._camDir);
        this._toMoon.copy(moonWorldPos).sub(camera.position).normalize();
        const dot = this._camDir.dot(this._toMoon);

        if (dot <= 0.02) {
          this.moonInFront = false;
          this.finalShader.uniforms.raysEnabled.value = false;
          return;
        }

        this.moonInFront = true;
        const fade = THREE.MathUtils.clamp((dot - 0.02) / 0.15, 0.0, 1.0);
        this._ndc.copy(moonWorldPos).project(camera);
        const screenX = this._ndc.x * 0.5 + 0.5;
        const screenY = this._ndc.y * 0.5 + 0.5;
        const screenZ = fade;

        this.moonScreenPos.set(screenX, screenY, screenZ);
        this.godRaysGenShader.uniforms.vSunPositionScreenSpace.value.set(screenX, screenY, screenZ);
      }

      renderScene(scene, camera) {
        if (!this.settings.enabled) {
          if (this.settings.fxaaEnabled || this.settings.smaaEnabled || (this.settings.msaaSamples && this.settings.msaaSamples > 0) || (this.settings.ssaaScale && this.settings.ssaaScale > 1.0)) {
            this.renderer.setRenderTarget(this.sceneTarget);
            this.renderer.render(scene, camera);
            this.renderer.setRenderTarget(null);
            if (this.settings.fxaaEnabled) {
              this.fxaaShader.uniforms.inputTexture.value = this.sceneTarget.texture;
              this.fxaaPass.render(this.renderer, true);
            } else if (this.settings.smaaEnabled) {
              this.smaaShader.uniforms.inputTexture.value = this.sceneTarget.texture;
              this.smaaPass.render(this.renderer, true);
            } else {
              this.copyPass.shader.uniforms.inputTexture.value = this.sceneTarget.texture;
              this.copyPass.render(this.renderer, true);
            }
          } else {
            this.renderer.setRenderTarget(null);
            this.renderer.render(scene, camera);
          }
          return;
        }
        this.renderer.setRenderTarget(this.sceneTarget);
        this.renderer.render(scene, camera);
        this.renderer.setRenderTarget(null);
        this.render(this.sceneTarget.texture);
      }

      render(sourceTexture) {
        if (!this.settings.enabled) {
          this.copyPass.shader.uniforms.inputTexture.value = sourceTexture;
          this.copyPass.render(this.renderer, true);
          return;
        }

        this.updateSettings();

        this.bloomPass.source = sourceTexture;
        this.finalPass.shader.uniforms.inputTexture.value = sourceTexture;
        this.bloomPass.render(this.renderer);

        this.finalPass.shader.uniforms.blur0Texture.value = this.bloomPass.blurPasses[0].texture;
        this.finalPass.shader.uniforms.blur1Texture.value = this.bloomPass.blurPasses[1].texture;
        this.finalPass.shader.uniforms.blur2Texture.value = this.bloomPass.blurPasses[2].texture;
        this.finalPass.shader.uniforms.blur3Texture.value = this.bloomPass.blurPasses[3].texture;
        this.finalPass.shader.uniforms.blur4Texture.value = this.bloomPass.blurPasses[4].texture;

        if (this.settings.raysEnabled && this.settings.raysStrength > 0.001 && this.moonInFront) {
          this.godRaysMaskShader.uniforms.inputTexture.value = sourceTexture;
          this.godRaysMaskShader.uniforms.threshold.value = this.settings.raysThreshold;
          this.godRaysMaskPass.render(this.renderer);

          const filterLen = this.settings.raysDensity;
          const tapsPerPass = 6.0;

          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -1.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysMaskPass.texture;
          this.godRaysPingPong.render(this.renderer);

          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -2.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysPingPong.texture;
          this.godRaysPingPong.render(this.renderer);

          this.godRaysGenShader.uniforms.fStepSize.value = filterLen * Math.pow(tapsPerPass, -3.0);
          this.godRaysGenShader.uniforms.inputTexture.value = this.godRaysPingPong.texture;
          this.godRaysPingPong.render(this.renderer);

          this.finalPass.shader.uniforms.raysTexture.value = this.godRaysPingPong.texture;
          this.finalPass.shader.uniforms.raysEnabled.value = true;
        } else {
          this.finalPass.shader.uniforms.raysEnabled.value = false;
        }

        if (this.settings.anamorphicEnabled && this.settings.anamorphicIntensity > 0.001) {
          this.anamorphicBrightShader.uniforms.inputTexture.value = sourceTexture;
          this.anamorphicBrightShader.uniforms.threshold.value = this.settings.anamorphicThreshold;
          this.anamorphicBrightShader.uniforms.smoothWidth.value = this.settings.anamorphicSmoothWidth;
          this.anamorphicBrightPass.render(this.renderer);

          this.anamorphicBlurShader.uniforms.inputTexture.value = this.anamorphicBrightPass.texture;
          this.anamorphicBlurShader.uniforms.samples.value = this.settings.anamorphicSamples;
          this.anamorphicBlurShader.uniforms.intensity.value = this.settings.anamorphicIntensity;
          this.anamorphicBlurShader.uniforms.tintColor.value.copy(this.settings.anamorphicColor);
          this.anamorphicBlurShader.uniforms.bloomRadius.value = this.settings.anamorphicRadius;
          this.anamorphicBlurPass.render(this.renderer);

          this.finalPass.shader.uniforms.anamorphicTexture.value = this.anamorphicBlurPass.texture;
          this.finalPass.shader.uniforms.anamorphicEnabled.value = true;
        } else {
          this.finalPass.shader.uniforms.anamorphicEnabled.value = false;
        }

        const randomTime = Math.random() * 100000;
        this.finalPass.shader.uniforms.time.value = randomTime;
        this.rgbPass.shader.uniforms.time.value = randomTime;

        this.finalPass.render(this.renderer);
        if (this.settings.fxaaEnabled || this.settings.useFxaa) {
          this.rgbPass.render(this.renderer, false);
          this.fxaaShader.uniforms.inputTexture.value = this.rgbPass.texture;
          this.fxaaPass.render(this.renderer, true);
        } else if (this.settings.smaaEnabled) {
          this.rgbPass.render(this.renderer, false);
          this.smaaShader.uniforms.inputTexture.value = this.rgbPass.texture;
          this.smaaPass.render(this.renderer, true);
        } else {
          this.rgbPass.render(this.renderer, true);
        }
      }

    // -------------------------------------------------------------
    const lightsGroup = new THREE.Group();
    scene.add(lightsGroup);

    const ambientLight = new THREE.AmbientLight(params.ambientColor, params.ambientIntensity);
    lightsGroup.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(params.keyColor, params.keyIntensity);
    keyLight.position.set(params.keyPosX, params.keyPosY, params.keyPosZ);
    lightsGroup.add(keyLight);

    const fillLight = new THREE.DirectionalLight(params.fillColor, params.fillIntensity);
    fillLight.position.set(params.fillPosX, params.fillPosY, params.fillPosZ);
    lightsGroup.add(fillLight);

    const centerPointLight = new THREE.PointLight(
      params.centerLightColor,
      params.centerLightIntensity,
      params.centerLightDistance,
      1.5
    );
    centerPointLight.position.set(0, params.domeHeight + 0.6, 0);
    lightsGroup.add(centerPointLight);

    const glintOrbLight = new THREE.PointLight("#ffea9f", 2.2, 12, 2.0);
    lightsGroup.add(glintOrbLight);

    // -------------------------------------------------------------
    // GEOMETRIC ARABESQUE MATH & ELEVATION DOME PROFILE (X-Z HORIZONTAL, Y VERTICAL)
    // -------------------------------------------------------------
    function getDomeY(x, z, currentHeight = params.domeHeight) {
      const r = Math.hypot(x, z);
      const rMax = 15.0;
      if (r >= rMax) return 0;
      const t = r / rMax;
      const shape = Math.pow(Math.cos(t * Math.PI * 0.5), 2.2);
      return currentHeight * shape;
    }

    function getDomeNormal(x, z, currentHeight = params.domeHeight) {
      const eps = 0.02;
      const y0 = getDomeY(x, z, currentHeight);
      const yx = getDomeY(x + eps, z, currentHeight);
      const yz = getDomeY(x, z + eps, currentHeight);
      const dydx = (yx - y0) / eps;
      const dydz = (yz - y0) / eps;
      return new THREE.Vector3(-dydx, 1.0, -dydz).normalize();
    }

    // -------------------------------------------------------------
    // UNIFORMS FOR SHADERS (BREATHING & TRAVELING GLINTS)
    // -------------------------------------------------------------
    const sharedUniforms = {
      uTime: { value: 0 },
      uDomeHeight: { value: params.domeHeight },
      uWaveFreq: { value: params.waveFreq },
      uBreathingAmp: { value: params.breathingAmp },
      uAnimationSpeed: { value: params.animationSpeed },
      uGlintSpeed: { value: params.glintSpeed },
      uGlintIntensity: { value: params.glintIntensity },
      uInnerGlowIntensity: { value: params.innerGlowIntensity },
      uLineColor: { value: new THREE.Color(params.lineColor) },
      uCellPrimary: { value: new THREE.Color(params.cellPrimary) },
      uCellSecondary: { value: new THREE.Color(params.cellSecondary) },
      uCellAccent: { value: new THREE.Color(params.cellAccent) },
      uInnerGlowColor: { value: new THREE.Color(params.glowColor) }
    };

    // -------------------------------------------------------------
    // MATERIALS WITH CUSTOM SHADER INJECTIONS
    // -------------------------------------------------------------
    const lineMaterial = new THREE.MeshStandardMaterial({
      color: new THREE.Color(params.lineColor),
      metalness: params.lineMetalness,
      roughness: params.lineRoughness
    });

    lineMaterial.onBeforeCompile = (shader) => {
      shader.uniforms.uTime = sharedUniforms.uTime;
      shader.uniforms.uWaveFreq = sharedUniforms.uWaveFreq;
      shader.uniforms.uBreathingAmp = sharedUniforms.uBreathingAmp;
      shader.uniforms.uAnimationSpeed = sharedUniforms.uAnimationSpeed;
      shader.uniforms.uGlintSpeed = sharedUniforms.uGlintSpeed;
      shader.uniforms.uGlintIntensity = sharedUniforms.uGlintIntensity;
      shader.uniforms.uLineColor = sharedUniforms.uLineColor;

      shader.vertexShader = `
        attribute float aRadialDist;
        attribute float aAngle;
        varying float vRadialDist;
        varying float vAngle;
        uniform float uTime;
        uniform float uWaveFreq;
        uniform float uBreathingAmp;
        uniform float uAnimationSpeed;
        ${shader.vertexShader}
      `;

      shader.vertexShader = shader.vertexShader.replace(
        '#include <begin_vertex>',
        `
        #include <begin_vertex>
        vRadialDist = aRadialDist;
        vAngle = aAngle;
        float wave = sin(aRadialDist * uWaveFreq - uTime * 1.5 * uAnimationSpeed) * uBreathingAmp * max(0.0, 1.0 - aRadialDist / 16.5);
        transformed += normal * wave;
        `
      );

      shader.fragmentShader = `
        varying float vRadialDist;
        varying float vAngle;
        uniform float uTime;
        uniform float uGlintSpeed;
        uniform float uGlintIntensity;
        uniform vec3 uLineColor;
        ${shader.fragmentShader}
      `;

      shader.fragmentShader = shader.fragmentShader.replace(
        '#include <dithering_fragment>',
        `
        #include <dithering_fragment>
        float g1 = sin(vRadialDist * 2.1 - uTime * 2.2 * uGlintSpeed + vAngle * 2.0);
        float g2 = sin(vRadialDist * 1.4 + uTime * 1.3 * uGlintSpeed - vAngle * 4.0);
        float glint = pow(max(0.0, g1 * 0.65 + g2 * 0.35), 12.0) * uGlintIntensity;
        gl_FragColor.rgb += (uLineColor * 1.35 + vec3(0.35)) * glint;
        `
      );
    };

    const cellMaterial = new THREE.MeshStandardMaterial({
      color: new THREE.Color(params.cellPrimary),
      metalness: 0.15,
      roughness: params.cellRoughness
    });

    cellMaterial.onBeforeCompile = (shader) => {
      shader.uniforms.uTime = sharedUniforms.uTime;
      shader.uniforms.uWaveFreq = sharedUniforms.uWaveFreq;
      shader.uniforms.uBreathingAmp = sharedUniforms.uBreathingAmp;
      shader.uniforms.uAnimationSpeed = sharedUniforms.uAnimationSpeed;
      shader.uniforms.uInnerGlowIntensity = sharedUniforms.uInnerGlowIntensity;
      shader.uniforms.uInnerGlowColor = sharedUniforms.uInnerGlowColor;
      shader.uniforms.uCellPrimary = sharedUniforms.uCellPrimary;
      shader.uniforms.uCellSecondary = sharedUniforms.uCellSecondary;
      shader.uniforms.uCellAccent = sharedUniforms.uCellAccent;

      shader.vertexShader = `
        attribute float aRadialDist;
        attribute float aAngle;
        attribute float aCellType;
        varying float vRadialDist;
        varying float vAngle;
        varying float vCellType;
        uniform float uTime;
        uniform float uWaveFreq;
        uniform float uBreathingAmp;
        uniform float uAnimationSpeed;
        ${shader.vertexShader}
      `;

      shader.vertexShader = shader.vertexShader.replace(
        '#include <begin_vertex>',
        `
        #include <begin_vertex>
        vRadialDist = aRadialDist;
        vAngle = aAngle;
        vCellType = aCellType;
        float wave = sin(aRadialDist * uWaveFreq - uTime * 1.5 * uAnimationSpeed) * uBreathingAmp * max(0.0, 1.0 - aRadialDist / 16.5);
        transformed += normal * wave;
        `
      );

      shader.fragmentShader = `
        varying float vRadialDist;
        varying float vAngle;
        varying float vCellType;
        uniform float uTime;
        uniform float uInnerGlowIntensity;
        uniform vec3 uInnerGlowColor;
        uniform vec3 uCellPrimary;
        uniform vec3 uCellSecondary;
        uniform vec3 uCellAccent;
        ${shader.fragmentShader}
      `;

      shader.fragmentShader = shader.fragmentShader.replace(
        '#include <dithering_fragment>',
        `
        #include <dithering_fragment>
        vec3 baseTone = uCellPrimary;
        if (vCellType > 1.5) {
          baseTone = uCellAccent;
        } else if (vCellType > 0.5) {
          baseTone = uCellSecondary;
        }
        float pulse = 0.5 + 0.5 * sin(vRadialDist * 1.8 - uTime * 1.2);
        vec3 glow = uInnerGlowColor * (uInnerGlowIntensity * 0.45 * pulse);
        gl_FragColor.rgb = mix(gl_FragColor.rgb, baseTone, 0.75) + glow;
        `
      );
    };

    // -------------------------------------------------------------
    // PROCEDURAL 3D GEOMETRY GENERATOR (STRICT 8-FOLD ISLAMIC MOSAIC)
    // -------------------------------------------------------------
    let arabesqueGroup = new THREE.Group();
    scene.add(arabesqueGroup);

    let motesGeom, motesMat, motesPoints;
    const motesCount = 420;

    function buildArabesqueGeometry() {
      while (arabesqueGroup.children.length > 0) {
        const obj = arabesqueGroup.children[0];
        arabesqueGroup.remove(obj);
        if (obj.geometry) obj.geometry.dispose();
      }

      const linePositions = [];
      const lineNormals = [];
      const lineRadials = [];
      const lineAngles = [];

      const cellPositions = [];
      const cellNormals = [];
      const cellRadials = [];
      const cellAngles = [];
      const cellTypes = [];

      const H = params.domeHeight;

      function addTile(polygon2D, cellType = 0, isElevatedCenter = false) {
        const n = polygon2D.length;
        if (n < 3) return;

        let cx = 0, cz = 0;
        for (let i = 0; i < n; i++) {
          cx += polygon2D[i].x;
          cz += polygon2D[i].z;
        }
        cx /= n;
        cz /= n;

        const cr = Math.hypot(cx, cz);
        const cAngle = Math.atan2(cz, cx);
        let cy = getDomeY(cx, cz, H);
        if (isElevatedCenter) cy += 0.05;
        const cNorm = getDomeNormal(cx, cz, H);

        for (let i = 0; i < n; i++) {
          const p1 = polygon2D[i];
          const p2 = polygon2D[(i + 1) % n];

          const y1 = getDomeY(p1.x, p1.z, H);
          const y2 = getDomeY(p2.x, p2.z, H);
          const norm1 = getDomeNormal(p1.x, p1.z, H);
          const norm2 = getDomeNormal(p2.x, p2.z, H);

          cellPositions.push(cx, cy, cz);
          cellNormals.push(cNorm.x, cNorm.y, cNorm.z);
          cellRadials.push(cr);
          cellAngles.push(cAngle);
          cellTypes.push(cellType);

          cellPositions.push(p1.x, y1, p1.z);
          cellNormals.push(norm1.x, norm1.y, norm1.z);
          cellRadials.push(Math.hypot(p1.x, p1.z));
          cellAngles.push(Math.atan2(p1.z, p1.x));
          cellTypes.push(cellType);

          cellPositions.push(p2.x, y2, p2.z);
          cellNormals.push(norm2.x, norm2.y, norm2.z);
          cellRadials.push(Math.hypot(p2.x, p2.z));
          cellAngles.push(Math.atan2(p2.z, p2.x));
          cellTypes.push(cellType);

          addRibbonEdge(p1, p2, 0.045);
        }
      }

      function addRibbonEdge(p1, p2, width = 0.045) {
        const dx = p2.x - p1.x;
        const dz = p2.z - p1.z;
        const len = Math.hypot(dx, dz);
        if (len < 0.001) return;

        const nx = -dz / len;
        const nz = dx / len;
        const hw = width * 0.5;

        const q1 = { x: p1.x + nx * hw, z: p1.z + nz * hw };
        const q2 = { x: p1.x - nx * hw, z: p1.z - nz * hw };
        const q3 = { x: p2.x - nx * hw, z: p2.z - nz * hw };
        const q4 = { x: p2.x + nx * hw, z: p2.z + nz * hw };

        const yElev = 0.024;
        const y1 = getDomeY(q1.x, q1.z, H) + yElev;
        const y2 = getDomeY(q2.x, q2.z, H) + yElev;
        const y3 = getDomeY(q3.x, q3.z, H) + yElev;
        const y4 = getDomeY(q4.x, q4.z, H) + yElev;

        const n1 = getDomeNormal(q1.x, q1.z, H);
        const n2 = getDomeNormal(q2.x, q2.z, H);
        const n3 = getDomeNormal(q3.x, q3.z, H);
        const n4 = getDomeNormal(q4.x, q4.z, H);

        const r1 = Math.hypot(q1.x, q1.z), a1 = Math.atan2(q1.z, q1.x);
        const r2 = Math.hypot(q2.x, q2.z), a2 = Math.atan2(q2.z, q2.x);
        const r3 = Math.hypot(q3.x, q3.z), a3 = Math.atan2(q3.z, q3.x);
        const r4 = Math.hypot(q4.x, q4.z), a4 = Math.atan2(q4.z, q4.x);

        linePositions.push(q1.x, y1, q1.z, q2.x, y2, q2.z, q3.x, y3, q3.z);
        lineNormals.push(n1.x, n1.y, n1.z, n2.x, n2.y, n2.z, n3.x, n3.y, n3.z);
        lineRadials.push(r1, r2, r3);
        lineAngles.push(a1, a2, a3);

        linePositions.push(q1.x, y1, q1.z, q3.x, y3, q3.z, q4.x, y4, q4.z);
        lineNormals.push(n1.x, n1.y, n1.z, n3.x, n3.y, n3.z, n4.x, n4.y, n4.z);
        lineRadials.push(r1, r3, r4);
        lineAngles.push(a1, a3, a4);
      }

      function getOctagram(cx, cz, rOuter, rInner, rotOffset = 0) {
        const poly = [];
        for (let i = 0; i < 16; i++) {
          const a = rotOffset + (i * Math.PI) / 8;
          const r = i % 2 === 0 ? rOuter : rInner;
          poly.push({ x: cx + Math.cos(a) * r, z: cz + Math.sin(a) * r });
        }
        return poly;
      }

      function getRhombus(pA, pB, width) {
        const mx = (pA.x + pB.x) * 0.5;
        const mz = (pA.z + pB.z) * 0.5;
        const dx = pB.x - pA.x;
        const dz = pB.z - pA.z;
        const len = Math.hypot(dx, dz);
        const nx = -dz / len;
        const nz = dx / len;
        const hw = width * 0.5;
        return [
          { x: pA.x, z: pA.z },
          { x: mx + nx * hw, z: mz + nz * hw },
          { x: pB.x, z: pB.z },
          { x: mx - nx * hw, z: mz - nz * hw }
        ];
      }

      // Layer 0: Central Star
      const r0Out = 1.6;
      const r0In = r0Out * 0.45;
      const centralStar = getOctagram(0, 0, r0Out, r0In, 0);
      addTile(centralStar, 2, true);

      const apexButton = [];
      for (let i = 0; i < 8; i++) {
        const a = (i * Math.PI * 2) / 8;
        apexButton.push({ x: Math.cos(a) * 0.35, z: Math.sin(a) * 0.35 });
      }
      addTile(apexButton, 0, true);

      for (let i = 0; i < 8; i++) {
        const valleyAngle = ((2 * i + 1) * Math.PI) / 8;
        const valleyPt = { x: Math.cos(valleyAngle) * r0In, z: Math.sin(valleyAngle) * r0In };
        const outerPt = { x: Math.cos(valleyAngle) * 2.3, z: Math.sin(valleyAngle) * 2.3 };
        const diamond = getRhombus(valleyPt, outerPt, 0.65);
        addTile(diamond, 1);
      }

      // Layer 1: 8 Rosettes
      const rRing1 = 3.6;
      for (let k = 0; k < 8; k++) {
        const angle = (k * Math.PI * 2) / 8 + Math.PI / 8;
        const sx = Math.cos(angle) * rRing1;
        const sz = Math.sin(angle) * rRing1;
        const star = getOctagram(sx, sz, 1.05, 0.48, angle);
        addTile(star, k % 2 === 0 ? 0 : 2);

        for (let j = 0; j < 8; j += 2) {
          const rAngle = angle + (j * Math.PI) / 4;
          const innerP = { x: sx + Math.cos(rAngle) * 0.48, z: sz + Math.sin(rAngle) * 0.48 };
          const outerP = { x: sx + Math.cos(rAngle) * 1.55, z: sz + Math.sin(rAngle) * 1.55 };
          const diamond = getRhombus(innerP, outerP, 0.42);
          addTile(diamond, 1);
        }

        addSpiralTendril(sx, sz, 0.85, angle);
      }

      for (let k = 0; k < 8; k++) {
        const a1 = (k * Math.PI * 2) / 8 + Math.PI / 8;
        const a2 = ((k + 1) * Math.PI * 2) / 8 + Math.PI / 8;
        const midA = (a1 + a2) * 0.5;
        const pA = { x: Math.cos(midA) * 2.7, z: Math.sin(midA) * 2.7 };
        const pB = { x: Math.cos(midA) * 4.6, z: Math.sin(midA) * 4.6 };
        const bridge = getRhombus(pA, pB, 0.8);
        addTile(bridge, 0);
      }

      // Layer 2: 16 Stars
      const rRing2 = 6.8;
      for (let k = 0; k < 16; k++) {
        const angle = (k * Math.PI * 2) / 16;
        const sx = Math.cos(angle) * rRing2;
        const sz = Math.sin(angle) * rRing2;
        const star = getOctagram(sx, sz, 0.85, 0.38, angle);
        addTile(star, k % 3 === 0 ? 2 : 1);

        const pIn = { x: sx - Math.cos(angle) * 0.4, z: sz - Math.sin(angle) * 0.4 };
        const pOut = { x: sx + Math.cos(angle) * 1.25, z: sz + Math.sin(angle) * 1.25 };
        const diamond = getRhombus(pIn, pOut, 0.45);
        addTile(diamond, 0);

        if (k % 2 === 0) {
          addSpiralTendril(sx, sz, 0.65, angle + Math.PI * 0.25);
        }
      }

      // Layer 3: 32 Outer Rosettes
      const rRing3 = 10.5;
      for (let k = 0; k < 32; k++) {
        const angle = (k * Math.PI * 2) / 32;
        const sx = Math.cos(angle) * rRing3;
        const sz = Math.sin(angle) * rRing3;
        const star = getOctagram(sx, sz, 0.62, 0.28, angle);
        addTile(star, k % 2 === 0 ? 1 : 2);

        const midA = angle + Math.PI / 32;
        const p1 = { x: Math.cos(midA) * 9.5, z: Math.sin(midA) * 9.5 };
        const p2 = { x: Math.cos(midA) * 11.6, z: Math.sin(midA) * 11.6 };
        const lozenge = getRhombus(p1, p2, 0.38);
        addTile(lozenge, 0);
      }

      // Layer 4: 64 Border Guilloche Segments
      const outerSegments = 64;
      const rBorderIn = 12.5;
      const rBorderMid = 13.6;
      const rBorderOut = 14.8;

      for (let i = 0; i < outerSegments; i++) {
        const a1 = (i * Math.PI * 2) / outerSegments;
        const a2 = ((i + 1) * Math.PI * 2) / outerSegments;

        const b1 = [
          { x: Math.cos(a1) * rBorderIn, z: Math.sin(a1) * rBorderIn },
          { x: Math.cos(a2) * rBorderIn, z: Math.sin(a2) * rBorderIn },
          { x: Math.cos(a2) * rBorderMid, z: Math.sin(a2) * rBorderMid },
          { x: Math.cos(a1) * rBorderMid, z: Math.sin(a1) * rBorderMid }
        ];
        addTile(b1, i % 2 === 0 ? 1 : 0);

        const b2 = [
          { x: Math.cos(a1) * rBorderMid, z: Math.sin(a1) * rBorderMid },
          { x: Math.cos(a2) * rBorderMid, z: Math.sin(a2) * rBorderMid },
          { x: Math.cos(a2) * rBorderOut, z: Math.sin(a2) * rBorderOut },
          { x: Math.cos(a1) * rBorderOut, z: Math.sin(a1) * rBorderOut }
        ];
        addTile(b2, 2);
      }

      function addSpiralTendril(cx, cz, scale, rot) {
        const steps = 14;
        let prevPt = null;
        for (let s = 0; s <= steps; s++) {
          const t = s / steps;
          const theta = rot + t * Math.PI * 2.2;
          const r = scale * 0.15 + scale * 0.75 * Math.pow(t, 1.3);
          const px = cx + Math.cos(theta) * r;
          const pz = cz + Math.sin(theta) * r;
          const curPt = { x: px, z: pz };
          if (prevPt) {
            addRibbonEdge(prevPt, curPt, 0.028);
          }
          prevPt = curPt;
        }
      }

      const lineGeom = new THREE.BufferGeometry();
      lineGeom.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
      lineGeom.setAttribute('normal', new THREE.Float32BufferAttribute(lineNormals, 3));
      lineGeom.setAttribute('aRadialDist', new THREE.Float32BufferAttribute(lineRadials, 1));
      lineGeom.setAttribute('aAngle', new THREE.Float32BufferAttribute(lineAngles, 1));
      const lineMesh = new THREE.Mesh(lineGeom, lineMaterial);
      arabesqueGroup.add(lineMesh);

      const cellGeom = new THREE.BufferGeometry();
      cellGeom.setAttribute('position', new THREE.Float32BufferAttribute(cellPositions, 3));
      cellGeom.setAttribute('normal', new THREE.Float32BufferAttribute(cellNormals, 3));
      cellGeom.setAttribute('aRadialDist', new THREE.Float32BufferAttribute(cellRadials, 1));
      cellGeom.setAttribute('aAngle', new THREE.Float32BufferAttribute(cellAngles, 1));
      cellGeom.setAttribute('aCellType', new THREE.Float32BufferAttribute(cellTypes, 1));
      const cellMesh = new THREE.Mesh(cellGeom, cellMaterial);
      arabesqueGroup.add(cellMesh);

      const glowDiscGeom = new THREE.CircleGeometry(15.0, 64);
      glowDiscGeom.rotateX(-Math.PI / 2);
      const glowDiscMat = new THREE.MeshBasicMaterial({
        color: new THREE.Color(params.glowColor),
        transparent: true,
        opacity: 0.14,
        side: THREE.DoubleSide
      });
      const glowDisc = new THREE.Mesh(glowDiscGeom, glowDiscMat);
      glowDisc.position.y = -0.05;
      arabesqueGroup.add(glowDisc);

      motesGeom = new THREE.BufferGeometry();
      const motesPos = new Float32Array(motesCount * 3);
      for (let i = 0; i < motesCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const rad = 0.5 + Math.random() * 14.5;
        const mx = Math.cos(angle) * rad;
        const mz = Math.sin(angle) * rad;
        motesPos[i * 3 + 0] = mx;
        motesPos[i * 3 + 1] = getDomeY(mx, mz, H) + 0.15 + Math.random() * 2.8;
        motesPos[i * 3 + 2] = mz;
      }
      motesGeom.setAttribute('position', new THREE.BufferAttribute(motesPos, 3));
      motesMat = new THREE.PointsMaterial({
        color: new THREE.Color(params.lineColor),
        size: 0.08,
        transparent: true,
        opacity: 0.65,
        blending: THREE.AdditiveBlending
      });
      motesPoints = new THREE.Points(motesGeom, motesMat);
      arabesqueGroup.add(motesPoints);
    }

    buildArabesqueGeometry();

    // -------------------------------------------------------------
    // COLOR UPDATE & TRANSITION SYSTEM
    // -------------------------------------------------------------
    function updateColorsInstant() {
      sharedUniforms.uLineColor.value.set(params.lineColor);
      sharedUniforms.uCellPrimary.value.set(params.cellPrimary);
      sharedUniforms.uCellSecondary.value.set(params.cellSecondary);
      sharedUniforms.uCellAccent.value.set(params.cellAccent);
      sharedUniforms.uInnerGlowColor.value.set(params.glowColor);

      lineMaterial.color.set(params.lineColor);
      lineMaterial.metalness = params.lineMetalness;
      lineMaterial.roughness = params.lineRoughness;

      cellMaterial.color.set(params.cellPrimary);
      cellMaterial.roughness = params.cellRoughness;

      if (motesMat) motesMat.color.set(params.lineColor);

      if (params.greenscreen) {
        scene.background.set("#00ff00");
      } else {
        scene.background.set(params.bgColor);
      }
    }

    function applyColorScheme(schemeName, duration = 0.9) {
      const scheme = COLOR_SCHEMES[schemeName];
      if (!scheme) return;

      params.colorScheme = schemeName;

      if (duration === 0) {
        params.lineColor = scheme.lineColor;
        params.cellPrimary = scheme.primaryColor;
        params.cellSecondary = scheme.secondaryColor;
        params.cellAccent = scheme.accentColor;
        params.glowColor = scheme.glowColor;
        params.bgColor = scheme.bgColor;
        params.lineMetalness = scheme.lineMetalness;
        params.lineRoughness = scheme.lineRoughness;
        params.cellRoughness = scheme.cellRoughness;
        updateColorsInstant();
        updateSceneGuiControllers();
        return;
      }

      const start = {
        line: new THREE.Color(params.lineColor),
        p: new THREE.Color(params.cellPrimary),
        s: new THREE.Color(params.cellSecondary),
        a: new THREE.Color(params.cellAccent),
        glow: new THREE.Color(params.glowColor),
        bg: new THREE.Color(params.bgColor)
      };

      const end = {
        line: new THREE.Color(scheme.lineColor),
        p: new THREE.Color(scheme.primaryColor),
        s: new THREE.Color(scheme.secondaryColor),
        a: new THREE.Color(scheme.accentColor),
        glow: new THREE.Color(scheme.glowColor),
        bg: new THREE.Color(scheme.bgColor)
      };

      const anim = { t: 0 };
      gsap.to(anim, {
        t: 1,
        duration: duration,
        ease: "power2.out",
        onUpdate: () => {
          const curLine = start.line.clone().lerp(end.line, anim.t);
          const curP = start.p.clone().lerp(end.p, anim.t);
          const curS = start.s.clone().lerp(end.s, anim.t);
          const curA = start.a.clone().lerp(end.a, anim.t);
          const curGlow = start.glow.clone().lerp(end.glow, anim.t);
          const curBg = start.bg.clone().lerp(end.bg, anim.t);

          params.lineColor = "#" + curLine.getHexString();
          params.cellPrimary = "#" + curP.getHexString();
          params.cellSecondary = "#" + curS.getHexString();
          params.cellAccent = "#" + curA.getHexString();
          params.glowColor = "#" + curGlow.getHexString();
          params.bgColor = "#" + curBg.getHexString();

          updateColorsInstant();
          updateSceneGuiControllers();
        }
      });
    }

    // -------------------------------------------------------------
    // RANDOM PROCEDURAL VARIATION ON CLICK
    // Note: Per user instruction, PostProcessor settings are strictly
    // PRESERVED and NEVER shuffled or changed during scene randomization!
    // -------------------------------------------------------------
    function triggerProceduralRandomization() {
      const keys = Object.keys(COLOR_SCHEMES);
      const randKey = keys[Math.floor(Math.random() * keys.length)];
      applyColorScheme(randKey, 0.85);

      const targetHeight = 1.4 + Math.random() * 2.2;
      const targetAmp = 0.12 + Math.random() * 0.28;
      const targetWaveFreq = 0.9 + Math.random() * 1.5;
      const targetGlintSpeed = 0.9 + Math.random() * 1.8;
      const targetGlowIntensity = 0.6 + Math.random() * 1.2;

      gsap.to(params, {
        domeHeight: targetHeight,
        breathingAmp: targetAmp,
        waveFreq: targetWaveFreq,
        glintSpeed: targetGlintSpeed,
        innerGlowIntensity: targetGlowIntensity,
        duration: 1.0,
        ease: "power2.out",
        onUpdate: () => {
          sharedUniforms.uDomeHeight.value = params.domeHeight;
          sharedUniforms.uBreathingAmp.value = params.breathingAmp;
          sharedUniforms.uWaveFreq.value = params.waveFreq;
          sharedUniforms.uGlintSpeed.value = params.glintSpeed;
          sharedUniforms.uInnerGlowIntensity.value = params.innerGlowIntensity;
          centerPointLight.position.y = params.domeHeight + 0.6;
          updateSceneGuiControllers();
        },
        onComplete: () => {
          buildArabesqueGeometry();
        }
      });
    }

    function setupInteractionListeners() {
      let downPos = { x: 0, y: 0, t: 0 };

      renderer.domElement.addEventListener('pointerdown', (e) => {
        downPos.x = e.clientX;
        downPos.y = e.clientY;
        downPos.t = performance.now();
      });

      renderer.domElement.addEventListener('pointerup', (e) => {
        const dx = e.clientX - downPos.x;
        const dy = e.clientY - downPos.y;
        const dt = performance.now() - downPos.t;
        if (Math.hypot(dx, dy) < 6 && dt < 320) {
          if (params.clickToRandomize) {
            triggerProceduralRandomization();
          }
        }
      });
    }

    // -------------------------------------------------------------
    // LIL-GUI SETUP
    // -------------------------------------------------------------
    const gui = new GUI({ title: "Arabesque Controls" });

    // Presets & Modes
    const fPreset = gui.addFolder("Themes & Modes");
    fPreset.add(params, "colorScheme", Object.keys(COLOR_SCHEMES)).name("Color Scheme").onChange(v => applyColorScheme(v));
    fPreset.add(params, "animationMode", [
      "Celestial Orbit",
      "Static (No camera move)",
      "Meditative Float",
      "Zenith Mandala",
      "Vault Inspection",
      "Golden Horizon",
      "Radial Swell",
      "Sacred Spiral"
    ]).name("Animation Mode");
    fPreset.add(params, "greenscreen").name("Greenscreen (#00ff00)").onChange(v => {
      scene.background.set(v ? "#00ff00" : params.bgColor);
    });
    fPreset.add(params, "clickToRandomize").name("Click to Randomize");

    // Colors & Surface
    const fColor = gui.addFolder("Colors & Surface Inlay");
    fColor.addColor(params, "lineColor").name("Golden Lines").onChange(updateColorsInstant);
    fColor.addColor(params, "cellPrimary").name("Primary Cell").onChange(updateColorsInstant);
    fColor.addColor(params, "cellSecondary").name("Secondary Cell").onChange(updateColorsInstant);
    fColor.addColor(params, "cellAccent").name("Accent Cell").onChange(updateColorsInstant);
    fColor.addColor(params, "glowColor").name("Inner Glow").onChange(updateColorsInstant);
    fColor.addColor(params, "bgColor").name("Background").onChange(v => {
      if (!params.greenscreen) scene.background.set(v);
    });
    fColor.add(params, "lineMetalness", 0.0, 1.0, 0.01).name("Line Metalness").onChange(v => lineMaterial.metalness = v);
    fColor.add(params, "lineRoughness", 0.0, 1.0, 0.01).name("Line Roughness").onChange(v => lineMaterial.roughness = v);
    fColor.add(params, "cellRoughness", 0.0, 1.0, 0.01).name("Cell Roughness").onChange(v => cellMaterial.roughness = v);
    fColor.add(params, "innerGlowIntensity", 0.0, 3.0, 0.05).name("Inner Glow Intensity").onChange(v => sharedUniforms.uInnerGlowIntensity.value = v);

    // Geometry & Waves
    const fMotion = gui.addFolder("Geometry & Wave Dynamics");
    fMotion.add(params, "animationSpeed", 0.0, 3.0, 0.05).name("Animation Speed").onChange(v => sharedUniforms.uAnimationSpeed.value = v);
    fMotion.add(params, "domeHeight", 0.5, 4.5, 0.05).name("Dome Elevation").onChange(v => {
      sharedUniforms.uDomeHeight.value = v;
      centerPointLight.position.y = v + 0.6;
      buildArabesqueGeometry();
    });
    fMotion.add(params, "breathingAmp", 0.0, 0.6, 0.01).name("Breathing Wave Amp").onChange(v => sharedUniforms.uBreathingAmp.value = v);
    fMotion.add(params, "waveFreq", 0.4, 3.5, 0.05).name("Wave Frequency").onChange(v => sharedUniforms.uWaveFreq.value = v);
    fMotion.add(params, "glintSpeed", 0.1, 4.0, 0.1).name("Glint Speed").onChange(v => sharedUniforms.uGlintSpeed.value = v);
    fMotion.add(params, "glintIntensity", 0.0, 4.0, 0.1).name("Glint Intensity").onChange(v => sharedUniforms.uGlintIntensity.value = v);

    // Lighting & Exposure
    const fLight = gui.addFolder("Lighting & Exposure");
    fLight.add(params, "exposure", 0.1, 3.0, 0.05).name("Scene Exposure").onChange(v => {
      if (postProcessor) postProcessor.settings.exposure = v;
    });

    const fAmb = fLight.addFolder("Ambient Light");
    fAmb.addColor(params, "ambientColor").name("Color").onChange(c => ambientLight.color.set(c));
    fAmb.add(params, "ambientIntensity", 0.0, 3.0, 0.05).name("Intensity").onChange(v => ambientLight.intensity = v);
    fAmb.close();

    const fKey = fLight.addFolder("Key Light (Sun / Gold)");
    fKey.addColor(params, "keyColor").name("Color").onChange(c => keyLight.color.set(c));
    fKey.add(params, "keyIntensity", 0.0, 6.0, 0.1).name("Intensity").onChange(v => keyLight.intensity = v);
    fKey.add(params, "keyPosX", -25, 25, 0.5).name("Pos X").onChange(v => keyLight.position.x = v);
    fKey.add(params, "keyPosY", 0, 35, 0.5).name("Pos Y").onChange(v => keyLight.position.y = v);
    fKey.add(params, "keyPosZ", -25, 25, 0.5).name("Pos Z").onChange(v => keyLight.position.z = v);
    fKey.close();

    const fFill = fLight.addFolder("Fill Light (Sapphire Rim)");
    fFill.addColor(params, "fillColor").name("Color").onChange(c => fillLight.color.set(c));
    fFill.add(params, "fillIntensity", 0.0, 6.0, 0.1).name("Intensity").onChange(v => fillLight.intensity = v);
    fFill.add(params, "fillPosX", -25, 25, 0.5).name("Pos X").onChange(v => fillLight.position.x = v);
    fFill.add(params, "fillPosY", 0, 35, 0.5).name("Pos Y").onChange(v => fillLight.position.y = v);
    fFill.add(params, "fillPosZ", -25, 25, 0.5).name("Pos Z").onChange(v => fillLight.position.z = v);
    fFill.close();

    const fCenter = fLight.addFolder("Dome Center Jewel Light");
    fCenter.addColor(params, "centerLightColor").name("Color").onChange(c => centerPointLight.color.set(c));
    fCenter.add(params, "centerLightIntensity", 0.0, 10.0, 0.1).name("Intensity").onChange(v => centerPointLight.intensity = v);
    fCenter.add(params, "centerLightDistance", 5, 50, 1).name("Distance").onChange(v => centerPointLight.distance = v);
    fCenter.close();

    // Attach PostProcessor Controls to lil-gui
    const sceneFolders = [fPreset, fColor, fMotion, fLight];
    let fPost = null;
    if (postProcessor) {
      fPost = postProcessor.attachGUI(gui, "Post Processing");
    }

    // Helper to only update scene GUI controllers without touching PostProcessor controllers
    function updateSceneGuiControllers() {
      sceneFolders.forEach(f => {
        f.controllersRecursive().forEach(c => c.updateDisplay());
      });
    }

    // Display & Renderer
    const fSystem = gui.addFolder("Display & Renderer");
    fSystem.add(params, "dpr", 0.5, 3.0, 0.1).name("Pixel Ratio (DPR)").onChange(v => {
      renderer.setPixelRatio(v);
      if (postProcessor) postProcessor.setSize(window.innerWidth, window.innerHeight, v);
    });
    fSystem.add(params, "antialias").name("Antialiasing").onChange(v => {
      params.antialias = v;
      if (postProcessor) postProcessor.setAntialias(v);
    });

    // Toggle UI visibility with "H" key
    window.addEventListener("keydown", (e) => {
      if (e.key === "h" || e.key === "H") {
        if (gui.domElement.style.display === "none") {
          gui.show(true);
          gui.domElement.style.display = "";
        } else {
          gui.show(false);
          gui.domElement.style.display = "none";
        }
      }
    });

    // -------------------------------------------------------------
    // NON-DESTRUCTIVE CAMERA ANIMATION & INTERACTION LOOP
    // -------------------------------------------------------------
    const clock = new THREE.Clock();
    let baseTargetY = 0.8;

    function guidePolarAngle(targetAngle, speed = 0.02) {
      const currentPolar = controls.getPolarAngle();
      const diff = targetAngle - currentPolar;
      if (Math.abs(diff) > 0.015) {
        const d = camera.position.distanceTo(controls.target);
        const az = controls.getAzimuthalAngle();
        const newPolar = currentPolar + diff * speed * params.animationSpeed;
        const sinP = Math.sin(newPolar);
        const cosP = Math.cos(newPolar);
        camera.position.x = controls.target.x + d * sinP * Math.sin(az);
        camera.position.y = controls.target.y + d * cosP;
        camera.position.z = controls.target.z + d * sinP * Math.cos(az);
      }
    }

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const elapsed = clock.getElapsedTime();

      sharedUniforms.uTime.value = elapsed;

      // Animate glint orb light tracing an 8-lobed rosette path
      const rosetteR = 3.2 + 2.4 * Math.sin(elapsed * 0.8 * params.animationSpeed);
      const rosetteA = elapsed * 0.9 * params.animationSpeed;
      glintOrbLight.position.x = Math.cos(rosetteA) * rosetteR;
      glintOrbLight.position.z = Math.sin(rosetteA) * rosetteR;
      glintOrbLight.position.y = getDomeY(glintOrbLight.position.x, glintOrbLight.position.z) + 0.35;

      // Subtle motes drift
      if (motesGeom) {
        const positions = motesGeom.attributes.position.array;
        for (let i = 0; i < motesCount; i++) {
          positions[i * 3 + 1] += Math.sin(elapsed * 1.5 + i) * 0.003;
        }
        motesGeom.attributes.position.needsUpdate = true;
      }

      // Camera animation modes (never lock out user wheel zoom or drag angles)
      switch (params.animationMode) {
        case "Static (No camera move)":
          controls.autoRotate = false;
          controls.target.set(0, baseTargetY, 0);
          break;

        case "Celestial Orbit":
          controls.autoRotate = true;
          controls.autoRotateSpeed = 0.55 * params.animationSpeed;
          controls.target.set(0, baseTargetY, 0);
          break;

        case "Meditative Float":
          controls.autoRotate = true;
          controls.autoRotateSpeed = 0.35 * params.animationSpeed;
          controls.target.y = baseTargetY + Math.sin(elapsed * 0.6 * params.animationSpeed) * 0.22;
          break;

        case "Zenith Mandala":
          controls.autoRotate = true;
          controls.autoRotateSpeed = 0.28 * params.animationSpeed;
          guidePolarAngle(0.38, 0.02);
          break;

        case "Vault Inspection":
          controls.autoRotate = true;
          controls.autoRotateSpeed = 0.45 * params.animationSpeed;
          guidePolarAngle(1.08, 0.02);
          break;

        case "Golden Horizon":
          controls.autoRotate = true;
          controls.autoRotateSpeed = 0.4 * params.animationSpeed;
          guidePolarAngle(1.38, 0.02);
          break;

        case "Radial Swell":
          controls.autoRotate = true;
          controls.autoRotateSpeed = 0.3 * params.animationSpeed;
          const pulse = 1.0 + Math.sin(elapsed * 1.1 * params.animationSpeed) * 0.0006;
          camera.position.sub(controls.target).multiplyScalar(pulse).add(controls.target);
          break;

        case "Sacred Spiral":
          controls.autoRotate = true;
          controls.autoRotateSpeed = 0.75 * params.animationSpeed;
          controls.target.y = baseTargetY + Math.sin(elapsed * 0.9 * params.animationSpeed) * 0.3;
          break;
      }

      controls.update();

      // Render through PostProcessor pipeline
      if (postProcessor) {
        postProcessor.renderScene(scene, camera);
      } else {
        renderer.render(scene, camera);
      }
    }

    animate();

    // Window resize handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      if (postProcessor) {
        postProcessor.setSize(window.innerWidth, window.innerHeight, params.dpr);
      }
    });
  </script>
</body>
</html>
